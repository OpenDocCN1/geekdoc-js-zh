- md: "## Operator precedence.\n\n* / %\n\n+ -\n\n<< >> <= >=\n\n1. **2** (High Priority)\n\
    2. **3**\n3. **4** (Low Priority)\n\nHIGH PRIORITY ... LOW PRIORITY\n\n| | | |\n\
    |---|---|---|\n| Multiplication | Addition | Bit shifting |\n| Division | Subtraction\
    \ | Comparison |\n| Modulo | | |\n\nOperator precedence determines the order in\
    \ which operators are evaluated. Operators with greater precedence are evaluated\
    \ first, just as in mathematics. By taking a look at the order of operations in\
    \ arithmetic, we realize that exponents and roots go before multiplication and\
    \ division, which have precedence over addition and subtraction.\n\n```\n4 + 6\
    \ * 2    //returns 16.\n```\n\n## Exercise: 13 Precedence.\n\nPROBLEM: Modify\
    \ the code so that the result is 10.5\n\n```\nvar result = 33 -12 / 2;\ndocument.write(result);\n\
    //27\n```\n\nANSWER: [jsvisually.com/13.html](http://jsvisually.com/13.html)\n\
    \n## Statements.\n\n```\n//this is one long statement\ndocument.getElementById(\"\
    bold\").innerHTML = \"My text\";\n\n//control flow(conditional) statements\nif\
    \ (true) {\n    x = 8;    //{ x = 8; } is a block statement\n}\nelse {\n    x\
    \ = 6;\n}\n```\n\n## JavaScript is case sensitive\n\n```\n//JavaScript is case\
    \ sensitive\n//these variables are completely different\nvar myApple = \"red\"\
    ;\nvar myapple = \"red\";\nvar MyApple = \"red\";\n```\n\n## White space\n\n```\n\
    //JavaScript ignores multiple spaces and tabs\n//those are the same. The first\
    \ space is required\nvarwhiteSpace =\"empty\";\nvar                    whiteSpace\
    \                    =                            \"empty\";\n//white spaces are\
    \ preserved in strings\nvar strings = \"preservemyformat\";\n```\n\n## Code blocks\n\
    \n```\n//functions are examples of code blocks\n//or any group of statements delimited\
    \ by braces\nfunction myFunction () {\n    var a = 3;\n    alert (\"my group\"\
    \ + a);\n}\n```\n\nStatements are commands that are executed one by one in the\
    \ same order they are written, unless they are conditional statements. We have\
    \ been using them for a while and they are separated by semicolon. So, even declaring\
    \ and assigning a value to a variable is a statement on its own.\n\nJavaScript\
    \ statements can be grouped together into blocks by using curly brackets. You\
    \ will often see this in functions, and control flow statements.\n\n```\nwhile\
    \ (x < 10) {\n    x++;\n}\n```\n\nJavaScript does not have block scope. Instead,\
    \ the scope is the same as the function or script that precedes it. This is very\
    \ important because they do not introduce a scope, so if you use the same variable\
    \ name thinking that they have different scopes, then your script will have bugs.\
    \ While standalone block statements are allowed, they do not do what you would\
    \ normally expect, and thus, you might just write your statements without them.\n\
    \n```\nvar x = 1;\n{\n    var x = 2;\n}\nalert(x);    // outputs 2\n```\n\nHere\
    \ the block statement is interfering with the code outside, which is why the output\
    \ is 2 instead of 1.\n\nThe Conditional statements are the ones that run only\
    \ when their condition is met. More details on that will follow in a later chapter.\n\
    \nAnother type of statement is the Exception Handling. They are used to work around\
    \ with exceptions by using the *throw* statement and then handling them with the\
    \ try ... *catch* statement.\n\nWhen you throw an exception, you specify the expression\
    \ containing the value to be thrown. Also, you can throw any expression, string,\
    \ number, Boolean, and even functions!\n\n```\nthrow \"Error2\"; //String type\n\
    throw 42; //Number type\nthrow true; //Boolean type\nthrow {toString: function()\
    \ { return \"I'm an object!\"; } };\n```\n\nThe *try ... catch* statement is a\
    \ peculiar one. It marks a block of statements to try, and then you can specify\
    \ one or more responses in case an exception is thrown. If that is the case, then\
    \ the catch statement catches it. This is the best way to control your code for\
    \ now exceptions.\n\n```\ntry {\n  throw \"myException\" // generates an exception\n\
    }\ncatch (e) {\n  // statements to handle any exceptions\n  logMyErrors(e) //\
    \ pass exception object to error handler\n}\n```\n\nThe *finally* block is the\
    \ last part, which is in charge of executing statements after the try and catch,\
    \ but before the rest of the statements of your program or script. The finally\
    \ block will be executed even if there is no catch block. Basically, the finally\
    \ is used to make your program or script provide useful information as to why\
    \ it failed, instead of just abruptly crashing.\n\n```\nopenMyFile();\ntry {\n\
    \  writeMyFile(theData); //This may throw an error\n}\ncatch(e) {\n  handleError(e);\
    \ // If we got an error we handle it\n}\nfinally {\n  closeMyFile(); // always\
    \ close the resource\n}\n```\n\n## Exercise: 14 Statements.\n\nPROBLEM: Write\
    \ a statement that has a case sensitive variable name containing a string with\
    \ many white spaces\n\nANSWER: [jsvisually.com/14.html](http://jsvisually.com/14.html)\n\
    \n## Expressions.\n\n## EXPRESSION TYPES\n\n**Arithmetic:** evaluates to a number\n\
    **Logical:** evaluates to true or false\n**String:** evaluates to a character\
    \ string\n**Object:** evaluates to an object\n\nExpressions are sets of literals,\
    \ variables and operators that resolve to a value. So if the line of code gives\
    \ you a value, then it is an expression. There are two types of expressions: those\
    \ that assign a value to a variable and those that simply have a value.\n\n```\n\
    var z = 8;       //First type of expression.\n6 + 2;           // Second type\
    \ of expression.\n```\n\nJavaScript has the four expression categories:\n\n1.\
    \ Arithmetic: They evaluate to a number and generally use arithmetic operators.\n\
    2. String: They evaluate to a character string and generally use string operators.\n\
    3. Logical: They evaluate to an object and normally involve logical operators.\n\
    4. Object: They evaluate to an object.\n\n```\n//Arithmetic expression\nvar a\
    \ = 3;\n//Logical expression\nvar b = true;\n//String expression\nvar c = \"String\"\
    ;\n//Object expression\nvar apple = newApple(\"Machintosh\");\n```\n\n## Exercise:\
    \ 15 Expressions.\n\nPROBLEM: Write an expression that represents the perimeter\
    \ of the rectangle below. The perimeter of any rectangle is the sum of the lengths\
    \ of its sides.\n\na = 5\n\nb = 4\n\nANSWER: [jsvisually.com/15.html](http://jsvisually.com/15.html)\n\
    \n## Strings.\n\nWith the backslash character, I can escape the quote command.\
    \ I'll treat it as a character.\n\nStrings are groups of characters that form\
    \ regular text. To make a string, you can write any set of characters in quotes,\
    \ whether they are single or double quotes.\n\n```\nvar fullName = \"John Doe\"\
    \nvar fullName2 = 'Mary Jane'\n```\n\nIt is also possible to use both -- this\
    \ would be to add quotations inside a string. The only rule for this is that if\
    \ you use one type of quotation for the string, then you must use the second kind\
    \ for the quotation inside the string.\n\n```\nvar question = \"What are 'quotations'?\"\
    \n```\n\nSince strings are so widely used, there are many properties available\
    \ for them. If you need to find the length of a string, then you use the .length\
    \ property, which will return an integer representing the number of characters\
    \ in the string.\nIn case that you must use the same quotation mark, you can use\
    \ the \\ escape character. The backslash escape character can be used to turn\
    \ special characters into a string, and also to insert characters in a string.\n\
    \n```\nvar x = 'It\\'s alright';\nvar y = \"We are the so-called \\\"Vikings\\\
    \" from the north.\"\n```\n\nAs for the special characters we have:\n\n| Code\
    \ | Outputs |\n|---|---|\n| \\' | single quote |\n| \\\" | double quote |\n| \\\
    \\ | backslash |\n| \\n | new line |\n| \\r | carriage return |\n| \\t | tab |\n\
    | \\b | backspace |\n| \\f | form feed |\n\nStrings also have a wide range of\
    \ methods to work with -- you can find the index of a specific character by using\
    \ `charAt()`; you can also split strings into arrays of substrings with `split()`,\
    \ or slice it with `slice()` to obtain a part of a string and turn it into a new\
    \ string.\nYou might have noticed by now that strings share some similarities\
    \ to arrays.\nIn a way you could think of them as arrays of characters strictly."
  mdcn: "\n## 运算符优先级。\n\n* / %\n\n+ -\n\n<< >> <= >=\n\n1.  **2** （高优先级）\n2.  **3**\n\
    3.  **4** （低优先级）\n\n高优先级 ... 低优先级\n\n| | | |\n|---|---|---|\n| 乘法 | 加法 | 位移 |\n\
    | 除法 | 减法 | 比较 |\n| 取模 | | |\n\n运算符优先级决定了运算符的求值顺序。优先级较高的运算符会先被求值，就像在数学中一样。回顾算术中的运算顺序，我们意识到指数和根号运算先于乘法和除法，而乘法和除法又优先于加法和减法。\n\
    \n```\n4 + 6 * 2    //返回 16。\n```\n\n## 练习：13 运算符优先级。\n\n问题：修改代码使结果为 10.5\n\n\
    ```\nvar result = 33 -12 / 2;\ndocument.write(result);\n//27\n```\n\n答案：[jsvisually.com/13.html](http://jsvisually.com/13.html)\n\
    \n## 语句。\n\n```\n//这是一条很长的语句\ndocument.getElementById(\"bold\").innerHTML = \"\
    My text\";\n\n//控制流（条件）语句\nif (true) {\n    x = 8;    //{ x = 8; } 是一个块语句\n}\n\
    else {\n    x = 6;\n}\n```\n\n## JavaScript 区分大小写\n\n```\n//JavaScript 区分大小写\n\
    //这些变量完全不同\nvar myApple = \"red\";\nvar myapple = \"red\";\nvar MyApple = \"red\"\
    ;\n```\n\n## 空白字符\n\n```\n//JavaScript 忽略多个空格和制表符\n//它们是相同的。第一个空格是必需的\nvarwhiteSpace\
    \ =\"empty\";\nvar                    whiteSpace                    =        \
    \                    \"empty\";\n//字符串中的空白字符会被保留\nvar strings = \"preservemyformat\"\
    ;\n```\n\n## 代码块\n\n```\n//函数是代码块的一个例子\n//或者是任何由大括号分隔的语句组\nfunction myFunction\
    \ () {\n    var a = 3;\n    alert (\"my group\" + a);\n}\n```\n\n语句是按编写顺序逐条执行的命令，除非它们是条件语句。我们使用了一段时间，它们用分号分隔。因此，即使是声明并为变量赋值本身也是一条语句。\n\
    \nJavaScript 语句可以使用花括号组合成块。你会经常在函数和控制流语句中看到这种结构。\n\n```\nwhile (x < 10) {\n  \
    \  x++;\n}\n```\n\nJavaScript 没有块级作用域。相反，其作用域与前面的函数或脚本相同。这一点非常重要，因为它们不引入新的作用域，所以如果你使用相同的变量名并认为它们有不同的作用域，那么你的脚本就会出现错误。虽然允许使用独立的块语句，但它们的作用通常不是你期望的，因此，你可能根本不需要使用它们。\n\
    \n```\nvar x = 1;\n{\n    var x = 2;\n}\nalert(x);    // 输出 2\n```\n\n这里的块语句干扰了外部代码，这就是为什么输出是\
    \ 2 而不是 1。\n\n条件语句是仅在其条件满足时才运行的语句。关于这一点的更多细节将在后续章节中介绍。\n\n另一种语句是异常处理。它们用于通过使用\
    \ *throw* 语句来处理异常，然后使用 try ... *catch* 语句来捕获它们。\n\n当你抛出一个异常时，你需要指定包含要抛出值的表达式。此外，你可以抛出任何表达式、字符串、数字、布尔值，甚至函数！\n\
    \n```\nthrow \"Error2\"; //字符串类型\nthrow 42; //数字类型\nthrow true; //布尔类型\nthrow\
    \ {toString: function() { return \"I'm an object!\"; } };\n```\n\n*try ... catch*\
    \ 语句是一个特殊的语句。它标记一个要尝试执行的语句块，然后你可以指定一个或多个在异常抛出时的响应。如果是这种情况，catch 语句就会捕获它。这是目前控制代码以处理异常的最佳方式。\n\
    \n```\ntry {\n  throw \"myException\" // 生成一个异常\n}\ncatch (e) {\n  // 处理任何异常的语句\n\
    \  logMyErrors(e) // 将异常对象传递给错误处理器\n}\n```\n\n*finally* 块是最后一部分，负责在 try 和 catch\
    \ 块之后、但在程序或脚本其余语句之前执行语句。即使没有 catch 块，finally 块也会被执行。基本上，finally 用于让你的程序或脚本提供有关其失败原因的有用信息，而不是简单地突然崩溃。\n\
    \n```\nopenMyFile();\ntry {\n  writeMyFile(theData); //这可能会抛出错误\n}\ncatch(e) {\n\
    \  handleError(e); // 如果我们得到错误，就处理它\n}\nfinally {\n  closeMyFile(); // 始终关闭资源\n\
    }\n```\n\n## 练习：14 语句。\n\n问题：编写一条语句，其中包含一个区分大小写的变量名，该变量名包含一个带有许多空白字符的字符串。\n\n\
    答案：[jsvisually.com/14.html](http://jsvisually.com/14.html)\n\n## 表达式。\n\n## 表达式类型\n\
    \n**算术：** 求值为一个数字\n**逻辑：** 求值为 true 或 false\n**字符串：** 求值为一个字符串\n**对象：** 求值为一个对象\n\
    \n表达式是字面量、变量和运算符的集合，它们求值为一个值。因此，如果一行代码给你一个值，那么它就是一个表达式。表达式有两种类型：一种是将值赋给变量，另一种是简单地拥有一个值。\n\
    \n```\nvar z = 8;       //第一种类型的表达式。\n6 + 2;           // 第二种类型的表达式。\n```\n\n\
    JavaScript 有四种表达式类别：\n\n1.  算术：它们求值为一个数字，通常使用算术运算符。\n2.  字符串：它们求值为一个字符串，通常使用字符串运算符。\n\
    3.  逻辑：它们求值为一个对象（实际上求值为布尔值），通常涉及逻辑运算符。\n4.  对象：它们求值为一个对象。\n\n```\n//算术表达式\nvar\
    \ a = 3;\n//逻辑表达式\nvar b = true;\n//字符串表达式\nvar c = \"String\";\n//对象表达式\nvar\
    \ apple = new Apple(\"Machintosh\");\n```\n\n## 练习：15 表达式。\n\n问题：编写一个表达式，表示下面矩形的周长。任何矩形的周长都是其各边长度之和。\n\
    \na = 5\n\nb = 4\n\n答案：[jsvisually.com/15.html](http://jsvisually.com/15.html)\n\
    \n## 字符串。\n\n通过反斜杠字符，我可以转义引号命令。我会将其视为一个字符。\n\n字符串是构成常规文本的字符组。要创建一个字符串，你可以在引号（单引号或双引号）中编写任何字符集。\n\
    \n```\nvar fullName = \"John Doe\"\nvar fullName2 = 'Mary Jane'\n```\n\n也可以同时使用两种引号——这是为了在字符串内部添加引号。唯一规则是，如果你为字符串使用一种类型的引号，那么字符串内的引号必须使用另一种类型。\n\
    \n```\nvar question = \"What are 'quotations'?\"\n```\n\n由于字符串使用非常广泛，它们有许多可用的属性。如果需要查找字符串的长度，可以使用\
    \ `.length` 属性，它返回一个表示字符串中字符数的整数。\n如果你必须使用相同的引号，可以使用 `\\` 转义字符。反斜杠转义字符可用于将特殊字符转换为字符串，也可以在字符串中插入字符。\n\
    \n```\nvar x = 'It\\'s alright';\nvar y = \"We are the so-called \\\"Vikings\\\
    \" from the north.\"\n```\n\n关于特殊字符，我们有：\n\n| 代码 | 输出 |\n|---|---|\n| \\' | 单引号\
    \ |\n| \\\" | 双引号 |\n| \\\\ | 反斜杠 |\n| \\n | 换行 |\n| \\r | 回车 |\n| \\t | 制表符 |\n\
    | \\b | 退格 |\n| \\f | 换页符 |\n\n字符串还有广泛的方法可以使用——你可以使用 `charAt()` 查找特定字符的索引；你也可以使用\
    \ `split()` 将字符串分割成子字符串数组，或者使用 `slice()` 切割字符串以获取其一部分并转换为新字符串。\n你可能已经注意到字符串与数组有一些相似之处。\n\
    从某种程度上说，你可以严格地将它们视为字符数组。\n"
