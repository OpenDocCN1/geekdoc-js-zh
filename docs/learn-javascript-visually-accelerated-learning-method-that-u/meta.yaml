- md: "## Exercise: 29\nIIFE.\n\nPROBLEM: Add no more than 4 characters to make this\
    \ function self-executing:\n\n```javascript\nfunction selfExecute() {\n    console.log(\"\
    Make me IIFE, please!\");\n}\n```\n\nANSWER: [jsvisually.com/29.html](http://jsvisually.com/29.html)\n\
    \n## Scope.\n\n![img](img/194ade798f439c6944bd1f4979d87181_118_0.png)\n\n![img](img/194ade798f439c6944bd1f4979d87181_118_1.png)\n\
    \nYou have seen the word scope being used widely in this book, and if you have\
    \ not figured its meaning by now, then know this: JavaScript has function-level\
    \ scope. The variables inside a function are invisible to the outside. The local\
    \ scope can “see” the global scope, but the global scope can’t “see” the local\
    \ scope.\n\nIn JavaScript, scope is the set of variables, objects, and functions\
    \ that you have access to. Furthermore, objects and functions are also variables\
    \ in JavaScript.\n\nSince local variables have a local scope, you can only access\
    \ them within the function:\n\n```javascript\n// code here cannot use carName\n\
    function myFunction() {\n  var carName = \"Toyota\";\n  // code here can use carName\n\
    }\n```\n\nHowever, since local variables are recognized only within their local\
    \ scope, you could have variables with the same name used in other functions.\n\
    \nHere we have the same function, but with a global variable:\n\n```javascript\n\
    var carName = \"Volvo\";\n// code here can use carName\nfunction myFunction()\
    \ {\n    // code here can use carName\n}\n```\n\nSomething to keep an eye for\
    \ is the automatically global variables. When you assign a value to a variable\
    \ that has not been declared, it will automatically become global.\n\n```javascript\n\
    // code here can use carName\nfunction myFunction() {\n    carName = \"Volvo\"\
    ;\n    // code here can use carName\n}\n```\n\nThe life cycle of a variable is\
    \ also a part of its scope. JavaScript variables start when it is declared. Local\
    \ variables are deleted when the function is completed, while global ones are\
    \ deleted only when the program or page is closed.\n\n```javascript\n// code here\
    \ can use carName\nfunction myFunction() {\n    carName = \"Volvo\";\n}\n```\n\
    \n## Exercise: 30\nScope.\n\nPROBLEM: The function below is suppose to count 10\
