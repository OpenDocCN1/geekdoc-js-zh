    \n## 声明与初始化。\n\n最简单的记忆方法是将计算机内存想象成盒子，其中声明是你分配给盒子的标签，而初始化是你放入盒子的值。\n\n你可以将计算机内存想象成一个盒子数组。\n\
    \n![](img/194ade798f439c6944bd1f4979d87181_39_0.png)\n\n```javascript\nvar foo\
