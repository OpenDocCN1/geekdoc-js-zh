    7. var $myVAR_ = "Yes";

    ```


    Variables are like labels that identify containers with information, and as the
    name implies, they are able to vary. Variables are used to store information and
    make it easy to reference them by giving them a name. The name given to the variable
    will remain the same, but you can always change the value or information that
    it contains. This means you could have a variable named “price” used to store
    the current price of an item; you could either assign a “null” value, which will
    create an empty variable, or assign any number value.


    It is always in good practice to use descriptive names for your variables to make
    it easy to understand what they are used for in the program. This will come in
    handy for you or anyone else reading your code. It is also very important to use
    valid names for variables.


    +   - Variables should not be enclosed in quotation marks.

    - Variables can’t be a number or start with a number.

    - Variables can’t be any of the JavaScript reserved keywords. However, they might
    contain keywords in the name.

    - Variable names are case sensitive, so one should keep that in mind when'
