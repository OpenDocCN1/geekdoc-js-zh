  md: '![](img/194ade798f439c6944bd1f4979d87181_115_0.png)


    # Remember the mirror frog pattern


    Also known as IIFEs, are self-executing functions that are used to avoid variable
    hoisting and to protect the global space from ''polluting''. This means that IIFE
    provides local scoping and this is why popular libraries like JQuery, BackBone.js
    and others use it to place all library code inside of a local scope.


    The syntax for creating a basic IIFE is the following:


    ```

    1. // Anonymous function

    2. function(){

    3.   // my special code

    4. }();  // The parentheses make sure the anonymous function gets called immediately

    ```


    Basically, it is an anonymous function without a name, since we will not call
    it, that is created and invoked immediately via the parentheses at the very end.


    With wrap the anonymous function inside the parentheses so the JavaScript parses
    knows to treat it as a function expression and not as a function declaration.
    If it is treated as a function declaration, then we will need a name for the function
    to avoid syntax errors, and it will also need to be invoked at some point. Just
    to provide a reminder and make the difference between function expression and
    declaration, check the following:'
  merge: -1
  pgno: 115
- img_proc: true
  md: '+   1. Function Expression - `var test = function() {};`

    2. Function Declaration - `function test() {};`


    Since the function in our IIFE is a function expression and it is not being assigned
    to a global variable, no global properties are being created, and thus, all the
    properties are created locally, so we get local scope.


    Another benefit of IIFE is the reduced scope lookup which provides a small performance
    benefit since we can pass commonly used global objects to an IFFE’s anonymous
    function and then reference them within the IIFE via local scope.


    ```

    1. // Anonymous function that has three arguments

    2. function(window, document, $) {

    3. // You can now reference the window, document, and jQuery objects in a local
    scope

    4. //The global window, document, and jQuery objects are passed into the anonymous
    function

    5. }(window, document, window.jQuery);

    ```


    Since we are able to pass global objects into the anonymous function as local
    parameters, we also gain minification optimization, which is another advantage
    of IIFEs.


    One negative thing that IIFE used to have was readability when you have a lot
    of code inside them. You would have to scroll down all the way if you wanted to
    find the parameters that you are passing into the IIFE.


    The solution is on using a more readable pattern that has become very popular:


    ```

    1. (function (library) {

    2.     // Calls the second IIFE and locally passes in the global jQuery, window,
    and document objects

    3.     library(window, document , window.jQuery);

    4. }

    5. // Locally scoped parameters

    6. (function (window, document, $) {

    7. // Library code goes here

    8. }));

    ```


    This IIFE pattern allows you to see what global objects are being passed into
    the IIFE without having to scroll down all the way to the bottom of the file.'
