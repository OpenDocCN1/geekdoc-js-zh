    \ 初始化y\n```\n\n在上面的示例中，由于变量提升，`y`在使用前已被声明。然而，它的值仍然是`undefined`，因为初始化不会被提升。\n\n\
    由于并非所有开发者都熟悉JavaScript中的变量提升，建议在每个作用域的开头声明所有变量。这个良好的实践将避免许多bug，并且由于这是JavaScript解释代码的方式，因此它是一个很好的准则。\n\
