  - '[PAGE 99]


    For the function hypotenuse(), you get a second function inside called sqrt()
    from the math library. So each time hypotenuse is called, it will also call the
    function sqrt(). However, the function foo has to create a function bar for each
    instance of foo(). One might think that is alright, but this causes unnecessary
    work for the JavaScript engine and wastes CPU cycles when the function is called
    multiple times. Because functions do not change, they always do the same thing
    and it would be best to optimize the code by placing the bar(0 function outside
    foo() and just have foo() call for it when needed, like the hypotenuse() function
    does.


    ```

    1. function foo(a, b) {

    2.     return bar(a, b);

    3. }

    4.

    5. function bar(a, b) {

    6.     return a + b;

    7. }

    8.

    9. foo(1, 2);

    ```


    This new code will be much more efficient, even if the difference is minimal in
    short runs. The big gains are on big computations. Time resources are saved.'
