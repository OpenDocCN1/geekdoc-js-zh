  md: '+   1. Access to the outer function''s variables.

    2. Access to the global variables.


    ```

    1. function showName (firstName, lastName) {

    2.   var nameIntro = "Your name is ";

    3.   // this inner function has access to the outer function''s variables, including
    the parameter

    4.   function makeFullName () {

    5.     return nameIntro + firstName + " " + lastName;

    6.   }

    7.   return makeFullName ()

    8. }

    9. showName ("John", "Doe"); // Your name is John Doe

    ```


    One of the most important features with closures is that the inner function still
    has access to the outer function'' variable, even after the outer function has
    returned. Normally, after a function has returned, its life cycle has ended. Because
    with closures that is not the case, you can call the inner function later in your
    program, even if the outer one has already returned.


    Closures store references to the variables in the outer function; they do not
    store the actual values. Because closures have access to update the values of
    the outer function''s variables, they can lead you to bugs when the variable changes
    due for loops. To avoid this problem, you can simply use an IIFE.'
