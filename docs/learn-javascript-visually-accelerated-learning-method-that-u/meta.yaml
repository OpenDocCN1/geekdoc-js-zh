    1. var pear = new Fruit(''pear'', ''golden'');

    2. console.log(pear.price);

    3. //100

    4. console.log(pear.info());

    5. //I am a golden pear

    6. console.log(pear.cost());

    7. //This pear cost 100

    ```


    If you encounter an object and you need to get its prototype, then you can use
    Object.getPrototypeOf, yet, there is no such thing as Object.setPrototype.'
