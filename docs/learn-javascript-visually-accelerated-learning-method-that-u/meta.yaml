    Array objects have predefined methods, and they are the core of array functionalities
    in JavaScript. These methods will allow you to convert values to string, to add
    or remove values, to shift and many more data manipulation.


    It is easy to remove elements while working with arrays. All you have to do is
    `pop()` them as if they were balloons.


    ```

    1. var colors = ["Blue", "Red", "Orange"];

    2. colors.pop();

    ```


    From that example, you would be removing the last element on the array. If you
    would like to add a new element to the array, then the array method `push()` will
    add the new element to the end of the array.


    ```

    1. colors.push("Yellow");

    ```


    This would make our colors array have the colors blue, red, and yellow, instead
    of just blue and red.


    Now, `pop()` and `push()` methods work at the end of the array, if you want to
    work with the beginning of the array, then you can use the array method `shift()`
    to pop the first element of the array and then shift all the remaining elements
    to the left. The equivalent of pushing to the first element is the array method
    `unshift()` which would add a new element to the beginning of the array.


    A very helpful array method that is often used is `sort()` which sorts the array
    alphabetically. However, when you have an array of numbers, then you have to do
    some extra work to'
