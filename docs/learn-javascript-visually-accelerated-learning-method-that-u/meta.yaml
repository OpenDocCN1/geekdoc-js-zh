    ## 比较运算


    ![](img/194ade798f439c6944bd1f4979d87181_77_0.png)


    比较运算符用于比较（测试）两个值并返回true或false，这取决于基于相等性的查询。

    使用最广泛的比较运算符可能是"等于"（==）运算符。

    它可以用于不同类型的变量，例如：


    - 字符串

    - 数字

    - 带有数学表达式的变量

    - 变量与变量比较


    当你比较字符串时，大小写敏感性很重要！接下来最常用的运算符是"等于"的反义词，即"不等于"（!==），并且它与其对应运算符具有相同的特性。


    以下是在if语句中使用==或!==的有效方式：


    ```

    1. if (fullName == "John" + " " + "Doe") {

