  md: '# Bit operations.


    ![](img/194ade798f439c6944bd1f4979d87181_50_0.png)


    The Bit operators are also a part of the Binary Operators, but they are strictly
    used for logic operations as the ones you would find in discrete mathematics,
    manipulation of bits (zeros and ones) by bitwise operators.


    1. Binary Bitwise Operators (&, ^, |):


    +   - The ~ Operator: Called Bitwise NOT Operator. It is a unary operator and
    operates by reversing all bits in the operand. (~B) is -4.

    - The ^ Operator: Called Bitwise XOR Operator. It performs a Boolean exclusive
    OR operation on each bit of its integer arguments. Exclusive OR means that either
    operand one is true or operand two is true, but not both. (A ^ B) is 1.

    - The | Operator: Called Bitwise OR Operator. It performs a Boolean OR operation
    on each bit of its integer arguments. (A | B) is 3.

    - The & Operator: Called Bitwise AND operator. It performs a Boolean AND operation
    on each bit of its integer arguments. (A & B) is 2.


    2. Binary Logical Operators (&&, ||, !):


    +   - The && Operator: Called Logical AND operator. If both the operands are non-zero,
    then the condition becomes true. (A && B) is true.

    - The || Operator: Called Logical OR Operator. If any of the two operands are
    non-zero, then the condition becomes true. (A || B) is true.

    - The ! Operator: Called Logical NOT Operator. Use to reverse the logical state
    of its operand. If a condition is true, then Logical NOT operator will make false.
    !(A && B) is false.'
