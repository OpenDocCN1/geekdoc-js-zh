  md: '# # Where do I put JavaScript?


    Since JavaScript is used on websites, you would think you can just put it anywhere
    in the code of your site. Well, not quite.


    You can add it in between the head tags `<head></head>`, and also on the body
    tags `<body></body>`.


    It is very important to keep in mind that any JavaScript code must be enclosed
    by the script tag `<script></script>`.


    Furthermore, you can also add scripts located anywhere else on the server, client,
    or even web, as long as you provide the clear path. These are known as external
    scripts. They are very handy when you have to reuse the same script on different
    sites.


    All you have to do is place them somewhere where other sites can access and link
    to them.


    The following code shows examples of where to put JavaScript code, and how to
    use both, internal and external code.


    Just remember that they have to be in the scope of the script tags for them to
    work properly. The code will create a pop-up window every time you visit the site.
    It is very useful for providing important information to the user before anything
    else.


    ```

    1. <!DOCTYPE html>

    2. <html>

    3.    <head>

    4.      <title>My Title</title>

    5. <script type="text/javascript"> alert("It''s best if I sit low.");</script>  <!--embed
    script-->

    6. </head>

