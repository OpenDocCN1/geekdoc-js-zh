- md: '## Unary operators.


    Operators that require *single* operand


    **a++, a--** take the value then add/subtract 1


    **++a, --a** add/subtract 1 then take the value


    **!a** logical opposite of **a**


    **+a, -a** positive/negative value of **a**


    Unary operators require a single operand. They are easy to recognize as the format
    is the same as an operand and an operator.


    Operand: It is the quantity on which an operation is to be done – basically, the
    variable.


    Operator: It is the action that will be taken upon the operand.


    The most common unary operators are: a++, a--; which take the value and then add/subtract
    1 to it and assigns it back to the variable. Similar to a = a + 1; or a = a –
    1;


    * ++a, --a; which adds/subtract 1 then take the value.

    * !a; which takes the logical opposite of a.

    * +a, -a; which takes the positive/negative of a value.


    The ++ is also known as the increment operator while the -- is known as the decrement
    operator.


    One source of confusion with unary operators is the postfix (a++) and prefix (--a)
    increment or decrement operators. The following code will help you understand
    the difference which is crucial on loops, but not so noticeable outside of loops.


    ```

    1. var a = 4;

    2. var b = a++; //First b will be 4, then it will be changed to 5. JavaScript
    works from left to right.

    3. //now a has a value of 5.

    4. var c = ++a; //First a will be 6, then c will be assigned to 6

    ```


    ## Exercise: 10

    ### Unary operators.


    PROBLEM: Using an unary operator, increase the value of a variable ''a''


    OUTPUT: "The value of ''a'' is: 11"


    ANSWER: [jsvisually.com/10.html](http://jsvisually.com/10.html)


    ## Binary operators.


    ## +, -, *, /, % Arithmetic Operators


    ## =, *=, /=, %=, +=, -=, <<=, >>=, >>>=, &=, ^=, |= Assignment Operators


    ## &, |, ^, ~, <<, >>, >>> Bitwise Operators


    ## ==, !=, ===, !==, >, >=, <, <= Comparison Operators


    ## &&, ||, ! Logical Operators


    Binary operations are the most common and abundant of all JavaScript operators.
    You might not be familiar with all those symbols, so the following will be a brief
    explanation of some of the most used ones for your convenience.


    Assume that A has a value of 10 and B has a value of 20.


    ## 1. Arithmetic Operators


    The * Operator: Multiplies both operands. A * B will give 200


    The / Operator: Divide numerator by denominator. B / A will give 2


    The % Operator: Modulus Operator and remainder of after an integer division. B
    % A will give 0


    The Addition operator (+): Adds two operands. A + B will give 30.


    The Subtraction Operator (-): Subtracts second operand from the first. A - B will
    give -10


    ## 2. Assignment Operators


    The = Operator: Simple assignment operator; Assigns values from right side operands
    to the left side operand. C = A + B will assign the value of A + B into C.


    The *= Operator: Multiply AND assignment operator; it multiplies the right operand
    with the left operand and assign the result to the left operand. C *= A is equivalent
    to C = C * A.


    The /= Operator: Divides AND assignment operator; It divides left operand with
    the right operand and assigns the result to the left operand. C /= A is equivalent
    to C = C / A.


    The %= Operator: Modulus AND assignment operator; It takes modulus by using two
    operands and assign the result to the left operand. C %= A is equivalent to C
    = C % A.


    The += Operator: Adds AND assignment operator; It adds the right operand to the
    left operand and assign the result to the left operand. C += A is equivalent to
    C = C + A.


    The -= Operator: Subtracts AND assignment operator; It subtracts right operand
    from the left operand and assign the result to the left operand. C -= A is equivalent
    to C = C – A.


    ## 3. Bitwise Shift Operators


    The Left Shift Operator (<<): It moves all bits in its first operand to the left
    by the number of places specified in the second operand. New bits are filled with
    zeros. Shifting a value left by one position is equivalent to multiplying by 2,
    shifting two positions is equivalent to multiplying by 4, etc. (A << 1) is 4.


    The Signed Right Shift Operator (>>): It moves all bits in its first operand to
    the right by the number of places specified in the second operand. The bits filled
    in on the left depend on the sign bit of the original operand, in order to preserve
    the sign of the result. If the first operand is positive, the result has zeros
    placed in the high bits; if the first operand is negative, the result has ones
    placed in the high bits.


    Shifting a value right one place is equivalent to dividing by 2 (discarding the
    remainder), shifting right two places is equivalent to integer division by 4,
    and so on. (A >> 1) is 1.


    The Unsigned Right Shift Operator (>>>): This operator is just like the >> operator,
    except that the bits shifted in on the left are always zero. (A >>> 1) is 1.


    ## 4. Comparison Operators or Relational Operators


    The Less-than Operator (<): Checks if the value of left an operand is greater
    than the value of the right operand; if yes, then condition becomes true. (A >
    B) is not true.


    The Greater-than Operator (>): Checks if the value of the left operand is less
    than the value of the right operand; if yes, then condition becomes true. (A <
    B) is true.


    The Less-than-or-equal Operator (<=): Checks if the value of the left operand
    is less than or equal to the value of the right operand; if yes, then condition
    becomes true. (A <= B) is true.


    The Greater-than-or-equal Operator (>=): Checks if the value of the left operand
    is greater than or equal to the value of the right operand; if yes then condition
    becomes true. (A >= B) is not true.


    ## 5. Equality Operators


    The Equals Operator (==): Checks if the value of two operands is equal or not;
    if yes, then condition becomes true. (A == B) is not true.


    The Does-not-equals Operator (!=): Checks if the value of two operands is equal
    or not; if the values are not equal, then condition becomes true. (A != B) is
    true.


    ## Exercise: 11 Binary operators.


    **PROBLEM:** Add the value of two variables and display the result in the console
    using console.log() method.


    **OUTPUT:** "8"


    **ANSWER:** [jsvisually.com/11.html](http://jsvisually.com/11.html)


    ## Bit operations.


    The Bit operators are also a part of the Binary Operators, but they are strictly
    used for logic operations as the ones you would find in discrete mathematics,
    manipulation of bits (zeros and ones) by bitwise operators.


    1. Binary Bitwise Operators (&, ^, |):


    - The ~ Operator: Called Bitwise NOT Operator. It is a unary operator and operates
    by reversing all bits in the operand. (~B) is -4.

    - The ^ Operator: Called Bitwise XOR Operator. It performs a Boolean exclusive
    OR operation on each bit of its integer arguments. Exclusive OR means that either
    operand one is true or operand two is true, but not both. (A ^ B) is 1.

    - The | Operator: Called Bitwise OR Operator. It performs a Boolean OR operation
    on each bit of its integer arguments. (A | B) is 3.

    - The & Operator: Called Bitwise AND operator. It performs a Boolean AND operation
    on each bit of its integer arguments. (A & B) is 2.


    2. Binary Logical Operators (&&, ||, !):


    - The && Operator: Called Logical AND operator. If both the operands are non-zero,
    then the condition becomes true. (A && B) is true.

    - The || Operator: Called Logical OR Operator. If any of the two operands are
    non-zero, then the condition becomes true. (A || B) is true.

    - The ! Operator: Called Logical NOT Operator. Use to reverse the logical state
    of its operand. If a condition is true, then Logical NOT operator will make false.
    !(A && B) is false.


    ## Exercise: 12

    ### Bit operators.


    PROBLEM: Add the numbers 2 and 3 using a bit operator and display the result in
    the console using the console.log() method


    OUTPUT: "2"


    ANSWER: [jsvisually.com/12.html](http://jsvisually.com/12.html)'
