    You have seen the word scope being used widely in this book, and if you have not
    figured its meaning by now, then know this: JavaScript has function-level scope.
    The variables inside a function are invisible to the outside. The local scope
    can “see” the global scope, but the global scope can’t “see” the local scope.


    In JavaScript, scope is the set of variables, objects, and functions that you
