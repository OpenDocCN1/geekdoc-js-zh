    # Conditions.


    ![](img/194ade798f439c6944bd1f4979d87181_80_0.png)


    Conditional statements are a set of commands that executes only when a condition
    is met. They are very useful when you require input from the user, as you will
    need to check if the user entered the right information, and in case it didn''t,
    then you need to take action. That is done by using *if ... else* statements.


    ```

    1. if (condition) {

    2.     statements_1

    3. } else {

    4.     statements_2

    5. }

    ```


    Conditions can be expression that evaluates to either true or false. Having expressions
    that evaluate to some result or other action on itself will not work. However,
    you could have a condition that evaluates to something and then use any of the
    comparison operators to obtain a true or false return.


    If you want to test for more than one condition, then you can use logical operators,
    and also compound the statement to allow for the use of another if statement inside
    another.


    COMPOUNDING:


    ```

    1. if (condition_1)

    2.     statement_1

    3. [else if (condition_2)

    4.     statement_2]

    5. ...

    6. [else if (condition_n_1)

    7.     statement_n_1]

    8. [else

    9.     statement_n]

    ```'
  - '[PAGE 81]


    # USING LOGICAL OPERATORS:


    ```

    1. if (condition) && (condition 2) {

    2.   statements_1

    3. } else {

    4.   statements_2

    5. }

    ```


    ```

    1. switch (expression) {

    2.   case label_1:

    3.     statements_1

    4.     [break;]

    5.   case label_2:

    6.     statements_2

    7.     [break;]

    8.   ...

    9.   default:

    10.    statements_n

    11.    [break;]

    12. }

    ```


    However, while you could have infinite if statements inside each other as long
    as you keep the correct, or even use multiple ones one after another, it is still
    a very inefficient way to check for multiple possibilities. Therefore, another
    structure called switch was created.


    Switch statements work the same as if statements, yet the difference is that they
    check for multiple values without having to use more of the same structure, which
    is the downside to using if statements.


    The advantage is that with one switch statement, you can have a program to evaluate
    an expression and check for unlimited number of values which are assigned to a
    case label. If a match is found, then the program executes the code associated
    with that case.


    The program would first look for a case clause with a matching label having the
    value of the expression and transfer control to that clause. If none are found,
    then it will look for a default clause to fall to, if none is found, then nothing
    inside the simply none of the clauses get executed. It is recommended to have
    a default clause to handle the cases in which nothing would otherwise get executed
    and you would have no way of finding out otherwise.'
- md: "## Exercise: 20 Conditions.\n\nPROBLEM: Private JS wonders what is the distance\
    \ from Fremont, CA to San Jose, CA?\nIf it's less than a 30 min drive, he would\
    \ go visit. Use Google maps and the conditional operator to help him make a decision\
    \ if he want to go or to stay home.\nhttps://goo.gl/maps/wJwU9\n\nANSWER: [jsvisually.com/20.html](http://jsvisually.com/20.html)\n\
    \n## Loops.\n\n![img](img/194ade798f439c6944bd1f4979d87181_83_0.png)\n\n*Private\
    \ JS will loop 7 times, then it will proceed on the red path*\n\nLoops are very\
    \ widely used in JavaScript and any other programming language for that matter.\
    \ The reason is that they are handy at handling repetitive code. If you have to\
    \ repeat certain blocks of code more than once in your script, then you use functions\
    \ to modulate that block of code and call it when needed.\n\nHowever, when you\
    \ need to repeat certain blocks of code multiple times, one after another, then\
    \ loops will be the most efficient way.\n\nJavaScript supports two main kinds\
    \ of loops, which in turn have their own variation:\n\n1. for – It loops through\
    \ a block of code as many times as specified.\n   for/in – Used for looping through\
    \ the properties of an object.\n2. while – While a specified condition is met,\
    \ it will keep looping through a block of code.\n   do/while – Just like the while\
    \ loop, loops through a block of code as long as the specified condition is met.\n\
    \nIt is an imperative to add some statement to change the values of the variable\
    \ that is used for condition checking. Otherwise, you will get an infinite loop\
    \ that will result in freezing, crashing or any other number of malfunctions on\
    \ the system running the code, as it will run without an end and consume all available\
    \ memory until the program crashes.\n\nThe for loop has the following syntax:\n\
    \n```\nfor (statement 1; statement 2; statement 3) {\n    code block to be executed\n\
    }\n```\n\nStatement 1 is executed before the loop (the code block) starts.\nStatement\
    \ 2 defines the condition for running the loop (the code block).\nStatement 3\
    \ is executed each time after the loop (the code block) has been executed.\n\n\
    ```\n//This loop will run 5 times before stopping\nfor (i = 0; i < 5; i++) {\n\
    \    text += \"The number is \" + i + \"<br>\";\n}\n\n//For/In Loop that goes\
    \ through the object person\nvar person = {fname:\"John\", lname:\"Doe\", age:25};\n\
    \nvar text = \"\";\nvar x;\nfor (x in person) {\n    text += person[x];\n}\n```\n\
    \nThe while loop has the following syntax:\n\n```\nwhile (condition) {\n    code\
    \ block to be executed\n}\n```\n\nIn this example the code will loop while the\
    \ variable i is less than 10.\n\n```\nwhile (i < 10) {\n    text += \"The number\
    \ is \" + i;\n    i++;\n}\n```\n\nIf you do not add the i++ after the main code\
    \ is executed, then the loop will never end and your browser will crash as mentioned\
    \ before. With the for loops, it is harder to have this bug, as the increment\
    \ statement is required. You would have to make it run for a very long time before\
    \ it runs out of memory, depending on the system.\n\nThe difference between a\
    \ while loop and a do/while loop is that the while loop checks the condition before\
    \ running the code, and the do/while will instead run the code and then check\
    \ for the condition before looping.\n\n```\ndo {\n    text += \"The number is\
    \ \" + i;\n    i++;\n}\nwhile (i < 10);\n```\n\n## Exercise: 21 Loops.\n\nPROBLEM:\
    \ Print the numbers 11 to 23 separated by a comma in the document window.\nDon't\
    \ worry about the last comma yet.\n\nANSWER: [jsvisually.com/21.html](http://jsvisually.com/21.html)\n\
    \n## Arrays.\n\n![img](img/194ade798f439c6944bd1f4979d87181_88_0.png)\n\n![img](img/194ade798f439c6944bd1f4979d87181_88_1.png)\n\
    \n![img](img/194ade798f439c6944bd1f4979d87181_88_2.png)\n\n![img](img/194ade798f439c6944bd1f4979d87181_88_3.png)\n\
    \n### Zero Based Indexing:\n\n- [0] is the first element (a),\n- [1] is the second\
    \ element (b),\n- [2] is the third element (c)...\n\n![img](img/194ade798f439c6944bd1f4979d87181_88_4.png)\n\
    \n![img](img/194ade798f439c6944bd1f4979d87181_88_5.png)\n\nArrays are a special\
    \ kind of variable, where a regular variable only has one value assigned to it.\
    \ The reason they are special is simple – you can assign multiple values to it,\
    \ instead of making a whole set of variables to create your own mini database.\n\
    \nTo define an array all you have to do is encase the values separated by a comma\
    \ in a bracket.\n\n```\nvar colors = [\"Blue\", \"Red\", \"Green\"];\n```\n\n\
    It can contain as many values as you wish and even mix the types if you know what\
    \ you are doing. However, it is best to keep arrays with the same types of values\
    \ in them.\n\nNow, let’s say that you need to access one of the values from your\
    \ new array -- all you have to do is use the variable name and the position of\
    \ the value in the array in the following way:\n\n```\ncolors[1]\n```\n\nThis\
    \ would be the value “Blue” which you can use as a regular variable and do any\
    \ kind of operations with it.\n\nSomething to keep in mind is that the first item\
    \ of the array will always be 0 instead of one. It might be tricky to remember\
    \ as we are used to start counting from 1 instead of 0.\n\nThis means that the\
    \ array colors has an index of two, and there are three items on the list. The\
    \ naming convention for regular variables also applies to arrays. When checking\
    \ source code, you can usually identify arrays in JavaScript because the name\
    \ is often a plural, like colors instead of color, and so on. This is due to the\
    \ fact that arrays are a list of things. Also, just like regular variables, you\
    \ only declare an array once, and then you can change the values by assigning\
    \ them by using the following format:\n\n```\narrayName[index] = newValue;\n```\n\
    \nNote that the keyword var is not used because it would be declaring a new variable\
    \ instead of changing the value of the current index in the array.\n\n## Exercise:\
    \ 22 Arrays.\n\nPROBLEM: Create an array of 5 numbers (1 to 5)\nChange the first\
    \ element to your name.\nChange the last element with your 3 favorite colors.\n\
    ANSWER: [jsvisually.com/22.html](http://jsvisually.com/22.html)\n\n## Arrays methods.\n\
    \n![img](img/194ade798f439c6944bd1f4979d87181_91_0.png)\n\nArray objects have\
    \ predefined methods, and they are the core of array functionalities in JavaScript.\
    \ These methods will allow you to convert values to string, to add or remove values,\
    \ to shift and many more data manipulation.\n\nIt is easy to remove elements while\
    \ working with arrays. All you have to do is `pop()` them as if they were balloons.\n\
    \n```\nvar colors = [\"Blue\", \"Red\", \"Orange\"];\ncolors.pop();\n```\n\nFrom\
    \ that example, you would be removing the last element on the array. If you would\
    \ like to add a new element to the array, then the array method `push()` will\
    \ add the new element to the end of the array.\n\n```\ncolors.push(\"Yellow\"\
    );\n```\n\nThis would make our colors array have the colors blue, red, and yellow,\
    \ instead of just blue and red.\n\nNow, `pop()` and `push()` methods work at the\
    \ end of the array, if you want to work with the beginning of the array, then\
    \ you can use the array method `shift()` to pop the first element of the array\
    \ and then shift all the remaining elements to the left. The equivalent of pushing\
    \ to the first element is the array method `unshift()` which would add a new element\
    \ to the beginning of the array.\n\nA very helpful array method that is often\
    \ used is `sort()` which sorts the array alphabetically. However, when you have\
    \ an array of numbers, then you have to do some extra work to avoid incorrect\
    \ sorting, since sort() works with strings, and thus, your numbers will be sorted\
    \ as strings and “30” will be bigger than “20” only because 3 is bigger than 2.\
    \ The clever way to solve this problem is by providing a compare function inside\
    \ the sort method.\n\n```\nvar scores = [30, 95, 90, 50, 20, 10];\nscores.sort(function(a,\
    \ b){return a-b});\n```\n\nThat will produce the correct sorting for numbers.\n\
    Another widely used array method is reverse() which as the name implies will reverse\
    \ the elements in an array. A nice trick is to sort the array first and then use\
    \ the reverse method to have them in a descending order."
  mdcn: "\n## 练习：20个条件。\n\n问题：Private JS想知道从加利福尼亚州弗里蒙特到加利福尼亚州圣何塞的距离是多少？\n如果车程少于30分钟，他就会去拜访。请使用谷歌地图和条件运算符，帮助他决定是去还是待在家里。\n\
    https://goo.gl/maps/wJwU9\n\n答案：[jsvisually.com/20.html](http://jsvisually.com/20.html)\n\
    \n## 循环。\n\n![img](img/194ade798f439c6944bd1f4979d87181_83_0.png)\n\n*Private\
    \ JS将循环7次，然后沿着红色路径继续*\n\n循环在JavaScript以及任何其他编程语言中都被广泛使用。原因是它们在处理重复性代码时非常方便。如果你需要在脚本中多次重复某些代码块，那么你可以使用函数来封装那个代码块，并在需要时调用它。\n\
    \n然而，当你需要连续多次重复某些代码块时，循环将是最高效的方式。\n\nJavaScript支持两种主要的循环类型，每种类型又有其变体：\n\n1.  for\
    \ – 它按指定的次数循环执行一个代码块。\n    for/in – 用于遍历对象的属性。\n2.  while – 当满足指定条件时，它将不断循环执行一个代码块。\n\
    \    do/while – 就像while循环一样，只要满足指定条件，就会循环执行一个代码块。\n\n必须添加一些语句来改变用于条件检查的变量值，这一点至关重要。否则，你将得到一个无限循环，这会导致运行该代码的系统冻结、崩溃或出现其他多种故障，因为它将无休止地运行并耗尽所有可用内存，直到程序崩溃。\n\
    \nfor循环的语法如下：\n\n```\nfor (语句1; 语句2; 语句3) {\n    要执行的代码块\n}\n```\n\n语句1在循环（代码块）开始之前执行。\n\
    语句2定义运行循环（代码块）的条件。\n语句3在每次循环（代码块）执行后执行。\n\n```\n//此循环将在停止前运行5次\nfor (i = 0; i\
    \ < 5; i++) {\n    text += \"The number is \" + i + \"<br>\";\n}\n\n//For/In循环，遍历person对象\n\
    var person = {fname:\"John\", lname:\"Doe\", age:25};\n\nvar text = \"\";\nvar\
    \ x;\nfor (x in person) {\n    text += person[x];\n}\n```\n\nwhile循环的语法如下：\n\n\
    ```\nwhile (条件) {\n    要执行的代码块\n}\n```\n\n在此示例中，代码将在变量i小于10时进行循环。\n\n```\nwhile\
    \ (i < 10) {\n    text += \"The number is \" + i;\n    i++;\n}\n```\n\n如果在主代码执行后不添加i++，那么循环将永远不会结束，如前所述，你的浏览器将会崩溃。对于for循环，这种错误更难出现，因为递增语句是必需的。根据系统情况，你可能需要让它运行很长时间才会耗尽内存。\n\
    \nwhile循环和do/while循环的区别在于，while循环在运行代码之前检查条件，而do/while则会先运行代码，然后在循环之前检查条件。\n\n\
    ```\ndo {\n    text += \"The number is \" + i;\n    i++;\n}\nwhile (i < 10);\n\
    ```\n\n## 练习：21个循环。\n\n问题：在文档窗口中打印数字11到23，用逗号分隔。\n暂时不用担心最后一个逗号。\n\n答案：[jsvisually.com/21.html](http://jsvisually.com/21.html)\n\
    \n## 数组。\n\n![img](img/194ade798f439c6944bd1f4979d87181_88_0.png)\n\n![img](img/194ade798f439c6944bd1f4979d87181_88_1.png)\n\
    \n![img](img/194ade798f439c6944bd1f4979d87181_88_2.png)\n\n![img](img/194ade798f439c6944bd1f4979d87181_88_3.png)\n\
    \n### 基于零的索引：\n\n- [0]是第一个元素（a），\n- [1]是第二个元素（b），\n- [2]是第三个元素（c）...\n\n![img](img/194ade798f439c6944bd1f4979d87181_88_4.png)\n\
    \n![img](img/194ade798f439c6944bd1f4979d87181_88_5.png)\n\n数组是一种特殊的变量，普通变量只被赋予一个值。它们之所以特殊，原因很简单——你可以给它赋多个值，而不是创建一整套变量来建立你自己的迷你数据库。\n\
    \n定义数组时，你只需将用逗号分隔的值放在方括号内即可。\n\n```\nvar colors = [\"Blue\", \"Red\", \"Green\"\
    ];\n```\n\n它可以包含你想要的任意多的值，如果你知道自己在做什么，甚至可以混合类型。然而，最好保持数组中的值类型相同。\n\n现在，假设你需要访问新数组中的一个值——你只需按如下方式使用变量名和值在数组中的位置：\n\
    \n```\ncolors[1]\n```\n\n这将是值“Blue”，你可以像使用普通变量一样对它进行任何操作。\n\n需要记住的是，数组的第一个项目总是0而不是1。这可能有点难记，因为我们习惯从1开始计数，而不是从0。\n\
    \n这意味着数组colors的索引为2，列表中有三个项目。普通变量的命名约定也适用于数组。在检查源代码时，你通常可以通过名称（通常是复数形式，如colors而不是color等）来识别JavaScript中的数组。这是因为数组是一个项目列表。此外，就像普通变量一样，你只声明一次数组，然后可以通过以下格式赋值来更改值：\n\
    \n```\narrayName[index] = newValue;\n```\n\n注意，这里不使用关键字var，因为那会声明一个新变量，而不是更改数组中当前索引的值。\n\
    \n## 练习：22个数组。\n\n问题：创建一个包含5个数字（1到5）的数组\n将第一个元素更改为你的名字。\n将最后一个元素更改为你最喜欢的3种颜色。\n\
    答案：[jsvisually.com/22.html](http://jsvisually.com/22.html)\n\n## 数组方法。\n\n![img](img/194ade798f439c6944bd1f4979d87181_91_0.png)\n\
    \n数组对象具有预定义的方法，它们是JavaScript中数组功能的核心。这些方法将允许你将值转换为字符串、添加或删除值、移动以及进行更多数据操作。\n\n\
    在使用数组时，删除元素很容易。你只需像戳破气球一样将它们`pop()`掉。\n\n```\nvar colors = [\"Blue\", \"Red\"\
    , \"Orange\"];\ncolors.pop();\n```\n\n从这个例子中，你将删除数组中的最后一个元素。如果你想向数组添加一个新元素，那么数组方法`push()`会将新元素添加到数组的末尾。\n\
    \n```\ncolors.push(\"Yellow\");\n```\n\n这将使我们的colors数组包含蓝色、红色和黄色，而不仅仅是蓝色和红色。\n\
    \n现在，`pop()`和`push()`方法在数组的末尾工作，如果你想操作数组的开头，那么你可以使用数组方法`shift()`来弹出数组的第一个元素，然后将所有剩余元素向左移动。与压入第一个元素相对应的是数组方法`unshift()`，它会在数组的开头添加一个新元素。\n\
    \n一个非常有用且常用的数组方法是`sort()`，它按字母顺序排序数组。但是，当你有一个数字数组时，你需要做一些额外的工作以避免不正确的排序，因为sort()适用于字符串，因此，你的数字将被当作字符串排序，“30”会比“20”大，仅仅是因为3比2大。解决这个问题的巧妙方法是在sort方法内提供一个比较函数。\n\
    \n```\nvar scores = [30, 95, 90, 50, 20, 10];\nscores.sort(function(a, b){return\
    \ a-b});\n```\n\n这将为数字产生正确的排序。\n另一个广泛使用的数组方法是reverse()，顾名思义，它会反转数组中的元素。一个不错的技巧是先对数组排序，然后使用reverse方法使其降序排列。\n"
