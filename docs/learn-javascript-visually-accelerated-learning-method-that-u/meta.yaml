    Assume that A has a value of 10 and B has a value of 20.


    # 1. Arithmetic Operators


    The * Operator: Multiplies both operands. A * B will give 200


    The / Operator: Divide numerator by dominator. B / A will give 2


    The % Operator: Modulus Operator and remainder of after an integer division. B
    % A will give 0


    The Addition operator (+): Adds two operands. A + B will give 30.


    The Subtraction Operator (-): Subtracts second operand from the first. A - B will
    give -10


    # 2. Assignment Operators


    The = Operator: Simple assignment operator; Assigns values from right side operands
    to the left side operand. C = A + B will assign the value of A + B into C.


    The *= Operator: Multiply AND assignment operator; it multiplies the right operand
    with the left operand and assign the result to the left operand. C *= A is equivalent
    to C = C * A.


    The /= Operator: Divides AND assignment operator; It divides left operand with
    the right'
