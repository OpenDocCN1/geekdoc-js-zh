  md: '```

    1. throw "Error2"; //String type

    2. throw 42; //Number type

    3. throw true; //Boolean type

    4. throw {toString: function() { return "I''m an object!"; } };

    ```


    The *try ... catch* statement is a peculiar one. It marks a block of statements
    to try, and then you can specify one or more responses in case an exception is
    thrown. If that is the case, then the catch statement catches it. This is the
    best way to control your code for now exceptions.


    ```

    1. try {

    2.   throw "myException" // generates an exception

    3. }

    4. catch (e) {

    5.   // statements to handle any exceptions

    6.   logMyErrors(e) // pass exception object to error handler

    7. }

    ```


    The *finally* block is the last part, which is in charge of executing statements
    after the try and catch, but before the rest of the statements of your program
    or script. The finally block will be executed even if there is no catch block.
    Basically, the finally is used to make your program or script provide useful information
    as to why it failed, instead of just abruptly crashing.


    ```

    1. openMyFile();

    2. try {

    3.   writeMyFile(theData); //This may throw an error

    4. }

    5. catch(e) {

    6.   handleError(e); // If we got an error we handle it

    7. }

    8. finally {

    9.   closeMyFile(); // always close the resource

    10. }

    ```'
