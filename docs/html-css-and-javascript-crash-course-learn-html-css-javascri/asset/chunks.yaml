    - `Variables do not hold space variable that creates more than a word, therefore
    ‘number one’ is written as `numberone` but for easy readability `numberone` is
    often written as `number_one` or `numberOne`.`

    - `Select a naming convention and become accustomed to it.`


    ```

    var 2numberOne; //invalid variable name because it started with number


    var numberOne!; //invalid variable name because it contains a non-permitted character!


    var x; //valid variable name but not descriptive


    var numberOne; //variable declaration


    var numberTwo; //variable declaration


    numberOne=5; //assigning data to variable


    numberTwo=10; //assigning data to variable


    document.write(numberOne); //calling data inside a variable


    document.write(numberTwo); //calling data inside a variable


    var numberOne=3; //variable declaration and assignment


    var numberOne, numberTwo, numberTwo; //multiple variable declaration


    var numberOne=2, numberTwo=4, numberTwo=6; //multiple variable declaration and
    assignment

    ```


    # Chapter 16. JavaScript Syntax


    We finally start to see JavaScript source code! So far everything we have seen
    in this manual may have seemed very theoretical, but from now on we hope you find
    it more enjoyable to start seeing more practical and directly related to programming.


    The JavaScript language has a syntax very similar to Java because it is based
    on it. It is also very similar to that of the C language, so if the reader knows
    any of these two languages it will be easy to handle with the code


    ## Comments in The Code


    A comment is a part of code that is not interpreted by the browser and whose utility
    lies in making it easier for the programmer to read. The programmer, as he develops
    the script, leaves individual phrases or words, called comments, which help him
    or anyone else to read the script more easily when modifying or debugging it.


    Some JavaScript comments have been seen previously, but now we are going to count
    them again. The language has two types of comments. One of them, the double bar,
    is used to comment on a line of code. The other comment can be used to comment
    on several lines and is indicated with the signs / * to start the comment and
    * / to end it. Let''s see some examples.


    ```

    <SCRIPT>


    // This is a one-line comment


    / * This comment can be extended


    along several lines.


    The ones you want * /


    </SCRIPT>

    ```


    ## Upper Case and Lower Case


    In JavaScript uppercase and lowercase letters must be respected. If we make a
    mistake when using them, the browser will respond with an error message, either
    syntax or indefinite reference.


    For example, the `alert()` function is not the same as the `Alert()` function.
    The first displays text in a dialog box, and the second (with the first capital
    A) simply does not exist, unless we define it ourselves. As you can see, for the
    function to recognize JavaScript, you have to write all lowercase. We will see
    another clear example when we deal with variables, since the names we give to
    the variables are also case sensitive.


    As a general rule, the names of things in JavaScript are always written in lowercase,
    unless a name with more than one word is used, since in this case the initials
    of the words following the first will be capitalized. For example, `document.bgColor`
    (which is a place where the background color of the web page is saved), it is
    written with the capital "C", as it is the first letter of the second word. You
    can also use capital letters in the initials of the first words in some cases,
    such as the names of the classes.


    ## Separation of Instructions


    The different instructions that our scripts contain must be conveniently separated
    so that the browser does not indicate the corresponding syntax errors. JavaScript
    has two ways of separating instructions. The first is through the semicolon (;)
    character and the second is through a line break.


    For this reason, JavaScript statements do not need to end with a semicolon unless
    we put two instructions on the same line.


    It is not a bad idea, anyway, to get used to using the semicolon after each instruction
    because other languages such as Java or C force them to be used and we will be
    getting used to making a syntax more similar to the usual one in advanced programming
    environments.


    ## Variables in JavaScript


    This is the first of the articles that we are going to dedicate to variables in
    JavaScript within the JavaScript Manual. We will see, if we do not already know,
    that variables are one of the fundamental elements when making programs, in JavaScript
    as well as in most of the existing programming languages.


    So let''s start by getting to know the concept of a variable and we''ll learn
    how to declare them in JavaScript, along with detailed explanations of their use
    in the language.


    ### Variable Concept


    A variable is a space in memory where data is stored, an area where we can store
    any type of information that we need to carry out the actions of our programs.
    We can think of it as a box, where we store data. That box has a name, so that
    later we can refer to the variable, retrieve the data as well as assign a value
    to the variable whenever we want.


    For example, if our program performs sums, it will be very normal for us to store
    in variables the different addends that participate in the operation and the result
    of the sum. The effect would be something like this.


    ```

    adding1 = 23


    adding2 = 33


    sum = adding1 + adding2

    ```


    In this example we have three variables, `adding1`, `adding2` and `sum`, where
    we save the result. We see that their use for us is as if we had a section where
    to save a data and that they can be accessed just by putting their name.


    ### Rules for Variable Naming in JavaScript


    Variable names must be constructed with alphanumeric characters (numbers and letters),
    the underscore or underscore (_), and the dollar character $. Apart from this,
    there are a number of additional rules for constructing names for variables. The
    most important is that they cannot start with a numeric character. We cannot use
    rare styles such as the + sign, a space, or a - sign. Supported names for variables
    could be:


    - `Age`

    - `country of birth`

    - `_Name`

    - `$ element`

    - `Other $ _Names`


    We must also avoid using reserved names as variables, for example we will not
    be able to call our variable words like `return` or `for`, which we will see that
    they are used for structures of the language itself. Let''s now look at some variable
    names that you are not allowed to use:


    - `12 months`

    - `your name`

    - `return`

    - `for`

    - `more or less`

    - `pe% pe`


    ### Variable Names in JavaScript Are Case Sensitive


    Remember that JavaScript is a case-sensitive language, so variables are also affected
    by that distinction. Therefore, the variable named `myname` is not the same as
    the variable `myName`. `Age` is not the same as `age`.


    Keep this detail in mind, as it is a common source of code problems that are sometimes
    difficult to detect. This is because sometimes you think you are using a variable,
    which should have a specific data, but if you make a mistake when writing it and
    put upper or lower case where it should not, then it will be another different
    variable, which will not have the expected data. Since JavaScript does not force
    you to declare variables, the program will run without producing an error, however,
    the execution will not provide the desired effects.


    ### Declaration of Variables in JavaScript


    Declaring variables consists of defining, and incidentally informing the system,
    that you are going to use a variable. It is a common custom in programming languages
    to explicitly specify the variables to be used in programs. In many programming
    languages there are some strict rules when it comes to declaring variables, but
    the truth is that JavaScript is quite permissive.

