    Also, you will need a good plaintext editor. Just make sure it doesn''t add anything
    else to your code behind the scene. For this reason, you really shouldn''t use
    document processors like Microsoft Word or Apple Pages. These are made for something
    entirely different and their built-in formatting features will ruin your code.


    # Chapter 1. Fundamentals of HTML


    ## What Is HTML?


    Divisions were used for a long time in building a webpage structure. However,
    divisions have a problem in that they don’t provide a semantic value, making it
    difficult to tell divisions intensions. However, new elements which are structurally
    based are introduced by HTML5. These elements include `<header>`, `<nav>`, `<article>`,
    `<section>`, `<aside>`, and `<footer>`.


    These elements give meaning to the way web pages are organized and improve the
    structural semantics. All of these are block-level elements and have no implied
    style or position. All of these elements can also be used severally in a web page
    provided each element has a proper reflection of its semantic meaning. Let us
    discuss this one by one.


    ## Header


    Just as the name suggests, the `<header>` elements help us to identify the top
    of a web page, section or article, or any other segment of a web page. The `<header>`
    element may have a heading, an introductory text, and navigation. It is created
    as follows:


    `<header>...</header>`


    Don’t confuse this `<header>` element with the `<head>` element or headings `<h1>`
    through `<h6>`. They all have different meanings when it comes to semantics.


    The `<header>` is a structural element that identifies the heading of a page segment.
    It should be added within the `<body>` element.


    The `<head>` element isn’t shown on a web page as it only provides the metadata
    for a web page. Examples of such metadata include the title of the web page and
    links to any external files. It should be added directly to the `<html>` element.


    The headings `<h1>` through `<h6>` help us to designate the multiple levels of
    text headings throughout a web page.


    ## Navigation


    The `<nav>` element is used for identifying a section of the major navigational
    links on a web page. The `<nav>` element should be used for primary navigation
    sections only, like a table of contents, global navigation, previous/next links
    and other groups of navigational links. It is created as follows:


    `<nav>...</nav>`


    ## Article


    We use the `<article>` element to identify a section of independent and self-contained
    content that can be used or distributed independently. Use the `<article>` element
    to markup newspaper articles, blog articles, user-submitted content, and other
    related content.


    Before using the `<article>` element, you have to ask yourself whether it is possible
    for you to replicate the content elsewhere without introducing confusion. If you
    remove the contents of the `<article>` element and you place them somewhere else
    like in an email, the `<article>` element should still be able to make sense.
    It is created as follows:


    `<article>...</article>`


    ## Section


    We use the `<section>` element to identify a group with same theme of content,
    which usually has a heading. The way the content is grouped within the `<section>`
    element can be general, but it will be good to ensure that the content is related.


    Use the `<section>` element to separate and create a hierarchy within your web
    page. It is created as follows:


    `<section>...</section>`


    Sometimes, determining the element to be used based on the semantic meaning of
    the element might still be difficult for you to do. The trick is simple, consider
    the content. The trick is simple, consider the content.


    The `<section>` and `<article>` elements play a significant contribution to the
    structure of a document and help in outlining documents. If styling is the purposes
    for grouping the content without adding value to the document structure, use the
    element `<div>`.


    If the content has an impact on the outline of the document and can be redistributed
    independently, use the element `<article>`.


    If the content has an impact on the outline of the document and is a representation
    of a group of content with a theme, use `<section>` element.


    ## Aside


    Use the `<aside>` element to hold contents such as inserts, sidebars and short
    explanations that are related to the surrounding content. When it is used with
    an `<article>` element, the `<aside>` element may be good for identifying the
    publisher of an article.


    See the `<aside>` element as the element that is displayed off to the sides (left
    or right) of a page. Remember that all structural elements like the `<aside>`
    are elements on a block-level and they will appear in a new line, and they will
    occupy the entire width provided by the web page or cover the whole length of
    the element they are nested within the parent element.


    It is created as follows:


    `<aside>...</aside>`


    ## Footer


    The `<footer>` element is used to identify the end or closing of a web page, or
    any other part of a web page. Usually, the footer is added to the bottom part
    of its parent. It is created as follows:


    `<footer>...</footer>`


    ## Practice


    We need to put all the above into practice by creating a basic website. We will
    use hyperlinks to link together the various pages of the website.


    Step 1) We will first link the “My Website” text inside an `<h1>` element within
    the `<header>` element to the `index.html` page. This is the page that is first
    loaded when the user opens the website, showing the home page. This means that
    when a user clicks My Website text, they will be taken to the home page of the
    website.


    This is shown below:


    ```

    <h1>

    <a href="index.html">My Website</a>

    </h1>

    ```


    Step 2) For us to be able to navigate through the different web pages, we will
    create the navigation menu using the `<nav>` element within the header element.
    This will be done within the `<header>` element. We will add the About Us, Services,
    Location and Contact Us pages to go together with the Home page. We have to create
    links for all of these. The navigation menu can be created as follows:


    ```

    <header>

    ...

    <nav>

    <a href="index.html">Home</a>

    <a href="about.html">About Us</a>

    <a href="services.html">Services</a>

    <a href="location.html">Location</a>

    <a href="contact.html">Contact Us</a>

    </nav>

    </header>

    ```


    Step 3) For convenience purposes, let us add the same navigation to the footer
    section of the website. This can be done as follows:


    ```

    <footer>

    ...

    <nav>

    <a href="index.html">Home</a>

    <a href="about.html">About Us</a>

    <a href="services.html">Services</a>

    <a href="location.html">Location</a>

    <a href="contact.html">Contact Us</a>

    </nav>

    </footer>

    ```


    Step 4) In the `<section>` element, that introduces our website, we need to add
    a link that will urge them to contact us now. It will be good for this link to
    be added below a paragraph:


    ```

    <section>

    ...

    <a href="contact.html">Contact us Now</a>

    </section>

    ```


    Step 5) We need to add links to all sections that tease the other pages. Inside
    every section, we will wrap both `<h3>` and `<h5>` elements within an anchor element
    that links to the right page. This should be done for every section:


    ```

    <section>

    <section>

    <a href="services.html">

    <h5>Services</h5>

    <h3>World-Class Services</h3>

    </a>

    <p>We served different customers from all over the world, and these are ready
    to share their testimonies.</p>

    </section>

    ...

    </section>

    ```


    After that, you should create the other pages and make sure that they are stored
    in the same folder as the `index.html` file. These pages are the `about.html`,
    `services.html`, `location.html` and `contact.html`.


    For the purpose of ensuring that all pages look the same, use the same document
    structure for all pages and use the `<header>` and `<footer>` elements as the
    file `index.html`.


    Your combined code should be as follows:


    ```

    <!DOCTYPE html>

    <html>

    <header>

    <h1>

    <a href="index.html">My Website </a>

    </h1>

    <nav>

    <a href="index.html">Home</a>

    <a href="about.html">About Us</a>

    <a href="services.html">Services</a>

    <a href="location.html">Location</a>

    ```

