    <html>


    <head>


    <title> My First Style Sheet </title>


    <meta charset="UTF-8" />


    </head>


    <body>


    <h1> My First Style Sheet </h1>


    <p> <a href="#" style="color:red; text-decoration:none;">


    Click Here </a> </p>


    </body>


    </html>


    COLORS.HTML FILE WITHOUT INLINE STYLE ‒


    <!doctype html>


    <html>


    <head>


    <title> My First Style Sheet </title>


    <meta charset="UTF-8" />


    </head>


    <body>


    <h1> My First Style Sheet </h1>


    <p> <a href="#"> Click Here </a> </p>


    </body>


    </html>


    View the file in your web browser after you save it to check your work. You will
    see that the formatting rules in the style sheet has not yet been applied to your
    Web page. This is because we haven''t told the browser to point (link) to the
    style sheet.


    You have to add the <link> element to the <head> portion in your HTML document
    in order to do this. The <link> element simply points the browser to the external
    style sheet and the browser will then apply the style sheet''s formatting rules
    to your page.


    Here is the <link> element added to the <head> portion of our page:


    <!doctype html>


    <html>


    <head>


    <title> My First Style Sheet </title>


    <link rel="stylesheet" href="style.css" />


    <meta charset="UTF-8" />


    </head>


    <body>


    <h1> My First Style Sheet </h1>


