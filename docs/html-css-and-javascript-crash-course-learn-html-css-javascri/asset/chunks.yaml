    # Chapter 10. Image Manipulation in CSS


    You can add images to your documents using the img tag, or you can add a background
    image to the entire document.


    Setting an image as background for a website.


    You can use body tag’s background-image property to set a background image for
    the entire page.


    body { background-image: url(''draft.gif''); }


    ![](image_rsrc3FJ.jpg)


    Positioning the background Image


    Use the background-position property to specify where your background image will
    appear.


    body {


    background-image: url(''draft.gif'');


    background-position: bottom right;


    background-repeat: no-repeat;


    }


    ![](image_rsrc3FK.jpg)


    You can use the following keyword combinations with the background-position property:


    | Keywords |  |


    | top left | center left | bottom left |


    | top center | center center | bottom center |


    | top right | center right | bottom right |


    |  |  |  |


    These keywords can be written in either order. For example, “top left” and “left
    top” will both work correctly. The other value will default to center if you only
    specify a single value.


    You can also use percentages to set the position.


    background-position: 30% 80%;


    If you want to position the image in the top left 0% 0% is the value, and 100%
    100% would place it in the bottom right. Setting the background-position to 50%
    50% would center the image, as would center center.


    The following list shows how keyword settings match percentage settings:


    | Keywords | Percentages |


    | left top | 0% 0% |


    | center top | 50% 0% |


    | right top | 100% 0% |


    | left center | 0% 50% |


    | center center | 50% 50% |


    | right center | 100% 50% |


    | left bottom | 0% 100% |


    | center bottom | 50% 100% |


    | right bottom | 100% 100% |


    If you use keywords or percentages, your background image’s position will adjust
    to the size of the window. You can also use pixels to set a non-adjusting position:


    background-position: 20px 20px;


    Adjusting background color or image position.


    You can use the background-clip property to specify whether the background includes
    the border, padding, or only the content.


    | div {padding:10px;border: 5px dotted #000;background-color: #f00;background-clip:border-box;}
    | ![](image_rsrc3FM.jpg) |


    | div {padding:10px;border: 5px dotted #000;background-color: #f00;background-clip:padding-box;}
    | ![](image_rsrc3FN.jpg) |


    | div {padding:10px;border: 5px dotted #000;background-color: #f00;background-clip:content-box;}
    | ![](image_rsrc3FP.jpg) |


    Adding more than one image to the background


    With CSS3, you can specify multiple background images. If you are supporting old
    browser versions, you can specify one background image with the html tag and another
    with the body tag.


    CSS approach


    body {


    background-image: url(''logo.gif''), url(''draft.gif'');


    background-position: bottom right, 50% 50%; 


    background-repeat: no-repeat;


    ![](image_rsrc3FR.jpg)}


    Older browser version approach


    html {


    background-image: url(''logo.gif'');


    background-position: bottom right;


    background-repeat: no-repeat;


    }


    body {


    background-attachment: fixed;


    background-image: url(''draft.gif'');


    background-position: 50% 50%;


    background-repeat: no-repeat;


    }


    Fixing a background image to avoid scrolling


    You can use the background-attachment property to fix an image in place and prevent
    it from scrolling with rest of the page’s content.


    body {


    background-attachment: fixed;


    background-image: url(''draft.gif'');


    background-position: 50% 50%;


    background-repeat: no-repeat;


    }


    | Value | Description |


    | repeat | The background repeats horizontally and vertically.This is the default
    setting. |


    | repeat-x | The background repeats horizontally but not vertically. |


    | repeat-y | The background repeats vertically bit not horizontally. |


    | no-repeat | The background does not repeat horizontally or vertically. |


    How do I resize a background image to fit an element?


    You can use the background-size property to resize a background image to fit a
    larger or smaller element automatically.


    | Value | Description |


    | contain | Scales the image so the height and width fit in the element |


    | cover | Scales the image so the height or width fits (whichever is smaller)
    |


    | length | Sets the height and widthIf you only specify one value, the image is
    sized proportionally. |


    | percentage | Sets the height and width as a percentage of the parent elementIf
    you only specify one value, the image is sized proportionally. |


    Adding a shadow to the image


    You can use the box-shadow property to add a shadow to images.


    img { box-shadow: 5px 5px 10px 10px #f00; }


    You can specify the following options for the shadow:


    | Value | Description |


    | blur | Amount (in pixels) of blurring around the shadow''s edge |


    | color | The shadow''s color |


    | offset-x | Horizontal offset (in pixels) of the shadow |


    | offset-y | Vertical offset (in pixels) of the shadow |


    | inset | Specifies an inner shadow |


    | spread | Size (in pixels) of the shadow0 – shadow is the same size as the element
    |


    Using an image as a border


    You can use the border-image property to use an image as an element''s border.


    border-image:url(diamond.png) 20 20 round;


    The following properties can be used to specify border images for different sides
    of the element:


