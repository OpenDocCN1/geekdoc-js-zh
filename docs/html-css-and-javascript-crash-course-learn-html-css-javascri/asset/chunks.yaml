    \ markup should always be in a separate, presentation-free document. If you can,\
    \ try to avoid using inline styles entirely.\n\n## The Anatomy of A CSS Rule\n\
    \nA style sheet is made up of rules. A rule is a formatting instruction that tells\
    \ the Web browser to apply specific styles to your Web page.\n\nHere is an example\
    \ of a CSS rule that sets the color of a `<p>` paragraph element to red:\n\n```\n\
