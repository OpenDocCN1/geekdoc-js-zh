    13. `Reverse`: This will be responsible for reversing the order that your array
    elements are going to be in. The first element in the array will become the last
    element, and then the part that was the last one will go to the beginning of the
    collection.


    14. `Shift()`: This one will remove the first element out of your array and then
    will give you a return of that element.


    15. `Slice`: This one will extract a section of your array and will give you a
    return that has a brand new collection in it.


    16. `Some()`: This one will return true as long as you have one or more elements
    in the array that is able to satisfy the testing function that you provided.


    17. `toSource()`: This one will help us to represent the source code that comes
    with our object.


    18. `Sort()`: This one can be useful because it will help us to sort through all
    of the elements that come with our array.


    19. `Splice`: This one will be there to help us to either add or remove the elements
    of the array.


    20. `toString()`: This one will return a string that will represent the array
    and all of the elements that happen in it.


    21. `Unshift`: This final one will take some time to add in one or more elements
    to the beginning of our array and then will let us know what the new length of
    this array will be when it is done.


    As we can see here, there are a lot of possibilities that we can work with when
    it comes to handling the arrays that show up in our codes. These arrays are going
    to help us to hold onto some of the data that we have more efficiently and will
    ensure that we can put it all together and pull out the elements that we need
    and want without a lot of struggle along the way. Make sure to take a look at
    some of the methods and functions available with these arrays, especially with
    JavaScript, so you know how to use them for some of your own needs as well.


    # Chapter 18. What to Do Next?


    Hopefully by now, you have a somewhat solid understanding of how HTML and CSS
    work together. It''s important to understand that we''ve only scratched the surface
    of HTML and CSS.


    What''s important to take away from this book is not to memorize all the different
    elements in HTML and properties in CSS. It''s to be able to understand the two
    and how they work hand-in-hand.


    There''s no need to learn every single element and property. It will do more harm
    than good and chances are, you''re not going to absorb all that information. That''s
    precisely why I didn''t want this book to be a 500-page manual of all the HTML
    elements and CSS properties. When you learn English, you don''t just open up a
    dictionary and start reading. Coding is no different.


    The critical skill that hopefully you have by now is to be able to look at new
    HTML elements and CSS properties and deduce and understand their functionalities
    from the code.


    ## Debugging


    By far the most powerful tool in all of HTML and CSS is the ability to identify
    and fix errors. If you master this skill, it doesn''t really matter how much you
    know and it doesn''t matter if your initial code is filled with mistakes because
    it''s the ability to spot and fix errors that brings you to your end result. It''s
    also going through this process that allows you to absorb and understand concepts
    truly.


    When it comes to debugging, your best friend is a browser developer tool. All
    of the main browsers have developer tools for you to look at the HTML and CSS
    of any given page you load. Safari has web inspector, Firefox has firebug, and
    Chrome has inspected element. We''re going to showcase Chrome''s inspect element.


    So you''re coding away and you open up your web page in your browser and something''s
    not right. It looks off but you have no idea where you''ve made an error. Open
    up inspect element (right click -> click on inspect element).


    Inspect element will show you exactly why the code is displayed in the way it
    is. As the mouse hover over the elements in the HTML on the left side, it will
    highlight the corresponding area in your window. Clicking on an HTML element,
    will show the CSS rule that corresponds to it on the right hand side. If you drag
    down the ''compound style'' tab, it shows exactly the property values that are
    given and where they''re coming from. A lot of the times, CSS rules are passed
    down from parent elements, and with this, you can see which parent rule is resulting
    in the given value.


    Apart from the occasional careless mistake that takes a second to fix once you
    have realized it, the more trivial errors are always related to the CSS properties
    display and position. Things like font-size, colors, borders, etc. are all one-step
    fixes. Display and position can get way more complicated. It''s by far the hardest
    concept to grasp for HTML and CSS. If you know display and position inside out,
    you''re a HTML/CSS master.


    The reason display and positioning can get complicated is because of the number
    of variables in play. Your output is not only indicative of the value of one property,
    but a combination of many. The display, position, and float properties of sister
    elements all work hand-in-hand. Not only that, but they also correlate to the
    properties of the parent element. Debugging this is not as simple as looking at
    one element. You must look at the bigger picture.


    Here''s how you should debug display and positioning errors.


    Isolate your error. Figure out which element is resulting in the wrong display
    or position. Look at your declarations of not only this element, but also the
    sister and parent elements. When you debug display and position, it''s important
    to realize that you have to look beyond just the specific element.


    If you have an idea why the error is present, try and fix it in your browser.
    Remember, you can change and update values in your inspect element and the changes
    will be reflected live. If you''re right and the changes correct the error, go
    to your code and make the same changes.


    If you''re completely clueless and have no clue why your position or display is
    wrong, do some research. Turn to Google and search for your problem. Simple searches
    like ''absolute position center issue'' or ''can''t see fixed position element''
    will render plenty of results. Literally every question that you can think of
    related to HTML and CSS has been asked and answered online. Tutorials and forums
    are great places to find answers. Use them hand-in-hand.


    As for forums, the place for everything and anything coding related is stackoverflow.com.
    Chances are your answers will be there, but if not, there are plenty of more resources
    out there.


    ## Learning More


    You''re in a position now where you understand the language of HTML and CSS. What
    separates you from someone who''s a master of HTML and CSS is simply experience.
    The way to learn and be good at coding is to code. Reading books or online manuals
    on all the specific rules is pointless. What you should do is set out to create
    a product. Even if you''re not completely sure how to complete it, just get the
    ball rolling. Your generic questions will turn into specific questions, which
    you''ll be able to find the answers to.


    One last thing to keep in mind:


    You can look for any code on any website, that’s the beauty of the HTML and CSS
    language. Your browser is the most powerful tool for learning. When you come across
    a website that has a spectacular design or something you want to implement, you
    can look at how it''s done right in your browser. Take advantage of the power
    of your browser.

