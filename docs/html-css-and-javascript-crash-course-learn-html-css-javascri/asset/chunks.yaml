  trans: "\n内边距区域在盒子内部创造空间，而外边距区域则在盒子外部和周围创造空间。想象你有一个装满易碎物品的纸板箱，但你在它周围包裹了气泡膜来缓冲冲击。盒模型中的内边距类似于气泡膜，因为它被添加在盒子内部。Google\
    \ Chrome 开发者工具为页面上的每个元素提供了非常清晰的盒模型视图。如果你点击“查看”>“开发者”>“开发者工具”：\n\n![00103.jpeg](img/image_rsrc3GE.jpg)\n\
    \n它会在页面底部显示 Chrome 开发者工具面板：\n\n![00104.jpeg](img/image_rsrc3GF.jpg)\n\n打开开发者工具面板后，在左侧的“元素”选项卡中，展开\
    \ `header` 元素并点击 `h1` 元素。这将是 Chrome 开发者工具中选中的元素，你会看到页面上的 `h1` 被高亮显示：\n\n![00105.jpeg](img/image_rsrc3GG.jpg)\n\
    \n选中 `h1` 元素后，你可以增大右侧“样式”选项卡的宽度，并向下滚动直到看到 `h1` 的盒模型：\n\n![00106.jpeg](img/image_rsrc3GH.jpg)\n\
    \n从上面的截图可以看出，`h1` 元素的盒模型清晰可见。它的顶部和底部有默认的外边距，没有边框或内边距。希望这能让你更好地理解页面上的每个元素是如何表示的，以及它们如何根据显示类型相互交互。\n\
    \n# 第 14 章 逐步将 CSS 添加到 HTML 文档\n\n## 将 CSS 添加到 HTML 文档的三种方式\n\n你可能从 HTML 知识中记得，有三种方式可以将\
    \ CSS 添加到 HTML 文档中：作为内联样式、作为内部样式以及作为外部样式表的链接。在本书中，将使用内部样式方法，因为它更容易在学习目的下演示 CSS\
    \ 如何在单个屏幕窗口中与 HTML 关联，并且使用简短经济的代码片段。然而，通常你会希望使用外部样式表中的 CSS 脚本，因为这是普遍推荐的方法。此外，为了视觉清晰，许多冗余元素将被省略，例如\
    \ `<!DOCTYPE html>`、`<html>` 和 `<body>`。只需假设，如果这些示例用在真实网页上，你会拥有所有必要的元素。\n\n为了回顾，让我们提醒自己每种将\
    \ CSS 添加到 HTML 文档的方式的语法和方法。\n\n## 内联样式\n\n内联 CSS 出现在 HTML 开始标签内，其中 `style` 是一个全局属性，可以被任何\
    \ HTML 元素使用。任何应用的 `style` 属性的值是一个在引号内声明的 `property:value` 对，通过赋值运算符等号 `=` 附加到属性上。每个\
    \ `property:value` 对应以分号结尾，同样，当组合多个内联样式时，每个属性：值对之间应用分号分隔。\n\n在层叠样式表出现之前，需要单独为每个\
    \ HTML 元素设置样式，工作量巨大。之后任何样式的更改都意味着每个应用了该样式的元素都必须手动调整。以下是内联 CSS 作为 HTML 文本文件一部分的示例：\n\
    \n`<h1 style=\"color:red; font-style:italic; font-weight:100;\">红色标题排版</h1>`\n\
    \n![](img/image_rsrc3GJ.jpg)\n\n上面应用了三种样式，使字体颜色为红色，样式为斜体，字重为 100（在从 100 到 900\
    \ 的 9 级刻度上——注意并非所有字体都支持所有九个可用的 CSS 字重）。\n\n## 内部样式\n\n使用内部 CSS 时，样式被放置在 HTML 文档的\
    \ `<head>` 部分中，该部分始终位于 `<body>` 部分之上，你应该还记得。这种方法对整个 HTML 文档（即单个网页）是内部的，而不是特定于单个元素，这就是为什么它被称为内部样式。CSS\
    \ 在 `<style>` HTML 开始和结束标签内应用，而不是在 `style` 属性声明中，并以标准 CSS 格式声明。基本的 CSS 语法是：\n\n\
    ```\ns ​{\n​property : value;\n​property: value;\n​}\n```\n\n上面的“s”代表“选择器”，它是任何\
    \ HTML 元素（在此上下文中，“s”不是表示“删除线”的 HTML 标签！）。使用内部 CSS 时，`property:value` 对在大括号 `{\
    \ }` 内声明，而不是在引号内。`property:value` 对与大括号一起构成了 CSS 中的声明。从高层次来看，语法结构可以理解为：\n\n```\n\
    选择器 {声明}  {声明}  {声明}\n选择器 {声明}  {声明}  \n```\n\n而每个声明又由以下组成：\n\n```\n{property:value;\
    \ property:value; property:value;}\n{property:value; property:value;}\n```\n\n\
    等等。\n\n一个选择器及其声明一起构成一个规则集：\n\n`规则集 = 选择器 {声明}`\n\n为了将这个语法放在一个典型示例中，让我们看看应用于单个选择器的多个声明的使用。注意，有时声明的顺序对视觉结果没有影响，但在其他情况下顺序确实有影响。\n\
    \n```\n<style>\nh2 {\ntext-align: center;\nfont-family: cursive;\ncolor: orange;\n\
    }\n</style>\n```\n\n```\n<h2>\n嗨，我被样式化了。\n</h2>\n```\n\n![](img/image_rsrc3GK.jpg)\n\
    \n对 `<h2>` 选择器的多个声明。\n\n与内联 CSS 在同一行上逐个声明样式不同，使用内部 CSS 时，每个样式声明都开始新的一行，并以分号结束。即使最后一个声明也必须始终以分号结束，因为以后你或其他设计人员可能会添加新样式，而可能没有意识到代码中缺少分号，这会在渲染样式时导致错误。\n\
    \n下面的代码是我们在内联示例中应用的相同样式的内部 CSS 版本。CSS 现在位于大括号内，大括号位于 `<style>` 标签内，而 `<style>`\
    \ 标签位于 `<head>` 部分内。CSS 首先在头部（在 body 之前）应用，因为浏览器会线性解析代码。这样，浏览器不会先加载一个未设置样式的页面版本，然后再重新设置所有样式——如果将内部\
    \ CSS 放在 `.html` 文件的底部就会发生这种情况。相反，浏览器首先在 `<head>` 中获取所需的样式信息，然后所有后续的 HTML 内容都以从内部样式声明中首先解析的样式进行渲染。\n\
    \n```\n<head>\n<style>\nh1 {\ncolor: red;\nfont-style: italic;\nfont-weight: 100;\n\
    }\n</style>\n</head>\n<h1>红色标题排版</h1>\n```\n\n![](img/image_rsrc3GJ.jpg)\n\n##\
    \ 外部样式表\n\n完善的样式由许多行代码组成，因此通常不切实际地在 `.html` 文档的 `<head>` 区域内创建太多作为内部 CSS 的样式语句。相反，CSS\
    \ 代码通常放在具有 `.css` 文件扩展名的独立文本文件中。然后通过 `<link>` 元素在 `.html` 文档的 `<head>` 中链接这个外部样式。这个指向外部\
    \ `.css` 文件的链接将指示浏览器在继续加载和样式化后续 HTML 内容之前，先从外部文件获取样式信息。当使用代码编辑器编写 CSS 文件时，请确保将文件的语法设置为\
    \ CSS，尽管许多编辑器会自动检测你正在编写的语言。保存文件时，请确保它具有 `.css` 文件扩展名，以便浏览器可以将其用作样式表。\n\n```\n\
    <html>\n<head>\n<link rel=\"stylesheet\" href=\"css.css\" type=\"text/css\">\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n"
- fmt: "\nAbove, we define the relationship (the `rel` attribute in `<link>`) between\
    \ the `.html` document and the external resource as a stylesheet relationship.\
    \ The URL to locate the external style sheet is a relative URL path – in this\
    \ example, the CSS file is in the same directory as the `index.html` document.\
    \ As your websites become more complex, you will eventually want to have your\
    \ CSS source code files in their directories or folders, in which case the URL\
    \ in the `href` might instead be `\"CSS/css.css\"` or `\"scripts/css.css\"` and\
    \ so on. These forward slashes indicate that the `.css` file is to be found inside\
    \ of a directory called `\"CSS\"` or `\"scripts\"`, and that these directories\
    \ are in the same directory as the `.html` file. Finally, the Media Type of the\
    \ stylesheet is declared with the `type` attribute. CSS, like all source code,\
    \ is always just a text file, but instead of the usual `.txt` file extension used\
    \ for text files, `.css` is used so that the browser knows to parse the code as\
    \ containing styling information.\n\n![](image_rsrc3GM.jpg)\n\nPlacing the `.css`\
    \ file in the same directory as the `.html` file, OR alternately, in a `scripts`\
    \ directory. The value of the `href` attribute has to specify the path needed\
    \ to find the external style document.\n\n# Chapter 15. Introduction To JavaScript\n\
    \nHTML is used to develop web pages, and web pages can become complex documents\
    \ that define the content of a page. Materials produced using HTML can get CSS\
    \ added to it, and done in different ways like attaching a background color, changing\
    \ font sizes, image size, typeface, shadow, colour intensity, and so on. HTML\
    \ and CSS can be used to attain a static beauty of a web page. With JavaScript,\
    \ you can inject life into web pages using JavaScript effects such as form validation,\
    \ modal, slider, pop up, and so on. The practice of developing web pages or applications\
    \ with HTML, CSS, and JavaScript is called Frontend development, and it enhances\
    \ the user’s interaction with web pages. JavaScript is a well-built client-side\
    \ scripting language. JavaScript is also generally used for mobile and game application\
    \ development.\n\n## A Brief History of JavaScript\n\n- 1995: While working at\
    \ Netscape, \"LiveScript\" was created by Brendan Eich and later renamed to \"\
    JavaScript.\"\n- 1996: Javascript released by Microsoft, a port, for IE3.\n- 1997:\
    \ JavaScript became standardized in the \"ECMAScript\" spec.\n- 2005: \"AJAX\"\
    \ was coined, and the web 2.0 age began.\n- 2006: jQuery 1.0 was released.\n-\
    \ 2010: node.JS was released.\n- 2010: angular.JS was released.\n- 2012: ECMAScript\
    \ Harmony spec nearly finalised.\n\nSeveral programmers tend to believe that JavaScript\
    \ and Java belong to the same category, and this opinion is false because Java\
    \ and JavaScript are different from each other. Java is a sophisticated programming\
    \ language, while JavaScript is a scripting language only. The C programming language\
    \ influences the JavaScript Syntax.\n\nWhat does the future hold for JavaScript?\n\
    \nThe technologies of HTML5 and JavaScript can be used to create extensions for\
    \ Windows 8 desktop widgets, browsers, Chrome OS, and Firefox OS applications.\
    \ A large number of non-web related applications also adopt the scripting language\
    \ of JavaScript, and it can be used to create HTML templates (Mustache), attach\
    \ activities to PDF documents, database interaction (MongoDB), and also control\
    \ (Cylon.js). JavaScript has a bright future because web platforms continue to\
    \ mature and advance its usage beyond only browsers. This scripting language will\
    \ remain an integral part of future developments.\n\nHow to Run JavaScript?\n\n\
    JavaScript is a scripting language that cannot run on its own. The browser does\
    \ the code running of JavaScript. When a user requests an HTML page that contains\
    \ JavaScript, the browser receives the script, and then the browser gets to decide\
    \ its execution. All modern browsers support JavaScript, which is a massive advantage\
    \ for the scripting language. JavaScript also runs on operating systems like Linux,\
    \ Mac, and Windows.\n\n### Requirements to Learning JavaScript\n\n- Basic knowledge\
    \ of HTML and CSS\n- A text editor\n- A browser\n- Logical thinking and tenacity\n\
    \n## Programming\n\nComputer programming is the act of implementing and creating\
    \ a different set of rules to allow a computer to perform a specific task. It\
    \ is the process of speaking the computer language, which involves picking an\
    \ algorithm and encoding it into a notation so that the computer can get it executed.\n\
    \n### Types of Programming Languages\n\n1. Low-level language\n   - Machine code\n\
    \   - Assembly language\n2. High-level language\n\nInscribed in different languages\
    \ such as Java, PHP, C, C++, JavaScript, C#, Python, etc. Computer programs can\
    \ be either interpreted or compiled language, although JavaScript is an excellent\
    \ example of Interpretation.\n\n## Keeping Them Separate\n\nHTML: It defines the\
    \ page content.\n\nCSS: It determines the content’s presentation.\n\nJavaScript:\
    \ It controls content characters.\n\nWhen these technologies are used in developing\
    \ a web page, they must be stored differently.\n\n1. Create a separate `.html`\
    \ file for HTML\n2. Create a separate `.css` for CSS\n3. Create a separate `.js`\
    \ for JavaScript\n\n### The Wrong Approach\n\n```\n<p>\nWhatever you do, <a href=\"\
    666.html\" style=\"color: red;\" onclick=\"alert('I said dont\nclick')\">don't\
    \ click this link</a>!\n</p>\n```\n\n### The Right Approach\n\n```\n<p>\nWhatever\
    \ you do, <a href=\"666.html\" id=\"warning\">don't click this link</a>! </p>\n\
    <style>\n#warning{\ncolor:red;\n}\n</style>\n<script>\nvar warningLink=document.getElementById(\"\
    warning\");\nwarningLink.addEventListener('click',alerter, false);\nfunction alerter(){\n\
    alert(\"I said don't click\");\n}\n</script>\n```\n\nThe best approach is to save\
    \ the style and script into a separate `.css` file and `.js` file and unite them\
    \ via `link` tag and `script` tag in the HTML document. This approach is utilized\
    \ in this manual.\n\n```\n<link rel=\"stylesheet\" href=\"warning.css\" /> <p>\n\
    Whatever you do, <a href =\"666.html\" id=\"warning\">don't click this link</a>!\n\
    </p>\n<script src=\"warning.js\"></script>\n```\n\n## JavaScript Basics\n\n###\
    \ Statements\n\nThe JavaScript syntax is also known as a C-style syntax which\
    \ is related to the syntax used by PHP. A JavaScript program consists of JavaScript\
    \ language construct, command, and keyword. This manual will teach you how to\
    \ develop amazing things with the use of JavaScript language constructs, command\
    \ and keyword. Every statement must end with a semicolon or a new line. By popular\
    \ convention a JavaScript programmer should write one statement per line and with\
    \ a semicolon at the end.\n\n```\ndocument.write('Hello World') document.write('Here\
    \ comes the JS Engineer')\ndocument.write('Hello World'); document.write('Here\
    \ comes the JS Engineer');\ndocument.write('Hello World');\ndocument.write('Here\
    \ comes the JS Engineer');\n```\n\n### Comments\n\nThese are human-readable texts\
    \ which the computer disregards. JavaScript consists of two types of comments:\n\
    \n```\n//This is a single line comment\n/*\nThis is a multiple line comment on\
    \ line one\nThis is a multiple line comment on line two\nThis is a multiple line\
    \ comment on line three\n*/\n```\n\n### Variable\n\nTo declare a variable, Use\
    \ the `var` keyword.\n\nA variable is used to store data and references the memory\
    \ location in computer memory (RAM.) A variable can perform 3 actions, and they\
    \ are:\n\n1. Declaring the variable\n2. Inserting data inside the variable\n3.\
    \ Getting the data into the variable\n\nIt is important to name a variable to\
    \ enable easy differentiation. Few rules guide naming variables.\n\n#### Variable\
    \ naming rules\n\n- They consist of the following character; numbers, letters,\
    \ dollar signs or underscores but a number cannot be the first character\n- Variables\
    \ are case sensitive, therefore `'number-one'` differs from `'NumberOne'`.\n-\
    \ Variables cannot be JavaScript reserved words\n- Variables select meaning and\
    \ clarity\n"
