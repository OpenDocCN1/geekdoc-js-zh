    # 第 5 章 如何在 HTML 中插入图片？


    有一句名言：“一图胜千言”。这句话展示了图片在传递信息方面的强大力量。网站通过展示图片来让网页更加精彩、生动和活泼。


    我们如何在网页上显示图像或图片呢？


    ## 图片示例


    让我们看一个网页上图片的例子。请访问维基百科的以下页面：<https://en.wikipedia.org/wiki/Albert_Einstein>。你会看到如下所示的图片：


    ![00033.jpeg](img/image_rsrc3F5.jpg)


    图片


    示例


    你可以看到我标记了两张图片——一张是阿尔伯特·爱因斯坦，另一张是维基百科的标志。你难道不认为这些图片让页面变得生动了吗？网页上的图片可以通过两种方式使用：


    - 一种方式是仅显示图片。只显示，没有其他作用。

    - 另一种方式是将图片用作超链接。这意味着当你点击图片时，它会带你跳转到其他页面。多么有趣！


    ## 学习细节


    我们如何在网页上显示图片？我们使用 `<img>` 标签来实现。请查看下面的示例：


    ```

    <img src="图片的位置" alt="替代文本" width="宽度（像素）" height="高度（像素）"></img>

    ```


    我们以 `<img>` 标签开始，然后像处理其他 HTML 标签一样，用 `</img>` 标签结束。但我们还会使用各种其他属性来确保图片在网页上正确显示。让我们在下表中查看这些属性。


    **表 6.1：`<img>` 标签的属性**


    | `<img>` 标签属性 | 用途 |

    |-------------------|------|

    | `src` | `src` 代表来源。与超链接类似，你需要为此属性输入图片的地址。地址是图片存储的位置。该地址可以是基于互联网的图片，即图片存储在互联网上的某个地方，比如某个网页。例如，存储在维基百科上的爱因斯坦图片。地址为：`https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Einstein_1921_by_F_Schmutzer_-_restoration.jpg/220px-Einstein_1921_by_F_Schmutzer_-_restoration.jpg`。或者也可以是来自你电脑/笔记本电脑硬盘的地址，即图片存储在本地计算机硬盘的某个位置。你需要提供图片的文件夹路径。例如：`"file://C:/Books\HTMLforKids/mybook.jpg"`。你可以使用大多数类型的图片，如
    `jpg`、`jpeg`、`png`、`gif` 和 `bmp`。 |

    | `alt` | `alt` 代表替代文本。如果由于某种原因图片无法在网页上显示，则会显示此文本。这就像一个备用方案。当图片因某些问题无法显示时，你希望显示一些文本。
    |

    | `width` | 这表示图片的宽度。如果你不提供此值，则会以原始宽度显示图片。宽度以像素为单位。一个像素就像屏幕上的一个点。就像你用米或厘米测量距离一样，你同样用像素测量图片的长度。
    |

    | `height` | 表示图片的高度。与宽度类似，也以像素为单位。如果你不提供此值，则会以原始高度显示图片。 |


    让我在 HTML 中展示图片。我将使用上表中给出的爱因斯坦图片地址，并将其显示在我的 HTML 页面中。我将设置高度为 200 像素，宽度也为 200 像素，使其呈正方形。HTML
    代码如下：


    ```

    <html>

    <head>

    <title></title>

    </head>

    <body>

    <h2>阿尔伯特·爱因斯坦</h2>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Einstein_1921_by_F_Schmutzer_-_restoration.jpg/220px-Einstein_1921_by_F_Schmutzer_-_restoration.jpg"
    alt="阿尔伯特·爱因斯坦" width="200" height="200"></img>

    </body>

    </html>

    ```


    HTML 页面将显示如下。


    ![00034.jpeg](img/image_rsrc3F6.jpg)


    网页显示 你可以看到，图片以我指定的正方形尺寸（200 x 200）显示，正如我在 `<img>` 标签属性中设置的那样。


    如果图片出现问题会怎样？例如，你给图片提供了错误的地址。我建议你自己尝试一下。


    你观察得很对。它会在图片位置显示 `<img>` 标签属性中定义的替代文本。


    接下来！将图片用作超链接怎么样？听起来很棒，对吧？以下是超链接标签的结构：


    ```

    <a href="网页地址"> 超链接文本 </a>

    ```


    要将图片用作超链接，你需要将超链接文本替换为 `<img>` 标签。例如，如果我想将爱因斯坦的图片设置为超链接，点击后跳转到维基百科页面，那么我的 HTML
    `<a>` 标签将如下所示：


    ```

    <a href="https://en.wikipedia.org/wiki/Albert_Einstein"> <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Einstein_1921_by_F_Schmutzer_-_restoration.jpg/220px-Einstein_1921_by_F_Schmutzer_-_restoration.jpg"
    alt="阿尔伯特·爱因斯坦" width="200" height="200"></img> </a>

    ```


    这难道不简单直观吗？我相信你会同意我的看法。


    # 第 6 章 HTML 表格


    表格对于以网格格式表示数据非常有用。数据被划分为行和列。这有助于我们沿着两个轴理解数据。表格中的每个块称为表格单元格。让我们看看如何在 HTML 中创建表格。


    ## 表格创建


    `<table>` 元素用于创建表格。表格的内容逐行写出。`<tr>` 元素用于表示每一行的开始。`<tr>` 代表表格行。表格的每个单元格使用 `<td>`
    元素表示。表格行也可以使用 `<th>` 标签划分为表头。让我们通过一个示例更详细地了解表格的创建。


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <table>

    <tr>

    <td>A</td>

    <td>X</td>

    <td>1</td>

    </tr>

    <tr>

    <td>B</td>

    <td>Y</td>

    <td>2</td>

    </tr>

    <tr>

    <td>C</td>

    <td>Z</td>

    <td>3</td>

    </tr>

    </table>

    </body>

    </html>

    ```


    ![](img/image_rsrc3F7.jpg)


    带边框的表格看起来不错。我们将学习如何使用 CSS 在表格周围绘制边框。


    ## 表头


    行或列的标题使用 `<th>` 元素表示。`<th>` 代表表格标题。对于空单元格，你应该使用 `<td>` 或 `<th>` 元素，否则表格将无法正确创建。`scope`
    属性可用于 `<th>` 元素，以指示它是行标题还是列标题。它接受值 `row` 表示行标题，`col` 表示列标题。`<th>` 元素的内容以粗体和居中的方式显示。表格还可以使用
    `<caption>` 标签添加标题。


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <table>

    <caption><b>门票销售</b></caption>

    <tr>

    <th></th>

    <th scope="col">星期六</th>

    <th scope="col">星期日</th>

    </tr>

    <tr>

    <th scope="row">售出门票</th>

    <td>50</td>

    <td>20</td>

    </tr>

    <tr>

    <th scope="row">总销售额</th>

    <td>100</td>

    <td>150</td>

    </tr>

    </table>

    </body>

    </html>

    ```


    ![](img/image_rsrc3F8.jpg)


    ## 跨列


    有时你可能需要表格中的条目跨越多列。为此，可以使用 `colspan` 属性。它指示单元格应跨越多少列。


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <style>

    table, th, td {

    border: 1px solid black;

    border-collapse: collapse;

    }

    th, td {

    padding: 5px;

    text-align: left;

    }

    </style>

    </head>

    <body>

    <h2>跨两列的单元格：</h2>

    <table style="width:100%">

    <tr>

    <th>姓名</th>

    <th colspan="2">电话</th>

    </tr>

    <tr>

    ```



