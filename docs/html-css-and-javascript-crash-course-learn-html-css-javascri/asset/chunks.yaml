    ## The Anatomy of A CSS Rule


    A style sheet is made up of rules. A rule is a formatting instruction that tells
    the Web browser to apply specific styles to your Web page.


    Here is an example of a CSS rule that sets the color of a <p> paragraph element
    to red:


    p { color:red;}


    The CSS rule is then applied to our <p> paragraph element in the HTML document
    like this:


    </p>


    This shows an example of this paragraph style in action in a standard Web browser.


    ![00021.jpeg](image_rsrc3FE.jpg)


    A css rule applied to the paragraph element


    If you open up a style sheet to view the code in your browser, you''ll see that
    CSS rules don''t have any resemblance to HTML markup. Every CSS rule is basically
    made up of three things: selectors, properties and values. Ordinarily the property
    and value is always terminated by a semicolon(;).


    Here is the format every CSS rule follows:


    Selector {property: value;}


    And here is what each part of the CSS rule actually means:


    *   The selector is an HTML element that you want to apply formatting to. For
    example, the (<p>) paragraph tag can be used as a selector. A Web browser will
    then look for all the common elements in your Web page that match the selector
    and apply the code within the curly braces to your elements.


    *   The property simply identifies the type of formatting you want to apply to
    your HTML element. So here you can choose from colors, fonts, sizes and so forth.


    *   The value sets a value for the property. For example, if the property is color,
    then the value could be green or light blue.


    Selectors, properties and values are essentially the basic building blocks of
    CSS rules. Once you begin to understand these, you''re well on your way to becoming
    a style sheet guru.


    ## Creating an External Style Sheet


    a {


    color:red; text-decoration: none;


    }


    h1 {


    font-family: arial, sans-serif


    }


    Before you go any farther, save your file with the name style.css in your main
    HTML folder on your desktop. A style sheet can have whatever name you want but
    must always use the file name extension .css. Remember, always save the style
    sheet in the same folder as your HTML pages, otherwise your page will not display
    the formatting.


    Instead of embedding a style sheet directly into an HTML tag, you will be adding
    a link to the external .css style sheet from within the <head> portion of your
    document.


    In the colors.html file, simply remove the inline style that was added to the
    anchor link previously. For comparison purposes, below are the old colors.html
    file with inline style and new colors.html file without inline style:


    COLORS.HTML FILE WITH INLINE STYLE  ‒


