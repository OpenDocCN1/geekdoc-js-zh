    The main reason for using absolute units is to freeze the design of the web page
    so that it always looks the same, no matter how it''s viewed.


    When relative measurements are used, the web design may look different, depending
    on the users Web browser settings.


    Let''s look at an example.


    ![](image_rsrc3G1.jpg)


    There are two headers, one defined in absolute terms, and the other in relative
    terms.


    Older web browsers use to allow users to change the size of the fonts in their
    browsers to:


    - Largest

    - Larger

    - Medium

    - Smaller

    - Smallest


    The problem was that any font size defined in absolute terms would not increase
    in size because it was set in total measurements, and therefore would always appear
    the same size on the screen. The font size defined in relative terms would increase
    in size.


    If you increased the font size to "Largest", you’d see the relative header increase
    in size while the absolute header would stay at the same size.


    To some extent, web browsers have taken away the functionality of absolute measurements
    because they introduced a zoom feature instead of a font size feature. This then
    magnified all text, absolute or relative, to the same extent, throwing out some
    web designer''s carefully designed layouts.


    OK, let''s consider the units for measurements, and what they represent.


    The five absolute measurements are as follows:


    1. cm - centimeters

    2. mm - millimeters

    3. in - inches

    4. pc - picas (1/6 inch or 12 points)

    5. pt - points (1/72 inch)


    It should be noted that even if absolute measurements did work properly in browsers
    with the new zoom features, they would only ever work as desired if the browser
    knew the size of the screen, and the number of pixels the screen displayed. In
    many cases, the browser would have to guess! This, together with the more recent
    addition of zoom features, means that absolute measurements aren''t the best units
    to use when designing your pages so that we won’t be looking into these.


    It was important to mention absolute measurements in this book though, because
    I am sure you will come across them when you are exploring the CSS of your own
    (and other people''s) web pages.


    So relative measurements provide us with the best solution, especially when we
    don''t know what device the end user will be viewing the site on. For example,
    nowadays they could be browsing on a computer, a tablet, a Smartphone, or even
    some e-readers. With relative measurements, the font sizes will be comparable
    to the size of the screen, and therefore give the user the very best viewing experience.


    Here are the relative measurements in some detail:


    ## EX


    The `ex` is a measurement relative to the size of the font''s lowercase `x`. I
    never use this measurement so that we won’t be looking at it in this book.


    ## PX


    The `px` is a relative measurement in screen pixels.


    Pixels offer the designer the best control over layouts. You will see them used
    a lot for things like borders, margins, padding, plus height and width of screen
    regions when creating CSS layouts without tables.


    What pixels are not recommended for is text size. Most modern browser won’t have
    a problem, but some of the older ones won’t resize pixel-based text.


    ## Percentage


    Percentage measurements are always relative to another value. For example, if
    we want to increase the spacing between lines of a paragraph, you can define the
    `line-height` as a percentage (it will be a percentage of the font size).


    Say for example we have: `line-height: 150%`. This will create a space between
    the lines that is 150% of the font size. Therefore, if the font size is 10px,
    then the space between lines will be 15px. It is wise to define the `font-size`
    in your CSS file if using percentages, otherwise results can be unpredictable
    in the different browsers. This is because the `font-size` will be taken from
    the web browsers default CSS file.


    Here is an example showing line spacing using percentages:


    ![](image_rsrc3G2.jpg)


    (9.1.html and 9.1.css)


    ## EM


    The `em` is a relative measurement for the font size. Think of it as being the
    size of a capital "M" to help you remember it, though that isn''t entirely accurate,
    but it is an excellent way to memorize it.


    This is my preferred unit for defining text size. Because it''s a measurement
    relative to the font size, if we set a `font-size` of say 10px, then one `em`
    is equal to 10px. 2 `em` would be similar to 20px, and 1.5 `em` would be 15 px.


    To make this as easy as possible, it''s a good idea to define the font size in
    the style sheet as follows:


    Create a new style sheet.


    Click on the "New Selector" button, and then go to the "Simple" tab.


    Select `body` from the HTML Element list, and then click the "Add" button followed
    by "OK".


    You''ll see the following in your style sheet:


    ```

    body {


    }

    ```


    Whatever properties you enter will be the default properties for all elements
    on the page that appear between the `<body></body>` tags, i.e., everything.


    I can define a default `font-size` like this:


    ```

    body { font-size: 11px; }

    ```


    This would make the default font size 11px. Here is a web page where I have defined
    the default text size in this manner:


    ![](image_rsrc3G3.jpg)


    (9.2.html and 9.2.css)


    In some older browsers, if you choose a larger font size, these sizes will remain
    the same because we defined the default font as 20 px – an absolute measurement.
    However, since most browsers now use the zoom feature, this is less of a problem
    that it used to be. Nevertheless, just to be safe, we are probably better off
    defining the default `font-size` this way:


    ```

    body { font-size: 0.7em; }

    ```


    This would make the default text size 70% of the default text size. So just what
    is the default text size?


    Well, every browser has its own default CSS that it uses to display web pages.
    If you want to see what that size looks like in different browsers, create a style
    sheet that sets the body text size to 1em.


    ```

    body { font-size: 1.0em; }

    ```


    Then create a web page with some text on it that uses the style sheet, and view
    it in a few different browsers, or just look at 9.3.html and 9.3.css, as I have
    done this for you.


    Here is an excellent article on using `em` for sizing text. Richard Rutter uses
    percentages instead of `em` to define the default `font-size`:


    [http://clagnut.com/blog/348](http://clagnut.com/blog/348)


    # Chapter 12. CSS IDs and Classes


    ID selectors can only (or should only), be used ONCE on a web page, and identify
    ONE item on the page.


    By using an ID selector to reference two images on the page, I was breaking a
    CSS rule. I should have used a CLASS instead.


    ID Selectors and classes do mostly the same thing, BUT, an ID can only be used
    once on the page, whereas types can be used multiple times.


    Before we look at classes, let me give you an easy way to remember this:


    Your ID refers to YOU and you alone. No one else can have your ID.


    A class is a group of people so that a level can refer to multiple individuals.


    Therefore, an ID is only used once, and a class can be used multiple times.


    For this reason, we will use IDs for page elements that only occur once, e.g.,
    when we come to look at page layouts using CSS, we''ll define IDs for the page
    header area, the right and left margins, the main content section, and the footer.
    These are obvious choices, since each of those sections only occurs once per page.


    We will use classes whenever we want to reuse a style on a page more than once,
    for example, the alignment of images, font styling, and bullet points, etc.


    OK, we know that IDs and Classes can be used to override default display properties,
    but we still haven''t looked at how to create or use them yet. Let''s look at
    that now, so that you can start using them in your page designs.


    ## ID Selectors


    Start TopStyle and click on the "New Selector" button.


    Switch to the "advanced" tab, and you will see a pair of radio buttons (aka option
    buttons), labeled Class and ID.

