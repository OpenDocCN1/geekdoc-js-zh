    # Introduction


    HTML stands for Hypertext Markup Language. It’s a special language that web browsers
    understand. It’s basically a bunch of instructions about the structure of the
    document.


    Hypertext is probably the most important part of HTML letters because it means
    that you can link one document to another one. Hypertext is a text file that contains
    links to other text files.


    This is the foundation stone of web, which at the beginning wasn’t much more than
    few pages interconnected with links. Today, the web is no longer just about text.
    Most of it is created by Hypermedia including video, photos and music. But if
    you strip down all the bells and whistles, you will still find this fundamental
    functionality of mutual linking between documents at the core of any modern web
    application including Twitter, Gmail and even the project we are about to build.


    Markup means that HTML surrounds regular text with special code which tells the
    browser how to display the content of the document. It tells the browser what
    the structure of the document is.


    Language means that HTML has some special syntax or the rules you need to follow
    to create the correct content. Just like with other languages where subjects and
    verbs have a special place in the sentence, HTML tags have a special structure
    you need to use. For instance, when you need to nest tags, you must place the
    closing part of the tag correctly.


    When you build an HTML website, you actually need to learn different coding languages
    (even though it is called an HTML website). The structure or the core is provided
    by HTML, while CSS is about setting up the looks and the visual feel, in order
    to make your website appealing and pretty to look at. In order to make your website
    more dynamic and to add additional interaction with the user, you can use JavaScript.
    As you can see, in order to create a competitive website, you should at least
    learn the basics and how these languages work. 


    These days, people use many devices with different screen sizes and resolutions
    to browse the Internet, so it is very important to be able to change the visible
    content based on what kind of device the user is currently using. This is referred
    to as a responsive approach or responsiveness and we will dive into it when we
    talk about CSS.


    CSS provides styling for the structure. Let’s say you have a house with three
    rooms. One room is a kitchen, one room is a bedroom and one is a bathroom. Based
    on this description, you have a basic idea about the structure of the house, but
    you have no idea how big those rooms are and what are the colors of the walls.
    This is what CSS provides.


    When it comes to real-world websites, the structure of the content is not enough.
    You probably experienced this yourself. When you search on the Internet for a
    restaurant, would you rather visit the one with a very nice, professional looking
    website or the one with just a simple blank page with general, unformatted text?


    Regarding the content, they can both give you the same information as menu, opening
    hours, contact, and so on, but as you know, it''s the package that sells the product. 


    That''s why it''s crucial to focus on the styling of your content in a way that''s
    pleasing and useful for the visitor of your website.


    CSS (cascading style sheets) is technologies that will allow you to make your
    page look anything you want without the need to change the structure of the HTML
    document. 


    CSS is immensely powerful in transforming the styling of the website without ever
    touching the content and its HTML structure.


    Javascript provides the behavior. It gives HTML webpage event-driven functionality,
    like what will happen when the browser finishes loading the page or when the user
    clicks the Buy button on the web shop.


    Javascript is the third language you are about to learn in this book. It is one
    of the three languages every web developer must know and understand.


    As you already know, HTML defines the content of web pages, CSS specifies the
    layout and Javascript programs the behavior.


    People usually don''t appreciate the power of Javascript and this is probably
    caused by two main reasons.


    First, they lack the proper understanding of the language fundamentals. Second,
    Javascript doesn''t have a great reputation because in the early days of the web,
    the vendors of browsers implemented Javascript however they pleased. And this
    of course caused a lot of headaches to web developers, because they couldn''t
    be sure how their code would run in different browsers, if at all.


    Setting up frontend technologies is very easy. To get all three frontend technologies
    up and running, you need just one product, a web browser.

