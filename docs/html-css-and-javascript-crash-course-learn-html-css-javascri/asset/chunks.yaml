    Mozilla Firefox 或 Google Chrome 打开 `index.html` 文件，查看其效果……


    程序讨论


    首先，`frameset rows = "12%, 88%">` 将整个页面沿行方向分成两部分。


    通过 `frameset cols = "27%, 74%">` 将底部行沿列方向分成两个部分。


    `<frame src = "style.html" scrolling = "no">` 在第一个框架中显示 `style.html` 页面。


    `<frame src = "link.html">` 和 `<frame src = "textfor.html">` 分别安排在第 1 和第 2 个框架中显示
    `links.html` 和 `textfor.html` 页面。


    ## 内联框架


    内联框架是在一个网页中显示一个或多个网页的主要方式之一。它对于发布与演示主题相关的不同网页的链接很重要，而且如果能在较小的空间内滚动显示，那也不错。


    示例程序


    ```

    <html>

    <head>

    <title> [www.lifeguruji.tk](http://www.tutohost.com/)</title>

    </head>

    <body bgcolor=" #f00">

    <center>

    <h2 style="color:#f00">这是一个内联框架的示例。</h2><br/>

    <iframe src="[`www.lifeguruji.tk/bangla/html/`](http://www.tutohost.com/bangla/html/)"
    width="350" height="170">

    <p>此浏览器不支持内联框架。</p>

    </iframe>

    </center>

    </body>

    </html>

    ```


    打开记事本，输入上述代码，然后点击文件菜单中的“另存为”，保存为文件名：`index.html`，保存类型：所有文件，使用 Mozilla Firefox
    或 Google Chrome 打开 `index.html` 文件，查看其效果……


