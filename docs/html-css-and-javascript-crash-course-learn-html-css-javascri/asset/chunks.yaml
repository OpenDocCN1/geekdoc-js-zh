    | Set Font Size (Absolute) | <span style="font-size: 18pt;">define the font size</span>
    | <font size="5">define the font size</font> |


    | Increase Font Size (Relative) | <td style="font-size: 2em;">increase the size
    of the text</td> | <font size="+3">increase the size of the text</font> |


    | Decrease Font Size (Relative) | <span style="font-size: .6em;">decrease the
    size of the text</span> | <font size="-2">decrease the size of the text</font>
    |


    Table 1\. Setting Fonts


    pt vs. px vs. em


    When you are specifying font size, you can specify the size in one of three ways:


    *   pt gives you the absolute point size which is defined by the user''s client
    machine.


    *   px gives you the absolute pixel height, which is independent of machine (but
    can shrink with lower resolution and grow with higher resolution). This often
    used for setting borders and margins.


    *   em gives you the relative height, which is gives the height as the number
    of times the current height. This is a relative measure, depending on the current
    size.


    You choose what you need.


    ## Colors


    Colors on computer monitors are defined by light, not pigment, so the primary
    colors are red, green, and blue.  Also unlike pigments, combining all the colors
    of light results in a white light, whereas ![00034.jpeg](image_rsrc3FC.jpg)removing
    all the colors of light results in a black color.  Figure below shows how the
    primary colors mix, and how that mixture looks, at a very high level.


    Colors are specified one of two ways. First, you can use an actual color (red,
    blue, purple, etc.) Second, you can use a RGB (red, green blue) representation
    of the color by providing the red component, the green component, and the blue
    component, each a number from 0 (hexadecimal #00 – black) to 255 (hexadecimal
    #ff – bright). For example, to get this color of purple, you specify <span style="color:
    #880088">. You can also use decimal with an RGB function, like <span style="color:
    rgb(133, 0, 133)">.


