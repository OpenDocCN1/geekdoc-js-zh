    Web page development used to be relatively simple.  Developers simply write a
    Web page in HTML that can be accessed by other similar computers.  But times are
    changing in two ways.  First, Web sites are becoming vastly more complex, often
    with hundreds if not thousands of Web pages, dynamic HTML that adjusts to different
    users, and greater demands from the customer base.  Writing a page at a time can
    be a nightmare for developers, a problem for maintenance, and can cause inconsistencies
    across pages within a Web site that annoy the customers or viewer.


    Second, Web pages used to be accessed by a computer with a monitor, or even a
    laptop with a reasonable viewing area. Now we access Web pages with tablets, small
    web books, phones, and even black and white eBook readers (like that Amazon Kindle,
    pre-Fire). Viewers using non-computer devices can get very frustrated as the viewing
    area exceeds the screen by several thousand percent, or keystrokes are required,
    or data entry exists with no easy way to enter the data.  There is a wide diversity
    of browsers on the market now, but often, Web developers insist on developing
    for the 1024 x 768 pixel (or larger) computer monitor.


    Web developer or managers should try to make their Web pages as universally accessible
    and available to their viewers or client base as possible, including those who
    want to view content on a smaller device. This can be done with newer technology,
    newer formatting, and newer Web page validation that have not been available for
    that long.


    Previous versions of HTML (versions 3.2 and before) make use of the<font> tag
    and background tags for every HTML element, so that a table at the top of the
