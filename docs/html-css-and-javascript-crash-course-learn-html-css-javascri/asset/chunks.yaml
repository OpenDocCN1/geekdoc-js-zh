    8.  `Map()`: This one is responsible for helping us to create a brand new array
    with the results of calling up a provided function of all the elements that fall
    into this array.

    9.  `Pop()`: This one will help us remove the last element out of our array and
    then will return the item that we want.

    10. `Push()`: This one is nice because it is able to add in at least one, but
    sometimes more, elements to the end of your array and then will return to you
    the new length that this makes your array.

    11. `Reduce`: This will apply the function that you want at the same time against
    two values of the array, going from the left side over to the right side, in order
    to reduce it by one amount.

