    \n# Chapter 2. HTML Styles\n\n## Text Style\n\nText Style includes `font-family`,\
    \ `font-size`, `font-style`, `font-weight`, `font-variant`.\n\n| Font | Value\
    \ |\n| --- | --- |\n| font-family | Arial, Times New Roman, Courier New, Georgia,\
    \ Verdana |\n| font-size | 9px, 10px……Large |\n| font-style | normal, italic,\
    \ oblique |\n| font-weight | normal, bold, number |\n| font-variant | normal,\
    \ small-caps |\n\nText Style can be specified by `{ property: value }`.\n\n###\
    \ Example 6.1\n\n```html\n<html>\n<style type = \"text/css\">\n#f{ font-family:\
    \ Times New Roman; font-size: 28px; font-style: italic; font-weight: bold; font-variant:\
    \ normal }\n</style>\n<div id = \"f\">This is a text content using a different\
    \ style.</div>\n</html>\n```\n\nOutput:\n\nThis is a text content using a different\
    \ style.\n\nExplanation:\n\n`font-family`, `font-size`, `font-style`, `font-weight`,\
    \ `font-variant` specifies the text style for the font.\n\n## Spacing\n\nThe `line-height`\
    \ can specify line spacing. The `word-spacing` can specify word spacing. The `letter-spacing`\
    \ can specify letter spacing.\n\n### Example 6.2\n\n```html\n<html>\n<style type\
    \ = \"text/css\">\n#lineSpacing{ line-height:500% }\n#wordSpacing{ word-spacing:\
    \ 10px }\n#letterSpacing{ letter-spacing: 5px }\n</style>\n<p id = \"lineSpacing\"\
    >Line Spacing Sample.</p>\n<p id = \"wordSpacing\">Word Spacing Sample.</p>\n\
    <p id = \"letterSpacing\">Letter Spacing Sample.</p>\n</html>\n```\n\nOutput:\n\
    \n![00011.jpeg](image_rsrc3ER.jpg)\n\nExplanation:\n\n`line-height:500%` specifies\
    \ the line height as 500%. `word-spacing: 10px` specifies the word spacing as\
    \ 10px. `letter-spacing: 5px` specifies the letter spacing as 5px.\n\n## Divided\
    \ Style\n\nThe dividing `<div></div>` tags are used to group their content elements\
    \ as blocks. `<div>` tags are useful for styling purposes.\n\n```html\n| <div\
    \ class = “xxx”></div><div id = “xxx”></div> |\n```\n\nThe `<div>` tag can have\
    \ `id` and `class` attribute in css style.\n\n### Example 6.3\n\n```html\n<html>\n\
    <style type = \"text/css\">\n.d1{font-style: italic; color: purple;}\n#d2{font-family:\
    \ arial black; color: blue;}\n</style>\n<body>\n<div class = \"d1\"> <p>AAAAA</p>\
    \ <p>BBBBB</p> <p>CCCCC</p> \n</div>\n<div id = \"d2\"> <p>EEEEE</p> <p>FFFFF</p>\
    \ <p>GGGGG</p>\n</div>\n</body>\n</html>\n```\n\nOutput:\n\nAAAAA\n\nBBBBB\n\n\
    CCCCC\n\nEEEEE\n\nFFFFF\n\nGGGGG\n\nExplanation:\n\n`<div class = \"d1\"></div>`\
    \ is divided as the first group which contains three pairs of `<p>` tags. They\
    \ use `.d1` style. `<div id = \"d2\"></div>` is divided as the second group which\
    \ contains other three pairs of `<p>` tags. They use `#d2` style.\n\n## Span Style\n\
    \n`<span></span>` can be used to group elements for styling purposes (using the\
    \ `class` or `id` attributes).\n\n```html\n| <span class = “xxx”></span><span\
    \ id = “xxx”></span> |\n```\n\nThe `<span>` tag can have `id` and `class` attribute\
    \ in css style.\n\n### Example 6.4\n\n```html\n<html>\n<style type = \"text/css\"\
