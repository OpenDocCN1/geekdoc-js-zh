    | & | &amp; |\n| © | &copy; |\n| 空格 | &nbsp; |\n| ! | &#33; |\n\n# 第 3 章 HTML\
    \ 中的表单\n\n## Web 表单基础\n\n网页不仅仅是用来阅读文档和文章的，还用于社交和商业应用。你几乎无法想象任何类型的 Web 应用不需要向用户索取数据——只需想想最常见的功能，比如登录和注册。\n\
    \nHTML 表单自早期版本起就是标记的一部分，如今，经过几次与 HTML-XHTML 争论相关的曲折之后，我们在 HTML5 中拥有了一个精炼的表单模型，它仍然能在旧版浏览器中工作。\n\
    \n## Web 表单的工作原理\n\n![00067.jpeg](img/image_rsrc3EZ.jpg) 这展示了一个正在运行中的 Web 表单，其中包含用户界面组件——或者换个说法，控件。在这个表单中，不仅文本框、复选框和单选按钮是控件，标签、围绕各部分的边框以及注册按钮也都是控件。\n\
    \n运行中的 Web 表单\n\n要设计和编写 Web 表单，你需要了解它们的工作原理。以下是一个简化的概述：\n\n当浏览器显示一个 Web 表单时，它只是像渲染其他元素（如文本、菜单、图像等）一样渲染其控件。用户填写表单，然后点击提交按钮。表单的提交意味着浏览器收集用户输入的数据，将其放入\
    \ HTTP/HTTPS 请求中，并发送到服务器。当服务器端收到请求时，Web 服务器会找出要处理该请求的应用程序或模块类型，并将收集到的数据分派给它。接收请求的实体分析收集到的信息，并决定下一步做什么。\n\
    \n例如，如果请求包含注册数据，Web 服务器可能会将其存储在数据库中，并返回一条关于注册成功的消息。或者，如果数据无效（例如必填字段未填写），Web 服务器可能会返回原始表单，其中包含用户指定的数据，以及额外的标记，用于总结服务器应用程序发现的问题。\n\
    \n因此，这个过程包含以下基本步骤：\n\n1. 浏览器收集表单数据，并将其发送到 Web 服务器。\n2. Web 服务器处理数据，并将结果返回给浏览器。\n\
    3. 浏览器可视化结果（可能是一个网页、一条错误消息或其他类型的信息等）。\n\n当然，这个过程最困难的部分是步骤 2，它在服务器端执行。有许多服务器技术可以处理\
    \ Web 表单，但在本书中我们不会深入探讨，只会浅尝辄止。\n\n随着 Web 的发展以及用户对流畅体验的期望，出现了新的异步技术，例如 AJAX（异步\
    \ JavaScript 和 XML）。这些技术不期望 Web 服务器返回整个网页，而只返回页面的一部分——这部分受用户指定信息变化的影响。这种方法导致网络数据包更小，屏幕闪烁更少。异步技术的主要优点是它们可以在后台异步地向服务器发送数据和从服务器检索数据，而不会妨碍用户交互。\n\
    \n在本章中，你将专注于在客户端构建和使用 Web 表单。\n\n## 在 HTML 中表示 Web 表单\n\n关键的 HTML 元素是 `<form>`，它定义了页面内的一个\
    \ Web 表单。最简单的 Web 表单只需要几行标记：\n\n```\n<form action=\"ProcessAtServer.html\">\n\
    <input type=\"submit\" value=\"执行！\"/>\n</form>\n```\n\n![00068.jpeg](img/image_rsrc3F0.jpg)\
    \ 这个 `<form>` 包含一个带有 `type=\"submit\"` 属性的 `<input>` 标签，它表示一个提交按钮。`<form>` 的 `action`\
    \ 属性设置为 `ProcessAtServer.html`，因此当用户点击提交按钮时，表单的内容将被发送到该页面。当然，如下图所示，这个表单没有任何其他有用的元素，所以实际上没有信息要发送到\
    \ action 页面。\n\n一个非常简单且无用的 Web 表单\n\n那么，让我们创建一个带有几个实际输入字段的表单：\n\n```\n<form action=\"\
    #\">\n<input name=\"fname\" />\n<br />\n<input name=\"lname\" />\n<br />\n<input\
    \ type=\"submit\" value=\"执行！\"/>\n</form>\n```\n\n这个标记包含两个输入字段，名称分别为 `fname`（名）和\
    \ `lname`（姓）。它们对应的 `<input>` 标签没有 `type` 属性，因此这些字段将渲染为文本框。表单的 `action` 属性设置为 `#`，这会将表单数据发送到页面本身。\n\
    \n![00069.jpeg](img/image_rsrc3F1.jpg) 假设你将这段代码放入了 `form.html` 文件中。当你在浏览器中显示它时，你可以在文本框中输入数据，如下图所示。\n\
    \n一个带有两个输入字段的简单表单\n\n当你点击提交按钮时，表单会通过 Web 请求将数据发送到 `form.html` 文件。页面会再次显示，输入字段为空。只有浏览器的地址栏会告诉你，该页面是作为表单\
    \ Web 请求的结果而显示的，其 URL 类似于：\n\n`http://127.0.0.1:8080/?fname=John&lname=Smith#`\n\
    \n在 URL 中，你可以看到表单数据为 `?fname=John&lname=Smith`，表明这些信息是通过 URL 传递的。\n\n## 控件概述\n\
    \n在上面的这些小段标记中，你已经看到了一些控件，例如文本框和提交按钮，但还有更多。你将通过练习学习如何使用它们，但首先会给你一个简短的概述。\n\n那么，正如你已经知道的，`<form>`\
    \ 是封装所有控件的标记元素。大多数控件可以使用带有 `type` 属性的 `<input>` 元素来渲染。该属性指定了控件的类型，它决定了控件在浏览器中的渲染方式及其行为。如果你没有指定\
    \ `type`，控件将是一个文本框（这与将 `type` 设置为 `text` 相同）。你可以选择几种按钮类型，例如 `button`（可点击按钮，通常与\
    \ JavaScript 一起使用）、`checkbox`、`radio`（单选按钮）、`submit`（提交表单）、`image`（作为提交按钮的图像）和\
    \ `reset`（将所有表单值重置为默认值）。\n\n还有几个预定义的文本控件，带有一些额外的语义，例如 `password`（字符被掩码）、`email`（定义电子邮件地址的字段）、`url`（用于输入\
    \ URL 的字段）、`tel`（用于输入电话号码的字段）、`search`（用于搜索文本的字段）和 `number`（用于输入数字的字段）。类型 `file`\
    \ 提供了一个带有“浏览”按钮的文件选择字段，用于文件上传。你可以在表单中放置隐藏字段，用于通过编程方式设置表单值。\n\n"
