    ## CSS Forms


    HTML provides us with an easy way to create different types of forms that we can
    use to collect user information like their usernames, passwords, and email addresses.
    Some are subscription forms while others are survey forms. When we create an HTML
    form, its look is rigid and dull. Thanks to CSS, we can change that. We can make
    it look exceptionally well. Let’s create a form and then transform its look by
    adding some simple CSS properties. 


