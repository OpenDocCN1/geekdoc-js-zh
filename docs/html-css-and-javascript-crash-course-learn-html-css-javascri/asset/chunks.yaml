    \ 编写一个网页，其他类似的计算机即可访问。但时代在两个方面发生了变化。首先，网站变得极其复杂，通常包含数百甚至数千个网页，具有可适应不同用户的动态 HTML，以及来自客户群体的更高要求。一次编写一个页面对于开发人员来说可能是一场噩梦，是维护上的难题，并且会导致网站内各页面之间出现不一致，从而令客户或浏览者感到厌烦。\n\
    \n其次，网页过去是通过带有显示器的计算机，甚至是具有合理显示区域的笔记本电脑来访问的。现在，我们使用平板电脑、小型电子书、手机，甚至黑白电子阅读器（如早期的\
    \ Amazon Kindle）来访问网页。使用非计算机设备的浏览者可能会感到非常沮丧，因为显示区域可能会超出屏幕数千个百分点，或者需要敲击键盘，或者存在没有便捷输入方式的数据输入项。目前市场上浏览器种类繁多，但\
    \ Web 开发人员往往坚持针对 1024 x 768 像素（或更大）的计算机显示器进行开发。\n\nWeb 开发人员或管理人员应尽量使他们的网页对浏览者或客户群具有尽可能广泛的可访问性和可用性，包括那些希望在较小设备上查看内容的人。这可以通过较新的技术、较新的格式以及出现时间不长的较新网页验证来实现。\n\
    \n早期的 HTML 版本（3.2 及之前版本）为每个 HTML 元素使用 `<font>` 标签和背景标签，因此页面顶部的表格可能（且经常）与页面底部的表格具有不同的格式。结果是，许多\
    \ HTML 3.2 网页的外观截然不同。研究表明，这让用户感到厌烦。习惯于一个页面的用户在点击链接后，会面对一个全新的页面，具有全新的格式、全新的表单和表格颜色，以及整体全新的外观。HTML\
    \ 4.0 试图通过标准化每个页面的外观来改变这一点，通常是通过使用层叠样式表（也称为 CSS）。这就是 HTML 3.2（及之前）与 HTML 4.0（及之后）之间的概念差异。\n\
    \n![00033.jpeg](img/image_rsrc3FB.jpg)\n*Html 4.0 中的概念变化*\n\n这展示了我们如何通过单个 CSS\
    \ 来管理页面的格式。通过在网站的每个页面中使用同一个链接的 CSS，你不仅可以统一整个网站网页的外观，还可以通过仅定义一次页面元素（如表格、文本和列表）的格式，来简化维护并降低开发成本。\n\
    \n## Html 样式\n\n在 20 世纪 90 年代和 21 世纪初被认可的网页格式化方式已经不再流行。\n\n实现样式需要对 HTML 进行一些更改。为了使格式保持一致，你现在使用\
    \ `style` 属性来决定某个元素的外观。这导致了 HTML 语言的改变。旧的标签（如 `<font>` 标签）和旧的属性（如用于控制 HTML 元素外观的\
    \ `bgcolor` 或 `border`）现在被认为是已弃用或过时的。`style` 属性的格式如下：\n\n```html\n<tagname style=\"\
    attribute1: value1;\n                attribute2: value2;\n                attribute3:\
    \ value3;\">\n```\n\n你通常可以将 `style` 属性应用于几乎任何 HTML 标签（如 `<li>`、`<td>`、`<p>` 等）。但是，如果你正在输入，并且想要更改下一个段落或句子剩余部分的字体、颜色等，你可以使用\
    \ `<div>` 或 `<span>` 标签。`<div>` 标签在继续之前会换到下一行。`<span>` 标签则让你保持在同一行，并允许你使单行具有不同的字体、颜色等。例如，以下\
    \ `<div>` 标签展示了如何以红色显示文本：\n\n```html\n<div style=\"color: Red;\">\nThis text will\
    \ be red\n</div>\n```\n\n## 字体\n\n字体可以让你的页面拥有不同于默认字体的清爽外观。`style` 属性（或在 4.0 之前的旧版网页中使用\
    \ `<font>` 标签）用于控制 HTML 页面上显示的字体。表 1 显示了你可以使用 `style` 属性和大多数标签，或使用 `<span>` 标签或\
    \ `<div>` 标签（如果必须，也可以使用 `<font>` 标签）可以实现的一些操作。\n\n| | 当前/严格(新方式 -- HTML 4.0) |\
    \ 已弃用/过渡(旧方式 -- HTML 3.2) |\n| :--- | :--- | :--- |\n| 更改字体 (字体系列) | `<div style=\"\
    font-family: Comic Sans MS, Arial, Helvetica;\">浏览器将首先尝试 Comic Sans MS，然后是 Arial，最后是\
    \ Helvetica</div>` | `<font face=\"Comic Sans MS, arial,helvetica\">浏览器将首先尝试 Comic\
    \ Sans MS，然后是 Arial，最后是 Helvetica</font>` |\n| 设置字体大小 (绝对值) | `<span style=\"\
    font-size: 18pt;\">定义字体大小</span>` | `<font size=\"5\">定义字体大小</font>` |\n| 增大字体大小\
    \ (相对值) | `<td style=\"font-size: 2em;\">增大文本大小</td>` | `<font size=\"+3\">增大文本大小</font>`\
    \ |\n| 减小字体大小 (相对值) | `<span style=\"font-size: .6em;\">减小文本大小</span>` | `<font\
    \ size=\"-2\">减小文本大小</font>` |\n\n表 1. 设置字体\n\n### pt vs. px vs. em\n\n在指定字体大小时，你可以通过以下三种方式之一来指定大小：\n\
    \n* `pt` 提供绝对点大小，由用户的客户端机器定义。\n* `px` 提供绝对像素高度，独立于机器（但会随分辨率降低而缩小，随分辨率提高而增大）。这通常用于设置边框和页边距。\n\
    * `em` 提供相对高度，将高度表示为当前高度的倍数。这是一个相对度量，取决于当前大小。\n\n你可以根据需要选择。\n\n## 颜色\n\n计算机显示器上的颜色是由光而非颜料定义的，因此原色是红、绿、蓝。此外，与颜料不同，将所有光色结合在一起会产生白光，而\
    \ ![00034.jpeg](img/image_rsrc3FC.jpg) 移除所有光色则会产生黑色。下图从一个非常高的层面展示了原色如何混合以及混合后的效果。\n\
    \n颜色有两种指定方式。第一，你可以使用实际的颜色名称（red, blue, purple 等）。第二，你可以通过提供红色分量、绿色分量和蓝色分量来使用颜色的\
    \ RGB（红、绿、蓝）表示法，每个分量是一个从 0（十六进制 `#00` – 黑色）到 255（十六进制 `#ff` – 亮色）的数字。例如，要获得这种紫色，你指定\
    \ `<span style=\"color: #880088\">`。你也可以使用带有 `RGB` 函数的十进制，例如 `<span style=\"color:\
    \ rgb(133, 0, 133)\">`。\n\n与字体一样，颜色可以使用 `<font>` 标签来控制，但较新的标准建议使用 `style` 属性，可能结合\
    \ `<span>` 或 `<div>` 标签一起使用。表 6 显示了一些颜色操作的 HTML。\n\n| | 当前/严格(新方式 -- HTML 4.0)\
    \ | 已弃用/过渡(旧方式 -- HTML 3.2) |\n| :--- | :--- | :--- |\n| 设置颜色 | `<span style=\"\
    color: red\">将文本颜色改为红色</span>` | `<font color=\"red\">将文本颜色改为红色</font>` |\n\n"
