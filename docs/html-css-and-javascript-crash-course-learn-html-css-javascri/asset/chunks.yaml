    # Chapter 8. CSS


    A style sheet is a type of document that contains formatting rules. A Web browser
    will simply read these rules and apply the formatting to your page. Using style
    sheets allows you to control page elements such as borders, colors, and margins,
    and even to embed fonts that aren''t available locally on your computer.


    Style sheets are officially known as CSS (for Cascading Style Sheets). CSS is
    a separate language with its own syntax, but don''t let that frighten you. This
    language was specifically developed for formatting Web pages. It''s so powerful
    that with a single command you can alter the appearance of a Web page.


    You should always put your CSS rules into a separate file instead of embedding
    them directly into your Web page. The reason we do this is that it separates HTML
    code from your CSS rules and makes updating code much easier in the long run.


    Before the introduction of CSS, Web designers looked for other ways to change
    the layouts on their Web pages. One such way was using table tags--a separate
    set of HTML tags that are used to make tables, table headers, table row, and so
    forth. But table tags were often misused. Instead of adding structure to a page,
    they were often being used to layout Web pages. And back before CSS, making changes
    to a large Web site with table tags or other formats was just difficult, time
    consuming and expensive, because you had to edit each page of a site individually.


    CSS was specifically developed to eliminate the difficulties, expense, and time
    involved in using table tags. Just by editing a single CSS file you can instantly
    make changes to a large and complex Web site. For example, you can create a CSS
    rule to format font sizes, and every page on your Web site will then be updated
    to reflect those specific changes.


    ## Your First Style Sheet


    Now we should put all of the things we''ve learned together and create your first
    CSS (Cascading Style Sheet).


    If you''re familiar with Web and have visited many Web sites, you''ll know that
    your browser displays text links in blue and with an underline. (This is the browser''s
    default (automatic) format display for text links.) But what if the blue links
    are at odds with the general look and feel of your own Web page?


    You can build a style sheet rule that will change the text color of the link on
    your Web page. To do this, you simply have to use a CSS style attribute and declare
    it within an HTML element. Here is an example:


    ```html

    <a href="#" style:"color: red;"> Click Here </a>

    ```


    A style attribute is made up of two parts: a property name and a value. Here is
    the format every attribute follows and how it looks as code:


    ```html

    <style: property; name: value;>

    ```


    In this example, the property specifies the type of formatting that is applied
    to your HTML element. Here "color" is the property, which sets the color of the
    anchor link. The value is the actual name of the color ‒ "red. In another example
    of a CSS style attribute, the property name might be "font" and the value could
    be the "size" of font.


    This CSS rule is commonly known as a statement. A statement is simply a piece
    of code; here, all it does is specifying the style property as color and make
    the anchor link ("Click Here") red (the color "value").


    Create a new document in Sublime Text 2 by selecting File | New. Now type this
    code exactly as you see here:


    ```html

    <!doctype html>

    <html>

    <head>

    <title> My First Style Sheet </title>

    <meta charset="UTF-8" />

    </head>

    <body>

    <p> <a href="#" style="color:red; text-decoration:none;">

    Click Here </a> </p>

    </body>

    </html>

    ```


    Once you''ve done this, save your file with the name `colors.html` in your HTML
    folder on your desktop. Now preview your file in your Web browser to check your
    work.


    To remove the standard underlined text from your anchor link, use the `text-decoration`
    attribute and the value `none` (see example above, after `color: red`). The `text-decoration`
    is used to set the appearance of text – you can remove underlines, underline standard
    text, add a line above or through the middle of text and make the text blink.


    The `text-decoration` attribute has the following possible values: `underline`,
    `line-through`, `over line`, `none` and `blink`. Here is an example of code for
    text decoration that makes the text blink:


    ```css

    text-decoration: blink;

    ```


    Open up the Web page we''ve just been working on called `colors.html` and add
    the other values to the `text-decoration` attribute. Preview the file in your
    Web browser to see how your work is displayed.


    ```html

    <p> <a href="#" style="color:red; text-decoration:blink;">

    Click Here </a> </p>

    ```


    Try experimenting yourself by adding the values: `underline`, `line-through` and
    `over line` to the `text-decoration` attribute and see what happens.


    ## Inline Styles


    Inline styles allow you to insert a property name and value of a style sheet right
    into an HTML tag. But you should try to avoid using this approach if you can.
    As Inline styles mix formatting with HTML markup, and it becomes difficult to
    make changes to your Web page: every style on a page must be hunted down in the
    source code ‒ as you''ll soon see.


    So here is our earlier example used to format an anchored link:


    ```html

    <a href="#" style="color:red; text-decoration:none;"> Click Here </a>

    ```

