  trans: "\n\n`border-right-image`\n\n`border-bottom-image`\n\n`border-left-image`\n\
    \n| 值 | 描述 |\n| --- | --- |\n| `border-image-source` | 图像的路径 |\n| `border-image-slice`\
    \ | 图像的高度和宽度偏移 |\n| `border-image-width` | 图像的宽度 |\n| `border-image-outset` |\
    \ 图像的高度 |\n| `border-image-repeat` | 图像应重复还是拉伸 |\n\n## 将文本环绕在图像周围\n\n你可以使用 `float`\
    \ 属性将文本环绕在图像周围。\n\n### CSS 规则\n\n```css\n.caution {\n  float: left;\n  margin-right:\
    \ 10px;\n}\n```\n\n### 用法\n\n```html\n<p><img class=\"caution\" src=\"caution.jpg\"\
    \ />\ncaution caution caution</p>\n```\n\n![](img/image_rsrc3FS.jpg)\n\n`margin-left`\
    \ 属性可用于在图像和文本之间添加间距。\n\n## 将文本放置在图像上方\n\n你可以为 `position`、`top` 和 `left` 属性分配负值，以将文本定位在图像上方。如果版本位于图片下方，将其\
    \ `top` 属性设置为负值会将文本移动到图片上方。\n\n### CSS 规则\n\n```css\n.overlap {\n  position: relative;\n\
    \  top: -200px;\n  left: 180px;\n  color: #ffffff;\n}\n```\n\n### 用法\n\n```html\n\
    <img src=\"sample.jpg\" />\n<p class=\"overlap\">floating text</p>\n```\n\n![](img/image_rsrc3FT.jpg)\n\
    \n## 为图像添加边框\n\n边框最常用于表格，但你也可以使用 `border` 属性为图像添加边框。\n\n```css\nimg {\n  border-width:\
    \ 3px;\n  border-style: solid;\n  border-color: #000000;\n}\n```\n\n![](img/image_rsrc3FU.jpg)\n\
    \n你也可以使用 CSS 简写来指定边框：\n\n```css\nimg { border: 1px solid #000000; }\n```\n\n上面的示例将为所有图像添加边框。如果你只想将边框应用于指定的图像，可以创建一个类。\n\
    \n```css\n.imgBorder { border: 1px solid #000000; }\n```\n\n```html\n<img class=“imgBorder”\
    \ src=“sampleImage.jpg” />\n```\n\n或者，你可以将边框应用于 `div` 标签内的所有图像：\n\n### CSS 规则\n\
    \n```css\n#menuBar img { border: 1px solid #000000; }\n```\n\n### 用法\n\n```html\n\
    <div id=“menuBar”><img src=“sampleImage.jpg” /></div>\n```\n\n## 为图像添加投影\n\n你可以使用\
    \ Internet Explorer 的 `filter` 属性为图像添加投影。\n\n```css\nimg {\n  filter: progid:DXImageTransform.Microsoft.dropShadow\
    \ (offX='3', offY='5', color='#c0c0c0', positive='true');\n}\n```\n\n![](img/image_rsrc3FV.jpg)\n\
    \n`filter` 属性由 Microsoft 创建，并非 CSS 推荐标准的一部分。它仅受 Internet Explorer 支持。\n\n有关 Internet\
    \ Explorer 滤镜的更多信息，请参阅“如何使用 Internet Explorer 的滤镜？”\n\n对于其他浏览器，可以使用 `box-shadow`\
    \ 属性为图像添加投影。但是，它不会在透明图像内部添加投影。\n\n![](img/image_rsrc3FW.jpg)\n\n另一种选择是使用 HTML5\
    \ 的 `canvas` 元素。有关示例，请参见以下网站：[philip.html5.org/demos/canvas/shadows/various.html](http://philip.html5.org/demos/canvas/shadows/various.html)\n\
    \n## 使图像透明\n\n也可以使用 `opacity` 属性使图像透明。对于 Internet Explorer，你可以使用 IE 特有的 `alpha`\
    \ 滤镜。\n\n![](img/image_rsrc3FX.jpg)\n\n```css\nimg {\n  filter:alpha(opacity=50);\n\
    \  opacity:.50;\n}\n```\n\n## 移除图像链接的边框\n\n你可以将图像的 `border` 属性设置为“0”，以移除默认情况下出现在图像链接周围的边框。\n\
    \n```css\nimg { border: 0; }\n```\n\n## 如何在用户悬停时缩放图像？\n\n你可以使用 `hover` 伪类来更改图像的\
    \ `width` 和 `height`。\n\n首先，在图像周围包裹一个链接：\n\n```html\n<a href=\"javascript:void(0);\"\
    >\n  <img src=\"clickstart.jpg\" />\n</a>\n```\n\n然后，当用户悬停在图像链接上时，指定图像的 `width`\
    \ 和 `height`：\n\n```css\na:hover img { width: 800px; height: 400px; }\n```\n\n\
    在此示例中，当用户悬停在图像上时，图像将扩展到 800x400，当鼠标移开图像时，它将恢复为原始大小。\n\n## 使图像在悬停时展开\n\n你可以使用 `transition`\
    \ 属性使图像在用户悬停时展开，在失去焦点时缩小。例如，你可以提供一个图像的“缩略图”，当用户悬停时展开为完整大小。\n\n### CSS 规则\n\n```css\n\
    .thumbTrans {\n  width: 50px;\n  height: 50px;\n  -moz-transition-property: width,height;\n\
    \  -moz-transition-duration: 4s;\n  -moz-transition-delay: 1s;\n  -webkit-transition-property:\
    \ width,height;\n  -webkit-transition-duration: 4s;\n  -webkit-transition-delay:\
    \ 1s;\n  -o-transition-property: width,height;\n  -o-transition-duration: 4s;\n\
    \  -o-transition-delay: 1s;\n  transition-property: width,height;\n  transition-duration:\
    \ 4s;\n  transition-delay: 1s;\n}\n\n.thumbTrans:hover {\n  width: 100%;\n  height:\
    \ 100%;\n  -moz-transition-property: width,height;\n  -moz-transition-duration:\
    \ 4s;\n  -moz-transition-delay: 1s;\n  -webkit-transition-property: width,height;\n\
    \  -webkit-transition-duration: 4s;\n  -webkit-transition-delay: 1s;\n  -o-transition-property:\
    \ width,height;\n  -o-transition-duration: 4s;\n  -o-transition-delay: 1s;\n \
    \ transition-property: width,height;\n  transition-duration: 4s;\n  transition-delay:\
    \ 1s;\n}\n```\n\n## 使图像在悬停时“弹出”\n\n你可以使用 `hover` 伪类来旋转图像并添加阴影。\n\n```css\nimg:hover\
    \ {\n  box-shadow:1px 2px 5px #666666;\n  -moz-transform:rotate(5deg) scale(1.5);\n\
    \  -webkit-transform:rotate(5deg) scale(1.5);\n  transform:rotate(5deg) scale(1.5);\n\
    }\n```\n\n![](img/image_rsrc3FY.jpg)\n\n## 使用 CSS 插入内容\n\n也可以使用 `content` 属性在元素之前或之后插入内容。\n\
    \n要在页面顶部或底部插入内容：\n\n```css\nbody:before {\n  content: \"Confidential\";\n  font-weight:\
    \ bold;\n}\n\nbody:after {\n  content: \"\\000A Copyright 2012\";\n}\n```\n\n\
    要在元素之前插入内容：\n\n```css\nh1:before {\n  content: \">> \";\n  color: silver;\n}\n\
    ```\n\n要在元素前后添加引号：\n\n```css\np.quotes:before { content: open-quote; }\np.quotes:after\
    \ { content: close-quote; }\n```\n\n要添加花括号引号：\n\n```css\np.boldCurlyQuotes { quotes:\
    \ \"\\201C\" \"\\201D\"; }\np.boldCurlyQuotes:before { content: open-quote; }\n\
    p.boldCurlyQuotes:after { content: close-quote; }\n```\n\n下表提供了可使用 `content` 属性插入的常用字符的\
    \ Unicode 值。\n\n| 符号 | 描述 | Unicode 值 |\n| --- | --- | --- |\n| `\"` | 双引号 | `0022`\
    \ |\n| `'` | 单引号（撇号） | `0027` |\n| `“` | 左双花括号引号 | `201C` |\n| `”` | 右双花括号引号 |\
    \ `201D` |\n| `<` | 左单尖括号引号 | `003C` |\n| `>` | 右单尖括号引号 | `003E` |\n| `«` | 左双尖括号引号\
    \ | `00AB` |\n| `»` | 右双尖括号引号 | `00BB` |\n| `` ` `` | 重音符 | `0060` |\n| `´` |\
    \ 尖音符 | `00B4` |\n\n# 第 11 章 长度单位\n\n当你跟随本教程时，可能已经注意到，在使用 CSS 更改文本大小时，有多种选项。\n\
    \n你可以在 TopStyle 中亲自查看。\n\n创建一个新的样式表，然后单击“新建选择器”按钮。选择“简单”选项卡，并从 HTML 元素列表中选择 `h1`。接下来单击“添加”按钮，然后点击“确定”。\n\
    \n![](img/image_rsrc3FZ.jpg)\n\n在样式检查器中，向下滚动到字体类别，并单击 `font-size` 属性。单击此行右侧的下拉箭头以查看可用选项：\n\
    \n在本书中，我们将重点介绍此列表中的前两项——百分比和长度。\n\n百分比是相对度量（即，它定义了一个相对于另一个尺寸的大小）。\n\n长度是绝对度量，因为它定义了精确的尺寸。然而，精确的度量需要单位。\n\
    \n绝对度量的单位是什么？\n\n好吧，让我们来了解一下。单击 `font-size` 下拉箭头，然后选择长度。\n\n另一个对话框打开，其中包含另一个下拉框（默认设置为\
    \ `'px'`）。\n\n![](img/image_rsrc3G0.jpg)\n\n单击该下拉框的下拉箭头，你将看到更多选项：\n\n哇！这么多不同的单位。\n\
    \n这些单位可以分为两组：\n\n1. 相对单位（大小与某物可比）\n2. 绝对单位（大小是精确度量）\n\n“相对”单位包括：\n\n- `ex`\n-\
    \ `em`\n- `px`\n\n（百分比单位也是相对的）。\n\n“绝对”单位包括：\n\n- `cm`\n- `mm`\n\n"
