    border-bottom-image


    border-left-image


    | Value | Description |


    | border-image-source | Path to the image |


    | border-image-slice | The image''s height and width offset |


    | border-image-width | The image''s width |


    | border-image-outset | The image''s height |


    | border-image-repeat | Whether the image should be repeat or stretch |


    Wrapping text to an image


    You can use the float property to wrap text around an image.


    CSS rule


    .caution {


    float: left;


    margin-right: 10px;


    }


    Usage


    <p><img class="caution" src="caution.jpg" />


    caution caution caution</p>


    ![](image_rsrc3FS.jpg)


    The margin-left property can be used to add space between the image and the text.


    Placing of text on top of image


    You can assign negative values to the position, top, and left properties to position
    text on top of an image. If the version is below the picture, setting its top
    property to a negative value will move the text on top of the film.


    CSS rule


    .overlap {


    position: relative;


    top: -200px;


    left: 180px;


    color: #ffffff;


    }


    Usage


    <img src="sample.jpg" />


    <p class="overlap">floating text</p>


    ![](image_rsrc3FT.jpg)


    Adding a border around the image


    Borders are most often used with tables, but you can also add borders around images
    using the border properties.


    img {


    border-width: 3px;


    border-style: solid;


    border-color: #000000;


    ![](image_rsrc3FU.jpg)}


    You can also use CSS shorthand to specify borders:


    img { border: 1px solid #000000; }


    The examples above will add a border to all images. You can create a class if
    you want to apply borders only to specified images.


    .imgBorder { border: 1px solid #000000; }


    <img class=“imgBorder” src=“sampleImage.jpg” />


    Or, you can apply a border to all images inside a div tag:


    CSS rule


    #menuBar img { border: 1px solid #000000; }


    Usage


    <div id=“menuBar”><img src=“sampleImage.jpg” /></div>


    Adding a drop shadow to an image


    You can use Internet Explorer’s filter property to add a drop shadow to an image.


    img {


    filter: progid:DXImageTransform.Microsoft.dropShadow (offX=''3'', offY=''5'',
    color=''#c0c0c0'', positive=''true'');


    }


    ![](image_rsrc3FV.jpg)


    The filter property was created by Microsoft and is not a part of the CSS recommendation.
    It is only supported by Internet Explorer.


    For more information about Internet Explorer filters, see “How do I use Internet
    Explorer''s filters?”


    For other browsers, you can use the box-shadow property can be used to add a drop
    shadow around an image. However, it will not add the drop shadow inside transparent
    images.


    ![](image_rsrc3FW.jpg)


    Another option is to use HTML5''s canvas element. See the following website for
    an example: [philip.html5.org/demos/canvas/shadows/various.html](http://philip.html5.org/demos/canvas/shadows/various.html)


    Making an image transparent


    Using the opacity property to make an image transparent can also be done. For
    Internet Explorer, you can use the IE-specific alpha filter.


    ![](image_rsrc3FX.jpg)


    img {


    filter:alpha(opacity=50);


    opacity:.50;


    }


    Removing link borders from an image


    You can set an image’s border property to “0” to remove the border that appears
    around image links by default.


    img { border: 0; }


    How do I zoom images when the user hovers over them?


    You can use the hover pseudo class to change an image’s width and height.


    First, wrap a link around the image:


    <a href="javascript:void(0);">


    <img src="clickstart.jpg" />


    </a>


    Then, specify the image’s width and height when the user hovers over the image’s
    link:


    a:hover img { width: 800px; height: 400px; }


    In this example, the image will expand to 800x400 when the user hovers over the
    image, and when the mouse moves from the image it will return to its original
    size.


    Making image expand on hover


    You can use the transition property to make an image expand when the user hovers
    over it and shrink when it loses focus. For example, you could provide a "thumbnail"
    of an image that expands to full-size when the user hovers over it.


    CSS rule


    .thumbTrans {


    width: 50px;


    height: 50px;


    -moz-transition-property: width,height;


    -moz-transition-duration: 4s;


    -moz-transition-delay: 1s;


    -webkit-transition-property: width,height;


    -webkit-transition-duration: 4s;


    -webkit-transition-delay: 1s;


    -o-transition-property: width,height;


    -o-transition-duration: 4s;


    -o-transition-delay: 1s;


    transition-property: width,height;


    transition-duration: 4s;


    transition-delay: 1s;


    }


    .thumbTrans:hover {


    width: 100%;


    height: 100%;


    -moz-transition-property: width,height;


    -moz-transition-duration: 4s;


    -moz-transition-delay: 1s;


    -webkit-transition-property: width,height;


    -webkit-transition-duration: 4s;


    -webkit-transition-delay: 1s;


    -o-transition-property: width,height;


    -o-transition-duration: 4s;


    -o-transition-delay: 1s;


    transition-property: width,height;


    transition-duration: 4s;


    transition-delay: 1s;


    }


    Making an image ‘pop-out’ on hover


    You can use the hover pseudo class to rotate images and add a shadow.


    img:hover {


    box-shadow:1px 2px 5px #666666;


    -moz-transform:rotate(5deg) scale(1.5);


    -webkit-transform:rotate(5deg) scale(1.5);


    transform:rotate(5deg) scale(1.5);


    }


    ![](image_rsrc3FY.jpg)


    Inserting content using CSS


    Using the content property to insert content before or after an element can also
    be done.


    To insert content at the top or bottom of the page:


    body:before {


    content: "Confidential";


    font-weight: bold;


    }


    body:after {


    content: "\000A Copyright 2012";


    }


    To insert content before an element:


    h1:before {


    content: ">> ";


    color: silver;


    }


    To add quotes before and after an element:


    p.quotes:before { content: open-quote; }


    p.quotes:after { content: close-quote; }


    To add curly quotes:


    p.boldCurlyQuotes { quotes: "\201C" "\201D"; }


    p.boldCurlyQuotes:before { content: open-quote; }


    p.boldCurlyQuotes:after { content: close-quote; }


    The following table provides the Unicode values for commonly-used characters that
    can be inserted using the content property.


    | Symbol | Description | Unicode value |


    | " | double quotation | 0022 |


    | '' | single quotation (apostrophe) | 0027 |


    | “ | double left curly quotation | 201C |


    | ” | double right curly quotation | 201D |


    | < | single left angle quotation | 003C |


    | > | single right angle quotation | 003E |


    | « | double left angle quotation | 00AB |


    | » | double right angle quotation | 00BB |


    | ` | grave accent | 0060 |


    | ´ | acute accent | 00B4 |


    # Chapter 11. Length Units


    As you have followed this tutorial, you may have noticed that when you change
    the size of text using CSS, there are a number of options.


    You can see this for yourself in TopStyle.


    Create a new style sheet, and click the "New Selector" button.  Select the "Simple"
    tab and select h1 from the HTML elements list. Next click the "Add" button, followed
    by "OK".


    ![](image_rsrc3FZ.jpg)In the style inspector, scroll down to the font category
    and click on the font-size property.  Click the downward arrow on the right of
    this row to view the options available:


    In this book, we will concentrate on the first two items in this list – Percentage
    and Length. 


    Percentage is a relative measurement (i.e.,  it defines a size that is relative
    to another one).


    Length is an absolute measurement, since it defines an exact analysis.  However,
    with precise measurements come units. 


    What are the units for an absolute measurement?


    Well, let''s find out.  Click on the font-size dropdown arrow, and select length.


    Another dialogue box opens up, with another dropdown box (set to the default ''px''). 


    ![](image_rsrc3G0.jpg)Click on the down arrow of that dropdown box, and you''ll
    see several more options:


    WOW!  That’s a lot of different units.


    These units can be divided into two groups:


    1.    relative units (size is comparable to something)


    2.    absolute units (size is an exact measurement)


    The ''relative'' units are:


    -      ex


    -      em


    -      px


    (The percentage unit is also relative).


    The ''absolute'' units are:


    -      cm


    -      mm'
