    \ like this:\n\n![00003.jpeg](image_rsrc3FH.jpg)\n\n# Chapter 10. Image Manipulation\
    \ in CSS\n\nYou can add images to your documents using the `img` tag, or you can\
    \ add a background image to the entire document.\n\nSetting an image as background\
    \ for a website.\n\nYou can use `body` tag’s `background-image` property to set\
    \ a background image for the entire page.\n\n```css\nbody { background-image:\
    \ url('draft.gif'); }\n```\n\n![](image_rsrc3FJ.jpg)\n\nPositioning the background\
    \ Image\n\nUse the `background-position` property to specify where your background\
    \ image will appear.\n\n```css\nbody {\nbackground-image: url('draft.gif');\n\
    background-position: bottom right;\nbackground-repeat: no-repeat;\n}\n```\n\n\
    ![](image_rsrc3FK.jpg)\n\nYou can use the following keyword combinations with\
    \ the `background-position` property:\n\n| Keywords | | |\n| --- | --- | --- |\n\
    | top left | center left | bottom left |\n| top center | center center | bottom\
    \ center |\n| top right | center right | bottom right |\n\nThese keywords can\
    \ be written in either order. For example, “top left” and “left top” will both\
    \ work correctly. The other value will default to center if you only specify a\
    \ single value.\n\nYou can also use percentages to set the position.\n\n`background-position:\
    \ 30% 80%;`\n\nIf you want to position the image in the top left `0% 0%` is the\
    \ value, and `100% 100%` would place it in the bottom right. Setting the `background-position`\
    \ to `50% 50%` would center the image, as would `center center`.\n\nThe following\
    \ list shows how keyword settings match percentage settings:\n\n| Keywords | Percentages\
    \ |\n| --- | --- |\n| left top | 0% 0% |\n| center top | 50% 0% |\n| right top\
    \ | 100% 0% |\n| left center | 0% 50% |\n| center center | 50% 50% |\n| right\
    \ center | 100% 50% |\n| left bottom | 0% 100% |\n| center bottom | 50% 100% |\n\
    | right bottom | 100% 100% |\n\nIf you use keywords or percentages, your background\
    \ image’s position will adjust to the size of the window. You can also use pixels\
    \ to set a non-adjusting position:\n\n`background-position: 20px 20px;`\n\nAdjusting\
    \ background color or image position.\n\nYou can use the `background-clip` property\
    \ to specify whether the background includes the border, padding, or only the\
    \ content.\n\n| `div {padding:10px;border: 5px dotted #000;background-color: #f00;background-clip:border-box;}`\
    \ | ![](image_rsrc3FM.jpg) |\n| --- | --- |\n| `div {padding:10px;border: 5px\
    \ dotted #000;background-color: #f00;background-clip:padding-box;}` | ![](image_rsrc3FN.jpg)\
    \ |\n| `div {padding:10px;border: 5px dotted #000;background-color: #f00;background-clip:content-box;}`\
    \ | ![](image_rsrc3FP.jpg) |\n\nAdding more than one image to the background\n\
    \nWith CSS3, you can specify multiple background images. If you are supporting\
    \ old browser versions, you can specify one background image with the `html` tag\
    \ and another with the `body` tag.\n\nCSS approach\n\n```css\nbody {\nbackground-image:\
    \ url('logo.gif'), url('draft.gif');\nbackground-position: bottom right, 50% 50%;\
    \ \nbackground-repeat: no-repeat;\n}\n```\n\n![](image_rsrc3FR.jpg)\n\nOlder browser\
    \ version approach\n\n```css\nhtml {\nbackground-image: url('logo.gif');\nbackground-position:\
    \ bottom right;\nbackground-repeat: no-repeat;\n}\nbody {\nbackground-attachment:\
    \ fixed;\nbackground-image: url('draft.gif');\nbackground-position: 50% 50%;\n\
    background-repeat: no-repeat;\n}\n```\n\nFixing a background image to avoid scrolling\n\
    \nYou can use the `background-attachment` property to fix an image in place and\
    \ prevent it from scrolling with rest of the page’s content.\n\n```css\nbody {\n\
    background-attachment: fixed;\nbackground-image: url('draft.gif');\nbackground-position:\
    \ 50% 50%;\nbackground-repeat: no-repeat;\n}\n```\n\n| Value | Description |\n\
    | --- | --- |\n| repeat | The background repeats horizontally and vertically.This\
    \ is the default setting. |\n| repeat-x | The background repeats horizontally\
    \ but not vertically. |\n| repeat-y | The background repeats vertically bit not\
    \ horizontally. |\n| no-repeat | The background does not repeat horizontally or\
    \ vertically. |\n\nHow do I resize a background image to fit an element?\n\nYou\
    \ can use the `background-size` property to resize a background image to fit a\
    \ larger or smaller element automatically.\n\n| Value | Description |\n| --- |\
    \ --- |\n| contain | Scales the image so the height and width fit in the element\
    \ |\n| cover | Scales the image so the height or width fits (whichever is smaller)\
    \ |\n| length | Sets the height and width. If you only specify one value, the\
    \ image is sized proportionally. |\n| percentage | Sets the height and width as\
    \ a percentage of the parent element. If you only specify one value, the image\
    \ is sized proportionally. |\n\nAdding a shadow to the image\n\nYou can use the\
    \ `box-shadow` property to add a shadow to images.\n\n`img { box-shadow: 5px 5px\
    \ 10px 10px #f00; }`\n\nYou can specify the following options for the shadow:\n\
