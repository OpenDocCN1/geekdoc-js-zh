    # Chapter 15. Introduction To JavaScript


    HTML is used to develop web pages, and web pages can become complex documents
    that define the content of a page. Materials produced using HTML can get CSS added
    to it, and done in different ways like attaching a background color, changing
    font sizes, image size, typeface, shadow, colour intensity, and so on. HTML and
    CSS can be used to attain a static beauty of a web page. With JavaScript, you
    can inject life into web pages using JavaScript effects such as form validation,
    modal, slider, pop up, and so on. The practice of developing web pages or applications
    with HTML, CSS, and JavaScript is called Frontend development, and it enhances
    the user’s interaction with web pages. JavaScript is a well-built client-side
    scripting language. JavaScript is also generally used for mobile and game application
    development.


    ## A Brief History of JavaScript


    ·         1995: While working at Netscape, "LiveScript" was created by Brendan
    Eich and later renamed to "JavaScript."


    ·         1996: Javascript released by Microsoft, a port, for IE3.


    ·         1997: JavaScript became standardized in the "ECMAScript" spec.


    ·         2005: "AJAX" was coined, and the web 2.0 age began.


    ·         2006: jQuery 1.0 was released.


    ·         2010: node.JS was released.


    ·         2010: angular.JS was released.


    ·         2012: ECMAScript Harmony spec nearly finalised.


    Several programmers tend to believe that JavaScript and Java belong to the same
    category, and this opinion is false because Java and JavaScript are different
    from each other. Java is a sophisticated programming language, while JavaScript
    is a scripting language only. The C programming language influences the JavaScript
    Syntax.


    What does the future hold for JavaScript?


    The technologies of HTML5 and JavaScript can be used to create extensions for
    Windows 8 desktop widgets, browsers, Chrome OS, and Firefox OS applications. A
    large number of non-web related applications also adopt the scripting language
    of JavaScript, and it can be used to create HTML templates (Mustache), attach
    activities to PDF documents, database interaction (MongoDB), and also control
    (Cylon.js). JavaScript has a bright future because web platforms continue to mature
    and advance its usage beyond only browsers. This scripting language will remain
    an integral part of future developments.


    How to Run JavaScript?


    JavaScript is a scripting language that cannot run on its own. The browser does
    the code running of JavaScript. When a user requests an HTML page that contains
    JavaScript, the browser receives the script, and then the browser gets to decide
    its execution. All modern browsers support JavaScript, which is a massive advantage
    for the scripting language. JavaScript also runs on operating systems like Linux,
    Mac, and Windows.


    ### Requirements to Learning JavaScript


    ●       Basic knowledge of HTML and CSS


    ●       A text editor


    ●       A browser


    ●       Logical thinking and tenacity


    Programming


    Computer programming is the act of implementing and creating a different set of
    rules to allow a computer to perform a specific task. It is the process of speaking
    the computer language, which involves picking an algorithm and encoding it into
    a notation so that the computer can get it executed.


    Types of Programming Languages


    1\. Low-level language


    • Machine code


    • Assembly language


    2\. High-level language


    Inscribed in different languages such as Java, PHP, C, C++, JavaScript, C#, Python,
    etc. Computer programs can be either interpreted or compiled language, although
    JavaScript is an excellent example of Interpretation.


    Keeping Them Separate


    HTML: It defines the page content.


    CSS: It determines the content’s presentation.


    JavaScript: It controls content characters.


    When these technologies are used in developing a web page, they must be stored
    differently.


    1\. Create a separate .html file for HTML


    2\. Create a separate .css for CSS


    3\. Create a separate .js for JavaScript


    The Wrong Approach


    <p>


    Whatever you do, <a href="666.html" style="color: red;" onclick="alert(''I said
    dont


    click'')">don''t click this link</a>!


    </p>


    The Right Approach


    <p>


    Whatever you do, <a href="666.html" id="warning">don''t click this link</a>! </p>


    <style>


    #warning{


    color:red;


    }


    </style>


    <script>


    var warningLink=document.getElementById("warning");


    warningLink.addEventListener(''click'',alerter, false);


    function alerter(){


    alert("I said don''t click");


    }


    </script>


    The best approach is to save the style and script into a separate .css file and
    .js file and unite them via link tag and script tag in the HTML document. This
    approach is utilized in this manual.


    <link rel="stylesheet" href="warning.css" /> <p>


    Whatever you do, <a href ="666.html" id="warning">don''t click this link</a>!


    </p>


    <script src="warning.js"></script>


    JavaScript Basics


    Statements


    The JavaScript syntax is also known as a C-style syntax which is related to the
    syntax used by PHP. A JavaScript program consists of JavaScript language construct,
    command, and keyword. This manual will teach you how to develop amazing things
    with the use of JavaScript language constructs, command and keyword. Every statement
    must end with a semicolon or a new line. By popular convention a JavaScript programmer
    should write one statement per line and with a semicolon at the end.


    document.write(''Hello World'') document.write(''Here comes the JS Engineer'')


    document.write(''Hello World''); document.write(''Here comes the JS Engineer'');


    document.write(''Hello World'');


    document.write(''Here comes the JS Engineer'');


    Comments


    These are human-readable texts which the computer disregards. JavaScript consists
    of two types of comments:


    //This is a single line comment


    /*


    This is a multiple line comment on line one


    This is a multiple line comment on line two


    This is a multiple line comment on line three


    */


    Variable


    To declare a variable, Use the “var” keyword.


    A variable is used to store data and references the memory location in computer
    memory (RAM.) A variable can perform 3 actions, and they are:


    1\. Declaring the variable


    2\. Inserting data inside the variable


    3\. Getting the data into the variable


    It is important to name a variable to enable easy differentiation. Few rules guide
    naming variables.


    Variable naming rules


    ●       They consist of the following character; numbers, letters, dollar signs
    or underscores but a number cannot be the first character


    ●       Variables are case sensitive, therefore ‘number-one’ differs from ‘NumberOne.’


    ●       Variables cannot be JavaScript reserved words


    ●       Variables select meaning and clarity'
