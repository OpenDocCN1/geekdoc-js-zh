    JavaScript skips many rules for being a somewhat free language when programming
    and one of the cases in which it gives a little freedom is when declaring the
    variables, since we are not obliged to do so, contrary to what happens in other
    programming languages like Java, C, C# and many others.


    ## Variable Declaration with Var


    JavaScript has the word `var` that we will use when we want to declare one or
    more variables. Not surprisingly, that word is used to define the variable before
    using it.


    Note: Although JavaScript does not force us to declare variables explicitly, it
    is advisable to declare them before using them and we will see from now on that
    it is also a good habit. In addition, in successive articles we will see that
    in some special cases, a script in which we have declared a variable and another
    in which we have not, will not produce exactly the same results, since the declaration
    does not affect the scope of the variables.


    `var operand1`


    `var operand2`


    You can also assign a value to the variable when it is being declared


    `var operand1 = 23`


    `var operand2 = 33`


    It is also allowed to declare several variables on the same line, provided they
    are separated by commas.


    `var operand1, operand2`


    ## Declaration of JavaScript Variables with Let and Const


    From JavaScript in modern versions (remember that JavaScript is a standard and
    that as it evolves over time), specifically in JavaScript in its ES6 version,
    there are other ways to declare variables:


    - `let` declaration: This new way of declaring variables affects their scope,
    since they are local to the block where they are being declared.

    - `const` declaration: Actually `const` does not declare a variable but a constant,
    which cannot change its value during the execution of a program.


    Perhaps at this point in the JavaScript manual it is not necessary to delve too
    deeply into these declaration models and for those who are learning we recommend
    focusing on the use of declarations with `var`. However, if you want to have more
    information about these new types of variables, we explain them in the article
    Let and const: variables in ECMAScript 2015. If you want to see other news about
    the JavaScript standard that came in 2015, we recommend reading the ES6 Manual.


    # Chapter 17. Definition of Arrays in JavaScript


    Another thing we need to take a look at when we work in this language is what
    an array is all about. To keep it simple, an array is just going to be a structure
    of data that can contain our group of elements. In most coding languages including
    JavaScript, we will find that the items inside an array are usually the same type
    of data, such as a string or an integer. Collections are going to be used in order
    to help a computer program, or your coding language, organize and sort your data
    so that a set of values that are related can be sorted through or searched through
    well.


    No matter what kind of coding language you decide to work with, you will find
    that keeping the data and the objects organized will be necessary. If you don’t
    take care of these objects and types of data, they are going to float around the
    work you are doing, and you will run into some troubles in the code. The part
    of the system you are in will not be able to find the objects and classes they
    need and your order won’t work.


    But when you are working with many of the modern types of coding languages out
    there, including JavaScript and a few others, you are going to rely on a bit more
    organization than what we are going to find in some of the older languages. You
    need to make sure things are organized, and the set of values that are related
    are going to be easy to search through and sort through as much as you would like.


    While the program is able to create a new variable, if it wanted, for all of the
    results that are found in it, this can really take up a lot of time and space
    in some of the codings you are doing, and it is definitely not going to be the
    most efficient method you can use here. Instead, you will find that storing all
    of the results (while we are still on the search engine example) in an array will
    be a more efficient method to use to pull up the results you want, while also
    managing your memory.


    Now, there are going to be a few different parameters and properties that can
    come with the array you would like to create. Being able to make this come together
    and work the way you want is essential, and understanding what each of these properties
    is all about will be a great way to get a better understanding of what you can
    do with them. Some of the features that come along with your array object, along
    with information on what all of these means, includes:


    1.  `Constructor`: This will help us get back a reference to our array function,
    the one that was able to create the object.

    2.  `Index`: This will be the property in our array that will represent the zero-based
    index that will match up to that part inside of our string.

    3.  `Input`: This will be a property we are only going to see in specific arrays.
    When a range has been created by a regular expression and it all matches, then
    we are going to have this input.

    4.  `Length`: This will show us the number of elements we are going to be able
    to see in our array.

    5.  `Prototype`: We will discuss this one more in this guidebook, but this particular
    property will allow us a way to add methods and features to our object.


    This may not make a lot of sense right now, but we are going to expand upon it
    a bit and see more about what we will be able to do with these arrays and the
    different parts that come with it. Before we move into this though, we need to
    take some time to talk about some of the array methods that are important to our
    code. There are a lot of different ways that happen with our object of an array,
    so let’s take a look at what all of these mean.


    1.  `Concat`: This one will return to us a new array that will be comprised of
    not only this array but with the other values or ranges that we need.

    2.  `Every()`: This one will return true if we find that each and every element
    that falls in our array will satisfy the testing function that we provided.

    3.  `Filter()`: This one is responsible for creating a new array with all of the
    elements that fall into the current range for which the provided filtering function
    will give us honestly as the result.

    4.  `forEach()`: This one is responsible for calling up a function for each of
    the elements that are inside of our array.

    5.  `indexOf()`: This one will return the first (or the least) index that comes
    with the element that is inside of our array, as long as it is equal to the value
    that we specify. Or it will work with -1 if nothing is found to match in it.

    6.  `Join()`: This one will join together all of the elements of an array and
    can help turn these into a string.

    7.  `lastIndexOf()`: This one will return the previous, or the greatest, index
    of your element in the array as long as that element is equal to the value that
    we are trying to specify, or we will work with -1 if we can’t find a match in
