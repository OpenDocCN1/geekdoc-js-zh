    ```\n\n您的表单将如下所示：\n\n![00003.jpeg](img/image_rsrc3FH.jpg)\n\n# 第 10 章 CSS 中的图像处理\n\
    \n您可以使用 `img` 标签向文档中添加图像，也可以为整个文档添加背景图像。\n\n为网站设置背景图像。\n\n您可以使用 `body` 标签的 `background-image`\
    \ 属性为整个页面设置背景图像。\n\n```css\nbody { background-image: url('draft.gif'); }\n```\n\
    \n![](img/image_rsrc3FJ.jpg)\n\n定位背景图像\n\n使用 `background-position` 属性指定背景图像出现的位置。\n\
    \n```css\nbody {\nbackground-image: url('draft.gif');\nbackground-position: bottom\
    \ right;\nbackground-repeat: no-repeat;\n}\n```\n\n![](img/image_rsrc3FK.jpg)\n\
    \n您可以将以下关键字组合与 `background-position` 属性一起使用：\n\n| 关键字 | | |\n| --- | --- | ---\
    \ |\n| 左上 | 中左 | 左下 |\n| 中上 | 正中 | 中下 |\n| 右上 | 中右 | 右下 |\n\n这些关键字可以按任意顺序书写。例如，“top\
    \ left”和“left top”都能正常工作。如果只指定一个值，另一个值将默认为 center。\n\n您也可以使用百分比来设置位置。\n\n`background-position:\
    \ 30% 80%;`\n\n如果要将图像定位在左上角，值为 `0% 0%`；`100% 100%` 则将其放置在右下角。将 `background-position`\
    \ 设置为 `50% 50%` 会使图像居中，与 `center center` 效果相同。\n\n以下列表显示了关键字设置与百分比设置的对应关系：\n\n\
    | 关键字 | 百分比 |\n| --- | --- |\n| 左上 | 0% 0% |\n| 中上 | 50% 0% |\n| 右上 | 100% 0%\
    \ |\n| 左中 | 0% 50% |\n| 正中 | 50% 50% |\n| 右中 | 100% 50% |\n| 左下 | 0% 100% |\n\
    | 中下 | 50% 100% |\n| 右下 | 100% 100% |\n\n如果使用关键字或百分比，背景图像的位置会随窗口大小调整。您也可以使用像素来设置固定位置：\n\
    \n`background-position: 20px 20px;`\n\n调整背景颜色或图像位置。\n\n您可以使用 `background-clip`\
    \ 属性指定背景是否包含边框、内边距或仅包含内容区域。\n\n| `div {padding:10px;border: 5px dotted #000;background-color:\
    \ #f00;background-clip:border-box;}` | ![](img/image_rsrc3FM.jpg) |\n| --- | ---\
    \ |\n| `div {padding:10px;border: 5px dotted #000;background-color: #f00;background-clip:padding-box;}`\
    \ | ![](img/image_rsrc3FN.jpg) |\n| `div {padding:10px;border: 5px dotted #000;background-color:\
    \ #f00;background-clip:content-box;}` | ![](img/image_rsrc3FP.jpg) |\n\n为背景添加多个图像\n\
    \n使用 CSS3，您可以指定多个背景图像。如果需要支持旧版浏览器，可以在 `html` 标签中指定一个背景图像，在 `body` 标签中指定另一个。\n\n\
    CSS 方法\n\n```css\nbody {\nbackground-image: url('logo.gif'), url('draft.gif');\n\
    background-position: bottom right, 50% 50%; \nbackground-repeat: no-repeat;\n\
    }\n```\n\n![](img/image_rsrc3FR.jpg)\n\n旧版浏览器方法\n\n```css\nhtml {\nbackground-image:\
    \ url('logo.gif');\nbackground-position: bottom right;\nbackground-repeat: no-repeat;\n\
    }\nbody {\nbackground-attachment: fixed;\nbackground-image: url('draft.gif');\n\
    background-position: 50% 50%;\nbackground-repeat: no-repeat;\n}\n```\n\n固定背景图像以避免滚动\n\
    \n您可以使用 `background-attachment` 属性将图像固定，防止其随页面其余内容滚动。\n\n```css\nbody {\nbackground-attachment:\
    \ fixed;\nbackground-image: url('draft.gif');\nbackground-position: 50% 50%;\n\
    background-repeat: no-repeat;\n}\n```\n\n| 值 | 描述 |\n| --- | --- |\n| repeat |\
    \ 背景在水平和垂直方向重复。这是默认设置。 |\n| repeat-x | 背景在水平方向重复，但垂直方向不重复。 |\n| repeat-y | 背景在垂直方向重复，但水平方向不重复。\
    \ |\n| no-repeat | 背景在水平和垂直方向均不重复。 |\n\n如何调整背景图像大小以适配元素？\n\n您可以使用 `background-size`\
    \ 属性自动调整背景图像的大小，使其适配更大或更小的元素。\n\n| 值 | 描述 |\n| --- | --- |\n| contain | 缩放图像，使高度和宽度都适合元素\
    \ |\n| cover | 缩放图像，使高度或宽度（取较小者）适合元素 |\n| length | 设置高度和宽度。如果只指定一个值，图像将按比例缩放。\
    \ |\n| percentage | 将高度和宽度设置为父元素的百分比。如果只指定一个值，图像将按比例缩放。 |\n\n为图像添加阴影\n\n您可以使用\
    \ `box-shadow` 属性为图像添加阴影。\n\n`img { box-shadow: 5px 5px 10px 10px #f00; }`\n\n\
    您可以为阴影指定以下选项：\n\n| 值 | 描述 |\n| --- | --- |\n| blur | 阴影边缘的模糊量（以像素为单位） |\n| color\
    \ | 阴影的颜色 |\n| offset-x | 阴影的水平偏移量（以像素为单位） |\n| offset-y | 阴影的垂直偏移量（以像素为单位） |\n\
    | inset | 指定内阴影 |\n| spread | 阴影的大小（以像素为单位）。0 – 阴影与元素大小相同 |\n\n使用图像作为边框\n\n您可以使用\
    \ `border-image` 属性将图像用作元素的边框。\n\n`border-image:url(diamond.png) 20 20 round;`\n\
    \n以下属性可用于为元素的不同边指定边框图像：\n\n`border-top-image`\n\n"
- fmt: "\n`border-right-image`\n\n`border-bottom-image`\n\n`border-left-image`\n\n\
    | Value | Description |\n| --- | --- |\n| `border-image-source` | Path to the\
    \ image |\n| `border-image-slice` | The image's height and width offset |\n| `border-image-width`\
    \ | The image's width |\n| `border-image-outset` | The image's height |\n| `border-image-repeat`\
    \ | Whether the image should be repeat or stretch |\n\n## Wrapping text to an\
    \ image\n\nYou can use the `float` property to wrap text around an image.\n\n\
    ### CSS rule\n\n```css\n.caution {\n  float: left;\n  margin-right: 10px;\n}\n\
    ```\n\n### Usage\n\n```html\n<p><img class=\"caution\" src=\"caution.jpg\" />\n\
    caution caution caution</p>\n```\n\n![](image_rsrc3FS.jpg)\n\nThe `margin-left`\
    \ property can be used to add space between the image and the text.\n\n## Placing\
    \ of text on top of image\n\nYou can assign negative values to the `position`,\
    \ `top`, and `left` properties to position text on top of an image. If the version\
    \ is below the picture, setting its `top` property to a negative value will move\
    \ the text on top of the film.\n\n### CSS rule\n\n```css\n.overlap {\n  position:\
    \ relative;\n  top: -200px;\n  left: 180px;\n  color: #ffffff;\n}\n```\n\n###\
    \ Usage\n\n```html\n<img src=\"sample.jpg\" />\n<p class=\"overlap\">floating\
    \ text</p>\n```\n\n![](image_rsrc3FT.jpg)\n\n## Adding a border around the image\n\
    \nBorders are most often used with tables, but you can also add borders around\
    \ images using the `border` properties.\n\n```css\nimg {\n  border-width: 3px;\n\
    \  border-style: solid;\n  border-color: #000000;\n}\n```\n\n![](image_rsrc3FU.jpg)\n\
    \nYou can also use CSS shorthand to specify borders:\n\n```css\nimg { border:\
    \ 1px solid #000000; }\n```\n\nThe examples above will add a border to all images.\
    \ You can create a class if you want to apply borders only to specified images.\n\
    \n```css\n.imgBorder { border: 1px solid #000000; }\n```\n\n```html\n<img class=“imgBorder”\
    \ src=“sampleImage.jpg” />\n```\n\nOr, you can apply a border to all images inside\
    \ a `div` tag:\n\n### CSS rule\n\n```css\n#menuBar img { border: 1px solid #000000;\
    \ }\n```\n\n### Usage\n\n```html\n<div id=“menuBar”><img src=“sampleImage.jpg”\
    \ /></div>\n```\n\n## Adding a drop shadow to an image\n\nYou can use Internet\
    \ Explorer’s `filter` property to add a drop shadow to an image.\n\n```css\nimg\
    \ {\n  filter: progid:DXImageTransform.Microsoft.dropShadow (offX='3', offY='5',\
    \ color='#c0c0c0', positive='true');\n}\n```\n\n![](image_rsrc3FV.jpg)\n\nThe\
    \ `filter` property was created by Microsoft and is not a part of the CSS recommendation.\
    \ It is only supported by Internet Explorer.\n\nFor more information about Internet\
    \ Explorer filters, see “How do I use Internet Explorer's filters?”\n\nFor other\
    \ browsers, the `box-shadow` property can be used to add a drop shadow around\
    \ an image. However, it will not add the drop shadow inside transparent images.\n\
    \n![](image_rsrc3FW.jpg)\n\nAnother option is to use HTML5's `canvas` element.\
    \ See the following website for an example: [philip.html5.org/demos/canvas/shadows/various.html](http://philip.html5.org/demos/canvas/shadows/various.html)\n\
    \n## Making an image transparent\n\nUsing the `opacity` property to make an image\
    \ transparent can also be done. For Internet Explorer, you can use the IE-specific\
    \ `alpha` filter.\n\n![](image_rsrc3FX.jpg)\n\n```css\nimg {\n  filter:alpha(opacity=50);\n\
    \  opacity:.50;\n}\n```\n\n## Removing link borders from an image\n\nYou can set\
    \ an image’s `border` property to “0” to remove the border that appears around\
    \ image links by default.\n\n```css\nimg { border: 0; }\n```\n\n## How do I zoom\
    \ images when the user hovers over them?\n\nYou can use the `hover` pseudo class\
    \ to change an image’s `width` and `height`.\n\nFirst, wrap a link around the\
    \ image:\n\n```html\n<a href=\"javascript:void(0);\">\n  <img src=\"clickstart.jpg\"\
    \ />\n</a>\n```\n\nThen, specify the image’s `width` and `height` when the user\
    \ hovers over the image’s link:\n\n```css\na:hover img { width: 800px; height:\
    \ 400px; }\n```\n\nIn this example, the image will expand to 800x400 when the\
    \ user hovers over the image, and when the mouse moves from the image it will\
    \ return to its original size.\n\n## Making image expand on hover\n\nYou can use\
    \ the `transition` property to make an image expand when the user hovers over\
    \ it and shrink when it loses focus. For example, you could provide a \"thumbnail\"\
    \ of an image that expands to full-size when the user hovers over it.\n\n### CSS\
    \ rule\n\n```css\n.thumbTrans {\n  width: 50px;\n  height: 50px;\n  -moz-transition-property:\
    \ width,height;\n  -moz-transition-duration: 4s;\n  -moz-transition-delay: 1s;\n\
    \  -webkit-transition-property: width,height;\n  -webkit-transition-duration:\
    \ 4s;\n  -webkit-transition-delay: 1s;\n  -o-transition-property: width,height;\n\
    \  -o-transition-duration: 4s;\n  -o-transition-delay: 1s;\n  transition-property:\
    \ width,height;\n  transition-duration: 4s;\n  transition-delay: 1s;\n}\n\n.thumbTrans:hover\
    \ {\n  width: 100%;\n  height: 100%;\n  -moz-transition-property: width,height;\n\
    \  -moz-transition-duration: 4s;\n  -moz-transition-delay: 1s;\n  -webkit-transition-property:\
    \ width,height;\n  -webkit-transition-duration: 4s;\n  -webkit-transition-delay:\
    \ 1s;\n  -o-transition-property: width,height;\n  -o-transition-duration: 4s;\n\
    \  -o-transition-delay: 1s;\n  transition-property: width,height;\n  transition-duration:\
    \ 4s;\n  transition-delay: 1s;\n}\n```\n\n## Making an image ‘pop-out’ on hover\n\
    \nYou can use the `hover` pseudo class to rotate images and add a shadow.\n\n\
    ```css\nimg:hover {\n  box-shadow:1px 2px 5px #666666;\n  -moz-transform:rotate(5deg)\
    \ scale(1.5);\n  -webkit-transform:rotate(5deg) scale(1.5);\n  transform:rotate(5deg)\
    \ scale(1.5);\n}\n```\n\n![](image_rsrc3FY.jpg)\n\n## Inserting content using\
    \ CSS\n\nUsing the `content` property to insert content before or after an element\
    \ can also be done.\n\nTo insert content at the top or bottom of the page:\n\n\
    ```css\nbody:before {\n  content: \"Confidential\";\n  font-weight: bold;\n}\n\
    \nbody:after {\n  content: \"\\000A Copyright 2012\";\n}\n```\n\nTo insert content\
    \ before an element:\n\n```css\nh1:before {\n  content: \">> \";\n  color: silver;\n\
    }\n```\n\nTo add quotes before and after an element:\n\n```css\np.quotes:before\
    \ { content: open-quote; }\np.quotes:after { content: close-quote; }\n```\n\n\
    To add curly quotes:\n\n```css\np.boldCurlyQuotes { quotes: \"\\201C\" \"\\201D\"\
    ; }\np.boldCurlyQuotes:before { content: open-quote; }\np.boldCurlyQuotes:after\
    \ { content: close-quote; }\n```\n\nThe following table provides the Unicode values\
    \ for commonly-used characters that can be inserted using the `content` property.\n\
    \n| Symbol | Description | Unicode value |\n| --- | --- | --- |\n| `\"` | double\
    \ quotation | `0022` |\n| `'` | single quotation (apostrophe) | `0027` |\n| `“`\
    \ | double left curly quotation | `201C` |\n| `”` | double right curly quotation\
    \ | `201D` |\n| `<` | single left angle quotation | `003C` |\n| `>` | single right\
    \ angle quotation | `003E` |\n| `«` | double left angle quotation | `00AB` |\n\
    | `»` | double right angle quotation | `00BB` |\n| `` ` `` | grave accent | `0060`\
    \ |\n| `´` | acute accent | `00B4` |\n\n# Chapter 11. Length Units\n\nAs you have\
    \ followed this tutorial, you may have noticed that when you change the size of\
    \ text using CSS, there are a number of options.\n\nYou can see this for yourself\
    \ in TopStyle.\n\nCreate a new style sheet, and click the \"New Selector\" button.\
    \ Select the \"Simple\" tab and select `h1` from the HTML elements list. Next\
    \ click the \"Add\" button, followed by \"OK\".\n\n![](image_rsrc3FZ.jpg)\n\n\
    In the style inspector, scroll down to the font category and click on the `font-size`\
    \ property. Click the downward arrow on the right of this row to view the options\
    \ available:\n\nIn this book, we will concentrate on the first two items in this\
    \ list – Percentage and Length.\n\nPercentage is a relative measurement (i.e.,\
    \ it defines a size that is relative to another one).\n\nLength is an absolute\
    \ measurement, since it defines an exact analysis. However, with precise measurements\
    \ come units.\n\nWhat are the units for an absolute measurement?\n\nWell, let's\
    \ find out. Click on the `font-size` dropdown arrow, and select length.\n\nAnother\
    \ dialogue box opens up, with another dropdown box (set to the default `'px'`).\n\
    \n![](image_rsrc3G0.jpg)\n\nClick on the down arrow of that dropdown box, and\
    \ you'll see several more options:\n\nWOW! That’s a lot of different units.\n\n\
    These units can be divided into two groups:\n\n1. relative units (size is comparable\
    \ to something)\n2. absolute units (size is an exact measurement)\n\nThe 'relative'\
    \ units are:\n\n- `ex`\n- `em`\n- `px`\n\n(The percentage unit is also relative).\n\
    \nThe 'absolute' units are:\n\n- `cm`\n- `mm`\n"
