    folder on your desktop. Now preview your file in your Web browser to check your
    work.


    To remove the standard underlined text from your anchor link, use the text-decoration
    attribute and the value none (see example above, after color: red). The text-decoration
    is used to set the appearance of text – you can remove underlines, underline standard
    text, add a line above or through the middle of text and make the text blink.


    The text-decoration attribute has the following possible values: underline, line-through,
    over line, none and blink. Here is an example of code for text decoration that
    makes the text blink:


    text-decoration: blink;


    Open up the Web page we''ve just been working on called colors.html and add the
    other values to the text-decoration attribute. Preview the file in your Web browser
    to see how your work is displayed.


    <p> <a href="#" style="color:red; text-decoration:blink;">


    Click Here </a> </p>


    Try experimenting yourself by adding the values: underline, line-through and over
    line to the text-decoration attribute and see what happens.


    ## Inline Styles


    Inline styles allow you to insert a property name and value of a style sheet right
    into an HTML tag. But you should try to avoid using this approach if you can.
    As Inline styles mix formatting with HTML markup, and it becomes difficult to
    make changes to your Web page: every style on a page must be hunted down in the
    source code ‒ as you''ll soon see.


    So here is our earlier example used to format an anchored link:


    <a href="#" style="color:red; text-decoration:none;"> Click Here </a>'
