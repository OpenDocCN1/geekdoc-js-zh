- fmt: '

    Select ID, and then in the box underneath the radio buttons, type in a name for
    your ID. I typed in `"logo"` for mine, since I am going to create the ID to be
    applied to the logo on the page (it only appears once).


    You will notice that as you type, TopStyle adds a `#` to the start of your ID.
    Click the `"Add"` button (located above the radio buttons), and then click the
    `"OK"` button on the bottom right. This will add this selector to your style sheet.


    In style sheets, the `#` symbol specifies that what follows is an ID. Here''s
    how mine looks:


    ```

    #logo {


    }

    ```


    You can now add some styles to the ID in exactly the same way we have done in
    other examples. I’ve added a few to mine, and here is the finished logo ID:


    ```

    #logo {

    font-size: 3em;

    font-variant: small-caps;

    font-weight: bolder;

    background-color: Silver;

    font-family: Verdana, Geneva, Arial, Helvetica, sans-serif;

    }

    ```


    The idea of this ID is to change the text properties in the logo area of my page
    so that it is more extensive (`"em"` is a unit of measurement). My sample here
    uses small caps, bold, has a silver background, and is the Verdana, Geneva… font
    family. You probably knew this from seeing the style sheet though, didn’t you?


    You can see the effects of what this does to the page here:


    ![](image_rsrc3G5.jpg)


    (8.1.html and 8.1.css)


    To use the ID in a web page, you simply modify the HTML tag to include:


    `ID = "logo"`


    Here is the HTML code before modifying:


    `<p>Mylogo.com</p>`


    Just before the first single right-pointing angle quotation mark `">"`, is where
    you insert your ID code:


    `<p ID="logo">Mylogo.com</p>`


    Now, anything inside the `<p></p>` tags will be formatted according to the properties
    of the ID `"logo"`.


    You will notice that in the raw HTML, the text is lowercase apart from the first
    letter `"M"`. In the web page preview (above), the book is small capitals, or
    small caps. That is what happens when we add the property: `font-variant: small-caps;`


    Classes are used in a very similar way, so let''s now take a look at that:


    ## Class Selectors


    Create a new style sheet, and click on the `"New Selector"` button. Go to the
    `"Advanced"` tab again and click on the `"Class"` radio button. Enter a name for
    your class underneath the radio button. I am using `"yellowhighlight"` for mine,
    as that is what my class will do. i.e., highlight some text in yellow.


    ![](image_rsrc3G6.jpg)


    You’ll notice that as you type, TopStyle adds a `"."` in front of the text you
    are typing. In CSS, that `"."` specifies that whatever follows is a class.


    OK, once done, click the `"Add"` button and then click `"OK"` to save the changes
    to your style sheet.


    ![](image_rsrc3G7.jpg)


    This is what mine looks like:


    ```

    .yellowhighlight {


    }

    ```


    I will make just one style change to the background color:


    ```

    .yellowhighlight { background-color: Yellow; }

    ```


    Now I can simply highlight a paragraph in yellow by adding the following code
    to the HTML tag for the paragraph I want to change:


    `class="yellowhighlight"`


    We add it in the exact same way that we added the ID earlier. Insert it right
    after the first `">"` of the `<p>` tag.


    Here is the HTML code:


    `<p class="yellowhighlight">the paragraph goes here</p>`


    Now look at this page:


    ![](image_rsrc3G8.jpg)


    (8.2.html and 8.2.css)


    The second paragraph is now highlighted in yellow. Note how the `<p>` tag has
    been modified from `<p>` to `<p class = "yellowhighlight">`:


    Here is the HTML.


    Because I used a class to define the highlighting, I can happily use it on multiple
    paragraphs if I want to:


    ![](image_rsrc3G9.jpg)


    (8.3.html and 8.3.css)


    That''s how easy it is to identify and use classes.


    Before we leave this though, I can hear you asking: "But what if we only want
    to highlight certain text in a paragraph, and not the whole section?"


    Well, the problem here is that the way we have used the class so far is to modify
    a complete HTML tag (the whole paragraph), because we declared the class within
    the `<p>` tag.


    However, there is another option. You can use a `span` tag, to surround a selection
    of text, and apply a class only to the `"spanned"` text. To do this, you have
    to surround the text you want to highlight with a `<span></span>` tag. Let’s look
    at an example:


    `<p>I only want to highlight <span>this text</span>here.</p>`


    We can now add the class within the opening `<span>` tag, right before the `">"`,
    in much the same way as you saw previously with the other tags:


    `<p>I only want to highlight <span class="yellowhighlight">this text </span>here.</p>`


    Here it is in action on a web page:


    ![](image_rsrc3GA.jpg)


    (8.4.html and 8.4.css)


    This is an integral part of the CSS course, with some big lessons to learn. We
    learnt how to use IDs and Classes to modify the elements of our web pages, and
    although there''s still more to cover on classes, we''ll take a break for now.


    # Chapter 13. The Box Model In CSS


    The basis of the CSS layout is the box model since it directs the way in which
    elements are shown and the way in which they associate with one another. Imagine
    every element on the page as a rectangular box. Every box is made of particular
    dimensions and takes up a particular measure of space. The space the box occupies
    depends on the content in it, as well as the margins and the padding borders around
    the content:


    ![00100.jpeg](image_rsrc3GB.jpg)


    So, the box model is what dictates the amount of space each element has on the
    page. Now, let’s dive somewhat deeper into this idea by revising the main components
    that constitute the CSS box model. Start thinking of each HTML component on the
    page as a box. In fact, you can apply a global style rule that will add a red
    outline to all the elements on the page. To do this, simply add the following
    style rule to the top of the stylesheet:


    ```

    * {

    outline: 2px solid red;

    }

    ```


    This will add an outline to all the elements on the page and it will let us easily
    visualize each of the items on the page as a box:


    ![00101.jpeg](image_rsrc3GC.jpg)


    Each element is designed with a box or rectangle. Now, to effectively understand
    the concept of the CSS box model, it is essential that we know the two ways in
    which elements can be displayed. Every detail has a display property, depending
    on the kind of item it is. The default of most items is inline or block. Now,
    block elements are composed of a separate block that has to take up the full width
    that is available. A few examples of block elements include, list items, paragraphs,
    divs and any heading tag.


    You can observe how the block-level divs on our page, and also the lists and headings
    are taking up a whole line of content. They’re additionally forcing another new
    line of text before and after the next element. Also, inline elements only take
    up as much width as they have to. They don’t constrain any lines, and they remain
    in line with whatever remains of the rest of the text. A few examples of inline
    elements are images, anchor elements, and span tags.


    In the title span element, observe how its width consumes the space of its text,
    and the reason it’s shown on its line is because a block-level h1 part exists
    beneath it. The block-level h1 forces the new line. So now, let’s examine how
    the margins, borders, and padding interact with one another to form a box since
    it’s essential to understand. The box model is designed with four distinct parts.


    ![00102.jpeg](image_rsrc3GD.jpg)


    The core component and innermost area of the box is the content area. This is
    the area in which the actual content, such as image or text of the element is
    contained. Surrounding the area of the text is the padding area. Padding is used
    to give elements some breathing space. The next outermost part of the box is known
    as the border area of the box. Think of it as an outline to the box model. There
    are a range of styles for borders such as thickness and color. Finally, the margin
    area is positioned outside of the box. This is the space around an element that
    isolates it from different components.

