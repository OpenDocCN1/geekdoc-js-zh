  trans: "\n\n上面，我们定义了 `.html` 文档与外部资源之间的关系（`<link>` 中的 `rel` 属性）为样式表关系。定位外部样式表的 URL\
    \ 是一个相对 URL 路径——在此示例中，CSS 文件与 `index.html` 文档位于同一目录。随着网站变得复杂，你最终会希望将 CSS 源代码文件放在各自的目录或文件夹中，此时\
    \ `href` 中的 URL 可能变为 `\"CSS/css.css\"` 或 `\"scripts/css.css\"` 等。这些正斜杠表示 `.css`\
    \ 文件位于名为 `\"CSS\"` 或 `\"scripts\"` 的目录内，并且这些目录与 `.html` 文件位于同一目录。最后，样式表的媒体类型通过\
    \ `type` 属性声明。CSS 与所有源代码一样，始终只是一个文本文件，但不同于文本文件通常使用的 `.txt` 扩展名，这里使用 `.css` 以便浏览器知道要将代码解析为包含样式信息的内容。\n\
    \n![](img/image_rsrc3GM.jpg)\n\n将 `.css` 文件放在与 `.html` 文件相同的目录中，或者放在 `scripts`\
    \ 目录中。`href` 属性的值必须指定查找外部样式文档所需的路径。\n\n# 第 15 章 JavaScript 简介\n\nHTML 用于开发网页，而网页可以成为定义页面内容的复杂文档。使用\
    \ HTML 制作的材料可以添加 CSS，并通过不同方式实现，例如附加背景颜色、更改字体大小、图像大小、字体、阴影、颜色强度等。HTML 和 CSS 可用于实现网页的静态美观。借助\
    \ JavaScript，你可以通过 JavaScript 效果（如表单验证、模态框、滑块、弹出窗口等）为网页注入活力。使用 HTML、CSS 和 JavaScript\
    \ 开发网页或应用程序的实践称为前端开发，它增强了用户与网页的交互。JavaScript 是一种构建良好的客户端脚本语言。JavaScript 也常用于移动和游戏应用程序开发。\n\
    \n## JavaScript 简史\n\n- 1995 年：在 Netscape 工作期间，Brendan Eich 创建了 \"LiveScript\"\
    ，后来更名为 \"JavaScript\"。\n- 1996 年：微软发布了 JavaScript 的一个移植版本，用于 IE3。\n- 1997 年：JavaScript\
    \ 在 \"ECMAScript\" 规范中实现标准化。\n- 2005 年：\"AJAX\" 一词被提出，Web 2.0 时代开始。\n- 2006 年：jQuery\
    \ 1.0 发布。\n- 2010 年：node.JS 发布。\n- 2010 年：angular.JS 发布。\n- 2012 年：ECMAScript\
    \ Harmony 规范基本完成。\n\n许多程序员倾向于认为 JavaScript 和 Java 属于同一类别，但这种观点是错误的，因为 Java 和 JavaScript\
    \ 彼此不同。Java 是一种复杂的编程语言，而 JavaScript 只是一种脚本语言。C 编程语言影响了 JavaScript 的语法。\n\nJavaScript\
    \ 的未来如何？\n\nHTML5 和 JavaScript 技术可用于创建 Windows 8 桌面小部件、浏览器、Chrome OS 和 Firefox\
    \ OS 应用程序的扩展。大量非网页相关的应用程序也采用了 JavaScript 脚本语言，它可以用于创建 HTML 模板（Mustache）、为 PDF\
    \ 文档附加活动、数据库交互（MongoDB）以及控制（Cylon.js）。JavaScript 前景光明，因为 Web 平台不断成熟，并将其用途扩展到浏览器之外。这种脚本语言将继续成为未来开发中不可或缺的一部分。\n\
    \n如何运行 JavaScript？\n\nJavaScript 是一种无法独立运行的脚本语言。浏览器负责执行 JavaScript 代码。当用户请求包含\
    \ JavaScript 的 HTML 页面时，浏览器接收脚本，然后决定其执行。所有现代浏览器都支持 JavaScript，这是该脚本语言的一大优势。JavaScript\
    \ 也可以在 Linux、Mac 和 Windows 等操作系统上运行。\n\n### 学习 JavaScript 的前提条件\n\n- 基本的 HTML\
    \ 和 CSS 知识\n- 一个文本编辑器\n- 一个浏览器\n- 逻辑思维和毅力\n\n## 编程\n\n计算机编程是实施和创建一组不同规则以允许计算机执行特定任务的行为。它是用计算机语言说话的过程，涉及选择算法并将其编码为一种表示法，以便计算机能够执行它。\n\
    \n### 编程语言的类型\n\n1. 低级语言\n   - 机器码\n   - 汇编语言\n2. 高级语言\n\n用不同的语言编写，如 Java、PHP、C、C++、JavaScript、C#、Python\
    \ 等。计算机程序可以是解释型语言或编译型语言，尽管 JavaScript 是解释型的一个绝佳例子。\n\n## 保持分离\n\nHTML：定义页面内容。\n\
    \nCSS：决定内容的呈现方式。\n\nJavaScript：控制内容的行为。\n\n当这些技术用于开发网页时，它们必须分开存储。\n\n1. 为 HTML\
    \ 创建一个单独的 `.html` 文件\n2. 为 CSS 创建一个单独的 `.css` 文件\n3. 为 JavaScript 创建一个单独的 `.js`\
    \ 文件\n\n### 错误的方法\n\n```\n<p>\nWhatever you do, <a href=\"666.html\" style=\"\
    color: red;\" onclick=\"alert('I said dont\nclick')\">don't click this link</a>!\n\
    </p>\n```\n\n### 正确的方法\n\n```\n<p>\nWhatever you do, <a href=\"666.html\" id=\"\
    warning\">don't click this link</a>! </p>\n<style>\n#warning{\ncolor:red;\n}\n\
    </style>\n<script>\nvar warningLink=document.getElementById(\"warning\");\nwarningLink.addEventListener('click',alerter,\
    \ false);\nfunction alerter(){\nalert(\"I said don't click\");\n}\n</script>\n\
    ```\n\n最佳方法是将样式和脚本分别保存到单独的 `.css` 文件和 `.js` 文件中，并通过 HTML 文档中的 `link` 标签和 `script`\
    \ 标签将它们连接起来。本手册采用此方法。\n\n```\n<link rel=\"stylesheet\" href=\"warning.css\" />\
    \ <p>\nWhatever you do, <a href =\"666.html\" id=\"warning\">don't click this\
    \ link</a>!\n</p>\n<script src=\"warning.js\"></script>\n```\n\n## JavaScript\
    \ 基础\n\n### 语句\n\nJavaScript 语法也称为 C 风格语法，与 PHP 使用的语法相关。一个 JavaScript 程序由 JavaScript\
    \ 语言结构、命令和关键字组成。本手册将教你如何使用 JavaScript 语言结构、命令和关键字开发出令人惊叹的东西。每条语句必须以分号或换行符结束。按照普遍约定，JavaScript\
    \ 程序员应每行写一条语句，并在末尾加上分号。\n\n```\ndocument.write('Hello World') document.write('Here\
    \ comes the JS Engineer')\ndocument.write('Hello World'); document.write('Here\
    \ comes the JS Engineer');\ndocument.write('Hello World');\ndocument.write('Here\
    \ comes the JS Engineer');\n```\n\n### 注释\n\n注释是计算机忽略的人类可读文本。JavaScript 包含两种类型的注释：\n\
    \n```\n//这是单行注释\n/*\n这是多行注释的第一行\n这是多行注释的第二行\n这是多行注释的第三行\n*/\n```\n\n### 变量\n\n\
    要声明变量，请使用 `var` 关键字。\n\n变量用于存储数据，并引用计算机内存（RAM）中的内存位置。变量可以执行三种操作，分别是：\n\n1. 声明变量\n\
    2. 向变量中插入数据\n3. 从变量中获取数据\n\n为变量命名以便于区分非常重要。命名变量需遵循几条规则。\n\n#### 变量命名规则\n\n- 变量由以下字符组成：数字、字母、美元符号或下划线，但数字不能作为第一个字符\n\
    - 变量区分大小写，因此 `'number-one'` 与 `'NumberOne'` 不同\n- 变量不能是 JavaScript 保留字\n- 变量应具有含义和清晰性\n\
    \n"
