    ```\n\n## CSS 表格\n\nCSS 允许你改变 HTML 中表格的外观。你可以为表头和列添加颜色。表格内文本的字体样式和字体大小也可以更改。让我们创建一个表格。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n#countries {\nfont-family:\
    \ \"Courier New\", Gerogia, Helvetica, sans-serif;\nborder-collapse: collapse;\n\
