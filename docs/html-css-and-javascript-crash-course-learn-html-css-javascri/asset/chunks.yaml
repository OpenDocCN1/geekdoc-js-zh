    # Chapter 19. Art of Computer Programming


    Becoming the best programmers depends on many factors besides learning programming
    techniques in classes or over the internet. In simple terms, it is not about programming
    as most beginners think. From my experience, your level of impacts plays a lot
    in determining the level of your success or how best you are as a programmer.
    Truly, people will not measure your experience from how happy you look when doing
    programing projects but how your programming projects are impacting the lives
    of many people in society. For example, there are some people who always feel
    happy after spending the whole day without doing any programming tasks while others
    feel unhappy if they do not handle any projects. Also, drinking alcohol everyday
    can make a person feel happy. Therefore, you level of experience and knowledge
    does not on how happy you are but how you use the learned skills. 


    Several studies have proved that slacking off in computer programming not only
    makes person’s programming logic weaker but also destroys his/her tempo. Normally,
    we miss many things when we don’t attend the classes just like drinking coke every
    day ruins both our teeth and internal organs. Just like alcohol has impacts in
    our bodies, your success in programming is measured through its impacts. We will
    see you as a weaker programmer if you do not use the learned programming skills
    to create positive impact to you or to the society. 


    ## Levels of Impacts Resulting from Programming


    Ideally, there are different levels of impacts we can use to determine how perfect
    you are with programming. Yes, most programmers do not know that their programming
    knowledge is judged on how it impacts them or the society. The following are levels
    of the impacts: 


    ### First Level of Impact: You/ a person


    One of the step to determine how you can measure the impact is by looking at the
    effects of programming has made on an individual. It is not only the simplest
    way but also very important since all programmers have goals in their mind before
    starting programming. Usually, you engage in various activities or jobs because
    you want a result not nothing. For example, we take our children to schools with
    two reasons; (1) get job in their future lives to live better life, and (2) obtain
    knowledge that will help them associate with other people in the society. It is
    important to know that doing something without a purpose makes you to experience
    an unexpected result on your way. Therefore, the impacts of programming on you
    show how best and successful you are as a programmer. 


    ## Relationships in Life


    Do you know that programming can cause certain impacts on your relationship? In
    order to determine the effects of programming on your relationship, we always
    look at how close you are to your love, friends, and other people in the society.
    Some people chose to be software programmers because it is their passion while
    others chose it because of peer pressure or their parents forced them. 


    Another main reason why people chose programming is getting jobs. In most cases,
    we work in projects, deliver them, and earn income once users use them. As programmers,
    we are only required to maintain the projects if there are crashes or bugs. This
    gives us more time for our relationships. Truly, human life is all about relationship
    but not how much we earn per day. You may be earning five or six digits but you
    are not happy at all because you lack freedom to associate with people, particularly
    your love ones and relatives. Let me tell you, people get more fulfillments out
    of life when there are some people whom they love and care for. You should spend
    your earnings with the people you love. As such, work is supposed to improve your
    relationship with love and relatives.


    ## Impacts On Your Health and Life


    In this modern life, your mind and body are the two main assets you must value
    most. Both body and mind are irreplaceable in our life. Therefore, you must take
    care of our mind and bodies to avoid them deteriorating over the time. Surely,
    every person wants to have a longer life, and as such, it is important to consider
    health when measuring how best you are as a programmer. You career as a programmer
    would not be either good if you are not healthy. 


    Money is worthless when compared to our mind and health. I tell you, money will
    always come on your way when you develop a good mind, which include practicing
    daily to solve problems, looking for answers, and thinking deep and creatively.
    You should not only get enough sleep but also build a habit that will train your
    mind just like writing and reading books. Make coding to be a favorite way to
    train you. The best programmers always spend at least thirty to forty minutes
    per day on programming. This is very important to their health. We can say health
    is your life and you should take care of it in order to live longer. 


    ## Having Full Enjoyment


    We have seen previously that happy is not the measurement of the success of a
    person; it is only a part of it, though we need it. You can increase your productivity
    in programming by engaging in things that you enjoy. What do I mean? I mean that
    a person can be more productivity in his/her programming work if he/she gives
    himself/herself a chance to enjoy life. Being more productivity in programming
    has more impact too. In addition, you should know that there is a great difference
    between passion and hobbies. While hobby refers to doing something you enjoy,
    passion refers to thing you like doing throughout the life. For example, my passion
    is coding and my hobby is learning Japanese language. I always study Japanese
    when I am a little bit frustrated with some complex coding. This gives enough
    time to refresh my mind before diving back into the world of coding. 


    Giving yourself enough time to relax or take a break to make your brain work on
    the problem subconsciously is always the right thing to do. But what do you do
    if you find it hard to solve the problem even after relaxing? It is easy. Just
    give your brain enough time to solve the problem in the background. In fact, this
    is one of the main reasons why most ideas come in our minds when we are eating,
    showering, or drinking tea.


    ## The Second Level of Impact


    Now let us discuss how we can measure you programming level using the second level
    of impact.


    ## Impact On Others


    Before you consider yourself as the best programmers, it is important to ask yourself
    about the impact you cause to other people when you are coding. Okay, you may
    be like that you know how to code because it is the most useful tool available
    for impacting the lives of many people positively. You can impact people by either
    enabling them to get data easily, improve their websites, or increase sales. One
    of the goals in programming is helping other people achieve their objectives.
    You will be recognized as the best programmers when you help others and organizations
    to succeed and at the same time meeting your goals. I know it is sometimes difficult
    for most programmers, but you can become the best programmers if you do this. 


    ## Giving Purpose to Other People

