    抱歉，我目前没有网络……


    程序讨论


    `<Iframe> </iframe>` 标签用于创建内联框架。


    `width = "350" height = "170"` 这两个属性表示内联框架的大小。


    如果浏览器不支持内联框架，则会显示 `<P> 此浏览器不支持内联框架。 </P>` 这段文本。


    ## 颜色与代码


    在网页中使用颜色非常重要。一个网页由一个或多个段落、标题、表格、边框等组成。每个元素都需要使用一些颜色。要指定特定页面的背景颜色，在 `<body>` 标签中写入
    body 后，应写 `bgcolor = ""`，然后空格，接着是 black、silver、gray、white、marrow、red、purple、fuchsia、green、lime、OLIVE、YELLOW、NAVY、BLUE、TEAL
    和 AQUA 这十六种颜色中的任意一种，该颜色将显示在页面背景中。由于不区分大小写，用小写书写没有问题，例如写成 `<body bgcolor = "green">`。


    除了十六进制代码，还可以选择背景颜色。例如，上述代码可以写成：`<body bgcolor = "# 00FF00">`


    可以轻松收集不同颜色的十六进制代码的颜色选择器。除了下面的图表，你也可以完成这项工作。十六进制代码必须以 `#` 符号开头。


    还有另一种有趣的设置背景颜色的方法。这三种颜色是红色、绿色和蓝色，所有其他颜色都由这三种颜色组成。如果你组合这三种颜色并创建新颜色，那也不错。要完成此任务，绿色背景可以写成如下形式：


    `<body bgcolor = "rgb (0,255,0)">`


    这里 `rgb` 代表红绿蓝 `(0, 255,0)`，意思是红色、绿色、蓝色的颜色值分别为 0%、100%、0%，因为这里是纯绿色。任何颜色值都可以在 0-255
    之间。由于 g 或绿色的值为 255，所以是 100%。通过将三种颜色的值在 0-255 之间变化，你可以根据需要创建新颜色。


