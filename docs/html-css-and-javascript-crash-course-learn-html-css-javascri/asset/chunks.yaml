    The <link> element has two parts to it. The rel attribute simply defines the relationship
    between the current page and the linked document. In actual fact, you are telling
    the Web browser it''s a style sheet.


    The href attribute (href stands for hypertext reference) points to the actual
    location of the external style sheet. When you''re linking to a style sheet the
    rel attribute should always be a style sheet.


    Save the file and then open it in your Web browser to see your work. Congratulations!
    You''ve just created your first external style sheet.


    # Chapter 9.         CSS Links, Tables, And Forms


    You can use a lot of other CSS properties to work with links and tables. You will
    learn how you can add color to each column of the chart to make it stands out
