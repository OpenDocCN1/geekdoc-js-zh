    \ give you a better understanding of how each element on the page is represented,\
    \ and how they interact with each other based on their display type.\n\n# Chapter\
    \ 14. Step By Step Addition Of CSS To HTML Document\n\n## The Three Ways To Add\
    \ CSS To An HTML Document\n\nYou may recall from your HTML knowledge that there\
    \ are three ways to add CSS to an HTML document: as inline style, as an internal\
    \ style, and as a link to an external stylesheet. In this the book internal style\
    \ method will be used because it more easily demonstrates, for learning purposes,\
    \ how CSS relates to HTML in a single screen window and when using short economical\
    \ code snippets. However, normally you will want to be using CSS script in external\
    \ style sheets, since that is the generally preferred method. Also for visual\
    \ clarity, many redundant elements will be omitted, such as `<!DOCTYPE html>`,\
    \ `<html>` and `<body>`. Just assume that, if these examples were used on real\
    \ web pages, you would have all the requisite elements in place.\n\nFor review,\
    \ let’s just remind ourselves of the syntax and method for each manner of adding\
    \ CSS to an HTML document.\n\n## Inline Style\n\nInline CSS is presented within\
    \ the opening HTML tag, where `style` is a Global Attribute that can be used by\
    \ any HTML element. The value of any applied `style` attribute is a `property:value`\
    \ pairing declared inside of quotation marks, attached to the attribute through\
    \ the assignment operator equal sign, `=`. Every `property:value` pairing should\
    \ end in a semi-colon, and similarly when combining more than one inline style,\
    \ each property: a semicolon should separate value pairing.\n\nBefore Cascading\
    \ Style Sheets, a vast amount of work was entailed by having to style every HTML\
    \ element individually. Any change of a style decided later on meant that each\
    \ element that had the style had to be manually adjusted. Here’s an example of\
    \ inline CSS as part of an HTML text file:\n\n`<h1 style=\"color:red; font-style:italic;\
    \ font-weight:100;\">Red Heading Typography</h1>`\n\n![](image_rsrc3GJ.jpg)\n\n\
    Above three styles have been applied, making the font color red, its style italic,\
    \ and the font weight 100 (on a 9-item scale 100 to 900– note that not all fonts\
    \ support all nine available CSS weights).\n\n## Internal Style\n\nWith internal\
    \ CSS, the style is placed inside the `<head>` section of the HTML document, which\
    \ is always above the `<body>` section, you will recall. This method is internal\
    \ to the HTML document, i.e. a single web page, as a whole, rather than specific\
    \ to a single element, which is why it is called internal. The CSS is applied\
    \ within the `<style>` HTML opening and closing tags instead of a `style` attribute\
    \ declaration and is declared in the standard CSS format. The basic CSS syntax\
    \ is:\n\n```\ns ​{\n​property : value;\n​property: value;\n​}\n```\n\nThe “s”\
    \ above stands for “selector”, which is any HTML element (in this context, “s”\
    \ is not the HTML tag for “strikethrough!”). With internal CSS, the `property:value`\
    \ pairs are declared within curly braces, `{ }`, instead of quotation marks. The\
    \ `property:value` pairs taken together with the curly braces make up a declaration\
    \ in CSS. At a high level, the syntactical construct can be understood as:\n\n\
    ```\nSelector {Declaration}  {Declaration}  {Declaration}\nSelector {Declaration}\
    \  {Declaration}  \n```\n\nAnd each declaration in turn is made up of:\n\n```\n\
    {property:value; property:value; property:value;}\n{property:value; property:value;}\n\
    ```\n\netc.\n\nA selector and its declaration(s) together make up a rule set:\n\
    \n`rule set = selector {declaration(s)}`\n\nTo ground this syntax in a typical\
    \ example, let’s look at the use of multiple declarations applied to a single\
    \ selector. Note that sometimes the order of declarations has no effect on the\
    \ visual result, but in other cases the order does have an effect.\n\n```\n<style>\n\
    h2 {\ntext-align: center;\nfont-family: cursive;\ncolor: orange;\n}\n</style>\n\
    ```\n\n```\n<h2>\nHi, I've been styled.\n</h2>\n```\n\n![](image_rsrc3GK.jpg)\n\
    \nMultiple declarations on the `<h2>` selector.\n\nInstead of declaring styles\
    \ one after the another on the same line as with inline CSS, with internal CSS\
    \ each style declaration starts a new line and is completed with a semicolon.\
    \ You must always complete a declaration with a semicolon even with the final\
    \ one, since it’s possible that later on you or another designer may add new styles\
    \ and not realize that there are missing semicolons above in the code that can\
    \ cause a bug when rendering the style.\n\nThe code below is the internal CSS\
    \ version of the same style we applied above in the inline example. The CSS is\
    \ now located inside of curly braces, which are inside of the `<style>` tags which\
    \ are inside of the `<head>` section. The CSS is applied in the head first (before\
    \ the body) since a browser linearly parses the code. In this way, the browser\
    \ does not first load an unstyled version of a page and then get to work restyling\
    \ it all, which is what would happen if internal CSS was placed at the bottom\
    \ of the `.html` file. Rather, the browser obtains the needed style information\
    \ first in the `<head>`, then all subsequent HTML content is rendered in the style\
    \ that was first parsed from the internal style declarations.\n\n```\n<head>\n\
    <style>\nh1 {\ncolor: red;\nfont-style: italic;\nfont-weight: 100;\n}\n</style>\n\
    </head>\n<h1>Red Heading Typography</h1>\n```\n\n![](image_rsrc3GJ.jpg)\n\n##\
    \ External Stylesheet\n\nWell-developed styles are made up of many lines of code,\
    \ and for this reason it is usually impractical to create too many style statements\
    \ as internal CSS within the `<head>` area of an `.html` document. Instead, CSS\
    \ code is usually placed in its own text file(s) that have the file extension\
    \ `.css`. This external style is then linked to in the `<head>` of an `.html`\
    \ document via a `<link>` element. This link to the external `.css` file will\
    \ instruct the browser to obtain the styling information from the external file\
    \ first before continuing to load, and style, the subsequent HTML content. When\
    \ using code editors to write CSS les, make sure you set the file’s syntax to\
    \ CSS, though many editors will automatically detect the language you are writing\
    \ in. When you save the file, make sure it has the `.css` file extension so that\
    \ it is usable as a style sheet for a browser.\n\n```\n<html>\n<head>\n<link rel=\"\
    stylesheet\" href=\"css.css\" type=\"text/css\">\n</head>\n<body>\n</body>\n</html>\n\
    ```\n"
