    HTML5 通过 `<input>` 的 `type` 属性，在旧标记中增加了许多与日期和时间相关的控件：`date`（包含年、月、日，不含时间的日期控件）、`datetime`（基于
    UTC 时区，精确到秒的小数部分的日期和时间控件）、`datetime-local`（不含时区的日期和时间控件）、`month`（月份和年份控件）、`time`（用于输入时间的控件，不含时区）以及
    `week`（周和年份控件，不含时区）。


    注意：在网页中使用日期和时间相关控件意味着你正走在薄冰上。这些控件相对较新，并且——在撰写本文时——在大多数浏览器中它们仅渲染为文本框，而不是漂亮的日期和时间选择控件。


    HTML5 还增加了另外两种类型：`color`（颜色选择器）和 `range`（一种滑块，用于在指定范围内选择一个数字）。


    除了 `<input>` 之外，还有一些其他 HTML 标签用于指定用户数据。使用 `<select>`，你可以通过 `option` 值定义一个下拉列表。要输入较长的文本，请使用
    `<textarea>` 元素。


    `<fieldset>` 元素允许你将相关控件分组到各个部分中，`<legend>` 元素为 `<fieldset>` 元素添加标题。


    输入字段不会向用户说明其角色。你可以使用 `<label>` 元素为输入控件提供名称。除了添加描述性文本外，`<label>` 元素还为使用鼠标的用户提供了改进，因为当用户点击
    `<label>` 内的文本时，它会触发控件（例如复选框或单选按钮），或将焦点移动到相关的输入字段。


    与 `button`、`submit` 或 `reset` 类型一起使用时，`<input>` 元素会渲染为按钮。使用 `<button>` 元素可以创建具有相同行为的可点击按钮，但你可以创建复合按钮内容，而不仅仅是简单文本。


    # 第 4 章 HTML 的框架、颜色和布局


    ## HTML 框架


    框架的使用日渐减少。目前框架并非毫无用处，因为使用框架打印完成的页面相当困难。除此之外，许多人也不喜欢它。取而代之的是，现在使用 CSS 将页面划分为多个部分。但为了丰富
    HTML 的知识库，还是有必要对框架有所了解。


    示例程序


    ```

    <html>

    <head>

    <title> [www.lifeguruji.tk](http://www.tutohost.com/) </title>

    </head>

    <body bgcolor ="#00cc99">

    <frameset rows ="12%,88%">

    <frame src = "style.html" scrolling ="no">

    <frameset cols ="27%,74%">

    <frame src ="link.html">

    <frame src ="textfor.html">

    </frameset>

    </frameset>

    </body>

    </html>

    ```


