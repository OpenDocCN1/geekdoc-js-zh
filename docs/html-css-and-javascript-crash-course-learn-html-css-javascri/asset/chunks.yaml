    HTML5 adds a number of date and time related controls to the old markup through
    the `type` attribute of `<input>`: `date` (date control with year, month, day,
    and no time), `datetime` (date and time control with the precision of fraction
    of a second, based on UTC time zone), `datetime-local` (date and time control
    with no time zone), `month` (a month and year control), `time` (a control for
    entering time, no time zone), and `week` (a week and year control, not time zone).


    NOTE: Using date and time related controls on your web pages means you’re walking
    on thin ice. These controls are relatively new, and—as of this writing—in most
    browsers they are rendered only as text boxes, and not as nice date and time pickup
    controls.


    HTML5 also adds two other types, `color` (color picker), and `range` (a kind of
    slider to choose a number in a specified range).


    Beside `<input>` there are a few other HTML tags to allow specifying user data.
    With `<select>`, you can define a dropdown list with `option` values. To type
    in longer text, use the `<textarea>` element.


    The `<fieldset>` element lets you group related controls into sections, the `<legend>`
    element adds a caption to a `<fieldset>` element.


    Input fields do not tell anything about their role to users. You can use the `<label>`
    element to provide appellation to input controls. Besides adding a descriptive
    text, `<label>` element provides an improvement for people who uses mouse, because
    when the user clicks on the text within `<label>`, it allows it for control (for
    example a check box, or radio button), or moves the focus to the related input
    field.


    Used with the `button`, `submit` or `reset` types, `<input>` elements are rendered
    as pushbuttons. With the `<button>` element you can create clickable buttons with
    the same behavior, but you can create compound button content instead of a simple
    text.


    # Chapter 4. Frames, Colors, And Layout Of HTML


    ## HTML Frame


    Frames used to decrease day by day. At the present time the frame is not useless,
    because it is quite hard to print finished pages using frames together. Apart
    from it, many dislike it. Instead, CSS is now used to divide a page into more
    than one section. But there is a need to have some idea about frames to enrich
    the knowledge base of HTML.


    Example Programs


    ```

    <html>

    <head>

    <title> [www.lifeguruji.tk](http://www.tutohost.com/) </title>

    </head>

    <body bgcolor ="#00cc99">

    <frameset rows ="12%,88%">

    <frame src = "style.html" scrolling ="no">

    <frameset cols ="27%,74%">

    <frame src ="link.html">

    <frame src ="textfor.html">

    </frameset>

    </frameset>

    </body>

    </html>

    ```


    Create a folder with any file name and put it in `style.html`, `link.html` and
    `textfor.html` three html files. Open a Notepad and enter the code above and click
    on Save as the File menu, save as file name: `index.html`, Save as type: All files,
    open the `index.html` file using Mozilla Firefox or Google Chrome, and check how
    it’s look...


    Discuss the program


    First, `frameset rows = "12%, 88%">` is divided into two parts along the row on
    the entire page.


    Through the `frameset cols = "27%, 74%">` the bottom row is divided into two sections
    along the column.


    `<frame src = "style.html" scrolling = "no">` The `style.html` page is displayed
    in the first frame.


    `<frame src = "link.html">` and `<frame src = "textfor.html">` Arrangements are
    made to display `links.html` and `textfor.html` pages in the 1st and 2nd frame
    respectively.


    ## Eye Frames


    Eye frames are one of the main ways to display one or more web pages on a web
    page. It is important to publish a link to different web pages on topics relevant
    to the presentation, as well as it is not bad if it can be scrolled in the short
    space.


    Example Programs


    ```

    <html>

    <head>

    <title> [www.lifeguruji.tk](http://www.tutohost.com/)</title>

    </head>

    <body bgcolor=" #f00">

    <center>

    <h2 style="color:#f00">This is an example of iframe.</h2><br/>

    <iframe src="[http://www.lifeguruji.tk/bangla/html/](http://www.tutohost.com/bangla/html/)"
    width="350" height="170">

    <p>This browser does not support iframes.</p>

    </iframe>

    </center>

    </body>

    </html>

    ```


    Open a Notepad and enter the code above and click on Save as from the File menu,
    save as file name: `index.html`, Save as type: All files, open the `index.html`
    file using Mozilla Firefox or Google Chrome, and check how it’s look.


    ![00015.jpeg](image_rsrc3F2.jpg)


    Sorry I don’t have internet at the moment….


    Program discussion


    `<Iframe> </iframe>` tags are used to create eyebrows.


    `width = "350" height = "170"` These two attributes indicate the size of the I
    frame.


    If a browser does not support the I frame, then this page does not support iframes.
    `<P> This browser does not support iframes. </P>` The text will be displayed.


    ## Colors And Codes


    The use of colors on web pages is very important. A web page is composed of one
    or more paragraphs, titles, tables, borders, borders, etc. Each of these elements
    has to use some colors. To specify the background color of a particular page,
    after writing body in the `<body>` tag, `bgcolor = ""` should be written with
    a space followed by black, silver, gray, white, marrow, red, purple, fuchsia,
    green, lime, OLIVE, YELLOW, NAVY, BLUE, TEAL, and AQUA, any one of these sixteen
    colors will be visible in the page''s background. Since case is not sensitive,
    there is no problem writing in lower case, as written, `<body bgcolor = "green">`.


    Apart from the hexadecimal code, the background color can also be selected. For
    example, the above code can be written as: `<body bgcolor = "# 00FF00">`


    The color piker can easily be collected for different color hexadecimal codes.
    Apart from the chart below, you can also do the job. The hexadecimal code has
    to start with a `#` symbol at the beginning of the code.


    There is another interesting method to give a background color. These three colors
    are red, green and blue, and all the other colors are composed of these three
    colors. If you combine these three colors and create new colors, then it is not
    bad. To accomplish this task, the green background can be written as follows


    `<body bgcolor = "rgb (0,255,0)">`.


    Here `rgb` stands for red green blue `(0, 255,0)`, meaning that the colors of
    red, green, blue, respectively, are 0%, 100%, 0% because of the pure green color
    here. And any color value can be up to 0-255. Since the value of g or green is
    255 so that is 100%. By changing the color of the three colors to 0-255, you can
    create new colors as desired.


    Example Programs


    ```

    <html>

    <head>

    <title> [www.lifeguruji.tk](http://www.tutohost.com/)</title>

    </head>

    <body bgcolor="green">

    <h2 style=" color:#ff0000" >

    This is the body of your web site.

    </h2>

    <p style="color:#093">

    This is a paragraph.<br/>

    This is a paragraph. <br/>

    This is a paragraph.<br/>

    This is a paragraph.<br/>

    </p>

    </body>

    </html>

    ```


    Open a Notepad and enter the code above and click on Save as from the File menu,
    save as file name: `index.html`, Save as type: All files, open the `index.html`
    file using Mozilla Firefox or Google Chrome, and check how it’s look...


    ![00016.jpeg](image_rsrc3F3.jpg)


    ## Layout


    On the page layout, depending on how good a webpage should be. Previously all
    web site layouts were made using HTML only. Currently CSS is used with HTML. Rows
    and columns of `<table>` are used to create layouts using HTML only.


    Example Programs


    ```

    <html>

    <head>

    <title> [www.lifeguruji.tk](http://www.tutohost.com/)</title>

    </head>

    <body bgcolor="green">

    <table width="400" border="0">

    <tr>

    <td colspan="3" style="background-color: #93C;">

    <h1> Web Page header</h1>

    </td>

    </tr>

    <tr valign="top">

    <td style="background-color: #C99;width:100px;text-align:top;">

    <p><b>Side bar</b><br />

    <a href="#">PHP</a>

    <br />

    <a href="#">HTML</a>

    <br />

    <a href="#">CSS</a>

    <a href="#">Wordpress</a>

    </p></td>

    <td style="background-color:#EEEEEE;height:200px;width:400px;text-align:top;"><h2
    style="color:#900">This is heading.</h2>

    <p style="color: #006">This is a paragraph.This is a paragraph. This is a paragraph.<br
    />

    ```

