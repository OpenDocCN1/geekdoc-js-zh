    ## Html Styles


    The ways of formatting Web pages that were accepted in the 1990s and early 2000s
    have fallen out of favor. 


    Implementing styles requires some changes to your HTML.  To make formatting consistent,
    you now use a style attribute to determine how something should look.  This caused
    a change in the HTML language.  Older tags, like the <font> tag, and older attributes,
    like bgcolor or border that used to control the appearance of HTML elements are
    now considered deprecated, or obsolete.  The format for the style attribute is
    as follows:


    <tagname style="              attribute1: value1;


    attribute2: value2;


    attribute3: value3;">


    You can usually apply a style attribute to almost any HTML tag (like<li>,<td>,<p>,
    etc.). However, if you are just typing, and you want to change the font, color,
    etc., of the next paragraph or the rest of the sentence, you can use either a
    <div> or a <span> tag. A <div> tag returns to the next line before going any further.
    A <span> tag keeps you on the same line, and allows you to make a single line
    have different fonts, colors, etc.  For example, the following <div> tag shows
    how to display text in red:


    <div style="color: Red;">


    This text will be red


    </div>


    ## Fonts


    Fonts are great for giving your page a crisp look that differs from the default
    font. The style attribute (or the <font> tag on older, pre-4.0 Web pages) is used
    to control the font displayed on your HTML page. Table 1 shows some things you
    can do with the style attribute and most tags, or use the <span> tag or the <div>
    tag (or the <font> tag, if you must).


    |  | Current/Strict(New Way -- HTML 4.0) | Deprecated/Transitional(Old Way --
    HTML 3.2) |


    | Change the Font (Font Family) | <div style="font-family: Comic Sans MS, Arial,
    Helvetica;">Browser will try Comic Sans MS first, then Arial, then Helvetica</div>
    | <font face="Comic Sans MS, arial,helvetica">Browser will try Comic Sans MS first,
