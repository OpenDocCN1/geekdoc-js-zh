    # Chapter 3.         Forms In HTML


    ## Web Forms Basics


    Web pages are not just about reading documents and articles, but are also for
    social and business applications. You can hardly imagine any kind of web app without
    asking some data from users—just think about the most common functions, such as
    login and registration.


    HTML forms are the part of the markup since the earliest versions, and now, after
    several twists—that are related to HTML-XHTML debates—we have a refined model
    of forms in HTML5, which still works with older browsers.


    ## How Web Forms Work


    ![00067.jpeg](image_rsrc3EZ.jpg)This shows a web form in action, which contains
    user interface components—or, with another name, controls. Not only textboxes,
    checkboxes and radio buttons are controls in this form, but labels, and frames
    surrounding the sections, too, as well as the Register button.


    A web form in action


    To design and code web forms, you need to understand how they work. Here is a
    simplified overview:


    When the browser displays a web form, it simply renders its controls just like
    any other element, such as text, menus, images, and so on. Users fill it out,
    and then click a button that submits the form. The submission of a form means
    that the browser collects the data entered by the user, puts it into an HTTP/HTTPS
    request, and sends it to the server. When the server side receives the request,
    the web server finds out the type of application or module to dispatch the request
    with the collected data. The entity receiving the request analyzes the information
    collected, and decides what to do next.


    For example, if the request contains registration data, the web server may store
    it in the database and send back a message about the success of registration.
    Or, if the data is invalid, for example a mandatory field has not been filled
    out, the webserver might send back the original form with the data specified by
    the user, and with additional markup that summarizes the issues found by the server
    application.


    So, this process contains these fundamental steps:


    1\. The browser collects the form data, and sends it to the web server.


    2\. The web server processes the data, and sends back the result to the browser.


    3\. The browser visualizes the result (which may be a web page, an error message,
    or some other kind of information, etc.)


    Of course, the most difficult part of this process is step 2, which is carried
    out at the server side. There are many server technologies that can process web
    forms, but in this book we do not dive into them, we will only scratch the surface.


    As the web evolved, and users expected fluent experience, new asynchronous technologies
    appeared, such as AJAX (Asynchronous JavaScript and XML). These do not expect
    the web server to retrieve a full web page, but only a part of the page—affected
    by the changes in regard to the information the users specified. This approach
    results in smaller network packages, and less flickering on the screen. The main
    virtue of the asynchronous technologies is that they can send data to—and retrieve
    data from—a server asynchronously in the background, without preventing user interaction.


    In this chapter you will focus on building and using web forms at the client side.


    ## Representing Web Forms in HTML


    The key HTML element is <form> that defines a web form within a page. The simplest
    web form takes only a few lines of markup:


    <form action="ProcessAtServer.html">


    <input type="submit" value="Do it!"/>


    </form>


    ![00068.jpeg](image_rsrc3F0.jpg)This <form> contains a single <input> tag that
    is decorated with the type="submit" attribute, and it represents a submit button.
    The action property of <form> is set to ProcessAtServer.htlm, so when the user
    clicks the submit button, the content of the form will be sent to that page. Of
    course, as shown in the figure below, this form does not have any other useful
    element, so actually there is no information to send to the action page.


    A very simple and useless web form


    So, let’s create a form with a few real input fields:


    <form action="#">


    <input name="fname" />


    <br />


    <input name="lname" />


    <br />


    <input type="submit" value="Do it!"/>


    </form>


    This markup contains two input fields, having the names fname (first name) and
    lname (last name), respectively. Their corresponding <input> tags are not decorated
    with the type attribute so that these fields will be rendered as text boxes. The
    action attribute of the form is set to #, which will send the form data to the
    page itself.


    ![00069.jpeg](image_rsrc3F1.jpg)Let’s assume, you’ve put this code into the form.html
    file. When you display it in the browser, you can type data into the text boxes,
    as shown in figure below.


    A simple form with two input fields


    When you click the submit button, the form sends the data to the form.html file
    through a web request. The page is displayed again, with empty input fields. Only
    the address bar of your browser tells you that the page is displayed as a result
    of web request from the form, its URL is something like this:


    http://127.0.0.1:8080/?fname=John&lname=Smith#


    In the URL you can see the form data as ?fname=John&lname=Smith, indicating that
    this information was passed through the URL.


    ## Controls Overview


    In these small markup snippets above you’ve already seen a few controls, such
    as the textbox and the submit button, but there are much more. You will learn
    to use them through exercises, but first you’ll be given a short overview of them.


    So, as you already know, <form> is the markup element that encapsulates all controls.
    Most controls can be rendered with the <input> element that has a type attribute.
    This attribute specifies the type of the control, it determines how the control
    is rendered in the browser, and how it behaves. If you do not specify type, the
    control will be a textbox (and this is the same as setting type to text). You
    can choose from several kind of buttons, such as button (clickable button mostly
    used with JavaScript), checkbox, radio (radio button), submit (submits the form),
    image (an image as the submit button), and reset (resets all form values to their
    defaults).


    There are several predefined textual controls with some extra semantics, such
    as password (characters are masked), email (defines a field for an email address),
    url (field for entering an URL), tel (field for a telephone number), search (field
    for search text), and number (field for entering a number). The type file provides
    a file-select field with a Browse button for file uploads. You can place hidden
    fields in a form, used to set form values programmatically.'
