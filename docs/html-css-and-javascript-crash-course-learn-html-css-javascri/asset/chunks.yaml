  trans: "\n\n上述规则移除了锚点链接的默认下划线，并将文本颜色设为红色。内联样式看起来使用起来更简单——它很直观，而且你可以在页面任意位置应用它。但如果你这样格式化页面，会变得相当混乱和令人困惑。你很快就会明白为什么网页设计师通常不采用这种技术。在网页的每个\
    \ HTML 标签中添加内联样式，不仅让代码难以阅读，而且几乎不可能将呈现格式（样式表）与实际 HTML 分离开。例如，让我们考虑之前的例子，但在标签中添加了几条内联样式规则：\n\
    \n```\n<a href=\"#\" style=\"color:red; text-decoration:none; border-style: solid;\
    \ border-color:blue; text-align: left; font-size: 16\"> Click Here </a>\n```\n\
    \n可以看到锚点标签已经开始变得有些杂乱无章。在上面的例子中，很难将内容（\"Click Here\"）与呈现格式分离开。因此，作为良好实践，HTML 标记应始终放在一个独立的、不含呈现格式的文档中。如果可能，尽量完全避免使用内联样式。\n\
    \n## CSS 规则的构成\n\n样式表由规则组成。规则是一条格式化指令，告诉网页浏览器将特定样式应用到你的网页上。\n\n下面是一个 CSS 规则的例子，它将`<p>`段落元素的颜色设置为红色：\n\
    \n```\np { color:red;}\n```\n\n然后，该 CSS 规则被应用到 HTML 文档中的`<p>`段落元素，如下所示：\n\n```\n\
    </p>\n```\n\n这展示了该段落样式在标准网页浏览器中的实际效果。\n\n![00021.jpeg](img/image_rsrc3FE.jpg)\n\
    \n应用于段落元素的 CSS 规则\n\n如果你在浏览器中打开样式表查看代码，你会发现 CSS 规则与 HTML 标记没有任何相似之处。每条 CSS 规则基本上由三部分组成：选择器、属性和值。通常，属性和值总是以分号（;）结尾。\n\
    \n以下是每条 CSS 规则遵循的格式：\n\n```\nSelector {property: value;}\n```\n\n以下是 CSS 规则各部分的具体含义：\n\
    \n*   **选择器**是你想要应用格式的 HTML 元素。例如，段落标签（`<p>`）可以用作选择器。网页浏览器会查找网页中所有与选择器匹配的常见元素，并将花括号内的代码应用到这些元素上。\n\
    \n*   **属性**只是标识你想要应用到 HTML 元素上的格式类型。因此，你可以在这里选择颜色、字体、大小等。\n\n*   **值**为属性设置一个值。例如，如果属性是颜色，那么值可以是绿色或浅蓝色。\n\
    \n选择器、属性和值本质上是 CSS 规则的基本构建块。一旦你开始理解这些，你就离成为样式表大师不远了。\n\n## 创建外部样式表\n\n```\na {\n\
    color:red; text-decoration: none;\n}\n\nh1 {\nfont-family: arial, sans-serif\n\
    }\n```\n\n在继续之前，将文件保存为`style.css`，放在桌面上的主 HTML 文件夹中。样式表可以任意命名，但必须始终使用`.css`文件扩展名。记住，始终将样式表保存在与\
    \ HTML 页面相同的文件夹中，否则你的页面将无法显示格式。\n\n你不需要将样式表直接嵌入到 HTML 标签中，而是要在文档的`<head>`部分添加一个指向外部`.css`样式表的链接。\n\
    \n在`colors.html`文件中，只需移除之前添加到锚点链接的内联样式。为了对比，下面是旧的带内联样式的`colors.html`文件和新的不带内联样式的`colors.html`文件：\n\
    \n带内联样式的 COLORS.HTML 文件——\n\n```\n<!doctype html>\n<html>\n<head>\n<title> My\
    \ First Style Sheet </title>\n<meta charset=\"UTF-8\" />\n</head>\n<body>\n<h1>\
    \ My First Style Sheet </h1>\n<p> <a href=\"#\" style=\"color:red; text-decoration:none;\"\
    >\nClick Here </a> </p>\n</body>\n</html>\n```\n\n不带内联样式的 COLORS.HTML 文件——\n\n\
    ```\n<!doctype html>\n<html>\n<head>\n<title> My First Style Sheet </title>\n\
    <meta charset=\"UTF-8\" />\n</head>\n<body>\n<h1> My First Style Sheet </h1>\n\
    <p> <a href=\"#\"> Click Here </a> </p>\n</body>\n</html>\n```\n\n保存文件后，在网页浏览器中查看以检查你的工作。你会看到样式表中的格式化规则尚未应用到你的网页上。这是因为我们还没有告诉浏览器指向（链接）样式表。\n\
    \n为此，你需要在 HTML 文档的`<head>`部分添加`<link>`元素。`<link>`元素只是将浏览器指向外部样式表，然后浏览器会将样式表的格式化规则应用到你的页面上。\n\
    \n以下是将`<link>`元素添加到页面`<head>`部分后的代码：\n\n```\n<!doctype html>\n<html>\n<head>\n\
    <title> My First Style Sheet </title>\n<link rel=\"stylesheet\" href=\"style.css\"\
    \ />\n<meta charset=\"UTF-8\" />\n</head>\n<body>\n<h1> My First Style Sheet </h1>\n\
    <p> <a href=\"#\"> Click Here </a> </p>\n</body>\n</html>\n```\n\n`<link>`元素包含两部分。`rel`属性定义了当前页面与链接文档之间的关系。实际上，你是在告诉网页浏览器这是一个样式表。\n\
    \n`href`属性（href 代表超文本引用）指向外部样式表的实际位置。当链接到样式表时，`rel`属性应始终为`stylesheet`。\n\n保存文件，然后在网页浏览器中打开以查看你的成果。恭喜！你已经创建了第一个外部样式表。\n\
    \n# 第 9 章 CSS 链接、表格和表单\n\n你可以使用许多其他 CSS 属性来处理链接和表格。你将学习如何为图表的每一列添加颜色，使其脱颖而出。同样，你还会学习如何美化表单，例如提交表单、调查表单以及你在\
    \ HTML 中创建的任何其他表单。\n\n你将能够创建漂亮的按钮，并将其集成到表单中。每个代码示例还包含代码的显示结果。你可以获取代码，重新创建、修改或运行它，以查看其工作原理。即使只是阅读，也能让你大致了解应该如何操作。\n\
    \n```\n<html>\n<head>\n<style>\na {\ncolor: green;\n}\n</style>\n</head>\n<body>\n\
    <h1> 让我给你讲个故事。</h1>\n<h2><b><a href=\"default.asp\" target=\"_blank\">在此观看视频故事。</a></b></h2>\n\
    <p> 从前，有一只鹰在高空飞翔，\n<br> 掠过山巅。\n<br> 有一天，她发现了一枚戒指，卡在苹果树的树枝上。</p> \n<p>她叼起戒指飞回巢穴。玩耍时，她的头被戒指卡住了。\n\
    <br>她没有惊慌，也没有把头撞在树桩上试图摆脱它。\n<br>有一天，她把头浸在油里，戒指从脖子上滑落了下来。</p>\n</body>\n</html>\n\
    ```\n\n上述样式的效果如下。你可以看到第二行代码中隐藏着一个链接。\n\n让我给你讲个故事。\n\n在此观看视频故事。\n\n从前，有一只鹰在高空飞翔，\n\
    \n掠过山巅。\n\n有一天，她发现了一枚戒指，卡在苹果树的树枝上。\n\n她叼起戒指飞回巢穴。玩耍时，她的头被戒指卡住了。\n\n她没有惊慌，也没有把头撞在树桩上试图摆脱它。\n\
    \n然后，有一天她把头浸在油里，戒指从脖子上滑落了下来。\n\n------------------------\n\n"
- fmt: "\nCSS links are critical because many a time you have to connect your webpage\
    \ to another website to offer your users an amazing and fruitful experience. There\
    \ are four kinds of links that you can use for different purposes. They are named\
    \ as `a: link`, `a: hover`, `a: active`, `a: visited`. Each link has a specific\
    \ purpose. For example, `a: hover` is used to allow users to hover over the mouse\
    \ on the link and make it open. Let’s try to create links by all the four methods.\n\
    \n```html\n<html>\n<head>\n<style>\n/* This is an unvisited link */\na:link {\n\
    color: green;\n}\n/* This is a visited link. */\na:visited {\ncolor: blue;\n}\n\
    /* This is a hover link. */\na:hover {\ncolor: violet;\n}\n/* This is a selected\
    \ link. */\na:active {\ncolor: red;\n}\n</style>\n</head>\n<body>\n<h1> Let me\
    \ tell you a story.</h1>\n<h2><b><a href=\"default.asp\" target=\"_blank\">Watch\
    \ the video story here.</a></b></h2>\n<p> Once, there was an eagle that flew high\
    \ in the skies,\n<br> touching upon the tip of the mountains. \n<br> One day she\
    \ found a ring, stuck in the branch of an apple tree.</p> \n<p>She took it and\
    \ flew to her nest. While playing with it, she got her head stuck in it. \n<br>She\
    \ didn't panic or hit her head on the stump of a tree to get rid of it. \n<br>One\
    \ day she drenched her head in oil and the ring came off of her neck.</p>\n</body>\n\
    </html>\n```\n\nYou might be thinking that I had entered four links, but just\
    \ one color can be seen in the results if you have already tested the code. Links\
    \ change their status. In the start, they are unvisited. Then you hover your mouse\
    \ over them. Then you click them open and leave them visited. So, technically,\
    \ you can add four different colors according to the status of your link. Let’s\
    \ see what other things we can do to the links. Also, we can decorate the text\
    \ of links and also add color to the background. Let’s see how to do that.\n\n\
    ```html\n<html>\n<head>\n<style>\n/* This is an unvisited link */\na:link {\n\
    color: green;\ntext-decoration: none;\nbackground-color: yellow\n}\n/* This is\
    \ a visited link. */\na:visited {\ncolor: blue;\ntext-decoration: none;\nbackground-color:\
    \ gray\n}\n/* This is a hover link. */\na:hover {\ncolor: violet;\ntext-decoration:\
    \ underline;\nbackground-color: pink\n}\n/* This is a selected link. */\na:active\
    \ {\ncolor: red;\ntext-decoration: underline;\nbackground-color: hotpink\n}\n\
    </style>\n</head>\n<body>\n<h1> Let me tell you a story.</h1>\n<h2><b><a href=\"\
    default.asp\" target=\"_blank\">Watch the video story here.</a></b></h2>\n<p>\
    \ Once, there was an eagle that flew high in the skies,\n<br> touching upon the\
    \ tip of the mountains. \n<br> One day she found a ring, stuck in the branch of\
    \ an apple tree.</p> \n<p>  She took it and flew to her nest. While playing with\
    \ it, she got her head stuck into it.\n<br> She didn't panic and hit her head\
    \ into the stump of the tree to get rid of it. \n<br> One day she drenched her\
    \ head in oil and the ring moved out of her neck. </p>\n</body>\n</html>\n```\n\
    \n## CSS Tables\n\nCSS allows you to transform the way your tables look in HTML.\
    \ You can add colors to the headings and to the columns. The font style and font\
    \ size of the text inside the tables can also be changed. Let’s create one.\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n#countries {\nfont-family:\
    \ \"Courier New\", Gerogia, Helvetica, sans-serif;\nborder-collapse: collapse;\n\
    width: 80%;\n}\n#countries td, #countries th {\nborder: 2px solid green;\npadding:\
    \ 6px;\n}\n#countries tr:nth-child(even){background-color: violet;}\n#countries\
    \ tr:hover {background-color: #ddd;}\n#countries th {\npadding-top: 15px;\npadding-bottom:\
    \ 15px;\ntext-align: left;\nbackground-color: #ffAc2b;\ncolor: gray;\n}\n</style>\n\
    </head>\n<body>\n<table id=\"countries\">\n<tr>\n<th>Country</th>\n<th>Capital</th>\n\
    <th>Reasons for fame</th>\n</tr>\n<tr>\n<td>Germany</td>\n<td>Berlin</td>\n<td>BMW</td>\n\
    </tr>\n<tr>\n<td>United States of America</td>\n<td>Washington DC</td>\n<td>Marvel</td>\n\
    </tr>\n<tr>\n<td>China</td>\n<td>Beijing</td>\n<td>cheap products</td>\n</tr>\n\
    <tr>\n<td>Pakistan</td>\n<td>Islamabad</td>\n<td>Footballs</td>\n</tr>\n<tr>\n\
    <td>Japan</td>\n<td>Tokyo</td>\n<td>Robotics</td>\n</tr>\n<tr>\n<td>United Kingdom</td>\n\
    <td>London</td>\n<td>Thames</td>\n</tr>\n<tr>\n<td>Egypt</td>\n<td>Cairo</td>\n\
    <td>Pyramids</td>\n</tr>\n<tr>\n<td>India</td>\n<td>New Delhi</td>\n<td>Taj Mehal</td>\n\
    </tr>\n<tr>\n<td>Brazil</td>\n<td>Sao Paulo</td>\n<td>Statue of Jesus</td>\n</tr>\n\
    <tr>\n<td>Kingdom of Saudi Arabia</td>\n<td>Riyadh</td>\n<td>Pilgrimage</td>\n\
    </tr>\n</table>\n</body>\n</html>\n```\n\nThe results of the above code example\
    \ can be seen below. You can change the values and yield out a different output\
    \ in the internet browser. Tables are an essential element for a web page. You\
    \ need them if you are running a website that displays information about the rise\
    \ and fall in the prices of stock market shares. If you don’t style them properly\
    \ with CSS, your visitors are not going to like their dull and boring look. Appropriately\
    \ colored tables appear well on the website and keep visitors engaged for a while.\n\
    \n| Country | Capital | Reasons for fame |\n| Germany | Berlin | BMW |\n| United\
    \ States of America | Washington DC | Marvel |\n| China | Beijing | cheap products\
    \ |\n| Pakistan | Islamabad | Footballs |\n| Japan | Tokyo | Robotics |\n| United\
    \ Kingdom | London | Thames |\n| Egypt | Cairo | Pyramids |\n| India | New Delhi\
    \ | Taj Mehal |\n| Brazil | Sao Paulo | Statue of Jesus |\n| Kingdom of Saudi\
    \ Arabia | Riyadh | Pilgrimage |\n\nYou can alter the colors, the border, and\
    \ padding by making slight changes in the HTML document. Adding more columns or\
    \ rows to suit your specific requirement is also being done. In the above example,\
    \ I have added background colors, padding, border colors and have also adjusted\
    \ the width of the columns. You can take the example document and customize for\
    \ learning practice.\n\n## CSS Forms\n\nHTML provides us with an easy way to create\
    \ different types of forms that we can use to collect user information like their\
    \ usernames, passwords, and email addresses. Some are subscription forms while\
    \ others are survey forms. When we create an HTML form, its look is rigid and\
    \ dull. Thanks to CSS, we can change that. We can make it look exceptionally well.\
    \ Let’s create a form and then transform its look by adding some simple CSS properties.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<style>\ninput[type=text], select {\nwidth:\
    \ 100%;\npadding: 15px 25px;\nmargin: 10px 0;\ndisplay: inline-block;\nborder:\
    \ 2px solid green;\nborder-radius: 6px;\nbox-sizing: border-box;\n}\ninput[type=submit]\
    \ {\nwidth: 50%;\nbackground-color: pink;\ncolor: black;\npadding: 12px 18px;\n\
    margin: 10px 0;\nborder: 2px solid green;\nborder-radius: 2px;\ncursor: pointer;\n\
    font-size: 25px\n}\ninput[type=submit]:hover {\nbackground-color: #45b049;\n}\n\
    div {\nborder-radius: 4px;\nbackground-color: #f1f1f1;\npadding: 15px;\n}\n</style>\n\
    <body>\n<h1>I will be using CSS to style this raw HTML Form</h1>\n<div>\n<form\
    \ action=\"/action_page.php\">\n<label for=\"name\">Please enter your first Name</label>\n\
    <input type=\"text\" id=\"name\" name=\"firstname\" placeholder=\"Plese enter\
    \ here..\">\n<label for=\"lname\">Please enter your last Name</label>\n<input\
    \ type=\"text\" id=\"lname\" name=\"lastname\" placeholder=\"Please enter here..\"\
    >\n<label for=\"country\">Where do you live?</label>\n<select id=\"country\" name=\"\
    country\">\n<option value=\"USA\">USA</option>\n<option value=\"canada\">Canada</option>\n\
    <option value=\"UK\">UK</option>\n<option value=\"china\">China</option>\n<option\
    \ value=\"pakistan\">Pakistan</option>\n<option value=\"france\">France</option>\n\
    </select>\n<input type=\"submit\" value=\"Submit\">\n</form>\n</div>\n</body>\n\
    </html>\n```\n\nThe result is as under:\n\n![00001.jpeg](image_rsrc3FF.jpg)\n\n\
    I have styled the border, the input fields, the submit button and a lot more.\
    \ Let’s learn more about designing the buttons, as they are an essential part\
    \ of forms on your web page.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n\
    input[type=refresh], input[type=submit], input[type=process] {\n```\n"
  raw: 'CSS links are critical because many a time you have to connect your webpage
    to another website to offer your users an amazing and fruitful experience. There
    are four kinds of links that you can use for different purposes. They are named
    as a: link, a: hover, a: active, a: visited. Each link has a specific purpose.
    For example, a: hover is used to allow users to hover over the mouse on the link
    and make it open. Let’s try to create links by all the four methods. 


    <html>


    <head>


    <style>


    /* This is an unvisited link */


    a:link {


    color: green;


    }


    /* This is a visited link. */


    a:visited {


    color: blue;


    }


    /* This is a hover link. */


    a:hover {


    color: violet;


    }


    /* This is a selected link. */


    a:active {


    color: red;


    }


    </style>


    </head>


    <body>


    <h1> Let me tell you a story.</h1>


    <h2><b><a href="default.asp" target="_blank">Watch the video story here.</a></b></h2>


    <p> Once, there was an eagle that flew high in the skies,


    <br> touching upon the tip of the mountains. 


    <br> One day she found a ring, stuck in the branch of an apple tree.</p> 


    <p>She took it and flew to her nest. While playing with it, she got her head stuck
    in it. 


    <br>She didn''t panic or hit her head on the stump of a tree to get rid of it. 


    <br>One day she drenched her head in oil and the ring came off of her neck.</p>


    </body>


    </html>


    You might be thinking that I had entered four links, but just one color can be
    seen in the results if you have already tested the code. Links change their status.
    In the start, they are unvisited. Then you hover your mouse over them. Then you
    click them open and leave them visited. So, technically, you can add four different
    colors according to the status of your link. Let’s see what other things we can
    do to the links. Also, we can decorate the text of links and also add color to
    the background. Let’s see how to do that. 


    <html>


    <head>


    <style>


    /* This is an unvisited link */


    a:link {


    color: green;


    text-decoration: none;


    background-color: yellow


    }


    /* This is a visited link. */


    a:visited {


    color: blue;


    text-decoration: none;


    background-color: gray


    }


    /* This is a hover link. */


    a:hover {


    color: violet;


    text-decoration: underline;


    background-color: pink


    }


    /* This is a selected link. */


    a:active {


    color: red;


    text-decoration: underline;


    background-color: hotpink


    }


    </style>


    </head>


    <body>


    <h1> Let me tell you a story.</h1>


    <h2><b><a href="default.asp" target="_blank">Watch the video story here.</a></b></h2>


    <p> Once, there was an eagle that flew high in the skies,


    <br> touching upon the tip of the mountains. 


    <br> One day she found a ring, stuck in the branch of an apple tree.</p> 


    <p>  She took it and flew to her nest. While playing with it, she got her head
    stuck into it.


    <br> She didn''t panic and hit her head into the stump of the tree to get rid
    of it. 


    <br> One day she drenched her head in oil and the ring moved out of her neck.
    </p>


    </body>


    </html>


    ## CSS Tables


    CSS allows you to transform the way your tables look in HTML. You can add colors
    to the headings and to the columns. The font style and font size of the text inside
    the tables can also be changed. Let’s create one. 


    <!DOCTYPE html>


    <html>


    <head>


    <style>


    #countries {


    font-family: "Courier New", Gerogia, Helvetica, sans-serif;


    border-collapse: collapse;


    width: 80%;


    }


    #countries td, #countries th {


    border: 2px solid green;


    padding: 6px;


    }


    #countries tr:nth-child(even){background-color: violet;}


    #countries tr:hover {background-color: #ddd;}


    #countries th {


    padding-top: 15px;


    padding-bottom: 15px;


    text-align: left;


    background-color: #ffAc2b;


    color: gray;


    }


    </style>


    </head>


    <body>


    <table id="countries">


    <tr>


    <th>Country</th>


    <th>Capital</th>


    <th>Reasons for fame</th>


    </tr>


    <tr>


    <td>Germany</td>


    <td>Berlin</td>


    <td>BMW</td>


    </tr>


    <tr>


    <td>United States of America</td>


    <td>Washington DC</td>


    <td>Marvel</td>


    </tr>


    <tr>


    <td>China</td>


    <td>Beijing</td>


