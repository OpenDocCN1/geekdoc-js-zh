    \ `a: link`、`a: hover`、`a: active`、`a: visited`。每个链接都有特定的用途。例如，`a: hover` 用于让用户将鼠标悬停在链接上并使其打开。让我们尝试用这四种方法创建链接。\n\
    \n```html\n<html>\n<head>\n<style>\n/* 这是未访问的链接 */\na:link {\ncolor: green;\n\
    }\n/* 这是已访问的链接。 */\na:visited {\ncolor: blue;\n}\n/* 这是悬停链接。 */\na:hover {\ncolor:\
    \ violet;\n}\n/* 这是选中的链接。 */\na:active {\ncolor: red;\n}\n</style>\n</head>\n\
    <body>\n<h1> 让我给你讲个故事。</h1>\n<h2><b><a href=\"default.asp\" target=\"_blank\"\
    >在此观看视频故事。</a></b></h2>\n<p> 从前，有一只鹰在高空飞翔，\n<br> 掠过山巅。\n<br> 有一天，她发现一枚戒指卡在苹果树的树枝上。</p>\
