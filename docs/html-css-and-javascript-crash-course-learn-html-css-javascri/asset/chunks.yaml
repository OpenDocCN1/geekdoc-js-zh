    # Chapter 5. How to Put Images in HTML?


    There is a famous quotation that “picture says a thousand words”. Quotation shows
    how powerful pictures are in terms of delivering a message. Web sites show pictures
    to make web pages more exciting, optical and lively.


    How do we show image or picture on any web page?


    ## Examples of Images


    Let’s see an example of picture on web page. Please go to the following page in
    Wikipedia <https://en.wikipedia.org/wiki/Albert_Einstein>. You see images as shown
    below:


    ![00033.jpeg](image_rsrc3F5.jpg)


    Images


    Example


    You can see that I have marked two images – one is of Albert Einstein and other
    is of Wikipedia Logo. Don’t you agree that these images have made this page lively?
    Images on the web page can be used in two ways:


    - One way is just show image. Just show; nothing else.

    - Other way is to use image as hyperlink. It means when you click on the image,
    it will take you to some other page. How interesting!


    ## Learning The Details


    How do we show image on web page? We use `<img>` tag for this purpose. Please
    check the example below:


    ```

    <img src="location of the image" alt="alternate text" width="width in pixel" height="height
    in pixel"></img>

    ```


    We start `<img>` tag and then we close with `</img>` tag like we do for any HTML
    tag. But then we use various other attributes to make sure image is shown on the
    web page. Let’s look into these attributes in the table below.


    **Table 6.1: Attributes of the `<img>` tag**


    | `<img>` tag attribute | Purpose |

    |-----------------------|---------|

    | `src` | `src` stands for source. Like hyperlink, you enter address of the image
    for this attribute. Address is the location where this image has been stored.
    The address could be internet based image. It means image is stored at internet
    somewhere like any web page. Example is Albert Einstein image stored at Wikipedia.
    Address is: `https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Einstein_1921_by_F_Schmutzer_-_restoration.jpg/220px-Einstein_1921_by_F_Schmutzer_-_restoration.jpg`
    Or it could an address from your computer/laptop hard disk. It means the image
    is stored somewhere in your local computer hard disk. You provide folder location
    of the image. Example is – `"file://C:/Books\HTMLforKids/mybook.jpg"` You can
    use most types of images such as `jpg`, `jpeg`, `png`, `gif` and `bmp`. |

    | `alt` | `alt` stands for alternate text. This is the text shown on web page
    if image could not be shown on web page due to some reason. It is like a backup
    plan. You want to show some text in case image could not be shown due to some
    problem. |

    | `width` | This tells the width of the image. If you don’t provide this value,
    then it will show image in its original width. Width is measured in pixel. One
    pixel is like a dot on the screen. Just like you measure distance in meter or
    centimeter; in the same way you measure length of the image in pixel. |

    | `height` | Tells the height of the image. Similar to width, it is also measured
    in pixel. If you don’t provide this value, then it will show image in its original
    height. |


    Let me show you image in HTML. I am going to use Albert Einstein image address
    given in the table above and will show that in my HTML page. I will make height
    200 pixel and width also 200 pixels; like square. The HTML looks like following:


    ```

    <html>

    <head>

    <title></title>

    </head>

    <body>

    <h2>Albert Einstein</h2>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Einstein_1921_by_F_Schmutzer_-_restoration.jpg/220px-Einstein_1921_by_F_Schmutzer_-_restoration.jpg"
    alt="Albert Einstein" width="200" height="200"></img>

    </body>

    </html>

    ```


    The HTML page will be displayed as shown below.


    ![00034.jpeg](image_rsrc3F6.jpg)


    Web Page Display You see it shows image in the square size (200 x 200) as I have
    mentioned in `<img>` tag attribute.


    What will happen if some problem comes with image? For example, you give wrong
    address to image. I suggest you try it yourself.


    You observed it right. It is showing Alternate Text as defined in `<img>` tag
    attribute in place of the image.


    Let’s move next! What about using image as hyperlink? Sounds great! Right? Following
    is the structure of hyperlink tag:


    ```

    <a href="Address of web page"> text of hyperlink </a>

    ```


    To make image as hyperlink, you will replace text of hyperlink with `<img>` tag.
    For example, if I want to make image of Albert Einstein hyperlink which will take
    me to Wikipedia page, then my HTML `<a>` tag will look like the following:


    ```

    <a href="https://en.wikipedia.org/wiki/Albert_Einstein"> <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Einstein_1921_by_F_Schmutzer_-_restoration.jpg/220px-Einstein_1921_by_F_Schmutzer_-_restoration.jpg"
    alt="Albert Einstein" width="200" height="200"></img> </a>

    ```


    Is this not simple and intuitive? I am sure you will agree with me.


    # Chapter 6. HTML Tables


    Tables are very useful to represent the data in grid format. The data is divided
    into rows and columns. It helps us to understand the data on two axes. Each block
    in the table is called as table cell. Let’s take a look at how table is created
    in the HTML.


    ## Table Creation


    `<table>` element is used to create a table. The contents of the table are written
    out row by row. `<tr>` element is used to represent a start of each row. `<tr>`
    means table row. Each cell of the table is represented using a `<td>` element.
    A table row can also be divided into table headings with the `<th>` tag. Let’s
    take a closer look at table creation with an example


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <table>

    <tr>

    <td>A</td>

    <td>X</td>

    <td>1</td>

    </tr>

    <tr>

    <td>B</td>

    <td>Y</td>

    <td>2</td>

    </tr>

    <tr>

    <td>C</td>

    <td>Z</td>

    <td>3</td>

    </tr>

    </table>

    </body>

    </html>

    ```


    ![](image_rsrc3F7.jpg)


    Table looks good with borders. We will learn how to draw borders around the tables
    using CSS.


    ## Table Headings


    The heading for either a row or column is represented using `<th>` element. `<th>`
    means table heading. For an empty cell you should use `<td>` or `<th>` element
    otherwise the table will not be created correctly. The `scope` attribute can be
    used on the `<th>` element to indicate whether it is row or column. It takes the
    values, `row` to indicate heading for a row or `col` to indicate heading for a
    column. The contents of `<th>` element is displayed in the bold and centered way.
    Table can also be given caption using `<caption>` tag.


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <table>

    <caption><b>Ticket Sales</b></caption>

    <tr>

    <th></th>

    <th scope="col">Saturday</th>

    <th scope="col">Sunday</th>

    </tr>

    <tr>

    <th scope="row">Tickets Sold</th>

    <td>50</td>

    <td>20</td>

    </tr>

    <tr>

    <th scope="row">Total Sale</th>

    <td>100</td>

    <td>150</td>

    </tr>

    </table>

    </body>

    </html>

    ```


    ![](image_rsrc3F8.jpg)


    ## Spanning Columns


    Sometimes you may need the entries in the table to stretch across many columns.
    For this purpose, `colspan` attribute is used. It indicates how many columns cell
    should run across.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <style>

    table, th, td {

    border: 1px solid black;

    border-collapse: collapse;

    }

    th, td {

    padding: 5px;

    text-align: left;

    }

    </style>

    </head>

    <body>

    <h2>Cell that spans two columns:</h2>

    <table style="width:100%">

    <tr>

    <th>Name</th>

    <th colspan="2">Telephone</th>

    </tr>

    <tr>

    ```


