    # 第 8 章 CSS


    样式表是一种包含格式化规则的文档。Web 浏览器会读取这些规则，并将格式应用到你的页面上。使用样式表可以控制页面元素，如边框、颜色和边距，甚至可以嵌入本地计算机上没有的字体。


    样式表的正式名称是 CSS（层叠样式表）。CSS 是一种独立的语言，拥有自己的语法，但别被它吓到。这种语言是专门为格式化 Web 页面而开发的。它非常强大，只需一条命令就能改变整个
    Web 页面的外观。


    你应该始终将 CSS 规则放在一个单独的文件中，而不是直接嵌入到 Web 页面里。这样做的原因是为了将 HTML 代码与 CSS 规则分离，从长远来看，更新代码会更容易。


    在 CSS 出现之前，Web 设计师们寻找其他方法来改变页面的布局。其中一种方法是使用表格标签——一组用于制作表格、表头、表格行等的独立 HTML 标签。但表格标签经常被滥用。它们不是用来给页面增加结构，而是常常被用来布局
    Web 页面。在 CSS 出现之前，使用表格标签或其他格式修改大型网站非常困难、耗时且昂贵，因为你必须逐个编辑网站的每个页面。


    CSS 正是为了消除使用表格标签所带来的困难、成本和时间而开发的。只需编辑一个 CSS 文件，你就可以立即对大型复杂的网站进行修改。例如，你可以创建一个 CSS
    规则来格式化字体大小，然后网站上的每个页面都会更新以反映这些具体变化。


    ## 你的第一个样式表


    现在，我们应该把学到的所有东西整合起来，创建你的第一个 CSS（层叠样式表）。


    如果你熟悉 Web 并访问过许多网站，你会知道浏览器默认将文本链接显示为蓝色并带有下划线。（这是浏览器对文本链接的默认（自动）格式显示。）但如果蓝色链接与你自己的
    Web 页面的整体外观和感觉不协调呢？


    你可以构建一条样式表规则来更改页面上链接的文本颜色。要做到这一点，只需使用 CSS 样式属性，并在 HTML 元素中声明它。下面是一个示例：


    ```html

    <a href="#" style:"color: red;"> 点击这里 </a>

    ```


    样式属性由两部分组成：属性名和值。以下是每个属性遵循的格式及其在代码中的样子：


    ```html

    <style: property; name: value;>

    ```


    在这个例子中，属性指定了应用于 HTML 元素的格式化类型。这里的 `color` 是属性，它设置了锚点链接的颜色。值是颜色的实际名称——`red`。在另一个
    CSS 样式属性的例子中，属性名可能是 `font`，值可能是字体的大小。


    这条 CSS 规则通常被称为语句。语句只是一段代码；在这里，它所做的就是指定样式属性为 `color`，并使锚点链接（“点击这里”）变为红色（颜色“值”）。


    在 Sublime Text 2 中，选择 File | New 创建一个新文档。现在，按照你看到的代码精确输入：


    ```html

    <!doctype html>

    <html>

    <head>

    <title> 我的第一个样式表 </title>

    <meta charset="UTF-8" />

    </head>

    <body>

    <p> <a href="#" style="color:red; text-decoration:none;">

    点击这里 </a> </p>

    </body>

    </html>

    ```


    完成后，将文件以 `colors.html` 的名称保存到桌面上的 HTML 文件夹中。现在在 Web 浏览器中预览该文件，检查你的工作。


    要移除锚点链接的标准下划线文本，请使用 `text-decoration` 属性，值为 `none`（参见上面 `color: red` 之后的示例）。`text-decoration`
    用于设置文本的外观——你可以移除下划线、给标准文本添加下划线、在文本上方或中间添加线条，以及让文本闪烁。


    `text-decoration` 属性有以下可能的值：`underline`、`line-through`、`overline`、`none` 和 `blink`。下面是一个文本装饰的代码示例，它使文本闪烁：


    ```css

    text-decoration: blink;

    ```


    打开我们刚刚处理的名为 `colors.html` 的网页，将其他值添加到 `text-decoration` 属性中。在 Web 浏览器中预览该文件，查看你的工作效果。


    ```html

    <p> <a href="#" style="color:red; text-decoration:blink;">

    点击这里 </a> </p>

    ```


    尝试自己实验，将 `underline`、`line-through` 和 `overline` 值添加到 `text-decoration` 属性中，看看会发生什么。


    ## 内联样式


    内联样式允许你将样式表的属性名和值直接插入到 HTML 标签中。但你应该尽量避免使用这种方法。因为内联样式将格式与 HTML 标记混合在一起，使得修改 Web
    页面变得困难：页面上的每个样式都必须在源代码中逐一查找——你很快就会明白这一点。


    下面是我们之前用于格式化锚点链接的示例：


    ```html

    <a href="#" style="color:red; text-decoration:none;"> 点击这里 </a>

    ```


