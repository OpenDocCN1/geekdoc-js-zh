  trans: "\n\n![基础 HTML 页面](img/img-f7.1.html)\n\n**图 7.1** 基础 HTML 页面\n\n保持 Chrome\
    \ 开发者工具窗口打开并点击“Try it”（尝试一下）按钮，观察“Elements”（元素）选项卡中该 HTML 元素的文本变化。这是你的 JavaScript\
    \ 代码通过 DOM 动态更改 HTML 元素的实时视图。你可以直接在“Elements”（元素）选项卡中通过双击该文本（`<p></p>` 标签之间的内容）来操作\
    \ DOM，更改它并按 [Enter]（回车键）。你应该看到网页上的文本变为了你输入的任何内容。\n\n在我们的示例中，我们通过从 DOM 中选择该元素并使用这行代码更改其值来与\
    \ HTML 元素进行交互：\n\n```javascript\ndocument.getElementById(\"test\").innerHTML =\
    \ \"Some new text appeared!\"; \n```\n\n让我们拆解这个语句并看看每个部分的作用：\n\n* `document`\n\
    \    这是 DOM 中的“D”，是全局（根）文档对象，它包含了所有的 HTML 元素。\n\n* `.getElementById(\"test\")`\n\
    \    这是用于在 DOM 中选择元素的 JavaScript 方法，该元素是带有 `id` 属性 `test` 且包含 `\"Some old text\"\
    ` 的 `<p>` 标签。\n\n* `.innerHTML = \"Some new text appeared!\"`\n    这是 HTML 属性，将\
    \ HTML 元素的内容（`<p></p>` 标签之间的部分）设置为 `\"Some new text appeared!\"`。\n\n## 7.2 遍历\
    \ DOM\n\nDOM 本身只是表示为相互连接的节点树（HTML 元素）的对象。你有一个代表浏览器标签页的 window 对象，在其下方是 document\
    \ 对象节点，它可以被视为实际网页的根节点，而你所有的其他节点（HTML 元素）都位于它的下方。如果你查看 Chrome 开发者工具窗口中的“Elements”（元素）选项卡，你会看到我们\
    \ HTML 页的节点结构，如图图 7.2 所示。\n\n![DOM 节点结构](img/img-f7.2.html)\n\n**图 7.2** DOM 节点结构\n\
    \n如果你必须遵循包含我们动态文本的 `<p>` 标签的全路径，它看起来大致如下：Browser • document • `<<body>` • `<div\
    \ id=\"text-div\">` • `<p id =\"test\">`。\n\n你可以通过点击 Chrome 开发者工具中节点旁的小箭头在 DOM\
    \ 树中导航，这会打开该节点下方的下一级节点，直到到达最低层节点。\n\n当你遍历 DOM 时，你正在导航到你感兴趣的任何 HTML 元素，以便对其进行读取或操作。\n\
    \n## 7.3 选择器方法\n\n在我们上一个示例中，我们使用 DOM 方法 `document.getElementById(\"test\")` 根据其\
    \ `id` 属性从 DOM 中选择 HTML 元素，在此例情况下该属性为 `test`。这是 Selectors API 提供的 JavaScript 方法之一，该\
    \ API 是 Web APIs 的一部分（更多信息请参阅第 13 节）。你还有可以使用其他方法。其中最流行的之一如下：\n\n```javascript\n\
    document.querySelector(\"#test\") \n```\n\n该方法通过 `\"#test\"` 找到相同的 `<p>` 元素，其中\
    \ `\"#test\"` 指向 `id` 值 `test`。运行相同的方法可以找到多个匹配该 `id` 的元素，如下：\n\n```javascript\n\
    document.querySelectorAll(\"#test\") \n```\n\n该方法将返回所有 `id` 为 `test` 的元素列表。\n\n\
    你也可以使用 Chrome 开发者工具在“Elements”（元素）选项卡中查找选择器，只需右键点击元素并选择 Copy（复制）• Copy Selector（复制选择器），然后将其粘贴到你的\
    \ JavaScript 选择器方法中，如图图 7.3 所示。\n\n![复制选择器](img/img-f7.3.html)\n\n**图 7.3** 选择器\n\
    \n## 7.4 DOM 操作\n\n你可以使用 DOM 更改网页上的许多不同内容，从 HTML 元素内容到元素属性，甚至添加完全新的 DOM 元素。在我们之前的示例中，我们更改了\
    \ `innerHTML`，即元素的内容，即 `<p></p>` 标签之间的文本。在列表 7.1 中，我们在点击按钮事件后使用 `style` 属性调整文本的\
    \ CSS。\n\n```javascript\nfunction changeSomeText() {\n  document.getElementById(\"\
    test\").innerHTML = \"Some new text appeared!\";\n  document.getElementById(\"\
    test\").style.cssText =\n    \"fontWeight: bold; background-color: Chartreuse\"\
    ;\n} \n```\n\n**列表 7.1** DOM 操作：CSS\n\n我们可以进一步操作 DOM，不仅仅是更改文本或 CSS 属性，还可以向 DOM\
    \ 添加完全新的元素。在列表 7.2 中，我们创建了一个函数，向 `id` 为 `text-div` 的 `div` 添加一个新的 `<p>` 标签。\n\n\
    ```javascript\nfunction addSomeText() {\n  const div = document.getElementById(\"\
    text-div\");\n  const newText = document.createElement(\"p\");\n  newText.textContent\
    \ = \"Some brand new text here!\";\n  div.appendChild(newText);\n} \n```\n\n**列表\
    \ 7.2** 向 DOM 添加新元素\n\n这种操作是双向的；你也可以遵循类似的逻辑来删除 DOM 元素。在列表 7.3 中的函数从 DOM 中删除了 `id`\
    \ 为 `test` 的 `<p>` 元素。\n\n```javascript\nfunction removeSomeText() {\n  const\
    \ text = document.querySelector(\"#test\");\n  text.remove();\n} \n```\n\n**列表\
    \ 7.3** 删除元素\n\n"
- fmt: "\nOur example in the previous section uses the HTML `onclick` event (when\
    \ a user clicks using their mouse) to trigger the JavaScript code that changes\
    \ the text in the `<p></p>` tag. There are many different types of HTML events,\
    \ ranging from a mouse click to a key press to just hovering your mouse over a\
    \ certain HTML element. You specify if you want to trigger these events within\
    \ the properties of the element and specify the JavaScript code to be executed\
    \ when this event is triggered.\n\nWe’ll discuss handling events in the following\
    \ sections, as well as the most common events that are available.\n\n## 8.1 Registering\
    \ Events\n\nIn our example from [Section 7](#07_001.html_h7), we specified the\
    \ `onclick` event in the `<button></button>` tag, as follows:\n\n```\n<button\
    \ type=\"button\" onclick=\"changeSomeText()\">Try it</button> \n```\n\nThe `onclick`\
    \ event is specified as a property and the JavaScript function is specified after\
    \ the equals sign with `()`, meaning it needs to be executed on this event. We\
    \ can add another event, `onmouseover()`, to our example and change the `<h1>`\
    \ text when the mouse cursor hovers over it. Let’s adjust our `<h1>` tag to include\
    \ an `id` property and `onmouseover` event property:\n\n```\n<h1 id=\"header-text\"\
    \ onmouseover=\"onMouseHoverH1()\">A normal everyday webpage</h1> \n```\n\nWe\
    \ then add a new JavaScript function, `onMouseHoverH1()`, with the function code\
    \ shown in [Listing 8.1](#08_001.html_l8.1) to modify the text and CSS when we\
    \ hover over the text. The result will be the text You hovered over me didn’t\
    \ you! appearing in red, as shown in [Figure 8.1](#08_001.html_f8.1).\n\n```\n\
    function onMouseHoverH1() {\n  let headerText = document.querySelector(\"#header-text\"\
    );\n  headerText.style.color = \"red\";\n  headerText.innerHTML = \"You hovered\
    \ over me didn't you!\";\n} \n```\n\n**Listing 8.1** onmouseover Event Function\n\
    \n[![onmouseover Event](bilderklein/klein08_001.png)](img-f8.1.html)\n\n**Figure\
    \ 8.1** onmouseover Event\n\nAlong with registering your events in the HTML DOM\
    \ element properties themselves, you can also register an event directly in your\
    \ JavaScript code without needing to specify the `onclick` property in your HTML.\
    \ In [Listing 8.2](#08_001.html_l8.2), we use the `window.onload` event to register\
    \ a `\"click\"` event on our button.\n\n```\nwindow.onload = (event) => {\n  document.getElementById(\"\
    btn1\").addEventListener(\"click\", changeSomeText);\n}; \n```\n\n**Listing 8.2**\
    \ Registering an HTML Event with JavaScript\n\nIn this example, the `window.onload`\
    \ event only fires when the page has fully loaded, which needs to happen because\
    \ we can only register an event to an HTML property when it’s loaded. Once the\
    \ page is loaded, we use the `.addEventListener` method to register the `\"click\"\
    ` event (like the `onclick` HTML event property), followed by the function `changeSomeText`,\
    \ which will be triggered when the event is fired.\n\n## 8.2 Handling Complimenting\
    \ Events\n\nIn our example from [Listing 8.1](#08_001.html_l8.1), notice how when\
    \ you hover over the header text, the DOM manipulation occurs, but the text stays\
    \ that way even when your mouse is no longer hovering over the header text. It\
    \ is important to understand that when you change things in the DOM, you often\
    \ need a counteracting event to balance things, like `onmouseout` in conjunction\
    \ with `onmouseover`, to create the complete effect of moving your mouse on and\
    \ off an element.\n\nTo do that, we adjust our HTML code once more and add the\
    \ `onmouseout` property with a JavaScript function to return the text to what\
    \ it was before. We add the `onmouseout` event property to the `<h1>` tag as follows:\n\
    \n```\n<h1 id=\"header-text\" onmouseover=\"onMouseHoverH1()\" onmouseout=\"onMouseOffH1()\"\
    >A normal everyday webpage</h1> \n```\n\nWe add this with a JavaScript function\
    \ like the one for `onmouseover`, as shown in [Listing 8.3](#08_002.html_l8.3),\
    \ including the code to change the header text back. The result should be that\
    \ the text changes when you hover over it and changes back when your mouse moves\
    \ away again.\n\n```\nfunction onMouseOffH1() {\n  let headerText = document.querySelector(\"\
    #header-text\");\n  headerText.style.color = \"\";\n  headerText.innerHTML = \"\
    A normal everyday webpage\";\n} \n```\n\n**Listing 8.3** onmouseout Event Function\n\
    \n## 8.3 Common HTML Events\n\nMouse events are common HTML events you will use\
    \ regularly to make your webpage dynamic, but there are two other events worth\
    \ noting you will come across quite often, as we’ll discuss in the following sections.\n\
    \n### onload\n\nThe `onload` HTML event fires when the page has finished loading\
    \ and is a common requirement to execute JavaScript code that runs only when all\
    \ webpage elements have loaded. Using our example from the previous section, we\
    \ can add the `onload` event to our `<body>` tag as follows:\n\n```\n<body onload=\"\
    onPageLoad()\"></body> \n```\n\nWe then add a new function from [Listing 8.4](#08_003.html_l8.4)\
    \ to trigger an alert when our page has fully loaded.\n\n```\nfunction onPageLoad()\
    \ {\n  alert(\"Congratulations! The page has finished loading.\")\n} \n```\n\n\
    **Listing 8.4** onload Event Function\n\n### onchange\n\nThe `onchange` HTML event\
    \ is triggered every time an HTML element changes; for example, as you type something\
    \ into a form input, each new character you type will trigger the `onchange` event.\
    \ To demonstrate, we add a form input to our HTML page and add the `onchange`\
    \ event to it as follows:\n\n```\nName:<input id=\"name-input\" type=\"text\"\
    \ onchange=\"onInputChange()\"> \n```\n\nWe add the function from [Listing 8.5](#08_003.html_l8.5)\
    \ that will alert you whenever you type something new into the input and click\
    \ out of it or press [Enter].\n\n```\nfunction onInputChange() {\n  alert(\"Something\
    \ changed in the input!\");\n} \n```\n\n**Listing 8.5** onchange Event Function\n\
    \n# 9 Asynchronous JavaScript\n\nUp until this point, you have used JavaScript\
    \ in a synchronous way without really knowing it. JavaScript is by nature a synchronous\
    \ language, which means functions are executed in the order they were written,\
    \ or more simply put, functions can only be executed one at a time. That point\
    \ highlights one of the biggest downsides of standard JavaScript, i.e., each function\
    \ must finish executing before the next one can start, causing what is known as\
    \ blocking. Blocking can render your webpage slow and unresponsive. This is similar\
    \ to when an ABAP program specifies `COMMIT WORK AND WAIT`, where the program\
    \ has to wait for the result of that commit before continuing on.\n"
