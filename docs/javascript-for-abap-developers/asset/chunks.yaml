    \    - 12.5 在 DOM 中添加和移除元素\n    - 12.6 修改 CSS\n    - 12.7 jQuery AJAX\n- 13 Web\
    \ APIs\n    - 13.1 浏览器导航与历史\n    - 13.2 地理位置\n    - 13.3 浏览器存储\n- 14 调试与错误处理\n\
    \    - 14.1 错误类型与视图\n    - 14.2 调试\n    - 14.3 错误处理\n- 15 接下来\n\n# 1 JavaScript\
    \ 简介及其基本原理\n\nJavaScript 起初作为一种编程语言，允许你向静态网页中添加复杂的逻辑，以动态地响应用户输入或应用程序编程接口（API）的变化。从那以后，它发展成为一种全能编程语言，可以使用其庞大的库和框架生态系统构建任何内容。无疑，你可能听说过某个框架属于\
    \ SAP 产品范围：SAPUI5 或 OpenUI5（后者是 SAPUI5 的开源版本）。\n\n"
- fmt: "\nJavaScript runs in all modern web browsers: Chrome, Firefox, Safari, Edge,\
    \ and so on. With the introduction of runtimes such as `Node.js`, JavaScript also\
    \ runs on servers, much like ABAP runs on the ABAP stack. This means JavaScript\
    \ is no longer just a frontend language anymore but can perform backend server\
    \ logic as well, effectively letting you build and run full stack applications\
    \ using JavaScript code alone.\n\nJavaScript at its core is a single-threaded,\
    \ synchronous programming language, which means each piece of code is executed\
    \ in the order it was written. This can become a limitation, as your functions\
    \ cannot execute until the previous function has completed its action. In [Section\
    \ 9](#09_001.html_h9), we will learn more about how to overcome this limitation\
    \ using a concept called asynchronous JavaScript, which allows a function to run\
    \ in the background without holding up the functions directly after. \n\nComing\
    \ from ABAP, one of the main differences to get used to with JavaScript is its\
    \ flexibility and dynamic (loose) typing system, which we’ll discuss further in\
    \ [Section 2](#02_001.html_h2). Many of the errors in your JavaScript will only\
    \ become apparent at runtime. This contrasts with ABAP (which is a compiled language),\
    \ which has the benefit of catching most of these errors at compile time. So,\
    \ it is crucial you implement proper error handling wherever possible.\n\nOne\
    \ of the biggest benefits of JavaScript is that you can write and execute your\
    \ code almost anywhere. You do not need a connection to an SAP instance as you\
    \ do with ABAP to run your code. That is why, throughout this E-Bite, we encourage\
    \ you to try absolutely everything you read. The best and quickest way to learn\
    \ JavaScript is by constantly trying out the new concepts you read about.\n\n\
    In this section, we’ll get started with the important concepts to develop a contextual\
    \ understanding of JavaScript. We’ll discuss compatibility, runtimes, preparation\
    \ steps, and how to execute your first piece of JavaScript code in the browser\
    \ and with `Node.js`. We’ll end with a look at how comments function with JavaScript.\n\
    \n## 1.1 ECMAScript and Browser Compatibility\n\nECMAScript is the formal standard\
    \ of the JavaScript programming language and has been in use since 1997. ECMAScript\
    \ (ES) highlights the different releases of JavaScript and what features are included\
    \ with each version. This is important because different browsers support these\
    \ releases in certain browser versions. Some browsers don’t support certain versions\
    \ at all, as is the case with Internet Explorer not supporting ES6 (ECMAScript\
    \ 2015). Compare this to ABAP releases, where certain features are only available\
    \ on later versions.\n\n### Note\nYou can see the full version history of ECMAScript\
    \ at [https://en.wikipedia.org/wiki/ECMAScript](https://en.wikipedia.org/wiki/ECMAScript).\n\
    \nES6 is one of the more well-known examples where new keywords like `let` and\
    \ `const` were introduced (which we will cover in detail in [Section 2](#02_001.html_h2)).\
    \ These are considered modern JavaScript keywords in comparison to the older `var`\
    \ statement used to define variables. This E-Bite is all about modern JavaScript,\
    \ so it is important to understand ECMAScript and to stay up to date on new features\
    \ or standards as they are released.\n\n## 1.2 Runtimes and Engines\n\nThe JavaScript\
    \ code you write can be executed inside a web browser, on your local machine,\
    \ or even on a server. Web browsers have their own runtime environments that let\
    \ your JavaScript interact with the webpage’s Document Object Model (DOM), the\
    \ browser itself (like using local or session storage), or external APIs (where\
    \ you make a call to a server).\n\nFor a browser to use your JavaScript code,\
    \ it must run its own JavaScript engine so it can parse your code and turn it\
    \ into executable commands that your machine understands. For example, Chrome\
    \ has the V8 JavaScript engine, Firefox has SpiderMonkey, and Microsoft Edge has\
    \ Chakra.\n\nRuntimes and engines are an important concept because your JavaScript\
    \ code will need to run in more than one environment, and not all features are\
    \ supported equally in every browser or browser version (see [Section 1.1](#01_001.html_h1.1)).\n\
    \nWe’ll discuss how to run JavaScript with `Node.js` in [Section 1.5](#01_005.html_h1.5).\n\
    \n## 1.3 Preparation, Tooling, and IDEs\n\nYou can use any integrated development\
    \ environment (IDE) you choose to write your JavaScript code. One of the more\
    \ popular choices currently is Visual Studio (VS) Code from Microsoft, but many\
    \ developers are already using Eclipse for their pure ABAP work (outside of Transaction\
    \ SE38, that is!) and you can use it for JavaScript as well. The examples in this\
    \ E-Bite are split into two broad categories:\n\n* Running JavaScript on a webpage\
    \ using an `index.html` file. The JavaScript code either runs inside the `index.html`\
    \ file or is referenced from an external JavaScript file (e.g., `app.js`).\n*\
    \ Running a JavaScript file without an `index.html` file (webpage) using `node.js`.\n\
    \nWe also recommend splitting each section into its own separate folder, as we\
    \ will be making use of multiple `index.html` and `app.js` files in our examples\
    \ and the folders will help organize your code.\n\nFrom this point on (to keep\
    \ continuity), we will be running our JavaScript examples exclusively in VS Code,\
    \ as it includes IntelliSense, debugging, formatting, code navigation, refactorings,\
    \ and many other advanced language features within a clean and user-friendly interface.\
    \ You can find the installation file for VS Code at [http://s-prs.co/v535900](http://s-prs.co/v535900).\
    \ We will be writing and executing our code with some key VS Code extensions,\
    \ which you need to install from [http://s-prs.co/v535901](http://s-prs.co/v535901).\n\
    \n### Note\nFor more information about VS Code, see [http://s-prs.co/v535902](http://s-prs.co/v535902).\n\
    \nTo run our webpage example (using an `index.html` file), we will be making use\
    \ of an extension called Live Server ([http://s-prs.co/v535903](http://s-prs.co/v535903)).\
    \ With this extension, you will be able to preview changes to your code quickly\
    \ and easily, much like activating and executing your ABAP code in Transaction\
    \ SE38. It will rerun your code every time you save, so you can view your changes\
    \ in real time.\n\nWe also recommend an extension called Prettier – Code Formatter\
    \ ([http://s-prs.co/v535904](http://s-prs.co/v535904)), which is just like using\
    \ pretty print in Transaction SE38 to help format your code, and ESLint ([http://s-prs.co/v535905](http://s-prs.co/v535905)),\
    \ which statically checks your code like the ABAP syntax check.\n\n## 1.4 Executing\
    \ JavaScript Code in the Browser\n\nBefore we write any JavaScript code in our\
    \ IDE, we are going to try some code in the Google Chrome browser console. Open\
    \ a browser window and press [F12]. If you are not on the tab already, look for\
    \ the Console tab and click it. The browser console is where we can log information\
    \ from our app, and we are going to use it to execute some JavaScript code. Type\
    \ the following into the console and press [Enter]:\n\n```javascript\nconsole.log(\"\
    Hello World!\")\n```\n\nYou should see “Hello World!” logged to the console, as\
    \ shown in [Figure 1.1](#01_004.html_f1.1).\n\n[![Chrome Console](bilderklein/klein01_001.png)](img-f1.1.html)\n\
    \n**Figure 1.1** Chrome Console\n\nCongratulations! You have just executed a line\
    \ of JavaScript code in the browser. The `console.log()` statement is like the\
    \ WRITE statement in ABAP, and is a great debugging tool when you are writing\
    \ more complex logic and need to check that your variables are correct throughout\
    \ your program. You will find more detail on debugging in [Section 14.2](#14_002.html_h14.2).\n"
