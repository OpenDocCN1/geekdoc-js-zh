  trans: "\n\n```\nlet count = 0;\nwhile (count <= 10) {\n  console.log(count);\n\
    \  count++;\n} \n```\n\n**Listing 3.16** `while` 语句\n\n你应该能在控制台中看到从 `0…10` 的计数结果，这与其他两个循环的输出相同。也可以尝试通过之前的相同更改，在这里进行倒序计数：将\
    \ `count` 设置为 `10`，使用 `count--` 递减迭代，并在 `count >= 0` 时停止循环。\n\n# 4 函数\n\n在 ABAP\
    \ 中，我们对带有导入参数和导出参数的函数或函数模块并不陌生，在 JavaScript 中，你也可以随地使用函数。JavaScript 的语法稍微简单一些，函数只需要一或两行即可声明。它们将成为你在应用程序中封装可重用逻辑的主要工具。\n\
    \n在接下来的章节中，我们将介绍如何定义带有导入参数和返回参数的函数，包括新的箭头函数语法。我们还会全局作用范围内的变量，并介绍一个名为“闭包”（closures）的重要概念。\n\
    \n## 4.1 函数定义\n\nJavaScript 函数使用 `function` 语句定义，后面紧跟函数名、括号 `()`（用于定义参数）以及在 `{}`\
    \ 中执行的逻辑。[Listing 4.1] 显示了一个简单的函数，执行时它会向控制台打印一条消息。\n\n```\n// 定义函数\nfunction mySimpleFunction()\
    \ {\n  console.log(`My simple function was invoked :)`);\n}\nmySimpleFunction();\
    \ // My simple function was invoked :) \n```\n\n**Listing 4.1** 标准函数\n\n输出应该是打印到控制台的\
    \ `\"My simple function was invoked :)\"`。尝试自己运行这个函数，看看在 JavaScript 中封装逻辑是多简单。\n\
    \n从 ES6 开始，你也可以如下所示使用箭头函数语法定义 JavaScript 函数：\n\n```\n(params) => {logic} \n```\n\
    \n它看起来与 [Listing 4.1] 中的标准函数定义非常不同，但它是一种更简洁的定义函数方式。该语法涉及声明一个 `const` 变量（或函数名），并使用\
    \ `=` 将函数赋值给它。然后使用括号 `(params)` 定义函数参数，随后是箭头或 `=>`，最后是包含要执行逻辑的 `{}`，如 [Listing\
    \ 4.2] 所示。\n\n```\nconst mySimpleFunction = () => {\n  console.log(\"My arrow\
    \ function () => {} was invoked\");\n};\nmySimpleFunction(); // My arrow function\
    \ () => {} was invoked \n```\n\n**Listing 4.2** 箭头函数\n\n当调用新创建的 `mySimpleFunction()`\
    \ 函数变量时，该函数会将文本打印到控制台。\n\n### 注意\n\n箭头函数非常棒，你会经常使用它们，但现在不要忽视经典函数。箭头函数适用于更简单的逻辑，而经典函数提供了许多箭头函数不具备的复杂功能，例如对\
    \ `this` 关键字的重定义。这些差异超出了本 E-Bite 的范围，但非常值得你花时间阅读。在本 E-Bite 中，我们将结合使用这两种函数表达式，建议你根据自己的场景选择语法。\n\
    \n## 4.2 参数和 return 语句\n\nJavaScript 函数还可以有导入参数，这些参数可以在函数内部使用。你在括号 `(param1)`\
    \ 中定义参数，并在逻辑内部，你引用参数名 `param1` 并执行诸如将其打印到控制台的操作，如 [Listing 4.3] 所示。\n\n```javascript\n\
    const mySimpleFunction = (param1) => {\n  if (param1) {\n    console.log(param1);\n\
    \  } else {\n    console.log(`param1 is ${typeof param1}`);\n  }\n};\nmySimpleFunction(\"\
    Hello World!\"); \n```\n\n**Listing 4.3** 参数\n\n在此示例中，我们定义了一个带有导入参数 `param1` 的函数，并调用它时传入导入参数\
    \ `\"Hello World!\"`，函数随后将其打印到控制台。注意我们将逻辑结构在 `if` 语句中。这是为了突出 `param1` 的动态类型。如果你在没有变量的情况下调用函数，控制台将打印出\
    \ `param1 is undefined`。\n\n在执行函数内部逻辑的同时，你还可以使用 `return` 语句向调用者返回变量。[Listing 4.4]\
    \ 包含一个计算两个参数和的函数、一个确保参数为 `number` 类型的检查，如果是，则返回和。注意你如何通过逗号声明多个参数。\n\n```javascript\n\
    const mySumFunction = (param1, param2) => {\n  if (typeof param1 === \"number\"\
    \ && typeof param2 === \"number\") {\n    return param1 + param2;\n  } else {\n\
    \    return \"At least one of the parameters is not a number!\";\n  }\n};\nlet\
    \ sum = mySumFunction(100, 150);\nconsole.log(sum); // 250 \n```\n\n**Listing\
    \ 4.4** return 语句\n\n最初，我们用两个数字参数（`100`, `150`）调用此函数，并将得到的和 `250` 赋值给变量 `sum`，将其打印到控制台。`if`\
    \ 语句检查两个导入参数是否确实都是 `number` 类型，如果不是，返回相应的消息。尝试将其中一个参数改为字符串，或者只为 `mySumFunction(100)`\
    \ 输入一个参数，你的变量应该被赋值为字符串 `\"At least one of the parameters is not a number!\"`。\n\
    \n## 4.3 全局作用范围和闭包\n\n我们在第 2.3 节中查看了函数作用范围，该节解释了我们可以访问在全局作用范围内定义的变量（即函数外部），但在函数内部定义的变量被认为是该函数的“私有”，且函数调用者无法访问。\n\
    \n然而，缺点是 JavaScript 中的全局变量可以被全局作用范围内的任何函数访问，这可能会给你的应用程序带来混乱。我们想要的是一种创建一个全局变量但限制其作用范围的方法，使得特定函数可以访问它。这与\
    \ ABAP 类中的 `PRIVATE SECTION` 声明是一个概念。只有该类中的方法可以访问这些私有变量，但这些变量是在类方法之外定义的。\n\n"
- fmt: "\nIn JavaScript, this problem is solved using a concept called closures, which\
    \ is essentially a function that wraps another function in a function scope so\
    \ that when you call the parent function (which is like a wrapper), you create\
    \ a parent function scope. Inside that parent function scope, you have another\
    \ function that can access any variables within the parent wrapper.\n\nLet’s walk\
    \ through a simple example where we create a flexible calculator, as shown in\
    \ [Listing 4.5](#04_003.html_l4.5). First, you define the `flexiSumCalculator`\
    \ parent function as the scope (wrapper), with a parameter `param1` that is assigned\
    \ to the private variable `valueToAdd`. Inside this wrapper, you define a return\
    \ function `calculator` that returns the sum of the `valueToAdd` variable and\
    \ the child function `param2` parameter.\n\nSo, you create a version of the calculator,\
    \ e.g., `flexiSumCalculator5`, which will add 5 to any value you pass in. You\
    \ do this by creating a `const` function variable of the `flexiSumCalculator`\
    \ parent function. This function variable takes and stores `param1` as a global\
    \ private variable for that version of the calculator, like an instance of a class\
    \ in ABAP. You can then invoke that new `flexiSumCalculator5()` function and pass\
    \ any value you want (as `param2`), and it will return `param2` plus 5.\n\n```javascript\n\
    // Parent function \"scope\" wrapper\nconst flexiSumCalculator = (param1) => {\n\
    \  let valueToAdd = param1; // our new \"private\" variable\n  // Function that\
    \ returns the calculation\n  return (caluclator = (param2) => {\n    return (param2\
    \ += valueToAdd);\n  });\n};\nconst flexiSumCalculator5 = flexiSumCalculator(5);\
    \ /* \nInvoking the new version with param2 */\nconsole.log(flexiSumCalculator5(1));\
    \ // 6\nconsole.log(flexiSumCalculator5(2)); // 7\nconsole.log(flexiSumCalculator5(3));\
    \ // 8 \n```\n\n**Listing 4.5** JavaScript Closures\n\nSo, when you create a version\
    \ or instance of the calculator, you use `param1` to determine what the private\
    \ variable will be. When you call this new function variable, you pass in a parameter,\
    \ which is `param2`. The function variable can now be reused safely so when you\
    \ run the above code, you get `6`, `7`, and `8` logged to the console using the\
    \ same function variable `flexiSumCalculator5()`.\n\n# 5 Data Structures\n\nIn\
    \ ABAP, we have the internal table and work areas that we use to read and manipulate\
    \ data from our database tables before committing those changes to the database.\
    \ In JavaScript, we have two key data structures that take the place of the ABAP\
    \ internal table and work area: arrays and objects. There are many other data\
    \ structures in JavaScript, but arrays, objects, and a combination of the two\
    \ are the best starting point. These two data types are mutable (i.e., they can\
    \ be changed), and so they have a set of standard JavaScript methods you can use\
    \ to read and manipulate them. We’ll discuss both in the following sections.\n\
    \n## 5.1 Arrays and Array Methods\n\nJavaScript arrays are like internal tables\
    \ in ABAP and are designed to let you hold a table or list of values accessible\
    \ through a single variable. The arrays themselves are defined by `[...]`, which\
    \ contain a comma-separated list of items. In [Listing 5.1](#05_001.html_l5.1),\
    \ we declare two arrays as variables, `petArray` and `numberArray`, respectively.\n\
    \n```javascript\nlet petArray = [\"Dog\", \"Cat\", \"Bird\", \"Fish\", \"Reptile\"\
    ];\nlet numberArray = [1, 32, 63, 4, 75, 76, 347, 84];\nconsole.log(petArray);\
    \ // [ 'Dog', 'Cat', 'Bird', 'Fish', 'Reptile' ]\nconsole.log(numberArray); //\
    \ [ 1, 32, 63, 4, 75, 76, 347, 84 ] \n```\n\n**Listing 5.1** Simple Array Declaration\n\
    \nAs in ABAP, each item in a JavaScript array has an assigned index (starting\
    \ at 0) that you can use to access that value (i.e., read the array) using square\
    \ bracket notation `[0]`. In [Listing 5.2](#05_001.html_l5.2), we log a certain\
    \ array value at a particular index (`[0]` and `[1]`, respectively) to the console\
    \ from each of our arrays.\n\n```javascript\nlet petArray = [\"Dog\", \"Cat\"\
    , \"Bird\", \"Fish\", \"Reptile\"];\nlet numberArray = [1, 32, 63, 4, 75, 76,\
    \ 347, 84];\nconsole.log(petArray[0]); // Dog\nconsole.log(numberArray[1]); //\
    \ 32 \n```\n\n**Listing 5.2** Find Values of an Array by Index\n\nThere are also\
    \ a set of standard JavaScript methods that allow you to access and manipulate\
    \ your arrays. Some of these methods accept parameters, while others also let\
    \ you apply function logic and pass data like a value or a Boolean. There are\
    \ many methods to choose from, so we will focus on a select few to give you an\
    \ idea of how they work.\n\nLet’s start off with sorting our array. In [Listing\
    \ 5.3](#05_001.html_l5.3), we sort our `petArray` string values in alphabetical\
    \ order using the `sort()` method, then call the `reverse()` method to reverse\
    \ the order.\n\n```javascript\nlet petArray = [\"Dog\", \"Cat\", \"Bird\", \"\
    Fish\", \"Reptile\"];\npetArray.sort();\nconsole.log(petArray); // ['Bird', 'Cat',\
    \ 'Dog', 'Fish', 'Reptile']\npetArray.reverse();\nconsole.log(petArray); // ['Reptile',\
    \ 'Fish', 'Dog', 'Cat', 'Bird']\n```\n\n**Listing 5.3** Arrays: Alphabetical Sort\n\
    \nSorting numerically, on the other hand, is more complex and uses the `sort()`\
    \ method’s optional parameters, as we see in [Listing 5.4](#05_001.html_l5.4).\n\
    \n```javascript\nlet numberArray = [1, 32, 63, 4, 75, 76, 347, 84];\nnumberArray.sort((a,\
    \ b) => a - b); // Sort ascending\nconsole.log(numberArray); // [1, 4, 32, 63,\
    \ 75, 76, 84, 347]\nnumberArray.sort((a, b) => b - a); // Sort descending\nconsole.log(numberArray);\
    \ // [347, 84, 76, 75, 63, 32, 4, 1]\n```\n\n**Listing 5.4** Arrays: Numeric Sort\n"
