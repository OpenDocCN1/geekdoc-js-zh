  trans: "\n\n为了演示这一点，我们使用 Listing 10.5 中的示例，并添加了静态属性 `static_attribute` 和静态方法 `static_method()`，在实例化对象之前调用了它们，如\
    \ Listing 10.7 所示。\n\n```javascript\nclass car {\n  constructor(make) {\n    (this.make\
    \ = make), (this.current_speed = 0);\n  }\n  start_engine() {\n    console.log(\"\
    Car started!\");\n    this.log_speed();\n  }\n  stop_engine() {\n    console.log(\"\
    Engine off.\");\n  }\n  accelerate(kmh) {\n    typeof kmh === \"number\"\n   \
    \   ? (this.current_speed += kmh)\n      : console.error(\"parameter must be a\
    \ number\");\n    this.log_speed();\n  }\n  brake() {\n    this.current_speed\
    \ = 0;\n    this.log_speed();\n  }\n  log_speed() {\n    console.log(`Speedometer:\
    \ ${this.current_speed}`);\n  }\n  static static_method() {\n    return \"Hello\
    \ from a static class method\";\n  }\n  static static_attribute = \"A static attribute\"\
    ;\n}\n\nconsole.log(car.static_method());\nconsole.log(car.static_attribute);\n\
    let newCar = new car(\"Mercedes\");\nconsole.log(`${newCar.make}`); // Mercedes\n\
    newCar.start_engine();\nnewCar.accelerate(5);\nnewCar.accelerate(10);\nnewCar.accelerate(10);\n\
    newCar.brake();\nnewCar.stop_engine(); \n```\n\n**Listing 10.7** 静态属性与方法\n\nListing\
    \ 10.7 的输出将如 Listing 10.8 所示。\n\n```\nHello from a static class method\nA static\
    \ attribute\nMercedes\nCar started!\nSpeedometer: 0\nSpeedometer: 5\nSpeedometer:\
    \ 15\nSpeedometer: 25\nSpeedometer: 0\nEngine off. \n```\n\n**Listing 10.8** 来自\
    \ Listing 10.7 的输出\n\n注意，我们可以在实例化类之前访问静态属性和静态方法。如果你使用 `newCar` 对象调用静态方法或访问静态属性，将得到一个\
    \ `TypeError`。\n\n## 10.4 继承\n\nJavaScript 类中的继承工作方式与 ABAP 类类似，并遵循相同的通用面向对象原则，即子类继承（并扩展）父类的属性和方法。基本语法涉及在子类定义中添加\
    \ `extends` 关键字，随后跟上你所继承的父类名称。从那里，你可以在子类的构造函数中使用 `super` 方法来引入父类的属性和方法。\n\n我们继续在\
    \ Listing 10.7 的示例，创建一个扩展自 `car` 父类的子类，然后使用它为汽车型号创建一个更具体的特定类。如 Listing 10.9 所示，我们创建了一个名为\
    \ `carModel` 的类，使用 `extends` 关键字扩展了 `car` 父类。在 `carModel` 类的 `constructor` 中，我们使用\
    \ `super` 关键字引用父类的属性和方法，确保传入汽车的 `(make)`，因为 `make` 属性是在父类中赋值的，子类随后继承了它。之后，子类通过在它自己的构造函数中添加自己的属性\
    \ `this.model` 扩展了父类的属性。\n\n```javascript\nclass carModel extends car {\n  constructor(make,\
    \ model) {\n    super(make);\n    this.model = model;\n  }\n}\n\nlet newCarModel\
    \ = new carModel(\"Mercedes\", \"S Class\");\nconsole.log(`${newCarModel.make}\
    \ ${newCarModel.model}`); // mercedes S Class\nnewCarModel.start_engine();\nnewCarModel.accelerate(5);\n\
    newCarModel.accelerate(10);\nnewCarModel.accelerate(10);\nnewCarModel.brake();\n\
    newCarModel.stop_engine(); \n```\n\n**Listing 10.9** 类继承\n\n来自 Listing 10.9 的控制台输出（包括父类和子类）如\
    \ Listing 10.10 所示。\n\n```\nHello from a static class method\nA static attribute\n\
    Mercedes\nCar started!\nSpeedometer: 0\nSpeedometer: 5\nSpeedometer: 15\nSpeedometer:\
    \ 25\nSpeedometer: 0\nEngine off.\nMercedes S Class\nCar started!\nSpeedometer:\
    \ 0\nSpeedometer: 5\nSpeedometer: 15\nSpeedometer: 25\nSpeedometer: 0\nEngine\
    \ off. \n```\n\n**Listing 10.10** 来自 Listing 10.9 的输出\n\n注意，使用子类 `carModel` 实例化的\
    \ `newCarModel` 对象能够调用父类 `car` 的方法，同时添加（或扩展）类属性以包含特定的汽车型号。\n\n# 11 AJAX\n\n异步\
    \ JavaScript 和 XML (AJAX) 允许你在网页内部使用如 `GET` 或 `POST` 等 HTTP 方法与外部 Web 服务器通信，并根据响应更新\
    \ DOM。AJAX 围绕浏览器内置的 `XMLHttpRequest` 对象和更现代的 Fetch API 展开，允许你请求网页之外的数据。你可以使用 AJAX\
    \ 调用第 6 节中的 JSON 数据，你将收到相同的 JSON 格式响应。\n\n顾如其名，AJAX 的优点之一是它是异步工作的。这意味着当你使用它从服务器请求数据且不知道数据返回需要多长时间时，它不会阻塞你的网页来等待所请求的数据。这意味着你的网页可以在后台更新的同时保持运行，提供更好的用户体验。\n\
    \n我们将在接下来的章节中探索 AJAX 的两个关键组件——`XMLHttpRequest` 对象和 Fetch API。\n\n## 11.1 XMLHttpRequest\
    \ 对象\n\n取决于服务器配置，`XMLHttpRequest` 对象可以用于从外部服务器上的资源请求数据。这些调用通常限制在同一服务器地址，这是一个名为跨源资源共享\
    \ (CORS)的安全概念。为了简单起见，我们假设本地服务器不允许 CORS，因此我们将使用 `XMLHttpRequest` 对象从与 `index.html`\
    \ 和 `app.js` 文件存储同一文件夹下的本地文件请求数据，如 Listing 11.1 和 Listing 11.2 所示。\n\n```html\n\
    <html>\n<head>\n    <script src=\"app.js\"></script>\n</head>\n<body>\n    <p\
    \ id=\"text\">Some text</p>\n    <button onclick=\"sendRequest()\">Get the data!</button>\n\
    </body>\n</html> \n```\n\n**Listing 11.1** index.html\n\n我们运行 Listing 11.1 中的网页，并在页面上看到一些文本，下方带有一个按钮。当我们点击按钮时，它会触发\
    \ HTML 的 `onclick` 事件，并执行 Listing 11.2 中的 `sendRequest` 函数。\n\n```javascript\n\
    const sendRequest = () => {\n  let xhttp = new XMLHttpRequest();\n  xhttp.open(\"\
    GET\", \"test_data.json\", true);\n  xhttp.send();\n  xhttp.onreadystatechange\
    \ = function () {\n    if (this.readyState == 4 && this.status == 200) {\n   \
    \   document.getElementById(\"text\").innerHTML = this.responseText;\n    }\n\
    \  };\n}; \n```\n\n**Listing 11.2** app.js\n\n"
- fmt: "\nInside this function, we create a new `XMLHttpRequest` object called `xhttp`\
    \ and use that object to structure our request. First, we call the `.open` method,\
    \ pass in the type of request `GET` with the path to our local file `test_data.json`,\
    \ and set the third parameter to `true`, which tells the call to run asynchronously.\
    \ With the request set up, we call the `.send()` method to send the request. We\
    \ then specify the `.onreadystatechange()` method, which listens for the response\
    \ from the request. When it receives the response, it executes the function after\
    \ the `=` sign. In that function, we check if the `readyState` is `4` and the\
    \ `http` status is `200` (meaning the call was a success), and we change the `<p>`\
    \ tag `innerHTML` (with an `id` of `text`) to the response text.\n\nIn [Listing\
    \ 11.3](#11_001.html_l11.3), we have some `car` JSON data, which we now see on\
    \ the webpage in place of `Some text`.\n\n```json\n[\n  {\n    \"make\": \"Mercedes\"\
    ,\n    \"model\": \"A Class\",\n    \"Color\": \"White\",\n    \"picture\": \"\
    http://placehold.it/32x32\",\n    \"topSpeed\": 300\n  }\n] \n```\n**Listing 11.3**\
    \ test_data.json\n\n## 11.2 Modern Syntax: Fetch API\n\nThe good news is there\
    \ is a much simpler way to request data in most modern browsers, the Fetch API.\
    \ The Fetch API is wonderful because when we use it to call an API endpoint, it\
    \ returns a JavaScript promise, which is much easier to work with. We can align\
    \ our logic to the response depending on whether the promise resolves (success)\
    \ or rejects (fails).\n\nThe basic syntax for a `fetch` request is illustrated\
    \ in [Listing 11.4](#11_002.html_l11.4).\n\n```javascript\nfetch(\"https://urlendpoint.com\"\
    )\n  .then(\"Success\")\n  .catch(\"Failure\"); \n```\n\n**Listing 11.4** Fetch\
    \ API Syntax\n\nIn [Listing 11.5](#11_002.html_l11.5), we use the Fetch API to\
    \ call the same data from our local file `test_data.json`. We replace the `sendRequest`\
    \ function in [Listing 11.2](#11_001.html_l11.2) with the function in [Listing\
    \ 11.5](#11_002.html_l11.5) and replace the button `onclick` event function in\
    \ [Listing 11.1](#11_001.html_l11.1) to call the new function in [Listing 11.5](#11_002.html_l11.5).\n\
    \n```javascript\nconst sendFetchRequest = () => {\n  fetch(\"test_data.json\"\
    )\n    .then((response) => response.json())\n    .then((body) => {\n      document.getElementById(\"\
    text\").innerHTML = body[0][\"make\"];\n    })\n    .catch((error) => {\n    \
    \  console.log(error);\n    });\n}; \n```\n\n**Listing 11.5** Fetch Request\n\n\
    We now see the text `Mercedes` replace `Some text` on the page. Inside the `sendFetchRequest`\
    \ function, we call our `fetch` request and, in the brackets, we pass in the path\
    \ to the local file `test_data.json` we want it to read. That `fetch` request\
    \ returns a JavaScript promise and it resolves (is successful), hitting our first\
    \ `.then()` statement. Inside that `.then()` statement, we create a function where\
    \ we import our `(response)` as a parameter from the request and convert it to\
    \ JSON format. When that formatting is complete, we hit our second `.then()` statement,\
    \ where we take our JSON-formatted response and pick out the object at index `[0]`.\
    \ The JSON data at index `[0]` has a `name:value` pair `\"make\": \"Mercedes\"\
    `, and we access the value from it with the `[make]` JSON attribute and change\
    \ our `<p>` tag in [Listing 11.1](#11_001.html_l11.1) to that value `Mercedes`.\
    \ We also have a `.catch()` statement to catch any promise rejections or errors\
    \ that might come up during the request, logging those errors to the console.\n\
    \n# 12 jQuery: Your First JavaScript Library\n\nJavaScript has grown in popularity\
    \ due in no small part to its vast array of libraries and frameworks, including\
    \ SAPUI5, that you can use to do almost anything. JavaScript libraries help us\
    \ “do more with less” and abstract much of the complex logic you need to write\
    \ in standard JavaScript with something more user friendly. One of the most popular\
    \ libraries in the world is called jQuery ([https://jquery.com/](https://jquery.com/)),\
    \ created by John Resig, and it has become a standard in JavaScript.\n\nThe exciting\
    \ thing about a library like jQuery is it abstracts all the logic we used in the\
    \ previous sections (see [Section 7](#07_001.html_h7) and [Section 11](#11_001.html_h11))\
    \ and makes it even easier to traverse and manipulate the DOM, handle HTML events,\
    \ and work with AJAX. This makes it the perfect choice to start with when learning\
    \ to work with JavaScript libraries.\n\nIn this section, we’ll import the jQuery\
    \ library and walk through key jQuery logic, including using selectors, registering\
    \ events, changing HTML and DOM elements and CSS, and making AJAX queries.\n\n\
    ## 12.1 Importing a jQuery Library\n\nThe first thing we do is set up our environment\
    \ and import the jQuery library so we can use it in our `app.js` file. External\
    \ JavaScript libraries are imported in the same way as our `app.js` files from\
    \ previous examples as they are just external file(s) containing JavaScript code.\
    \ We follow the same logic shown previously in [Section 1.4](#01_004.html_h1.4),\
    \ [Listing 1.3](#01_004.html_l1.3), where we declared a `<script>` tag in our\
    \ `index.html` file, which contained a reference to a `.js` file that contained\
    \ the code.\n\nThere are two ways we could import or install jQuery. Either download\
    \ the jQuery JavaScript code from [https://jquery.com/download/](https://jquery.com/download/)\
    \ and add it to the project folder, or if we are using `node`, we can use `npm`\
    \ (node package manager) to install it as a dependency. For simplicity, we add\
    \ the file to our project folder just like with our `app.js` file, seeing as the\
    \ jQuery code is just a JavaScript file anyway. We create a `jquery-3.6.0.min.js`\
    \ file, matching the file name to the version you downloaded. At the time of writing,\
    \ we downloaded this version: [https://code.jquery.com/jquery-3.6.0.min.js](https://code.jquery.com/jquery-3.6.0.min.js).\
    \ We then copy all the code from the downloaded jQuery file into the `jquery-3.6.0.min.js`\
    \ file, create our `index.html` file, and include a reference to the jQuery and\
    \ `app.js` files respectively within `<script>` tags, as shown in [Listing 12.1](#12_001.html_l12.1).\n"
