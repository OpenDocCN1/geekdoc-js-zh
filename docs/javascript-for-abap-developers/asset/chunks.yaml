  trans: "\n\n在 JavaScript 中，这个问题通过一种称为“闭包”（closures）的概念来解决，它本质上是一个在函数作用域内封装了另一个函数的函数，以便当你调用父函数（类似于一个包装器）时，你创建了一个父函数作用域。在该父函数作用域内部，你有另一个函数，它可以访问父函数包装器内的任何变量。\n\
    \n让我们来看一个简单的示例，创建一个灵活的计算器，如列表 4.5 所示。首先，你定义 `flexiSumCalculator` 父函数作为作用域（包装器），并带有一个参数\
    \ `param1` 赋值给私有变量 `valueToAdd`。在包装器内部，你定义了一个返回函数 `calculator`，它返回 `valueToAdd`\
    \ 变量与子函数参数 `param2` 之和。\n\n因此，你创建了计算器的版本，例如 `flexiSumCalculator5`，它将对你传递的任何值加\
    \ 5。你通过创建一个 `flexiSumCalculator` 父函数的 `const` 函数变量来实现这一点。该函数变量将 `param1` 接收并存储为该版本计算器的全局私有变量，类似于\
    \ ABAP 中的类实例。然后你可以调用该新的 `flexiSumCalculator5()` 函数并传递你想要的任何值（作为 `param2`），它将返回\
    \ `param2` 加 5。\n\n```javascript\n// 父函数\"scope\" 包装器\nconst flexiSumCalculator\
    \ = (param1) => {\n  let valueToAdd = param1; // 我们新的\"私有\"变量\n  // 返回计算的函数\n\
    \  return (caluclator = (param2) => {\n    return (param2 += valueToAdd);\n  });\n\
    };\nconst flexiSumCalculator5 = flexiSumCalculator(5); /* \n使用 param2 调用新版本 */\n\
    console.log(flexiSumCalculator5(1)); // 6\nconsole.log(flexiSumCalculator5(2));\
    \ // 7\nconsole.log(flexiSumCalculator5(3)); // 8 \n```\n\n**列表 4.5** JavaScript\
    \ 闭包\n\n所以，当你创建一个计算器的版本或实例时，你使用 `param1` 来决定私有变量是什么。当你调用这个新的函数变量时，你传递一个参数，即 `param2`。该函数变量现在可以安全地重用，因此当你运行上述代码时，你会使用相同的函数变量\
    \ `flexiSumCalculator5()` 在控制台中打印出 `6`、`7` 和 `8`。\n\n# 5 数据结构\n\n在 ABAP 中，我们使用内部表（internal\
    \ table）和工作区（work areas）在将更改提交到数据库之前读取并操作数据库表中的数据。在 JavaScript 中，我们有两个关键的数据结构取代了\
    \ ABAP 内部和工作区：数组（arrays）和对象（objects）。JavaScript 中还有许多其他数据结构，但数组、对象以及它们的结合是最好的起点。这两个数据类型是可变的（即它们可以被更改），因此它们有一组标准的\
    \ JavaScript 方法用于读取和操作它们。我们将在后续章节中讨论这两者。\n\n## 5.1 数组和数组方法\n\nJavaScript 数组类似于\
    \ ABAP 中的内部表，设计用于让你通过单个变量持有可访问的值表格或列表。数组本身由 `[...]` 定义，其中包含一个用逗号分隔的项列表。在列表 5.1\
    \ 中，我们分别声明两个数组作为变量，`petArray` 和 `numberArray`。\n\n```javascript\nlet petArray\
    \ = [\"Dog\", \"Cat\", \"Bird\", \"Fish\", \"Reptile\"];\nlet numberArray = [1,\
    \ 32, 63, 4, 75, 76, 347, 84];\nconsole.log(petArray); // [ 'Dog', 'Cat', 'Bird',\
    \ 'Fish', 'Reptile' ]\nconsole.log(numberArray); // [ 1, 32, 63, 4, 75, 76, 347,\
    \ 84 ] \n```\n\n**列表 5.1** 简单的数组声明\n\n与 ABAP 一样，JavaScript 数组中的每个项都有分配的索引（从 0\
    \ 开始），你可以使用方括号表示法 `[0]` 来访问该值（即读取数组）。在列表 5.2 中，我们从每个数组中将特定索引（分别为 `[0]` 和 `[1]`）的某个数组值记录到控制台。\n\
    \n```javascript\nlet petArray = [\"Dog\", \"Cat\", \"Bird\", \"Fish\", \"Reptile\"\
    ];\nlet numberArray = [1, 32, 63, 4, 75, 76, 347, 84];\nconsole.log(petArray[0]);\
    \ // Dog\nconsole.log(numberArray[1]); // 32 \n```\n\n**列表 5.2** 通过索引查找数组值\n\n\
    还有一组标准的 JavaScript 方法允许你访问和操作数组。其中一些方法接受参数，而另一些方法还允许你应用函数逻辑并传递诸如值或布尔值的数据。有许多方法可选，因此我们将重点关注少数几个，让你对它们的工作原理有一个直观的。\n\
    \n让我们从对数组排序开始。在列表 5.3 中，我们使用 `sort()` 方法对 `petArray` 字符串值进行字母顺序排序，然后调用 `reverse()`\
    \ 方法反转顺序。\n\n```javascript\nlet petArray = [\"Dog\", \"Cat\", \"Bird\", \"Fish\"\
    , \"Reptile\"];\npetArray.sort();\nconsole.log(petArray); // ['Bird', 'Cat', 'Dog',\
    \ 'Fish', 'Reptile']\npetArray.reverse();\nconsole.log(petArray); // ['Reptile',\
    \ 'Fish', 'Dog', 'Cat', 'Bird']\n```\n\n**列表 5.3** 数组：字母排序\n\n另一方面，数字排序更为复杂，并使用了\
    \ `sort()` 方法的可选参数，我们在列表 5.4 中所示。\n\n```javascript\nlet numberArray = [1, 32,\
    \ 63, 4, 75, 76, 347, 84];\nnumberArray.sort((a, b) => a - b); // 升序\nconsole.log(numberArray);\
    \ // [1, 4, 32, 63, 75, 76, 84, 347]\nnumberArray.sort((a, b) => b - a); // 降序\n\
    console.log(numberArray); // [347, 84, 76, 75, 63, 32, 4, 1]\n```\n\n**列表 5.4**\
    \ 数组：数字排序\n\n"
- fmt: "\nAfter sorting your array, you might not remember the exact index of a particular\
    \ value. JavaScript has a handy `indexOf()` method to find the index of a particular\
    \ value in an array, as shown in [Listing 5.5](#05_001.html_l5.5) for the index\
    \ of `Fish`.\n\n```\nlet petArray = [\"Bird\", \"Cat\", \"Dog\", \"Fish\", \"\
    Reptile\"];\nlet index = petArray.indexOf(\"Fish\");\nconsole.log(index); // 3\
    \ \n```\n\n**Listing 5.5**     indexOf()\n\nAnother useful method in JavaScript\
    \ is the `some()` method. This allows you to scan an array to see if a certain\
    \ value exists. In [Listing 5.6](#05_001.html_l5.6), we scan our `petArray` to\
    \ see if the value `Reptile` exists. To do that, we create a new variable `reptileExists`\
    \ and assign it to the return value from our `petArray.some()` method call. In\
    \ that call, we pass in a parameter `(element)`, which each value of the array\
    \ is iterated through and passed to, like the `sort()` method discussed previously.\
    \ We add a simple line of logic, `element === \"Reptile\",`, inside the function.\
    \ The function then iterates through all the array values until either all values\
    \ don’t match (return `false`) or an item does match (return `true`), which we\
    \ then log to the console.\n\n```\nlet petArray = [\"Bird\", \"Cat\", \"Dog\"\
    , \"Fish\", \"Reptile\"];\nlet reptileExists = petArray.some((element) => element\
    \ === \"Reptile\");\nconsole.log(reptileExists); // true \n```\n\n**Listing 5.6**\
    \     Array Method: some()\n\nWhen changing data in our array, the first key point\
    \ we need to understand is the array’s length, or how many items are we dealing\
    \ with. In [Listing 5.7](#05_001.html_l5.7), we call `petArray.length`, which\
    \ will return the length of the array (`5`, in our example).\n\n```\nlet petArray\
    \ = [\"Dog\", \"Cat\", \"Bird\", \"Fish\", \"Reptile\"];\nconsole.log(petArray.length);\
    \ // 5 \n```\n\n**Listing 5.7**     array.length Method\n\nNow that we know how\
    \ many items are in our array, let’s append an item to it using the `push()` method.\
    \ In [Listing 5.8](#05_001.html_l5.8), we call `petArray.push(\"Lion\")` and the\
    \ string `Lion` will be added as the sixth item to our array at index `5`. We\
    \ use `console.table()` to log our array to the console in a tabular format, as\
    \ well as log the array length before and after adding `Lion`.\n\n```\nlet petArray\
    \ = [\"Dog\", \"Cat\", \"Bird\", \"Fish\", \"Reptile\"];\nconsole.log(petArray.length);\
    \ // 5\npetArray.push(\"Lion\");\nconsole.table(petArray);\nconsole.log(petArray.length);\
    \ // 6 \n```\n\n**Listing 5.8**     array.push Method\n\nLet’s try to insert an\
    \ item at the beginning of our array using the flexible `splice()` method. The\
    \ `splice()` method syntax includes a few parameters and looks like [Listing 5.9](#05_001.html_l5.9).\n\
    \n```\nmyArray.splice(\n\"index where item is to be added\", \n\"how many items\
    \ should be removed, can be 0 or none)\", \n\"the item(s) to be added\"\n). \n\
    ```\n\n**Listing 5.9**     splice() Method Syntax\n\nIn [Listing 5.10](#05_001.html_l5.10),\
    \ we apply this method to our `petArray` and add a `Lion` to the beginning of\
    \ the array at index `0`.\n\n```\nlet petArray = [\"Dog\", \"Cat\", \"Bird\",\
    \ \"Fish\", \"Reptile\"];\npetArray.splice(0, 0, \"Lion\");\nconsole.table(petArray);\
    \ /* \n[\"Lion\", \"Dog\", \"Cat\", \"Bird\", \"Fish\",// \"Reptile\"]; */ \n\
    ```\n\n**Listing 5.10**     splice() Method: Add Item to an Array\n\nThe flexibility\
    \ of the `splice()` method means you can either replace one item with another\
    \ or remove it entirely. In [Listing 5.11](#05_001.html_l5.11), we remove `Lion`\
    \ from our `petArray` because it is not really a suitable pet. After that, we\
    \ remove `Dog` and replace it with two new items, `Small Dog` and `Big Dog`.\n\
    \n```\nlet petArray = [\"Lion\", \"Dog\", \"Cat\", \"Bird\", \"Fish\", \"Reptile\"\
    ];\npetArray.splice(0, 1);\nconsole.table(petArray); // [\"Dog\", \"Cat\", \"\
    Bird\", \"Fish\", \"Reptile\"];\npetArray.splice(0, 1, \"Small Dog\", \"Big Dog\"\
    );\nconsole.table(petArray); /* \n[\"Small Dog\", \"Big Dog\", \"Cat\", \"Bird\"\
    ,// \"Fish\",\"Reptile\"]; \n```\n\n**Listing 5.11**     splice() Method: Delete\
    \ and Replace Items\n\n### Important Note\n\nNotice that when we call `splice()`\
    \ the second time, we pass in the same index 0 as the first. This is because when\
    \ we execute the first `splice()` and remove `Lion` at index `0`, the whole array\
    \ updates and shifts `Dog` to where `Lion` was. This data mutation is something\
    \ you should approach with caution. Data mutation is a critical concept in JavaScript\
    \ due to its dynamic nature.\n\n## 5.2 Objects and Methods\n\nJavaScript objects\
    \ are like structures in ABAP in that they are used to store more detailed information.\
    \ They are made up of `name:value` pairs separated by a comma and held within\
    \ `{}`. Think of a car; normally, you do not just have one property such as the\
    \ `make`, but rather the `make`, `model`, `topSpeed`, and so on as follows:\n\n\
    ```\nlet car = { make: \"Mercedes\", model: \"S Class\", topSpeed: 320 };\n```\n\
    \nJavaScript arrays are like ABAP internal tables, and JavaScript objects are\
    \ like work areas/structures that make up the records of an internal table. In\
    \ [Listing 5.12](#05_001.html_l5.12), we take our car example further and create\
    \ an array of different car objects and log that array of objects to the console.\
    \ In [Listing 5.12](#05_001.html_l5.12), we see a table output with Mercedes,\
    \ BMW, and Audi cars with some of their specs. Then, we log the `car` object at\
    \ index `1` using `carArray[1].make`.\n\n```\nlet carArray = [\n  {\n    make:\
    \ \"Mercedes\",\n    model: \"A Class AMG\",\n    colour: \"Black\",\n    topSpeed:\
    \ 168,\n  },\n  {\n    make: \"BMW\",\n    model: \"M Series\",\n    colour: \"\
    White\",\n    topSpeed: 150,\n  },\n  {\n    make: \"Audi\",\n    model: \"S4\"\
    ,\n    colour: \"Blue\",\n    topSpeed: 173,\n  },\n];\nconsole.table(carArray);\n\
    console.log(carArray[1].make); // BMW\n```\n\n**Listing 5.12**     Array of JavaScript\
    \ Objects\n\n# 6 JSON\n"
