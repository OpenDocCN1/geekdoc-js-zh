  trans: "\n我们在上一节的示例使用了 HTML 的 `onclick` 事件（当用户使用鼠标点击时）来触发 JavaScript 代码，该代码更改 `<p></p>`\
    \ 标签中的文本。有许多不同类型的 HTML 事件，从鼠标点击到按键，再到仅将鼠标悬停在某个 HTML 元素上等。你可以在元素的属性中指定是否要触发这些事件，并指定在事件触发时要执行的\
    \ JavaScript 代码。\n\n我们将在接下来的章节中讨论事件处理，以及最常用的事件。\n\n## 8.1 注册事件\n\n在第 7 节的示例中，我们在`<button></button>`\
    \ 标签中指定了 `onclick` 事件，如下：\n\n```\n<button type=\"button\" onclick=\"changeSomeText()\"\
    >Try it</button> \n```\n\n`onclick` 事件被指定为一个属性，JavaScript 函数被指定在等号后面并带有 `()`，这意味着它需要在该事件发生时执行。我们可以为示例添加另一个事件\
    \ `onmouseover()`，并在鼠标光标悬停在 `<h1>` 元素上时更改其文本。让我们调整 `<h1>` 标签以包含 `id` 属性和 `onmouseover`\
    \ 事件属性：\n\n```\n<h1 id=\"header-text\" onmouseover=\"onMouseHoverH1()\">A normal\
    \ everyday webpage</h1> \n```\n\n然后我们添加了一个新的 JavaScript 函数 `onMouseHoverH1()`，其函数代码如列表\
    \ 8.1 所示，用于在我们悬停在文本上时修改文本和 CSS。结果是文本“You hovered over me didn’t you!”以红色显示，如图图\
    \ 8.1 所示。\n\n```\nfunction onMouseHoverH1() {\n  let headerText = document.querySelector(\"\
    #header-text\");\n  headerText.style.color = \"red\";\n  headerText.innerHTML\
    \ = \"You hovered over me didn't you!\";\n} \n```\n\n**列表 8.1** onmouseover 事件函数\n\
    \n![onmouseover Event](img/img-f8.1.html)\n\n**图 8.1** onmouseover 事件\n\n除了在 HTML\
    \ DOM 元素属性本身注册事件外，你也可以直接在 JavaScript 代码中注册事件，而不需要在 HTML 中指定 `onclick` 属性。在列表 8.2\
    \ 中，我们使用 `window.onload` 事件在按钮上注册了一个 `\"click\"` 事件。\n\n```\nwindow.onload = (event)\
    \ => {\n  document.getElementById(\"btn1\").addEventListener(\"click\", changeSomeText);\n\
    }; \n```\n\n**列表 8.2** 使用 JavaScript 注册 HTML 事件\n\n在此示例中，`window.onload` 事件仅在页面完全加载完成后后才会触发，这是必要的，因为我们只有在\
    \ HTML 属性加载后才能向其注册事件。一旦页面加载，我们使用 `.addEventListener` 方法注册 `\"click\"` 事件（类似于 `onclick`\
    \ HTML 事件属性），随后是函数 `changeSomeText`，该函数将在事件触发时被调用。\n\n## 8.2 处理互补事件\n\n在我们的列表\
    \ 8.1 示例中，注意当您悬停在标题文本上时，会发生 DOM 操作，但即使当鼠标不再悬停在标题文本上时，文本仍保持原样。理解这一点很重要：当你更改 DOM\
    \ 中的内容时，通常需要一个抵消事件来平衡状态，例如将 `onmouseout` 配合 `onmouseover`，以创建鼠标在元素上移动和离开的完整效果。\n\
    \n为了实现这一点，我们再次调整了 HTML 代码，并添加了 `onmouseout` 属性以及一个 JavaScript 函数，将文本恢复到之前的状态。如下所示向\
    \ `<h1>` 标签添加了 `onmouseout` 事件属性：\n\n```\n<h1 id=\"header-text\" onmouseover=\"\
    onMouseHoverH1()\" onmouseout=\"onMouseOffH1()\">A normal everyday webpage</h1>\
    \ \n```\n\n我们添加了与 `onmouseover` 类似的 JavaScript 函数，如列表 8.3 所示，包括将标题文本改回的代码。结果应该是：当你悬停在上面时文本会变化，当鼠标再次移开时文本会变回来。\n\
    \n```\nfunction onMouseOffH1() {\n  let headerText = document.querySelector(\"\
    #header-text\");\n  headerText.style.color = \"\";\n  headerText.innerHTML = \"\
    A normal everyday webpage\";\n} \n```\n\n**列表 8.3** onmouseout 事件函数\n\n## 8.3\
    \ 常见 HTML 事件\n\n鼠标事件是你经常使用的用于使网页动态化的常见 HTML 事件，但还有两个你将会经常遇到且值得注意的事件，我们将在接下来的章节中讨论。\n\
    \n### onload\n\n`onload` HTML 事件在页面加载完成后触发，这是一个常见的需求，用于执行仅在所有网页元素加载后才运行的 JavaScript\
    \ 代码。使用我们上一节的示例，我们可以如下所示为 `<body>` 标签添加 `onload` 事件：\n\n```\n<body onload=\"onPageLoad()\"\
    ></body> \n```\n\n然后我们从列表 8.4 中添加了一个新函数，在页面完全加载后触发警报。\n\n```javascript\nfunction\
    \ onPageLoad() {\n  alert(\"Congratulations! The page has finished loading.\"\
    )\n} \n```\n\n**列表 8.4** onload 事件函数\n\n### onchange\n\n`onchange` HTML 事件在 HTML\
    \ 元素发生变化时都会触发；例如，当你向表单输入框输入内容时，你输入的每个新字符都会触发 `onchange` 事件。为了演示，我们在 HTML 页面中添加了一个表单输入框，并如下对其添加了\
    \ `onchange` 事件：\n\n```\nName:<input id=\"name-input\" type=\"text\" onchange=\"\
    onInputChange()\"> \n```\n\n我们添加了列表 8.5 中的函数，每当你向输入框中输入新内容并点击外部或按下 [Enter] 键时，它都会向你发出警告。\n\
    \n```javascript\nfunction onInputChange() {\n  alert(\"Something changed in the\
    \ input!\");\n} \n```\n\n**列表 8.5** onchange 事件函数\n\n# 9 异步 JavaScript\n\n到目前为止，你一直在以同步的方式使用\
    \ JavaScript，尽管你并没有真正意识到。JavaScript 本质上是一种同步语言，这意味着函数按照它们编写的顺序执行，或者更简单地说，函数一次只能执行一个。这一点突出了标准\
    \ JavaScript 的最大的缺点之一，即每个函数必须在下一个函数开始之前完成执行，这导致了所谓的“阻塞”。阻塞可能会使你的网页变得缓慢且无响应。这类似于\
    \ ABAP 程序指定 `COMMIT WORK AND WAIT` 的情况，程序必须等待该提交的结果后才能继续执行。\n"
- fmt: "\nThis is where asynchronous JavaScript comes in. Asynchronous JavaScript\
    \ is a way for you to get around the linear flow of standard JavaScript and add\
    \ some flexibility to your code, so you can either wait for a function to finish\
    \ executing or let it execute in the background and finish in its own time. This\
    \ is similar to an ABAP program called `COMMIT WORK` where the program doesn’t\
    \ wait around for the result of the commit. Note that this is an advanced JavaScript\
    \ topic, but one worth being introduced to from the beginning. Asynchronous JavaScript\
    \ is illustrated in [Listing 9.1](#09_001.html_l9.1) with the JavaScript `setTimeout()`\
    \ function, which pauses the function execution for a few seconds. Notice how\
    \ the function `callExternalServer()` does not hold up the `doSomethingElse()`\
    \ function (even though it is executed before) and lets the rest of the program\
    \ continue until it completes.\n\n```javascript\nconst doSomething = () => {\n\
    \  console.log(\"Do something\");\n};\nconst callExternalServer = () => {\n  setTimeout(()\
    \ => {\n    console.log(\"Call to external server complete\");\n  }, 3000);\n\
    };\nconst doSomethingElse = () => {\n  console.log(\"Do something else\");\n};\n\
    doSomething();\ncallExternalServer();\ndoSomethingElse(); \n```\n\n**Listing 9.1**\
    \ `setTimeout()` Function\n\nIn this section, we’ll look at the older JavaScript\
    \ callbacks, the JavaScript promise, and finally the newer `async`/`await` syntax,\
    \ which gives much more granular control over when our JavaScript logic executes.\n\
    \n## 9.1 Callbacks in JavaScript\n\nCallbacks are one of the older coding strategies\
    \ in JavaScript but you will see them often. They involve passing a function as\
    \ a parameter to another function. The idea is that you create your first function\
    \ that runs until completion and when it does, it calls another function, known\
    \ as the callback. Think of it as sending someone a message and asking them to\
    \ do something and “call you back” when they are done.\n\nThis allows for more\
    \ granular control over when functions are executed and allows you to handle scenarios\
    \ where one function relies on another to complete before it can start. A great\
    \ way to illustrate this is with a calculator. In [Listing 9.2](#09_001.html_l9.2),\
    \ we create a calculator we can pass some numbers into and when the calculation\
    \ is done, we call another function that logs that result to the console.\n\n\
    ```javascript\nconst displayCalculatorResult = (result) => {\n  console.log(result);\n\
    };\n\nconst calculatorWithCallback = (num1, num2, callback) => {\n  let result\
    \ = num1 + num2;\n  // Calling our callback function\n  callback(result);\n};\n\
    calculatorWithCallback(1, 9, displayCalculatorResult); \n```\n\n**Listing 9.2**\
    \ JavaScript Callback\n\nNotice that we declared two functions, one to display\
    \ the output and the other to calculate it. In our calculator function, we specified\
    \ two number parameters and a third `callback` parameter, which is where we passed\
    \ the display function. So, when we call the calculator function, the display\
    \ function is only executed after the calculation has completed and logs the result\
    \ to the console. The key here is that the display function only runs when the\
    \ calculation is complete.\n\n## 9.2 JavaScript Promise\n\nThe JavaScript promise\
    \ is another advanced topic, but it is effectively just another way of writing\
    \ a callback function with the added advantage of returning either a success or\
    \ error and letting us decide what to do in each scenario. Promises are used for\
    \ situations where you need to request data from outside your app and need to\
    \ wait for that data to be returned before you start processing. We can simulate\
    \ this using the `setTimeout()` function again, which will pause our promise execution\
    \ and mimic a call to an external server.\n\nThe syntax for a promise is a bit\
    \ complex, but it will make sense the more you use them. In [Listing 9.3](#09_002.html_l9.3),\
    \ we declare a new function `promise` with `resolve` and `reject` parameters that\
    \ we will use inside the function. We tell the function to return a `resolve`\
    \ once the `setTimeout` function has completed after 5000 milliseconds (5 seconds).\n\
    \n```javascript\nconst myFirstPromise = new Promise((resolve, reject) => {\n \
    \ setTimeout(() => {\n    resolve(\"The server finally sent a response!\");\n\
    \    reject(\"An error occured :(\");\n  }, 5000);\n});\n\nmyFirstPromise\n  .then((data)\
    \ => {\n    // resolve part\n    console.log(data);\n  })\n  .catch((error) =>\
    \ {\n    // reject part\n    console.log(error);\n  }); \n```\n\n**Listing 9.3**\
    \ JavaScript Promise\n\nNotice how there is a five-second delay before the text\
    \ is logged to the console. We call the `myFirstPromise` function and place the\
    \ `then()` keyword after it, which holds the function to be executed when the\
    \ promise function resolves. The `resolve` from the promise passes the text in\
    \ the `resolve` brackets as a parameter to the `then()` part, which we import\
    \ using the `data` parameter.\n\nAlso, notice that we have a `reject()` in there\
    \ as well, but it was not executed. Normally, you would have some logic within\
    \ the promise that would determine if the `resolve` were called or the `reject`.\
    \ To trigger the `reject` in our example, we comment out the `resolve()` line\
    \ and run the example again like before. You should now see the text `\"An error\
    \ occurred :(\"` logged to the console.\n\nSo, when using promises, just remember\
    \ that promise `resolve` maps to the `then()` section and promise `reject` maps\
    \ to the `catch()` section (like a `TRY`/`CATCH` block in ABAP). You can structure\
    \ your success or fail logic around that.\n\n## 9.3 Async and Await\n\nThe `async`\
    \ and `await` keywords in JavaScript help make writing asynchronous code easier,\
    \ compared to the previous promise syntax. The `async` keyword is used to transform\
    \ a JavaScript function into a promise and replaces the `new Promise` syntax from\
    \ [Listing 9.3](#09_002.html_l9.3). This then allows you to use the `await` keyword\
    \ within the async function, which when placed in front of a normal function will\
    \ wait for that function call to finish.\n\nIn [Listing 9.4](#09_003.html_l9.4),\
    \ we compare a normal function versus what happens when you insert `async` before\
    \ it. Notice how `myFunction()` returns the text, while `myAsyncFunction()` returns\
    \ text wrapped in a promise because of the `async` keyword.\n\n```javascript\n\
    const myFunction = () => {\n  return \"A normal function\";\n};\nconsole.log(myFunction());\
    \ // A normal function\n\nconst myAsyncFunction = async () => {\n  return \"A\
    \ promise function\"; // Promise { 'A promise function' }\n};\nconsole.log(myAsyncFunction());\
    \ \n```\n\n**Listing 9.4** async Function\n"
