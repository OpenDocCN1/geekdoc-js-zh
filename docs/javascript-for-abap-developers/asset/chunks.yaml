    # 1    Introduction to JavaScript and its Basic Principles


    JavaScript started life as a programming language that allowed you to take static
    webpages and add complex logic to dynamically react to user input or application
    programming interface (API) changes. Since then, it has developed into an all-purpose
    programming language that can be used to build almost anything with its vast ecosystem
    of libraries and frameworks. Undoubtably, one of the frameworks you might have
    heard of is part of the SAP product range, SAPUI5, or OpenUI5, which is the open-source
    version of SAPUI5.'
