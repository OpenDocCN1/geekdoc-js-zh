  trans: "\n当用户与你的应用交互时，他们可能需要从一个页面导航到另一个页面，并在某个时刻返回他们之前所在的页面。你的应用需要为这种页面间的导航提供一种稳定的方式。这就是\
    \ `History API` 派上用场的地方。你可以使用浏览器的 `window` 对象调用 `location` 或 `history` 对象，将用户从一个页面导航到另一个页面。假设我们有两个网页，第一个页面是\
    \ `index.html`，如列表 13.1\">Detail Page</button>\n</body>\n</html> \n```\n\n**Listing\
    \ 13.1** index.html\n\n```html\n<!DOCTYPE html>\n<head>\n    <script src=\"app.js\"\
    ></script>\n    <title>Document</title>\n</head>\n<body>\n    <h1>Detail Page</h1>\n\
    \    <button onclick=\"goBack()\">Go Back!</button>\n</body>\n</html> \n```\n\n\
    **Listing 13.2** detail.html\n\n```javascript\nconst navigateToDetailPage = ()\
    \ => {\n  window.location = \"detail.html\";\n};\n\nconst goBack = () => {\n \
    \ window.history.back();\n}; \n```\n\n**Listing 13.3** app.js\n\n在我们的首页上，点击“Detail\
    \ Page”按钮并使用 `navigateToDetailPage()` 函数导航到我们的 `detail.html` 页面。该函数使用 `window`\
    \ 对象将 `.location` 更改为 `detail.html`，然后将其加载到浏览器中，如图 13.1` 方法，它带回到浏览器历史中的上一个页面 `index.html`。\n\
    \n![Home Page](img/img-f13.1.html)\n\n**Figure 13.1** Home Page\n\n![Detail Page](img/img-f13.2.html)\n\
    \n**Figure 13.2** Detail Page\n\n## 13.2 地理定位\n\n另一个流行的 API 是 `Geolocation API`，顾其名，它用于查找运行应用的设备的位置。浏览器找到你位置最快的方法是通过你的\
    \ IP 或 Wi-Fi 信号，但当你的应用尝试获取用户位置时，通常会弹出一个小窗口，询问用户是否允许浏览器为你的应用使用地理定位。\n\n要使用地理定位，我们将列表\
    \ 13.4 中的代码添加到列表 13.3 的 `app.js` 文件中，并向之前列表 13.1 所示的 `index.html` 页面中添加一个新按钮 `<button\
    \ onclick=\" alertLocation()\">Show Location</button>`，以调用列表 13.4 所示所示新函数。\n\n\
    ```javascript\nconst alertLocation = () => {\n  if (\"geolocation\" in navigator)\
    \ {\n    navigator.geolocation.getCurrentPosition((location) => {\n      alert(\n\
    \        `I am at ${location.coords.latitude} latitude by ${location.coords.longitude}\
    \ longitude`\n      );\n    });\n  } else {\n    console.log(\"No geolocation\
    \ available.\");\n  }\n}; \n```\n\n**Listing 13.4** Geolocation API\n\n点击“Show\
    \ Location”，然后当浏览器地理定位权限弹窗出现时，点击“Allow”，如图 13.3 所示。随后我们会看到一个 JavaScript 警框，其中包含经纬度作为文本的一部分，这是访问浏览器地理定位功能并将其整合到\
    \ JavaScript 代码中的简单方法。\n\n![Browser Geolocation Permission Alert](img/img-f13.3.html)\n\
    \n**Figure 13.3** Browser Geolocation Permission Alert\n\n## 13.3 浏览器存储\n\n现代浏览器（如\
    \ Chrome、Firefox 和 Safari）都拥有所谓的浏览器存储，它们会在你访问网页时在其中某些数据。根据所使用的浏览器存储类型，在你关闭网页或浏览器窗口后，这些数据可能会被保留或删除。在浏览器中存储数据有很多原因，从身份识别到安全，甚至是偏好设置。\n\
    \n你的浏览器存储选项包括本地存储（local storage），它可以在会话之间（关闭网页后）持久存在；会话存储（session storage）数据在关闭网页时过期；以及\
    \ cookies 和数据库存储。为了简单起见，我们专注于使用 JavaScript 将一些数据保存到浏览器的本地存储中，并在刷新页面时查看它。\n\n在继续之前，导航到浏览器的开发者控制台（我们在示例中使用\
    \ Chrome），并寻找如图 13.4](img-f13.4.html)\n\n**Figure 13.4** Chrome DevTools: Local\
    \ Storage\n\n现在，我们将列表 13.5 中的代码添加到 `alertLocation()` 函数中（之前在列表 13.4` 之下。当我们点击“Show\
    \ Location”时，我们会看到地理定位警框，点击 OK 后，我们将纬度数据存储在浏览器的本地存储中，如列表 13.5) {\n    localStorage.setItem(\"\
    latitude\", location.coords.latitude);\n  } else {\n    alert(\"Latitude is already\
    \ stored on this browser.\");\n  } \n```\n\n**Listing 13.5** Browser Storage\n\
    \n确保 Chrome DevTools 中打开了 `Application` 标签页（如图 13.4](img-f13.5.html)\n\n**Figure\
    \ 13.5** Local Storage with Values\n\n刷新页面，看到纬度项已持久化在本地存储中。如果我们将纬度保存在会话存储中，该值在关闭浏览器窗口后将被删除。\n\
    \n# 14 调试与错误处理\n\nJavaScript 中的错误处理在开发中起着至关重要的作用，你在 ABAP 代码中使用的许多技术可以直接翻译为 JavaScript，尽管语法略有不同。由于\
    \ JavaScript 的弱类型系统，许多错误在运行之前不会被捕获，因此你应该提前为它们做好计划。\n\n对于调试，原生 JavaScript 并没有像内置的备受喜爱的\
    \ ABAP 调试器那样的工具。你的场景和个人偏好将决定你使用哪些工具。在我们的案例中，我们使用了 Chrome DevTools 和 VS Code 内置的调试器。还有许多其他调试工具可用，但这两个工具被广泛使用且文档齐全。除了这些工具之外，我们还使用\
    \ `console.log()` 语句作为调试策略的一部分，在代码执行时将值打印到控制台。\n"
- fmt: "\nIn the following sections, we’ll discuss some common types of errors and\
    \ how they are viewed, before walking through the two key debugging tools and\
    \ error handling in JavaScript.\n\n## 14.1 Error Types and Views\n\nThere are\
    \ many error types and scenarios, but they are beyond the scope of this E-Bite.\
    \ Some of the more common errors you will come across include those shown in [Table\
    \ 14.1](#14_001.html_t14.1).\n\n| Error | Example |\n| --- | --- |\n| <samp class=\"\
    listingcharacter\">Uncaught TypeError: Cannot Read Property ’property-name’ of\
    \ undefined</samp> | E.g., calling an attribute that is undefined. |\n| <samp\
    \ class=\"listingcharacter\">ReferenceError: newaCr is not defined…</samp><samp\
    \ class=\"listingcharacter\">test-errors.js:9:16)</samp> | E.g., calling a method\
    \ of an object that doesn’t exist yet. |\n| <samp class=\"listingcharacter\">Uncaught\
    \ TypeError: Cannot set property ’innerHTML’ of null…</samp> | E.g., when your\
    \ JavaScript code executes before the DOM is fully loaded and the element does\
    \ not exist yet. |\n\n**Table 14.1** Some Common JavaScript Errors\n\nMost of\
    \ these errors will indicate where the error is coming from, including the file\
    \ name and line number where the error occurred, as shown in [Listing 14.1](#14_001.html_l14.1).\n\
    \n```\nconsole.log(`${newaCr.make}`);\n               ^\nReferenceError: newaCr\
    \ is not defined\n    at Object.<anonymous> (C:\\users\\public\\car.js:9:16) \n\
    ```\n\n**Listing 14.1** JavaScript Reference Error\n\nThe error in [Listing 14.1](#14_001.html_l14.1)\
    \ happened at the <samp class=\"listingcharacter\">console.log()</samp> statement,\
    \ and occurred because the <samp class=\"listingcharacter\">newaCr</samp> object\
    \ is not defined (because of a typo). We see the file location <samp class=\"\
    listingcharacter\">C:\\users\\public\\car.js</samp> with the line number and characters\
    \ from the left, respectively, <samp class=\"listingcharacter\">9:16 (C:\\users\\\
    public\\car.js:9:16),</samp>, so we know exactly where the offending code is.\
    \ If we are working in the browser, our errors are displayed in the browser’s\
    \ console area (see [Figure 14.1](#14_001.html_f14.1)), and if we are working\
    \ on a server-side Node.js app, for example, then in the terminal window (see\
    \ [Figure 14.2](#14_001.html_f14.2)).\n\n[![Errors in the Browser](bilderklein/klein14_001.png)](img-f14.1.html)\n\
    \n**Figure 14.1** Errors in the Browser\n\n[![Errors in VS Code Terminal](bilderklein/klein14_002.png)](img-f14.2.html)\n\
    \n**Figure 14.2** Errors in VS Code Terminal\n\n## 14.2 Debugging\n\nThe nature\
    \ of JavaScript with its dynamic typing system means you will see many bugs that\
    \ give you no indication of what has gone wrong, and you will need to place that\
    \ important breakpoint in your code. In VS Code, you can place a breakpoint at\
    \ the offending line of code, or you can use the using <samp class=\"listingcharacter\"\
    >debugger;</samp> statement, which is like the <samp class=\"listingcharacter\"\
    >BREAK-POINT</samp> statement in ABAP. You can then hit these breakpoints using\
    \ the built-in debugger in your IDE (VS Code, in our case) or hit your breakpoint\
    \ in your browser’s developer tools panel (Chrome DevTools, in our case).\n\n\
    We’ll take a closer look at both tools in the following sections.\n\n### Debugging\
    \ with Chrome DevTools\n\nMost major browsers have their own set of debugging\
    \ tools, but we are introducing the concept using Chrome’s built-in debugging\
    \ tools because they are among the best. To begin, we trigger our first JavaScript\
    \ breakpoint using the <samp class=\"listingcharacter\">debugger;</samp> statement\
    \ and see what options we have in the browser. [Listing 14.2](#14_002.html_l14.2)\
    \ shows a standard HTML page that references the JavaScript code in [Listing 14.3](#14_002.html_l14.3),\
    \ which is where we’ll place our breakpoint. In [Listing 14.3](#14_002.html_l14.3),\
    \ we placed a <samp class=\"listingcharacter\">debugger;</samp> statement (our\
    \ breakpoint) just before the <samp class=\"listingcharacter\">alertText</samp>\
    \ variable assignment.\n\n```html\n<!DOCTYPE html>\n<head>\n    <title>Document</title>\n\
    \    <script src=\"app.js\"></script>\n</head>\n\n<body>\n    <h1>Let’s do some\
    \ debugging!</h1>\n    <button id=\"button1\" onclick=\"onButtonClick()\">Press\
    \ Me!</button>\n</body>\n</html> \n```\n\n**Listing 14.2** index.html\n\n```javascript\n\
    const onButtonClick = () => {\n  debugger;\n  let alertText = \"Button clicked!\"\
    ;\n  alert(alertText);\n}; \n```\n\n**Listing 14.3** app.js\n\nWe run our webpage\
    \ from [Listing 14.2](#14_002.html_l14.2), and when we click Press Me!, we do\
    \ not trigger our breakpoint. That is because to trigger the breakpoint, we need\
    \ to have Chrome DevTools open. Press [F12] or right-click and click Inspect in\
    \ the context menu. Once the DevTools are open, refresh the page and click Press\
    \ Me! again. Our browser screen dims, and we now see the code from our `app.js`\
    \ file in the Sources tab and our <samp class=\"listingcharacter\">debugger;</samp>\
    \ statement highlighted with our code execution stopped at that breakpoint, as\
    \ shown in [Figure 14.3](#14_002.html_f14.3).\n\nAlthough the interface in [Figure\
    \ 14.3](#14_002.html_f14.3) is a bit different, the process of debugging is much\
    \ the same as ABAP. You see your code at the top right with a file explorer on\
    \ the left showing your `index.html` and `app.js` files, with a few different\
    \ sections underneath. You can see the Call Stack, which shows we are in the <samp\
    \ class=\"listingcharacter\">onButtonClick()</samp> function. You will also see\
    \ the Scope section toward the right side, which holds our undefined <samp class=\"\
    listingcharacter\">alertText</samp> variable that we are now going to assign some\
    \ text.\n\n[![Chrome DevTools: Debugging](bilderklein/klein14_003.png)](img-f14.3.html)\n\
    \n**Figure 14.3** Chrome DevTools: Debugging\n\nJust like with the ABAP debugger,\
    \ we can step through our code. Use the buttons toward the top middle of the browser\
    \ or in Chrome DevTools above the Breakpoints section. Click the Step over next\
    \ function button [F10] twice to step onto and over the <samp class=\"listingcharacter\"\
    >alertText</samp> variable assignment, and watch how our local variable is assigned\
    \ text in both the Scope section and the code view area in [Figure 14.4](#14_002.html_f14.4).\n\
    \nBefore we continue, in [Figure 14.5](#14_002.html_f14.5), we change our <samp\
    \ class=\"listingcharacter\">alertText</samp> variable to `I changed this text`\
    \ by double-clicking the Button Clicked! text in the Scope section, entering the\
    \ new text, and pressing [Enter]. We then click the blue Resume script execution\
    \ button [F8] to continue through our code where we see our alert with the updated\
    \ text.\n\nThis is just the tip of the iceberg, and there is much more we can\
