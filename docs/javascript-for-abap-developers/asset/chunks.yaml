  trans: "\n\n既然我们知道 `myAsyncFunction` 是一个 promise，我们可以使用 Listing 9.3 中的 `async` 语法重写我们标准的\
    \ promise 示例，如 Listing 9.5 所示。我们还将添加两个调用，以查看在 `setTimeout` 函数运行前后的执行流。\n\n```\n\
    const myAsyncFunction = async () => {\n  const myFirstPromise = new Promise((resolve,\
    \ reject) => {\n    setTimeout(() => {\n      resolve(\"The server finally sent\
    \ a response!\");\n      //   reject(\"An error occured :(\");\n    }, 5000);\n\
    \  });\n  // 先执行这个\n  console.log(\"Let's get started!\");\n  // 后执行这个，但等待其完成（5\
    \ 秒）\n  console.log(await myFirstPromise);\n  // 仅在上面的函数 promise 解析完成后执行\n  console.log(\"\
    I had to wait for the call above to finish\");\n};\n\nmyAsyncFunction(); \n```\n\
    \n**Listing 9.5** async/await 函数\n\n在 Listing 9.5 中，控制台将记录以下内容：\n\n`Let’s get\
    \ started!`（随后是五秒的暂停。）\n\n`The server finally sent a response!`\n\n`I had to wait\
    \ for the call above to finish!`\n\n`async` 函数充当包装器，允许你在内部调用其他函数（包括普通 promise），这让你能够更好地控制一个函数在执行之前可能需要等待另一个函数的位置。要查看\
    \ `await` 关键字的好处，请将其完全删除并查看控制台的以下输出：\n\n`Let’s get started!`（没有五秒的暂停）。\n\n`Promise\
    \ { <pending> }`\n\n`I had to wait for the call above to finish!`\n\n你可以清楚地看到\
    \ promise（或任何需要执行时间的函数）处于什么位置，以及它如何在继续执行下一行代码之前没有获得完成的机会，这导致了潜在的不稳定性。重新加上 `await`\
    \ 关键字后，正确的事件顺序就会恢复。\n\n# 10 类\n\n大多数 ABAP 开发人员对面向对象编程领域中的类概念非常熟悉。本节假设你至少了解 ABAP\
    \ 类和面向对象编程范式的基础知识，并说明如何使用 JavaScript 语法重新创建类。\n\n你的 JavaScript 类充当对象的蓝图，就像 ABAP\
    \ 类一样，你拥有相同的构建块来构建该对象蓝图，包括属性、方法、构造函数、静态和动态属性，甚至是继承。\n\n## 10.1 类定义\n\nJavaScript\
    \ 中的类可以使用类声明或类表达式来定义。类表达式可以进一步定义为具名的或未命名的。在 Listing 10.1 中，我们使用 `class` 关键字声明我们的类，后面跟上类名\
    \ `car`。\n\n```javascript\nclass car {\n  constructor(make, model) {\n    (this.make\
    \ = make);\n  }\n}\nconsole.log(car.name); // car \n```\n\n**Listing 10.1** 类声明\n\
    \n在 Listing 10.2 中，我们使用类表达式声明了一个无名类（`class` 关键字后没有名称），并将该类赋值给变量 `myCarClass`。\n\
    \n```javascript\nlet myCarClass = class {\n  constructor(make) {\n    this.make\
    \ = make;\n  }\n};\nconsole.log(myCarClass.name); // myCarClass \n```\n\n**Listing\
    \ 10.2** 类表达式（无名）\n\n在 Listing 10.3 中，我们将来自 Listing 10.2 的相同类赋值给变量 `myCarClass`，但这次该类是具名的，因为我们在\
    \ `class` 关键字之后包含了类名 `car`。\n\n```javascript\nlet myCarClass = class car {\n \
    \ constructor(make) {\n    this.make = make;\n  }\n};\nconsole.log(myCarClass.name);\
    \ // car \n```\n\n**Listing 10.3** 类表达式（具名）\n\n一旦声明了类，我们通过声明变量并使用 `new` 关键字（后跟类名以及构造函数所需的任何参数）来它实例化对象。在\
    \ Listing 10.4 中，我们实例化一个新的类对象并将其赋值给变量 `Mercedes`。\n\n```javascript\nclass car\
    \ {\n  constructor(make) {\n    this.make = make;\n  }\n}\nlet newCar = new car(\"\
    Mercedes\");\nconsole.log(`${newCar.make}`); // Mercedes \n```\n\n**Listing 10.4**\
    \ 类对象\n\n在 Listing 10.4 中，我们需要传入新汽车对象的品牌，以便类构造函数可以使用 `this` 关键字将其赋值为对象本身的属性。一旦我们有了这个新汽车对象，就可以调用该对象的属性，在本例中，将它们记录到控制台。\n\
    \n## 10.2 方法\n\n就像 ABAP 一样，我们可以为 JavaScript 类添加方法，允许我们与实例化的对象进行交互。语法看起来像普通的 JavaScript\
    \ 函数，包括 `method_name` 后面跟有带有参数的 `()` 以及 `{}` 内的实际逻辑。\n\n使用来自 Listing 10.4 的示例，我们在\
    \ Listing 10.5 的构造函数下方添加了五个新方法。它们是启动和停止引擎、增加速度、应用刹车以及将速度记录到控制台。我们还将汽车的速度作为一个新属性，以跟踪我们的行驶有多快。\n\
    \n```javascript\nclass car {\n  constructor(make) {\n    (this.make = make), (this.current_speed\
    \ = 0);\n  }\n  start_engine() {\n    console.log(\"Car started!\");\n    this.log_speed();\n\
    \  }\n  stop_engine() {\n    console.log(\"Engine off.\");\n  }\n  accelerate(kmh)\
    \ {\n    typeof kmh === \"number\"\n      ? (this.current_speed += kmh)\n    \
    \  : console.error(\"parameter must be a number\");\n    this.log_speed();\n \
    \ }\n  brake() {\n    this.current_speed = 0;\n    this.log_speed();\n  }\n  log_speed()\
    \ {\n    console.log(`Speedometer: ${this.current_speed}`);\n  }\n}\n\nlet newCar\
    \ = new car(\"Mercedes\");\nconsole.log(`${newCar.make}`); // Mercedes\nnewCar.start_engine();\n\
    newCar.accelerate(5);\nnewCar.accelerate(10);\nnewCar.accelerate(10);\nnewCar.brake();\n\
    newCar.stop_engine(); \n```\n\n**Listing 10.5** JavaScript 类方法\n\n运行 Listing 10.5\
    \ 中的代码，控制台的输出将如 Listing 10.6 所示。\n\n```\nMercedes\nCar started!  \nSpeedometer:\
    \ 0\nSpeedometer: 5\nSpeedometer: 15\nSpeedometer: 25\nSpeedometer: 0\nEngine\
    \ off. \n```\n\n**Listing 10.6** 来自 10.5 的输出\n\n我们能够像访问类属性一样，调用我们在 `car` 类中定义的新对象方法（使用\
    \ `.` 符号），这让我们能够控制汽车对象并开个兜。\n\n## 10.3 静态与动态属性及方法\n\nJavaScript 类属性和方法可以声明为静态的，就像\
    \ ABAP 一样。如果你在 JavaScript 类中声明了静态属性或方法，你可以直接通过类访问它，而不需要实例化对象。缺点是，你无法从该类的实例访问相同的静态属性或方法。\n\
    \n"
- fmt: "\nTo demonstrate this, we use our example in [Listing 10.5](#10_002.html_l10.5)\
    \ and add a static attribute `static_attribute` and static method `static_method()`,\
    \ calling them before we instantiate the object, as shown in [Listing 10.7](#10_003.html_l10.7).\n\
    \n```\nclass car {\n  constructor(make) {\n    (this.make = make), (this.current_speed\
    \ = 0);\n  }\n  start_engine() {\n    console.log(\"Car started!\");\n    this.log_speed();\n\
    \  }\n  stop_engine() {\n    console.log(\"Engine off.\");\n  }\n  accelerate(kmh)\
    \ {\n    typeof kmh === \"number\"\n      ? (this.current_speed += kmh)\n    \
    \  : console.error(\"parameter must be a number\");\n    this.log_speed();\n \
    \ }\n  brake() {\n    this.current_speed = 0;\n    this.log_speed();\n  }\n  log_speed()\
    \ {\n    console.log(`Speedometer: ${this.current_speed}`);\n  }\n  static static_method()\
    \ {\n    return \"Hello from a static class method\";\n  }\n  static static_attribute\
    \ = \"A static attribute\";\n}\n\nconsole.log(car.static_method());\nconsole.log(car.static_attribute);\n\
    let newCar = new car(\"Mercedes\");\nconsole.log(`${newCar.make}`); // Mercedes\n\
    newCar.start_engine();\nnewCar.accelerate(5);\nnewCar.accelerate(10);\nnewCar.accelerate(10);\n\
    newCar.brake();\nnewCar.stop_engine(); \n```\n\n**Listing 10.7** Static Attributes\
    \ and Methods\n\nThe output from [Listing 10.7](#10_003.html_l10.7) will look\
    \ as shown in [Listing 10.8](#10_003.html_l10.8).\n\n```\nHello from a static\
    \ class method\nA static attribute\nMercedes\nCar started!\nSpeedometer: 0\nSpeedometer:\
    \ 5\nSpeedometer: 15\nSpeedometer: 25\nSpeedometer: 0\nEngine off. \n```\n\n**Listing\
    \ 10.8** Output from Listing 10.7\n\nNotice that we can access the static attribute\
    \ and static method before we instantiate the class. If you call the static method\
    \ or access the static attribute using the `newCar` object, you will get a `TypeError`.\n\
    \n## 10.4 Inheritance\n\nInheritance in JavaScript classes works in a similar\
    \ way to ABAP classes and follows the same general object-oriented principle of\
    \ a subclass inheriting (and extending) properties and methods of a superclass.\
    \ The basic syntax involves the subclass definition with the addition of the `extends`\
    \ keyword, followed by the name of the superclass you are inheriting from. From\
    \ there, you can use the `super` method in the subclass constructor to pull in\
    \ the attributes and methods from your superclass.\n\nWe continue our example\
    \ in [Listing 10.7](#10_003.html_l10.7) and create a subclass that extends the\
    \ `car` superclass, then use it to create a more specific class for a model of\
    \ car. As shown in [Listing 10.9](#10_004.html_l10.9), we create a class called\
    \ `carModel` that extends the `car` superclass using the `extends` keyword. Inside\
    \ the `carModel` class `constructor`, we reference the superclass attributes and\
    \ methods using the `super` keyword, making sure to pass in the `(make)` of the\
    \ car, as the `make` attribute is assigned in the superclass, which the subclass\
    \ then inherits. After that, the subclass extends the attributes of the superclass\
    \ by adding its own attribute `this.model` in its own constructor.\n\n```\nclass\
    \ carModel extends car {\n  constructor(make, model) {\n    super(make);\n   \
    \ this.model = model;\n  }\n}\n\nlet newCarModel = new carModel(\"Mercedes\",\
    \ \"S Class\");\nconsole.log(`${newCarModel.make} ${newCarModel.model}`); // mercedes\
    \ S Class\nnewCarModel.start_engine();\nnewCarModel.accelerate(5);\nnewCarModel.accelerate(10);\n\
    newCarModel.accelerate(10);\nnewCarModel.brake();\nnewCarModel.stop_engine();\
    \ \n```\n\n**Listing 10.9** Class Inheritance\n\nThe output to the console from\
    \ [Listing 10.9](#10_004.html_l10.9), including both superclass and subclass,\
    \ is as shown in [Listing 10.10](#10_004.html_l10.10).\n\n```\nHello from a static\
    \ class method\nA static attribute\nMercedes\nCar started!\nSpeedometer: 0\nSpeedometer:\
    \ 5\nSpeedometer: 15\nSpeedometer: 25\nSpeedometer: 0\nEngine off.\nMercedes S\
    \ Class\nCar started!\nSpeedometer: 0\nSpeedometer: 5\nSpeedometer: 15\nSpeedometer:\
    \ 25\nSpeedometer: 0\nEngine off. \n```\n\n**Listing 10.10** Output from Listing\
    \ 10.9\n\nNotice that the `newCarModel` object, which is instantiated using the\
    \ subclass `carModel`, was able to call methods from the superclass `car` while\
    \ adding in (or extending) the class attributes to include the car-specific model.\n\
    \n# 11 AJAX\n\nAsynchronous JavaScript and XML (AJAX) allows you to communicate\
    \ with external webservers from within your webpage using HTTP methods like `GET`\
    \ or `POST` and update the DOM based on the response. AJAX revolves around the\
    \ browser’s built-in `XMLHttpRequest` object and the more modern Fetch API, which\
    \ allows you to request data outside of your webpage. You could use AJAX to call\
    \ the JSON data found in [Section 6](#06_001.html_h6) and you would receive the\
    \ same JSON-formatted response.\n\nAs the name suggests, one of the benefits of\
    \ AJAX is that it works asynchronously. That means when you use it to request\
    \ data from a server and you do not know how long that data return will take,\
    \ it will not hold up your webpage waiting for that requested data. This means\
    \ your webpage can be updated in the background while still working, presenting\
    \ a better user experience.\n\nWe’ll explore two key components of AJAX—the `XMLHttpRequest`\
    \ object and the Fetch API—in the following sections.\n\n## 11.1 XMLHttpRequest\
    \ Object\n\nThe `XMLHttpRequest` object can be used to request data from resources\
    \ located on an external server, depending on your server configuration. These\
    \ calls are normally restricted to the same server address of a security concept\
    \ called cross-origin resource sharing (CORS). For simplicity, we will assume\
    \ that your local server does not allow CORS, so we will use the `XMLHttpRequest`\
    \ object to request data from a local file stored in the same folder as our `index.html`\
    \ and `app.js` files, as shown in [Listing 11.1](#11_003.html_l11.1) and [Listing\
    \ 11.2](#11_003.html_l11.2).\n\n```html\n<html>\n<head>\n    <script src=\"app.js\"\
    ></script>\n</head>\n<body>\n    <p id=\"text\">Some text</p>\n    <button onclick=\"\
    sendRequest()\">Get the data!</button>\n</body>\n</html> \n```\n\n**Listing 11.1**\
    \ index.html\n\nWe run the webpage from [Listing 11.1](#11_003.html_l11.1) and\
    \ see some text with a button underneath on the page. When we click the button,\
    \ it triggers an HTML `onclick` event that executes the `sendRequest` function\
    \ in [Listing 11.2](#11_003.html_l11.2).\n\n```javascript\nconst sendRequest =\
    \ () => {\n  let xhttp = new XMLHttpRequest();\n  xhttp.open(\"GET\", \"test_data.json\"\
    , true);\n  xhttp.send();\n  xhttp.onreadystatechange = function () {\n    if\
    \ (this.readyState == 4 && this.status == 200) {\n      document.getElementById(\"\
    text\").innerHTML = this.responseText;\n    }\n  };\n}; \n```\n\n**Listing 11.2**\
    \ app.js\n"
