  trans: "\n\n对数组进行排序后，你可能不再记得某个特定值的精确索引。JavaScript 有一个方便的 `indexOf()` 方法来查找数组中特定值的索引，如\
    \ Listing 5.5 中所示的 `Fish` 索引。\n\n```\nlet petArray = [\"Bird\", \"Cat\", \"Dog\"\
    , \"Fish\", \"Reptile\"];\nlet index = petArray.indexOf(\"Fish\");\nconsole.log(index);\
    \ // 3 \n```\n\n**Listing 5.5**     indexOf()\n\nJavaScript 中另一个有用的方法是 `some()`。它允许你扫描数组以检查是否存在某个值。在\
    \ Listing 5.6 中，我们扫描了 `petArray` 以检查是否存在 `Reptile` 这个值。为了实现这一点，我们创建了一个新变量 `reptileExists`\
    \ 并将其赋值为 `petArray.some()` 方法调用的返回值。在这次调用中，我们传递了一个参数 `(element)`，数组中的每个值都会被迭代并传递给它，就像之前讨论的\
    \ `sort()` 方法一样。我们在函数内部添加了一行简单的逻辑 `element === \"Reptile\",`。然后该函数会遍历所有数组值，直到所有值都不匹配（返回\
    \ `false`）或某个项目匹配（返回 `true`），最后我们将结果打印到控制台。\n\n```\nlet petArray = [\"Bird\",\
    \ \"Cat\", \"Dog\", \"Fish\", \"Reptile\"];\nlet reptileExists = petArray.some((element)\
    \ => element === \"Reptile\");\nconsole.log(reptileExists); // true \n```\n\n\
    **Listing 5.6**     Array Method: some()\n\n当我们更改数组中的数据时，首先需要理解的关键点是数组的长度，或者说我们正在处理多少个项目。在\
    \ Listing 5.7 中，我们调用了 `petArray.length`，它将返回数组的长度（在示例中为 `5`）。\n\n```\nlet petArray\
    \ = [\"Dog\", \"Cat\", \"Bird\", \"Fish\", \"Reptile\"];\nconsole.log(petArray.length);\
    \ // 5 \n```\n\n**Listing 5.7**     array.length Method\n\n现在我们知道了数组中有多少个项目，让我们使用\
    \ `push()` 方法向其添加一个项目。在 Listing 5.8 中，我们调用了 `petArray.push(\"Lion\")`，字符串 `Lion`\
    \ 将作为第六个项目添加到索引为 `5` 的数组中。我们使用 `console.table()` 以表格格式将数组打印到控制台，并在添加 `Lion` 之前之后打印数组长度。\n\
    \n```\nlet petArray = [\"Dog\", \"Cat\", \"Bird\", \"Fish\", \"Reptile\"];\nconsole.log(petArray.length);\
    \ // 5\npetArray.push(\"Lion\");\nconsole.table(petArray);\nconsole.log(petArray.length);\
    \ // 6 \n```\n\n**Listing 5.8**     array.push Method\n\n让我们尝试使用灵活的 `splice()`\
    \ 方法在数组开头插入一个项目。`splice()` 方法的语法包含几个参数，如 Listing 5.9 所示。\n\n```\nmyArray.splice(\n\
    \"index where item is to be added\", \n\"how many items should be removed, can\
    \ be 0 or none)\", \n\"the item(s) to be added\"\n). \n```\n\n**Listing 5.9**\
    \     splice() Method Syntax\n\n在 Listing 5.10 中，我们将该方法应用于 `petArray`，并在索引为 `0`\
    \ 的数组开头添加了一个 `Lion`。\n\n```\nlet petArray = [\"Dog\", \"Cat\", \"Bird\", \"Fish\"\
    , \"Reptile\"];\npetArray.splice(0, 0, \"Lion\");\nconsole.table(petArray); /*\
    \ \n[\"Lion\", \"Dog\", \"Cat\", \"Bird\", \"Fish\",// \"Reptile\"]; */ \n```\n\
    \n**Listing 5.10**     splice() Method: Add Item to an Array\n\n`splice()` 方法的灵活性意味着你可以用另一个项目替换某个项目，或者将其完全删除。在\
    \ Listing 5.11 中，我们从 `petArray` 中删除了 `Lion`，因为它并不是一个合适的宠物。之后，我们删除了 `Dog` 并用两个新项目\
    \ `Small Dog` 和 `Big Dog` 替换它。\n\n```\nlet petArray = [\"Lion\", \"Dog\", \"Cat\"\
    , \"Bird\", \"Fish\", \"Reptile\"];\npetArray.splice(0, 1);\nconsole.table(petArray);\
    \ // [\"Dog\", \"Cat\", \"Bird\", \"Fish\", \"Reptile\"];\npetArray.splice(0,\
    \ 1, \"Small Dog\", \"Big Dog\");\nconsole.table(petArray); /* \n[\"Small Dog\"\
    , \"Big Dog\", \"Cat\", \"Bird\",// \"Fish\",\"Reptile\"]; \n```\n\n**Listing\
    \ 5.11**     splice() Method: Delete and Replace Items\n\n### 注意事项\n\n注意，当我们第二次调用\
    \ `splice()` 时，传递的索引 0 与第一次调用是相同的。这是因为当我们执行第一次 `splice()` 并删除索引 `0` 处的 `Lion`\
    \ 时，整个数组会更新并将 `Dog` 移动到 `Lion` 所在的位置。这种数据变变（Data mutation）是你应该谨慎对待的。由于 JavaScript\
    \ 的动态性质，数据变异是一个非常关键的概念。\n\n## 5.2 对象和方法\n\nJavaScript 对象类似于 ABAP 中的结构，它们用于存储更详细的信息。它们由逗号分隔的\
    \ `name:value` 对组成，并包含在 `{}` 中。以汽车为例，通常你不仅仅有一个如 `make` 这样的属性，而是如下所示的 `make`、`model`、`topSpeed`\
    \ 等：\n\n```\nlet car = { make: \"Mercedes\", model: \"S Class\", topSpeed: 320\
    \ };\n```\n\nJavaScript 数组类似于 ABAP 内部表，而 JavaScript 对象类似于构成内部表记录的工作区域/结构。在 Listing\
    \ 5.12 中，我们进一步扩展了汽车示例，创建了一个包含不同汽车对象的数组，并将该对象数组打印到控制台。在 Listing 5.12 中，我们看到了一个包含奔驰、宝马和奥迪及其的表格输出。然后，我们使用\
    \ `carArray[1].make` 打印了索引为 `1` 的 `car` 对象。\n\n```\nlet carArray = [\n  {\n  \
    \  make: \"Mercedes\",\n    model: \"A Class AMG\",\n    colour: \"Black\",\n\
    \    topSpeed: 168,\n  },\n  {\n    make: \"BMW\",\n    model: \"M Series\",\n\
    \    colour: \"White\",\n    topSpeed: 150,\n  },\n  {\n    make: \"Audi\",\n\
    \    model: \"S4\",\n    colour: \"Blue\",\n    topSpeed: 173,\n  },\n];\nconsole.table(carArray);\n\
    console.log(carArray[1].make); // BMW\n```\n\n**Listing 5.12**     Array of JavaScript\
    \ Objects\n\n# 6 JSON\n\n"
- fmt: "\nJavaScript Object Notation (JSON) is an open-standard file format and not\
    \ the same as a JavaScript object, although they might look similar. The purpose\
    \ of JSON is to allow data to be sent back and forth as simple text between two\
    \ points (e.g., a server and your app) that JavaScript, and most other programming\
    \ languages including ABAP, can read and interpret. JavaScript has methods to\
    \ convert JSON data to a JavaScript object and a JavaScript object into JSON data\
    \ to be sent to a server.\n\nCopy and paste the widely used OData test service\
    \ ([http://s-prs.co/v535906](http://s-prs.co/v535906)) called Northwind into your\
    \ browser, and you should see a JSON format response returned in the browser window,\
    \ as shown in [Figure 6.1](#06_001.html_f6.1).\n\n[![JSON Response](bilderklein/klein06_001.png)](img-f6.1.html)\n\
    \n**Figure 6.1**  JSON Response\n\nIn the following sections, we’ll walk through\
    \ JSON syntax and methods, and discuss how it works with OData and SAPUI5.\n\n\
    ## 6.1   JSON Syntax\n\nJSON syntax is like JavaScript object syntax (see [Section 5.2](#05_002.html_h5.2)),\
    \ where you have an object inside of `{}` that contains `name:value` pairs. Commas\
    \ are used to separate data and names (or keys) must be written as strings within\
    \ `\"\"`, unlike JavaScript objects that can be written within single quotes.\
    \ [Listing 6.1](#06_001.html_l6.1) shows our car example from the previous section\
    \ written with JSON syntax.\n\n```json\n{\n  \"make\": \"Mercedes\",\n  \"model\"\
    : \"A Class AMG\",\n  \"colour\": \"Black\"\n} \n```\n\n**Listing 6.1**    JSON\
    \ Object\n\nThat object itself can also be a value of a `name:value` pair, with\
    \ `myCar` as the name and the car object as its value, as shown in [Listing 6.2](#06_001.html_l6.2).\n\
    \n```json\n{\n  \"myCar\": {\n    \"make\": \"Mercedes\",\n    \"model\": \"A\
    \ Class AMG\",\n    \"colour\": \"Black\"\n  }\n} \n```\n\n**Listing 6.2**  JSON\
    \ name:value Pair with Object\n\nYou can also have multiple objects within an\
    \ array, as we see in [Listing 6.3](#06_001.html_l6.3) (in this case, our `Mercedes`,\
    \ `BMW`, and `Audi` example), which is a common format you will receive when working\
    \ with SAP OData services. When you call an SAP OData service, you will likely\
    \ receive a JSON format response with a list of items in an array, like a list\
    \ of purchase orders.\n\n```json\n{\n  \"myCars\": [\n    {\n      \"make\": \"\
    Mercedes\",\n      \"model\": \"A Class AMG\",\n      \"colour\": \"Black\"\n\
    \    },\n    {\n      \"Make\": \"BMW\",\n      \"model\": \"M Series\",\n   \
    \   \"colour\": \"White\"\n    },\n    {\n      \"make\": \"Audi\",\n      \"\
    model\": \"S4\",\n      \"colour\": \"Blue\"\n    }\n  ]\n} \n```\n\n**Listing\
    \ 6.3**    JSON Object Array\n\n## 6.2   JSON Methods\n\nNote that even though\
    \ JSON data and JavaScript objects are similar, you will need to convert the JSON\
    \ data to work with it in your application. To do that, you will need to parse\
    \ (change) the JSON string from your request into a JavaScript object using the\
    \ standard JavaScript method `JSON.parse()`.\n\n[Listing 6.4](#06_002.html_l6.4)\
    \ shows some JSON data being parsed and assigned to the `object` variable. The\
    \ `object` variable contains the parsed JSON data, which is now type `object`,\
    \ that we can now work with in our code.\n\n```javascript\nvar object = JSON.parse(\n\
    \  '{ \"make\": \"Mercedes\", \"model\": \"A Class AMG\", \"colour\": \"Black\"\
    , \"trimOptions\": [\"Leather\", \"Cloth\", \"Alcantara\"]}'\n);\nconsole.log(object);\n\
    console.log(typeof object); // object\nconsole.log(object.make); // Mercedes\n\
    console.log(object.trimOptions[2]); // Alcantara \n```\n\n**Listing 6.4**    JSON.parse()\n\
    \nTo access the JSON data you have just parsed, use the same syntax for JavaScript\
    \ objects from [Section 5.2](#05_002.html_h5.2). In [Listing 6.4](#06_002.html_l6.4),\
    \ the output of `make` and `trimOptions[2]` will be `Mercedes` and `Alcantara`,\
    \ respectively.\n\nOnce finished reading and manipulating our JSON data, we must\
    \ convert it back to JSON before sending it to a server. This is done using a\
    \ method called `JSON.stringify()`. In [Listing 6.5](#06_002.html_l6.5), we pass\
    \ the `jsObject` variable into the `JSON.stringify()` method and log the converted\
    \ JSON string to the console. Notice we logged the `jsObject` variable type before\
    \ and after it was converted to JSON format to show how it is converted from a\
    \ JavaScript object back to JSON format, which is type `string`.\n\n```javascript\n\
    let jsObject = {\n  make: \"Mercedes\",\n  model: \"A Class AMG\",\n  colour:\
    \ \"Black\",\n  trimOptions: [\"Leather\", \"Cloth\", \"Alcantara\"],\n};\nconsole.log(typeof\
    \ jsObject); // object\nconsole.log(JSON.stringify(jsObject));\nconsole.log(typeof\
    \ JSON.stringify(jsObject)); // string \n```\n\n**Listing 6.5**    JSON.stringify()\n\
    \n## 6.3   OData and SAPUI5\n\nSAPUI5 and OData are beyond the scope of this E-Bite,\
    \ but if you are an ABAP professional who is moving into JavaScript, you will\
    \ almost certainly encounter SAPUI5 and OData. It is important to know that SAPUI5\
    \ makes use of JSON data in a variety of ways and can load JSON data from either\
    \ within the app (like test data) or from an outside source like SAP Gateway.\n\
    \nIf you were, for example, creating test data for your application, you would\
    \ store it in a file like `test_data.json`. This file would contain JSON-formatted\
    \ data like that shown in [Listing 6.4](#06_002.html_l6.4), and you would load\
    \ that JSON data into your application using an SAPUI5 framework method like:\n\
    \n```javascript\noModel.loadData(\"test_data.json\")\n```\n\nThat will trigger\
    \ a `GET` request, which will pull the data from that file and store it in the\
    \ SAPUI5 model. We will cover this general type of request in more detail in [Section 11](#11_001.html_h11)\
    \ and [Section 12.7](#12_007.html_h12).\n\nIf you were using an SAP Gateway OData\
    \ service, you would create an OData model with syntax that looks like:\n\n```javascript\n\
    var oModel = new ODataModel(\"http://url.com/sap/opu/odata/GWSAMPLE_BASIC/?$format=json\"\
    );\n```\n\nThis would create an SAPUI5 OData model that you would use to pass\
    \ data back and forth to your SAP system and display in your SAPUI5 views.\n\n\
    For now, just be aware that JSON is a data format you will often work with when\
    \ requesting data from an outside source.\n\n# 7   The Document Object Model (DOM)\n\
    \nThe DOM is a treelike structure that represents the HTML elements on a webpage.\
    \ The DOM is created by the browser when a webpage loads, allowing you to access\
    \ all the HTML elements dynamically, including their Cascading Style Sheets (CSS)\
    \ properties. The DOM is important because you will use it in conjunction with\
    \ JavaScript to manipulate those HTML elements and to create dynamic webpages.\n\
    \nIn this section, we’ll see how JavaScript interacts with the DOM through a practical\
    \ example, and then learn how to traverse the DOM, use selector methods, and manipulate\
    \ DOM elements.\n\n## 7.1   DOM Example\n\nRun the example shown previously in\
    \ [Section 1.4](#01_004.html_h1.4), [Listing 1.3](#01_004.html_l1.3) and [Listing 1.4](#01_004.html_l1.4),\
    \ and once you have your HTML page loaded in the browser, right-click Some old\
    \ text, and in the context menu, click Inspect. You should see the Chrome DevTools\
    \ window and, under the Elements tab, you should see your HTML element highlighted\
    \ as shown in [Figure 7.1](#07_001.html_f7.1).\n"
  raw: "JavaScript Object Notation (JSON) is an open-standard file format and not\
    \ the same as a JavaScript object, although they might look similar. The purpose\
    \ of JSON is to allow data to be sent back and forth as simple text between two\
    \ points (e.g., a server and your app) that JavaScript, and most other programming\
    \ languages including ABAP, can read and interpret. JavaScript has methods to\
    \ convert JSON data to a JavaScript object and a JavaScript object into JSON data\
    \ to be sent to a server.\n\nCopy and paste the widely used OData test service\
    \ ([http://s-prs.co/v535906](http://s-prs.co/v535906)) called Northwind into your\
    \ browser, and you should see a JSON format response returned in the browser window,\
    \ as shown in [Figure 6.1](#06_001.html_f6.1).\n\n[![JSON Response](bilderklein/klein06_001.png)](img-f6.1.html)\n\
    \n**Figure 6.1**     JSON Response\n\nIn the following sections, we’ll walk through\
    \ JSON syntax and methods, and discuss how it works with OData and SAPUI5.\n\n\
    ## 6.1    JSON Syntax\n\nJSON syntax is like JavaScript object syntax (see [Section 5.2](#05_002.html_h5.2)),\
    \ where you have an object inside of <samp class=\"listingcharacter\">{}</samp>\
    \ that contains <samp class=\"listingcharacter\">name:value</samp> pairs. Commas\
    \ are used to separate data and names (or keys) must be written as strings within\
    \ <samp class=\"listingcharacter\">\"\"</samp>, unlike JavaScript objects that\
    \ can be written within single quotes. [Listing 6.1](#06_001.html_l6.1) shows\
    \ our car example from the previous section written with JSON syntax.\n\n```\n\
    {\n  \"make\": \"Mercedes\",\n  \"model\": \"A Class AMG\",\n  \"colour\": \"\
    Black\"\n} \n```\n\n**Listing 6.1**     JSON Object\n\nThat object itself can\
    \ also be a value of a <samp class=\"listingcharacter\">name:value</samp> pair,\
    \ with <samp class=\"listingcharacter\">myCar</samp> as the name and the car object\
    \ as its value, as shown in [Listing 6.2](#06_001.html_l6.2).\n\n```\n{\n  \"\
    myCar\": {\n    \"make\": \"Mercedes\",\n    \"model\": \"A Class AMG\",\n   \
    \ \"colour\": \"Black\"\n  }\n} \n```\n\n**Listing 6.2**     JSON name:value Pair\
    \ with Object\n\nYou can also have multiple objects within an array, as we see\
    \ in [Listing 6.3](#06_001.html_l6.3) (in this case, our <samp class=\"listingcharacter\"\
    >Mercedes</samp>, <samp class=\"listingcharacter\">BMW</samp>, and <samp class=\"\
    listingcharacter\">Audi</samp> example), which is a common format you will receive\
    \ when working with SAP OData services. When you call an SAP OData service, you\
    \ will likely receive a JSON format response with a list of items in an array,\
    \ like a list of purchase orders.\n\n```\n{\n  \"myCars\": [\n    {\n      \"\
    make\": \"Mercedes\",\n      \"model\": \"A Class AMG\",\n      \"colour\": \"\
    Black\"\n    },\n    {\n      \"Make\": \"BMW\",\n      \"model\": \"M Series\"\
    ,\n      \"colour\": \"White\"\n    },\n    {\n      \"make\": \"Audi\",\n   \
    \   \"model\": \"S4\",\n      \"colour\": \"Blue\"\n    }\n  ]\n} \n```\n\n**Listing\
    \ 6.3**     JSON Object Array\n\n## 6.2    JSON Methods\n\nNote that even though\
    \ JSON data and JavaScript objects are similar, you will need to convert the JSON\
    \ data to work with it in your application. To do that, you will need to parse\
    \ (change) the JSON string from your request into a JavaScript object using the\
    \ standard JavaScript method <samp class=\"listingcharacter\">JSON.parse()</samp>.\n\
    \n[Listing 6.4](#06_002.html_l6.4) shows some JSON data being parsed and assigned\
    \ to the <samp class=\"listingcharacter\">object</samp> variable. The <samp class=\"\
    listingcharacter\">object</samp> variable contains the parsed JSON data, which\
    \ is now type <samp class=\"listingcharacter\">object</samp>, that we can now\
    \ work with in our code.\n\n```\nvar object = JSON.parse(\n  '{ \"make\": \"Mercedes\"\
    , \"model\": \"A Class AMG\", \"colour\": \"Black\", \"trimOptions\": [\"Leather\"\
    , \"Cloth\", \"Alcantara\"]}'\n);\nconsole.log(object);\nconsole.log(typeof object);\
    \ // object\nconsole.log(object.make); // Mercedes\nconsole.log(object.trimOptions[2]);\
    \ // Alcantara \n```\n\n**Listing 6.4**     JSON.parse()\n\nTo access the JSON\
    \ data you have just parsed, use the same syntax for JavaScript objects from [Section 5.2](#05_002.html_h5.2).\
    \ In [Listing 6.4](#06_002.html_l6.4), the output of <samp class=\"listingcharacter\"\
    >make</samp> and <samp class=\"listingcharacter\">trimOptions[2]</samp> will be\
    \ <samp class=\"listingcharacter\">Mercedes</samp> and <samp class=\"listingcharacter\"\
    >Alcantara,</samp> respectively.\n\nOnce finished reading and manipulating our\
    \ JSON data, we must convert it back to JSON before sending it to a server. This\
    \ is done using a method called <samp class=\"listingcharacter\">JSON.stringify()</samp>.\
    \ In [Listing 6.5](#06_002.html_l6.5), we pass the <samp class=\"listingcharacter\"\
    >jsObject</samp> variable into the <samp class=\"listingcharacter\">JSON.Stringify()</samp>\
    \ method and log the converted JSON string to the console. Notice we logged the\
    \ <samp class=\"listingcharacter\">jsObject</samp> variable type before and after\
    \ it was converted to JSON format to show how it is converted from a JavaScript\
    \ object back to JSON format, which is type <samp class=\"listingcharacter\">string</samp>.\n\
    \n```\nlet jsObject = {\n  make: \"Mercedes\",\n  model: \"A Class AMG\",\n  colour:\
    \ \"Black\",\n  trimOptions: [\"Leather\", \"Cloth\", \"Alcantara\"],\n};\nconsole.log(typeof\
    \ jsObject); // object\nconsole.log(JSON.stringify(jsObject));\nconsole.log(typeof\
    \ JSON.stringify(jsObject)); // string \n```\n\n**Listing 6.5**     JSON.stringify()\n\
    \n## 6.3    OData and SAPUI5\n\nSAPUI5 and OData are beyond the scope of this\
    \ E-Bite, but if you are an ABAP professional who is moving into JavaScript, you\
    \ will almost certainly encounter SAPUI5 and OData. It is important to know that\
    \ SAPUI5 makes use of JSON data in a variety of ways and can load JSON data from\
    \ either within the app (like test data) or from an outside source like SAP Gateway.\n\
    \nIf you were, for example, creating test data for your application, you would\
    \ store it in a file like test_data.json. This file would contain JSON-formatted\
    \ data like that shown in [Listing 6.4](#06_002.html_l6.4), and you would load\
    \ that JSON data into your application using an SAPUI5 framework method like this:\n\
    \n```\noModel.loadData(\"test_data.json\") \n```\n\nThat will trigger a <samp\
    \ class=\"listingcharacter\">GET</samp> request, which will pull the data from\
    \ that file and store it in the SAPUI5 model to be used in your application. We\
    \ will cover this general type of data request in more detail in [Section 11](#11_001.html_h11)\
    \ and [Section 12.7](#12_007.html_h12.7).\n\nIf you were using an SAP Gateway\
    \ OData service, you would create an OData model with syntax that looks like this:\n\
    \n```\nvar oModel = new ODataModel(\"http://url.com/sap/opu/odata/IWBEP/GWSAMPLE_BASIC/?$format=json\"\
    ); \n```\n\nThis would create an SAPUI5 OData model that you would use to pass\
    \ data back and forth to your SAP system and display in your SAPUI5 views.\n\n\
    For now, just be aware that JSON is a data format you will often work with in\
    \ JavaScript applications when requesting data from an outside source.\n\n# 7    The\
    \ Document Object Model (DOM)\n\nThe DOM is a treelike structure that represents\
    \ the HTML elements on a webpage. The DOM is created by the browser when a webpage\
    \ loads, allowing you to access all the HTML elements dynamically, including their\
    \ Cascading Style Sheets (CSS) properties. The DOM is important because you will\
    \ use it in conjunction with JavaScript to manipulate those HTML elements and\
    \ to create dynamic webpages.\n\nIn this section, we’ll see how JavaScript interacts\
    \ with the DOM through a practical example, and then learn how to traverse the\
    \ DOM, use selector methods, and manipulate DOM elements.\n\n## 7.1    DOM Example\n\
    \nRun the example shown previously in [Section 1.4](#01_004.html_h1.4), [Listing 1.3](#01_004.html_l1.3)\
    \ and [Listing 1.4](#01_004.html_l1.4), and once you have your HTML page loaded\
    \ in the browser, right-click Some old text, and in the context menu, click Inspect.\
    \ You should see the Chrome DevTools window and, under the Elements tab, you should\
    \ see your HTML element highlighted as shown in [Figure 7.1](#07_001.html_f7.1)."
