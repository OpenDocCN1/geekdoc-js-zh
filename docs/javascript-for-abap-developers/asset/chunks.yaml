  trans: "\nJavaScript 对象表示 (JSON) 是一种开放标准文件格式，与 JavaScript 对象不同，尽管它们看起来可能相似。JSON\
    \ 的目的是允许在两个端点（例如服务器和您的应用程序）之间以简单文本的形式传输数据，JavaScript 以及包括 ABAP 在内的多数编程语言都可以读取和解析这些数据。JavaScript\
    \ 提供了方法将 JSON 数据转换为 JavaScript 对象，以及将 JavaScript 对象转换为 JSON 数据发送到服务器。\n\n将名为 Northwind\
    \ 的广泛使用的 OData 测试服务 ([`s-prs.co/v535906`](http://s-prs.co/v535906)) 复制并粘贴到您的浏览器中，你应该能在浏览器窗口中看到返回的\
    \ JSON 格式响应，如 图 6.1 所示。\n\n![JSON Response](img/img-f6.1.html)\n\n**图 6.1** JSON\
    \ 响应\n\n在接下来的章节中，我们将介绍 JSON 语法和方法，并讨论它如何与 OData 和 SAPUI5 一工作。\n\n## 6.1  JSON\
    \ 语法\n\nJSON 语法类似于 JavaScript 对象语法（参见章节 5.2），其中你在 `{}` 内部有一个包含 `name:value` 键对的对象。逗号用于分隔数据，且名称（或键）必须作为字符串写在\
    \ `\"\"` 中，而 JavaScript 对象可以写在单引号内。列表 6.1 显示了我们在上一节中用 JSON 语法编写的汽车示例。\n\n```json\n\
    {\n  \"make\": \"Mercedes\",\n  \"model\": \"A Class AMG\",\n  \"colour\": \"\
    Black\"\n} \n```\n\n**列表 6.1**  JSON 对象\n\n该对象本身也可以作为 `name:value` 键对的值，以 `myCar`\
    \ 为名称，汽车对象为值，如列表 6.2 所示。\n\n```json\n{\n  \"myCar\": {\n    \"make\": \"Mercedes\"\
    ,\n    \"model\": \"A Class AMG\",\n    \"colour\": \"Black\"\n  }\n} \n```\n\n\
    **列表 6.2** 带有对象的 JSON 名称:值对\n\n你也可以在数组中拥有多个对象，正如我们在列表 6.3 中所示（在这种情况下，是我们的 `Mercedes`、`BMW`\
    \ 和 `Audi` 示例），这是你在与 SAP OData 服务工作时经常收到的格式。当你调用 SAP OData 服务时，你可能会收到一个包含数组项列表的\
    \ JSON 格式响应，例如订单列表。\n\n```json\n{\n  \"myCars\": [\n    {\n      \"make\": \"\
    Mercedes\",\n      \"model\": \"A Class AMG\",\n      \"colour\": \"Black\"\n\
    \    },\n    {\n      \"Make\": \"BMW\",\n      \"model\": \"M Series\",\n   \
    \   \"colour\": \"White\"\n    },\n    {\n      \"make\": \"Audi\",\n      \"\
    model\": \"S4\",\n      \"colour\": \"Blue\"\n    }\n  ]\n} \n```\n\n**列表 6.3**\
    \  JSON 对象数组\n\n## 6.2  JSON 方法\n\n注意，尽管 JSON 数据和 JavaScript 对象相似，但你仍然需要将 JSON\
    \ 数据转换以便在应用程序中使用它。要做到这一点，你需要使用标准的 JavaScript 方法 `JSON.parse()` 将来自请求的 JSON 字符串解析（更改）为\
    \ JavaScript 对象。\n\n列表 6.4 显示了某些 JSON 数据被解析并赋值给 `object` 变量。`object` 变量包含解析后的\
    \ JSON 数据，其现在的类型为 `object`，我们现在可以在代码中使用它了。\n\n```javascript\nvar object = JSON.parse(\n\
    \  '{ \"make\": \"Mercedes\", \"model\": \"A Class AMG\", \"colour\": \"Black\"\
    , \"trimOptions\": [\"Leather\", \"Cloth\", \"Alcantara\"]}'\n);\nconsole.log(object);\n\
    console.log(typeof object); // object\nconsole.log(object.make); // Mercedes\n\
    console.log(object.trimOptions[2]); // Alcantara \n```\n\n**列表 6.4**  JSON.parse()\n\
    \n要访问刚刚解析的 JSON 数据，请使用与章节 5.2 中相同的 JavaScript 对象语法。在列表 6.4 中，`make` 和 `trimOptions[2]`\
    \ 的输出将分别是 `Mercedes` 和 `Alcantara`。\n\n一旦完成读取和操作我们的 JSON 数据，必须在将其发送到服务器之前转换回 JSON。这是通过使用名为\
    \ `JSON.stringify()` 方法完成的。在列表 6.5 中，我们将 `jsObject` 变量传递给 `JSON.stringify()` 方法并将后的\
    \ JSON 字符串打印到控制台。注意，我们在转换为 JSON 格式之前之后都打印了 `jsObject` 变量类型，以显示它是如何从 JavaScript\
    \ 对象转换回 JSON 格式（类型为 `string`）的。\n\n```javascript\nlet jsObject = {\n  make: \"\
    Mercedes\",\n  model: \"A Class AMG\",\n  colour: \"Black\",\n  trimOptions: [\"\
    Leather\", \"Cloth\", \"Alcantara\"],\n};\nconsole.log(typeof jsObject); // object\n\
    console.log(JSON.stringify(jsObject));\nconsole.log(typeof JSON.stringify(jsObject));\
    \ // string \n```\n\n**列表 6.5**  JSON.stringify()\n\n## 6.3  OData 和 SAPUI5\n\n\
    SAPUI5 和 OData 超出了本 E-Bite 的范围，但如果你是一个正在转向 JavaScript 的 ABAP 专业人员，你几乎肯定会遇到 SAPUI5\
    \ 和 OData。重要的是，SAPUI5 以多种方式使用 JSON 数据，并可以从应用内部（如测试数据）或外部源（如 SAP Gateway）加载 JSON\
    \ 数据。\n\n例如，如果你正在为应用程序创建测试数据，将其存储在像 `test_data.json` 的文件中。该文件将包含如列表 6.4 所示的 JSON\
    \ 格式数据，你可以使用 SAPUI5 框架方法将该 JSON 数据加载到应用程序中：\n\n```javascript\noModel.loadData(\"\
    test_data.json\")\n```\n\n这将触发一个 `GET` 请求，该请求将从文件中提取数据并将其存储在 SAPUI5 模型中。我们将在章节\
    \ 11 和章节 12.7 中更详细地介绍这类请求。\n\n如果你正在使用 SAP Gateway OData 服务，你将创建一个语法所示的 OData 模型：\n\
    \n```javascript\nvar oModel = new ODataModel(\"http://url.com/sap/opu/odata/GWSAMPLE_BASIC/?$format=json\"\
    );\n```\n\n这将创建一个 SAPUI5 OData 模型，你可以用它在你的 SAP 系统之间传输数据，并在 SAPUI5 视图中显示。\n\n目前，只需意识到\
    \ JSON 是你从外部源请求数据时经常处理的数据格式即可。\n\n# 7  文档对象模型 (DOM)\n\nDOM 是一种表示网页上 HTML 元素的树形结构。DOM\
    \ 是浏览器加载网页时创建的，允许你动态访问所有 HTML 元素，包括它们的层叠样式表（CSS）属性。DOM 非常重要，因为你将结合 JavaScript\
    \ 使用来操作这些 HTML 元素并创建动态网页。\n\n在本节中，我们将通过一个实际示例查看 JavaScript 如何与 DOM 交互，然后学习如何遍历\
    \ DOM、使用选择器方法以及操作 DOM 元素。\n\n## 7.1  DOM 示例\n\n运行之前在章节 1.4、列表 1.3 和列表 1.4 中所示的示例，一旦在浏览器中加载了\
    \ HTML 页面，右键点击“Some old text”，并在上下文菜单中点击“检查”。你应该看到 Chrome 开发者工具窗口，并在“元素”选项卡下，看到你的\
    \ HTML 元素被高亮，如图 7.1 所示。\n\n"
- fmt: "\n[![Basic HTML Webpage](bilderklein/klein07_001.png)](img-f7.1.html)\n\n\
    **Figure 7.1** Basic HTML Webpage\n\nKeep the Chrome DevTools window open and\
    \ click the Try it button, and watch the text change in the Elements tab for that\
    \ HTML element. This is a live view of your JavaScript code dynamically changing\
    \ an HTML element using the DOM. You can manipulate the DOM directly from within\
    \ the Elements tab by double-clicking that same text (between the `<p></p>` tags),\
    \ changing it, and pressing [Enter]. You should see the text on the webpage change\
    \ to whatever you typed.\n\nIn our example, we interacted with an HTML element\
    \ by selecting that element from the DOM and changing its value using this line\
    \ of code:\n\n```javascript\ndocument.getElementById(\"test\").innerHTML = \"\
    Some new text appeared!\"; \n```\n\nLet’s break down this statement and look at\
    \ what each part does:\n\n* `document`\n    This is the “D” in DOM and is the\
    \ global (root) document object that contains all the HTML elements.\n\n* `.getElementById(\"\
    test\")`\n    This is the JavaScript method used to select the element in the\
    \ DOM, which is the `<p>` tag containing `\"Some old text\"` with the `id` attribute\
    \ `test`.\n\n* `.innerHTML = \"Some new text appeared!\"`\n    This is the HTML\
    \ property that sets the content of the HTML element (the bit between the `<p></p>`\
    \ tags) to `\"Some new text appeared!\"`.\n\n## 7.2 Traversing the DOM\n\nThe\
    \ DOM itself is just an object represented as an interconnected tree of nodes\
    \ (HTML elements). You have a window object which represents the Browser tab,\
    \ under which sits the document object node, which can be considered the root\
    \ node of the actual webpage, with all your other nodes (HTML elements) sitting\
    \ somewhere underneath it. If you look at the Elements tab in the Chrome DevTools\
    \ window, you will see the node structure of our HTML page, as shown in [Figure\
    \ 7.2](#07_002.html_f7.2).\n\n[![DOM Node Structure](bilderklein/klein07_002.png)](img-f7.2.html)\n\
    \n**Figure 7.2** DOM Node Structure\n\nIf you had to follow the full path to the\
    \ `<p>` tag containing our dynamic text, it would look roughly like this: Browser\
    \ • document • `<body>` • `<div id=\"text-div\">` • `<p id =\"test\">`.\n\nYou\
    \ can navigate around the DOM tree in Chrome DevTools by clicking the small arrows\
    \ next to a node, which will open the next-level node(s) underneath it until you\
    \ reach the lowest-level node.\n\nWhen you traverse the DOM, you are navigating\
    \ to whichever HTML element you are interested in so that you can read or manipulate\
    \ it.\n\n## 7.3 Selector Methods\n\nIn our previous example, we used the DOM method\
    \ `document.getElementById(\"test\")` to select an HTML element from the DOM based\
    \ on its `id` attribute, which in this case was `test`. This is one of the JavaScript\
    \ methods available as part of the Selectors API, which is part of the web APIs\
    \ (more on this in [Section 13](#13_001.html_h13)). You have other methods you\
    \ can use. One of the more popular ones is as follows:\n\n```javascript\ndocument.querySelector(\"\
    #test\") \n```\n\nThis method finds the same `<p>` element with `\"#test\"` referring\
    \ to the `id` value `test`. Run this same method to find more than one element\
    \ matching that `id` as follows:\n\n```javascript\ndocument.querySelectorAll(\"\
    #test\") \n```\n\nThis method will return a list of all the elements that have\
    \ the `id` of `test`.\n\nYou can also use Chrome DevTools to find the selector\
    \ in the Elements tab by right-clicking an element and selecting Copy • Copy Selector,\
    \ which you can then paste into your JavaScript selector method, as shown in [Figure\
    \ 7.3](#07_003.html_f7.3).\n\n[![Chrome Copy Selector](bilderklein/klein07_003.png)](img-f7.3.html)\n\
    \n**Figure 7.3** Chrome Copy Selector\n\n## 7.4 DOM Manipulation\n\nYou can use\
    \ the DOM to change many different things on a webpage, from HTML element content\
    \ text to element properties including CSS, even adding entirely new DOM elements.\
    \ In our previous example, we changed the `innerHTML`, which is the content of\
    \ the element, i.e., the text between the `<p></p>` tags. In [Listing 7.1](#07_004.html_l7.1),\
    \ we adjust the CSS of the text when it changes after the button click event using\
    \ the `style` property after the new text is added.\n\n```javascript\nfunction\
    \ changeSomeText() {\n  document.getElementById(\"test\").innerHTML = \"Some new\
    \ text appeared!\";\n  document.getElementById(\"test\").style.cssText =\n   \
    \ \"fontWeight: bold; background-color: Chartreuse\";\n} \n```\n\n**Listing 7.1**\
    \ DOM Manipulation: CSS\n\nWe can take DOM manipulation even further than just\
    \ changing text or CSS properties and add completely new elements to the DOM.\
    \ In [Listing 7.2](#07_004.html_l7.2), we create a function that adds a new `<p>`\
    \ tag to the `div` with an `id` of `text-div`.\n\n```javascript\nfunction addSomeText()\
    \ {\n  const div = document.getElementById(\"text-div\");\n  const newText = document.createElement(\"\
    p\");\n  newText.textContent = \"Some brand new text here!\";\n  div.appendChild(newText);\n\
    } \n```\n\n**Listing 7.2** Adding New Element to the DOM\n\nIn this example, we\
    \ first create a variable that holds our `div` where we want to place the new\
    \ `<p>` tag. We then call the method `.createElement(\"p\")`, which creates a\
    \ new `<p>` element, and assign it to the variable `newText`. We add some text\
    \ to the newly created `<p>` element using `.textContent` and call `.appendChild`\
    \ on our `div` variable to append the element as a child node.\n\nThis works both\
    \ ways; you can follow similar logic to remove DOM elements as well. The function\
    \ in [Listing 7.3](#07_004.html_l7.3) removes the `<p>` element with an `id` of\
    \ `test` from the DOM.\n\n```javascript\nfunction removeSomeText() {\n  const\
    \ text = document.querySelector(\"#test\");\n  text.remove();\n} \n```\n\n**Listing\
    \ 7.3** Removing an Element from the DOM\n\n# 8   HTML Events\n"
