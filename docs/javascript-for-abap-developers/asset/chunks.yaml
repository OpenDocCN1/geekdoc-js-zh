    \ \"scope\" wrapper\nconst flexiSumCalculator = (param1) => {\n  let valueToAdd\
    \ = param1; // our new \"private\" variable\n  // Function that returns the calculation\n\
    \  return (caluclator = (param2) => {\n    return (param2 += valueToAdd);\n  });\n\
    };\nconst flexiSumCalculator5 = flexiSumCalculator(5); /* \nInvoking the new version\
    \ with param2 */\nconsole.log(flexiSumCalculator5(1)); // 6\nconsole.log(flexiSumCalculator5(2));\
    \ // 7\nconsole.log(flexiSumCalculator5(3)); // 8 \n```\n\n**Listing 4.5**    \
    \ JavaScript Closures\n\nSo, when you create a version or instance of the calculator,\
    \ you use <samp class=\"listingcharacter\">param1</samp> to determine what the\
    \ private variable will be. When you call this new function variable, you pass\
    \ in a parameter, which is <samp class=\"listingcharacter\">param2</samp>. The\
    \ function variable can now be reused safely so when you run the above code, you\
    \ get <samp class=\"listingcharacter programmingelement\">6</samp>, <samp class=\"\
    listingcharacter programmingelement\">7</samp>, and <samp class=\"listingcharacter\
    \ programmingelement\">8</samp> logged to the console using the same function\
    \ variable <samp class=\"listingcharacter\">flexiSumCalculator5()</samp>.\n\n\
    # 5    Data Structures\n\nIn ABAP, we have the internal table and work areas that\
    \ we use to read and manipulate data from our database tables before committing\
    \ those changes to the database. In JavaScript, we have two key data structures\
    \ that take the place of the ABAP internal table and work area: arrays and objects.\
    \ There are many other data structures in JavaScript, but arrays, objects, and\
    \ a combination of the two are the best starting point. These two data types are\
    \ mutable (i.e., they can be changed), and so they have a set of standard JavaScript\
    \ methods you can use to read and manipulate them. We’ll discuss both in the following\
    \ sections.\n\n## 5.1    Arrays and Array Methods\n\nJavaScript arrays are like\
    \ internal tables in ABAP and are designed to let you hold a table or list of\
    \ values accessible through a single variable. The arrays themselves are defined\
    \ by <samp class=\"listingcharacter\">[…]</samp>, which contain a comma-separated\
    \ list of items. In [Listing 5.1](#05_001.html_l5.1), we declare two arrays as\
    \ variables, <samp class=\"listingcharacter\">petArray</samp> and <samp class=\"\
    listingcharacter\">numberArray</samp>, respectively.\n\n```\nlet petArray = [\"\
    Dog\", \"Cat\", \"Bird\", \"Fish\", \"Reptile\"];\nlet numberArray = [1, 32, 63,\
    \ 4, 75, 76, 347, 84];\nconsole.log(petArray); // [ 'Dog', 'Cat', 'Bird', 'Fish',\
    \ 'Reptile' ]\nconsole.log(numberArray); // [ 1, 32, 63, 4, 75, 76, 347, 84 ]\
    \ \n```\n\n**Listing 5.1**     Simple Array Declaration\n\nAs in ABAP, each item\
    \ in a JavaScript array has an assigned index (starting at 0) that you can use\
    \ to access that value (i.e., read the array) using square bracket notation (<samp\
    \ class=\"listingcharacter\">[0]</samp>). In [Listing 5.2](#05_001.html_l5.2),\
    \ we log a certain array value at a particular index (<samp class=\"listingcharacter\"\
    >[0]</samp>and <samp class=\"listingcharacter\">[1]</samp>, respectively) to the\
    \ console from each of our arrays.\n\n```\nlet petArray = [\"Dog\", \"Cat\", \"\
    Bird\", \"Fish\", \"Reptile\"];\nlet numberArray = [1, 32, 63, 4, 75, 76, 347,\
    \ 84];\nconsole.log(petArray[0]); // Dog\nconsole.log(numberArray[1]); // 32 \n\
    ```\n\n**Listing 5.2**     Find Values of an Array by Index\n\nThere are also\
    \ a set of standard JavaScript methods that allow you to access and manipulate\
    \ your arrays. Some of these methods accept parameters, while others also let\
    \ you apply function logic and pass data like a value or a Boolean. There are\
    \ many methods to choose from, so we will focus on a select few to give you an\
    \ idea of how they work.\n\nLet’s start off with sorting our array. In [Listing 5.3](#05_001.html_l5.3),\
    \ we sort our <samp class=\"listingcharacter\">petArray</samp> string values in\
    \ alphabetical order using the <samp class=\"listingcharacter\">sort()</samp>\
    \ method, then call the <samp class=\"listingcharacter\">reverse()</samp> method\
    \ to reverse the order.\n\n```\nlet petArray = [\"Dog\", \"Cat\", \"Bird\", \"\
    Fish\", \"Reptile\"];\npetArray.sort();\nconsole.log(petArray);  // [ 'Bird',\
    \ 'Cat', 'Dog', 'Fish', 'Reptile' ]\npetArray.reverse();\nconsole.log(petArray);\
    \  // [ 'Reptile', 'Fish', 'Dog', 'Cat', 'Bird' ] \n```\n\n**Listing 5.3**    \
    \ Arrays: Alphabetical Sort\n\nSorting numerically, on the other hand, is a more\
    \ complex and uses the <samp class=\"listingcharacter\">sort()</samp> method’s\
    \ optional parameters and built-in sorting algorithm, as we see in [Listing 5.4](#05_001.html_l5.4).\n\
    \n```\nlet numberArray = [1, 32, 63, 4, 75, 76, 347, 84];\nnumberArray.sort((a,\
    \ b) => a - b); // Sort ascending\nconsole.log(numberArray); // [1, 4, 32,  63,\
    \ 75, 76, 84, 347]\nnumberArray.sort((a, b) => b - a); // Sort descending\nconsole.log(numberArray);\
    \ // [ 347, 84, 76, 75, 63, 32, 4, 1] \n```\n\n**Listing 5.4**     Arrays: Numeric\
    \ Sort\n\nWe are calling the same <samp class=\"listingcharacter\">sort()</samp>\
    \ method from [Listing 5.3](#05_001.html_l5.3), except we’re sorting numbers this\
    \ time, and for that, we need to use the built-in sorting algorithm, which takes\
    \ two optional parameters (<samp class=\"listingcharacter\">a</samp> = current\
    \ value and <samp class=\"listingcharacter\">b</samp> = next value in the array).\
    \ The algorithm then iterates through the array values and calculates <samp class=\"\
    listingcharacter\">a – b</samp>. If the output is negative, it means <samp class=\"\
    listingcharacter\">b</samp> is greater than <samp class=\"listingcharacter\">a</samp>\
    \ and needs to stay in its current position, as the order is ascending. If the\
    \ output is positive, it means <samp class=\"listingcharacter\">b</samp> is smaller\
    \ than <samp class=\"listingcharacter\">a</samp> and therefore <samp class=\"\
    listingcharacter\">b</samp> needs to shift in front of <samp class=\"listingcharacter\"\
    >a</samp>. This logic continues through the whole array until the correct ascending\
    \ order is set. If you want the numbers to be in descending order, switch the\
    \ logic around and instead run <samp class=\"listingcharacter\">b – a</samp>."
