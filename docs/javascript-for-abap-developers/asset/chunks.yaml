    \ if the comparison is not <samp class=\"listingcharacter\">true</samp>, it evaluates\
    \ to <samp class=\"listingcharacter\">true</samp>.\n\n```\nlet a = 10;\nlet b\
    \ = 20;\nconsole.log(a === 10 && b === 20);  // true\nconsole.log(a === 20 &&\
    \ b === 10);  // false\nconsole.log(a === 10 && b === 11);  // false\nconsole.log(a\
    \ === 10 || b === 20);  // true\nconsole.log(a === 10 || b === 21);  // true\n\
    console.log(!(a === b));            // true \n```\n\n**Listing 3.9**     Logical\
    \ Operators\n\n## 3.5    Conditional Operators\n\nAs in ABAP, you have the traditional\
