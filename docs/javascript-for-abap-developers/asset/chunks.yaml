  trans: "\n我们运行代码，本应该看到控制台输出 `\"Mercedes\"`，但实际上看到的控制台输出的是 `undefined`。我们在变量赋值处设置了一个断点，并从那里开始逐步执行代码。就像在\
    \ ABAP 调试器一样，你可以通过点击代码编辑器左侧列来放置断点，我们在赋值 `newCar` 变量的一行执行了同样的操作。现在我们可以在图 14.6 中看到一个红点，就像\
    \ ABAP 调试器一样。\n\n![VS Code Breakpoint](img/img-f14.6.html)\n\n**图 14.6** VS Code\
    \ 断点\n\n断点设置完成后，点击 VS Code 窗口左侧的“运行和调试”按钮 `[Ctrl]` + `[Shift]` + `[D]`。进入调试窗口后，点击“运行和调试”按钮并在下拉菜单中选择\
    \ `Node.js` 作为环境。这将运行我们的代码并停在我们设置的断点处。在 VS Code 调试窗口中，我们可以看到与 Chrome DevTools\
    \ 类似的区域。在图 14.7 中，左侧有 `VARIABLES`（变量）、`CALL STACK`（调用栈）和 `BREAKPOINTS`（断点）区域，右侧是代码和\
    \ `DEBUG CONSOLE`（调试控制台）。\n\n![VS Code Debugger](img/img-f14.7.html)\n\n**图 14.7**\
    \ VS Code 调试器\n\n我们通过点击一次单步执行 `[F10]`按钮来逐步执行变量赋值。在 `DEBUG CONSOLE` 的底部，我们输入 `newCar.make`\
    \ 并看到输出 `Mercedes`，如图 14.8 所示。\n\n![VS Code Debug Console: Variable Test](img/img-f14.8.html)\n\
    \n**图 14.8** VS Code 调试控制台：变量测试\n\n这意味着我们的对象实例化是正确的，所以问题一定出在我们的 `console.log()`\
    \ 语句中。如果我们仔细观察，会发现我们将属性拼写成了 `.maek`。点击继续 `[F5]` 并修正错误，以完成剩余的代码执行。\n\n这只是使用像 VS\
    \ Code 自带的调试器可以可以的操作的一小部分，就像 ABAP 调试器一样，它将成为你离不开的工具。\n\n## 14.3 错误处理\n\n在 JavaScript\
    \ 中，你可以遇到许多意外之外的错误，尽管你有一些很棒工具来调试代码，但实现正确的错误处理也同样重要。与所有编程语言一样，正确的错误处理是构建稳定健壮应用程序的关键。\n\
    \n如果你预知会遇到哪些错误，ABAP 中的某些场景可以通过简单的 `IF` 语句处理。然而，在某些情况下，你需要使用 `TRY CATCH` 块来保险。为了让你了解\
    \ JavaScript 中的错误处理，我们复制了一个 ABAP `TRY CATCH` 块，并在捕获到错误时将响应记录到控制台。\n\n在列表 14.5\
    \ 中，我们将之前在列表 14.4 中显示的修正变量赋值封装在 `try…catch` 语句中：\n\n```\ntry {\n  let newCar =\
    \ new car(\"Mercedes\");\n  console.log(`${newCar.make}`);\n} catch {\n  console.log(\"\
    Something went wrong\");\n} \n```\n\n**列表 14.5** fix-me.js: try…catch\n\n我们运行代码，看到控制台输出了\
    \ `Mercedes`。然后我们通过向控制台输出汽车对象名称（带有拼写错误）来中断代码，如下所示：\n\n```\nconsole.log(`${newaCr.make}`);\
    \ \n```\n\n我们再次运行程序，看到 `catch` 语句中的文本 `Something went wrong` 记录在控制台上，因为不存在一个名为\
    \ `newaCr` 的对象。\n\n到此，我们结束了对 JavaScript 调试和错误处理的讨论。你现在准备好开始编写 JavaScript 代码了！\n\
    \n# 15 接下来做什么？\n\n你已经掌握了 JavaScript 编程基础——现在继续使用 SAP 进行编码吧！学习 SAPUI5 用户界面，探索云原生应用开发，或者扩展你的\
    \ ABAP 视野并通过整洁代码技巧完善你的代码。看看 SAP PRESS 编程能带你走向何方！\n\n![](img/klein1900.png)\n\n\
    ### 编辑推荐\n\n设计、增强和再设计……（注：提示中提供的文本存在重复/碎片化，此处保持了核心结构）。\n\n"
