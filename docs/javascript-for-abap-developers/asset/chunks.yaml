- fmt: "\nTo run JavaScript on your webpage, it needs to be embedded using `<script>`\
    \ tags. These `<script>` tags can hold actual JavaScript code like a simple function:\n\
    \n```\n<script>function changeSomeText() {alert(\"Hi there!\"}</script> \n```\n\
    \nYou can also reference an external JavaScript file (e.g., `app.js`) that would\
    \ hold all your JavaScript logic, which is a best practice, as follows:\n\n```\n\
    <script src=\"app.js\"></script> \n```\n\nThese `<script>` tags can be placed\
    \ within the `<head>` or `<body>` tags of your HTML page.\n\nIn our first example,\
    \ we are going to add a JavaScript function directly in the `<head>` tag of an\
    \ HTML file. We are then going to trigger a standard HTML event `onclick()` (i.e.,\
    \ a button-click event) to run this function when we click the Try it button.\n\
    \nTo begin, create a new folder, add a file called `index.html`, and copy the\
    \ code snippet shown in [Listing 1.1](#01_004.html_l1.1) into it.\n\n```\n<!DOCTYPE\
    \ html>\n<html\n<head>\n    <script>\n        function changeSomeText() {\n  \
    \          document.getElementById(\"test\").innerHTML = \"Some new text appeared!\"\
    ;\n        }\n    </script>\n</head>\n<body>\n    <div id=\"text-div\">\n    \
    \    <h1>A normal everyday webpage</h1>\n        <p id=\"test\">Some old text.</p>\n\
    \    </div>\n    <div id=\"button-div\">\n        <button type=\"button\" onclick=\"\
    changeSomeText()\">Try it</button>\n    </div>\n</body>\n</</html> \n```\n\n**Listing\
    \ 1.1**     JavaScript Function in the `<head>` Tag\n\nSave your file and run\
    \ your code, and you should see your HTML webpage displayed. Click the Try it\
    \ button and, if all goes well, the text should change to Some new text appeared!\
    \ as shown in [Figure 1.2](#01_004.html_f1.2). You have just created your first\
    \ JavaScript function and triggered it from a standard HTML event.\n\nNow, we\
    \ are going to remove the `<script>` tag (containing our JavaScript code) from\
    \ our `<head>` section and position it just before the closing `</body>` tag of\
    \ our HTML page, after our button. Refresh your HTML page and click the Try it\
    \ button again. You should see the same text change as in [Listing 1.2](#01_004.html_l1.2).\n\
    \n[![JavaScript Function in the `<head>` Tag](bilderklein/klein01_002.png)](img-f1.2.html)\n\
    \n**Figure 1.2**     JavaScript Function in the `<head>` Tag\n\n```\n<!DOCTYPE\
    \ html>\n<html\n<body>\n    <div id=\"text-div\">\n        <h1>A normal everyday\
    \ webpage</h1>\n        <p id=\"test\">Some old text.</p>\n    </div>\n    <div\
    \ id=\"button-div\">\n        <button type=\"button\" onclick=\"changeSomeText()\"\
    >Try it</button>\n    </div>\n    <script>\n        function changeSomeText()\
    \ {\n            document.getElementById(\"test\").innerHTML = \"Some new text\
    \ appeared!\";\n        }\n    </script>\n</body>\n</</html> \n```\n\n**Listing\
    \ 1.2**     JavaScript Function in the `<body>` Tag\n\nThe main difference between\
    \ adding your script tags in the `<body>` versus the `<head>` section is that\
    \ you improve page display speed; i.e., page elements load faster if the `<script>`\
    \ tag is at the bottom of the `<body>` section, letting your page elements load\
    \ first, followed by your `<script>` tags, which can take longer to interpret.\n\
    \nNow, we are going to remove all our JavaScript from the HTML page and place\
    \ it in an external file called `app.js`. The benefits of doing so include readability,\
    \ maintainability, and reusability. You can reference the same JavaScript code\
    \ from any HTML page and only need to write the code once, following the don’t\
    \ repeat yourself (DRY) best practice.\n\nCreate a new folder and create the two\
    \ files shown in [Listing 1.3](#01_004.html_l1.3) and [Listing 1.4](#01_004.html_l1.4)\
    \ inside it, adding the relevant code to each one.\n\n```\n<!DOCTYPE html>\n<html\n\
    <head>\n    <script src=\"app.js\"></script>\n</head>\n<body>\n    <div id=\"\
    text-div\">\n        <h1>A normal everyday webpage</h1>\n        <p id=\"test\"\
    >Some old text.</p>\n    </div>\n    <div id=\"button-div\">\n        <button\
    \ type=\"button\" onclick=\"changeSomeText()\">Try it</button>\n    </div>\n</body>\n\
    </</html> \n```\n\n**Listing 1.3**     index.html (Referencing External JavaScript\
    \ File)\n\n```\nfunction changeSomeText() {\n  document.getElementById(\"test\"\
    ).innerHTML = \"Some new text appeared!\";\n} \n```\n\n**Listing 1.4**     app.js\
    \ (External JavaScript File)\n\nNotice we have referenced the JavaScript file\
    \ with just the filename `app.js` because the file is in the same directory as\
    \ our HTML file. This will not always be the case, so you will need to reference\
    \ your external JavaScript file wherever it is in your app’s folder structure.\
    \ See [https://www.w3schools.com/html/html_filepaths.asp](https://www.w3schools.com/html/html_filepaths.asp)\
    \ for more information.\n\n## 1.5 Exec JavaScript Code with Node.js\n\nNode.js\
    \ is another JavaScript runtime built on Chrome’s V8 engine that allows you to\
    \ run your code outside of a browser, on your local machine.\n\nTo set up Node.js,\
    \ download and install the version for your specific operating system (OS) from\
    \ [https://nodejs.org/download/](https://nodejs.org/download/). Once installed,\
    \ bring up the integrated terminal in VS Code and type `node`. Your window should\
    \ change to look like [Figure 1.3](#01_005.html_f1.3).\n\n[![node Command](bilderklein/klein01_003.png)](img-f1.3.html)\n\
    \n**Figure 1.3**     node Command\n\nNow, we are going to run some JavaScript\
    \ using Node.js and log a string to the console. Create a JavaScript file called\
    \ `my-first-node-app.js`, add the following code, and save the file:\n\n```\n\
    console.log(\"Hello, this file was executed in Node!\") \n```\n\nWe can then execute\
    \ the file in the terminal with the `node` command, followed by the location of\
    \ the file relative to our current directory. We are assuming we are already in\
    \ the folder where the `my-first-node-app.js` file is located, so we run it like\
    \ this:\n\n```\nnode app.js \n```\n\nYou should then see the output `Hello, this\
    \ file was executed in Node!` in the terminal.\n\nCongratulations! You used Node.js\
    \ to run your JavaScript code on your local machine and viewed the output in a\
    \ terminal. We will follow this same process for many of the upcoming examples\
    \ in this E-Bite, as it is a quick way to learn a concept and see the output.\n\
    \n## 1.6 Comments\n\nComments in your JavaScript code play the same helpful role\
    \ that ABAP comments do. Just like in ABAP, JavaScript has single-line comments\
    \ using `//`. For example:\n\n```\n// This is a comment \n```\n\nYou can use this\
    \ to add comments about your code or comment a line of code out completely, as\
    \ follows:\n\n```\nconsole.log(\"test123\")    // This code writes text to the\
    \ console\n// console.log(\"test456\") \n```\n\nYou also have the option of multiline\
    \ comments starting with `/*` and ending the comment with `*/`, as shown in [Listing\
    \ 1.5](#01_006.html_l1.5).\n\n```\n/*\nSome comments can\nspan multiple lines\
    \ if\nthey need to\n*/\n```\n\n**Listing 1.5**     Multiline Comment\n[/content]\
