    test\").innerHTML = \"Some new text appeared!\";\n  document.getElementById(\"\
    test\").style.cssText =\n    \"fontWeight: bold; background-color: Chartreuse\"\
    ;\n} \n```\n\n**Listing 7.1**     DOM Manipulation: CSS\n\nWe can take DOM manipulation\
    \ even further than just changing text or CSS properties and add completely new\
    \ elements to the DOM. In [Listing 7.2](#07_004.html_l7.2), we create a function\
    \ that adds a new <samp class=\"listingcharacter\"><p></samp> tag to the <samp\
    \ class=\"listingcharacter\">div</samp> with an <samp class=\"listingcharacter\"\
    >id</samp> of <samp class=\"listingcharacter\">text-div</samp>.\n\n```\nfunction\
    \ addSomeText() {\n  const div = document.getElementById(\"text-div\");\n  const\
    \ newText = document.createElement(\"p\");\n  newText.textContent = \"Some brand\
    \ new text here!\";\n  div.appendChild(newText);\n} \n```\n\n**Listing 7.2**    \
    \ Adding New Element to the DOM\n\nIn this example, we first create a variable\
    \ that holds our <samp class=\"listingcharacter\">div</samp> where we want to\
    \ place the new <samp class=\"listingcharacter\"><p></samp> tag. We then call\
    \ the method <samp class=\"listingcharacter\">.createElement(\"p\"),</samp> which\
    \ creates a new <samp class=\"listingcharacter\"><p></samp> element, and assign\
    \ it to the variable <samp class=\"listingcharacter\">newText</samp>. We add some\
    \ text to the newly created <samp class=\"listingcharacter\"><p></samp> element\
    \ using <samp class=\"listingcharacter\">.textContent</samp> and call <samp class=\"\
    listingcharacter\">.appenChild</samp> on our <samp class=\"listingcharacter\"\
    >div</samp> variable to append the element as a child node.\n\nThis works both\
    \ ways; you can follow similar logic to remove DOM elements as well. The function\
    \ in [Listing 7.3](#07_004.html_l7.3) removes the <samp class=\"listingcharacter\"\
    ><p></samp> element with an <samp class=\"listingcharacter\">id</samp> of <samp\
    \ class=\"listingcharacter\">test</samp> from the DOM.\n\n```\nfunction removeSomeText()\
    \ {\n  const text = document.querySelector(\"#test\");\n  text.remove();\n} \n\
    ```\n\n**Listing 7.3**     Removing an Element from the DOM\n\nHere, we create\
    \ a variable <samp class=\"listingcharacter\">text</samp> and assign it the <samp\
    \ class=\"listingcharacter\"><p></samp> element with an <samp class=\"listingcharacter\"\
    >id</samp> of <samp class=\"listingcharacter\">test</samp> using the <samp class=\"\
    listingcharacter\">.querySelector()</samp> method. We then call the <samp class=\"\
    listingcharacter\">.remove()</samp> method on that <samp class=\"listingcharacter\"\
    >text</samp> variable to completely remove the element from the DOM.\n\n# 8    HTML\
    \ Events"
