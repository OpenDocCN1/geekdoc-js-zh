  trans: '

    JavaScript 运行在所有现代网络浏览器中：Chrome、Firefox、Safari、Edge 等。随着 `Node.js` 等运行时的引入，JavaScript
    也运行在服务器上，就像 ABAP 运行在 ABAP 栈上一样。这意味着 JavaScript 不再仅仅是一种前端语言，还可以执行后端服务器逻辑，有效地让你仅使用
    JavaScript 代码就能构建并运行全栈应用程序。


    JavaScript 的核心是一种单线程同步编程语言，这意味着每段代码都按照其编写的顺序执行。这可能会成为一个局限，因为在上一个函数完成操作之前，你的函数无法执行。在
    第 9 节 中，我们将学习更多如何使用“异步 JavaScript”的概念来克服这一局限性，它允许函数在后台运行，而不会阻塞其后的函数。


    对于来自 ABAP 的开发者来说，JavaScript 需要习惯的主要区别之一是它的灵活性和动态（松散）类型系统，我们将在 第 2 节 中进一步讨论。你的
    JavaScript 中的许多错误只有在运行时才会暴露。这与 ABAP（一种编译型语言）形成对比，后者的优点是可以在编译时捕获大多数此类错误。因此，在任何可能实现正确的错误处理至关重要。


    JavaScript 的最大优势之一是你几乎可以在任何地方编写并执行代码。你不需要像运行 ABAP 那样连接 SAP 实例来运行代码。这就是为什么在整个本
    E-Bite 中，我们鼓励你尝试读到的每一个内容。学习 JavaScript 最好最快的方法就是不断尝试你读到的新概念。


    在本节中，我们将从重要的概念开始，以对 JavaScript 建立背景性的理解。我们将讨论兼容性、运行时、准备步骤，以及如何在浏览器和通过 `Node.js`
    执行你的第一段 JavaScript 代码。最后，我们将查看 JavaScript 中注释是如何运作的。


    ## 1.1 ECMAScript 与浏览器兼容性


    ECMAScript 是 JavaScript 编程语言的正式标准，自 1997 年以来一直被使用。ECMAScript (ES) 突出了 JavaScript
    的不同版本以及每个版本包含的功能。这很重要，因为不同的浏览器在特定的浏览器版本中支持这些发布。某些浏览器完全不支持某些版本，例如 Internet Explorer
    不支持 ES6 (ECMAScript 2015)。这与 ABAP 版本相比，在 ABAP 中某些功能仅在较后的版本中可用。


    ### Note

    你可以在 [`en.wikipedia.org/wiki/ECMAScript`](https://en.wikipedia.org/wiki/ECMAScript)
    查看 ECMAScript 的完整版本历史。


    ES6 是较为人知的例子之一，引入了如 `let` 和 `const` 等新关键字（我们将在 第 2 节 中详细介绍）。与用于定义变量的旧 `var` 语句相比，这些被认为是现代
    JavaScript 关键字。本 E-Bite 全是关于现代 JavaScript 的，因此理解 ECMAScript 并在新功能或标准发布时保持与同步至关重要。


    ## 1.2 运行时与引擎


    你编写的 JavaScript 代码可以在网络浏览器内部执行、在本地机器上执行，甚至在服务器上执行。网络浏览器有自己的运行时环境，允许你的 JavaScript
    与网页的文档对象模型 (DOM)、浏览器本身（如使用本地存储或会话存储）或外部 API（你调用服务器）进行交互。


    为了让浏览器使用你的 JavaScript 代码，它必须运行自己的 JavaScript 引擎，以便解析你的代码并将其转换为机器可以理解的可执行命令。例如，Chrome
    拥有 V8 JavaScript 引擎，Firefox 有 SpiderMonkey，而 Microsoft Edge 有 Chakra。


    运行时和引擎是一个重要概念，因为你的 JavaScript 代码需要在多个环境中运行，并且并不是所有功能在每个浏览器或浏览器版本中都得到相同的支持（参见 第
    1.1 节）。


    我们将在 第 1.5 节 中讨论如何使用 `Node.js` 运行 JavaScript。


    ## 1.3 准备、工具与 IDE


    你可以使用任何喜欢的集成开发环境 (IDE) 来编写 JavaScript 代码。目前流行的选择之一是微软的 Visual Studio (VS) Code，但许多开发者已经在使用
    Eclipse 进行纯 ABAP 工作（当然是在事务 SE38 之外！），你也可以用它处理 JavaScript。本 E-Bite 中的示例分为两个大类：


    *   使用 `index.html` 文件在网页上运行 JavaScript。JavaScript 代码运行在 `index.html` 文件内部，或者从外部
    JavaScript 文件（例如 `app.js`）引用。

    *   使用 `node.js` 在没有 `index.html` 文件（网页）的情况下运行 JavaScript 文件。


    我们还建议将每个节拆分到独立的文件夹中，因为我们将在示例中使用多个 `index.html` 和 `app.js` 文件，文件夹将帮助你组织代码。


    从现在开始（为了保持连续性），我们将在 VS Code 中专门运行我们的 JavaScript 示例，因为它在一个整洁且易于用户使用的界面内包含了 IntelliSense、调试、格式化、代码导航、重构以及许多其他高级语言功能。你可以在
    [`s-prs.co/v535900`](http://s-prs.co/v535900) 找到 VS Code 的安装文件。我们将使用一些关键的 VS Code
    扩展来编写和执行代码，你需要从 [`s-prs.co/v535901`](http://s-prs.co/v535901) 安装它们。


    ### Note

    关于 VS Code 的更多信息，请访问 [`s-prs.co/v535902`](http://s-prs.co/v535902)。


    为了运行我们的网页示例（使用 `index.html` 文件），我们将使用一个名为 Live Server 的扩展（[`s-prs.co/v535903`](http://s-prs.co/v535903)）。通过此扩展，你能够快速方便地预览代码更改，就像在事务
    SE38 中激活并执行你的 ABAP 代码一样。它会在你每次保存时重新运行你的代码，因此你可以实时查看更改。


    我们还推荐一个名为 Prettier – Code Formatter 的扩展 ([`s-prs.co/v535904`](http://s-prs.co/v535904))，它就像在事务
    SE38 中使用格式打印来帮助你的代码，以及 ESLint ([`s-prs.co/v535905`](http://s-prs.co/v535905))，它像
    ABAP 语法检查一样静态检查你的代码。


    ## 1.4 在浏览器中执行 JavaScript 代码


    在 IDE 中编写任何 JavaScript 代码之前，我们将在 Google Chrome 浏览器控制台中尝试一些代码。打开浏览器窗口并按 [F12]。如果你不在该标签页，请寻找
    Console（控制台）标签并点击它。浏览器控制台是我们从应用程序记录信息的地方，我们将用它执行一些 JavaScript 代码。在控制台中输入以下内容并按
    [Enter]：


    ```javascript

    console.log("Hello World!")

    ```


    你应该能在控制台中看到“Hello World!”，如图 1.1](img-f1.1.html)


    **图 1.1** Chrome Console


    恭喜！你刚刚在浏览器中执行了一行 JavaScript 代码。`console.log()` 语句类似于 ABAP 中的 WRITE 语句，当你编写复杂的逻辑并需要检查整个程序中的变量是否正确时，它是一个强大的调试工具。你将在
    第 14.2 节 中找到更多关于调试的详细信息。


