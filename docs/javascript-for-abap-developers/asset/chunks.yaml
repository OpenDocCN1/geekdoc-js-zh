  trans: "\n使用现代 `let` 关键字的变量可以被更新（重新赋值），但在同一作用域内不能重新声明，使其成为 `var` 关键字的流行继任者。在列表 2.13\
    \ 中，注意当我们使用 `let` 声明时，我们可以更改变量的值，将 `John` 更改为 `Johnny`。\n\n```\nlet firstName\
    \ = \"John\";\nconsole.log(firstName); // John\nfirstName = \"Johnny\";\nconsole.log(firstName);\
    \ // Johnny \n```\n\n**列表 2.13** let: 更改变量\n\n在列表 2.14 中，如果我们尝试在同一作用域内使用 `let`\
    \ 关键字重新赋值变量（例如将 `John` 重新声明为 `Fred`），我们将得到一个 `SyntaxError`。\n\n```\nlet firstName\
    \ = \"John\";\nconsole.log(firstName);\nlet firstName = \"Fred\"; /* \nSyntaxError:\
    \ Identifier 'firstName' has already been declared */ \n```\n\n**列表 2.14** let:\
    \ 重新赋值变量\n\n然而，如果 `let` 变量标识符位于同一标识符块作用域之外，则可以再次声明（参见节 2.3），正如列表 2.15 所示。\n\n\
    ```\nlet firstName = \"John\";\nconsole.log(firstName); // John\nif (true) {\n\
    \  let firstName = \"Johnny\";\n  console.log(firstName + \" in block scope\"\
    ); // Johnny in block scope\n} \n```\n\n**列表 2.15** let: 块作用域\n\n### const\n\n\
    `const` 关键字类似于 `let`，但你不能更改或重新赋值它的值。不可更新的变量的好处是它在整个程序过程中都不会改变。在列表 2.16 中，我们立即看到，如果尝试更改变量\
    \ `firstName,`，就会遇到 `TypeError`。\n\n```\nconst firstName = \"John\";\nfirstName\
    \ = \"Johnny\"; // TypeError: Assignment to constant variable \n```\n\n**列表 2.16**\
    \ const: 更改变量\n\n在列表 2.17 中，我们看到如果尝试重新声明 `firstName` 变量，将出现 `SyntaxError`。\n\n\
    ```\nconst firstName = \"John\";\nconst firstName = \"Johnny\"; /* \nSyntaxError:\
    \ Identifier 'firstName' has already been declared */ \n```\n\n**列表 2.17** const:\
    \ 重新声明变量\n\n## 2.5 字符串和数字方法\n\n正如在列表 2.8 中，我们使用 `typeof` 运算符来查找变量类型，你拥有字符串和数字的内置方法，可以返回有关变量的信息。在处理字符串时，你有多种方法可以使用。你可以调用返回字符串长度的方法，如下：\n\
    \n```\nlet alphabet = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\";\nconsole.log(`String length\
    \ is ${alphabet.length}`); // String length is 26 \n```\n\n你可以调用返回单词在句子中索引的方法，如下：\n\
    \n```\nlet greetingStr = \"Hello there friend!\";\nconsole.log(`There lies at\
    \ index: ${greetingStr.indexOf(\"there\")}`); /* There lies at index: 6 */ \n\
    ```\n\n你还有专门适用于数字的方法，例如可以减少小数点：\n\n```\nlet num1 = 15.443256;\nconsole.log(num1.toFixed(2));\
    \ // 15.44 \n```\n\n如果需要，你可以将数字转换为字符串，反之亦然，正如列表 2.18 所示。\n\n```\nlet num1 = 14.44;\n\
    console.log(typeof num1); // number\nlet numString = num1.toString(); // convert\
    \ num1 to a string\nconsole.log(typeof numString); //string\nlet num2 = Number(num1);\
    \ // convert num1 back to a number\nconsole.log(typeof num2); // number \n```\n\
    \n**列表 2.18** 字符串和数字方法\n\n# 3 运算符和循环\n\n现在我们可以在代码中声明变量了，我们需要处理这些变量并将它们用于程序逻辑中。在\
    \ ABAP 中，大多数日常需求包括算术、值比较、条件语句和循环以实现结果。JavaScript 也涵盖了这些领域，唯一的真实区别在于语法。我们将在后续章节中看到这些差异。\n\
    \n## 3.1 算术运算符\n\n正如节 2.1 所示，你可以在 JavaScript 中进行基础算术运算，例如使用 `+` 运算符相两个数字或变量，正如列表\
    \ 3.1 所示。\n\n```\nlet a = 10; // Operand\nlet b = 15; // Operand\nlet c = a +\
    \ b; // + is the operator that sums the numbers\nconsole.log(c); // 25\nlet d\
    \ = 10 + 15;\nconsole.log(d); // 25 \n```\n\n**列表 3.1** 加法运算符\n\n之前的算术操作被分为运算符和操作数。运算符是\
    \ `+` 号，它求加操作数（`10` 和 `15`）以得到 `25`。你也可以同样使用 `-`、`*` 和 `/` 分别进行减法、乘法除法。\n\n还有一个模运算符\
    \ `%`，它在执行除法计算后返回余数，正如列表 3.2 所示。\n\n```\nlet a = 7;\nlet b = 2;\nlet c = a % b;\n\
    console.log(c); // 1 \n```\n\n**列表 3.2** 模（余数）运算符\n\n就像数学一样，JavaScript 算术运算遵循相同的优先级原则：乘法（`*`）和除法（`/`）优先计算，高于\
    \ `+` 和 `-`，后者后计算。示例如下：\n\n```\nlet sum = 10 + 5 * 3;\nconsole.log(sum); // 25\
    \ \n```\n\n使用相同的原理，你也可以通过使用 `()` 来改变顺序，如下：\n\n```\nlet sum = (10 + 5) * 3;\nconsole.log(sum);\
    \ // 45 \n```\n\n在节 3.6 中，我们将查看循环，我们可以在变量后使用 `++` 或 `--` 来增加或减少值，正如列表 3.3 所示。\n\
    \n```\nlet a = 10;\na++;\nconsole.log(a); // 11\na--;\nconsole.log(a); // 10 \n\
    ```\n\n**列表 3.3** 值的自增与自减\n\n在节 2.1 中，我们查看了赋值运算符（即 `=`），它用于给变量赋值。现在我们在列表 3.4 中更进了一步，使用了如\
    \ `+=`、`-=`、`*=` 和 `/=` 等运算符。\n\n```\nlet a = 10;\nlet b = 2;\na += b;\nconsole.log(a);\
    \ // 12\na -= b;\nconsole.log(a); // 10\na *= b;\nconsole.log(a); // 20\na /=\
    \ b;\nconsole.log(a); // 10 \n```\n\n**列表 3.4** 算术赋值运算符\n\n## 3.2 字符串运算符\n\n字符串运算符可以根据变量或硬编码文本拼接字符串以形成更长的字符串。你在列表\
    \ 2.15 中看到过这一点，在那里我们使用 `+` 运算符拼接两个字符串。另一个示例在列表 3.5 所示，其中三个变量与一些硬编码文本拼接并赋值给另一个变量，然后将其打印到控制台。\n"
- fmt: "\n```\nlet firstName = \"John\";\nlet lastName = \"Doe\";\nlet age = 34;\n\
    let person = firstName + \" \" + lastName + \" is \" + age + \" years old.\";\n\
    console.log(person); // John Doe is 34 years old. \n```\n\n### Listing 3.5 String\
    \ Concatenation Using +\n\nYou might find the variable concatenation in the previous\
    \ example is long and convoluted. There is a more streamlined way to concatenate\
    \ strings in JavaScript called template literals, like string templates in ABAP.\
    \ They allow you to build your string between back quotes (`` ``), where spaces\
    \ and other text are taken into consideration around variables referenced using\
    \ `${}`. [Listing 3.6](#03_002.html_l3.6) shows how to reference the same three\
    \ variables from [Listing 3.5](#03_002.html_l3.5), but arrange them in a more\
    \ natural sentence-like structure instead of having to declare literal spaces\
    \ between strings.\n\n```javascript\nlet firstName = \"John\";\nlet lastName =\
    \ \"Doe\";\nlet age = 34;\nlet person = `${firstName} ${lastName} is ${age} years\
    \ old.`;\nconsole.log(person); // John Doe is 34 years old. \n```\n\n### Listing\
    \ 3.6 Template Literals\n\n## 3.3 Comparison Operators\n\nABAP comparison operators\
    \ are similar in both syntax and function to JavaScript, allowing you to compare\
    \ variables or values. In JavaScript, though, you evaluate the difference, and\
    \ it can be either true or false depending on the result of the comparison, as\
    \ shown in [Listing 3.7](#03_003.html_l3.7).\n\n```javascript\na = 20;\nconsole.log(a\
    \ != 21); // true\nconsole.log(a < 20); // false\nconsole.log(a <= 20); // true\n\
    console.log(a > 20); // false\nconsole.log(a >= 20); // true \n```\n\n### Listing\
    \ 3.7 Comparison Operators\n\nThe only real difference between ABAP and JavaScript\
    \ are the equal to (`=`) and not equal to (`!=`) operators due to the dynamic\
    \ typing of JavaScript. You need to extend your `=` or `!=` to include a comparison\
    \ of the value and the type, as per [Table 3.1](#03_003.html_t3.1).\n\n| Operator\
    \ | Description |\n| --- | --- |\n| `==` | Only compares the actual value |\n\
    | `===` | Compares the value and the type |\n| `!=` | Only compares the value\
    \ |\n| `!==` | Compares the value and the type |\n\n### Table 3.1 Comparison Operator\
    \ Types\n\nIn [Listing 3.8](#03_003.html_l3.8), you see how if you compare variable\
    \ `b`, which is `25`, with a string `25` using the `==` operator, it will evaluate\
    \ as `true` because it does not compare the type. When you use `===` with that\
    \ same comparison, it evaluates as `false` because it takes the type into consideration\
    \ (which does not match, i.e., `number` and `string`). The same principle applies\
    \ for the `!=` operator as well.\n\n```javascript\nb = 25;\nconsole.log(b == 25);\
    \ // true\nconsole.log(b == 30); // false\nconsole.log(b == \"25\"); // true because\
    \ no type comparison\nconsole.log(b === 25); // true\nconsole.log(b === 30); //\
    \ false\nconsole.log(b === \"25\"); // false because of type comparison\nconsole.log(b\
    \ != 25); // false\nconsole.log(b != 30); // true\nconsole.log(b != \"25\"); //\
    \ false because no type comparison\nconsole.log(b !== 25); // false\nconsole.log(b\
    \ !== 30); // true\nconsole.log(b !== \"25\"); // true because of type comparison\
    \ \n```\n\n### Listing 3.8 Comparison Operator with Types and Values\n\n## 3.4\
    \ Logical Operators\n\nJavaScript also has the logical operators and (`&&`), or\
    \ (`||`), and not (`!`), which can, for example, be used in conjunction with the\
    \ comparison operators. In [Listing 3.9](#03_004.html_l3.9), we compare variables\
    \ `a` and `b` with hard-coded numbers inside brackets. We use `&&` to say comparison\
    \ 1 and comparison 2 must evaluate to `true` to be completely true. We use `||`\
    \ where we only need one or the other to evaluate to `true` to be completely true.\
    \ Finally, we use `!` when, if the comparison is not `true`, it evaluates to `true`.\n\
    \n```javascript\nlet a = 10;\nlet b = 20;\nconsole.log(a === 10 && b === 20);\
    \  // true\nconsole.log(a === 20 && b === 10);  // false\nconsole.log(a === 10\
    \ && b === 11);  // false\nconsole.log(a === 10 || b === 20);  // true\nconsole.log(a\
    \ === 10 || b === 21);  // true\nconsole.log(!(a === b));            // true \n\
    ```\n\n### Listing 3.9 Logical Operators\n\n## 3.5 Conditional Operators\n\nAs\
    \ in ABAP, you have the traditional conditional statements `if`, `else`, and `else\
    \ if`. `if` and `else if` both run a comparison between two values and execute\
    \ some code if that condition is met. The `if` statement is followed by the condition\
    \ to evaluate in brackets and, if the condition is met (i.e., true), then the\
    \ code in the curly brackets is executed. The `else if` statement works the same\
    \ way and is triggered if the first `if` condition is not met and will check another\
    \ condition. The `else` statement is inserted at the end of your conditional logic,\
    \ either after `if` or `else if` depending on your scenario, and is triggered\
    \ if all other statements before it are false.\n\nIf you run the code in [Listing\
    \ 3.10](#03_005.html_l3.10) as is, the output “100 is definitely 100 or less”\
    \ should result. If you change the value of variable `a` to 110, you should see\
    \ “110 is simply not less than 100” as output. Finally, if you change variable\
    \ `a` to a string like `hello`, then your `else` statement should be triggered\
    \ and “hello is just not a number” should be logged to the console.\n\n```javascript\n\
    let a = 100;\nif (a <= 100) {\n  console.log(`${a} is definitely 100 or less`);\n\
    } else if (a > 100) {\n  console.log(`${a} is simply not less than 100`);\n} else\
    \ {\n  console.log(`${a} is just not a number`);\n} \n```\n\n### Listing 3.10\
    \ Conditional Operators: if Statement\n\nIn ABAP, we can compress conditional\
    \ logic like that seen in [Listing 3.10](#03_005.html_l3.10) into one concise\
    \ line of code using the `COND` statement, as follows:\n\n```abap\nDATA(lv_num)\
    \ = COND #( WHEN iv_num IS INITIAL THEN 0 ELSE iv_num ).\n```\n"
