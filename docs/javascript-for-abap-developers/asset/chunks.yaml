  trans: "\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <script src=\"\
    jquery-3.6.0.min.js\"></script>\n    <script src=\"app.js\"></script>\n    <title>Document</title>\n\
    </head>\n<body>\n    <div>\n        <h1 id=\"heading1\">Let's try out some jQuery</h1>\n\
    \        <p id=\"text1\">jQuery is awesome!</p>\n        <a id=\"link1\" href=\"\
    https://jquery.com/\" target=\"_blank\">jQuery.com</a>\n    </div>\n    <div style=\"\
    padding-top: 5px; padding-bottom: 5px;\">\n        <button id=\"button1\">Press\
    \ me!</button>\n    </div>\n    <div id=\"form-div\">\n        <form id=\"form\"\
    >\n            <h4>Newsletter Signup</h4>\n            <label for=\"email\">Email</label><br>\n\
    \            <input type=\"text\" id=\"email\" name=\"fname\"><br>\n        </form>\n\
    \        <button id=\"form-button\">Submit</button>\n    </div>\n</body>\n</html>\n\
    ```\n\n列表 12.1 `index.html`\n\n最后，创建一个 `app.js` 文件，并将列表 12.2 中显示的初始代码复制其中，它现在就可以访问\
    \ jQuery 库了。\n\n```javascript\n$(document).ready(() => {\n  alert(\"Document is\
    \ loaded!\");\n});\n```\n\n列表 12.2 `app.js`\n\n我们从列表 12.1 运行 `index.html` 页面，在其中我们看到一旦页面完全加载，就会弹出一个显示“Document\
    \ is loaded!”的警框，如图图 12.1](#12_001.html_f12.1)所示。在列表 12.2 中，我们调用了 `$(document).ready()`\
    \ 函数，这是一个 jQuery 包装器，它确保此函数内的任何代码（在我们的案例中是 alert）只在网页加载完成后执行。\n\n![Alert Triggered\
    \ inside jQuery](img/img-f12.1.html)\n\n图 12.1 jQuery 内部触发的 Alert\n\n## 12.2 使用\
    \ jQuery 选择器\n\n在列表 12.2 中，注意 jQuery 语法与标准 JavaScript 略有不同。`$` 符号后跟括号 `$(document)`被称为\
    \ jQuery 选择器，它替换了我们在之前节中使用的冗长方法调用，即 `document.getElementById(\"text\")`。和之前一样，我们可以使用\
    \ `$(\"p\")` 语法选择像`<p>` 标签这样的 HTML DOM 元素。如果你想通过 `id` 选择元素，可以像这样包含一个 `#` 符号：`$(\"\
    #text1\")`。\n\n我们从列表 12.2 中移除了 `alert`，并将列表 12.3 中的代码添加到 `$(document).ready()`\
    \ 函数中，在其中我们将使用按钮来更改 `<p>` 标签中的文本。\n\n```javascript\n$(\"#button1\").click(() =>\
    \ {\n    $(\"#text1\").text(\"This text changed!\");\n  });\n```\n\n列表 12.3 jQuery\
    \ 按钮事件\n\n有许多 jQuery 选择器可以选择，它们都是为了帮助你轻松遍历 DOM。在这篇 E-Bite 中无法一一介绍，但一些值得注意的包括：\n\
    \n*   `$(\"button\")` 选择所有 `<button>` 元素，并可以应用于其他 HTML 元素。\n*   `$(p:first)` 和\
    \ `$(p:last)` 分别选择 DOM 中的第一个和最后一个 `<p>` 标签。\n*   `$(\"p#text1\")` 选择所有 `id` 为\
    \ `text1` 的 `<p>` 标签。\n*   `$(\"*\")` 选择网页上的所有元素。\n\n## 12.3 注册事件\n\n在示例中，注意我们仅仅通过调用\
    \ jQuery 的 `.click()` 方法无意中注册了一个 HTML `onclick` 事件。在 jQuery 中，注册标准的 HTML 事件轻而易举，因为你可以在\
    \ JavaScript 文件中注册你的事件以及它调用的函数，而不需要在 HTML 文件中创建引用。\n\n让我们重新实现第 8 节中的示例，在那里我们注册了鼠标悬停逻辑，处理当鼠标悬停在文本上然后再次离开的情况。我们将列表\
    \ 12.4 中所示的代码添加到 `$(document).ready()` 函数中。\n\n```javascript\n$(\"#text1\").on({\n\
    \    mouseenter: function () {\n      $(this).text(\"Hey! You hovered over me!\"\
    );\n    },\n    mouseleave: function () {\n      $(this).text(\"jQuery is awesome!\"\
    );\n    },\n  });\n```\n\n列表 12.4 mouseenter 和 mouseleave 事件\n\n我们现在看到，当你悬停在文本上时它会变化，当你移开鼠标时恢复。此外，注意我们能够使用\
    \ `.on()` 语句在一个选择器下注册两个事件（`mouseenter` 和 `mouseleave`）。这使得语法更具读性，因为这两个事件通常是相互关联的，应该自然地分组在一起。在每个事件处理函数内部，我们使用了\
    \ `this` 关键字，它指的是包裹我们两个鼠标悬停事件的 `#text1` 选择器的上下文。你也可以将 (`this`) 关键字替换为 `#text1`。\n\
    \n## 12.4 更改 HTML 元素\n\n为了更改上一节中 HTML 元素的文本，我们使用 `.text()` 语句。在括号内，我们放入了想要更改的新文本。这只是\
    \ jQuery 更改 DOM 中几乎任何内容的许多方法之一。通过取用 `$(\"#text1\").text()` 并将 `.text()` 方法替换为\
    \ `.append()` 或 `.prepend()`，我们可以追加文本而不是完全替换它。当我们点击 \"Press Me!\" 按钮时，文本将被添加（取决于方法，在开头或末尾），而不是替换已有的文本。以下代码将文本置于末尾：\n\
    \n```javascript\n$(\"#text1\").append(\"This text changed!\");\n```\n\n你可以通过以下方式将文本放在开头：\n\
    \n```javascript\n$(\"#text1\").prepend(\"This text changed!\");\n```\n\n让我们用页面上的\
    \ jQuery 新闻通讯订阅表单尝试另一个真实世界的示例。新闻通讯表单 DOM 元素都封装在一个 `id` 为 `form` 的 `div` 中。我们希望用户通过在输入框输入电子邮件并点击\
    \ Submit 按钮来订阅新闻通讯。当他们点击 Submit 时，我们希望表单消失，因为订阅后就不再需要它了。我们将列表 12.5 中的代码添加到我们的\
    \ `$(document).ready()` 函数中。\n\n```javascript\n$(\"#form-button\").click(() =>\
    \ {\n    $(\"#form-div\").hide(\"slow\");\n  });\n```\n\n列表 12.5 jQuery .hide()\
    \ 表单\n\n"
- fmt: "\nWhen clicking Submit, your entire form `div` gently disappears. The great\
    \ thing is that the nice-looking animated action is achieved in three easy-to-read\
    \ lines of code. We select the form button using the jQuery selector and register\
    \ our click event `$(\"#form-button\").click()`. Inside our click event, we use\
    \ another jQuery selector to select our entire `div` and hide it using the `slow`\
    \ speed `$(\"#form-div\").hide(\"slow\")`. You can even specify the number of\
    \ milliseconds the hide animation should take to complete with `$(\"#form-div\"\
    ).hide(1000)`.\n\n## 12.5  Adding and Removing Elements from the DOM\n\nOur jQuery\
    \ `.hide()` and `.show()` example is great if you want to hide and show elements\
    \ like form inputs based on user input while keeping an entire form intact. However,\
    \ it may be more beneficial in some scenarios to completely remove the element\
    \ from the webpage and replace it with a brand-new element. In our case, it might\
    \ be better to completely remove the form `div` and replace it with a new `div`\
    \ that contains text telling us the form submission was successful. To do that,\
    \ we replace the function from [Listing 12.5](#12_004.html_l12.5) with the function\
    \ in [Listing 12.6](#12_005.html_l12.6).\n\n```javascript\n$(\"#form-button\"\
    ).click(() => {\n    let confirmationText =\n      \"<div><p>Thank you, your email\
    \ was submitted.</p></div>\";\n    $(\"#form-div\").remove();\n    $(\"div:last\"\
    ).append(confirmationText);\n  }); \n```\n\n**Listing 12.6**  jQuery: Adding and\
    \ Removing Elements\n\nWe fill in our email address and after clicking Submit,\
    \ our entire form `div` is removed and a new `div` tag containing a `p>` tag is\
    \ added. Notice how we have used the selector `$(\"div:last\")` to find the last\
    \ `div` on our webpage and used the `.append()` method to add the new `div` just\
    \ after it. Again, in very few lines of code, we have found the element we want,\
    \ removed it, and added another new element in a specific location in the DOM.\n\
    \n## 12.6  Changing CSS\n\njQuery also extends to changing CSS properties or even\
    \ adding new ones. Manipulating CSS on a webpage based on user input is a common\
    \ requirement and something jQuery handles very elegantly. To demonstrate this,\
    \ let’s add some CSS changes to our `mouseenter` event from [Listing 12.4](#12_003.html_l12.4)\
    \ to change the background color and font, as shown in [Listing 12.7](#12_006.html_l12.7).\
    \ Notice how we can chain the jQuery statements together using the `.` notation.\n\
    \n```javascript\n$(\"#text1\").on({\n    mouseenter: function () {\n      $(this)\n\
    \        .text(\"Hey! You hovered over me!\")\n        .css(\"background-color\"\
    , \"DodgerBlue\")\n        .css(\"color\", \"white\");\n    },\n    mouseleave:\
    \ function () {\n      $(this)\n        .text(\"jQuery is awesome!\")\n      \
    \  .css(\"background-color\", \"\")\n        .css(\"color\", \"\");\n    },\n\
    \  }); \n```\n\n**Listing 12.7**  jQuery CSS Methods\n\nWhen hovering over our\
    \ `\"jQuery is awesome!\"` text, we see the hover text background changes to blue\
    \ and the font color changes to white, as in [Figure 12.2](#12_006.html_f12.2).\
    \ jQuery method chaining is an especially useful way of changing multiple parts\
    \ of an HTML element in one place.\n\n[![jQuery Hover](bilderklein/klein12_002.png)](img-f12.2.html)\n\
    \n**Figure 12.2**  jQuery Hover\n\n## 12.7  jQuery AJAX\n\nWe can use jQuery methods\
    \ to make AJAX queries to external data, just like we did in [Section 11](#11_001.html_h11).\
    \ jQuery abstracts much of the complexity of these queries and returns what we\
    \ need to continue our logic. The jQuery syntax is illustrated in [Listing 12.8](#12_007.html_l12.8).\n\
    \n```javascript\n $(\"some-button\").click(() => {\n    $.get(\"https://example.com\"\
    , (data, status) => {\n      // Some logic\n    });\n  }); \n```\n\n**Listing\
    \ 12.8**  jQuery AJAX Syntax\n\nWe have our regular jQuery selector and event\
    \ `$(\"some-button\").click()` inside, which we call our jQuery AJAX HTTP GET\
    \ method `$.get()`, passing in the endpoint URL. We then specify a callback function\
    \ `(data, status) => {}` with the parameters `data` being the data returned from\
    \ the request and `status` being the HTTP response status (i.e., 200 if successful).\n\
    \nIn our example, we add the code from [Listing 12.9](#12_007.html_l12.9) to the\
    \ `$(\"#form-button\").click()` method to call the data from our file `test_data.json`\
    \ and display it in an alert as part of our email submission logic. We also make\
    \ sure to copy the `test_data.json` file from [Section 11.1](#11_001.html_h11.1)\
    \ into the current folder where the `app.js` file is located for this example.\n\
    \n```javascript\n$.get(\"test_data.json\", (data, status) => {\n      alert(`Congratulations!\
    \ You've won a ${data[0]}!`);\n    }); \n```\n\n**Listing 12.9**   jQuery AJAX\
    \ Example\n\nWe then enter our email in the form, click Submit, and we see an\
    \ alert popup that says “Congratulations! You've won a Mercedes!” as shown in\
    \ [Figure 12.3](#12_007.html_f12.3).\n\n[![jQuery Call](bilderklein/klein12_003.png)](img-f12.3.html)\n\
    \n**Figure 12.3**   jQuery GET Call\n\n# 13   Web APIs\n\nAn API is a way for\
    \ developers to interact with something complex in an easier way with easier syntax.\
    \ APIs are a vast topic in JavaScript, so we are going to focus on an area of\
    \ APIs called web APIs. Web APIs are nothing more than web-based interfaces that\
    \ offer a set of ways (like methods) you can use to interact with things and request\
    \ data that can be used in your app. Web APIs are a core feature of JavaScript\
    \ development and allow you to leverage particularly useful tools that fall within\
    \ another concept called browser APIs. Browser APIs are interfaces specific to\
    \ the browser and allow us to interact with the device the browser is running\
    \ on, and they form an interface that lets our JavaScript code securely access\
    \ resources outside of our app.\n\nIn this section, we’ll explore how web APIs\
    \ facilitate browser navigation, geolocation, and browser storage.\n\n## 13.1   Browser\
    \ Navigation and History\n"
  raw: "When clicking Submit, your entire form <samp class=\"listingcharacter\">div</samp>\
    \ gently disappears. The great thing is that the nice-looking animated action\
    \ is achieved in three easy-to-read lines of code. We select the form button using\
    \ the jQuery selector and register our click event <samp class=\"listingcharacter\"\
    >$(\"#form-button\").click()</samp>. Inside our click event, we use another jQuery\
    \ selector to select our entire <samp class=\"listingcharacter\">div</samp> and\
    \ hide it using the <samp class=\"listingcharacter\">slow</samp> speed <samp class=\"\
    listingcharacter\">$(\"#form-div\").hide(\"slow\")</samp>. You can even specify\
    \ the number of milliseconds the hide animation should take to complete with <samp\
    \ class=\"listingcharacter\">$(\"#form-div\").hide(1000)</samp>.\n\n## 12.5    Adding\
    \ and Removing Elements from the DOM\n\nOur jQuery <samp class=\"listingcharacter\"\
    >.hide()</samp> and <samp class=\"listingcharacter\">.show()</samp> example is\
    \ great if you want to hide and show elements like form inputs based on user input\
    \ while keeping an entire form intact. However, it may be more beneficial in some\
    \ scenarios to completely remove the element from the webpage and replace it with\
    \ a brand-new element. In our case, it might be better to completely remove the\
    \ form <samp class=\"listingcharacter\">div</samp> and replace it with a new <samp\
    \ class=\"listingcharacter\">div</samp> that contains text telling us the form\
    \ submission was successful. To do that, we replace the function from [Listing 12.5](#12_004.html_l12.5)\
    \ with the function in [Listing 12.6](#12_005.html_l12.6).\n\n```\n$(\"#form-button\"\
    ).click(() => {\n    let confirmationText =\n      \"<div><p>Thank you, your email\
    \ was submitted.</p></div>\";\n    $(\"#form-div\").remove();\n    $(\"div:last\"\
    ).append(confirmationText);\n  }); \n```\n\n**Listing 12.6**     jQuery: Adding\
    \ and Removing Elements\n\nWe fill in our email address and after clicking Submit,\
    \ our entire form <samp class=\"listingcharacter\">div</samp> is removed and a\
    \ new <samp class=\"listingcharacter\"><div></samp> tag containing a <samp class=\"\
    listingcharacter\"><p></samp> tag is added. Notice how we have used the selector\
    \ <samp class=\"listingcharacter\">$(\"div:last\")</samp> to find the last <samp\
    \ class=\"listingcharacter\">div</samp> on our webpage and used the <samp class=\"\
    listingcharacter\">.append()</samp> method to add the new <samp class=\"listingcharacter\"\
    >div</samp> just after it. Again, in very few lines of code, we have found the\
    \ element we want, removed it, and added another new element in a specific location\
    \ in the DOM.\n\n## 12.6    Changing CSS\n\njQuery also extends to changing CSS\
    \ properties or even adding new ones. Manipulating CSS on a webpage based on user\
    \ input is a common requirement and something jQuery handles very elegantly. To\
    \ demonstrate this, let’s add some CSS changes to our <samp class=\"listingcharacter\"\
    >mouseenter</samp> event from [Listing 12.4](#12_003.html_l12.4) to change the\
    \ background color and font, as shown in [Listing 12.7](#12_006.html_l12.7). Notice\
    \ how we can chain the jQuery statements together using the <samp class=\"listingcharacter\"\
    >.</samp> notation.\n\n```\n$(\"#text1\").on({\n    mouseenter: function () {\n\
    \      $(this)\n        .text(\"Hey! You hovered over me!\")\n        .css(\"\
    background-color\", \"DodgerBlue\")\n        .css(\"color\", \"white\");\n   \
    \ },\n    mouseleave: function () {\n      $(this)\n        .text(\"jQuery is\
    \ awesome!\")\n        .css(\"background-color\", \"\")\n        .css(\"color\"\
    , \"\");\n    },\n  }); \n```\n\n**Listing 12.7**     jQuery CSS Methods\n\nWhen\
    \ hovering over our <samp class=\"listingcharacter\">\"jQuery is awesome!\"</samp>\
    \ text, we see the hover text background changes to blue and the font color changes\
    \ to white, as in [Figure 12.2](#12_006.html_f12.2). jQuery method chaining is\
    \ an especially useful way of changing multiple parts of an HTML element in one\
    \ place.\n\n[![jQuery Hover](bilderklein/klein12_002.png)](img-f12.2.html)\n\n\
    **Figure 12.2**     jQuery Hover\n\n## 12.7    jQuery AJAX\n\nWe can use jQuery\
    \ methods to make AJAX queries to external data, just like we did in [Section 11](#11_001.html_h11).\
    \ jQuery abstracts much of the complexity of these queries and returns what we\
    \ need to continue our logic. The jQuery syntax is illustrated in [Listing 12.8](#12_007.html_l12.8).\n\
    \n```\n $(\"some-button\").click(() => {\n    $.get(\"https://example.com\", (data,\
    \ status) => {\n      // Some logic\n    });\n  }); \n```\n\n**Listing 12.8**    \
    \ jQuery AJAX Syntax\n\nWe have our regular jQuery selector and event <samp class=\"\
    listingcharacter\">$(\"some-button\").click()</samp> inside, which we call our\
    \ jQuery AJAX HTTP GET method <samp class=\"listingcharacter\">$.get()</samp>,\
    \ passing in the endpoint URL. We then specify a callback function <samp class=\"\
    listingcharacter\">(data, status) => {}</samp> with the parameters <samp class=\"\
    listingcharacter\">data</samp> being the data returned from the request and <samp\
    \ class=\"listingcharacter\">status</samp> being the HTTP response status (i.e.,\
    \ 200 if successful).\n\nIn our example, we add the code from [Listing 12.9](#12_007.html_l12.9)\
    \ to the <samp class=\"listingcharacter\">$(\"#form-button\").click()</samp> method\
    \ to call the data from our file test_data.json and display it in an alert as\
    \ part of our email submission logic. We also make sure to copy the test_data.json\
    \ file from [Section 11.1](#11_001.html_h11.1) into the current folder where the\
    \ app.js file is located for this example.\n\n```\n$.get(\"test_data.json\", (data,\
    \ status) => {\n      alert(`Congratulations! You've won a ${data[0][\"make\"\
    ]}!`);\n    }); \n```\n\n**Listing 12.9**     jQuery AJAX Example\n\nWe then enter\
    \ our email in the form, click Submit, and we see an alert popup that says “Congratulations!\
    \ You've won a Mercedes!” as shown in [Figure 12.3](#12_007.html_f12.3).\n\n[![jQuery\
    \ GET Call](bilderklein/klein12_003.png)](img-f12.3.html)\n\n**Figure 12.3**    \
    \ jQuery GET Call\n\nThis scenario is where jQuery really shines, because we were\
    \ able to set up a click event, add and remove elements, call external data, use\
    \ that data in an alert (doing so asynchronously), and all of this in no more\
    \ than nine lines of code. You can imagine the power of jQuery in just about any\
    \ scenario where you need your webpage to react to user input.\n\n# 13    Web\
    \ APIs\n\nAn API is a way for developers to interact with something complex in\
    \ an easier way with easier syntax. APIs are a vast topic in JavaScript, so we\
    \ are going to focus on an area of APIs called web APIs. Web APIs are nothing\
    \ more than web-based interfaces that offer a set of ways (like methods) you can\
    \ use to interact with things and request data that can be used in your app. Web\
    \ APIs are a core feature of JavaScript development and allow you to leverage\
    \ particularly useful tools that fall within another concept called browser APIs.\
    \ Browser APIs are interfaces specific to the browser and allow us to interact\
    \ with the device the browser is running on, and they form an interface that lets\
    \ our JavaScript code securely access resources outside of our app. Some of the\
    \ more common APIs used are browser history, geolocation, and browser storage.\n\
    \nIn this section, we’ll explore how web APIs facilitate browser navigation, geolocation,\
    \ and browser storage.\n\n## 13.1    Browser Navigation and History"
