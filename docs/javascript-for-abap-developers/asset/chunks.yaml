  trans: "\n\n在接下来的章节中，我们将讨论一些常见的错误类型以及如何看待它们，然后介绍 JavaScript 中两个关键的调试工具和错误处理。\n\n\
    ## 14.1 错误类型与视图\n\n有许多错误类型和场景，但它们超出了本 E-Bite 的涵盖范围。你将会遇到的一些较常见的错误包括表 14.1 所示的错误。\n\
    \n| 错误 | 示例 |\n| --- | --- |\n| <samp class=\"listingcharacter\">Uncaught TypeError:\
    \ Cannot Read Property ’property-name’ of undefined</samp> | 例如：调用一个未定义的属性。 |\n\
    | <samp class=\"listingcharacter\">ReferenceError: newaCr is not defined…</samp><samp\
    \ class=\"listingcharacter\">test-errors.js:9:16)</samp> | 例如：调用一个尚未存在的对象的方法。\
    \ |\n| <samp class=\"listingcharacter\">Uncaught TypeError: Cannot set property\
    \ ’innerHTML’ of null…</samp> | 例如：当你的 JavaScript 代码在 DOM 完全加载之前执行，且元素尚不存在时。 |\n\
    \n**表 14.1** 常见 JavaScript 错误\n\n这些错误中的大多数将指示错误的来源，包括发生错误的文件名和行号，如列表 14.1 所示。\n\
    \n```\nconsole.log(`${newaCr.make}`);\n               ^\nReferenceError: newaCr\
    \ is not defined\n    at Object.<anonymous> (C:\\users\\public\\car.js:9:16) \n\
    ```\n\n**列表 14.1** JavaScript 引用错误\n\n列表 14.1 中的错误发生在 <samp class=\"listingcharacter\"\
    >console.log()</samp> 语句处，发生是因为 <samp class=\"listingcharacter\">newaCr</samp>\
    \ 对象未定义（由于拼写错误）。我们看到了文件位置 <samp class=\"listingcharacter\">C:\\users\\public\\\
    car.js</samp>，以及分别从左侧的行号和字符 <samp class=\"listingcharacter\">9:16 (C:\\users\\\
    public\\car.js:9:16),</samp>，因此我们确切知道问题代码所在。如果我们在浏览器中工作，错误将显示在浏览器的控制台区域（参见图 14.1），如果我们是在开发服务器端的\
    \ Node.js 应用，那么则在终端窗口中（参见图 14.2）。\n\n![浏览器中的错误](img/img-f14.1.html)\n\n**图 14.1**\
