    \ Chrome 内置的调试工具引入这一概念，因为它们是最好的之一。首先，我们使用 <samp class=\"listingcharacter\">debugger;</samp>\
    \ 语句触发第一个 JavaScript 断点，并查看浏览器中有哪些选项。列表 14.2 显示了一个标准的 HTML 页面，该页面引用了列表 14.3 中的\
    \ JavaScript 代码，我们将在那里放置断点。在列表 14.3 中，我们在 <samp class=\"listingcharacter\">alertText</samp>\
    \ 变量赋值之前放置了一个 <samp class=\"listingcharacter\">debugger;</samp> 语句（我们的断点）。\n\n\
    ```html\n<!DOCTYPE html>\n<head>\n    <title>Document</title>\n    <script src=\"\
    app.js\"></script>\n</head>\n\n<body>\n    <h1>Let’s do some debugging!</h1>\n\
    \    <button id=\"button1\" onclick=\"onButtonClick()\">Press Me!</button>\n</body>\n\
    </html> \n```\n\n**列表 14.2** index.html\n\n```javascript\nconst onButtonClick\
    \ = () => {\n  debugger;\n  let alertText = \"Button clicked!\";\n  alert(alertText);\n\
    }; \n```\n\n**列表 14.3** app.js\n\n我们运行列表 14.2 中的网页，并使用 <samp class=\"listingcharacter\"\
    >debugger;</samp> 语句触发第一个 JavaScript 断点，并查看浏览器中有哪些选项。列表 14.2 显示了一个标准的 HTML 页面，该页面引用了列表\
    \ 14.3 中的 JavaScript 代码，我们将在那里放置断点。在列表 14.3 中，我们在 <samp class=\"listingcharacter\"\
    >alertText</samp> 变量赋值之前放置了一个 <samp class=\"listingcharacter\">debugger;</samp>\
    \ 语句（我们的断点）。\n\n（注：此处已跳过原文中后续大量的重复段落，直接进入非重复内容）\n\n我们在 Chrome DevTools 的源代码（Sources）选项卡中看到\
    \ <samp class=\"listingcharacter\">debugger;</samp> 语句被高亮并处于断点状态。为了触发断点，我们需要按\
    \ F12 打开 Chrome Dev Tools，然后刷新并点击 Press Me。\n\n"
- fmt: "\nWe run the code, and should see `\"Mercedes\"` logged to the console, but\
    \ instead see `undefined` logged to the console. We place a breakpoint on our\
    \ variable assignment and step through our code from there. Just like in the ABAP\
    \ debugger, you can place a breakpoint by clicking in the left-hand column of\
    \ the code editor, and we do the same at the line where we assign our `newCar`\
    \ variable. We now see a red dot in [Figure 14.6](#14_002.html_f14.6), like in\
    \ the ABAP debugger.\n\n[![VS Code Breakpoint](bilderklein/klein14_006.png)](img-f14.6.html)\n\
    \n**Figure 14.6** VS Code Breakpoint\n\nNow that the breakpoint is set, click\
    \ the Run and Debug button `[Ctrl]` + `[Shift]` + `[D]` in the left column of\
    \ the VS Code window. Once we are in the debugging window, click the Run and Debug\
    \ button and select `Node.js` as our environment from the dropdown. That runs\
    \ our code and stops at the breakpoint we set. In our VS Code debugger window,\
    \ we can see similar sections to Chrome DevTools. In [Figure 14.7](#14_002.html_f14.7),\
    \ we have our `VARIABLES`, `CALL STACK`, and `BREAKPOINTS` sections on the left,\
    \ and our code and `DEBUG CONSOLE` on the right.\n\n[![VS Code Debugger](bilderklein/klein14_007.png)](img-f14.7.html)\n\
    \n**Figure 14.7** VS Code Debugger\n\nWe step through our variable assignment\
    \ by clicking the Step Over `[F10]` button once. At the bottom of the `DEBUG CONSOLE`,\
    \ we type in `newCar.make` and see the output `Mercedes`, as shown in [Figure\
    \ 14.8](#14_002.html_f14.8).\n\n[![VS Code Debug Console: Variable Test](bilderklein/klein14_008.png)](img-f14.8.html)\n\
    \n**Figure 14.8** VS Code Debug Console: Variable Test\n\nThis means our object\
    \ is instantiating correctly, so the problem must lie in our `console.log()` statement.\
    \ If we look closely, we see we misspelled the attribute as `.maek`. Run through\
    \ the rest of the code execution by clicking the Continue `[F5]` and correcting\
    \ the error.\n\nThis is just a small part of what can be done using a built-in\
    \ debugger like the one bundled with VS Code and, just like the ABAP debugger,\
    \ it will become a tool you cannot live without.\n\n## 14.3 Error Handling\n\n\
    In JavaScript, you can expect many unforeseen errors, and even though you have\
    \ some great tools to debug your code, it is crucial that you implement proper\
    \ error handling as well. As with all programming languages, proper error handling\
    \ is key to building a stable and robust application.\n\nCertain scenarios in\
    \ ABAP can be handled by a simple `IF` statement if you know what errors to expect.\
    \ However, there are scenarios where you need to play it safe with a `TRY CATCH`\
    \ block. To introduce you to error handling in JavaScript, we replicate an ABAP\
    \ `TRY CATCH` block and log a response to the console if we catch an error.\n\n\
    In [Listing 14.5](#14_003.html_l14.5), we wrap our corrected variable assignment\
    \ shown previously in [Listing 14.4](#14_002.html_l14.4) in a `try…catch` statement:\n\
    \n```\ntry {\n  let newCar = new car(\"Mercedes\");\n  console.log(`${newCar.make}`);\n\
    } catch {\n  console.log(\"Something went wrong\");\n} \n```\n\n**Listing 14.5**\
    \ fix-me.js: try…catch\n\nWe run the code and see `Mercedes` logged to the console.\
    \ We then break our code by logging the car object name (with a typo) to the console,\
    \ as follows:\n\n```\nconsole.log(`${newaCr.make}`); \n```\n\nWe run our app again\
    \ and we see the text `Something went wrong` from our `catch` statement logged\
    \ to the console, as there is no object called `newaCr`.\n\nWith this, we’ve concluded\
    \ our discussion of debugging and error handling in JavaScript. You’re now ready\
    \ to begin coding with JavaScript!\n\n# 15 What’s Next?\n\nYou’ve mastered the\
    \ JavaScript programming basics—now continue coding with SAP! Learn about the\
    \ SAPUI5 user interface, explore cloud-native application development, or broaden\
    \ your ABAP horizons and sharpen your code with clean coding tips. See where programming\
    \ with SAP PRESS can take you!\n\n![](bilderklein/klein1900.png)\n\n### Recommendation\
    \ from Our Editors\n\nDesign, enhance, and de-sign... (Note: The text provided\
    \ in the prompt was repetitive/fragmented maintaining the core structure).\n"
