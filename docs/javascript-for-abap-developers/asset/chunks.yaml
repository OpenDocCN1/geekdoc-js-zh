  trans: "\n要在你的网页上运行 JavaScript，需要使用 `<script>` 标签将其嵌入。这些 `<script>` 标签可以包含实际的 JavaScript\
    \ 代码，例如简单的函数：\n\n```\n<script>function changeSomeText() {alert(\"Hi there!\"}</script>\
    \ \n```\n\n你也可以引用一个外部 JavaScript 文件（例如 `app.js`），该文件包含你所有的 JavaScript 逻辑，这是最佳实践，如下：\n\
    \n```\n<script src=\"app.js\"></script> \n```\n\n这些 `<script>` 标签可以放置在 HTML 页面的\
    \ `<head>` 或 `<body>` 标签内。\n\n在第一个示例中，我们将直接在 HTML 文件的 `<head>` 标签中添加一个 JavaScript\
    \ 函数。然后，我们将触发一个标准的 HTML 事件 `onclick()`（即按钮点击事件），以便在点击“Try it”按钮时运行该函数。\n\n开始之前，创建一个新文件夹，添加一个名为\
    \ `index.html` 的文件，并将 Listing 1.1 中所示的代码片段复制到其中。\n\n```\n<!DOCTYPE html>\n<html\n\
    <head>\n    <script>\n        function changeSomeText() {\n            document.getElementById(\"\
    test\").innerHTML = \"Some new text appeared!\";\n        }\n    </script>\n</head>\n\
    <body>\n    <div id=\"text-div\">\n        <h1>A normal everyday webpage</h1>\n\
    \        <p id=\"test\">Some old text.</p>\n    </div>\n    <div id=\"button-div\"\
    >\n        <button type=\"button\" onclick=\"changeSomeText()\">Try it</button>\n\
    \    </div>\n</body>\n</html> \n```\n\n**Listing 1.1**     `<head>` 标签中的 JavaScript\
    \ 函数\n\n保存文件并运行你的代码，你应该能看到你的 HTML 网页。点击“Try it”按钮，如果一切顺利，文本应该会变为“Some new text\
    \ appeared!”，如图 Figure 1.2 所示。你刚刚创建了自己的第一个 JavaScript 函数，并通过一个标准的 HTML 事件触发了它。\n\
    \n现在，我们将从 `<head>` 部分移除 `<script>` 标签（包含我们的 JavaScript 代码），并将其放置在 HTML 页面结束的 `</body>`\
    \ 标签之前，即按钮之后。刷新你的 HTML 页面并再次点击“Try it”按钮。你应该会看到与 Listing 1.2 相同的文本变化。\n\n![`<head>`\
    \ 标签中的 JavaScript 函数](img/img-f1.2.html)\n\n**Figure 1.2**     `<head>` 标签中的 JavaScript\
    \ 函数\n\n```\n<!DOCTYPE html>\n<html\n<body>\n    <div id=\"text-div\">\n     \
    \   <h1>A normal everyday webpage</h1>\n        <p id=\"test\">Some old text.</p>\n\
    \    </div>\n    <div id=\"button-div\">\n        <button type=\"button\" onclick=\"\
    changeSomeText()\">Try it</button>\n    </div>\n    <script>\n        function\
    \ changeSomeText() {\n            document.getElementById(\"test\").innerHTML\
    \ = \"Some new text appeared!\";\n        }\n    </script>\n</body>\n</html> \n\
    ```\n\n**Listing 1.2**     `<body>` 标签中的 JavaScript 函数\n\n将脚本标签添加到 `<body>` 部分而不是\
    \ `<head>` 部分的主要区别在于，你可以提高页面显示速度；即如果 `<script>` 标签位于 `<body>` 部分的底部，页面元素加载得更快，让你的页面元素先加载，然后是\
    \ `<script>` 标签（后者可能需要更长的解释）。\n\n现在，我们将从 HTML 页面中移除所有的 JavaScript，并将其放在一个名为 `app.js`\
    \ 的外部文件中。这样做的好处包括可读性、可维护性和复用性。你可以从任何 HTML 页面引用相同的 JavaScript 代码，只需要编写一次代码，遵循不要重复自己（DRY）的最佳实践。\n\
    \n创建一个新文件夹，并在其中创建 Listing 1.3 和 Listing 1.4 所示的两个文件，并为每个文件添加相关代码。\n\n```\n<!DOCTYPE\
    \ html>\n<html\n<head>\n    <script src=\"app.js\"></script>\n</head>\n<body>\n\
    \    <div id=\"text-div\">\n        <h1>A normal everyday webpage</h1>\n     \
    \   <p id=\"test\">Some old text.</p>\n    </div>\n    <div id=\"button-div\"\
    >\n        <button type=\"button\" onclick=\"changeSomeText()\">Try it</button>\n\
    \    </div>\n</body>\n</html> \n```\n\n**Listing 1.3**     index.html（引用外部文件）\n\
    \n```javascript\nfunction changeSomeText() {\n  document.getElementById(\"test\"\
    ).innerHTML = \"Some new text appeared!\";\n}\n```\n\n**Listing 1.4**     app.js（外部文件）\n\
    \n注意我们引用了名为 `app.js` 的 JavaScript 文件，因为它与 HTML 文件在同一个目录下。这并不总是如此，所以你需要在 HTML 结构中的任何地方引用外部文件。更多信息请参见[`www.w3schools.com/html/filepaths.asp`](https://www.w3schools.com/html/filepaths.asp)。\n\
    \n## 1.5 使用 Node.js 的 JavaScript 代码\n\nNode.js 是另一个基于 Chrome V8 引擎的 JavaScript\
    \ 运行时，允许你在浏览器之外运行代码。要设置 Node.js，请从 [`nodejs.org/download/`](https://nodejs.org/download/)\
    \ 下载并安装适用于特定操作系统（OS）的版本。安装完成后，在 VS Code 中打开终端并输入 `node`。你应该能看到如 Figure 1.3 所示的输出。\n\
    \n![node 命令](img/img-f1.3.html)\n\n**Figure 1.3**     node 命令\n\n现在，我们将使用 Node.js\
    \ 运行一些 JavaScript 并输出到控制台。创建一个名为 `my-first-node.js` 的 JavaScript 文件，添加以下代码：\n\n\
    ```javascript\nconsole.log(\"Hello, this file was executed!\");\n```\n\n我们可以在终端中使用\
    \ `node` 命令执行该文件，假设 `my-first-node.js` 文件位于当前目录。运行它：\n\n```\nnode my-first-node.js\n\
    ```\n\n你应该在终端看到输出 `Hello, this file was executed!`。恭喜！使用了 Node.js 在本地机器上运行了 JavaScript\
    \ 代码。我们在后续示例将遵循相同的过程。\n\n## 1.6 注释\n\nJavaScript 代码中的注释起着与 ABAP 注释相同的作用。JavaScript\
    \ 使用 `//` 进行单行注释。例如：\n\n```javascript\n// 这是一个注释\n```\n\n你可以使用它来注释掉代码的某行，完全如下：\n\
    \n```javascript\nconsole.log(\"test\") // 这行代码写入控制台\n```\n\n你还有使用 `/*` 开始并以 `*/`\
    \ 结束的多行注释选项，如 Listing 1.5 所示：\n\n```javascript\n/*\n注释可以跨多行\n*/\n```\n\n**Listing\
    \ 1.5**     多行注释\n"
- fmt: "\nIn VS Code, for example, you can use the keyboard shortcut `Ctrl` + `[/]`\
    \ to comment/uncomment selected lines of code.\n\n# 2 Variables and Data Types\n\
    \nAs with ABAP, JavaScript variables are there to store values that can be used\
    \ throughout your program. As mentioned in section [Section 1](#01_001.html_h1),\
    \ vanilla (standard) JavaScript is a loosely typed programming language, while\
    \ ABAP in comparison is strongly typed. This means that you can define a variable\
    \ in JavaScript with just a value and no type declaration, like an inline declaration\
    \ in ABAP. However, in JavaScript, you can also declare a variable with no value\
    \ and its type would remain undefined until you assigned a value to it. You can\
    \ even reassign variables, so if a variable is of type `number`, you can change\
    \ its type to `string` just by reassigning a new `string` type value to it.\n\n\
    This flexibility is great because it allows you to quickly build something, make\
    \ changes, and execute ideas without adhering to the strict rules of something\
    \ like the ABAP compiler. However, you must approach your variables with caution\
    \ as you use them throughout your code; a function might rely on a variable being\
    \ of a certain type, and since it’s easy for that variable type to change, that\
    \ function is more likely to break for no apparent reason.\n\nIn this section,\
    \ we’ll run through how to declare variables using old versus modern syntax, as\
    \ well as what data types you can use. We’ll also look at accessing those variables\
    \ in the context of global and local scope.\n\n## 2.1 Variables\n\nIn ABAP, you\
    \ use the `DATA` statement to define a variable, including its type and possibly\
    \ a value as well, as follows:\n\n```\nDATA: lv_car TYPE string VALUE \"Mercedes\"\
    .\n```\n\nIn JavaScript, you declare and assign values to your variables using\
    \ the assignment operator (the `=` sign). You also have comparison operators that\
    \ look remarkably similar; for example, `==,`, which means “equal to.” We will\
    \ look at comparison operators in more detail in [Section 3](#03_001.html_h3).\
    \ Using the `=` sign in your variable declarations will look like [Listing 2.1](#02_001.html_l2.1).\n\
    \n```\nvar a = 10;        // Assign a numeric value to a\nvar b = 12;        //\
    \ Assign a numeric value to b\nvar c = a + b;    // Assign the sum of a and b\
    \ to c\nconsole.log(a)\nconsole.log(b)\nconsole.log(c) \n```\n\n**Listing 2.1\
    \ Variable Declaration**\n\nThe output is as follows:\n\n```\n10\n12\n22 \n```\n\
    \nNotice how you can assign a number to a variable, as well as the sum of numbers\
    \ or variables. Try renaming your variables to something more appropriate like\
    \ our example in [Listing 2.2](#02_001.html_l2.2).\n\n```\nvar applePrice = 10;\
    \            // Assign a numeric value to a\nvar bannanaPrice = 12;          \
    \  // Assign a numeric value to b\nvar total = applePrice + bannanaPrice;    //\
    \ Assign the sum of a and b to c\nconsole.log(applePrice);\nconsole.log(bananaPrice);\n\
    console.log(total); \n```\n\n**Listing 2.2 Renamed Variables**\n\nThe output would\
    \ be the same:\n\n```\n10\n12\n22 \n```\n\nAll JavaScript variables must use unique\
    \ names (known as identifiers), be as descriptive as possible, and follow these\
    \ general rules:\n\n*   Identifiers are case sensitive. `A` is different than\
    \ `a`.\n*   Identifiers must start with a letter.\n*   Identifiers must not use\
    \ reserved JavaScript keywords like `var` or `function`.\n*   Identifiers can\
    \ contain numbers, letters, dollar signs, and underscores.\n*   Although not really\
    \ a rule, you can decide if you want to use camel case or not.\n\nStrings in JavaScript\
    \ are assigned using quotation marks, while numbers are not. In the example in\
    \ [Listing 2.3](#02_001.html_l2.3), notice how we can store either numbers or\
    \ strings in our variables, as well as being able to chain variables together\
    \ and log them to the console.\n\n```\nvar height = 1.8;\nvar firstName = \"John\"\
    ;\nvar lastName = \"Smith\";\nconsole.log(firstName + \" \" + lastName + \" is\
    \ \" + height + \"m tall.\"); \n```\n\n**Listing 2.3 String and Number Variables**\n\
    \nThe output is as follows:\n\n```\nJohn Smith is 1.8m tall. \n```\n\nJust like\
    \ the previous example, try and use that same `+` sign to add some numbers together,\
    \ but have one of the numbers in quotation marks like you would with a string,\
    \ as shown in [Listing 2.4](#02_001.html_l2.4). The fact that the first number\
    \ is in quotations means the rest of the numbers will be treated as strings, making\
    \ the variable of type `string`.\n\n```\nvar a = \"9\" + 1 + 7;\nconsole.log(a);\n\
    console.log(typeof a) \n```\n\n**Listing 2.4 Variable Type Influence**\n\nThe\
    \ output is as follows:\n\n```\n917\nstring \n```\n\nYou can also declare empty\
    \ variables (variables with no value), which in JavaScript means that this variable\
    \ has a value of undefined, as shown in [Listing 2.5](#02_001.html_l2.5). In the\
    \ next line, when you have assigned a value to the variable, if you try to log\
    \ the variable to the console you will now see the new value.\n\n```\nvar firstName;\n\
    console.log(firstName);\nfirstName = \"John\";\nconsole.log(firstName); \n```\n\
    \n**Listing 2.5 Undefined Variable**\n\nThe output is as follows:\n\n```\nUndefined\n\
    John \n```\n\n## 2.2 Data Types\n\nIn JavaScript, you have six data types known\
    \ as “primitives.” A data type in JavaScript is considered primitive if it is\
    \ not an object and has no methods that can be changed (the types themselves are\
    \ immutable).\n\nThis contrasts with JavaScript structural types, like arrays\
    \ and objects, which are mutable and can be changed (which we’ll discuss in more\
    \ detail in [Section 5)). [Listing 2.6](#02_002.html_l2.6) shows a list of some\
    \ of the data types (both primitive and structural) and how you could declare\
    \ them.\n\n```\nvar car // undefined (primitive type)\nvar weightKg = 10; // Number\
    \ (primitive type)\nvar dogsName = \"Spot\"; // String (primitive type)\nvar isTaskComplete\
    \ = false; // Boolean (primitive type)\nvar numberArray = [1,2,3,4,5] // Object\
    \ (structural type)\nvar object = {firstName:\"John\", \nlastName:\"Smith\"};\
    \ // Object (structural type) \n```\n\n**Listing 2.6 JavaScript Types**\n\nYou\
    \ can declare empty variables, where the value and type are both undefined, as\
    \ follows:\n\n```\nvar car; \nconsole.log(car); // undefined\nconsole.log(typeof\
    \ car); // undefined\n```\n\nYou can also declare a blank variable where the value\
    \ is blank but the type is `string`, as follows:\n\n```\nvar car = \"\"; \nconsole.log(car);\
    \ // blank\nconsole.log(typeof car); // string\n```\n\nTo make things more complex,\
    \ you can take a variable like `car` and change its type in the same scope. This\
    \ is why JavaScript is said to have dynamic types, and why you need to pay special\
    \ attention to your variables. For example, [Listing 2.7](#02_002.html_l2.7) shows\
    \ how we start with a `car` variable with type `undefined` and assign a string\
    \ `BMW`, which changes the variable type to `string`. We then change the type\
    \ twice more, from `string` to `boolean` and finally to `number`, just to assign\
    \ a new value.\n\n```\nvar car;\nconsole.log(typeof car); // undefined\ncar =\
    \ \"BMW\";\nconsole.log(typeof car); // string\ncar = true;\nconsole.log(typeof\
    \ car); // boolean\ncar = 24;\nconsole.log(typeof car); // number \n```\n\n**Listing\
    \ 2.7 Dynamic Types**\n"
