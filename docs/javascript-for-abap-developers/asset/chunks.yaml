    \n## 14.2 调试\n\nJavaScript 及其动态类型系统的特性意味着，你将看到许多无法提供关于何处出现错误的指示的 Bug，你需要在代码中放置那个重要的断点。在\
    \ VS Code 中，你可以在产生问题的代码行放置断点，或者你可以使用 <samp class=\"listingcharacter\">debugger;</samp>\
    \ 语句，这类似于 ABAP 中的 <samp class=\"listingcharacter\">BREAK-POINT</samp> 语句。然后你可以使用\
    \ IDE 内置的调试器（在本文中是 VS Code）命中这些断点，或者在浏览器的开发者工具面板（在本文中是 Chrome DevTools）中命中你的断点。\n\
    \n我们将在接下来的章节中详细查看这两个工具。\n\n### 使用 Chrome DevTools 调试\n\n大多数主流浏览器都有自己的调试工具 set，但我们通过\
