    \ and add a <samp class=\"listingcharacter\">Lion</samp> to the beginning of the\
    \ array at index <samp class=\"listingcharacter programmingelement\">0</samp>.\n\
    \n```\nlet petArray = [\"Dog\", \"Cat\", \"Bird\", \"Fish\", \"Reptile\"];\npetArray.splice(0,\
    \ 0, \"Lion\");\nconsole.table(petArray); /* \n[\"Lion\", \"Dog\", \"Cat\", \"\
    Bird\", \"Fish\",// \"Reptile\"]; */ \n```\n\n**Listing 5.10**     splice() Method:\
    \ Add Item to an Array\n\nThe flexibility of the <samp class=\"listingcharacter\"\
    >splice()</samp> method means you can either replace one item with another or\
    \ remove it entirely. In [Listing 5.11](#05_001.html_l5.11), we remove <samp class=\"\
    listingcharacter\">Lion</samp> from our <samp class=\"listingcharacter\">petArray</samp>\
    \ because it is not really a suitable pet. After that, we remove <samp class=\"\
    listingcharacter\">Dog</samp> and replace it with two new items, <samp class=\"\
    listingcharacter\">Small Dog</samp> and <samp class=\"listingcharacter\">Big Dog</samp>.\n\
    \n```\nlet petArray = [\"Lion\", \"Dog\", \"Cat\", \"Bird\", \"Fish\", \"Reptile\"\
    ];\npetArray.splice(0, 1);\nconsole.table(petArray); // [\"Dog\", \"Cat\", \"\
    Bird\", \"Fish\", \"Reptile\"];\npetArray.splice(0, 1, \"Small Dog\", \"Big Dog\"\
    );\nconsole.table(petArray); /* \n[\"Small Dog\", \"Big Dog\", \"Cat\", \"Bird\"\
    ,// \"Fish\",\"Reptile\"]; */ \n```\n\n**Listing 5.11**     Array: splice() Method:\
    \ Delete and Replace Items\n\n###### Important Note\n\nNotice that when we call\
    \ <samp class=\"listingcharacter\">splice()</samp> the second time, we pass in\
    \ the same index (index <samp class=\"listingcharacter programmingelement\">0</samp>)\
    \ as the first <samp class=\"listingcharacter\">splice(),</samp> even though <samp\
    \ class=\"listingcharacter\">Dog</samp> is at index <samp class=\"listingcharacter\
    \ programmingelement\">1</samp>. This is because when we execute the first <samp\
    \ class=\"listingcharacter\">splice()</samp> and remove <samp class=\"listingcharacter\"\
    >Lion</samp> at index <samp class=\"listingcharacter programmingelement\">0</samp>,\
    \ the whole array updates and shifts <samp class=\"listingcharacter\">Dog</samp>\
    \ to where <samp class=\"listingcharacter\">Lion</samp> was. This data mutation\
    \ is something you should approach with caution. Data mutation is a critical concept\
    \ in JavaScript due to its dynamic nature; the less things change in your logic,\
    \ the less there is to keep track of or potentially break.\n\n## 5.2    Objects\
    \ and Object Methods\n\nJavaScript objects are like structures in ABAP in that\
    \ they are used to store more detailed information. They are made up of <samp\
    \ class=\"listingcharacter\">name:value</samp> pairs separated by a comma and\
    \ held within <samp class=\"listingcharacter\">{}</samp>. Think of a car; normally,\
    \ you do not just have one property such as the <samp class=\"listingcharacter\"\
    >make</samp>, but rather the <samp class=\"listingcharacter\">make</samp>, <samp\
    \ class=\"listingcharacter\">model</samp>, <samp class=\"listingcharacter\">topSpeed,</samp>\
    \ and so on as follows:\n\n```\nlet car = { make: \"Mercedes\", model: \"S Class\"\
    , topSpeed: 320 }; \n```\n\nJavaScript arrays are like ABAP internal tables, and\
    \ JavaScript objects are like work areas/structures that make up the records of\
    \ an internal table. In [Listing 5.12](#05_002.html_l5.12), we take our car example\
    \ further and create an array of different car objects and log that array of objects\
    \ to the console. In [Listing 5.12](#05_002.html_l5.12), we see a table output\
    \ with Mercedes, BMW, and Audi cars with some of their specs. Then, we log the\
    \ <samp class=\"listingcharacter\">car</samp> object at index <samp class=\"listingcharacter\
    \ programmingelement\">1</samp> using <samp class=\"listingcharacter\">carArray[1].make</samp>.\n\
    \n```\nlet carArray = [\n  {\n    make: \"Mercedes\",\n    model: \"A Class AMG\"\
    ,\n    colour: \"Black\",\n    topSpeed: 168,\n  },\n  {\n    make: \"BMW\",\n\
    \    model: \"M Series\",\n    colour: \"White\",\n    topSpeed: 150,\n  },\n\
    \  {\n    make: \"Audi\",\n    model: \"S4\",\n    colour: \"Blue\",\n    topSpeed:\
    \ 173,\n  },\n];\nconsole.table(carArray);\nconsole.log(carArray[1].make); //\
    \ BMW \n```\n\n**Listing 5.12**     Array of JavaScript Objects\n\n# 6    JSON"
