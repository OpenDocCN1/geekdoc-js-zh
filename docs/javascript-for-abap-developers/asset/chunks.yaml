  trans: "\n在这个函数内部，我们创建了一个名为 `xhttp` 的新 `XMLHttpRequest` 对象，并使用该对象来构建我们的请求。首先，我们调用\
    \ `.open` 方法，传入请求类型 `GET` 以及本地文件 `test_data.json` 的路径，并将第三个参数设置为 `true`，这告诉程序异步运行调用。设置好请求后，我们调用\
    \ `.send()` 方法来发送请求。接着，我们指定了 `.onreadystatechange()` 方法，它会监听请求的响应。当它接收到响应时，会执行\
    \ `=` 之后的函数。在该函数中，我们检查 `readyState` 是否为 `4` 且 `http` 状态是否为 `200`（意味着调用成功），然后我们将\
    \ `id` 为 `text` 的 `<p>` 标签的 `innerHTML` 修改为响应文本。\n\n在代码列表 11.3 中，我们有一些 `car` JSON\
    \ 数据，现在我们可以在网页上看到这些数据，替换原来的 `Some text`。\n\n```json\n[\n  {\n    \"make\": \"\
    Mercedes\",\n    \"model\": \"A Class\",\n    \"Color\": \"White\",\n    \"picture\"\
    : \"http://placehold.it/32x32\",\n    \"topSpeed\": 300\n  }\n] \n```\n**代码列表\
    \ 11.3** test_data.json\n\n## 11.2 现代语法：Fetch API\n\n好消息是，在大多数现代浏览器中，有一种简单得的方法可以请求数据，那就是\
    \ Fetch API。Fetch API 之之处在于，当我们用它调用 API 端点时，它会返回一个 JavaScript promise（承诺），这处理起来容易得多。我们可以根据\
    \ promise 的解析（成功）或拒绝（失败）来调整我们的逻辑。\n\n`fetch` 请求的基本语法如代码列表 11.4 所示。\n\n```javascript\n\
    fetch(\"https://urlendpoint.com\")\n  .then(\"Success\")\n  .catch(\"Failure\"\
    ); \n```\n\n**代码列表 11.4** Fetch API 语法\n\n在代码列表 11.5 中，我们使用 Fetch API 从本地文件 `test_data.json`\
    \ 调用了相同的数据。我们将代码列表 11.2 中的 `sendRequest` 函数替换为代码列表 11.5 => {\n  fetch(\"test_data.json\"\
    )\n    .then((response) => response.json())\n    .then((body) => {\n      document.getElementById(\"\
    text\").innerHTML = body[0][\"make\"];\n    })\n    .catch((error) => {\n    \
    \  console.log(error);\n    });\n}; \n```\n\n**代码列表 11.5** Fetch 请求\n\n现在我们看到页面上的\
    \ `Mercedes` 替换了 `Some text`。在 `sendFetchRequest` 函数内部，我们调用了 `fetch` 请求，并在括号中传入了想要读取的本地文件\
    \ `test_data.json` 的路径。该 `fetch` 请求返回一个 JavaScript promise 并解析（成功），触发了我们的第一个 `.then()`\
    \ 语句。在该 `.then()` 语句内部，我们创建一个函数，将请求的 `(response)` 作为参数导入并将其转换为 JSON 格式。当格式化完成后，我们进入第二个\
    \ `.then()` 语句，在那里我们获取 JSON 格式的响应并提取索引为 `[0]` 的对象。索引 `[0]` 处的 JSON 数据拥有一个键值对 `\"\
    make\": \"Mercedes\"`，我们通过 JSON 属性 `[make]` 访问该值，并将[代码列表 11.1]中的 `<p>` 标签更改为该值\
    \ `Mercedes`。我们还有一个 `.catch()` 语句来捕获请求过程中可能出现的任何 promise 拒绝或错误，并将这些错误记录到控制台。\n\
    \n# 12 jQuery：你的第一个 JavaScript 库\n\nJavaScript 的流行在很大程度上归功于其海量的库和框架，包括 SAPUI5，你可以用它们完成几乎任何事情。JavaScript\
    \ 库帮助我们“以少力办更多事”，并将许多在标准 JavaScript 中需要编写的复杂逻辑抽象为更用户友好的方式。世界上最流行的库之一是 jQuery ([`jquery.com/`](https://jquery.com/))，由\
    \ John Resig 创建，它已成为 JavaScript 的标准。\n\n像 jQuery 这样的库令人兴奋的地方在于，它抽象了我们在之前章节中使用的所有逻辑（参见第\
    \ 7 节 和第 11 节），使得遍历和操作 DOM、处理 HTML 事件以及处理 AJAX 变得更加简单。这使其成为学习 JavaScript 库的完美起点。\n\
    \n在本节中，我们将导入 jQuery 库并介绍关键的 jQuery 逻辑，包括使用选择器、注册事件、更改 HTML 和 DOM 元素以及 CSS，以及进行\
    \ AJAX 查询。\n\n## 12.1 导入 jQuery 库\n\n我们首先的工作是设置环境并导入 jQuery 库，以便在 `app.js` 文件中使用它。外部\
    \ JavaScript 库的导入方式与我们之前的 `app.js` 文件相同，因为它们只是包含 JavaScript 代码的文件。我们遵循之前在第 4 节和代码列表\
    \ 1.3 中所示的逻辑，在 `index.html` 文件中声明了一个 `<script>` 标签，其中包含了对文件的引用。\n\n有两种方法可以导入或安装\
    \ jQuery。从 [`jquery.com/download/`](https://jquery.com/download/) 下载 jQuery JavaScript\
    \ 代码并将其添加到项目文件夹，或者如果我们使用 `node`，可以使用 `npm`（node 包管理器）将其作为依赖安装。为了简单起见，我们像添加 `app.js`\
    \ 文件一样将其添加到项目文件夹，因为 jQuery 代码本质上就是一个 JavaScript 文件。我们创建一个 `jquery-3.6.0.min.js`\
    \ 文件，文件名与下载的版本匹配。在编写时，我们下载了此版本：[`code.jquery.com/jquery-3.6.0.min.js`](https://code.jquery.com/jquery-3.6.0.min.js)。然后，我们将下载的\
    \ jQuery 文件中的所有代码复制到 `jquery-3.6.0.min.js` 文件中，创建 `index.html` 文件，并在 `<script>`\
    \ 标签中分别包含 jQuery 和 `app.js` 文件的引用，如代码列表 12.1 所示。\n\n"
- fmt: "\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <script src=\"\
    jquery-3.6.0.min.js\"></script>\n    <script src=\"app.js\"></script>\n    <title>Document</title>\n\
    </head>\n<body>\n    <div>\n        <h1 id=\"heading1\">Let's try out some jQuery</h1>\n\
    \        <p id=\"text1\">jQuery is awesome!</p>\n        <a id=\"link1\" href=\"\
    https://jquery.com/\" target=\"_blank\">jQuery.com</a>\n    </div>\n    <div style=\"\
    padding-top: 5px; padding-bottom: 5px;\">\n        <button id=\"button1\">Press\
    \ me!</button>\n    </div>\n    <div id=\"form-div\">\n        <form id=\"form\"\
    >\n            <h4>Newsletter Signup</h4>\n            <label for=\"email\">Email</label><br>\n\
    \            <input type=\"text\" id=\"email\" name=\"fname\"><br>\n        </form>\n\
    \        <button id=\"form-button\">Submit</button>\n    </div>\n</body>\n</html>\n\
    ```\n\nListing 12.1 `index.html`\n\nFinally, create an `app.js` file and copy\
    \ the initial code shown in [Listing 12.2](#12_001.html_l12.2) into it, which\
    \ can now access the jQuery library.\n\n```javascript\n$(document).ready(() =>\
    \ {\n  alert(\"Document is loaded!\");\n});\n```\n\nListing 12.2 `app.js`\n\n\
    We run our `index.html` page from [Listing 12.1](#12_001.html_l12.1), where we\
    \ see that once our page has fully loaded, an alert saying Document is loaded!\
    \ appears, as shown in [Figure 12.1](#12_001.html_f12.1). In [Listing 12.2](#12_001.html_l12.2),\
    \ we call the `$(document).ready()` function, which is a jQuery wrapper that ensures\
    \ any code within this function (in our case, the alert) is executed only when\
    \ the webpage has finished loading.\n\n[![Alert Triggered inside jQuery](bilderklein/klein12_001.png)](img-f12.1.html)\n\
    \nFigure 12.1 Alert Triggered inside jQuery\n\n## 12.2 Using jQuery Selectors\n\
    \nIn [Listing 12.2](#12_001.html_l12.2), notice the jQuery syntax is a bit different\
    \ than standard JavaScript. The `$` sign followed by the brackets `$(document)`\
    \ is called a jQuery selector and replaces the long method calls we used in previous\
    \ sections, i.e., `document.getElementById(\"text\")`. As before, we can select\
    \ HTML DOM elements like our `<p>` tags using the syntax `$(\"p\")`. If you wanted\
    \ to select an element by its `id`, you include a `#` symbol like this: `$(\"\
    #text1\")`.\n\nWe remove the `alert` from [Listing 12.2](#12_001.html_l12.2) and\
    \ add the code from [Listing 12.3](#12_002.html_l12.3) inside the `$(document).ready()`\
    \ function, where we will use our button to change the text in the `<p>` tag.\n\
    \n```javascript\n$(\"#button1\").click(() => {\n    $(\"#text1\").text(\"This\
    \ text changed!\");\n  });\n```\n\nListing 12.3 jQuery Button Event\n\nThere are\
    \ many jQuery selectors to choose from and they are all there to help you easily\
    \ traverse the DOM. There are too many to address in this E-Bite, but some worth\
    \ noting include the following:\n\n* `$(`:button\")` selects all `<button>` elements\
    \ and can be applied to and other HTML elements.\n* `$(p:first)` and `$(p:last)`\
    \ selects the first and last `<p>` tags in the DOM, respectively.\n* `$(\"p#text1\"\
    )` selects all `<p>` tags with an `id` of `text1`.\n* `$(\"*\")` selects all elements\
    \ on the webpage.\n\n## 12.3 Registering Events\n\nIn our example, notice that\
    \ we inadvertently registered an HTML `onclick` event just by calling the jQuery\
    \ `.click()` method. In jQuery, registering standard HTML events is a breeze,\
    \ because you can register your event and the function it calls within your JavaScript\
    \ file without needing to create a reference in your HTML file.\n\nLet’s reimplement\
    \ the example in [Section 8](#08_001.html_h8), where we registered the mouse hover\
    \ logic that handles what happens when we hover over text with the mouse and then\
    \ move off again. We add the code shown in [Listing 12.4](#12_003.html_l12.4)\
    \ to our `$(document).ready()` function.\n\n```javascript\n$(\"#text1\").on({\n\
    \    mouseenter: function () {\n      $(this).text(\"Hey! You hovered over me!\"\
    );\n    },\n    mouseleave: function () {\n      $(this).text(\"jQuery is awesome!\"\
    );\n    },\n  });\n```\n\nListing 12.4 mouseenter and mouseleave Events\n\nWe\
    \ now see the text change when you hover over it and change back when you move\
    \ your mouse away. Also, notice that we were able to register two events (`mouseenter`\
    \ and `mouseleave`) events under one selector using the `.on()` statement. This\
    \ makes the syntax more readable as both these events are normally linked with\
    \ each other and should naturally be grouped together. Inside each event handler\
    \ function, we have made use of the `this` keyword, which refers to the context\
    \ of the `#text1` selector that wraps our two mouse hover events. You could also\
    \ swap the (`this`) keyword for `#text1`.\n\n## 12.4 Changing HTML Elements\n\n\
    To change the text of our HTML element in the previous section, we use the `.text()`\
    \ statement. Inside the brackets, we put the new text we want to change to. This\
    \ is just one of the many methods jQuery has to change almost anything in the\
    \ DOM. We can append text rather than replace it entirely by taking `$(\"#text1\"\
    ).text()` and replacing the `.text()` method with either `.append()` or `.prepend()`.\
    \ When we click the Press Me! button, the text will be added (either at the beginning\
    \ or the end, depending on the method) rather than replace the text already there.\
    \ The following would place the text at the end:\n\n```javascript\n$(\"#text1\"\
    ).append(\"This text changed!\");\n```\n\nYou can place the text at the beginning\
    \ via the following:\n\n```javascript\n$(\"#text1\").prepend(\"This text changed!\"\
    );\n```\n\nLet’s try another real-world example with the jQuery newsletter sign-up\
    \ form on our page. The newsletter form DOM elements are all wrapped in a `div`\
    \ with an `id` of `form`. We want the user to sign up for the newsletter by entering\
    \ their email in the input and clicking the Submit button. When they click Submit,\
    \ we want the form to disappear as there’s no need for it after they have signed\
    \ up. We add the code from [Listing 12.5](#12_004.html_l12.5) to our `$(document).ready()`\
    \ function.\n\n```javascript\n$(\"#form-button\").click(() => {\n    $(\"#form-div\"\
    ).hide(\"slow\");\n  });\n```\n\nListing 12.5 jQuery .hide() form\n"
