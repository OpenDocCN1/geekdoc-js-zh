  raw: "In the following sections, we’ll discuss some common types of errors and how\
    \ they are viewed, before walking through the two key debugging tools and error\
    \ handling in JavaScript.\n\n## 14.1    Error Types and Views\n\nThere are many\
    \ error types and scenarios, but they are beyond the scope of this E-Bite. Some\
    \ of the more common errors you will come across include those shown in [Table 14.1](#14_001.html_t14.1).\n\
    \n| Error | Example |\n\n| --- | --- |\n\n| <samp class=\"listingcharacter\">Uncaught\
    \ TypeError: Cannot Read Property ’property-name’ of undefined</samp> | E.g.,\
    \ calling an attribute that is undefined. |\n\n| <samp class=\"listingcharacter\"\
    >ReferenceError: newaCr is not defined…</samp><samp class=\"listingcharacter\"\
    >test-errors.js:9:16)</samp> | E.g., calling a method of an object that doesn’t\
    \ exist yet. |\n\n| <samp class=\"listingcharacter\">Uncaught TypeError: Cannot\
    \ set property ’innerHTML’ of null…</samp> | E.g., when your JavaScript code executes\
    \ before the DOM is fully loaded and the element does not exist yet. |\n\n**Table\
    \ 14.1**     Some Common JavaScript Errors\n\nMost of these errors will indicate\
    \ where the error is coming from, including the file name and line number where\
    \ the error occurred, as shown in [Listing 14.1](#14_001.html_l14.1).\n\n```\n\
    console.log(`${newaCr.make}`);\n               ^\nReferenceError: newaCr is not\
    \ defined\n    at Object.<anonymous> (C:\\users\\public\\car.js:9:16) \n```\n\n\
    **Listing 14.1**     JavaScript Reference Error\n\nThe error in [Listing 14.1](#14_001.html_l14.1)\
    \ happened at the <samp class=\"listingcharacter\">console.log()</samp> statement,\
    \ and occurred because the <samp class=\"listingcharacter\">newaCr</samp> object\
    \ is not defined (because of a typo). We see the file location <samp class=\"\
    listingcharacter\">C:\\users\\public\\car.js</samp> with the line number and characters\
    \ from the left, respectively, <samp class=\"listingcharacter\">9:16 (C:\\users\\\
    public\\car.js:9:16),</samp> so we know exactly where the offending code is. If\
    \ we are working in the browser, our errors are displayed in the browser’s console\
    \ area (see [Figure 14.1](#14_001.html_f14.1)), and if we are working on a server-side\
    \ Node.js app, for example, then in the terminal window (see [Figure 14.2](#14_001.html_f14.2)).\n\
    \n[![Errors in the Browser](bilderklein/klein14_001.png)](img-f14.1.html)\n\n\
    **Figure 14.1**     Errors in the Browser\n\n[![Errors in VS Code Terminal](bilderklein/klein14_002.png)](img-f14.2.html)\n\
    \n**Figure 14.2**     Errors in VS Code Terminal\n\n## 14.2    Debugging\n\nThe\
    \ nature of JavaScript with its dynamic typing system means you will see many\
    \ bugs that give you no indication of what has gone wrong, and you will need to\
    \ place that important breakpoint in your code. In VS Code, you can place a breakpoint\
    \ at the offending line of code, or you can use the using the <samp class=\"listingcharacter\"\
    >debugger;</samp> statement, which is like the <samp class=\"listingcharacter\"\
    >BREAK-POINT</samp> statement in ABAP. You can then hit these breakpoints using\
    \ the built-in debugger in your IDE (VS Code, in our case) or hit your breakpoint\
    \ in your browser’s developer tools panel (Chrome DevTools, in our case).\n\n\
    We’ll take a closer look at both tools in the following sections.\n\n### Debugging\
    \ with Chrome DevTools\n\nMost major browsers have their own set of debugging\
    \ tools, but we are introducing the concept using Chrome’s built-in debugging\
    \ tools because they are among the best. To begin, we trigger our first JavaScript\
    \ breakpoint using the <samp class=\"listingcharacter\">debugger;</samp> statement\
    \ and see what options we have in the browser. [Listing 14.2](#14_002.html_l14.2)\
    \ shows a standard HTML page that references the JavaScript code in [Listing 14.3](#14_002.html_l14.3),\
    \ which is where we’ll place our breakpoint. In [Listing 14.3](#14_002.html_l14.3),\
    \ we placed a <samp class=\"listingcharacter\">debugger;</samp> statement (our\
    \ breakpoint) just before the <samp class=\"listingcharacter\">alertText</samp>\
    \ variable assignment.\n\n```\n<!DOCTYPE html>\n<head>\n    <title>Document</title>\n\
    \    <script src=\"app.js\"></script>\n</head>\n\n<body>\n    <h1>Let’s do some\
    \ debugging!</h1>\n    <button id=\"button1\" onclick=\"onButtonClick()\">Press\
    \ Me!</button>\n</body>\n</html> \n```\n\n**Listing 14.2**     index.html\n\n\
    ```\nconst onButtonClick = () => {\n  debugger;\n  let alertText = \"Button clicked!\"\
    ;\n  alert(alertText);\n}; \n```\n\n**Listing 14.3**     app.js\n\nWe run our\
    \ webpage from [Listing 14.2](#14_002.html_l14.2), and when we click Press Me!,\
    \ we do not trigger our breakpoint. That is because to trigger the breakpoint,\
    \ we need to have Chrome DevTools open. Press [F12] or right-click and click Inspect\
    \ in the context menu. Once the DevTools are open, refresh the page and click\
    \ Press Me! again. Our browser screen dims, and we now see the code from our app.js\
    \ file in the Sources tab and our <samp class=\"listingcharacter\">debugger;</samp>\
    \ statement highlighted with our code execution stopped at that breakpoint, as\
    \ shown in [Figure 14.3](#14_002.html_f14.3).\n\nAlthough the interface in [Figure 14.3](#14_002.html_f14.3)\
    \ is a bit different, the process of debugging is much the same as ABAP. You see\
    \ your code at the top right with a file explorer on the left showing your index.html\
    \ and app.js files, with a few different sections underneath. You can see the\
    \ Call Stack, which shows we are in the <samp class=\"listingcharacter\">onButtonClick()</samp>\
    \ function. You will also see the Scope section toward the right side, which holds\
    \ our undefined <samp class=\"listingcharacter\">alertText</samp> variable that\
    \ we are now going to assign some text.\n\n[![Chrome DevTools: Debugging](bilderklein/klein14_003.png)](img-f14.3.html)\n\
    \n**Figure 14.3**     Chrome DevTools: Debugging\n\nJust like with the ABAP debugger,\
    \ we can step through our code. Use the buttons toward the top middle of the browser\
    \ or in Chrome DevTools above the Breakpoints section. Click the Step over next\
    \ function button [F10] twice to step onto and over the <samp class=\"listingcharacter\"\
    >alertText</samp> variable assignment, and watch how our local variable is assigned\
    \ text in both the Scope section and the code view area in [Figure 14.4](#14_002.html_f14.4).\n\
    \nBefore we continue, in [Figure 14.5](#14_002.html_f14.5), we change our <samp\
    \ class=\"listingcharacter\">alertText</samp> variable to I changed this text\
    \ by double-clicking the Button Clicked! text in the Scope section, entering the\
    \ new text, and pressing [Enter]. We then click the blue Resume script execution\
    \ button [F8] to continue through our code where we see our alert with the updated\
    \ text.\n\nThis is just the tip of the iceberg, and there is much more we can\
    \ do when debugging in Chrome DevTools, going beyond code execution all the way\
    \ to testing speed, performance, and even how well our app runs on other devices\
    \ like mobile phones and tablets.\n\n[![Chrome DevTools: Step Through Code](bilderklein/klein14_004.png)](img-f14.4.html)\n\
    \n**Figure 14.4**     Chrome DevTools: Step Through Code\n\n[![Changing Variables](bilderklein/klein14_005.png)](img-f14.5.html)\n\
    \n**Figure 14.5**     Changing Variables\n\n### Debugging in VS Code\n\nYou can\
    \ also use your IDE to debug your code, and we are going to use the debugger in\
    \ VS Code. This debugging tool more closely resembles the ABAP debugger, but the\
    \ flow and interface are a bit different and may take some getting used to. The\
    \ other benefit to debugging in VS Code is you can install many extensions to\
    \ make things easier, including ones already available for pure ABAP. Let’s use\
    \ Node.js to run the code from [Listing 14.4](#14_002.html_l14.4) and step through\
    \ it using VS Code’s built-in debugger.\n\n```\nclass car {\n  constructor(make)\
    \ {\n    this.make = make;\n  }\n}\n\nlet newCar = new car(\"mercedes\");\nconsole.log(`${newCar.maek}`);\
    \ \n```\n\n**Listing 14.4**     fix-me.js"
