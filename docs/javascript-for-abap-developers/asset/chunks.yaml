  trans: "\n\n关于 JavaScript 数据类型的另一个重要概念是 JavaScript 如何从左到右评估表达式，并且结果可能取决于你所使用的组合方式。这与\
    \ ABAP 形成了鲜明对比，在 ABAP 中，变量必须先定义类型，如果你尝试将字符串加到数字上，将会得到类型错误。在下面的示例中，数字 `42` 被视为字符串，因为表达式的第一部分是字符串\
    \ `\"apple\"`：\n\n```\nvar fruit = \"apple\" + 42;\nconsole.log(fruit); // apple42\
    \ \n```\n\n如果你接着尝试像下面的示例所示先将两个数字相加，再加上字符串，你会发现数字正确求和，但 `\"apple\"` 被附加在了末尾。因此，它先执行了计算，然后继续进行字符串加法。\n\
    \n```\nvar fruit = 42 + 8 + \"apple\";\nconsole.log(fruit); // 50apple \n```\n\
    \n如你所见，JavaScript 有一个名为 `typeof` 的内置运算符，你可以用它来检查变量的数据类型。列表 2.8 显示了当从左到右评估表达式时，变量\
    \ `fruit1` 的类型为 `string`；但遵循相同的逻辑，尽管我们是从左侧开始计算并添加字符串的，变量 `fruit2` 的类型也是 `string`。\n\
    \n```\nvar fruit1 = \"apple\" + 42;\nconsole.log(typeof fruit1); // string\nvar\
    \ fruit2 = 42 + 8 + \"apple\";\nconsole.log(typeof fruit2); // string \n```\n\n\
    **列表 2.8** typeof 运算符\n\n## 2.3 全局变量和局部变量的作用域\n\n在 ABAP 中，我们熟悉全局和局部变量的概念。在一个带有子程序（`FORM…ENDFORM`）的简单报告中，我们可以在子程序外部声明全局变量，程序和子程序都可以访问它。因此，我们也可以在子程序的作用范围内（`FORM…ENDFORM`\
    \ 内部）声明局部变量，它只对子程序可见，而对程序的其他部分可见。在 JavaScript 中，你有全局变量和局部变量，但你的程序作用域分为全局作用域和局部作用域。在全局作用域中声明变量可以从任何地方访问，但在函数内部（局部作用域）声明的变量只能在各自的作用域内访问（不能从全局作用域访问）。局部作用域可以进一步分为函数作用域和块作用域。我们将在接下来的章节详细介绍每一个。\n\
    \n### 全局作用域\n\n在列表 2.9 中，我们在全局作用域声明了变量 `car`，并在函数的局部作用域内将其变量打印到控制台。函数可以访问 `car`\
    \ 变量并打印，是因为该变量已经在全局作用域中声明了。\n\n```\nvar car = \"BMW\"; // 在全局作用域声明\nfunction showCar()\
    \ {\n  console.log(car); // car 在函数内可访问\n}\nshowCar(); // BMW \n```\n\n**列表 2.9**\
    \ 全局作用域\n\n### 局部作用域：函数作用域\n\n函数作用域是函数大括号 `{…}` 内部的作用域（参见第 4 ）；在此处声明的变量仅在函数内部可用。遵循列表\
    \ 2.10 中的相同示例，我们现在在函数作用域内声明变量。如果我们尝试在函数外部打印 `car` 变量，将得到一个 `ReferenceError`。\n\
    \n```\nfunction showCar() {\n  var car = \"BMW\"; // 在函数作用域内声明的变量\n  console.log(car);\
    \ // car 将打印到控制台\n}\nshowCar(); // BMW\nconsole.log(car); // ReferenceError: car\
    \ is not defined \n```\n\n**列表 2.10** 函数作用域\n\n### 局部作用域：块作用域\n\n块作用域是 JavaScript\
    \ 语句（如 `switch`、`if`、`for` 循环和 `while` 循环）`…}` 内部的作用域。在这些语句范围内声明的变量也只能在各自语句的块作用域内访问。然而，这条规则仅适用于现代\
    \ JavaScript 语法声明的变量，即 `let` 和 `const`。观察列表 2.11 中，尝试向控制台打印 `car2` 时是如何触发 `ReferenceError`\
    \ 的。\n\n```javascript\nfunction test() {\n  if (true) {\n    var car1 = \"BMW\"\
    ; // 旧语法 - 在函数作用域\n    let car2 = \"Audi\"; // 现代语法 - 在块作用域\n  }\n  console.log(car1);\
    \ // BMW\n  console.log(car2); // ReferenceError: car2 is not defined\n}\ntest();\
    \ \n```\n\n**列表 2.11** 函数作用域内的块作用域\n\n你无法打印 `car2` 的原因是因为它使用了现代语法 `let`，并且被锁定在\
    \ `if` 语句的块作用域内，即使包含 `if` 语句的函数无法访问它。由于 `car1` 是使用旧语法 `var` 的，函数可以访问它，因为它不遵守 `if`\
    \ 语句的块作用域。\n\n## 2.4 旧语法与现代语法\n\n在 ES6（ECMAScript 2015）之前，我们在 JavaScript 中只有 `var`\
    \ 关键字来声明变量。从 ES6 开始，我们有了 `let` 和 `const` 关键字，提供了提供了比 `var` 更大的灵活性。这两个新关键字在本质上几乎相同，除了\
    \ `let` 允许你重新分配值（类似于 `var`），而 `const` 则不允许。它们允许我们声明使用块作用域的变量（参见节 2.3 ），而在 ES6\
    \ 之前，我们只有函数作用域和全局作用域。\n\n我们将在接下来的章节详细介绍每一个关键字。\n\n### var\n\n使用 `var` 关键字的变量可以修改，也可以重新声明。这是引入\
    \ `let` 和 `const` 的原因之一，让我们对变量有了更多的控制，并使代码不易出错，因为我们现在可以决定是否限制一个变量。列表 2.12 显示了如何使用\
    \ `var` 同时修改和重新声明变量。在这里，变量 `firstName` 被声明为 `John`，然后值改为 `Johnny`，最后重新声明为 `Fred`。\n\
    \n```\nvar firstName = \"John\";\nconsole.log(firstName); // John\nfirstName =\
    \ \"Johnny\"; // 修改变量\nconsole.log(firstName); // Johnny\nvar firstName = \"Fred\"\
    ; // 第二次声明\nconsole.log(firstName); // Fred \n```\n\n**列表 2.12** var 关键字\n\n输出如下：\n\
    \n```\nJohn\nJohnny\nFred \n```\n\n### let\n\n"
- fmt: "\nVariables using the modern `let` keyword can be updated (reassigned) but\
    \ not redeclared in the same scope, making it the popular successor to the `var`\
    \ keyword. In [Listing 2.13](#02_004.html_l2.13), notice we can change the variable\
    \ value when declared using `let`, changing `John` to `Johnny`.\n\n```\nlet firstName\
    \ = \"John\";\nconsole.log(firstName); // John\nfirstName = \"Johnny\";\nconsole.log(firstName);\
    \ // Johnny \n```\n\n**Listing 2.13** let: Change Variable\n\nIn [Listing 2.14](#02_004.html_l2.14),\
    \ if we try and reassign a variable using the `let` keyword in the same scope\
    \ (e.g., redeclaring `John` as `Fred`), we get a `SyntaxError`.\n\n```\nlet firstName\
    \ = \"John\";\nconsole.log(firstName);\nlet firstName = \"Fred\"; /* \nSyntaxError:\
    \ Identifier 'firstName' has already been declared */ \n```\n\n**Listing 2.14**\
    \ let: Reassign Variable\n\nHowever, `let` variable identifiers can be declared\
    \ again if they are outside of the same identifier’s block scope (see [Section\
    \ 2.3](#02_003.html_h2.3)), as shown in [Listing 2.15](#02_004.html_l2.15).\n\n\
    ```\nlet firstName = \"John\";\nconsole.log(firstName); // John\nif (true) {\n\
    \  let firstName = \"Johnny\";\n  console.log(firstName + \" in block scope\"\
    ); // Johnny in block scope\n} \n```\n\n**Listing 2.15** let: Block Scope\n\n\
    ### const\n\nThe `const` keyword is like `let` except you cannot change or reassign\
    \ its value. The benefit of a variable that cannot be updated or redeclared is\
    \ that it will not change throughout your program. In [Listing 2.16](#02_004.html_l2.16),\
    \ we see immediately that if we try to change the variable `firstName,`, we run\
    \ into a `TypeError`.\n\n```\nconst firstName = \"John\";\nfirstName = \"Johnny\"\
    ; // TypeError: Assignment to constant variable \n```\n\n**Listing 2.16** const:\
    \ Changing Variable\n\nIn [Listing 2.17](#02_004.html_l2.17), we see that if we\
    \ try to redeclare the `firstName` variable, we are presented with a `SyntaxError`.\n\
    \n```\nconst firstName = \"John\";\nconst firstName = \"Johnny\"; /* \nSyntaxError:\
    \ Identifier 'firstName' has already been declared */ \n```\n\n**Listing 2.17**\
    \ const: Redeclaring Variable\n\n## 2.5 String and Number Methods\n\nAs in [Listing\
    \ 2.8](#02_002.html_l2.8), where we use the `typeof` operator to find a variable\
    \ type, you have built-in methods for strings and numbers that return information\
    \ about the variable. When processing strings, you have a variety of methods to\
    \ use. You can call methods that return the string length, as follows:\n\n```\n\
    let alphabet = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\";\nconsole.log(`String length is\
    \ ${alphabet.length}`); // String length is 26 \n```\n\nYou can call methods that\
    \ give you the index of a word in a sentence, as follows:\n\n```\nlet greetingStr\
    \ = \"Hello there friend!\";\nconsole.log(`There lies at index: ${greetingStr.indexOf(\"\
    there\")}`); /* There lies at index: 6 */ \n```\n\nYou also have methods that\
    \ apply specifically to numbers that can, for example, reduce decimal points:\n\
    \n```\nlet num1 = 15.443256;\nconsole.log(num1.toFixed(2)); // 15.44 \n```\n\n\
    If required, you can convert your number to a string and vice versa, as shown\
    \ in [Listing 2.18](#02_005.html_l2.18).\n\n```\nlet num1 = 14.44;\nconsole.log(typeof\
    \ num1); // number\nlet numString = num1.toString(); // convert num1 to a string\n\
    console.log(typeof numString); //string\nlet num2 = Number(num1); // convert num1\
    \ back to a number\nconsole.log(typeof num2); // number \n```\n\n**Listing 2.18**\
    \ String and Number Methods\n\n# 3 Operators and Loops\n\nNow that we can declare\
    \ variables in our code, we need to be able to work with those variables and use\
    \ them in our program logic. In ABAP, most day-to-day requirements include arithmetic,\
    \ value comparison, conditional statements, and loops to achieve a result. JavaScript\
    \ also covers these areas, and the only real difference is the syntax. We’ll see\
    \ these differences in action in the following sections.\n\n## 3.1 Arithmetic\
    \ Operators\n\nAs seen in [Section 2.1](#02_001.html_h2.1), you can do basic arithmetic\
    \ in JavaScript such as summing two numbers or variables using the `+` operator,\
    \ as shown in [Listing 3.1](#03_001.html_l3.1).\n\n```\nlet a = 10; // Operand\n\
    let b = 15; // Operand\nlet c = a + b; // + is the operator that sums the numbers\n\
    console.log(c); // 25\nlet d = 10 + 15;\nconsole.log(d); // 25 \n```\n\n**Listing\
    \ 3.1** Sum Operator\n\nThe previous arithmetic operation is split into the operator\
    \ and operands. The operator is the `+` sign that sums the operands (`10` and\
    \ `15`) to give you `25`. You can also do the same with `-`, `*`, and `/` to subtract,\
    \ multiply, and divide, respectively.\n\nThere is also the modulus operator `%`,\
    \ which returns the remainder after a division calculation is performed, as shown\
    \ in [Listing 3.2](#03_001.html_l3.2).\n\n```\nlet a = 7;\nlet b = 2;\nlet c =\
    \ a % b;\nconsole.log(c); // 1 \n```\n\n**Listing 3.2** Modulus (Remainder) Operator\n\
    \nJust like in mathematics, JavaScript arithmetic operations follow the same priority\
    \ principle of multiplication (`*`) and division (`/`) being calculated first,\
    \ taking priority over the `+` and `-` signs, which are calculated afterward.\
    \ An example would be the following:\n\n```\nlet sum = 10 + 5 * 3;\nconsole.log(sum);\
    \ // 25 \n```\n\nUsing that same principle, you can also change this order by\
    \ using `()`, as follows:\n\n```\nlet sum = (10 + 5) * 3;\nconsole.log(sum); //\
    \ 45 \n```\n\nIn [Section 3.6](#03_006.html_h3.6), we will look at loops, where\
    \ we can increment and decrement values using `++` or `--` after a variable, as\
    \ shown in [Listing 3.3](#03_001.html_l3.3).\n\n```\nlet a = 10;\na++;\nconsole.log(a);\
    \ // 11\na--;\nconsole.log(a); // 10 \n```\n\n**Listing 3.3** Increment and Decrement\
    \ Value\n\nIn [Section 2.1](#02_001.html_h2.1), we looked at the assignment operator\
    \ (i.e., `=`), which is used to assign a value to a variable. Now, we take it\
    \ one step further in [Listing 3.4](#03_001.html_l3.4) with operators like `+=`,\
    \ `-=`, `*=`, and `/=`.\n\n```\nlet a = 10;\nlet b = 2;\na += b;\nconsole.log(a);\
    \ // 12\na -= b;\nconsole.log(a); // 10\na *= b;\nconsole.log(a); // 20\na /=\
    \ b;\nconsole.log(a); // 10 \n```\n\n**Listing 3.4** Arithmetic Assignment Operator\n\
    \n## 3.2 String Operators\n\nString operators can be used to concatenate strings\
    \ based on variables or hard-coded text to form longer strings. You saw this in\
    \ [Listing 2.15](#02_004.html_l2.15), where we used the `+` operator to concatenate\
    \ two strings. Another example is shown in [Listing 3.5](#03_002.html_l3.5), where\
    \ three variables are concatenated with some hard-coded text and assigned to another\
    \ variable, which we log to the console.\n"
