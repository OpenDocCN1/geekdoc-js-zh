  trans: "\n\n在 JavaScript 中，我们可以使用三元运算符来模拟 `COND` 语句。它提取了我们在 Listing 3.10 中编写的前四行比较逻辑（`if`\
    \ 和 `else if` 部分），并立即让代码更加简洁。这可以在 Listing 3.11 中看到，在那个示例中，我们将三元逻辑的结果赋值给 `output`\
    \ 变量。如果 `a <= 100` 为真，则返回 `?` 之后的值；如果为假，则返回 `:` 之后的值。\n\n```javascript\nlet a\
    \ = 110;\nlet output =\n  a <= 100\n    ? `${a} is definitely less than 100`\n\
    \    : `${a} is simply not less than 100`;\nconsole.log(output); \n```\n\n**Listing\
    \ 3.11** 三元运算符\n\n三元运算符还可以链式使用，允许你完全包含 Listing 3.10 中的逻辑，如 Listing 3.12 所示。\n\n\
    ```javascript\nlet a = \"hello\";\nlet output =\n  a <= 100\n    ? `${a} is definitely\
    \ less than 100`\n    : a >= 100\n    ? `${a} is simply not less than 100`\n \
    \   : `${a} is just not a number`;\nconsole.log(output); \n```\n\n**Listing 3.12**\
    \ 链式三元运算符\n\nListing 3.12 中的代码与 Listing 3.10 的功能相同，但代码要简洁得多，尽管语法起初可能难以阅读。为了帮助理解语法，请记住\
    \ `?` 之后的任何内容在条件求值为 `true` 时执行，而 `:` 之后的所有内容在之前的一个语句求值为 `false` 时执行，即使那是另一个比较语句。\n\
    \nABAP 中另一个重要的条件操作符是 `SWITCH` 语句，它是避免大量嵌套 `IF` 语句的极佳方法。JavaScript 中的 `switch`\
    \ 语句再次类似于其 ABAP 对应物，除了少数语法差异外，其工作方式非常相似。你创建一个 `switch` 语句，并在括号中添加要评估的表达式，随后是你的\
    \ `case` 语句，以及在满足 case 条件时要执行的代码。如果满足条件，你添加一个 `break` 语句在执行代码后退出 `switch` 语句。末尾添加\
    \ `default` 语句，用于处理当没有任何 `case` 语句被满足的情况。Listing 3.13 展示了一个示例，在示例中我们声明了一个 `company`\
    \ 变量，并使用 `switch` 语句来评估其值是否匹配 `case` 语句中的任何公司。在这种情况下，它匹配了 `case \"SAP\":` 语句，因此\
    \ `\"Something about SAP\"` 文本被打印到控制台。\n\n```javascript\nlet company = \"SAP\"\
    ;\nswitch (company) {\n  case \"Microsoft\":\n    console.log(\"Something about\
    \ Microsoft\");\n    break;\n  case \"Google\":\n    console.log(\"Something about\
    \ Google\");\n    break;\n  case \"SAP\":\n    console.log(\"Something about SAP\"\
    );\n    break;\n  default:\n    console.log(\"No company here :(\");\n} \n```\n\
    \n**Listing 3.13** switch 语句\n\n直接运行 Listing 3.13 中的代码，你的输出应该是 `\"Something about\
    \ SAP\"`，因为该 `case` 条件匹配了我们的 `company` 变量。尝试更改 `company` 变量并触发其他每个 `case` 语句以及\
    \ `default`。\n\n## 3.6 循环\n\n在 ABAP 中，我们有使用 `DO` 的无条件循环、使用 `WHILE` 的条件循环，以及使用\
    \ `LOOP` 语句遍历内部表。在 JavaScript 中，我们拥有与 ABAP 相同的 `do`、`do…while` 和 `while` 循环，但增加了\
    \ `for` 循环来代替 ABAP 的 `LOOP` 语句。我们将在接下来的章节中逐一介绍。\n\n### For 循环\n\n你在 JavaScript\
    \ 中学习的最常见的循环是 `for` 循环，与 ABAP 中的 `LOOP AT` 相比，它看起来有点奇怪。循环由括号中的逻辑控制，拆解如下：\n\n*\
    \   `let count = 0`: 创建一个在迭代中使用的变量。\n*   `count <= 10`: 持续循环直到 `count` 变量达到十或更小。\n\
    *   `count++`: 告诉变量自加一。\n\n完整的语法如 Listing 3.14 所示。\n\n```javascript\nfor (let\
    \ count = 0; count <= 10; count++) {\n  console.log(count);\n} \n```\n\n**Listing\
    \ 3.14** for 语法\n\n输出应该是从 `0...10` 的计数，我们将 `count` 变量打印到控制台以便让你看到迭代的工作方式。你也可以通过将\
    \ `count` 设置为 `10`、迭代停止条件为 `count >= 0` 以及使用 `-=` 进行计数递减来实现从 10 开始倒计时。\n\n###\
    \ Do While\n\n`do while` 循环的工作方式与 `for` 循环相似，但结构略有不同。你使用 `do` 语句执行逻辑，并在结尾使用 `while`\
    \ 语句控制迭代，如 Listing 3.15 所示。\n\n```javascript\nlet count = 0;\ndo {\n  console.log(count);\n\
    \  count += 1;\n} while (count <= 10); \n```\n\n**Listing 3.15** do while 语句\n\
    \n输出应与 Listing 3.14 中的 `for` 循环一致，即从 `0…10` 的计数。同样，通过更改 `count` 变量为 `10`、将 `+=`\
    \ 替换为 `-=` 并更改 `while` 条件为 `(count >= 0)`，你可以尝试反转计数并打印递减的数值。\n\n### While\n\n\
    `while` 语句类似于 Listing 3.15 中的 `do while` 语句，不同在于你从 `while` 语句开始，并在语句下方执行代码（包括迭代控制），如\
    \ Listing 3.16 所示。\n\n"
- fmt: "\n```\nlet count = 0;\nwhile (count <= 10) {\n  console.log(count);\n  count++;\n\
    } \n```\n\n**Listing 3.16** `while` Statement\n\nYou should see the same count\
    \ from `0…10` as with the other two loops’ output to the console. Try the count\
    \ backward here as well by making the same changes as before: set `count` to `10`,\
    \ iterate down with `count--`, and stop the loop with `count >= 0`.\n\n# 4 Functions\n\
    \nIn ABAP, we are no stranger to functions or function modules with importing\
    \ and exporting parameters, and in JavaScript, you have functions at your disposal\
    \ as well. The syntax is a bit simpler in JavaScript, where a function can be\
    \ declared in as little as one or two lines. They will become your main tool to\
    \ encapsulate reusable logic in your application.\n\nIn the following sections,\
    \ we’ll look at how to define a function with importing and returning parameters,\
    \ including the new arrow function syntax. We will also look at variables within\
    \ the global scope and address an important concept called closures.\n\n## 4.1\
    \ Function Definition\n\nJavaScript functions are defined using the `function`\
    \ statement followed by the name of the function, the brackets `()` (for parameter\
    \ definition), and the logic to be executed within the `{}`. [Listing 4.1] shows\
    \ a simple function that logs a message to the console when executed.\n\n```\n\
    // Defining the function\nfunction mySimpleFunction() {\n  console.log(`My simple\
    \ function was invoked :)`);\n}\nmySimpleFunction(); // My simple function was\
    \ invoked :) \n```\n\n**Listing 4.1** Standard Function\n\nThe output should be\
    \ `\"My simple function was invoked :)\"` logged to the console. Try running this\
    \ function yourself and see how easy it is to encapsulate logic in JavaScript.\n\
    \nAs of ES6, you can also define JavaScript functions using the arrow function\
    \ syntax as follows:\n\n```\n(params) => {logic} \n```\n\nIt looks quite different\
    \ than the standard function definition in [Listing 4.1], but is a much more streamlined\
    \ way to define functions. The syntax involves declaring a `const` variable (or\
    \ function name) and assigning the function to it with the `=` sign. The function\
    \ parameters are then defined with your brackets `(params)` followed by the arrow\
    \ or `=>` and then the `{}` that hold your logic to be executed, as shown in [Listing\
    \ 4.2].\n\n```\nconst mySimpleFunction = () => {\n  console.log(\"My arrow function\
    \ () => {} was invoked\");\n};\nmySimpleFunction(); // My arrow function () =>\
    \ {} was invoked \n```\n\n**Listing 4.2** Arrow Function\n\nThe function logs\
    \ text to the console when calling the newly created `mySimpleFunction()` function\
    \ variable.\n\n### Important Note\n\nArrow functions are great, and you will use\
    \ them a lot, but don’t discount classic functions just yet. Arrow functions are\
    \ great for more simplistic logic, while classic functions still offer many complex\
    \ features that arrow functions don’t, such as redefinition of the `this` keyword.\
    \ The differences are beyond the scope of this E-Bite, but well worth your time\
    \ to read about. In this E-Bite, we will use a combination of both function expressions,\
    \ and we recommend you choose your syntax based on your scenario.\n\n## 4.2 Parameters\
    \ and the Return Statement\n\nA JavaScript function can also have importing parameters,\
    \ which can be used inside the function itself. You define your parameters in\
    \ the brackets `(param1)` and inside your logic, you reference the parameter name\
    \ `param1` and do something like log it to the console, as shown in [Listing 4.3].\n\
    \n```\nconst mySimpleFunction = (param1) => {\n  if (param1) {\n    console.log(param1);\n\
    \  } else {\n    console.log(`param1 is ${typeof param1}`);\n  }\n};\nmySimpleFunction(\"\
    Hello World!\"); \n```\n\n**Listing 4.3** Function Parameters\n\nIn this example,\
    \ we declare our function with an importing parameter `param1` and call that function,\
    \ passing in the importing parameter `\"Hello World!\"`, which the function then\
    \ logs to the console. Notice we have structured our logic inside an `if` statement.\
    \ This is to highlight the dynamic typing of that `param1` parameter. If you call\
    \ the function with no variable, a string will be logged to the console telling\
    \ you `param1` is undefined.\n\nAs well as executing logic inside your function,\
    \ you can also return variables to the caller using the `return` statement. [Listing\
    \ 4.4] contains a function that calculates the sum of two parameters, a check\
    \ to make sure the parameters are type `number`, and if so, returns the summed\
    \ value. Notice how you can declare multiple parameters separated by a comma.\n\
    \n```\nconst mySumFunction = (param1, param2) => {\n  if (typeof param1 === \"\
    number\" && typeof param2 === \"number\") {\n    return param1 + param2;\n  }\
    \ else {\n    return \"At least one of the parameters is not a number!\";\n  }\n\
    };\nlet sum = mySumFunction(100, 150);\nconsole.log(sum); // 250 \n```\n\n**Listing\
    \ 4.4** Function Return Statement\n\nInitially, we call this function with two\
    \ number-type parameters (`100`, `150`) and we get a summed value of `250` assigned\
    \ to the variable `sum`, which is then logged to the console. The `if` statement\
    \ checks that both importing parameters are indeed of type `number`, and if not,\
    \ an appropriate message is returned. Try changing one of the parameters to a\
    \ string, or only enter one of the two parameters for `mySumFunction(100)`, and\
    \ your variable should be assigned a string that says, `\"At least one of the\
    \ parameters is not a number!\"`.\n\n## 4.3 Global Scope and Closures\n\nWe looked\
    \ at the function scope in [Section 2.3], which explained that we can access variables\
    \ declared in the global scope (i.e., outside of the function) but variables declared\
    \ inside a function are considered “private” to that function and are not accessible\
    \ to the function caller.\n\nHowever, the downside is global variables in JavaScript\
    \ are accessible to any other function in the global scope, which can wreak havoc\
    \ in your application. What we want is a way to create a global variable but lock\
    \ down its scope so that only a certain function can access it. This is the same\
    \ concept in ABAP classes with their `PRIVATE SECTION` declaration. Only the methods\
    \ in that class can access those private variables, but those variables are declared\
    \ outside the class methods themselves.\n"
  raw: "```\nlet count = 0;\nwhile (count <= 10) {\n  console.log(count);\n  count++;\n\
    } \n```\n\n**Listing 3.16**     while Statement\n\nYou should see the same count\
    \ from <samp class=\"listingcharacter\">0…10</samp> as with the other two loops’\
    \ output to the console. Try the count backward here as well by making the same\
    \ changes as before: set <samp class=\"listingcharacter\">count</samp> to <samp\
    \ class=\"listingcharacter programmingelement\">10</samp>, iterate down with <samp\
    \ class=\"listingcharacter\">count--</samp>, and stop the loop with <samp class=\"\
    listingcharacter\">count >= 0</samp>.\n\n# 4    Functions\n\nIn ABAP, we are no\
    \ stranger to functions or function modules with importing and exporting parameters,\
    \ and in JavaScript, you have functions at your disposal as well. The syntax is\
    \ a bit simpler in JavaScript, where a function can be declared in as little as\
    \ one or two lines. They will become your main tool to encapsulate reusable logic\
    \ in your application.\n\nIn the following sections, we’ll look at how to define\
    \ a function with importing and returning parameters, including the new arrow\
    \ function syntax. We will also look at variables within the global scope and\
    \ address an important concept called closures.\n\n## 4.1    Function Definition\n\
    \nJavaScript functions are defined using the <samp class=\"listingcharacter\"\
    >function</samp> statement followed by the name of the function, the brackets\
    \ <samp class=\"listingcharacter\">()</samp> (for parameter definition), and the\
    \ logic to be executed within the <samp class=\"listingcharacter\">{}</samp>.\
    \ [Listing 4.1](#04_001.html_l4.1) shows a simple function that logs a message\
    \ to the console when executed.\n\n```\n// Defining the function\nfunction mySimpleFunction()\
    \ {\n  console.log(`My simple function was invoked :)`);\n}\nmySimpleFunction();\
    \ // My simple function was invoked :) \n```\n\n**Listing 4.1**     Standard Function\n\
    \nThe output should be <samp class=\"listingcharacter\">\"My simple function was\
    \ invoked :)\"</samp> logged to the console. Try running this function yourself\
    \ and see how easy it is to encapsulate logic in JavaScript.\n\nAs of ES6, you\
    \ can also define JavaScript functions using the arrow function syntax as follows:\n\
    \n```\n(params) => {logic} \n```\n\nIt looks quite different than the standard\
    \ function definition in [Listing 4.1](#04_001.html_l4.1), but is a much more\
    \ streamlined way to define functions. The syntax involves declaring a <samp class=\"\
    listingcharacter\">const</samp> variable (or function name) and assigning the\
    \ function to it with the <samp class=\"listingcharacter\">=</samp> sign. The\
    \ function parameters are then defined with your brackets <samp class=\"listingcharacter\"\
    >(params)</samp> followed by the arrow or <samp class=\"listingcharacter\">=></samp>\
    \ and then the <samp class=\"listingcharacter\">{}</samp> that hold your logic\
    \ to be executed, as shown in [Listing 4.2](#04_001.html_l4.2).\n\n```\nconst\
    \ mySimpleFunction = () => {\n  console.log(\"My arrow function () => {} was invoked\"\
    );\n};\nmySimpleFunction(); // My arrow function () => {} was invoked \n```\n\n\
    **Listing 4.2**     Arrow Function\n\nThe function logs text to the console when\
    \ calling the newly created <samp class=\"listingcharacter\">mySimpleFunction()</samp>\
    \ function variable.\n\n###### Important Note\n\nArrow functions are great, and\
    \ you will use them a lot, but don’t discount classic functions just yet. Arrow\
    \ functions are great for more simplistic logic, while classic functions still\
    \ offer many complex features that arrow functions don’t, such as redefinition\
    \ of the <samp class=\"listingcharacter\">this</samp> keyword. The differences\
    \ are beyond the scope of this E-Bite, but well worth your time to read about.\
    \ In this E-Bite, we will use a combination of both function expressions, and\
    \ we recommend you choose your syntax based on your scenario.\n\n## 4.2    Parameters\
    \ and the Return Statement\n\nA JavaScript function can also have importing parameters,\
    \ which can be used inside the function itself. You define your parameters in\
    \ the brackets <samp class=\"listingcharacter\">(param1)</samp> and inside your\
    \ logic, you reference the parameter name <samp class=\"listingcharacter\">param1</samp>\
    \ and do something like log it to the console, as shown in [Listing 4.3](#04_002.html_l4.3).\n\
    \n```\nconst mySimpleFunction = (param1) => {\n  if (param1) {\n    console.log(param1);\n\
    \  } else {\n    console.log(`param1 is ${typeof param1}`);\n  }\n};\nmySimpleFunction(\"\
    Hello World!\"); \n```\n\n**Listing 4.3**     Function Parameters\n\nIn this example,\
    \ we declare our function with an importing parameter <samp class=\"listingcharacter\"\
    >param1</samp> and call that function, passing in the importing parameter <samp\
    \ class=\"listingcharacter\">\"Hello World!\"</samp>, which the function then\
    \ logs to the console. Notice we have structured our logic inside an <samp class=\"\
    listingcharacter\">if</samp> statement. This is to highlight the dynamic typing\
    \ of that <samp class=\"listingcharacter\">param1</samp> parameter. If you call\
    \ the function with no variable, a string will be logged to the console telling\
    \ you <samp class=\"listingcharacter\">param1</samp> is undefined.\n\nAs well\
    \ as executing logic inside your function, you can also return variables to the\
    \ caller using the <samp class=\"listingcharacter\">return</samp> statement. [Listing 4.4](#04_002.html_l4.4)\
    \ contains a function that calculates the sum of two parameters, a check to make\
    \ sure the parameters are type <samp class=\"listingcharacter\">number</samp>,\
    \ and if so, returns the summed value. Notice how you can declare multiple parameters\
    \ separated by a comma.\n\n```\nconst mySumFunction = (param1, param2) => {\n\
    \  if (typeof param1 === \"number\" && typeof param2 === \"number\") {\n    return\
    \ param1 + param2;\n  } else {\n    return \"At least one of the parameters is\
    \ not a number!\";\n  }\n};\nlet sum = mySumFunction(100, 150);\nconsole.log(sum);\
    \ // 250 \n```\n\n**Listing 4.4**     Function Return Statement\n\nInitially,\
    \ we call this function with two number-type parameters (<samp class=\"listingcharacter\
    \ programmingelement\">100</samp>, <samp class=\"listingcharacter programmingelement\"\
    >150</samp>) and we get a summed value of <samp class=\"listingcharacter programmingelement\"\
    >250</samp> assigned to the variable <samp class=\"listingcharacter\">sum</samp>,\
    \ which is then logged to the console. The <samp class=\"listingcharacter\">if</samp>\
    \ statement checks that both importing parameters are indeed of type <samp class=\"\
    listingcharacter\">number</samp>, and if not, an appropriate message is returned.\
    \ Try changing one of the parameters to a string, or only enter one of the two\
    \ parameters for <samp class=\"listingcharacter\">mySumFunction(100)</samp>, and\
    \ your variable should be assigned a string that says, <samp class=\"listingcharacter\"\
    >\"At least one of the parameters is not a number!\"</samp>, which is then logged\
    \ to the console.\n\n## 4.3    Global Scope and Closures\n\nWe looked at the function\
    \ scope in [Section 2.3](#02_003.html_h2.3), which explained that we can access\
    \ variables declared in the global scope (i.e., outside of the function) but variables\
    \ declared inside a function are considered “private” to that function and are\
    \ not accessible to the function caller.\n\nHowever, the downside is global variables\
    \ in JavaScript are accessible to any other function in the global scope, which\
    \ can wreak havoc in your application. What we want is a way to create a global\
    \ variable but lock down its scope so that only a certain function can access\
    \ it. This is the same concept in ABAP classes with their <samp class=\"listingcharacter\"\
    >PRIVATE SECTION</samp> declaration. Only the methods in that class can access\
    \ those private variables, but those variables are declared outside the class\
    \ methods themselves."
