  trans: "\n\n这就是异步 JavaScript 大显身手的地方。异步 JavaScript 让你跳出标准 JavaScript 的线性流，并为你的代码增加灵活性，这样你可以选择等待函数执行完毕，或者让它在后台执行并按照自己的时间完成。这类似于一种名为\
    \ `COMMIT WORK` 的 ABAP 程序，该程序不会停在那里等待提交的结果。请注意，这是一个高级 JavaScript 主题，但从一开始就值得被介绍。异步\
    \ JavaScript 在列表 9.1 中通过 JavaScript 的 `setTimeout()` 函数进行了说明，该函数会暂停函数的执行几秒钟。注意\
    \ `callExternalServer()` 函数是如何没有阻塞 `doSomethingElse()` 函数的（尽管它是先执行的），并让了程序的其余部分继续运行直到它完成。\n\
    \n```javascript\nconst doSomething = () => {\n  console.log(\"Do something\");\n\
    };\nconst callExternalServer = () => {\n  setTimeout(() => {\n    console.log(\"\
    Call to external server complete\");\n  }, 3000);\n};\nconst doSomethingElse =\
    \ () => {\n  console.log(\"Do something else\");\n};\ndoSomething();\ncallExternalServer();\n\
    doSomethingElse(); \n```\n\n**列表 9.1** `setTimeout()` 函数\n\n在本节中，我们将查看旧的 JavaScript\
    \ 回调、JavaScript Promise，最后是较新的 `async`/`await` 语法，它对 JavaScript 逻辑执行的时机提供了更细粒度的控制。\n\
    \n## 9.1 JavaScript 中的回调\n\n回调函数是 JavaScript 中较老的编码策略之一，但你会经常看到它们。它们涉及将一个函数作为参数传递给另一个函数。其核心思想是你创建一个第一个函数，它运行直到完成，完成后它会调用另一个函数，即回调函数。把它想象成向某人发送消息并要求他们做某事，并在完成后“回电给你”。\n\
    \n这允许对函数的执行时间进行更细粒度的控制，并允许你处理一个函数依赖于另一个函数完成后才能开始的情况。说明这一点的一个棒方法是使用计算器。在列表 9.2\
    \ 中，我们创建了一个计算器，可以向其传递一些数字，计算完成后，我们调用另一个函数将结果打印到控制台。\n\n```javascript\nconst displayCalculatorResult\
    \ = (result) => {\n  console.log(result);\n};\n\nconst calculatorWithCallback\
    \ = (num1, num2, callback) => {\n  let result = num1 + num2;\n  // 调用我们的回调函数\n\
    \  callback(result);\n};\ncalculatorWithCallback(1, 9, displayCalculatorResult);\
    \ \n```\n\n**列表 9.2** JavaScript 回调\n\n注意我们声明了两个函数，一个用于输出，另一个用于计算。在我们的计算器函数中，我们指定了两个数字参数和第三个\
    \ `callback` 参数，这就是我们传递显示函数的地方。所以，当我们调用计算器函数时，显示函数只有在计算完成后才会执行，并将结果打印到控制台。这里的关键是，显示函数只有在计算完成时才会运行。\n\
    \n## 9.2 JavaScript Promise\n\nJavaScript Promise 是另一个高级主题，但它实际上只是编写回调函数的另一种方式，额外的优点是能够返回成功或错误，并让我们决定在每种情况下做什么。Promise\
    \ 用于那些需要从应用程序外部请求数据，并在开始处理之前需要等待数据返回的情况。我们可以再次使用 `setTimeout()` 函数来模拟这一点，它会暂停我们的\
    \ Promise 执行并模拟对外部服务器的调用。\n\nPromise 的语法有点复杂，但你用得越多，它就越清晰。在列表 9.3 中，我们声明了一个新函数\
    \ `promise`，带有 `resolve` 和 `reject` 参数，我们将在函数内部它们。我们告诉函数在 `setTimeout` 在 5000\
    \ 毫秒（5 秒）后返回一个 `resolve`。\n\n```javascript\nconst myFirstPromise = new Promise((resolve,\
    \ reject) => {\n  setTimeout(() => {\n    resolve(\"The server finally sent a\
    \ response!\");\n    reject(\"An error occured :(\");\n  }, 5000);\n});\n\nmyFirstPromise\n\
    \  .then((data) => {\n    // resolve 部分\n    console.log(data);\n  })\n  .catch((error)\
    \ => {\n    // reject 部分\n    console.log(error);\n  }); \n```\n\n**列表 9.3** JavaScript\
    \ Promise\n\n注意在文本打印到控制台之前有五秒的延迟。我们调用 `myFirstPromise` 函数并在其后放置 `then()` 关键字，它持有当\
    \ Promise 函数解析时要执行的函数。Promise 的 `resolve` 将 `resolve` 括号中的文本作为参数传递给 `then()` 部分，我们通过\
    \ `data` 参数导入它。\n\n另外，注意我们那里也有一个 `reject()`，但它没有被执行。通常情况下，你会在 Promise 内部有一些逻辑来决定是调用\
    \ `resolve` 还是 `reject`。为了在示例中触发 `reject`，我们注释掉 `resolve()` 行并像以前一样再次运行示例。你现在应该看到控制台打印了文本\
    \ `\"An error occurred :(\"`。\n\n所以，当使用 Promise 时，只需记住 Promise `resolve` 映射到 `then()`\
    \ 部分，而 Promise `reject` 映射到 `catch()` 部分（类似于 ABAP 中的 `TRY`/`CATCH` 块）。你可以围绕此构建成功或失败逻辑。\n\
    \n## 9.3 async 和 await\n\n与之前的 Promise 语法相比，JavaScript 中的 `async` 和 `await` 关键字有助于编写异步代码。`async`\
    \ 关键字用于将 JavaScript 函数转换为 Promise，并替换了列表 9.3 中的 `new Promise` 语法。这随后允许你在 `async`\
    \ 函数内部使用 `await` 关键字，它放在普通函数前面时会等待该函数调用完成。\n\n在列表 9.4 中，我们对比了普通函数与在其前面插入 `async`\
    \ 时发生的情况。注意 `myFunction()` 返回文本，而 `myAsyncFunction()` 因为 `async` 关键字而返回了封装在 Promise\
    \ 中的文本。\n\n```javascript\nconst myFunction = () => {\n  return \"A normal function\"\
    ;\n};\nconsole.log(myFunction()); // A normal function\n\nconst myAsyncFunction\
    \ = async () => {\n  return \"A promise function\"; // Promise { 'A promise function'\
    \ }\n};\nconsole.log(myAsyncFunction()); \n```\n\n**列表 9.4** async 函数\n\n"
- fmt: "\nNow that we know `myAsyncFunction` is a promise, we can rewrite our standard\
    \ promise example from [Listing 9.3](#09_002.html_l9.3) using the `async` syntax,\
    \ as shown in [Listing 9.5](#09_003.html_l9.5). We will also add two more calls\
    \ to see how the flow works before and after the `setTimeout` function runs.\n\
    \n```\nconst myAsyncFunction = async () => {\n  const myFirstPromise = new Promise((resolve,\
    \ reject) => {\n    setTimeout(() => {\n      resolve(\"The server finally sent\
    \ a response!\");\n      //   reject(\"An error occured :(\");\n    }, 5000);\n\
    \  });\n  // Run this first\n  console.log(\"Let's get started!\");\n  // Run\
    \ this second but wait to finish (5 seconds)\n  console.log(await myFirstPromise);\n\
    \  // Run only when the function promise above has resolved\n  console.log(\"\
    I had to wait for the call above to finish\");\n};\n\nmyAsyncFunction(); \n```\n\
    \n**Listing 9.5** async/await Function\n\nIn [Listing 9.5](#09_003.html_l9.5),\
    \ we have the following text logged to the console:\n\n`Let’s get started!` (Followed\
    \ by a five-second pause.)\n\n`The server finally sent a response!`\n\n`I had\
    \ to wait for the call above to finish!`\n\nThe `async` function acts as a wrapper\
    \ for you to call other functions (including normal promises) within it, giving\
    \ you better control over where one function might need to wait on another before\
    \ executing. To see the benefit of the `await` keyword, remove it completely and\
    \ see the following logged to the console:\n\n`Let’s get started!` (no five-second\
    \ pause).\n\n`Promise { <pending> }`\n\n`I had to wait for the call above to finish!`\n\
    \nYou can clearly see where the promise (or any other function that takes time\
    \ to execute) sits and how it has not been given a chance to finish before proceeding\
    \ onto the next line of code, resulting in potential instability. Add the `await`\
    \ keyword in and the correct order of events would be restored.\n\n# 10 Classes\n\
    \nMost ABAP developers are familiar with the concept of a class in the realm of\
    \ object-oriented programming. This section assumes you know at least the very\
    \ basics of ABAP classes and the object-oriented programming paradigm, and illustrates\
    \ how to recreate a class using JavaScript syntax.\n\nYour JavaScript class acts\
    \ as a blueprint for an object, and just like an ABAP class, you have the same\
    \ building blocks to build that object blueprint, including attributes, methods,\
    \ a constructor, static and dynamic attributes, and even inheritance.\n\n## 10.1\
    \ Class Definition\n\nClasses in JavaScript can be defined using either a class\
    \ declaration or a class expression. A class expression can further be defined\
    \ as named or unnamed. In [Listing 10.1](#10_001.html_l10.1), we declare our class\
    \ with the `class` keyword followed by the name of our class, `car`.\n\n```javascript\n\
    class car {\n  constructor(make, model) {\n    (this.make = make);\n  }\n}\nconsole.log(car.name);\
    \ // car \n```\n\n**Listing 10.1** Class Declaration\n\nIn [Listing 10.2](#10_001.html_l10.2),\
    \ we declare an unnamed class (no name after the `class` keyword) using a class\
    \ expression that assigns a class to the variable `myCarClass`.\n\n```javascript\n\
    let myCarClass = class {\n  constructor(make) {\n    this.make = make;\n  }\n\
    };\nconsole.log(myCarClass.name); // myCarClass \n```\n\n**Listing 10.2** Class\
    \ Expression (Unnamed)\n\nIn [Listing 10.3](#10_001.html_l10.3), we assign the\
    \ same class from [Listing 10.2](#10_001.html_l10.2) to the `myCarClass` variable,\
    \ but this time the class is named because we have included the class name `car`\
    \ after the `class` keyword.\n\n```javascript\nlet myCarClass = class car {\n\
    \  constructor(make) {\n    this.make = make;\n  }\n};\nconsole.log(myCarClass.name);\
    \ // car \n```\n\n**Listing 10.3** Class Expression (Named)\n\nOnce the class\
    \ is declared, we use it to instantiate an object by declaring a variable and\
    \ using the `new` keyword, followed by the class name and any parameters needed\
    \ for the constructor. In [Listing 10.4](#10_001.html_l10.4), we instantiate a\
    \ new class object and assign it to the variable `Mercedes`.\n\n```javascript\n\
    class car {\n  constructor(make) {\n    this.make = make;\n  }\n}\nlet newCar\
    \ = new car(\"Mercedes\");\nconsole.log(`${newCar.make}`); // Mercedes \n```\n\
    \n**Listing 10.4** Class Object\n\nIn [Listing 10.4](#10_001.html_l10.4), we need\
    \ to pass in the make of our new car object so that the class constructor can\
    \ assign it as a property to the object itself using the `this` keyword. Once\
    \ we have our new car object, we can call the properties of that object and, in\
    \ this case, log them to the console.\n\n## 10.2 Methods\n\nJust like ABAP, we\
    \ can add methods to our JavaScript class that allow us to interact with the instantiated\
    \ objects. The syntax looks like a normal JavaScript function and includes the\
    \ `method_name` followed by `()` holding the parameters and the actual logic within\
    \ `{}`.\n\nUsing our example from [Listing 10.4](#10_001.html_l10.4), we add five\
    \ new methods under the constructor in [Listing 10.5](#10_002.html_l10.5). They\
    \ are starting and stopping the engine, increasing speed, applying the brakes,\
    \ and logging our speed to the console. We also add our car’s speed as a new attribute\
    \ to keep track of how fast we are going.\n\n```javascript\nclass car {\n  constructor(make)\
    \ {\n    (this.make = make), (this.current_speed = 0);\n  }\n  start_engine()\
    \ {\n    console.log(\"Car started!\");\n    this.log_speed();\n  }\n  stop_engine()\
    \ {\n    console.log(\"Engine off.\");\n  }\n  accelerate(kmh) {\n    typeof kmh\
    \ === \"number\"\n      ? (this.current_speed += kmh)\n      : console.error(\"\
    parameter must be a number\");\n    this.log_speed();\n  }\n  brake() {\n    this.current_speed\
    \ = 0;\n    this.log_speed();\n  }\n  log_speed() {\n    console.log(`Speedometer:\
    \ ${this.current_speed}`);\n  }\n}\n\nlet newCar = new car(\"Mercedes\");\nconsole.log(`${newCar.make}`);\
    \ // Mercedes\nnewCar.start_engine();\nnewCar.accelerate(5);\nnewCar.accelerate(10);\n\
    newCar.accelerate(10);\nnewCar.brake();\nnewCar.stop_engine(); \n```\n\n**Listing\
    \ 10.5** JavaScript Class Methods\n\nRun the code from [Listing 10.5](#10_002.html_l10.5)\
    \ and the output to the console will be as shown in [Listing 10.6](#10_002.html_l10.6).\n\
    \n```\nMercedes\nCar started!  \nSpeedometer: 0\nSpeedometer: 5\nSpeedometer:\
    \ 15\nSpeedometer: 25\nSpeedometer: 0\nEngine off. \n```\n\n**Listing 10.6** Output\
    \ from Listing 10.5\n\nWe were able to call the methods of our new object methods\
    \ as defined in our `car` class in the same way we access the classes’ attributes\
    \ (using the `.` notation), letting us control the car object and take it for\
    \ a spin.\n\n## 10.3 Static versus Dynamic Attributes and Methods\n\nJavaScript\
    \ class attributes and methods can be declared as static, as with ABAP. If you\
    \ declare a static attribute or method in your JavaScript class, you can access\
    \ it directly through the class without needing to instantiate an object. The\
    \ drawback is you will not be able to access those same static attributes or methods\
    \ from instances of that class.\n"
