  trans: "\n\n```\nlet firstName = \"John\";\nlet lastName = \"Doe\";\nlet age = 34;\n\
    let person = firstName + \" \" + lastName + \" is \" + age + \" years old.\";\n\
    console.log(person); // John Doe is 34 years old. \n```\n\n### 列表 3.5 使用 + 进行字符串拼接\n\
    \n你可能会发现上一个示例中的变量拼接冗长且复杂。在 JavaScript 中，有一种更简洁的字符串拼接方法，称为**模板字面量**（template literals），类似于\
    \ ABAP 中的字符串模板。它们允许你在反引号（`` ``）之间构建字符串，其中使用 `${}` 引用的变量周围的空格和其他文本都会被考虑在内。列表 3.6\
    \ 显示了如何从 列表 3.5 引用相同的三个变量，但以一种更自然的类似句式的结构来排列它们，而不是在字符串之间声明字面量空间。\n\n```javascript\n\
    let firstName = \"John\";\nlet lastName = \"Doe\";\nlet age = 34;\nlet person\
    \ = `${firstName} ${lastName} is ${age} years old.`;\nconsole.log(person); //\
    \ John Doe is 34 years old. \n```\n\n### 列表 3.6 模板字面量\n\n## 3.3 比较运算符\n\nABAP\
    \ 的比较运算符在语法和功能上与 JavaScript 相似，允许你比较变量或值。然而，在 JavaScript 中，你评估的是差异，它根据比较的结果可能是\
    \ `true` 或 `false`，如 列表 3.7 所示。\n\n```javascript\na = 20;\nconsole.log(a != 21);\
    \ // true\nconsole.log(a < 20); // false\nconsole.log(a <= 20); // true\nconsole.log(a\
    \ > 20); // false\nconsole.log(a >= 20); // true \n```\n\n### 列表 3.7 比较运算符\n\n\
    ABAP 和 JavaScript 之间唯一的区别在于等于 (`=`) 和不等于 (`!=`) 运算符，这是由于 JavaScript 的动态类型导致的。根据\
    \ 表 3.1，你需要扩展你的 `=` 或 `!=` 以包含对值和类型的比较。\n\n| 运算符 | 描述 |\n| --- | --- |\n| `==`\
    \ | 仅比较实际值 |\n| `===` | 比较值和类型 |\n| `!=` | 仅比较值 |\n| `!==` | 比较值和类型 |\n\n### 表\
    \ 3.1 比较运算符类型\n\n在 列表 3.8 中，你会看到如果使用 `==` 运算符将变量 `b`（值为 `25`）与字符串 `\"25\"` 比较，它将被评估为\
    \ `true`，因为没有比较类型。当你对同一个比较使用 `===` 时，它会被评估为 `false`，因为考虑考虑了类型（且类型不匹配，即 `number`\
    \ 和 `string`）。同样的原理也适用于 `!=` 运算符。\n\n```javascript\nb = 25;\nconsole.log(b ==\
    \ 25); // true\nconsole.log(b == 30); // false\nconsole.log(b == \"25\"); // true\
    \ 因为没有类型比较\nconsole.log(b === 25); // true\nconsole.log(b === 30); // false\n\
    console.log(b === \"25\"); // false 因为有类型比较\nconsole.log(b != 25); // false\n\
    console.log(b != 30); // true\nconsole.log(b != \"25\"); // false 因为没有类型比较\nconsole.log(b\
    \ !== 25); // false\nconsole.log(b !== 30); // true\nconsole.log(b !== \"25\"\
    ); // true 因为有类型比较 \n```\n\n### 列表 3.8 带有类型和值的比较运算符\n\n## 3.4 逻辑运算符\n\nJavaScript\
    \ 也有逻辑运算符：与（&&`）、或（`||`）和非（`!`），例如，它们可以与比较运算符结合使用。在 列表 3.9 中，我们在括号内将变量 `a` 和 `b`\
    \ 与硬编码数字进行比较。我们使用 `&&` 表示比较 1 和比较 2 必须评估为 `true` 结果才为完全为真。我们使用 `||` 表示我们只需要其中之一评估为\
    \ `true` 结果才为完全为真。最后，当比较不为 `true` 时，我们使用 `!` 使其结果评估为 `true`。\n\n```javascript\n\
    let a = 10;\nlet b = 20;\nconsole.log(a === 10 && b === 20);  // true\nconsole.log(a\
    \ === 20 && b === 10);  // false\nconsole.log(a === 10 && b === 11);  // false\n\
    console.log(a === 10 || b === 20);  // true\nconsole.log(a === 10 || b === 21);\
    \  // true\nconsole.log(!(a === b));            // true \n```\n\n### 列表 3.9 逻辑运算符\n\
    \n## 3.5 条件运算符\n\n与 ABAP 一样，你有传统的条件语句 `if`、`else` 和 `else if`。`if` 和 `else if`\
    \ 都会在两个值之间运行比较并在满足该条件时执行某些代码。`if` 语句后面跟着括号中要评估的条件，如果满足条件（即为 `true`），则执行大括号中的代码。`else\
    \ if` 语句的工作方式相同，当第一个 `if` 条件不满足时触发，并检查另一个条件。`else` 语句插入在你的条件逻辑的末尾，取决于你的情况位于 `if`\
    \ 或 `else if` 之后，如果它之前的所有其他语句均为 `false`，则触发它。\n\n如果你原样运行 列表 3.10 中的代码，应该会得到输出“100\
    \ is definitely 100 or less”。如果你将变量 `a` 的值改为 110，你应该会看到输出“110 is simply not less\
    \ than 100”。最后，如果你将变量 `a` 改为类似 `hello` 的字符串，那么你的 `else` 语句将会被触发，并在控制台打印“hello\
    \ is just not a number”。\n\n```javascript\nlet a = 100;\nif (a <= 100) {\n  console.log(`${a}\
    \ is definitely 100 or less`);\n} else if (a > 100) {\n  console.log(`${a} is\
    \ simply not less than 100`);\n} else {\n  console.log(`${a} is just not a number`);\n\
    } \n```\n\n### 列表 3.10 条件运算符：if 语句\n\n在 ABAP 中，我们可以使用 `COND` 语句将 列表 3.10 所示的条件逻辑压缩为一行简洁的代码，如下：\n\
    \n```abap\nDATA(lv_num) = COND #( WHEN iv_num IS INITIAL THEN 0 ELSE iv_num ).\n\
    ```\n\n"
- fmt: "\nIn JavaScript, we can replicate the `COND` statement using the ternary operator.\
    \ It takes the first four lines of comparison logic we wrote in [Listing 3.10](#03_005.html_l3.10)\
    \ (the `if` and `else if` part) and immediately makes the code more concise. This\
    \ can be seen in [Listing 3.11](#03_005.html_l3.11), where we assign our `output`\
    \ variable the result of the ternary logic. If `a <= 100` is true, return the\
    \ value just after the `?`. If it is false, then return the value just after the\
    \ `:`.\n\n```javascript\nlet a = 110;\nlet output =\n  a <= 100\n    ? `${a} is\
    \ definitely less than 100`\n    : `${a} is simply not less than 100`;\nconsole.log(output);\
    \ \n```\n\n**Listing 3.11** Ternary Operator\n\nThe ternary operator can also\
    \ be chained, allowing you to completely encompass the logic from [Listing 3.10](#03_005.html_l3.10),\
    \ as shown in [Listing 3.12](#03_005.html_l3.12).\n\n```javascript\nlet a = \"\
    hello\";\nlet output =\n  a <= 100\n    ? `${a} is definitely less than 100`\n\
    \    : a >= 100\n    ? `${a} is simply not less than 100`\n    : `${a} is just\
    \ not a number`;\nconsole.log(output); \n```\n\n**Listing 3.12** Ternary Operator\
    \ Chained\n\nThe code in [Listing 3.12](#03_005.html_l3.12) does the same thing\
    \ as [Listing 3.10](#03_005.html_l3.10), but the code is far more concise, although\
    \ the syntax can be hard to read at first. To help with the syntax, remember anything\
    \ written after the `?` is what runs if the condition evaluates to `true` and\
    \ everything after the `:` runs if the previous statement evaluates to `false`,\
    \ even if that is another comparison statement.\n\nAnother important conditional\
    \ operator in ABAP is the `SWITCH` statement, which is a great way to avoid a\
    \ large number of nested `IF` statements. The `switch` statement in JavaScript\
    \ is again like its ABAP counterpart and, aside from a few syntactical differences,\
    \ performs much the same way. You create a `switch` statement and add your expression\
    \ to be evaluated in brackets, followed by your `case` statements with the code\
    \ to be executed if the case condition is met. If a condition is met, you add\
    \ a `break` statement to exit the `switch` statement after your code is executed.\
    \ The `default` statement is added at the end to handle things if none of the\
    \ `case` statements are met. [Listing 3.13](#03_005.html_l3.13) shows an example\
    \ where we declare a `company` variable and use a `switch` statement to evaluate\
    \ if its value matches any of the companies in the `case` statements. In this\
    \ scenario, it matches the `case \"SAP\":` statement, so the `\"Something about\
    \ SAP\"` text is logged to the console.\n\n```javascript\nlet company = \"SAP\"\
    ;\nswitch (company) {\n  case \"Microsoft\":\n    console.log(\"Something about\
    \ Microsoft\");\n    break;\n  case \"Google\":\n    console.log(\"Something about\
    \ Google\");\n    break;\n  case \"SAP\":\n    console.log(\"Something about SAP\"\
    );\n    break;\n  default:\n    console.log(\"No company here :(\");\n} \n```\n\
    \n**Listing 3.13** switch Statement\n\nRun the code in [Listing 3.13](#03_005.html_l3.13)\
    \ as is, and your output should be `\"Something about SAP\"` because that is the\
    \ `case` condition matching our `company` variable. Try changing the `company`\
    \ variable and trigger each of the other `case` statements, as well as the default.\n\
    \n## 3.6 Loops\n\nIn ABAP, we have unconditional loops using `DO`, conditional\
    \ loops using `WHILE`, and the `LOOP` statement to loop through internal tables.\
    \ In JavaScript, we have `do`, `do…while`, and `while` loops as in ABAP, but with\
    \ the addition of a `for` loop instead of the ABAP `LOOP` statement. We’ll walk\
    \ through each in the following sections.\n\n### For Loop\n\nThe most common loop\
    \ you will learn in JavaScript is the `for` loop, which might look a bit strange\
    \ compared to `LOOP AT` in ABAP. The loop is controlled by the logic in the brackets\
    \ and breaks down as follows:\n\n*   `let count = 0`: Creating a variable to be\
    \ used in the iteration.\n*   `count <= 10`: Looping until the `count` variable\
    \ hits ten or less.\n*   `count++`: Tells the variable to add one to itself (`count--`\
    \ counts down).\n\nThe complete syntax would look like we see in [Listing 3.14](#03_005.html_l3.14).\n\
    \n```javascript\nfor (let count = 0; count <= 10; count++) {\n  console.log(count);\n\
    } \n```\n\n**Listing 3.14** for Syntax\n\nThe output should be a count from `0...10`,\
    \ where we logged the `count` variable to the console so you can see how the iteration\
    \ works. You can also count down from 10 by setting `count` to `10`, the iteration\
    \ to stop when `count >= 0`, and the count to increment down with `-=`.\n\n###\
    \ Do While\n\nThe `do while` loop works in a similar way to the `for` loop, but\
    \ is arranged slightly differently. You execute your logic using the `do` statement\
    \ and control your iterations using the `while` statement at the end, as shown\
    \ in [Listing 3.15](#03_005.html_l3.15).\n\n```javascript\nlet count = 0;\ndo\
    \ {\n  console.log(count);\n  count += 1;\n} while (count <= 10); \n```\n\n**Listing\
    \ 3.15** do while Statement\n\nThe output should mirror the `for` loop in [Listing\
    \ 3.14](#03_005.html_l3.14), a count from `0…10`. Again, you can try reversing\
    \ the count and logging the increments from `10…0` by changing the `count` variable\
    \ to `10`, swapping out the `+=` for `-=` and changing the `while` condition to\
    \ `(count >= 0)`.\n\n### While\n\nThe `while` statement works like the `do while`\
    \ statement in [Listing 3.15](#03_005.html_l3.15), except you start with your\
    \ `while` statement and execute your code (including the iteration control) below\
    \ the statement itself, as shown in [Listing 3.16](#03_005.html_l3.16).\n"
