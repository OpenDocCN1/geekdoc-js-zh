    \ text to element properties including CSS, even adding entirely new DOM elements.\
    \ In our previous example, we changed the <samp class=\"listingcharacter\">innerHTML</samp>,\
    \ which is the content of the element, i.e., the text between the <samp class=\"\
    listingcharacter\"><p></p></samp> tags. In [Listing 7.1](#07_004.html_l7.1), we\
