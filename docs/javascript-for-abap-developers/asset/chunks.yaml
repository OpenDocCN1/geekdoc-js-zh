  trans: "\n\n例如，在 VS Code 中，你可以使用快捷键 `Ctrl` + `[/]` 对选中的代码行进行注释/取消注释。\n\n# 2 变量和数据类型\n\
    \n与 ABAP 一样，JavaScript 变量用于存储可以在程序中使用的值。如第 1 节 所述，原生（标准）JavaScript 是一种弱类型编程语言，而相比之下，ABAP\
    \ 是强类型的。这意味着你在 JavaScript 中定义变量时只需要一个值而不需要类型声明，就像 ABAP 中的内联声明一样。然而，在 JavaScript\
    \ 中，你也可以声明一个没有值的变量，其类型在赋值之前将保持为 `undefined`。你甚至可以对变量进行重新赋值，因此如果一个变量的类型是 `number`，你只需通过重新赋一个新的\
    \ `string` 类型的值即可将其类型更改为 `string`。\n\n这种灵活性非常棒，因为它允许你快速构建内容、进行更改并执行想法，而无需遵循像 ABAP\
    \ 编译器那样的严格规则。然而，在整个代码中使用变量时必须谨慎对待；因为函数可能依赖于变量的特定类型，而由于变量类型很容易改变，该函数更有可能在没有任何明显原因的情况下崩溃。\n\
    \n在本节中，我们将介绍如何使用旧语法和现代语法来声明变量，以及可以使用哪些数据类型。我们还将在全局和局部作用范围内上下文中访问这些变量。\n\n## 2.1\
    \ 变量\n\n在 ABAP 中，你使用 `DATA` 语句来定义变量，包括它的类型以及可能包含的值，如下：\n\n```\nDATA: lv_car TYPE\
    \ string VALUE \"Mercedes\".\n```\n\n在 JavaScript 中，你使用赋值运算符（`=` 符号）来声明变量并为其赋值。你还拥有看起来非常相似的比较运算符；例如\
    \ `==`，意思是“等于”。我们将在第 3 节中更地介绍比较运算符。在变量声明中使用 `=` 符号的形式所示列表 2.1。\n\n```\nvar a =\
    \ 10;        // 给 a 赋一个数值值\nvar b = 12;        // 给 b 赋一个数值值\nvar c = a + b; \
    \   // 将 a 和 b 的和赋给 c\nvar.log(a)\nconsole.log(b)\nconsole.log(c) \n```\n\n**列表\
    \ 2.1 变量声明**\n\n输出如下：\n\n```\n10\n12\n22 \n```\n\n注意你如何给变量赋值数字，也可以赋值数字或变量的和。尝试将你的变量重命名为更合适的名称，就像我们在列表\
    \ 2.2 中的示例一样。\n\n```\nvar applePrice = 10;            // 给 applePrice 赋一个数值值\n\
    var bannanaPrice = 12;            // 给 bannanaPrice 赋一个数值值\nvar total = applePrice\
    \ + bannanaPrice;    // 将 applePrice 和 bannanaPrice 的和赋给 total\nconsole.log(applePrice);\n\
    console.log(bananaPrice);\nconsole.log(total); \n```\n\n**列表 2.2 重命名的变量**\n\n\
    输出是相同的：\n\n```\n10\n12\n22 \n```\n\n所有的 JavaScript 变量必须使用唯一的名称（称为标识符），尽可能描述，并遵循以下通用规则：\n\
    \n*   标识符是区分大小写的。`A` 和 `a` 不同。\n*   标识符必须以字母开头。\n*   标识符不能使用 JavaScript 保留关键字，如\
    \ `var` 或 `function`。\n*   标识符可以包含数字、字母、美元符号和下划线。\n*   虽然不是真正的规定，但你可以决定是否要使用驼峰命名法（camel\
    \ case）。\n\nJavaScript 中的字符串使用引号赋值，而数字则不然。在列表 2.3 的示例中，注意我们如何可以在变量中存储数字或字符串，并且能够将变量连接在一起并将它们打印到控制台。\n\
    \n```\nvar height = 1.8;\nvar firstName = \"John\";\nvar lastName = \"Smith\"\
    ;\nconsole.log(firstName + \" \" + lastName + \" is \" + height + \"m tall.\"\
    ); \n```\n\n**列表 2.3 字符串和数字变量**\n\n输出如下：\n\n```\nJohn Smith is 1.8m tall. \n```\n\
    \n与上一个示例一样，尝试使用相同的 `+` 符号将一些数字相加，但像处理字符串一样将其中一个数字放在引号中，如列表 2.4 所示。第一个数字在引号内意味着其余数字将将被视为字符串，导致变量的类型变为\
    \ `string`。\n\n```\nvar a = \"9\" + 1 + 7;\nconsole.log(a);\nconsole.log(typeof\
    \ a) \n```\n\n**列表 2.4 变量类型的影响**\n\n输出如下：\n\n```\n917\nstring \n```\n\n你还可以声明空变量（没有值的变量），在\
    \ JavaScript 中这意味着该变量的值为 `undefined`，如列表 2.5 所示。在下一行中，当你给变量赋值后，如果如果你尝试将变量打印到控制台，你现在将看到新值。\n\
    \n```\nvar firstName;\nconsole.log(firstName);\nfirstName = \"John\";\nconsole.log(firstName);\
    \ \n```\n\n**列表 2.5 未定义的变量**\n\n输出如下：\n\n```\nUndefined\nJohn \n```\n\n## 2.2\
    \ 数据类型\n\n在 JavaScript 中，你有六种被称为“原始类型”（primitives）的数据类型。如果一个 JavaScript 数据类型不是对象且没有可以更改的方法（类型本身是不可变的），则被认为是原始类型。\n\
    \n这与 JavaScript 的结构类型（如数组和对象）形成对比，结构类型是可变的并且可以更改（我们将在[第 5 节]中详细讨论）。列表 2.6 显示了一些数据类型（包括原始和结构类型）的列表以及你如何声明它们。\n\
    \n```\nvar car // undefined (原始类型)\nvar weightKg = 10; // Number (原始类型)\nvar dogsName\
    \ = \"Spot\"; // String (原始类型)\nvar isTaskComplete = false; // Boolean (原始类型)\n\
    var numberArray = [1,2,3,4,5] // Object (结构类型)\nvar object = {firstName:\"John\"\
    , \nlastName:\"Smith\"}; // Object (结构类型) \n```\n\n**列表 2.6 JavaScript 类型**\n\n\
    你可以声明空变量，其值和类型都是 `undefined`，如下：\n\n```\nvar car; \nconsole.log(car); // undefined\n\
    console.log(typeof car); // undefined\n```\n\n你也可以声明一个空变量，其值为空但类型为 `string`，如下：\n\
    \n```\nvar car = \"\"; \nconsole.log(car); // blank\nconsole.log(typeof car);\
    \ // string\n```\n\n为了让情况更复杂，你可以在同一个作用范围内更改像 `car` 这样的变量的类型。这就是为什么说 JavaScript\
    \ 具有动态类型，以及为什么你必须特别注意你的变量。例如，列表 2.7 显示了我们从一个类型为 `undefined` 的 `car` 变量开始，并赋值字符串\
    \ `BMW`，这会将变量类型更改为 `string`。然后我们又更改了两次类型，从 `string` 变为 `boolean`，最后到 `number`，仅仅是为了赋一个新值。\n\
    \n```\nvar car;\nconsole.log(typeof car); // undefined\ncar = \"BMW\";\nconsole.log(typeof\
    \ car); // string\ncar = true;\nconsole.log(typeof car); // boolean\ncar = 24;\n\
    console.log(typeof car); // number \n```\n\n**列表 2.7 动态类型**\n"
- fmt: "\nAnother important concept regarding data types in JavaScript is how JavaScript\
    \ evaluates expression from left to right, and the results can be different depending\
    \ on what combination you use. This is in stark contrast to ABAP, where variables\
    \ must be typed first and you will get a type error if you try to add a string\
    \ to a number. In the following example, the number `42` will be treated as a\
    \ string because the first part of the expression is the string `\"apple\"`:\n\
    \n```\nvar fruit = \"apple\" + 42;\nconsole.log(fruit); // apple42 \n```\n\nIf\
    \ you then try adding two numbers together first, followed by the addition of\
    \ a string as in the following example, you will find the numbers sum up correctly\
    \ but `\"apple\"` is tagged on the end. So, it ran the calculation first and then\
    \ continued to the addition of the string.\n\n```\nvar fruit = 42 + 8 + \"apple\"\
    ;\nconsole.log(fruit); // 50apple \n```\n\nAs you have seen, JavaScript has a\
    \ built-in operator called `typeof`, which you can use to check the data type\
    \ of your variable. [Listing 2.8](#02_002.html_l2.8) shows how variable `fruit1`\
    \ is type `string` when evaluating the expression from left to right, but following\
    \ that same logic, variable `fruit2` is also type `string` even though we started\
    \ out with the calculation on the left and added a string.\n\n```\nvar fruit1\
    \ = \"apple\" + 42;\nconsole.log(typeof fruit1); // string\nvar fruit2 = 42 +\
    \ 8 + \"apple\";\nconsole.log(typeof fruit2); // string \n```\n\n**Listing 2.8**\
    \ typeof Operator\n\n## 2.3 Scope of Global and Local Variables\n\nIn ABAP, we\
    \ are familiar with the concept of global and local variables. In a simple report\
    \ with a subroutine (`FORM…ENDFORM`), we can declare a global variable outside\
    \ the subroutine, which both the program and subroutine can access. Consequently,\
    \ we can also declare a local variable within the subroutine scope (inside the\
    \ `FORM…ENDFORM`) where it is only accessible to the subroutine and not the rest\
    \ of the program. In JavaScript, you also have global and local variables, but\
    \ your program scope is also split into global scope and local scope. Variables\
    \ declared in the global scope can be accessed from anywhere, but variables declared\
    \ inside a function (local scope) can only be accessed inside their respective\
    \ scopes (not from the global scope). Local scope can further be divided into\
    \ function scope and block scope. We’ll walk through each in the following sections.\n\
    \n### Global Scope\n\nIn [Listing 2.9](#02_003.html_l2.9), we declare the variable\
    \ `car` in the global scope and log this variable to the console within a function’s\
    \ local scope. The function can access the `car` variable and log it to the console\
    \ because the variable has been declared in the global scope.\n\n```\nvar car\
    \ = \"BMW\"; // Declared in the Global scope\nfunction showCar() {\n  console.log(car);\
    \ // car is accessible in this function\n}\nshowCar(); // BMW \n```\n\n**Listing\
    \ 2.9** Global Scope\n\n### Local Scope: Function Scope\n\nFunction scope is the\
    \ scope inside the curly brackets `{…}` of a function (see [Section 4](#04_001.html_h4));\
    \ variables declared here are only accessible within the function itself. Following\
    \ the same example in [Listing 2.10](#02_003.html_l2.10), we now declare our variable\
    \ within the function scope. If we try to log the `car` variable outside the function,\
    \ you will get a `ReferenceError`.\n\n```\nfunction showCar() {\n  var car = \"\
    BMW\"; // variable declared inside the function scope\n  console.log(car); //\
    \ car will be logged to the console\n}\nshowCar(); // BMW\nconsole.log(car); //\
    \ ReferenceError: car2 is not defined \n```\n\n**Listing 2.10** Function Scope\n\
    \n### Local Scope: Block Scope\n\nBlock scope is the scope inside the `{…}` of\
    \ JavaScript statements like `switch`, `if`, `for` loops, and `while` loops. The\
    \ variables declared within the scope of these statements are also only accessible\
    \ inside their respective statements’ block scope. However, this rule only applies\
    \ to variables declared using modern JavaScript syntax, i.e., `let` and `const`.\
    \ Watch how, in [Listing 2.11](#02_003.html_l2.11), a `ReferenceError` is triggered\
    \ when trying to log `car2` to the console.\n\n```\nfunction test() {\n  if (true)\
    \ {\n    var car1 = \"BMW\"; // old syntax - in function scope\n    let car2 =\
    \ \"Audi\"; // modern syntax - in block scope\n  }\n  console.log(car1); // BMW\n\
    \  console.log(car2); // ReferenceError: car2 is not defined\n}\ntest(); \n```\n\
    \n**Listing 2.11** Block Scope inside the Function Scope\n\nThe reason why you\
    \ cannot log `car2` is because it uses the modern syntax `let` and is locked into\
    \ the block scope of the `if` statement, where even the function containing the\
    \ `if` statement cannot access it. Since `car1` was declared using the older syntax,\
    \ `var` can be accessed by the function, as it does not adhere to the `if` statement’s\
    \ block scope.\n\n## 2.4 Old Syntax versus Modern Syntax\n\nBefore ES6 (ECMAScript\
    \ 2015), we only had the `var` keyword to declare variables in JavaScript. From\
    \ ES6 onward, we have the `let` and `const` keywords, giving us more flexibility\
    \ over `var`. These two new keywords are almost identical in nature, except `let`\
    \ allows you to reassign a new value (like `var`), whereas `const` does not. They\
    \ also allow us to declare variables that use block scope (see [Section 2.3](#02_003.html_h2.3)),\
    \ whereas before ES6, we only had function scope and global scope.\n\nWe’ll walk\
    \ through each keyword in the following sections.\n\n### var\n\nVariables using\
    \ the `var` keyword can be changed as well as redeclared. This was one of the\
    \ reasons `let` and `const` were introduced, giving us more control over our variables\
    \ and making code less error prone, as we can now decide whether or not to restrict\
    \ a variable. [Listing 2.12](#02_004.html_l2.12) shows how to both change and\
    \ redeclare a variable using `var`. Here, the variable `firstName` is declared\
    \ with value `John`, then its value is changed to `Johnny`, and finally redeclared\
    \ as `Fred`.\n\n```\nvar firstName = \"John\";\nconsole.log(firstName); // John\n\
    firstName = \"Johnny\"; // Changing a variable\nconsole.log(firstName); // Johnny\n\
    var firstName = \"Fred\"; // Delared a 2nd time\nconsole.log(firstName); // Fred\
    \ \n```\n\n**Listing 2.12** var Keyword\n\nThe output is as follows:\n\n```\n\
    John\nJohnny\nFred \n```\n\n### let\n"
