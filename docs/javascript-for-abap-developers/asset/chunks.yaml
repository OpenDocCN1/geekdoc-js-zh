  trans: "\n点击提交时，你的整个表单 `div` 会平滑消失。很棒的地方是，这种美观的动画效果仅通过三行易读的代码实现的。我们使用 jQuery 选择器选择表单按钮，并注册了点击事件\
    \ `$(\"#form-button\").click()`。在点击事件内部，我们使用另一个 jQuery 选择器来选择整个 `div`，并使用 `slow`\
    \ 速度隐藏它 `$(\"#form-div\").hide(\"slow\")`。你甚至可以指定隐藏动画完成所需的毫秒数，例如 `$(\"#form-div\"\
    ).hide(1000)`。\n\n## 12.5   从 DOM 中向中添加和移除元素\n\n如果你想根据用户输入隐藏或显示表单输入等元素，同时保持整个表单完整，那么我们的\
    \ jQuery `.hide()` 和 `.show()` 示例非常好用。然而，在某些情况下，从网页上完全移除元素并将其替换为全新的元素可能会更有利。在我们的案例中，完全移除表单\
    \ `div` 并将其替换为一个新的 `div` 可能更好，该元素将包含告诉我们表单提交成功的文本。要做到这一点，我们将 Listing 12.5 中的函数替换为\
    \ Listing 12.6 中的函数。\n\n```javascript\n$(\"#form-button\").click(() => {\n   \
    \ let confirmationText =\n      \"<div><p>Thank you, your email was submitted.</p></div>\"\
    ;\n    $(\"#form-div\").remove();\n    $(\"div:last\").append(confirmationText);\n\
    \  }); \n```\n\n**Listing 12.6**  jQuery: 添加和移除元素\n\n我们填写电子邮件地址，点击提交后，我们的整个表单\
    \ `div` 被移除，并添加了一个包含 `p>` 标签的新 `div` 标签。注意我们是如何使用选择器 `$(\"div:last\")` 找到网页上的最后一个\
    \ `div`，并使用 `.append()` 方法紧随其后添加新的 `div` 的。再次，通过极少数行代码，我们找到了想要的元素，删除了它，并在 DOM\
    \ 的特定位置添加了另一个新元素。\n\n## 12.6   修改 CSS\n\njQuery 同样扩展到了修改 CSS 属性甚至添加新属性。根据用户输入操作网页上的\
    \ CSS 是一项常见需求，jQuery 处理得非常优雅。为了演示这一点，让我们为 Listing 12.4 中的 `mouseenter` 事件添加一些\
    \ CSS 更改，以改变背景颜色和字体，如 Listing 12.7 所示。注意我们如何使用 `.` 符号将 jQuery 语句链在一起。\n\n```javascript\n\
    $(\"#text1\").on({\n    mouseenter: function () {\n      $(this)\n        .text(\"\
    Hey! You hovered over me!\")\n        .css(\"background-color\", \"DodgerBlue\"\
    )\n        .css(\"color\", \"white\");\n    },\n    mouseleave: function () {\n\
    \      $(this)\n        .text(\"jQuery is awesome!\")\n        .css(\"background-color\"\
    , \"\")\n        .css(\"color\", \"\");\n    },\n  }); \n```\n\n**Listing 12.7**  jQuery\
    \ CSS 方法\n\n当鼠标悬停在 `\"jQuery is awesome!\"` 文本上时，我们看到悬停文本的背景变为蓝色，字体颜色变为白色，如 Figure\
    \ 12.2 所示。jQuery 方法链是一种在一个处更改 HTML 元素多个部分的特别有用的方法。\n\n![jQuery Hover](img/img-f12.2.html)\n\
    \n**Figure 12.2**   jQuery 鼠标悬停\n\n## 12.7   jQuery AJAX\n\n我们可以使用 jQuery 方法对外部数据进行\
    \ AJAX 查询，就像我们在 Section 11 中做的那样。jQuery 抽象了这些查询的大部分复杂性，并返回我们继续逻辑所需的内容。jQuery 语法在\
    \ Listing 12.8 中所示。\n\n```javascript\n $(\"some-button\").click(() => {\n    $.get(\"\
    https://example.com\", (data, status) => {\n      // Some 逻辑\n    });\n  }); \n\
    ```\n\n**Listing 12.8**   jQuery AJAX 语法\n\n我们有常规 jQuery 选择器和事件 `$(\"some-button\"\
    ).click()`，在其中我们调用 jQuery AJAX HTTP GET 方法 `$.get()`，并传入端点 URL。然后我们指定一个回调函数 `(data,\
    \ status) => {}`，参数 `data` 是请求返回的数据，`status` 是 HTTP 响应状态（例如，成功时为 200）。\n\n在我们的示例中，我们将来自\
    \ Listing 12.9 的代码添加到 `$(\"#form-button\").click()` 方法中，以调用文件 `test_data.json`\
    \ 中的数据，并将其作为电子邮件提交逻辑的一部分显示在警告框中。我们还确保将 Section 11.1 中的 `test_data.json` 文件复制到此示例中\
    \ `app.js` 文件所在的文件夹中。\n\n```javascript\n$.get(\"test_data.json\", (data, status)\
    \ => {\n      alert(`Congratulations! You've won ${data[0]}!`);\n    }); \n```\n\
    \n**Listing 12.9**   jQuery AJAX 示例\n\n随后我们在表单中输入电子邮件，点击提交，然后看到弹出一个“Congratulations!\
    \ You've won a Mercedes!”的警告框，如 Figure 12.3 所示。\n\n![jQuery Call](img/img-f12.3.html)\n\
    \n**Figure 12.3**   jQuery GET 调用\n\n# 13   Web APIs\n\nAPI 是开发者以更简单的方法和简单的语法与复杂事物交互的方式。API\
    \ 是 JavaScript 中一个广泛的主题，因此我们将关注名为 Web API 的区域。Web API 仅仅是基于 Web 的接口，提供了一组你可以使用的方式（如方法），用于进行交互并请求应用程序所需的数据。Web\
    \ API 是 JavaScript 开发的核心功能，允许你利用属于浏览器 API 概念的有用工具。浏览器 API 是特定浏览器的接口，允许我们与运行浏览器的设备进行交互，它们形成了一个让我们的\
    \ JavaScript 代码安全访问应用程序外部资源的的接口。\n\n在本节中，我们将探索 Web API 如何促进浏览器导航、地理定位和浏览器存储。\n\
    \n## 13.1   浏览器导航与历史记录\n"
- fmt: "\nWhen people interact with your app, they are likely going to need to navigate\
    \ from one page to another and, at some point, navigate to the page they came\
    \ from. Your app needs to provide a stable way for this navigation between pages\
    \ to happen. This is where the `History API` comes into play. You can use the\
    \ browser’s `window` object to call either the `location` or `history` object\
    \ to navigate a user from one page to another. Say we have two webpages, the first\
    \ page being `index.html` as shown in [Listing 13.1](#13_001.html_l13.1), and\
    \ the second page being `detail.html` as shown in [Listing 13.2](#13_001.html_l13.2).\
    \ To navigate between them, you can use the JavaScript example shown in [Listing\
    \ 13.3](#13_001.html_l13.3), where we set up two functions that use the `window.location`\
    \ call to navigate to the `detail.html` page and the `window.history` call to\
    \ navigate back in the browser’s history to the `index.html` page.\n\n```html\n\
    <!DOCTYPE html>\n<head>\n    <script src=\"app.js\"></script>\n    <title>Document</title>\n\
    </head>\n<body>\n    <h1>Home Page</h1>\n    <button onclick=\"navigateToDetailPage()\"\
    >Detail Page</button>\n</body>\n</html> \n```\n\n**Listing 13.1** index.html\n\
    \n```html\n<!DOCTYPE html>\n<head>\n    <script src=\"app.js\"></script>\n   \
    \ <title>Document</title>\n</head>\n<body>\n    <h1>Detail Page</h1>\n    <button\
    \ onclick=\"goBack()\">Go Back!</button>\n</body>\n</html> \n```\n\n**Listing\
    \ 13.2** detail.html\n\n```javascript\nconst navigateToDetailPage = () => {\n\
    \  window.location = \"detail.html\";\n};\n\nconst goBack = () => {\n  window.history.back();\n\
    }; \n```\n\n**Listing 13.3** app.js\n\nOn our homepage, click Detail Page and\
    \ navigate to our `detail.html` page using the `navigateToDetailPage()` function\
    \ that uses the `window` object to change the `.location` to `detail.html`, which\
    \ is then loaded into the browser, as shown in [Figure 13.1](#13_001.html_f13.1)\
    \ and [Figure 13.2](#13_001.html_f13.2).\n\nOn the Detail Page, click Go back!\
    \ and navigate to the `index.html` page. This is done using the same `window`\
    \ object, but using the `.history` object instead on which we call the method\
    \ `.back()`, which takes us to the previous page in our browser’s history, `index.html`.\n\
    \n[![Home Page](bilderklein/klein13_001.png)](img-f13.1.html)\n\n**Figure 13.1**\
    \ Home Page\n\n[![Detail Page](bilderklein/klein13_002.png)](img-f13.2.html)\n\
    \n**Figure 13.2** Detail Page\n\n## 13.2 Geolocation\n\nAnother popular API is\
    \ the `Geolocation API`, which, as the name suggests, is used to find the location\
    \ of the device the app is running on. The quickest way for your browser to find\
    \ your location is by your IP or Wi-Fi signal, but when your app tries to get\
    \ the user’s location, a small popup window will normally appear, asking the user\
    \ to confirm if the browser can use geolocation for your app.\n\nTo use geolocation,\
    \ we add the code from [Listing 13.4](#13_002.html_l13.4) into our `app.js` file\
    \ from [Listing 13.3](#13_001.html_l13.3) and add a new button `<button onclick=\"\
    \ alertLocation()\">Show Location</button>` to our `index.html` page, shown previously\
    \ in [Listing 13.1](#13_001.html_l13.1), to call the new function as shown in\
    \ [Listing 13.4](#13_002.html_l13.4).\n\n```javascript\nconst alertLocation =\
    \ () => {\n  if (\"geolocation\" in navigator) {\n    navigator.geolocation.getCurrentPosition((location)\
    \ => {\n      alert(\n        `I am at ${location.coords.latitude} latitude by\
    \ ${location.coords.longitude} longitude`\n      );\n    });\n  } else {\n   \
    \ console.log(\"No geolocation available.\");\n  }\n}; \n```\n\n**Listing 13.4**\
    \ Geolocation API\n\nClick Show Location and then click Allow when the browser\
    \ geolocation permission popup appears, as shown in [Figure 13.3](#13_002.html_f13.3).\
    \ We then see a JavaScript alert with your longitude and latitude as part of the\
    \ text, which is a straightforward way to access the browser’s geolocation functionality\
    \ and incorporate it into your JavaScript code.\n\n[![Browser Geolocation Permission\
    \ Alert](bilderklein/klein13_003.png)](img-f13.3.html)\n\n**Figure 13.3** Browser\
    \ Geolocation Permission Alert\n\n## 13.3 Browser Storage\n\nModern browsers like\
    \ Chrome, Firefox, and Safari all have something called browser storage, where\
    \ they store certain data when you visit a webpage. Depending on the type of browser\
    \ storage used, the data might be kept or deleted after you close the webpage\
    \ or browser window. There are many different reasons for storing data in the\
    \ browser, from identification to security and even preference data.\n\nYour browser\
    \ storage options include local storage, which persists between sessions (when\
    \ you close your webpage); session storage data that expires when you close the\
    \ webpage; and cookies and database storage. For simplicity, we focus on using\
    \ JavaScript to save some data to the browser’s local storage and view it when\
    \ we refresh the page.\n\nBefore we continue, navigate to your browser’s developer\
    \ console (we use Chrome in our example) and look for the `Application` tab, as\
    \ shown in [Figure 13.4](#13_003.html_f13.4).\n\nUnder the `Application` tab,\
    \ you will see a section called `Storage`. Under that, you will see `Local Storage`\
    \ with your webpage underneath it, ready to store data and be used across sessions.\n\
    \n[![Chrome DevTools: Local Storage](bilderklein/klein13_004.png)](img-f13.4.html)\n\
    \n**Figure 13.4** Chrome DevTools: Local Storage\n\nNow, we add the code from\
    \ [Listing 13.5](#13_003.html_l13.5) to our `alertLocation()` function (shown\
    \ previously in [Listing 13.4](#13_002.html_l13.4)), below the `alert()`. When\
    \ we click Show Location, we see the geolocation alert, and after clicking OK,\
    \ we store the latitude data in our browser’s local storage as shown in [Listing\
    \ 13.5](#13_003.html_l13.5).\n\n```javascript\nif (!localStorage.getItem(\"latitude\"\
    )) {\n    localStorage.setItem(\"latitude\", location.coords.latitude);\n  } else\
    \ {\n    alert(\"Latitude is already stored on this browser.\");\n  } \n```\n\n\
    **Listing 13.5** Browser Storage\n\nMake sure the `Application` tab is open in\
    \ Chrome DevTools as per [Figure 13.4](#13_003.html_f13.4), where there are currently\
    \ no entries. With Chrome DevTools open, click Show Location and after clicking\
    \ OK in the alert, you will see the latitude appear in the local storage, as shown\
    \ under the `Value` column in [Figure 13.5](#13_003.html_f13.5).\n\n[![Local Storage\
    \ with Values](bilderklein/klein13_005.png)](img-f13.5.html)\n\n**Figure 13.5**\
    \ Local Storage with Values\n\nRefresh the page and see the latitude entry has\
    \ persisted in the local storage. If we saved the latitude under session storage,\
    \ the value would have been deleted after closing the browser window.\n\n# 14\
    \ Debugging and Error Handling\n\nError handling in JavaScript plays a key role\
    \ in development, and many techniques you use in your ABAP code can be directly\
    \ translated to JavaScript, albeit with slightly different syntax. Due to JavaScript’s\
    \ loose typing system, many errors will not be caught until runtime, so you should\
    \ plan ahead for them.\n\nWhen it comes to debugging, vanilla JavaScript does\
    \ not have a tool like the much-loved ABAP debugger bundled with it. Your scenario\
    \ and personal preference will dictate which tools you use. In our case, we make\
    \ use of Chrome DevTools and the built-in debugger inside VS Code. There are many\
    \ other debugging tools available, but these two are widely used and well documented.\
    \ Alongside these tools, we also use the `console.log()` statement as part of\
    \ your debugging strategy to log values to the console as the code executes.\n"
  raw: "When people interact with your app, they are likely going to need to navigate\
    \ from one page to another and, at some point, navigate to the page they came\
    \ from. Your app needs to provide a stable way for this navigation between pages\
    \ to happen. This is where the History API comes into play. You can use the browser’s\
    \ window object to call either the location or history object to navigate a user\
    \ from one page to another. Say we have two webpages, the first page being index.html\
    \ as shown in [Listing 13.1](#13_001.html_l13.1), and the second page being detail.html\
    \ as shown in [Listing 13.2](#13_001.html_l13.2). To navigate between them, you\
    \ can use the JavaScript example shown in [Listing 13.3](#13_001.html_l13.3),\
    \ where we set up two functions that use the <samp class=\"listingcharacter\"\
    >window.location</samp> call to navigate to the detail.html page and the <samp\
    \ class=\"listingcharacter\">window.history</samp> call to navigate back in the\
    \ browser’s history to the index.html page.\n\n```\n<!DOCTYPE html>\n<head>\n\
    \    <script src=\"app.js\"></script>\n    <title>Document</title>\n</head>\n\
    <body>\n    <h1>Home Page</h1>\n    <button onclick=\"navigateToDetailPage()\"\
    >Detail Page</button>\n</body>\n</html> \n```\n\n**Listing 13.1**     index.html\n\
    \n```\n<!DOCTYPE html>\n<head>\n    <script src=\"app.js\"></script>\n    <title>Document</title>\n\
    </head>\n<body>\n    <h1>Detail Page</h1>\n    <button onclick=\"goBack()\">Go\
    \ Back!</button>\n</body>\n</html> \n```\n\n**Listing 13.2**     detail.html\n\
    \n```\nconst navigateToDetailPage = () => {\n  window.location = \"detail.html\"\
    ;\n};\n\nconst goBack = () => {\n  window.history.back();\n}; \n```\n\n**Listing\
    \ 13.3**     app.js\n\nOn our homepage, click Detail Page and navigate to our\
    \ detail.html page using the <samp class=\"listingcharacter\">navigateToDetailPage()</samp>\
    \ function that uses the <samp class=\"listingcharacter\">window</samp> object\
    \ to change the <samp class=\"listingcharacter\">.location</samp> to <samp class=\"\
    listingcharacter\">detail.html,</samp> which is then loaded into the browser,\
    \ as shown in [Figure 13.1](#13_001.html_f13.1) and [Figure 13.2](#13_001.html_f13.2).\n\
    \nOn the Detail Page, click Go back! and navigate to the index.html page. This\
    \ is done using the same window object, but using the <samp class=\"listingcharacter\"\
    >.history</samp> object instead on which we call the method <samp class=\"listingcharacter\"\
    >.back()</samp>, which takes us to the previous page in our browser’s history,\
    \ index.html.\n\n[![Home Page](bilderklein/klein13_001.png)](img-f13.1.html)\n\
    \n**Figure 13.1**     Home Page\n\n[![Detail Page](bilderklein/klein13_002.png)](img-f13.2.html)\n\
    \n**Figure 13.2**     Detail Page\n\n## 13.2    Geolocation\n\nAnother popular\
    \ API is the Geolocation API, which, as the name suggests, is used to find the\
    \ location of the device the app is running on. The quickest way for your browser\
    \ to find your location is by your IP or Wi-Fi signal, but when your app tries\
    \ to get the user’s location, a small popup window will normally appear, asking\
    \ the user to confirm if the browser can use geolocation for your app.\n\nTo use\
    \ geolocation, we add the code from [Listing 13.4](#13_002.html_l13.4) into our\
    \ app.js file from [Listing 13.3](#13_001.html_l13.3) and add a new button <samp\
    \ class=\"listingcharacter\"><button onclick=\" alertLocation()\">Show Location</button></samp>\
    \ to our index.html page, shown previously in [Listing 13.1](#13_001.html_l13.1),\
    \ to call the new function as shown in [Listing 13.4](#13_002.html_l13.4).\n\n\
    ```\nconst alertLocation = () => {\n  if (\"geolocation\" in navigator) {\n  \
    \  navigator.geolocation.getCurrentPosition((location) => {\n      alert(\n  \
    \      `I am at ${location.coords.latitude} latitude by ${location.coords.longitude}\
    \ longitude`\n      );\n    });\n  } else {\n    console.log(\"No geolocation\
    \ available.\");\n  }\n}; \n```\n\n**Listing 13.4**     Geolocation API\n\nClick\
    \ Show Location and then click Allow when the browser geolocation permission popup\
    \ appears, as shown in [Figure 13.3](#13_002.html_f13.3). We then see a JavaScript\
    \ alert with your longitude and latitude as part of the text, which is a straightforward\
    \ way to access the browser’s geolocation functionality and incorporate it into\
    \ your JavaScript code.\n\n[![Browser Geolocation Permission Alert](bilderklein/klein13_003.png)](img-f13.3.html)\n\
    \n**Figure 13.3**     Browser Geolocation Permission Alert\n\n## 13.3    Browser\
    \ Storage\n\nModern browsers like Chrome, Firefox, and Safari all have something\
    \ called browser storage, where they store certain data when you visit a webpage.\
    \ Depending on the type of browser storage used, the data might be kept or deleted\
    \ after you close the webpage or browser window. There are many different reasons\
    \ for storing data in the browser, from identification to security and even preference\
    \ data.\n\nYour browser storage options include local storage, which persists\
    \ between sessions (when you close your webpage); session storage data that expires\
    \ when you close the webpage; and cookies and database storage. For simplicity,\
    \ we focus on using JavaScript to save some data to the browser’s local storage\
    \ and view it when we refresh the page.\n\nBefore we continue, navigate to your\
    \ browser’s developer console (we use Chrome in our example) and look for the\
    \ Application tab, as shown in [Figure 13.4](#13_003.html_f13.4).\n\nUnder the\
    \ Application tab, you will see a section called Storage. Under that, you will\
    \ see Local Storage with your webpage underneath it, ready to store data and be\
    \ used across sessions.\n\n[![Chrome DevTools: Local Storage](bilderklein/klein13_004.png)](img-f13.4.html)\n\
    \n**Figure 13.4**     Chrome DevTools: Local Storage\n\nNow, we add the code from\
    \ [Listing 13.5](#13_003.html_l13.5) to our <samp class=\"listingcharacter\">alertLocation()</samp>\
    \ function (shown previously in [Listing 13.4](#13_002.html_l13.4)), below the\
    \ <samp class=\"listingcharacter\">alert()</samp>. When we click Show Location,\
    \ we see the geolocation alert, and after clicking OK, we store the latitude data\
    \ in our browser’s local storage as shown in [Listing 13.5](#13_003.html_l13.5).\n\
    \n```\nif (!localStorage.getItem(\"latitude\")) {\n    localStorage.setItem(\"\
    latitude\", location.coords.latitude);\n  } else {\n    alert(\"Latitude is already\
    \ stored on this browser.\");\n  } \n```\n\n**Listing 13.5**     Browser Storage\n\
    \nMake sure the Application tab is open in Chrome DevTools as per [Figure 13.4](#13_003.html_f13.4),\
    \ where there are currently no entries. With Chrome DevTools open, click Show\
    \ Location and after clicking OK in the alert, you will see the latitude appear\
    \ in the local storage, as shown under the Value column in [Figure 13.5](#13_003.html_f13.5).\n\
    \n[![Local Storage with Values](bilderklein/klein13_005.png)](img-f13.5.html)\n\
    \n**Figure 13.5**     Local Storage with Values\n\nRefresh the page and see the\
    \ latitude entry has persisted in the browser’s local storage. If we saved the\
    \ latitude under session storage, the value would have been deleted after closing\
    \ the browser window.\n\n# 14    Debugging and Error Handling\n\nError handling\
    \ in JavaScript plays a key role in development, and many techniques you use in\
    \ your ABAP code can be directly translated to JavaScript, albeit with slightly\
    \ different syntax. Due to JavaScript’s loose typing system, many errors will\
    \ not be caught until runtime, so you should plan ahead for them.\n\nWhen it comes\
    \ to debugging, vanilla JavaScript does not have a tool like the much-loved ABAP\
    \ debugger bundled with it. Your scenario and personal preference will dictate\
    \ which tools you use. In our case, we make use of Chrome DevTools and the built-in\
    \ debugger inside VS Code. There are many other debugging tools available, but\
    \ these two are widely used and well documented. Alongside these tools, we also\
    \ use the <samp class=\"listingcharacter\">console.log()</samp> statement as part\
    \ of your debugging strategy to log values to the console. This allows us to follow\
    \ the output of our logic as the code executes to help spot any issues."
