  md: '# Registering and Modifying Session Variables


    The goal of this script is to register a variable and change its value during
    the course of a user session.


    +   1. Open a new file in your text editor, start a PHP block, and call the `session_start()`
    function:

    ```php

    session_start();

    ```

    2. Register a variable called count:

    ```php

    session_register(''count'');

    ```

    > Note Now, for as long as this session exists, a variable `$SESSION[count]` will
    be available. Currently, the variable has no value.

    3. Increment the value of `$SESSION[count]` to account for the current access:

    ```php

    $SESSION[count]++;

    ```

    4. Create a string to hold a message, including the value of `$SESSION[count]`:

    ```php

    $msg = ">You''ve been here $SESSION[count] times. Thanks!</p>";

    ```

    5. Close the PHP block and start the following HTML:

    ```html

    <HTML>

    <HEAD>

    <TITLE>Count Me!</TITLE>

    </HEAD>

    <body>

    ```

    6. Display the message string:

    ```php

    <?php echo "$msg";  ?>

    ```

    7. Add some more HTML so that the document is valid:

    ```html

    </body>

    </HTML

    ```

    8. Save the file with the name `countme.php`, and place this file in the document
    root of your web server.

    9. Open your web browser and type `http://127.0.0.1/countme.php`.


    Unless you closed your web browser between the last script and now, your old session
    will still be active and you won''t see the cookie approval dialog box. You should
    just see the following figure.'
