  md: '# Chapter 23: Managing a Simple Mailing List


    # Overview


    Eventually, your website will have visitors, and someday you might even want to
    send a newsletter to them. You can create a very simple subscription and publication
    mechanism using PHP and MySQL. In this chapter, you learn how to:


    +   - Create a subscribe/unsubscribe script

    - Create a front end to sending to a newsletter

    - Create a script that mails your newsletter to all recipients in your database'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# A Brief Word About Mailing List Software


    Several very good mailing list applications are available to send to large numbers
    of e-mail addresses. The type of system you''ll build in this chapter should be
    used only for small list, of less than a few hundred e-mail addresses.


    The system described in this chapter was born from my laziness one day, when I
    didn''t want to download and install any third-party software. I just made some
    very simple files that performed a task. That''s the beauty of PHP: It''s a simple
    language that sometimes it''s easier to write a few scripts to download or install
    something. However, when your mailing list grows large enough, please move to
    a more robust mailing list application that''s a bit easier on your outgoing mail
    server, and also on you, the administrator.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Developing a Subscription Mechanism


    Before you start sending mail to a mailing list, you need to build up that subscriber
    base. A simple subscribe/unsubscribe script will take care of that! This script
    will add or delete records in a MySQL database, called subscribers, which you
    will create in the next section.


    # Creating the subscribers Table


    My subscribers table has three fields, as shown in Table 23.1. You can have as
    many or as few fields as you want.


    **Table 23.1: Fields for the subscribers Table**


    | Field Name | Description |

    | --- | --- |

    | id | A primary key that holds the subscriber''s auto-incrementing ID number
    |

    | email_addr | Holds the subscriber''s e-mail address |

    | date_added | The date the user subscribed |


    Next, you''ll actually to create this table-using the script you''re familiar
    at this point! http://127.0.0.1/show_createtable.html.


    +   1. Open your web browser

    2. In the Name field, type `subscribers`.

    3. In the Number of Fields field, type 3.

    4. Click the Go to Step 2 button, you will see three rows, corresponding to the
    three fields you want to create in the `subscribers` table.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_308_0.png)


    Populate the fields in these next steps:


    +   1. In the first row, type `id` for Field Name, select `int` from the Field
    Type drop-down menu, check the check box for Primary Key, and check the box for
    Auto-Increment.

    2. In the second row, type `email_addr` for Field Name, select `varchar` from
    the Field Type drop-down menu, and specify a Field Length of 100.

    3. In the third row, type `date_added` for Field Name and select `date` from the
    Field Type drop-down'
