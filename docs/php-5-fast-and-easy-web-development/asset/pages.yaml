  md: '# Operators


    An operator is a symbol that represents a specific action. For example, the +
    arithmetic operator adds two values, and = assignment operator assigns a value
    to a variable.


    # Arithmetic Operators


    Arithmetic operators bear a striking resemblance to simple math, as shown in Table
    B.2.


    | Operator | Example | Action |

    | --- | --- | --- |

    | + | $Sb = $Sa + 3; | Adds values together |

    | - | $Sb = $Sa - 3; | Subracts values |

    | * | $Sb = $Sa * 3; | Multiplies values |

    | / | $Sb = $Sa / 3; | Divides values |

    | % | $Sb = $Sa % 3; | Returns the modulus, or remainder |


    # Assignment Operators


    The = is the basic assignment operator:

    Sa = 124; // the value of $Sa is 124


    Other assignment operators are shown in Table B.3.


    | Operator | Example | Action |

    | --- | --- | --- |

    | += | $Sa += 3; | Changes the value of a variable to the current value plus the
    value on the right side |

    | -= | $Sa -= 3 | Changes the value of a variable to the current value minus the
    value on the right side |

    | *= | $Sa .= "string"; | Concatenates adds on (to) the value on the right side
    with the current value |


    # Comparison Operators


    It should come as no surprise that comparison operators compare two values. A
    value of true or false is returned by the comparison. The comparison operators
    are shown in Table B.4.


    | Operator | Definition |

    | --- | --- |

    | == | Equal to |

    | != | Not equal to |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |


    # Increment/Decrement Operators'
  merge: -1
  pgno: 354
- img_proc: true
  md: 'The increment/decrement operators do just what their name implies: add or subtract
    from a variable (see Table B.5).


    # Table B.5: Increment/Decrement Operators


    | Operator | Usage | Definition |

    |---|---|---|

    | ++$ | Pre-increment | Increments by 1 and returns $a |

    | $++ | Post-increment | Returns $a and increments $a by 1 |

    | --$ | Pre-decrement | Decrements by 1 and returns $a |

    | $-- | Post-decrement | Returns $a and decrements $a by 1 |


    # Logical Operators


    Logical operators allow your script to determine the status of conditions, and
    in the context of your if...else or while statements, execute certain code based
    on which conditions are true and which are false (see Table B.6).


    # Table B.6: Logical Operators


    | Operator | Example | Result |

    |---|---|---|

    | ! | $a | TRUE if $a is not true |

    | && | $a && $b | TRUE if both $a and $b are true |

    | || | $a || $b | TRUE if either $a or $b is true |


