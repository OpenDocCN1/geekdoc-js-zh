  md: '# # Configuring Apache on Windows


    To run a basic installation of Apache, the only changes you need to make are to
    the server name, which you might already have done during the installation wizard.
    However, if you entered dummy information for the server name, or want to modify
    any other part of the configuration, now is the time to do it.


    The master configuration file for Apache is called httpd.conf, and it lives in
    the conf directory, within the installation directory. If your installation is
    located `C:\Program Files\Apache Group\Apache2\`, the file will be located in
    `C:\Program Files\Apache Group\Apache2\conf\`.


    Again with the handy shortcut, you can quickly access this file by selecting Program
    Files, Apache HTTP Server 2.0.49, Configure Server, Edit the Apache httpd.conf
    Configuration File from the Windows Start menu. This shortcut is the same as opening
    a text editor and navigating to the file location. To modify the basic configuration,
    primarily the server name, look for two important sections of the text:


    +   1. Change the value of `ServerName` to your e-mail address, if it isn''t already
    accurate.

    2. Change the value of `ServerName` to something accurate, if it isn''t already.

    3. Save the file.


    ```

    httpd.conf

    # Main server configuration

    # The directives in this section set the values used by the ''main''

    # server process. These settings are also inherited by child

    # processes, except for those that are specified by

    # any virtualhost containers you define later in the file.

    # In which case these settings will be overridden for the

    # virtual processes.

    # ServerName, the address where problems with the server should

    # send e-mail alerts to on some server-generated pages, such

    as as error documents.

    ServerName yourdomain.com

    # ServerName gives the name and port that the server uses to identify.

    # If ServerName isn''t set, it defaults to localhost, but we recommend

    # setting it explicitly.

    # If this is not set to avoid using names for host server-generated

    # restrictions in the location header.

    # If you host a registered dns name, enter its IP address here.

    # You may have to use the hostname instead, and this will avoid

    # restrictions in a sensible way.

    ServerName 127.0.0.1

    ```


    The `ServerName` modification is the most important change you''ll make to your
    Apache configuration file, because if the `ServerName` isn''t correct, you won''t
    be able to connect to Apache. As it states in the configuration file "You cannot
    just invent host names and hope they work." If you do not know your full machine
    name, you can use an IP. If you use a static IP (that is, one that does not change),
    use it as `ServerName`. If you have a dial-up connection that does not assign
    a static IP (that is, your IP changes each time you dial to your Internet service
    provider), you will have to change the IP number in `httpd.conf` each time you
    dial up.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '> Tip The ServerName changes described here are relevant only if you want people
    from the outside world to be able to connect to your new server. If you are the
    only person who will be accessing the server, you can use the IP number 127.0.0.1,
    which is recognized by Windows as the loop-back address, also known as localhost.
    You can then use either localhost or IP 127.0.0.1 as ServerName in httpd.conf.
    The IP number will probably work out, because some Windows machines do not automatically
    know that localhost equals 127.0.0.1.


    Once the appropriations are made to the httpd.conf file, Apache is ready to run
    on your machine. In the next section, you will start and connect to Apache.


    # Starting and Connecting to Apache


    To start the Apache, select Program Files, Apache HTTP Server 2.0.49, Another
    Apache Server, Start from the Windows Menu. This will launch a console window,
    which will then close. Apache will be running in the background.

    With your server running, you can connect to the server via your web browser of.
    The URL will be whatever you used as ServerName—an actual name or IP, localhost,
    or 127.0.0.1.


    > Note Remember, you can connect to your web server via 127.0.0.1 or the local
    name. This assumes that you''re using 127.0.0.1 as the ServerName, if you are
    not, just substitute your name for 127.0.0.1 in the examples.


    To finally test your installation, use your web browser, http://127.0.0.1/ in
    the location bar, and press Enter. You should see a default page.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_33_0.png)


    If you see this, it means that the installation of the Apache web server software
    on this system was successful. You may now add new content to this server and
    replace this page.


    > This page is here because the site administrator has changed the configuration
    of this web server. Please contact the service responsible for maintaining this
    server with respect. The Apache Software Foundation, which wrote the web server
    software this administrator is, has nothing to do with maintaining this site and
    cannot resolve configuration issues.


    The Apache documentation has been included with this distribution.

    You are free to use the image on an Apache-powered web server. Thanks for using
    Apache!


    This default start page comes the hdocs directory within your Apache installation
    directory. You can go into that directory and delete all the default files if
    you want to, or can leave them. They''re not hurting anything, but you''ll eventually
    be filling the hdocs directory with your own files and subdirectories, so you
    might want to delete them for the sake of goodkeeping.


    Move ahead to the next chader, where you install PHP and make a few changes to
    your Apache configuration files before you''re ready for some action.'
