  md: '# Installing Apache for Windows


    Installing Apache for Windows is a simple task, due in great part to the installation
    wizard distributed by the Apache Group. Whether you''re using Windows 95, 98,
    Me, 2000, XP, or NT, the installation process of the precompiled binaries is the
    way to go, and the same installation file is used for all flavors of Windows.


    Being able to use Apache on consumer-oriented operating systems such as Windows
    95/98/Me/XP doesn''t mean that you should, at least not in a production environment.
    Simply put, running any web server on a Linux/Unix machine. Installing and configuring
    a development web server on a Windows-based operating system is perfectly acceptable,
    and is how most users get their start.


    > Note The Apache Group also distributes source code for Apache Windows, which
    you would need to compile the code yourself. However, that is beyond the scope
    of this book!


    To download the Apache distribution, start at the Apache Server website, http://http.apache.org/
    and follow the Download Link. Before going any further, search for the link in
    the sentence. If you are downloading the Win32 distribution, please read these
    important notes. (The actual link depends on the mirror you are using.)


    Distribution files follow a naming convention, with apache followed by the version
    number, and -win32-x86-no_ssl.msi. As of this article, the current version is
    2.0.49, so the file used as an example throughout this section is apache_2.0.49-win32-x86-no_ssl.msi.
    Once you have downloaded the installation file to your hard drive, the following
    steps will take you to the installation wizard:


    +   1. Double-click the file called apache_2.0.49-win32-x86-no_ssl.msi. The installer
    will start, and the installation wizard will begin. Click Next to continue.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_30_0.png)


    +   2. Read the licensing information on the screen, choose the I accept button,
    and then click on Next.


    +   3. Read the general Apache information on the screen, and then click on Next.


    +   4. The next screen requires you to fill in some details about your server:
    the network domain, the server name, and the administrator''s e-mail address.'
  merge: -1
