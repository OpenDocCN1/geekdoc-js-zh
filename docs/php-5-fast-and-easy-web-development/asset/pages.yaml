  md: '# HTTP Environment Variables


    When a browser makes a request to a web server, it sends along with the request
    a list of extra variables. These are called environment variables, and they can
    be very useful for displaying dynamic content or authorizing users.


    The phpinfo() function displays a wealth of information about your web server
    and the version of PHP you are running, in addition to the basic HTTP environment.
    Let''s see what you have.


    +   1. Open a new file in your text editor:


    +   2. Type the following line of PHP code:


    ```

    <? phpinfo(); ?>

    ```


    +   3. Save the file with the name phpinfo.php, and place this file in the root
    directory of your web server.


    +   4. Open your web browser and type http://127.0.0.1/phpinfo.php.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_80_0.png)


    You should see a very long page full of information.


    > Note Information will differ, not from machine to machine, but also from platform
    to platform and version to version. Your results vary, but the overall template
    is the same.


    As you scroll down, look for a section titled Apache Environment. In the next
    sections, you will learn how to use environment variables here: $REMOTE_ADDR and
    $HTTP_USER_AGENT. For an explanation of some of the HTTP environment variables
    shown in the phpinfo() output, visit http://hohoo.ncsa.uiuc.edu/cgi/env.html.


    # Retrieving and using REMOTE_ADDR


    By default, environment variables are available to PHP scripts as $VAR_NAME. For
    example, the $REMOTE_ADDR environment variable is easily contained as $_REMOTE_ADDR.
    However, to be sure that you''re reading the correct value, you can use the getenv()
    function to assign a value to a variable of choice.'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'The REMOTE_ADDR environment variable contains the IP address of the machine
    making the request. Let''s get the value of your REMOTE_ADDR.


    +   1. Open a new file in your text editor.

    2. Open a PHP block, then use getenv() to place the value of REMOTE_ADDR in a
    variable called $address:

    ```

    $address = getenv("REMOTE_ADDR");

    ```

    3. Print the value of $address to the screen, and close your PHP block:

    echo "Your IP address is $address";

    ?>

    4. Save the file with the name remoteaddress.php, and then place this file in
    the root directory of your web server.

    5. Open your web browser and type http://127.0.0.1/remoteaddress.php.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_81_0.png)


    Note: Your IP address will differ from that one shown here, which is my IP at
    the moment I ran this script.


    In the next section, you''ll get the value of another handy environment variable,
    HTTP_USER_AGENT, which is the environment variable that identifies the browser
    of web being used.


    # Retrieving and using HTTP_USER_AGENT


    The HTTP_USER_AGENT variable contains the browser type, version, language encoding,
    and platform. For example, the example value string refers to the Netscape browser,
    version 7.1, in English, on the Windows platform:

    Mozilla/5.0 (Windows; Windows NT 5.1; en-US; rv:1.4)

    gecko/20000324 Gecko/7.1 (ax).


    Here is another common HTTP_USER_AGENT value:

    Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1)

    This refers to Internet Explorer (MSIE) version 6.0 on Windows. Sometimes you
    will see MSIE return an value that looks like this, which begins with Mozilla,
    until the notice value says it''s compatible and is actually MSIE 6.0.'
