  md: '# Chapter 24: Creating Custom Logs and Reports


    # Overview


    If you''re building a website for public use, chances are good that you''ll want
    to know which part of your site is most popular, least popular, what types of
    web browsers are used, and so on. Although Apache keeps a generic log file of
    accesses and errors, you can create a few code snippets to store specific information
    in your MySQL database. In this chapter, you will learn how to:


    +   * Create a simple access-counting mechanism with MySQL

    * Display the access counts on a page and in a report

    * Track form submissions

    * Create a synopsis of the form submissions'
