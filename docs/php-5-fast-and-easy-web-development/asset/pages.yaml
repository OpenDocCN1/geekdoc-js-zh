  md: '# Using an SMTP Server


    SMTP is an acronym for Simple Mail Transfer Protocol, and an SMTP server is a
    machine that transports mail, just a web server is a machine that displays web
    pages when requested. An SMTP server is sometimes referred to as an outgoing mail
    server, which brings me to the point—you need such a server in order to complete
    the exercises in this chapter. On Linux/Unix, Send and Qmail are popular packages.
    In Windows, the SMTP server in the Windows NT Service, or the Windows 2000 operating
    system, is enough.


    If you have installed Apache, PHP, and MySQL as a part of development on your
    personal machine you probably do not have SMTP running locally. If that is the
    case, you can use an outgoing mail server that might be available to you.


    > Note If you skipped the first three chapters of this book and are using PHP
    as part of an Internet provider''s virtual hosting package, the SMTP server already
    be installed on that machine, and PHP should be properly configured to access
    it.


    If you are connected to the Internet via a dial-up connection, DSL, cable, or
    other type of access, you can use your Internet provider''s outgoing mail server.
    For example, if your development machine is a box with a DSL connection to the
    Internet, you can use something like yourprovider.com as your outgoing mail server.


    The rule is that whatever you have configured within your e-mail (Eudora, Outlook,
    Netmail, and so) on your outgoing mail server will also function within your PHP
    code as your SMTP server. This is making PHP aware of this, which you will learn
    about.


    # SMTP-Changes in php.ini


    In the php.ini configuration file, there are two directives that need to be set
    up so that the mail() function works properly. Open php.ini with a text editor
    and look for the following:


    ```

    [mail]

    ; For Win32 only.

    SMTP = localhost

    sendmail_from = me@localhost.com

    ; For Unix-only. You may supply arguments as well (like `sendmail -t -i`).

    sendmail_path =

    ```


    If you are using Windows, you will need to modify the two directives, SMTP and
    sendmail_from. If you plan to use the outgoing mail server of your ISP (in this
    example, suppose it''s called DSLProvider.net), the entry in php.ini would look
    like this


    ```

    SMTP = dslprovider.net

    ```


    The second configuration directive is sendmail_from, and this is the e-address
    used in the Header of the outgoing-mail. It can be overwritten in the mail script
    but normally operates as the default value. For example:


    ```

    sendmail_from = youraddress@yourdomain.com

    ```


    Of course, replace <youraddress@yourdomain.com> with your own address.


    If you''re on Linux or a Unix variant, sendmail_path is what you need to know
    about, and it should look like this:


    ```

    sendmail_path = /usr/bin/sendmail

    ```


    Or, if you''re using Qmail


    ```

    sendmail_path = /var/qmail/bin/sendmail

    ```


    In the sendmail_path directive, you can also set configuration to specify queuing
    options or to set the Return-Path header, such as


    ```

    sendmail_path = /usr/sbin/sendmail -tfyou@yourdomain.com

    ```


    After making changes to the php.ini file, restart the web server and use the phpinfo()
    function to verify that the changes have been made. When that''s, you''re ready
    to send some e-mail using PHP.'
  merge: -1
  pgno: 100
