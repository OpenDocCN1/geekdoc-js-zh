  md: '# Parsing XML with PHP


    In this section, you''ll see a few examples of how PHP can parse a XML document
    using the messages.xml file created earlier in this chapter. Basic scripts show
    you the stepwise methods used to parse XML files with PHP. As everything in this
    book, it''s all about gaining a foundation for learning.


    The first example script will simply load the messages.xml file into the XML parser
    and then have the parser display back the elements it identifies.


    +   1. Open a new file in your editor and start a PHP block:


    ```

    2. Use the simplexml_load_file() function to load contents of the messages.xml
    file into an object called $xml:

    $xml = simplexml_load_file(''messages.xml'');

    ```


    > Note Objects are introduced in Appendix C, "Writing Your Functions and Objects,"
    but for now think of object as a big container, go with the flow, and grasp the
    overall concept of what''s occurring.


    +   3. Use the var_dump() function to print all element names in the object and
    their values, then close the PHP block:

    var_dump($xml);

    ?>


    +   4. Save the file as xml.php and place it in the document root of your web
    server, with the messages.xml file.


    When you access this with your browser, you will see the following figure:


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_342_0.png)


    This rather unattractive output shows that the XML parser has ready, identified
    elements as MessageTitle and so forth, and in the next section, you''ll see how
    to map XML elements to specific types of HTML markup, eventually displaying the
    information in presentation formation.


