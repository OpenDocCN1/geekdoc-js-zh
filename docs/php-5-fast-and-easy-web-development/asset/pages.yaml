  md: "# Understanding the Process\n\nThe process of uploading a file to a web server\
    \ through an HTML interface puzzles a lot of people. Take a moment to understand\
    \ the process you'll create in the following sections. \n\nTo start and finish\
    \ this process, you need the following:\n\n+   - An HTML form\n- A file to upload\n\
    - A place to put the file\n- A script to put it there\n\nThe process itself goes\
    \ something like this:\n\n+   1. The user accesses the HTML form and sees a text\
    \ field and the Browse button in his or her browser.\n2. The user browses his\
    \ or hard drive for the file to upload and selects a file.\n3. The full file path\
    \ and filename appear in the text field.\n4. The user clicks on the submit button.\n\
    5. The selected file goes out, lands at the web server, and sits around in a temporary\
    \ directory.\n6. The PHP script used in the form action checks that a file was\
    \ sent, and executes a `copy` command on the temporary file to move it to a real\
    \ directory on the web server.\n7. The PHP script confirms the action for the\
    \ user.\n\n> Note The PHP user (the user under PHP runs, as \"nobody\" or \"www\"\
    \ or \"joe\") must have write permissions in the temporary directory or as the\
    \ target directory for the file. If you have difficulty with permissions, contact\
    \ your system administrator.\n\nStart by simply creating the HTML form interface\
    \ in the next section."
  merge: -1
  pgno: 139
