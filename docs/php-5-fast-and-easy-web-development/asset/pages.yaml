  md: '# Chapter 9: Using Your File System


    # Overview


    Using simple PHP scripts, you can do anything with your file system—it''s yours,
    after all! In this chapter, you learn how to:


    +   * Display the contents of a directory

    * Create a new file

    * Open an existing file and append data to it

    * Copy, rename, and delete files'
  merge: -1
