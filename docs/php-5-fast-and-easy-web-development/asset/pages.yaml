  md: "# # Displaying Platform-Specific HTML\n\nThere are differences not only between\
    \ browsers, but also platforms. This difference is most clear with regards to\
    \ fonts and font sizes. In the Windows world, you have fonts such as Times New\
    \ Roman and Courier New. Slight variations of these fonts appear on the Macintosh\
    \ and Linux/UNIX platforms; they are called Times and Courier. It doesn't end\
    \ there fonts all sized differently. A 10-point font on Macintosh or Linux is\
    \ barely legible, but if you use 11 or 12 points, you're in business. If that\
    \ 12-point font is viewed on Windows, it makes it look like your text is trying\
    \ to take over.\n\nSo what to do? Use your pattern-matching skills to extract\
    \ the font from the HTTP_USER_AGENT string, and then display platform-specific\
    \ HTML. With matching to a keyword you down the platform—which you will do in\
    \ the section—you know what you're looking for. In the next script, you'll check\
    \ for the \"Windows\" and \"Linux\" and print an appropriate style sheet before\
    \ your HTML.\n\n+   1. Open a new file in your editor, start a PHP block, and\
    \ use `getenv()` to place the value of HTTP_USER_AGENT in a variable `$agent`.\n\
    ```php\n$agent = getenv('HTTP_USER_AGENT');\n```\n\n+   2. Start an if...else\
    \ statement to find out the `preg_match()` function returns true, starting with\
    \ the search for \"win\":\n```php\nif (preg_match('/win/i', $agent)) {\n    $style\
    \ = \"win\";\n}\\```\n\n+   3. Continue the testing, for \"Linux\":\n```php\n\
    elif (preg_match('/linux/i', $agent)) {\n    $style = \"linux\";\n}\n```\n\n+\
    \   4. Create a basic style sheet for Windows:\n```php\n$style = \"<style type=\"\
    css\">p, ul, ol, li {\nfont-family:Arial;font-size:10pt;font-weight:normal};\n\
    h1 {font-family:Arial;font-size:16pt;font-weight:bold};\nh2 {font-family:Arial;font-size:14pt;font-weight:bold};\n\
    strong {font-family:Arial;font-size:10pt;font-weight:bold};\nem {font-family:Arial;font-size:10pt;font-style:italic}\n\
    }</style>\";\n```\n\n> Note When you use quotation inside other quotation marks,\
    \ the inner pair must be delineated from the outer character using the escape\
    \ (\\) (also known as a backslash).\n\n+   5. Create a basic style sheet for Linux:\n\
    ```php\n$style = \"<style type=\"css\">p, ul, ol, li {\nfont-family:Times;font-size:12pt;font-weight:normal};\n\
    h1 {font-family:Times;font-size:18pt;font-weight:bold};\nh2 {font-family:Times;font-size:14pt;font-weight:bold};\n\
    strong {font-family:Times;font-size:12pt;font-weight:bold};\nem {font-family:Times;font-size:12pt;font-style:italic}\n\
    }</style>\";\n```\n\n+   6. Close your PHP block and add the following HTML:\n\
    ```html\n?>\n<html>\n<head>\n<TITLE>Platform Matching</TITLE>\n```\n\n+   7. Type\
    \ the following PHP code, creating an if...else statement to print the correct\
    \ style sheet block:\n```php\nif ($style == \"win\") {\n```"
