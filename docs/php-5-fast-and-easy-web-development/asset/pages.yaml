  md: '# How PHP is Parsed


    So you have a file, and in that you have some HTML and some PHP code. This is
    how it all works, assuming a PHP document with an extension of .php


    Note The file extension does not have to be .php, but it does have to be an extension
    Apache understands should be parsed as PHP, which you learned in Chader 2. "Installing
    Apache."


    +   1. The web server says, "Hey! Someone wants a PHP file, which means this is
    a file that needs to be parsed," and sends the request to the PHP parser.


    +   2. The PHP parser finds the requested code, it executes that code and places
    the resulting output (if any) into the place in the file formerly occupied by
    the code.


    +   3. This new output file is sent back to the web server.


    +   4. The web browser displays the output.


    Because the PHP code is parsed on the server, this method of code execution is
    called server-side code. When code is executed in a browser, as JavaScript, it
    is all client-side code.


    To combine PHP code with HTML, the PHP code must be set apart from the HTML. In
    the next section, you''ll learn how this is done, using PHP start and end tags.'
  merge: -1
  pgno: 46
- img_proc: true
  md: "# PHP Start and End Tags\n\nThe PHP parser recognizes few types of PHP start\
    \ and end tags. It will attempt to execute anything between these tags, so it\
    \ had better be valid code!\n\nStudy Table 4.1 to learn the three main sets of\
    \ start and end tags recognized by the PHP parser.\n\n| Opening Tag | Closing\
    \ Tag |\n|---|---|\n| <?php | ?> |\n| <? | ?> |\n| <script language=\"php\"> |\
    \ </script> |\n\nNext, you'll use all sets of tags in your script, which I will\
    \ execute without errors.\n\n+   1. Open a new file in your text editor.\n2. Type\
    \ the following code, which uses the first tag type:\n   <?php\n   echo \"<P>This\
    \ is a test using the first tag type.</P>\";\n   ?>\n3. Type the following code,\
    \ which uses the second tag type:\n   <?<\n   echo \"<P>This is a test using the\
    \ second tag type.</P>\";\n   ?>\n4. Type the following code, which uses the third\
    \ tag type:\n   <script language=\"php\">\n   echo \"<P>This is a test using the\
    \ third tag type.</P>\";\n   </script>\n5. Save the file with the name phtags.php.\n\
    6. Place this file in the document root of your web server.\n7. Open your web\
    \ browser and type http://127.0.0.1/pbhtags.php."
