  md: "Using a return statement to pass results from your functions to your main script\
    \ is a simple and safe method, and one of the most common. If you do not use a\
    \ return statement, you must declare as any variables you want to pass back to\
    \ your main script. For example:\n\n```\nfunction multiplier($num) {\n  global\
    \ $answer;\n  $answer = $num * 5;\n}\n```\n\nIn this case, you call the multiplier()\
    \ function and then use the name of the variable in the echo statement, because\
    \ it's not returned directly from your function. For example, using the modified\
    \ function, the following code will print the number 40 to your screen:\n\n```\n\
    multiplier();\necho $answer;\n```\n\nIf you had not declared $answer as a global\
    \ variable, the result would have been a blank screen.\n\n**Note** Use some thought\
    \ to determine whether you really want to make globally each time you declare\
    \ something additional programming constraints in order to maintain the integrity\
    \ of the data. In other words, you have to be careful and watch what you do. If\
    \ you have declared a variable as global, but use a variable of the same name\
    \ in another part of your script, you will overwrite one or the other. A good\
    \ rule of thumb is to keep a handle on your global variables, and keep them local\
    \ to the procedures that directly use them.\n\n![](img/7a81120f3fcfd17d264c4ace19b756f8_371_0.png)"
