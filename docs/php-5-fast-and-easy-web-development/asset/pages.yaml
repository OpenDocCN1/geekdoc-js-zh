  md: "# Control Structures\n\nPrograms are a series of statements. Control structures,\
    \ as their names imply, control how those statements are executed. They're usually\
    \ built around a series of conditions, such as \"If the sky is blue, go outside\
    \ and play.\" In this example, the condition is \"If the sky is blue\" and the\
    \ statement is \"go outside and play.\"\n\nControl utilizes curly braces {} to\
    \ separate the groups of statements from the remainder of the program. Examples\
    \ of common control structures; memorizing them will make your life much easier.\n\
    \n# if...else...else\n\nThe if...else...else construct executes a statement based\
    \ on the value of the expression being tested. In the following example statement,\
    \ the expression being tested is \"a is equal to 10.\"\n\n```\nif ($a == \"10\"\
    ) {\n    // execute code\n}\n```\n\nAfter $a is evaluated, if it is found to have\
    \ a value of 10 (if the condition is true), the code inside the curly braces will\
    \ execute. If $a is found to be something other than 10 (if the condition is false),\
    \ the code will be ignored; and the program will continue.\n\nTo offer an alternative\
    \ of statements, should $a not have a value of 10, add an else statement to the\
    \ structure to execute a section of code when the condition is false:\n\n```\n\
    if ($a == \"10\") {\n    echo \"a equals 10\";\n} else {\n    echo \"a does not\
    \ equal 10\";\n}\n```\n\nThe else if (or we:if) statement can be added to the\
    \ structure to evaluate an alternative expression before the beginning of the\
    \ final else statement. For example, the structure first evaluates whether $a\
    \ is equal to 10. If that condition is false, the else if statement is evaluated.\
    \ If it is found to be true, the code within its curly braces executes. Otherwise,\
    \ the program continues to the final else statement:\n\n```\nif ($a == \"10\"\
    ) {\n    echo \"a equals 10\";\n} else if ($b == \"8\") {\n    echo \"b equals\
    \ 8\";\n} else {\n    echo \"a does not equal 10 and b does not equal 8.\";\n\
    }\n```\n\nIf you use statements as part of an if...else or an if...else if...else\
    \ statement. Whichever you choose, you will find this structure to be an invaluable\
    \ element in your programs!\n\n# while\n\nUnlike the if...else structure, in which\
    \ each expression is evaluated once and an action is performed on its value of\
    \ true or false, the while statement continues to loop until an expression is\
    \ false. In other words, the while loop continues until the expression is true.\n\
    \nFor example, in the while loop, the value of $a is printed on the screen and\
    \ incremented by 1 as long as the value of $a is greater than equal to 3:\n\n\
    ```\n$a = 0; // set a starting point\nwhile ($a <= \"3\") {\n    echo \"$a equals<br>\"\
    ;\n    $a++;\n}\n```\n\n# for\n\nUnlike while loops, for loops evaluate the set\
    \ of conditional expressions in each loop. Here is the syntax of the for loop:"
  merge: -1
  pgno: 356
- img_proc: true
  md: "```\nfor (expr1; expr2; expr3) {\n  // code to execute\n}\n```\n\nAt the beginning\
    \ of each loop, the first expression is evaluated, followed by the second expression.\
    \ If the second expression is true, the loop continues executing the code and\
    \ then evaluating the third expression. If the second expression is false, the\
    \ loop does not continue, and the third expression is never evaluated.\n\nTake\
    \ the counting example used in the while loop, and rewrite it using a for loop:\n\
    \n```\nfor ($a = 0; $a <= \"3\"; $a++) {\n  echo \"a equals $a<br>\";\n}\n```\n\
