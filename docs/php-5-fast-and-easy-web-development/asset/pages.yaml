    # Creating and Storing Data with SQLite


    When created tables SQLite (and if you want to create a table in a relational
    database system), you specified the field names and types. For example, you might
    have a field named `name` of `varchar`, or a field `date` that is a `datetime`
    field. SQLite is loosely typed, meaning the content of all fields, regardless
    of type is strings. Thus, SQLite does not require you to define your fields when
    you create a table, and if you do, they will be ignored.


    In the next example, you will create a table with the following records:


