  md: "# Miscellaneous Functions\n\nThe die() and exit functions provide useful control\
    \ over the execution of the script, offering an escape route for for programming\
    \ errors. Other functions have found their way into this miscellaneous category.\n\
    \n```\ndie()\n```\n\nThe die() function outputs a message and terminates the script\
    \ when a returned value is false. Its syntax is die(\"message\");\n\nFor example,\
    \ you would use the following code to print a message and stop the execution of\
    \ your script upon failure to connect to your database:\n\n```\n$connection =\
    \ connect(\"servername\", \"username\", \"password\") or die(\"Can't connect to\
    \ database.\");\n```\n\n```\nexit\n```\n\nThe exit statement terminates the execution\
    \ of the current script at the point where the exit statement is made.\n\n# sleep\
    \ and usleep\n\nThe sleep() and usleep() functions put a pause, or a delay, at\
    \ a given point in the execution of your PHP code. The syntax of these functions\
    \ is\nsleep(seconds);\nusleep(microseconds);\n\nThe only difference between sleep()\
    \ and usleep() is that the given wait period for sleep() is in seconds, and the\
    \ wait period for usleep() is in microseconds.\n\n# uniqid\n\nThe uniqid() function\
    \ generates a unique identifier with a prefix if you want. Its syntax is uniqid(\"\
    prefix\");\n\nThat's boring, suppose you want a unique ID with a prefix of phpuser.\
    \ You would use\n$id = uniqid(\"phpuser\");\necho \"$id\";\n\nand you would get\
    \ something like phpuser38b320a6b5482.\n\nBut if you use syntax that looks really\
    \ cool\n$id = md5(uniqid(rand()));\necho \"$id\";\n\nand you would get an ID like\
    \ 999d89741461fedc7caadcab33e58866.\n\n# Program Execution Functions\n\nYou can\
    \ use PHP's built-in program execution functions to use programs residing on your\
    \ system, such as encryption functions, third-party image manipulation functions,\
    \ and so forth. For all program execution functions, the PHP user must have permission\
    \ to execute the program.\n\n```\nexec\n```\n\n```\nThe exec() function executes\
    \ an external program.\nexec($command, [array]);\n```\n\nIf an array is specified,\
    \ the output of the exec() function will append to the array. If return_var is\
    \ specified, it will be assigned a value of the program's return status.\n\nFor\
    \ example, you would use the following code to perform a ping of five times and\
    \ print the output:\n\n```\n$command = \"ping -c 5 www.github.com\";\nexec($command,\
    \ $result, $retval);\nfor ($i = 0; $i < sizeof($result); $i++) {\n  echo \"$result[$i]<br\"\
    ;\n}\n```\n\n```\npassthru\n```"
