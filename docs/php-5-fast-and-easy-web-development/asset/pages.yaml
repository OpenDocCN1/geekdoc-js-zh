  md: '# A Feedback Form with Custom Error Messages


    In the [previous section],you created two files. One file contained the front-end
    (form), and the other contained the back-end (script). In this section, you learn
    how to use the $_SERVER[PHP_SELF] variable in form action to create a single file
    that holds both form and script, and how to create custom error messages when
    required fields are not completed.


    # Creating the Initial Script


    As you did earlier, the first step in creating a script/form pair is to create
    the front-end form. However, in this all-in-one form, the front-end form is simply
    the first part of the script and not a separate file.


    +   1. Open a new file in your text editor.


    +   2. Type the following HTML:

    ```html

    <head>

    <title>All-In-One Feedback Form</title>

    </head>

    <body>

    ```


    +   3. Start a PHP block, and create a variable $form_block, which will hold every
    entry. Start with the form action, and assume that the method is $_SERVER[PHP_SELF];

    ```php

    $form_block = "

    <form METHOD="POST" ACTION="$_SERVER[PHP_SELF]">

    ```


    > Note Because you''re putting a long string inside a variable, chances are that
    you''ll have a quotation mark or two. Remember to escape all your quotes with
    a backslash!


    +   4. Create an input field for the user''s name with a text label:

    ```html

    <p>Your Name:</br>

    <input TYPE="text" NAME="sender_name" SIZE="30">\n```


    +   5. Create an input field for the user''s e-mail address with a text label:

    ```html

    <p>Your E-Mail Address:</br>

    <input TYPE="text" NAME="sender_email" SIZE="30">

    ```


    +   6. Create a text area to hold the message with a text label:

    ```html

    <p>Message:</br>

    <textarea NAME="message" COLS=30 ROWS=5 WRAP=virtual\</textarea>

    ```


    +   7. Add a submit button:

    ```html

    <input TYPE="submit" NAME="submit" VALUE="Send This Form">

    ```


    +   8. Close the form, and add the ending quotation marks and instruction terminator
    (semicolon);

    ```html

    </form>

    ```


    +   9. Close the PHP block, and add some more HTML so that the document is valid:

    ```php

    ?>

