    by

    copy($_FILES[img][tmp_name], "/usr/local/apache2/htdocs/../$_FILES[img][name])

    nor die("Couldn''t copy the file.");

    ```

    2. Note if the root directory of your server is /usr/local/apache2/htdocs/, as
    shown in step 3, match the path to your own system. For example, a Windows user
    might use /Program Files/Apache2Group/Apache/htdocs/.

    3. Continue the else statement to handle the lack of a file for upload:

    ```

    else

