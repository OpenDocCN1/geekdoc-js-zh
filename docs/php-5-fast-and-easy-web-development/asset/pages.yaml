  md: 'The decbin() and bindec() functions convert decimal numbers to binary numbers
    and binary numbers to decimal numbers, respectively. The syntax of these functions
    is


    decbin(number);

    bindec(number);


    # dech() and hexdec()


    The dech() and hexdec() functions convert decimal numbers to hexadecimal numbers
    and hexadecimal numbers to decimal numbers, respectively. The syntax of these
    functions is


    dech(number);

    hexdec(number);


    # doct() and octdec()


    The dect() and octdec() functions convert decimal numbers to octal numbers and
    octal numbers to decimal numbers, respectively. The syntax of these functions
    is


    doct(number);

    octdec(number);


    # floor()


    The floor() function rounds a fraction down to the next lower integer. Its syntax
    is


    floor(number);


    # number_format()


    The number_format() function returns the formatted version of a number. Its syntax
    is

    number_format("number", "decimals", "dec_point", "thousands_sep");


    For example, to return a formatted version of the number 12156688 with two decimal
    places and a comma separating each group of thousands, use

    echo number_format("12156688","2",".",",");


    The result is 12,156,688.00.


    If only a number is provided, the default formatting does not use a decimal point
    and puts a comma between every group of thousands.


    # pow()


    The pow() function returns the value of a given number raised to the power of
    a given exponent. Its syntax is


    pow(number, exponent);


    # rand()


    The rand() function generates a random value from a specific range of numbers.
    Its syntax is


    rand(min, max);


    # round()


    The round() function rounds a fraction to the next higher or next lower integer.
    Its syntax is


    round(number);


    # sqrt()


    The sqrt() function returns the square root of a given number. Its syntax is


    sqrt(number);


    # srand()


    The srand() function provides the random number generator with a set of possible
    values. Its syntax is


    srand(seed);


    A common practice is to seed the random number generator using a number of microseconds.


    srand((double)microtime()*1000000);'
