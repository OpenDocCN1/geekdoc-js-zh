  md: '# Defining the my_contacts Table


    Take a moment to think about the kinds of things you''d want in a contact management
    system: names, addresses, telephone numbers of all sorts, e addresses, and maybe
    even the person''s birthday.


    I thought about what I wanted for my name, which I''ve decided to call my_contacts.
    This information appears in Table 18.1.


    Table 18.1: Fields for my_contacts


    | Field Name | Description |

    |--- |--- |

    | id | Creates a unique ID number for the entry |

    | f name | The person''s first name |

    | l_name | The person''s last name |

    | address1 | First line of the address |

    | address2 | Second line of the address |

    | address3 | Third line of the address |

    | postcode | ZIP or postal code |

    | country | Country in which the person resides |

    | prim_tel | Primary telephone number |

    | sec_tel | Secondary number |

    | email | E-mail address |

    | birthday | The person''s birthday |


    In the next section, you''ll modify the table-creation scripts from Chapter 12,
    "Creating a Database Table." You''ll add the capacity to manage primary keys and
    auto-incrementing fields.


    # Modifying the Table-Creation Scripts


    With a few modifications to two of the scripts in the table-creation sequence
    from Chapter 12, you can add checkboxes to handle the primary keys and auto-incrementing
    fields. These types of fields are incredibly useful for ID fields.


    +   1. Open do_showfields.php in your editor and find the section of $form_block
    that prints table headings, and add the line before the end of the row:

    Then, at the end of the table, add two lines:

    <TH>PRIMARY KEY</TH><TH>AUTO-INCREMENT</TH>

    </tr>

    2. In the $form_block within the loop, the next-to-last line prints a field with
    a name of $field_length[]. After that line, and before the end of the table, add
    two lines:

    <TD ALIGN="CENTER"><INPUT TYPE="checkbox" NAME="primary[]" VALUE=""><input_auto_increment/></center></td>

    3. Save this file.


    Your modified code for this script should look like this:


    ```

    <?

