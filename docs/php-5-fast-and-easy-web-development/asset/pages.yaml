  md: "# Using Functions in Your Code\n\nSo far, you've learned the basic of a user-defined\
    \ function, but how it fits within your own scripts. In the case of the multiplier()\
    \ function, it seems awfully time-consuming to create a script like the following\
    \ just to print a number on the screen.\n\n```\n<<?nfunction multiplier($num)\
    \ {\n  $answer = $num * 5;\n  return $answer;\n}\necho multiplier(5);\n?>\n```\n\
    \nInstead, make a function db_connect(), which contains your database connection\
    \ and selection code:\n\n```\ndb_connect();\n$connection = mysql_connect(\"localhost\"\
    , \"spike\", \"9s7En4\");\nor die(mysql_error());\n$db = mysql_select_db($db_name,\
    \ $connection);\n```\n\nInstead of typing those lines over and over in every script,\
    \ imagine simply typing this:\n\n```\ndb_connect();\n```\n\nIf your host name,\
    \ username, password, or database name change, you have to change the code in\
    \ the included file in one place — db_connect() function. The only trick is where\
    \ to pull it. Obviously, if you are creating a function to reuse the code within\
    \ it, you don't want it to be part of the script. Instead, place the function\
    \ in a file of its own (or a file containing other functions) and use include()\
    \ or require() to pull the information into your script as.\n\n# Using include()\
    \ and require()\n\nThe include() and require() functions essentially do the same\
    \ thing: When called, the code in the included file becomes part of the script\
    \ calling. From point forward, anything the included file can be used in the script\
    \ calling.\n\nThe difference between include() and require() is pops up when the\
    \ file cannot be included. When a failure occurs because of incorrect permissions,\
    \ or the file is not in the location specified. When include(), you get a warning,\
    \ but the code continues to execute as best it can, which is to say, not well\
    \ if it needs a function's in some other file! When require() fails to find the\
    \ file, you will get a fatal error and PHP will stop processing the code latter.\n\
    \nIncluded files like any other PHP files, starting with an PHP tag and ending\
    \ with a closing PHP tag. For example, suppose you have a file functions.php,\
    \ containing the following code:\n\n```\n/* The multiplier() function multiplies\
    \ a number by 5 and returns it */\nfunction multiplier($num) {\n  $answer = $num\
    \ * 5;\n  return $answer;\n}\n```\n\n```\n/* The db_connect() function connects\
    \ to your database. */\nfunction db_connect() {\n  $connection = mysql_connect(\"\
    localhost\", \"spike\", \"9s7En4\");\nnor die(mysql_error());\n  $db = mysql_select_db($db_name,\
    \ $connection);\n}\n```\n\nThen, in your actual PHP script, which needs to connect\
    \ to a database, you would have the following:"
