- img_proc: true
  md: '# Planning for Your Tables


    Creating a table is easy—the planning that takes some brainpower. To create a
    simple table, you only need to give it a name. But that would make for a boring
    table, because it wouldn''t contain any columns (fields) and couldn''t hold any
    data. Beside that, you should know the number of fields and the types of fields
    you want to have in your table.


    # Basic MySQL Data Types


    All fields in a table are given a particular data type definition. The data types
    define the type of data that''s allowed in the field. With some data type definitions,
    you must also define the maximum length you want to allow in the field, but others
    have as as one specific length for their type.


    It''s very important to define fields properly. For example, if you have a field
    to hold the name of a recording, and it''s a 50-character `varchar` field, yet
    you try to store a 100-character string into it, your string will truncate at
    50 characters.


    Not only is it important to define fields correctly so that the data fits into
    the field, but if you define with an incorrect SQL syntax, the table won''t be
    created. For example, if you want to use the text data type for a field, you cannot
    specify a length without a particular length.


    > Table 12.1: Some of the most common types you use. For a complete list, please
    read the MySQL manual.


    | Data Type | Definition |

    |---|---|n| TININT | A very small integer that can be signed or unsigned. If signed,
    the allowable range is -128 to 127. If unsigned, the allowable range is 0 to 255.
    |

    | SMALLINT | A small integer that can be signed or unsigned. If signed, the allowable
    range is -32768 to 32767. If unsigned, the allowable range is 0 to 65535. |

    | MEDIUMINT | A medium-sized integer that can be signed or unsigned. If signed,
    the allowable range is -8388608 to 8388607. If unsigned, the allowable range is
    0 to 16777215. |

    | INT | An integer that can be signed or unsigned. If signed, the allowable range
    is -2147483648 to 2147483647. If unsigned, the allowable range is 0 to 4294967295.
    |

    | BIGINT | A large integer that can be signed or unsigned. If signed, the allowable
    range is -9223372036854775808 to 9223372036854775807. If unsigned, the allowable
    range is 0 to 18446744073709551615. |

    | DATE | A date in YYYY-MM-DD format, from 1000-01-01 and 9999-12-31. For example,
    1973-12-30 would be stored as 19731230. |

    | DATETIME | A date in YYYY-MM-DD HH:MM:SS format, from 1000-01-01 00:00:00 to
    9999-12-31 23:59:59, but plus time zone in HH:MM:SS format. For example, 12 AM
    on December 30, 1973 would be stored as 19731230000000. |

    | TIMESTAMP | A timestamp representing a moment, January 1, 1970 and some moment
    in 2038. You can define multiple lengths to the TIMESTAMP field, which directly
    controls what is stored in the field. For TIMESTAMP is 14, it stores only the
    YYYYMMDDHHMMSS. This looks like the DATETIME format, but without dashes. 3:30
    am on December 30, 1973 would be 19731230033000. | |

    | CHAR | A fixed-length string between 1 and 255 characters in length, right-padded
    with spaces to the specified length when storing. Defining a length is not required,
    but the default is 1. |

    | VARCHAR | A variable-length string between 1 and 255 characters in length. You
    must define a length when creating a VARCHAR field. |

    | BLOB or TEXT | A field with a maximum length of 65535 bytes. BLOBs are "Binary
    Large Objects" and are used to store large amounts of data, such as images or
    other types of files. |'
  merge: -1
