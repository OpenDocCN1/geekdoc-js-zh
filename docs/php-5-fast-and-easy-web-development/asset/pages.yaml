    ```

    date()

    ```


    The date() function returns the current server timestamp, formatted according
    to a given set of parameters. Its syntax is date(format, [timestamp]);


    If the timestamp is not provided, the current timestamp is assumed. Table B.7
    shows the available formats.


    | Character | Meaning |

    |---|---|

