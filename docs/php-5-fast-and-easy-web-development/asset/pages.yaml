    # Displaying Records Ordered by Artist


    This script is a bit trickier because you have to take into consideration issues
    associated with artist names: some have one first name, some first and last names,
    and some are thrown into the artist_in field as well. In script, you will select
    all the records in the my_music table, ordered alphabetically by the full name
    of the artist.


    +   1. Open a new file in your text editor and start a PHP script:


    ```

    <?php

    $db_name = "testDB";

    ```


    +   2. Create a variable to hold the name of the database on which the table resides:


    +   3. Create a variable to hold the name of the table you are selecting from,
    using this script:

    $table_name = "my_music";


    +   4. Add the connection information as you have below:


    ```

    $connection = mysqli_connect("localhost", "spike", "9sj7En4")

    or die(mysqli_error());

    ```


    +   5. Select the database that you have learned:


    ```

    $db = mysqli_select_db($db_name, $connection) or die(mysqli_error());

    ```


    +   6. Create the SQL statement. Go back to the method that names all the fields
    in the SELECT statement:

    $sql = "SELECT id, format, title, concat(artist_fn, '' '', artist_in) as artist_fullname,
    label, notes, date_acq FROM $table_name ORDER BY artist_fullname";


    > Note this SQL statement, you''re essentially creating a new field from two fields
    that are already exist using the concat() function (a MySQL function) to combine
    artist_fn and artist_in, with a space-in-between. This will allow you to assign
    the value to a field called artist_fullname. For example, suppose you own the
    album White Ladder by David Gray. The artist''s first name ("David") and last
    name ("Gray") would go in their respective areas of the form, but would be output
    as one string ("David Gray").


    The trim() function still strips the white space. The phrase trim(concat(artist_fn,
    '' '', artist_in)) as artist_fullname replaces the if...else block usually seen
    within the while loop in previous scripts.'
