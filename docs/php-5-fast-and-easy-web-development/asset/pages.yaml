  md: '# Developing the Mailing Mechanism


    Now that you have the subscribe/unsubscribe mechanism in place, you can create
    a very basic form interface to a mailing script. This mailing mechanism will take
    the contents of your form and send them to every address in your subscribers table.


    # Creating the Newsletter Form


    I wasn''t kidding when I said you''d create a "simple" form. I just use a text
    field for the subject of the newsletter and a text area for the newsletter''s
    body. You can also make many fields as you like, as long as you modify the form
    and script appropriately.


    +   1. Open a new file in your text editor and type the following HTML:

    ```html

    <html>

    <head>

    <title>Send a Newsletter</title>

    </head>

    <body>

    <h1>Send a Newsletter</h1>

    </body>

    </html>

    ```


    +   2. Begin your form. Assume that the method is POST and the action is a script
    called do_send_newsletter.php

    ```<form METHOD="POST" ACTION="do_send_newsletter.php">\```


    +   3. Create an input field for the newsletter subject with a text label:

    <p><strong>Give it a subject:</strong><br>

    <input type="text" name="subject" size="30"></p>


    +   4. Create a text area for the newsletter body with a text label:

    <p><strong>body:</strong><br>

    <textarea name="newsletter" cols="50" rows="10" wrap="virtual"></textarea>


    +   5. Add a submit button:

    <p><input type="submit" name="submit" value="Send Newsletter"></p>


    +   6. Close your form, and add some more HTML so that the document is valid:

    ```</form>

    </body>

    </html>\```


    +   7. Save the file with the name send_newsletter.html, and place this file in
    the document root of your web server.


    +   8. Open your web browser and type http://127.0.0.1/send_newsletter.html.'
