  md: "# Working with User Privileges in MySQL\n\nWhen you installed the MySQL database\
    \ in Chapter 1, you were working as the anonymous or root user. Before beginning\
    \ regularly with databases, you should create a real user with a password. To\
    \ do this, you need to understand a bit about the MySQL privilege system.\n\n\
    > Note If you are accessing MySQL through an Internet service provider, you probably\
    \ have only one user and one database to use. By default, one user has access\
    \ to all tables in the database and is allowed to perform all commands. If this\
    \ is the case, you can skip the information in this section and proceed to the\
    \ script creation, in all instances where a username and password are used, use\
    \ the one you got by your ISP.\n\n# Creating a New User\n\nIf you have permissions\
    \ for adding a user, the simplest method for performing this is the GRANT command.\
    \ The basic syntax of the GRANT command follows, where [privilege list] is a placeholder\
    \ for the privileges you want to give to the new user.\n\n```\nGRANT [privilege\
    \ list] TO username@hostname IDENTIFIED BY \"password\";\n```\n\nYou can grant\
    \ many types of privileges, and for more information, visit the MySQL Manual topic\
    \ at http://www.mysql.com/doc/rg/GRANT.html. For now, you will grant all privileges\
    \ to your new user, on all tables in the database.\n\n> Note The following commands\
    \ are exactly the same for MySQL on Windows and Linux/Unix platforms.\n\n+   1.\
    \ Start the MySQL monitor from the command line, by typing the following at the\
    \ mysql executable file that is relevant to your file system.\n2. Select the database\
    \ called mysql by typing the following at the mysql prompt: use mysql;\n3. Type\
    \ the following statement, substituting your own username and password if you\
    \ want. The wildcard (*) grants permissions on all databases and tables:\n   GRANT\
    \ ALL ON \\* TO spike@localhost IDENTIFIED BY \"9sj7En4\";\n4. Exit the MySQL\
    \ monitor by typing the following at the mysql prompt:\n   exit\n5. Issue the\
    \ command to reload the tables using the mysqladmin program:\n   mysqladmin reload\n\
    \nThe new user (spike) will now have access to all databases and tables using\
    \ the password 9sj7En4. This will be the sample user in all database connectivity\
    \ scripts from this point forward. Please substitute your own username and password\
    \ where appropriate."
  merge: -1
  pgno: 148
- img_proc: true
  md: "# Connecting to MySQL\n\nThe goal of this script is simply to connect to MySQL,\
    \ running on your machine (localhost).\n\n+   1. Open a file in your text editor\
    \ and start a PHP block:\n<??\n2. Create a variable to hold the result of the\
    \ mysql_connect() function:\n`$connection = mysql_connect(\"localhost\", \"spike\"\
    , \"9sj7En4\");`\n> Note The mysql_connect() function requires a host name, username,\
    \ and password (in that order).\n3. Add a die() to function the mysql_connect()\
    \ function to end the script and a message to be displayed if the connection fails.\
