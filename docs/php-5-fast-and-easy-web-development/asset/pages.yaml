  md: "# # Appendix C: Writing Your Functions and Objects\n\nAs you become comfortable\
    \ with writing code, you will realize that many times you will write the same\
    \ bits of code over and again. A prime example of this is the database connection\
    \ code used throughout this. How many times did you think to yourself? \"This\
    \ is repetitive!\" Often, I'm sure. This is where writing your own functions comes\
    \ into play.\n\nWhen you program in PHP, you will use predefined functions to\
    \ achieve certain results. For example, the `mail()` function is a predefined\
    \ function that sends mail. The `mysql_connect()` function is a predefined function\
    \ that connects to a MySQL database. The code that makes these functions is built\
    \ into the PHP scripting engine, so you never see it. However, you can write your\
    \ own functions and use them in your scripts, storing your own functions in external\
    \ files for only when you need them.\n\n# ## The Structure of Functions\n\nFunctions\
    \ have a specific structure, as you can see in the following code, where `[function\
    \ name]` and `[arguments]` are replaced with your own function name and you want\
    \ to use:\n\n```\n```php\nfunction [function_name]([arguments]) {\n\n}\n```\n\
    ```\n\nWhen you create a function, you precede the name of your function with\
    \ the literal `function`. After that and the name of your function comes the list\
    \ of arguments inside parentheses. The arguments—which you don't have to pass\
    \ any arguments to a function if you don't want to—are separated by commas, and\
    \ hold values that your function needs in order to complete its task or tasks.\n\
    \nAfter the arguments, you use a set of curly braces, type of all, and finally\
    \ close the set of braces. For example, the following function `multiplier($num)`\
    \ takes an argument called `$num` and multiplies the value by 5.\n\n```\n```php\n\
    function multiplier($num) {\n  $answer = $num * 5;\n}\n```\n```\n\nSay you have\
    \ declared that `$num` equals 8, and that's what you're passing to the `multiplier`\
    \ function. Using your own math skills, you know that `$answer` will equal 40.\
    \ To get that number back to your script, outside of the function, you must return\
    \ the value.\n\n# ## Returning Values From Functions\n\nThe basic method for returning\
    \ values from your functions is to use the `return` statement. Usually, this statement\
    \ comes at the end of the function, like so:\n\n```\n```php\nfunction multiplier($num)\
    \ {\n  $answer = $num * 5;\n  return $answer;\n}\n```\n```\n\n> > Note A `return`\
    \ statement can be anywhere in a function, but when used, it ends the execution\
    \ of the function. This means that the code that is executed is the line of your\
    \ script from which the `return` statement was called.\n\nWhen you use a `return`\
    \ statement, you can then call the function in your code like so:\n\n```\n```php\n\
    echo multiplier(5);\n```\n```\n\nThis usage would result in the following on your\
    \ screen:\n\n40\n\nBecause you are passing 8 as the `$num` argument to the `multiplier()`\
    \ function, `$answer` becomes 40. Because `$answer` is returned as the result\
    \ of the function's actions, and you are using `echo` followed by the function\
    \ call, you're telling PHP to print the result of the code within the function.\
    \ In this case, the result is the number 40.\n\n> > Note You can also use the\
    \ `return` statement to get multiple values, but only if they are part of an array\
    \ or an object."
  merge: -1
  pgno: 370
