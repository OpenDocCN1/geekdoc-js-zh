  md: '# Appendix B: Basic PHP Language Reference


    This appendix is nowhere as comprehensive as the PHP manual (found at http://www.php.net/manual/),
    which contains descriptions of every PHP function, plus user-submitted comments
    and code samples. Instead, this appendix serves as a basic, or "essential"\it
    contains the elements of PHP that (in my opinion) you can live without. The PHP
    development team and all the documentation have done a wonderful job with the
    entire PHP manual, and there''s no need to reinvent the wheel. Because this appendix
    touches on only a small percentage of all there is to know about PHP, check the
    PHP manual before answering any question of the PHP mailing lists.


    > Note

    In all these examples, when something string or int appears in a function, it
    is a placeholder for your strong string or integer.


    # PHP Start and End Tags


    To combine PHP code with HTML, the PHP code must be escaped, or set apart, from
    the HTML. The PHP engine will consider anything within the PHP tags shown in Table
    B.1 to be PHP code.


    | Table B.1: Basic PHP Start and End Tags |

    | Opening Tag | Closing Tag |

    | <?php | ?> |

    | <? | ?> |

    | <script language="php"> | </script> |


    # Variables


    You create variables to represent data. For instance, the following variable hold
    a value for sales tax:

    $sales_tax = 0.0875;


    This variable holds a SQL statement:

    $sql = "SELECT FROM MY_TABLE";


    You can refer to the other variables when determining the value of a new variable:

    $tax_total = $sales_tax * $sub_total;


    +   - The following are true of variable names:

    - They begin with a dollar sign ($).

    - They cannot begin with a numeric character.

    - They can contain numbers and the underscore character (_).

    - They are case-sensitive.


    Here are some common variable types:


    +   - floats

    - integers

    - strings


    These types are determined by PHP, based on the context in which they appear.


    # Floats


    Each of the following is a float, or floating-point number. Floats are also known
    as numbers with decimal points.'
