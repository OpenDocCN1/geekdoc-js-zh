  md: '# Creating the Upload Script


    Take a moment to commit the code to memory—it contains the variables that are
    automatically placed in the $_FILES superglobal after a successful file upload.
    The base of $_FILES comes from the name of the input field in the original form.


    +   * $_FILES[name]. The value is the actual name of the file that was uploaded.
    For example, if the name of the file was me.jpg, the value of $_FILES[img][name]
    is me.jpg.

    * $_FILES[size]. The size of the uploaded file in bytes.

    * $_FILES[type]. The MIME type of the uploaded file, such as image/jpg.


    > Note A MIME type indicates the type of content being transmitted. For instance,
    the MIME type of a JPEG file is image/jpeg, and the MIME type of a Microsoft Word
    document is application/msword.


    The goal of this script is to upload the file to the root of your web server,
    and return a confirmation to the user containing all values in the preceding list.


