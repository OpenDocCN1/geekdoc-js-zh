    CourseID/CourseDescription/CourseInstructor groupings that exist in the flat table.


    You still have work to do, and the next step is to put these tables into second
    normal form.


    # Taking Tables to the Second Normal Form


    The basic rule for the second normal form is


    +   - Non-key attributes depend on a primary key

    In plain, if fields are not entirely related to a primary key, you have to keep
    working

    them. In the students and course table, this means breaking out the courses into
    their own table so that the

    flat table is now just a full table of students.

    CourseID, CourseDesc, and CourseInstructor can become a table called courses with
    a primary key of

    the students_courses table should contain two fields: StudentID and CourseID.
    You can see

    the new design in Tables D.4 and D.5.


    # Table D.4: The Courses Table


    | Field Name | Description |

    | --- | --- |

    | CourseID | Unique ID of the course |

    | CourseDescription | Description of the course |

    | CourseInstructor | Instructor of the course |


    # Table D.5: The New students_courses Table


    | Field Name | Description |

    | --- | --- |

    | StudentID | Unique ID of the student, matching an entry in the students table.
    |

    | CourseID | Unique ID of the course taken, matching an entry in the courses table.
    |


    Believe it or not, you can go even further with this, to the third normal form.


    # Taking Tables to Third Normal Form


    The rule for the third normal form is


    +   - Non-key attributes depend on other non-key attributes


    This rule simply means that you need to look at your tables and determine whether
    more fields exist that can be broken

    down further and that aren''t dependent on a key. About removing repeated data
    and you''ll find your answer—

    instructors. Usually, an instructor will teach the CourseInstructor field in the
    courses'
