  md: "# ## Error Checking to the Script\n\nThe plan is to use the variable $_SERVER[PHP_SELF],\
    \ which has a value of the script's current name. So really, $_SERVER[PHP_SELF]\
    \ will have a value of allone.php in this instance. When you use $_SERVER[PHP_SELF]\
