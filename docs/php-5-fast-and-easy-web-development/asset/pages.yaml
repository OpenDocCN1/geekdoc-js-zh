  md: '# # Chapter 16: Using Cookies


    #  Overview


    Cookies are great little tools, but they get a bad rap in the press when nasty
    people misuse them. These little bits of text can make your development life much
    easier if you use them properly. In this chapter, you learn how to:


    +   * Set a cookie

    * Extract data from a cookie

    * Amend your user authentication routines to use a cookie'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# What are Cookies?


    Cookies are pieces of text sent to a user''s web browser. Cookies can help you
    create shopping carts, user communities, and personalized sites. It''s not recommended
    that you store sensitive data in a cookie, but you can store a unique identification
    string that will match a user with data held securely in a database.


    Take the shopping example. Suppose you assign an identification variable to a
    user so that you can track what he does when he visits your site. First, the user
    logs in, and you send a cookie with variables designed to say, "This is Joe, and
    Joe is allowed to be here." While Joe is surfing around your site, you can say,
    "Hello, Joe!" on each and every page. If Joe clicks through your catalog and chooses
    14 items to buy, you can keep track of these items and display them all in a bunch
    when Joe goes to the checkout area.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Setting Cookies


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>bad cookie</title>

    </head>

    <body>

    <script>

    setcookie("test", "ok", "/", "yourdomain.com", 0);

    </script>

    <p>bad cookie</p>

    </body>

    </html>

    ```


    Before you start setting cookies, determine how you will use them and at what
    point you will set them. Whatever cookies you decide to set, remember that you
    absolutely must set a cookie before sending any other content to the browser,
    because a cookie is actually part of the header information.


    If you head this warning, you won''t spend hours wondering why you''re getting
    "Cannot add header information" errors. This sample code just does that.


    It produces the error shown in the following figure.


    Anytime you see this error, assume that you''ve sent something to the web browser
    before its time. This can include white space, a line break, or text you can actually
    see.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# Bad Cookie


    The setcookie() function, used to set a cookie at one time, and then with subsequent
    scripts.


    +   * **Name**: Holds the name of the variable that is kept in the global _COOKIE
    and accessible in subsequent scripts.

    * **Value**: The value of the variable passed in the name parameter.

    * **Expiration**: Set a specific time at which the cookie is no longer accessible.
    Cookies without a specific expiration time expire when the web browser closes.

    * **Path**: Determines where the cookie is valid. If a single slash is in the
    parameter, the cookie is valid for all files and directories on the server. If
    a specific directory is named, the cookie is valid only for pages within that
    directory.

    * **Domain**: Cookies are valid only for the host and domain that they set. If
    no domain is specified, the default is the host of the server that generated the
    cookie. The cookie domain must have at least two periods in the string in order
    to be valid.

    * **Security**: If the security parameter is set, the cookie will only be transmitted
    via HTTPS, to say, over a secure web server.


    This next line is an example of a cookie called id with a value of 55dad8092.
    This particular cookie expires in four hours (the current time is 14400 seconds),
    and it is valid for any page below the document root on the yourdomain.com.

    setcookie("id", "55dad8092", time() + 14400, "/", "yourdomain.com", 0);


    In the next section, I''ll give you a cheat for common values. Then you''ll know
    how to use cookies.


    # Counting Time


    If you want to set an expiration date, the easiest way is to use PHP to count
    forward for you, and then place a value in the expiration slot. This value should
    be a Unix integer (the number of seconds since January 1, 1970), which you can
    get using the time() function with additional seconds added to it.


    Setting an expiration date on your cookies builds some extra validities of the
    user. If you set a cookie without a time, it will automatically expire when the
    users close their browsers. This is useful when users are sharing computers; you
    don''t want to have to handle all the access stored by the previous user''s cookie.
    Similarly, you might want to set a cookie for 15 minutes, if you are building
    an online store that allows you to receive a discount on everything purchased
    in the first 15 minutes of your users'' visits.


    Table 16.1 shows some examples of time(n)+n with the setcookie() function.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_215_0.png)'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Table 16.1: Common Times


    | Value | Definition |

    | --- | --- |

    | time () +60 | One minute from the current time |

    | time () +900 | 15 minutes from the current time |

    | time () +1800 | 30 minutes from the current time |

    | time () +3600 | One hour from the current time |

    | time () +14400 | Four hours from the current time |

    | time () +43200 | 12 hours from the current time |

    | time () +86400 | 24 hours from the current time |

    | time () +259200 | Three days from the current time |

    | time () +604800 | One week from the current time |

    | time () +2592000 | 30 days from the current time |


    # Setting a Test Cookie


    The goal of this little script is to test a cookie and then print a message to
    the screen. Before you start, ensure that you do not have any personal firewall
    settings blocking cookies. Also, modify your web browser preferences to prompt
    you before setting cookies. This is only way to catch the cookie as the server
    attempts to send it to your browser.


    +   1. Open a new file in your text editor and start a PHP block: Create a set
    of variables called $cookie_name, $cookie_value, $cookie_expire, $cookie_domain,
    and give them the following:

    ```php

    $cookie_name = "test_cookie";

    $cookie_value = "test string";

    $cookie_expire = time() +86400;

    $cookie_domain = "127.0.0.1";

    ```


    > Note Use your domain name for value of $cookie_domain if you are not using 127.0.0.1
    (localhost) as your domain.


    +   2. Use the setcookie() function to test this test cookie and then close the
    PHP block:

    setcookie($cookie_name, $cookie_value, $cookie_expire, "/", 0);


    +   3. Type the following HTML:

    ```html

    <html>

    <head>

    <title>Test Cookie</title>

    </head>

    <body>

    <h1>mmmmmmmm...cookie!</h1>

    </body>

    </html>

    ```


    +   4. Save the file with the name setcookie.php, and place this file in the document
    root of your server.


    +   5. Open your browser and type http://127.0.0.1/setcookie.php.


    You should see a dialog box prompting you to accept the cookie. The actual dialog
    box will differ from browser to browser, as will the action buttons.'
