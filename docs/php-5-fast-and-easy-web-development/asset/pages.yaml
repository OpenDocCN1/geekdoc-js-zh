  md: "# Display Browser-Specific HTML\n\nIn the previous chapter, you learned to\
    \ retrieve and print more interesting with the HTTP_USER_AGENT environment variable\
    \ to the screen. In this chapter, you do a bit more interesting with the value\
    \ of HTTP_USER_AGENT, and that's printing browser-specific HTML.\n\nHaving seen\
    \ some of the possible values of HTTP_USER_AGENT in the last chapter, you can\
    \ imagine that there are hundreds of different values. It's time to learn some\
    \ basic pattern matching.\n\nYou'll use the preg_match function to perform this\
    \ task. This function needs two arguments: what you're looking for, and where\
    \ you're looking:\npreg_match(\"/what you're looking for/\", \"where you're looking\"\
    );\n\nThis function returns a value of true or false, which you can use in an\
    \ if...else block to do whatever you want. The goal of the first script is to\
    \ determine whether a browser is Microsoft Internet Explorer, Netscape, or something\
    \ else.\n\nWithin the value of HTTP_USER_AGENT, Netscape also uses the Morilla\
    \ to identify itself. Unfortunately, the value of HTTP_USER_AGENT, MSIE also uses\
    \ Morilla to show that it's compatible. Luckily, it uses the string MSIE, so the\
    \ HTTP_USER_AGENT doesn't contain Morilla or MSIE, chances are very good it's\
    \ not one of those browsers.\n\n+   1. Open a new file in your text editor and\
    \ add a PHP block, and then use getenv() to place the value of HTTP_USER_AGENT\
    \ in a variable called $agent:\n```php\n$agent = getenv(\"HTTP_USER_AGENT\");\n\
    ```\n\n2. Start an if...else statement to find\n2. Start an if...else statement\
    \ to find which of the preg_match() functions use, starting with the search for\
    \ MSIE:\nif (preg_match(\"/MSIE/\", \"$agent\")) {\n  $result = \"You are using\
    \ Microsoft Internet Explorer.\";\n}\n```\n\n3. Continue the statement, testing\
    \ for \"Mozilla\":\n\n```\nif (preg_match(\"/Mozilla/i\", \"$agent\")) {\n$result\
    \ = \"You are using Netscape.\";\n}\n```\n\n> NOTE\nThe in the preg_match() function\
    \ performs a case-insensitive search.\n\n+   4. Finish the statement by defining\
    \ a default:\n```php\nelse {\n  $result = \"You are using $agent\";\n}\n```\n\n\
    +   5. Close your PHP block and add some HTML to begin the display:\n```html\n\
    <HTML>\n<HEAD>\n<TITLE>Browser Match Results</TITLE>\n</HEAD>\n<body>\n```\n\n\
    +   6. Type the following PHP code to print the result of the if...else statement:\n\
    ```php\necho \"$result\";\n```\n\n+   7. Add some more HTML so that the document\
    \ is valid:\n```html\n</body>\n```"
