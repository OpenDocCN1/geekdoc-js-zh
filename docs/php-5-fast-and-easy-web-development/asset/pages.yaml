    ```


    +   8. Create a variable to hold the result of the mysqli_query() function, as
    you have learned:

    ```php

    $result = mysqli_query($sql, $connection) or die($mysqli_error($connection));

    ```


    +   9. You''ll create a bullet list within a while block. Start the bullet list
    outside the while block:

    ```php

    $contact_list = "<ul>";

    ```


