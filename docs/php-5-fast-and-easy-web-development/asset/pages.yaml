- img_proc: true
  md: '# File Paths and Permissions


    The scripts used in these chapters can be executed on both Windows and Linux/Unix
    operating systems. If you are using Windows, you can use both the forward slash
    (/) and the backslash (\) in file paths, whereas other operating systems use only
    the forward slash. The scripts in this chapter use the forward slash method in
    all instances. This method works even if you don''t specify a drive letter. For
    example:


    ```

    Path = "/Program Files/Apache Group/Apache/htdocs*";

    ```


    This path, on Windows, is assumed to be on the current drive (in my case, C:).
    If you need to specify a drive letter, go for it:


    ```

    Path = "C:/Program Files/Apache Group/Apache/htdocs*";

    ```


    You''ll have to modify file paths to fit your own directory structure, but you
    shouldn''t have to do anything more than that.


    > **Note** For each directory specified in this chapter, you must have the proper
    permissions to create, modify, and delete files within it. This is an especially
    important note for non-Windows users, whose operating system is multi-user by
    nature. If you are unsure how to assign or modify permissions on your system,
    please contact your administrator.'
  merge: -1
  pgno: 118
