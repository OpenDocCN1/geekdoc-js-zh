  md: '# # Listing Databases on a Server


    Now that you''ve successfully used PHP to connect to MySQL, it''s time to familiarize
    yourself with some of the built-in MySQL-related functions. In this section, you
    will use the following functions:


    +   - mysql_list_db() — Used to list the databases on a MySQL server.

    - mysql_num_rows() — Returns the number of rows in a result set.

    - mysql_tablename() — Despite its name, can return the name of a table or a database
    from a result.


    The goal of this script is to list all the databases on the MySQL server.

    1. Open a new file in your text editor and start a PHP block:


    ```

    <?

    2. Create a variable to hold the result of the mysql_connect() function. Include
    the @ to suppress warnings, as well as the die() function to cause the script
    to end and a message to be displayed if the connection fails

    $connection = @mysql_connect("localhost", "spike", "9sj7En4")

    or die(mysql_error());

    3. Create a variable to hold the result of the mysql_list_db() function. Include
    the @ to suppress warnings, as well as the die() function to cause the script
    to end and a message to be displayed if the script can''t get the:

    $dbs = mysql_list_db($connection) or die(mysql_error());

    ```


    > Note The only argument necessary for the mysql_list_db() function is the link
    identifier for the current connection.


    +   4. You''ll be looping through a result and dynamically populating a bullet
    list. Start that bullet list outside the loop:

    $db_list = "<ul>";n5. Start a counter. You''ll need it for your loop:

    $i = 0;

    6. Begin a while loop. This loop will continue for long as the value of $i is
    less than the number of rows in the $dbs result value:

    while ($i < $mysql_num_rows($dbs)) {

    7. Once you''re within the while loop, get the name of the database reflected
    in the current row of the result:

    $db_names[$i] = mysql_tablename($dbs, $i);


    > Note $1 is replaced by its value, during the first loop, this line would be
    something like

    $db_names[0] = mysql_tablename($dbs, 0);


    Counting starts at 0, not 1, this would reflect the first row in the result. As
    the counter is incremented, it is the row number.


    +   8. Add the current database name to the bullet list:

    $db_list .= "<li>$db_names[$i]</li>";


    +   9. Increment your counter before you close the while loop:

    $i++;


    +   10. Close the while loop, the bulleted list, and your PHP block:

