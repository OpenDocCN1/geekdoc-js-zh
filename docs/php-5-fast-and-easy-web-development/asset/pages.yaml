  md: '# Chapter 12: Creating a Database Table


    # Overview


    You have this great database server, and only a table called test_table sitting
    in a database called testDB. Where''s the fun in that? In this chapter, you learn
    how to:


    +   - Plan for a database table

    - Recognize the pitfalls of certain data types

    - Recognize the importance of unique fields

    - Follow a two-step process for table creation

    - Create a table to hold your personal music catalog'
