    lifetime. Constants can be user-defined, or you can use some of the predefined
    constants that PHP always has. Unlike simple variables, constants do not have
    a dollar sign before their names, and they are usually uppercase to show their
    difference from scalar variables. Next, you''ll use the user-defined type.


