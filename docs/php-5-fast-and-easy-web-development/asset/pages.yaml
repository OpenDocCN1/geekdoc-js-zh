  md: '# Setup Complete


    Setup has finished installing MySQL Servers and Clients 4.0.18 on your computer.


    Setup can launch the Read Me and MySQL Servers and Clients 4.0.18. Choose the
    options you want below.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_19_0.png)


    MySQL is now installed on your system. However, you won''t find any shortcuts
    installed in your Windows Start menu after an installation of MySQL from MySQL
    AB, so you must start the process yourself. If you navigate to C:\mysql directory,
    you will find number installing applications ready for action. One of these applications
    is called WinMSadmin, which is a great friend to Windows users getting started
    with MySQL. If you double-click this file, it will start the MySQL server and
    place a spotlight icon in your task bar. If you right-click this icon, you can
    launch a graphical interface to monitor and manage your server.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_19_1.png)


    **Note** The first time you use WinMSqlAdmin it will ask you to create a username
    and password. Go ahead and pick a unique/password pair for convenience.


    WinMSadmin will automatically detect environment information, such as IP address,
    machine name, and so on. The tabs across the top allow you to view system information
    and also edit MySQL configuration options. To shut down the MySQL server, right-click
    on the spotlight icon in your task bar and select the appropriate choice. As long
    as the MySQL server is running, you can run additional applications through a
    console window, such as the MySQL monitor.


    In the next section, you will learn how to manage MySQL manually and perform few
    actions to familiarize yourself with the system.


    # Testing Your MySQL Installation


    In this section, you will work with the MySQL utilities via the command line in
    a console window. When using MySQL with PHP, you''ll see the same type of commands,
    within the context of the PHP code. Use this information to familiarize yourself
    with the types of commands and responses you will be working with later in the
    book.


    # Starting MySQL'
  merge: -1
