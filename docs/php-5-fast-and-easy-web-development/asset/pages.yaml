    +   7. If `$file_name` is not either of the "dot" filenames, add it to `$file_list`
    using the concatenation operator:

    `$file_list .= "<li>"$file_name."</li>";


    +   8. Close the handle and the while loop:

    ```php

    }

    ```


    +   9. Add the closing tag to the bulleted list:

    `$file_list .= "</ul>";`


    +   10. Open the directory:

    `closedir($dir);`


