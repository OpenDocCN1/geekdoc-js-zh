  md: "# Checking Your php.ini File\n\nBefore you start uploads, check a few values\
    \ in your php.ini file. Look for this section of text:\n\n```\n;;;;;;;;;;;;;;;;\n\
    ; File Uploads ;\n;;;;;;;;;;;;;;;\n; Whether to allow HTTP file uploads.\nFile_uploads\
    \ = On\n\n; Temporary directory for HTTP uploaded files (will use system default\
    \ if not\nspecified);\nupload_tmp_dir = \n\n; Maximum allowed size for uploaded\
    \ files.\nuupload_max_filesize = 2M\n```\n\nTo ensure the file upload process\
    \ works smoothly, make the following modifications:\n\n+   1. Uncomment the upload_tmp_dir\
    \ line by deleting the initial semicolon.\n2. Enter a directory name after the\
    \ = upload_tmp_dir.\n3. If you want to allow larger uploads, change the number\
    \ of bytes for upload_max_filesize.\n\nFor example, on a Windows system, this\
    \ section of the php.ini file might look like this:\n\n```\n;;;;;;;;;;;;;;;;\n\
    ; File Uploads ;\n;;;;;;;;;;;;;;;\n; Whether to allow HTTP file uploads.\nfile_uploads\
    \ = On\n\n;Temporary directory for HTTP uploaded files (will use system default\
    \ if not\nspecified);\nupload_tmp_dir = /temp\n; Maximum allowed size for uploaded\
    \ files.\npload_max_filesize = 2M\n```\n\nIf you are not using Windows, you don't\
    \ have to modify the value for upload_tmp_dir, as long as you want files to be\
    \ placed in /tmp (the default)."
