  md: '# # Appendix D: Database Normalization and SQL Reference


    The databases used in this book were designed for simplicity''s sake, to help
    you understand the basic interaction between PHP and MySQL. These are not "normalized"
    databases. "Normalization" is a word you hear a lot when you begin to create database-driven
    applications, and it requires a different type of process—thinking in relational
    terms before seeking the relationships in front of you. In this appendix, you
    learn the basics of database normalization, with some key elements of the SQL
    language.


    # ## Database Normalization


    Database normalization is a set of rules that allows you to organize your database
    in such a way that tables are related, optimized, and flexible for future growth
    and relationships. The sets of rules used in normalization are called normal forms.
    If your database design follows the first set of rules, it is considered in the
    first normal form. If the first three sets of rules are followed, your database
    is said to be in the third normal form. This appendix goes through the normal
    forms, using the concept of students and courses in a school, and shows how to
    normalize them.


    # ## Applying Normal Forms


    Before explaining the first normal form, let''s start with something that needs
    to be normalized. In a database, a flat table is a prime example of something
    needing to be normalized. A flat table is a spreadsheet with columns of data.
    In a flat table, there are no relationships between multiple tables, all the data
    you possibly want right in that single flat table. This scenario is not the most
    efficient design and will consume more space on your hard drive than a set of
    normalized databases.


    Suppose you have a table that holds student and course information for a school.
    You might have the following fields in your flat table, as shown in Table D.1.


    # ### Table D.1: The Students and Courses Table


    | Field Name | Description |

    |---|---|

    | StudentName | Name of the student |

    | CourseID | ID of the first course taken by the student |

    | CourseDescription1 | Description of the first course taken by the student |

    | CourseInstructor1 | Instructor of the first course taken by the student |

    | CourseID2 | ID of the second course taken by the student |

    | CourseDescription2 | Description of the second course taken by the student |

    | CourseInstructor2 | Instructor of the second course taken by the student |


    You might repeat CourseID, CourseDescription, and CourseInstructor many times
    to account for all the data a student can take during their academic career. Although
    redundant, this is the method used when creating a single flat table to store
    information. Eliminating this redundancy is the first step in database normalization,
    to get to first normal form. If your table remained in this flat format, you could
    have a lot of unused space and a lot of space used unnecessarily—not efficient
    design!


    # ## Taking a Table to First Normal Form


    The main rules for the first normal form are:


    +   - Repeating information

    - Create separate tables for related data


    Looking at the table design, with its many repeated sets of fields for students
    and courses, you can identify students and courses as its two distinct topics.
    Taking your students and courses flat table to the first normal form would mean
    that you create two tables: one for students (call it *students*) and one for
    students all courses (call it *students_courses*). You can see the new design
    in Tables D.2 and D.3.'
