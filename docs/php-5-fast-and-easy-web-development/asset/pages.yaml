- img_proc: true
  md: 'as TEXT also hold large amounts of data; the difference between the two is
    sorts and comparisons on stored data are sensitive to BLOBs and insensitive to
    TEXT fields.

    You do not specify a length with BLOB or TEXT.


    # ENUM


    An enumeration (list). When defining an ENUM, you are creating a list of items
    from which the value must be selected (or it can be NULL). For example, if you
    wanted your field to contain either ''A'' or ''B'' or ''C'', you could define
    your field AS ENUM (''A'', ''B'', ''C'') and only those values (NULL) could ever
    populate that field. ENUMs have 65535 different values.


    # Defining Your Fields


    The overall goal of this chapter is to create a table to hold data from your personal
    music collection. A moment to think about the kinds of things you''d want to know:
    the title and artist, and maybe the record, the date it was acquired, and your
    own notes regarding the recording. I thought about what I wanted for my own table,
    I''ve decided to call it my_music, as in Table 12.2.


    # Table 12.2: Fields for my_music


    | Field Name | Description |

    |---|---|

    | id | Creates a unique ID number for the entry |

    | format | Is it a CD, cassette, or even an LP? |

    | title | The title of the recording |

    | artist_fn | The artist''s first name |

    | artist_in | The artist''s last name or the name of the group |

    | rec_label | The record label |

    | my_notes | My own thoughts about the recording |

    | date_acq | Date acquired |


    In the next section, you will create a sequence of forms that will take your table
    information and send it to your MySQL database. In the first step, you submit
    the name of the table and the number of fields you want to include. The second
    step will display additional form fields so that you can define the properties
    of your table columns. A third step will send the request to MySQL, verify that
    the table was created, and display a "Success! message.


    # The Importance of Unique Fields


    Using ID numbers not only helps you keep track of your data, but also down the
    road, helps you attempt to establish relationships between multiple tables. In
    the my_music table, there will be an ID field. Using this field as the unique
    field, it will allow you to have two records with the same name. For example,
    if you have the album Strawberry Fire by the Indigo Girls, you could have two
    entries in your table: one for the version released in 1987, and one for the version
    released in 1990 (on that one).


    Without a unique identifier, you would have to pick only one version to put in
    your table, and you wouldn''t be very accurate. I hope this simple example conveys
    the importance of having an identifier in each record in your table. The usage
    of unique identifier will become more apparent throughout the remainder of this
    book, as you create more database-driven elements.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_165_0.png)'
