  md: "# # File System Housekeeping\n\nThe next series of scripts will help you perform\
    \ very basic file system tasks, such as copying, renaming, and deleting files.\
    \ Remember that you can perform system functions only if the proper permissions\
    \ are in place for the PHP user.\n\n# ## Copying Files\n\nThe `copy()` function\
    \ is simple: it needs to know the original filename and a new filename, and that's\
    \ all to it.\n\n+   1. Open a new file in your text editor and start a PHP block:\n\
    ```php\n<?\n\n2. Create a variable to hold the full path to the new file (use\
    \ your own path):\n```php\n$filename = \"Documents/Settings/Owner/Desktop/misc/file.txt\"\
    ;\n```\n3. Create a variable to hold the full path to the new file (use your own\
    \ path):\n```php\n$new_filename = \"Documents/Settings/Owner/Desktop/misc/file.bak\"\
    ;\n```\n4. Create a variable to hold the true/false result of the function. Suppress\
    \ warnings by the @ in front of the function, and use `die()` to print a message\
    \ if the function fails:\n```php\n$success = @copy($filename, $new_filename) or\
    \ die(\"Couldn't copy file.\");\n```\n5. Start with an if...else statement to\
    \ print the message based on the outcome of the function:\n```php\nif ($success)\
    \ {\n    $msg = \"Copied $filename to $new_filename\";\n6. The message string,\
    \ if successful, should print a confirmation of the copy:\n7. Continue the statement\
    \ for a failure, and then close the PHP block:\n} else {\n    $msg = \"Could not\
    \ copy file.\";\n}\n?>\n``````\n\n> Note Using the `else` statement in this case\
    \ is actually unnecessary, but it's good practice for providing a default result.\
    \ If the `copy()` function fails, the `die()` function will exit the script and\
    \ print the error before even getting to the `if...else` part of the script.\n\
    \n+   8. Add this HTML:\n```html\n<HTML>\n<HEAD>\n<TITLE>Copy a File</TITLE>\n\
    </HEAD>\n<BODY>\n``````\n\n+   9. Print the message:\n```php\n<? echo \"$msg\"\
    ; ?>\n```\n\n+   10. Add some more HTML so that the document is valid:\n```html\n\
    </body>\n</HTML>\n``````\n\n+   11. Save the file with the name `copyfile.php`,\
    \ and place this file in the document root of your web server.\n\n+   12. Open\
    \ your web browser and type `http://127.0.0.1/copyfile.php`."
