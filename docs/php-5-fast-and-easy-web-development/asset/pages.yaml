  md: '# Creating the Form


    Start out by creating one-file form. You can create a form to upload as many files
    as you like, after you get this sequence work with one file.


    +   1. Open a file in your text editor and type the following HTML:

    <HTML>

    <HEAD>

    <TITLE>Upload a File/</TITLE>

    </HEAD>

    <BODY>

    <h1>Upload a File</h1>

    </BODY>


    +   2. Begin your form. Assume that the method is POST and the action is a script
    called do_upload.php. Because you''ll be sending more than just text, use the
    ENCRYPT attribute.

    <FORM METHOD="POST" ACTION="do_upload.php" ENCRYPT="multipart/form-data">


    +   3. Create an input field for the file with a text label. Assume that you''ll
    uploading an image file, and name the input field img:

    <strong>File to Upload:</strong><br><INPUT TYPE="file" NAME="img" SIZE="30">


    > Note The Type="file" attribute in the form field will display an input field
    with a Browse button. The Browse button launches a file manager through which
    you select the file to upload.


    +   4. Add a submit button, and then close your form and add some more HTML so
    that the document is valid:

    <P><INPUT TYPE="submit" NAME="submit" VALUE="Upload File"></P>

    </FORM>

    </BODY>

    </HTML>


    +   5. Save the file with the name upload_form.html, and place this file in the
    document root of your web server.


    +   6. Open your browser and type http://127.0.0.1/upload_form.html.'
