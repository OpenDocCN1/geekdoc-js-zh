  md: '# # Planning and Creating Your Administrative Menu


    You could just write one script that says "Select all my data; I don''t care about
    the order," but that would be boring. In this chapter, you will see four ways
    to select records from the my music table. To facilitate easy navigation, create
    an administration menu—fancy words for "list of lists to scripts."


    +   1. Open a new file in your text editor and type the following HTML:

    ```html

    <HTML>

    <HEAD>

    <TITLE>My Menu</TITLE>

    </HEAD>

    <BODY>

    <h1>My Menu</h1>

    <p><strong>My Music</strong></p>

    <ul>

    <li><a href="sel_byid.php">ordered by ID</a></li>

    </ul>

    </BODY>

    </HTML>

