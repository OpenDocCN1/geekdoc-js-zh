    The PHP `mail()` function makes the interface between your HTML forms and your
    server''s mailing program a snap!

    If your server has a sendmail or an external SMTP server, the `mail()` function
    sends a mail to a specified recipient. Its syntax is

    mail("recipient","subject","message","mail headers");


    For example, use the following code sent to mail to `julia@example.com` with a
    subject of "I''m sending mail!” and a message body saying "PHP is cool!”. The
    `From` line of the additional mail headers:

    mail("julia@example.com","I''m sending mail!","From:youmail@yourdomain.com\n\nPHP
    is cool!");


    # Mathematical Functions


