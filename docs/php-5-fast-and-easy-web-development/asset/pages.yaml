  md: '# Inserting, Updating, or Replacing within a Table


    The SQL INSERT and REPLACE populate your table one record at a time. The syntax
    of INSERT is

    INSERT INTO [tableName] ([fieldName1], [fieldName2], ...)

    VALUES (''value of fieldName1'', ''value of fieldName2'')...


    When inserting records, be sure to wrap your strings with single or double quotes.
    If you use single

    around your strings and you are adding apostrophes, avoid errors by escaping the
    apostrophe (\'')

    within the INSERT statement. Similarly, if you use double quotes around your strings
    and you want to include

    quotes as part of the data, escape them (") within your INSERT statement.


    Here is an example of inserting something:

    ''Grady "Wow"


    If you insert strings double quotes, the INSERT statement would look like this:


    ```

    INSERT INTO table_name (column_name) VALUES (''OGrady "Wow"'');

    ```


    If you insert strings in single quotes, the INSERT statement would look like this:


    ```

    INSERT INTO table_name (column_name) VALUES (''OGrady "Wow"'');

    ```


    The REPLACE statement has the same syntax and requirements as the INSERT statement.
    The statement allows

    use to overwrite a record in a table when the replacement is based on a unique
    value:

    REPLACE INTO [tableName] ([fieldName1], [fieldName2], ...)

    VALUES (''value of fieldName1'', ''value of fieldName2'')...


    The UPDATE command modifies parts of a record without replacing the entire record.
    To update a column in

    the table with a new value, use:

    UPDATE [tableName] SET [fieldName] = [new value];


    If you want to update only specific rows, use a WHERE clause:

    UPDATE [tableName] SET [fieldName] = ''new value'' WHERE [some

    expression];


    UPDATE can be a very powerful SQL command. For example, you can perform string
    functions and mathematical

    functions on existing records and use the UPDATE command to modify their values.


    # Deleting From a Table


    Like the SQL DROP command, using DELETE without paying attention to what you''re
    doing can have horrible

    sesequences in a production environment. Once you delete a table or delete record,
    it''s gone. Don''t be afraid—

    be careful. To delete all the contents of a table, use the following:

    DELETE FROM [tableName];


    If you want to delete only specific rows, use a WHERE clause:

    DELETE FROM [tableName] WHERE [some expression];


    If you''re going to delete records, be sure to have a backup, just in case something
    goes wrong. Everyone screws

    off once—and hopefully never again.


    # Selecting From a Table


    When creating database-driven websites, the SELECT command will likely be the
    most-used command in your

    arsenal. The SELECT causes certain results in your table to be chosen, based on
    criteria that you define. Here

    is the basic syntax of SELECT:


    ```

    SELECT [field names] FROM [table name]

    WHERE [some expression]

    ```


    To select all records in a table, use:

    SELECT FROM [tableName];


    To select just the entries in a given column of a table, use:'
