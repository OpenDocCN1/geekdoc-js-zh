  md: '# PHP Variable and Value Types


    You will create two main types of variables in your PHP code: scalar and array.
    Scalar variables contain only one value at a time, and arrays contain a list of
    values, or another array.


    The example at the beginning of this chapter created a scalar variable, and the
    code in this book deals primarily with scalar variables. You can find first information
    on arrays in Appendix B, "Basic PHP Language Reference."


    When you assign a value to a variable, you may assign a value of one of the following
    types:


    +   * Integers: Whole numbers (without decimals). Examples are 1, 345, and 992786.
    You can also use octal and hexadecimal notation: the octal 123 is decimal 83 and
    the hexadecimal 0x12 is decimal 18.

    * Floating-point "floats" or "doubles". Numbers with decimals. Examples are 1.5,
    87.3446, and 0.8889992.

    * Strings: Text andor numeric information, specified within double quotes (")
    or single quotes ('''').


    As you begin your script, plan your variables and variable names carefully, and
    use comments in your code to remind yourself of the assignments you made.


    Create a simple script that assigns values to variables and then prints them to
    the screen.


    +   1. Open a new file in your text editor and type the following HTML:

    ```html

    <html>

    <head>

    <title>Printing Variables</title>

    </head>

    <body>

    ```

    2. Add a PHP code and create a variable that holds an integer:

    ```php

    $intVar = "9552415644";

    ```


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_60_0.png)


    +   3. Create a variable that holds a floating-point number:

    ```php

    $floatVar = "1542.2323235";

    ```


    +   4. Create a variable that holds a string:

    ```php

    $stringVar = "This is a string.";

    ```'
