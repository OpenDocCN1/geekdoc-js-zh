- img_proc: true
  md: '# A Brief History of PHP


    In 1994, an incredibly forward-thinking man Rasmus Lerdorf developed a set of
    tools that used a parsing engine to interpret a few macros here and there. They
    were not extravagant: a guest book, a counter, and some other "home page" elements
    that were cool when the web was in its infancy. He eventually combined these tools
    with a form interpretation (FI) package he had written, added some database development,
    and released what was known as PHP/FI.


    Then, in the spirit of Open Source development, developers all over the world
    began contributing to PHP/FI. By 1997, more than 50,000 websites were using PHP
    to accomplish different tasks—connecting to a database, displaying dynamic content,
    and so on.


    At that point, the development process really started becoming a team effort.
    With primary assistance from developers Zee Suraski and Andi Gutmans, the version
    3.0 was created. The final release of PHP 3.0 occurred in June of 1998, when it
    was upgraded to include support for multiple platforms (it''s not for Linux anymore!)
    and web servers, numerous databases, and SMPP (Simple Message Preprocessor Protocol).
    Then, the birth of PHP 4.0 occurred. No small version change, PHP 4.0 marked a
    complete rethinking of the PHP core and a rewrite of the internals of the scripting
    language itself. The PHP development team and Zend Technologies produced a remarkable
    product with nearly a 50-fold performance improvement over version 3.0, with a
    long list of new and useful features.


    As if that weren''t enough, PHP 5 has been in the works almost since PHP 4 was
    released, culminating in what we have today: an even faster, feature-rich programming
    language suitable for procedural or object-oriented scripts, which warrants a
    place in the enterprise.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# What Does PHP Do?


    PHP does anything you want, except sit on its head and spin. Actually, with a
    little on-the-fly-image image manipulation and Dynamic HTML, it could probably
    do that, too.


    According to the PHP manual, "The goal of the language is to allow web developers
    to write dynamically generated pages quickly."


    Here are some common uses of PHP, all of which are part of what you''ll learn
    in this book:


    +   * Perform system functions; create, open, read from, write to, and close files
    on your system; execute system commands; create directories, and modify permissions

    * Gather data from forms: save the data to a file, send data via e-mail, and return
    manipulated data to the user.

    * Access databases and generate content-on-the-fly, or create a web interface
    for adding, deleting, and modifying elements within your database.

    * Set cookies and access cookie variables.

    * Start sessions and use session variables and objects.

    * Restrict access to sections of your website.

    * Create images-on-the-fly.

    * Encrypt data.


    These are just basic, everyday uses. PHP also includes support for integrating
    with Java servlets, XML, and a myriad of other higher-level functions. The possibilities
    literally are endless.'
  merge: -1
