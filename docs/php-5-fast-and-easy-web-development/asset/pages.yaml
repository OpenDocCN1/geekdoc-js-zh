  md: '# Configuring Apache on Linux/Unix


    To run a basic installation of Apache, the only changes you need to make are to
    set the server name, which resides in the master configuration file http.conf.
    This file lives in the conf directory, within the Apache installation directory.


    If your installation directory is /usr/local/apache2/, the configurations will
    be


    /usr/local/apache2/conf/


    To modify the,, most importantly the server name, open the http.conf file with
    a text editor and look for a heading Section 2: Main server. You will find two
    important sections of text.


    +   * Change the value of ServerName to your email address.


    +   * Change the value of ServerName to something accurate, and remove the # so
    that the entry looks like this: ServerName something.domain.com. You do not want
    it to look like this:

    #ServerName something.domain.com.


    3. Save the file.


    The ServerName is the most important change you''ll make to your Apache configuration
    file, because if the ServerName isn''t accurate, you won''t be able to connect
    to apache on your machine. It stays in the configuration file itself. "You cannot
    just invent host names and hope they work." If you do not know your full machine
    name, you can use an IP address. If you have a static IP address, that does not
    change, use it as your ServerName. If you have a dial-connection that does not
    assign a static IP (that is, your IP number changes each time you connect to your
    Internet service provider), you will have to change the IP number in http.conf
    each time you do.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'Note The ServerName changes here are relevant only if you want people from
    the outside world to be able to connect to your new web server. If you are the
    only person who will be accessing the server, you can use the IP number 127.0.0.1,
    which is recognized by machines as the local loop-back address, also known as
    localhost. You can use either the word localhost or the IP number 127.0.0.1 as
    ServerName in httpd.conf.


    Once the appropriate modifications are made to the httpd.conf file, Apache is
    ready to run on your machine. In the next section, you start and connect to Apache.


    # Starting and Connecting to Apache


    There''s a utility in the bin directory within your Apache installation called
    apachectl. It allows you to issue start, stop, and restart commands. Use this
    utility to start Apache for the first time.


    +   1. To get the Apache installation directory, cd /usr/local/apache2 and press
    Enter.

    2. Type: /bin/apachectl start and press Enter.


    You should see a message: http started if you do not see this message, you have
    an error somewhere in your configuration file, and the error message will tell
    you where to go.


    To stop Apache, you can use /bin/apachectl stop and press Enter. For now, keep
    running, as the next step is to connect to the server via a web browser. The URL
    you will be is ServerName—an actual name or IP, or the localhost IP.


    Note Remember, only you can connect to your web server using 127.0.0.1 or the
    name localhost. This assumes that you''ll be using 127.0.0.1 as the ServerName,
    if you are not, just substitute your name for 127.0.0.1 in the examples.


    To test your installation, open your web browser, http://127.0.0.1/ in the location
    bar, and press Enter. You will see a default page.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_36_0.png)


    This default page comes from the htdocs directory within your Apache installation
    directory. You can go into it and delete all the default files if you want to,
    or leave them there. They''re not hurting anything, but you''ll be potentially
    filling the htdocs directory with your own files and directories, so you might
    want to delete them for the sake of good housekeeping.


    Move ahead to the next chapter, where you install PHP and make a few minor changes
    to your Apache configuration files you''re ready for some action.'
