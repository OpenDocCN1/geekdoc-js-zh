    # File System Functions


    The built-in functions can be powerful tools—weapons, if incorrectly. Be careful
    when using file functions, especially if you have PHP configured to run as root
    or some other user-wide. For example, using a PHP script to execute `rm -rf` at
    the root level of your directory structure could be a very bad thing.


    chmod(), chgrp(), and chown()


    The like functions of the same name, the `chmod()`, `chgrp()`, and `chown()` functions
    modify permissions, group and owner of a directory or file. Here is the syntax
    to write these functions:


    ```

    chmod(filename, mode);

    chgrp(filename, newgroup);

    own(filename, newowner);

    ```


    In order to change permissions, groups, and owners, the PHP user must be the owner
    of the file, or the permissions must be allowed to set such changes by that.


    copy()


    The `copy()` function works like the `cp` command: it needs a filename and a destination
    to copy a file. The syntax of `copy()` is


    ```

    copy("source filename", "destination");

    ```


    The PHP user must have permission to write into the destination, the `copy()`
    function will fail.


    fopen()


    The `fopen()` function opens a file or URL for reading/writing. The syntax of
    `fopen()` is


    ```

    fopen("filename", "mode");

    ```


    To open a URL, use `http://...` at the beginning of the filename string. You can
    open URLs only for reading, not writing.


    If the filename contains anything else, the file is opened from the file system
    and a pointer to the opened file is returned. Otherwise, the file is assumed to
    reside on the local file system. Table B.8 lists the valid modes.


    Table B.8: Spans (Function Modes)'
