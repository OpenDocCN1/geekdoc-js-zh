    so that this works for you!


    +   3. Create a handle using the `opendir()` function to open the directory specified
    in step 2.

    `$dir = opendir($dir_name);`


    > > Note The handle is used to refer to the list


    +   4. You''ll eventually find the results in a bulleted list inside a string
    `$file_list`. Start that bullet now:

    `$file_list = "<ul>";`


    +   5. Start a while loop using the `readdir()` function to determine when to
    start and stop the loop.

    readdir returns the name of the next file in the directory, and this assigns the
    value to a variable called `$file_name`.

    ```php

