    # Creating a Script to Mail Your Form


    According to the form action in simple_form.html, you need a script called simple_form.php.
    The goal of this script is to capture the text in $_POST[sender_name], $_POST[sender_email],
    and $_POST[message] format, send an e-mail, and provide a confirmation to the
