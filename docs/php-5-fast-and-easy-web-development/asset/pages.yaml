  md: '# String Functions


    This section only scratches the surface of PHP''s built-in string manipulation
    functions, but if you understand these common functions, your programming life
    will be quite bit easier!


    # addslashes() and stripslashes()


    The addslashes() and stripslashes() functions are very important when inserting
    and retrieving data from a database. Often, text inserted into a database will
    contain special characters (single quotes, double quotes, backslashes, NULL) must
    be escaped before being inserted. The addslashes() function does just that, using
    this syntax:


    ```

    addslashes(string);

    ```


    Similarly, the stripslashes() function returns a string with the slashes taken
    away, using this syntax:


    ```

    stripslashes(string);

    chop(string), trim(string);

    ```


    All three of these functions remove white space from a string. The chop() function
    removes white space from the end of a string, and trim() removes space from the
    beginning of a string. The trim() function removes both leading and trailing white
    space from a string. Here is the syntax of these functions:


    ```

    chop(string);

    ltrim(string);

    trim(string);

    ```


    # echo()


    The echo() function returns output. The syntax of echo() is


    ```

    echo (parameter 1, parameter 2, ...); // output is: I''m using PHPnecho "I using
    PHP!"; // output: is

    echo 2;

    ```


    For example:

    The parentheses are not required when using echo.


    # explode() and implode()


    The explode() function splits a string using a separator and returns the values
    in an array. The syntax of explode() is


    ```

    explode("separator", "string");

    ```


    For example, the following code takes a string called $color_list, containing
    a comma-separated list of colors, and places it into an array $color_list:


    ```

    $color_list = "blue,black,red,green,orange";

    $colors = explode(",", $color_list);

    ```


    Conversely, the implode() function takes an array and makes it into a string,
    using a separator. The syntax of implode() is


    ```

    implode("separator", "string");

    ```


    For example, the code takes an array called $color_list and creates a string $mycolors
    containing the values of $color_list, separated by commas:


    ```

    $mycolors = implode(",", $color_list);

    ```


    # htmlspecialchars() and htmlentities()


    The htmlspecialchars() function converts special characters and HTML entities
    within strings into their acceptable representations. The htmlspecialchars() function
    converts the less-than sign (< becomes &lt;), greater-than sign (> becomes &gt;),
    double quotes (" becomes &quot;), and the ampersand (& becomes &amp;


    The htmlentities() function converts the characters, like the ISO-8559-1 character
    to the proper HTML entity. Here is the syntax of these functions:


    ```

    htmlspecialchars(string);

    htmlentities(string);

    ```'
