    # Integers


    Integers are positive or negative numbers, zero, or numbers without decimal points.
    Each of the following variables is an integer:


    ```

    $a = 15;

    $b = -521;

    ```


    # Strings


    A series of characters grouped within double quotation marks is a string:


    ```

    $a = "I am a string";

    $b = "<p>This book is <html>cool</html>";

    ```


    You can also reference other variables within your string, which will be replaced
    when your script is executed. For:


    ```

    $num = 57; // an integer

    $my_string = "I read this book $num times"; // a string

    ```


    When you run the script, $my_string will read "1 book 57 times"


    # Variables From HTML Forms


    Depending on the method of your HTML form (GET or POST), the variables will be
    part of the $_POST or $_GET superglobal associative array. The name of the input
    field will become the name of the variable. For example, when a form is sent using
    the POST method the input field produces the variable $_POST[first_name]:


    ```

    <input type="text" name="first name" size="20">

    ```


    If the method of your form was GET, this variable will be in $_GET[first_name].


    # Variables From Cookies


    Like variables, cookies are kept in a superglobal associative array called $_COOKIE.
    If you set a cookie using "user" with a value of Joe Smith, like so


    ```

    SetCookie("user", "Joe Smith", time()+3600);

    ```


    a variable called is placed in $_COOKIE, with a value of Joe Smith. You then refer
    to $_COOKIE[user] to get that value.


    # Environment Variables


    When a browser makes a request of a web server, it sends along with the request
    a list of extra variables environment variables. This can be very useful for PHP
    scripts when displaying dynamic content or authorizing users. However, to be sure
    that you are reading the correct value, you can use the getenv() function to assign
    a value to a variable of type. The following are some common environment variables:


    REMOTE_ADDR gets the IP address of the machine making the request. For example:


    ```

    $remote_address = getenv("REMOTE_ADDR");

    echo("Your IP address is " . $remote_address . ".");

    ```


    HTTP_USER_AGENT gets the browser type, version, language encoding, and format.
    For example:


    ```

    $browser_type = getenv("HTTP_USER_AGENT");

    echo("You are using " . $browser_type . ".");

    ```


    For a list of HTTP environment variables and their descriptions, see http://wwwhooc.ncsa.uiuc.edu/cgi/env.html.


