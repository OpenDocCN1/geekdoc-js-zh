  md: '![](img/7a81120f3fcfd17d264c4ace19b756f8_31_0.png)


    # Server Information


    Please enter your server''s information.


    Network Domain (e.g. somenet.com)

    yourdomain.com


    Server Name (e.g. somenet.com)

    www.yourdomain.com


