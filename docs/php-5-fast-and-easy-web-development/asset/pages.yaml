    \ to the form in send_newsletter.html, you need a script called do_send_newsletter.php.\
    \ The goal of this script is to capture the text in the $_POST[subject] and $_POST[newsletter]\
    \ and then send it off in the form of an e-mail to everyone listed in your subscribers\
    \ table.\n\n+   1. Open a new file in your text editor and begin as you learned:\n\
