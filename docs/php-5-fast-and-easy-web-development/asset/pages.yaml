  md: "# Working with Objects\n\nOccasionally in this book, I've mentioned \"object-oriented\
    \ programming\" in reference to a more complex type of programming, beyond the\
    \ procedural scripts on which this book is based. An object is sort of a theoretical\
    \ box of—variables, functions, and so forth—that exists in a templated structure\
    \ called a class. It's easy to visualize a simple variable, such as `color`, with\
    \ a value of `red`, or `rainbow` with three or four elements inside, but methods\
    \ and properties make people have trouble visualizing objects.\n\nNow for try\
    \ to think of an object as having inputs and outputs on either side. The internal\
    \ mechanisms are called methods, and they have properties. Throughout this section,\
    \ you'll take a look at how classes, methods, and properties all work together\
    \ to produce outputs. This will give you a good idea of what object-oriented programming\
    \ is, and what you want to know when you are building your applications. To learn\
    \ more on the topic, check out https://www.php.net/manual/en/oop.php.\n\nAn object\
    \ has a class class. In a class, a set of characteristics is defined. For example,\
    \ say that you have created a house class. In the house class, you might have\
    \ architectural features, type square footage, and color characteristics. Each\
    \ house object uses all of its characteristics, but they are initialized to different\
    \ values, such as `ranch`, `1500`, and white siding or `condominium`, `tan stucco`.\n\
    \nBecause objects are largely self-contained, they are independent of one another;\
    \ they can be reused from one application to another. For example, you might write\
    \ some text-formatting classes on one project and decide to use that class in\
    \ another project. Because a class is a set of characteristics, you can pick up\
    \ the code and use it in the second project, reaching into it methods to specify\
    \ the second application, but using the inner workings of the existing code to\
    \ achieve new results.\n\n# Creating Objects\n\nCreating an object is quite simple;\
    \ just declare it to be in:\n\n```\nclassclass {\n  // code will go here\n}\n\
    ```\n\nNow that you have a class, you can create an instance of an object:\n\n\
    The following code snippet shows you that your object exists:\n\n```\n<?php\n\
    class class {\n  // code will go here\n}\n\n$object = new class();\necho \"$object\
    \ is an \" . $object->gettype();\n?>\n```\n\nIf you save this as object.php, place\
    \ it in your document root, and access it with your web browser, you will see\
    \ the following on your screen:\n$object is an object\n\nNext, you learn about\
    \ object properties and methods.\n\n# Properties of Objects\n\nThe variables declared\
    \ inside an object are called properties. It is standard practice to declare your\
    \ variables at the top of the class. These properties can be values, arrays, or\
    \ even others. The following snippet uses simple variables prefixed with the var\
    \ keyword:\n\n```\nclass house {\n  var $type = \"condo\";\n  var $sqfootage =\
    \ \"786\";\n  var $color = \"tan stucco\"\n}\n```\n\nNow, when you create a myhouse\
    \ object, it will always have these three properties, which you can reference.\
    \ The following shows how this works:"
