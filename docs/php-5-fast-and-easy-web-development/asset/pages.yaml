  md: '# Selecting Data From the my_music Table


    The next four scripts contain sections that are variations on a theme: selecting
    and displaying data. A large portion of the scripts is exactly the same, but repetition
    makes perfection, I was always told.


    The only new function in these scripts is the `mysql_fetch_array()` function.
    This function takes the result of a SQL query and places the rows in array format.
    Using a simple `while` loop, you can extract and display these elements.


    Hang on your hat, and start with the first script, which just returns the results
    ordered by their ID numbers.


    # Displaying Records Ordered by ID


    One of the required fields in the record addition script is ID. In this, you''ll
    select all the records in the `my_music` table, ordered by their ID. The default
    value of the ORDER BY clause is `ASC` (ascending), so the records are returned
    with ID #1 first, followed by #2, #3, and so on.


    +   1. Open a new file in your text editor and start a PHP block:

    ```php

    <?

    $db_name = "testDB";n```


    +   2. Create a variable to hold the name of the database on which the table resides:

    ```php

    $table_name = "my_music";n```


    +   3. Add the connection information as you have:

    ```php

    $connection = mysql_connect("localhost", "spike", "9sj7En4");

    or or die(mysql_error());

    ```


    +   4. Select the database as you have:

    ```php

    $db = mysql_select_db($db_name, $connection) or die(mysql_error());

    ```


    +   5. Create the SQL query:

    ```sql

    sql = "SELECT id, format, title, artist_fn, artist_ln, rec_label, my_notes, date_acq
    FROM Table_name ORDER BY id";n```


    > Tip Because you''re selecting all the records, you could use a * in the SQL
    statement instead of naming all fields. In this case, the line would look like
    this:

    ```sql

    s = "SELECT * FROM Table_name ORDER BY id";n```


    +   6. Create a variable to hold the result of the `mysql_query()` function, as
    you have learned:

    ```php

    $result = mysql_query($sql, $connection) or die(mysql_error());

    ```


    +   7. Start the while loop. The loop will create an array called `$row` for each
    record in the result set:

    ```php

    while ($row = mysql_fetch_array($result)) {

    ```


    +   8. Get the individual elements from the result, and give them names. Add the
    `stripslashes()` around any text field that might have slashes added to it:

    ```php

    $id = $row[''id''];

    $format = stripslashes($row[''title'']);

    $artist_fn = stripslashes($row[''artist_fn'']);

    $artist_ln = stripslashes($row[''artist_ln'']);

    $rec_label = stripslashes($row[''rec_label'']);

    $my_notes = stripslashes($row[''my_notes'']);

    $date_acq = $row[''date_acq''];

    ```


    +   9. Do to list formatting with the names. Because some artists have only a
    first name, some artists use both first and last, and group names are thrown into
    the `artist_ln` field, start an if...else to deal with this. Start by looking
    for groups.'
