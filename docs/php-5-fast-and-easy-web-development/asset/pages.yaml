  md: "# Working with fopen() and fclose()\n\nBefore you jump into working with files,\
    \ you need to learn about the fopen function, which is used to open files. This\
    \ function requires a filename and mode, and it returns a file pointer. The file\
    \ pointer provides information about the file and is used as a reference.\n\n\
    The filename is the full path to the file you want to create or open, and the\
    \ mode can be any of the modes listed in Table 9.1\n\n# Table 9.1: Modes Used\
    \ with fopen()\n\n| Mode | Usage |\n|---|---|\n r | Opens an existing file and\
    \ reads data from it. The file pointer is placed at the beginning of the file.\
    \ |\n + | Opens an existing file for reading or writing. The file pointer is placed\
    \ at the beginning of the file. |\n w | Opens a file for writing. If a file with\
    \ that name does not exist, the function creates a new file. If the file exists,\
    \ the function deletes all existing content and places the file pointer at the\
    \ beginning of the file. |\n a | Opens a file for reading and writing. If a file\
    \ with that name does not exist, the function creates a new file. If the file\
    \ exists, the function deletes all content and places the file pointer at the\
    \ end of the file. |\n + | Opens a file for reading and writing. If a file with\
    \ that name does not exist, the function attempts to create a new file. If the\
    \ file exists, the function places the file pointer at the end of the file. |\n\
    \n# Creating a New File\n\nCompared to the first section of this chapter, this\
    \ next task is a piece of cake. The goal is to create a new, empty file in a specified\
    \ location.\n\n+   1. Open a new file in your text editor and start a PHP block:\n\
    < \n2. Create a variable to hold the full path to a file:\n$filename = \"/Documents/Settings/Owner/desktop/misc/mydata.txt\"\
    ;\n3. Create a file pointer and use the fopen() function to open the file specified\
    \ in step 3 for reading and writing. The die() function will send a message to\
    \ the screen and display it if the file fails to open properly.\n$newfile = fopen($filename,\
    \ \"w\") or die(\"Couldn't create file.\");\n4. Close the file pointer:\nfclose($newfile);\n\
    5. Create a message to print upon success, and then close your PHP block:\n$msg\
    \ = \"<p>File created!</p>\";\n6. Add this HTML:\n<HTML>\n<HEAD>\n<TITLE>Creating\
    \ a New File</TITLE>\n</HEAD>\n\n> Note This directory is one that exists on my\
    \ machine. Substitute your directory name so that this works for you!\n\n> Note\
    \ The file pointer is used to refer to the just-opened file."
