  md: '# Chapter 18: Planning Your System


    # Overview


    The first step in good application design is having a plan. Although improvisation
    along the way is sometimes a good thing, it''s best to start with a solid foundation
    and a series of goals. The next several chapters will help you create a simple
    contact-management system—basically, an online address book. In this chapter,
    you learn how to:


    +   - Define administrative tasks and create a menu

    - Modify the table-creation script sequence to account for primary keys and auto-incrementing
    fields

    - Define and create the my_contacts table'
