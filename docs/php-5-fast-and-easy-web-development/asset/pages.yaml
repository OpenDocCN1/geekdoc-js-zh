  md: "# Creating the Redirection Script and Testing It\n\nAccording to the form in\
    \ redirect_form.html, you need a script called do_redirect.php. The goal of this\
    \ script is to accept the value of $_POST[location] and print that value using\
    \ the header() function so that the user is redirected to the chosen location.\n\
    \n+   1. Open a new file in your text editor and type the following PHP to create\
    \ the proper redirection header, checking to ensure that something was selected:\n\
    \n```\n<?php\nif ($_POST[location] == \"\") {\n    header(\"Location: redirect_form.html\"\
    );\n    exit;\n} else {\n    header(\"Location: $_POST[location]\");\n    exit;\n\
    }\n?>\n```\n\n+   2. Save the file with the name do_redirect.php, and place this\
    \ in the document root of your web server.\n\n+   3. Open your web browser and\
    \ type http://127.0.0.1/redirect_form.html.\n\n+   4. Select PHP.net from the\
    \ drop-down list, and click on the Go button!\n\nUsers are now redirected to the\
    \ PHP website. Some of the other selections, or add your own for practice.\n\n\
    In this chapter, you learned about the different types of dynamic content that\
    \ can be used in a website, and some things you can do, such as redirecting users\
    \ based on a drop-down menu. In the next chapter, you learn how to utilize of\
    \ the more popular web tools—sending e-mail."
