  md: '# Escaping Your Code


    Right there with remembering to terminate your commands with semicolons is remembering
    to escape characters such as quotation marks. When you use quotation marks inside
    other quotation marks, the inner pairs must be delineated by the outside pair
    using the escape (\) character (also known as a backslash).


    The following steps show what happens when your code isn''t escaped, and how to
    fix it.


    +   1. Open a new file in your text editor.

    2. Type the following HTML:

    ```html

    <html>

    <HEAD>

    <TITLE>Trying For Another Error</TITLE>

    </HEAD>

    <body>

    ```

    3. Type the following PHP code:

    ```php

    <?

    echo "<I think this is really \cool!"</P>";

    ?>

    ```

    4. Add some more HTML so that the document is valid.

    5. Save the file with the name errorscript.php.

    6. Place this file in the document root of your web server.


    Another parse error! Take a look at the PHP code:

    ```php

    echo "<I think this is

    really \cool!"</P>";

    ```


    Because you have a set of quotation marks within another set of quotation marks,
    the inner set has to be escaped.


    +   This error also has a simple fix:

    1. Open the errorscript.php file.

    2. On line 9, escape the inner quotation marks by placing a backslash before each
    one:

    ```php

    echo "<P think this is

    really \\cool!"</P>";

    ```'
  merge: -1
