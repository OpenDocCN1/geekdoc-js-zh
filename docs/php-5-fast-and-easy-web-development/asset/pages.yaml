    | F | Month in long text (January to December) |

    | m | Month in two digits (01 to 12) |

    | n | Month in two digits without a leading zero (1 to 12) |

    | M | Month in three-letter text (Jan to Dec) |

    | Y | Year in four digits (2000) |

