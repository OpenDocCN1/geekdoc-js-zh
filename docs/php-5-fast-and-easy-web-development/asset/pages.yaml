  md: '# Simple Access Counting with MySQL


    To capture access information for specific subsections of your website, or even
    just the main page, you can create a simple database table and accompanying PHP
    code snippet.


    Using the now-familiar process of creation, first you''ll create a simple database
    table to hold all your access records.


    # Creating the Database Table


    In this example, you will log four elements: page name, page description, user
    agent, and date accessed. First, create the database table.


    +   1. Open your web browser and type http://127.0.0.1/show_creat.htmlhtmln2.
    In. Table the field, type page_ page.

    3. In the Number of Fields field, type 5.

    4. Click on the Go to Step 2 button. You should see a form with five rows, corresponding
    to the five fields you want to create in the page_track table.


    Populate the fields in these next steps:


    +   1. In the first row, type id for the Field Name, select int from the Field
    Type drop-down menu, and check the Primary Key and Auto-Increment boxes.

    2. In the second row, type page_name for the Field Name, select varchar from the
    Field Type drop-down menu, and specify a Field Length of 50.

    3. In the third row, type page_des for the Field Name and select text from the
    Field Type drop-down menu.

    4. In the fourth row, type user_agent for the Field Name and select text from
    the Field Type drop-down menu.

    5. In the fifth row, type date_added for the Field Name and select date from the
    Field Type drop-down menu.


    The completed form should look like the following figure.


    +   6. Click on the Create Table button to create the page_track table.'
