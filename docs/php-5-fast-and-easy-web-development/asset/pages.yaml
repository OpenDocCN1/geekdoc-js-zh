  md: "# Basic MySQL Reference\n\nIn this section, you'll take a brief glance at the\
    \ Structured Query Language (SQL), as well as some basic functions you can use\
    \ with MySQL to make development a bit easier. See the MySQL manual at http://www.mysql.com/\
    \ for a comprehensive list of MySQL functions and language elements, or for a\
    \ good introduction to MySQL, pick up my book \"Teach MySQL in 24 Hours.\n\nNote\
    \ Throughout this approach, anything inside brackets should be considered placeholder\
    \ text. For example, you would replace `[yourDBName]` with your actual database\
    \ name in the command.\n\nIn the sections MySQL-related functions, that that are\
    \ specific to MySQL and are not available in other databases such as Oracle, Microsoft\
    \ Server, or even SQLite (which you'll learn about in Appendix E), the basic elements\
    \ of SQL are common to all SQL-aware databases.\n\n# Creating a Database\n\nStarting\
    \ with something simple, you can use the CREATE command to create a new database.\
    \ The syntax is\n`CREATE DATABASE [yourDBName];`\n\nWhen you create a database\
    \ with this command, you're just creating a directory to hold the files that make\
    \ up tables in the database.\n\nTo delete a database from the system, use the\
    \ DROP command:\n`DROP DATABASE [yourDBName];`\n\nBe extremely careful when using\
    \ the DROP command, because once you delete the database, all of the tables are\
    \ removed as well!\n\n# Dropping a Table\n\nYou can also use the SQL CREATE command\
    \ to create a table within the current database. The syntax is\n`CREATE TABLE\
    \ [tableName] ([fieldName] [type], [fieldName2], ...) [options])`\n\nTo delete\
    \ a table from the current database, use the DROP command:\n`DROP TABLE [tableName];`\n\
    \nBe extremely careful when using the DROP command, because once you drop the\
    \ tables, they're gone!\n\n# Altering a Table\n\nThe ALTER command gives you the\
    \ opportunity to modify the elements of a particular table, such as renaming columns,\
    \ changing the type of a column, adding columns, deleting columns, and so on.\
    \ Here are some common uses:\n\n+   * To add a column to a table, use:\n  `ALTER\
    \ TABLE [tableName] ADD [newColumn] [fieldDefinition];`\n* To delete a column\
    \ from a table, use this:\n  `ALTER TABLE [tableName] DROP [columnName];`\n* To\
    \ change a column from one to another, use this:\n  `ALTER TABLE [tableName] CHANGE\
    \ [columnName] [newDefinition]`\n* To make a unique column in your table, use\
    \ this:\n  `ALTER TABLE [tableName] ADD UNIQUE [columnName] ([columnName]);`\n\
    * To index a column in your table, use this:\n  `ALTER TABLE [tableName] ADD INDEX\
    \ [columnName] ([columnName]);`\n\nUsing the ALTER command alleviates the need\
    \ to delete an entire table and re-create it just because you spelled a field\
    \ name incorrectly or made some other mistake."
  merge: -1
