- img_proc: true
  md: '# What is XML?


    The XML names comes from the full name of the language, Extensible Markup Language.
    Although "markup" is in its other, do not think of XML like you do HTML. Aside
    from the fact that both languages are based on tag pairs, there are no similarities.
    XML is a method of data exchange, in that it holds well-defined content within
    its boundaries. HTML, on the other hand, is less concerned with what is contained
    or how it is structured-its only purpose is to display the content to the browser.
    XML is used to define and carry the content, whereas HTML is used to make "".


    This is not to say XML data cannot be made pretty, or that you cannot display
    XML data in your web browser. In fact, this is exactly what you do when using
    Cascading Style Sheets (CSS) to render your content in a format your web browser
    can understand, while still preserving the content categorization. For example,
    you may have an example on your website for recent system measures, and those
    items each contain the following:


    +   * Title

    * Message

    * Author

    * Date of message


    You might want to display the title in the block, the author''s name in italics,
    and the date in a small font. For this, you might use HTML, on the other hand,
    only cares that there are four distinct elements. By separating the data and its
    structure from the presentation elements, you can control however you you want,
    and you''re not limited to the particular marked-up style that HTML has forced
    on.


    # Basic XML Document Structure


    Before moving forward with XML documents, you need to know exactly how to create
    them XML documents contain two major elements, the *prolog* and the *body*. The
    prolog contains the XML declaration (like an HTML document type definition), and
    any processing instructions which you want to add.


    > Note For a complete definition of XML documents, read the XML specification
    at http://www.w3.org/TR/REC-xml/


    Using the system measures example from the previous section, open a text editor
    and create a file *messages.xml*.nType the following:


    ```

    <xml version="1.0"?>

    <!--Sample XML document -->

    ```


    Next, by the following in the area of the document, where the content structure
    is contained. XML is hierarchical, like a book—books have titles and chapters,
    each which contains paragraphs, and so forth. There is only one root element in
    an XML document. Using the body element, the element might be called *Book*, and
    the tags *<Book></Book>* to surround all other information.


    By using the system measures example here, you can call the element *SystemMessage*,
    and add an open tag to your *messages.xml* document:

    <SystemMessage>


    Next, add any subsequent elements—children—to the root. Using the system measures
    example, you need to title, author, and date information. The child elements *MessageTitle*,
    *MessageAuthor*, and *MessageBody*—But what if you need both the name and an email-address
    for the author? Not a problem—you can create another set of child elements within
    the child element of the root. For example, use the `<MessageAuthor>` element
    to look like this:


    ```

    <MessageAuthor>

    <AuthorName>Joe Smith</MessageAuthorName>

    <AuthorEmail>joes@example.com</MessageAuthorEmail>

    </MessageAuthor>

    ```


    All together, your *messages.xml* document could look something like this:


    ```

    <xml version="1.0"?>

    <!--Sample XML document -->

    <SystemMessage>

    <MessageTitle>Down for Maintenance</MessageTitle>

    <MessageBody>Going down maintenance soon!</MessageBody>

    ```'
  merge: -1
  pgno: 338
