  md: '# A Simple Feedback Form


    A simple feedback form contains fields for the respondent''s name and e-mail address,
    and a text area for some of message. In this section, you create two files: one
    for the feedback, and one for the PHP script to process the form, send, and return
    a response to the browser.


    # Creating the Feedback Form


    In this section, you create the first half of the form/script combo--the feedback
    form itself, often referred to as the front-end form.


    +   1. Open a new file in your text editor.


    +   2. Type the following HTML:

    ```html

    <HTML>

    <HEAD>

    <TITLE>Simple Feedback Form</TITLE>

    </HEAD>

    <BODY>

    ```


    +   3. Begin your form. Assume the method is POST and the action is a script called

    ```html

    <FORM METHOD="POST" ACTION="send_simpleform.php">

    ```


    +   4. Create an input field for the user''s name with a text label:

    ```html

    <P>Your Name:</p><br>

    <INPUT type="text" NAME="name" SIZE=30></P>

    ```


    +   5. Create an input field for the user''s e-mail address with a text label:

    ```html

    <P>Your E-Mail Address:</p><br>

    <INPUT type="text" NAME="sender_email" SIZE=30></P>

    ```


    +   6. Create a text area to hold the message with a text label:

    ```html

    <P>Message:</p><br>

    <TEXTAREA NAME="message" COLS=30 ROWS=5 WRAP=virtual</TEXTAREA>

    ```


    +   7. Add a submit button:

    ```html

    <P><INPUT TYPE="submit" NAME="submit" VALUE="Send This Form\></P>

    ```


    +   8. Close your form and add some more HTML so that the document is valid:

    ```html

    </FORM>

    </BODY>

    </HTML>

    ```


    +   9. Save the file with the name simple_form.html, and place this file in the
    document root of your web server.


    +   10. Open your browser and view that http://127.0.0.1/simple_form.html.'
