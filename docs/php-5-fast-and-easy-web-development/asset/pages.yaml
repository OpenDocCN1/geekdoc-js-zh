  md: '# Appendix E: Using SQLite


    # Overview


    In Appendix "Database Normalization and SQL Reference," you learned the importance
    of a normalized database potential problems with the flat file. There are many
    instances in which your PHP applications might only need a single database table,
    and there''s nothing wrong with. For instance, suppose you''re archiving the content
    of simple contact forms set through your database, as a backup in the e-mailed
    versions never arrive. This simple table might have fields for name, e-mail address,
    comments, and date sent—no real need to normalize!


    If you find yourself in a development situation without a database and some mandate
    that you must not install one, PHP 5 introduces another option into the mix—the
    capability to utilize SQLite, which is a flat file database with an SQL-based
    interface.


    Note SQLite is enabled by default in PHP 5. For detailed information beyond what''s
    covered in this appendix, please visit the SQLite website at http://www.php.net/sqlite/
    or search the PHP manual section for SQLite at


    To use SQLite, you must still have a fundamental understanding of how databases,
    tables, and fields all work together, and SQL syntax matters. Everything you have
    learned in this book is still viable with regards to the process of connecting
    to a database, issuing queries, and obtaining results—except that the MySQL-specific
    functions has its own set of functions that you use to perform the same types
    of tasks'
  merge: -1
