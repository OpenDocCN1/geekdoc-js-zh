  md: '# Chapter 1: Installing and Configuring MySQL


    MySQL is the database of choice for a vast majority of web developers who use
    PHP because of its efficiency and ease of use. MySQL is free, runs on multiple
    platforms, and its documentation is super. When using MySQL with PHP, it''s essential
    to install MySQL first, because during the PHP installation and configuration
    process, you must tell the PHP configuration script that you plan to use MySQL
    in order to activate the MySQL-specific functions. As such, it''s best to make
    sure that MySQL is present on your system, in case there are any library mismatch
    issues that would cause PHP to fall in its compilation. In this chapter, you learn
    how to:


    +   - Install MySQL on Windows or Linux

    - Create a sample database

    - Create a sample table'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Various MySQL Distributions


    The most popular distribution of MySQL is the open source from MySQL AB. However,
    there are commercial versions of MySQL, as well as distributions of MySQL bundled
    with application server software. No matter which option you choose, a solution
    is available for all platforms—Unix-like operating system, as well as on Windows
    95/98/NT/2000/XP/2003. This chapter assumes you are using the MySQL installation
    files from your website.


    If you are using MySQL as a part of a web-hosting package through an Internet
    service provider, you don''t have to worry about downloading and installing the
    application in this chapter. Instead, you will need to work with your ISP for
    your username and password. In most cases, use the MySQL distribution from MySQL
    AB. There''s no harm in setting up MySQL on a development machine. To that end,
    if you have a workstation that fits bill, just to better understand the process.
    If you have a Linux workstation or server, MySQL was likely included on your OS
    distribution as an installation option. In that case, you should check the MySQL
    website to compare the version numbers, and download a newer version if one is
    available.


    The installation instructions in this chapter are based on the MySQL version 4.0.x,
    distributed by MySQL AB.


    +   * Note If you are using MySQL at your ISP and they are still using a 3.23.x
    version, don''t worry—you will be able to use all of the database-related examples
    in this book.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Team LiD


    # Installing MySQL on Windows


    The MySQL installation process on Windows 95/98/NT/2000/2003 is based on an executable
    program provided by MySQL AB. Once you download the zip file, all you have to
    do is extract its contents into a temporary directory and run the setup exe. After
    the `setup.exe` application installs the MySQL server and client programs, you
    are ready to start the MySQL server.


    +   1. Visit the MySQL 4.0 download page, at http://www.mysql.com/downloads/ and
    find the Windows section on the page. There are two options: you the one that
    doesn''t say "without installer". Otherwise you get the installer, but it is not
    explicitly named as such.

    2. Clicking the Download link will lead you to a page of mirrors. Select the mirror
    closest to you, and click on either the HTTP or FTP link to download the file.
    Using the HTTP method is usually quicker.

    3. Once the zip file is on your hard drive, extract its contents to a temporary
    directory.

    4. From the temporary directory, find the setup.exe file and double-click to start
    the installation. You will see the first screen of the installation wizard, as
    shown in the following figure. Click Next to continue.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_17_0.png)


    +   5. The second screen in the installation process contains valuable information
    regarding the installation location. The default installation location is C:\MySQL,
    but if you want to install MySQL in a different location, this screen shows you
    changes that you will have to make on your own. This screen is also important
    for Windows NT users who want to start MySQL as a service. Read the information
    and note anything relevant to your situation, and click Next to continue.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_17_1.png)'
  merge: -1
  pgno: 17
- img_proc: true
  md: '6. With the third screen in the installation process, you select the installation
    location. If you want to install MySQL in the default location, click Next to
    continue. Otherwise, click Browse and navigate to the location of your choice,
    and then click Next to continue.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_18_0.png)


    7. The fourth screen has you select the installation method—Typical, Compact,
    or Custom. Select Typical, Select Next to continue.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_18_1.png)


    8. The installation process now takes over and installs files in their proper
    locations. When the process is finished, you will see a confirmation of completion.
    Click Finish to complete the setup process.'
