  md: '# Getting Variables From Forms


    HTML forms contain at least the following elements:


    +   - A method

    - An action

    - A submit button


    In your HTML code, the first line of a form looks like this:

    `<FORM METHOD="post" ACTION="yourscript.php">`


    When you click a submit button in an HTML form, variables are sent to the script
    specified by the `ACTION` via the specified `METHOD`. The method can be `POST`
    or `GET`. Passed from a form to a PHP script are placed in the superglobal `$_POST`
    or `$_GET`, depending on the method used. The [next section](#) you see how this
    works, by creating an HTML form and PHP script that performs calculations depending
    on the input.


    # Creating a Calculation Form


    In this section, you''ll create the front end to a calculation script. This form
    will contain two input fields and a radio button to select the calculation type.


    +   1. Open a new file in your text editor.

    2. Type the following HTML:

    ```html

    <html>

    <head>

    <title>Calculation Form</title>

    </head>

    <body>

    ```

    3. Begin your form. Assume that the method is `POST` and the action is a script
    called `calculate.php`

    ```html

    <FORM METHOD="post" ACTION="calculate.php">

    ```

    4. Create an input field for the first value, with a text label:

    `<p>Value 1: <input TYPE="text" NAME="val1" SIZE=10\></p>`

    5. Create an input field for the second value, with a text label:

    `<p>Value 2: <input TYPE="text" NAME="val2" SIZE=10\></p>`

    6. Add a submit button:

    `<p><input TYPE="submit" NAME="submit" VALUE="Calculate"></p>`

    7. Close your form and add more HTML so that the document is valid:

    ```html

    </form>

    </body>

    </html>

    ```

    8. Save the file with the name `calculate_form.html`, and place this file in the
    document root of your web server.

    9. Open your web browser and type `http://127.0.0.1/calculate_form.html`.'
