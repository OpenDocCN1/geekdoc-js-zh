  md: '# # Redirecting to a New Location


    Redirecting a header to a new location means your script sends an HTTP header
    to the browser, indicating a new location. Headers of any kind (authentication,
    redirection, cookies, and so on) must be sent to the browser before anything else,
    including white space, line breaks, and any characters.


    After you''ve already used the header() function to redirect the user in an incomplete
    form, in the next section you create a specific redirect. The goal is to have
    the users select a location from a drop-down menu and then the script automatically
    sends them there.


    # ## Creating a Redirect Form


    In this section, you''ll create the front end to a redirection script. This form
    will contain a drop-down list of the names of various websites. The value for
    each option is the website''s URL


    +   1. Open a file in your text editor and type the following HTML:

    ```html

    HTML>

    <HEAD>

    <TITLE>Redirection Menu</TITLE>

    </HEAD>

    <BODY>

    ```


    +   2. Begin your form. Assume that the method is POST and the action is a script
    called do_redirect.php:

    ```htmln<FORM METHOD="post" ACTION="do_redirect.php">

    ```


    +   3. Add this drop-down list:

    ```htmln<P>Send me to:</P>

    <SELECT name="location">

    <OPTION value="-- Select One --"></OPTION>

    <OPTION value="http://www.thickbook.com">thickbook.com</OPTION>

    <OPTION value="http://www.i2i.com/i2i Interactive/"></OPTION>

    <OPTION value="http://www.php.net/">PHP.net</OPTION>

    <OPTION value="http://www.zend.com/">Zend Technologies</OPTION>

    </SELECT>

    ```


    +   4. Add a submit button:

    ```htmln<P><INPUT TYPE="submit" NAME="submit" VALUE="Go!"></P>

    ```


    +   5. Close your form, and add some more HTML so that the document is valid:

    ```htmln</FORM>

    </BODY>

    </HTML>

    ```


    +   6. Save the file with the name redirect_form.html, and place this file in
    the document root of your web server.


    +   7. Open your browser and type http://127.0.0.1/redirect_form.html.


    In the next section, you create the back-end script. That script will create one
    variable: $_POST[location].'
