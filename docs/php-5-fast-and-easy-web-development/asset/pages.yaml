  md: '# Working with String Functions


    Numerous string functions are built into PHP, all of which are designed to make
    your life easier. Suppose you have to normalize strings for news headlines or
    product IDs, or calculate the length of a string before trying to stuff it into
    a database field. Those are just a few of the functions you will learn about in
    the next section. For more functions, take a look at the PHP manual at http://www.php.net/strings.
    The function list grows as more people contribute to the language.


    # Creating an Input Form


    In this section, you will create the front end to a string modification form.
    This form will contain one text area and several radio buttons. The radio buttons
    will use the function you define.


    +   1. Open a new file in your text editor and use the following HTML:


    ```

    <html>

    <head>

    <title>Generic Input Form</title>

    </head>

    <body>

    ```


    +   2. Begin your form. Assume that the method is POST and the action is called

    display_input.php:


    ```

    <form method="post" action="display_input.php">

    ```


    +   3. Create a text area with a label:


    ```

    <p>Text Field:</p><br>

    <textarea name="text" cols="45" rows="5" virtual></textarea></p>

    ```


    +   4. Add some radio buttons:


    ```

    <p>String function:</p><br>

    <input type="radio" name="func" value="strlen" get length of string<br>

    <input type="radio" name="func" value="strrev" reverse the string<br>

    <input type="radio" name="func" value="strtoupper" make string uppercase<br>

    <input type="radio" name="func" value="strtolower" make string lowercase<br>

    <input type="radio" name="func" value="ucwords" make first letter of all words
    uppercase</p>

    ```


    > Note The value for each radio button is its exact PHP function name. This will
    make the backend-script simple to write, as you''ll see in the next section.


    +   5. Add a submit button:


    ```

    <input type="submit" name="submit" value="Do Something with the String"</p>

    ```


    +   6. Close your form and add some more HTML so the document is valid:


    ```

    </form>

    </body>

    </html>

    ```


    +   7. Save the file with the name generic_form.html, and place this file in the
    document root of your server.


    +   8. Open your browser and use http://127.0.0.1/generic_form.html.'
