    # HTTP Functions


    The built-in functions for sending specific HTTP headers and cookie data are crucial
    aspects of developing web-based applications in PHP. Lucky, the syntax for these
    functions is quite easy to understand and implement.


    ```

    header()

    ```


    The `header()` function outputs an HTTP string, as a location redirection. This
    output must occur before any other data is sent to the server, including HTML
    tags.


    +   **Tip** This information bears warning: Do not attempt to send anything to
    your server before sending the `header()`. You can perform any sort of database
    manipulations or calculations before the `header()`, but you cannot print anything
    to the screen-until a new character.


    For example, use the `header()` function to redirect a user to a new location,
    use this code:

    header("Location:http://www.location.com");

    exit();


    +   **Tip** Follow a `header()` statement with the `exit` command. This ensures
    that the code does not continue to execute.


    ```

    setcookie()

    ```


    The `setcookie()` function sends a cookie to the user. Cookies must be sent before
    any other header information is sent to the web browser. The syntax for `setcookie("name","expire","path","domain","secure");`


    For example, use the following code to send a cookie called `username` with a
    value of `joe` that is valid for one hour within all directories of the `testcompany.com`
    domain:

    setcookie("username","joe",time()+3600,"/","testcompany.com");`


