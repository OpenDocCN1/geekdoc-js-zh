  md: "# Using Cookie Variables\n\nThere's an element to cookies that most people\
    \ forget about until they spend a few hours debugging something that isn't even\
    \ wrong (I've done this). When a web browser accepts a cookie, you can extract\
    \ its value until the next HTTP request is made.\n\nIn other words, if you set\
    \ a cookie name with a value of Julie on page 1, you can't extract that value\
    \ until the user reaches page 2 (or page 5 or page 28)—some page that isn't the\
    \ page on which the cookie is initially set).\n\n# Using Cookies with Authentication\n\
    \nIn the authentication script from the previous chapter you had a form and a\
    \ result page. However, the authentication was valid only for the result page\
    \ because you displayed the secret content (in this case, a Congratulations! message).\
    \ If you require authentication for a series of static pages, you will need to\
    \ make some minor adjustments.\n\n+   1. Open autouser.php in your text editor.\n\
    \n+   2. Scroll down to the block that handles the result of the authentication.\
    \ Add a block that sets a cookie:\n\n```\nif ($num != 0) {\n    $cookie_name =\
    \ \"auth\";\n    $cookie_value = \"ok\";\n    $cookie_expire = \"+1\";\n    $cookie_domain\
    \ = \"127.0.0.1\";\n    setcookie($cookie_name, $cookie_value, $cookie_expire,\n\
    \    \"/\", $cookie_domain, 0);\n}\n```\n\n> Note The setcookie function will\
    \ send a cookie auth with a value of ok. It will expire at the end of the browser\
    \ and will be valid for all directions on 127.0.0.1 unless you specify domain\
    \ name otherwise.\n\n+   3. Delete this line:\n$msg = \"<Congratulations, you're\
    \ authorized!</p>\";\n\n+   4. Add this string:\n$display_block = \"\n<p>Secret\
    \ Menu: <strong>Secret Menu</strong></p>\n<ul>\n<li><a href=\"=\"secretA.php\"\
    >secret page A</a></li>\n<li><a href=\"secretB.php\">secret page B</a></li>\n\
    </ul>\">\n\n> Note Don't worry; you'll see the cookie in this menu soon enough.\n\
    \n+   5. Scroll until you see the following code:\necho \"$msg\"; ?>\n\n+   6.\
    \ Replace it with:\necho \"$display_block\"; ??>\n\n+   7. Save the file.\n\n\
