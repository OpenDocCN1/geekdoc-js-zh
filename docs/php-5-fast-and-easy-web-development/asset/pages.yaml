  md: 'Like the exec() function, the passthru() function executes an external program.
    The difference between the two is that passthru() returns the raw output of the
    action. The syntax of passthru() is

    passthru(command, return_var);


    If return_var is specified, it will be assigned a value of the program''s status.


    # system()


    The system() function executes an external program and displays output as the
    command is being executed. Its syntax is

    system(command, [return_var]);


    If return_var is specified, it will be assigned a value of the program''s status.


    For example, you would use the following code to perform a ping of five times
    and return the output:

    $command = "ping -c5 www.thickbook.com";nsystem($command);


    # Regular Expression Functions


    # ereg_replace() and eregi_replace()


    The ere_replace() function replaces instances of a pattern within a string and
    returns the new string. The ere_replace() function performs a case-sensitive match,
    and eregi_replace() performs a case-insensitive match. Its syntax is for both:

    ereg_replace(pattern, replacement, string);

    eregi_replace(pattern, replacement, string);


    For example, you would use the following code to replace "ASP" with "PHP" in the
    string "I really programming in ASP!"

    $old_string = "I really programming in ASP!"

    $new_string = eregi_replace("ASP", "PHP", $old_string);

    echo($new_string);


    If "ASP" is mixed case, as "asp", use the eregi_replace() function:

    $old_string = "I really programming in ASP!"

    $new_string = eregi_replace("ASP", "PHP", $old_string);

    echo($new_string);


    # split()


    The split() function splits a string into an array using a separator (comma, colon,
    semicolon; and on). Its syntax is

    split(pattern, [limit]);


    The limit is optional. If a limit is specified, the split() function stops at
    the named position-for example, at the comma-delimited list.


    # Session-Handling Functions


    Session handling is a way of holding on to a user as they navigates your website.
    Data can be variables or objects. These simple functions are just a few of the
    session-related functions in PHP; see the PHP manual at http://www.php.net/manual
    for more.


    # session_start()


    The session_start() function starts a session if one has not already started,
    or resumes it if the session ID is present for the user. This function takes no
    arguments and is called simply by placing the following in your code:

    session_start();


    # session_destroy()


    The session_destroy() function effectively destroys all the variables and values
    registered for the current session. This function takes no arguments and is called
    simply by placing the following in your code:

    session_destroy();'
