  md: '# Chapter 25: Working with XML


    # Overview


    This chapter will give you a hands-on introduction to using XML and PHP, but in
    no way should this be considered a definitive guide to the subject Use this chapter
    as a primer for a subject you might decide to explore further on your own. In
    PHP 5, all things XML-related have been completely rewritten, so that the functionality,
    efficiency, and overall integration is much more reliable and full-featured. In
    this chapter, you learn how to:


    +   - Create a basic XML document structure

    - Use XML with PHP

    - Parse and display content from XML files'
  merge: -1
