  md: '# Saving the Values if You Make an Error


    One thing you probably noticed in the original script is that if you made an error,
    the form was reset and you lost the values you had. A simple modification to the
    original sform_block will take care of that problem. Just add a VALUE attribute
    to the form field to hold any previous value for the given variable.


    +   1. Open allinone.php in your editor.


    +   2. Inside the $sform_block variable, modify the input field for Your Name:

    <INPUT type="text" NAME="sender_name" SIZE=30></p>


    +   3. Modify the input field for Your E-Mail Address:

    <INPUT type="text" NAME="sender_email" VALUE="$_POST[sender_email]" SIZE=30></p>


    +   4. Modify the text area for Message:

    <TEXTAREA NAME="message" COLS=30 ROWS=5 WRAP=virtual>\$\_POST[message]</TEXTAREA></p>",n

    Note: There''s no value for TEXTAREA. Instead, the value goes between the start
    and end tags.


    +   5. Save the file, then open your web browser and type http://127.0.0.1/allinone_form.php.


    +   6. Type your name in the Name field, and submit the form.


    The form, complete with error messages, will appear. This time, though, your name
    has been saved!


    Repeat the process for the other fields in the form to verify that the values
    were saved. You''ve just mastered another aspect of dynamic content, this time
    in relation to displaying error messages when users don''t perform the proper
    tasks, such as completing all of the fields in a form.


    Whereas this chapter was all about forms and sending, the next chapter is all
    about working with elements of your file system, such as files and directories.


