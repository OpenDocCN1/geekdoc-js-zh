  md: '# # Using the SHOW Command


    There are several types of SHOW commands, which will produce output to help you
    administer your MySQL database. The usual method for executing these commands
    is through the MySQL Monitor, the command-line interface to MySQL, which you used
    in Chapter 1. "Installing and Configuring MySQL.



    The basic SHOW commands are SHOW DATABASES and SHOW TABLES, which simply display
    the names of the databases and tables on your server. If you use the CREATE TABLE
    command, it shows the exact SQL statement used to create the specified table.


    If you need to know the structure of the table but not necessarily need the SQL
    command to create it, you can use the



    ```

    mysql> SHOW COLUMNS FROM [testTable];

    ```


    | Field | Type | Null | Key | Default | Extra |

    | --- | --- | --- | --- | --- | --- |

    | id | int(11) | | PRI | | auto_increment |

    | textField | varchar(75) | NO | | NULL | |

    | 2 rows in net (0.00 sec) | | | | |


    For administrative purposes, the SHOW STATUS and SHOW VARIABLES quickly provide
    important information about your database server. For information on the numerous
    rows of output from these commands, please read the relevant sections of the MySQL
    manual, found at http://www.mysql.com/doc.'
