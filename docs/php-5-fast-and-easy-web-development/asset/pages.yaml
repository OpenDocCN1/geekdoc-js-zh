    # Local and Global Variables


    Variables can be local or global, the difference having to do with their definition
    and use by the programmer, and they appear in the content of the scripts you are
    creating. The variables described in the previous section, and for the majority
    of this book, are local.


    When you write PHP scripts that use variables, those variables can be used only
    by the script in which they are defined. Scripts cannot easily reach inside other
    scripts or the variables you created and defined—unless you say that and you personally
    link them. When you do that, such as when you create your own functions (blocks
    of code that perform a particular task), you will define the shared variables
    as global. That is, you will define them able to be accessed by other scripts
    and functions, needed.


    You can learn creating your own functions, and using global as well as local variables,
    in Appendix C. "Writing Your Own Functions and Objects." For now, just understand
    that there are two variable scopes—local and global—that come into play as you
    write more advanced scripts.


    # Pre-Defined Variables


    In all PHP scripts, a set of pre-defined variables is available to you. You might
    have seen some of these variables in the'
