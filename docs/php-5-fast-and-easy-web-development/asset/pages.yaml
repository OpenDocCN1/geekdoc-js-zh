  md: '# Preparing to Use XML with PHP


    XML functionality in PHP is based on the libxml2 library, and it''s enabled by
    default at the time of PHP configuration and installation—on both Linux/Unix and
    Windows platforms.


    You can determine whether XML support is enabled in your installation of PHP by
    looking at the output of the phpinfo() function. The following figure shows some
    of the XML-related entries you will see in an XML-enabled installation.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_341_0.png)


    **Note** You will not see these items listed in this order in your phpinfo() output,
    as there will be several entries in between, in the alphabetical display of enabled
    elements.


    Once you have confirmed that XML support is enabled within PHP, you can move on
    to parsing, transforming, and even generating XML on your system. All of the examples
    used in this chapter are very basic, and again, I recommend reading additional
    books or entries in the PHP manual (http://www.php.net/manual/) if you''re interested
    in working with XML to any great extent.'
  merge: -1
  pgno: 341
