  md: '# Why PHP 5?


    It''s natural that languages continue to develop, and PHP 5 has just that—its
    changes represent the next step in the growth and development of the language.
    There was nothing fundamentally wrong with PHP 4, and in fact the majority of
    this book can be used on servers running PHP 4 and not PHP 5. The changes in PHP
    5 revolve around highly-specific aspects of the language, namely the object model.


    If you are coming from other programming languages, PHP 5 is highly structured,
    specifically object-oriented language, the crossover to a flexible, readable language
    that just happens to handle object-oriented programming by default. But, the ease
    of use is one of the reasons why many programmers are drawn to PHP in the first
    place—the learning curve isn''t steep, and it just gets them to interface with
    Java.


    However, this presents a problem for PHP users who are coming from an object-oriented
    setting. Some people might think PHP 5 is not suitable for enterprise-level application
    development, because it is not time-structured, object-oriented programming. There
    might not be the time or opportunity for a developer to conquer this by showing
    examples of C and Java to perform the same tasks—if even can, with the same level
    of structure, security, reliability, and exception-handling.


    But users—like the primary audience of this book—will not find page objects, classes,
    NET, or XML-integration their first day on the job. Some users want fast, flexible
    language that they can use to create dynamic websites, and PHP 5 still needs that.
    Although PHP 5 has an enhanced internal scripting engine and a vastly improved
    object-oriented framework, the PHP Group and Zend Technologies acknowledge the
    roots of PHP and the large group of users who have made it pervasive. As with
    PHP 4, PHP 5 does not force you to use the elements of the language you do not.


    # Overview of changes in PHP 5


    Because this book does not show details in programming from an object-oriented
    point of view, this will not go into detail and show examples of the object model
    in PHP 5. For that, I highly recommend Harry Funk''s article "PHP 5: Coming to
    a Newserver Year," at http://www.sitepoint.com/article/192/ This article contains
    an outstanding of the object-oriented changes in PHP 5, and how to implement them.


    at a few major features are not a replacement for a robust database like MySQL,
    PostgreSQL or Oracle. Instead, this speedy little to store database files in both
    files and memory would be good for something like storing session data and application
    configuration—INSERT and SELECT OBJECTS. While some folks would use MySQL as their
    database of choice, you can learn more about SQL.


    Another change is the XML parser. PHP 4 used several third-party libraries to
    control XML parsing and rendering, since there was no stable and reliable XML
    rendering parsing mechanism. PHP 5 provides one XML library, libxml, for the DOM
    extension. This library is very fast and full-featured, and thus a solid foundation
    on which to build the XML functionality. You will learn more about working with
    XML in PHP 5 in Chapter 25 ("Working with XML":


    Backwards Compatibility with PHP 4 may change when a new implementation causes
    problems in previous versions, so at least read the change log notes for your
    favorite functions. However, the majority of PHP 5 focuses on additional functionality
    rather than replacing existing elements. If you have learned using PHP 4, you
    might find that none of your scripts require a rewrite


    Rewiring and rewriting the scripts for using new functionality are completely
    different—you might want to rewrite them to take advantage of new object-oriented
    functionality, but you might not have to. If your code is primarily procedural
    (as with the scripts in this book), there''s a better than 95% chance that no
    rewrites will be necessary


    Similarly, if you cannot install PHP on your own machine for development purposes,
    as outlined in Chapter 3 ("Installing PHP," and must use PHP 4, do not fret. Anything
    in this book about PHP 4 is indicated as such.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# Team LiD


    # Is PHP Right for You?


    Only you can decide if PHP should be your language of choice, whether you''re
    developing sites for personal or commercial use on a small or large scale. I can
    tell you that in the commercial realm, I''ve worked with all the popular server-side
    scripting languages—Active Server Pages (ASP), ColdFusion, JavaServer Pages (JSP),
    Perl, and PHP—on numerous platforms and various web servers, with varying degrees
    of success. PHP is the right choice for me: it''s flexible, fast, and simple in
    its requirements, yet powerful in its output.


    Before deciding whether to use PHP in a large-scale or commercial environment,
    consider your answers to these questions:


    +   - Can you say with absolute certainty that you will always use the same web
    server hardware and software? If not, look for something cross-platform that is
    available for all types of web servers: PHP.

    - Will you always have the exact development team comprised entirely of ASP (or
    Java Server Pages or ColdFusion) developers? Or will you whoever is available,
    thus necessitating a language that is easy to learn and syntactically similar
    to C# and Perl? If you have reason to believe that your ASP or JSP or ColdFusion
    developers might drop off the face of the earth, don''t use those tools—use PHP.

    - Are memory and server load an issue? If so, don''t use bloated third-party software
    that leaks precious memory—use PHP.


    Here''s the bottom line: PHP is simple, so just try it! If you like it, continue
    using it.


    It''s Open Source, so help improve it. Join a mailing list and help others. If
    you don''t like it, you''re only out the money for this book, and the software
    can be uninstalled without rendering your machine completelyoperable.


    # Team LiD'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Who Should Read this Book?


    This book is designed for individuals who possess a general understanding of the
    concepts of working in a Web-based development environment, be it Linux/Unix or
    Windows. Installation and configuration related chapters assume that you have
    familiarity with your operating system and the basic methods of building (on Linux/Unix
    systems) or installing (on Windows systems) software.


    Chapters discussing how to program with PHP which make up the bulk of the book,
    assume no previous knowledge of the languages. However, if you have experience
    with other programming languages such as C or Perl, you will find these lessons
    to be quite simple. Similarly, if you have worked with other databases such as
    Orade or Microsoft SQL Server, you will have a good foundation for working through
    the MySQL-related chapters.


    The only real requirement before reading this book is that you understand static
    web content creation with HTML. If you are just starting out in the world of web
    development, you will still be able to use this book, but you should consider
    working through an HTML tutorial first. If you are comfortable creating basic
    documents and uploading them to your web server, you will be fine.'
  merge: -1
