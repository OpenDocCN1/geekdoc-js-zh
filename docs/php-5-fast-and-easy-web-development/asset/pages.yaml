  md: '# Team LiD


    # Appendix F: Getting Help


    One of the greatest aspects of the open source community is that people are eager
    to help you learn as much as they can, so that you can become an advocate as well.
    However, you should probably attempt to find answers to your questions before
    posing them to the community at large. This includes reading available manuals
    and FAQs, searching through mailing lists and visiting websites. Chances are good
    that someone else has the same question you have.


    The website for this book, and other books I have written, is, http://www.phpbook.com/.
    You will find ebook, downloadable content for books, recommendations for books
    and other items, and anything else I think up in my space. The book will help
    you identify if your troubles are due to an error during printing, or if you should
    re-read the content of the section and try again.


    # PHP Resources


    PHP-related websites, newsgroups, and mailing lists are abundant, and the ones
    listed here are just a smattering of what''s available.


    # Websites


    The majority of these sites are maintained by normal people on their own time,
    so if you use any of their resources, to give back to the community by helping
    others when you can, contributing snippets to repositories, and so.


    # www.php.net


    The home of PHP is http://www.php.net. The annotated online manual is here, as
    well as the PHP FAQs, bug reports, links to ISPs to offer access to PHP, news
    articles, and more!


    # www.zend.com


    Zend Technologies, the folks behind the Zend engine of PHP, have created a portal
    site for PHP developers. This personalized site not only showcases how you can
    build a high-traffic, dynamic site using PHP, but it also provides pointers, resources,
    and lessons on how to maximize the potential of PHP in all your applications.


    # DevShed (www.devdshed.com)


    This site contains many user-submitted tutorials, news articles, interviews, and
    competitive analyses of server-side programming languages. Covers PHP as well
    as many other topics of interest to developers, such as servers and databases.


    # PHPBuilder (www.phpbuilder.com)


    This is a very good site for intermediate and advanced PHP developers. It contains
    How Columns for real-world applications, such as "Building Dynamic Pages with
    Search Engines in," and "Generating Pronounce Passwords."


    # WeberDev (www.weberdev.com)


    A longtime of PHP developers contains development techniques and tips for many
    programming languages (just to be), as well as a content-management system for
    everyone to add their own code snippets, tutorials, and moment it is a great weekly
    newsletter and high traffic!


    # px.sklar.com


    This is a bones-only code repository, by who needs great when you''re looking
    for code snippets Borrowing from the "take a leave a penalty" mentality, you get
    a code snippet to start with and then add your own when you feel confident in
    sharing


    # Webmonkey (hotwired.lycos.com/webmonkey/)


    The company that brings us Wired magazine also brings us HotWired, which spawned
    Webmonkey, a developer''s resource site with a section devoted to PHP. Don''t
    limit yourself to there much'
