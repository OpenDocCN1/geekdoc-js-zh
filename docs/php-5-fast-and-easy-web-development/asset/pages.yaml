  md: "# Creating the Authentication Script\n\nThe goal of this script is to match\
    \ the username and password entered in the form with a username and password (in\
    \ the same record) in the `auth_users` table.\n\n+   1. Open a new file in your\
    \ text editor and start a PHP block:\n<?\n\n+   2. Check that the values were\
    \ actually entered for both. If they weren't, direct the user back to the form\
    \ and exit the script:\n```php\nif (!$_POST[username]) || (!$_POST[password]))\
    \ {\n    header(\"Location: show_login.html\");\n    exit;\n}\n```\n\n+   3. Create\
    \ a variable to hold the name of the database on which the table resides:\n$db_name\
    \ = \"testDB\";\n\n+   4. Create a variable to hold the name of the table you're\
    \ populating with this script:\n$table_name = \"auth_users\";\n\n+   5. Add the\
    \ connection information as you have:\n$connection = @mysql_connect(\"localhost\"\
    , \"spike\", \"sj7En4\") or die(mysql_error());\n\n+   6. Select the database\
    \ you have learned:\n$db = @mysql_select_db($db, $connection) or die(mysql_error());\n\
    \n+   7. Create the SQL statement. The statement is looking for all fields in\
    \ a record where the username in the table matches the username entered in the\
    \ form, and the password in the table matches a hash of the password entered in\
    \ the form:\n```sql\n$sql = \"SELECT * FROM $table_name WHERE username = '$_POST[username]'\
    \ AND password = md5($_POST[password])'\";\n```\n\n+   8. Create a variable to\
    \ hold the result of the `mysql_query()` function, as you have:\n$result = @mysql_query($sql,\
    \ $connection) or die(mysql_error());\n\n+   9. Check for any results by querying\
    \ the count of number of rows returned in the result set:\n$num = mysql_rows($result);\n\
    \n+   10. Start an if..else block to deal with your result. If the number of returned\
    \ rows is more than 1, a match is found. Create a variable to hold an appropriate\
    \ message:\nif ($num != 0) {\n    $msg = \"<p>Congratulations, you are authorized!</p>\"\
    ;\n\n+   11. If the number of returned rows is 0, no matches are found. In case,\
    \ direct the user back to the login form, and then close the if..else block:\n\
    else {\n    header(\"Location: show_login.html\");\n    exit;\n}\n\n+   12. Close\
    \ your PHP block and add HTML:\n?>\n<HTML>\n<HEAD>\n<TITLE>Secret Area</TITLE>\n\
