  md: '# What''s an Operator?


    In the previous section, you used an assignment operator (=) to assign values
    to your variables. There are other types of assignment operators, as well as other
    types of operators in general. The basic function of an operator is to do something
    with the value of a variable. That "something" can be assigning a value, changing
    a value, or comparing two or more values.


    Here are the main types of PHP operators:


    +   - Assignment operators. Assign values to variables. Can also add to or subtract
    from a variable''s current value.

    - Arithmetic operators. Addition, subtraction, division, and multiplication occur
    when these operators are used.

    - Comparison operators. Compare two values and return true or false. You can then
    perform actions based on the result.

    - Logical operators. Determine the status of conditions.


    The rest of this chapter is devoted to discussing many of the operators used in
    PHP. You will be writing examples for each, so hang on to your tail!


    # Assignment Operators


    You''ve already seen an assignment operator at work: the equals sign is the basic
    assignment operator. But this into your brain - does not mean "equal to!" -- (two
    equals) mean "equal to", and the single - "assigned to." In fact, you see the
    concatenation operator in this chapter, as it is used to put strings together.


    Take a look at the assignment operators in Table 5.1 and prepare to write a new
    script.


    | Operator | Example | Action |

    |---|---|---|

    | += | $a += 3; | Changes the value of a variable to the current value plus the
    value on the right side. |

    | -= | $a -= 3; | Changes the value of a variable to the current value minus the
    value on the right side. |

    | .= | $a .= "string"; | Concatenates (adds to) the value on the right side with
    the current value. |


    Create a simple script to show how all of these assignment operators work. This
    script will assign an original value to one variable and change that as the script
    executes, all while printing the result to the screen.


    +   1. Open a new file in your text editor and type the following HTML:

    ```html

    <html>

    <head>

    <TITLE>Using Assignment Operators</TITLE>

    </head>

    <body>

    ```

    2. Create a PHP block. Create a variable with a value of 100 and print it:

    ```php

    $origVar = 100;

    echo "<p>Original value is $origVar</p>";

    ```

    3. Add 30 to that value and print it:

    ```php

    $origVar += 25;

    echo "<p>Added a value, now it''s $origVar</p>";

    ```

    4. Subtract from that value and print it:

    ```php

    $origVar -= 12;

    ```'
