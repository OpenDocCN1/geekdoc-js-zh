    #  Performing Tasks with SQLite


    In the previous sections, you''ve seen how to create SQLite databases and tables,
    insert and select elements into those tables. It''s safe to make that DELETE and
    DROP commands remove records and tables, and you can also use UPDATE to change
    fields in a record—all of these actions vary on the SQL query that is using the
    sqlite_query function.


    As to the tasks you can perform with SQLite, they''re the same tasks that you
    can perform with MySQL: all of the MySQL-code in the book can be translated to
    SQLite. However, there are two things needed when using MySQL that have not been
    covered in this chapter: auto-incrementing fields and date-stamping.


