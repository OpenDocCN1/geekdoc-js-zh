  md: 'echo "<P>Hello World! <em>World! I''m

    using PHP!</em></P>";


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_50_0.png)


    This block contains three elements: the command (echo), the string <P><em>Hello
    World! I''m using PHP

    </</em></P>, and the instruction terminator (;).


    Familiarize yourself with echo, as it will likely be your most often-used command.
    The echo statement is used

    to output information—in this case, to print this HTML output:

    <P><em>Hello World! I''m using PHP!</em></P>


    The next section discusses a common error, with the hope that you will be able
    to avoid it.


    # The Importance of the Instruction Terminator


    The instruction terminator, also known as the semicolon (;), is absolutely required
    at the end of commands. The instruction

    terminator tells the PHP parser, "I am done with this command, try the next one."


    If you do not end with a semicolon, the PHP parser will become confused, and your
    code will display errors.

    Next steps show you how these errors come about and, more importantly, how to
    fix them.


    +   1. Open a new file in your text editor.

    2. Type the following PHP code:

    ```

    <HTML>

    <HEAD>

    <TITLE>Making an Error</TITLE>

    <HEAD>

    <body>

    <

    echo "<P>I am trying to produce an error</P>";

    echo "<P>Was I successful?</P>";

    >

    ```

    3. Add some more HTML so that the document is valid:

    ```

    <body>

    </HTML>

    ```

    4. Save the file with the name errorscript.php.'
