- img_proc: true
  md: 'Team LiD


    # # A Note About Apache Log Files


    The web server automatically collects information regarding access users and errors.
    These log files are found in the logs directory. A file called access.log handles
    the accesses, and the error.log handles errors.


    The default display for the access log looks something like the following (this
    was taken from my own access log):

    127.0.0.1 [22/Feb/2004:05:22:10] "GET /createtable.html HTTP/1.1" 304 -

    127.0.0.1 [22/Feb/2004:05:24:19] "POST /do_creatieldssmf.php HTTP/1.1" 200 242

    127.0.0.1 [22/Feb/2004:05:28:33] "GET /manage.php HTTP/1.1" 200 185


    This looks rather, I know. You can set the format in your httpd.conf file like
    so:


    ```

    LogFormat %h %l %u "%r" %s %b

    ```


    In this case, the format maps to the settings listed in Table 24.1.


    Table 24.1: Apache Log File Settings

    | Symbol | Description |

    |---|---|n| %h | Remote host of the machine making the request, or IP if HostnameLookup
    = off |

    | %l | Remote log (usually empty) |

    | %u | URL path requested by the user |

    | %t | Time of access |

    | "%r" | First line of request, inside quotation marks |

    | %s | Status of the request |

    | %b | Number of bytes sent, excluding headers |


    > Note You can also log elements such as the user agent (web browser) within the
    Apache access log.

    Although many log analysis packages are available to purchase or download, the
    all-encompassing Apache access log might be overkill for simple tasks. This chapter
    shows you some methods of tracking specific accesses and actions, which have more
    relevance to you than "all access, all information, all the time."


    Team Lib'
