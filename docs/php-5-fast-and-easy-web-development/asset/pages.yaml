    </ul>


    +   4. Add a link to a script sel_bytitle.php. This script will display the records
    ordered by title:

    <ul>

    <li><a href="sel_bytitle.php">ordered by title</a></li>

    </ul>


    +   5. Add a link to a script sel_byartist.php. This script will display the records
    ordered by artist:

    <ul>

    <li><a href="sel_byartist.php">ordered by artist</a></li>

