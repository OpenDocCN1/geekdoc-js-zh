    and follow the Download link. This is the proper place for Linux/Unix distributions
    and announcements.


    Distribution files follow a naming convention, with `http` followed by the version
    number, and then the compression type (`.tar.gz`, `.tar.zip`). As of today, the
    current version is 2.0.49, and I prefer `.tar.gz` files, so the file used as an
    example in this chapter is `httpd_2.0.49.tar.gz`.


    > Note The source code works for most versions of Linux, but if you have any concerns,
    read the Apache documentation on the Apache website to find a better set of files
    for your operating system.


    Once you have downloaded the file of your choice to your home directory, the following
    steps will help you build a basic version of Apache.


    +   1. Type `cp httpd_2.0.49.tar.gz /usr/local/` and press Enter to copy the Apache
    installation file to the `/usr/local/src/` directory.

    2. Go to `/usr/local/src/` by typing `cd /usr/local/src/` and pressing Enter.

    3. Unzip the Apache installation file by typing `tar -xz httpd_2.0.49.tar.gz`
    and pressing Enter. A directory structure will be created, and you will be back
    at the prompt. The prompt will be `/usr/local/src/httpd_2.0.49$`.

    4. Enter the directory by typing `cd httpd_2.0.49` and pressing Enter.

    5. Type the following and press Enter, to prepare Apache:

    configure --prefix=/usr/local/apache --enable-module=so

    The configuration script will run through its process of checking your configuration
    and creating makefiles, and then put you back at the prompt.

    6. A `makefile` lists the files, dependencies, and rules required to build an
    executable application.

    7. Type `make` and press Enter. This second step of the installation process will
    produce many lines of output on your screen. When it is finished, you will be
    back at the prompt.

    8. Type `make install` and press Enter. This final step of the installation process
    will produce many lines of output on your screen. When it is finished, you will
    be back at the prompt.


    Note


    If your installation process produces any errors up to this point, go through
    the process again or check the Apache website for system-specific notes. In the
    next section, you may make some changes to the Apache configuration file before
    you start Apache for the first time.'
