- img_proc: true
  md: '# What''s a Session?


    In terms of time, a session is the amount of time during which a user visits a
    site. In the programming world, a session is kind of a big blob that can hold
    all sorts of variables and values.


    +   - This blob has an identification string, such as 940f6b05a40d5119c030c9c7745ead9.

    - This identification string is automatically sent to the user when a session
    is initiated, in a cookie called PHPSESSID (accessible via $_COOKIE[PHPSESSID]).

    - On the server side, a matching temporary file is created with the same name
    (940f8b05a40d5119c030c9c7745ead9).'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Understanding Session Variables


    In the temporary session file on the server, session variables (and their values)
    are stored. Because these values and variables are not kept in a database, no
    additional system resources are required to connect and extract information from
    database tables. You can access session variables through the $_SESSION superglobal.


    For example, a temporary session file might contain the following:


    ```

    ```

    $count=76;

    $valid="yes";n```

    ```


    In this example, count and valid are the names of the session variables, 76 and
    yes are their respective values. However, to update the variable in the session,
    you must explicitly add it to the $_SESSION superglobal. Once it is added, you
    can extract the value using $_SESSION[count] or $_SESSION[valid], in this example.


    When you attempt to retrieve a session variable, the sequence goes something like
    this (you''re trying to get the value of $_SESSION[


    +   1. The PHP parser gets the value of $_COOKIE[PHESSID] from the user cookie.

    2. The PHP parser finds a matching temporary session file.

    3. Inside the session file, the PHP parser looks for count and then finds its
    value (say, 76).

    4. $_SESSION[count] is equal to 76.


    Next, start your own page-counter script using a session.


    # Starting a Session


    Starting a session is easy. You call the session_start() function, and PHP takes
    care of the rest, sending the cookie and creating the temporary file.


    +   1. Open a new file in your text editor and start a PHP block, and then call
    the session_start() function:


    ```

    ```

    <?

    session_start();

    ```

    ```


    > Note The session_start() function actually performs several important tasks.
    It determines whether a session has been started for the current user, and if
    one is necessary. It also alerts the PHP engine that session variables and other
    session-related functions will be used within the specific script.


    Because of the dual purpose of session_start(), use it at the beginning of all
    session-related scripts.


    +   2. Create a string to hold a message, and then close the PHP block:

    ```

    $msg = "started a session...";

    ?

    ```


    +   3. Type the following HTML:

    ```

    <HTML>

    <HEAD>

    <TITLE>Start a Session</TITLE>

    </HEAD>

    <body>

    ```


    +   4. Display the message string:

    ```

    echo "$msg";

    ```

    5. Add some more HTML so that the document is valid:

    ```

    </BODY>

    </html>

    ```


    +   6. Save the file with the name session.php, and place this file in the document
    root of your web server.'
