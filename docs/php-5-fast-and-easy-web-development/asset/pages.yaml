  md: '# Chapter 15: Database-Driven User Authentication


    # Overview


    Everyone has secrets they don''t want to share with the entire world. But some
    secrets can be shared—with certain people. In this chapter, you learn how to:


    +   - Create a database table for authorized users

    - Create a login form and script sequence that authenticates users before displaying
    any secrets'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# Why Authenticate Anyone?


    When initially developing a website, you might want to restrict access to certain
    members of your development team. If your corporate website contains sensitive
    financial data, you might want to restrict your financial statements to a particular
    list of investors. Or maybe you just don''t want people poking around in your
    personal things.


    A common type of user authentication is database-driven, in which usernames and
    passwords are kept in a database table and accessed via a login form and script.
    In the next section, you create this database table and add some users to it.'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Creating the User Table


    In Chapter 12, "Creating a Database Table" you followed a two-step table-creation
    process. You can use that same process to create the authorized users table.


    +   1. Open your web browser to http://127.0.0.1/show_creatable.html.

    2. In the Table Name field, type `auth_users`.

    3. In the Number of Fields step, type 4.

    4. Click on the Go to Step 2. You should see a form with four rows, corresponding
    to the four fields that will be in the `auth_users` table.

    5. In the first row, type `f_name` for the Field Name, `varchar` from the Field
    Type drop-down menu, and specify a Length of 50. This field will hold the user''s
    first name.

    6. In the second row, type `l_name` for the Field Name, `varchar` from the Field
    Type drop-down menu, and specify a Length of 50. This field will hold the user''s
    last name.

    7. In the third row, type `username` for the Field Name, `varchar` from the Field
    Type drop-down menu, and specify a Length of 25. This field will hold the user''s
    username.

    8. In the fourth row, type `password` for the Field Name, `varchar` from the Field
    Type drop-down menu, and specify a Length of 100. This field will hold a hash
    of the password.


    Note If you recall from Chapter 7, "Displaying Dynamic Content, a *hash* is a
    digital summary of the string. It can be used to compare versions of strings (or
    files) to determine whether the versions differ.


    The completed form should look like the following.


    ![](img/7a81120f3fcfd17d264c4ace19b756f8_200_0.png)


    Click on the Create Table button. You should see a confirmation screen stating
    that your table has been created. In the next section, you create a record addition
    form and script, and add users to the `auth_users` table.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Adding Users to Your Table


    An empty _users table does you need. In this section, you create a simple record
    addition form and script, similar to those you created in Chapter 13. "Inserting
    Data into the Table."


    # Creating the Addition Form and Script


    The HTML form will contain an input field for each column in the _auth_users_
    table.


    +   1. Open a new file in your text editor and type the following HTML:

    ```html

    <HTML>

    <HEAD>

    <TITLE>Add a User</TITLE>

    </HEAD>

    <BODY>

    <h1>Adding a Record to auth_users</h1>

    ```

    2. Begin your form. The method is POST and the action is script called do_adduser.php:

    ```html

    <FORM METHOD="POST" ACTION="do_adduser.php">

    ```

    3. Create an input field for the user''s first name with a label:

    ```html

    <p><strong>First Name:</strong><br>

    <input type="text" name="name" SIZE=25 MAXLENGTH=50></p>

    ```

    4. Create an input field for the user''s last name with a label:

    ```html

    <p><strong>Last Name:</strong><br>

    <input type="text" name="name" SIZE=25 MAXLENGTH=50></p>

    ```

    5. Create an input field for the Username with a label:

    ```html

    <p><strong>Username:</strong><br>

    <input type="text" name="username" SIZE=25 MAXLENGTH=25></p>

    ```

    6. Create an input field for the password with a label:

    ```html

    <p><strong>Password:</strong><br>

    <input type="password" name="password" SIZE=25 MAXLENGTH=25></p>

    ```

    7. Add a submit button, then close your form and add some more HTML so that the
    document is valid:

    ```html

    <input type="submit" NAME="submit" VALUE="Add User">

    </FORM>

    </BODY>

    </HTML>

    ```

    8. Save the file with the name show_adduser.html, and place this file in the document
    root of your web server.

    9. Open your web browser and type http://127.0.0.1/show_adduser.html.


    > Note The MAXLENGTH of the password field is 25, whereas the database field maximum
    is 100. This discrepancy in length takes into consideration the encryption that
    will occur as each character entered in the form will be probably longer than
    25 characters when encrypted. Only the encrypted password is stored in the database,
    the greater maximum length will handle the extra.'
