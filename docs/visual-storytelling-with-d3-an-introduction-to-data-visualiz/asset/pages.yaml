    \ i < obj.length; i++) {\n    age = 2013 - obj[i].year;\n    ageTotal = ageTotal\
    \ + age;\n  }\n  return ageTotal / obj.length;\n}\n```\n\n# Debugging\n\nAs mentioned,\
