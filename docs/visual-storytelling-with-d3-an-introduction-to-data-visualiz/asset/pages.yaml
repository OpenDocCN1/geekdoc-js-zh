  md: "# Loading and Filtering\nExternal Data\n\nIn this chapter, we'll cover how\
    \ to load data from external data files. A lot of the data you'll find on the\
    \ web comes in one of a number of standard formats, and it's often way more convenient\
    \ to use those files directly than it is hard to code the data into your script.\
    \ By the end of this chapter, you will have made an age distribution bar chart\
    \ where you can change the year on display simply by changing the value of a single\
    \ variable in your code.\n\n# Building a Graphic that Uses All of the\nPopulation\
    \ Distribution Data\n\nLet's start this chapter with a goal.\nThroughout this\
    \ entire book, we've been working toward an interactive bar chart in D3 that displays\
    \ the age distribution of the world's population, starting in 1950 and projected\
    \ through 2050. Right now, we have a static bar chart—made entirely in D3—that\
    \ displays that distribution for the year 2010.\n\nAs a next step, let's build\
    \ a graphic that isn't quite interactive, but for which we can show the population\
    \ distribution for any year in our data set by changing a variable in our code.\
    \ In other words, we're going to have a variable called year in our script:\n\
    var year = 2010;\n\nwhich we can change (moving a lever in a factory) to set the\
    \ year on display.\nTo make this work, our script is going to need access to our\
    \ entire data set, not just the data for 2010. When we were working with a single\
    \ year, it was easy enough to manually type the data out into an array of objects,\
    \ for each age group:\n\n```\nvar popData = [\n  {age:\"80 and up\", value:0.016},\n\
    \  {age:\"75 - 79\", value:0.015},\n  {age:\"70 - 74\", value:0.021)},\n```"
