    # Summary


    In this chapter, we covered how to request and use external data in D3. We discussed
    how to set up a local server to access data in a tabular format like CSV. Then
    we discussed how D3 interprets that data, and what it means that D3 processes
    requests asynchronously. Finally, we covered some basic data filtering.'
