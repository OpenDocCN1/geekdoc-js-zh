    says, a little too often. You have your doubts, but when Frank approaches you
    and asks to help visualize all that information, you can''t say no.


    Frank''s idea is to show the five most-featured celebrities every month for all
    years of data he has amassed. He wants the visualization to be interactive and
    animated, but he''s not sure what he wants it to look like. You have an idea,
    though. We scribble'
