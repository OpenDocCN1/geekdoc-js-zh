  md: '# Chapter 3 Scalable Vector Graphics


    # Party like it''s 1999!


    Figure 3.15 SVG text getting wild


    The result is shown in Figure 3.15.

    The x and y attributes specify the position of the text''s anchor point. By

    def default, the anchor point marks the start of the text and is vertically aligned
    with

    text''s baseline. Here''s a snippet that makes the anchor point and baseline

    visible:


    ```

    <svg width="500px" height="500px">

    <text x="10" y="50" font-size="40" fill="grey">Anchors away! Or

    not...</text>

    <circle cx="10" cy="50" r="4" fill="magenta"/>

    <line x1="10" y1="50" x2="420" y2="50" stroke="magenta"/>

    </svg>

    ```


    Figure 3.16 shows you what it looks like.

    Because the anchor point is aligned with the baseline, you need to remember to\yset
    the y coordinate so that your text has enough space up. If you set y to 0, you''ll
    only see tails.


    ```

    <svg width="500px" height="500px">

    <text x="10" y="0" font-size="40">Where did all my text go?</text>

    </svg>

    ```


    You can change the position of the anchor by setting the text-anchor attribute.

    Text-anchor is set to start by default, but if you want to center-align your text,
    you

    can set it to middle and if you want to right-align it, you can set it to end.


    ```

    <svg width="500px" height="500px">

    <text x="10" y="20" text-anchor="start">This text is</text>

    <text x="10" y="35" text-anchor="start">aligned</text>

    <text x="10" y="50" text-anchor="start">to the left</text>

    <text x="300" y="20" text-anchor="middle">This text is</text>

    <text x="300" y="35" text-anchor="middle">aligned</text>

    <text x="300" y="50" text-anchor="middle">to the center</text>

    <text x="590" y="20" text-anchor="end">This text is</text>

    <text x="590" y="35" text-anchor="end">aligned</text>

    <text x="590" y="50" text-anchor="end">to the right</text>

    </svg>

    ```'
