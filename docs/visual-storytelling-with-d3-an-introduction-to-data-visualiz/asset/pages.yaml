  md: "# Chapter 7 Loading and Filtering External Data\n\n![](img/0772fde882e37540dc00155fda693004_187_0.png)\n\
    \nHere’s why: Say you have an especially large data set—one that takes multiple\
    \ seconds to load. You don't really want all of your code to be held up by that\
    \ load time. Ideally, everything that doesn't involve your data will run while\
    \ your data is being pulled in so all of the non-data-driven stuff on your page\
    \ can initialize.\n\nPractically speaking, what this means is that everything\
    \ you do with external data has to happen inside the callback function. So, if\
    \ you wanted to change the code so it actually works, you would need to do this:\n\
    \n```\nvar popData;\nd3.csv(\"popData2010.csv\", function(error, data) {\n  popData\
    \ = data;\n  console.log(popData);\n});\n```\n\n# Creating a Bar Chart with External\
    \ Data\n\nNow, let's go back to the pop2010-scales.html file from Chapter 6. Recall\
    \ that we used code to create a bar chart for the population distribution in 2010.\
    \ We’re going to cut and paste that code into your index.html file and do it again,\
    \ except this time, we’re going to use popData2010.csv as our data source.\n\n\
    Go ahead and paste all of the pop2010-scales.html code into your index.html file\
    \ and put the external call at the bottom of the script:\n\n```\nsvg.append('g')\n\
    \  .attr(\"class\", \"x axis\")\nsvg.append('g')\n  .call(yAxis)\n  .attr(\"class\"\
    , \"y axis\")\nd3.csv(\"popData2010.csv\", function(error, data) {\n  });\n</script>\n\
    ```\n\nSince we’re going to use our CSV file as our data source, we no longer\
    \ need to define popData in the script. So, let’s delete this bit of code:\n\n\
    ```\nvar popData = [\n  {age:\"80 and up\", value:0.016},\n  {age:\"75 - 79\"\
    , value:0.015},\n  {age:\"70 - 74\", value:0.021},\n  {age:\"65 - 69\", value:0.026},\n\
    \  {age:\"60 - 64\", value:0.034},\n```"
