    # Quality: It Is All about Content


    So what makes data visualization good? Sweet colors and hip typefaces, of course!
    It’s gotta look awesome.


    I jest. It''s nice when a graphic looks awesome, but what really makes a graphic
    good is its content. In the section above, I mentioned that transforming data
    into a chart can make seemingly boring topics really interesting. This is true,
    but only if those-seemingly boring topics are secretly fascinating deep down,
    like US debt. You can''t take a completely mundane set of numbers, just jam them
    up with a whimsical font and some electric blue accents, and expect the result
    to be exciting. A boring story.


    On the other hand, if the data is extremely interesting, as long as you visualize
    it in a form that makes you dont have worry about making your graphic pretty.
    Take Figure 1.4, which shows assault deaths per 100,000 people in 32 countries.

    It''s just again bar chart that I threw together in Excel. But the data is interesting:
    When it comes to deaths caused by assault, the US looks a lot more like Chile
    and Estonia than other wealthy countries in the world. The chart could look a
    lot better if it were horizontal, the country names could be read from left to
    right. It would also be nice if the bars didn''t have goofy color gradient. But
    really, these issues are minor compared to the power of the data on display. For
    its economic class, the US is unusually violent, and the bar chart in Figure 1.4
    succeeds in expressing that point.


    That''s not to say you should just find powerful datasets and visualize them in
    Excel. The number of graphical forms you can make in Excel is pretty limited,
    and everything the program does offer is static. Aside from that, it''s good to
    make your charts look good, and it''s essential to make sure the form you use
    expresses your data well.'
