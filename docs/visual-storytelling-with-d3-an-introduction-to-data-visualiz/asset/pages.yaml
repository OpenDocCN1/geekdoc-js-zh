    # Is the World Getting Older?


    I don''t mean planet Earth increasing in age—course it is. I mean the age distribution
    of all humans living on this planet shifting away from childhood and adolescence
    toward late adulthood? Is the population late maturing? It''s a basic question
    about a basic characteristic of people—their age—and in and of itself, it''s pretty
    interesting. Who wouldn''t want to know if the demographics of the world are changing?


    As it turns out, it actually has to be true that the world will get older at some
    point. The world is fairly young now, because the rate at which new human beings
    are born is—about 26 children for every woman. Unless that rate continues apiece
    (and it''s not expected), the world will start to age, be it in the next half-century
    or 50 years after that. In a sense, the question isn''t just "is the world getting
    older?" It''s "the world getting older yet?


    So, the question is, in part, about population growth. If the world is starting
    to get older, then population growth must be slowing down. Given the Earth''s
    finite supply of resources, that''s a good thing.


    But it gets deeper. A slower growing population would be good for the planet,
    an older world is, unfortunately, more challenging for us to support. When people
    get older, they tend to leave the workforce and become more dependent on social
    welfare to handle their expenses and increasing costs. In many countries, it''s
    the younger people still in the workforce who provide the money to fund welfare
    programs. This is a problem in countries like Japan, where almost one of every
    three people is 60 or older—either already retired or nearing retirement age.
    As the ratio of workers to retirees grows around the world? How will we support
    our parents and grandparents?


    Okay, who! What started as a lighthearted question about whether or not the world
    is getting older get pretty real fast. But the point is you might be interested
    in that question for a variety of reasons. You might be interested in the growth
    and composition of the population because you''re concerned about the health of
    the'
