  md: 'Can you see what makes structure so nice? The array janData contains four objects,
    and each object contains all of the information for one (and only one) data point.
    We''ll go over data structures more in Chapter 7.


    Alright, so first things: We need to get some graphics on the page. Let''s get
    about the bars for now and start with the celebrity names. We could take the approach
    we used in Chapter 4, in the section "Shaping Web Pages with D3 selections," using
    a loop to append one element for each name. But we aren''t going to do that. Forget
    for loops. We''re thinking in data-joins now. We want to make text enter


    Here''s how: We''re going to create a selection of all the text elements currently
    on the page, and then we''re going to join our data to. But wait...our page is
    blank. There are no text elements! So what does it even mean to "select all of
    them?


    Here lies the magic of D3 handles the enter phase. You create a selection of elements
    that don''t exist using d3.selectAll(). In this case, since we want to make the
    text page, we can select all of the not-yet-existing paragraph elements—d3.selectAll(*).
    This is shown conceptually in Figure 5.3.


    Then you use two methods on selection: data() and enter(). This one-two-punch
    does something truly awesome: It creates a new object for every point in your
    dataset. Yep, that''s right—you don''t have to tell D3 how your dataset is. You
    just join it with an empty selection, and it will create the right number of objects
    for you (see Figure 5.4).


    Those objects are placeholders to start—no text elements have actually been added
    to the page yet. To make that happen, we have to use our trusty friend, append().
    We''ll append a paragraph element to each of those placeholders (see Figure 5.5).


    Now, we''ve put four elements on the page, but they don''t have any text in them,
    so our page is still blank. How do we get those celebrity names up there and in
    the right place? The secret lies in the data() method. That method actually performs
    a data-join, and when D3 performs a data-join, it binds data to elements. So,
    each of the text elements actually has a data point connected, or bound, to it,
    as shown by the lines in Figure 5.5.


    D3 gives us easy access to bound data, so we can use that data to tell the elements
    what to say and where to go: "Alright, element, let''s look at your data point.
    Which celebrity do you have? Angelina Jolie Okay, that''s what I want your text
    to read. And what''s your rank? 1? Okay, you''re going to get the top!"


