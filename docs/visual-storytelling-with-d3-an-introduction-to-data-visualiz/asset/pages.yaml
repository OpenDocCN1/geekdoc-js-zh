    \ + \")\";\n```\n\n```\nvar x = d3.scaleLinear()\n  .domain([0, d.max(data,function(d)\
    \ { return d.value})})\n  .range([0, width])\n```\n\nWe're on our way. The next\
    \ step is to use D3 to automatically set up an axis for our bars, something that\
    \ will make our code MUCH simpler. But first, a quick word on how to be smart\
    \ setting up your chart margins.\n\n# Using Smart Margin Conventions\n\nThe way\
    \ our chart is currently set up, we have what you could call a chart area--where\
    \ the bars are—and we have a margin on the left where our labels are a margin\
    \ on the top where our axis is. And we've grouped almost everything in our chart.\
    \ Our bars are nested inside an SVG group, as are our axis ticks, our axis labels,\
    \ and our bar labels.\n\nTo each of these groups, we've applied the same transform\
    \ attribute, described by the constant translateText:\n\n```\ntranslateText =\
    \ \"translate(\" + leftMargin + \",\" + topMargin + \")\";\n```\n\nThat attribute\
    \ effectively shifts the position of each group such that (0,0) is 100 pixels\
    \ to the right (the size of leftMargin) and 30 pixels down (the size of topMargin).\
    \ Every group is using the upper-left corner of the chart area as its point of\
    \ origin.\n\nIt makes sense to structure things this way, but there's a more elegant\
    \ way to go about it. This comes straight from Mike Bostock, so you know it's\
    \ good (and you also see it over and over again in his D3 blocks).\n\nFirst, Bostock\
    \ uses a JavaScript object to define the margins. For example:\n\n```\nvar margin\
    \ = {top: 30, right: 0, bottom: 0, left: 100};\n```"
