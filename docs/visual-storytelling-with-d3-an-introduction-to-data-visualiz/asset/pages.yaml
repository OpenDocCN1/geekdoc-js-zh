  md: "Let's do that by creating a new class selected (the next section will clarify\
    \ why it makes sense to take this approach).\n\n```\n.selected {\n  font-weight:\
    \ bold;\n}\n```\n\nWhen we set the class for the buttons, we don't want them all\
    \ to just have the class buttons. We also want the button corresponding to the\
    \ year on display to have the class selected. We need to set the class using an\
    \ anonymous function:\n\n```\nbody.append(\"div\")\n  .attr(\"class\", \"buttons-container\"\
    )\n  .selectAll(\"div\").data(buttonYears)\n  .enter().append(\"div\")\n    .text(function(d)\
    \ { return d; })\n    .attr(\"class\", function(d));\n```\n\nWhat could we put\
    \ inside that function? (I encourage you to figure it out on your own.) We still\
    \ have that variable at the top of our script that we used to set the year at\
    \ the end of the previous chapter. (Currently, mine is set back to 2010.) We can\
    \ use that variable to keep track of which year is selected (and to set a default\
    \ year the user will see when the page loads) and style the buttons accordingly.\
    \ To do this, inside our anonymous function, we can test to see if d is equal\
    \ to year. If it is, we'll give it both the class button and the class selected;\
    \ if it's not, we'll just give it the class button.\n\n```\nbody.append(\"div\"\
    )\n  .attr(\"class\", \"buttons-container\")\n  .selectAll(\"div\").data(buttonYears)\n\
    \  .enter().append(\"div\")\n    .text(function(d) { return d; })\n    .attr(\"\
    class\", function(d) {\n      if (d == year)\n        return \"button selected\"\
    \n      else\n        return \"button\"\n    });\n```\n\nThe result is shown in\
    \ Figure 8.12.\nI't know about you, but to my eyes, the selected year—2010—doesn't\
    \ quite pop enough. One way to further distinguish this is to decrease the weight\
    \ of the other buttons. We can do that in CSS:\n\n```\n.button {\n  float: left;\n\
    \  margin-left: 10px;\n  font-weight: lighter;\n}\n```"
