    # D3''s Functions for Loading Data


    Let''s upload our simple CSV file. First, we need to put it in our directory so
    our browser can find it. Add the **popData2010.csv** file to your population folder.

    D3 has a small suite of functions for loading data, each of which essentially
    handles a different data-format:


    | Function | Format |

    |--- | --- |

    | d3.text() | Plain text |

    | d3.csv() | CSV |

    | d3.tsv() | TSV |

    | d3.json() | JSON |

    | d3.html() | HTML |

    | d3.xml() | XML |'
