  md: "# Interactive Buttons 189\n\nwhen we click something, and inside of that function,\
    \ this is the element that we clicked. We can create a D3 selection out of this\
    \ like so: d3.select(this). Easy.\nOnce we've selected this we need to add the\
    \ class selected. We can use attr() to do that, but D3 also has a method classed()\
    \ you can use to essentially turn a class on and off.\n\n```\nbody.append(\"div\"\
    )\n  attr(\"class\", \"buttons-container\")\n  .selectAll(\"div\").data(buttonYears)\n\
    \  .enter().append(\"div\")\n    .text(function(d) { return d; })\n    .attr(\"\
    class\", function(d) {\n      if(d == year)\n        return \"button selected\"\
    ;\n      else\n        return \"button\";\n    })\n    .on(\"click\", function(d)\
    \ {\n      d3.select(this)\nclassed(\"selected\", true);\n    });\n```\n\nThe\
    \ true means that yes, we want our selection to have the class selected. Give\
