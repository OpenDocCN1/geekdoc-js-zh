  md: "# Styling SVG Elements with CSS\n\nWe can change the style attributes of our\
    \ circle within the Web Inspector. Double-click on the 100 to cx, change it to\
    \ 0, and hit enter. Now the circle's center-point is 0 pixels from the left, and\
    \ half of it is cut off (see Figure 3.4).\n\n# Styling SVG Elements with CSS\n\
    \nPosition and size are great, but we should also add a little color to this circle,\
    \ no? If you've done any graphic design and have some experience with programs\
    \ like Adobe Illustrator, you'll recognize a lot of SVG's nomenclature. The interior\
    \ color of a shape is called the “fill,” and the line around the edge of a shape\
    \ is called the “stroke.” Figure 3.5 shows an example.\n\n```\n<svg width=\"500px\"\
    \ height=\"500px\">\n  <circle cx=\"100\" cy=\"50\" fill=\"darkmagenta\" stroke=\"\
    black\" stroke-width=\"5\"/>\n</svg>\n```\n\nSay we wanted to draw multiple circles,\
    \ of varying sizes, in different positions, but that all look the same. We could\
    \ style all of those circles inline as shown in Figure 3.6. \n\n```\n<svg width=\"\
    500px\" height=\"500px\">\n  <circle cx=\"120\" cy=\"50\" fill=\"darkmagenta\"\
    \ stroke=\"black\"\nstroke-width=\"5\"/>\n</svg>\n```\n\n![](img/0772fde882e37540dc00155fda693004_56_0.png)\n\
    \nFigure 3.4 Pushing the circle off the screen with the Web Inspector\n\n![](img/0772fde882e37540dc00155fda693004_56_1.png)\n\
    \nFigure 3.5 A circle with a fill and a stroke\n\n![](img/0772fde882e37540dc00155fda693004_56_2.png)\n\
    \nFigure 3.6 Three different circles with the same stroke and fill"
