  md: "# Chapter 3 Scalable Vector Graphics\n\n# SVG Style Properties\n\nSVG has a\
    \ slew of style properties you can use for designing graphics. We've gone over\
    \ some of them, such as fill and stroke, but here are a few more details.\n\n\
    # Color and Transparency\n\nIn SVG, you can set the color of a fill or a stroke\
    \ in a few different ways.\n\n| Color Names | Blue | DarkMagenta | BlancedAlmond\
    \ |\n|---|---|---|--|\n| HEX | #0000FF | #8B008B | #FFBCD |\n| RGB | rgb(0,0,255)\
    \ | rgb(139,0,139) | rgb(255,235,205) |\n\n```\n<svg width=\"500px\" height=\"\
    500px\">\n  <circle cx=\"50\" cy=\"50\" r=\"20\" fill=\"BlancedAlmond\"/>\n  <circle\
    \ cx=\"100\" cy=\"50\" r=\"20\" stroke=\"#0000FF\" stroke-width=\"5\"/>\n  <circle\
    \ cx=\"150\" cy=\"50\" r=\"20\" fill=\"rgb(139,0,139)\\ />\n</svg>\n```\n\nFigure\
    \ 3.18 shows the three different circles.\nYou can also make SVG elements transparent:\n\
    \n+   - opacity: A number between 0 and 1 is invisible, and 1 is completely opaque,\
    \ changes the opacity of both the fill and the stroke\n- fill-opacity: Only changes\
    \ the opacity of the fill\n- stroke-opacity: Only changes the opacity of the stroke\n\
    - RGBA: An RGB color that includes an alpha value, which is also between 0 and\
    \ 1 and functionally equivalent to opacity\n\n```\n<svg width=\"500px\" height=\"\
    500px\">\n  <circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"rgb(0,0,255)\" opacity=\"\
    0.5\" />\n  <circle cx=\"100\" cy=\"50\" r=\"40\" fill=\"rgba(0,255,0,0.5)\"/>\n\
    </svg>\n```\n\nFigure 3.19 shows an example of transparency.\n\n![](img/0772fde882e37540dc00155fda693004_65_0.png)\n\
    \nFigure 3.18 Circles colored in different ways with different notations\n\nFigure\
    \ 3.19 Overlapping transparent circles"
  merge: -1
  pgno: 65
- img_proc: true
  md: '# SVG Style Properties


    When making graphics in SVG, I prefer to use opacity instead of RGBA. For one,
    it makes it easier to look at your code and see which elements are transparent
    and ones aren''t. Also, if you''re using D3 and changing the opacity of different
    elements without changing their color, you don''t have to unnecessarily reset
    the color with every change.


    # Stroke Properties


    When it comes to strokes, you have the option of setting the color, width, and
    opacity, and also making the stroke dashed or changing the caps on the end from
    flat to round.


    | stroke | Sets the color of a stroke |

    | stroke-width | Sets the thickness |

    | stroke-opacity | Sets the opacity |

    | stroke-linecap | Sets the shape of the endpoints of a stroke. The options are
    butt (the default), round, and square |

    | stroke-dasharray | Creates a pattern of dashes and gaps for the stroke to be
    drawn in |


    ```

    <head>

    <style>

    .linecap-demo{

    stroke:darkmagenta;

    stroke-width:5;

    }

    </style>

    </head>

    <body>

    <svg width="500px" height="500px" font-weight="bold">Linecaps</svg>

    <text x="0" y="20">text</text>

    <text x="0" y="50">But</text>

    <line x1="60" y1="45" x2="200" y2="45" class="linecap-demo" stroke-linecap="butt"
    />

    <text x="0" y="70">Round</text>

    <line x1="60" y1="65" x2="200" y2="65" class="linecap-demo" stroke-linecap="round"
    />

    <text x="0" y="90">Square</text>

    <line x1="60" y1="85" x2="200" y2="85" class="linecap-demo" stroke-linecap="square"
    />

    </svg>

    ```


    Figure 3.20 shows examples of various linecap styles. A dasharray is a sequence
    of numbers separated by spaces that sets the widths of the stroke''s alternating
    dashes (sections of line) and gaps (sections of no line).'
  merge: -1
  pgno: 66
