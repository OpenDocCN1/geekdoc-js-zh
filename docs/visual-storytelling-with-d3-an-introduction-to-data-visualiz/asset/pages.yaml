  md: '# Age distribution of the world, 2010


    AGE GROUP PORTION OF THE POPULATION


    ![](img/0772fde882e37540dc00155fda693004_166_0.png)


    Figure 6.13 What does it mean?


    In a very general sense, map() works similarly to d3.max(). When you use d3.max(),
    it goes through every element of your array, extracts the relevant data (based
    on an anonymous function you define), and then computes the maximum among the
    values in that relevant pool of data. With map(), the method, similarly, goes
    through each element of the array and extracting the relevant data (again, which
    you define using an anonymous function), but instead of computing the maximum,
    it just throws that data into a new array.


    Here''s what our scale looks like:


    ```

    var y = d3.scale.ordinal()

    .domain(popData.map(function(element) { return element.age}))

    .range([]);

    ```


    Note that we don''t need brackets, because map() returns an array. Now for the
    range. There''s a question we need to ask ourselves at this point: What we actually
    want to use this scale for? To create an axis, sure, but with our x scale we did
    more than that—we used it to set the widths of our bars. We used it to turn data
    into pixels. How can we make our y scale work for us in the same way?


    Of course! By using it to set the vertical position of each of our bars! In more
    technical terms, we pass an age group to the scale function, and it spits out
    a numerical value we can use to set the y attribute of each of our SVG rectangles.'
