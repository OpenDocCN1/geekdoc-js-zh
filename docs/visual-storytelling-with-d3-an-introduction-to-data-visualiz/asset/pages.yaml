    On top of that, the division has come up with projected age breakdowns for the
    future, with every five years, starting with 2015 and going all the way to 2100.
    Actually, they have a series of projections, each of which involves a different
    assumption about birth rates in the future. There is a so-called high fertility
    scenario, in which birth rates are assumed to be relatively high, and a low fertility
    scenario in which they are assumed to be relatively. There is also a medium fertility
    scenario, and a constant fertility scenario, which assumes that birth rates will
    stay exactly where they are.


    So which one we use? Since it''s the middle of the road projection, the medium
    fertility scenario is the best bet. The projected values for that scenario can
    be found in the same spreadsheet file as the estimates for past year—just on a
    different worksheet. Figure 2.2 shows what they look like.


    You''ll all notice that the data is expressed as population figures—in other words,
    we are looking at total numbers of people here. But what we really want are percentages.
    What portion of the total population was between 0 and 4 in 1950 and how does
    that compare to 2010? We can''t compare the total number of infants and toddlers
    for two years, because the population at large was almost three times as big in
    2010 as it was in 1950.


    Translating these numbers to percentages is straightforward: For every year, you
    take the number of 0-4 year olds and divide it by the total population in that
    year (which you can determine by adding the populations for all of the age groups
    together). Then you do the same thing for 5-9 year olds and 10-14 year olds, and
    so on. Appendix B has a step-by-step guide to cleaning up the UN Population data
    and converting it from absolute figures to percentages. After the conversion,
    the table looks something like Figure 2.3.'
