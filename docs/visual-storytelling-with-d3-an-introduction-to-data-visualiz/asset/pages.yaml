    )\n\nbuttons.on(\"click\", function(d) {\n  d3.select(\".selected\")\n    .classed(\"\
    selected\", false);\n\n  d3.select(this)\n    .classed(\"selected\", true);\n\n\
    \  year = d;\n});\n```\n\nGreat. Now we need to filter the data so we only have\
