  md: '# 10


    # Striking Out on Your Own


    The intention of this book was to provide a springboard to help you dive right
    in to D3. But all of the learning you will do happen as you try to build stuff.
    The goal of this chapter is to give you some pointers for how to move forward
    with D3.


    # This Book Is a Foundation for Learning D3


    You could say this book has only scratched the surface. D3 can easily produce
    a multitude of chart forms that animate in a variety of ways, and we''ve only
    made a fairly basic bar chart that grows and shrinks. D3 offers other kinds of
    scales linear and ordinal, other types of user interactions besides clicking,
    and a whole host of premade layouts for making more complex graphics such as chord
    diagrams, treemaps, and dendrograms. Oh yeah, and you can use D3 to make geographic
    maps.


    But scratching the surface isn''t the right metaphor. Hopefully, this book has
    laid a foundation. No matter what you end up using D3—for to make a map of US
    counties shaded according to population density or to visualize your work of friends
    on Facebook—you''ll almost certainly be using-joins. Understanding what data-joins
    are and how to use them is core to programming with D3.


    To take your understanding of selections and data-joins to the next level, there
    is an excellent intermediate tutorial written by Mike Bostock you should read,
    "How Selections Work." It covers a lot of the same ground covered in Chapters
    5 and 8 of this book, but it goes a little deeper and gets a little more technical.
    It will definitely come in handy, especially if you ever want to create multiple
    charts on the same page.


    # How to Get Unuck


    As with any programming language or library, the best way to learn D3 is to build
    stuff. But, of course, as you build stuff you are inevitably going to get stuck.
    So, how do you get stuck?


    +   1. The tutorial can be found at http://bost.ocks.org/mike/selection/'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'First and foremost, you should go to D3''s API Reference, which I''ve mentioned
    throughout this book.² It is filled with excellent, though necessarily very technical,
    descriptions of all D3''s functions and methods (which include many, many more
    than were covered in this book). Consulting the API Reference isn''t always the
    fastest way to get things done—oftentimes you can just copy a snippet of code
    from an online example—but it''s the best way to make sure you fully understand
    what you are doing. In the long run, reading the API Reference is worth the investment,
    because doing so will help you D3.


    But if reading the Reference doesn''t shed any light on the problem you are trying
    to solve (or if you aren''t even sure to begin), then there are tones and tons
    of examples online, covering almost any type and any interaction you could dream
    of. The best place to look for examples is in the D3 examples.³


    Mike Bostock, in addition to bestowing the gift of D3 on the world, has also built
    an online interface that allows people to easily share D3 examples. It''s called
    bl.blocks and it''s built on top of GitHub''s quick-sharing service. There are
    tons of blocks out, and Bostock has himself written hundreds (which you should
    spend some time browsing through).⁴


    Figure 10.1 shows an example of a block that I made.


    Blocks are structured like a read-in, whatever the code does is in a box of the
    top. Then there is most people use to describe what the code does or where the
    data come from. The code itself (always in a single index.html file) is, with
    the syntax highlighted. And finally, if there is an external file used in the
    code in full. (Figure 10.1 is not long enough to show you the data I used in.)


    A JavaScript developer named Irene Ros has made an excellent tool for exploring
    blocks called Blocksphere (http://blocksphere.org/). You can type a function or
    method into the search bar, and Blocksphere will show you all of the existing
    blocks that use that function. It''s really helpful if you know what you want
    to use but not totally how to use it.


    Of course, there won''t be a block to help you troubleshoot a specific problem.
    So where to next?


    Message boards. There is a D3 Google group, and there are thousands of D3-related
    threads on StackOverflow. If you encounter someone weird, someone has encountered
    similar weirdness and asked people about it one of those two forums. If you can''t
    find it anywhere, post a question yourself! These forums get better as the number
    of threads grows, so long as the questions aren''t easily answered by reading
    the D3 documentation. (For example, “How do I reference the D3 library in my HTML
    file?”⁵ is a bad question to ask, because the answer is right on the home page
    of the D3 wiki).


    +   2. https://github.com/mbostock/d3/wiki/API-Reference

    3. https://github.com/mbostock/d3/wiki/Gallery

    4. http://blocks.org/mbostock'
  merge: -1
