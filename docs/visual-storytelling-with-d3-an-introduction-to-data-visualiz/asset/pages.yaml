- img_proc: true
  md: '# Basic Math, Variables, and Data Types


    You declare a variable by typing var by a space followed by the variable name.
    You finish declaring with a semicolon. Important: It''s best practice to end every
    JavaScript statement with a semicolon. JavaScript is a very forgiving programming
    language, and it will usually work if you do not include semicolons, but not always.
    In the example above, x is declared as a variable but not defined, y is declared
    and set equal to 10 in a single statement, and z is declared and set equal to
    the result of 5 + 2 in a single statement. Also, MyVariable,myVariable, and myvariable
    are declared and varyingly defined or not in a single statement, separated by
    commas. Note that var has only been typed once per statement.


    Now that we have some variables, we can use them (see Listing A.2).


    ```

    Listing A.2 Performing operations with variables.


    myVariable + y;

    myVariable + myVariable;

    var newVariable = myVariable;

    myVariable = 4;

    newVariable;

    ```


    As I''ve noticed, variable names are case-sensitive. It''s also the case that
    you can''t start a variable name with a number, and you can''t include operators
    in a variable name. (For example, my-variable would be read as subtracting variable
    from my. Use my_variable or myVariable instead.)


    Variables can contain more than just numbers. They can also contain a range of
    other data types, arrays, objects, and even functions (see Listing A.3). In some
    programming languages, you have to declare the type when you declare a new variable,
    but in JavaScript you don''t. Furthermore, you can change a variable''s type:
    You can declare a variable and set it equal to a number, only to later set that
    same variable equal to, say, a string.


    > Note

    In JavaScript, the sequence // initiates a comment; everything // on a line will
    not be interpreted as part of your code.


    ```

    Listing A.3 Basic data types in JavaScript.


    // Numbers

    var myWholeNumber = 5;

    var myFractionalNumber = 5.1;

    var myDividedNumber = myWholeNumber / myFractionalNumber;


    // Strings

    var myString = "Hello";

    var myStringSingle = ''Hello'';

    var myStringQuotes = ''Hello, she said.'';nmyWholeNumber = "Now I''m a string"

    ```'
