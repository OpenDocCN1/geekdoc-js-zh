  md: '# Chapter 3 Scalable Vector Graphics


    ```

    <circle cx="15" cy="50" r="10" fill="magenta" stroke="black"

    stroke-width="5"/>

    <circle cx="60" cy="100" r="50" fill="magenta" stroke="black"

    stroke-width="5"/>

    </svg>

    ```


    We could use CSS (another bonus of using SVG. Just as with HTML, using CSS makes
    it easier to apply styles to multiple elements (and thus, changing the styling
    of multiple elements on the fly). So, the code above works perfectly fine, you
    can make your life easier by assigning classes to each of the circles and styling
    them in one sweep.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <style>

    .styled-circle

    {

    fill: magenta;

    stroke: black;

    stroke-width:5;

    }

    </style>

    </head>

    <body>

    <p>SVG sandbox</p>

    <svg width="500px" height="500px" r="20" class="styled-circle"/>

    <circle cx="120" cy="50" r="10" class="styled-circle"/>

    <circle cx="15" cy="50" r="10" class="styled-circle"/>

    <circle cx="60" cy="100" r="50" class="styled-circle"/>

    </svg>

    </body>

    </html>

    ```


    There are a couple of things to note: One is that you can only use CSS for properties,
    like fill and stroke. You can''t use CSS for defining the position or size of
    an SVG element. So, if you are drawing 100 circles and each a radius of 5, you
    still have to define r for each one individually. But don''t worry: D3 makes it
    possible to do this with one line of code.


    The second thing is that SVG styles and HTML styles are different and have different
    names, even though sometimes the properties they refer to are similar. To create
    an outline around a <div> in HTML, you would use the border property, since'
