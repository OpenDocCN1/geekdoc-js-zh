    # # Adding Axes


    Scales are cool, but using them to add axes is even cooler. And it''s dead simple.
    Let''s start by getting rid of the horizontal axis entirely. All of this code..


    ```

    var axisTickGroup = svg.append("g")

    .attr("stroke", "black");

    axisTickGroup.selectAll("line")

    .data(axisData)

    .enter().append("line")

    .attr("x1", function(d) { return x(d)})

    .attr("x2", function(d) { return x(d)})

    .attr("y1", 0)

    .attr("y2", -tickHeight);

    var axisLabelGroup = svg.append("g")

    .attr("class", "axis-label");

    axisLabelGroup.selectAll("text")

    .data(axisData)

    .enter().append("text")

    .attr("x", function(d) { return x(d)})

    .attr("y", -tickHeight - tickGap)

    .text(function(d) { return d + "*";\});

    ```


    ..scrap it. We''re going to build an axis the D3 way (see Figure 6.3).


    The first thing we have to create is what is called an axis generator. Sounds
    intense, but this is all of it is:


    ```

    var xAxis = d3.svg.axis()

    .scale(x)

    ```


    As we did with our scale, we are defining a function, which we initialize with
    d3.svg.axis() but can then customize. This is the kind of situation in which it
    often makes sense to consult the D3 API Reference. There''s a whole section on
    creating axes that explains in detail how to customize axis generators (see Figure
    6.4).'
