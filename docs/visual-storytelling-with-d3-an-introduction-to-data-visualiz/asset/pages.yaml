  md: '# JavaScript for Beginners


    This JavaScript primer is designed for people who have little or no experience
    with JavaScript. It covers everything you need to know to get up and running with
    D3.


    # JavaScript In Brief


    JavaScript is a native of the web. It''s a programming language that was created
    to run in web browsers so web pages can respond to input from users. JavaScript
    can take most of the credit for making websites interactive.


    Remember that when you go to a website, all that is really happening that your
    browser is opening up an HTML file (unless the website is in a different format,
    like PHP). So if a website involves JavaScript, the HTML file has tell the browser
    somewhere. It does this in one of two ways:


    +   - The HTML file itself can contain JavaScript. If you add a `<script>` tag
    to your markup, you can insert JavaScript directly into it.

    - The HTML file can call from an external JavaScript file (don''t worry: if you''ve
    never done this before, we''ll go over how to do later in this chapter).


    Unlike HTML, JavaScript is not a markup language. HTML is very specifically a
    way of applying structure to the elements of a webpage. But JavaScript is a full-fledged
    programming language. You can write reusable functions in JavaScript, you can
    define variables, or you can use it to do basic math. Though it began as a liaison
    between users and the web pages they were using, JavaScript has since come to
    be used in building non-web applications and video games as well.


    # Your Browser''s JavaScript Console


    Every modern browser has a built-in JavaScript console. The true purpose of the
    console is for debugging a web page JavaScript. If you fire up the console with
    a web page open, it will tell you, for one, if the page''s JavaScript has any
    bad syntax and couldn''t be interpreted by the browser.'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'But you can also use the console as a JavaScript command line. In other words,
    you can key lines of JavaScript into the console and hit enter, and it will execute
    that code. Later, we''ll go over how to use the console to inspect your JavaScript,
    but first, let''s go over some basics using the console as a command line.


    # Basic Math, Variables, and Data Types


    Launch your browser, if you haven''t already. To access the console in Chrome
    you can click on the so-called hamburger menu (see Figure A.1), then go to Tools
    > JavaScript Console. The keyboard shortcut for Windows is Ctrl + Shift + J and
    on a Mac it''s ⌘⇧-J (Option + J). You should see the window shown in Figure A.2
    pop up.


    Now key in 1 + 1 and hit. The console will automatically print the answer. If
    it''s not 2, I suggest you lie down for a quick nap. If that was the first time
    you coded in JavaScript, congratulations! Basic math is a breeze in JavaScript.
    In addition, you can use subtraction (using - operator), multiplication (*), and
    division (/), and you can use parentheses to dictate the order of operations.
    There is also an operator (%) for calculating the remainder (long division, who!)
    you would get if you divided two numbers. For example, 12 % 10 = 2.


    In JavaScript, you can store a value in a variable, which is handy if you want
    to use value more than once. JavaScript variables work sort of like algebra in
    reverse. In algebra, you are usually trying to figure out what x is, but in JavaScript,
    you set x equal to whatever you want.


    To create a variable, you first have to do what is called declaring it. Listing
    A.1 shows some examples (which you should type into the console as you go):


    ![](img/0772fde882e37540dc00155fda693004_241_0.png)


    Figure A.1 The hamburger menu


    ![](img/0772fde882e37540dc00155fda693004_241_1.png)


    Figure A.2 The console


    Listing A.1 Declaring variables in JavaScript.


    ```

    var x;

    var y = 10;

    var z = 5 + 2;

    var myVariable, myVariable = 2, myvariable = 2 - 2;

    ```'
