  md: '# Visual Storytelling


    You might be wondering why this book is called "Visual Storytelling with D3" and
    not, say, "Data Visualization with D3." What is this storytelling business all
    about, anyway?


    It''s tempting to think that communicating an idea is a lot cleaner or more objective
    if you do it with data. After all, nobody can argue with the numbers!


    There''s certainly some truth to that, and of course, whenever you''re trying
    to prove a point, it helps to have hard data on your side. The fact of the matter
    is, when you turn a spreadsheet into something you almost always have to make
    a judgment call (or at the very least a decision choice). You choose what''s showing,
    or, if you''re showing everything in your dataset, you choose what to give visual
    emphasis. With a few exceptions, you are crafting the dataset into some sort of
    message or told visually.


    Now building a dashboard that displays the value of a few stocks or the traffic
    of a websites is hardly an act of storytelling in the traditional sense. But finding
    the right layout involves editorial decisions and craft. A visualization often
    conveys only data but a perspective on that data. And that''s worth keeping in
    mind.


    # Enter D3


    Enough background for now. You know what data visualizations are, so let''s shift
    gears and talk about the best tool around making them on the web: D3.


    Short for data-driven documents, D3 is a library of the programming language JavaScript,
    written by the immensely talented and insanely prolific Mike Bostock. True to
    its name, D3 enables you to bind data to documents and manipulate those documents
    based on data. But what does that mean?


    Let''s start with the bit D3 being a JavaScript library. D3 is not a piece of
    software that you download, like Adobe Illustrator; it''s not a programming environment
    like R, where you do analysis and generate plots from a command line; it''s not
    an online tool like Google Charts or Tableau Public that lets you go to a website,
    in numbers, and create stock visualizations. Instead, it''s a completely open
    source extension of JavaScript, as every library is an extension of the language
    it''s written in. D3 expands the capabilities of JavaScript (in ways that are
    especially useful for data visualization).


    If you''re relatively to programming, this answer might be a little unsatisfying.
    What is a library, physically, and what''s in it? The answer is a bunch of functions
    and methods (which are a lot like functions). Functions and methods exist to store
    sequences of code that can be easily used over and over again. A library is essentially
    a suite of functions, each of which is designed to work in concert with the others.
    It''s a good library, the functions collectively provide a new way of using a
    programming language.


    D3, being a library, is a list of functions and methods and their definitions
    (the sequences of commands they store). That list comes in the form of a JavaScript
    file.'
