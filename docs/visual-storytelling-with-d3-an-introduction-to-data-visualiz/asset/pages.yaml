  md: '# Appendix B Cleaning the Population Distribution Data


    anticipating what you want, automatically converts it into a date. But that''s
    not we want. So, you have to select all of column B (which you can do by clicking
    on the column letter) and then go to Format > Cells... and select "Text" under
    "Category" (see Figure B.33). This tells OpenOffice you want these cells to remain
    as text and not get automatically converted to dates.


    The issue is that there are also periods in the "value" column, because all of
    the numbers are decimals. If you replace those periods with hyphens, then will,
    things get a little weird. No worries. It''s actually possible to limit the "Replace
    all" that you do to a group of selected cells, instead of truly replacing characters
    in all of them.


    Select all of the cells in column B (you can do that by clicking on the column
    letter). Then go back to Edit > Find & Replace... To limit any replacement to
    the selected cells, you have to click "More Options" in the box that pops up and
    then check the box next to "Current selection only". Boom.


    One more "Find and Replace" left. We want to change all of the 80+ values (which
    now actually read "80-") to "80 and up". Easy. You know how to do that. Okay,
    there''s actually once last thing. You can''t just save the file, because for
    reason, Open Office has to insert semicolons in CSV files where the commas should
    be. So you have to go to File > Save As... and when the dialog box pops up, you
    have to check "Edit filter settings".


    When the next dialog box pops up, you have to make sure that the "Field delimiter"
    is set to "," (see Figure B.34). Then you should be all set! Your file—allData.csv—is
    basically good for making the bar charts in this book.


