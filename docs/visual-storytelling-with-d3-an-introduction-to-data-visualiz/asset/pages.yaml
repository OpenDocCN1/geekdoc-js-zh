  md: '# Cleaning the Population Distribution Data


    This appendix will cover how to find and clean the raw data used for the interactive
    population distribution bar chart built throughout the course of this book.


    All of the data comes from the United Nations Population Division. And all of
    the cleaning can be done with two pieces of free software—Open Office and the
    statistical programming language, R. If you''re planning on following along, you
    should go ahead and install those programs on your computer (if you use Microsoft
    Excel, you don''t need Open Office). You can find Open Office at https://www.openoffice.org/
    and R at http://www.r-project.org.


    Start by going to the UN Population Division''s homepage: http://www.un.org/en/development/desa/population/.
    From there you can navigate to its population portal by clicking on “Estimates
    and Projections” in the sidebar. If you''re trouble finding it, the full link
    for that page is http://esa.un.org/unpd/wpp/index. Then, click on “Data in Excel
    format”. Again, here is the full link if you need it: http://esa.un.org/wpp/Excel-Data/population.html.
    Don''t worry that the data on this page is in Excel format handle .xls files.


    The dataset you use is the “Age composition”—Both Sexes. Click on that link, and
    the spreadsheet will start downloading. Once it''s finished, open it up in Open
    Office (or Excel). Your file should look like the one in B.1.


    There are multiple worksheets in the file. The first is called “ESTIMATES”, followed
    by “MEDIUM FERILITY”, “HIGH FERILITY”, and so on. We are only interested in two
    of them: ESTIMATES (data from years past) and MEDIUM FERILITY (the middle of the
    road projections).


    Let''s take a look at the ESTIMATES sheet. All of the data for the entire world
    is conveniently right there at the top. (If the values are appearing a few hash
    marks—###—don''t worry. That just means the columns aren''t wide enough for the
    numbers to be displayed. You can make a column wider by scrolling over the boundary
    between'
