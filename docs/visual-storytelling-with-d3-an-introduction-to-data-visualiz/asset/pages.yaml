  md: '# Appendix A JavaScript for Beginners


    Open js-basics.html in your browser. Not a whole lot to look at. Now open up the
    console. If all went well, you should be able to access all of your variables
    from the console''s command line. Type myVar and hit enter. Voila! It worked!


    The other way to add JavaScript to a web page is to call in an external JavaScript
    (.js) file. Go to the directory on your computer where js-basics.html lives and
    create a folder called script. Now create a new file in your text editor and type
    in myVar = "Voila! It worked"; at the top. Save that file as js-basics-script.js
    in the script folder you created. Finally, change your markup to look like Listing
    A.7.


    # Listing A.7 Calling in an external JavaScript file.


    ```

    <!DOCTYPE html>

    <meta charset="utf-8">

    <body>

    <script src="script/js-basics-script.js"></script>

    </body>

    ```


    Now open the console back up and type in myVar. Note: Just to be clear, the JavaScript
    file doesn''t have to live in a folder called script. The folder could be called
    anything. Or js-basics-script.js could be in the same directory as js-basics.html.
    In that case, when you call js-basics-script.js, you would write:


    ```

    <script src="js-basics-script.js"></script>

    ```


    As long as your markup knows how to find the JavaScript file, everything will
    be dandy. (Personally, I like to store my js files in a separate folder to keep
    things organized.)


    # Arrays and Objects


    In addition to the basic data types we covered above, JavaScript has a couple
    of special varieties that are capable of containing multiple values at once.


    One of these is an array. The values are enclosed within square brackets and separated
    by commas. Open up js-basics-script.js and insert the following statement to create
    an array:


    ```

    var myArray = [1,2,3,4,5];

    ```


    Go back into your browser and open the console. Type in myArray and hit enter.
    There it is. Now, it''s possible to access any one of the values in individually
    (also known as indexing into the array) by typing myArray[i] where i is the position
    of the value within the array (or its index). So, if we want to access the first
    value, we might try typing myArray[1] (see Figure A.3).'
