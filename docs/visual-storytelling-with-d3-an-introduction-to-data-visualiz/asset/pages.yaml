  md: '# Appendix B Cleaning the Population Distribution Data


    as a piece of descriptive information. In other words, every row had a value for
    year. We want that to still be the case after melting the data frame.


    Pieces of descriptive information are called ID variables in the parlance of the
    reshape2 package. By telling the melt function to set id = "year" you are preserving
    year as an ID variable, and keeping the name on every row. This is a good thing.


    Now, we can export our data (yum) to a new CSV and then open it with Open Office
    (It''s also, of course, possible to do that in R, but not as intuitive). Here
    is the code you need to create a new CSV file: write.csv(dataMelt,"allData.csv",row.names=FALSE).
    The first argument—dataMelt—is the frame we want to export, and the second argument—allData.csv—is
    what we want to named file. By default, R will create a column with the row numbers
    (or, more broadly, row names), but that information isn''t useful to us, so we
    can set row.names=FALSE to tell R not to include the row names.


    After you''ve done that, the CSV file will automatically appear in your working
    directory, where you de go ahead and open it in Open Office. On the Text Import
    pop-up (shown in Figure B.29), you''ll want to check "Commas" so that Open Office
    knows your data is delimited by commas.


    Check out your data (Figure B.30).


    Looking good, we need to do four more simple things. We are going to change the
    column header "variable" to something more descriptive—let''s call it "age," as
    in Figure B.31.


    ![](img/0772fde882e37540dc00155fda693004_271_0.png)


    > Figure B.29 Pick the delimiter'
