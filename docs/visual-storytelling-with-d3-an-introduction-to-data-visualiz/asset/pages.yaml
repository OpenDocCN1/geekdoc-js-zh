  md: "# Dealing with Asynchronous Requests\n\n```\n{age:55 - 59, value:0.045),\n\
    {age:50 - 54, value:0.051),\n{age:45 - 49, value:0.060),\n{age:40 - 44, value:0.066),\n\
    {age:35 - 39, value:0.071),\n{age:30 - 34, value:0.073),\n{age:25 - 29, value:0.081),\n\
    {age:20 - 24, value:0.089),\n{age:15 - 19, value:0.088),\n{age:10 - 14, value:0.086),\n\
    {age:5 - 9, value:0.088),\n{age:0 - 4, value:0.093}\n};\n```\n\nNow, as a first\
    \ cut, we can put our entire script inside of the callback function.\nThat we\
    \ know our data will be available:\n\n```\n<script>\nd3.csv(\"popData2010.csv\"\
    , function(error, data) {\n  var popData = data;\n  var body = d3.select(\"body\"\
    );\n  var margin = {top: 30, right: 30, bottom: 0, left: 100},\n    width = 500\
    \ - margin.left - margin.right,\n    height = 230 - margin.top - margin.bottom;\n\
