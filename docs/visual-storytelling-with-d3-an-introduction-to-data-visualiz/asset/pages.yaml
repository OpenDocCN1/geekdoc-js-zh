  md: "# Drawing Order and Groups\n\n47\n\n![](img/0772fde882e37540dc00155fda693004_68_0.png)\n\
    \n# # Drawing Order and Groups\n\nUnlike Adobe Illustrator or Inkscape, SVG doesn't\
    \ have layers. But it does draw stuff in order. It starts with the first element\
    \ in your code and then goes down the line. If there is overlap between two elements,\
    \ the one that appears lower down in your code will be in front.\n\n```\n<style>\n\
    svg text {\n  text-anchor:middle;\n  fill:lightgrey;\n}\nsvg rect {\n  fill:crimson;\n\
    \  opacity:0.5;\n}\n</style>\n<body>\n<svg width=\"500px\" height=\"500px\">Text\
    \ on bottom</svg>\n<rect x=\"0\" y=\"0\" width=\"200\" height=\"60\"/>\n<rect\
    \ x=\"250\" y=\"30\" width=\"200\" height=\"60\"/>\n<text x=\"350\" y=\"35\">Text\
    \ on top</text>\n</svg>\n</body>\n```\n\nTwo different examples of drawing order\
    \ are shown in Figure 3.22.\nOne thing you can do in SVG is that you'll be familiar\
    \ with is to group elements together. You do this with a <g> tag. We'll learn\
    \ the real value of groups when we dig into D3, but one benefit to grouping objects\
    \ that you'll appreciate now is that you can apply styles to a group and they'll\
    \ automatically be applied to all of the elements within that group.\n\n```\n\
    <head>\n<style>\n.blue-group {\n  fill: blue;\n  stroke-width: 3;\n}\n\n```"
  merge: -1
