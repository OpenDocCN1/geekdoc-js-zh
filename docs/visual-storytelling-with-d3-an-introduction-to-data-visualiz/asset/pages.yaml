  md: '# Choosing a Form 23


    # Age distribution of the world, 2010


    0-4 yrs


    ![](img/0772fde882e37540dc00155fda693004_44_0.png)


    Data: UN Population Division


    Figure 2.12 Just a single slice


    With pie charts, the graphical elements you are relying on to convey information
    are, of course, pie-shaped slices of a circle. And what is the attribute that
    varies between them? The angle formed by the two straight sides of each slice.
    That angle is larger for bigger slices and smaller for smaller ones.


    As it turns out, humans are really bad at perceiving differences in angles. We
    tend to overestimate obtuse angles (greater than 90°) and underestimate acute
    ones (less than 90°). We also tend to perceive the exact same pie slice as larger
    if it''s oriented horizontally (with the point facing left or right, assuming
    the angle is less 180°) than if it''s oriented vertically (with the point facing
    up or down). When you are trying to compare slices of a circle that are all oriented
    differently—as in Figure 2.11—that is a real problem.


    Some experts think you should use only pie charts to compare a single part to
    the whole, and not to compare parts with each other.² In words, you should limit
    the number of slices shown on a pie chart to one. For example, Figure 2.12 is
    a pared down version of Figure 2.11 which highlights only the portion of the population
    that is between 0 and 4.


    But is Figure 2.12 actually useful, or would it be if we made one of those pie
    charts for each age group and put them all side-by-side? No, not really. Alas,
    though it may be tempting to use them, pie charts are severely limited in their
    utility.


    # Showing the Data as a Bar Chart


    A better way to enable comparisons between age groups within a selected year is
    to make a simple bar chart for that year, as in Figure 2.13.


    ² See, for example, http://www.excelcharts.com/blog/optimal-number-categories-pie-chart/'
