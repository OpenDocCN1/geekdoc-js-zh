  md: 'Choosing a Form


    Now that we''ve nailed down our scope, let''s start designing a graphic!


    # Choosing a Form


    In Chapter 1, we said that the crux of good data visualization design is choosing
    the right combination of graphical elements and attributes to represent data.
    Making that choice is the main step in giving a graphic form. And it''s a graphic''s
    form that does the bulk of the storytelling.


    Of course, you don''t have to create a new form from scratch. There are plenty
    of tried and true forms out which you can choose—bar charts, line charts, scatterplots,
    radar plots, Sankey diagrams, slopeigraphs, choropleth maps—the list goes on on.
    In most cases, it makes sense to fall back on one of these trusty forms to get
    the job done.


    But which one do you choose? Picking one form over another usually involves trade-offs.
    Each form emphasizes certain things and deemphasizes others, allowing the viewer
    to make some comparisons across the dataset, but also sometimes inhibiting her
    capability to make others. Let''s walk through some options for how we could display
    our data composition area.


    # Showing the Data as a Column Chart


    Let''s start with one of the most basic chart forms—a column chart. In a column
    chart, the graphical element of choice is a column (really, a vertically aligned
    rectangle). The length (height) of the column represents the number of elements
    that match a particular attribute (or attributes) of interest. Figure 2.5 shows
    a column chart for our age distribution data. In this example, people are our
    elements and the attributes of


    # Age distribution of the world


    ![](img/0772fde882e37540dc00155fda693004_38_0.png)


    **Figure 2.5** A column chart for our age data

    Data: UN Population Division'
