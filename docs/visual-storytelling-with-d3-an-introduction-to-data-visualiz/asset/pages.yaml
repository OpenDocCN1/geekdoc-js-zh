    Let''s try the extremes. Figure 7.14 shows the projection for 2050. Those two
    charts look vastly different—the world certainly is getting older. But they are
    also a little hard to compare because the scales aren''t the same. The scale on
    the chart for 1950 extends past 12%, while the scale on the chart for 2050 only
    extends a little beyond 6%.\This makes sense given we define the domain for our
    x scale:


    ```

    var popData = data.filter(function(element) { return element.year == year });

    x.domain([0,d3.max(popData, function(d) { return d.value;})));

    ```


    To set the upper end of the domain, we use the maximum value in the popData array
    that we filtered to only include the year of interest. That maximum, of course,
    changes depending on the year we choose.'
