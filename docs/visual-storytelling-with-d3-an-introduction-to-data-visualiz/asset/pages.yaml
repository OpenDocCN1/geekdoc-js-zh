- img_proc: true
  md: "Every path has (often quite long) value for the attribute d. SVG numbers in\
    \ that value say how the path should be drawn. In the example above, M is short\
    \ for \"moveto,\" meaning that the imaginary cursor drawing the path should move\
    \ to, with 0 pixels from the left and 50 from the top. q then tells the cursor\
    \ to draw a quadratic Bezier curve that arcs to a point 50 pixels over and 50\
    \ pixels and arcs back down to a point that is 100 pixels to the right of where\
    \ it started, but vertically aligned. l then serves to draw a line 100 pixels\
    \ to left, completing the shape (which sort of resembles a setting sun).\n\nSee\
    \ what I mean? Like a language unto itself. And I've just scratched the surface.\
    \ If you want to learn about paths, you should check out the specifications, which\
    \ were written by the World Wide Web Consortium (http://www.w3.org/TR/SVG11/paths).\
    \ Fortunately, D3 makes paths a lot simpler than hardcoding them in SVG.\n\n>\
    \ Note\nPaths, like circles and rectangles, have a black fill by default in SVG.\
    \ If you don't want a fill, you have to set fill to \"none.\"\n\n# # SVG Text\n\
    \nIn addition to shapes, you can also use SVG to draw text. But why would you\
    \ want to when you can use a good ol <p> tag? If you're building a graphic in\
    \ D3 that has labels you want to change and move around, SVG can be extended to\
    \ use. You can rotate SVG text, or make the text travel along an arc, or any other\
    \ path (though you should do those things sparingly, because it makes the text\
    \ harder to read). Here's the skinny on SVG:\n\n```\n<body>\n  <svg width=\"500px\"\
    \ height=\"500px\">\n    <text x=\"10\" y=\"25\" font-size=\"20\">SVG sandbox,\
    \ now in SVG\n    </text>\n  </svg>\n</body>\n```\n\nThe text generated by the\
    \ SVG <text> tag is not self-closing. Note that the text you want to draw goes\
    \ between the opening and closing tags, just like with a <p> tag.\n\nAll of the\
    \ basic attributes have the same names in SVG as they do in HTML: font-size, font-family,\
    \ font-weight, style. That is, except color. With SVG text, and with shapes, the\
    \ color is called the fill. And yes, you can add strokes around your text:\n\n\
    ```\n<svg width=\"500px\" height=\"500px\">\n  <text x=\"10\" y=\"50\" font-size=\"\
    40\" fill=\"lightgray\" stroke=\"red\"\n  font-family=\"Comic Sans MS\">Party\
    \ like it's 1999!</text>\n</svg>\n```\n\nSVG sandbox, in SVG only\n\nFigure 3.14\
    \ SVG text"
