  md: '106 Chapter 5 Data-Joins: Enter


    That''s it. Those three things. An interactive graphic is sort of like theater.
    During a play, actors enter the stage, they act, and they exit. In a data visualization,
    shapes, or more broadly, graphical elements, enter the page, they update, and
    they exit.


    Data-joins take full advantage of this rudimentary element. In using them, you
    can command graphical elements to enter, update, and exit. (In fact, I took the
    terms "enter," and "exit" directly from D3.)


    What''s more, D3 enables you to do all of these things based on data. The way
    it achieves this is through something called data binding. Whenever you perform
    a data-join, your data is actually connected, or bound, to elements. This is hugely
    convenient, D3 gives you easy access to bound data. So you can say, for example,
    "Okay rectangle, what does your bound data point say? 35? Well, what''s what I
    want your width to be"


    This probably makes vague sense at this point. Don''t worry, we will go through
    everything slowly and in detail, using an example as a guide. This chapter will
    focus on enter, and in Chapter 8, we''ll cover update and exit.


    # A Conceptual Overview of Data-Joins: Enter


