  md: "# 9\nAdding a Play Button\n\nIn this chapter, we'll be taking things up a notch\
    \ by adding a play button to our bar chart. We'll start by making a generalized\
    \ update function we can use to tell our bar chart to update to any given input.\
    \ Then we'll actually add a play button to our page. And finally, we'll make the\
    \ whole thing work.\n\n# Wrapping the Update Phase in a Function\n\nThink of this\
    \ chapter as kind of a bonus chapter. You've already learned everything you know\
    \ to be well on your way to creating awesome graphics in D3. In this chapter,\
    \ we're just going to make that bar chart we've been working on slightly more\
    \ sophisticated by adding a play button.\n\nWhat will play button do, exactly?\
    \ When the user clicks on it, the chart will first be set to the earliest year,\
    \ 1950. The button for 1950 will turn bold and black and the bars will grow or\
    \ shrink to the levels associated with that year. Then the chart will automatically\
    \ step through each subsequent year in order, advancing from one to the next fixed\
    \ place. The idea is that the user can click the play button, sit back, and watch\
    \ the shape of the world's age distribution change over time.\n\nSo how do we\
    \ go about making this? Before we think a little bit about what needs to happen\
    \ under the hood.\n\nAs the chart plays through all the years, it will involve\
    \ a series of updates—in the D3 sense of word. Each update will be equivalent\
    \ to the user clicking whichever year comes next. In other words, the same sequence\
    \ of code that is triggered when a user clicks a year needs to be triggered when\
    \ a user clicks the play button.\n\n```\nbuttons.on(\"click\", function(d) {\n\
    d3.select(\"*selected\")\n  .classed(\"selected\", false);\n\nd3.select(this)\n\
    \  .classed(\"*selected\", true);\n```"
  merge: -1
  pgno: 220
- img_proc: true
  md: "# Chapter 9 Adding a Play Button\n\n```\nyear = d;\npopData = data.filter(function(element)\
    \ { return element.year == year});\nbars.data(popData, keys)\n  .transition()\n\
    \  .duration(500)\n  .attr(\"width\", function(d) { return x(d.value); });\n;\n\
    ```\n\nThe code above is the code we'll need to reuse for our play button. Fortunately,\
    \ we won't need to write it in our script twice. All programming languages have\
    \ a basic, built-in mechanism that helps you reuse code easily: the ability to\
    \ define functions. Anytime you're programming and you realize there is a sequence\
    \ of code you want to reuse, your first thought should be: I should put that code\
    \ in a function!\n\nSo let's define a function—call it update—we can use both\
    \ to tell the chart to update when a user clicks a year button and to tell the\
    \ chart to update 21 times in a row when a user clicks the play button. This will\
    \ really help simplify things when we actually start to build the play button.\n\
    \n```\nfunction update() {\n}\n```\n\nWhat should this function contain? Or better\
    \ yet, what should it do? The thing is, it has to be general—it needs to be able\
    \ to update the chart both when a user clicks a year button and when a user clicks\
    \ the play button. Hmm...so how we make it general? What about this: If we could\
    \ give our function a year, say 2035, and then it would update the chart to that\
    \ year?\n\n```\nfunction update(updateYear) {\n}\n```\n\nOkay, so what goes inside?\
    \ For starters, let's add everything that's inside of our event handler for buttons,\
    \ shown above.\n\n```\nfunction update(updateYear) {\nd3.select(\".*selected\"\
    )\n  .classed(\"selected\", false);\n\nd3.select(this)\n  .classed(\"selected\"\
    , true);\n\nyear = d;\npopData = data.filter(function(element) { return element.year\
    \ == year});\nbars.data(popData, keys)\n  .transition()\n  .duration(500)\n  .attr(\"\
    width\", function(d) { return x(d.value); });\n}\n```"
  merge: -1
