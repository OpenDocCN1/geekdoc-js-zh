    When you''re answering these kinds of questions, your editorial judgment has to
    come into play. What do you think are the most interesting things about your data?
    Who is your audience, and what do they want to know?


    With in mind, is it worth showing all of the five-year age groups? I would say
    it could be, because the 80 and older age group seems to be growing at a much
    faster rate than all the others. That''s interesting, and if you incorporate age
    group into a larger “60 and older” age group, that information will be lost. But
    if there is a chart that would work really well for this data set only the age
    group you are after, we might want to combine them.


    On the next question: Which year do we start with? I''m thinking we should start
    with 1950. That way we can show not only how the world is projected to age in
    the years to come, but how it has changed in decades past. Including those earlier
    years will show a longer-term trend and provide more context. It''s also true,
    of course, that past years are well, determining population figures for years
    gone by some assumptions of the UN, but not as many assumptions as it took to
    compute the projected populations of the future. We know more about the past than
    we do about the future, so the past figures are more solid, and adding more of
    them to better ground it in reality.


    So, which year do we end with? My thinking is that we don''t go all the way out
    to 2100, because the further you go out, the more tenuous the projections become.
    I think we should stop at 2050, for the somewhat arbitrary reason that, if we
    do, our data will end at a nice, even number, and over 100 years exactly. It is
    not so arbitrary reason to stop at 2050 that it''s only about 35 years in the
    future, the UN projects there will be significant change in the age composition
    of the world between now and then.'
