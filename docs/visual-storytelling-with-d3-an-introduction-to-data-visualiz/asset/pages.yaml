    Figure 2.13 A bar chart


    Like column charts, bar charts consist of rectangles that vary in length. The
    difference between the two is that, in a bar chart the bar can run horizontally
    (as in Figure 2.13) or vertically. Also, each bar typically represents a single
    category of a single element or dimension. In Figure 2.13 it is not included as
    a second dimension as it was in the column chart in Figure 2.5. Figure 2.13 simply
    presents the percentage of people who fall into each age category at a particular
    point in time (2010). This yields a simpler graph since you are not trying to
    compare age groups across time.


    > Note

    A on using bar charts and column charts: Because they both show data via the lengths
    of the rectangles, it''s important that the entire length of every rectangle is
    actually shown. In practice, what this means is that the scale should always start
    at zero and the longest bar or column should extend very close to the maximum
    width or height allowed in the space allowed.


    So how good is Figure 2.13? When it comes to showing with precision and clarity
    the age composition of a single year, it''s the best chart form we''ve seen so
    far. Yet it doesn''t allow us to compare across years, at least not as is. But
    dont fret: There''s a way we can make a bar chart that will.'
