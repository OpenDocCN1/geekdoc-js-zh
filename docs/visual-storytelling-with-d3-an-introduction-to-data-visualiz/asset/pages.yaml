  md: "# Chapter 6 Sizing Charts and Adding Axes\n\nWe also don't need that axisData\
    \ array anymore, so we can get rid of that,\ntoo:\n\n```\nvar axisData = {0, 2.5,\
    \ 5, 7.5};\n```\n\nAhhh...doesn't feel better?\n\n# Ordinal Scales and Axes\n\n\
    It might not be obvious, but our chart actually has two axes, not just one. We\
    \ have the\nx-axis, of course, is quantitative. Our bars jut out along that axis.\
    \ But we also\na y-axis, which is qualitative. Along the x-axis, position corresponds\
    \ to a percent-\nage value. But along the y-axis, position corresponds to an age\
    \ group (the top of the\nchart starts with \"80 and up\" and all the way at the\
    \ bottom is \"0–4\").\n\nD3 is also good at creating scales and axes that are\
    \ qualitative in nature. Such scales,\ncalled nominal or ordinal scales, are good\
    \ at mapping a set of discrete, often non-numeric inputs to a set of outputs you\
    \ can easily use to position stuff on the page.\n\nLet's start getting rid of\
    \ our axis labels entirely. All this code...\n\n```\nvar labelGroup = svg.append(\"\
    g\")\n  .attr(\"class\", \"bar-label\")\n  .selectAll(\"text\")\n  .data(popData)\n\
    \  .enter().append(\"text\")\n  .attr(\"x\", -10)\n  .attr(\"y\", function (d)\
    \ { return d.position*barSpacing + barHeight*(2/3) })\n  .text(function (d) {\
    \ return d.age; });\n```\n\n...scrap. What is shown in Figure 6.13 is, of course,\
    \ what you should see.\n\nNow as we did with the x-axis, let's create a scale\
    \ for our y-axis. Since\nthis is an ordinal scale, we won't use d3.scale.linear().\
    \ Instead, we'll use\nd3.scale.ordinal(). So, we want something like this:\n\n\
    ```\nvar y = d3.scale.ordinal()\n  .domain([])\n  .range([]);\n```\n\nWhat are\
    \ our inputs and our outputs in this case? The y-axis represents age group, we\n\
    want inputs to our age groups. We want an array like this to map our domain:\n\
    \n```\n[\"80 and up\", \"75 – 79\", \"70 – 74\", \"65 – 69\", \"60 – 64\", \"\
    55 – 59\", \"50 – 54\",\n\"45 – 49\", \"40 – 44\", \"35 – 39\", \"30 – 34\", \"\
    25 – 29\", \"20 – 24\", \"15 – 19\", \"10 –\n14\", \"0 – 4\"]\n```\n\nBut each\
    \ of those age groups is trapped inside an object that's part of the\nopData array.\
    \ How can we liberate them? JavaScript has a method called\nmap() that acts on\
    \ arrays and lets you reorganize them or extract subsets of them\nwith relative\
    \ ease. Try typing this into your console:\n\n```\npopData.map(function (element)\
    \ { return element.age; });\n```"
