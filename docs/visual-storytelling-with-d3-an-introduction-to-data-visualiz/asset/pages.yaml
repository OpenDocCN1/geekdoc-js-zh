  md: '# 1


    # Visual Storytelling and D3


    His first chapter serves as a very basic primer on data visualization, a survey
    of how to harness its power to tell strong visual stories, and a brief introduction
    to D3. It describes the qualities that make charts so uniquely good at conveying
    quantitative information. It includes a discussion of good visualization design.
    Finally, it introduces D3: what it does, what it does well, what you shouldn''t
    use it for, and the tools that you''ll need to get started.


    # Visualization, Visualized


    I could kick this introduction off with a paragraph or two describing how, in
    a world increasingly flush with data, data visualization is growing ever-more
    popular. I could cite some relevant stats, such as the fact that a free online
    course on data visualization offered at the beginning of 2013 attracted over 5,000
    students. I could assert that journalists, especially on the web, are increasingly
    using charts to tell their stories and support their arguments, that web developers
    and IT departments are looking for new ways to incorporate visualization into
    the products they produce. I could state that more than ever before, people who
    create content to make charts and visualizations, and their audiences want to
    look at them.


    But why make that point with words when a chart could do much better job? The
    line chart in Figure 1.1 shows that online searches for "infographic”—a pop term
    for charts and data visualizations (and also graphical marketing materials)—have
    increased 100-fold since the beginning of 2009. It shows that interest in infographics
    didn''t really take off until the beginning of 2010 but grew rapidly in the subsequent
    three years. It shows how in recent months, the frequency with which people search
    for "infographic" has fluctuated more in the past, potentially peaking in months
    when an especially popular infographic is published.


    It shows all of these things and more. The chart in Figure 1.1 tells a multifaceted
    story about people''s interest in infographics. And, in doing so, it demonstrates
    the online rise of the medium in a faster and more elegant way than a list of
    stats and claims ever could.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# 100 (represents peak search volume)


    ![](img/0772fde882e37540dc00155fda693004_23_0.png)


    **Figure 1.1** Infographics have grown pretty hip. Data from Google Trends.


    Indeed, it''s this peerless capacity to express information and tell data-rich
    stories that has earned charts and data visualization a spot in the limelight.
    They are popular, easier to make, and more useful than ever. And that''s why you''re
    here.


    # Charts Give Data a Form—That Form Tells a Story


    Why are charts so good at telling stories? Because charts give data a visual form,
    which we can interpret in detail, often at a glance.

    Take another look at Figure 1.1. Because I transformed the Google search data
    into a line chart—a standard graphical form—we have what looks like a partial
    drawing of a really jagged mountain instead of a list of numbers. This is really
    useful, because it makes thinking and talking about the patterns in the data as
    easy as thinking and talking about the shape of that mountain. It climbs steeply
    right there (2010), it peaks over late (2012), then drops off a little to the
    right... We''ve transformed Google search statistics into something we understand
    intuitively—height, or altitude.

    G data a form...that powerful stuff, even when it comes to topics that might seem
    boring or intimidating on the surface. For example, government debt. Believe or
    not, I''m not to show you a chart of US debt that will fascinate you—guaranteed.'
  merge: -1
