  md: "# Age distribution of the world\n\n1950 1955 1960 1965 1970 1975 1980 1985\
    \ 1990 1995 2000\n2005 2010 2015 2020 2025 2030 2035 2040 2045\n\nAGE GROUP PORTION\
    \ OF THE POPULATION\n\n![](img/0772fde882e37540dc00155fda693004_216_0.png)\n\n\
    You will notice that with our current transition, the bars seem to accelerate\
    \ at first and then slow down as they reach their width. The way an object eases\
    \ into and out of a transition like this is called easing, and it can be mathematically\
    \ described by what is called an easing function. D3 has few presets you can customize\
    \ that easing function to create different kinds of animations. For example, instead\
    \ of D3's default acceleration and deceleration, you can make our bars grow and\
    \ shrink at a constant speed by specifying that the easing function is linear:\n\
    \n```\nbars.data(popData)\n  .transition()\n  .duration(500)\n  .ease(\"linear\"\
    )\n  .attr(\"width\", function(d) { return x(d.value); });\n```\n\nOr you can\
    \ make them pull back and slingshot forward using the \"back\" preset:\n\n```\n\
    bars.data(popData)\n  .transition()\n  .duration(500)\n  .ease(\"back\")\n  .attr(\"\
    width\", function(d) { return x(d.value); });\n```"
  merge: -1
  pgno: 216
- img_proc: true
  md: "# 196 Chapter 8 Making Charts Interactive and Animated\n\nYou can enable the\
    \ transitions super wacky using the \"bounce\" preset:\n\n```\nbars.data(popData)\n\
    \  .transition()\n  .duration(500)\n  .ease(\"bounce\")\n  .attr(\"width\", function(d)\
    \ { return x(d.value); });\n```\n\nBut I would definitely caution against using\
    \ either \"back\" or \"bounce.\\ Although they are both really fun, they're super\
    \ distracting. If we were to use them with our age distribution chart, it's likely\
    \ that the person looking at the graphic would just start clicking at random to\
    \ see the bars spring forward or bounce a couple times when they come to a stop.\
    \ The graph would cease to be about age distribution at all and purely about how\
    \ the easing function itself looks.\n\nIt is best to stick with the default transition\
    \ in almost every case, unless changing the easing function somehow helps the\
    \ clarity of the interactive.\n\n# Using Keys\n\nOne final note on how to use-data\
    \ joins the right way. Let's say that for some reason, our data set is out of\
    \ order. In the CSV file, for some years, the first age group is \"0-4\" but for\
    \ others, it's either \"80 and up\" or one of the other age groups. Currently,\
    \ we compute the data-join to update our bars, the first data point is always\
    \ joined to the first bar, the second data point to the second bar, and so on.\
    \ If the data is out of order, this is a real problem.\n\nThe solution is to use\
    \ what are called keys. A key is a way of identifying an object based on the data\
    \ it is joined to. The right data always gets paired up with the keys the object\
    \ it belongs to.\n\nIn our case, we want the key to be the age group. Here's how\
    \ it works. First, we need to define a helper function to grab the key we want:\n\
    \n```\nfunction keys(d) {\n  return d.age;\n}\n```\n\nWhen the function keys()\
    \ is passed one of our data points, it will return the age group (which we've\
