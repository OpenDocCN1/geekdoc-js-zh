    # Inspecting SVG in the Web Inspector


    Now that we have an SVG circle in our browser, we can inspect it with the browser''s
    web inspector. I''ll be using Chrome in this book, but all modern browsers either
    have a built-in web inspector or a free plugin you can download. In Chrome if
    you rightclick on the circle and select "Inspect Element," the Developer Tools
    window will open. That markup in Figure 3.3 looks familiar.


