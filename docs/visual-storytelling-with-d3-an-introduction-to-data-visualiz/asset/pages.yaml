  md: '# Foreword


    D3.js has quickly risen to become the underlying tool of choice for building data
    visualizations in JavaScript. It was written by Mike Bostock as a successor to
    the Protovis visualization library that he had previously created. Unlike other
    JavaScript visualization libraries and Protovis before, D3 was designed to be
    a lower-level toolset for building visualizations or even for building higher
    level visualization libraries like Protovis. Because of this design philosophy,
    D3 gives programmers a much higher level of control over the structure, style,
    and behavior of their visualizations. This book was written to help you get into
    working effectively with D3 and its author, Ritchie King, has a unique perspective
    on visualizations.


    I first met Ritchie in 2011 when he was still a graduate student in NYU''s highly
    selective Science, Health and Environmental Reporting (SHERP). He had started
    his foray into data visualization but it was obvious he had a passion for it.
    A few years later, after he had graduated and was working as a reporter at Quartz,
    I bumped into him again. He told me about his work creating visualizations in
    D3 to go along with his reported stories and I realized that he would bring a
    fresh perspective to a book on D3. Instead of having a book written by a programmer
    about the mechanics of the library, it would be a book about conveying meaning
    through data visualization. It''s exactly what I was missing from the available
    D3 literature. Ritchie has moved from Quartz to doing fantastic data-driven reporting
    at FiveEight.com, and he''s brought experience to be in the content presented
    here.


    This book is a terrific resource for beginners and experienced programmers looking
    to how to create great looking visualizations with D3. It begins with a discussion
    of how to select a data set and visualization and moves into the HTML building
    D3 blocks with SVG: The focus on introducing SVG before diving into D3 gives the
    reader foundational knowledge that is invaluable when learning more advanced topics
    like adding axes and interactive visualizations. Ritchie''s writing style and
    focus on the visualization aspects of working with D3 make this book highly readable
    and much more than a basic tutorial on the specifics of the library. It''s the
    perfect introduction to visualizations for both beginners and I''m delighted to
    have it as part of the series.


    —Paul Dix

    Series Editor'
  merge: -1
