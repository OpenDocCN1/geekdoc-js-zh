  md: '# How attr() Works


    It''s worth looking into attr() works. You use attributes all the time in HTML,

    but like selectors, the term itself might not mean much to you. Attributes in
    HTML

    (and in SVG) in the start tag, and on the most basic level add additional

    qualities to the element in question or any formatting to it. They generally

    look like this:


    ```

    <tag attribute="value\></tag>

    ```


    Here are some examples of the attributes used in selections.html:


    | Markup | Attribute | Value |

    | --- | --- | --- |

    | <div id="header"> | id | "header" |

    | <svg width="500px" height="40px"> | width, height | "500px", "40px" |

    | <circle r="20" cx="50" cy="20"/> | r, cx, and cy | "20", "50", and "20" |

    | <div class="footer"> | class | "footer" |

    |


    attr() works by taking two arguments. The first argument is the name

    of the attribute and the second is the value. It then inserts that attribute/

    pair into the selected element in the DOM. So, for

    myCircle.attr("fill", "red"), it turns our circle element


    ```

    <circle r="20" cx="50" cy="20"/>

    ```


    ```

    <circle r="20" cx="50" cy="20" fill="red"/>

    ```


    But you do not have to take my word for it. selections.html Refresh and change

    till of the circle to red using attr(). Then inspect the circle using your web

    inspector. You should have it shown in Figure 4.10.


    (Recall that <circle> is equivalent to <circle></circle>). Now, you want

    to change the radius of the circle. The thing is, the circle element already has

    an r attribute. What does attr() do in this case? Don''t worry: It''s smart enough

    to simply change the value of an attribute that is already defined. If you type
    in

    myCircle.attr("r", 5), you will get


    ```

    <circle r="50" cx="50" cy="20" fill="red"/>

    ```


    and not


    ```

    <circle r="20" cx="50" cy="20" fill="red" r="5"/>

    ```


    A quick note on conventions: Inside the element, the attribute names are never
    in

    quotes but the values always are. In the markup, we have r="5" instead of r=5
    or

    "r="5". However, in our D3 code, we always put the attribute name in. Why?

    Because other JavaScript will think the attribute name is a variable. If we typed

    myCircle.attr(r, 5), the browser would look for a variable within your JavaScript
    code

    called r. After not finding one, it would return an error. So, you have to pass
    in'
