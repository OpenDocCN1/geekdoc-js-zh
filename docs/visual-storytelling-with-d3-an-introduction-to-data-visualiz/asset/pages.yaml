    much easier to interpret. You can see immediately that the portion of 0 to 19
    years old is shrinking and the 60 and above crowd is growing. As a chart form,
    the stacked column chart also does a much better job of conveying a sense of position.
    It is immediately obvious that the different colors represent parts of a whole,
    whereas in Figure 2.3 it is not.


    But the stacked column chart has one drawback, compared to the normal column chart.
    Look at the year 2050. If you had to rank the different age groups from smallest
    to largest, what would you say? It''s really hard to compare the values in a year,
    especially when they are close. The reason is that it''s difficult for us to determine
    the difference in length between two objects when they aren''t lined up. (W. Cleveland
    and R. McGill, Graphical Perception: Theory, Experimentation, and Application
    to the Development of Graphical Methods, Journal of the American Statistical Association,
    V. 79, No. 387, 1984.) In the column chart in Figure 2.3, all of the columns are
    flush with the baseline at the bottom, so we can compare the length of any two
    by just looking to see which one stands taller. But our ability to compare lengths
    is greatly compromised when we stack columns on top of each other.


    Given this choice between only the column chart and the stacked column chart,
    which would you choose? Because there are trade-offs between the two, your editorial
    judgment has to come into play. If your goal is simply to answer the question
