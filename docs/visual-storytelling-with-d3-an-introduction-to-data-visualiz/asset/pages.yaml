  md: "# # Building a Bar Chart in SVG\n\nNow we have all the tools we need (more\
    \ even) to build a basic bar chart in SVG. So, let's take a look at the population\
    \ distribution around the world in 2010.\n\n| Age Group | Percent of Population\
    \ |\n|---|---|\n| 0–4 years old | 9.3% |\n| 5–9 | 8.8% |\n| 10–14 | 8.6% |\n|\
    \ 15–19 | 8.80% |\n| 20–24 | 8.90% |\n| 25–29 | 8.10% |\n| 30–34 | 7.30% |\n|\
    \ 35–39 | 7.10% |\n| 40–44 | 6.60% |\n| 45–49 | 6.00% |\n| 50–54 | 5.10% |\n|\
    \ 55–59 | 4.50% |\n| 60–64 | 3.40% |\n| 65–69 | 2.60% |\n| 70–74 | 2.10% |\n|\
    \ 75–79 | 1.50% |\n| 80 and up | 1.60% |\n\nRecall from the previous chapter that\
    \ we decided to make this bar (instead of vertical) bar chart, and that the 80\
    \ and up age group will go on top and 0-4 will go on the bottom. Here's the snippet\
    \ that we need to get started. Let's call our file `pop2010.html`:\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<style>\n</style>\n</head>\n\
    <body>\n  <svg width=\"500px\" height=\"500px\">\n    <!-- 80 and up --\n    <rect\
    \ x=\"0\" y=\"0\" height=\"20\" width=\"500\"/>\n    <!-- 75-79 --\n    <rect\
    \ x=\"0\" y=\"25\" height=\"20\" width=\"500\"/>\n    <!-- 70-74 --\n    <rect\
    \ x=\"0\" y=\"50\" height=\"20\" width=\"500\"/>\n    <!-- 65-69 ---->\n```"
