  md: "# Summary 197\n\n```\n.enter().append(\"rect\")\n.attr(\"x\", 0)\n.attr(\"\
    y\", function(d) { return y(d.value)})\n.attr(\"width\", function(d) { return\
    \ x(d.value)})\n.attr(\"height\", y.rangeBand());\n// ...\nbuttons.on(\"click\"\
    , function(d) {\n  // ...\n  bars.data(popData, keys)\n  transition()\n    .duration(500)\n\
    \    .attr(\"width\", function(d) { return x(d.value); });\n});\n```\n\nAnd that's\
    \ it! Now our data can be completely out of order and it won't matter in the strictest.\
    \ Phew!\nBut keys can do a lot more than help you avoid getting burned when your\
    \ data is dirty. They help transitions the way you want them to. Think about Frank’s\
    \ data for a second. Between February and March, Jennifer Aniston goes from the\
    \ most featured celebrity on tabloid covers to the second most (the \"Octomom\"\
    \ edges her out in March). If you updated the data from February to March without\
    \ using keys, the text object in the number one spot would actually change from\
    \ reading \"Jennifer Aniston\" to \"Octomom\". If you use a key, then you can\
    \ simply update the position of the \"Jennifer Aniston\" text object from the\
    \ top spot to the second spot—you can make it slide seamlessly down the ranking.\n\
    \nThe difference is between object constancy and object inconsistency. Using a\
    \ key, you can locate the \"Jennifer Aniston\" text object and update it with\
    \ new data. As an object, it will always be the \"Jennifer Aniston\" object. It's\
    \ constant. But if you don't use a key, then the \"Jennifer Aniston\" object will\
    \ become the \"Octomom\" object as you switch from February to March. It's inconsistent.\n\
    \nObject constancy is a good thing. Think about it in the theater metaphor. You\
    \ wanted a actor to keep playing the same role as he or she moves about the stage.\n\
    \n# Summary\n\nIn this chapter, we opened with a conceptual introduction to the\
    \ update and exit phases of the data-join and then applied those concepts to our\
    \ age bar chart. The goal was to make it interactive. We added a series of buttons,\
    \ one for each year, and then made them clickable. Then we made the chart update\
    \ with new data every time one of the buttons was clicked. We added an animated\
    \ transition to make the chart flow smoothly from one year to another. Finally,\
    \ we used keys to ensure the object constancy of the bars on our page."
