  md: 'names, too, but if they aren''t named in the CSV, then they will just be numbered.
    You can see that the names of our columns look little funny. R doesn''t allow
    column names to start with a number, and when you read in a CSV file it prepends
    an "X" to all of those names. It also doesn''t like dashes, or hyphens, in column
    names, because they are reserved for subtraction. So it replaces them with periods.
    We will change those values later, but first let''s do some melting!


    Type this into the console: dataMelt <- melt(data, id="year"). Then type dataMelt
    to inspect what just happened (shown in Figure B.28).


    Amazing, now? There is only one data point per row, and each row includes the
    associated year and age group. You might be wondering what the deal is with the
    argument id="year". In our original data frame, called data, the year already
    existed


