  md: '# The Example We Will Build In This Book


    27


    # Note


    Personally, I make a lot of charts in R and then pull them into a program such
    as Inkscape or Adobe illustrator to put the final touches on. In fact, that''s
    exactly how I made the charts in the previous section, and for those of you who
    have used ggplot2, you''ll recognize the color scheme.


    But as you gain experience, you''ll gain an intuitive sense of what will work
    and what won''t, before you start plotting. In the meantime, there''s a handy
    diagram that you can use to get started choosing a form. It is shown in Figure
    2.15 and was created by Dr. Andrew Abela (http://extremetype.typep/blog/2006/09/choosing_a_good.html),
    a marketing professor and dean of business school at Catholic University of America
    in D.C.


    As the title says, this diagram is really just a thought starter. You shouldn''t
    feel bound to it. But if you don''t have a lot of experience designing data visualizations,
    it can help you gain a sense of what is appropriate to use which of the most basic
    chart forms.


    # Note


    An important note: The chart suggestions diagram says nothing about animation
    or interactivity. It assumes that the final product of your work as a chart designer
    will be an unmoving, clickable chart, probably existing as an image file or embedded
    in a presentation. When animation and interactivity are on the table, the scope
    of what you can and cannot do changes entirely.


    # The Example We Will Build in This Book


    So what should we do with this population data? We talked about a few good options
    in the previous section. But I don''t think we should go with any of them! Well,
    not exactly, anyways.


    The data visualization we are going to spend pretty the remainder of the book
    building is going to look like the one shown in Figure 2.16.


    It looks almost identical to the single bar chart in Figure 2.13. But there are
    a couple of differences. First, the order of the age groups is flipped. Why? Because
    when it comes to age distribution charts, it''s a bit of a convention to have
    the oldest age group on top and the youngest on the bottom. More importantly,
    the chart will be interactive. Notice that it says, "PLAY ALL YEARS," and the
    two rows contain all the years in our dataset. On the chart you''ll be building,
    these years will be clickable, and when one of them is clicked, the bars will
    grow and shrink until they are the right length for the selected year. When "PLAY
    ALL YEARS" is clicked, the chart will be set to 1950, and then advance automatically
    through each of the subsequent years to show the age distribution has changed
    over time.'
