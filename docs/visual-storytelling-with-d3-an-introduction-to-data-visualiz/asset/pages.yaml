  md: '# About the Author


    Ritchie S. King is a reporter and visual journalist at FiveThirtyEight.com, focusing
    on data visualization and interactive features. Prior to that, he occupied a similar
    role at Quartz (qz.com). In a previous life, he was a chemical engineer at a startup
    that was trying to turn wood chips and switchgrass into fuel. Though he left the
    world of engineering to become a journalist, he''s still into math and likes to
    muck with data. His stories and graphics have appeared in the New York Times,
    Bloomberg Businessweek, Popular Science, and IEEE Spectrum.'
