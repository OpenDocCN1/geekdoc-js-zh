    involves all the most fundamental aspects of using data-joins. To build our truly
    age distribution bar chart, we are indeed going to use data-joins, but not all
    aspects of them. So, although it''s a bit of diversion, introducing a new example
    will help us cover the entire breadth of what data-joins are.


    This chapter only covers part of what data-joins can do, specifically the enter
    part of their life cycle. But we''ll come back to this same example to cover update
    and exit in Chapter 8.


    Okay, here goes: Say you have a friend named Frank, Frank has a strange obsession
    with celebrity gossip magazines and tabloids. Us Weekly, People, the National
    Enquiry--if it''s a publication you''ve stared at idly while waiting in the grocery
    store checkout line, then Frank has a keen in it. The thing is, he doesn''t really
    care about the latest updates on Kim and Kanye. He wants to know one thing: Who''s
