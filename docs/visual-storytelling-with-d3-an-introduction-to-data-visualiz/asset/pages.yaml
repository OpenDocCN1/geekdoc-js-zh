  md: '# Finding a Data-Driven Story and Telling It Visually


    How do you find a data-driven story and how do you design graphics that will tell
    story well? This chapter focuses on those two questions. It does so by by introducing
    an example story idea, describing how to find relevant data, and then discussing
    possible ways to visualize data. The example will extend well beyond this chapter.
    In fact, the rest of the book will explain how to build one of those visualizations
    using D3.


    # Getting Started


    So you want to make a data visualization. Great! But where do you begin? How do
    you find a story, rich in data, to tell in graphics?


    Typically, your data-driven story will have one of two beginnings: It''ll start
    with either a dataset or a question.

    New datasets are being released and updated all of the time. For example, New
    City has a nonempty municipal hotline (the number is 311) that residents call
    to, lodge a noise complaint, report an illegally parked vehicle, or notify authorities
    of a stray animal. The city maintains a running list of all these calls: which
    kind of complaint each call was, which city agency the call relayed to, the location
    of the complaint, etc. This list is updated every day and is publicly available.
    As a data storyteller, you can at any point decide, "hey, I''d like to do something
    with 311 data," or "maybe it''s about time I updated my 311 graphic."


    If you are starting with a question, which is usually quantitative in nature,
    naturally. “How much does a musician typically make off her music from album sales,
    concert tickets, and streaming services such as Spotify?” That''s a question.
    And because it starts with the words "how much," it''s fairly ripe for data visualization
    treatment.


    If you start with a question, you have to search for data that can answer it.
    Once you find that data, you are essentially where you would have been if you
    started with a'
