  md: '# Chapter 4 Shaping Web Pages with D3 Selections


    ```

    d3.select("p").attr("style", "font-family: Arial");

    ```


    Not bad, but D3 has a better method for styling HTML elements—style(). With style(),
    you can change the font of the first paragraph by typing:


    ```

    d3.select("p").style("font-family", "Arial");

    ```


    The method is just like attr(), but it assumes you are talking about the style
    attribute and takes the property name and property value as its two arguments.
    The result is code that is both simpler and easier to read.


    # D3 Strives to be Declarative


    The attr() and style() methods are designed to be really straightforward to use.
    If you want the fill of your selection to be red, you type attr("fill", "red");
    If you want the font family of your selection to be Arial, you type style("font-family",
    "Arial"). Simple pretty.


    D3 is all about what is declarative programming: You tell your machine what you
    want to happen instead of telling it how to make it happen. With attr() you make
    the attribute and D3 takes care of the rest.


    Declarative code is not only simpler to write, it''s also a lot easier to read.
    If you''re looking back at your code and you


    ```

    myCircle.attr("fill", "red");

    ```


    it''s obvious what''s going on.


    # Chaining Methods


    One nice declarative feature of D3 is that it allows you to chain methods together
    (if you''ve ever used jQuery, method chaining should be familiar to you). As an
    example, let''s go back to your SVG circle. Refresh selections.html in your browser.
    Create a selection for the circle and again call it myCircle:


    ```

    var myCircle = d3.select("circle");

    ```


    Okay, let''s say you wanted to change the color of the circle''s attributes. Here''s
    how you might do it based on what we''ve learned so far:


    ```

    myCircle.attr("fill", "red");

    myCircle.attr("r", 10);

    myCircle.attr("stroke", "black");

    myCircle.attr("stroke-width", 2);

    ```


    This should yield what is shown in Figure 4.11.


    This worked, but there''s an easier way: You can simply type out one long statement
    by chaining the methods. So instead, try:'
