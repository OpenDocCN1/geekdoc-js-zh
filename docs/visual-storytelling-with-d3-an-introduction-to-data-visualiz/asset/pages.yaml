  md: "# Chapter 9 Adding a Play Button\n\n```\nbuttons.on(\"click\", function(d)\
    \ {\n  update(d);\n  clearInterval(playInterval);\n});\n```\n\nBy, course, playInterval\
    \ variable is currently only defined inside of the play button's event handler.\
    \ The year button's event handler has no access to it. That's an easy fix. All\
    \ we have to do is declare the variable playInterval outside of the play button's\
    \ event handler.\n\n```\nbuttons.on(\"click\", function(d) {\n  update(d);\n \
    \ clearInterval(playInterval);\n});\n```\n\n```\nvar playInterval;\nplayAll.on(\"\
    click\", function() {\n  var i = 0;\n  playInterval = setInterval(function() {\n\
    \    update(buttonYears[i]);\n\n    i++;\n\n    if(i > buttonYears.length - 1)\
    \ {\n      clearInterval(playInterval);\n    }\n  }, 700);\n});\n```\n\nAnd that's\
