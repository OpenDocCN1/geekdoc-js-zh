  md: '# 8

    Making Charts

    Interactive and Animated


    In this chapter, we will cover the update and exit phases of the data-join. I''ll
    explain them first on a conceptual level, using the fanciful example of Frank''s
    tabloid cover data. Then, we''ll learn how to apply these concepts to make the
    age distribution bar chart interactive.


    # Data-Joins: Update and Exit


    In Chapter 5, we covered the enter phase of the data-join. In this chapter, we''re
    going to cover both update and exit phases.

    Let''s go back to tabloid cover data set you got from quirky buddy of yours, Frank.
    Now might be a good time to take a look at Chapter 5 and the first three months
    of Frank''s data and what we''ve done with it so far. Here, we''re going to pick
    up where we left off.


    So, we''ve made the data from January enter the page and we''ve turned it into
    a bunch of text elements. We didn''t actually walk through to set the text or
    the position of elements in Chapter 5, but you should have an idea of how to do
    that based on what we''ve won with our age distribution chart. As we walk through
    update and exit we''re going to leave that part out again just to simplify things.

    Figure 8.1 presents a diagram of where we left off.


    There are text elements on the page, for each of the data points in jData. Now
    say we want to update the page so that it shows the data for February. Just as
    with enter, we select the text elements on the page and then use data() to perform
    a data-join. The difference is, this time there are already text elements on the
    page. So, instead of creating new elements, we are going to bind some of our data
    to elements that are already there (Figure 8.2).


    This is update. We are updating the elements on the page with new data. Now we
    can tell the text at the top to read "Jennifer Aniston" instead of "Angelina Jolie"'
