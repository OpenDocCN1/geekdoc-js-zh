    The line chart in Figure 2.10, on the other hand, is really good at showing both
    the trends of all the age groups over time and allowing you to compare the relative
    values of each age group for any year.


    # Showing the Data as a Pie Chart


    Now, let''s say we wanted to really focus on the age breakdown of the world in
    an individual year. How might we go about that? We could try a pie chart, as in
    Figure 2.11.


    Pie charts are pretty controversial in the data visualization world—and for good
    reason. On one hand, the pie chart is arguably the least intimidating of all chart
    forms, which makes it a tempting option for any designer worried about frightening
    or boring their audience. On on the other hand, pie charts are really pretty bad
    at displaying data.


    ![](img/0772fde882e37540dc00155fda693004_43_0.png)


