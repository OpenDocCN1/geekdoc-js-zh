  md: "# Building a Bar Chart in SVG\n\n![](img/0772fde882e37540dc00155fda693004_76_0.png)\n\
    \nFigure 3.26 Better\n\nSay we want the whole thing to be 400 pixels wide. The\
    \ largest value, and thus the biggest bar, in our data set is 9.3, the percentage\
    \ of the world's population that is between 0 and 4 years old. So we want a value\
    \ of 9.3 to translate into 400 pixels. How do we do that? Multiplication again:\
    \ 400 divided by 9.3 is 43.0. If we multiply all of the values by 43, then we'll\
    \ re-size the whole thing proportionally and the largest bar will be 400 pixels\
    \ wide.\n\nWe could do the math for each of the values in our data set, and set\
    \ the widths accordingly. An easier way to do it is to put all of the <rect> elements\
    \ into a group and then use the scale transform function, like so:\n\n```\n<svg\
    \ width=\"500px\" height=\"500px\">\n  <g transform=\"scale(43,1)\">\n    <!--\
    \ 80 and up --\n    <rect x=\"0\" y=\"0\" height=\"20\" width=\"1.6\"/>\n    <!--\
    \ 75-79 --\n    <rect x=\"0\" y=\"25\" height=\"20\" width=\"1.5\"/>\n    <!--\
    \ 70-74 --\n    <rect x=\"0\" y=\"50\" height=\"20\" width=\"2.1\"/>\n    <!--\
    \ 65-69 --\n    <rect x=\"0\" y=\"75\" height=\"20\" width=\"2.6\"/>\n    <!--\
