  md: '# Data-Joins: Enter


    Data-joins are the bread and butter of D3. If you take one thing away from this
    book, make it understanding how data-joins work and how to use them. Remember
    that D3 has no basic function for producing charts. Instead, it uses data-joins.
    This chapter covers how to use data-joins to add elements to a webpage and then
    manipulate them with data.


    # What Are Data-Joins?


    As the name suggests, data-joins involve joining data with something. That something
    is an element or a number of elements on a web page—rect, circles, div—all the
    usual suspects. More specifically, that is a D3 selection of those elements.


    Before we get into all of that, let''s take a few steps back. Forget about D3
    for a second. Now, imagine an interactive graphic. It could be one you''ve seen
    somewhere or made yourself, or it could be one you invent in your mind right now.
    In this graphic there are shapes that represent data and there are buttons for
    controlling what data displayed. When you hit those buttons, the shapes change:
    their positions shift, they grow or shrink, they change color, or they can even
    fly off the screen altogether. Make it as crazy as you like.


    Now, how matter complicated or data-rich your graphic is, on a fundamental level,
    the shapes involved (or lines, text, colors, or textures) only ever do one of
    three:


    +   Appear on the page in the first place—You can''t have a data visualization
    without both data and visuals, so the shapes need to show up.


    +   Change—When you hit a button or adjust a slider, attributes of the shapes
    update the new data you want to see.


    +   Leave the page—Sometimes a shape or two will leave the page entirely, if the
    data that it represents is no longer relevant.'
