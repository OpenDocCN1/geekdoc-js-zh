  md: '# Note


    We can chain the .domain() and .range() methods just as we have been chaining
    .attr(), .text() and many of the other D3 methods we''ve been using.


    Before we figure out what to put inside our arrays, a brief word on domain versus
    range. The domain represents the input (your data) and the range represents the
    output (which is usually how you want to show the data on the page). It''s easy
    to get the two confused, so I like to use a mnemonic to keep them straight. My
    psych 101 professor always used to say that, the weirder a mnemonic device, the
    easier it is to remember. So here goes:


    When you think range, you should think home on the range, which will make you
    think home, which should make you think home page, which you can simplify to just
    page. So, the range is related to the page. The range is the output you need to
    position things correctly on the page.


    Okay, back to our scale. The domain needs to contain our data, and the range needs
    to contain our area. Let''s start with the range. The array we use for the range
    should define our extremes. These should be obvious. For the left extreme, we
    should have 0 (because our skniest bar has no width), and on the right extreme,
    we should have the entire width of our charting area (because we still want the
    largest bar to fill the entire width). Remember, we''ve already defined the width
    of our charting area as:


    ```

    var x = d3.scale.linear()

    .domain([])

    .range([0

    ```


    Now, what about the domain? For the left extreme we should also have 0, because
    if we input a data point of 0, it will result in a bar of no width. What the large
    extreme? We follow the same logic we did when we set up the scaleVariable—we use
    the largest value in our data set, which we can determine using d3.max().


    But instead of just looking at our data and determining the largest value, we
    use D3 to do that for us, using the method d3.max():


    ```

    d3.max(popData, function(element) (return element.value))

    ```


    d3.max() works by two arguments. The first is an array. The second is an anonymous
    function you can use to tell d3.max() which values to consider when calculating
    the maximum. In our case, the array we are interested in is, of course, popData—the
    array of objects housing our data. But we don''t want the maximum value associated
    with any property, we only want the maximum value associated with the value property.


    That''s where anonymous function comes into play. You''ll notice that function
    takes an argument, element. Inside of the anonymous function, element represents
    every element of the array that is passed to d3.max(). By telling the anonymous
    function to return the element value, we are telling d3.max() to look at the value
    property of every element in the array popData.'
