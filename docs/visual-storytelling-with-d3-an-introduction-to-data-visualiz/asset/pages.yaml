  md: '# Preface


    Data, data, data. Piles and gobs of it are amassed everywhere faster than ever
    before. And with this grand swelling of information has come a sudden rise in
    the need for a discipline over two centuries old: Data visualization, the craft
    of communicating patterns and trends in raw data by transforming it into visual
    displays.


    Traditionally, such displays have been rendered in ink, drawn onto the pages of
    books, newspapers, and academic journals, and frozen at the time of their printing.
    But more and more, data is being transformed into pixels and published online
    in interactive displays the viewer can change with the click of her mouse. Any
    modern practitioner of data visualization needs a tool to assist with that transformation—from
    information to a web page and from raw, immutable numbers to animated graphics.


    Enter D3. Short for Data-Driven Documents, D3 not only helps information into
    pixels, it enables you to create and manipulate web pages and graphics entirely
    based on data. It is a fantastic tool, and is exactly what the world, or at least
    the world of data visualization, needs.


    First developed in 2011 by Stanford graduate student Mike Bostock, along with
    his advisors Jeffery Heer and Vadim Ogievsky, D3 is a freely available extension
    of JavaScript, a programming language that is absolutely ubiquitous on the Internet.
    The basic idea behind D3 is: It provides a way to join data with elements on a
    web page and then manipulate those elements based on that data. Say you have five
    numbers you want to turn into a bar chart. All you need to do in D3 is join them
    up with five rectangle elements, then set the width of each rectangle to be proportional
    to the number it''s connected to. It''s really as simple as that.


    # Goals and Audience


    Well, that''s not quite true. D3 isn''t easy. It is immensely powerful, but learning
    it can be a challenge. Fortunately, there are countless tutorials and examples
    freely available online, and many of the best ones were written by Mike Bostock
    himself. Still, although there is a vast and wavering D3 ecosystem out there,
    getting started can require a bit of work, especially if you don''t have a lot
    of experience with JavaScript.


    My main goal in writing this introductory textbook is to cover the D3 fundamentals
    in an accessible but nevertheless comprehensive way. (I am assuming you have some
    experience with HTML and CSS coming into this. If you don''t, I highly recommend
    you get up to speed on the basics.) My hope with this book is that it will'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Preface


    get you to a place where you can readily interpret and learn from the code examples
    of others—in other words, a place from which you can comfortably enter the D3
    ecosystem.


    The book also has a secondary goal: to cover some basic principles for making
    good data visualizations. Bad charts and infographics are rife on the web, even
    though data visualization, like any craft, has a set of best practices and time-honored
    techniques. In a sense, every visualization tells a story, if you''re planning
    on making one, it''s crucial to think carefully about what story you want to tell
    and how best to tell it if you want your visualization to be good. Hopefully this
    book will give you a few ideas for how to go about doing that.


    # How This Book Is Structured


    The organization of the book is fairly straightforward—it simply walks through
    the entire process of building an animated, interactive graphic in D3, including
    the initial conception of that, finding the right data to use, and coming up with
    a strong design. As the process and the book advance, each subsequent chapter
    adds a layer of sophistication. Here are more details on what each chapter contains:


    +   Chapter 1: Visual Storytelling and D3—This first chapter provides a brief
    introduction to data visualization and why it''s a powerful means of communication.
    It also introduces D3 and discusses what makes it an excellent tool for visualizing
    data on the web.


    +   Chapter 2: Finding a Data-Driven Story and Telling It Visually—This chapter
    covers how to find and tell a data story, getting your hands on the relevant data
    and some style guidelines for making strong visualizations. The example chart,
    an interactive multi-year bar chart of the world''s age distribution that is built
    throughout the rest of the book, is introduced.


    +   Chapter 3: Scalable Vector Graphics—Chapter 3 is an introduction to scalable
    vector graphics (SVG), a standard for creating beautifully rendered graphical
    elements, which D3 can manipulate with ease. Part of the example chart is built
    entirely in SVG in this chapter.


    +   Chapter 4: Shaving Pages with D3 Selections—Getting started with D3 and using
    it to select and manipulate elements on a page is the subject of Chapter 4. The
    SVG chart from Chapter 3 is recreated with D3.


    +   Chapter 5: Data-Joins: Enter—Chapter 5 provides an introduction to the heart-and-soul
    of D3, data-joins. Again, data-joins are used to recreate the example chart.


    +   Chapter 6: Sizing Charts and Adding Axes—D3''s methods for automatically scaling
    charts and generating axes are covered and applied to the example chart.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '+   • Chapter 7: Loading and Filtering External Data—Creating charts from external,
    standalone datasets is something you''ll do all the time with D3. This chapter
    explains how to do it and why D3 loads data asynchronously.

    • Chapter 8: Making Charts Interactive and Animated—In this chapter, interactive
    buttons (one for each year in the data set) are added to the example chart, as
    are transitions, which cause the bars of the chart to grow and shrink in response
    to the buttons clicked.

    • Chapter 9: Adding a Play Button—A play button, which, upon being clicked, automatically
    cycles through all of the years in the dataset is built.

    • Chapter 10: Striking Out on Your Own—The book ends with a wrap-up chapter that
    provides some guidance on how best to enter the D3 ecosystem.\• Appendix A: JavaScript
    for Beginners—This appendix serves as a brief introduction to some JavaScript
    basics for the uninitiated.

    • Appendix B: Cleaning the Population Distribution Data—Appendix B provides step-by-step
    instructions for how to download and clean the sample dataset used to build the
    example in the book.


    Note that while the book is in color, certain Kindle devices do not display color,
    so the digital edition of this book will appear in grayscale on those devices.


    # # Conventions


    Code listings and inline code and function names will appear in a monospaced font
    like this.


    # # A Final Word


    I was still very much a D3 beginner when I set out to write this book. I bring
    that up for two reasons. One is that, as I was writing, the things that initially
    confused me about D3 were still fresh in my mind and I did my best to address
    them. I hope I was successful. The second is to say that you can do this. If I
    was able to do it, then I know you can do it too.'
  merge: -1
