    }\n```\n\nFigure 8.13 shows the result.\n\n# Making the Buttons Clickable\n\n\
    Now that we have the buttons on the page, we need to make them functional. How\
    \ do we tell a button to do something when it is clicked? By using an **event\
    \ handler**.\nAs the name suggests, an event handler handles events, or actions,\
    \ on the part of the user. It listens for an event, and when that happens, it\
    \ tells the browser to do something. Clicking is an event. So we is hovering the\
    \ cursor over an element. In our case, we are interested in clicking.\n\nTo set\
    \ up an event listener for a given element, D3 has the method on (). If we want\
    \ to set up an event listener for our buttons, this is what it would look like:\n\
    \n```\nbody.append(\"div\")\n  .attr(\"class\", \"buttons-container\")\n  .selectAll(\"\
    div\").data(buttonYears)\n```"
