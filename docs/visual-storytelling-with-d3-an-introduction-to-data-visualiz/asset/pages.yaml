  md: '# Chapter 1 Visual Storytelling and D3


    You can peek at it right now, if you like. Just to go to http://d3js.org/d3.v3.js.
    There''s version 3...open source, as advertised.


    So how do you access it? You access it by creating a webpage that runs JavaScript
    Script. When you write browser d3.js, it learns all of D3''s functions and methods
    so you can use them in your own code. If somebody looks at your webpage, browser
    will be directed to d3.v3.js, and then it will too understand D3''s functions.


    Those functions are powerful. D3 is definitely a library that enables coders to
    use JavaScript in a completely different way.


    Its biggest innovation is right there in the name: data-driven documents. D3 makes
    it to bind data to web documents and use the data to manipulate documents. A web
    document is technically anything that can be loaded and rendered by a browser.
    This includes any HTML webpage, but also, importantly SVG, or vector graphics.


    You may have worked with SVGs before. If you''re a designer, then the chances
    are close to 100%. SVG is a vector graphics format: The resolutions of SVGs are
    self-adjust for any zoom level, they never look pixelated. Underlying these graphics
    is a web document encoded in a markup language that is very similar to HTML. Instead
    of <p> tags for paragraphs and <h1> for headers, SVG has a <circle> tag for circles
    and a <line> tag for lines.


    One of the things that makes D3 so great for data visuals is that you can use
    it to marry data with an SVG document, which means you can join individual data
    points to SVG elements such as circles, rectangles, and polygons. You can then
    format and position these elements based on the joined data.


    I''m going to say this just to make sure it hits home. D3 enables you to directly
    set the attributes of graphical elements in SVG, a gorgeous web-based format,
    according to numbers in a data set! When you use D3, you are using data to directly
    control exactly what your browser is displaying. And that is D3 in a nutshell.


    # Things You Designers Will Love about D3


    If you''re a designer and you have a lot of experience with tools like Adobe Illustrator
    or Inkscape, then you''ll love D3 for how elegantly you can create, destroy, and
    format SVG elements. You''ve no doubt downloaded SVG files from the web countless
    and messed around with them in your design software. With D3, you''ll be digging
    down to the SVG markup itself, perhaps for the first time, the logic and naming
    conventions will be familiar. The interior color of a shape is called the "fill,"
    and the line around the perimeter is called the "stroke." You can group objects
    together, and make gradients, create clipping paths, and change the opacity of
    things. Once you learn the basic syntax, the rest will be second nature.


    # Things You Coders Will Love about D3


    If you''re a coder, you''ll love D3 for leveraging the power of existing web standards
    like HTML and SVG, instead of relying on plug-ins or a proprietary framework.'
