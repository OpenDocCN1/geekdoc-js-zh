  md: '# Chains and Variable Assignment


    One last thing about chaining methods: You can actually create a selection, apply
    a chain of methods to it, and assign selection to a variable all in one fell swoop.
    For example, in


    ```

    var myCircle = d3.select("circle")

    .attr("fill", "red")

    .attr("r", 10)

    .attr("stroke", "black")

    .attr("stroke-width", 2);

    ```


    the circle selection is created, all of the attribute changes are applied, and
    then it is assigned to the variable myCircle for later use.


    If a new selection is introduced in the middle of your chain, then whatever the
    working selection is at the end of the chain will be assigned to the variable.
    For example, in


    ```

    var myGraf = d3.select("#header")

    .style("background-color", "BlanchedAlmond")

