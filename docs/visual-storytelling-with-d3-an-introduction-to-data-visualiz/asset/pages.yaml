  md: '# Writing JavaScript in Markup and .js Files


    when you''re dealing with numbers. When you''re dealing with strings, it means
    concatenation. So, "concat" + "enation" will evaluate to "concatenation." If you
    try adding a number to a string, then JavaScript will convert the number into
    a string and then concatenate the two. But if you try multiplying a number and
    a string, JavaScript will try to convert the string into a number before completing
    the operation.


    Listing A.5 Examples of automatic type conversion.


    ```

    "I have " + 5 + " dogs";

    "5" + 5;

    "5" * 5;

    5 * "dogs";

    ```


    > Note

    NaN means "Not a Number."


    We went through basics pretty quickly. There are a lot of lessons hidden in the
    examples that weren''t spelled out explicitly, so it''s worth spending some time
    with them. JavaScript is a truly quirky language. Sometimes those quirks make
    it simpler to use than other languages, but other times they can lead to copious
    head scratching. If you want to learn more, Marjin Haverbeke has written an excellent
    book on the weirdness that is JavaScript Eloquent JavaScript. The full text is
    available online at http://eloquentjavascript.net/


    # Writing JavaScript in Markup and .js Files


    So far, we''ve been doing all of our JavaScript coding in the browser''s console.
    But, of course, when you design a web page for somebody else to look at, you won''t
    have access to that person''s console, and you''ll need the browser to load all
    of the page''s JavaScript with the page itself. As mentioned, there are two ways
    to do that: You can put JavaScript directly into the markup, and you can create
    a separate JavaScript file.


    To put JavaScript in your markup, you need to use a <script> tag. Let''s create
    a new HTML document and call it js-basics.html (see Listing A.6).


    Listing A.6 Writing script directly in your markup.


    ```

    <!DOCTYPE html>

    <meta charset="utf-8">

    <body>

    <script>

    var myVar = "Voila! It worked!";

    </script>

    </body>

    ```'
