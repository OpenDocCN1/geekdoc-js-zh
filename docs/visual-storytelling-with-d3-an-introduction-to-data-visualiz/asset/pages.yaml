- img_proc: true
  md: 'can make your life a lot easier—one, they make it insanely easy to create axes.
    But enough background already, let''s get our hands dirty.


    Open up the console in **pop2010-data-joins.html**. We aren''t going to manipulate
    anything on the page, we''re just going to mess around with D3 in the console,
    which we can do because **pop2010-data-joins.html** loads the D3 library.


    Let''s start by creating a very simple linear scale. Type the following into:


    ```

    var scale = d3.scale.linear();

    scale.domain([0,10]);

    scale.range([0,100]);

    ```


    The variable scale represents a scale function. And specifically, as the code
    suggests, the scale is linear. Let us play around it to figure out what it does.
    Try typing scale(0). You should get 0. Try typing scale(10). You should get 100.
    What do you think you''ll get if you type scale(5)?


    Clearly, all our scale function is multiplying our input by 10. Not very interesting.
    Let''s try defining it in a slightly different way:


    ```

    var scale = d3.scale.linear();

    scale.domain([0,10]);

    scale.range([10,100]);

    ```


    Now, what do you get when you type in scale(0)? You should get 10. The answer
    should still be 100. What about scale(5)? This time it''s 55, so in this case,
    scale isn''t multiplying your input by 10.


    +   - Can you guess what it''s doing? It''s taking the array we specified inside
    .domain() and it''s mapping it to the array we''ve specified in .range(). And
    it''s doing it in a linear way (see Figure 6.1). In this case, that means multiplying
    the input by 9 and adding 10.


    Not bad. So how can we use this in code? We could create a linear scale for our
    bars: We input a value from our population data, and it spits out the bar width
    for the x-axis. Let''s call our scale x, since we''ll be using it to size the
    bars horizontally, or along


    ```

    var x = d3.scale.linear();

    .domain({});

    .range({});});

    ```


    ![](img/0772fde882e37540dc00155fda693004_149_0.png)


    Figure 6.1 How a linear scale works'
