    You have to give the stroke a color for the line to be visible.


    # Paths


    Tag

    <path>


    Position and Size


    | d | Tells your browser how to draw the path |


    Paths are almost like a separate language. Every other shape in SVG can be created
    with a path element: They can make straight lines, they can make curves, and they
    can be closed and filled in. I won''t go over all the details, but here''s an
    example to give you a taste (it is shown in Figure 3.13):


    ```

    <svg width="500px" height="500px">

    <path d="M 0 50 q 50 -50 100 0 1 -100 0" stroke="black" fill="none"/>

    </svg>

    ```


    ![](img/0772fde882e37540dc00155fda693004_61_1.png)'
