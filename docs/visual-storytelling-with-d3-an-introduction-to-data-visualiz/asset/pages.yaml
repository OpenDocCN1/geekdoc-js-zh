    Great, let''s move on March. Again, what we want to select is all of the text
    elements on the page and then join the March data to them (see Figure 8.5).

    But...this time, there are only four data points for March, we actually have fewer
    data points than we elements. The elements that have an incoming data point to
    bind can be simply updated. But what about the element that doesnt? This is where
    exit comes in. We need to get rid of that text element (time for actor to leave
    the stage!), and the exit() method can help. Generally speaking, we''ve carried
    out a data-join, we can use exit() to select any element that no longer has a
    data point bound to. And then we can use another method—remove()to get rid of
    it (see Figure 8.6).

    And that''s. We''ve covered all phases of the data-join—enter, update, and exit.
    The foundation of data-joins is simple: Graphics are always appearing on the page,
    changing, or leaving the page, just as actors are always entering the stage, acting,
    or exiting. The way D3 handles these three phases of existence is joining'
