  md: '# Building a Bar Chart with Selections


    Using variables is not that different from using CSS, really. With CSS, you give
    a bunch of different elements a class, and when you change the formatting rules
    for that class, the formatting of all of those elements changes. Modifying things
    once is a lot easier than doing it a bunch of times, whether it means going through
    your markup and tweaking everything inline, or going through your D3 script and
    tweaking everything “in-chain”.


    # Do Math


    You might be thinking that we should just use CSS more in our code: After all,
    you could use a CSS rule to define the height of bars. You don''t need to whip
    up a variable in JavaScript.


