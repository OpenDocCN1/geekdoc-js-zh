    because we''ve bound new data to that element. (We''ll cover how to do this later
    in this chapter.)


    Note that there is no update() method. With the enter() method, you create a special
    selection of placeholder elements, one for each point in your data set that is
    not already bound. To update the elements already on the page, you don''t need
    to do that. You can just create a selection of those elements. And then you can
    tell them what to do based on their newly bound data.


    There''s a glaring question mark in the diagram in Figure 8.2 you are probably
    wondering about. The reason it''s there is that we have five data points for February,
    whereas we only had four for January. So what do we do with that fifth data point,
    which doesn''t have an element to bind?


    If you guessed that we make it enter the page, bravo! You are dead. We can use
    enter() just as before (see Figure 8.3). But instead of creating entirely new
    placeholder elements, the method will just create one for the data point that
    has no element. D3 is very good at responding to your needs.


    Now, again, as we did before, we can append a text element. Now our data and our
    page mirror each other once again (see Figure 8.4).'
