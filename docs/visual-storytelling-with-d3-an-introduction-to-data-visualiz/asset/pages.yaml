  md: "in JavaScript, the compiler (generally a browser) combs through your entire\
    \ script to see if that function is defined anywhere.\n\n# Adding a Play Button\
    \ to the Page\n\nNow that we have a reusable function that will take any year\
    \ and update the chart to that year, we can start making a play button. It's pretty\
    \ easy to see how this will play out (as it were). We create some code that will\
    \ cycle through all of the years and pass each of those years in sequence to our\
    \ update function. But before we do that, let's put a play button on our page.\
    \ That way, we'll be able to test whether or not things are working—all we'll\
    \ have to click and see what happens.\nLet's insert a play button right after\
    \ our title:\n\n```\nbody.append(\"h2\")\n  .text(\"Age distribution of the world\"\
    );\n\nvar playAll = body.append(\"div\")\n  .attr(\"class\", \"play-button\")\n\
    \  .text(\\► PLAY ALL YEARS\");\n\nvar buttons = body.append(\"div\")\n  .attr(\"\
    class\", \"buttons-container\")\n  .selectAll(\"div\").data(buttonYears)\n  .enter().append(\"\
    div\")\n  .text(function(d) { return d; })\n  .attr(\"class\", function(d) {\n\
    \    if(d == year) {\n      return \"button selected\";\n    } else\n      return\
    \ \"button\";\n    }\n  });\n```\n\nA couple of notes. First, I'm using the Unicode\
    \ black right-pointing triangle (\"U+25BA6\") here to denote that this is a play\
    \ button. It's not the sleekest solution, so if you want to jazz it up a bit,\
    \ for it! I went ahead and assigned the play button to a variable, playAll. I'm\
    \ just thinking ahead here. I know that ultimately, we'll be creating an event\
    \ handler for this play button (so that clicking it will actually prompt the chart\
    \ to cycle through all of the years). I also know the event handler will need\
    \ to be defined inside of our d3.csv() callback function, because the play sequence\
    \ will depend on our data. By assigning the play button to a variable, we'll be\
    \ able to refer to it lower down inside of that callback function.\nFigure 9.1\
    \ shows how our page looks like with the play button.\nClearly, this play button\
    \ lacks style. Let's fix that with some CSS.\n\n```\n.play-button {\n  margin-left:\
    \ 10px;\n  margin-bottom: 15px;\n  font-style: italic;\n```"
  merge: -1
  pgno: 224
