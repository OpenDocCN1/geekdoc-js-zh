  md: "# Updating Charts\n\nHow can we do that? Well, we already have an event handler\
    \ applied to our buttons that tell each button to become bold when clicked and\
    \ tells all the others to stop being bold. Now, we need to put some additional\
    \ commands inside of that event handler to update the data.\n\nThe first, and\
    \ most obvious thing to do, is to change the variable year:\n\n```\nbody.append(\"\
    div\")\n.attr(\"class\", \"buttons-container\")\n.selectAll(\"div\").data(buttonYears)\n\
    .enter().append(\"div\")\n.text(function(d) { return d; })\n.attr(\"class\", function(d)\
    \ {\n  if(d == year)\n    return \"button selected\";\n  else\n    return \"button\"\
    ;\n});\n})\n.on(\"click\", function(d) {\n  d3.select(\".selected\")\n    .classed(\"\
    selected\", false);\n\n  d3.select(this)\n    .classed(\"selected\", true);\n\
    \  year = d;\n});\n```\n\nRecall that in this case, d represents each of the values\
    \ in our array, buttonYears. By setting year equal to d, we are setting it to\
    \ whichever year has just been clicked. The next step is filtering the data. We\
    \ want to grab only the data corresponding to our chosen year. Then we'll join\
    \ that data to our bars to update their widths.\n\nBecause we want to manipulate\
    \ data inside our event handler, we actually need to put that event handler inside\
    \ of our d3.csv() function. The data will load asynchronously, so everything you\
    \ do involving external data needs to happen inside of that function. We don't\
    \ need external data to create the buttons in the first place—we still want to\
    \ do that outside of d3.csv(). We can assign buttons to a variable far up, and\
    \ then reference the variable inside of our d3.csv() call:\n\n// The code below\n\
    \n```\nvar buttons = body.append(\"div\")\n.attr(\"class\", \"buttons-container\"\
    )\n.selectAll(\"div\").data(buttonYears)\n.enter().append(\"div\")\n.text(function(d)\
    \ { return d; })\n.attr(\"class\", function(d) {\n  if(d == year)\n    return\
    \ \"button selected\";\n  else\n    return \"button\";\n});\n```"
  merge: -1
  pgno: 212
- img_proc: true
  md: "# Chapter 8 Making Charts Interactive and Animated\n\n```\n// ...\n// And inside\
