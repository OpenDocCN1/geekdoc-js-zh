  md: "# If Statements and Loops\n\nNow, let's say we want to build a function that\
    \ will tell us how old a car is. What would that function look like? Well, for\
    \ starters, you would want to pass an object as an argument, and it would return\
    \ a value with the age of the car. Or better yet, a sentence that says “That car\
    \ is x years old.” Or even better, “That [make] [come up] is x years old.” I’ll\
    \ put the answer in Listing A.12, but try to see if you can work it on your own.\n\
    \nListing A.12 A function for determining a car's age.\n\n```\nfunction car(obj)\
    \ {\n  var name = \" \" + obj.model;\n  var age = 2013 - obj.year;\n  return \"\
    That \" + name + \" is \" + age + \" years old.\";\n}\n```\n\nIf you run car()\
    \ on each of the objects in the myCars array, then you'll get what is shown in\
    \ Figure A.8.\nBrilliant. But I think I could make one improvement. Nobody ever\
    \ say that a car is 0 years old; somebody would say it’s brand new. Also, if a\
    \ car was made in 2012, then carAge() would say that it is 1 years old...perfectly\
    \ comprehensible, but unmatical.\nto fix these issues, we need some way of telling\
    \ carAge() to return one thing if the car is new, especially if the car is a year\
    \ old, and third if the car is two years old or older. We can do that using what’s\
    \ called a conditional statement. I’ll give you the syntax (see Listing A.13)\
    \ and explain it.\n\nListing A.13 Determining a car's age in plain English.\n\n\
    ```\nfunction carAge(obj) {\n  var name = \" \" + obj.model;\n  var age = 2013\
    \ - obj.year;\n  if (age == 0) {\n    return \"That \" + name + \" is brand new!\"\
    ;\n  } else if (age == 1) {\n    return \"That \" + name + \" is only a year old.\"\
    ;\n  } else {\n    return \"That \" + name + \" is \" + age + \" years old.\"\
    ;\n  }\n}\n```\n\n```\ncarAge(myCars[0]);\n\"That Nissan Sentra is 9 years old.\"\
    \ncarAge(myCars[1]);\n\"That Ford Taurus is 12 years old.\"\nAge(myCars[2]);\n\
    \"That Porsche 911 Turbo is 8 years old.\"\n```\n\nFigure A.8 Revealing the ages\
    \ of the cars"
