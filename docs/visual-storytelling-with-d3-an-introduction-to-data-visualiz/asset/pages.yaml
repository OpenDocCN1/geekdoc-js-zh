  md: '# Showing the Data as a Small Multiple Bar Chart


    What if we created a massive chart that consisted of a series of bar charts like
    the one shown in Figure 2.13, one for each year in our dataset? Well, if we made
    all of the bar charts same size as the one in Figure 2.13, the chart would have
    to be pretty massive. But what if we combined age groups, shrunk the charts down,
    and laid them out in a grid? Then we might have something. Take a look at Figure
    2.14.


    This kind of graphical layout—a series of small, similar charts clustered together—is
    variously called a trellis chart, grid chart, panel chart, or a small multiple.
    This last term is the one preferred by Edward Tufte, the influential design theorist
    and writer. In his book, Envisioning Information (1990, Cheshire, Conn.: Graphics
    Press), writes:


    At the heart of quantitative reasoning is a single question: Compared to what?
    Small multiple designs, multivariate and bountiful, answer directly by visually
    enforcing changes of, the differences among objects, the scope of alternatives.
    For a wide range of problems in data presentation, small multiples are the best
    design solution.


    So what is this chart good at conveying, and what are its shortcomings? Again,
    just like a single bar chart, it''s good at allowing the different age groups
    to be compared within an individual year. And, because the year increases as you
    go down a column (instead of across row) you can compare between years, too (at
    least between the years in each column).


    It''s not especially great at showing the overall trend over time—that the population
    is getting older. That information is certainly there, but it doesn''t pop out
    at the way it does in some of the other chart forms we''ve seen.


    So which of the chart forms we''ve looked at is best? Again, it all depends on
    what you want to convey. If you''re only interested in showing very simply that
    the world is projected to get older, then either the stacked column chart in Figure
    2.8 or the simple line chart in Figure 2.10 are options. If you want to enable
    comparison within years (at the expense of emphasizing the overall trend), then
    the small bar chart is a good way to go. So there is no simple answer. Choosing
    a chart form depends on the type of data you have and what you are trying to say
    about that data.


    # Chart Suggestions—A Thought Starter


    In the last few sections we looked at different ways of visualizing the data-set,
    evaluated their pros and cons, and come with a couple of recommendations, depending
    on the goals of the data visualization. But that is really a good way of going
    about designing graphics? Making full-fledged charts for a bunch of different
    forms and picking the one that works best? No, of course not.


    It can help to make quick charts using programs like R or spreadsheet software
    like Excel, Open Office, or Google Drive to give you a sense of what the data
    looks like visualized.'
