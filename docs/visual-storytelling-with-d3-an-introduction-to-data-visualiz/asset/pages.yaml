  md: "# Callback Functions\n\nOf course, we're going to use d3.csv(). The first argument\
    \ we pass into d3.csv() is the name of our file:\n\n```\nd3.csv(\"popData2010.csv\"\
    );\n```\n\nAnd the second argument is something known as a callback function.\
    \ Here's what it looks like:\n\n```\nd3.csv(\"popData2010.csv\", function(error,\
    \ data){});\n```\n\nI won't go into too much detail here, but it suffices to say,\
    \ that the callback function helps with problems that arise when you are trying\
    \ to retrieve data. When you use one of D3's functions for pulling in data, in\
    \ technical terms, the function is making what is a called a *request* for an\
    \ external resource. In this case, the resource is our CSV file.\n\nThe callback\
    \ function takes two arguments: one associated with success and one associated\
    \ with failure. In our case, if the callback function succeeds in requesting popData2010.csv,\
    \ then the contents of the file will be stored for use in the success variable,\
    \ data. If the request fails, then the details of the failure will be passed to\
    \ the error variable.\n\n# How D3 Interprets CSV Tables\n\nLet's make a request\
    \ for the data in our CSV file and take a look at the results in the console.\
    \ Adding the following to `index.html` file, inside the script tag:\n\n```\nd3.csv(\"\
    popData2010.csv\", function(error, data){\n  console.log(data)\n});\n```\n\nYou\
    \ should see an array appear in your console. When you expand it, it should look\
    \ like Figure 7.4.\n\nThe console isn't perfectly intuitive, so let's translate\
    \ what we see into JavaScript. The console is telling us that data is an array\
    \ containing a single object:\n\n```\ndata = [{}];\n```\n\nand that the object\
    \ has 17 properties, each with a different value:\n\n```\ndata = [{\n  0 - 4:\
    \ \"0.092849052\",\n  5 - 9: \"0.08782007\",\n  10 - 14: \"0.085697001\",\n  15\
    \ - 19: \"0.087628671\",\n  20 - 24: \"0.089268026\"\n}];\n```\n\n![](img/0772fde882e37540dc00155fda693004_182_0.png)"
