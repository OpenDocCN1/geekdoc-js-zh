    # Age distribution of the world


    ![](img/0772fde882e37540dc00155fda693004_39_0.png)


    Figure 2.6 A column chart with four age groups


    not really. Age and time. Note that age is not being treated as a simple continuum
    (1-80+) but as ordered categories of five years each (0–4, 5–9, etc.).


    What do you think? Does this chart do a good job of showing that the world is
    getting older?


    No, not really. Why? There are too many columns! The age distribution information
    gets buried. In the Wall Street Journal Guide to Information Graphics (2010, New
    York: W.W. Norton & Co.) Dona M. Wong (previously head of the paper’s graphics
    department) suggests that when you have a column chart like this with multiple
    categories, should limit the number of categories to four or fewer. That’s good
    advice, and if we were to follow it, we would need to aggregate the 17 age groups
    into four larger ones: 0–19 year-olds, 20–39 year olds, 40–59 year olds, and those
    60 years and older. Figure 2.6 shows such a chart.


    A little clearer, yes? How does this chart fare overall? The overarching trend—that
    the world is getting older—is definitely possible to see. Though, of course, it
    doesn’t show how fast the 80 and older age group is projected to rise because
    we limited-ourselves to four age groupings. Let’s take a look at some other options.


    # Showing the Data as a Stacked Column Chart


    What if instead of putting bars next to each other, we put them on top of each
    other? Figure 2.7 shows such a chart—a stacked column chart.


    Like its unstacked brother, the stacked column chart is a little hard to parse
    with all 17 age groups. Let’s try aggregating the age groups again and see how
    it looks.'
