  md: "# Finishing the Rest of the Chart 119\n\nPut that in your code and run it!\
    \ You should get what you see in Figure 5.8.\n\nA word of congratulations is in\
    \ order. You have now used all three Ds. You have driven a document with data.\
    \ Huzzah!\n\nOne final note on using anonymous functions in D3 to access bound\
    \ data. As mentioned, you always need to include d as an argument, no matter what.\
    \ That's the first convention of using anonymous functions. When we set the value\
    \ of y above to i * barSpacing, we didn't use d at all. That doesn't matter—we\
    \ still have to include it as an argument.\n\nThe second convention is that you\
    \ do not need to include d unless you plan on using it. When we set the width\
    \ attribute, we didn't need i, and it appears nowhere in the anonymous function.\
    \ But if you are going to use i, you have to make sure it is added to your anonymous\
    \ function as an argument as well as being in the body of your function.\n\n#\
    \ Finishing the Rest of the Chart\n\nAs an exercise, you should try finishing\
    \ the rest of the bar chart on your own using joins. I'll include the code here\
    \ in Listing 5.2 if you get stuck, but give it a shot at your own:\n\n+   Listing\
    \ 5.2 Building the rest of the chart using a data-join\n\n```\nvar barLabelGroup\
    \ = svg.append('g')\n  .attr('transform', translateText)\n  .attr('class', 'bar-label');\n\
    var barLabelGroup.selectAll('*')\n  .data(barLabels)\n  .enter().append('*')\n\
    \  .attr('x', -10)\n  .attr('y', function(d,i) { return i * barSpacing + barHeight*(2/3)\
    \ }\n  .text(function(d) { return d; });\nvar axisTickGroup = svg.append('g')\n\
    \  .attr('transform', translateText)\n  .attr('stroke', 'black');\naxisTickGroup.selectAll('line')\n\
    \  .data(axisData)\n  .enter().append('line')\n  .attr('x1', function(d) { return\
    \ d*scaleFactor })\n  .attr('x2', function(d) { return d*scaleFactor })\n  .attr('y1',\
    \ 0)\n  .attr('y2', -tickHeight);\nvar axisLabelGroup = svg.append('g')\n  .attr('transform',\
    \ translateText)\n  .attr('class', 'axis-label');\naxisLabelGroup.selectAll('*')\n\
    \  .data(axisData)\n  .enter().append('*');\n```"
