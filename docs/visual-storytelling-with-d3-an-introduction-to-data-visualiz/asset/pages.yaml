  md: '# Sizing Charts and Adding Axes


    This chapter covers how to use scales and easily create axes in D3. Scales make
    straightforward to translate values in a data set to pixels on a screen. Axis
    generators make it exceedingly simple to add axes to your charts and customize
    them. By the end of the chapter, you will have recreated our single-year bar chart
    example using D3 to its fullest potential.


    # Linear Scales


    In this chapter, instead of starting with general lessons on using D3 and then
    apply those lessons to our example bar chart, from the get-go. Take the most recent
    version, pop2010-data-joins.html, save it as pop2010-scales.html, in both your
    browser and your text editor.


    In the chapter on SVG, we covered the transform attribute. Using the transform
    attribute, you can translate an SVG element from one position to another, you
    can scale an element in the horizontal and vertical directions, and you can rotate
    elements.


    In our population bar chart, we are currently using bars to translate, create
    margins for the chart, and scale to automatically size bars so they fit in a width
    we define. Recall also that we created a variable called scaleFactor in which
    we took the defined width and divided it by the largest value in our data. This
    scaleFactor that we used to make sure our largest bars fill up the entire width
    and place the tick marks of our axis in the right spots.


    D3 makes scaling a lot more convenient by allowing you to set up a function that
    essentially maps data to pixels. That mapping can be linear—for example, if 0
    maps to 10 and 100 maps to 500, then 50 would map to— It can also be ordinal,
    mapping discrete, non-numeric values to pixels (we''ll cover ordinal scales in
    detail later in this chapter).


    You can do most of that with basic JavaScript, just by doing some math, in a sense,
    scales aren''t totally necessary (we''ve gotten by so far without them). But scales'
  merge: -1
