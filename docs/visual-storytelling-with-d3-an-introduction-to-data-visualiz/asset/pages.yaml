  md: '# Chapter 1 Visual Storytelling and D3


    But, as the cliché goes, content is king. It doesn''t matter how aesthetically
    superb a data visualization is if the information it conveys is simply not compelling.


    # Design: It Is All about Form


    Let''s take a step back for a second and think about what it actually means to
    visualize data. Merriam-Webster gives two definitions for the word visualize:


    +   1. To see or form a mental image (of).


    +   2. To make (an internal organ or part) visible by radiographic visualization.


    The first definition is the one you''re probably most familiar with. Maybe your
    baseball or softball coach tell you to "visualize yourself making contact with
    the ball." In this context, "visualize" means "imagine." When you visualize yourself
    hitting that ball, the visual construct only exists inside your head. Of course,
    that''s not true for data visualization.


    The second definition gets closer. A radiographic visualization is, for example,
    an X-ray. When a technician takes an X-ray of, say, your forearm, she shoots X-rays
    at the limb, and whatever passes through it gets picked up by a detector on the
    other side Out comes a picture of your radius and hopefully not too fractured
    mina.


    That X-ray is a kind of data visualization, a two-dimensional schematic map in
    which every location on the image corresponds to a location on your forearm. Places
    that readily absorb X-rays appear nearly white, places that don''t absorb them
    are nearly black, and everywhere in between is some shade of grey. Of course,
    the white reveals the shades of your calcium-rib, X-ray-absorbing bones.


    When you visualize data, it''s a lot like making an X-ray: You take information
    and encode it on a page, screen, or some other two-dimensional surface (for the
    most part). But there''s a major difference: With data visualizations it''s up
    to you to design the encoding. In an X-ray, it''s always true that the position
    on the image represents the position in your body, and the color can mean whatever
    you want them to. While X-rays are a fairly realistic depiction of a physical
    object, data visualizations involve an abstract arrangement of graphical elements,
    such as circles, rectangles, and lines, whose attributes—size, position, color,
    etc.—vary in some way to represent different values in a dataset.


    In the chart of US debt over time (Figure 1.3), the graphical element of choice
    is a bar or rectangle and the key attribute is its height. Each of the 221 years
    in the dataset is assigned its own bar, and the height of that bar is proportional
    to the ratio of US debt to GDP. As a secondary attribute, color is used to highlight
    significant periods of increasing debt.


    The element/attribute combination is the central component of a graphic''s form.
    Choosing the right combination is the key to good visualization design.


    +   1. http://www.merriam-webster.com/dictionary/visualize'
