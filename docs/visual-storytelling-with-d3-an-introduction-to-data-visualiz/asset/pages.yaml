    world getting older?” then the stacked column chart is a better choice. It shows
    very clearly that the answer is “yes.” If, on the other hand, being able to see
    the composition of any given year is important for the story you want to tell,
    then the column chart might be a good option.


    # Showing the Data as a Line Chart


    But, of course, a column chart and stacked column chart aren’t the only two options
    available. Let’s see how the data looks if we use another workhorse in the data
    visualization—a line chart.


    The line chart in Figure 2.9 is really interesting, because you can see dips in
    the population cascade across curves over time. For instance, there’s a dip in
    5-9 year olds in 1950, which then turns into a dip in 10-14 year olds in 1955,
    a dip in 15-19 year olds in 1960, and so on. Why is this dip? The answer is World
    War II. Birth rates were lower while the war was in progress, from 1939 to 1944.
    Babies born during that time would have been roughly between 6 and 11 years old
    in 1950, and because there were relatively fewer of them, there’s a visible dip
    in the 5-9 year old population.


    So that’s interesting, and something that wasn’t apparent when we were just looking
    at the raw data. Visualization doesn’t only help the see patterns in the audience,
    it can also help you, the data visualization designer, see these patterns. This
    is one of the reasons why data visualization design is often an iterative process—you-sometimes
    discovers things as you go along that you want to shift your focus a little bit.
    It would be totally reasonable at this point to decide that you wanted whatever
    the final graphic was to show those population dips.'
