  md: '# Scalable Vector Graphics


    This chapter will serve as a primer on scalable vector graphics (SVG). It will
    go over how to create SVG elements and how to style them and transform them. After
    the basics have been covered, it will show how to build a bar chart of the global
    age distribution in 2010 from scratch in SVG. This chapter assumes rudimentary
    knowledge of HTML and CSS.


    # Peeking under the Hood


    Toward the end of this chapter, we''re going to start building the interactive
    bar chart of the world''s age distribution described at the end of Chapter 2.
    (Only it won''t be interactive—at least by the end of this chapter. What we''re
    really going to focus on building a static version of the world''s age distribution
    in 2010, and 2010 only.)


    We''re going to build that from scratch using SVG. You''ll be creating and manipulating
    a lot of SVG elements if you use D3, and it''s good to know a bit about what''s
    going on under the hood.


    So let''s get started! This book assumes that you have some basic experience with
    HTML and CSS, so a lot of code will be passed off to you without explanation.
    As long as you understand <p> tags, know what a <div> is, and have a basic grasp
    of CSS, you should be fine.


    # What Is SVG, Exactly?


    Graphics come in two basic formats: vector and raster. A raster image is made
    up of a fixed number of square pixels (which, remember, is short for “picture
    elements”) and each pixel is one color. JPGs, PNGs, GIFs...all of the formats
    that digital photos typically come in are raster.


    The telltale sign of a raster is that when you zoom in on it, it gets fuzzy—or
    more precisely, pixelated. The reason is rendering. When you are viewing an image
    at a 100% zoom level, each individual pixel is being rendered into one pixel on
    your computer''s monitor. But if you blow the image up to 200% (which means that
    you are'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Chapter 3 Scalable Vector Graphics


    doubling both width and height, so quadrupling the area of image) each image pixel
    takes up four pixels on your screen. Keep zooming and at some point, you''ll actually
    be able to see that your image is made up of a bunch of little squares. That''s
    pixelation.


    Vectors images, instead of telling your computer to make the pixel is 50th from
    the top and 100th from the left, define an drawing: "Put a black curve on the
    left, a red rectangle on the right, and a blue circle with a yellow outline that
    is semi-transparent top." It''s up to your computer (or, whatever software you
    are using) to take these instructions and then tell your screen''s pixels what
    to do. The beauty of this is that the instructions themselves can be really simple,
    and your screen''s pixels are rendered differently at zoom levels so the drawing
    is always crystal clear. No pixelation. (Then again, vectors are really only good
    for fairly basic shapes, not for encoding, an Ansel Adams.).


    SVG is just one of vector format. But it''s a really useful one, because it''s
    a web standard, so web browsers can understand the instructions it provides (as
    long as your browser isn''t Internet Explorer 8 or earlier). D3 is designed to
    work with web standards, it plays well with SVG.


    # Playing with Circles in SVG


    All SVGs are encoded in a human-readable programming language that''s a lot like
    HTML. There are opening tags and closing tags, parents, children, the whole nine.
    In fact, nowadays, if you''re building a webpage, you can insert a chunk of SVG
    markup right into your HTML and the graphic will appear in your browser (this
    is exactly what D3 does when you use it to make SVG-based graphics). This wasn''t
    always the case; SVG support was a major addition to HTML5, at the time of this
    writing the latest standard. Now, there''s no need to reference a separate file
    sitting at a different URL, as you would with an <img> tag. You can use your browser''s
    web inspector to see what''s going on inside your SVG markup, which is extremely
    helpful for debugging.

    With that in mind, let''s start making SVGs for the web!


    Open up your text editor of choice (if you don''t have a text editor, see Chapter
    1 for more info). We''re going to create an HTML file that we''ll open in the
    browser. Since we''ll be playing around with SVG, let''s call it svg-sandbox.html.


    ```

    <DOCTYPE html>

    ```


    If you don''t, there''s a chance the browser might render your code in some old-fashioned
    way, making everything look wonky. The DOCTYPE declaration tells the browser,
    "hey, I totally follow HTML web standards, don''t misread me!


    It''s also a good idea to tell the browser what character encoding you''re using.
    If you''re trying to use some really unusual Unicode characters, you don''t want
    the user''s browser to interpret that code as ASCII, an encoding that is much
    more limited.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Playing with Circles in SVG


    If her browser is set to the ASCII character encoding some of that Unicode could
    be lost in translation, producing a jumble of characters called mojibake. You
    can override that setting by specifying the character encoding directly in your
    HTML. Unicode is sort of the lingua franca of encodings—it''s by far the most
    inclusive and the most used, so you should use it whenever possible.


    ```

    <meta charset="utf-8">

    ```


    Okay, here''s the basic set up svg-sandbox.html, with the DOCTYPE, character encoding,
    and a label just for fun:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    </head>

    <body>

    <p>SVG sandbox</p>

    </body>

    </html>

    ```


    The first thing we have to build an SVG image is create an <svg> element inside
    of <body>. Among other things, this aside some space on the page for the graphics.
    Let''s go ahead and give it a width and a height.


    ```

    <body>

    <p>SVG sandbox</p>

    <svg width="500px" height="500px"></svg>

    </body>

    ```


    How similar SVG is to HTML? We can even give the <svg> a width and height inline,
    right inside the tag. All of the shapes and text we''ll create will go inside
    of that <svg> tag. Let''s start with a circle, which we can create using a <circle>
    tag:


    ```

    <svg width="500px" height="500px">

    <circle />

    </svg>

    ```


    Open svg-sandbox.html in your browser, and check out that circle! Wait, you don''t
    see anything? Oh yeah, that''s because we haven''t told the browser anything about
    the circle—how we want it to be, where it should be positioned, what color it
    should be.... We haven''t set any of its attributes. But we can do that inline
    (i.e., inside of the <circle> tag), in the same way we style HTML elements inline.


    ```

    <svg width="500px" height="500px">

    <circle cx="100" cy="50" r="20"/>

    </svg>

    ```


    The result is shown in Figure 3.1.'
