  md: "# Transformations\n\nSVG elements can be moved around, rotated, and manipulated\
    \ in other ways using the transform property. Here's a selection of transform\
    \ functions (arguments in brackets are optional):\n\n+   - `translate(tx[, ty])`\
    \ - Redefines the coordinate system of the SVG element such that\n0,0 refers to\
    \ the location at tx,ty. If ty is undefined, it defaults to 0.\n- `rotate(angle[,\
    \ cx, cy])` - Rotates the element clockwise by a number of degrees equal to angle.\
    \ cx and cy define the point around which the element will be rotated. The default\
    \ is 0.\n- `scale(sx[, sy])` - Rescales the element by a factor of sx horizontally\
    \ and sy vertically. If sy is not defined, it is equal to sx, so the scaling is\
    \ proportional.\n\nThose definitions are pretty technical, and it might not be\
    \ too clear what they mean. Let's start with translate. The translate transformation\
    \ redefines the coordinate system of an SVG element. Why would you want to do\
    \ that? The last example from the previous section gives us a good reason.\n\n\
    When I created that example, I started with the blue group. Then I copied that\
    \ chunk of group's class from blue-group to red-green, I changed the text element\
    \ so it would say \"Red group,\" and the stroke of the line so it would also be\
    \ red. After doing all that, I had to increase the x coordinates for each of individual\
    \ elements by 200 so the red group would be shifted to the right and not on top\
    \ of the blue group. I did the exact same thing for the green group, substituting\
    \ \"green\" for \"red\" and 400 for 200.\n\nIf I had used translate, I could have\
    \ kept the x coordinates as instead instead shifted the coordinate systems for\
    \ both the red group and the green group to the right (the CSS in this example\
    \ is as shown above):\n\n```\n<svg width=\"500px\" height=\"500px\">\n  <g class=\"\
    blue-group\">\n    <text x=\"0\" y=\"20\">Blue group</text>\n    <rect x=\"0\"\
    \ y=\"40\" width=\"50\" height=\"50\" rx=\"10\" ry=\"10\"/>\n    <polygon points=\"\
    80,30 70,130 130,50\"//>\n    <line x1=\"60\" y1=\"75\" x2=\"120\" y2=\"90\" stroke=\"\
    blue\"/>\n  </g>\n  <g class=\"red-group\" transform=\"translate(200)\">\n   \
    \ <text x=\"0\" y=\"20\">Red group</text>\n    <rect x=\"0\" y=\"40\" width=\"\
    50\" height=\"50\" rx=\"10\" ry=\"10\"/>\n    <polygon points=\"80,30 70,130 130,50\"\
    //>\n    <line x1=\"60\" y1=\"75\" x2=\"120\" y2=\"90\" stroke=\"red\"/>\n  </g>\n\
    \  <g class=\"green-group\" transform=\"translate(400)\">\n    <text x=\"0\" y=\"\
    20\">Green group</text>\n  </g>\n</svg>\n```"
  merge: -1
