  md: "# Anchors away! Or not...\n\nFigure 3.17 It's not leaving that spot\n\nOne\
    \ disadvantage of SVG text, as you may have revealed, is that you have to know\
    \ where your line breaks to be. In the the example in Figure 3.17, I had to create\
    \ three separate text elements for the block of text at the left, three for the\
    \ block in the center, and three for the right. Unlike HTML, SVG has no way of\
    \ simply drawing a box for a cursor to go to that will break it up in lines automatically.\n\
    \nOne last thing about SVG text: you can add links using an <a> tag. The SVG <a>\
    \ differs from its HTML counterpart in two ways: 1) You have to write xlink:href=\"\
    your-link-here\" instead of href=\"your-link-here\" and 2) by default, if you\
    \ hover your cursor over a link, it will turn it into a pointer, but other than\
    \ that snippet that creates a link will not be formatted differently from the\
    \ surrounding text. Here's a look like a standard link in HTML:\n\n```\n<head>\n\
    <style>\nsvg a {\n  fill:blue;\n}\nsvg a:visited{\n  fill:purple;\n}\nsvg a:hover{\n\
    \  text-decoration:underline;\n}\n</style>\n</head>\n<body>\n<svg width=\"500px\"\
    \ height=\"500px\">\n<text x=\"10\" y=\"20\">Here's where to go to <a\nxlink:href=\"\
    http://www.w3schools.com/svg/svg_text.asp\">learn more\nabout SVG text></a>, including\
    \ how to rotate it</text>\n</svg>\n</body></html>\n```\n\nThis text is aligned\
    \ to the left\n\nThis text is aligned to the center\n\nThis text is aligned to\
    \ the right\n\nFigure 3.17 Examples of the different text anchors"
