  md: '# Using Anonymous Functions to Access Data


    D3 has a couple of conventions when it comes to using anonymous functions to access
    bound data. The reasons for these conventions are a little complex, but the good
    news is, you don''t need to know them to use D3. You just need to memorize the
    conventions themselves.


    The first is that the function always takes an argument d:


    ```

    .attr("width", function(d))

    ```


    and d has a very specific meaning. For each of the elements in our selection,
    it represents the bound data point. So, for our first rectangle, the value of
    d is 1.6. For the second, d is 1.5, and so on.


    This is great, because we want to set the widths of our rectangles to be equal
    to the values in popData. For each rectangle we want the width to be d. How do
    we do that? Just like with any other function—we tell our anonymous function to
    return a value of d:


    ```

    .attr("width", function(d) { return d; })

    ```


    Perfect. Now on the attribute y. We also want to use an anonymous function, something
    like this:


    ```

    .attr("y", function(d))

    ```


    Hmm... the problem is that the vertical position, y, doesn''t have anything to
    do with the value of the bound data. Remember that when we used a loop to make
    the rectangles, we set y equal to our iteration variable, i, times a constant,
    barSpacing. We never used any of the data contained in popData. So, we don''t
    need to use d.


    Fortunately, D3 gives you access not only to the value of each bound data point,
    but also to the index of each data point within your data array. How do you access
    those indices? By introducing another argument to your anonymous function—i.


    ```

    .attr("y", function(d, i))

    ```


    So, for our first rectangle, i is equal to 0, for the second rectangle, it is
    equal to 1, and so on.


    Just before, we want y to be equal to the index times our constant, barSpacing.
    Easy:


    ```

    .attr("y", function(d, i) { return i * barSpacing })

    ```


    And here''s the chain in its entirety:


    ```

    bargroup.selectAll("*")

    .data(popData)

    .enter().append("*")

    .attr("x", 0)

    .attr("height", barHeight)

    .attr("width", function(d) { return d })

    .attr("y", function(d, i) { return i * barSpacing });

    ```'
