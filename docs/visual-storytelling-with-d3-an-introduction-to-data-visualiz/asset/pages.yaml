  md: "# Appendix A JavaScript for Beginners\n\nJavaScript has a ton of built-in functions.\
    \ alert(), for instance, will tell your browser to open an alert box and display\
    \ any string that is passed to it as an argument. Try alert(\"Eureka!\")\n\nMethods\
    \ like functions, but they only work on a particular data type. Arrays have methods\
    \ and objects have methods. The syntax for methods is a little different from\
    \ that of functions. The variable you want to perform the method is not passed\
    \ as an argument, but rather proceeds the method name. For example, myArray.indexOf(3)\
    \ performs the method indexOf() on the array myArray. What indexOf does is it\
    \ takes the array and looks for the value that is passed in as an argument—in\
    \ this case 3—and then returns the position, or index, within the array that value\
    \ is located. indexOf(3) should return an index of 2.\n\nA JavaScript library,\
    \ like D3, is merely a bunch of functions and methods. D3 is really just a js\
