  md: 'The first thing you need to install the reshape2 package. You do this by typing
    install.packages("reshape2"), then select the CRAN mirror (see Figure B.25) closest
    to you (CRAN mirrors are the servers where the R source files and packages are
    hosted).


    The reshape2 package will be installed on your computer. Then to load the type
    library (reshape2), as shown in Figure B.26.


    Now, you need to pull rawData.csv into R so you can manipulate the data. But you
    have to tell R where it can find that file. You have to set the working directory
    to the directory where rawData.csv is. I''ve put rawData.csv on my desktop, and
    I can set the working directory to my desktop by typingsetwd("/Users/ritchieving/Desktop/").


    To load rawData.csv, you can use a function read.csv(). That will pull the data
    into in. But to be able to manipulate it (specifically to melt it), you''ll need
    to assign data to a variable. Try doing this: data <- read.csv("rawData.csv").
    (In R, "-" is the preferred assignment operator and not "="). If you type data
    into the console, you can see what it looks like. Figure B.27 shows a snippet
    of it.


    The variable data is what is called a data frame in R. You can think of it as
    a table. There are columns and rows, and rows have names (the rows can have


    ![](img/0772fde882e37540dc00155fda693004_269_0.png)


