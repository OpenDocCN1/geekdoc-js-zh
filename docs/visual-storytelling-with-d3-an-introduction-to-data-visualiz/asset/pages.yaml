  md: '# Adding Transitions


    ```

    year = d;


    popData = data.filter(function(element) {return element.year == year});

    nbars.data(popData));

    ```


    Now to update. D3 makes this super easy. Remember, there is no update() method.

    After we compute the data-join—bars.data(popData)—our selection is still bars.
    We can apply new attributes directly to that selection and it will update.


    In this case, the only thing we need to update is the width. We want the rectangles
    to stay in the same position, the same height, and remain the same color. We can
    update these widths like so:


    ```

    bars.data(popData)

    .attr("width", function(d) {}));

    ```


    What should go do in that function? Exactly what was it before—

    return x(d.value). The thing is, d.value is different now, since we''ve joined
    our data to our rectangles.


    ```

    bars.data(popData)

    .attr("width", function(d) { return x(d.value); });

    ```


    Run that code in your browser and play around with it a bit. You should see the
    bars update when you click the buttons. Again, Figure 8.15 and Figure 8.16 show
    what the extremes should look like.


    Congratulations! You have made an interactive graphic!


    # Adding Transitions


    As is, the graphic is perfectly functional. With a click of the mouse, you can
    see a bar chart for any year in our data set. But the transition between years
    is totally jerky. Wouldn''t it be nice if the bars actually animated to their
    new values every time you clicked a year?


    Again, D3 makes this painfully easy to do. All you have to do is use a D3 method—transition()—to
    make it happen:


    ```

    bars.data(popData)

    .transition()

    .attr("width", function(d) { return x(d.value); });

    ```


    Note: For it to work, you need to insert the transition() method before applying
    the change. Play around with a little more and watch the bars shrink and grow.
    Pretty fun, eh?


    There are ways to customize transitions. You might be thinking that our bars are
    currently growing and shrinking a little faster than ideal. The default duration
    of a transition is 250 milliseconds, or one quarter of a second. You can make
    that duration'
