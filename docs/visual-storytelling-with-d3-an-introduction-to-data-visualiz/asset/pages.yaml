  md: '# Age distribution of the world, 2010


    ![](img/0772fde882e37540dc00155fda693004_85_0.png)


    Congratulations! Chances, you''ve just hard-coded your first graphic entirely
    in SVG. With any luck, it''ll be your last.


    A lot of what we just did was super tedious (look just how long and repetitive
    the code is), which is disheartening were only working with 17 data points. What
    if we had 217? The good news is that D3 makes the most tedious parts of hard-coding
    in SVG incredibly simple (once you know how to do it).


    For example, you don''t have to do any math to figure out what to use for scaling
    charts to a larger size. You can set a desired width for your chart and then tell
    D3 to find the largest value in your data set (you don''t even have to know what
    it is) and it will create a scale you can apply to all of your values. And, as
    far as axes go, D3 can make those for you; don''t have to draw the lines yourself.


    Without further ado, let''s dig into some JavaScript!


    # Summary


    One of the major advantages of SVG as a graphical format is that it can be scaled
    without losing resolution. SVG is a markup language, very much like HTML. Basic
    SVG tags tell the browser to draw shapes, lines, and text. Classes can be assigned
    to SVG elements, and they can be styled with CSS. There are myriad styles and
    transforms that allow users of SVG to endlessly customize their graphics.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# 4 Shaping Web Pages with D3 Selections


    In this chapter we are going to dive into D3 (finally!). Specifically, we''re
    going to cover something called selections. On the most basic level, selections
    are D3''s way of letting you access a web page so you can make changes to it.
    Selections give you the keys to the web page document so you can drive it! Remember,
    although D3 is an amazing tool for creating data visualizations, it doesn''t have
    a basic function for generating charts. Instead, it provides a bunch of ways to
    manipulate the contents of a web page, based on data. It''s up to you to create
    the shapes and lines you need to make an intelligible data visualization.


    # Getting Set Up with D3


    D3 is a JavaScript library, a large-ish text file filled with JavaScript code
    that defines a bunch of functions and methods. If you don''t know what a function
    or a method is, you should definitely refer Appendix A on basic JavaScript before
    continuing.

    To use D3, you need to do what is referencing the library in your HTML file. That''s
    just a technical way of saying markup needs to have a link to the D3 library file
    where all the functions and methods are defined. Otherwise, when you try to use
    one of those functions, your browser will have no idea what you''re talking about.

    The reference looks like this...


    ```

    <script src="http://d3js.org/d3.v3.min.js"></script>

    ```


    ...and it goes in the body of your HTML. (Note: This reference is for version
    3 of D3.) Your browser will follow that link when it opens your web page and run
    the JavaScript file, making these functions and methods available for you to use
    both in your script and in the JavaScript console.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Chapter 4 Shaping Web Pages with D3 Selections


    Listing 4.1 shows a snippet of code you can use to get started building a web
    page using D3.


    # Listing 4.1 A starter snippet


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <style>

    /* Your CSS goes here */

    </style>

    </head>

    <body>

    <script src="http://d3js.org/d3.v3.min.js"></script>

    <!-- Your HTML goes here -->

    <script>

    // Your JavaScript goes here

    </script>

    </body>

    </html>

    ```


    All of the "Your X goes here" statements above are comments, so your machine won''t
    try to interpret them as code. (The reason the symbols surrounding each comment
    is different is each one is written in a different language.)


    Note that when you reference the D3 library before your HTML, the JavaScript you
    write below goes your HTML. Why? Because you use D3 to manipulate elements on
    the web page, and you need to create these elements first!


    # Making Selections


    So what is a selection, exactly? Well, it''s a selection of elements from your
    web''s DOM, or Document Object Model. The DOM is the hierarchical, HTML-based
    structure that underpins every web page. When your browser is rendering a web
    page, it is interpreting the underlying DOM.


    When you take a peek at the DOM (which you can do with the Web Inspector), it
    looks a lot like an HTML file, and sometimes it mirrors the HTML file being loaded
    exactly. There''s a big difference between a static HTML file and the DOM. The
    DOM always represents the current state of a web page. Its initial state could
    be defined by a static HTML file, but then change based on, say, some JavaScript.


    Back to selections. What kind of elements can a selection be? Could it be a single
    <div>, could it be all of the page''s elements, it could be everything with the
    classMyth, it could be an SVG circle, or it could be the entire body of the page.


    The best way to understand what selections are and how they work is to use them.
    So, put the following code into a file called selections.html and open it in your
    browser (see Figure 4.1). Then we can create some selections in the console!'
