  md: 'So, instead of having separate variables for the margin and the left margin
    (or of the two other margins), we have one object with four properties. Our left
    margin is now margin.left and our top margin is now margin.top.


    The next thing Bostock does define width and height in terms of these margins.

    In our case:


    ```

    var width = 500 - margin.left - margin.right,

    height = 450 - margin.top - margin.bottom;

    ```


    You''re probably wondering where 500 and 450 came from. Those values will be the
    total width and height of our <svg> element, respectively. So, instead of setting
    the width of the chart area to 400, as we did before, we''re going to set the
    entire width of the <svg> to 500. And, instead of setting the height of the bars
    to 20, we''re going to choose a total height, and the bars will fill up the space
    automatically.

    Sweet, not?


    The reason we do this is because <svg> elements, just like <div>s, will take up
    the space they can get on your page. So''s good to keep them defined by their
    proportions.


    Now, the next thing Bostock does is he creates his <svg> element, he immediately
    appends a group, and transforms that group so the point of origin is shifted to
    the right by an amount equal to margin.left and shifted down by an amount equal
    margin.top. Basically, this is a group within the <svg> that represents the chart
    area. Everything that follows is appended to that group (and as a result, doesn''t
    need to have its own transform attribute);


    ```

    var svg = body.append("svg")

    .attr("width", width + margin.left + margin.right)

    .attr("height", height + margin.top + margin.bottom)

    .append("g")

    .attr("transform", translate(" + margin.left + "," + margin.top + ")");

    ```


    Two things first. The first attribute to the <svg> element is equal to width +
    margin.left + margin.right. In other words, 500. Likewise, the height is 230.
    Just as planned. The idea is that we use width to refer to the width of the chart
    area, and height to refer to the height.


    The second thing is that we''ve actually defined the variable svg so it refers
    to a group, not to an <svg> element. This is just for simplicity''s sake. We are
    going to think of our chart area kind like our core SVG space, even though the
    actual <svg> element is larger. This might be a little confusing, so take a look
    at the diagram in Figure 6.2.


    Now, let''s add this to our code. We can put the margin definition up at the top:


    ```

    var margin = (top: 30, right: 0, bottom: 0, left: 100),

    width = 500 - margin.left - margin.right,

    height = 230 - margin.top - margin.bottom;

    ```'
