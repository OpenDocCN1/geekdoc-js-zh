    speces \"Nissan\"\nmodel: \"Sentra\"\nnow: false\nyears: 2004\nclass: Object\n\
    ```\n\nFigure A.7 A closer look at myCar\n\nThe way you access values in an object\
    \ is by using the property name itself. For example, typing in myCar.make will\
    \ return \"Nissan\", myCar.model will return Sentra, and myCar.gears[5] will return\
    \ \"R\".\n\n# Methods and Functions\n\nIn programming in general, if you want\
    \ to perform a sequence of operations over and again, then you can save that sequence\
    \ into a packet of instructions called a function. This is a weird word, but say\
    \ you wanted to take a number, square it, add 7, and then divide by 2. You could\
    \ type out all those commands by hand, but if you were doing a bunch of times,\
    \ it could quickly get tedious. Listing A.10 shows how you would store those operations\
    \ in a function.\n\nListing A.10 An example of a function.\n\n```\nfunction myMath()\
    \ {\n  return (num * num + 7)/2\n}\n```\n\nWhen you define a function, you declare\
    \ that you are defining a function with the word function (just like you declare\
    \ variables with var). In Listing 6.10, myMath is the name of the function, and\
    \ num is what's called an argument. Arguments are necessary if you want to perform\
    \ a series of commands on values of your choosing—but not all functions have arguments.\
    \ In the function definition, arguments are treated as dummy variables: For example,\
    \ myMath is saying, \"I don't know what num is, but when you tell me, I'll know\
    \ what to do with it!\" The expression is needed in myMath so that when you run\
    \ the function, it spits out the solution to (num * num + 7)/2.\n\nOkay, go ahead\
    \ and put the definition of myMath into your js or HTML file, and go back to your\
    \ browser. Now that the browser has run that definition, myMath is a function\
    \ that is available to that web page. Open the console and type myMath(5). Then\
    \ try myMath(myArray[2])."
