    # Data Formats You Can Use with D3


    As we discussed in Chapter 3, data can be found in a lot of formats on the web.
    There are the Microsoft-Excel-based spreadsheet formats, like .xls and .xlsx,
    the plain text table formats like CSV and TSV, and every JavaScript formats like
    JSON.


    D3 can handle pretty much all of these except the richly formatted spreadsheet
    files .xls and .xlsx. Here''s a list of all the external data formats that D3
    supports:


    | Format | Description |

    | --- | --- |

    | .txt | plain text file |

    | .csv | comma-separated values |

    | .tsv | tab-separated values |

    | .json | JSON blob |

    | .html | HTML document |

    | .xml | XML document |


    For this example, let''s start by creating a really simple CSV file. CSVs are
    ubiquitous, and you can easily create them using freely available tools. We''ll
    use D3 to upload the data in the CSV file we create and then check it out in the
    console.


    Let''s start with a subset of our data—the data from 2010—so we can see how the
    whole thing works.


    In this book'' supporting files, you''ll find a file called popData2010.csv you
    can use. Alternatively, you can create the file yourself in a text editor or in
    a Google spreadsheet (see Figure 7.1). If you go to the Google spreadsheet route,
    you can download the file as a CSV by going to File > Download as > Comma-separated
    values.'
