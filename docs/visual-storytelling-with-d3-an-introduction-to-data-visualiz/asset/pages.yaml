  md: "# If Statements and for Loops 231\n\nis false; thus it keeps looping and looping\
    \ through the commands forever. It's a cool term, but something you should try\
    \ to avoid when you're coding.\n\nThere are a couple of different kinds of loops,\
    \ but we're going to use a for loop, probably the most common. Simply speaking,\
    \ for loops use a counter to keep track of the number of times the commands in\
    \ the loop have been executed (in programming-speak, each cycle through the sequence\
    \ of commands is called an iteration). When that number exceeds a specified value,\
    \ the loop stops. (A for loop doesn't have to be set up exactly this way, but\
    \ it's often the most straightforward way to do it.) Here is an example of a for\
    \ loop:\n\n```\nfor (var i = 0; i < 10; i++) {\n  i++;\n}\n```\n\nEvery for loop\
    \ has three statements. The first statement is a definition of the loop counter.\
    \ In the code above, the loop counter is a variable i that we initially set to\
    \ 0. The second statement is the condition that must be satisfied for the loop\
    \ to keep looping. Before each iteration, the for loop looks at that condition—in\
    \ our example, i < 10—and checks to see if it's true. If it's true, then it proceeds.\
    \ The third and final statements increment the loop counter, or +1 to i, at the\
    \ end of every iteration.\n\nOkay, now put that for loop into js-basics-script.js\
    \ and run it. Hmmm...not a lot to look at. The reason is that, the loop is running\
    \ through 10 iterations and adding 1 and 1 each time, but it doesn't do anything\
    \ with the result—it doesn't store it in a variable, and it doesn't print it out\
    \ on the console. To do the latter, you can use a function called console.log():\n\
    \n```\nfor (var i = 0; i < 10; i++) {\n  console.log(i);\n}\n```\n\nYou should\
    \ see something like Figure A.10.\nThe 2 on the right is right since the for loop\
    \ printed the exact same thing (the number 2) a total of 10 times, it just indicates\
    \ the number of times that output has been printed (the 10 on the left).\n\nDoing\
    \ the same for every iteration is boring. But how can you tell the for loop to\
    \ do something different each time through? Well, there is a variable that changes\
    \ predictably with each iteration: i. You can actually incorporate i into the\
    \ sequence of commands within a for loop:\n\n```\nfor (var i = 0; i < 10; i++)\
    \ {\n  console.log(i);\n}\n```\n\n![](img/0772fde882e37540dc00155fda693004_252_0.png)\n\
    \nFigure A.10  Logging the iterations"
  merge: -1
  pgno: 252
