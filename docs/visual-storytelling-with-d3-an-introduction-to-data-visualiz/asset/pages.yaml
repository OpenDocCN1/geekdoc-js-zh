    # Creating a Server to Upload Your Data


    There is a little bit of setup required to use D3 to pull in external data. A
    lot of browsers will prevent you from accessing files stored locally on your computer
    when you do the kinds of data requests that D3 does. So how do you set up your
    own little mini-server? Don''t worry, this is dead simple.


    You''ll need to have Python installed on your computer. It comes preinstalled
    on Mac OSX, Ubuntu, Fedora, and a few other operating systems. But if you are
    on a Windows machine, you''ll need to download it, which you can get at: https://www.python.org/download/


    # Initiating a Server on the Command Line


    The first thing you need to do is make a directory for this project on your computer.
    That''s just a fancy way of saying create a folder on your desktop called population.


    Now, open your terminal emulator (called Terminal on a Mac or a Linux machine,
    the DOS window or command line prompt on Windows), and navigate to the folder
    you created. You can do that by typing this in the command line: `cd Desktop/population`


    Now you can set up a server that points to that directory. Type the following
    into the command line:

    python -m SimpleHTTPServer 8888 &


    If you open your browser and type "localhost:8888" into the address bar, your
    browser will navigate to your local server—it will show you what''s in that population
    folder (see Figure 7.2).


    Of course, right now, it''s a whole lot of nothing.


