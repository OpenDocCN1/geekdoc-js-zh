  md: 'for everyone to see, then you probably aren''t trying to keep the data secret.
    But it''s something to keep in mind if your source has asked you not to distribute
    their raw data.


    # Tools You Will Need


    To build in D3, you have to get your hands dirty writing some code. So, if you
    don''t already have one, you''ll need a good text editor. Why not use a word processor
    like Microsoft Word or the text editor that came with your computer? Because they''re
    not made for programming, so they don''t do anything to make your life easier.


    One simple—but very useful—feature that a good programming text editor usually
    is called syntax highlighting. Programming languages have different elements that
    are sort like parts of speech: English has nouns, pronouns, verbs, and adjectives,
    JavaScript has functions, numerals, and operators. A text editor with syntax highlighting
    displays those different elements in different colors, which makes it infinitely
    easier to see what''s going on in the code and to fix any problems with.


    Text editor preferences wisely. The website tutorialquiz.com has a really useful
    overview of a variety of text editors, which of some are totally free (http://tutorialz.com/2012/07/battle-of-the-tools-which-is-the-best-code-editor/).


    The other thing you''ll need to build in D3 is a set of browser-developed tools,
    including a web inspector and a JavaScript console. Developer tools let you change
    the HTML, CSS, and JavaScript of a page and see the results instantly. This saves
    you the of, guessing the font size you want to use for a line of text, putting
    it into your markup, realizing it''s too small, trying another font size, saving
    again, etc. The JavaScript console, as we''ll see, is critical for debugging.


    The good news is that all modern browsers have developer tools available. Google
    Chrome, Safari, Opera, and Internet Explorer 9 and above all have developer tools
    built in the browser. Firefox has an add-on called Firefox. In the chapters ahead,
    we''ll rely heavily on the web inspector and console.


    # Summary


    Data visualization can be an extremely powerful way to tell a story because it
    gives information a form that readers can interpret in an instant. However, that
    story is only as interesting as the information behind it. The crux of good visualization
    design is choosing a good combination of graphical elements and their attributes
    for displaying the data you want to display. It turns out that D3''s specialty
    is pairing data sets with graphical elements. For data-driven documents, D3 is
    an opensource library of JavaScript. D3 is for designers because it makes it possible
    for you to do a lot with SVG, a familiar graphical format, and it''s for coders
    because it relies solely on standards. To build in D3, you need two key tools:
    a good text editor and a browser with developer tools.'
