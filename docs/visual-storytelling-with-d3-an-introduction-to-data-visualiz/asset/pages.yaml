    It''s also possible to set the range before you set the domain:


    ```

    var x = d3.scale.linear()

    .range([0, width]);

    x.domain([0,d3.max(popData), function(element) {return element.value()});

    ```


    So, we can set the ranges for each of our scales outside of the callback function,
    and set the domains inside.


    But wait, there''s more! We can also set up our axis generators outside of the
    callback function. They don''t depend directly on our data, but rather on our
    scales. Does it matter that the domains of our scales aren''t set until we''re
    inside of our callback function? Nah. By the time we actually use the call() method
    to create our axes, those domains will have been defined.


    Here''s what the code would look like, with only the truly necessary stuff inside
