  md: 'Now let''s step through what we have piece-by-piece. The first little bit of
    code is perfect:


    ```

    d3.select(*.selected)

    .classed("selected", false);

    ```


    Every time the chart updates, we want to remove the class selected from whatever
    the currently selected year button is. What about this next bit?


    ```

    d3.select(*selected)

    .classed("selected", true);

    ```


    It''s a little problematic. Can you see why? This code is designed to create a
    selection out of a year button so we can add the class to it. Right now, it relies
    on this to create that selection. That is totally fine when a user has just clicked
    a year button—this refers to the year button clicked. But we want our update function
    to be general. We want to pass in a year (updateYear) and have it update, and
    we can''t rely on this to do that.


    So can we use updateYear to create a selection out of the right button? It turns
    out that D3 has a filter method you can use to take a selection of multiple elements
    and winnow down to only the elements you want. It works a lot like the array method
    filter, there''s one major difference: it is designed to work on selections, you
    can use it to filter based on bound data.


    This helps, because we already have a selection of all the buttons, stored in
    a variable called buttons. We can use filter to winnow it down to only the button
    that is bound to updateYear.


    ```

    buttons

    .filter(function(d) { return d == updateYear; })

    .classed("selected", true);

    ```


    Great, let''s move on to the next bit of code.


    ```

    year = d;

    ```


    ```

    popData = data.filter(function(element) {return element.year == year});

    ```


    This is close. We just need to change two things. First, the variable d doesn''t
    exist within our update function. But that''s an easy fix—we just set year equal
    to updateYear.


    Actually, on second thought, why bother? We don''t need to worry about changing
    the year variable. Instead, we can just use updateYear where we had previously
    using year.


    ```

    popData = data.filter(function(element) {return element.year ==

    updateYear});

    ```


    Finally, let''s look at our last bit of code.


    ```

    bars.data(popData, keys)

    .transition();

    ```'
