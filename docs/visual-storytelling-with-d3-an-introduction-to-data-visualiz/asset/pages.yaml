  md: '# Appendix B Cleaning the Population Distribution Data


    file ends up as its own JavaScript object. And to be able to use data-joins in
    the way we would like to, it makes sense for each object to contain only one data
    point. Thus, every row in our CSV file should only have one data point. This is
    not the case in rawData.csv—currently, each row contains 17 data points. So we
    need to massage the data a bit to get it in the right format.


    A note about what I mean by "one data point." A data point can (and should) be
    more than just a single value—it can also have descriptive information associated
    with it. For example, the portion of the population between 0 and 4 in 2010 was
    9.3%. That value—0.093—is the point, but there are also two pieces of descriptive
    information: the year (2010) and the group (0-4). In our ideal CSV file, that
    descriptive information belongs on the same row as its data point. Why? Because
    you want it to be part of the JavaScript object when it is interpreted by D3.
    Then you can use it for say, creating scales, positioning bars in a bar chart,
    or using keys when you compute a data-join, as we did in this book.


    As it turns out, there is a package in R (you can think of R packages as being
    like JavaScript libraries) that has a function that takes a table like the one
    in rawData.csv and melts it down that every data point is on its own row. In fact,
    the function is called "melt" and the package is called "reshape".


    Open R. The interface, shown in Figure B.24, is a console where you type your
    code in the R language. (Your console is probably customized with colors of mine.)


    ```

