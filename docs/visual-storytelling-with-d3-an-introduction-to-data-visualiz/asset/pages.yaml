  md: 'Web-based visualization tools that came before, such as Protovis, Flare, and
    the JavaScript InfoViz Toolkit, all relied on their own, distinct ways of structuring
    graphs on a page (in technical terms, they used their own scene graphs). What
    D3 does instead is provide a way to directly manipulate the web''s native scene
    graph—the document object model—using data.


    D3 also adopts some useful conventions from other JavaScript libraries. For instance,
    it enables you to chain methods the same way you can with jQuery.


    # # Things for Which You Should Not Use D3


    I''ve probably made it sound like D3 is the only tool that, as a builder of visualizations,
    could ever possibly need. Unfortunately, that isn''t the case. When you get to
    the point where you have a fully formed idea of how to display the data you want
    to display, D3 can take the rest of the way away. But it can''t find you a story
    or figure out the best visual to tell that story (This isn''t entirely true. People
    who are really good at using D3, such as Mike Bostock (its creator) and Shan Carter
    of The New York Times, use it to make bare prototypes of typography, particularly
    in cases where the form is experimental).


    D3 also isn''t built for scraping data off the web. The programming language Python
    has a couple of libraries that are really good at doing that.


    D3 is not good for sorting through data or doing basic data analysis. Spreadsheet
    applications like Excel, OpenOffice Calc, and Google Drive''s spreadsheet are
    useful and accessible tools for this kind of work. For more advanced analysis,
    the statistical programming environment R is incredibly robust and powerful.


    The other thing is that D3 isn''t built for quickly making charts, maps, or other
    standard charts. If you want a plug-and-chart generator for the web, something
    like Tableau is a better fit. In computing and software, there''s always a trade-off
    between power and ease of use. Compared to R, Microsoft Excel, with its graphical
    interface, is a breeze to learn and use, but it can''t do as much as D3. D3, like
    R, was designed to be powerful and robust: You can use it to create a multitude
    of forms and to customize your visualizations to a much greater extent than you
    can with Tableau. The trade-off is that they are both harder to learn, and when
    it comes to D3 in particular, you can''t use it to create a chart in two minutes
    or less.


    # # Notes on Using D3


    You are free to use D3 to make something for fun or to sell without paying any
    royalties or even mention D3 by name. It''s totally open. But D3 doesn''t support
    all browsers, because not all browsers support web standards. The-called modern
    browsers—Google Chrome, Firefox, Opera, Safari, and Internet Explorer 9 and above—all
    do.


    Anybody who looks at a project you''ve made in D3 can access all of the data behind
    it. Usually, this level of transparency isn''t an issue: If you''re building a
    visualization'
