- img_proc: true
  md: "# Age distribution of the world\n\n▶ PLAY ALL YEARS\n\n1950 1955 1960 1965\
    \ 1970 1975 1980 1985 1990 1995 2000\n2005 2010 2015 2020 2025 2030 2035 2040\
    \ 2045 2050\n\nAGE GROUP PORTION OF THE POPULATION\n\n![](img/0772fde882e37540dc00155fda693004_226_0.png)\n\
    \nFigure 9.2 Playing with style\n\nWhen that play button gets clicked, we want\
    \ the chart to cycle through all the years. How can we do that? Let's try using\
    \ a for loop.\n\n```\nplayAllOn(\"click\", function () {\n  for (var i = 0; i\
    \ < buttonYears.length; i++) {\n    update(buttonYears[i]);\n  }\n});\n```\n\n\
    What do you see when you run that code and click the play button? The chart immediately\
    \ jumps to 2050, right? Do you know why? It's because the for loop runs all of\
    \ its iterations very quickly and doesn't pause along the way to let the chart\
    \ update. We need to use something different, something that will behave like\
    \ a for loop, but will take a breath after each iteration instead of just rushing\
    \ through them.\n\nI happen to know of such a function—it's called setInterval().\
    \ It basically takes two arguments. The first is a function() and the second is\
    \ an amount of time, in milliseconds. What setInterval() does that function in\
    \ the first argument"
  merge: -1
  pgno: 226
- img_proc: true
  md: "# Chapter 9 Adding a Play Button\n\nand run it over and over, with a period\
    \ equal to the number of milliseconds specified in the second argument. For example,\
    \ if you pass setInterval() a function that creates a pop-up window reading \"\
    Hello,\" and a time of 1000 milliseconds, then setInterval() will keep producing\
    \ a new pop-up window every second. Forever! Or until you turn it off using a\
    \ function like clearInterval().\n\nOkay, so how might this work in our case?\n\
    \n```\nplayAll.on(\"click\", function() {\n  setInterval(function() {}, 700);\n\
    });\n```\n\nI went ahead and picked a time for us: 700 milliseconds. Remember\
    \ that it takes our 500 milliseconds to update. That extra 200 milliseconds will\
    \ give us a little bit of a pause in each year, which is a good thing. We don't\
    \ want our animation going too fast.\n\nBut choosing a time is the easy part.\
    \ What goes inside of anonymous function? Just like with the for loop, we want\
    \ our setInterval() function to iterate through all of our years, or equivalently,\
    \ all the values in our buttonYears array. How can we do that? We can follow the\
    \ conventions of a for loop and set up a loop counter (i) that increments every\
    \ time the setInterval() function completes an iteration.\n\n```\nplayAll.on(\"\
    click\", function() {\n  var i = 0;\n\n  setInterval(function() {\n    update(buttonYears[i]);\n\
    \n    i++;\n  }, 700);\n});\n```\n\nNote that we initialize that loop counter\
    \ outside of our setInterval() function. Why? Because otherwise, the counter would\
    \ be set back to 0 with each iteration, and the chart would always display the\
    \ first year, 1950. Try running the code above and then clicking on the play button.\
    \ It works, right? Huzzah!\n\nWell, it doesn't work. We never shut off that setInterval().\
    \ It just keeps running and running. (Don't believe me? Add a console.log() statement\
    \ to the inside of the setInterval() function and watch it continue to get repeated\
    \ after the play sequence makes it to 2050.)\n\nThat is enough in and of itself.\
    \ There is no reason to make somebody's browser do useless work. But not shutting\
    \ off creates a couple of visible problems. When the play sequence gets to 2050,\
    \ the button for 2050 becomes bold, but then that boldness goes away (the first\
    \ time our update() function does remove it, and in this case, update() continues\
    \ to get called after the sequence has reached 2050). This leaves us with a chart\
    \ that has no indication of which year"
  merge: -1
  pgno: 227
- img_proc: true
  md: "# Allowing the User to Interrupt the Play Sequence\n\nit is showing. Also,\
    \ if you click on one of the year buttons, 1960, after the play sequence has blown\
    \ past 2050, the chart will update to 1960, and the button will momentarily turn\
    \ bold, but then that boldness will go away (again, because the loop counter is\
    \ still ticking higher and higher and the update() function is still being called.\n\
    \nClearly, we need to trigger a stop when it reaches 2050. We can do that using\
    \ the function clearInterval().\n\n```\nsetInterval(function() {\n\n  update(buttonYears[i]);\n\
    \n  i++;\n\n  if(i > buttonYears.length - 1) {\n    clearInterval();\n  }\n},\
    \ 700);\n```\n\nHmm...but as you notice, the code above doesn't do what we want\
    \ it to. The reason is that the clearInterval() function needs to know what interval\
    \ you're talking about. Assigning our setInterval() call to a variable and then\
    \ passing that variable to clearInterval() will do the trick:\n\n```\nvar playInterval\
    \ = setInterval(function() {\n  update(buttonYears[i]);\n\n  i++;\n\n  if(i >\
    \ buttonYears.length - 1) {\n    clearInterval(playInterval);\n  }\n}, 700);\n\
    ```\n\n# Allowing the User to Interrupt the Play Sequence\n\nThere's one more\
    \ minor issue we should take care of. Click the play button. Then while the sequence\
    \ is running, click one of the year buttons. You'll notice that the chart updates\
    \ to the year you clicked, but then the play sequence picks right back up where\
    \ it left off.\n\nThis is not ideal. We should give the user a way to interrupt\
    \ the interval. What if she clicked the play button by accident? Or if she wanted\
    \ to stop on a pathway into the sequence? Not every user will feel the need to\
    \ interrupt the interval, of course, but some users might. It's something worth\
    \ accommodating.\n\nAnd doing so is relatively easy. (I encourage you to try it\
    \ on your own.) All we have to do is add a clearInterval() call to the event handler\
    \ that is triggered when any of the year buttons is clicked."
  merge: -1
  pgno: 228
