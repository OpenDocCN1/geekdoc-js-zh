  md: '# Appendix A JavaScript for Beginners


    ```

    // Booleans (true or false)

    5 > 4;

    5 == 4;

    var myBoolean = (4 > 5);

    ```


    Booleans might be a little confusing if you''re a programming newbie. What''s
    the value in all this true or false business? You''ll find that it''s useful to
    set up conditionals in your JavaScript—to only run a snippet of code if some condition
    is true, say, if a variable is larger than 5. We''ll go over how to do that using
    an if statement later in this chapter.

    It''s not common, at least in my experience, to store a Boolean value in a variable;
    it''s far more common to just type out a Boolean expression inside of an if statement.
    To use Booleans effectively, you need to be familiar with a few comparison operators
    and a few logical operators (see Table A.1).


    # Table A.1 Operators


    | Operator | Definition |

    | --- | --- |

    | == | is equal to |

    | != | is not equal to |

    | > | is greater than |

    | < | is less than |

    | >= | greater than or equal to |

    | <= | less than or equal to |


    Logical operators


    | Operator | Definition |

    | --- | --- |

    | && | And |

    | || | or |

    | ! | Not |


    Listing A.4 presents some examples of Boolean expressions.


    ```

    Listing A.4 Examples of Boolean expressions.

    5.1 >= 5;

    3 != 3;

    5.1 >= 5 && 3 != 3;

    5.1 >= 5 || 3 != 3;

    !(5.1 >= 5 && 3 != 3);

    "Hello" == ''Hello'';

    ```


    One final note on data types and operations. JavaScript will do what is called
    automatic type conversion (see Listing A.5). Recall that the + operator means
    addition'
