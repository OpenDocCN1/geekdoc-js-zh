    # # Variable Scope


    JavaScript offers two scopes for variables:


    +   - Global within the current window (defined with or without var)

    - Local within the current function (must be defined with var)


    Function statements can get and set all global variables, but can get and set
    only local variables defined within the same function. The system is pretty simple,
    if loose. If you forget to use the var keyword when defining a local variable,
    it becomes a global variable. Even an external JavaScript library can define a
    global variable as it loads into the browser. But when you load a new page into
    the browser, all variables from the previous page are gone and scripts in the
    new page start over.'
