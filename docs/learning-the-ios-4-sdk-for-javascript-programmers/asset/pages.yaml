  md: '# CHAPTER 5


    # App Execution Flow


    Web developers are accustomed to seeing their code creations—HTML, CSS, and JavaScript—interpreted
    by browsers from top to bottom. As a web page loads, the browser immediately begins
    turning whatever it can into rendered content, applying styles, precompiling JavaScript,
    and depending on the page design, executing various JavaScript pieces. A script
    statement that runs while the page loads and relies on a function must find function
    already defined in the code order, or a script error may block all further scripts.
    Your code may also be dependent on an event such as the window object''s load
    event, whose firing means that all of the document elements are in place. Whatever
    your page entails, a highly predictable sequence of events occurs during the loading
    stage.


    When it comes to a compiled iOS app, however, source code becomes less important.
    Dependencies are less about the precise order of source code files because the
    compiler goes through the entire project, pulling together the pieces into a single
    application. In this chapter, you will follow the way code execution flows in
    the Workbench app. This will introduce you to some vital services in the Objective-C
    and Cocoa Touch environments that perform the jobs you currently associate with
    browser events, such as the load event. Let''s face it: an iOS app needs to do
    a bunch of work when it starts loading to present itself to the user You will
    be amazed by how much of the activity occurs automatically, provided you know
    where to look for the automated triggers.


    # Some C Language Roots in an iOS App


    If you read any tutorial on the C programming language, you will soon learn that
    the entry point to any C program is a function named main(). In other words the
    C compiler assembles all of the code into an executable file whose first job is
    to invoke the main() function automatically when the program starts. That function
    becomes the launching pad for whatever else the program does. So has it been in
    C programs for decades. Believe it or not, your iOS app also relies on a main()
    function to get things rolling when an app launches. Fortunately, Xcode does all
    of the work for you, writing'
