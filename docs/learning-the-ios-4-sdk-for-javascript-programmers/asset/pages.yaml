  md: '# Naming and Saving the New Project


    Next you will be presented with a Save file dialog box. This is where you will
    specify the location for the project folder and the name of the app. These are
    two separate points that should be given a bit of thought.


    Be aware that Xcode will create a folder for the project (using the name you assign
    in a moment). In other words, the folder location you choose in the New Project
    dialog box will be a kind of master folder into which you will place each of your
    iOS SDK folders (one project per app). By default, Xcode suggests placing your
    apps in the user Documents directory. I prefer to keep all my projects for a particular
    iOS version grouped together on a hard disk. Use an organization scheme that makes
    the most sense for you.


    +   Avoid the temptation to save your projects inside the Developer directory
    created during SDK installation. A future SDK update could invasively modify that
    directory''s contents. Save your projects elsewhere.


    ![](img/892a27734158da62dfa9872a01022ecc_46_0.png)


    The name you assign to a new project will ripple through the project''s files
    in ways that will surprise the newcomer (you''ll get to see some of the implications
    later in this chapter). Although the name you assign at this stage does not have
    to stay with the app all the way to the App Store or to the app''s label in the
    home screen, I recommend not trying to be too clever while thinking up a project
    name, especially if you have not yet figured out what you want to call the app
    in the App Store.


    By convention, project file names begin with an uppercase letter, although this
    is not an absolute requirement. One reason for project naming convention is that
    Xcode generates some project files and objects beginning with the name you assign,
    and those files'' names typically begin with an uppercase letter.


    For multiple-word project names, I recommend using CamelCase formatting rather
    than spaces between the words. If you use spaces, Xcode will turn those spaces
    into underscore characters for the filenames it generates.


    For the Workbench project, assign the name Workbench and click Save.


    # Welcome to Your Project


    After a little bit of churning, Xcode creates the new view-based project represented
    in the window shown in Figure 3–4.


    Let’s take a quick tour of the window, starting with important items in the toolbar
    at the top.'
