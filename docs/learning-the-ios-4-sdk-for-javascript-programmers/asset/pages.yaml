    # Math Object Equivalents in C


    The core JavaScript language has a static Math object, which features a number
    of methods and properties that act as constants. For example, if you want to determine
    the next integer floor for a floating-point value, use the floor() method of the
    static Math object, as:


    ```

    var floorValue = Math.floor(myValue);

    ```


    The C language does not have a dedicated object for that. Instead, it implements
    series of functions, which you can call directly in your statements. For example:

    double floorValue = floor(myValue);


    Table 7-3 lists the JavaScript Math functions and their corresponding C functions.
    The standard C language offers more variations of these functions (in the math.h
    and stdlib.h libraries automatically incorporated into every iOS app), offering
    levels of precision. For Table 7-3, I have chosen versions that return values
    of the double data type. Also pay special attention to the required type of values
    passed as arguments to the C functions.


    Table 7-3. Math functions comparisons


    | JavaScript | Description | C/Objective-C |

    |---|---|---|n| Math.abs(x) | Absolute value | double fabs(double x); |

    | Math.acos(x) | Arc cosine | double acos(double x); |

    | Math.asin(x) | Arc sine | double asin(double x); |

    | Math.atan(x) | Arctangent | double atan(double x); |

    | Math.atan2(x, y) | Angle of polar coordinates | double atan2(double y, double
    x);'
