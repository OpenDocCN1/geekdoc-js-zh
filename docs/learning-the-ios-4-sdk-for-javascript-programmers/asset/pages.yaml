  md: '# CHAPTER 2

    Welcome to the iOS SDK


    Even in these days of powerful high-level web authoring tools, it''s still common
    for JavaScript programmers to compose or modify code with nothing more sophisticated
    than a text editor. Perhaps you use that text editor to work on .html, .css, and
    .js files that users access directly; or use that text editor to write server
    code while HTML code served up to requesting browsers. (in Python, Perl, Ruby
    on Rails, or one of several other languages), which in turn assembles HTML served
    the browser as a code interpreter (even if it performs some precompiling behind
    the scenes), the write-test-debug cycle is pretty fast: make a code change and
    reload the browser to test the results. Egregious errors, such as JavaScript syntax
    errors, signal themselves while the page loads; more subtle errors, such as referencing
    an object that hasn''t yet been created, when the code runs.


    When you switch to native app development, this comfy authorizing environment
    and cycle go out of the window. Luckily, it''s replaced with an integrated and
    visually oriented environment—once you learn its ways—reflects a lot of the best
    in modern programming environments. This is the native iOS SDK, whose nucleus
    is Xcode. Among others Xcode helps you visualize and manage the potentially large
    number of files with each app in development.


    Additionally, the tools delivered with Xcode are highly integrated. For example,
    you will write some code that responds to a user tapping a button in an iPhone
    app: the tool you use to create the user interface is aware of the code you written
    and helps you connect the button in the user interface to that code. The user
    interface tool is instantly aware of changes you make to the code, even though
    the tools are separate programs in the Dock.


    # Hardware and OS Requirements


    As mentioned in Chapter 1, you need an Intel-based Macintosh running Mac OS X
    version 10.6 (Snow Leopard) or later to use the Xcode IDE. As Apple releases new
    versions of the iOS SDK and Mac OS X, requirements may change.'
