  md: '# Apple Developer Program


    A prerequisite to submitting a native app to the App Store is an annual paid membership
    to the iOS (formerly iPhone) Developer Program. The current fee is $99.00 per
    year. Membership lets you obtain the necessary digital certificates that permit
    developers to load native apps onto test devices and to upload finished apps to
    the App Store for approval. You also have access to beta versions of the next
    version of iOS SDK software (all under nondisclosure agreements


    In addition to paying the developer fee, you must also complete a distribution
    contract with Apple. For paid applications, the contract process also requires
    that you establishing relations with Apple. As with app approvals, the time required
    to complete the contract varies depending on busy Apple. It''s not something to
    leave to the last minute, because it can take several weeks to complete, even
    longer for developers outside of the United States. Once you pay for the iOS Developer
    Program, you should begin the contract process, even as you work on your first
    native app.


    # Content


    As the gatekeeper to “shelf space” on the App Store, Apple''s approval process
    also imposes restrictions on the content of native apps. Your developers agree
    all the fundamental guidelines, but Apple inspects each app for compliance on
    a case-by-case basis.


    Such is not for web apps. You can serve whatever you want (within the confines
    of your local laws, of course) because the web app is hosted on your server and
    the device''s owner can freely decide to visit your server or skip it.


    If you are already aware that web apps—indeed any content to be played through
    the Mobile Safari browser—cannot avoid themselves of Flash or Java, you should
    also be aware that native apps don''t get any further with respect to those two
    software platforms. As of this writing, iOS does not natively support either runtime
    environment.


    # Authoring Platform Choices


    You can write HTML, CSS, and JavaScript code with a text editor on any operating
    system platform of virtually any generation. Plain text editing doesn''t even
    require a graphical user interface, which is why you can find Unix programmers
    using code in command-line interface editors, such as Emacs and vi (or variants
    thereof). The key to this flexibility is that conversion to machine code occurs
    in the web browser. Such is not the case for writing native apps.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Developing native iOS apps requires Apple’s integrated development environment
    (IDE) called Xcode (pronounced EKS-code). Even though Windows users can sync their
    iOS devices to their PCs via iTunes for Windows, the Xcode IDE is available only
    for Macintosh computers.


    # Taking the Plunge


    Beginning with the next chapter, you will see the changes to the development process
    and programming environment that you will have to adopt to develop native apps.
    Some of the changes are radical, so if you jump into the programming environment
    cold, the transition will seem overwhelming. But, just as you learned the intricacies
    of CSS, JavaScript, and the DOM, the same will happen with iOS SDK development
    with practice and experience: throughout this book, you’ll learn new concepts
    that build upon one another. My purpose here is to help you embrace that transition
    by putting new items in the context of your existing knowledge.


    Let’s get started.'
