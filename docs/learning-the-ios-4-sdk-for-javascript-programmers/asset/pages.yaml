  md: '# Import frameworks


    At the top of the uncommented code in the header file comes the place where you
    declare that framework(s) the current class requires:


    ```

    #import <Foundation/Foundation.h>

    ```


    Statements beginning with the pound symbol (#) are called preprocessor directives.
    When you build (compile) an app with Xcode, source code files are initially scanned
    by a preprocessor, which obeys instructions in these directives. There are a limited
    number of preprocessor directives, but #import is one you will use frequently.
    It instructs the compiler to locate the file and blend it into the current file.
    In some ways, it works like the HTML link element, which commonly brings an external
    file (e.g., .cc file) into the scope of the source document.


    An #import directive connects your program to an header file that has the definitions
    you need. The directive has two ways of referring to files that are be imported
    into the class. The one shown above, with the angle brackets, typically imports
    standard frameworks. The other style (which you will see in the DGC methods shortly)
    is for importing class files you bundle in your own app.


    In the case of DGCar, the Foundation framework (which you can visualize as a folder)
    contains a bunch of header files, each of which is named Foundation.h. That header
    file contains a long list of #import directives that instruct the preprocessor
    to the individual Foundation framework header files (such as NSArray and NSDictionary.h).
    You can see this in Xcode for the Workbench project and then the Foundation framework
    “toolbox” icon and the nested Headers folder. Click on the Foundation.h and you
    will see the list of individual framework files being imported into the DGC class
    (Figure 4-4).


    A class header can import multiple frameworks. For example, if the purpose of
    Work is to display and work with maps, any class file that needs to communicate
    with the APIs in the MapKit framework would include an #import directive for that


    ```

    #import MapKit/MapKit.h

    ```


    You would also have to add the MapKit framework to the project, as discussed earlier
    in this chapter in “Adding Frameworks” on page 55.


    # How Gigantic Are Frameworks?


    If you''ve used JavaScript or web app frameworks in the past, you are well aware
    that they contain a lot of code that has to be delivered to the browser. Sometimes
    they need to be compressed to make the download speed tolerable to users. Considering
    the number of things that iOS frameworks do, you might wonder what impact they
    have on the size of an app file that is installed on a device. The answer: none.
    All of Apple''s iOS frameworks are built into the operating system. The compiler
    generates a .app file


    62 | Chapter 4: Structural Overview of an iOS App'
