    in the Cocoa Touch frameworks. However, if the object in question is of id dynamic
    type, you will have to send messages to the accessor methods rather than use dot
    syntax. This is the compiler won''t be able to resolve the dot syntax property
    against an indeterminate data type. When you use the message syntax with a dynamic
    data type, the compiler leaves the resolution to runtime.


