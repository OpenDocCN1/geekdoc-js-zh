    *Table 9-1. NSFormatter object preformatted styles*


    | Style | Output |

    | --- | --- |

    | NSFormatterNoStyle | 3 |

    | NSFormatterDecimalStyle | 3.142 |

    | NSFormatterCurrencyStyle | $3.14 |

    | NSFormatterPercentStyle | 314% |

    | NSFormatterScientificStyle | 3.141590 |

    | NSFormatterSpellOutStyle | three point one four five nine |


    A number style only sets a basic category of representation, leaving many additional
    factors to be specified, especially zero padding to the left of the number and
    digits to set to the right. That''s where a series of attribute settings come
    into play as separate methods of the NSFormatter object. The list of all possible
    settings is huge (the "NSFormatter Class Reference" document in the SDK documentation),
    but I will highlight several that probably remind you the kinds of formatting
    you have used in JavaScript programming and web page display.


    > Watch out for the NSFormatterPercentStyle. It assumes that source values are
    already factored out as percentages. For example, a source value of 0.5 is displayed
    as 50%.


