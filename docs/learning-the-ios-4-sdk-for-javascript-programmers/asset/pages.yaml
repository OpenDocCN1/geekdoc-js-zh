  md: "# Local Variables in Control Structure Blocks\n\nAs you will learn later in\
    \ this chapter, C and JavaScript have much in common when it comes to control\
    \ structures (repeat loops, ifs, switches, etc.). But the impact of these structures\
    \ on local variables is quite different. The looseness of JavaScript will potentially\
    \ trip up in the C/Objective-C world.\n\nConsider the JavaScript function (artificially\
    \ constructed to demonstrate a point):\n\n```\nfunction localTest(input) {\n \
    \ for (var i = 0; i < 25; i++) {\n    if (i == input) {\n      var woohoo = i;\n\
    \    }\n  }\n  return woohoo;\n}\n```\n\nThe first declaration of the woohoo local\
    \ variable is nested inside an if construction, which, in turn, is nested inside\
    \ a for loop. The function returns the value of that nested value. A nested variable\
    \ in a JavaScript function is said to be hoisted to the scope of the function,\
    \ as if it were declared at the beginning of the function without an assigned\
    \ value.\n\nAlthough the function as shown will definitely return a value, if\
    \ the condition might be built to test the loop counting against some external\
    \ value (e.g., a number entered into a text field by a user). Under those circumstances,\
    \ it is very conceivable that the if condition might fail for every iteration\
    \ through the loop and never assign a value to woohoo. Yet the final return statement\
    \ attempts to return something woohoo. What happens in this case is that the value\
    \ returned by the function is undefined, which is the value implicitly assigned\
    \ to woohoo creates the variable. If the statement calls localTest() expects a\
    \ numeric value, your scripts will crumble into a heap. On the one hand, JavaScript\
    \ gives you wide latitude when it comes to scoping your variables; on the other\
    \ hand, you can get into trouble if you don't test for all possibilities and guard\
    \ against unusual results.\n\nIf you were to compare the equivalent Objective-C\
    \ method, it would look like the following:\n\n```\n(int)localTest {\n  for (int\
    \ i = 0; i < 25; i++) {\n    if (i == 22) {\n      int woohoo = i;\n    }\n  }\n\
    \  return woohoo;\n}\n```\n\nBut building this method triggers a compiler error\
    \ (actually, a few errors all tied to the same problem). The issue is that a variable's\
    \ scope is local to the control block in"
