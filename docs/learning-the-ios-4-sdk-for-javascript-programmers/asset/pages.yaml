    # Adding a Class Without Subclassing—Categories


    Objective-C 2.0 in the iOS SDK provides a mechanism called categories, which allows
    you to add methods (but instance variables) to an existing class without creating
    a subclass of that existing class. This feature will remind you of the JavaScript
    prototype property of an object to extend that object''s capabilities so that
    all instances of that object gain the new capabilities. In fact, you can use categories
    in Objective-C to add customized methods to classes if like, including NSString
    strings will have the customized methods available to them. Using a category,
    rather than subclassing, is the preferred approach to extend the functionality
    of a Cocoa framework with new (i.e., not overridden) methods.


    Defining a category is fairly easy, as of version 3.2 of Xcode, the IDE doesn''t
    provide a template for the necessary header and implementation files. Instead,
    you can generate a class that inherits from NSObject and manually edit the code
    as needed. To see how to create and use categories, you''ll create a category
    for the DGCar class that adds a new method to provide a different type of output
    of instance variable values in three lines with labels.


