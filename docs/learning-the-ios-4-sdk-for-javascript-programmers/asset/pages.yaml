    # About NSDictionary


    In the Cocoa Touch world, a dictionary is an object that holds a collection of
    values, each of which is associated with a unique key (sort of a label). A combination
    of the key and value is known as a key-value pair and makes up an entry in the
    dictionary. Keys within a single dictionary be unique, but you are free to reuse
    key names in different dictionaries in the same scope. Cocoa Touch provides NSDictionary
    for a dictionary whose contents and size remain fixed once it is created and NSMutableDictionary
    class (a subclass of NSDictionary) for a dictionary whose individual entries can
    change over time. If you''re looking for an analogue in the JavaScript world,
    the associative array comes closest in conception in that you can access a value
    by way of the value''s name. But NSDictionary is far more powerful than what JavaScript
    offers.


