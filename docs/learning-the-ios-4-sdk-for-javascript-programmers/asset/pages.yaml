  md: 'whether composed by me or served from a different external source. Because
    the news page is shown within a web viewer inside the app, links operate as they
    do in any browser, replacing the current page with the destination of the link.
    My in-app viewer provides just a minimum of browser controls for reloading, stopping
    a load, and back and forward navigation.


    In many ways, web development skills are powerful adjuncts to iOS development.
    Being comfortable in both environments means you can call on the right deployment
    tool for various parts of a native app. Hardcore Objective-C and Cocoa developers
    may be wary or unaware of the web powers that you have in your pocket. Once you
    master app development, you''ll have a distinct advantage over your Objective-C-only
    colleagues.


    # What You Lose


    By large, the full iOS SDK feature offers your app designs far more flexibility
    and the ability to recreate the full range of user interface features you Apple’s
    own apps and apps developed by third parties. But there are costs—in monetary
    and toll currencies—to obtain those native app powers.


    Except for apps designed for in-house corporate, native apps that run on nonmodified
    devices—i.e., iPhones and iPads that have not been jailbroken (hacked to allow
    unapproved third-party apps)—must be distributed by the iTunes App Store. This
    is both blessing and, for some cause, for several reasons.


    # About Jailbreaking


    When the first-generation iPhone landed in developers'' hands in 2007, quite few
    programmers were put off by the lack of a publicly available development environment
    for applications. Apple granted itself the power to build native apps included
    with the phone, but the developer community was shunted to the web app—with a
    Mobile Safari version boasting far app-friendly features than today’s HTML5-powered
    model. Some adventurous programmers, however, found ways to access the same interior
    programming functionality that Apple’s engineers had and opened native app programming
    to three parties. Having pierced through Apple’s restrictions, they called the
    one of these independent apps, an iPhone user had to “jailbreak” the device using
    a software-run process that grew easier and easier over time as jailbreaking tools
    improved.


    Several months after the initial iPhone debut—and perhaps by the encroaching jailbreak
    programming efforts—Apple released the iPhone SDK to allow third parties to write
    native apps, but only with documented routines. Restriction still ranks some developers,
    jailbreaking opens more internal routines to all developers. Jailbroken devices
    reportedly account for us as much as 10% of the world’s iPhone and iPad population
    (a higher percentage of active tech bloggers, who make jailbreaking seem more
    prevalent than it is). Although


    6 | Chapter 1: Why Go Native?'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'jailbroken devices can still download apps from Apple''s App Store, a separate
    store, called Cydia Store, offers apps designed for jailbroken iPhones and iPads.


    Some programmers believe it is almost an obligation to jailbreak their devices,
    lest they appear captive to the will of Steve Jobs. I personally prefer not to
    jailbreak my devices, for practical, rather than ideological, reasons: I want
    to know when I test my App Store apps, the devices are working like the ones owned
    by 90% or more of my potential customer base. The ultimate choice, however, is
    yours.


    # Distribution


    On the one hand, since the App Store is a single point of distribution, users
    of unhacked iPhone, iPod touch, and iPad devices go to the App Store in search
    of apps that will help them scratch it. While you may have to choose your app''s
    description carefully to help potential users search for your product, at least
    you don''t have to pay search engine optimization to get your app high in search
    results.


    On the other hand, the App Store becomes the one-and-only gatekeeper between your
    app and the consuming public. You must submit your finished app for approval before
    it appears in the store. Approval times can widely, often without explanation.
    Sometimes it''s a matter of only couple of days; other times it can take weeks.
    The same is true for updates to existing apps. If you need to issue an update
    to fix a bug, the approval time can be as long—and, inexplicably, sometimes longer—to
    get that maintenance release out to the world. You can apply for an emergency
    update to hasten the approval, but if you abuse that privilege, risk upsetting
    the gatekeepers.


    # App Updates


    Speaking of updates, the web app scenario is far superior to the App Store native
    app. You instantly deploy an to the server that hosts the web app whenever you
    want, as often as you want. This encourages app developers to issue frequent incremental
    updates rather than storing up files to submit to the App Store in less-frequent
    batches.


    If your apps are content-oriented, you can pass along those updates to a native
    app in a couple of ways. I described earlier how I use HTML to supply my app with
    new updates. Similarly, updated material can be supplied in other formats (e.g.,
    property XML files), a native app can read whenever it launches. Users can save
    newly acquired material to the device so that it is available to the app even
    if the device is not connected to the Internet the next time the app launches.
    Implementing this approach to updating an app takes a bit of advance planning,
    so it is well worth exploring the possibility early in the design phases of any
    iOS app.'
