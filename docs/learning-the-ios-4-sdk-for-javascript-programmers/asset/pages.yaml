  md: '# Objective-C Data Types


    The first batch of Objective-C data types you need to know are numeric (and come
    from C). You are probably familiar with the distinction between integers and floating-point
    numbers from your exposure to JavaScript''s parseInt() and parseFloat() global
    functions. These functions convert string versions of numbers to actual values
    for all kinds of math operations. An integer is a whole number (positive, negative,
    or zero) without any decimal places; a floating-point number can have a decimal
    to the right to designate fractional values between integers. Objective-C has
    many additional numeric data types, the differences among them concern themselves
    with precision and the size of memory reserved for these types.


    Table 6-1 lists the three basic data types (also called scalar types) you will
    encounter most frequently in iOS development.


    Table 6-1. Common basic data types


    | Data type designation | Value |

    | --- | --- |

    | int | Integer between -2147483648 and 2147483647 |

    | float | Floating-point number between 1.17549435e-308 and 3.40282347e+38 |

    | double | Floating-point number between 2.22507388507815e-308 and 1.79693134862315e+308
    |


    The C language defines other basic data types, all of which are used directly
    in the Objective-C world of the iOS SDK. But for the most part, you will be using
    the huge library of Cocoa and Touch data types in their place.


    > Objective-C suffers from the same type of floating-point errors that JavaScript
    values do. Use caution when performing arithmetic on floats if precision is needed;
    consider using a double instead. For the most part, however, you will use floats
    to satisfy values of fairly shallow precision as arguments.


    # Cocoa Touch Data Types


    You can divide Cocoa-based data types into two broad categories. The first includes
    data types for fundamental values used by many Cocoa classes and functions; the
    other contains the enormous range of classes defined throughout the Foundation,
    UIKit, and other frameworks that you import into your project.


    Two of the most common basic Cocoa data types are CGRect (plus its component data
    types) and NSRange. The "CG" stands for Core Graphics. CGRect values assist you
    with the creation and layout of rectangular objects (most views) on the screen.
    A CGRect is a language structure (described more fully in Chapter 7) whose members
    define an origin (the coordinate of the top-left corner of the rectangle) and
    the size (width and height)—everything rectangle needs to know with respect its
    placement and dimensions. Figure 6-7 illustrates the needs of CGRect within


    ![](img/892a27734158da62dfa9872a01022ecc_133_0.png)'
