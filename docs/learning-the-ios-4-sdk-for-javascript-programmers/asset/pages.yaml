    search from the end of the receiver. As with the lastIndexOf() method, the offset
    value returned for a successful search is measured from the beginning of the string.


    Options of this kind are applied in the form of bit masks, where you can specify
    or more constants whose values are designed to form unique numeric values when
    combined with the bitwise OR operator (|). For example, if you want to apply both
    the backward search and case-insensitive search at the same time, create a statement
    like the following:


    ```

    NSRange matchRange = [myString range:searchString

    options:NSBackwardSearch | NSCaseInsensitiveSearch];

    ```


    # ## Replacing substrings


