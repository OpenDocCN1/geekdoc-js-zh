  md: 'JavaScript offers the option to specify a date string as an argument to the
    new Date() constructor function, provided the string is formatted in a limited
    range of the correct ways, as in Date("October 28, 2010 15:30:00"). But what if
    the source material is in an entirely different format? The NSFormatter class
    has the answer to that.


    The NSFormatter in Cocoa Touch offers some shortcuts, but they rely on several
    fixed formats. The real world is rarely that easy. Furthermore, mastery of the
    NSFormatter takes a fair amount of study not only of the Cocoa Touch itself, but
    also of a complementary Unicode standards that explain date and time coding in
    excruciating detail (http://unicode.org/reports/tr35-6.html#Date_Format_Patterns).
    The coding is an introduction to a language that is unlike any of which, but mostly
    intuitive. I will not supply an introduction to the concepts and examples to give
    you an idea about usage.


    An NSFormatter object is a powerful entity that you can use both for converting
    a string into an NSDate object and extracting dates as strings in customizable
    formats for display on screen. Converting a string to an NSDate object, the format
    acts as a template that guides the object creation process to interpret specific
    character sequences as date components. Consider the following North American
    English representations of the date:


    +   * 3/4/11

    * 03-04-2011

    * 4 March 2011

    * Mar. 4, 2011


    I specifically cite North American English because in many parts of the English-speaking
    world, the first two dates refer to April 3, rather than March 4. These are only
    a handful of possible ways to represent a date. Add the day of the week, time
    and zone to the statement, and the possibilities are endless.


    Fortunately, when you need to work with a date format that arrives from a computer
    source, the format will be like the same for all values. It''s your job to design
    a template that matches the formatting of the incoming string to identify each
    of the component parts of the date (and/or time). The Unicode formatting document
    is a lengthy table that describes the placeholders for date and time components
    and how their representation affects format. For example, the “M” signifies the
    month, but the number of Ms in the position affects how the format expects the
    month to be portrayed. numerically; three “M” characters mean it’s the short-padded
    version (e.g., “Mar”); four “M” characters mean it’s the fully spelled-out version
    (e.g., “March”).

    Table 9-5 presents an abbreviated version of the Unicode table showing the placeholders
    and formats you are most likely to encounter.'
