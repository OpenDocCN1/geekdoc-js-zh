    # Determining Pointer Usage


    A large percentage of your coding will involve objects that are either instances
    of framework objects or your subclasses of those objects. The SDK documentation
    provides all the details you need to determine return value types for methods
    and method arguments. These predefined data types will grant a great deal of your
    coding.


    To demonstrate the power of the documentation, let''s take a look at an object
    with which we have yet worked. An app can access an Internet URL and accumulate
    the data supplied by the server as it arrives. This is how an app can retrieve
    XML data for updates. If you connect, you use the NSURLConnection class. If you
    search the SDK documentation for this class name, you will find the class reference
    document. One of the methods initiates an asynchronous connection, and is defined
    in the docs as Figure 6-4


    ```

    - (id)initWithRequest:(NSURLRequest *)request delegate:(id)delegate startImmediately:(BOOL)startImmediately

    ```


    Figure 6-4. NSURLConnection''s initialization definition from Xcode


    The method returns a generic id data type, but as an initialization method, it
    means you want it with an alloc message on the NSURLConnection class:


    ```

    NSURLConnection *myConnection = [[NSURLConnection alloc] initWithRequest:...];

    ```


    But take a look at the arguments and their parameter to see what kind of values
    our code must supply. The two easy ones are the delegate and startImmediately.
    The delegate always points to a class which delegate messages will be sent. Most
    of the time, the same class containing the initialization is the only one set
    up to handle delegate messages. Thus, the argument value will be self. startImmediately
    asks for a Boolean value. In Objective-C, the preferred convention is to use the
    constants YES and NO (unquoted) for those values. Because you normally want an
    asynchronous download to begin right away, the value passed to the startImmediately
    argument will be YES.'
