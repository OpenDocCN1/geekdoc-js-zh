  md: 'HTML document or rendered in a browser: it is merely the basic building block
    used to define more concrete "things" in a document.


    That brings us to the DOM Element object, which inherits directly from the Node
    object. Thus, an Element object offers the same attributes and methods of a node,
    plus special members that apply to any kind of element, such as the getAttribute(),
    setAttribute(), and getElementsByTagName() methods. All of these are defined in
    the DOM Core module.


    In the DOM module dedicated to HTML come definitions for objects more closely
    related to the items you put into HTML documents. One of the building blocks is
    the HTMLElement. It inherits all methods of the Element and (in turn) Node objects,
    plus acquires additional attributes that apply to all HTML elements, such as the
    id, title, and className properties. Going one step further, the HTMLImage element
    (represented in HTML by the <img> tag) inherits everything from the HTMLElement
    and adds further attributes that apply to its purpose of loading and displaying
    images—properties such as height, width, and alt. It is only by virtue of the
    inheritance chain—from HTMLImage element upward HTMLElement, Element, and Node—that
    an HTMLImage element has a named property.


    # @interface compiler directive


    The identical object-oriented notion of inheritance works in Objective-C and many
    Cocoa Touch classes. When you make a class of your creation (remember the initial
    capital letter convention!), you also specify from what class your new class inherits
    in the following format:


    ```

    @InterfaceSubClass : SuperClass

    ```


    Statements beginning with the $ are called compiler directives. In other words,
    they are commands to the compiler as it processes the file. The @interface directive
    tells the compiler that this section contains declarations of the variables and
    methods that will be fleshed out in the companion @implementation section. The
    compiler needs to know the name of the class: DGC in here. But to be an Objective-C
    class that will also be part of Cocoa Touch classes (like arrays and strings),
    custom classes need far more infrastructure than what you''ll be defining in the
    class files. This infrastructure comes from inheriting the characteristics of
    an existing object. Because DGC is a very simple class that needs just the bare
    essentials, it will inherit from the most fundamental class in the Foundation
    framework: NSObject. As you willan over time, most of the objects you work with
    from Foundation, UIKit, and other frameworks inherit has the role as the base
    class.


    When you read instructions by other programmers that tell you to create a subclass
    of some other class, the @interface section begins just as above, with the name
    of the class you''re creating, a color, and the name of the superclass. The superclass,
    in turn, must belong to the framework (or other header file) imported via the
    #import directive earlier in the header.'
