  md: 'Be alert to the recommended companion documentation noted for a class. Although
    the document mentioned in the UITextView reference in Figure A-3 is a fairly generic
    guide, you''ll find other classes pointing to guiding your specific programming
    tasks. Guides provide practical contexts and code snippets that explain usage
    of the class reference document.


    Most class reference documents link to sample code projects that demonstrate the
    current class. Numerous Apple engineers have created sample projects over the
    span of the SDK''s public availability. You''ll find a variety of programming
    styles and implementation decisions that are far from uniform (e.g., whether the
    project employs user interfaces created through Interface Builder or code). Otherwise,
    look to the samples not so much as paragraphs of iOS or Objective-C coding, rather
    as suggested ways to implement specific app or language features. The issue being
    targeted by the sample may be well done, but the supporting material may be less
    impressive. You can find instructions for installing sample apps in Chapter 2.


    One point that I believe is missing from a typical class reference document is
    a notice of whether the class has a companion delegate (required or optional).
    For example, you can''t tell from the UITextView class document header that a
    class that creates a UITextView object should implement the UITextDelegate class
    to receive messages from a text view. A sharp eye searching the results for UITextView
    might spot the companion delegate class (see Figure A-2), but not necessarily.


    Every class reference document starts its body with an Overview section. The depth
    of these sections across classes vary quite a bit. If a class is new to you, the
    overview usually provides a good sense of implementation requirements and occasional
    gotches.


    The heart of a class reference document, however, consists of the detailed listing
    of methods, properties, and constants. A summary list appears after the overview,
    usually organized into groups. Figure A-4 shows the showing of the summary list
    for NSArray. The summaries begin with methods for creating and initializing an
    instance of the class. Sometimes the instance and class methods are together;
    others they are separated into distinct groups, as for NSArray. If you do not
    see initialization methods at the top of the summary, you can tell the class relies
    on initialization methods of one or more of its superclasses. Each entry in the
    summary is a link to the detailed listing later in the document.


    As you scroll through the rest of a class reference document, the grouping of
    items is usually different from the summary grouping. Sometimes properties are
    grouped together, as tasks (methods). Your best route to finding what you''re
    after, however, is through the summary listings at the top of their hyperlinks.


    Figure A-5 shows the detail listing for the initWithFrame: method of the UIView
    class.'
