  md: '# APPENDIX A


    # Getting the Most from Xcode Documentation


    The documentation that comes with the iOS SDK will become a frequent destination
    when you want to remind yourself about syntax details or discover frameworks features
    you may not have met yet. The amount of material is staggering, and Apple and
    its Developer Tools group must be congratulated for efforts to build a documentation
    system that is genuinely helpful to developers. Recent SDK versions have included
    more guides to you using the documentation. Choosing Help>Developer Documentation
    in Xcode opens the documentation window with a Quick Start page. You can''t go
    wrong taking advantage of the material presented there, including several tutorial
    videos that acquaint you with the overall system. I hope to present tips on understanding
    some of the things you see once you start digging into the documentation and learn
    how to dig out the truly valuable pieces.


    After you''ve watched the tutorial videos, I suggest visiting the "home page"
    of the iOS SDK documentation. In the documentation window, pull down the Home
    menu (near the top left corner) and choose the newest iOS version listed. The
    window will fill with three panes that present an overview (perhaps overwhelming)
    of the documents relevant to iOS development, see Figure A-1.


    Picking your way through the documentation the first time is a daunting experience.
    Apple has tried to make it more manageable by offering selected documents for
    getting started. It''s all good reading, and worth the effort, if it takes multiple
    times through some of the documents to drink it all in.


    Until you get a better sense of the range of frameworks available to you, it''s
    a good idea to scroll the list of contents pane on the left to scan through the
    list of framework groups. For example, you may not know whether a particular service
    is built into the Foundation framework or is more specialized, such as linking
    your app to the Address Book or adding mapping functionality. Selecting an item
    in the list of contents pane can reduce the list of relevant documents in the
    bottom right pane to a manageable'
