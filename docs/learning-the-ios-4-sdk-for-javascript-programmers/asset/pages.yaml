  md: 'You have an alternative technique available to you in C, and one that is very
    popular. The technique employs the compiler—via the #define directive—to substitute
    C values and expressions for occurrences of macro names within a file. It is commonly
    used for numeric values that permeate a class or project. If you need to change
    that value during the development of your app, you have to do it only once in
    the directive. For example, if you design an app that displays moving graphics
    on the screen, you might want to keep those images all the same size when they
    are created. You define the macro names and values like the following:


    ```

    #define kSpriteHeight 24

    #define kSpriteWidth 24

    ```


    Although these statements can go anywhere in a file, they are traditionally positioned
    at the top (just after #import directives). Also notice that these macro expressions
    do not end with a semicolon.


    With these macros defined, when you want to employ the values anywhere in the
    file, insert the macro name. The following statement creates a rectangle (destined
    to become the frame of the UIImageView that displays icons):


    ```

    CGRect spriteFrame = CGRectMake(0, 0, kSpriteWidth, kSpriteHeight);

    ```


    Imagine the size of the frame is utilized in several statements of a class. If
    you decide to change the size, simply change the values of the #define statements,
    rather than search for all instances of the hard numbers.


    You can go further by defining expressions that rely on others. For example, if
    you establish a relationship between sprite width and height that is to be maintained
    regardless of overall size, you can express the one based on the value of the
    other:


    ```

    #define kSpriteWidth kSpriteHeight * 0.8

    ```


    Now you only need to change the value of kSpriteHeight to affect both values.


    Projects that employ a large number of #define statements typically gather the
    materials all together into a single file. Every file that relies on one or more
    macros includes that file into its header file.

    As macro naming styles, you will typically encounter three variations. One precedes
    the name with a lowercase "k" (for "constant\). Another uses "g" (for "global\).
    The third employs uppercase letters, with underscores separating multiple words.
    Choose your favorite style and stick with it.


