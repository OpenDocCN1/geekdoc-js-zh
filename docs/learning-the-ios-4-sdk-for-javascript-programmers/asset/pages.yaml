  md: '# CHAPTER 7


    # C Language Fundamentals


    The C programming language may date back to 1972, but it is very much alive today
    in both its original form and in many object-oriented languages based on it, such
    as C++, C#, and Objective-C. The Objective-C used in the iOS SDK is not a different
    language from C, but rather a large set of extensions to C. You can use C syntax
    and constructions within any Objective-C program, blending the old and the new,
    even in the same statement. Additionally, parts of the Cocoa Touch set of frameworks—parts
    you will use frequently—rely on C constructions. Therefore, it is vital that you
    have a footing in C, especially those facets that permeate iOS development.


    This chapter intentionally does not show you everything about the C language.
    Some language features—especially data collections—are better served in their
    Objective-Cbased forms, are therefore reserved for the next chapter. Rather than
    burden you with C niceties you will rarely, if ever, use in development, this
    chapter hits the things you really need to know. You also get the benefit of learning
    where C is identical to what you already know from JavaScript and where you''ll
    have to adapt some of your existing JavaScript experience to the C world. From
    time to time I will supply code snippets to insert into the runCode: method of
    the Workbench app so you can see firsthand how the language feature works. I also
    encourage you to experiment with variations of what I supply to gain more experience
    and test boundaries.


    # Variable Names


    Your first lesson in C is a fairly easy one, because you will carry over almost
    everything from JavaScript intact. For example, the rules in naming variables
    are nearly identical: Table 7-1 summarizes them.


    Table 7-1 Variable naming rules in C and JavaScript


    | Rule | C | JavaScript |

    |---|---|--|

    | Case-sensitive | Yes | Yes |

    | First letter | Letter or underscore | Letter, $, or underscore |


    133'
