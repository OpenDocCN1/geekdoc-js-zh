    # The UITableView Class


    One of the most popular user interfaces across iOS apps is UITableView. It is
    the recommended way to present long lists of text and images. The iPod app, for
    example, uses numerous tables to display lists of albums, playlists, and songs.
    Each item occupies a cell. Typically, a tap on a cell leads to a detail view of
    the item tapped or a swipe, also implemented as a UITCollectionView that swoops
    from the side.


    Cocoa Touch allows you to create the window''s primary view as a subclass of UITViewController
    (rather than the generic UI you used in Workbench). Your view controller class
    becomes the delegate, and you are in the delegate methods—most of which Xcode
    provides where the magic occurs.


    A table needs information to display in cells—a data source. For a simple list
    of text, the data source can be an array of strings. As the view controller needs
    to fill visible cells with data, one of the delegate methods is called repeatedly,
    each time receiving a row number. A row number corresponds to a data source array
    index, and you can assign the array entry to the cell''s label for that row. A
    sophisticated mechanism reuses cells as the user scrolls the table to minimize
    memory usage. Xcode samples demonstrate how to implement them.


    Inside the TableView Representations are the following three subgroups:


    +   - View Controllers

    - Interface Elements

    - Data Sources


