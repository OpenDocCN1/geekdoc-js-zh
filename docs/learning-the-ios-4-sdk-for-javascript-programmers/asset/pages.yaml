    # Coding Styles in SDK Samples


    Apple engineers write code samples supplied with the SDK. You will therefore find
    a variety of styles in the way projects are composed. The lack of uniformity can
    be confusing to newcomers who desperately want to adopt a solid coding style.
    At best, you should look to the samples as just: mixed samples rather than specific
    instructions on how to structure projects, name variables and methods, and even
    how to divide code into separate files. Additionally, most samples aim to demonstrate
    a specific concept rather than define an all-around best practice example. Pieces
    of some samples from the primary subject matter may be less than optimal. Furthermore,
    as you learn more about Objective-C and the SDK, don''t be afraid to employ your
    own style and styles that are comfortable for you.


