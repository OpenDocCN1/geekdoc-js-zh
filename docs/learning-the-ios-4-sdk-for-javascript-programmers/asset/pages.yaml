  md: '# Pointers


    Many code examples thus far in this book have used pointers, but you may not not
    yet fully understand what a pointer is, how it differs from a regular variable,
    and when or if you should pointers for variables, method return values, and method
    arguments. JavaScript, like most interpreted languages, does not use pointers,
    the concept may be foreign to you.


    # Pointers and Memory


    To begin the exploration of pointers, it helps to have a visualization of what
    computer memory is and how programs use it. Although there are many types of memory,
    the kind we are concerned with is traditionally called random access memory, or
    RAM for short. Some types of RAM preserve their contents when not in use, while
    others empty everything when power is removed. For our discussion, RAM is RAM,
    regardless of what happens to it when the lights go out.


    Memory is divided into tiny spaces. Imagine a gigantic cabinet with identically
    sized cubbies. Each cubbyhole can hold one small chunk of information. While a
    program runs, it uses the cubby to temporarily store information. Various kinds
    of information require differently sized blocks of cubby to hold data—a short
    string of text requires very little space, while a two-megapixel image occupies
    a lot of cubbies, as represented in Figure 6-1.


    Keeping track of where a new chunk of information goes is one of the central processing
    unit, or CPU, of the device. The program (deep, deep down and with the help of
    the operating system) asks the CPU for a place to store information of a particular;
    the CPU locates an unused block of cubbies, and stores the data in those cubbies.
    Of course, the program will likely need to retrieve and/or change information
    over time, so the program needs to know where to get it (or more precisely, where
    to tell the CPU to get it).


    Helping this system along is a convention that assigns a numeric address to each
    cubbyhole. The numbers are all sequential, so if a 50-chunk block of data is stored
    in cubbyholding at number 100, the block of data occupies addresses 100 through
    149. When the program declares that it''s going to store data, the CPU not only
    locates space and moves the data into those cubbyholes, but the CPU also reports
    back to the program the address of the first cubby. That address—a numeric value
    for function or object, when the program wants to pass the data to another operation
    it doesn''t have to move or copy all of that data from memory to transfer it to
    another operation. Instead, the program passes only the pointer to the other operation
    can use the perfect copy of the data that exists in memory, demonstrated in Figure
    6-2. The actual image, myImage, is at location 2,419,920. Another word of memory
    holds the value 2,419,920, and this word is labeled *myImage (with the preceding
    star) because defining a pointer here.'
