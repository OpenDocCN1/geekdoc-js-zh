    # Sorting Arrays


    NSArray offers a few ways to sort the contents of an array, one of which will
    remind you instantly of JavaScript array sorting by a separate function. In all
    cases, pairs of array elements are compared against each other, just as they are
    in JavaScript. For any two-item comparison—the items are of type NSString, NSNumber,
    or NSDate—the sorting method reports whether the first item is lower, higher,
    or the same as the second. These states correspond to three values representing
    the result of the comparison of each pair of items. The sorting mechanism uses
    arrange the elements. The sorted version is either returned as a new array in
    the sorted order (NSArray) or applied directly to the original array (NSMutableArray).


    Your choice of sorting approach depends on the nature of the array. One approach
    is nicely suited to an array of simple objects (strings, numbers, and dates),
    while another lets you dig down to sort on a key within an array of dictionaries.
    I''ll start with the easy one.


