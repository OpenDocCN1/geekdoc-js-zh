  md: '# Reading and Writing Local Files


    Until very recently, the idea of JavaScript in a browser having access to the
    client file-system in any fashion beyond cookies was blue-sky thinking. Security
    concerns are genuine issues on the Web, and handling disk access to any website
    you stumble upon (or are misled to) is a recipe for disaster and pwnage. Standalone
    applications have traditionally had access to the mass storage device(s) attached
    to the client. For example, there are plenty of disk utility software programs
    for Mac OS X, Windows (all flavors), Unix, and many other operating systems—utilities
    that have free rein over the most profiles of files. iOS de meet you halfway.


    An important design consideration to be in mind is that Apple''s user interface
    guidelines advise against exposing iOS directory structures of any kind to users.
    Data storage is just supposed to happen, and that''s all there is. For example,
    Apple''s Notes app presents each document (note) as a page in the app. You can
    view a list of notes as a kind of table of contents, but they''re not files in
    the user''s eye. Any "file-ness" of content should be reserved for special interfaces,
    such as the File Sharing area of the iTunes display (in the Apps tab for iPad
    OS 3.2 and iOS 4 or later).


    If an iOS app developer follows the rules set by Apple, access to files is somewhat
    limited. Each application is given to read and write files, but only within the
    directory the OS has created for that application. That doesn''t mean you are
    totally blocked off from other data on the device. Apple provides numerous frameworks
    for accessing data in media libraries and the address book, but only through authorized
    APIs. Restrictions to loosen with subsequent OS versions, but it''s unlikely you
    will ever be allowed to wander willy-nilly through low-level directories or other
    application data not designed to be shared.


    The methods for reading and writing files on the device are pretty easy. Understanding
    the directory structure within an app requires a bit of explanation, including
    rules about which areas are backed up during a sync with iTunes. Your knowledge
    of the directory (folder) structure is vital to read or write a file, you must
    address the file by its pathname.


    ![](img/892a27734158da62dfa9872a01022ecc_250_0.png)


    Even iOS devices do not have spinning hard-disk storage, you will frequently see
    references to saving a file "to disk." An iOS app creates a directory structure
    that resembles what you might encounter on a hard disk, reading and writing files
    are considered "disk" accesses.


    # iOS App Directories


    When an app is installed on the device, the system creates a basic directory structure
    for the app. Conversely, when the app is deleted, so is the entire directory,
    which includes any files your app has created when it ran and user preferences
    the saved through'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'the prescribed preferences API (i.e., NSUserDefaults class). If you had a Finder-like
    viewer into the structure of an app’s directory, it would look like Figure 9-6.


    ![](img/892a27734158da62dfa9872a01022ecc_251_0.png)


    Figure 9-6. Default directory structure of an iOS app


    The device assigns a unique ID to the directory that is your playground. The ID
    is unimportant to you because you have “legal” access only to the stuff inside
    that uniquely named directory. Cocoa Touch provides shortcuts (in a manner of
    speaking) to help you obtain the pathname to any of the app’s subdirectories you
    see in Figure 9-6, automatically filling in the app’s unique ID as part of the
    pathname.


    The file you design is your application bundle, which contains all files you include
    in the project (e.g., .plist files containing initial data for the app). As part
    of the app submission process, you will authenticate the app through “codesigning”
    (putting a digital signature on the code), which means the bundle will not change
    once it is signed. Therefore, any data-oriented files you deliver to users will
    be read-only (although you can copy them to read-write files elsewhere in the
    app’s directory when the system runs the first time).


    Not all subdirectories of the app directory are created equal when it comes to
    whether the contents are backed up during an iTunes sync. Only the Documents and
    Preferences directories are backed up. As you have probably experienced yourself,
    backups can take a long time. The smaller the amount of content you place in these
    directories, the shorter the backup time required for your app. Therefore, if
    you lose fixed data the user can download from sources (in the event the app needs
    to be restored from a backup), it’s best to save that in another directory (or
    a directory nested inside the Documents directory).


    # File Sharing


    The Cocoa Touch frameworks reserve the first level of the Documents directory
    as the designated storage place for files that can be transferred to another computer
    through the iTunes app. To enable this feature in your iPad 3.2 or later iOS 4.0
    or later app, add the UIFileSharingEnabled key to the .plist file and enable the
    feature. Only when key is enabled does the app appear in the File Sharing area
    of the App tab of a compatible device connected to iTunes.


    234 | Chapter 9: Common JavaScript Tasks in Cocoa Touch'
