    # # Recap


    As this chapter aptly [sic: apltly] demonstrates, some of your JavaScript experience
    applies directly to developing native apps with the iOS SDK. In other instances,
    you have to forget what you know and learn techniques from scratch. The “classiness”
    of the SDK stands out: intangible values, such as colors, are no longer just values,
    but classes unto themselves. The more you observe how the frameworks implement
    their worlds with classes, the more quickly you will start envisioning solutions
    to your app challenges in terms of subclasses of existing classes and your own
    custom classes.


    The next stage in your mastery of iOS development is understanding in more detail
    how major view classes, navigation controllers, and table views operate. Beyond
    that, the specialties of your intended applications will guide you to areas for
    further study, whether it be more towards graphics and animation, intensive data
    handling with Core Data, communicating with other devices, media streaming, or
    dozens of other areas. Now that you are equipped with the basics of Objective-C
    and many Cocoa Touch facilities, you can take advantage of Apple’s documentation,
    which offers a wealth of information and insight into the depths of the frameworks.
    Take advantage of those resources, as well as the Developer Forums at http://developer.apple.com.


    You are now much closer to achieving your iOS app dreams.'
