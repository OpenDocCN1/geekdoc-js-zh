    text field to resign from its temporary job as first responder, the keyboard slides
    out of view and the field no longer grows being editable.


    Because the textFieldShouldReturn delegate method is invoked at a predictable
    point in the user interface sequence, you can also use it as the trigger for additional
    action on the content of the text field. But for this demonstration, the ensuing
