    # The id Data Type


    runMyCode: method has one argument, which is assigned to the parameter variable
    sender. For Workbench, the sender argument is a reference to the user clicks.
    What may be confusing at first is that the data type is simple id (without a pointer)
    rather than some UIKit type, such as UIButton (the type of button used in the
    project). That''s Objective-C offers uncommon versatility when it comes to specifying
    data types for projects.


    The id data type is, in a sense, a generic type. It can stand for Objective-C-basic
    data types (e.g., various types of numbers) or Cocoa Touch objects (e.g., buttons,
    arrays, and views). In fact, a variable defined as an id type can even change
    the type of data it holds during the execution of a method. This flexibility is
    a hallmark of Objective-C, called dynamic typing (also known as late binding).
