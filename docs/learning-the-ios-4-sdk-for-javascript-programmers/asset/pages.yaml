    Whether the UIApplicationMain() requires values other than nil for the remaining
    two arguments you intend to use to launch.


    For view-based apps that you come from Xcode templates, the third argument to
    UIApplicationMain() will be nil. This causes the app to use UIApplication as what
    is the principal class. This object becomes the primary environmental controller
    for your app, handling many services, such as listening for events and routing
