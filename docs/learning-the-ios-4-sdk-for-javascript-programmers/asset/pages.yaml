    categories that place the name of the class extended first, by a plus sign and
    some identifying name for the category. Unlike classes, the category name is primarily
    intended to help you know what the category does when you come back to the code
    months from now. I named the files DGCar+ThreeLineOutput. Example 8-4 shows the
    modifications you should make to the header file. Items to be deleted are in striethrough,
    while additions are in bold.'
