  md: '# About the Author


    Danny Goodman has been writing about personal computers and consumer electronics
    since the late 1970s. A freelance writer and programmer, he''s published hundreds
    of magazine articles, several commercial software products, and three dozen computer
    books. His most popular book titles—on HyperCard, AppleScript, and JavaScript—have
    covered programming environments that are both accessible to nonprofessionals
    yet powerful enough to engage experts. He is currently an independent iOS app
    developer, with three products available on the App Store and more in the pipeline.


    # Colophon


    The dog on the cover of Learning the iOS 4 SDK for JavaScript Programmers is a
    King Charles Spaniel. Today''s Cavalier Charles Spaniel is descended from a small,
    "toy" type of spaniel that was popular in 16th-century England. King Charles II,
    from whom the breed gets its name, was so fond of dogs that he declared them to
    be allowed in any public place, and it was said "His Majesty seldom without his
    little dogs." These spaniels were referred to as "Comforters"; in the winter,
    a noble lady riding in a carriage was likely to keep a spaniel in her lap for
    warmth. While used for hunting small game, the King Charles Spaniel was typically
    valued for its companionship and considered more of a luxury item than a utilitarian
    one.


    Today''s King Charles Spaniel emerged in part interbreeding with the pug—which
    was in fashion in England during the reign of King William III and the longer-nosed
    spaniels Charles was so fond of. Their pointed noses, flat heads, and almond-shaped
    eyes were replaced with shorter muzzles, domed skulls, and large, round eyes that
    characterize them. The turn of the 20th century saw a final attempt to revive
    the breed as it existed during King Charles''s time, but the modern King Charles
    Spaniel—named "Cavalier Charles Spaniel" by the Cavalier Club in 1928—persisted.
    During World War II, the breed declined significantly (with one kennel dropping
    from 60 to 3 Cavaliers), but regained popularity after the war and throughout
    the 1940s.


    Today, the Cavalier Charles Spaniel is gaining popularity worldwide. There are
    many national Cavalier clubs in about a dozen countries, including Finland, Italy,
    New Zealand, and South Africa. The Kennel Club reports that the Cavalier is the
    sixth most popular dog in the UK in 2007, and according to statistics from the
    American Kennel Club, they were the 25th most popular in the US in 2008, particularly
    in San Francisco, New York City, Boston, and Washington, D.C...


    The cover image is from Wood''s Anime Creation, Vol. I. The cover font is Adobe
    ITC Garamond. The text font is Linotype Birka; the heading font is Myriad Condensed;
    and the code font is LucasFont''s TheSansMonoCondensed.'
