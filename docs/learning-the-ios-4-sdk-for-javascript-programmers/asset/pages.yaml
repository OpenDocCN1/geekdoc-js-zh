    # # Validating Text Entry with Regular Expressions


    One of the earliest applications of JavaScript in web browsers was to perform
    prevalidating of text fields prior to submitting to the form. The purpose of prevalidating
    in the browser is to provide instant feedback about form entry errors, as missing
    required fields or an incorrect data format. It is still necessary to perform
    validations on the server for security and data integrity reasons, but by saving
    repeated roundtri between browser and server to fix several entry errors, the
    user experience is improved with client-side validation. JavaScript has offered
    regular expression support for a long time now, making it easier to compare text
    entry against expected patterns, such as North American phone numbers, US zip
    codes, and addresses.


