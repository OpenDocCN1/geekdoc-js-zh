  md: '# Extracting substring


    As you might expect, the Cocoa Touch method that extracts a substring specifies
    its parameters by way of an NSR value. The JavaScript substring() method passes
    its values as two integers for the offset from the front of the main string and
    the length of the substring. An NSR value supplies the same pair of values within
    the single struct. Don''t forget that you use the NSRange() function to generate
    an NSR value right in the argument to the substringWithRange: method call:


    ```

    NSString *myString = @"Four score and seven years ago";


    NSString *extract = [myString substringWithRange:NSMakeRange(5, 5)];


    NSLog("%@", extract); // "score"

    ```


    # Changing case


    Both JavaScript and Cocoa Touch provide one-stop methods that change the case
    of a string to upper or lowercase. In both environments, the methods return modified
    copies of the original strings, while leaving the originals intact. Cocoa Touch
    offers a capitalizedString method, which capitalizes the first letter of every
    word white space.


    # Escaping and unescaping URL strings


    Although not part of the JavaScript String object, the encodeURI() and decodeURI()
    global functions (modern replacements for the escape()) and unescape()) functions
    handle vital string conversions for URLs (or URIs). For Cocoa Touch, these conversions
    are handled by NSString methods, stringByAddingPercentEscapesUsingStringEncoding:
    and stringByReplacingPercentEscapesUsingEncoding:. The long argument for these
    methods is an enumerated constant for the type of text encoding. Table 8-3 lists
    some text encoding encodings.


    | Value | Constant |

    |---|---|

    | 1 | NSACIIStringEncoding |

    | 4 | NSUTF8StringEncoding |

    | 5 | NSISOLatinStringEncoding |

    | 10 | NSUncodeStringEncoding |


    The following example encodes a URL:


    ```

    NSString *myURLString = @"http://www.danny.com/img/big logo.jpg";nNSString *escapedURLString
    = [myURLString

    stringByAddingPercentEscapesUsingEncoding:NSUTF8StringEncoding];

    // "http://www.danny.com/img/big%20logo.jpg"

    ```


