    # Memory Management


    This chapter has been hinting (not very subtly) at the need to pay attention to
    an iOS app''s memory usage. The emphasis on pointers in most of the frameworks
    is one of Apple''s contributions to help you manage system resources.


    An iOS device has a fixed amount of operating room in memory. This portion of
    memory is separate from the storage space reserved for music, video, and other
    files (where all the gigabytes of the device specifications lie).


    Operating memory is measured in hundreds of megabytes. The precise size is not
    important, to say that not all devices are created equal in this respect. The
    iPhone 3GS, third-generation iPod touch, and first-generation iPad available to
    earlier models, while the iPhone 4 doubles even that. That''s why newer devices
    can accommodate the more memory-intensive features of iOS 4.0, such as multitasking,
    while older models cannot.


    This stratification of available memory in devices also suggests that you should
    keep an older-model device for testing when you get your app running on devices.
    A memory-hungry app that runs on an iPhone 4 can bring a second-generation iPod
    touch to its knees. Be aware that the simulator application does not simulate
    the constricted memory space of actual devices. Testing a developing app on real
    iOS devices is absolutely essential to stop critical memory issues and performance
    bottlenecks.


