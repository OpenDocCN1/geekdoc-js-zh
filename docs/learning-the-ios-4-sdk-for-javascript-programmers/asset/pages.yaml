    # Creating the Project in Xcode


    Every iOS app you generate with Xcode is managed within a container known as a
    project. The project file (with a file extension of .xcproj) knows all of your
    preference settings for the particular app, maintains lists of source code and
    external files associated with the project, and tracks many more pieces that most
    app developers dont ever touch. Each time you come back to an app you''ve already
    begun, you will open its project file to get back to work.


    For the Workbench app, begin by creating a new project. Do so from the File menu
    in Xcode, as shown in Figure 3-2.


    # Selecting a Project Type


    The New project item presents a dialog box of choices (Figure 3-3). Because Xcode
    is used for both iOS and Mac OS development, you will see options for both environments
    (even though you downloaded Xcode with the iOS SDK from the Apple developer site,
    it includes the development tools for Mac OS X as well). You obviously want to
    focus on the iOS section, and pay attention to the options for creating apps within
    that section.'
