  md: 'Most UITextView delegate messages signal intentions and seek approval to ahead:
    the control is to do something significant, so is it okay to proceed? That''s
    why those methods return Boolean values. A tap of the keyboard Return or Done
    key (depending on the keyboard style) signals that the user has finished editing
    the text field. If you have multiple text fields and want a different behavior
    for each, you can use arbitrary integers to distinguish them. Assign a name as
    a tag to each control, inspect the responder argument to see which control is
    sending the delegate message, and act accordingly.


    All user controls in iOS inherit from a class called Responder. This means that
    the control can react to events as touches and keyboard events. For a UITextField,
    however, the responder action is automatic: when a user taps on the text box,
    that box becomes the responder. The responder acts as the first responder, meaning
    it receives the next event. For a text box, this triggers a lot of activity behind
    the scenes, but the view and the text box is the target of the next event. When
    the user has finished entering text into the field (signified by pressing the
    Return or Done key), the text field should handle control to which view gets it
    (usually the UIView filling the screen). Therefore, Example 9-18 shows an implementation
    of the textFieldShouldReturn: delegate message, which the user needs to get out
