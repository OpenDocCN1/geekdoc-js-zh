  md: 'simulator; it will probably behave better than the actual performance when
    downloading data on a real device through WiFi or cellular. To do the best for
    your app''s users, you should minimize the amount of data that needs to be downloaded
    to your app.


    Not all data consumed by an app may necessarily be updated every instant. For
    instance, you might have your app set up to download user tips or other support
    data that is updated from time to time. It would be a waste to automatically download
    the whole batch when the app launches. Fortunately, if your servers support timestamping,
    you can preserve the date of each download on the device (as a user preference
    perhaps) and compare the saved date against the header response of the file just
    before the actual download begins. Use a local copy of the file saved after the
    download. If the dates are the same, cancel the connection and save for later.


