  md: 'the function in the main.m file, planted by default into the Other Sources
    group of files in your project. You will rarely, if ever, dig into the main.m
    file after it is created. Even so, it is instructional to learn what it does,
    especially if your web authoring experience makes you curious about how things
    work.


    Example 5-1 shows the contents of the Workbench app’s main.m file (without comments)
    as written by Xcode. It is, in fact, the same file writes for all view-based applications.


    Example 5-1. Workbench’s main.m


    ```

    #import <UIKit/UIKit.h>


    main(int argc, char *argv[]) {

    AutoreleasePool *pool = [NSAutoreleasePool alloc];

    int retVal = UIApplicationMain(argc, argv, nil);

    [pool release]

    return retVal;

    }

    ```


    Statements in the main() function rely on classes defined in both the Foundation
    and UIKit frameworks. Because UIKit framework classes also import the Foundation
    framework, there is no need to repeat import into main.m.


    You’ll notice that the main.m file does not define a class (in fact, there is
    no corresponding header file), the main() function is not specified as an instance
    or method (that is, there is no leading - or * symbol). Instead, this is a plain
    C (except for a couple messages specific to iOS), defined simply to return an
    integer. Arguments for the main() function (C integer and array of characters)
    are passed by the application loader. You’ll learn more about C functions in Chapter
    7.


    Inside the main() function, the first statement creates an instance of what is
    known as an autorelease pool. The explanation of an autorelease pool comes later
    in Chapter 6, but it is a Cocoa Touch class that assists with managing memory.


    The real action occurs in the second statement, where the UIApplicationMain()
    is called. Even though you might expect it to be a method of some UIKit class
    because of its name, You will encounter many cases where an action is reminiscent
    of a JavaScript global function (like JavaScript’s parseInt() and eval() functions,
    which you can use anywhere without referencing any object). Objective-C method
    calls, which are formatted as messages inside square brackets along with an object
    that receives the method call, are written without function brackets or a reference
    to a receiving object. A function of this kind may take arguments (depending on
    how it is designed), and it may return a value.'
