    # Understanding NSDate


    One similarity between JavaScript and Cocoa Touch is that a date is encapsulated
    in an instance of a date object. In JavaScript, the master object is, indeed,
    the Date object; in Cocoa Touch, it’s the NSDate class. The main difference is
    that a JavaScript date object instance has a full range of methods that grant
    read-write individual components of a date—month, day, year, minute, and so on.
    An instance of NSDate object stores the properties for a snapshot of time, and
    setting its component values quite a bit more work and help from others. Despite
    sometimesous routes, your NSDate instance remains the core of the information
    about a date. You changes to date components need to find their way back to an
    NSDate object in the end. You’ll see more of that in a bill.


    For now, look the dateHasBeenPicked: method you added to WorkbenchViewController.
    It relies on a return to the UIDPicker being passed as an argument (sender). Checking
    the UIDPicker class reference document, you’ll find that one of the properties
    of this user interface control is date, an instance of NSDate. Although it is
    a property, the argument is defined as an id type. You can cast it to use the
    dot syntax of an Objective-C property without compiler complaint or you can send
    the date message to reach the implied getter method. The latter is the approach
    displayed in the example.


    The NSLog() function outputs the value returned by an NSDate object’s description
    property, in the following:


