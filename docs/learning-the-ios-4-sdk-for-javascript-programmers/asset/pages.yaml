    # Enumerated Types


    In your tour of Cocoa Touch frameworks, you will encounter many collections of
    values known as enumerated types. Defined in C with the enum statement, the construction
    is a collection of convenient names representing integer values. It''s easier
    to show you than explain it.


    You are probably familiar with the Maps app, lets you select from three different
    map styles: standard, satellite, and hybrid. If you add a map to your view, your
    code can change the style by setting the setMapType: message to an instance of
    MKMapImageView. Acceptable values are integers: 0, 1, and 2 to denote standard,
    satellite, and hybrid, respectively. To help make your code more readable, these
    values have been assigned to names that act as constants for their designated
    data type (i.e., they can be used in other places). Because the values are all
    related, they are grouped into an enumerated list and assign a type definition.
    The three map style values are defined in the mapping framework as follows:


    ```

    enum {

    MKMapTypeStandard,

    MKMapTypeSatellite,

    MKMapTypeHybrid

    }

    typef NSInteger MKMapType;

    ```


    By default, an enum type assigns integer values (beginning with 0) to the constant
    names in the group. It is also possible to assign explicit numbers to each constant
    name or assign a different starting point for the items by assigning a nonzero
    value to one item (in which case, subsequent items have incremental integer values).
    For your coding, you don''t concern yourself with the integer values, but with
    the constant names associated with the data type. Therefore, to change an existing
    MKMapView object to satellite view, the message will be as follows:


    ```

    [myMapView setMapType:MKMapTypeSatellite];

    ```


    You will see these enumerated lists fairly frequently in the SDK documentation,
    along with a brief (often too) description of what each constant represents.'
