    Animation is a much longer discussion than is appropriate for this book, but the
    two methods included here can help you get started with your investigations. The
    job of the animateTouchesBeganAtPoint:forView: method is to enlarge the movableImageView
    by a factor of 110% along both the horizontal and vertical axes. A change of this
    nature is called an affine transform (or transformation). Fortunately, all of
    the geometry required to understand affine transforms is built into the functions
    supplied by Cocoa Touch (and specifically the Quartz 2-D drawing engine). A UIView
    subclass has a transform property, which can hold information about a specific
    type of transformation (or combinations of transformations). In other words, once
    the view knows its transform, it knows the nature of changes to its visual presentation
    (such as size scaling, inversion, rotation, and so on). If you encapsulate the
    assignment of the transform inside an animation block, the rendering is held momentarily
    while other potential properties are set, as how the eventual animation should
    take. When all the properties are set, the animation can be committed, which causes
    the rendering to gradually change from the original display to the transformed
    display.


    All of this takes place within the span of four lines of code in the animateTouchesBeganAtPoint:forView:method.
    The point argument contains the coordinates of the touch event; the view is a
    reference to the movableImageView. An animation block begins so you can assign
    parameters about animation duration and nature of the intended transformation
    (scale the view by a factor of 1.1 along both axes). Then the animation is committed,
    causing the animation to appear on screen.


