    \ method. The size of the blocks or how many times they are passed along are of\
    \ no interest to you. Instead, your job in the method is simply to accumulate\
    \ the data into the NSMutableData property you defined holding data. As a mutable\
    \ class, it offers a method to append data to whatever is currently in the object.\
    \ Example 9-9 shows how this accumulation works.\n\nExample 9-9. Accumulating\
    \ incoming data\n\n```\n(void)(NSURLConnection *)connection didReceiveData:(NSData*)data\
    \ {\n    // Accumulate incoming data into mutable data object\n    [self.incomingPlistData\
    \ appendData:data];\n}\n```\n\n# Processing the downloaded data\n\nYou know the\
    \ download was successful when the connectionDidFinishLoading: method is called.\
    \ At this point, the connection has been closed and your NSMutableData property\
    \ has the full content for you to spin your magic with it. The data, has been\
