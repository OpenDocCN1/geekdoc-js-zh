    a bit) whenever you click on the button. This will confirm the app is working
    as it should.


    To display content in the Console window, you can use the NSLog() function, which
    serves basic format (although not necessarily its argument) should be familiar
    to any JavaScript programmer. The sole parameter to this function is a string
    containing any text you want to display in the Console window. To prevent the
    discussion at this early stage from getting down in the fine points of Objective-C
    data typing, it suffices to say that one to define an Objective-C string is with
    a sign (@) followed by a quoted string. In JavaScript, this type is called a string
    literal, in Objective-C, it''s called a string constant, but that term can be
