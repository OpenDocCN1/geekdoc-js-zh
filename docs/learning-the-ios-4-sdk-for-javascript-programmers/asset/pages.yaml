    # Inserting Comments


    Your JavaScript experience equips you with everything you need to know about adding
    comments to an iOS SDK source code. Inline comments begin with two slashes (`//`).
    These can appear at the beginning of a line or following the end of a statement
    line.


    Comment blocks are contained by the `/*` and `*/` delimiter sequence. Comment
    blocks may be any number of lines. See the tops of any class file generated by
    Xcode for examples.


    One significant advantage to a compiled language is that you can type comments
    into your source code without them being on the size of your application binary.
    Additionally, unlike comments added to client-side JavaScript, your app source
    comments will not be visible to consumers of your app.


    # Recap


    As you can see, except for the data typing business and pointers, JavaScript isn''t
    too far from the C language pieces you will likely encounter while developing
    iOS apps. There is certainly far to the C language not covered here because the
    combination of Objective-C and Cocoa Touch frameworks provide more robust and
    convenient alternatives. That''s where the next chapter picks up the story.'
