  md: '# # Dragging a View Around the Screen


    Recall that virtually every "thing" you see on an iOS device is descended from
    the UIView class. If you want your user to be able to drag something around the
    screen, you define the element as a UIView subclass. In HTML, CSS, DOM, JavaScript
    terms, every view is the equivalent of an absolute-positioned element. It has
    a location within the coordinate system of the parent view and exists as its own
    layer that can move independently of other views (and its nested subdivisions
    along for the ride). In JavaScript a browser running on a traditional computer,
    you use mouse events to detect when a user has engaged the element for movement,
    when the mouse moves the element, and when the user releases the mouse button.
    The equivalent events in iOS are *touch events*.


    Because UIView inherits from `Responder`, all views—which explicitly enabled—are
    capable of reaching touch events. Touch events send messages to the view under
    the spot interpreted by the system as being the intended coordinate. Despite the
    pudness of fingers compared to the extremely small pixels on the screen, the system
    calculates a report for each event. The ability to interpret and calculate this
    disparity is a hallmark of good touchscreen experience. Developers receive the
    benefits of that engineering for.


    A touch can be a quick tap or a lengthy drag around the screen. To accommodate
    those possibilities, the system sends four touch messages to any view acting as
    a responder. If the view implements methods matching those, the view can act in
    response to the touch events. The four methods are as follows:


    +   - (void)touchesBegan:(NSSet*)touches withEvent:(UIEvent*)event

    - (void)touchesMoved:(NSSet*)touches withEvent:(UIEvent*)event

    - (void)touchesEnded:(NSSet*)touches withEvent:(UIEvent*)event

    - (void)touchesCancelled:(NSSet*)touches withEvent:(UIEvent*)event


    A simple drag encompasses at least three of the four methods. The last is called,
    during a drag action, a notification of some kind (including an incoming phone
    call) gets in the way between your fingers and your app''s views.

    All four methods share the same pair of arguments. The first is an NSSet—an unordered
    collection of UITouch objects; the second is a `UIEvent` object. The reason the
    first argument can contain multiple UITouch objects—one touch per finger. For
    example, if you drag two fingers at the same time, `touchesMoved:withEvent:` method
    has information about each finger''s touch location.


    For the dragging demonstration in this section, you will be working with a single
    touch, even if multiple touches are in force during the event. You will add a
    UIView to Workbench and supplement the project''s code to reposition the UIView
    during touch motions so that it tracks the position of your finger (or pseudofinger
    in the simulator).'
