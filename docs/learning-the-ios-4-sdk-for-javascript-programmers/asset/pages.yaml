  md: '# Using an App Offline


    It is hard to argue with the fact that iOS devices are intended to be used in
    a connected world. WiFi is built into all devices by default; iPhones and iPads
    equipped with 3G also have cellular connections that free users from lurking around
    WiFi hotspots. Unfortunately, users may be out of WiFi range, have no cellular
    connection, running dangerously on battery power, or be secured inside a jet-powered
    flying metal tube where attendants prohibit radio contact with the ground. When
    an iOS device access the internet, a traditional web app—which resides entirely
    on your web server—is not accessible. Although it is possible to code a browser-web
    app to be copied and stored on a device, the mechanism isn''t foolproof.


    A native app, however, is at least launchable when the device has no connection
    to the Internet. Exactly how usable the app is depends on the nature of the app,
    but it''s clear that the apps Apple supplies on every device that an iOS device
    does not completely if Internet connectivity is missing. You can still listen
    to music, watch downloaded videos, look up your contacts, and tap notes; with
    an iPhone and iPod touch, you can be awakened by an alarm or calculate a total;
    and with any camera-equipped device, you can take pictures. Applications you download
    from the App Store let you do more things, such as play games, read gorgeous-looking
    downloaded books, edit photos, future your restaurant bill tips, look up a dictionary,
    or identify a bird in the nearest tree—all with the need for a constant Internet
    connection.


    Many native apps also connect with the Internet for some functions. Commonly upload
    scores so you can see how well you perform against others users around the world.
    Many apps also rely on the Internet for up-to-date information, such as email
    apps, news readers, weather apps, Twitter and Facebook counts, and many more.
    For designers of many of these types of apps, the challenge is to create an app
    that can perform its functions offline, even if it means the users need to download
    current content before cutting the wire cord. Once disconnected from the cloud
    (perhaps even while flying over the clouds), the user can relaunch the app and
    still access recent content.


    Unfortunately, you cannot rely on Mobile Safari to preserve a downloaded web page''s
    content for long. Even if the user manages to keep the Safari window open, restoring
    it for use sometimes causes the page to attempt to reload itself from the server.
    No server? No, even though it may be in a cache somewhere on the device.


    Some web apps have successfully been converted to bookmarklets. A bookmarklet
    is a browser bookmark that contains a javascript: or data: URL whose code generates
    the HTML, CSS, image data, and JavaScript code for a web page when chosen from
    the browser''s bookmarks list. It''s that this method allows a web page to be
    stored entirely on the user''s device, but a web page generated in this fashion
    has some'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'additional limitations over regular web pages. For example, a bookmarklet app
    cannot use browser cookies because of security restrictions in the browser.


    Mobile Safari supports the HTML5 offline application cache. This mechanism allows
    web publishers to code their pages (and configure their web servers) in a way
    that allows the browser to store a copy of a web page and additional resources
    (e.g., images) on the device. Developers deploying this technique have a variety
    of limits to attend to, such as a maximum of 2.5 KB per resource file, including
    any images. Of greater concern, however, is that if the reboots the device (completely
    powering down the unit), all data in this offline cache can be lost. Native apps,
    however, such systems reboots every time.


    There is a risk that when you have been designing Internet-based content and software
    for a long time, you tend to take Internet connectivity for granted—after all,
    you are always-on broadband at home or work. Additionally, all the buzz about
    cloud computing makes it so as though every computer on us has nearly free access
    to an Internet that is as reliable as the sun rising tomorrow morning. That is
    not always the case for all users.


    # More Access to the Hardware


    It doesn''t take long to learn that web pages developed for general-purpose web
    browsers are encumbered with many restrictions. For example, a web page does not
    have free rein over the host computer''s filesystem, making it impossible for
    well-meaning scripts to read or write files on the hard disk (except for closely
    monitored dedicated files for items such as cookies and HTML5 data storage). JavaScript
    is granted very limited access to the host browser''s environment or settings.
    Despite the possible inconvenience afforded by automatically adding the current
    web page to a user''s bookmarks list, such access is out of bounds for web pages.


    All of these restrictions, of course, are imposed for the sake of security and
    privacy. Left unf, a script on a malicious hacker''s website could wreak havoc
    on every browser that lands on the site. Many users would like unknown computers
    reading their recent browser history or replacing files with ones that could cause
    website visits to be redirected to lookalike phony sites that capture usernames
    and passwords. Cyber attacks are constantly on the prowl for vulnerabilities in
    popular browsers that they can exploit without the user''s knowledge—the so-called
    drive-by-attacks that have plagued various browsers through the years.


    An application designed to run natively on popular desktop operating systems,
    but on the other hand, typically has exceptionally freedom to roam around the
    computer at will. On some operating systems that are set up for user accounts,
    the user must grant specific permission to the program''s installer. Such permission
    is taken to mean that the user trusts the installer and the program(s) to do no
    harm. Developers who publish software with a goal of building a software business
    avoid.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'doing bad things to customers’ computers even though users essentially hand
    over the key to the system. On the other hand, if a program has a hidden agenda
    (e.g., loading spyware onto every user’s computer), the nefarious activity will
    likely be discovered sooner or later. News of the offenses will quickly travel
    across the Internet and the company’s reputation will be ruined.


    Apple engineers thus far greatly restricted the hardware features available to
    web apps running in Safari. Despite some cool hardware, such as the digital compass
    in the iPhone 3GS, web apps simply have no access to most of the stuff. About
    the only hardware-based features that a web app can count are:


    +   - Accelerometer orientation changes (e.g., portrait or landscape)

    - Gyroscope motion (iOS 4.2 or later)

    - Multitouch events (e.g., two-finger pinching or stretching)

    - Location services (as many are supported by the device)


    Native apps, having substantially more access to the hardware—although not necessarily
    every piece developers might like. For example, apps built for devices containing
    cameras can capture images (and video, where available) to facilitate editing
    tasks. Devices equipped with a digital compass capture the current heading of
    the device. Sound captured by the device’s built-in (or plugged-in) microphone
    can be recorded and processed further inside a native app. An app can read information
    about the battery state and an iPhone’s proximity detector (which knows when a
    user has the handset near her face). Native apps can also read from and write
    to files of their own construction (albeit within some security-driven confines
    of the directory structure reserved for the app).


    Although Apple has begun to expose limited parts of the hardware to web apps (essentially
    creating objects, properties, and methods to extend the DOM), such exposure lags
    well behind the range of hardware features waiting to be used by native app developers.
    I expect more hardware access to come in future iOS versions, but web app access
    will likely stay several steps behind native app capabilities.


    # More Access to the Software


    On the native side of the iOS, native app development offers a wide range of features
    that web app developers typically have available. For example, here is a list
    of software features introduced with iPhone OS 3.0 that are available only to
    native apps:


    +   - iPod library access to read library contents and play tracks

    - Displaying interactive embedded Google Maps with many of the same capabilities
    and identical performance to that of the Maps app

    - Peer-to-peer communications for multiplayer game play

    - Precise control over how cut/copy/paste works in an app'
  merge: -1
  pgno: 21
- img_proc: true
  md: '+   - Powerful structured data mechanisms ideally suited to displaying lists
    (the Core Data framework)


    +   - Precise control over audio audio recording details (sampling rates, audio
    formats, etc.)


    +   - Push notifications to signal users about important events that launch your
    app


    +   - Creating and sending email messages from within the app


    +   - Reading and selecting information from the Contacts app


    +   - Very powerful OpenGL ES 2.0 3-D graphics composition platform


    +   - In-app purchases to encourage users to add paid features or extend subscriptions


    If that list doesn''t seize your imagination into overdrive, perhaps several new
    native app features of iOS 4:


    +   - Playing audible media while the app is suspended in the multitasking environment


    +   - Receiving system notifications of changing active activity and suspended
    mode


    +   - Posting notifications to users at predetermined times, even if the app is
    suspended


    +   - Integrating with Calendar app


    +   - Displaying revenue-generating advertisements from Apple''s AD service


    It''s not uncommon for native developers to apply several of these advanced software
    features (along with hardware features in the previous section) to augment their
    apps. For example, one of my own apps, IFeltEarth, uses the in-app feature to
    make easy for users to contact me with questions and suggestions about the app.
    The app lets users select an entry from their Contacts list to create a geographical
    center point around which recent earthquake activity is shown (the app geocoding
    to convert a contact''s street address to map coordinates).


    All of this native goodness allows developers to deploy useful web content within
    a native application. iOS supplies a mechanism for displaying web content within
    native app has all the HTML, CSS, and JavaScript features of Mobile Safari (and
    its WebKit engine), but without the Chrome of Safari. You simply define a rectangular
    viewing region on the screen and supply a URL to the web viewer. In FeltEarth
    Earthquake, for example, I keep users informed about news and tips via an HTML-hosted
    page available from a web server. Each time the app launches, it checks if the
    web page has been modified since the last visit; if so, it downloads the page,
    stores a copy on the device, and signals the user that a news is available for
    reading.


    I chose to use the news material in HTML for a couple of reasons. First, as a
    veteran HTMLocoder, I am, of course comfortable generating content in that format.
    It allows for quick composition and easy testing of the page from a local server
    using Mobile Safari on an iPhone-compatible device. It also means I am free to
    change the styles (CSS) of the news page without having to update the entire app.
    The second reason for choosing HTML is that I can easily provide links to other
    HTML content,'
  merge: -1
