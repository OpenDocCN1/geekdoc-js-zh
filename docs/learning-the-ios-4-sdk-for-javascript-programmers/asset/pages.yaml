    # iPhone App Development Design Patterns


    Not only is delightful on its merits, but the concept is widely adopted across
    numerous iOS frameworks. For example, if your app needs to retrieve updated data
    from a server, you will use a class NSURL to initiate the request. Namely, you
    don''t want the app to be locked while it waits for the server to return data
    (especially if the wireless network is slow), the NSURL class can send an asynchronous
    request to the server and wait in the background for a response, whether it''s
    data or perhaps an error. How is your app supposed to know when data has arrived
    so app can work on data? That''s where the delegate model comes in: when it waits
    and receives data, the NSURL sends a series of messages to whichever object has
    been assigned as the delegate (usually the same object that issued the request).
    In that object''s class definition are a group of methods that match the NSURL
    messages to act on the incoming data. One that method can then send other messages
    to begin processing and displaying the data in the app.


    Delegation is one of several design patterns associated with iOS programming.
    In object-oriented programming, a design pattern suggests the relationships between
    objects and how objects should work together. Going back to the NSURL class, your
    app uses that class without modification; additionally, that class doesn''t know
    or care about the specifics of the data. Instead, it just sends a message when
    a significant event occurs (eg, receiving the chunk of data) and lets your app''s
    delegate perform custom tasks tailored to your application. As you learn more
    about the iOS SDK, you''ll be amazed at how many objects send large quantities
    of delegate messages when a user interacts with your app.


