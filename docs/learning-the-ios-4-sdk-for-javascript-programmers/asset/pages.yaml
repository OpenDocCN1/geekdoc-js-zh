  md: '# Warning Messages


    Warning Message: ''<className>'' may not respond to ''<methodName>''

    Interpretation: A message receiver is a class that does not have the named method
    defined for it. The method name in your message may be spelled or capitalized
    incorrectly. Alternatively, the receiver may belong to a different class than
    think it is in.


    Warning Message: Cannot find interface declaration for ''<className>''

    Interpretation: The implementation file does not include an #import directive
    for the header file.


    Warning Message: Control reaches ends of non-void function

    Interpretation: Your method is declared to return a value, but the method does
    not contain a return statement. This commonly occurs when you insert an empty
    method as a placeholder in the implementation and the method is defined to return
    a non-void value.


    Warning Message: Incompatible Objective-C types initializing ''struct NSArray'',
    expected ''struct NSString''

    Interpretation: A method defined in the header states that the returned value
    is an NSString, but the implementation says the returned value is an NSArray.
    They need to be the same type.


    Warning Message: Incompatible Objective-C types returning ''struct NSString'',
    expected ''struct NSArray''

    Interpretation: A method is defined to return an NSArray, but the returned value
    is defined as NSString.


    Warning Message: Incomplete implementation of class ''<className>''

    Interpretation: The compiler can''t match all declarations in the header with
    corresponding implementations. Look especially that methods are spelled, capitalized,
    and equipped with arguments identically between the two files. The warning is
    often accompanied by another warning with a reference to the problem method.


    Warning Message: Initialization from incompatible pointer type

    Interpretation: You are trying to assign an string value to an NSString pointer
    variable. C-string literals must be defined with the @ directive in front of the
    quoted string.


    Warning Message: Initialization makes pointer from integer without a cast

    Interpretation: You are trying to assign an integer value to a pointer variable.
    If you need a string version of an integer, use the stringWithFormat method of
    NSString to generate an NSString object with a value occupying the %d format specifier
    in the format.'
