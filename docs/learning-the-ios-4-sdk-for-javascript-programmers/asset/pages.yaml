    # Message Passing


    While I''m on the subject of calling methods, Objective-C triggers the execution
    of methods based on a model that is different from what you use in JavaScript.
    Because each Objective-C object instance is conceptually a separate entity, the
    objects communicate with each other is to send messages to each other. A message
    may have the feeling of invoking an object''s method, but there are important
    differences. For instance, if an object doesn''t understand a, the message is
    ignored and the object simply returns nil to the sender. Therefore, get in the
    habit of using the "message" terminology, such as, "Object A sends its methodWithArgument1:andArgument2:
    to Object B."


    One advantage of using labels in method definitions is that it''s much easier
    to understand what the values being passed mean. In the JavaScript version, you
    just pass three strings and have them in the desired order as needed by the order
    of the parameter variables in the constructor function. In Objective-C, however,
    the labels guide you to precisely how you should use each value. Importantly,
    the order of the labels must be the same in the method definition and the statement
    sending the message to that method. Just because they have labels doesn''t mean
    you can mix up the order at all.


    Speaking of labels, don''t be afraid to be verbose in devising labels that really
    define what they''re for. In fact, that goes for everything in Objective-C for
    which you need to assign a name. In JavaScript and web coding, you are mindful
    that each character you a variable or method name means a character that must
    make the journey from server to browser, occupying Internet bandwidth. But in
    the compiled Objective-C world, the compiler reduces long names to very compact
    tokens. Long names in Objective-C contribute to the readability of your code (but
    you should not rely on them as replacements for good commenting).


