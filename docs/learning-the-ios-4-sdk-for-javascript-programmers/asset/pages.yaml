  md: "The operation launches the pool is wrapped inside two statements. The first\
    \ creates an AutoreleasePool object named pool. After the pool quits, that pool\
    \ object receives the release message. When an AutoreleasePool object receives\
    \ the release message, the pool deallocates all objects in the pool. Pulling the\
    \ drain plug on a swimming pool is an apt metaphor for what happens.\n\nAlthough\
    \ theAutoreleasePool object in the main() function handles the most global collection\
    \ of autoreleased objects, you can also create additional pools inside your code\
    \ to deallocate batches of autoreleased objects that may collect in loops or other\
    \ constructions while your program is still running. Left to accumulate in memory,\
    \ these kinds of objects can grow to alarming numbers and send your app crashing\
    \ on devices with smaller memory.\n\nDespite its scary-sounding name, an AutoreleasePool\
    \ object is easy to deploy. For example, if you have a repeat loop that performs\
    \ a substantial amount of processing on elements of a large array, each time the\
    \ loop could contain dozens of statements that generate autoreleased objects,\
    \ such as NSString or temporary subarrays. But you can prevent your app from building\
    \ a huge collection by wrapping the statements inside the loop within the AutoreleasePool\
    \ creation and its release:\n\n```\nfor (int i = 0; i < [array count]; i++) {\n\
    \  AutoreleasePool*arrayProcess = [[AutoreleasePool alloc] init];\n  // Your array\
    \ parsing statements here\n}\n```\n\nEach time through the loop, the autoreleased\
    \ objects created in that one loop are released before the next time. The memory\
    \ of your program will remain at a safe level. In more complex code arrangements,\
    \ you can nest pools as needed. Autoreleased objects generated inside the scope\
    \ of each pool are released when its pool is released.\n\n# Observing Memory Usage\n\
    \nApple supplies many extra tools in the iOS SDK. One of them, Instruments, lets\
    \ you run your app in the simulator or on a device while observing real-time memory\
    \ usage and the occurrence of memory leaks. For example, you can watch how many\
    \ objects are being allocated in memory while a program runs. If a particular\
    \ user triggers a significant repeat loop that does not employ an AutoreleasePool\
    \ object, you will likely observe the number of object allocations and overall\
    \ memory usage to continue creep upward while the loop runs. If so, you've spotted\
    \ a candidate for wrapping inside an autorelease pool.\n\nTo run your app through\
    \ Instruments, first make sure that it is in a usable state on the simulator.\
    \ Then Run→Run with Performance Tool→Leaks from the Xcode menubar. Your app will\
    \ probably run slower than usual as Instruments runtime data and displays both\
    \ in a running graph and a table."
