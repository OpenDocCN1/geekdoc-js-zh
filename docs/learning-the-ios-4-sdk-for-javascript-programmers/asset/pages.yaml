  md: '# Interface Builder


    You are not required to design your user interfaces using this graphically oriented
    design tool, but if your app utilizes standard iPhone or iPad user interface elements,
    it can significantly reduce the amount of code you write.


    # Instruments


    After your app reaches a usable form, you will use Instruments to observe how
    well it uses memory and system resources.


    # iOS Simulator


    Although the iOS Simulator is buried elsewhere within the Developer directory,
    you will use it during all development phases for both iPhone and iPad testing
    (the tool contains simulators for both platforms). The simulator launches from
    your Xcode projects.


    Each time you go to your app, you begin by launching Xcode. You can launch all
    of the other supporting apps directly from within Xcode. For example, when you
    want to see how the current implementation runs on the iOS Simulator, you will
    instruct Xcode to build the app and run it on the simulator. If the simulator
    is not yet running, Xcode will install it, the app, and launch the app on the
    simulator.


    # Viewing Developer Documentation


    The first time you launch Xcode, you will see a Welcome to Xcode window with a
    variety of choices, as well as a list of previously projects (preferably for you).
    Click Cancel for now. Instead, Open the Help menu and choose Documentation, as
    shown in Figure 2-3. You will be referring to documentation a lot, and this menu
    (or keyboard equivalent) is a quick way to open the documentation window before
    you open a project.


    ![](img/892a27734158da62dfa9872a01022ecc_32_0.png)


    Figure 2-3. Accessing developer documentation in Xcode'
