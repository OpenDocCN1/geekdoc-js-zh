  md: 'dynamic typing as a variable doesn''t need to be prewired for only one data
    type; instead the data type (a class) is assigned at runtime, and the system keeps
    track of the type as needed (and thus knows which class it should send messages).


    As an illustration of dynamic typing and the id data type, consider an app that
    defines very different classes named Leg, Glass, and Meeting. Each class has a
    method break, which performs a class-specific action on an instance of the class.
    As the app runs, a variable of id could contain an instance of any of those classes,
    depending on user interaction or another situation. But when a statement sends
    the break message to the variable, the actual class of the variable at that instant
    determines which method executes. Importantly, the compiler can''t know which
    class assigned to the variable has a break method defined for it, because at compile
    time the class of the variable is indeterminate.


    Before you draw the conclusion that you can simplify the id type for everything
    and treat all Objective-C variables as loosely typed JavaScript variables, yours
    compiler will leave potential data incompatibilities slide if you are sloppy with
    typing. Errors will occur at runtime and conceivably crashes that can be challenging
    to repair with the Xcode debugger. You are often better finding data type inconsistencies
    at compile time rather than at runtime. The Xcode compiler supplies many clues
    (albeit not all of them immediately clear to newcomers) about data types. It''s
    true that accurately typing variables and methods can be frustrating at first—you''ll
    feel as though you''re doing a lot of the work the compiler should do—but the
    code will be easier to maintain over time.


    Despite these cautions, don''t be afraid of dynamic typing—Cocoa Touch frameworks
    use it extensively. It will take some time working in Objective-C before you recognize
    places where dynamic typing can contribute to your code''s flexibility.


    # Converting Objective-C Data Types


    With variables being so tied to their data types—and Objective-C operations being
    exceedingly picky about the types of data they work on—there will be times when
    you need to convert one data type to another. This happens largely in the realm
    of numbers and strings, but you also added the complexity of specific number types
    being incompatible with each other. You can''t send an int to a float''s job.


    For simple conversions of basic number values, you can use a technique called
    casting. It forces you to perform a conversion based on strict rules established
    for the C language. Most of the rules dictate how conversions between numeric
    types (e.g., long and short versions of int and float types) are to behave during
    such conversions.


    Specify a case by placing the desired output data type in parentheses before the
    original value. For example, this changes an int to a float:


    ```

    float myValueAsFloat = (float)myValueAsInt;

    ```'
