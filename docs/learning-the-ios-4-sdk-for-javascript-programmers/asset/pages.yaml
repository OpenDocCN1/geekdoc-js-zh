    project was created when SDK version 3.0 was still available and modified for
    iOS 4.0, Xcode in the iOS 4.2 SDK does not recognize the setting as being valid.
    It’s time to bring the setting up to date by adjusting what is known as the Target—a
    collection of specs Xcode uses to build an application around the source code
    of the project.


    Open the settings by choosing Project>Edit Target “TheElements”. You will see
    the Target Info window. The first group of settings is the Base SDK, which confirms
