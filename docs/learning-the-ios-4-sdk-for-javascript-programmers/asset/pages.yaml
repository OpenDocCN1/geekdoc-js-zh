  md: '# APPENDIX B


    # Common Beginner Xcode Compiler Errors


    When you''ve programmed in an environment for a while, you get to know the common
    errors and instinctively know what to look for in the code. Making the transition
    to a new environment means you may have to ignore all your previous experience
    and learn an entirely new vocabulary for error messages. And if you''re moving
    from a loosely typed environment such as JavaScript to a language that is much
    more strongly typed, the error messages may not give you a sufficient notice about
    what''s wrong. Even more potentially confusing is that coding a error in a header
    file may be exposed when the compiler processes its companion implementation file.
    As the number of classes grows, you''ll need Xcode''s help more and more to find
    the file in which an error appears. Notice that an error displays a brief notice
    at the bottom right corner of any window you have open for the project. Click
    the icon to bring Results into view. You will find specific references to files
    and locations of errors. This appendix lists the compile-time error messages you
    are likely to encounter as you get acquainted with Objective-C, Xcode, and the
    Cocoa Touch frameworks.


    You will learn that Xcode presents two types of messages: warnings and errors.
    Warnings do not prevent an app from compiling. That said, warnings are not necessarily
    harmless. They are advantage signs that something is not right in your code. The
    app may compile and launch in a simulator or on a device, but don''t be surprised
    if the app crashes unexpectedly. You should clear up all warnings before finalizing
    an app. If you want to make sure you don''t skip over warnings, you can ask Xcode
    (on a project-by-project basis) to take warnings more seriously. Choose Project→Edit
    Settings, click the Build tab, and search for “Treat Warnings as Errors” and activate
    the checkbox. Close the window when you''re done.


    Despite all my advisories about how Xcode error messages differ from JavaScript
    errors, the two environments share one characteristic. If you attempt to build
    a project and the compiler reports several errors, start looking at the top of
    any file that contains an error. Some syntax errors can throw off the rest of
    the code in the file, causing'
