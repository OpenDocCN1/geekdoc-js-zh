    # Other Design Patterns


    Design patterns are not mutually exclusive. An environment can employ multiple
    design patterns at the same time if they don''t collide with each other. The iOS
    SDK identifies a total of four design patterns in its bag of tricks. Delegation
    and MVC are two that we''ve already discussed. Notice how delegation confines
    itself to the realm of passing messages around objects, while MVC addresses a
    global structure of an application. The other two design patterns are known as
    target-action and the managed memory model.


    Graphical user interfaces—including modern browsers and iOS apps—almost have an
    event (or run) loop running underneath the hood. The loop constantly monitors
    activity in the user interface and instructions on how to drive execution when
    an event of a particular type occurs with a user interface occurs. In DOM documenting,
    you assign an event handler to an HTML element for a particular type of event,
    such as when the user uses the mouse button to tap a screen. In an iOS app, an
    on-screen control (e.g., a button) in a view can be sent to a message to the controller
    for when a particular event type occurs (e.g., dragging a finger on the screen).
    The receiver of that message (the view controller) is known as the target for
    the event, and the message is the name of the method to run when the event fires.
    You saw how that we made the assignment for the button in Workbench through Interface
    Builder. After creating the runCode method for the view controller class (defined
    with an IBAction return value), you used Interface Builder to tell the button
    to send a when a Touch Up Inside event occurs. That is the essence of the target-action
    design pattern.


    The last design pattern, memory management, concerns itself with how applications
    use and free memory in operation. Chapter 6 goes into more detail about usage,
    and this concept is something JavaScript programmers don''t have to worry about
