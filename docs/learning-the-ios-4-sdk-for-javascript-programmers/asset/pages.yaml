  md: "In addition to the UIApplication object sending messages to the app delegate\
    \ about changed of state, it also triggers what are known in Cocoa Touch notifications\
    \ via the NSNotificationCenter. This system process allows any object to register\
    \ with the center as an observer, waiting for a specific notification. When an\
    \ iOS app is about to be suspended, a notification UIApplicationDidEnterBackgroundNotification\
    \ is sent through the center. Any object that has to be registered when that notification\
    \ is sent is alerted and sends a message to an observer, typically the current\
    \ object (self).\n\nThe following code is a modified version of the viewDidLoad:\
    \ method for the PList-Download project which includes the following naming convention:\n\
    \n```\n- (void)viewWillAppear:(BOOL)animated {\n  [super viewDidLoad:animated];\n\
    \  // Alloc and initialize receptacle for retrieved plist data\n  self.incomingPlist\
    \ = [NSMutableData initWithCapacity:1000];\n\n  // Set up observer for Fast App\
    \ Switching suspended\n[[NotificationCenter defaultCenter] addObserver:self\n\
    \ selector:@selector(restoreApp)\n name:@\"UIApplicationDidEnterBackgroundNotification\"\
    \n object:nil];\n}\n```\n\nWhenever the notification occurs, the restoreApp method\
    \ (defined in the ViewController class to delete and clear the label) is invoked.\
    \ You'll learn more about the @Selector terminology later in this chapter. Every\
    \ addObserver:method, however, should be balanced with a removeObserver:method.\
    \ For this example, the removeObserver:method is called in the dealloc method:\n\
    \n```\n(void)dealloc {\nNotificationCenter *notificationCenter =\n[NotificationCenter\
    \ defaultCenter];\n[notificationCenter\n removeObserver:self\n name:@\"UIApplicationDidEnterBackgroundNotification\"\
    \n object:nil];\n\n[self.plistConnection release];\n[self.incomingPlist release];\n\
    [self.resultslabel release];\n[super dealloc];\n}\n```\n\nEach app has different\
    \ needs for accommodating Fast Switching. Consider the state of the app when it\
    \ is brought back to life and what the user's expectations might be at that. Has\
    \ so much elapsed since the app went to sleep that it should look for possible\
    \ updates from the server? Should an interrupted process be resumed or restarted?\
    \ It's something you have to evaluate carefully during the design phase."
