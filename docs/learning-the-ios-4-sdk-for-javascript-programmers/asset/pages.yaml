  md: 'ripple effect of errors. It''s a waste of time trying to fix something that
    really isn''t broken, when the fault lies earlier in the file.


    With that advice, let''s begin the error message parade. Items in warning and
    error messages shown as `<someName>` indicate that the content in the message
    will refer to a class, method, or variable name from your source code.


    # Error Messages


    Error Message: `<className>` undeclared

    Interpretation: You are most likely trying to reference a class whose header file
    has not been imported into the current class. This includes trying to reference
    a class in a framework you have forgotten to add to the project.


    Error Message: `<methodName>` undeclared

    Interpretation: If this occurs in the line where a method definition occurs, there
    is likely a problem earlier in the code. Most likely the previous method definition
    has an imbalanced of curly braces.


    Error Message: '';'' before '']'' token

    Interpretation: A statement in a code block is missing its semicolon delimiter.


    Error Message: Expected '';'', '','', '']'' or ''_attribute__'' before ''end''

    Interpretation: A property declaration above the error is missing its semicolon
    delimiter.


    Error Message: Expected identifier before '';'' token

    Interpretation: A method declaration in the header or in the implementation ends
    in a colon in anticipation of an argument, but the argument is missing.


    Error Message: ''i'' undeclared

    Interpretation: You tried to initialize a `for` loop counter variable without
    declaring its `int` type value.


    Error Message: Request for member `<propertyName>` in something not a union

    Interpretation: You are trying to reference a data-syntax property of a dynamically
    typed object (whose data type is id). Access methods use Objective-C square-bracketed
    message instead. For instance, `object.property`, say `[object getProperty]`.


    Error Message: Statically allocated instance of Objective-C class `<className>`

    Interpretation: A variable declaration for an Objective-C object (of the type
    explicitly named at the end of the error message) expected a pointer, but the
    pointer star is missing.


    Error Message: Symbol(s) not found

    Interpretation: You have imported a framework into a class header, but you have
    not yet added the framework to the project.'
