  md: 'You don’t need a brand-spanning-new Intel-based Mac to develop iOS apps. There
    are plenty of used Intel Macs for sale on eBay and elsewhere. For the tower- or
    iMac-verse, laptop styles—MacBooks and MacBook Pros—are well suited for iOS development,
    except perhaps for a small screen. If you can afford a large LCD monitor, you
    will have an easier time managing your project windows. And max out a laptop’s
    RAM slots will also contribute to good performance of Xcode.


    # # Installing the SDK


    To begin your exploration of iPhone development, start by signing up to become
    a Registered iOS Developer at:


    http://developer.apple.com/programs/start/standard/


    Registration requires that you have an Apple ID. If you have an iTunes account
    or you have purchased from the Apple Online Store, you already have an Apple ID.
    Otherwise, you can sign up for one while you register as an iOS Developer.


    The free version of the iOS Developer program lets you download the full SDK from
    the opening page of the iOS section of the Apple Developer website. Be sure to
    confirm you have the minimum Mac OS X version required for the current SDK you’re
    about to download.


    The iOS SDK is huge—over three gigabytes. Be patient with the download. It arrives
    as a compressed disk image, a file with .dmg extension that expands into a mounted
    disk. If the completely downloaded file does not automatically expand, double-click
    the file to mount it on your Desktop (some browsers will do this for you after
    the download is complete). The disk image will open to reveal install notes and
    a package file containing the SDK (Figure 2-1).


    Double-click the .mpkg package file to run the SDK installer. recommend recommend
    the default choices at each stage of the installation process. Allow the SDK to
    be installed in a new Developer directory on your startup disk. If you have iTunes
    running, you will be prompted to quit the app before the installation will complete.
    After installation, you can drag the disk image and compressed image file to the
    Trash.


    # # About iOS Developer Programs


    The free version of the iOS Developer Program allows you to use the SDK to run
    native apps you create on the iOS Simulator program (one of the SDK tools), which
    runs only on the Mac. To upload an app to an actual device for testing (or your
    own use) and to submit an app for distribution through the App Store, you must
    sign up for the $99.00 (per year) iOS Developer Program (or the $299.00 Enterprise
    Program for companies planning to write apps only for employee use). This paid
    developer program grants you access to an Apple-hosted online forum where you
    can ask for coding'
