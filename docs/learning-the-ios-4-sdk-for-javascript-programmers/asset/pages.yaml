  md: '# Obtaining Directory Paths


    The consistent way to obtain directory paths is to use a Foundation framework
    function, NSearchPathForDirectoriesInDomains(), which relies on constant values
    to derive paths of two places inside an app''s directory. Syntax for the method
    returns an array as follows:


    ```

    NSArray *NSearchPathForDirectoriesInDomains (

    NSearchPathDirectory directory,

    NSearchPathDomainMask domainMask,

    BOOL expandTilde

    );

    ```


    The only argument you need to worry about is the first, while the other two are
    always the same use in iOS. The first argument consists of a constant value referring
    to a specific directory, either NSDocumentDirectory (note "s" in the constant
    name) or NSCachesDirectory for the Library/Caches directory. Because of OS X the
    method returns an array. For iOS, the array has only one member. The following
    code obtains the full pathname to the Documents directory:


    ```

    NSArray *paths = NSearchPathForDirectoriesInDomains(NSDocumentDirectory,

    NSUserDomainMask, YES);

    NSString *theDirectoryPath = [paths objectAtIndex:0];

    ```


    To complete the path to a file, you use the app''s name to finish the path:


    ```

    NSString *filename = [theDirectoryPath stringByAppendingComponent:@"userdata"];

    ```


    You don''t have to worry about the forward slash delimiter between the directory
    and filename, because the stringByPathComponent method is smart enough to supply
    the slash if it''s needed. The file''s path is then appended as an argument to
    methods that read from or write to (described in a moment).


    You may have noticed that paths to the Library/Preferences and tmp directories
    don''t have constant values for the NSearchPathForDirectoriesInDomains() function.
    Preferences files are not written directly by you, but via the NSUserDefaults
    class, which uses key-value pairs to store preference values. To fill the gap
    for the tmp directory, Cocoa Touch offers a special function:


    ```

    NSString *tmpDirectoryPath = NSTemporaryDirectory();

    ```


    Write only disposable data to the tmp directory. The system may purge the directory
    if it needs disk space when your app is not running. Don''t rely on the system
    to do all the work. You should manually manage the deletion of files from this
    directory when you no longer need them (such as when the app is to quit, signaled
    by the applicationWillTerminate: delegate message to the app delegate class).


    If you intend to create custom subdirectories for your app''s data, do so inside
    known paths, such as the Documents or Library/Caches directories. You can also
    create a Library/Application Support directory and access it through the NSearchPathFor'
