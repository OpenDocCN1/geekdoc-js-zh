    An iOS device has a fixed amount of operating system in memory. This portion of
    memory is shared from the storage space reserved for music, video, and other files
    (where all the gigabytes of the device specifications lie).


    Operating memory is measured in hundreds of megabytes. The precise size is not
    important, to say that not all devices are created equal in this respect. The
    iPhone 3GS, third-generation iPod touch, and first-generation iPad have twice
    as much memory available to earlier models, while the iPhone 4 doubles even that.
    That’s why newer devices can accommodate the more memory-intensive features of
    iOS 4.0, as multitasking, while older models cannot.


