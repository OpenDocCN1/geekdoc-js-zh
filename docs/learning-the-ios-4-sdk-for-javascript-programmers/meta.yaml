    # Coding Styles in SDK Samples


    Different engineers write code samples supplied with the SDK. You will therefore
    find a variety of styles in the way projects are composed. The lack of uniformity
    is confusing to newcomers who desperately want to adopt a solid coding style.
    At best, you should look to the samples as just: mixed samples rather than specific
    instructions on how to structure projects, name variables and methods, and even
    how to divide code into separate files. Additionally, most samples aim to demonstrate
    a specific concept rather than define an all-around best practice example. Pieces
    of samples distant from the primary subject may be less than optimal. Furthermore,
    as you learn more about Objective-C and the SDK, don''t be afraid to employ your
    own structure and styles that are comfortable for you.


    # Setting the Project’s Base SDK


    You noticed that the Overview menu at the upper-left corner of the project says
    “Base SDK Missing.” Before you can compile an app and run it, you need to set
    the SDK version Xcode should use for compilation and deployment. Because TheElements
    project was created when SDK 3.0 was still available and modified to build for
    iOS 4.0, Xcode in the iOS 4.2 SDK does not recognize the setting as being valid.
    It’s time to bring the setting up to date by adjusting what is known as the Target—a
    collection of specs Xcode uses to build an around the source code of the project.


    Open the target settings by choosing Project >Edit Target “Elements”. You will
    see the Target Info window. The first group of settings is the Base SDK, which
    confirms that the originally specified SDK 4.0 is not available. Click in the
    right column to reveal your possible Base SDK choices, as shown in Figure 2-11.
    Choose Latest iOS. This setting will allow the project to work in future SDK versions
    without further adjustment.


    Close the Target Info window. The Overview menu should now indicate “4.2|Debug|Elements”
    or similar indications. If the Overview menu doesn’t change, close and reopen
    the project. In the next chapter, you will work with an additional setting that
    will let your app work with iPhone devices running OS versions as early as 3.0—even
    though the Base SDK is still set to 4.2.'
