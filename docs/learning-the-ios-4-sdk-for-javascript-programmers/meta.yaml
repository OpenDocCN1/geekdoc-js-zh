  md: 'dynamic typing as a variable doesn''t need to be prewired for only one data
    type; instead the data type (a class) is assigned at runtime, and the system keeps
    track of the type as needed (and knows which class it should send messages).


    As an illustration of dynamic typing and the id data type, consider an app that
    defines very different classes named Leg, Glass, and Meeting. Each class has a
    method break, which performs a class-specific breaking action on an instance of
    the class. As the app runs, a variable id could contain an instance of any of
    those those, depending on user interaction or another situation. But when a statement
    sends the break message to the variable, the actual class of the variable at that
    instant determines which method executes. Importantly, the compiler can''t know
    which class assigned to the variable has a break method defined for it, because
    at compile time the class of the variable is indeterminate.


    Before you draw the conclusion that you can simply accept the id data type for
    everything and treat Objective-C variables as loosely typed JavaScript variables,
    your compiler will let potential data incompatibilities slide by if you are sloppy
    with typing. Errors will occur at runtime and conceivably crashes can be challenging
    to repair even with the Xcode debugger. You are often better finding data type
    inconsistencies at compile time rather than at runtime. The Xcode compiler supplies
    many choices (albeit not all of them immediately clear to newcomers) about data
    types. It''s true that accurately typing variables and methods can be frustrating
    at first—you''ll feel as though you''re doing a lot of the work the compiler should
    do—but the code will be easier to maintain over time.


    Despite these cautions, don''t be afraid of dynamic typing—Cocoa Touch frameworks
    use it extensively. It will take some time working in Objective-C before you recognize
    places where dynamic typing can contribute to your code''s flexibility.


