  md: "# Operators\n\nYour knowledge of JavaScript operators sets you up perfectly\
    \ for C/Objective-C operators. A few JavaScript operators don't apply (function(),\
    \ typeof, void, and delete), but the rest are in play and with the same precedence\
    \ rules.\n\nYou need to be cautious when applying your knowledge of JavaScript\
    \ comparison operators to Objective-C. JavaScript attempts to find common ground\
    \ in string and numeric values. For example, consider the following JavaScript\
    \ function:\n\n```\nfunction comparisonTest() {\n  fiveString = \"5\";\n  fiveNumber\
    \ = 5;\n  return fiveString == fiveNumber;\n}\n```\n\nEven though the == comparison\
    \ operator compares a number against a string, JavaScript returns true for this\
    \ function. By substituting the strictly equals operator (===) would the value\
    \ types taken into account (in which the function returns false). In Objective-C,\
    \ such disparate value types would never be considered as equal. Numeric types\
    \ are not as strict, so the integer 5 and the float 5.00, are considered equal.\n\
    \nThe C language adds typecasting as an operation to take into account when determining\
    \ an expression value. Typecasting (e.g., converting a float to an integer by\
    \ preceding the integer's value with (float)) has a high precedence, ahead of\
    \ common arithmetic operators. This allows a value to be cast into the desired\
    \ type before math operations apply to the value.\n\n# Program Flow Constructions\n\
    \nWhen it comes to program flow controls, your JavaScript experience gets almost\
    \ all of the way there. The following C/Objective-C prototypes should all look\
    \ familiar to you (showing the multiple-line statement with curly braces and optional\
    \ items in brackets):\n\n```\nif (conditionExpression) {\n  statementsIfTrue\n\
    }\n```\n\n```\nif (conditionExpression) {\n  statementsIfTrue\n} else {\n  statementsIfFalse\n\
    }\n```\n\n```\nresult = (conditionExpression) ? expression1 : expression2;\n```\n\
    \n```\nwhile (conditionExpression) {\n  statementsIfTrue\n}\n```"
