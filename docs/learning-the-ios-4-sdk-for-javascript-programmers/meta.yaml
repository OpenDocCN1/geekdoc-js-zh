    If you define a method that returns a Boolean, the return type is specified (BOOL).
    You can extract the BOOL value from an NSString or NSNumber object via the boolValue
    method of those classes. Although you can go continuing to use true and false
    or 1 and 0, it''s a good idea to make your code Objective-C compliant as possible.
    Finally, if you wish to view a Boolean value in a format string (as in NSLog),
    use the id format specifier, which will display the integers 1 or 0, or create
    a conditional operator statement that returns more readable words, as the following:


    ```

    NSLog("@flagValue = %@", flagValue ? "YES" : @"NO");

    ```


    # # Math Object Equivalents in C


    The core JavaScript language has a static Math object, which features a number
    of methods and properties that acts as constants. For example, if you want to
    determine the next index lower for a floating-point value, use the floor() method
    of the static Math object, as:


    ```

    var floorValue = Math.floor(myValue);

    ```


    The C language has no dedicated object for that. Instead, it implements series
    of functions, which you can call directly in your statements. For example:


    ```

    double floorValue = floor(myValue);

    ```


    Table 7-3 lists the JavaScript Math functions and the corresponding C functions.
    The standard C language offers more variations of these functions (in the math.h
    and stdlib.h libraries) automatically incorporated into every iOS app), offering
    different levels of precision. For [Table 7-3](#)**, I have chosen the versions
    that return values of the double data type. Also pay special attention to the
    required type of values passed as arguments to the C functions.


    Table 7-3 Math functions comparisons


    | JavaScript | Description | C/Objective-C |

    |--- | --- | --- |

    | Math.abs(x) | Absolute value | double fabs(double x); |

    | Math.acos(x) | Arc cosine | double acos(double x); |

    | Math.asin(x) | Arc sine | double asin(double x); |

    | Math.atan(x) | Arctangent | double atan(double x); |

    | Math.atan2(x, y) | Angle of polar coordinates | double atan2(double y, double
    x);'
