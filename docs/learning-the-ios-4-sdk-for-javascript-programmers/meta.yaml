  md: "# Local Variables in Control Structure Blocks\n\nAs you will learn later in\
    \ this chapter, C and JavaScript have much in common when it comes to control\
    \ structures (repeat loops, ifs, switches, etc.). The impact of these structures\
    \ on local variables is quite different. The looseness of JavaScript will potentially\
    \ trip you up in the C/Objective-C world.\n\nConsider the JavaScript function\
    \ (artificially constructed to demonstrate a point):\n\n```\nfunction localTest(input)\
    \ {\n  for (var i = 0; i < 25; i++) {\n    if (i == input) {\n      var woohoo\
    \ = i;\n    }\n  }\n  return woohoo;\n}\n```\n\nThe first declaration of the woohoo\
    \ local variable is nested inside an if construction, which, in turn, is nested\
    \ inside a for loop. The function returns the value of that nested value. A variable\
    \ in a JavaScript function is said to be hoisted to the scope of the function,\
    \ as if it were declared at the beginning of the function without an assigned\
    \ value.\n\nAlthough the function as shown will definitely return a value, if\
    \ the condition might be built to test the loop counting variable against some\
    \ external value (e.g., a number entered into a text field by a user). Under those\
    \ circumstances, it is very conceivable that the if condition might fail for every\
    \ iteration through the loop and never assign a value to woohoo. Yet the final\
    \ return statement attempts to return something woohoo. What happens in this case\
    \ is that the value returned by the function is undefined, which is the value\
    \ implicitly assigned to woohoo when JavaScript creates the variable. If the statement\
    \ that calls localTest() expects a numeric value, your scripts will crumble into\
    \ a heap. On one hand, JavaScript gives you wide latitude when it comes to scoping\
    \ your variables; on the other hand, you can get into trouble if you don't test\
    \ for all possibilities and guard against unusual results.\n\nIf you were to compare\
    \ the equivalent Objective-C method, it would look like the following:\n\n+  \
    \ (int)localTest {\nfor (int i = 0; i < 25; i++) {\n  if (i == 22) {\n    int\
    \ woohoo = i;\n  }\n}\n\nBut building this method triggers a compiler error (actually,\
    \ a few errors tied to the same problem). The issue is that a variable's scope\
    \ is local to the control block in"
  merge: -1
  pgno: 155
- img_proc: false
  md: "which is declared. Declaring the woohoo integer variable in the nested if construction\
    \ means it can be used only in that block or any further nested block within the\
    \ if construction. The return statement cannot \"see\" the woohoo variable, and\
    \ to the compiler, woohoo is an undeclared variable within the scope of the return\
    \ statement.\n\nTo repair the problem, declare the variable in the same scope\
    \ as the return statement:\n\n```\n(int)localTest {\n  int woohoo;\n  for (int\
    \ i = 0; i < 25; i++) {\n    if (i == 22) {\n      woohoo = i;\n    }\n  }\n \
    \ return woohoo;\n}\n```\n\nAnother JavaScript usage with a loop-counting variable\
    \ is to rely on its value following a nested break statement, as in the following:\n\
    \n```\nfunction breakTest() {\n  for (var i = 0; i < 25; i++) {\n    if (i ==\
    \ 22) {\n      break;\n    }\n  }\n  return i;\n}\n```\n\nThis works in JavaScript\
    \ because a local variable declared anywhere within a function is visible to any\
    \ other statement in the function. Thus, the loop counter is still within scope\
    \ for the return statement. But the following Objective-C equivalent fails:\n\n\
    ```\n(int)breakTest {\n  for (int i = 0; i < 25; i++) {\n    if (i == 22) {\n\
    \      break;\n    }\n  }\n  return i;\n}\n```\n\nThe compiler error again points\
    \ to scoping as an issue the loop counting variable is defined within a for block\
    \ and not at the same or higher level of the return statement. Again the fix is\
    \ to declare the variable in the proper scope:\n\n```\n(int)breakTest {\n  int\
    \ i;\n  for (int i = 0; i < 25; i++) {\n    if (i == 22) {\n      break;\n   \
    \ }\n  }\n  return i;\n}\n```"
