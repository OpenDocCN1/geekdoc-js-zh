    variety of choices, as well as a list of previously opened projects (preferably
    for you). Click Cancel for now. Instead, open the Help menu and choose Developer
    Documentation, as shown in Figure 2-3. You will be referring to documentation
    a lot, and this menu (or keyboard equivalent) is a quick way to open the documentation
    window before you open a project.


