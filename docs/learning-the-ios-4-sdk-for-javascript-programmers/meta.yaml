  md: 'As you have probably experienced with JavaScript debuggers, you set a breakpoint
    in your source code by clicking in the column to the left of any statement. With
    breakpoints enabled in Xcode, program execution pauses at the designated line
    location. You can then step through your code while observing variables and following
    logic paths in the separate Debug window, available via Xcode''s Run menu.


    The lower-left pane, labeled Groups & Files, is where you organize the files of
    your project. Notice that the folder organization is completely independent of
    actual files in your project''s Finder folder. The purpose of this is to let you
    collect all of your project''s external files into an organization that helps
    you locate the files for editing, as a project grows to potentially dozens of
    files. You can add groups (folders) as you go and change the organization at will;
    you may even nest groups to multiple levels if it helps you keep things straight.
    Most of your activity will be in the topmost pane, whose name is that of your
    project. Therefore, at this stage, don''t be put off by the long list of other
    items, many of which will not deal with directly or regularly.


    By default, the upper-right pane lists the items by whichever group is selected
    in the Groups & Files pane. If an item''s name is shown in red, the file is expected
    but does not exist yet (or has been deleted from the project''s Finder folder).
    For example, because you have not built your Workbench, the compiled .app file
    (in reality, it''s a package) does not exist (although it is expected to exist)
    and is listed in red. If you select only a single file in the Groups & File list,
    the file is the only one shown in the upper-right pane. Don''t worry about the
    columns at the right at this point.


    Finally, at the bottom right is the editor window where you write and edit source
    code. It is more important to have a big editor window, and the upper-right pane''s
