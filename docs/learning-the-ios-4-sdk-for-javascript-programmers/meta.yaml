    \ iOS SDK documentation as it describes values as C structures.\n\n# # C Arrays\n\
    \nThe language offers arrays that syntactically resemble JavaScript arrays. Except\
    \ for the occasional need to parse a C array of values to CoreGraphics framework\
    \ methods, you won't use C arrays for your app because Cocoa Touch provides a\
    \ far more robust version in the NSArray class (described in Chapter 8). I include\
