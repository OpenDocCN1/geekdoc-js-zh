  md: '# CHAPTER 3


    # Creating a Test Workbench


    If there is none comfortable technique to which we HTML, CSS, and JavaScript developers
    have grown accustomed, it is writing some tiny code samples to test expression
    evaluations and execution logic. You very likely have at least one test.html file
    somewhere on your hard drive. In one of my JavaScript books, I include code for
    a page called The Evaluator, which allows readers (and, more importantly, me)
    to see of single-line expressions and obtain property dumps of objects (lists
    of property names, values, and value types for any JavaScript or DOM object in
    the page).


    It''s convenient to test code snippets in an environment that is isolated from
    your major work in progress. First, you don''t want code to influence your experiment
    (think "scientific method"). Second, you don''t want your experiments to mess
    up your existing working code. The Workbench app you will build in this chapter
    will provide you with a running iPhone environment (initially on the iPhone Simulator)
    in which you can easily test expressions, code, and the like. Use it as a learning
    lab while you work through the remaining chapters of this book.


    Figure 3-1 shows the finished app. True, it''s nothing more than an iPhone screen
    with a button on. You will set up this app so that you can test code in the iPhone
    runtime environment by clicking that button. Results will appear in a separate
    window of Xcode, called the Console (more about that later). The purpose of the
    Workbench app is to provide a clean environment into which you can insert your
    Objective-C experiments and other explorations, which all get triggered when you
    click that button.


    In the process of building Workbench, you will be simply following my instructions.
    I don''t expect you to understand everything that is going on, but I will explain
    concepts to you as we go. For example, you''ll appreciate the importance of choosing
    good names for projects in "Naming and Saving the New Project" on page 29. Later
    you will get to play with Interface Builder to design the layout. If you don''t
    fully grasp why something is the way it is, don''t worry—future chapters will
    cover most most of these concepts in more depth, while your future introductions
    to iOS SDK programming will cover the rest.'
