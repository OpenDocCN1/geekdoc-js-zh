  md: '# Learning the iOS 4 SDK for JavaScript Programmers


    Is it possible for JavaScript programmers to learn Apple''s iOS 4 SDK and live
    to tell the tale? Technology guru Danny Goodman did, and with this book he leaves
    a well-marked trail for you to follow. An authority on JavaScript since its inception,
    understands the challenges you might face in creating iOS apps with this SDK,
    and introduces Xcode, Objective-C, and Cocoa Touch in a context you''ll readily
    understand.


    > "Anyone with a web background wanting to jump into native apps should follow
    Danny''s investigative approach to learning the platform. This is the perfect
    guide for any seasoned JavaScript programmer wanting to make the journey to the
    App Store."


    Why bother with the SDK when you can simply build web apps for Apple''s iOS devices?
    Web apps can''t access an iPhone''s music library, camera, or iOS system software
    for maps, audio, and more. Nor can you sell web apps in the App Store. If you
    want to take full advantage of the iPhone and iPad, iOS 4 SDK is your tool—and
    this is your.


    +   - Learn the distinction between web app and iOS native programming


    +   - Create a workbench to test code snippets throughout the learning process


    +   - Get a structural view of an iOS app and compare the process of building
    objects in Objective-C versus JavaScript


    +   - Discover how your code launches iOS apps and makes them user-ready


    +   - Learn how iOS memory management plus Objective-C pointers and data types
    differ from JavaScript coding


    +   - Use Objective-C and Cocoa Touch to implement common JavaScript tasks


    Danny Goodman has written more than three dozen books and hundreds of magazine
    articles on personal computers and consumer electronics. Recently, he''s been
    programming iPhone and iPod apps, ifFeltThat Earthquake, Photosize, and BeaconAid-HF.


    —Todd Moore Creator of White Noise


    Previous programming experience is recommended.


