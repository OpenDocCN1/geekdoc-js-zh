- img_proc: false
  md: 'operating system. You''ll still need good ideas about the data and how best
    to integrate that data into the device, but learning the broad spectrum of APIs
    available to you is a very important part of the learning process.


    # Public Versus Private APIs


    If you read the fine print of your iOS SDK license agreement, you find the provision
    that your apps may only use "Documented APIs," Which Apple defines as the APIs
    it reveals via its developer documentation in the SDK. These are not the only
    APIs in iOS, but they''re the only ones that you, as a registered developer, can
    use if you plan to distribute your app through the App Store.


    Apple''s explanation for this distinction between public and private APIs is that
    undocumented, private APIs are generally not yet finalized–ready for prime time,
    as it were. The burden of changing an API is that developers will use, and it
    becomes nearly impossible to change that API in the future it would break all
    existing apps that use that API. Additionally, there are APIs in the OS that Apple
    will never document because developers could abuse the privileges, much to the
    dismay of users (e.g., making phone calls) or cell phone providers (e.g., downloading-length
    HD video over a 3G connection).


    Being limited to documented APIs might be frustrating at times, especially if
    you see Apple''s own apps performing tasks that yours cannot. In the meantime,
    there are enough APIs ahead of you on your learning curve to keep you busy.


    # Frameworks


    One way Apple uses the thousands of APIs is to organize them into groups known
    as frameworks. You may recognize the term from your exposure to JavaScript libraries
    such as Dojo, jQuery, and YUI. Although there are differences between libraries
    and frameworks (a subject beyond the scope of this book, and generally generating
    programming-religious discussions), both provide APIs that facilitate programming-specific
    tasks. Frameworks targeting iOS app development include UIKit and a jQuery plugin-called
    jqTouch. The UI framework consists of CSS and JavaScript scripts you link into
    a page. The JavaScript objects and functions in the .js file are immediately available
    within the scope of the current document window. For example, the UI framework
    performs the heavy lifting in turning an HTML unordered list into a view that
    resembles the typical iPhone vertically scrollable table; a tap on an item (via
    a touch) causes what looks like a video to slide in from the right side.


    You can see the three frameworks that are common to every iOS app created with
    the SDK. Open the Workbench project in Xcode and expand the Framework folders
    in the Files and Groups panel on the left. You will see entries for the Foundation,
    UIKit, and CoreGraphics frameworks (Figure 4-1).'
