  md: "Multidimensional arrays are also allowed, using two sets of brackets. The following\
    \ statement initializes an array that has 10 elements, each of which can hold\
    \ up to 100 integer elements:\n\n```\nint myMultiArray[10] [100];\n```\n\nYou\
    \ will occasionally see array variables (including parameter variables) defined\
    \ as type char. Each member of the array stores one text character value—more\
    \ precisely, the integer ASCII value. In your coding, however, you'll be using\
    \ NSString for your text.\n\n# Enumerated Types\n\nIn your tour of Cocoa frameworks,\
    \ you will encounter many collections of values known as enumerated types. In\
    \ C with the enum statement, the construction is a collection of convenient names\
    \ representing integer values. It's easier to show you how explain it.\n\nYou\
    \ are probably familiar with the Maps app, lets you select from three different\
    \ map styles: standard, satellite, and hybrid. If you add a map to your view,\
    \ your code can change the style by setting the setMapType: message to an instance\
    \ of MKMapView. Acceptable values are integers: 0, and 2 to denote standard, satellite,\
    \ and hybrid, respectively. To help make your code more readable, these values\
    \ have been assigned names that act as constants for their designated data type\
    \ (i.e., they can not be used in other places). Because the values are all related,\
    \ they are grouped into an enumerated list and assign a type definition. The three\
    \ map style values are defined in the mapping framework as:\n\n```\nenum {\n \
    \ MKMapTypeStandard,\n  MKMapTypeSatellite,\n  MKMapTypeHybrid\n};\\ typedef NSInteger\
    \ MKMapType;\n```\n\nBy default, an enum type assigns values (beginning with 0)\
    \ to the constant names in the group. It is also possible to assign explicit numbers\
    \ to each constant name or assign a different starting point for the items by\
    \ assigning a nonzero value to one item (in which case, subsequent items have\
    \ incremental integer values). For your coding, you don't concern yourself with\
    \ the integer values, but with the constant names associated with the data type.\
    \ Therefore, to change an existing MKMapView object to satellite view, the message\
    \ will be as follows:\n\n```\n[myMapView setMapType:MKMapTypeSatellite];\n```\n\
    \nYou will see these enumerated lists fairly frequently in the SDK documentation,\
    \ along with a brief (often too brief) description of what each constant represents."
