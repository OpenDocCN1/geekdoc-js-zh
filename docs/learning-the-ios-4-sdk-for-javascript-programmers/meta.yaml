  md: 'an NSString type, the method will cast the object to the more restrictive NSString
    type for operations. If you are designing custom methods that need to preserve
    mutability, specify the arguments as NSMutableString data types.


    All of the Cocoa Touch methods (including those for arrays and dictionaries) are
    powerful constructions that use lots of lashing and pasting together pieces to
    make changes. At the same time, however, they use more resources than their immutable
    counterparts. Use them only when needed.


    # About NSArray


    Like JavaScript arrays, Cocoa Touch is an ordered collection of data, with each
    element of the array referenced through a zero-based index. You can use that index
    to iterate through both using for loops. Although both objects have a handful
    of methods that perform similar tasks with arrays, you have more restrictions
    and more possibilities with the NSArray than you do with JavaScript arrays.


    The most important departure is when you create an NSArray, you have one shot
    to include elements in the instance of the array. That instance remains fixed
    for its life with respect to its content and order. Methods allow you to create
    new NSArray additional elements to the original, extract copies of elements from
    the array, and obtain a copy of the array sorted according to criteria you devise.
    To create an array that has the same type of self-modifying behavior as the JavaScript
    array, you can use the NSMutableArray class.


    Arrays are vital components of iOS apps because they typically become the data
    sources for table views. You can write an NSArray to a file (or deliver a file
    in your app bundle) and, in a subsequent session, load that file to recreate the
    NSArray object for your code to use. The sorted order of an array determines the
    sorted order of cells in the table view.


    The NSArray class is far more adaptable than a C array, whereas elements must
    all be of the same data type. That restriction is gone from NSArray, but in other
    words, cannot create an NSArray to store a bunch of int values; but an NSArray
    is capable of storing Number objects (which can represent many different types
    of numbers). You can therefore mix Number, NSString, NSDate, NSArray, and other
    full-fledged objects (including your own custom subclasses of NSObject) in the
    same NSArray instance.'
