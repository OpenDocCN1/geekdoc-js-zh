    # Building the User Interface


    At this point you have the working Objective-C code for Workbench, but you haven''t
    done anything yet to create the button that appears in the app or connect to it
    myCode: method. You''ll use the separate Xcode tool Interface Builder (or IB)
    to do.


    Xcode not only generates the basic source code for you, but it also generates
    the Interface Builder files you will. Expand the Resources folder in the Groups
    & Files panel, as shown in 3-8. Two of the files have names ending in the .nib
    extension. Although pronounced "nib", you will commonly hear these files referred
    to as "nib" files. Previous generations of Interface Builder for Mac OS developed
    with the .nib extension, but for the current version of Xcode, Interface Builder
    generates files with the .nib extension.


    # About .nib and .nib Files


    The name .nib originated eons ago at Next Computer, the company that Steve Jobs
    founded in 1985. The company created a new operating system, called NeXTSTEP,
    and a development environment for that. Eventually acquired by Apple, the operating
    system found its way into Mac OS and the development environment, which included
    the Next Interface Builder component, grew into today''s SDK for Mac OS and iOS
    programming. You can find plenty of NeXTSTEP history in today''s Cocoa programming,
    in the naming of various pieces. For example, the "NS" part of the NSLog() function
    described in this chapter comes from "NeXTSTEP." Lots of Cocoa identifies with
    those two letters.


    As Interface Builder evolved over the years, the file format for .nib needed enhancements
    to work more easily with source code management systems. Thus, Apple created an
    enhanced file format for Interface Builder, and assigned the .nib extension to
    those files. But the .nib heritage lives on to the extent that Cocoa Touch method
    names that invoke Interface NibName continue to use the word "Nib" within their
    names, such as the initWithNibName:method.'
