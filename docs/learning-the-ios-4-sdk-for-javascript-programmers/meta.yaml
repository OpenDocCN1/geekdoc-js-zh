    # CoreGraphics Framework


    Unlike the Objective-C based and UIKit frameworks, the CoreGraphics framework
    uses the C language in all of its definitions. This is one reason you need to
    be familiar with C syntax when doing iOS SDK programming. The CoreGraphics framework
    focuses on 2-D drawing activities, such as when you need to fill a space with
    a gradient or rotate a user interface (e.g., creating a vertical slider control).


