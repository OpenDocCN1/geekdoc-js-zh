    # Properties and Their Accessors Methods


    Properties really delete getter and setter methods for instance variables, even
    though you can''t see the method code. Therefore, if you are more comfortable
    in some situations using Objective-C messages rather than syntax, you can simply
    refer to the method with the ivar name and the method with the setter method name,
    which consists of lowercase “set” followed by an initial capital property name.
    For example, the MKMapView class zoomEnabled accessor methods can be referenced
    in either of two ways:


    ```

    // Proxy syntax

    if ([myMapView zoomEnabled]) { ... }

    myMapView.zoomEnabled = YES;


    // Getter and setter method syntax

    if ([myMapView setZoomEnabled]) { ... }

    myMapView setZoomEnabled:YES;

    ```


    This choice extends properties you create in your own custom classes and for those
    in the Cocoa Touch frameworks. However, if the object in question is of id dynamic
    type, you will have to send messages to the accessor methods rather than use dot
    syntax. This is because the compiler won''t able to resolve the dot syntax property
    against an indeterminate data type. When you use the message syntax with a dynamic
    data type, the compiler leaves the resolution to runtime.


