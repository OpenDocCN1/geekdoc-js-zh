  md: '# Wrapping Values in NSValue Objects


    If you need to store nonobject values in NSArray, NSDictionary, or Cocoa Touch
    collections, the NSValue class comes to the rescue. This class is capable of wrapping
    the data—including C structs and scalar data types such as int, float, and double
    values—into a generic object that collections store internally, to a file, and
    load from a file for reuse later.


    As an example, the following code (which you can run in the Workbench runMyCode:
    try for yourself) obtains the frame of the current view, which is CGRect type:


    ```

    CGRect myRect = self.frame;

    NSValue *myValue = [NSValue valueWithBytes:&myRect

    objType:@encode(CGRect)];

    NSArray *myArray = [NSArray arrayWithObject:myValue];


    NSLog("%@", myArray);

    ```


    If you inspect the CGRect details in the SDK documentation, you see that it is
    a C struct with a type of CGRect. To get that data into an NSValue, use the valueWithBytes:objType:
    which is defined as:


    +   + (NSValue *)valueWithBytes:(const void *)value

    objType:(const char *)type


    The value must be passed as a pointer, because the myRect variable is not a pointer,
    you must reference it with the & (which supplies the variable). The second argument
    uses the @encode compiler to produce a compiler-friendly string for the type of
    the data you. For C structs, you can use the typedef value (not quoted). With
    the value preserved in the NSValue instance, it can be assigned to an array, dictionary,
    or other collection object.


    To retrieve the value, use the NSValue''s getValue: method, which uses a construction
    called a buffer. Here''s the specification for the getValue: method:


    +   - (void)getValue:(void *)buffer


    Notice that the method does not return a value. Instead, the value is assigned
    to the pointer of a variable that you have declared of the type of value. The
    following code extends the example above by creating a buffer (named retrievedRect)
    and having the getValue: method assign the value to the buffer (with the same
    & pointer we used to turn a variable into a pointer earlier). The variable can
    then act as a regular CGRect, from which a value is extracted and displayed in
    the console:


    ```

    CGRect myRect = self.frame;

    NSValue *myValue = [NSValue valueWithBytes:&myRect

    objType:@encode(CGRect)];

    NSArray *myArray = [NSArray arrayWithObject:myValue];

    ```


    ```

    // Create buffer variable

    CGRect retrievedRect;

    // Read array member and put its value into buffer

    [myArray objectAtIndex:0] getValue:&retrievedRect];

    ```


    NSLog("%f", retrievedRect.size);


    About NSArray | 191'
