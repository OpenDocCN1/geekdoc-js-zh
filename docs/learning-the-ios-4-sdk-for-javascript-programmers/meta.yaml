    # # Introduction to Delegates


    If you delegate a task to someone else, you essentially appoint person to perform
    that task on your behalf while you''re doing something else. It''s the handoff,
    the passed back, the get-it-out-of-mybox move. To delegate successfully, you need
    to specify who that delegate is and what it is you want that delegate perform
