    a related activity or subject area (e.g., the home page, the support page, the
    contact page). A highly dynamic page, of course, can cram multiple screens of
    functionality into a single page—the ability to view a Gmail inbox list and compose
    a new message on the same page comes to mind, but even Gmail''s Help link takes
    you to a different page. And so, it is quite natural to approach a web browser
    programming by thinking about page organization and how users will navigate from
    one page to another.


    In an iOS app, however, the screen-sized view is king. Some apps, as simple games,
    keep users looking at just one view for all of the game play, but somewhere a
    button appears to show a different screen with a score history, instructions,
    or a list of other apps made by the same developer. The earlier you begin thinking
    your app ideas into a series of full-screen views, the quicker you''ll be able
    to arrive at a good navigation plan.


    In addition to the screen-sized views that you use to organize app navigation,
    virtually every view on display is a view of some type. The UIKit framework defines
    a UIView class, which child classes include all interface controls (buttons, text
    fields, sliders, etc.), static text labels, scrollable tables, individual cells
    within a table, modal dialogs, and the type of horizontal bars you see at the
    tops and bottoms of screens (including the status bar that displays the time and
    the battery icon).


    When you use Interface Builder to lay out elements, you are laying out multiple
    views nested inside the screen-sized view. Such nested views are called subviews,
