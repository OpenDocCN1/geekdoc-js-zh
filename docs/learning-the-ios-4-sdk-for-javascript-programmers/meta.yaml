    This order has a great bearing on the class structure for the app.


    # The UITableView Class


    One of the most popular user interface classes across iOS apps is UITableView.
    It is the recommended way to present lists of text and/or images. The iPod app,
    for example, uses numbers to display lists of albums, playlists, and songs. Each
    item occupies a table cell. Typically, a tap on a cell leads to a detail view
    of the item tapped or to a sublist, implemented as a UITableView that swoops from
    the side.


    Coco Touch has a huge amount of influence to ease the creation of simple tables.
    You can create the window''s primary view as subclass of UITableView (rather than
    the generic UIView you used in Workbench). Your view controller becomes the delegate,
    and in the delegate methods—most of which Xcode provides when you use your template—where
    most of the magic occurs.


    A table needs information to display in cells—a data source. For a simple list
    of text, the data source can be an array of strings. As the view controller needs
    to fill visible cells with data, one of the delegate methods is called repeatedly,
    each time receiving a row number. A row number corresponds to a data source array
    index, and you can assign the array entry to the cell''s label for that row. A
    sophisticated mechanism reuses cells as the user scrolls to minimize memory usage.
    Xcode sample apps demonstrate how to implement.


