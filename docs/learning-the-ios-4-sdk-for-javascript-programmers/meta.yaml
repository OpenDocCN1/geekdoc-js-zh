  md: 'Instruments is an incredibly rich development and testing tool. Explaining
    how to exploit all its powers would take a separate book. Although the iOS SDK
    documentation includes an Instruments User Guide (search for "Instruments\ the
    guide is not necessarily for the newcomer to the platform. You can, however, get
    some individual help asking questions at Apple’s iOS Developer Center forums (iOS
    developer membership required).


    Other helpful tool is available to all users of the SDK. Xcode includes a static
    analyzer, which goes through your source code in search of problems the compiler
    does not always locate. For instance, the analyzer (built from an open source
    tool called CLANG) will spot potential memory leaks in your code. The first time
    you run your code through CLANG (generally unresolved retain counts) it displays
    in the Build Results window (choose Build→Build Results to show the window). CLANG
    can display occasional false positives for problems, but you should study each
    reported issue carefully.


    # Recap


    I hope this chapter does not send you running for the hills because of so many
    concepts that might be strange to you. From here you’ll move on to what may be
    more familiar territory, learning how to transfer your JavaScript and DOM scripting
    knowledge to Cocoa Touch. Many JavaScript constructions and syntax formats will
    be usable as-is (or very close) in your iOS app code. But where differences occur,
    you’ll need to learn the new ways by trying them in Workbench. That’s what the
    remaining chapters demonstrate.'
