  md: 'Be sure to look through Chapter 9 for additional string-based operations in
    Objective-C.


    # NSMutableString


    Although you can extract excerpts from strings and append one string to another
    for NSString, the results of these methods yield new autoreleased NSString objects.
    This can leave behind a trail of autoreleased objects that eat up memory if used
    in a high-volume repeat loop. If your code requires a lot of string manipulation—especially
    inserting, deleting, replacing, and appending within a single string—you can use
    the NSMutableString class to generate the main string and restrict activity to
    that object.


    NSMutableString is a subclass of NSString, which means all methods available for
    your mutable object. The inherited NSString methods, however, don''t change their
    stripes just you''re using a mutable version. For example, the uppercaseString
    method returns a new object with an uppercased copy of the original.


    But what do you have at disposal is a series of methods dedicated to modifying
    a mutable string:


    +   - (void)format:(NSString *)format

    - (void)appendString:(NSString *)string

    - (void)deleteCharactersInRange:(NSRange)range

    - (void)insertString:(NSString *)string atIndex:(NSInteger)index

    - (void)replaceCharactersInRange:(NSRange)range with:(NSString *)string

    - (NSInteger)replaceOccurrencesOfString:(NSString *)replacement with options:(NSStringCompareOptions)options
    range:(NSRange)searchRange

    - (void)setString:(NSString *)string


    Notice that these methods return a string object. Most return void, while the
    major string method reports the number of replacements made.


    If you want to use this class, make an instance of one of the two methods designed
    for the task:


    ```

    NSMutableString *myEditable = [[NSMutableString alloc] initWithCapacity:200];

    NSMutableString *myEditable = [NSMutableString stringWithCapacity:200];

    ```


    Don''t be concerned about the requirement to specify a size (number of characters).
    The value allocates an initial block of memory for the object, but if the length
    of the string grows beyond that size, the object automatically allocates additional
    memory as needed. It is more efficient, though, to preallocate the memory you
    expect—as long as you don''t go crazy and reserve a bunch of precious memory you''ll
    never use. You can always pass an NSMutableString object as a method argument
    that requires


    About NSString | 189'
