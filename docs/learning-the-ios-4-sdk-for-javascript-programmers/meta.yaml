  md: "It's important to remember that dictionary entries are not necessarily stored\
    \ in the same order in which their values and keys appear in creation method arguments.\
    \ The purpose of the key is to let you jump into the collection and grab that\
    \ key's associated value, regardless of where it is in the order of entries.\n\
    \n# Retrieving Dictionary Entries\n\nHow you go about retrieving information from\
    \ a dictionary depends largely on how much about the dictionary code knows when\
    \ it's time to get data. The dictionary will hold on to a very regular set of\
    \ values that your code expects to find. Other times, the dictionary may be a\
    \ “black box” with an unknown or variable set of keys.\n\nWhen your code knows\
    \ the key of the value you wish to retrieve, use the objectForKey: method:\n\n\
    +   - (id)objectForKey:(id)akey\n\nThe following example (which you can try in\
    \ Workbench) retrieves two values from a dictionary to fill NSLog:format specifiers:\n\
    \n```\n(IBAction)runMyCode:(id)sender {\n\nNSArray *illinoisData = [NSArrayWithObjects:@\"\
    Illinois\", @\"Springfield\", @[NSNumber numberWithInt:1818], nil];\nNSArray *illinoisKeys\
    \ = [NSArrayWithObjects:@\"name\", @\"capital\", @\"enteredUnion\", nil];\n\n\
    // Declare dictionary dictionary\nNSDictionary *illinois;\nif ([illinoisData count]\
    \ == [illinoisKeys count]) {\n illinois = [NSDictionary dictionaryWithObjects:illinoisData\
    \ keys:illinoisKeys];\nNSLog(\"The %@ entered the Union %@.\",\n [illinois objectForKey:@\"\
    name\"],\n [illinois objectForKey:@\"enteredUnion\\]);\n}\n```\n\nEven if a dictionary\
    \ is a “black box,” the NSDictionary class has methods that let you inspect it\
    \ to retrieve all of its keys or all of its values in bulk (as arrays):\n\n+ \
    \  - (NSArray *)allKeys Returns array of all keys\n- (NSArray *)allValues Returns\
    \ array of all object values\n\nAnother way to work on a collection of keys or\
