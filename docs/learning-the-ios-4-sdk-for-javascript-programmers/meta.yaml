    The C language offers few choices for number generation. For Table 7-3, use the
    arc4random() function. This modern variant of the rand() function is automatically
    seeded so that it does not repeat the sequence of random numbers each time an
    app launches. The function returns a signed integer between -2,147,483,648 and
    +2,147,483,648. If you want a random integer between zero and positive integer,
    use the modulus operator (%). For example, the following produces positive integers
    between 0 and 9 (inclusive):


    ```

    int oneRandomInt = arc4random() % 10;

    ```


    Or, to obtain a positive random integer across the entire range of values, use
    the following:


    ```

    int oneRandomInt = (arc4random() % ((unsigned)RAND_MAX + 1));

    ```


