    ```


    The first statement gives the text of the button that triggers this method (the
    sender parameter references the button) and assigns the value to an NSString pointer.
    That very same sequence of characters is assigned as a string to another NSString
    pointer, stringTwo. Even though the two strings come from different sources, their
    equivalence returns a Boolean true because the values match. That''s not the case
    with pointers, however. In Objective-C, a pointer''s value is the address of the
    data in memory Because the two objects are different, their addresses are also
    equal (see Figure 6-3). Therefore, a test of equivalence of their values yields
    a Boolean false (or 0 in the numeric equivalent expressed in the first NSLog()
    function):


