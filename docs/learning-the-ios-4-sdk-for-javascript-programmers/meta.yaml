  md: 'Getting used to thinking about pointers and using their notation can be a significant
    hurdle for JavaScript programmers who have not used other languages that require
    pointers. It takes a little practice (and several compilation errors) to get used
    to it. Eventually, you will automatically add a pointer to your variable declarations
    without thinking about it and may occasionally accidentally add a star to scalar
    data types that do not use pointers—only to have the compiler remind you.


    # Data Typing


    JavaScript is known as a loosely typed or weakly typed language because it is
    pretty forgiving of the types of data stored in variables or returned from functions.
    In JavaScript, you do not have to declare ahead of time whether a variable you
    are holding a number, string, array, function reference, or other type of data.
    The language goes out of its ways to make variables of incompatible data types
    work together (not always with the results you desire). If you try to add a string
    and a number, the language converts the number to a string, and concatenates the
    values:


    ```

    // JavaScript

    var a = "100";

    var b = 20;

    var result = a + b;

    // result = "10020"

    ```


    Such conversions are not always successful. Change the operator above to division,
    and you get a very different result, because that operator absolutely requires
    two numeric operands:


    ```

    // JavaScript

    var a = "100";

    var b = 20;

    var result = a / b;

    // result = NaN

    ```


    As forgiving this system may be, it can be a burden on a scripter to keep track
    of value types that are stored in variables. For example, if a JavaScript variable
    you create to be an array inadvertently gets a string, you will encounter a runtime
    error if you later attempt to invoke an array object method on that variable.


    In contrast, Objective-C (thanks to its C heritage) requires that you explicitly
    declare the type of data to be assigned to every variable, assigned to every method
    argument, and returned by every method—including one special type, called id,
    that can represent more than one type (more about later in the chapter). The number
    of possible type declarations can be mind-boggling at first—especially when you
    bring all the Cocoa Touch classes into the picture—but you may eventually grow
    to like the discipline typing instills in your coding. By validating specific
    data types, the compiler acts as an early warning system if your code goes astray.'
