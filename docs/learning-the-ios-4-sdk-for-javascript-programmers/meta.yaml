  md: '# CHAPTER 4


    # Structural Overview of an iOS App


    Now we have a working iOS app, we can look more closely at many of the details
    in the source code for that app and the project. Xcode will again be your gateway
    to the inner workings. Although the title of this chapter doesn''t mention object-oriented
    programming (OOP), this chapter is where you will learn the fundamentals—especially
    terminology, which is often quite different from what you''ve seen in the JavaScript
    world. Despite the differences in naming, you will recognize some familiar concepts.


    # Where It All Begins: APIs


    An application programming interface, or API, is essentially a list of entities
    that you can program and what you can ask those entities to do in a program. Designers
    of computers and software systems can choose to expose the inner workings of those
    devices and programs to third-party programmers. APIs typically shield the third-party
    programmer from the complex inner workings of the systems and provide him with
    simpler, optimized, and well-tested ways to control those systems.


    # APIs You Already Know


    As a client-side scripter, you already worked with a number of APIs, even if the
    three-letter name wasn''t forced upon you. The API most obvious to you should
    be the DOM, which exposes every type of HTML element as an object you can script.
    The authors of the W3C DOM write specifications about how objects are named, what
    their properties and methods are, and how objects behave under script control.
    The initial audience for these standards is browser makers who implement the standards
    and provide the APIs that you access via JavaScript.


    APIs for current programming environments rarely stand still. That has certainly
    been the case in the browser API world. The evolving HTML5 standard includes an
    API for new HTML elements that facilitate embedding audio and video into a web
    page, as well as other APIs for offline web applications and dynamically editable
    content.'
  merge: -1
  pgno: 68
- img_proc: false
  md: 'browser maker can also elect to add APIs, which is what Apple has done with
    Mobile Safari to enable limited access to iOS location services through a web
    page''s scripts.


    The JavaScript language provides its own APIs for the core language. The way your
    script works with strings, numbers, dates, regular expressions, and operations
    through the Math object are all part of that API. All of those properties and
    methods you use in reference guides are to provide you with easy access to what
    would otherwise be very complex, low-level programming.


    # The Cocoa Touch APIs


    To allow developers to write apps for the iPhone and similar devices, Apple''s
    engineers created a set of APIs. The historical basis for the iOS APIs was the
    set of Mac OS X development APIs. On the Mac, the most recent set of APIs is known
    as Cocoa (whose heritage, in turn, originated with the NeSTEP development environment).
    Although the name Cocoa was originally associated with a children''s multimedia
    creation environment (by Apple), the name eventually shifted to the Mac OS X development
    world, where it has remained.


    Because so many fundamentals of iOS are based on Mac OS but implemented for purely
    touch-based devices, it was logical to call the iOS APIs Cocoa Touch. That''s
    not to say Cocoa Touch is merely Cocoa with the addition of some touchscreen technologies.
    Cocoa omits many technologies that aren''t necessary for a slimmed-down device
    (compared to a desktop or laptop computer) and adds goes of technologies that
    Mac OS X computers may never acquire—you''re not likely to rotate your MacBook
    to portrait mode or demand turn-by-direction from an iMac.


    Cocoa Touch APIs consist of specifications and built-in functions that programmers
    can use while developing apps for iOS devices. Just as the JavaScript API in browsers
    provides scalable access to strings, numbers, and dates, the Cocoa Touch API provides
    Objective-C access to those same kind of data. And, just the DOM in browsers specifies
    how JavaScript can access and control document objects, such as forms, arbitrary
    divs, or images, the Cocoa Touch API lets programmers access and control buttons,
    scrollable regions within a view.


    But of course, the Cocoa Touch APIs grants lot of OS-specific access to features
    such as the device''s geographical library, the built-in iPod app, and those ubiquitous
    scrolling lists of items. With each generation of iOS, Apple adds more APIs. For
    example, at the announcement of the iOS 4.0, Apple claimed to have added over
    1,500 methods to the SDK, including access to a user''s calendar data and photos
    in the photo library and the ability to build SMS messaging into apps. For iOS
    4.2, Apple added scores of APIs, including MIDI controller and wireless printing
    facilities.


    The job of an iOS SDK programmer, therefore, is to use the Objective-C language
    to manipulate data (text, graphics, sounds, etc.) with the help of the APIs built
    into the'
  merge: -1
