  md: "Be careful not to declare a loop counter variable at the top of the function\
    \ and again inside the for loop control expressions. The compiler lets you do\
    \ it, but it can only lead to disaster. Instead, simply declare the variable early\
    \ in the function and reference it as needed throughout the function, as shown\
    \ above.\n\n# Static Local Variables\n\nYou get a lot more features in C than\
    \ in JavaScript. Imagine defining local variable in a method that remembers its\
    \ value between calls to the method—for instance, a variable that keeps track\
    \ of how many times the method is called. That's the power of a static variable\
    \ in C.\n\nTo define a variable that behaves in that fashion, precede the first\
    \ assignment statement with the static keyword:\n\n```\nstatic int methodCounter\
    \ = 0;\n```\n\nNotice two points. First, you must always include a data type when\
    \ you define any variable. Second, a static variable requires that you initialize\
    \ it with a starting value in the same statement that declares it.\n\nYou can\
    \ see the difference in behavior between a standard local variable and static\
    \ inside the same method. Replace the runMyCode method in the WorkbenchViewController.m\
    \ file with the following:\n\n+   - (IBAction)runMyCode:(id)sender {\n    int\
    \ myLocal = 0;\n\n    NSLog(\"@myLocal = %d\", myLocal++);\n\n    static int myStatic\
    \ = 0;\n    NSLog(\"@myStatic = %d\", myStatic++);\n}\n\nWhen you run the app\
    \ and click the button several times, you see the following sequence in the console\
    \ window:\n\n```\nmyLocal = 0\nmyStatic = 0\nmyLocal = 0\nmyStatic = 1\nmyLocal\
    \ = 0\nmyStatic = 2\n```\n\nThe local variable stays the same because it is deallocated\
    \ at the end of each call and reallocated at the start of the next call, while\
    \ the static one remembers its value between calls to runMyCode.\n\n# Global Variables\n\
    \nUsing the term \"global variable\" can be a little dangerous until you have\
    \ a clear idea of how you define \"global\" in an iOS app. For example, you can\
    \ define a variable to have"
