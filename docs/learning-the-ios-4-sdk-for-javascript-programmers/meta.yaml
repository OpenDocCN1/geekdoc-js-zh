  md: 'You will find one or more instance methods (preceded by -) for the class. Instance
    initializer methods must be used in concert with the alloc method, which means
    that you are also responsible for releasing the object to prevent a memory leak.
    In contrast, class methods (preceded by +) instantiate autoreleased objects.


    Therefore, to create an instance of NSObject, you can use either of the following
    instantiation methods:


    ```

    // Autoreleased version

    NSURL *theURL = [NSURL initWithString:@http://dannny.com/d1/demo.plist\];


    // Managed Memory version

    NSURL *theURL = [[NSURL alloc] initWithString:@http://dannny.com/d1/demo.plist"];

    ```


    Although functionally identical, for the second version you also have to include
    a `[theURL release]` message in the code after you have assigned an argument to
    another object method.


    ![](bbox=[0.163, 0.365, 0.225, 0.435])


    The Apple documents are not consistent in their organization. Some class descriptions
    offer separate listings for creation (via class methods) and initialization (via
    instance methods to be used with alloc), while documents for other classes combine
    the two groups (- or +) you get.


    # Subclassing Framework Classes


    You will begin your iOS journey by focusing on writing subclasses for view controller
    classes, where your code will manage the operation of the user interface and data
    (the View and Model parts of MVC). Creating a subclass means creating a new pair
    of classes named for the class you create. The new class must inherit from another
    existing class.


    When you use Xcode to create a new class file, you are presented with a limited
    range of choices in the New File dialog window. Figure 8-2 shows the choices for
    creating a subclass of nonzero controller classes. The default choice is to inherit
    `NSObject`, `UITableViewCell` (for a class that will lay out elements of customized
    cell) or `UIView` (a rectangular space that typically acts as a container for
    additional user interface control subviews).


    In contrast, Figure 8-3 demonstrates the path you take to create a view controller
    subclass. Your choices are to inherit the generic ViewController or the substantial
    UIViewController. In addition to preconfiguring the header file to name the desired
    superclass, Xcode will also populate the class files with many delegate and data
    source (for `UITViewController`) methods it anticipates you will want to (or may
    be required to code).'
