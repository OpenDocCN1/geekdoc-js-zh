    # Appending items to an array


    NSArray has two methods that let you tack either a single object or another array
    to the end of the current array, but only in the process of creating a new NSArray
    instance with the combined elements. This behavior tracks the JavaScript concat()
    method, but makes it a little more cumbersome to add multiple items, which you
    must first put inside another array before passing them to the arrayByAddingObjectsFromArray:method.


    # Combining array elements into a delimited string


    If you have elements in an NSArray that you''d like to transfer to an NSString,
    the componentsJoinedByString: works like the JavaScript join() method. For example,
    the following code outputs a retelimited string with array values:


    ```

    NSArray *planets = [NSArray arrayWithObjects:@"Mercury",n@Venus, @Earth, @Mars,
    @Jupiter,

    @Saturn, @Uranus, @Neptune, nil];

    ```


    ```

    NSString *planetList = [planets componentsJoinedByString:@"\n"];

    NSLog(@

    ```


    # Sorting arrays


    NSArray offers many ways of producing sorted copies of it. The one shown in Table
    8-4 is similar to the JavaScript sort arrays via an external sorting function
    that compares individual values. The details of how this is done are covered in
    Chapter 9.


    # NSMutableArray


    As with the NSMutableString, you have two ways to create an NSMutableArray:


    ```

    // Managed memory style

    NSMutableArray *myEditableArray = [[NSMutableArray alloc] initWithWithCapacity:100];

    ```


    ```

    // Autoreleased style

    MutableArray *myEditableArray = [NSMutableArray stringWithCapacity:100];

    ```'
