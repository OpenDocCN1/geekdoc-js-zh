    class with which we not yet worked. An app can access an Internet URL and accumulate
    the data supplied by the server as it arrives. This is how an app can retrieve
    XML data for updates. To initiate connection, you use the NSRURLConnection class.
    If you search the SDK documentation for this class name, you will find the class
