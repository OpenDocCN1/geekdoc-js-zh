    to the Xcode project console window via the NSLog() function, introduced in Chapter
    3. You need to plug that value into the argument of NSLog().


    # NSLog() and String Formats


    Recall that this NSLog() statement put into Workbench was as follows:


    ```

    NSLog("Button was pressed.");

    ```


    The argument is an Objective-C string literal, which begins with the @ symbol,
    followed by the quoted string of characters. But if you want to combine fixed
    text with values stored in or returned by methods, you can use string placeholders,
    or specifiers. A specifier consists of a percent symbol (%) followed by a character
    or symbol indicating the type of data to be sent to the console. If the value
    is an object, the specifier combination is %@ Values to be plugged into the specifier
    after the quoted string, separated by a comma.


    ```

    NSLog("I used to drive a:%@", [myCari getFormattedListing]);

    ```


    Conveniently, you use the same format to display the contents of a wide range
    of object types. That''s because Cocoa Touch object classes include a description
    method, which returns a meaningful string representing the object or its data
    (e.g., the contents of an NSArray). If you need to get a numeric value, however,
    you need some of deeper specifiers, such as %d for an integer value or %f for
    a float value. Chapter 8 dives deeper into formatifiers.'
