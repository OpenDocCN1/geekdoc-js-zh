  md: 'global scope within a class so that any statement in class can freely reference
    (get and set) the value of that variable. Such a variable is defined in the class
    implementation (not the header), and outside of any method definition. It is also
    fairly common practice to signify that a variable is a global by prefixing its
    name with a lowercase "g," as in:


    ```

    int gMasterCounter = 0;

    ```


    But a definition like this in a class has an additional implication: each instance
    of class shares the same variable and its value. In other words, the global scope
    in this case encompasses all instances of the class. Even if you define getter
    and setter instance methods for the class, the methods all read and write the
    same variable. This can lead to immense confusion if you''re not careful. Use
    global variables with extreme caution in class definitions.


    If truly must use a global variable that is accessible across a wide span of code
    in your project—potentially by multiple instances of multiple classes—you can
    define such variables in a centrally located file, and let other files access
    the global as an external variable. Variables are external, so you do nothing
    special when creating them. When you want to get or set that variable in another
    file, you must tell the compiler you want to use an external global variable that
    lives in some other file (wherever it may be):


    ```

    extern int gMasterCounter;

    ```


    If this declaration occurs within a method, the scope of usage remains within
    the method, just like any local variable declaration.


    Of course, in the memory-constrained world of iOS devices, you shouldn''t be carrying
    around huge amounts of data in a global variable of any kind. If your need for
    the information is intermittent, you have the option of saving the data to a file
    (even a temporary file that is deleted when the app terminates), and reading the
    data only when needed.


    # Constant Values


    Following close behind the notion of a variable is that of the constant. Both
    entities reference values, but only a variable''s value can change during its
    lifetime. Once a constant has a value assigned to it, the value becomes read-only.


    JavaScript defines you a true constant as follows:


    ```

    const constantName = foreverValue;

    ```


    The C language offers the identical declaration, although you must also include
    the data type:


    ```

    const dataType constantName = foreverValue;

    ```'
