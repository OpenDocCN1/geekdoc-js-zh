    You don''t truly know what''s inside each of these three frameworks, but having
    an overview of them from 35,000 feet will help you understand how the iOS SDK
    organizes its various powers. You are welcome to expand any of the framework items,
    but the lists of header files might make your head explode until you progress
    further into this chapter. With that, let''s do a quick framework survey.


    # Foundation Framework


    The Foundation framework reveals how much iOS has in common with Mac OS. Both
    environments use the same Foundation framework, although the iOS version trims
    off many items that don''t apply or aren''t supported. Definitions in this framework
    includes basics: strings, various types of data collections, dates, timers, fetching
    data from the network through URLs, and even XML parsing (although not in a DOM-friendly
    manner). The Foundation framework is all about manipulating data, and not displaying
    it. In that sense, you might equate this framework with the core JavaScript language,
    which is designed for use in all kinds of environments, including those outside
    of web browsers.


    # UIKit Framework


    As its name implies, the UIKit framework is all about user interface elements—specifically,
    iOS kinds of user interface elements. This is how the SDK lets you create and
    manipulate buttons, images, scrolling things, text boxes, view bars, alert windows,
    and those neat looking slot-machine-style picker controls. Most of the time you
    will use Interface Builder to lay out user interface elements for a screen, but
    under the hood, the SDK ultimately relies on the UIKit framework definitions for
