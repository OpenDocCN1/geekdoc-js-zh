  md: '# Apple iOS Developer Program


    A prerequisite to submitting a native app to the App Store is an annual paid membership
    to the iOS (formerly iPhone) Developer Program. The current fee is $99.00 per
    year. Membership lets you obtain the necessary digital certificates that permit
    developers to load native apps onto test devices and to upload finished apps to
    the App Store for approval. You also have access to beta versions of the next
    version of iOS SDK software (all under nondisclosure agreements, so you can''t
    blame them).


    In addition to paying the developer program fee, you must also complete a distribution
    contract with Apple. For paid applications, the contract process also requires
    that you establish building relations with Apple. As with app approvals, the time
    required to complete the contract varies depending how busy Apple is. It is not
    something to leave to the last minute, because it can take several weeks to complete,
    even longer for developers operating outside of the United States. Once you pay
    for the iOS Developer Program, you should begin the contract process, even as
    you work on your first native app.


    # Content


    As the gatekeeper of “shelf space” on the App Store, Apple''s approval process
    also imposes restrictions on the content of native apps. Your developers agree
    all the fundamental guidelines, but Apple inspects each app for compliance on
    a case-by-case basis.


    Such is not for web apps. You can serve whatever you want (within the confines
    of your own local laws, of course) because the web app is hosted on your server
    and the device''s owner can freely decide to visit your server or skip it.


    If you are already aware that web apps—indeed any content to be played through
    the Mobile Safari browser—cannot avoid themselves of Flash or Java, you should
    also be aware that native apps don''t get any further with respect to those two
    software platforms. As of this writing, iOS does not natively support either runtime
    environment.


    # Authoring Platform Choices


    You can write HTML, CSS, and JavaScript code with a text editor on any operating
    system platform of virtually any generation. Plain text editing doesn''t require
    a graphical user interface, which is why you can find Unix programmers composing
    code in command-line interface editors, such as Emacs and vi (or variants thereof).
    The key to this flexibility is that conversion to machine code occurs in the web
    browser. Such is not the case for writing native apps.'
