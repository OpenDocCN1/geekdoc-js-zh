  md: '# Preface


    You don''t have to be an Apple fanboy or fangirl give Apple Inc. credit for redefining
    mobile gadgetry and its surrounding industries. First the company used the iPod
    to reshape the music industry and strongly influence how we acquire and consume
    tunes. Just count the number of people wearing iPod-connected earbuds in a subway
    car. Then the iPhone wrote the cellular telephone industry manual, which opening
    the world''s eyes to the potential of being connected to the Internet nearly everywhere,
    all the time. It''s happening again with the iPad, where electronic publishing
    is evolving before our eyes.


    Although the iPhone was an early success with the workable but limited set of
    Apple-supplied applications that come with the phone, programmers couldn''t wait
    to get their hands on the platform. The first word that Apple let drop about third-party
    developers, however, landed with a bit of a thaw: they were graciously allowed
    to create web apps. Store, the iPhone''s WebKit-based browser let creative HTML,
    CSS, and JavaScript create far more than dull pages, but the apps still faced
    frustrating limits compared to Apple''s native apps.


    It took some additional months, but Apple eventually released a genuine software
    development kit (SDK) to allow third-party programmers to create native applications
    for what was then called the iPhone OS. Part of Apple''s task was also creating
    the App Store to distribute apps—yet another industry-transforming effort. Many
    existing Mac X developers rejected because the iPhone OS was derived from Mac
    OS X. The iPhone SDK was based on the same Xcode tools that Mac developers had
    using for some time.


    As a happy iPhone early adopter, I eagerly awaited the iPhone SDK. Unfortunately,
    despite my years of being a dedicated Mac user since 1984 and a scripter since
    1987 and the HyperCard days, I had never done any Mac OS X programming. I didn''t
    know much about C and next to nothing about Objective-C. Still, I thought perhaps
    my years of experience in JavaScript would be of some help. After all, at one
    time I learned enough Java to write a small browser applet to demonstrate JavaScript
    code in a web page that can communicate with the applet. At least I know what
    a compiler did.'
  merge: -1
  pgno: 12
- img_proc: false
  md: 'When the iPhone SDK landed on my Mac, I was simply overwhelmed. The old meta-phor
    of trying to sip from a firehose definitely applied. The more I read Apple''s
    early developer documentation, the more I felt as though I had to know more than
    I knew just to understand the "getting started" texts. With JavaScript being the
    most recent language acquisition for me (albeit back in 1995), I looked for anything
    I could borrow from that experience to iPhone app development. I''d see occasional
    glimpses, but I was basically flying blind, not knowing what to discard and what
    I could keep.


    The SDK was evolving that time as well. I''d read a tutorial here and there, but
    I wasn''t making headway at first. Some tools, especially Interface Builder, felt
    incomplete to me. Frankly, I had a couple of false starts when I walked away until
    a future SDK version appeared. Finally, I reached a point where was "put or shut
    up." After sticking with it and reading many of the documents many times, I was,
    indeed, getting tastes from the firehose. Working on iPhone development as a part-time
    effort over a three-month period, I managed to go from the starting line to submitting
    my first app to the App Store in January 2009.


    Since I''ve been monitoring the developer communities for both the native app
    and web app sides. I ever sat in online courses for web developers to see what
    they''re saying in the chat. A lot of web developers seem to look enviously at
    iPhone and iPad development. I suspect many have gone through the same false starts
    that I did. And yet I know from my own experience that it is possible to make
    the transition from web to native app developer if you know how to channel your
    JavaScript knowledge into what is now as the iOS SDK environment.


    # What You Need to Start


    I have written this book specifically for the web developer who is comfortable
    in the JavaScript language. Even if you use a bit of JavaScript to glue together
    apps from third-party JavaScript libraries and frameworks, you should be ready
    for this book. Unlike most entry-level iOS programming books, this assumes that
    you have not worked in a compiled language before. You probably have little or
    no experience working with C or Objective-C. But you know how a string and array
    are because you use them in your JavaScript work. I will be introducing you to
    the way Objective-C works by comparing and contrasting what you use. It''s the
    kind of handholding that I wish had when I started learning iPhone app development.


    You will get more from this book if you are the adventurous type. By adventurous,
    I mean that you will follow the instructions throughout to try things for yourself.
    Along the way I will help you build an app called Workbench, which will be able
    to play and learn by experimenting with little pieces of code here and there.
    Creating projects, editing files, and building apps is the only way to really
    get to know the SDK.'
  merge: -1
  pgno: 13
- img_proc: false
  md: 'Of course, you''ll need a Macintosh running Mac OS X version 10.6 (Snow Leopard)
    or later. I''ll have more details about getting set up with hardware and SDK software
    in Chapter 2.


    # What’s in This Book


    Perhaps because my programming knowledge has been completely self-taught over
    the decades, this book does not follow what some call traditional programming
    language training. First of all, you already come to the book with specialized
    knowledge. The goal of the book is to pick up that knowledge leaves off and fill
    in the gaps with the new material. There’s no doubt about it that there is a lot
    of new material for you. But I have tried to establish a learning progression
    that will make sense and keep you interested while you learn the decidedly unglorous—but—parts
    of iOS programming.


    Chapter 1 goes into detail about the differences between web and native app programming
    for devices iOS. It is not all roses native development, as you''ll see, but the
    positives outweigh the negatives. In Chapter 2, you''ll install the iOS SDK, inspect
    one of the samples, and run it on the iOS Simulator. In Chapter 3, I put you to
    work to create your first iPhone app—the Benchmark app that you''ll use throughout
    the rest of the book. The steps are intended to help you get comfortable with
    Xcode and learn what it''s like to work on an app in the environment.


    In Chapter 4, you will use the Workbench app to build your first Objective-C object
    and compare the process against the same object in JavaScript. You will spend
    a lot of time in Xcode. And if you used JavaScript frameworks for your app development,
    wait until you get a peek at the frameworks you''ll be using in iOS app development.


    The focus of Chapter 5 is understanding how you write commands iOS to launch your
    app and get it ready for a user to work with. In the process, you will learn a
    great deal about how app works. In, by the end of this chapter, you will add a
    second screen to Workbench and animated switch between the two.


    Sometimes while learning new material, you will have to take your medicine. That
    happens in Chapter 6, where you meet three programming concepts that are foreign
    to what you know from JavaScript: pointers, data typing, and memory management.
    There will be plenty of sample code for you to try in the Workbench app to learn
    these new concepts.


    Objective-C is built atop the C language. There is still a bit of C that you should
    know to be more comfortable in the newer language. Chapter 7 shows what you need
    to know from C. The good news is that a fair amount of it is identical to JavaScript
    Hoay! And most of the esoterica isn''t needed because it''s all covered in more
    robust'
  merge: -1
  pgno: 14
- img_proc: false
  md: 'and flexibly ways in Objective-C, as covered in Chapter 8. There you''ll learn
    how Objective-C handles strings, arrays, and other data collections.


    The final chapter, Chapter 9, is also the longest. It provides a catalog of programming
    tasks you''re accustomed to, but implemented in the iOS SDK. Most of the jobs
    will be familiar to you—formatting numbers, performing data calculations, sorting
    arrays, with user-entered text, using Ajax-like communications with a server,
    and even dragging an item around a scene. I don''t expect you to learn and remember
    everything described in Chapter 9, but know what''s there and how to find it when
    the need arises in your own iOS development.


    Two appendices round out the offering. One provides tips on using the iOS SDK
    documentation to its fullest extent. The other presents a catalog of common Xcode
    compiler errors that beginners encounter and what the errors really mean. Unintelligible
    error messages in the early learning of a new environment can be very frustrating
    and discouraging. Appendix B makes it possible to learn more quickly from newbie
    mistakes.


