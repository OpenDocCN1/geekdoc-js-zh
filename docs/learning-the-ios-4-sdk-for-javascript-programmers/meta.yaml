    # iPhone App Development Design Patterns


    Not only is delegation upon its merits, but the concept is widely adopted across
    numerous iOS frameworks. If your app needs to retrieve updated data from a server,
    you will use a class `NSURLConnection` to initiate the request. Namely, you don''t
    want the app to be locked while you wait for the server to return data (especially
    if the network is slow), so the `NSURLConnection` class can send an asynchronous
    request to the server and wait in the background for a response, it''s data or
    an error occurs. How is your app supposed to know when data has arrived so it
    can work on that? That''s where the delegate model comes in: when it waits and
    receives data, the `NSURLConnection` object sends a series of messages to whichever
    object has been assigned as the delegate (usually the same object that requested
    the request). In that object''s class definition are methods that match the `NSURLConnection`
    messages to act on the incoming data. And the delegate method can then send other
    messages to begin processing and displaying the data in the app.


    Delegation is one of several design patterns associated with iOS programming.
    In object-oriented programming, a design pattern suggests the relationships between
    objects and how objects should work together. Going back to the `NSURLConnection`
    class, your app uses that without any modification; additionally, that class doesn''t
    know or about the specifics of the data. Instead, it just sends a message when
    a significant event occurs (eg., receiving the chunk of data) and lets your app''s
    delegate method perform custom tasks tailored to your specific application. As
    you learn more about the iOS SDK, you''ll be amazed at how many objects send large
    quantities of delegate messages when a user interacts with your app.


    # The Model-View-Controller Design Pattern


    Another design pattern you will hear a lot about called Model-View-Controller—or
    MVC for short. The underlying concept behind MVC is that your program should keep
    data (model) separate from the presentation aspects (view) of the app, and that
    the controller''s code acts as the intermediary between the view and model.'
