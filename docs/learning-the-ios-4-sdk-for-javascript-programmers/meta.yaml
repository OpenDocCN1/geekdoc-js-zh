  md: '| Rule | C | JavaScript |

    |---|---|---|

    | After first letter | Letters, numbers, underscore | Letters, numbers, $, or
    underscore |

    | Keywords prohibited | Yes | Yes |


    The only JavaScript feature you have to give up (if you use it at all) is employing
    the $ symbol in variable names. You should also know that Apple advises against
    using the underscore for the first character of variable names because Apple tends
    to use that style for (noninstance) variables within code it uses to create the
    frameworks. Collisions between your instance variables and the frameworks'' private
    variables might be rare, but it''s best to avoid all possible problems.


    One other convention that Apple recommends is to begin variable names with lowercase
    letters and use CamelCase for multiword names. This helps with readability in
    separating variable names from initial-uppercase class names.


    Another common feature for variable naming is that you cannot use a reserved word
    for a variable name. Although there are many reserved words in common between
    JavaScript and C/Objective-C, the lists are not identical. Table 7-2 shows reserved
    words to avoid for variable names (including parameter variable names in method
    definitions). Most originated in the C language, but Objective-C adds several
    (shown in bold).


