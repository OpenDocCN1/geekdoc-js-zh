    # Methods Than Instance Methods


    You''ve seen that the hyphen signifies an instance method (and declaration in
    the header). In contrast, a plus symbol (+) signifies what is known as a class
    method. Believe it or not, your JavaScript work has probably already put in touch
    with these two types of methods. The JavaScript Date object lets you create a
    date instance, which contains a snapshot of time. That instance features a long
    list of instance methods, which you need to read and set various components of
    the date object instance. But you also have the power to access the Date object
    (with a capital "D") to one of its static methods, UTC(), to obtain the millisecond
    value of a particular date and time. This method is used only by way of the JavaScript
    Date object, as in:


    ```

    var UTCMilliseconds = Date.UTC(2010, 12, 25);

    ```


    Objective-C class methods work the same way as JavaScript static methods, in that
    you send the message to the class rather than to an instance of the class. Definitions
    of class methods start with a plus symbol.


    The job of the getFormattedListing method is to read the values of instance variables,
    insert them into a string, and return the entire string as an NSString type. It
    begins by creating an empty NSString object named result. The second statement
    sends a message to the NSString class (not an instance) to invoke one of its class
    methods to plug the ivars into placeholders within a string (more about formats
    in a moment). This NSString returns a new NSString, which is assigned to result,
    the value returned at the end.


    # Message syntax


