  md: '# CHAPTER 1


    # Why Go Native?


    Those who frequently develop mobile web applications with HTML, CSS, JavaScript,
    and related technologies tend to find a way to reuse those comfortable tools for
    every app challenge. The iOS (formerly iPhone OS) platform has attracted much
    attention in the web developer community, and Apple continues to evangelize web
    app development for the platform.


    At the same time, there''s evidence of a desire among developers to adapt their
    technologies to replicate the leap and feel of native iPhone and iPad apps, whose
    look and feel users you''ve used the built-in apps and other apps downloaded from
    the App Store. Perhaps you''ve used third-party libraries, such as iOi or jTouch,
    to deploy your content and application ideas that they look and behave like native
    iOS apps.


    Despite advances in web technologies—especially the HTML5 and WebKit extensions
    to CSS and Document Object Model (DOM)—an iPhone or iPad web app lacks access
    to several key facilities built into iOS. You must also deal with the Mobile Safari
    browser address bar, especially if your users aren''t experienced enough to generate
    a home screen for your app. Additionally, even though both your iPhone-specific
    styles and scripts target to make the leap, you may still encounter compatibility
    issues with earlier versions of Mobile Safari running on iPhone and iPod touch
    units in the field that have not been updated to the latest OS. For example, I
    saw from server logs that nine months after the release of iOS 3.0, some of my
    native iPhone apps continued to use iOS 2.2, especially with iPod touch devices
    (most of whose users had to pay for major upgrades).


    In other words, the choice to reach iPhone and iPad through web applications,
    which were supposed to simplify development, introduces its set of complicaciones.
    Maybe''s time to make the leap and start developing native iOS apps. This chapter
    highlights iOS features you can use if you choose to develop native apps—features
    that are not available to web-only apps. Even if your app designs don''t require
    a lot of native OS support, a native app still has advantages over web apps. To
    provide a fair and balanced picture, I will also discuss what you lose by using
    a native app over a web app.'
