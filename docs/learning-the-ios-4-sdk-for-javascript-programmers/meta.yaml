    # Adding a Class Without Subclassing—Categories


    Objective-C 2.0 in the iOS SDK provides a mechanism called categories, which allows
    you to add methods (not instance variables) to an existing class without creating
    a subclass of that existing class. This will remind you of the JavaScript prototype
    property of an object to extend that object''s capabilities so that all instances
    of that object gain the new capabilities. In fact, you can use categories in Objective-C
    to add customized methods to classes if you like, including NSString. Then all
    NSString instances will have the customized methods available to them. Using a
    category, rather than subclassing, is the preferred approach to extend the functionality
    of a Cocoa framework with new (i.e., not overridden) methods.


    Defining a category is fairly easy, as of version 3.2.5 of Xcode, the IDE doesn''t
    provide a template for the necessary header and implementation files (or). Instead,
