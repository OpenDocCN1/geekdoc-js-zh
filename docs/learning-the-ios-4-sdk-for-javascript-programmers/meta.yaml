    # Inheritance


    Inheritance simply means that a newly defined class automatically gets all of
    the characteristics and behaviors of an existing class, and adds one or more items
    that make the new class something different. The new class is called a subclass,
    while the existing class from which the subclass gets its fundamentals is its
    superclass. The “child” and “parent” conceptual relationship also fits, but these
    terms aren’t prevalent in Objective-C language.


    Before you get all up to the top of inheritance, bear in mind that DOM scripting
    has already warmed you up to the concept. If you were to examine the W3C standards
    document for the DOM, you would see that the DOM’s structure is entirely object-oriented
    underneath, relying on relationships between superclasses and subclasses. For
    example, the most basic object in the DOM structure is the Node. Every instance
    of a Node has a list of attributes (more commonly properties when being scripted)
    and methods that are defined for the Node. Attributes for a node include nodeName,
    nodeValue, nodeType, firstChild, and so on; methods include appendChild(), removeChild(),
    cloneNode(), and others. A Node in its pure form is not specified in an'
  merge: -1
  pgno: 80
- img_proc: false
  md: 'HTML document or rendered in a browser: it is merely the basic building block
    used to define more concrete “things” in a document.


    That brings us to the DOM Element object, which inherits directly from the Node
    object. Thus, an Element object has the same attributes and methods of a node,
    plus special members that apply to any kind of element, such as the getAttribute(),
    setAttribute(), and getElementsByName() methods. All of these are defined in the
    DOM core module.


    In the DOM module dedicated to HTML come definitions for objects more closely
    related to the items you put into HTML documents. One of the building blocks is
    the HTMLElement. It inherits all members of the Element and (in turn) Node objects,
    plus acquires additional attributes that apply to all HTML elements, such as the
    id, title, and className properties. Going one step further, the HTMLImage (represented
    in HTML by the <img> tag). It inherits everything from the HTMLElement and adds
    further attributes that apply to its purpose of loading and displaying images—properties
    such as src, height, width, and alt. It is only by virtue of the inheritance chain
    from HTMLInputElement upward toward HTMLElement, Element, and Node—that an HTMLImage
    element has a nodeName property.


    # @interface compiler directive


    The identical object-oriented notion of inheritance works in Objective-C and many
    Cocoa Touch classes. When you name a class of your own (remember the initial capital
    letter convention!), you must specify from what class your new class inherits
    in the following format:


    ```

    @interface NewSubClass : SuperClass

    ```


    Statements beginning with the @ are called compiler directives. In other words,
    they are commands to the compiler as it processes the file. The @interface directive
    tells the compiler that this section contains declarations of the variables and
    methods that will be fleshed out in the companion @implementation section. The
    compiler needs to know the name of the class: ViewController here. But to be an
    Objective-C class that will also be part of Cocoa Touch classes (like arrays and
    strings), custom class need far more infrastructure than what you’ll defining
    in the class files. This infrastructure comes from inheriting the characteristics
    of an existing object. Because the ViewController class is a very simple class
    that just the base essentials, it will inherit from the most fundamental class
    in the Foundation framework: NSObject. As you will glean over time, most of the
    objects you work with from the Foundation, UIKit, and other frameworks inherit
    from NSObject, which assumes the role as the base class.


    When you read instructions by other programmers tell you to create a subclass
    of some other class, the @interface section begins as above, with the name of
    the class you’re creating, a colon, and the name of the superclass. The superclass,
    in turn, must belong to the framework (or other header file) imported via the
    #import directive earlier in the header.'
