  md: 'The scope situation becomes a bit more complex in C and Objective-C because
    programs usually consist of multiple files, many of which are capable of generating
    object instances that are intended to encapsulate their data (with the help of
    instance variables).


    # Instance Variables


    An variable defined in a class header file is visible to all statements and methods
    defined in the same class. It is not global as "global" for the entire application
    code," but certainly for all code in the same class. If you create a subclass,
    the subclass inherits the instance variable, which is thereafter accessible to
    methods defined in the subclass.


    It''s important to remember from your JavaScript object creation experience that
    an instance variable has scope only within its single instance. If you define
    two instances of the same class, each instance maintains separate values for its
    instance variables without colliding with another instance. You saw that in Chapter
    4, where two instances maintained distinct values for their variables—each with
    specifications for a different vehicle.


    In Chapter 8, you will learn how to turn instance variables into Objective-C properties.
    A property has the same scope as an instance variable.


    # Local Variables


    As with JavaScript, a C/Objective-C variable declared within a method has scope
    only within the method. You must exercise the same care in avoiding the accidental
    reuse of an instance variable as a local variable (or method parameter variable).
    If you try to use the same variable name in both spots, the compiler will alert
    you to the potential problem when you build the app: the compiler declares that
    the local variable "hides" the instance variable.


    Parameter variables are treated just like local variables (as they are in JavaScript).
    For example, if your app displays a UIPicker (the interface element with the slot-machine-spanners),
    you need to implement a delegate method that responds to a user selection. Checking
    the UIPickerDelegate class reference, you find the type of desired methods as
    follows:


    ```

    (void)pickerView:(UIPickerView *)pickerView

    dSelectRow:(NSInteger)row

    Component:(NSInteger)component

    ```


    This method has three parameter variables. Although the parameter variables are
    named here merely as suggestions, you can use names as-is if you are using this
    method. You can minimize the possibility of collisions with instance variables
    for the class by being more verbose or explicit in naming your custom instance
    variables.'
