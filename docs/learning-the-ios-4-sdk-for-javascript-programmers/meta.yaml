  md: '# Objective-C Data Types


    The first batch of Objective-C data types you need to know are numeric (and come
    from C). You are probably familiar with the distinction between integers and floating-point
    numbers from your exposure to JavaScript’s parseInt() and parseFloat() global
    functions. These functions convert string versions of numbers to actual values
    for all kinds of math operations. An integer is a whole number (positive, negative,
    or zero) without any decimal places; a floating-point number can have a decimal
    to the right designate values between integers. Objective-C has many additional
    numeric data types, the differences between them concern themselves with precision
    and the size of memory reserved for these values.


    Table 6-1 lists the three data types (also called scalar types) you will encounter
    most frequently in iOS SDK development.


    Table 6-1. Common basic data types


    | Data type designation | Value |

    |--- |--- |

    | int | Integer between -2147483648 and 2147483647 |

    | float | Floating-point number between 1.17549435e-308 and 3.4082347e+38 |

    | double | Floating-point number between 2.225073885072014e-308 and 1.79691348623157e+38
    |


    The C language defines other basic data types, all of which are used directly
    in the Objective-C world of the iOS SDK. But for the most part, you will be using
    the library of Cocoa and Touch data types in their place.


    > Objective-C floats from the same type of floating-point errors that JavaScript
    float values do. When performing arithmetic on floats if deep precision is needed;
    consider using double instead. For the most part, however, you will use floats
    to satisfy values of fairly shallow precision as arguments to methods.


    # Cocoa Touch Data Types


    You can divide Cocoa-based data types into two broad categories. The first includes
    data types for fundamental values used by many classes and functions; the other
    contains the enormous range of classes defined throughout the Foundation, UIKit,
    and other frameworks that you import into your project.


    Two of the most common basic Cocoa data types are the CGRect (plus its component
    data types) and NSRange. The "CG" stands for Core Graphics. CGRect values assist
    you with the creation and layout of rectangular objects (mostly views) on the
    screen. A CGRect is a language structure (the coordinate of the top-left corner
    of the rectangle) and the size (width and height)—everything a need to know with
    respect to its placement and dimensions. Figure 6-7 illustrates the components
    of a CGRect within'
