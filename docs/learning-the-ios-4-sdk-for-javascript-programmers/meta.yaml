    \ while using the iOS SDK documentation, or if you need to create a small array\
    \ of values for graphics methods argument.\n\nThe typing situation in creating\
    \ a new array may seem odd at first, because the data type you declare is the\
    \ data type of the elements of the array—which means that all elements of a C\
    \ array must be of the same type. For example, if you wanted to generate an array\
    \ that is hold up to 10 integers, the declaration would be:\n\n```\nint myArray[10];\n\
    ```\n\nFrom here you can assign values by referencing spots in the array through\
    \ array indices (zero-based), similar to how you do it in JavaScript:\n\n```\n\
    myArray[0] = 10;\nmyArray[1] = 20;\n...\nmyArray[9] = 100;\n```\n\nAlthough JavaScript\
    \ would merrily let you add more items to the array by continuing to use higher\
    \ and higher index numbers, a C array maxes out at the number of elements specified\
    \ in its declaration. You are free to iterate through arrays in for loops, obtaining\
    \ the number of elements in a C array for the conditional expression in for construction\
    \ takes a little extra work (there is no simple equivalent to the JavaScript length\
