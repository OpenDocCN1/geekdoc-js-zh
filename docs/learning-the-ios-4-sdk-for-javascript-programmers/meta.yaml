- img_proc: false
  md: 'One significant advantage of adopting MVC is that model objects are completely
    disconnected from the presentation of their data. As your app evolves, the details
    of the view change—colors, order of property values, font characteristics—but
    the model doesn''t have to change at all. It''s very much like the HTML tagging
    defines a single structure of a document, but different CSS specs can turn the
    same content into something that looks quite different (well demonstrated in the
    CSS Zen website at http://csszengarden.com).


    # Other Design Patterns


    Design patterns are not mutually exclusive. An environment can employ multiple
    design patterns at the same time if they don''t collide with each other. The iOS
    SDK identifies total of four design patterns in its bag of tricks. Delegation
    and MVC are two that we''ve already discussed. Notice how delegation confines
    itself to the realm of passing messages among objects, while MVC addresses a global
    structure of an application. The other two design patterns are known as target-action
    and the managed memory model.


    Graphical interfaces—including modern web browsers and iOS apps—almost always
    have an event (or run) loop underneath the hood. The loop constantly monitors
    activity in the user interface and contains instructions on how to execute when
    an event of a particular type as user interface element occurs. In DOM scripting,
    you assign an event handler to an HTML element for a particular type, such as
    when the user releases the mouse button above a screen. In an iOS app, an on-screen
    control (e.g., a button) in a view can be wired to send a message to the controller
    for when a particular event type occurs (e.g., dragging a finger on the screen).
    The receiver of that message (the view controller) is known as the target for
    the event, and the message is the name of the button to run when the event fires.
    You saw how we made assignment for the button in Workbench through Interface Builder.
    After creating the runCode: method in the view controller class (defined with
    an IBAction return value), you used Interface Builder to send the button to the
    view controller when a Touch Up Inside event occurs. That is the example of target-action
    pattern.


    The last design pattern, memory management concerns itself with how applications
    use and free memory in operation. Chapter 6 goes into more detail about memory
    usage, and this concept is something JavaScript programmers don''t have to worry
    about (JavaScript engines clean up after themselves automatically). For now, be
    aware that due to the limited amount of memory available to apps on the iPhone
    and iPad, you will have to be very conscious about how much is used and whether
    any memory space fails to be released when it is no longer needed. Ignoring these
    fine points can lead to crashes, where the app quits unceremoniously and returns
    to the home screen.'
