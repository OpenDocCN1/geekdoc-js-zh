    \ by the array. If you divide the total bytes of an array by the bytes of one\
    \ element, you have calculated the array length. Other than that, looping through\
    \ an array and using the loop counting variable as an array index inside the square\
    \ brackets would look like this:\n\n```\nint arrayLength = sizeof(myArray)/sizeof(myArray[0]);\n\
    for (int i = 0; i < arrayLength; i++) {\n    // do something with myArray[i]\n\
    }\n```"
