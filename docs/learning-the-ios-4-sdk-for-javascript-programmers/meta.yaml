  md: '# Pointers


    Many code examples thus far in this book have used pointers, but you may not yet
    fully understand what a pointer is, how it differs from a regular variable, and
    when or if you should use pointers for variables, method return values, and method
    arguments. JavaScript, like most interpreted languages, does not use pointers,
    so the concept may be foreign to you.


    # Pointers and Memory


    To begin the exploration of pointers, it helps to have a visualization of what
    computer memory is and how programs use it. Although there are many types of memory,
    the kind we are concerned with is traditionally called random access memory, or
    RAM for short. Some types of RAM preserve their contents when in use, while others
    empty everything when power is removed. For our discussion, RAM is RAM, regardless
    of what happens to the lights go.


    Memory is divided into tiny spaces. Imagine a gigantic with billions of identically
    sized cubholes in it. Each cubhole can hold one small chunk of information. While
    a program runs, it uses the cubholes to temporarily store information. Various
    kinds of information require differently sized blocks of cubholes data—a short
    string of text characters very little space, while a two-megapixel image occupies
    a lot of cubholes, as represented in Figure 6-1.


    Keeping track of where a new chunk of information goes is one of the central processing
    unit, or CPU, of the device. The program (deep, deep down and with the help of
    the operating system) asks the CPU for a place to store information of a particular;
    the CPU locates an unused block of cubbies, and stores the data in those cubbies.
    Of course, the program will likely need to retrieve and/or change information
    over time, so the program needs to know where to get it (or, more precisely, where
    to tell the CPU to get it).


    Helping this system along is a convention that assigns a numeric address to each
    cubhole. The numbers are all sequential, so if a 50-chunk block of data is stored
    in cubholes starting at number 100, the block of data occupies addresses 100 through
    149. When the program declares that it''s going to store data, the CPU not only
    locates space and moves the data into those cubholes, but the CPU also reports
    back to the address of the first cubhole. That address—a numeric value—is the
    pointer to the data. Later, when the program wants to pass the data to another
    function or object, it doesn''t have to move or copy all of that data from memory
    to transfer it to another operation. Instead, the program passes only the pointer
    to the perfect copy of the data that exists in memory, demonstrated in Figure
    6-2. The actual image, myImage, is at location 2,419,920. Another word of memory
    holds the value 2,419,920, and this word is labeled *myImage (with the preceding
    star) because the program is defining a pointer here.'
