    # What You Lose


    By large, the full iOS SDK feature offers your app designs far more flexibility
    and the ability to recreate the full range of user interface features you Apple’s
    own apps and apps developed by third parties. But there are costs—in monetary
    and toll currencies—to obtain native app powers.


    Except for apps designed for in-house corporate use, native apps that run on nonmodified
    devices—i.g., iPhones and iPads that have not been jailbroken (hacked to allow
    unapproved third-party apps)—must be distributed via the iTunes App Store. This
    is both a blessing and, for some, a couple for several reasons.


    # About Jailbreaking


    When the first-generation iPhone landed in developers’ hands in 2007, a few programmers
    were put off by the lack of a publicly available development environment for applications.
    Apple granted itself the power to build native apps included with the phone, but
    the developer community was shunted to the web app world—with a Mobile Safari
    version boasting app-friendly features that today’s HTML5-powered model. Some
    adventurous programmers, however, found ways to access the same interior programming
    functionality that Apple’s engineers had and opened up native programming to third
    parties. Having pierced through Apple’s restrictions, they called jailbreak. To
    run one of these independent apps, an iPhone user had to “jailbreak” the device
    using a software-run process that grew easier and easier over time as jailbreaking
    tools improved.


    Several months after the iPhone debut—and perhaps by the encroaching jailbreak
    programming efforts—Apple released the iPhone SDK to allow third parties to write
    native apps, but only with documented routines. Restriction still ranks developers,
    so jailbreaking is still alive, even as Apple continues more internal routines
    to all developers. Jailbroken devices reportedly account for as much as 10% of
    the world’s iPhone and iPad population (a higher percentage of active bloggers,
    who make jailbreaking seem more prevalent than it is). Although


    6 | Chapter 1: Why Go Native?'
  merge: -1
  pgno: 23
- img_proc: false
  md: 'jailbroken devices can still download apps from Apple''s App Store, a separate
    store, called Cydia Store, offers apps designed for jailbroken iPhones and iPads.


    Some programmers believe it is almost an obligation to jailbreak their devices,
    lest they appear captive to the world of Steve Jobs. I personally prefer not to
    jailbreak my devices, for practical, rather than ideological, reasons: I want
    to know that when I test my App Store apps, the devices are working like the ones
    owned by 90% or more of my potential customer base. The ultimate choice, however,
    is yours.


    # Distribution


    On the one hand, since the App Store is a single point of distribution, users
    of unhacked iPhone, iPod touch, and iPad devices go to the App Store in search
    of apps that will help them scratch an itch. While you may have to choose your
    app''s keywords carefully to help potential users search for your product, at
    least you don''t have to pay search engine optimization to get your app high in
    search results.


    On the other hand, the App Store becomes the one-and-only gatekeeper between your
    app and the consuming public. You must submit your finished app for approval before
    it appears in the store. Approval times can vary widely, without explanation.
    Sometimes it is a matter of a couple of days; other times it takes weeks. The
    same is true for updating existing apps. If you need an update to fix a bug, the
    approval time can be as long—and, inexplicably, sometimes longer—to get that maintenance
    release out to the world. You can apply for an emergency update to hasten the
    approval, but if you abuse that privilege, you risk upsetting the gatekeepers.


    # App Updates


    Speaking of updates, the web app scenario is far superior to the App Store native
    app. You instantly deploy an update to the server that hosts the web app whenever
    you want, as often as you want. This encourages app developers to issue frequent
    updates rather than storing up files to submit to the App Store in less-frequent
    batches.


    If your apps are more content-oriented, you can pass along updates to a native
    app in a couple of ways. I described earlier how I use HTML to supply my native
    apps with new updates. Similarly, updated material can be supplied in other formats
    (e.g., property list files), a native app can read whenever whenever launches.
    Users can save newly acquired material to the device so that it is available to
    the app even if the device is not connected to the Internet the next time the
    app launches. Implementing this approach to updating an app takes a bit of advance
    planning, so it is well worth exploring the possibility early in the design phases
    of any iOS app.


    What You Lose | 7'
