    \  alert(\"show a sample\");\n}\n\ntest ();\n</script>\n```\n\n(Output: show a\
    \ sample)"
  merge: -1
  pgno: 30
- img_proc: true
  md: '# **Explanation:**


    “function test() { }” is a declaration of test() function.


