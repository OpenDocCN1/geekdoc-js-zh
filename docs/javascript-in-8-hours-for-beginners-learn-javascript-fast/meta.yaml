- md: "\n## Example:\n\n```\nvar num = 9.5;\ndocument.write ( “Ceiling number is”+Math.ceil(\
    \ num ) ); document.write (\n“Flooring number is”+Math.floor( num ) ); ( Output:\
    \ Ceiling number is 10.0\nFlooring number is 9.0 )\n```\n\n## Explanation:\n\n\
    “Math.ceil( num ));” returns an integer that is greater than or equal to 9.5,\
    \ the result is 10.0.\n\n“Math.floor( num );” returns an integer that is less\
    \ than or equal to 9.5, the result is 9.0.\n\n## Max () & Min ()\n\n```\nMath.max();\n\
    Math.min();\n```\n\n“Math.max()” returns the greater one between two numbers.\n\
    “Math.min()” returns the less one between two numbers.\n\n## Example:\n\n```\n\
    var x = 100;\n\nvar y = 200;\n\ndocument.write(\"Greater number is\"+Math.max(x,\
    \ y) );document.write(\"Less number is\"+Math.min(x, y) ); ( Output: Greater number\
    \ is 200\n\nLess number is 100\n```\n\n## Explanation:\n\n“Math.max(x, y)” returns\
    \ the greater number between 100 and 200, the result is 200.\n\n“Math.min(x, y)”\
    \ returns the less number between 100 and 200, the result is 100.\n\n## Math.PI\
    \ & random( )\n\n| Math.PI |\n| Math.random() |\n\nMath.PI is a constant that\
    \ stores the value of pi.\n\nMath.random( ) generates a number between 0.0 to\
    \ 1.0.\n\n## Example:\n\n```javascript\nvar pi = Math.PI; var ran = Math.random();\n\
    document.write(\"The PI value is\" + pi);\ndocument.write(\"The random number\
    \ is\" + ran);\n\n( Output: The PI value is 3.1415926535889793\nThe random number\
    \ is 0.16869328)\n```\n\n## **Explanation:**\n\nThe value of Math.PI is 3.1415926535389793.\n\
    \nMath.random( ) generates a random number between 0.0 to 1.0, in here the result\
    \ is 0.16869328.\n\n## Date & Time\n\nJavaScript often use date and time to design\
    \ the web page. When using date and time, you must create an object of date first.\n\
    \n```\nvar DateObject = new Date( )\n```\n\n“new Date( )” can create an object\
    \ of date.\n\n## Example:\n\n```\nvar DateObject = new Date( ); alert ( DateObject\
    \ );\n```\n\n( Output: Sun Apr 12 12:23 UTC 2015 )\n```\n\n## **Explanation:**\n\
    \n“var DateObject = new Date()” creates an object of date.\n\n“alert ( DateObject\
    \ )” displays the current date and time.\n\nNote that: To create an object of\
    \ date, you can use other variable name, for instance: var now=new Date(); var\
    \ TimeObjcet = new Date();\n\n## Date, Month, Year, Day\n\nThe Date Object has\
    \ following method:\n\n| getDate() | get the date |\n| getMonth() | get the month\
    \ |\n| getYear() | get the year |\n| getDay() | get the day |\n\nNote that “getDay(\
    \ )” returns from 0 (Sunday) to 6 (Saturday).\n“getMonth( )” returns from 0 (January)\
    \ to 11 (December).\n\n## Example:\n\n```\nvar now = new Date ( );\nvar y = now.getYear();\n\
    var d = now.getDate();\nalert ( y + \" \" + d );\n( Output: 2015 12 )\n```\n\n\
    ## **Explanation:**\n\n“now.getYear()” returns the current year.\n\n“now.getDate()”\
    \ returns the current date.\n\n## Hours, Minutes, Seconds\n\nThe Date Object has\
    \ following method:\n\n| getHours() | get the hours |\n| getMinutes() | get the\
    \ minutes |\n| getSeconds() | get the seconds |\n| getTime() | get the time |\n\
    \nNote that getTime( ) returns a number from January 1, 1970 to current time.\n\
    \n## Example:\n\n```\nvar now = new Date( );\nvar h = now.getHours(); var m =\
    \ now.getMinutes( );\nvar s = now.getSeconds(); alert (\"Current time is\" + h\
    \ + \":\" + m + \":\" + s ); (\nOutput: Current time is 19:30:28 )\n```\n\n##\
    \ **Explanation:**\n\n“getHours” returns the current hours.\n\n“getMinutes” returns\
    \ the current minutes.\n\n“getSeconds” returns the current seconds.\n\n## Different\
    \ Time\n\n```\ngetUTCHours( )\ngetTimezoneOffset( )\n```\n\n“getUTCHours() ” returns\
    \ the Greenwich Time.\n“getTimezoneOffset() ” returns the time difference between\
    \ UTC time and local time. For example, if your time is GMT+2, -120 will be returned.\n\
    \n## Example:\n\n```\nvar now = new Date();\nvar utc = now.getUTCHours();\nvar\
    \ timezone = now.getTimezoneOffset();\nalert ( utc + timezone );\n( Output: 16:20:-120\
    \ )\n```\n\n## Explanation:\n\n“getUTCHours()” returns the UTC time.\n\n“getTimezoneOffset”\
    \ returns a number. For instance, 300 means Eastern Time, 360 means Central Time,\
    \ 420 means Mountain Time, 480 means Pacific Time.\n\n## Set Date & Time\n\nThe\
    \ Date Object has following method:\n\n| setFullYear() | set the year |\n| setMonth()\
    \ | set the month |\n| setDate() | set the date |\n| setHours() | set the hours\
    \ |\n| setMinutes() | set the minutes |\n| setSeconds() | set the seconds |\n\n\
    Note: Please use setFullYear() instead of setYear().\n\n## Example:\n\n```\nvar\
    \ now = new Date();\nm=now.setMonth( 0 ); d = now.setDate( 18 );\ny = now.setFullYear(\
    \ 2015 );\ndocument.write ( m + d + y );\n( Output: January 2015 )\n```\n\n##\
    \ Explanation:\n\n“setMonth(0), setDate(18) and setFullYear(2015) set the month,\
    \ date and year respectively.\n\n## Timer Function\n\n```\nwindow.setTimeout(\
    \ )\n```\n\n“window.setTimeout()” can set interval to perform an action repeatedly.\n\
    \n## Example:\n\n```\nfunction autoTimer( ) // user-defined function\n{\nalert\
    \ ( \"Be Careful!\" );\nwindow.setTimeout(\"autoTimer\", 1000);\n}\n```\n\n( Output:\
    \ Be careful!)\n\n## **Explanation:**\n\nwindow.setTimeout( “autoTimer”, 1000\
    \ ) has two arguments:\n\n“autoTimer()” calls the function “automer()”, which\
    \ is a user-defined function.\n“1000” represents milliseconds, which sets every\
    \ 1000 milliseconds for autoTimer() to call function. Alert “Be Careful!” displays\
    \ every seconds.\n\n## String\n\n String length\n\n```\nstring.length\n```\n\n\
    “string.length” can calculate the string length.\n\n## Example:\n\n```\n<script\
    \ type=\"text/javascript\">\nvar mystring = \"I love JavaScript\";\nvar stringsize\
    \ = mystring.length; document.write(\"String length is \" + stringsize);\n</script>\n\
    ```\n\n( Output: String length is 17 )\n\n## **Explanation:**\n\n“mystring.length”\
    \ returns the length of mystring, including spaces.\n\n## Join Strings\n\n```\n\
    string1 + string2 + string3 + string4 + string......\n```\n\nThe “+ operator is\
    \ used to join strings together.\n\n## Example:\n\n```\n<script type=\"text/javascript\"\
    >\nvar string1 = \"JavaScript\";\nvar string2 = \"is\";\nvar string3 = \"very\
    \ easy\";\nalert ( string1 + string2 + string3 ); </script>\n```\n\n( Output:\
    \ JavaScript is very easy )\n\n## Explanation:\n\n“string1 + string2 + string3”\
    \ uses “+ to concatenate strings together.\n\n## Search a Character\n\n```\nstring.charAt()\n\
    ```\n\n\"string.charAt( number )\" is used to find a character at a string.\n\
    Argument \"number\" is index of the string, beginning with 0.\n\n## Example:\n\
    \n```\nvar mystring = \"JavaScript is easy\";\n```\n\n```\nvar charac = mystring.charAt\
