  md: '# Example:


    ```

    <script type = "text/javascript">

    var abcde;

    var abc888;

    var my_variable;

    <script>

    ```'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# **Explanation:**


    abcde, abc888 and my_variable are all variables.


    They can store some value. *e.g.*


    ```

    var abcde=100;

    ```


    ```

    var abc888="Hello World";

    ```


    ```

    var my_variable=true;

    ```


    Notice that variable naming cannot start with number, cannot have space. *e.g.*\n“23var”,
    “abc de” are invalid variable name.


    But “var23”, “abcde” are valid variable name.'
