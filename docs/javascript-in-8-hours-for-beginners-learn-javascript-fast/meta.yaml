    ## 对象


    ## 对象声明


    对象指的是一个具体的某物。例如：汽车、书、狗、房子等……


    ```javascript

    obj = new Object();

    obj.property;

    ```


    "obj = new Object()"创建了一个名为"obj"的新对象。

    "obj.property"意味着对象的属性。


    ## 示例：


    ```javascript

    house = new Object ();

    house.color = "white"; house.size = "big";

    document.write("House color: " + house.color + "\n");

    document.write("House size: " + house.size + "\n");

    ```

    ( 输出: House color: white House size: big )


    ## 解释：


    “house=new Object()”创建了名为“house”的对象。


    “house.color”意味着房子的颜色。


    “house.size”意味着房子的尺寸。


    ## 页面导航


    ```javascript

    windows.history.back( );

    windows.history.forward( );

    ```


    “back()”用于导航到上一页。


    “forward()”用于导航到下一页。


    **示例：**


    ```javascript

    windows.history.back();

    ```

    ( 输出: Previous page. )

    ```javascript

    windows.history.forward( );

    ```

    ( 输出: Next page. )

    ```


    ## 解释：


    “back()”回到上一页。


    “forward()”前往下一页。


    “window.history.method()”用于导航到指定的页面。该方法通常由页面上的按钮调用，将在稍后文中提到。


    ## 跳转到指定页面


    ```javascript

    window.history.go( number );

    ```


    “window.history.go( number)”可以跳转到指定的页面。


    **示例：**


    ```javascript

    window.history.go(1);

    ```

    ( 输出: Next page. )

    ```javascript

    window.history.go( -1 );

    ```

    ( 输出: Previous page. )

    ```javascript

    window.history.go( 0 );

    ```


    ## 解释：


    “window.history.go( number)”可以跳转到指定的页面。该方法通常由页面上的按钮调用，将在稍后文中提到。


    ## 打开窗口


    ```javascript

    window.open( name, width, height );

    ```


    “window.open”可以打开一个窗口。


    “name”指定窗口的名称。


    “width”指定窗口的宽度。


    “height”指定窗口的高度。


    ## 示例：


    ```javascript

    window.open("myWindow", "width=500,height=600");

    ```


    ## 解释：


    “window.open”可以打开一个窗口。


    “name”指定窗口的名称。


    “width”指定窗口的宽度。


    “height”指定窗口的高度。


