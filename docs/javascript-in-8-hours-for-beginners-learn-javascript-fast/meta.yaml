    \n“house=new Object()” creates object name “house”.\n\n“house.color” means house’s\
    \ color.\n\n“house.size” means house’s size.\n\n## Navigate Page\n\n```javascript\n\
    windows.history.back( );\nwindows.history.forward( );\n```\n\n“back()” is used\
    \ to navigate the previous page.\n\n“forward()” is used to navigate the next page.\n\
    \n**Example:**\n\n```javascript\nwindows.history.back();\n```\n( Output: Previous\
