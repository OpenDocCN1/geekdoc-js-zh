    ## 提取字符串


    ```

    string.substr( start, length );

    ```


    “substr( start, length)”可以从字符串中提取一个子字符串。


    “start”参数指定提取的起始位置。


    “length”参数指定子字符串的长度。


    **示例：**


    ```javascript

    var mystring = "JavaScript is easy.";

    var sub = mystring.substr( 4, 6 ); alert ( sub );

    ```

    ( 输出: Script )


    ## 解释：


    “mystring.substr( 4, 6 )”从 mystring 中提取一个子字符串。

    “( 4, 6 )”指定子字符串的起始位置为 4，长度为 6。

    注意字符串索引从零开始。


    ## 将数字转换为字符串


    ```

    number.toString();

    ```


    为了满足 JS 编程的需求，有时需要将数字转换为字符串数据类型。


    “number.toString()”可以将数字转换为字符串。


    ## 示例：


    ```javascript

    var num1 = 12; var num2 = 68;

    var str1 = num1.toString(); var str2 = num2.toString(); var sum = str1 + str2;

    document.write( sum );

    ```

    ( 输出: 1268 )


    ## 解释：


    “num1.toString( )”和“num2.toString() ”将两个数字转换为字符串数据类型。因此，str1 加上 str2 的结果是 1268，而不是
    80。


    ## 将字符串转换为数字


    ```javascript

    parseInt(string);

    parseFloat(string);

    ```


    “parseInt(string)”和 parseFloat(string)可以将字符串转换为整数或浮点数。


    ## 示例：


    ```javascript

    var str1 = "12"; var str2 = "68";

    var sum = str1 + str2;

    alert ( sum );

    ( 输出: 1268 )

    var num1 = parseInt(str1 );

    var num2 = parseInt(str2);

    var addition = num1 + num2;

    alert ( addition );

    ( 输出: 80 )

    ```


    ## 解释：


    “parseInt( str1)”和“parseInt( str2 )”将两个字符串转换为数字数据类型。因此，num1 加上 num2 的结果是 80，而不是
    1268。


    ## 搜索特定文本 (1)


    ```javascript

    indexOf()

    ```


    “indexOf()”可以找到特定文本在字符串中首次出现的位置。


    **示例：**


    ```javascript

    var mystring = "Please find where find word occurs!"; var place = mystring.indexOf("find");

    alert ( place );

    ```

    ( 输出: 7)


    ## 解释：


    “mystring.indexOf( “find” )”返回“find”在 mystring 中第一次出现的位置。输出为 7。


    字符索引从零开始。


    如果在字符串中未找到该文本，indexOf( )返回 -1。


    ## 搜索特定文本 (2)


    ```javascript

    lastIndexOf( )

    ```


    “lastIndexOf()”可以找到特定文本在字符串中最后一次出现的位置。


    ## 示例：


    ```javascript

    var mystring = "Please find where find word occurs!"; var place = mystring.lastIndexOf("find");

    alert ( place );

    ```

    ( 输出: 18 )


    ## 解释：


    “mystring.lastIndexOf( "find" )”返回“find”在 mystring 中最后一次出现的位置。输出为 18。


    字符索引从零开始。


    如果在字符串中未找到该文本，indexOf( )返回 -1。


