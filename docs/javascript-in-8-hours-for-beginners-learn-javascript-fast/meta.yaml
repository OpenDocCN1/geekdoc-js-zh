    window.history.go( -1 );\n```\n( Output: Previous page. )\n```javascript\nwindow.history.go(\
    \ 0 );\n```\n( Output: Reload current page. )\n```\n\n## Explanation:\n\n“window.history.method()”\
    \ is used to navigate the specified page. This method is usually called by a button\
    \ on page, which will be mentioned in later.\n\n## Open Customized Window\n\n\
    ```javascript\nwindow.open( name, width, height, status, menubar )\n```\n\n“window.open”\
    \ can open a new window.\n\n“name” argument means new window’s name.\n\n“width”\
    \ argument means new window’s width.\n\n“height” argument means new window’s height.\n\
    \n“status” argument defines window’s status bar.\n\n“menubar” argument defines\
