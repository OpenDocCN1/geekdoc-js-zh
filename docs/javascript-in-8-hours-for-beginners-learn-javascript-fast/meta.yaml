  md: '# **Explanation:**


    When test(“display a sample”) call the function test(var arg){...}, it will pass
    the “display a sample” to var arg. After var arg has received the data, it will
    pass the data inside the function. alert ( arg ) will use the data, and then outputs
    “display a sample”.'
