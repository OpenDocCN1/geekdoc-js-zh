- md: "\n## Example:\n\n```javascript\n<script type=\"text/javascript\">\nfunction\
    \ test() {\n  alert(\"show a sample\");\n}\n\ntest ();\n</script>\n```\n\n(Output:\
    \ show a sample)\n\n## **Explanation:**\n\n“function test() { }” is a declaration\
    \ of test() function.\n\n“test()” is a command to call a function named test(){\
    \ }.\n\nWhen running the function test (), it will output “show a sample”.\n\n\
    ## Function with Arguments\n\nA function can have one or more arguments inside\
    \ the bracket. Arguments are used to pass data to function.\n\n```javascript\n\
    function function-name ( var arg ) {......}\n```\n\nTo call a function, use “function-name\
    \ (argument);”\n\n```javascript\nfunction-name (argument );\n```\n\n## Example:\n\
    \n```javascript\n<script type=\"text/javascript\">\nfunction test( var arg ){\n\
    alert ( arg );\n}\ntest(\"display a sample\");\n</script>\n```\n\n(Output: display\
    \ a sample)\n\n## **Explanation:**\n\nWhen test(“display a sample”) call the function\
    \ test(var arg){...}, it will pass the “display a sample” to var arg. After var\
    \ arg has received the data, it will pass the data inside the function. alert\
    \ ( arg ) will use the data, and then outputs “display a sample”.\n\n## Return\
    \ Values\n\n“return” can return a value to the caller.\n\n```javascript\nfunction\
    \ function-name ( var arg ) { return value }\n```\n\nTo call a function, use “function-name\
    \ (argument);”\n\n```javascript\nfunction-name (argument );\n```\n\n## Example:\n\
    \n```javascript\nfunction cube(var num){\n  return num*num*num\n}\n```\n\nalert\
    \ ( cube(2) ); ( Output: 8 )\n\n## Explanation:\n\n“cube (2)” means that cube(2)\
    \ calls the function cube(var num){ }, and pass the argument “2” to var num.\n\
    \n“return num*num*num” returns the result to caller “cube(2)”, you can treat it\
    \ as cube(2) = return num*num*num”, assigning the value to cube(2).\n\n“alert\
    \ ( cube(2) ” will show the result of cube(2);\n\n## Variable Scope\n\nGlobal\
    \ variable is declared **outside** the function, it can be used in everywhere;\
    \ local variable is declared **inside** the function, it is only used inside current\
    \ function.\n\n## Example:\n\n```javascript\n<script type=\"text/javascript\"\
    >\nvar num=200; // This variable num is global variable.\nfunction test(){\nvar\
    \ num=100; // This variable num is local variable \nalert (num);\n}\n</script>\n\
    ```\n(Output: 200)\n\n## **Explanation:**\n\n“alert (num)\" outputs 200, which\
    \ means variable num stores a value of global variable.\n\nLocal variables are\
    \ only visible within the function block where they are declared.\n\n## Show the\
    \ Texts\n\n```javascript\ndocument.write()\n```\n\n“document.write()” simply prints\
    \ or display the specified text to the current web page.\n\n## Example:\n\n```javascript\n\
    <script type=\"text/javascript\">\ndocument.write(\"Hello World Again!\");</script>\n\
    ```\n\n( Output: Hello World Again! )\n\n## **Explanation:**\n\n“document.write\
    \ (\"Hello World Again!\")” displays characters directly into the HTML page.\n\
    \nNote that “alert ()” pops open a dialog box showing a message.\n\n## Hour 2\n\
    \n## Operators\n\n## Arithmetical Operators\n\n| Operators | Running |\n| ---\
    \ | --- |\n| + | add or connect strings |\n| - | subtract |\n| * | multiply |\n\
    | / | divide |\n| % | get modulus |\n| ++ or -- | increase 1 or decrease 1 |\n\
    \n% modulus operator divides the first operand by the second operand, returns\
    \ the\nremainder. e.g. 4%2, remainder is 0.\n\n## Example:\n\n```javascript\n\
    var add=100+200; alert (add); var div=800/2; alert ( div ); var mod=10%3;\nalert\
    \ ( mod ); var inc=10; alert ( ++inc ); var str=\"abc\"; alert ( str );\n```\n\
    \n## Explanation:\n\n```javascript\nvar add=100+200; alert ( add ) will output\
    \ 300\nvar div=800/2; alert ( div ) will output 400;\nvar mod=10%3; alert ( mod\
    \ ) will output 1;\nvar inc=10; alert ( ++inc ) will output 11;\nvar str=\"abc\"\
    ; alert ( str ) will output abcde.\n```\n\n## Logical Operators\n\n| Operators\
    \ | Equivalent |\n| --- | --- |\n| && | and |\n| || | or |\n| ! | not |\n\nAfter\
    \ using logical operators, the result will be true or false.\n\n## Example:\n\n\
    ```javascript\nvar x=true; var y=false;\nvar a=x && y; alert ( a ); // output:\
    \ false\nb=x || y; alert ( b ); // output: true\nc=x!=y; alert ( c ); // output:\
    \ true\n```\n\n## Explanation:\n\n| Operators | Equivalent |\n| --- | --- |\n\
    | && | true; false |\n| || | true; false |\n| ! | true; false |\n\n## Assignment\
    \ Operators\n\n| Operators | Examples: | Equivalent: |\n| --- | --- | --- |\n\
    | += | x+=y | x+y |\n| -= | x-=y | x-y |\n| *= | x*=y | x*y |\n| /= | x/=y | x/y\
    \ |\n| %= | x%=y | x%y |\n\n## Example:\n\n```javascript\nvar x=200; var y=100;\n\
    x+=y; alert ( x ); x/=y; alert ( x ); x-=y; alert ( x ); var m=\"abc\"; var n=\"\
    de\";\nm+=n; alert ( m );\n```\n\n## Explanation:\n\n```javascript\nx+=y; // x=x+y;\
    \ alert ( x ); outputs 300\nx/=y; // x=x/y; alert ( x ); outputs 2\nx-=y; // x=x-y;\
    \ alert ( x ); outputs 100\nm+=n; // m=m+n; alert ( m ); outputs abcde\n```\n\n\
    ## Comparison Operators\n\n| Operators | Running |\n| --- | --- |\n| > | greater\
    \ than |\n| < | less than |\n| >= | greater than or equal |\n| <= | less than\
    \ or equal |\n| == | equal |\n| != | not equal |\n\nAfter using comparison operators,\
    \ the result will be true or false.\n\n## Example:\n\n```javascript\nvar a=100;\
    \ var b=200;\nvar result = (a>b); alert ( result ); result = (a==b); alert ( result\
    \ ); result = (a!=b); alert ( result );\n```\n\n## Explanation:\n\n```javascript\n\
    var result = (a>b); // test 100>200; outputs false.\nvar result = (a==b); // test\
    \ 100==200; outputs false.\nvar result = (a!=b); // test 100!=200; outputs true.\n\
    ```\n\n## Conditional Operator\n\nThe syntax of conditional operator looks as\
    \ following:\n\n```javascript\n(test-expression) ? (if-true-do-this) : (if-false-do-this);\n\
    ```\n\n(test-expression) looks like a<b, x!==y, m==n. etc.\n\n## Example:\n\n\
    ```javascript\n<script type=\"text/javascript\">\nvar a=100; var b=200;\nvar result=(a<b)\
    \ ? \"apple\" : \"boy\"; alert ( result );\n</script>\n```\n\n( Output: apple)\n\
    \n## **Explanation:**\n\nThe output is “apple”.\n\nThe conditional operator use\
    \ (a<b) to test the “a” and “b”, because “a” is less than “b”, it is true. Therefore,\
    \ the output is “apple”.\n\n## If Statement\n\n```javascript\nif ( test-expression\
    \ ) { // if true do this; }\n```\n\n\"if statement\" executes codes inside { ...\
    \ } only if a specified condition is true, does not execute any codes inside {...}\
    \ if the condition is false.\n\n## Example:\n\n```javascript\nvar a=200;\nvar\
    \ b=100;\nif (a>b){\n  alert ( \"a is greater than b.\");\n}\n```\n\n(Output:\
    \ a is greater than b.)\n\n## **Explanation:**\n\n( a>b ) is a test expression,\
    \ namely (200>100), if returns true, it will execute the codes inside the { },\
    \ if returns false, it will not execute the codes inside the { }.\n\n## If-else\
    \ Statement\n\n```javascript\nif ( test-expression) { // if true do this; \nelse\
    \ { // if false do this; }\n```\n\n“if...else statement” runs some code if a condition\
    \ is true and runs another code if the condition is false\n\n## Example:\n\n```javascript\n\
    var a=100; var b=200;\nif (a>b){\n  alert (\"a is greater than b.\")\n}\nelse\
    \ {\n  alert (\"a is less than b\");\n}\n```\n\n(Output: a is less than b.)\n\n\
    ## Explanation:\n\n( a>b ) is a test expression, namely (100>200), if returns\
    \ true, it will output \"a is greater than b.\" if returns false, it will output\
    \ \"a is less than b\".\n\n## Switch Statement\n\n```javascript\nswitch ( var\
    \ variable ) {\n  case 1: if equals this case, do this; break;\n  case 2: if equals\
    \ this case, do this; break;\n  case 3: if equals this case, do this; break;\n\
    \  default : if not equals any case, run default code;\n  break;\n}\n```\n\nThe\
    \ value of variable will compare each case first, if equals one of the “case”\
    \ value; it execute that “case” code. “break;” terminates the code running.\n\n\
    ## Example:\n\n```javascript\nvar number=20;\nswitch ( number ) {\ncase 10 : alert\
    \ (\"Running case 10\"); break ; case 20 : alert (\"Running case 20\"); break;\
    \ case 30 : alert (\"Running case 30\"); break; default : alert (\"Running default\
    \ code\"); break; }\n```\n\n(Output: Running case 20)\n\n## Explanation:\n\nThe\
    \ number value is 20; it will match case 20, so it will run the code in case 20.\n"
  mdcn: "\n\n## 示例：\n\n```javascript\n<script type=\"text/javascript\">\nfunction\
    \ test() {\n  alert(\"show a sample\");\n}\n\ntest ();\n</script>\n```\n\n(输出:\
    \ show a sample)\n\n## **解释：**\n\n“function test() { }” 是 test() 函数的声明。\n\n“test()”\
    \ 是调用名为 test(){ } 的函数的命令。\n\n当运行函数 test () 时，它将输出“show a sample”。\n\n## 带参数的函数\n\
    \n函数在括号内可以有一个或多个参数。参数用于向函数传递数据。\n\n```javascript\nfunction function-name ( var\
    \ arg ) {......}\n```\n\n要调用函数，请使用“function-name (argument);”\n\n```javascript\n\
    function-name (argument );\n```\n\n## 示例：\n\n```javascript\n<script type=\"text/javascript\"\
    >\nfunction test( var arg ){\nalert ( arg );\n}\ntest(\"display a sample\");\n\
    </script>\n```\n\n(输出: display a sample)\n\n## **解释：**\n\n当 test(“display a sample”)调用函数\
    \ test(var arg){...} 时，它会将“display a sample”传递给 var arg。var arg 接收到数据后，它将传递函数内部的数据。alert\
    \ ( arg ) 将使用该数据，然后输出“display a sample”。\n\n## 返回值\n\n“return”可以向调用者返回一个值。\n\n\
    ```javascript\nfunction function-name ( var arg ) { return value }\n```\n\n要调用函数，请使用“function-name\
    \ (argument);”\n\n```javascript\nfunction-name (argument );\n```\n\n## 示例：\n\n\
    ```javascript\nfunction cube(var num){\n  return num*num*num\n}\n```\n\nalert\
    \ ( cube(2) ); ( 输出: 8 )\n\n## **解释：**\n\n“cube (2)”意味着 cube(2)调用了函数 cube(var\
    \ num){ }，并将参数“2”传递给 num。\n\n“return num*num*num”将结果返回给调用者“cube(2)”，你可以将其视为 cube(2)\
    \ = return num*num*num”，将值赋值给 cube(2)。\n\n“alert ( cube(2) ” 将显示 cube(2) 的结果；\n\
    \n## 变量作用域\n\n全局变量声明在函数**外部**，可以在任何地方使用；局部变量声明在函数**内部**，它只在当前函数内部使用。\n\n## 示例：\n\
    \n```javascript\n<script type=\"text/javascript\">\nvar num=200; // 变量 num 是全局变量。\n\
    function test(){\nvar num=100; // 变量 num 是局部变量 \nalert (num);\n}\n</script>\n\
    ```\n(输出: 200)\n\n## **解释：**\n\n“alert (num)” 输出 200，这意味着变量 num 存储的是全局变量的值。\n\n\
    局部变量仅在声明它们的函数块内可见。\n\n## 显示文本\n\n```javascript\ndocument.write()\n```\n\n“document.write()”简单地将指定的文本打印或显示在当前网页上。\n\
    \n## 示例：\n\n```javascript\n<script type=\"text/javascript\">\ndocument.write(\"\
    Hello World Again!\");</script>\n```\n\n( 输出: Hello World Again! )\n\n## **解释：**\n\
    \n“document.write (\"Hello World Again!)” 直接将字符显示到 HTML 页面中。\n\n注意，“alert ()”会弹出一个显示消息的对话框。\n\
    \n## 第 2 小节\n\n## 运算符\n\n## 算术运算符\n\n| 运算符 | 运行 |\n| --- | --- |\n| + | 加法或连接字符串\
    \ |\n| - | 减法 |\n| * | 乘法 |\n| / | 除法 |\n| % | 取模 |\n| ++ 或 -- | 加1或减1 |\n\n%\
    \ % 取模运算符将第一个操作数除以第二个操作数，返回余数。例如 4%2，余数为 0。\n\n## 示例：\n\n```javascript\nvar add=100+200;\
    \ alert (add); var div=800/2; alert ( div ); var mod=10%3;\nalert ( mod ); var\
    \ inc=10; alert ( ++inc ); var str=\"abc\"; alert ( str );\n```\n\n## **解释：**\n\
    \n```javascript\nvar add=100+200; alert ( add ) 将输出 300\nvar div=800/2; alert\
