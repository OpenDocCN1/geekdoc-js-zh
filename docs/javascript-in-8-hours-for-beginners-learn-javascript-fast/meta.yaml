    , \"width=300, height=200\", status=no,menubar=yes );\n```\n( Output: A new customized\
    \ window )\n\n## Explanation:\n\n“MyWindow” is new window name.\n\n“width=300,\
    \ height=200” specify the size of new window.\n\n“status= no” means there is no\
    \ status bar.\n\n“menubar=yes” means there is a menu bar.\n\n## Confirmation\n\
    \n```javascript\nwindow.confirm();\n```\n\n“window.confirm()” requires user to\
    \ confirm. Confirm dialog box looks like this:\n\nWhen clicking “OK”, it returns\
    \ true in scripting.\n\nWhen clicking “Cancel”, it returns false in scripting.\n\
    \n**Example:**\n\n```javascript\nvar ask = window.confirm(\" Are you sure? \"\
    );\nif ( ask == true )\n  { alert(\"All Right!\"); }\nelse { alert(\"No Good!\"\
    ); }\n```\n( Output: All Right! or No Good!)\n\n## Explanation:\n\nWhen clicking\
    \ “OK” button, it outputs “All Right!”.\n\nWhen clicking “Cancel” button, it outputs\
    \ “No Good!”.\n\n## Prompt to Input\n\n```javascript\nwindow.prompt();\n```\n\n\
    “window.prompt()” prompt user to input something to prompt dialog box, which looks\
    \ like this:\n\nThe user should type some words into prompt dialog box, for example,\
    \ enter “Yes, I like it.”, and then click the “OK” or “Cancel” button.\n\n**Example:**\n\
    \n```javascript\nvar ask = window.prompt ( “Do you like JavaScript?” );\nalert\
    \ ( ask );\n```\n( Output: Yes, I like it! )\n\n## Explanation:\n\nUser enters\
    \ a sentence “Yes, I like it!”, and then click “OK” button, the value is assigned\
    \ to “ask”.\n\n“alert ( ask )” displays the contents that is inputted by user.\n\
    \n## Address Element by ID\n\n```javascript\ndocument.getElementById( ).innerHTML\n\
    ```\n\n“getById” access an element by its id.\n“innerHTML” displays text in HTML\
    \ document.\n\n**Example:**\n\n```html\n<body>\n<div id = \"position\">\n</div>\n\
