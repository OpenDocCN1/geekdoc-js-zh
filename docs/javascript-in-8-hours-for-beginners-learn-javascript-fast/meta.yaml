    \ 符号\n- CSS 复习\n\n# 结语\n\n# 第一小时\n\n# JavaScript 基础\n\n# 什么是 JavaScript？\n\nJavaScript\
    \ 是一种动态计算机编程语言，用于制作交互式网页。它的解释器嵌入在浏览器软件（如 IE、Chrome 和 Firefox 等）中。它在访问者的计算机和浏览器上运行。\n\
    \nJavaScript 的语法如下：\n\n```html\n<script type = \"text/javascript\">\n......\n\
    </script>\n```\n\n# 示例:\n\n```html\n<script type = \"text/javascript\">\nalert(\"\
    Hello World\");\n</script>\n```\n\n（ 输出: Hello World ）\n\n# 解释:\n\n<script type\
    \ = \"text/javascript\"> 是 JavaScript 的标签。JavaScript 代码包含其中。\n\n\"alert\" 会弹出一个显示消息的警告框。\n\
    \n\"alert(\"Hello World\")\" 显示 \"Hello World\" 消息。\n\n JavaScript 块可以位于 HTML\
