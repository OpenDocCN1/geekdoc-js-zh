    # JavaScript Basic


    # What is JavaScript?


    JavaScript is a dynamic computer programming language used to make web pages interactive.
    Its interpreter is embedded inside web browser software, such as IE, Chrome, and
    Firefox etc. It runs on visitor''s computer and browser.


    The syntax of JavaScript looks like this:


    ```html

    <script type = "text/javascript">

    ......n

    </script>

    ```


    # Example:


    ```html

    <script type = "text/javascript">

    alert("Hello World");

    </script>

    ```


    ( Output: Hello World )


    # Explanation:


    <script type = "text/javascript"> is a tags for JavaScript. The JavaScript codes
    are included within it.


    "alert" pops up an alert box displaying a message.


    "alert("Hello World")" displays "Hello World" message.


    JavaScript block can located anywhere in HTML.


    # Comment


    Comment is used to explain the code.


    ```javascript

    // This is a single line comment

    /*

    This is a multi line comment; JavaScript interpreter

    will ignore both single line comment and multi line

    comment.

    */

    ```


    # Example:


    ```html

    <script type = "text/javascript">

    alert("Hello World");

    </script>

    ```


    # Explanation:


    <script type="text/javascript"> is a tags for JavaScript. The JavaScript codes
    are included within it.


    "alert" pops up an alert box displaying a message.


    "alert("Hello World")" displays "Hello World" message.


    JavaScript block can located anywhere in HTML.


