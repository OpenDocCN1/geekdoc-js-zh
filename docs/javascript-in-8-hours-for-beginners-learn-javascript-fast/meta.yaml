    <style type = "text/css">

    tag{attribute: value}

    tag.class{attribute: value}

    tag#id{attribute: value}

    .class{attribute: value}

    #id{attribute: value}

    </style>

    ```


    (2)

    tag style = "attribute: value">......</tag> (3)


    ```

    <link rel = "stylesheet" title = "My Style" type = "test/css" href = "myfile.css">

    ```


    ```

    (4)

    @import url("external/myfile.css")

    ```'
