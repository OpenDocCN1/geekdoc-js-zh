  md: '# Function with Arguments


    A function can have one or more arguments inside the bracket. Arguments are used
    to pass data to function.


    ```

    function function-name ( var arg ) {......}

    ```


    To call a function, use “function-name (argument);”


    ```

    function-name (argument );

    ```'
  merge: -1
  pgno: 32
