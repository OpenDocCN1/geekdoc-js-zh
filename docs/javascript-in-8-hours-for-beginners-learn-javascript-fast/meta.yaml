  md: '# Example:


    ```

    <script type="text/javascript">

    alert("Hello World"); // "alert" pops up a message.


    /* "alert" pops up an alert box displaying a message "Hello World". "alert()"
    is usually used if you want to make sure message comes through the user. */

    </script>

    ```'
