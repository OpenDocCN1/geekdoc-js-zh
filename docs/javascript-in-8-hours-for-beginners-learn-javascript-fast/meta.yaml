    }\n</script>\n```\n\n( 输出: 012345 )\n\n# **解释：**\n\nvar x = 0 是初始化器，\n\nx <= 5\
    \ 是测试表达式，代码最多运行 5 次。\n\nx++ 意味着 x 在每次循环中增加 1。\n\n循环 5 次后，代码将输出 012345。\n\n# while\
    \ 循环\n\n```javascript\nwhile ( test-expression ) { // 在这里有一些 js 代码; }\n```\n\n\
    “while 循环”如果指定的条件为真，则循环执行一段代码块。\n\n# 示例：\n\n```javascript\nvar counter=0;\nwhile\
    \ (counter < 8){\ndocument.write ( \"&\" );\ncounter++;\n}\n```\n\n( 输出: &&&&&&&&\
    \ )\n\n# 解释：\n\n“counter< 8”是一个测试表达式，如果条件为真，代码将循环少于 8 次，直到 counter 达到 8，此时条件为假，代码将停止运行。\n\
    \n# do-while 循环\n\n```javascript\ndo{ // 在这里有一些 js 代码 } while ( test-expression);\n\
    ```\n\n“do...while”先循环一次一段代码块，如果指定的条件为真，则重复该循环。\n\n# 示例：\n\n```javascript\nvar\
    \ counter=0;\ndo {\n  document.write ( \"@\" );\n  counter++;\n} while (counter<8);\
    \ ( 输出: @@@@@@@ )\n```\n\n# 解释：\n\n“counter< 8”是一个测试表达式，如果条件为真，代码将循环少于 8 次，直到\
    \ counter 达到 8，此时条件为假，代码将停止运行。\n\n# 第 3 小时\n\n# # 数组\n\n# 创建数组\n\n数组是一种特殊的变量，可以同时包含一个或多个值。\n\
    new Array() 创建一个数组。\n\n创建数组的语法：\n\n| var array-name = new Array (\"value0\", \"\
    value1\", \"value2\"); | 创建数组的其他语法： |\n\n# 示例：\n\n```javascript\nvar color = new\
    \ Array ( ); color [0] = \"red\";\ncolor [1] = \"blue\";\ncolor [2] = \"green\"\
    ;\n```\n\n# **解释：**\n\n上述代码创建了一个数组，数组名为“color”，它有三个元素：color [0], color [1], color\
    \ [2]。它的索引是 0, 1 和 2。它的值是 red, blue 和 green。\n\n注意索引从 0 开始。\n\n# 显示数组元素的值\n\n\
    要显示数组元素的值，请使用如下所示的语法：\n\n```javascript\ndocument.write( array-name[index] );\n\
    ```\n\n# 示例：\n\n```javascript\n<script type = \"text/javascript\">\ncolor = new\
    \ Array(\"yellow\", \"purple\", \"orange\");\ndocument.write ( color[1] );\n</script>\n\
    ```\n\n( 输出: purple )\n\n# 解释：\n\n从上面你可以知道：\ncolor[0] 的值是 yellow。\ncolor[1] 的值是\
    \ purple。\ncolor[2] 的值是 orange。\n注意索引从零开始。\n\n# 获取数组大小\n\n函数可以获取数组的大小。\n\n```javascript\n\
    array.length\n```\n\n# 示例：\n\n```javascript\n<script type = \"text/javascript\"\
    >\nvar color = new Array(\"yellow\", \"purple\", \"orange\");\nvar size = color.length;\
    \ document.write ( size );\n</script>\n```\n\n( 输出: 3)\n\n# **解释：**\n\n“var size=color.length”可以返回数组“color”的大小，并将数组的大小赋值给“size”。\n\
    \nnew Array(\"yellow\", \"purple\", \"orange\") 有三个元素，所以它的大小是 3。\n\n# 合并元素\n\n\
    ```javascript\narray.join( );\narray.join(\" \");\narray.join(\", \");\n```\n\n\
    array.join( ) 可以合并所有数组元素且不留空格。\narray.join(\" \") 可以通过空格合并所有数组元素。\narray.join(\"\
    ,\") 可以通过逗号合并所有数组元素。\n\n# 示例：\n\n```javascript\nvar arr = new Array();\narr[0]\
    \ = \"I\";\narr[1] = \"love\";\narr[2] = \"JavaScript!\";\ndocument.write(arr.join(\"\
    \ \")); // 输出: I JavaScript!\n```\n\n**解释：**\narr.join(\" \") 可以通过空格将“arr”的所有元素连接在一起。当然，你也可以尝试\
    \ arr.join(\",\") 用逗号连接元素。\n\n# 反转元素顺序\n\n```javascript\narray.reverse();\n```\n\
    \n\"array.reverse()\" 可以反转数组的元素顺序。\n\n# 示例：\n\n```javascript\nvar arr = new Array(\"\
    A\", \"B\", \"C\");\narr.reverse(); // 反转元素顺序\nrev = arr.join(\",\");\ndocument.write(rev);\n\
    ```\n\n( 输出: C, B, A )\n\n# 解释：\n\n“arr.reverse()”反转了“arr”数组的元素顺序。\n“rev=arr.join(\"\
    ,\")”将“arr”的所有元素合并并将值赋值给“rev”。\n\n# 切片元素\n\n```javascript\narray.slice( start,\
    \ last);\n```\n\n\"array.slice( start, last )\" 可以将数组元素切成切片。\nstart 表示起始位置，\n\
    last 表示结束位置。\n\n示例：\n\n```javascript\nvar arr = new Array(\"a\", \"b\", \"c\"\
    , \"d\", \"e\", \"f\");\nvar sli = arr.slice(2, 5);\ndocument.write(sli); // 输出:\
    \ c,d,e\n```\n\n**解释：**\narr.slice(2, 5) 提取从索引 2 到 4 的元素（不包含 5）。\n\n"
