  \ -it -p 3000:3000 --rm mongo-node\n```\n\n### 10.2.3 议\n\n*可以通过两个路由访问服务器：\n   \
  \ * `/databases` -> 返回 JSON。（我们 MongoDB 集群中存在的所有数据库）。\n\n\n\n\n\n- `/find` -> 接收\
  \ URI 编码参数并返回 JSON。（所有具有给定卧室数量的 `hotels`、其地址和描述）。\n\n## 10.2.4 探索\n\n使用任何编辑器，我们将编写并测试\
  \ JavaScript 代码，以连接并查询 MongoDB 云端。\n\n#### 10.2.4.1 用于调用自定义 API 的前端脚本\n\n将以下代码放入项目目录下的\
  \ `public/script.js` 文件中。\n\n```javascript\n//DOM reference's\nconst btn = document.getElementById(\"\
  btn\");\nconst code = document.getElementById(\"code\");\nconst search = document.getElementById(\"\
  search\");\nconst btnC = document.getElementById(\"btnC\");\nconst db = document.getElementById(\"\
  database\");\nconst coll = document.getElementById(\"collection\");\n\nbtn.addEventListener(\"\
  click\", async () => {\n  code.innerText = \"loading\";\n  const res = await fetch(\"\
  /databases\");\n  const json = await res.json();\n  code.innerText = \"\\n\" + JSON.stringify(json,\
  \ null, 4);\n});\n\nbtnC.addEventListener(\"click\", async () => {\n  if (db.value)\
  \ {\n    const res = await fetch(\"/find?search = \" + encodeURIComponent(db.value));\n\
  \    const json = await res.json();\n    code.innerText = \"\\n\" + JSON.stringify(json,\
  \ null, 4);\n  } else {\n    code.innerText = \"Please provide a Database Name,\
  \ hit 'Show databases' to see available ones<3\";\n  }\n});\n```\n\n#### 10.2.4.2\
  \ 代码解读\n\n- 代码的第一部分演示了对 DOM 引用的访问。\n- `fetch()` 是一个从不同源获取资源的 JavaScript API。它接收一些输入参数：查询的\
  \ URL，后面是可选的参数。\n- 为了实现上述议程，需要两个 `fetch` 操作。你可以看到在 `fetch` 之前使用了 `await`，这是因为 `fetch`\
  \ 正在从不同的源获取信息，而且它依赖于带宽。在数据可用之前需要一些时间。`await` 用于暂停代码执行，直到进程完成，然后重新执行代码执行。\n\n####\
  \ 10.2.4.3 创建 Node.js 后端\n\n将以下代码放入项目目录下的 `server.js` 文件中。\n\n```javascript\n//\
  \ Official Mongo driver which is required to connect with MongoDB clusters.\nconst\
  \ { MongoClient } = require(\"mongodb\");\n// Framework for managing HTTP so we\
  \ don't need to take care of certain low-level things.\nconst express = require(\"\
  express\");\nconst { Router, response } = require(\"express\");\n\nconst init =\
  \ async () => {\n  // TODO: Add your specific connection URI here.\n  const uri\
  \ = \"ENTER URL FROM MONGODB CLOUD HERE\";\n  // 通过将 URI 传递给构造函数来创建 MongoClient\
  \ 新实例。\n  const client = new MongoClient(uri, { useUnifiedTopology: true });\n \
  \ await client.connect();\n  // 创建 express 新实例，根据习惯命名为 app。\n  const app = express();\n\
  \  // 这是一个服务器路由，\n  // 第一个参数是 URL 端点，它将触发此内部的代码段\n  // 接收一个回调函数 ()，带有两个参数 req->\
  \ request 和 res-> response app。\n  app.get(\"/databases\", async (req, res) => {\n\
  \    // 通过 client 获取所有数据库列表\n    const result = await client.db().admin().listDatabases();\n\
  \    // res (response) 允许你与客户端通信；首先设置状态码 = 200（可选的，但是良好的实践）\n    // 随后是 JSON 响应，包含获取的结果。\n\
  \    res.status(200).json({ dbs: result.databases }).end();\n  });\n\n  app.get(\"\
  /find\", async (req, res) => {\n    const minBedrooms = Math.floor(req.query.search);\n\
  \    console.log(minBedrooms);\n    // 此 mongoDB 查询返回一个游标，可以进一步用于过滤、排序或顺序访问元素\n\
  \    // 我们简单地将其转换为数组，以便一次性向客户端发送所有数据。\n    // 在这里，$gte 代表大于等于，是 MongoDB 中比较运算符之一，请查阅\
  \ MongoDB 官方文档获取更多信息。\n    const cursor = await client\n      .db(\"sample_airbnb\"\
  )\n      .collection(\"listingsAndReviews\")\n      .find({ bedrooms: { $gte: minBedrooms\
  \ } })\n      .sort({ last_review: -1 })\n      .limit(50);\n    const response\
  \ = await cursor.toArray();\n    var subset = [];\n    // 提取结果的选择性部分，否则会是一团糟。我正在提取名称、描述和地址。\n\
  \    // 随需 console.log(response) 以查看完整结果并据此进行操作。\n    response.forEach((match) =>\
  \ {\n      subset.push({\n        name: match.name,\n        dsc: match.description,\n\
  \        addr: match.address,\n      });\n    });\n    console.log(response);\n\
  \    if (response) {\n      res\n        .status(200)\n        .json({\n       \
  \   response: `Valid AirBnbs with ${minBedrooms} minimum bedrooms`,\n          matches:\
  \ subset,\n        })\n        .end();\n    } else {\n      res.status(200).json({\
  \ match: \"No matches found\" }).end();\n    }\n  });\n\n  // 发送落地页\n  // app.get(\"\
  /\", (req, res) => {\n  // res.sendFile(\"public/index.html\");\n  // });\n  //\
  \ 在端口 3000 启动你的服务器。（如果你在 Docker 运行命令中做了端口更改，请忽略此处）\n  const PORT = 3000;\n  app.listen(PORT);\n\
  };\ninit();\n```\n\n\n\n\n\n作者说明包含了管理用户状态，例如：是否是通过身份验证的同一个人，或者是否仍然登录？这是一项非常繁琐的服务端任务，但\
  \ firebase 通过其自身的后端可以非常方便地管理和授权用户。幸运的是，我们不需要担心这些。\n\n## 10.4.3 前提条件\n\n1.在此处创建一个\
  \ firebase 项目，Firebase Console（控制台）。\n2. 点击项目概览（Project overview）旁边的设置，并选择 `Project\
  \ Settings`（项目设置）。\n3.向下滚动并点击 `Add App`（添加应用）。\n4. 选择 `WebApp` 并按照屏幕上的指示操作。最后，你将获得\
  \ `firebaseConfig` 对象；妥善保存。你将需要它将项目的前端与 firebase 连接。\n5. 从左侧面板点击 `authentication`（身份验证）并选择\
  \ `get started`（开始使用）。\n6. 进入 `authentication` 页上的 `signin-method`（登录方法）选项卡并启用 `google`。（可以使用任何你选择的提供程序；对于本教程，我们坚持使用\
