  \ `authorised-domains`（已授权域名）并添加你的域名（可能是 localhost 或 127.0.0.1），以便授予访问 firebase。\n\
  8. **重要** 如果你像打开一样打开 html 文件，你的代码将无法工作；它需要被提供，例如来自 localhost。实现此点的简单方法之一是使用 VisualStudio\
  \ code 编辑器。只需安装 `liveserver` 扩展，并使用它打开 html 文件。\n\n## 10.4.4 议程\n\n* 创建登录页面，用户可以通过其\
  \ google 账户登录。\n* 创建一个用户页面，在登录后显示用户的公共凭据。\n\n## 10.4.5 探索\n\n使用任何编辑器，我们将编写并测试 JavaScript\
  \ 代码以使用 Firebase 身份验证服务，并通过用户的 google 账户提供登录功能。\n\n资源：\n\n* 从 [`www.routledge.com/9780367641429`](https://www.routledge.com/9780367641429)\
  \ 下载 `Ch_10_FirebaseAuth`；你将获得此项目所需的代码。\n* 打开 `login.html` 页面，你可以看到几个带有来自 `gstatic`\
  \ `src` 的脚本；这是一个 CDN（内容分发网络）。由于 firebase 是我们项目中的依赖之一，我们将使用 CDN 动态将 firebase 库加载到我们的运行时。\n\
  \n#### 10.4.5.1 创建登录页面\n\n将以下代码放在项目目录下的 `script.js` 文件中。\n\n```javascript\nvar firebaseConfig\
  \ = {\n/* 按照前提条件所述，用你的项目凭据填充 firebaseConfig 对象。 */\n};\n\n// 初始化 Firebase\n\nfirebase.initializeApp(firebaseConfig);\n\
  \n// var provider = new firebase.auth.GoogleAuthProvider();\n\nvar uiConfig = {\n\
  \  signInSuccessUrl: \"home.html\",\n  signInOptions: [\n    // 对于你想要为用户提供的提供程序，保持这些行不变。\n\
  \    firebase.auth.GoogleAuthProvider.PROVIDER_ID,\n  ],\n  // tosUrl 和 privacyPolicyUrl\
  \ 接受 url 字符串或回调函数。\n  // 服务条款 url/回调。\n  tosUrl: \"https://www.google.co.in\",\n\
  \  // 隐私政策 url/回调。\n  privacyPolicyUrl: function () {\n    window.location.assign(\"\
  https://www.google.co.in\");\n  },\n};\n\n// 使用 Firebase 初始化 FirebaseUI 小部件。\n\n\
  var ui = new firebaseui.auth.AuthUI(firebase.auth());\n\n// start 方法将等待 DOM 加载。\n\
  \nui.start(\"#firebaseui-auth-container\", uiConfig);\n```\n\n#### 10.4.5.2 代码解读\n\
  \n* `firebaseConfig` 基本上允许你使用凭据连接到 firebase 服务。\n* `uiConfig` 接收两个重要属性作为输入；这些属性如下：\n\
  \    1. `signInSuccessUrl`：身份验证成功后控制转移到的页面的 `URL`。\n    2. `signInOptions`：列出了提到的不同登录方式的数组。由于我们在这里使用了\
  \ google，所以只需要一个元素。（无论需要实现哪些方法，确保它在 firebase 控制台中已启用。）\n* 新 `firebaseui.auth.AuthUI(firebase.auth())`\
  \ 是启动身份验证流的构造函数。我们使用 `AuthUI`，因为它可以使用 Google 的标准 UI 元素管理登录。\n* 最后 `ui.start()` 接收\
  \ `selector`（选择器），即你需要挂载登录门户的 `div` 的 ID 或 CLASS。我们的 HTML 页面已经包含一个 `id` = `“firebaseui-auth-container\"\
  ` 的 `div`。其次，`start()` 还接收 `uiconfig`，并且只有在整个网页加载后它才会开始工作。\n\n#### 10.4.5.3 创建主页\n\
  \n如之前的代码段所示，登录成功后此页面会自动重定向。将以下代码段放在项目目录下的 `auth.js` 文件中。\n\n```javascript\nvar firebaseConfig\
  \ = {\n/* TODO:\n* 在此处填入四个 firebase 项目凭据。<3\n*/\n};\n\n// 初始化 Firebase\n\nfirebase.initializeApp(firebaseConfig);\n\
  \n// DOM 引用\n\nvar fname = document.querySelector(\".photo-details h1\");\nvar dp\
  \ = document.querySelector(\".photo-card img\");\nconst card = document.querySelector(\"\
  .photo-card\");\nvar userEmail, userPicURL, userName;\nconst logout = document.getElementById(\"\
  logout\");\n\nfunction initApp() {\n  // 实时监听器。\n  firebase.auth().onAuthStateChanged((user)\
  \ => {\n    if (user) {\n      // 用户身份验证并登录。\n      card.classList.remove(\"hide\"\
  );\n      populateLoggedInCard(user);\n      // 显示退出按钮\n      logout.classList.remove(\"\
  hide\");\n      userEmail = user.email;\n      userPicURL = user.photoURL;\n   \
  \   userName = user.displayName;\n    } else {\n      // 隐藏退出按钮\n      logout.classList.add(\"\
  hide\");\n      card.classList.add(\"hide\");\n      userEmail = null;\n      userPicURL\
  \ = null;\n      userName = null;\n    }\n  }, (error) => {\n    console.log(error);\n\
  \  });\n\n  // 退出事件监听器。\n  logout.addEventListener(\"click\", (e) => {\n    firebase.auth().signOut()\n\
  \      .then(() => {\n        // 退出成功。\n        window.location.replace(\"login.html\"\
  );\n      })\n      .catch((error) => {\n        // 发生错误。\n      });\n  });\n}\n\
  \n// 在 DOM 加载后延迟初始化。\nwindow.addEventListener(\"load\", () => {\n  initApp();\n\
  });\n\n// 填充登录的用户卡片。\nconst populateLoggedInCard = (user) => {\n  fname.innerText\
  \ = user.displayName;\n  dp.src = user.photoURL;\n};\n```\n\n\n\n\n\n2. 层叠样式表. [在线].\
