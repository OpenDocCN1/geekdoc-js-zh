  - **步骤 4：** 对后续每个片段重复上述三个步骤。\n\n### 8.4.3 探索\n使用任何编辑器，我们将编写并测试 JavaScript 代码以与 DOM\
  \ 交互并在网页上查看结果。关于提升，你应该了解以下内容：在概念上，JS 认为所有的声明（变量）和函数定义都移动到了代码的顶部，因此 JS 不会抛出引用错误（或者感知这些变量），但事实并非如此。变量声明就在它们定义的地方，但\
  \ JS 在编译期间会将它们存储在内存中，因此在运行时可以感知这些变量。这个概念被称为提升。\n\n#### 8.4.3.1 代码片段-1\n```javascript\n\
  // 工具函数 ()\nconst appendToHTML = (contents, color = \"white\") => {\n  contents.forEach((content)\
