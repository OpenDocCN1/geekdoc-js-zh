  \n> *即使昨天取得了巨大的成功，我仍然不想重复它。相反，我想在它的基础上继续迈进*。\n\n> –Craig D. Lounsbrough\n\n我们的 JavaScript\
  \ 学习之旅终于要结束了。这可能是学习基础 JavaScript 语言知识的终点，但我们还有许多可以学习的内容。在本章中，我们的目标是让你领略 JavaScript\
