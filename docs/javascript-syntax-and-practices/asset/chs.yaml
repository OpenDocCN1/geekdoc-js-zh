  \    myPara.style.color = color;\n    myPara.innerHTML = content;\n    resultHere.appendChild(myPara);\n\
  \    sep();\n  });\n};\n\nconst sep = () => {\n  const separator = document.createElement(“hr”);\n\
  \  resultHere.appendChild(separator);\n};\n/************************************************************\
  \ */\nvar resultHere = document.querySelector(\".results”);\n// 定义蓝图以创建实例，即相同类型的对象\n\
  function NetFlix(content, customer) {\n  // 对象构造函数\n  this.content = content;\n\
  \  this.customer = customer;\n  // 对象方法\n  this.streamService = (choice) => {\n\
  \    // 方法定义\n    if (choice < this.content.length) {\n      return this.content[choice];\n\
  \      // 它指代当前被调用的对象，以解决可能存在的歧义。\n    }\n    else {\n      return “Not Subscribed,\
  \ sorry!”;\n    }\n  };\n  // customer 属性的 getter。 | 可以处理并返回更高质量的数据。\n  this.getCust\
  \ = () => {\n    return this.customer.toUpperCase();\n  };\n  // customer 属性的 setter。\n\
  \  this.setCust = (newCust) => {\n    // 可以检查条件然后赋值。\n    if (newCust!== null) {\n\
  \      // 或者使用任何自定义有效性测试。\n      this.customer = newCust;\n    }\n    else {\n \
  \     return;\n    }\n  };\n}\n// 使用构造函数创建对象。\nvar nfAsia = new NetFlix([“Witcher”,\
  \ “Two man and a half”], “Dummy Dumdum”);\n// 向对象构造函数添加属性（通过原型）\nNetFlix.prototype.region\
  \ = “Global”;\nvar nfUk = new NetFlix([“Peaky Blinders”, “Enola Holmes”], “Dummydum”);\n\
  // 打印新创建的对象。\nappendToHTML(\n  [`Dummy object 1: ${JSON.stringify(nfAsia)}`,\n \
  \ `Currently Streaming content-2: ${nfAsia.streamService(1)}`,\n  `Currently Streaming\
  \ content-6: ${nfAsia.streamService(5)}`,\n  ],\n  “black”\n);\nappendToHTML(\n\
  \  [`Dummy object 2: ${JSON.stringify(nfUk)}`,\n  `Currently Streaming content-2:\
  \ ${nfUk.streamService(1)}`,\n  `Currently Streaming content-100: ${nfUk.streamService(99)}`,\n\
  \  `Stream Service: ${nfUk.region}`,\n  ],\n  “yellow”\n);\n```\n\n\n\n\nJavaScript\
  \ 允许我们生成用户定义的函数，专门作为一组语句的执行句柄。在 JavaScript 中，除了原始数据类型之外的任何内容都被视为对象。函数是 JavaScript\
  \ 语言中的特殊对象。通过执行代码 `(function(){ }).constructor === Function` 可以观察到这一点，它返回 `true`[[79]](#ref-list.xhtml_refReferences_79)。作为对象的函数包含三个属性，即\
  \ `length`、`name` 和 `prototype`。此外，`Function.prototype` 包含许多其他属性和方法，其中一些在此处进行了解释。每当我们在\
  \ JavaScript 中创建一个 `function` 时，创建的函数将是 `Function` 特殊对象或蓝图的对象；可以使用 `typeof` 运算符进行检查。请注意，`Function`\
  \ 是特殊对象，而函数将是使用 `Function.prototype` 创建的用户定义对象。要查看 `Function` 特殊对象的属性和方法，请在浏览器控制台中输入\
  \ `Object.getOwnPropertyDescriptors(Function)` [[80]](#ref-list.xhtml_refReferences_80)。\n\
  \n让我们来了解 `Function` 对象内部提供的属性和一些重要方法。\n\n*   `Function.prototype.name`: 此属性存储所定义的函数名称；可以在浏览器控制台中使用\
  \ `functionIdentifier.name` 进行检查。\n*   `Function.prototype.length`: 此属性存储传递给函数的参数个数；可以在浏览器控制台中中使用\
  \ `functionIdentifier.length` 进行检查。\n*   `Function.prototype.constructor()`: 这是一个特殊方法，使用\
  \ `new` 算符创建 `Function` 对象。例如，`var myFunc = new Function()`。\n*   `Function.prototype.toString()`:\
  \ 该方法从 Object 原型处被重写；当在浏览器控制台中像 `functionIdentifier.toString()` 使用时，它将打印函数的代码。\n\
  *   `Function.prototype.apply()/bind()/call()`: 这三个方法用于作用域处理；它们将在下一节关于函数作用域中单独讨论。\n\
  *   `Function.prototype.arguments`: 此属性是每个函数内部的一个类数组对象；它包含了传递给函数的所有参数，并方便使用索引访问参数。\n\
  \n## 4.2 函数变量作用域\n\n现在讨论函数作用域及其绑定还稍微早了一点。然而，在向后继续学习函数声明之前，你有必要理解它。\n\n函数中使用的变量可以定义在函数体外部，也可以定义在函数体内。定义在函数体内的变量被称为`局部变量`。局部变量仅供关联函数访问。局部变量在函数被调用并开始执行时初始化；当函数体执行完毕时，变量会被删除。此类变量只在函数内部识别；因此，在函数体外部可以使用同名的变量。\n\
  \n定义在函数体外的变量被称为`全局变量`。这些变量可以被整个代码中定义的任何函数访问。如果局部变量和全局变量同名，则局部变量会遮蔽外部变量，这意味着局部变量紧密关联到其关联函数并覆盖全局值。\n\
  \n如果函数没有可用的局部变量，则将使用全局变量的值执行。让我们通过下面的示例来理解变量的作用域：\n\n```javascript\n// 以下变量定义在全局作用域中\n\
  var num1 = 20;\nvar num2 = 3;\nvar name = “Tom\";\n\nfunction multiply() { // 函数定义在全局作用域\n\
  \  return num1 * num2; //可以访问全局变量\n}\n\n// 嵌套函数示例\nfunction getScore() {\n  var\
  \ num1 = 2, num2 = 3;\n  function add() {\n    return name + ' scored ' + (num1\
  \ + num2);\n  }\n  return add();\n}\n\nmultiply(); // 返回 60\ngetScore(); // 返回 \"\
  Tom scored 5\"\n```\n\n该示例演示了函数内部全局变量和局部变量的使用。还演示了嵌套函数；每当调用 `getScore()` 时，它会自动执行\
  \ `add()` 并返回值。\n\n以上是关于对变量作用域的理解。现在转向函数调用内部变量的绑定。为了提供一点背景，JavaScript 中的函数可以作为对象在其他函数之间传递，每当对象作为回调函数传递给另一个函数时，当前对象或\
  \ `this` 的值就会丢失。在开发 Web 内容时，我们需要在每次调用函数时向其传递用户特定的数据。因此，每次执行回调时都丢失 `this` 的引用会导致问题。函数作用域提供了该\
  \ problem 的解决方案。在 `Function.prototype` 内部有三个方法，即 `call()`、`apply()` 和 `bind()`。让我们通过以下示例了解它们的效用：\n\
  \n```javascript\n// 传统示例\n// 一个带有自身 \"this\" 属性的简单对象\nvar dummyObject = {\n  num:\
  \ 100;\n};\n\n// 在 window 上设置 \"num\" 以显示它是如何不被使用的\nwindow.num = 2000;\n\n/* 将在\
  \ DOM 章节中讨论 window，\n现在将其视为全局作用域 */\n\n// 一个用于操作 \"this\" 的传统函数\nvar add = function\
  \ (a, b, c) {\n  return this.num + a + b + c; // this 关键字的使用\n};\n\nvar result =\
  \ add(1, 2, 3);\nconsole.log(result) // 打印 2006 (2000 + 1 + 2 + 3)\n\n// 使用 call\n\
  var result = add.call(dummyObject, 1, 2, 3);\nconsole.log(result) // 打印 2006 (2000\
  \ + 1 + 2 + 3)\n\n// 使用 apply\nconst arr = [1, 2, 3];\nvar result = add.apply(dummyObject,\
  \ arr);\nconsole.log(result) // 打印 2006 (2000 + 1 + 2 + 3)\n\n// 使用 bind\nvar result\
  \ = add.bind(dummyObject);\nconsole.log(result(1, 2, 3)) // 返回 2006 (2000 + 1 +\
  \ 2 + 3)\n```\n\n此示例演示了这三个方法如何在调用方法时关联 `dummyObject` 的作用域，并在访问本地 `num` 值。而在传统的函数调用中使用的是\
  \ num 的全局值，即 `window.num`。这种基础理解将有助于我们掌握后续章节中讨论的箭头函数\n\n## 4.3 函数声明\n\nJavaScript\
  \ 支持多种方法来声明函数。在本节中，我们将讨论声明方法的的方法。\n\n### 4.3.1 传统函数声明\n\n这种方法是声明函数的传统方式，自 JavaScript\
  \ 语言诞生以来就一直支持。传统函数通过使用 `function` 关键字后跟函数名称来声明。函数名遵循与变量相同的命名规则，可以使用字母、数字、下划线和美元符号。请参阅第\
  \ 2.2.5 节 变量的命名规范。传统定义函数的语法如下：\n\n```javascript\nfunction func_name (parameter1,\
  \ parameter2, … parameter)\n{\n  //一组语句 – 函数体\n  //可选的 return 语句\n}\n```\n\n\n使用参数执行的语句集写在花括号内。这部分被称为函数体。在函数定义中，`return`\
  \ 语句是可选的。函数可以选择发送一个返回值，也可以简单地执行函数体而不返回任何内容。大多数用户在代码执行后需要某些输出值，因此使用了 `return` 语句。它是函数体中的最后一条语句。如果\
  \ `return` 语句不是最后一条，那么函数将执行到 `return` 语句为止的代码并返回该。在返回值时，它将跳出函数作用域，因此 `return` 之后的语句将永远不会被执行。因此，将\
  \ `return` 放在代码中的最后一条语句是重要的。\n\n例如：\n\n```javascript\nfunction add(num1, num2) {\n\
  \  return num1 + num2;\n};\n\nvar result = add(2, 3);\nconsole.log(result) //prints\
  \ 5\n```\n\n### 4.3.2 函数表达式\n\n虽然之前的函数声明在语法上是一个语句，但也可以通过函数表达式来创建函数。创建的函数是匿名的；它们不需要名称，并被赋值给变量。由于函数也是对象，因此将它的引用值赋值给变量是完全有效的\
  \ 81。例如，函数 `square` 可以如下如下定义：\n\n```javascript\nconst square = function (number)\
  \ {\n  return number * number;\n};\n\nvar result = square(4); // result gets the\
  \ value 16\n```\n\n当将函数作为参数传递给另一个函数时，函数表达式非常方便。在下一个示例中，`map` 函数在语法上被定义，创建了另一个匿名函数并将其赋值给常量\
  \ `cubeCalculator`。此外，观察到 `cubeCalculator` 像其他对象一样被传递给 `map` 函数。\n\n```javascript\n\
  function map(placeHolder, a) {\n  let result = []; // Create a new Array\n  for\
  \ (let i = 0; i!= a.length; i + +)\n    result[i] = placeHolder(a[i]);\n  return\
  \ result;\n};\n\nconst cubeCalculator = function (x) {\n  return x * x * x;\n};\n\
  \nlet numbers = [0, 1, 2, 5, 10];\nlet cube = map(cubeCalculator, numbers);\nconsole.log(cube);\
  \ // prints 0, 1, 8, 125, 1000\n```\n\n上一个示例可以使用 `Array.prototype.map()` 方法执行，我们将在涵盖数组的章节中详细讨论\
  \ ([第 5 章)）。\n\n```javascript\nvar f = function (x) {\n  return x * x * x;\n}\n\n\
  let numbers = [0, 1, 2, 5, 10];\nlet cube = numbers.map(f);\nconsole.log(cube);\
  \ //prints [0, 1, 8, 125, 1000]\n```\n\n### 4.3.3 箭头函数表达式\n\n箭头函数表达式使用特殊的箭头 `=>`\
  \ 运算符编写匿名函数表达式的简写。这类函数有它们自己的优点和局限性。箭头函数总是返回某个值。箭头函数可以具有紧凑的体或块体 82。对于紧凑体，只需要单行表达式，不需要\
  \ `return` 语句。对于块体 `{}`，则需要 `return` 语句，如示例所示：\n\n```javascript\nvar func = x =>\
  \ x * x; // concise body syntax, implied \"return\"\n\nvar func = (x, y) => { return\
  \ x + y; };\n// 带有块体时，需要显式的 \"return\"\n```\n\n为了建立对箭头函数的基本理解，让我们通过演示如何将传统函数转换为箭头函数的示例来理解它们的原理。\n\
  \n```javascript\n// 计算 a 平方的传统函数\nfunction function (a) {\n  return a * a;\n};\n\
  \n// 转换为箭头函数的步骤\n/* 1. 移除 \"function\" 单词并在参数和起始体括号之间放置箭头，这是一个块箭头函数，意味着包含 {} 和 return\
  \ 语句 */\n(a) => {\n  return a * a;\n};\n\n/* 2. 移除体括号和 \"return\" 单词 -- 返回是隐含的，这是紧凑体样式\
  \ */\n(a) => a + 100;\n\n// 3. 我们甚至可以移除参数的括号。\na => a + 100;\n```\n\n#### 4.3.3.1\
  \ 箭头函数的局限性\n\n箭头函数为编写函数提供了非常简洁的风格，但它们也带有自己的局限性。简要指出如下：\n\n* 箭头函数不能作为方法，因为它们没有对 `this`\
  \ 和 `super` 自己的绑定。\n* 箭头函数不适用于 `call`、`apply` 和 `bind` 方法；这些方法用于建立作用域。\n* 箭头函数没有在使用传统方法时的那种\
  \ `arguments` 属性。\n* 箭头函数不能作为构造函数的简写。\n\n让我们通过一些示例来理解这些局限性的前两个。下一个示例演示了传统函数和箭头函数内部\
  \ `this` 的值。在这里，`demoObject` 创建了三个属性：`a`、`arrowFunction` 和 `traditionalFunction`，其中后两个分别是箭头函数和传统函数。此外，当通过\
  \ `demoObject` 对象调用这些方法时，我们可以观察到传统函数能够使用 `this` 引用打印值 10。相反，`arrowFunction` 通过 `this`\
  \ 打印了 `window` 对象。\n\n```javascript\nvar demoObject = {\n  a: 10,\n  arrowFunction:\
  \ function() {\n    console.log(this.a);\n  },\n  traditionalFunction: function()\
  \ {\n    console.log(this.a);\n  }\n};\n\ndemoObject.traditionalFunction(); // prints\
  \ 10\ndemoObject.arrowFunction(); // prints window object\n```\n\n\n\n`return` 语句可以将信息返回给调用它的变量。在函数声明中，它是可选的。它们可以放在代码的任何位置，但通常写在最后一条语句。当函数遇到\
  \ `return` 语句时，它会停止执行并返回到调用代码。函数中的多个 `return` 语句允许函数根据代码设计返回到其中任何一个位置。也可以使用空 `return`\
  \ 语句，它将向调用代码返回 `undefined`。\n\n### 4.4.2 调用函数\n\n声明函数仅指定了某组语句的作用，并将其绑定到一个名称上。为了实际执行这些语句，必须通过其名称对函数进行`called`（调用），或者说进行`invoked`（唤起）。在接下来的示例中，`square`\
  \ 函数通过参数 5 被调用，即 `square(5)`。结果随后存储在变量 `z` 中。函数应该存在于调用作用域内。\n\n```javascript\nconst\
  \ square = function (n) {\n  return n * n;\n} // 作为表达式的形式声明方法\n\nconsole.log(square(5));\n\
  // 使用参数调用 square\n```\n\n### 4.4.3 递归\n\n递归是重复任务的过程。在解决问题时，我们可以将其拆分并反复执行某些语句来解决眼前的更大问题。当对某段代码重复执行此操作时，它被称为`recursion`\
  \ [[83]](#ref-list.xhtml_refReferences_83)。演示递归的最佳示例是计算数字的阶乘。例如，如果我们需要计算 5 的阶乘；这是一个递归问题，解决方案非常简单。如果我们知道\
  \ 4 的阶乘值，以及后续 3 和 2 的阶乘值，最终已知 1 的阶乘为 1，就可以合并这些大问题来计算出 5 阶乘的实际问题。通过以下示例用程序化的演示了这一点：\n\
  \n```javascript\nfunction factorial(n) {\n  if ((n == 0) || (n == 1)) // 使用或逻辑运算符\n\
  \    return 1;\n  else\n    return (n * factorial(n - 1));\n  /* 递归调用自身直到满足终止条件\
  \ */\n};\n```\n\n### 4.4.4 闭包\n\n闭包是将嵌套函数绑定到其父函数局部变量的过程 [[84]](#ref-list.xhtml_refReferences_84)。这使得嵌套函数即使在父函数执行结束后也能使用这些局部变量\
  \ [[85]](#ref-list.xhtml_refReferences_85)。换句话说，闭包允许你从内部函数访问外部函数的作用域。\n\n在 JavaScript\
  \ 中，每当创建一个函数时都会创建一个闭包。下面的示例演示了闭包的使用。在这个示例中，我们定义了一个函数 `greeting(x)`，它接受一个参数 `x` 并返回一个新函数。它返回的函数接受一个参数\
  \ `y` 并返回 `x` 和 `y` 的拼接。我们通过分别向 `greetings` 函数传递 `Hi` 和 `Bye` 创建了两个函数表达式，即 `sayHi`\
  \ 和 `sayBye`。`greetings()` 返回的两个函数具有相同的函数体，但 `x` 的值不同（即 `Hi` 和 `Bye`）。在这里，`sayHi`\
  \ 和 `sayBye` 是从函数 `greetings()` 创建的闭包。\n\n```javascript\nfunction greeting(x) {\n\
  \  return function (y) {\n    return x + y;\n  };\n};\n\nvar sayHi = greeting(\"\
  Hi\");\nvar sayBye = greeting(\"Bye\");\n\nconsole.log(sayHi(\"Tom\")); // Hi Tom\n\
  console.log(sayBye(\"Tom\")); // Bye Tom\n```\n\n## 4.5 练习\n\n### 4.5.1 理论\n\n1.\
  \ 区分函数声明和函数表达式。\n2. 区分函数中属性（attributes）和属性（properties）的使用。\n3. 你是如何理解 JavaScript\
