  \n# 1 引言\n\nDOI: [10.1201/9781003122364-1](https://doi.org/10.1201/9781003122364-1)\n\
  \n> *C 语言提供的编程类型在使用量上可能会保持不变或缓慢下降，但相对而言，JavaScript 或其变体，或 XML 将继续变得更加核心*。\n\n> −丹尼斯·里奇\
  \ (Dennis Ritchie)\n\n`JavaScript` 是今天 Web 开发最流行的语言之一。它是一种简单、易用且易学习的语言，提供了灵活的工作模式。这就是为什么它现在被应用于其他领域，例如执行服务器端脚本、云服务，有时用于机器学习应用程序。在本章中，我们将介绍这种语言本身及其特性、优势和局限性。由于\
  \ `JavaScript` 是通过网络浏览器运行的，学习它变得非常重要。我们将讨论现代浏览器的结构，以及该语言的历史背景和至今的演变。最后，我们将学习一些向用户显示信息的方法，并学习代码的放置。建议读者在阅读文本的同时进行练习。这是学习该语言的最好方法。`JavaScript`\
  \ 是神奇的，你会喜欢学习它的。当你无法让它正常工作时，它有时会感到沮丧和抓狂，但当你让它按照你的意愿运行运行时，你会感到非常有成就感。\n\n## 1.1 Web\
  \ 开发简介\n\nWeb 开发是开发网站以向用户提供静态或动态内容的过程。在 Web 开发的早期，开发者的目标是向用户交付静态内容并允许在互联网上交换信息。随着时间的推移，利用\
  \ Web 进行业务和实时用户交互的机会开始出现，导致了一个全新的动态机会世界。从那时起，许多技术、编程语言、设计框架和方法运而生。然而，基础保持不变。\n\n\
  整个万维网根本上基于图 1.1 所示的三项技术三部曲，即 `HTML`（超文本标记语言）[[1]](#ref-list.xhtml_refReferences_1)、`CSS`（层叠样式表）[[2]](#ref-list.xhtml_refReferences_2)和\
  \ `JS`（JavaScript）[[3]](#ref-list.xhtml_refReferences_3)。`HTML` 是一种用于结构化、标记和在网页上放置内容的标记语言。`HTML`\
  \ 的主要目标是向网页用户提供信息，它使用标签来标记和结构化这些信息。随着 Web 的演变，对网页设计和美化的需求随之出现。因此，`CSS` 与 `HTML`\
  \ 集成，以使网页更符合用户的视觉审美。它极大地有助于管理网页的呈现和布局，使其既用户友好又有吸引力。最后，`JavaScript` 的出现为网页提供了动态行为。这种动态行为导致了交互式网页的出现，允许\
  \ 开发者从网页本身本地与用户进行交互。\n\n![](img/fig1_1.jpg)\n\n图 1.1 Web 技术的三部曲。\n\n`HTML` 与 `CSS`\
  \ 的结合使得 Web 内容在呈现方面更丰富、更更美。演变的下一个阶段是需要在这些网页中嵌入行为，使其更加生动，从而在本质上是动态的。`JavaScript`\
  \ 用于更改或定义网页的行为，因此被称为 Web 增强技术。它决定了网页如何对用户展示的不同输入和行为做出反应；例如链接的激活、提交前的用户检查。这三种技术的结合释放了\
  \ Web 开发的威力。最初，`JavaScript` 仅用于客户端，但今天它的应用已扩展到服务器端技术[[4]](#ref-list.xhtml_refReferences_4)。\n\
  \n## 1.2 客户端与服务器端 JavaScript\n\n为了理解客户端和服务器端的区别，我们将使用这个非常简单的示例。\n\n假设我们有一个非常基础网站，要求用户输入一个数字并打印该数字对应的数表。现在该应用程序的开发包含以下组件：\n\
  \n1. 托管在远程 Web 服务器上的静态输入页面（服务器端）。\n2. 带有应用程序服务器（服务器端）。\n3. 使用任何浏览器连接到 Web 服务器的客户端用户（客户端）。\n\
  \n该应用程序的工作可以分解为以下步骤：\n\n1. Web 服务器托管静态输入页面；可以使用域名或 IP 地址直接访问。\n2. 连接到互联网的客户端打开浏览器并输入域名或\
  \ IP 地址。\n3. Web 服务器将输入页面交付给客户端。\n4. 网页包含所有的 `HTML` + `CSS` 代码；这些代码由网络浏览器解析并显示给客户端。\n\
  5. 客户端现在输入数字（例如 2）并将此请求发送回 Web 服务器。\n6. 此请求将由 Web 服务器解析并传递给应用程序服务器。应用程序服务器现在将为请求实时生成网页并传回\
  \ Web 服务器。\n7. Web 服务器将此动态网页发回用户。\n8. 响应仍然包含所有的 `HTML` + `CSS` 代码，但这次是根据用户提供的输入动态生成的。\n\
  \n\n\n\n\n在本示例中，使用`client-side JavaScript`（客户端 JavaScript）可以省略 (e)–(h) 中执行的步骤。Web\
  \ 服务器可以在静态页面内部包含 JavaScript 代码（HTML + CSS + JS）；接收到此页面后， 浏览器可以在本地机器上执行 JS 代码，动态页面的生成仅在客户端本地完成。\n\
  \n这是一个非常基础的示例，用于理解如何减少网络上的请求/响应调用次数。你发现在类似的情况下会使用客户端 JS，例如从远程服务器获取数据、使用 JavaScript\
  \ 将数据可视化、建立异步数据库连接以及许多其他此类场景。\n\n最新的技术和框架，如 `Node.js` [[5]](#ref-list.xhtml_refReferences_5)、`React.JS`\
  \ [[6]](#ref-list.xhtml_refReferences_6) 和 `Angular.JS` [[7]](#ref-list.xhtml_refReferences_7)\
  \ 有助于高级后端应用程序服务器的部署。所有这些框架都将使用服务器端脚本。\n\n 浏览器、运行它的系统以及用户共同组应用程序的`client side`（客户端）。应用程序的`server\
  \ side`（服务端）由 Web 服务器、应用程序服务器以及相关的应用程序组成。Web 之所以动态运行，是因为这两个者之间的交互。图 1.2 描述了客户端与服务器之间的通信流。\n\
  \n![](img/fig1_2.jpg)\n\n图 1.2 客户端和服务端的脚本编写。\n\n在 Web 开发的早期，用户向服务器请求页面，服务器在接受请求后搜索数据库并返回所标记的页面。HTML\
  \ 被用作标记语言来标记页面内包含信息的区域。一旦页面被发送，在用户通过另一个请求做出响应之前，服务器将没有任何控制权。\n\n随着用户浏览器以及服务器处理能力的增强，Web\
  \ 出现了一种新型的 Web 应用程序。服务器响应用户的请求并发送 `web application`（Web 应用程序）而不是静态页面，被称为`client-side\
  \ application`（客户端应用程序），它在用户的浏览器上执行。这些是嵌入在网页 HTML 代码中的小型应用程序，并根据用户的响应进行动态执行，无需在\
  \ Web 服务器上往返。\n\n## 1.3 JavaScript 的起源、历史与演变\n\nJavaScript 由 Brendan Eich 在 1995\
  \ 年创建，目标是通过 NetScape Navigator 浏览器让 `web` 交互化 [[8]](#ref-list.xhtml_refReferences_8)。1995\
  \ 年，万维网正变得兴起，Netscape Navigator 是当时最流行的 浏览器之一。HTML 主要用于创建显示在网页上的静态内容。随着 JavaScript\
  \ 的引入，这些网页也变得具有响应式和交互性。这增加了探索 Web 的整体价值和终端用户体验。\n\nJavaScript 最初在代名 `Mocha` 下开发。它在\
  \ 1995 年 9 月发布 `beta` 版本时被命名为 `LiveScript` [[9]](#ref-list.xhtml_refReferences_9)。它在\
  \ 1995 年 12 月再次更名为 `JavaScript`。关于 JavaScript 的一个误解是它与 Java 编程语言有关，但 `Java` 和 `JavaScript`\
  \ 除了语法设计上的微小相似之处外，共同点非常少。`Java` 在当时是一种非常流行的语言，Sun（现为 Oracle）使用 `JavaScript` 这个名字是一种营销策略。正如\
  \ Christian Heilmann 所说，“Java 之于 JavaScript 就像汽车之于地毯” [[10]](#ref-list.xhtml_refReferences_10)。\n\
  \n### 在 Web 市场上声名鹊起，并在 1996 年正式提交给 `ECMA`（欧洲计算机厂商协会）进行标准化 [[11]](#ref-list.xhtml_refReferences_11)。标准化过程花费了一些时间，并正式称为\
  \ `ECMAScript` 或 `ECMA-262` [[12]](#ref-list.xhtml_refReferences_12)。然而，由于它的流行，与官方名称相比，人们更多地采用\
  \ `JavaScript` 这个名字。`ECMA`至今仍负责 JavaScript 的开发和标准化。它确保了新版本的兼容性，从而允许跨浏览器的操作性。自 1996\
  \ 年以来已发布了多个版本的语言。`JavaScript 2` 和 `JavaScript 3` 分别于 1998 年和 1999 年发布。\n\n开发者对 JavaScript\
  \ 的使用不断进步，并在 2005 年取得了突破。James Garett 发表了一篇论文描述了 JavaScript 支持的一系列技术。他在相同的背景下创建了\
  \ `AJAX` 术语。此外，`JQuery` [[13]](#ref-list.xhtml_refReferences_13)、`Dojo` [[14]](#ref-list.xhtml_refReferences_14)\
  \ 和 `Prototype` 也于同年发布，它们与 JavaScript 良好集成。所有因素进一步增强了 JavaScript 的采用率。\n\n`ECMAScript\
  \ 技术委员会`（也称为 `TC39`）负责维护该语言 [[15]](#ref-list.xhtml_refReferences_15)。JavaScript\
  \ 标准现在由 `TC39` 每年修订，现代浏览器随后根据规范进行更新。这导致了 JavaScript 的持续发展，并解决了它以前的许多问题。来自不同前线的协作努力使得\
  \ JavaScript 在市场上获得了广泛接受。\n\n最初，JavaScript 作为一种脚本语言出现，但上述对 JavaScript 标准的发展导致了该语言的彻底转型。它演变成了一种健壮、安全、动态且通用的语言，非常适用于前端、后端和大规模软件开发。\n\
  \n今天，约 90% 的网站代码中使用 JavaScript。这种巨大的采用和普及让新开发者学习 JavaScript 的功能至关重要。新的特性、技术、框架等不断被整合到\
  \ JavaScript 中。它已演变为事实上的标准 Web 编程语言。许多特性使 JavaScript 成为广泛采用的语言。这些特性将在下一节中讨论。\n\n\
  ## 1.4 JavaScript 的特性\n\n大多数网页使用 JavaScript 使 Web 更加动态并对用户做出响应。JavaScript 是一种高级、动态、解释型、基于原型的编程语言，支持面向对象、事件驱动和函数编程风格。在本节中，重点介绍\
  \ JavaScript 在开发者中如此流行的的一些关键特性。\n\n- **平台无关**：JavaScript 是一种平台无关的编程语言。因此，可以在任何平台上运行，使其成为一种多功能且易于使用的语言。大多数内置\
  \ JavaScript 解释器的浏览器支持它。\n- **DOM 操作**：`DOM` 代表文档对象模型，允许对网页内的 HTML 组件进行操作 [[16]](#ref-list.xhtml_refReferences_16)。在\
  \ Web 开发早期，大多数 Web 的操作是静态的。DOM 操作是 JavaScript 产生的关键原因之一，它的引入改变了现代 Web 的面貌。\n- **日期和时间**：JavaScript\
  \ 为需要访问日期时间工具的操作提供了内置方法。这允许用户在他们的浏览器中拥有自定义内容。\n- **客户端和服务端编程语言**：JavaScript 最初仅提供客户端脚本。今天，JavaScript\
  \ 提供了运行客户端和服务端应用程序的能力。这使得它更加受欢迎，因为开发者可以仅通过使用 JavaScript 来开发完整的应用程序。\n\n\n\n\n\n\
  *   **用户数据验证与客户端数据处理：** JavaScript 用于在客户端验证用户输入的数据，从而消除了发送到服务器的需求。由于代码在客户端执行，JavaScript\
  \ 相比 Web 服务器对浏览器具有更强的控制力。它还允许 Web 服务器检查浏览器类型、操作系统、屏幕尺寸等。所有这些有助于生成更具意义的脚本，减少服务器端的开销，并更充分地利用客户端资源。\n\
  *   **将函数当作对象：** JavaScript 中的函数被视为对象，可以同时拥有属性和方法。函数可以作为参数传递给其他函数，可以被嵌套，可以作为异常抛出等。这种操作函数的灵活性使得这种语言易于操作，并且更适合处理现实应用场景。\n\
  *   **箭头函数：** 它们被引入语言中是为了使语法的使用和编写变得简单简单。它们是轻量级函数，可以用于编写匿名函数。\n*   **模板字符串（Template\
  \ literal）：** 它允许开发者将变量值存储在字符串中，因此成为一个重要的工具。这让开发者能够更多地关注应用程序的逻辑和开发，而不是关注语法的细节。\n\
  *   **事件处理：** 每当事件发生时，就可以执行该事件发生的相应例程。这种特征被称为事件处理，JavaScript 大量使用它来响应网页上的用户活动，如\
  \ `onClick`、`onLoad`、`onSelect`行为。\n\n## 1.5 优势与局限性\n\n与其他任何编程语言一样，使用 JavaScript\
  \ 也有固有的优缺点。在本节中，我们概述了使用 JavaScript 的优势和局限。以下是 JavaScript 提供的优势：\n\n*   **执行速度：**\
  \ JavaScript 是一种解释语言，这意味着代码在执行之前不需要编译。JavaScript 代码中的语句在加载到浏览器时就会执行。总来说，这减少了开销，并提高了网页中\
  \ JavaScript 代码的执行速度。\n*   **易于学习和简单：** JavaScript 对于新手和资深开发者来说都很容易理解、学习和使用。简单结构的使用以及实现动态内容的可行性使得\
  \ JavaScript 成为 Web 开发的热门选择。\n*   **互操作性：** JavaScript 可以轻松地嵌入到任何其他编程语言或网页内部。开发者可以轻松使用它为内容添加新功能，而无需任何额外的开销。\n\
  *   **客户端执行与验证：** 脚本由服务器发送到客户端，由客户端 浏览器执行脚本。数据验证也大部分发生在客户端，而不是在每次输入数据时查询服务器端。这减少了服务器端的负载并节省了大量的执行时间。\n\
  *   **丰富的接口和扩展的功能：** JavaScript 提供了一系列丰富的接口，使开发者能够创建丰富的网页，例如可拖放的窗口、滑滑等等。使用此类接口增加了网页上的用户交互性。JavaScript\
  \ 还通过允许使用第三方插件提供了扩展功能。这让开发者能够复用代码，并使编程变得更加快速和容易。\n\n尽管 JavaScript 提供了许多功能和优势，但它也存在一些局限性，列举如下：\n\
  \n*   **读写文件：** JavaScript 不允许网页在客户端读取或向文件写入内容。考虑到安全因素，JavaScript 不允许访问操作系统。然而，这在\
  \ Web 浏览器提供的 `HTML5 Local Store` 中是开启的。\n*   **多线程：** JavaScript 不提供多线程或多进程能力。Web\
  \ 浏览器不允许单个网页并发使用多个线程以避免并发问题。然而，多个标签页可以拥有各自独立的线程并在其上工作。\n*   **客户端安全：** 由于代码在客户端执行，代码变得容易被修改。网页的源代码对客户端的任何人都是可见的。恶意用户可以篡改源代码或在网站中放置其他代码。这可能导致客户端安全受损。\n\
  *   **浏览器支持：** 不同的浏览器解释代码的方式不同。因此，在发布最终使用之前，必须在多个浏览器上运行代码。这为开发者带来了不必要的开销，需要多次测试和运行代码，以确保网页在加载时不会崩溃。\n\
  *   **调试：** JavaScript 是一种非常灵活的基于原型的语言，因此有时很难识别错误来源。继承自多个原型、接口和对象创建了紧密的关系。除非显式处理，否则\
  \ Web 浏览器不会专门显示错误。单个错误可能会停止网页其余部分的渲染。这导致大型规模程序的调试变得困难。\n*   **继承：** JavaScript 仅支持单继承。不支持多重继承。在考虑面向对象方面时，这成了一个问题。\n\
  *   **开销：** JavaScript 将数字存储为 64 位，而位运算符操作的是 32 位数字。由于此原因，JavaScript 会将 64 位数转换为\
  \ 32 位等值数，对其进行操作，然后转换回来。持续的转换需要更多时间，从而降低了执行速度。这种往返转换在程序中产生了开销。另一个开销的原因是 JavaScript\
  \ `DOM` 的渲染缓慢，导致无论解释器的执行速度如何，都会产生额外的开销。\n\n所有这些因素限制了 JavaScript 在某些情况下的使用，但无论如何，其优势远大于局限性。因此，它在市场上被开发者广泛接受，并主导了大部分\
  \ Web。\n\n## 1.6 浏览器结构\n\nWeb 浏览器是一种向用户显示 Web 内容的软件应用程序。它是一个功能完整的软件，执行一系列任务，如请求、检索、处理和显示\
  \ Web 内容。它是一个用于解释 Web 内容的图形界面，包括封装在 `HTML`、`CSS` 中的 `JavaScript` 等。\n\n浏览器运行的系统是\
  \ Web 开发客户端服务器模型中的客户端。还可以安装插件，以扩展浏览器的功能。如今市场上有很多类型的 Web 浏览器，如 `Mozilla Firefox`\
  \ 17、`Internet Explorer` 18、`Safari` 19、`Chrome` 20、`Netscape Navigator` 21 等。\n\
  \nWeb 浏览器由一组执行特定任务的组件组成。这些组件将在后文中简要解释，并在图 1.3](#ch01.xhtml_fig1_3) 中所示。\n\n![images/fig1_3.jpg)\n\
  \n图 1.3 浏览器结构\n\n*   **用户界面：** 它是用户与浏览器交互并向 Web 服务器发送请求的空间。通常它包括地址栏、后退按钮、前进按钮、刷新按钮、书签选项、设置、密码、历史记录等。\n\
  \n\n\n\n\n- **浏览器引擎：** 它用于接收来自用户界面的输入并执行查询。然后数据会被传递给渲染引擎进行进一步处理。浏览器引擎是连接用户界面和渲染引擎的桥梁。\n\
  - **渲染引擎：** 它负责解释和执行代码以向用户显示网页。它解释服务器作为响应发送的 `HTML`、`CSS` 代码并将其显示在用户界面上。渲染引擎有许多类型，不同的浏览器使用不同的渲染引擎。Internet\
  \ Explorer 使用 `Trident` [[22]](#ref-list.xhtml_refReferences_22)，Mozilla Firefox\
  \ 使用 `Gecko` [[23]](#ref-list.xhtml_refReferences_23)，Chrome 和 Opera 使用 `Blink`\
  \ [[24]](#ref-list.xhtml_refReferences_24)，而 Safari 使用 `WebKit` [[25]](#ref-list.xhtml_refReferences_25)。\n\
  - **JavaScript 解释器：** 为了执行 JavaScript 代码，有一个特殊的组件——JavaScript 解释器，它将响应发送给渲染引擎。然后会在用户界面上显示。\n\
  - **网络模块：** `Networking` 组件通过 `HTTP` 或 `FTP` 等网络协议处理 URL 获取。它主要负责维护代码的通信安全性。它还可以实现缓存以减少网络拥塞。它用于在用户界面（`UI`）上创建基础组件（包括框等），其底层操作使用特定于操作系统的方法。\n\
  - **数据存储与持久化：** 该组件在网络、浏览器和源代码之间维持持久化。它是安装浏览器的存储位置中存在的数据库。通过使用该存储，浏览器能够支持 `localStorage`、`IndexedDB`\
  \ 和 `WebSQL` 等存储机制。\n\n## 1.7 说 Hello World\n\n到目前为止，我们已经讨论了当今网页中使用的一些概念。现在是时候使用\
  \ JavaScript 向用户说 `Hello World` 了。我们还将讨论一些常用的方法。对于这些示例，你可以在保存为 `.html` 扩展名的文本框中编写完整脚本并在\
  \ Google 浏览器中打开，或者简单地打开 Google 浏览器并按下 `Option + J`（MacOS）或 `Shift + J`（Windows/Linux）。这将打开网络浏览器上的控制台。在控制台中输入脚本和下述代码即可查看输出。别担心；我们稍后会有很多带有的示例供你尝试。\n\
  \nJavaScript 代码始终编写在 `<script>` 标签内。该标签代表代码的脚本部分，位于 `body` 或 `head` 标签内，或者放在单独的文档中。此示例使用了\
  \ `console.log` 和 `alert()` 方法；两者将在后续章节中讨论。\n\n```javascript\nconsole.log(\"Hello\
  \ World on console!\");\nalert(\"Hi This is an Alert for you, you will see this\
  \ in pop-up. Have fun!\");\n```\n\n### 1.7.1 内置函数\n\nJavaScript 提供了一些内置函数，通过浏览器窗口向用户显示消息。这些消息可以通过\
  \ `alert()`、`prompt()`、`console.log()` 和 `document.write()` 函数通过弹出窗口显示。这些对话框为我们提供了显示信息、获取输入或从用户处获取任何确认的能力。使用这些函数，我们可以与用户交互。每个函数都有其向用户显示消息独特的方式。\n\
  \n- `alert()` 用于在网页上显示消息。使用 `alert()` 会触发一个带有指定消息的弹出窗口。它提供一个带有“ok”按钮的对话框。这通常用于向用户提供某些警告或信息\
  \ [[26]](#ref-list.xhtml_refReferences_26)。\n\n```javascript\nalert(\"Hi This is\
  \ an Alert for you, you will see this in new pop-up.\");\n```\n\n- `confirm()` 是用于向用户请求确认的内置函数。它显示消息并为用户提供两个按钮：“ok”和“cancel”\
  \ [[27]](#ref-list.xhtml_refReferences_27)。\n\n```javascript\nconfirm(\"Are you\
  \ Sure?\");\n```\n\n- `prompt()` 对话框用于用户处获取输入。`prompt()` 函数显示两部分信息：一个是显示在对话框中的消息或标签，另一个是显示的默认字符串。它还为用户提供两个按钮，`ok`\
  \ 和 `cancel`。如果用户输入了某些值并选择 `ok`，则该值将返回给代码。如果用户选择 `cancel`，则函数将向调用代码返回 `null` [[28]](#ref-list.xhtml_refReferences_28)。\n\
  \n```javascript\nage = prompt(\"Enter Age\");\nalert(\"Your entered age value is:\"\
  \ + age);\n```\n\n- `document.write()` 用于我们任何想要将内容打印到 `HTML` 页面上的时候。它是在网页上显示内容的简单、易用的方法\
  \ [[29]](#ref-list.xhtml_refReferences_29)。\n\n- `console.log()` 简单地在网络浏览器窗口上显示消息。它主要用于调试目的\
  \ [[30]](#ref-list.xhtml_refReferences_30)。\n\n```javascript\nconsole.log(\"Hello\
  \ World via the console!\");\n```\n\n### 1.7.2 软件工具\n\nJavaScript 代码主要在网络浏览器中执行。它是一种解释性语言，提供了更执行速度。JavaScript\
  \ 基于事件的特性使其更具交互性，并且仅执行用户需要的代码段。现代网络浏览器都支持运行基于 JavaScript 代码。\n\nJavaScript 生态系统包含许多帮助开发者开发、调试和支持的工具。JavaScript\
  \ 开发者广泛使用各种工具、框架和库。这三者之间存在着非常微妙的界限，区分本身可能很困难。因此，在详细讨论此类工具之前，我们先定义这些术语并区分它们。\n\n\
  - **框架 (Framework)：** 它是一种抽象，提供了一种标准的方式来交付主要功能，如事件、存储、数据绑定等。框架是以良好的、架构化的解决方案的形式向用户交付一组功能的最全面的手段。\n\
  - **库 (Library)：** 它是函数的集合，旨在解决某些功能以执行任务。换句话说，库是涵盖单个主题或功能的紧密相关的函数集。\n- **工具 (Tools)：**\
  \ 这些是短小的代码片段，旨在通过协助开发者维护代码、性能、编译器等来使开发过程更加顺畅。\n\n#### 1.7.2.1 框架、库和工具的示例\n\n- **React.JS：**\
  \ 它是 Facebook 在 2011 年开发的库，后来被宣布为开源，从而允许开发者根据意愿访问、使用和修改它。它提供了一种渲染网页内容和创建高性能动态用户界面的方法。库中的组件是独立的，因此可以复用。在进行系统升级时复用组件非常有帮助，因为可以节省大量时间\
  \ [[6]](#ref-list.xhtml_refReferences_6)。React Native 是基于 `React.JS` 库的移动应用程序开发框架。\n\
  - **Express.js：** 它是用于使用 `Node.js` 构建网站的 JavaScript 框架。Express.js 是一个健壮、稳定、快速且易用的框架。它对于构建单页应用程序、HTTP\
  \ API 和网站以及路由非常有用 [[31]](#ref-list.xhtml_refReferences_31)。\n\n\n\n\n\n*   **Angular.js:**\
  \ 这是一个由 Google 提供的 JavaScript 框架，用于构建客户端应用程序。Angular.js 是一种模型-视图-控制器 (MVC) 类型的框架，从而让开发者能够专注于数据库、界面和链接，而由框架来处理这些工作。它本身是编写快速单页应用程序的强大解决方案。它是流行的\
  \ MongoDB, Express, Angular 和 Node (MEAN) 软件开发栈的一部分 [[7]](#ref-list.xhtml_refReferences_7)。它提供了如跨平台支持、代码分割、命令行工具、单元测试和双向数据绑定等功能。\n\
  \n*   **Electron:** 这是一个用于构建跨平台网站和应用程序的框架。它基于 Chromium 引擎和 Node.js。它主要用于桌面应用程序，因为它支持\
  \ HTML、CSS 以以及 JS [[32]](#ref-list.xhtml_refReferences_32)。\n\n*   **NPM:** 它是一个功能强大的工具库，为\
  \ JavaScript 开发者提供支持。它提供了构建工具，作为包和任务管理器工作，并作为为开发者提供可重用脚本的注册表。Node Package Manager\
  \ 脚本支持跨平台，并用于默认任务以及开发者特定的任务。它提供了设计、编写和执行用于测试和开发的独立脚本的能力 [[33]](#ref-list.xhtml_refReferences_33)。\n\
  \n*   **Gulp:** 它是一个用于自动化处理源文件加载、构建、编译、验证和测试任务的工具包。这些任务是单调的，通常需要开发者花费大量精力。通过使用像\
  \ Gulp 这样的特定工具，这些重复任务可以轻松自动化，从而带来更好的性能和代码利用 [[34]](#ref-list.xhtml_refReferences_34)。\n\
  \n*   **Webpack:** 它是一个用于将 JS 模块及其依赖项按顺序打包到浏览器中的工具。它可以分割代码以获得更性能，在运行时进行优化，将任务打包，在编译期间解析依赖并支持插件\
  \ [[35]](#ref-list.xhtml_refReferences_35)。\n\n*   **ESLint:** 分析代码是否存在如缺少冒号或括号等缺陷的过程被称为\
  \ `linting`（代码检查）。ESLint 是一个 JavaScript 代码检查工具。它支持插件并可以由开发者根据需求进行配置。\n\n*   **Vue.js:**\
  \ 这是一个基于 Angular 框架构建的开源轻量级框架，旨在开发渐进式用户界面 [[36]](#ref-list.xhtml_refReferences_36)。它提供了路由、动态动画和数据绑定的工具。\n\
  \n*   **jQuery:** 这是构建客户端应用程序、插件和用户界面最流行的库。互联网上超过 70%的网站使用 jQuery 构建，包括 Google、DailyMotion\
  \ 和 Microsoft Network [[37]](#ref-list.xhtml_refReferences_37)。它提供了轻量级功能、动画、Ajax\
  \ 调用和优化功能。\n\n## 1.8 代码的放置\n\nHTML 是一种使用标签来放置和结构化内容的标记语言。HTML 中的起始标签和结束标签具有相同的名称。唯一的例外是结束标签带有一个正斜杠\
  \ (`/`)。JavaScript 代码大部分放置在 HTML 标签内部。JavaScript 代码放置在 `<script> ... </script>`\
  \ 标签中。可以通过以下任何一种方式实现：\n\n*   在 head 标签内部。\n\n```html\n<html>\n<head>\n<script type=\"\
  text/javascript\">\n//javascript code can be placed here\n</script>\n</head>\n<body>\n\
  <h1> Test Data </h1>\n</body>\n</html>\n```\n\n*   在 body 标签内部。\n\n```html\n<html>\n\
  <head>\n</head>\n<body>\n<script type=\"text/javascript\">\n//javascript code can\
  \ be placed here\n</script>\n<h1> Test Data </h1>\n</body>\n</html>\n```\n\n*  \
  \ 将 JavaScript 代码放置在 `<body>` 标签的尾被认为是一种良好实践。这确保了 `<head>` 和大部分 HTML `<body>` 内容在\
  \ JavaScript 代码触发之前加载。\n\n```html\n<html>\n<head>\n</head>\n<body>\n<h1> Test Data\
  \ </h1>\n</body>\n</html>\n<script type=\"text/javascript\">\n//javascript code\
  \ can be placed here\n</script>\n```\n\n*   JS 代码也可以保存在外部文件中，然后在 HTML 的 `<head>`\
  \ 部分中引用它。外部文件应包含 JavaScript 代码并必须以 `.js` 扩展名保存。优选使用外部文件放置 JavaScript 代码，因为这有助于网页内容与行为的分离。维护单个源文件更容易，也允许我们重用相同的代码。\n\
  \n```html\n<html>\n<head>\n<script type=\"text/javascript\" src=\"filename.js\"\
  >\n</script>\n</head>\n<body>\n<h1> Test Data </h1>\n</body>\n</html>\n```\n\n##\
  \ 1.9 练习\n\n### 1.9.1 理论\n\n1.  列出 JavaScript 语言的特性。\n2.  使用 JavaScript 有什么好处和挑战？\n\
  3.  讨论 JavaScript 自诞生以来作为一种语言的演变。\n4.  详述现代网络浏览器中的不同组件。使用不同的组件解释网络浏览器的工作原理。\n5.\
  \  区分客户端和服务器端 JavaScript 的用法。讨论必须使用这些用法的情况。思考并设计你自己的用例。\n6.  编写一个完整的脚本，使用 `console`\
  \ 打印“Hello.world”。\n7.  创建一个显示警告框的文档。\n\n### 1.9.2 判断题\n\n1.  JavaScript 源自 Java。\n\
  2.  JavaScript 独立工作以交付页面。\n3.  JavaScript 可以写在独立文件中并嵌入 HTML 中。\n4.  JavaScript 支持多线程。\n\
  \n### 1.9.3 单选题\n\n1.  JavaScript 写在什么标签标签内？\n    *   `<html>`\n    *   `<head>`\n\
  \    *   `<script>`\n    *   `<body>`\n2. 哪些语言构成了网络技术的铁三角？\n    *   HTML, XML, CSS\n\
  \    *   CSS, HTML, JavaScript\n    *   JavaScript 和 XML\n    *   以上都不是\n3.  哪些不是\
  \ JavaScript 的特性？\n    *   它是轻量级的。\n    *   它是一种基于原型的面向对象语言。\n    *   它是一种标记语言。\n\
  \    *   它可以处理日期和时间事件。\n4.  JavaScript 由什么公司开发？\n    *   Dell\n    *   Bell Labs\n\
  \    *   Netscape\n    *   Microsoft\n5.  JavaScript 在其构思之时的原始名称是什么？\n    *   LiveScript\n\
  \    *   NewScript\n    *   Mocha\n    *   JavaScript\n6.  JavaScript 是一种 _______________、_______________\
  \ 编程语言。\n    *   高级、面向对象的\n    *   面向对象的、基于原型的\n    *   高级、汇编的\n    *   以上都不是\n\n\
  # 2 构建基础\n\nDOI: [10.1201/9781003122364-2](https://doi.org/10.1201/9781003122364-2)\n\
  \n> *你应该想象变量是触角，而不是盒子。它们不包含值，它们抓住了值——两个变量可以引用同一个值*.\n\n> \n\n> –Marijn Haverbeke\n\
  \n到为止，我们涵盖了 JavaScript 的历史和介绍。本章将带你深入理解语言结构和基础。在使用任何语言构建解决方案之前，我们需要数据是如何存储和转换的。本章讨论了基础构建块，例如如何声明变量、使用数据类型并对其进行操作、学习文档的词法结构、用于数据操作的运算符、决策语句和控制流操作。\n\
  \n## 2.1 词法结构\n\n\n\n\n词法结构定义了任何编程语言最低层次的标记（tokens）。词法结构是一组用于从字符序列形成有效标记的基元规则 [[38]](#ref-list.xhtml_refReferences_38)。一个标记由标识符、关键字、标点符号、字面量或操作符组成。语言的特定特性，如字符集、变量命名、注释、终止符等，都用于定义词法结构；例如，它定义了变量应该如何命名、如何在代码中加入注释或如何进行换行等。\n\
  \n## 2.2 字符集\n\n字符集定义了源程序可以使用或在程序运行时被解释的有效字符 [[39]](#ref-list.xhtml_refReferences_39)。JavaScript\
  \ 使用 Unicode 字符集的 16 位表示法进行编程；这允许程序员在任何支持 UNICODE 的语言中使用某些符号作为标识符，例如 `∏`（pi）或 `λ`（lambda）。Unicode\
  \ 字符集是 ASCII 字符集的超集 [[40]](#ref-list.xhtml_refReferences_40)。为了代码的可移植性和易用性，大多数程序员在代码中使用\
  \ ASCII 字符集。\n\n### 2.2.1 空格和注释\n\n空白用于分隔代码中存在的不同标记，JavaScript 解释器会忽略代码段内或标记之间的空白。这允许我们有意识地使用换行和空格来缩进代码，使其更易理解。这有助于保持代码整洁且一致。JavaScript\
  \ 允许我们使用换行符、回车和换行序列作为行终止符。行终止符也可用于为编写代码创建确定的风格。\n\n以下字符被视为空白：空格（U + 0020）、换行符（U\
  \ + 000A）、回车（U + 000D）、水平制表符（U + 0009）、垂直制表符（U + 000B）、分页（U + 000C）和空字符（U + 0000）。\n\
  \n很多时候，一个开发者编写的代码将来可能会由另一个开发者进行调试、维护或处理。合理使用注释有助于新开发者理解和处理代码。某些系统甚至可以根据代码中的注释生成有的报告。当行以\
  \ `//` 开头并换行结束时，解释器会将注释视为空白。多行注释使用符号 `/*` 和 `*/` 表示。这两个符号之间的任何内容都被视为注释。以下示例演示了这两种注释的使用。\n\
  \n```javascript\n//Demo Comments\n\n<script>\ndocument.write(\"Hey there, reader\"\
  )\n\n// printing a line of code\n\n/* THIS IS A MULTI LINE COMMENT\nTHIS LINE WILL\
  \ ALSO BE OMMITED */\n</script>\n```\n\n### 2.2.2 大小敏感\n\nJavaScript 是一种大小写敏感的语言，即\
  \ `name`、`Name`、`NAME` 和 `NaMe` 都是不同的。编写代码时，请注意字母的大小写。大多数代码使用小写字母编写，因为容易阅读且避免了不必要的复杂性。建议对变量和函数命名遵循标准的编码规范。`firstNumber`\
  \ 和 `addNumbers()` 分别是变量和函数使用驼峰命名法的示例。\n\n### 2.2.3 分号\n\n像 C 和 Java 这样的大语言使用分号来结束一行代码。不同的是，JavaScript\
  \ 对分号有可选性要求，从而为开发者提供了灵活性。然而，如果你在单行代码中编写了多个语句，则使用分号来告诉解释器该行中有多个语句，需要分别执行。\n\n###\
  \ 2.2.4 字面量\n\n字面量仅仅是类型值的源代码表示。字面量的值在程序中直接使用，且不具有类型。字面量可以是数值、小数、字符串和布尔值。接下来给出示例。\n\
  \n```javascript\n89 //Integer Literal\n7.99 //Floating Point Literal\n\"Hello JavaScript\"\
  \ //String Literal\ntrue //Boolean Literal\n```\n\n### 2.2.5 标识符\n\n标识符是赋予字面量、变量、函数、属性或类的名称。该名称用于唯一标识变量、函数、属性或类。标识符在作用范围内是唯一的，在命名标识符时必须遵循以下严格命名规范\
  \ [[41]](#ref-list.xhtml_refReferences_41)。\n\n- 标识符名称必须以字母（a–z 或 A–Z）、下划线 (_)或美元符号（$）开头。\n\
  - 在第一个字母（a-z, A-Z, _, $）之后，我们也可以使用数字（0–9）。\n- 标识符名称大小大小敏感。\n- 保留关键字不能作为标识符。\n\n\
  根据上述约束，给出一些有效标识符示例：\n\n```javascript\nname; //valid name\nName; //valid “name” and\
  \ “Name” are different\n_id; //valid name\n#id; //not allowed\n_revisedID // allowed\n\
  void; //not allowed, ‘void’ is a reserved keyword\n```\n\n### 2.2.6 关键字\n\n每个编程语言都预留了一些关键字作为语言本身的一部分\
  \ [[42]](#ref-list.xhtml_refReferences_42)。这些关键字称为保留关键字。它们不能作为标识符。以下是 JavaScript\
  \ 语言的一些保留关键字；列表不仅限于这些（表 2.1）。\n\n表 2.1 JavaScript 中的关键字\n\n| break | switch | do\
  \ | while |\n| :--- | :--- | :--- | :--- |\n| if | else | for | forEach |\n| instanceof\
  \ | typeof | let | export |\n| var | return | class | null |\n| throw | void | extends\
  \ | new |\n| catch | continue | function | switch |\n| ifelse | break | yield |\
  \ case |\n\n## 2.3 变量\n\n变量是赋予 JavaScript 中存储位置的名称。这些存储位置可以通过直接引用分配的名称来存储任何类型的数据。变量命名使用了上一节的标识符规范。与传统的编程语言（C,\
  \ Java）不同，JavaScript 是一种弱类型语言，声明变量时不需要提供变量类型 [[43]](#ref-list.xhtml_refReferences_43)。\n\
  \n### 2.3.1 变量声明和作用域\n\nJavaScript 中变量的作用域可以是局部的或全局的。根据变量作用域的需求，可以在有效标识符之前使用 `var`\
  \ 或 `let` 关键字声明。\n\n```javascript\nlet localVariable;\n```\n\n这些变量在函数或块开始执行时创建，并在块作用域结束时删除。同名的变量可以在函数局部作用域之外（即全局作用域）使用。\n\
  \n同样，如果变量需要在全局作用域内，则使用 `var` 关键字声明。全局变量可以在程序的任何地方访问。创建全局变量的示例所示：\n\n```javascript\n\
  var globalVariable;\n```\n\n如果在创建变量时没有提供值，它将自动取 `undefined` 值，直到你为其赋值。局部和全局变量都可以在创建时初始化；这在接下来的示例中：\n\
  \n```javascript\nlet localVariable = 10; //Declare and Initialize\nlet globalvariable\
  \ = 20; //Declare and Initialize\n```\n\n使用 `var` 和 `let` 声明的变量之间还有一些区别，如下：\n\n\n\
  \n\n\n*   如果使用 `var` 关键字创建变量，则可以重新声明，而使用 `let` 关键字创建的变量则无法重新声明。\n\n*   我们可以通过在块外部或内部定义使用\
  \ `var` 关键字来创建全局或局部变量。对于使用 `let` 声明的变量来说是不可能的，因为它们始终是块内的局部变量，且无法通过其他对象访问。\n\n这两种场景可以在下一个示例中看到：\n\
  \n```javascript\nvar dogName = ”American Aketa”; //全局作用域内\n\nfunction dogType()\
  \ {\n\nvar dogName = ”Ojo”;\n\n// dogName 被重新声明，且是一个局部变量\n\n};\n```\n\n你可能对变量的可访问性产生很多问题：在什么时候调用哪个变量？由谁来决定使用哪个值以及何时使用？所有这些问题的答案都在变量的作用域（scope）中！\n\
  \n变量的作用域定义了确定使用哪个变量值以及在何处可以访问该变量的规则。\n\n让我们在图 2.1 参考 [[44]](#ref-list.xhtml_refReferences_44)\
  \ 的帮助下尝试理解这个示例。让我们首先找到标记为 1、2 和 3 的区域内的标识符。块 1 包含标识符 `foo`（方法调用和方法声明）；此外，块 2 包含标识符\
  \ `a`、`b` 和 `bar`。最内层的块 3 仅包含标识符 `c`。调用方法 `foo` 时将值 2 传递给 `a`，块 2 将标识符 `b` 初始化为\
  \ 4，并调用其他方法 `bar` 时将值 12 传递给块 3 中的标识符 `c`。整个路径按如下方式执行，因此，当最内层的 `console.log` 需要\
  \ `a`、`b`、`c` 来打印它们的值时，它会在当前作用域寻找，并按照栈顺序寻找适当的值。在控制台上打印的值将在块 3 内部找到的值。一旦找到第一个匹配的标识符，查找就会停止。这种方法被称为\
  \ `词法作用域`（lexical scope）。变量 `a`、`b` 和 `c` 的值在图 2.2 的作用域内被详细列出。\n\n![](img/fig2_1.jpg)\n\
  \n图 2.1 理解变量的作用域。\n\n![](img/fig2_2.jpg)\n\n图 2.2 详细说明变量的作用域。\n\n## 2.4 数据类型\n\n\
  JavaScript 中的变量可以持有任何类型的数据，无需指定严格的数据类型。这类编程语言被称为动态类型语言或弱类型语言，即数据类型存在但没有严格绑定到变量上。JavaScript\
  \ 中有两种基本类型的数据类型：原始数据类型（primitive）和非原始数据类型（nonprimitive）。\n\n### 2.4.1 原始数据类型\n\n\
  原始数据类型只能在关联的变量中存储单个值。它不能随数据存储额外的属性或方法。共有七种原始数据类型：`string`、`number`、`bigint`、`boolean`、`undefined`、`symbol`\
  \ 和 `null`[[45]](#ref-list.xhtml_refReferences_45)。除了 `undefined` 和 `null` 外，所有原始类型在\
  \ JavaScript 中都有包装对象（wrapper object）。所有的原始类型在 JavaScript 中默认都是不可变的。这意味着我们不能更改任何原始值；然而，新创建的值可以初始化给其他变量。例如，在这段代码中，变量\
  \ `someString` 在完成赋值之前不会发生突变。这表明了一个新的“DUMMY STRING”被创建并赋值给了 `someString` 标识符。\n\n\
  ```javascript\n// 使用字符串方法不会改变字符串\n\nvar someString = \"Dummy String\";\n\nconsole.log(someString);\
  \ // Dummy String\n\nsomeString.toUpperCase();\n\nconsole.log(bar); // Dummy String\n\
  \n// 赋值为原始值一个一个新的（而不是变形）值\n\nsomeString = someString.toUpperCase(); // DUMMY STRING\n\
  ```\n\n下一节将解释原始类型及其对应的包装对象；`valueOf()` 函数可以将任何对象转换为对应的原始数据类型。\n\n*   **String（字符串）：**字符串是表示文本值的字符序列。JavaScript\
  \ 中的 `String` 数据类型对象可以持有字符或字符串值。值必须被括在引号内（双引号、单引号、反引号）。双引号（“…”）和单引号（‘…”）的功能相似，没有显著区别。然而，反引号（…）用于在脚本中嵌入数据值\
  \ [[46]](#ref-list.xhtml_refReferences_46)。也被称为功能扩展引号，它们允许我们使用 `${…}` 符号将表达式或变量嵌入字符串中。\n\
  \n```javascript\nlet str1 = ”our first string”; //允许\n\nlet str2 = ’our second string’;\
  \ //允许\n\nlet str3 = `we can embed ${str1} and ${str2} in this`;\n\n// 嵌入变量\n\n\
  /*output: we can embed our first string and our second string in this*/\n\nlet str4\
  \ = `embed an expression ${25 + 25}`;\n\n// 嵌入表达式\n\n//output: embed an expression\
  \ 50\n```\n\n*   **Number（数字）：** 在 JavaScript 中，数字是双精度、64 位浮点格式（IEEE 754）的数值数据类型\
  \ [[47]](#ref-list.xhtml_refReferences_47)。JavaScript 中的 `Number` 数据类型对象可以持有任何数值。\n\
  \n*   **Boolean（布尔值）：** 在 JavaScript 中，布尔值是一种逻辑数据类型；它可以持有真（true）或假（false）值。它主要用于条件语句和其他操作。布尔类型的包装对象是\
  \ `Boolean` [[48]](#ref-list.xhtml_refReferences_48)。\n\n*   **BigInt（大整数）：** 在\
  \ JavaScript 中，`bigint` 是一种表示任意精度整数的数值数据类型。大整数的包装对象是 `BigInt`[[49]](#ref-list.xhtml_refReferences_49)。\n\
  \n*   **Symbols（符号）：** 类型为 `Symbol` 的值可以被称为符号值。在 JavaScript 运行时，符号值通过调用 `Symbol`\
  \ 函数产生，匿名且唯一 [[50]](#ref-list.xhtml_refReferences_50)。符号的包装对象是 `Symbol`。\n\n*  \
  \ **Undefined（未定义）：** 当你声明变量但没有对其赋值时，变量会被假设一个原始值。这是一个特殊的数据类型，技术上可以赋值给变量。undefined\
  \ 原始类型没有包装对象 [[51]](#ref-list.xhtml_refReferences_51)。\n\n```javascript\nlet y;\n\
  \nalert(y); //output: undefined\n\ny = 46757;\n\nalert(y); //output: 46757\n\ny\
  \ = undefined;\n\nalert(y); //output: undefined\n```\n\n*   **Null（空）：** 正如名称所示，null\
  \ 表示一个不存在或无效对象或地址的空或未知值。在 JavaScript 中，`null` 被标记为原始类型，但在某些情况下，它并不是原始类型（因为稍后我们将看到所有对象都派生自\
  \ `null`，因此 `typeof` 运算符对 `null` 返回 object）。null 原始类型没有包装对象 [[52].](#ref-list.xhtml_refReferences_52)\n\
  \n```javascript\ntypeof null === 'object' // true;\n```\n\n### 2.4.2 非原始数据类型\n\n\
  JavaScript 中的非原始数据类型用于在变量中存储复杂的值。它允许我们关联不同的属性和方法。非原始或引用数据类型分为三类：对象（Object）、数组（Array）和正则表达式（RegExp）。对象代表通过其访问成员的实例，数组代表一组相似的值，正则表达式代表正则表达式。非原始类型在\
  \ JavaScript 中非常重要，这些将在随后的章节中详细讨论。\n\n### 2.4.3 常量\n\n\n\n\n\n在编程过程中，我们可能会遇到一种情况：标识符的值一旦赋值，就不应再次更改。通过\
  \ `let` 或 `var` 关键字声明的变量和标识符本质上是可变的，也就是说它们的值可以更改为其他字面量或变量。这正是常量概念派上用场的地方。`const`\
  \ 关键字用于声明常量，即它们的值一旦赋值就不能被更改。在命名规范上，常量名始终使用大写字母。\n\n```\n// const CONSTANT_IDENTIFIER\
  \ = assigned_value;\n\n```\n\nconst PI = 3.1415;\n\nconst ROI = 6;\n\nconst PUBLISHER\
  \ = `T&F`;\n\nROI = 7; //Type Error\n\n始终记住，`const` 关键字使标识符的内存分配变为不可变的，即该标识符不能重新分配到任何其他变量或内存。然而，内存位置内部的内容可以改变；例如，如果创建了一个常量数组或对象，其内容可能会改变，但常量标识符不能改为另一个对象或数组。在后续章节中学习对象时，请记住这一点。为了快速参考，请参见下一个示例。在这里你可以看到对象内部的内容可以被修改甚至添加，但我们不能将常量标识符重新赋值为新值。\n\
  \n```javascript\nconst SUBJECT = { sub1:”phy”, sub2:”math”, sub3:”chem” }\n\n//创建一个常量标识符\
  \ “SUBJECT”\n\nconsole.log(typeof SUBJECT); //打印 object\n\nSUBJECT.sub3 = “bio”;\
  \ //可变属性\n\nSUBJECT.sub4 = “english” //添加新属性\n\nSUBJECT = { sub1:”accounts”, sub2:”economics”,\
  \ sub3:”statistics” }\n\n// 不可重新赋值常量对象\n```\n\n### 2.4.4 类型转换 (Type Casting)\n\n\
  类型转换是将一种数据类型转换为另一种数据类型的过程。在某些情况下，程序可能需要这种转换，例如，在只期望字符串的 HTML 标签中打印数值。为了帮助这种转换，JavaScript\
  \ 提供了隐式转换和显式转换两种选项 [[53]](#ref-list.xhtml_refReferences_53)。隐式转换允许在赋值或在方法中使用时从一种类型到另一种类型的自动转换。例如，如果在\
  \ `console.log()` 方法中打印一个数值，JavaScript 将自动对其调用 `toString()` 方法。同样，对字符串和数值使用 ++ 运算符会自动将数值转换为字符串值。\n\
  \n```javascript\nvar age = 35;\n\nconsole.log(typeof age); // typeof age 是 number\n\
  \nconsole.log(age); //相当于 console.log(age.toString());\n\nvar output = ”My age is”+age;\
  \ //隐式转换\n\nconsole.log(output); //显示 My age is 35\n```\n\n如果 JavaScript 无法进行隐式转换，则需要显式转换。例如，假设我们有两个\
  \ String 类型的数字 `numberA` 和 `numberB`，我们需要对它们执行算术加。在这种情况下，我们必须显式定义正在执行的类型转换。下一个示例展示了这两种情况。\n\
  \n```javascript\nvar numberA = \"10\";\n\nvar numberB = \"20\";\n\nconsole.log(typeof\
  \ numberA); //类型为 String\n\nconsole.log(typeof numberB); //类型为 String\n\nconsole.log(numberA\
  \ + numberB); //输出为 1020\n\nconsole.log(Number(numberA) + Number(numberB));\n\n\
  //输出为 30\n\n//这是显式类型转换\n```\n\nJavaScript 通过使用内置方法（如 `Number()`、`String()`、`Boolean()`\
  \ 等）提供显式转换。JavaScript 中的空字符串和使用 null 值始终返回 0。\n\n## 2.5 运算符 (Operators)\n\n数学运算和其他操作是通过操作数和运算符执行的。操作数是运算符执行作用的数据项\
  \ [[54]](#ref-list.xhtml_refReferences_54)。运算符是表示要在操作数上执行的操作类型的符号，即为了获得所需结果而处理的数据项。运算符有助于执行算术、逻辑、赋值和位运算。运算符和操作数的组合称为表达式，它会通过求值来提供最终结果。例如：\n\
  \n```javascript\nvar a = 5 + 10; //包含运算符和操作数的表达式\n```\n\n在这里 `+` 和 `=` 分别是算术运算符和赋值运算符。`a`、`5`\
  \ 和 `10` 是运算符作用的操作数。运算符还可以根据它们作用的操作数数量进行分类；例如，元运算符、二元运算符和三元运算符。元运算符作用于单个操作数，二元运算符作用于两个操作数，三元运算符作用于三个操作数。\n\
  \n接下来的章节将根据类型（如算术、逻辑、位运算等）涵盖不同类别的运算符。建议初学者必须练习这些运算符，以掌握它们的工作和用法。\n\n### 2.5.1 算术运算符\
  \ (Arithmetic Operators)\n\n算术运算符以数值（字面量或变量）作为操作数，并返回单个数值值 [[55]](#ref-list.xhtml_refReferences_55)。JavaScript\
  \ 提供了基础算术运算符，包括元运算符和二元运算符，如 `+`、`-`、`*` 和 `/`。表 2.2 提供了 JavaScript 中的算术运算符及其描述和示例。\n\
  \n表 2.2 算术运算符\n\n| 运算符 | 描述 | 示例 | a 的值 |\n\n| --- | --- | --- | --- |\n| `+`**二元**\
  \ | 加法 | let a = 5 + 12 | *a* = *17* |\n| `-` | 减法 | | |\n| `*` | 乘法 | | |\n| `/`\
  \ | 除法 | | |\n| `%` | 取模 | | |\n| `++`**元** | 递增 | | |\n| `--`**元** | 递减 | | |\n\
  | `-`**元** | 取反 | | |\n| `+`**元** | 一元正 | | |\n| `**`**二元** | 幂 | | |\n\n### 2.5.2\
  \ 比较运算符 (Comparison Operators)\n\n比较运算符用于比较操作数并返回逻辑值。操作数可以是数值、字符串或逻辑值。JavaScript\
  \ 在比较时会对除 `===` 和 `!==` 以外的所有运算符执行隐式类型转换 [[56]](#ref-list.xhtml_refReferences_56)。表\
  \ 2.3](#ch02.xhtml_tablea2_3) 提供了比较运算符的描述和示例。\n\n表 2.3 比较运算符\n\n| 运算符 | 描述 | 示例\
  \ | 结果 |\n\n| --- | --- | --- | --- |\n| `==` **二元** | 等于（不考虑类型） | a = 7 | true\
  \ |\n| | | a = 8 | false |\n| | | a = “7” | true |\n| `===` **二元** | 全等（考虑类型和值）\
  \ | a = “7” | false |\n| | | a = 7 | true |\n| `!=` **二元** | 不等于 | a!=8 | true |\n\
  | `!==` **二元** | 不全等 | a!==7” | true |\n| `>` **二元** | 大于 | a > 7 | false |\n| `>=`\
  \ **二元** | 大于等于 | a >= 7 | true |\n| `<` **二元** | 小于 | a < 7 | false |\n| `<=` **二元**\
  \ | 小于等于 | a <= 7 | true |\n\n### 2.5.3 位运算符 (Bitwise Operators)\n\n位运算符用于对 JavaScript\
  \ 中的操作数执行位运算。数值被转换为 32 位数，然后按位应用位运算符。在应用运算符后，结果被转换回数值形式 [[57]](#ref-list.xhtml_refReferences_57)。它包括基本的与、或、非、异或、左移和右移运算符，如表\
  \ 2.4](#ch02.xhtml_tablea2_4) 所示。\n\n表 2.4 位运算符\n\n| 运算符 | 描述 | 示例 | 结果（ 4 位显示）\
  \ |\n\n| --- | --- | --- | --- |\n| `&`**二元** | 与 | 7 & 1 | (0111)[2] & (0001)[2]\
  \ = (0001) [2] = (1)[10] |\n| `&#124;`**二元** | 或 | 7 &#124; 1 | (0111)[2] &#124;\
  \ (0001)[2] = (0111)[2] = (7)[10] |\n\n\n\n\n\n| ~`Binary` | NOT | ~ 7 | ~(0111)[2]\
  \ = (1000)[2] = (8)[10] |\n| ^`Binary` | XOR | 7 ^ 1 | (0111)[2] ^ (0001)[2] = (0110)[2]\
  \ = (6)[10] |\n| «`Binary` | Left Shift | 8 « 1 | (1000)[2] « Insert one ZERO =\
  \ (10000)[2] = (16)[10] |\n| »`Binary` | Right Shift | 8 » 1 | Insert one Zero »(1000)[2]\
  \ = (0100)[2] = (4)[10] |\n\n### 2.5.4 逻辑运算符\n\n逻辑运算符应用于布尔操作数或任何返回布尔值的表达式；其结果也是布尔值\
  \ [[58]](#ref-list.xhtml_refReferences_58)。与其他所有运算符类似，如果操作数不是布尔值，则隐式类型转换会将任何字面量视为\
  \ true，并相应执行操作。Table 2.5 提供了逻辑运算符使用的参考示例。在接后的表中假设 `x = 5` 且 `y = 8`：\n\nTable 2.5\
  \ 逻辑运算符\n\n| 运算符 | 说明 | 示例：设 x = 5; 令 y = 10 | 结果 |\n| --- | --- | --- | --- |\n\
  | `&&`Binary` | 逻辑与 | (x <7 && y> 7); | true |\n| | | (x> 7 && y> 7); | false |\n\
  | | | false && (3 = = 4);' | false |\n| | | Camel' && 'Dog'; | Dog |\n| `||`Binary`\
  \ | 逻辑或 | (x> 7 || y> 7); | true |\n| | | (x> 7 || y <7); | false |\n| | | false\
  \ || (3 = = 4);' | false |\n| | | Camel' || 'Dog'; | Camel |\n| `!`Binary` | 逻辑非\
  \ | !(x = =y); | true |\n| | | (x = =y); | false |\n\n### 2.5.5 赋值运算符\n\n赋值运算符 `=`\
  \ 用于将右侧字面量或变量的值赋值给左侧的另一个变量 [[54]](#ref-list.xhtml_refReferences_54)。还有复合赋值运算符，它们这些运算符的简写。Table\
  \ 2.6 列出了各种与其他算术运算符结合的赋值运算符，提供了它们的简写表示法。\n\nTable 2.6 赋值运算符\n\n| 运算符 | 说明 | 示例 |\
  \ 结果 |\n| --- | --- | --- | --- |\n| `=` | 从右向左赋值 | `x = 5` | x 包含 5 |\n| `+=` |\
  \ 加并赋值 | `x +=3` | x 包含 8 |\n| `-=` | 减并赋值 | `x-=3` | x 包含 5 |\n| `*=` | 乘并赋值 |\
  \ `x*=3` | x 包含 15 |\n| `/=` | 除并赋值 | `x/=3` | x 包含 5 |\n| `%=` | 取模并赋值 | `x%=2`\
  \ | x 包含 1 |\n\n### 2.5.6 三元运算符\n\n三元运算符是一种特殊的运算符，它对三个操作数进行操作，因此本质上是“三元的”。它包含一个逻辑表达式和两个值（或表达式），根据通过的逻辑表达式或条件选择其中一个作为结果。它在编写单行条件语句非常有用，可以替换\
  \ `if else` 代码。`if else` 语句将在后续章节中讨论 [[59]](#ref-list.xhtml_refReferences_59)。三元运算符主要用于测试条件，如果如果条件为真则选择\
  \ `value1`，如果条件结果为假则选择 `value2`。使用三元运算符的语法如下：\n\n```\nvar var_name = (condition)?\
  \ value1: value2\n```\n\n上述三元运算符等价的 `if else` 语句代码为：\n\n```\nif (condition) { var_name\
  \ = value1 }\nelse { var_name = value2 }\n```\n\n条件是一个产生真值或假值的逻辑表达式。如果逻辑值为真，则将 `value1`\
  \ 赋值给变量名；否则将 `value2` 赋值给变量名。例如，为了测试选民的年龄，可以使用以下条件：\n\n```\nlet eligibleToVote =\
  \ (user.age> = 18)?\"Yes\": \"No\";\n```\n\n### 2.5.7 逗号运算符\n\n逗号运算符也是二元运算符，用于将多个语句放在一行代码中。它从左到右求值每个表达式并返回语句中最后一个表达式的值。它在编写代码时用分隔符，特别是在期望每行一条语句但在行内提供了多个语句的地方，所有语句都使用逗号运算符分隔\
  \ [[60]](#ref-list.xhtml_refReferences_60)。逗号运算符在编写代码时频繁使用，例如在 `for` 循环中声明多个初始化变量或条件，在\
  \ `array` 中使用对象时分隔两个条目等。例如：\n\n```\nvar x = 0;\nfor (i = 0, i < 10; i++)\n  console.log(i);\n\
  var arr = [1, 2, 3];\n```\n\n### 2.5.8 typeof 运算符\n\n`typeof` 运算符也是一个二元运算符，用于返回操作数的类型；对于需要显式类型转换，`typeof`\
  \ 返回一个字符串值 [[61]](#ref-list.xhtml_refReferences_61)。该运算符的语法如下：\n\n```\ntypeof operand\n\
  typeof (operand)\n```\n\n源 [[62]](#ref-list.xhtml_refReferences_62)，Table 2.7 给出了\
  \ `typeof` 运算符用于不同类型时的返回值。\n\n| 类型 | 返回值 |\n| --- | --- |\n| Undefined | “undefined”\
  \ |\n| Null | “object” |\n| Boolean | “boolean” |\n| Number | “number” |\n| String\
  \ | “string” |\n| Symbol | “symbol” |\n| Function | “function” |\n| Any 其他对象 | “object”\
  \ |\n\n### 2.5.9 delete 运算符\n\n`delete` 运算符是一种特殊的运算符，主要用于我们将在后续章节中讨论的对象。它用于从对象中删除属性。如果删除成功，则返回真。使用\
  \ `delete` 运算符的语法如下：\n\n```\ndelete object['property']\n```\n\n### 2.5.10 void 运算符\n\
  \n`void` 是一种一元运算符，用于故意返回 *undefined* 或在不返回值的情况下评估表达式。使用 `void` 运算符始终返回 undefined\
  \ 作为结果。它可以与函数、普通运算符以及浏览器内置方法配合使用以故意返回 *undefined*。\n\n```\nvoid (7 == ‘7'); // 比较两者并返回\
  \ undefined\nvoid 7 == ‘7’; // 比较 void 7 即 undefined 与 ‘7’返回 false\n```\n\n## 2.6\
  \ 控制流语句\n\n在为不同场景设计和编写代码时，顺序流并不总是所需的或合适的。需要根据某些决定进行分支 [[65]](#ref-list.xhtml_refReferences_65)。有时也会出现迭代一组语句的需求。这些情况需要特殊的机制来控制代码流。JavaScript\
  \ 语言提供了决策语句和循环迭代器来满足这些需求。\n\n### 2.6.1 决策语句\n\n如前所述，开发者可能需要不同的决定执行不同的操作。决策语句是在仅在满足指定条件时执行的语句。本节将讨论这些决策结构在\
  \ JavaScript 中是如何实现的。\n\n#### 2.6.1.1 If Else\n\n\n\n\n`if` 语句用于根据逻辑条件执行代码块或表达式。只有当指定的条件解析为\
  \ `true` 时，才会执行条件后的代码块。如果条件求值为 `false`，则 `if` 块之后的语句将不执行，如果提供了，则执行可选的 `else` 语句。在两种情况下，其余代码都会被执行。使用\
  \ `if else` 语句的语法如下：\n\n```javascript\nif (Logical Expression) //指定逻辑条件\n\n{\n\n\
  /*此段代码块\n仅当条件（即 逻辑表达式）\n结果为 true 时才会执行 */\n}\n\nelse //这是可选的，但很有用\n\n{\n\n/*此段代码块\n\
  仅当条件（即 逻辑表达式）\n结果为 false 时\n才会执行*/\n}\n\n// 剩余代码将始终按顺序执行\n```\n\n`if` 块可以独立使用，而不必使用\
  \ `else` 块。然而，反之则不成立。每个 `else` 块都必须对应一个 `if` 块。`if` 和 `else` 块可以相互嵌套，每个 `else` 块都与其最近的\
  \ `if` 块配对。\n\n在某些情况下，必须从多个替代块中选择一个选项，即根据某些条件的结果执行某一个代码块（从为不同条件提供的多个块中）。对于此类场景，可以使用\
  \ `elseif` 语句链。下面的示例说明了 `elseif` 语句结合 `if` 和 `else` 语句的使用。\n\n```javascript\nif\
  \ (rank <10) {\n\n  console.log(\"Congratulation, your rank is in single digit\"\
  );\n}\n\nelse if (rank <40) {\n\n  console.log(\"Congratulations, your rank is in\
  \ range of 10 to 40\");\n\n}\n\nelse {\n\n  console.log(\"Unfortunately, you did\
  \ not get a rank.\");\n}\n```\n\n### 2.6.1.2 Switch Case 语句\n\n当条件基于等效性时，`switch`\
  \ 语句提供了一种更易读的编写 `elseif` 方法，即你需要使用 `==` 运算符比较两个值。`switch` 语句比 `if else` 语句更灵活。`switch`\
  \ 也用于为不同的语句执行不同的代码块。它比 `if else` 更强大，后者始终求值为 `true` 或 `false`。\n\n使用 `switch` 语句，可以指定求出不同值或表达式的语句。这些值随后可以用于不同的\
  \ `case`，每个 `case` 对应一个特定的值。每当执行 `switch` 块时，`switch` 内部的语句就会被求值。结果随后与提供的 `cases`\
  \ 逐一匹配。如果值匹配某个 `case`，则执行对应的代码块；否则，匹配下一个 `case` 值。如果没有 `case` 该值，则执行 `default` 代码块。使用\
  \ `switch case` 语句的语法如下：\n\n```javascript\nswitch (statement) //语句给出结果为 a,b,c 或其他值\n\
  \n{\n\ncase a: //对于 a，执行此处\n//语句块\n\ncase b: //对于 b，执行此处\n//语句块\n\ncase c: //对于\
  \ c，执行此处\n//语句块\n\ndefault: //对于任何其他值\n//语句块\nconsole.\n}\n```\n\n接下来的示例使用 `switch\
  \ case` 语句来打印当前周几；你会注意到 `case` 之间有 `break` 关键字。这用于将控制权移出代码块；如果省略了 `break`，所有 `case`\
  \ 都会被求值并在输出上产生\n\n```javascript\nvar dayOfTheWeek = 1;\n\nswitch (dayOfTheWeek)\
  \ {\n\ncase 0:\n  console.log(\"Sunday\");\n  break;\n\ncase 1:\n  console.log(\"\
  Monday\");\n  break;\n\ncase 2:\n  console.log(\"Tuesday\");\n  break;\n\ncase 3:\n\
  \  console.log(\"Wednesday\");\n  break;\n\ncase 4:\n  console.log(\"Thursday\"\
  );\n  break;\n\ncase 5:\n  console.log(\"Friday\");\n  break;\n\ncase 6:\n  console.log(\"\
  Saturday\");\n  break;\n\ndefault:\n  console.log(\"Sorry, you made a mistake.\"\
  );\n}\n```\n\n### 2.6.2 循环与迭代\n\n循环和迭代也被用作控制流语句的一部分。特别是，它们处理使用某些条件对代码块的重复。通常，使用一组条件和初始化器来定义任何代码块应该迭代多少次。在迭代期间，循环还提供了可以用于计数的数值，这些值也可以用于遍历数组或集合中的值\
  \ [[66]](#ref-list.xhtml_refReferences_66)。\n\n#### 2.6.2.1 For 循环\n\n`for` 循环是最简单的，且编写起来非常全面。`for`\
  \ 循环接受初始值、终止条件和增/减条件作为输入。初始值仅用于初始化目的。测试终止条件，并执行代码块。一旦执行代码块，就会求值增/减条件以更新计数器的值。再次检查测试条件，如果计数器满足条件，则执行代码。通过这样，循环继续执行，直到计数器值不再满足标准或满足终止条件。使用\
  \ `for` 循环的语法如下：\n\n```javascript\nfor (initial value; termination condition; statement)\n\
  \n{\n\n  //要执行的语句块\n}\n```\n\n让我们通过一个简单的示例来理解 `for` 的用法。在这个示例中，`i` 被初始化为 1，当条件小于\
  \ 10 时执行代码块。在执行代码块后，`i++` 执行，这个过程一直持续到 `i` 小于 10。 `i` 变为 10。\n\n```javascript\n\
  for (i = 1; i < 10; i++) {\n\n  console.log(\"i is \" + i);\n}\n```\n\n#### 2.6.2.2\
  \ While 循环\n\n`while` 循环是另一种在特定条件下执行代码块的方式。在 `while` 循环中，初始化器、终止条件和增/减计数器是分开管理的。它用于在给定条件下重复执行代码。`for`\
  \ 循环将初始化、终止和增减条件合并在一个语句中，而 `while` 循环允许开发者将其分开并以不同的方式设计方案。`while` 循环的标准结构如下：\n\n\
  ```javascript\nlet i = 1; //初始化\nwhile (i <= 10) //终止条件\n\n{\n\n  console.log(\"\
  i is \" + i);\n\n  i++; //递\n}\n```\n\n#### 2.6.2.3 Do-while 循环\n\n`do-while` 循环是\
  \ `while` 循环的一种特殊形式，代码块至少执行一次，然后检查条件以确定后续执行。如果条件解析为 `true`，则再次执行代码块。\n\n下面的示例说明了\
  \ `do-while` 循环的使用。我们可以看到 `i` 的初始值为 20；这段代码仍会产生输出，因为代码块执行一次，然后检查条件。对于使用 `while`\
  \ 和 `do-while` 循环，务必在代码块内指定增或减语句；否则循环将永远终止并无限执行。\n\n```javascript\nvar i = 20; //初始化\n\
  \ndo {\n\n  console.log(\"i is \" + i); //语句块\n\n  i++; //递增\n\n}\n\nwhile (i <=\
  \ 10); //终止条件\n```\n\n#### 2.6.2.4 For-in 循环\n\n`for-in` 循环是 JavaScript 的一种特殊循环。它用于遍历对象的属性。对于对象中的每个键，代码块都会执行一次。使用\
  \ `for-in` 循环的意义将在后续章节学习对象及其属性时得到更深入的理解。使用 `for-in` 循环的语法如下：\n\n```javascript\n\
  for (key in object) {\n\n  //要执行的代码块\n}\n```\n\n## 2.7 练习\n\n### 2.7.1 理论题\n\n1.\
