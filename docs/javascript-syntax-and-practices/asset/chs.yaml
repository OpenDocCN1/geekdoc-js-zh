  \n# 5 数组\n\nDOI: [10.1201/9781003122364-5](https://doi.org/10.1201/9781003122364-5)\n\
  \n> *我们面临着广泛的威胁，这意味着我们必须具备广泛的能力*。\n> –Mac Thornberry\n\n我们已经理解了 JavaScript 中对象和函数的概念；现在是时候转向数组了。如果我们告诉你们数组是一个用于存储不同元素的单个变量，你们可能会想：“既然我可以简单地在对象内部存储多个值，为什么还要学习数组呢？”这个想法的答案在于，`Arrays`\
  \ 是 JavaScript 中的特殊对象，它们在表现得像普通对象的同时，还提供了多项功能。\n\n对象被视为现实实体的表示，而数组是不同类型元素的集合，并提供了多个内置属性和方法来访问和修改此列表。本章旨在让你理解\
  \ `Arrays` 的概念以及在 JavaScript 程序中对内置属性和方法的使用。与某些其他语言相比，JavaScript 数组非常好用——这是它们绝对做对的地方。\n\
  \n## 5.1 数组\n\n数组传统上是连续长度的连续分配。尽管在 JavaScript 中它们许多情况下有所不同，但数组是一个具有唯一构造函数、字面量语法以及一组继承属性的特殊对象。\n\
  \n## 5.2 数组属性\n\n如前所述，数组是特殊对象，因此它们包含一些内置属性和方法。这使得它们易于高效使用。数组的属性可以通过 `Object.getOwnPropertyNames(Array)`\
  \ 获取。数组对象（类）包含以下属性和静态方法：\n\n*   `Array.name`：返回 `Array` 字符串值的属性。该属性只是对象的名称占位符。\n\
  *   `Array.isArray`：这是一个静态方法，在检查作为参数的对象是否属于数组后返回布尔值结果。\n*   `Array.from()`：这是一个静态方法，用于从预定义的数组对象或可迭代对象返回新数组。\n\
  *   `Array.of(elements*)`：这是一个静态方法，根据可数量或类型的参数返回一个新的 `Array` 对象。\n*   `Array.prototype.length`：这是所有数组类型对象继承的属性；该属性返回实例中值的数量。\n\
  *   `Array.prototype`：这是最重要的属性，因为它包含了所有特殊的内置方法以及它们的默认对象方法。\n\n## 5.3 声明数组\n\n数组操作非常频繁，很快你就不需要记住这些声明了。它们会随着练习自然而。然而，我们仍然会详细讨论数组的声明。声明数组有两种方法；即：通过使用\
  \ `Array` 字面量或通过构造函数。以下小节将通过示例解释它们。\n\n### 5.3.1 数组字面量\n\n\n\n\n\n在数组声明中使用的方括号也被称为数组字面量或数组初始化器\
  \ `[ ]`。使用 `var` 关键字，我们可以创建一个名为 `array_name` 的数组，初始化值保留在 `[ ]` 内部。每个值之间使用逗号运算符分隔。这种声明数组的方法因为其简单性、执行速度快以及代码可读性高而被广泛使用。\n\
  \n语法：\n\n```javascript\nvar array_name = [val1, val2, val3, val4 … valN];\n```\n\
  \n例如，下面的数组 `worker` 包含了五个个工人的名称。这些名称存储在一个从零开始计数的索引值数组中。数组的 `length` 将为 4（0,1,2,3,4），相当于数组中总共有五个元素，其中\
  \ `Alice` 的键为 0，`Tim` 的键为 2，`Charlie` 的键值为 4。\n\n```javascript\nvar worker = [“Alice”,\
  \ “Bob”, “Tim”, “Kim”, “Charlie”];\n```\n\nJavaScript 还允许在单个数组中存储不同类型的数据，包括整数、字符串、空对象、对象等。观察同一个数组实例中的异构类型数据。\n\
  \n```javascript\nvar worker_hetrogeneous = [“Alice”, { “id”: 101,”name”:”Bob” },\
  \ “Tim”, “Kim”, 101];\n```\n\n### 5.3.2 使用 new 关键字和数组构造函数\n\n也可以通过 `new` 关键字创建一个新的数组对象，它会创建一个\
  \ `Array` 实例。然后应显式地提供数组中的值。如前所述，数组的索引从零开始，但这并不限制只能从索引开始输入值。因此，可以根据程序需要轻松地填充数组。通常会避免这种方法，因为它给代码增加了不必要的复杂性。按顺序添加值无疑是一个更简单、更简洁且更好的替代方案。\n\
  \n语法：\n\n```javascript\nvar array_name = new Array()\n```\n\n让我们来看一个相同的示例：\n\n```javascript\n\
  var worker = new Array()\nworker[0] = “Alice”\nworker[1] = “Bob”\nworker[2] = “Tim”\n\
  worker[3] = “Kim”\nworker[4] = “Charlie”\nworker[21] = “Kate”\n//观察索引，不推荐但有效\nworker[40]\
  \ =”Smith”\n//观察索引，不推荐但有效\n```\n\n也可以通过使用 `new` 关键字并在构造函数本身中提供值来声明数组。在这种情况下，索引值默认从零开始。\n\
  \n语法：\n\n```javascript\nvar array_name = new Array(“val1”, “val2”,…, “valN”)\n```\n\
  \n让我们来看一个相同的示例：\n\n```javascript\nvar worker = new Array(“Alice”, “Bob”, “Tim”,\
  \ “Kim”, Charlie”);\n```\n\n## 5.4 访问数组\n\n可以使用数组名和封装在方括号 `[ ]` 中的索引数字来访问 JavaScript\
  \ 数组。因此，数组元素的索引在访问和操作数组时起着重要作用。正如我们所学到的，数组是带编号的数据集合，这些数字被称为索引。第一个元素的索引值始终为 0，最后一个元素的索引值为\
  \ `length-1`。只需使用数组名即可访问整个数组。请注意，数组是特殊对象，但不能使用 `.` 点符号来访问数组的元素。让我们在接下来的示例中查看所有情况：\n\
  \n```javascript\nvar worker = [“Alice”, “Bob”, “Tim”, “Kim”, “Charlie”];\nconsole.log(worker[0]);\
  \ //打印 Alice\nconsole.log(worker[3]); //打印 Kim\nconsole.log(worker[worker.length\
  \ - 1]);\n//访问最后一个元素，打印 Charlie\nconsole.log(worker);\n//打印整个数组: [\"Alice\", \"\
  Bob\", \"Tim\", \"Kim\", \"Charlie\"]\nconsole.log(arr.0); //语法错误\nconsole.log(arr.[6]);\
  \ //返回 undefined\n```\n\n此外，可以通过简单地重新赋值值来修改数组元素。JavaScript 数组是对象，因此你可以轻松地从数组中添加或删除属性。\n\
  \n以有序的方式存储数组元素是一种良好的做法并被广泛遵循。然而，JavaScript 允许你留空索引。它允许在单个数组中存储不同类型的数据，包括整数、字符串、空对象、嵌套对象等。\n\
  \n```javascript\nvar worker_hetrogeneous = [“Alice”, { “id”: 101,”name”:”Bob” },\
  \ “Tim”, “Kim”, 101];\n```\n\n## 5.5 数组内部的内置方法\n\n到为止我们已经多次提到了内置方法。`Array` 对象中的内置方法定义在\
  \ `Array` 特殊对象的 `Array.prototype` 属性内部。通过在浏览器控制台中输入 `Array.prototype` 可以看到这些方法。开发者从\
  \ Array 蓝图创建的新数组实例将继承所有这些内置方法。我们甚至可以定义自己的方法 `Array.prototype.function()`，然后在程序的任何地方使用它。根据需要，Array\
  \ 对象中存在的方法也可以被重载。\n\n为了方便理解，内置方法被分为三类。这些类别是访问器方法（accessor methods）、变异器方法（mutator\
  \ methods）和迭代器方法（iterator methods），它们将在接下来的章节中通过示例详细说明。\n\n### 5.5.1 访问器方法\n\n访问器方法在调用数组的副本上操作。也就是说，它们不会更改原始数组。换句话说，创建了数组的副本，该方法在该副本上执行操作。所有的访问器方法定义在\
  \ `Array.prototype` 内部，这些是：\n\n访问器方法定义在 `Array.prototype` 内部，这些是：\n\n- `concat()`：合并两个或多个数组并返回合并后的数组。有时\
  \ `concat()` 不带参数只是克隆一个数组。`concat()` 的语法如下：\n\n```javascript\narray_identifier.concat(value1,\
  \ value2 … valueN);\n```\n\n例如：\n\n```javascript\nvar numeral = [101, 102, 103];\n\
  var text = [\"Alice\", \"Bob\", \"Tim\"];\nvar aplhaNumeric = [4024, \"AH-2045\"\
  , \"TY-876\"]\nvar result1 = numeral.concat(text);\n//合并 numeral 和 text 并存储到 result1\n\
  var result2 = numeral.concat(text, aplhaNumeric);\n//合并 3 个数组 [numeral]\nvar result3\
  \ = text.concat(5, 6, [7, 8]);\n//创建一个嵌套数组\nvar result4 = nested.concat(text);\n\
  //合并 nested 和 text 保留引用\nconsole.log(result1); //打印 [101, 102, 103, \"Alice\", \"\
  Bob\", \"Tim\"]\nconsole.log(result2); //101, 102, 103, \"Alice\", \"Bob\", \"Tim\"\
  , 4024, \"AH-2045\", \"TY-876\"]\nconsole.log(result3); //打印 [\"Alice\", \"Bob\"\
  , \"Tim\", 5, 6, 7, 8]\nconsole.log(result4); //打印 [Array(2), 234, Array(2), \"\
  Alice\", \"Bob\", \"Tim\"]\n```\n\n\n\n\n\n在此语法表示中，`array_identifier` 是要搜索的数组。元素和索引（index）是搜索开始位置的值。`index`\
  \ 的值是可选的，如果不提供，则 `index` 默认为零。\n\n```javascript\nvar arr = [“a”, “b”, “c”, “d”,”e”,\
  \ “f”, “g”];\narr.indexOf(“a”) //returns 0\narr.indexOf(“b”, 2) //returns -1\narr.indexOf(“h”)\
  \ //returns -1\n```\n\n*   `join()`：此方法用于连接或合并数组的所有元素，并生成一个单一的连接字符串。默认情况下，生成的输出字符串中的数组元素之间用逗号分隔。我们可以选择性地提供一个分隔符来覆盖默认的逗号分隔符。\n\
  \n语法：\n```javascript\narray_identifier.join(separator);\n```\n默认分隔符是逗号运算符，但如果你想指定不同的分隔符，则该分隔符将使用在数组元素之间。如果数组为空，则返回一个空字符串。如果数组中的任何元素是\
  \ `undefined`、`null` 或空字符串，它将被转换为并显示为空字符串。让我们通过以下示例来理解它的用法。\n\n```javascript\nvar\
  \ colors = [‘Red’, ‘Green’, ‘Blue’];\ncolors.join(); //returns ‘Red,Green,Blue’\n\
  colors.join(‘+’); //returns ‘Red + Green + Blue’\ncolors.join(‘ ‘); //returns ‘Red\
  \ Green Blue’\n```\n\n*   `lastIndexOf()`：此方法用于找到元素在数组中出现的最后一个索引。它从最后一个索引向后搜索数组，直到零索引（即第一个元素）。如果找到了该元素，则返回它的索引。如果没有找到该元素，它将向调用函数返回\
  \ -1。\n\n语法：\n```javascript\narray_identifier.lastIndexOf(element, start_index);\n\
  ```\n`start_index` 指定开始搜索的位置（索引）。它是一个可选参数。\n\n```javascript\nvar arr = [\"a”, \"\
  b”, \"c”, \"b\", ‘a”];\nconsole.log(arr.lastIndexOf(‘a)); //returns 4\nconsole.log(arr.lastIndexOf(‘b));\
  \ //returns 3\nconsole.log(arr.lastIndexOf(‘g)); //returns -1\n```\n\n*   `toString()`：此方法将数组转换为包含由逗号分隔的值的字符串值，与默认的\
  \ `join()` 方法类似。它通常用于以字符串形式获取数组的内容。\n\n语法：\n```javascript\narray_identifier.toString();\n\
  ```\n`Array.prototype` 覆盖了 `Object` 的 `toString()` 方法。当数组被用于字符串拼接或当数组需要表示为文本值时，该方法会被自动调用。\n\
  \n```javascript\nvar name = [‘Tim, ‘Bob, ‘Alice’];\nvar str = name.toString();\n\
  console.log(str); //returns “Tim,Bob,Alice”\n```\n\n*   `slice()`：此方法用于从数组中提取序列。它在数组的副本上运行，不会修改原始数组。相反，它会创建一个原始数组的副本新数组。`slice()`\
  \ 方法在该数组上执行，并将结果数组作为返回值返回。\n\n语法：\n```javascript\narray_identifier.slice(index);\n\
  array_identifier.slice(start,end);\n```\n如果只指定了 `index` 值，则 `slice()` 将创建一个从该索引开始到数组最后一个元素结束的序列。如果同时指定了\
  \ `start` 和 `end` 索引，则 `slice()` 将创建一个从 `start` 索引到 `end index-1` 的序列。返回值是包含从原始数组中切片或提取出的元素的数组。\n\
  \n### 5.5.2 修改方法 (Mutator Methods)\n\n与访问器方法不同，修改方法在原始数组上操作，而不是在其副本上。这些方法可以添加、更改、截断或删除数组元素。一旦修改，你就无法撤销这些操作。每个操作都在原始数组上执行，因此开发者在使用这些方法时必须小心。\n\
  \n*   `copyWithin()`：此方法用于将同一数组的元素复制到另一个位置，而不修改其长度。\n\n语法：\n```javascript\narray_identifier.copyWithin(target,start,end);\n\
  array_identifier.copyWithin(target, start);\n```\n\n*   `fill()`：此方法将数组中的所有元素更改为静态值，从\
  \ `start` 索引（默认为 `0`）到 `end` 索引（默认为 `array.length`）。它可以配合所示的不同参数工作，并返回修改后的数组。\n\n\
  语法：\n```javascript\narray_identifier.fill(value);\narray_identifier.fill(value,\
  \ start);\narray_identifier.fill(value, start, end);\n```\n在语法中，`array_identifier`\
  \ 代表调用数组的名称，`value` 是填充到数组中的元素。`start` 是开始填充的索引值，`end` 是结束索引。如果只传递 `value` 作为参数而不带任何索引，则整个数组将用该元素值填充。如果带有值提供了\
  \ `start` 索引，则数组的填充将从指定的索引开始直到数组末尾。如果同时指定了 `start` 和 `end` 索引，则 `value` 将填充在索引之间。如果\
  \ `start` 或 `end` 索引为负数，则将进行相应计算。\n\n\n\n\n\n### `shift()`: 此方法用于从数组中移除第一个元素。它的工作方式与\
  \ `pop()` 方法相似，区别在于 `pop()` 从数组末尾移除元素，而 `shift()` 则从数组开头移除元素。它将被删除元素的值作为返回值。索引为\
  \ 0 的元素会被移除，其余元素的索引将根据此变化进行调整，例如：第二个元素将变为第一个元素，依此类推。\n\n语法：\n\n```\narray_identifier.shift();\n\
  ```\n\n如果由 `array_identifier` 表示的数组为空，则返回 `undefined` 作为返回值。否则，将属于调用数组的第一个值被移除并返回。\n\
  \n```javascript\nvar colors = [‘Red’, ‘Green’, ‘Blue’];\nconsole.log(colors.length);\
  \ //返回 3\nvar color = colors.shift(); //返回 ‘Red’\nconsole.log(color) //打印 [‘Green’‘Blue’]\n\
  console.log(colors.length); //返回 2\n```\n\n### `unshift()`: 此方法用于向数组开头添加元素。它的工作方式类似于\
  \ `push()` 方法；区别在于 `push()` 方法将元素插入到数组末尾，而 `unshift()` 方法将元素添加到调用数组的开头。\n\n语法：\n\
  \n```\narray_identifier.unshift(val1, val2,… valN)\n```\n\n其中，`val1`, `val2, … valN`\
  \ 是要添加到调用数组开头的元素。该方法返回插入元素后数组的修改后的长度。传递元素的顺序将保持不变，其余元素将以相同的修改后的索引值重新插入。\n\n```javascript\n\
  var colors = [‘Red’, ‘Green’, ‘Blue’];\nconsole.log(colors.length); //返回 3\nvar\
  \ color = colors.unshift(“Orange”); //返回 4\nconsole.log(color); //打印 [‘Orange’,‘Red’,‘Green’,‘Blue’];\n\
  console.log(colors.length); //返回 4\n```\n\n### `sort()`: 此方法用于对数组元素进行排序。元素会被转换为字符串，然后与其相关的\
  \ 16 位 Unicode 转换格式 (UTF-16) 代码值进行比较。结果是一个排序后的数组并被返回。排序的时间空间复杂度取决于数组的实现。`sort` 方法将在单独的章节中进行更详细的解释。其用法语法如下。\n\
  \n语法：\n\n```\narray_identifier.sort()\n```\n\n### `splice()`: 此方法是一种更精细的数组操作方法。它用于替换或移除数组中存在的元素。它接受用于替换现有元素的参数。\n\
  \n语法：\n\n```\narray_identifier.splice(start, count, item);\narray_identifier.splice(start,\
  \ count, item1,… itemN);\n```\n\n通常情况下，`array_identifier` 是调用数组的引用，`start` 是开始替换（或移除）元素的索引。如果\
  \ `start` < `length`，则 `start` 被设置为数组的长度。如果 `start` < 0，则 `start` 的值取为 `start` =\
  \ `length-start`。如果 `length-start` < 0，则 `start` 取为 `0`。第二个参数 `count` 是告诉 `splice()`\
  \ 方法数组中要移除（或替换）的元素个数。该参数是可选的，当未指定时，`splice()` 将继续删除元素直到数组末尾。`item1`, `item2, … itemN`\
  \ 是用于替换调用数组现有元素的元素。如果未指定，则 `splice()` 只删除项目而不用值替换它们。对于 `splice()` 方法，返回值是一个包含被删除值的数组。如果没有删除任何值，则返回空数组。如果只删除了一个值，则返回一个包含一个元素的数组。\n\
  \n```javascript\nvar colors = [‘Red’, ‘Black’, ‘Green’, ‘Blue’];\nvar spliced =\
  \ colors.splice(2, 0, ‘Orange’); // orange 插入到索引 2，由于 count = 0，没有删除元素\nconsole.log(colors);\
  \ //打印 [‘Red’,‘Black’,‘Orange’,‘Green’,‘Blue’];\nconsole.log(spliced); //返回 []，因为没有元素被删除\n\
  \nvar spliced = colors.splice(3, 2) // 从索引 = 3 开始删除 2 个元素\nconsole.log(colors);\
  \ //打印 [‘Red’,‘Black’,‘Orange’]\nconsole.log(spliced); //返回 [‘Green’,‘Blue’]\n\n\
  var spliced = colors.splice(1, 2, ‘Yellow’, ‘White’); // 从索引 1 删除 2 个元素并插入 2 个元素\n\
  console.log(colors); //返回 [‘Red’,‘Yellow’,‘White’]\nconsole.log(spliced); //返回 [‘Black’,‘Orange’]\n\
  ```\n\n### 5.5.3 迭代器方法\n\n当我们有一个类似列表的数组并且需要访问其中的元素时，通常必须遍历整个数组来查找或处理这些元素。JavaScript\
  \ 的解决方案是提供简单的循环作为遍历数组的手段。另一种解决方案是使用 `Array.prototype`，它提供了一些非常有用的方法来遍历数组的元素。迭代使得访问数组内的元素变得更容易。JavaScript\
  \ 提供了多种方式来遍历数组，使用基础循环和预定义方法，这些都是讨论。\n\n#### 5.5.3.1 使用基础循环\n用于这里的循环语句。让我们深入研究。\n\
  \n##### 5.5.3.1.1 For 循环\n最基本的方法之一是使用 `for` 循环，从索引开始，可以使用 `length` 属性推导出终止条件。同样，循环也可以以反向方式进行。\n\
  \n语法：\n\n```\nfor (let i = 0; i < array_identifier.length; i +)\n{}\n```\n\n#####\
  \ 5.5.3.1.2 While 循环\n另一种方法是使用 `while` 语句迭代。不要忘记在循环内部指定计数器；否则循环将继续执行。\n\n语法：\n\n\
  ```\nwhile(i < array_identifier.length)\n{\n// 在数组上执行你的操作\ni +;\n```\n\n#### 5.5.3.2\
  \ 预定义方法\n除了基础循环，`Array.prototype` 还提供了其他方法来迭代数组内部元素。这些方法可以在基础循环内部使用，也可以独立使用。当你想遍历或循环数组元素时，使用了迭代器方法。通常会指定某个函数，应用于数组元素。\n\
  \n- `entries()`: `entries()` 方法返回一个新的数组迭代器对象，其中包含数组中每个索引的键值对。\n\n语法：\n\n```\narray_identifier.entries()\n\
  ```\n\n示例：\n\n```javascript\nvar colors = [‘Red’, ‘Black’, ‘Green’, ‘Blue’];\nconst\
  \ iterator1 = colors.entries();\nconsole.log(iterator1.next().value); //打印 Array\
  \ [0, \"Red\"]\nconsole.log(iterator1.next().value); //打印 Array [1, \"Black\"]\n\
  ```\n\n- `forEach`: 此方法可用于遍历数组并在数组元素上运行不同的函数。`forEach` 用于为数组的每个元素执行指定的函数。在处理整个数组时非常有用。\n\
  \n语法：\n\n```\narray_identifier.forEach(myFunction);\n```\n\n```javascript\nfunction\
  \ myFunction()\n{ // 为每个元素执行的函数\n// 处理数组属性的语句集\n}\n```\n\n- `every()`: 此方法用于对属于数组中的每一个元素进行条件测试。它根据执行结果返回一个布尔值。如果数组中的所有元素都满足\
  \ `every()` 方法中指定的条件，则返回 `true`。否则，即使数组中只有一个属性未能通过指定的条件，它也会返回 `false`。如果传递的是空数组，那么无论指定的条件是什么，它都会返回\
  \ `true`。\n\n语法：\n\n```\narray_identifier.every(custom_function)\n```\n\n\n\n\n\n\
  `array_identifier` 是调用数组的引用名称，而 `custom_function` 是指定数组元素测试条件的函数。指定的测试 `conditions`\
  \ 或 `function` 将按照顺序在数组的每个元素上执行。对于每一个元素，都会进行处理，只有当当结果为 `true` 时， true 会测试下一个元素。如果\
  \ `every()` 对其中任何一个元素返回 `false`，则其余元素将不再被测试，并返回 `false`。\n\n```javascript\nfunction\
  \ isLessThan(element, index, array) {\n  return element < 20;\n}\n\nvar arr = [11,\
  \ 5, 8, 13, 19]\nvar x = arr.every(isLessThan(20));\n\n// 返回 true\n[11, 54, 18,\
  \ 130, 190].every(isLessThan(20));\n\n// 返回 false\n```\n\n### `map()`\n该方法可以对数组的每个元素运行一个函数，然后返回一个包含结果的新数组。\n\
  \n**语法：**\n`array_identifier.map(custom_function);`\n\n**示例：**\n```javascript\n\
  function multiplyByTwo(element) {\n  return element * 2;\n};\n\nvar input = [1,\
  \ 2, 3, 4, 5];\nvar result = input.map(multiplyByTwo());\nconsole.log(result) //\
  \ 输出 [2, 4, 6, 8, 10];\n```\n\n### `filter()`\n该方法用于根据从给定数组中过滤出的值创建一个新数组。元素根据某些条件进行过滤，该条件作为参数传递给方法。此参数可以是一个简单的条件语句，也可以本身\
  \ true 一个方法，它为数组元素定义了一组过滤器。\n\n**语法：**\n`array_identifier.filter(custom_function);`\n\
  \n其中，`function` 指定了测试条件，`element` 是正在处理的数组元素。`function` 在数组元素上进行测试，如果它通过了由 `function`\
  \ 指定的测试，则会被被添加到新数组中。同样地，每个元素都会经过测试，通过函数的元素会被添加到数组中。未通过这些条件的元素将被丢弃，不会添加到新数组中。最后返回这个生成的数组。\n\
  \n```javascript\nfunction isLessThan(element, index, array) {\n  return element\
  \ <= 20;\n};\n\nvar numerals = [11, 55, 8, 23, 9];\nvar result = numerals.filter(isLessThan(20));\n\
  console.log(result); // 返回 [11,8,9]\n\nvar result = [1, 54, 8, 130, 19].filter(isLessThan(20));\n\
  console.log(result); // 返回 [1,8,19]\n```\n\n### `find()`\n该方法用于返回第一个满足方法传递的条件的元素。如果你需要找到满足给定条件的第一个元素的索引，请使用\
  \ `findIndex()` 方法。如果没有找到该值，则返回 `undefined`。\n\n**语法：**\n`array_identifier.find(custom_function);`\n\
  `array_identifier.findIndex(custom_function);`\n\n### `reduce()`\n`reduce` 操作用于执行聚合操作，这对于维护状态是必要的。该方法接受还原器函数作为参数，并在数组中的每个元素上执行该函数，以产生单个聚合值作为输出。还原器函数需要四个参数才能正常工作，即：累加器、`element`、`index`\
  \ 和源数组。累加器（或 `acc`）在整个方法执行期间像全局变量一样工作，并用于存储输出值。其余三个参数（即 `element`、`index` 和源数组）在之前的章节中已讨论过。在处理每个元素后，`acc`\
  \ 的值将更新为保留最近的值。使用 `reduce()` 方法的语法如下：\n\n**语法：**\n`array_identifier.reduce(custom_function(acc,value,index,arr))`\n\
  `array_identifier.reduce(custom_function(acc,value,index,arr),initValue)`\n\n其中，`custom_function`\
  \ 代表在数组每个元素上执行的 `reduce()` 函数。`acc` 存储处理每个元素后的输出，在最后一次操作后，返回它的值。第二个参数是可选的 `initValue`。如果传递了\
  \ `initValue`，则 `acc` 将从该值开始。如果未指定 `initValue`，则默认取 0，因此 `acc` 假设初始值为 0。`element`\
  \ 是正在处理的当前元素，`index` 是正在处理的元素的索引。`array_identifier` 是 `reduce()` 操作的数组引用名称；`index`\
  \ 和 `array` 都是可选的传递参数。\n\n```javascript\nvar numerals = [1, 2, 3, 4]\nvar aggregatedResult\
  \ = numerals.reduce(function (acc, value, index, array) { return acc + value });\n\
  \n// 未提供初始值，所以 acc 从 0 开始\nconsole.log(aggregatedResult);\n// 输出 10，计算方式为：acc =\
  \ ((((0 + 1)+2)+3)+4)=10\n\naggregatedResult = numerals.reduce(function (acc, value,\
  \ index, array) { return acc + value; }, 20);\n// 提供了初始值，所以 acc 从 20 开始\n```\n\n\
  ### `some()`\n该方法用于测试数组中至少有一个元素是否了方法传递的条件。它返回一个布尔值。\n\n**语法：**\n`array_identifier.some(function);`\n\
  \n其中，`function` 指定了测试条件。如果数组中至少有一个元素通过了 `function` 指定的测试，则返回 `true`；否则返回 `false`。\n\
  \n```javascript\nvar numerals = [1, 2, 3, 4];\nfunction lessThanTen(element) {\n\
  \  return element < 10;\n}\nnumerals.some(lessThanTen); // 返回 true\n[11, 12, 13].some(lessThanTen);\
  \ // 返回 false\n```\n\n## 5.6 嵌套与二维数组\n数组也可以包含数组，这样的数组被称为二维数组。元素可以通过 `shift()` 和\
  \ `push()` 方法分别添加到数组的开头和末尾。这些数组可以通过索引或遍历来访问。以下是使用二维数组的示例：\n\n```javascript\nvar\
  \ nestedNumerals = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];\nconsole.log(nestedNumerals[1][1]);\
  \ // 返回 5\nconsole.log(nestedNumerals[2][1]); // 返回 8\nnestedNumerals.pop(); //\
  \ 移除 [7,8,9]\nnestedNumerals.push([12, 24, 48]); // 将 [12,24,48] 添加到末尾\nconsole.log(nestedNumerals);\n\
  // 输出 [[1, 2, 3],[4, 5, 6],[12, 24, 48]]\n```\n\n以下示例演示了使用嵌套循环遍历元素：\n\n```javascript\n\
  var studentDetails = [[\"Tom\", 80, 6], [\"Tim\", 75, 7], [\"Bob\", 88, 9]];\n\n\
  console.log(\"Name, Percentage, Class\");\nfor (var i = 0; i < 3; i++) {\n  console.log(\"\
  \\n\");\n  for (var j = 0; j < 3; j++) {\n    console.log(studentDetails[i][j]);\n\
  \  }\n}\n/*\n输出:\nName, Percentage, Class\n\nTom,80,6\n\nTim,75,7\n\nBob,88,9\n\
  */\n```\n\n## 5.7 排序\nJavaScript 提供了 `sort()` 方法对数组元素进行排序。元素根据值进行比较，生成的数组按升序排列。为了找到元素的降序排列，可以在数组可以使用\
  \ `reverse()` 方法。\n\n`sort()` 通过将元素转换为字符串并进行比较来工作。因此，在需要对数值数组进行排序的情况下，效果可能不佳。解决方案是向\
  \ `sort()` 方法传递一个比较函数。比较函数可以用于为数组元素生成任何类型的排序操作。它赋予了按照任意顺序修改数组元素的灵活性。使用 `sort()`\
  \ 的语法非常简单，如下所示：\n\n**语法：**\n`array_identifier.sort();`\n`array_identifier.sort(comparingFunction);`\n\
  \n`comparingFunction` 应返回一个整数，并根据该值做出决策：\n\n*   `如果 comparingFunction (x, y) < 0`\n\
  \n\n\n\n那么在排序后的数组中 `x` 的值将排在 `y` 的值之前。\n\n* 如果 `comparingFunction(x, y) > 0`\n\n\
  \    那么在排序后的数组中 `y` 的值将排在 `x` 的值之前。\n\n* 如果 `comparingFunction(x, y) = 0`\n\n  \
  \  那么数组内元素的顺序保持不变。\n\n比较函数可用于定义数组排序的不同替代方案。在比较和排序时，可以对元素执行不同的操作。然而，排序后的数组将包含相同的元素，也就是说在比较函数中执行的操作对数组中存在的元素的值没有影响。\n\
  \n下一个示例演示了在简单数组上使用 `sort()` 和 `reverse()` 方法，以及如何对包含 `Objects`（对象）的数组使用比较函数。仔细观察\
  \ `customObjectArr` 数组对象包含三个对象作为数组元素。你现在应该理解，`sort()` 方法无法对此自定义数组进行排序。在这种情况下，我们需要为对象提供排序逻辑，因此我们定义了一个可以根据对象的键对这些对象进行排序的函数。仔细观察示例中使用的逻辑，这将你对目前讨论的所有主题建立深刻的理解。\n\
  \n```javascript\nvar numerals = [4, 8, 1, 9, 3, 2, 8];\n\nvar text = [\"Alice\"\
  , \"Bob\", \"Tim\", \"Carol\", \"Timmy\"];\n\nvar specialArr = [{ \"501\": \"Bob\"\
  \ }, { \"101\": \"Tim\" }, { \"202\": \"Carol\" }];\n\nnumerals.sort(); // [1, 2,\
  \ 3, 4, 8, 8, 9]\n\ntext.sort();\n\n// [\"Alice\", \"Bob\", \"Carol\", \"Tim\",\
  \ \"Timmy\"]\n\nnumerals.reverse() // [9, 8, 8, 4, 3, 2, 1]\n\nspecialArr.sort(function\
  \ (x, y) { return Object.keys(x)[0] - Object.keys(y)[0] });\n\nconsole.log(specialArr);\n\
  \n/* Expected output:\n\n{101: \"Tim\"}\n\n{202: \"Carol\"}\n\n{501: \"Bob\"}\n\n\
  */\n```\n\n## 5.8 思考题\n\n在结束关于数组的讨论之前，让我们思考一下使用数组的一些要点。回顾、总结和详细阐述一些关键点对于补充其余讨论将是有帮助的。\n\
  \n* 数组没有任何预定义的数据类型。它可以在单个数组中存储不同数据类型的值，如字符串、数字、布尔值和对象。\n* 可以使用类型为数字的索引轻松访问数组元素。\n\
  * 数组索引始终从零开始，其中 `[0]` 用作数组中第一个元素的索引值。\n* 当 `typeof` 运算符作用于对象时，它返回类型 `object`。对于数组，如果对象是使用\
  \ `new` 关键字创建的，则返回 `Array`。\n* 数组可以包含对象或其他数组甚至函数作为其元素。JavaScript 在这些方面非常灵活。\n* 可以使用不同的控制语句来遍历数组。\n\
  * 对象使用命名索引来存储不同的值，而数组使用数字索引来存储不同的值。这就是为什么它们被称为一种特殊类型的对象。数字索引存储使其成为存储大量数据的理想选择。对于大规模、有序的数据集合，使用它更易于处理。\n\
  * JavaScript 数组内置了许多用于操作数组的方法，从而使它成为开发者中的流行选择。与其他语言相比，JavaScript 中的数组更强大，并提供了可以在其上执行的广泛操作。\n\
  * 数组具有全局作用域，因此在程序的整个生命范围内都可以轻松地访问或操作。\n* 如果将 `length` 属性设置为零，可以清空或删除整个数组。重置 `length`\
  \ 属性会截断并使数组为空。\n\n## 5.9 练习\n\n### 5.9.1 理论\n\n1. 批判性地分析在 JavaScript 中使用数组的优缺点。理想情况下，开发者应该在程序的何时使用数组？\n\
  2. 存储在数组中的不同数据类型的默认值是什么？\n3. 我们如何比较、排序和切片数组？使用程序代码演示这些操作的工作。\n4. 编写一个脚本，使用不同的方法创建三个数组。将这些数组进行相互比较，然后在控制台上打印结果。\n\
  5. 编写多维数组加法、减法和乘法的程序代码。\n\n### 5.9.2 判断对题\n\n1. 数组是 JavaScript 中的一种特殊对象，用于存储相同的数据类型和值。\n\
  2. 数组可以在不声明的情况下直接使用和填充。\n3. `length` 属性可以用于获取数组内元素的数量。\n4. 如果数组有九个元素，那么第一个元素的索引为\
  \ 0，倒数第二个元素的索引值为 7。\n5. JavaScript 数组可以嵌套以创建多维数组。\n6. 使用 `reverse()` 方法跟随 `join()`\
  \ 方法将反转数组并将其存储在原数组中。\n7. 数组大小可以是负数。\n8. 可达（Reachability）是 JavaScript 内存管理的核心概念。\n\
  \n### 5.9.3 单选题\n\n1. 在数组上使用 `pop()` 方法将导致：\n    a. 长度减小。\n    b. 长度增加。\n2. 对于以下命令，第四个元素的值是多少？`var\
