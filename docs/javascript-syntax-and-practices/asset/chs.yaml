  \ JavaScript 提升到下一个水平，以及 JavaScript 如何帮助设计各种其他应用程序。JavaScript 的范围非常广阔。我们的书只是你起起点站之一，为你提供一个可以飞行的乐场。我们祝你在使用这种语言编程时取得成功并获得充实的快乐。\n\
  \n## 10.1 案例研究-1：Fetch API 简介\n\n### 10.1.1 目标\n\n1. 学习 JavaScript 使用的 Fetch API。\n\
  2. 使用 `fetch()` 调用 API。\n3. 解析来自 API 的数据。\n\n### 10.1.2 前提条件\n\n1. 访问 [`www.routledge.com/9780367641429`](https://www.routledge.com/9780367641429)\
  \ 并下载 `Ch_10_Fetch_Template` 的压缩文件。\n2. 解压内容并使用任选的编辑器打开 `index.html`（例如：记事本或 Visual\
  \ Studio Code）。\n3. 在 `index.html` 的 `<script>` 块中插入提供的代码。\n4. 对提供的每个代码片段重复上述三个步骤。\n\
  \n### 10.1.3 探索\n\n使用任何编辑器，我们将编写并测试 JavaScript 代码来获取 API 并在网页上显示结果。以下是关于 Fetch 你应该了解的内容。Fetch\
  \ 是一种跨网络进行 GET 和 POST 资源的简单、逻辑的方法 [1]。它提供了一个用于操作资源的 JavaScript 接口。我们正在关注 `fetch()`\
  \ 语法的 GET 部分。\n\n* 我们在这个案例研究中将使用的 API 是 Dog-API。我们建议在继续练习之前先阅读其文档 [2]。\n* 执行此案例研究并进行练习后，你可以进一步探索更多\
  \ JavaScript API，学习这些将是有趣的 [3]。\n\n```javascript\nfetch(<API’ s url>)\n// fetch\
  \ 需要一些时间，因为正在从不同的服务器获取资源，因此在成功获取 API 之后必须执行下一步。\n.then(<res-variables>=> { return\
  \ res.json() })\n.then(<data-variable>=> {console.log(<data-variable>)\n// 如果在运行时或获取时抛出错误；使用\
  \ catch 块来避免你的网页出现异常。\n.catch(err => {console.err(\"Failed to fetch, error = ”,\
  \ err) })\n```\n\n#### 10.1.3.1 代码片段\n\n```javascript\n// 将 API 存储为常量。\nconst DOG_API\
  \ = \"https://dog.ceo/breeds/random\";\n\n// 为按钮添加事件。\ndocument.querySelector(\"\
  .btn\").addEventListener(\"click\", () => {\n  // 等待 fetch 完成。\n  fetch(DOG_API)\n\
  \  .then((res) => {\n    // 解析数据为 JSON。\n    return res.json();\n  })\n  .then((apiData)\
  \ => {\n    // 将 JSON 转换为字符串显示。\n    document.querySelector(\".info\").innerHTML\
  \ = JSON.stringify(apiData);\n    // 使用分隔符分割 url，获取品种。\n    document.querySelector(\"\
  .dog-box\").src = apiData.message.split(\"/\")[4];\n  })\n  .catch((err) => {\n\
  \    console.log(err);\n  });\n});\n```\n\n## 10.2 案例研究-2：集成 MongoDB\n\n### 10.2\
  \ 目标\n\n创建一个向我们的 node.js 服务器发送请求的网页。\n\n### 10.2 前提条件\n\n#### 10.2.1 MongoDB Cloud\n\
  \n1. 在你的系统上安装 docker（如果你熟悉 Node.js）。\n2. 从 [`www.routledge.com/9780367641429`](https://www.routledge.com/9780367641429)\
