  ;\n  }\n});\n```\n\n# 3 对象\n\nDOI: [10.1201/9781003122364-3](https://doi.org/10.1201/9781003122364-3)\n\
  \n> *美的质量取决于观察者如何评估一个对象的价值*。\n> –Toba Beta\n\n在 Web 开发初期阶段，页面的目标是向用户交付静态内容。向动态编程的转变增加了代码维护的复杂性。传统的变量和函数维护方式使情况变得糟糕。存储值的简单变量和单个函数已无于事，需要对编程模型进行彻底的改变。此外，随着对网页日益复杂的需求的出现，这导致了视角从过程式编程范式向面向对象**编程范式的转变。\n\
  \n面向对象编程（OOP）范式被大多数流行的编程语言采用。对象、类、继承、多态、抽象等概念共同结合，赋予了开发者创建更动态、设计良好的现实世界解决方案的自由。此外，生成的代码更容易维护、重用和调试。\n\
  \n对象是 OOP 编写代码方式的基本构建单元。要理解 OOP，我们需要对对象的概念有良好的理解。让我们从物理世界来观察这一点。你周围的一切都是对象。看看桌子、椅子、扬声器、手机等；每一个对象都可以由\
  \ `state`（状态）和 `behavior`（行为）来表示。\n\n`state` 定义了任何对象可能拥有的的一组可能状态。在任何时刻，它只能拥有这些可能状态之一。而行为定义了对象如何从一个状态迁移到另一个状态，对象的行为可以理解为应用于对象上的任何动作。例如，台灯可以处于开启`on`或关闭（`off`的状态的状态，并具有开启关闭的行为。这里，`on/off`\
  \ 是可能状态之一，而 `turn on/off` 是改变其状态所执行的动作。同样，猫的状态由颜色、重量、尺寸和品种定义。猫的行为通过它做什么来判断，即：喵叫、奔跑、抓挠等。这就是对象的状态和行为如何共同使其看起来和表现得得像任何现实世界的对象。\n\
  \n快速练习：观察你周围的物理对象并思考它们可能处于的不同状态；思考它们表现出的不同行为。如果你被要求对这些对象建模，你将如何描述这些对象的状态和行为。尝试至少对\
  \ 10 个不同的对象。\n\n本章讨论了对象的概念，以及它们在声明和使用方面与其他编程语言的区别。文中提供了关于对象属性的详细讨论，随后是类的概念。此外，还讨论了\
  \ JavaScript 对象的原型继承，并在章节末尾讨论了带有子类的继承概念。\n\n## 3.1 对象\n\n对象被用于表示现实世界的实体，这使得编程对开发者来说成为了一种解决方案。对象可以以一种组织且凝聚的方式存储数据。对象是\
  \ JavaScript 的基本数据类型 [67]。除了极少数原始数据类型外，JavaScript 中的几乎所有内容都是面向对象的；这些原始类型也有它们的包装对象，正如我们在之前的章节中讨论过的那样。对象是包含多个值的变量。\n\
  \n图 3.1 表示了程序代码、对象引用和对象之间的关系。程序代码使用对象引用来访问实际对象。对象可以被看作存储框，具有存储任何类型值（简单或复合值）的自由。\n\
  \n```javascript\nvar obj = {} // obj 是空对象的引用\nvar obj2 = {\"key1\": \"Value1\",\
  \ \"key2\": 1234}//obj2 是持有 key1 和 key2 的对象的引用\n```\n\n在之前的示例中，代码 `obj` 是表示对象的引用名称或句柄名称。相反，`obj2`\
  \ 可以包含多个值，如字符串和数字。obj2 内部的值可以通过 `obj2.key1`（返回字符串 `Value1`）和 `obj2.key2`（返回数字 `1234`）来访问。对象允许开发者以任何合适的方式设计和存储数据。这些命名的值用于存储信息的键值对，通常被称为属于对象的`属性`。\n\
  \n在网页开发过程中，开发者会在地方发现对象，例如原生对象、主机对象或用户定义对象。这些简要说明如下：\n\n*   **原生对象**是由 ECMAScript\
  \ 规范定义的，如数组、函数和正则表达式。\n*   **主机对象**是由运行程序的主机环境定义的，即大多数情况下浏览器。浏览器对象模型（BOM）和文档对象模型（DOM）使用主机对象；这些将在后续章节中详细讨论。\n\
  *   **用户定义对象**是开发者根据需求在代码中创建的自定义对象。这些是使用最广泛的对象，允许操作和执行不同的操作，从而控制网页的行为。\n\n\n\n\n\
  \nJavaScript 的特殊特性之一是原型和原型继承的概念。JavaScript 中的每个对象都继承自一个名为 `Object` 的通用原型。该原型可以通过调用\
  \ `Object.prototype` 轻松地引用。所有对象的内置构造函数和大多数用户定义的构造函数都从 `object` 继承其原型。对象可以被其他对象继承，从而形成一系列连接的对象，这通常被称为`原型链`（prototypal\
  \ chain）。在接下来的章节中将进一步详细讨论原型继承。现在，让我们详细讨论对象的属性。\n\n## 3.2 对象的属性\n\n对象具有属性，用于定义以及描述特定对象的状态和行为。对象的属性始终有一个名称和一个关联的值。属性的名称始终是一个\
  \ `string` 或 Symbol（名称、数字或字符串字面量），它映射到一个实际值。对象的属性类似于 Java 语言中的 `HashSet`，其中键（key）必须是唯一的，因此值（value）可以是任何类型，即使是函数也可以。值为函数的属性被称为`方法`（method）。\n\
  \n对象必须具有不同的属性，即不存在两个同名的属性。属性的值可以通过直接提供值来设置（如下一个示例中的 `person1` 所示），或者通过使用 `new` 关键字设置（如\
  \ `person2` 所示）。还要注意，属性中的键始终是字符串。无论你是否使用“ ” 并不；`first Name` 定义在“ ” 内部，而 `age` 和\
  \ `gender` 则在没有引号的情况下编写。这不是错误，而是一种非常有效的声明键的方式；我们只在键是 `multiword`（多单词）时才使用“ ”。同样，在使用\
  \ `new` 关键字创建对象 `person2` 时，我们可以添加任何类型的属性和任意数量的属性。使用 `person2[\"first Name\"]` 定义的属性键指的是此处关联的键。\n\
  \n```javascript\nvar person1 = { “first Name”: “Ram”, age: 50, gender: “M” }\n\n\
  //静态创建对象的方式\n\nvar person2 = new Object();\n\n//动态创建对象的方式\n\nperson2[\"first Name”]=“Ram”;\n\
  \n// 对于多单词键使用方括号 []\n\nperson2.age = 50; // 可以后续添加属性\n\nperson2.gender = “M” //\
  \ 任何类型的属性\n```\n\n`点表示法`（Dot notation）用于访问和表示对象及其属性，例如 `objectName.propertyName`。如果键是多单词，则使用方括号。对象是可变的，即在本质上是可以更改的，并使用引用或句柄名称进行操作。每个属性包含一些额外的元数据；让我们在接下来的子章节中理解。\n\
  \n### 3.2.1 属性配置描述符\n\n我们已经看到每个属性都包含一个键和一个值。这是一个非常广泛的视角；更具体地说，键被称为属性的 `name`，而值部分是其他四个属性中的一个。任何属性的四个属性是\
  \ `value`、`writable`、`enumerable` 和 `configurable`。这些属性决定了给定属性在被访问、读取或写入时的行为。默认情况下，JavaScript\
  \ 中属性的所有属性都是可读的。这些属性进一步解释如下：\n\n*   **Value attribute（值属性）：** 值属性是属性将存储的 `data`\
  \ 部分，并按原样使用。其余属性定义了如何访问值或属性。\n*   **Writable attribute（可写性属性）：** 用于检查对象属性的值是否可以被`assigned`（赋值）为新值。对于大多数内置对象，默认情况下是\
  \ `false`，对于用户创建的对象，默认是 `true`。\n*   **Enumerable attribute（可枚举性属性）：** 用于检查属性名是否被循环（while/for）使用或返回，即是否允许迭代或枚举。当设置为\
  \ `true` 时，允许使用 `for…in` 循环进行枚举（后文将讨论）。对于大多数内置对象，默认情况下是 `false`，对于用户创建的对象，默认是 `true`。\n\
  *   **Configurable attribute（可配置性属性）：** 指定了给定对象的配置是否可以被`altered`（更改）。默认情况下，此属性被设置为\
  \ `true`。如果设置为 `false`，则无法修改属性的配置。\n\n下一个示例展示了一个新创建的自定义对象 `book` 和 `Object` 的静态方法。使用\
  \ `Object.getOwnPropertyDescriptor` 查看属性配置描述符。观察注释部分所示输出。\n\n```javascript\nvar\
  \ book = {\n\ntitle: 'Harry Potter',\n\nauthor: 'J.K. Rowling',\n\n};\n\nconsole.log(Object.getOwnPropertyDescriptor(book,\
  \ 'title'));\n\n/* 输出将是以下对象:\n\nvalue: “Harry Potter”\n\nconfigurable: true\n\n\
  enumerable: true\n\nwritable: true\n\n*/\n```\n\n表 3.1 显示了内置和用户定义类型的属性、类型和默认值。\n\
  \n表 3.1 属性的属性\n\n| 属性 | 类型 | 内置对象的默认值 | 用户创建对象的默认值 |\n| --- | --- | --- | --- |\n\
  | Key | String 或 symbol 类型 | Undefined | 用户定义的键 |\n| Value | 任意数据类型 | Undefined\
  \ | 用户定义的值 |\n| Writable | Boolean | False | True |\n| Enumerable | Boolean | False\
  \ | True |\n| Configurable | Boolean | False | True |\n\n大多数内置属性都是不可写、不可枚举且不可配置的。用户创建的对象上定义的属性大多是可写、可枚举且可配置的。对象属性之间的关系是层次性的。JavaScript\
  \ 不限制开发者处理单层属性。相反，万一切都是对象。\n\n## 3.3 创建对象\n\nJavaScript 允许孤立地创建对象，即无需创建类。首先，创建对象有三种方法。可以使用字面量、`new`\
  \ 关键字或使用 `Object.create()` 函数创建对象 [67]。\n\n*   **通过字面量：** 对象字面量是一个用逗号分隔的、冒号（:）分隔的键值对列表，每对都表示一个对象属性。对象字面量在每次遇到时都会创建并初始化一个新的对象。每当解析或评估对象字面量时，它都会创建一个具有某些预定义配置属性和提供值的对象。\n\
  \    ```javascript\n    let emptyObject = {}; //没有属性的空对象\n\n    let line = { x:\
  \ 6, y: 10 };\n\n    /*带有 x 和 y 属性的 line 对象 */\n\n    let room = {\n\n    walls:\
  \ 4, flooring: tiles,\n\n    owner: { first_name: Jane, last_name: Doe }\n\n   \
  \ };\n\n    /* 声明一个嵌套对象的 room\n    ```\n\n在代码段中，我们可以观察到对象的键可以是字符串、Symbol 或数字，而相应的存储值可以是任何类型。对象\
  \ `room` 具有 `walls`、`flooring` 和 `owner` 属性，其中 `owner` 本身是一个对象，具有 `first_name` 和\
  \ `last_name` 属性。对象可以另一个对象作为其属性，这被称为对象的嵌套。这允许创建对象的层次结构，赋予开发者扩展对象的能力。\n\n```javascript\n\
  var obj = new Object();\n\n// 类似于 var obj = {}; 创建对象\n\nvar arr = new Array();\n\
  \n// 类似于 var arr = [] 创建对象\n\nvar dt = new Date();\n\n// 创建日期对象\n```\n\n\n\n\n\n\
  - **通过 `new` 关键字**：`new` 操作符用于创建并初始化一个对象。`new` 关键字的调用必须紧跟一个方法调用。这个特殊方法被称为 `constructor`（构造函数），主要用于新对象的创建和初始化。JavaScript\
  \ 为其内置类型提供了内置构造函数。除了内置构造函数，还可以定义自定义构造函数来初始化对象。\n\n- `obj`、`arr` 和 `dt` 是使用 `new`\
  \ 关键字创建的空对象；这些对象分别继承自通 `Object`、`Array` 和 `Date` 原型。除了内置构造函数，还可以定义自定义构造函数来初始化对象。\n\
  \n在下面的代码段中，使用 `new` 关键字创建了一个新对象，并使用使用 `function` 定义的自定义构造函数进行初始化。这种构造函数被称为对象构造函数，`Person`\
  \ 对象将自动派自 `Object` 类。\n\n```javascript\nfunction Person(fName, age, gender) {\n\
  \  this.fName = fName;\n  this.age = age;\n  this.gender = gender;\n}\n\nvar myMother\
  \ = new Person(\"Alice\", 51, \"F\");\n//myMother 对象被创建\n```\n\n- **通过 `Object.create()`\
  \ 函数**：该方法可以用于创建一个新对象。它还可以接受一个可选参数，即基于某个原型对象创建一个对象。`Object.create()` 方法是 `Object`\
  \ 类的一个静态方法。`Object.prototype` 将创建一个继承自原型中基础方法的对象。在 `Object.create()` 内部传递的参数被视为属性，并且必须以键值对的形式提供。这些属性会被新创建的对象继承。将\
  \ `null` 作为参数将创建一个空对象，该对象不会从 `Object.prototype` 继承任何内容。让我们通过接下来给出的示例来理解这一点。\n\n\
  ```javascript\nvar obj1 = Object.create();\n//创建一个空对象\n\nvar obj2 = Object.create(null);\n\
  //null 对象不从原型继承任何内容\n\nvar obj3 = Object.create({ x: 1, y: 20 });\n/*创建了名为 obj3\
  \ 的对象，并继承了属性 x 和 y */\n\nvar obj4 = Object.create(Object.prototype);\n//创建一个等同于\
  \ obj1 的普通对象\n\nvar obj5 = Object.create(myMother);\n//创建在示例中创建的 myMother 对象的拷贝\n\
  \nvar obj6 = Object.create(Person.prototype);\n//创建一个空对象\n```\n\n从示例中可以看出，`Object.create()`\
  \ 方法是一个静态方法，可以以几种不同的方式使用。`obj1` 是创建一个空对象的示例，创建的对象类似于使用 `var obj1` = `{}` 创建的对象。其他对象\
  \ `obj2`、`obj3`、`obj4`、`obj5` 和 `obj6` 是通过向 `Object.create()` 方法传递参数创建的。传递的参数确保了新创建的对象包含了所传递的\
  \ `object`、属性或原型的属性。对于 `obj2` 传递 `null` 是该陈述的例外，因为 `null` 是一个原始数据类型，没有任何属性。\n\n\
  ## 3.4 作为记录和字典的对象\n\n对象的创建可以是具有固定数量的属性，也可以具有可数量的属性。在开发时声明具有固定数量属性的对象被称为**作为记录的对象\
  \ (object as records)**，而具有可以动态变化的数量属性的对象被称为**作为字典的对象 (object as dictionaries)**\
  \ [[68]](#ref-list.xhtml_refReferences_68)。\n\n对象作为记录使用时效果最好。但在 ES6 之前，JavaScript\
  \ 还没有用于字典的数据结构（ES6 引入了 Maps）[[69]](#ref-list.xhtml_refReferences_69)。因此，必须使用对象作为字典，这施加了一个巨大的限制：键必须是字符串（ES6\
  \ 也引入了符号 symbols）[[70]](#ref-list.xhtml_refReferences_70)(表 3.2。\n\n表 3.2 作为记录和字典的对象的区别\n\
  \n| 作为记录的对象 | 作为字典的对象 |\n| --- | --- |\n| 预先指定的固定数量属性 | 可以根据需要扩展的动态变化或可数量属性 |\n\
  | 键在开发时已知的 | 键在开发时未知 |\n| 值可以具有不同的数据类型 | 所有值具有相同的数据类型 |\n\n在创建作为记录的对象时，必须指定对象将要使用的信息键值对。它允许存储具有不同数据类型的属性，因此被用于创建需要存储特定但多种属性的对象。另一方面，将对象作为字典允许代码根据需要动态地添加尽可能数量的属性，但所有属性必须具有相同的数据类型。不需要预先指定每个属性；相反，可以在程序执行过程中根据需要添加属性。\n\
  \n## 3.5 对象的操作\n\n可以使用某些预定义的函数对对象的属性进行访问、变异或迭代。在本节中，我们将讨论如何 `set` 和 `get` 对象的属性。这些被称为\
  \ setter 和 getter 方法，更常见地被称为 `accessor`（访问器）和 `mutator`（修改器）方法。我们随后详细阐述用于检查各种对象属性和属性配置描述符的不同函数。\n\
  \n### 3.5.1 访问器和修改器 (Accessors and Mutators)\n\n要访问或变异任何对象属性，可以使用点运算符或方括号。可以通过简单地使用对象名后跟属性名（或使用方括号）来访问属性。\n\
  \n```javascript\nvar book = {} //创建一个空对象\n\nbook.title = \"Harry Potter\" //使用点运算符设置\
  \ title\n\nbook[\"authored by\"]=\"J.K.Rowling\" //使用方括号设置 authored by\n\nvar title\
  \ = book.title; //使用点运算符返回对象的 title 属性\n\nvar name = book[\"authored by\"] //使用方括号返回对象的\
  \ authored by 属性\n```\n\n同样，JavaScript 为我们提供了定义 getter 和 setter 访问器的方法，通过获取/设置属性来调用。\n\
  \ngetter 是通过获取属性调用的方法类实体；观察下面的示例，`full` 是通过添加 `get` 前缀创建的。调用 `book.full` 将返回 `Harry\
  \ Potter-J.K.Rowling`。注意我们在调用 `full` 时没有使用 `()`，因为这不是方法调用而是特殊的获取属性。\n\n```javascript\n\
  var book = {\n  title: \"Harry Potter\",\n  author: \"J.K.Rowling\",\n  get full()\
  \ {\n    return `${this.title}-${this.author}`;\n  },\n}; //创建一个带有 get 方法的 book\
  \ 对象\n```\n\n同样，setter 是通过设置属性调用的方法类实体；观察下面的示例，方法 `full` 使用 `set` 前缀，并传入了 `details`。该方法根据\
  \ ‘-‘ 分割 details 并设置 title 和 author 属性。此外，当设置 `book.full` 属性时，会调用 `full()` 方法并传入\
  \ `details` 参数。\n\n```javascript\nvar book = {\n  title: \"no title defined\",\n\
  \  author: \"no author defined\",\n  set full(details) {\n    var parts = details.split('-');\n\
  \    this.title = parts[0];\n    this.author = parts[1];\n  },\n}; //创建一个带有 setter/访问器方法的\
  \ book 对象\n\nbook.full = \"Harry Potter - J.K.Rowling\" //设置 full 属性\nconsole.log(book.title)\
  \ // Harry Potter\nconsole.log(book.author) //J.K.Rowling\n```\n\n### 3.5.2 有用的操作和循环\n\
  \nJavaScript 允许通过功能测试对象内部是否存在属性。可以通过以下任何方法实现：\n\n\n\n\n\n### 赋值运算符\n`Assignment\
  \ operator` 用于检查属性是否存在。如果对象对象内部不存在该属性，则返回 `undefined`。接下来的示例演示了赋值运算符的使用。\n\n```javascript\n\
  var book = { title:“Harry Potter”, author:“J.K.Rowling” };\n//创建了一个书籍对象\nconsole.log(book.title!==\
  \ undefined) //输出 true\nconsole.log(book.author!== undefined) //输出 true\nconsole.log(book.isbn!==\
  \ undefined) //输出 false\n```\n\n### 使用 in 运算符\n`in` 运算符是一个二元运算符，用于检查左操作数的属性是否存在于右操作数的对象内部；如果对象自身定义或在其继承属性中拥有该属性，则返回\
  \ `true`。在接下来的示例中，我们可以看到 `toString` 属性也得到了 `true`；这是由于继承的原因。\n\n```javascript\n\
  var book = { title:“Harry Potter”, author:“J.K.Rowling” };\n//创建了一个书籍对象\nconsole.log(“title”\
  \ in book) //输出 true\nconsole.log(“author” in book) //输出 true\nconsole.log(“isbn”\
  \ in book) //输出 false\nconsole.log(“toString” in book)\n//输出 true，因为 toString 是继承属性。\n\
  ```\n\n### hasOwnProperty()\n提供此特殊方法用于检查对象上定义的继承属性和自身属性。该方法对于对象的自身属性返回 `true`，对于继承的属性返回\
  \ `false`。在接下来的示例中，我们可以看到 `toString` 属性返回了 `false`（这是因为 `toString` 是一个继承属性）。\n\n\
  ```javascript\nvar book = { title:“Harry Potter”, author:“J.K.Rowling” };\n//创建了一个书籍对象\n\
  console.log(book.hasOwnProperty(“title”))\n//输出 true\nconsole.log(book.hasOwnProperty(“author”))\n\
  //输出 true\nconsole.log(book.hasOwnProperty(“toString”))\n//输出 false\n```\n\n###\
  \ propertyIsEnumerable()\n`propertyIsEnumerable` 方法是 `hasOwnProperty` 方法的更精细版本。只有当属性是对象的自身属性且可枚举属性被设置为\
  \ `true` 时，它才返回 `true`。对于可枚举属性设置为 `false` 的属性，它返回 `false`，即不允许对这些属性进行迭代。下面是演示其用法的示例。\n\
  \n```javascript\nvar book = { title:“Harry Potter”, author:“J.K.Rowling” };\n//创建了一个书籍对象\n\
  console.log(book.propertyIsEnumerable(“title”))\n//输出 true\nconsole.log(book.propertyIsEnumerable(“author”))\n\
  //输出 true\nconsole.log(book.propertyIsEnumerable(“toString”))\n//输出 false\n```\n\
  \n### 遍历属性\n现在，是时候理解特殊的 `for…in` 循环的作用了，我们在第 2 章 中讨论过。现在你理解一个对象包含许多属性，并且可能有遍历该对象键的需求。在所有这些情况下，都会使用\
  \ `for…in`。语法之前讨论过，让我们通过一个 `for…in` 循环的示例来付诸实践。\n\n```javascript\nvar book = { title:\
  \ “Harry Potter”, author: “J.K.Rowling” };\n//创建了一个书籍对象\ndelete book.title;\n//从书籍对象中删除\
  \ title 属性\nconsole.log(book)\ndelete book; //对对象没有影响\nconsole.log(book)\n\n/*\n\
  输出将是：\n{author: “J.K.Rowling”}\n{author: “J.K.Rowling”}\n*/\n```\n\n始终记住，`for…in`\
  \ 会遍历所有属性，包括继承的且可枚举的。通常情况下，所有内置属性或对象的继承属性在本质上都是不可枚举的，而用户定义的属性默认是添加且可枚举的。在这种情况下，可以使用\
  \ `hasOwnProperty` 方法在 `for…in` 循环中过滤掉继承属性。\n\n有许多方法可以根据需求为我们提供键和值，用于遍历：\n\n* `Object.keys()`\
  \ 方法返回一个包含对象可枚举属性的数组。\n* `Object.getOwnPropertyNames()` 返回一个属于对象的所有字符串类型属性的数组，不考虑其可枚举状态。\n\
  * `Object.getOwnPropertySymbols()` 返回一个属于对象的所有 symbol 类型属性的数组，不考虑其可枚举状态。\n* `Reflect.ownKeys()`\
  \ 返回所有属于对象的属性，包括可枚举的、不可枚举、字符串和 Symbol。\n\n### 删除对象属性\n在开发过程中，可能需要删除对象的属性。`delete`\
  \ 关键字可以放在 `object.propertyName` 或 `object[propertyName]` 之前。它会同时删除属性名（键）和属性（值）。一旦删除，该属性将无法使用，直到你再次添加它。`delete`\
  \ 运算符对变量和函数没有影响；它仅用于对象的属性。此外，在使用 `delete` 处理预定义对象及其属性时要小心，因为删除它们的属性可能会导致应用程序处于挂起状态，更糟糕的是崩溃。\n\
  \n```javascript\nvar book = { title: “Harry Potter”, author: “J.K.Rowling” };\n\
  //创建了一个书籍对象\nfor (key in book) {\n  console.log(“Key is: ” + key + “ Value is: ”\
  \ + book[key])\n}\n\n/*\n输出将是：\nKey is: title Value is: Harry Potter\nKey is: author\
  \ Value is: J.K.Rowling\n*/\n```\n\n成功删除属性返回 `true`，否则返回 `false`。如果删除的属性不存在，则返回\
  \ `true`。如果原型链中存在同名属性，则删除用户定义的属性。如果属性被设置为不可配置，则 `delete` 仅返回 `false` 并抛出 `TypeError`。属于\
  \ `Array`、`Math` 和 `Object` 等内置对象的不可配置属性无法被删除。\n\n### 3.5.3 对象方法\n我们已经讨论了对象的状态。在本节中，我们将讨论对象的行为。对象方法定义了对对象或对象属性的操作。对象方法只是包含方法声明和定义的对象属性。它们可以被视为键值对，其中键表示定义在对象上的方法，值表示方法的声明。\n\
  \n```javascript\nlet person = new Object(); //创建一个新对象\nperson.fName = “Thomas”;\
  \ //添加属性 ‘fName’\nperson.lName = “Shelby”; //添加属性 ‘lName’\nperson.fullName = function\
  \ () //赋值一个函数\n{\n  console.log(this.fName + this.lName);\n} //this 关键字的使用\n}\n\
  ```\n\n在上一个示例中，我们创建了 `person` 对象并定义了三个属性：`fName`、`lName` 和 `fullName`。你现在应该理解前两个属性；第三个属性\
  \ `fullName` 被赋值为一个 `function()`，这种赋值被称为*方法*。方法体可以使用特殊的引用变量 `this` 访问对象的所有其他属性。`this`\
  \ 关键字用于表示所有者，即在本例中，`this` 指向 `person` 对象。另一种创建相同的 `person` 对象并向对象添加方法的方法所示：\n\n\
  ```javascript\nlet person = //创建对象\n{\n  fName: “Thomas”, //定义属性\n  lName:“Shelby”,\n\
  \  fullName: function () { //赋值一个函数\n    console.log(this.fName + this.lName);\n\
  \  } //this 关键字的使用\n}\n}\n```\n\n\n\n\n\n在两个示例中，`person` 对象在创建时都拥有自己的属性和方法，可以通过简单的使用\
  \ `objectName.methodName()` 来访问，例如 `person.fullName()`。圆括号 `()` 用于描述方法的调用/声明。\n\n\
  ### 3.5.4 内置对象方法\n\n所有从原型创建的 JavaScript 对象都会从 `Object.prototype` 继承属性以及方法。被继承的属性是定义在\
  \ `Object.prototype` 上的方法。这些方法旨在由新创建的对象用更具特性的实现所替换。JavaScript 允许轻松地将一个对象的属性拷贝到另一个对象，例如：\n\
  \n```javascript\nlet obj1 = { a: 1, b: 6 }\n\nlet obj2 = { c: 8, d: 10 }\n\nfor\
  \ (let key of Object.keys(obj2))\n//遍历 obj2 的每一个键\n{\n  obj1[key] = obj2[key]; //从\
  \ obj2 拷贝到 obj1\n}\n//输出:\n//obj1 为: {a: 1, b: 6, c: 8, d: 10}\n```\n\n可以使用 JavaScript\
  \ 提供的 `extend()` 工具函数执行相同的操作。另一种方法是使用 `Object.assign()` 函数，并将两个或多个对象作为参数传递。第一个参数称为\
  \ `target object`（目标对象），它会被修改并返回。第二个参数是 `source object`（源对象），它保持不变。`Object.assign()`\
  \ 通过调用简单的 setter 和 getter 方法分别获取和设置源对象与目标对象中的属性值。\n\n语法：\n\n```javascript\nObject.assign(target\
  \ object, source object);\n```\n//将源对象的每个属性覆盖到目标对象\n\n示例：\n\n```javascript\nlet\
  \ obj1 = { a: 1, b: 6 };\n\nvar obj2 = { c: 8, d: 10 };\n\nObject.assign(obj3, obj1).\n\
  ```\n\n*   `toString()` 方法返回对象属性的字符串值，且不需要接收任何参数。它主要由 JavaScript 在对象上使用运算符（如 `+`、`-`\
  \ 运算符）时调用。它可以在预期字符串而不是对象的地方使用。默认情况下，`toString()` 方法传递的信息非常有限。因此，许多类（classes）都在它们自己的类中定义了该方法。\n\
  *   `toLocaleString()` 方法返回调用对象的本地化字符串表示。默认情况下，该方法简单地调用 `toString()` 并返回该值。类可以为该方法定义自己的实现。\n\
  *   `valueOf()` 方法用于将对象转换为另一种原始数据类型而不是字符串。许多内置类为该方法提供了自己的实现。每当需要从对象而不是字符串获取原始值时，该类就可以实现此方法。\n\
  \n## 3.6 原型继承\n\nPHP、Java 和 Python 等编程语言是基于类的语言，并使用类来创建对象。JavaScript 既是基于类的，也是基于原型的语言，它提供了原型并在后期支持使用类来创建对象。通过原型，可以通过泛化对象共享不同的属性，这些对象可以进一步被克隆、扩展或继承\
  \ [[72]](#ref-list.xhtml_refReferences_72)。使用原型扩展功能被称为**原型继承**。JavaScript 中的每个对象都直接或间接地继承自某个原型。\n\
  \n除了拥有自己的一组属性外，JavaScript 中的每个对象都从另一个对象继承属性。用于继承属性和方法的通用对象被称为 `prototype`（原型）。例如，所有对象都继承自同一个原型对象，即\
  \ `Object.prototype`。JavaScript 中创建的所有对象都以 `Object` 作为其原型。它是所有对象的最终父级，访问其之外的任何内容将导致返回\
  \ `null`。\n\n如图 3.2 所示，每个其他原型都继承自 `Object.prototype`。任何类型的数组、函数、正则表达式、Number、String\
  \ 或用户对象都继承 `Object.prototype`。这允许所有其他对象调用在 Object 原型中定义的属性和方法。因此，使用原型有助于为对象添加更多功能，而无需在每个类或对象中声明它们。\n\
  \n![](img/fig3_2.jpg)\n\n图 3.2 通过 Object.prototype 的继承层级结构。\n\n每个对象还有一个名为 `__proto__`\
  \ 的隐藏内部属性，在代码中无法直接访问。可以通过 Object 原型提供的静态方法，即 `Object.getPrototypeOf(obj)` 来访问此隐藏属性。该方法返回属于传递对象的所有内置属性和方法的列表。\n\
  \n```javascript\nvar obj1 = {}; //空对象，不继承任何内容\n\nvar obj2 = new Object() //空对象，继承自\
  \ Object 原型\n\nObject.getPrototypeOf(obj2);\n//返回从原型继承的属性和方法列表\n```\n\n直接为对象定义的属性称为\
  \ `own property`（自有属性）或 `noninherited property`（非继承属性）。从原型继承的属性称为 `prototypal properties`（原型属性）。\n\
  \n### 3.6.1 原型链\n\n每个对象包含 `[[Prototype]]`，即 `__proto__` 对象，指向另一个对象或 null。想象有一个对象\
  \ `Z`，其 `__proto__` 属性设置为对象 `Y`，而对象 `Y` 的 `__proto__` 属性进一步设置为对象 `X`。通过这种方式，原型按需要相互继承。\n\
  \n如图 3.2 所示，每个其他原型都继承自 `Object.prototype`。任何类型的数组、函数、正则表达式、Number、String 或用户对象都继承自\
  \ `Object.prototype`。这允许所有其他对象调用 Object 原型中定义的属性和方法。使用原型有助于为对象添加更多功能，而无需在每个类或对象中声明它们。\n\
  \n```javascript\nvar X = { key1:“value1” }\n\nvar Y = { key2:“value2” }\n\nY.__proto__\
  \ = X\n\nvar Z = { key3:“value3” }\n\nZ.__proto__ = Y\n```\n\n图 3.3 展示了上述代码的执行情况。你可以观察到输出结果：`Z`\
  \ 对象现在在其 `__proto__` 中包含了 `Y` 对象，而 `Y` 对象在它的 `__proto__` 中包含了 `X` 对象。这确保了属性的共享，即对象\
  \ `Z` 可以访问 `key1、key2 和 key3`。\n\n![](img/fig3_3.jpg)\n\n图 3.3 输出截图。\n\n同样，原型继承也可以从其他原型继承方法；例如，在下一个代码段中，`youTubePremiumUser`\
  \ 通过 `__proto__` 对象继承了 `youTubeUser`。鼓励你在自己的机器上尝试此代码，你将发现 `youTubePremiumUser` 继承了\
  \ `youTubeUser` 的 `getEmail` 方法。\n\n```javascript\nlet youTubeUser = {\n  email:\
  \ “dummyemail@gmail.com”,\n  id: 101,\n  viewContent: true,\n  set setEmail(email)\
  \ {\n    this.email = email;\n  },\n  get getEmail() {\n    return this.email;\n\
  \  }\n};\n\nlet youTubePremiumUser = {\n  ads: false\n};\n\nyouTubePremiumUser.__proto__\
  \ = youTubeUser;\n//youTubeUser 是定义的原型\n\nconsole.log(youTubePremiumUser.viewContent);\n\
  //返回 true\n\nconsole.log(youTubePremiumUser.getEmail);\n```\n\n## 3.7 类\n\n你可能在疑惑为什么我们在讨论对象之后还要讨论类。其实\
  \ JavaScript 类是在 2015 年的 ES6 规范中引入的 [[73]](#ref-list.xhtml_refReferences_73)。在 2015\
  \ 年之前，每个对象都有名为 `[[Prototype]]` 的内部属性。该原型用于为新创建的对象提供不同的属性和方法。随着类的引入，出现了一种更简洁、优雅的对象增强方法。类让对象能够在安全清洁的环境中运行，而不会迷失在不同的原型及其方法中。\n\
  \n\n\n\n\n`Object prototype` 是通用原型，每个对象都继承自它，无论它是否属于某个类。因此，在 JavaScript 中，对象并不总是强制要求属于一个类。对象可以独立于类而存在。因此，从开发者的角度来看，类的声明和定义变成了一个选择问题。\n\
  \n回到这个问题，什么是类？简单来说，类是生成对象的蓝图或模板。类被用作一种模板，将对象、其属性以及操作这些属性的方法结合在一起。在 JavaScript 中引入类允许开发者轻松地进行操作并在在其他\
  \ OOP 语言之间进行切换 [[74]](#ref-list.xhtml_refReferences_74)。\n\nJavaScript 中的类可以使用 `class`\
  \ 声明来定义。`class` 关键字用在类名之前，后面跟着声明语句。创建类的语法所示。\n\n语法：\n\n```javascript\nclass MyClass\
  \ {\n  // 类方法\n  constructor() {… }\n  //初始化属性\n  method1() {… }\n  //定义方法\n  method2()\
  \ {… }\n  method3() {…}…\n  …\n}\n```\n\nJavaScript 中的类对语法有严格检查，以提高系统性能。类在具有强语法检查的\
  \ `strict mode` 下运行，这是无法更改的，即类始终在严格模式下工作。必须先声明类后使用；反之则会产生 `ReferenceError`。类方法本质上是不可枚举的（`nonenumerable`）。虽然类被视为特殊类型的函数，但这种限制在函数中并不存在，仅适用于类。作为命名规范，类名的第一个字母总是大写，这有助于在程序中区分类名。\n\
  \n### 3.7.1 构造函数、属性和方法\n\n类可以根据其设计和用途包含不同的属性和方法。使用 `class` 关键字声明类，且只能声明一次。类的定义由构造函数和方法组成。属性通过构造函数初始化，这些属性以及方法会自动成为使用该类初始化的对象的一部分。每个对象都将拥有这些属性的拷贝。使用该类创建的每个对象都是不同的，但本质上是相同的，即每个对象的属性（状态）和方法（行为）是相同的。\n\
  \n类总会有自己的构造函数。构造函数用于初始化新创建对象的值。它是一个用于创建以及初始化通过类实例对象的特殊方法。一个类只能有一个构造函数。每当创建一个新对象时，类中的构造函数就会被调用，以初始化该对象的属性。如果一个类中存在多个构造函数定义，将抛出\
  \ `SyntaxError`。\n\n在图 3.4 中，显示了一个类 `Person`，并用于创建四个对象。每个对象都是独特的，但源自同一个基类。类的声明可以像下面所示：\n\
  \n![](img/fig3_4.jpg)\n\n图 3.4 类与对象。\n\n```javascript\nclass Person //声明一个类\n{ //定义一个类\n\
  \  constructor(uid, name) //类的构造函数\n  {\n    this.uid = uid; //this 关键字的使用\n   \
  \ this.name = name;\n  }\n  greetings() //向类中添加一个方法\n  {\n    console.log(`Hello\
  \ ${this.name}`);\n  }\n}\n\nvar e1 = new Person(123,“Chris”); //从 Person 类创建 e1\
  \ 对象\nvar e2 = new Person(456,“Hermoine”);\nvar e3 = new Person(789,“Harry”);\n\
  var e4 = new Person(926,“Ron”);\ne1.greetings(); //在 e1 上调用方法\n\n/*\n输出将是：\nHello\
  \ Arthur Doyle\n*/\n```\n\n在这个示例中，创建了一个只有一个构造函数和两个属性（即 `uid` 和 `name`）的新类。还提供了一个方法\
  \ `greetings()` 以及一个初始化属性的构造函数。当该方法作为对象的属性被调用时，它会执行并显示输出。\n\n### 3.7.2 类的扩展\n\n\
  类对于预先设计以后可以使用的模板非常有帮助。然而，有时开发者想要修改或更新类定义，以添加某些属性或方法。可以通过扩展类来添加新属性，轻松实现这一点。在上一个示例中，创建了一个具有\
  \ `uid`、`name` 属性和 `greetings()` 方法的人对象。如果需要具有额外属性（如 `lastName`、`age`、`gender`）以及方法（`getAge()`、`getGender()`、`fullName()`）的人对象，那么我们如何使用同一个类来添加这些属性呢？答案在于类的扩展。\n\
  \n可以通过扩展类以给现有类添加额外功能。任何类都可以通过扩展来添加更多属性和方法以增强其用途。类可以使用 `extends` 关键字扩展父类。子类可以使用 `super`\
  \ 关键字调用父类的构造函数，从而调用父类的构造函数。在下面的示例中，使用之前使用的 `Person` 类作为基类，创建一个具有更多属性和方法的 `Student`\
  \ 类。\n\n```javascript\nclass Student extends Person //继承自父类\n{\n  constructor(uid,\
  \ name, age, gender, lastName) //构造函数\n  {\n    super(uid, name); //链式调用构造函数访问父类\n\
  \    this.age = age;\n    this.gender = gender;\n    this.lastName = lastName;\n\
  \  }\n  getAge() //向类添加更多方法\n  { return this.age; }\n  getGender() { return this.gender;\
  \ }\n  fullName() { return this.name + this.lastName; }\n}\n\nvar e5 = new Person(123,“Lucy”);\n\
  e5.greetings(); //显示 Hello Lucy\nvar s1 = new Student(367,“Anne”, 24, “Female”,\
  \ “Hathaway”);\nconsole.log(s1.getAge()); //返回 24\nconsole.log(s1.getGender());\
  \ //返回 Female\nconsole.log(s1.fullName()); //返回 Anne Hathaway\n```\n\n### 3.7.3\
  \ 类中的 Getter 和 Setter（访问器和设置器）\n\n我们已经讨论了对象的访问器和设置器方法；同样的概念也适用于类。只需在属性名前加上 `get`\
  \ 或 `set` 即可启用访问器/设置器方法，这意味着使用 getter 和 setter 方法而不是直接操作属性是一种更安全的替代方案。它保护了被检索和操作的数据完整性。这些方法可以使用之前讨论过的\
  \ `set` 和 `get` 关键字来定义。下面的示例解释了它们的用法。\n\n```javascript\nclass Person {\n  constructor(name,\
  \ age) {\n    this.name = name;\n    this.age = age;\n  }\n  get age() //注意 get\
  \ 和 age 之间的空格\n  {\n    return this.age;\n  }\n  set age(x) {\n    this.age = x;\n\
  \  }\n}\n\n//创建一个新对象并使用 get 方法访问属性\nvar obj = new Person(Tony’, 42);\nconsole.log(obj.age);\n\
  //通过属性名调用 set age(56)\nobj.age = 56;\nconsole.log(obj.age); //显示 56\n```\n\n###\
  \ 3.7.4 静态成员\n\n有时不需要为每个对象创建一个方法或变量，为了节省内存，我们只需要该属性的一个拷贝。在这种情况下，JavaScript 提供了静态成员的使用。静态成员属于类，而不是实例对象。因此，它留在类中，实例化的对象只能访问此属性，但它们并不拥有此属性\
  \ [[75]](#ref-list.xhtml_refReferences_75)。\n\n属性和方法都可以声明为静态，且静态成员会被子类继承。可以在类声明期间通过\
  \ `static` 关键字作为属性或方法的前缀来添加静态成员。静态成员也可以之后使用 `ClassName.property` = `’value’` 添加到已经定义的类。接下来的示例演示了静态属性和方法的使用。\n\
  \n```javascript\nclass Account {\n  static rateOfIntrest = 10 //静态属性\n}\n```\n\n\
  \n\n\n\n```javascript\nstatic totalAccountHolders = 0 //静态属性\n\nconstructor(accountNumber,\
  \ branch, balance) {\n  this.accountNumber = accountNumber;\n  this.branch = branch;\n\
  \  this.balance = balance;\n  Account.totalAccountHolders + ++;\n  // 创建新对象时增加静态成员\n\
  }\n\nstatic getNumberofAccounts() //静态方法 { \n  return Account.totalAccountHolders;\n\
  }\n```\n\n```javascript\nvar client1 = new Account(12345, “Central Office”, 42000);\n\
  var client2 = new Account(67891, “West Office”, 12000);\nconsole.log(Account.rateOfIntrest);\
  \ //调用静态属性\nconsole.log(“Total Accounts” + Account.getNumberofAccounts()); //调用静态方法\n\
  \n/*\n输出将是：\n10\nTotal Accounts 2\n*/\n```\n\n静态方法和属性会被扩展这些类的对象继承。对于类的普通成员和静态成员，继承的概念保持一致。\n\
  \n## 3.8 垃圾回收\n\n我们之前已经学习过对象上的 `delete` 操作符；现在让我们通过其他问题再次回顾，例如，什么是垃圾回收以及我们为什么需要它？垃圾回收是在程序不再需要已分配内存时释放这些内存的过程。JavaScript\
  \ 提供了自动垃圾回收机制，它会定期清理内存并释放内存区域 [[71]](#ref-list.xhtml_refReferences_71)。\n\n要手动移除或删除对象中的某个属性，可以使用\
  \ `delete` 操作符。`delete` 操作符并非简单地作用于属性值，而是删除实际的属性值。例如：\n\n```javascript\ndelete book.author;\
  \ //从 book 中删除属性 author\ndelete book[“isbn”]; //从 book 中删除属性 isbn\n```\n\n`delete`\
  \ 操作符用于删除对象自身的属性。不建议删除继承的属性。要删除继承的属性，必须从定义这些属性的原型链（prototype）中删除它们。从原型中删除属性会影响所有继承自该特定原型的对象。此外，我们应该记住，使用\
  \ `delete` 不会移除配置属性被设置为 `false` 的属性。当删除操作成功时，delete 操作符返回 `true`。\n\n那么，如何删除整个对象并让垃圾回收器执行释放已分配内存的工作呢？释放内存的唯一方法是将对象标记为准备好删除；这可以通过将对象的引用设置为\
  \ `null` 来完成。\n\n很多时候，对象引用会被多次传递、赋值和重新赋值。这在实际对象与其引用之间创建了复杂的关系。一旦引用不可访问，它将被删除。在移除或重新赋值这些引用之前必须小心。\n\
  \nJavaScript 中的垃圾回收使用 `标记与清除`算法来释放内存。垃圾回收器遍历当前的执行函数（带有局部变量和方法）、其他嵌套函数、全局变量等。每个不可访问的对象都被“标记”。标记的对象及其相关的引用会被遍历并根据需要“标记”（垃圾回收器会记住访问过的对象以避免反复解析相同的对象）。这些引用会被遍历，直到每个可访问和不可访问的值都被遍历完毕。完成后，所有被“标记”的对象将被移除，然后过程重新开始。垃圾回收过程以自动化的方式独立发生。它无法被强制执行或停止执行。所有可访问的对象都保留在内存中。为了理解这一场景，让我们看看下一个示例以及相应的图\
  \ 3.5。\n\n![](img/fig3_5.jpg)\n\n图 3.5 自动垃圾回收。\n\n```javascript\nclass Human {\n\
  \  var name;\n  var ID;\n  Constructor(id, name) {\n    this.name = name;\n    this.ID\
  \ = ID;\n  }\n}\n```\n\n```javascript\nvar user1 = new Human(123,“Alice”); //创建新对象\n\
  user1 = null; //重置引用为 null 并标记为删除\nconsole.log(user1.name); //不起作用\n```\n\n在这段代码中，使用构造函数创建了对象\
  \ `user1` 并将其设置为 `null`。将引用值设置为 `null` 使准备好被垃圾回收器删除。此外，第二个场景说明，如果单个引用是指向该对象的变量，那么它不会被删除或标记为删除。第二个场景演示如下：\n\
  \n```javascript\nvar user1 = new Human(123,“Alice”); //创建新对象\nuser2 = user1; //将引用存储到\
  \ user2\nuser1 = null; //重置引用为 null\nconsole.log(user2.name); //可以正常工作\n```\n\n\
  ## 3.9 练习\n\n### 3.9.1 理论\n\n1. 区分类继承和原型继承。\n2. JavaScript 使用了多少种编程范式？请解释。\n3. 你如何理解\
  \ JavaScript 中的原型继承？讨论开发者应该在什么情况下使用原型继承的场景。\n4. 列举创建对象的不同方式。\n5. 讨论遍历对象的不同方法。批判性地分析每种可能的替代方案，并脑风暴在什么情况下应该使用哪一种。\n\
  6. 编写一个程序遍历对象的属性并在控制台上显示它们。\n\n### 3.9.2 正/错\n\n1. 原型链是由于将一组对象连接在一起而创建的链。\n2. `isPrototypeOf()`\
  \ 方法用于判断一个对象是否是另一个对象的原型。\n3. 全局变量的优先级高于局部变量的值。\n4. `toString()` 方法用于获取对象的数值表示。\n\
  5. 三元运算符用于 JavaScript 中。\n\n### 3.9.3 多选题\n\n1. 在开发网站的不同阶段，开发者会遇到哪些对象？\n   - 用户定义对象\n\
  \   - 主宿对象\n   - 原生对象\n   - 以上所有\n2. 对象可以使用以下哪一个进行调用？\n   - `this`\n   - `Of`\n\
  \   - `Object`\n   - 以上所有\n3. 当类 `C` 扩展另一个类 `D` 时，我们可以说类 `C` 是 ________ 类，而类 `D`\
  \ 是 ________ 类。\n   - 超，子\n   - 父类，子\n   - a 和 b 都\n   - 以上所有\n4. 下列代码的输出是什么？\n\
  \   ```javascript\n   function newPerson() {\n     this.name = ‘Ojo’;\n   }\n  \
  \ function obj() {\n     obj.call(this);\n   }\n   obj.prototype = Object.create(newPerson.prototype);\n\
  \   const newObject = new obj();\n   console.log(newObject.name);\n   ```\n   -\
  \ 报错\n   - 不编译\n   - 打印 ‘Ojo’\n   - 以上所有\n5. 下列代码的输出是什么？\n   ```javascript\n   const\
  \ constantOne = {};\n   const constantTwo = Object.create(constantOne);\n   console.log(Object.getPrototypeOf(constantTwo)\
  \ === constantOne);\n   ```\n   - False\n   - True\n   - 编译错误\n   - 0\n\n## 3.10\
  \ 演示与实操\n\n### 3.10.1 目标\n\n1. 创建 JavaScript 对象并学习属性。\n2. 创建具有不同方法以及 getter/setter\
  \ 方法的对象。\n3. 使用自定义对象构造函数创建对象并进行操作。\n\n### 3.10.2 前提条件\n\n* **步骤 1**: 访问 [`www.routledge.com/97803661429`](https://www.routledge.com/97803661429)\
