  hr\");\n  resultHere.appendChild(separator);\n};\n\n/*****************************************************************************/\n\
  var resultHere = document.querySelector(\".results\");\nappendToHTML([\n  \"提升对初始化无效，仅对声明有效！\"\
  ,\n],\n  \"yellow\"\n);\n\n// 这运行良好，变量声明并初始化然后在代码中使用。\nvar num; // 声明\nnum = 6;\
  \ // 初始化\nappendToHTML([`变量 num: ${num}`], \"lime\");\n\n// 尝试使用 var 看看结果。\nappendToHTML([`变量\
