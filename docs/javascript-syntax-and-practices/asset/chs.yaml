  \ `pop()`\n    a. 仅 i 和 ii\n    b. 仅 iii 和 iv\n    c. 以上都不是\n    d. 以上\n5. 使用以下哪些命令可以将数组的长度转换为只读属性？\n\
  \    a. `Object.defineProperty(arr, {readonly:true})`\n    b. `Object.defineProperty(arr,\
  \ {writable:false})`\n    c. `Object.defineProperty(arr, {length:writable})`\n \
  \   d. `Object.defineProperty(arr, {readwrite:false})`\n\n## 5.10 数组演示\n\n### 5.10.1\
