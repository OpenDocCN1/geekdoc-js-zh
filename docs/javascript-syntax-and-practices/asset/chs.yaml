  \ \"tomato\"\n);\n\n// 定义。\nfunction testFunction(arg) {\n  appendToHTML([\n   \
  \ `你好，因为有了提升我正在工作，耶耶 | 传递的参数 -> ${arg}`,\n  ]);\n}\n\n/*************************************************/\n\
  sep();\n```\n\n\n\n\n\n这些错误可能是由于代码中的`syntactical`（语法）或`logical`（逻辑）问题引起的。重要的是，它们也可以在代码执行的`runtime`（运行时）发生。由于\
  \ JavaScript 语言本身的特性，运行时概率很高。对于开发者来说，确保网页在各种情况下继续运行非常重要。这是通过仔细设计和编写程序代码以消除语法和逻辑错误来实现的。然而，对于运行时错误，这是不可能，因为它们会在程序运行并在用户端执行时产生，由于异构浏览器环境的存在，会导致各种情况。对于\
  \ JavaScript 而言，对象通过多个接口继承属性和方法，这使得错误产生了一个丰富而复杂的领域。\n\n对于每种编程语言，管理代码执行过程中产生的错误和其他问题都是重要的。JavaScript\
  \ 提供了错误处理来处理此类问题。在本章中，我们将讨论程序代码验证，以及 `try`、`catch` 和 `finally` 块的使用。然后我们将讨论 `finally`\
  \ 块的使用和 `throws` 关键字来生成错误。还会讨论带有属性的错误对象。最后，我们将详细讨论 cookie 的使用和操作。\n\n## 9.1 验证\n\
  \n在处理网页时，与终端用户交互时通常有两种情况：要么我们向用户显示信息，要么我们从用户那里获取信息。今天，大多数网页在本质上是交互性的，需要自定义用户输入以在不同的用例下运行运行。\n\
  \n为了获取用户输入，`HTML` 表单是最常用的替代方案。这些表单指定了输入字段，并构建了一个精美的界面来接收用户的输入。它们需要对从终端用户那里所需的信息有清晰、简洁且具体的描述。每个表单字段都有一些关联数据，这些数据需要处于正确的格式以便进一步处理。`Validation`（验证）是指确保用户传递的信息正确并符合指定的程序需求的过程。信息验证可以在客户端或服务器端完成。这将在后续章节中进行详细讨论。\n\
  \n### 9.1.1 服务器端和客户端验证\n\n信息验证可以在客户端进行，可以限制用户按特定格式提供信息。这现在已成为一种标准的过滤机制，在用户端对信息进行验证。另一种验证信息的方法是在服务器端验证，在服务器端分析用户发送的输入。\n\
  \n服务器端验证速度较慢，因为用户输入需要发送到服务器并返回响应。这会导致用户端信息处理延迟。考虑到这两种验证方法，建议对用户输入同时使用客户端和服务器端验证。\n\
  \n客户端验证作为用户端的过滤机制非常有帮助 [[1]](#ref-list.xhtml_refReferences_1)。它有助于对用户实施某些约束，例如选择合适的密码、将字段设为必填、指定数据输入格式等。客户端验证可以大大减少服务器开销，并使信息处理变得更容易。\n\
  \n另一方面，也建议在客户端验证的同时进行服务器端验证。即使强制执行了客户端验证，用户也可能对服务器端采取恶意行为。这可以通过对从用户接收到的输入应用严格的服务器端信息验证来解决。\n\
  \n验证主要在表单上进行，因为表单是获取终端用户输入或数据的既事实标准。`HTML` 表单是接收用户详细输入的手段。为了验证之目的，可以使用 `JavaScript`\
  \ 和 `HTML`。`HTML` 提供了内置的表单验证，而 `JavaScript` 可以用于手动代码来强制执行。这两者都将在后续章节中讨论。\n\n###\
  \ 9.1.2 使用内置表单验证\n\n`HTML5` 提供了内置的表单控件，对验证有很大帮助。使用这些功能，可以在客户端验证用户数据 [[2]](#ref-list.xhtml_refReferences_2)。表单元素提供的表单验证属性列如下：\n\
  \n*   `minlength` 和 `maxlength`：分别代表文本输入（字符串）的最小和最大长度。\n*   `min` 和 `max`：分别代表数值输入值的最小值和最大值。\n\
  *   `required`：指示表单属性是否为用户必填。由表单元素顶部的红色星号 `*` 表示。\n*   `type`：指示表单元素上允许的输入类型，如文本、字符串和电子邮件。\n\
  *   `pattern`：代表正则表达式，定义了用户输入在填写表单详情时必须遵循的精确模式。\n\n使用此类表单验证属性允许只有经过验证的信息到达服务器端。当表单元素值有效时，允许提交（如果\
  \ `JavaScript` 代码没有拦截它）。当表单元素值无效时，浏览器会拦截表单并显示相应的错误消息。以下代码演示了 `HTML` 内置表单验证功能的使用，随后是输出的截图。\n\
  \n*   不带 `HTML` 验证的代码：\n\n```html\n<form><!--first entry for form-->\n<label for\
  \ = “dog”> Do you own a dog? </label>\n<input id = “dog” name = ”dog”> //not mandatory\
  \ to fill\n<button>Submit</button>\n</form>\n```\n\n下面的截图 (图 9.1) 演示了上述代码的输出；此表单不会进行任何验证，即使没有提供输入也是如此。此表单项不是\
  \ `required`（必填的），因此用户可以直接提交它，它将直接发送到服务器。\n\n![](img/fig9_1.jpg)\n\n图 预期输出.\n\n\
  *   带 `HTML` 验证的代码：\n\n```html\n<form><!--second entry for form-->\n<label for =\
  \ “cat”> Do you own a cat? </label>\n<input id = “cat” name = “cat” required minlength\
  \ = “2” maxlength = “20”> <!--makes it mandatory to fill with length -->\nconstraints\n\
  <button>Submit</button>\n</form>\n```\n\n对于此表单，input 标签内的属性是 `required`，这意味着用户必须填写。如果用户在没有输入值的情况下提交表单，浏览器将拦截表单且不发送到服务器。如果用户输入了值但不符合\
  \ `minlength` 和 `maxlength` 设置的标准，表单将被拦截且不发送。\n\n![](img/fig9_2.jpg)\n\n图 预期输出.\n\
  \n`HTML5` 表单验证在本质上是相当静态的，不允许自定义修改。它仅支持提供的属性，并在此范围内强制执行验证。它不允许对用户值设置复杂的约束。然而，从性能而言，`HTML5`\
  \ 表单验证相对更快。`JavaScript` 验证可以解决这些问题，并可以对用户输入提供更复杂的验证。让我们在下一节学习它。\n\n### 9.1.3 使用\
  \ JavaScript 进行验证\n\n\n\n\n\n也可以使用 JavaScript 实现验证。如今大多数浏览器都支持 `Constraint Validation\
  \ API`（约束验证 API），它可以在将用户输入的值传递给服务器之前对其进行检查 [3 ]。它可以与 HTML 表单验证配合使用。一旦用户输入的值通过 HTML\
  \ 表单元素完成验证，就会将其传递给 JavaScript 代码进行进一步验证。\n\n随后，JavaScript 使用约束验证 API 对用户输入指定复杂的约束条件。这既可以在单个表单元素上完成，也可以在整个表单（即\
  \ `<form>` 元素）上完成。它提供了以下对验证非常有用的属性：\n\n* `validity`: 该属性返回一个 `ValidityState` 对象，该对象包含所有验证错误，以只读属性的形式存在于表单元素。`ValidityState`\
  \ 对象的属性包括 `tooLong`、`tooShort`、`rangeOverflow`、`patternMismatch`、`valueMissing`\
  \ 等。\n* `validationMessage`: 这是一个只读属性，用于获取当元素值无效时应显示的的验证消息。如果表单值有效，它将返回一个空字符串。\n\
  * `willValidate`: 该属性返回一个只读布尔值，用于指定给元素是否用于约束验证。\n\nConstraint Validation API 提供了以下用于表单元素验证的方法：\n\
  \n* `checkValidity()`: 该方法根据元素的值相对于指定约束的情况返回一个布尔值。对于无效值，它返回 `false`；否则，返回 `true`。\n\
  * `reportValidity()`: 该方法用于检查元素的值是否满足约束需求。如果值无效，它会触发 `invalid` 事件，返回 `false` 并通知用户有效性状态。\n\
  * `setCustomValidity(msg)`: 该方法用于设置自定义消息，当给定的值无效或不可接受时，该消息将显示给用户。它对于通过错误消息向用户指定约束条件非常有用。\n\
  \nConstraint Validation API 还为其他与表单相关的验证的接口提供了扩展。这种扩展允许添加额外的属性和方法。其中一些接口包括 `HTMLSelectElement`\
  \ (`<select>`）、`HTMLInputElement` (`<input>`）、`HTMLOutputElement` (`<output>`）、`HTMLButtonElement`\
  \ (`<button>`) 等。\n\n在本章末尾提供了一个示例，以观察使用 JavaScript 进行验证的实际运行过程。\n\n## 9.2 错误处理\n\
  \n除了用户输入或表单验证外，程序内部还存在其他错误。语法错误和逻辑错误在设计程序代码时会被处理。它们相对容易处理。`Runtime errors`（运行时错误）是在程序执行期间发生的错误。这些是最重要的错误，因此最难消除，特别是在使用\
  \ JavaScript 时。\n\nJavaScript 的特性（如原型的使用、继承、类型转换、对象等）使得识别错误变得更加困难，因为它们可能不会立即发生，而在不同情况下需要大量的处理时间才会显现。寻找和纠正它们需要花费大量精力。克服这种情况的机制被称为\
  \ `error handling`（错误处理）。JavaScript 运行时会创建一个特殊的 `error` 对象，并默认将其 `throws`（抛出）回调用者，即\
  \ 页面或控制台。\n\nJavaScript 还提供了一种机制来捕获这个抛出的对象，并寻找替代方案在运行时解决错误。这是通过使用 `try`、`catch`\
  \ 和 `finally` 块实现的。让我们在接下来的章节中了解 `error` 对象以及 `try`、`catch` 和 `finally` 块的工作。\n\n\
  ### 9.2.1 错误对象\n\nJavaScript 提供了一个内置对象，用于提供程序执行期间生成的错误信息 [4 ]。Error 对象提供了此类属性来提供有关错误的信息。\n\
  \n最常用的两个 Error 对象属性是 `name` 和 `message`。错误对象的 `name` 属性用于设置或返回错误名称。`message` 属性用于以字符串形式设置或返回错误消息。\n\
  \n错误对象的 `name` 属性可以持有不同的值，每个值都代表一种特定类型的错误。这些值的解释如下：\n\n* `Range Error`（范围错误）：范围错误表示所提供的数值超出了合法/可接受值的范围。\n\
  * `Reference Error`（引用错误）：当在没有预先声明的情况下使用引用时会抛出引用错误。\n* `Syntax Error`（语法错误）：语法错误代表代码中的语法使用不正确。\n\
  * `Type Error`（类型错误）：当使用的值超出预期类型范围时（例如使用字符串代替数字或反之），会抛出类型错误。\n* `URIError`（统一资源标识符错误）：当使用非法值定义\
  \ URI 值时，会抛出 URI 错误。\n\n错误对象有自己的构造函数来初始化错误对象。使用构造函数 `Error()` 会创建一个新的错误对象。错误对象关联有一个\
  \ `toString()` 实例方法。它重写了 `Obejct.prototype.toString()` 方法，返回一个指示有关调用 Error 对象详细信息的字符串。\n\
  \n```javascript\ntry {\n  throw new Error(\"Just for fun\")\n}\ncatch (err) {\n\
  \  console.log(\"Error details are: [Name:\"+err.name + \"] and Message: \"+err.message\
  \ + \"]\");\n}\n```\n\n### 9.2.2 Try-Catch 块\n\n`try` 和 `catch` 块是 JavaScript 中提供错误处理功能的手段。可能产生错误并停止代码执行的程序代码可以放在\
  \ `try` 块中 [5 ]。当执行 `try` 块中的代码时，只有两种可能性，即它产生错误，要么不产生。\n\n每当发生错误时，`try` 块将将执行传递给相应的\
  \ `catch` 块。随后执行 `catch` 块中的代码。相反，如果执行 `try` 块中的代码且没有发生错误，则相应的 `catch` 块就不会执行。使用\
  \ `try` 和 `catch` 块使得错误处理过程变得简单得多。\n\n这种方式强制了一种测试机制，允许程序代码安全地在 `try` 块中执行。如果发生任何错误，都有\
  \ `catch` 块来处理它。这些块总是一起使用的，即对于每个 `try` 块都有一个 `catch` 块。这些块可以相互嵌套以处理更复杂的情况。嵌套块时，`try`\
  \ 块与最近的 `catch` 块配对。一个 `try` 块可以有多个 `catch` 块。这些块的语法如下：\n\n语法：\n\n```javascript\n\
  try {\n  //要执行的代码\n}\ncatch(error) {\n  // 处理传递的错误的代码\n}\n```\n\n一个给定的 `try` 块可以有多个\
  \ `catch` 块。`try` 块可以包含抛出不同错误的程序语句。对于每个错误，可以存在一个不同的 `catch` 块。给出的演示使用 `try-catch`\
  \ 块的小代码段如下，图 9.3 展示了输出。\n\n```html\n<html>\n<body>\n  <script>\n    try {\n    \
  \  let x = \"Hello World!\";\n      console.log(x);\n      console.log(y);\n   \
  \ }\n    catch (err) {\n      console.log(\"Someone is calling y without defining\
  \ it\");\n    }\n  </script>\n</body>\n</html>\n```\n\n图 9.3 浏览器控制台输出。\n\n\n\n\n\
  \n`finally` 是一个与 `try-catch` 块一起提供的可选代码块。它最常用于在程序执行结束后执行清理操作，例如关闭文件、删除资源、向用户显示消息等。无论是否抛出异常，`finally`\
  \ 块内部的语句始终会被恰好执行一次。在 `try-catch` 块中使用 `finally` 的语法如下：\n\n语法：\n\n```javascript\n\
  try\n{\n  //要被执行的代码\n}\ncatch(err)\n{\n  // 捕获错误\n}\nfinally\n{\n  // 这段代码在程序执行完成前总是执行一次。\n\
  }\n```\n\n### 9.2.4 Throw 语句\n\n`throw` 语句用于在 `try` 块中抛出自定义的用户自定义的错误。任何用户都可以定义自己的异常并使用\
  \ `throw` 关键字将其抛出。这有助于开发者以一种独特且自定义的方式来识别错误 [[6]](#ref-list.xhtml_refReferences_6)。在\
  \ `throw` 关键字之后的任何程序语句都不会被执行，控制权将直接传递到相应的 `catch` 块。\n\n如果不存在相应的 `catch` 块，程序将终止。在\
  \ `try`-`catch` 块中使用 `throws` 的语法如下：\n\n语法：\n\n```javascript\ntry\n{\n  //要被执行的代码；\n\
  \  throw userDefinedError; //throw 语句\n}\ncatch(err)\n{\n  // 处理该特定异常的代码\n}\n```\n\
  \n`throw` 语句对于生成用户可以理解且在程序代码上下文中有效的异常非常有帮助。\n\n## 9.3 Cookies\n\n在传统上，一旦服务器向用户发送了网页页面，它就会完全忘记该用户，每当用户请求到达服务器时，都会提供一个全新的页面。用户的状态和行为信息不会被维护，这导致了用户端重复的信息泄露等。这还导致由于重复加载相同信息而浪费宝贵的带宽、时间和资源。为了解决这个问题，会将小型文本存储存在用户计算机的浏览器文件系统中，以表示终端用户的状态。这些小文件被称为\
  \ `cookies`。\n\nCookies 主要是用于存储用户信息的键值对。这些小文本文件会随用户对网页的请求一起发送到 Web 服务器 [[7]](#ref-list.xhtml_refReferences_7)。使用\
  \ cookies，服务器更容易记住特定用户的状态和信息。\n\n每个网页的 `document` 对象都有一个用于存储 cookie 值的唯一属性。`document.cookie`\
  \ 属性用于读取和写入与文档相关的 cookie。使用此属性，可以访问 cookie 并将其设置为特定的值。\n\n```javascript\nlet cookieALL\
  \ = document.cookie;\n//返回一个包含所有键值对形式 cookie 的字符串\n\ndocument.cookie = newKeyValue;\n\
  // 向 cookies 添加新值\n```\n\n默认情况下，cookies 在浏览器关闭后会被销毁。此类 cookies 被称为 `session cookies`。为了让\
  \ cookie 持存，必须设置 cookie 的 `expires` 或 `max-age` 属性。参数值以毫秒为单位。\n\n```javascript\n\
  document.cookie = “user = Alex; max - age = 0”;\n// 立即删除\n\ndocument.cookie = “user\
  \ = Alex; max - age = 3600”;\n// 1 小时后删除\n```\n\n如果在 cookie 中设置了 `secure` 属性，则必须使用\
  \ HTTPS 协议进行传输，以实现信息的安全传输。\n\n```javascript\ndocument.cookie = “user = Ravi; Secure”;\
  \ //通过 HTTPS 发送\n```\n\n## 9.4 严格模式\n\n严格模式是 ECMAScript5 规范新增的新内容，它允许程序和函数在严格上下执行。`use\
  \ strict` 是一个字面量表达式，用于防止程序执行某些操作 [[8]](#ref-list.xhtml_refReferences_8)。它会静默移除一些微妙错误并将它们直接抛在控制台上。\n\
  \n它消除了静默错误并限制了某些未来语言版本可能会定义的工具。使用严格模式，程序执行速度更快，并且对搜索引擎更具优化。它会自动禁用那些不完整、混淆或不够安全的特性。\n\
  \n当脚本不在 `strict mode` 模式运行时，它本质上被认为是“松散的（sloppy）”。严格模式既可以全局应用于整个脚本，也可以应用于单个函数。可以通过在脚本顶部或函数声明之前编写\
  \ `use strict` 来指示程序代码使用严格模式。在其他任何地方写 `use strict` 不会导致代码使用严格模式。\n\n```javascript\n\
  ‘use strict’\nconsole.log(“A stricter script in action”);\n```\n\n另一个理解 `strict`\
  \ 模式的例子；让我们看看不使用严格模式的代码片段及其输出。\n\n```javascript\nvar myVariable; // 创建 myVariable\
  \ 对象\nmyVaroable = 10; // 注意拼写错误的 myVaroable\nconsole.log(myVaroable); // 尝试打印拼写错误的\n\
  console.log(myVariable); // 尝试查看正确的\n```\n\n现在观察上述代码的输出 (图 9.4)；由于对象名称拼写错误，没有任何影响。这在代码中引入了无意错误。\n\
  \n![](img/fig9_4.jpg)\n\n图 9.4 输出截图。\n\n现在，让我们看看在顶部放置 `use strict` 关键字相同的代码：\n\n\
  ```javascript\n'use strict'; // 使用严格模式\nvarVariable; // 创建 myVariable 对象\nmyVaroable\
  \ = 10; // 注意拼写错误的 myVaroable\nconsole.log(myVaroable); // 尝试打印拼写错误的\nconsole.log(myVariable);\
  \ // 尝试查看正确的\n```\n\n仔细观察输出 (图 9.5)；现在运行时识别了拼写错误的单词并抛出 `ReferenceError`。这就是严格模式帮助创建稳定代码的方式。建议使用严格模式以实现更快速、安全的程序执行。\n\
  \n![](img/fig9_5.jpg)\n\n图 9.5 输出截图。\n\n## 9.5 最佳实践\n\n编写 JavaScript 代码时，理想情况下应遵循某些最佳实践以避免不必要的阻塞、调试和延迟。通过遵循下面的最佳实践，开发者可以减少代码错误的概率，使其更容易理解，最终结果是整洁、高效且有意义的代码，可以根据需要进行升级。某些这些实践如下：\n\
  \n-   始终使用注释来解释你的代码。程序代码编写一次，但在其生命周期内会被多次阅读。对必要的内容进行注释是最佳实践。\n-   使用有意义的变量和函数名。与其将变量命名为\
  \ `x, y, z`，不如将它们命名为 `noOfStudents`、`calculateSum()`、`printTotal()`。变量和函数的正确命名使得更容易理解代码的工作原理，特别是在变量和函数在程序生命周期内存在复杂关系的情况下。\n\
  -   避免使用全局变量；尽可能使用 `var`。跳过 `var` 关键字直接在程序中使用不会产生错误，但它会在全局作用范围内声明新变量并使用它。在全局作用域创建多个变量不被认为是良好的做法，因为这增加了这些变量被其他应用程序、库等误用的可能性。这还会导致不必要的冲突并降低程序性能。因此，仅在特定需要时使用全局变量；否则请使用\
  \ `var` 关键字在给定的作用域内声明。\n\n\n\n\n\n-   并不是所有的浏览器都支持 JavaScript。有时用户的浏览器禁用了 JavaScript\
  \ 的使用。在这种情况下，最好先设计一个只包含 HTML 代码的网页，以确保向用户显示一个有意义的页面，而不是损坏的代码脚本。一旦正确处理了基础 HTML 页面，开发者就可以专注于在网页中集成\
  \ JavaScript 以增强其功能。\n\n-   使用字面量（literals）来创建数组、对象等，而不是使用 `new` 构造函数。当使用构造函数创建数组（或函数或对象）时，它会继承与其原型相关的所有属性和方法。对于处理数组中的信息等简单操作，没有强制创建一个数组对象。相反，一个简单的数组就能运行得良好并提高运行速度。另一方面，为相同目的创建一个数组对象不会带来任何显著优势，反而会变得较慢。因此，建议使用对象字面量来初始化基础对象，而不是使用构造函数初始化。\n\
  \n```javascript\nvar obj = {} //使用字面量\nvar obj2 = new Object(); //new 对象\nvar arr\
  \ = []; //简单数组\nvar arr2 = new Array(); //Array 对象\n```\n\n-   省略重复使用的 `var` 关键字，并使用逗号声明变量列表。没有强制将每个变量声明在单独的一行。相反，可以使用\
  \ `var` 关键字配合逗号分隔的列表。这是处理变量的优化方式。尝试在脚本开头声明并初始化变量，而不是在程序的任何地方声明它们。在声明变量时尽可能为它们设置默认值。\n\
  \n```javascript\nvar noOfItems;\nvar userID;\nvar nameOfDog;\nvar noOfItems, userID,\
  \ nameOfDog; // 效果相同\n```\n\n-   浏览器会在程序语句末尾自动插入分号。然而，仅依赖浏览器完成语句可能会在以后导致问题。建议在任何适用的地方使用分号正确结束行。\n\
  \n-   使用原生 JavaScript（raw JavaScript）执行操作总是比使用库执行相同操作要快。使用库可以增强 JavaScript 的功能，但会降低运行速度。使用原生\
  \ JavaScript 可以快速执行，但编写代码比使用预定义的库更困难。因此，必须在运行速度和网页扩展功能的使用之间做出审慎的决策。通常，对于不同的网页或用例，这一决定会发生变化。\n\
  \n-   将脚本放置在 HTML 页面的底部可以更快地加载网页。JavaScript 的 `<script>` 标签用于通过引入动态特征（如行为 `onClick()`、`onLoad()`\
  \ 等）来增强用户行为。此脚本可以在 HTML 加载后安全地执行。\n\n-   为了调试目的，请使用 JSLint 调试器，它可以帮助开发者发现 JavaScript\
  \ 代码中的问题并报告其来源。它解析代码以寻找语法错误、逻辑错误或结构性错误，并将它们报告给开发者。\n\n-   使用 `===` 代替 `==`（或使用 `!==`\
  \ 代替 `!=`）。`===` 运算符会比较传递参数的值和类型，而 `==` 运算符首先执行类型转换，然后比较值。因此，在任何需要的地方使用 `===` 运算符进行更快速、更有意义的比较。\n\
  \n-   使用严格模式（strict mode）来避免错误，并遵循更严格、更整洁的代码规范。使用这种模式禁用了 `with` 以及其他导致代码产生不必要的的操作。\n\
  \n-   尝试以模块化和专门化的方式进行设计和编程。人们经常利用 JavaScript 的灵活性用有限数量的函数来执行多个任务。然而，应该避免这样做，必须为特定任务使用专门的函数。这有助于代码的轻松复用、调试和扩展，而无需重写。\n\
