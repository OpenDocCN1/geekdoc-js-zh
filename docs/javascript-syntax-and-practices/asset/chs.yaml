  var counter = 0;\nwhile (counter <20) {\nconsole.log(count);\ncount++;\n}\n```\n\
  1. `while` 循环的实现是错误的。\n2. 程序意外停止。\n3. 计算了 1 到 19 的 `counter` 值但没有打印。\n4. 它在控制台上打印值\
  \ 0,1,2…19。\n\n## 2.8 变量和赋值运算符的演示与实践\n\n### 2.8.1 目标\n\n1. 理解 JavaScript 中变量的作用。\n\
  2. 比较基础 JavaScript 数据类型。\n3. 编写 JavaScript 代码声明变量并给变量赋值。\n\n### 2.8.2 前提条件\n\n*\
  \ **步骤 1:** 访问 [`www.routledge.com/9780367641429`](https://www.routledge.com/9780367641429)\
  \ 并下载 `Ch2_Variables_Template` 的压缩文件。\n* **步骤 2:** 解压内容并在任你选择的编辑器中打开 `index.html`（例如：记事本或\
  \ Visual Studio Code）。\n* **步骤 3:** 将给定的代码插入 `index.html` 中 `<script>` 块内。\n* **步骤\
  \ 4:** 对后续每个代码段重复上述三个步骤。\n\n### 2.8.3 探索\n\n使用任何编辑器，我们将编写并测试 JavaScript 代码，通过 Google\
  \ Chrome 浏览器查看结果来创建和测试变量。我们将完成以下内容：\n\n* 描述变量是什么以及如何在 JavaScript 中使用变量。\n* 使用正确的语法和命名规范编写在\
