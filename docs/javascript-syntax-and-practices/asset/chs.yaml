  \n> *收藏不仅仅是购买对象。*\n> –埃利·布罗德 (Eli Broad)\n\n在第 3 章 中，我们学习了 JavaScript 中面向对象编程（OOP）的原理，包括对象的创建、对象的删除、原型继承和垃圾收集。我们还学习了\
  \ `class` 的概念，它有助于创建以及扩展预定义的实体。在解释对象及其扩展的基础知识时，我们认为有必要解释 JavaScript 支持的内置对象。这些对象可以被视为开发者用于扩展新创建对象功能的最常用选择。这将帮助你比任何其他应用程序都对你的网页获得更多的控制权和能力。在本章中，我们将更深入地讨论\
  \ ECMAScript6 [[103]](#ref-list.xhtml_refReferences_103) 提供的某些标准内置对象。\n\n## 8.1\
  \ 内置对象\n\nJavaScript 提供了许多标准对象，旨在帮助开发者对网页获得更多控制权，并允许实现更具交互性的解决方案。这些对象是内置在语言中的，并允许对其进行继承，从而将功能扩展到进一步继承它们的对象上。标准内置对象有时因为它们在脚本的全局作用范围内可见，而被称为`全局对象`（global\
  \ objects）。\n\n除了 JavaScript 提供的内置对象外，其他全局访问对象也是可用的，例如 BOM 中的 `window` 对象和 DOM 中的\
  \ `document` 对象。内置 JavaScript 对象与 BOM 和 DOM 对象模型无关，但可以一起使用来构建更具凝聚性的网页或应用程序。内置对象的分类如图\
  \ 8.1 所示。\n\n![](img/fig8_1.jpg)\n\n图 8.1 标准 JavaScript 对象的分类。\n\n### 8.1.1 基础对象\n\
  \n基础对象是大多数用户创建对象的父类。几乎所有用户创建的对象都继承自这些基础对象。基础对象包括 `Object`、`Function`、`Boolean` 和\
  \ `Symbol` 类。在这些基础对象中，我们已经在之前的章节中详细讨论了 `Object` 和 `Function`。接下来的章节将简要讨论这些基础对象。我们在这里刻意限制了对\
  \ `Object` 和 `Function` 的讨论，因为它们在之前的章节中已经单独介绍过。\n\n#### 8.1.1.1 对象原型 (Object Prototype)\n\
  \n`Object prototype`（对象原型）是 JavaScript 中原型链的根。许多其他对象原型继承自通用的 `Object` 原型，包括 `Function`\
  \ 对象。每当使用 `new` 关键字创建对象时，它会自动继承 `Object prototype`，从而继承该原型的属性和方法 [[104]](#ref-list.xhtml_refReferences_104)。与使用\
  \ `Object` 字面量创建的对象相比，这些属性和方法为对象提供了额外的功能。\n\n`Prototype` 是一个全局对象构造函数，用于向任何继承自 `Object\
  \ Prototype` 的对象添加属性（包括方法）。`Object prototype` 有一些内置方法，例如 `toString()` 方法，它返回表示对象的字符串。当继承自\
  \ `Object()` 的对象需要时，可以重写该方法。\n\n```javascript\nvar obj1 = new Object();\n// 继承 Object\
  \ prototype\nvar obj2 = [name:\"Syngonium\", color:\"light green\"];\n// 继承 Object\
  \ prototype\nobj2.toString();\n// 不继承\nobj1.toString();\n// 正常工作\n```\n\n#### 8.1.1.2\
  \ 函数对象 (Function Object)\n\n默认情况下，每个用户定义的函数都继承自 `Function` 原型。使用 `Function()` 构造函数会在全局作用范围内创建一个新的函数对象。`Function`\
  \ 的实例属性包括 `Function.prototype.name()`（返回函数名称）、`Function.prototype.displayName`（返回函数名称）以及\
  \ `Function.prototype.length`（返回属于函数的参数个数）。\n\n属于 `Function` 的实例方法包括 `toString()`、`apply()`、`bind()`\
  \ 和 `call()`。`Function.prototype.toString()` 返回函数源代码的字符串表示。它重写了由 `Object` 原型提供的方法。`Function.prototype.apply(newThis)`\
  \ 将调用对象的 `this` 参数替换为 `newThis` 参数。`bind()` 和 `call()` 方法用于创建一个新函数，并将其的 `this` 参数替换为传递的参数。`call()`\
  \ 用于调用函数并随后设置其 `this` 参数。由于函数在 JavaScript 开发中处于非常关键的地位，这些概念在到达此节之前已经讨论过。\n\n####\
  \ 8.1.1.3 布尔值对象 (Boolean Object)\n\n传统的布尔值持有 `true` 或 `false` 作为其值，即它们在本质上是原始类型。`Boolean\
  \ object` 属于 `Object` 原型，并作为持有布尔值的对象封装。`Boolean object` 的值在 0、−0、`null`、`false`、`NaN`\
  \ 和 `undefined` 时隐式设置为 `false`，而在所有其他值时设置为 `true` [[106]](#ref-list.xhtml_refReferences_106)。下面的示例演示了多种创建具有\
  \ `false` 和 `true` 值的 `Boolean` 对象的方法。\n\n```javascript\nlet obj1 = new Boolean();\
  \ // 值为 false\nlet obj2 = new Boolean(0); // 值为 false\nlet obj3 = new Boolean(null);\
  \ // null 也将值设置为 false\nlet obj4 = new Boolean(' '); // 解析为 false\nlet obj5 = new\
  \ Boolean(false); // 解析为 false\nlet obj6 = new Boolean(true); // 解析为 true\nlet obj7\
  \ = new Boolean('true'); // true\nlet obj8 = new Boolean('false'); // true，被视为字符串\n\
  let obj9 = new Boolean('T&F'); // true\n```\n\n\n\n\n\n```javascript\n// true, treated\
  \ as a string\n\nlet obj10 = new Boolean([]); //true\n\nlet obj11 = new Boolean({});\
  \ //true\n```\n\n在决策和控制流语句中使用 `Boolean` 对象会引入一些困惑；当你在练习布尔原始类型和 `Boolean` 对象时，你会注意到这一点。任何\
  \ `Boolean` 对象，只要其包含的值不是 `undefined`、`null` 或值设置为 `false` 的 `Boolean` 对象，在传递给任何类型的条件语句时，都会返回\
  \ `true`。再读一遍。让我们通过以下示例在实际操作中理解这一特殊概念：\n\n```javascript\nlet b = new Boolean(false);\n\
  \n//将 Boolean 对象赋值给引用 ‘b’\n\nlet c = false; //作为原始值的布尔值\n\nif (b) //将其求值为为 true\n\
  {//代码块被执行，因为 b 解析为 true}\n\nif (c) //将其求值为为 false\n{//代码不执行，因为 c 解析为 false}\n```\n\
  \n因此，人们必须仔细地使用布尔原始类型和 `Boolean` 对象。正如上一个示例所示，即使 `Boolean` 对象的初始值设置为 `false`，它也会被解析为\
  \ `true`。\n\n`Boolean` 原型提供了一个构造函数，允许向原型本身添加属性或方法。对原型的任何更改都将由链上的所有对象所继承。使用 `Boolean()`\
  \ 原型构造函数的语法如下：\n\n语法：\n```javascript\nBoolean.prototype.name = value\n```\n\n`Boolean.prototype`\
  \ 指向 `Boolean()` 对象本身。在上述语法声明中，`name` 指向键，`value` 指向要设置的属性实际值。向 `Boolean()` 添加方法时也使用相同的表示法。`Boolean`\
  \ 原型带有两个内置方法：`toString()` 和 `valueOf()`。`toString()` 方法根据调用对象返回 `true` 或 `false`。它重写了\
  \ `Object` 原型提供的方法。同样地，继承自 `Boolean()` 的对象也可以重写此方法并提供不同的实现。另一个原本属于 `Object()` 并被\
  \ `Boolean()` 重写的方法是 `valueOf()` 方法，它根据调用对象返回 `true` 或 `false` 的原始值。\n\n#### 8.1.1.4\
  \ Symbol 对象\n\n`Symbol` 对象是 JavaScript 的另一个内置基础对象，旨在为它的对象唯一地标识属性。它通过提供其他代码执行机制不会使用的值，有助于实现弱封装\
  \ [107]。`Symbol` 对象的构造函数始终返回一个跨所有其他属性都是唯一的 `symbol` 原始类型。\n\n`Symbol` 对象带有它自己的构造函数来创建新的\
  \ `Symbol` 对象。然而，`Symbol` 原型不支持 `new` 关键字。让我们通过示例来理解：\n\n```javascript\nlet symbol_A\
  \ = Symbol(); //创建一个新的 Symbol 对象\n\nlet symbol_B = Symbol(‘JavaScript’);\n\n//可选的字符串值\n\
  \nlet symbol_C = Symbol(‘JavaScript');\n\n//另一个新对象\n\nlet symbol_X = new Symbol();\n\
  \n//因为使用了 new 而抛出 TypeError\n\nconsole.log(symbol_B = = = symbol_C) //打印 false\n\
  \ntypeof Symbol() === ‘symbol’; //返回 true\n\ntypeof Symbol(‘JavaScript’) === ‘symbol’\
  \ //返回 true\n\ntypeof symbol_B = = = ‘symbol’; //返回 true\n```\n\n在上面的示例中，创建了三个 Symbol\
  \ 对象：`symbol_A`、`symbol_B` 和 `symbol_C`。第四个对象 `symbol_X` 抛出类型错误，是因为 `Symbol` 不支持\
  \ `new` 运算符。`Symbol` 确保新对象的创建是通过 `Object()` 构造函数完成的，从而保持这些对象的唯一性，这是它们存在的关键定义目的。此外，观察到语句\
  \ `symbol_B = = = symbol_C;` 即使两个对象都是使用相同的字符串创建的，它也会返回 `false`。如示例所示，可以使用 `typeof`\
  \ 运算符来识别这些对象的性质，即它们是否为 Symbol 对象。\n\n`Object.getOwnPropertySymbols()` 方法用于返回调用对象上定义的\
  \ `Symbol` 属性数组。`Symbol` 原型本身不会被继承，除非由用户显式执行。因此，用户定义的对象（不继承自 `Symbol`）除非由程序设置，否则将不会有任何\
  \ `Symbol` 属性。\n\n`Symbol` 对象还包含某些内置的实例属性和方法。实例属性包括 `Symbol.prototype.description`，它以只读字符串的形式返回调用\
  \ `Symbol` 对象的描述。实例方法包括 `toSource()`、`toString()` 和 `valueOf()`，这些是对 `Object` 原型方法的重写实现。`Symbol.prototype.toString()`\
  \ 用于返回 `Symbol` 对象描述的字符串值。`Symbol.prototype.valueOf()` 用于返回 `Symbol`，而 `Symbol.prototype.toSource()`\
  \ 用于返回持有调用 `Symbol` 源的字符串。\n\n### 8.1.2 Error 对象\n\n当发生任何运行时错误时，JavaScript 运行时都会抛出一个特殊对象；这个特殊对象被称为\
  \ `Error` 对象 [108]。`Error` 对象是一个基础对象，包含了基本错误以及特殊错误类型，如 `EvalError`、`RangeError`、`ReferenceError`、`AggregateError`、`SyntaxError`、`TypeError`\
  \ 和 `URIError`。错误对象用于异常处理，并在 8 章中详细讨论。错误对象只有两个属性，即 `Error.prototype.message` 和 `Error.prototype.name`，它们分别用于存储错误信息和错误名称。`Error`\
  \ 对象仅包含一个方法，即 `Error.prototype.toString()` 方法，它是继承自 `Object` 类的重写实现。错误对象通过使用 `try`、`catch`、`throw`\
  \ 和 `finally` 等关键字为 JavaScript 提供异常处理。\n\n### 8.1.3 数字和日期\n\n数字和日期用于处理数字、日期以及其他基于数学的计算。这些包括\
  \ `Number`、`Math`、`Date` 和 `BigInt`。这些对象在处理需要跨时区的 Web 内容时非常有帮助。\n\n### 8.1.3.1 Number\
  \ 对象\n\n`Number` 对象包含了用于处理数字的各种常量和方法 [109]。JavaScript 中的 `Number` 值相当于双精度 64 位二进制格式，就像\
  \ Java 中的 `double` 一样。它可以保持 17 位小数精度，超过后数字被认为等于常量 `Infinity`。\n\n`Number` 对象拥有 `Number()`\
  \ 构造函数，用于生成新的 `Number` 值。`Number(value)` 作为方法返回与所传递的字符串或任何其他值对应的数值。如果 `value` 无法转换为\
  \ Number，则返回 `NaN`。例如：\n\n```javascript\nlet year = 2021;\n\nlet previousYear =\
  \ Number(‘2021’);\n\ny = == z; //返回 True\n\nNumber(‘twenty twenty - one’) //返回 NaN\n\
  ```\n\n`Numbers` 对象具有许多静态属性、静态方法、实例属性和实例方法。属于该对象的某些属性解释如下：\n\n\n\n\n\n*   静态属性：`Number.NaN`\
  \ 表示并返回 `Not a Number`（非数字）值。`Number.EPSILON` 返回 1 与给定数字之间存在的差异或最小间隔。它通常用于测试两个浮点数之间的相等性。`Number.MAX_SAFE_INTEGER`\
  \ 和 `Number.MIN_SAFE_INTEGER` 分别代表最大（2⁵³ −1）和最小安全整数（−(2⁵³ −1））的值。`Number.MAX_VALUE`\
  \ 和 `Number.MIN_VALUE` 分别代表最大的正数和最小的正数（最接近 0）。`Number.NEGATIVE_INFINITY` 和 `Number.POSITIVE_INFINITY`\
  \ 分别返回负无穷和正无穷的特殊值。它们通常用于处理溢出情况。`Number.prototype` 属性用于向 `Number` 对象本身添加更多属性。\n\n\
  *   静态方法：`Number.isNan()` 如果传递的数字是 `NaN` 则返回 `true`；否则返回 `false`。此方法与全局的 `isNaN()`\
  \ 不同。`isNaN()` 将传递的值转换为数字然后测试其是否等于 `NaN`，而 `Number.isNaN()` 不将传递的值转换为数字，仅判断其是否等于\
  \ `NaN`。`Number.isFinite()` 如果传递的数字本质上是有限的返回 `true`；否则返回 `false`。`Number.isInteger()`\
  \ 如果传递的值是整数则返回 `true`；否则返回 `false`。\n\n*   实例方法：`Number.prototype.toExponential(digitFraction)`\
  \ 用于将数字转换为指数形式并返回其字符串值。`Number.prototype.toFixed(digits)` 根据 `digit` 参数对小数进行舍入，将调用数字转换为字符串。如果\
  \ `digits` 的值或小数位数高于调用数字，则会在字符串末尾补 0 以创建所需的长度。`Number.prototype.toPrecision(value)`\
  \ 返回指定精度值的数字的字符串表示。例如：\n\n```\nlet x = 1.12891;\nlet y = x.toFixed(3); // 舍入到 3\
  \ 位小数\nconsole.log(y); // 在控制台打印 1.129\nlet z = x.toFixed(8); // 舍入到 8 位小数\nconsole.log(z);\
  \ // 在控制台打印 1.12123000\n```\n\n`Number.prototype.toString(base)` 根据指定的基数（或基数值）返回调用对象的字符串表示。`Number.prototype.valueOf()`\
  \ 返回调用对象所持有的原始值。这两个方法都是 `Object.prototype` 方法的重写实现。\n\n### 8.1.3.2 Date 对象\n\n`Date`\
  \ 对象用于以一种独立于系统的方式表示系统中的特定时刻。`Date` 对象本质上使用一个 `Number`，表示自 1970 年 1 月 1 日世界协调时（UTC，也称为\
  \ UNIX 纪）以来经过的毫秒总数。这有助于在多个地理区域之间实现更容易日期和时区转换。`Date` 对象提供了方法来以 UTC 和格林尼治标准时间（GMT）等标准格式转换并显示时间。用户的平台（在此情况下为浏览器）提供本地时间，然后由\
  \ `Date` 对象进行转换和存储。\n\n`Date` 对象提供两种类型的构造函数，即 `Date()` 和 `new Date()`。通过通过 new Date()`\
  \ 创建对象会返回一个新的 `Date` 对象，而仅将 `Date()` 作为函数调用则返回属于用户系统的当前日期时间字符串表示。\n\n```\nlet currentDate\
  \ = new Date(); // 创建新对象\nlet travelDay = new Date('March 29, 2021 12: 11: 10');\n\
  // 使用指定日期创建新对象\nlet travelDay = new Date(2021, 3, 29)\n// 创建相同日期的新对象\nlet travelDay\
  \ = new Date(2021, 3, 29, 12, 11, 10)\n// 传递参数的另一种方式\n```\n\n属于 `Date` 类的静态方法包括\
  \ `Date.now()`、`Date.parse()` 和 `Date.UTC()`。`Date.now()` 返回表示自 1920 年 1 月 1 日（UTC）以来经过的总毫秒数的数值。此方法忽略闰秒。`Date.parse()`\
  \ 返回日期的字符串表示以及自标准基时间以来经过的毫秒数。`Date.UTC()` 返回作为参数传递的日期与标准基时间之间的差异。\n\n以下列表列出了属于 `Date.prototype`\
  \ 的一些常用实例方法。\n\n*   `getDate()` 和 `getUTCDate()`：这些方法分别根据本地用户时间和通用时间返回月份中的几天（范围：1–31）。\n\
  *   `getDay()` 和 `getUTCDay()`：这些方法分别根据本地用户时间和通用时间返回星期几几（范围：0–6）。\n*   `getFullYear()`\
  \ 和 `getUTCFullYear()`：这些方法分别根据本地时间和通用时间返回表示年份的四位数字。\n*   `getHours()` 和 `getUTCHours()`：这些方法分别根据本地用户时间和通用时间返回当前的小时（范围：0–23）。\n\
  *   `getMilliseconds()` 和 `getUTCMilliseconds()`：这些方法分别根据本地时间和通用时间返回 0–999 范围内经过的毫秒数。\n\
  *   `getMinutes()` 和 `getUTCMinutes()`：这些方法分别根据本地时间和通用时间返回分钟（范围：0–59）。\n*   `getMonth()`\
  \ 和 `getUTCMonth()`：这些方法分别根据本地时间和通用时间返回月份（范围：0–11）。\n*   `getSeconds()` 和 `getUTCSeconds()`：这些方法分别根据本地时间和通用时间返回秒（范围：0–59）。\n\
  *   `getTime()`：此方法返回自 1970 年 1 月 1 日以来经过的毫秒数数值。\n*   `getTimezoneOffset()`：此方法返回用户本地时区的偏移量。\n\
  *   `setDate()` 和 `setUTCDate()`：这些方法分别根据本地时间和通用时间设置月份。\n*   `setFullYear()` 和 `setUTCFullYear()`：这些方法分别根据本地时间和通用时间设置年份（四位数字）。\n\
  *   `setHours()` 和 `setUTCHours()`：这些方法根据指定日期设置小时（范围：0–23）。\n*   `setMilliseconds()`\
  \ 和 `setUTCMilliseconds()`：这些方法分别根据本地时间和通用时间设置指定日期的毫秒。\n*   `setMinutes()` 和 `setUTCMinutes()`：这些方法分别根据本地时间和通用时间设置分钟（范围：0–59）。\n\
  *   `setMonth()` 和 `setUTCMonth()`：这些方法分别根据本地时间和通用时间设置月份。\n*   `setTime()`：此方法用于将\
  \ `Date` 对象设置为指定值。\n*   `toDateString()`：此方法以字符串格式（可读形式）返回 `Date` 对象的日期值。\n*   `toJSON()`：此方法使用\
  \ `ISOString()` 方法返回表示 `Date` 对象的字符串值。\n*   `toLocaleDateString()`：此方法返回对应用户本地系统设置的日期字符串值。\n\
  *   `toLocaleString()`：此方法重写 `Object` 的 `toLocaleString()` 方法，返回根据本地系统设置的日期的字符串。\n\
  *   `toLocaleTimeString()`：此方法根据用户的系统设置返回表示本地时间的字符串。\n\n\n\n\n\n* `toString()`:\
  \ 此方法返回调用者 `Date` 对象的字符串值。它重写了 `Object` 原型上的 `toString()` 方法。\n\n* `valueOf()`:\
  \ 此方法返回调用者 `Date` 对象所持有的原始数值值。它重写了 `Object` 原型上的 `valueOf()` 方法。\n\n通过使用上述方法，`Date`\
  \ 对象可以根据程序需要轻松地设置、检索和操作这些值。如下一个示例所示，`Date` 对象通常与 `Number` 对象配合使用：\n\n```javascript\n\
  let d = new Date('April 17, 2021 01: 22: 44')\nconsole.log(Number(d)); //将 Date\
  \ 转换为 Number\n```\n\n`Date` 类提供了许多实例方法，可以方便地用于处理和执行与日期及时间相关的操作。这些方法被广泛用于为全球用户创建统一的、时间和日期敏感的\
  \ Web 内容。\n\n### 8.1.3.3 Math 对象\n\n`Math` 对象是另一个内置对象，它提供了复杂的数学运算和常量所需的属性和方法 113。你无法创建\
  \ `Math` 对象，因为 `Math` 对象不提供任何构造函数；相反，它提供了可以方便地全局使用的静态方法和属性。其中大部分是用于向程序提供给定值的常量。这些属性具有依赖平台或系统的实现；因此，不同的浏览器在执行\
  \ `Math` 对象的方法时可能会产生不同的结果。以下列表显示了 `Math` 对象中可用的大部分静态属性，随后静态方法：\n\n* `Math.E`: 此静态属性返回欧拉常数和自然对数的底的数值值，即\
  \ 2.718。\n* `Math.LN2`: 此静态属性返回 2 的自然对数值，即 0.693。\n* `Math.LOG2E`: 此静态属性返回 `E` 的以\
  \ 2 为底的对数，即 1.443。\n* `Math.LOG10E`: 此静态属性返回 `E` 的以 10 为底的对数，即 0.434。\n* `Math.PI`:\
  \ 此静态属性返回数学常数 PI，即 3.14159。\n* `Math.SQRT1_2`: 此静态属性返回 ½ 的平方根，即 0.707。\n* `Math.SQRT2`:\
  \ 此静态属性返回 2 的平方根，即 1.414。\n\n`Math` 对象内部可用的静态方法如下：\n\n* `Math.abs(X)`: 此静态方法返回 `X`\
  \ 的绝对值。\n* `Math.acos(X)`: 此静态方法返回 `X` 的反余弦值。\n* `Math.acosh(X)`: 此静态方法返回 `X` 的双曲反余弦。\n\
  * `Math.asin(X)`: 此静态方法返回 `X` 的反正正弦值。\n* `Math.asinh(X)`: 此静态方法返回 `X` 的双曲反正正弦。\n\
  * `Math.atan(X)`: 此静态方法返回 `X` 的反正切值。\n* `Math.atanh(X)`: 此静态方法返回 `X` 的双曲反正切值。\n\
  * `Math.cbrt(X)`: 此静态方法返回 `X` 的立方根值。\n* `Math.ceil(X)`: 此静态方法返回大于或等于 `X` 的最小整数值。\n\
  * `Math.floor(X)`: 此静态方法返回小于或等于 `X` 的最大整数值。\n* `Math.cos(X)`: 此静态方法返回 `X` 的余弦值。\n\
  * `Math.cosh(X)`: 此静态方法返回 `X` 的双曲余弦值。\n* `Math.sin(X)`: 此静态方法返回 `X` 的正弦值。\n* `Math.sinh(X)`:\
  \ 此静态方法返回 `X` 的双曲正弦值。\n* `Math.tan(X)`: 此静态方法返回 `X` 的正切值。\n* `Math.tanh(X)`: 此静态方法返回\
  \ `X` 的双曲正切值。\n* `Math.exp(X)`: 此静态方法返回 `E^X` 的值，其中 `E` 是欧拉常数，即 2.718。\n* `Math.log(X)`:\
  \ 此静态方法返回 `X` 的自然对数。\n* `Math.log2(X)`: 此静态方法返回 `X` 的以 2 为底的对数。\n* `Math.log10(X)`:\
  \ 此静态方法返回 `X` 的以 10 为底的对数。\n* `Math.max(a,b,c,d…)` 和 `Math.min(a,b,c…)`: 这些静态方法分别从传递的参数列表中返回最大和数字。\n\
  * `Math.pow(X,Y)`: 此静态方法返回底 `X` 的 `Y` 次方幂值，即 `X^Y`。\n* `Math.random()`: 此静态方法返回\
  \ 0 到 1 之间的随机实数。\n* `Math.round(X)`: 此静态方法将 `X` 的值舍入到最近的整数并返回其值。\n* `Math.sign(X)`:\
  \ 此静态方法返回 `X` 的符号值（即正、负或零）。\n* `Math.trunc(X)`: 此静态方法返回 `X` 的整数部分。\n\n### 8.1.4\
  \ 文本或字符串处理\n\n`文本或字符串处理` 通过字符串字面量或 `String` 构造函数在 JavaScript 中实现。`String` 对象用于处理、表示和操作一组字符。可以通过数组索引从\
  \ `String` 对象中访问字符，如接示例所示：\n\n```javascript\nlet str1 = 'string value'; //创建新字符串\n\
  let str2 = new String(\"A new object\"); //使用 String() 构造函数\nlet str3 = str1.charAt(3);\
  \ //str3 现在值为 'i'\nlet str4 = str2[6]; //str4 现在值为 'o'\n```\n\n小于、等于和大于运算符用于比较不同的字符串值。`valueOf()`\
  \ 方法用于将 `String` 对象转换为原始值。为了拼接多个字符串行或存储长字符串，可以使用运算符，即 `+` 或 `/`。\n\n```javascript\n\
  let str = \"This is an example to showcase a very long string\" +\n\"and this string\
  \ is not breaking, it is a continuous\" +\n\"string and can be called via str\"\
  ;\n\nlet str2 = `这是另一种存储长字符串的方法\n并且使用反斜杠允许它跨\n行。`;\n```\n\n`String` 对象只有一个实例属性，即\
  \ `length`，用于返回字符串的长度。定义了许多实例方法，其中一些简要描述如下：\n\n* `at(index)`: 此方法返回指定索引处的字符值。对于负值，会执行反向遍历。\n\
  * `charAt(index)`: 此方法返回指定索引处的字符值。对于负值，会执行反向遍历。\n* `concat(s1,s2…)`: 此方法返回一个新字符串，它是通过参数（两个或多个字符串）的拼接版本。\n\
  * `includes(str)`: 此方法在搜索以确定 `str` 是否存在于调用对象后返回 true 或 false。\n* `endsWith(str)`:\
  \ 如果 `str` 位于指定字符串的结尾，则返回 true；否则返回 false。\n\n\n\n\n\n- `indexOf(str)` 和 `lastIndexOf(str)`：这些方法分别返回\
  \ `str` 在指定字符串中首次和最后一次出现的索引。如果 `str` 不存在，则返回 −1。\n- `match(regexp)`：此方法用于确定正则表达式和字符串的等价性。如果找到，它返回一个匹配项的数组；否则返回\
  \ `null`。\n- `matchAll(regexp)`：此方法返回一个匹配项的迭代器，其中每个匹配项对应数组中的一个条。\n- `repeat(i)`：此方法返回一个包含\
  \ `i` 个副本并拼接在一起的新字符串。\n- `replace(X,Y)` 和 `replaceAll(X,Y)`：此方法用于在调用字符串中将搜索到的字符串（即\
  \ `X`）替换为字符串 `Y`，其中 `X` 可以是字符串或 `RegEx`，`Y` 可以是字符串或函数。前者替换第一个出现处，后者替换所有 `X` 出现处为\
  \ `Y`。\n- `search(regex)`：此方法在调用字符串中搜索 `RegEx` 的出现位置并返回索引值；否则返回 −1。\n- `slice(begin,end)`：此方法用于从\
  \ `begin` 索引提取到结束索引的字符串。它将提取的字符串作为一个新字符串返回，不对调用字符串进行任何修改。\n- `split(pattern)`：此方法用于使用\
  \ `pattern` 字符串将字符串分为有序的子字符串列表，以数组格式返回，每个分割后的字符串作为数组的一个条目。\n- `startsWith(str)`：如果调用字符串以\
  \ `str` 开头，此方法返回 `true`；否则返回 `false`。\n- `substring(beg,end)`：此方法返回从调用字符串中提取的子字符串，其中\
  \ `beg` 和 `end` 代表起始和结束索引值。\n- `toLowerCase()`：此方法通过将调用字符串转换为小写字符串返回一个新字符串。\n- `toUpperCase()`：此方法通过将调用字符串转换为大写字符串返回一个新字符串。\n\
  - `toString()`：此方法返回调用对象的字符串值。它覆盖了属于 `Object` 原型的 `toString()` 方法。\n- `trim()`：此方法通过移除字符串两端的空白字符返回一个新字符串。\n\
  - `trimStart()`：此方法通过移除调用字符串开头的空白字符返回一个新字符串。\n- `trimEnd()`：此方法通过移除调用字符串末尾的空白字符返回一个新字符串。\n\
  \n### 8.1.4.2 RegExp 对象\n\n正则表达式，简称 `RegExp`，是用于在字符串中查找某些组合或模式的模式。它们由简单的字符和修饰符组成。在搜索字符串是否存在某个\
  \ `RegExp` 时，只有当按照精确顺序找到完全相同的 `RegExp` 时，匹配才会成功。因此，定义和声明 `RegExp` 需要仔细注意细节。可以使用正则表达式字面量（括在反斜杠内）或通过调用\
  \ `RegExp()` 对象的构造函数来轻松创建正则表达式。接下来的示例所示：\n\n```javascript\nlet a = /lookup/; //使用字面量创建\
  \ regEx\n\n//使用构造函数。\n\nlet b = new RegExp(lookup’);\n\n// 字符串作为第一个参数\n\nlet c =\
  \ new RegExp(/lookup/);\n\n//字面量作为第一个参数\n```\n\n如果表达式不发生变化，通过字面量创建 `RegExp` 对象相对较快。如果\
  \ `RegExp` 是动态的或不断变化，那么使用 `RegExp` 构造函数更快，因为它提供了运行时编译。`RegExp` 也可以通过以下构造函数创建，其中\
  \ `pattern` 表示指定正则表达式的字符串值，而 `flag` 表示包含以下任何一个标志的可选修饰符字符串值：\n\n- `g` 标志指定 `RegExp`\
  \ 对象的全局作用域，即模式搜索将在全局范围内进行，且搜索不会在第一次匹配后停止。\n- `i` 标志指定 `RegExp` 对象的大小写敏感性，即当设置了 `i`\
  \ 标志时，将执行不区分大小写的搜索。\n- `m` 标志指定是否允许跨多行的多次匹配。\n\n让我们通过一个示例来理解这一点。在接下来的示例中，我们创建了三个正则表达式\
  \ `a,b` 和 `c`；`a` 使用字面量创建；`b` 使用 `RegExp` 的构造函数创建，但第一个参数是以字符串传递的；`c` 同样使用 `RegExp`\
  \ 的构造函数创建，但第一个参数是以字面量传递的。此外，我们创建了一个字符串 `str`，将在其中应用正则表达式来搜索并替换模式。\n\n```javascript\n\
  let a = /lookup/i; //使用字面量创建 regEx\n\n//使用构造函数。\n\nlet b = new RegExp(‘lookup’,’i’);\n\
  \n// 字符串作为第一个参数，修饰符作为第二个\n\nlet c = new RegExp(/lookup/,'i’);\n\n//字面量作为第一个参数，修饰符作为第二个\n\
  \nvar str = ”This is a string to perform lookup”;\n\nstr.search(a);\n\nstr.replace(b,”Regular\
  \ Expression Replacement”);\n```\n\n在图 8.2 中，我们可以观察到上述代码的输出。创建第一个输出是 28；这是单词“lookup”在\
  \ `str` 中的位置。第二个输出是对 `str` 使用正则表达式进行的操作。最后的输出表明，无论我们如何创建 `RegExp`，创建的表达式在所有情况下都是相同的。\n\
  \n![](img/fig8_2)\n\n正则表达式还有更多功能，其中括号用于查找字符的系列或范围。括号表示见表 8.1。\n\n| 括号表示 | 说明 |\n\
  | --- | --- |\n| `[abcd]` 或 `[0-9]` | 查找括号内存在的字符 |\n| `[^abcd]` 或 `[⁰-9]` | 查找括号内不存在的字符\
  \ |\n| `(a|b|c|d)` | 查找模式中的任意一个 |\n\n为了在正则表达式生成更丰富的模式，JavaScript 提供了*元字符*。这些元字符总结在表\
  \ 8.2。\n\n| 元字符 | | |\n| --- | --- |\n| `.` | 查找单个字符（换行符） |\n| `\\w` 和 `\\W` | 分别查找单词字符和非单词字符\
  \ |\n| `\\d` 和 `\\D` | 分别查找数字和非数字 |\n| `\\s` 和 `\\S` | 分别查找空白字符和非空白字符 |\n| `\\0`\
  \ | 查找空字符 |\n| `\\n` | 查找换行符 |\n| `\\r` | 查找回车符 |\n| `\\t` 和 `\\v` | 分别查找制表符和垂直制表符\
  \ |\n\n`RegExp` 的实例属性包括 `RegExp.prototype.flags`，它返回包含调用 RegExp 对象上存在的标志的字符串值。`RegExp.prototype.dotAll`\
  \ 是一个只读属性，用于显示是否在正则表达式使用了 `s` 标志。如果使用了 `g` 标志则返回 `true`；否则返回 `false`。`RegExp.prototype.global`\
  \ 也是一个只读属性，用于指示正则表达式中 `g` 标志的状态。如果使用了 `g` 标志则返回 `true`；否则返回 `false`。`RegExp.prototype.test()`\
  \ 用于测试调用字符串中是否存在模式。根据搜索结果返回 `true` 或 `false`。`RegExp.prototype.toString()` 返回正则表达式的字符串值。\n\
  \n正则表达式通常与字符串配合使用，特别是属于字符串对象的方法，包括 `match()`、`search()`、`split()` 和 `replace()`。模式匹配、搜索和替换是正则表达式的常见用例。\n\
  \n\n\n\n\n### 8.1.5 键集合 (Keyed Collections)\n\n键集合由使用键来标识值的对象组成，并且根据各自的插入顺序具有迭代性。这些包括\
  \ `Set`、`Map`、`WeakSet` 和 `WeakMap` [[117]](#ref-list.xhtml_refReferences_117)。接下来的章节将讨论\
  \ JavaScript 中两种最常用的键集合：Map 对象和 Set 对象。\n\n#### 8.1.5.1 Map 对象\n\nMap 对象可以按照完全相同的插入顺序存储键值对。原始值或对象值都可以用作键或值。它可以通过\
  \ `for … of` 循环轻松地遍历条目，每次迭代返回一个键值对 [[118]](#ref-list.xhtml_refReferences_118)。`Map`\
  \ 类提供了一个内置构造函数，即 `Map()`，用于创建新的 Map 对象。\n\nMap 对象的实例属性是 `Map.prototype.size` 属性，它用于返回\
  \ Map 对象中存在的键值对数量。在 `Map.prototype` 中定义的实例方法方法列出如下：\n\n*   `clear()`：此方法通过清除 Map\
  \ 对象中的所有键值对来清空 Map 对象。\n*   `get(key)`：此方法返回调用对象中指定 `key` 对应的值；否则返回 `undefined`。\n\
  *   `set(key, value)`：此方法用于在调用的 Map 对象为指定的 `key` 设置 `value`。如果 `key` 已经存在 `value`，则会覆盖它，并返回生成的\
  \ Map 对象。\n*   `has(key)`：此方法根据调用对象中是否存在 `key` 返回一个布尔类型的原始值。\n*   `delete(key)`：此方法删除与\
  \ `key` 对应的值并返回 true。如果 `key` 不存在，则返回 false。\n*   `keys()`：此方法返回一个迭代器对象，仅包含 Map\
  \ 对象中每个元素的 `keys`（按顺序）。\n*   `values()`：此方法返回一个迭代器对象，仅包含 Map 对象中每个元素的 `values`（按顺序）。\n\
  *   `entries()`：此方法返回一个迭代器对象，包含按插入顺序的 Map 对象的 `array[key,values]`。\n\n#### 8.1.5.2\
  \ Set 对象\n\nSet 对象简单来说是一个唯一项的集合。这些项可以是原始值或对象引用。`NaN` 和 `undefined` 也可以存储在 Set 中。迭代简单地按照插入顺序对\
  \ Set 对象进行 [[119]](#ref-list.xhtml_refReferences_119)。`Set` 类提供了一个内置构造函数 `Set()`\
  \ 来创建新对象。\n\nSet 类还有一个实例属性，即 `Set.prototype.size`，它返回调用 Set 对象中持有的值的整数计数。在 `Set.prototype`\
  \ 中定义的实例方法列出如下：\n\n*   `add(value)`：此方法用于向现有的 Set 对象添加新值，更新后返回该对象。\n*   `clear()`：此方法用于从调用的\
  \ Set 对象中移除所有值。\n*   `delete(val)`：此方法从调用对象中删除传递的值并返回 true；否则返回 false。\n*   `has(val)`：此方法检查调用\
  \ Set 对象中是否存在 `val`，如果找到则返回 true；否则返回 false。\n*   `values()`：此方法返回一个迭代器对象，按插入顺序持有调用\
  \ Set 中的所有值。\n*   `entries()`：此方法返回一个新的迭代器对象，按插入顺序持有 `array[value, value]`，即键和值具有相同的值。\n\
  *   `forEach()`：此方法对属于调用 Set 对象的每个值执行一次提供的操作。\n\n### 8.1.6 索引集合 (Indexed Collections)\n\
  \n索引集合包括如 `Array`、`Int8Array`、`Flo32Array`、`BigInt64Array` 和 `Int16Array` 等对象。它们代表有序的数据集合，包括数组和类数组结构\
  \ [[120]](#ref-list.xhtml_refReferences_120)。数组对象将在下一节中简要讨论，因为它在第 5 章 中详细讨论过。\n\n\
  #### 8.1.6.1 Array 对象\n\n数组对象是数据存储在非连续位置的动态高级对象。数组原型（Array prototype）提供了对数组进行方便遍历和处理操作的方法。\n\
  \nJavaScript 中的数组是零索引的，最后一个元素位于 (`length` - 1)，其中 `length` 是与数组关联的属性 [[121]](#ref-list.xhtml_refReferences_121)。使用无效索引将解析为\
  \ `undefined`。内置数组对象包括如 `slice()`、`indexOf()`、`join()`、`push()` 和 `splice()` 等方法，用于修改数组的长度属性。\n\
  \nArray 对象有其自己的构造函数 `Array()` 用于创建 Array 对象。Array 的静态方法包括 `Array.from()`、`Array.isArray()`\
  \ 和 `Array.of()`。`Array.from()` 用于使用调用数组创建新的 Array 对象。`Array.isArray()` 用于检查调用实体是否为数组，并根据结果返回原始布尔值。`Array.of(arg(s))`\
  \ 用于使用传递的参数作为数组条目创建新的 Array 对象。参数的数量即 `arg(s)` 可以变化。\n\nArray 对象拥有的实例属性是 `length`\
  \ 属性。在 `Array.prototype` 中定义的实例方法说明如下：\n\n*   `at()`：此方法返回指定索引处的数组项；负索引从末尾开始计数。\n\
  *   `concat()`：此方法在连接其他数组(s) 后返回一个新数组。\n*   `copyWithin()`：此方法用于在调用数组内拷贝一组数组项。\n\
  *   `entries()`：此方法返回一个包含调用数组键值对的迭代器对象。\n*   `every()`：此方法如果调用对象的中的每个元素都满足指定条件，则返回\
  \ true。\n*   `fill()`：此方法用于用传递的值填充整个数组。\n*   `filter()`：此方法对调用数组的每个元素进行过滤测试，并返回一个仅包含通过过滤条件的数组。\n\
  *   `find()`：此方法寻找满足条件的数组元素。如果找到，则返回元素；否则返回 `undefined`。\n*   `findIndex()`：此方法返回指定元素在数组中的索引；否则返回\
  \ -1。\n*   `forEach()`：此方法对调用数组中存在的每个元素调用指定的方法。\n*   `includes(val)`：此方法如果调用数组包含指定值，则返回\
  \ true；否则返回 false。\n*   `indexOf()`：此方法返回指定元素在数组中首次出现的索引；否则返回 -1。\n*   `join()`：此方法连接调用数组的所有元素并返回结果字符串。\n\
  *   `keys()`：此方法返回一个包含调用数组对象每个元素索引的迭代器对象。\n*   `lastIndexOf()`：此方法返回指定元素在数组中最后一次出现的索引；否则返回\
  \ -1。\n*   `pop()`：此方法移除并返回调用数组的最后一个元素。\n*   `push()`：此方法向数组添加一个新元素并返回结果数组的长度。\n\
  *   `reverse()`：此方法反转数组内所有元素的整个顺序并返回结果数组对象。\n*   `shift()`：此方法移除并返回调用数组中的第一个元素。\n\
  *   `some()`：此方法即使仅有一个元素满足指定条件，也会返回 true。\n*   `sort()`：此方法用于对数组元素进行排序并返回结果数组。\n\
  *   `splice()`：此方法用于从调用的数组对象中添加或删除元素。\n\n\n\n\n\n*   `toString()`: 此方法返回一个包含数组中所有元素的字符串。\n\
  *   `values()`: 此方法返回一个新的迭代器对象，包含数组中所有元素的值。\n\n### 8.1.7 结构化数据 (Structured Data)\n\
  \n`Structured Data` 包含了用于交互和表示结构化数据以及嵌入在 JSON（JavaScript 对象表示法）中的对象 [[122]](#ref-list.xhtml_refReferences_122)。\n\
  \n### 8.1.8 值属性 (Value Properties)\n\n值属性是返回简单预定义值的全局属性。它们没有任何关联的属性或方法。这些包括 `Infinity`、`NaN`、`globalThis`\
  \ 和 `undefined`。\n\n*   `Infinity` 是一个表示无穷大的全局属性；该值甚至可以比较。可以使用 `isFinite()` 方法测试给定的对象是否包含无穷。例如：\n\
  \n```javascript\nlet result = 12 / 0; //除以零。\n\nconsole.log(result); //存储了 Infinity\n\
  \nif (result == Infinity)\n\nconsole.log(‘Oh this is infinity value’)\n\nconsole.log(isFinite(result));\
  \ // 打印 false\n```\n\n*   `NaN` 是一个表示“不是数字”（Not a Number）的全局属性；它可以在数值计算中使用，其中非数字可能会破坏输出。可以使用\
  \ `isNaN()` 方法测试任何包含数字的对象。例如：\n\n```javascript\nlet x = ’1’ // 在 x 中存储一个数字\n\nconsole.log(isNaN(x))\
  \ // 打印 false\n\nlet y = ’a’ // 在 y 中存储一个字符串\n\nconsole.log(isNaN(y)) // 打印 true\n\
  ```\n\n*   `undefined` 属性代表 JavaScript 中的 `undefined`，它是一个原始类型。它可以用于值未定义的地方。当变量没有默认值时，会返回此值。例如：\n\
  \n```javascript\nlet x\n\nconsole.log(x); // 打印 undefined\n```\n\n*   `globalThis`\
  \ 属性代表全局作用域引用。JavaScript 在不同的环境中提供不同的全局作用域；这使得访问全局变量变成了一项麻烦的任务。`globalThis` 始终有一组全局引用，这使得引用变得更容易。\n\
  \n### 8.1.9 函数属性 (Function Properties)\n\n函数属性是不依赖于任何对象即可调用的全局函数；它们直接对调用者做出响应。这些包括\
  \ `isFinite()`、`isNan()`、`parseInt()`、`eval()`、`parseFloat()`、`encodeURI()`、`encodeURIComponent()`、`decodeURI()`\
  \ 和 `decodeURIComponent()`。\n\n*   `eval()`: 此方法评估作为字符串形式传递的 JavaScript 代码。例如：\n\
  \n```javascript\nconsole.log(eval('12 + 24')); // 打印 36\n```\n\n*   `isFinite()`:\
  \ 此方法检查调用对象是否解析为 `finite`（有限）或 `Infinite`（无穷）。例如：\n\n```javascript\nconsole.log(isFinite(10\
  \ / 0)); // 打印 false\n```\n\n*   `isNan()`: 此方法检查调用对象是否包含 `NaN`。例如：\n\n```javascript\n\
  console.log(isNan(‘aa’)); // 打印 true\n```\n\n*   `parseInt()`: 此方法根据第二个参数（作为基数）将给定的字符串解析为对应的整数值。例如：\n\
  \n```javascript\nconsole.log(parseInt(‘oxf’, 16); // 打印 15\n```\n\n*   `parseFloat()`:\
  \ 此方法将给定的字符串解析为对应的浮点值。例如：\n\n```javascript\nconsole.log(parseFloat(“3.14”)); //\
  \ 打印 3.14\n```\n\n*   `encodeURI()` 和 `decodeURI()`: 这些方法用于编码或解码字符串 URL 中的特殊字符。这些方法不会编码或解码这些特殊字符（`,\
  \ /? : @ & = + $ #）。例如：\n\n```javascript\nvar uritoEncode = “example.com?name =\
  \ råvi”;\n\nvar result = encodeURI(uritoEncode);\n\nconsole.log(result);\n\n// 输出为\
  \ “example.com?name = r%C3%A5vi”\n\nvar uriAfterDecode = decodeURI(result)\n\nconsole.log(uriAfterDecode)\n\
  \n// 输出为 example.com?name = råvi”\n```\n\n*   `encodeURIComponent()` 和 `decodeURIComponent()`:\
  \ 这些方法也用于编码或解码字符串 URL 中的特殊字符。这些函数还会编码或解码这些特殊字符（, /?: @ & = + $ #）。例如：\n\n```javascript\n\
  var uritoEncode = “example.com?name = råvi”;\n\nvar result = encodeURIComponent(uritoEncode);\n\
  \nconsole.log(result);\n\n// 输出为 ““example.com%3Fname%3Dr%C3%A5vi””\n\nvar uriAfterDecode\
  \ = decodeURIComponent(result)\n\nconsole.log(uriAfterDecode)\n\n// 输出为 example.com?name\
  \ = råvi”\n```\n\n## 8.2 练习\n\n### 8.2.1 理论\n\n1.  为 JavaScript 中可用的内置标准对象提供分类。详细阐述并讨论每一个类别。\n\
  2.  `Object` 原型和 `Function` 原型之间有什么区别？它们提供相同的功能吗？如果不是，请说明你的理由。\n3.  在设计网页时，如何使用\
