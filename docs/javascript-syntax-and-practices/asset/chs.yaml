  ,\n  \"变量和函数被移动到了顶部\",\n]);\n\nfunction testFunction(arg) {\n  appendToHTML([\n\
  \    `你好，因为有了提升我正在工作，耶耶 | 传递的参数 -> ${arg}`,\n  ]);\n}\n```\n\n 8.4.3.2 代码片段-2\n\
  ```javascript\n// 工具函数 ()\nconst appendToHTML = (contents, color = \"white\") =>\
