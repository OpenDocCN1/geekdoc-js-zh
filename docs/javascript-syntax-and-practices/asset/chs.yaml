  \n> *我明白层级和纪律意味着什么。没有这些，我们永远不会有秩序和进步。*\n\n> –Jair Bolsonaro\n\n通过 JavaScript 内部原理和基础概念的讨论，我们已经走了很远。我们还讨论了对象、原型以及如\
  \ `functions` 和 `arrays` 等特殊对象。本章将带我们与 JavaScript 现实实现相关的某些概念。在本章中，我们将探索浏览器对象模型（BOM）。\n\
  \n\n\n\n\n*   `document object`: 它用于访问文档对象模型（DOM），以获取网页页详细的标记结构；换句话说，这是包含浏览器中所有\
  \ HTML + CSS + JavaScript 代码的 get。\n\n图 6.2 展示了 BOM 到浏览器窗口的对象的映射。如图所示，`window` 对象代表\
  \ Web 浏览器窗口。`history` 对象可以操作用户访问的 URL。`screen` 对象可以用于访问浏览器的与屏幕相关的属性。`navigator`\
  \ 对象用于访问浏览器的详细信息，而 `document` 对象用于访问、加载和执行 HTML 代码（其中包含 JavaScript 代码）。`document`\
  \ 对象可以被视为 BOM 中存在最重要的对象。虽然所有其他对象处理的都是相对琐碎的信息，但 `document` 对象有助于执行与网页内容相关的代码。DOM\
  \ 代表了为 `document` 对象存在的独立层级结构；将在下一章中进行详细讨论。\n\n![](img/fig6_2.jpg)\n\n图 6.2 浏览器窗口中对象的可视化。\n\
  \n## 6.2 Window 对象\n\n简单来说，`window` 对象代表 Web 浏览器中打开的窗口。`window` 对象是一个全局对象，用于操作浏览器窗口的生命周期，并在浏览器窗口或标签页内执行各种操作\
  \ [[89]](#ref-list.xhtml_refReferences_89)。它位于 BOM 层级结构的顶层，因此作为浏览器的根对象。它是属于浏览器本身的对象，而不是属于\
  \ JavaScript 代码（JS 对象包括 `String`、`Array`、`Number` 等）。`window` 对象代表浏览器本身，并受到所有主流浏览器的支持。因此，层级结构下的所有其他对象、方法和属性自动属于\
  \ `window` 对象。\n\n可以使用关键字 `window` 直接访问执行代码的当前浏览器窗口。还记得我们在第 1 章中用于打印输出的 `console.log()`\
  \ 方法吗？它属于 `window` 对象，每个 `window` 对象都有自己的 `console.log()` 方法，该方法打印到该特定 Web 浏览器窗口的控制台中。在修改浏览器属性时，并非强制显式使用\
  \ `window` 引用，例如：\n\n```\nwindow.console.log(“Hey, there!”);\nconsole.log(“Hey there!”);\
  \ //两者相同\n```\n\n在浏览器的控制台中，只需编写 `Reflect.ownKeys(window)` 或直接在浏览器控制台中输入 `window`\
  \ 将返回 `window` 对象内部包含的属性。你会惊讶地发现 `window` 对象内部有 1014 个键，这些键在层级结构下方还有自己的属性。这证明了包含\
  \ `window` 对象属性的树形结构的广深度。这限制了我们在这里讨论 `window` 对象的所有属性和方法，因此我们在本章中只讨论最常用的属性和方法。图\
  \ 6.3 代表了执行 `Reflect.ownKeys(window)` 时控制台的快照。\n\n![](img/fig6_3.jpg)\n\n图 6.3 浏览器控制中的\
  \ Window 对象。\n\n对于多标签页浏览器，每个浏览器标签页都有自己的 `window` 对象。每当打开新标签页时，都会创建一个新的 `window`\
  \ 对象。只有高度、宽度等通用属性在这些对象之间共享，因此对这些属性的任何更改都将影响整个浏览器窗口。\n\n理论上，`window` 对象被视为树的根，其分支是\
  \ BOM、DOM、JavaScript、HTML 和其他前端开发代码。如图 6.4 所示，BOM 可以被视为一组通过 `window` 对象向开发者开放的 get。\n\
  \n![](img/fig6_4.jpg)\n\n图 6.4 JavaScript 与 BOM 的交互。\n\n这些浏览器窗口/标签页可以进一步细分为 `frames`（帧）。帧是将浏览器窗口划分为多个区域独特方式，每个帧都可以加载自己的脚本。浏览器窗口内的每个帧对象都是父对象的子对象。浏览器并非所有都通用支持帧，但它们提供了一种手术化的方法来划分和操作浏览器窗口区域。\n\
  \nWindow 对象定义了特定的方法和属性，通过这些项可以访问和修改浏览器窗口。这些属性和方法概述如下。\n\n### 6.2.1 Window 对象的属性\n\
  \n`window` 对象有自己的属性，在与该对象交互时非常有用。建议练习这些属性，以便掌握它们并在需要时使用。这些属性解释如下：\n\n*   `innerHeight`\
  \ 和 `innerWidth`：它返回浏览器窗口中内容区域的内部高度和宽度。它对于访问浏览器高度和宽度以设计网页内容非常有用，它会根据用户的浏览器规格进行自动调整。\n\
  *   `name`：该属性以字符串格式返回当前活动窗口的名称。\n*   `parent`：该属性返回当前窗口的父对象。\n*   `screenX` 和 `screenY`：该属性返回窗口相对于用户显示器/显示分辨率的\
  \ X 和 Y 坐标（像素为单位）。\n*   `top`：该属性返回 Web 浏览器中打开的最顶部浏览器窗口的引用。\n*   `status`：该属性以字符串格式返回在状态栏上显示的文本。\n\
  *   `length`：该属性返回浏览器窗口内存在的帧元素数量。\n*   `frames`：该属性返回一个数组对象的引用，代表窗口中现有的帧。\n*   `self`：该属性返回属于活动窗口的当前对象的引用。\n\
  *   `closed`：该属性返回一个布尔值，指示浏览器窗口是打开还是关闭的。\n*   `history`：该属性返回属于 `window` 对象的历史对象，可以访问用户访问过的\
  \ URL。\n*   `navigator`：该属性返回窗口的 navigator 对象。\n*   `screen`：该属性返回窗口的 screen 对象，可以用于访问宽度、高度和其他屏幕相关的属性。`screen.height`\
  \ 和 `screen.width` 分别返回用户浏览器窗口的高度和宽度。\n*   `location`：该属性返回属于 `window` 对象的 location\
  \ 对象。可以用于访问用户正在访问的 URL。\n*   `document`：该属性返回窗口的 document 对象，可以用于操作浏览器加载的网页内容（HTML\
  \ 代码）。它代表浏览器中的每个实体对象，可以对其进行修改以实现所需的行为。\n\n### 6.2.2 Window 对象的方法\n\n`window` 对象包含许多方法，用于与用户交互并控制浏览器窗口的行为。如\
  \ `alert()`、`prompt()` 和 `confirm()` 等方法是 `window` 对象的少数方法。这些方法提供了用于与用户交互的对话框。还有如\
  \ `setInterval()` 和 `setTimeout()` 等其他方法；它们支持基于时间的事件。还有许多与 `window` 对象相关的其他方法，其中一些方法解释如下：\n\
  \n*   `open()`：此方法将打开一个新的浏览器窗口并加载 URL（如果指定）。它返回新打开的浏览器窗口的 `window` 对象引用。`open()`\
  \ 的参数是可选的；如果没有指定，将打开空白新窗口。使用 `open()` 的示例为：\n\n```\nvar url = “https://www.google.com”;\n\
  var newBrowserWindow = window.open(url, name, width height);\n```\n\n\n\n\n\n```javascript\n\
  var newWindow = window.open(url, “New Window”, “width = 300, height = 200”);\n```\n\
  /*open() 返回变量 newWindow 的对象引用 */\n\n- `close()`: 此方法关闭 Web 浏览器中当前激活的窗口。\n- `print()`:\
  \ 此方法打开 Web 浏览器窗口的打印对话框，用于显示窗口内容的各种打印选项。它没有返回值。\n- `scrollTo(width,height)`: 此方法用于将文档滚动到指定的坐标。它没有返回值。\n\
  - `resizeTo(width,height)`: 此方法用于将浏览器窗口调整为指定的 `width` 宽度和 `height` 值。\n- `resizeBy(width,height)`:\
  \ 此方法通过给定的像素调整浏览器窗口的大小，该值相对于窗口当前的大小。\n- `blur()` 和 `focus()`: 这两个方法分别用于移除或设置当前浏览器窗口的焦点。`blur()`\
  \ 只是将新打开的窗口推到后台，而 `focus()` 在需要时将其带回前台。这些方法用于向用户突出显示关键信息。\n- `setInterval(callback_function,\
  \ interval)`: 此方法用于按周期间隔（毫秒为单位）执行函数。除非调用 `clearInterval()` 方法或使用 `close()` 方法关闭当前浏览器窗口，否则该方法将继续按指定的间隔执行。\n\
  \n```javascript\nvar x;\n\nfunction newFunc() {\n  x = setInterval(timeoutFunction,\
  \ 2000);\n  // 每隔 2 秒运行一次函数\n}\n\nfunction timeoutFunction() {\n  console.log (“I\
  \ am a recurring function”);\n}\n\nnewFunc();\n// 调用函数启动定时函数\n\nwindow.clearInterval(x);\n\
  /* 清除定时器并停止执行，在我们想要停止循环方法时应调用它 */\n```\n\n- `setTimeout(callback_function, interval)`:\
  \ 此方法用于在指定的时间间隔后执行一次函数。\n\n```javascript\nvar x;\n\nfunction newFunc() {\n  x =\
  \ setTimeout(timeoutFunction, 2000);\n  // 在 2000 毫秒后运行一次函数\n}\n\nfunction timeoutFunction()\
  \ {\n  console.log (“I am a recurring function”);\n}\n\nnewFunc(); // 调用函数启动超时函数\n\
  ```\n\n- `stop()`: 此方法用于停止当前浏览器窗口的加载。\n\n还有许多其他方法，但并非所有方法在浏览器中都能被支持（例如 `createPopUp()`\
  \ 等）。因此，我们选择了重要的方法在本节中进行讨论和记忆。接下来，我们将讨论 `window` 对象中存在的其他对象。\n\n## 6.3 History 对象\n\
  \nHistory 对象是 `window` 对象的一个属性，它包含浏览器 `会话历史` (session history) 标签页的历史相关信息 [[90]](#ref-list.xhtml_refReferences_90)。它主要用于访问用户访问过的\
  \ URL 数组。通过操作该数组，可以将用户访问的任何页面加载到浏览器中，包括标签页和帧。可以通过 `window.history` 或 `history` 引用直接访问。\n\
  \n`window.history` 是一个只读属性，用于获取对 `history` 对象的引用。每当用户点击链接时，浏览器的 `history` 对象就会记录一个新条目。这些条目存储在一个类似于栈的结构中，被称为\
  \ `history stack` (历史栈)。它可以用于动态重构网页或更改网页内容的加载行为。\n\n### 6.3.1 History 对象的属性\n\n\
  History 对象具有以下相关属性。这些属性可用于操作浏览器的历史记录。\n\n- `length`: 此属性返回用户在本次 Web 会话期间访问的 URL\
  \ 数量（数字）。\n\n```javascript\nlet numberOfURLVisited = window.history.length;\n//\
  \ 返回包含 URL 的数组的长度\n```\n\n- `current`: 此属性返回 `history` 对象的当前条目，即用户在本次会话期间正在访问的 URL。\n\
  - `next`: 此属性返回用户访问的 URL 数组中的下一个条目。\n- `previous`: 此属性返回用户访问的上一个页面的 URL。\n- `state`:\
  \ 此属性包含属于历史对象的所有条目的副本。这主要用于通过 `pushState()` 方法手动添加历史条目。当用户进入一个新状态时，会触发 `popState()`\
  \ 事件。该事件具有一个 `state` 属性，其中持有指向当前历史条目的引用。\n\n### 6.3.2 History 对象的方法\n\n`history`\
  \ 对象具有以下方法，用于对用户访问的历史记录执行操作。\n\n- `back()`: 此方法加载用户访问的上一个页面的 URL。它的工作方式与用户点击浏览器窗口中的“后退”按钮完全相同。\n\
  - `forward()`: 此方法加载 URL 数组中的下一个可用条目。同样，它的工作方式与浏览器窗口中的“前进”按钮工作完全相同。\n- `go()`: 此方法用于从会话历史数组中加载特定页面。可以使用整数进行操作。例如\
  \ `history.go(-1)` 的作用相当于 `back()`，而 `history.go(1)` 的作用相当于 `forward()`。同样，可以通过\
  \ `go()` 方法以任何顺序访问任何页面，例如使用 -4 作为参数访问用户访问的倒数第四页。在不带任何参数的情况下调用 `go()` 将只需刷新当前加载的网页。\n\
  - `pushState(state, title, URL)`: 此方法用于手动（通过程序代码）添加新的历史事件并操作历史对象的状态。当调用 `pushState()`\
  \ 方法并指定的 URL 时，该 URL 将加载且栈顶将被替换。URL 必须与当前 URL 同源，否则将抛出异常。当 `pushState()` 方法执行时，`length`\
  \ 属性加 1。\n\n- `replaceState(state, title, URL)` 替换历史对象的当前条目，而不是添加新条目。`state` 变量持有更新后的状态及其对应的标题和加载的\
  \ URL。`title` 参数是一个表示标题的字符串值。\n\n## 6.4 Navigator 对象\n\n`navigator` 对象用于访问浏览器窗口的信息，如版本、平台、操作系统版本、可用插件等。可以通过\
  \ `window` 对象访问 `navigator` 对象，即 `window.navigator` 或简单用 `navigator`。它是一个只读属性，可以提供运行程序代码或脚本的主宿环境的信息\
  \ [[91]](#ref-list.xhtml_refReferences_91)。\n\n\n\n\nNavigator 对象在某些特定情况下非常有用，这使得整体网站设计更加完善。它可以用于检查浏览器兼容性，并加载特定的脚本以解决任何兼容性问题。它可以用于访问用户的首选语言，或访问位置信息以显示自定义内容。它还可以通过\
  \ `onLine` 属性检查浏览器是否在线。因此，`navigator` 对象提供的信息可以帮助在浏览网站时提升终端用户的体验。\n\n#### 6.4.1\
  \ Navigator 对象的属性和方法\n\n属于 `navigator` 对象的不同属性简要列如下。建议你使用自己的浏览器和脚本对这些属性进行练习。\n\n\
  *   `appName`: 此属性返回当前正在使用的浏览器名称。\n*   `appCodeName`: 此属性返回 Web 浏览器的内部代码名称。\n* \
  \  `appVersion`: 此属性以 DOM 字符串的形式返回运行浏览器的版本号。\n*   `cookieEnabled`: 如果浏览器启用了 cookie，则此属性返回\
  \ `true`；否则返回 `false`。\n*   `platform`: 此属性返回一个字符串值，包含运行 Web 浏览器的平台或机器类型的信息。\n*\
  \   `userAgent`: 此属性返回 `userAgent` 字符串，即当前运行的 Web 浏览器的服务器请求标头。\n*   `plugins`: 此属性用于返回一个数组，提供有关\
  \ Web 浏览器支持的插件的信息。\n*   `onLine`: 如果浏览器在线（即具有网络连接），则此属性返回布尔值 `true`；否则返回 `false`。\n\
  *   `language`: 此属性返回代表首选浏览器语言的字符串值。`languages` 属性返回一个字符串值，包含按用户偏好排序的浏览器支持的所有语言。这在为地理位于不同地区的人设计网页时非常有用。\n\
  *   `geolocation`: 此属性返回一个 `GeoLocation` 对象，该对象持有用户设备的位置信息。\n\n除了上述属性外，还有许多操作 `navigator`\
  \ 对象的简单方法，例如 `javaEnabled()`；如果浏览器启用了 Java 支持，则该方法返回 `true`；否则返回 `false`。\n\n##\
  \ 6.5 Location 对象\n\n`location` 对象包含了与浏览器窗口中当前加载的 URL 相关的信息。`window` 对象和 `document`\
  \ 对象都可以分别通过 `window.location` 和 `document.location` 访问位置对象。`window.location` 属性存储对浏览器窗口位置对象的引用，而\
  \ `document.location` 存储指定文档的位置对象 92。理解 `navigator` 和 `location` 对象之间的区别是重要的。`Navigator`\
  \ 对象用于访问所有 URL，帮助开发者进行导航；而 `location` 对象仅用于存储浏览器窗口内当前加载的 URL 的详细信息。\n\n### 6.5.1\
  \ Location 属性\n\nLocation 对象提供了许多属性，可查询地址、主机、端口、协议和其他 URL 相关信息。这些属性简要解释如下：\n\n*\
  \   `hash`: 此属性返回一个包含 URL 锚点部分（以 # 开头）的字符串。\n*   `href`: 此属性返回一个包含浏览器窗口中加载的 URL\
  \ 的字符串。\n*   `origin`: 此属性返回当前加载 URL 使用的协议、主机和端口号。这是一个只读属性，用于检索特定位置的源。\n*   `protocol`:\
  \ 此属性返回一个包含协议方案的字符串，访问该特定 URL 需要该方案。\n*   `search`: 此属性用于以字符串格式设置或返回 URL 的搜索查询语句。\n\
  *   `port`: 此属性存储一个字符串，包含用于关联 URL 的服务器通信端口的端口号。\n*   `pathname`: 此属性用于设置或返回加载 URL\
  \ 的路径名。\n*   `host`: 此属性用于设置或返回一个包含 URL 主机名和端口号的字符串，用冒号分隔。\n*   `hostname`: 此属性用于设置或返回浏览器窗口中当前加载\
  \ URL 的主机名或域名。\n\n#### 6.5.2 Location 对象的方法\n\n*   `assign(URL)`: 此方法用于在浏览器中加载新文档，其中\
  \ `URL` 是持有文档 URL 的字符串。它没有返回值。\n\n```\nlocation.assign(\"https://www.google.co.in\"\
  ); //加载新的 URL\n```\n\n*   `reload()`: 此方法用于重新加载浏览器中 `location.href` 属性中存在的当前文档。该方法不接受任何参数，且没有返回类型。它的作用等同于浏览器中的刷新按钮。\n\
  *   `replace()`: 此方法用于用指定的文档替换当前加载的文档，并替换当前历史记录的值。这将使“后退”按钮失效，导致无法返回到之前加载的文档，因为它替换了该\
  \ URL 本身的值。\n\n```\nlocation.replace(\"https://www.taylorandfrancis.com\");\n//替换现有的\
  \ URL，移除历史记录\n```\n\n*   `toString()`: 此方法用于检索一个包含 Web 浏览器中当前加载文档完整 URL 的字符串。它通常用于获取加载\
  \ URL 的字符串值。\n\n## 6.6 Screen 对象\n\n`screen` 对象持有 Web 浏览器的屏幕尺寸相关信息，如宽度、高度、像素深度等。可以通过\
  \ `window.screen` 或 `screen` 93 访问。与屏幕相关的属性如下：\n\n*   `width`: 此属性返回当前屏幕的总宽度（像素）。\n\
  *   `height`: 此属性返回当前屏幕的总高度（像素）。\n*   `availWidth`: 此属性返回排除 Windows 任务栏后的可用宽度。\n\
  *   `availHeight`: 此属性返回排除 Windows 任务栏后的可用高度。\n*   `pixelDepth`: 此属性用于返回 Web 浏览器屏幕的色彩（每像素位）。\n\
  *   `colorDepth`: 此属性返回屏幕调色板深度（位）。位数代表调色板深度，在显示图像时非常有用。\n\nScreen 对象没有关联的标准方法。然而，它的存在极大帮助开发者在考虑用户屏幕规格的情况下设计内容。\n\
  \n## 6.7 Document 对象\n\nDocument 对象是 BOM 中包含的核心且最重要的对象。它包含了浏览器窗口中加载的文档所有的 HTML 元素。它简单地代表了整个网页元素。每当\
  \ HTML 文档加载到浏览器窗口时，它就变成了属于 `window` 对象的 `document` 对象。为了访问网页中的任何 HTML 元素，必须访问 `document`\
  \ 对象本身。可以通过 `window.document` 或简单的 `document` 进行访问。DOM 将在下一章详细讨论。\n\n#### 6.8 练习\n\
  \n##### 6.8.1 理论\n\n1. 如何重定向网页并在指定的标签页加载另一个网页？\n2. BOM 中存在的不同对象的用途是什么？请结合具体的属性逐一解释。\n\
  3. 区分 `navigator` 和 `location` 对象。\n\n##### 6.8.2 判断题\n\n\n\n\n# 1. BOM 是 JavaScript\
  \ 对象模型的实事实标准。\n\n2. BOM 以完全相同的方式支持，并适用于所有现代 浏览器。\n\n3. BOM 定义了 浏览器如何与文档内容以及宿主环境变量进行交互。\n\
  \n4. `Navigator` 和 `location` 对象具有更多或相似的功能；因此，它们可以互换使用。\n\n5. 使用 `screen` 对象时，使用的值是像素（pixels）。\n\
  \n## 6.8.3 单选题\n\n1. _________ 对象充当所有客户端 JavaScript 功能的主要入口点。\n    1. `navigator`\n\
  \    2. `window`\n    3. `history`\n    4. `screen`\n\n2. 如果你想在浏览器中重复执行某个元素的操作，你会使用以下哪种方法？\n\
  \    1. `setTimeout()`\n    2. `executeFunction()`\n    3. `moveAnimation()`\n \
  \   4. 以上都不是\n\n3. 下列哪个对象是 BOM 的根节点？\n    1. `window`\n    2. `document`\n    3.\
  \ `screen`\n    4. `root`\n\n4. BOM 内部的对象本质上是 __________。\n    1. 全局（global）\n \
  \   2. 局部（local）\n    3. 取于程序作用\n    4. 全局或局部\n\n5. 可以使用 __________ 获取客户端浏览器窗口名称。\n\
  \    1. `navigator.appName`\n    2. `webBrowser.name`\n    3. `client.navName`\n\
  \    4. 以上都不是\n\n## 6.9 BOM 演示与实操\n\n### 6.9.1 目标\n\n1. BOM 的基础知识。\n2. 在浏览器会话历史中向前/后遍历。\n\
  3. 使用 `window` 和其他对象操作网页。\n\n### 6.9.2 前提条件\n\n* **步骤 1**: 访问 [`www.routledge.com/9780367641429`](https://www.routledge.com/9780367641429)\
  \ 并下载 `Ch6_BOM_Template` 的 压缩文件。\n* **步骤 2**: 解压内容并使用任选的编辑器打开 `index.html`（例如：记事本或\
  \ Visual Studio Code）。\n* **步骤 3**: 在 `index.html` 的 `<script>` 块中插入下方提供的代码。\n*\
  \ **步骤 4**: 对下方提供的每个代码片段重复上述三个步骤。\n\n### 6.9.3 探索\n\n使用任何编辑器，我们将编写并测试 JavaScript\
  \ 代码以与 DOM 交互并在网页上显示结果。以下是你应该了解 BOM 的知识。BOM 代表浏览器对象模型（Browser Object Model）。DOM\
  \ 是它的子集。它主要允许 JS 与浏览器级元素交互，并提供了屏幕尺寸、主机名、协议等大量信息。\n\n#### 6.9.3.1 代码片段-1\n\n```javascript\n\
  // Utility ()\n\nconst appendToHTML = (contents, color = “white”) => {\n  contents.forEach((content)\
  \ => {\n    const myPara = document.createElement(“p”);\n    myPara.style.color\
  \ = color;\n    myPara.innerHTML = content;\n    resultHere.appendChild(myPara);\n\
  \    sep();\n  });\n};\n\nconst sep = () => {\n  const separator = document.createElement(“hr”);\n\
  \  resultHere.appendChild(separator);\n};\n\n/************************************************************\
  \ */\nvar resultHere = document.querySelector(\".results”);\n// 检查渲染内容的允许宽度（可用空间）。\n\
  const windowWidth = window.innerWidth;\nconst windowHeight = window.innerHeight;\n\
  // 检查用户显示器的实际分辨率。\nconst screenWidth = window.screen.width;\nconst screenHeight\
  \ = window.screen.height;\nconst windowLocObj = JSON.stringify(window.location);\n\
  appendToHTML(\n  [\n    `Current window size: ${windowWidth} x ${windowHeight}(in\
  \ Pixels)`,\n    `Current screen size: ${screenWidth} x ${screenHeight} (in Pixels)`,\n\
  \  ],\n  “black”\n);\nsep();\n\n// 从 window.location 提取信息在很多情况下非常用，例如强制或检查协议、主机名等……\n\
  appendToHTML([“window.location holds these information ->”, windowLocObj]);\n```\n\
  \n#### 6.9.3.2 代码片段-2\n\n```javascript\n// Utility ()\n\nconst appendToHTML = (contents,\
  \ color = “white”) => {\n  contents.forEach((content) => {\n    const myPara = document.createElement(“p”);\n\
  \    myPara.style.color = color;\n    myPara.innerHTML = content;\n    resultHere.appendChild(myPara);\n\
  \    sep();\n  });\n};\n\nconst sep = () => {\n  const separator = document.createElement(“hr”);\n\
  \  resultHere.appendChild(separator);\n};\n\n/************************************************************\
  \ */\nvar resultHere = document.querySelector(\".results”);\n// 使用 window.history\
  \ 对象在当前会话的浏览器历史中导航\ndocument.querySelector(\".bwd”).addEventListener(“click”, (event)\
  \ => {\n  alert(“我感应你想向后导航，满足你的愿望（点击 OK）”);\n  window.history.back();\n});\ndocument.querySelector(\"\
  .fwd”).addEventListener(“click”, (event) => {\n  alert(“我感应你想向前导航，满足你的愿望（点击 OK）”);\n\
  \  window.history.forward();\n});\nappendToHTML([\n  “In case of”,\n  “In case of”,\n\
  \  “In case of”,\n]);\n```\n\n\n\n\n在继续之前，让我们再来看一个例子以更好地理解 `document` 对象。在这个例子中，接下来给出了简单的\
  \ HTML 代码段，它可以简单地表示为 DOM 结构，如图图 7.2 所示。\n\n![](img/fig7_2.jpg)\n\n图 7.2 上述 HTML\
  \ 代码段的 DOM 表示。\n\n```html\n<<html>\n<head>\n<title>Welcome to DOM!</title>\n</head>\n\
  <body>\n<p>Every tag</p>\n<p>works like an object</p>\n<p>with a separate entry</p>\n\
  <p>in DOM</p>\n</body>\n</html>\n```\n\n在图 7.2 中，`document` 代表一个具有一个子节点（即 `<html>`）的根节点。`<html>`\
  \ 元素被称为属于 DOM 的 `document` 元素。`<html>` 元素还有两个子节点，即 `head` 和 `body` 元素。`head` 元素包含一个名为\
  \ `title` 的子节点；同样，在 `body` 元素中，正如所示，不同的元素通过索引以及 `previousSibling`、`nextSibling`\
  \ 关系连接在一起。\n\n这个例子应该已经对如何基于文档为每个网页生成 DOM 树提供了一些基本的理解。文档由 HTML 和 XML 等标记语言组成。当 DOM\
  \ 被操作时，它要么被代码访问以获取值，要么被修改并更新相应的值。对于通过 DOM 进行修改的情况，树会在修改完成后生成一次。当树被重新生成时，它会停止或说冻结网络浏览器与终端用户的交互。一旦生成了新的\
  \ DOM，它就会加载到浏览器中，然后允许用户与树进行交互。\n\nDOM 像 BOM 一样包含不同类型的对象。这些对象属于 XML、HTML、JavaScript\
  \ 或任何用于操作文档的语言。它允许跨浏览器的跨平台兼容性和语言独立性。DOM 与同 JavaScript 提供了一个应用程序编程接口 (API)，将文档内部的对象暴露出来供开发者访问和操作。\n\
  \n## 7.2 BOM、DOM 和 JavaScript 之间的关系\n\n我们已经学会了 BOM 是在特殊对象 `window` 内部创建的，它进一步有一个子对象称为\
  \ `document` 对象。这个特殊的 `document` 对象是由 Web 浏览器引擎从加载的 HTML 或 XML 文档创建的，并在内部包含一个唯一的\
  \ DOM 结构。JavaScript 代码进一步访问这些对象，并允许浏览器以及文档进行动态修改 [[96]](#ref-list.xhtml_refReferences_96)。通过改变\
  \ BOM 和 DOM 的值增强了用户体验和信息传递。BOM 和 DOM 树中的实体几乎都是对象。这些对象通过 JavaScript 代码访问，以便在网页或文档中生成动态行为。文档是一个通用术语，用于标识基于\
  \ HTML 的文档、基于 XML 的文档、网页以及加载到浏览器中供用户使用的其他信息。\n\nBOM 可以被视为访问浏览器窗口及其相关属性的网关，而 DOM\
  \ 可以被视为访问所有属于网页的对象的入口。JavaScript 需要根据需求随时访问 BOM 和 DOM。BOM 重复访问相同属性的频率较低。相反，DOM 被\
  \ JavaScript 频繁使用。DOM 是 JavaScript 的乐场，因为它提供了对文档内部所有对象的访问，这些对象控制着网页的结构。\n\n将所有内容放在上下文中，图\
  \ 7.3 表示了文档中 BOM 和 DOM 的位置。`window` 对象是 BOM 的根对象，我们之前已经学过不需要在任何子节点之前添加 `window`。因此，我们可以直接在引用\
  \ DOM 的代码中使用 `document` 对象。JavaScript 可以通过根对象及其属性轻松地访问 `window` 对象和 `document` 对象相关的实体。\n\
  \n![](img/fig7_3.jpg)\n\n图 7.3 Window 对象和 DOM。\n\n`document` 对象根据网页的设计和使用进一步分支为不同的对象。正如我们在看到的，`document`\
  \ 对象有三个其他对象，即 `link`、`form` 和 `anchor`。`form` 对象进一步拥有其他子节点，如 `radio`、`textarea`、`text`、`checkbox`、`button`\
  \ 等。这些对象也有包含其自身属性的子对象。这是一个高度多变的树结构，因为它会随着每个文档而改变。DOM 的表示取决于加载到浏览器中的文档的结构和类型。\n\n\
  如果 JavaScript 代码需要访问这些对象中的任何一个，可以通过 `document` 对象上的链式点运算符 (`.`) 来。DOM 树中的每个节点都可以追溯到它的父节点。让我们通过接下来的示例来理解这种关系：\n\
  \n```html\n<html>\n<head>\n<script>\n// 当文档加载时运行此函数\nwindow.onload = function ()\
  \ {\n  var str = prompt“输入任何字符串”)\n  // 在 HTML 页面内创建一个 h2 元素\n  const heading2 =\
  \ document.createElement（h2”);\n  const heading2_text = document.createTextNode(str);\n\
  \  heading.appendChild(heading_text2);\n  document.body.appendChild(heading2);\n\
  };\n</script>\n</head>\n<body>\n<h1> This is Static Content</h1>\n<h2>The content\
  \ below is created using JS</h2>\n</body>\n</html>\n```\n\n在这个例子中，你可以观察到 `window.onload`\
  \ 是一个与函数相关的事件监听器。该函数通过 `prompt` 从用户处获取输入并创建一个 `h2` 元素用于显示。这段代码的输出表示在图 7.4 所示的截图。\n\
  \n![](img/fig7_4.jpg)\n\n图 7.4 上述代码的输出。\n\n在接下来的章节中，我们将学习属于 `document` 对象的一些常用属性和方法，这些方法有助于为开发者处理网页时提供更多的灵活性。\n\
  \n## 7.3 理解 DOM 树和节点\n\nDOM 经常被称为 `DOM 树`，其子节点是作为对象的。对于 Web 浏览器解析的每个 HTML 文档，都会生成一个相应的\
  \ DOM 树，包含一个名为 `document` 对象的单个根节点以及随后的子节点。根节点是 HTML 元素的父节点，通常被称为 `document` 元素或`对象`。每个文档只有一个\
  \ `document` 元素。根据所加载网页的复杂度，`document` 可能会产生多个子节点分支 [[97]](#ref-list.xhtml_refReferences_97)。在继续之前，让我们先复习一些\
  \ HTML 术语，然后使用接下来的示例创建一个 DOM 树：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
  <head>\n<title>理解 DOM </title>\n</head>\n<body>\n<h1>This is first example</h1>\n\
  <a id=\"home\" href=\"index.html\">Home</a>\n<!-- 创建带有 id 的 href -->\n</body>\n\
  </html>\n```\n\n对于这个例子，代码中属于不同的标签、属性和其他实体。如果必须将这些内容归类，可以简单如下：\n\n*   *标签*: html,\
  \ head, title, body, h1, a\n*   *属性*: lang, id, href\n*   *属性值*: en, home, index.html\n\
  *   *文本*: 理解 DOM, This is first example, Home\n*   *注释*: 值为‘创建带有 id 的 href’\n* \
  \  *元素*: 开启标签和结束标签之间的所有内容都称为元素。\n\n\n\n\n\n为了可视化从之前的 HTML 文档创建的 DOM 树，我们使用了 [[98]](#ref-list.xhtml_refReferences_98)\
  \ 创建了图 7.5。尝试多制作一些演示树结构以掌握它。\n\n![](img/fig7_5.jpg)\n\n图 7.5 DOM 树表示。\n\nDOM 树中的每个节点都使用节点类型来标识。可以使用\
  \ `nodeName.nodeType` 属性检查节点的类型。它将返回一个无符号短整数，指向 `Node` 属性内部定义的常量。一些节点类型常量及其关联值在表\
  \ 7.1 中。\n\n表 7.1 节点类型常量\n\n| 值 | 常量 | 解释 |\n| --- | --- | --- |\n| 1 | `Node.ELEMENT_NODE`\
  \ | 简单的元素节点，如 <p><h1><div>等。 |\n| 3 | `Node.TEXT_NODE` | 代表元素或属性中存在的*文本* |\n| 4\
  \ | `Node.CDATA_SECTION_NODE` | 代表一个 `CDATASection` |\n| 8 | `Node.COMMENT_NODE`\
  \ | 代表一个*注释*节点 |\n| 9 | `Node.DOCUMENT_NODE` | 代表一个*文档*节点 |\n| 10 | `Node.DOCUMENT_TYPE_NODE`\
  \ | 代表*文档类型节点*，即 <!DOCTYPE html> |\n\n在存在的多个节点值中，在我们的示例中，使用了元素节点、文本节点和注释节点。你可以通过打开浏览器控制台并运行之前的\
  \ HTML 代码来检查这一点。在控制台上输入以下命令。在控制台上使用这些命令的输出通过图 7.6 表示。\n\n![](img/fig7_6.jpg)\n\n\
  图 7.6 使用 *document* 对象的截图\n\n```\ndocument.nodeName\ndocument.querySelector(\"#home\"\
  ).nodeType\ndocument.querySelector(\"h1\").childNodes[0].nodeType\ndocument.querySelector(\"\
  body\").childNodes[4].nodeType\n```\n\n截图（图 7.6）显示了接收到的输出。\n\n在我们的示例中，我们可以观察到 DOM\
  \ 中创建了各种节点，我们可以轻松地将这些节点分为三类：元素节点、文本节点和注释节点。\n\n### 7.3.1 Node 对象的属性\n\n对于每个节点都有许多与其相关的属性，就像之前给出的示例，我们使用了\
  \ `nodeType` 属性 [[99]](#ref-list.xhtml_refReferences_99)。属于 `Node` 对象的其他一些属性解释如下：\n\
  \n*   `baseURI`: 此属性返回一个包含文档基础 URL 的字符串。\n*   `isConnected`: 此属性返回一个布尔值，指定节点是否直接或间接地连接到对象或节点。如果子节点直接连接到\
  \ `document` 对象，则返回 `true`；否则返回 `false`。\n*   `nodeName`: 此属性以字符串格式返回调用节点的名称。\n\
  *   `nodeType`: 此属性返回一个无符号短值，指示节点类型，详见表 7.1。\n*   `firstChild` 和 `lastChild`: 此属性分别返回持有给定调用节点的第一个和最后一个子节点的\
  \ `Node` 对象。\n*   `childNodes`: 此属性返回一个包含属于调用节点的所有子节点的列表。\n*   `parentNode`: 此属性返回调用节点的父级\
  \ `Node` 对象；否则返回 `null`。\n*   `parentElement`: 此属性返回调用对象的父级 `Element` 对象；否则返回 `null`。\n\
  *   `nextSibling` 和 `previousSibling`: 此属性分别返回调用节点的下一个和上一个同兄弟节点。如果不存在此类节点，则返回 `null`。\n\
  *   `textContent`: 此属性用于检索或设置调用节点及其所有后续子节点的文本内容。\n\n### 7.3.2 Node 对象的方法\n\n`node`\
  \ 对象还包含许多方法，有助于访问和处理 DOM 节点。这些方法进一步解释如下：\n\n*   `contains()`: 此方法在检查节点是否为调用节点的子节点后返回一个布尔值作为结果。\n\
  *   `compareDocumentPosition()`: 此方法用于比较一个节点相对于作为参数的另一个节点的位置。此方法返回一个整数值，定义了 Nodes\
  \ 对象内部定义的常量中对应的输出。\n*   `appendChild()`: 此方法用于在调用节点的末尾添加新的子节点。\n*   `getRootNode()`:\
  \ 此方法返回调用对象的根对象。\n*   `insertBefore()`: 此方法用于在调用节点之前插入一个节点。\n*   `cloneNode()`:\
  \ 此方法用于克隆或拷贝节点及其内容。\n*   `isEqualNode()`: 如果两个节点持有相同的内容（包括它们的数据类型），则返回 `true`。否则，返回\
  \ `false`。\n*   `isSameNode()`: 如果两个节点指向同一个对象，即调用节点和传递的节点是同一个，则返回 `true`。如果节点不同，则返回\
  \ `false`。\n*   `removeChild()`: 此方法用于从调用节点中删除子节点。\n*   `replaceChild()`: 此方法用于用传递的替换给定节点。\n\
  \n## 7.4 Document 对象\n\nDOM 树的根是 `document` 对象 [[100]](#ref-list.xhtml_refReferences_100)。该对象提供了访问\
  \ HTML 文档中不同节点的属性和方法。`document` 对象是由浏览器从 `Document` 接口创建的，它继承自 `Node` 接口。`document`\
  \ 对象也可以通过带有 `window` 前缀的构造函数动态创建。属于 `document` 的大多数属性都是只读的。以下章节解释常用的属性和方法。\n\n###\
  \ 7.4.1 Document 属性\n\n`document` 对象包含许多帮助开发者获取主机环境元数据的属性，例如：\n\n*   `body`: 此属性返回\
  \ DOM 的 <body> 节点。如果源文件中不存在 body 标签，则返回 `null`。\n*   `activeElement`: 此属性返回当前激活的元素对象。\n\
  *   `characterSet`: 此属性返回包含文档使用的字符集的字符串。\n*   `children`: 此属性返回一个包含调用文档所有子元素的对象。\n\
  *   `childElementCount`: 此属性返回文档中存在的子元素总数。\n*   `doctype`: 此属性返回一个包含文档类型定义（即文档 DTD）的对象。\n\
  *   `documentElement`: 此属性用于返回文档的直接子节点元素。\n*   `document.URI`: 此属性用于以字符串格式返回文档的位置。\n\
  *   `embeds`: 此属性返回文档中所有嵌入元素 `<embed>` 的列表。\n*   `forms`: 此属性返回文档中所有表单元素 `<form>`\
  \ 的列表。\n*   `head`: 此属性返回 HTML <head> 元素。\n*   `images`: 此属性返回文档中所有图像的列表。\n*   `implementation`:\
  \ 此属性返回当前文档的 DOM 实现。\n*   `links`: 此属性返回文档中所有超链接的列表。\n*   `plugins`: 此属性返回用户 浏览器所有可用插件的列表。\n\
  *   `scripts`: 此属性返回调用文档对象的所有脚本元素 `<script>`。\n\n\n\n\n\n* `visibilityState`: 此属性用于返回一个字符串，告知文档的可见性，可能的值为\
  \ `visible`、`hidden`、`unloaded` 和 `prerender`。\n\n除了这些属性外，`document` 对象还继承自 `HTMLDocument`\
  \ 接口，该接口自 HTML 5 起适用。继承此接口增加了诸如 `cookie`、`designMode`、`dir`、`readyState`、`lastModified`、`defaultView`、`referrer`、`title`、`URL`\
  \ 等属性。\n\n### 7.4.2 对象的方法\n\n属于 document 对象的方法非常有用，在使用 JavaScript 开发网页时会被频繁使用。这些方法提供了如创建节点、修改节点、删除节点和查询节点等操作。在许多方法中，有两个值得特别关注，即\
  \ `querySelector` 和 `querySelectorAll`。`querySelector` 方法用于返回与传入参数匹配的元素或节点，而 `querySelectorAll`\
  \ 返回所有匹配传入参数的元素列表。`document`对象的其他常用方法列表列如下：\n\n* `append()` 和 `prepend()`：这些方法分别用于在调用者文档的末尾和开头插入对象。\n\
  * `adoptNode()`：此方法用于从外部文档采用一个节点。\n* `createAttribute()`：此方法创建一个新的 `Attribute` 对象并返回它。\n\
  * `createComment()`：此方法返回一个新创建的 `Comment` 节点。\n* `createCDATAsection()`：此方法返回一个新创建的\
  \ `CDATA` 节点。\n* `createElement(name)`：此方法返回一个指定名称的新 `element` 节点。\n* `createEvent()`：此方法返回一个新创建的\
  \ `Event` 对象。\n* `createTextNode()`：此方法返回一个新创建的 `Text` 节点。\n* `replaceChildren()`：此方法用作为方法参数的新节点（节点）替换文档的子节点。\n\
  * `querySelector()`：此方法返回文档中符合条件的第一个匹配元素节点。\n* `querySelectorAll()`：此方法返回文档中符合条件的所有元素节点列表。\n\
  \n## 7.5 DOM 中的元素\n\n当一个 HTML 元素是 DOM 中的一个项时，它被称为元素节点。元素元素是一个基类，文档中的每个 `element`\
  \ 对象都从它处继承其功能 [[101]](#ref-list.xhtml_refReferences_101)。每个 `element` 对象都继承自其父类\
  \ `Element`。这些对象代表常见的 HTML 元素，如 `<p></p>`、`<<a></a>`、`<div></div>`、`<head></head>`\
  \ 等。在起始标签和结束标签之间的任何内容都被视为 DOM 中的一个元素。\n\n区分 `node` 和 `element` 往往是混淆的。它们都是 DOM 的实体，但\
  \ `node` 是一个通用术语，指 DOM 内部存在的任何对象，而 `elements` 特指那些关联了数值常量属性 `Node.ELEMENT_NODE`（其值为\
  \ 1）的节点。因此，元素基本上是一种特殊的节点。每个具有 `Node.ELEMENT_NODE = 1` 的元素都是节点，但并不是每个节点都是元素。\n\n\
  `Element` 也派生自 `Node`，因此，你会发现许多重复的属性和方法。然而，为了避免以后产生混淆，再次提供了它们。后续章节将解释属于元素对象的属性和方法。\n\
  \n### 7.5.1 对象的属性\n\n`element` 对象包含许多属性，有助于检索节点的属性、子节点和父节点。常用属性列如下：\n\n* `attributes`：此属性返回一个包含调用者元素关联属性的对象。\n\
  * `id`：此属性返回一个 DOMString，其中包含调用者元素的唯一全局 ID。\n* `localName`：此属性通过 DOMString 返回调用者元素的本地名称。\n\
  * `children`：此属性返回一个只读的 `HTMLCollection` 对象，其中包含属于调用者元素的子元素。\n* `firstElementChild`\
  \ 和 `lastElementChild`：此属性返回属于调用者元素的第一个和最后一个子元素。\n* `childElementCount`：此属性返回调用者元素的子元素数量。\n\
  * `classList`：此属性用于检索调用者元素的 `class` 属性列表。\n* `className`：此属性用于检索或设置调用者元素的 class\
  \ 属性值。\n* `clientHeight`, `clientLeft`, `clientTop` 和 `clientWidth`：这些属性分别返回一个 Number\
  \ 对象，代表元素的内部高度、左边框、上边框和内部宽度。\n* `nextElementSibling` 和 `previousElementSibling`：此属性分别返回调用者元素的下一个和上一个兄弟元素。\n\
  \n### 7.5.2 元素的方法\n\n与 `document` 对象的方法类似，属于 `element` 接口的方法继承自 `Node` 接口。本节简要解释了一些常用的方法。当你再次在这里看到\
  \ `querySelector` 和 `querySelectorAll` 时不要惊讶，它们也属于 `element` 对象。\n\n* `append()`：此方法用于在调用者元素的末尾插入\
  \ `Node` 或 `DOMString` 对象。\n* `addEventListener()`：此方法用于在调用者元素上添加带有事件类型的事件处理器。\n\
  * `animate()`：此方法返回一个动画对象，可以在调用者元素上运行动画。\n* `getAnimations()`：此方法返回调用者元素上当前激活的动画对象的数组。\n\
  * `getAttribute()`：此方法以对象形式返回属于该元素的属性。\n* `hasAttribute()`：此方法用于检查某个属性是否属于该元素。它返回一个布尔值。\n\
  * `setAttribute()`：此方法用于在调用者元素设置指定的属性。\n* `prepend()`：此方法用于在调用者元素的第一个子元素之前添加对象（`node`\
  \ 或 `DOMString`）。\n* `querySelector()`：此方法返回与括号内指定的条件匹配的第一个 `element` 或 `node` 对象。\n\
  * `querySelectorAll()`：此方法返回一个包含所有符合指定条件的对象的 `NodeList` 对象。\n* `remove()`：此方法用于从其父元素中移除元素。\n\
  * `removeAttribute()`：此方法用于移除调用者元素上的命名属性。\n* `replaceChildren()`：此方法用于用作为节点的传入参数替换子节点。\n\
  * `getElementByClassName()`：此方法返回一个 `ClassName` 属性匹配传入字符串的 `element` 对象。\n* `getElementsByTagName()`：此方法返回一个\
  \ `TagName` 属性匹配传入字符串的 `element` 对象。\n* `getElementById()`：此方法返回一个 ID 属性匹配传入字符串的\
  \ `element` 对象。ID 属性是一个区分大小写的字符串值，对于每个元素来说都是唯一的。\n\n下一节将利用这些函数函数来解释如何访问和操作 DOM 结构中的不同元素。\n\
  \n## 7.6 访问 DOM 中的元素\n\n\n\n\n到目前为止，我们对 `document`、`node` 和 `element` 及其属性和方法有了良好的理解。本节旨在详细介绍我们如何访问\
  \ DOM [[94]](#ref-list.xhtml_refReferences_94) 中的 HTML 元素。要继续后续，我们需要具备 CSS 选择器和类\
  \ HTML 语法的基础知识，例如定义 `tags`、`class` 和 `name`。此外，我们将使用来自 DOM 对象的以下方法：`getElementById`、`getElementsByClassName`、`getElementsByClassName`、`querySelector`\
  \ 和 `querySelectorAll`。接下来，请在任何记事本编辑器中输入此代码，并将文件保存为 `anyName.html`。代码如例所示：\n\n```html\n\
  <!DOCTYPE html>\n<html lang = “en”>\n<head>\n<meta charset = “utf-8”>\n<meta name\
  \ = “viewport” content = “width = device-width, initial-scale = 1.0”>\n<title>Accessing\
  \ Elements in the DOM </title>\n<style>\nhtml {\nfont-family: sans-serif;\ncolor:\
  \ #333;\n}\nbody {\nmax-width: 500px;\nmargin: 0 auto;\npadding: 0 15px;\n}\ndiv,\
  \ article {\npadding: 10px;\nmargin: 5px;\nborder: 1px solid #dedede;\n}\n</style>\n\
  </head>\n<body\n<h1>Accessing Elements in the DOM </h1>\n<h2>ID (#demo)</h2>\n<div\
  \ id = “demo”>Access me by ID </div>\n<h2>Class (.demo)</h2> <iv class = “demo”>Access\
  \ me by class (1)</div>\n<div class = “demo”>Access me by class (2)</div>\n<h2>Tag\
  \ (article)</h2>\n<article>Access me by tag (1)</article>\n<article>Access me by\
  \ tag (2)</article>\n<h2>Query Selector </h2>\n<div id = “demo-query”>Access me\
  \ by query </div>\n<h2>Query Selector All </h2>\n<div class = “demo-query-all”>Access\
  \ me by query all (1)</div>\n<div class = “demo-query-all”>Access me by query all\
  \ (2)</div>\n</body>\n</html>\n```\n\n现在用 Chrome 网页浏览器打开此 `anyName.html` 文件，并打开浏览器的控制台。现在尝试以下命令并观察变化：\n\
  \n```javascript\n//Finding element using ID\nconst demoId = document.getElementById('demo');\n\
  console.log(demoId);\ndemoId.style.border = '5px solid purple';\n\n//observe purple\
  \ border\n//Finding element using Class Name\nconst demoClass = document.getElementsByClassName('demo');\n\
  console.log(demoClass);\n//observe collection of objects\ndemoClass[0].style.border\
  \ = '5px solid orange';\ndemoClass[1].style.border = '5px solid red’;\n\n//Finding\
  \ element using TAG\nconst demoTag = document.getElementsByTagName('article');\n\
  console.log(demoTag); //observe collection of objects\ndemoTag[0].style.border =\
  \ '5px solid blue';\ndemoTag[1].style.border = '5px solid black’;\n\n//Finding element\
  \ using querySelector (Single Element)\nconst demoQuery = document.querySelector('#demo-query');\n\
  //will only return first one to match\ndemoQuery.style.border = '5px solid orange';\n\
  \n//Finding element using querySelector (Collection)\nconst demoQueryAll = document.querySelectorAll('.demo-query-all');\n\
  demoQueryAll.forEach(query =>{\nquery.style.border = '1px solid green';\n}); //using\
  \ forEach and callback function\n```\n\n## 7.7 使用 DOM 进行事件处理\n\n我们现在已经看到了 DOM 提供的大部分属性和方法，以及如何使用它们来改变网页的外观。如果网站内部没有活跃的响应机制，目前为止的工作将毫无意义，例如在点击网页时更改网页颜色、提供可以实时计算的交互式滑块、悬停事件、页面加载时自动播放音乐等。对于我们目前所学的内容，大部分操作可以手动完成，但现在我们将理解如何根据某些事件（如鼠标点击、按键按下或鼠标在网页上滚动）来实现这一切。\n\
  \n事件是浏览器中自动发生或通过用户触发的某些动作，例如网页加载、按钮点击、表单提交、手动按键、鼠标点击等。处理这些事件的机制被称为 `event handling`。JavaScript\
  \ 提供了 `event handlers`（事件处理器）和 `event listeners`（事件监听器）来协助执行事件处理机制 [[102]](#ref-list.xhtml_refReferences_102)。`事件处理器`是在事件发生时启动的函数。`事件监听器`为元素附加一个响应式接口，允许该特定元素等待并`监听`给定事件的触发。\n\
  \n`document` 对象包含了与事件处理器相关的属性和方法，如动画、拖放、剪贴板、全屏、加载和卸载、键盘、指针、选择、过渡和触摸。该语言提供的事件处理器列表非常详尽，但它们的工作原理是相同的。让我们先看一些常见的\
  \ HTML 事件，然后看几个简单的示例来观察它们的运行。在本章结束时，你将看到一个专门的练习供你进行实践事件处理。\n\n## 7.8 练习\n\n### 7.8.1\
