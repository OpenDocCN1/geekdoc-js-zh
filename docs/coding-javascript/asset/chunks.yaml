    \ 33, 44, 55];\nconsole.log(tomsArray[0]); // prints 11\n```\n\nIn this example,\
    \ if we want to get the value of 33 we need to pass in the value 2 to the array.\
    \ This can cause bugs in your code so make sure you understand this. Otherwise,\
