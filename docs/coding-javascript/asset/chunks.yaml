  trans: "\n普通文本 当我们运行这段代码时，会看到这个。![](img/image-4c1lfvpn.png) JavaScript 弹窗消息 点击确定后，你会看到这个。![](img/image-gnuv96fx.png)\
    \ HTML 截图\n\n## 语句\n\n语句是 JavaScript 的基本指令。我们可以创建一些变量，然后为它们赋值。\n\n```\nlet a,\
    \ b, c;  // 创建三个变量的语句\na = 2;     // 将值 2 赋给变量 a 的语句\nb = 3;     // 将值 3 赋给变量\
    \ b 的语句\nc = a + b;   // 将 a 加 b 的结果赋给 c 的语句\n```\n\n分号位于语句末尾。不过，我们也可以将多个语句写在一起。\n\
    \n```\na = 2; b = 3;\n```\n\n这样可读性较差，因此大多数程序员不推荐这样做。所以，能做的事情并不代表你应该去做。\n\n## 函数\n\
    \n当我们想要执行某个任务时，可以创建一个函数。如果需要将两个数相加，我们既可以在代码中直接实现，也可以创建一个函数。\n\n```\n// 两数相加\n\
    num3 = num1 + num2;\n// 两数相加的函数\nfunction sumTwoNumbers(num1, num2) {\n  return\
    \ num1 + num2;\n}\n```\n\n在这个例子中，我们执行了相同的代码，一个在函数内，一个不在函数内。使用函数是有价值的。我们可以重复调用它。此外，我们还可以轻松地添加一些错误检查。\n\
    \n```\n// 两数相加的函数\nfunction sumTwoNumbers(num1, num2) {\n  return num1 + num2;\n\
    }\nlet sum = sumTwoNumbers(6,4);\n```\n\n如果你想调用函数，可以像这个例子一样操作。这里我们传入了两个数字。这些数字也可以用变量来替代。\n\
    \n最后，我们简单探讨了为什么要使用 JavaScript。然后我们开始编写代码。通过使用语句和函数，我们开始了解其内部机制。自己试试吧！你不会后悔的。8\
    \ 看，我发现了 JavaScript 变量和值的这些惊人好处 ![](img/image-v1u8nzyh.jpg)9 首先，最简单的 JavaScript\
    \ 函数基础是最吸引人的 ![](img/image-s1jmvrty.jpg)\n\n照片由 Stanley Dai 拍摄于 Unsplash\n\n函数是核心所在，所有工作都在这里完成。我们需要计算地板的面积吗？这需要用到函数。\n\
    \n```\nfunction calculateFlooring(length, width) {\n  return length * width;\n\
    }\n```\n\n如果我们改造厨房，这个函数将计算所需的地板材料。那么，我们为什么需要函数呢？\n\n## 好处\n\n将函数视为代码的容器。类似于代码块，但我们可以重复调用这个函数。这有助于实现代码复用。\n\
    \n在前面的例子中，你可以复制语句。当然，如果我们想修改它，就需要找到那段代码并修改所有出现的地方。\n\n## 示例\n\n在第一个函数示例中，我们计算了地板材料。让我们退一步，让它更简单。我们可以在屏幕上打印一些内容。\n\
    \n```\nfunction greetTom() {\n  alert(\"Hello Tom!\");\n}\n```\n\n当然，你可以把我的名字换成你的名字。如果你想保持传统，可以把它换成“Hello\
    \ World”。你是否好奇为什么这是传统？请看下文。\n\n## 调用\n\n代码看起来不错，但如果不调用它，什么也不会发生。如何调用呢？很高兴你问这个问题。这里有一个例子。\n\
    \n```\nfunction greetTom() {\n  alert(\"Hello Tom!\");\n}\ngreetTom();\n// 做其他事情...\n\
    ```\n\n这个调用很简单，因为它不需要参数。在我们的第一个函数中，我们需要两个参数。接下来试试这个。\n\n## 传递参数\n\n在第一个例子中，我们从一个计算地板材料的函数开始。它需要两个参数。\n\
    \n```\nfunction calculateFlooring(length, width) {\n  return length * width;\n\
    }\ncalculateFlooring(12,10);\n```\n\n我们可以传入两个数字来获取所需的地板材料。在这个例子中，我们硬编码了值。你通常不会这样做，甚至永远不会。\n\
    \n```\nfunction calculateFlooring(length, width) {\n  return length * width;\n\
    }\ncalculateFlooring(length,width);\n```\n\n如你所见，这里两个参数是变量。变量名与函数参数名相同，但并非必须如此。\n\
    \n## 返回数据\n\n返回计算结果很有用。如果不返回，函数的作用就会大打折扣。我们只需要使用 `return`。我们在计算地板材料的函数中已经这样做了。不过，我们需要赋值或打印它。\n\
    \n```\nfunction calculateFlooring(length, width) {\n  return length * width;\n\
    }\nlet totalFlooring = 0;\ntotalFlooring = calculateFlooring(length,width);\n\
    ```\n\n现在，我们可以在应用程序的后续部分使用这个值。前面的例子没有使用返回的值。如果你以后不需要它，这始终是一个选项。\n\n函数可以为我们做很多事情。它们为我们的代码提供了容器。然后我们可以调用它们并传递参数。除此之外，它们还可以返回数据。如果你需要更多信息，这里有一些进一步的资料。10\
    \ 用这些简单的 JavaScript 条件语句避免痛苦的错误 ![](img/image-dviabf1w.jpg)\n\n照片由 Artur Aldyrkhanov\
    \ 拍摄于 Unsplash\n\n应用程序帮助我们做出决策。一个基本的决策是 `if` 条件。例如，如果披萨外卖员到了，就开门。JavaScript 和其他语言一样，有许多条件语句，比如：\n\
    \n## if\n\n`if` 语句以一个条件开始。如果条件为真，则执行后面的语句。\n\n```\nif(pizzaArrives) {\n  openTheDoor();\n\
    }\n```\n\n所以，如果 `pizzaArrives` 为真，我们就调用函数 `openTheDoor`。我在 `if` 语句后面添加了大括号。这是可选的，但有助于提高可读性。省略大括号可能会导致你遗漏\
    \ bug。所以请务必加上！\n\n## if/else\n\n有时你有两种不同的行动方案。我们可以将 `else` 语句与 `if` 一起使用。假设你在烹饪汉堡。\n\
    \n```\nif(sideCooked) {\n  flipBurger();\n} else {\n  keepCooking();\n}\n```\n\
    \n这个检查可以在你最喜欢的汉堡店运行烹饪机器人。不过，它可能还需要一些代码。\n\n如果你需要检查两个条件，也可以使用 `if else if`。\n\n\
    ```\nif(sideCooked) {\n  flipBurger();\n} else if(otherSideCooked) {\n  removeFromGrill();\n\
    } else {\n  keepCooking();\n}\n```\n\n这让我们可以检查额外的值。如果你需要更多检查，`switch` 语句可能更合适。稍后会详细介绍。\n\
    \n## 条件运算符\n\n用于 `if` 语句的运算符必须解析为 `true` 或 `false`。这里有很多选项供你使用。根据经验，你需要测试并找到正确的那个。\n\
    \n```\nif(9>5) { alert(\"Greater than\"); }// 大于\nif(5<8) { alert(\"Less than\"\
    ); } // 小于\nif(9>=6) { alert(\"Greater than equal to\"); } // 大于等于\nif(4<=6) {\
    \ alert(\"Less than equal to\"); } // 小于等于\nif(4!=6) { alert(\"Not equal to\"\
    ); } // 不等于\n```\n\n还有两个逻辑运算符：逻辑与（`&&`）和逻辑或（`||`）。它们经常被使用，但不要被吓到。\n\n```\nconst\
    \ value1 = 4;\nconst value2= -3;\nconsole.log(value1 > 0 && value2 > 0); // 预期输出：false\n\
    console.log(value1 > 0 || value2 > 0); // 预期输出：true\n```\n\n逻辑与要求两个值都为真才能解析为真。逻辑或只需要一个为真。\n\
    \n## switch\n\n`switch` 语句计算表达式以确定执行哪个语句。然后它运行代码，直到遇到 `break` 语句。下面是一个例子，告诉我们你想要鞋子的价格。\n\
    \n```\nconst shoes = 'Reebok';\nswitch (shoes) {\n  case 'Nike':\n   console.log('Nike\
    \ shoes are $200.');\n   break;\n  case 'Adidas':\n  case 'Reebok':\n   console.log('Adidas\
    \ and Reebok are $100 a pair.');\n   // 预期输出：\"Adidas and Reebok are $100 a pair.\"\
    \n   break;\n  default:\n   console.log(`Sorry, we don't carry ${shoes}.`);\n\
    }\n```\n\n这段代码应该在控制台输出“Adidas and Reebok are $100 a pair.”。如果不添加 `break` 语句，`switch`\
    \ 语句可能会变得棘手。\n\n```\nconst shoes = 'Nike';\nswitch (shoes) {\n  case 'Nike':\n\
    \   console.log('Nike shoes are $200.');\n  case 'Adidas':\n  case 'Reebok':\n\
    \   console.log('Adidas and Reebok are $100 a pair.');\n   break;\n  default:\n\
    \   console.log(`Sorry, we don't carry ${shoes}.`);\n}\n```\n\n在这个例子中，我们从 Nike\
    \ 语句中移除了 `break`。你知道会发生什么吗？它会输出“Nike shoes are $200.”，然后输出“Adidas and Reebok are\
    \ $100 a pair.”。这种类型的 bug 对于初学者来说很常见。不要感到难过。你现在也是俱乐部的一员了！\n\n条件语句是 JavaScript\
    \ 的基础。与其他语言类似，它允许我们快速提供解决方案。`if/else` 和 `switch` 很容易使用。11 JavaScript 有巨大的循环，会让你大开眼界\
    \ ![](img/image-flo62x5w.jpg)\n\n照片由 Kier in Sight Archives 拍摄于 Unsplash\n\n小时候，我们在农场种了一排防风林。一排树每周需要浇水几次。打开水管，给第一棵树浇水，数到十。然后移到第二棵树，重复操作。\n\
    \n与生活类似，我们的计算机程序也需要重复执行某些操作。这就是循环的用武之地。`for` 循环非常常见，所以我们从它开始。\n\n## for\n\n如果我们有一个书籍数组，想要打印出来。我们可以使用以下循环。\n\
    \n```\nfor (let i = 0; i < books.length; i++) {\n  text += books[i] + \"\n```\n\
    \n"
- fmt: "\n# Loops\n\nThe for loop has three basic parts. Start, Condition, and Step.\n\
    \n### start\n\nThis is the part where we set up the loop variable. In our example\
    \ that is Usually, we initialize to zero. Although, you can set it to say 10 and\
    \ then count down too.\n\n### condition\n\nNext is the condition where check to\
    \ see if we need to run this loop again. Our example checks if we still have more\
    \ books to loop through. If we are done we stop.\n\n### step\n\nThe last part\
    \ is the step. This tells us what happens after each iteration. Our example uses\
    \ the increment operator (`++`). This is the normal step but we can do other things\
    \ for special cases.\n\n## while\n\nIf my dog Baxter wants to eat I want to create\
    \ a loop that feeds him while he is hungry. The while loop can do this. Here is\
    \ an example.\n\n```\nlet baxterHungry = true;\nwhile (baxterHungry) {\n  console.log(feedBaxter);\n\
    \  checKBaxter();\n}\n```\n\nWe set the variable to true. Then we feed the dog\
    \ until it becomes false. The while loop evaluates the condition we give it. It\
    \ needs to resolve to be true or false. If it is true the code inside the loop\
    \ executes. We evaluate the condition again. Once the condition becomes false\
    \ the loop stops.\n\n## do-while\n\nThe for and while loops check the condition\
    \ then run the code statements. The do-while is different in that it runs the\
    \ code and then checks your condition. It is less common but useful in special\
    \ situations.\n\n```\nlet donutsEaten = 0;\ndo {\n  console.log(\"Donuts eaten\
    \ \" + donutsEaten);\n  donutsEaten++;\n} while (donutsEaten < 5)\nconsole.log(\"\
    I'm full of Donuts!\");\n```\n\nThe do while runs until the condition is false—Opposite\
    \ of the two other types of loops we have discussed. The output would look like\
    \ this.\n\n```\nDonuts eaten 0\nDonuts eaten 1\nDonuts eaten 2\nDonuts eaten 3\n\
    Donuts eaten 4\nI'm full of Donuts!\n```\n\nWhen you need to loop through code\
    \ JavaScript has a few options for you. Like other programming languages, it has\
    \ the for, while, and do-while loops. Just make sure it fits your needs.\n\n#\
    \ 12 Surprisingly Improved JavaScript Variable Scope You Need\n\n![](image-2m0vonq6.jpg)\n\
    \nPhoto by Markus Spiske on Unsplash\n\nMy wife changes topics quickly. I joke\
    \ with her that she needs turn signals. That way I can keep up with the shifting\
    \ focus. She is talking about dinner, and then we shift to our next vacation.\n\
    \n## Scope\n\nOur code has a similar concept with scope. Variables can come in\
    \ and out of scope quickly. As developers, we must keep this concept front and\
    \ center. In they have a few different types of scope. We can use them accordingly.\
    \ If you have done other coding you have encountered similar concepts.\n\n###\
    \ Global\n\nGlobal scope items are visible everywhere. In our example, we create\
    \ a visible variable in the function and outside.\n\n```\nlet myGlobalVariable\
    \ = \"TheBigGlobalVariable\";\nfunction logOutGlobalVariable() {\n  console.log(myGlobalVariable);\n\
    }\nlogOutGlobalVariable();\n```\n\nI bet you are wondering, what if I add a variable\
    \ in the function? This leads us to the local scope example.\n\n### Local\n\n\
    Local variables are visible only in the function. Here is an example to try this\
    \ out.\n\n```\nlet myGlobalVariable = \"TheBigGlobalVariable\";\nfunction logOutGlobalVariable()\
    \ {\n  console.log(myGlobalVariable);\n  let localVariable = \"TheLocalOne\";\n\
    \  console.log(localVariable);\n}\nlogOutGlobalVariable();\nconsole.log(localVariable);\n\
    ```\n\nIf we run this we will get an error on the last line.\n\n```\nconsole.log(localVariable);\n\
    \      ^\nReferenceError: localVariable is not defined\n```\n\nSo you can see\
    \ what happens when you mistakenly place a variable in the wrong spot.\n\n###\
    \ Block\n\nWhere local scope is within the function, block scope is within the\
    \ braces. Sometimes you create braces to identify some code. Let’s take a look\
    \ to show you what I mean.\n\n```\nconsole.log(\"here\");\n{\n  let blockScopeVariable\
    \ = 0;\n  console.log(blockScopeVariable);\n}\n// we can't reference blockScopeVariable\
    \ here\nconsole.log(blockScopeVariable); // won't work\n```\n\nAs you can see\
    \ we create a block scope variable within the braces. Then outside of that, it\
    \ won’t be able to be referenced.\n\n### Gotchas\n\nThe scope can be confusing\
    \ and lead to some errors. As you get more experience with JavaScript, you can\
    \ spot them early on. For instance, if we look at this code snippet:\n\n```\n\
    const colors = ['red', 'blue', 'white'];\nfor (let i = 0, var l = colors.length;\
    \ i < l; i++) {\n  console.log(colors[i]); // 'red', 'blue', 'white'\n}\nconsole.log(l);\
    \ // ???\nconsole.log(i); // ???\n```\n\nThe variables `i` and `l` will get reference\
    \ errors. They are out of scope similar to our previous examples. Dmitri Pavlutin\
    \ explains this more in-depth He also covers a few more common mistakes we may\
    \ make in coding.\n\nJavaScript scope has a few basic principles you need to remember.\
    \ Global scope is visible everywhere. Local and Block scope are more focused.\
    \ Overall you should use the latter and avoid the former. Keep on coding!\n\n\
    # 13 Exploit JavaScript Closures More and Don’t Panic\n\n![](image-7d8g24ts.jpg)\n\
    \nPhoto by Cristina Gottardi on Unsplash\n\nHaving dipped into JavaScript occasionally\
    \ over my development career Closures have been something I didn’t encounter much.\
    \ They have some great value.\n\n## Closures\n\nHow can we define closures? Well,\
    \ this article defines it like this. “Closure in JavaScript is a form of lexical\
    \ scoping used to preserve variables from the outer scope of a function in the\
    \ inner scope of a function.”\n\n```\nfunction outerFunction() {\n  var x = 10;\n\
    \  function innerFunction() {\n    return x;\n  }\n  return innerFunction;\n}\n\
    var inner = outerFunction();\nconsole.log(inner());\n```\n\nHere is an example\
    \ of a closure. The outer function `outerFunction()` creates a variable `x` and\
    \ a function `innerFunction()`. The inner function `innerFunction()` returns the\
    \ value of the variable `x`. The outer function then returns the inner function\
    \ `innerFunction()`. Next inner function `innerFunction()` is then assigned to\
    \ the variable `inner`. When the variable `inner` is called, it returns the value\
    \ of the variable `x`, even though the outer function `outerFunction()` has already\
    \ returned.\n\nIn a moment we can cover lexical scoping. First, let’s understand\
    \ why we need them. Plus some disadvantages too.\n\n### Pros and Cons\n\nClosures\
    \ can help hide the encapsulation details. Like Java’s private variables and functions,\
    \ this allows us to control access. The downside of this is closures take up more\
    \ memory. These items can not be garbage collected. Lastly, it can slow down execution.\
    \ Deepak Mankotia explores this more in-depth.\n\n### Lexical Scoping\n\nThe term\
    \ lexical scoping refers to where the variable is defined. Along with that where\
    \ it can be referenced or not.\n\n```\nlet x = 10\nlet myFunc = function (){\n\
    let y = 20;\n  console.log(\"x and y is accessible (outer):\", x, y);\n  let insideFunc=\
    \ function (){\n    let z = 30;\n    console.log(\"x and y and z is accessible\
    \ (inner):\", x, y, z);\n  }\n  insideFunc();\n  return;\n}\nmyFunc();\nconsole.log(\"\
    only x is accessible (global):\", a);\n```\n\nIn this example, `insideFunc` is\
    \ defined within the `myFunc`. In this case, `myFunc` is its parent. That of the\
    \ parent function lexically binds the child function. JavaScript Closures are\
    \ a form of Lexical Scoping.\n\nJavaScript Closures are powerful tools. They have\
    \ some distinct values. It allows you to encapsulate details but, it can slow\
    \ down your execution time. Consider whether the risks and rewards work for your\
    \ application.\n\nFor more information here is a deep dive on\n\n# IV Advanced\
    \ JavaScript\n\nIn this section, we get into the deep end of the pool. JavaScript\
    \ objects and arrays can trip people up. So we spend time going over each. We\
    \ finish talking about the spread and rest operator.\n\n## 14 Unparalleled JavaScript\
    \ Objects Make You Thrilled\n\n![](image-thml17nq.jpg)\n\nPhoto by Hari Krishnan\
    \ on Unsplash\n\nI used mostly procedural languages in my first few years of software\
    \ development. Mostly PL/SQL was the language I used. Even the object-oriented\
    \ work I did wasn’t harnessing the full strength of the language.\n\nJavaScript\
    \ wasn’t originally object-oriented. It has been modified to become more powerful.\
    \ The changes particularly in ECMAScript 6 were quite large.\n\nToday we use objects\
    \ in JavaScript all the time. As an old Java developer, I see the value that they\
    \ bring. Although, this can be a big change for developers to understand.\n\n\
    ### What are they?\n\nThe JavaScript objects represent real things, such as my\
    \ car from high school. Let’s create it here with some of the properties.\n\n\
    ```\n// Create an object:\nconst car = {\ntype:\"Chevrolet\",\nmodel:\"Malibu\"\
    ,\n  year:\"1976\",\n  color:\"red\"\n  };\n```\n\nJavaScript objects are one\
    \ of the many data types allowed in the language. There are a few others as you\
    \ can see. Although, in your development work you will primarily use primitives\
    \ and objects.\n\n### Objects vs Primitive\n\nIn this they go in-depth on this.\
    \ I just want to point out a few key differences. Objects are mutable and primitive\
    \ types are not. Mutable means they can be changed.\n\n```\n// Create an object:\n\
    const car = {\ntype:\"Chevrolet\",\nmodel:\"Malibu\",\n  year:\"1976\",\n  color:\"\
    red\"\n  };\nlet ball = \"basketball\"; // primitive\n```\n\nAdding to our previous\
    \ example, we have the car object and the ball primitive. The former can be changed\
    \ while the latter cannot be. As an old Java programmer, this is quite familiar.\n\
    \n### Constructor\n\nObjects can be created using a constructor. Continuing with\
    \ the car theme let’s create two car objects so you can see what it looks like.\n\
    \n```\n// Constructor function for Car objects\nfunction Car(make, model, year)\
    \ {\n  this.make = make;\n  this.model = model;\n  this.year = year;\n}\n// Create\
    \ two Car objects\nconst myCar = new Car(\"Ford\", \"Pinto\", \"1971\");\nconst\
    \ yourCar = new Car(\"Dodge\", \"Charger\", \"1977\");\n```\n\nThis works similarly\
    \ to our previous example. We are using the function keyword here to designate\
    \ the constructor. Also, we use the new keyword as well for the object creation.\n\
    \n### Properties\n\nWe created two car objects with lots of values on them. These\
    \ are called properties. If we want to print them out to the log we can do this.\n\
    \n```\nconsole.log(myCar.make);\nconsole.log(myCar.model);\n```\n\nThis is one\
    \ way to access the value. Or you can do it this way as well.\n\n```\nconsole.log(myCar[\"\
    make\"]);\nconsole.log(myCar[\"model\"]);\n```\n\nSo you have options to get at\
    \ the underlying data. In my experience, the former is used more than the latter.\
    \ Your mileage may vary.\n\n### Methods\n\nJavaScript objects have some built-in\
    \ methods. For instance, one is the `keys()` method. This converts the keys to\
    \ an array.\n\n```\n// Initialize an object\nconst car = {\nmake: 'Ford',\nmodel:\
    \ 'Pinto',\nyeear: '1971'\n};\n// Get the keys of the object\nconst keys = Object.keys(car);\n\
    console.log(keys);\n// outputs the following\n[\"make\", \"model\", \"yeear\"\
    ]\n```\n\nThere also is a `values()` method too.\n\n```\n// Initialize an object\n\
    const game = {\n  id: 1,\n  date: `23-March-2025`,\n  teams: 'Panthers vs Jayhawks',\n\
    \  location: 'St. Louis'\n};\n// Get all values of the object\nconst values =\
    \ Object.values(game);\nconsole.log(values);\n// outputs the following\n[1, \"\
    23-March-2025\", \"Panthers vs Jayhawks\", \"St. Louis\"]\n```\n\nThis can be\
    \ helpful along with a loop to iterate through them. There are other methods too.\
    \ This post reviews more built-in methods.\n\n### This\n\nJavaScript has reserved\
    \ `this` as a keyword. It is used to reference the current object. Here is what\
    \ that can look like.\n\n```\n// Create an object:\nconst car = {\n  make: \"\
    Dodge\",\n  model: \"Charger\",\n  year: \"2015\",\n  carDetails : function()\
    \ {\n    return this.make + \" \" + this.model + \" \" + this.year;\n  }\n};\n\
    ```\n\nIn this example, we create an object with three properties. When we want\
    \ to display the details we can call the `carDetails` function. It would display\
    \ “Dodge Charger 2015” in this case. As a keyword, `this` cannot be used as a\
    \ variable name. Also, we can’t change the value that `this` refers to. `this`\
    \ in JavaScript has three contexts: function, class, and global. We have shared\
    \ the function context in these examples. There is more information\n\nJavaScript\
    \ objects are similar to other language objects. However, there are a few differences\
    \ too. It is important to remember that JavaScript didn’t start this way. It continues\
    \ to change and adapt. If you know the basics you can use it well.\n\n## 15 Easily\
