    \ out more at reedsy.com\n\nContents\n- Preface\n- I. HTML\n  - 1. Targeted HTML\
    \ Basics For Reliable People\n  - 2. Important HTML5 Changes that Scream Out for\
    \ Use\n  - 3. Practical HTML Tables, Divs, And Spans Make You Better\n- II. CSS\n\
    \  - 4. The Truth About CSS Will Make You Something\n  - 5. Wondrous CSS Box Model\
    \ Made Instructive\n  - 6. How To Make CSS3 Scream Simplified\n- III. JAVASCRIPT\n\
    \  - 7. JavaScript A Useful Tool For Tired Minds\n  - 8. Look I found these astounding\
    \ benefits of JavaScript variables and values\n  - 9. First easy JavaScript function\
    \ basics that are the most fascinating\n  - 10. Avoid painful mistakes with these\
    \ Simplistic JavaScript Conditionals\n  - 11. JavaScript has Sizable loops that\
    \ will explode your mind\n  - 12. Surprisingly Improved JavaScript Variable Scope\
    \ You Need\n  - 13. Exploit JavaScript Closures More and Don’t Panic\n- IV. ADVANCED\
    \ JAVASCRIPT\n  - 14. Unparalleled JavaScript Objects Make You Thrilled\n  - 15.\
    \ Easily Pluck Better JavaScript Arrays\n  - 16. Quick JavaScript Type Conversion\
    \ and Coercion That Will Make Code Better\n  - 17. Actually, JavaScript Has Surprising\
    \ And Practical Strings\n  - 18. This Is What JavaScript Numbers Opportunities\
    \ Make\n  - 19. It Is Time To Spotlight the JavaScript Arrow Function\n  - 20.\
    \ Valuable JavaScript Strict Equality and Targeted Inequality for the Best Outcome\n\
    \  - 21. The Truth About JavaScript Object Notation is Found\n  - 22. The Peril\
    \ of JavaScript spread and Awesome Rest operator\n- About the Author\n\n# Preface\n\
    \nAs a developer, I thought I knew enough of HTML and CSS. I was wrong. I had\
    \ to come back to the basics again and again. That is why I put this together.\
    \ Plus I feel like JavaScript should be here too.\n\nFirst, we start with some\
    \ basics of HTML. You may have seen some of this before, but I find a review helpful.\
    \ Then we cover some HTML5 changes. We touch on some of the major changes. Then\
    \ we wrap up HTML with a discussion of tables, divs, and spans. These have confused\
    \ me more than once…\n\nThe second section is devoted to CSS. This helps class\
    \ things up a bit. We cover CSS basics, the box model, and CSS3. Similar to HTML5\
    \ it has some interesting updates.\n\nThe third part focuses on JavaScript basics.\
    \ Covering topics like variables, functions, and conditionals. We also cover loops\
    \ and closures too. In this quick start guide, we just focus on what you need\
    \ to start working.\n\n# I. HTML\n\nIn part one, we start with the basics of HTML.\
    \ We review the basics of HTML, HTML5, and divs and spans.\n\n## 1. Targeted HTML\
    \ Basics For Reliable People\n\n![](image-hbcbnko2.jpg)\n\nPhoto by Jackson Sophat\
    \ on Unsplash\n\nThe web is created with some foundational technologies. Every\
    \ website uses HTML or Hypertext Markup Language. It makes the content we consume\
    \ online.\n\n### HTML\n\nIt gives structure to the pages we see. We can add images\
    \ and links to a website with a series of elements and tags. Let’s look at a simple\
    \ example to get started.\n\n```\n<html>\n<head>\n<title>Page Title</title>\n\
    </head>\n<body>\n<h1>Heading</h1>\n<p>Paragraph.</p>\n</body>\n</html>\n```\n\n\
    We start with the `DOCTYPE` to declare this is HTML. Then we have the open tag\
    \ for HTML. As you look at the bottom you see the closing tag for HTML too. The\
    \ body has similar tags to open and close the element.\n\n### Heading\n\nWe have\
    \ a heading in our previous example. HTML Headings can be from `<h1>` to `<h6>`.\
    \ It starts large and gets smaller as the number gets bigger.\n\n# Heading\n\n\
    ## Heading\n\n### Heading\n\n#### Heading\n\n##### Heading\n\n###### Heading\n\
    \nIf we open this in Chrome this is what you will see.\n\n![](image-1yavfvhd.jpg)\n\
    \nHeading Example\n\n### Paragraph\n\nYou can use the HTML paragraphs tag when\
    \ you have a text block. We saw that in our first example. Here is another one.\n\
    \n```\n<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit,</p>\n<p>sed\
    \ do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>\n```\n\n\
    Now these two are nice elements but the reason the web is powerful is links. Let’s\
    \ look at those next.\n\n### Link\n\nThe Hyperlink or link in HTML is the secret\
    \ sauce. We can link to the document source or a reference.\n\n`href=\"https://codeiseasy.co\"\
    >Code Is Easy`\n\nOf course, sometimes we like to see a picture or image on the\
    \ screen. To do this we need the image tag.\n\n### Image\n\nThe image tag helps\
    \ us add visual components along with the text.\n\n`src=\"tom.jpg\" alt=\"Tom\
    \ Headshot\" width=\"100\" height=\"150\">`\n\nI added the width and height but\
    \ these are not required. Although, it can help to keep the sizing correct.\n\n\
    ### Lists\n\nHTML gives us two options for lists. Ordered and unordered lists.\n\
    \n## Ordered List\n\n*   Apples\n*   Berries\n*   Currants\n\n## Unordered List\n\
    \n*   Carrots\n*   Celery\n*   Onions\n\nIt looks like this if you open the file\
    \ in a browser.\n\n![](image-1ydxfxjc.png)\n\nList examples\n\nWe covered some\
    \ basics here for HTML. There is a lot more to learn. Of course, depending on\
    \ your work this may be all you need. My development work has required me to use\
    \ HTML periodically. Although, I am no expert. Play around with these and you\
    \ will learn it well.\n\n## 2. Important HTML5 Changes that Scream Out for Use\n\
    \n![](image-u3dxhfc1.jpg)\n\nPhoto by Jackson Sophat on Unsplash\n\nHTML is like\
    \ everything else. There are different versions we can use. HTML5 is a current\
    \ version that has new features. Let’s go through some of the changes and additions.\n\
    \n### What is different?\n\nWork has been done to remove the overlap between HTML,\
    \ CSS, and JavaScript. Improvements have also been made to increase the readability\
    \ of the code. Cross-browser consistency and responsiveness have been enhanced\
    \ too. Finally, support of multimedia without plugins is another major change.\n\
    \n### New Elements\n\nIn HTML5 there are new elements. The section tag was added\
    \ to help organize the document.\n\n```\n<section>\n<h2>Heading</h2>\n<p>Lorem\
    \ ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt\
    \ ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation\
    \ ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor\
    \ in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.\
    \ Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt\
    \ mollit anim id est laborum.</p>\n</section>\n```\n"
