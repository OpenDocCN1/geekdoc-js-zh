    \ // 3.14159\n```\n\nThe `toPrecision` method will give us the numbers we ask\
    \ for. So if you need to set how many significant digits display this will work\
    \ for you.\n\nThere are a lot of options when working with JavaScript Numbers.\
    \ Although they are a one-size-fits-all approach it works. Test out the limits\
    \ when you work with them.\n\n## 19 It Is Time To Spotlight the JavaScript Arrow\
    \ Function\n\n![](image-gs6nsyaw.jpg)\n\nPhoto by Nick Fewings on Unsplash\n\n\
    Programming requires us to learn as the technology changes. JavaScript is no different.\
    \ It has undergone large changes throughout the years. JavaScript Arrow functions\
    \ are part of a major change that happened in 2015.\n\n### JavaScript Arrow Function\n\
    \nThese are a concise substitute for functional They don’t have the bindings for\
    \ `this`, `super`, etc. Arrow functions can’t be used as constructors either.\n\
    \nArrow Functions are not original to JavaScript. This change was brought in part\
    \ of This was a major change in the language.\n\nJust as an example of what was\
    \ done before arrow functions, this first example is a function expression, unlike\
    \ the function declaration that is second here.\n\n```\n// function expression\n\
    message = function() {\n  return \"A message from Tom\";\n}\n// function declaration\n\
    function functionDeclaration() {\n  // statements\n};\n```\n\nIn ES6 and beyond\
    \ we can do the following.\n\n```\nmessage = () => {\n  return \"A message from\
    \ Tom\";\n}\n```\n\nIf only one statement returns a value, you can do this.\n\n\
    ```\nmessage = () => \"A message from Tom\";\n```\n\nWe can remove the brackets\
    \ and return the statement. That is a short function!\n\n#### Pass Parameter\n\
    \nHere is an example where we pass a parameter to the arrow function.\n\n```\n\
    const yearUntilRetirement = birthYear => {\n  const age = 2024 - birthYear;\n\
    \  const retirement = 65 - age;\n  return retirement;\n}\nconsole.log(yearUntilRetirement(1985));\
    \ // 26\n```\n\nThe argument is the value we pass into the function. In this case,\
    \ it is 1985. Some people use parameters and arguments interchangeably although\
    \ they are slightly different.\n\nTo summarize the three types of functions in\
    \ this example we see them all.\n\n```\n// function expression\nmessage = function()\
    \ {\n  return \"A message from Tom\";\n}\n// function declaration\nfunction functionDeclaration()\
    \ {\n  // statements\n};\n// arrow function\nmessage = () => \"A message from\
    \ Tom\";\n```\n\nWe discussed the arrow function in-depth here. Each of the three\
    \ types of JavaScript functions has its pros and cons. You must weigh them and\
    \ decide what works best for your use case.\n\n## 20 Valuable JavaScript Strict\
    \ Equality and Targeted Inequality for the Best Outcome\n\n![](image-qzftwjos.jpg)\n\
    \nPhoto by Markus Winkler on Unsplash\n\nI have to admit that equality in JavaScript\
    \ can be confusing. I didn’t fully grasp the differences until I took the time\
    \ to review them. Three equal signs look odd to me.\n\nLet’s clear it up for you\
    \ too. First off we can review strict equality. Then move to strict inequality.\
    \ Lastly, we can wrap this up with an example and discussion of strict vs loose.\n\
    \n### Strict Equality\n\nHere are four examples to paint a picture for you. Take\
    \ a close look at example three. That one might confuse you. These four should\
    \ help you see how it works.\n\n```\nconsole.log(1 === 1);\n// Example 1: Expected\
    \ output: true\nconsole.log('hello' === 'hello');\n// Example 2: Expected output:\
    \ true\nconsole.log('1' === 1);\n// Example 3: Expected output: false\nconsole.log(0\
    \ === false);\n// Example 4: Expected output: false\n```\n\nThe first two make\
    \ sense. There’s nothing strange there. The third one you need to look closely.\
    \ The first one is a string and the second one is a number. Therefore, JavaScript\
    \ will declare that false.\n\n### Strict Inequality\n\nAfter looking at the examples\
    \ for equality, these make sense. Like learning opposites in Kindergarten we see\
    \ a pattern. Here are four more examples of code.\n\n```\nconsole.log(1 !== 1);\n\
    // Example 1: Expected output: false\nconsole.log('hello' !== 'hello');\n//Example\
    \ 2: Expected output: false\nconsole.log('1' !== 1);\n//Example 3: Expected output:\
    \ true\nconsole.log(0 !== false);\n//Example 4: Expected output: true\n```\n\n\
    The proof is in the pudding, as developers, we like to see the code. These examples\
    \ show us what is happening. As you begin to use the strict operators test your\
    \ code. Pay attention to the edge cases. You may have some bugs lurking.\n\n###\
    \ Strict vs Loose\n\nFinally, let’s compare strict vs loose. With just three variables\
    \ we can explore some key differences.\n\n```\nconst zero = 0;\nconst zeroObj\
    \ = new String(\"0\");\nconst zeroStr = \"0\";\nconsole.log(zero === zeroObj);\
    \ // false\nconsole.log(zero == zeroObj); // true\nconsole.log(zero === zeroStr);\
    \ // false\nconsole.log(zero == zeroStr); // true\nconsole.log(zeroObj === zeroStr);\
    \ // false\nconsole.log(zeroObj == zeroStr); // true\n```\n\nWe have `zero` as\
    \ a number, a string, and an object. You can see the big differences between the\
    \ two types of equality. For this reason, many developers suggest not to use loose\
    \ equality. It can lead to some difficult bugs to diagnose.\n\nAs you work on\
    \ JavaScript make sure you understand strict and loose equality. If you have questions,\
    \ review this thorough explanation of strict and loose or regular It pays to know\
    \ I have made mistakes here and it is quite helpful.\n\n## 21 The Truth About\
    \ JavaScript Object Notation is Found\n\n![](image-va9zn9vn.jpg)\n\nPhoto by Alina\
    \ Grubnyak on Unsplash\n\nDevelopers are using data in almost everything we do.\
    \ We interact with many types of data, from a database or XML to JSON. JavaScript\
    \ goes well together as that was the intention.\n\n### What is JSON?\n\nAccording\
    \ to they define it like this.\n\nJSON (JavaScript Object Notation) is a lightweight\
    \ data-interchange format. It is easy for humans to read and write. It is easy\
    \ for machines to parse and generate.\n\nWhere XML is more heavyweight and not\
    \ quite human-readable JSON tries to reverse this. Of course, we can let you decide\
    \ that. Here is an example.\n\n```\n'{\"developer\":\"Tom\", \"linesOfCode\":\
    \ 12000, \"repo\":\"accounting\", \"ide\": null}'\n```\n\nThis object has a few\
    \ properties. Developer, lines of code, repo, and ide. The basic structure is\
    \ of keys and values. We could do the following if we want to access these properties\
    \ in JavaScript.\n\n```\nlet developer = obj.developer;\nlet linesOfCode = obj.linesOfCode;\n\
    let repository = obj.repo;\n```\n\nHere we can access the properties in the object\
    \ easily with JavaScript. We have covered the basics let’s compare JSON to XML.\n\
    \n### JSON vs XML\n\nThese two types of data can be used in a lot of spaces. If\
    \ we look at some similar examples we can compare them head to head. We can create\
    \ an array of customers in both.\n\n```\n{\"customers\":[\n  { \"business\":\"\
    ABC Inc.\", \"city\":\"Ducktown\" },\n  { \"business\":\"Delta LTD\", \"city\"\
    :\"Jimmyville\" },\n  { \"business\":\"XYZ Company\", \"city\":\"New Heights\"\
    \ }\n]}\n```\n\n```\n  <business>ABC</business> Inc. <city>Ducktown</city>\n \
    \ <business>Delta</business> LTD <city>Jimmyville</city>\n  <business>XYZ</business>\
    \ Company <city>New</city> Heights\n```\n\nThe tags in XML can make things longer.\
    \ JSON makes things a little shorter too. Most programming languages can handle\
    \ either one with the proper library.\n\n### Uses\n\nJSON is used primarily to\
    \ represent data for calling an API. Many developers prefer it over XML as it\
    \ is lightweight. Also, it is language-independent so you can use it with most\
    \ languages.\n\nHere is an example of calling an API with JSON.\n\n```\n[\n  {\"\
    command\" : \"ServerInfoService.getVersion\"},\n  {\"command\" : \"Examples.echo\"\
    ,\"args\" : {\"echo\" : \"Some text.\"}}\n]\n```\n\nThe service may respond with\
    \ this response.\n\n```\n[ {\n  \"result\" : {\n    \"version\" : \"9.0.9000\"\
    \n  }\n}, {\n  \"result\" : {\n    \"echo\" : \"Some text.\"\n  }\n} ]\n```\n\n\
    Our friends at SmartBear detail this more in-depth This simple example gives you\
    \ a basic understanding of calling an API or web service.\n\nWorking with JavaScript\
    \ you will encounter JSON. This lightweight data format is easy to use. It has\
    \ some distinct advantages over XML. Where at one time AJAX was more common today\
    \ most web applications use JSON instead.\n\n## 22 The Peril of JavaScript spread\
    \ and Awesome Rest operator\n\n![](image-hlmsas3p.jpg)\n\nPhoto by Scott Webb\
    \ on Unsplash\n\nAs a kid, I would take things apart. My wristwatch, a radio,\
    \ anything that I could get my hands on. I am still curious about how things work.\
    \ Although, I try not to break things anymore.\n\nRussian nesting dolls can be\
    \ challenging. Each new one has another inside. JavaScript has something similar.\
    \ The spread operator can help us break apart an array or string.\n\n### Spread\
    \ Operator\n\nThe spread operator in JavaScript is (`...`) and is used to allow\
    \ an array to be expanded into separate elements.\n\n```\nlet numbers = [1,2,3,4,5];\n\
    let maximum = Math.max(...numbers);\nlet minimum = Math.min(...numbers);\nconsole.log(maximum);\
    \ // 5\nconsole.log(minimum); // 1\n```\n\nHere we use it along with the Math\
    \ operators to get the maximum and minimum of the array. This is only one handy\
    \ use of the spread operator.\n\n```\nconst policeSongs = [\"King of Pain\", \"\
    Wrapped Around Your Finger\"];\nconst stingSongs = [\"Fields of Gold\", ...policeSongs,\
    \ \"Desert Rose\"];\nconsole.log(stingSongs); // [\"Fields of Gold\",\"King of\
    \ Pain\", \"Wrapped Around Your Finger\", \"Desert Rose\"]\n```\n\nIf you need\
    \ to mix arrays the spread operator can also do that. This can come in handy as\
    \ you modify and add elements to arrays.\n\n### Rest Operator\n\nThe rest operator\
    \ allows a function to handle different configurations of parameters. It can help\
    \ set up an array or restructure an object.\n\n```\nfunction total(...num) {\n\
    \  let tot = 0;\n  for (const n of numbers) {\n    tot += n;\n  }\n  return tot;\n\
    }\nconsole.log (total(11, 22, 33, 44)); // 110\n```\n\nThis `total` function can\
    \ handle multiple parameters passed to it. The rest operator enables that option.\n\
    \n### Object Destructuring\n\nIf you have an array you might need to unpack the\
    \ parts. To do this you can use object\n\n```\nconst atariGames = ['Pitfall',\
    \ 'Space Invaders', 'E.T.'];\nconst [great, good, awful] = atariGames;\n```\n\n\
    This assigns each one of the three Atari games to an individual object. If necessary\
    \ you can omit one and leave it empty like this.\n\n```\nconst atariGames = ['Pitfall',\
    \ 'Space Invaders', 'E.T.'];\nconst [great, , awful] = atariGames;\n```\n\nIn\
    \ this scenario, we only use the first and last games.\n\nJavaScript gives you\
    \ a lot of tools to handle arrays. The spread and rest operator can do some slicing\
    \ and dicing. Then you can use object destructing to pull things apart. If you\
    \ know your tools you can do about anything you want.\n\n![](image-kcw87uxa.jpg)\n\
