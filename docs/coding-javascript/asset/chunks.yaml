    \ and the correct index. Then you will be able to access any of the elements in\
    \ the array.\n\nSo we have whetted your appetite for JavaScript Arrays. You know\
    \ a little more than when you started. We talked about creating and modifying\
    \ them. Plus we touched on how to access them and don’t forget they are zero-based.\
    \ Happy Coding!\n\n## 16 Quick JavaScript Type Conversion and Coercion That Will\
    \ Make Code Better\n\n![](image-6pqjz2h0.jpg)\n\nPhoto by Austin Distel on Unsplash\n\
    \nAs you work in code you see changes. Some of them require your manual intervention.\
    \ While others the language will handle them for you. Starting with C, C++, then\
    \ Java I saw these subtleties at work.\n\nAs we work with JavaScript we see similar\
    \ changes. The two types we want to discuss here are Type Conversion and Type\
    \ Coercion. They have some similarities. Let’s review them and how they relate\
    \ and differ.\n\n### Type Conversion\n\nThere can be times when we need to convert\
    \ a number to a string and vice versa. Perhaps you need to process input from\
    \ the user or another system. Type conversion in JavaScript is a manual process.\n\
    \n```\nconst inputYear = \"1992\";\nconsole.log(Number(inputYear), inputYear);\
    \ // 1992 \"1992\"\nconsole.log(String(73), 73); // 73 73\nconsole.log(Number(\"\
    Tom\")); // NaN\n```\n\nThese are a few examples that we start with a string.\
    \ Using the `Number` function we can explicitly change it. Likewise, we can use\
    \ the `String` function to convert the number to a string. Note what happens when\
    \ we try to convert my first name to a number.\n\n### Type Coercion\n\nHave you\
    \ ever done something and wondered, “Who did that?” That has happened to me. It’s\
    \ like I have an automatic drive that changes things I didn’t realize.\n\nJavaScript\
    \ has Type Coercion that operates automatically. We have a few examples here to\
    \ share. The first one takes the number 43 and makes it a string.\n\n```\nconsole.log('I\
    \ am ' + 43 + ' years old'); // I am 43 years old\nconsole.log(2 + 3 + 4 + '5');\
    \ // 95\nconsole.log('10' - '4' - '3' - 2 + '5'); // 15\n```\n\nNext, we add a\
    \ few numbers and then a string. Of course, JavaScript says, “I think Tom meant\
    \ that as a number.” Then it changes it for me. Finally, we reverse it by using\
    \ subtraction on strings coerced to numbers.\n\nType coercion can introduce bugs\
    \ if you don’t understand it. This article can help you sort some of that out.\
    \ Try out some examples to see it in action. Type Conversion and Coercion are\
    \ different but useful. Handle with care.\n\n## 17 Actually, JavaScript Has Surprising\
