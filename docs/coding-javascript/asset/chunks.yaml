  trans: "\n\n![](img/image-e8muyp4x.jpg) 汤姆·亨里克森 编写 JavaScript，同时介绍 HTML 和 CSS 版权所有\
    \ © 2024 汤姆·亨里克森 保留所有权利。未经出版商书面许可，不得以任何形式或任何方式（电子、机械、影印、录制、扫描或其他方式）复制、存储或传播本出版物的任何部分。未经许可，复制本书、将其发布到网站或以任何其他方式分发均属违法。第一版\
    \ 本书由 Reedsy 专业排版。了解更多信息，请访问 reedsy.com\n\n目录\n- 前言\n- I. HTML\n  - 1. 面向可靠人士的针对性\
    \ HTML 基础\n  - 2. 值得使用的重大 HTML5 变化\n  - 3. 实用的 HTML 表格、Div 和 Span 让你更出色\n- II.\
    \ CSS\n  - 4. CSS 的真相将让你有所成就\n  - 5. 神奇的 CSS 盒模型讲解\n  - 6. 如何简化 CSS3 的尖叫\n- III.\
    \ JavaScript\n  - 7. JavaScript：疲惫心灵的实用工具\n  - 8. 看，我发现 JavaScript 变量和值的惊人好处\n\
    \  - 9. 最吸引人的简单 JavaScript 函数基础\n  - 10. 用这些简单的 JavaScript 条件语句避免痛苦错误\n  - 11.\
    \ JavaScript 有巨大的循环，将引爆你的思维\n  - 12. 你需要的令人惊讶的改进版 JavaScript 变量作用域\n  - 13. 更多利用\
    \ JavaScript 闭包，不要惊慌\n- IV. 高级 JavaScript\n  - 14. 无与伦比的 JavaScript 对象让你兴奋\n \
    \ - 15. 轻松获取更好的 JavaScript 数组\n  - 16. 快速 JavaScript 类型转换与强制转换，让代码更优\n  - 17.\
    \ 实际上，JavaScript 有令人惊讶且实用的字符串\n  - 18. 这就是 JavaScript 数字机会带来的\n  - 19. 是时候关注 JavaScript\
    \ 箭头函数了\n  - 20. 有价值的 JavaScript 严格相等与针对性不等，获得最佳结果\n  - 21. 发现 JavaScript 对象表示法的真相\n\
    \  - 22. JavaScript 展开运算符的危险与强大的剩余运算符\n- 关于作者\n\n# 前言\n\n作为一名开发者，我曾以为自己足够了解 HTML\
    \ 和 CSS。我错了。我不得不一次又一次地回到基础。这就是我编写本书的原因。此外，我觉得 JavaScript 也应该包含在内。\n\n首先，我们从一些\
    \ HTML 基础开始。你可能之前见过其中一些内容，但我认为复习一下很有帮助。然后我们介绍一些 HTML5 的变化。我们会涉及一些主要变化。最后，我们通过讨论表格、div\
    \ 和 span 来结束 HTML 部分。这些内容曾不止一次让我困惑……\n\n第二部分专门介绍 CSS。这有助于让事情变得更有条理。我们涵盖 CSS 基础、盒模型和\
    \ CSS3。与 HTML5 类似，它也有一些有趣的更新。\n\n第三部分聚焦于 JavaScript 基础。涵盖变量、函数和条件语句等主题。我们还介绍了循环和闭包。在这本快速入门指南中，我们只关注你开始工作所需的内容。\n\
    \n# I. HTML\n\n在第一部分，我们从 HTML 基础开始。我们回顾 HTML、HTML5 以及 div 和 span 的基础知识。\n\n##\
    \ 1. 面向可靠人士的针对性 HTML 基础\n\n![](img/image-hbcbnko2.jpg)\n\n图片由 Jackson Sophat 拍摄于\
    \ Unsplash\n\n网络是由一些基础技术构建的。每个网站都使用 HTML（超文本标记语言）。它构成了我们在线上消费的内容。\n\n### HTML\n\
    \n它为我们看到的页面提供了结构。我们可以通过一系列元素和标签向网站添加图片和链接。让我们看一个简单的例子来开始。\n\n```\n<html>\n<head>\n\
    <title>页面标题</title>\n</head>\n<body>\n<h1>标题</h1>\n<p>段落。</p>\n</body>\n</html>\n\
    ```\n\n我们从`DOCTYPE`开始声明这是 HTML。然后我们有 HTML 的开始标签。在底部，你也会看到 HTML 的结束标签。body 也有类似的开始和结束标签。\n\
    \n### 标题\n\n我们在前面的例子中有一个标题。HTML 标题可以从`<h1>`到`<h6>`。它从大开始，随着数字增大而变小。\n\n# 标题\n\n\
    ## 标题\n\n### 标题\n\n#### 标题\n\n##### 标题\n\n###### 标题\n\n如果在 Chrome 中打开，你会看到如下效果。\n\
    \n![](img/image-1yavfvhd.jpg)\n\n标题示例\n\n### 段落\n\n当你有一段文本时，可以使用 HTML 段落标签。我们在第一个例子中看到了。这里是另一个例子。\n\
    \n```\n<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit,</p>\n<p>sed\
    \ do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>\n```\n\n\
    这两个元素不错，但网络之所以强大，是因为链接。接下来我们看看链接。\n\n### 链接\n\n超链接或链接是 HTML 的秘密武器。我们可以链接到文档源或引用。\n\
    \n`href=\"https://codeiseasy.co\">Code Is Easy`\n\n当然，有时我们喜欢在屏幕上看到图片或图像。为此，我们需要图像标签。\n\
    \n### 图像\n\n图像标签帮助我们添加视觉组件以及文本。\n\n`src=\"tom.jpg\" alt=\"Tom Headshot\" width=\"\
    100\" height=\"150\">`\n\n我添加了宽度和高度，但这些不是必需的。不过，它们有助于保持尺寸正确。\n\n### 列表\n\nHTML\
    \ 为我们提供了两种列表选项：有序列表和无序列表。\n\n## 有序列表\n\n*   苹果\n*   浆果\n*   醋栗\n\n## 无序列表\n\n\
    *   胡萝卜\n*   芹菜\n*   洋葱\n\n如果在浏览器中打开文件，效果如下。\n\n![](img/image-1ydxfxjc.png)\n\n\
    列表示例\n\n我们在这里介绍了一些 HTML 基础。还有很多要学。当然，根据你的工作，这些可能就是你所需要的。我的开发工作让我需要定期使用 HTML。不过，我不是专家。多练习这些，你会学得很好。\n\
    \n## 2. 值得使用的重大 HTML5 变化\n\n![](img/image-u3dxhfc1.jpg)\n\n图片由 Jackson Sophat\
    \ 拍摄于 Unsplash\n\nHTML 和其他事物一样。有不同版本可供使用。HTML5 是当前版本，具有新功能。让我们了解一些变化和新增内容。\n\n\
    ### 有什么不同？\n\n已经做了工作来消除 HTML、CSS 和 JavaScript 之间的重叠。还进行了改进以提高代码的可读性。跨浏览器的一致性和响应性也得到了增强。最后，无需插件即可支持多媒体是另一个重大变化。\n\
    \n### 新元素\n\nHTML5 中有新元素。添加了 section 标签来帮助组织文档。\n\n```\n<section>\n<h2>标题</h2>\n\
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor\
    \ incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud\
    \ exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute\
    \ irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat\
    \ nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa\
    \ qui officia deserunt mollit anim id est laborum.</p>\n</section>\n```\n\n"
- fmt: "\nSimilar to this tag we can also use `header` and `footer` tags. They are\
    \ effectively organizing large chunks of HTML to make them more readable.\n\n\
    ## Form\n\nTo enable easier form creation HTML5 has added a few things. Let’s\
    \ show the `datetime-local` input form element.\n\n```\ntype=\"datetime-local\"\
    >\n```\n\nIf we run this in the browser we see this. ![](image-0j0cuure.png)\n\
    \nDateTime-Local example\n\nThat is nice compared to what we used to have to do\
    \ for something like this.\n\n## Graphics\n\nWe can also add SVG or Scalable Vector\
    \ Graphics in HTML5. Here is a simple example.\n\n```\n<svg width=\"100\" height=\"\
    100\">\n  <circle cx=\"50\" cy=\"50\" r=\"40\" stroke=\"blue\" stroke-width=\"\
    4\" fill=\"red\" />\n</svg>\n```\n\nIf we run that in the browser you will see\
    \ something like this. ![](image-6f7odqn0.png)\n\nSVG example\n\nNot that impressive\
    \ but it could be useful in some situations.\n\n## Offline\n\nHTML5 enables offline\
    \ work by storing local copies. So your browser will download the HTML, CSS, and\
    \ JavaScript needed. This will allow you to work some without an internet connection.\n\
    \nHTML5 is a group of changes that enable better use of the web. From new elements\
    \ and graphics, it helps the web take a step forward. Along with this, it makes\
    \ the web more accessible. It is giving more and more people the ability to collaborate.\n\
    \n# Practical HTML Tables, Divs, And Spans Make You Better\n\n![](image-u5ksl76f.jpg)\n\
    \nPhoto by Alvin Engler on Unsplash\n\nAs I have worked with front-end technologies\
    \ I see the approved way of working change. Web design norms come and go. HTML\
    \ enables us various ways to create an interface.\n\n## Table\n\nThe HTML `table`\
    \ is often derided but it can work. Early in my career tables were the way to\
    \ go. Here is an example we can show the basic syntax.\n\n```\n<html>\n| Company\
    \ | State | Employees |\n| Balloons Inc. | Ohio | 250 |\n| Cement Co. | Arizona\
    \ | 4510 |\n```\n\nRunning this code gives us a simple table to display our data.\
    \ Plan to not be amazed! ![](image-mtpihi5u.jpg)\n\nHTML Table Example\n\nThis\
    \ simple example gives you an idea of how to use tables. There is a lot more we\
    \ can do with them depending on your requirements.\n\n## Div\n\nThe `div` element\
    \ is short for division. It creates a block-level section of HTML. We can style\
    \ the `div` with CSS and manipulate it with JavaScript.\n\n```\n<html>\n<h1>Let's\
    \ talk about div elements!</h1>\n<div class=\"exampleDiv\">\n  <h2>h2 in a div\
    \ element</h2>\n  <p>Text in a div element.</p>\n</div>\n<p>We have broken out\
    \ of the div.</p>\n```\n\nWe have an example that has the `div` in light blue.\
    \ That way you can see where the `div` starts and stops. ![](image-66x9o3mn.png)\n\
    \nDiv element example\n\nIn the picture, you can see the boundaries of the `div`\
    \ and the rest of the page. If we applied styling it would only be within the\
    \ `div` element.\n\n## Span\n\nA `span` is an inline container we can add to an\
    \ HTML document. Where a `div` is block-level and the `span` is inline. These\
    \ are differences you may want to remember.\n\n```\n<html>\n<h1>HTML Span element</h1>\n\
    <p>The fire truck is <span style=\"color:red;font-weight:bold\">red</span>.</p>\n\
    <p>The tree is <span style=\"color:green;font-weight:bold\">green</span>.</p>\n\
    ```\n\nHere we have two `span` elements used. We apply the styling here to change\
    \ the color and put the font in bold. ![](image-6sjq2645.png)\n\nHTML Span example\n\
    \nWe can see that the code does here. The next time you need a container for your\
    \ HTML you can explore all three. The `table`, `div`, and `span` each have their\
    \ pros and cons. Try out a simple example first to see what fits the bill correctly.\n\
    \n# II CSS\n\nCSS is quite helpful in making websites more appealing. I have overlooked\
    \ this for too long. I review some basics and then cover the box model. Finally,\
    \ we cover CSS3.\n\n## The Truth About CSS Will Make You Something\n\n![](image-sfyyytpa.jpg)\n\
    \nPhoto by Marcus Ganahl on Unsplash\n\nHave you ever seen a website that looked\
    \ weird? Do the fonts need to be corrected? This is when the CSS didn’t load.\
    \ It essentially makes the web look nice. I am not a font person but I understand\
    \ the need for style.\n\n### CSS\n\nCSS or Cascading Style Sheets apply the styling\
    \ to websites. From text size and fonts, it can bring a touch of class to things.\n\
    \n```\n<html>\n<head>\n<style>\nbody {background-color: powderblue;}\nh1   {color:\
    \ blue; text-align: center;}\np    {font-family: verdana; font-size: 20px;}\n\
    </style>\n</head>\n<body>\n<h1>H1 Heading(with center align)</h1>\n<p>Paragraph(font\
    \ size 20px and font verdana.</p>\n</body>\n</html>\n```\n\nHere is a simple HTML\
    \ file with styling added. In this, we apply a background color to the body of\
    \ the HTML. Then to the `h1` heading we change the color and center the text.\
    \ For the paragraph, we change the font and size. It looks like this. ![](image-b4ninz0r.png)\n\
    \nHTML with Internal CSS Example\n\nWhile HTML was just meant for text CSS was\
    \ created to add style. If you are old enough to remember the initial web you\
    \ are thankful! Things have come a long way.\n\n### Ways to Include\n\nWe showed\
    \ you an example of an internal CSS above. The `style` tag is added in the HTML.\
    \ We could also create an external document to put our CSS in.\n\n```\n<html>\n\
    <head>\n<link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<h1>We\
    \ are using a CSS from another file.</h1>\n<p>Aren't you impressed!</p>\n</body>\n\
    </html>\n```\n\nThis is our HTML file. Next, we can show you the code for the\
    \ external CSS file.\n\n```\nbody {\n  background-color: lightblue;\n}\nh1 {\n\
    \  color: navy;\n  margin-left: 20px;\n}\n```\n\nThis works nicely as you can\
    \ see below. ![](image-mpdbacfi.png)\n\nHTML with External CSS Example\n\nWith\
    \ this example, you have two files. In a small example like this, it seems like\
    \ overload. This is quite helpful in larger pages or if you have multiple pages.\
    \ Then you can create one CSS file and include it in other HTML documents.\n\n\
    The last type is inline. See how the styling is in line here:\n\n```\n<html>\n\
    <body>\n<h1 style=\"color:rgb(149, 0, 255);font-size:46px;\">I'm a big, purple,\
    \ <strong>Proud</strong> <strong>UNI Panther</strong>!</h1>\n</body>\n</html>\n\
    ```\n\nThis is mixing the CSS and HTML. For a beginner, this could be not very\
    \ clear. Here is what it looks like. ![](image-gkuef1dy.png)\n\nHTML with Inline\
    \ CSS Example\n\nSo when you add CSS to your HTML you have options on how to do\
    \ it. As we discussed each way has its pros and cons. Depending on the size of\
    \ your project and the team you are working with.\n\n## Wondrous CSS Box Model\
    \ Made Instructive\n\n![](image-m7ho0i7l.jpg)\n\nPhoto by Kelli McClintock on\
    \ Unsplash\n\nAt first, CSS seemed like a black art for magicians only. Then as\
    \ I began to learn more it began to make sense. The box model is used to describe\
    \ the design and layout of elements.\n\n### CSS Box Model\n\nEach element has\
    \ a box around it. Sometimes you can see it, other times it seems to disappear.\n\
    \n- Content — what is in the box, text, or image\n- Padding — the area around\
    \ the content, is transparent\n- Border — goes around the padding and content\n\
    - Margin — area outside of the border, it is also transparent\n\nHere is an example.\n\
    \n```\n<html>\n<head>\n<style>\ndiv {\n  background-color: lightgrey;\n  width:\
    \ 300px;\n  border: 10px solid red;\n  padding: 25px;\n  margin: 20px;\n}\n</style>\n\
    </head>\n<body>\n<h2>CSS Box Model</h2>\n<div>A box around each component.</div>\n\
    <p>The content.</p>\n<p>25px padding</p>\n<p>20px margin</p>\n<p>10px red border.</p>\n\
    </body>\n</html>\n```\n\nIt looks like this. ![](image-gtb9ox8k.png)\n\nCSS Box\
    \ Model Example\n\n### Size Math\n\nTo make the box the correct size we need to\
    \ do some math. I know you weren’t expecting that. It’s easy so you won’t be confused.\n\
    \n```\n<html>\n<head>\n<style>\ndiv {\n  width: 320px;\n  padding: 10px;\n  border:\
    \ 5px solid gray;\n  margin: 0;\n}\n</style>\n</head>\n<body>\n<h2>CSS Box Model\
    \ Math</h2>\n<div>The total width of this element is 350px.</div>\n</body>\n</html>\n\
    ```\n"
