    = () => "A message from Tom";       We discussed the arrow function in-depth here.
    Each of the three types of JavaScript functions has its pros and cons. You must
    weigh them and decide what works best for your use case.20 Valuable JavaScript
    Strict Equality and Targeted Inequality for the Best Outcome ![](image-qzftwjos.jpg)     Photo
    by Markus Winkler on Unsplash      I have to admit that equality in JavaScript
    can be confusing. I didn’t fully grasp the differences until I took the time to
    review them. Three equal signs look odd to me.     Let’s clear it up for you too.
    First off we can review strict equality. Then move to strict inequality. Lastly,
    we can wrap this up with an example and discussion of strict vs loose.      Strict
    Equality      Here are four examples to paint a picture for you. Take a close
    look at example three. That one might confuse you. These four should help you
    see how it works.       console.log(1 === 1);     // Example 1: Expected output:
    true     console.log(''hello'' === ''hello'');     // Example 2: Expected output:
    true     console.log(''1'' === 1);     // Example 3: Expected output: false     console.log(0
    === false);     // Example 4: Expected output: false       The first two make
    sense. There’s nothing strange there. The third one you need to look closely.
    The first one is a string and the second one is a number. Therefore, JavaScript
    will declare that false.      Strict Inequality      After looking at the examples
    for equality, these make sense. Like learning opposites in Kindergarten we see
    a pattern. Here are four more examples of code.       console.log(1 !== 1);     //
    Example 1: Expected output: false     console.log(''hello'' !== ''hello'');     //Example
    2: Expected output: false     console.log(''1'' !== 1);     //Example 3: Expected
    output: true     console.log(0 !== false);     //Example 4: Expected output: true       The
    proof is in the pudding, as developers, we like to see the code. These examples
    show us what is happening. As you begin to use the strict operators test your
    code. Pay attention to the edge cases. You may have some bugs lurking.      Strict
    vs Loose      Finally, let’s compare strict vs loose. With just three variables
    we can explore some key differences.       const zero = 0;     const zeroObj =
    new String("0");     const zeroStr = "0";     console.log(zero === zeroObj); //
    false     console.log(zero == zeroObj); // true     console.log(zero === zeroStr);
    // false     console.log(zero == zeroStr); // true     console.log(zeroObj ===
    zeroStr); // false     console.log(zeroObj == zeroStr); // true       We have
    zero as a number, a string, and an object. You can see the big differences between
    the two types of equality. For this reason, many developers suggest not to use
    loose equality. It can lead to some difficult bugs to diagnose.     As you work
    on JavaScript make sure you understand strict and loose equality. If you have
    questions, review this thorough explanation of strict and loose or regular It
    pays to know I have made mistakes here and it is quite helpful.21 The Truth About
    JavaScript Object Notation is Found ![](image-va9zn9vn.jpg)     Photo by Alina
    Grubnyak on Unsplash      Developers are using data in almost everything we do.
    We interact with many types of data, from a database or XML to JSON. JavaScript
    goes well together as that was the intention.      What is JSON?      According
    to they define it like this.      JSON (JavaScript Object Notation) is a lightweight
    data-interchange format. It is easy for humans to read and write. It is easy for
    machines to parse and generate.      Where XML is more heavyweight and not quite
    human-readable JSON tries to reverse this. Of course, we can let you decide that.
    Here is an example.       ''{"developer":"Tom", "linesOfCode": 12000, "repo":"accounting",
    "ide": null}''       This object has a few properties. Developer, lines of code,
    repo, and ide. The basic structure is of keys and values. We could do the following
    if we want to access these properties in JavaScript.       let developer = obj.developer;     let
    linesOfCode = obj.linesOfCode;     let repository = obj.repo;       Here we can
    access the properties in the object easily with JavaScript. We have covered the
    basics let’s compare JSON to XML.      JSON vs XML      These two types of data
    can be used in a lot of spaces. If we look at some similar examples we can compare
    them head to head. We can create an array of customers in both.       {"customers":[     
    { "business":"ABC Inc.", "city":"Ducktown" },      { "business":"Delta LTD", "city":"Jimmyville"
    },      { "business":"XYZ Company", "city":"New Heights" }     ]}       <business>ABC</business>
    Inc. <city>Ducktown</city>       <business>Delta</business> LTD <city>Jimmyville</city>       <business>XYZ</business>
    Company <city>New</city> Heights       The tags in XML can make things longer.
    JSON makes things a little shorter too. Most programming languages can handle
    either one with the proper library.      Uses      JSON is used primarily to represent
    data for calling an API. Many developers prefer it over XML as it is lightweight.
    Also, it is language-independent so you can use it with most languages.     Here
    is an example of calling an API with JSON.       [       {"command" : "ServerInfoService.getVersion"},       {"command"
    : "Examples.echo","args" : {"echo" : "Some text."}}     ]       The service may
    respond with this response.       [ {       "result" : {         "version" : "9.0.9000"       }     },
    {       "result" : {         "echo" : "Some text."       }     } ]       Our friends
    at SmartBear detail this more in-depth This simple example gives you a basic understanding
    of calling an API or web service.     Working with JavaScript you will encounter
    JSON. This lightweight data format is easy to use. It has some distinct advantages
    over XML. Where at one time AJAX was more common today most web applications use
    JSON instead.22 The Peril of JavaScript spread and Awesome Rest operator ![](image-hlmsas3p.jpg)     Photo
    by Scott Webb on Unsplash      As a kid, I would take things apart. My wristwatch,
    a radio, anything that I could get my hands on. I am still curious about how things
    work. Although, I try not to break things anymore.     Russian nesting dolls can
    be challenging. Each new one has another inside. JavaScript has something similar.
    The spread operator can help us break apart an array or string.      Spread Operator      The
    spread operator in JavaScript is (…) and is used to allow an array to be expanded
    into separate elements.       let numbers = [1,2,3,4,5];     let maximum = Math.max(...numbers);     let
    minimum = Math.min(...numbers);     console.log(maximum); // 5     console.log(minimum);
    // 1       Here we use it along with the Math operators to get the maximum and
    minimum of the array. This is only one handy use of the spread operator.       const
    policeSongs = ["King of Pain", "Wrapped Around Your Finger"];     const stingSongs
    = ["Fields of Gold", ...policeSongs, "Desert Rose"];     console.log(stingSongs);
    // ["Fields of Gold","King of Pain", "Wrapped Around Your Finger", "Desert Rose"]       If
    you need to mix arrays the spread operator can also do that. This can come in
    handy as you modify and add elements to arrays.      Rest Operator      The rest
    operator allows a function to handle different configurations of parameters. It
    can help set up an array or restructure an object.       function total(...num)
    {      let tot = 0;      for (const n of numbers) {       tot += n;      }     
    return tot;     }     console.log (total(11, 22, 33, 44)); // 110       This total
    function can handle multiple parameters passed to it. The rest operator enables
    that option.      Object Destructuring      If you have an array you might need
    to unpack the parts. To do this you can use object       const atariGames = [''Pitfall'',
    ''Space Invaders'', ''E.T.''];     const [great, good, awful] = atariGames;       This
    assigns each one of the three Atari games to an individual object. If necessary
    you can omit one and leave it empty like this.       const atariGames = [''Pitfall'',
    ''Space Invaders'', ''E.T.''];     const [great, , awful] = atariGames;       In
    this scenario, we only use the first and last games.     JavaScript gives you
    a lot of tools to handle arrays. The spread and rest operator can do some slicing
    and dicing. Then you can use object destructing to pull things apart. If you know
    your tools you can do about anything you want.![](image-kcw87uxa.jpg) About the
    Author      Tom Henricksen is a problem-solving technology professional. He is
    a speaker and writer at Code is Easy. Starting from a developer he has worked
    as a Project Manager, Technical Lead, Scrum Master, and Manager of Software Development.      Tom
    has helped organizations with agile transformations. He has also coached and trained
    teams and individuals.      Tom has been an entrepreneur as well. He speaks and
    writes with a focus on technology roles. Tom was the founder of the Agile Online
    Summit and DevOps Online Summit where he led a strong online community of over
    5,000 people.      Tom has learned how to solve challenging issues in technology
    and lead technical teams. He can help you develop those skills too! You can connect
    with me on:http://codeiseasy.cohttps://x.com/TomHenricksenhttps://www.linkedin.com/in/tomhenricksen Subscribe
    to my newsletter:https://t.co/NkolrQgXHM'
