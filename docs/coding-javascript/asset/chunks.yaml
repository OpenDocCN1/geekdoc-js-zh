    if. Say you are cooking some hamburgers.       if(sideCooked) {      flipBurger();     }
    else {      keepCooking();     }       This check can run the cooking robot at
    your favorite house of burgers. It might need some more code though.     If you
    need to check two conditions you can have an if else if too.       if(sideCooked)
    {      flipBurger();     } else if(otherSideCooked) {      removeFromGrill();     }
    else {      keepCooking();     }       This gives us the option to check additional
    values. If you need more checks a switch statement may work better. More on that
    later.      Conditional Operators      The operators we use for if statements
    must resolve to true or false. There are quite a few options for you to use here.
    Speaking from experience you need to test things out and get the right one.       if(9>5)
    { alert("Greater than"); }// greater than     if(5<8) { alert("Less than"); }
    // less than     if(9>=6) { alert("Greater than equal to"); } // greater than
    equal to     if(4<=6) { alert("Less than equal to"); } // less than equal to     if(4!=6)
    { alert("Not equal to"); } // not equal to       There are also two logical operators.
    The Logical And(&&) and the Logical Or(||). They are used a lot but don’t be intimidated.       const
    value1 = 4;     const value2= -3;     console.log(value1 > 0 && value2 > 0); //
    Expected output: false     console.log(value1 > 0 || value2 > 0); // Expected
    output: true       The Logical And must have both values true to resolve as true.
    The Logical Or needs one to be true.      switch      Switch statements evaluate
    the expression to determine which statement to execute. Then it runs the code
    until reaching a break statement. Here is an example that tells us the price of
    the shoes you want.       const shoes = ''Reebok'';     switch (shoes) {     
    case ''Nike'':       console.log(''Nike shoes are $200.'');       break;     
    case ''Adidas'':      case ''Reebok'':       console.log(''Adidas and Reebok are
    $100 a pair.'');       // Expected output: "Adidas and Reebok are $100 a pair."       break;     
    default:       console.log(`Sorry, we don''t carry ${shoes}.`);     }       This
    code should print “Adidas and Reebok are $100 a pair.” to the console. Switch
    statements can be tricky if you don’t add the break statement.       const shoes
    = ''Nike'';     switch (shoes) {      case ''Nike'':       console.log(''Nike
    shoes are $200.'');      case ''Adidas'':      case ''Reebok'':       console.log(''Adidas
    and Reebok are $100 a pair.'');       break;      default:       console.log(`Sorry,
    we don''t carry ${shoes}.`);     }       In this example, we removed the break
    from the Nike statement. Do you know what happens here? It will print ‘Nike shoes
    are $200.’ and then ‘Adidas and Reebok are $100 a pair.’ This type of bug is common
    for beginner programmers. Don’t feel bad. You are now part of the club!     Conditionals
    are fundamental to JavaScript. Similar to other languages it allows us to provide
    solutions quickly. The if/else and switch are easy to use.11 JavaScript has Sizable
    loops that will explode your mind ![](image-flo62x5w.jpg)     Photo by Kier in
    Sight Archives on Unsplash      As a kid, we planted a windbreak on our farm.
    A line of trees that needed watering a few times a week. Turn on the hose water
    the first tree and count to ten. Move to the second tree and repeat.     Similar
    to life our computer programs must repeat things. That’s where loops come in handy.
    For loops are quite common so let’s start there.      for      If we have an array
    of books and we would like to print them out. We could use the following loop.       for
