    \ You can confuse yourself\n\n### JavaScript Number\n\nSo we can do things like\
    \ this in JavaScript.\n\n```\nlet num1 = 1.234;  // A number with decimals\nlet\
    \ num2 = 5;   // A number without decimals\n```\n\nWe can use decimals or we can\
    \ use whole numbers.\n\n```\nlet bigNum = 423e6;  // 423000000\nlet smallNum =\
    \ 552e-5; // 0.00552\n```\n\nWhen numbers get large we can use scientific notation\
    \ too. These two show us how we can do that.\n\n#### Number()\n\nWe can create\
