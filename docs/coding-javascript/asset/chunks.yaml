    \nBoth of these examples create a number. We can pass it a string or a number.\n\
    \n```\nNumber(true); // 1\nNumber(false); // 0\nNumber(new Date()); // 1712747922911\n\
    Number(\"sdfs:\"); // NaN\n```\n\nIn these examples, you can see that `true` and\
    \ `false` resolve to numbers. The date is converted to one too. However, the letters\
    \ do not resolve to a number. Therefore, it prints “NaN”. This is for Not a Number,\
    \ the reference guide shares more\n\n#### Precision\n\nJavaScript numbers are\
    \ 64-bit floating-point. This follows the IEEE 754 standard. Integers are accurate\
    \ to 15 places.\n\n```\nlet num = 123456789012345;\n```\n\nThe maximum number\
    \ of decimals is 18.\n\n```\nlet dec = 0.123456789012345678;\n```\n\n#### Methods\n\
    \nThere are quite a few methods that JavaScript has for numbers. I will hit on\
