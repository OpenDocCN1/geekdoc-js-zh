    \nThe `join` method will pull the elements together too similar to `toString`.\n\
    \n```\nconst bread = [\"white\", \"wheat\", \"sourdough\"];\nconsole.log(bread.join('-'));\
    \ // white-wheat-sourdough\n```\n\nThe `push` method we used before can modify\
    \ arrays.\n\n```\nconst fruits = [];\nfruits.push(\"banana\", \"apple\", \"peach\"\
    );\n```\n\nThe `push` method adds the elements at the end of the array. There\
    \ are many more that you can see\n\n#### Zero-based\n\nI don’t want you to miss\
