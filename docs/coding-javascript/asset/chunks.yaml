    \ 'xyz'];\n```\n\nAn array can also have multiple data types. My previous ones\
    \ had similar data types but this one has strings, numbers, and a boolean.\n\n\
    #### Modify\n\nWe can modify arrays with built-in methods. The `toString()` can\
    \ make it a string to print out.\n\n```\nconst bread = [\"white\", \"wheat\",\
