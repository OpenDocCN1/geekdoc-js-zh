    \ HTML Screen-shot\n\n## Statement\n\nThe statement is the basic instruction for\
    \ JavaScript. We can create some variables and then assign them values.\n\n```\n\
    let a, b, c;  // Statement creating three variables\na = 2;     // Statement assign\
    \ the value of 2 to variable a\nb = 3;     // Statement assign the value of 3\
    \ to variable b\nc = a + b;   // Statement assign a plus b to c\n```\n\nThe semicolon\
    \ is at the end of the statement. However, we could put multiple statements together.\n\
    \n```\na = 2; b = 3;\n```\n\nThis isn’t as readable so most programmers prefer\
    \ not to. So just because you can do something doesn’t mean you should.\n\n##\
    \ Functions\n\nWhen we want to perform a task we can create a function. If we\
    \ need to sum two numbers we could do this in code or create a function.\n\n```\n\
    // Add two numbers\nnum3 = num1 + num2;\n// Function to sum two numbers\nfunction\
    \ sumTwoNumbers(num1, num2) {\n  return num1 + num2;\n}\n```\n\nIn this example,\
    \ we perform the same code one in a function and one not. Using a function has\
    \ value. We can call it repeatedly. Also, we could easily add some error checking\
    \ too.\n\n```\n// Function to sum two numbers\nfunction sumTwoNumbers(num1, num2)\
    \ {\n  return num1 + num2;\n}\nlet sum = sumTwoNumbers(6,4);\n```\n\nWe can do\
    \ it like this example if you want to call the function. Here we pass in two numbers.\
    \ These numbers could be replaced with variables as well.\n\nIn closing, we have\
    \ touched on why we would use JavaScript. Then we started to code. Using statements\
    \ and functions we began to see what is under the hood. Try it out for yourself!\
    \ You won’t regret it.8 Look I found these astounding benefits of JavaScript variables\
    \ and values ![](image-v1u8nzyh.jpg)9 First easy JavaScript function basics that\
    \ are the most fascinating ![](image-s1jmvrty.jpg)\n\nPhoto by Stanley Dai on\
    \ Unsplash\n\nFunctions are the powerhouse in This is where the work happens.\
    \ Do we need to calculate the space of a floor? This calls for a function.\n\n\
    ```\nfunction calculateFlooring(length, width) {\n  return length * width;\n}\n\
    ```\n\nThis function will calculate the flooring we need if we remodel the kitchen.\
    \ So why do we need functions?\n\n## Benefits\n\nThink of a function as a container\
    \ for your code. Similar to a code block but, we can call this function repeatedly.\
    \ This will facilitate reusable code.\n\nIn our prior example, you could copy\
    \ the statement. Of course, if we wanted to change that we needed to search for\
    \ that code and change all the occurrences.\n\n## Example\n\nIn our first function\
    \ example, we calculated the flooring. Let’s step back and make it even easier.\
    \ We can print something on the screen.\n\n```\nfunction greetTom() {\n  alert(\"\
    Hello Tom!\");\n}\n```\n\nOf course, you can put your name in place of mine. If\
    \ you want to keep the tradition, you can replace it with “Hello World”. Have\
    \ you wondered why that is the tradition, look\n\n## Calling\n\nThe code may look\
    \ nice but nothing happens if you don’t call it. How do you do that? I am glad\
    \ you asked. Here is an example.\n\n```\nfunction greetTom() {\n  alert(\"Hello\
    \ Tom!\");\n}\ngreetTom();\n// do other things...\n```\n\nThat call is easy as\
    \ it takes no arguments. In our first function, we had two arguments we needed.\
    \ Let’s try that next.\n\n## Passing arguments\n\nIn our first example, we started\
    \ with a function to calculate flooring. It took two arguments.\n\n```\nfunction\
    \ calculateFlooring(length, width) {\n  return length * width;\n}\ncalculateFlooring(12,10);\n\
    ```\n\nWe can pass in the two numbers to get the flooring needed. In this example,\
    \ we hard-code the value. You won’t do that often or ever.\n\n```\nfunction calculateFlooring(length,\
    \ width) {\n  return length * width;\n}\ncalculateFlooring(length,width);\n```\n\
    \nAs you see here, we have the two arguments as variables. The names are the same\
    \ as the function but don’t have to be.\n\n## Returning data\n\nIt is helpful\
    \ when we return the calculation. If we don’t the function is not as useful as\
    \ it could be. We just need to use the `return`. We did this in our calculate\
    \ flooring function. Although we need to assign this or print it out.\n\n```\n\
    function calculateFlooring(length, width) {\n  return length * width;\n}\nlet\
    \ totalFlooring = 0;\ntotalFlooring = calculateFlooring(length,width);\n```\n\n\
    Now we can use this value later in the application. The prior examples didn’t\
    \ use the value returned. This is always an option if you don’t need it later\
    \ on.\n\nFunctions can do a lot for us. They provide us with a container for our\
    \ code. Then we can call them and pass parameters. Along with that, they can return\
    \ the data. If you need more information here is some further10 Avoid painful\
    \ mistakes with these Simplistic JavaScript Conditionals ![](image-dviabf1w.jpg)\n\
    \nPhoto by Artur Aldyrkhanov on Unsplash\n\nApplications help us make decisions.\
    \ A basic decision is an `if` condition. For example, if the pizza delivery driver\
    \ arrives open the door. JavaScript like other languages has many conditionals\
    \ like\n\n## if\n\nAn `if` statement starts with a condition. If it is true the\
    \ statement following will happen.\n\n```\nif(pizzaArrives) {\n  openTheDoor();\n\
    }\n```\n\nSo if `pizzaArrives` is true we call the function `openTheDoor`. I added\
    \ the braces after the `if` statement. This is optional but helps readability.\
    \ Omitting the braces can cause you to miss bugs. So please include them!\n\n\
    ## if/else\n\nThere are times when you have two different courses of action. We\
    \ can add the `else` statement along with the `if`. Say you are cooking some hamburgers.\n\
    \n```\nif(sideCooked) {\n  flipBurger();\n} else {\n  keepCooking();\n}\n```\n\
    \nThis check can run the cooking robot at your favorite house of burgers. It might\
    \ need some more code though.\n\nIf you need to check two conditions you can have\
    \ an `if else if` too.\n\n```\nif(sideCooked) {\n  flipBurger();\n} else if(otherSideCooked)\
    \ {\n  removeFromGrill();\n} else {\n  keepCooking();\n}\n```\n\nThis gives us\
    \ the option to check additional values. If you need more checks a `switch` statement\
    \ may work better. More on that later.\n\n## Conditional Operators\n\nThe operators\
    \ we use for `if` statements must resolve to `true` or `false`. There are quite\
    \ a few options for you to use here. Speaking from experience you need to test\
    \ things out and get the right one.\n\n```\nif(9>5) { alert(\"Greater than\");\
    \ }// greater than\nif(5<8) { alert(\"Less than\"); } // less than\nif(9>=6) {\
    \ alert(\"Greater than equal to\"); } // greater than equal to\nif(4<=6) { alert(\"\
    Less than equal to\"); } // less than equal to\nif(4!=6) { alert(\"Not equal to\"\
    ); } // not equal to\n```\n\nThere are also two logical operators. The Logical\
    \ And (`&&`) and the Logical Or (`||`). They are used a lot but don’t be intimidated.\n\
    \n```\nconst value1 = 4;\nconst value2= -3;\nconsole.log(value1 > 0 && value2\
    \ > 0); // Expected output: false\nconsole.log(value1 > 0 || value2 > 0); // Expected\
    \ output: true\n```\n\nThe Logical And must have both values true to resolve as\
    \ true. The Logical Or needs one to be true.\n\n## switch\n\n`switch` statements\
    \ evaluate the expression to determine which statement to execute. Then it runs\
    \ the code until reaching a `break` statement. Here is an example that tells us\
    \ the price of the shoes you want.\n\n```\nconst shoes = 'Reebok';\nswitch (shoes)\
    \ {\n  case 'Nike':\n   console.log('Nike shoes are $200.');\n   break;\n  case\
    \ 'Adidas':\n  case 'Reebok':\n   console.log('Adidas and Reebok are $100 a pair.');\n\
    \   // Expected output: \"Adidas and Reebok are $100 a pair.\"\n   break;\n  default:\n\
    \   console.log(`Sorry, we don't carry ${shoes}.`);\n}\n```\n\nThis code should\
    \ print “Adidas and Reebok are $100 a pair.” to the console. `switch` statements\
    \ can be tricky if you don’t add the `break` statement.\n\n```\nconst shoes =\
    \ 'Nike';\nswitch (shoes) {\n  case 'Nike':\n   console.log('Nike shoes are $200.');\n\
    \  case 'Adidas':\n  case 'Reebok':\n   console.log('Adidas and Reebok are $100\
    \ a pair.');\n   break;\n  default:\n   console.log(`Sorry, we don't carry ${shoes}.`);\n\
    }\n```\n\nIn this example, we removed the `break` from the Nike statement. Do\
    \ you know what happens here? It will print ‘Nike shoes are $200.’ and then ‘Adidas\
    \ and Reebok are $100 a pair.’ This type of bug is common for beginner programmers.\
    \ Don’t feel bad. You are now part of the club!\n\nConditionals are fundamental\
    \ to JavaScript. Similar to other languages it allows us to provide solutions\
    \ quickly. The `if/else` and `switch` are easy to use.11 JavaScript has Sizable\
    \ loops that will explode your mind ![](image-flo62x5w.jpg)\n\nPhoto by Kier in\
    \ Sight Archives on Unsplash\n\nAs a kid, we planted a windbreak on our farm.\
    \ A line of trees that needed watering a few times a week. Turn on the hose water\
    \ the first tree and count to ten. Move to the second tree and repeat.\n\nSimilar\
    \ to life our computer programs must repeat things. That’s where loops come in\
    \ handy. For loops are quite common so let’s start there.\n\n## for\n\nIf we have\
    \ an array of books and we would like to print them out. We could use the following\
    \ loop.\n\n```\nfor (let i = 0; i < books.length; i++) {\n  text += books[i] +\
    \ \"\n```\n"
