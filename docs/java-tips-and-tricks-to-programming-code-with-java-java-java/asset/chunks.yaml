    The first line will still start with `if` while being followed by the condition.
    The curly brackets are going to divide different parts of the code.


    The second choice is going to go after the `else` with its own curly brackets.


    There are only two choices that you are going to have, either your client is going
    to be younger than 18 or older than 18. Your code will have to match what you
    want to happen.


    ### If … else if


    More than two conditions can be tested at once. If you want to test a certain
    range of ages, you are going to use an `if else if` statement.


    The syntax is going to be:


    ```

    If(condition_one) {


    }


    Else if ( condition_ two ) {


    }


    Else {


    }

    ```


    The newest part of the code is going to be the `else if ( condition_two) { }`.


    When the `if` statement is sent, the next is going to be followed by round brackets.
    The second condition is going to be in between two new brackets but it is not
    going to be caught by the first condition.


    The code is still going to be sectioned off with curly brackets with every `if
    else if` statement that you have each having its own curly brackets. If you miss
    one then you are going to get an error message.


    The conditional operators that you need to use are:


    - Greater than (`>`)

    - Less than (`<`)

    - Greater than or equal to (`>=`)

    - Less than or equal to (`<=`)

    - AND (`&&`)

    - OR (`||`)

    - A value of (`==`)

    - NOT (`!`)


    The two ampersand symbols are going to be used to test for more than one condition
    at the same time.


    #### Example:


    ```

    else if ( client > 18 && client < 40)

    ```


    With this code, you are going to want to have the knowledge need to know the age
    of the `client` and to see if they are older than 18 but younger than 40.


    You are only trying to see what is inside of the variable that the `client` inputs.
    The `client` has to be older than 18 but younger than 40. Your `client` has to
    meet both conditions since the `AND` operator was used.


    ### Nested if


    `if` statements can be nested just like `if else` and `if else if` statements.
    An `if` statement that has been nested is going to be putting one `if` statement
    with another.


    #### Example:


    ```

    if( client < 19) {


    system.out.println ( “ 18 or younger”) ;


    }

    ```


    To check and see if your `client` is over sixteen there has to be another `if`
    statement placed inside of the `if` statement that you have already created.


    The first `if` statement will be where the `client` is going to be caught if they
    are less than 19 and the second one will narrow it down so that they are over
    16. When you want to print a different message, you can use an `if else` statement.


    #### Example:


    ```

    if( client < 20) {


    if( client > 20 && client < 23 ) {


    System.out.println( “You are 21 or 22”) ;


    }


    else {


    System.out.println (“ 22 or younger”) ;


    }


    }

    ```


    The curly brackets that are placed in the code have to be exact or the program
    is not going to be run. Nested `if` statement are tricky to learn, but they can
    be narrowed down.


    ### Boolean values


    Boolean values are only going to be true or false, 1 or 0 or even yes or no. Java
    has a variable that is done for Boolean values:


    ```

    Boolean client = true ;

    ```


    You are not going to need to type `int`, `string`, or `double` you are going to
    need to type `Boolean` by using a lower case b. the name of the variable will
    come after it has been assigned to the value of `true` or `false`.


    The assignment is going to have one equals sign. However, should you evaluate
    the variable and it has a value of something then you are going to need to use
    two equals signs.


    #### Example :


    ```

    Boolean client = true;


    if ( client == true) {


    System.out.println (“it’s true”) ;


    }

    else {


    System.out.println(“it’s false”) ;

    ```


    The `if` statement is going to see if the variable entered by the `client` is
    `true`. The `else` will check to see if it is `false`.


    You are not going to need to say `else if ( client == false)` When something turns
    out to not be true, it is going to obviously be false.


    You are going to use `else` since there are only going to be two choices when
    it comes to Boolean values.


    The other operator that is used for conditions is the `NOT` operator, this is
    used with Boolean values.


    #### Example:


    ```

    Boolean client = true;


    if( !client) {


    System.out.println (“it’s false”) ;


    }


    else {


    System.out.println (“it’s true”) ;


    }

    ```


    This is the same as any other code that is used with a Boolean except for the
    statement `if ( !client) {`.


    The `NOT` operator is going to come before the `client`’s variable. This operator
    will use a single exclamation mark but it will fall before the variable that has
    to be tested.


    The code is going to be tested for negation which means that it is not what it
    actually is.


    Since the `client` variable has been set to `true`, the `!client` will end up
    testing for `false` values.


    If the condition is set to `false`, then the `NOT` operator will test for values
    that are `true`.


    ### Conclusion


    Thank you again for downloading this book!


    I hope this book was able to help you to gain more knowledge on the Java programming
    language and use it to apply to your programming requirements.


    The next step is to continue programming as you learn more topics for your Java
    programming skillset.


    Finally, if this book has given you value and helped you in any way, then I’d
    like to ask you for a favor, if you would be kind enough to leave a review for
    this book on Amazon? It’d be greatly appreciated!


    Thank you and good luck!


