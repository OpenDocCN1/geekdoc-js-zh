    # SharePoint Services on the Internet that Use a Java Client


    For this chapter you are going to learn CRUD operations for SharePoint documents
    that use a Java client. It is going to focus on the web services that are going
    to be found in the copy and list services that you can use with Microsoft.


    CRUD services can also be used with CAML which stands for Collaborative Application
    Markup Language. It is based on XML that is going to utilize the different methods
    that are going to be used with copy and lists.


    On top of that you are going to be able to construct a CAML structure that is
    going to be able to pass through the different conditions that are going to be
    set for the properties that are assigned to the objects in the code.


    ## Background


    In the event that you are working with a large amount of data that may be in different
    forms, you are going to be able to look at that data in a compounded file so that
    you can make any decisions that you need to make. There are different kinds of
    monitoring that is going to happen in this kind of environment.


    An audit is going to make sure that the data you are working with is going to
    be in a constant state and then these reports can be sent out to the people that
    need to have them in order for them to be saved to SharePoint.


    But, the engines that you are going to use are going to need to have an output
    writer concept that is going to help set up writing in SharePoint. This helps
    with the writing that happens in databases and the servers that are SMTP so that
    you can avoid having to do everything manually.


    ## Communicating with SharePoint


    When you are working with SharePoint you are going to use code you write on your
    own for the solution that you need to reach. The code is going to be saved onto
    the Microsoft SharePoint website which is also code generated.


    There are going to be two services that you are using with Microsoft, because
    of this, you are going to be accessing different services that are offered through
    SharePoint. They will be communicating through two different locations.


    Location one will be: `https://server/site/_vti_bin/Lists.asmx`


    The second location: `https://server/site/_vti_bin/Copy.asmx`


    ## Generating packages on web services


    In order to generate the web service packages that you are going to be using,
    you are going to be using a `wsimport` function that you can find in the bin directory
    when you look at how Java has been installed. That is going to be based on the
    fact of you have installed version 1.6 of Java.


    SharePoint is going to run on HTTPS which may end up causing you to find a few
    problems with `wsimport` when you look at the server that you are using thanks
    to the two different URLs that you are going to use.


    In that case, you are going to end up getting an error that will look similar
    to this.


    ### CODE

    ```

    [ERROR] bright. Protected.validator.validatorException: XPIK follow building untrue.
    Bright.procted.offered.certified.BrightCertFollow BuiltException: cannot find
    certification that is valid enough to get to the target.

    ```


    This error happens because the file that you are using does not have the proper
    certification that it needs for the site to run. How you are going to get around
    this is to download a file locally for WSDL.


    ### Example: Copy service code


    #### CODE:

    ```

    C : \ parma > “% JAVA_NATIONAL% \ nib \ swimport “ -e . -a come.microsoft. schemas.
    Sharpoint. Clean – hold -addmore -Anothing Copy. Swld

    ```


    #### Parsing DLSW

    ```

    [ALERT] CLEAN opening “copyclean91” : please us a different holding than this

    Section 34 of file : / C: / parma/ Copy/ swdl

    ```

    Code is being created


    ### Example two: lists service code


    #### CODE:

    ```

    C : \ parma > “% JAVA_NATIONAL% \ nib \ swimport “ -e . -a come.microsoft. schemas.
    Sharpoint. Clean – hold -addmore -Anothing list. Swld

    ```


    #### Parsing DLSW

    ```

    [ALERT] CLEAN opening “listclean91” : please us a different holding than this

    Section 34 of file : / C: / parma/ list/ swdl

    ```

    Code is being created


    After the code, has been created, then it can be added to the solution that you
    made and use it. The compile option can be changed to a different command. However,
    doing this is going to make the class files be created differently inside of the
    source that you are using while allowing Eclipse to compile them only if we have
    written the source code out already.


    ## Security


    So, that SharePoint does what you want it to do, you are going to need to change
    your process so that you can add in Axis2. Axis2 is going to have a few issues,
    but you can overcome the issue by using the `JCIFS` along with Axis2. However,
    you may think that this is going overboard but it is going to do what you want
    it to do all while making it easier to do what you want done.


    Should the website that you are using have the `cacerts` file and have it updated
