  trans: "\n\n![](img/cover.jpeg)\n\n# Java：使用 Java 编程的技巧与技巧\n\nCharlie Masterson\n\
    \n## 目录\n\n- 引言\n- 第 1 章：独立实现中的 Hibernate\n- 第 2 章：使用 Java 客户端的互联网 SharePoint\
    \ 服务\n- 第 3 章：使用 Apache Camel 进行 SOA 集成\n- 第 4 章：正交性\n- 第 5 章：可在多环境中使用的 JavaFX\
    \ 应用\n- 第 6 章：控制 Java 的流\n- 结论\n- 关于作者\n\n© Copyright 2017 by Charlie Masterson\
    \ - 版权所有。\n\n未经作者直接书面许可，不得复制、复制或传输本书书的内容。\n\n在任何情况下，对于由于此处信息直接或间接导致的任何赔偿、损害或资金损失，出版商不承担任何法律责任或过。\n\
    \n### 法律声明\n本书受版权保护。本书仅供个人使用。未经作者同意，您不得修改、分发、销售、使用、引用或转述本书的任何部分或内容。\n\n### 免责声明\n\
    请注意，本文档中包含的信息仅供教育和娱乐目的。我们尽一切提供准确、最新和可靠的完整信息。不提供任何形式的明示或暗示保证。读者承认作者并未提供法律、财务、医疗或专业建议。本书的内容源自各种来源。在尝试本书中概述的任何技术之前，请咨询执业专业人士。\n\
    \n通过阅读本文，读者同意在任何情况下，作者对因使用本文中所包含的信息而导致的任何直接或间接损失均不负责，包括但不限于错误、遗漏或不准确。\n\n# 引言\n\
    \n恭喜下载 `Java: Tips and Tricks to Programming Code with Java`，感谢你的支持。\n\n接下来的章节将讨论你如何使用\
    \ `Java`，以及你可以使用哪些技巧和技巧来进一步丰富你对 `Java` 的知识。本书旨在帮助你超越最基础的知识，找到更简单的方法来使用 `Java`，使其为你获益。市面上有许多关于这个主题的书，再次感谢你选择这一本！我们已尽全力确保它包含尽可能多的有用信息，因此请尽情享受！\n\
    \n# 第 1 章：独立实现中的 Hibernate\n\n在开始开发项目之前，你需要一个能够与你输入到程序中的数据良好配合的策略。无论你正在从事什么项目，这都是必须发生的事情，以便你知道该往哪里去，而不是尝试随心所欲，并可能搞乱你正在做的事情。不仅如此，你还将能够使用一个可靠的框架，并在在使用过程中改进你的项目。\n\
    \n然而，如果你使用一个没有结构且无法控制的框架，你将不得不不断修复你的项目，并花费资金进行善维护，以防止它更改你的代码并搞乱整个项目。基本上，确保你决定使用的框架将确保你的项目受到保护，并拥有调试项目所需的适当工具。`hibernate\
    \ validator` 是一个开源项目，它在演示关键功能或组合有效规则方面提供帮助。\n\n## Hibernate Validator\n\n`hibernate`\
    \ 的验证器将成为一个坚固的基础，但它允许你为 `Java EE` 和 `SE` 编写灵活且轻量级的代码。该验证器能够帮助处理在使用 `Java` 工作时使用的不同框架，你也可以使用独立的框架。`Java\
    \ SE` 独立程序将成为服务器端更复杂异构应用中的重要部分。\n\n为了能够使用验证器来构建独立的组件，你需要确保电脑上安装了六或更高版本的 `JDK`。拥有此版本使你能够通过下载五版本的\
    \ `hibernate` 二进制发行包来使用 `5.0.3` 版本的验证器。你的目录将包含所需的所有二进制文件，以确保能够构建独立的实现。\n\n第一个示例将向你展示\
    \ `ant` 构建脚本如何在 `manifest` 部分包含独立实现的依赖项。该部分对于你编写的代码之外的元数据是必需。由于使用了 `ant` 构建，你将通过\
    \ `manifest` 文件的 `class-path` 表头获得所有验证器依赖的 `JAR` 包。\n\n### 示例：ant 构建的 manifest\
    \ 部分\n```xml\n<manifest>\n  <attribute name=\"Main-Class\" value=\"com.example\"\
    />\n  <attribute name=\"Class-Path\" value=\"hibernate-validator-5.0.3.jar\"/>\n\
    </manifest>\n```\n\n## 注解声明式和约束定义\n\n通过五版本的 `hibernate validator`，你将获得一个适用于 `JSR`\
    \ 豆验证一版本的实现。声明式的注解和约束的定义将突出显示更新后的豆验证框架。当你查看通过声明式语法创建的验证规则时，将提高代码的可读性。\n\n### 示例：声明式注解\n\
    ```java\npublic class place {\n    @NotNull\n    private String nameofwhiveshere;\n\
    \n    @Pattern(regexp = \"^[0-9]{5}(-[0-9]{4})?$| [0-9]{5}$\", message = \"this\
    \ is not the correct address for this person.\")\n    private String codeforcity;\n\
    \n    @NotNull\n    private String city;\n\n    @Pattern(regexp = \"^(FH|ME|EL|EJ|AL|EE|ME|DI|AO|EM|NE|OI|LA)$\"\
    , message = \"this is not the correct city for this zip code\")\n    private String\
    \ zipcode;\n}\n```\n\n"
