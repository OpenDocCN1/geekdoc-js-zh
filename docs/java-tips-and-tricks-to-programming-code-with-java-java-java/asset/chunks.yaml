    # Chapter 3: SOA Integration Using Apache Camel


    The Apache Camel is an integration service that is geared towards the architecture
    of the program that you are running. Camel lets you configure the integrations
    so that it works for web services such as message transformations, routing, and
    the handling of exceptions. All without having to use too much code from Java.


    The integration in Java is going to be mainly used for projects that are looking
    to connect the endpoints for multiple web services quickly so that they work efficiently
    and are easy to maintain.


    When you look at the development of the standpoints, the integration is going
    to be a challenge that you have to be willing to work for. However, you can make
    it easier by using the Apache Camel framework.


    The API components for Apache Camel are going to be mostly recognized when it
    comes to enterprise integration patterns or `EIPs` for short. The `EIPs` make
    it easy to do the tasks that are required when it comes to working with integration
    for logging and much more.


    ## Enterprise integration example


    Think about working for a major airline that is trying to make it easier for their
    customers to be able to make reservations. One of the simplest ways to do this
    now is online because everything is online nowadays. When creating the service,
    it is going to compare multiple airlines and their prices so that the customer
    can get the best price for when they want to travel.


    There are going to be several web services that are going to be included in this
    because the airline that you are working for is going to have to pull the prices
    from competing websites so that they can give it to their customers.


    You are going to be making a list of quotes based on what the customer is looking
    for in their airline experience. The portal that the customer is using is going
    to be specific to them and give them everything that they are wanting from their
    destination to the best price that they can get for that fare.


    Instead of using the code for Java, you are going to use `DSL` or `Domain Specific
    Language` so that it only works with the domain that it is set up to work with.

