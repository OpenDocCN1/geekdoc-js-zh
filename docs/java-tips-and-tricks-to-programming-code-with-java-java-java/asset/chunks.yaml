    The appender has levels and there are three aspects of it that you are going to
    see on the independent dimensions of the program.


    - `Level`: the events that are logged by the program

    - `Appender`: the data that is displayed or stored

    - `Layout`: how the data is presented to the user.


    You have to look at the aspects all together instead of individually and they
    have to be on a three-dimensional space. Every point for the aspect is going to
    be part of the space that is going to configure the system the way that it is
    supposed to be.


    ### Example:


    ```

    // logging started!


    Logging logger = logging . the logging aspect (“No”) ;


    Appender appended = old the appender for the system() ;


    Layout display = old gor camel log4j CTCTdisplay()


    Appender.Howdisplayed (displayed) ;


    Logger.Showappender (appender) ;


    Logger.Howhigh (information on how high it is) ;


    // logging started!


    Logger.Alert (“ You shall not pass!”) ;

    ```


    The code in the example is an orthogonal code and it is going to enable you to
    change the layout, appender, and level of the aspect without ever causing your
    code to break therefore it continues to be functional.


    The design for orthogonal code is going to have points that are going to have
    enough space on the script that is going to make it valid so that you can configure
    the system.


    The orthogonality is a concept that is powerful and is going to establish a mental
    model that is going to be somewhat simple to understand even though you are using
    it for applications that are more complex.


    If you want a situation that is going to be useful to use orthogonality, then
    you are going to use it when you are testing the code’s functionality and levels
    so that you can fix the code that is not going to work with the appender or the
    layout.


    The use of orthogonality is going to make sure that there are no surprises with
    your code and that they all work the same on each level. This is going to be true
    when you are using `log4j` and other tools and utilities that are designed by
    third parties.


    Thanks to the complexity of the orthogonality, program’s software is going to
    be somewhat like the dimensions that you use when you are working with geometry.


    ## Code and designing it for orthogonality


    Now that you know what orthogonality is, you are going to need to know how to
    design and code it so that you can use it in your programming. The whole point
    behind it is that you need to use abstract concepts.


    Every dimension that you see in an orthogonal system is going to have one aspect
    for each program. Some dimensions are going to have types that are going to be
    one of the most common solutions for using abstract types.


    Every type will have a dimension that is going to represent the points that are
    given inside of the dimension. Abstract types are not going to be directly tied
    into instantiated or concrete classes. There are some classes that you do not
    need to use. Like you do not need to use concrete classes whenever the type you
    are using is just a markup and not showing any encapsulated behavior.


    However, you can just look at the type to see if it represents the dimension itself
    and if it is predefined for a set of instances that are fixed in place. It will
    even work for variables that are static.


    A general rule of thumb to remember when you are working with orthogonality is
    to try and avoid the references that are going to be for concrete types that will
    represent a different aspect for the program that you are using.


    Keeping to this rule is going to allow you to write code that is more generic
    code that is going to work in all instances that you are going to be putting it
    into. The code can have references to properties just as long as they are part
    of the interface that is used when defining the dimension.


    For example, if you look at the aspect type of `layout` that defines a different
    method, then this method is going to give you a `Boolean` that will indicate if
    the layout has the ability to be rendered with stack traces or not.


    At the point that an appender uses the layout, it is going to be fine to write
    code that is conditional for the method that you are using. That way that the
    appender for the file will print the exception of stack traces that are going
    to use a layout that cannot normally handle exceptions.


    The layout implementation is going to refer to when you are using a level in a
    particular that is going to be used when you are logging events.


    For example, if you want to log a level error in a layout that is using `HTML`,
    then you can wrap the log message in tags. But, the error is going to define the
    level you are working with by representing the dimension.


    References can still be avoided based on implementation classes that you use with
    other dimensions. So, if you use a `layout` then you are not going to need to
    know what sort of layout you are using.


    ## Violating orthogonality


    `Log4j` is one of the best examples that you are going to have for orthogonality.
    But, some parts of `log4j` are going to violate the rules in orthogonality. There
    is an appender that is going to log the relational database. Since there is a
    scale and popularity issue with the database, it makes it easier to search for
    the logs with `SQL`.


    There is an appender that is based on fixing the problem that you will run into
    when it comes to logging a database that is rational by turning the events that
    are logged into the insert statements with `SQL`. Therefore, the problem with
    the `pattern layout` is solved.


    The `patternlayout` is going to have a template that is going to give the user
    flexibility that is going to configure the strings to be created each time that
    an event is logged. The template will define the string and all the variables
    that are included in it.


    ### Example:


    ```

    Pattern for the string =

    “%d [ @ %a  {ss:mm:HH yyy MM dd} no %l] %l] ;


    Layout display =

    Old gor. Camel. Log4j layout for the pattern (pattern) ;


    Appender. Layout setup (display) ;

    ```


    The appender will use the layout with the pattern to define the statement.


    ### Example:


    ```

    National untrue holdSql (string d) {

    Statement for sql = d ;

    if (display() == false) {

    This display (old layout for the pattern (d)) ;

    }

    else {

    (( layout for the pattern) pattern()) conversion (d) ;

    }

    ```


    There is an implicit assumption that is built into the code for the set that you
    are using in this example that will define the appender. When looking at the orthogonality
    code, this is going to point to a lot of different aspects of a three-dimensional
    cube that is going to show the layout with the `patternlayout` that is not going
    to be represented in a system configuration that is valid.


    Any attempts that are put into place for the `SQL` are going to have to use a
    layout that is different so that there is a different exception being used for
    the class cast.


    If that is not enough reason for you, then another reason is that the appender’s
    design is quite questionable. When you use the layout for the pattern, the template
    will be bypassed. But this is not always a good thing because the `JDBC` will
    compile all of the statements that were prepared previously and this is going
    to end up leading to improvements in the performance that are not going to be
    easy to fix. The appropriate approach for this though is to control what your
    layout does by overriding it.


    ### Example:


    ```

    National open display set (layout display) {

    if ( display instanceof layout pattern) {

    Superb layout setup (display) ;

    }

    else {

    Set a new argument that is not valid (“ layout is not going to work”) ;

    }

    }

    ```


    Sadly, you are going to find problems with this example as well. There is a runtime
    exception that is going to make the application using this method unprepared to
    catch the mistake. Essentially, you are going to use the layout method, but it
    is not going to have a runtime exception that is going to work with it and the
    guarantee is going to be weakened.

