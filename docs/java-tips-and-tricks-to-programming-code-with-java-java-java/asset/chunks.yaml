    that use a Java client. It is going to focus on the web services that are going
    to be found in the copy and list services that you can use with Microsoft.


    CRUD services can also be used with CAML which stands for Collaborative Application
    Markup Language. It is based on XML that is going to utilize the different methods
    that are going to be used with copy and lists.


    On top of that you are going to be able to construct a CAML structure that is
    going to be able to pass through the different conditions that are going to be
    set for the properties that are assigned to the objects in the code.


    Background


    In the event that you are working with a large amount of data that may be in different
    forms, you are going to be able to look at that data in a compounded file so that
    you can make any decisions that you need to make. There are different kinds of
    monitoring that is going to happen in this kind of environment.


    An audit is going to make sure that the data you are working with is going to
    be in a constant state and then these reports can be sent out to the people that
    need to have them in order for them to be saved to SharePoint.


    But, the engines that you are going to use are going to need to have an output
    writer concept that is going to help set up writing in SharePoint. This helps
    with the writing that happens in databases and the servers that are SMTP so that
    you can avoid having to do everything manually.


    Communicating with SharePoint


    When you are working with SharePoint you are going to be using code that you write
    on your own for the solution that you need to reach. The code is going to be saved
    onto the Microsoft SharePoint website which is also code generated.


    There are going to be two services that you are using with Microsoft, because
    of this, you are going to be accessing different services that are offered through
    SharePoint. They will be communicating through two different locations.


    Location one will be: [https://server/site/_vti_bin/Lists.asmx](https://server/site/_vti_bin/Lists.asmx)


    The second location: [https://server/site/_vti_bin/Copy.asmx](https://server/site/_vti_bin/Copy.asmx)


    Generating packages on web services


    In order to generate the web service packages that you are going to be using,
    you are going to be using a wsimport function that you can find in the bin directory
    when you look at how Java has been installed. That is going to be based on the
