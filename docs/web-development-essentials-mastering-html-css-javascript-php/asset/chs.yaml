  \ = $target_dir . basename($_FILES[\"file\"][\"name\"]);\n    $uploadOk = 1;\n \
  \   $fileType = strtolower(pathinfo($target_file, PATHINFO_EXTENSION));\n\n    //\
  \ 检查是否为真实图片或伪图片\n    if (isset($_POST[\"submit\"])) {\n        $check = getimagesize($_FILES[\"\
  file\"][\"tmp_name\"]);\n        if ($check !== false) {\n            echo \"文件是一个图片\
  \ - \" . $check[\"mime\"] . \".\";\n            $uploadOk = 1;\n        } else {\n\
  \            echo \"文件不是图片。\";\n            $uploadOk = 0;\n        }\n    }\n \
  \   // 检查文件大小\n    if ($_FILES[\"file\"][\"size\"] > 500000) {\n        echo \"\
  抱歉，您的文件太大了。\";\n        $uploadOk = 0;\n    }\n    // 允许特定的文件格式\n    if ($fileType\
