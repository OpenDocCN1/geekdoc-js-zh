    - `<section>`：章节\n- `<article>`：文章\n- `<aside>`：侧边栏\n- `<footer>`：页脚\n\n### 元信息\n\
    \n- `<meta name=\"description\" content=\"描述\">`：描述\n- `<meta name=\"keywords\"\
    \ content=\"关键词\">`：关键词\n\n### 其他\n\n- `<div>`：块级容器\n- `<iframe src=\"https://example.com\"\
    ></iframe>`：内联框架\n- `<script src=\"script.js\"></script>`：JavaScript 文件\n- `<style>/*\
    \ CSS 样式 */</style>`：内部样式\n\n这只是 HTML 元素和属性的基础参考。请参阅官方文档或更多资源获取更深入的信息。\n\n## B.\
    \ CSS 参考\n\n这是一份常用属性和选择器的参考指南：\n\n### 选择器\n\n- `element`：选择特定类型的元素。\n- `.class`：选择具有特定类的元素。\n\
    - `#id`：选择具有特定 ID 的元素。\n- `[attribute]`：选择具有特定属性的元素。\n- `[attribute=value]`：选择具有特定属性值的元素。\n\
    - `:hover`：选择鼠标悬停在上面的元素。\n- `:nth-child(n)`：选择第 n 个子元素。\n\n### 盒模型\n\n- `width`：元素的宽度。\n\
