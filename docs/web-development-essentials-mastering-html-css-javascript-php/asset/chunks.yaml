    Example: Creating an Index


    | CREATE  INDEX idx_username ON  users (username); |


    Primary Keys and Foreign Keys


    ● Primary Key: A unique identifier for a record in a table. Each table should
    have one primary key.


    ● Foreign Key: A field in one table that uniquely identifies a row in another
    table, establishing a relationship between the two tables.


    Example: Primary Key


    | CREATE  TABLE orders ( order_id INT AUTO_INCREMENT PRIMARY KEY,


    user_id INT,


        order_date DATETIME,


    FOREIGN KEY (user_id) REFERENCES  users(id)


    ); |


    Backing Up and Restoring Databases


    Regular backups are essential for data recovery in case of failure. You can use
    the  mysqldump utility for backing up and restoring MySQL databases.


    Example: Backing Up a Database


    | mysqldump -u username -p mydatabase > mydatabase_backup.sql |


    Example: Restoring a Database


    | mysql -u username -p mydatabase < mydatabase_backup.sql |


    Conclusion


    Understanding the basics of MySQL is essential for effective database management
    and web application development. In this chapter, we''ve covered the installation,
    basic operations, and essential concepts of MySQL. As you progress, you will delve
    deeper into advanced SQL queries, database design, and optimization techniques,
    which will enable you to build robust and scalable applications.


    ## Creating and Managing Databases and Tables


    Creating and managing databases and tables are fundamental skills for any web
    developer working with MySQL. This chapter covers how to create databases and
    tables, manage them, and perform essential operations to maintain data integrity
    and performance.


    Creating a Database


    To start using MySQL, the first step is to create a database. A database is a
    logical container that holds tables and other database objects.


    Creating a Database


    To create a new database, use the  CREATE DATABASE statement:


    | CREATE  DATABASE mydatabase; |


    You can verify that the database has been created by listing all databases:


    | SHOW  DATABASES; |


    Selecting a Database


    Before performing any operations on a database, you need to select it using the  USE
    statement:


    | USE mydatabase; |


    Creating Tables


    Tables are the primary structures within a database where data is stored. Each
    table consists of rows and columns, with each column having a specific data type.


    Creating a Table


    To create a table, use the  CREATE TABLE statement, specifying the table name
    and the columns along with their data types:


    | CREATE  TABLE  users (     id  INT AUTO_INCREMENT PRIMARY KEY,


    username VARCHAR(50) NOT  NULL,


    email VARCHAR(100) NOT  NULL,


    created_at TIMESTAMP  DEFAULT  CURRENT_TIMESTAMP


    ); |


    In this example:


    ● id is an integer that auto-increments with each new record and serves as the
    primary key.


    ● username is a variable-length string with a maximum length of 50 characters.


    ● email is a variable-length string with a maximum length of 100 characters.


    ● created_at is a timestamp that defaults to the current time when the record
    is created.


    Viewing Table Structure


    To see the structure of a table, use the  DESCRIBE statement:


    | DESCRIBE  users; |


    This command displays the columns, data types, and other attributes of the table.


    Modifying Tables


    Over time, you might need to alter the structure of a table to accommodate changes
    in your application''s requirements. The  ALTER TABLE statement allows you to
    add, modify, or delete columns in a table.


    Adding a Column


    | ALTER  TABLE  users  ADD age INT; |


    Modifying a Column


    | ALTER  TABLE  users  MODIFY email VARCHAR(150) NOT  NULL; |


    Dropping a Column


    | ALTER  TABLE  users  DROP  COLUMN age; |


    Renaming a Table


    To rename a table, use the  RENAME TABLE statement:


    | RENAME  TABLE  users  TO members; |


    Dropping a Table


    If you no longer need a table, you can delete it from the database using the  DROP
    TABLE statement. Be cautious, as this action is irreversible and will delete all
    data in the table.


    | DROP  TABLE members; |


    Managing Data in Tables


    Once tables are created, you can start adding, retrieving, updating, and deleting
    data.


    Inserting Data


    To add data to a table, use the  INSERT INTO statement:


    | INSERT  INTO  users (username, email) VALUES (''john_doe'', ''john@example.com'');
    |


    Querying Data


    To retrieve data from a table, use the  SELECT statement:


    | SELECT * FROM  users; |


    You can also retrieve specific columns:


    | SELECT username, email FROM  users; |


    Updating Data


    To modify existing data, use the  UPDATE statement along with the  SET and  WHERE
    clauses:


    | UPDATE  users  SET email = ''new_email@example.com''  WHERE username = ''john_doe'';
    |


    Deleting Data


    To remove data from a table, use the  DELETE statement:


    | DELETE  FROM  users  WHERE username = ''john_doe''; |


    Constraints


    Constraints are rules enforced on data columns to ensure data integrity and accuracy.


    Primary Key


    A primary key uniquely identifies each record in a table:


    | CREATE  TABLE orders ( order_id INT AUTO_INCREMENT PRIMARY KEY,


    user_id INT,


        order_date DATETIME


    ); |


    Foreign Key


    A foreign key is used to link two tables together:


    | CREATE  TABLE orders ( order_id INT AUTO_INCREMENT PRIMARY KEY,


    user_id INT,


        order_date DATETIME,


    FOREIGN KEY (user_id) REFERENCES  users(id)


    ); |


    Unique Constraint


    Ensures that all values in a column are unique:


    | CREATE  TABLE products ( product_id INT AUTO_INCREMENT PRIMARY KEY,


    product_name VARCHAR(100) NOT  NULL  UNIQUE


    ); |


    Not Null Constraint


    Ensures that a column cannot have a null value:


    | CREATE  TABLE categories ( category_id INT AUTO_INCREMENT PRIMARY KEY,


    category_name VARCHAR(100) NOT  NULL


    ); |


    Indexes


    Indexes are used to speed up the retrieval of data from a table. They can be created
    on one or more columns.


    Creating an Index


    | CREATE  INDEX idx_username ON  users (username); |


    Conclusion


    Creating and managing databases and tables are core skills for working with MySQL.
    Understanding how to create, modify, and delete tables, as well as how to manage
    data and enforce constraints, is essential for developing robust and efficient
    web applications. In this chapter, we''ve covered the basics of these operations,
    setting the foundation for more advanced database management and optimization
    techniques.


    ## SQL Queries (SELECT, INSERT, UPDATE, DELETE)


    1.  SELECT Query


    The SELECT query retrieves data from one or more tables based on specified criteria.


    | SELECT column1, column2, ... FROM table_name


    WHERE condition; |


    Example:


    | SELECT  id, name, email FROM  users


    WHERE  id = 1; |


    This query retrieves the  id,  name, and  email columns from the  users table
    where the  id is equal to 1.


    2.  INSERT Query


    The INSERT query adds new records into a table.


    | INSERT  INTO table_name (column1, column2, ...) VALUES (value1, value2, ...);
    |


    Example:


    | INSERT  INTO  users (name, email) VALUES (''John Doe'', ''john@example.com'');
    |


    This query inserts a new record into the  users table with the name ''John Doe''
    and email ''john@example.com''.


    3.  UPDATE Query


    The UPDATE query modifies existing records in a table.


    | UPDATE table_name SET column1 = value1, column2 = value2, ...


    WHERE condition; |


    Example:


    | UPDATE  users SET email = ''jane@example.com''


    WHERE  id = 2; |


    This query updates the email of the user with  id 2 to ''jane@example.com''.


    4.  DELETE Query


    The DELETE query removes records from a table based on specified conditions.


    | DELETE  FROM table_name WHERE condition; |


    Example:


    | DELETE  FROM  users WHERE  id = 3; |


    This query deletes the user with  id 3 from the  users table.


    Conclusion'
