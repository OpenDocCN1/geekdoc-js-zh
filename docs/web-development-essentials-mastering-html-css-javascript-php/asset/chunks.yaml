  trans: "\n\n```html\n<div id=\"inner\">\n    <button id=\"btn\">Click me</button>\n\
    </div>\n\n<script>\n// 获取 DOM 元素\nlet button = document.getElementById(\"btn\"\
    );\n\n// 为外层 div 添加事件监听器\ndocument.getElementById(\"outer\").addEventListener(\"\
    click\", function() {\n  console.log(\"Outer div clicked!\");\n}, true); // 使用捕获阶段\n\
    \n// 为内层 div 添加事件监听器\ndocument.getElementById(\"inner\").addEventListener(\"click\"\
    , function() {\n  console.log(\"Inner div clicked!\");\n}, true); // 使用捕获阶段\n\n\
    // 为按钮添加事件监听器\nbutton.addEventListener(\"click\", function() {\n  console.log(\"\
    Button clicked!\");\n});\n</script>\n</body>\n</html>\n```\n\n结论\n事件处理是 Web 开发的一个重要方面，它允许你创建交互性和响应式的\
    \ Web 应用程序。通过向 DOM 元素添加事件监听器，你可以响应用户交互并执行相应的操作。理解事件类型、事件对象和事件传播对于在 JavaScript\
    \ 中有效处理事件至关重要。\n\n## 异步 JavaScript (AJAX)\n\n异步 JavaScript 和 XML (AJAX) 是一组 Web\
    \ 开发技术，允许通过在后台与服务器交换少量数据来异步更新网页。这意味着页面的部分内容无需重新加载整个页面即可更新，从而提供更平滑、更动态的用户体验。\n\n\
    ### AJAX 基础\n\nAJAX 并不是单一项技术，而是多种技术的结合：\n\n* 使用 HTML 和 CSS 进行内容展示和样式设置。\n* 使用\
    \ JavaScript 发异步请求。\n* 使用 XML、JSON 或纯文本进行客户端和服务器之间的数据交换。\n* 使用 `XMLHttpRequest`\
    \ (XHR) 对象或较新的 `Fetch API` 来发送和接收数据。\n\n### XMLHttpRequest (XHR)\n\n`XMLHttpRequest`\
    \ 对象是异步发送和接收数据的传统方式。\n\n#### 示例：使用 XMLHttpRequest\n```javascript\n// 创建一个新的 XMLHttpRequest\
    \ 对象\nlet xhr = new XMLHttpRequest();\n\n#### 配置：对 URL /article/.../load 发送 GET\
    \ 请求\nxhr.open('GET', '/article/.../load', true);\n\n// 设置一个处理响应数据的函数\nxhr.onload\
    \ = function () {\n  if (xhr.status != 200) { // 分析 HTTP 响应状态\n    alert(`Error\
    \ ${xhr.status}: ${xhr.statusText}`); // 例如 404: Not Found\n  } else { // 显示结果\n\
    \    alert(`Done, got ${xhr.response.length} bytes`); // 响应来自服务器\n  }\n};\n\n\
    // 发送请求\nxhr.send();\n\n// 处理网络错误\nxhr.onerror = function () {\n  alert(\"Request\
    \ failed\");\n};\n```\n\n### Fetch API\n\n`Fetch API` 是 `XMLHttpRequest` 的现代替代方案，提供了一种更简单、更强大的方式来进行异步请求。\n\
    \n#### 示例：使用 Fetch API\n```javascript\nfetch('/article/.../load')\n  .then(response\
    \ => {\n    if (!response.ok) {\n      throw new Error(`HTTP error! status: ${response.status}`);\n\
    \    }\n    return response.json();\n  })\n  .then(data => {\n    console.log(data);\n\
    \  })\n  .catch(error => {\n    console.error('There was a problem with the fetch\
    \ operation:', error);\n  });\n```\n\n### 使用 JSON\n\n在现代 Web 开发中，JSON（JavaScript\
    \ 对象表示）是最常用的数据交换格式。\n\n#### 示例：发送 JSON 数据\n```javascript\nfetch('/article/.../save',\
    \ { method: 'POST',\n  headers: {\n    'Content-Type': 'application/json'\n  },\n\
    \  body: JSON.stringify({ title: 'New Article', content: 'This is the content'\
    \ })\n})\n.then(response => response.json())\n.then(data => console.log(data))\n\
    .catch(error => console.error('Error:', error));\n```\n\n### 处理响应\n\n`XMLHttpRequest`\
    \ 和 `Fetch API` 均允许你处理不同类型的响应，例如 JSON、文本和二进制数据。\n\n#### 示例：使用 Fetch 处理 JSON 响应\n\
    ```javascript\nfetch('/article/.../load')\n  .then(response => response.json())\n\
    \  .then(data => {\n    console.log('Data received:', data);\n    // 处理收到的数据\n\
    \  })\n  .catch(error => {\n    console.error('Error fetching data:', error);\n\
    \  });\n```\n\n#### 示例：使用 Fetch 处理文本响应\n```javascript\nfetch('/article/.../load')\n\
    \  .then(response => response.text())\n  .then(text => {\n    console.log('Text\
    \ received:', text);\n    // 处理收到的文本\n  })\n  .catch(error => {\n    console.error('Error\
    \ fetching data:', error);\n  });\n```\n\n### 使用 Async/Await 的异步函数\n\nJavaScript\
    \ 中的 `async` 和 `await` 关键字提供了一种更优雅、更易读的方式来处理异步操作。\n\n#### 示例：使用 Async/Await\n\
    ```javascript\nasync function fetchData() {\n  try {\n    let response = await\
    \ fetch('/article/.../load');\n    if (!response.ok) {\n      throw new Error(`HTTP\
    \ error! status: ${response.status}`);\n    }\n    let data = await response.json();\n\
    \    console.log(data);\n  } catch (error) {\n    console.error('Error fetching\
    \ data:', error);\n  }\n}\n```\n\n结论\nAJAX 是一套强大的技术，使 Web 应用程序能够动态运行。通过使用 `XMLHttpRequest`\
    \ 或现代的 `Fetch API`，你可以无缝更新页面的部分。\n\n## JavaScript 库（例如 jQuery）\n\nJavaScript 库是预写代码的集合，提供了执行任务的函数和模块。\n\
    \n### jQuery 简介\njQuery 是一个快速、轻量且功能丰富的库，让 DOM 操作、事件处理和 AJAX 变得简单。\n\n### 为什么使用\
    \ jQuery？\n1. **简化 DOM 操作**：jQuery 提供了一套 set 的方法来操作对象模型 (DOM)。\n2. **浏览器兼容性**：jQuery\
    \ 处理不同浏览器之间的差异。\n3. **易用性**：语法设计易于编写和理解。\n4. **丰富的插件系统**：jQuery 的架构允许创建和使用复用插件。\n\
    5. **简化 AJAX**：jQuery 简化了异步请求。\n\n### jQuery 基本语法\njQuery 的基本语法设计得非常熟悉且易用。一个典型的\
    \ jQuery 语句如下：`$(selector).action()`。\n\n* `:`：jQuery 的简写。\n* `selector`：表示所选\
    \ HTML 元素的字符串。\n* `action()`：应用于所选元素的方法。\n\n#### 示例：使用 jQuery 进行 DOM 操作\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <title>jQuery 示例</title>\n    <script src=\"\
    https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n    <script>\n    $(document).ready(function(){\n\
    \        $(\"button\").click(function(){\n            $(\"p\").text(\"Hello, jQuery!\"\
    );\n        });\n    });\n    </script>\n</head>\n<body>\n    <p>这是一个段落。</p>\n\
    \    <button>Click me</button>\n</body>\n</html>\n```\n在这个示例中，当点击按钮时，段落内的文本将更改为“Hello,\
    \ jQuery!”\n\n"
- fmt: "\njQuery makes it easy to handle events such as clicks, mouse movements, and\
    \ form submissions.\n\n### Example: Click Event Handling\n\n```javascript\n$(document).ready(function(){\n\
    \    $(\"button\").click(function(){\n        alert(\"Button was clicked!\");\n\
    \    });\n});\n```\n\nThis example shows how to display an alert when a button\
    \ is clicked.\n\n### AJAX with jQuery\nAJAX (Asynchronous JavaScript and XML)\
    \ allows web pages to be updated asynchronously by exchanging data with a web\
    \ server behind the scenes. jQuery simplifies the process of making AJAX calls.\n\
    \n### Example: Simple AJAX Request\n\n```javascript\n$(document).ready(function(){\n\
    \    $(\"#loadButton\").click(function(){\n        $.ajax({\n            url:\
    \ \"data.txt\",\n            success: function(result){\n                $(\"\
    #content\").html(result);\n            }\n        });\n    });\n});\n```\n\nIn\
    \ this example, when the button with the ID `loadButton` is clicked, an AJAX request\
    \ is made to fetch the content of `data.txt`, which is then displayed inside the\
    \ HTML element with the ID `content`.\n\n### jQuery Plugins\nOne of the strengths\
    \ of jQuery is its extensibility. Plugins are reusable pieces of code that can\
    \ add specific functionalities to your projects.\n\n### Example: Using a jQuery\
    \ Plugin\nTo use a plugin, you usually include the plugin script and call its\
    \ methods in your code. For instance, using the jQuery UI plugin to create a datepicker:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>jQuery UI Datepicker</title>\n\
    \    <link rel=\"stylesheet\" href=\"https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css\"\
    >\n    <script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n\
    \    <script src=\"https://code.jquery.com/ui/1.12.1/jquery-ui.min.js\"></script>\n\
    \    <script>\n        $(document).ready(function(){\n            $(\"#datepicker\"\
    ).datepicker();\n        });\n    </script>\n</head>\n<body>\n    <p>Date: <input\
    \ type=\"text\" id=\"datepicker\"></p>\n</body>\n</html>\n```\n\nThis example\
    \ shows how to include the jQuery UI library to create a datepicker input field.\n\
    \n### Other Popular JavaScript Libraries\nWhile jQuery is widely used, there are\
    \ other popular JavaScript libraries that serve various purposes:\n* **Lodash**:\
    \ A utility library that provides helpful functions for common programming tasks\
    \ such as manipulating arrays and objects.\n* **Moment.js**: A library for parsing,\
    \ validating, manipulating, and formatting dates.\n* **D3.js**: A powerful library\
    \ for creating dynamic, interactive data visualizations in web browsers using\
    \ SVG, HTML, and CSS.\n\n### Conclusion\nJavaScript libraries like jQuery have\
    \ revolutionized web development by providing powerful tools that simplify many\
    \ common tasks. jQuery, with its ease of use, cross-browser compatibility, and\
    \ extensive plugin ecosystem, remains a valuable asset for web developers. Exploring\
    \ and leveraging these libraries can greatly enhance productivity and the quality\
    \ of web applications.\n\n# CHAPTER 4\n\n# Introduction to PHP\n\n## Getting Started\
    \ with PHP\nPHP (Hypertext Preprocessor) is a popular open-source server-side\
    \ scripting language designed for web development. It is widely used for creating\
    \ dynamic web pages and applications. This chapter will guide you through the\
    \ basics of getting started with PHP, including installation, basic syntax, and\
    \ writing your first PHP script.\n\n### Installation\nTo get started with PHP,\
    \ you'll need a local development environment that includes PHP, a web server\
    \ (like Apache or Nginx), and a database server (like MySQL). A convenient way\
    \ to set this up is to use an all-in-one package like XAMPP, MAMP, or WAMP.\n\n\
    #### Installing XAMPP\n1. **Download XAMPP**: Visit the [XAMPP website](https://www.apachefriends.org/index.html)\
    \ and download the version suitable for your operating system.\n2. **Install XAMPP**:\
    \ Run the installer and follow the instructions. During installation, ensure you\
    \ select Apache and MySQL.\n3. **Start Apache and MySQL**: Open the XAMPP Control\
    \ Panel and start the Apache and MySQL services.\n\n### Verifying PHP Installation\n\
    1. **Create a PHP file**: Navigate to the XAMPP installation directory (usually\
    \ `C:\\xampp\\htdocs\\` on Windows or `/Applications/XAMPP/htdocs/` on macOS)\
    \ and create a new file named `info.php`.\n2. **Add PHP code**: Open `info.php`\
    \ in a text editor and add the following code:\n```php\n<?php phpinfo();\n?>\n\
    ```\n3. **Run the script**: Open a web browser and navigate to `http://localhost/info.php`.\
    \ If PHP is installed correctly, you should see a page displaying your configuration.\n\
    \n### Writing Your First PHP Script\nPHP code is embedded within HTML using PHP\
    \ tags. The most common tag is `<?php ... ?>`.\n\n#### Example: Hello World\n\
    1. **Create a new PHP file**: Create a new file `hello.php` in the `htdocs` directory.\n\
    2. **Add PHP code**: Open `hello.php` in a text editor and add the following:\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Hello World</title>\n</head>\n\
    <body>\n<?php\necho \"Hello, World!\";\n?>\n</body>\n</html>\n```\n3. **Run the\
    \ script**: Open a web browser and navigate to `http://localhost/hello.php`. You\
    \ should see \"Hello, World!\".\n\n### PHP Syntax\n#### Tags\nPHP code is written\
    \ inside `<?php ... ?>`. Short tags `<? ... ?>` are also supported but are not\
    \ recommended.\n\n#### Variables\nVariables in PHP start with a dollar sign (`$`)\
    \ followed by the variable name. Variable names are case-sensitive.\n```php\n\
    <?php\n$name = \"John\";\n$age = 25;\n?>\n```\n\n#### Echo and Print\nThe `echo`\
    \ and `print` statements are used to output data to the screen. `echo` can take\
    \ multiple parameters, while `print` can only take one and returns a value.\n\
    ```php\n<?php\necho \"Hello, \", $name, \"!\";\nprint \"You \", $age, \" years\
    \ old.\";\n?>\n```\n\n#### Comments\nPHP supports single-line comments using `//`\
    \ or `#` and multi-line comments using `/* ... */`.\n```php\n<?php\n// This is\
    \ a single-line comment\n# This is also a single-line comment\n/*\nThis is multi-line\
    \ comment*/\n?>\n```\n\n#### Data Types\nPHP supports several data types, including\
    \ integers, floats, strings, booleans, arrays, and null.\n```php\n<?php\n$integer\
    \ = 42;\n$float = 3.14;\n$string = \"Hello, World!\";\n$boolean = true;\n$array\
    \ = array(1, 2, 3);\n$object = new stdClass();\n$null = null;\n?>\n```\n\n####\
    \ Operators\nPHP includes arithmetic operators (`+`, `-`, `*`, `/`, `%`), comparison\
    \ operators (`==`, `!=`, `<`, `>`, `>=`), and logical operators (`&&`, `||`, `!`).\n\
    ```php\n<?php\n$x = 10;\n$y = 20;\n$sum = $x + $y; // 30\n$difference = $x - $y;\
    \ // -10\n$product = $x * $y; // 200\n$quotient = $x / $y; // 0.5\n$remainder\
    \ = $x % $y; // 10\n$is_equal = ($x == $y); // false\n$is_not_equal = ($x != $y);\
    \ // true\n$is_less_than = ($x < $y); // true\n$is_greater_than = ($x > $y); //\
    \ false\n$and = ($x < $y && $x != 0); // true\n$or = ($x == 0 || $y == 20); //\
    \ true\n$not = !($x == 10); // false\n?>\n```\n\n### Control Structures\nPHP supports\
    \ common control structures such as conditionals (`if`, `else`, `elseif`, `switch`)\
    \ and loops (`for`, `while`, `do-while`, `foreach`).\n\n#### Conditionals\n```php\n\
    <?php\n$number = 10;\nif ($number > 0) {\n    echo \"The number is positive.\"\
    ;\n} elseif ($number < 0) {\n    echo \"The number is negative.\";\n} else {\n\
    \    echo \"The number is zero.\";\n}\n$day = \"Monday\";\nswitch ($day) {\n \
    \   case \"Monday\":\n        echo \"Start of the work week.\";\n        break;\n\
    \    case \"Friday\":\n        echo \"End of the work week.\";\n        break;\n\
    \    default:\n        echo \"It's a regular day.\";\n        break;\n}\n?>\n\
    ```\n\n#### Loops\n```php\n<?php\n// For loop\nfor ($i = 0; $i < 5; $i++) {\n\
    \    echo \"Number: $i<br>\";\n}\n// While loop\n$i = 0;\nwhile ($i < 5) {\n \
    \   echo \"Number: $i<br>\";\n    $i++;\n}\n// Do-while loop\n$i = 0;\ndo {\n\
    \    echo \"Number: $i<br>\";\n    $i++;\n} while ($i < 5);\n// Foreach loop\n\
    $array = array(\"Apple\", \"Banana\", \"Cherry\");\nforeach ($array as $fruit)\
    \ {\n    echo \"Fruit: $fruit<br>\";\n}\n?>\n```\n"
  raw: "jQuery makes it easy to handle events such as clicks, mouse movements, and\
    \ form submissions.\n\nExample: Click Event Handling\n\n| $(document).ready(function(){\
    \     $(\"button\").click(function(){\n\n        alert(\"Button was clicked!\"\
    );\n\n    });\n\n}); |\n\nThis example shows how to display an alert when a button\
    \ is clicked.\n\nAJAX with jQuery\n\nAJAX (Asynchronous JavaScript and XML) allows\
    \ web pages to be updated asynchronously by exchanging data with a web server\
    \ behind the scenes. jQuery simplifies the process of making AJAX calls.\n\nExample:\
    \ Simple AJAX Request\n\n| $(document).ready(function(){     $(\"#loadButton\"\
    ).click(function(){\n\n        $.ajax({\n\nurl: \"data.txt\",\n\nsuccess: function(result){\n\
    \n                $(\"#content\").html(result);\n\n            }\n\n        });\n\
    \n    });\n\n}); |\n\nIn this example, when the button with the ID  loadButton\
    \ is clicked, an AJAX request is made to fetch the content of  data.txt, which\
    \ is then displayed inside the HTML element with the ID  content.\n\njQuery Plugins\n\
    \nOne of the strengths of jQuery is its extensibility. Plugins are reusable pieces\
    \ of code that can add specific functionalities to your projects.\n\nExample:\
    \ Using a jQuery Plugin\n\nTo use a plugin, you usually include the plugin script\
    \ and call its methods in your code. For instance, using the jQuery UI plugin\
    \ to create a datepicker:\n\n| <!DOCTYPE html> <html>\n\n<head>\n\n    <title>jQuery\
    \ UI Datepicker</title>\n\n    <link rel=\"stylesheet\" href=\"https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css\"\
    >\n\n    <script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n\
    \n    <script src=\"https://code.jquery.com/ui/1.12.1/jquery-ui.min.js\"></script>\n\
    \n    <script>\n\n        $(document).ready(function(){\n\n            $(\"#datepicker\"\
    ).datepicker();\n\n        });\n\n    </script>\n\n</head>\n\n<body>\n\n    <p>Date:\
    \ <input type=\"text\" id=\"datepicker\"></p>\n\n</body>\n\n</html> |\n\nThis\
    \ example shows how to include the jQuery UI library to create a datepicker input\
    \ field.\n\nOther Popular JavaScript Libraries\n\nWhile jQuery is widely used,\
    \ there are other popular JavaScript libraries that serve various purposes:\n\n\
    ● Lodash: A utility library that provides helpful functions for common programming\
    \ tasks such as manipulating arrays and objects.\n\n●      Moment.js: A library\
    \ for parsing, validating, manipulating, and formatting dates.\n\n● D3.js: A powerful\
    \ library for creating dynamic, interactive data visualizations in web browsers\
    \ using SVG, HTML, and CSS.\n\nConclusion\n\nJavaScript libraries like jQuery\
    \ have revolutionized web development by providing powerful tools that simplify\
    \ many common tasks. jQuery, with its ease of use, cross-browser compatibility,\
    \ and extensive plugin ecosystem, remains a valuable asset for web developers.\
    \ Exploring and leveraging these libraries can greatly enhance productivity and\
    \ the quality of web applications.\n\nCHAPTER 4\n\n* * *\n\n# Introduction to\
    \ PHP\n\n## Getting Started with PHP\n\nPHP (Hypertext Preprocessor) is a popular\
    \ open-source server-side scripting language designed for web development. It\
    \ is widely used for creating dynamic web pages and applications. This chapter\
    \ will guide you through the basics of getting started with PHP, including installation,\
    \ basic syntax, and writing your first PHP script.\n\nInstallation\n\nTo get started\
    \ with PHP, you'll need a local development environment that includes PHP, a web\
    \ server (like Apache or Nginx), and a database server (like MySQL). A convenient\
    \ way to set this up is to use an all-in-one package like XAMPP, MAMP, or WAMP.\n\
    \nInstalling XAMPP\n\n1.  Download XAMPP: Visit the [XAMPP website](https://www.apachefriends.org/index.html)\
    \ and download the version suitable for your operating system.\n\n2.  Install\
    \ XAMPP: Run the installer and follow the instructions. During installation, ensure\
    \ you select Apache and MySQL.\n\n3.  Start Apache and MySQL: Open the XAMPP Control\
    \ Panel and start the Apache and MySQL services.\n\nVerifying PHP Installation\n\
    \n1.  Create a PHP file: Navigate to the XAMPP installation directory (usually\
    \  C:\\xampp\\htdocs\\ on Windows or  /Applications/XAMPP/htdocs/ on macOS) and\
    \ create a new file named  info.php.\n\n2.  Add PHP code: Open  info.php in a\
    \ text editor and add the following code:\n\n| <?php phpinfo();\n\n?> |\n\n3.\
    \  Run the script: Open a web browser and navigate to  http://localhost/info.php.\
    \ If PHP is installed correctly, you should see a page displaying detailed information\
    \ about your PHP configuration.\n\nWriting Your First PHP Script\n\nPHP code is\
    \ embedded within HTML using PHP tags. The most common tag is  <?php ... ?>.\n\
    \nExample: Hello World\n\n1.  Create a new PHP file: Create a new file named \
    \ hello.php in the  htdocs directory.\n\n2.  Add PHP code: Open  hello.php in\
    \ a text editor and add the following code:\n\n| <!DOCTYPE html> <html>\n\n<head>\n\
    \n    <title>Hello World</title>\n\n</head>\n\n<body>\n\n<?php\n\necho  \"Hello,\
    \ World!\";\n\n?>\n\n</body>\n\n</html> |\n\n3.  Run the script: Open a web browser\
    \ and navigate to  http://localhost/hello.php. You should see \"Hello, World!\"\
    \ displayed on the page.\n\nPHP Syntax Basics\n\nPHP Tags\n\nPHP code is written\
    \ inside  <?php ... ?> tags. Short tags  <? ... ?> are also supported but are\
    \ not recommended due to potential compatibility issues.\n\nVariables\n\nVariables\
    \ in PHP start with a dollar sign ($) followed by the variable name. Variable\
    \ names are case-sensitive.\n\n| <?php $name = \"John\";\n\n$age = 25;\n\n?> |\n\
    \nEcho and Print\n\nThe  echo and  print statements are used to output data to\
    \ the screen.  echo can take multiple parameters, while  print can only take one\
    \ and returns a value.\n\n| <?php echo  \"Hello, \", $name, \"!\";\n\nprint  \"\
    \ You are \", $age, \" years old.\";\n\n?> |\n\nComments\n\nPHP supports single-line\
    \ comments using  // or  # and multi-line comments using  /* ... */.\n\n| <?php\
    \ // This is a single-line comment\n\n# This is also a single-line comment\n\n\
    /*\n\nThis is a\n\nmulti-line comment\n\n*/\n\n?> |\n\nData Types\n\nPHP supports\
    \ several data types, including integers, floats, strings, booleans, arrays, objects,\
    \ and null.\n\n| <?php $integer = 42;\n\n$float = 3.14;\n\n$string = \"Hello,\
    \ World!\";\n\n$boolean = true;\n\n$array = array(1, 2, 3);\n\n$object = new stdClass();\n\
    \n$null = null;\n\n?> |\n\nOperators\n\nPHP includes arithmetic operators (+,\
    \  -,  *,  /,  %), comparison operators (==,  !=,  <,  >,  <=,  >=), and logical\
    \ operators (&&,  ||,  !).\n\n| <?php $x = 10;\n\n$y = 20;\n\n$sum = $x + $y;        //\
    \ 30\n\n$difference = $x - $y; // -10\n\n$product = $x * $y;    // 200\n\n$quotient\
    \ = $x / $y;   // 0.5\n\n$remainder = $x % $y;  // 10\n\n$is_equal = ($x == $y);        //\
    \ false\n\n$is_not_equal = ($x != $y);    // true\n\n$is_less_than = ($x < $y);     //\
    \ true\n\n$is_greater_than = ($x > $y);  // false\n\n$and = ($x < $y && $x !=\
    \ 0);   // true\n\n$or = ($x == 0 &#124;&#124; $y == 20);   // true\n\n$not =\
    \ !($x == 10);            // false\n\n?> |\n\nControl Structures\n\nPHP supports\
    \ common control structures such as conditionals (if,  else,  elseif,  switch)\
    \ and loops (for,  while,  do-while,  foreach).\n\nConditionals\n\n| <?php $number\
    \ = 10;\n\nif ($number > 0) {\n\n echo  \"The number is positive.\";\n\n} elseif\
    \ ($number < 0) {\n\n echo  \"The number is negative.\";\n\n} else {\n\n echo\
    \  \"The number is zero.\";\n\n}\n\n$day = \"Monday\";\n\nswitch ($day) {\n\n\
        case  \"Monday\":\n\n        echo  \"Start of the work week.\";\n\n        break;\n\
    \n    case  \"Friday\":\n\n        echo  \"End of the work week.\";\n\n        break;\n\
    \n    default:\n\n        echo  \"It's a regular day.\";\n\n        break;\n\n\
    }\n\n?> |\n\nLoops\n\n| <?php // For loop\n\nfor ($i = 0; $i < 5; $i++) {\n\n\
    \ echo  \"Number: $i<br>\";\n\n}\n\n// While loop\n\n$i = 0;\n\nwhile ($i < 5)\
    \ {\n\n    echo  \"Number: $i<br>\";\n\n    $i++;\n\n}\n\n// Do-while loop\n\n\
    $i = 0;\n\ndo {\n\n    echo  \"Number: $i<br>\";\n\n    $i++;\n\n} while ($i <\
    \ 5);\n\n// Foreach loop\n\n$array = array(\"Apple\", \"Banana\", \"Cherry\");\n\
    \nforeach ($array as $fruit) {\n\n echo  \"Fruit: $fruit<br>\";\n\n}\n\n?> |\n\
    \nConclusion"
