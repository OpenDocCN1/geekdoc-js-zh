  trans: "\n\n## 页脚\n\n`<footer>` 元素代表页脚内容，通常包含作者信息、版权声明和联系详情。\n\n示例：\n\n```html\n\
    <footer>\n  <p>&copy; 2024 网站名称. 版权所有。</p>\n</footer>\n```\n\n使用语义化 HTML 元素可以增强您网页的结构和可访问性，使其对人类和机器都更易理解。此外，它通过向搜索引擎提供有关网站内容和结构的清晰信息，来改进\
    \ SEO（搜索引擎优化）。在开发网页时，请尽可能使用语义化 HTML，以创建结构良好且具有意义的内容。\n\n# 第 2 章\n\n# 使用 CSS 进行样式设计\n\
    \n## CSS 简介\n\nCSS（层叠样式表）是一种用于网页页面样式化和格式化的强大语言。它允许开发者控制 HTML 元素的显示和布局，从而创建出视觉上吸引人且响应式的网站。在本介绍中，我们将涵盖\
    \ CSS 的基础知识及其工作原理。\n\n### 什么是 CSS？\n\nCSS 是一种样式表语言，用于定义 HTML 元素网页上的呈现方式。它允许你控制元素的颜色、字体、大小、间距和布局，并添加诸如渐变、阴影和动画等视觉效果。通过将内容（HTML）与呈现（CSS）分离，网页开发者可以在整个站点中创建一致且视觉美观的设计。\n\
    \n### CSS 是如何工作的？\n\nCSS 通过选择 HTML 元素并对它们应用样式来工作。这是通过选择器实现的，选择器针对 HTML 文档中的特定元素、类（class）或\
    \ ID。一旦选中，就会使用属性-值对应用样式，其中属性指定了要样化的元素方面（例如 `color`、`font-size`），而值则定义了样式（例如 `blue`、`16px`）。\n\
    \n### 基础语法\n\n```css\nselector {\n  property: value;\n}\n```\n\n示例：\n\n```css\n\
    h1 {\n  color: blue;\n  font-size: 24px;\n}\n```\n\n在这个示例中，样式被应用于所有的 `<h1>` 元素，将它们的颜色设置为蓝色，字体大小设置为\
    \ 24 像素。\n\n### 应用 CSS 的方法\n\n*   **内联样式**：可以使用 `style` 属性将样式直接应用于 HTML 元素。\n\n\
    ```html\n<h1 style=\"color: blue; font-size: 24px;\">标题</h1>\n```\n\n*   **内部样式**：样式包含包含\
    \ HTML 文档 `<head>` 部分的 `<style>` 元素中。\n\n```html\n<head>\n  <style>\n    h1 {\n\
    \      color: blue;\n      font-size: 24px;\n    }\n  </style>\n</head>\n```\n\
    \n*   **外部样式**：样式定义在外部 CSS 文件中，并使用 `<link>` 元素链接到 HTML 文档。\n\n```html\n<head>\n\
    \  <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n```\n\n### 选择器\n\n\
    CSS 选择器用于选择想要样化的元素的模式。它们可以元素、类、ID、属性等。\n\n*   **元素选择器**：选择所有特定类型的元素。\n\n```css\n\
    h1 {\n  /* 样式应用于所有的 <h1> 元素 */\n}\n```\n\n*   **类选择器**：选择具有特定类属性的元素。\n\n```css\n\
    .classname {\n  /* 样式应用于 class=\"classname\" 的元素 */\n}\n```\n\n*   **ID 选择器**：选择具有特定\
    \ ID 属性的单个元素。\n\n```css\n#idname {\n  /* 样式应用于 id=\"idname\" 的元素 */\n}\n```\n\n\
    ### 结论\n\nCSS 是网页开发的一个基础部分，允许开发者控制网页的显示和布局。通过学习 CSS，你将获得创建视觉惊艳且响应式设计的能力，从而增强用户体验。在接下来的章节中，我们将深入研究\
    \ CSS 概念，并探索网页样化的高级技术。\n\n## CSS 选择器和属性\n\n在 CSS 中，选择器用于定位特定的 HTML 元素，而属性定义了应用于这些元素的视觉样式。理解\
    \ CSS 选择器和属性对于页面样式化至关重要。\n\n### 选择器\n\n1.  **元素选择器**：针对特定 HTML 元素的所有实例。\n    ```css\n\
    \    p { /* 样式应用于所有的 <p> 元素 */ }\n    ```\n2.  **类选择器**：针对具有特定类的元素。\n    ```css\n\
    \    .myclass { /* 样式应用于 class=\"myclass\" 的元素 }\n    ```\n3.  **ID 选择器**：针对具有特定\
    \ ID 的单个元素。\n    ```css\n    #myid { /* 样式应用于 id=\"myid\" 的元素 }\n    ```\n4. \
    \ **后代选择器**：针对指定元素的后代。\n    ```css\n    .parent .child { /* 应用 .parent 内部的 .child\
    \ 元素 }\n    ```\n5.  **相邻兄弟选择器**：针对紧随指定元素之后的元素。\n    ```css\n    h2 + p { /* 紧跟在\
    \ <h2> 之后的 <p> 元素 }\n    ```\n6.  **属性选择器**：针对具有特定属性或值的元素。\n    ```css\n    input[type=\"\
    text\"] { /* 应用 type=\"text\" 的 <input> 元素 }\n    ```\n\n### 属性\n\n1.  **颜色 (Color)**：指定文本颜色。\n\
    \    ```css\n    color: blue;\n    ```\n2.  **字体族 (Font Family)**：定义字体族。\n   \
    \ ```css\n    font-family: Arial, sans-serif;\n    ```\n3.  **字体大小 (Font Size)**：设置字体大小。\n\
    \    ```css\n    font-size: 16px;\n    ```\n4.  **背景颜色 (Background Color)**：定义元素的背景颜色。\n\
    \    ```css\n    background-color: #f0f0f0;\n    ```\n5.  **外边距 (Margin)**：指定元素外部的空间。\n\
    \    ```css\n    margin: 10px;\n    ```\n6.  **内边距 (Padding)**：定义内容与边框之间的空间。\n\
    \    ```css\n    padding: 10px;\n    ```\n7.  **边框 (Border)**：指定元素周围的边框。\n   \
    \ ```css\n    border: 1px solid black;\n    ```\n8.  **宽度和高度 (Width and Height)**：设置元素的宽高度。\n\
    \    ```css\n    width: 200px; height: 100px;\n    ```\n\n### 结论\n\nCSS 选择器和属性为网页样式化提供了基础。通过掌握这些概念，你将获得创建视觉吸引且结构良好的设计的能力。尝试不同的选择器和属性，为你的网页实现所需的视觉效果。在接下来的章节中，我们将探索更高级的技术和最佳实践。\n\
    \n## 盒模型和布局\n\nCSS 盒模型是一个描述网页上元素布局和尺寸的基础概念。理解盒模型对于创建结构良好且视觉吸引的布局至关重要。\n\n### 盒模型基础\n\
    \n盒模型由四个部分组成：\n\n*   **内容 (Content)**：元素的实际内容，如文本、图像或其他媒体。\n*   **内边距 (Padding)**：内容与元素边框之间的空间。\n\
    *   **边框 (Border)**：围绕内边距和内容的线。\n*   **外边距 (Margin)**：边框外部的空间，将元素与页面上的其他元素隔开。\n\
    \n### 盒模型图\n\n```\n__________________________\n|          Margin          |\n\
    |   ____________________   |\n|   |      Border        |   |\n|   |  __________________\
    \  |   |\n|   |  |    Padding     |  |   |\n|   |  |  __________  |  |   |\n|\
    \   |  |  | Content  |  |  |   |\n|   |  |  |          |  |  |   |\n|   |  | \
    \ |__________|  |  |   |\n|   |  |______________|  |   |\n|   |____________________|\
    \   |\n|________________________|\n```\n3.  **盒尺寸**\n\n"
- fmt: "\nThe `box-sizing` property determines how the total width and height of an\
    \ element are calculated. The default value is `content-box`, which includes only\
    \ the content and does not account for padding, border, or margin. However, you\
    \ can change this behavior using the `box-sizing` property.\n\n```css\n/* Include\
    \ padding and border in the total width and height */\n.box {\n  box-sizing: border-box;\n\
    }\n```\n\n## 4. Layout Techniques\n\n### Block-Level vs. Inline Elements\n- Block-level\
    \ elements start on a new line and take up the full width available.\n- Inline\
    \ elements do not start on a new line and only take up as much width as necessary.\n\
    \n### Positioning\n- `Static`: The default positioning behavior where elements\
    \ flow according to the document's normal flow.\n- `Relative`: Allows you to position\
    \ an element relative to its normal position.\n- `Absolute`: Removes an element\
    \ from the normal flow and positions it relative to its nearest positioned ancestor.\n\
    - `Fixed`: Positions an element relative to the viewport, meaning it stays in\
    \ the same position even when the page is scrolled.\n\n### Flexbox\nFlexbox is\
    \ a layout model that provides a more efficient way to distribute space and align\
    \ items in a container. It offers a flexible and powerful layout system for building\
    \ complex web designs.\n\n```css\n.container {\n  display: flex;\n  justify-content:\
    \ center; /* Align items horizontally */\n  align-items: center; /* Align items\
    \ vertically */\n}\n```\n\n### Grid\nCSS Grid Layout is a two-dimensional layout\
    \ system that allows you to create complex grid-based layouts with ease. It provides\
    \ precise control over rows, columns, and grid items.\n\n```css\n.container {\n\
    \  display: grid;\n  grid-template-columns: 1fr 1fr 1fr; /* Three equal-width\
    \ columns */\n  grid-gap: 10px; /* Gap between grid items */\n}\n```\n\n### Conclusion\n\
    The CSS box model and layout techniques are essential for creating well-structured\
    \ and visually appealing web layouts. By understanding how elements are sized,\
    \ positioned, and spaced on the page, you can create flexible and responsive designs\
    \ that adapt to different screen sizes and devices. Experiment with different\
    \ layout techniques to find the best approach for your specific design needs.\n\
    \n## Responsive Design with Media Queries\nMedia queries are a powerful tool in\
    \ CSS that allow you to apply different styles based on various device characteristics,\
    \ such as screen width, height, orientation, and more. This enables you to create\
    \ responsive designs that adapt to different screen sizes and devices. Let's explore\
    \ how to use media queries to create responsive layouts:\n\n### 1. Syntax\nMedia\
    \ queries are written using the `@media` rule followed by one or more media features\
    \ and conditions enclosed in parentheses.\n\n```css\n@media screen and (max-width:\
    \ 768px) {\n  /* Styles applied when the screen width is less than or equal to\
    \ 768px */\n}\n```\n\n### 2. Common Media Features\n- Width: `width`\n- Height:\
    \ `height`\n- Device Width: `device-width`\n- Device Height: `device-height`\n\
    - Orientation: `orientation` (portrait or landscape)\n- Aspect Ratio: `aspect-ratio`\n\
    - Resolution: `resolution`\n- Color: `color`\n- Hover Capability: `hover`\n- Pointer:\
    \ `pointer`\n- Touch Capability: `pointer: coarse` or `pointer: fine`\n\n### 3.\
    \ Example: Responsive Layout\n```css\n/* Default styles for desktop */\n.container\
    \ {\n  width: 960px;\n  margin: 0 auto;\n}\n\n/* Media query for tablets */\n\
    @media screen and (max-width: 768px) {\n  .container {\n    width: 90%;\n  }\n\
    }\n\n/* Media query for mobile devices */\n@media screen and (max-width: 480px)\
    \ {\n  .container {\n    width: 100%;\n  }\n}\n```\nIn this example, the `.container`\
    \ element adjusts its width based on the screen size. It has a fixed width for\
    \ desktop screens (960px), a percentage width for tablets (90% of the viewport\
    \ width), and a full width for mobile devices (100% of the viewport width).\n\n\
    ### 4. Applying Styles Based on Orientation\n```css\n/* Landscape orientation\
    \ */\n@media screen and (orientation: landscape) {\n  /* Styles applied when the\
    \ device is in landscape orientation */\n}\n\n/* Portrait orientation */\n@media\
    \ screen and (orientation: portrait) {\n  /* Styles applied when the device is\
    \ in portrait orientation */\n}\n```\n\n### 5. Nested Media Queries\nYou can also\
    \ nest media queries to target specific ranges of screen sizes.\n\n```css\n/*\
    \ Media query for tablets */\n@media screen and (max-width: 768px) {\n  /* Nested\
    \ styles here */\n}\n```\n\n### 6. Mobile-First Approach\nConsider starting your\
    \ styles for mobile and then using media queries for larger screens.\n\n```css\n\
    /* Mobile styles */\n.container {\n  width: 100%;\n}\n\n/* Media query for tablets\
    \ */\n@media screen and (min-width: 768px) {\n  .container {\n    width: 90%;\n\
    \  }\n}\n\n/* Media query for desktop */\n@media screen and (min-width: 960px)\
    \ {\n  .container {\n    width: 960px;\n  }\n}\n```\n\n### Conclusion\nThe CSS\
    \ box model and layout techniques are essential for creating well-structured and\
    \ visually appealing web layouts. By understanding how elements are sized, positioned,\
    \ and spaced on the page, you can create flexible and responsive designs that\
    \ adapt to different screen sizes and devices. Experiment with different layout\
    \ techniques to find the best approach for your specific design needs.\n\n## Advanced\
    \ Styling Techniques\nAdvanced techniques in CSS go beyond basic styling and allow\
    \ for creative effects and interactions. Let's explore some:\n\n### 1. Flexbox\n\
    Flexbox is a layout model that provides a more efficient way to distribute space\
    \ and align items in a container. It offers a flexible and powerful layout system.\n\
    \n```css\n.container {\n  display: flex;\n  justify-content: center; /* Align\
    \ items horizontally */\n  align-items: center; /* Align items vertically */\n\
    }\n```\n\n### 2. Grid Layout\nCSS Grid Layout is a two-dimensional layout system\
    \ that allows you to create complex grid-based layouts with ease. It provides\
    \ precise control over rows, columns, and grid items.\n\n```css\n.container {\n\
    \  display: grid;\n  grid-template-columns: 1fr 1fr 1fr; /* Three equal-width\
    \ columns */\n  grid-gap: 10px; /* Gap between grid items */\n}\n```\n\n### 3.\
    \ Transitions\nTransitions allow you to animate changes to CSS properties over\
    \ a specified duration. They can be used to create subtle animations, such as\
    \ fading in elements or changing colors.\n\n```css\n.element {\n  transition:\
    \ background-color 0.3s ease;\n}\n\n.element:hover {\n  background-color: #f0f0f0;\n\
    }\n```\n\n### 4. Transformations\nTransformations enable you to modify the appearance\
    \ of elements by translating, rotating, scaling, or skewing them in 2D or 3D space.\
    \ This allows for creative effects.\n\n```css\n.element {\n  transform: rotate(45deg)\
    \ scale(1.5);\n}\n```\n\n### 5. Animations\nAnimations allow you to create complex,\
    \ multi-step animations using keyframes. You can define the animation's timing,\
    \ duration, easing function, and other properties.\n\n```css\n@keyframes slide-in\
    \ {\n  from {\n    transform: translateX(-100%);\n  }\n  to {\n    transform:\
    \ translateX(0);\n  }\n}\n\n.element {\n  animation: slide-in 0.5s ease forwards;\n\
    }\n```\n\n### 6. Custom Properties (CSS Variables)\nCSS custom properties, also\
    \ known as CSS variables, allow you to define reusable values that can be used\
    \ throughout your stylesheets. This promotes consistency and simplifies maintenance.\n\
    \n```css\n:root {\n  --primary-color: #007bff;\n}\n\n.element {\n  color: var(--primary-color);\n\
    }\n```\n\n### 7. Pseudo-Elements and Pseudo-Classes\n"
