    \n| <?php $var = 10;\n\nif (is_int($var)) {\n\n echo  \"The variable is an integer.\"\
    ;\n\n}\n\n$var = \"Hello\";\n\nif (is_string($var)) {\n\n echo  \"The variable\
    \ is a string.\";\n\n}\n\n?> |\n\nConclusion\n\nVariables and data types are the\
