    ## RESTful API Development


    Developing a RESTful API in PHP involves creating endpoints that allow clients
    to interact with your application using standard HTTP methods such as GET, POST,
    PUT, and DELETE. This chapter covers how to build a simple RESTful API using plain
    PHP, handling requests, and returning responses in a structured format like JSON.


    What is a RESTful API?


    REST (Representational State Transfer) is an architectural style that uses standard
    HTTP methods to interact with resources. A RESTful API adheres to these principles,
    enabling communication between client and server in a stateless manner.


    Setting Up Your Environment


    Before diving into code, ensure your environment is properly set up:


    1.  Web Server: Apache, Nginx, or any other server capable of running PHP.


    2.  PHP: Make sure PHP is installed and configured.


    3.  Database: MySQL or any other database of your choice, if your API will interact
    with a database.


    Directory Structure


    Create a basic directory structure for your API project:


    | api/ ├── config/


    │   └── database.php


    ├── public/


    │   └── index.php


    └── src/


        ├── controllers/


        ├── models/


        └── routes/


            └── api.php |


    ●      config/database.php: Database connection settings.


    ●      public/index.php: Entry point for the API.


    ●      src/controllers/: Contains the logic for handling requests.


    ●      src/models/: Contains the database interaction code.


    ●      src/routes/api.php: Defines the API routes.


    Database Configuration


    In  config/database.php, set up your database connection:


