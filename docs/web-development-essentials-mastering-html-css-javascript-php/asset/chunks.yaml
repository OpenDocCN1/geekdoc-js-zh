  trans: "\njQuery 能够轻松处理点击、鼠标移动和表单提交等事件。\n\n### 示例：点击事件处理\n\n```javascript\n$(document).ready(function(){\n\
    \    $(\"button\").click(function(){\n        alert(\"Button was clicked!\");\n\
    \    });\n});\n```\n\n此示例展示了如何在点击按钮时显示警告框。\n\n### 使用 jQuery 进行 AJAX\nAJAX（异步 JavaScript\
    \ 和 XML）允许通过在后台与 Web 服务器交换数据来异步更新 页面。jQuery 简化了发起 AJAX 调用的过程。\n\n### 示例： 的 AJAX\
    \ 请求\n\n```javascript\n$(document).ready(function(){\n    $(\"#loadButton\").click(function(){\n\
    \        $.ajax({\n            url: \"data.txt\",\n            success: function(result){\n\
    \                $(\"#content\").html(result);\n            }\n        });\n \
    \   });\n});\n```\n\n在此示例中，当点击 ID 为 `loadButton` 的按钮时，将发送 AJAX 请求来获取 `data.txt`\
    \ 的内容，然后将其显示在 ID 为 `content` 的 HTML 元素中。\n\n### jQuery 插件\njQuery 的优势之一是它的可扩展性。插件是可重用的代码段，可以为你的项目添加特定功能。\n\
    \n### 示例：使用 jQuery 插件\n要使用插件，通常需要引入插件脚本并在代码中调用其方法。例如，使用 jQuery UI 插件创建一个日期选择器：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>jQuery UI Datepicker</title>\n\
    \    <link rel=\"stylesheet\" href=\"https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css\"\
    >\n    <script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n\
    \    <script src=\"https://code.jquery.com/ui/1.12.1/jquery-ui.min.js\"></script>\n\
    \    <script>\n        $(document).ready(function(){\n            $(\"#datepicker\"\
    ).datepicker();\n        });\n    </script>\n</head>\n<body>\n    <p>Date: <input\
    \ type=\"text\" id=\"datepicker\"></p>\n</body>\n</html>\n```\n\n此示例展示了如何引入 jQuery\
    \ UI 库来创建一个日期选择器输入框。\n\n### 其他流行的 JavaScript 库\n虽然 jQuery 被广泛使用，但还有其他用于各种用途流行的\
    \ JavaScript 库：\n* **Lodash**: 一个工具库，为常见的编程任务（如操作数组和对象）提供了方便的。\n* **Moment.js**:\
    \ 一个用于解析、验证、操作和格式化日期的库。\n* **D3.js**: 一个强大的库，用于使用 SVG、HTML 和 CSS 在 浏览器中创建动态、交互式的数据可视化。\n\
    \n### 结论\n像 jQuery 这样的 JavaScript 库通过提供简化许多常见任务的强大工具，彻底改变了 Web 开发。jQuery 以其易用性、跨浏览器兼容性和丰富的插件生态系统，仍然是\
    \ Web 开发人员宝贵的资产。探索和利用这些库可以极大提高生产力和 Web 应用程序的质量。\n\n# 第 4 章\n\n# PHP 简介\n\n## 开始使用\
    \ PHP\nPHP（超文本预处理器）是一种流行的开源服务器端脚本语言，专为 Web 开发设计。它广泛用于创建动态 Web 页面和应用程序。本章将引导你学习\
    \ PHP 的基础知识，包括安装、基础语法和编写你的第一个 PHP 脚本。\n\n### 安装\n要开始使用 PHP，你需要一个本地开发环境，其中包含 PHP、Web\
    \ 服务器（如 Apache 或 Nginx）和数据库服务器（如 MySQL）。设置此环境的一种方便方法是使用 XAMPP、MAMP 或 WAMP 等合一包。\n\
    \n#### 安装 XAMPP\n1. **下载 XAMPP**: 访问 [XAMPP Website](https://www.apachefriends.org/index.html)\
    \ 并下载适用于你操作系统的版本。\n2. **安装 XAMPP**: 安装程序并按照指示操作。安装过程中，确保选择了 Apache 和 MySQL。\n\
    3. **启动 Apache 和 MySQL**: 打开 XAMPP 控制面板并启动 Apache 和 MySQL 服务。\n\n### 验证 PHP 安装\n\
    1. **创建 PHP 文件**: 访问 XAMPP 安装目录（Windows 上通常为 `C:\\xampp\\htdocs\\`，macOS 上为 `/Applications/XAMPP/htdocs/`）并创建一个名为\
    \ `info.php` 的新文件。\n2. **添加 PHP 代码**: 在文本编辑器中打开 `info.php` 并添加以下代码：\n```php\n\
    <?php phpinfo();\n?>\n```\n3. **运行脚本**: 打开浏览器并访问 `http://localhost/info.php`。如果\
    \ PHP 安装正确，你应该能看到一个显示配置的页面。\n\n### 编写你的第一个 PHP 脚本\nPHP 代码使用 PHP 标签嵌入在 HTML 中。最常用的标签是\
    \ `<?php ... ?>`。\n\n#### 示例：Hello World\n1. **创建一个新的 PHP 文件**: 在 `htdocs` 目录中创建一个新文件\
    \ `hello.php`。\n2. **添加 PHP 代码**: 在文本编辑器中打开 `hello.php` 并添加以下内容：\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Hello World</title>\n</head>\n<body>\n<?php\n\
    echo \"Hello, World!\";\n?>\n</body>\n</html>\n```\n3. **运行脚本**: 打开浏览器并访问 `http://localhost/hello.php`。你应该能看到\
    \ \"Hello, World!\"。\n\n### PHP 语法\n#### 标签\nPHP 代码写在 `<?php ... ?>` 内部。也支持短标签\
    \ `<? ... ?>`。\n\n#### 变量\nPHP 变量以 `$` 符号开头。变量名大小写敏感。\n```php\n<?php\n$name =\
    \ \"John\";\n$age = 25;\n?>\n\n#### Echo 和 Print\n`echo` 和 `print` 语句用于向屏幕输出数据。`echo`\
    \ 可以接受多个参数，而 `print` 可以返回一个值。\n```php\n<?php\necho \"Hello, World!\";\nprint \"\
    You are \";\n?>\n\n#### 注释\nPHP 支持使用 `//` 或 `#` 单行注释，以及使用 `/* ... */` 多行注释。\n\
    ```php\n<?php\n// 这是一个单行注释\n# 这也是一个单行注释\n/* 这是多行注释 */\n\n#### 数据类型\nPHP 支持多种数据类型，包括整数、浮点数、字符串、布尔、数组和空。\n\
    ```php\n<?php\n$integer = 42;\n$float = 3.14;\n$string = \"Hello, World!\";\n\
    $boolean = true;\n$array = array(1, 2, 3);\n$null = null\n\n#### 运算符\nPHP 包含了算术运算符（`+`,\
    \ `-`, `*`, `/`, `%`）、比较运算符（`==`, `!=`, `<`, `>=`）和逻辑运算符（`&&`, `||`, `!`）。\n```php\n\
    <?php\n$x = 10;\n$y = 20;\n$sum = $x + $y; // 30\n$difference = $x - $y; // -10\n\
    $product = $x * $y; // 200\n$quotient = $x / $y; // 0.5\n$remainder = $x % $y;\
    \ // 10\n$is_equal = ($x == $y); // false\n$is_not_equal = ($x != $y); // true\n\
    $is_less_than = ($x < $y); // true\n$is_greater_than = ($x > $y); // false\n$and\
    \ = ($x < $y && $x != 0); // true\n$or = ($x == 0 || $y == 20); // true\n$not\
    \ = !($x == 10); // false\n?>\n```\n\n### 控制结构\nPHP 支持常见的控制结构，如条件语句（`if`, `else`,\
    \ `elseif`, `switch`）和循环（`for`, `while`, `do-while`, `foreach`）。\n\n#### 条件语句\n\
    ```php\n<?php\n$number = 10;\nif ($number > 0) {\n    echo \"The number is positive.\"\
    ;\n} elseif ($number < 0) {\n    echo \"The number is negative.\";\n} else {\n\
    \    echo \"The number is zero.\";\n}\n$day = \"Monday\";\nswitch ($day) {\n \
    \   case \"Monday\":\n        echo \"Start of the work week.\";\n        break;\n\
    \    case \"Friday\":\n        echo \"End of the work week.\";\n        break;\n\
    \    default:\n        echo \"It's a regular day.\";\n        break;\n}\n?>\n\
    ```\n\n#### 循环\n```php\n<?php\n// for 循环\nfor ($i = 0; $i < 5; $i++) {\n    echo\
    \ \"Number: $i<br>\";\n}\n// while 循环\n$i = 0;\nwhile ($i < 5) {\n    echo \"\
    Number: $i<br>\";\n    $i++;\n}\n// do-while 循环\n$i = 0;\ndo {\n    echo \"Number:\
    \ $i<br>\";\n    $i++;\n} while ($i < 5);\n// foreach 循环\n$array = array(\"Apple\"\
    , \"Banana\", \"Cherry\");\nforeach ($array as $fruit) {\n    echo \"Fruit: $fruit<br>\"\
    ;\n}\n?>\n```\n"
- fmt: "\nGetting started with PHP involves setting up a local development environment,\
    \ understanding basic syntax, and writing simple scripts. PHP is a versatile language\
    \ that can be embedded within HTML, making it a powerful tool for creating dynamic\
    \ web pages and applications. With a solid foundation in PHP basics, you'll be\
    \ well on your way to developing more complex and interactive web projects.\n\n\
    ## Variables and Data Types\n\nUnderstanding variables and data types is fundamental\
    \ to programming in PHP. Variables are used to store data that can be manipulated\
    \ and retrieved throughout your scripts. PHP is a loosely typed language, meaning\
    \ you do not need to declare the data type of a variable. The type is determined\
    \ automatically based on the value assigned to the variable.\n\n### Variables\n\
    In PHP, a variable starts with a dollar sign (`$`) followed by the name of the\
    \ variable. Variable names must begin with a letter or an underscore, followed\
    \ by any number of letters, numbers, or underscores.\n\n### Declaring and Initializing\
    \ Variables\nTo declare a variable in PHP, simply assign a value to it using the\
    \ `=` operator:\n\n```php\n<?php $variableName = value; ?>\n```\n\n#### Examples:\n\
    ```php\n<?php \n$greeting = \"Hello, World!\";  // String\n$age = 25;        \
    \            // Integer\n$price = 19.99;               // Float\n$isAvailable\
    \ = true;          // Boolean\n?>\n```\n\n### Data Types\nPHP supports several\
    \ data types, which can be categorized into scalar types, compound types, and\
    \ special types.\n\n#### Scalar Types\n1. **Integer**: Whole numbers, positive\
    \ or negative.\n```php\n<?php $integer = 42; ?>\n```\n2. **Float (Double)**: Numbers\
    \ with a decimal point or in exponential form.\n```php\n<?php $float = 3.14; ?>\n\
    ```\n3. **String**: A sequence of characters enclosed in quotes.\n```php\n<?php\
    \ $string = \"Hello, World!\"; ?>\n```\n4. **Boolean**: Represents two possible\
    \ values: `true` or `false`.\n```php\n<?php \n$isTrue = true;\n$isFalse = false;\n\
    ?>\n```\n\n#### Compound Types\n1. **Array**: An ordered map of values, which\
    \ can hold multiple values under a single name.\n```php\n<?php $array = array(\"\
    Apple\", \"Banana\", \"Cherry\"); ?>\n```\n2. **Object**: An instance of a class,\
    \ containing data (properties) and functions (methods).\n```php\n<?php \nclass\
    \ Car {\n    public $color;\n    public function __construct($color) {\n     \
    \   $this->color = $color;\n    }\n}\n$myCar = new Car(\"red\");\n?>\n```\n\n\
    #### Special Types\n1. **NULL**: A variable with the `NULL` data type has no value.\n\
    ```php\n<?php $nullValue = null; ?>\n```\n2. **Resource**: A special variable\
    \ holding a reference to an external resource, like a database connection. This\
    \ type is not often manipulated directly in scripts.\n\n### Type Juggling and\
    \ Casting\nPHP automatically converts variables to the correct data type based\
    \ on their value, a process known as type juggling. However, sometimes you may\
    \ need to explicitly cast a variable to a specific type.\n\n#### Type Juggling\
    \ Example\n```php\n<?php \n$number = \"10\"; // $number is a string\n$sum = $number\
    \ + 5; // $number is automatically converted to an integer\necho $sum; // Outputs:\
    \ 15\n?>\n```\n\n#### Type Casting Example\n```php\n<?php \n$number = \"10\";\
    \ // $number is a string\n$number = (int)$number; // Explicitly cast $number to\
    \ an integer\necho $number; // Outputs: 10\n?>\n```\n\n### Checking Data Types\n\
    PHP provides several functions to check the type of a variable:\n- `is_int()`:\
    \ Checks if a variable is an integer.\n- `is_float()`: Checks if a variable is\
    \ a float.\n- `is_string()`: Checks if a variable is a string.\n- `is_bool()`:\
    \ Checks if a variable is a boolean.\n- `is_array()`: Checks if a variable is\
    \ an array.\n- `is_object()`: Checks if a variable is an object.\n- `is_null()`:\
    \ Checks if a variable is `NULL`.\n\n#### Examples:\n```php\n<?php \n$var = 10;\n\
    if (is_int($var)) {\n    echo \"The variable is an integer.\";\n}\n$var = \"Hello\"\
    ;\nif (is_string($var)) {\n    echo \"The variable is a string.\";\n}\n?>\n```\n\
    \n### Conclusion\nVariables and data types are the building blocks of PHP programming.\
    \ By understanding how to declare and manipulate variables, and how to work with\
    \ different data types, you can create dynamic and flexible web applications.\
    \ With this knowledge, you are ready to explore more advanced PHP concepts and\
    \ functionalities.\n\n## Control Structures\nControl structures are essential\
    \ components of PHP programming that allow you to control the flow of your script\
    \ based on conditions or repeated tasks. This chapter will cover the primary control\
    \ structures in PHP, including conditionals and loops.\n\n### Conditional Statements\n\
    Conditional statements allow your script to perform different actions based on\
    \ conditions. PHP supports several conditional statements: `if`, `else`, `elseif`,\
    \ and `switch`.\n\n#### The if Statement\nThe `if` statement executes a block\
    \ of code if a specified condition is true.\n```php\n<?php \n$age = 20;\nif ($age\
    \ >= 18) {\n    echo \"You are an adult.\";\n}\n?>\n```\n\n#### The else Statement\n\
    The `else` statement executes a block of code if the condition in the `if` statement\
    \ is false.\n```php\n<?php \n$age = 16;\nif ($age >= 18) {\n    echo \"You are\
    \ an adult.\";\n} else {\n    echo \"You are a minor.\";\n}\n?>\n```\n\n#### The\
    \ elseif Statement\nThe `elseif` statement allows you to test multiple conditions.\n\
    ```php\n<?php \n$score = 75;\nif ($score >= 90) {\n    echo \"Grade: A\";\n} elseif\
    \ ($score >= 80) {\n    echo \"Grade: B\";\n} elseif ($score >= 70) {\n    echo\
    \ \"Grade: C\";\n} else {\n    echo \"Grade: F\";\n}\n?>\n```\n\n#### The switch\
    \ Statement\nThe `switch` statement is used to perform different actions based\
    \ on conditions. It is a cleaner way to handle multiple conditions that would\
    \ otherwise require multiple `elseif` statements.\n```php\n<?php \nday = \"Tuesday\"\
    ;\nswitch ($day) {\n    case \"Monday\":\n        echo \"Today is Monday.\";\n\
    \        break;\n    case \"Tuesday\":\n        echo \"Today is Tuesday.\";\n\
    \        break;\n    case \"Wednesday\":\n        echo \"Today is Wednesday.\"\
    ;\n        break;\n    default:\n        echo \"Today is not Monday, Tuesday,\
    \ or Wednesday.\";\n        break;\n}\n?>\n```\n\n### Looping Structures\nLoops\
    \ are used to execute a block of code repeatedly as long as a specified condition\
    \ is true. PHP supports several types of loops: `for`, `while`, `do-while`, and\
    \ `foreach`.\n\n#### The for Loop\nThe `for` loop is used when you know in advance\
    \ how many times you want to execute a statement or a block of statements.\n```php\n\
    <?php \nfor ($i = 0; $i < 5; $i++) {\n    echo \"The number is: $i\";\n}\n?>\n\
    ```\n\n#### The while Loop\nThe `while` loop executes a block of code as long\
    \ as the specified condition is true.\n```php\n<?php \n$i = 0;\nwhile ($i < 5)\
    \ {\n    echo \"The number is: $i\";\n    $i++;\n}\n?>\n```\n\n#### The do-while\
    \ Loop\nThe `do-while` loop is similar to the `while` loop, but it will execute\
    \ the block of code least least, even if the condition is false, because the condition\
    \ is tested after the code is executed.\n```php\n<?php \n$i = 0;\ndo {\n    echo\
    \ \"The number is: $i\";\n    $i++;\n} while ($i < 5);\n?>\n```\n\n#### The foreach\
    \ Loop\nThe `foreach` loop is used to iterate over arrays. It assigns the current\
    \ array element to a variable and then moves to the next element.\n```php\n<?php\
    \ \n$fruits = array(\"Apple\", \"Banana\", \"Cherry\");\nforeach ($fruits as $fruit)\
    \ {\n    echo \"Fruit: $fruit\";\n}\n?>\n```\n\n### Nested Control Structures\n\
    Control structures can be nested within one another. This means you can place\
    \ an `if` statement inside a `for` loop or a `while` loop inside an `if` statement,\
    \ and so on.\n\n#### Example: Nested if Statements in a for Loop\n```php\n<?php\
    \ \nfor ($i = 0; $i < 10; $i++) {\n    if ($i % 2 == 0) {\n        echo \"$i is\
    \ an even number.\";\n    } else {\n        echo \"$i is an odd number.\";\n \
    \   }\n}\n?>\n```\n\n### Break and Continue\nThe `break` statement is used to\
    \ exit a loop prematurely, while the `continue` statement skips the rest of the\
    \ current loop iteration and moves to the next iteration.\n\n#### Example: Using\
    \ break\n```php\n<?php \nfor ($i = 0; $i < 10; $i++) {\n    if ($i == 5) {\n \
    \       break; // Exit the loop when $i equals 5\n    }\n    echo \"The number\
    \ is: $i\";\n}\n?>\n```\n\n#### Example: Using continue\n```php\n<?php \nfor ($i\
    \ = 0; $i < 10; $i++) {\n    if ($i % 2 == 0) {\n```\n"
