    \ // Explicitly cast $number to an integer\n\necho $number; // Outputs: 10\n\n\
    ?> |\n\nChecking Data Types\n\nPHP provides several functions to check the type\
    \ of a variable:\n\n●      is_int(): Checks if a variable is an integer.\n\n●      is_float():\
