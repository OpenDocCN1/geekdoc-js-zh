    @extends('layouts.app')\n@section('content')\n    <h1>Welcome to my website</h1>\n\
    @endsection\n```\n\n### 5. Eloquent ORM\nLaravel's Eloquent ORM allows you to\
    \ interact with your database using PHP. Define models to represent database tables\
    \ and perform CRUD operations.\n\n```php\nnamespace App\\Models; \nuse Illuminate\\\
    Database\\Eloquent\\Model;\n\nclass Post extends Model\n{\n    //\n}\n```\n\n\
    ### 6. Database Migrations\nLaravel's migration feature allows you to define database\
    \ schema using PHP code. This ensures that your database structure is version-controlled\
    \ and consistent across environments.\n\n```php\nuse Illuminate\\Database\\Migrations\\\
    Migration; \nuse Illuminate\\Database\\Schema\\Blueprint;\nuse Illuminate\\Support\\\
    Facades\\Schema;\n\nclass CreatePostsTable extends Migration\n{\n    public function\
    \ up()\n    {\n        Schema::create('posts', function (Blueprint $table) {\n\
    \            $table->id();\n            $table->string('title');\n           \
    \ $table->text('content');\n            $table->timestamps();\n        });\n \
    \   }\n    public function down()\n    {\n        Schema::dropIfExists('posts');\n\
    \    }\n}\n```\n\n### 7. Middleware\nMiddleware provides a convenient mechanism\
    \ for filtering HTTP requests entering your application. For example, you can\
    \ use middleware to authenticate users or verify CSRF tokens.\n\n### 8. Authentication\
    \ and Authorization\nLaravel provides built-in authentication and authorization\
    \ features. You can easily add user registration, login, and password reset functionality\
    \ to your application.\n\n### 9. Artisan CLI\nLaravel's Artisan command-line tool\
    \ provides a range of commands to automate repetitive tasks such as database migrations,\
    \ seeding, and generating code.\n\n### 10. Testing\nLaravel supports testing out\
    \ of the box with PHPUnit. Write tests to ensure that your application behaves\
    \ as expected and remains stable across updates.\n\n### Conclusion\nUsing Laravel\
    \ allows you to build web applications rapidly by providing a robust set of features\
    \ and conventions. By following Laravel's documentation and best practices, you\
    \ can develop scalable and maintainable applications efficiently.\n\n## RESTful\
    \ API Development\nDeveloping a RESTful API in PHP involves creating endpoints\
    \ that allow clients to interact with your application using standard HTTP methods\
    \ such as GET, POST, PUT, and DELETE. This chapter covers how to build a simple\
    \ RESTful API using plain PHP, handling requests, and returning responses in a\
    \ structured format like JSON.\n\n### What is a RESTful API?\nREST (Representational\
    \ State Transfer) is an architectural style that uses standard HTTP methods to\
    \ interact with resources. A RESTful API adheres to these principles, enabling\
    \ communication between client and server in a stateless manner.\n\n### Setting\
    \ Up Your Environment\nBefore diving into code, ensure your environment is properly\
    \ set up:\n1. **Web Server**: Apache, Nginx, or any other server capable of running\
    \ PHP.\n2. **PHP**: Make sure PHP is installed and configured.\n3. **Database**:\
    \ MySQL or any other database of your choice, if your API will interact with a\
    \ database.\n\n### Directory Structure\n```text\napi/\n├── config/\n│   └── database.php\n\
    ├── public/\n│   └── index.php\n└── src/\n    ├── controllers/\n    ├── models/\n\
    \    └── routes/\n        └── api.php\n```\n* `config/database.php`: Database\
    \ connection settings.\n* `public/index.php`: Entry point for the API.\n* `src/controllers/`:\
    \ Contains the logic for handling requests.\n* `src/models/`: Contains the database\
    \ interaction code.\n* `src/routes/api.php`: Defines the API routes.\n\n### Database\
    \ Configuration\nIn `config/database.php`, set up your database connection:\n\n\
    ```php\n<?php \n$host = 'localhost';\n$db_name = 'your_database';\n$username =\
    \ 'your_username';\n$password = 'your_password';\ntry {\n    $pdo = new PDO(\"\
    mysql:host=$host;dbname=$db_name\", $username, $password);\n    $pdo->setAttribute(PDO::ATTR_ERRMODE,\
    \ PDO::ERRMODE_EXCEPTION);\n} catch (PDOException $e) {\n    echo \"Connection\
    \ error: \" . $e->getMessage();\n}\n```\n\n### Defining Routes\nIn `src/routes/api.php`,\
    \ define your API routes:\n\n```php\n<?php \n// Include controllers\nrequire_once\
    \ '../controllers/UserController.php';\n// Get the request method\n$method = $_SERVER['REQUEST_METHOD'];\n\
    // Get the path\n$request = explode('/', trim($_SERVER['PATH_INFO'] ?? '/'));\n\
    // Route based on first segment of the path\nswitch ($request[0]) {\n    case\
    \ 'users':\n        $controller = new UserController();\n        switch ($method)\
    \ {\n            case 'GET':\n                if (isset($request[1])) {\n    \
    \                $controller->getUser($request[1]);\n                } else {\n\
    \                    $controller->getUsers();\n                }\n           \
    \     break;\n            case 'POST':\n                $controller->createUser();\n\
    \                break;\n            case 'PUT':\n                if (isset($request[1]))\
    \ {\n                    $controller->updateUser($request[1]);\n             \
    \   }\n                break;\n            case 'DELETE':\n                if\
    \ (isset($request[1])) {\n                    $controller->deleteUser($request[1]);\n\
    \                }\n                break;\n            default:\n           \
    \     header('HTTP/1.1 405 Method Not Allowed');\n                break;\n   \
    \     }\n        break;\n    default:\n        header('HTTP/1.1 404 Not Found');\n\
    \        echo json_encode([\"message\" => \"Endpoint not found\"]);\n        break;\n\
    }\n```\n\n### Controllers\nCreate a `UserController.php` in `src/controllers/`:\n\
    \n```php\n<?php \nrequire_once '../models/User.php';\nclass UserController {\n\
    \    private $user;\n    public function __construct() {\n        $this->user\
    \ = new User();\n    }\n    public function getUsers() {\n        $users = $this->user->getAllUsers();\n\
    \        echo json_encode($users);\n    }\n    public function getUser($id) {\n\
    \        $user = $this->user->getUserById($id);\n        echo json_encode($user);\n\
    \    }\n    public function createUser() {\n        $data = json_decode(file_get_contents(\"\
    php://input\"), true);\n        if ($this->user->createUser($data)) {\n      \
    \      echo json_encode([\"message\" => \"User created\"]);\n        } else {\n\
    \            echo json_encode([\"message\" => \"Failed to create user\"]);\n \
    \       }\n    }\n    public function updateUser($id) {\n        $data = json_decode(file_get_contents(\"\
    php://input\"), true);\n        if ($this->user->updateUser($id, $data)) {\n \
    \           echo json_encode([\"message\" => \"User updated\"]);\n        } else\
    \ {\n            echo json_encode([\"message\" => \"Failed to update user\"]);\n\
    \        }\n    }\n    public function deleteUser($id) {\n        if ($this->user->deleteUser($id))\
    \ {\n            echo json_encode([\"message\" => \"User deleted\"]);\n      \
    \  } else {\n            echo json_encode([\"message\" => \"Failed to delete user\"\
    ]);\n        }\n    }\n}\n```\n\n### Models\nCreate a `User.php` in `src/models/`:\n\
    \n```php\n<?php \nrequire_once '../../config/database.php';\nclass User {\n  \
    \  private $conn;\n    private $table = 'users';\n    public function __construct()\
    \ {\n        global $pdo;\n        $this->conn = $pdo;\n    }\n    public function\
    \ getAllUsers() {\n        $query = \"SELECT * FROM \" . $this->table;\n     \
    \   $stmt = $this->conn->prepare($query);\n        $stmt->execute();\n       \
    \ return $stmt->fetchAll(PDO::FETCH_ASSOC);\n    }\n    public function getUserById($id)\
    \ {\n        $query = \"SELECT * FROM \" . $this->table . \" WHERE id = ?\";\n\
    \    }\n}\n```\n"
