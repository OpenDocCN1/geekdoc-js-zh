    \ $password]);\n    // 注册成功后重定向到登录页面\n    header(\"Location: login.php\");\n \
    \   exit();\n}\n?>\n```\n\n## 4. 登录表单\n\n创建一个 HTML 表单 (`login.php`) 供用户登录你的网站。\n\
