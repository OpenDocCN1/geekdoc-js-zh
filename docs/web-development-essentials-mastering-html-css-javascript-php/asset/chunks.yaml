- fmt: "\nHere’s an example of a basic HTML document:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <meta charset=\"UTF-8\">\n    <title>My First Web Page</title>\n\
    </head>\n<body>\n    <h1>Welcome to My Website</h1>\n    <p>This is my first web\
    \ page.</p>\n</body>\n</html>\n```\n\n# HTML Elements and Tags\n\nHTML uses tags\
    \ to define elements. Tags are enclosed in angle brackets, and most elements have\
    \ an opening tag and a closing tag. The content goes between these tags.\n\nExample:\n\
    ```html\n<p>This is a paragraph.</p>\n```\n\nSome elements, like images and line\
    \ breaks, are self-closing and do not require a closing tag.\n\nExample:\n```html\n\
    <img src=\"image.jpg\" alt=\"Description of image\"> <br>\n```\n\n## Common HTML\
    \ Elements\n\n- **Headings**: Defined with `<h1>` to `<h6>` tags. `<h1>` is the\
    \ highest level and `<h6>` the lowest.\n```html\n<h1>Main Heading</h1><h2>Subheading</h2>\n\
    ```\n- **Paragraphs**: Defined with the `<p>` tag.\n```html\n<p>This is a paragraph.</p>\n\
    ```\n- **Links**: Defined with the `<a>` tag. The `href` attribute specifies the\
    \ URL.\n```html\n<a href=\"https://www.example.com\">Visit Example</a>\n```\n\
    - **Images**: Defined with the `<img>` tag. The `src` attribute specifies the\
    \ image source, and the `alt` attribute provides alternative text.\n```html\n\
    <img src=\"image.jpg\" alt=\"Description of image\">\n```\n- **Lists**: Ordered\
    \ lists (`<ol>`) and unordered lists (`<ul>`) contain list items (`<li>`).\n```html\n\
    <ol>\n    <li>First item</li>\n    <li>Second item</li>\n</ol>\n```\n- **Tables**:\
    \ Defined with the `<table>` tag. Contains rows (`<tr>`), headers (`<th>`), and\
    \ data cells (`<td>`).\n```html\n<table>\n  <tr>\n      <th>Header 1</th>\n  \
    \    <th>Header 2</th>\n  </tr>\n  <tr>\n      <td>Data 1</td>\n      <td>Data\
    \ 2</td>\n  </tr>\n</table>\n```\n\n## Attributes\n\nAttributes provide additional\
    \ information about HTML elements. They are included within the opening tag and\
    \ typically come in name/value pairs.\n\nExample:\n```html\n<a href=\"https://www.example.com\"\
    \ target=\"_blank\">Visit Example</a>\n```\nIn this example, `href` is an attribute\
    \ that specifies the URL, and `target=\"_blank\"` is an attribute that specifies\
    \ the link should open in a new tab.\n\n## Semantic HTML\n\nSemantic HTML elements\
    \ clearly describe their meaning in a way that both the browser and developers\
    \ can understand. Examples include:\n\n- `<header>`: Defines a header for a document\
    \ or section.\n- `<nav>`: Defines a navigation block.\n- `<article>`: Defines\
    \ an independent, self-contained piece of content.\n- `<section>`: Defines a section\
    \ in a document.\n- `<footer>`: Defines a footer for a document or section.\n\n\
    Example:\n```html\n<article>\n  <header>\n    <h1>Article Title</h1>\n  </header>\n\
    \  <section>\n    <p>This is the main content of the article.</p>\n  </section>\n\
    \  <footer>\n    <p>Author: John Doe</p>\n  </footer>\n</article>\n```\n\nConclusion:Understanding\
    \ basics is essential for any web developer. It’s the first step in creating structured\
    \ and meaningful web pages. In the next chapter, you’ll learn how to enhance your\
    \ web pages using CSS to add layout.\n\n## Structure of an HTML Document\n\nHTML\
    \ (HyperText Language) documents follow a specific structure that provides a framework\
    \ for creating web pages. Understanding this is fundamental for building well-formed\
    \ and organized content. Let's break down the components:\n\n1. **Document Declaration\
    \ (`<!DOCTYPE html>`)**: The Document Type Declaration (DTD) defines the document\
    \ type and version of HTML. In modern web development, `<!DOCTYPE html>` is used\
    \ as it's compatible with all browsers.\n```html\n<!DOCTYPE html>\n```\n2. **HTML\
    \ Element (`<html>`)**: The `<html>` element is the root element. It encapsulates\
    \ all the content on the page.\n```html\n<!DOCTYPE html>\n<html>\n<!-- Content\
    \ goes here -->\n</html>\n```\n3. **Head Section (`<head>`)**: The `<head>` section\
    \ contains meta-information about the document, such as the title, character set,\
    \ and links to external resources like stylesheets and scripts. This section is\
    \ not visible on the web page itself.\n```html\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <title>Page Title</title>\n    <link rel=\"stylesheet\" href=\"styles.css\"\
    >\n    <script src=\"script.js\"></script>\n</head>\n```\n4. **Body Section (`<body>`)**:\
    \ The `<body>` section contains the actual content of the web page that is visible\
    \ to users, such as text, images, and interactive elements.\n```html\n<body>\n\
    \    <h1>Main Heading</h1>\n    <p>This is a paragraph.</p>\n    <img src=\"image.jpg\"\
    \ alt=\"Image\">\n    <a href=\"https://www.example.com\">Visit Example</a>\n\
    </body>\n```\n\n## Putting It Together\n\nHere's how these components fit together\
    \ in a complete document:\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta\
    \ charset=\"UTF-8\">\n    <title>Page Title</title>\n    <link rel=\"stylesheet\"\
    \ href=\"styles.css\">\n    <script src=\"script.js\"></script>\n</head>\n<body>\n\
    \    <h1>Main Heading</h1>\n    <p>This is a paragraph.</p>\n    <img src=\"image.jpg\"\
    \ alt=\"Image\">\n    <a href=\"https://www.example.com\">Visit Example</a>\n\
    </body>\n</html>\n```\n\nConclusion:The structure of an HTML document provides\
    \ a standardized format for creating web pages. By organizing content within the\
    \ `<html>`, `<head>`, and `<body>` sections, developers can create well-structured\
    \ and semantically meaningful web pages that are easy to maintain and understand.\
    \ In the next chapters, we'll dive deeper into each of these sections and explore\
    \ more advanced HTML concepts.\n\n## Common HTML Elements\n\nHTML elements are\
    \ the building blocks of web pages, each serving a specific purpose in defining\
    \ the structure and content of a webpage. Here's a list of some HTML elements\
    \ along with their descriptions and examples:\n\n1. `<h1>` to `<h6>` (Headings):\
    \ Defines headings of different levels, where `<h1>` is the highest and `<h6>`\
    \ is the lowest.\n```html\n<h1>Main Heading</h1><h2>Subheading</h2>\n```\n2. `<p>`\
    \ (Paragraph): Defines a paragraph of text.\n```html\n<p>This is a paragraph.</p>\n\
    ```\n3. `<a>` (Anchor): Defines a hyperlink, linking to another webpage or resource.\n\
    ```html\n<a href=\"https://www.example.com\">Visit Example</a>\n```\n4. `<img>`\
    \ (Image): Inserts an image into the webpage.\n```html\n<img src=\"image.jpg\"\
    \ alt=\"Description of image\">\n```\n5. `<ul>` and `<ol>` (Unordered and Ordered\
    \ Lists): Defines unordered (bulleted) and ordered (numbered) lists, respectively.\n\
    ```html\n<ul>\n    <li>Item 1</li>\n    <li>Item 2</li>\n</ul>\n<ol>\n    <li>First\
    \ item</li>\n    <li>Second item</li>\n</ol>\n```\n6. `<li>` (List Item): Defines\
    \ an item in a list (`<ul>` or `<ol>`).\n```html\n<ul>\n    <li>Item 1</li>\n\
    \    <li>Item 2</li>\n</ul>\n```\n7. `<table>` (Table): Defines a table for organizing\
    \ data into rows and columns.\n```html\n<table>\n  <tr>\n      <th>Header 1</th>\n\
    \      <th>Header 2</th>\n  </tr>\n  <tr>\n      <td>Data 1</td>\n      <td>Data\
    \ 2</td>\n  </tr>\n</table>\n```\n8. `<tr>` (Table Row): Defines a row within\
    \ a table (`<table>`).\n```html\n<tr>\n    <td>Data 1</td>\n    <td>Data 2</td>\n\
    </tr>\n```\n9. `<th>` (Table Header): Defines a header cell within a table row\
    \ (`<tr>`).\n```html\n<th>Header 1</th>\n```\n10. `<td>` (Table Data): Defines\
    \ a data cell within a table row (`<tr>`).\n```html\n<td>Data 1</td>\n```\n11.\
    \ `<div>` (Division): Defines a division or section in an HTML document, often\
    \ used for grouping and styling purposes.\n```html\n<div class=\"container\">\n\
    \    <!-- Content goes here -->\n</div>\n```\n12. `<span>` (Inline Division):\
    \ Similar to `<div>`, but used for applying styles to inline elements.\n```html\n\
    <p>This is <span style=\"color: red;\">highlighted</span> text.</p>\n```\n13.\
    \ `<form>` (Form): Defines a form for user input, containing input fields, buttons,\
    \ and other interactive elements.\n```html\n<form action=\"/submit-form\" method=\"\
    post\">\n    <label for=\"username\">Username:</label>\n    <input type=\"text\"\
    \ id=\"username\" name=\"username\">\n    <button type=\"submit\">Submit</button>\n\
    </form>\n```\n"
