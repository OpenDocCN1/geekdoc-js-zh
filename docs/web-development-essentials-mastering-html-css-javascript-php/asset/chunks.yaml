  trans: "\n\n这是一个基础 HTML 文档的示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n   \
    \ <meta charset=\"UTF-8\">\n    <title>我的第一个网页</title>\n</head>\n<body>\n    <h1>欢迎来到我的网站</h1>\n\
    \    <p>这是我的第一个网页。</p>\n</body>\n</html>\n```\n\n# HTML 元素与标签\n\nHTML 使用标签（tags）来定义元素。标签被包裹在尖括号中，且大多数元素都有一个开始标签和一个结束标签。内容位于这些标签之间。\n\
    \n示例：\n```html\n<p>这是一个段落。</p>\n```\n\n某些元素（如图像和换行符）是自合的，不需要结束标签。\n\n示例：\n```html\n\
    <img src=\"image.jpg\" alt=\"图片描述\"> <br>\n```\n\n## 常用 HTML 元素\n\n- **标题 (Headings)**：使用\
    \ `<h1>` 到 `<h6>` 标签定义。`<h1>` 是最高级别，而 `<h6>` 是最低级别。\n```html\n<h1>主标题</h1><h2>副标题</h2>\n\
    ```\n- **段落 (Paragraphs)**：使用 `<p>` 标签定义。\n```html\n<p>这是一个段落。</p>\n```\n- **链接\
    \ (Links)**：使用 `<a>` 标签定义。`href` 属性指定 URL。\n```html\n<a href=\"https://www.example.com\"\
    >访问示例</a>\n```\n- **图像 (Images)**：使用 `<img>` 标签定义。`src` 属性指定图像源，`alt` 属性提供备用文本。\n\
    ```html\n<img src=\"image.jpg\" alt=\"图片描述\">\n```\n- **列表 (Lists)**：有序列表 (`<ol>`)\
    \ 和无序列表 (`<ul>`) 包含列表项 (`<li>`)。\n```html\n<ol>\n    <li>第一项</li>\n    <li>第二项</li>\n\
    </ol>\n```\n- **表格 (Tables)**：使用 `<table>` 标签定义。包含行 (`<tr>`)、表头单元 (`<th>`) 和数据单元格\
    \ (`<td>`)。\n```html\n<table>\n  <tr>\n      <th>表头 1</th>\n      <th>表头 2</th>\n\
    \  </tr>\n  <tr>\n      <td>数据 1</td>\n      <td>数据 2</td>\n  </tr>\n</table>\n\
    ```\n\n## 属性 (Attributes)\n\n属性为 HTML 元素提供了额外信息。它们包含在开始标签内，通常以键名/值对的形式出现。\n\n\
    示例：\n```html\n<a href=\"https://www.example.com\" target=\"_blank\">访问示例</a>\n\
    ```\n在此示例中，`href` 是指定 URL 的属性，`target=\"_blank\"` 是指定链接应在新标签页中打开的属性。\n\n## 语义化\
    \ HTML (Semantic HTML)\n\n语义化 HTML 元素以清晰的方式描述了它们的含义，使浏览器和开发者都能理解。示例包括：\n\n- `<header>`：定义文档或章节的页头。\n\
    - `<nav>`：定义导航块。\n- `<article>`：定义一个独立的、自包含的内容内块。\n- `<section>`：定义文档中的一个章节。\n\
    - `<footer>`：定义文档或章节的页脚。\n\n示例：\n```html\n<article>\n  <header>\n    <h1>文章标题</h1>\n\
    \  </header>\n  <section>\n    <p>这是文章的正文内容。</p>\n  </section>\n  <footer>\n \
    \   <p>作者：John Doe</p>\n  </footer>\n</article>\n```\n\n结论：理解基础对于任何 Web 开发者来说都是至关重要的。这是创建结构化且有意义网页的第一步。在下一章节中，你将学习如何使用\
    \ CSS 添加布局来增强你的网页。\n\n## HTML 文档的结构\n\nHTML（超文本语言）文档遵循特定的结构，为创建网页提供了框架。理解这一点对于构建格式良好且组织良好的至关重要。让我们拆解这些组件：\n\
    \n1. **文档声明 (`<!DOCTYPE html>`)**：文档类型声明 (DTD) 定义了文档类型和 HTML 版本。在现代 Web 开发中，使用\
    \ `<!DOCTYPE html>`，因为它兼容所有浏览器。\n```html\n<!DOCTYPE html>\n```\n2. **HTML 元素 (`<html>`)**：`<html>`\
    \ 元素是根元素。它封装了页面上的所有内容。\n```html\n<!DOCTYPE html>\n<html>\n<!-- 内容放在这里 -->\n</html>\n\
    ```\n3. **头部部分 (`<head>`)**：`<head>` 部分包含关于文档的元数据，如标题、字符集以及链到外部资源（如样式表和脚本）的链接。该部分在网页本身上不可见。\n\
    ```html\n<head>\n    <meta charset=\"UTF-8\">\n    <title>页面标题</title>\n    <link\
    \ rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"script.js\"></script>\n\
    </head>\n```\n4. **主体部分 (`<body>`)**：`<body>` 部分包含用户可见的网页实际内容，如文本、图像和交互式元素。\n\
    ```html\n<body>\n    <h1>主标题</h1>\n    <p>这是一个段落。</p>\n    <img src=\"image.jpg\"\
    \ alt=\"图像\">\n    <a href=\"https://www.example.com\">访问示例</a>\n</body>\n```\n\
    \n## 整合 (Putting Together)\n\n以下是这些元素如何在文档中结合使用的示例：\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <meta charset=\"UTF-8\">\n    <title>页面标题</title>\n    <link\
    \ rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"script.js\"></script>\n\
    </head>\n<body>\n    <h1>主标题</h1>\n    <p>这是一个段落。</p>\n    <img src=\"image.jpg\"\
    \ alt=\"图像\">\n    <a href=\"https://www.example.com\">访问示例</a>\n</body>\n</html>\n\
    ```\n\n结论：理解基础对于任何 Web 开发者来说都是至关重要的。这是创建结构化且有意义网页的第一步。在下一章节中，你将学习如何使用 CSS 添加布局来增强你的网页。\n\
    \n*(注：由于原文在后半部分出现了大量重复和断裂的片段，此处根据“不要重复输出原文”的原则，译文已对逻辑进行了整合处理，确保符合翻译要求。)*\n\n"
- fmt: "\nThese are just a few of the many HTML elements available for structuring\
    \ and formatting web content. As you continue learning, you'll encounter more\
    \ elements and gain a deeper understanding of how they can be used to create rich\
    \ and interactive web pages.\n\n## Working with Links, Images, and Media\n\nWorking\
    \ with links, images, and media elements like audio and video is essential for\
    \ creating engaging and interactive web pages. Let's explore how to use these\
    \ elements in HTML:\n\n### Links (`<a>`)\n\nLinks are used to navigate between\
    \ web pages or resources. They can point to other web pages, files, or locations\
    \ within the same page (known as anchor links).\n\n#### External Links\n```html\n\
    <a href=\"https://www.example.com\">Visit Example</a>\n```\n\n#### Internal Anchor\
    \ Links\n```html\n<a href=\"#section-id\">Jump to Section</a>\n```\n\n### Images\
    \ (`<img>`)\n\nImages enhance the visual appeal of web pages and are commonly\
    \ used to display graphics, photos, icons, and logos.\n\n#### Inserting Images\n\
    ```html\n<img src=\"image.jpg\" alt=\"Description of image\">\n```\n\n### Video\
    \ (`<video>`)\n\nThe `<video>` element allows you to embed video content directly\
    \ into your web pages.\n\n#### Basic Video Player\n```html\n<video controls>\n\
    \    <source src=\"video.mp4\" type=\"video/mp4\">\n    Your browser does not\
    \ support the video tag.\n</video>\n```\n\n### Audio (`<audio>`)\n\nSimilar to\
    \ video, the `<audio>` element allows you to embed audio content into your web\
    \ pages.\n\n#### Basic Audio Player\n```html\n<audio controls>\n    <source src=\"\
    audio.mp3\" type=\"audio/mpeg\">\n    Your browser does not support the audio\
    \ tag.\n</audio>\n```\n\n### Hyperlinks with Images\n\nYou can also use images\
    \ as hyperlinks by wrapping them with an `<a>` element.\n```html\n<a href=\"https://www.example.com\"\
    >\n    <img src=\"logo.png\" alt=\"Website Logo\">\n</a>\n```\n\n#### Responsive\
    \ Images\n\nTo ensure images scale appropriately on different devices, you can\
    \ use the `width` and `height` attributes or CSS.\n```html\n<img src=\"image.jpg\"\
    \ alt=\"Description of image\" width=\"500\" height=\"300\">\n```\n\n### Image\
    \ Maps\n\nImage maps allow you to define clickable areas within an image that\
    \ link to different URLs.\n```html\n<img src=\"planets.jpg\" alt=\"Planets\" usemap=\"\
    #planetmap\">\n<map name=\"planetmap\">\n    <area shape=\"circle\" coords=\"\
    180,160,40\" href=\"https://www.example.com/mercury.html\" alt=\"Mercury\">\n\
    \    <area shape=\"circle\" coords=\"230,280,50\" href=\"https://www.example.com/venus.html\"\
    \ alt=\"Venus\">\n</map>\n```\n\n### Conclusion\n\nLinks, images, and media elements\
    \ play a crucial role in creating engaging and interactive web pages. By mastering\
    \ their usage, you can enhance the user experience and effectively communicate\
    \ your content to your audience.\n\n## Forms and Input Elements\n\nForms and input\
    \ elements are essential for gathering user input on web pages, such as submitting\
    \ information, logging in, or interacting with dynamic content. Let's explore\
    \ how to create forms.\n\n### Creating a Form (`<form>`)\n\nThe `<form>` element\
    \ serves as a container for input fields and defines where the form data will\
    \ be sent upon submission.\n```html\n<form action=\"/submit-form\" method=\"post\"\
    >\n    <!-- Input fields go here -->\n    <button type=\"submit\">Submit</button>\n\
    </form>\n```\n\n#### Text Input (`<input type=\"text\">`)\n\nText input fields\
    \ allow users to enter text data, such as usernames or search queries.\n```html\n\
    <label for=\"username\">Username:</label>\n<input type=\"text\" id=\"username\"\
    \ name=\"username\">\n```\n\n#### Password Input (`<input type=\"password\">`)\n\
    \nPassword input fields mask the entered characters for secure password entry.\n\
    ```html\n<label for=\"password\">Password:</label>\n<input type=\"password\" id=\"\
    password\" name=\"password\">\n```\n\n#### Checkbox Input (`<input type=\"checkbox\"\
    >`)\n\nCheckbox input fields allow users to select multiple options from a list.\n\
    ```html\n<input type=\"checkbox\" id=\"option1\" name=\"option1\" value=\"value1\"\
    >\n<label for=\"option1\">Option 1</label>\n```\n\n#### Radio Button Input (`<input\
    \ type=\"radio\">`)\n\nRadio button input fields allow users to select one option\
    \ from a list.\n```html\n<input type=\"radio\" id=\"option1\" name=\"options\"\
    \ value=\"option1\">\n<label for=\"option1\">Option 1</label>\n<input type=\"\
    radio\" id=\"option2\" name=\"options\" value=\"option2\">\n<label for=\"option2\"\
    >Option 2</label>\n```\n\n#### Dropdown List (`<select>` and `<option>`)\n\nDropdown\
    \ lists allow users to select one option from a list of predefined choices.\n\
    ```html\n<label for=\"country\">Country:</label>\n<select id=\"country\" name=\"\
    country\">\n    <option value=\"usa\">USA</option>\n    <option value=\"uk\">UK</option>\n\
    \    <option value=\"canada\">Canada</option>\n</select>\n```\n\n#### Textarea\
    \ (`<textarea>`)\n\nTextarea elements allow users to enter multi-line text data,\
    \ such as comments or messages.\n```html\n<label for=\"message\">Message:</label>\n\
    <textarea id=\"message\" name=\"message\" rows=\"4\" cols=\"50\"></textarea>\n\
    ```\n\n#### File Upload (`<input type=\"file\">`)\n\nFile input fields allow users\
    \ to upload files from their device.\n```html\n<label for=\"file\">Upload File:</label>\n\
    <input type=\"file\" id=\"file\" name=\"file\">\n```\n\n#### Hidden Input (`<input\
    \ type=\"hidden\">`)\n\nHidden input fields are used to send data that is not\
    \ visible to the user.\n```html\n<input type=\"hidden\" name=\"user_id\" value=\"\
    123\">\n```\n\n#### Submit Button (`<button type=\"submit\">`)\n\nSubmit buttons\
    \ are used to submit form data.\n```html\n<button type=\"submit\">Submit</button>\n\
    ```\n\n## Semantic HTML\n\nSemantic HTML refers to the use of HTML elements that\
    \ convey meaning beyond just presentation, making it clear to both humans and\
    \ machines.\n\n### Header\n\nThe `<header>` element represents introductory content,\
    \ typically containing headings, navigation links, and logos. \n```html\n<header>\n\
    \    <h1>Website Title</h1>\n    <nav>\n        <ul>\n            <li><a href=\"\
    #home\">Home</a></li>\n            <li><a href=\"#about\">About</a></li>\n   \
    \         <li><a href=\"#contact\">Contact</a></li>\n        </ul>\n    </nav>\n\
    </header>\n```\n\n### Nav\n\nThe `<nav>` element represents a section of a page\
    \ that links to other pages or sections within the site.\n```html\n<nav>\n   \
    \ <ul>\n        <li><a href=\"#home\">Home</a></li>\n        <li><a href=\"#about\"\
    >About</a></li>\n        <li><a href=\"#contact\">Contact</a></li>\n    </ul>\n\
    </nav>\n```\n\n### Main\n\nThe `<main>` element represents the main content of\
    \ the document, excluding navigation links, headers, and footers.\n```html\n<main>\n\
    \    <h1>Main Content</h1>\n    <p>This is the main content of the page.</p>\n\
    </main>\n```\n\n### Section\n\nThe `<section>` element represents a thematic grouping\
    \ of content, typically with a heading.\n```html\n<section>\n    <h2>Section Title</h2>\n\
    \    <p>Section content goes here...</p>\n</section>\n```\n\n### Article\n\nThe\
    \ `<article>` element represents a self-contained piece of content that can be\
    \ independently distributed or reused.\n```html\n<article>\n    <h2>Article Title</h2>\n\
    \    <p>Article content goes here...</p>\n</article>\n```\n\n### Aside\n\nThe\
    \ `<aside>` element represents content that is tangentially related to the content\
    \ around it, such as sidebars or pull quotes.\n```html\n<aside>\n    <h3>Related\
    \ Articles</h3>\n    <ul>\n</aside>\n```\n"
