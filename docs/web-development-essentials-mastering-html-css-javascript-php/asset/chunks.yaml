  trans: "\n\n`box-sizing` 属性决定了元素总宽度和高度的计算方式。默认值为 `content-box`，它只包含内容，不考虑内边距（padding）、边框（border）或外边距（margin）。不过，你可以使用\
    \ `box-sizing` 属性更改这一行为。\n\n```css\n/* 在总宽度高度中包含内边距和边框 */\n.box {\n  box-sizing:\
    \ border-box;\n}\n```\n\n## 4. 布局技术\n\n### 块级元素与行内元素\n- 块级元素换行并占据可用宽度。\n- 行内元素不换行，仅占据所需的宽度。\n\
    \n### 定位\n- `Static`（静态）：默认定位行为，元素根据文档的正常流排列。\n- `Relative`（相对）：允许你相对于元素的原始位置对其进行定位。\n\
    - `Absolute`（绝对）：将元素从正常流中移除，并相对于其最近的定位祖先元素进行定位。\n- `Fixed`（固定）：相对于视口定位元素，这意味着即使页面滚动，它也会保持相同的位置。\n\
    \n### Flexbox（弹性布局）\nFlexbox 是一种布局模型，提供了一种更高效的方法在容器内分配空间和对齐项目。它为构建复杂的 Web 设计提供了一个灵活且强大的布局系统。\n\
    \n```css\n.container {\n  display: flex;\n  justify-content: center; /* 水平对齐项目\
    \ */\n  align-items: center; /* 垂直对齐项目 */\n}\n```\n\n### Grid（网格布局）\nCSS Grid\
    \ Layout 是一种二维布局系统，允许你轻松创建复杂的基于网格的布局。它对行、列和网格项目提供了精确控制。\n\n```css\n.container\
    \ {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr; /* 三等列 */\n  grid-gap:\
    \ 10px; /* 网格项目之间的间隙 */\n}\n```\n\n### 结论\nCSS 盒模型和布局技术对于创建结构良好且视觉的 Web 布局至关重要。通过理解元素在页面上的尺寸、定位和间距方式，你可以创建适应不同屏幕尺寸和设备的灵活响应式设计。尝试不同的布局技术，以找到适用于特定设计需求的最佳方法。\n\
    \n## 使用媒体查询的响应式设计\n媒体查询是 CSS 中一种强大的工具，允许你根据各种设备特性（如屏幕宽度、高度、方向等）应用不同的样式。这使你能够创建适应不同屏幕尺寸和设备的响应式设计。让我们探索如何使用媒体查询创建响应式布局：\n\
    \n### 1. 语法\n媒体查询使用 `@media` 规则编写，后面紧跟括括号内的一个或多个媒体特征和条件。\n\n```css\n@media screen\
    \ and (max-width: 768px) {\n  /* 当屏幕宽度小于或等于 768px 时应用的样式 */\n}\n```\n\n### 2.\
    \ 常见媒体特征\n- 宽度：`width`\n- 高度：`height`\n- 设备宽度：`device-width`\n- 设备高度：`device-height`\n\
    - 方向：`orientation`（横或横屏）\n- 宽高比：`aspect-ratio`\n- 分辨率：`resolution`\n- 颜色：`color`\n\
    - 悬停能力：`hover`\n- 指针：`pointer`\n- 触摸能力：`pointer: coarse`（粗指针）或 `pointer: fine`（细指针）\n\
    \n### 3. 示例：响应式布局\n```css\n/* 桌面端的默认样式 */\n.container {\n  width: 960px;\n  margin:\
    \ 0 auto;\n}\n\n/* 针对平板的媒体查询 */\n@media screen and (max-width: 768px) {\n  .container\
    \ {\n    width: 90%;\n  }\n}\n\n/* 针对移动设备的媒体查询 */\n@media screen and (max-width:\
    \ 480px) {\n  .container {\n    width: 100%;\n  }\n}\n```\n在此示例中，`.container`\
    \ 元素根据屏幕尺寸调整宽度。它对桌面屏幕有固定宽度（960px），对平板有百分比宽度（视口宽度的 90%），对移动设备有全宽度（视口宽度的 100%）。\n\
    \n### 4. 根据方向应用样式\n```css\n/* 横屏 */\n@media screen and (orientation: landscape)\
    \ {\n  /* 当设备处于横屏方向时应用的样式 */\n}\n\n/* 竖屏 */\n@media screen and (orientation: portrait)\
    \ {\n  /* 当设备处于竖屏方向时应用的样式 */\n}\n```\n\n### 5. 嵌套媒体查询\n你也可以嵌套媒体查询来针对特定范围的屏幕尺寸。\n\
    \n```css\n/* 针对平板的媒体查询 */\n@media screen and (max-width: 768px) {\n  /*在此处嵌套样式\
    \ */\n}\n```\n\n### 6. 移动优先方法\n考虑为移动端编写样式，然后使用媒体查询处理更大的屏幕。\n\n```css\n/* 移动端样式\
    \ */\n.container {\n  width: 100%;\n}\n\n/* 针对平板的媒体查询 */\n@media screen and (min-width:\
    \ 768px) {\n  .container {\n    width: 90%;\n  }\n}\n\n/* 针对桌面端的媒体查询 */\n@media\
    \ screen and (min-width: 960px) {\n  .container {\n    width: 960px;\n  }\n}\n\
    ```\n\n### 结论\nCSS 盒模型和布局技术对于创建结构良好且视觉的 Web 布局至关重要。通过理解元素在页面上的尺寸、定位和间距方式，你可以创建适应不同屏幕尺寸和设备的响应式设计。尝试不同的布局技术，以找到适用于特定设计需求的最佳方法。\n\
    \n## 高级样式技术\nCSS 高级技术超越了基础样式，允许创意效果和交互。让我们探索一些：\n\n### 1. Flexbox\nFlexbox 是一种布局模型，提供了一种更高效的方法在容器内分配空间和对齐项目。它提供了一个灵活且强大的布局系统。\n\
    \n```css\n.container {\n  display: flex;\n  justify-content: center; /* 水平对齐项目\
    \ */\n  align-items: center; /* 垂直对齐项目 */\n}\n```\n\n### 2. Grid Layout\nCSS Grid\
    \ Layout 是一种二维布局系统，允许你轻松创建复杂的基于网格的布局。它对行、列和网格项目提供了精确控制。\n\n```css\n.container\
    \ {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr; /* 三等列 */\n  grid-gap:\
    \ 10px; /* 网格项目之间的间隙 */\n}\n```\n\n### 3. Transitions（过渡）\n过渡允许在指定时间内对 CSS 属性的变化进行动画处理。它们可以创建微妙动画，例如元素淡入或颜色改变。\n\
    \n```css\n.element {\n  transition: background-color 0.3s ease;\n}\n\n.element:hover\
    \ {\n  background-color: #f0f0f0;\n}\n```\n\n### 4. Transformations（变换）\n变换允许你通过平移、旋转、缩放或倾斜在\
    \ 2D 或 3D 空间内修改元素的显示。这允许实现创意效果。\n\n```css\n.element {\n  transform: rotate(45deg)\
    \ scale(1.5);\n}\n```\n\n### 5. Animations（动画）\n动画允许使用关键帧创建复杂的多步动画。你可以定义动画的时机、时长、缓动函数和其他属性。\n\
    \n```css\n@keyframes slide-in {\n  from {\n    transform: translateX(-100%);\n\
    \  }\n  to {\n    transform: translateX(0);\n  }\n}\n\n.element {\n  animation:\
    \ slide-in 0.5s ease forwards;\n}\n```\n\n### 6. Custom Properties（CSS 变量）\nCSS\
    \ 自定义属性也称为 CSS 变量，允许你定义可以在样式表中到处复用值。这促进了一致性并简化了维护。\n\n```css\n:root {\n  --primary-color:\
    \ #007bff;\n}\n\n.element {\n  color: var(--primary-color);\n}\n```\n\n### 7.\
    \ 伪元素与伪类\n\n"
- fmt: "\nPseudo-elements and pseudo-classes allow you to target and style specific\
    \ parts of an element, such as its first line, first letter, or hover state.\n\
    \n```css\n/* Pseudo-element */ .element::before {\n    content: \"•\";\n}\n\n\
    /* Pseudo-class */\n.button:hover {\n    background-color: #f0f0f0;\n}\n```\n\n\
    ## 8. Responsive Typography\n\nUsing relative units like `em`, `rem`, or `%` for\
    \ font sizes allows typography to scale proportionally with the viewport size,\
    \ ensuring optimal readability on all devices.\n\n```css\nbody {\n    font-size:\
    \ 16px;\n}\n\n@media screen and (max-width: 768px) {\n    body {\n        font-size:\
    \ 14px;\n    }\n}\n```\n\n## Conclusion\n\nThese advanced CSS techniques empower\
    \ you to create sophisticated and visually appealing designs with precision and\
    \ control. By mastering these techniques, you can enhance the user experience\
    \ and bring your creative vision to life on the web. Experiment with these techniques\
    \ and explore their possibilities to create stunning and engaging web experiences.\n\
    \n## CSS Frameworks (e.g., Bootstrap, Tailwind CSS)\n\nCSS frameworks like Bootstrap\
    \ and Tailwind CSS provide pre-designed components and utilities that streamline\
    \ the process of building responsive and visually appealing web applications.\
    \ Let's take a closer look at these popular CSS frameworks:\n\n### 1. Bootstrap\n\
    \nBootstrap is one of the most widely used CSS frameworks for building responsive\
    \ and mobile-first websites. It comes with a comprehensive set of pre-styled components,\
    \ such as navigation bars, buttons, forms, and cards, as well as a responsive\
    \ grid system.\n\n### Key Features:\n\n- **Responsive Grid System**: Bootstrap's\
    \ grid system allows you to create responsive layouts by dividing the page into\
    \ rows and columns.\n- **Pre-styled Components**: Bootstrap provides a wide range\
    \ of pre-styled UI components, including buttons, forms, navigation bars, and\
    \ more.\n- **Customizable Themes**: Bootstrap offers customizable themes and utilities\
    \ for easy customization of colors, typography, and spacing.\n- **Extensive Documentation**:\
    \ Bootstrap's documentation is well-organized and comprehensive, making it easy\
    \ to get started and find solutions to common problems.\n\n### Example Usage:\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <title>Bootstrap Example</title>\n    <link href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css\"\
    \ rel=\"stylesheet\">\n</head>\n<body>\n    <div class=\"container\">\n      \
    \  <h1>Hello, Bootstrap!</h1>\n        <button class=\"btn btn-primary\">Click\
    \ me</button>\n    </div>\n    <script src=\"https://code.jquery.com/jquery-3.5.1.slim.min.js\"\
    ></script>\n    <script src=\"https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js\"\
    ></script>\n</body>\n</html>\n```\n\n### 2. Tailwind CSS\n\nTailwind CSS is a\
    \ utility-first CSS framework that provides a set of low-level utility classes\
    \ for building custom designs without writing custom CSS. It offers a highly customizable\
    \ and maintainable approach to styling web applications.\n\n### Key Features:\n\
    \n- **Utility-First Approach**: Tailwind CSS provides a large set of utility classes\
    \ that allow you to style elements directly in your HTML markup.\n- **Customizable\
    \ Configuration**: Tailwind CSS allows you to customize the default theme and\
    \ add new utility classes to suit your project's specific needs.\n- **Responsive\
    \ Design**: Tailwind CSS includes built-in support for responsive design, allowing\
    \ you to easily create layouts that adapt to different screen sizes.\n- **Developer\
    \ Experience**: Tailwind CSS offers a pleasant developer experience with features\
    \ like JIT mode for just-in-time compilation and IntelliSense support in code\
    \ editors.\n\n### Example Usage:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\">\n    <title>Tailwind CSS Example</title>\n\
    \    <link href=\"https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css\"\
    \ rel=\"stylesheet\">\n</head>\n<body>\n    <div class=\"container mx-auto\">\n\
    \        <h1 class=\"text-4xl font-bold text-center\">Hello, Tailwind CSS!</h1>\n\
    \        <button class=\"bg-blue-500 hover:bg-blue-700 text-white font-bold py-2\
    \ px-4 rounded\">Click me</button>\n    </div>\n</body>\n</html>\n```\n\n## Basics\
    \ of JavaScript\n\nJavaScript is a powerful and versatile programming language\
    \ that enables you to add interactivity and dynamic behavior to web pages. These\
    \ basics provide a foundation for understanding JavaScript's core concepts and\
    \ syntax.\n\n### 1. Variables and Data Types\n\nIn JavaScript, variables are used\
    \ to store data. JavaScript supports several types, including:\n\n- **Numbers**:\
    \ Integers or floating-point numbers.\n- **Strings**: Textual data enclosed in\
    \ single or double quotes.\n- **Boolean**: Logical values, true or false.\n- **Arrays**:\
    \ Ordered collections of values.\n- **Objects**: Collections of key-value pairs.\n\
    - **Undefined**: Represents a variable that has been declared but not assigned\
    \ a value.\n- **Null**: Represents the intentional absence of any value.\n\n```javascript\n\
    let num = 10;\nlet str = \"Hello\";\nlet bool = true;\nlet arr = [1, 2, 3];\n\
    let obj = { name: \"John\", age: 30 };\nlet undef;\nlet n = null;\n```\n\n###\
    \ 2. Operators\n\nJavaScript supports various operators for performing operations\
    \ on variables and values, including arithmetic, assignment, comparison, and logical\
    \ operators.\n\n```javascript\nlet x = 5;\nlet y = 3;\nlet z = x + y; // Addition\n\
    let a = x * y; // Multiplication\nlet b = x > y; // Comparison (greater than)\n\
    let c = x === y; // Strict equality\nlet d = x && y; // Logical AND\n```\n\n###\
    \ 3. Control Flow Statements\n\nJavaScript provides control flow statements like\
    \ `if`, `else`, `switch`, `for`, `while`, and `do-while` to control the flow of\
    \ execution based on conditions.\n\n```javascript\nlet age = 18;\nif (age >= 18)\
    \ {\n    console.log(\"You are an adult.\");\n} else {\n    console.log(\"You\
    \ are a minor.\");\n}\n\nlet day = \"Monday\";\nswitch (day) {\n    case \"Monday\"\
    :\n        console.log(\"It's Monday.\");\n        break;\n    case \"Tuesday\"\
    :\n        console.log(\"It's Tuesday.\");\n        break;\n    default:\n   \
    \     console.log(\"It's another day.\");\n}\n```\n\n### 4. Functions\n\nFunctions\
    \ in JavaScript are blocks of reusable code that perform a specific task. They\
    \ can take parameters as input and return values.\n\n```javascript\nfunction greet(name)\
    \ {\n    console.log(\"Hello, \" + name + \"!\");\n}\n\ngreet(\"John\");\n\nfunction\
    \ add(a, b) {\n    return a + b;\n}\n\nlet sum = add(3, 5);\nconsole.log(sum);\
    \ // Output: 8\n```\n\n### 5. DOM Manipulation\n\nJavaScript can manipulate the\
    \ Document Object Model (DOM), which represents the structure of an HTML document,\
    \ to dynamically change the content, structure, and style of web pages.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n    <h2>JavaScript DOM Manipulation</h2>\n  \
    \  <p id=\"demo\">This is a paragraph.</p>\n    <script>\n        document.getElementById(\"\
    demo\").innerHTML = \"Hello, JavaScript!\";\n    </script>\n</body>\n</html>\n\
    ```\n\nConclusion\n\nJavaScript is a powerful and versatile programming language\
    \ that enables you to add interactivity and dynamic behavior to web pages. These\
    \ basics provide a foundation for understanding JavaScript's core concepts and\
    \ syntax. As you continue learning, you'll explore more advanced topics and techniques\
    \ for building interactive web applications.\n"
