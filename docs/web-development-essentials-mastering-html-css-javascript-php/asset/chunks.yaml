    and ordered (numbered) lists, respectively.


    | <ul>     <li>Item 1</li>


        <li>Item 2</li>


    </ul><ol>


        <li>First item</li>


        <li>Second item</li>


    </ol> |


    6.  <li> (List Item): Defines an item in a list (<ul> or  <ol>).


    |     <ul>         <li>Item 1</li>


            <li>Item 2</li>


        </ul> |


    7.  <table> (Table): Defines a table for organizing data into rows and columns.


    |     <table>         <tr>


                <th>Header 1</th>


                <th>Header 2</th>


            </tr>


            <tr>


                <td>Data 1</td>


                <td>Data 2</td>


            </tr>


        </table> |


    8.  <tr> (Table Row): Defines a row within a table (<table>).


    |     <tr>         <td>Data 1</td>


            <td>Data 2</td>


        </tr> |


    9.  <th> (Table Header): Defines a header cell within a table row (<tr>).


    | <th>Header 1</th> |


    10.  <td> (Table Data): Defines a data cell within a table row (<tr>).


    | <td>Data 1</td> |


    11.  <div> (Division): Defines a division or section in an HTML document, often
    used for grouping and styling purposes.


    |     <div class="container">         <!-- Content goes here -->


        </div> |


    12.  <span> (Inline Division): Similar to  <div>, but used for applying styles
    to inline elements.


    | <p>This is <span style="color: red;">highlighted</span> text.</p> |


    13.  <form> (Form): Defines a form for user input, containing input fields, buttons,
    and other interactive elements.


    |     <form action="/submit-form" method="post">         <label for="username">Username:</label>


            <input type="text" id="username" name="username">


            <button type="submit">Submit</button>


        </form> |'
