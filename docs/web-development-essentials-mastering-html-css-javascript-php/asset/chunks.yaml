  trans: "\n\n封装是将数据（属性）和操作这些数据的方法（函数）封装在单个单元（类）中的实践。它隐藏了对象的内部状态，使其不受外部干涉。\n\n```php\n\
    class Student {\n    private $name;\n\n    public function setName($name) {\n\
    \        $this->name = $name;\n    }\n\n    public function getName() {\n    \
    \    return $this->name;\n    }\n}\n```\n\n### 3. 继承\n\n继承允许一个类（子类或后类）从另一个类（父类或父类）继承属性和方法。它促进了代码复用并建立了类的层次结构。\n\
    \n```php\nclass Animal {\n    public function speak() {\n        echo \"Animal\
    \ speaks.\";\n    }\n}\n\nclass Dog extends Animal {\n    // 从 Animal 继承了 speak()\
    \ 方法\n}\n\n$dog = new Dog();\n$dog->speak(); // 输出: Animal speaks.\n```\n\n###\
    \ 4. 多态\n\n多态允许不同类的对象被视为共同父类的对象。它在方法调用和行为上提供了灵活性。\n\n```php\nclass Shape {\n \
    \   public function draw() {\n        echo \"Drawing shape.\";\n    }\n}\n\nclass\
    \ Circle extends Shape {\n    public function draw() {\n        echo \"Drawing\
    \ circle.\";\n    }\n}\n\nclass Rectangle extends Shape {\n    public function\
    \ draw() {\n        echo \"Drawing rectangle.\";\n    }\n}\n\nfunction drawShape(Shape\
    \ $shape) {\n    $shape->draw();\n}\n\n$circle = new Circle();\n$rectangle = new\
    \ Rectangle();\ndrawShape($circle); // 输出: Drawing circle.\ndrawShape($rectangle);\
    \ // 输出: Drawing rectangle.\n```\n\n### 结论\n\nPHP 中的面向对象编程提供了一种组织和构建代码的强大方式，使其更加模块化、可复用且易于维护。通过理解和应用类、对象、封装、继承和多态等概念，你可以创建健壮且可扩展的\
    \ PHP 应用。\n\n## 高级 SQL 查询\n\n高级 SQL 查询允许你执行复杂操作并从数据库中检索特定数据。以下是一些高级 SQL 查询的示例：\n\
    \n### 1. 连接 (Joins)\n\n连接用于根据两个或多个表之间的相关列合并两个或多个表的行。\n\n##### 内连接 (Inner Join)\n\
    选择在两个表中都有匹配值的记录。\n\n```sql\nSELECT orders.order_id, customers.customer_name FROM\
    \ orders\nINNER JOIN customers ON orders.customer_id = customers.customer_id;\n\
    ```\n\n##### 左连接 (Left Join)\n选择左表的所有记录以及右表中的匹配记录。\n\n```sql\nSELECT customers.customer_name,\
    \ orders.order_id FROM customers\nLEFT JOIN orders ON customers.customer_id =\
    \ orders.customer_id;\n```\n\n##### 右连接 (Right Join)\n选择右表的所有记录以及左表中的匹配记录。\n\n\
    ```sql\nSELECT customers.customer_name, orders.order_id FROM customers\nRIGHT\
    \ JOIN orders ON customers.customer_id = orders.customer_id;\n```\n\n### 2. 子查询\
    \ (Subqueries)\n\n子查询允许将一个查询嵌套在另一个查询中。\n\n##### 标量子查询 (Scalar Subquery)\n返回单个值。\n\
    \n```sql\nSELECT product_name, price, (SELECT AVG(price) FROM products) AS avg_price\n\
    FROM products;\n```\n\n##### 相关子查询 (Correlated Subquery)\n在内部查询中使用外部查询的值。\n\n\
    ```sql\nSELECT customer_name FROM customers c\nWHERE EXISTS (\n    SELECT 1\n\
    \    FROM orders o\n    WHERE o.customer_id = c.customer_id\n);\n```\n\n### 3.\
    \ 公用表表达式 (CTEs)\n\nCTEs 提供了一种定义可以在查询内引用的临时结果集的方法。\n\n```sql\nWITH TopCustomers\
    \ AS (\n    SELECT customer_id, SUM(order_amount) AS total_spent\n    FROM orders\n\
    \    GROUP BY customer_id\n    ORDER BY total_spent DESC\n    LIMIT 10\n)\nSELECT\
    \ c.customer_name, tc.total_spent\nFROM TopCustomers tc\nJOIN customers c ON tc.customer_id\
    \ = c.customer_id;\n```\n\n### 4. 窗口函数 (Window Functions)\n\n窗口函数跨当前行相关的行集上执行计算。\n\
    \n```sql\nSELECT product_id, product_name, price, SUM(price) OVER (PARTITION BY\
    \ category_id) AS category_total\nFROM products;\n```\n\n### 5. 透视查询 (Pivot Queries)\n\
    \n透视查询将行转换为列。\n\n```sql\nSELECT * FROM (\n    SELECT product_id, category_id,\
    \ price\n    FROM products\n) AS SourceTable\nPIVOT (\n    AVG(price)\n    FOR\
    \ category_id IN ([1], [2], [3])\n) AS PivotTable;\n```\n\n### 结论\n\n高级 SQL 查询提供了检索和操纵数据的强大工具。通过掌握连接、子查询、`CTE`、窗口函数和透视查询等概念，你可以进行复杂的数据分析并从数据库中生成有价值的见解。\n\
    \n## 数据库规范化\n\n数据库规范化是组织数据库中数据的过程。它涉及将表拆分为更小的表，并定义它们之间的关系，以减少冗余并提高完整性。有几种范式，每种范式都有组织数据的特定规则：\n\
    \n1. **第一范式 (1NF)**：表中的每列必须包含原子值（没有重复组或数组）。每列必须包含包含相同数据类型的值。\n2. **第二范式 (2NF)**：必须满足\
    \ `1NF`。不能有部分依赖：每个非主属性（不属于主键的属性）必须完全依赖于主键。\n3. **第三范式 (3NF)**：必须满足 `2NF`。不能有传递式依赖：每个非主属性必须非传递式地依赖于主键。\n\
    \n### 示例未规范化表：\n\n| OrderID | CustomerName | ProductName | Price |\n| :--- | :---\
    \ | :--- | :--- |\n| 1 | John | Laptop | 1000 |\n| 2 | Mary | Smartphone | 500\
    \ |\n| 3 | John | Tablet | 800 |\n\n### 规范化表\n\n**Customers**\n| CustomerID |\
    \ CustomerName |\n| :--- | :--- |\n| 1 | John |\n| 2 | Mary |\n\n**Products**\n\
    | ProductID | ProductName | Price |\n| :--- | :--- | :--- |\n| 1 | Laptop | 1000\
    \ |\n| 2 | Smartphone | 500 |\n| 3 | Tablet | 800 |\n\n**Orders**\n| OrderID |\
    \ CustomerID | ProductID |\n| :--- | :--- | :--- |\n| 1 | 1 | 1 |\n| 2 | 2 | 2\
    \ |\n\n### 规范化的 de\n\n- 减少数据冗余：每个数据只存储在一个地方，减少了不一致的风险。\n- 提高数据完整性：更新、插入和删除不太可能产生异常。\n\
    - 简化查询：规范化的表通常更容易查询和维护。\n\n## 使用框架（例如 Laravel）\n\n使用像 Laravel 这样的框架可以通过预构建的组件、库和最佳实践来显著加速\
    \ Web 应用的开发。以下是如何使用 Laravel 构建 Web 应用：\n\n### 1. 安装 Laravel\n\n首先，你需要在你的系统中安装\
    \ Laravel。你可以使用 Composer（一个 PHP 依赖管理器）来实现。\n\n```bash\ncomposer create-project\
    \ --prefer-dist laravel/laravel mywebapp\n```\n\n该命令创建一个名为 `mywebapp` 的新 Laravel\
    \ 项目。\n\n### 2. 定义路由\n\n在 Laravel 中，路由在 `routes/web.php` 文件中定义。你可以定义路由来处理不同的 HTTP\
    \ 请求并将它们映射到控制器操作。\n\n"
