    </head>\n<body>\n    <!-- 你的内容在这里 -->\n</body>\n</html>\n```\n\n### 文本元素\n\n-\
    \ `<h1>` 到 `<h6>`：标题（字体从大到小）\n- `<p>`：段落\n- `<a href=\"#\">`：锚点（链接）\n- `<strong>`\
    \ 或 `<b>`：强强调（粗体）\n- `<em>` 或 `<i>`：强调（斜体）\n- `<span>`：内联容器\n- `<br>`：换行\n- `<hr>`：水平线\n\
    \n### 列表\n\n- `<ul>`：无序列表\n    - `<li>`：列表项\n- `<ol>`：有序列表\n    - `<li>`：列表项\n\
    \n### 图像与多媒体\n\n- `<img src=\"image.jpg\" alt=\"描述\">`：图像\n- `<video src=\"video.mp4\"\
    \ controls>`：视频\n- `<audio src=\"audio.mp3\" controls>`：音频\n\n### 表单\n\n- `<form\
    \ action=\"#\" method=\"post\">`：表单\n    - `<input type=\"text\" name=\"name\"\
    >`：文本输入\n    - `<input type=\"password\" name=\"password\">`：密码输入\n    - `<input\
