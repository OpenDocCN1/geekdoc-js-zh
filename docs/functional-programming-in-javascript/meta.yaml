    \ initial model and displays on the screen. The user actions generate messages.\
    \ The `update` handles those action and updates the model. When the model is changed\
    \ the `view` function is called to render the new model on screen. This flow repeats\
    \ endlessly.\n\n## Counter with React and Redux\n\nNow let's implement the same\
    \ counter page in JavaScript with React and Redux.\n\n### Model\n\nThe model defines\
