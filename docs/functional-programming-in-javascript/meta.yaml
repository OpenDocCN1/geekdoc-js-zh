  md: '# What''s next?


    If you want to put in practice what you learned and build modern React applications
    using functional components and functional programming principles consider reading
    [Functional React, 2nd Edition](https://example.com).


    Continue your learning path with [Functional Architecture with React and Redux](https://example.com)
    and use React and Redux to build several applications with an incremental level
    of complexity.


    The functional architecture implies getting the initial state, showing it to the
    user using the view functions, listening for actions, updating the state based
    on those actions, and rendering the updated state back to the user again.


