  md: "```\nstate => state,\n{ LoadTodos }\n)(List);\n```\n\nThe update function is\
    \ pure. It takes the current model and action and returns the new model. When\
    \ receiving the success message it returns a new model with the new list of to-dos.\n\
    \n```\nfunction reducer(model = initialModel, action){\n  switch(action.type){\n\
    \    case `${LoadTodos.name}_SUCCESS`:\n      return {\n        ...model,\n  \
    \      todos: action.payload.data\n      };\n    default:\n      return model;\n\
    \  }\n}\n```\n\nThat’s it. We manage to make make a fetch call and display the\
    \ results on the screen using only pure functions. We can do it because we have\
    \ at our disposal a set of libraries that handle the impure logic.\n\nNote the\
    \ data flow in this application:\n\n+   - clicking on the refresh button creates\
    \ a message describing a fetch request\n- the Axios middleware intercepts the\
    \ message, makes the fetch call and creates a new success message with the result\n\
    - the update function handles the success message by creating a new model with\
    \ the previous result"
