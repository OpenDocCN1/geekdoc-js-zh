    \n注意此应用中的数据流：\n\n+   - 点击刷新按钮会创建一个描述 fetch 请求的消息\n- Axios 中间件拦截该消息，执行 fetch 调用，并使用结果创建一个新的成功消息\n\
    - 更新函数通过创建一个包含先前结果的新模型来处理成功消息\n\n![](img/64a41332f00094d6262a8288d39ce1de_176_0.png)\n\
    \n仔细想想，这个数据获取逻辑有三个非纯部分：\n\n+   - 从 Web API 获取数据\n- 更新模型对象\n- 在屏幕上渲染数据\n\nRedux-Axios\
    \ 中间件使我们能够使用创建 fetch 命令的纯函数来发起 fetch 请求。Redux 提供了一种使用纯函数更新模型的解决方案。React 提供了一种使用纯视图函数更新\
    \ UI 的解决方案。这很有帮助，但这些并不是我们唯一能写的非纯逻辑。还有更多，比如协调多个网络请求、创建定时器事件、生成随机数、获取当前时间、写入控制台或本地存储等等。我们称它们为*副作用*。\n\
    \n就目前而言，在 JavaScript 中，以函数式风格编写应用的最佳库——React 和 Redux——仍然需要编写非纯逻辑。在这种情况下，我们需要追求高比例的纯函数。80%\
    \ 远比 20% 要好。\n\n## 不可变性\n\n事实证明，不可变性更容易实现。我们只需在创建时冻结对象，它们就会变得不可变。另一个简单的解决方案是使用\
    \ linter 来确保应用中没有发生突变。\n\n不可变数据结构在 Immutable.JS 等库中都有提供。它们提供了优化改进和更友好的公共接口。\n\n\
    在处理列表时，我们不应担心创建中间集合。当列表较小，少于一千条记录时，差异是察觉不到的。当处理包含数千个对象的集合时，我们可以开始使用不会创建中间集合的序列。\n\
    \n## 管道\n\n我们了解了从 `pipe` 工具到在数组、不可变列表、序列、Promise 或 Observable 上链式转换的不同方式，来创建数据转换管道。\n\
    \n所有这些数据结构都包装一个或多个值，并允许我们创建转换包装数据的纯函数管道。通常，有一组所有这些数据扑结构都支持的通用转换，如 `filter`、`map`、`reduce`\
    \ 或 `sort`。\n\n在这种情况下，柯里化技术可用于向管道中的函数传递额外的参数。\n\n函数式编程开始变得关乎使用纯函数管道转换数据。从某种意义上说，函数式编程提倡一种数据流编程风格。\n\
    \n## 循环\n\n纯函数式语言没有循环。这类功能使用数组方法实现，并在特定算法中回退到递归。\n\n就目前而言，还无法禁用 JavaScript 中的所有循环语句，因为它缺少[尾调用](https://en.wikipedia.org/wiki/Tail_call)实现。\n\
    \n## 命名\n\n将应用拆分为纯函数是不够的。我们需要给这些函数起能够揭示意图的名字。所以请花点时间好好命名。如果失败了，应用仍然会难以理解。\n\n\
    ## 目录结构\n\n随着应用的增长，会创建越来越多的函数。你需要找到一种方法来组织这些函数到模块中。这意味着创建具有清晰名称的文件来包含这些函数。然后你需要一种方法来组织这些文件到文件夹中。会有一些通用函数，也会有一些仅在特定模块中使用的函数。\n\
    \n## 总结思考\n\n以函数式风格编写的应用由大量纯函数组成，组织在模块中。我们将这些函数用于管道中，并将它们组合起来以实现所需的功能。函数式编程使代码更易于阅读。不易理解的程序可能导致\
    \ bug，并且通常需要重写。\n\n函数式编程的本质是使用纯函数转换不可变数据。这些转换在管道中变得更富表现力。\n\n## 下一步是什么？\n\n如果你想将所学付诸实践，并使用函数式组件和函数式编程原则构建现代\
    \ React 应用，请考虑阅读 [Functional React, 2nd Edition](https://example.com)。\n\n继续你的学习路径，阅读\
    \ [Functional Architecture with React and Redux](https://example.com)，使用 React\
    \ 和 Redux 构建复杂度逐步提升的多个应用。\n\n函数式架构意味着获取初始状态，使用视图函数将其展示给用户，监听动作，基于这些动作更新状态，然后将更新后的状态再次渲染给用户。\n\
    \n![](img/64a41332f00094d6262a8288d39ce1de_180_0.png)\n\n享受 JavaScript 和 React\
    \ 函数式编程系列书籍！\n\n## 目录\n\n- 第 01 章：基本类型\n- 第 02 章：不可变数据对象\n- 第 03 章：函数\n- 第 04\
    \ 章：数组\n- 第 05 章：一等函数\n- 第 06 章：语句\n- 第 07 章：递归\n- 第 08 章：管道与柯里化\n- 第 09 章：函子\n\
    - 第 10 章：单子\n- 第 11 章：不可变集合\n- 第 12 章：惰性转换\n- 第 13 章：生成器\n- 第 14 章：Promise\n-\
    \ 第 15 章：Observable\n- 第 16 章：Elm 架构\n- 第 17 章：函数式范式\n"
