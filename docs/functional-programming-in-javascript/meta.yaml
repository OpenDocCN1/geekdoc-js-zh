    \ 1;\n    }\n  }\n}\n\nconst sortedNumbers = numbers.slice().sort(asc);\nconsole.log(sortedNumbers);\n\
    // [1, 2, 3, 4]\n```\n\n`sort` 方法使用比较函数来执行排序。\n\n`asc` 函数就是比较函数。它是一个二元函数。它接收两个值并返回\
    \ `-1`、`0` 或 `1`。\n\n考虑比较函数接收两个值 `a` 和 `b`。\n\n-   如果值相等，则返回 `0`\n-   如果值 `a`\
    \ 排在值 `b` 之前，则返回 `-1`\n-   如果值 `a` 排在值 `b` 之后，则返回 `1`\n\n`sort` 是一个不纯的方法。它会修改输入的数组。这就是它会产生\
