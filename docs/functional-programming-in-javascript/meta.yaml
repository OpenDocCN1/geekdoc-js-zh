    - [第13章：生成器](https://example.com)\n  - [有限生成器](https://example.com)\n  - [toArray](https://example.com)\n\
    \  - [forEach](https://example.com)\n  - [take](https://example.com)\n  - [自定义生成器](https://example.com)\n\
    \  - [回顾](https://example.com)\n- [第14章：Promise](https://example.com)\n  - [创建\
    \ Promise](https://example.com)\n  - [成功处理](https://example.com)\n  - [错误处理](https://example.com)\n\
    \  - [链式调用](https://example.com)\n  - [异步操作](link)\n  - [函子定律](link)\n  - [单子定律](link)\n\
    \  - [回顾](link)\n- [第15章：Observable](link)\n  - [创建操作符](link)\n  - [管道操作符](link)\n\
    \  - [观察者](link)\n  - [订阅](link)\n  - [高阶 Observable](link)\n  - [扁平化操作符](link)\n\
    \  - [组合 Observable](link)\n  - [函子定律](link)\n  - [单子定律](link)\n  - [回顾](link)\n\
    - [第16章：Elm 架构](link)\n  - [Elm 架构](link)\n  - [使用 Elm 的计数器](link)\n  - [使用 React\
    \ 和 Redux 的计数器](link)\n  - [使用 Elm 的随机数](link)\n  - [使用 React 和 Redux 的随机数](link)\n\
    \  - [回顾](link)\n- [第17章：函数式范式](link)\n  - [纯性](link)\n  - [不可变性](link)\n  - [管道](link)\n\
    \  - [循环](link)\n  - [命名](link)\n  - [结语](link)\n- [下一步？](link)\n\n## 引言\n\n函数式编程正变得越来越流行，本书旨在阐明如何将\
    \ JavaScript 用作函数式语言。\n\n事实证明，JavaScript 具备作为函数式语言所需的一切条件。我们只需要从语言中移除一些特性即可。\n\
    \n本质上，我们将从代码中移除 `this` 关键字。这意味着我们将不使用类，也不使用包含 `this` 关键字的方法。这也意味着不使用自定义原型。\n\n\
    移除 `this` 还有其他好处。`this` 是 JavaScript 中许多困惑的根源，主要是因为它取决于函数的调用方式，而不是函数的定义位置。在很多情况下，`this`\
    \ 指向了一个意外的函数上下文，从而导致 bug。通过移除 `this`，所有相关问题都消失了。\n\nJavaScript 既是一种函数式编程语言，也是一种基于原型的语言。如果我们去掉\
    \ `this`，JavaScript 就成为一种函数式编程语言。这甚至更好。\n\n话虽如此，我们可以通过启用代码检查来从代码中移除 `this`。\n\n\
    以下是一个 lint 配置文件的示例，它禁止在基于 [Create React App](https://create-react-app.dev) 构建的应用程序中使用\
    \ `this` 关键字。\n\n```\n{\n  \"extends\": [\"react-app\"],\n  \"plugins\": [\n \
    \   \"immutable\"\n  ],\n  \"rules\": {\n    \"immutable/no-this\": \"error\"\n\
    \  }\n}\n```\n\n没有 `this` 的 JavaScript 看起来更像是一种更好的函数式编程语言。\n\n**源代码** 本书的项目文件可在\
    \ [https://github.com/cristi-salcescu/functional-programming-in-javascript](https://github.com/cristi-salcescu/functional-programming-in-javascript)\
    \ 获取先祖。\n\n**反馈** 我很乐意听取您的反馈。如有关于本书的评论、问题或建议，请发送邮件至 [cristisalcescu@gmail.com](mailto:cristisalcescu@gmail.com)。提前感谢您考虑撰写书评。\n\
    \n## 环境搭建\n\n首先，我们需要搭建开发环境以使用最新的 JavaScript 特性。\n\n**包管理器**\n\n包管理器是一种用于以简单易懂的方式跟踪项目依赖的工具。在撰写本文时，Node.js\
    \ 包管理器，简称 `npm`，是最受欢迎的。让我们开始安装 [Node.js](https://nodejs.org/)。\n\n然后可以在命令提示符中使用以下命令检查\
    \ Node.js 和 npm 的版本：\n\n```\nnode --version\n```\n\n```\nnpm --v\n```\n\n**NPM\
    \ 包**\n\n使用 npm 我们可以安装额外的包。这些包就是应用程序的依赖项。\n\n`package.json` 文件存储了项目中使用的所有 node\
    \ 包。这些包就是应用程序的依赖项。应用程序可以与其他开发者共享，而无需共享所有 node 包。可以使用 `npm install` 命令安装 `package.json`\
    \ 文件中定义的所有包。\n\n首先使用 npm 创建一个 package.json 文件。\n\n```\nnpm init\n```\n\n我们需要一个将\
    \ JavaScript 代码转换为向后兼容版本并支持[模块](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules)的工具。我们需要\
    \ [Babel](https://babeljs.io/)。去安装必要的包吧。\n\n```\nnpm install @babel/core @babel/node\
    \ @babel/preset-env --save\n```\n\n已安装的包可以在 `node_modules` 文件夹中找到。`--save` 标志告诉\
    \ npm 将包要求存储在 `package.json` 文件中。\n\n为了使用最新的 JavaScript，我们需要启用一个预设。创建 `.babelrc`\
    \ 文件并启用 [babel/preset-env](https://babeljs.io/docs/en/babel-preset-env) 预设。\n\n\
    ```\n{\n  \"presets\": [\"@babel/preset-env\"]\n}\n```\n\n**代码检查**\n\n代码检查是分析代码中潜在错误和风格问题的过程。代码检查工具是一种运行并报告这些问题的工具。代码检查工具还有助于代码格式化和使用最佳实践。\n\
    \n我们将使用 [ES Lint](https://eslint.org/)。先安装它。\n\n```\nnpm install eslint --save-dev\n\
    ```\n\n代码检查规则可以在名为 `.eslintrc.*` 的配置文件中定义。\n\n接下来，设置一个配置文件。\n\n```\nnpx eslint\
    \ --init\n```\n\n我们要使用的一个插件是 [eslint-plugin-functional](https://www.npmjs.com/package/eslint-plugin-functional)，所以来安装它。\n\
    \n```\nnpm install eslint-plugin-functional --save-dev\n```\n\n现在打开 `.eslintrc.json`\
    \ 配置文件，编写禁止使用该关键字的代码检查规则。\n\n```\n{\n  \"plugins\": [\n    \"functional\"\n  ],\n\
    \  \"rules\": {\n    \"functional/no-this-expression\": \"error\"\n  }\n}\n```\n\
    \n以下是如何在 `src` 文件夹中的所有文件上运行代码检查。\n\n```\nnpx eslint src\n```\n\n在基于 [Create React\
    \ App](https://create-react-app.dev/) 创建的应用程序中，我们可以通过在\n"
