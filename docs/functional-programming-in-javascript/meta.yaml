  md: "When the update function receives the `SetNumber` messages with the random\
    \ number it returns a new model containing the newly generated number. The update\
    \ function does not generate any command in this case, it returns `Cmd.none` .\n\
    \nAs noticed in order to work with impure logic the update function returns two\
    \ things for each message, the new model and a new command that the Elm framework\
    \ has to execute.\n\nHere is how we can write a function that returns two values\
    \ in JavaScript. We simply return an array containing the two values. Then we\
    \ use the [destructuring assignment](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring_assignment)\
    \ syntax on the left-hand side of the assignment to unpack the returned values.\n\
    \n```\nfunction update(model, action){\n  switch(action.type){\n    case 'GenerateNumber'\
    \ : {\n      const command = {\n        name: 'Random.generate',\n        resultMessage\
    \ : 'SetNumber'\n      };\n      \n      return [model, command];\n    }\n   \
    \ \n    case 'SetNumber' : {\n      const newModel = { ...model, number: action.payload\
    \ };\n      const command = { name: 'Cmd.none' };\n      return [newModel, command];\n\
    \    }\n    \n    default : {\n      const command = { name: 'Cmd.none' };\n```"
