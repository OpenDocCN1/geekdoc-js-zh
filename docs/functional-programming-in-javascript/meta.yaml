  - '[PAGE 172]


    # # Chapter 17: Functional Paradigm


    Now we are going to look back at what it means to program in a functional style.


    The main idea in functional programming is to split the application into small
    pure functions that communicate using immutable data and then compose these functions
    to implement the required functionality.


    Ideally, all the functions in the application should be pure functions.


    **Purity As repeated many times, the point of functional programming is to write
    pure functions. These are functions that just transform values.**


    When a pure function returns the application has the same state as when the function
    was called. An application is much easier to understand when we don’t have to
    track variables changing their values. Pure functions make code easier to follow
    by allowing us to focus our attention in one place.


    The challenge is, of course, to create a practical application doing only transformations
    with pure functions. Is that even possible?


    We saw that it is achievable if we have the right framework using these pure functions
    and doing the impure logic necessary for a practical application. Such architecture
    was implemented in Elm.


    Here is the flow of executing impure logic in Elm:'
- md: "+   - The pure update function creates a command describing the impure logic\n\
    - The Elm framework takes the command, runs the impure logic and generates a message\
    \ containing the result\n- The pure update function handles this message by creating\
    \ a new updated model holding the previous result\n\nThis kind of approach requires\
    \ having functions to create commands for any kind of impure logic and using a\
    \ framework able to understand those commands.\n\nNext, we are going to look at\
    \ a similar approach for making a fetch call with React and Redux using only pure\
    \ functions. The fetch call itself is a side-effect, so invoking it in a function\
    \ makes that function impure.\n\nLuckily for us, there is a [Redux middleware](link),\
    \ called [Axios middleware](link) that can intercept fetch messages, do the fetch\
    \ call, and then put the result in a new success message.\n\nLet's look at the\
    \ parts required to implement this functionality.\n\nThe model initially stores\
    \ just an empty list of to-dos.\n\n```javascript\nconst initialModel = {\n  todos:\
    \ []\n};\n```\n\nThe message object describing the fetch request is created using\
    \ the LoadTodos pure function.\n\n```javascript\nfunction LoadTodos(){\n  return\
    \ {\n    type: LoadTodos.name,\n    payload: {}\n  };\n}\n```\n\nThe List view\
    \ function is pure. It takes the list of todos and creates an HTML. It creates\
    \ a refresh button that sends LoadTodos messages on clicks.\n\n```javascript\n\
    import React from 'react';\nimport { connect } from 'react-redux';\nimport { LoadTodos\
    \ } from './store';\n\nfunction List({todos, LoadTodos}){\n  return(\n   <div>\n\
    \    <button\n     type=\"button\"\n     onClick={LoadTodos}>\n      Refresh\n\
    \    </button>\n    { todos.map(todo =>\n       <div>{todo.title}</div> )}\n \
    \  </div>\n  )\n}\n\nexport default connect(\n  state => state,\n  { LoadTodos\
    \ }\n)(List);\n```\n\nThe update function is pure. It takes the current model\
    \ and action and returns the new model. When receiving the success message it\
    \ returns a new model with the new list of to-dos.\n\n```javascript\nfunction\
    \ reducer(model = initialModel, action){\n  switch(action.type){\n    case `${LoadTodos.name}_SUCCESS`:\n\
    \      return {\n        ...model,\n        todos: action.payload.data\n     \
    \ };\n    default:\n      return model;\n  }\n}\n```\n\nThat’s it. We managed\
    \ to make a fetch call and display the results on the screen using only pure functions.\
    \ We can do it because we have at our disposal a set of libraries that handle\
    \ the impure logic.\n\nNote the data flow in this application:\n\n+   - clicking\
    \ on the refresh button creates a message describing a fetch request\n- the Axios\
    \ middleware intercepts the message, makes the fetch call and creates a new success\
    \ message with the result\n- the update function handles the success message by\
    \ creating a new model with the previous result\n\n![](img/64a41332f00094d6262a8288d39ce1de_176_0.png)\n\
    \nWhen you think about it, this logic for retrieving data has three impure parts:\n\
    \n+   - fetching the data from a Web API\n- updating the model object\n- rendering\
    \ the data on the screen\n\nThe Redux-Axios middleware enabled us to make fetch\
    \ requests using pure functions creating fetch commands. Redux offers a solution\
    \ to update the model using pure functions. React gives a solution to update the\
    \ UI using pure view functions. It helps but these are not the only kinds of impure\
    \ logic we can write. There are many more like coordinating several network requests,\
    \ creating timer events, generating random numbers, getting the current time,\
    \ writing to the console or to the local storage, and so on. We call them side-effects.\n\
    \nIn JavaScript at the moment of writing the best libraries for writing applications\
    \ in a functional style, React and Redux, still require to write impure logic.\
    \ In this case, we need to aim for a high percentage of pure functions. 80% is\
    \ much better than 20%.\n\n## Immutability\n\nIt turns out that immutability is\
    \ much easier to achieve. We can simply freeze objects at creation and they become\
    \ immutable. Another simple solution is to use a linter to make sure no mutations\
    \ are done in the application.\n\nImmutable data structures are available in libraries\
    \ like Immutable.JS. They offer optimization improvements and a nicer public interface.\n\
    \nWe should not be concerned about creating intermediate collections when processing\
    \ a list. When the list is small, less than a thousand records the difference\
    \ is indistinguishable. When working with collections of thousands of objects\
    \ we can start using sequences that do not create intermediate collections.\n\n\
    ## Pipelines\n\nWe saw different ways of creating pipelines of data transformations\
    \ from the `pipe` utility to the chaining transformations on arrays, immutable\
    \ lists, sequences, promises, or observables.\n\nAll these data structures wrap\
    \ one or more values and allow us the create pipelines of pure functions transforming\
    \ the wrapped data. Usually, there are a set of common transformations like `filter`,\
    \ `map`, `reduce`, or `sort` that all these data structures support.\n\nThe currying\
    \ technique is useful in this case to pass additional arguments to the functions\
    \ in the pipeline.\n\nFunctional programming starts to be about transforming data\
    \ with pipelines of pure functions. In a sense, functional programming promotes\
    \ a data-flow programming style.\n\n## Loops\n\nPurely functional languages do\
    \ not have loops. Such functionalities are implemented using the array methods\
    \ and falling back to recursion for specific algorithms.\n\nAt the moment of writing\
    \ it is not possible to disable all loop statements in JavaScript because it lacks\
    \ the [tail-call](https://en.wikipedia.org/wiki/Tail_call) implementation.\n\n\
    ## Naming\n\nSplitting the application into pure functions is not enough. We need\
    \ to give intention revealing names to those functions. So take your time to do\
    \ that. If you failed the application will still be harder to understand.\n\n\
    ## Folder Structure\n\nAs the application grows more and more functions will be\
    \ created. You will need to find a way to structure these functions in modules.\
    \ That means creating files with a clear name containing those functions. Then\
    \ you need a way to structure those files in folders. There will be common functions\
    \ and there will be functions used only in a specific module.\n\n## Final Thoughts\n\
    \nAn application written in a functional style consists of numerous pure functions,\
    \ organized into modules. We use these functions into pipelines and compose them\
    \ to implement the required functionalities. Functional programming makes code\
    \ easier to read. Programs that are not easily understood may lead to bugs and\
    \ are most often remade.\n\nThe essence of functional programming is transforming\
    \ immutable data using pure functions. These transformations become more expressive\
    \ in pipelines.\n\n## What's next?\n\nIf you want to put in practice what you\
    \ learned and build modern React applications using functional components and\
    \ functional programming principles consider reading [Functional React, 2nd Edition](https://example.com).\n\
    \nContinue your learning path with [Functional Architecture with React and Redux](https://example.com)\
    \ and use React and Redux to build several applications with an incremental level\
    \ of complexity.\n\nThe functional architecture implies getting the initial state,\
    \ showing it to the user using the view functions, listening for actions, updating\
    \ the state based on those actions, and rendering the updated state back to the\
    \ user again.\n\n![](img/64a41332f00094d6262a8288d39ce1de_180_0.png)\n\nEnjoy\
    \ the Functional Programming with JavaScript and React book series!\n\n## Table\
    \ of Contents\n\n- Chapter 01: Primitives\n- Chapter 02: Immutable Data Objects\n\
    - Chapter 03: Functions\n- Chapter 04: Arrays\n- Chapter 05: First-Class Functions\n\
    - Chapter 06: Statements\n- Chapter 07: Recursion\n- Chapter 08: Pipelines and\
    \ Currying\n- Chapter 09: Functors\n- Chapter 10: Monads\n- Chapter 11: Immutable\
    \ Collections\n- Chapter 12: Lazy Transformations\n- Chapter 13: Generators\n\
    - Chapter 14: Promises\n- Chapter 15: Observables\n- Chapter 16: Elm Architecture\n\
    - Chapter 17: Functional Paradigm"
