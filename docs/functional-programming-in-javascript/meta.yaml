- md: "## Chapter 14: Promises\n\nA promise is an object containing a future result.\n\
    \nA promise has three states: pending, fulfilled, and rejected.\n\n- Pending is\
    \ the initial state of a promise. The result is not available at this stage.\n\
    - Fulfilled is the state marking a successful operation. The result is available\
    \ at this point.\n- Rejected is the state marking a failed operation. The result\
    \ is not available, instead, we have access to the error object giving the details\
    \ of why the operation failed.\n\nInitially, the promise starts with the pending\
    \ state. Then it can go to fulfilled or rejected states. Once a promise is fulfilled\
    \ or rejected, it stays in that state.\n\nHere is a representation of the flow\
    \ a promise can go through.\n\n## Creating Promises\n\nLet’s start by creating\
    \ a simple promise.\n\n```javascript\nfunction delay(interval){\n  return new\
    \ Promise(function(resolve){\n    return setTimeout(resolve, interval);\n  });\n\
    }\n\nfunction logDone(){\n  console.log('Done');\n}\n\ndelay(1000)\n  .then(logDone);\n\
    ```\n\n`delay` creates a promise that will resolve in a specific amount of time.\
    \ We can use it to delay the execution of a task.\n\nCreating a promise with `new\
    \ Promise` requires passing in a function called the executor function. This function\
    \ takes two callbacks, `resolve` and `reject`, that can be called later to change\
    \ the state of the promise. The executor function runs automatically when the\
    \ promise is created.\n\n`Promise` has two utility static methods, `resolve` and\
    \ `reject`, to quickly create a resolved or rejected promise.\n\n`Promise.resolve(value)`\
    \ creates a resolved promise wrapping a `value`.\n\n`Promise.reject(error)` creates\
    \ a rejected promise.\n\n## Success Handling\n\nMapping `then` acts as a map.\
    \ It takes a mapping function and returns a promise containing the transformed\
    \ value.\n\nWe can use a `Promise.resolve` to create a simple mappable object\
    \ wrapping a value. Then we can transform and inspect the wrapped value.\n\n```javascript\n\
    function toUpperCase(text){\n  return text.toUpperCase();\n}\n\nfunction logIdentity(value){\n\
    \  console.log(value);\n  return value;\n}\n\nPromise.resolve('sTudY')\n  .then(logIdentity)\
    \ //\"sTudY\"\n  .then(toUpperCase)\n  .then(logIdentity); //\"STUDY\"\n```\n\n\
    ## Flat Mapping\n\n`then` acts also like a flat map.\n\nWhen the mapping function\
    \ returns a value, `then` returns a promise containing the transformed value.\
    \ To be more precise, we should say that the mapping function returns a value\
    \ that is not a promise.\n\nWhen the mapping function returns a promise wrapping\
    \ a value, `then` does not wrap it into another promise. It just returns the new\
    \ promise containing the transformed value.\n\nWrapping a promise into another\
    \ promise would have meant to create a promise which contains a promise which\
    \ wraps a value.\n\nTake a look at a function, dividing two numbers, that is used\
    \ as a mapping function on a promise.\n\n```javascript\nfunction devideBy(n, divisor){\n\
    \  return n / divisor;\n}\n\nfunction logIdentity(value){}\n\nPromise.resolve(9)\n\
    \  .then(logIdentity) //9\n  .then(n => devideBy(n, 3))\n  .then(logIdentity);\
    \ //3\n```\n\nWe can implement `devideBy` as a curried function and use it more\
    \ nicely with `then`.\n\n```javascript\nfunction devideBy(divisor){\n  return\
    \ function(n){\n    return n / divisor;\n  }\n}\n\nPromise.resolve(9)\n  .then(logIdentity)\
    \ //9\n  .then(devideBy(3))\n  .then(logIdentity); //3\n```\n\nWhen `devideBy`\
    \ returns a promise instead of number, `then` waits for that promise to complete\
    \ and returns a promise wrapping the transformed value.\n\n```javascript\nfunction\
    \ devideBy(divisor){\n  return function(number){\n    const result = number /\
    \ divisor;\n    return Promise.resolve(result);\n  }\n}\n\nPromise.resolve(9)\n\
    \  .then(logIdentity) //9\n  .then(devideBy(3))\n  .then(logIdentity); //3\n```\n\
    \n## Error Handling\n\n`catch` handles errors in a promise chain.\n\nBelow is\
    \ an example of error handling using `catch`.\n\n```javascript\nfunction devideBy(divisor){\n\
    \  return function(number){\n    const result = number / divisor;\n    return\
    \ (divisor !== 0)\n      ? Promise.resolve(result)\n      : Promise.reject(\"\
    Can't divide by 0\")\n  }\n}\n\nfunction logError(error){\n  console.error(error);\n\
    }\n\nPromise.resolve(9)\n  .then(logIdentity) //9\n  .then(devideBy(0))\n  .then(logIdentity)\n\
    \  .catch(logError) //\"Can't divide by 0\"\n```\n\nIf there is an error in any\
    \ transformation step the flow jumps down the closest error handler.\n\n## Chaining\n\
    \nAs you noticed, we can chain several transformations on the wrapped value.\n\
    \nThe `then` method on a resolved promise will return a new promise. Likewise,\
    \ the `catch` method of a rejected promise will return a new promise. This creates\
    \ a pipeline of transformations where each transform function takes as input the\
    \ result of the previous one.\n\n```javascript\nfunction toCelsius(kelvin){\n\
    \  const celsius = (kelvin - 273.15);\n  return Math.round(celsius * 100) / 100;\n\
    }\n\nfunction toChangeAction(temperature){\n  return {\n    type : 'CHANGE_TEMPERATURE',\n\
    \    temperature\n  }\n}\n\nfunction logIdentity(value){}\n\nPromise.resolve(280)\n\
    \  .then(logIdentity)\n  .then(toCelsius)\n  .then(logIdentity)\n  .then(toChangeAction)\n\
    \  .then(logIdentity);\n//280\n//6.85\n//{ type: 'CHANGE_TEMPERATURE', temperature:\
    \ 6.85 }\n```\n\n`toCelsius` takes the 280-kelvin temperature as input and returns\
    \ 6.85. `toChangeAction` takes as input the 6.85-celsius temperature and returns\
    \ an action object containing the new celsius value.\n\n## Asynchronous Operations\n\
    \nThe code written so far was synchronous. That means we had the result of executing\
    \ a function immediately.\n\nConsider the next code.\n\n```javascript\nconst result\
    \ = Math.pow(2, 3);\nconsole.log(result);\n//8\n```\n\nOnce we execute `Math.pow`\
    \ we have the result.\n\nNow think about what it means to make a call to a Web\
    \ API and have the returned data in a variable.\n\n```javascript\nconst result\
    \ = fetch('/todos')\n```\n\nIn order to have the data returned by the Web API\
    \ inside the `result` variable, we need to wait for the `fetch` call to finish.\
    \ Waiting means blocking the UI and we don't want that.\n\nPromises offer a solution\
    \ to this scenario. Instead of returning the result, the `fetch` call returns\
    \ a promise that will later give access to the result when it is available.\n\n\
    ## Parcel\n\nWe can test the network call by starting a development server. We\
    \ can create one using the [Parcel](https://parceljs.org/) web application which\
    \ requires zero configuration.\n\nFirst, install Parcel.\n\n```bash\nnpm install\
    \ parcel-bundler --save-dev\n```\n\nNext, create an `index.html` and reference\
    \ the js files you want to check.\n\n```html\n<html>\n<body>\n<script src=\"./ajax.js\"\
    ></script>\n</body>\n</html>\n```\n\nThen, add the dev task scripts in the `package.json`.\n\
    \n```json\n{\n    \"scripts\": {\n        \"dev\": \"parcel index.html\"\n   \
    \ }\n}\n```\n\nNow, you can start the development server and access the `index.html`\
    \ page.\n\n## Fetch\n\nThe [Fetch API](https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API)\
    \ provides an interface for fetching resources. The `fetch` function takes as\
    \ input an URL and returns a promise that resolves to the `Response` of the request.\
    \ It fails when the request fails.\n\nHere is an example of making a fetch call\
    \ and accessing the result in the returned promise.\n\n```javascript\nfunction\
    \ toJson(response){\n    return response.json();\n}\n\nfunction logIdentity(value){}\n\
    \nfunction logError(error){\n    console.error(error);\n}\n\nfetch('https://api.github.com/gists/public')\n\
    \  .then(toJson)\n  .then(logIdentity)\n  .catch(logError);\n```\n\nThe `json()`\
    \ method converts the response to a JavaScript object. It returns a promise wrapping\
    \ the result of parsing the response body text as JSON.\n\n## Promise.race\n\n\
    `Promise.race` takes an array of promises and returns the first one that fulfills\
    \ or rejects.\n\n```javascript\nconst dictionariesPromise =\n  fetch('/dictionaries').then(toJson);\n\
    \nconst todosPromise =\n  fetch('/todos').then(toJson);\n\nPromise.race([\n  dictionariesPromise,\n\
    \  todosPromise\n]).then(logIdentity);\n```\n\n## Promise.all\n\n`Promise.all`\
    \ takes an array of promises and returns a new promise that resolves when all\
    \ of the input's promises have resolved. If one of the input promises it rejected\
    \ it rejects immediately.\n\n`Promise.all` can be used to make sure that all input\
    \ promises have completed successfully.\n\n```javascript\nPromise.all([\n  dictionariesPromise,\n\
    \  todosPromise\n]).then(logIdentity);\n```\n\n## Promise.allSettled\n\n`Promise.allSettled`\
    \ takes an array of promises and returns a promise that resolves after all of\
    \ the input's promises have either fulfilled or rejected. It resolves with an\
    \ array of objects describing the outcome of each promise."
  mdcn: "\n## 第14章：Promise\n\nPromise是一个包含未来结果的对象。\n\nPromise有三种状态：pending（待定）、fulfilled（已完成）和rejected（已拒绝）。\n\
    \n- Pending是Promise的初始状态。此时结果尚不可用。\n- Fulfilled是标记操作成功的状态。此时结果已可用。\n- Rejected是标记操作失败的状态。此时结果不可用，取而代之的是，我们可以访问一个error对象，其中包含操作失败原因的详细信息。\n\
    \n最初，Promise以pending状态开始。然后它可以转换到fulfilled或rejected状态。一旦Promise被完成或拒绝，它将保持在该状态。\n\
    \n以下是Promise可能经历的流程示意图。\n\n## 创建Promise\n\n让我们从创建一个简单的Promise开始。\n\n```javascript\n\
    function delay(interval){\n  return new Promise(function(resolve){\n    return\
    \ setTimeout(resolve, interval);\n  });\n}\n\nfunction logDone(){\n  console.log('Done');\n\
    }\n\ndelay(1000)\n  .then(logDone);\n```\n\n`delay`创建了一个将在特定时间后解析（resolve）的Promise。我们可以用它来延迟任务的执行。\n\
    \n使用`new Promise`创建Promise需要传入一个称为执行器函数的函数。该函数接受两个回调函数，`resolve`和`reject`，稍后可以调用它们来改变Promise的状态。执行器函数在Promise创建时自动运行。\n\
    \n`Promise`有两个实用的静态方法，`resolve`和`reject`，用于快速创建已解析或已拒绝的Promise。\n\n`Promise.resolve(value)`创建一个已解析的Promise，包装一个`value`。\n\
    \n`Promise.reject(error)`创建一个已拒绝的Promise。\n\n## 成功处理\n\n映射`then`的作用类似于map。它接受一个映射函数，并返回一个包含转换后值的Promise。\n\
    \n我们可以使用`Promise.resolve`创建一个简单的、可映射的对象来包装一个值。然后我们可以转换并检查包装的值。\n\n```javascript\n\
    function toUpperCase(text){\n  return text.toUpperCase();\n}\n\nfunction logIdentity(value){\n\
    \  console.log(value);\n  return value;\n}\n\nPromise.resolve('sTudY')\n  .then(logIdentity)\
    \ //\"sTudY\"\n  .then(toUpperCase)\n  .then(logIdentity); //\"STUDY\"\n```\n\n\
    ## 扁平映射\n\n`then`也类似于扁平映射（flat map）。\n\n当映射函数返回一个值时，`then`返回一个包含转换后值的Promise。更准确地说，我们应该说映射函数返回的值本身不是一个Promise。\n\
