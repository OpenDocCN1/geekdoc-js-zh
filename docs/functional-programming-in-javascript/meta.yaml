  md: "observable emits just a single value. The difference can be seen when the inner\
    \ observables emit several values over time.\n\n**mergeMap() Consider a mapping\
    \ function that takes a value and returns an observable emitting the first three\
    \ numbers from a sequence. The sequence of numbers is defined using the input\
    \ value as the c constant and applying the n*c + 1 formula.**\n\nWhen c = 2 the\
    \ sequence formula is 2n + 1 and the first three values are 3 , 5 and 7 .\n\n\
    When c = 4 the sequence formula is 4n + 1 and the first three values are 5 , 9\
    \ and 13 .\n\nHere is the toSequence mapping function creating an observable.\n\
    \n```\nfunction toSequence(x) {\n  const getNTerm = createGetNTerm(x);\n  return\
    \ of(1, 2, 3).pipe(\n    map(getNTerm)\n  )\n}\n```\n\n```\nfunction createGetNTerm(c){\n\
    \  return function(n){\n    return n * c + 1\n  }\n}\n```\n\nWhen invoked with\
    \ the value 2 , toSequence returns an observable emitting 3 , 5 and 7 ."
