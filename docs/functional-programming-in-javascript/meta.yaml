    \  category: 'JavaScript'\n};\n```\n\nconsole.log(book);\n\n键是集合中唯一的字符串。它区分大小写。\n\
    \n我们可以使用点表示法或括号表示法访问属性。\n\n```\nconsole.log(book.title);\n//\"JavaScript Allongé\"\
    \n```\n\nconsole.log(book[\"title\"]);\n\n## 不可变性\n\n不可变性是函数式编程的核心原则之一。\n\n变异意味着更改。说我们更改了对象的属性等同于说我们变异了该对象。\n\
    \n不可变对象一旦创建就无法更改。JavaScript 对象并非如此。它们可以被修改。它们不是不可变的。看下一个例子：\n\n```\nlet fruit\
    \ = {\n  name: 'Apple'\n};\n```\n\n```\nfruit.name = 'Orange'\n//{name : 'Orange'}\n\
    ```\n\n如你所见，我们可以更改现有的 `fruit` 对象。即使我们使用 `const` 关键字声明，情况也是如此。\n\n```\nconst fruit\
    \ = {\n  name: 'Apple'\n};\n```\n\n```\nfruit.name = 'Orange'\n// {name : 'Orange'}\n\
    ```\n\n`const` 关键字指的是变量，而不是它存储的值。这意味着变量不能重新赋值。当它存储的值是不可变的时，它才真正成为一个常量。\n\n## 冻结\n\
    \n为了创建不可变对象，我们可以在创建时冻结它。\n\n```\nconst fruit = Object.freeze({\n  name: 'Apple'\n\
    });\n```\n\n```\nfruit.name = 'Orange'\n```\n\n```\n// Cannot assign to read only\
    \ property 'name' of object\n```\n\n唯一的限制是 `Object.freeze` 执行浅冻结。它影响对象的直接属性，即树结构中的第一级属性。例如，如果其中一个属性包含另一个对象，则该对象将不会受到影响。看下一个例子。\n\
    \n```\nconst book = Object.freeze({\n  name: \"How JavaScript Works\",\n  author:\
    \ {\n    firstName: 'Douglas',\n    lastName: 'Crockford'\n  }\n});\n```\n\nbook.author.firstName\
    \ = '';\n\nbook 对象被更改了。我们不能将新对象重新赋值给 `author` 属性，但可以修改其属性。对于包含其他对象的对象，我们应该使用 `deepFreeze()`\
    \ 工具函数。它将冻结给定对象内所有对象的所有属性。\n\n## Linting\n\n启用不可变性的另一个选项是使用 linter，例如 ESLint。有几个插件可以帮助我们强制实现不可变对象。此类插件有\
    \ `eslint-plugin-functional`、`eslint-plugin-fp` 或 `eslint-plugin-immutable`。我们将使用\
    \ `eslint-plugin-functional`。\n\n```\nnpm install eslint-plugin-functional --save-dev\n\
    ```\n\n安装插件后，修改 lint 配置文件 `.eslintrc.json` 以启用不可变数据。\n\n```\n\"plugins\": [\n\
    \  \"functional\"\n],\n```\n"
