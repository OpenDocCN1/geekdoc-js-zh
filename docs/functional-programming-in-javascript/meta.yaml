- md: "# Chapter 08: Pipelines and Currying\n\n`getTopSelection` takes a tree object\
    \ and returns an array with the top selected values. If the node is checked it\
    \ returns the value of that node as an array with a single element. When the node\
    \ is not checked and has child nodes it returns the top selection of those child\
    \ nodes. `getTopSelection` is called for each child node inside the tree until\
    \ the recursive calls stop at the nodes being checked. Finding a node that is\
    \ checked is the ending condition. `getTopSelection` is not called for the child\
    \ nodes of a node that is checked.\n\n## Recap\n\nA recursive function is a function\
    \ that calls itself until a condition is met.\n\nRecursion offers a simpler solution\
    \ to a set of problems like traversing trees.\n\nAny iterative loop can be implemented\
    \ with recursion but this is not practical until the tail-call optimization is\
    \ supported by major browsers.\n\nPipelines are the typical use case for functional\
    \ programming.\n\nCurrying is commonly used when creating pipelines because the\
    \ functions defining the flow of transformations expect one argument.\n\n**Pipelines**\n\
    \nA pipeline is a series of data transformations where the output of one transformation\
    \ is the input of the next one.\n\nPipelines enable us to write data transformations\
    \ in a more expressive way. Consider the next code:\n\n```javascript\nfunction\
    \ capitalize(text) {\n  return text.charAt(0).toUpperCase() + text.slice(1);\n\
    }\n\nfunction shortenText(text) {\n  return text.substring(0, 8).trim();\n}\n\n\
    const shortText =\n  shortenText(capitalize(\"this is a long text\"));\nconsole.log(shortText);\n\
    //\"This is\"\n```\n\nWe can write these transformations in a more expressive\
    \ way using the pipe utility from a functional library like [lodash](https://lodash.com/)\
    \ or [ramda](https://ramdajs.com/).\n\n```bash\nnpm i lodash --save\n```\n\nHere\
    \ is how the transformations look like in a pipeline.\n\n```javascript\nimport\
    \ { pipe } from 'lodash/fp';\n\nconst shortText = pipe(\n  capitalize,\n  shortenText\n\
    )(\"this is a long text\");\n\nconsole.log(shortText);\n//\"This is\"\n```\n\n\
    The initial text is the input in the pipeline. `capitalize` is the first function\
    \ to process the text. Then the output of this transformation goes as input to\
    \ the next one `shortenText`. Then the pipeline finishes and we get the result.\n\
    \n# Input\n\ncapitalize\n\nshortenText\n\n# Output\n\n**Chaining**\n\nChaining\
    \ is a more common form of defining a pipeline. It requires to work with an object.\n\
    \nConsider the following list of debts.\n\n```javascript\nconst debts = [\n  {\n\
    \    contractNo: 1,\n    daysSinceLastPayment: 91,\n    currency: 'EUR'\n  },\n\
    \  {\n    contractNo: 2,\n    daysSinceLastPayment: 35,\n    currency: 'USD'\n\
    \  },\n  {\n    contractNo: 3,\n    daysSinceLastPayment: 45,\n    currency: 'USD'\n\
    \  }\n];\n```\n\nHere is how we can define a pipeline of transformations using\
    \ chaining.\n\n```javascript\nconst newDebts = debts\n  .filter(isEur)\n  .map(toDebtView);\n\
    \nfunction isEur(debt) {\n  return debt.currency === \"EUR\";\n}\n\nfunction toDebtView(debt)\
    \ {\n  return {\n    ...debt,\n    priority: getPriority(debt)\n  };\n}\n\nfunction\
    \ getPriority(debt) {\n  const days = debt.daysSinceLastPayment;\n  return days\
    \ > 90\n    ? 1\n    : days > 60\n      ? 2\n      : 3;\n}\n```\n\nFirst, the\
    \ debt list is filtered using `isEur` predicate function.\nThen the result of\
    \ this operation is transformed using the `toDebtView` mapping function.\n\nInput\n\
    \n![](img/64a41332f00094d6262a8288d39ce1de_76_0.png)\n\nOutput\n\n# The Identity\
    \ Function\n\nThe identity function is a unary function that returns the value\
    \ it gets as its argument.\n\nIn mathematics, it is defined as f(x) = x.\n\n```javascript\n\
    function identity(value) {\n  return value;\n}\n```\n\nIf we put this transformation\
    \ in the previous pipeline it will just create a copy of the array.\n\nThe `logIdentity`\
    \ function gives a way to inspect the data in the pipeline without affecting the\
    \ flow. It returns the argument it gets but also logs it to the console.\n\n```javascript\n\
    function logIdentity(value) {\n  console.log(value);\n  return value;\n}\n\ndebts\n\
    \  .filter(isEur)\n  .map(logIdentity)\n  .map(toDebtView)\n  .map(logIdentity);\n\
    ```\n\n## Currying\n\nCurrying is a technique for changing a function expecting\
    \ n arguments into a series of n functions each expecting one argument.\n\nConsider\
    \ the case of filtering a list of words.\n\n```javascript\nconst words = [\n \
    \ 'apple',\n  'apricot',\n  'banana',\n  'blueberry',\n  'calendar',\n  'double',\n\
    \  'door'\n];\n\nfunction startsWith(word, term) {\n  return word.startsWith(term);\n\
    }\n\nwords\n  .filter(w => startsWith(w, 'a'))\n  .forEach(console.log);\n```\n\
    \nNow, look at the same code refactored using currying.\n\n```javascript\nfunction\
    \ startsWith(term) {\n  return function(word) {\n    return word.startsWith(term);\n\
    \  };\n}\n\nwords\n  .filter(startsWith('a'))\n  .forEach(console.log);\n```\n\
    \n`startsWith` is a curried function. Instead of taking two parameters, it takes\
    \ only one and returns a function accepting the second parameter. Notice also\
    \ that the curried version has the parameters in the reverse order compared to\
    \ the initial version taking two parameters.\n\nYou may find it clearer when the\
    \ curried version is written using the arrow syntax.\n\n```javascript\nconst startsWith\
    \ = term => word => {\n  return word.startsWith(term);\n};\n```\n\nAnother option\
    \ is to create the curried version of a function using an auto-curry utility function.\
    \ Here is an example using the `curry` utility from [lodash](https://lodash.com/).\n\
    \n```javascript\nimport { curry } from 'lodash/fp';\n\nconst startsWith = curry(function(term,\
    \ word) {\n  return word.startsWith(term);\n});\n```\n\n## Reduce Pipeline\n\n\
    The `reduce` method uses also a pipeline. Let's look again at the code and analyze\
    \ the data flow.\n\n```javascript\nconst numbers = [1, 3, 5];\n\nfunction add(total,\
    \ n) {\n  return total + n;\n}\n\nconst total = numbers.reduce(add, 0);\nconsole.log(total);\n\
    //9\n```\n\nAt each step, the reducer takes as input the result of the previous\
    \ reducer call as the aggregation value. Here is the pipeline.\n\n![](img/64a41332f00094d6262a8288d39ce1de_80_0.png)\n\
    \nThe aggregation value at the first step is `0`. After invoking the reducer the\
    \ output of this transformation `1` goes as input to the next reducer call. Again\
    \ after invoking the reducer, the output `4` goes as input to the next reducer\
    \ call and so on.\n\n`reduce` creates a pipeline where at each step we get as\
    \ input the result of the previous reducer call and the current element.\n\n##\
    \ Recap\n\nA pipeline defines a series of data transformations where the output\
    \ of one transformation function is the input for the next one.\n\nCurrying is\
    \ a technique for breaking down a function that takes multiple arguments into\
    \ a series of functions each taking only one argument.\n\n# Chapter 09: Functors\n\
    \nNext, we are going to explore functors.\n\nLet’s start with a set of data transformations.\
    \ Consider the next example:\n\n```javascript\nfunction toCelsius(kelvin) {\n\
    \  const celsius = (kelvin - 273.15);\n  return Math.round(celsius * 100) / 100;\n\
    }\n\nfunction describeTemperature(temperature) {\n  return temperature < 0\n \
    \   ? \"Freezing\"\n    : temperature < 15\n      ? \"Cold\"\n      : temperature\
    \ < 28\n        ? \"Warm\"\n        : \"Hot\";\n}\n\nconst kelvin = 300;\nconst\
    \ celsius = toCelsius(kelvin);\nconst description = describeTemperature(celsius);\n\
    \nconsole.log(celsius);\n//26.85\nconsole.log(description)\n//\"Warm\"\n```\n\n\
    As you can see, the point of this piece of code is to apply two changes to a single\
    \ value. It starts with the Kelvin temperature and applies the `toCelsius` transformation,\
    \ then on the result, it applies the `describeTemperature` function.\n\nIt will\
    \ be nicer to be able to chain these transformations on the initial value and\
    \ create a pipeline. Here is how it may look like:\n\n```javascript\nMappable(300)\n\
    \  .map(toCelsius)\n  .map(describeTemperature)\n```\n\nThis is the kind of situation\
    \ where functors are helpful.\n\n## Functors\n\nA functor is an object with a\
    \ `map` operation that satisfies the functor's laws.\n\nWe can simply create a\
    \ functor as an object with a `map` method. Consider the following function:\n\
    \n```javascript\nfunction F(value) {\n  function map(f) {\n    const newValue\
    \ = f(value);\n    return F(newValue);\n  }\n\n  return {\n    map\n  };\n}\n\
    ```\n\n`F` creates an object with the `map` method wrapping a `value`. `map` takes\
    \ a transformation function, applies it to the wrapped value, and returns a new\
    \ object wrapping the new value."
  mdcn: "\n# 第08章：管道与柯里化\n\n`getTopSelection` 接收一个树对象，并返回一个包含最顶层选中值的数组。如果节点被选中，则返回该节点值的单元素数组。当节点未被选中且拥有子节点时，它返回这些子节点的最顶层选中项。`getTopSelection`\
    \ 会针对树内部的每个子节点进行调用，直到递归调用在节点被选中时终止。找到被选中的节点即为结束条件。`getTopSelection` 不会对已被选中节点的子节点进行调用。\n\
    \n## 回顾\n\n递归函数是指在满足某个条件之前不断调用自身的函数。\n\n递归为遍历树结构等一系列问题提供了更简洁的解决方案。\n\n任何迭代循环都可以用递归实现，但在主流浏览器支持尾调用优化之前，这并不实用。\n\
    \n管道是函数式编程中的典型应用场景。\n\n柯里化通常在创建管道时使用，因为定义转换流程的函数期望接收一个参数。\n\n**管道**\n\n管道是一系列数据转换操作，其中一次转换的输出是下一次转换的输入。\n\
    \n管道使我们能够以更具表达力的方式编写数据转换。请看以下代码：\n\n```javascript\nfunction capitalize(text) {\n\
    \  return text.charAt(0).toUpperCase() + text.slice(1);\n}\n\nfunction shortenText(text)\
    \ {\n  return text.substring(0, 8).trim();\n}\n\nconst shortText =\n  shortenText(capitalize(\"\
    this is a long text\"));\nconsole.log(shortText);\n//\"This is\"\n```\n\n我们可以使用\
    \ [lodash](https://lodash.com/) 或 [ramda](https://ramdajs.com/) 等函数式库中的 pipe 工具，以更具表达力的方式编写这些转换。\n\
    \n```bash\nnpm i lodash --save\n```\n\n以下是在管道中这些转换的样子。\n\n```javascript\nimport\
    \ { pipe } from 'lodash/fp';\n\nconst shortText = pipe(\n  capitalize,\n  shortenText\n\
    )(\"this is a long text\");\n\nconsole.log(shortText);\n//\"This is\"\n```\n\n\
    初始文本是管道的输入。`capitalize` 是处理文本的第一个函数。然后这次转换的输出作为输入传递给下一个函数 `shortenText`。接着管道结束，我们得到结果。\n\
    \n# 输入\n\ncapitalize\n\nshortenText\n\n# 输出\n\n**链式调用**\n\n链式调用是定义管道的更常见形式。它要求操作一个对象。\n\
    \n考虑以下债务列表。\n\n```javascript\nconst debts = [\n  {\n    contractNo: 1,\n    daysSinceLastPayment:\
    \ 91,\n    currency: 'EUR'\n  },\n  {\n    contractNo: 2,\n    daysSinceLastPayment:\
    \ 35,\n    currency: 'USD'\n  },\n  {\n    contractNo: 3,\n    daysSinceLastPayment:\
    \ 45,\n    currency: 'USD'\n  }\n];\n```\n\n以下是我们使用链式调用定义转换管道的方式。\n\n```javascript\n\
    const newDebts = debts\n  .filter(isEur)\n  .map(toDebtView);\n\nfunction isEur(debt)\
    \ {\n  return debt.currency === \"EUR\";\n}\n\nfunction toDebtView(debt) {\n \
    \ return {\n    ...debt,\n    priority: getPriority(debt)\n  };\n}\n\nfunction\
    \ getPriority(debt) {\n  const days = debt.daysSinceLastPayment;\n  return days\
    \ > 90\n    ? 1\n    : days > 60\n      ? 2\n      : 3;\n}\n```\n\n首先，使用 `isEur`\
    \ 谓词函数对债务列表进行过滤。\n然后使用 `toDebtView` 映射函数对操作结果进行转换。\n\n输入\n\n![](img/64a41332f00094d6262a8288d39ce1de_76_0.png)\n\
    \n输出\n\n# 恒等函数\n\n恒等函数是一元函数，返回其接收的参数值。\n\n在数学中，它定义为 f(x) = x。\n\n```javascript\n\
    function identity(value) {\n  return value;\n}\n```\n\n如果将此转换放入前面的管道中，它只会创建数组的一个副本。\n\
    \n`logIdentity` 函数提供了一种检查管道中数据而不影响流程的方法。它返回接收到的参数，同时将其输出到控制台。\n\n```javascript\n\
    function logIdentity(value) {\n  console.log(value);\n  return value;\n}\n\ndebts\n\
    \  .filter(isEur)\n  .map(logIdentity)\n  .map(toDebtView)\n  .map(logIdentity);\n\
    ```\n\n## 柯里化\n\n柯里化是一种将接收 n 个参数的函数转换为一系列各接收一个参数的 n 个函数的技术。\n\n考虑过滤单词列表的情况。\n\n\
    ```javascript\nconst words = [\n  'apple',\n  'apricot',\n  'banana',\n  'blueberry',\n\
    \  'calendar',\n  'double',\n  'door'\n];\n\nfunction startsWith(word, term) {\n\
    \  return word.startsWith(term);\n}\n\nwords\n  .filter(w => startsWith(w, 'a'))\n\
    \  .forEach(console.log);\n```\n\n现在，看看使用柯里化重构后的相同代码。\n\n```javascript\nfunction\
    \ startsWith(term) {\n  return function(word) {\n    return word.startsWith(term);\n\
    \  };\n}\n\nwords\n  .filter(startsWith('a'))\n  .forEach(console.log);\n```\n\
    \n`startsWith` 是一个柯里化函数。它不再接收两个参数，而是只接收一个参数并返回一个接受第二个参数的函数。请注意，与最初接收两个参数的版本相比，柯里化版本的参数顺序是相反的。\n\
    \n当使用箭头语法编写柯里化版本时，你可能会觉得更清晰。\n\n```javascript\nconst startsWith = term => word\
    \ => {\n  return word.startsWith(term);\n};\n```\n\n另一种选择是使用自动柯里化工具函数创建函数的柯里化版本。以下是使用\
    \ [lodash](https://lodash.com/) 中的 `curry` 工具的示例。\n\n```javascript\nimport { curry\
    \ } from 'lodash/fp';\n\nconst startsWith = curry(function(term, word) {\n  return\
    \ word.startsWith(term);\n});\n```\n\n## Reduce 管道\n\n`reduce` 方法也使用管道。让我们再次查看代码并分析数据流。\n\
    \n```javascript\nconst numbers = [1, 3, 5];\n\nfunction add(total, n) {\n  return\
    \ total + n;\n}\n\nconst total = numbers.reduce(add, 0);\nconsole.log(total);\n\
    //9\n```\n\n在每一步中，reducer 接收前一次 reducer 调用的结果作为聚合值输入。以下是管道过程。\n\n![](img/64a41332f00094d6262a8288d39ce1de_80_0.png)\n\
    \n第一步的聚合值是 `0`。调用 reducer 后，这次转换的输出 `1` 作为输入进入下一次 reducer 调用。再次调用 reducer 后，输出\
    \ `4` 作为输入进入下一次 reducer 调用，依此类推。\n\n`reduce` 创建了一个管道，在每一步中我们接收前一次 reducer 调用的结果和当前元素作为输入。\n\
    \n## 回顾\n\n管道定义了一系列数据转换，其中一次转换函数的输出是下一次转换的输入。\n\n柯里化是一种将接收多个参数的函数分解为一系列每个只接收一个参数的函数的技术。\n\
    \n# 第09章：函子\n\n接下来，我们将探索函子。\n\n让我们从一组数据转换开始。考虑以下示例：\n\n```javascript\nfunction\
    \ toCelsius(kelvin) {\n  const celsius = (kelvin - 273.15);\n  return Math.round(celsius\
    \ * 100) / 100;\n}\n\nfunction describeTemperature(temperature) {\n  return temperature\
    \ < 0\n    ? \"Freezing\"\n    : temperature < 15\n      ? \"Cold\"\n      : temperature\
    \ < 28\n        ? \"Warm\"\n        : \"Hot\";\n}\n\nconst kelvin = 300;\nconst\
    \ celsius = toCelsius(kelvin);\nconst description = describeTemperature(celsius);\n\
    \nconsole.log(celsius);\n//26.85\nconsole.log(description)\n//\"Warm\"\n```\n\n\
    如你所见，这段代码的目的是对单个值应用两次变换。它以开尔文温度开始，应用 `toCelsius` 转换，然后在结果上应用 `describeTemperature`\
    \ 函数。\n\n如果能够将这些转换链接到初始值上并创建管道，将会更好。它可能看起来像这样：\n\n```javascript\nMappable(300)\n\
    \  .map(toCelsius)\n  .map(describeTemperature)\n```\n\n这就是函子Prov有帮助的情况。\n\n##\
    \ 函子\n\n函子是一个带有 `map` 操作且满足函子定律的对象。\n\n我们可以简单地将函子创建为带有 `map` 方法的对象。考虑以下函数：\n\n\
    ```javascript\nfunction F(value) {\n  function map(f) {\n    const newValue =\
    \ f(value);\n    return F(newValue);\n  }\n\n  return {\n    map\n  };\n}\n```\n\
    \n`F` 创建一个带有 `map` 方法的对象，包装着一个 `value`。`map` 接收一个转换函数，将其应用于包装值，并返回一个包装新值的新对象。\n"
