  md: "# Chapter 03: Functions\n\nFunctions are our primary way to define and encapsulate\
    \ logic.\n\nFunctions have a list of parameters and a body of statements. Depending\
    \ on how the function was created, it may have a name. I will aim for having named\
    \ functions most of the time.\n\nLet's look at the main ways to define a function.\n\
    \n# Function Declarations\n\nA function can be created using the `function` keyword\
    \ declaration, followed by the name of the function and the list of parameters.\
    \ The body of the function stays inside curly braces.\n\n```\nfunction sum(x,\
    \ y){\n  return x + y;\n}\n```\n\nFunctions can be invoked using the function\
    \ name followed by the list of arguments enclosed in parentheses.\n\n```\nsum(1,2)\n\
    //3\n```\n\nFunction parameters can be initialized with default values if no value\
    \ or `undefined` is passed. In the following example, if no value is given for\
    \ the `step` parameter when invoking the `increment` function, it will default\
    \ to `1`.\n\n```\nfunction increment(n, step = 1){\n  return n + step\n}\n```"
