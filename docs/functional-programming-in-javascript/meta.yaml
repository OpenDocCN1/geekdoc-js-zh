  - "[PAGE 17]\n\n# # Chapter 02: Immutable Data Objects\n\nNext, we will look at\
    \ what objects are and how to create and work with immutable objects.\n\nIn functional\
    \ programming, we are going to use objects as data structures. They will store\
    \ data and have no behavior.\n\n**Objects Objects are a collection of properties.\
    \ Each property has a key and a value. Take a look at an object in the console.**\n\
    \n```\nconst book = {\n  title : 'JavaScript Allongé'\n  author: 'Reginald Braithwaite'\n\
    \  category: 'JavaScript'\n};\n```\n\nconsole.log(book); The key is a string that\
    \ is unique in the collection. It is case sensitive.\n\nWe can access a property\
    \ using the dot notation or the bracket notation.\n\n```\nconsole.log(book.title);\n\
    //\"JavaScript Allongé\"\n```\n\nconsole.log(book[\"title\"]); Immutability Immutability\
    \ is one of the core principles of functional programming.\n\nMutation means change.\
    \ Saying that we changed an object's property is the same as saying we mutated\
    \ that object."
  - "[PAGE 18]\n\nAn immutable object once created cannot be changed.\nJavaScript\
    \ objects are nothing like that. They can be\nmodified. They are not immutable.\
    \ Consider the next\nexample: let fruit = {\n\n```\nname: 'Apple'\n};\n```\n\n\
    ```\nfruit.name = 'Orange'\n//{name : 'Orange'}\n```\n\nAs you notice, we can\
    \ change the existing `fruit` object. The\nsame thing happens even when we use\
    \ the `const` keyword\ndeclaration.\n\n```\nconst fruit = {\n  name: 'Apple'\n\
    };\n```\n\n```\nfruit.name = 'Orange'\n// {name : 'Orange'}\n```\n\nThe `const`\
    \ keyword refers to the variable, not to the value it\nstores. It means the variable\
    \ cannot be reassigned. It truly\nbecomes a constant when the value it stores\
    \ is immutable.\n\n# **Freezing I order to create an immutable object we can freeze\
    \ it at creation.**\n\n```\nconst fruit = Object.freeze({\nname: 'Apple'\n});\n\
    ```\n\n```\nfruit.name = 'Orange'\n```"
  - "[PAGE 19]\n\n// Cannot assign to read only property 'name' of object The only\
    \ limitation is that Object.freeze does shallow freezing. It affects the immediate\
    \ properties of the object, the ones at the first level in the tree. If for example\
    \ one of these properties contains another object, that object will not be affected.\
    \ Look at the next example.\n\n```\nconst book = Object.freeze({\n  name: \"How\
    \ JavaScript Works\",\n  author: {\n    firstName: 'Douglas',\n    lastName: 'Crockford'\n\
    \  }\n});\n```\n\nbook.author.firstName = ''; The book object was changed. We\
    \ can’t reassign a new object to the author ’s property, but we can modify its\
    \ properties. For objects containing other objects, we should use a deepFreeze()\
    \ utility function. It will freeze all the properties of all objects inside a\
    \ given object.\n\n**Linting The other option for enabling immutability is to\
    \ use a linter such as ESLint . There are several plugins for it that can help\
    \ us enforcing immutable objects. Such plugins are eslint-plugin-functional ,\
    \ eslint-plugin-fp , or eslint-plugin-immutable . We are going to use eslint-plugin-functional\
    \ .**\n\nnpm install eslint-plugin-functional --save-dev After installing the\
    \ plugin, change the lint config file .eslintrc.json to enable immutable data.\n\
    \n```\n\"plugins\": [\n  \"functional\"\n],\n```"
- md: "## Working with Immutable Objects\n\nNext, let's look at how to 'change' immutable\
    \ objects.\n\nChanging an immutable object means creating a changed copy. For\
    \ this is very useful to use the [spread operator syntax](link).\n\n## Changing\
    \ Properties\n\nHere is an example of modifying an existing property:\n\n```javascript\n\
    const product = {\n  name: 'Apple',\n  quantity: 1\n};\n\nconst newProduct = {\n\
    \  ...product,\n  quantity: 2\n};\n```\n\nBy using the spread syntax we first\
    \ copied all the properties from the `product` object and then added the property\
    \ that should be changed with the new value.\n\n## Adding Properties\n\nAdding\
    \ new properties can be done in a similar way. We clone the object and then add\
    \ the additional properties to it.\n\nIn the next example, the `product` object\
    \ is cloned and the `type` property is added.\n\n```javascript\nconst product\
    \ = {\n  name: 'Apple',\n  quantity: 1\n};\n\nconst newProduct = {\n  ...product,\n\
    \  type: 'fruit'\n};\n```\n\n## Deleting Properties\n\nProperties can be removed\
    \ using the rest operator in the [destructuring syntax](link). In the next example,\
    \ the `quantity` property is removed from the new product object by being destructured\
    \ out and ignored.\n\n```javascript\nconst product = {\n  name: 'Apple',\n  quantity:\
    \ 1\n};\n\nconst {\n  quantity,\n  ...newProduct\n} = product;\n\nconsole.log(newProduct);\n\
    //{name: \"Apple\"}\n```\n\nFrom now on, in the following examples immutability\
    \ is considered to be enabled using a linter tool.\n\n## Recap\n\nAn immutable\
    \ object cannot be changed after creation.\n\nWe can enable immutable objects\
    \ by freezing them or using a linter.\n\nThe spread operator is handy for creating\
    \ changed copies of existing objects.\n\n## Chapter 03: Functions\n\nFunctions\
    \ are our primary way to define and encapsulate logic.\n\nFunctions have a list\
    \ of parameters and a body of statements. Depending on how the function was created,\
    \ it may have a name. I will aim for having named functions most of the time.\n\
    \nLet's look at the main ways to define a function.\n\n## Function Declarations\n\
    \nA function can be created using the `function` keyword declaration, followed\
    \ by the name of the function and the list of parameters. The body of the function\
    \ stays inside curly braces.\n\n```javascript\nfunction sum(x, y){\n  return x\
    \ + y;\n}\n```\n\nFunctions can be invoked using the function name followed by\
    \ the list of arguments enclosed in parentheses.\n\n```javascript\nsum(1,2)\n\
    //3\n```\n\nFunction parameters can be initialized with default values if no value\
    \ or `undefined` is passed. In the following example, if no value is given for\
    \ the `step` parameter when invoking the `increment` function, it will default\
    \ to `1`.\n\n```javascript\nfunction increment(n, step = 1){\n  return n + step\n\
    }\n\nconst n = 1;\nconsole.log(increment(n));\n//2\n\nconsole.log(increment(n,\
    \ 2));\n//3\n```\n\nFunctions created this way are hoisted to the top of their\
    \ scope and so they can be used before declaration. The scope of a function can\
    \ be a module or an outer function in which the current function is defined.\n\
    \n```javascript\nsum(1,2);\n//3\n\nfunction sum(x, y){\n  return x + y;\n}\n```\n\
    \nFunctions return values. The `return` statement specifies the returned value.\
    \ It also stops the execution of the function.\n\n## Function Expressions\n\n\
    The `function` keyword can be used to define a function inside an expression.\
    \ In the function declaration, the `function` is the first keyword on the line.\
    \ When that is not the case we are dealing with function expressions.\n\nFor a\
    \ function expression, the name is optional, but it can be handy to have it when\
    \ implementing recursive functions.\n\nHere is a function expression.\n\n```javascript\n\
    const sum = function(x, y){\n    return x + y;\n}\n```\n\nThe following is also\
    \ a function expression.\n\n```javascript\n!function start(){\n    console.log('start')\n\
    }\n```\n\nOnce `function` is not the first keyword on the line it becomes a function\
    \ expression. The function name can be omitted and it can auto-execute.\n\n```javascript\n\
    !function(){\n    console.log('start')\n}();\n//\"start\"\n```\n\n## Arrow Function\
    \ Expressions\n\nArrow function expressions are a compact alternative to regular\
    \ function expressions.\n\nThe arrow function syntax consists of a list of parameters\
    \ followed by the `=>` symbol and then the body of the function optionally enclosed\
    \ within curly braces.\n\n```javascript\nconst sum = (x, y) => x + y;\n\nsum(1,2);\n\
    ```\n\nThere is no function keyword this time and no return statement. The `=>`\
    \ symbol points to what is returned.\n\nWhen the logic inside the arrow function\
    \ contains multiple statements we use curly braces. This time the `return` statement\
    \ is needed to return the result.\n\n```javascript\nconst sum = (x, y) => {\n\
    \  return x + y;\n}\n```\n\nBoth function expressions are not hoisted to the top\
    \ of their scope. They cannot be used before declaration.\n\n## Arity\n\nThe arity\
    \ of a function describes how many parameters the function has.\n\n- A unary function\
    \ has one parameter.\n- A binary function has two parameters.\n- A n-ary function\
    \ has n parameters.\n- A nullary function has no parameters.\n\n## Pure Functions\n\
    \nIn functional programming, functions are like mathematical functions. They do\
    \ computations. These kinds of functions are called pure functions.\n\nPure functions\
    \ calculate a new value based on the input parameters.\n\nThey are deterministic\
    \ functions. That means they return the same result when called with the same\
    \ input. `Math.random` and `Date.now` are not deterministic functions as they\
    \ return a different result each time they are called. They cannot be used inside\
    \ pure functions.\n\nPure functions do not modify the external environment in\
    \ which the function was executed, so they do not write into the outer environment\
    \ or read data that can change from the outside.\n\nHere is an example of a pure\
    \ function.\n\n```javascript\nconst number = 1.7654321;\n\nfunction roundNumber(n,\
    \ precision = 2){\n  const noAsString = n.toFixed(precision);\n  return Number.parseFloat(noAsString);\n\
    }\n\nconsole.log(roundNumber(number));\n//1.77\n```\n\n`roundNumber` is a pure\
    \ function using other pure functions `toFixed` and `parseFloat`, to round a number\
    \ to n decimals.\n\nChanging data outside the local scope, reading data that can\
    \ change from the outside, or any alteration of the external environment is a\
    \ side-effect.\n\nFor the simple fact that they do only computations based on\
    \ their inputs and have no side-effects they are easier to understand, test, or\
    \ debug.\n\n`Math.min`, `Math.max`, `Math.sqrt` are pure functions. In fact, all\
    \ static methods from the `Math` object, with the `Math.random` exception, are\
    \ pure functions.\n\n## Recap\n\nFunctions can be created using the function declarations,\
    \ the function expressions, or the arrow function expressions.\n\nIn functional\
    \ programming, functions should be like mathematical functions doing only computations\
    \ without changing the external environment.\n\n## Chapter 04: Arrays\n\nArrays\
    \ are indexed collections of values. Both arrays and objects are collections of\
    \ values. In fact, arrays are emulated using objects.\n\nWe simply create an array\
    \ using the array literal. Here is an example.\n\n```javascript\nconst arr = [1,\
    \ 2, 3];\n\nArray.isArray(arr);\n//true\n```\n\nArrays have a set of methods for\
    \ data transformations.\n\nData transformation is one of those tasks where functional\
    \ programming really shines. It makes these transformations easier to manage and\
    \ understand. It does that by identifying a core set of operations all transformations\
    \ do like filtering, mapping, sorting, and aggregating.\n\n## Filtering\n\nConsider\
    \ the next example selecting only the even numbers from an array.\n\n```javascript\n\
    const numbers = [1, 2, 3, 4];\n\nfunction isEven(n) {\n  return n % 2 == 0;\n\
    }\n\nconst evenNumbers = numbers.filter(isEven);\nconsole.log(evenNumbers);\n\
    //[2, 4]\n```"
  mdcn: "\n## 与不可变对象一起工作\n\n接下来，让我们来看看如何\"修改\"不可变对象。\n\n修改不可变对象意味着创建一个修改后的副本。为此，使用[展开运算符语法](link)非常有用。\n\
    \n## 修改属性\n\n以下是修改现有属性的示例：\n\n```javascript\nconst product = {\n  name: 'Apple',\n\
    \  quantity: 1\n};\n\nconst newProduct = {\n  ...product,\n  quantity: 2\n};\n\
    ```\n\n通过使用展开语法，我们首先从`product`对象复制了所有属性，然后用新值添加了需要更改的属性。\n\n## 添加属性\n\n添加新属性的方式类似。我们克隆对象，然后向其添加额外的属性。\n\
    \n在下面的示例中，`product`对象被克隆，并添加了`type`属性。\n\n```javascript\nconst product = {\n \
    \ name: 'Apple',\n  quantity: 1\n};\n\nconst newProduct = {\n  ...product,\n \
    \ type: 'fruit'\n};\n```\n\n## 删除属性\n\n可以使用[解构语法](link)中的剩余运算符来移除属性。在下面的示例中，`quantity`属性通过解构被排除并忽略，从而从新对象中移除。\n\
    \n```javascript\nconst product = {\n  name: 'Apple',\n  quantity: 1\n};\n\nconst\
    \ {\n  quantity,\n  ...newProduct\n} = product;\n\nconsole.log(newProduct);\n\
    //{name: \"Apple\"}\n```\n\n从现在开始，在以下示例中，不可变性被认为已通过使用 linter 工具启用。\n\n## 回顾\n\n\
    不可变对象在创建后不能被更改。\n\n我们可以通过冻结它们或使用 linter 来启用不可变对象。\n\n展开运算符对于创建现有对象的修改副本非常方便。\n\
    \n## 第 03 章：函数\n\n函数是我们定义和封装逻辑的主要方式。\n\n函数有一组参数和一个语句体。根据函数的创建方式，它可能有一个名称。我将努力在大多数情况下使用命名函数。\n\
    \n让我们看看定义函数的主要方式。\n\n## 函数声明\n\n可以使用`function`关键字声明来创建函数，后跟函数名称和参数列表。函数体放在花括号内。\n\
    \n```javascript\nfunction sum(x, y){\n  return x + y;\n}\n```\n\n函数可以使用函数名后跟随括号括起来的参数列表来调用。\n\
    \n```javascript\nsum(1,2)\n//3\n```\n\n如果未传递值或传递了`undefined`，函数参数可以用默认值初始化。在下面的示例中，如果在调用`increment`函数时未给`step`参数提供值，它将默认为`1`。\n\
    \n```javascript\nfunction increment(n, step = 1){\n  return n + step\n}\n\nconst\
    \ n = 1;\nconsole.log(increment(n));\n//2\n\nconsole.log(increment(n, 2));\n//3\n\
    ```\n\n以这种方式创建的函数会被提升到其作用域的顶部，因此它们可以在声明之前使用。函数的作用域可以是一个模块，或者当前函数所定义的外部函数。\n\n\
    ```javascript\nsum(1,2);\n//3\n\nfunction sum(x, y){\n  return x + y;\n}\n```\n\
    \n函数返回值。`return`语句指定返回的值。它也会停止函数的执行。\n\n## 函数表达式\n\n`function`关键字可用于在表达式内部定义函数。在函数声明中，`function`是该行的第一个关键字。当情况并非如此时，我们处理的是函数表达式。\n\
    \n对于函数表达式，名称是可选的，但在实现递归函数时，有名称会很有用。\n\n这是一个函数表达式。\n\n```javascript\nconst sum\
    \ = function(x, y){\n    return x + y;\n}\n```\n\n以下也是一个函数表达式。\n\n```javascript\n\
    !function start(){\n    console.log('start')\n}\n```\n\n一旦`function`不是该行的第一个关键字，它就变成了函数表达式。函数名称可以省略，并且它可以自动执行。\n\
    \n```javascript\n!function(){\n    console.log('start')\n}();\n//\"start\"\n```\n\
    \n## 箭头函数表达式\n\n箭头函数表达式是常规函数表达式的简洁替代方案。\n\n箭头函数语法由一个参数列表后跟`=>`符号，然后是可选花括号括起来的函数体组成。\n\
    \n```javascript\nconst sum = (x, y) => x + y;\n\nsum(1,2);\n```\n\n这次没有 function\
    \ 关键字，也没有 return 语句。`=>`符号指向被返回的内容。\n\n当箭头函数内部的逻辑包含多条语句时，我们使用花括号。这次需要`return`语句来返回结果。\n\
    \n```javascript\nconst sum = (x, y) => {\n  return x + y;\n}\n```\n\n这两种函数表达式都不会被提升到其作用域的顶部。它们不能在声明之前使用。\n\
    \n## 元数\n\n函数的元数描述函数有多少个参数。\n\n- 一元函数有一个参数。\n- 二元函数有两个参数。\n- n 元函数有 n 个参数。\n-\
    \ 零元函数没有参数。\n\n## 纯函数\n\n在函数式编程中，函数就像数学函数一样。它们进行计算。这类函数被称为纯函数。\n\n纯函数根据输入参数计算新值。\n\
    \n它们是确定性函数。这意味着当使用相同的输入调用时，它们返回相同的结果。`Math.random`和`Date.now`不是确定性函数，因为它们每次被调用时返回不同的结果。它们不能在纯函数内部使用。\n\
    \n纯函数不修改执行函数的外部环境，因此它们不会写入外部环境或读取可能从外部改变的数据。\n\n这是一个纯函数的示例。\n\n```javascript\n\
    const number = 1.7654321;\n\nfunction roundNumber(n, precision = 2){\n  const\
    \ noAsString = n.toFixed(precision);\n  return Number.parseFloat(noAsString);\n\
    }\n\nconsole.log(roundNumber(number));\n//1.77\n```\n\n`roundNumber`是一个纯函数，使用其他纯函数`toFixed`和`parseFloat`，将数字四舍五入到\
    \ n 位小数。\n\n更改局部作用域之外的数据、读取可能从外部改变的数据，或者对外部环境的任何更改，都是副作用。\n\n仅仅因为它们只基于输入进行计算且没有副作用，所以它们更易于理解、测试或调试。\n\
    \n`Math.min`、`Math.max`、`Math.sqrt`都是纯函数。事实上，`Math`对象的所有静态方法，除了`Math.random`之外，都是纯函数。\n\
    \n## 回顾\n\n函数可以使用函数声明、函数表达式或箭头函数表达式来创建。\n\n在函数式编程中，函数应该像数学函数一样，只进行计算而不改变外部环境。\n\
    \n## 第 04 章：数组\n\n数组是值的索引集合。数组和对象都是值的集合。事实上，数组是使用对象模拟的。\n\n我们简单地使用数组字面量来创建数组。这是一个示例。\n\
    \n```javascript\nconst arr = [1, 2, 3];\n\nArray.isArray(arr);\n//true\n```\n\n\
    数组有一套用于数据转换的方法。\n\n数据转换是函数式编程真正发光的任务之一。它使这些转换更易于管理和理解。它通过识别所有转换所做的核心操作集来实现这一点，如过滤、映射、排序和聚合。\n\
    \n## 过滤\n\n考虑下面的示例，从数组中只选择偶数。\n\n```javascript\nconst numbers = [1, 2, 3, 4];\n\
    \nfunction isEven(n) {\n  return n % 2 == 0;\n}\n\nconst evenNumbers = numbers.filter(isEven);\n\
    console.log(evenNumbers);\n//[2, 4]\n```\n"
