    \  - [Naming](link)\n  - [Final Thoughts](link)\n- [What's next?](link)\n\n##\
    \ Introduction\n\nFunctional programming is becoming more popular and this book\
    \ aims to bring clarity on how to use JavaScript as a functional language.\n\n\
    It turns out that JavaScript has everything it needs to be used as a functional\
    \ language. We just need to remove features from the language.\n\nIn essence,\
    \ we are going to remove the `this` keyword from our code. That means we are not\
    \ going to use classes or methods using the `this` keyword. It also implies not\
    \ using custom prototypes.\n\nRemoving `this` has other benefits. `this` is the\
    \ source of much confusion in JavaScript, mainly because it depends on how the\
    \ function is invoked, not where the function is defined. There are many situations\
    \ where `this` points to an unexpected function context and that leads to bugs.\
    \ By removing `this` all the related problems are gone.\n\nJavaScript is both\
    \ a functional programming language and a prototype-based language. If we get\
    \ rid of `this`, we are left with JavaScript as a functional programming language.\
    \ That is even better.\n\nThat being said, we can remove `this` from our code\
    \ by enabling linting.\n\nHere is an example of a lint configuration file disabling\
    \ the `this` keyword from an application built with [Create React App](https://create-react-app.dev).\n\
    \n```\n{\n  \"extends\": [\"react-app\"],\n  \"plugins\": [\n    \"immutable\"\
    \n  ],\n  \"rules\": {\n    \"immutable/no-this\": \"error\"\n  }\n}\n```\n\n\
    JavaScript without this looks like a better functional programming language.\n\
    \n**Source Code** The project files from this book are available at [https://github.com/cristi-salcescu/functional-programming-in-javascript](https://github.com/cristi-salcescu/functional-programming-in-javascript).\n\
    \n**Feedback** I will be glad to hear your feedback. For comments, questions,\
    \ or suggestions regarding this book send me an email to [cristisalcescu@gmail.com](mailto:cristisalcescu@gmail.com).\
    \ Thanks in advance for considering to write a review of the book.\n\n## Setup\n\
    \nFirst, we need to setup our development environment to use the latest JavaScript\
    \ features.\n\n**Package Manager**\n\nA package manager is a tool used to track\
    \ project dependencies in an easy to use manner. At the time of writing, Node.js\
    \ package manager, in short `npm`, is the most popular. Let's start by installing\
    \ [Node.js](https://nodejs.org/).\n\nThe following commands can then be used in\
    \ command prompt to check the Node.js and npm versions:\n\n```\nnode --version\n\
    ```\n\n```\nnpm --v\n```\n\n**NPM Packages**\n\nWith npm we can install additional\
    \ packages. These packages are the application dependencies.\n\nThe `package.json`\
    \ file stores all the node packages used in the project. These packages are the\
    \ application dependencies. The application can be shared with other developers\
    \ without sharing all the node packages. Installing all the packages defined in\
    \ the `package.json` file can be done using the `npm install` command.\n\nStart\
    \ by creating a package.json file using npm.\n\n```\nnpm init\n```\n\nWe need\
    \ a tool that converts our JavaScript code into a backward-compatible version\
    \ and has support for [modules](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules).\
    \ We need [Babel](https://babeljs.io/). Go and install the necessary packages.\n\
    \n```\nnpm install @babel/core @babel/node @babel/preset-env --save\n```\n\nThe\
    \ installed packages can be found in the `node_modules` folder. The `--save` flag\
    \ tells npm to store the package requirement in the `package.json` file.\n\nIn\
    \ order to use the latest JavaScript, we need to enable a preset. Create the `.babelrc`\
    \ file and enable the [babel/preset-env](https://babeljs.io/docs/en/babel-preset-env)\
    \ preset.\n\n```\n{\n  \"presets\": [\"@babel/preset-env\"]\n}\n```\n\n**Linting**\n\
    \nLinting is the process of analyzing the code for potential errors and stylistic\
    \ problems. A linter is a tool that runs and reports these problems. Linters are\
    \ also useful for code formatting and for using best practices.\n\nWe are going\
    \ to use [ES Lint](https://eslint.org/). Start by installing it.\n\n```\nnpm install\
    \ eslint --save-dev\n```\n\nLint rules can be defined in a configuration file\
    \ named `.eslintrc.*`\n\nNext, set up a configuration file.\n\n```\nnpx eslint\
    \ --init\n```\n\nOne plugin we are going to use is [eslint-plugin-functional](https://www.npmjs.com/package/eslint-plugin-functional)\
    \ so let's install it.\n\n```\nnpm install eslint-plugin-functional --save-dev\n\
    ```\n\nNow go to the `.eslintrc.json` config file an write the lint rule that\
    \ forbids the usage of this keyword.\n\n```\n{\n  \"plugins\": [\n    \"functional\"\
    \n  ],\n  \"rules\": {\n    \"functional/no-this-expression\": \"error\"\n  }\n\
    }\n```\n\nHere is how you can run linting on all files inside the `src` folder.\n\
    \n```\nnpx eslint src\n```\n\nIn an application created with [Create React App](https://create-react-app.dev/)\
    \ we can force linting before starting the development server by"
