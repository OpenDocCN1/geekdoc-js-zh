    **Primitives The primitive values include numbers, strings, booleans, null , and
    undefined . Log some of these primitive values in the console.**


    ```

    console.log(1);

    console.log(''text'');

    console.log(true);

    ```


    All these primitive values have a type. We can find the type of a value using
    the typeof operator. Check some of them.


    ```

    console.log(typeof(1));

    //"number"

    ```


    ```

    console.log(typeof(''''));

    //"string"

    ```


    ```

    console.log(typeof(true));

    //"boolean"

    ```


    There are two number types `Number` and `BigInt` . Mainly we are going to use
    the first one which stores double-precision floating-point numbers. It is important
    to know that floating-point arithmetic is not accurate.


    ```

    console.log(0.1+0.2);

    //0.30000000000000004

    ```


    ```

    console.log(0.1 + 0.2 === 0.3);

    ```'
