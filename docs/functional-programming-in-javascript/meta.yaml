  md: "The HTML contains a decrement button that generates the `Decrement` message,\
    \ and an increment button that generates the `Increment` message and the current\
    \ count. The count number is read from the model, converted to a string, and then\
    \ rendered as text inside a div element.\n\nMessages are generated by handling\
    \ the `onClick` event for each button.\n\n```\nview : Model -> Html Msg\nview\
    \ model =\n div []\n  [\n    div [] [ text (String.fromInt model.number) ]\n \
    \ , button [ onClick Decrement ] [ text \"-\" ]\n  , button [ onClick Increment\
    \ ] [ text \"+\" ]\n  ]\n```\n\n# Update Function The `update` function describes\
    \ how to change the model when receiving a new message.\n\nWhen it gets the `Increment`\
    \ message, it returns a new model with the number incremented. When it gets the\
    \ `Decrement` message, it returns a new model with the number decremented.\n\n\
    ```\nupdate : Msg -> Model -> Model\nupdate msg model =\n  case msg of\n    Increment\
    \ ->\n      { model | number = model.number + 1 }\n\n    Decrement ->\n      {\
    \ model | number = model.number - 1 }\n```"
