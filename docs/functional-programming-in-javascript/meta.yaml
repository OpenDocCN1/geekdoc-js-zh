    blueberry\"]\n  .map(toUpperCase);\n\nconsole.log(arr);\n//[ 'RASPBERRY STRAWBERRY',\
    \ 'BLUEBERRY' ]\n```\n\nThe initial array has two text values. After applying\
    \ the transformation we get an array containing two text values with uppercase\
    \ letters.\n\nCheck what happens when we apply a mapping function that returns\
    \ an array.\n\n```\nfunction split(text){\n  return text.split(' ');\n```"
