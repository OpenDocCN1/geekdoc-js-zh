    \ ( model\n      , Random.generate SetNumber (Random.int 1 100)\n      )\n\n \
    \   SetNumber number ->\n      ( Model number\n      , Cmd.none\n      )\n```\n\
    \nWhen the update function receives the `GenerateNumber` message, it creates a\
    \ command using the `Random.generate` function. The Elm framework runs the command,\
    \ generates the random number, and builds a new message `SetNumber` containing\
    \ this random number. The update function does not modify the model in this case,\
    \ it returns the same model."
