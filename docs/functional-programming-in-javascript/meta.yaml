  md: "# ## Chapter 07: Recursion\n\nRecursion implies that a function calls itself.\
    \ The recursion needs a termination. This happens when a certain condition is\
    \ met and the recursive algorithm stops calling itself and returns a value.\n\n\
    Recursion is a method of solving a problem where the solution is found by solving\
    \ smaller instances of the same problem.\n\n# ### Recursive Factorial Let's start\
    \ by looking at the algorithm for computing the factorial of a number in an iterative\
    \ style. As you remember n! = n * (n-1)! .\n\n```\nfunction factorial(n) {\n let\
    \ result = 1;\n\n let i = 2;\n while(i <= n){\n   result = result * i;\n   i =\
    \ i + 1;\n }\n\n return result;\n}\n\nconsole.log(factorial(5));\n//i=2, result=2\n\
    //i=3, result=6\n```"
  merge: -1
  pgno: 61
