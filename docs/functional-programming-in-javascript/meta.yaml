  md: "# # Chapter 08: Pipelines and Currying\n\nPipelines are the typical use case\
    \ for functional programming.\n\nCurrying is commonly used when creating pipelines\
    \ because the functions defining the flow of transformations expect one argument.\n\
    \n**Pipelines A pipeline is a series of data transformations where the output\
    \ of one transformation is the input of the next one.**\n\nPipelines enable us\
    \ to write data transformations in a more expressive way. Consider the next code:\
    \ function capitalize(text) {\n\n```\nreturn text.charAt(0).toUpperCase() + text.slice(1);\n\
    }\n```\n\n```\nfunction shortenText(text) {\n  return text.substring(0, 8).trim();\n\
    }\n```\n\n```\nconst shortText =\n  shortenText(capitalize(\"this is a long text\"\
    ));\nconsole.log(shortText);\n//\"This is\"\n```\n\nWe can write these transformations\
    \ in a more expressive way using the pipe utility from a functional library like\
    \ [lodash](https://lodash.com/) or [ramda](https://ramdajs.com/) ."
