- md: "## Right Identity\nPassing the M function into the flatMap operation of a monad\
    \ wrapping a value should result in monad wrapping the same value.\n```\nmonad.flatMap(M)\
    \ === monad\n```\nCheck the law using the M custom monad.\n```\nM(1)\n  .flatMap(M)\n\
    ```\n//M(1)\n\n## Associativity\nMonads must respect the associativity law, meaning\
    \ that:\n```\nmonad.flatMap(f).flatMap(g) === monad.flatMap(x => f(x).flatMap(g))\n\
    ```\nLet's test the law.\n```\nfunction f(){\n  return M(2)\n}\n```\n```\nfunction\
    \ g(){\n  return M(3)\n}\n```\n```\nM(1)\n  .flatMap(f)\n  .flatMap(g);\n  //M(3)\n\
    ```\n```\nM(1)\n  .flatMap(n => f(n).flatMap(g));\n```\n//M(3)\n\n## Alternative\
    \ Creation and Naming\nThe flat mapping method comes with different names like\
    \ `bind`, `chain`, or just `flatMap`. There is also the practice to create the\
    \ monad with a different method called `unit`. `unit` does the same thing as the\
    \ M factory function does, it creates a new monad.\n\nBelow is an example of defining\
    \ a monad using this alternative naming.\n```\nexport default (function defineMonad(){\n\
    \  function M(value){\n    function map(f){\n      const newValue = f(value);\n\
    \      return M(newValue);\n    }\n\n    function bind(f){\n      const newValue\
    \ = f(value);\n      return newValue;\n    }\n\n    return {\n      map,\n   \
    \   bind\n    }\n  }\n\n  function unit(value){\n    return M(value);\n  }\n\n\
    \  return {\n    unit\n  }\n})\n```\n})(); `unit` creates a new monad wrapping\
    \ a value.\n**bind** defines the flat map operation.\n\nHere is how the monad\
    \ can be created and used.\n```\nimport M from './M';\n\nfunction f(){\n  return\
    \ M.unit(2)\n}\n```\n```\nM.unit(1).bind(f)\n//M 2\n```\n\nBelow you can review\
    \ how the monad rules can be written in this case.\n\n### Left identity\n**M.unit(1).bind(f)**\n\
    ```\n//M 2\n```\n\n### Right identity\n**M.unit(1).bind(M.unit)**\n```\n//M 1\n\
    ```\n\n### Associativity\n**M.unit(1).bind(f).bind(g)**\n```\n//M 3\n```\n```\n\
    M.unit(1).bind(x => f(x).bind(g))\n//M 3\n```\n\n[You may also find](https://example.com)\
    \ `bind` described as a separate function and not as a method on the monad object:\
    \ `bind(monad, f)`. This translates to `monad.bind(f)` when bind is a method on\
    \ the monad object.\n\nIt is more helpful to describe `bind` as a method.\n\n\
    Let's take a look at how we can translate the monad laws from the function form\
    \ to the method form.\n\nThe following three ways of describing the monad laws\
    \ are equivalent.\n\n### Left identity\n```\nbind(unit(x), f) === f(x)\n\nM.unit(x).bind(f)\
    \ === f(x)\n\nM(x).flatMap(f) === f(x)\n```\nNote that in the last line, M is\
    \ used as the constructor function. `M(x)` is equivalent to `M.unit(x)` and is\
    \ also equivalent to `unit(x)`.\n\n### Right identity\n```\nbind(monad, unit)\
    \ === monad\n\nmonad.bind(M.unit) === monad\n\nmonad.flatMap(M) === monad\n```\n\
    \n### Associativity\n```\nbind(bind(monad, f), g)\n  === bind(monad, x => bind(f(x),\
    \ g))\n\nmonad.bind(f).bind(g)\n  === monad.bind(x => f(x).bind(g))\n\nmonad.flatMap(f).flatMap(g)\n\
    \  === monad.flatMap(x => f(x).flatMap(g))\n```\n\nThis being said, I consider\
    \ that the first implementation of the identity monad as an object with `map`\
    \ and `flatMap` method is easier to work with.\n\n## Arrays\nArrays have both\
    \ the `map` and `flatMap` methods. Let's check the monad laws on them.\n\nFirst,\
    \ we need a function that can create the array from a value.\n```\nfunction M(value){\n\
    \  return [value];\n}\n```\nWe don't need to define such a function because there\
    \ is already one that does that. It is called `Array.of()`.\n```\nfunction duplicate(word){\n\
    \  return [word, word]\n}\n```\n```\nfunction split(text){\n  return text.split(\"\
    \ \");\n}\n```\n\nNext check the three laws.\n\n### Left identity\n`//M(x).flatMap(f)\
    \ === f(x)`\n```\nArray.of('mango')\n  .flatMap(duplicate)\n  //['mango', 'mango']\n\
    ```\n```\nduplicate('mango');\n//['mango', 'mango']\n```\nAs you noticed, when\
    \ creating an array with `Array.of`, `M(x)` translates to `Array.of(x)`.\n\n###\
    \ Right identity\n`//monad.flatMap(M) === monad`\n```\nArray.of('lemon')\n  .flatMap(Array.of)\n\
    ```\n```\n//['lemon']\n```\n\n### Associativity\n`//monad.flatMap(f).flatMap(g)`\n\
    `// === monad.flatMap(x => f(x).flatMap(g))`\n```\nArray.of('orange kiwi')\n \
    \ .flatMap(split)\n  .flatMap(duplicate);\n  //['orange', 'orange', 'kiwi', 'kiwi']\n\
    ```\n```\nArray.of('orange kiwi')\n  .flatMap(s => split(s).flatMap(duplicate))\n\
    \ //['orange', 'orange', 'kiwi', 'kiwi']\n```\n\n## Recap\nA functor is an object\
    \ with a map operation.\n\nA monad is an object with `map` and `flatMap` operations.\n\
    \nFunctors apply a function to a wrapped value.\n\nMonads apply a function that\
    \ returns a wrapped value to a wrapped value.\n\nIn essence, a monad is simply\
    \ a wrapper around a value. We can create it with an object that stores a single\
    \ value and offers support for mapping and flat mapping. In the next chapters,\
    \ we are going to explore practical monads like immutable lists, promises, and\
    \ observables.\n\n# Chapter 11: Immutable Collections\n\nA collection is anything\
    \ that can be iterated over.\n\nImmutable collections return a new collection\
    \ on \"change\" operations. We are going to look at such collections available\
    \ in the [Immutable.JS](https://immutable-js.github.io/immutable-js/) library.\
    \ Install it first.\n```\nnpm install immutable --save\n```\n\n`Lists` are indexed\
    \ collections, similar to arrays. In fact, they can be created from arrays.\n\
    ```\nimport { List } from 'immutable';\n\nconst emptyList = List();\n// List []\n\
    ```\n```\nconst list = List([\n  { name: 'Rhodes' },\n  { name: 'Malaga' }\n]);\n\
    // List [\n// { name: 'Rhodes' },\n// { name: 'Malaga' }]\n```\n[List()](https://immutable-js.github.io/immutable-js/docs/#/List)\
    \ creates a new immutable List containing the values provided as the argument.\
    \ `List` is a factory function and does not use the new keyword.\n\n**Editing\
    \ an element**\n[set(index, value)](https://immutable-js.github.io/immutable-js/docs/#/List/set)\
    \ allows us to edit an element at a specific index in the collection. It returns\
    \ a new List containing the modification. The element at the specified index position\
    \ will be replaced.\n```\nconst newList = list.set(0, { name: 'Riomaggiore' });\n\
    // List [\n// { name: 'Riomaggiore' },\n// { name: 'Malaga' }]\n\nconsole.log(list\
    \ === newList);\n```\n//false\n\n**Adding an element**\n[push(...values)](...)\
    \ returns a new List with the provided values appended. It can be used to add\
    \ a new value to the list. Below is an example.\n```\nconst newList = list.push({name:\
    \ 'Funchal'});\n// List [\n// { name: 'Rhodes' },\n// { name: 'Malaga' },\n//\
    \ { name: 'Funchal'}]\n```\nAdding can also be done with [concat(...values)](...).\
    \ It concatenates a new collection to the existing one. To add a single value\
    \ we call it with an array containing one value.\n```\nconst newList = list.concat([{name:\
    \ 'Funchal'}]);\n// List [\n// { name: 'Rhodes' },\n// { name: 'Malaga' },\n//\
    \ { name: 'Funchal'}]\n```\n[unshift(...values)](...) returns a new List with\
    \ the provided values prepended.\n\n### Deleting an element\n[delete(index)](...)\
    \ deletes the element at the specified index and returns a new List containing\
    \ the modification.\n```\nconst newList = list.delete(0);\n// List [{ name: 'Malaga'\
    \ }]\n```\n`delete` has the `remove` alias.\n\n[pop()](http://example.com) returns\
    \ a new List with the last element removed.\n\n[shift()](http://example.com) returns\
    \ a new List with the first element removed.\n\n**Clearing the list**\n[clear()](http://example.com)\
    \ returns a new List with no values.\n```\nconst newList = list.clear();\n```\n\
    ```\nconsole.log(newList)\n// List []\n```\n\n**Data Transformation**\nWe can\
    \ work with lists similar to arrays. Lists have the `filter`, `map`, `flatMap`,\
    \ `reduce`, and `sort` methods working like in arrays. The `sort` method this\
    \ time is a pure method returning a new collection.\n\nHere is an example of using\
    \ the `filter` method to select only the destinations to a specific country from\
    \ a list of destination objects.\n```\nimport { List } from 'immutable';\n\nconst\
    \ list = List([\n  { name: 'Cascais', country: 'Portugal'},\n  { name: 'Sintra',\
    \ country: 'Portugal' },\n  { name: 'Nerja', country: 'Spain' },\n]);\n```\n```\n\
    function inCountry(country){\n  return function(destination){\n    return destination.country\
    \ === country;\n  }\n}\n```"
  mdcn: "\n## 右单位元\n将 M 函数传入包裹值的 monad 的 flatMap 操作，应得到包裹相同值的 monad。\n```\nmonad.flatMap(M)\
    \ === monad\n```\n使用自定义 monad M 检验该定律。\n```\nM(1)\n  .flatMap(M)\n```\n//M(1)\n\
    \n## 结合律\nmonad 必须遵守结合律，即：\n```\nmonad.flatMap(f).flatMap(g) === monad.flatMap(x\
    \ => f(x).flatMap(g))\n```\n让我们来测试该定律。\n```\nfunction f(){\n  return M(2)\n}\n\
    ```\n```\nfunction g(){\n  return M(3)\n}\n```\n```\nM(1)\n  .flatMap(f)\n  .flatMap(g);\n\
    \  //M(3)\n```\n```\nM(1)\n  .flatMap(n => f(n).flatMap(g));\n```\n//M(3)\n\n\
    ## 替代创建方式与命名\nflat mapping 方法有不同的名称，如 `bind`、`chain` 或直接称 `flatMap`。还有一种实践是用名为\
    \ `unit` 的不同方法来创建 monad。`unit` 所做的事情与 M 工厂函数一样，它创建一个新的 monad。\n\n以下是一个使用这种替代命名定义\
    \ monad 的示例。\n```\nexport default (function defineMonad(){\n  function M(value){\n\
    \    function map(f){\n      const newValue = f(value);\n      return M(newValue);\n\
    \    }\n\n    function bind(f){\n      const newValue = f(value);\n      return\
    \ newValue;\n    }\n\n    return {\n      map,\n      bind\n    }\n  }\n\n  function\
    \ unit(value){\n    return M(value);\n  }\n\n  return {\n    unit\n  }\n})\n```\n\
    })(); `unit` 创建一个包裹值的新 monad。\n**bind** 定义了 flat map 操作。\n\n以下是 monad 如何被创建和使用的。\n\
    ```\nimport M from './M';\n\nfunction f(){\n  return M.unit(2)\n}\n```\n```\n\
    M.unit(1).bind(f)\n//M 2\n```\n\n下面你可以回顾在这种情况下 monad 定律是如何编写的。\n\n### 左单位元\n**M.unit(1).bind(f)**\n\
    ```\n//M 2\n```\n\n### 右单位元\n**M.unit(1).bind(M.unit)**\n```\n//M 1\n```\n\n###\
    \ 结合律\n**M.unit(1).bind(f).bind(g)**\n```\n//M 3\n```\n```\nM.unit(1).bind(x =>\
    \ f(x).bind(g))\n//M 3\n```\n\n[你可能也会发现](https://example.com) `bind` 被描述为一个独立函数，而非\
    \ monad 对象上的方法：`bind(monad, f)`。当 bind 是 monad 对象上的方法时，这等同于 `monad.bind(f)`。\n\
    \n将 `bind` 描述为一种方法更为有用。\n\n让我们看看如何将 monad 定律从函数形式转换为方法形式。\n\n以下三种描述 monad 定律的方式是等价的。\n\
    \n### 左单位元\n```\nbind(unit(x), f) === f(x)\n\nM.unit(x).bind(f) === f(x)\n\nM(x).flatMap(f)\
    \ === f(x)\n```\n注意最后一行，M 用作构造函数。`M(x)` 等同于 `M.unit(x)`，也等同于 `unit(x)`。\n\n###\
    \ 右单位元\n```\nbind(monad, unit) === monad\n\nmonad.bind(M.unit) === monad\n\nmonad.flatMap(M)\
    \ === monad\n```\n\n### 结合律\n```\nbind(bind(monad, f), g)\n  === bind(monad, x\
    \ => bind(f(x), g))\n\nmonad.bind(f).bind(g)\n  === monad.bind(x => f(x).bind(g))\n\
    \nmonad.flatMap(f).flatMap(g)\n  === monad.flatMap(x => f(x).flatMap(g))\n```\n\
    话虽如此，我认为第一种将恒等 monad 实现为具有 `map` 和 `flatMap` 方法的对象的方式更容易使用。\n\n## 数组\n数组同时拥有 `map`\
    \ 和 `flatMap` 方法。让我们来验证它们是否满足 monad 定律。\n\n首先，我们需要一个可以从值创建数组的函数。\n```\nfunction\
    \ M(value){\n  return [value];\n}\n```\n我们不需要定义这样一个函数，因为已经有一个现成的了。它叫做 `Array.of()`。\n\
    ```\nfunction duplicate(word){\n  return [word, word]\n}\n```\n```\nfunction split(text){\n\
    \  return text.split(\" \");\n}\n```\n\n接下来检验三个定律。\n\n### 左单位元\n`//M(x).flatMap(f)\
    \ === f(x)`\n```\nArray.of('mango')\n  .flatMap(duplicate)\n  //['mango', 'mango']\n\
    ```\n```\nduplicate('mango');\n//['mango', 'mango']\n```\n正如你所注意到的，使用 `Array.of`\
    \ 创建数组时，`M(x)` 等同于 `Array.of(x)`。\n\n### 右单位元\n`//monad.flatMap(M) === monad`\n\
    ```\nArray.of('lemon')\n  .flatMap(Array.of)\n```\n```\n//['lemon']\n```\n\n###\
    \ 结合律\n`//monad.flatMap(f).flatMap(g)`\n`// === monad.flatMap(x => f(x).flatMap(g))`\n\
    ```\nArray.of('orange kiwi')\n  .flatMap(split)\n  .flatMap(duplicate);\n  //['orange',\
    \ 'orange', 'kiwi', 'kiwi']\n```\n```\nArray.of('orange kiwi')\n  .flatMap(s =>\
    \ split(s).flatMap(duplicate))\n //['orange', 'orange', 'kiwi', 'kiwi']\n```\n\
    \n## 回顾\n函子是一个具有 map 操作的对象。\n\nmonad 是一个具有 `map` 和 `flatMap` 操作的对象。\n\n函子将一个函数应用于包裹的值。\n\
    \nmonad 将一个返回包裹值的函数应用于包裹的值。\n\n本质上，monad 就是对值的一个包装器。我们可以用一个存储单个值并提供映射和扁平映射支持的对象来创建它。在接下来的章节中，我们将探索一些实用的\
    \ monad，如不可变列表、Promise 和 Observable。\n\n# 第 11 章：不可变集合\n\n集合是指任何可以被迭代的东西。\n\n\
    不可变集合在“更改”操作时会返回一个新集合。我们将查看 [Immutable.JS](https://immutable-js.github.io/immutable-js/)\
    \ 库中可用的此类集合。首先安装它。\n```\nnpm install immutable --save\n```\n\n`Lists` 是索引集合，类似于数组。事实上，它们可以从数组创建。\n\
    ```\nimport { List } from 'immutable';\n\nconst emptyList = List();\n// List []\n\
    ```\n```\nconst list = List([\n  { name: 'Rhodes' },\n  { name: 'Malaga' }\n]);\n\
    // List [\n// { name: 'Rhodes' },\n// { name: 'Malaga' }]\n```\n[List()](https://immutable-js.github.io/immutable-js/docs/#/List)\
    \ 创建一个新的不可变列表，包含作为参数提供的值。`List` 是一个工厂函数，不使用 `new` 关键字。\n\n**编辑元素**\n[set(index,\
    \ value)](https://immutable-js.github.io/immutable-js/docs/#/List/set) 允许我们编辑集合中特定索引处的元素。它返回一个包含修改的新列表。指定索引位置的元素将被替换。\n\
    ```\nconst newList = list.set(0, { name: 'Riomaggiore' });\n// List [\n// { name:\
    \ 'Riomaggiore' },\n// { name: 'Malaga' }]\n\nconsole.log(list === newList);\n\
    ```\n//false\n\n**添加元素**\n[push(...values)](...) 返回一个新列表，其中附加了提供的值。可用于向列表添加新值。以下是一个示例。\n\
    ```\nconst newList = list.push({name: 'Funchal'});\n// List [\n// { name: 'Rhodes'\
    \ },\n// { name: 'Malaga' },\n// { name: 'Funchal'}]\n```\n添加也可以通过 [concat(...values)](...)\
    \ 完成。它将一个新集合连接到现有集合。要添加单个值，我们用包含一个值的数组调用它。\n```\nconst newList = list.concat([{name:\
    \ 'Funchal'}]);\n// List [\n// { name: 'Rhodes' },\n// { name: 'Malaga' },\n//\
    \ { name: 'Funchal'}]\n```\n[unshift(...values)](...) 返回一个新列表，其中在前面添加了提供的值。\n\n\
    ### 删除元素\n[delete(index)](...) 删除指定索引处的元素并返回一个包含修改的新列表。\n```\nconst newList =\
    \ list.delete(0);\n// List [{ name: 'Malaga' }]\n```\n`delete` 有别名 `remove`。\n\
    \n[pop()](http://example.com) 返回一个移除了最后一个元素的新列表。\n\n[shift()](http://example.com)\
    \ 返回一个移除了第一个元素的新列表。\n\n**清空列表**\n[clear()](http://example.com) 返回一个没有值的新列表。\n\
    ```\nconst newList = list.clear();\n```\n```\nconsole.log(newList)\n// List []\n\
    ```\n\n**数据转换**\n我们可以像处理数组一样处理列表。列表具有 `filter`、`map`、`flatMap`、`reduce` 和 `sort`\
    \ 方法，其工作方式与数组中的类似。`sort` 方法这次是一个纯方法，返回一个新集合。\n\n以下是一个使用 `filter` 方法从目的地对象列表中仅选择前往特定国家的目的地的示例。\n\
    ```\nimport { List } from 'immutable';\n\nconst list = List([\n  { name: 'Cascais',\
    \ country: 'Portugal'},\n  { name: 'Sintra', country: 'Portugal' },\n  { name:\
    \ 'Nerja', country: 'Spain' },\n]);\n```\n```\nfunction inCountry(country){\n\
    \  return function(destination){\n    return destination.country === country;\n\
    \  }\n}\n```\n"
