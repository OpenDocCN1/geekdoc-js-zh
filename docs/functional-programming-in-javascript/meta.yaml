- md: "F is called a factory function. F returns an object containing a closure, `map`,\
    \ accessing the `value` variable from its parent.\n\nThe F factory function creates\
    \ a functor.\n\n## Functor Laws\n\nFunctors must respect identity and composition\
    \ laws.\n\n**Identity Law:** Passing the identity function into the map operation\
    \ of a functor should result in the same functor, meaning a functor storing the\
    \ same value.\n\nConsider the identity function.\n\n```javascript\nfunction identity(n){\n\
    \  return n;\n}\n```\n\n```\nfunctor.map(identity) = functor\n```\n\nLet's verify\
    \ the identity law on our functor.\n\n```javascript\nconst functor = F(1);\n\n\
    const newFunctor = functor.map(identity);\n\n//F(1)\n```\n\n**Composition Law:**\
    \ Function composition is an operation that takes two functions `f` and `g` and\
    \ produces a new function `h` where `h(x) = g(f(x))`. In this operation, the function\
    \ `g` is applied to the result of applying the function `f` to `x`.\n\nWe can\
    \ say that function composition is the operation of applying a function to the\
    \ result of another function.\n\nFunctors must respect the composition law, meaning\
    \ that:\n\n```\nfunctor.map(f).map(g) === functor.map(x => g(f(x)))\n```\n\nLet's\
    \ verify the composition law.\n\n```javascript\nfunction increment(n){\n  return\
    \ n + 1;\n}\n\nfunction double(n){\n  return n * 2;\n}\n\nF(1)\n  .map(increment)\n\
    \  .map(double)\n  //F(4)\n\nF(1)\n  .map(n => double(increment(n)))\n  //F(4)\n\
    ```\n\n## Category Theory\n\nA category is a collection of values that are linked\
    \ by arrows.\n\nA [category](https://en.wikipedia.org/wiki/Category_theory) has\
    \ two main properties, the ability to [compose](https://en.wikipedia.org/wiki/Function_composition)\
    \ the arrows [associatively](https://en.wikipedia.org/wiki/Associative_property),\
    \ and the existence of an [identity](https://en.wikipedia.org/wiki/Identity_element)\
    \ arrow for each value.\n\nThe arrows, also known as morphisms, are functions\
    \ mapping between the values in the category.\n\nHere is a representation of a\
    \ category with three values.\n\n![](img/64a41332f00094d6262a8288d39ce1de_86_0.png)\n\
    \nThe category in this example has three values: 1, 2, 3, and three functions\
    \ mapping between these values. The `f` function maps 1 to 2. The `g` function\
    \ maps 2 to 3. The function `h` mapping from 1 to 3 is equal to `g(f(1))`. For\
    \ each value applying the identity function results in the same value.\n\n## Functors\
    \ in Practice\n\nIn practice, functors are helpful at chaining operations.\n\n\
    What is important for us from the development perspective is to know when something\
    \ is a functor. If it is, we can inspect its value with the identity function\
    \ and we use function composition.\n\nThe functor we have created is called the\
    \ identity functor.\n\nTake into consideration our initial set of data transformations.\
    \ Here is how we can chain the two transformations on a value using the identity\
    \ functor.\n\n```javascript\nF(300)\n  .map(toCelsius)\n  .map(describeTemperature)\n\
    ```\n\nWe can inspect the value inside using the impure variation of the identity\
    \ function that logs the value in the console.\n\n```javascript\nfunction logIdentity(value){\n\
    \  console.log(value);\n  return value;\n}\n\nF(300)\n  .map(toCelsius)\n  .map(logIdentity)\
    \ //26.85\n  .map(describeTemperature)\n  .map(logIdentity) //\"Warm\"\n```\n\n\
    We get the same result also when applying function composition.\n\n```javascript\n\
    F(300)\n  .map(x => describeTemperature(toCelsius(x)))\n  .map(logIdentity)\n\
    \  //\"Warm\"\n```\n\nBelow is an example of applying function composition using\
    \ the `compose` utility from a functional library like [lodash](https://lodash.com).\n\
    \n```javascript\nimport { compose } from 'lodash/fp'\n\nF(300)\n  .map(compose(describeTemperature,\
    \ toCelsius))\n  .map(logIdentity)\n  //\"Warm\"\n```\n\n## Arrays\n\nArrays are\
    \ mappable. The map method iterates over the collection and applies the map function\
    \ to each value in the array.\n\nLet's verify the functor laws on the array.\n\
    \nApplying the identity function on an array creates a copy of it.\n\n```javascript\n\
    [1, 2, 3]\n  .map(identity)\n  .map(logIdentity);\n  //1\n  //2\n  //3\n```\n\n\
    Next, check the composition law.\n\n```javascript\n[1, 2, 3]\n  .map(increment)\n\
    \  .map(double)\n  .map(logIdentity);\n  //4\n  //6\n  //8\n\n[1, 2, 3]\n  .map(x\
    \ => double(increment(x)))\n  .map(logIdentity);\n  //4\n  //6\n  //8\n```\n\n\
    A simple functor wrapping a single value can be created on the fly using an array\
    \ with a single value.\n\n```javascript\n[300]\n  .map(toCelsius)\n  .map(describeTemperature)\n\
    \  .map(logIdentity);\n  //\"Warm\"\n\n[300]\n  .map(x => describeTemperature(toCelsius(x)))\n\
    \  .map(logIdentity);\n  //\"Warm\"\n```\n\nThe built-in arrays are functors.\n\
    \n**Recap:** A category is a collection of values, with arrows between these values.\
    \ Arrows represent mapping functions. Applying the identity function on any value\
    \ returns that value.\n\nFunctors are mappable objects that respect identity and\
    \ composition.\n\nFunctors offer us a helpful way of creating pipelines of data\
    \ transformations over the wrapped value.\n\n# Chapter 10: Monads\n\nA functor\
    \ is an object that wraps a value and enables mapping.\n\nA monad is an object\
    \ that wraps a value and enables mapping and flat mapping.\n\n**Flat Mapping:**\
    \ Let's look again at the `map` method available on the array functor. Applying\
    \ a mapping function that returns a value results in a new array wrapping the\
    \ transformed values.\n\n```javascript\nfunction toUpperCase(text){\n  return\
    \ text.toUpperCase();\n}\n\nconst arr = [\"raspberry strawberry\", \"blueberry\"\
    ]\n  .map(toUpperCase);\n\nconsole.log(arr);\n//[ 'RASPBERRY STRAWBERRY', 'BLUEBERRY'\
    \ ]\n```\n\nThe initial array has two text values. After applying the transformation\
    \ we get an array containing two text values with uppercase letters.\n\nCheck\
    \ what happens when we apply a mapping function that returns an array.\n\n```javascript\n\
    function split(text){\n  return text.split(' ');\n}\n\nconst arr = [\"raspberry\
    \ strawberry\", \"blueberry\"]\n  .map(split);\n\nconsole.log(arr);\n//[ [ 'raspberry',\
    \ 'strawberry' ], [ 'blueberry' ] ]\n```\n\nThe `split` function splits a string\
    \ into an array of substrings using a separator. Each substring represents a word\
    \ in the original text.\n\nApplying the `split` mapping function results in an\
    \ array containing two other arrays. Each sub-array is a collection of strings.\n\
    \nFlat mapping is similar to mapping, but it unwraps the return type.\n\nNext,\
    \ take a look at applying the same mapping function using the `flatMap` method\
    \ available on arrays.\n\n```javascript\nconst arr = [\"raspberry strawberry\"\
    , \"blueberry\"]\n  .flatMap(split);\n\nconsole.log(arr);\n//[ 'raspberry', 'strawberry',\
    \ 'blueberry' ]\n```\n\nThe `flatMap` method first maps each element in the arrays\
    \ using the mapping function, then flattens the result into a new array. The same\
    \ outcome can be achieved by first using `map` and then flatten the result using\
    \ `flat` with depth 1.\n\n```javascript\nconst arr = [\"raspberry strawberry\"\
    , \"blueberry\"]\n  .map(split)\n  .flat();\n\nconsole.log(arr);\n//[ 'raspberry',\
    \ 'strawberry', 'blueberry' ]\n```\n\n`flat` creates a new array with all sub-array\
    \ values concatenated into it. It uses recursion to concatenate values up to the\
    \ specified depth.\n\n```javascript\nconst arr = [1, [2, 3]];\n\nconsole.log(arr.flat());\n\
    //[ 1, 2, 3 ]\n```\n\n## Monads\n\nWe can simply create a monad as an object with\
    \ the `map` and `flatMap` methods. Consider the following `M` function:\n\n```javascript\n\
    function M(value){\n\n  function map(f){\n    const newValue = f(value);\n   \
    \ return M(newValue);\n  }\n\n  function flatMap(f){\n    const newValue = f(value);\n\
    \    return newValue;\n  }\n\n  return {\n    map,\n    flatMap\n  }\n}\n```\n\
    \nM is a factory function that creates an object wrapping a value and having two\
    \ methods to modify it, `map` and `flatMap`.\n\n`map` takes a transformation function\
    \ and uses it to create a new value then uses the M factory function to create\
    \ an object wrapping that new value.\n\n`flatMap` uses the transformation function\
    \ to compute a new value and returns it.\n\nM is the monad constructor. It takes\
    \ a value and returns a monad wrapping the value.\n\nM is called the identity\
    \ monad.\n\n## Monad Laws\n\nThere are three laws monads should respect.\n\n**Left\
    \ Identity:** Consider `f` as a mapping function returning a monad. Passing the\
    \ `f` function into the `flatMap` operation of a monad wrapping the value `x`\
    \ should result in the same monad as invoking the function `f(x)`.\n\n```\nM(x).flatMap(f)\
    \ === f(x)\n```\n\nLet's verify the left identity law on our monad.\n\n```javascript\n\
    function f(){\n  return M(2);\n}\n\nM(1)\n  .flatMap(f);\n```"
  mdcn: "\nF 被称为工厂函数。F 返回一个包含闭包 `map` 的对象，该闭包访问其父作用域中的 `value` 变量。\n\nF 工厂函数创建一个函子。\n\
    \n## 函子定律\n\n函子必须遵守**同一性定律**和**组合定律**。\n\n**同一性定律：** 将同一性函数传入函子的 map 操作应得到相同的函子，即存储相同值的函子。\n\
    \n考虑同一性函数。\n\n```javascript\nfunction identity(n){\n  return n;\n}\n```\n\n```\n\
    functor.map(identity) = functor\n```\n\n让我们在我们的函子上验证同一性定律。\n\n```javascript\n\
    const functor = F(1);\n\nconst newFunctor = functor.map(identity);\n\n//F(1)\n\
    ```\n\n**组合定律：** 函数组合是一种操作，它接受两个函数 `f` 和 `g`，并产生一个新函数 `h`，其中 `h(x) = g(f(x))`。在这个操作中，函数\
    \ `g` 被应用于将函数 `f` 应用于 `x` 的结果。\n\n我们可以说，函数组合是将一个函数应用于另一个函数结果的操作。\n\n函子必须遵守组合定律，这意味着：\n\
    \n```\nfunctor.map(f).map(g) === functor.map(x => g(f(x)))\n```\n\n让我们验证组合定律。\n\
    \n```javascript\nfunction increment(n){\n  return n + 1;\n}\n\nfunction double(n){\n\
    \  return n * 2;\n}\n\nF(1)\n  .map(increment)\n  .map(double)\n  //F(4)\n\nF(1)\n\
    \  .map(n => double(increment(n)))\n  //F(4)\n```\n\n## 范畴论\n\n范畴是一组通过箭头连接的值。\n\
    \n一个[范畴](https://en.wikipedia.org/wiki/Category_theory)有两个主要性质：[组合](https://en.wikipedia.org/wiki/Function_composition)箭头的能力具有[结合性](https://en.wikipedia.org/wiki/Associative_property)，以及每个值都存在一个[同一性](https://en.wikipedia.org/wiki/Identity_element)箭头。\n\
    \n箭头，也称为态射，是在范畴中值之间映射的函数。\n\n以下是包含三个值的范畴的表示。\n\n![](img/64a41332f00094d6262a8288d39ce1de_86_0.png)\n\
    \n本例中的范畴有三个值：1、2、3，以及三个在这些值之间映射的函数。`f` 函数将 1 映射到 2。`g` 函数将 2 映射到 3。从 1 映射到 3 的函数\
    \ `h` 等于 `g(f(1))`。对于每个值，应用同一性函数都会得到相同的值。\n\n## 实践中的函子\n\n在实践中，函子有助于链式操作。\n\n\
    从开发角度来看，重要的是要知道某个东西是否是函子。如果是，我们就可以用同一性函数检查它的值，并使用函数组合。\n\n我们创建的函子被称为**同一性函子**。\n\
    \n考虑我们最初的一组数据转换。以下是如何使用同一性函子对某个值链式执行两个转换。\n\n```javascript\nF(300)\n  .map(toCelsius)\n\
    \  .map(describeTemperature)\n```\n\n我们可以使用同一性函数的不纯变体来检查内部的值，该变体将值记录到控制台中。\n\n\
    ```javascript\nfunction logIdentity(value){\n  console.log(value);\n  return value;\n\
    }\n\nF(300)\n  .map(toCelsius)\n  .map(logIdentity) //26.85\n  .map(describeTemperature)\n\
    \  .map(logIdentity) //\"Warm\"\n```\n\n应用函数组合时，我们也得到了相同的结果。\n\n```javascript\n\
    F(300)\n  .map(x => describeTemperature(toCelsius(x)))\n  .map(logIdentity)\n\
    \  //\"Warm\"\n```\n\n以下是使用 [lodash](https://lodash.com) 等函数式库中的 `compose` 工具应用函数组合的示例。\n\
    \n```javascript\nimport { compose } from 'lodash/fp'\n\nF(300)\n  .map(compose(describeTemperature,\
    \ toCelsius))\n  .map(logIdentity)\n  //\"Warm\"\n```\n\n## 数组\n\n数组是可映射的。map\
    \ 方法遍历集合，并将映射函数应用于数组中的每个值。\n\n让我们在数组上验证函子定律。\n\n对数组应用同一性函数会创建一个副本。\n\n```javascript\n\
    [1, 2, 3]\n  .map(identity)\n  .map(logIdentity);\n  //1\n  //2\n  //3\n```\n\n\
    接下来，检查组合定律。\n\n```javascript\n[1, 2, 3]\n  .map(increment)\n  .map(double)\n \
    \ .map(logIdentity);\n  //4\n  //6\n  //8\n\n[1, 2, 3]\n  .map(x => double(increment(x)))\n\
    \  .map(logIdentity);\n  //4\n  //6\n  //8\n```\n\n可以使用包含单个值的数组即时创建一个包装单个值的简单函子。\n\
    \n```javascript\n[300]\n  .map(toCelsius)\n  .map(describeTemperature)\n  .map(logIdentity);\n\
    \  //\"Warm\"\n\n[300]\n  .map(x => describeTemperature(toCelsius(x)))\n  .map(logIdentity);\n\
    \  //\"Warm\"\n```\n\n内置数组就是函子。\n\n**回顾：** 范畴是一组值，这些值之间有箭头。箭头代表映射函数。对任何值应用同一性函数都会返回该值。\n\
    \n函子是遵守同一性和组合的可映射对象。\n\n函子为我们提供了一种有用的方式，可以在包装值之上创建数据转换管道。\n\n# 第 10 章：单子\n\n函子是包装一个值并启用映射的对象。\n\
    \n单子是包装一个值并启用映射和扁平映射的对象。\n\n**扁平映射：** 让我们再次看看数组函子上可用的 `map` 方法。应用返回一个值的映射函数会产生一个包装转换后值的新数组。\n\
    \n```javascript\nfunction toUpperCase(text){\n  return text.toUpperCase();\n}\n\
    \nconst arr = [\"raspberry strawberry\", \"blueberry\"]\n  .map(toUpperCase);\n\
    \nconsole.log(arr);\n//[ 'RASPBERRY STRAWBERRY', 'BLUEBERRY' ]\n```\n\n初始数组有两个文本值。应用转换后，我们得到包含两个大写字母文本值的数组。\n\
    \n检查当我们应用一个返回数组的映射函数时会发生什么。\n\n```javascript\nfunction split(text){\n  return\
    \ text.split(' ');\n}\n\nconst arr = [\"raspberry strawberry\", \"blueberry\"\
    ]\n  .map(split);\n\nconsole.log(arr);\n//[ [ 'raspberry', 'strawberry' ], [ 'blueberry'\
    \ ] ]\n```\n\n`split` 函数使用分隔符将字符串分割为子字符串数组。每个子字符串代表原始文本中的一个单词。\n\n应用 `split` 映射函数会产生一个包含另两个数组的数组。每个子数组都是字符串的集合。\n\
    \n扁平映射类似于映射，但它会解包返回类型。\n\n接下来，看看使用数组上可用的 `flatMap` 方法应用相同的映射函数。\n\n```javascript\n\
    const arr = [\"raspberry strawberry\", \"blueberry\"]\n  .flatMap(split);\n\n\
    console.log(arr);\n//[ 'raspberry', 'strawberry', 'blueberry' ]\n```\n\n`flatMap`\
    \ 方法首先使用映射函数映射数组中的每个元素，然后将结果扁平化为一个新数组。通过先使用 `map`，然后使用深度为 1 的 `flat` 来扁平化结果，可以获得相同的结果。\n\
    \n```javascript\nconst arr = [\"raspberry strawberry\", \"blueberry\"]\n  .map(split)\n\
    \  .flat();\n\nconsole.log(arr);\n//[ 'raspberry', 'strawberry', 'blueberry' ]\n\
    ```\n\n`flat` 创建一个包含所有子数组值连接的新数组。它使用递归来连接值，直到指定的深度。\n\n```javascript\nconst arr\
    \ = [1, [2, 3]];\n\nconsole.log(arr.flat());\n//[ 1, 2, 3 ]\n```\n\n## 单子\n\n\
    我们可以简单地将单子创建为具有 `map` 和 `flatMap` 方法的对象。考虑以下 `M` 函数：\n\n```javascript\nfunction\
    \ M(value){\n\n  function map(f){\n    const newValue = f(value);\n    return\
    \ M(newValue);\n  }\n\n  function flatMap(f){\n    const newValue = f(value);\n\
    \    return newValue;\n  }\n\n  return {\n    map,\n    flatMap\n  }\n}\n```\n\
    \nM 是一个工厂函数，它创建一个包装值并具有两个方法来修改它的对象，`map` 和 `flatMap`。\n\n`map` 接受一个转换函数，并使用它来创建一个新值，然后使用\
    \ M 工厂函数创建一个包装该新值的对象。\n\n`flatMap` 使用转换函数计算一个新值并返回它。\n\nM 是单子构造器。它接受一个值并返回一个包装该值的单子。\n\
    \nM 被称为**同一性单子**。\n\n## 单子定律\n\n单子应该遵守三个定律。\n\n**左同一性：** 将 `f` 视为返回单子的映射函数。将 `f`\
    \ 函数传入包装值 `x` 的单子的 `flatMap` 操作，应该与调用函数 `f(x)` 产生相同的单子。\n\n```\nM(x).flatMap(f)\
    \ === f(x)\n```\n\n让我们在我们的单子上验证左同一性定律。\n\n```javascript\nfunction f(){\n  return\
    \ M(2);\n}\n\nM(1)\n  .flatMap(f);\n```\n"
