  md: '# Setup First, we need to setup our development environment to use the latest
    JavaScript features.


    **Package Manager** A package manager is a tool used to track project dependencies
    in an easy to use manner. At the time of writing, Node.js package manager, in
    short `npm`, is the most popular. Let''s start by installing [Node.js](https://nodejs.org/).


    The following commands can then be used in command prompt to check the Node.js
    and npm versions: node --version


    `npm --v` NPM Packages With npm we can install additional packages. These packages
    are the application dependencies.


    The `package.json` file stores all the node packages used in the project. These
    packages are the application dependencies. The application can be shared with
    other developers without sharing all the node packages. Installing all the packages
    defined in the `package.json` file can be done using the `npm install` command.


    Start by creating a package.json file using `npm`.


    `npm init` We need a tool that converts our JavaScript code into a backward-compatible
    version and has support for [modules](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules).
    We need [Babel](https://babeljs.io/). Go and install the necessary packages.


    ```

    npm install @babel/core @babel/node @babel/preset-env --save

    ```


    The installed packages can be found in the `node_modules` folder. The `--save`
    flag tells npm to store the package requirement in the `package.json` file.


    In order to use the latest JavaScript, we need to enable a preset. Create the
    `.babelrc` file and enable the [babel/preset-env](https://babeljs.io/docs/en/babel-preset-env)
    preset.'
