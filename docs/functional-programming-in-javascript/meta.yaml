    ```\n\n//Modifying an array is not allowed\n\n## Changing Arrays\n\nNext, look\
    \ at how we can do the basic add, edit, and remove operations on an immutable\
    \ array. Consider the array of game objects.\n\n```\nconst games = [\n  {id: 1,\
    \ title: 'WarCraft'},\n  {id: 2 title: 'X-COM: UFO Defense' }\n]\n```\n\n### Adding\n\
    \n**`concat` takes one or more arrays and concatenates them together.**\n\nIt\
    \ can be used for adding. It creates a new array with the new value.\n\n```\n\
