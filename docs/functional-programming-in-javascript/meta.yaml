  - "[PAGE 28]\n\n# # Chapter 04: Arrays\n\nArrays are indexed collections of values.\
    \ Both arrays and objects are collections of values. In fact, arrays are emulated\
    \ using objects.\n\nWe simply create an array using the array literal. Here is\
    \ an example.\n\n```\nconst arr = [1, 2, 3]; Detecting if a value is an array\
    \ can be done with Array.isArray .\n\nArray.isArray(arr);\n//true Arrays have\
    \ a set of methods for data transformations.\n```\n\nData transformation is one\
    \ of those tasks where functional programming really shines. It makes these transformations\
    \ easier to manage and understand. It does that by identifying a core set of operations\
    \ all transformations do like filtering, mapping, sorting, and aggregating.\n\n\
    # ## Filtering Consider the next example selecting only the even numbers from\
    \ an array.\n\n```\nconst numbers = [1, 2, 3, 4];\n\nfunction isEven(n) {\n  return\
    \ n % 2 == 0;\n}\n\nconst evenNumbers = numbers.filter(isEven);\nconsole.log(evenNumbers);\n\
