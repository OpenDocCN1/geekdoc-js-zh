    **objects at creation and they become immutable. Another simple solution is to
    use a linter to make sure no mutations are done in the application.**


    Immutable data structures are available in libraries like Immutable.JS. They offer
    optimization improvements and a nicer public interface.


    We should not be concerned about creating intermediate collections when processing
    a list. When the list is small, less than a thousand records the difference is
    indistinguishable. When working with collections of thousands of objects we can
    start using sequences that do not create intermediate collections.


    # **Pipelines We saw different ways of creating pipelines of data transformations
    from the `pipe` utility to the chaining transformations on arrays, immutable lists,
    sequences, promises, or observables.**


    All these data structures wrap one or more values and allow us the create pipelines
    of pure functions transforming the wrapped data. Usually, there are a set of common
    transformations like `filter` , `map` , `reduce` , or `sort` that all these data
    structures support.


    The currying technique is useful in this case to pass additional arguments to
    the functions in the pipeline.


    Functional programming starts to be about transforming data with pipelines of
    pure functions. In a sense, functional programming promotes a data-flow programming
    style.'
  - '[PAGE 178]


    # Loops


    Purely functional languages do not have loops. Such functionalities are implemented
    using the array methods and falling back to recursion for specific algorithms.


    At the moment of writing it is not possible to disable all loop statements in
    JavaScript because it lacks the [tail-call](https://en.wikipedia.org/wiki/Tail_call)
    implementation.


    # Naming


    Splitting the application into pure functions is not enough. We need to give intention
    revealing names to those functions. So take your time to do that. If you failed
    the application will still be harder to understand.


    # Folder Structure


    As the application grows more and more functions will be created. You will need
    to find a way to structure these functions in modules. That means creating files
    with a clear name containing those functions. Then you need a way to structure
    those files in folders. There will be common functions and there will be functions
    used only in a specific module.


    # Final Thoughts


    An application written in a functional style consists of numerous pure functions,
    organized into modules. We use these functions into pipelines and compose them
    to implement the required functionalities Functional programing makes code easier
    to read. Programs that are not easily understood may lead to bugs and are most
    often remade.'
