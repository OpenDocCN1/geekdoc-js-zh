    \  category: 'JavaScript'\n};\n```\n\nconsole.log(book); The key is a string that\
    \ is unique in the collection. It is case sensitive.\n\nWe can access a property\
    \ using the dot notation or the bracket notation.\n\n```\nconsole.log(book.title);\n\
    //\"JavaScript Allongé\"\n```\n\nconsole.log(book[\"title\"]); Immutability Immutability\
    \ is one of the core principles of functional programming.\n\nMutation means change.\
