- md: "```markdown\nimport ReactDOM from 'react-dom';\nimport { createStore } from\
    \ 'redux';\nimport { Provider } from 'react-redux';\nimport Counter from './Counter';\n\
    import { reducer } from './store';\n\nconst store = createStore(reducer);\n\n\
    ReactDOM.render(\n  <React.StrictMode>\n    <Provider store={store}>\n      <Counter\
    \ />\n    </Provider>\n  </React.StrictMode>,\n  document.getElementById('root')\n\
    );\n```\n\n## Random Number with Elm\n\nNext, we will create another page that\
    \ displays a random number. This may look simpler than previous functionality\
    \ but it is actually harder to do because generating random numbers cannot be\
    \ done with a pure function.\n\nPure functions are deterministic functions. Called\
    \ with the same input they always return the same output. Elm is a purely functional\
    \ language. That means it allows us to write only pure functions. How is possible\
    \ then to generate random numbers and write only pure functions?\n\nLet's find\
    \ out.\n\n## Model\n\nAgain we need a model to store our application data that\
    \ can change. The model contains just a number.\n\n```\ntype alias Model = {\n\
    \  number : Int\n}\n\ninitModel : () -> (Model, Cmd Msg)\n\ninitModel _ =\n  (\
    \ Model 0\n  , Cmd.none\n  )\n```\n\n## Messages\n\nThe user can press the generate\
    \ button so we need a message to express that interaction, `GenerateNumber`.\n\
    \n```\ntype Msg = GenerateNumber\n```\n\n## View\n\nThe view function takes the\
    \ model and renders the UI. It displays the current number stored in the model\
    \ inside a div element. It also shows the button for generating a new number.\
    \ When the button is pressed the `GenerateNumber` message is created.\n\n```\n\
    view : Model -> Html Msg\n\nview model =\n  div []\n    [ div [] [ text (String.fromInt\
    \ model.number) ]\n    , button [ onClick GenerateNumber ] [ text \"Generate\"\
    \ ]\n    ]\n```\n\n## Update\n\nThe update function takes the current messages\
    \ and generates the new model. The update function is pure. It cannot generate\
    \ a random number. Instead what it does is to create a command telling the Elm\
    \ framework to generate the random number and then put the result inside a new\
    \ message. We are going to call this new message `SetNumber`. At this point we\
    \ realize that messages can take arguments, messages can be functions.\n\n```\n\
    type Msg = GenerateNumber | SetNumber Int\n```\n\nIn order to use the `Random.generate`\
    \ command we need to install an additional package.\n\n```\nelm install elm/random\n\
    ```\n\nHere is the update function handling both messages.\n\n```\nupdate : Msg\
    \ -> Model -> (Model, Cmd Msg)\n\nupdate msg model =\n  case msg of\n    GenerateNumber\
    \ ->\n      ( model\n      , Random.generate SetNumber (Random.int 1 100)\n  \
    \    )\n\n    SetNumber number ->\n      ( Model number\n      , Cmd.none\n  \
    \    )\n```\n\nWhen the update function receives the `GenerateNumber` message,\
    \ it creates a command using the `Random.generate` function. The Elm framework\
    \ runs the command, generates the random number, and builds a new message `SetNumber`\
    \ containing this random number. The update function does not modify the model\
    \ in this case, it returns the same model.\n\nWhen the update function receives\
    \ the `SetNumber` messages with the random number it returns a new model containing\
    \ the newly generated number. The update function does not generate any command\
    \ in this case, it returns `Cmd.none`.\n\nAs noticed in order to work with impure\
    \ logic the update function returns two things for each message, the new model\
    \ and a new command that the Elm framework has to execute.\n\nHere is how we can\
    \ write a function that returns two values in JavaScript. We simply return an\
    \ array containing the two values. Then we use the [destructuring assignment](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring_assignment)\
    \ syntax on the left-hand side of the assignment to unpack the returned values.\n\
    \n```\nfunction update(model, action){\n  switch(action.type){\n    case 'GenerateNumber'\
    \ : {\n      const command = {\n        name: 'Random.generate',\n        resultMessage\
    \ : 'SetNumber'\n      };\n      \n      return [model, command];\n    }\n   \
    \ \n    case 'SetNumber' : {\n      const newModel = { ...model, number: action.payload\
    \ };\n      const command = { name: 'Cmd.none' };\n      return [newModel, command];\n\
    \    }\n    \n    default : {\n      const command = { name: 'Cmd.none' };\n \
    \     return [model, command];\n    }\n  }\n}\n```\n\n```\nconst [model, command]\
    \ = update({}, 'GenerateNumber');\nconsole.log(model);\nconsole.log(command);\n\
    //{}\n//{name: \"Cmd.none\"}\n```\n\nNote that a command is a plain object describing\
    \ the command to execute. Also, remark that we use curly brackets inside the switch\
    \ branches to define a block scope for each clause and allow declaring variables\
    \ with the same name in different branches.\n\nBelow is how the data flow looks\
    \ like when using commands for handling impure logic.\n\n![](img/64a41332f00094d6262a8288d39ce1de_168_0.png)\n\
    \n## Random Number with React and Redux\n\nNow let's implement the same functionality\
    \ in JavaScript.\n\n### Model\n\nWe start by defining the model as an object with\
    \ the `number` property set to 0.\n\n```\nconst initialModel = {\n  number: 0\n\
    };\n```\n\n### Commands\n\nThis is the point where we have problems generating\
    \ random numbers and still using pure functions. Redux allows us to define a place\
    \ where to put such impure logic but has no solution to avoid it altogether.\n\
    \nWe are going to follow the Redux pattern and define `GenerateNumber` as a function\
    \ returning another function. The returned function is called a thunk and contains\
    \ the impure logic. The result of this impure logic will be passed as an argument\
    \ to the `SetNumber` message.\n\n```\nfunction GenerateNumber(){\n  return function(dispatch){\n\
    \    const number = Math.floor(Math.random() * 100);\n    dispatch(SetNumber(number));\n\
    \  }\n}\n```\n\n### Messages\n\nThe `SetNumber` message is needed by the `GenerateNumber`\
    \ command to send the newly generated number.\n\n```\nfunction SetNumber(number){\n\
    \  return {\n    type : SetNumber.name,\n    number\n  }\n}\n```\n\n### View\n\
    \nThe view function takes the model and creates the HTML for it. When the generate\
    \ button is pressed it dispatches the `GenerateNumber` command.\n\n```\nimport\
    \ React from 'react';\nimport { connect } from 'react-redux';\nimport { GenerateNumber\
    \ } from './store';\n\nfunction Counter({number, GenerateNumber}){\n  return(\n\
    \    <div>\n      <div>{number}</div>\n      <button\n        type=\"button\"\n\
    \        onClick={GenerateNumber}>Generate</button>\n    </div>\n  )\n}\n\nexport\
    \ default connect(\n  state => state,\n  { GenerateNumber }\n)(Counter)\n```\n\
    \n### Update\n\nThe update function handles the application messages. When the\
    \ `SetNumber` message is received it returns a model with the new number value.\n\
    \n```\nfunction reducer(model = initialModel, action){\n  switch(action.type){\n\
    \    case SetNumber.name:\n      return { ...model, number: action.number };\n\
    \    default:\n      return model;\n  }\n}\n```\n\n## Recap\n\nThe Elm architecture\
    \ defines the flow that allows us to write a practical application in a functional\
    \ style.\n\nThe model is an immutable object representing all the application\
    \ state.\n\nThe view function is a pure function building the HTML and creating\
    \ messages. The view function is not responsible for rendering HTML on a screen.\
    \ It takes a model and returns HTML. The Elm framework uses the view function\
    \ to render this HTML on the screen.\n\nMessages are requests to modify the application's\
    \ model.\n\nThe update function is a pure function taking in the current model\
    \ and a message and returning the new model. When dealing with side-effects it\
    \ also returns a new command. The update function doesn't effectively change the\
    \ model. The Elm framework uses the update function to change the model. The Elm\
    \ framework executes the command returned by the update function and creates a\
    \ new message with the result.\n\n# Chapter 17: Functional Paradigm\n\nNow we\
    \ are going to look back at what it means to program in a functional style.\n\n\
    The main idea in functional programming is to split the application into small\
    \ pure functions that communicate using immutable data and then compose these\
    \ functions to implement the required functionality.\n\nIdeally, all the functions\
    \ in the application should be pure functions.\n\n**Purity** — As repeated many\
    \ times, the point of functional programming is to write pure functions. These\
    \ are functions that just transform values.\n\nWhen a pure function returns the\
    \ application has the same state as when the function was called. An application\
    \ is much easier to understand when we don't have to track variables changing\
    \ their values. Pure functions make code easier to follow by allowing us to focus\
    \ our attention in one place.\n\nThe challenge is, of course, to create a practical\
    \ application doing only transformations with pure functions. Is that even possible?\n\
    \nWe saw that it is achievable if we have the right framework using these pure\
    \ functions and doing the impure logic necessary for a practical application.\
    \ Such architecture was implemented in Elm.\n\nHere is the flow of executing impure\
    \ logic in Elm:\n```"
  mdcn: "\n```markdown\nimport ReactDOM from 'react-dom';\nimport { createStore }\
    \ from 'redux';\nimport { Provider } from 'react-redux';\nimport Counter from\
    \ './Counter';\nimport { reducer } from './store';\n\nconst store = createStore(reducer);\n\
    \nReactDOM.render(\n  <React.StrictMode>\n    <Provider store={store}>\n     \
    \ <Counter />\n    </Provider>\n  </React.StrictMode>,\n  document.getElementById('root')\n\
    );\n```\n\n## 使用 Elm 生成随机数\n\n接下来，我们将创建另一个页面来显示随机数。这可能看起来比之前的功 能更简单，但实际上更难实现，因为生成随机数无法通过纯函数完成。\n\
    \n纯函数是具有确定性的函数。使用相同的输入调用时，它们总是返回相同的输出。Elm 是一门纯函数式语言。这意味着它只允许我们编写纯函数。那么，如果只能写纯函数，又如何生成随机数呢？\n\
    \n让我们来找出答案。\n\n## 模型\n\n同样，我们需要一个模型来存储可能发生变化的应用数据。这个模型只包含一个数字。\n\n```\ntype alias\
    \ Model = {\n  number : Int\n}\n\ninitModel : () -> (Model, Cmd Msg)\n\ninitModel\
    \ _ =\n  ( Model 0\n  , Cmd.none\n  )\n```\n\n## 消息\n\n用户可以按下生成按钮，因此我们需要一个消息来表达这个交互动作，`GenerateNumber`。\n\
    \n```\ntype Msg = GenerateNumber\n```\n\n## 视图\n\n视图函数接收模型并渲染用户界面。它在一个 div 元素中显示模型中存储的当前数字。同时它还显示用于生成新数字的按钮。当按钮被按下时，`GenerateNumber`\
    \ 消息被创建。\n\n```\nview : Model -> Html Msg\n\nview model =\n  div []\n    [ div\
    \ [] [ text (String.fromInt model.number) ]\n    , button [ onClick GenerateNumber\
    \ ] [ text \"Generate\" ]\n    ]\n```\n\n## 更新\n\n更新函数接收当前消息并生成新模型。更新函数是纯函数。它不能生成随机数。取而代之的是，它创建一个命令，告诉\
    \ Elm 框架生成随机数，然后将结果放入一个新消息中。我们将这个新消息称为 `SetNumber`。此时我们意识到，消息可以带参数，消息可以是函数。\n\n\
    ```\ntype Msg = GenerateNumber | SetNumber Int\n```\n\n为了使用 `Random.generate`\
    \ 命令，我们需要安装一个额外的包。\n\n```\nelm install elm/random\n```\n\n下面是处理两种消息的更新函数。\n\n\
    ```\nupdate : Msg -> Model -> (Model, Cmd Msg)\n\nupdate msg model =\n  case msg\
    \ of\n    GenerateNumber ->\n      ( model\n      , Random.generate SetNumber\
    \ (Random.int 1 100)\n      )\n\n    SetNumber number ->\n      ( Model number\n\
    \      , Cmd.none\n      )\n```\n\n当更新函数收到 `GenerateNumber` 消息时，它使用 `Random.generate`\
    \ 函数创建一个命令。Elm 框架执行该命令，生成随机数，并构建一个包含此随机数的新消息 `SetNumber`。在这种情况下，更新函数不会修改模型，它返回相同的模型。\n\
    \n当更新函数收到带有随机数的 `SetNumber` 消息时，它返回一个包含新生成数字的新模型。在这种情况下，更新函数不生成任何命令，它返回 `Cmd.none`。\n\
    \n如前所述，为了处理非纯逻辑，更新函数针对每条消息返回两个值：新模型和 Elm 框架必须执行的新命令。\n\n以下是我们如何在 JavaScript 中编写返回两个值的函数。我们简单地返回一个包含两个值的数组。然后在赋值语句的左侧使用[解构赋值](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring_assignment)语法来解包返回的值。\n\
    \n```\nfunction update(model, action){\n  switch(action.type){\n    case 'GenerateNumber'\
    \ : {\n      const command = {\n        name: 'Random.generate',\n        resultMessage\
    \ : 'SetNumber'\n      };\n      \n      return [model, command];\n    }\n   \
    \ \n    case 'SetNumber' : {\n      const newModel = { ...model, number: action.payload\
    \ };\n      const command = { name: 'Cmd.none' };\n      return [newModel, command];\n\
    \    }\n    \n    default : {\n      const command = { name: 'Cmd.none' };\n \
    \     return [model, command];\n    }\n  }\n}\n```\n\n```\nconst [model, command]\
    \ = update({}, 'GenerateNumber');\nconsole.log(model);\nconsole.log(command);\n\
    //{}\n//{name: \"Cmd.none\"}\n```\n\n注意，命令是一个描述要执行的命令的普通对象。另外，请注意我们在 switch 分支中使用大括号来为每个子句定义块作用域，并允许在不同分支中声明相同名称的变量。\n\
    \n下面是使用命令处理非纯逻辑时的数据流示意图。\n\n![](img/64a41332f00094d6262a8288d39ce1de_168_0.png)\n\
    \n## 使用 React 和 Redux 生成随机数\n\n现在让我们在 JavaScript 中实现相同的功能。\n\n### 模型\n\n我们首先将模型定义为一个对象，其\
    \ `number` 属性设置为 0。\n\n```\nconst initialModel = {\n  number: 0\n};\n```\n\n###\
    \ 命令\n\n这就是我们在生成随机数的同时仍然使用纯函数时遇到问题的地方。Redux 允许我们定义一个地方来放置这种非纯逻辑，但没有办法完全避免它。\n\n\
    我们将遵循 Redux 模式，将 `GenerateNumber` 定义为一个返回另一个函数的函数。返回的函数称为 thunk，包含非纯逻辑。这个非纯逻辑的结果将作为参数传递给\
    \ `SetNumber` 消息。\n\n```\nfunction GenerateNumber(){\n  return function(dispatch){\n\
    \    const number = Math.floor(Math.random() * 100);\n    dispatch(SetNumber(number));\n\
    \  }\n}\n```\n\n### 消息\n\n`GenerateNumber` 命令需要 `SetNumber` 消息来发送新生成的数字。\n\n```\n\
    function SetNumber(number){\n  return {\n    type : SetNumber.name,\n    number\n\
    \  }\n}\n```\n\n### 视图\n\n视图函数接收模型并为其创建 HTML。当按下生成按钮时，它分发 `GenerateNumber` 命令。\n\
    \n```\nimport React from 'react';\nimport { connect } from 'react-redux';\nimport\
    \ { GenerateNumber } from './store';\n\nfunction Counter({number, GenerateNumber}){\n\
    \  return(\n    <div>\n      <div>{number}</div>\n      <button\n        type=\"\
    button\"\n        onClick={GenerateNumber}>Generate</button>\n    </div>\n  )\n\
    }\n\nexport default connect(\n  state => state,\n  { GenerateNumber }\n)(Counter)\n\
    ```\n\n### 更新\n\n更新函数处理应用消息。当收到 `SetNumber` 消息时，它返回带有新数字值的模型。\n\n```\nfunction\
    \ reducer(model = initialModel, action){\n  switch(action.type){\n    case SetNumber.name:\n\
    \      return { ...model, number: action.number };\n    default:\n      return\
    \ model;\n  }\n}\n```\n\n## 回顾\n\nElm 架构定义了流程，使我们能够以函数式风格编写实用的应用程序。\n\n模型是一个不可变对象，代表所有应用状态。\n\
    \n视图函数是一个纯函数，构建 HTML 并创建消息。视图函数不负责在屏幕上渲染 HTML。它接收一个模型并返回 HTML。Elm 框架使用视图函数在屏幕上渲染此\
    \ HTML。\n\n消息是修改应用模型的请求。\n\n更新函数是一个纯函数，接收当前模型和一条消息，并返回新模型。当处理副作用时，它还会返回一个新命令。更新函数实际上并不改变模型。Elm\
    \ 框架使用更新函数来改变模型。Elm 框架执行更新函数返回的命令，并使用结果创建新消息。\n\n# 第 17 章：函数式范式\n\n现在我们来回顾以函数式风格编程意味着什么。\n\
    \n函数式编程的主要思想是将应用拆分为小的纯函数，这些函数使用不可变数据进行通信，然后组合这些函数来实现所需的功能。\n\n理想情况下，应用中的所有函数都应该是纯函数。\n\
    \n**纯粹性** —— 正如多次重复的那样，函数式编程的重点是编写纯函数。这些是只进行值转换的函数。\n\n当纯函数返回时，应用的状态与函数被调用时相同。当我们不需要跟踪变量改变其值时，应用更容易理解。纯函数使我们能够将注意力集中在一个地方，从而让代码更易于理解。\n\
    \n当然，挑战在于只使用纯函数进行转换来创建一个实用的应用。这甚至可能吗？\n\n我们看到，如果我们有合适的框架来使用这些纯函数，并执行实用应用所需的非纯逻辑，这是可以实现的。这种架构在\
    \ Elm 中得到了实现。\n\n以下是 Elm 中执行非纯逻辑的流程：\n```\n"
