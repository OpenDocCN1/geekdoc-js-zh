    \ O(1)。\n\n## 第 12 章：惰性转换\n\n`filter`、`map`、`reduce` 等数组操作使转换更易于阅读和理解，但正如你所注意到的，这些转换在每一步都会创建一个新数组。对于包含数千条记录的大型数组，这可能会带来性能损失。\n\
