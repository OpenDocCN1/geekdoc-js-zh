  mdcn: "\n ## 第六章：语句\n\n表达式是一个或多个值、变量、运算符和函数的组合，用于产生一个新值。简而言之，表达式是产生值的代码单元。\n\n语句是执行操作的指令。在函数式编程中，所有内容都应该是产生值的表达式。为了实现这一点，我们将审查并移除那些不产生值的语句。\n\
    \n## 表达式\n\n例如，`1 + 2` 是一个表达式。\n\n当函数返回值时，函数调用就是一个表达式。考虑 `multiply` 函数。\n\n```\n\
    function multiply(a, b){\n  return a * b;\n}\n```\n\n`multiply(2, 3)` 是一个表达式。\n\
    \n表达式可以包含其他表达式。例如，表达式 `multiply(2, 3+7)` 包含表达式 `3+7`。\n\n算术表达式计算结果为数字。\n\n字符串表达式计算结果为字符串。这里是一个例子：\n\
    \n```\n\"This \" + \"IS A texT\".toLowerCase();\n//\"This is a text\"\n```\n\n\
    逻辑表达式计算结果为 true 或 false。这些表达式通常使用 [逻辑运算符](link) 如 `&&`、`||`、`!` 或 `===`。\n\n```\n\
    1 === 2;\n//false\n```\n\n表达式是返回一段值的代码。\n\n## 语句声明\n\n有三种用于声明变量的语句：`var`、`let`\
    \ 和 `const`。\n\n`var` 语句声明一个具有函数作用域但没有块级作用域的变量。这可能会令人困惑。`var` 声明已经过时，因此我们可以通过\
    \ lint 规则禁用它的使用。\n\n```\n\"no-var\": \"error\"\n```\n\n我建议使用 `const` 作为默认声明，并将\
    \ `let` 作为第二选择。`const` 声明禁止重新赋值变量，而且由于我们所有的值都是不可变的，因此我们创建了真正不能重新赋值或更改的常量。\n\n\
    使用 `const` 声明意味着每次更改某些内容时都创建一个新变量。这促进了函数纯度。\n\n## 条件语句\n\n### if 语句\n\n`if` 语句不一定会返回一个值，因此在函数式风格中，我们应该么始终包含\
    \ `else` 分支并返回一个值，要么完全禁用 `if` 语句。\n\n我们将要禁用以下 `if` 语句的用法。\n\n```\nconst n = 3;\n\
    let isEven;\n```\n\n```\nif(n % 2 === 0){\n    isEven = true;\n} else {\n    isEven\
    \ = false;\n}\n```\n\nconsole.log(isEven);\n\n只有当 `if` 语句包含 `else` 语句且所有分支都有 `return`\
    \ 语句时，才允许使用 if 语句。\n\n这是相应的 lint 规则。\n\n```\n\"functional/no-conditional-statement\"\
    : [\"error\", {\n    \"allowReturningBranches\": \"ifExhaustive\"\n}]\n```\n\n\
    下面是一个带有 else 分支且始终返回的 if 语句示例。\n\n```\nfunction isEven(n){\n    if(n % 2 === 0){\n\
    \        return true;\n    } else {\n        return false;\n    }\n}\n```\n\n\
    console.log(isEven(3));\n\n### 条件运算符\n\n更好的选择是使用条件运算符，它是一个返回值的表达式。\n\n```\nconst\
    \ n = 3;\n```\n\n```\nconst isEven = (n % 2 === 0)\n? true\n: false\n```\n\n```\n\
    console.log(isEven);\n//false\n```\n\n下面是一个函数示例，当未提供产品对象时返回 null，当价格可用时返回价格，否则返回\
    \ lastPrice。\n\n```\nfunction getPrice(product){\n  return product\n    ? product.price\n\
    \      ? product.price\n      : product.lastPrice\n    : null\n}\n```\n\n```\n\
    console.log(getPrice(null));\n//null\nconsole.log(getPrice({lastPrice: 10}));\n\
    //10\nconsole.log(getPrice({price:5, lastPrice: 10}));\n//5\n```\n\n### switch\
    \ 语句\n\n与 if 语句类似，`switch 语句` 允许编写不返回值的代码。\n\n应该禁用以下 `switch` 语句的用法。\n\n```\n\
    function increment(x){\n  return x + 1;\n}\n```\n\n```\nfunction decrement(x){\n\
    \    return x - 1;\n}\n```\n\n```\nfunction doAction(actionName){\n    switch(actionName){\n\
    \        case \"increment\":\n            number = increment(number);\n      \
    \      break;\n        case \"decrement\":\n            number = decrement(number);\n\
    \            break;\n    }\n}\n```\n\n```\nlet number = 0;\ndoAction('increment')\n\
    console.log(number);\n//1\n```\n\n只有当 switch 语句具有 default case 且所有分支都返回值时，才会使用它。查看下一个示例。\n\
    \n```\nfunction doAction(x, actionName){\n    switch(actionName){\n        case\
    \ 'increment':\n            return increment(x);\n        case 'decrement':\n\
    \            return decrement(x);\n        default:\n            return x;\n \
    \   }\n}\n\nconst number = 0;\nconst newNumber = doAction(number, 'increment');\n\
    console.log(newNumber);\n//1\n```\n\n更好的选择是使用 map。它有利于将 switch 分解为更小的部分。以下是使用对象字面量作为\
    \ map 重写相同逻辑的方法。\n\n```\nfunction increment(x){\n  return x + 1;\n}\n\nfunction\
    \ decrement(x){\n  return x - 1;\n}\n\nconst actionMap = {\n  increment,\n  decrement\n\
    }\n\nfunction doAction(x, actionName){\n  const action = actionMap[actionName];\n\
    \  return action\n    ? action(x)\n    : x;\n}\n```\n\n```\nconst number = 0;\n\
    const newNumber = doAction(number, 'increment');\nconsole.log(number);\n//1\n\
    ```\n\n## 循环语句\n\n该语言中有三种循环语句：for、while 和 do-while。\n\n### for 语句\n\nfor 循环语句鼓励突变和副作用。我们将用数组方法如\
    \ filter、map 和 reduce 来替换 for 循环。当算法需要更多灵活性时，我们可以回退到 forEach。\n\nfor-in 循环遍历对象的键。\n\
    \n```\nconst book = {\n  title : \"How JavaScript Works\",\n  author : \"Douglas\
    \ Crockford\"\n};\n```\n\n```\nfor (const propName in book) {\n  console.log(book[propName])\n\
    }\n```\n\n我们可以使用 Object.keys 和数组方法实现相同的逻辑。\n\n```\nObject.keys(book).forEach(propName\
    \ => {\n  console.log(book[propName])\n});\n```\n\nfor-of 语句遍历 [可迭代对象](iterable\
    \ objects) 如数组或字符串。\n\n```\nconst arr = [1, 2, 3];\n\nfor (const element of arr)\
    \ {\n  console.log(element);\n}\n```\n\n它可以用 `forEach` 方法替换。\n\n```\narr.forEach(element\
    \ => {\n  console.log(element);\n});\n```\n\nwhile 语句在条件为 true 时循环。\n\ndo-while\
    \ 语句是 while 循环的一种变体，它在检查条件之前先执行一次代码，然后在条件为 true 时循环。\n\n以下 lint 规则禁止所有循环语句，包括\
    \ `for`、`for-of`、`for-in`、`while` 和 `do-while`。\n\n```\n\"no-loop-statement\"\
    : \"error\"\n```\n\n禁用所有循环语句是有问题的。我们至少需要一种循环语句，以便在 [尾调用优化](tail-call optimization)\
    \ 可用之前，在特定算法中很少使用。以下是在特定行停用先前循环规则的方法。\n\n```\nlet i = 1;\n\n// eslint-disable-next-line\
    \ functional/no-loop-statement\nwhile(i < 10){\n  console.log(i);\n  i = i + 1;\n\
    }\n```\n\n## 中断性语句\n\n有四种中断性语句：`break`、`continue`、`throw` 和 `return`。我们只保留最后一个。\n\
    \n### break 和 continue\n\n`break` 语句\"跳出\"循环。\n\n`continue` 语句\"跳过\"循环中的一次迭代。\n\
    \n`break` 和 `continue` 都类似于 `goto` 语句，我们不会使用它们。相反，我们将使用 `find`、`every` 或 `some`\
    \ 等数组方法。\n\n考虑下一个示例，当找到搜索元素时中断循环。\n\n```\nconst products = [\n  {id:1, name: 'apple'},\n\
