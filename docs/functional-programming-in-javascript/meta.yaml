  md: "![](img/64a41332f00094d6262a8288d39ce1de_158_0.png)\n\nIn the next examples,\
    \ we are going to use this architectural pattern to create a few functionalities.\n\
    \n# # Counter with Elm Let's implement a simple counter page and discuss the Elm\
    \ Architecture.\n\n# ## Model The model stores all the application data that can\
    \ change. In our case, we just need to store a number to reflect the current count.\n\
    \nThe initial value of this counter is `0`.\n\n```\ntype alias Model = {\n  number\
    \ : Int\n}\n\n\ninitialModel : Model\n\ninitialModel = { number = 0 }\n```\n\n\
    # ## Messages Messages define user interaction. The user can increase or decrease\
    \ the count so we need two messages to express those actions.\n\ntype Msg = Increment\
    \ | Decrement View Function The view function takes in the Model as an argument\
    \ and displays it on the screen. The view function creates the HTML."
