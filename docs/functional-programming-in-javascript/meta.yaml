    console.log(newGames);\n```\n\n```\nconsole.log(newGames);\n//[ { id: 1, title:\
    \ 'WarCraft' },\n//  { id: 2, title: 'X-COM: UFO Defense' },\n//  { id: 3, title:\
    \ 'The Settlers' } ]\n```\n\nThe other option for adding a value to an array is\
    \ to use the spread operator. Here is an example.\n\n```\nconst newGames = [...games,\
    \ newValue];\n```\n\n### Editing\n\nChanging means creating a new array containing\
    \ the new value at the designated index position.\n\nWe can use `map` for this.\
    \ The mapping function returns the new value for the specified index otherwise\
    \ it returns the existing value.\n\nBelow is an example of changing the game object\
    \ at index 1.\n\n```\nconst id = 1;\nconst newValue = { id, title: 'WarCraft 2'\
    \ };\n\nconst newGames = games.map(game =>\n    (game.id === id)\n        ? newValue\n\
    \        : game\n);\n\nconsole.log(newGames);\n//[ { id: 1, title: 'WarCraft 2'\
    \ },\n//  { id: 2, title: 'X-COM: UFO Defense' } ]\n```\n\n### Removing\n\nWe\
    \ can remove an element from an array using `filter`. It returns a new array excluding\
    \ the element at the specified index.\n\n```\nconst id = 1;\nconst newGames =\
    \ games.filter(game => game.id !== id);\n\nconsole.log(newGames);\n//[ { id: 2,\
    \ title: 'X-COM: UFO Defense' } ]\n```\n\n## Recap\n\n- `filter` selects the elements\
    \ from the array that pass the predicate function.\n\n- `map` transform all elements\
    \ in the array using a mapping function and creates a new array with the results.\n\
    \n- `reduce` reduces the array to a single value using a reducer function.\n\n\
    - `sort` sorts the elements of an array using a compare function.\n\n## Chapter\
    \ 05: First-Class Functions\n\nA language has first-class functions when it treats\
    \ functions as any other values. In JavaScript, functions can be used like other\
    \ values. In fact, functions are objects and thus values.\n\n### First-Class Functions\n\
    \nFunctions can be stored in variables. We already saw such a case before.\n\n\
    ```\nconst square = x => {\n    return x * x;\n}\n```\n\nHere, we define a function\
    \ using the arrow function expression and then store the function in the `square`\
    \ variable. The function infers the name of the variable. Then we can use the\
    \ variable to invoke the function by adding parentheses () at the end.\n\n```\n\
    square(3);\n//9\n```\n\nFunctions can be put in data structures like arrays. Look\
    \ at the next example.\n\n```\nfunction toUpperCase(text){\n    return text.toUpperCase();\n\
    }\n\nfunction toLowerCase(text){\n    return text.toLowerCase();\n}\n\nfunction\
    \ trim(text){\n    return text.trim();\n}\n\nconst functions = [\n  toUpperCase,\n\
    \  toLowerCase,\n  trim\n];\n\nconst text = ' StARt!';\nfunctions.forEach(f =>\
    \ {\n  const newText = f(text);\n  console.log(newText);\n});\n//\"START!\"\n\
    //\"start!\"\n//\"StARt!\"\n```\n\nIn this example, we define three functions\
    \ and then put them into an array called `functions`. We then iterate through\
    \ the array and call each function with a text argument. The result is displayed\
    \ in the console.\n\nWhen we use the function name without parentheses we refer\
    \ to the function itself. When we put parentheses after the function name we refer\
    \ to the result of calling the function.\n\nFunctions can be passed as arguments\
    \ to other functions. In the next example, we define two functions `sum` and `multiply`\
    \ and send them as an argument to another function called `doOperation`.\n\n```\n\
    function sum(a, b){\n  return a + b;\n}\n\nfunction multiply(a, b){\n  return\
    \ a * b;\n}\n\nfunction doOperation(operation, a, b){\n  return operation(a,b)\n\
    }\n\ndoOperation(sum, 2, 3);\n//5\n\ndoOperation(multiply, 2, 3);\n//6\n```\n\n\
    Functions can return other functions.\n\nFunctions can have properties and methods.\
    \ For example, they have the `name` property giving access to the function name\
    \ as a string.\n\nFunctions have methods like `call()` or `apply()`. These two\
    \ methods basically implement the same functionality, the difference being that\
    \ `call` accepts a list of arguments, while `apply` takes a single array with\
    \ all arguments.\n\nInvoking a function with arguments is also known as applying\
    \ the function to those arguments. Consider the next example using the `call`\
    \ method to apply the function to a set of arguments.\n\n```\nfunction multiply(a,\
    \ b){\n  return a * b;\n}\n\nmultiply.call(null, 2, 3);\n//6\n```\n\n### Higher-Order\
    \ Functions\n\nHigher-order functions are functions that operate on other functions.\n\
    \nHigher-order functions take other functions as arguments, return functions,\
    \ or do both.\n\nAll the array methods like `filter`, `map`, `reduce`, `sort`\
    \ taking functions as inputs are higher-order functions.\n\nThe previous custom\
    \ `doOperation` function is a higher-order function as it takes another function\
    \ as input.\n\nConsider the following higher-order function that returns a function.\n\
    \n```\nconst objects = [\n  { id: 1 },\n  { id: 2 }\n];\n```\n\n```\nfunction\
    \ hasId(id){\n  return function(element){\n    return element.id === id;\n  }\n\
    }\n```\n\n```\nconsole.log(objects.find(hasId(1)));\n//{ id: 1 }\n```\n\n`hasId`\
    \ returns a function. `hasId` is a higher-order function. Below is an example\
    \ where a higher-order function creates the compare function required by the sort\
    \ method.\n\n```\nconst courses = [\n  {\n    title: 'Course 2',\n    author:\
    \ 'Author 2'\n  },\n  {\n    title: 'Course 3',\n    author: 'Author 3'\n  },\n\
    \  {\n    title: 'Course 1',\n    author: 'Author 1'\n  }\n];\n```\n\n```\nfunction\
    \ by(name){\n  return function(a, b){\n    return a[name].localeCompare(b[name]);\n\
    \  }\n}\n```\n\n```\ncourses\n  .slice().sort(by('author'))\n```\n\n`by` is a\
    \ higher-order function. It allows us to sort the list using any of the object's\
    \ property that is a string.\n\n### Closures\n\nFunctions can be defined inside\
    \ other functions. Besides having access to its parameters and variables, the\
    \ inner function has access to parameters and variables from the outer functions.\n\
    \nClosure is the ability of an inner function to access variables from the outer\
    \ function.\n\nLet's start with a basic example.\n\n```\nfunction run(){\n  const\
    \ value = 1;\n\n  function logValue(){\n    console.log(value);\n  }\n\n  logValue();\n\
    }\n\nrun();\n//1\n```\n\nAll the variables defined inside a function are visible\
    \ only inside that function. The `logValue` function is defined inside the `run`\
    \ function and has access to the `value` variable.\n\nClosures become significant\
    \ when the inner functions survive the invocation of the outer function. Consider\
    \ the next example.\n\n```\nfunction createCount(){\n  let counter = 0;\n\n  return\
    \ function count(){\n    counter = counter + 1;\n    return counter;\n  }\n}\n\
    \nconst count = createCount();\n\nconsole.log(count());\n//1\nconsole.log(count());\n\
    //2\nconsole.log(count());\n//3\n```\n\n`count` has access to the `counter` variable\
    \ from the outer function. `count` survives the invocation of the outer function.\
    \ `count` is a closure.\n\n## Recap\n\n- Functions are values.\n\n- Functions\
    \ can operate on other functions. Functions can take other functions as input\
    \ or return functions.\n\n- Inner functions can access variables from the outer\
    \ functions even after the outer functions have executed."
  mdcn: "\n ```\nnumbers\n  .forEach(log);\n//1\n//2\n//3\n```\n\n# 非纯操作\n\n当为对象启用不可变数据的\
    \ lint 规则时，我们也会强制数组表现得像不可变结构。\n\n```\n\"functional/immutable-data\": \"error\"\
    \n```\n\n这意味着所有试图修改数组的非纯方法，如 `push`、`pop`、`unshift` 或 `shift` 都会产生 lint 错误。\n\n\
    - `push` 在数组末尾添加元素，并返回数组的新长度。\n\n- `pop` 移除并返回数组的最后一个元素。\n\n- `unshift` 在数组开头添加元素，并返回数组的新长度。\n\
    \n- `shift` 移除并返回数组的第一个元素。\n\n```\nconst arr = [1, 2, 3];\n\narr.push(4);\narr.pop();\n\
    \narr.unshift(0);\narr.shift();\n```\n\n//不允许修改数组\n\n## 修改数组\n\n接下来，看看我们如何对不可变数组进行基本的添加、编辑和删除操作。考虑游戏对象的数组。\n\
    \n```\nconst games = [\n  {id: 1, title: 'WarCraft'},\n  {id: 2 title: 'X-COM:\
    \ UFO Defense' }\n]\n```\n\n### 添加\n\n**`concat` 接受一个或多个数组并将它们连接在一起。**\n\n它可以用于添加操作。它创建一个包含新值的新数组。\n\
    \n```\nconst newValue = {id: 3, title: 'The Settlers'};\nconst newGames = games.concat([newValue]);\n\
    console.log(newGames);\n```\n\n```\nconsole.log(newGames);\n//[ { id: 1, title:\
    \ 'WarCraft' },\n//  { id: 2, title: 'X-COM: UFO Defense' },\n//  { id: 3, title:\
    \ 'The Settlers' } ]\n```\n\n另一种向数组添加值的方法是使用展开运算符。下面是一个例子。\n\n```\nconst newGames\
    \ = [...games, newValue];\n```\n\n### 编辑\n\n编辑意味着创建一个新数组，在指定的索引位置包含新值。\n\n我们可以使用\
    \ `map` 来实现这一点。映射函数返回指定索引的新值，否则返回现有值。\n\n下面是修改索引 1 处游戏对象的示例。\n\n```\nconst id\
    \ = 1;\nconst newValue = { id, title: 'WarCraft 2' };\n\nconst newGames = games.map(game\
    \ =>\n    (game.id === id)\n        ? newValue\n        : game\n);\n\nconsole.log(newGames);\n\
    //[ { id: 1, title: 'WarCraft 2' },\n//  { id: 2, title: 'X-COM: UFO Defense'\
    \ } ]\n```\n\n### 删除\n\n我们可以使用 `filter` 从数组中移除元素。它返回一个新数组，排除指定索引处的元素。\n\n```\n\
    const id = 1;\nconst newGames = games.filter(game => game.id !== id);\n\nconsole.log(newGames);\n\
    //[ { id: 2, title: 'X-COM: UFO Defense' } ]\n```\n\n## 回顾\n\n- `filter` 从数组中选择通过谓词函数的元素。\n\
    \n- `map` 使用映射函数转换数组中的所有元素，并使用结果创建一个新数组。\n\n- `reduce` 使用归约函数将数组归约为单个值。\n\n- `sort`\
    \ 使用比较函数对数组的元素进行排序。\n\n## 第五章：一等函数\n\n当一种语言将函数视为与其他值同等对待时，它就具有了一等函数。在 JavaScript\
    \ 中，函数可以像其他值一样使用。事实上，函数是对象，因此也是值。\n\n### 一等函数\n\n函数可以存储在变量中。我们之前已经看到过这种情况。\n\n\
    ```\nconst square = x => {\n    return x * x;\n}\n```\n\n这里，我们使用箭头函数表达式定义了一个函数，然后将函数存储在\
    \ `square` 变量中。该函数推断变量的名称。然后我们可以通过在末尾添加括号 () 来使用变量调用函数。\n\n```\nsquare(3);\n//9\n\
    ```\n\n函数可以放在数组等数据结构中。看看下一个例子。\n\n```\nfunction toUpperCase(text){\n    return\
    \ text.toUpperCase();\n}\n\nfunction toLowerCase(text){\n    return text.toLowerCase();\n\
    }\n\nfunction trim(text){\n    return text.trim();\n}\n\nconst functions = [\n\
    \  toUpperCase,\n  toLowerCase,\n  trim\n];\n\nconst text = ' StARt!';\nfunctions.forEach(f\
    \ => {\n  const newText = f(text);\n  console.log(newText);\n});\n//\"START!\"\
    \n//\"start!\"\n//\"StARt!\"\n```\n\n在这个例子中，我们定义了三个函数，然后将它们放入一个名为 `functions`\
    \ 的数组中。然后遍历数组并用文本参数调用每个函数。结果显示在控制台中。\n\n当我们使用不带括号的函数名时，我们指的是函数本身。当我们在函数名后加上括号时，我们指的是调用函数的结果。\n\
    \n函数可以作为参数传递给其他函数。在下一个例子中，我们定义了两个函数 `sum` 和 `multiply`，并将它们作为参数传递给另一个名为 `doOperation`\
    \ 的函数。\n\n```\nfunction sum(a, b){\n  return a + b;\n}\n\nfunction multiply(a,\
    \ b){\n  return a * b;\n}\n\nfunction doOperation(operation, a, b){\n  return\
    \ operation(a,b)\n}\n\ndoOperation(sum, 2, 3);\n//5\n\ndoOperation(multiply, 2,\
    \ 3);\n//6\n```\n\n函数可以返回其他函数。\n\n函数可以有属性和方法。例如，它们有 `name` 属性，可以访问作为字符串的函数名称。\n\
    \n函数有像 `call()` 或 `apply()` 这样的方法。这两个方法基本上实现相同的功能，区别在于 `call` 接受参数列表，而 `apply`\
    \ 接受包含所有参数的单个数组。\n\n用参数调用函数也被称为将该函数应用于这些参数。考虑下一个使用 `call` 方法将函数应用于一组参数的示例。\n\n\
    ```\nfunction multiply(a, b){\n  return a * b;\n}\n\n multiply.call(null, 2, 3);\n\
    //6\n```\n\n### 高阶函数\n\n高阶函数是对其他函数进行操作的函数。\n\n高阶函数接受其他函数作为参数、返回函数，或两者兼而有之。\n\n\
    所有像 `filter`、`map`、`reduce`、`sort` 这样接受函数作为输入的数组方法都是高阶函数。\n\n之前自定义的 `doOperation`\
    \ 函数是一个高阶函数，因为它接受另一个函数作为输入。\n\n考虑以下返回函数的高阶函数。\n\n```\nconst objects = [\n  { id:\
    \ 1 },\n  { id: 2 }\n];\n```\n\n```\nfunction hasId(id){\n  return function(element){\n\
    \    return element.id === id;\n  }\n}\n```\n\n```\nconsole.log(objects.find(hasId(1)));\n\
    //{ id: 1 }\n```\n\n`hasId` 返回一个函数。`hasId` 是一个高阶函数。下面是一个高阶函数创建 sort 方法所需的比较函数的示例。\n\
    \n```\nconst courses = [\n  {\n    title: 'Course 2',\n    author: 'Author 2'\n\
    \  },\n  {\n    title: 'Course 3',\n    author: 'Author 3'\n  },\n  {\n    title:\
    \ 'Course 1',\n    author: 'Author 1'\n  }\n];\n```\n\n```\nfunction by(name){\n\
    \  return function(a, b){\n    return a[name].localeCompare(b[name]);\n  }\n}\n\
    ```\n\n```\ncourses\n  .slice().sort(by('author'))\n```\n\n`by` 是一个高阶函数。它允许我们使用对象的任意字符串属性对列表进行排序。\n\
    \n### 闭包\n\n函数可以在其他函数内部定义。除了可以访问自己的参数和变量外，内部函数还可以访问外部函数的参数和变量。\n\n闭包是内部函数访问外部函数变量的能力。\n\
    \n让我们从一个基本例子开始。\n\n```\nfunction run(){\n  const value = 1;\n\n  function logValue(){\n\
    \    console.log(value);\n  }\n\n  logValue();\n}\n\nrun();\n//1\n```\n\n在函数内部定义的所有变量都只能在函数内部看到。`logValue`\
    \ 函数在 `run` 函数内部定义，可以访问 `value` 变量。\n\n当内部函数在外部函数调用结束后仍然存在时，闭包就变得很重要了。考虑下一个例子。\n\
    \n```\nfunction createCount(){\n  let counter = 0;\n\n  return function count(){\n\
    \    counter = counter + 1;\n    return counter;\n  }\n}\n\nconst count = createCount();\n\
    \nconsole.log(count());\n//1\nconsole.log(count());\n//2\nconsole.log(count());\n\
    //3\n```\n\n`count` 可以访问外部函数中的 `counter` 变量。`count` 在外部函数调用结束后仍然存在。`count` 是一个闭包。\n\
    \n## 回顾\n\n- 函数是值。\n\n- 函数可以对其他函数进行操作。函数可以接受其他函数作为输入或返回函数。\n\n- 内部函数即使在外部函数执行完毕后，仍然可以访问外部函数的变量。\n"
