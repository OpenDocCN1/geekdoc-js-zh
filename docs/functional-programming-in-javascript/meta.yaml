    # # Chapter 14: Promises


    A promise is an object containing a future result.


    A promise has three states: pending, fulfilled, and rejected.


    +   - Pending is the initial state of a promise. The result is not available at
    this stage.

    - Fulfilled is the state marking a successful operation. The result is available
    at this point.

    - Rejected is the state marking a failed operation. The result is not available,
    instead, we have access to the error object giving the details of why the operation
    failed.


    Initially, the promise starts with the pending state. Then it can go to fulfilled
    or rejected states. Once a promise is fulfilled or rejected, it stays in that
    state.


    Here is a representation of the flow a promise can go through.'
