  md: "**concatAll()** The `concatAll` operator subscribes to each observable inside\
    \ the \"outer\" observable and copies all the emitted values until that inner\
    \ observable completes. Then it goes to the next one. It creates a new observable\
    \ emitting all these concatenated values.\n\nHere is how we can use it to flatten\
    \ the higher-order observable and get an observable emitting the results of all\
    \ network requests.\n\n```\nimport { from } from 'rxjs';\nimport { ajax } from\
    \ 'rxjs/ajax';\nimport { map, concatAll } from 'rxjs/operators';\n\nconst observable\
    \ = from([\n  '/dictionaries',\n  '/todos'\n]);\n\nobservable.pipe(\n  map(ajax.getJSON),\n\
    \  concatAll()\n).subscribe(console.log);\n//[{name: 'Dictionary'}]\n//[{title:\
    \ 'To Do'}]\n```\n\n**mergeAll()** Another useful flattening is `mergeAll`. It\
    \ subscribes to each inner observable as it arrives, then emits each value as\
    \ it arrives.\n\nUsing `mergeAll` instead of `concatAll` in the previous example\
    \ makes no difference because each of the inner AJAX"
  merge: -1
