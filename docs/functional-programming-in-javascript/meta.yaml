    \ =\n  numbers\n    .filter(isEven) //[2, 4]\n    .map(doubleoken\n```\n\n第一个\
    \ filter 创建了一个中间数组 [2, 4]，然后由 map 方法使用。\n\n让我们看看通过构建一个执行所有转换的归约器来达到相同结果意味着什么，而不是构建中间数组。\n\
