    \n```elm\ntype alias Model = {\n  number : Int\n}\n\ninitialModel : Model\ninitialModel\
    \ = { number = 0 }\n```\n\n### Messages\n\nMessages define user interaction. The\
    \ user can increase or decrease the count so we need two messages to express those\
    \ actions.\n\n```elm\ntype Msg = Increment | Decrement\n```\n\n### View Function\n\
    \nThe view function takes in the Model as an argument and displays it on the screen.\
    \ The view function creates the HTML.\n\nThe HTML contains a decrement button\
