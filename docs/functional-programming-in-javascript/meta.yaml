- md: " ## Chapter 06: Statements\n\nAn expression is a combination of one or more\
    \ values, variables, operators, and functions that produce a new value. In short,\
    \ an expression is a unit of code that produces a value.\n\nA statement is an\
    \ instruction to perform an action. In functional programming, everything should\
    \ be an expression that produces a value. In order to achieve this, we are going\
    \ to review and remove the statements that do not produce values.\n\n## Expressions\n\
    \nFor example, `1 + 2` is an expression.\n\nThe function invocation is an expression\
    \ when the function returns a value. Consider the `multiply` function.\n\n```\n\
    function multiply(a, b){\n  return a * b;\n}\n```\n\n`multiply(2, 3)` is an expression.\n\
    \nAn expression can contain other expressions. For example, the expression `multiply(2,\
    \ 3+7)` contains the expression `3+7`.\n\nThe arithmetic expressions evaluate\
    \ to numbers.\n\nString expressions evaluate to strings. Here is an example:\n\
    \n```\n\"This \" + \"IS A texT\".toLowerCase();\n//\"This is a text\"\n```\n\n\
    Logical expressions evaluate to true or false. These expressions usually use [logical\
    \ operators](link) like `&&`, `||`, `!` or `===`.\n\n```\n1 === 2;\n//false\n\
    ```\n\nAn expression is a piece of code that returns a value.\n\n## Statement\
    \ Declaration\n\nThere are three statements for declaring a variable `var`, `let`,\
    \ and `const`.\n\nThe `var` statement declares a variable that has function scope\
    \ but has no block scope. This may be confusing. The `var` declaration has become\
    \ obsolete so we can disable its usage with a lint rule.\n\n```\n\"no-var\": \"\
    error\"\n```\n\nI suggest using `const` as the default declaration and fallback\
    \ to `let` as a second option. `const` declaration disables reassigning the variable\
    \ and because all our values are immutable we create truly constants that cannot\
    \ be reassigned or changed.\n\nUsing `const` declaration means to create a new\
    \ variable each time we change something. It promotes function purity.\n\n## Conditional\
    \ Statements\n\n### if Statement\n\nThe `if` statement does not necessarily return\
    \ a value, so in a functional style, we should either always have the `else` branch\
    \ and return a value or disable the `if` statement completely.\n\nWe are going\
    \ to disable the following usage of the `if` statement.\n\n```\nconst n = 3;\n\
    let isEven;\n```\n\n```\nif(n % 2 === 0){\n    isEven = true;\n} else {\n    isEven\
    \ = false;\n}\n```\n\nconsole.log(isEven);\n\nThe if statement will be allowed\
    \ only if it contains an else statement and all branches have the return statement.\n\
    \nHere is the lint rule for this.\n\n```\n\"functional/no-conditional-statement\"\
    : [\"error\", {\n    \"allowReturningBranches\": \"ifExhaustive\"\n}]\n```\n\n\
    Below is an example of the if statement with the else branch that always returns.\n\
    \n```\nfunction isEven(n){\n    if(n % 2 === 0){\n        return true;\n    }\
    \ else {\n        return false;\n    }\n}\n```\n\nconsole.log(isEven(3));\n\n\
    ### Conditional Operator\n\nThe better option is to use the conditional operator\
    \ which is an expression that returns a value.\n\n```\nconst n = 3;\n```\n\n```\n\
    const isEven = (n % 2 === 0)\n? true\n: false\n```\n\n```\nconsole.log(isEven);\n\
    //false\n```\n\nBelow is an example of a function that returns null when no product\
    \ object is provided, returns the price when it is available otherwise returns\
    \ the lastPrice.\n\n```\nfunction getPrice(product){\n  return product\n    ?\
    \ product.price\n      ? product.price\n      : product.lastPrice\n    : null\n\
    }\n```\n\n```\nconsole.log(getPrice(null));\n//null\nconsole.log(getPrice({lastPrice:\
    \ 10}));\n//10\nconsole.log(getPrice({price:5, lastPrice: 10}));\n//5\n```\n\n\
    ### switch Statement\n\nSimilar to if statement, the `switch statement` allows\
    \ writing code that does not return a value.\n\nThe following usage of the `switch`\
    \ statement should be disabled.\n\n```\nfunction increment(x){\n  return x + 1;\n\
    }\n```\n\n```\nfunction decrement(x){\n    return x - 1;\n}\n```\n\n```\nfunction\
    \ doAction(actionName){\n    switch(actionName){\n        case \"increment\":\n\
    \            number = increment(number);\n            break;\n        case \"\
    decrement\":\n            number = decrement(number);\n            break;\n  \
    \  }\n}\n```\n\n```\nlet number = 0;\ndoAction('increment')\nconsole.log(number);\n\
    //1\n```\n\nThe switch statement will be used only when it has a default case\
    \ and all branches return a value. Check the next example.\n\n```\nfunction doAction(x,\
    \ actionName){\n    switch(actionName){\n        case 'increment':\n         \
    \   return increment(x);\n        case 'decrement':\n            return decrement(x);\n\
    \        default:\n            return x;\n    }\n}\n\nconst number = 0;\nconst\
    \ newNumber = doAction(number, 'increment');\nconsole.log(newNumber);\n//1\n```\n\
    \nThe better option is to use a map. It favors decomposing the switch into smaller\
    \ pieces. Here is how the same logic can be re-written using an object literal\
    \ as a map.\n\n```\nfunction increment(x){\n  return x + 1;\n}\n\nfunction decrement(x){\n\
    \  return x - 1;\n}\n\nconst actionMap = {\n  increment,\n  decrement\n}\n\nfunction\
    \ doAction(x, actionName){\n  const action = actionMap[actionName];\n  return\
    \ action\n    ? action(x)\n    : x;\n}\n```\n\n```\nconst number = 0;\nconst newNumber\
    \ = doAction(number, 'increment');\nconsole.log(number);\n//1\n```\n\n## Loop\
    \ Statements\n\nThere are three looping statements for, while and do-while in\
    \ the language.\n\n### for Statement\n\nThe for loop statement encourages mutations\
    \ and side-effects. We are going to replace the for loops with array methods like\
    \ filter, map and reduce. When the algorithm requires more flexibility, we can\
    \ fallback to forEach.\n\nThe for-in loop iterates over the keys of an object.\n\
    \n```\nconst book = {\n  title : \"How JavaScript Works\",\n  author : \"Douglas\
    \ Crockford\"\n};\n```\n\n```\nfor (const propName in book) {\n  console.log(book[propName])\n\
    }\n```\n\nWe can implement the same logic using Object.keys and the array methods.\n\
    \n```\nObject.keys(book).forEach(propName => {\n  console.log(book[propName])\n\
    });\n```\n\nThe for-of statement loops over [iterable objects](iterable objects)\
    \ like arrays or strings.\n\n```\nconst arr = [1, 2, 3];\n\nfor (const element\
    \ of arr) {\n  console.log(element);\n}\n```\n\nIt can be replaced with the `forEach`\
    \ method.\n\n```\narr.forEach(element => {\n  console.log(element);\n});\n```\n\
    \nThe while statement loops as long as the condition is true.\n\nThe do-while\
    \ statement is a variant of the while loop that executes the code once, before\
    \ checking the condition, then it loops as long as the condition is true.\n\n\
    The following lint rule disallows all loop statements, including `for`, `for-of`,\
    \ `for-in`, `while`, and `do-while`.\n\n```\n\"no-loop-statement\": \"error\"\n\
    ```\n\nDisabling all loop statements is problematic. We still need at least one\
    \ loop statement to rarely use for specific algorithms until the [tail-call optimization](tail-call\
    \ optimization) is available. Here is how you can deactivate the previous loop\
    \ rule on a particular line.\n\n```\nlet i = 1;\n\n// eslint-disable-next-line\
    \ functional/no-loop-statement\nwhile(i < 10){\n  console.log(i);\n  i = i + 1;\n\
    }\n```\n\n## Disruptive Statements\n\nThere are four disruptive statements: `break`,\
    \ `continue`, `throw`, and `return`. We are going to keep only the last one.\n\
    \n### break and continue\n\nThe `break` statement \"jumps out\" of a loop.\n\n\
    The `continue` statement \"jumps over\" one iteration in the loop.\n\nBoth `break`\
    \ and `continue` are similar to the `goto` statement and we are not going to use\
    \ them. Instead, we will use array methods like `find`, `every`, or `some`.\n\n\
    Consider the next example breaking the loop when the searched element is found.\n\
    \n```\nconst products = [\n  {id:1, name: 'apple'},\n  {id:2, name:'mango'}\n\
    ]\n\nconst id = 1;\nlet product;\nfor(let i=0; i<products.length; i++){\n  if(products[i].id\
    \ === id){\n    product = products[i];\n    break;\n  }\n}\n```\n\n```\nconsole.log(product);\n\
    //{id:1, name: 'apple'}\n```\n\nWe can implement the same logic using `find`.\n\
    \n```\nconst id = 1;\nconst product = products.find(p => p.id === id);\n```\n\n\
    console.log(product)\n\nNow, look at an example iterating over a list of words\
    \ and stopping when a specific word is found.\n\n```\nconst words = [\n 'ability',\n\
    \ 'calculate',\n 'calendar',\n 'double',\n 'door'\n];\n```\n\n```\nconst stopTo\
    \ = 'double';\nfor(let word of words){\n if(word === stopTo){\n  break;\n }\n\n\
    \ console.log(word);\n}\n```\n\nThe same logic can be implemented using `every`.\n\
    \n```\nwords.every(w => {\n if(w.startsWith(stopTo)){\n  return false;\n } else\
