- md: "Nevertheless, they give us an insight on how to chain transformations without\
    \ creating additional collections.\n\n## Sequence Lazy sequences\nLazy sequences\
    \ allow us to efficiently chain transformation methods like `map` and `filter`\
    \ without creating intermediate collections. We are going to look at the lazy\
    \ sequence provided by Immutable.js called `Seq`.\n\nThe `Seq` collection is immutable.\
    \ Once created, it cannot be modified. Any \"change\" operation returns a new\
    \ `Seq`.\n\nHere is an example where an array is converted to a sequence and then\
    \ transformed without creating other intermediate arrays.\n\n```javascript\nimport\
    \ { Seq } from 'immutable';\n\nfunction isEven(n){\n    return n % 2 === 0;\n\
    }\n\nfunction double(n){\n    return n * 2;\n}\n\nconst sequence = Seq([ 1, 2,\
    \ 3, 4])\n    .filter(isEven)\n    .map(double);\n```\n\nThen we can convert back\
    \ to an array data structure using the `toArray` method.\n\n```javascript\nconst\
    \ newArray = sequence.toArray();\n//[4, 8]\n```\n\nNote that these conversions\
    \ to the native array using `toArray` can be slow so once we created a sequence\
    \ and made the transformations we should stick with it and use it.\n\n## Range\n\
    Range returns a sequence of numbers from `start` to the `end`. When called with\
    \ no arguments it starts from 0. When no `end` argument is provided it creates\
    \ an infinite sequence. It also accepts a third argument, a `step`, defining the\
    \ increment.\n\nRange is a lazy sequence that generates integer numbers in order.\
    \ Here is an example of a `Range` generating the numbers 1, 2, 3.\n\n```javascript\n\
    import { Range } from 'immutable';\n\nfunction logIdentity(n){\n  console.log(n);\n\
    \  return n;\n}\n\nRange(1, 4)\n  .forEach(logIdentity);\n//1\n//2\n//3\n```\n\
    \nNow, look at an example of generating prime numbers. Check how we can refactor\
    \ the `for` loop out using the `Range` sequence.\n\n```javascript\nfor(let i=0;\
    \ i<10; i++){\n  if(isPrime(i)){\n    console.log(i)\n  }\n}\n//2\n//3\n//5\n\
    //7\n```\n\n```javascript\nfunction isPrime(number){\n  if (number <= 1){\n  \
    \  return false;\n  }\n\n  for (let i=2; i<=number/2; i++){\n    if (number %\
    \ i === 0 ){\n      return false;\n    }\n  }\n\n  return true;\n}\n```\n\nWe\
    \ can start by replacing the first loop printing the numbers to the console.\n\
    \n```javascript\nimport { Range } from \"immutable\";\n\nRange(0, 10)\n  .filter(isPrime)\n\
    \  .forEach(log);\n```\n\n```javascript\nfunction isPrime(number){ }\n\nfunction\
    \ log(number) {\n  console.log(number);\n}\n```\n\nRange(0, 10) generates all\
    \ numbers from 0 to 9 and then uses filter to select all the prime numbers and\
    \ returns a new sequence containing only those numbers. Then we use forEach to\
    \ display those numbers.\n\nBelow we can see how to refactor the loop detecting\
    \ the prime numbers using the Range sequence.\n\n```javascript\nimport { Range\
    \ } from 'immutable';\n\nRange(0, 10)\n  .filter(isPrime)\n  .forEach(log);\n\
    ```\n\n```javascript\nfunction isPrime(number) {\n  if (number > 2){\n    const\
    \ firstDivisor = findFirstDivisor(number);\n    return !firstDivisor;\n  } else\
    \ {\n    return (number === 2)\n      ? true\n      : false;\n  }\n}\n\nfunction\
    \ findFirstDivisor(number){\n  return Range(2, (number / 2) + 1)\n    .find(isDivisorOf(number));\n\
    }\n\nfunction isDivisorOf(number) {\n  return function(divisor) {\n    return\
    \ (number > 1)\n      ? number % divisor === 0\n      : false\n  };\n}\n\nfunction\
    \ log(number) { }\n```\n\n`isDivisorOf` is a curried function that gets a number\
    \ and returns a predicate function taking a possible divisor and returning a boolean\
    \ value.\n\n`findFirstDivisor` returns the first divisor of a number. It checks\
    \ all numbers from 2 to its half for that.\n\n`isPrime` decides if a number is\
    \ a prime based on the result of `findFirstDivisor`. If the number has no divisors\
    \ then it is a prime number.\n\n## Recap Transducers\nTransducers are functions\
    \ taking a reducer and returning a new reducer.\n\nLazy sequences like `Seq` allow\
    \ us to efficiently chain transformation methods without creating intermediate\
    \ collections.\n\nRange provides sequences of numbers.\n\n# Chapter 13: Generators\n\
    A generator is a function that returns the next value from a sequence each time\
    \ it is called.\n\nWe will start with a simple generator function that gives the\
    \ next integer each time it is called. It starts from 0.\n\n```javascript\nfunction\
    \ range() {\n let count = 0;\n return function() {\n  const result = count;\n\
    \  count += 1;\n  return result;\n }\n}\n\nconst nextNumber = range()\nconsole.log(nextNumber());\
    \ //0\nconsole.log(nextNumber()); //1\nconsole.log(nextNumber()); //2\n```\n\n\
    `nextNumber` is an infinite generator. `nextNumber` is a closure with an internal\
    \ private state.\n\n## Finite Generators\nGenerators can be finite. Check the\
    \ next example where `range` creates a generator that returns consecutive numbers\
    \ from a specific interval. At the end of the sequence, it returns `undefined`.\n\
    \n```javascript\nfunction range(from, to){\n  let count = from;\n  return function(){\n\
    \    if(count < to){\n      const result = count;\n      count += 1;\n      return\
    \ result;\n    } else {\n      return undefined;\n    }\n  }\n}\n\nconst nextNumber\
    \ = range(0, 3)\nconsole.log(nextNumber()); //0\nconsole.log(nextNumber()); //1\n\
    console.log(nextNumber()); //2\nconsole.log(nextNumber()); //undefined\n```\n\n\
    ## toArray\nWhen working with generators, we may want to create an array with\
    \ all the values from the sequence. For this situation, we need a utility function\
    \ like `toArray` taking a generator and returning all the values from the sequence\
    \ as an array. The sequence should be finite.\n\n```javascript\nfunction toArray(generate)\
    \ {\n  let arr = [];\n  let value = generate();\n\n  while (value !== undefined)\
    \ {\n    arr = [...arr, value];\n    value = generate();\n  }\n  return arr;\n\
    }\n```\n\nLet's use it with the previous generator.\n\n```javascript\nconst numbers\
    \ = toArray(range(1, 5));\nconsole.log(numbers);\n//[1, 2, 3, 4]\n```\n\n## forEach\n\
    We may also need to run a callback for each element in the sequence. The `forEach`\
    \ utility function does just that. It gets a generator and a callback and runs\
    \ the callback until the generator returns `undefined`.\n\n```javascript\nfunction\
    \ forEach(callback){\n  return function(generate){\n    let value = generate();\n\
    \n    while(value !== undefined){\n      callback(value);\n      value = generate();\n\
    \    }\n  }\n}\n```\n\nThis is a curried function that first takes the callbacks\
    \ and then the generator.\n\nIn the next example, the log function is called for\
    \ all numbers returned by the generator.\n\n```javascript\nfunction log(x){\n\
    \  console.log(x);\n}\n\nconst nextNumber = range(1, 4);\nforEach(log)(nextNumber);\n\
    //1\n//2\n//3\n```\n\n## take\nAnother common scenario is to take only the first\
    \ n elements from a sequence. In this case, we need a new utility function like\
    \ `take` that receives a generator and creates a new generator returning only\
    \ the first n elements from the sequence.\n\n```javascript\nfunction take(n) {\n\
    \  return function(generate) {\n    let count = 0;\n    return function() {\n\
    \      if (count < n) {\n        count += 1;\n        return generate();\n   \
    \   }\n    };\n  };\n}\n```\n\nAgain `take` is a curried function and should be\
    \ called like this: `take(n)(sequence)`.\n\nHere is how you can use `take` and\
    \ `forEach` in a pipeline to get and log to console the first three values from\
    \ an infinite sequence of numbers.\n\n```javascript\nimport { pipe } from 'lodash/fp';\n\
    \nconst nextNumber = range();\npipe(\n  take(3),\n  forEach(console.log)\n)(nextNumber);\n\
    //0\n//1\n//2\n```\n\n## Custom Generators\nWe can create any custom generator\
    \ and use it with the previous utility functions. Let's create the **Fibonacci**\
    \ custom generator:\n\n```javascript\nfunction fibonacci() {\n  let a = 0;\n \
    \ let b = 1;\n  return function() {\n    const aResult = a;\n    a = b;\n    b\
    \ = aResult + b;\n    return aResult;\n  };\n}\n```\n\nWe can use the Fibonacci\
    \ generator with the utility functions already created to display the first 5\
    \ numbers in the sequence.\n\n```javascript\nimport { pipe } from 'lodash/fp';\n\
    \nconst generateFibonacci = fibonacci();\npipe(\n  take(5),\n  forEach(console.log)\n\
    )(generateFibonacci);\n//0\n//1\n//1\n//2\n//3\n```\n\n## Recap\nA generator is\
    \ a function that returns a new value from a sequence, each time it is called.\n\
    \nFunctional generators can return elements from finite or infinite sequences\
    \ of values."
  mdcn: "\n尽管如此，它们让我们深入了解了如何在不创建额外集合的情况下链式调用转换操作。\n\n## 序列惰性序列\n惰性序列允许我们高效地链式调用像 `map`\
    \ 和 `filter` 这样的转换方法，而无需创建中间集合。我们将探讨 Immutable.js 提供的称为 `Seq` 的惰性序列。\n\n`Seq`\
    \ 集合是不可变的。一旦创建，就不能被修改。任何“更改”操作都会返回一个新的 `Seq`。\n\n这是一个将数组转换为序列，然后进行转换而不创建其他中间数组的示例。\n\
    \n```javascript\nimport { Seq } from 'immutable';\n\nfunction isEven(n){\n   \
    \ return n % 2 === 0;\n}\n\nfunction double(n){\n    return n * 2;\n}\n\nconst\
    \ sequence = Seq([ 1, 2, 3, 4])\n    .filter(isEven)\n    .map(double);\n```\n\
    \n然后我们可以使用 `toArray` 方法将其转换回数组数据结构。\n\n```javascript\nconst newArray = sequence.toArray();\n\
    //[4, 8]\n```\n\n请注意，使用 `toArray` 转换为原生数组可能会很慢，因此一旦我们创建了序列并进行了转换，就应该坚持使用它。\n\n\
    ## Range\nRange 返回一个从 `start` 到 `end` 的数字序列。不带参数调用时，它从 0 开始。如果未提供 `end` 参数，它会创建一个无限序列。它还接受第三个参数\
    \ `step`，用于定义增量。\n\nRange 是一个按顺序生成整数的惰性序列。这是一个生成数字 1, 2, 3 的 `Range` 示例。\n\n```javascript\n\
    import { Range } from 'immutable';\n\nfunction logIdentity(n){\n  console.log(n);\n\
    \  return n;\n}\n\nRange(1, 4)\n  .forEach(logIdentity);\n//1\n//2\n//3\n```\n\
    \n现在，看一个生成质数的示例。看看我们如何使用 `Range` 序列重构 `for` 循环。\n\n```javascript\nfor(let i=0;\
    \ i<10; i++){\n  if(isPrime(i)){\n    console.log(i)\n  }\n}\n//2\n//3\n//5\n\
    //7\n```\n\n```javascript\nfunction isPrime(number){\n  if (number <= 1){\n  \
    \  return false;\n  }\n\n  for (let i=2; i<=number/2; i++){\n    if (number %\
    \ i === 0 ){\n      return false;\n    }\n  }\n\n  return true;\n}\n```\n\n我们可以首先用\
    \ `Range` 序列替换第一个循环，将数字打印到控制台。\n\n```javascript\nimport { Range } from \"immutable\"\
    ;\n\nRange(0, 10)\n  .filter(isPrime)\n  .forEach(log);\n```\n\n```javascript\n\
    function isPrime(number){ }\n\nfunction log(number) {\n  console.log(number);\n\
    }\n```\n\n`Range(0, 10)` 生成从 0 到 9 的所有数字，然后使用 `filter` 选择所有质数，并返回一个仅包含这些数字的新序列。接着我们使用\
    \ `forEach` 来显示这些数字。\n\n下面我们可以看到如何使用 `Range` 序列重构检测质数的循环。\n\n```javascript\nimport\
    \ { Range } from 'immutable';\n\nRange(0, 10)\n  .filter(isPrime)\n  .forEach(log);\n\
    ```\n\n```javascript\nfunction isPrime(number) {\n  if (number > 2){\n    const\
    \ firstDivisor = findFirstDivisor(number);\n    return !firstDivisor;\n  } else\
    \ {\n    return (number === 2)\n      ? true\n      : false;\n  }\n}\n\nfunction\
    \ findFirstDivisor(number){\n  return Range(2, (number / 2) + 1)\n    .find(isDivisorOf(number));\n\
    }\n\nfunction isDivisorOf(number) {\n  return function(divisor) {\n    return\
    \ (number > 1)\n      ? number % divisor === 0\n      : false\n  };\n}\n\nfunction\
    \ log(number) { }\n```\n\n`isDivisorOf` 是一个柯里化函数，它接收一个数字，并返回一个谓词函数，该函数接受一个可能的除数并返回一个布尔值。\n\
    \n`findFirstDivisor` 返回一个数字的第一个除数。它检查从 2 到其一半的所有数字来寻找这个除数。\n\n`isPrime` 根据 `findFirstDivisor`\
    \ 的结果来判断一个数字是否为质数。如果该数字没有除数，那么它就是质数。\n\n## 总结 转换器\n转换器是接收一个累加器并返回一个新累加器的函数。\n\n\
    像 `Seq` 这样的惰性序列允许我们高效地链式调用转换方法，而无需创建中间集合。\n\nRange 提供数字序列。\n\n# 第13章：生成器\n生成器是一个函数，每次调用时都从序列中返回下一个值。\n\
    \n我们将从一个简单的生成器函数开始，该函数每次被调用时返回下一个整数，从 0 开始。\n\n```javascript\nfunction range()\
    \ {\n let count = 0;\n return function() {\n  const result = count;\n  count +=\
    \ 1;\n  return result;\n }\n}\n\nconst nextNumber = range()\nconsole.log(nextNumber());\
    \ //0\nconsole.log(nextNumber()); //1\nconsole.log(nextNumber()); //2\n```\n\n\
    `nextNumber` 是一个无限生成器。`nextNumber` 是一个具有内部私有状态的闭包。\n\n## 有限生成器\n生成器可以是有限的。看下一个示例，其中\
    \ `range` 创建一个生成器，返回一个特定区间内的连续数字。在序列末尾，它返回 `undefined`。\n\n```javascript\nfunction\
    \ range(from, to){\n  let count = from;\n  return function(){\n    if(count <\
    \ to){\n      const result = count;\n      count += 1;\n      return result;\n\
    \    } else {\n      return undefined;\n    }\n  }\n}\n\nconst nextNumber = range(0,\
    \ 3)\nconsole.log(nextNumber()); //0\nconsole.log(nextNumber()); //1\nconsole.log(nextNumber());\
    \ //2\nconsole.log(nextNumber()); //undefined\n```\n\n## toArray\n使用生成器时，我们可能想创建一个包含序列中所有值的数组。对于这种情况，我们需要一个像\
    \ `toArray` 这样的实用函数，它接收一个生成器，并返回序列中的所有值作为数组。该序列应该是有限的。\n\n```javascript\nfunction\
    \ toArray(generate) {\n  let arr = [];\n  let value = generate();\n\n  while (value\
    \ !== undefined) {\n    arr = [...arr, value];\n    value = generate();\n  }\n\
    \  return arr;\n}\n```\n\n让我们将其与之前的生成器一起使用。\n\n```javascript\nconst numbers =\
    \ toArray(range(1, 5));\nconsole.log(numbers);\n//[1, 2, 3, 4]\n```\n\n## forEach\n\
    我们可能还需要为序列中的每个元素运行一个回调。`forEach` 实用函数正是这样做的。它接收一个生成器和一个回调，并运行该回调，直到生成器返回 `undefined`。\n\
    \n```javascript\nfunction forEach(callback){\n  return function(generate){\n \
    \   let value = generate();\n\n    while(value !== undefined){\n      callback(value);\n\
    \      value = generate();\n    }\n  }\n}\n```\n\n这是一个柯里化函数，它首先接收回调，然后接收生成器。\n\
    \n在下一个示例中，`log` 函数被生成器返回的所有数字调用。\n\n```javascript\nfunction log(x){\n  console.log(x);\n\
    }\n\nconst nextNumber = range(1, 4);\nforEach(log)(nextNumber);\n//1\n//2\n//3\n\
    ```\n\n## take\n另一个常见场景是仅获取序列中的前 n 个元素。在这种情况下，我们需要一个新的实用函数，如 `take`，它接收一个生成器并创建一个新的生成器，仅返回序列中的前\
    \ n 个元素。\n\n```javascript\nfunction take(n) {\n  return function(generate) {\n\
    \    let count = 0;\n    return function() {\n      if (count < n) {\n       \
    \ count += 1;\n        return generate();\n      }\n    };\n  };\n}\n```\n\n同样，`take`\
    \ 是一个柯里化函数，应该这样调用：`take(n)(sequence)`。\n\n以下是你可以如何在管道中使用 `take` 和 `forEach` 来获取并记录一个无限数字序列的前三个值到控制台。\n\
    \n```javascript\nimport { pipe } from 'lodash/fp';\n\nconst nextNumber = range();\n\
    pipe(\n  take(3),\n  forEach(console.log)\n)(nextNumber);\n//0\n//1\n//2\n```\n\
    \n## 自定义生成器\n我们可以创建任何自定义生成器，并与之前的实用函数一起使用。让我们创建一个 **斐波那契** 自定义生成器：\n\n```javascript\n\
    function fibonacci() {\n  let a = 0;\n  let b = 1;\n  return function() {\n  \
    \  const aResult = a;\n    a = b;\n    b = aResult + b;\n    return aResult;\n\
    \  };\n}\n```\n\n我们可以将斐波那契生成器与已创建的实用函数一起使用，以显示序列中的前 5 个数字。\n\n```javascript\n\
    import { pipe } from 'lodash/fp';\n\nconst generateFibonacci = fibonacci();\n\
    pipe(\n  take(5),\n  forEach(console.log)\n)(generateFibonacci);\n//0\n//1\n//1\n\
    //2\n//3\n```\n\n## 总结\n生成器是一个函数，每次调用时都从序列中返回一个新值。\n\n函数式生成器可以从有限或无限的值序列中返回元素。\n"
