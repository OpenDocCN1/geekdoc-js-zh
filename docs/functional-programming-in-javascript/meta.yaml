    \ 1, i + result);\n}\n```\n\nA [thunk](https://www.google.com/search?q=thunk+computer+science)\
    \ is a function taking no arguments that invokes another function with all the\
    \ necessary arguments and returns the result.\n\nFor example, the following function\
    \ is a thunk.\n\nconst sum100Thunk = () => sumAll(100); The sum100Thunk function\
    \ takes no arguments and returns the result of invoking sumAll with the specific\
    \ arguments.\n\nAfter converting the original function to return thunks we need\
    \ the trampoline utility function that loops in an iterative way and invokes the\
    \ thunk functions. The loop continues as long as the thunks return other thunk\
    \ functions.\n\n```\nfunction trampoline(f) {\n```"
