  - "[PAGE 66]\n\nwith recursion. At the time of writing, the tail-call recursive\
    \ implementation of a loop may have a performance penalty or may lead to stack-overflow\
    \ error.\n\n# Trampoline Trampolining is a technique that allows us to work with\
