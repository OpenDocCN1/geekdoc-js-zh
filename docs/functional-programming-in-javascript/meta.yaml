    \ We are going to call this new message `SetNumber`. At this point we realize\
    \ that messages can take arguments, messages can be functions.\n\n```\ntype Msg\
    \ = GenerateNumber | SetNumber Int In order to use the\nRandom.generate command\
    \ we need to install an additional\npackage.\n\nelm install elm/random Here is\
    \ the update function handling\nboth messages.\n\nupdate : Msg -> Model -> (Model,\
