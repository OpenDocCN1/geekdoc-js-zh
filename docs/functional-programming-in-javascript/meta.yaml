- md: "break and continue are usually used in loops. Once we disable the loops we\
    \ also disable the usage of break and continue.\n\nbreak cannot be used in switch\
    \ statements as they require to return on all branches.\n\n## throw\nThe throw\
    \ statement raises an exception. Below is an example.\n\n```\nthrow new Error('The\
    \ errors details');\n```\n\nExceptions are not used in functional programming,\
    \ which means we need to find other alternatives for those scenarios.\n\nFor asynchronous\
    \ code, the best way is to return a rejected promise when the operation fails.\
    \ We will look at this scenario when discussing promises. For synchronous code,\
    \ we need to return a different result when an error happens.\n\nHere is the lint\
    \ rule for disabling the throw statement:\n\n```\n\"functional/no-throw-statement\"\
    : \"error\"\n```\n\n## Recap\nConditional statements should return a value on\
    \ all branches.\n\nThe better alternative for the if statement is the conditional\
    \ operator.\n\nSwitches can be replaced with a map.\n\nWe should use the array\
    \ methods instead of the loop statements.\n\nWe are going to use only one disruptive\
    \ statement return.\n\n# Chapter 07: Recursion\n\nRecursion implies that a function\
    \ calls itself. The recursion needs a termination. This happens when a certain\
    \ condition is met and the recursive algorithm stops calling itself and returns\
    \ a value.\n\nRecursion is a method of solving a problem where the solution is\
    \ found by solving smaller instances of the same problem.\n\n### Recursive Factorial\n\
    Let's start by looking at the algorithm for computing the factorial of a number\
    \ in an iterative style. As you remember n! = n * (n-1)!.\n\n```\nfunction factorial(n)\
    \ {\n let result = 1;\n\n let i = 2;\n while(i <= n){\n   result = result * i;\n\
    \   i = i + 1;\n }\n\n return result;\n}\n\nconsole.log(factorial(5));\n//i=2,\
    \ result=2\n//i=3, result=6\n//i=4, result=24\n//i=5, result=120\n//120\n```\n\
    \nHere is how we can implement the same algorithm using recursion.\n\n```\nfunction\
    \ factorial(n) {\n  if (n === 0) {\n    return 1;\n  }\n  else {\n    return n\
    \ * factorial(n - 1);\n  }\n}\n```\n\n```\n//n=5 -> 5*f(4)\n//n=4 -> 4*f(3)\n\
    //n=3 -> 3*f(2)\n//n=2 -> 2*f(1)\n//n=1 -> 1*f(0)\n//n=0 -> 1 Stops!\n//n=1 ->\
    \ 1*f(0) = 1*1 = 1\n//n=2 -> 2*f(1) = 2*1 = 2\n//n=3 -> 3*f(2) = 3*2 = 6\n//n=4\
    \ -> 4*f(3) = 4*6 = 24\n//n=5 -> 5*f(4) = 5*24= 120\n```\n\n```\nconsole.log(factorial(5));\n\
    //120\n```\n\nThe factorial function calls itself until it has the result for\
    \ n being 0. Then it resumes the execution and computes the result for n equal\
    \ to 1, 2, 3, 4 and finally 5.\n\nBelow is the same recursive function refactored\
    \ using the conditional operator.\n\n```\nfunction factorial(n) {\n  return (n\
    \ === 0)\n    ? 1\n    : n * factorial(n - 1);\n}\n```\n\n```\nconsole.log(factorial(5));\n\
    //120\n```\n\n## Tail-Call Optimization\nHere is another way of writing the factorial\
    \ function.\n\n```\nfunction factorial(n, result = 1) {\n  //console.log(`n=${n},\
    \ result=${result}`);\n\n  return (n === 0)\n    ? result\n    : factorial(n -\
    \ 1, n * result);\n}\n```\n\n```\nconsole.log(factorial(5));\n```\n\n```\n//n=5,\
    \ result=1\n//n=4, result=5\n//n=3, result=20\n//n=2, result=60\n//n=1, result=120\n\
    //n=0, result=120\n//120\n```\n\nNotice that this time, once the function arrives\
    \ at the stopping condition it returns the result. It does not need to go back\
    \ and resume the previous calls to return the end result. It returns when the\
    \ ending condition is met because it has all the necessary data.\n\nA recursive\
    \ function is tail-recursive when the recursive call is the last thing the function\
    \ does.\n\nThe tail-recursive functions should be optimized by the compiler and\
    \ should perform better.\n\nAt the moment of writing the tail-call optimization\
    \ is not implemented by the major browsers.\n\n## Stack Overflow Error\nConsider\
    \ the following function that computes the sum of all values from 0 to 10000 in\
    \ an iterative style.\n\n```\nfunction sumAll(n) {\n  let total = 0;\n  let i\
    \ = 1;\n  while(i <= n){\n    total = total + i;\n    i = i + 1;\n  }\n\n  return\
    \ total;\n}\n```\n\n```\nconsole.log(sumAll(10000));\n//50005000\n```\n\nBelow\
    \ is the equivalent code written with the tail-call optimization.\n\n```\nfunction\
    \ sumAll(n, i = 0, result = 0) {\n  return (i > n)\n    ? result\n    : sumAll(n,\
    \ i + 1, i + result);\n}\n```\n\n```\nconsole.log(sumAll(5));\n//15\n```\n\nCalling\
    \ the recursive function with a larger number leads to the stack overflow error.\n\
    \n```\nconsole.log(sumAll(10000));\n```\n\n> //Maximum call stack size exceeded\n\
    \nRecursion can lead to the “Maximum call stack size exceeded” error message.\n\
    \nJavaScript reserves for each function call a call-stack, a fixed amount of memory\
    \ to keep information about the call. Information is added to the call-stack like\
    \ in any other stack last-in, first-out. Each recursive call adds a new stack-frame\
    \ to the call-stack. If the recursive calls create too many stack-frames the stack\
    \ overflow error is thrown.\n\nThe tail-recursive functions should not create\
    \ a new stack frame for each function call, but rather use a single stack frame.\n\
    \nIn theory, any loop can be implemented with recursion. Because of the missing\
    \ implementation of the tail-call optimization, it is not practical to replace\
    \ any kind of loop with recursion. At the time of writing, the tail-call recursive\
    \ implementation of a loop may have a performance penalty or may lead to stack-overflow\
    \ error.\n\n## Trampoline\nTrampolining is a technique that allows us to work\
    \ with tail-recursive functions in a language that does not have the tail-call\
    \ optimization.\n\nFirst, it requires to rewrite the original tail-call function\
    \ to return thunks instead of returning the actual values. In our example, it\
    \ means that instead of returning the result of sumAll(n, i + 1, i + result) we\
    \ return a nullary function returning that result.\n\n```\nfunction sumAll(n,\
    \ i = 0, result = 0) {\n    return (i > n)\n        ? () => result\n        :\
    \ () => sumAll(n, i + 1, i + result);\n}\n```\n\nA [thunk](https://www.google.com/search?q=thunk+computer+science)\
    \ is a function taking no arguments that invokes another function with all the\
    \ necessary arguments and returns the result.\n\nFor example, the following function\
    \ is a thunk.\n\n```\nconst sum100Thunk = () => sumAll(100);\n```\n\nThe sum100Thunk\
    \ function takes no arguments and returns the result of invoking sumAll with the\
    \ specific arguments.\n\nAfter converting the original function to return thunks\
    \ we need the trampoline utility function that loops in an iterative way and invokes\
    \ the thunk functions. The loop continues as long as the thunks return other thunk\
    \ functions.\n\n```\nfunction trampoline(f) {\n  return function(...args){\n \
    \   let result = f(...args);\n    while (typeof(result) === 'function'){\n   \
    \   result = result();\n    }\n\n    return result;\n  }\n}\n```\n\n```\nconst\
    \ _sumAll = trampoline(sumAll);\n```\n\n```\nconsole.log(_sumAll(10000));\n//50005000\n\
    ```\n\nTrampolining is a solution to a problem we should not have and also comes\
    \ with its own overhead. It basically allows us to convert the recursive function\
    \ to an iterative loop.\n\n## Traversing a Tree\nRecursion can be used to implement\
    \ specific algorithms that are easier to solve this way.\n\nIn the next example,\
    \ recursion is used to traverse a tree and create an array with the top selected\
    \ node values.\n\nWe start by defining the tree, beginning with the root node\
    \ object containing other node objects. Each node has the value and checked properties.\n\
    \n```\nconst tree = {\n  value: 0,\n  checked: false,\n  children: [{\n    value:\
    \ 1,\n    checked: true,\n    children: [{\n        value: 11,\n        checked:\
    \ true,\n        children: null\n    }]\n}, {\n    value: 2,\n    checked: false,\n\
    \    children: [{\n        value: 22,\n        checked: true,\n        children:\
    \ null\n    }, {\n        value: 23,\n        checked: true,\n        children:\
    \ null\n    }]\n}]\n```\n\nHere is a visual representation of this tree.\n\nWe\
    \ want to get the values of the top selected nodes. That means we don’t need all\
    \ the checked values from the tree. If the parent node is checked we don’t have\
    \ to take the checked values from its children.\n\n```\nfunction toChildTopSelection(selection,\
    \ childNode){\n  return selection.concat(getTopSelection(childNode));\n}\n```\n\
    \n```\nfunction getTopSelection(node){\n  return node.checked\n    ? [node.value]\n\
    \    : node.children !== null\n      ? node.children.reduce(toChildTopSelection,\
    \ [])\n}\n```"
  mdcn: "\n`break`和`continue`通常用于循环中。一旦我们禁用了循环，也就禁用了`break`和`continue`的使用。\n\n`break`不能用在`switch`语句中，因为`switch`要求在所有分支上都返回值。\n\
    \n## throw\n`throw`语句用于抛出一个异常。下面是一个示例。\n\n```\nthrow new Error('The errors details');\n\
    ```\n\n异常在函数式编程中不被使用，这意味着我们需要为这些场景寻找其他替代方案。\n\n对于异步代码，最好的方式是在操作失败时返回一个被拒绝的Promise。我们将在讨论Promise时探讨这种情况。对于同步代码，我们需要在发生错误时返回一个不同的结果。\n\
    \n以下是禁用`throw`语句的lint规则：\n\n```\n\"functional/no-throw-statement\": \"error\"\n\
    ```\n\n## 回顾\n条件语句应该在所有分支上都返回一个值。\n\n`if`语句的更好替代方案是条件运算符。\n\n`switch`语句可以用映射（map）来替代。\n\
    \n我们应该使用数组方法而不是循环语句。\n\n我们将只使用一个破坏性语句：`return`。\n\n# 第7章：递归\n\n递归意味着一个函数调用自身。递归需要一个终止条件。当满足某个条件时，递归算法停止调用自身并返回一个值。\n\
    \n递归是一种解决问题的方法，其解决方案是通过解决同一问题的更小实例来找到的。\n\n### 递归阶乘\n让我们从查看用迭代风格计算数字阶乘的算法开始。正如你记得的，n!\
    \ = n * (n-1)!。\n\n```\nfunction factorial(n) {\n let result = 1;\n\n let i =\
    \ 2;\n while(i <= n){\n   result = result * i;\n   i = i + 1;\n }\n\n return result;\n\
    }\n\nconsole.log(factorial(5));\n//i=2, result=2\n//i=3, result=6\n//i=4, result=24\n\
    //i=5, result=120\n//120\n```\n\n以下是我们如何使用递归来实现相同的算法。\n\n```\nfunction factorial(n)\
    \ {\n  if (n === 0) {\n    return 1;\n  }\n  else {\n    return n * factorial(n\
    \ - 1);\n  }\n}\n```\n\n```\n//n=5 -> 5*f(4)\n//n=4 -> 4*f(3)\n//n=3 -> 3*f(2)\n\
    //n=2 -> 2*f(1)\n//n=1 -> 1*f(0)\n//n=0 -> 1 停止！\n//n=1 -> 1*f(0) = 1*1 = 1\n\
    //n=2 -> 2*f(1) = 2*1 = 2\n//n=3 -> 3*f(2) = 3*2 = 6\n//n=4 -> 4*f(3) = 4*6 =\
    \ 24\n//n=5 -> 5*f(4) = 5*24= 120\n```\n\n```\nconsole.log(factorial(5));\n//120\n\
    ```\n\n阶乘函数会调用自身，直到得到n为0的结果。然后它恢复执行，计算n等于1、2、3、4，最后是5的结果。\n\n以下是一个使用条件运算符重构的递归函数。\n\
    \n```\nfunction factorial(n) {\n  return (n === 0)\n    ? 1\n    : n * factorial(n\
    \ - 1);\n}\n```\n\n```\nconsole.log(factorial(5));\n//120\n```\n\n## 尾调用优化\n这是编写阶乘函数的另一种方式。\n\
    \n```\nfunction factorial(n, result = 1) {\n  //console.log(`n=${n}, result=${result}`);\n\
    \n  return (n === 0)\n    ? result\n    : factorial(n - 1, n * result);\n}\n```\n\
    \n```\nconsole.log(factorial(5));\n```\n\n```\n//n=5, result=1\n//n=4, result=5\n\
    //n=3, result=20\n//n=2, result=60\n//n=1, result=120\n//n=0, result=120\n//120\n\
    ```\n\n注意，这一次，一旦函数到达停止条件，它就返回结果。它不需要回溯并恢复之前的调用来返回最终结果。它在满足结束条件时返回，因为它拥有了所有必要的数据。\n\
    \n当递归调用是函数执行的最后一件事时，该递归函数就是尾递归函数。\n\n尾递归函数应该由编译器进行优化，并且应该具有更好的性能。\n\n在撰写本文时，主要浏览器尚未实现尾调用优化。\n\
    \n## 栈溢出错误\n考虑以下函数，该函数使用迭代风格计算从0到10000所有值的总和。\n\n```\nfunction sumAll(n) {\n \
    \ let total = 0;\n  let i = 1;\n  while(i <= n){\n    total = total + i;\n   \
    \ i = i + 1;\n  }\n\n  return total;\n}\n```\n\n```\nconsole.log(sumAll(10000));\n\
    //50005000\n```\n\n以下是使用尾调用优化编写的等效代码。\n\n```\nfunction sumAll(n, i = 0, result\
    \ = 0) {\n  return (i > n)\n    ? result\n    : sumAll(n, i + 1, i + result);\n\
    }\n```\n\n```\nconsole.log(sumAll(5));\n//15\n```\n\n使用更大的数字调用递归函数会导致栈溢出错误。\n\n\
    ```\nconsole.log(sumAll(10000));\n```\n\n> //Maximum call stack size exceeded\n\
    \n递归可能导致“Maximum call stack size exceeded”错误消息。\n\nJavaScript为每次函数调用保留一个调用栈，这是一个固定数量的内存，用于保存关于调用的信息。信息被添加到调用栈中，就像任何其他栈一样，后进先出。每次递归调用都会向调用栈添加一个新的栈帧。如果递归调用创建了太多的栈帧，就会抛出栈溢出错误。\n\
    \n尾递归函数不应为每次函数调用创建一个新的栈帧，而应使用单个栈帧。\n\n理论上，任何循环都可以用递归来实现。由于尾调用优化的缺失，用递归来替换任何类型的循环是不切实际的。在撰写本文时，循环的尾递归实现可能会有性能损失或导致栈溢出错误。\n\
    \n## 蹦床（Trampoline）\n蹦床是一种技术，允许我们在没有尾调用优化的语言中使用尾递归函数。\n\n首先，它要求将原始的尾调用函数重写为返回thunks而不是实际值。在我们的例子中，这意味着不是返回sumAll(n,\
    \ i + 1, i + result)的结果，而是返回一个返回该结果的无参函数。\n\n```\nfunction sumAll(n, i = 0, result\
    \ = 0) {\n    return (i > n)\n        ? () => result\n        : () => sumAll(n,\
    \ i + 1, i + result);\n}\n```\n\n一个[thunk](https://www.google.com/search?q=thunk+computer+science)是一个不带参数的函数，它调用另一个函数并传递所有必要的参数，然后返回结果。\n\
    \n例如，以下函数就是一个thunk。\n\n```\nconst sum100Thunk = () => sumAll(100);\n```\n\nsum100Thunk函数不带参数，并返回使用特定参数调用sumAll的结果。\n\
    \n将原始函数转换为返回thunks后，我们需要蹦床实用函数，该函数以迭代方式循环并调用thunk函数。只要thunks返回其他thunk函数，循环就会继续。\n\
    \n```\nfunction trampoline(f) {\n  return function(...args){\n    let result =\
    \ f(...args);\n    while (typeof(result) === 'function'){\n      result = result();\n\
    \    }\n\n    return result;\n  }\n}\n```\n\n```\nconst _sumAll = trampoline(sumAll);\n\
    ```\n\n```\nconsole.log(_sumAll(10000));\n//50005000\n```\n\n蹦床是我们本不应遇到的问题的解决方案，它也有自己的开销。它本质上允许我们将递归函数转换为迭代循环。\n\
    \n## 遍历树\n递归可用于实现特定的算法，这些算法用递归解决更容易。\n\n在下一个示例中，递归用于遍历树，并创建一个包含顶层选中节点值的数组。\n\n\
    我们首先定义树，从包含其他节点对象的根节点对象开始。每个节点都有`value`和`checked`属性。\n\n```\nconst tree = {\n\
    \  value: 0,\n  checked: false,\n  children: [{\n    value: 1,\n    checked: true,\n\
    \    children: [{\n        value: 11,\n        checked: true,\n        children:\
    \ null\n    }]\n}, {\n    value: 2,\n    checked: false,\n    children: [{\n \
    \       value: 22,\n        checked: true,\n        children: null\n    }, {\n\
    \        value: 23,\n        checked: true,\n        children: null\n    }]\n\
    }]\n```\n\n这是这棵树的可视化表示。\n\n我们想要获取顶层选中节点的值。这意味着我们不需要树中所有`checked`的值。如果父节点被选中，我们就不必取其子节点的选中值。\n\
    \n```\nfunction toChildTopSelection(selection, childNode){\n  return selection.concat(getTopSelection(childNode));\n\
    }\n```\n\n```\nfunction getTopSelection(node){\n  return node.checked\n    ? [node.value]\n\
    \    : node.children !== null\n      ? node.children.reduce(toChildTopSelection,\
    \ [])\n}\n```\n"
