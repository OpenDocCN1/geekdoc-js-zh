  md: '# # Chapter 17: Functional Paradigm


    Now we are going to look back at what it means to program in a functional style.


    The main idea in functional programming is to split the application into small
    pure functions that communicate using immutable data and then compose these functions
    to implement the required functionality.


    Ideally, all the functions in the application should be pure functions.


    **Purity As repeated many times, the point of functional programming is to write
    pure functions. These are functions that just transform values.**


    When a pure function returns the application has the same state as when the function
    was called. An application is much easier to understand when we don’t have to
    track variables changing their values. Pure functions make code easier to follow
    by allowing us to focus our attention in one place.


    The challenge is, of course, to create a practical application doing only transformations
    with pure functions. Is that even possible?


    We saw that it is achievable if we have the right framework using these pure functions
    and doing the impure logic necessary for a practical application. Such architecture
    was implemented in Elm.


    Here is the flow of executing impure logic in Elm:'
  merge: -1
  pgno: 172
- img_proc: true
  md: "+   - The pure update function creates a command describing the impure logic\n\
    - The Elm framework takes the command, runs the impure logic and generates a message\
    \ containing the result\n- The pure update function handles this message by creating\
    \ a new updated model holding the previous result\n\nThis kind of approach requires\
    \ having functions to create commands for any kind of impure logic and using a\
    \ framework able to understand those commands.\n\nNext, we are going to look at\
    \ a similar approach for making a fetch call with React and Redux using only pure\
    \ functions. The fetch call itself is a side-effect, so invoking it in a function\
