  md: 'The view function is a pure function building the HTML and creating messages.
    The view function is not responsible for rendering HTML on a screen. It takes
    a model and returns HTML. The Elm framework uses the view function to render this
    HTML on the screen.


    Messages are requests to modify the application''s model.


    The update function is a pure function taking in the current model and a message
    and returning the new model. When dealing with side-effects it also returns a
    new command. The update function doesn''t effectively change the model. The Elm
    framework uses the update function to change the model. The Elm framework executes
    the command returned by the update function and creates a new message with the
    result.'
