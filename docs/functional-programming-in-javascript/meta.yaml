- md: "The `filter` method loops through all the elements in the array and applies\
    \ the `isEven` function. It creates a new array containing only those elements\
    \ for which the `isEven` function returns `true`.\n\n![](img/64a41332f00094d6262a8288d39ce1de_29_0.png)\n\
    \n`isEven` is a predicate function.\n\nA predicate function is a function taking\
    \ an element and returning a boolean value. The predicate is a unary function.\n\
    \nNext, consider a list of game objects.\n\n```\nconst games = [\n { title: 'Starcraft',\
    \ genre: 'RTS' },\n { title: 'Command and Conquer', genre: 'RTS' },\n { title:\
    \ 'Heroes of Might and Magic', genre: 'TBS' },\n { title: 'World of Warcraft',\
    \ genre: 'MMORPG'}\n]\n```\n\nWe are going to select only strategy games. For\
    \ this, we will build a predicate function taking a game object and deciding if\
    \ it is a strategy game based on its genre property.\n\n```\nfunction isStrategy(game){\n\
    \  const strategyGenres = ['RTS', 'RTT', 'TBS', 'TBT'];\n  return strategyGenres.includes(game.genre);\n\
    }\n```\n\nThe `includes` method checks if a value is in the array and returns\
    \ true or false.\n\nNow we can use `filter` with the predicate function to select\
    \ only the strategy games.\n\n```\nconst strategyGames = games\n  .filter(isStrategy);\n\
    \nconsole.log(strategyGames);\n// [ { title: 'Starcraft', genre: 'RTS' },\n//\
    \   { title: 'Command and Conquer', genre: 'RTS' },\n//   { title: 'Heroes of\
    \ Might and Magic', genre: 'TBS' } ]\n```\n\n## Mapping\n\nNext, we are going\
    \ to apply the mapping transformation on a list of numbers.\n\n```\nconst numbers\
    \ = [1, 2, 3, 4];\n```\n\n```\nfunction triple(n) {\n  return n * 3;\n}\n\nconst\
    \ newNumbers = numbers.map(triple);\nconsole.log(newNumbers);\n// [3, 6, 9, 12]\n\
    ```\n\nThe map method applies the mapping function on all elements in the array\
    \ and creates a new array with the result.\n\n![](img/64a41332f00094d6262a8288d39ce1de_32_0.png)\n\
    \n`triple` is a mapping function.\n\nA mapping function is a function that takes\
    \ an element and transforms it into a new value. It is a unary function.\n\nNext,\
    \ let's apply a mapping function on the list of game objects.\n\n```\nconst games\
    \ = [\n  { title: 'Starcraft', genre: 'RTS' },\n  { title: 'Command and Conquer',\
    \ genre: 'RTS' },\n  { title: 'Heroes of Might and Magic', genre: 'TBS' },\n \
    \ { title: 'World of Warcraft', genre: 'MMORPG'}\n]\n```\n\nThe following `toGameHtml`\
    \ function takes a game object and creates the HTML string for it.\n\n```\nfunction\
    \ toGameHtml(game){\n  return `<div>${game.title}</div>`;\n}\n```\n\nTemplate\
    \ strings allow us to insert variables into strings. They are a better alternative\
    \ to string concatenation. Variables inserted in template strings are surrounded\
    \ by `${}`. Template strings allow the text to span multiple lines. This allows\
    \ creating easier to read HTML strings.\n\n```\nfunction toGameHtml(game){\n \
    \ return `\n    <div>\n      ${game.title}\n    </div>`;\n}\n```\n\nWe can now\
    \ use the mapping function to transform all game objects into HTML strings.\n\n\
    ```\nconst htmlRows = games\n  .map(toGameHtml);\n\nconsole.log(htmlRows);\n//\
    \ [ '<div>Starcraft</div>',\n//   '<div>Command and Conquer</div>',\n//   '<div>Heroes\
    \ of Might and Magic</div>',\n//   '<div>World of Warcraft</div>' ]\n```\n\nThe\
    \ `join` method combines all elements of an array into one string. It takes a\
    \ separator as a parameter. If no argument is provided it combines all elements\
    \ without any separator.\n\n```\nconsole.log(htmlRows.join());\n// \"<div>Starcraft</div>,<div>Command\
    \ and Conquer</div>,\n// <div>Heroes of Might and Magic</div>,\n// <div>World\
    \ of Warcraft</div>\"\n```\n\n## Aggregating\n\nAggregation is about grouping\
    \ multiple values into a single summary value.\n\nConsider the following code.\n\
    \n```\nconst numbers = [1, 3, 5, 7];\n\nfunction add(total, n) {\n  return total\
    \ + n;\n}\n\nconst total = numbers.reduce(add, 0);\nconsole.log(total);\n// 16\n\
    ```\n\nThe reduce method reduces a list to a single value.\n\nThe reduce method\
    \ applies the reducer function for each element in the array to compute the aggregate\
    \ value. It can take a second parameter as the initial aggregate value.\n\n`add`\
    \ is the reducer function.\n\nThe reducer function takes the current aggregate\
    \ value and the current element and returns the new aggregate value. The reducer\
    \ is a binary function.\n\n![](img/64a41332f00094d6262a8288d39ce1de_35_0.png)\n\
    \nIn the first iteration, the aggregate value is 0 and the current element is\
    \ 1. Applying the reducer results in a new aggregate value of 1.\n\nIn the fourth\
    \ iteration, the current aggregate value is 9 and the current element is 7. Applying\
    \ the reducer results in the new aggregate value of 16.\n\nLet's get back to the\
    \ game objects array and compute the numbers of games for each genre.\n\n```\n\
    const games = [\n  { title: 'Starcraft', genre: 'RTS' },\n  { title: 'Command\
    \ and Conquer', genre: 'RTS' },\n  { title: 'Heroes of Might and Magic', genre:\
    \ 'TBS' },\n  { title: 'World of Warcraft', genre: 'MMORPG'}\n];\n```\n\n```\n\
    function countByGenre(countMap, game){\n  const count = countMap[game.genre] ||\
    \ 0;\n  return {\n    ...countMap,\n    [game.genre]: count + 1\n  }\n}\n```\n\
    \n```\nconst gamesByGenreCounts = games\n  .reduce(countByGenre, {});\n```\n\n\
    ```\nconsole.log(gamesByGenreCounts);\n// { RTS: 2, TBS: 1, MMORPG: 1 }\n```\n\
    \n`countByGenre` is the reducer function. It starts with an empty object as the\
    \ aggregate value and at each step increments the number of games for the genre\
    \ of the current game. Changing the `count` on the aggregate object means creating\
    \ an object with the new `count`.\n\n## Sorting\n\nThe `sort` method allows sorting\
    \ an array.\n\n```\nconst numbers = [4, 2, 3, 1];\n\nfunction asc(a, b) {\n  if(a\
    \ === b){\n    return 0;\n  } else {\n    if (a < b){\n      return -1;\n    }\
    \ else {\n      return 1;\n    }\n  }\n}\n\nconst sortedNumbers = numbers.slice().sort(asc);\n\
    console.log(sortedNumbers);\n// [1, 2, 3, 4]\n```\n\nThe `sort` method does the\
    \ sort using the compare function.\n\nThe `asc` function is the compare function.\
    \ It is a binary function. It takes two values and returns `-1`, `0`, and `1`.\n\
    \nConsider the compare function taking two values `a` and `b`.\n\n- It returns\
    \ `0` if the values are equal\n- It returns `-1` if value `a` comes before value\
    \ `b`\n- It returns `1` if value `a` comes after value `b`\n\n`sort` is an impure\
    \ method. It modifies the input array. This is why it gives a lint error. In order\
    \ to do sorting, we need to clone the array first.\n\n```\nconst sortedNumbers\
    \ = numbers.sort(asc);\n// Modifying an array is not allowed functional/immutable-data\n\
    ```\n\n```\nconst sortedNumbers = numbers.slice().sort(asc);\nconst sortedNumbers\
    \ = [...numbers].sort(asc);\n```\n\n`slice` makes a copy of the array or a copy\
    \ of a part of the array. Calling `slice` with no arguments makes a copy of the\
    \ array. The first parameter is the start index. The second parameter is the ending\
    \ index.\n\n## Searching\n\n`find` returns the first element that matches the\
    \ predicate function. `find` returns the first match and stops. `filter` never\
    \ stops and returns an array with all matches. `find` is faster than `filter`.\n\
    \n`findIndex` returns the index of the first match. `every` returns true if all\
    \ elements match the predicate function. It stops at the first element that doesn't\
    \ match and returns `false`.\n\n`some` returns `true` if at least one element\
    \ matches the predicate function. It stops at the first match.\n\nAll these four\
    \ methods use a predicate function and stop based on the returned value.\n\n```\n\
    const games = [\n  { title: 'Starcraft 2', genre: 'RTS' },\n  { title: 'Desperados\
    \ 3', genre: 'RTT'},\n  { title: 'Candy Crush Saga', genre: 'Tile-matching'}\n\
    ];\n\nfunction isStrategy(game){\n    const strategyGenres = ['RTS', 'RTT', 'TBS',\
    \ 'TBT'];\n    return strategyGenres.includes(game.genre);\n}\n\nconst first =\
    \ games.find(isStrategy);\nconsole.log(first);\n// { title: 'Starcraft 2', genre:\
    \ 'RTS' }\n\nconst firstIndex = games.findIndex(isStrategy);\nconsole.log(firstIndex);\n\
    // 0\n\nconst areAll = games.every(isStrategy);\nconsole.log(areAll);\n// false\n\
    \nconst hasOne = games.some(isStrategy);\nconsole.log(hasOne);\n// true\n```\n\
    \n## forEach\n\n`forEach` takes a function and calls it with each element in the\
    \ array. It calls the function with the current element as the first argument\
    \ and with the current index as the second argument.\n\n`forEach` never stops\
    \ and processes the whole list. It ignores the returned value.\n\n```\nconst numbers\
    \ = [1, 2, 3];\n\nfunction log(value){\n    console.log(value);\n```"
  mdcn: "\n`filter` 方法会遍历数组中的所有元素，并应用 `isEven` 函数。它会创建一个新数组，其中只包含那些 `isEven` 函数返回\
    \ `true` 的元素。\n\n![](img/64a41332f00094d6262a8288d39ce1de_29_0.png)\n\n`isEven`\
    \ 是一个谓词函数。\n\n谓词函数是接收一个元素并返回布尔值的函数。谓词是一个一元函数。\n\n接下来，考虑一个游戏对象列表。\n\n```\nconst\
