  md: '# # Chapter 16: Elm Architecture


    Next, we are going to learn how to create a simple application in a functional
    style by building one using the [Elm](https://elm-lang.org/) purely functional
    language. Then we will implement the same functionality with [React](https://reactjs.org/)
    and [Redux](https://redux.js.org/). The point is to understand the architecture
    that supports this style of programming.


    Start by creating the Elm project. Navigate to a new folder and create the Elm
    project by running: elm init The command creates an `elm.json` file and a `src`
    folder for all Elm files.


    `elm reactor` opens the development server. It starts a server at `http://localhost:8000`
    . From there we can navigate to any Elm file.


    # ## Elm Architecture The Elm Architecture defines the data flow inside an Elm
    application. It breaks the application into the following core parts:


    +   - **Model** — defines all the state of the application.

    - **View** — is a pure function that transforms the state data into HTML. The
    HTML sends back messages.

    - **Messages** — expresses the user interaction.

    - **Update** — is a pure function returning a new state based on the current message
    and the actual state.'
  merge: -1
