  md: '# Creating Custom Objects


    Listing 15.1 adds a heading method to the String object definition that will display
    the string as a heading, and then displays a simple example.


    # Listing 15.1 Adding a method to the String object


    ```

    <html>

    <head><title>Test of heading method</title>

    </head>

    <body>

    <script LANGUAGE=''JavaScript1.1'' type=''text/javascript1.1''>

    function addhead(level) {

    html = ''H'' + level;

    text = this.toString();

    start = "<" + html + ">";

    stop = "</" + html + ">";

    return start + text + stop;

    }

    String.prototype.heading = addhead;\ocument.write(''This is a test.''.heading(1));

    </script>

    </body>

    </html>

    ```


    > Don''t forget that you can download this listing from this book''s Web site
    (http://www.jsworkshop.com/) rather than typing it in.


    First, define the addhead() function, which will serve as the new string method.
    It accepts a number to specify the heading level. The start and stop variables
    are used to store the HTML "begin header" and "end header" tags, such as <h1>
    and </h1>.


    After the function, use the prototype keyword to add it as a method of the String
    object. You can then use this method on any String object, or in any fact JavaScript
    string. This is demonstrated by the last statement, which displays a quoted text
    string as a Level 1 header.


    # Workshop: Storing Data in Objects


    Now you''ve created a new object to store business cards and a method to print
    them out. As a final demonstration of objects, properties, functions, and methods,
    you will now use this object in a Web Page to display data for several cards.'
