    #  Changing Colors and Background Images


    You can also use style sheets to gain more control over the colors and background
    images used on your Web page. CSS includes the following properties for this purpose:


    +   - color— Specifies the text color of an element. This is useful for emphasizing
    text or for using a specific color scheme for the document. You can specify a
    named color (for example, red) or red, green, and blue values (for example, #0522AS).


    +   - background-color— Specifies the background color of an element. By setting
    this value, you can make paragraphs, table cells, and other elements with unique
    background-colors. As color, you can specify a color name or numeric color.


    +   - background-image— Specifies a GIF format image to be used as the background
    for the element.


    +   - background-repeat— Specifies whether the background image is repeated (tiled).
    The image can be repeated horizontally, vertically, or both.


    +   - background-attachment— Controls whether the background image scrolls when
    you scroll through the document. fixed means that the background image stays still
    while the document scrolls; scroll mean the image scrolls with the document (like
    background images on normal Web documents).


    +   - background-position— Allows you to offset the position of the background
    image.


    +   - background—This provides a quick way to set all of the background elements
    in this list. You can specify all of the attributes in a single background rule.'
