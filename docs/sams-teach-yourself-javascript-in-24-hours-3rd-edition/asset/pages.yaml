  md: '# Style and Substance


    If you''ve ever tried to make a really good-looking Web page, you''ve probably
    encountered some problems. First of all, HTML doesn''t give you much control over
    a page''s appearance. For example, you can''t change the amount of space between
    words—in fact, you can''t even use two spaces between words because they''ll be
    converted to a single space.


    Second, when you do your best to make a perfect-looking document using HTML, you
    will find that it doesn''t necessarily display the same way on all browsers—or
    even on different computers running the same browser.


    The reason for these problems is simple: HTML was never meant to handle things
    like layout, and spacing. HTML deals with a document''s structure—in other words,
    the document is divided into paragraphs, headings, lists, and other elements.


    This isn''t a bad thing. In fact, it''s one of the most powerful features of HTML.
    You only define the structure of the document, so it can be displayed in all sorts
    of ways without changing its meaning. For example, a well-written HTML document
    can be displayed in Netscape or Internet Explorer, which generally treat elements
    the same way—there is a space between paragraphs, headings are in big, bold text,
    and so on.


    Because HTML only defines the structure, the same document can be displayed in
    a text-based browser, such as Lynx. In this case, the different elements will
    be displayed differently, but you can still tell which text is a heading, a list,
    and so on.


    > Text-based browsers aren''t the only alternate of displaying HTML. Browsers
    designed for the blind can read a Web page using a speech synthesizer, with different
    voices or sounds that indicate the different elements.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_280_0.png)


    As you should understand now, HTML is very good at its job—defining a document''s
    structure. Not surprisingly, using this language to control the document''s presentation
    will only drive you crazy.


    Fortunately, the World Wide Web Consortium (W3C) realized that Web authors need
    to control the layout and presentation of documents. This resulted in the Cascading
    Style Sheets (CSS) standard.


    CSS adds a number of features to HTML to control style and appearance. More importantly,
    it does this without affecting HTML''s ability to describe document'
