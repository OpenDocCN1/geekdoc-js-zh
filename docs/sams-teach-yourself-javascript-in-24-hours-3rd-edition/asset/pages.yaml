    # LISTING 8.1 A script to test JavaScript''s random number function


    ```

    <html>

    <head>

    <title>Math Example</title>

    </head>

    <body>

    <h1>Math Example</h1>

    <p>How random are JavaScript''s random numbers?

    Let''s generate 5000 of them and find out.</p>

    <script LANGUAGE="JavaScript" type="text/javascript">

    total = 0;

    for (i=1; i<=5000; i++) {

    num = Math.random();

    total += num;

    window.status = "Generated " + i + " numbers.";

    }

    average = 5000;

    average = Math.round(average * 1000) / 1000;

    document.write("<H2>Average of 5000 numbers: " + average + "</H2>");

    </script>

    </body>

    </html>

    ```


    To test the script, load the HTML document into a browser. The status line will
    immediately begin counting up to 5000. After a short delay, you should see a result.
    If it''s close to .5, the numbers are reasonably random. My result was .502, as
    shown in Figure 8.1.


    The average you''ve used here is an arithmetic mean. This type of average isn''t
    a perfect way to test randomness. Actually, it all tests the distribution of the
    numbers above and below .5. For example, if the numbers turned out to be 2500.4
    and 2500.6, the average would be a perfect .5—but they wouldn''t be random numbers.
    (Thankfully, JavaScript''s random numbers wouldn''t have this problem.)'
