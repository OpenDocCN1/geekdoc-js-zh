    # # APPENDIX D


    # # JavaScript Quick Reference


    This appendix is a quick reference for the JavaScript language. It includes the
    built-in objects and the objects in the basic object hierarchy, JavaScript statements,
    and built-in functions.


    # ## Built-in Objects


    The following objects are built in to JavaScript. Some can be used to create objects
    of your own; others can only be used as they are. Each is detailed below.


    # ### Array


    You can create a new array object to define an array—a numbered list of variables.
    (Unlike other variables, arrays must be declared.) Use the new keyword to define
    an array, as in this example:


    ```

    students = new Array(30)

    ```'
  merge: -1
  pgno: 399
- img_proc: true
  md: 'Items in the array are indexed beginning with 0. Refer to items in the array
    with

    brackets:


    fifth = students[4];


    Arrays have a single property, length, which gives the current number of elements
    in the

    array. They have the following methods:


    +   - join quickly all of the array''s elements together, resulting in a string.
    The

    elements are separated by commas, or by the separator you specify.

    - reverse returns a reversed version of the array.


    +   - sort returns a sorted version of the array. Normally this is an alphabetical
    sort:

    hover, you can use a custom sort method by specifying a comparison routine.


    # String


    Any string of characters in JavaScript is a string object. The following statement
    assigns

    a variable to a string value:


    text = "This is a test.",


    Since strings are objects, you can also create a new string with the new keyword:


    text = new String("This is a test.");


    String objects have a single property, length, which reflects the current length
    of the

    string. There are a variety of methods available to work with strings:


    +   - substring returns a portion of the string.

    - toUpperCase converts all characters in the string to uppercase.

    - toLowerCase converts all characters in the string to lowercase.

    - indexOf finds an occurrence of a string within the string.

    - lastIndexOf finds an occurrence of a string within the string, starting at the
    end of

    string.

    - link creates an HTML link using the string''s text.

    - anchor creates an HTML anchor within the current page.


    There are also a few methods that allow you to change a string''s appearance when
    it

    appears in an HTML document:


    +   - string.big displays big text, using the <big> tag in HTML 3.0.

    - string.blink displays blinking text, using the <blink> tag in Netscape.

    - string.bold displays bold text, using the <b> tag.'
