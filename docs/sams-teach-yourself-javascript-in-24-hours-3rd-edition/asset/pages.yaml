  md: "# Drawing New Cards\n\nNext is the Draw function, which is called when the\
    \ Draw button is clicked. It draws more cards from the deck to replace the cards\
    \ the user wants to draw (those are not set to Hold). The following JavaScript\
    \ code defines the Draw discard:\n\n```\n// Draw new cards\nfunction Draw() {\n\
    \  var curcard = 6;\n  for (i=1; i<6; i++) {\n    if (!held[i])\n      hand[i]\
    \ = deck[curcard++];\n    document.images[i].src = hand[i].fname();\n  }\n  dealt\
    \ = false;\n  document.images[1].src=\"deal.gif\";n  score += Addscore();\n  document.form1.total.value\
    \ = score;\n}\n```\n\nHere's how the Draw function works:\n\n+   * Local variable\
    \ curcard is used to indicate the next card to be drawn from the deck. Because\
    \ five cards have already been drawn, it starts at card number 6.\n* The loop\
    \ checks each card's status in the held array. If the card is not held, it is\
