  md: 'Comments allow you to include documentation within your script. This will be
    useful if someone else tries to understand the script, or even if you try to understand
    it after a long break. To include comments in a JavaScript program, begin a line
    with two slashes, as in this example:


    ```

    //this is a comment

    ```


    You can also begin a comment with two slashes in the middle of a line, which is
    useful for documenting a script. In this case, everything on the line after the
    slashes is treated as a comment and ignored by the browser. For example:


    ```

    a = a + 1; // add one to the value of a

    ```


    JavaScript also supports C-style comments, which begin with /* and end with /.
    These comments extend across more than one line, as the following example demonstrates:


    ```

    /*This script includes a variety of features, including this comment. */

    ```


    C-style comments are often used for commenting sections of code. If you have some
    lines of JavaScript that you want to temporarily take out of the picture while
    you debug a script, you can add /* at the beginning of the section and */ at the
    end.


    > Since these comments are part of JavaScript syntax, they are only valid inside
    <script> tags or within an external JavaScript file.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_60_0.png)


    # Summary


    During this hour, you''ve been introduced to several components of JavaScript
    programming and syntax: functions, objects, event handlers, and loops. You also
    learned how to use JavaScript comments to make your script easier to read.


    You have now reached the end of Part I of this book and should have a general
    idea of what JavaScript''s about. In Part II, you''ll learn more about JavaScript''s
    most important components: functions, variables, strings, arrays, conditions,
    and loops.


    # Q&A


    +   I''ve heard the term object-oriented applied to languages such as C++ and
    Java. If JavaScript supports objects, is it an object-oriented language?


    +   Yes, although it might not fit some people''s strict definitions. JavaScript
    objects do not support all of the features that languages such as C++ and Java
    support.'
