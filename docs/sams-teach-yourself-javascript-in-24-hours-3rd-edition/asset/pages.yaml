  md: "# Workshop: Validating a Form\n\nJavaScript's single most useful purpose is\
    \ probably validating forms. This means using a script to verify that the information\
    \ entered is valid—for example, that no fields are blank and that the data is\
    \ in the right format.\n\nYou can use JavaScript to validate a form whether it's\
    \ submitted by email or to a CGI script, or is simply used by a script. Listing\
    \ 12.3 is a version of the name and address form that includes validation.\n\n\
    +   Listing 12.3 A form with a validation script\n\n```\n<html>\n<head>\n<title>Form\
    \ Example</title>\n<script LANGUAGE=\"JavaScript\" type=\"text/javascript\">\n\
    function validate() {\n  if (document.form.name.value.length < 1) {\n    alert(\"\
    Please enter your full name.\");\n    return false;\n  }\n  if (document.form.address.value.length\
    \ < 3) {\n    alert(\"Please enter your address.\");\n    return false;\n  }\n\
    \  if (document.form.phone.value.length < 3) {\n    alert(\"Please enter your\
    \ phone number.\");\n    return false;\n  }\n  return true;\n}\n</script>\n</head>\n\
    <body>\n<h1>Form Example</h1>\n<p>Enter the following information. When you press\
    \ the Submit button, the data you entered will be validated, then sent by email.</p>\n\
    <form name=\"form1\" action=\"mailto:user@host.com\" enctype=\"text/plain\" method=\"\
    POST\" onsubmit=\"validate();\">\n<p>Name:<br> <input TYPE=\"TEXT\" SIZE=\"20\"\
    \ NAME=\"yourname\"></p>\n<p>Address:<br> <input TYPE=\"TEXT\" SIZE=\"30\" NAME=\"\
    address\"></p>\n<p>Phone:<br> <input TYPE=\"TEXT\" SIZE=\"15\" NAME=\"phone\"\
    ></p>\n<p><input TYPE=\"SUBMIT\" VALUE=\"Submit\"></p>\n</form>\n</body>\n</html>\n\
    ```"
