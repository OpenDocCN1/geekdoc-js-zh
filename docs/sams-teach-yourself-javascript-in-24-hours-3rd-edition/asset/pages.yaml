  md: '# Using Keyboard Events


    Prior to the release of Netscape 4.0, JavaScript programs couldn''t detect keyboard
    actions—just mouse actions. This made it difficult to create some types of programs
    in JavaScript. For example, games were difficult to play using Go Left and Go
    Right-buttons.


    Thankfully, JavaScript 1.2 and later can detect keyboard actions. The main event
    handler for this purpose is keyDown, which occurs when a key is pressed, or released
    held down. With mouse buttons, you can detect the down and up parts of the keyboard
    with the keyDown and keyUp event handlers.


    Of course, you may find it useful to know which key the user pressed. You can
    find this out with the event object, which is sent to your event occurs. In Netscape,
    the event..which property stores the ASCII character code for the key that was
    pressed. In Internet Explorer, event.keyCode serves the same purpose.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_160_0.png)


    ASCII (American Standard Code for Information Interchange) is the standard numeric
    code used by most computers to represent characters. It assigns the numbers 0-128
    to various characters—for example, the capital letters A through Z are ASCII values
    65 to 90.


    # Displaying Typed Characters


    If you''d rather deal with actual characters than key codes, you can use the from
    string method to convert them. This method converts a numeric ASCII code to its
    corresponding string. For example, the following statement converts Netscape''s
    event.which property to a character and stores it in the key variable:


    ```

    Key = String.fromChar(event.which);

    ```


    Since Internet Explorer and Netscape have different ways of returning the key
    code, displaying keys browser-independently is a bit harder. However, you can
    create a script that displays keys for either browser. The following function
    will display each key in the status line:'
