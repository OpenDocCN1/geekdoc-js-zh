  md: '# Using Dynamic HTML (DHTML)


    Suppose you have created a layer with the following <div> tags:


    <div id="layer1" STYLE="position:absolute; left:100; top:100">

    <p>This is the content of the layer.</p>

    </div>


    To move this layer up or down the page using JavaScript, you can change its style.top
    attribute. For example, the following statements move the layer 100 pixels down
    from its original position:


    ```

    var obj = document.getElementById("layer1");

    obj.style.top=200;

    ```


    The document.getElementById method returns the object corresponding to the layer''s
    <div> tag, and the second statement sets the object''s top positioning property
    to 200. As you learned in the previous hour, you can combine these two statements:


    document.getElementById("layer1").style.top = 200;


    This sets the style.top property for the layer without assigning a variable to
    the layer''s object. You will use this technique to create an animation in this
    hour''s Workshop section.


    > Some CSS properties, such as text-indent and border-color, may have hyphens
    in their names. This would cause JavaScript errors unless you combine the hyphenated
    sections and use a capital letter when working with them in JavaScript: textIndent
    and borderColor.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_303_0.png)


    # Dealing with Old Browsers


    While the new DOM makes it easy to manipulate styles, positions, and even portions
    of a document, you should be aware that these features are only standardized and
    supported in Internet Explorer 5.0 and later, Netscape 6.0 and later.


    Furthermore, since the DOM features are new, you may run into differences in the
    ways the browsers implement these features. You should test all DOM-dependent
    scripts on both the latest Netscape and Internet Explorer browsers before publishing
    it.


    Equally importantly, you should be aware that many users are using old browsers
    and will be for some time. Since Netscape 4.0 and Internet Explorer 4.0 support
    many of these features, although in non-standard ways, you can use browser detection
    to support these browsers as well as newer DOM-compliant browsers.'
