  md: 'You’ll use both mouseOver and onMouseOut handlers in the “Workshop: Adding
    Link Descriptions to a Web Page” section at the end of this hour.


    > One of the most common uses for the mouseOver and mouseOut handlers is to create
    rollovers—images that change when the mouse moves over them. You’ll learn how
    to create these in Hour 13, “Using Graphics and Animation.",


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_158_0.png)


    # Using the mouseMove


    The mouseMove event occurs any time the mouse pointer moves. As you might imagine,
    this happens quite often—the event can trigger hundreds of times as the mouse
    pointer moves across a page.


    Because the large number of generated events, browsers don’t support mouseMove
    event by default. To enable it for a page, you need to use event capturing. This
    is similar to the dynamic events technique you learned earlier in your hour, but
    requires an extra step for Netscape browsers.


    The basic syntax to support this event, for both browsers, is to set a function
    as the mouseMove handler for the document or another object. For example, this
    statement sets the mouseMove handler for the document to a function called MoveHere,
    which must be defined in the same page:


    ```

    document.onMouseMove=MoveHere;

    ```


    Additionally, Netscape requires that you specifically enable the event using the
    document.captureEvents method:


    ```

    document.captureEvents(Event.MOUSEMOVE);

    ```


    # Ups and Downs


    You can also use events to detect when the mouse button is clicked. The basic
    event handler for this is onClick. This handler is called when the mouse button
    is clicked while positioned over the appropriate object.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_158_1.png)


    The object in this case can be a link. It can also be a form element. You’ll learn
    more about forms in Hour 12, “Getting Data with Forms.",'
