- img_proc: true
  md: '—they include such events as When the mouse button clicks and When this page
    is finished loading. Nevertheless, they''re a very useful part of JavaScript.


    Many JavaScript events (such as mouse clicks) are caused by the user. Rather than
    doing things in a set order, your script can respond to the user''s actions. Other
    events don''t involve the user directly—for example, an event is triggered when
    an HTML document finishes loading.


    Event handlers are associated with particular browser objects, and you specify
    the event handler in the tag that defines the object. For example, images and
    text links have an event, onMouse, that happens when the mouse pointer moves over
    the object. Here is a typical HTML tag with onmouseover="highlight();">


    ```

    <img SRC="button.gif" onmouseover="highlight();">

    ```


    You specify the event handler as an attribute to the HTML tag and include the
    JavaScript statement to handle the event within the quotation marks. This is an
    ideal use for functions, since function names are short and to the point can refer
    to a whole series of statements.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_58_0.png)


    > You''ll learn more about event handlers in Hour 10, “Responding to Events."


    # Conditional Statements


    While event handlers notify your script when something happens, you may want to
    check certain conditions yourself. For example, did the user enter a valid email
    address?


    JavaScript supports **conditional statements**, which allow you to answer questions
    like this. A typical conditional uses the if statement, as in this example:


    ```

    if (count==1) alert("countdown has reached 1.");

    ```


    This compares the variable count with the constant 1, and displays an alert message
    to the user if they are the same. You will use conditional statements like this
    in most of your scripts.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_58_1.png)


    > You''ll learn more about conditionals in Hour 6, “Testing and Comparing Values."'
