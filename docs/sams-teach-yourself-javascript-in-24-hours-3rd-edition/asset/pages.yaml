    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_321_0.png)


    # Summary


    In this hour, you learned some of the advanced features of the new W3C DOM (Document
    Object Model). You learned the functions and properties you can use to manage
    DOM objects, and used example scripts to hide and show elements within a page,
    modify text, and add text. Finally, you created a scrolling message using DOM
    features.


    Congratulations—you reached the end of Part V! Now that you''ve learned all about
    JavaScript and HTML, the final hours will allow you to use this knowledge to create
    some complete examples. You''ll begin in Hour 21 with a JavaScript-enhanced Web
    page.


    20'
