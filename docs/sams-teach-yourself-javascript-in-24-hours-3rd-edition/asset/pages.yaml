    # Workshop: Creating a Simple Animation


    Although rollovers are undoubtedly the most practical use for JavaScript''s dynamic
    images, you can also use the feature for simple animations. JavaScript isn''t
    always the best way to do animations, but it''s very useful in cases where you
    want to control the animation from a script.


    > If you just want an animated image that repeats over and over, an animated GIF
    image is often a better choice. Many graphic software packages at automate the
    process of creating animated GIF images.


    As a simple example of JavaScript animation, you will now create a script that
    moves an animated character across the browser display.


    # Creating the Images


    The first step in creating a JavaScript animation is to create the images themselves.
    For this example, you will make an animated mouse move across the page. (You could
    use anything, of course, but this mouse is the only thing I can draw.)'
