    # Summary


    In this hour, you learned how to use JavaScript to work with graphics. JavaScript
    can work with image maps, and can be used to create image rollovers and simple
    animations.


    You''ve reached the end of Part III! In Part IV, you''ll learn more techniques
    that are helpful in creating scripts for the Web. In the next hour, you''ll learn
    how to detect browser versions and create scripts that work on multiple browsers.


    # Q&A


    +   I created an onMouseOver event handler for rollovers, and it works in Internet
    Explorer but not Netscape. What''s wrong?


    +   This is probably because you used the onMouseùover handler in the &lt;img&gt;
    tag. This is-it is supported only by Internet Explorer. For Netscape, you will
    need to make the image a link and use event handlers in the &lt;a&gt; tag. (This
    will also work in Internet Explorer.)


    +   Can I use rollovers in an image map?


    +   No, you''ll need to replace the entire map image to do this. Usually, it''s
    easier and faster to divide the map image into a number of sections and use those
    as the rollovers.'
