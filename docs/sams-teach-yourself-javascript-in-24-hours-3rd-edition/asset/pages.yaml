  md: '# Creating Cross-Browser Scripts


    Figure 14.2.

    Internet Explorer displays the browser information script.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_227_0.png)


    Believe it or not, Microsoft did have a good reason for this. At the height of
    the browser wars, by the time Netscape 3.0 and IE 3.0 came out, it was becoming
    common to see “Netscape only” pages. Some Webmasters who used features in frames
    and JavaScript set their servers to turn away browsers without Mozilla string.
    The problem was that with this that most of the features were also supported by
    Internet Explorer.


    Microsoft solved this problem in IE 4.0 by making IE’s user agent read Mozilla,
    with the word compatible in parentheses. This allows IE users to view those pages,
    but still includes details to tell Web servers which browser was in.


    > Many Web servers keep statistics about which browsers people use to access them.
    When Microsoft changed IE’s user agent string, many of the statistics programs
    were not aware of the change. As a result, they counted a visit by IE as a visit
    by Netscape. Ironically, Microsoft’s move to make their browser more compatible
    caused Netscape’s market share statistics to improve, at least for a while.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_227_1.png)'
