  md: "# Using for Loops\n\nThe keyword is the first tool to consider for creating\
    \ loops. A for loop typically uses a variable (called a *counter* or *index*)\
    \ to keep track of how many times the loop has executed, and stops when the counter\
    \ reaches a certain number. A basic for statement looks like this:\n\n```\nfor\
    \ (var = 1; var < 10; var++) {\n```\n\nThere are three parameters to the for loop,\
    \ separated by semicolons:\n\n+   * The first parameter (*var = n* in the example)\
    \ specifies a variable and assigns an initial value to it. This is called the\
    \ *initial expression* because it sets up the initial state for the loop.\n* The\
    \ second parameter (*var < 10* in the example) is a condition that must remain\
    \ true to keep the loop running. This is called the *condition* of the loop.\n\
    * The third parameter (*var++ in the example) is a statement that executes with\
    \ each iteration of the loop. This is called the *increment expression* because\
    \ it is usually used to increment the counter.\n\nAfter the three parameters are\
    \ specified, a left brace ({) is used to signal the beginning of a block. A right\
    \ brace}) is used at the end of the block. All the statements between the braces\
    \ will be executed with each iteration of the loop.\n\nThe parameters for a for\
    \ loop may sound a bit confusing, but once you're used to it, you'll use loops\
    \ frequently. A simple example of this type of loop is shown below:\n\n```\nfor\
    \ (i=0; i<10; i++) {\n  document.write(\"This is line \" + + i + \"<br>\");\n\
    }\n```\n\nThese statements define a loop that uses the variable i, initializes\
    \ it with the value of zero, and loops as long as the value of i is less than\
    \ 10. The increment expression, i++, adds one to the value of i with each iteration\
    \ of the loop.\n\nWhen a loop includes only a single statement between the braces,\
    \ in this example, you can omit the braces if you wish. The following statement\
    \ defines the same loop without braces:\n\n```\nfor (i=0;i<10;i++)\n  document.write(\"\
    This is line \" + i + \"<br>\");\n```\n\n> It's a good style convention to use\
    \ braces with all loops whether they contain one statement or many. This makes\
    \ it easy to add statements to the loop later without causing syntax errors."
