  md: '# Working with Style Sheets


    structures. While style sheets still won''t make your document 100% identical
    on all browsers and platforms, it is certainly a step in the right direction.


    Let''s look at a real-world example. If you''re browsing the Web with a CSS-supported
    browser and come across a page that use CSS, you''ll see the document exactly
    as it was intended. You can also turn off your browser''s support for style sheets
    if you''d rather view all the pages in the same consistent.


    # Defining and Using CSS Styles


    You can define a CSS style sheet using the <style> tag. The opening <style> tag
    specifies the type of style sheet—CSS is the only valid type—and ends a list of
    styles to apply to the document. The <style> tag ends the style sheet. Here''s
    a simple example:


    ```

    <style TYPE="text/css">

    H1 {color: blue;}

    </style>

    ```


    Since the style sheet definition itself doesn''t create any output on the page,
    you should place the <style> tags in the <head> section of the HTML document.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_281_0.png)


    > You can only use style rules within the <style> tags. No other HTML tags are
    valid within a style sheet.


    # Creating Rules


    Each element within the <style> tag is called a rule. To create a rule, you specify
    the HTML elements that it will affect, as well as a list of properties and values
    that control the appearance of these elements. We''ll look at the properties in
    the next section.


    As a simple example, the following style sheet contains a single rule—All Level
    1 headings are blue:


    ```

    <style TYPE="text/css">

    H1 {color: blue;}

    </style>

    ```


    Each rule includes three components:


    +   * A selector (H1 in the example) describing which HTML tags will be affected

    * One or more property names (color in the example)

    * A value for each property name (blue in the example)'
