  md: '# Understanding Event Handlers


    As you learned in Hour 3, “How JavaScript Programs Work,” JavaScript programs
    don’t have to execute in order. They can also detect events and react to them.
    Events are things that happen to the browser—the user clicking a button, the mouse
    pointer moving, or a Web page or image loading from the server.


    A wide variety of events allow your scripts to respond to the mouse, the keyboard,
    and other circumstances. Events are the key method JavaScript uses to make Web
    documents interactive.


    The script that you use to detect and respond to an event is called an event handler.
    Event handlers are among the most powerful features of JavaScript. Luckily, they’re
    also among the easiest features to learn and use—often, a useful event handler
    requires only a single statement.


    # Objects and Events


    As you learned in Hour 9, “Working with the Document Object Model,” JavaScript
    uses a set of objects to store information about the various parts of a Web page–buttons,
    links, images, windows, and so on. An event can often happen in more than one
    place (for example, the user could click any one of the links on the page), each
    event is associated with an object.


    Each event has a name. For example, the onerror event occurs when the mouse pointer
    moves over an object on the page. When the pointer moves over a particular link,
    the onerror event is sent to that link’s event, if it has one.


    To define an event handler, add the word to the beginning of the event’s name.
    For example, the onerror handler is called when the mouse moves over a link. To
    define the event handler, you add it to that particular link <a> HTML tag.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_154_0.png)


    > The strange capitalization on the ऑनर्स keyword. This is the standard notation
    for event handlers. The on is always lowercase, and each word in the name is capitalized.


    # Creating an Event Handler


    You don’t need the <script> tag to define an event handler. Instead, you add an
    event handler attribute to an individual HTML tag. For example, here is a link
    that includes an onmouseover event handler:'
