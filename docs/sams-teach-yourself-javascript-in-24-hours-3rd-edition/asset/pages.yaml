- img_proc: true
  md: '# Understanding JavaScript


    # LISTING 1.2 Continued


    ```

    &lt;head&gt;

    &lt;body&gt;

    &lt;h1&gt;The American Eggplant Society&lt;/h1&gt;

    &lt;p&gt;Welcome to our Web page. Unfortunately,

    it''s still under construction.

    We last worked on it this date:&lt;/p&gt;

    &lt;script LANGUAGE="JavaScript" type="text/javascript"&gt;

    document.write(document.lastModified);

    &lt;/script&gt;

    &lt;/body&gt;

    &lt;/html&gt;

    ```


    JavaScript''s document.write statement, which you''ll learn more about later,
    sends out as part of the Web document. In this case, it displays the modification
    date of the document.


    > Notice that the <script> tag in Listing 1.2 includes the parameter type="text/javascript".
    This specifies the scripting language to the browser. You can also specify a JavaScript
    version, as you''ll learn later in this hour.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_31_0.png)


    In this example, we placed the script within the body of the HTML document. There
    are actually four places where you might use scripts:


    +   - In the body of the page. In this case, the script''s output is displayed
    as part of the HTML document when the browser loads the page.

    - In the header of the page, between the <head> tags. Scripts in the header can''t
    create output within the HTML document, but can be referred to by other scripts.
    The header is often used for functions—groups of JavaScript statements that can
    be used as a single unit. You will learn more about functions in Hour 3, "How
    JavaScript Works."

    - In an HTML tag, such as <body> or <form>. This is called an event handler and
    allows the script to work with HTML elements. When using JavaScript in Event handlers,
    you don''t need to use the <script> tag. You''ll learn more about event handlers
    in Hour 3.

    - In a separate file entirely. JavaScript supports the use of files with the .js
    extension containing scripts; these can be included by specifying a file in the
    <script> tag.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Using External JavaScript files


    When you create more complicated scripts, you''ll quickly find your HTML documents
    become large and confusing. To avoid this, you can use one or more external JavaScript
    files. These are the files with a .js extension that contain JavaScript statements.


    External scripts are supported by Netscape Navigator 3.0 or later and Internet
    Explorer 4.0 or later. To use an external script, specify its filename in the
    <script> tag:

    ```html

    <script language="JavaScript" type="text/javascript" src="filename.js">\n</script>

    ```


    Since you''ll be placing the JavaScript statements in a separate file, you don''t
    need anything between the opening and closing <script> tags—in fact, between them
    will be ignored by the browser.


    You can create the .js file using a text editor. It should contain one or more
    JavaScript commands, and only JavaScript—don''t include <script> tags, HTML tags,
    or HTML comments. Save the .js file in the same directory as the HTML documents
    that refer to it.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_32_0.png)


    | External JavaScript files have a distinct advantage: you can link to the .js
    file from two or more HTML documents. Since the browser stores this file in its
    cache, this can reduce the time it takes your Web pages to display. |


    # Browsers and JavaScript


    Like HTML, JavaScript requires a browser to be displayed, and different browsers
    may display it differently. Unlike HTML, the results of a browser incompatibility
    are more drastic: Rather than simply displaying your text incorrectly, the script
    may not execute at all, may display an error message, or may even crash the browser.


    We''ll take a quick look at how the different browsers—and different versions
    of the same browser—treat JavaScript in the following sections.


    # Netscape and Internet Explorer


    Today''s Web is dominated by two popular Web browsers: Netscape and Microsoft
    Internet Explorer. Netscape spent a few years being the more popular browser,
    but is now behind Internet Explorer in popularity; however, both are common enough
    that you should try to support them with your pages.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Understanding JavaScript


    Although JavaScript 1.5, the latest version, is officially supported only by Netscape
    Internet Explorer 5 and 6, the majority of examples throughout this book will
    run on Netscape 4.5 or later or Internet Explorer 4.0 or later. Listings that
    require a more recent browser will be labeled.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_33_0.png)


    # Versions of JavaScript


    The JavaScript language has evolved since its original release in Netscape 2.0.
    There have been several versions of JavaScript:


    +   - JavaScript 1.0, the original version, is supported by Netscape 2.0 and Internet
    Explorer 3.0.

    - JavaScript 1.1 is supported by Netscape 3.0 and mostly supported by Internet
    Explorer 4.0.

    - JavaScript 1.2 is supported by Netscape 4.0, and partially supported by Internet
    Explorer 4.0.

    - JavaScript 1.3 is supported by Netscape 4.5 and Internet Explorer 5.0.

    - JavaScript 1.5 is supported by Netscape 6.0 and Internet Explorer 5.5 and later.


    Each of these versions is an improvement over the previous version and includes
    a number of features. With rare exception, browsers that support the new version
    will also support scripts written for earlier versions.


    ECMA, the European Computer Manufacturing Association, has finalized the ECMA-262
    specification for ECMAScript, a standardized version of JavaScript. JavaScript
    1.3 follows the ECMA-262 standard, and JavaScript 1.5 follows ECMA-262 revision
    3.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_33_1.png)


    > Another language you may hear of JavaScript. This is how Microsoft refers to
    their implementation of JavaScript, which is generally compatible with the Netscape
    version.


    Netscape is also working with ECMA on JavaScript 2.0, a future version that will
    correspond with the fourth edition of the ECMAScript standard. JavaScript 2.0
    will improve upon earlier versions with a more modular approach, better object
    support, and features to make JavaScript useful as a general-purpose scripting
    language as well as a Web language.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Specifying JavaScript Versions


    As mentioned earlier in this hour, you can specify a version of JavaScript in
    the

    <script> tag. For example, this tag specifies JavaScript version 1.3:


    ```

    <script language="JavaScript1.3" type="text/javascript1.3">

    ```


    There are two ways of specifying the version number. The old method uses the language

    attribute, and the new method recommended by the HTML 4.0 specification uses the

    type attribute. To maintain compatibility with older browsers, you can use both
    attrib-

    utes.


    When you specify a version number, this allows your script to execute only if
    the

    browser supports the version you specified or a later version.


    When the <script> tag doesn''t specify a version number, the browser assumes that
    the

    script is compatible with JavaScript 1.0. Since the core of the JavaScript language
    is

    unchanged version 1.0, this is for most scripts.


    > In most cases, you shouldn''t specify a JavaScript version at all. This allows

    your script to run on all of the browsers that support JavaScript. You should

    only specify a particular version when your use scripts features that are not

    available in earlier versions.


    # JavaScript Beyond the Browser


    While JavaScript programs traditionally run within a Web browser, and Web-based

    JavaScript is the focus of this book, JavaScript is becoming increasingly popular
    in other

    applications. Here are a few examples:


    +   - Macromedia Dreamweaver, used for Web applications and multimedia, can be

    extxtended with JavaScript.


    +   - Several server-side versions of JavaScript are available. These run within
    a Web

    server than a browser.


    +   - Microsoft''s Windows Scripting Host (WSH) supports JavaScript, Microsoft''s
    imple-

    mentation of JavaScript, as a general-purpose scripting language for Windows.

    Unfortunately, the most popular applications developed for WSH so far have seen

    enviruses.


    +   - Microsoft''s Common Language Runtime (CLR), part of the .NET framework,
    sup-

    ports JavaScript.'
