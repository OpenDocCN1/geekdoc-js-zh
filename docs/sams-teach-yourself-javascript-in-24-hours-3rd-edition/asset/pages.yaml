  md: "# Creating a Dynamic Site Map\n\nOne of the most popular uses for DHTML is\
    \ to create dynamic, tree-like navigation maps for sites, with items that can\
    \ be expanded and collapsed. You can create a dynamic site map easily using <div>\
    \ tags to define layers and a simple script.\n\n# Defining the Layers\n\nEach\
    \ category in the site map will be defined with a link to the Toggle function\
    \ youll define. The linked text is a symbol, [+] to indicate that the item can\
    \ be expanded or [-] to indicate that it can be collapsed.\n\n```\n<a id=\"support\"\
    \ href=\"javascript:Toggle('support');\">[+]</a><br>\nSupport<br>\n<div id=\"\
    support\" style=\"display:none; margin-left:2em\">\n<a href=\"forum.html\">Support\
    \ Forum</a><br>\n<a href=\"forum.html\">Contact Support</a><br>\n</div>\n```\n\
    \n# Creating the Script\n\nEach collapsible section of the site map will be defined\
    \ using a <div> tag. The Toggle function uses the style property to expand or\
    \ collapse a specific item:\n\n```\n<script language=\"javascript\" type=\"text/javascript\"\
    >\nfunction Toggle(item) {\n  obj=document.getElementById(item);\n  visible=(obj.style.display!=\"\
    none\\n  key=document.getElementById(\"x\" + item);\n  if (visible) {\n    obj.style.display=\"\
    none\";\n    key.innerHTML=\"[+\";\n  } else {\n    obj.style.display=\"block\"\
    ;\n    key.innerHTML=\"[-]\";\n  }\n}\n</script>\n```\n\nThis function uses the\
    \ visible variable to indicate whether the item is currently visible. If the object\
    \ is visible, its style property is set to collapse it, and the object’s indicator\
    \ is changed to a [+] symbol. If the object is currently hidden, it is displayed\
    \ and the indicator is changed to [-].\n\n# Creating the HTML Document\n\nTo use\
    \ this function to create the dynamic site map, you can include the script in\
    \ an HTML document and use <div> tags to define the map sections. Listing 23.1\
    \ shows the complete HTML document."
