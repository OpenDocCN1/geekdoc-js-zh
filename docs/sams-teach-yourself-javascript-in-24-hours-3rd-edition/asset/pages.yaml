  md: '# What Is an Object?


    As you know from earlier hours of this book, objects allow you to combine several
    kinds of data (properties) and functions to act on the data (methods) into a single,
    convenient package. In this hour, you''ll learn more about the built-in Math and
    Date objects—but first, here''s a quick overview of how the objects work in JavaScript.


    # Creating Objects


    Each object has a special function, called a *constructor*, that''s used to create
    objects. For example, JavaScript includes a built-in function *String* to create
    *String* objects. That''s why you can create a variable like this:


    ```

    idname=new String("Figby");

    ```


    The new keyword tells JavaScript to create a new object—or in technical terms,
    a new instance of the String. This particular instance will have the value Figby
    and be stored in the variable myname.


    You can use the same syntax to create String objects, Date objects, Array objects,
    and even your own custom objects. (The Math object is an exception, which you''ll
    learn later in this hour.)


    > If you''re dying to create custom objects right away, you should probably get
    some sleep. If you''re serious, you can skip to Hour 15, "Creating Custom Objects."


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_126_0.png)


    # Object Properties and Values


    Each object can have one or more *properties*, or attributes. Each property is
    basically a variable in itself, and is contained within the object. Each property
    can be assigned a value. You can use properties to store any type of data a variable
    can store.


    You''ve already used a few object properties, such as the length of strings and
    arrays. To refer to a property, you use the object''s name, a period, and the
