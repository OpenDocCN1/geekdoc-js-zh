  md: '# Why don''t I get a friendly error message if I accidentally use = instead
    of ==?


    In some cases, this will result in an error. However, the incorrect version often
    appears to be a correct statement. For example, in the statement if (a=1), the
    variable a is assigned the value 1. The if statement is considered true, and the
    value of a is lost.


    # Why does the script in Listing 6.1 specify JavaScript 1.2?


    The switch statement was added in JavaScript 1.2. Specifying version prevents
    older browsers from attempting to execute the script and becoming confused.


    # Quiz


    Test your knowledge of conditional statements in JavaScript by answering the following
    questions.


    # Questions


    +   1. What does the statement if (fig==1) do?

    a. Assigns the variable fig the value 1.

    b. Displays an error message because the names of fruits cannot be used as variable
    names.

    c. Checks fig for a value of 1 and performs an action if it matches.


    +   2. Which of the following operators means “is not equal to” in JavaScript?

    a. !

    b. !==

    c. <>


    +   3. What does the switch statement do?

    a. Tests a variable for a number of different values.

    b. Turns a variable on or off.

    c. Makes ordinary statements longer and more confusing.


    # Answers


    +   1. This statement checks the fig variable and performs an action if its value
    is 1.

    2. The != operator means is not equal to.

    3. The switch statement can test the same variable or expression for a number
    of different values.'
