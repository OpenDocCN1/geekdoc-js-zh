- img_proc: true
  md: "Normally, when you embed a sound, it plays as soon as the page loads. You don't\
    \ want all 13 notes to play at once (and that wouldn't work anyway), so use the\
    \ AUTOSTART=false parameter to prevent the sounds from playing.\n\nAlso include\
    \ the HIDDEN=true parameter to prevent the browser from displaying cute little\
    \ panels for each of the sounds. The `&lt;embed&gt;` tag for a single note (the\
    \ bottom C) would look like this:\n\n```\n<img SRC=\"c.wav\" HIDDEN=true AUTOSTART=false>\n\
    ```\n\nThe HTML document will include a tag like this for each sound, the 13 sounds\
    \ will be loaded (but not played) immediately. This will prevent the browser from\
    \ having to communicate with the server to load a file when you click on a piano\
    \ key.\n\n# Displaying the Keyboard\n\nFor the keyboard display, I created two\
    \ GIF graphics: a white key and a black key. The HTML document simply needs to\
    \ include whitekey.gif and blackkey.gif in the right combination to display the\
    \ 13 keys.\n\nFor a better-looking keyboard, you could use an image map. The secret\
    \ in this workshop sticks to linked graphics for simplicity; see this book's Web\
    \ for a fancier version. Here's the HTML link tag for a single piano key:\n\n\
    ```\n<a href=\"#\" onclick=\"playnote();\">\n<img SRC=\"whitekey.gif\" ALIGN=\"\
    TOP\"></a>\n```\n\nThis displays the white key graphic. It is linked with \"#\"\
    \ as a target (which will prevent the browser from loading a different page),\
    \ and the onClick event handler runs a JavaScript function to play the note.\n\
    \n# Playing the Sounds\n\nThe playnote function handles the playing of the appropriate\
    \ sound. It accepts a parameter, a number from 0 to 12 representing one of the\
    \ embedded sounds) and uses the method to play the sound. Here's the function:\n\
    \n```\nfunction playnote(note) {\n  document.embedded[note].play();\n}\n```\n\n\
    While it's not used by this example, you can also use the stop() method of sound\
    \ objects to stop a sound that is currently playing."
