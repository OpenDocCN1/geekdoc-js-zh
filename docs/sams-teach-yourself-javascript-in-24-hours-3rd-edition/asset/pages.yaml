  md: '# HOUR 16


    # Working with Sounds and Plug-Ins


    In the last two hours, you learned some of JavaScript''s advanced features. In
    this hour, you''ll learn another advanced feature: using JavaScript with plug-ins.


    Plug-ins are browser add-ons that allow you to use additional types of information
    in the browser: sounds, videos, and so forth. You can use JavaScript to control
    the behavior of these plug-ins, allowing your scripts to just do about anything.


    Hour 16 covers the following topics:


    +   * How JavaScript works with plug-ins

    * Detecting plug-ins with JavaScript

    * Checking available MIME types

    * Scripting objects in plug-ins

    * Creating an application using sounds


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_247_0.png)'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Introducing Plug-Ins


    Plug-ins were introduced by Netscape Navigator 3.0. Rather than adding support
    directly to the browser for media types such as formatted text, video, and audio,
    Netscape created a modular architecture that allows programmers to write their
    own browser add-ons for these features.


    There are now hundreds of plug-ins available for both Netscape and Internet Explorer.
    Here are a few of the most:


    +   - Macromedia''s ShockWave and Flash plug-ins supports animation and video.

    - Adobe''s Acrobat plug-in supports precisely formatted, cross-platform text.

    - RealPlayer''s streaming plug-in supports audio and video.

    - Headspace''s Beatnik plug-in supports music in Web Pages.


    Netscape and Internet Explorer use different plug-ins and usually require different
    versions of the plug-in. Additionally, some plug-ins are available only for one
    platform, such as Windows or Macintosh.


    Because Netscape''s LiveAudio plug-in and Microsoft''s Windows Media Player are
    included with Netscape 4.x and Internet Explorer, you can assume that much of
    your Web page''s audience will have a plug-in for playing sounds. The workshop
    section of this hour will use these plug-ins to play sounds.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_248_0.png)


    All of the examples in this hour use plug-ins that are available for both Microsoft
    and Netscape, but the plug-in detection examples require Netscape 3.0 or later.
    Netscape 6 does not currently include a plug-in for playing sounds.


    # Using the <embed> Tag


    You can include a file that uses a plug-in in a Web document with the <embed>
    tag. This tag specifies the filename for the content and any parameters required
    by the plug-in. Here is a simple example:


    ```

    <embed SRC="sound.wav" HIDDEN=true AUTOSTART=false LOOP=false>

    ```'
  merge: -1
