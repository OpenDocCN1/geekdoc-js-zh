  md: "+   One or more case statements. Each of these statements specifies a value\
    \ to compare with the value specified in the switch statement. If the values match,\
    \ the statements after the case statement are executed. Otherwise, the next case\
    \ is tried.\n\n+   The break statement is used to end each case. This skips to\
    \ the end of the switch. If break is not included, statements in multiple cases\
    \ might be executed whether they match or not.\n\n+   Optionally, the default\
    \ case can be included and followed by one or more statements that are executed\
    \ if none of the other cases were matched.\n\n![](img/3ba9ce11a08220fe5348f94ec18e83ff_107_0.png)\n\
    \n> You can use multiple statements after each case statement within the switch\
    \ structure. You don't need to enclose them in braces. If the case matches, the\
    \ JavaScript interpreter executes statements until it encounters a break or the\
    \ next case.\n\n# # Workshop: Evaluating a User Response\n\nAs a practical example\
    \ of the switch statement, you can now create a Web page that asks the user a\
    \ question, and then evaluates the user's response to determine what to do next.\
    \ Specifically, you'll ask the user for a keyword that represents a Web page.\n\
    \nIf the keyword matches one of those in your script, the user will be sent to\
    \ the appropriate page. If the response doesn't match one of the predefined keywords,\
    \ the user will be sent to a default page.\n\nYour script starts prompting the\
    \ user with the prompt function. To use this function, you include text that prompts\
    \ the user as a parameter and assign the returned value to a variable. Here's\
    \ the prompt statement:\n\n```\nwhere = prompt(\"where do you want to go today?\"\
    );\n```\n\nNext, use a switch statement and several case statements to evaluate\
    \ the response:\n\n```\nswitch (where) {\n  case \"Netscape\" :\n    window.location=\"\
    http://www.netscape.com/\"\n    break;\n  case \"Microsoft\" :\n    window.location=\"\
    http://www.microsoft.com/\"\n    break;\n  case \"Yahoo\" :\n    window.location=\"\
    http://www.yahoo.com/\"\n    break;\n```"
