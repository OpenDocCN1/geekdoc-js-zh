  md: '> You learned the techniques used in browser detection in Hour 14, "Creating
    Cross-Browser Scripts."


    In particular, the layer positioning techniques you learned in this hour can be
    accomplished equally well in Netscape 4.0 or Internet Explorer 4.0. To begin,
    with both of these browsers support the CSS method of defining a layer with a
    <div> tag. These statements create the same layer in both 4.0 and DOM-compliant
    browsers:


    ```

    <div id="layer1" STYLE="position:absolute; left:100; top:100">

    <p>This is the content of the layer.</p>

    </div>

    ```


    The difference is in the way you use JavaScript to control layer positioning.
    Here is the DOM method of changing the layer''s position to 200, as you have learned:


    ```

    var obj = document.getElementById("layer1");

    obj.style.top=200;

    ```


    Internet Explorer 4.0 uses a similar syntax, but stores all objects under the
    document object rather than in a tree structure. Here is IE4''s method of performing
    the same position:


    ```

    var obj=document.all.layer1;

    obj.style.top=200;

    ```


    Last not least, Netscape 4.0 uses the layers array to store information about
    layer positions. Here is the Netscape 4.0 method of changing the layer''s position:


    ```

    var obj=document.layers[''layer1''];

    obj.top=200;

    ```


    As you can see, the new DOM will make multiple-browser compatibility much easier
    when the latest browsers complete replace older ones. The meantime is to support
    older browsers if it''s possible and practical for your pages.


    # Using Feature Sensing


    In Hour 14, you learned how to detect the browser in using the navigator object.
    While you could use this technique to support the 4.0 browsers for DHTML, using
    feature sensing makes your script easier to write and meant be compatible with
    future browsers.


    In feature sensing, you detect whether an object or method exists rather than
    detecting the browser version. For example, this detects whether Netscape''s document.layers
    object exists:


    ```

    if (document.layers) alert("layers!");

    ```'
