  md: "# Setting Object Position and Size\n\nYou can use various properties in the\
    \ style attribute of the `<div>` tag when you define a layer to set its position,\
    \ visibility, and other features. The following properties control the object's\
    \ position and size:\n\n+   - position is the main positioning attribute and can\
    \ affect the properties below. The position property can have one of three values:\n\
    \  - static defines items that are laid out in normal HTML fashion, and cannot\
    \ be moved. This is the default.\n  - absolute specifies that an item will be\
    \ positioned using coordinates you specify.\n  - relative defines an item that\
    \ is offset a certain amount from the static position, where the element would\
    \ normally been laid out within the HTML page.\n- left and top specify offsets\
    \ for the position of the item. For absolute positioning, this is relative to\
    \ the main browser window or a containing item. For relative positioning, it's\
    \ relative to the static position.\n- right and bottom are an alternate way to\
    \ specify the position of the item. You can use these when need to align the object's\
    \ right or bottom edge.\n- width and height are similar to the standard HTML width\
    \ and height attributes and specify a width and height for the item.\n- z-index\
    \ specifies how items overlap. Normally indexes start with 1 and go up with each\
    \ layer added “top” of the page. By changing this value, you can specify which\
    \ is on top.\n\n> Properties such as left and top work in pixels by default. You\
    \ can also use any of the units described in the previous hour: px, pt, ex, em,\
    \ or percentages.\n\n# Setting Overflow Properties\n\nSometimes the content inside\
    \ a layer is larger than the size of the layer can display. Two properties affect\
    \ how the layer is displayed in this case:\n\n+   - clip specifies the clipping\
    \ rectangle for an item. Only the portion of the item inside this rectangle is\
    \ displayed."
