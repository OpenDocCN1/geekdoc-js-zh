    - Browser objects that represent various components of the browser and the current
    HTML document. The alert() function you used earlier in this chapter is actually
    a method of the window object. You''ll explore these in more detail in Hour 9,
    "Working with the Document Object Model."

    - Custom objects you create yourself. For example, you could create a person object,
    as in the examples in this section. You''ll learn to use custom objects in Hour
    15, "Creating Custom Objects."


    # Handling Events


    As mentioned in Hour 1, not all scripts are located within <script> tags. You
    can also use scripts as event handlers. While this might sound like a complex
    programming term, it actually means exactly what it says: Event handlers are scripts
    that handle events.


    In real life, an event is something that happens to you. For example, the things
    you write on your calendar are events: "Dentist appointment" or "Fred''s Birthday."
    You encounter unscheduled events in your life: for example, a traffic ticket,
    an IRS audit, or an unexpected visit from relatives.


    Whether events are scheduled or unscheduled, you probably have normal ways of
    handling them. Event handlers might include things like When Fred''s birthday
    arrives, send him a present or When relatives visit unexpectedly, turn out the
    lights and pretend nobody''s home.


    Event handlers in JavaScript are similar: They tell the browser what to do when
    a certain event occurs. The events JavaScript deals with aren''t as exciting as
    the ones you deal'
