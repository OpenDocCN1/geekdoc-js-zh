    Hour 7


    # FIGURE 7.1.


    The results of the for loop example.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_116_0.png)


    The structure of the for loop in JavaScript is based on Java, which in turn is
    based on C. Although it is traditionally used to count from one number to another,
    you can just use any statement for the initialization, condition, and increment.
    However, there’s usually a better way to do other types of loops with the while
    keyword, described in the next section.


    # Using while Loops


    Another keyword for loops in JavaScript is while. Unlike for loops, while loops
    don’t necessarily use a variable to count. Instead, they execute as long as a
    condition is true. In fact, if the condition starts out as false, the statements
    do not execute at all.


    The while statement includes the condition in parentheses, and it is followed
    by a block of statements within braces, just like a for loop. Here is a simple
    while loop:


    ```

    while (total < 10) {

    ++;

    total += values[n];

    }

    ```


    This loop uses a counter, n, to iterate through the values array. Rather than
    stopping at a certain count, however, it stops when the total of the values reaches
    10.'
