    <div id="thetext" style="position:absolute;width:170;left:5;top:100">

    <p>This is the first paragraph of the scrolling message. The message is created
    with ordinary HTML.</p>

    <p>Entries within the scrolling area can use any HTML tags. They can contain <a
    href="http://www.jsworkshop.com">links</a></p>

    <p>There is no limit on the number of paragraphs that you can include here. They
    don''t even need to be formatted as paragraphs.</p>

    <ul><li>For example, you could format items using a bulleted list.</li></ul>

    <p>The scrolling ends when the last part of the scrolling text is on the screen.
    You have reached the end.</p>

    <p><b><a href="javascript:pos=100;Scroll();">Start Over</a></b></p>

    </div>

    </style>

    <body>

    </html>

    ```


    The<div> tags in this document create two layers: One, the window, will form a
    small window for text to display in. The other, thetext, contains the text to
    scroll.


    Since the text doesn''t fit in the small window, you''ll only see part of it at
    a time. The overflow property on the window layer prevents the rest of the content
    from showing. Your script will manipulate the window''s style.top property to
    move it relative to the window, creating a scrolling effect.


    > The text layer is actually 10 pixels narrower than the window layer. This, along
    with the left property, creates a small margin of white space on either side of
    the window, preventing any of the text from being obstructed.


    The text to scroll is placed within the inner <div> element. You can use any HTML
    here, although it should be able to wrap to the small window.


    Figure 23.3 shows this example in action, after the scrolling text has reached
    the end.'
