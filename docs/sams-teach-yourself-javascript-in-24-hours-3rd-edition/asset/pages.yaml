    # # Responding to Events


    In your experience with JavaScript so far, most of the scripts you''ve written
    have executed in a calm, orderly fashion, moving from the first statement to the
    last.


    In this hour, you''ll learn to use the wide variety of event handlers supported
    by JavaScript. Rather than executing in order, scripts using event handlers can
    interact directly with the user. You''ll use event handlers in just about every
