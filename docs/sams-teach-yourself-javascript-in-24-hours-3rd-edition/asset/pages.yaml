  md: '# Summary


    In this hour, you''ve learned to use events to detect mouse actions, keyboard
    actions, and other events, such as the loading of the page. You can use event
    handlers to perform a simple JavaScript statement when an event occurs, or to
    call a more complicated function.


    JavaScript includes a variety of other events. Many of these are related to forms,
    which you''ll learn about in Hour 12. Another useful event is onError, which you
    can use to prevent error messages from displaying. This event is described in
    Hour 17,

    "Debugging JavaScript Applications."


    In the next hour, you''ll continue learning about the objects in the DOM. Specifically,
    Hour 12 looks at the objects associated with Web forms and how they work with
    JavaScript.


    # Q&A


    +   I noticed the <img> tag in HTML can''t have onmouseover or onClick event handlers
    in some browsers. How can my scripts respond when the mouse moves over an image?


    +   The easiest way to do this is to make the image in a link surrounding it with
    an <a> tag. You can include the BORDER=0 attribute to prevent the blue link border
    from being displayed around the image. You will see an example of this in Hour
    13.


    +   My image rolls onmouseover work perfectly in Internet Explorer, but not in
    Netscape. Why?


    +   Re-read the previous answer, and check whether you''ve used an onmouseover
    event for an <img> tag. This is supported by Internet Explorer and Netscape 6,
    but not by earlier versions of Netscape.


    +   What if I define both onkeydown and onkeypress event handlers? Will they be
    called when a key is pressed?


    +   The onkeydown event handler is called first. If it returns true, the onkeypress
    event is called. Otherwise, no keypress event is generated.


    +   When I use the onload event, my event handler sometimes executes before the
    page is done, or before some of the graphics. Is there a better way?


    +   This is a bug in some older versions of JavaScript. One solution is to add
    a delay to your script using the setTimeout method. You''ll learn how to use this
    method in Hour 11, "Using Windows and Frames."'
