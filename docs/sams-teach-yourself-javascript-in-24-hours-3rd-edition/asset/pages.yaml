  md: "# Hour 23\n\n# FIGURE 23.2\n\nThe Drop-Down menu example in action.\n\n![](img/3ba9ce11a08220fe5348f94ec18e83ff_366_0.png)\n\
    \n# Workshop: Creating a Scrolling Text Box\n\nIn Hour 5, “Using Strings and Arrays,”\
