  md: '# Working with Style Sheets


    Here''s a rundown of how this style sheet works:


    +   * The <style> tags enclose the style sheet.

    * The BODY section sets body''s default text color to blue.

    * The P section defines the style for paragraphs.

    * The H1, H2, H3 section defines the style for header tags.

    * The UL section defines a style for bullet lists.


    To show how this style sheet works, Listing 18.1 shows a document that includes
    this style sheet and a few examples of ordering for particular elements. Figure
    18.1 shows Internet Explorer''s display of this example.


    # Listing 18.1 An example of a document using CSS style sheets


    ```

    <html>

    <head><title>Style Sheet Example</title>

    <style type="text/css">

    BODY (color: blue);

    P (text-align: center;

    margin-left:20%;

    margin-right:20%);

    H1, H2, H3 (color: red)

    UL (color: green;

    font-weight: bold)

    </style>

    </head>

    <body>

    <h1>Welcome to this page</h1>

    <p>The above heading is red, since we specified that H1-H3 headers are red. This
    paragraph is blue, which is the default color for the entire body. It also centered
    and has 20% margins, which we specified as the default for paragraphs.</p>

    <p STYLE="color:black">This paragraph has black text, because it overrides the
    default color in the paragraph tag. We didn''t override the centering, so this
    paragraph is also centered.</p>

    <ul>

    <li>This is a bullet list.

    <li>It''s green and bold, because we specified those defaults for bullet lists.\n<li
    STYLE="color:red">This item is red, overriding the default.\n<li>This item is
    back to normal.</li>

    </ul>

    <p>This is another paragraph with the default paragraph style.</p>

    </body>

    </html>

    ```


