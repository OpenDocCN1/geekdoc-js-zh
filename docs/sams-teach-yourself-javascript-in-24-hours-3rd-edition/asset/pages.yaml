  md: "# The if Statement\n\nOne of the most important features of a computer language\
    \ is the capability to test and compare values. This allows your scripts to behave\
    \ differently based on the values of variables, or based on input from the user.\n\
    \nThe if statement is the main conditional statement in JavaScript. This statement\
    \ means much the same in JavaScript as it does in English—for example, here is\
    \ a typical conditional statement in English:\n\nIf the phone rings, answer it.\n\
    \nThis statement consists of two parts: a condition (If the phone rings) and an\
    \ action (answer it). The if statement in JavaScript works the same way. Here\
    \ is an example of a basic statement:\n\n```\nif (a == 1) window.alert(\"Found\
    \ a 1!\");\n```\n\nThis statement includes a condition (if a equals 1) and an\
    \ action (display a message). This statement checks the variable a and, if it\
    \ has a value of 1, displays an alert message. Otherwise, it does nothing.\n\n\
    If you use an if statement like the preceding example, you can use a single statement\
    \ as the action. You can also use multiple statements for the action by enclosing\
    \ them in braces ({}), as shown here:\n\n```\nif (a == 1) {\n  window.alert(\"\
    Found a 1!\");\n  a = 0;\n}\n```\n\nThis block of statements checks the variable\
    \ once again. If it finds a value of 1, it displays a message and sets back to\
    \ 0.\n\n# Conditional Operators\n\nWhile the action part of an if statement can\
    \ include any of the JavaScript statements you've already learned (and others,\
    \ for that matter), the condition part uses its own syntax. This is called a conditional\
    \ expression.\n\nA conditional expression includes two values to be compared (in\
    \ the preceding example, the values were a and 1). These values can be variables,\
    \ constants, or even expressions in themselves."
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Testing and Comparing Values


    Either side of the conditional expression can be a variable, a constant, or an
    expression. You can compare a variable and a value, or compare two variables.


    Between the two values to be compared is a conditional operator. This operator
    tells JavaScript to compare the two values. For instance, the == operator is used
    to test whether the two values are equal. A variety of conditional operators are
    available:


    +   * == (is equal)

    * != (is not equal)

    * < (is less than)

    * > (is greater than)

    * >= (is greater than or equal to)

    * <= (is less than or equal to)


    > Be not to confuse the equality operator (=) with the assignment operator (=),
    even though they might be read as "equals." Remember to use = when assigning a
    value to a variable, and == when comparing values. Confusing these two is one
    of the most common mistakes in JavaScript programming.


    # Combining Conditions with Logical Operators


    Often, you''ll want to check a variable for more than one possible value, or check
    more than one at once. JavaScript includes logical operators, also known as boolean
    operators, for this purpose. For example, the following two statements check different
    conditions and use the same action:


    ```

    if (phone == "*") window.alert("error!");

    if (email == "*") window.alert("error!");

    ```


    Using a logical operator, you can combine them into a single statement:


    ```

    if (phone == "*") || email == "*") window.alert("Something''s Missing!");

    ```


    This statement uses the logical OR operator (||) to combine the conditions. Translated
    to English, this would be, "If the phone number is blank or the email address
    is blank, display an error message."'
  merge: -1
