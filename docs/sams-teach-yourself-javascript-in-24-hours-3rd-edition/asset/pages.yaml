  md: 'You can also use event handlers to detect when the value of a text field changes.

    The text and textarea objects support the following event handlers:


    +   * The onFocus event happens when the text field gains focus.

    * The onBlur event happens when the text field loses focus.

    * The onChange event happens when the user changes the text in the field and then
    moves out of it.

    * The onSelect event happens when the user selects some or all of the text was
    selected. Unfortunately, there''s no way to tell exactly which part of the text
    was selected. (If the text is selected with the select() method described above,
    this event is not triggered).


    If used, these event handlers should be included in the <input> tag declaration.

    example, the following is a text field including an onChange event that displays
    an alert:


    ```

    <input TYPE="TEXT" NAME="text1" onChange="window.alert('' Changed'');">

    ```


    # Buttons


    The final type of form element is a button. Buttons use the <input> tag and can
    use one

    of different types:


    +   * type=SUBMIT is a submit button. This button causes the data in the form
    fields to

    sent to the CGI script.

    * type=RESET is a reset button. This button sets all the form fields back to their

    default value, or blank.

    * type=BUTTON is a generic button. This button performs no action on its own,
    but

    can assign it using a JavaScript event handler.


    All three types of buttons include a NAME attribute to identify the button and
    a VALUE that

    icates the text to display on the button''s face. A few buttons were used in the
    exam-

    ples Hour 11, "Using Windows and Frames." As another example, the following

    defines a button with the name sub1 and the value "Click Here":


    ```

    <input TYPE="SUBMIT" NAME="sub1" VALUE="Click Here">

    ```


    If the user presses a Submit or Reset button, you can detect it with the onSubmit
    or

    reset event handlers, described earlier in this hour. For generic buttons, you
    can use

    anClick event handler.


    # Check Boxes


    A check box is a form element that looks like a small box. Clicking on the check
    box

    switches between the checked and unchecked states, which is useful for indicating
    Yes or'
