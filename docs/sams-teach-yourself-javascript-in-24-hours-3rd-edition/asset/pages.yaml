    # Q&A


    +   - What''s the difference between changing the appearance of text with traditional
    tags, such as <b> and <i>, and using a style sheet?

    - Functionally, there is no difference. If you''re only using simple bold, italics,
    and such, it''s probably best to avoid style sheets. On the other hand, if you
    need to use more specific formatting, style sheets are ideal.

    - What happens if two style sheets affect the same text?

    - The CSS specification is designed to allow style sheets to overlap, or cascade.
    Thus, you can specify a style for the body of the document and override it for
    specific elements, such as headings and paragraphs. You can even go one step further
    and override the style for one particular instance of an element.'
