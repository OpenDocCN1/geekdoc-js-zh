    # Using External Style Sheets


    The preceding example only changes a few aspects of the HTML document appearance,
    but it adds about 10 lines to its length. If you were trying to make a very stylish
    page and had defined new styles for all of the attributes, you would end up with
    a very long and complicated document.


    For this reason, you can use a CSS style sheet from a separate file in your document.
    This makes your document short and to the point. More importantly, it allows you
    to define a single style sheet and use it to control the appearance of all the
    pages on your site.


    To define an external style sheet, place the commands you would normally use between
    the <style> tags in a separate file. You can refer to that file using the <link>
    tag in the header of one or more documents:


    ```

    <link REL=STLESHEET TYPE="text/css" HREF="style.css">

    ```


    This refers to an external CSS style sheet stored in the style.css file.'
