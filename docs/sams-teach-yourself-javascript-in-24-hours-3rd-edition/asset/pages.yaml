  md: '# Using Functions and Variables


    You can alternately use the ++ or -- operators before a variable name, as in ++lines.
    However, these are not identical. The difference is when the increment or decrement
    happens:


    +   - If the operator is after the variable name, the increment or decrement happens
    *after* the current expression is evaluated.

    - If the operator is before the variable name, the increment or decrement happens
    *before* the current expression is evaluated.


    This difference is only an issue when you use the variable in an expression and
    increment it in the same statement. As an example, suppose you have assigned the
    lines value 40. The following two statements have effects:


    ```

    alert(lines++);

    alert(++lines);

    ```


    The first statement displays an alert with the value 40, and then increments lines
    to 41. The second statement first increments lines to 41, then displays an alert
    with the value 41.


    > These operators are strictly for your convenience. If it makes more sense to
    you to stick to lines = lines + 1, do it—your script won''t suffer.


    # Data Types in JavaScript


    In some computer languages, you have to specify the type of data variable will
    store: for example, in JavaScript, you don''t need to specify a data type in most
    cases. However, you should know the types of data JavaScript can deal with.


    These are the basic JavaScript data types:


    +   - **Numbers**, such as 3, 25, or 1.4142138. JavaScript supports both integers
    and floatingpoint numbers.

    - **Boolean**, or logical values. These can have one of two values: *true* or
    *false*. They are useful for indicating whether a certain condition is true.


    > You''ll learn more about boolean values, and about using conditions in JavaScript,
    in Hour 6, "Testing and Comparing Values."


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_77_0.png)'
