  md: '# TABLE 4.1. Continued


    | Operator | Description | Example |

    | --- | --- | --- |

    | / | Divide | average = sum / 4 |

    | % | Modulo (remainder) | remainder = sum % 4 |

    | ++ | Increment | tries++ |

    | -- | Decrement | total-- |


    You’ll learn more about the increment and decrement operators later in this hour.
    There are also many other operators used in conditional statements—you’ll learn
    about these in Hour 6, "Testing and Comparing Values."


    # Operator Precedence


    When you use more than one operator in an expression, JavaScript uses rules of
    operator precedence to decide how to calculate the value. Table 4.1 above lists
    the operators from lowest to highest precedence, and operators with highest precedence
    are evaluated first. For example, consider this statement:


    ```

    result = 4 + 5 * 3;

    ```


    If you try to calculate this result, there are two ways to do it. You could multiply
    5 * 3 and first then add 4 (result: 19) or add 4 + 5 first and then multiply by
    3 (result: 27). JavaScript solves this dilemma by following the precedence rules:
    since multiplication has a higher precedence than addition, it first multiplies
    5 * 3 and then adds 4, producing a result of 19.


    > If you’re familiar with any other programming languages, the operators and precedence
    in JavaScript work, you’ll find that the most part, the same way as those in C,
    C++, and Java.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_72_0.png)


    Sometimes operator precedence doesn’t produce the result you want. For example,
    consider this statement:


    ```

    result = a + b + c + d / 4;

    ```


    This is similar to the calculation in the Average function earlier this hour.
    However, since JavaScript gives division a higher precedence than addition, it
    will divide the d variable by 4 before adding the other numbers, producing an
    incorrect result.'
