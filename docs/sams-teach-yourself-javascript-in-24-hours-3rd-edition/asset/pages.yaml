    +   Modify Listing 20.3 to add the entered text at the beginning of the paragraph
    instead of the end. You will need to replace the appendChild method with the insertBefore
    method.


    +   Modify Listing 20.4 to scroll a short message in the heading of the page instead
    of in the table.'
