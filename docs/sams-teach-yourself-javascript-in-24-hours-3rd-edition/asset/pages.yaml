  md: '# Understanding JavaScript


    Along with these examples, many of the changes in the upcoming JavaScript 2.0
    are designed to make it more suitable as a general-purpose scripting language.


    # Alternatives to JavaScript


    JavaScript is not the only language used on the Web, and in some cases, it may
    not be the right tool for the job. Other languages, such as Java, can do some
    things better than JavaScript. In the following sections, we''ll look at a few
    other commonly used Web languages and their.


    # Java


    Java is a programming language developed by Sun Microsystems that can be used
    to create applets, or programs that execute within a Web page.


    Java is a compiled code, but the compiler produces code for a virtual machine
    rather than a real computer. The virtual machine is a set of rules for bytecodes
    and their meanings, with capabilities that fit well within the scope of a Web
    browser.


    The machine code is interpreted by a Web browser. This allows the Java applet
    to execute the same way on PCs, Macintoshs, and UNIX machines, and different browsers.


    > Java is also a densely populated island in Indonesia and a slang term for coffee.
    This has resulted in a widespread invasion of coffee-related terms in computer
    literature.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_35_0.png)


    At this point, we need to make one thing clear: Java is a fine language, but you
    won''t be learning it in this book. Their names and some of their commands are
    similar, JavaScript and Java are entirely different languages.


    # ActiveX


    ActiveX is a specification developed by Microsoft that allows ordinary Windows
    programs to be run within a Web page. ActiveX programs can be written in languages
    as Visual C++ and Visual Basic, and they are compiled before being placed on the
    server.


    ActiveX applications, called controls, are downloaded and executed by the Web
    browser, like Java applets. Unlike Java applets, controls can be installed permanently
    when they are downloaded, eliminating the'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'ActiveX''s main advantage is that it can do just anything. This can also be
    a disadvantage: Several enterprising programmers have already used ActiveX to
    bring exciting new capabilities to Web pages, such as “the Web page that turns
    off your computer” and “the Web page that formats your disk drive.”


    Fortunately, ActiveX includes a signature feature that identifies the source of
    the control and prevents controls from being modified. While this won''t prevent
    a control from damaging your system, you can specify which sources of controls
    you trust.


    ActiveX has two main disadvantages. First, it isn''t easy to program as a scripting
    language or Java. Second, ActiveX is proprietary: it works only in Microsoft Internet
    Explorer, and only under Windows platforms.


    # VBScript


    VBScript, sometimes known as Visual Basic Scripting Edition, Microsoft''s answer
    to JavaScript. As JavaScript''s syntax is loosely based on Java, VBScript''s syntax
    is loosely based on Microsoft Visual Basic, a popular programming language for
    Windows machines.


    Like JavaScript, VBScript is a scripting language, and you can include VBScript
    statements within an HTML document. To begin a VBScript script, you use the `<script
    LANGUAGE=VBScript>` tag.


    VBScript can do many of the same things as JavaScript, and it even looks similar
    in some cases. It has two main advantages:


    +   - For those who know Visual Basic, it may be easier to learn than JavaScript.


    +   - It is closely integrated with ActiveX, Microsoft''s standard for Web-embedded
    applications.


    VBScript''s main disadvantage is that it is supported only by Microsoft Internet
    Explorer. JavaScript, on the other hand, is supported by Netscape, Internet Explorer,
    and several browsers. JavaScript is a much more popular language, and you can
    see it in use over the Web.


    # CGI and Server-Side Scripting


    CGI (Common Gateway Interface) is not really a language, but a specification that
    allows programs to run on Web servers. CGI programs can be written in any number
    of languages, including Perl, C, and Visual Basic.


    Along traditional CGI, scripting languages such as Microsoft''s ActiveX Server
    Pages, Java Pages, Cold Fusion, and PHP are often used on Web servers. A server-side
    implementation of JavaScript is also available.'
