  md: '# Using Functions and Variables


    However, the total variable could also contain a string; in this case, the statement
    above would result in an error.


    In some situations, you may end up with a string containing a number, and need
    to convert it to a regular numeric variable. JavaScript includes two functions
    for this purpose:


    +   - parseInt() converts a string to an integer number.

    - parseFloat() converts a string to a floating-point number.


    Both of these functions will return a number from the beginning of the string,
    and return a numeric version. For example, these statements convert the string
    "30 angry polar bears" to a number:


    ```

    stringvar = "30 angry polar bears"

    numvar = parseInt(stringvar)

    ```


    After these statements execute, the numvar variable contains the number 30. The
    non-numeric portion of the string is ignored.


    > These functions look for a number of the appropriate type at the beginning of
    the string. If a valid number is not found, the function will return the special
    value NaN, meaning not a number.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_79_0.png)


