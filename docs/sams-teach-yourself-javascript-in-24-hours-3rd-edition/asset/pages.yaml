  md: "# Debugging JavaScript Applications\n\n# Other Debugging Tools\n\nAlthough\
    \ you use alert messages and a little common to quickly find a bug in a simple\
    \ script, larger scripts can be difficult to debug. Here are a few tools you may\
    \ find useful as you develop and debug JavaScript applications:\n\n+   - HTML\
    \ validators can check your HTML documents to see if they meet the HTML standard.\
    \ The validation process can also help you find errors in your HTML. The W3C has\
    \ a validator online at http://validator.w3.org/\n- Netscape's JavaScript debugger\
    \ allows you to set breakpoints, display variable values, and perform other debugging\
    \ tasks. You can download the debugger at this URL: http://developer.netscape.com/software/jsdebugger.html.\
    \ The debugger does not support Netscape 6, but a version is in: http://www.mozilla.org/projects/venkman.\n\
    - Microsoft Script Debugger is similar, but works with Internet Explorer. It is\
    \ available from this: http://msn.microsoft.com/library/en-us/sdbug/Html/sdbug_1.asp.\n\
    - While text and HTML editors are good basic editing tools, they can also help\
    \ with debugging by displaying line numbers and using color codes to validate\
    \ commands.\n\n> Appendix B, \"Tools for JavaScript Developers,\" includes links\
    \ to HTML validators, editors, and other debugging tools.\n\n# Creating Error\
    \ Handlers\n\nIn some cases, there may be times when an error message is unavoidable,\
    \ and in a large JavaScript application errors are bound to happen. Your scripts\
    \ can respond to errors in a friendlier way using error handlers.\n\n# Using the\
    \ onerror Property\n\nYou can set up an error handler by assigning a function\
    \ to the onerror property of the window object. When an error occurs in a script\
    \ in the document, the browser calls the function you specify instead of the normal\
    \ error dialog. For example, these statements set up a function that displays\
    \ a simple message when an error occurs:\n\n```\nfunction errmsg(message,url,line)\
    \ {\n  alert('There wasn't an error. Nothing to see here.');\n  return true;\n\
    }\nwindow.onerror=errmsg;\n```"
  merge: -1
  pgno: 267
