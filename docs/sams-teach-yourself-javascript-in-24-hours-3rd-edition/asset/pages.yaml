  md: '# Getting Data with Forms


    No choices in your forms. You can use the <input> tag to define a check box. Here
    is a simple example:


    ```

    <input TYPE="CHECKBOX" NAME="check1" VALUE="Yes" CHECKED>

    ```


    Again, this gives a name to the form element. The VALUE attribute assigns a meaning
    to the check box; this is a value that is returned to the server if the box is
    checked. The default value is "on". The CHECKED attribute can be included to make
    the box checked by default.


    A check box is simple: it has two states. Nevertheless, the checkbox object in
    JavaScript has four different properties:


    +   * name is the name of the check box, and also the object name.

    * value is the "true" value for the check box—usually on. This value is used by
    the server to indicate that the box was checked. In JavaScript, you should use
    the checked property instead.

    * defaultChecked is the default status of the check box, assigned by the CHECKED
    attribute.

    * checked is the current value. This is a boolean value: true for checked and
    false for unchecked.


    To manipulate the check box or use its value, use the checked attribute. For example,
    this statement turns on a check box called same in the order form:


    ```

    document.order.same.checked = true;

    ```


    The check box has a single method, click(). This method simulates a click on the
    box. It also has a single event, onClick, which occurs whenever the box is clicked.
    This happens whether the box was turned on or off, so you''ll need to examine
    the checked property to see what happened.


    # Radio Buttons


    Another element for decisions is the radio button, using the <input> tag’s radio
    type. Radio buttons are also known as option buttons. These are similar to check
    boxes, they exist in groups and only one can be checked in each group. They are
    used for a multiple-choice or "one of many" input. Here is an example of a group
    of radio buttons:


    ```

    <input TYPE="RADIO" NAME="radio1" VALUE="Option1" CHECKED> Option 1

    <input TYPE="RADIO" NAME="radio1" VALUE="Option2"> Option 2

    <input TYPE="RADIO" NAME="radio1" VALUE="Option3"> Option 3

    ```


    These statements define a group of three radio buttons. The NAME attribute is
    the same for all three (which is what makes them a group). The VALUE attribute
    is the value passed to'
