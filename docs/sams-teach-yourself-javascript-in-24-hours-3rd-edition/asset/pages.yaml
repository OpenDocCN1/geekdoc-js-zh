    - location.replace() replaces the current location with a new one. This is similar
    to setting the location object''s properties. The difference is that the replace
    method does not affect the browser''s history. In other words, the Back button
    can''t be used to go to the previous location. This is useful for splash screens
    or temporary pages that it would be useless to return to.


    # Reading Information about the Browser


