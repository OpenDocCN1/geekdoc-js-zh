    # Quiz


    Test your knowledge of JavaScript graphics and animation by answering the following
    questions.


    # Questions


    +   1. Which event handlers are used for a rollover?

    a. mouseOver and onClick

    b. mouseOver and mouseUnder

    c. mouseOver and mouseOut

    2. What types of image maps can be used with JavaScript?

    aa. Server-side image maps

    b. Client-side image maps

    c. Both types

    3. What is the JavaScript object for the second image on a page?

    aa. image[2]

    b. images[2]

    c. images[1]


    # Answers


    +   1. c. You create rollovers with the mouseOver and mouseOut event handlers.

    2. b. Client-side image maps can be used with JavaScript.

    3. c. The second image on a page is represented by images[1].'
