  md: '![](img/3ba9ce11a08220fe5348f94ec18e83ff_205_0.png)


    # # HOUR 13


    # # Using Graphics and Animation


    One of the most challenging—and rewarding—uses of a programming language creating
    graphic applications and games. In this hour, you''ll look at some techniques
    you can use for graphic pages—or to add excitement to any Web page.


    Of course, JavaScript is a relatively simple language and this is a relatively
    simple book, so you won''t be learning to write your own version of Quake in JavaScript.
    Nevertheless, JavaScript can perform some useful features with graphics, and can
    even do simple animations.


    In this hour, you''ll learn how to use graphics and animation in JavaScript. You
    will cover the following topics:


    +   - Using image maps with JavaScript

    - How JavaScript uses objects to represent images

    - Creating rollover images

    - Pre-loading images into the cache

    - Creating a simple JavaScript animation'
