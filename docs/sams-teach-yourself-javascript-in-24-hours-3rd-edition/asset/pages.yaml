- img_proc: true
  md: "Each rule uses braces to surround the list of properties and values, and a\
    \ semicolon after each value. The semicolon is optional if you are only specifying\
    \ one property and value.\n\nYou can specify multiple HTML tags for the selector,\
    \ as well as multiple properties and values. For example, the following style\
    \ sheet specifies that all headers are blue, italic, and centered:\n\n```\n<style\
    \ TYPE=\"text/css\">\nH1,H2,H3,H4,H5,H6 {color: blue;\n  font-style: italic;\n\
    \  text-align: center;}\n}\n</style>\n```\n\n> If you make a rule that sets the\
    \ style of the <body> tag, it will affect the entire document. This becomes the\
    \ default rule for the document and you can override it with the styles of elements\
    \ within the body of the page.\n\n![](img/3ba9ce11a08220fe5348f94ec18e83ff_282_0.png)\n\
    \n# Setting Styles for Specific Elements\n\nRather than setting the style for\
    \ all elements of a certain type, you can specify a style for an individual element\
    \ only. For example, the following HTML tag represents a Level 1 colored red:\n\
    \n```\n<H1 STYLE=\"color: red; text-align: center;\\>This is a blue header.</H1>\n\
    ```\n\nThis is an inline style since it is specified in the HTML itself. You don't\
    \ need to use <style> tags with this type of style. If you have used both, an\
    \ inline style overrides a style sheet—for example, if the above tag appears in\
    \ a document that sets H1 headings to be blue in a style sheet, the heading would\
    \ still be.\n\n# Using ID Attributes\n\nYou can create a rule within a style sheet\
    \ that will only apply to a certain element. The ID attribute of an HTML tag allows\
    \ you to assign a unique identifier to that element. For example, this defines\
    \ a paragraph with the ID attribute:\n\n```\n<p ID=\"intro\">This is a paragraph</p>\n\
    ```\n\nOnce you've assigned this attribute to the tag, you can include a rule\
    \ for it as part of a style sheet. CSS uses the pound sign (#) to indicate that\
    \ a rule applies to a specific ID. For example, the following style sheet sets\
    \ the intro to be red in color:\n\n```\n<style type=\"text/css\">\n#intro {color:\
    \ red;}\n</style>\n```"
