  md: '# Repeating Yourself: Using Loops


    You might have noticed that you could have done the same thing with a for:

    for (n=0;total < 10; n++) {

    total += values[n];

    }


    As a matter of fact, the for loop is nothing more a special kind of while loop
    that handles an initialization and an increment for you. You can generally use
    while for any loop. However, it''s best to choose whichever type of loop makes
    the most sense for the job, or that takes the least amount of typing.


    # Using do...while Loops


    JavaScript 1.2 introduced a third type of loop: the do...while loop. This type
    of loop is similar to an ordinary while loop, with one difference: The condition
    is tested at the end of the loop rather than the beginning. Here is a typical
    do...while loop:


    ```

    do {

    ++

    total += values[n];

    while (total < 10);

    ```


    As you''ve probably noticed, this is basically an upside-down version of the while
    example above. There is one difference: With the do loop, the condition is tested
    at the end of the loop. This means that the statements in the loop will always
    be executed at least once, even if the condition is never true.


    > As with the for and while loops, the do loop can include a single statement
    without braces, or a number of statements enclosed in braces.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_117_0.png)


    # Working with Loops


    Although you can use simple for and while loops for straightforward tasks, there
    are some considerations you should make when using more complicated loops. In
    the next sections, we''ll look at infinite loops and the break and continue statements,
    which give you more control over your loops.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_117_1.png)'
