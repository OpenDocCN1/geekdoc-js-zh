  md: '# Creating a Script to Display Dialog Boxes


    As a further illustration of these types of dialog boxes, 11.4 shows an HTML document
    that uses buttons and event handlers to enable you to test dialog boxes.


    **LISTING 11.4** An HTML document that uses JavaScript to display alerts, confirmations,
    and prompts


    ```

    <html>

    <head><title>Alerts, Confirmations, and Prompts</title>

    </head>

    <body>

    <h1>Alerts, Confirmations, and Prompts</h1>

    <hr>

    Use the buttons below to test dialogs in JavaScript.

    <form NAME="win">

    <p><input type="button" VALUE="Display an Alert" onclick="window.alert(''This
    is a test alert.'');"></p>

    <p><input type="button" VALUE="Display a Confirmation" onclick="temp=window.confirm(''Would
    you like to confirm?''); window.status=(temp)?''confirm'': ''false'';"></p>

    <p><input type="button" VALUE="Display a Prompt" onclick="var temp = window.prompt(''Enter
    some Text'',''This is the default value:''); window.status=temp;"></p>

    </form>

    <br>Have fun!

    <hr>

    </body>

    </html>

    ```


    The document displays three buttons, and each one uses an event handler to display
    the dialog boxes. Let''s take a detailed look at each one:


    +   * The alert box is displayed when you click the first button.

    * The confirmation dialog box is displayed when you click the second button, and
    displays a message in the status line indicating whether true or false was returned.
    The returned value is stored in the temp variable.

    * The third button displays the prompt dialog box. Notice that the prompt method
    accepts a second parameter, which is used to set a default value for the entry.
    The value you enter is stored in the temp variable and displayed on the status
    line. Notice that if you press the Cancel button in the dialog box, the null value
    is returned.'
