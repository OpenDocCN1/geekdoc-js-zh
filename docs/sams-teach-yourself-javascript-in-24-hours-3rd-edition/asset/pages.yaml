  md: "Hour 14 covers the following topics:\n\n+   * Using JavaScript to get browser\
    \ information\n* Displaying browser details with JavaScript\n* Making a page-specific\n\
    * Dealing with browsers without JavaScript support\n* Creating a script for multiple\
    \ browser support\n\n# Reading Browser Information\n\nIn Hour 9, \"Working with\
    \ the Document Object Model,\" you learned about the various objects (such as\
    \ window and document) that represent portions of the browser window and the current\
    \ Web document. JavaScript also includes an object called navigator that you can\
    \ use to read information about the user's browser.\n\nThe navigator object isn't\
    \ part of the DOM, so you can refer to it directly. It includes a number of properties,\
    \ each of which tells you something about the browser. These include the following:\n\
    \n+   * navigator.appName is the browser's internal code name, usually Mozilla\n\
    * navigator.appName is the browser's name, usually Netscape or Microsoft Internet\
    \ Explorer.\n* navigator.version is the version of the browser being used—for\
    \ example, 4.0(Win95);\n* navigator.userAgent is the user-agent header, a string\
    \ that the browser sends to the Web when requesting a Web page. It includes the\
    \ entire version information, for example Mozilla/4.0(Win95);\n* navigator.language\
    \ is the language (such as English or Spanish) of the browser. This is stored\
    \ as a two-letter code, such as \"en\" for English. This property is reported\
    \ only by Netscape.\n* navigator.platform is the computer platform of the current\
    \ browser. This is a short string, such as Win96, Win32, or MacPC. You can use\
    \ this to enable platform-specific features (for example, ActiveX Components).\n\
    \nYou will usually use these properties in an if statement. For example, the statement\
    \ sends the user to a different URL if the navigator object specifies Netscape\
    \ 4.x:\n\n```\nif (navigator.userAgent.indexOf(\"Mozilla/4\") == -1)\n  window.location=\"\
    non_netscape.html\";\n```"
