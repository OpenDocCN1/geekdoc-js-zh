- img_proc: true
  md: 'For example, here is a script that can be placed on the introductory page of
    a site. detecting the browser version, it sends the user to the appropriate page.


    ```

    <script language="Javascript" type="text/javascript">

    if navigator.appName.indexOf(''Netscape'') > -1

    && navigator.appVersion.indexOf(''5'') > -1

    window.location = "netscape.html";

    if navigator.appName.indexOf(''Microsoft'') > -1

    && navigator.appVersion.indexOf(''4'') > -1

    window.location = "ie.html";

    window.location = "default.html";

    </script>

    ```


    This script sends the user to one of three pages: netscape.html for Netscape 5.x
    or 6.x, ie.html for Explorer 4.x or later, default.html for any other browser.


    > You might have noticed that there is no third statement in this script. The
    statement to send the user to default.html is unconditional. This works because
    either of the if statements were true, the browser would have been sent to a different
    page, immediately aborting the current script. The only browsers that make it
    to the last line are those that aren''t detected specifically.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_230_0.png)


    # Making a Multiple-Browser Page


    The alternative is to make a single page that supports more than one type of browser.
    You can use a script to detect the browser, and use script commands to include
    different HTML codes in the document depending on the browser.


    This method uses only one document, but you might find that it transforms a long,
    complicated page into a long, impossibly complicated page. A short example of
    a page that does is included in this hour’s Workshop section.


    # Using Feature Sensing


    The examples show so far in this we have used browser sensing to differentiate
    between browsers: They look at the navigator object’s properties to determine
    which browser is in use. While this is the only way to support all browsers, feature
    sensing is often a better way.


    Feature sensing detects whether a feature is supported, rather than being concerned
    with the exact browser in use. For example, if your script uses dynamic images,
    you could use this statement to determine whether they are supported:


    ```

    if (document.images) alert(''dynamic images are supported.'');

    ```'
