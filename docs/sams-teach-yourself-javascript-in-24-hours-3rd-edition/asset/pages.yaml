  md: "# Quiz\n\nTest your knowledge of JavaScript's form objects by answering the\
    \ following questions.\n\n# Questions\n\n+   1. Which of these attributes of a\
    \ <form> tag determines where the data will be sent?\n   a. ACTION\n   b. METHOD\n\
    \   c. NAME\n2. Where do you place the onSubmit event handler to validate a form?\n\
    \   a. In the <body> tag.\n   b. In the <form> tag.\n   c. In the <input> tag\
    \ for the Submit button.\n3. What can JavaScript do with forms that a CGI script\
    \ can't?\n   a. Cause all sorts of problems.\n   b. Give the user instant feedback\
    \ about errors.\n   c. Submit the data to a server.\n\n# Answers\n\n+   1. The\
    \ ACTION attribute determines where the data is sent.\n2. You place the onSubmit\
    \ event handler in the <form> tag.\n3. JavaScript can validate a form and let\
    \ the user know about errors immediately, without waiting for a response from\
    \ a server. (If you use server-side JavaScript, you can also submit the data to\
    \ the server, but that's another story.)"
