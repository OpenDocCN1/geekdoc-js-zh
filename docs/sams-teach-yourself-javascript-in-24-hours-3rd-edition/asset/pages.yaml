  md: 'In theory, the average should be somewhere near .5, halfway between 0 and 1.
    The more random values you generate, the closer the average should get to this
    middle ground.


    As an example of the use of the Math object, you can create a script that tests
    JavaScript’s random number function. To do this, you’ll generate 5,000 random
    numbers and calculate their average.


    > Rather than typing it in, you can download and try this hour''s book''s Web
    site: http://www.jworkshop.com/.


    In case you skipped Hour 7, “Repeating Yourself: Using Loops,” and are getting
    out your calculator, don’t worry—you’ll use a loop to generate the random numbers.
    You’ll be surprised how JavaScript can do this.


    To begin your script, you will initialize a variable called total. A variable
    will store a running total of all the random values, so it’s important that it
    starts at 0:


    ```

    total = 0;

    ```


    Next, begin a loop that will execute 5,000 times. Use a for loop because you want
    to execute a fixed number of times:


    ```

    for (i=1; i<=5000; i++) {

    ```


    Within the loop, you will need to create a random number and add its value to
    total. Here are the statements that do and continue with the next iteration of
    the loop:


    ```

    num = Math.random();

    total += num;

    ```


    Depending on the speed of your computer, it might take a few minutes to generate
    5,000 random numbers. Just to be sure something’s happening, the script will update
    the status line to tell the user how many numbers have been generated so far and
    the current total:


    ```

    window.status = "Generated " + i + " numbers. Current total: " + total;

    ```


    The final part of your script will calculate the average by dividing the total
    up to three decimal places, using the trick you learned in this hour:


    ```

    average = total / 5000;

    average = Math.round(average * 1000) / 1000;

    document.write("<H2>Average of 5000 numbers: " + average + "</H2>");

    ```'
