- img_proc: true
  md: '# Hour 2


    > Remember to include only valid JavaScript statements between the starting and
    ending <script> tags. If the browser finds anything but valid JavaScript statements
    within the <script> tags, it will display a JavaScript error message.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_44_0.png)


    To begin creating the script, open your favorite text editor and type the beginning
    and ending <script> tags, as shown below.


    ```

    ```html

    <script LANGUAGE="JavaScript" type="text/javascript">

    </script>

    ```

    ```


    Since this script does not use any of the new features of JavaScript 1.1 or later,
    you won''t need to specify a version number in the <script> tag. This script should
    work in Netscape 2.0 or Internet Explorer 3.0 or later.


    # Adding JavaScript Statements


    To complete the script, you will need to determine what the local and UTC times
    are, and then display them to the browser. Fortunately one of the hard parts,
    such as converting dates, are built into the JavaScript interpreter.


    # Storing Data in Variables


    To begin the script, you will use a variable to store the current date. You will
    learn more about variables in Hour 4, "Using Functions and Variables." For now,
    think of them as containers that can hold something—a number, or in this case,
    a date.


    To start writing the script, add the following line after the first <script> tag.
    Be sure to use the same combination of uppercase and lowercase letters in your
    version, since JavaScript commands and variable names are case-sensitive.


    ```

    ```javascript

    now = new Date();

    ```

    ```


    This statement creates a variable called now and stores the current date and time
    in it. This statement and the object you use in this script use JavaScript''s
    built-in Date object, which allows you to conveniently handle dates and times.
    You''ll learn more working with dates in Hour 8, "Using Math and Date functions."


    > The semicolon at the end of the above statement. This tells the browser that
    it has reached the end of a statement. You can actually omit the semicolons, but
    we''ll use them throughout this book for clarity.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_44_1.png)'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Creating a Simple Script


    # Calculating the Results


    Internally, JavaScript stores data as the number of milliseconds since January
    1, 1970. Fortunately, JavaScript includes a number of functions to convert dates
    and times in various ways, so you don''t have to figure out how to convert milliseconds
    to date, and time.


    To continue your script, add the two statements before the final <script> tag:

    localtime = now.toString();

    utctime = now.getGMTString();


    These statements create new variables: localtime, containing the current time
    and date in a nice readable format, and utctime, containing the UTC equivalent.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_45_0.png)


    > The localtime and utctime variables store a piece of text, such as "January
    1, 2001 12:00 PM." In programming parlance, a piece of text is called a string.
    You will learn more about strings in Hour 5, "Using Strings and Arrays."


    # Creating Output


    You have two variables—localtime and utctime—which contain the results from our
    script. Of course, these variables don''t do much good unless we see them. JavaScript
    includes a number of ways to display information, and one of the simplest is the
    document.write statement.


    The document.write statement displays a JavaScript string, a number, or anything
    else you throw at it. It will exist within a Web page, the output will be displayed
    as part of the page. To display the result, add these statements before the final
    <script> tag:


    ```

    document.write("<b>Local time:</b>" + localtime + "<br>");

    document.write("<b>UTC-time:</b>" + utctime + ");");

    ```


    These statements tell the browser to add some text to the Web page containing
    your script. The output will include some strings introducing the results, and
    the contents of the localtime and utctime variables.


    Notice the HTML tags, such as <b>, within the quotation marks—since JavaScript''s-output
    appears within a Web page, it needs to be formatted with HTML. The <br> tag in
    the first line ensures that the two times will be displayed on separate lines.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Adding the Script to a Web Page


    Notice the plus signs (+) used between the text and variables in the above statements.
    In this case, it tells the browser to combine the values into one string of text.
    If you use the plus sign between two numbers, they are added together.


    You should now have a complete script that calculates a result and displays it.
    Your list should match Listing 2.1.


    +   Listing 2.1 The complete Date and Time Script


    ```

    <script language="JavaScript" type="text/javascript">

    now = new Date();

    localtime = now.toString();

    utctime = now.toGMTString();

    document.write("<b>Local time:</b>" + localtime + "<BR>");

    document.write("<b>UTC time:</b>" + utctime);

    </script>

    ```


    To use your script, you will need to add it to an HTML document. In its most basic
    form, the HTML document should include opening and closing <html> tags, <head>
    tags and <body> tags.


    If you add the tags to the document containing your script along a descriptive
    heading, you should end up with something like Listing 2.2.


    +   Listing 2.2 The Date and Time script in an HTML document


    ```

    <html>

    <head><title>Displaying Times and Dates</title></head>

    <body>

    <h1>Current Date and Time</h1>

    <p>

    <script language="JavaScript" type="text/javascript">

    now = new Date();

    localtime = now.toString();

    utctime = now.toGMTString();

    document.write("<b>Local time:</b>" + localtime + "<BR>");

    document.write("<b>UTC time:</b>" + utctime);

    </script>

    </p>

    </body>

    </html>

    ```'
