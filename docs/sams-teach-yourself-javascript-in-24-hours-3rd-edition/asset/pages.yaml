- img_proc: true
  md: '# Planning the Program


    In this you''ll create a JavaScript program that plays a game. It will be a casino-style
    draw poker game, although it won''t cost you a penny to play. In the process you''ll
    learn what it''s like to create a complex JavaScript program, complete with graphics,
    user inter-action, and complex calculations.


    # Creating Graphics


    Because this is a card game, you will need graphics for each of the 52 cards in
    the deck. In case you''re not an artist, I''ve made a set of cards available on
    this book''s Web site at http://www.jsworkshop.com/. When you look at them, you''ll
    see that I''m not an artist either.


    Five cards will be displayed on the screen at the same time, so used graphics
    files with a width of 106 and height of 136. This will allow the game to be played
    on a 640x480 monitor, and should look good at other resolutions.


    One of the main considerations in a program like this is the naming of the graphics
    files. Although names like Ten of Spades.gif are friendly to users, they would
    be difficult for the JavaScript interpreter to work with.


    To make it for the script, I''ve named the files with numbers 1–13 (Ace is 1;
    Jack, Queen, and King are 11, 12, and 13). The file names are simply this number
    plus a letter representing the suit (c, h, s, or d). For an example, the Jack
    of Clubs would be 11c.gif.


    I''ve also created a title graphic, a Hold button to be displayed under each deal
    card, and Deal and Draw buttons to control the gameplay.


    # Choosing Variables


    The next step in planning the script is to choose the variables that will be used.
    You can add variables, but choosing them before helps you plan the way the script
    will store data.


    The variables you''ll need for this game include the following:


    +   score—An integer representing the player''s current score. This starts at
    100. Point will be bet each time the cards are dealt, and the score will increase
    based on the poker hand''s score.


    +   deal—A flag that you''ll need to indicate that the cards have been dealt,
    and the player can now hold or draw cards.'
