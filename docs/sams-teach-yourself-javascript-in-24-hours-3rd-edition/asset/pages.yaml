  md: '![](img/3ba9ce11a08220fe5348f94ec18e83ff_27_0.png)


    # # HOUR 1


    # ## Understanding JavaScript


    The World Wide Web (WWW) began as a text-only medium—the first version of the
    HTML (Hypertext Markup Language) specification didn’t even have the capability
    to include graphics on a page. Although it’s still not quite ready to give a run
    for its money, the Web has come a long way.


    Today’s Web sites can include a wealth of features: graphics, sounds, animation,
    video, and sometimes useful content. Web scripting languages, such as JavaScript,
    are one of the easiest ways to spice up a Web page and to interact with users
    in new ways.


    The first hour of this book introduces the concept of Web scripting and the JavaScript
    language. It also describes how JavaScript, Java, and other Web languages fit
    into the scheme of things. The following topics will be covered in this hour:


    +   - What Web scripting is, and what it’s good for

    - How scripting and programming are different (and similar)'
  merge: -1
  pgno: 27
- img_proc: true
  md: '6 Hour 1


    +   - What JavaScript is

    - How to include JavaScript commands in a Web page

    - How different Web browsers handle JavaScript

    - Choosing between JavaScript and alternative languages


    # Learning Web Scripting Basics


    In the world of science fiction movies (and many other movies that have no excuse),
    computers are often seen obeying commands in English. While this may indeed happen
    in the near future, computers currently find it easier to understand languages
    like BASIC, C, and Java.


    If you know how to use HTML to create a Web document, you''ve already worked with
    one computer language. You use HTML tags to describe how you want your document
    formatted, and the browser obeys your commands and shows the formatted document
    to the user.


    Since HTML is a simple markup language, it can''t respond to the user, make decisions,
    or automate repetitive tasks. Interactive tasks like these require a more complex
    language: a programming language, or a scripting language.


    While many programming languages are complex, scripting languages are generally
    simple. They have a simple syntax, can perform tasks with a minimum of commands,
    and are easy to learn. Web scripting languages allow you to combine scripting
    with HTML to create interactive Web pages.


    # Scripts and Programs


    A movie or play follows a script—a list of actions (or lines) for the actors to
    perform. A Web script provides the same type of instructions for the browser.
    A script in JavaScript can range from a single line to a full-scale application.
    (In either case, JavaScript scripts always run within a browser.)


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_28_0.png)


    | What''s the difference between scripting and programming? It depends on who
    who you ask. We''ll refer to scripting throughout this book, but feel free to
    include JavaScript Programming on your resume after you''ve finished this book.
    |'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Understanding JavaScript


    Some programming languages must be compiled, or translated into machine code,
    before they can be executed. JavaScript, on the other hand, is an interpreted
    language: The browser executes each line of script as it comes to it.


    There is one main advantage to interpreted languages: writing or changing a script
    is very simple. Changing a JavaScript script is as easy as changing a typical
    HTML document, and the change is enacted as soon as you reload the document in
    the browser.


    > Interpreted languages have their disadvantages—they can''t execute very quickly,
    they''re not ideally suited for complicated work like graphics. Also, they require
    the interpreter (in JavaScript''s case, usually a browser) in order to work.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_29_0.png)


    # Introducing JavaScript


    JavaScript was developed by Netscape Communications Corporation, the makers of
    the popular Netscape Web browser. JavaScript was the first Web scripting to be
    introduced, and it is still by far the most popular.


    > JavaScript was originally called LiveScript and was first introduced in Netscape
    Navigator 2.0 in 1995. It soon renamed JavaScript to indicate a marketing relationship
    with Java.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_29_1.png)


    JavaScript is almost as easy to learn as HTML, and it can be included directly
    in HTML documents. Here are a few of the things you can do with JavaScript:


    +   - Add scrolling or changing messages to the browser''s status line.

    - Validate the contents of a form and make calculations. (For example, an order
    form can automatically display a running total as you enter item quantities.)

    - Display messages to the user, either as part of a Web page or in alert boxes.

    - Animate images or create images that change when you move the mouse over them.

    - Create ad banners that interact with the user, rather than simply displaying
    a graphic.

    - Detect the browser in use and display different content for different browsers.

    - Detect installed plug-ins and notify the user if a plug-in is required.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'You can do this and more with JavaScript, including creating entire applications.
    We''ll explore the uses of JavaScript throughout this book.


    # How JavaScript Fits into a Web Page


    As you hopefully already know, HTML is the language you use to create Web documents.
    To refresh your memory, Listing 1.1 shows a short but sadly typical Web documents.


    +   LISTING 1.1 A simple HTML document


    ```

    <html>

    <head>

    <title>Our Home Page</title>

    </head>

    <body>

    <h1>The American Eggplant Society</h1>

    <p>Welcome to our web page. Unfortunately,

    it''s still under construction.</p>

    </body>

    </html>

    ```


    This document consists of a header within the <head> tags and the body of the
    page within the <body> tags. To add JavaScript to a page


    The <script> tag tells the browser to start treating the text as a script, and
    the closing </script> tag tells the browser to return to HTML mode. In most cases,
    you can''t use JavaScript statements except within <script> tags. The exceptions
    are handlers, described later in this chapter.


    Using the <script> tag, you can add a short script (in this case, just one line)
    to a Web document, as shown in Listing 1.2.


    > If you want to try this example in a browser but don''t want to type it, the
    HTML document is available on this book''s Web site, http://www.jsworkshop.com/
    (as are all of the other listings).


    +   LISTING 1.2 A simple HTML document with a simple script


    ```

    <html>

    <head>

    <title>Our Home Page</title>

    ```'
