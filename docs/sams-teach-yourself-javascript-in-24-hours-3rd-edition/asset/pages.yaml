  md: '# Working with the Document Object Model


    > This diagram only includes the basic browser objects that will be covered in
    this hour. These are actually a small part of the Document Object Model, which
    you''ll learn more about starting with Hour 18, "Working with Style Sheets."


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_141_0.png)


    # History of the DOM


    Starting with the introduction of JavaScript 1.0 in Netscape 2.0, JavaScript has
    included objects to represent parts of a Web document and other browser features.
    However, there was never a true standard. While both Netscape and Microsoft Internet
    Explorer many of the same objects, there was no guarantee that the same objects
    would work the same way in both browsers, let alone in common browsers.


    The bad news is that there are still differences between the browsers—but here''s
    the good news. Since the release of Netscape 3.0 and Internet Explorer 4.0, all
    the basic objects (those covered in this hour) are supported in which the same
    way in both browsers, and new DOM standards are supported by the latest versions
    of Netscape and Internet Explorer.


    While all this standardization doesn''t change how the objects described in this
    hour work, you''ll be thankful for it as you move into the advanced features of
    the DOM later in this book.


    # DOM Levels


    The W3C (World-Wide Web Consortium) has recently developed the DOM level 1 standard.
    This defines not only basic objects, but an entire set of objects that encompass
    all parts of an HTML document. A level 2 DOM standard is also under development.


    The basic object hierarchy described in this hour is referred referred to DOM
    level 0, and the objects are included in the DOM level 1 standard. You''ll learn
    how to use the full set of Level 1 DOM objects in Part V of this book.


    > The Level 1 and Level 2 DOM objects allow you to modify a Web page in real time
    after it has loaded. This is called dynamic HTML (DHTML) and you''ll learn more
    about it in Part V.'
