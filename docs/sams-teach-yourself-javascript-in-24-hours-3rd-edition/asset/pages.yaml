  md: '# Q&A


    +   Q Can I force the browser to download a plug-in automatically to support my
    document?


    +   A, although a future version of Netscape may support this feature, and Internet
    Explorer provides an option to allow the download of plug-ins on demand. If the
    user can download and install the plug-in, you can use the navigator.plugins.reload
    method to refresh the list of plug-ins.


    +   Q Where I find a list of the exact properties and methods supported by a plug-in?


    +   A Check the plug-in vendor''s Web site. For the plug-ins that are bundled
    with Netscape, you can find information on Netscape''s site.


    +   Q Just how supported are plug-ins? Will I abandoning part of my audience by
    using them?


    +   A In the case of basic plug-ins such as Quicktime and audio players, you are
    pretty safe to use them but you will run into problems with some users. More complicated
    plug-ins are far less common. I suggest that you only use these when they are
    required (for example, a game that requires Macromedia Flash) or when you''ve
    provided a plug-in-free alternative to access your content.


    +   Q I get an error message “Object does not support this property or method”
    when attempting to play sounds with JavaScript.


    +   A This usually happens when the browser doesn''t have a plug-in for the type
    of sound file you are using. For Internet Explorer, installing the latest Windows
    Media Player component from Microsoft will fix the problem.


