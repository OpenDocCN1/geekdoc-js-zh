- img_proc: true
  md: "# Working with Sounds Plug-Ins\n\nThis example embeds the file sound.wav. The\
    \ <embed> tag for sounds uses the following attributes:\n\n+   * The SRC attribute\
    \ specifies the filename of the sound file.\n* The HIDDEN attribute makes the\
    \ embedded object invisible on the page; with this attribute, a control panel\
    \ is displayed to play or stop the sound.\n* The AUTOSTART attribute controls\
    \ whether the sound should play immediately when the page loads.\n* The LOOP attribute\
    \ specifies whether the sound will repeat—this is more useful for MIDI files than\
    \ simple sounds.\n* The CONTROLS attribute specifies the type of control panel\
    \ that is used if HIDDEN is not specified. Values include \"console\" for a large\
    \ panel, \"smallconsole\" or \"playbutton\" for a simple Play button.\n* The WIDTH\
    \ AND HEIGHT attributes control the size of the control panel, if it is not hidden.\n\
    \n![](img/3ba9ce11a08220fe5348f94ec18e83ff_249_0.png)\n\n> These attributes are\
    \ valid for Internet Explorer with Windows Media Player or Netscape 4.x with LiveAudio.\
    \ Other browsers or plug-ins could have different attributes.\n\n# Using the <object>\
    \ Tag\n\nThe <embed> tag has been deprecated in the HTML 4.0 in favor of a new\
    \ tag, <object>. This allows you to specify the same parameters and many others\
    \ to embed a sound or other plug-in object. Here is an example <object> tag to\
    \ include a sound within a Web page:\n\n```\n<object type=\"audio/x-wav\" data=\"\
    sound.wav\" width=\"100\" height=\"50\">\n  <param name=\"src\" value=\"sound.wav\"\
    >\n  <param name=\"autostart\" value=\"false\">\n  <param name=\"hidden\" value=\"\
    true\">\n</object>\n```\n\nThis tag embeds a hidden sound object, similar to the\
    \ <embed> tag example in the previous section."
  merge: -1
  pgno: 249
- img_proc: true
  md: '228 Hour 16


    While <object> is now the standard tag for embedding sound, it is currently supported
    only by Internet Explorer 4.0 and later. The <embed> tag is still supported by
    the latest browsers and is currently a better choice for compatibility.


    # Understanding MIME Types


    Multipurpose Internet Mail Extensions (MIME) is a standard for classifying different
    types of files and transmitting them over the Internet. The different types of
    files are known as MIME types.


    You''ve already worked with few MIME types: HTML (MIME type text/html), text (MIME
    type text/plain), and GIF images (MIME type image/gif). Although browsers don''t
    support many more than these types, external applications and plug-ins can provide
    support for additional types.


    When a Web server sends a document to a browser, it includes that document''s
    MIME type in the heading. If the browser supports that MIME type, it displays
    the file. If not, you''re asked what to do with the file (such as .zip or .exe
    file to download it).


    # Working with Plug-In Objects


    The JavaScript object, which you learned about in Hour 9, "Working with the Document
    Object Model," includes a child object called plugins. This object is an array,
    with one entry for each plug-installed on the browser.


    > Unfortunately, the navigator.plugins object is supported only by Netscape 3.0
    and later. There is no easy way to detect installed plug-ins in Internet Explorer.


    Each plug-in has an entry in the array. Each entry has the following properties:


    +   * name is the name of the plug-in.

    * filename is the executable file that was loaded to install the plug-in.

    * description is a description of the plug-in, supplied by the developer.

    * mimeTypes is an array with one entry for each MIME type supported by the plug-in.'
  merge: -1
