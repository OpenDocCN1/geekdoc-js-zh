  md: 'The ScrollMessage function includes the following commands:


    +   * The `function` keyword is used to begin the function.

    * The `window.status` property is used to display a string in the status line.
    The string is composed of the portion of msg from pos to the end, followed by
    the portion of msg from the beginning to pos.

    * Next, the pos variable is incremented using the `pos++` shorthand.

    * The `if` statement checks whether pos is larger than the length of msg. If it
    is, it resets it to 0 (You''ll learn more about the if statement in the next hour.).

    * The final statement of the function uses the `window.setTimeout` method, which
    allows you to set a statement to be executed after .2 seconds. In this case, it
    executes the ScrollMessage function again after .2 seconds.

    * Finally, the closing bracket ends the function.


    To complete the example, add the `<script>` tags and the HTML tags that make up
    a Web document. Listing 5.2 shows the scrolling message example.


    > Don''t forget that you can download this listing from this book''s Web site,
    http://www.jworkshop.com/, rather than typing it in yourself.


    # Listing 5.2 The complete scrolling message example


    ```

    <html>

    <head><title>Scrolling Message Example</title>

    <script LANGUAGE="JavaScript" type="text/javascript">

    msg = "This is an example of a scrolling message. Isn''t it exciting";

    msg = "..." + pos;

    function ScrollMessage() {

    window.status = msg.substring(pos, msg.length) + msg.substring(0, pos);

    pos++;

    if (pos > msg.length) pos = 0;

    window.setTimeout("ScrollMessage()",200);

    }

    ScrollMessage();

    </script>

    </head>

    <body>

    <h1>Scrolling Message Example</h1>

    ```'
