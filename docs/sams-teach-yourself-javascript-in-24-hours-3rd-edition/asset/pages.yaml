  md: "Improving a Web Page with JavaScript\n\n# Quiz\n\nTo test your knowledge of\
    \ JavaScript’s uses in improving Web pages, answer the following questions.\n\n\
    # Questions\n\n+   1. In the navigation script, what does document.navform.category.selectedIndex\
    \ refer to?\n   a. The number of the currently selected option\n   b. The text\
    \ of the currently selected option\n   c. An index to another document\n2. When\
    \ creating rollovers, which HTML tag should include the onMouseover handler?\n\
    \   a. <a>\n   b. <img>\n   c. <mouse>\n3. What’s wrong with using the onmouseover=\"\
    window.status='test';\" handler for a link?\n   a. It should include a better\
    \ description of the link\n   b. It doesn’t return a value of onMouseOut\n   c.\
    \ It should read onMouseOut\n\n# Answers\n\n+   1. a. This refers to the number\
