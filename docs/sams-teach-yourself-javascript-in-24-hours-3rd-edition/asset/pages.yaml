    # # APPENDIX E


    # # DOM Quick Reference


    This appendix presents a quick overview of the DOM objects available, including
    the basic Level 0 DOM and the W3C Level 1 DOM.


    # ## DOM Level 0


    The Level 0 DOM includes objects that represent the browser window, the current
    document, and its contents. The following is a basic summary of Level 0 DOM objects.'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# Appendix E


    > For detailed information about the properties and methods of each of the objects
    in the Level 0 DOM, consult Netscape''s JavaScript Reference: http://developer.netscape.com/manuals/js/client/jsref/index.htm.


    # Window


    The window object represents the current browser window. If multiple windows or
    frames are used, there may be more than one window object. These are given aliases
    to distinguish them:


    +   - self represents the current window, as does. This is the window containing
    the current JavaScript document.

    - top is the window currently on top (active) on the screen.

    - parent is the window that contains the current frame.

    - The Frames array contains the window object for each frame in a framed document.


    The window object has three children:


    +   - location stores the location (URL) of the document displayed in the window.

    - document stores information about the current Web page.

    - The history object contains a list of sites visited before or after the current
    site in the window.


    # Location


    The location object contains information about the current URL being displayed
    by the window. It has a set of properties to hold the different components of
    the URL:


    +   - location.hash is the name of an anchor within the document, if specified.

    - location.host is a combination of the host name and port.

    - location.hostname specifies the host name.

    - location.href is the entire URL.

    - location.pathname is the directory to find the document on the host, and the
    name of the file.

    - location.port specifies the communication port.'
  merge: -1
  pgno: 410
- img_proc: true
  md: '+   * location.protocol is the protocol (or *method*) of the URL.

    * location.query specifies a query string.

    * location.target specifies the TARGET attribute of the link that was used to
    reach the current location.


    # # History


    The history object holds information about the URLs that have been visited before
    after the current one in the window, and includes methods to go to previous or
    next locations:


    +   * history.back goes back to the previous location.

    * history.forward goes forward to the next location.

    * history.go goes to a specified offset in the history list.


    # # Document


    The document object represents the current document in the window. It includes
    the following child objects:


    +   * document.forms is a collection with an element for each form in the document.

    * document.links is a collection containing elements for each of the links in
    the document.

    * document.anchors is a collection with elements for each of the anchors in the
    document.

    * document.images contains an element for each of the images in the current document.

    * document.applets is a collection with references to each embedded Java applet
    in the document.


    # # Navigator


    The navigator object includes information about the current browser version:


    +   * appName is the browser''s code name, usually “Mozilla.”

    * appName is the browser''s full name.

    * appVersion is the version number of the browser. (Example: “4.0(Win95;I)”).'
  merge: -1
