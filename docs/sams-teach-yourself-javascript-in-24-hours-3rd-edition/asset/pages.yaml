- img_proc: true
  md: 'You’ve probably already noticed the other problem with Internet Explorer 6.0’s
    User agent string; the portion reading Mozilla/4.0. Not only is IE claiming to
    be Netscape—it’s also masquerading as version 4.0. Why?


    As it turns out, this was another effort by Microsoft to stay one step ahead of
    the browser wars, although this one doesn''t make quite as much sense. Since poorly-written
    scripts were checking specifically for "Mozilla/4" for dynamic HTML pages, Microsoft
    was concerned that its 5.0 version would fail to run these pages. Since changing
    it now would only create more confusion, this tradition continues with IE 6.0.


    Microsoft isn’t alone in confusing browser IDs. Netscape version 6 displays a
    user agent string beginning with Mozilla/5, and an app version of 5.0. (Netscape
    5.0 is Netscape’s open-source browser, code named Mozilla, that formed the foundation
    of what is now Netscape 6.)


    Although there are two interesting episodes in the annals of the browser wars,
    what does this mean to you? Well, you’ll need to be careful when your scripts
    are to differentiate between IE and Netscape, and between different versions.
    For example, the following statement was presented earlier in this hour as an
    example of the navigator properties:


    ```

    if (navigator.userAgent.indexOf("Mozilla/4") == -1)

    window.location="non_netscape.html";

    ```


    As it turns out, this statement checks for the string Mozilla/4—which will allow
    either Netscape 4.x or Internet Explorer 4.x, even isn''t necessarily a bad thing,
    but what if you want to see specifically Netscape 4.0? In that case, you can be
    specific:


    ```

    if (navigator.appName.indexOf("Netscape") == -1

    || navigator.appVersion.indexOf("4.0") == -1)

    window.location="non_netscape.html";

    ```


    This longer statement first checks the navigator.appName property, which will
    contain the appropriate value of Netscape or Microsoft. Next, it checks the navigator.appVersion
    property. If the name isn''t Netscape or the version isn''t 4.0, it sends you
    to another page.


    This example uses the indexOf string method, which searches for a string within
    another string. To refresh your memory about this and other string functions,
    see Hour 5, "Using Strings and Arrays."'
