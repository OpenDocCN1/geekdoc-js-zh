  md: '# Creating DHTML Applications


    The first line defines a variable, pos, to store the current scroll position.
    Next, this function subtracts 1 from pos and checks its value. If the scrolling
    has reached the end, the function exits; otherwise, it sets the object position
    and calls the Scroll function using a timeout.


    > Notice the if statement at the beginning of the function. This is a simple example
    of feature sensing, described in Hour 20—if the browser doesn''t support the getById
    method, the function excites rather than causing errors.


    # Creating the HTML Document


    To complete the scrolling message, you can create an HTML document that defines
    the appropriate layers and includes the Scroll function. Listing 23.4 shows the
    complete HTML document.


    Listing 23.4 The HTML Document for the Scrolling Text Box


    ```

    <<html>n<head>

    <title>A HTML Scrolling Window</title>

    <script language="JavaScript" type="text/javascript">

    var pos=100;

    function Scroll() {

    if (!document.getElementById) return;

    obj=document.getElementById(''thetext'');

    pos = -1;

    if (pos < 0-obj.offsetHeight+130) return;

    obj.style.top=pos;

    window.setTimeout(Scroll();,30);

    }

    </script>

    </head>

    <body onload="Scroll();">

    <h1>Scrolling Window Example</h1>/h1

    <p>This example shows a scrolling window that shows a portion of a larger layer.</p>

    <div id="thewindow" style="position:relative;width:180;height:150; overflow:hidden;
    border-width:2px; border-style:solid; border-color:red">

    ```'
