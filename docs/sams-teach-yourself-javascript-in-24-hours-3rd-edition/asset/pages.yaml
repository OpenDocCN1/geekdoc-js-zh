    # Working with Substrings


    So far you''ve worked with entire strings. JavaScript also allows you to work
    with substrings, or portions of a string. You can use the substring method to
    retrieve a portion of a string, or the charAt method to get a single character.
    These are explained in the following sections.


    # Using Part of a String


    The substring method returns a string containing a portion of the original string
    between two indices, which you must specify in parentheses. For example, the following
    statement displays the fourth through sixth characters of the text string:


    ```

    document.write(text.substring(3,6));

    ```


    At this point, you''re wondering where the 3 and the 6 come from. There are three
    things you need to understand about the index parameters:


    +   - Indexing starts with 0 for the first character of the string, so the fourth
    character is actually 3.

    - The second index is non-inclusive. A second index of 6 includes up to index
    5 (the sixth character).

    - You can specify the two indexes in either order. The smaller one will be assumed
    to be the first index. In the previous example, (6,3) would have produced the
    same result. Of course, there is rarely a reason to use the reverse order.'
