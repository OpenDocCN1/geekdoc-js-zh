  md: '# Responding to Events


    You can also specify an onload event for the <body> tag. This event will be triggered
    whenever the browser unloads the current document—this occurs when another page
    is loaded or when the browser window is closed.


    # Workshop: Adding Link Descriptions to a Web Page


    One of the most common uses for an event handler is to display a message on the
    status line when the user moves the mouse over a link. For example, moving the
    mouse over the Order Form link might display a message like "Order a product or
    check order''s status" on the status line.


    Status line descriptions like these are typically displayed with the mouseover
    event handler. You will now create a script that displays messages in this manner
    and clears the message using the mouseout event handler. You''ll use functions
    to simplify the process.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_163_0.png)


    > When you use this technique, your status line message will replace the URL that
    is usually displayed there. Make sure your description is at least useful as the
    URL. All too often, Web designers use this technique to display a redundant message:
    For example, a link labeled "Order Form" displays the description "Goes to the
    Order Form."


    To begin the script, you will define a function to display a message on the status
    line. Although you don''t need to use a function, it makes your job a bit easier.
    For example, a link with an event handler that displays a message on the status
    line might look like this:


    ```

    <a href="order.html" onmouseover="window.status=''Order a product''; return true;"OrderForm"></a>

    ```


    In this example, the return true statement is necessary to prevent the status
    message from being overwritten immediately by the URL. As you can see, this makes
    the <a> tag complicated—and there isn''t even a way to clear the message.'
