- img_proc: true
  md: '# Using Graphics and Animation


    +   - You can replace an image with a larger or smaller image, but this may not
    look good because the text won''t be reformatted to match.

    - Any image you use will have to be loaded from the server. This makes this technique
    impractical for complicated animations or large images.


    | Dynamic images are part of JavaScript 1.1, supported in Netscape 3.0 and later,
    as well as Internet Explorer 4.0 and later. |


    # Working with the images Array


    You can change images dynamically by using the images array. This array contains
    items for each of the images defined on the page. Each image can also have a name.
    In the object hierarchy, each image object is a child of the document object.


    Each image object has the following properties:


    +   - border represents the BORDER attribute of the <img> tag. This defines whether
    a border is drawn around a linked image.

    - complete is a flag that tells you the image has been completely loaded. This
    is a Boolean value (true or false).

    - height and width represent the corresponding image attributes. This is for information
    only; you can''t change an image''s size dynamically.

    - hspace and এলিট represent the corresponding image attributes, which define the
    image''s placement on the page. Again, you can define this with the NAME attribute
    in the image definition.

    - name is the image''s name. lowsrc is the value of the LOWSRC attribute. This
    is a Netscape-specific attribute that enables you to specify a low-resolution
    image to be loaded before the “real” image.

    - src is the image''s source, or URL. You can change this value to change images
    dynamically.


    For most purposes, the src attribute is the only one you''ll use. However, you
    can also change the lowsrc attribute. This defines a low-resolution image to load
    first and will be used only when you change the src attribute.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_209_0.png)'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'The image object has no methods. It does have three event handlers you can
    use:


    +   - The OnLoad event occurs when the image finishes loading. (Since the OnLoad
    event for the entire document is triggered when all images have finished loading,
    it''s usually a better choice.)

    - The OnAbort event occurs if the user aborts the page before the image is loaded.

    - The OnError event occurs if the image file is not found or corrupt.


    # # Preloading Images


    Although you can add an image to the page dynamically, you can create an independent
    image object. This enables you to specify an image that will be loaded and placed
    in the cache, but will not be displayed on the page.


    This may sound useless, but it''s a great way to work with modem-connections.
    Once you''ve preloaded an image, you can replace any of the images on the page
    with that image—and because it''s already cached, the change happens instantly.


    You can cache an image by creating a new image object, using the new keyword.
    Here''s an example:


    ```

    Image2 = new Image();

    Image2.src = "arrow1.gif";

    ```


    > You learned about the new keyword and its other uses for object-oriented programming
    in Hour 15, “Creating Custom Objects.”


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_210_0.png)


    # # Creating Rollovers


    The most common use of JavaScript''s dynamic image feature is to create rollovers,
    which are images that change when you move the mouse pointer over them.


    Rollovers are usually used for images that are links. Using this feature, you
    can highlight the current link with a different color or a border, or by changing
    the image entirely.


    You can turn an image into a rollover by adding an onmouseover event handler that
    replaces the image with a highlighted version and an onmouseout handler that returns
    the original image. Listing 13.2 shows an example that uses four images as rollovers.'
  merge: -1
