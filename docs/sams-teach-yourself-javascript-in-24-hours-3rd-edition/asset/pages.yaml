    # Working with Style Sheets


    Welcome to Part V! In the next three hours, you''ll learn how to use some of the
    more recent additions to the Web developer''s arsenal, and how to use JavaScript
    to control these features.


    This hour begins with an introduction to style sheets, which you can use to take
    more control over the browser displays your document. You can also use JavaScript
    with style sheets to change the display dynamically.


    Hour 18 covers the following topics:


    +   * Why style sheets are needed

    * How to define Cascading Style Sheets (CSS)

    * How to use a style sheet in a document

    * Using an external style file

    * Using JavaScript to change styles dynamically


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_279_0.png)'
