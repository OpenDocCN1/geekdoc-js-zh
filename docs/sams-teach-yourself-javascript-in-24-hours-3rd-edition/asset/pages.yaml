  md: '# Appendix E


    +   - userAgent is the user-agent header, which is sent to the host when requesting
    a web page. It includes the entire version information, such as

    "Mozilla/4.5(Win95;I)"


    +   - plugIns is a collection, which contains information about each currently-available
    plugin-in (Netscape only).


    +   - mimeTypes is a collection containing an element for each of the available
    MIME types (Netscape only).


    # DOM Level 1


    The Level 1 DOM is the first-browser DOM standardized by the W3C. Its objects
    are stored under the document object of the Level 0 DOM.


    # Basic Node Properties


    Each object has certain common properties:


    +   - nodeName is the name of the node (not the ID). The name is the tag name
    for HTML tags, #document for the document node, and #text for text nodes.


    +   - nodeType is a number describing the node''s type: 1 for HTML tags, 3 for
    text nodes, and 9 for the document.


    +   - nodeValue is the text contained within a text node.


    +   - innerHTML is the HTML contents of a container node.


    +   - id is the value of the ID attribute for the node.


    +   - className is the value of the class attribute for the node.


    # Relationship Properties


    The following properties describe an object''s relationship with others in the
    hierarchy:


    +   - firstChild is the first child node for the current node.


    +   - lastChild is the last child object for the current node.


    +   - childNodes is an array of all of the child nodes under a node.


    +   - previousSibling is the sibling before the current node.


    +   - nextSibling is the sibling after the current node.


    +   - parentNode is the object that contains the current node.'
  merge: -1
  pgno: 412
- img_proc: true
  md: '# Offset Properties


    While not part of the W3C DOM, Netscape and Internet Explorer support the fol-lowing
    properties that provide information about a node''s position:


    +   - offsetLeft is the distance from the left-hand side of the browser window
    or containing object to the left edge of the node object.

    - offsetTop is the distance from the top of the browser window or containing object
    to the top of the node object.

    - offsetHeight is the height of the node object.

    - offsetWidth is the width of the node object.


    # Style Properties


    The style child under each DOM object includes its style sheet properties. These
    are based on attributes of a style attribute, <style> tag, or external style sheet.
    See Hour 18, "Working with Style Sheets," for details on these properties.


    # Node Methods


    The following methods are available for all DOM nodes:


    +   - appendChild(node) adds a new node to the node after all of its existing
    children.

    - insertBefore(node,oldnode) inserts a new node before the specified existing
    child node.

    - replaceChild(node,oldnode) replaces the specified old child node with a new
    node.

    - removeChild(node) removes an existing child node.

    - hasChild() returns a Boolean value if the node has one or more children, or
    false if it has none.

    - cloneNode() returns a copy of the current node.

    - getAttribute(attribute_name) gets the value of the attribute you specify and
    stores it in a variable.

    - setAttribute(attribute_name, value) sets the value of an attribute.

    - removeAttribute(attribute_name) removes the attribute you specify.

    - hasAttributes() simply returns true if the node has attributes, and false if
    it has none.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_413_0.png)'
