  md: '# Creating Cross-Browser Scripts


    This statement checks for the existence of the images array. If it exists, the
    browser likely supports dynamic images—if it doesn''t exist, this statement won''t
    cause an error and you''ll know dynamic images aren''t supported.


    Feature sensing has some advantages: First, it doesn''t rely on specific browser
    versions, so a new browser release is less likely to break your script. Second,
    it''s often easier dealing with all of the possible navigator properties used
    in different browsers.


    > Feature sensing is especially useful when dealing with Dynamic HTML. You''ll
    learn more about it and create some examples in Hour 19, "Using Dynamic HTML (HTML)."


    # Supporting Non-JavaScript Browsers


    What about browsers that don''t support JavaScript at all? You can''t detect them
    with a script because they won''t run the script. However, there are ways of dealing
    with these browsers.


    With 99% of users using a recent copy of Netscape or IE, where are the non-JavaScript
    browsers? First, there are still some older browsers out, and text browsers such
    as Lynx don''t support scripting. Second, and more importantly, Netscape and IE
    users have JavaScript turned off, either due to security concerns or to avoid
    scrolling messages in the status line.


    In the last years, a wide variety of browsers have also emerged. Palmtop computers,
    such as 3Com''s PalmPilot and the Windows CE platform, support Web browsing, as
    do some cellular phones and other appliances. Since none of these support JavaScript,
    it''s even more important to provide an alternative when possible.


    One way to be friendly to non-JavaScript browsers is to use the <script> tag.
    Supported in Netscape 3.0 and later, this tag displays a message to non-JavaScript
    browsers. Browsers that support JavaScript ignore the text between the <script>
    tags, while others display it. Here is a simple example:


    ```

    <script>

    This page requires JavaScript. You can download a copy

    of netscape from a <a href="http://www.netscape.com/">> their page,

    or switch to the <a href="nojs.html">Non-JavaScript</a> version of

    this page.

    </script>

    ```'
