  md: '# Units for Style Sheets


    Style sheet properties support a wide variety of units, or types of values you
    can specify. Most properties accept a numeric value support the following types
    of units:


    +   * px: Pixels (for example, 15px). Pixels are the smallest addressable units
    on a computer or other device. In devices with non-typical resolutions (handheld
    computers) the browser may rescale the value to fit the device.

    * pt: Points (for example, 10pt). Points are a standard unit for font size. The
    size of text of a specified point size varies depending on the monitor resolution.
    Points are equal to 1/72 of an inch.

    * em: Approximate height of the x in the current font (for example, 1.2ex).

    * em: Approximate width of the m in the current font (for example, 1.5em). This
    is usually equal to the font-size property for the current element.

    * %: Percentage of the containing object''s value (for example, 150%).


    Which unit you choose to use is generally a matter of convenience. Point sizes
    are commonly used for fonts, pixel units for the size and position of layers or
    other objects, and so on.


    # Creating a Simple Style Sheet


    As an example of CSS, you can now create a Web page that uses a wide variety of
    styles:


    +   * For the entire body, the text is blue.

    * Paragraphs are centered and have a wide margin on either side.

    * Level 1, 2, and 3 headings are red.

    * Bullet lists are boldface green by default.


    The following is the CSS style to define these properties, using the <style> tags:


    ```

    <style type="css/css">

    BODY {color: blue}

    P {text-align: center;

    margin-left:20%;

    margin-right:20%}

    H1, H2, H3 {color: red}

    UL {color: green;

    font-weight: bold}

    </style>

    ```'
