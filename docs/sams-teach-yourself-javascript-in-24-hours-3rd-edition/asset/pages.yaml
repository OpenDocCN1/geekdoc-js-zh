  md: '# Learning Advanced JavaScript Techniques


    Although you''ve now learned all the essentials of the JavaScript language, there
    is still much to learn. JavaScript can be used to script environments other than
    the Web, and features such as signed scripts can allow you to create more powerful
    JavaScript applications.


    Here are some ways you can further your JavaScript education:


    +   * See Appendix A, “Other JavaScript Resources,” for a list of JavaScript books
    and Web pages with further information.

    * While the core JavaScript language is in place, be sure to follow the latest
    developments. The Web sites in Appendix A and this book''s site (www.jworkshop.com)
    will let you know when changes are on the way.

    * Be sure to spend some time practicing the JavaScript techniques you''ve learned
    throughout this book. You can use them to create much more complex applications
    than those you''ve worked with so far.


    # Future Web Technologies


    The Web has practically appeared out of nowhere over the course of a few years,
    and is continually changing. In the following sections, you will explore some
    of the upcoming—and already developed—technologies that will affect your pages
    and scripts.


    # Future versions of JavaScript


    Since this is a book about JavaScript 1.5, you should be aware that JavaScript
    has gone through several versions to reach its current status. Fortunately, the
    core language hasn''t changed much through these version changes, and nearly all
    scripts written for older versions will work on the latest version.


    The next version of JavaScript is likely to be version 2.0. While no date has
    been announced for its release, Netscape''s development team and the ECMA agency
    are working on its specification. Version 2.0''s main change will be the addition
    of three object-oriented features, such as classes and inheritance.


    As with previous versions, version 2.0 should be backward compatible with older
    versions. To be sure your scripts work under version 2.0, follow the standard
    language features and do not rely on any undocumented or browser-specific features.'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# JavaScript Tips and Tricks


    # Future DOM Versions


    Currently, the W3C DOM level 1 is an official specification, while level 2 is
    only a recommendation. Level 2 adds features such as event handling and better
    style sheet support, and is already supported by Netscape 6.0, and Internet Explorer
    5.0 and later.


    In the future, expect better browser support for the DOM, and less compatibility
    between browsers. Future DOM versions will undoubtedly add more features, but
    no documentation yet exists for these versions.


    # XML (Extensible Markup Language)


    HTML wasoriginally created as a language for the Web, and was based on an older
    standard for documentation SGML (Standard Generalized Markup Language). HTML is
    a multi-simplified version of SGML, specifically designed for Web documents.


    A relatively new language on the scene is XML (Extensible Markup Language). While
    XML is also a simplified version of SGML, it isn''t nearly as simple as HTML.
    While HTML has a specific purpose, XML can be used for virtually any purpose.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_375_0.png)


    > The W3C (World-wide Web Consortium) developed XML, and has published a specification
    to standardize the language.


    Strictly speaking, XML isn''t a language in itself—there is no concise list of
    XML tags because XML has no set of list. Instead, XML allows you to create your
    own languages for whatever purpose you choose.


    So what is use of a language without any specific commands? Well, XML allows you
    to define languages for any purpose you choose. If you were storing recipes, for
    you could create tags for ingredients, ingredient quantities, and instructions.


    XML uses a DTD (Document Type Definition) to define the tags used in a particular
    document. The DTD can be in a separate file or built into the document, and specifies
    which tags are allowed, their attributes, and what they can contain.


    XML is already in use today. Although it isn''t directly supported by Web browsers,
    you can use a program on the server to parse XML documents into HTML documents
    before sending them to the browser.'
  merge: -1
  pgno: 375
- img_proc: true
  md: 'To return to the recipe example, an XML processor could convert each recipe
    into HTML. The reason for doing this is simple: By changing the rules in the parser,
    you could change the entire format of all of the recipes—a difficult task to perform
    manually if you had thousands of recipes.


    # XSL (Extensible Stylesheet Language)


    XML documents focus strictly on the meaning of the tags—content—ignore presentation.
    The presentation of XML can be determined by creating an XSL (Extensible Stylesheet
    Language) style sheet.


    XSL is based on XML, but specifies presentation—parameters such as font size,
    margins, and table formatting—for an document. When you use an XML processing
    program to create HTML output, it uses an XSL stylesheet to determine the HTML
    formatting of the output.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_376_0.png)


    | XML documents are actually XML documents, using their own DTD specifies tags.
    XSL is a newer W3C specification |


    # Planning for the Future


    In the history of JavaScript, there has never been such a major change to the
    language that a great number of scripts written using the older version have stopped
    working. Nevertheless, many scripts have been crippled by new releases—namely
    those that used browser-specific features.


    The following examples offer some guidelines that you can follow in writing scripts
    to ensure the impact of future JavaScript versions and browser releases will be
    minimal.


    # Keeping Scripts Compatible


    Right now, dynamic HTML (DHTML) is in use on many Web pages. The new W3C DOM standards
    the objects used for dynamic HTML, but it was not available when the vast majority
    of these pages were created. Thus, they use a number of techniques to offer the
    latest dynamic features:


    +   - Browser detection is separated to support Netscape and Internet Explorer,
    or in some cases a specific browser is required.

    - Scripts are written to work around bugs in browsers, or sometimes take advantage
    of them.

    - The process of writing scripts often involves trial and error rather than consulting
    official documentation.'
  merge: -1
  pgno: 376
- img_proc: true
  md: '# JavaScript Tips and Tricks


    While the W3 DOM will solve these issues when it is widely supported, there will
    always be brand new features that are not part of the official DOM specification
    and will be subject to change.


    There''s nothing wrong with using these features—if you do, you should be aware
    that you''re going to test the scripts on several different browsers. Additionally,
    if you''ve used non-standard features, you will eventually have to rewrite the
    scripts to use standard features.


    # Staying HTML Compliant


    One trends as browsers is that new browsers tend to do a better job of following
    the W3C standard for HTML—and often, relying on it. This means that while a page
    uses completely standard HTML will likely work in future browsers, one that uses
    browser-specific features or workarounds is bound to have problems eventually.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_377_0.png)


    > In particular, the first release of Netscape 6.0 received many complaints about
    “breaking” previously working pages. In most cases, the page used bad HTML, and
    previous browsers happened to handle the error gracefully.


    To avoid these problems, try to use valid HTML whenever possible. This means not
    only using standard tags and attributes, but following certain formatting rules:
    For example, using both opening and closing <p> tags, and enclosing numbers for
    table widths and other parameters in quotation marks.


    To be sure your documents follow the HTML standard, see Appendix B, “Tools for
    JavaScript Developers,” for suggested HTML validation programs and services. These
    will examine your document and point out any areas that do not comply with the
    HTML standard.


    # Document Everything


    Last but not, be sure you understand everything your scripts are doing. Document
    your scripts using comments, and particularly document any statements that may
    look cryptic or were particularly hard to get working properly.


    If your scripts are properly documented, it will be a much easier process if you
    have to modify them to be compatible with a future browser, JavaScript, or DOM
    version.'
