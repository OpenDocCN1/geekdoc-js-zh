  md: '+   - overflow indicates whether the clipping rectangle cuts off the item or
    a scroll bar allows viewing the rest of the item. Values include visible, hidden,
    scroll to display scroll bars, auto to let the browser decide whether to display
    scroll bars, or inherit to a parent object''s setting.


    # Using Visibility Properties


    Along with positioning objects, you can use CSS positioning to control whether
    the objects are visible at all, and how the document is formatted around them.
    These properties control how objects are displayed:


    +   - display specifies whether an item is displayed in the browser. A value of
    "none" hides the object. Other values include block to display the object preceded
    followed by line breaks, inline to display it without line breaks, and list-item
    to display it as part of a list.


    +   - visibility specifies whether an item is visible. Values include visible
    (default), hidden, and inherit. A value of inherit means the item inherits the
    visibility of any item it appears within (such as a table or paragraph).


    # Setting Background and Border Properties


    You can use the following properties to set the color and background image for
    a layer or other object and control whether borders are displayed:


    +   - background-color specifies the color for the background of any text in the
    layer.


    +   - background-image specifies a background image for any text in the layer.


    +   - border-width sets the width of the border for all four sides. This can be
    a numeric value or the keywords thin, medium, or thick.


    +   - border-style sets the style of border. Values include none (default), dotted,
    dashed, solid, double, groove, ridge, inset, or outset.


    +   - border-color sets the color of the border. As other color properties, this
    can be a named color such as blue or an RGB color such as #FF0A5.


    # Controlling Positioning with JavaScript


    As you learned in the previous hour, you can control the style attributes for
    an object with the attributes of the object''s style property. You can control
    the positioning attributes listed in the previous section the same way.'
