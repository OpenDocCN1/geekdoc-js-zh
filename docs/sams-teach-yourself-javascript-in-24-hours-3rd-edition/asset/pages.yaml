  md: '# Q&A


    +   Q What if my page requires a particular plug-in? Is there a way to detect
    with JavaScript?


    +   A Yes, navigator object includes properties for detecting plug-ins. These
    are described in Hour 16, “Working with Sounds and Plug-Ins.” However, this method
    doesn''t work in Internet Explorer.


    +   Q Can I detect the user’s email address using the navigator object or another
    technique?


    +   A No, there is no reliable way to detect users’ email addresses using JavaScript.
    (If there was, you would get hundreds of advertisements in your mailbox every
    day from companies that detected your address as you You can use a signed script
    to obtain the user’s email address, but this requires the user’s permission and
    only works in some versions of Netscape.


    +   Q Do I need to worry about browsers besides Netscape and Internet Explorer,
    since they don''t support JavaScript anyway?


    +   A Actually, there is a Windows browser called Opera that supports JavaScript,
    and you never know when a new browser may come out. It''s always best to support
    all of them if you can. To learn more about Opera, visit its Web page at www.operasoft.com.


