    \ document's onload method.\n\nThe two lines of the ScrollMessage function scroll\
    \ the message within the newtext string. The function assigns the td variable\
    \ to the table cell where the scrolling is happening using getElementById, and\
    \ sets the cell's text node value to the new version of the message.\n\nFinally,\
    \ the counter is updated for the current scroll position, and the setTimeout method\
    \ is used to call the ScrollMessage function again after a short delay. Figure\
    \ 20.4 shows this example in Netscape 6."
