  md: '# Using window Objects


    At the top of the browser object hierarchy is the window object, which represents
    a browser window. You''ve already used a few methods and properties of the window
    object:


    +   - You used the window.status property to change the contents of the browser''s
    status line.

    - The window.alert, window.confirm, and window.prompt methods display message
    dialogues to the user.


    There can be several window objects at a time, representing an open browser window.
    Frames are also represented by window objects. You''ll learn more about window
    objects and frames in Hour 11, "Using Windows and Frames."


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_142_0.png)


    > Layers, which allow you to include, modify, and position dynamic content within
    a Web document, are also similar to window objects. These are explained in Hour
    19, "Using Dynamic HTML (HTML)."


    # Working with Web Documents


    The document object represents a Web document, or page. Web documents are displayed
    within browser windows, so it shouldn''t surprise you to learn that the document
    object is a child of the window object.


    Because the window object always represents the current window (the one containing
    the script), you can use window.document to refer to the current document. You
    can simply refer to document, which automatically refers to the current window.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_142_1.png)


    > You''ve already used the document.write method to display text within a Web
    document. The examples in earlier hours used only a single window and document,
    so it was unnecessary to use window.document.write—but this longer syntax would
    have worked equally.


    If multiple windows or frames are in, there might be several window objects, each
    with its own document object. To use one of these document objects, you use the
    name of the window and the name of the document.


    In the following sections, you will look at some of the properties and methods
    of the document object that will be useful in your scripting.'
