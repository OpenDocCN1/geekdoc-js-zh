    # Accessing Browser History


    The history object is another child (property) of the window object. This object
    holds information about the URLs that have been visited before and after the current
    one, and it includes methods to go to previous or next locations.


    The history object has one property you can access:


    +   - history.length keeps track of the length of the history list—in other words,
    the number of different locations that the user has visited.


