  md: '# Workshop: Working with Arrays and Loops


    To apply your knowledge of loops, you will now create a script that deals with
    arrays using loops. As you progress through this script, try to imagine how difficult
    it would be without JavaScript''s looping features.


    This simple script will prompt the user for a series of names. After all of the
    names have been entered, it will display the list of names in a numbered list.
    To begin the script, initialize some variables:


    ```

    names = new Array();

    i = 0;

    ```


    The array will store the names the user enters. You don''t know how many names
    will be entered, you don''t need to specify a dimension for the array. The i variable
    will be used as a counter in the loops.


    Next, use the prompt statement to prompt the user for a series of names. Use a
    loop to repeat the prompt for each name. You want the user to enter at least one
    name, so a do loop is ideal:


    ```

    do {

    next = prompt("Enter the Next Name", "");

    if (next > "*") names[i] = next;

    i = i + 1;

    } while (next > "*");

    ```


    > If you''re interested in making your scripts as short as possible, remember
    that you could use the increment (++) operator to combine the i = i + 1 statement
    with the previous statement.


    This loop prompts for a string called next. If a name was entered and isn''t blank,
    it''s stored as the next entry in the names array. The i counter is then incremented.
    The loop repeats until the user doesn''t enter a name or clicks Cancel in the
    prompt dialog.


    Next, your script can display the number of names that were entered:


    ```

    document.write("<h2>" + (names.length) + " names entered.\</h2>");

    ```


    This statement displays the length property of the names array, surrounded by
    level 2 header tags for emphasis.'
