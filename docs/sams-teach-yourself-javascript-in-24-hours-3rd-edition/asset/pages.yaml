  md: '# APPENDIX B


    # Tools for JavaScript Developers


    One of the best things about JavaScript is that it requires no specialized tools—all
    you need to start scripting is a Web browser and a simple text editor. Nonetheless,
    tools are available that will make scripting easier. Some of these are described
    in this appendix.


