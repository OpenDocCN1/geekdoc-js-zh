  md: "# Debugging JavaScript Applications\n\nAs you can see from the alert message,\
    \ it's no wonder you didn't win: The random number the computer picked includes\
    \ more than 10 decimal places, and you've been guessing integers. You could guess\
    \ decimal numbers, but you'd need a whole lot more than 10 guesses, and the game\
    \ would start to lose its simplicity and charm.\n\nTo fix this problem, look at\
    \ the statement at the beginning of the script that generates the random number:\n\
    \n```\nvar num = Math.random() * 100 + 1;\n```\n\nThis uses the Math.random method,\
    \ which results in a random number between 0 and 1. The number is multiplied and\
    \ incremented to result in a number between 1 and 100.\n\nThis statement does\
    \ produce a number between 1 and 100, but not an integer. To fix the problem,\
    \ you can add the Math.floor to chop the decimal portion of the number. Here's\
    \ a corrected statement:\n\n```\nvar num = Math.floor(Math.random()) * 100 + 1;\n\
    ```\n\nTo fix the script, make this change and test it again. If you play a game\
    \ or two, you'll find that it works just fine. Listing 17.3 shows the complete,\
    \ debugged script.\n\n# List 17.3 The complete, debugged number guesser script\n\
    \n```\n<html>\n<head>\n<title>Guess a Number</title>\n<script LANGUAGE=\"JavaScript\"\
    \ type=\"text/javascript\">\nvar num = Math.floor(Math.random()) * 100 + 1;\n\
    var tries = 0;\nfunction Guess() {\n  var g = document.form1.guess1.value;\n \
    \ tries++;\n  status = \"Tries: \" + tries;\n  if (g < num) {\n    document.form1.hint.value\
    \ = \"No, guess higher.\";\n  }\n  if (g > num) {\n    document.form1.hint.value\
    \ = \"No, guess lower.\";\n  }\n  if (g == num) {\n    window.alert(\"Correct!\
    \ You guessed it in \" + tries + \" tries.\");\n    location.reload();\n  }\n\
    \  if (tries == 10) {\n    window.alert(\"Sorry, time's up. The number was: \"\
    \ + num);\n    location.reload();\n  }\n}\n</script>\n</head>\n</html>\n```"
