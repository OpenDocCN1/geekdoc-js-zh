- img_proc: true
  md: '# Understanding JavaScript


    Server-side programs are heavily used on the Web. Any time you type information
    into a form and press a button to send it to a Web site, the data is processed
    by a server-side application.


    The main difference between JavaScript and server-side languages is that JavaScript
    applications execute on the client (the Web browser) and server-side applications
    execute on the Web server. The main disadvantage of this approach is that, the
    data must be sent to the Web server and back, response time may be slow.


    On the other hand, CGI can do what JavaScript can''t. In particular, it can read
    and write files on the server and interact with other server components, such
    as databases. While a client-side JavaScript program can read information from
    a form and then manipulate it, it can''t store the data on the Web server.


    > CGI and Server-side programming are outside the focus of this book. You can
    learn more about these technologies with Sams books, including Teach Yourself
    CGI Programming in 24 Hours, Teach Yourself Perl in 24 Hours, and Teach Yourself
    PHP in 24 Hours. See Appendix A, "Other JavaScript Resources", for more sources
    of information.


    # Summary


    During this hour, you''ve learned what Web scripting is and what JavaScript is.
    You''ve also learned how to insert a script into an HTML document or refer to
    an external JavaScript file, and how JavaScript differs from other Web languages.


    If you''re waiting for some real JavaScript code, look no further. The next hour,
    "Creating a Simple Script," guides you through the process of creating a working
    JavaScript application.


    # Q&A


    +   Q If I plan to learn Java or CGI anyway, will I have any use for JavaScript?


    +   A Certainly. JavaScript is the ideal tool for many applications, such as validation.
    While Java and CGI have their uses, they can''t do all that JavaScript can.


    +   Q Can a page include more than one set of <script> tags?


    +   A Yes. In fact, the larger scripts in this book will include two or more script
    sections. You can also include <script> tags that include JavaScript code and
    <script> tags that reference external JavaScript files in the same HTML file.'
