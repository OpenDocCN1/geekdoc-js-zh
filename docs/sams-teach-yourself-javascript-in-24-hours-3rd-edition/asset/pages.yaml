  md: '# HOUR 17


    # Debugging JavaScript Applications


    You''ve reached the end of Part IV. As you move on to more advanced JavaScript
    applications in the remaining hours, it''s important to know how to deal with
    problems in your scripts.


    In this hour, you''ll learn a few pointers on keeping your scripts bug-free, and
    you''ll look at the tools and techniques you can use to find and eliminate bugs
    when they occur. Hour 17 covers the following topics:


    +   * Using good programming practices to avoid bugs

    * Tips for debugging with the JavaScript console

    * Using alert messages and status messages to debug scripts

    * Creating custom error handlers

    * Debugging an actual script'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Avoiding Bugs


    A bug is an error in a program that prevents it from doing what it should do.
    If you''ve tried writing any scripts on your own, you''ve probably run into one
    or more bugs. If not, you will—no matter how careful you are.


    Although you''ll undoubtedly run into a few bugs if you write a complex script,
    you can avoid any others by carefully writing and double-checking your script.


    # Using Good Programming Practices


    There''s not a single programmer out programs always work the first time, without
    any bugs. However, good programmers share a few habits that help them avoid some
    of the more common bugs. Here are a few habits you can develop to improve your
    scripts:


    +   - Format your scripts neatly and try to keep them readable. Use consistent
    spacing and variable names that mean something. It''s hard to determine what''s
    wrong with a script when you can''t remember what a particular line does.

    - Similarly, use JavaScript comments literally to document your script. This will
    help you if you need to work on the script after you''ve forgotten the details
    of how it works—or if someone else inherits the job.

    - End all JavaScript statements with semicolons. Although this is optional, it
    makes the script more readable. Additionally, it may help the browser to produce
    error messages.

    - Declare all variables with the var keyword. This is optional in most cases,
    but it will help make sure you really mean to create a new variable and avoid
    problems with variable scope.

    - Divide complicated scripts into functions. This will make the script easier
    to read, and it will make it easy to pinpoint the cause of a problem.

    - Write a large script in several phases and test the script at each phase before
    adding more features. This way, you can avoid having several new errors appear
    at once.


    # Avoiding Common Mistakes


    Along with following scripting practices, you should also watch for common mistakes
    in your scripts. Different people make different mistakes in JavaScript programming,
    but the following sections explore some of the most ones.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Debugging JavaScript Applications


    # Syntax Errors


    A syntax error is an incorrect keyword, operator, punctuation mark, or other item
    in a script. Most often, it''s caused by a typing error.


    Syntax errors are usually obvious—both to when you look at the script and to the
    browser''s JavaScript interpreter when you load the script. These errors usually
    result in an error message and can easily be corrected.


    # Assignment and Equality


    One of the most common syntax errors made by beginning JavaScript programmers
    is confusing the assignment operator (= with the equality operator (=). This can
    be a hard error to spot it may not result in an error message.


    If you''re confused about operator to use, follow this simple rule: use = to change
    the value of a variable and == to compare two values. Here''s an example of a
    statement that confuses the two:


    If (a = 5) alert(''found a five.'');


    The statement looks logical enough, but a = 5 will actually assign the 5 to a
    variable rather than comparing the two. Netscape usually detects this type of
    error and displays an error message in the JavaScript console, but the opposite
    type of error == when you mean =) may not be detected.


    # Local and Global Variables


    Another common mistake is confusing local and global variables, such as trying
    to use the value of a variable that was declared in a function outside the function.
    If you need to do this, you should either use a global or return a value from
    the function.


    > Hour 4, "Using Functions and Variables," describes the differences between local
    and global variables in detail.


    # Using Objects Correctly


    Another common error is referring to JavaScript objects incorrectly. It''s important
    to use the correct object names and to remember when to explicitly name the parent
    of an object.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_263_0.png)'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'For example, you can usually refer to the window.alert method as simply alert.

    However, there are some cases when you must use window.alert, such as in some
    event handlers. If you find that alert or another method or property is not recognized
    by the browser, try specifying the window object.


    Another common mistake is to assume that you can omit the document object''s name,

    such as using write instead of document.write. This won''t work because most scripts

    have a window object as their scope.


    # HTML Errors


    Last but not, don''t forget that JavaScript isn''t the only language that can
    have

    ers. It''s easy to accidentally create an error in an HTML document—for example,

    getting to include a closing <table> tag, or even a closing </script> tag.


    While proper HTML is beyond the scope of this book, you should be aware that\sometimes
    improper HTML can cause errors in your JavaScript. When you experience

    bugs, be sure to double-check the HTML, especially the objects (such as forms
    or

    images) that your script manipulates.


    # Basic Debugging Tools


    If checking your script for common mistakes and obvious problems doesn''t fix
    things,

    it''s time to start debugging. This is the process of finding errors in a program
    and elimi-

    ating them. Some basic tools for debugging scripts are described in the following
    sec-

    tions.


    # Netscape''s JavaScript Console


    The first thing you should do if your script doesn''t work is check for error
    messages. In

    Netscape 4.5 and later, the messages are not displayed by default, but are logged
    to the

    JavaScript console.


    To access the console, type javascript: in Netscape''s Location field or select
    Tasks,

    Tools, JavaScript Console from the menu. The console displays the last error mes-

    sages that have occurred, as shown in Figure 17.1.


    Along with reading the error messages, you can use the console to type a JavaScript

    command or expression and see its results. This is useful if you need to make
    sure a line

    of your script uses the correct syntax.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Debugging JavaScript Applications


    Figure 17.1.


    The JavaScript console displays recent error messages.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_265_0.png)


    Some versions of Netscape 6 do not accept the javascript: command. You should
    still be able to access the console by selecting Tasks, Tools, JavaScript Console
    from the menu.


    # Displaying Error Messages in Internet Explorer


    Microsoft Internet Explorer 4.0 and later do not display JavaScript error messages
    by default. While this can make poorly-written pages a more pleasant experience,
    it can be frustrating to JavaScript programmers.


    If you haven''t enabled the display of error messages, Internet Explorer still
    displays an error icon on the status line when an error occurs. You can double-click
    this icon to display the error message.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Alert Messages and the Status Line


    Netscape''s JavaScript console is a better debugging tool than Internet

    Explorer''s error messages, so you may want to test your scripts in Netscape

    e if IE is your default browser. More importantly, you should test all

    scripts in both browsers to ensure compatibility.


    If you''re lucky, the error messages in the console will tell you how to fix your
    script.

    However, your script may not generate any error messages at all—but fail to work

    correctly. In this case, the real debugging process begins.


    One useful debugging technique is to add temporary statements to your script to
    let

    know what''s going on. For example, you can use an alert message to display the
    value of

    a variable. Once you understand what''s happening to the variable, you can figure
    out

    what''s wrong with your script.


    You can also display messages on the status line using the window.status property.
    This

    technique is especially useful when you are displaying lots of messages and don''t

    to acknowledge a dialog box for each one.


    > You can also display debugging information in a separate browser window

    or frame. You can use document.write in some cases, but this only works

    when the document hasn''t finished loading yet and thus isn''t a reliable

    debugging tool.


    # Using Comments


    When all fails, you can use JavaScript comments to eliminate portions of your
    script

    until the error goes away. If you do this carefully, you can pinpoint the place
    where the

    er occurred.


    You can use // to begin a single-line comment, or /* and */ to surround a section
    of any

    length. Using comments to temporarily turn off statements in a program or script
    is

    called commenting out and is a common technique among programmers.


    > JavaScript comments were introduced and described in more detail in Hour

    3, “How JavaScript Programs Work."'
  merge: -1
