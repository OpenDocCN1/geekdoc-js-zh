  md: '# Debugging JavaScript Applications


    Congratulations—you’re nearing the final hours of your JavaScript education. In
    the next three years, you will learn how you can use Dynamic HTML (DHTML) to add
    sophisticated effects to your scripts.


    # Q&A


    +   - Why are some errors displayed after the script runs for a time, while others
    are displayed when the script loads?


    +   - The JavaScript interpreter looks scripts in the body or heading of the document,
    such as function definitions, when the page loads. Event handlers aren’t checked
    until the event happens. Additionally, a statement might look fine when the page
    loads, but will cause an error because the value of a variable it uses later.


    +   - What is the purpose of the location.reload statements in the number guesser
    script?


    +   - This is an easy way to start a new game because reloading the page reinitializes
    the variables. This results in a new number being picked, and the default “Guess
    a Number” message is displayed in the hint field.


    +   - The JavaScript console in Netscape is useful for testing JavaScript commands
    when I’m not sure of the syntax. Is there an equivalent in Internet Explorer?


    +   - Not a built-in one, but I’ve created a JavaScript-based console that works
    in Netscape or Internet Explorer. It can’t display errors like Netscape’s console,
    but it is useful for testing commands interactively. You can find it at this book’s
    Web site: http://www.javascriptworkshop.com.


    # Quiz


    Test your knowledge of avoiding and debugging JavaScript errors by answering the
    following questions.


    # Questions


    +   1. If you mistype a JavaScript keyword, which type of error is the result?


    +   a. Syntax error


    +   b. Function error


    +   c. Pilot error'
