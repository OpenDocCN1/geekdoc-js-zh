  md: '# Creating the Graphics


    To begin creating the rollers, you will need to create graphics for the links.
    For each one, you''ll need a highlighted and unhighlighted version. The highlighting
    can be a different color, an added line or circle, or anything you want.


    For this example, I''ve created graphics for the major links: Spreadsheet, Word
    Processor, Database, and Order Form. The highlighted versions are negatives of
    the normal graphics. For simplicity, call the standard graphics spread.gif, word.gif,
    data.gif, and order.gif. The highlighted versions will have an added number 2,
    as in order2.gif.


    > When you''re creating graphics for rollers, remember that the highlighted and
    unhighlighted versions of an image must be the same size. Otherwise, the images
    may be distorted or not be replaced correctly.


    # Creating Event Handlers


    Once you''ve created the graphics, you simply need to add the graphic links with
    mouseOver and mouseOut event handlers. The following is the HTML for the graphics,
    including the event handlers:


    ```

    <a href="spread.html">

    mouseover="document.images[1].src=''spread.2.gif'';

    mouseout="document.images[1].src=''spread.gif'';

    <img BORDER=0 SRC="spread.gif" height=28 width=173"></a>

    <a href="word.html">

    mouseover="document.images[2].src=''word.2.gif'';

    mouseout="document.images[2].src=''word.gif'';

    <img BORDER=0 SRC="word.gif" height=28 width=225"></a>

    <a href="data.html">

    mouseover="document.images[3].src=''data.2.gif'';

    mouseout="document.images[3].src=''data.gif'';

    <img BORDER=0 SRC="data.gif" height=28 width=121"></a>

    <a href="order.html">

    mouseover="document.images[4].src=''order.2.gif'';

    mouseout="document.images[4].src=''order.gif'';

    <img BORDER=0 SRC="order.gif" height=28 width=152"></a>

    ```


    In this case, all the code for the rollover is included in the HTML event handler,
    rather than in a separate function. Each link''s event handlers change the source
    of the appropriate image when the mouse enters or exits the area.'
