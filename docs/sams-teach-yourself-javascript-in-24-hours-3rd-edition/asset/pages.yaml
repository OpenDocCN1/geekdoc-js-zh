    # Using the onLoad and onUnload Events


    Another event you''ll use frequently is onload. This event occurs when the current
    page (including all of its images) finishes loading from the server.


    The onload event is related to the document object, and to define it use an event
    handler in the `<body>` tag. For example, the following is a `<body>` tag that
    uses a simple event handler to display an alert when the page finishes:


    ```

    <body onload="alert(''Loading complete.'');">

    ```


    > Since the onload event occurs after the HTML document has finished loading and
    displaying, you cannot use the document.write or document.open statements within
    an onload event handler. This would overwrite the current document.


    In JavaScript 1.1 and later, images can also have an onload event handler. When
    you define an onload event handler for an `<img>` tag, it is triggered as soon
    as the specified image has completely loaded.'
