    \ you use the append method. The text can be added to any element that can contain\
    \ text, but we will use a paragraph. The following statement adds the text node\
    \ defined above to the paragraph with the identifier p1:\n\n```\ndocument.getElementById(\"\
    p1\").appendChild(node);\n```\n\nListing 20.3 shows the HTML document for a complete\
    \ example that uses this technique, using a form to allow the user to specify\
