  md: '# Testing and Comparing Values


    FIGURE 6.1.

    Prompting for a user response.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_109_0.png)


    # Summary


    In this hour, you''ve learned to use JavaScript statements such as if and else
    to test and compare values. You''ve also learned a quick way to test values with
    the ? operator, and used the switch statement to test for a number of different
    values. Finally, you''ve applied this technique by asking the user question and
    testing the answer.


    In the next hour, you''ll learn another fundamental JavaScript programming tool,
    loops, which you can use to make JavaScript perform repetitive tasks without repetitive
    coding.


    # Q&A


    +   * What happens if I compare two items of different data types (for example,
    a number and a string) in a conditional expression?


    +   The JavaScript interpreter does its best to make the values a common format
    and compare them. In this case, it would convert both to strings before comparing.
    In JavaScript 1.3 and later, you can use the special equality operator === to
    compare two values and their types—using this operator, the expression will be
    true only if the expressions have the same value and the same data type.'
