    # Q&A


    +   Besides parsing documents into HTML, what practical uses are there for XML?


    +   XML is a great way to store any type of marked-up text in a standardized way.
    Developers of many software applications, including popular word processors, are
    considering using XML-based files.


    +   Why should I care about users of limited browsers, such as Lynx?


    +   A Lynx is used by more people than you think (try it—it''s incredibly fast).
    More importantly, more and more people are accessing the Web with devices such
    as palmtop PCs and cell phones, which make Lynx look sophisticated by comparison.


