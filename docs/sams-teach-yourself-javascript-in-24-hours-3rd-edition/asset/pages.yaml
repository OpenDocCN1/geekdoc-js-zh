  md: '# HOUR 15


    # Creating Custom Objects


    Earlier in this book, you learned to use JavaScript''s built-in objects, such
    as Date. You''ve also learned about the objects in the DOM (Document Object Model),
    which allow you to manipulate Web documents. These are the most commonly used
    JavaScript objects, but you can also create custom objects.


    In this hour, you''ll learn how to create your own custom objects with JavaScript,
    and in the process learn a bit more how JavaScript handles all kinds of objects.
    Hour 15 covers the following topics:


    +   * How objects can simplify scripts

    * Defining an object

    * Adding methods to an object

    * Creating instances of an object

    * Using objects to store and manage data


    # Using Objects to Simplify Scripting


    Although JavaScript''s variables and arrays are versatile ways to store data,
    sometimes you need a more complicated structure. For example, suppose


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_237_0.png)'
  merge: -1
  pgno: 237
- img_proc: true
  md: "you are creating a script to work with a business card database that contains\
    \ names, addresses, and phone numbers for a variety of people.\n\nIf you were\
    \ using regular variables, you would need several separate variables for each\
    \ person in the database: a name variable, an address variable, and so on. This\
    \ would be very confusing.\n\nArrays would improve things slightly. You could\
    \ have a names array, an addresses array, and a phone number array. Each person\
    \ in the database would have an entry in each array. This would be more convenient,\
    \ but not perfect.\n\nWith objects, you can make the store database as logical\
    \ as business cards. Each person is represented by a Card object, which has properties\
    \ for name, address, and phone. You can even add methods to the object to display\
    \ or work with the information.\n\nIn the following sections, you'll use JavaScript\
    \ to actually create the object and its properties and methods. Later in this\
    \ hour, you'll use the Card object in a script to display information for several\
    \ members of the database.\n\n# Defining an Object\n\nThe first step in creating\
    \ an object is to name it and its properties. We've already decided to call the\
    \ object Card object. Each object will have the following properties:\n\n+   -\
    \ name\n- address\n- workphone\n- homephone\n\nThe first step in using this object\
    \ in a JavaScript program is to create a function to create new objects. This\
    \ function is the constructor for an object. Here is the constructor for the Card\
    \ object:\n\n```\nfunction Card(name,address,work,home) {\n  this.name = name;\n\
    \  this.address = address;\n  this.workphone = work;\n  this.homephone = home;\n\
    }\n```\n\nThe constructor is a simple function that accepts parameters to initialize\
    \ a new object and assigns them to the corresponding properties. This function\
    \ accepts several parameters from the statement that calls the function, and then\
    \ assigns them as properties of an object. Because the function is called Card,\
    \ the object is the Card object."
