    # # Getting Data with Forms


    In this hour you''ll explore one of the most powerful uses for JavaScript: working
    with HTML forms. You can use JavaScript to make a form more interactive, validate
    data the user enters, and enter data based on other data.


    This hour covers the following topics:


    +   - Understanding HTML forms

    - Creating a form

    - Using the form object to work with forms

    - How form elements are represented by JavaScript

    - Getting data from a form

    - Sending form results by email

    - How JavaScript can work with CGI forms

    - Validating a form with JavaScript'
