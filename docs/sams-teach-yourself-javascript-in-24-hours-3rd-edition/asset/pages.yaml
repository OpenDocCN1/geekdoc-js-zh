  md: "# Using Classes\n\nWhile the ID attribute is useful, you can only use each\
    \ unique ID with a single HTML tag. If you need to apply the same style to various\
    \ tags, you can use the CLASS attribute instead. For example, this HTML tag defines\
    \ a paragraph in a class called smallprint:\n\n```\n<p class=\"smallprint\">This\
    \ is the small print</p>\n```\n\nTo refer to a class within a style sheet, you\
    \ use a period followed by the class name. Here is a style sheet that defines\
    \ styles for the smallprint:\n\n```\n<style type=\"text/css\">\n.smallprint {color:\
    \ black;\n  font-size: 10px;\n}</style>\n```\n\n# Using CSS Properties\n\nCSS\
    \ supports a wide variety of properties, such as color and text-align in the previous\
    \ example. The following examples list some of the most useful CSS properties\
    \ for aligning text, changing colors, working with fonts, and setting margins\
    \ and borders.\n\n> This is only an introduction to CSS, and there are many properties\
    \ beyond those listed here. For more details about CSS, consult one of the Web\
    \ resources or books in Appendix A, \"Other JavaScript Resources.\"\n\n# Aligning\
    \ Text\n\nOne of the most useful features of style sheets is the capability to\
    \ change the spacing and alignment of text. Most of these features aren’t available\
    \ using standard HTML. You can use the following properties to change the alignment\
    \ and spacing of text:\n\n+   - letter-spacing—Specifies the spacing between letters.\n\
    - text-decoration—Allows you to create lines over, under, or through the text,\
    \ and to choose blinking text. The value can be none (default), underline, overline,\
    \ line-through, or blink. Blinking text is supported by Netscape 4 only.\n- vertical-align—Allows\
    \ you to move the element up or down to align with other elements on the same\
    \ line. The value can be baseline, sub, super, top, text-top, middle, text-bottom,\
    \ and bottom."
