  md: '# Hour 9


    You might find that the document.lastModified property doesn''t work on your Web
    pages. The date is received from the Web server, and some servers do not maintain
    modification dates correctly.


    # Writing Text in a Document


    The simplest document object methods are also the ones you will use most often.
    In fact, you''ve used one of them already. The document.write method prints text
    as part of the HTML page in a document window. This statement is used whenever
    you need to include output in a Web page.


    An alternative statement, document. inner prints text, but it also includes a
    new-line (

    ) character at the end. This is handy when you want your text to be the last thing
    on the line.


    > Bear in mind that the newline character is ignored by HTML, except inside the
    <pre> container. You will need to use the <br> tag if you want an actual line
    break.


    You can use these methods only within the body of the Web page, so they will be
    executed when the page loads. You can''t use these methods to add to a page that
    has already loaded without reloading it. You can write new content for a document,
    however, as the next section explains.


    > You can also directly modify the text of a page on newer browsers using the
    features of the new DOM. You''ll learn these techniques in Hour 20, "Using Advanced
    DOM Features."


