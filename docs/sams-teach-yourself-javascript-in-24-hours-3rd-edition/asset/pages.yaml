    # Workshop: Hiding Scripts from Older Browsers


    Older browsers don''t understand the <script> tag, they will not behave very well
    when they encounter a script in a Web page. In most cases, they will display the
    script in the middle of the page—probably not the effect you were looking for.


    To avoid this, you can enclose the script within HTML comment tags. This tells
    older browsers to ignore the script completely. Newer browsers are smart enough
    to know that your script isn''t a comment.


    HTML comments begin with the tag <!-- and end with the --> tag. Listing 2.4 shows
    a simple example of a script with comments.'
