    # JavaScript Statements


    This is an alphabetical listing of the statements available in JavaScript and
    its syntax.


    # Comments


    Comments are used to include a note within a JavaScript program, and are ignored
    by the interpreter. There are two different types of comment syntax:


    ```

    //this is a comment

    /* this is also a comment */

    ```


    Only the second syntax can be used for multiple-line comments; the first must
    be repeated on each line.


    # break


    This statement is used to break out of the current for or while loop. Control
    resumes after the loop, as if it had finished.


    # continue


    This statement continues a for or while loop without executing the rest of the
    loop. Control resumes at the next iteration of the loop.


    # for


    Defines a loop, usually to count from one number to another using an index variable.
    In this example, the variable i counts from 1 to 9:


    ```

    for (i=1;i<10;i++) { statements }

    ```'
