  md: "# Using Image Maps with JavaScript\n\nImage maps are a popular way to provide\
    \ navigation for a site. They’re images that are divided into a number of “hot\
    \ spots,” or areas act as links. Using JavaScript, you can perform script commands\
    \ when an area of the image is clicked.\n\n> There are two types of image maps:\
    \ client-side and server-side. Client-side maps define the linked areas of the\
    \ image within the HTML document, and thus can be used with JavaScript. Server-side\
    \ maps require a separate map definition file, and are handled by Web servers.\n\
    \nAs an example of using a client-side image map with JavaScript, let’s create\
    \ a simple image map menu for a fictional company. (The company’s name isn’t important,\
    \ but it’s obviously not a graphic design company.)\n\nTo create a client-side\
    \ map, you need to do three things:\n\n+   * Use your favorite graphics application\
    \ to create the actual graphic as a GIF or JPEG image.\n* Create a MAP definition\
    \ that describes areas in the image.\n* Include the image map in the document,\
    \ using the USEMAP attribute to point to the map definition.\n\nListing 13.1 shows\
    \ the example client-side image map definition.\n\n# Listing 13.1 Using a client-side\
    \ image map with JavaScript\n\n```\n<html>\n<head>\n<title>Image Map Example</title>\n\
    <script LANGUAGE=\"JavaScript\" type=\"text/javascript\">\nfunction update(t)\
    \ {\n  document.form1.text1.value = t;\n}\n</script>\n```"
  merge: -1
