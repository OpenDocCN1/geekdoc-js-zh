    # Creating Positionable Elements


    Netscape 4.0 included a <layer> tag, which defined a portion of the Web page that
    could be moved, or hidden separately from the rest of the page. While this was
    proprietary, the CSS (Cascading Style Sheets) specification also includes methods
    of positioning elements.


    Under the new DOM, you can control any element in the page. You can effectively
    create a layer, or a group of HTML objects that can be controlled using the <div>
    or <span> tags.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_300_0.png)


    The <div> and <span> tags are part of the HTML 3.0 standard. <span> defines an
    arbitrary section of the HTML document, and does not specify any formatting for
    the text it. <div> is similar, but includes a line break before after its contents.


    To create a layer with <div>, enclose the content of the layer between the two
    division tags and specify the layer''s properties in the style attribute of the
    <div> tag. Here''s a simple example:


    ```

    <DIV ID="layer1" STYLE="position:absolute; left:100; top:100">

    <p>This is the content of the layer.</p>

    </div>

    ```


    This code defines a layer with the name layer1. It is a movable layer positioned
    100 pixels down and 100 pixels to the right of the upper-left corner of the browser
    window. You''ll learn more about the layer properties in the next section.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_300_1.png)


    With all CSS properties, you can specify the position property and other layer
    properties in a <style> block, in an external style sheet, or in the style attribute
    of an HTML tag.'
