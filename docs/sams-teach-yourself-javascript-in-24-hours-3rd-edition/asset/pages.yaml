  md: "# Working with Sounds Plug-Ins\n\nYou can use these properties in a script\
    \ to find out about the installed plug-ins, as you’ll see in the next section.\n\
    \n> Netscape’s navigator object also has a child object mimeTypes, which includes\
    \ an array element for each MIME type supported by the browser or one of its plug-ins.\n\
    \n![](img/3ba9ce11a08220fe5348f94ec18e83ff_251_0.png)\n\n# Checking for Plug-Ins\n\
    \nIf you want to use a new plug-in on your pages, but you know that not every-one\
    \ has the plug-installed? One of the handiest uses for JavaScript is to detect\
    \ a plug-in before loading the page that contains plug-in content.\n\nFor example,\
    \ the following simple script checks for the QuickTime plug-in (or any other plug-in\
    \ that handles QuickTime movies). If a plug-in is found, the script writes the\
    \ `<embed>` tag to include a movie in. If not, it displays a still image.\n\n\
    ```\ntest=navigator.mimeTypes[\"video/quicktime\"];\nif (test)\n  document.writeln(`<embed\
    \ SRC='quick.mov' HEIGHT=100 WIDTH=100>`);\nelse\n  document.writeln(`<img SRC='quick.gif'\
    \ HEIGHT=100 WIDTH=100>`);\n```\n\nIf your script does not detect the appropriate\
    \ plug-in, you can provide a link to the download location for the plug-in or\
    \ to a non-plug-in version of the page.\n\n# Listing Plug-Ins\n\nAs an example\
    \ of the plugins array, you can use JavaScript to list the plug-ins supported\
    \ by your browser. Netscape 16.1 shows a script that lists the plug-ins in a table,\
    \ filenames and descriptions.\n\n# Listing 16.1 Listing plug-ins with JavaScript\n\
    \n```\n<html>\n<head>\n<title>List of Plug-Ins</title>\n</head>\n<body>\n<h1>List\
    \ of Plug-Ins</h1>\n<hr>\n<p>The following is a list of the plug-ins installed\
    \ in this copy of Netscape, generated using the JavaScript\n```"
