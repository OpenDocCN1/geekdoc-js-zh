  md: '# Creating a Simple Script


    You''ll need two other things to work with JavaScript: a Web browser and a computer
    to run it on. Since this book covers new features introduced to JavaScript 1.5,
    I recommend that you use the latest version of Netscape or Microsoft Internet
    Explorer. We see the Netscape or Microsoft Web site to download a copy:


    ```

    http://www.netscape.com/

    http://www.microsoft.com/

    ```


    As a minimum, you should have Netscape 4.5 or later, or Internet Explorer 4.0
    or later. Some of the advanced HTML features covered beginning with Hour 18 will
    require Netscape 6.0 or later, or Internet Explorer 5.0 or later.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_43_0.png)


    > If you plan on making your scripts available over the Internet, you''ll need
    a Web server, or access to one. However, you can use all of the JavaScript examples
    in this book directly from your computer''s hard disk.


    # What Time is It?


    One common and easy use for JavaScript is to display dates and times. Since JavaScript
    runs on the browser, the times it displays will be in the user''s current zone.
    However, you can also use JavaScript to calculate “universal” (UTC) time.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_43_1.png)


    > UTC stands for the French equivalent of Universal Coordinated Time, and is the
    new name for the old GMT (Greenwich Mean Time) standard. This is the time at the
    Prime Meridian, London, England.


    As a basic introduction to JavaScript, you will now create a simple script that
    displays the current time and the UTC time within a Web page.


    # Beginning the Script


    Your script, like most JavaScript programs, begins with the HTML <script> tag.
    As you learned in Hour 1, you use the <script> and </script> tags to enclose a
    script within the HTML document.'
  merge: -1
