  md: '# Working with Style Sheets


    # Working with Fonts


    Style sheets also allow you to control the fonts used on the Web document and
    how they are displayed. You can use the following properties to control fonts:


    +   - font-family— Specifies the name of a font, such as arial or hevetica, to
    use with the element. Because not all have the same fonts installed, you can list
    several fonts. The CSS specification also supports several generic font families
    that are guaranteed to be available: serif, sans-serif, cursive, fantasy, and
    monotone.

    - font-style— Specifies the style of a font, such as normal, italic, or oblique.

    - font-variant— This value is normal for normal text, and small-caps to display
    lowercase letters as small capitals.

    - font-weight— Allows you to specify the weight of text: normal or bold. You can
    also specify a numeric font weight for a specific amount of boldness.

    - font-size— The point size of the font.

    - font— This is a quick way to set all the properties in this list. You can list
    the values in a single font rule.


    # Margins and Borders


    Last but not, you can use style sheets to control the general layout of the page.
    The following properties affect margins, borders, the width and height of elements
    on the Web page:


    +   - margin-top, margin-bottom, margin-left, margin-right—These properties specify
    the margins of the element. You can specify the margins as an exact number or
    as percentages of the page''s width.

    - margin— Allows you to specify a single value for all four of the margins.

    - width— Specifies the width of an element, such as an image.

    - height— Specifies the height of an element.

    - float— Allows the text to flow around an element. This is particularly useful
    with images or tables.

    - clear— Specifies that the text should stop flowing around a floating image.


    > Along with these features, CSS style sheets allow you to create sections of
    the document that can be positioned independently. This feature is described in
    Hour 19, “Using Dynamic HTML (HTML).”


