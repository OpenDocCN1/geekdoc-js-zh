  md: '# Working with Sounds and Plug-Ins


    Figure 16.1. The list of plug-ins as displayed by Netscape.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_253_0.png)


    The properties and methods of the embed object depend on the plug-in use. For
    example, the LiveAudio plug-in includes play and stop methods for controlling
    audio output. Some plug-ins may not be scriptable at all.


    # Workshop: Playing Music with the Mouse


    As an example of controlling a plug-in with JavaScript, you will now create a
    script to play sounds. I''ve created some graphics that will resemble a piano
    keyboard and audio files for each note. Your script can detect mouse clicks on
    the keys and the appropriate notes.


    > You can download the audio files and graphics used in this example from this
    book''s Web site at http://www.jsworkshop.com.


    # Embedding the Sounds


    For this example, I''ve created sound files in WAV format for each the 13 notes
    in a single octave of a piano keyboard. Each file is named after the note it contains.
    Your HTML document will need to include these sounds using the <embed> tag.'
  merge: -1
