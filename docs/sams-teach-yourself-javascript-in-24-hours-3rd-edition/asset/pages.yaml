  md: '# Dealing with JavaScript Errors


    As you develop complex JavaScript applications, you''re going to run into errors
    from time to time. JavaScript errors are usually caused by mistyped JavaScript
    state-


    To see an example of a JavaScript error message, modify the statement you made
    in the previous section. We''ll use a common error: omitting one of the parentheses.
    Change the last document .write statement to read:


    ```

    document.write("</javascript");

    ```


    Save your HTML document again and load the document into the browser. Depending
    on the browser version you''re using, one of two things will happen: Either an
    error message be displayed, or the script will simply fail to execute.


    If an error message is displayed, you''re half way to fixing the problem by adding
    the missing parenthesis. If no error was displayed, you should configure your
    browser to dis-play error messages so that you can diagnose future problems:


    +   In Netscape Navigator 4.5 or later, type javascript:into the browser''s Location
    field to display the JavaScript console. On Netscape 6, you can also select Tasks,
    Tools, JavaScript Console from the menu. The console is shown in Figure 2.3, dis-playing
    the error message you created in this example.

    In Internet Explorer 4.0 or later, select Tools, then Internet Options. On the
    Advanced page, uncheck the box next to "Disable Script Debugging" and check the
    box next to "Display a notification about every error."


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_50_0.png)


    > Notice the field at the bottom of the JavaScript console allows you to type
    a JavaScript statement, which will be executed immediately. This is a handy way
    to test JavaScript''s features.


    The error we get in this is missing ) after argument list (Netscape) or Expected
    ) (Internet Explorer), which turns out to be exactly the problem. Be warned, however,
    that error messages aren''t always enlightening.


    While Internet Explorer displays error dialog boxes for each error, Netscape''s
    JavaScript Console displays a single list of errors and allows you to test commands.
    For this reason, you may find it useful to install Netscape for debugging and
    testing JavaScript, even if Internet Explorer is your primary browser.'
