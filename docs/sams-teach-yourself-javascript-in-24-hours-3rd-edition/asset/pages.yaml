- img_proc: true
  md: 'The following statement creates a new Card object called:


    tom = new Card("Tom Jones", "123 Elm Street", "555-1234", "555-9876");


    As you can see, creating an object is easy. All you do is call the Card() function
    with the object definition and give it the required attributes, in the same order
    as the definition.


    After this statement executes, a new object is created to hold Tom''s information.
    This is an instance of the Card object. Just as there can be string variables
    in a program, there can be several instances of an object you define.


    Rather than specify all the information for a card with the new keyword, you can
    assign them after the fact. For example, the following script creates an empty
    Card called holmes, and then assigns its properties:


    ```

    holmes = new Card();

    holmes.name = "Sherlock Holmes";nholmes.address = "221B Baker Street";nholmes.phone
    = "555-2345";nholmes.homephone = "555-3456";

    ```


    Once you''ve created an instance of the Card object using either of these methods,
    you can use the PrintCard() method to display its information. For example, this
    statement displays the properties of the tom card:


    ```

    tom.PrintCard();

    ```


    # Customizing Built-In Objects


    JavaScript includes a feature that enables you to extend the definitions of built-in
    objects. For example, if you find the String object doesn''t quite fit your needs,
    you can extend it, adding a new property or method. This might be very useful
    if you were creating a large script that used many strings.


    You can add properties and methods to an existing object using the prototype keyword.
    (A prototype is another name for an object''s definition, or constructor function.)
    The prototype keyword allows you to change the definition of an object outside
    its constructor function.


    As an example, let''s add a method to the String object definition. You will create
    a method called heading, which converts a string into an HTML heading. The following
    statement defines a string called title:


    ```

    title = "Fred''s Home Page";

    ```


    This statement would output the contents of the title string as an HTML Level
    1 header: document.write(title.heading(1));'
