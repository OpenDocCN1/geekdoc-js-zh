  md: '# Creating Cross-Browser Scripts


    In conclusion, don’t trust the code or app version properties, and always test
    your cross-browser scripts with several browsers before you put them online. In
    the Workshop section of this hour, you’ll learn a practical way to check specifically
    for 5.0 and later browsers.


    # Supporting Browsers with JavaScript


    If you’re using features that are on the cutting edge and require a particular
    browser or version, there are several ways of using JavaScript to steer users
    in the right direction. The following sections explain three different methods.


    # Creating a Browser-Specific Page


    The easiest solution—and least polite—is to pick a browser version to support
    and kick everyone who isn’t using it. This is easy to do with a script in the
    header or body of the page. Here’s a simple example:


    ```

    <script language="JavaScript" type="text/javascript">

    if (navigator.appName.indexOf("Netscape") == -1

    || navigator.app.Version.indexOf("5.0") == -1)

    window.alert("Download Netscape now, or else.");

    window.location = "http://www.netscape.com/";

    </script>

    ```


    If you’re using a non-Netscape browser or a version of Netscape other than 5.0/6.0,
    this script displays a rude message and sends you to Netscape’s Web page. Needless
    to say, there are more polite ways of saying this.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_229_0.png)


    > If you make a page browser-specific, be sure you have a good reason to do so.
    If others can display the page’s content—even if your cute buttons or animations
    don’t work—you should support them. Few users are willing to download a new browser
    just for your page, so you’ll be losing a good part of your audience.


    # Branching to Separate Pages


    In most cases, it’s not hard to support more than one browser. If you want to
    fine-tune your pages to display perfectly on both Netscape and IE, one convenient
    way is to create a separate version of the page for each browser. You can then
    use JavaScript to send the user to the appropriate page.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_229_1.png)'
