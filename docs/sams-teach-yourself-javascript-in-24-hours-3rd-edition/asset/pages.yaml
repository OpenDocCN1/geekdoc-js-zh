  md: '# Workshop: Creating a Navigation Frame


    A common use for frames is to display a navigation frame along the side or top
    of a page. Using frame objects, you can create a navigation frame that controls
    the document in another frame.


    To begin, you''ll need a document to define the frames. This is the simple part.
    Listing 11.5 defines a frameset with frames on the left and right.


    +   Listing 11.5 An HTML document to divide the window into two frames


    ```

    <html>

    <head>

    <title>Frame Navigation Example</title>

    </head>

    <frameset COLS="*,* SRC="left.html">

    <frame NAME="right" SRC="about:blank">

    </frameset>

    </html>

    ```


    Next, you will need the document for the left-hand frame, which will act as the
    navigation frame. Listing 11.6 shows the HTML document for this frame.


    +   Listing 11.6 The HTML document for the navigation frame


    ```

    <html>

    <head>

    <title>Navigation Frame</title>

    </head>

    <body>

    <p>

    Follow one of these links

    to load a page into the right-hand

    frame:

    </p>

    <ul>

    <li><a HREF="#"\onclick="parent.right.location=''order.html'';

    window.location=''ordernav.html'';"></a>

    Order form=c</a>

    <li><a HREF="#"

    onclick="parent.right.location=''email.html'';

    window.location=''emailnav.html'';"></a>

    ```'
