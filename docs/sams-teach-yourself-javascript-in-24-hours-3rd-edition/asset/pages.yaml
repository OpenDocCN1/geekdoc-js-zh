  md: '# Understanding the Document Object Model


    +   - Using objects for links and anchors

    - Using the location object to work with URLs

    - Getting information about the browser with the navigator object

    - Creating JavaScript-based Back and Forward buttons


    One advantage that JavaScript has over basic HTML is that scripts can manipulate
    the Web document and its contents. Your script can load a new page into the browser,
    work with parts of the browser window and document, open new windows, and even
    modify text within the page dynamically.


    To work with the browser and documents, JavaScript uses a hierarchy of parent
    and child objects called the Document Object Model, or DOM. These objects are
    organized into a tree-like structure, and represent all of the content and components
    of a Web document.


    Like other objects you''ve explored, the objects in the DOM have properties, which
    describe the Web page or document, and *methods*, which allow you to work with
    parts of the Web page.


    When you refer to an object, you use the parent object name followed by the child
    object name or names, separated by periods. For example, JavaScript stores objects
    to represent images in a document as children of the document object. The following
    refers to the image9, a child of the document object, which is a child of the
    window object:


    ```

    window.document.image9

    ```


    The window object is the parent object for all the objects we will be looking
    at in this hour. Figure 9.1 shows this section of the DOM hierarchy and a variety
    of objects.


    Figure 9.1. The JavaScript browser object hierarchy.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_140_0.png)'
