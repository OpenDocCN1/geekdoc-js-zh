  md: '# Responding to Events


    +   * event.keyCode: The key code (in Unicode) for the key that was pressed.

    * event.srcElement: The object where the element occurred.


    # Netscape event Properties


    The following are some of the commonly used properties of the event object for
    Netscape 4.0 and later.


    +   * event.modifiers: Indicates which modifier keys (SHIFT, CTRL, ALT, etc.)
    were held down during the event. This value is an integer that combines binary
    values representing the different keys.

    * event.pageX: The x-coordinate of the event within the Web page.

    * event.pageY: The y-coordinate of the event within the Web page.

    * event.which: The keycode for keyboard events (in Unicode), or the button that
    was pressed for mouse events (1 for the left, 3 for the right).

    * event.target: The object where the element occurred.


    > The event.pageX and event.pageY are based on the top-left corner of the element
    where the event occurred, not always the exact position of the mouse pointer.


    # Using Mouse Events


    JavaScript includes a number of event handlers for detecting mouse actions. Your
    script can detect the movement of the mouse pointer and when a button is clicked,
    released, or both.


    # Over and Out


    You''ve already seen the first and most common event handler, onmouseover. This
    handler is called when the mouse pointer moves over a link or some other object.


    The onmouseout handler is the opposite—it is called when the mouse pointer moves
    out of the object''s border. Unless something strange happens, this always happens
    some time after the on event is called.


    This handler is particularly useful if your script has a change when the pointer
    moved over the object—for example, displaying a message in the status line or
    changing an image. You can use an onmouseout handler to properties to undo the
    action when the pointer moves away.'
