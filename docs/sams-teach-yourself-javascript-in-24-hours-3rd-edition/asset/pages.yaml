  md: '# Creating Custom Objects


    Notice the this keyword. You''ll use it anytime you create an object definition.
    Use this to refer to the current object—the one that is being created by the function.


    # Defining an Object Method


    Next, you will create a method to work with the Card object. Because all objects
    will have the same properties, it might be handy to have a function that prints
    out the properties in a neat format. Let''s call this function PrintCard.


    Your PrintCard function will be used as a method for Card objects, you don''t
    need to ask for parameters. Instead, use this keyword to refer to the current
    object''s properties. Here is a function definition for the PrintCard():


    ```

    function PrintCard() {

    line1 = "Name: " + this.name + "<br>\n";nline2 = "Address: " + this.address +
    "<br>\n";nline3 = "Work Phone: " + this.workphone + "<br>\n";nline4 = "Home Phone:
    " + this.homephone + "<br>\n";ndocument.write(line1, line2, line3, line4);

    }

    ```


    This function simply reads the properties from the current object (this), prints
    each one with a caption, and skips to a new line.


    You now have a function that prints a card, but it''s isn a method of the Card
    object. The last thing you need to do is make PrintCard part of the function definition
    for Card objects. Here is the modified function:


    ```

    function Card(name,address,work,home) {

    this.name = name;

    this.address = address;

    this.workphone = work;

    this.homephone = home;

    this.PrintCard = PrintCard;

    }

    ```


    The added statement looks like another property definition, but it refers to the
    PrintCard function. This will work so long as the PrintCard function is defined
    with its own function definition.


    # Creating an Object Instance


    Now let''s use the object definition and method you created above. To use an object
    definition, you create a new object. This is done with the new keyword. This is
    the same keyword you''ve already used to create Date and Array objects.'
  merge: -1
