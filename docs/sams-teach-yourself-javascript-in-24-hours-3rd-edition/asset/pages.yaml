  md: "# How JavaScript Programs Work\n\n# Loops\n\nAnother useful feature of JavaScript—and\
    \ most other programming languages—is the ability to create loops, or groups of\
    \ statements that repeat a certain number of times. For example, these statements\
    \ display the alert 10 times, annoying the user:\n\n```\nfor (i=1;i<=10;i++) {\n\
    \  Alert('Yes, it's yet another alert!');\n}\n```\n\nThe for is one of several\
    \ statements JavaScript uses for loops. This is the sort of thing computers are\
    \ supposed to be good at: repetitive tasks. You will use loops in your scripts,\
    \ in much more useful ways than this example.\n\n![](img/3ba9ce11a08220fe5348f94ec18e83ff_59_0.png)\n\
    \nLoops are covered in detail in Hour 7, \"Repeating Yourself: Using Loops.\"\n\
    \n# Which Script Runs First?\n\nAs you learned in Hour 1, you can actually have\
    \ scripts within a Web document: one or more sets of <script> tags, and any number\
    \ of event handlers. With all of these scripts, you might wonder how the browser\
    \ knows which to execute first. Frequently, this is done in a logical fashion:\n\
    \n+   - Sets of <script> tags within the <head> section of an HTML document are\
    \ handled first. These scripts cannot create output in the Web page, it's a good\
    \ place to define functions for later use.\n- Sets of <script> tags within the\
    \ <body> section of the HTML document are executed after those in the <head> section,\
    \ while the Web page loads and displays. If there is more than one script in the\
    \ body, they are executed in order.\n- Event handlers are executed when their\
    \ events happen. For example, the onload handler is executed when the body of\
    \ a Web page loads. Since the <head> section is loaded before any events, you\
    \ can define functions there and use them in event handlers.\n\n# Workshop: Using\
    \ Comments\n\nIn Hour 2, you used HTML comments to hide your script from older\
    \ browsers. JavaScript also includes its own type of comments. While these won't\
    \ hide JavaScript from anyone or anything, they are useful for their intended\
    \ purpose—commenting on your script."
