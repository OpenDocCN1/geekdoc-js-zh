  md: "An additional logical operator is the And operator, &&. Consider this statement:\n\
    \n```\nif (phone == \"\" && email == \"\") window.alert(\"Both are Missing!\"\
    );\n```\n\nThis statement uses && (And) instead of || (Or), so the error message\
    \ will only be displayed if both the email address and phone number variables\
    \ are blank. (In this particular case, or is a better choice.)\n\n> If the JavaScript\
    \ interpreter discovers the answer to a conditional expression before reaching\
    \ the end, it does not evaluate the rest of the condition. For example, if the\
    \ first of two conditions separated by the && operator is false, the second is\
    \ not evaluated. You can take this to improve the speed of your scripts.\n\nThe\
    \ third logical operator is the exclamation mark (!), which means Not. It can\
    \ be used to invert an expression—in other words, a true expression would become\
    \ false, and a false one would become true. For example, here's a statement that\
    \ uses the Not operator:\n\n```\nif (phone != \"\") alert(\"phone is OK\");\n\
    ```\n\nIn this case, the (!Not) operator is used as part of the not-equal operator,\
    \ !=. This operator inverts the condition, so the action of the if statement is\
    \ executed only if the phone number variable is not blank.\n\n> The logical operators\
    \ are powerful, but it's easy to accidentally create an impossible condition with\
    \ them. For example, the condition (a < 10 && a > 20) might look correct at first\
    \ glance. However, if you read out loud, you get \"If a is less than 10 and is\
    \ greater than 20\"—an impossibility in our universe. In this case, or ((||))\
    \ should be used.\n\n# The else Keyword\n\nAn additional feature of the if statement\
    \ is the else keyword. Like its English equivalent, else tells the JavaScript\
    \ interpreter what to do if the condition isn't true. The following is a simple\
    \ example of the else keyword in action:\n\n```\nif (a == 1) {\n  alert('Found\
    \ a 1!');\n  a = 0;\n} else {\n  alert('Incorrect value: \" + a);\n}\n```"
