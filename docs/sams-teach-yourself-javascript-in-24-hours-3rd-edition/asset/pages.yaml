    # 9 HOUR


    # Working with the Document Object Model


    You''ve arrived at Part III of this book. (If you''ve been reading nonstop, it''s
    been eight hours, so you might want to get sleep before you continue.) In this
    part, you''ll explore some of the most important objects used with JavaScript.


    In Hour 8, “Using Math and Date Functions;” learned about JavaScript''s support
    for objects, which allow you to store data in all sorts of interesting ways. However,
    the objects you''ll use the most are those in the Document Object Model (DOM),
    which let your scripts manipulate Web pages, windows, and documents.


    In this hour, you will explore this hierarchy of objects. Hour 9 covers the following
    topics:


    +   - How to access the various objects in the DOM

    - Working with windows using the window object

    - Working with Web documents with the document object'
