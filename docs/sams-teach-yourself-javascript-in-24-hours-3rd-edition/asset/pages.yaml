  md: '# A few JavaScript Tips


    You''ve nearly reached the end of your 24-hour JavaScript education. Before you
    start madly scripting on your latest project, here are a few final tips to keep
    in mind:


    +   1. First, avoid gratuit use of JavaScript or its features. While you may get
    a kick out of watching your page''s title wiggle back and forth as your script
    manipulates it using the DOM, does such a feature really add to your page?

    2. Next, be careful that your scripting doesn''t take away normal browser conveniences.
    As an example, while you can display friendly descriptions on the status line
    when the user hovers over your links, doing this on external sites eliminates
    the browser''s display of the URL, which is a useful feature.

    3. Another common example is pages that create their own JavaScript window of
    a set size. While this is sophisticated, it takes away the normal functionality
    of Back and Forward buttons, and often the status line. Worse, these pages often
    keep small and silly when I see them taking up a tiny portion of my monitor.

    4. Be sure you really need it before using a brand-new JavaScript feature. While
    it may be flashy or even add value to your page, be aware that the latest features
    may be enjoyed by only those users who are using brand-new browsers, and new features
    often have unexpected bugs. If you do use new features, be sure to browser checking
    to include them only when the latest browsers are in use.

    5. Finally, make sure your page scales down gracefully. Test it with other browsers,
    and with non-JavaScript browsers. While these browsers may not be to see your
    newest cosmetic improvements, make sure they can least navigate your page and
    read its text.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_378_0.png)


    > One very scaled-down browser is Lynx, a text-based browser. To find out about
    it and try it on your pages, see the Lynx Links site at http://www.trill-home.com/lynx.html.


    # Workshop: Using Cookies


    You''ve learned a bit in your 24-hour exploration of JavaScript. Just to prove
    that there''s more to learn if you choose, here''s a final lesson on a useful
    JavaScript feature for advanced scripts.


    Cookies allow you to store one or more variables on the user''s computer. This
    allows your Web pages to remember key information—for example, a username or the
    current score in an online game.'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# JavaScript Tips and Tricks


    | Cookies are one of the most controversial—and confusing—Web features. Despite
    security and privacy fears, this is a feature that is quite useful and quite safe
    if used properly |


    Unlike regular JavaScript variables, cookies are persistent—once you''ve set one,
    it will be available to your script each time the user views your page until the
    cookie reaches the expiration date you''ve set. They''re a great way to recognize
    previous visitors or to let the user avoid using the same information over and
    over.


    # Setting a Cookie


    Cookies are specific to a single Web page. You can set one or more cookies using
    the document.cookie property. To set a cookie, you just need to specify a name
    for the cookie, and an expiration date:


    ```

    name=window.prompt("Please enter your name,\*");

    d = new Date();

    d.setFullYear(d.getFullYear() + 1);

    expires="expires=" + d.toUTCString();

    document.cookie="Username=" + name + "; " + expires;

    ```


    This example prompts for a name and sets a cookie called Username to store the
    name. The variable is used to store the expiration date, which is set one year
    in the future. The user name is Fred, the cookie value will look something like
    this:


    Username=Fred; expires= Fri, 25 Apr 2084 08:14:05 UTC


    To delete a cookie, you simply re-set it using an expiration in the past. You
    can set an existing cookie to a new value.


    | There is a limit of 20 cookies per domain (including all sites on the domain),
    so make sure you use as few cookies as possible. You can combine multiple values
    into a single cookie to avoid this limitation.


    # Reading a Cookie


    As you might have guessed, reading a cookie is as simple as reading the document.cookie
    property. However, this property includes all the cookies for the current page—since
    there might be more than one, you need to use some string functions to extract
    the cookie you want. The following example finds the Username cookie''s value:'
  merge: -1
  pgno: 379
