  md: "# Using Multiple Conditions with switch\n\nOften, you'll use several statements\
    \ in a row to test for different conditions. Here is one example of this technique:\n\
    if (button==next\") window.location=\"next.html\";\nif (button==previous\") window.location=\"\
    prev.html\";\nif (button=\"home\") window.location=\"home.html\";\nif (button=\"\
    back\") window.location=\"menu.html\";\n\nAlthough is a compact way of doing things,\
    \ this method can get messy if each statement has its own block of code with several\
    \ statements. As an alternative, JavaScript includes the switch statement, which\
    \ allows you to combine several tests of the same variable or expression into\
    \ a single block of statements. The following shows the example converted to use\
    \ switch.\n\n![](img/3ba9ce11a08220fe5348f94ec18e83ff_106_0.png)\n\n> The switch\
    \ statement is included in JavaScript 1.2 and later. Be sure your browser supports\
    \ this version before you try the examples. To ensure that your scripts won't\
    \ cause errors, specify the LANGUAGE=\"JavaScript1.2\" parameter in the <script>\
    \ tag.\n\n```\nswitch(button) {\n  case \"next\":\n    window.location=\"next.html\"\
    ;\n    break;\n  case \"previous\":\n    window.location=\"prev.html\";n    break;\n\
    \  case \"home\":\n    window.location=\"home.html\"\n    break;\n  case \"back\"\
    :\n    window.location=\"menu.html\";n    break;\n  default:\n    window.alert(\"\
    Wrong button.\");\n}\n```\n\nThe switch statement has several components:\n\n\
    +   - The initial switch statement. This statement includes the value to test\
    \ (in this case, button) in parentheses.\n- Braces ({ and }) enclose the contents\
    \ of the switch statement, similar to a function or an if statement."
  merge: -1
  pgno: 106
