  md: "+   - `hasChildNodes()` returns a boolean value of true if the object has one\
    \ or more child nodes, or false if it has none.\n\n+   - `cloneNode()` creates\
    \ a copy of an existing node. If a parameter of true is supplied, the copy will\
    \ also include any child nodes of the original node.\n\n# # Hiding and Showing\
    \ Objects\n\nWe will now move on to a number of real-world examples using the\
    \ DOM objects to manipulate Web pages. As a simple example, you can create a script\
    \ that hides or shows objects within a page.\n\nAs you learned in Hour 18, “Working\
    \ with Style Sheets,\" objects have a visibility property that specifies whether\
    \ they are currently visible within the page:\n\n```\nObject.style.visibility='hidden';\
    \ // hides an object\nObject.style.visibility='visible'; // shows an object\n\
    ```\n\nUsing this property, you can create a script that hides or shows objects\
    \ in either browser. Listing 20.1 shows the HTML document for a script that allows\
    \ two headings to be shown or hidden.\n\n# ## Listing 20.1 Hiding and Showing\
    \ Objects\n\n```\n<html>\n<head>\n<title>Hiding and Showing Objects</title>\n\
    <script type=\"text/javascript\">\nfunction Show() {\n  var head1 = document.getElementById('head1');\n\
    \  var head2 = document.getElementById('head2');\n  var show1 = document.form1.head1.checked;\n\
    \  var show2 = document.form1.head2.checked;\n  head1.style.visibility = (show1)\
    \ ? \"visible\" : \"hidden\";\n  head2.style.visibility = (show2) ? \"visible\"\
    \ : \"hidden\";\n}\n</script>\n</head>\n<body>\n<h1 id=\"head1\">This is the first\
    \ heading</h1>\n<h1 id=\"head2\">This is the second heading</h1>\n<p>Using the\
    \ W3C DOM, you can choose\nwhether to show or hide the headings on\nthis page\
    \ using the checkboxes below.</p>\n<form name=\"form1\">\n```"
