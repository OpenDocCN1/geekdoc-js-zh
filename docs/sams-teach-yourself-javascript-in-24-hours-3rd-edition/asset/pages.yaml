  md: '# Q&A


    +   Q Can I avoid assigning an ID attribute to every DOM object I want to handle
    with a script?


    +   A Yes. While the scripts in this hour typically use the ID attribute for convenience,
    you can accurately locate any object in the page using combinations of node properties
    such as firstChild and nextSibling.


    +   Q Can I include HTML tags, such as <b>, in the new text I assign to a text
    node?


    +   A nodes are limited to text if you use the nodeValue attribute. However, the
    innerHTML property does not have this limitation and can be used to insert any
    HTML.


    +   Q Is there a reference that specifies which DOM properties and methods work
    in which browser versions?


    +   A Yes


    +   a. para1.value="New Text";


    +   b. para1.firstChild.nodeValue="New Text";


    +   c. para1.nodeValue="New Text";


    +   2. Which of the following DOM objects never has a parent node?


    +   a. body


    +   b. div


    +   c. document


    +   3. Which of the following is the correct syntax to get the DOM object for
    a heading with the identifier head1?


    +   a. document.getElementById("head1")


    +   b. document.GetElementById("head1")


    +   c. document.getElementsById("head1")'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# Answers


    +   1. b. The actual text is the nodeValue attribute of the text node, which is
    a child of the paragraph node.


    +   2. c. The document object is the root of the DOM object tree, and has no parent
    object.


    +   3. a. getElementById has a lowercase “g” at the beginning, and a lowercase
    “d” at the end, contrary to what you might know about normal English grammar.


    # Exercises


    If you want to gain more experience using the DOM in JavaScript, try these exercises:


    +   Add a third check box to Listing 20.1 to allow the paragraph of text to be
