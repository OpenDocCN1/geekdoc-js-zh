  md: '# Getting Information About the Document


    Several properties of the document object include information about the current
    document in general:


    +   - document.URL specifies the document''s URL. This is a simple text field.
    You can''t change this property. If you need to send the user to a different location,
    use the window.location object, described later in this hour.

    - document.title lists the title of the current page, defined by the HTML <title>
    tag.

    - document.referrer is the URL of the page the user was viewing prior to the current
    page—usually, with the page with a link to the current page.

    - document.lastModified is the date the document was last modified.

    - document.bgColor and document.fg are the background and foreground (text) colors
    for the document, corresponding to the BGCOLOR and TEXT attributes of the <body>
    tag.

    - document.linkColor, document.linkColor, and document.vlinkColor are the colors
    for links within the document. These correspond to the LINK, ALINK, and VLINK
    attributes of the <body>.

    - document.cookie allows you to read or set a cookie for the document. See Hour
    24, "JavaScript Tips and Tricks", for information about cookies.


    As an example of a document property, Listing 9.1 shows a short HTML document
    that displays its last modified date using JavaScript.


    # LISTING 9.1 Displaying the last modified date


    ```

    <html><head><title>Test Document</title></head>

    <body>

    <p>This page was last modified:

    <script language="JavaScript" type="text/javascript">

    document.write(document.lastModified);

    </script>

    </p><br>

    </html>

    ```


    This can tell the user when the page was last changed. If you use JavaScript,
    you don''t have to remember to update the date each time you modify the page.
    (You could also use the script to always print the current date, but that would
    be cheating.)'
