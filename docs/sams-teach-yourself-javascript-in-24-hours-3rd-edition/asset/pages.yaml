    editors are available. These allow you to easily create Web documents, either
    by automating the process of entering tags, or by presenting you with an environment
    for directly creating styled text.


    # HomeSite


    HomeSite, from Macromedia, is a full-featured HTML editor. It is similar to a
    text editor, but includes features to automatically add HTML tags, and to easily
    create complicated HTML elements as tables.'
