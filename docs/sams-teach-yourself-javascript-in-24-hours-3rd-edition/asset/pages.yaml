  md: '# Creating an Infinite Loop


    The for and while loops give you a bit of control over the loop. In some cases,
    they can cause problems if you''re not careful. For example, look at the following
    loop code:


    ```

    while (i < 10) {

    ++;

    values[n] = 0;

    }

    ```


    There''s a mistake in this example. The condition of the while loop refers to
    the variable, but that variable doesn''t actually change during the loop. This
    creates an infinite loop. The loop will continue executing until the user stops
    it, or until it generates an error of some kind.


    Infinite loops can''t always be stopped by the user—and some loops can even prevent
    the browser from quitting, or cause a crash.


    Obviously, infinite loops are something to avoid. They can also be difficult to
    spot because JavaScript won''t give you an error that actually tells you there
    is an infinite loop. Thus, each time you create a loop in a script, you should
    be careful to make sure there''s a way out.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_118_0.png)


    Depending on the browser version in, an infinite loop may even make the browser
    stop responding to the user. Be sure you provide an escape route from infinite
    loops, and save your script before you test it in case.


    Occasionally, you may want to create an infinite loop deliberately. This might
    include situations when you want your program to execute until the user stops
    it, or if you are providing an escape route with the break statement, which is
    introduced in the next section. Here''s an easy way to create an infinite loop:


    ```

    while (true) {

    ```


    Because the value true is the conditional, this loop will always find its condition
    to be true.


    # Escaping from a Loop


    There is one way out of an infinite loop. You can use the break statement during
    a loop to exit it immediately and continue with the first statement after the
    loop. Here is a simple example of the use of:'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Repeating Yourself: Using Loops


    ```

    while (true) {

    ++;

    if (values[n] == 1) break;

    }

    ```


    Although while statement is set up as an infinite loop, if the statement checks
    the corresponding value of an array. If it finds a value of i, it exits the loop.


    When the JavaScript interpreter encounters a break statement, it skips the rest
    of the loop and continues the script with the first statement after the right
    brace at the loop''s end. You can use the break statement in any type of loop,
    whether infinite or not. This provides an easy way to exit if an error occurs,
    or if another condition is met.


    # Continuing a Loop


    One statement is available to help you control the execution of statements in
    a loop. The continue statement skips the rest of the loop, unlike break, it continues
    with the next iteration of the loop. Here is a simple example:


    ```

    for (i=1; i<21; i++) {

    if (score[i]==0) continue;

    document.write("Student number " + i + " Score: " + score[i] + "\n");

    ```


    This script uses for loop to print out scores for 20 students, stored in the score
    array. The if statement is used to check for scores with a value of 0. The script
    assumes that a score of zero means the student didn''t take the test, so it continues
    the loop without printing that score.


    # Using for...in loops


    A third type of loop is available in JavaScript. The for...in loop is not as flexible
    as an ordinary or while loop. Instead, it is specifically designed to perform
    an operation on each property of an object.


    For example, the navigator object contains properties that describe the user''s
    browser, as you''ll learn in Hour 14, "Creating Cross-Browser Scripts." You can
    use for...in to display this object''s properties:


    ```

    for (i in navigator) {

    document.write("property: " + i);

    document.write(" value: " + navigator[i] + "<br>");

    }

    ```


    Like ordinary loop, this type of loop uses an index variable (i in the example).
    For each iteration of the loop, the variable is set to the next property of the
    object. This makes it easy when you need to check or modify any of an object''s
    properties.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_119_0.png)'
