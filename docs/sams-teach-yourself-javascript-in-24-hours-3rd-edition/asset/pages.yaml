  md: '# Responding to Events


    For example, you can use the following event handler to display an alert when
    a link is clicked:


    ```

    <a href="http://www.jworkshop.com/"

    onclick="alert(''You are about to leave this site.'')">>Click Here</a>

    ```


    In this case, the onClick event handler returns false the linked page is loaded
    into the browser. This is useful for making links conditional or displaying a
    disclaimer before launching the linked page.


    If your onClick event handler returns the false value, the link will not be followed.
    For example, if the click displays a confirmation dialog. If you click Cancel,
    the link is not followed; if you click OK, the page is loaded:


    ```

    <a href="http://www.jworkshop.com/"

    onclick="return(window.confirm(''Are you sure?''))">

    Click Here</a>

    ```


    This example uses the return statement to enclose the event handler. This ensures
    that the false value is returned when the user clicks Cancel is returned from
    the event handler, which prevents the link from being followed.


    The onclick event handler is similar, but if you use double-clicks on an object.
    Because links usually require only a single click, you could use this to make
    a link to two different things depending on the number of clicks. (Needless to
    say, this could be confusing.) You can also detect double-clicks on images and
    other objects.


    To give you more control of what happens when the mouse button is pressed, more
    events are included:


    +   * onMouseDown is used when the user presses the mouse button.

    * onMouseUp is used when the user releases the mouse button.


    These two events are half of a mouse click. If you want to detect an entire click,
    use onClick. On mouseUp and onMouseDown to detect just one or the other.


    To detect which mouse button is pressed, you can use the property of the event
    object. This property is assigned the value 1 for the left button, or 3 for the
    right button. This property is assigned for onClick, onMouseUp, and onMouseDown
    events.


    For example, this script creates an onMouseDown event handler that displays an
    alert indicating button was pressed.


    ```

    function mousealert() {

    whichome = (e.which != 1) ? "Left" : "Right";

    message = "You clicked the " + whichome + " button.";

    alert(message);

    }

    document.onmousedown = mousealert;

    ```


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_159_0.png)'
