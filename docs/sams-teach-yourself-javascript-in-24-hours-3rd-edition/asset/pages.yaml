  md: '# HOUR 21


    # Improving a Web Page with JavaScript


    You should now know quite a bit about JavaScript''s features and how to write
    and debug JavaScript programs. In the next three hours of this book, you will
    apply this knowledge by creating some complete applications.


    This hour, you will start with a simple application: an ordinary Web page with
    a few JavaScript features to make it friendlier and easier to navigate. Hour 21
    covers the following topics:


    +   - Creating a basic HTML document

    - Adding a drop-down navigation bar

    - Adding status-line descriptions for links

    - Adding graphic links and rollovers

    - Combining these features into a complete Web page'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# Creating the HTML Document


    For this example, you''ll start with the Web page of a small (and hopeless) software
    known as Fictional Software Company (FSC). Their Web page is rather unimpressive,
    but you''ve got to start somewhere.


    The main FSC Web page is shown in Figure 21.1. It includes a logo at the top,
    three paragraphs of information, and a simple bulleted list of links to the various
    subparpages. This page is defined using HTML in Listing 21.1.


    # Figure 21.1 A simple Web page using only HTML.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_328_0.png)


    # The HTML Document for the Initial FSC Web page


    ```

    <html>

    <head><title>Fictional Software Company</title></head>

    <body>

    <img SRC="fictional.gif" alt="Fictional Software Company">

    <hr>

    <p>Welcome to our Web page! Fictional Software Company specializes in creating
    innovative, user-friendly applications with descriptions filled with industry
    buzzwords.</</p>

    <p>We have a wide range of products (3 of them) to meet the needs of you and your
    company. Follow the links below for more information.</p>

    ```'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# Improving a Web Page with JavaScript


    # LISTING 21.1 Continued


    ```

    <ul>

    <li><a href="spread.html">Fictional Spreadsheet 7.0</a></li>

    <li><a href="word.html">Fictional Word Processor 6.0</a></li>

    <li><a href="data.html">Fictional Database 7.0</a></li>

    </ul>

    <p>Unlike other software companies, our products have absolutely no bugs, and
    always work perfectly on all computers. Nevertheless, you may run into problems
    in rare cases, usually your own fault. If this happens, visit our <a href="support.html">Technical
    Support</a> department for helpful information and tips. You can also view more
    information <a href="company.html">about our company</a> or order products with
    our friend <a href="order">Order Form</a>.</p>

    <p><i>(c)2002 FSC - designed by the FSC staff</i></p>

    <body>

    </html>

    ```


    The various links on the page you send to the company''s other pages. One describes
    all of the company''s products, another contains information about the company,
    and another gives technical support information. There''s also a link to an order
    form.


    # Using Drop-Down Lists for Navigation


    More recently, FSC decided to add more detailed information to the pages. The
    main page remains the same, but each product''s page is now a menu of links to
    subpages with various categories of information.


    As it is, the pages can be difficult to navigate. For example, if you want to
    view the system requirements for the Fictional Word Processor product, you must
    select the product name from the main page, wait for the page to load, and then
    select the System Requirements link.


    With JavaScript, you can create a friendly interface to all the pages on the main
    page without taking up much space. Let''s use one drop-down list to choose a product
    and another drop-down list to choose the type of information to view about the
    product.


    # Naming the Pages


    In writing a program, the programming isn''t always the hardest part. You should
    define the task the program will perform and the data it will use in advance,
    simplifying the task of writing the program.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_329_0.png)'
  merge: -1
  pgno: 329
- img_proc: true
  md: '308


    Hour 21


    To make programming the navigation bar easier, choose simple, meaningful names
    for the subpages. Construct their names based on the value of the selection lists.
    Assign a one-letter code to each product: w for the word processor, s for the
    spreadsheet, and d for the database. Then follow that with an underscore and a
    word indicating the type of information.


    Here are the categories of information and their corresponding codes:


    +   - tech—Technical support for the product

    - sales—Sales and availability information

    - feat—A list of features

    - price—Pricing information for the product

    - tips—Tips for getting the most out of the product


    For example, s_feat.html is the features list for the spreadsheet program. Meaningful
    names like that make it easier to maintain HTML pages. When you''re automating
    with JavaScript, they can make a big difference.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_330_0.png)


    > To try this example yourself, you''ll need all the individual HTML files. You
    can download them from this book''s Web site at http://www.jsworkshop.com/.


    # Creating the Data Structures and HTML


    Before you write the function to navigate the pages, you need to store the needed
    data. In this case, you need to store the three codes for the software products
    and the five codes for the types of pages. You could create an array for each
    list, but that isn''t necessary in this case.


    Rather than creating an array, you can simply place the information in the HTML
    page itself and it will be stored in the properties of the form object by the
    JavaScript interpreter. You will use the codes as the VALUE attribute of each
    option.


    You will need to define an HTML selection list for each of the lists of information.
    In addition, the user needs a way to visit the page after selecting it. You can
    do this with a Go button to the drop-down lists.


    The following shows the HTML to add to the main page. You''ll include it toward
    the end of the page, but it''s generally self-contained and could be placed anywhere:'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Improving a Web Page with JavaScript


    ```

    <form name="navform">

    <select name="program">

    <option VALUE="x" SELECTED>Select a Product</option>

    <option VALUE="w">Fictional Word Processor</option>

    <option VALUE="s">Fictional Spreadsheet</option>

    <option VALUE="d">Fictional Database</option>

    </select>

    <select name="category">

    <option VALUE="x" SELECTED>Select a Category</option>

    <option VALUE="tech">Technical Support</option>

    <option VALUE="sales">Sales and Availability</option>

    <option VALUE="feat">List of Features</option>

    <option VALUE="price">Pricing Information</option>

    <option VALUE="tips">Tips and Techniques</option>

    </select>

    <input TYPE="button" NAME="go" VALUE="Go to Page"

    onclick="Navigate();"

    </form>

    ```


    In addition to the categories discussed, there''s an option for the value x in
    each selection list. The default options and display instructions unclear until
    another selection is made. Selecting the Go button while one is selected selects
    nothing.


    # Creating the Function for the Navigation Bar


    You defined an onClick event handler for the Go button, which calls the Navigate()
    function. Next, you need to create this function. It will read the current value
    of both selection lists, construct a filename, and then load it into the browser.


    Here is the definition for the Navigate function. Next you will look for the features
    of this function in detail.


    ```

    function Navigate() {

    prod = document.navform.program.selectedIndex;

    cat = document.navform.category.selectedIndex;

    prodval = document.navform.program.options[prod].value;

    catval = document.navform.category.options[cat].value;

    if (prodval == "x" || catval == "x")

    alert("Select a product and category.");

    else window.location = prodval + "-" + catval + ".html";

    }

    ```


    To begin, this function sets two variables—prod and cat—to hold the currently
    selected index for each selection list. Next, prodval and catval are assigned
    to the corresponding value properties.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Hour 21


    The if statement checks both lists for the x value, meaning that the user hasn''t
    yet selected an item. If no value has been selected in either list, it displays
    an alert message reminding the user to select both.


    Finally, the new document filename is constructed by concatenating the two codes,
    the underscore (_), and the html suffix. This value is assigned to the window.location
    property, which changes the new page to be loaded.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_332_0.png)


    > Because changing the location property loads the new document, you can''t do
    anything more in the current JavaScript program. In fact, the Navigate function
    returns. However, you could include JavaScript functions on the next page.


    # Adding Link Descriptions


    Some users would undoubtedly prefer traditional hyperlinks to the navigation bar.
    To make these links more friendly, you can display descriptions of them on the
    status line when the user moves the mouse pointer over them.


    You can accomplish this easily withmouseover event handlers. When the user moves
    the mouse over a link, this event will call a function to display the appropriate
    message on the status line. For example, the following HTML defines a link with
    a friendly status line:


    ```

    <a href="order.html"

    mouseover="window.status=''Allows you to order products'';return true;"

    mouseout="window.status=''''">

    Order</a>

    ```


    This sets the value of window.status to display the message. In addition, the
    true value is returned; this is necessary to override the normal action (displaying
    the URL) for the status line. The onmouseout event handler clears the status line
    when the mouse pointer moves off the link.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_332_1.png)


    > You learned the basics of window objects, including the window.status object,
    in Hour 9, "Working with the Document Object Model." Event handlers are described
    in Hour 10, "Responding to Events."'
