    # HOUR 20


    # Using Advanced DOM Features


    In the last hour, you learned about the tree-like structure of the DOM (Document
    Object Model) and how its nodes represent the HTML that makes up a Web document.
    You also learned how to use DOM positioning attributes to animate an object.


    During this hour, you will take a closer look at the objects in the DOM, and the
    properties and methods you can use to control them. You will also explore several
    examples of dynamic HTML pages using these DOM features. Hour 20 covers the following
    topics:


    +   * Using the properties of DOM nodes

    * Understanding DOM node methods

    * Hiding and showing objects within a page

    * Modifying text within a page

    * Adding text to a page

    * Creating a DOM-based scrolling message'
