    # Understanding Expressions and Operators


    In the definition of the Average function in the previous example, you used this
    statement to average the four numbers:


    result = (a + b + c + d) / 4;


    The portion of this statement to the right of the equal sign is called an expression:
    a combination of variables and values that the JavaScript interpreter can evaluate
    a single value. The characters that are used to combine these values, such as
    + and /, are called operators.


    > Along with variables and constant values, you can also call functions that return
    results within an expression.


    # Using JavaScript Operators


    You''ve already used some operators, such as the + sign (addition) and the / sign
    (division) in the Average function example. Table 4.1 lists some of the most important
    operators you can use in JavaScript expressions.


    TABLE 4.1. Common JavaScript Operators


    | Operator | Description | Example |

    | --- | --- | --- |

    | + | Concatenate (combine) strings | message="*this is" + " a test"; |

    | + | Add | result = 5 + 7; |

    | - | Subtract | score = score - 1; |

    | * | Multiply | total = quantity * price; |'
