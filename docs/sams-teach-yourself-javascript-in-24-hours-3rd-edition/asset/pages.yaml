  md: 'Each frame object in a window is a child of the parent window object. Suppose
    you define a set of frames using the HTML below:


    ```

    <frameset ROWS="*,*" COLS="*,**">

    <frame NAME="topleft" SRC="topleft.html">

    <frame NAME="topright" SRC="topright.html">

    <frame NAME="bottomleft" SRC="bottomleft.html">

    <frame NAME="bottomright" SRC="bottomright.html">

    </frameset>

    ```


    This divides the window into quarters. If you have a JavaScript program in the
    toleft.html file, it would refer to the other windows as parent.topright, parent.bot-tomleft,
    and so on. The keywords window and self would refer to the left frame.


    ![](img/3ba9ce11a08220fe5348f94ec18e83ff_180_0.png)


    | If you used nested framesets, things are a bit more complicated. window represents
    the current frame, parent represents the frameset containing the current frame,
    and top represents the main frameset that contains all the others |


    # The frames Array


    Rather than referring to frames in a document by name, you can use the frames
    array. This array stores information about each of the frames in the document.
    The frames are indexed starting with zero and beginning with the first <frame>
    tag in the frameset document.


    For example, you could refer to the frames defined in the previous example using
    array references:


    +   - parent.frames[0] is equivalent to the toleft frame.

    - parent.frames[1] is equivalent to the topright frame.

    - parent.frames[2] is equivalent to the bottomleft frame.

    - parent.frames[3] is equivalent to the bottomright frame.


    You can refer to a frame using either method interchangeably, and depending on
    your application, you should use the most convenient method. For example, a document
    with 10 frames would probably be easier to use by number, but a simple two-frame
    document is easier to use if the frames have meaningful names.'
