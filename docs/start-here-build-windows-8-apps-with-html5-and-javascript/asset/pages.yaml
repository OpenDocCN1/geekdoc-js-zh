    # Protecting the global namespace


    In nearly any programming language, coding is (much) easier if you can use global
    variables. Global variables, however, have downsides too. A critical downside
    is the risk of name collisions between variables defined in different parts of
    your code, third-party libraries, advertising partners, and analytics libraries.
    A name collision combined with the dynamic typing of JavaScript variables may
    wind inadvertently modifying the state of the application—with potentially unpleasant
    anomalies at runtime.


    Consider how easy it is to unwittingly create variables: miss a var and you get
    a global; mistype a variable name in an assignment and you get a fresh global.
    This latter فيما is possible because JavaScript allows you to use a variable without
    declaring it first.


    There is a workaround. When you need to use global variables, a good technique
    is to create them as properties of a wrapper object. You place code similar to
    the following in a JavaScript file that you then link from every page:


    ```

    var Globals = (function() { return this; })();

    ```


    Next, you make a point of referencing whatever global object you use via the Globals.XXX
    expression, where XXX is the name of the global variable you want to use. In this
    way, least all of your global variables will stand out in code.


    > NOTE

    JSLint (http://www.jshint.com)—an online tool for static analysis of JavaScript
    code—does help in catching anti-patterns in your code, including the lack of var
    keywords.'
