  md: '# Start Here! Build Windows 8 Applications with HTML5 and JavaScript


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_413_0.png)


    Figure 12-10. The print charms.


    You select the printer of choice and then see another panel containing a preview
    of the page that will be printed. As a JavaScript developer, you have no control
    over displayed content. You''re solely responsible for providing the content to
    preview and print. The preview window (Figure 12-11) is generated by the system
    and requires no extra code beyond what you saw earlier.


    As you can discern from Figure 12-11, if your intended purpose is to print the
    current content of the screen you don''t need to do anything—just bring up the
    charms print dialog and go. More reasonably, though, you probably want to print
    only a subset of the content currently displayed on the screen. Doing that requires
    a few tricks.


    In essence, in Windows 8, and from a WinJS-based application, you want to print
    only some of the HTML content from the currently displayed document. Printing
    plays by common browser rules, which means that hidden content is not printed,
    and any visible content can be optionally styled for print.


    To print exactly the content you want at a given point, you need to arm yourself
