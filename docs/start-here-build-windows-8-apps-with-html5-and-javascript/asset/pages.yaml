  md: "# Miscellany of other new elements\n\nSemantic block elements represent the\
    \ largest family of new elements in HTML5. As mentioned, semantic elements are\
    \ important not so much for the effect they produce in the page but they increase\
    \ the readability of the page significantly for developers, software, and especially\
    \ browsers for disabled users.\n\nSemantic block elements alone do not produce\
    \ significant changes in the way in which HTML5-compliant browsers render the\
    \ page. For example, to color and provide a sidebar(that is, the <aside> element)\
    \ where you still need to resort to CSS settings. However, using semantic elements\
    \ reduces the noise of having too many generic DIV block elements whose role and\
    \ scope is not immediately clear.\n\nIn addition to semantic elements, HTML5 provides\
    \ a few new elements with an embedded behavior that couldn’t be obtained in earlier\
    \ versions of HTML without resorting to a combination of CSS, markup, and JavaScript.\
    \ Let’s see a few examples.\n\n# The details element\n\nMany times you have small\
    \ pieces of content in a page that you want to show or hide on demand. A good\
    \ example is the title of some news and its actual content. Sometimes you want\
    \ to display only the title but want to leave users from freedom to expand the\
    \ content and hide it to gain more space.\n\nBefore HTML5, you had to code all\
    \ this manually using a bit of HTML, CSS, and JavaScript code. In HTML5, the entire\
    \ logic is left to the browser and all you have to do is the following in an HTML\
    \ page.\n\n```\n<details>\n  <summary>This is the title</summary>\n  <div>\n \
    \   This is the text of the news and was initially hidden from view\n  </div>\n\
    </details>\n```"
