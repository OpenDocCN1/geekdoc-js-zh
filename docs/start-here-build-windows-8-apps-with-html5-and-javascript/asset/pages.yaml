- img_proc: true
  md: "on the entire form, but not on individual fields. You can disable form\nvalidation\
    \ by using the novalidate attribute, as shown below in the file\nnovalidate.htm.\n\
    \n```\n<form novalidate>\n  <input type=\"text\" placeholder=\"Your PIN\"\n  \
    \  title=\"2 letters + 6 digits\"\n    pattern=\"[a-zA-Z]\\d{6}\" />\n  <br />\n\
    \  <input type=\"submit\" value=\"Enter\" />\n</form>\n```\n\nIn this case, the\
    \ content of the form is submitted to the server regardless of\ndata held by input\
    \ fields.\n\nIf the form contains multiple submit buttons, you can enable or disable\n\
    validation on a per-button basis so that validation occurs if users, say, click\n\
    the first button but not the second. To disable validation when the form is\n\
    submitted via a particular submit button, you add the formnovalidate\nattribute\
    \ as follows:\n\n```\n<input type=\"submit\" value=\"...\" formnovalidate />\n\
    ```\n\n> NOTE\nnThe formnovalidate attribute overrides the form’s novalidate attribute\
    \ if both are set.\n\n# Multimedia elements\n\nHTML5 offers two new markup elements\
    \ that developers can use to play\naudio and video files from within webpages\
    \ without resorting to external\nplug-ins as Flash or Silverlight. The entire\
    \ infrastructure to play\naudio and video (including graphical feedback to users)\
    \ now is provided\nnatively by the browser.\n\n# The audio element"
