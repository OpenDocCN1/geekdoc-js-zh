    # The JavaScript type system


    The JavaScript type system is composed of a few primitive types and a few built-in
    objects. When you write JavaScript code, however, the range of types you can work
    with is actually much larger. In addition to built-in objects, you can also rely
    on objects provided by the host as well as objects you import from externally
    linked frameworks. For Windows 8 applications, in particular, you need to import
    the Windows 8 JavaScript (WinJS) library—the gateway to the native Windows 8 application
    programming interface (API).


    This chapter, though, focuses on the native type system as defined in the aforementioned
    JavaScript ECMA-262 standard definition.


    # Primitive types and built-in objects


    In JavaScript, the primitive types are number, string, Boolean, undefined, Object
    and Function. Built-in objects are Array, Math, Date, and RegExp, plus a few objects
    that are just functionally richer wrappers for some primitive types. Such wrapper
    objects are named String, Boolean, and Number, and they just add more capabilities
    to the corresponding primitive type.


    The type number represents floating point numbers with zero or more decimal places.
    There are no separate types for concepts such as integers, long integers, singles,
    doubles, or bytes. One special number, NaN, is reserved for numbers that don’t
    make mathematical sense—it is a variable that contains the result of a math operation
    that makes no sense. In fact, the name NaN is the acronym of Not-A-Number. The
    built-in Number object just wraps a primitive numeric value and adds a method
    to convert the number to a string.


    The type string represents a sequence of zero or more characters. The content
    of a string is bracketed in matching pairs of single or double quotes. The built-in
    String object adds a few methods, including substring, which'
