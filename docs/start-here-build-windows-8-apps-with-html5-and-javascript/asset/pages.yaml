    You pass an object to WinJS.xhr with the url property set to the URL to invoke.
    That''s all that is required; you don''t need anything else for the call to take
    place. In the then method, place the code that you want to run after a response
    has been obtained from the URL—in this case, the RSS data has been received. (The
    code in the then method will process the data and prepare it for display in this
    case.)


    A moment ago, you read that the URL is the only prerequisite for WinJS.xhr to
    be called. Remember, though, that setting the URL correctly is no guarantee of
    success. A call may fail for a number of reasons, and you must be able to detect
    failures. In addition, you should ensure that the Windows 8 environment allows
    you to venture beyond the local machine and access the World Wide Web. Finally,
    you should make sure that the request you are sending out is is well formed for
    the server that is going to receive it. Let''s explore the options that you have
    to further configure the request.


    # Configuring the WinJS.xhr object


    Table 11-1 enumerates the parameters you can optionally associate with a call
    to WinJS.xhr. These allow you to do things such as set the request type (for example,
    GET or POST), specify user credentials for remote authentication, set HTTP headers,
    and so forth.'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# Table 11-1. Options for calling the WinJS.xhr object


    | Parameter | Description |

    | url | This is a required parameter that indicates the URL to invoke. The URL
    can be absolute or relative. The HTTPS protocol is supported as well. |

    | type | Indicates the HTTP method to be used to open the connection with the
    specified URL. Valid values for this parameter are GET, POST, PUT, DELETE, or
    Head. The parameter is not case-sensitive. If not specified, the type parameter
    defaults to GET. |

    | user password | You can use these parameters to specify credentials that are
    validated at the destination before serving the request. If the user is empty
    or missing, and the site requires authentication, the user will be shown a login
    window. If the user parameter is missing or empty, the password parameter is ignored.
    |

    | headers | You can set this parameter to a JavaScript object whose property names
    indicate valid HTTP header names. The property values are then set as header values
    in the HTTP request. |

    | data | The parameter refers to a JavaScript object that contains data to be
    passed to the server usually via a POST request. |

    | responseType | Indicates the type of expected response from a GET request. Feasible
    values are text (the default), json, blob for binary content, and document for
    an XML object.|


    The WinJS.xhr object returns a JavaScript object so that the developer can easily
    arrange any subsequent steps following the asynchronous HTTP operation. When it
    comes to JavaScript promises and asynchronous operations, you''ve used both then
    and done functions in previous chapters, but it''s useful to briefly revisit the
    difference between the two.


    Windows 8 JavaScript (WinJS) library asynchronous operations operations always
    return a Promise object. As the name suggests, the object represents the promise
    of getting some usable data at some point in the (near) future. So as a developer,
    you are allowed to specify these steps using functions such as Promise.done and
    Promise.then. Both functions indicate a future'
  merge: -1
