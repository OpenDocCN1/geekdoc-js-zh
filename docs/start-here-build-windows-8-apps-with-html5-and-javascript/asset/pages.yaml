    \ Note that file pickers can only be used in filled or full screen and can't be\
    \ invoked from snapped applications and from flyouts, including settings flyouts.\
    \ Here is the code for the helper TodoList.invokeOpenPicker:\n\n```\nTodoList.invokeOpenPicker\
    \ = function () {\n    var openPicker = new Windows.Storage.Pickers.FileOpenPicker();\n\
