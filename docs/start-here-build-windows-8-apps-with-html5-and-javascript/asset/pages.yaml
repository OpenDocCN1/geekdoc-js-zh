  md: 'Even though the world is moving toward an increasingly digital and virtual
    future, printing a document is still an important task that has value despite
    the environmental considerations of print media. For developers, printing has
    never been this easy; in prior years, developers had to contend with many different
    drivers and settings.


    Windows 8, however, makes printing as easy as possible. Printing takes only a
    few relatively standard steps from JavaScript applications. You should note, though,
    that JavaScript applications have no access to a subset of more advanced capabilities,
    as such setting custom options programmatically and printing specific pages.


    For basic tasks, though, working with the printer from Windows Store JavaScript
    applications is quick and easy. “Basic tasks,” means the ability to control the
    content and template to be printed, and the ability to control print context-specific
    pieces of data.


    Here’s a new exercise that gives you some experience in printing, using some sample
    content.


    # The Print contract


    In Windows 8, printing is ruled by the Print contract. A Windows Store application
    therefore supports printing by registering for the Print contract. The Print contract
    tells the system that the application supports printing, so that when users swipe
    from the right side of the screen to reveal the Charms bar, they will find the
    list of available printers. Similarly, you may want to allow users to trigger
    a printing task from the application’s user interface by, for example, clicking
    a button. When this happens, the charms show up programmatically; the user can
    then select a printer and print.


    # Setting up the sample application


    Before you focus on specific printing tasks, you need to set up the sample application.
    Create another Windows Store project from the Blank App template and add the Pages
    folder with header.html and footer.html files. Define the CSS styles in default.css.
    Finally, in default.js, add a'
