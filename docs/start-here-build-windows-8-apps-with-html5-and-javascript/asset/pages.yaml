  md: "WinJS comes with a readymade component that is perfect to build a gallery of\
    \ pictures. This component is WinJS.UI.Flip. A flip view displays as a scrollable\
    \ list—either vertical or horizontal. The list is arranged in such a way that\
    \ only one item is displayed at a time. The native user interface of the component\
    \ also provides navigation buttons for the user to move to the next or the previous\
    \ item.\n\nThe item can have any representation that makes sense for the application.\
    \ It doesn't have to be an image and it doesn't have to be some plain text. In\
    \ general, with a flip view, you define the blueprint of the item to display and\
    \ define a graphical template for it.\n\n# Defining the item to display\n\nAs\
    \ a first step, you define a model for the item you want to display through the\
    \ flip view. Because you want the flip view to implement a gallery of images,\
    \ the item is well represented with the URL of the physical image and a caption.\
    \ You create a new JavaScript file and add it to the project in the JS layer.\
    \ Let's call this gallery.js and add the following code to it:\n\n```\nvar GalleryApp\
    \ = {};\nvar Photo = WinJS.Class.define(function (img, title) {\n  var that =\
    \ {};\n  that.imageUrl = img;\n  that.title = title;\n  return that;\n});\n\n\
    GalleryApp.init = function () {\n  var photos = [\n    new Photo(\"images/data/german-shepherd.png\"\
    , \"German shepherd\"),\n    new Photo(\"images/data/tiger.png\", \"Just bigger\
    \ than a cat\"),\n    new Photo(\"images/data/lion.png\", \"Just hairier than\
    \ a cat\"),\n    new Photo(\"images/data/leopard.png\", \"Running as a leopard\"\
    ),\n    new Photo(\"images/data/bane.png\", \"Hungry from Denmark\")\n  ];\n}\n\
    ```\n\nThe Photo object will represent the item displayed through the flip view.\
    \ In this basic example, you can safely assume that all the images are packaged"
  merge: -1
