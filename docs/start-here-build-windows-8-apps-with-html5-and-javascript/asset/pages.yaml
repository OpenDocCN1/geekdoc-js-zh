  md: 'This aspect is certainly important, but it doesn''t affect released applications.
    It is an important aspect, but only during the development phase.


    # External files


    As an alternative to embedding code in a script element, you can use the same
    script element to link a JavaScript file as an external resource. Here''s how
    to do it:


    ```

    <script src="http://..." type="text/javascript" />

    ```


    The pros of using externally linked JavaScript files are exactly opposite to the
    cons of using embedded script. This is the way to go; or, at least, using externally
    linked files should always be the first option you consider in general web development
    and in Windows 8 development.'
