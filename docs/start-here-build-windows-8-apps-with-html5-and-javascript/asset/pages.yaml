    # Creating a developer account


    To write and test Windows 8 applications, you need a developer license from Microsoft.
    The license is free and entitles you to be a registered Microsoft developer. Getting
    such a license requires only that you sign in using your Windows Live ID, as shown
    in Figure 1-7. (If you don''t have a Windows Live ID, the dialog box that prompts
    you to enter it provides a quick “Sign Up” link.)'
  merge: -1
