    # Selecting elements to style


    The next step is learning how to write a style sheet. A style sheet consists of
    a sequence of commands defined according to the following pattern:


    ```

    selector{property1: value; property2: value; ...}

    ```


    The selector is an expression that identifies the element (or the elements) to
    be styled. A selector can identify a single element through its unique ID, all
    elements with a given tag (for example, all DIV elements), or all elements sharing
    the same CSS class. As you''ll see in a moment, a CSS class is a named collection
    of style commands.


    The style commands are in the form of


    ```

    property-name: value;

    ```


    Each selector can refer to multiple style commands. Each style command ends with
    a semicolon (;). A final command that ends without the semicolon is often forgotten
    by browsers and renderers correctly. Anyway, it is preferable to always use the
    ending semicolon for each style command. Blanks can be used to separate consecutive
    style commands. Blanks do not'
