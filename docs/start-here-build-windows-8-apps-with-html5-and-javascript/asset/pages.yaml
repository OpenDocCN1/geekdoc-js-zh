- img_proc: true
  md: "replacement. This is interesting because it shows you a powerful JavaScript\
    \ technique—manipulating object prototypes.\n\n# Preparing the Flickr URL\n\n\
    It is advisable that you create another JavaScript file; call it helpers.js. Add\
    \ a reference to that file in your default.html file and make sure that the helpers.js\
    \ precedes the flickrApp reference. Here's the initial content for helpers.js:\n\
    \n```\n///////////////////////////////////////\n// Applies the .NET (n) convention\
    \ to format strings\n//\nString.prototype.format = function () {\n    var theString\
    \ = this,\n    count = arguments.length;\n\n    while (count--) {\n        theString\
    \ = theString.replace(\n            new RegExp('\\\\\\' + count + '\\\\\\\\',\
    \ 'gm'), arguments[count]);\n    }\n\n    return theString;\n}\n```\n\nThe code\
    \ adds the format function to the prototype of the JavaScript's native String\
    \ object. By doing this, any string manipulated under the scope of the helpers.js\
    \ file will expose an additional format method. After you reference helpers.js,\
    \ you can write the following code:\n\n```\nflickrApp.searchClick = function ()\
    \ {\n    var tags = document.getElementById(\"subject\").value;\n    flickrApp.download(tags);\n\
    }\nflickrApp.download = function (tags) {\n    // Add tags to the Flickr URL\n\
    \    var url = flickrApp.Source.format(tags);\n\n    // Get photos\n    WinJS.js.xhr({\
    \ url: url }).then(function (json) {\n        // Parse the JSON feed here\n  \
    \  });\n}\n```"
