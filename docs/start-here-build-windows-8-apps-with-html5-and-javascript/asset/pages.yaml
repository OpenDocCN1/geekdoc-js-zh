    # Dealing with invalid JSON


    When you detect invalid JSON, it''s not immediately obvious who might be the source
    of the problem. The only fact you know is that the parser failed—but why? Was
    it a bug? Or is the JSON provided to the parser invalid? While developing the
    Flickr Viewer app you faced the error window shown in Figure 11-8 a few times,
    often with no apparent reason. Sometimes, by simply changing the tag the application
    would work just fine.


    When the parser complains about invalid JSON, the first thing to do is to make
    sure the JSON content is truly valid. As shown in Figure 11-9, you can validate
    JSON text by copying it into the following website: http://jsonlint.com.'
