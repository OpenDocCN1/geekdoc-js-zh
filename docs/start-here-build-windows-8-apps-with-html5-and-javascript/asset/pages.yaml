- img_proc: true
  md: 'the special value of auto, meaning that the margin will be adjusted automatically
    by the browser to center the content.


    > NOTE

    When it comes to width and height, you also have min/max subproperties to define
    a minimum/maximum width or height. The properties are min-height, max-height,
    min-width, and max-width. It should also be noted that width and height refer
    to the size of the content and don''t count for padding, borders, and margins.


    # Advanced CSS scenarios


    So far, you have seen only basic CSS selectors—ID, tag names, and custom classes.
    However, the CSS syntax for selectors is much more rich and sophisticated than
    this. A bunch of built-in pseudo-classes and operators can be combined together
    and define a sort of powerful query language. In this way, you can select a very
    specific set of HTML elements to style.


    # CSS pseudo-classes


    You use CSS pseudo-classes to add special query capabilities to some selectors.
    The syntax to apply pseudo-classes looks like the following:


    ```

    selector:pseudo-class {

    ...

    }

    ```


    Let''s review a few examples of common pseudo-classes.


    # Anchor pseudo-classes


    In a nutshell, pseudo-classes are like smart query operators you can use on certain
    HTML elements to further restrict the application of the style. Some pseudo-classes
    are generic and can be applied to nearly all selectors; some, instead, only make
    sense if applied to specific elements. Let''s review pseudo-classes that work
    well with HTML anchors.'
  merge: -1
  pgno: 99
- img_proc: true
  md: "# NOTE\n\nAnchors are one of the most basic elements of HTML. Anchor is the\
    \ more technical name used to refer to a hyperlink, and the reason why the A is\
    \ used to identify the element. An anchor is made of two parts: display text and\
    \ underlying URL. When browsers encounter anchors, they typically render the display\
    \ text underlined in the status bar. When the user clicks the anchor, the browser\
    \ navigates to the specified URL.\n\nUsually, browsers render any occurrence of\
    \ the A element in different ways depending on the status—the link was visited,\
    \ is active, or the mouse is hovering. Each state is mapped to a different pseudo-class.\
    \ Here’s how to fully style an anchor:\n\n```\na {\n  text-decoration: none; /*\
    \ no underlining */\n  color: #aaa66;\n  padding: 0px;\n}\na:visited {\n  text-decoration:\
    \ none; /* no underlining */\n  color: #aaa66;\n}\na:hover {\n  text-decoration:\
    \ underline;\n  background-color: orange;\n  color: black;\n  padding: 2px;\n\
    }\na:active {\n  text-decoration: none; /* no underlining */\n  color: #aaa66;\n\
    }\n```\n\nThe visited pseudo-class defines the look and feel of the anchor once\
    \ it has been clicked at least once. The hover class refers to the mouse hovering\
    \ over the anchor. Finally, the active class refers to the look and feel of the\
    \ anchor when it holds the input focus. The previous example manages to render\
    \ the anchor always in the same way, and gives it a different color scheme when\
    \ the mouse is over it."
  merge: -1
