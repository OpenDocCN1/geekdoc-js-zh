    \ you use the deleteAsync method. When done, you clear up the editor and refresh\
    \ the list view to remove the deleted task.\n\n# Summary\n\nUsing files is a necessity\
    \ for any serious application. Windows Store applications are no exception. In\
    \ this chapter, you have learned the basics of file operations and the various\
    \ storage options that are available to applications. Of particular interest for\
    \ Windows Store applications are the roaming folder and roaming settings. By storing\
    \ data in the roaming folder, and/or user settings in the roaming settings dictionary,\
    \ you enable the operating system to synchronize data across the cloud so that\
    \ any copy of the application running on other devices (under the same Windows\
    \ account) can use it.\n\nThis story hasn't caught you enough, think of some fairly\
