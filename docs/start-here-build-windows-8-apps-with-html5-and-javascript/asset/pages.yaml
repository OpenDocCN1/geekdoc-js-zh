- img_proc: true
  md: '# # Chapter 7. Navigating through multimedia content


    > The greatest challenge to any thinker is stating the problem in a way that will
    allow a solution.

    —Bertrand Russell


    In this chapter, you''ll explore the capabilities of the Windows 9 JavaScript
    (WinJS) library—as far as the display of multimedia content is concerned. You''ll
    see how to build a gallery of images, how to zoom them in and out, and investigate
    ways to watch YouTube videos from within a Windows Store application.


    # # Foundation of page navigation


    So far in this book, all the applications you have created have used the Blank
    App template. That template is fine for applications that consist of a single
    page. But what if you want to build an application that displays multiple pages
    and requires users to navigate between them? Before you start with the nifty-gritty
    details of getting pictures and video clips into your apps, a brief exploration
    of the framework that provides navigation is in order. Next, armed with this knowledge,
    you can start planning a gallery where users can scroll images and click them
    to perform additional tasks.


    # # The navigation model of Windows Store applications


    To jump from one page to another is no big deal; you invoke a specific piece of
    code that links to another page. Or, easier still, you just use an HTML hyperlink
    element.


    While both of these approaches work well, you should note that WinJS has a richer
    set of functionalities available. These functionalities not only let'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'you display a different page, but also track the user’s navigation history,
    letting you provide a better user experience as you merge new pages into the existing
    layout.


    # Jumping to a different page


    The benefit of using the native Windows Store navigation model is well illustrated
    by the diagram in Figure 7-1.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_208_0.png)


    After clicking the link (or some button), the user sees a completely different
    page. It is your responsibility to ensure that the user experiences a strong feeling
    of continuity. You typically achieve that by giving both pages the same layout,
    using a common color scheme, and fonts. In addition, you should provide users
    with links to return to the previous page, since you won’t get any browser-like
    Back button automatically from the system.


    # Displaying a different page


    The idea behind the Windows Store application navigation model is that the application
    consists of a single main page and a number of page fragments. The main page contains
    the header, footer, menus, and other shared parts of the user interface. In contrast,
    a page fragment just provides new content to replace the content in the main page.
    In this way, all common parts of the UI remain unchanged during navigation, so
    the user has the feeling of'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'having changed only context, rather than having jumped to an entirely new place.
    Figure 7-2 illustrates the Windows Store application navigation model.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_209_0.png)


    In the start fragment, you may have buttons and controls through which you control
    navigation. You are in no way forced to have hyperlinks. When you navigate away
    from a page fragment, the system does all the work that is required to display
    the new content effectively to the user. At the same time, the newly displayed
    page is only responsible for displaying a Back button. The logic to navigate back
    is gently offered by the WinJS framework.


    # Inside the Navigation App template


    The first example you build in this chapter is an extension of the sample application
    you get by creating your Windows Store application project from the Navigation
    App template in Microsoft Visual Studio. Let’s then get familiar with the programming
    model.


    # Creating a navigation app


    You open Visual Studio and create a brand new project using the Navigation App
    template. You call this project Gallery, as shown in Figure 7-3.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_210_0.png)


    Figure 7-3. Creating a Navigation app.


    The project contains a few more files than the Blank App template that you''re
    used to. The familiar default.html page plays the role of the main page of Figure
    7-2. Companion files default.css and default.js just provide style sheets and
    scripts for elements within the main page.


    In Figure 7-4, you also notice a brand new pages folder. This is the folder where
    you will group all of your fragment pages, each in a separate subfolder. The default,
    pages folder has one subfolder named home; this is also the name of the only fragment
    available initially. The home folder contains home.html, home.css, and home.js.
    This is a standard pattern: The CSS file contains all style sheets used by the
    HTML file and the JS file contains all the required script.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_211_0.png)


    Another difference from the Blank App template is the navigator.js file. The file
    contains the implementation of the Application.PageControlNavigator object. You
    can consider this file as an extension of the native WinJS library.


    > > NOTE

    > If you open up the default.js file, and compare it to the same file you get
    with a Blank App, you will see some differences too. In particular, the file contains
    the logic that automatically navigates to the URL pointed to by the home property
    of the PageControlNavigator object.


    # Setting up the home screen


    The default.html determines the main user interface of the application. It contains
    the following code:'
