    # Fixing invalid JSON


    It turns out that the Flickr web service doesn’t always return valid JSON that
    can be successfully validated against the JSONlint validator. At the same time,
    any JSON that JSONLint validates is correctly parsed back by the JSON.parse function
    in Windows 8.


    One issue you''ll discover that the Flickr service doesn''t always handle the
    single quote character found in some descriptions correctly. For example, consider
    the following text:


    ```

    Wimbledon it ain\t

    ```'
