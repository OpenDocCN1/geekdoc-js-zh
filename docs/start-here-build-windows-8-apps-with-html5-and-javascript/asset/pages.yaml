- img_proc: true
  md: "action to perform as soon as the promised data becomes available. But what’s\
    \ the difference?\n\nPromise.done and Promise.then are exactly the same except\
    \ that Promise.done breaks the chain by returning undefined instead of a Promise\
    \ object. In other words, you could write code such as:\n\n```\nWinJS.xhr(url).then(doThis).then(doThat).done(doAlsoThis);\n\
    ```\n\nYou can’t write code like this:\n\n```\nWinJS.xhr(url).done(doThis).then(doThat);\n\
    ```\n\nIn other words, when you use the done function, you must be at the end\
    \ of a chain of instructions.\n\n# Handling errors during HTTP requests\n\nAn\
    \ HTTP request may fail for a number of reasons. For example, you may join your\
    \ connection before the request completes, or the request may be refused by the\
    \ server because it is malformed or you didn’t provide valid credentials. Finally,\
    \ the request may hang indefinitely and time out. How do you deal with all these\
    \ situations? This is just where the advanced capabilities of JavaScript Promise\
    \ objects come into play.\n\nBoth the done and then functions have the prototype:\n\
    \n```\nWinJS.xhr({ url: ... }).then(\n  function completed(request) {\n    //\
    \ The request completed successfully.\n  },\n  function error(error) {\n    //\
    \ The request failed for some reasons.\n  }\n);\n```\n\nSo far, you have passed\
    \ only one function to the then function of the promise. The then function invokes\
    \ the first passed function when the"
  merge: -1
