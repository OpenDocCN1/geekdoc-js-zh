  md: '# Looking at the Flickr public feed


    In this example, you will access the public photo feed of Flickr, which requires
    neither authentication, nor any Flickr-specific application ID. All you need to
    know is the URL to call. As in the first exercise of this chapter, you save it
    to a member on the global flickrApp object:


    ```

    flickrApp.Source = "http://api.flickr.com/services/feeds/photos_public.gne" +
    "?tagmode=any&json=nojsoncallback=1&tags={0}";

    ```


    Table 11-2 provides a brief explanation of the URL parameters.


    # Table 11-2. Query string parameters for the Flickr public web service


    | Parameter | Description |

    | --- | --- |

    | tagmode | This parameter can take the value all or any; and indicates whether
    selected photos must match all or just any of the specified tags. |

    | format | Set this parameter to json if you want to get a JSON response. You
    can also specify that the call should return RSS or a variety of formats as listed
    here: http://www.flickr.com/services/feeds/docs/photos_public. |

    | nojsoncallback | In a Windows Store, this parameter is required and must be
    set to 1. You don''t need this parameter if you''re calling the Flickr API from
    within a JavaScript web application. It is a setting that relates to how the environment
    actually places the call to the remote site. |

    | tags | You can set this parameter to, comma-separated list of keywords to match
    appropriate photos. |


    As you may have noticed, the flickrApp.Source property is set to a string that
    contains a placeholder—the {0} item. In .NET programming, this type of notation
    is used to format strings dynamically. The idea is that when the user clicks the
    Search button, the handler will read the typed tags and insert them in the URL
    string, replacing the placeholder.


    The {0} notation is common in .NET Windows programming, but it isn’t in JavaScript.
    So you need to create a helper function that does the'
