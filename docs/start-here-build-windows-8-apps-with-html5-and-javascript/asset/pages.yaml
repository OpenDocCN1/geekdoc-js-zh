- img_proc: true
  md: 'CSS builds a relatively rich and articulated infrastructure around each HTML
    element. This infrastructure is known as the boxing model and is featured in Figure
    3-6.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_95_0.png)


    The boxing model defines what browsers expect to find around each HTML element.
    The first surrounding box is the padding box, and it is controlled by the padding
    property. Next, there''s the border box used to frame an element; border settings
    are controlled via the border property.


    In addition, each element can be placed in another larger box, known as the margin
    box. Margins are controlled by the margin property and determine the distance
    between the boxed element and its neighbors.


    # Defining padding


    The padding property defines how many pixels should be added around the element.
    Additional pixels inherit the same background settings of the element. You typically
    use padding to add some spacing around the actual content (that is, text) of the
    element, as shown in Figure 3-7.'
  merge: -1
  pgno: 95
- img_proc: true
  md: "| ELEMENT | ELEMENT |\n|---|---|\n| padding: 0px; | padding: 10px; |\nFigure\
    \ 3-7. The effect of padding HTML elements.\n\nIf you set the padding property,\
    \ then padding is even all around the element. However, you can set padding for\
    \ each side of the element. You do that the through properties such as padding-top,\
    \ padding-left, padding-bottom, and padding-right.\n\n# Defining borders\n\nYou\
    \ can control borders of an HTML element through the border property. If you set\
    \ this property, each side of the element is styled in the same way. To configure\
    \ each side separately, you use specific subproperties such as border-top, border-left,\
    \ border-bottom, and border-right.\n\nWhile styling a border, you can indicate\
    \ width, color, radius, and style. Each of these aspects has its own property\
    \ such as border-width, border-color, border-radius, and border-style. You express\
    \ width and radius (for rounded corners) in pixels, while using CSS string to\
    \ express colors. Here’s an example:\n\n```\n.rounded-button {\n  color: #ffffff;\
    \ /* white * */\n  background: linear-gradient(to bottom, blue, white 80%, red);\n\
    \  border-radius: 5px;\n  border-width: 1px;\n  border-color: #ffffff; /* white\
    \ * */\n}\n```\n\nAn element border can be a solid, dotted, or dashed line. Just\
    \ solid, dotted, and dashed are feasible values for the border-style subproperty.\n\
    \n# Defining margins"
  merge: -1
  pgno: 96
- img_proc: true
  md: "In HTML, the margin is the distance that exists between a given element and\
    \ its neighbors. Unlike padding, the space indicated by margins is not rendered\
    \ as part of the element. That area displays any underlying content belonging\
    \ to parent elements.\n\nYou express margins in pixels, and you can set margins\
    \ independently through usual subproperties: margin-top, margin-left, margin-bottom,\
    \ and margin-right. For example, if you set margin-bottom to 10px, then you are\
    \ extending the height of the element by 10 pixels. These 10 extra pixels of height\
    \ are rendered with a transparent background though.\n\n# Defining width and height\n\
    \nBy default, HTML elements take up the minimum space they need to render their\
    \ content. In some cases, you might want to assign a fixed size, whether absolute\
    \ or relative. The properties you need to do this are width and height. You typically\
    \ set width and height using pixels or percentages.\n\n```\nbody {\n  width: 100%;\n\
    }\n```\n\nHere's a more interesting example of CSS settings that produce a layout\
    \ like the one shown in Figure 3-8. First start from the HTML:\n\n```\n<body>\n\
    \  <header>\n    Header of the page\n  </header>\n  <div id=\"main\">\n    main\n\
    \  </div>\n</body>\n```\n\nAnd here's the related CSS content:\n\n```\nbody {\n\
    \  margin: 0px;\n}\n```"
  merge: -1
