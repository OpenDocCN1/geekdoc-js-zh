    # The <nav> element


    The <nav> element indicates a special section of the page content—the section
    that contains major navigation links. It should be noted that not all links you
    can have in an HTML page must be defined within a <nav> element. The <nav> element
    is reserved only for the most relevant links, such as those you would place on
    the main page navigation menu. The syntax of the <nav> element is fairly intuitive.
    It consists of a list of <a> anchor elements listed within the <nav> element:


    ```

    <nav>

    <a href="..."> Home </a>

    <a href="..."> Find us </a>

    <a href="..."> Job opportunities </a>

    </nav>

    ```


    The <nav> element plays an important role in HTML5 because it indicates the boundaries
    of the section of the page that contains navigation links. This allows special
    page readers—such as browsers for disabled users—to better understand the structure
    of the page and optionally skip content.


    > IMPORTANT

    All semantic elements in HTML5 are important in light of accessibility, and just
    for this reason, they should be considered for use in any webpage that has chances
    to be read by disabled users.'
