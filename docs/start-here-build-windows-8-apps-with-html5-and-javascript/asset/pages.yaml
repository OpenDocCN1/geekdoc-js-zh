- img_proc: true
  md: '# # Chapter 6. The user interface of Windows Store applications


    > > Be great in act, as you have been in thought.

    > —William Shakespeare


    With this chapter, you enter a section of the book that focuses on concrete examples
    and exercises of Windows 8 programming. You''ll see how to use specific components
    and functions of Microsoft Windows 8, and also explore a few techniques for producing
    code that not only “just works,” but is also easy to read and well structured.
    In this chapter, you''ll focus primarily on presentation—the user interface—and
    related aspects, such as visual components, input forms, pop-up windows, and the
    overall layout of the pages.


    IMPORTANT

    Readability is an attribute of code that''s not just reserved for experts—it is,
    instead, an attitude that you can learn to adopt right at the beginning of your
    programming career. Keeping all your code readable will help you immediately,
    as you''ll see the first time you return to your code after a break of a few days
    or weeks.


    # Foundation of Windows Store applications


    When you open up Microsoft Visual Studio with the intention of creating a new
    Windows Store application, you must first decide on the type of project you want
    to create. Visual Studio provides a range of choices, called “templates.” Templates,
    among other things, provide a basic layout for your application (see Figure 6-1).'
  merge: -1
  pgno: 171
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_172_0.png)


    Figure 6-1. Choosing the layout of a new application.


    Choosing the project type is important, but it is not an essential step. The template
    basically serves the purpose of giving you (for free) the skeleton of an application
    with the layout that you are looking for. Most of the project choices come down
    to whether you want to build a single page or a multiple page application.


    For all the sample applications you''ve built so far, you have used the Blank
    App template. The Blank App template gives you an empty HTML page that you can
    fill up with whatever content and behavior you like. In this regard, the Blank
    App is the most flexible approach. It doesn''t give you a complex page layout,
    but it gives you a fully functioning project, ready to compile and run.


    # Defining the layout of the application


    Nearly any Windows Store application requires users to navigate between pages.
    Sometimes, the application explicitly provides a navigation menu so'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'users can find and return to a list of available pages quickly. The Navigation
    App template that you see in Figure 6-1 addresses that scenario.


    In other cases, an application doesn''t have a clearly visible navigation bar
    but still sets up a form of navigation as the user clicks to expand an item from
    a list into a more detailed view. This is the type of application skeleton you
    get if you opt to use the Split App or the Grid App template. In upcoming chapters,
    you''ll work on examples using the Grid App template, but for now you''ll stick
