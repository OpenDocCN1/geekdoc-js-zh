    Next, in flickApp.init you register a handler for the button's click event.\n\n\
    ```\nflickApp.init = function ById() {\n  document.getElementById(\"buttonSearch\"\
    )\n  .addEventListener(\"click\", flickApp.searchClick);\n  document.getElementById(\"\
    buttonClear\")\n  .addEventListener(\"click\", flickApp.clearClick);\n}\n```\n\
