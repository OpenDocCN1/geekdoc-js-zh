- img_proc: true
  md: '# Table 5-1. WinJS widgets


    | Widget | Description |

    | --- | --- |

    | AppBar | Displays a horizontal command bar that is usually placed at the bottom
    of the window. |

    | DatePicker | Pops up a calendar and enables the user to pick up a date. |

    | FlipView | Displays a collection of items and allows a user to flip through
    them, displaying one at a time. A typical example can be displaying pictures and
    captions with the ability to flip them horizontally. |

    | Flyout | Displays a simple popup message that disappears only when the user
    touches (or clicks) anywhere on the screen. |

    | ListView | Arranges a collection of items in a variety of layouts; for example,
    as a grid or as a list. |

    | HtmlControl | Displays any content provided in the HTML format. |

    | Menu | Displays a flyout that looks like a standard menu list. |

    | PageControl | An aggregate of HTML, JavaScript, and CSS that can be embedded
    in a view or viewed as an external page. You use the PageControl element to define
    the aggregate. |

    | SemanticZoom | Enables the user to zoom between two different views of the same
    content. One view is the zoomed-out representation of the content; the other instead
    provides the zoomed-in view. |

    | TimePicker | Enables the user to select a time in a graphically appealing way.
    |

    | ToggleSwitch | Displays a standard user interface for users to turn an item
    on or off. |

    | Tooltip | Displays a pop-up view that can incorporate rich content, such as
    images and formatted text. The purpose of a tooltip is to provide additional but
    optional information over a data element in the view. |

    | ViewBox | Elements displayed within a ViewBox automatically scale to fill the
    available space. The ViewBox widget also reacts to changes in the size of the
    container, such as after a screen rotation or a window resize. |'
  merge: -1
