- img_proc: true
  md: "A good approach is to have some code ready to load the application’s state\
    \ upon application startup. Data can be loaded from a storage location (if available),\
    \ downloaded from some remote location, or simply initialized to default values.\
    \ When the application exits, the current state should be persisted to storage\
    \ to be ready for next use.\n\nFor this pattern to work smoothly, it is necessary\
    \ that you start by defining a JavaScript object whose properties represent the\
    \ state of the application. Here’s an example:\n\n```\nvar MyAppState = function\
    \ () {\n  var that = {};\n  that.init = function () {\n    // Take care of initialization\
    \ and default values\n  };\n  that.load = function () {\n    // Take care of loading\
    \ from storage\n  };\n  that.save = function () {\n    // Take care of storage\n\
    \  };\n\n  // Other properties\n  ..\n\n  that.init();\n  return that;\n}\n```\n\
    \nTo attach an instance of this object to the Globals container, you write code\
    \ as follows:\n\n```\nGlobals.Current = new MyAppState;\n```\n\nFrom now on, you\
    \ can read and write the state of your application via highly readable statements\
    \ such as Globals.Current.Xxx, where Xxx is the name of a property or member defined\
    \ on MyAppState.\n\n# Be ready for localization"
