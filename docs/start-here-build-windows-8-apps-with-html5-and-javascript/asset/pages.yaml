  md: '# Summary


    Windows Store applications can be viewed in four different modes—full-screen,
    landscape, and portrait, as well as filled or snapped. In the latter cases, the
    application is sharing the screen with a second application. This means that you
    should be thinking of the layout of your application for at least four different
    scenarios and aiming to make your application fully functional even as small as
    320 x 760 pixels. At the same time, Windows 8 applications will also be consumed
    on very large screens.


    Therefore, it is key for developers to opt at the beginning for a layout that
    is easily extensible. If a single flexible layout is not possible, then you should
    plan for having multiple different layouts and programmatically switch between
    them as resize events are detected.


    Snapped applications are a very interesting case, as it happens when the application
    is forced to a sliver of the screen that is only 320 pixels wide. Guidelines of
    good Windows Store programming say that you should aim at reaching parity for
    features across view states. However, this is more a vector that points you to
    the right direction than a mandatory requirement. Users reasonably expect to be
    able to snap any applications; but not all applications can reasonably be fully
    functional with only 320 pixels of horizontal resolution. If this is the case,
    however, you should be ready to offer an alternate layout and unsnap programmatically
    as users hit a function that requires the full screen.


    In this chapter, you learned about snapped and filled applications, and experimented
    with the code and styles that make it easy to create Windows Store applications
    that behave as good citizens of the Windows 8 world.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# # Chapter 9. Integrating with the Windows 8 environment


    > > The heart has its reasons which reason knows nothing.

    —Blaise Pascal


    Operating systems owe their acceptance and circulation mostly to successful applications.
    There are many ways to measure the success of an application. From the viewpoint
    of users, though a successful application is often simply an application that
    allows the user to perform a common task in a seamless and comfortable way.


    Consider a basic application that needs to save some text to a disk file. The
    primary goal of the application is getting and then saving the text. However,
    to save the text users probably need to choose a file name and a location on disk.
    These are ancillary tasks; necessary for the sake of the application beyond the
    primary goal of the application. As a developer, you should allocate time to code
    these tasks too.


    How would you code these accessory tasks, such as picking a file from disk? Without
    rules, each application could come up with its own user interface. This is nefarious
    for users, who potentially face a myriad of different interfaces; but it is also
    nefarious for developers, who have to write extra code each and every time.


    In this chapter, you will learn about contracts and practice with them. Contracts
    are specific services for common tasks that applications can consume and expose
    for other applications to consume. The ultimate goal of contracts is having more
    and more applications doing the same things in the same way.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Contracts and common tasks


    Microsoft Windows 8 is an operating system that imposes several constraints on
    applications. In particular, applications are isolated from each other. How can
    applications communicate with one another under these conditions? Contracts are
    the answer.


    A contract defines a system-wide protocol for applications developed by different
    companies to communicate and exchange data. A contract refers to a particular
    common task, such as sharing data, searching for data, picking files, defining
    settings, and more. Applications that need that particular behavior can rely on
    existing implementations of contract instead of coding their own. At the same
    time, applications may expose themselves to a given contract so that other applications
    can consume it.


    # Aspects of Windows 8 contracts


    There are three aspects of a contract that deserve a bit more attention: how to
    discover available services, how to consume services, and how to expose services.


    # The Charms bar


    In Windows 8, the Charms bar is a system’s toolbar that users can access at any
    time, regardless of the application that is currently active. The Charms bar slides
    from the right edge of the screen as soon as you point the mouse to the top/right
    or bottom/right corner of the screen. You can also display the bar by pressing
    Windows+C on your keyboard. Finally, on touch-enabled devices, you invoke the
    bar by swiping from the side. The Charms bar is shown in Figure 9-1.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_278_0.png)


    Figure 9-1. The Charms bar in action.


    The Charms bar counts five elements: Search, Share, Settings, Start, and Devices.
    The first three are the most interesting from the perspective of contracts. In
    fact, Search, Share and Settings are three of the basic contracts that most Windows
    Store applications should at least seriously consider.


    An application that wants to share some of its content with other applications
    (and in turn with other users) implements the Share contract. Users of the Windows
    8 operating system know that there''s a standard way for them to share any content
    the current application may have—the Share button on the Charms bar. By implementing
    the Share contract, an application can push its selected content to any of the
    applications enlisted in the Share section of the Charms bar.


    Likewise, an application that allows users to search for some content as, a cooking
    application that supports searching for a particular recipe) doesn’t need to incorporate
    an ad hoc user interface for the search bar. Users know that the standard way
    for them to search for content is through the Charms bar. So an application that
    supports the Search contract can'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'have its content searched every time the user uses the Search panel in the
    Charms bar.


    Finally, the Settings button brings up the settings page of the current application.
    By implementing the Settings contract, the application can bring its own menu
    and set of options in the Settings panel in much the same way Microsoft Internet
    Explorer does in the screenshot of Figure 9-2.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_279_0.png)


    Figure 9-2. The Settings panel of Internet Explorer.


    Search, Share, and Settings are just the principal contracts available in Windows
    8. A few other contracts are available, as you''ll see in the rest of the chapter.


    # Consuming and publishing services


    There are two ways for a Windows Store application to deal with contracts—to consume
    a service and to publish a service. In terms of coding, the first scenario is
    far easier to code since it entails using a readymade set of Windows 8 components.
    The second scenario is only a bit harder to code since it requires that the application
    complies by the rules set in the definition of the contract.'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'A to-do list application may implement the Share contract as a source to enable
    users to share some of their tasks with friends. The user will invoke the Charms
    bar and pick up, say, the Mail application from the Share panel. The Mail application
    will then receive the content as exposed by the TodoList application and uses
    that to prepare an email message.


    At the same time, your application may act as the receiver of information that
    another application may decide to share. Suppose you have an application that
    posts to the user’s Facebook account. By making the application implement the
    Share contract as a target, you enable users of other applications to send their
    shared content to yours. So for example users of the TodoList application can
    now post their task directly to their Facebook account.


    What makes contracts particularly attractive is that Windows Store applications
    may be in the end result in the composition of functionality picked from different
    applications. Each application is then simpler and quicker to write.


    # Contracts and extensions


    In this chapter, you’ll go through a few exercises that involve the most commonly
    used contracts. The purpose of this section, instead, is to give you a quick overview
    of the available contracts so that you know where to look when you need to implement
    or consume a particular service.


    # Supported contracts


    Table 9-1 lists and describes the contracts that Windows Store applications may
    support. As you can see, some of the contracts so far referenced under a single
    name (such as, Share) are actually available for coding in two or more flavors
    (such as, Share source and Share target).'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Table 9-1. Contracts available for Windows Store applications


    | Contract | Description |

    | --- | --- |

    | Share source | The application implements this contract to share some of its
    content with any registered applications that support the Share target contract.
    Target applications appear in the Share menu of the Charms bar. For example, the
    default Weather application in Windows 8 is enabled to share forecasts. |

    | Share target | The application implements this contract to be listed in the
    Charms bar as an application that can receive any data the current application
    can share. For example, the default Mail application acts as a Share target. |

    | File open/Save picker | The application implements this contract to expose its
    view of files and relevant folders. This contract entails providing a custom user
    interface for the user to pick a file or folder. |

    | Settings | The application implements this contract to let users access customizable
    application settings that affect the way in which users interact with the application.
    Windows 8 requires that applications expose settings in a standard way through
    the implementation of the Settings contract. |

    | Search | The application implements this contract to let user search within
    any application-specific content that may be available. |

    | Play to | The application implements this contract to enable users to easily
    stream audio, video, or images from their computer to any connected devices in
    their home network (such as, a large TV screen). |

    | Cache updater | The application implements this contract if it is providing
    customized access to files and folders (via the File picker provider contract)
    and needs to notify applications of detected changes to listed files and folders.
    |


    As you can see, not all of the supported contracts make sense for just any Windows
    Store application. For example, Share and Settings contracts are much more common
    than the Play to contract or the Cache updater. Yet, the Windows 8 framework provides
    a large offering of customizable aspects that are not even limited to contracts.


    # Extensions


    While contracts are about agreements set between applications, extensions relate
    to agreements set between an application and the Windows operating'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'system. By registering extension, the application intends to extend or customize
    one or more standard Windows events features such as, for example, the way in
    which files with a given extension (such as, TXT files) are managed within the
    operating system. Table 9-2 lists extensions available in Windows 8.


    # Table 9-2. Extensions available for Windows Store applications


    | Extension | Description |

    | --- | --- |

    | Account picture provider | The application provides this extension to be listed
    in the Account Picture Settings control panel as an application which can provide
    a picture for the user account. |

    | AutoPlay provider | The application provides this extension to be listed as
    an AutoPlay choice for the one or more AutoPlay events. Windows fires the AutoPlay
    event whenever the user connects to the computer. |

    | Background task provider | The application provides this extension if it needs
    to do some work in the background when the application is suspended. Background
    tasks are intended to be small work items that require no interaction with the
    user. |

    | Camera settings provider | The application provides this extension if it can
    provide a custom user interface for selecting camera options and choosing effects
    when a camera is used to capture a photo or video. |

    | Contact provider | The application provides this extension to be included in
    the list of applications that Windows displays whenever the user needs to pick
    a contact. |

    | File activation provider | The application provides this extension if it intends
    to register as the handler of files with a given extension. |

    | Print settings provider | The application provides this extension if it can
    provide a custom user interface for selecting printer options. |


    Implementing contracts and extensions requires writing code following strict rules
    and making some changes to the application’s manifest file. The purpose of the
    second requirement is informing Windows about the system-wide changes that the
    application may introduce.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# Consuming the File picker contract


    Nearly any application needs to save data to the user’s disk. When it comes to
    this, nearly any application needs to be able to create and open files in folders.
