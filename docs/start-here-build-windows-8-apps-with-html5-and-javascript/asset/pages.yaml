    buttonPrint1\")\n  .addEventListener(\"click\", printerApp.print1, false);\n \
    \ document.getElementById(\"buttonPrint2\")\n  .addEventListener(\"click\", printerApp.print2,\
    \ false);\nn\n```\n\nFinally, in default.html add a sibling DIV element for each\
    \ print scenario you intend to support. Here's how:\n\n```\n<body>\n  <div id=\"\
    main\">\n    ...\\n  </div>\n  <div id=\"print-template1\">\n    ...\\n  </div>\n\
    \  <div id=\"print-template2\">\n    ...\\n  </div>\n</body>\n```\n\nThe user\
    \ interface goes in the main DIV; content you want to be able to print in the\
    \ other DIV elements. You now need to ensure that when the application is running\
    \ normally and not printing, the print sections are hidden. Likewise, you want\
    \ to hide the application UI content and display the appropriate content when\
    \ the application is going to print.\n\n# The print media\n\nWeb browsers have\
    \ supported screen and print media for a long time. When you author an HTML page,\
    \ you can link distinct CSS style sheets for screen and print using the media\
    \ attribute on the STYLE and LINK elements. For example, the following code links\
    \ the screen.css file when the page is being displayed and automatically (silently)\
    \ switches to the print.css when the page is being printed."
