- img_proc: true
  md: "```\nSnapMeApp.refresh();\n```\n\nThe sample application you’re going to build\
    \ will just contain a button that increments a counter variable when clicked.\
    \ The SnapMeState is a class that describes the state of the application. The\
    \ property total in the class counts the number of clicks. The property currentState\
    \ contains a message referring to the current view state of the application.\n\
    \nIn the SnapMeApp.init function, you initialize the application’s state and register\
    \ a handler for the click event of the button. You also register the SnapMeApp.init\
    \ function to be invoked when the application is ready. You need the following\
    \ code in default.js:\n\n```\napp.onready = function (args) {\nSnapMeApp.init();\n\
    }\n```\n\nThis is the markup you need to have in the body of the default.html\
    \ page, placed between the header and footer pages:\n\n```\n<h1>My App</h1>\n\
    <h2 id=\"currentViewState\">current</h2>\n<hr />\n<button id=\"buttonCounter\"\
    >Counter</button>\n<h3 id=\"total\">total</h3>\n```\n\nAnother new concept to\
    \ practice with the separation between state, behavior, and the logic that updates\
    \ the user interface. You add the following code to express of the behavior associated\
    \ with clicking the button. This code goes at the bottom of the SnapMeApp.js file:\n\
    \n```\nSnapMeApp.add = function () {\n  // This is part of the application’s behavior\n\
    \  SnapMeApp.Current.total++;\n\n  // This updates the user interface\n  SnapMeApp.refresh();\n\
    }\n```"
