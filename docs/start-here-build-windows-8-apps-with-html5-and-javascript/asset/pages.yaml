    # The dataList element


    For a long time, HTML developers asked loudly for the ability to offer a list
    of pre own options for a text field. The use-case is easy to figure out. Imagine
    a user required to type the name of a city in a text field. As a page author,
    you want to leave the user free of entering any text; at the same time, though,
    you want to provide a few predefined options that can be selected and entered
    with a single click. Until HTML5, this feature had to be coded by JavaScript,
    HTML provided only two options natively: free text with no auto-completion or
    a fixed list of options with no chance of typing anything. The new <datalist>
    element fills the gap. Copy the following text to the body of a new HTML page
    named datalist.html.


    ```

