    # Null vs. undefined


    When it comes to null-ness, JavaScript introduces a subtle difference that many
    higher-level languages such as C# and Java miss. As you''ll see in detail in a
    moment, a JavaScript variable is not bound to a fixed type. Subsequently, the
    variable is not bound to any type until it is explicitly assigned a value. At
    this stage, the type of the variable is said to be undefined.


    In JavaScript, undefined is seen as a special type rather than a value. If you
    check the type of an unassigned variable using the typeof operator, you get the
    string undefined. If you instead attempt to evaluate the content of an unassigned
    variable, you get null. Pay attention to the following code:


    ```

    var x;               // therefore the type of the variable is "undefined"

    var y = null;

    ```'
