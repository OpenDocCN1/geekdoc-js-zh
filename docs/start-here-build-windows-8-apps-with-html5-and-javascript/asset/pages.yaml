- img_proc: true
  md: 'Having the application ready for international markets may be a key to your
    success (or it might be just for your own enjoyment if you’re approaching Windows
    8 development with a light spirit). In general, localization is an important factor
    for applications published to a public store, as is the case with Windows 8 applications.


    In JavaScript code for web applications, you don''t get a lot of built-in help
    with localization issues. Frankly, in Windows 8 development, you get significant
    support from the WinJs library. At the end of the day, all you need to do is mark
    any elements content you want localized with a special attribute. Next, you need
    only add a localized resource file to the application for each language you intend
    to support.


    The Windows 8 runtime will take care of automatically selecting the right content
    from the right resource file according to the currently locale.


    > NOTE

    If you are at all familiar with C# and general Windows development, this overall
    pattern should be nothing new. It''s precisely the old pattern of Windows localization,
    just adapted to the new Windows 8 API.


