    # Supported programming languages


    You can write Windows Store applications in three main ways. You can use HTML
    and JavaScript, as you''ll see in this book. In addition, you can use applications
    using the C# or Visual Basic programming language and the XAML markup language
    to specify the user interface. Finally, you can use the C++ language with XAML
    as the markup language to express the user interface.


    All approaches deliver the same programming power. You can build the same application
    regardless of the language and markup you choose. For a number of reasons, JavaScript
    and HTML form the approach that makes it easier (but equally effective) for most
    developers, and especially for beginners.


