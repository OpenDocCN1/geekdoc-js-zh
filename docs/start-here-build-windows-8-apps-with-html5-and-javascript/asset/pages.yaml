  md: '# JQUERY AND WINDOWS 8


    At present, most JavaScript development is done with the immensely popular jQuery
    library. You can download the library from http://jquery.com.


    Typical web developers use the jQuery library to unobtrively bind handlers to
    events and detect page-level events, as the event that indicates the page is ready
    for display. In addition, developers use jQuery for ad hoc subsets of page elements.
    With reference to the previous chapter on CSS, you could say that jQuery offers
    a syntax that mimics the syntax of CSS selectors. In reality though, jQuery selector
    syntax is even richer than CSS standards.


    For developers who have a strong web background, the thought of writing HTML pages
    without using jQuery (or other JavaScript libraries, such as, knockout.js) may
    be nonsense. In Windows 8, using jQuery (and other libraries, other than the WinJs)
    may be problematic, depending on how you use the jQuery.


    The reason why jQuery can sometimes be problematic is the security model that
    Microsoft has adopted for Windows 8 applications. According to this model, dynamic
    manipulation of the page structure with data that is potentially unsafe (that
    is, coming from untrusted sources) is prohibited.


    If you are familiar with jQuery, you can use it as long as it doesn''t give you
    a hard time. If you are not familiar with jQuery, then it is suggested that you
    avoid it for Windows 8 applications. For most of the advanced jQuery features
    (such as plugins), you will find native components in the WinJs library for Windows
    8. To query elements in the hosting HTML page, you can use HTML standard functions—such
    as document.querySelector—that supports a CSS-like syntax to select elements.


    # Practices and habits


    JavaScript code is easy to make work, but definitely hard to manage and evolve,
    unless you set up and adhere to a number of practices. This sole purpose of this
    section is to summarize the do''s and don''ts of plain JavaScript programming.
    "Plain" JavaScript means JavaScript techniques not specifically targeted to Windows
    8 development. You''ll switch to focusing on specific aspects of Windows 8 JavaScript
    development in the next chapter.


    # Group your globals


    In this chapter, you learned about the need to make your global data stand out.
    You can achieve this by using the following code at the top of every'
