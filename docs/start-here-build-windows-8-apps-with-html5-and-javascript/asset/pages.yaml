    # Programmatic manipulation of the HTML page


    A Windows Store application written with HTML and JavaScript is primarily an application
    that consists of webpages—just processed in a slightly different manner than what
    a classic browser would do. Because of this, a Windows Store application can contain
    any JavaScript-related code that would make sense to have on a webpage.


    When a browser renders a webpage, it creates an in-memory representation of the
    content so that each and every HTML element turns out to be a programmable object.
    The in-memory representation is known as the Document Object Model, or DOM for
    short.


    You retrieve elements within an HTML page using the following line of code:


    ```

    var element = document.getElementById("id-of-the-element");

    ```


    The parameter passed to the method getElementById is the unique ID of the element
    to retrieve. More complex queries can be arranged using the syntax for CSS selectors,
    as you learned in Chapter 3. In this case, the code to use looks like the one
    shown below:


    ```

    // Query for multiple elements

    var elements = document.querySelectorAll("your-css-expression");


    // Query for just one element by stopping at first match

    var element = document.querySelector("your-css-expression");

    ```


    Once you have found the element to update, you can change its content by setting
    the innerHTML property to any string that can optionally contain'
