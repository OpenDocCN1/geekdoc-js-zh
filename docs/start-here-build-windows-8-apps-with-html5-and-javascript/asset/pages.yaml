    the actual logo consists of a drawing placed on a rectangular area. The background
    area is made transparent by using ad hoc graphical tools such as Paint.NET. Paint.NET
    is a free photo editing tool you can get at http://www.getpaint.net. Figure 6-7
    shows the logo of the sample TodoList placed on a transparent background.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_185_0.png)


    Figure 6-7. Adding a transparent background to the logo image.'
