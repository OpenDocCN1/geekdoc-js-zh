    the property name seeks to indicate, that is not necessarily going to be the real
    start location for the file picker. In an attempt to give users a continuous feel,
    the file picker tracks the last folder visited and starts from there. Should the
    folder be unavailable (such as, the folder has been deleted) or unreachable (such
    as, you are disconnected from the network), then the picker will take the suggestion.
    The suggestion is also taken if there''s no current record on track about the
    last folder visited.


    Note also that developers are not entitled to suggest programmatically any start
    folder not listed in the PickerLocation enumeration. By design, only the predefined
    system folders can be presented to the user. The PickerLocationId enumeration
