  md: "is a file that contains JSON-formatted text resulting from the previous serialization\
    \ of a Task object.\n\n# Reading file content\n\nTo read the content of the selected\
    \ file you use the readTextAsync method on the Windows.Storage.FileIO object.\
    \ The method returns the entire content of the file as a string of text. The Windows.Storage.FileIO\
    \ object, however, also provides two more methods. One is readLinesAsync, which\
    \ reads the entire content and returns it as an array of lines of text. Using\
    \ readLinesAsync or readTextAsync depends on what you plan to do with the read\
    \ text. For the purpose of deserializing some JSON content, this method is the\
    \ perfect fit since you are not going to split the text in lines anywhere.\n\n\
    The other method available on the Windows.Storage.FileIO object is readBufferAsync.\
    \ This method returns a buffer object, namely an array of bytes. For text-based\
    \ applications, you may safely ignore this method.\n\nHere's the code to add to\
    \ the TodoList.invokeOpenPicker method to grab the JSON string from the selected\
    \ file.\n\n```\nopenPicker.pickSingleFileAsync().then(function (file) {\n  if\
    \ (file) {\n    var io = Windows.Storage.FileIO;\n    io.readTextAsync(file)\n\
    \      .done(function (json) {\n        // JSON deserialization takes place here\n\
    \      }\n  }\n});\n```\n\nThe final step is deserializing the JSON string into\
    \ a newly created Task object.\n\n# Deserializing Task objects\n\nTo serialize\
    \ a Task object to a string you used the JSON.stringify method. A reverse method\
    \ also exists to revive a JSON string back to a JavaScript object. This method\
    \ is JSON.parse. Here's the code you need to add to the TodoList.invokeOpenPicker\
    \ method:"
