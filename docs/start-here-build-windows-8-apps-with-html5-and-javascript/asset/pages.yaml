  md: '```

    <script type="text/javascript">

    ....

    </script>

    ```


    As browsers encounter one of these <script> sections, they stop page rendering,
    execute the script, and then proceed. If the script element doesn''t contain immediate
    code to execute (for example, suppose it contains only function declarations),
    then the browser simply takes note the function and proceeds. A script element
    is therefore an acceptable place to embed the definition of functions invoked
    by event handlers.


    Embedding script code in a page has both pros and cons, but mostly cons. Table
    4-3 summarizes.


    # Table 4-3. Pros and cons of embedding JavaScript code in HTML pages


    | Pro | Con |

    |---|--|

    | The page has no dependencies and is self-contained. As a developer, you don''t
    have to look in several places to find out things specific to a page. | The page
    is larger and takes more time to download. |

    | | The script code cannot be used outside the page that contains it. |

    | | Restructuring the code to minimize duplicated functionalities is compromised
    by the fact that no code reuse is possible outside the page. |

    | | Script code cannot be cached by browsers separately from the page. |


    In addition, there''s another point to consider: with embedded code, any changes
    to the script are immediately visible. You just save the file and refresh the
    browser. But when the script file is linked as an external resource (more on this
    in a moment), then you need to play some tricks to ensure that changes are immediately
    visible and not hidden by cached copies of the same file.'
  merge: -1
