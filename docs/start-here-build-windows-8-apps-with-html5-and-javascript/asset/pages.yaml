    # Persisting application settings


    Windows 8 provides applications with a system dictionary where data can be saved
    in pairs—a unique ID and a corresponding value. Values can only be primitive types,
    such as strings and integers. The system object that provides access to this data
    store is


    Windows.Storage.ApplicationData.current.localSettings. The object exposes a values
    that the actual dictionary where data is stored.


    For example, the default priority level set for the application is stored in an
    entry which matches the property name.


    ```

    var priority = localSettings.values["defaultPriority"];

    ```


    Note that this is only a recommended practice; you can name the dictionary entry
    in any arbitrary way. To save values permanently, you use code as below:


    ```

    localSettings.values["defaultPriority"] = someValue;

    ```


    To complete the initialization of the application, you need to place a call that
    actually loads settings upon application startup.


    ```

    TodoList.settings.load();

    ```


    In todolist.js, you also add the previous line of code at the end of the TodoList.init
    method. Now that settings have been integrated in the application, you need to
    use them where it makes the most sense. This drives some further changes in todolist.js.


    In particular, you edit the Task object so that it defaults the priority property
    to the value read-out of the settings:'
