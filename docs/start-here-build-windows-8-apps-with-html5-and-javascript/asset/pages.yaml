  md: "# IMPORTANT\n\nWindows 8 comes with its own highly specific user interface.\
    \ The primary font is Segoe UI. Since you may write Windows 8 applications using\
    \ HTML and CSS, you are allowed to change the font. However, this is not a recommended\
    \ practice. In some cases, changing font and size may give you a hard time uploading\
    \ the final application to the Windows Store. In general, when it comes to using\
    \ CSS for Windows 8 applications, changing the font and font size becomes a delicate\
    \ point. You should not do this, unless it is necessary and even then possibly\
    \ for small portions of the user interface. Instead, you should use the default\
    \ Windows JavaScript sheets, as you'll encounter in Chapter 5.\n\n# The font family\
    \ and size\n\nIn CSS, you use the font-family property to indicate one or more\
    \ families of fonts you would like to use. When it comes to fonts and browsers,\
    \ it should be clear that the content of the font-family property is only a recommendation\
    \ for the browser. Since the webpage is hosted on a website and viewed on a local\
    \ computer, it may be that the local computer is not equipped with the requested\
    \ font. For this reason, it is a good practice to always indicate alternate fonts,\
    \ as shown below:\n\n```\nbody {\n  color: #ffffff;   /* white */\n  background-image:\
    \ url(/images/bkgnd.png);\n  background-repeat: no-repeat;\n  background-attachment:\
    \ fixed;\n  font-family: \"trebuchet ms\", helvetica, sans-serif;\n}\n```\n\n\
    Font families are listed in order of preference. If the first choice is not available,\
    \ then the browser moves to the second, and so on. If a font name contains spaces,\
    \ it is preferable to enclose it in quotes even though this is not always strictly\
    \ necessary on all browsers.\n\nYears of HTML development have taught developers\
    \ that Helvetica and Sans-serif as backup fonts are a great choice that ensures\
    \ at least decent rendering across all browsers."
  merge: -1
  pgno: 88
- img_proc: true
  md: "What about the size of the font? You can indicate the desired font size through\
    \ relative and absolute lengths and using a number of measurements. For example,\
    \ you can use keywords like x-small, small, medium, large, and x-large. These\
    \ keywords are relative to the standard browser font size, as modified by the\
    \ user. If you indicate the font size as a percentage, then the actual size is\
    \ relative to the surrounding text. If you use a number between 0 and 1 with the\
    \ em measure, then the actual size is relative to the parent element. Finally,\
    \ if you use a number of pixels (px is the measure), then the actual size is relative\
    \ to the screen resolution. Here are a few examples:\n\n```\n#footer {\n  font-size:\
    \ 80%;\n}\n#copyright {\n  font-size: 9px;\n}\n#trademark {\n  font-size: .8em;\n\
    }\n```\n\nRelative lengths are the best possible choice for rendering on a screen.\
    \ Absolute lengths, such as points (pt is the measure) or perhaps millimeters\
    \ (mm is the measure), may lead to text that shows larger or smaller on different\
    \ computers.\n\n> IMPORTANT\nAs mentioned, for Windows 8 applications it is preferable\
    \ that you stick to the classes defined in the standard Windows 8 style sheets.\n\
    \n# Styling fonts\n\nMore often than not, you you want to alter the default style\
    \ of the font to give some text more relevance. This means making some text italic,\
    \ bold, or perhaps underlined. Boldness is expressed through the font-weight property,\
    \ whereas styles (that is, italic) require the font-style property."
  merge: -1
  pgno: 89
- img_proc: true
  md: "```\n#footer {\n  font-size: 80%;\n  font-weight: 700;\n  font-style: italic,\
    \ underline;\n}\n```\n\nIf you just want to render some text in bold, you can\
    \ simply set the font-weight property to bold. If you need more control over the\
    \ weight of the text, you can choose a value between 400 (normal) and 700 (bold).\
    \ Higher or lower values are still allowed, and they just decrease or increase\
    \ the “weight” of the font.\n\n# HTML display modes\n\nAn HTML page results from\
    \ the composition of multiple elements. How are these elements actually composed\
    \ by the browser? Will they just be stacked horizontally or vertically? Is there\
    \ blank space that can be configured between them? In this section, you’ll learn\
    \ about the first point before addressing the second point in the next section.\n\
    \nHTML allows two basic display modes: inline and block. All HTML elements render\
    \ in one of these ways by default. For example, the DIV element is always rendered\
    \ as a block, whereas the SP element is rendered inline. You can change display\
    \ modes via CSS, however. The property to use is named display.\n\n# Block elements\n\
    \nBlock elements are stacked up vertically. Each element takes up the entire width\
    \ available and is rendered as if there were a line break before after. This means\
    \ that whenever the browser encounters a block element it begins rendering on\
    \ a new line. When done, it moves to the line before attacking a new element.\
    \ Here’s how to ensure that a custom CSS class renders out as a block:\n\n```\n\
    .headline {\n  display: block;\n}\n```"
  merge: -1
  pgno: 90
- img_proc: true
  md: "Common HTML elements that are displayed as blocks by default are H1 (and other\
    \ heading elements), DIV, P, UL, LI, TABLE, and FORM.\n\n# Inline elements\n\n\
    Conversely, inline elements don’t force the browser to break the flow of HTML\
    \ when rendering. An inline element just renders side by side with existing content,\
    \ and strictly takes up necessary space. Here’s how to ensure that a custom CSS\
    \ class renders out inline:\n\n```\n.headline {\n  display: inline;\n}\n```\n\n\
    Common elements rendered inline by default are SP, A, INPUT, and IMG.\n\n> NOTE\n\
    By using the display property, you can turn block elements into inline elements\
    \ and vice versa. What browsers normally is simply a predefined setting that can\
    \ be changed by developers.\n\n# Floating elements around\n\nSometimes blocks\
    \ and inline display are not enough to achieve your graphics goals. Let’s consider\
    \ the following HTML markup:\n\n```\n<div id=\"article\">\n  <img src=\"picture.png\"\
    \ />\n  <span>Some possibly long text</</span>\n</div>\n```\n\nBy default, image\
    \ and text are rendered side by side, and the text is placed at the bottom of\
    \ the image, as shown in Figure 3-3."
  merge: -1
  pgno: 91
- img_proc: true
  md: "![](img/d62e4a5ec04f518a61f032ca9cb73f7e_92_0.png)\n\nVia CSS, you can alter\
    \ the vertical alignment of the text to middle or top. However, none of these\
    \ tricks will give you what you likely want—text floating around the image, as\
    \ depicted in Figure 3-4.\n\n![](img/d62e4a5ec04f518a61f032ca9cb73f7e_92_1.png)\n\
    \nTo achieve this effect, you need to deal with the float property. The float\
    \ property has the effect of displaying elements next to one floated on a continuous\
    \ flow that automatically wraps to the next line when the containing box ends.\
    \ The float property uses values like left or right to denote the direction of\
    \ the flow. The following CSS applied to the former HTML snippet produces the\
    \ output of Figure 3-4.\n\n```\n#article {\n  float: left;\n  width: 100px;\n\
    }\n```"
  merge: -1
  pgno: 92
- img_proc: true
  md: "When float is used, the elements that follow move up to fill any available\
    \ space—similar to what happens in a text editor when you remove a carriage return.\
    \ The float property breaks the usual meaning of block and inline. At some point,\
    \ though, you need to restore things to the natural order and stop floating. The\
    \ element where floating stops must be styled as below:\n\n```\n#stopFloating\
    \ {\n  clear: both;\n}\n```\n\nThe float stopper element can be a true element\
    \ of the page (that is, a paragraph of text) or an empty DIV element only used\
    \ to stop floating.\n\n> NOTE\nIf you're still a bit confused about the differences\
    \ between inline and floating, consider that inline is all about having individual\
    \ elements laid out by side on the same logical line. Floating, however, is about\
    \ wrapping elements between a starting and an ending point.\n\n# Inline-block\
    \ elements\n\nFloated elements work well, but they also have some drawbacks when\
    \ they span over multiple lines and each element is of a different size. When\
    \ you face this problem, then the third possible value of the display property\
    \ comes to the rescue: the inline-block value.\n\nAn inline-block element is a\
    \ block rendered inline with other block elements. Internally, each block element\
    \ will render as usual with all block, inline, and floating settings. Consider\
    \ the following HTML snippet:\n\n```\n<ul id=\"container\">\n  <li-Block #1</li>\n\
    \  <li-Block #2</li>\n  <li-Block #3</li>\n</ul>\n```\n\nNow style the elements\
    \ as follows. The results are shown in Figure 3-5."
  merge: -1
  pgno: 93
- img_proc: true
  md: "```\nli {\n  display: inline-block;\n  width: 100px;\n  min-height: 100px;\n\
    \  background-color: green;\n  color: white;\n  vertical-align: top;\n}\n```\n\
    \n![](img/d62e4a5ec04f518a61f032ca9cb73f7e_94_0.png)\n\nIt should be noted that\
    \ inline-block elements, if aligned vertically to the top, also work well in the\
    \ case of multiple rows of different heights. When not floating, in fact, the\
    \ browsers always use a single, logical horizontal line to render on.\n\nThe drawback\
    \ of inline-block elements is that they consider any literals in the HTML source.\
    \ This means blanks you have in the source (in case of fixed widths) may cause\
    \ an undesired wrap to the next line. To be on the safe side, you should consider\
    \ writing your HTML on a single line with no extra blanks or carriage returns.\
    \ This may be required only for the section of the page that uses elements styled\
    \ as inline-blocks.\n\n> NOTE\nas the content of Figure 3-5 may suggest, inline-block\
    \ elements may be very helpful to arrange the style of the Windows 8 user interface\
    \ using HTML and CSS.\n\n# Spacing and the boxing model"
