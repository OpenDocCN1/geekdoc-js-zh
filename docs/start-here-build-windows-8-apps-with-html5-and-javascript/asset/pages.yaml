  md: '# Introduction


    For years, programming has been the nearly exclusive domain of people that others
    typically thought of as super-experts, gurus, or geniuses. The advent of mobile
    programming, however, changed things a bit because the idea of programming for
    these devices regained its appeal for youngsters. Today, a teenager appearing
    suddenly in the spotlight due to his or her ability to build a cool Android or
    iPhone app is not uncommon. There are a few reasons why this is happening, and
    why it''s happening now.


    One reason is certainly that today''s teenagers are the first generation of digital
    natives. You''re far more likely to find a few programmers among this group than
    the members of previous generations. Another reason is that mobile apps are much
    easier to write than any other type of modern software. Mobile apps are small
    pieces of code built around a smart idea. It''s one thing to build a mobile app,
    and quite another to plan and maintain a multitriered enterprise system.


    Being mobile added a new dimension to software development. In this context, Windows
    Phone is not simply another mobile platform to code for; It is by far the simplest
    (and even most pleasant) platform to code for, regardless of background. This
    makes coding for Windows Phone an excellent way to get started with programming.
    This is particularly true for the smart kids who constantly hunt after new technology
    and seek emotional gratification in that. I''ve seen this happen with my 14-year-old
    son, Francesco—who is the effective author of this book.


    Microsoft Windows 8 takes the “programming with pleasure” approach one step further.
    With Windows 8, you can not only build mobile apps for tablets, but also build
    standalone applications for yourself, either for or to help automate some of the
    repetitive tasks of everyday life. Windows 8, with its overall simplicity, brings
    back a dimension of craftsmanship in'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'applications that went missing as the complexity of software architectures
    and websites increased over the past decade or so. On one hand, Windows 8 is a
    powerful client front end for rich and sophisticated middleware; on the other,
    it is simple enough for nearly everybody to program via HTML5 and JavaScript.


    This book is intended to be a quick (but juicy) beginner’s guide for getting started
    crafting Windows 8 applications, and how to publish and sell them through the
    Windows Store. The key point of this book is to make clear that if you have a
    good idea and are a quick learner, you can create a Windows 8 app regardless of
    your age or programming background. You’ll see how to write functional applications
    for the new Microsoft operating system and have them run on desktop computers,
    as well as tablets. As evidence, consider that Francesco is a teenager—and he
    wrote most of the examples and a few chapters of this book.


    After completing the book, you won’t be a super-expert, but you’ll surely know
    enough to start writing your own apps, at least for fun.


    # Who should read this book


    This book is a beginner’s guide to Windows 8 programming using web technologies,
    such as HTML5 and JavaScript. But the scope of the “beginner” needs some further
    explanation. One definition of a beginner, in a programming sense, is a person
    who has learned any serious programming. While this book does target such beginners,
    it does require some minimal background knowledge about HTML5, JavaScript, and
    familiarity with basic concepts of logic and formalism, such as IF, WHILE, and
    assignments. Another definition of a beginner, however, would include people who
    have never learned Windows programming, or people who perhaps wrote COBOL for
    decades—or even perhaps a person who built and maintained a Visual Basic 6 application
    for the past 15 years. While this book can also be useful for those more experienced
    “beginners,” people with serious programming experience are not the target audience
    for this book.'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'This book attempts to provide a smooth approach to key topics of Windows 8
    programming. If you are primarily interested in Windows 8 and are new to Windows
    Phone, Microsoft Silverlight, or even single-page applications, then you should
    definitely consider getting this book.


    # Who should not read this book


    This book won''t make you a top-notch Windows 8 developer. If you have some solid
    experience with Windows 8, with Windows Phone or Silverlight, or with other programming
    languages, you might want to try another, more advanced book instead, or just
    rely on online MSDN documentation or StackOverflow links. You should be a true
    Windows 8 beginner to enjoy this book.


    # Organization of this book


    This book is divided into three sections. Chapter 1-Chapter 5 cover the basics
    of acquiring and using Microsoft Visual Studio 2012 Express and also provide a
    summary of what you need to know about HTML, CSS, and JavaScript. Chapter 6-Chapter
    11 deal with programming Windows 8 apps and cover the foundation of Windows 8
    programming while providing step-by-step exercises that help you understand and
    deal with the user interface of Windows 8 apps, graphics, video, data storage,
    and Internet calls. Finally, Chapter 12-Chapter 14 focus on advanced Windows 8
    programming, with an emphasis on working with device sensors and accessories (such
    as printers, GPS, webcams, and so forth), interacting with the system (Live tiles),
    and publishing your completed application.


    # Finding your best starting point in this book


    Overall, the scenarios for using this book are quite simple. We recommend you
    read it to cover, because it is designed to guide you through the key topics you
    need to know to program Windows 8 with HTML5 and JavaScript. However, if you already
    have a solid grasp of the technologies'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'used in this book—Visual Studio 2012 Express, HTML5, CSS, and JavaScript—you
    may be able to skip Chapter 1-Chapter 4 without compromising your understanding
    of the rest of the book.


    # Conventions and features in this book


    This book presents information using conventions designed to make the information
    readable and easy to follow.


    +   - Each exercise consists of a series of tasks, presented as numbered steps
    (1, 2, and so on) listing each action you must take to complete the exercise.


    +   - Boxed elements with labels such as Note provide additional information or
    alternative methods for completing a step successfully.


    +   - Text that you type (apart from code blocks) appears in bold.


    +   - A plus sign (+) between two key names means that you must press those keys
    at the same time. For example, “Press Alt+Tab” means that you hold down the Alt
    key while you press the Tab key.


    +   - A vertical bar between two or more menu items (such as, File | Close), means
    that you should select the first menu or menu item, then the next, and so on.


    # System requirements


    You will need the following hardware and software to set up yourself on the various
    mobile platforms and compile the sample code:


    +   - A PC equipped with Windows 8 and Visual Studio 2012 Express for Windows
    8.


    # Code samples'
  merge: -1
