    people who make my life happier: my mom, my sister, Michela, my friends Francesco
    and Mattia, and all my waterpolo teammates at UISP Monterotondo. I love you all!


    PS: Michela, do you remember that Christmas of 2009 when I was really giving you
    a hard time and in order to “save” you, Dad decided to initiate (or actually initialize?)
    me to programming?'
