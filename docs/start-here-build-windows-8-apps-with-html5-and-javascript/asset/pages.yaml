    \ content the remote web server provides. The WinJS.xhr object supports a variety\
    \ of parameters, as you'll see in a moment; however, most of the time you need\
    \ only pass the plain HTTP address you want to reach to make it work. Modify the\
    \ rssReaderApp.init function, as shown below:\n\n```\n// This is the URL that\
    \ provides RSS content\nrssReaderApp.Feed = \"http://news.google.com/news?pz=1&output=rss\"\
    ;\n\nrssReaderApp.init = function () {\n  WinJS.xhr({ url: rssReaderApp.Feed }).then(function\
    \ (rss) {\n    // Do something with the data\n  });\n```\n\nFirst, you save the\
    \ URL you want to access as a public member of the rssReaderApp global object.\
    \ It is your responsibility to choose a URL that returns RSS data. If you are\
    \ unfamiliar with RSS content, you should recognize it on most websites from the\
    \ popular icon shown in Figure 11-1.\n\n![](img/d62e4a5ec04f518a61f032ca9cb73f7e_361_0.png)\n\
    \nAfter you have determined the URL to invoke, you pass it along to the WinJS.xhr\
