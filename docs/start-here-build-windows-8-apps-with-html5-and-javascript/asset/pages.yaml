    \ = function () {\n  // Zero the length of the list\n  FlickrFeed.Pictures.splice(0,\
    \ FlickrFeed.Pictures.length);\n}\n```\n\nYou might also want to place a call\
    \ to flickApp.clear method in the download function just before placing the remote\
    \ call."
