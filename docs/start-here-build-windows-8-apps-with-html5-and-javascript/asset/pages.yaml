  md: '# # Chapter 11. Working with remote data


    > The least of things with a meaning is worth more in life than the greatest of
    things without it.

    —Carl Jung


    With very few exceptions, all mobile applications fall into one of the following
    categories: applications that just can''t work without an Internet connection
    and applications that are only partially functional unless an Internet connection
    is present. You can''t truly call yourself a good Microsoft Windows 8 developer
    until you have learned how to work with remote data across the Internet.


    In this chapter, you will practice with data downloaded from a remote location
    using the HTTP protocol. First, you will learn how to make an HTTP call to download
    data. Next, you will face the more challenging task of interpreting the downloaded
    data so that you can make use of it in your Windows application.


    The first exercise will show you how to retrieve and display the news feed from
    a public site. You''ll download a Really Simple Syndication (RSS) feed and adjust
    the data so that it displays in a list view component. The second exercise will
    show you how to download JSON data from a different site—the Flickr photo service—and
    arrange it in a dynamically built layout.


