  md: '# Steps required to publish an application


    All Windows Store applications go into the same catalog; therefore, each application
    must have a unique name.


    # Choosing a name for the application


    Choosing a name is therefore an important step; if you have a very specific name
    in mind, you should plan to reserve it in advance. If the name you like is already
    taken, you have no other option to choose a different name!


    # Reserving an application name


    You can reserve a name for your future application at any time by clicking the
    Reserve App Name option in the Store menu of Visual Studio (Figure 14-7).


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_462_0.png)


    To reserve the name, type the name of the application; if the Windows Store detects
    no conflicts, you will get a positive response, as shown in Figure 14-'
  merge: -1
