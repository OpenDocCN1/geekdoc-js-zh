- img_proc: true
  md: "In Microsoft Windows 8, the File Save Picker component seeks to be more helpful\
    \ than one might expect. It doesn't simply return you an object that describes\
    \ the file you intend to create; it returns you true file object. In other words,\
    \ the object you get from the picker refers to a file that has already been created\
    \ for you. The file is empty, but it exists already. Subsequently, all you have\
    \ to do is write some text to it.\n\nYou open the todolist.js file and add the\
    \ following code to the TodoList.invokeSavePicker to deal with the File Save Picker:\n\
    \n```\nsavePicker.pickSaveFileAsync().then(function (file) {\n  if (file) {\n\
    \    // The file ALREADY exists; the file CREATED it with 0 bytes\n    Windows.Storage.FileIO\n\
    \    writeTextAsync(file, \"Some data\")\n    done(function () {\n      TodoList.alert(\"\
    Data successfully saved\");\n      function (error) {\n        TodoList.alert(\"\
    Unable to save data. Sorry that!\");\n      }\n    });\n  }\n});\n```\n\nAdmittedly,\
    \ the syntax of the I/O objects in Windows 8 is a bit convoluted, but not really\
    \ scary. The basic object for I/O manipulations is Windows.Storage.FileIO. This\
    \ object exposes a method called writeTextAsync; it takes a file object and some\
    \ text and simply writes the text to the file. In the example above, you are saving\
    \ the text \"Some data\" to the picked file.\n\nIn Windows Store applications,\
    \ most system operations are performed in an asynchronous way. This means that\
    \ the instruction that follows the asynchronous call executes immediately without\
    \ waiting for the other instruction to complete. While asynchronous calls ensure\
    \ the highest responsiveness of the application's user interface, they make underlying\
    \ code harder to read and write."
  merge: -1
  pgno: 323
- img_proc: true
  md: 'In particular, to express a sequential semantic where two or more actions occur
    one after the completion of the previous, you need to resort to a “fluent” syntax,
    as shown below:


    ```

    Windows.Storage.FileIO

    .writeTextAsync( ... )

    .done(ok, error)

    ```


    It reads like you write some content to a given file and when this has been done
    you take different routes, whether the operation completed successfully or with
    some errors. You’ll be using this pattern quite often in Windows Store applications.


    Figure 10-2 shows the state of the folder that a file has been created.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_324_0.png)


    # Creating your own files'
