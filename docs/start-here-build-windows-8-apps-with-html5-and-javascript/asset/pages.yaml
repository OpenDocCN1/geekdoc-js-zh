- img_proc: true
  md: '# Chapter 13. Adding Live tiles


    > There are sadistic scientists who hurry to hunt down errors instead of establishing
    the truth.


    Marie Curie


    The Microsoft Windows 8 and Windows Phone user interfaces are characterized by
    colorful blocks that remind many users of old-fashioned icons that made earlier
    versions of Microsoft Windows so popular. However, the new blocks are significantly
    larger than icons and are displayed side by side under the control of the operating
    system. The blocks are referred to as *tiles*. The term *tile* mostly refers to
    the shape and size of the graphical element. Tiles in Windows 8 (as well as tiles
    in Windows Phone) have an additional and fairly interesting capability: they can
    display tailored information generated by the application appropriate for the
    needs of the user who installed the application. Such tiles are referred to as
    *Live tiles.


    An icon is a static image that makes it quick and fast for users to identify the
    application. The icon, though, never changes on its own to reflect the current
    state of the application. A Live tile, on the other hand, is a sort of an application
    appendix that passes some content to the operating system, which then displays
    that to the user even when the application is offline or not running.


    From a developer’s perspective, dealing with Live tiles requires becoming familiar
    with a new application programming interface (API), and the concept of an *application
    notification*. In this chapter, you’ll work through an exercise that adds Live
    tiles to the TodoList application you built in previous chapters.


    # What’s a Live tile anyways?'
  merge: -1
  pgno: 433
- img_proc: true
  md: 'Figure 13-1 shows the Start screen of a Windows 8 machine. Each block in the
    user interface represents an installed application. While a Live tile can be active
    and kept up to date, in most cases (such as when the application is offline) the
    tile is just a newer and snazzier version of the plain icons used in previous
    versions of Windows. In Figure 13-1, all the tiles are static and show only the
    application’s logo and name.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_434_0.png)


    Figure 13-1: Tiles in the Start screen of a Windows 8 machine.


    # Tiles in action


    Users can operate on tiles in much the same way they can operate on icons in earlier
    versions of Windows. Specifically, the user can move tiles around, group them,
    make them larger or smaller, and enable or disable live notifications. In the
    end, tiles are just updated icons, restyled and enriched with the ability to receive
    live notifications from the underlying application.


    # Moving Live tiles around


    Windows 8 creates a new tile for each installed application and pins it to the
    Start screen. It is up to the user to unpin the tile from the Start screen if'
  merge: -1
  pgno: 434
- img_proc: true
  md: 'they don''t want to see its tile, or even uninstall the application altogether.


    Figure 13-2 shows the context menu that appears when a user right-clicks a tile.


    As Figure 13-2 shows, the available operations are: unpin the application from
    the Start screen, uninstall the application, change the size of the tile, and
    toggle live notifications from the application on or off.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_435_0.png)


    Figure 13-2. The context menu of a tile.


    Just as with icons in Windows 7 and earlier versions, users can move tiles around
    and organize them in a horizontally scrolling list. Unlike icons, though, in Windows
    8 tiles can''t be grouped into folders. Moving tiles couldn''t be simpler; all
    a user needs to do is drag tiles around using the mouse or a finger on a touch-enabled
    device (see Figure 13-3).'
  merge: -1
  pgno: 435
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_436_0.png)


    # Resizing tiles


    Tiles can be of two sizes: small or large. A small tile is a square box of 130
    x 130 pixels; a large tile is about twice that wide. In Figure 13-3, the Microsoft
    Internet Explorer tile being moved is a small one; the Mail tile in the top-left
    corner is an example of a large one.


    Tiles for custom applications are always created as small tiles; the size can
    be changed only by the user, through the context menu. Resizable tiles are a challenge
    for developers who want to add notifications to their applications. As you’ll
    see later in the exercise, you should plan to use different graphical templates
    for small and large tiles.


    # Unpinned applications


    In Figure 13-2, you saw the Unpin From Start menu item. That option lets users
    remove a given application from the Start screen. Note that unpinned is not the
    same as uninstalled. Unpinned simply means removing an application from the list
    of applications visible in the Start screen, whereas'
  merge: -1
  pgno: 436
- img_proc: true
  md: 'uninstalled means that the application has been fully removed from the device.


    To retrieve an unpinned application later, simply swipe from the bottom of the
    device (or right-click outside of any tiles). In doing so, you bring up a context
    menu with a button that gives you access to the list of installed applications,
    which includes unpinned applications (see Figure 13-4). Another option is to start
    typing the name of an application from the Start screen; the UI will limit the
    display to only those applications whose names match the typed characters.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_437_0.png)


    # Creating Live tiles for a basic application


    The most interesting aspect of dealing with tiles is making them live, via support
    for programmatic notifications. To approach the task of turning tiles into Live
    tiles in a simple way, you''ll first build a new application that displays some
    static text in its tile. Next, you''ll proceed with a more sophisticated example
    where the tile displayed reflects the data and state of the application itself.'
  merge: -1
  pgno: 437
- img_proc: true
  md: "# Preparing the application\n\nCreate a new Windows Store application using\
    \ the usual Blank App template and add the usual header.html and footer.html files\
    \ in the Pages folder. You will also need to add a few new styles to the default.css\
