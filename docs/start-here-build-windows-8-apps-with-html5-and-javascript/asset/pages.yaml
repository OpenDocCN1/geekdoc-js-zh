- img_proc: true
  md: '# Chapter 12. Accessing devices and sensors


    > If you are interested, you never have to look for new interests. They come to
    you. When you are genuinely interested in one thing, it will always lead to something
    else.


    Eleanor Roosevelt


    Smartphones and tablets owe much of their success to the high quality of their
    sensors and internal devices. If you go back to the early days of the iPhone,
    you may recall how astonished people were with the now-mundane Flashlight application.
    That was essentially a toy app—though it had some practical use. The assortment
    of devices and sensors you find on modern devices, such as a tablet equipped with
    Microsoft Windows 8, is so rich as to enable developers to think and build completely
    new types of applications.


    As a Windows 8 developer you have access, even from a JavaScript-based programming
    environment, to a variety of Windows Runtime application programming interfaces
    (APIs) that give you control of a range of sensors, including such things as a
    GPS, a light sensor, an accelerometer, and a compass. In addition, a Windows Store
    application can gain access to devices both connected to the computer or embedded
    in it. Typical examples are printers and the webcam.


    In this chapter, you''ll learn how to use the webcam programmatically, how to
    print content, and how to work with one of the most useful sensors—the GPS compass
    component that returns the current location of the user.


    # Working with the webcam'
  merge: -1
  pgno: 394
- img_proc: true
  md: "Today almost all computers and devices come with a high-resolution webcam.\
    \ A webcam is typically employed by built-in programs to support video conferencing\
    \ and video chat. It is also common for applications to leverage the webcam to\
    \ take instant pictures of the user. From a programming perspective, the webcam\
    \ is just like any other piece of hardware. As a developer, you learn about its\
    \ public API, apply the correct calls, and get the behavior you expect. In the\
    \ 1990s, working with hardware was often a difficult and challenging task. Frankly,\
    \ we now live and code in a different century! As an example, in the next exercise,\
    \ you’ll build a Windows Store application that takes instant pictures of the\
    \ user.\n\n# Capturing the webcam stream\n\nAs usual, you start by creating a\
    \ new Windows 8 project using the Blank App template. Next, you create a new Pages\
    \ folder and add common files such as header.html and footer.html, as you’ve seen\
    \ repeatedly in the preceding chapters. Edit the default.html and default.css\
    \ files appropriately for this application, as described earlier in this book.\
    \ (This work is required only to ensure that all applications have a consistent\
    \ look and feel.)\n\n# Setting up the project\n\nMore importantly, open up the\
    \ default.js file and add the following bootstrapping code:\n\n```\napp.onready\
    \ = function (args) {\n  instantPhotoApp.init();\n}\n```\n\nYou should know by\
    \ now that the init function will be invoked when the application is fully loaded\
    \ and ready to respond to the user’s commands. However, you must create the init\
    \ function. You’ve done quite a few times already in past exercises, add a new\
    \ JavaScript file to the project under the Js folder and name it **instantPhotoApp.js.\n\
    \nThe name of the JavaScript file is actually unimportant, in the sense that whatever\
    \ name you use can work. However, it’s probably not a good idea to"
