    # Working with the GPS system


    To round off this chapter, this section shows how you can obtain information about
    the user’s current position. Getting to know the exact (or even approximate) user
    location is an incredibly valuable piece of information, because it enables you
    to tailor specific services and information for that user.


    # Detecting latitude and longitude


    Windows 8 devices are equipped with a GPS device that you can query for basic
    location information, such as its latitude and longitude. Access to the device
    is wrapped up nicely in an easy-to-use API.


    # Setting up the project


    To get started, you create a new project and follow all the steps in previous
    exercises. The user interface can be as simple as in Figure 12-13: just a button
    and some text elements that display latitude and longitude.'
