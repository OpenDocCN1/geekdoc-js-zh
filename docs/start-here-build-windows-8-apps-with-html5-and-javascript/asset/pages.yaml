- img_proc: true
  md: '# Towards an adaptive layout


    When it comes to snapped and filled views, the bottom line is that users can snap
    any applications. Your application can adapt to the snapped view, but it can''t
    prevent snapping from happening. If the application is not designed with snapping
    in mind, then its area is forcibly resized and this might cause some content to
    be cropped off, as in Figure 8-8.


    # General principles of snapped and filled views


    Generally speaking, all Windows Store applications should abide by a few guidelines
    for snapped and filled views. There might be scenarios and situations in which
    this is not entirely possible. However, every effort should be put to work out
    a layout that seamlessly adapts to any size. Here are the principles at the foundation
    of the snapped view in Windows 8.


    # Be aware of view changes


    Any Windows Store application should always register a handler for the resize
    event of the host window. This ensures that any application can properly react
    to any view changes that are reckoned significant. In the previous exercise, you
    just checked this principle off.


    # Parity of features across states


    Ideally, you should have just one application that provides some uniform behavior
    across the possible view states. Whenever possible, the application should expose
    100 percent of its functionality regardless of the view state—whether snapped,
    filled, landscape, or portrait.


    In practice, though, this principle isn''t the law and needs elastic interpretation.
    What if your application needs to display a large input form? What if the application
    displays large data items like videos or photos? Both videos and photos can be
    shrunk to some extent, but the resulting quality may or not be ideal for the purposes
    of the application.


    # Unsnap with care'
  merge: -1
  pgno: 259
- img_proc: true
  md: "If parity of features is not something you can guarantee, then you should consider\
    \ unsapping the application programmatically when the user selects one of the\
    \ critical functions. As an example, consider a to-do list application.\n\nTo\
    \ comfortably create a new task, you probably want to use a larger section of\
    \ the screen. At the same time, you can probably comfortably list tasks in the\
    \ 320 pixels of the snapped view. So when the user pushes some “Add new task”\
    \ button, you programmatically unsnap the application. To practice with the unsnap\
    \ functionality, add the following code to the SnapMeApp.add function in the SnapMeAdd.js\
    \ file.\n\n```\nSnapMeApp.add.add = function () {\n  SnapMeApp.Current.total++;\n\
    \  var viewState = Windows.UI.ViewManagement.ApplicationViewState;\n  if (SnapMeApp.Current.total\
    \ >= 10 &&\n      viewState == Windows.UI.ViewManagement.ApplicationViewState.snapped){\n\
    \    Windows.UI.ViewManagement.Application.tryUnsnap();\n  }\n  SnapMeApp.refresh();\n\
    }\n```\n\nIn the example, when the counter reaches a threshold value of 10, the\
    \ application will automatically unsnap if it is currently snapped. If you call\
    \ the tryUnsnap function from a non-snapped application, then the call results\
    \ in a no-operation.\n\n# Use a proportional design\n\nA proportional design refers\
    \ to the idea that any content you display should be rendered using sizes and\
    \ measurements proportional to the width of the container element. Using a proportional\
    \ layout (also often referred to as liquid or fluid layout) automatically makes\
    \ the application’s content potentially capable of adapting to any size.\n\nIn\
    \ the context of a proportional layout, you won’t give, say, a DIV element a fixed\
    \ width—as we’ve done in the code behind Figure 8-8. In general,"
  merge: -1
  pgno: 260
- img_proc: true
  md: "though, there’s no guarantee that any applications can be given a fluid layout\
    \ that renders well in a 320-pixel width.\n\nIn Windows Store applications, developers\
    \ tend to employ a user interface that works by listing and flowing elements.\
    \ The underlying framework encourages this by the means of ad hoc components such\
    \ as ListView and SemanticZoom—components that you practiced with in the previous\
    \ chapter. Any content displayed through any of these components has a great chance\
    \ to render nicely in a snapped view.\n\nLet’s learn a bit more about fluid layouts.\n\
    \n# Fluid layouts\n\nThe linchpin of fluid layouts is the ability of HTML elements\
    \ (such as, images, containers, text) to maintain their position and size relative\
    \ to each other and the screen. In addition to resizing and font scaling, another\
    \ major issue of fluid layouts is how to manage excess space so that elements\
    \ can be allocated proportionately in the available area.\n\nIn Windows 8, you\
    \ find excellent support for an approach that is becoming a ratified standard.\
    \ This approach is based on the concept of flexible boxes. You can read more about\
    \ the background of flexible boxes here: \nhttp://bit.ly/SUM20b.\n\n# Flexible\
    \ boxes\n\nIn Windows Store applications, you create a flexible box by giving\
    \ a DIV element a particular set of CSS styles. For a practical hands-on session,\
    \ open the default.css file of the SnapMe project and add the following:\n\n```\n\
    .flexible-container {\n  display: -ms-flex;\n  -ms-flex-direction: row;\n  -ms-flex-align:\
    \ start;\n  -ms-flex-wrap: wrap;\n  color: white;\n  font-size: 2em;\n  text-align:\
    \ center;\n  height: 400px;\n}\n```"
  merge: -1
  pgno: 261
