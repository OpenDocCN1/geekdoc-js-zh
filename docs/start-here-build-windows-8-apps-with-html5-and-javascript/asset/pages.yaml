- img_proc: true
  md: "# Pseudo-classes for input elements\n\nSometimes you just want a different\
    \ style for input fields (that is, text boxes) that are disabled, checked, or\
    \ focused. CSS makes it fairly easy to do this through a bunch of ad hoc pseudo-classes.\
    \ You can use the checked class to select all boxes or radio buttons that are\
    \ currently checked. Likewise, you can use disabled and enabled classes to query\
    \ for related elements. The focus class, instead, signals which element is currently\
    \ holding the input focus.\n\nThe following example automatically switches the\
    \ background color of an INPUT text field to reflect the focused state:\n\n```\n\
    input[type=text]:focus {\n  background-color: orange;\n  color: black;\n}\n```\n\
    \nThe previous code snippet contains an interesting construct that you have not\
    \ met before: an expression in square brackets. That's an attribute pseudo-class.\n\
    \n# Attribute pseudo-classes\n\nAn attribute pseudo-class applies to an existing\
    \ CSS selector and restricts the output to only elements that contain a given\
    \ attribute with a given value. Let's look at the previous CSS snippet closely.\n\
    \n```\ninput[type=text]:focus {\n  background-color: orange;\n  color: black;\n\
    }\n```\n\nThe [type=text] selector applies to INPUT elements and it restricts\
    \ the list of INPUT elements to only those where a type attribute exists and has\
    \ a value of text. Table 3-1 lists the most popular attribute selectors."
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Table 3-1. Popular attribute selectors


    | Selector | Description |

    | [attribute] | Elements that contain an attribute with the specified name. |

    | [attribute = value] | Elements that contain an attribute with the specified
    name and value. |

    | [attribute *= value] | Elements that contain an attribute with the name whose
    value contains the specified value. |

    | [attribute != value] | Elements that contain an attribute with the name whose
    value is different from the specified value. |

    | [attribute ^= value] | Elements that contain an attribute with the name whose
    value begins with the specified value. |

    | [attribute $= value] | Elements that contain an attribute with the name whose
    value ends with the specified value. |


    # Pseudo-classes for retrieving child elements


    Sometimes you just want to pick up some child elements of a given selector. The
    first-child pseudo class returns the first child element, whereas last-child returns
    the last one. In addition, you can pick up the nth child of a given element using
    the nth-child(n) class, where n indicates the index of the child element to select.


    # Compound selectors


    As you may have guessed, in CSS selectors can be composed together to form queries
    of any reasonable complexity. You can concatenate selectors using a blank, the
    comma, or other ad hoc symbols to define queries. Table 3-2 illustrates the most
    common scenarios.'
  merge: -1
  pgno: 102
- img_proc: true
  md: "# Table 3-2. Popular compound selectors\n\n| Selector | Example | Description\
    \ |\n| --- | --- | --- |\n| element element | div a | Selects all A elements contained\
    \ in a DIV elements. |\n| element, element | div,p | Selects all DIV elements\
    \ and all P elements. |\n| element > element | div > a | Selects all A elements\
    \ directly children of a DIV element. |\n| element + element | div + a | Selects\
    \ all A elements placed immediately after a DIV element. |\n\nIn addition, consider\
    \ the following example:\n\n```\ndiv.headline a {\n  ...\n}\n```\n\nThe div.headline\
    \ expression indicates all DIV elements given a CSS class named headline. The\
    \ following a just restricts the query to all A elements contained within any\
    \ subtree rooted in a DIV element with a class of headline.\n\n> NOTE\nWhen it\
    \ comes to classes and pseudo-classes, names are case-insensitive.\n\n# Media\
    \ Queries\n\nWhen you attach a CSS file to an HTML document through the LINK element,\
    \ you also have the option of selecting the medium where the style will be applied.\
    \ You indicate the medium through the media attribute. If media attribute is specified,\
    \ then browsers understand the same CSS file should be used in any possible scenario."
