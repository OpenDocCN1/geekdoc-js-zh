- img_proc: true
  md: '# # Snapping applications


    The user can turn in the snapped state one of the applications that is currently
    running in the background. As a user, you pop up the switch list on the left side
    of the device and right-click the tile of the application of choice. As Figure
    8-1 shows, you can decide to snap the application to the left or the right edge.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_247_0.png)


    Figure 8-1. Turning a background application into the snapped state.


    The result of this action is shown in Figure 8-2. When snapping is on, one application
    is said to be snapped; the other application previously running in full-screen
    mode is turned into a view state named filled.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_248_0.png)


    # The snapped view state


    When snapped, an application is resized to a segment of the screen that is only
    320 pixels wide and takes the entire height of the screen. As Figure 8-2 shows,
    the remaining screen is filled up by the application that was running in the foreground
    when you snapped. With snapping, therefore, users can have two applications in
    the foreground and can really work with both at the same time.


    > **IMPORTANT**

    > There are a couple of key things to remark regarding Windows 8 snapping. First,
    snapping is only available when the horizontal resolution of the screen is at
    least 1366 pixels. Users who to snap applications on lower resolutions will simply
    find the context menu of Figure 8-1 limited to the Close option. Second, snapping
    is only available in landscape mode. If you have an application snapped, then
    rotate the device to portrait, you lose the effect. The non-snapped application
    will run the full screen in portrait view. However, the setting about snapping
    is maintained and is automatically restored soon as the user rotates back to a
    landscape view.


    Also, you should note that users are not allowed to arbitrarily resize the snapped
    area either. The split bar of Figure 8-2 that separates the snapped area'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'and applications can''t be moved at will. If a user moves the split bar to
    the right, she can achieve one of the following effects: the two applications
    swap their view state or the snapped application gets into full-screen mode, pushing
    the other to the background. In the former case, the outcome will be that the
    Calendar app switches to the filled state and the other application gets snapped
    to the right edge.


    # The filled view state


    When snapping is on, the screen is shared horizontally by two applications: the
    snapped application and the filled application (see Figure 8-3).


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_249_0.png)


    Any application can experience both view states during its lifecycle. It''s up
    to the user, not the application, to decide about the display mode. From the application''s
    perspective, support for view states (including snapped and'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'filled view states) is all being ready to render any content in a screen of
    different sizes.


    The behavior of a Windows Store application is not supposed to change when running
    in a view state different from full-screen. There''s a specific guideline that
    recommends this. It is reasonable to expect that very little changes in the application''s
    behavior and user interface when the application is run in landscape, portrait,
    or filled mode. At the same time, not all applications can be resized to a sliver
    of the original screen and still maintain 100 percent of their functionality.


    You''ll see in a moment how to detect view state changes in a Windows Store application
    and what it possibly means for your application to support well different resolutions.
    Before going any further, look at Figure 8-4.


    The figure doesn''t show a screenshot but rather contains a diagram that seeks
    to illustrate the difficulty of (some) applications to adapt to different resolutions.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_250_0.png)


    When snapped, an application has only 320 pixels in width to render its user interface.
    The width is at least least three times larger in the majority of cases.'
  merge: -1
  pgno: 250
- img_proc: true
  md: "A golden rule of Windows Store applications can be quickly summarized as, “Be\
    \ ready to do something significant with about 320 x 760 pixels.”\n\n# Making\
    \ the application reactive\n\nLet's see now what an application should do in order\
    \ to detect and possibly handle view state changes. Create a new Windows Store\
    \ application starting from the Blank App project template; you can name this\
    \ application SnapMe. Next, make all the preliminary changes to the project that\
    \ you did in all previous examples. This entails, for example, adding a header\
    \ and footer, some styles to the default.css file, and an application-specific\
    \ script file. Let's call this new script SnapMeApp.js.\n\n# Introducing new practices\
    \ for application development\n\nIn the previous chapters, you didn't pay much\
    \ attention to the state of the application. All of the exercises you did, in\
    \ fact, essentially concerned stateless applications. Nearly any application has\
    \ a state that is updated as the user works with the application. The state needs\
    \ to be saved to a permanent store when the application is suspended. In this\
    \ way, you can easily restore it when the application is resumed or re-launched\
    \ thus giving the user a nice feeling of continuity.\n\nWith this goal in mind,\
    \ you add the following code to the newly created SnapMeApp.js file:\n\n```\n\
    var SnapMeApp = SnapMeApp || {};\n\nvar SnapMeState = WinJS.Class.define(function\
    \ () {\n  var that = {};\n  that.currentState = SnapMeApp.getViewStateForDisplay();\n\
    \  that.total = 0;\n  return that;\n});\n```\n\n```\nSnapMeApp.init = function\
    \ () {\n  SnapMeApp.Current = new SnapMeState();\n  var buttonCounter = document.getElementById(\"\
    buttonCounter\");\n  buttonCounter.addEventListener(\"click\", SnapMeApp.add);\n\
    ```"
  merge: -1
