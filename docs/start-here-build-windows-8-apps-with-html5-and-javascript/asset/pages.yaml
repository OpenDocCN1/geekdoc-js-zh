    In the next step, you choose the destination folder on the local disk where you
    want to save the package. Keeping track of this folder is important, because you
    will need it to upload the package to the Windows Store at the end of the packaging
    process. You also need to select at least one target platform from the form shown
    in Figure 14-12.'
