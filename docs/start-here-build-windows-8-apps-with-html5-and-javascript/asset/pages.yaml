    # # Building a gallery of pictures


    How would you lay out a gallery of pictures? That Mostly depends on your creativity
    and preferences. In general, a gallery should provide a scrollable list of small
    images—ideally thumbnails—and give the user a chance to click one image to see
    it in a larger format and possibly zoom on it. To build the gallery of pictures,
    you focus on the content of the home.html file.


    # # Introducing the FlipView component'
