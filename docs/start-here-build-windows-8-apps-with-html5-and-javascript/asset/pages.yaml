  md: '# # Chapter 5. First steps with Windows 8 development


    Success is counted sweetest by those who neer succeed.


    > —Emily Dickinson


    In Chapter 1, you had a first short glimpse of the Microsoft Windows 8 programming
    style. You created a simple application directly from one basic template offered
    by Microsoft Visual Studio, then turned that into a slightly more functional and
