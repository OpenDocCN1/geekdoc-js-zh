    The CameraCapture object deals with photos and video, so it exposes two distinct
    properties by which you can configure video and photo settings: *photoSettings*
    and *videoSettings*. For the purpose of this exercise, you''ll focus only on *photoSettings*.


    The *photoSettings* object offers a few properties to define the size (in pixels)
    of the resulting image, its aspect ratio, and the file format in which you want
    to store the image. Here''s what you need to do to ensure a 16:9 aspect ratio
    and store the image bits as a JPEG image.


    ```

    var dialog = new Windows.Media.Capture.CameraCaptureUI();

    var aspectRatio = { width: 16, height: 9 };

    dialog.photoSettings.croppedAspectRatio = aspectRatio;

    dialog.photoSettings.format = =

    Windows.Media.Capture.CameraCaptureUIPhotoFormat.jpeg;

    ```


    If you don''t like the JPEG format, you can choose the PNG format instead:


    ```

    dialog.photoSettings.format = =

    Windows.Media.Capture.CameraCaptureUIPhotoFormat.png;

    ```


    In general the JPEG format results in a slightly more compact file that requires
    fewer resources and less time to transfer over the wire, and it also takes less
    space when stored on disk. In contrast, the PNG format ensures a somewhat better
    image quality; the tradeoff is a larger file size—a PNG image is usually nearly
    double the size of a JPEG image.


