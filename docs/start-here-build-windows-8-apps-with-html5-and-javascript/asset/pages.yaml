  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_174_0.png)


    The References folder contains the list of libraries required to compile the application.
    In this case, the only library you need is the by-now-familiar WinJS library.


    The CSS folder contains the style sheets for styling the various HTML pages you
    use in your application. You can expect to have one CSS file per each page you
