    \   data-win-options=\"{uri:/pages/header.html}\">\n  </div>\n  <h1>Print-n-Go\
    \ (CH12)</h1>\n  <button id=\"button1\">Print template #1</button>\n  <button\
    \ id=\"button2\">Print template #2</button>\n  <div data-win-control=\"Win35.UI.HtmlControl\"\
    \n    data-win-options=\"{uri:/pages/footer.html}\">\n  </div>\n</div>\n```\n\n\
    This markup contains an extra feature that you haven't seen in previous exercises.\
