  md: 'In the upcoming chapters, you''ll take a tour of the various classes of functions
    and see how to take advantage of them in sample applications.


    # Aspects of the WinRT API


    Any code that you write on top of the WinRT API using any of the supported development
    stacks (that is, HTML+JavaScript) will have some common aspects. These common
    aspects descend from the design and implementation of the underlying WinRT API
    and strongly characterize function calls that you make through WinJS—your gateway
    to the low-level WinRT API.


    For example, any functions expected to perform for longer than just a bunch of
    milliseconds have been designed to be asynchronous. This is a huge change for
    developers with designed some experience in Windows development. An asynchronous
    function is a function that begins execution when invoked but has no well-defined
    timeline for termination.


    In other words, an asynchronous function right after launch proceeds in parallel
    with any subsequent code. So a developer who needs to execute code with the results
    of the asynchronous operation now has the problem of where to place this code.
    The shift towards asynchronous programming, however, is significantly mitigated
    by some new facilities available at the language level. In the end, all that you,
    as a beginning Windows 8 developer, need to learn is how to make a function call
    and to grab its results. For former .NET developers, though, the asynchronous
    nature of the WinRT API might be an issue.


    Another area of the WinRT API that deserves some early thoughts is storage and
    file access. In Windows Store applications, direct file access is restricted in
    the name of security. That doesn''t mean, however, that you cannot permanently
    store data in a Windows Store application. More simply, the storage API that WinRT
    makes available doesn''t give developers full control over the disk—as it is always
    the case for classic Windows applications. To open and save documents and files,
    you also have new file pickers that replace the standard common dialogs of Windows.'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'Developers of Windows Store applications find an overall programming framework
    (for example, WinJS for those who choose the HTML+ JavaScript stack) that looks
    a lot like the popular .NET Framework, but still has some differences. These differences
    are clear signs of the overall commitment by Microsoft to rework and reimagine
    the programming framework that Windows 8 developers deal with. As a result, some
    of the classes in the WinJS library are functionally identical to .NET Framework
    classes; some have minor differences. Other classes, instead, have a counterpart
    and some are just unavailable. Finally, some new classes make their debut and,
    overall, they contribute to making the developer''s arsenal powerful enough to
    build effective and functional applications.


    # The Windows Store app user interface


    Far beyond functionality, what really identifies an application as a Windows Store
    application is its user interface and the resulting user experience. The new user
    interface of Windows Store applications is known as the Windows 8 UI. This new
    revolutionary user interface results from the combination of features specific
    to the Windows 8 operating system with some innovative design principles. Let''s
    find out more.


    # Aspects of the Windows 8 UI


    If you stop at appearances, the Windows 8 UI guidelines are just for new Windows
    Store applications and can''t be adapted to Windows 7, web, and mobile apps to
    new Windows applications, even if developed and run specifically for Windows 8.


    If you take a second, deeper look at the Windows 8 UI initiative, you can''t help
    but recognize a bunch of universal design principles that describe concisely and
    precisely the vision behind software applications of the next years. You can conclude
    that there''s substance behind the new look and feel.


    The Windows 8 UI at a glance'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'Here’s a quick list of aspects that strongly characterize the user interface
    of a Windows Store application. First and foremost, a Windows Store application
    is touch-enabled, but it is not limited to touch as the sole source of input.
    Support for touch is an aspect that enables the application to work smoothly on
    a tablet but also on a regular laptop or on a desktop computer equipped with a
    touch screen.


    Second, a Windows Store application displays in a single, plain borderless window
    devoid of any adornment such as resizable borders, caption bar, and icons. This
    definitely a breaking change than any previous version of Windows. At the same
    time, a Windows Store application adapts to the effective size and shape of the
    screen and can offer a fluid rendering experience. The content adapts intelligently
    to whatever layout the physical screen may have.


    Finally, a Windows Store application integrates smoothly with the surrounding
    environment and will leverage new facilities, such as the App bar, Live tiles
    (a smart replacement for old-fashioned desktop icons), and the Charms bar (quick
    buttons to interact with other apps through well-known contracts). A Live tile,
    in particular, is a square block displayed in the Start screen of Windows 8 that
    references an installed application. What makes a tile “live” is the ability to
    display a little animation and content based on the data that the application
    holds or the current state. Figure 5-4 displays the Charms bar; Figure 5-5 shows
    live tiles; and Figure 5-6 illustrates the App bar.'
  merge: -1
