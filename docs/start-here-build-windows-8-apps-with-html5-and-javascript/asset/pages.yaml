  md: "```\n<div data-win-control=\"WinJS.UI.HtmlControl\"\n    data-win-options=\"\
    {uri:'/pages/footer.html'}\\</div>\n</body>\n</html>\n```\n\nSo far, so good,\
    \ but nothing in the application yet adds life to the default static tile.\n\n\
    # The notification object\n\nTo add live capabilities to tiles, you need to create\
    \ a notification. In this context, a notification is an instance of the Windows.UI.Notifications.TileNotification\
    \ object. When you instantiate the notification object pass some data that identifies\
    \ the layout you want for the content within the tile. You should create the notification\
    \ object only once in the application's lifecycle. However, you can subsequently\
    \ update the tile's count as many times as needed depending on the logic of the\
    \ application. The notification object acts as a bridge between the application\
    \ and the system; once created, the notification remains in place for some time\
    \ even if the application is terminated or offline.\n\n# Creating an application\
    \ notification\n\nTo add Live tiles to an application, you go through three steps.\
    \ First, you choose the layout of the tile text. Next, you add application-specific\
    \ data to the layout. Finally, you create a notification object from the template\
    \ and add it to the system’s list.\n\nWindows 8 comes with a long list of tile\
    \ templates. You find them in the Windows.UI.Notifications.TileTemplateType enumeration.\
    \ Each member of the enumeration refers to a different layout with a few placeholders\
    \ for text and/or images. A frequently used tile template is the following:\n\n\
    ```\nWindows.UI.Notifications.TileTemplateType.tileTextSquare02\n```\n\nThe template\
    \ consists of two rows of text that are automatically styled to look like the\
    \ title and subtitle of some item. The first line of text is aligned"
  merge: -1
  pgno: 439
- img_proc: true
  md: "at the top of the tile and displays with a larger font. The second line wraps\n\
    to the bottom and is rendered with a smaller font.\n\nA tile template is ultimately\
    \ an XML string; as a developer, however, you\ndon't have much exposure to the\
    \ details of the XML. All you need to do is get the content of the template and\
    \ work on it to replace some elements.\nHere is the code you need to add to the\
    \ start code of your application. You open up the tilesDemoApp.js file and add\
    \ the following code:\n\n```\ntilesDemoApp.init = function () {\n  var template\
    \ = Windows.UI.Notifications.TileTemplate.tileSquareText02;\n  var xml = Windows.UI.Notifications.TileUpdateManager;\n\
    \  getTemplateContent(template);\n  // More code goes here\n}\n```\n\nThe XML\
    \ content returned to you depends on the selected template. For the\ntemplate\
    \ chosen here, the template contains two text elements to be filled up\n the text\
    \ you want to display on the tile. Add the following code to add\napplication-specific\
    \ content to the template.\n\n```\ntilesDemoApp.init = function () {\n  var template\
    \ = Windows.UI.Notifications.TileTemplate.tileSquareText02;\n  var xml = Windows.UI.Notifications.TileUpdateManager;\n\
    \  getTemplateContent(template);\n  var textElements = xml.getElementsByTagName(\"\
    text\");\n\n  // Fill up text placeholders in the tile template\n  textElements[0].innerText\
    \ = \"Title\";\n  textElements[1].innerText = \"This is the subtitle\";\n\n  //\
    \ More code goes here\n}\n```\n\nFinally, you need to register the tile with the\
    \ operating system so that the\ncontent can be properly displayed from the Start\
    \ screen. A few more lines\nof code should then be added to the init function\
    \ in the tilesDemoApp.js file.\nHere's the final code you need to have in the\
    \ init function:"
  merge: -1
  pgno: 440
- img_proc: true
  md: "```\ntilesDemoApp.init = function () {\n  var template = Windows.UI.Notifications.TileTemplate.tileSquareText0;\n\
    \  var xml = Windows.UI.Notifications.TileUpdateManager;\n  getContentBy(template);\n\
    \  var textElements = xml.getElementsByTagName(\"text\");\n\n  // Fill up text\
