  md: '# Chapter 4. Making sense of JavaScript


    Grasp the subject, the words will follow.


    > —Cato, the Elder


    JavaScript is probably a language with nine (or even more) lives. JavaScript made
    its official debut in 1996 as part of the Netscape browser and happily survived
    the first 15 years of the Internet era. It was originally supposed to be a simple
    language targeted at web authors willing to make their HTML pages more responsive
    and attractive. JavaScript was never designed to be a full-fledged programming
    language, but rather something that was easy to work with.


    And in the end it worked well.


    JavaScript has a remarkably low barrier to entry and is flexible enough to enable
    experts to do nearly anything with it. Today, knowing JavaScript is a critical
    skill for essentially all developers; it is easy to get acquainted with, but unfortunately,
    it''s also not trivial to master.


    With the release of Windows 8, Microsoft makes HTML5 and JavaScript a first-class
    platform for building applications. Developers use HTML5 to build layout and CSS
    to style. Developers also use JavaScript to manipulate page elements. At the same
    time, though, developers have access to a bunch of system-provided libraries that
    offer user interface widgets and components that allow developers to access capabilities
    specific to Windows 8.


    It is expected that developers using JavaScript to write Windows 8 applications
    are primarily interested in binding freshly downloaded data to user interface
    elements. It doesn''t mean, however, that you can''t use JavaScript to implement
    at least a few bits of business Logic. In general,'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'though, keep in mind that the more business logic you must express in JavaScript,
    the less appropriate JavaScript may be as your choice of programming language.


    This chapter aims at revisiting the foundation of the JavaScript language, and
    discusses a few basic patterns for organizing JavaScript code from within a Windows
    8 application.


    # Language basics


    The JavaScript language relies on a solid standard, as defined by the ECMA-262
    and ISO/IEC 16262:2011 papers. Unlike what happens with other popular programming
    languages like C#, JavaScript code is not compiled before execution. Instead,
    JavaScript code is interpreted and then executed on the fly. For this reason,
    JavaScript needs a runtime environment (the engine that translates and executes
    the code you write) in order to run. On the Windows 8 platform, JavaScript is
    supported by a runtime environment named Chakra, like the Buddhist force it is
    named after, pushes vital energy throughout the body of HTML pages.


    > NOTE

    The majority of programming languages (such as C#, Visual Basic, C++, and Java)
    let developers express an intended behavior by using a high-level language. The
    code expressed in this way, though, must first be "compiled" to a lower-level
    language that is much closer to the actual behavior of the machine. Another way,
    the programming language commonly used by developers is a abstraction over the
    behavior of the machine. A classic compiled language needs a special tool—the
    compiler—to transform high-level syntax into lower-level syntax. You can''t run
    your program until you successfully compiled it. Other languages—such as JavaScript—are
    not compiled. This doesn''t mean they don''t need any adaptation to run; a non-compiled
    (interpreted) language simply has its "compilation step" performed during execution
    just before a given line is executed.


    Let''s now navigate through the basics of the language, digging out aspects of
    the type system, the use of variables and functions, and good and bad'
