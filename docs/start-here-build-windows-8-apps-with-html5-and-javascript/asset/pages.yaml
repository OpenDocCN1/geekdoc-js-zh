- img_proc: true
  md: "# Giving requests a timeout\n\nA request to a remote server may take a while\
    \ to complete. The time-response depends on a number of factors, including bandwidth,\
    \ traffic on the target site. If completing the operation in a fixed amount of\
    \ time is critical for your application, you might want to associate a timeout\
    \ with your WinJS.xhr request. When you do that, the request is still pending\
    \ after the specified amount of time elapses, the request is automatically canceled\
    \ and raises an error that propagates back to the calling application. Here's\
    \ the code you need to set up a timeout:\n\n```\nWinJS.Promise.timeout(3000,\n\
    \  WinJS.xhr({ url: ... }).then(\n    function (response) {\n      // Process\
    \ response\n    },\n    function (error) {\n      rssReaderApp.alert(error.message);\n\
    \    })\n);\n```\n\nBasically, all you do is wrap your WinJS.xhr call within a\
    \ call to WinJS.Promise.timeout. The first parameter sets the expected timeout\
    \ (in milliseconds); the second parameter is your call to WinJS.xhr. Note that\
    \ if the request fails because it times out, then the error object you receive\
    \ has the message property set to a generic message you can display directly to\
    \ users, in this case, just “Canceled” (see Figure 11-3)."
