    # Forms and input validation


    Each HTML form should contain a submit button; when the submit button is pushed
    the browser collects the content of the input fields and prepares to post it to
    the specified URL. Until HTML5, the browser was not responsible for validating
    the content of the form. Developers, though, could hook up validation to the process
    using a bit of JavaScript code.


    Validating a form entails checking that each field in the form contains valid
    content. Although the HTML5 standard doesn’t mandate browsers to validate the
    content of a form, this is indeed what happens by default with most browsers.
    HTML5 browsers give you a chance to disable validation'
  merge: -1
