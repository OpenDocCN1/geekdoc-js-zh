- img_proc: true
  md: '# Saving to the localSettings storage


    The localSettings storage is a data container specific to the application that
    takes the form of a dictionary. You access it programmatically, as shown below:


    ```

    var applicationData = Windows.Storage.ApplicationData.current;

    var localSettings = applicationData.localSettings;

    ```


    You read and write data to the container using the classic dictionary approach.
    Each entry is uniquely identified by a key and references a value. The key is
    a string of up to 255 characters in length; the value can be any valid Windows
    8 type (including arrays and collections of custom types) not larger than 8 KB.
    You used the localSettings already in Chapter 9 to store the default settings
    of the TodoList application. Here’s how you write and read entry to the store:


    ```

    // Write to the store

    localSettings.values["sampleKey"] = "Some data";

    ```


    ```

    // Read from the store

    var value = localSettings.values["sampleKey"];

    ```


    The localSettings dictionary provides a fairly rich programming interface with
    methods to remove an item, check for existence, and also some query commands.
    You can find out more looking at the MSDN documentation for the ApplicationDataContainer
    class at the following URL: http://msdn.microsoft.com/en-/library/windows/apps/storage.applicationdatacontainsettings


    The localSettings store is not limited to storing only user preferences and also
    be used to store live data of the application. However, the dictionary layout
    and limitations in the size of individual entries make it a good choice for small
    pieces of data that can be retrieved and stored as a key/value pair. As long as
    you can retrieve the data you want with a direct call, this store can serve you
    well. In addition, using this API doesn’t'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'require you to deal with the intricacies of asynchronous programming and basic
    I/O operations, such as creating, opening, and locating files.


    # IMPORTANT


    If you use the Settings dictionary instead of localSettings, all of your stored
    data will be automatically synchronized by Windows 8 across all devices and computers
    running the application under the same Windows account. This means that you can
    set a preference, on, a Microsoft Surface device and retrieve that setting when
    you use the same application on a PC equipped with Windows 8. The API for reading
    and writing data to the roamingSettings dictionary is essential for localSettings.
    The only barrier to using roamingSettings by default is whether the stored data
    makes sense if used on a different device. Usually, this is not an issue with
    settings that represent user preferences on the configuration of an application.


    # Saving to the local disk


    As you''ve seen far, Windows Store applications can gain a partial access to the
    local disk. You can programmatically access the Documents or Pictures folder and
    create files there. You can use file pickers to gain access to any file in nearly
    any folder. However, you can''t programmatically point your code to the root folder
    of a drive and start creating files and subfolders there. To fully use the local
    disk, you need to rely on file pickers.


    It is important to note that while programmatic access to known folders such as
    Documents and Pictures is permitted, it is still subject to user''s approval.
    A Windows Store application that needs to manipulate a known folder must pre-emptively
    declare its intention so that the user installing the application can be notified
    by the operating system. You do this by opening the manifest file of the project
    in Microsoft Visual Studio and selecting the Capabilities tab (see Figure 10-7).'
  merge: -1
  pgno: 338
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_339_0.png)


    Figure 10-7. Declaring capabilities in a Windows Store application.


    With the few exceptions represented by library folders (*Documents, Pictures,
    Music*), using the local disk from within a Windows Store application is restricted
    to using file pickers to locate files. Once you hold a reference to a file or
    folder, you can freely operate on them. The local disk option is effective for
    those applications which intend to create and consume data that remain on the
    disk for other applications to consume. If the data your application manipulates
    doesn''t make sense outside the application, a direct use of the local disk is
    not probably the handiest option.


    # NOTE


    Files created in a local disk folder won''t be deleted when the user uninstalls
    the application. This aspect may be a pro or a con for an application depending
    on its intended use.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '> IMPORTANT

    as you may see in Figure 10-7, a Windows Store application must also declare as
    a special capability it identifies to manipulate files on a removable storage
    device such as an external hard disk or a USB pen drive. In addition, an application
    that intends to support removable storage must declare in the Declarations tab
    of the manifest the types of files it intends to work on. This is done to prevent
    an application''s access to any files the user may have on an external device.


    # # Saving to the isolated storage


    Sometimes the application and its data form a monolith that users want to get
    rid of as a whole. This pattern is kind of new for developers used to writing
    classic desktop applications; it should be instead familiar to developers with
    some background in the development of mobile and Microsoft Silverlight applications.


    Windows Store applications can also have their own private space where they can
    create files and folders. This space is physically located on the local disk,
    but its content can''t be accessed from outside the application, either programmatically
    or through file pickers. Any files and folders created in the application''s private
    space are lost when the user uninstalls the application. The application''s private
    space is often referred to as the isolated storage.


    There are three different types of isolated storage: local, roaming, and temporary.
    Table 10-1 provides a description of the options.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# Table 10-1. Different types of isolated storage


    | Storage | Description |

    | local | Files and folders created within the local storage will only be stored
    on the local machine and stay there until the user uninstalls the application.
    The application is solely responsible for updating or deleting files. These files
    are inaccessible for other applications and file pickers. |

    | roaming | Files and folders created within the roaming storage are subject to
    the same rules as the local storage, except that they are synchronized between
    all Windows 8 machines running your application under the same Windows account.
    |

    | temporary | Files and folders created within the temporary storage are subject
    to the same rules as the local storage, except that they will be deleted periodically
    by Windows. |


    The API for manipulating files (that is, creating, writing, and reading content)
    in the local disk or the isolated storage is the same. All that changes is the
    root object to which you apply your I/O actions.


    > NOTE

    If none of the options listed here for storing data are satisfying, then you probably
    want to consider using a true database. A database allows you to store data in
    tables where a table is a collection of related data organized in columns. For
    example, the Task object you used so far can easily be rendered as a row in a
    database table. The positive aspect of using a database is in the query capabilities
    it; in this case, a database will offer unparalleled capabilities of searching
    for tasks based on their priority, due date, or perhaps completion. If these aspects
    are key for you, then embedding a database in your Windows Store application is
    a wise choice. Having said that, which database can you run on a Windows 8 device?
    The best choice is probably using SQLite. You can install the SQLite runtime for
    Windows Store applications directly from the Tools | Extensions and Updates of
    Visual Studio. Once, you select the Online | Visual Studio Gallery tab, and then
    query for SQLite the setup process and a quick introduction to using SQLite in
    Windows 8 can be found here:

    ://bit.ly/MuzL1e.


    # Creating tasks in the isolated storage'
