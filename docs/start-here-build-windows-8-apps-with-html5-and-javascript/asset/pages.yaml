    | Architecture | Solution Configuration |

    |---|---|

    | Neutral | Release (Any CPU) |

    | x86 | Release (x86) |

    | x64 | Release (x64) |

    | ARM | Release (ARM) |


    - Include public symbol files, if any, to enable crash analysis for the app


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_467_0.png)


    The target platform refers to the hardware architecture of the machines that may
    run your application. To ensure the widest possible audience for your application,
    you should generally choose to compile for all platforms.


    > IMPORTANT

    nThe point here is that the Windows 8 operating system runs on a variety of different
    hardware configurations, most notably 32-bit machines (x86), 64-bit machines (x64),
    and devices such as a tablet with an ARM architecture. To make it clear, if you
    fail to tick the ARM checkbox, then your Windows Store application won''t be able
    to run on a Windows 8 tablet running WinRT.'
  merge: -1
  pgno: 467
- img_proc: true
  md: 'When you push the Create button in the form shown in Figure 14-12, Visual Studio
    runs a process that creates a valid package for the Windows Store application.
    During this process, Visual Studio launches the application and performs several
    tests on it. If everything checks out, you will see the dialog box shown in Figure
    14-13.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_468_0.png)


    Having an app package ready doesn’t mean that you’re done. The application is
    not yet ready to upload to a format that the Windows Store can accept. There’s
    no guarantee that you created the package in a format that the Windows Store can
    accept, your application, as-is, will be accepted and published to the store.
    Your application must still be certified before it can appear in the Windows Store.'
  merge: -1
  pgno: 468
- img_proc: true
  md: 'Any application submitted to the Windows Store for publication needs to pass
    a number of additional tests. If the application crashes during any of these tests,
    or fails the tests in any way, the Windows Store will reject the application,
    providing you with documentation about the app''s misbehavior and some guidelines
    on how you can go fixing it.


    # The Windows App Certification Kit


    To avoid a rejection, or more precisely, to reduce the likelihood that your application
    will be rejected, you can run the same battery of tests that Microsoft runs on
    applications locally, before you submit your app to the store. Those tests are
    available to you through the Windows App Certification Kit. As shown in Figure
    14-13, you can click on the Launch Windows App Certification Kit button at the
    bottom of the window and run the same tests locally that your application will
    be subject after you submit it. Figure 14 shows the two-step process.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_469_0.png)


    Figure 14-14. Running the Windows App Certification Kit.


    You can look at a test report to get details by clicking the link shown in the
    final dialog box. Figure 14-15 shows a sample test report for an application that
    passed the tests.


    Passing the tests in the certification kit doesn’t guarantee that your application
    will pass all Windows Store criteria and be accepted in the store.'
  merge: -1
  pgno: 469
- img_proc: true
  md: 'However, it should make you confident that you have given your application
    the best possible chance to be published when you upload it.


    # NOTE


    It''s always a good practice to ensure that your app passes the certification
    kit before you upload it. After uploading, it may take over a week before you
    get a response from Microsoft. If the response is negative, even assuming you
    fix and resubmit immediately, it will take at least another week before your application
    can be published.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_470_0.png)


    Figure 14-15. A sample report of the standard tests for a successful app.


    # Uploading the application


    The final step in getting the application published is to send the package to
    Microsoft. You do this by clicking Upload App Packages from the Visual Studio
    Store menu. As soon as the package transfer begins, you will see a page similar
    to Figure 14-16.'
  merge: -1
  pgno: 470
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_471_0.png)


    After it has reached the Windows Store servers, you need to properly describe
    your application package and get it ready for final testing. So at this stage,
    you enter the description that you want users to see, and any keywords that may
    help them to find your app in the store (see Figure 14-17). This is also the place
    where you can add screenshots to help sell your application to potential customers.'
  merge: -1
  pgno: 471
- img_proc: true
  md: '# # T-List: Release 1


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_472_0.png)


    Figure 14-17. Entering the description and keywords for your application.


    The application will go through several tests before publishing. Some tests are
    automated (for example, the tests in the certification kit); other tests will
    be run by a person. You may enter some information to help that person better
    understand and verify your application’s behavior. As in Figure 14-18, adding
    notes for testers is the final step before you actually submit your application
    for certification.'
  merge: -1
  pgno: 472
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_473_0.png)


    After you submit your application for certification, the related package is queued
    for the automated tests. Automated tests are related to security and technical
    compliance of the application. They are analogous to the certification tests you
    (should) have already run locally, and because they’re automatic, you’ll know
    whether your app passed or was rejected within a few hours. If something goes
    wrong, you receive a prompt notification.


    The most delicate part of the certification process is checking for content compliance.
    This task is completed by a person, and may take up to seven days. After passing
    this test, the application goes into Release mode. When you entered the application
    description, you were also given the chance to decide about the release procedure.
    Application release can happen as soon as the application has passed all tests,
    or at your earliest convenience. After the application is approved and you’re
    ready to publish it, the package moves to the signing phase, where its binary
    code is signed with a key to prevent tampering and is then put on the output queue
    to become visible on the Windows Store servers.'
  merge: -1
  pgno: 473
- img_proc: true
  md: '# Sideloaded applications


    The scenario described so far is likely the most frequent. However, there’s another
    scenario that needs to be addressed briefly. What if you don’t publish the application
    to the store, but just make it available to a well-known customer or customers?


    Publishing an application to the Windows Store, whether a free or paid application,
    gives every owner of a machine equipped with Windows 8 a chance to download and
    install your application. This is desirable in most cases, but not in all cases.


    Therefore, Windows 8 offers a different way to distribute applications, known
    as Enterprise Sideloading. Not all Windows 8 machines are configured to support
    sideloaded applications, so by taking this track, you are limiting your target
    audience to only owners of the Enterprise edition of Windows 8. More basic versions
    of Windows 8 don’t support sideloaded applications—only approved applications
    that are downloaded and installed from the store. However, even basic Windows
    8 machines can support sideloaded applications by purchasing ad hoc keys per machine
    basis.


    In addition, for application sideloading to work, the target machines must be
    part of a domain that enables the policy to “Allow all trusted apps to install.”


    # Summary


    Overall, you have three options for writing applications that run on a Windows
    8 machine. The first is to write Windows desktop applications that also run on
    earlier versions of Windows. But if you were doing that, the entire content of
    this book would be useless to you. In fact, you would write such applications
    against the .NET Framework using C# or Visual Basic as the primary programming
    language.


    The second alternative is the main thrust of what this book has covered: writing
    Windows Store applications that take advantage of both Windows RT and the Windows
    8 modern UI. These applications, though, are usually'
  merge: -1
  pgno: 474
- img_proc: true
  md: 'intended for distribution through the Windows Store in an unrestricted way.

    This means that after you have made the application available to the Windows Store,
    any Windows 8 user can get and install it. Finally, the third option is to create
    sideloaded applications. A sideloaded application is a Windows 8 modern UI application,
    such as those described in this book, that you can install on machines set up
    to they have special capability of accepting trusted applications. It is key to
    note that a sideloaded application is in no way different from a Windows Store
    application; it''s the target environment that must be configured differently,
    so that machine can install applications from locations other than the Windows
    Store, such as via email or from a CD or DVD.


    This book covered Windows 8 development with HTML5 and JavaScript from an initial
    “Hello Windows 8” application all the way through to publishing a completed free
    or for-sale application. If you made it to this point and completed all the exercises,
    you’re in a position to start publishing some great Windows 8 applications. All
    the best!'
  merge: -1
  pgno: 475
