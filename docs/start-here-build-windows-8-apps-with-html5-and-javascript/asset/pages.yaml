  md: "```\n.img-button {\n  color: #ffffff; /* white * */\n  background-image: url(/images/button-bgnd.png);\n\
    \  background-repeat: no-repeat;\n}\n```\n\nThe background-image property allows\
    \ you to link the image for the background. You do that via the url function,\
    \ as you can see in the example. If the image is too small for the background\
    \ area, you may decide to repeat it vertically and/or horizontally or to render\
    \ it only once. You control this via the background-repeat property, with the\
    \ values no-repeat, repeat-x (horizontal), and repeat-y (vertical).\n\nBitmaps\
    \ are often used to paint the background of the entire page. If the image is rich\
    \ in content and scrolls horizontally or vertically, what should the image do?\
    \ It should scroll with the rest of the page or should it stick to its original\
    \ position and have the content scroll over it? You can control that; here's how:\n\
    \n```\nbody {\n  color: #ffffff; /* white * */\n  background-image: url(/images/bgnd.png);\n\
    \  background-repeat: no-repeat;\n  background-attachment: fixed;\n}\n```\n\n\
    The background-attachment property accepts either of the following two values,\
