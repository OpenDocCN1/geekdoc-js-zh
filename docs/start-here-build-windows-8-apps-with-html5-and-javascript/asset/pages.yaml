  md: '# Chapter 10. Adding persistent data to applications


    It matters if you just don''t give up.


    > —Stephen Hawking


    No applications that are expected to be more than just a basic exercise can operate
    without persistent data. As users work with the application, they produce information
    by entering fresh data or processing known values. This information will not be
    lost with the shutdown of the application. This information is vital and must
    be persisted somewhere to be reloaded on the next session or on demand.


    To make data persistent, software uses files; sometimes applications use of very
    special files known as databases. A database is a large collection of files owned
    and managed by a specific and distinct application. Interacting with a database
    is more expensive in terms of system resources since it involves ad hoc protocols
    for an app-to-app communication.


    In this chapter, you won''t use any database, but you will go through a number
    of exercises that involve files. In particular, you''ll be extending the TodoList
    application to make it able to save tasks to files and reload them on demand.
    In doing so, you will learn a lot about the application programming interface
    (API) available to Windows Store applications to deal with persistent data.


