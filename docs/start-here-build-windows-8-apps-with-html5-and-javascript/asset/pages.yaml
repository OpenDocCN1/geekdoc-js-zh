    taskStatus\");\n  dropDown.selectedIndex = TodoList.getIndexFromStatus(task.status);\n\
    }\n```\n\nData works in a cascading manner, in the sense that you attach a data\
    \ source object to a container element and then use the WinJS library to resolve\
    \ dependencies for. You establish a dependency between a user interface element\
    \ and a property in the data source through the data-win-bind attribute. You can\
    \ do that through markup attributes, in which case the data binding is called\
    \ declarative data binding. You'll see how to create a declarative data binding\
    \ first.(You can also create bindings programmatically rather than declaratively,\
    \ as you'll see shortly.)\n\nThe preceding code shows how to link a data source—the\
    \ newly created Task object—to the div element that contains the entire form.\
    \ This div is the element you are binding. The creation of the link passes through\
    \ the processAll function.\n\nUnfortunately, in WinJS, not all components fully\
    \ support declarative binding. Data binding works as long as you want to bind\
    \ data to plain"
