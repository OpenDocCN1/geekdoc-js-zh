- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_24_0.png)


    A developer license successfully installed on a machine enables you to freely
    create and run Windows 8 applications outside the official Windows Store.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '> NOTE

    A Windows 8 machine can install only certified applications, either downloaded
    from the Windows Store (in much the same way in which it works for Windows Phone
    applications), or created by registered developers on a “signed” machine, so you’ll
    need the developer license to complete the examples in this book.


    You won’t receive any further warning from the system until the developer license
    expires or you remove it from the machine. If your license expires, you can renew
    it directly from the Visual Studio environment. To renew a license, users of Visual
    Studio click the Store menu and then select Acquire Developer License, as shown
    in Figure 1-8.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_25_0.png)


    You can get as many developer licenses as you need, provided that you have a Windows
    Live ID account.


    # Windows Store account


    Getting a developer license for Windows 8 is only the first mandatory step in
    developing and testing Windows 8 applications. Armed solely with a'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'developer account, you can’t publish a Windows 8 application to the Windows
    Store for others to download and install.


    There’s no direct relationship between developer accounts and Windows Store accounts.
    Each plays a specific role and you can get one without having the other. However,
    if you own a Windows Store account and then qualify for a developer license, then
    the default expiration of your developer license is automatically set to a longer
    time.


    The point to remember is that before you can publish your Windows 8 application
    to the Windows Store, you need to get a Windows Store account. You’ll see how
    to obtain a Windows Store account later, in Chapter 14.


    > IMPORTANT

    As a developer and user of a Windows 8 system, keep in mind that your machine
    can only run Windows 8 applications that have been downloaded from the Windows
    Store or custom applications for which a developer license has been installed
    on the machine. Another scenario enables you to host custom applications—when
    those applications have been “sideloaded” onto the machine by your organization,
    which in turn holds an enterprise store account.


    # # Start playing with Windows 8 apps


    With a developer license installed on your Windows 8 machine, you’re ready to
    play with Windows 8 applications. When you are about to create a brand new project,
    you must first choose a project template and a programming language. After you
    do that, Visual Studio provides some help by generating some vanilla code appropriate
    to that template and language that you can customize and extend.


    For the purposes of this book, your programming language of choice is JavaScript.
    It’s worth remembering, though, that you could use other languages, such as C#,
    Visual Basic, and even C++.


    # # The “Hello Windows 8” application'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'Without further ado, launch Visual Studio and discover what it takes to create
    a new project. It couldn’t be simpler, actually; from the start page, you just
    click the New Project link, as shown in Figure 1-9.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_27_0.png)


    # Choosing a project template


    Visual Studio offers a few predefined templates for your new project, but choosing
    the project template only appears to be an easy task. It requires that you have
    a reasonably clear idea of the final result you want to achieve. The template
    you want to use depends on the interaction model you have in mind, the graphics,
    and the content you need to work on. Figure 1-10 shows the New Project window
