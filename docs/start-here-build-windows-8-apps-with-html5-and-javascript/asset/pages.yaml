- img_proc: true
  md: '# Chapter 8. States of a Windows 8 application


    A goal without a plan is just a wish.


    > —Antoine de Saint Exupery


    A couple of decades ago, the idea of pushing out a window-based operating system
    where multiple applications could live side by side was quite revolutionary. Before
    Microsoft Windows (and other similar operating systems) came out, users were used
    to working with a single application at a time. The active application took control
    of the machine and its computing resources, and filled up the entire screen with
    its content.


    More recently, the idea of a single application running in the foreground has
    been revamped by mobile operating systems such as iOS, Windows Phone, and Android.
    After years of Windows and multiple applications running concurrently in separate
    windows, the one-application-at-a-time model was kind of a shock for many users.


    What about Windows 8?


    If you run Windows 8 in desktop mode, it''s always the same Windows with multiple
    and overlapping windows that can be opened at any time. If you run a Windows Store
    application instead, you find out each application usually takes up the full screen
    and you have no way to interact with other applications without switching to them
    and having them, in turn, take the full screen. To be precise, a Windows Store
    application can live in a variety of states—full-screen (both landscape and portrait),
    filled, and snapped. When not running in any full-screen modes, a Windows Store
    application splits the available screen with a second application: one application
    runs snapped and the other runs filled.


    What does that mean to you?'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'You should ideally provide some degree of adaptation to your application so
    that the state is preserved and the user interface adjusts to a smaller space.
    Dealing with filled and snapped views will be the main topic of this chapter.


    # States of a Windows Store application


    Windows Store applications make a point of providing a full-screen and immersive
    experience to users. On one end, design guidelines recommend that you keep the
    user interface fairly simple and focused to avoid filling up the screen with too
    many items. On the other hand, as larger and larger screen resolutions become
    available, you take the risk of occupying a large PC screen with little content.


    Since Windows 8 is an operating system created from the ground up to run on devices
    of different sizes, the whole theme of adapting the user interface (and subsequently
    the user experience) to a different screen is topical.


    Windows 8 defines a few view states for applications and Windows Store applications
    receive proper notifications when the view state changes. What happens next is
    up to the application. Let’s find out more about the predefined view states.


    # Full-screen view states


    An application that runs in full-screen mode takes up the entire screen. Unless
    specified differently during the startup of the application, this is the default
    view state of any Windows Store application. To be precise, Windows 8 defines
    two full-screen modes—one for each orientation of the device.


    # Landscape mode


    The landscape mode indicates that the device is being held horizontally and that
    width is larger than height. The landscape mode can be programmatically detected
    by looking at the value returned by Windows.UI.ViewManagement.ApplicationViewState
    object. The following code snippet shows how to detect the landscape mode:'
  merge: -1
  pgno: 245
- img_proc: true
  md: "```\n// Grab the current view state\nvar currentState = Windows.UI.ViewManagement.ApplicationView.value;\n\
    \n// Verify if the app is running in full-screen landscape mode\nif (currentState\
    \ === Windows.UI.ViewManagement.ApplicationViewState.fullScreenLandscape) {\n\
    \  ..\n}\n```\n\nThe operating system detects rotation of the device and automatically\
    \ flips the user interface and notifies the application of any change.\n\n# Portrait\
    \ mode\n\nThe portrait mode indicates that the available screen height is now\
    \ larger than the width. This resolution suggests that it could be preferable\
    \ for the application to flow content vertically because there's more room to\
    \ fill and the user may find it easier to scroll down than swipe left. The following\
    \ code snippet shows how to detect the portrait mode:\n\n```\n// Grab the current\
    \ view state\nvar currentState = Windows.UI.ViewManagement.ApplicationView.value;\n\
    \n// Verify if the app is running in full-screen portrait mode\nif (currentState\
    \ === Windows.UI.ViewManagement.fullScreenPortrait) {\n  ..\n}\n```\n\nAlso in\
    \ this case, the operating system detects rotation of the device and automatically\
    \ orders the application to repaint its user interface.\n\n> **IMPORTANT**\\As\
    \ it turns out, full-screen rotations may require some adjustments to the overall\
    \ user interface of the application. It is not unusual that some content originally\
    \ designed to extend horizontally needs to be reorganized so that it also looks\
    \ great on a device held in portrait mode. The operating system doesn't handle\
    \ this aspect for you. All the operating system does is let the application know\
    \ about view changes and ordering a repaint."
  merge: -1
