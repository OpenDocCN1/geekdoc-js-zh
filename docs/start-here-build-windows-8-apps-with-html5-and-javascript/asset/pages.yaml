    \ in\nFigure 5-8.\n\n![](img/d62e4a5ec04f518a61f032ca9cb73f7e_166_0.png)\n\n#\
    \ Launching an application\n\nThere are quite a few ways for the user to launch\
    \ the application. The most\ncommon way is that the user launches the application\
    \ from a tile—the\nWindows 8 counterpart of an icon or shortcut. Another possibility\
    \ for the\napplication to be launched is when the user searches for some data\
    \ that the\napplication has exposed or when the user shares data with the application.\n\
    Both tasks are usually accomplished through items in the Charms bar.\nFinally,\
    \ yet another possibility is that the application gets launched because\nthe user\
    \ opened a file associated with the application.\n\nStarting an application always\
    \ causes an *activated* event to be fired by\nWinJS that you can handle through\
    \ the aforementioned *onactivated* event:\n\n```\napp.onactivated = function (args)\
    \ {\n  ...\n}\n```\n\nMost of the time, you need to do some work during the *activated*\
