  md: "and <i>(for italic text)</i> that are logically equivalent to the now unsupported\
    \ <u><a></u> and <big> elements.\n\n# Collecting data\n\nHTML was originally devised\
    \ to be a language for creating hypertext documents. Over the years, the language\
    \ has been enriched with layout capabilities and basic features to collect collect\
    \ data. Writing input forms from users proved to be a nontrivial task. One thing\
    \ is to collect plain text; it is quite another to collect a date, a number, or\
    \ an email address.\n\nFor many years, HTML has only offered input text completely\
    \ unable to distinguish numbers, dates, and email addresses from plain text. Subsequently,\
    \ page developers were responsible for preventing users from typing unwanted characters\
    \ and for client validation of the entered text.\n\nWith HTML5, a lot of this\
    \ has been pushed to the browser side. This means that by using a slightly more\
    \ sophisticated set of elements developers can achieve the same level of form\
    \ validation in a faster and safer way.\n\n# Adjusting input fields\n\nIn HTML5,\
    \ you still create an input form by using the same markup elements used from earlier\
    \ versions of the language. In other words, the following markup will give you\
    \ the opportunity to upload any typed content to the given server.\n\n```\n<form\
    \ action=\"http://www.yourserver.com/upload\">\n  <span> Your name </span>\n \
    \ <input type=\"text\" value=\"\" />\n  <input type=\"submit\" value=\"Save\"\
    \ />\n</form>\n```\n\nThe <input> element is the element that inserts a graphical\
    \ element (such as, an input box or a drop-down list) to collect some input data.\
    \ You also use the <input> element to add a push button to start the submission"
  merge: -1
