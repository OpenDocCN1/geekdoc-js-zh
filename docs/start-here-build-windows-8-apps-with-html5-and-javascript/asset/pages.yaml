    # Suspending an application


    In Windows 8, only one application at a time is active in the foreground. If the
    user switches to a new application, then Windows 8 suspends the currently running
    application and moves it to the background. The suspended application remains
    in memory even though its code doesn''t run. Here''s how you can handle the event:


    ```

    app.checkpoint = function (args) {

    // Save app data in case of termination.

    WinJS.Application.sessionState["location"] = ...;

    }

    ```


    During suspension you want to save any data that can help later to reconfigure
    a state of the application very closely, if not identical, to the state when the
    application was suspended. You use the *sessionState* dictionary to save values.
    The *sessionState* dictionary has a list of named entries—for example, location,
    and takes string values. The name of entries is arbitrary, but usually an indicator
    of the saved data.


    The user can switch back to a suspended application at any time; when this happens
    Windows wakes up the application, which regains the foreground of the current
    application.


    A suspended application is cached in memory for as long as it is possible, but
    it is not guaranteed to stay in memory indefinitely. It may happen that, perhaps
    running short of memory, Windows terminates suspended applications. In this case,
    the user can only restart the application from the tile if she wants back.


    # Resuming an application'
  merge: -1
  pgno: 168
- img_proc: true
  md: "There’s a simple way for a developer to detect whether the application is being\
    \ run from a tile or a charm if it is resumed from a suspended state. The activated\
    \ event is fired and the ActivationKind property is set to launch. In addition,\
    \ if the previousExecutionState is set to terminated, then the application has\
    \ been reactivated from suspension, you might want to retrieve and restore any\
    \ saved state. The saved state is commonly retrieved from the sessionState dictionary\
    \ or wherever it was stored during suspension. The code below shows where you\
    \ insert code during resumption.\n\n```\napp.onactivated = function (args) {\n\
    \  if (args.detail.kind === activation.ActivationKind.launch) {\n    if (args.detail.previousExecutionState\
    \ !===\n      activation.ApplicationExecutionState.terminated) {\n      // Initialize\
    \ your application here.\n      var data = WinJS.UI.Application.sessionState[\"\
    location\"];\n    }\n  } else {\n    // Restore application state here.\n    ...\n\
    \  }\n  args.setPromise(WinJS.UI.processAll(()));\n}\n```\n\nThe sessionState\
    \ dictionary to save data is not mandatory. You can save session data to some\
    \ persistent store or you can find it acceptable that the application restarts\
    \ with a fresh state every time. It is mostly up to you, but saving to session\
    \ state is the most common approach.\n\n# Background tasks\n\nIn Windows 8, as\
    \ well as in other mobile platforms, you can have background tasks to perform\
    \ non-UI related tasks, such as transfer of data.\n\nA background task is a lightweight\
    \ class that is associated with a given application and runs periodically while\
    \ the application is not running. A background task can be linked to a condition\
    \ and will not run until the condition is met."
  merge: -1
  pgno: 169
- img_proc: true
  md: 'A background task is also able to display information on the Lock screen. The
    Lock screen of a Windows 8 application contains a background image and some information
    is rendered over that such as the current time, the network status, battery power.
    In addition, a background task can write some specific text to the lock screen
    just to provide a quick update about its status.


