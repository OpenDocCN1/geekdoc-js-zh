    # Elements removed from older HTML versions


    HTML5 adds some new elements, but also removes a few elements whose presence would
    only increase redundancy once combined with the new capabilities of CSS and new
    elements in HTML5.


    The list of elements no longer supported most notably includes frame and font
    elements. It should be noted, though, that the <iframe> element remains available.


    In addition, a few style elements such as <center>, <u>, and <big> are removed.
    The reason is that this functionality can be achieved easily through CSS. Probably
    due to the much larger use that page authors made over the years, HTML5 still
    supports elements such as <b> (for bold text)'
