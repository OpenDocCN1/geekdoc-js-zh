  md: '# # Chapter 14. Publishing an application


    > > Success is the ability to go from one failure to another with no loss of enthusiasm.

    —Winston Churchill


    For many years, the process of publishing a Microsoft Windows application was
    limited to building a setup program—possibly with the aid of an ad hoc framework.
    The setup program, in the end, looked a lot like a smart script through which
    you copy files in the target folder, arrange databases, configure the system,
    and create a shortcut on the desktop. More importantly, the setup program could
    be distributed directly by the author with no sort of intermediation. The author
    was also responsible for advertising the application.


    Mobile platforms such as iOS and Windows Phone approached the problem of distributing
    applications in a different way. The platform owner—Apple for iOS and Microsoft
    for Windows Phone—makes itself responsible for distributing applications and for
    giving a bit of extra visibility by creating a central store. This approach has
    been taken also for Microsoft Windows 8 native applications that are, in fact,
    known as Windows Store applications.


    In Windows 8, applications that use the native user interface—those applications
    you practised with throughout the book—can only be distributed through the store.
    The main reason for this choice is to ensure that available applications are of
    good quality, work well on the devices, and are devoid of security vulnerabilities
    and bugs. Microsoft ensures an application is good for the store at the end of
    a certification process; as you can guess, this comes at a cost. The cost is a
    30 percent share of the price'
  merge: -1
  pgno: 454
- img_proc: true
  md: 'for paid applications. For free applications, there''s a limitation on the
    number you can upload and a flat rate beyond the threshold.


    In this book, you learned how to build Windows Store applications by taking advantage
    of the several new application programming interfaces (APIs) available. Now it''s
    about time you close the circle and learn what it takes to publish a finished
    application to the store.


    # Getting a developer account


    So, Windows 8 users can only install Windows 8 applications from the Windows Store.
    But who can upload such applications? The answer is that every Windows 8 developer
    must obtain a developer account from Microsoft, which entitles them to publish
    applications. Without a valid developer account, your dazzling application will
    never be installed except on the computer where you developed it.


    > NOTE

    Windows 8 comes with two main areas of functionality. One is the classic Windows
    user interface that allows you to install any application, either manually or
    through a provided setup program—just as in any previous version of Windows. The
    other is based on the modern Windows 8 user interface. To install any of these
    applications, you need to get and install them from the Windows Store.


    # Registering as a developer of free applications


    To register as a Windows 8 developer, from the Microsoft Visual Studio Store menu,
    choose the Open Developer Account item and then follow the on-screen instructions
    (see Figure 14-1).'
  merge: -1
  pgno: 455
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_456_0.png)


    Clicking the Get A Developer License For Windows Store Apps link takes you to
    the Windows 8 Dev Center, where you click the displayed button to register as
    a developer (see Figure 14-2).'
  merge: -1
  pgno: 456
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_457_0.png)


    If you already have a Windows Phone developer account, you can associate that
    to Windows 8 instead of completing a new registration. However, if you want to
    keep distinct accounts for Windows Phone and Windows 8, then you need to provide
    distinct Windows Live IDs. Of course, if you are a new Windows 8 developer, you
    just enter a Live ID and proceed.


    # Account information


    When creating a new developer account, you should be aware of which type of you
    want to create: personal or business (see Figure 14-3).


    Figure 14-2. Click to start the registration process.'
  merge: -1
  pgno: 457
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_458_0.png)


    Note that you can''t switch from one type of account to another. To create a company
    account, you need to provide Microsoft with a lot more documentation about the
    company and its executives. On the other hand, a company account lets you have
    multiple administrators—and even create and publish applications for internal
    company use. However, if you''re just practicing with Windows 8 and want to upload
    one or two applications for which you are the sole developer, an individual account
    is just fine.


    You proceed by entering your personal information, including your full name and
    address. Next, you choose your display name. The **display name** is important,
    because it is the name that Windows 8 will show as the author of the application.
    The display name of any app publisher must be unique; when you suggest a name
    the Windows 8 Dev Center site provides real-time verification as to whether the
    name you have chosen is available or already taken (see Figure 14-44).'
  merge: -1
  pgno: 458
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_459_0.png)


    # Payment details


    Whether you want to create a personal or business account, you must be a registered
    Windows 8 developer. Unfortunately, registration is not free. You must pay pay
    to be a Windows Phone or iOS developer, and you must pay a yearly fee to be a
    Windows 8 developer as well. At the time of this writing, the registration fee
    for individuals is $49.00. For companies, it is $99.00 (or an equivalent amount
    in other currencies).


    After choosing your display name, you will see the contract that''s being signed
    between you and the Windows Store. You''ll also see a summary page detailing what
    you get in return for your money (Figure 14-5). If you decide to proceed, you
    will be asked to enter your credit card information to pay the fee. If you have
    a promotion code, you will enter it at this time.'
  merge: -1
