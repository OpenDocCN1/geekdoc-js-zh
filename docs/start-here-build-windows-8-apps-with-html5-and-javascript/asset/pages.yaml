    # Understanding the application''s lifecycle


    Any application in Windows 8 is characterized by a sequence of events that signal
    start, load and finish of application. Knowing more about these events that collectively
    form the application''s lifecycle is key, it may lead to introducing optimizations
    in the code and producing a better behavior, especially when your Windows 8 application
    runs on devices. A device, in fact, is hardly as powerful as a laptop in terms
    of processing power, battery, and memory.


    # States of a Windows Store application


    As Windows 8 is an operating system also devised to run on mobile devices, it
    can''t ignore a basic rule of mobile operating systems. On mobile devices, the
    user launches an application but never terminates it. Once launched, the application
    is kind of owned by the operating system and its lifetime is managed by the operating
    system.


    All Windows Store applications can be in one of the following four states: running,
    suspended, terminated, or just not running. Transitions between'
