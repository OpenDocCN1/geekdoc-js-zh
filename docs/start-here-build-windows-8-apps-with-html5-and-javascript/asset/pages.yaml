    # The JavaScript global object


    All JavaScript objects inherit from a unique global super object, and subsequently,
    properties and functions of the global object augment all native and custom objects.
    In particular, the global object features the following properties:


    +   * NaN, which returns the value for Not-A-Number.


    +   * Infinity, which returns the value for infinity.


