  md: "```\n<link rel=\"stylesheet\" href=\"screen.css\" media=\"screen\" />\n<link\
    \ rel=\"stylesheet\" href=\"print.css\" media=\"print\" />\n```\n\nIf you do not\
    \ specify the media attribute, it is assumed to have a value of all, meaning that\
    \ the style sheet will be applied in all cases.\n\nIn the current exercise, you\
    \ want to hide the print-template1 and print-template2 sections in screen mode;\
    \ similarly, you want to hide the main section when the page is being printed.\
    \ You can easily achieve this using the media attribute.\n\nTo keep it as simple\
    \ as possible, you'll work with the STYLE element. The STYLE element allows you\
    \ to insert style information inline rather than referencing it from an external\
    \ file.\n\n```\n<style media=\"print\">\n#main {\n  display: none;\n}\n</style>\n\
    <style media=\"screen\">\n#print-template1 {\n  display: none;\n}\n#print-template2\
    \ {\n  display: none;\n}\n</style>\n```\n\nThe result is that the two print templates\
    \ are hidden in screen mode, whereas the main template is hidden in print mode.\n\
    \n# Preparing the document for printing\n\nIn a realistic Windows Store application,\
    \ you may need to have several print templates ready. The media attribute doesn't\
    \ allow you to indicate which print template is turned on so that you can intelligently\
    \ hide portions of the document you don't need to print. This means that you need\
    \ some code that is triggered by the user interface to programmatically hide print\
    \ templates that don't apply to the current context. For example, consider the\
    \ following markup in default.html:"
