  md: '# About the Authors


    Dino Esposito is a well-known web development expert. He speaks at industry events,
    including DevConnections and Microsoft TechEd, contributes to MSDN® Magazine and
    other publications, and has written several popular Microsoft Press books, including
    Microsoft ASP.NET and AJAX: Architecting Web Applications.


    Even though he''s still a teenager (15 years old), Francesco Esposito has accumulated
    significant experience with mobile application development for a variety of platforms,
    including iOS with Objective C and MonoTouch, Android via Java, Windows Phone,
    and even BlackBerry. He wrote most of the code for IBI12--the official app for
    the Rome ATP Masters 1000 tennis tournament. When not writing apps, hanging out
    with friends, or practicing water polo, he likes going to school where his secret
    goal is to achieve the highest marks ever so he can get a scholarship and buy
    his own Surface tablet.'
