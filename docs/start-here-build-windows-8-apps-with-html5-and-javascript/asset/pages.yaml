  md: "In all the examples so far, you have seen colors referred to by names such\
    \ as black, red, or white. CSS allows you to express color in other more powerful\
    \ ways. The HTML and CSS standards define 147 color names, among which you find\
    \ black, blue, fuchsia, gray, green, purple, red, silver, white, and yellow. The\
    \ full list of predefined colors can be found at http://bit.ly/QyKux.\n\nIn general,\
    \ colors are expressed as a triple of integer values (between 0 and 255) for their\
    \ Red, Green and Blue component. You can use any of the following syntaxes to\
    \ indicate a custom color:\n\n```\n.my-classic-button {\n  color: #ff0000;\n}\n\
    .my-fancy-button {\n  color: rgb(255, 0, 0);\n}\n```\n\nIn the former example,\
    \ you use a hexadecimal expression for the RGB values. Hexadecimal values must\
    \ be prefixed by #. The first two characters refer to the Red, the second two\
    \ refer to the Green, and the last two refer to the Blue.\n\nIn the latter example,\
    \ you use the rgb function instead, which accepts decimal values. Also in this\
    \ case, the order of color components is Red, Green, Blue."
