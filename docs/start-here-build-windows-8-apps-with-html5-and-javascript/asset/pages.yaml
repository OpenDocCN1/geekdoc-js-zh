    The clipboard is essentially a user-oriented feature, but it was backed by a programming
    interface in all versions of Windows. Windows Store applications have no access
    to the clipboard, but that doesn''t mean distinct applications can''t communicate
    and exchange data. Instead of the clipboard, a user will just use the Share menu
