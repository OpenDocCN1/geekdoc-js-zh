- img_proc: true
  md: "This text appears in the description of some photos. To make pass the JSON\
    \ validation, you need to double escape the single quote, so the string looks\
    \ like this:\n\nWimbledon it ain\\'t\n\nYou can fix this problem quickly and effectively\
    \ by introducing another extension to the String prototype. Open the helpers.js\
    \ file again and add this code:\n\n```\nString.prototype.doubleEscapeQuotes =\
    \ function () {\n  var theString = this;\n  if (theString != null && theString\
    \ != \"\") {\n    return theString.replace(/\\'/g, \"\\\\'\");\n  } else {\n \
    \   return theString;\n  }\n}\n```\n\nIt is important to note that simply calling\
    \ the replace function doesn't work, because the replace function only replaces\
    \ the first occurrence of the matching string. You need to wrap the string to\
    \ replace it in a regular expression (as shown below) and explicitly add the g\
    \ qualifier to make it work on the entire string.\n\n```\n/string-to-replace/g\n\
    ```\n\nThe code that parses the JSON becomes\n\n```\nFlickApp.parseFeed = function\
    \ (json) {\n  var amendedText = json.doubleEscapeSingleQuotes();\n  var pictures\
    \ = JSON.parse(amendedText);\n\n  for (var i = 0; i < pictures.length; i++) {\n\
    \    var pictureElement = {};\n    pictureElement.photoUrl = pictures.items[i].media.m;\n\
    \n    // Add the object to the listview\n    FlickrFeed.Pictures.push(pictureElement);\n\
    }\n```"
  merge: -1
  pgno: 391
