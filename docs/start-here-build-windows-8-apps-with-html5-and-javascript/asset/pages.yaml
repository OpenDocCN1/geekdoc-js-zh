- img_proc: true
  md: "# NOTE\n\nIn HTML, a block element is an element whose content is rendered\
    \ between two line breaks—one before and after the content. Therefore, the content\
    \ displays as a standalone “block” of content. One popular block element is HI,\
    \ which renders some text as a first-level heading. The DIV element is another\
    \ block element aimed at creating blocks out of any valid HTML content. Block\
    \ elements are opposed to inline elements, namely elements whose content flows\
    \ with the rest of the page with no line breaks applied.\n\n# IMPORTANT\n\nNote\
    \ that in this book, as well as in other books and articles, truly common HTML\
    \ elements, such as <div> and <h1> often appear in text written without the brackets.\
    \ However, the use of the angle brackets is mandatory if you are using these elements\
    \ within HTML itself.\n\nIn HTML5, the multicolumn layout is recognized as a common\
    \ layout and therefore gets full support via several new ad hoc markup elements.\n\
    \n# Preparing the sample application\n\nThe examples you'll be working with this\
    \ chapter are plain HTML pages showcasing some of the features available in HTML5\
    \ as supported in Internet Explorer 10. You won't be creating an ad hoc Windows\
    \ 8 application for each feature, but for this early example—to refresh what you\
    \ saw in Chapter 1—go ahead and create a Windows 8 page that ties together all\
    \ the links to the various standalone HTML5 pages.\n\nOpen up Visual Studio and\
    \ create a blank application. Name it Html-Demos. When done, add the following\
    \ code to the body of default.html so it serves as the main menu for navigating\
    \ into all of the sample HTML5 pages you will write throughout the chapter.\n\n\
    ```\n<body>n  <header>\n    Start Here! Build <body>Windows 8</body> Applications\
    \ with <body>HTML5</body> and\n  <body>JavaScript</body>\n  <hr />\n```"
