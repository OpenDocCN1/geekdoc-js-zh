    You implement this contract by adding a special item to the project from the Add
    New Item dialog of Microsoft Visual Studio. Adding a new share target item will
    bring three new files to your project and change the manifest. You''ll get new
    CSS, HTML, and JavaScript files that provide style, markup, and code respectively
    for a new page. Changes in the manifest Windows 8 that your application intends
    to participate in the Share contract. When the user selects your application to
    receive shared content, the page is displayed and its logic allows you to receive
    and process data. A Share Target application is not expected to display the full-blown
    user interface. It is, instead, expected to display the minimum user interface
    for the execution of a particular task on the received content. An example of
    a Share target application can be found in the Windows SDK.


    # Providing a Settings page


    The Settings panel in the Charms bar is meant to be the place where users always
    look for quick access to the settings that an application may have. A Windows
    Store application application can provide a collection of additional pages to
    be listed in the Settings panel for the user to change options that affect the
    behavior of the application, as well as get to the Help or About pages. In this
    exercise, you''ll create a Settings page for the TodoList application.


    # Populating the Settings charm


    When the user clicks the Settings panel in the Charms bar, the application receives
    an onset event. Therefore, providing a handler for this event is the very first
    step to accomplish.


    # Creating the settings flyout


    The Settings panel is essentially a flyout component that gets configured with
    a list of application commands. An application command is a HTML page and a title
    string. You open default.html and add the following code before the call to app.start.'
