  md: "It is interesting to notice that you can have multiple header and footer elements\
    \ in a HTML5 page. The most common use is to give the page header and footer.\
    \ However, you should consider these elements as blocks meant to represent heading\
    \ content of a page or a section of a page and footers.\n\n# Section and article\
    \ elements\n\nHTML5 defines two similar-looking elements to represent the content\
    \ of a page. The <section> element is slightly more generic, as it is meant to\
    \ delimit a logical section of a HTML page. A logical section can be the content\
