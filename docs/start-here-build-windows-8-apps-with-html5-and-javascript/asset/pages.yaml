    tile and make it receive and display application information.


    In the first exercise, you configured a sample application feeding a small tile
    with canned data. Next, you extended the TodoList application from Chapter 10
    and added small and large Live tiles to display the details of the latest task.
    The user has a lot of control over tiles: at any time the user can switch between
    small and large tiles and even turn off live notifications entirely.


    With this chapter, you completed the tour of Windows 8 programming and you are
    now ready for publishing an application to the Windows Store.'
