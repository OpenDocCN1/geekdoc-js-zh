  md: "placing a direct call to The Bing service, you can get a JSON string containing\
    \ all the details.\n\nAdd a new function to the latLongApp.js file. This function\
    \ places a remote call to the Bing service, passing coordinates and getting back\
    \ detailed civic information. The URL to call has the following format:\n\n```\n\
    http://dev.virtualearth.net/REST/v1/Locations/Lat,long?o=json&key=...\n```\n\n\
    To invoke the URL, use the WinJS.xhr object you discovered in Chapter 11. Here's\
    \ the code that converts coordinates to an address:\n\n```\nlatLongApp.convertAddress\
    \ = function (location) {\n  var url = \"http://dev.virtualearth.net/REST/v1/Locations/\"\
    \ +\n    location.latitude +\n    \"\" +\n    location.longitude +\n    \"?=json&key=\"\
    \ +\n    latLongApp.BingKey;\n\n  // Invoke the Bing service\nWinJS.xhr({ url:\
    \ url }).then(function (response) {\n  var data = JSON.parse(response.responseText);\n\
    \  var address = data.resourceSets[0].resources[0].name;\n\n  // Prepare an info-box\
    \ to add to the map\n  var infoboxOptions = { zIndex: 3, title: address };\n \
    \ var defaultInfobox = new Microsoft.Maps.Infobox(location, infoboxOptions);\n\
    \  latLongApp.map.entities.push(defaultInfobox);\n});\n```\n\nThe Bing service\
    \ returns a complex JSON string that, after it's parsed to a JavaScript object,\
