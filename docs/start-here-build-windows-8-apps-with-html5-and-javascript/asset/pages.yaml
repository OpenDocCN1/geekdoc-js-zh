    \ JavaScript. In this regard, it might be surprising for any developer with a\
    \ bit of web development experience to arrange a web form using the HTML form\
    \ element and submit buttons. In Windows 8, you just don't need any form since\
    \ there's no server-side component to receive the post of the form's content.\
    \ On any form intended to collect input data, all you need to have one or more\
    \ buttons to trigger actions. You can render these buttons using the plain button\
    \ element.\n\nIn Windows 8, you can add a tooltip to any HTML element by simply\
    \ adding a data-win-control attribute set to WinJS.UI.Tooltip. You also use the\
    \ data-options attribute to initialize the new control. In this case, you pass\
    \ the innerHTML property the markup text to be displayed when the user hovers\
    \ over the button.\n\nButtons aren't useful unless they have an associated click\
    \ event. It is a good programming practice to associate event handlers to HTML\
