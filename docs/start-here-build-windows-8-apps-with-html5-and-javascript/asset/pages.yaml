  md: 'In the rest of this chapter, you''ll explore various ways to add CSS styling
    to HTML pages.


    # Inline styling


    CSS works by adding style information to individual HTML elements. Up until a
    few years ago, it was fairly common among HTML authors to add style information
    locally, within the definition of the HTML element. This technique, known as inline
    styling, consists of adding a new style attribute to each HTML element you are
    interested in configuring. Here’s an example:


    ```

    <div style=" ... "

    <!-- some markup goes here -->

    </div>

    ```


    The content of the style attribute is a semicolon (;) separated string. Each token
    within string consists of two parts: a property name and a value separated by
    a colon (:). Here’s a sample style string that defines the background and foreground
    color of any content inside the styled DIV element:


    ```

    <div style="background-color:#000000;color:#ffffff">

    <!--- some markup goes here -->

    </div>

    ```


    The net effect of the preceding code snippet is that the content of the DIV element
    is given a black background (color #000000), whereas any text it contains is written
    in white (color #ffffff). That style information is scoped to the specified DIV
    element and doesn''t apply to any content outside of it.


    This technique has both pros and cons, but the cons likely outweigh any pros.
    Inline styling works just; it’s easy to understand and quickly to apply for everybody—experts
    and novices. But it has critical drawbacks. In particular, the markup of pages
    gets fat and soon becomes harder to read and understand. In addition, there’s
    the potential for a lot of repetitive style details across the same page and multiple
    pages. You should avoid inline'
  merge: -1
  pgno: 74
- img_proc: true
  md: "styling as a bad programming practice or, at the very least, you should limit\
    \ its use to a small number of places where you want to make exceptions to more\
    \ general style rules created in CSS.\n\n# Embedded styles\n\nAnother option is\
    \ grouping style definitions in a few places within the HTML file. You can use\
    \ a STYLE element, in fact, as the repository of custom styles. Within a STYLE\
    \ element, you first identify the target element and then define attributes that\
    \ affect its appearance. The STYLE element is usually located under the HEAD element\
    \ at the top of the HTML page. You can have multiple STYLE elements in any HTML\
    \ page. Here's an example:\n\n```\n<html>\n<head>\n  <style>\n  body {\n    background-color:\
    \ black;\n    color: white;\n  }\n  </style>\n</head>\n..\n</html>\n```\n\nAs\
    \ you may recognize, the content inside curly brackets describe the style to apply.\
    \ The expression you find just before the opening bracket—body—indicates the element\
    \ (or elements) the style will apply to.\n\nYou'll see more detail about this\
    \ point in a few moments; for now, it's sufficient to say that the expression\
    \ that identifies the target of the style is referred to as the selector and can\
    \ be the name of a user-defined CSS class, the ID of a particular element, or\
    \ the tag name of an HTML element. In the previous example, body is the name of\
    \ the main HTML element; so background and foreground colors set through the style\
    \ shown will affect the entire body of the page."
