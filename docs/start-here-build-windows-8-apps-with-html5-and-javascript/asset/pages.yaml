- img_proc: true
  md: "When you use the writeTextAsync method, Windows 8 just opens the file, writes\
    \ any content, and then closes it. If you call writeTextAsync twice, then the\
    \ content is overwritten; the second call completely wipes out the existing content.\n\
    \nIf you want to just append text to an existing file, you have to use the appendTextAsync\
    \ method. The method has the same syntax as the writeTextAsync method. In the\
    \ previous code snippet, you see an example of the two methods used sequentially.\n\
    \nBecause of the asynchronous API, however, you might want to keep sequential\
    \ tasks to a minimum to prevent your code from reaching an unmanageable level\
    \ of nesting. As far as file writing is concerned, you might always want to focus\
    \ on writing any content to files in a single step.\n\n# NOTE\n\n> If you explore\
    \ the list of methods out of the Windows 8 file object, you will find methods\
    \ to rename, copy, delete, and move files. You won't find methods to read or write\
    \ any content to a file exposed on the file object itself. For reading and writing\
    \ files, you must always use methods on the Windows.Storage.File object.\n\n#\
    \ Deleting files\n\nAnother common operation that an application may perform is\
    \ deleting files it had previously created or, more in general, any files that,\
    \ for some reason, it needs to delete. As noted a moment ago, file deletion is\
    \ an operation that requires a file object to be performed. Here's an example\
    \ where you assume to have the file object available:\n\n```\nfile.deleteAsync()\n\
    .done(function () { Todo.alert(\"File deleted\" },\n  function () { Todo.alert(\"\
    Unable to delete the file\") }););\n```\n\n# Choosing a serialization format\n\
    \nNow that you have grabbed the basics of file manipulation in Windows 8, let's\
    \ return to the TodoList application. You integrated file saving in the"
  merge: -1
  pgno: 327
- img_proc: true
  md: "code, but you didn't actually save any task yet. The code discussed earlier,\
    \ in fact, created a file with a given name that was limited to store sample text\
    \ in it. The next step is therefore choosing a format to store real data to a\
    \ file. The process of streamlining real data to a file is commonly referred to\
    \ as serialization.\n\n# Adding a data serialization component\n\nSome changes\
    \ are required to the TodoList.invokeSavePicker method to make it save the current\
    \ Task object. First, you change the line that calls into writeTextAsync instead\
    \ of writing down a constant sample text, it now writes the string returned by\
    \ a new wrapper:\n\n```\nWindows.Storage.FileIO\nwriteTextAsync(file, TodoList.serializeTask(task))\n\
    ```\n\nIn addition, you write the skeleton of the TodoList.serializeTask function\
    \ and add it to todolist.js:\n\n```\n// Task Serializer\nTodoList.serializeTask\
    \ = function (task) {\n  // Just save the description of the task\n  return task.description;\n\
    }\n```\n\nIn this way, the file saves only the description of the task but loses\
    \ all other information. How would you save the entire data set of a Task object?\n\
    A quick answer to the question simply says that the serialization format is entirely\
    \ up to you. You should just be aware that the TodoList.serializeTask function\
    \ will return a string that is saved as to the file. From the perspective of the\
    \ function, whatever string works well.\n\nThe Task object is made of several\
    \ pieces of information: description, due date, priority, and option you might\
    \ want to save them all. One option could be concatenating each piece of information\
    \ using a particular character (such as, the pipe character | ) as the separator.\
    \ Here’s an example:"
  merge: -1
  pgno: 328
- img_proc: true
  md: "```\nTodoList.serializeTask = function (task) {\n  return task.description\
    \ + \"|\" +\n  task.dueDate + \"|\" +\n  task.priority + \"|\" +\n  task.status\
    \ + \"|\" +\n  task.percCompleted;\n}\n```\n\nThe resulting string may look like\
    \ the one shown below:\n\n```\nThis is my new task|Dec 1 12:00:00 UTC+0100 2012|3|Not\
    \ Started|0\n```\n\nThere's nothing wrong with this format, except that it requires\
    \ an ad hoc piece of code to be read and parsed back to a Task object. The process\
    \ of transforming a string of text to an object is referred to as deserialization.\n\
    \nGenerally, the problem here is by choosing a custom serialization format you\
    \ make yourself responsible for writing both the serializer and the deserializer.\
    \ In addition, every format requires a ad hoc pair of serializer and deserializer.\
    \ In JavaScript, a better option exists; it entails a special notation known as\
    \ the JSON format. The acronym JSON stands for JavaScript Object Notation.\n\n\
    # The JSON format\n\nJSON is a text easy to handle and read for both humans and\
    \ software. Basically, JSON defines a set of conventions through which any object\
    \ can have its data serialized to a standard format. A JSON string is made of\
    \ a collection of name/value pairs each which identifies a property name and its\
    \ value. A special convention also exists for rendering arrays. The following\
    \ text shows the JSON version of a Task object filled with default values:\n\n\
    ```\n{\n  \"description\":\"This is my new task\",n  \"dueDate\":\"2012-12-01T11:00:00.000Z\"\
    ,n  \"priority\":\"3\",n  \"status\":\"Not Started\"\n}\n```"
  merge: -1
  pgno: 329
- img_proc: true
  md: "\"percCompleted\":\"0\"\n}\n\nThe great news is that JavaScript and Windows\
    \ 8 provide native tools to create a JSON string from a JavaScript object and\
    \ obtain a JavaScript object from a JSON string. In addition, the generality of\
    \ the JSON format makes it suitable to treat just any object. This means that\
    \ you need only one pair of serializer and deserializer in your code, regardless\
    \ of the number of objects you intend to persist and also regardless of their\
    \ structure.\n\n# Serializing the Task object to JSON\n\nTo use JSON in the TodoList\
    \ application, all you need to do is use the following code for the TodoList.serializeTask\
    \ function:\n\n```\nTodoList.serializeTask = function (task) {\n  return JSON.stringify(task);\n\
    }\n```\n\nJSON.stringify is a JavaScript native function that turns any JavaScript\
    \ object into a JSON compatible string. Figure 10-4 shows the JSON content of\
    \ a Task object being read with a plain text editor, such as Notepad.\n\n![](img/d62e4a5ec04f518a61f032ca9cb73f7e_330_0.png)\n\
    \nThe next challenge is now making TodoList capable of loading and editing existing\
    \ JSON-formatted tasks."
