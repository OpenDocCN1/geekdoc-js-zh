  md: '# Chapter 1. Using Visual Studio 2012 Express edition for Windows 8


    > Differences of habit and language are nothing at all if our aims are identical.

    —J. K. Rowling, Harry Potter and the Goblet of Fire


    Microsoft Windows 8 marks the debut of a significantly revised runtime platform—the
    Windows RunTime (WinRT) platform. Like the .NET platform, WinRT supports several
    programming languages. You will find a pleasant surprise side by side with the
    popular .NET languages (such as, C#, Visual Basic, C++, F#)—the JavaScript language.


    # NOTE


    You may not even recall that a decade ago, when Microsoft first shipped the .NET
    Framework, developers were also given a chance to write applications using an
    adapted version of JavaScript called JScript. It was not exactly a success; today
    you won''t even find JavaScript .NET supported in Visual Studio—the development
    environment for .NET code. Ten years ago, JavaScript was probably close to the
    bottom of its popularity. JScript was a dialect of the standard JavaScript, and
    using JScript didn''t mean you could use HTML and CSS to shape up the user interface
    of the resulting application. This is different in Windows 8.


    Building Windows 8 applications with JavaScript means that you define the layout
    of the user interface with HTML and add style and graphics using CSS. As for the
    application''s logic, use the standard JavaScript language enriched by any JavaScript
    libraries you wish (such as the'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'common jQuery library), while you access WinRT system classes using an ad hoc
    Microsoft-created JavaScript wrapper—the WinJs library.


    If you already know a bit of JavaScript development, building Windows 8 applications
    will not be a huge, new type of adventure. If you are not already a JavaScript
    developer, the JavaScript route probably represents the shortest path for learning
    to build Windows 8 applications.


    This chapter sets up the preliminary aspects of such a learning path and discusses
    what you will need to install—specifically Windows 8 and Microsoft Visual Studio—and
    how to configure the environment. In the next chapters you''ll first see a summary
    of HTML (in particular, the latest version of HTML, known as HTML5), CSS, and
    JavaScript, and then attack the task of building Windows 8 applications with topics
    more specifically related to Windows 8 programming.


    > IMPORTANT

    If you are already familiar with HTML5, CSS, and JavaScript, you might want to
    start directly with Chapter 5. If not, at the very minimum I recommend you look
    carefully at Chapter 2, Chapter 3, and Chapter 4. Better yet, I suggest you look
    into specific books for HTML5 and JavaScript, as the chapters you find here represent
    about 10 percent of the content you would find in a dedicated book. You might
    want to explore other books in this Microsoft Press series that address these
    topics directly: Start Here! Learn HTML5 by Faire Wenpen (Microsoft Press, 2012)
    and Start Here! Learn JavaScript by Steve Steuring (Microsoft Press, 2012).


    # Getting ready for development


    So you want to start building applications for Windows 8 using HTML, CSS, and
    JavaScript. First, you need to make sure that some software is properly installed
    on your development machine. The following section discusses the details.


    # The software you need'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'As obvious as it may sound, you need to have Windows 8 installed to develop,
    test, and run Windows 8 applications. The easiest way to develop and test applications
    for Windows 8 is by using the current version of Visual Studio—Visual Studio 2012.


    There are various editions of both Windows 8 and Visual Studio 2012, for the purposes
    of this book, you’ll need at least the minimal versions of each product: Windows
    8 Basic edition and the free Visual Studio 2012 Express edition for Windows 8
    applications.


    # Installing Windows 8


    Having a machine equipped with Windows 8 is a fundamental prerequisite to working
    through the information and exercises in this book. Windows 8 comes in a few flavors,
    as detailed in Table 1-1.


    Table 1-1. Windows 8 editions


    | Version | Description |

    | --- | --- |

    | Windows 8 | The Basic edition of Windows 8 is available for both the x86 and
    x86-64 architecture. It provides a new Start screen and redesigned user interface,
    live tiles, Internet Explorer 10, and |

    | Windows 8 Pro | This edition offers additional features as booting from VHD
    and support for virtualization via Hyper-V. |

    | Windows 8 Enterprise | This edition adds IT-related capabilities such AppLocker
    and Windows-ToGo (booting and running from a USB drive). This version also supports
    installation of internally developed applications from locations other than the
    Windows Store. |

    | Windows 8 RT | Only available pre-installed on ARM-based tablets, it also natively
    includes touch-optimized versions of main Office 2013 applications. |


    If you don’t have your copy of Windows 8 already, you can get a free 90-day trial
    from the following location: http://msdn.microsoft.com/en-us/evalcenter/jj554510.aspx.
    Note that this link gets you a non-upgradeable copy of Windows 8 Enterprise. Before
    you embark on the download, consider that because it is a few gigabytes in size,
    it may not be quick!'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Installing Visual Studio Express


    Once you have Windows 8 installed, you can proceed to download Visual Studio 2012
    Express edition. (Note that in the rest of the chapter—and the entire book—we
    will be using the term Visual Studio or Visual Studio 2012 just to mean the Visual
    Studio 2012 Express edition.) As shown in Table 1-2, Visual Studio is available
    in different flavors.


    Table 1-2. Visual Studio 2012 editions


    | Version | Description |

    | --- | --- |

    | Ultimate | The feature-complete version of Visual Studio 2012, offering the
    top-quality support for every feature. |

    | Premium | Lacks some extensions in the area of modeling, debugging, and testing.
    |

    | Professional | Lacks even more functionalities in the area of modeling, debugging,
    and testing but still offers a great environment to write and test code. |

    | Express | Free but basic version of Visual Studio 2012 optimized for specific
    development scenarios. In particular, it is available for building web applications
    or Windows 8 applications.


    You can read more about and compare Visual Studio features at the following page:
    http://www.microsoft.com/visualstudio/11/en-us/products/compare.


    To start downloading Visual Studio Express for Windows 8, go to the Dev Center
    for Windows 8 applications at http://msdn.microsoft.com/en-us/windows/apps (see
    Figure 1-1).'
  merge: -1
  pgno: 16
