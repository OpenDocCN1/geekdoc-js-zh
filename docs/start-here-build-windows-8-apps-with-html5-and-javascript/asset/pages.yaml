  md: "# NOTE\n\nBrowsers also allow you to add a level of transparency to colors.\
    \ This is achieved by adding a fourth value to the color definition—the alpha\
    \ channel. In the hexadecimal format, the alpha value ranges from 0 to 255 (completely\
    \ opaque). In the RGB format, the alpha value can be expressed as a decimal value\
    \ (that is, 0.5) or as a percentage (that is, 50%). If you intend to add transparency\
    \ to colors, you may use the rgba function:\n\n```\n.my-classic-button-transparent\
    \ {\n  color: #88ff000; /* transparency is first value,\n  88 in this\n}\n.my-fancy-button-transparent\
    \ {\n  color: rgba(255, 0, 0, 0.5); /* transparency is fourth value,\n  0.5 in\
    \ this\n}\n```\n\nIn general, you should be aware that older browsers may not\
    \ support transparent colors. However, as a reader of this book, the presumption\
    \ is that you're most interested in Windows 8 programming, and in the context\
    \ of Windows 8, transparent colors are fully supported.\n\n# Changing the foreground\
    \ color\n\nThe color of any piece of text around an HTML page is controlled by\
    \ the color property. By setting the color property on the BODY element, you give\
    \ all the text within the page a default color of your choice.\n\n```\nbody {\n\
    \  color: black;\n}\n```\n\nYou are not limited to just one color per page; you\
