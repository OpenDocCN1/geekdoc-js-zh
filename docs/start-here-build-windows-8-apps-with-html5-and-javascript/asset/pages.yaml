  md: "```\n.red-button {\n  color: red;\n}\n```\n\n# Changing the background color\n\
    \nThe background color of an HTML element plays an important role in HTML design,\
    \ since it can be used to achieve compelling effects. Each element can have its\
    \ background painted with a solid color or a gradient of colors. It can also have\
    \ the background textured with a bitmap. Let's start with the simplest scenario:\
    \ using a solid color. Here's what you need:\n\n```\n.blue-button {\n  color:\
    \ #ffffff; /* white * */\n  background-color: #0000ff; /* blue * */\n}\n```\n\n\
    The background-color property accepts a color expression.\n\n# Using gradients\n\
    \nTo give an HTML element a gradient background, you set the background property\
    \ with an expression that describes the type of gradient you want. Here's how\
    \ to create a linear vertical gradient that begins with blue, ends with red, and\
    \ has white in the middle.\n\n```\n.blue-button {\n  color: #ffffff; /* white\
    \ * */\n  background-color: linear-gradient(to bottom, blue, white 80%, red);\n\
    }\n```\n\nIn particular, the white appears towards the end of the gradient (80%)\
    \ and the red takes the remaining 20% of the background. The keyword bottom indicates\
    \ the direction of the gradient. Similarly, you can create a radial gradient by\
    \ just using the radial-gradient function.\n\n# Using a background bitmap\n\n\
    There are several more properties to learn about if you intend to use a bitmap\
    \ as the background of the element. Consider the following example:"
  merge: -1
