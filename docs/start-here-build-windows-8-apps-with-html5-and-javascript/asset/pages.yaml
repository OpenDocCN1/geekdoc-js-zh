  md: 'JavaScript file you happen to use.


    ```

    var Globals = (function() { return this; }());

    ```


    Suppose you have a global variable that represents the name of the application;
    for example, this variable is named AppName. The purpose of the previous suggestion
    was that you can use the variable as shown below:


    ```

    Globals.AppName = "MyApp";

    ```


    It should be noted that AppName and Globals.AppName would point to the same location,
    and both can be used in the application with the same meaning. Of, if you consistently
    use the version with the Globals prefix, you make your global variables stand
    out in code.


    This approach is not free of issues. In particular, it still creates many entries
    in the global namespace as there are variables associated with Globals. Here''s
    a slightly better approach: first, you place the code at the top of each and every
    JavaScript file you define.


    ```

    Globals = Globals || {};

    ```


    Next up, you define your global members as members of the newly created Globals
    object. The difference is that now Globals is a brand new global object, and all
    the members you want to use as global in your application are actually defined
    as children of Globals and are not polluting the JavaScript namespace. Put another
    way, your application''s global variables are grouped under a single global object
    that is visible to the JavaScript interpreter.


    # Keep application state at hand


    All applications need to maintain their own state, that way the state can be persisted
    to disk when the application is closed or, when used on a mobile device, the application
    is sent to the background.'
