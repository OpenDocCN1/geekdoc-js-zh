  md: '# # Chapter 3. Making sense of CSS


    > In matters of style, swim with the current; in matters of principle, stand like
    a rock.

    —Thomas Jefferson


    As you learned in Chapter 2, an HTML page is made up of a bunch of elements that
    together define the content and layout of what the browser will actually display.
    Each element of the HTML markup language has its own semantics and syntax. So
    an INPUT element, for example, indicates an input field, and additional attributes
    specify shape and behavior of the input field. The display of these elements is
    usually determined by the specific browser.


    So far, nothing has been said about how to give these elements a custom appearance.
    Nonetheless, changing font, colors, margins, and sizes of HTML elements is definitely
    possible—and to a large extent, even desirable. An acronym for Cascading Style
    Sheet, CSS is the name of the language used to format the content of HTML pages.


    An HTML page results from the combination of three elements: content, style, and
    behavior. Content is expressed via the HTML markup language, as discussed in Chapter
    2. Style is managed by CSS, as you''ll see in this chapter. Finally, behavior
    is handled by JavaScript, which you''ll learn about in the next chapter.


    # ## Styling a webpage


    HTML arrived well before CSS in the early 1990s. In the beginning, developers
    used to tweak the appearance of the page by simply adding hoc attributes to markup
    elements. While initially effective, this approach'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'soon became unmanageable and a significant source of confusion for developers
    and users.


    To acquire larger and larger market shares, vendors began adding new proprietary
    style attributes with each new release of their browsers. As a side—but not secondary—effect,
    HTML documents became significantly larger in size and subsequently to download
    issues. There was more work for the servers but also more work for client browsers
    and slower responses for users.


    In addition, browsers were often challenged to interpret unknown attributes and
    tags. It was not an easy choice for architects to decide whether the appropriate
    reaction to malformed markup was to throw an error to the user or to silently
    skip over unknown elements. Most browsers opted for the second option. Although
    that improved the user experience, it made life for developers significantly harder
    and, in hindsight, it might not be overreaching to say that the explosion of client-side
    web developing by a few years.


    To find a consistent way to separate content from presentation, back in the mid-1990s
    the World Web Consortium (W3C) created a committee to give shape to a standard
    language for styling the content of webpages. That was the beginning of CSS. The
    very first recommendation came out in 1996. Over the ensuing years, new levels
    of specifications have appeared regularly, with growing adoption from browser
    vendors and increasing levels of use by developers. Today, the CSS3 standard is
    complete and broadly adopted by browsers. A CSS4 standard is in the works.


    For the purposes of this book, CSS3 will refer to CSS.


    # Adding CSS information to pages


    So CSS is a language that complements HTML and gives page authors the great opportunity
    to define content and content in one file and define layout and appearance in
    another file. Thanks to such a neat separation of concerns, different teams of
    people—typically web developers and graphical designers—can work in parallel on
    the same project.'
