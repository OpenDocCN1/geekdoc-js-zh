- img_proc: true
  md: '# Chapter 2. Making sense of HTML5


    > Broadly speaking, the short words are the best, and the old words best of all.

    —Winston Churchill


    HTML5 is the latest version of the HTML language—the popular text-based language
    used to define the content of webpages. HTML appeared on the scene in the early
    1990s. In the beginning it was merely a markup language at describing simple documents.
    A markup language is based on a set of markers that wrap text and give it a special
    meaning.


    Initially, the set of HTML markup elements, called “tags” or (better) “elements,”
    was fairly limited. It contained de references to other documents and headings,
    to link to images and paragraphs, and apply basic text styling such as bold or
    italic. Over the years, however, the role of HTML grew beyond imagination, progressing
    from being a simple language that described documents to a language used to define
    the user interface of web applications. That trend continues today with HTML5.


    The latest version of HTML removes some of the older elements and makes it easier
    to keep elements that provide style information in one place, and elements that
    provide text and define the layout of the text, in another place. As you''ll see
    in more detail in the next chapter, style information can be defined through a
    special distinct file known as a Cascading Style Sheet (CSS). In addition, HTML5
    adds some new elements suitable for including multimedia content and drawing,
    and several new frameworks for manipulating the content of the page programmatically.


    With HTML5 alone, you still won''t be able to go too far toward building a complete
    application. However, the union of HTML5, CSS, and JavaScript'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'functions as a close approximation to a full programming language.


    +   * You use HTML5 to define the layout of the user interface and to insert text
    and multimedia.


    +   * You use CSS to add colors, style, and shiny finishes.


    +   * Finally, you use JavaScript to add behavior by gluing together pieces of
    native frameworks such as Document Object Model (DOM), local storage, geolocation
    and, for example, all the specific services of Windows 8 exposed via the Windows
    8 JavaScript library (WinJs). The DOM, in particular, is the collection of programmable
    objects that expose the structure of the current document to coders.


    In the rest of this chapter, you will briefly explore the basics of the HTML5
    markup elements, including input forms and multimedia. Neither this chapter nor
    the rest of the book covers every aspect of the basics of HTML. If you need a
    refresher on the fundamentals of HTML, you can refer to the book *Start Here!
    Learn HTML5*, by Faithe Wenpen (Microsoft Press, 2012).


    # IMPORTANT


    This chapter and the next two provide an overview of HTML, CSS, and JavaScript.
    In these chapters, you will get acquainted with new key elements of HTML5 and
    CSS3 and receive an end-to-end coverage of common programming techniques you use
    in JavaScript. The content of these chapters is not specific to Windows 8 apps;
    it is instead meant to be preliminary to upcoming chapters where you''ll be using
    hoc elements from the WinJs library in a basic HTML skeleton, using custom CSS
    for graphics and custom JavaScript for behavior.


    # Elements of a webpage


    HTML5 comes about a decade after its most recent predecessor (HTML4). Looking
    at what''s new in HTML5, one could reasonably say that all these years have not
    passed in vain. HTML5 provides a set of new elements that'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'offer several native functionalities that developers and designers used to

    have to code via artifacts and ingenious combinations of existing elements.

    Here’s a quick look at what’s relevant to creating a webpage with HTML5.


    # Building the page layout with HTML5


    In the beginning of the web, most pages were designed as a text documents—meaning
    their content developed vertically on a single logical column. Over the years,
    page layout became more and more sophisticated. Today, two-column and three-column
    layouts are much more common. In two- and three-column layouts, you also often
    find headers and footers surrounding the logical columns. Figure 2-1 shows the
    difference between the layouts at a glance.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_44_0.png)


    Developers have been smart enough to build such complex layouts using basic HTML
    block elements such as DIV.'
  merge: -1
