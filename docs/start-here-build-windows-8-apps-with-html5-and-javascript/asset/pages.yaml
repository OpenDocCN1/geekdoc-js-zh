- img_proc: true
  md: '# Start Here! Build Windows 8 Applications with HTML5 and JavaScript


    # My Pet Gallery


    Just hairier than a cat


    Zoom level: 2.6


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_230_0.png)


    Dino Esposito | Francesco Esposito


    Figure 7-11. Zooming the image in and out.


    # Building a video clip gallery


    After having built an image gallery, let''s go ahead and try to build a video
    gallery while using a different control to organize navigation. To be precise,
    in this new exercise there will be navigation but it will be embedded in a new
    component—the SemanticZoom component. The application will group clips by category
    and show the available clips once the user has made a selection. Finally, clicking
    the clip will play the video.'
  merge: -1
  pgno: 230
- img_proc: true
  md: "# NOTE\n\nThe SemanticZoom component only provides a fixed form of navigation\
    \ through some content in a master/detail way. The application programming interface\
    \ (API) for navigation you discovered in the previous exercise is, instead, a\
    \ more powerful and general-purpose API for navigating between any number of pages\
    \ and at any number of nesting levels.\n\n# Introducing the SemanticZoom component\n\
    \nAs you rely on the built-in capabilities of a specific component to switch between\
    \ master and detail view, there's no need to start from a Navigation App template.\
    \ Let's create a new Blank App project and name Video. As usual, you might want\
    \ to add header.html and footer.html and make edits to default.css, so that the\
    \ look and feel of the application is the same as other examples. In particular,\
    \ you might want to import into default.css the styles for HEADER, FOOTER, and\
    \ BODY elements that you used for all past examples.\n\n# IMPORTANT\n\nUnless\
    \ otherwise noted, header.html, footer.html, and making related changes to default.css\
    \ will be considered a required preliminary step for any of the upcoming exercises.\
    \ Note also that you probably won't experience any major inconvenience if you\
    \ miss it—at worst, you'll run into graphical inconsistencies!\n\nAnother aspect\
    \ of nearly all Windows Applications that will be taken for granted in the rest\
    \ of the exercises is the way in which startup code is injected into the application.\
    \ So you added a then function call to the activation event handler in default.js.\
    \ A neater, but functionally equivalent, of doing the same thing is the following:\n\
    \n```\napp.onready = function (args) {\n  VideosApp.init();\n};\n```\n\nYou place\
    \ this code in the onready function that the default.js file is usually made of.\
    \ From within, you simply call the init function on the application specific object\
    \ you create for the exercise. A standard pattern of all exercises in the book\
    \ is having most script gathered in a single JavaScript file with an init function\
    \ to do all the initialization work."
  merge: -1
  pgno: 231
- img_proc: true
  md: "# What's semantic zoom, anyway?\n\nIn spite of the name, semantic zoom has\
    \ very little to do with zooming—at least according to the common meaning of the\
    \ term used so far. What the component does switch between two different views\
    \ of the same content. One view is the master view; the other is the detail view.\
    \ The detail view is considered the zoomed-in view, namely the most detailed view\
    \ of the content area. Conversely, the master view is referred to as the zoomed-out\
    \ view, namely the one where elements are grouped in classes for the ease of selection.\n\
    \n# Preparing the ground for semantic zoom\n\nYou prepare a page for semantic\
    \ zoom by adding three DIV elements. The following is the code you need to enter\
    \ in the BODY element of the default.html page.\n\n```\n<div id=\"semantic-zoom-container\"\
    \n  data-win-control=\"WinJS.UI.SemanticZoom\">\n  <!-- The zoomed-in view -->\n\
    \  <div id=\"listview-in\">\n    data-win-control=\"WinJS.UI.ListView\"></div>\n\
    \n  <!-- The zoomed-out view -->\n  <div id=\"listview-out\">\n    data-win-control=\"\
    WinJS.UI.ListView\"></div>\n</div>\n```\n\nThe parent DIV is mapped to an instance\
    \ of the WinJS.UI.SemanticZoom component. The two child DIVs are mapped to instances\
    \ of the WinJS.UI.ListView components. The great news is that your only concern\
    \ is giving list views a template and content; switching between views and the\
    \ user interface for data is gently offered by the SemanticZoom component.\n\n\
    # Defining ad hoc data for semantic zoom\n\nAs usual, you add a new JavaScript\
    \ file to the project to contain most of the logic for the application. In this\
    \ case, you can name the file videos.js. Next, open the file and add the following\
    \ code:"
  merge: -1
  pgno: 232
- img_proc: true
  md: "```\nvar VideosApp = VideosApp || {};\n\nvar Clip = WinJS.Class.define(function(category,\
    \ title, id) {\n  var that = {};\n  that.title = title;\n  that.category = category;\n\
    \  that.videoId = id;\n  that.videoUrl = \"http://www.youtube.com/embed/\" + id\
    \ + \"?html5=1\";\n  that.posterUrl = \"http://ing.youtube.com/vi/\" + id + \"\
    /1.jpg\";\n  return that;\n});\n```\n\nThe Clip object represents the information\
    \ you'll be working with in the exercise. It represents a YouTube video and has\
    \ a category and a title. The videoId property represents the unique YouTube identifier\
    \ of the clip. The videoUrl property returns the URL required to view the clip\
    \ from within a Windows Store application; the posterUrl property returns the\
    \ poster image for the video from YouTube.\n\nThe next step consists of creating\
    \ a binding collection of data. This step is not really different from the step\
    \ you accomplished in the previous exercise. Also, add the following code to the\
    \ videos.js file:\n\n```\nVideosApp.init = function () {\n  var videos = [\n \
    \   new Clip(\"Shots\", \"Top 10 Best Tennis Shots Ever\", \"WyJM9-70vZoZ\"),\n\
    \    new Clip(\"Fun\", \"Very funny point\", \"ybsbzV7fNeo\"),\n    new Clip(\"\
    Shots\", \"Best shot of 2012\", \"tEakegtPygw\"),\n    new Clip(\"Shots\", \"\
    Insane passing shot\", \"UHSTMP_bHH8kk\"),\n    new Clip(\"Events\", \"Most important\
    \ match point\", \"xHUwmmyRVJI\")\n  ];\n\n  // Create a WinJS.Binding.List from\
    \ the array.\n  var videosList = new WinJS.Binding.List(videos);\n  var videosGrouped\
    \ = videosList.createGrouped(\n    function (clip) { return clip.category; },\
    \ // group by\n    function (clip) { return { category: clip.category } } // data\
    \ for\n    master view data\n  );\n};\n```"
  merge: -1
  pgno: 233
- img_proc: true
  md: "So you have a collection of tennis-related video clips and you catalogued them\
    \ in three main categories: Shots, Fun, and Events. Needless to say, this classification\
    \ is entirely arbitrary and categories, as well as titles, are entirely up to\
    \ you.\n\n# Grouping data for semantic zoom\n\nIn a Windows Store application,\
    \ you are not allowed to perform data binding on raw JavaScript arrays; you first\
    \ need to transform arrays in a binding list. Do you that through the WinJS.Binding.List\
    \ object. This is just what you did to populate a FlipView component in the previous\
    \ exercise. With a SemanticZoom component, an extra step is required.\n\nA binding\
    \ list object exposes the method createGrouped through which you create a grouped\
    \ binding list. As you can see, the createGrouped method takes two functions as\
    \ arguments. The first function just identifies the key on which the items are\
    \ grouped. The second function returns the JavaScript object that will be used\
    \ to render each item in the master view. Let's explore the code more closely.\n\
    \n```\nvar videosGrouped = videosList.createGrouped(\n  function (clip) { return\
    \ clip.category; },\n  function (clip) { return { category: clip.category } }\n\
    );\n```\n\nBoth functions are called on each item in the bound list. The first\
    \ function returns the expression to group items on. In this case, you group video\
    \ clips on category. In other cases, it could have been the initial of contact\
    \ names or a combination of multiple properties. The second function returns a\
    \ literal JavaScript object with the information you intend to display in the\
    \ master view. It could be the whole Clip object; in this case, you may use a\
    \ simpler object that just includes the category. This means that in the zoomed-out\
    \ master view, the only information available is the category name.\n\n# Binding\
    \ data for semantic zoom"
  merge: -1
  pgno: 234
- img_proc: true
  md: "Binding data to the SemanticZoom component and its child ListView components\
    \ requires a few lines of code. You add the following at the end of the VideosApp.init\
    \ function in videos.js:\n\n```\nvar detailView = document.getElementById(\"listview-in\"\
    ).winControl;\ndetailView.itemDataSource = videoListGrouped.dataSource;\ndetail.groupDataSource\
    \ = videoListGrouped.groups.dataSource;\ndetailView.itemTemplate = document.getElementById(\"\
    zoomed-in-template\");\ndetailView.groupHeaderTemplate = document.getElementById(\"\
    header-template\");\n\nvar masterView = document.getElementById(\"listview-out\"\
    ).winControl;\nmasterView.itemDataSource = videoListGrouped.groups.dataSource;\n\
    masterView.itemTemplate = document.getElementById(\"zoomed-out-template\");\n\
    ```\n\nNote that you need to bind twice to the details view. First you provide\
    \ the plain list of items and then the list of calculated groups. For optimal\
    \ results, the details view needs an item template and a header template. The\
    \ master view needs just the list of bound items and an item template.\n\nBefore\
    \ you can have a look at the work, go back to default.html and add a few templates\
    \ to the markup.\n\n```\n<!-- Template for the zoomed-in details view --\n<div\
    \ id=\"header-template\" data-win-control=\"WinJS.Binding.Template\">\n<div class=\"\
    header-title\">\n  <h1 data-win-bind=\"innerText:category\"></h1>\n</div>\n</div>\n\
    \n<!-- Template for the zoomed-in details view --\n<div id=\"zoomed-in-template\"\
    \ data-win-control=\"WinJS.Binding.Template\">\n<div class=\"zoomed-in-item-container\"\
    >\n  <img src=\"#\" data-win-bind=\"src:posterUrl\" />\n  <div>\n    <h3 data-win-bind=\"\
    innerText: category\"></h3>\n    <h6 data-win-bind=\"innerText: title\"></h6>\n\
    \  </div>\n</div>\n</div>\n\n<!-- Template for the zoomed-out master view --\n\
    <div id=\"zoomed-out-template\" data-win-control=\"WinJS.Binding.Template\">\n\
    <div class=\"zoomed-out-item-container\">\n```"
  merge: -1
  pgno: 235
- img_proc: true
  md: "<div><h1>data-bind-win-innerText=\"innerText: category\"</h1></div></div>\n\
    \nThe elements in the markup are richly styled; so some more work on default.css\
    \ is in order, too. Open the file and enter the following CSS styles:\n\n```\n\
    .header-title {\n  width: 50px;\n  height: 50px;\n  padding: 8px;\n}\n.zoomed-in-item-container\
    \ {\n  width: 280px;\n  height: 70px;\n  padding: 5px;\n  overflow: hidden;\n\
    }\n.zoomed-in-item-container img {\n  width: 60px;\n  height: 60px;\n  margin:\
    \ 5px;\n  -ms-grid-column: 1;\n}\n.zoomed-in-item-container div {\n  margin: 5px;\n\
    \  -ms-grid-column: 2;\n}\n.zoomed-out-item-container {\n  width: 220px;\n  height:\
    \ 130px;\n  background-color: #31cfd4;\n}\n.zoomed-out-item-container h1 {\n \
    \ padding: 10px;\n  line-height: 150px;\n  white-space: nowrap;\n  color: #fff;\n\
    }\n#listview-in-in {\n  width: 650px;\n  height: 300px;\n  border: solid 2px #111;\n\
    }\n#semantic-zoom-container {\n```"
  merge: -1
  pgno: 236
- img_proc: true
  md: "width: 600px;\nheight: 350px;\nborder-top: solid 2px #31cfd4;\nborder-bottom:\
    \ solid 2px #31cfd4;\n\nEverything is ready for testing the application.\n\n#\
    \ Using gradients for the background\n\nYou may have noticed that all colors used\
    \ are so far—especially background colors—are solid colors. Windows 8 makes a\
    \ strong point of simplicity and solid colors are part of the strategy. However,\
    \ that doesn't mean you can't use gradients.\n\nA Windows Store application fully\
    \ supports CSS3, and CSS3 does have a section about gradients. So here's an example\
    \ of a nice (radial) gradient to make the listview background even nicer.\n\n\
    ```\n#semantic-zoom-container {\n  background: -ms-radial-gradient(center, ellipse\
    \ cover, #c5deea 0%,#8abbd7 31%,#066dab 100%);\n}\n```\n\nThe syntax is fairly\
    \ simple and based on the pair color/percentage. In particular, the gradient starts\
    \ based on #c5deea, blends towards #8abbd7, and reaches around 31 percent of coverage;\
    \ the gradient ends with color #066dab. If you like gradients, you can use the\
    \ following syntax:\n\n```\nbackground: -ms-linear-gradient(left, #3b679e 0%,#2b88d9\
    \ 50%,#207cca 51%,#7db9e8 100%);\n```\n\nTo do a live experiment with gradients,\
    \ you can visit to http://www.colorzilla.com. Once there, you can pick up one\
    \ of the predefined gradients or create and preview your own.\n\nEverything is\
    \ now ready and the results of the exercise are ready to be unveiled, as shown\
    \ in Figure 7-12."
  merge: -1
  pgno: 237
- img_proc: true
  md: "# # Start Here! Build Windows 8 Applications with HTML5 and JavaScript\n\n\
    # # My Video Gallery\n\n![](img/d62e4a5ec04f518a61f032ca9cb73f7e_238_0.png)\n\n\
    Figure 7-12. A SemanticZoom component showing its master view.\n\nNote that the\
    \ SemanticZoom component defaults to the details, zoomed-in view. To have it display\
    \ in zoomed-out mode by default, you need an extra attribute in default.html:\n\
    \n```\n<div id=\"semantic-zoom-container\"\n  data-win-control=\"WinJS.UI.SemanticZoom\"\
    \n  data-win-options={initiallyZoomedOut: true}\">\n```\n\nWhen the user clicks\
    \ or taps a category, you get what's in Figure 7-13."
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Start Here! Build Windows 8 Applications with HTML5 and JavaScript


    # My Video Gallery


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_239_0.png)


    Dino Esposito | Francesco Esposito


    Figure 7-13. A SemanticZoom component showing its details view.


    To return to the zoomed-out view, the user clicks the minus button in the bottom
    right corner of the screen.


    # Dealing with video


    To end the exercise, you should make users capable of clicking the item that advertises
    a video clip and actually play it.


    # Handling selection


    The ListView component supports clicking displayed items. To get notified of the
    user’s activity, you register a handler for the iteminvoked event. Just'
  merge: -1
  pgno: 239
- img_proc: true
  md: "open the default.js file and add the following line to the VideosApp.init function.\n\
    \ndetailView.addEventListener(\"iteminvoked\", VideosApp.select);\n\nIn addition,\
    \ create a brand new function named VideosApp.select so:\n\n```\nVideosApp.select\
    \ = function (eventInfo) {\n  eventInfo.detail.itemPromise.then(function (clip)\
    \ {\n    var player = document.getElementById(\"player\");\n    player.src = clip.data.videoUrl;\n\
    \  });\n}\n```\n\nThe invoked event passes a detail object to handlers with an\
    \ indexPath property that simply returns the 0-based index of the clicked item.\
    \ It should be noted, though, there's no guarantee that the index really points\
    \ to the clicked item.\n\nIn other words, you may think that, by knowing the index\
    \ of the clicked item, you're pretty much done and all that remains to do is to\
    \ select the corresponding object from the bound list. Well, depending on the\
    \ number of categories defined, and the distribution of video clips among categories,\
    \ the index you get or may not match the displayed video clip. For example, you\
    \ may click with the intention of playing video ABC and receive an index of three.\
    \ However, index three in the bound list may not be video ABC.\n\nThe point is\
    \ that you bind items in a given order, but then items are rearranged based on\
    \ categories. The index you receive refers to the rearranged order of items; not\
    \ the original order. For this reason, you need to resort to the itemPromise property:\n\
    \n```\neventInfo.detail.itemPromise.then(function (clip) {\n  // clip now matches\
    \ the clicked item\n}\n```"
  merge: -1
  pgno: 240
- img_proc: true
  md: "The itemPromise property misses an internal search that uses the index as the\
    \ key to locate the item actually displayed in that position. Once the object\
    \ has been found, the ListView returns the object which can then be processed\
    \ by your code.\n\n# Playing YouTube video clips\n\nIn order to play YouTube videos\
    \ from your page, you need an IFRAME element that embeds the clip. As a first\
    \ step, you add the following markup to default.html:\n\n```\n<div id=\"player-container\"\
    >\n  <iframe id=\"player\" height=\"100%\" width=\"100%\" type=\"text/html\"></iframe>\n\
    </div>\n```\n\nThe IFRAME element the URL of the video. The URL is provided dynamically\
    \ as the user clicks a given item in the list view. Usually, the YouTube URL takes\
    \ the following form:\n\n```\nhttp://www.youtube.com/embed/<id>\n```\n\nThe id\
    \ placeholder indicates the ID of the video. However, this approach just doesn't\
    \ work in Windows Store applications. The reason is that, by default in the IFRAME\
    \ body, YouTube inserts a piece of HTML that requires the Flash plug-in to play\
    \ the video. The Flash plug-in is not available for Windows Store applications.\n\
    \nTo fix things for Windows Store applications, you must instruct YouTube to return\
    \ the video in an HTML5-compatible format. You do that by using a slightly different\
    \ format for the video URL:\n\n```\nhttp://www.youtube.com/embed/<id>?html5=1\n\
    ```\n\nIn this way, YouTube will insert in the IFRAME piece of HTML that uses\
    \ the VIDEO element of HTLM5 instead of relying on the Flash plug-in.\nFigure\
    \ 7-14 provides a screenshot of the final version of the exercise."
  merge: -1
  pgno: 241
- img_proc: true
  md: '# NOTE


    You should be aware that, currently not all YouTube videos may be played in Windows
    Store applications. First and foremost, owners of the video may have blocked embedding
    of the video. Second, currently YouTube doesn''t play any video that includes
    ads or captions through the HTML5 VIDEO element. For more information, have a
    look at http://www.youtube.com/html5.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_242_0.png)


    Figure 7-14. The final version of the Video Gallery application.


    # Summary


    With this chapter, you completed the overview of the presentation layer of Windows
    Store applications. You learned how to create and manage specialized views, such
    as flip views, list views, and master/detail views (known with the fancy name
    of semantic zoom). You also experienced the navigation system and know what’s
    required to jump to a different page and pass information to that page. In this
    chapter, we also touched on persistence of state through the application’s session
    state.'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'In doing so, you also completed a couple of nontrivial exercises and built
    a couple of interactive galleries for images and videos. In these exercises, you
    worked on a fixed collection of images and videos; however, you learned the foundation
    of galleries and interaction. Once you grasp the basics of file and data management,
    you will be ready for building real-world applications for Windows 8.


    The next chapter still revolves around visual aspects of an application. It’s
    not much about new widgets and components, though. It will be about states of
    an application and related display modes.'
