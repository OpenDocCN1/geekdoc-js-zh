    \  }\n};\n```\n\nA short note is worth mentioning about the setPromise method\
    \ you see in the code snippet. The method informs the application that some asynchronous\
    \ work is in progress. The method that hosts setPromise can't then be exited until\
    \ the pending work is completed. However, processing continues up to the end of\
    \ the containing method. This creates the problem of how you can reliably decide\
    \ what to do once the pending work—also referred to as the promise—has terminated.\
    \ The promise object in WinJS has the then method that you use to specify any\
    \ work to do upon completion of the promise. Here's an example:\n\n```\nargs.setPromise(WinJS.UI.processAll())\n\
    \  .then(function() { ... })\n```\n\nAnother similar method also exists, named\
    \ done. The difference between done and then is only that then returns another\
    \ promise object, whereas done doesn't return any value.\n\n```\nargs.setPromise(WinJS.UI.processAll())\n\
    \  .then(function() { ... })\n  .then(function() { ... })\n```"
