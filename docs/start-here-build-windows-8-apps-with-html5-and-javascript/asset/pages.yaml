- img_proc: true
  md: '# Table 6-1. Purpose of the images in the default project template


    | Image file | Purpose |

    | --- | --- |

    | Logo.png | This is the image that appears in the title that is reserved for
    the application in the Start screen. You can provide this image in either .png
    or .jpg format. The recommended size is 150 x 150 pixels. Windows usually overlays
    the name of the application onto the image; so you might want to consider not
    including the application''s name in the image. |

    | SmallLogo.png | This is the image used to represent the application in search
    results. The format can be either .png or .jpg, and the recommended size is 30
    x 30 pixels. |

    | SplashScreen.png | This is the image displayed for a relatively short period
    of time while the application loads after having been launched by the user. The
    format can be either .png or .jpg, and the recommended size is 620 x 300 pixels.
    |

    | StoreLogo.png | This is the image used to represent the application in the Windows
    Store. The format can be either .png or .jpg, and the recommended size is 50 x
    50 pixels. |


    You may wish to provide additional images as well, such as a WideLogo.png image,
    to provide a larger logo file—up to 310 x 150 pixels. Finally, the BadgeLogo.png
    file is a small image (usually 33 x 33 pixels) displayed on the Lock screen of
    a Windows 8 device to identify pending notifications from your application.


    The Js folder contains the JavaScript files that contain any logic required by
    the application. You usually have one JavaScript file per HTML page in the project,
    but you may also have additional JavaScript files shared by multiple pages in
    the project.


    The root folder of the project contains three files, as summarized in Table 6-2.'
