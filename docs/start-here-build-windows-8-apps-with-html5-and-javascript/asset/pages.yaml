  md: '# BUILDING AND DEBUGGING AN APPLICATION


    You write the source code for an application in the context of a Visual Studio
    solution. A solution is the repository of all resources required for the application
    to work: source files, images, sheets, manifest, and so forth.


    Having a solution is not the same as having an application; but you can create
    an executable from a solution by successfully "building" (compiling) the solution.
    To build the current solution in Visual Studio, press F7 or select the Build option
    from the Build menu, as shown in Figure 6-11. During the build, the Visual Studio
    environment invokes the compiler and processes your source code. If everything
    is OK and no syntax errors are detected, you wind up with an executable application
    that you can launch.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_199_0.png)


    When Visual Studio discovers errors during the build step, it lists them for you
    in a window at the bottom of the Visual Studio environment. However, when you
    build a JavaScript application (as in this book), it''s unlikely that you will
    get errors during the build process. It''s more likely that you will get runtime
    errors.


    Run errors show up during the debugging phase. The debugging phase is all about
    running the application to see if it does what it is supposed to. You start debugging
    the application by hitting F5 or selecting the Start Debugging from the Debug
    menu.


    Figure 6-12 shows the effect of a syntax error, comma is missing right before
    the highlighted line. Note that the message you receive may be a bit misleading
    about the real causes of the problem. In the figure, Visual Studio seems to indicate
    that the code is missing a closing bracket. That is definitely a possibility,
    but it is not the real issue with the code in the figure. The point is that, in
    general, you must pay attention to the fact that there is an error, you'
