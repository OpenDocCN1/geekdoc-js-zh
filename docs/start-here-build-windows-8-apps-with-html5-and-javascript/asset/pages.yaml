    # Anonymous Functions


    So far, this chapter has focused mostly on named functions. What about unnamed
    functions (anonymous functions), instead? In JavaScript, anonymous functions are
    the pillar of functional programming. An anonymous function is a direct offshoot
    of lambda calculus, or if you prefer, a language adaptation of old-fashioned function
    pointers. Here’s a simple example of an anonymous function:


    ```

    function(x, y) {

    return x + y;

    }

    ```


    The only difference between a regular function and an anonymous function is in
    the name (or lack thereof).


    Why are anonymous functions becoming so popular? The primary reason is that anonymous
    functions allow you to define code in place—without the need to define a named
    function somewhere. The drawback of anonymous functions is that they are not reusable.
    As long as you need to pass a one-off piece of code as an argument, then using
    an anonymous function is more than acceptable. However, if the function might
    be used more often, a named function is preferable. Just for the sake of illustration,
    here’s a rewrite of the previous code using anonymous functions:'
