  md: '# Table 2-3. Attributes of the <video> element


    | Attribute | Description |

    | --- | --- |

    | autoplay | Indicates that the video will start playing as soon as the content
    is available to the browser. |

    | controls | Instructs the browser to display video controls as the play and pause
    buttons. |

    | height | Indicates the desired height of the video player in the HTML document.
    |

    | loop | Indicates that the video will automatically restart after it is finished.
    |

    | muted | Indicates that the video sound should be muted off. |

    | poster | Instructs the browser to display a specified image while the video
    content is downloading, or until the user chooses to play the video. |

    | preload | Instructs the browser on how to load the video content when the page
    loads. Allowed values are *none*, meaning that no content should be preloaded;
    *auto*, *metadata*, meaning that only content metadata should be preloaded on
    page display. |

    | src | Indicates the URL of the video file to play, whether local or remote.
    |

    | width | Indicates the desired width of the video player in the HTML document.
    |


    It is highly recommended that you always set width and height while a <video>
    element. This helps the browser to reserve empty space while rendering the page.
    In addition, you should always set width and height to the real size of the video
    clip you plan to incorporate. If you downsize the video player, you force the
    browser to do more work. Keep in mind that downsizing a video won''t save the
    user download time. If you have a video that is too large for the page, you should
    resize it with an ad hoc program first, and then link it using its new size.


    Figure 2-11 shows how Internet Explorer 10 renders a video element.'
