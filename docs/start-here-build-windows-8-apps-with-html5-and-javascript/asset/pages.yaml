    # The Windows 8 Runtime (WinRT)


    It''s fairly rare for a new version of an operating system to introduce a new
    type of application that is completely incompatible with older versions of the
    same system. Sometimes a newer operating system offers a few new functions that
    tease companies to update existing programs. However, in Windows 8, there''s a
    completely new segment of applications, named Windows Store apps. Not only do
    these applications run only on Windows 8, but they also have a brand new look
    and feel, can be offered for free or sale through the Windows Store and last,
    but certainly not least, are not limited to classic personal computers but instead
    can run—unchanged—on a variety of Windows 8-compliant devices, most notably Microsoft
    Surface devices. In addition, Windows Store applications can only be developed
    on machines running Windows 8.


    > NOTEnJust to cool down some premature enthusiasm: no, there''s no way for you
    to run your handmade Windows 8 application on iPad. Any Windows 8 application
    can run on devices as long as the device is compatible with Windows hardware and
    software requirements.


    # Windows Store apps and other apps


    Windows 8 has two working modes that you can switch on and off—the standard Windows
    mode and the new Windows 8 mode. When configured'
