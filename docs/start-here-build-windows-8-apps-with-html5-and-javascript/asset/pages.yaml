  md: "# Detecting required fields\n\nBy adding the `required` attribute to a `<input>`\
    \ element, you tell the browser that the input field cannot be blank when the\
    \ form that contains the `input` element is submitted. You use the required attribute\
    \ only if the field is not considered optional.\n\nConsider the following content\
    \ of an HTML page named `required.html:`\n\n```\n<body>\n<form>\n  <input type=\"\
    text\" placeholder=\"Your PIN\" required />\n  <br />\n  <input type=\"submit\"\
    \ value=\"Enter />\n</form>\n</body>\n```\n\nWhen the user pushes the submit button\
    \ and the text field is empty, the browser automatically denies the post and displays\
    \ an error message. The specific content, form, and shape of the error message\
    \ may change according to the browser; the overall behavior, though, is similar\
    \ on all HTML5-compliant browsers. Figure 2-9 shows how Internet Explorer 10 deals\
    \ with required fields left empty.\n\n![](img/d62e4a5ec04f518a61f032ca9cb73f7e_62_0.png)\n\
    \nHTML5 browsers allow you to customize the error message using the `oninvalid`\
    \ attribute, as shown below:"
