- img_proc: true
  md: 'These visual components cover a good number of common scenarios; you can expect
    to find more readymade Windows Store visual components from third-party vendors,
    open-source projects, and blog posts. As you get more and familiar with Windows
    8 development, you can even start creating your own widgets. Having a widget to
    provide a given functionality just makes it far easier to reuse across multiple
    pages and applications.


    > IMPORTANT

    You mostly wrote Windows Store applications using HTML and CSS to define the user
    interface. Anything you can do with HTML and CSS is fine. Stock visual elements
    listed in Table 5-1 help you in making available useful components and giving
    your applications an overall consistent look and feel.


    # On-demand user interface


    It should be clear by now that Windows 8 provides a few standard ways for users
    to access features in an application. There are static commands bound to fixed
    elements in the user interface (such as, buttons) and dynamic commands that become
    available on demand.


    By using the principle of on-demand UI, you aim at leaving the real estate of
    the application as clean and tidy as possible and not at all overloaded with visual
    items. At the same time, items required to trigger commands and start operations
    show up on demand when the user seems to need them. The App bar and the system''s
    Charms bar are the mechanisms provided by Windows 8 for on-demand UI. The App
    bar is a repository of application''s commands that pops up as the user moves
    towards the bottom of the screen. The Charms bar slides from the right edge.


    Charms provide a common way for users to get to the features of nearly every application;
    for example, search, share, and access to files. The App bar, instead, contains
    application-specific commands and is expected to list commands that make sense
    for the current view only.


    # Creating a sample app bar'
