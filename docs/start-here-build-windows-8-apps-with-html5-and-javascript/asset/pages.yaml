  md: "In the click handler of the Search button, you get any text typed into the\
    \ input field and pass it down to the newly created download function. Internally,\
    \ this function composes and invokes the Flickr URL via WinJS.xhr. Note that if\
    \ you pass an empty tag list, you will still get some photos in response; that's\
    \ why it is not strictly required that you check the tags variable for null or\
    \ empty.\n\n# Getting the JSON data\n\nYou use the WinJS.xhr function to download\
    \ the JSON string that describes selected photos. Using the WinJS.xhr function\
    \ is the same as in the previous exercise. You define two functions: one that\
    \ executes successfully and one when the request fails, pass them to the method\
    \ object returned by WinJS.xhr.\n\n```\nWinJS.xhr({ url: url }).then(\n  function\
    \ (response) {\n    flickApp.parseFeed(response.responseText);\n    function (response)\
    \ {\n      var message = \"Error downloading photos.\";\n      if (response.message\
    \ != null)\n        message += response.message;\n      flickApp.alert(message);\n\
    \    }\n  }\n);\n```\n\nThe then method passes to its functions an object that\
    \ represents the response retrieved from the remote source. To get the plain text\
    \ contained in the body of a JSON response, query the responseText property.\n\
    \nThe heart of the Flickr application is inside the body of the flickApp.parseFeed\
    \ method. Here's its implementation:\n\n```\nflickApp.parseFeed = function (json)\
    \ {\n  var pictures = JSON.parse(json);\n  for (var i = 0; i < pictures.items.length;\
    \ i++) {\n    var pictureElement = {};n    pictureElement.photoUrl = pictures.items[i].media.m;\n\
    \n  // Bind to the listview\n```"
