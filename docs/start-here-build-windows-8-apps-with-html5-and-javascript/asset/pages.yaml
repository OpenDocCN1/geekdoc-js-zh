    # Device-centric design


    A Windows Store application presents itself fused to the design of the operating
    system and fully immersed in the surrounding environment. You can legitimately
    think that the design principles applied are not specific of the Windows 8 platform.
    It is instead a set of principles that, while developed to be applied to Windows
    8 applications, are general enough to become source of inspiration for any software
    and platform that needs be device-centric.


    Device-centric is a relatively new term that essentially revolves around the idea
    that functionality of an application should be based on the assumption that the
    application will run on a variety of different devices—different for screen size,
    memory capabilities, and programming power.


    # Inspiring principles of the Windows 8 UI


    The Windows 8 UI is inspired by the following seven principles:


    +   - Design for touch and intuitive interaction.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '+   - Be responsive to user interaction and always ready for the next interaction.


    +   - Reduce redundancy in your user interface.


    +   - Fit into the existing UI model.


    +   - Don’t reinvent the wheel.


    +   - Collaborate with other applications via contracts.


    +   - Be aware of the clouds.


    Extensive application of these principles can really make any applications—and
    not just upcoming Windows Store applications—much more virtuous and attractive.


    > NOTE

    To understand why Windows 8 UI design principles are important, just consider
    that for too many years users of software applications have been forced to think
    and act following the rules of the application design. Regardless of best intentions,
    software did not take care of end users enough. This is going to change, though;
    youngsters are going to be a much less forgiving generation of users than the
    current one. Be prepared to design applications that are fluid in the design—both
    graphical design and logical design. That’s probably the only software that makes
    sense shortly. Thanks to the native user interface, Windows 8 is probably really
    making this easy.


    So the question: How would you turn these guidelines into concrete action?


    # Design for touch


    Touch is what makes an application immediate to use, and it is the primary factor
    that sets the success of smartphones and tablets. Touch is, however, also a divider.
    If you invest in a user interface that’s touch-based, and your'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'software may not be able to run smoothly on a non-touch device. So it is key
    that you never consider touch as the only source of input.


    This means, for example, offering the mouse or keyboard to classic users and a
    touch screen to younger (or just more immediate) users. In this way, users may,
    pinch and stretch to zoom on some content on tablets and just click (or perhaps
    double-click) to get the same effect on laptops.


    # Be responsive and ready


    Touch has a quantum leap for user experience. It has the side effect of making
    another aspect of user experience even more important—responsiveness. As the user
    taps and “touches” visual elements, she expects them to react quickly, as other
    objects in the real world. Try lightly tapping an object on the edge of the table;
    if the touch was perceived and detected, well, the object falls down immediately:
    it doesn’t display an hourglass and then fall a few seconds later.


    Beyond touch and responsiveness, intuitiveness of the interaction is also critical.
    A goal of the application should be making it clear for users at any stage what
    the next operations are. This apparently basic point has nontrivial implications
    on design of the user interface and organization of the data and logic.


    # Zero redundancy


    For many years, redundancy in the user interface of an application has been considered
    a good thing. You define a user interface as redundant if it allows performing
    the same task in more than one way. Keyboard and mouse navigation, slightly different
    menu items (such as, Save, Save All, Save As), and keyboard shortcuts all produce
    the same result in many applications you may use.


    In a user interface that is essentially touch-based, all these methods have no
    reason to exist. The zero redundancy policy is a great virtue of Windows Store
    applications.


    This is a design consideration that also emerges quite clearly in many successful
    mobile applications and is tightly connected to a growing need'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'for simplicity and effectiveness—like being able to do more things (or just
    the same things) with less options and less tools.


    # Do as Romans do


    Another pillar of software development of the past that the Windows 8 UI brings
    into question the overall user interface model. For various reasons, some applications
    made a point of providing a custom user interface. Sometimes this has happened
    to make the application shine in comparison to other applications of the same
    type. Sometimes, instead, it came as the result of trying to make the application
    in some way more usable and enjoyable.


    Any application in Windows 8 should take its own space in the context of the user
    interface dictated by the platform. For this reason, the fourth principle of Windows
    8 applications can be summarized with the old proverb that suggests doing as Romans
    do, at least when you''re in Rome. Also, this principle is nothing to anybody
    with a bit of experience in mobile application development.


    Especially in iOS and Windows Phone markets, applications may be rejected if they
    provide a user interface that clashes with guidelines. You take the same risk
    with Windows Store apps.


    # Do as Romans do (and don''t reinvent the wheel)


    The fifth principle of Windows Store applications is a tricky corollary of the
    fourth. It strengthens the importance of giving applications a user interface
    that fits well with the system’s user interface. Not only do you want to make
    apps consistent with the system, but you also want to achieve that by using tools
    and templates offered by the Windows 8 stack of choice.


    For this reason, you''ll be using extensively the aforementioned WinJS library
    in the upcoming chapters. WinJS is the repository of the native tools for building
    Windows Store applications with HTML and JavaScript. You’ll find an introduction
    to the library in the next section.


    Collaborate (and don''t reinvent the wheel)'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'Full integration with the host platform is a winning point of any Windows Store
    application, as it allows users to feel at home with just any application. Furthermore,
    it also enables distinct applications to interact and exchange data.


    The sixth principle can then be summarized by saying that applications rely on
    public services exposed by other applications to implement their functionality.
    Windows Store applications may import functions from other applications via contracts.
    A *contract* is a formalized API for applications to invoke functions from other
    applications. This saves you from rewriting the same functions over and over,
    and at the same time, it brings users to the same action in the same way.


    For example, Windows Store applications can support the system-defined *Search*
    to retrieve information from other applications and implement the *Share* to expose
    their content publicly.


    # Above us only cloud


    Finally, the seventh principle probably needs no further explanation. Local disks
    are no longer and not necessarily the place to save and read data. To ensure a
    continuous feel between the user and the application, for years developers used
    to save personal data to cookies and local settings. The cloud adds another dimension
    by publishing personal data and making that information available to others for
    social software interaction. Here the cloud indicates user-specific or even application-specific
    storage that lives on some remote server that is publicly accessible.


    # Components for the presentation layer


    The WinJS library is a library made of JavaScript objects expressly designed to
    provide easy access to core Windows 8 features and subsequently simplify the development
    of Windows Store applications with JavaScript.


    WinJS consists of two main parts: a collection of behavioral objects to deal with
    core tasks such as storage, networking, multimedia, and application'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'lifecycle, and a set of widgets for user interface arrangements. You’ll use
    both parts of the WinJS library in the rest of the book. Anyway, it is helpful
    to have an overall vision of the visual widgets you can quickly incorporate in
    your applications as building blocks.


    # Visual elements of WinJS


    Table 5-1 provides a view of the visual elements you find in the WinJS library.
    You will compose the user interface of your future Windows Store applications
    by integrating one or more of these components in an HTML template.'
