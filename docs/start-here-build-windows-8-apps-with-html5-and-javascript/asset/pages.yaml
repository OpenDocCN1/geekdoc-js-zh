  md: 'What happens if you compare x and y?


    JavaScript has two equality operators: the double equals sign (==) operator and
    the triple equals sign (===) operator. If you use the == operator, both expressions
    are evaluated and the resulting values are compared. However, if you use the ===
    operator, then the types of the values are also compared. In reference to the
    previous code snippet, if you compare x and y using the == operator you get true,
    meaning that the undefined value of x ultimately evaluates to null, which matches
    the value assigned to y.


    In contrast, if you compare x and y using the === operator, then you get false:
    the two values hold the same value but are of different types.


    # Dealing with variables


    In JavaScript, a variable is a simple storage location and is not restricted to
    always storing values of a fixed type. When assigned a value, variables take the
    type of the data being stored. For this reason, a JavaScript variable may change
    its type quite a few times during its lifespan, as shown in the following code
    snippet:


    ```

    var data = "dino";   // now data is of type string

    data = 123;            // now data is of type number

    ```


    JavaScript variables spring into existence the first time they’re used; until
    then, they hold a value of null and their type is undefined.


    # Local variables


    When defining variables, you should always use the var keyword as a hint to the
    parser and yourself. The var keyword is not strictly required, but it is highly
    recommended to keep the scope of the variable under strict control.


    Variables defined within the body of a function are scoped to the function—and
    are therefore local variables—only if they have been declared using the var keyword.
    If you omit var, variables are treated as global, but remain undefined until the
    function executes once.'
