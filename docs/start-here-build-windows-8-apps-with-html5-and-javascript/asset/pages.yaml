    \    rssReaderApp.parseFeed(response);\n),\nfunction(error) {\n    rssReaderApp.alert(\"\
    A download error occurred.\");\n}\n););\n```\n\n![](img/d62e4a5ec04f518a61f032ca9cb73f7e_365_0.png)\n\
    \nFigure 11-2. Handling errors during HTTP operations."
