    # # Form submission


    Sometimes developers have no other option besides writing the same boilerplate
    code over and over again, no matter how annoying it is. A good example of boilerplate
    code that would be great to stop writing is validation of input forms in HTML
    pages. Any data collected from an HTML input form should be carefully validated
    on the server before being used for some business tasks. However, some basic validation
    tasks can be easily delegated to the browser and commanded by the developers using
    markup instead of JavaScript code.


    HTML5 reduces the amount of boilerplate code requested to build effective input
    forms. I''ve already mentioned the newest attributes of the HTML5 <input> element;
    the next step is to take a look at other attributes you can leverage to control
    the whole process of form submission, including ways to ensure that the user has
    not left fields blank, and that the user input matches expected patterns. For
    example, if you ask for a phone number, the user shouldn''t be allowed to enter
    something that couldn''t possibly be a valid phone number.'
