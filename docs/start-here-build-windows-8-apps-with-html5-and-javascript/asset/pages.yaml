    its content—the five child elements named blockN—within any available space. The
    major benefit is that no content will be cropped. In addition, child blocks will
    wrap and be aligned as specified by'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'the -ms-flex-XXX attributes of the flexible-container CSS class. The key style,
    however, is the -ms-flexbox value assigned to the display attribute of the flexible-container
    CSS class: this is the attribute that makes the content of a DIV element vertically
    or horizontally and according to other parameters. Table 8-1 provides a quick
    summary of the options you have to further customize the rendering of child elements
    in a flexible box.


    # Table 8-1. Styles supported by a flexible box


    | Style | Description |

    | --- | --- |

    | -ms-flex-direction | Indicates the orientation of all child elements within
    the flexible box. Possible values are: row, column, row-reverse, and column-reverse.
    The default value is row. A value of row indicates that child elements flow horizontally
    to fill up space. Elements are listed in the order they are declared in the source
    code. A value of column, instead, makes elements flow vertically. The reverse
    qualifier is used if you want to invert the order of elements and proceed to the
    first. |

    | -ms-flex-align | Indicates the alignment of child elements within the flexible
    box. The alignment is meant to be vertical if the direction (ms-flex-direction
    style) is horizontal and if the direction is vertical. Possible values are: start,
    end, center, and stretch (default). A value of start aligns elements to the top
    (left). A of end aligns to the bottom (right). A value of center just centers
    elements, whereas a value of stretch gives all elements the maximum width/height
    available. |

    | -ms-flex-pack | Indicates how excess space is distributed between child elements
    in the flexible box. Possible values are: start, end, center, and justify (default).
    A value of start leaves any space at the end of the row/column. A value of end
    leaves any space at the beginning of the row/column. A value of center just centers
    elements, whereas a value of justify splits the excess space between child elements
    |

    | -ms-flex-wrap | Indicates whether child elements wrap onto multiple lines or
    columns based on the available space in the object. Possible values are: none
    (default), wrap, and wrap-reverse. A value of none indicates that each child element
    goes on a separate row/column. A value of wrap, instead, forces the flexible box
    to accommodate child elements sequentially in the order of declaration. A value
    of wrap-reverse, instead, flows elements in the reverse order. |'
  merge: -1
