    \  height: 100%;\n  margin: 0px;\n  margin-left: auto;\n}\n```\n\n![](img/d62e4a5ec04f518a61f032ca9cb73f7e_98_0.png)\n\
    \nThe BODY element sets its margin to 0 pixels, meaning that empty space will\
    \ be left between the page content and browser’s edges. The HEADER element takes\
    \ up the entire width of the screen and just 80 pixels of the height. The DIV,\
