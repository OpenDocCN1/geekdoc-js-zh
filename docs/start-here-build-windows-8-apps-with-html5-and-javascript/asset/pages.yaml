  md: '# Table 1-3. Predefined project templates for Windows Store applications


    | Template | Description |

    | Blank App | The application consists of a single and nearly empty page: no visual
    controls, no widgets, and no layout defined. |

    | Grid App | A master-detail application made of three pages. The master page
    groups items in a grid. Additional pages provide details on groups and individual
    items. |

    | Split App | A two-page master-detail application in which the master page shows
    selectable items and the details page lists related items alongside. |

    | Fixed Layout App | A single-page application whose layout scales using a fixed
    aspect ratio. |

    | Navigation App | A multipage application with predefined controls to navigate
    between pages. |


    For the purposes of this book, the easiest is starting with a new brand blank
    application. You will experiment with other types of templates in the upcoming
    chapters.


