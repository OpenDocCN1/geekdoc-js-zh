    To go beyond the basic level of getting and displaying a random number, you need
    to acquire some command of HTML and CSS, and get the hang of the JavaScript language.
    The former will help you imagine and create the graphical part of any applications
    you intend to try out. The latter will help you organize the code to ward off
    unexpected results, so that you can translate your ideas into instructions for
    the operating system more easily.


    Now you''re ready to take the plunge into the Windows 8 Runtime (WinRT) environment.
    A runtime environment is the collection of Windows 8 programs and components that
    interact with any applications and make them run. Such an environment provides
    services and data to any applications, but also requires that applications comply
    with some rules and constraints.


    This chapter has three main objectives:


    +   - Exploring the Windows 8 runtime environment


