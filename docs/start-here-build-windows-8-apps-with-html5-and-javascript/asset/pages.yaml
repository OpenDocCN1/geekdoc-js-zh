  md: 'Unobtrusive JavaScript is a pattern that suggests a more effective way of achieving
    the same result. Unobtrusive JavaScript is also the preferred way of binding code
    to events in Windows 8. Let''s find out more.


    # Event attributes of an HTML element


    For years, it has been common to write HTML pages with input fields and buttons
    explicitly attached to JavaScript event handlers. Here’s a typical example:


    ```

    <input type="button" value="Click me" onclick="handleClick()" />

    ```


    From a purely functional perspective, there’s nothing wrong with this code—it
    works as expected: the onclick attribute associates the click action with the
    handleClick JavaScript function, that then runs whenever a user clicks the button.
    This approach, however, is largely acceptable only when you’re using JavaScript
    to spice up simple pages. It becomes unwieldy when the amount of JavaScript code
    represents a significant portion of the page or the view.


    In a way, unobtrusive JavaScript is the script counterpart of CSS classes. With
    CSS, you write plain HTML without including inline style information. Next, designers
    style elements using CSS classes. Likewise, for unobtrusive JavaScript, you avoid
    using the in-tag event handler attributes (onclick, onChange, onblur, and the
    like) and instead use a single JavaScript function to attach handlers when the
    page is ready for display. By not using event attributes, you keep markup code
    and JavaScript code separated.


    What about the code that is referenced by event handlers? In other words, where
    would you get the code for functions like handleClick?


    # Embedded JavaScript code


    You can embed JavaScript content in an HTML page in a number of ways. The simplest
    way to have JavaScript code ready to use in an HTML page is placing it in the
    page within a script element.'
