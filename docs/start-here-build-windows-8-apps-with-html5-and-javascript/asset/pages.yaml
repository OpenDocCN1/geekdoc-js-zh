    # Making use of geolocation data


    Geolocation data are quite sensitive, because a user’s location can—potentially—reveal
    a given individual is at a given time to the entire world. Location is certainly
    a matter of privacy, but it is also a matter of marketing. For both reasons, Windows
    8—as well as other mobile operating systems and web browsers—tends to leave the
    decision to make location data available up to the user.


    As a developer, what a geolocation API generally gives you is a series of numbers
    that represent latitude and longitude. While latitude and longitude uniquely identify
    a specific location in the world, they are not always useful to applications.
    To make them useful, you often need to convert the raw numbers into more human-friendly
    geographical data, such as city and country?


    Adding the Bing SDK to the application'
