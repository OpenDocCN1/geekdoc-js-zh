  md: "To embed audio content into HTML documents, you use the <audio> element. The\
    \ syntax is trivial, as the example below shows:\n\n```\n<audio src=\"hello.mp3\"\
    >\n  <p>Your browser does not support the audio element.</p>\n</audio>\n```\n\n\
    Optionally, you can incorporate some markup in the body of the <audio> element\
    \ to be used in case the browser can't deal successfully with the <audio> element.\
    \ Next, you'll explore a bit more about how to embed audio in HTML5 pages.\n\n\
    # Using the <audio> element\n\nThe <audio> element supports a variety of attributes,\
    \ as listed in Table 2-2. Of these, the most important is src, which you use to\
    \ point to the location of the actual audio stream.\n\nTable 2-2. Attributes of\
    \ the <audio> element\n\n| Attribute | Description |\n| --- | --- |\n| autoplay\
    \ | Indicates that the audio will start playing as soon as the content is available\
    \ to the browser. |\n| controls | Instructs the browser to display audio controls,\
    \ such as the play and pause buttons. |\n| loop | Indicates that the audio will\
    \ automatically restart after it is finished. |\n| preload | Instructs the browser\
    \ on how to load the audio content when the page loads. Allowed values are none,\
    \ meaning that no content should be preloaded; auto, meaning that the entire content\
    \ should be downloaded when the page loads; and metadata, meaning that only content\
    \ metadata should be preloaded on page display. |\n| Note that the preload attribute\
    \ is ignored if the autoplay attribute is also present | |\n| src | Indicates\
    \ the URL of the audio file, whether local or remote. |"
  merge: -1
