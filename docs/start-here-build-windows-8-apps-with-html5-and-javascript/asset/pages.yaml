  md: '> NOTE

    Since WinJS applications are essentially browser-based applications, you may think
    that you can print the old JavaScript way: by calling the window.print method.
    That works, but it is only in very simple situations. It is recommended that you
    use the window.print method only if you have a single printing template. After
