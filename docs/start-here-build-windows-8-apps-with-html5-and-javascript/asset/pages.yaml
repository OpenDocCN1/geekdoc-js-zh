    # # Using the application’s private storage


    So far, you have created and managed files by accessing the local disk of the
    machine directly. As you have noticed, a Windows Store application is not always
    allowed full access to the disk; but still a section of the disk is freely accessible
    in reading and writing. In the rest of chapter, you will practice with another
    form of storage that involves a section of the disk that is private to each application
    and totally invisible to others.


    # # Storage options in Windows 8


    Windows Store applications have three options as far as storage is concerned.
    In Chapter 9, you practiced with LocalSettings; earlier in this chapter you also
    practised with files in the local disk. These are two of the three storage options
    for a Windows Store application. The third option consists in a section of the
    local disk that is reserved to the application. Let’s briefly compare the three
    options to identify proper use-cases for each.'
