  md: '# Parsing and displaying downloaded data


    At this point, you know everything you need to place a successful call to a remote
    HTTP endpoint and grab some data. The next step is to do something significant
    with that data. In this exercise, you will call into the Google News service to
    download the latest news as an RSS feed. Next, you will parse the returned string
    into a List of items and use them to populate a list view.


    Extending the RSS Reader application


    Before you turn your attention to parsing RSS data, some changes to the user interface
    of the application are in order. To make those changes, open default.html and
    enter the following markup:


    ```

    <h1>RSS Reader (CH11)</h1>

    <div id="newslist" data-win-control="WinJS.UI.ListView">

    </div>

    <div id="splitView">

    <div id="titleDetail"></div>

    <div id="pubDateDetail"></div>

    <div id="categoryDetail"></div>

    <div id="descriptionDetail"></div>

    </div>

