- img_proc: true
  md: "request completes successfully. The completed function receives the response\
    \ from the server as its single argument.\n\nAs you can see from the prototype,\
    \ however, you can also pass a second function to the promise. That second function\
    \ is the error handler for the request. The error handler function will be invoked\
    \ automatically by the system if the request fails for some reason. The error\
    \ function receives an error object, which has properties such as status, statusText,\
    \ and message. Note that depending on which error occurred, some of these properties\
