- img_proc: true
  md: 'In the beginning, the role of the media attribute was limited to using different
    CSS files for viewing and printing a given HTML page.

    Originally, feasible values for the media attribute were screen, print, and all.


    More recent browsers support a true query language in the media attribute that
    allows you to select the CSS file to apply it to based on the browser’s runtime
    conditions.


    # Dynamic selection of the CSS file


    Here’s an example of how to dynamically link CSS files to an HTML page using media
    queries. The idea is that a page offers a number of choices and the browser dynamically
    picks up the most appropriate choice given its current status.


    ```

    <link type="text/css"

    rel="stylesheet"

    href="tiny.css"

    media="only screen and (max-width: 320px)">

    <link type="text/css"

    rel="stylesheet"

    href="large.css"

    media="only screen and (min-width: 321px)">

    ```


    Interestingly, modern browsers are also able to adjust their selection of the
    CSS file as dynamic conditions change. It means that the browser will automatically
    apply tiny.css when the width of the screen is up to 320 pixels and switch to
    large.css when the window is resized to at least 321 pixels.


    The media queries mechanism serves two purposes. On one it gives you a chance
    to make pages that adapt to the current screen size; on the other hand, it represents
    a simple, but effective, tool to give your pages a mobile interface at nearly
    no cost. In the simplest case, in fact, a mobile device is just a browser with
    a smaller screen size.


    # Syntax of Media Queries'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'As mentioned previously, a browser’s runtime conditions can affect the selection
    of the CSS file. Let’s briefly review which runtime information you have access
    to in order to decide about the CSS file. First and foremost, a media query expression
    begins as a way to force older browsers to ignore the statement. Table 3-3 lists
    the main media query properties.


    # Table 3-3. Popular media query properties


    | Property | Description |

    | --- | --- |

    | width | Returns the width of the current browser view. The property supports
    min/max prefixes. |

    | height | Returns the height of the current browser view. The property supports
    min/max prefixes. |

    | orientation | Returns “portrait” when the value of the height property is greater
    or equal to the value of the width property. Otherwise, it returns “landscape.”
    |


    The orientation property, for example, allows you to determine (more specifically
    than with just width) whether the page is being viewed in portrait or landscape
    mode.


    In addition, you can use AND and NOT operators to build up expressions as complex
    as you like them to be.


    # Summary


    CSS is the language used to add graphical styles to HTML pages. It is based on
    a collection of commands that select one or more HTML elements and alter their
    default appearance. You identify target elements via selectors and style them
    through a collection of property/value assignments.


    In this chapter, you learned how to define selectors and explored the most important
    properties you might want to set in order to achieve great results with your pages.'
