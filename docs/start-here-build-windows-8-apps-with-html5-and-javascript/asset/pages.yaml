    This pattern represents a programmatic way to update the user interface with calculated
    data. The approach that is based on direct updates of the DOM is extremely fast,
    but works well only if you want to update specific elements. Scenarios where you
    have multiple elements to display—for example, a list—or multiple pieces of data
