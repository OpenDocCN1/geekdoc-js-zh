  md: "```\nSnapMeApp.refresh = function () {\n  // Update the label with the current\
    \ view state\n  var stateElem = document.getElementById(\"currentViewState\");\n\
    \  stateElem.innerHTML = SnapMeApp.Current.currentViewState;\n\n  // Update the\
    \ label with the total number of clicks\n  var totalElem = document.getElementById(\"\
    total\");\n  totalElem.innerHTML = SnapMeApp.Current.total;\n}\n```\n\nWith the\
    \ SnapMeApp.refresh function in place, you don't need to retrieve information\
