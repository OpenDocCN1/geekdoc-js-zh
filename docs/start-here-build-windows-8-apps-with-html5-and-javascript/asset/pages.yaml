- img_proc: true
  md: 'The checkered texture you see in the figure is the Paint.NET way of telling
    that your image has a transparent background. Giving logo files a transparent
    background is not mandatory, but it helps keep your logo images more consistent
    with the overall user interface of Windows 8 (and anyway, makes them look nicer).


    Another trick you might want to apply to logo images to make them more similar
