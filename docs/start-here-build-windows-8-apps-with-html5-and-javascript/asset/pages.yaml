    \ || (\ntilesDemoApp.init = function () {\n  // More code goes here\n});\n```\n\
    \nThe default.html page should look like the code below:\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"utf-8\" />\n<title>Simple Tiles Demo</title>\n\
