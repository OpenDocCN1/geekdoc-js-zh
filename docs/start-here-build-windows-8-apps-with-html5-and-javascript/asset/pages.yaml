- img_proc: true
  md: '# 8.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_463_0.png)


    Note that after a name has been reserved, you are the only person who can use
    it. Name reservations are valid for one year; however, if you don''t publish an
    application under that name within a year of making the reservation, the Windows
    Store will release the name and others can use it.


    # Localizing an application name


    There are some situations in which the application has a name that is “neutral”
    to spoken languages. In such cases, you won''t ever want to change the name regardless
    of how many languages you localize the application for. This is, however, a very
    special situation. More likely, you might want to translate—or just change—the
    name of an application based on the language used by its intended audience. Using
    a different name for each supported language is a recommended (not mandatory)
    approach. If you plan to use localized names, the page in Figure 14-9 shows how
    to proceed.'
  merge: -1
  pgno: 463
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_464_0.png)


    After reserving the name, you can start packaging the application.


    > > NOTE

    As mentioned, if the name is truly important for the application, then you should
    first reserve the name and then start developing the application.


    # # Packaging an application


    The packaging step consists of creating a single container with all the files
    that make up your application. Before you start packaging, you should ensure that
    the application is feature-complete and contains no bugs or vulnerabilities.


    Compiling in Release mode store logo.png


    A finished Windows Store application is an application that needs no further changes
    to the code and has defined files for the various logos and the splash screen.
    In addition, you might also want to have some screenshots ready that help advertise
    the application in the Windows Store. Pay attention to the file: that will be
    your application’s icon in the Windows Store.'
  merge: -1
  pgno: 464
- img_proc: true
  md: 'When everything is ready, you first compile the application code in Release
    mode. When you compile an application, you usually choose between two modes; Debug
    (the default) and Release. Both modes produce a valid executable file; however,
    the Debug mode pads the executable file with extra information for debugging purposes.
    After your application is bug-free and feature-complete, there’s no longer need
    to keep the debug information. Compiling in Release mode gives you a more compact
    (and even slightly faster) executable that doesn’t include unnecessary internal
    debugging symbols.


    # Preparing the app package


    After you have an executable compiled in Release mode, you can proceed with the
    creation of an app package. You create an app package by clicking the Create App
    Packages item in the Store menu (see **Figure 14-10**).


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_465_0.png)


    Package creation requires several stages, during which Visual displays displays
    forms for you to fill out. The first form is shown in **Figure 14-11**. This form
    requires you to enter the name of the published'
  merge: -1
