  md: "photo of the flip view. To complete this part of the exercise, therefore, you\
    \ have two more steps to accomplish: find a way to persist the index of the last\
    \ photo visited in the flip view and give a richer template to the detail page.\n\
    \n# Persisting information across page navigation\n\nWhen you navigate from one\
    \ page to the next, the context of the application changes and existing controls\
    \ are dismissed. The flip view is then dismissed when you jump to the detail page,\
    \ and it is re-created when you return to the home page. The index of the photo\
    \ that was visible at the moment of navigation is lost. To fix things, you need\
    \ to accomplish three steps:\n\n+   1. Store the index of the currently visible\
    \ item in some store that survives the change of page.\n\n+   2. Instruct the\
    \ flip view to accept an extra parameter that indicates the starting item.\n\n\
    +   3. Retrieve the last-visited index from the store and pass it to the flip\
    \ view; if no index can be found, then tell the flip view to start from the first\
    \ item in the bound list of items.\n\nFor the first step, you go back to home.js\
    \ and add a line to the unload event handler.\n\n```\n(function () {\n  \"use\
    \ strict\";\n\n  WinJS.UI.Pages.define(\"/pages/home/home.html\", {\n    ready:\
    \ function (element, options) {\n      GalleryApp.init();\n    },\n    unload:\
    \ function () {\n      WinJS.Application.sessionState.currentPhotoIndex = GalleryApp.\n\
    \      getCurrentPhotoIndex();\n    }\n  });\n})();\n```"
  merge: -1
  pgno: 224
- img_proc: true
  md: 'The unload event handler responds to navigations away from the page. From within
    this event handler, you can save the index of the current photo to the application''s
    session state. The sessionState property of the WinJS.Application object is the
    system-provided container where developers should save any information that may
    be used to restore the application''s state after the application has been suspended
    and resumed. The sessionState object is a plain dictionary and can be shaped at
    will. In other words, if you need to add a custom property to the sessionState
    object, you just add it and go—as you did with currentPhotoIndex in the preceding
    code snippet.


    In this case, the application is not going to be suspended—the application is
    simply navigating to another page—but the sessionState is still working and, better
    yet, you end up having a flip view that can display its original state when resumed
    from suspension.


    > NOTE

    Application suspension hardly applies to applications running on a laptop or PC.
    It is a scenario that applies to applications running on mobile devices. For example,
    the application is suspended on a tablet when another application is run in the
    foreground or when the screen gets engaged.


    Let''s see how to instruct the flip view to retrieve information from the sessionState
    and how to start from a given item. You open gallery.js again and add the following
    lines at the end of the GalleryApp.init function.


    ```

    var startIndex = WinJS.Application.sessionState.currentPhotoIndex;

    flipView.currentPage = startIndex;

    ```


    If there''s no information saved to the sessionState, the startIndex variable
    is set to undefined. However, the FlipView component is smart enough to start
    anywhere from the first element the value set to its currentPage property is not
    a valid index.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Zooming the image and in out


    To complete the exercise, you now need to add some template and behavior to the
    detail page. The idea is to display the same image the user clicked in the flip
    view and enable some zoom capabilities.


    # Defining the template for the detail page


    First, you write some additional markup for the detail page. Open details.html
    and fill the SECTION element you find already in the body of the page with the
    following:


    ```

    <section aria-label="Main content" role="main">

    <img id="zoomable-image" src="#" alt="">

    data-win-bind="GalleryApp.DetailsPageModel.currentPhoto.imageUrl"

    </section>

    ```


    The same image you picked up in the flip view is now displayed in the detail page.
    As a user, how would you like to zoom on the image? This is a point that deserves
    some attention.


    On a classic PC application, a typical user would probably find it natural to
    click the image to zoom in and click with the right button to zoom out. A Windows
    Store application, though, is designed to be used on a PC as well as touch-enabled
    devices, such as a tablet. The ideal gesture to zoom for the user of a tablet
    would be "pinch-and-zoom." Implementing pinch-and-zoom is definitely possible
    in WinJS but is left to you. In addition, it wouldn''t solve the problem of zooming
    where a non-touch device is available. For the sake of simplicity, you can opt
    for yet another approach that works for both touch and non-touch devices.


    > NOTE

    WinJS provides the GestureRecognizer class to give you information about touch
    manipulations being performed by the user. You can use this class to know about
    the distance between start and final position of the fingers during a pinch movement.
    If the distance is positive you zoom in; otherwise you zoom out.'
  merge: -1
  pgno: 226
- img_proc: true
  md: "# Adding a slider to select the zoom level\n\nA trick to set a zoom level on\
    \ an image (but more general on any zoomable content) that works great on any\
    \ sort of device is using a slider. The slider, in fact, can be easily manipulated\
    \ through the mouse and through the finger. To add a slider to the detail page,\
    \ you need the following markup in details.html.\n\n```\n<section aria-label=\"\
    Main content\" role=\"main\">\n  <input id=\"zoom-slider\" type=\"range\"\n  \
    \  min=\"1\" max=\"5\" value=\"1\" step=\"0.1\"\n    onchange=\"GalleryApp.zoomImage()\
    \ />\n  <b>Zoom level: </b>\n  <span id=\"zoom-level\">-1</</span>\n  <div id=\"\
    zoomable-image-container\">\n    <img id=\"zoomable-image\" src=\"#\" alt=\"\"\
    \n      data-win-bind=\"src:GalleryApp.DetailsPageModel.currentPhoto.imageUrl\
    \ />\n  </div>\n</div>\n</section>\n```\n\nThe slider is given by an INPUT element\
    \ with the type attribute set to range. The min and max attributes indicate the\
    \ range of values the user can select via the control. The step attribute indicates\
    \ the step of increment or decrement. As you are using the slider to set a zoom\
    \ level, overall 1 and 5 form a good interval, and 0.1 as a step provides a pleasant\
    \ experience.\n\nBy default, the WinJS slider displays a tooltip to give visual\
    \ feedback of the value being set. For some reason, this forces you to use other\
    \ way to let the user know about the zoom level being set. At the same time, you\
    \ probably want to dismiss tooltips in total. It only requires a small edit in\
    \ details.css:\n\n```\n.details input[type=range]::--ms-tooltip {\n  display:\
    \ none;\n}\n```\n\nNote that the .details token in the style sheet expression\
    \ indicates that tooltips are suppressed only for slider components within an\
    \ element"
  merge: -1
  pgno: 227
- img_proc: true
  md: "marked with the details class. The details class is used to mark only the body\
    \ of the details.html page. You can cross-check this looking at the full source\
    \ code of the details.html page.\n\n# Manipulating the image\n\nThe slider features\
    \ a handler for the onclick event. Such a handler is required to give you a chance\
    \ to do some work whenever the selection on the slider changes. In particular,\
    \ you might want to update the text near the Zoom level label, and zoom the image\
    \ accordingly. The code required is added to the gallery.js file:\n\n```\nGalleryApp.image\
    \ = function () {\n  var container = document.getElementById(\"zoomable-image-container\"\
    );\n  var slider = document.getElementById(\"zoom-slider\");\n  var img = document.getElementById(\"\
    zoomable-image\");\n  var label = document.getElementById(\"zoom-level\");\n\n\
    \  // Do some calculation\n  var w = container.clientWidth;\n  var h = container.clientHeight;\n\
    \  var zoom = slider.value;\n  var offset = ((w * zoom) - w) / 2;\n\n  // Refresh\
    \ the user interface\n  img.style.left = zoom;\n  container.scrollLeft = offset;\n\
    \  container.scrollTop = offset;\n  label.innerHTML = zoom;\n}\n```\n\nThe zoomable\
    \ image lives in a DIV container, as styled below. The style should be added to\
    \ default.css.\n\n```\n#zoomable-image-container {\n  width: 250px;\n  height:\
    \ 250px;\n  border: solid 1px #fff;\n  position: relative;\n  overflow: scroll;\n\
    }\n```"
  merge: -1
  pgno: 228
- img_proc: true
  md: 'The value of the zoom level is saved to the zoom variable and used to calculate
    the offset for the container’s content. The offset is half the difference between
    the current width (and height) of the container and the effective size of the
    image with updated level of zoom. In general, you need to have both a horizontal
    and vertical offset. In this example, images are assumed to be square so you only
    need to calculate one offset. Figure 7-10 explains the logic behind the calculation.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_229_0.png)


    Figure 7-11 shows the final result of the exercise.'
  merge: -1
