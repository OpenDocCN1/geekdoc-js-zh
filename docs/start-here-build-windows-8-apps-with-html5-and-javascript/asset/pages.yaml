  md: '# # Acknowledgements


    Dino:


    I''ll be honest: Russell Jones, my editor at O’Reilly Media, convinced me to try
    this project. If the book is in your hands, both of the good and some of the bad
    are on him! When Russell first mentioned this book, when it was still just an
    idea, I first declined, making the point that I have never written a book for
    beginners.


    But then my son, Francesco (proud and efficient coauthor), made me look at the
    subject from a different perspective. It was one of those powerful forms of lateral
    thinking that only young people can sometimes contribute. Francesco said something
    like, “Dad, I don’t think you only admit experts to your software design or ASP.NET
    MVC classes. If I were a true expert, I’d probably rarely take a class; I need
    a class it is because I want someone to show me the way slowly and effectively.
    If I decide to invest money on a class I feel somehow that I’m a beginner. Why
    should this be different for a book?


    That message hit home; I found to be a valuable bit of wisdom; even coming from
    a 14-year-old boy.


    So with that change of heart, I embarked enthusiastically on this project and
    asked Francesco to cooperate, because he was perfect for testing the material—essentially
    eating the dog food we were cooking up! Francesco did a fantastic job. At one
    point, I was on a plane about to leave and talking on the phone, giving suggestions
    on how to improve the gallery of photos and the downloading of JSON data from
    Flickr. From the outside, that phone call was nothing more than a classic business
    phone call—the lastminute kind you make moments before the plane leaves the gate.
    But I was talking to my son! And, more importantly, he had diligently accomplished
    all the tasks by the time I got back. Thank you, Francesco!'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Francesco:


    I love technology and love the Microsoft software platform and tooling. In the
    beginning, for me, writing the book was primarily a way to get my hands on a Surface
    device. In the end, though, I spent most of the time working with the simulator
    and a secondary laptop.


    Dad told me that exploring a technology near its birth is usually quite difficult,
    because you can''t always rely on documentation or good examples being available.
    Frankly, to me that just sounded like one of those excuses that parents trot out
    when they''re unable to do something themselves. Not knowing it might be hard,
    I just rolled up my sleeves and worked out some examples. And in doing so, I was
    also able to contribute a list of points for Dad to expand on. I''m not sure this
