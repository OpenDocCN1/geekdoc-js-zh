    task when they use the application from a Microsoft Surface device.


    # Reworking the user interface of TodoList


    To preserve the current version of TodoList that uses file pickers and creates
    tasks all over the disk, let''s fork the project and create a fresh copy of it.
    You can copy the folder and name it differently—for example, Todolist-Local. To
    avoid confusion, you also change the title bar in default.html by replacing the
    H1 element with the following markup:


    ```

    <h1>To-D0 List (CH10-Local)</h1>

    ```


    The main trait of this new version is that you are not going to use file pickers
    anymore. Subsequently, you don''t need an Open button anymore; at the same time,
    you need a view where all current tasks are listed to be picked for further editing.
    In default.html, you add the following markup below the H1 element.


