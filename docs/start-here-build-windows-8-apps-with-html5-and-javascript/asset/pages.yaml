- img_proc: true
  md: "A CSS media query is a query expressed on some run-time conditions that instruct\
    \ the browser to pick up a particular CSS file. You can define a media query using\
    \ a LINK element (as discussed in Chapter 3) or by directly embedding it in the\
    \ CSS file. This is the standard approach followed by Windows Store applications.\n\
    \nEvery time a new project is created, the default.css file contains the following\
    \ CSS code:\n\n```\n@media screen and (-ms-view-state: fullscreen-landscape) {\n\
    }\n@media screen and (-ms-view-state: filled) {\n}\n@media screen and (-ms-view-state:\
    \ snapped) {\n}\n@media screen and (-ms-view-state: fullscreen-portrait) {\n}\n\
    ```\n\nThese are just predefined media queries for the four view states of a Windows\
    \ Store application. All you need to do is add CSS settings that you want to be\
    \ applied to each particular view state. For example, to shrink the font size\
    \ only when the application is snapped, you enter the following code to default.css:\n\
    \n```\n@media screen and (-ms-view-state: snapped) {\n  flexible-container {\n\
    \    font-size: 2em;\n  }\n}\n```\n\nYou basically overwrite any existing styles\
    \ with the values that apply in the specific scenario. You don't need to completely\
    \ rewrite the style; you just indicate what's different.\n\n# CSS media queries\
    \ vs. resize events\n\nIn the course of this chapter, you have learned two techniques\
    \ to deal with view changes—detecting resize events and CSS media queries. What's\
    \ the difference and when should each be used?"
  merge: -1
  pgno: 268
- img_proc: true
  md: 'CSS media queries are managed by the host browser and are limited to applying
    a different CSS style sheet to the application. If all you need is to change font
    sizes, adjust some fixed widths or heights you may still have, or fix margins
    and padding, then using CSS media queries is just fine and effective. Moreover,
    media queries also allow you to hide elements and move them around.


    There might be situations, instead, where you can''t just fix the application''s
    layout with the sole use of CSS. A common example is when you use a ListView to
    list items. In a view that is large enough, it is convenient opting for a multicolumn
    layout. When the application is snapped, instead, it is advisable that you switch
    to a single column layout. Because the ListView is a Windows 8 component, you
    need some JavaScript code to switch it accordingly. This can''t be done within
    a CSS file; an event handler is the only possible approach. By using events, you
    can also programmatically replace all (or in part) the layout of the application
    by selecting a different layout for each significant view state. (You''ll have
    an exercise that addresses this in just a moment.)


    # IMPORTANT


    > The bottom line is that CSS media queries should be your first option; and you
    should turn to events if CSS media queries are not enough. Having said that, though,
    it''s really hard to find a non-toy application that can manage view states without
    resorting (at some point) to events.


