    \ improve.\n\n# Detecting view state changes\n\nThe next step is adding more to\
    \ the SnapMe application to make it capable of detecting view state change and\
    \ reacting accordingly. For now, you will only record the new view state and display\
    \ it to the user via the currentViewState label.\n\nAny Windows Store application\
    \ using JavaScript and HTML receives notification of view state changes via the\
    \ on event on the window object. The event is fired whenever the window that hosts\
    \ the application is resized. In Windows 8, this can only happen when the device\
    \ is rotated and the orientation changes or one application is snapped or unsapped.\
    \ To receive the onresize event, you need to register a handler. The best place\
    \ to do so is the SnapMeApp.init function. Here's the final version of the function's\
    \ code:\n\n```\nSnapMeApp.init = function () {\n  window.onresize = addEventListener('resize',\
    \ SnapMeApp.onResize, false);\n\n  SnapMeApp.Current = new SnapMeState();\n  var\
    \ buttonCounter = document.getElementById(\"buttonCounter\");\n  buttonCounter.addEventListener(\"\
    click\", SnapMeApp.add);\n```"
