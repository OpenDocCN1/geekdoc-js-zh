- img_proc: true
  md: '# Registering as a developer of paid applications


    Figure 14-6 shows the final screen you see after you have successfully completed
    the registration process. At this point, you’re all set to start publishing free
    applications. If you intend to publish paid applications, however, you’ll need
    to complete some extra steps.


    ![](img/d62e4a5ec04f518a61f032ca9cb73f7e_460_0.png)


    Figure 14-5. The checkout screen.'
  merge: -1
  pgno: 460
- img_proc: true
  md: '![](img/d62e4a5ec04f518a61f032ca9cb73f7e_461_0.png)


    From the Microsoft perspective, the fundamental difference between free and paid
    user applications is that in the latter case, Microsoft needs to pay you when
    people buy your applications. Consequently, before your app can be published to
    the store, Microsoft needs to make sure it knows how to pay you later.


    You must provide two separate blocks of information: bank details, so that money
    can be safely wired to you, and tax information, to satisfy internal revenue service
    (IRS) reporting requirements. The banking information may vary depending on the
    country you live in, but most of the time it requires only an international bank
    code and an alphanumeric string (the IBAN string) that identifies your account.


    As far taxes are concerned, you may need to fill out an electronic form, which
    is different for US residents and non-US residents. The details of this step may
    vary from country to country, but for the most part there should be no need to
    mail paper documents. Dealing with taxes and banks is usually an annoying procedure,
    but in this case it doesn''t take too long—and hopefully happens only once. For
    more information, you can refer to the instructions at the following link: http://bit.ly/PrOrbW.'
  merge: -1
