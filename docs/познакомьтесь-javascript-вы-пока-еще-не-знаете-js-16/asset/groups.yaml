- md: "\n# Web Assembly (WASM)\n\nOne dominating concern that has driven a significant\
    \ amount of JS's evolution is performance, both how quickly JS can be parsed/compiled\
    \ and how quickly that compiled code can be executed.\n\n2013, engineers from\
    \ Mozilla Firefox demonstrated a port of the Unreal 3 game engine from C to JS.\
    \ The ability for this code to run in a browser JS engine at full 60fps performance\
    \ was predicated on a set of optimizations that the JS version of the Unreal engine's\
    \ code used a style of code that favored a subset of the JS language, named \"\
    ASM.js\".\n\nThis subset is valid JS written in ways that are somewhat uncommon\
    \ in normal coding, but which signal certain important typing information to the\
    \ engine that allow it to make key optimizations. ASM.js was introduced as one\
    \ way of addressing the pressures on the runtime performance of JS.\n\nBut it's\
    \ important to note that ASM.js was never intended to be code that was authored\
    \ by developers, but rather a representation of a program having been transpiled\
    \ from another language (such as C), where these typing “annotations” were inserted\
    \ automatically by the tooling.\n\nSeveral years after ASM.js demonstrated the\
    \ validity of tool-creating versions of programs that can be processed more efficiently\
    \ by the JS engine, another group of engineers (also, initially, from Mozilla)\
    \ released Web Assembly (WASM).\n\nWASM is similar to ASM.js in that its original\
    \ intent was to provide a path for non-JS programs (C, etc.) to be converted to\
    \ a form that could run in the JS engine. Unlike ASM.js, WASM chose to additionally\
    \ get around some of the inherent delays in JS parsing/compilation before a program\
    \ can execute, by representing the program in a form that is entirely unlike JS.\n\
    \nWASM is a representation format more akin to Assembly (hence, its name) that\
    \ can be processed by a JS engine by skipping the parsing/compilation that the\
    \ JS engine normally does. The parsing/compilation of a WASM-targeted program\
    \ happen ahead of time (AOT); what's distributed is a binary-packed program ready\
    \ for the JS engine to execute with very minimal overhead.\n\nAn initial motivation\
    \ for WASM was clearly the potential performance improvements. While that continues\
    \ to be a focus, WASM is additionally motivated by the desire to bring more parity\
    \ for non-JS languages to the web platform. For example, if a language like Go\
    \ supports threaded programming, but JS (the language) does not, WASM offers the\
    \ potential for such a Go program to be converted to a form the JS engine can\
    \ understand, without needing a threads feature in the JS language itself.\n\n\
    In other words, WASM relieves the pressure to add features to JS that are mostly/exclusively\
    \ intended to be used by transpiled programs from other languages. That means\
    \ JS feature development can be judged (by TC39) without being skewed by interests/demands\
    \ in other language ecosystems, while still letting those languages have a viable\
    \ path into the web.\n\nAnother perspective on WASM that's emerging, interestingly,\
    \ not even directly related to the web (W). WASM is evolving to become a cross-platform\
    \ virtual machine (VM) of sorts, where programs can be compiled once and run in\
    \ a variety of different system environments.\n\nSo, WASM isn't only for the web,\
    \ and WASM also isn't JS.\n\nIronically, even though WASM runs in the JS engine,\
    \ the JS language is one of the least suitable languages to source WASM programs\
    \ with, because WASM relies heavily on static typing information. Even TypeScript\
    \ (TS)—ostensibly, static types—is not quite suitable (as it stands) to transpile\
    \ to WASM, though language variants like AssemblyScript are attempting to bridge\
    \ the gap between JS/TS and WASM.\n\nThis book is not about WASM, so I won't spend\
    \ much more time discussing it, except to make one final point. Some folks have\
    \ suggested WASM points to a future where JS is excised from, or minimized, in\
    \ the web. These folks often harbor ill feelings about JS, and want some other\
    \ language—any other language!—to replace it. Since WASM lets other languages\
    \ run in the JS engine, on its face this isn't an entirely fanciful fairytale.\n\
    \nLet me just state simply: WASM will not replace JS. WASM significantly augments\
    \ what the web (including JS) can accomplish. That's a great thing, entirely orthogonal\
    \ to whether some people will use it as an escape hatch from having to write JS.\n\
    \n# Strictly Speaking\n\nBack in 2009 with the release of ES5, JS added strict\
    \ mode as an opt-in mechanism for encouraging better JS programs.\n\nThe benefits\
    \ of strict mode far outweigh the costs, but old habits die hard and the inertia\
    \ of existing (aka \"legacy\") code bases are really hard to shift. So sadly,\
    \ more than 10 years later, strict mode's optionality means that it's still not\
    \ necessarily the default for JS programmers.\n\nWhy strict mode? Strict mode\
    \ shouldn't be thought of as a restriction on what you can't do, but rather as\
    \ a guide to the best way to do so that the JS engine has the best chance of optimizing\
    \ and efficiently running the code. Most JS code is worked on by teams of developers,\
    \ so the strictness of strict mode (along with tooling like linters!) often helps\
    \ collaboration on code by avoiding some of the more problematic mistakes that\
    \ slip by in non-strict mode.\n\nMost strict mode controls are in the form of\
    \ early errors, meaning errors that aren't strictly syntax errors but are still\
