  - '[PAGE 88]


    # Chapter 3: Digging to the Roots of JS


    If you''ve read Chapters 1 and 2, and taken the time to digest and percolate,
    you''re hopefully starting to get JS a little more. If you skipped/skimmed them
    (especially Chapter 2), I recommend going back to spend some more time with that
    material.


    In Chapter 2, we surveyed syntax, patterns, and behaviors at a high level. In
    this chapter, our attention shifts to some of the lower-level root characteristics
    of JS that underpin virtually every line of code we write.


    Be aware: this chapter digs much deeper than you''re likely used to thinking about
    a programming language. My goal is to help you appreciate the core of how JS works,
    what makes it tick. This chapter should begin to answer some of the “Why?” questions
    that may be cropping up as you explore JS. However, this material is still not
    an exhaustive exposition of the language; that''s the rest of the book series
    is for! Our goal here is still just to get started, and become comfortable with,
    the feel of JS, how it ebbs and flows.


    Don''t run so quickly through this material that you get lost in the weeds. As
    I''ve said a dozen times already, take your time. Even still, you''ll probably
    finish this chapter with remaining questions. That''s OK, because there''s a whole
    book series ahead of you to keep exploring!'
- md: "\n# Iteration\n\nSince programs are essentially built to process data (and\
    \ make decisions on that data), the patterns used to step through the data have\
    \ a big impact on the program’s readability.\n\nThe iterator pattern has been\
    \ around for decades, and suggests a “standardized” approach to consuming data\
    \ from a source one chunk at a time. The idea is that it’s more common and helpful\
    \ to iterate the data source—to progressively handle the collection of data by\
    \ processing the first part, then the next, and so on, rather than handling the\
    \ entire set all at once.\n\nImagine a data structure that represents a relational\
    \ database SELECT query, which typically organizes the results as rows. If this\
    \ query had only one or a couple of rows, you could handle the entire result set\
    \ at once, and assign each row to a local variable, and perform whatever operations\
    \ on that data that were appropriate.\n\nBut if the query has 100 or 1,000 (or\
    \ more!) rows, you’ll need iterative processing to deal with this data (typically,\
    \ a loop).\n\nThe iterator pattern defines a data structure called an “iterator”\
    \ that has a reference to an underlying data source (like the query result rows),\
    \ which exposes a method like next(). Calling next() returns the next piece of\
    \ data (i.e., a “record” or “row” from a database query).\n\nYou don’t always\
    \ know how many pieces of data that you will need to iterate through, so the pattern\
    \ indicates completion by some special value or exception once you iterate through\
    \ the entire set and go past the end.\n\nThe importance of the iterator pattern\
    \ is in adhering to a standard way of processing data iteratively, which creates\
    \ cleaner and easier to understand code, as opposed to having every data structure/source\
    \ define its own custom way of handling its data.\n\nAfter many years of various\
    \ JS community efforts around mutually agreed-upon iteration techniques, ES6 standardized\
    \ a specific protocol for the iterator pattern directly in the language. The protocol\
    \ defines a next() whose return is an object called an iterator result; the object\
    \ has value and done properties, where done is a boolean that is false until iteration\
    \ over the underlying data source is complete.\n\n## Consuming Iterators\n\nWith\
    \ the ES6 iteration protocol in place, it's workable to consume a data source\
    \ one value at a time, checking after each next() call for done to be true.\n\n\
    One common way to consume an iterator is using the for...of loop. This loop automatically\
    \ handles calling next() and checking for the done property:\n\n```javascript\n\
    const numbers = [10, 20, 30];\nfor (const number of numbers) {\n  console.log(number);\n\
    }\n```\n\nAnother common way is to use the spread operator (...) to convert an\
    \ iterable into an array:\n\n```javascript\nconst numbers = [10, 20, 30];\nconst\
    \ array = [...numbers];\nconsole.log(array);\n```\n\nFinally, you can use Array.from()\
    \ to convert an iterable into an array:\n\n```javascript\nconst numbers = [10,\
    \ 20, 30];\nconst array = Array.from(numbers);\nconsole.log(array);\n```\n\nIn\
    \ some cases, you might manually iterate over an iterator by calling next() directly:\n\
    \n```javascript\nconst numbers = [10, 20, 30];\nconst iterator = numbers[Symbol.iterator]();\n\
    \nlet result = iterator.next();\nwhile (!result.done) {\n  console.log(result.value);\n\
    \  result = iterator.next();\n}\n```\n\nWhile these methods are convenient ways\
    \ to consume iterators, it's important to understand how they work under the hood.\
    \ This will help you when you need to create your own iterables and iterators.\n\
    \n## Iterables\n\nAn iterable is any object that can be iterated over. This means\
    \ the object has a method with the key Symbol.iterator, which returns an iterator\
    \ object.\n\nCommon iterables in JS include:\n\n- Arrays\n- Sets\n- Maps\n- Strings\n\
    - NodeLists (in the browser)\n\nAn iterator is an object that has a next() method.\
    \ The next() method returns an object with two properties: value (the current\
    \ value) and done (a boolean).\n\nHere is an example of how to create a custom\
    \ iterable:\n\n```javascript\nconst myIterable = {\n  [Symbol.iterator]: function()\
    \ {\n    let count = 0;\n    return {\n      next: function() {\n        if (count\
    \ < 3) {\n          return { value: count++, done: false };\n        } else {\n\
    \          return { done: true };\n        }\n      }\n    };\n  }\n};\n\nfor\
    \ (const value of myIterable) {\n  console.log(value);\n}\n```\n\n## Custom Iterators\n\
    \nYou can also create a custom iterator without creating a full iterable. An iterator\
    \ is just an object with a next() method.\n\n```javascript\nconst myIterator =\
    \ {\n  count: 0,\n  next: function() {\n    if (this.count < 3) {\n      return\
    \ { value: this.count++, done: false };\n    } else {\n      return { done: true\
    \ };\n    }\n  }\n};\n\nconsole.log(myIterator.next().value); // 0\nconsole.log(myIterator.next().value);\
    \ // 1\nconsole.log(myIterator.next().value); // 2\nconsole.log(myIterator.next().done);\
    \ // true\n```\n"
  mdcn: "\n\n# 迭代\n\n由于程序本质上是为了处理数据（并对这些数据做出决策），因此用于步进数据的模式对程序的可读性有很大影响。\n\n迭代器模式（iterator\
    \ pattern）已经存在了几十年，它提出了一种从源头逐块消费数据的“标准化”方法。这种方法的理念是：迭代数据源更为常见且有用——即通过处理第一部分、然后是后续，依此类推，来逐步处理数据集合，而不是一次性处理整个集合。\n\
    \n想象一个表示关系型数据库 SELECT 查询的数据结构，它通常将结果组织为行。如果该查询只有一行或几行，你可以一次性处理整个结果集，并将每行分配给局部变量，并对这些数据执行任何适当的操作。\n\
    \n但如果该查询有 100 行或 1,000 行（甚至更多！），你就需要迭代处理来处理这些数据（通常通过循环）。\n\n迭代器模式定义了一种名为“迭代器”的数据结构，它包含对底层数据源（如查询结果行）的引用，并暴露了一个类似\
    \ `next()` 的方法。调用 `next()` 会返回下一条数据（即数据库查询中的“记录”或“行”）。\n\n你并不总是知道需要迭代多少条数据，因此一旦你遍历了整个集合并越过末尾，该模式会通过某个特殊值或异常来指示完成。\n\
    \n迭代器模式的重要性在于遵循了迭代处理数据的标准方式，这可以创建出更整洁、更易理解的代码，而不是让每个数据结构/源都定义自己处理其数据的自定义方式。\n\n\
    在 JS 社区多年对共同认可的迭代技术进行各种努力后，ES6 直接在语言中标准化了迭代器模式的特定协议。该协议定义了 `next()`，其返回一个名为“迭代器结果”（iterator\
    \ result）的对象；该对象具有 `value` 和 `done` 属性，其中 `done` 是一个布尔值，在底层数据源的迭代完成之前，它为 `false`。\n\
    \n## 消费迭代器\n\n随着 ES6 迭代协议的建立，一次处理一个数据源的值是可行的，只需在每次调用 `next()` 之后检查 `done` 是否为\
    \ `true`。\n\n消费迭代器的一种常用方法是使用 `for...of` 循环。该循环会自动处理 `next()` 的调用以及对 `done` 属性的检查：\n\
    \n```javascript\nconst numbers = [10, 20, 30];\nfor (const number of numbers)\
    \ {\n  console.log(number);\n}\n```\n\n另一种常用方法是使用展开运算符 `......` 将可迭代对象转换为数组：\n\
    \n```javascript\nconst numbers = [10, 20, 30];\nconst array = [...numbers];\n\
