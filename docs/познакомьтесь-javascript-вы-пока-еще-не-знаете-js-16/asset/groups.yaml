    \ `new` 关键字）。\n\n## 第二章：JS 概览（续）\n\n考虑：\n\n```javascript\nclass Page {\n  constructor(text)\
    \ {\n    this.text = text;\n  }\n\n  print() {\n    console.log(this.text);\n\
    \  }\n}\n```\n\n```javascript\nclass Notebook {\n  constructor() {\n    this.pages\
    \ = [];\n  }\n\n  addPage(text) {\n    var page = new Page(text);\n    this.pages.push(page);\n\
    \  }\n\n  print() {\n    for (let page of this.pages) {\n      page.print();\n\
    \    }\n  }\n}\n```\n\n```javascript\nvar mathNotes = new Notebook();\nmathNotes.addPage(\"\
    Arithmetic: + - / ...\");\nmathNotes.addPage(\"Trigonometry: sin cos tan ...\"\
    );\n\nmathNotes.print();\n```\n\n在 `Page` 类中，数据是存储在 `this.text` 成员属性中的字符串文本。行为是\
    \ `print()`，一个将文本打印到控制台的方法。\n\n对于 `Notebook` 类，数据是 `Page` 实例的数组。行为是 `addPage(..)`，一个实例化新的\
    \ `Page` 页面并将其添加到列表的方法，以及 `print()`（它打印笔记本中的所有页面）。\n\n语句 `mathNotes = new Notebook()`\
    \ 创建了 `Notebook` 类的实例，而 `page = new Page(text)` 则是创建 `Page` 类实例的地方。\n\n行为（方法）只能在实例上调用（而不是在类本身上），例如\
    \ `mathNotes.addPage(..)` 和 `page.print()`。\n\n类允许将数据（文本和页面）封装在一起，与其它们的行为（例如 `addPage(..)`）和\
    \ `print()` 共同组织。同一个程序可以在没有任何类定义的情况下构建，但它可能没那么组织化、更难阅读和推理，并且更容易出现 bug 和维护性差。\n\
    \n## 类继承\n\n传统“面向类”设计中固有的另一个方面（尽管在 JS 中用得较少）是“继承”（以及“多态性”）。考虑：\n\n```javascript\n\
    class Publication {\n  constructor(title,author,pubDate) {\n    this.title = title;\n\
