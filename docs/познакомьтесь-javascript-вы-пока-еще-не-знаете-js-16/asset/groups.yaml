  - '[PAGE 44]


    JS source code is parsed before it is executed. The specification requires as
    much, because it calls for “early errors”—statically determined errors in code,
    such as a duplicate parameter name—to be reported before the code starts executing.
    Those errors cannot be recognized without the code having been parsed.


    So JS is a parsed language, but is it compiled?


    The answer is closer to yes than no. The parsed JS is converted to an optimized
    (binary) form, and that “code” is subsequently executed (Figure 2); the engine
    does not commonly switch back into line-by-line execution (like Figure 1) mode
    after it has finished all the hard work of parsing—most languages/engines wouldn’t,
    because that would be highly inefficient.


    To be specific, this “compilation” produces a binary code (of sorts), which is
    then handed to the “JS virtual machine” to execute. Some like to say this VM is
    “interpreting” the byte code. But then means Java, and a dozen other JVM-driven
    languages, for that matter, are interpreted rather than compiled. Of course, that
    contradicts the typical assertion that Java/etc/etc are compiled languages.


    Interestingly, while Java and JavaScript are very different languages, the question
    of interpreted/compiled is pretty closely related between them!


    Another wrinkle is that JS engines can employ multiple passes of JIT (Just-In-Time)
    processing/optimization on the generated code (post parsing), which again could
    reasonably be labeled either “compilation” or “interpretation” depending on perspective.
    It’s actually a fantastically complex situation under the hood of a JS engine.'
