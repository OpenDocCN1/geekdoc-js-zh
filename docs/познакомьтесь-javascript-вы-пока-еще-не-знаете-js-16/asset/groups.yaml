    \ {\n    count = count + step;\n    return count;\n  };\n}\n```\n\n```\nvar incBy1\
    \ = counter(1);\nvar incBy3 = counter(3);\n```\n\n```\nincBy1(); // 1\nincBy1();\
    \ // 2\n```\n\n```\nincBy3(); // 3\nincBy3(); // 6\nincBy3(); // 9\n```\n\nEach\
    \ instance of the inner increaseCount() function is closed over both the count\
