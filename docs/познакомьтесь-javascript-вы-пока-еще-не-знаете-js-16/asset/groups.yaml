    # Comparisons


    Making decisions in programs requires comparing values to determine their identity
    and relationship to each other. JS has several mechanisms to enable value comparison,
    so let’s take a closer look at them.


    # Equal...ish


    The most common comparison in JS programs asks the question, “Is this X value
    the same as that Y value?” What exactly does “the same as” really mean to JS,
    though?


    For ergonomic and historical reasons, the meaning is more complicated than the
    obvious exact identity of matching. Sometimes an equality comparison intends exact
    matching, but other times the desired comparison is a bit broader, allowing closely
    similar or interchangeable matching. In other words, we must be aware of the nuanced
    differences between an equality comparison and an equivalence comparison.


    If you’ve spent any time working with and reading about JS, you’ve certainly seen
    the so-called “triple-equals ====='
  - '[PAGE 68]


    operator, also described as the “strict equality” operator. That seems rather
    straightforward, right? Surely, “strict” means strict, as in narrow and exact.


    Not exactly.


    Yes, most values participating in an === equality comparison will fit with that
    exact same intuition. Consider some examples:


    ```

    3 === 3.0;          // true

    "yes" === "yes"; // true

    null === null;      // true

    false === false;    // true


    42 === "42";       // false

    "hello" === "Hello"; // false

    true === 1;         // false

    0 === null;         // false

    "" === null;      // false

    null === undefined; // false

    ```


    # Note


    > Another way ===''s equality comparison is often described as, “checking both
    the value and the type”. In several of the examples we''ve looked at so far, like
    42 === "42", the type of both values (number, string, etc.) does seem to be the
    distinguishing factor. There''s more to it than that, though. All value comparisons
    in JS consider the type of the values being compared, not just the === operator.
    Specifically, === allows any sort of type conversion (aka, "coercion") in its
    comparison, where other JS comparisons do allow coercion.


    You Don''t Know JS Yet: Get Started'
  - '[PAGE 69]


    The === operator does have some nuance to it, a fact many JS developers gloss
    over, to their detriment. The === operator is designed to lie in two cases of
    special values: NaN and -0. Consider:


    ```

    NaN === NaN;           // false

    0 === -0;                // true

    ```


    In the case of NaN, the === operator lies and says that an occurrence of NaN is
    not equal to NaN. In the case of -0 (yes, this is a real, distinct value you can
    use intentionally in your programs!), the === operator lies and says it''s equal
    to the regular 0 value.


    Since the lying about can be bothersome, it''s best to avoid using === for them.
    For NaN comparisons, use the Number.isNaN(..) utility, which does not lie. For
    -0 comparison, use the Object.is(..) utility, which also does not lie. Object.is(...)
    can also be used for non-lying checks, if you prefer. Humorously, you could think
    of Object.is(...) as the "quadruple-equals" ===, the really-really-strict comparison!


    There are deeper historical and technical reasons for these lies, but that doesn''t
    change the fact that === is not actually strictly equal comparison, in the strictest
    sense.


    The story gets even more complicated when we consider comparisons of object values
    (non-primitives). Consider:


    ```

    [ 1, 2, 3 ] === [ 1, 2, 3 ]; // false

    { a: 42 } === { a: 42 }     // false

    (x => x * 2) === (x => x * 2)   // false

    ```


    What''s going on here?'
  - '[PAGE 70]


    It may seem reasonable to assume that an equality check considers the nature or
    contents of the value; after all, 42 === 42 considers the actual 42 value and
    compares it. But when it comes to objects, a content-aware comparison is generally
    referred to as "structural equality."


    JS does not define === as structural equality for object values. === uses identity
    equality for object values.


    In JS, all object values are held by reference (see “Values vs Reference in Appendix
    A), are assigned and passed by reference-copy, and to our current discussion,
    are compared by reference (identity) equality. Consider:


    ```

    var x = [ 1, 2, 3 ];

    ```


    ```

    // assignment is by reference-copy, so

    // y references the *same* array as x,

    // not another copy of it.

    var y = x;

    ```


    ```

    y === x; // true

    y === [ 1, 2, 3 ]; // false

    x === [ 1, 2, 3 ]; // false

    ```


    In this snippet, === x is true because both variables hold a reference to the
    same initial array. But the === [1,2,3] comparisons both fail because y and x,
    respectively, are being compared to new different arrays [1,2,3]. The array structure
    and contents do not matter in this comparison, only the reference identity.


    JS does not provide a mechanism for structural equality comparison of object values,
    only reference identity comparison. To do structural equality comparison, you''ll
    need to implement the checks yourself.'
  - '[PAGE 71]


    But beware, it’s more complicated than you’ll assume. For example, how might you
    determine if two function references are “structurally equivalent”? Even stringifying
    to compare their source code text wouldn’t take into account things like closure.
    JS doesn’t provide structural equality comparison because it’s almost intractable
    to handle all the corner cases!


    # Coercive Comparisons


    Coercion means a value of one type being converted to its respective representation
    in another type (to whatever extent possible). As we''ll discuss in Chapter 4,
    coercion is a core pillar of the JS language, not some optional feature that can
    reasonably be avoided.


    But where coercion meets comparison operators (like equality), confusion and frustration
    unfortunately crop up more than not.


    Few JS features draw more ire in the broader JS community than the == operator,
    generally referred to as the “loose equality” operator. The majority of all writing
    and public discourse condemns this operator as poorly designed and dangerous/bug-ridden
    when used in JS programs. The creator of the language himself, Brendan Eich, has
    lamented how it was designed as a big mistake.


    From what I can tell, most of this frustration comes from a pretty short list
    of confusing cases, but a deeper problem is the extremely widespread misconception
    that it performs its comparisons without considering the types of its compared
    values.


    The == operator performs an equality comparison similarly to how the === performs
    it. In fact, both operators consider the'
  - '[PAGE 72]


    type of the values being compared. And if the comparison is between the same value
    type, both == and === do exactly the same thing, no difference whatsoever.


    If the value types being compared are different, the == differs from === in that
