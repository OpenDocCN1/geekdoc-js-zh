    [content]

    Because, as I found out myself, you probably don’t know JavaScript (yet).


    ~~


    Brian Holt

    Senior Program Manager

    Visual Studio Code and Node.js on Azure

    Microsoft


    # Preface


    Welcome to the 2nd edition of the widely acclaimed You Don’t Know JS (YDKJS) book
    series: You Don’t Know JS Yet (YDKJSY).


    If you''ve read any of the 1st edition books, you can expect a refreshed approach
    in these new ones, with plenty of updated coverage of what’s changed in JS over
    the last five years. But what I hope and believe you''ll still get is the same
    commitment to respecting JS and digging into what really makes it tick.


    If this is your first time reading these books, I’m glad you’re here. Prepare
    for a deep and extensive journey into all the corners of JavaScript.


    If you are new to programming or JS, be aware that these books are not intended
    as a gentle “intro to JavaScript.” This material is, at times, complex and challenging,
    and goes much deeper than is typical for a first-time learner. You''re welcome
    here no matter what your background is, but these books are written assuming you''re
    already comfortable with JS and have at least 6–9 months experience with it.


    # The Parts


    These books approach JavaScript intentionally opposite of how The Good Parts treats
    the language. No, that doesn’t mean we''re looking at the bad parts, but rather,
    exploring all the parts.


    You may have been told, or felt yourself, that JS is a deeply flawed language
    that was poorly designed and inconsistently implemented. Many have asserted that
    it''s the worst most popular language in the world; that nobody writes JS because
    they want to, only because they have to given it place at the center of the web.
    That''s a ridiculous, unhealthy, and wholly condescending claim.


    Millions of developers write JavaScript every day, and many of them appreciate
    and respect the language.


    Like any great language, it has its brilliant parts as well as its scars. Even
    the creator of JavaScript himself, Brendan Eich, laments some of those parts as
    mistakes. But he''s wrong: they weren''t mistakes at all. JS is what it is today—the
    world''s most ubiquitous and most influential programming language—precisely because
    of all parts.


    Don''t buy the lie that you should only learn and use a small collection of good
    parts while avoiding all the bad stuff. Don''t buy the "X is the new Y" snake
    oil, that some new feature of the language instantly relegates all usage of a
    previous feature as obsolete and ignorant. Don''t listen when someone says your
    code isn''t "modern" because it isn''t yet using a stage-0 feature that was only
    proposed a few weeks ago!


    Every part of JS is useful. Some parts are more useful than others. Some parts
    require you to be more careful and intentional.


    I find it absurd to try to be a truly effective JavaScript developer while only
    using a small sliver of what the language has to offer. Can you imagine a construction
    worker with a toolbox full of tools, who only uses their hammer and scoffs at
    the screwdriver or tape measure as inferior. That''s just silly. My unreserved
    claim is that you should go about learning all parts of JavaScript, and where
    appropriate, use them! And if I may be so bold as to suggest: it''s time to discard
    any JS books that tell you otherwise.


    # The Title


    So what''s the title of the series all about?


    I''m not trying to insult you with criticism about your current lack of knowledge
    or understanding of JavaScript. I''m not suggesting you can''t or won''t be able
    to learn JavaScript. I''m not boasting about secret advanced insider wisdom that
    I and only a few possess.


    Seriously, all those were real reactions to the original series title before folks
    read the books. And they are baseless.


    The primary point of the title "You Don''t Know JS Yet" is to point out that most
    JS developers don''t take the time to really understand how the code that they
    write works. They know that it works—that it produces a desired outcome. But they
    either don''t understand exactly how, or worse, they have an inaccurate mental
    model for the how it falters on closer scrutiny.


    I''m presenting a gentle but earnest challenge to the reader, to set aside the
    assumptions you have about JS, and approach it with fresh eyes and an invigorated
    curiosity that leads you to ask why for every line of code you write. Why does
    it do what it does? Why is one way better or more appropriate than the other half-dozen
    ways you could have accomplished it?


    Why do all the “popular kids” say to do X with your code, but it turns out that
    Y might be a better choice?


    I added “Yet” to the title, not only because it’s the second edition, but because
    ultimately I want these books to challenge you in a hopeful rather than discouraging
    way.


    But let me be clear: I don’t think it’s possible to fully know JS. That’s not
    an achievement to be obtained, but a goal to strive after. You don’t finish knowing
    everything about JS, you just keep learning more and as you spend more time with
    the language. And the deeper you go, the more you revisit what you knew before,
    and you re-learn it from that more experienced perspective.


    I encourage you to adopt a mindset around JavaScript, and indeed all of software
    development, that you will never fully mastered it, but that you and should keep
    working to get closer to that end, a journey that will stretch the entirety of
    your software development career, and beyond.


    You can always know JS better than you currently do. That’s what I hope these
    YDKJSY books represent.


    # The Mission


    The case doesn’t really need to be made for why developers should take JS seriously—I
    think it’s already more than proven worthy of first-class status among the world’s
    programming languages.


    But a different, more important case still needs to be made, and these books rise
    to that challenge.


    I’ve taught more than 5,000 developers from teams and companies all over the world,
    in more than 25 countries on six continents. And what I''ve seen is that far too
    often, counts is generally just the result of the program, not how the program
    is written or how/why it works.


    My experience not only as a developer but in teaching many other developers tells
    me: you will always be more effective in your development work if you more completely
    understand how your code works than you are solely just getting it to produce
    a desired outcome. In other words, good enough to work is not, and should not
    be. All developers regularly struggle with some piece of code not working, and
    they can''t figure out why. But far too often, JS developers will blame this on
    the language rather than admitting their understanding is falling short. My mission
    with YDKJSY is to empower every single developer to fully own the code they write.


    # The Path


    Some of you have started this book with the goal of completing all six books,
    back to back. I would like to caution you to consider changing that plan.


    It is not my intention that YDKJSY be read straight through. The material in these
    books is dense, because JavaScript is powerful, sophisticated, and in parts complex.
    Nobody can really hope to download all this information into their brains in a
    single pass and retain any significant amount of it.


    My suggestion is you take your time going through YDKJSY. Take one chapter, read
    it completely through start to finish, and then go back and re-read it by section.
    Stop in between each section and practice the code or ideas from that section.
    For larger concepts, it probably is a good idea to expect to spend several days
    digesting, re-reading, practicing, then digesting more.


    You could spend a week or two on each chapter, a month or two on each book, and
    a year or more on the whole series, and you would still not be squeezing every
    ounce of YDKJSY out.


    Don’t binge these books; be patient and spread out your reading. Interleave reading
    with lots of practice on real code in your job or on projects you participate
    in. Wrestle with the opinions I’ve presented along the way, debate with others,
    and most of all, disagree with me! Run a study group or book club. Write blog
    posts on what you’ve learned. Speak about these topics at local JS meetings.


    It’s never my goal to convince you to agree with my opinion, but to encourage
    you to own and be able to defend your opinions. You can’t *get there* with an
    expedient read-through of these books. That’s something that takes a long while
    to emerge, little by little, as you study and ponder and re-visit.


    These books are meant to be a field-guide on your wanderings through JavaScript,
    from wherever you currently are with the language, to a place of deeper understanding.
    And the deeper you understand JS, the more questions you will ask and the more
    you will have to explore! That’s what I find so exciting!

    [/content]

