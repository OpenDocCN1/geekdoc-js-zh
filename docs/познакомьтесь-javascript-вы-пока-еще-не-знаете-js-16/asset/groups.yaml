    a compiled program? The majority opinion seems to be that JS is an interpreted
    (scripting) language. But the truth is more complicated than that.


    For much of the history of programming languages, "interpreted" languages and
    "scripting" languages have been looked down as inferior compared to their compiled
    counterparts. The reasons for this acrimony are numerous, including the perception
    that there is a lack of performance optimization, as well as dislike of certain
    language characteristics, such as scripting languages generally using dynamic
    typing instead of the "more mature" statically typed languages.


