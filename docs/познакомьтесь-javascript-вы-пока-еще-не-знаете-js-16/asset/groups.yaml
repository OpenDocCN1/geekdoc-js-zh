    // \"Math\"\n```\n\n```javascript\nhomework.topic;\n// \"JS\" -- 不是 \"Math\"\n\
    ```\n\n对 `topic` 的赋值直接在 `otherHomework` 上创建了一个同名的属性；这对 `homework` 上的 `topic` 属性没有影响。接下来的语句访问了\
    \ `otherHomework.topic`，我们从该新属性得到了非委托的答案：“Math”。\n\n图 5 显示了赋值创建 `otherHomework.topic`\
