    # Appendix A: Exploring Further


    In this appendix, we''re going to explore some topics from the main chapter text
    in a bit more detail. Think of this content as an optional preview of some of
    the more nuanced details covered throughout the rest of the book series.


    # Values vs. References


    In Chapter 2, we introduced the two main types of values: primitives and objects.
    But we didn''t discuss yet one key difference between the two: how these values
    are assigned and passed around.


    In many languages, the developer can choose between assigning/passing a value
    as the value itself, or as a reference to the value. In JS, however, this decision
    is entirely determined by the kind of value. That surprises a lot of developers
    from other languages when they start using JS.


    If you assign/pass a value itself, the value is copied. For example:


    ```

    var myName = "Kyle";

    ```


    ```

    var yourName = myName;

    ```'
  - '[PAGE 121]


    Here, the your variable has a separate copy of the "Kyle" string from the value
    that''s stored in myName. That''s because the value is a primitive, and primitive
    values are always assigned passed as value copies.


    Here''s how you can prove there''s two separate values involved:


    ```

    var myName = "Kyle";

    var yourName = myName;


    myName = "Frank";


    console.log(myName);

    // Frank


    console.log(yourName);

    // Kyle

    ```


    See how yourName wasn''t affected by the re-assignment of myName to "Frank" That''s
    because each variable holds its own copy of the value.


    By contrast, references are the idea that two or more variables are pointing at
    the same value, such that modifying this shared value would be reflected by an
    access via any of those references. In JS, only object values (arrays, objects,
    functions, etc.) are treated as references.


