  - '[PAGE 112]


    back the claim that JS is not lexically scoped. let/const declarations have a
    peculiar error behavior called the “Temporal Dead Zone” (TDZ) which results in
    observable but unusable variables. Though TDZ can be strange to encounter, it’s
    also not an invalidation of lexical scoping. All of these are just unique parts
    of the language that should be learned and understood by all JS developers.


    Closure is a natural result of lexical scope when the language has functions as
    first-class values, as JS does. When a function makes reference to variables from
    an outer scope, and that function is passed around as a value and executed in
    other scopes, it maintains access to its original scope variables; this is closure.


    Across all of programming, but especially in JS, closure drives many of the most
    important programming patterns, including modules. As I see it, modules are as
    with the grain as you can get, when it comes to code organization in JS.


    To dig further into scope, closures, and how modules work, read Book 2, Scope
    & Closures.


    # Pillar 2: Prototypes


    The second pillar of the language is the prototypes system. We covered this topic
    in-depth in Chapter 3,“Prototypes”, but I just want to make a few more comments
    about its importance.


    JS is one of very few languages where you have the option to create objects directly
    and explicitly, without first defining their structure in a class.


    For many years, people implemented the class design pattern on top of prototypes—so-called
    “prototypal inheritance” (see'
  - '[PAGE 113]


    # Chapter 4: The Bigger Picture


    Appendix A, “Prototypal ‘Classes’”—and then with the advent of ES6’s class keyword,
    the language doubled-down on its inclination toward OO/class-style programming.


    But I think that focus has obscured the beauty and power of the prototype system:
    the ability for two objects to simply connect with each other and cooperate dynamically
    (during function/method execution) through sharing a this context.


    Classes are just one pattern you can build on top of such power. But another approach,
    in a very different direction, is to simply embrace objects as objects, forget
    classes altogether, and let objects cooperate through the prototype chain. This
    is called behavior delegation. I delegation is more powerful than class inheritance,
    as a means for organizing behavior and data in our programs.


    But class inheritance gets almost all the attention. And the rest goes to functional
    programming (FP), as the sort of “anti-class” way of designing programs. This
    saddens me, because it snuffs out any chance for exploration of delegation as
    a viable alternative.


    I encourage you to spend plenty of time deep in Book 3, Objects & Classes, to
    see how object delegation holds far more potential than we''ve realized. This
    isn’t an anticlass message, but it is intentionally a “classes aren’t the only
    way to use objects” message that I want more JS developers to consider.


    Object delegation, I would argue, far more with the grain of JS, than classes
    (more on grains in a bit).'
  - '[PAGE 114]


    # Pillar 3: Types and Coercion


    The third pillar of JS is by far the most overlooked part of JS’s nature.


    The vast majority of developers have strong misconceptions about how types work
    in programming languages, and especially how they work in JS. A tidal wave of
    interest in the broader JS community has begun to shift to “static typing” approaches,
    type-aware tooling like TypeScript or Flow.


    I agree that JS developers should learn more about types, and should learn more
    about how JS manages type conversions. I also agree that type-aware tooling can
    help developers, assuming they have gained and used this knowledge in the first
    place!


    But I don’t agree at all that the inevitable conclusion of this is to decide JS’s
    type mechanism is bad and that we need to cover up JS’s types with solutions outside
    the language. We don’t have to follow the “static typing” way to be smart and
    solid with types in our programs. There are other options, if you’re just willing
    to go against the grain of the crowd, and with the grain of JS (again, more on
    that to come).


    Arguably, this pillar is more important than the other two, in the sense that
    no JS program will do anything useful if it doesn’t properly leverage JS’s value
    types, as well as the conversion (coercion) of values between types.


    Even if you love TypeScript/Flow, you are not going to get the most out of those
    tools or coding approaches if you aren’t deeply familiar with how the language
    itself manages value types.


    To learn more about JS types and coercion, check out Book'
  - '[PAGE 115]


    4, Types & Grammar. But please don''t skip over this topic just because you''ve
    always heard that we should use === and forget about the rest.


    Without learning this pillar, your foundation in JS is shaky and incomplete at
    best.


    # With the Grain


    I have some advice to share on continuing your learning journey with JS, and your
    path through the rest of this book series: be aware of the grain (recall various
    references to grain earlier in this chapter).


    First, consider the grain (as in, wood) of how most people approach and use JS.
    You''ve probably already noticed these books cut against grain in many respects.
    In YDKJSY, I respect you the reader enough to explain all the parts of JS, not
    only select popular parts. I believe you''re both capable and deserving of that
    knowledge.


    But that is not what you''ll find from a lot of other material out there. It also
    means that the more you follow and adhere to the guidance from these books—that
    you think carefully and analyze for yourself what''s best in your code—the more
    you will stand out. That can be a good and bad thing. If you ever want to break
    out from the crowd, you''re going to have to break from how the crowd does it!


    I''ve also had many people tell me that they quoted some topic/explanation from
    these books during a job interview, and the interviewer told the candidate they
    were wrong; indeed, people have reportedly lost out on job offers as a result.'
  - '[PAGE 116]


    As much as possible, I endeavor in these books to provide completely accurate
    information about JS, informed generally from the specification itself. But I
    also dose out quite a bit of my opinions on how you can interpret and use JS to
    the best benefit in your programs. I don''t present opinion as fact, or vice versa.
    You''ll always know which is in which these books.


    Facts about JS are not really up for debate. Either the specification says something,
    or it doesn''t. If you don''t like what the specification says, or my relating
    of it, take that up with TC39! If you''re in an interview and they claim you''re
    wrong on the facts, ask them right then and if you can look up in the specification.
    If the interviewer won''t re-consider, then you shouldn''t want to work there
    anyway.


    But if you choose to align with my opinions, you have to be prepared to back up
    those choices with why you feel that way. Don''t just parrot what I say. Own your
    opinions. Defend them. And if someone were hoping to work with disagrees, walk
    away with your head still high. It''s a big JS, and there''s plenty of room for
    lots of different ways.


    In other words, don''t be afraid to go against the grain, as I have done with
    these books and all my teachings. Nobody can tell you how you will best use of
    JS; that''s for you to decide. I''m merely trying to empower you in coming to
    your own conclusions, no matter what they are.


    On the other hand, there''s a grain you really should pay attention to and follow:
    the grain of how JS works, at the language level. There are things that work well
    and naturally in JS, given the right practice and approach, and there are things
    you really shouldn''t try to do in the language.


    Can you make your JS program look like a Java, C#, or Perl program? What about
    Python or Ruby, or even PHP? To


    You Don''t Know JS Yet: Get Started'
  - '[PAGE 117]


    varying degrees, sure you can. But should you?


    No, I don’t think you should. I think you should learn and embrace the JS way,
    and make your JS programs as JS’y as is practical. Some will think that means
    sloppy and informal programming, but I don’t mean that at all. I just mean that
    JS has a lot of patterns and idioms that are recognizably “JS,” and going with
    that grain is the general path to best success.


    Finally, maybe the most important grain to recognize is how the existing program(s)
    you’re working on, and developers you’re working with, do stuff. Don’t read these
    books and then try to change all grain in your existing projects over night. That
    approach will always fail.


    You’ll have to shift these things little by little, over time. Work on building
    consensus with your fellow developers on why it’s important to re-visit and re-consider
    an approach. But do so with just one small topic at a time, and let before-and-after
    code comparisons do most of the talking. Bring everyone on the team together to
    discuss, and push for decisions that are based on analysis and evidence from the
    code rather than the inertia of “our senior devs have always done it this"


    That’s the most important advice I can impart to help you learn JS. Always keep
    looking for better ways to use what JS gives us to author more readable code.
    Everyone who works on your code, including your future self, will thank you!


    # In Order


    So now you’ve got a broader perspective on what’s left to explore in JS, and the
    right attitude to approach the rest of your journey.'
- md: "\nOne of the most common practical questions I get at this point is, “What\
    \ order should I read the books?” There is a straightforward answer... but it\
    \ also depends.\n\nMy suggestion for most readers is to proceed through this series\
    \ in this order:\n\n- 1. Get started with a solid foundation of JS from Started\
    \ (Book 1) – good news, you've already almost finished this book!\n- 2. In Scope\
    \ & Closures (Book 2), dig into the first pillar of JS: lexical scope, how that\
    \ supports closure, and how the module pattern organizes code.\n- 3. In Objects\
    \ & Classes (Book 3), focus on the second pillar of JS: how JS’s this works, how\
    \ object prototypes support portability, and how prototypes enable the class mechanism\
    \ for OO-style code organization.\n- 4. In Types & Grammar (Book 4), tackle the\
    \ third and final pillar of JS: types and type coercion, as well as how JS’s syntax\
    \ and grammar define how we write our code.\n- 5. With the three pillars solidly\
    \ in place, Sync & Async (Book 5) then explores how we use flow control to model\
    \ state change in our programs, both synchronously (right away) and asynchronously\
    \ (over time).\n- 6. The series concludes with ES.Next & Beyond (Book 6), a forward\
    \ look at the near- and mid-term future of JS, including a variety of features\
    \ likely coming to your JS programs before long.\n\nThat’s the intended order\
    \ to read this book series.\n\nHowever, Books 2, 3, and 4 can generally be read\
    \ in any order, depending on which topic you feel most curious about and comfortable\
    \ exploring first. But I don’t recommend you skip\n\nYou Don’t Know JS Yet: Get\
    \ Started\n\nany of these three books—not even Types & Grammar, as some of you\
    \ will be tempted to do!—even if you think you already have that topic down.\n\
    \nBook 5 (Sync & Async) is crucial for deeply understanding JS, but if you start\
    \ digging in and find it's too intimidating, this book can be deferred until you're\
    \ more experienced with the language. The more JS you've written (and struggled\
    \ with!), the more you'll come to appreciate this book. So don't be afraid to\
    \ come back to it at a later time.\n\nThe final book in the series, ES.Next &\
    \ Beyond, in some respects stands alone. It can be read at the end, as I suggest,\
    \ or right after Getting Started if you're looking for a shortcut to broaden your\
    \ radar of what JS is all about. This book will also be more likely to receive\
    \ updates in the future, so you'll probably want to re-visit it occasionally.\n\
    \nHowever you choose to proceed with YDKJSY, check out the appendices of this\
    \ book first, especially practicing the snippets in Appendix B, “Practice, Practice,\
    \ Practice!” Did I mention you should go practice? There's no better way to learn\
    \ code than write it.\n\n## Appendix A: Exploring Further\n\nIn this appendix,\
    \ we're going to explore some topics from the main chapter text in a bit more\
    \ detail. Think of this content as an optional preview of some of the more nuanced\
    \ details covered throughout the rest of the book series.\n\n## Values vs. References\n\
    \nIn Chapter 2, we introduced the two main types of values: primitives and objects.\
    \ But we didn't discuss yet one key difference between the two: how these values\
    \ are assigned and passed around.\n\nIn many languages, the developer can choose\
    \ between assigning/passing a value as the value itself, or as a reference to\
    \ the value. In JS, however, this decision is entirely determined by the kind\
    \ of value. That surprises a lot of developers from other languages when they\
    \ start using JS.\n\nIf you assign/pass a value itself, the value is copied. For\
    \ example:\n\n```\nvar myName = \"Kyle\";\n```\n\n```\nvar yourName = myName;\n\
    ```\n\nHere, the your variable has a separate copy of the \"Kyle\" string from\
    \ the value that's stored in myName. That's because the value is a primitive,\
    \ and primitive values are always assigned and passed as value copies.\n\nHere's\
    \ how you can prove there's two separate values involved:\n\n```javascript\nvar\
    \ myName = \"Kyle\";\nvar yourName = myName;\n\nmyName = \"Frank\";\n\nconsole.log(myName);\n\
    // Frank\n\nconsole.log(yourName);\n// Kyle\n```\n\nSee how yourName wasn't affected\
    \ by the re-assignment of myName to \"Frank\". That's because each variable holds\
    \ its own copy of the value.\n\nBy contrast, references are the idea that two\
    \ or more variables are pointing at the same value, such that modifying this shared\
    \ value would be reflected by an access via any of those references. In JS, only\
    \ object values (arrays, objects, functions, etc.) are treated as references.\n\
    \nConsider:\n\n```javascript\nvar myAddress = {\n  street: \"123 JS Blvd\",\n\
    \  city: \"Austin\",\n  state: \"TX\"\n};\n```\n\n```javascript\nvar yourAddress\
    \ = myAddress;\n\n// I've got to move to a new house!\nmyAddress.street = \"456\
    \ TS Ave\";\n```\n\n```javascript\nconsole.log(yourAddress.street);\n// 456 TS\
    \ Ave\n```\n\nBecause the value assigned to myAddress is an object, it's held/assigned\
    \ by reference, and thus the assignment to the myAddress variable is a copy of\
    \ the reference, not the object value itself. That's why the updated value assigned\
    \ to the myAddress.street is reflected when we access our Address.street. myAddress\
    \ and yourAddress have copies of the reference to the single shared object, so\
    \ an update to one is an update to both.\n\nAgain, JS chooses the value-copy vs.\
    \ reference-copy behavior based on the value type. Primitives are held by value,\
    \ objects are held by reference. There's no way to override this in JS, in either\
    \ direction.\n\n## So Many Function Forms\n\nRecall the snippet from the “Functions”\
    \ section in Chapter 2:\n\n```javascript\nvar awesomeFunction = function(coolThings)\
    \ {\n  // ..\n  return amazingStuff;\n};\n```\n\nThe function expression here\
    \ is referred to as an anonymous function expression, since it has no name identifier\
    \ between the function keyword and the (...) parameter list. This point confuses\
    \ many JS developers because as of ES6, JS performs a \"name inference\" on an\
    \ anonymous function:\n\n```javascript\nawesomeFunction.name;\n// \"awesomeFunction\"\
    \n```\n\nThe name property of a function will reveal either its directly name\
    \ (in the case of a declaration) or its inferred name in the case of an anonymous\
    \ function expression. That value is generally used by developer tools when inspecting\
    \ a function value or when reporting an error stack trace.\n\nSo even an anonymous\
    \ function expression might get a name. However, name inference only happens in\
    \ limited cases such as when the function expression is assigned (=). If you pass\
    \ a function expression as an argument to a function call, for example, no name\
    \ inference occurs; the name property will be an empty string, and the developer\
    \ console will usually report \"(anonymous function)\".\n\nEven if a name is inferred,\
    \ it's still an anonymous function. Why? Because the inferred name is a metadata\
    \ string value, not an available identifier to refer to the function. An anonymous\
    \ function doesn't have an identifier to use to refer to itself from inside itself–recursion,\
    \ event unbinding, etc.\n\nCompare the anonymous function expression form to:\n\
    \n```javascript\n// let awesomeFunction = ..\n// const awesomeFunction = ..\n\
    var awesomeFunction = function someName(coolThings) {\n  //..\n  return amazingStuff;\n\
    }\n\n```javascript\nawesomeFunction.name;\n// \"someName\"\n```\n\nThis function\
    \ expression is a *named* function expression, since the identifier someName is\
    \ directly associated with the function expression at compile time; the association\
    \ with the identifier awesomeFunction still doesn't happen until runtime at the\
    \ time of that statement. Two identifiers don't have to match; sometimes it makes\
    \ sense to have them different, other times it's better to have them the same.\n\
    \nNotice also the explicit function name, the identifier someName, takes precedence\
    \ when assigning a *name* for the name property.\n\nShould function expressions\
    \ be named or anonymous? Opinions vary widely on this. Most developers tend to\
    \ be concerned with using anonymous functions. They're shorter, and unquestionably\
    \ more common in the broad sphere of JS code out.\n\nIn my opinion, if a function\
    \ exists in your program, it has a purpose; otherwise, take it out! And if it\
    \ has a purpose, it has a natural name that describes that purpose.\n\nIf a function\
    \ has a name, the code author should include that name in the code, so that the\
    \ reader does not have to infer name from reading and mentally executing that\
    \ function's source code. Even a trivial function body like x *\n"
  mdcn: "\n\n目前我收到的最常见的实际问题之一是：“我应该什么顺序读这些书？”答案其实很直接……但这也取决于具体情况。\n\n我对大多数读者的建议是按照以下顺序阅读这个系列书籍：\n\
    \n- 1. 从《入门》（Started，第 1 本）开始打下坚实的基础——好消息是，你已经几乎读完这本书了！\n- 2. 在《作用域与闭包》（Scope\
    \ & Closures，第 2 本）中，深入 JS 的第一支柱：词法作用域、闭包如何运作，以及模块模式如何组织代码。\n- 3. 在《对象与类》（Objects\
    \ & Classes，第 3 本）中，关注 JS 的第二支柱：JS 的 `this` 如何工作、对象原型如何支持移植性，以及原型如何为面向风格的代码组织实现类机制。\n\
    - 4. 在《类型与语法》（Types & Grammar，第 4 本）中，解决 JS 的第三也是最后一个支柱：类型和类型转换，以及 JS 的语法和规则如何定义我们编写代码的方式。\n\
    - 5. 在这三个支柱稳固建立之后，《同步与异步》（Sync & Async，第 5 本）将探索我们如何使用控制流来模拟程序中的状态变化，包括同步（立即）和异步（随时间）。\n\
    - 6. 该系列以《ES.Next 及以后》（ES.Next & Beyond，第 6 本）结束，展望 JS 近期和中期未来，包括可能很快就会出现在你 JS\
    \ 程序中的各种特性。\n\n这就是阅读该系列书籍的预期顺序。\n\n然而，第 2、3、4 本通常可以按任何顺序阅读，取决于你对哪个话题最感兴趣，以及最擅于首先探索。但我不建议你跳过\n\
    \n《你现在还不懂 JS》（You Don’t Know JS Yet: Get Started）\n\n这三本书中的任何一本——即使是《类型与语法》，尽管你们中的某些人可能会很想跳过！——即使你认为自己已经掌握了该主题。\n\
    \n第 5 本（同步与异步）对于深入理解 JS 至关重要，但如果你开始钻研并发现它太令人生畏，可以推迟到你对该语言更有经验后再看。你写的 JS 代码越多（以及经历过的痛苦越多！），就越会体会这本书。所以，不要害怕以后再回来读。\n\
    \n该系列中的最后一本书《ES.Next 及以后》在某些方面是独立的。你可以像我建议的那样在最后读，也可以在读完《入门》后立即读，如果你想通过捷径来拓宽你对\
    \ JS 全貌的认知。这本书在未来也可能收到更新，所以你可能想偶尔复习。\n\n无论你选择如何继续阅读 YDKJSY，请先查看这本书的附录，特别是附录 B“练习、练习、再练习！”中的代码片段。我提到过你应该去练习吗？没有比写代码更更好的学习代码的方式了。\n\
    \n## 附录 A：进一步探索\n\n在这个附录中，我们将更详细地探讨正文章节中的某些主题。可以将这些内容看作是对该系列书籍其余部分涵盖的某些更细微细节的可选预览。\n\
    \n## 值与 引用\n\n在第 2 章中，我们介绍了两种主要的值类型：原始值和对象。但我们还没有讨论它们之间的一个关键区别：这些值是如何被赋值和传递的。\n\
    \n在许多语言中，开发者可以选择将赋值/传递的值视为值本身，或者作为该值的引用。但在 JS 中，这个决定完全取决于值的类型。这让许多其他语言的开发者在开始使用\
    \ JS 时感到惊讶。\n\n如果你赋值/传递的是值本身，则该值会被复制。例如：\n\n```\nvar myName = \"Kyle\";\n```\n\
    \n```\nvar yourName = myName;\n```\n\n在这里，`yourName` 变量拥有 \"Kyle\" 字符串的独立拷贝，与存储在\
    \ `myName` 中的值不同。这是因为该值是原始值，而原始值总是作为值的拷贝进行赋值和传递。\n\n以下是你可以证明涉及两个独立的值：\n\n```javascript\n\
    var myName = \"Kyle\";\nvar yourName = myName;\n\nmyName = \"Frank\";\n\nconsole.log(myName);\n\
    // Frank\n\nconsole.log(yourName);\n// Kyle\n```\n\n看到 `yourName` 没有受到 `myName`\
    \ 重新赋值为 \"Frank\" 的影响。这是因为每个变量都持有自己的值拷贝。\n\n相比之下，引用是指两个或多个变量指向同一个值，这样修改这个共享值将通过访问其中任何一个引用反映出来。在\
    \ JS 中，只有对象值（数组、对象、函数等）被视为引用。\n\n考虑：\n\n```javascript\nvar myAddress = {\n  street:\
    \ \"123 JS Blvd\",\n  city: \"Austin\",\n  state: \"TX\"\n};\n```\n\n```javascript\n\
    var yourAddress = myAddress;\n\n// 我得搬新家了！\nmyAddress.street = \"456 TS Ave\"\
    ;\n```\n\n```javascript\nconsole.log(yourAddress.street);\n// 456 TS Ave\n```\n\
    \n因为赋值给 `myAddress` 的值是一个对象，它是通过引用持有/赋值的，因此对 `myAddress` 变量的赋值是引用的拷贝，而不是对象值本身。这就是为什么当我们访问\
    \ Address.street 时，赋值给 `myAddress.street` 的更新值会被反映出来。`myAddress` 和 `yourAddress`\
    \ 拥有指向同一个共享对象的引用拷贝，因此对其中一个的更新是对两的更新。\n\n再次，JS 根据值的类型选择值拷贝与引用拷贝的行为。原始值按值拷贝，对象按引用拷贝。\n\
    \n## 许多函数形式\n\n回想第 2 章“函数”部分中的代码片段：\n\n```javascript\nvar awesomeFunction = function(coolThings)\
    \ {\n  //..\n  return amazingStuff;\n};\n```\n\n这里的函数表达式是匿名的，因为它在 `function` 关键字和\
    \ `(...)` 参数列表之间没有标识符。这让许多 JS 开发者感到困惑，因为从 ES6 开始，JS 对匿名函数进行“名称推断”：\n\n```javascript\n\
    awesomeFunction.name;\n// \"awesomeFunction\"\n```\n\n函数的 name 属性会显示其直接名称（在声明的情况下），或者显示匿名函数的推断名称。然而，名称推断仅发生在有限的情况下，例如赋值时。如果你将函数表达式作为函数调用的参数，就不会发生名称推断；其\
    \ name 属性将为空字符串，且开发者控制台通常报告“(anonymous function)”。\n\n即使推断出了名称，它仍然是匿名函数。为什么？因为推断出的名称是一个元数据字符串值，而不是可用的函数标识符。匿名函数没有标识符可以从内部引用自己——递归、事件解绑等。\n\
    \n将匿名函数形式与以下形式对比：\n\n```javascript\n// let awesomeFunction = ..\n// const awesomeFunction\
    \ = ..\nvar awesomeFunction = function someName(coolThings) {\n  //..\n  return\
    \ amazingStuff;\n}\n\n```javascript\nawesomeFunction.name;\n// \"someName\"\n\
    ```\n\n这个函数表达式是*具名*函数表达式，因为标识符 `someName` 在编译时就与函数表达式关联；与标识符 `awesomeFunction`\
    \ 的关联直到运行时执行该语句时才会发生。两个标识符不需要匹配；有时让它们不同是合理的，有时让它们相同更好。\n\n注意，显式的函数名称（标识符 `someName`）在分配\
    \ *name* 属性时具有优先级。\n\n函数表达式应该是具名的还是匿名的？对此意见分歧。大多数开发者倾向于使用匿名函数。它们更短，而且在广阔的 JS 代码领域中无疑更为常见。\n\
    \n在我看来，如果你的程序中存在一个函数，它就有一个目的；否则，就把它删掉！如果它有目的，它就有一个描述该目的的自然名称。即使函数体非常微小，如 x *\n\
    \n"
