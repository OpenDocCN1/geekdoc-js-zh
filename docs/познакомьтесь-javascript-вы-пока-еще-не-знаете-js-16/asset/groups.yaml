    # Chapter 3: Digging to the Roots of JS


    # Note


    We''ll omit the manual loop equivalent here, but it''s definitely less readable
    than the for..of loop!


    Another mechanism''s that often used for consuming iterators is the ... operator.
    This operator actually has two symmetrical forms: spread and rest (or gather,
    I prefer). The spread form is an iterator-consumer.


    To spread an iterator, you have to have something to spread it into. There are
    two possibilities in JS: an array or an argument list for a function call.


    An array spread:


    ```

    // spread an iterator into an array,

    // with each iterated value occupying

    // an array element position.

    var vals = [...it];

    ```


    A function call spread:


    ```

    // spread an iterator into a function,

    // with each iterated value

    // occupying an argument position.

    doSomethingUseful(...it);

    ```


    In both cases, the iterator-spread form of ... follows the iterator-consumption
    protocol (the same as the for..of loop) to retrieve all available values from
    an iterator and place (aka, spread) them into the receiving context (array, argument
    list).


