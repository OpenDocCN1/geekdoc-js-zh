    One of the most common practical questions I get at this point is, “What order
    should I read the books?” There is a straightforward answer... but it also depends.


    My suggestion for most readers is to proceed through this series in this order:


    +   1. Get started with a solid foundation of JS from Started (Book 1) – good
    news, you''ve already almost finished this book!

    2. In Scope & Closures (Book 2), dig into the first pillar of JS: lexical scope,
    how that supports closure, and how the module pattern organizes code.

    3. In Objects & Classes (Book 3), focus on the second pillar of JS: how JS’s this
    works, how object prototypes supportportation, and how prototypes enable the class
    mechanism for OO-style code organization.

    4. In Types & Grammar (Book 4), tackle the third and final pillar of JS: types
    and type coercion, as well as how JS’s syntax and grammar define how we write
    our code.

    5. With the three pillars solidly in place, Sync & Async (Book 5) then explores
    how we use flow control to model state change in our programs, both synchronously
    (right away) and asynchronously (over time).

    6. The series concludes with ES.Next & Beyond (Book 6), a forward look at the
    near- and mid-term future of JS, including a variety of features likely coming
    to your JS programs before long.


    That’s the intended order to read this book series.


    However, Books 2, 3, and 4 can generally be read in any order, depending on which
    topic you feel most curious about and comfortable exploring first. But I don’t
    recommend you skip


    You Don’t Know JS Yet: Get Started'
