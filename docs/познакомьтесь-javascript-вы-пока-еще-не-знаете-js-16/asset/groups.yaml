    \n图 2：解析 + 编译 + 执行\n\n在这种处理模型中，第 5 行的无效命令（如损坏的语法）将在任何执行之前的解析阶段被捕获，整个程序都不会运行。对于捕获语法（或其他“静态”）错误，通常倾向于在任何部分执行完成之前获知这些错误。\n\
    \n那么，“经过解析的”语言与“编译型”语言有什么共同点呢？首先，所有编译语言都是经过解析的。因此，一种经过解析的语言在走向编译的道路上已经走了很远。在经典的编译理论中，解析后的最后一个步骤是代码生成：产生可执行形式。\n\
    \n一旦任何源程序被完全解析，其随后的执行通常会以某种形式包含从程序的解析后形式（通常称为抽象语法树 (AST)）到该可执行形式的翻译。\n\n换句话说，经过解析的语言通常在执行之前也执行代码生成，因此说它们在精神上是编译的，并不算牵强。\n\
    \n《你还懂 JavaScript 吗：入门\n\n# 第 1 章：什么是 JavaScript？\n\n24\n\n那么这些细节归结底意味着什么呢？退后一步，考虑\
