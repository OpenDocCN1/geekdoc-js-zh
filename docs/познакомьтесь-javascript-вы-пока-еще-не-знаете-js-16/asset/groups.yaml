    第 2 章：JS 概述\n\n## 每个文件都是一个程序\n\n你使用的几乎每个网站（Web 应用程序）由许多不同的 JS 文件（通常带有 .js 文件扩展名）组成。人们很容易将整个部分（应用程序）看作一个程序。但\
    \ JS 的观点不同。\n\n在 JS 中，独立的文件是它自己独立的程序。\n\n这之所以重要，主要是为了错误处理。由于 JS 将文件视为程序，一个文件可能会失败（在解析/编译或执行期间），并且并不一定会阻止下一个文件的处理。显然，如果你的应用程序依赖于五个\
    \ .js 文件，而其中一个失败了，那么整个应用程序最理想也只能部分运行。确保每个文件都能正常工作，并且在可能的范围内，让它们尽可能优雅地处理其他文件的失败，是非常重要的。\n\
    \n考虑将独立的 .js 文件视为独立的 JS 程序可能会让你感到惊讶。从你使用应用程序的角度来看，它看起来确实是一个巨大的程序。这是因为应用程序的执行允许这些独立程序协作并像一个程序一样运行。\n\
    \n## 注意\n\n许多项目使用构建工具，这些工具最终会将项目中的独立文件合并成单个文件，交付给网页。当发生这种情况时，JS 将这个单一合并文件视为整个程序。\n\
    \n多个独立 .js 文件作为单个程序运行的唯一方法是共享它们的状态（以及通过“全局作用域”对其公共功能的访问）。它们在全局作用域命名空间中混合，因此在运行时它们作为一个整体运行。\n\
    \n从 ES6 开始，JS 除了典型的独立 JS 格式外，还支持模块格式。模块也是基于文件的。如果一个文件通过模块加载机制（如 `import` 语句或 `<script\
    \ type=\"module\">` 标签）加载，它的所有代码都被视为单个模块。\n\n尽管你通常不会将一个模块——一组状态以及操作该状态的公开暴露的方法集合——视为一个独立程序，但\
