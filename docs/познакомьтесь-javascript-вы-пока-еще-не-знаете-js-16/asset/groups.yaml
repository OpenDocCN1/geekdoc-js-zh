    ```\n\n```\nsetToSay.greeting();\n// Hello!\n```\n\n在此代码段中，`setToSay` 所持的对象包含了三个函数的引用（`greeting()`、`question()`\
    \ 和 `answer()`）。可以通过访问属性来获取函数值并调用每个函数。将这种在对象上定义函数的简单风格与本章后面讨论的更复杂的类语法进行比较。\n\n\
    JS 中的函数有多种形式。我们将在附录 A“许多函数形式”中探讨这些变化。\n\n## 比较\n\n程序中的决策需要通过比较值来确定它们的身份以及彼此之间的关系。JS\
    \ 有几种机制可以启用值比较，让我们仔细观察一下它们。\n\n## 等于……某种相等\n\nJS 程序中最常见的比较是问这个问题：“这个 X 值和那个 Y\
    \ 值相同吗？”但是，对于 JS 来说，“相同”到底意味着什么呢？\n\n出于易用性和历史原因，它的含义比显而易见的精确身份匹配要复杂得多。有时，相等比较的目的是精确匹配，但在其他情况下，期望的比较会宽泛，允许密切相似或可交换的匹配。换句话说，我们必须意识到相等比较（equality\
    \ comparison）和等值比较（equivalence comparison）之间的细微差别。\n\n如果你花过时间处理或阅读过 JS，你一定见过所谓的“三连等号”\
    \ `===` 运算符，它也被“严格相等”运算符。这听起来相当直观，对吧？“严格”显然意味着严格，即狭窄且精确。\n\n并不完全如此。\n\n是的，大多数参与\
    \ `===` 相等比较的值都符合那个完全一致的直觉。考虑一些示例：\n\n```javascript\n3 === 3.0;          // true\n\
    \"yes\" === \"yes\"; // true\nnull === null;      // true\nfalse === false;  \
    \  // true\n\n42 === \"42\";       // false\n\"hello\" === \"Hello\"; // false\n\
    true === 1;         // false\n0 === null;         // false\n\"\" === null;   \
    \   // false\nnull === undefined; // false\n```\n\n## 注释\n\n> 另一种通过 `===` 执行等值比较的方法通常被描述为“同时检查值和类型”。在目前目前为止观察的几个例子中（例如\
    \ `42 === \"42\"`），两个值的类型（数字、字符串等）似乎确实是区分因素。然而，事实并非于此。JS 中所有的值比较都会考虑所比较值的类型，而不仅仅是\
    \ `===` 运算符。具体来说，`===` 在其比较中允许任何类型的类型转换（即“强制类型转换”，用力），而其他 JS 比较也允许强制转换。\n\n《你还不懂\
    \ JS：入门》\n\n`===` 运算符确实存在一些细微差别，许多 JS 开发者忽略了这一点，并这对他们不利。`===` 运算符的设计在两种特殊值的情况下（`NaN`\
    \ 和 `-0`）会撒谎。考虑：\n\n```javascript\nNaN === NaN;           // false\n0 === -0;\
    \                // true\n```\n\n在 `NaN` 的情况下，`===` 运算符撒谎并说 `NaN` 的出现不等于 `NaN`。在\
    \ `-0` 的情况下（是的，这是一个你可以在程序中有意使用的真实且不同的值！），`===` 运算符撒谎并说它等于普通的 `0` 值。\n\n由于撒谎可能会令人困扰，最好避免对它们使用\
    \ `===`。对于 `NaN` 比较，请使用 `Number.isNaN(..)` 工具函数，它不会撒谎。对于 `-0` 比较，使用 `Object.is(..)`\
    \ 工具函数，它同样不会撒谎。如果你愿意，`Object.is(...)` 也可以用于非撒谎的检查。幽默的是，你可以将 `Object.is(...)` 视为“四连等号”\
