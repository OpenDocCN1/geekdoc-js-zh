    \n由于我不认为在程序中频繁使用匿名函数是个好主意，因此我不喜欢 `=>` 箭头函数形式。这种函数实际上有特定的用途（即在词法上处理 `this` 关键字），但并不意味着我们应该为编写的每个函数都使用它。为每项任务选择最合适的工具。\n\
    \n函数也可以在类定义和对象字面量定义中指定。在这些形式下，它们通常被称为“方法”，尽管在 JS 中这个术语与“函数”相比没有明显的区别：\n\n```\n\
    class SomethingKindGreat {\n  // 类方法\n  coolMethod() { .. } // 没有逗号！\n  boringMethod()\
    \ { .. }\n}\n```\n\n```javascript\nvar EntirelyDifferent = {\n  // 对象方法\n  coolMethod()\
    \ { .. }, // 有逗号！\n  boringMethod() { .. };\n}\n```\n\n```\n// (匿名) 函数表达式属性\n\
    oldSchool: function() { .. };\n```\n\n呼！定义函数的方式也太多种了。\n这里没有简单的捷径；你必须对所有函数建立熟悉感，以便在现有代码中识别它们，并在你编写的代码中恰当地使用它们。仔细研究并练习吧！\n\
    \n# 强制类型转换的条件比较\n\n是的，那个章节名称确实很绕口。但我们在讨论什么呢？我们讨论的是条件表达式需要进行面向强制类型转换的比较来做出决策。\n\
    \n`if` 和 `?` :- 三元语句，以及 `while` 和 `for` 循环中的测试子，都执行隐式的值比较。但什么样的比较？是“严格”的还是“强制转换”的？实际上两者都是。\n\
    \n考虑：\n\n```javascript\nvar x = 1;\nif (x) {\n  // 会运行！\n}\n```\n\n```javascript\n\
    while (x) {\n  // 会运行一次！\n  x = false;\n}\n```\n\n你可能这样认为这些 `(x)` 条件表达式：\n\n```javascript\n\
    var x = 1;\nif (x == true) {\n  // 会运行！\n}\n```\n\n```javascript\nwhile (x ==\
    \ true) {\n  // 会运行一次！\n  x = false;\n}\n```\n\n在 particular特定情况下——x 的值为 1——这种心理模型是有效的，但在更广泛的范围内并不准确。考虑：\n\
    \n# 附录 A：进一步探索\n\n```javascript\nvar x = \"hello\";\n\nif (x) {\n  // 会运行！\n}\n\
    \nif (x == true) {\n  // 不运行 :(\n```\n\n哎。那么 `if` 语句实际上在做什么呢？这是更准确的心理模型：\n\n```javascript\n\
    var x = \"hello\";\n\nif (Boolean(x) == true) {\n  // 会运行\n}\n```\n\n// 等同于：\n\
    \n```javascript\nif (Boolean(x) === true) {\n  // 会运行\n}\n```\n\n由于 `Boolean(..)`\
    \ 函数始终返回类型为 boolean 的值，这段片段中的 `==` 和 `===` 它们的作用相同。重要的部分是看到在比较之前发生了一个强制类型转换，无论\
    \ x 当前是什么类型，都会转换为 boolean。\n\n在 JS 比较中，你无法避开强制转换。下心学习它们吧。\n\n# 原型“类”\n\n在第 3 章中，我们介绍了原型，并展示了如何通过原型链链接对象。\n\
    \n另一种连接此类原型链接的方法是 ES6 类系统优雅设计之前的（诚实说，很丑陋的）前身（见第 2 章，“类”），它被称为原型类。\n\n# 提示\n\n\
    虽然这种代码风格在如今的 JS 中并不常见，但在职位面试中被问到它仍然异常地常见！\n\n让我们先回一下 `Object.create(..)` 风格的编码：\n\
    \n```javascript\nvar Classroom = {\n  welcome() {\n    console.log(\"Welcome,\
    \ students!\");\n  }\n};\n\nvar mathClass = Object.create(Classroom);\n\nmathClass.welcome();\n\
    // Welcome, students!\n```\n\n在这里，`mathClass` 对象通过其原型链接到 `Classroom` 对象。通过这种链接，函数调用\
    \ `mathClass.welcome()` 被委托给定义在 `Classroom` 方法。\n\n原型类模式会将这种委托行为标记为“继承”，并另一种（具有相同的行为）定义为：\n\
    \n```javascript\nfunction Classroom() {\n  //..\n}\n\nClassroom.prototype.welcome\
    \ = function hello() {\n  console.log(\"Welcome, students!\");\n}\n\nvar mathClass\
    \ = new Classroom();\n\nmathClass.welcome();\n// Welcome, students!\n```\n\n这种“原型类”模式现在被强烈建议不要使用，转而使用\
    \ ES6 类：\n\n```javascript\nclass Classroom {\n  constructor() {\n    // ..\n \
    \ }\n\n  welcome() {\n    console.log(\"Welcome, students!\");\n  }\n}\n\nvar\
    \ mathClass = new Classroom();\n\nmathClass.welcome();\n// Welcome, students\n\
    ```\n\n在底层，相同的原型链接被连接起来，但这种类语法更符合面向类的设计。\n\n# 附录 B：练习，练习，再练习！\n\n在本附录中，我们将探索一些练习题及其建议的。这些只是为了让你开始练习书中的概念。\n\
    \n# 练习比较\n\n让我们练习处理值类型和比较（第 4 章，支柱 3），其中将涉及强制转换。`scheduleMeeting(..)` 应该接收一个开始时间（24小时格式的字符串\
    \ \"hh:mm”）和一个会议时长（分钟数）。如果会议完全落在工作日内（根据 `dayStart` 和 `dayEnd`），则返回 `true`；如果会议违反工作日边界，则返回\
    \ `false`。\n\n```javascript\nconst dayStart = \"07:30\";\nconst dayEnd = \"17:45\"\
    ;\n\nfunction scheduleMeeting(startTime,durationMinutes) {\n  // ..TODO..\n}\n\
    \nscheduleMeeting(\"07:00\",15); // false\nscheduleMeeting(\"07:15\",30); // false\n\
    scheduleMeeting(\"07:30\",30); // true\nscheduleMeeting(\"11:30\",60); // true\n\
    scheduleMeeting(\"17:00\",45); // true\nscheduleMeeting(\"17:30\",30); // false\n\
    scheduleMeeting(\"18:00\",15); // false\n```\n\n尝试先自己解决。考虑相等运算符和关系比较运算符的使用，以及强制转换如何影响这段代码。一旦你有了可以运行的代码，将你的解决方案与附录末尾“建议解决方案”中的代码进行比较。\n\
    \n# 练习闭包\n\n现在练习闭包（第 4 章，支柱 1）。`range(..)` 函数接收一个数字作为第一个参数，代表目标数字范围内的第一个数字。第二个参数也是数字，代表目标范围的结束（包含）。如果省略第二个参数，则应该返回另一个期望该参数的函数。\n"
