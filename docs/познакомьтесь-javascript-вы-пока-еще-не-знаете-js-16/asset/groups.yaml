    # Foreword


    The first time I saw a tweet advertising the crowdfunding campaign for the original
    book series You Don’t Know JS, I thought to myself that whoever the hell this
    Kyle Simpson is can get bent. Of course I know JavaScript! At the time I had been
    working in JavaScript for many years with some of tech’s biggest names, so I felt
    justified in looking down my nose at this sweeping claim.


    Once the funding for the book was completed, I observed that a lot of people were
    really excited to read this book series and I decided to go ahead and give it
    a shot—you know, to show everyone that I do know JavaScript. Once I dug in and
    poured out the texts, I experienced a profound mix of learning, surprise, and
    even a little anger. Kyle has a knack for saying something that challenges my
    world view and making me think about it until I realize what he said was actually
    true (I’ll never admit this to him though!).


    So it turned out I didn’t know JavaScript. I didn’t know why I had adopted certain
    patterns; I didn’t know why JavaScript behaves the way it does in certain situations,
    and I didn’t know much of the nuance of the languages that I assumed I did. Many
    were things I didn’t know I didn’t know, and I was worse off as a developer for
    it.


    This is what this book series is great for. It’s not just for someone picking
    up the language for the first time (though it’s for them, too); it’s for all software
    craftspeople who want to master their tools, who want to understand the ins and
    outs'
  - '[PAGE 11]


    ii


    # Foreword


    of their trade, and who want to select the proper methods for\solving problems.


    The thing I appreciate about Kyle and his work is that he is delightfully uninfluenced
    by the zeitgeist of the programming world around him. That isn''t to say he isn''t
    aware of what''s happening in the community but rather that it doesn''t sway his
    pursuit of the best answers to the correct questions. This often has put him at
    odds with the latest “best practices,” but in reality this is exactly what you
    need: a perspective removed from temporal influence and simply speaking to the
    underlying truth. That''s why this series of You Don''t Know JS is still accurate,
    years later! Not many things stand this test of time given the shifting sands
    of the JavaScript landscape.


    Let''s talk a moment about this first book itself, Get Started. You may be tempted
    to skip it as you may think that you already have “gotten started,” but it''s
    worth reading this one! You''d be surprised how much depth, nuance, and oddity
    there is in the underlying building blocks of JavaScript, and it''s quite essential
    for you to grapple with these underpinnings before venturing forward into the
    constructs of the language. It''s exactly the sort of foundation you need, to
    really know JavaScript.


    So, do your future self a favor and dig into this book and unlock the knowledge
    within. These solid foundations will serve you better than any framework ever
    will; those will go and but we''ll still be writing JavaScript itself for decades
    to come. Keep an open mind and challenge your preconceived notions.


    You Don''t Know JS Yet: Get Started'
