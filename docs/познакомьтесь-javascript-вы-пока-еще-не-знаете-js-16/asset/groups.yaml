    特别是，第 4 章确定了围绕 JS 语言组织的三个主要支柱：作用域/闭包、原型对象以及类型/强制类型转换。JS 是一个宽泛且复杂的语言，具有许多功能和能力。但所有的
    JS 都建立在这些三个基础支柱之上。


    请记住，尽管这本书标题为“入门”（Get Started），但它并不是一本给初学者的介绍级书籍。这本书的主要任务是为你在整个系列后续章节深入学习 JS 做准备；它的编写假设是你在继续学习
    YDKJSY 之前已经具备了至少几个月的 JS 经验。因此，为了从《入门》中获得最大的收获，请确保你花大量时间编写 JS 代码来积累经验。


    即使你之前已经写过很多 JS，这本书也不应该被草草浏览或跳过；请花时间充分消化这里的材料。良好的开始始终取决于坚实的第一步。


    ## 这个名字是怎么回事？


    JavaScript 这个名字可能是被误解最深的编程语言名称。


    这种语言与 Java 有关系吗？它只是 Java 的脚本形式吗？它只用于编写脚本而不是真正的程序吗？


    事实是，JavaScript 这个名字是营销噱头的产物。当布伦丹·艾艾奇（Brendan Eich）首次构思这种语言时，给它的代号是 Mocha。在网景（Netscape）内部，使用的是
    LiveScript 品牌。但当需要为该语言命名时，“JavaScript”赢得了投票。


    为什么？因为这种语言最初的设计是为了吸引主要是 Java 程序员的受众，而且“script”（脚本）一词在当时流行指的是轻量级程序。这些轻量级“脚本”将是第一批嵌入到名为“网页”的新事物页面中的代码！


    换句话说，JavaScript 是一种营销策略，试图将这种语言定位为当时更笨重、更为人知的 Java 的一种替代方案。事实上，它完全可以被称为“WebJava”。


    JavaScript 的代码与 Java 代码之间存在一些表面上的相似之处。这些相似性并非源于共同开发，而是因为这两种语言都针对开发者，且这些开发者预期了来自
    C（以及在某种程度上来自 C++）的语法。


    例如，我们使用 `{` 开始代码块，使用 `}` 结束该代码块，就像 C/C++ 和 Java 一样。我们还使用 `;` 作为语句结束的标点。


    在某些方面，法律关系比语法要深得多。仍然拥有并运行 Java 的公司甲骨文（通过太阳太阳公司/Sun）也拥有“JavaScript”名称的官方商标（通过网景）。这个商标几乎从不被强制执行，而且在目前可能也无法执行。


    正由于这些原因，有些人建议我们直接用 JS 而不是 JavaScript。这是一种非常常见的缩写，尽管它不是一个官方语言进行自我品牌化时的理想候选词。事实上，这些书籍几乎完全使用
    JS 来指代这种语言。


    为了进一步拉开语言与 Oracle 拥有商标的距离，由 TC39 指定并由 ECMA 标准组织正式化的语言官方名称是 ECMAScript。事实上，自 2016
    年以来，官方语言名称还加上了修订年份后缀；在写本文时，它是 ECMAScript2019，或者缩写为 ES2019。


    换句话说，在你浏览器或 Node.js 中运行的 JavaScript/JS 是 ES2019 标准的实现。


    ## 注意


    > 不要使用像“JS6”或“ES8”这样的术语来指代这种语言。不要，这些术语只会增加困惑，你应该坚持使用“ES20xx”或“JS”。


    无论你叫它 JavaScript、ECMAScript 还是 ES2019，它绝对不是 Java 语言的变体！


    > “Java 之于 JavaScript，就像火腿之于兔子。” - Jeremy Keith, 2009


    ## 语言规范


    我提到了 TC39，这是管理 JS 的指导委员会。TC39 由 50 到 100 名来自浏览器和设备制造商的不同人员组成。他们通常每两个月开一次会，通常持续三天，以审查工作并对提案进行投票。


    所有提案都通过一个五阶段的过程。你可以在这里阅读更多关于该过程的信息：https://tc39.es/process-document/


    阶段 0 意味着 TC39 的成员认为这是一个值得的想法并计划主导它。你必须有一个 TC39 成员主导某个提案，它才能正式被视为“阶段 0”。


    一旦提案达到“阶段 4”状态，它就有资格被纳入语言的下一个修订版本中。一个提案完成这些阶段可能需要几个月到几年不等。


    所有提案都在 TC39 的 Github 上公开管理：https://github.com/tc39/proposals


    无论是否为 TC39 成员，都欢迎参与这些公开讨论和处理提案的过程。然而，只有 TC39 成员可以参加会议对提案和更改进行投票。


    与某些既定且令人沮丧的迷思相反，野外并没有多个版本的 JavaScript。只有一种 JS，即由 TC39 和 ECMA 维护的官方标准。


    在 2000 年代初期，当微软维护一个名为“Script”的派生且逆向工程且不完全兼容的 JS 版本时，确实存在“多个版本的”JS。但那些日子一去不复了。现在对
    JS 这种说法是过时且不准确的。


