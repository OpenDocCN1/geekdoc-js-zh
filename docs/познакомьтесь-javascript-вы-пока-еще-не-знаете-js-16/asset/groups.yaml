    # Chapter 3: Digging to the Roots of JS


    # Note


    You may have noticed a nuanced shift that occurred in this discussion. We started
    talking about consuming iterators, but then switched to talking about iterating
    over iterables. The iterationconsumption protocol expects an iterable, but the
    reason we can provide a direct iterator is that an iterator is just an iterable
    of itself! When creating an iterator instance from an existing iterator, the iterator
    itself is returned.


    # Closure


    Perhaps without realizing it, almost every JS developer has made use of closure.
    In fact, closure is one of the most pervasive programming functionalities across
    a majority of languages. It might even be as important to understand as variables
    or loops; that''s how fundamental it is.


    Yet it feels kind of hidden, almost magical. And it''s often talked about in either
    very abstract or informal terms, which does little to help us nail down exactly
    what it is.


    We need to be able to recognize where closure is used in programs, the presence
    or lack of closure is sometimes the cause of bugs (or even the cause of performance
    issues).


    So let''s define closure in a pragmatic and concrete way:


    > Closure is when a function remembers and continues to access variables from
    outside its scope, even when the function is executed in a different scope.'
- md: "\nWe see two definitional characteristics here. First, closure is part of the\
    \ nature of a function. Objects don’t get closures, functions do. Second, to observe\
    \ a closure, you must execute a function in a different scope than where that\
    \ function was originally defined.\n\nConsider:\n\n```javascriptfunction greeting(msg)\
    \ {\n  return function who(name) {\n    console.log(`${msg}, ${name}`);\n  }\n\
    }\n```\n\nvar hello = greeting(\"Hello\");\nvar howdy = greeting(\"Howdy\");\n\
    \nhello(\"Kyle\");\n// Hello, Kyle!\n\nhello(\"Sarah\");\n// Hello, Sarah!\n\n\
    howdy(\"Grant\");\n// Howdy, Grant!\n\nFirst, the greeting(...) outer function\
    \ is executed, creating an instance of the inner function who(..); that function\
    \ closes over the variable msg, which is the parameter from the outer scope of\
    \ greeting(...). When that inner function is returned, its reference is assigned\
    \ to the hello variable in the outer scope. Then we call greeting(...) a second\
    \ time, creating a new inner function instance, with a new closure over a new\
    \ msg, and return that reference to be assigned to howdy.\n\n## Chapter 3: Digging\
    \ to the Roots of JS\n\nWhen the greeting(..) function finishes running, normally\
    \ we would expect all of its variables to be garbage collected (removed from memory).\
    \ We'd expect each msg to go away, but they don't. The reason is closure. Since\
    \ the inner function instances are still alive (assigned to hello and howdy, respectively),\
    \ their closures are still preserving the msg variables.\n\nThese closures are\
    \ not a snapshot of the msg variable's value; they are a direct link and preservation\
    \ of the variable itself. That means closure can actually observe (or make!) updates\
    \ over time.\n\n```javascript\nfunction counter(step = 1) {\n  var count = 0;\n\
    \  return function increaseCount() {\n    count = count + step;\n    return count;\n\
    \  };\n}\n```\n\n```javascript\nvar incBy1 = counter(1);\nvar incBy3 = counter(3);\n\
    ```\n\n```javascript\nincBy1(); // 1\nincBy1(); // 2\n```\n\n```javascript\nincBy3();\
    \ // 3\nincBy3(); // 6\nincBy3(); // 9\n```\n\nEach instance of the inner increaseCount()\
    \ function is closed over both the count and step variables from its outer counter(..)\
    \ function's scope. step remains the same over time, but count is updated on each\
    \ invocation of that inner function. Since closure is over the variables and not\
    \ just snapshots of the values, these updates are preserved.\n\nClosure is most\
    \ common when working with asynchronous code, such as with callbacks. Consider:\n\
    \n```javascript\nfunction getSomeData(url) {\n  ajax(url, function onResponse(resp)\
    \ {\n    console.log(\n`Response (from ${url}): ${resp}`);\n  });\n}\n```\n\n\
    getSomeData(\"https://some.url/wherever\");\n// Response (from https://some.url/wherever):\
    \ ...\n\nThe inner function onResponse(...) is closed over url, and thus preserves\
    \ and remembers it until the Ajax call returns and executes onResponse(...). Even\
    \ though getSomeData(..) finishes right away, the url parameter variable is kept\
    \ alive in the closure for as long as needed.\n\nIt’s not necessary that the outer\
    \ scope be a function—it usually is, but not always—just that there be at least\
    \ one variable in an outer scope accessed from an inner function:\n\n```javascript\n\
    for (let [idx,btn] of buttons.entries()) {\n  btn.addEventListener(\"click\",\
    \ function onClick(){\n    console.log(`Clicked on button (${idx})!`);\n  });\n\
    }\n```\n\nBecause this loop is using let declarations, each iteration gets new\
    \ block-scoped (aka, local) idx and btn variables; the loop creates a new inner\
    \ onClick() function each time. That inner function closes over idx, preserving\
    \ it for as long as the click handler is set on the btn. So when each click is\
    \ clicked, its handler can print its associated index value, because the handler\
    \ remembers its respective idx variable.\n\nRemember: this closure is not over\
    \ the value (like 1 or 3), but over the variable idx itself.\n\nClosure is one\
    \ of the most prevalent and important programming patterns in any language. But\
    \ that’s especially true of JS; it’s hard to imagine anything useful without leveraging\
    \ closure in one way or another.\n\nIf you're still feeling unclear or shaky about\
    \ closure, the majority of Book 2, Scope & Closures is focused on the topic.\n\
    \n## this Keyword\n\nOne of JS’s most powerful mechanisms is also one of its most\
    \ misunderstood: this keyword. One common misconception is that a function’s this\
    \ refers to the function itself. Because of how this works in other languages,\
    \ another misconception is that this points the instance that a method belongs\
    \ to. Both are incorrect.\n\nAs discussed previously, when a function is defined,\
    \ it is attached to its enclosing scope via closure. Scope is the set of rules\
    \ that controls how references to variables are resolved.\n\nBut functions also\
    \ have another characteristic besides their scope that influences what they can\
    \ access. This characteristic is best described as an execution context, and it’s\
    \ exposed to the function via its this keyword.\n\nScope is static and contains\
    \ a fixed set of variables available at the moment and location you define a function,\
    \ but a function’s execution context is dynamic, entirely dependent on how it\
    \ is called (regardless of where it is defined or even called from).\n\nthis is\
    \ not a fixed characteristic of a function based on the function’s definition,\
    \ but rather a dynamic characteristic that’s determined each time the function\
    \ is called.\n\nOne way to think about this is it’s a tangible object whose properties\
    \ are made available to the function.\n\n```javascript\nfunction classroom(teacher)\
    \ {\n  return function study() {\n    console.log(`${ teacher } to study ${this.topic}`);\n\
    \  }\n}\n```\n\nvar assignment = classroom(\"Kyle\");\nassignment.study();\n//\
    \ Kyle to study undefined\n\nThe inner study() function returned by classroom(\"\
    Kyle\") is assigned to a variable called assignment. So how can assignment() be\
    \ called?\n\n```javascript\nassignment();\n// undefined to study undefined --\
    \ Oops\n```\n\nSince this program is not in strict mode (see Chapter 1, \"Strict\
    \ Speaking\"), context-aware functions that are called without any context default\
    \ to the global object (window in the browser). As there is no global variable\
    \ named topic (and thus no such property on the global object), this.topic resolves\
    \ to undefined.\n\nNow consider:\n\n```javascript\nvar homework = {\n  topic:\
    \ \"JS\",\n  assignment: assignment\n}\n\nhomework.assignment();\n// Kyle to study\
    \ JS\n```\n\nA copy of the assignment function reference is set as a property\
    \ on the homework object, and then it's called as homework.assignment(). That\
    \ means the for that function call will be the homework object. Hence, this.topic\
    \ resolves to \"JS\".\n\nLastly:\n\n```javascript\nvar otherHomework = {\n  topic:\
    \ \"Math\"\n};\n\nassignment.call(otherHomework);\n// Kyle to study Math\n```\n\
    \nA third way to invoke function is with the call(..) method, which takes an object\
    \ (otherHomework here) to use for setting the this reference for the function\
    \ call. The property reference this.topic resolves to \"Math\".\n\nThe same context-aware\
    \ function invoked three different ways, gives different answers each time for\
    \ what object this will reference.\n\nThe benefit of this-aware functions—and\
    \ their dynamic context—is the ability to more flexibly re-use a single function\
    \ with data from different objects. A function that closes over a scope can never\
    \ reference a different scope or set of variables. But a function that has dynamic\
    \ this context awareness can be quite helpful for certain tasks.\n\n Prototypes\n\
    \nWhere this is a characteristic of function execution, a prototype is a characteristic\
    \ of an object, and specifically resolution of a property access.\n\nThink about\
    \ a prototype as a linkage between two objects; the linkage is hidden behind the\
    \ scenes, though there are ways to expose and observe it. This prototype linkage\
    \ occurs when an object is created; it’s linked to another object that already\
    \ exists.\n"
