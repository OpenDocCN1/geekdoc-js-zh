    WASM is a representation format more akin to Assembly (hence, its name) that can
    be processed by a JS engine by skipping the parsing/compilation that the JS engine
    normally does. The parsing/compilation of a WASM-targeted program happen ahead
    of time (AOT); what''s distributed is a binary-packed program ready for the JS
    engine to execute with very minimal overhead.


    An initial motivation for WASM was clearly the potential performance improvements.
    While that continues to be a focus, WASM is additionally motivated by the desire
    to bring more parity for non-JS languages to the web platform. For example, if
    a language like Go supports threaded programming, but JS (the language) does not,
    WASM offers the potential for such a Go program to be converted to a form the
    JS engine can understand, without needing a threads feature in the JS language
    itself.


