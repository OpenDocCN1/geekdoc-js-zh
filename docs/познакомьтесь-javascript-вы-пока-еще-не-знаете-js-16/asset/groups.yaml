    \n## 值\n\n程序中最基本的信息单元是值。值是数据。它们是程序维持状态的方式。值在 JS 中有两种形式：原始值和对象。值使用字面量嵌入到程序中：\n\n\
    ```js\ngreeting(\"My name is Kyle.\");\n```\n\n在这个程序中，值 `\"My name is Kyle.\"\
    ` 是一个原始字符串字面量；字符串是字符的有序集合，通常表示单词和句子。\n\n我使用了双引号 `\"` 来界定（包围、分离、定义）字符串值。但我也可以使用单引号\
