    \ Object.create(homework);\n\notherHomework.topic; // \"JS\"\n```\n\n`Object.create(..)`\
    \ 的第一个参数指定了将新创建的对象链接到的对象，然后返回新创建的（已链接的！）对象。\n\n图 4 显示了三个对象（`otherHomework`、`homework`\
    \ 和 `Object.prototype`）在原型链中是如何的：\n\n![](img/80c8c54847b7a375356a79eacf1795de_104_0.png)\n\
    \n图 4：原型链中的对象\n\n## 第 3 章：深入 JS 的根源\n\n通过原型链进行委托仅适用于查找属性中值的访问。如果你给对象的属性赋值，该操作将直接应用到对象本身，无论该对象的原型链接到何处。\n\
    \n### 提示\n\n`Object.create(null)` 创建的对象没有链接到任何原型链，因此它纯粹是一个独立的对象；在某些情况下，这可能更好。\n\
    \n考虑：\n\n```javascript\nhomework.topic;\n// \"JS\"\n```\n\n```javascript\notherHomework.topic;\n\
