    反驳了 JS 不是词法作用域的观点。`let`/`const` 声明具有一种特殊的错误行为，被称为“暂性死地区”（TDZ），这会导致变量可见但不可用。虽然遇到
    TDZ 可能会很奇怪，但它并不是对词法作用域的否定。这些都是所有 JS 开发者应该学习和理解的语言独特部分。


    当语言像 JS 一样将函数视为“等公民值”时，闭包是词法作用域的自然结果。当一个函数引用了外部作用域的变量，并且该函数作为值传递并在其他作用域中执行时，它保持了对原始作用域变量的访问；这就是闭包。


    在整个编程领域，特别是在 JS 中，闭包驱动了许多最重要的编程模式，包括模块。在我看来，在 JS 的代码组织方面，模块是最符合语言特性（with the grain）的。


    若要深入了解作用域、闭包以及模块的工作原理，请阅读第二本书：《作用域与闭包》。


    ## 第二支柱：原型（Prototypes）


    语言的第二支柱是原型系统。我们在第三章“原型”中深入探讨了这一主题，但我只想对它的重要性再做几点评论。


    JS 是少数几个语言之一，你可以直接并显式地创建对象，而无需先在类中定义它们的结构。


    多年年来，人们在原型之上实现了类设计模式——所谓的“原型继承”（参见附录 A，“原型‘类’”——随后随着 ES6 `class` 关键字的出现，该语言进一步加强了其对面向对象/类风格编程的倾向。


    ## 第四章：大局（The Bigger Picture）


    但我认为这种关注掩盖了原型系统的美感和力量：两个对象通过共享一个 `this` 上下文，简单地相互连接并在（函数/方法执行期间）动态协作的能力。


    类只是你可以在这种力量之上构建的模式之一。但另一种方法（一个完全不同的方向）是简单地将对象视为对象，完全忘记类，并让对象通过原型链进行协作。这被称为“行为委托”（behavior
    delegation）。我相信，作为一种组织程序中行为和数据的手段，行为委托比类继承更强大。


    但类继承占据了几乎所有的注意力。剩下的留给了函数式编程（FP），作为一种“反类”的程序设计方式。这令我感到遗憾，因为它扼杀了探索委托作为可行替代方案的任何机会。


    我鼓励你在第三本书《对象与类》中花大量时间深入研究，看看对象委托如何比我们意识到的具有多大的潜力。这并不是一个反对类的信息，但它刻意传达了一个“类不是使用对象的唯一方式”的信息，我希望更多的
    JS 开发者能考虑这一点。


    我认为，对象委托比类更符合 JS 的特性（稍后会详细讨论“特性”）。


    ## 第三支柱：类型与强制转换（Types and Coercion）


    JS 的第三支柱是到目前为止最被忽视的特性。


    大多数开发者对编程语言中类型如何工作（特别是类型在 JS 中如何工作）有着深刻的误解。广泛的 JS 社区中，一种兴趣浪潮已开始转向“静态类型”方法，如 TypeScript
    或 Flow 等具有类型感知能力的工具。


    我同意 JS 开发者应该学习更多类型的知识，并更多地学习 JS 如何管理类型转换。我也同意类型感知工具可以帮助开发者，前提是他们首先获得了并使用了这些知识！


    但我完全不同意这种必然结论是认为 JS 的类型机制很糟糕，并且我们需要用语言之外的解决方案来覆盖 JS 的类型。我们不需要遵循“静态类型”的方式在程序中处理类型变得智能且稳固。如果你愿意违背大众潮流并顺应
    JS 的特性（再次，稍后会讨论），还有其他选择。


    可以说，这一支柱比另外两个更重要，因为如果一个 JS 程序不能妥善利用 JS 的值类型以及类型之间值的转换（强制转换），它将无法完成任何有用的事情。


    即使你喜欢 TypeScript/Flow，如果你不深入熟悉语言本身如何管理值类型，你就无法充分利用这些工具或编码方法。


    要了解更多关于 JS 类型和强制转换，请查看第四本书《类型与语法》。但请不要因为你总是听到我们应该使用 `===` 并忘记其他的就跳过这个主题。


    如果不学习这一支柱，你的 JS 基础充其量是不稳定且不完整的。


    ## 顺应特性（With the Grain）


    关于继续你的 JS 学习之旅以及本系列书籍其余部分的路径，我有一些建议可以分享：注意“特性”（回想本前面对“特性”的多次引用）。


    首先，考虑大多数人接触和使用 JS 的“特性”（就像木头的纹理一样）。你可能已经注意到这些书在很多方面是逆流而上的（cut against grain）。在《YDKJSY》中，我足够尊重你读者，解释了
    JS 的所有部分，而不仅仅是某些热门部分。我相信你既有能力也值得拥有这些知识。


    但这不是你在其他许多材料中能找到的东西。这也意味着，你越遵循并坚持这些书籍的指导——即仔细思考并自己分析对你的代码中什么是最好的——你就越会脱颖而出。这可能可能是好事，也可以是坏事。如果你一直想跳出人群……


    （注：提供的 OCR 文本存在大量重复和错误，已根据逻辑流进行去重和翻译）

