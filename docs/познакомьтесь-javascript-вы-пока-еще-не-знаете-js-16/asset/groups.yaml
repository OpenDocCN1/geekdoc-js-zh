    I must first thank my wife and kids, whose constant support is what allows me
    to keep going. I also want to thank the 500 original backers of the Kickstarter
    for “You Don’t Know JS”(1st ed), as well as the hundreds of thousands of folks
    who bought and read those books since. Without your financial support, this second
    edition wouldn’t be happening. Also to the interviewer at a certain avian social
    media company who said I didn’t“know enough about JS”... you helped me name the
    series.


    Next, I owe much of my current career path to Marc Grabanski and Frontend Masters.
    Marc took a chance on me and gave me my first shot at teaching years ago, and
    I wouldn''t have then become a writer had it not been for that! Frontend Masters
    is the Premier Sponsor of YDKJS 2nd Edition. Thank you, Frontend Masters (and
    Marc).


    Lastly, my editor, Simon St.Laurent, who helped me conceive the original YDKJS
    and was my first book editor. Simon’s support and guidance have profoundly impacted
    me and been an integral part of shaping me into the writer I am today. From those
    drinks we enjoyed at the Driskill all those years back, where YDKJS was born,
    through today, thank you so much Simon for shedding and improving these books!


