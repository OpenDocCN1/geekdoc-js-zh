  mdcn: "\n\n## 第二章：JS 概览\n\n如果类型不同，它们会首先允许类型转换（通常是转换为数字）。\n\n考虑：\n\n```javascript\n\
    var arr = [ \"1\", \"10\", \"100\", \"1000\" ];\nfor (let i = 0; i < arr.length\
