    Chapter 2: Surveying JS


    # Each File is a Program


    Almost every website (web application) you use is comprised of many different
    JS files (typically with the .js file extension). It''s tempting to think of the
    whole thing (the application) as one program. But JS sees it differently.


    In JS, standalone file is its own separate program.


    The reason this matters is primarily around error handling. Since JS treats files
    as programs, one file may fail (during parse/compile or execution) and will not
    necessarily prevent the next file from being processed. Obviously, if your application
    depends on five .js files, and one of them fails, the overall application will
    probably only partially operate, at best. It''s important to ensure that each
    file works properly, and to whatever extent possible, they handle failure in other
    files as gracefully as possible.


    It may surprise you to consider separate .js files as separate JS programs. From
    the perspective of your usage of an application, it sure seems like one big program.
    That''s because the execution of the application allows these individual programs
    to cooperate and act as one program.


    # Note


    Many projects use build tools that end up combining separate files from the project
    into a single file to be delivered to a web page. When this happens, JS treats
    this single combined file as the entire program.


    The only way multiple standalone .js files act as a single program is by sharing
    their state (and access to their public


