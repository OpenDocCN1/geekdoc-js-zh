    # Arrays And Objects


    Besides primitives, the other value type in JS is an object value.


    As mentioned earlier, arrays are a special type of object that’s comprised of
    an ordered and numerically indexed list of data:


    ```

    var names = [ "Frank", "Kyle", "Peter", "Susan" ];

    names.length;

    // 4

    names[0];

    // Frank

    names[1];

    // Kyle

    ```


    JS arrays can hold any value type, either primitive or object (including other
    arrays). As we’ll see toward the end of Chapter 3, even functions are values that
    can be held in arrays or objects.


    > Note

    Functions, like arrays, are a special kind (aka, sub-type) of object. We''ll cover
    functions in detail in a bit.


    Objects are more general: an unordered, keyed collection of any values. In other
    words, you access the element by a string location name (aka “key” or “property”)
    rather by its numeric position (as with arrays). For example:'
