    # Pillar 1: Scope and Closure


    The organization of variables into units of scope (functions, blocks) is one of
    the most foundational characteristics of any language; perhaps no other characteristic
    has a greater impact on how programs behave.


    Scopes are like buckets, and variables are like marbles you put into those buckets.
    The scope model of a language is like the rules that help you determine which
    color marbles go in which matching-color buckets.


    Scopes nest inside each other, and for any given expression or statement, only
    variables at that level of scope nesting, or in higher/outer scopes, are accessible;
    variables from lower/inner scopes are hidden and inaccessible.


    This is how scopes behave in most languages, which is called lexical scope. The
    scope unit boundaries, and how variables are organized in them, is determined
    at the time the program is parsed (compiled). In other words, it''s an author-time
    decision: where you locate a function/scope in the program determines what the
    scope structure of that part of the program will be.


    JS is lexically scoped, though many claim it isn''t, because of two particular
    characteristics of its model that are not present in other lexically scoped languages.


    The first is commonly called hoisting: when all variables declared anywhere in
    a scope are treated as if they were declared at the beginning of the scope. The
    other is that var-declared variables are function scoped, even if they appear
    inside a block.


