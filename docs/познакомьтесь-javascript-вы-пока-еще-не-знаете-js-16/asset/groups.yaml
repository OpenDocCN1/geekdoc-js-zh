    # Web Assembly (WASM)


    驱动 JS 演进的一大核心关注点是性能，包括 JS 解析/编译的速度有多快，以及这些编译后的代码执行速度有多快。


    2013 年，来自 Mozilla Firefox 的工程师演示了将 Unreal 3 游戏引擎从 C 移植到 JS。这段代码能够在浏览器 JS 引擎中以全速
    60fps 的性能运行，这基于一组优化，即 JS 版本的 Unreal 引擎代码使用了一种倾向于 JS 语言子集的代码风格，该子集被称为“ASM.js”。


    这个子集是有效的 JS，但其编写方式在普通编码中并不常见，然而，它向引擎传达了某些重要的类型信息，使其能够进行关键优化。ASM.js 的引入是解决 JS 运行时性能压力的一种方式。


    但重要的是，ASM.js 并非设计用于由开发者编写的代码，而是从另一种语言（如 C）转译后的程序的表示形式，其中这些类型“注释”是由工具自动插入的。


    在 ASM.js 证明了通过工具创建版本的程序可以被 JS 引擎更高效地处理后的几年，另一组工程师（最初也来自 Mozilla）发布了 Web Assembly
    (WASM)。


    WASM 与 ASM.js 的相似之处在于，它的原始意图是为非 JS 程序（C 等）提供一种转换为可在 JS 引擎中运行的形式。与 ASM.js 不同，WASM
    选择通过一种完全不同于 JS 的形式表示程序，从而在程序执行之前绕过 JS 解析/编译中的某些固有延迟。


    WASM 是一种更类似于汇编（因此得此名）的表示格式，可以通过跳过 JS 引擎通常进行的解析/编译来由 JS 引擎处理。针对 WASM 的程序的解析/编译是提前完成的（AOT）；分发的是一个二进制打包程序，准备好让
    JS 引擎以极小的开销执行。


    WASM 的初始初衷之一显然是潜在的性能提升。虽然这仍然是一个重点，但 WASM 的另一个动力是希望为非 JS 语言进入 Web 平台提供更多对等性。例如，如果
    Go 等语言支持多线程编程，但 JS（语言）不支持，WASM 提供了将此类 Go 程序转换为 JS 引擎可以理解的形式的潜力，而无需在 JS 语言本身中引入线程功能。


    换句话说，WASM 缓解了为 JS 添加功能的压力，而这些功能大部分/专门仅供从其他语言转译的程序使用。这意味着 JS 特性的开发可以由 TC39 进行判断，而不受到其他语言生态系统利益/需求的偏斜，同时让这些语言拥有进入
    Web 的可行路径。


    关于 WASM 的另一个视角正在浮现，有趣的是，它甚至不与 Web（W）直接相关。WASM 正在演变成某种跨平台的虚拟机（VM），程序可以在其中编译一次并在各种不同的系统环境中运行。


    因此，WASM 不仅用于 Web，而且 WASM 也不是 JS。


    讽刺的是，尽管 WASM 运行在 JS 引擎中，但 JS 语言是编写 WASM 程序最不合适的语言之一，因为 WASM 高度依赖静态类型信息。即使是 TypeScript
    (TS)——表面上是静态类型——（目前）也不太适合转译为M，尽管像 AssemblyScript 这样的语言变体试图弥补 JS/TS 与 WASM 之间的差距。


    这本书不是关于 WASM 的，所以我不会再花很多时间讨论它，除非说明最后一点。有些人建议 WASM 指向了一个 JS 在 Web 中被剔除或最小化的未来。这些人通常对
    JS 怀有恶意，想要用另一种语言——任何其他语言！来取代它。由于 WASM 让其他语言能够在 JS 引擎中运行，从表面上看这并不是完全虚幻的童话。


    我只需简单说明：WASM 不会取代 JS。WASM 显著增强了 Web（包括 JS）能够实现的能力。这是一件很好的事情，与人们是否会将其作为逃避编写 JS
    的出口无关。


    # 严格来说 (Strictly Speaking)


    回到 2009 年 ES5 发布时，JS 增加了严格模式作为一种鼓励编写更好 JS 程序的开启机制。


    严格模式的益处远大于代价，但旧习惯难以改变，且现有（即“遗留”）代码库的惯性很难被打破。遗憾的是，在 10 年后的今天，严格模式的可选项性意味着它对 JS
    程序员来说仍然不是默认设置。


    # 第一章：什么是 JavaScript？


    为什么是严格模式？严格模式不应被视为对你不能做什么的限制，而应被视为一种最佳实践指南，以便 JS 引擎有最好的机会优化和高效运行代码。大多数 JS 代码是由开发者团队维护的，因此严格模式的严谨性（以及
    linter 等工具！）通过避免非严格模式下漏掉的一些更有问题的错误来帮助代码协作。


    大多数严格模式控制以早期错误的形式出现，即并非严格的语法错误，但在编译阶段（代码运行之前）抛出的错误。例如，严格模式不允许对两个函数参数重名，这会导致早期错误。其他严格模式控制仅在运行时可见，就像这样。


    '
