    # The Rabbit Hole Deepens


    As promised at the top of this chapter, we just glanced over a wide surface area
    of the main parts of the JS language. Your head may still be spinning, but that''s
    entirely natural after such a firehose of information!


    Even with this “brief” survey of JS, we covered or hinted at a ton of details
    you should carefully consider and ensure you are comfortable with it. I''m serious
