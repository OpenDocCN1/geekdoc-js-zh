    # this Keyword


    One of JS’s most powerful mechanisms is also one of its most misunderstood: this
    keyword. One common misconception is that a function’s this refers to the function
    itself. Because of how this works in other languages, another misconception is
    that this points the instance that a method belongs to. Both are incorrect.


    As discussed previously, when a function is defined, it is attached to its enclosing
    scope via closure. Scope is the set of rules that controls how references to variables
    are resolved.


    But functions also have another characteristic besides their scope that influences
    what they can access. This characteristic is best described as an execution context,
    and it’s exposed to the function via its this keyword.


    Scope is static and contains a fixed set of variables available at the moment
    and location you define a function, but a function’s execution context is dynamic,
    entirely dependent'
