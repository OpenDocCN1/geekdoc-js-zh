    # You Don’t Know JS Yet: Get Started'
- md: '

    I''m so glad you''re embarking on this journey, and I am so honored you would
    consider and consult these books along the way. It''s time to start getting to
    know JS.


    # Chapter 1: What Is JavaScript?


    You don''t know JS, yet. Neither do I, not fully anyway. None of us do. But we
    can all start getting to know JS better.


    In this first chapter of the first book of the You Don''t Know JS Yet (YDKJSY)
    series, we will take some time to build a foundation to move forward on. We need
    to start by covering some important background housekeeping details, clearing
    up some myths and misconceptions about what the language really is (and isn''t!).


    This is valuable insight into the identity and process of how JS is organized
    and maintained; all JS developers should understand it. If you want to get to
    know JS, this is how to get started taking the first steps in that journey.


    ## About This Book


    I emphasize the word journey because knowing JS is not a destination, it''s a
    direction. No matter how much time you spend with the language, you will always
    be able to find something else to learn and understand a little better. So don''t
    look at this book as something to rush through for a quick achievement. Instead,
    patience and persistence are best as you take these few steps.


    Following this background chapter, the rest of the book lays out a high-level
    map of what you will find as you dig into and study JS with the YDKJSY books.


    In particular, Chapter 4 identifies three main pillars around which the JS language
    is organized: scope/closures, prototype objects, and types/coercion. JS is a broad
    and sophisticated language, with many features and capabilities. But all of JS
    is founded on these three foundational pillars.


    Keep in mind even though this book is titled “Get Started,” it''s not intended
    to be a beginner/intro book. This book’s main job is to get you ready for studying
    JS deeply throughout the rest of the series; it''s written assuming you already
    have familiarity with JS over at least several months experience before moving
    on in YDKJSY. So to get the most out of Get Started, make sure you spend plenty
    of time writing JS code to build up your experience.


    Even if you''ve already written a lot of JS before, this book should not be skim
    over or skipped; take your time to fully process the material here. A good start
    always depends on a solid first step.


    ## What''s With That Name?


    The name JavaScript is probably the most misunderstood programming language name.


    Is this language related to Java? Is it only the script form for Java? Is it only
    for writing scripts and not real programs?


    The truth is, the name JavaScript is an artifact of marketing shenanigans. When
    Brendan Eich first conceived of the language, he code-named it Mocha. Internally
    at Netscape, the brand LiveScript was used. But when it came time to publicly
    name the language, "JavaScript" won the vote.


    Why? Because this language was originally designed to appeal to an audience of
    mostly Java programmers, and because the word "script" was popular at the time
    to refer to lightweight programs. These lightweight "scripts" would be the first
    ones to embed inside of pages on this new thing calling the web!


    In other words, JavaScript was a marketing ploy to try to position this language
    as a palatable alternative to writing the heavier and more well-known Java of
    the day. It could just as easily have been called "WebJava," for that matter.


    There are some superficial resemblances between JavaScript''s code and Java code.
    Those similarities don''t particularly come from shared development, but from
    both languages targeting developers with assumed syntax expectations from C (and
    to an extent, C++).


    For example, we use the { to begin a block of code and the } to end that block
    of code, just like C/C++ and Java. We also use the ; to punctuate the end of a
    statement.


    In some ways, legal relationships run even deeper than the syntax. Oracle (via
    Sun), the company that still owns and runs Java, also owns the official trademark
    for the name "JavaScript" (via Netscape). This trademark is almost never enforced,
    and likely couldn''t be at this point.


    For these reasons, some have suggested we JS instead of JavaScript. That is a
    very common shorthand, if not a good candidate for an official language branding
    itself. Indeed, these books use JS almost exclusively to refer to the language.


    Further distancing the language from the Oracle-owned trademark, the official
    name of the language specified by TC39 and formalized by the ECMA standards body
    is ECMAScript. And indeed, since 2016, the official language name has also been
    suffixed by the revision year; as of this writing, that''s ECMAS2019, or otherwise
    abbreviated ES2019.


    In other words, the JavaScript/JS that runs in your browser or in Node.js, is
    an implementation of the ES2019 standard.


    ## Note


    > Don''t use terms like "JS6" or "ES8" to refer to the language. Do not, but those
    terms only perpetuate confusion, "ES20xx" or just "JS" are what you should stick
    to.


    Whether you call JavaScript, ECMAScript, or ES2019, it''s most definitely not
    a variant of the Java language!


    > "Java is to JavaScript as ham is to hamster." - Jeremy Keith, 2009


    ## Language Specification


    I mentioned TC39, the steering committee that manages JS. TC39 is comprised of
    between 50 and 100 different people from browser and device makers. They meet
    generally every other month, usually for three days, to review work and vote on
    proposals.


    All proposals progress through a five-stage process. You can read more about the
    process here: https://tc39.es/process-document/


    Stage 0 means someone on TC39 thinks it’s a worthy idea and plans to champion
    it. You have to get a TC39 member to champion a proposal for it to be considered
    “Stage 0” officially.


    Once a proposal reaches “Stage 4” status, it is eligible to be included in the
    next revision of the language. It can take anywhere from several months to a few
    years for a proposal to work through these stages.


    All proposals are managed in the open on TC39’s Github: https://github.com/tc39/proposals


    Anyone, whether on TC39 or not, is welcome to participate in these public discussions
    and the processes for working on proposals. However, only TC39 members can attend
    meetings and vote on the proposals and changes.


    Contrary to some established and frustrating myth, there are not multiple versions
    of JavaScript in the wild. There''s just one JS, the official standard as maintained
    by TC39 and ECMA.


    Back in the early 2000s, when Microsoft maintained a forked and reverse-engineered
    (and not entirely compatible) version of JS called “Script,” there were legitimately
    “multiple versions” of JS. But those days are long gone. It''s outdated and inaccurate
    to make such claims about JS today.


    All major browsers and device makers have committed to keeping their JS implementations
    compliant with this one central specification. Of course, engines implement features
    at different times. But it should never be the case that the v8 engine (Chrome’s
    JS engine) implements a specified feature differently or incompatibly as compared
    to the SpiderMonkey engine (Mozilla’s JS engine).


    That means you can learn one JS, and rely on that same JS everywhere.

