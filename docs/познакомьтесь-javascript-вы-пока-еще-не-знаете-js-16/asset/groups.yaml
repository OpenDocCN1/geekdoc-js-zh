    [content]

    因为正如我自己发现的，你可能（还不）了解 JavaScript。


    ~~


    Brian Holt

    高级项目经理

    Azure 上 Visual Studio Code 和 Node.js

    Microsoft


    # 前言


    欢迎阅读广受赞誉的《你不知道 JavaScript》(You Don’t Know JS, YDKJS) 系列第二版：《你尚未懂 JavaScript》(You
    Don’t Know JS Yet, YDKJSY)。


    如果你读过第一版的任何一本书，你可以期待在这些新书中看到一种全新的方法，其中包含了对过去五年中 JS 变化之处的大量更新覆盖。但我希望并相信，你仍将获得同样的承诺：尊重
    JS，并深入挖掘其真正运行的原理。


    如果这是你第一次阅读这些书籍，我很高兴你在这里。准备好开启进入 JavaScript 每一个角落的深邃而广阔的旅程吧。


    如果你是编程或 JS 的新手，请注意，这些书籍并不打算作为一份温和的“JavaScript 入门”。这些内容有时是复杂且具有挑战性的，并且比通常初次学者的水平要深得多。无论你的背景如何，我们都欢迎你，但这些书籍的编写假设你已经熟悉
    JS，并且至少有 6 到 9 个月的经验。


    # 各部分


    这些书籍对待 JavaScript 的方式与《优秀的部分》(The Good Parts) 对待该语言的方式完全相反。不，这并不意味着我们正在看糟糕的部分，而是探索所有的部分。


    你可能被别人告诉过，或者自己感觉到，JS 是一种有深度缺陷的语言，设计糟糕且实现上不一致。许多人声称它是世界上最糟糕且最流行的语言；没有人写 JS 是因为他们想写，仅仅是因为它处于
    Web 世界的中心，不得不写。这是一个荒谬、不健康且完全傲慢的论点。


    数百万开发者每天都在编写 JavaScript，其中许多人都欣赏并尊重这门语言。


    就像任何伟大的语言一样，它既有精辟的部分，也有伤疤。即使是 JavaScript 的创始人 Brendan Eich 自己也对其中某些部分叹息为错误。但他错了：它们根本不是错误。JS
    之有今天今天——成为世界上无处不在且影响最大的编程语言——正是因为了所有的部分。


    不要相信那种谎言，认为你应该只学习和使用一小部分优秀的内容，而避开所有坏东西。不要相信那种“X 是新的 Y”的江湖骗，认为语言的某项新功能会瞬间让之前功能的所有用法变得过时且无知。当有人说你的代码不“现代”，是因为它还没有使用一个几周前才提出的阶段
    0 特性时，请不要听他们的！


    JS 的每一个部分都是用的。某些部分比其他部分更有用。某些部分要求你更加小心和有针对性。


    我发现，只使用该语言所提供的极小部分就试图成为一个真正有效的 JavaScript 开发者是荒谬的。你能想象一个工具箱装满工具的建筑工人，只用他的锤子，并嘲笑螺丝刀或卷尺很低级吗？那太愚蠢了。我不保留地认为，你应该去学习
    JavaScript 的所有部分，并在适当的地方使用它们！如果我足够大胆地建议的话：是时候抛弃任何告诉你相反意见的 JS 书籍了。


    # 标题


    那么，这个系列的标题到底是什么意思？


    我并不是通过批评你目前对 JavaScript 缺乏知识或理解来侮辱你。我不是在暗示你不能或不会学习 JavaScript。我不是在吹嘘某种只有我和极少数人拥有的秘密高级内部智慧。


    说认真的，在人们阅读书籍之前，所有这些都是对原始系列标题的真实反应。而且它们是没有根据的。


    “你尚未懂 JavaScript”这个标题的主要要点在于，大多数 JS 开发者并没有花时间去真正理解他们写的代码是如何运行的。他们知道它是通的——它产生了预期的结果。但他们要么不清楚具体是如何运行的，更糟的是，在近距离观察时，对它如何出错有一套不准确的心理模型。


    我正在向读者提出一个温和但诚恳的挑战：放下你对 JS 的假设，用全新的眼光和被激发的好奇心来面对它，这种好奇心将引导你为你写的每一行代码提问。为什么它要那样做？为什么其中这种方式比你可能完成任务的另外六种方式更好或更合适？


    为什么所有的“大红人”都说对你的代码要执行 X，但事实证明 Y 可能是更好的选择？


    我在标题中加入了“Yet（尚未）”，不仅是因为它是第二版，还因为我最终我希望这些书籍能以一种充满希望而非沮丧的方式来挑战你。


    但让我明确一点：我不认为可能完全了解 JS。那不是一种可以获得的成就，而是一个需要努力追求的目标。你不会结束对 JS 的所有了解，你只是随着与这门语言相处的时间增加而不断学习更多。钻得越深，你就越会重新审视以前的知识，并从那个更有经验的视角重新学习它。


    我鼓励你针对 JavaScript，事实上是针对整个软件开发，采取一种心态：你永远无法完全精通它，但你并且应该继续努力以接近那个目标，这段旅程将贯穿你的整个软件开发生涯乃至未来。


    你总是可以比现在更了解 JS。这就是我希望这些 YDKJSY 书籍所代表的。


    # 任务


    其实并不需要论证开发者为什么要认真对待 JS——我认为没必要。我并不是说开发者应该认真对待 JS 的理由。但我需要一个不同的、更重要的理由来论证这一点，而且这些书籍是为了帮助你面临的挑战。


    '
