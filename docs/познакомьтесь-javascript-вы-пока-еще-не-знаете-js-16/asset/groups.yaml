    # 第 1 章：什么是 JavaScript？


    你还不了解 JS。我也不了解，至少没有完全了解。我们大家都不。但我们都可以开始更深入地了解 JS。


    在《你不知道 JS》（You Don''t Know JS Yet，简称 YDKJSY）系列的第一本书的第一章，我们将花一些时间建立一个基础，以便继续前进。我们需要首先从涵盖一些重要的背景准备工作开始，消除一些关于这种语言真实本质（以及不是什么！）的迷思和误解。


    这是对 JS 如何组织和维护的身份及过程的宝贵见解；所有的 JS 开发者都应该理解它。如果你想了解 JS，这就是在这段旅程中迈第一步的方式。


    ## 关于本书


    我强调“旅程”这个词，因为了解 JS 不是一个终点，而是一个方向。无论你在这个语言上花费了多少时间，你总能发现其他需要学习和稍加理解的内容。所以，不要把这本书看作是为了快速获得成就而匆忙读完的东西。相反，在你迈这几步时，耐心和坚持是最好的选择。


