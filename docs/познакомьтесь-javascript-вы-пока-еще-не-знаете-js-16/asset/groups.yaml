    }\n```\n\n虽然这些方法是消费迭代器的方便方式，但理解它们的底层工作原理至关重要。当你需要创建自己的可迭代对象和迭代器时，这将对帮助。\n\n##\
    \ 可迭代对象\n\n可迭代对象（iterable）是任何可以被迭代的对象。这意味着该对象有一个键为 `Symbol.iterator` 的方法，该方法返回一个迭代器对象。\n\
    \nJS 中常见的可迭代对象包括：\n\n- 数组\n- Sets\n- Maps\n- 字符串\n- NodeLists（在浏览器中）\n\n迭代器是一个具有\
    \ `next()` 方法的对象。`next()` 方法返回一个带有两个属性的对象：`value`（当前值）和 `done`（布尔值）。\n\n以下是一个创建自定义可迭代对象的示例：\n\
