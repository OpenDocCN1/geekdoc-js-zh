  - '[PAGE 49]


    # Chapter 1: What Is JavaScript?


    Why strict mode? Strict mode shouldn''t be thought of as a restriction on what
    you can''t do, but rather as a guide to the best way to do so that the JS engine
    has the best chance of optimizing and efficiently running the code. Most JS code
    is worked on by teams of developers, so the strictness of strict mode (along with
    tooling like linters!) often helps collaboration on code by avoiding some of the
    more problematic mistakes that slip by in non-strict mode.


    Most strict mode controls are in the form of early errors, meaning errors that
    aren''t strictly syntax errors but are still thrown at compile time (before the
    code is run). For example, strict mode disallows naming two function parameters
    the same, and results in an early error. Some other strict mode controls are only
    observable at runtime, such as how this defaults to undefined instead of the global
    object.


    Rather than fighting and arguing with strict mode, like a kid who just wants to
    defy whatever their parents tell them not to do, the best mindset is that strict
    mode is like a linter reminding you how JS should be written to have the highest
    quality and best chance at performance. If you find yourself handicapped, trying
    to work around strict mode, that should be a blaring red warning flag that you
    need to back up and rethink the whole approach.


    Strict mode is switched on per file with a special pragma (nothing allowed before
    it except comments/whitespace):


    ```

    // only whitespace and comments are allowed

    // before the use-strict pragma

    "use strict";

    // the rest of the file runs in strict mode

    ```'
  - "[PAGE 50]\n\n# Warning\n\nSomething to be aware of is that even a stray; all\
    \ by itself appearing before the strict mode pragma will render the pragma useless;\
    \ no errors are thrown because it's valid JS to have a string literal expression\
    \ in a statement position\n\nStrict mode can alternatively be turned on per-function\
    \ scope, with exactly the same some rules about its surroundings:\n\n```\nfunction\
    \ someOperations() {\n  // whitespace and comments are fine here\n  \"use strict\"\
    \n  // all this code will run in strict mode\n}\n```\n\nInterestingly, if a file\
    \ has strict mode turned on, the function-level strict mode pragmas are disallowed.\
    \ So you have to pick one or the other.\n\nThe only valid reason to use a per-function\
    \ approach to strict mode is when you are converting an existing non-strict mode\
    \ program file and need to make the changes little by little over. Otherwise,\
    \ it's vastly better to simply turn strict mode on for the entire file/program.\n\
    \nMany have wondered if there would ever be a time when JS made strict mode the\
    \ default? The answer is, almost certainly not. As we discussed earlier around\
    \ backwards compatibility, if a JS engine updated assuming code was strict mode\
    \ even if it's not marked as such, it's possible that this code would break as\
