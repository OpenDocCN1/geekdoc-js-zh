  mdcn: "\n你可以根据需要接收任意数量的参数，从零到多个不等。每个参数都被分配你在调用时在该位置传递的参数值（在此处为 \"Kyle\"）。\n\n函数还可以使用\
    \ `return` 关键字返回值：\n\n```javascript\nfunction greeting(myName) {\n    return `Hello,\
    \ ${myName}`;\n}\n```\n\n```javascript\nvar msg = greeting(\"Kyle\");\n\nconsole.log(msg);\
    \    // Hello, Kyle!\n```\n\n你只能返回一个值，但如果你有更多值要返回，可以将它们封装成一个单一的对象/数组。\n\n由于函数是值，它们可以赋值为对象的属性：\n\
    \n```javascript\nvar setToSay = {\n    greeting() {\n        console.log(\"Hello!\"\
    );\n    },\n    question() {\n        console.log(\"What's your name?\");\n  \
