  - '[PAGE 84]


    existing *classic modules* just described, especially taking into account important
    variations and use cases from AMD, UMD, and CommonJS.


    The implementation approach does, however, differ significantly.


    First, there''s no wrapping function to *define* a module. The wrapping context
    is a file. ESMs are always file-based; one file, one module.


    Second, you don''t interact with a module’s “API” explicitly, but rather use the
    export keyword to add a variable or method to its public API definition. If something
    is defined in a module but not exported, then it stays hidden (just as with *classic
    modules*).


    Third, and maybe noticeably different from previously discussed patterns, you
    don’t “instantiate” an ES module, you just import it to use its single instance.
    ESMs are, in effect, “singletons,” in that there''s only one instance ever created,
    at first import in your program, and all imports just receive a reference to that
    same single instance. If your module needs to support multiple instantiations,
    you have to provide a *classic module-style* factory function on your ESM definition
    for that purpose.


    In our running example, we do assume multiple-instantiation, so these following
    snippets will mix both ESM and *classic modules*.


    Consider the file publication.js:'
