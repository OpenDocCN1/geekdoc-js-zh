    let myName = \"Kyle\"\nlet age;\n\nYou Don’t Know JS Yet: Get Started\n\n39\n\n\
    Converting from one value type to another, such as from string to number, is referred\
    \ to in JS as “coercion.” We’ll cover this in more detail later in this chapter.\n\
    \nPrimitive values and object values behave differently when they’re assigned\
    \ or passed around. We’ll cover these details in Appendix A, \"Values vs References.\"\
    \n\n## Declaring and Using Variables\n\nTo be explicit about something that may\
    \ not have been obvious in the previous section: in JS programs, values can either\
    \ appear as literal values (as many of the preceding examples illustrate), or\
    \ they can be held in variables; think of variables as just containers for values.\n\
    \nVariables have to be declared (created) to be used. There are various syntax\
    \ forms that declare variables (aka, “identifiers”), and each form has different\
    \ implied behaviors.\n\nFor example, consider the var statement:\n\n```javascript\n\
    var myName = \"Kyle\"\nvar age;\n```\n\nThe var keyword declares a variable to\
    \ be used in that part of the program, and optionally allows initial value assignment.\n\
    \nAnother similar keyword is let:\n\n```javascript\nlet myName = \"Kyle\"\nlet\
    \ age;\n```\n\nYou Don’t Know JS Yet: Get Started\n\n## Chapter 2: Surveying JS\n\
    \nThe let keyword has some differences to var, with the most obvious being that\
    \ let allows a more limited access to the variable name than var. This is called\
    \ “block scoping” as opposed to regular or function scoping.\n\nConsider:\n\n\
    ```javascript\nvar adult = true;\n\nif (adult) {\n  var myName = \"Kyle\"\n  let\
    \ age = 39;\n  console.log(\"Shhh, this is a secret!\");\n}\n\nconsole.log(myName);\n\
    // Kyle\n\nconsole.log(age);\n// Error!\n```\n\nThe attempt to access age outside\
    \ of the if statement results in an error, because age was block-scoped to the\
    \ if, whereas myName was not.\n\nBlock-scoping is very useful for limiting how\
    \ widespread variable declarations are in our programs, which helps prevent accidental\
    \ overlap of their names.\n\nBut var is still useful in that it communicates “this\
    \ variable will be seen by a wider scope (the whole function)”. Both declaration\
    \ forms can be appropriate in any given part of a program, depending on the circumstances.\n\
    \n## Note\n\nIt's very common to suggest that var should be avoided in favor of\
    \ let (or const!), generally because of perceived confusion over how the scoping\
    \ behavior of var has worked since the beginning of JS. I believe this to be overly\
    \ restrictive advice and ultimately unhelpful. It's assuming you are unable to\
    \ learn and use a feature properly in combination with other features. I believe\
    \ you should learn any features available, and use them where appropriate!\n\n\
    A third declaration form is const. It's like let but has an additional limitation\
    \ that it must be given a value at the moment it's declared, and cannot be re-assigned\
    \ a different value later.\n\nConsider:\n\n```javascript\nconst myBirthday = true;\n\
    let age = 39;\nif (myBirthday) {\n  age = age + 1; // OK!\n  myBirthday = false;\
    \ // Error!\n}\n```\n\nThe myBirthday constant is not allowed to be re-assigned.\
    \ const declared variables are not “unchangeable”, they just cannot be re-assigned.\
    \ It's ill-advised to use const with object values, because those values can still\
    \ be changed even though the variable can.\n\n## Tip\n\nIf you want to use an\
    \ object or an array with const, you can still mutate its contents:\n\n```javascript\n\
    const obj = { a: 1 };\nobj.a = 2; // OK!\n\nconst arr = [1, 2];\narr.push(3);\
    \ // OK!\n```\n\n## Functions\n\nThe word \"function\" has a variety of meanings\
    \ in programming. For example, in the world of Functional Programming, \"function\"\
    \ has a precise mathematical definition and implies a strict set of rules.\n\n\
    In JS, we should consider “function\" to take the broader meaning of another term:\
    \ “procedure.” A procedure is a collection of statements that can be invoked one\
    \ more times, may be provided some inputs, and may give back one more outputs.\n\
    \nFrom the early days of JS, function definition looked like:\n\n```javascript\n\
    function awesomeFunction(coolThings) {\n  ..\n  return amazingStuff;\n}\n```\n\
    \nThis is called a function declaration because it appears as a statement by itself,\
    \ not as an expression.\n\nIn contrast to a function declaration statement, a\
    \ function expression can be defined and assigned like this:\n\n```javascript\n\
    // let awesomeFunction = ..\n// const awesomeFunction = ..\nvar awesomeFunction\
    \ = function(coolThings) {\n  ..\n  return amazingStuff;\n}\n```\n\nThis function\
    \ is an expression that is assigned to the variable awesomeFunction. Different\
    \ from the function declaration form, a function expression is not associated\
    \ with its identifier until that statement runtime.\n\nJS functions can receive\
    \ parameter input:\n\n```javascript\nfunction greeting(myName) {\n  console.log(`Hello,\
    \ ${myName}!`);\n}\n```\n\ngreeting(\"Kyle\"); // Hello, Kyle!\n\nIn this snippet,\
    \ myName is called a parameter, which acts as a local variable inside the function.\
    \ Functions can be defined\n"
  mdcn: "\n\n## 数组与对象\n\n除了原始类型外，JS 中的另一种值类型是对象值。\n\n如前面提到的，数组是一种特殊的对象类型，由一个有序且通过数字索引的数据列表组成：\n\
    \n```javascript\nvar names = [ \"Frank\", \"Kyle\", \"Peter\", \"Susan\" ];\n\
    names.length;\n// 4\nnames[0];\n// Frank\nnames[1];\n// Kyle\n```\n\nJS 数组可以包含任何值类型，无论是原始类型还是对象（包括其他数组）。正如我们在第\
    \ 3 章末尾看到的，即使是函数也是可以存储在数组或对象中的值。\n\n> 注意\n> 函数和数组一样，是对象的特殊类型（也称为子类型）。我们稍后会详细介绍函数。\n\
    \n对象更具通用性：它是一个任何值的无序的、键键的集合。换句话说，你通过字符串位置名称（即“键”或“属性”）来访问元素，而不是它的数字位置（如数组）。例如：\n\
    \n```javascript\nvar me = {\n  first: \"Kyle\",\n  last: \"Simpson\",\n  age:\
    \ 39,\n  specialties: [\"JS\", \"Table Tennis\"]\n}\n\nconsole.log(`My name is\
    \ ${me.first}.`);\n```\n\n这里，me 代表一个对象，first 代表该对象中信息的位置。另一种通过属性/键访问对象信息的语法使用方括号\
    \ [ ]，例如 me[\"first\"]。\n\n## 值类型确定\n\n为了区分值，`typeof` 运算符可以告诉你它的内置类型、原始类型，否则返回\
    \ \"object\"：\n\n```javascript\ntypeof 42; // \"number\"\ntypeof \"abc\"; // \"\
    string\"\ntypeof true; // \"boolean\"\ntypeof undefined; // \"undefined\"\ntypeof\
    \ null; // \"object\" -- 噢，Bug！\ntypeof {\"a\": 1}; // \"object\"\ntypeof [1,2,3];\
    \ // \"object\"\ntypeof function hello(){}; // \"function\"\n```\n\n> 警告\n> `typeof\
    \ null` 遗憾地返回 \"object\" 而不是预期的 \"null\"。此外，typeof 对函数返回特定的 \"function\"，但对数组不是预期的\
    \ \"array\"。\n\n你还不了解 JS：入门\n\n39\n\n从一种值类型转换为另一种值类型（例如从字符串转换为数字）在 JS 中被称为“强制类型转换”（coercion）。我们将在本章稍后的部分详细介绍这一点。\n\
    \n原始值和对象值在被赋值或传递时表现有所不同。我们将在附录 A，“值与引用”中介绍这些细节。\n\n## 声明和使用变量\n\n为了明确某些在上一节中可能并不显而易见的内容：在\
    \ JS 程序中，值可以以字面值的形式出现（如前面的许多示例所示），也可以存储在变量中；将变量想象为值的容器即可。\n\n变量必须声明（创建）后才能使用。有多种语法形式可以声明变量（即“标识符”），每种形式都有不同的隐含行为。\n\
    \n例如，考虑 `var` 语句：\n\n```javascript\nvar myName = \"Kyle\"\nvar age;\n```\n\n`var`\
    \ 关键字声明一个要在程序该部分使用的变量，并允许可选初始化赋值。\n\n另一个类似的关键字是 `let`：\n\n```javascript\nlet myName\
    \ = \"Kyle\"\nlet age;\n```\n\n你还不了解 JS：入门\n\n## 第 2 章：JS 概\n\n`let` 关键字与 `var`\
    \ 有一些不同，最明显的是 `let` 允许对变量名的访问范围比 `var` 更窄。这被称为“块作用域”（block scoping），区别于普通或函数作用域。\n\
    \n考虑：\n\n```javascript\nvar adult = true;\n\nif (adult) {\n  var myName = \"Kyle\"\
    \n  let age = 39;\n  console.log(\"嘘声，这是一个秘密！\")\n}\n\nconsole.log(myName);\n\
    // Kyle\n\nconsole.log(age);\n// 错误！\n```\n\n在 `if` 语句外部访问 `age` 会导致错误，因为 `age`\
    \ 被块作用域于 `if`，而 `myName` 没有。\n\n块作用域对于限制程序中变量声明的范围非常有用，这有助于防止名称意外重叠。\n\n但 `var`\
    \ 仍然有用，因为它传达了“此变量将在更广泛的作用范围内（整个函数）可见”。这两种声明形式在程序的任何部分都可能是合适的，取决于具体情况。\n\n## 注意\n\
    \n通常很建议避免使用 `var` 而使用 `let`（或 `const`！），这通常是因为人们认为 `var` 自 JS 诞生以来来的作用域行为模式令人困惑。我认为这种建议过于限制性，且最终没有帮助。它假设你无法与其他功能结合来正确学习和使用某个功能。我相信你应该学习任何可用的功能，并在适当的地方使用它们！\n\
    \n第三种声明形式是 `const`。它像 `let`，但有一个额外的限制：它在声明时必须被赋值，并且之后不能重新赋值不同的值。\n\n考虑：\n\n```javascript\n\
    const myBirthday = true;\nlet age = 39;\nif (myBirthday) {\n  age = age + 1; //\
    \ OK！\n  myBirthday = false; // 错误！\n}\n```\n\n`myBirthday` 常量不允许重新赋值。`const`\
    \ 声明的变量并不是“不可变的”，它们只是不能重新赋值。在对象值上使用 `const` 是不明智的，因为即使变量不能改变，这些值仍然可以改变。\n\n```javascript\n\
    const actors = [\n\"Morgan Freeman\",\n\"Jennifer Aniston\"\n];\n\nactors.push(\"\
