    \    `);\n  }\n}\n```\n\n这个 `Publication` 类定义了任何出版物都可能需要的通用行为。\n\n现在让我们考虑具体的类型，如\
    \ `Book` 和 `BlogPost`：\n\n```javascript\nclass Book extends Publication {\n  constructor(title,author,pubDate)\
    \ {\n    super(title,author,pubDate);\n    this.publisher = \"O'Reilly\";\n  }\n\
    \n  print() {\n    console.log(`Title: ${this.title}\n      By: ${this.author}\n\
    \      ${this.pubDate}\n      Publisher: ${this.publisher}\n    `);\n  }\n}\n\
    ```\n\n```javascript\nclass BlogPost extends Publication {\n  constructor(title,author,pubDate)\
    \ {\n    super(title,author,pubDate);\n    this.isbn = \"123-456789\";\n  }\n\n\
    \  print() {\n    console.log(`Title: ${this.title}\n      By: ${this.author}\n\
    \      ${this.pubDate}\n      ISBN: ${this.isbn}\n    `);\n  }\n}\n```\n\n```javascript\n\
    var book = new Book(\"You't Know JS\", \"Kyle S. Simpson\", \"2014\");\nbook.print();\n\
    \nvar post = new BlogPost(\"Surveying JS\", \"Author\", \"2023\");\npost.print();\n\
    ```\n\n注意两个类实例都有 `print()` 方法，这是对继承自 `print()` 方法的重写。每个重写的子类 `print()` 方法都调用了\
    \ `super.print()` 来调用继承的版本。\n\n继承和重写方法具有相同名称并共存的事实被称为多态。\n\n继承是一种强大的工具，用于在独立的逻辑单元（类）中组织数据/行为，同时允许子类通过访问/使用父类进行协作。\n\
    \n## 模块\n\n模块模式的目标与类模式本质上相同，即将数据和行为组合成逻辑单元。像类一样，模块为了协作也可以“包含”或“访问”其他模块的数据和行为。\n\
    \n但模块与类有一些重要的区别。最明显的是语法完全不同。\n\n## 经典模块\n\nES6 增加了模块语法以形成原生 JS 语法。但从 JS 早期开始，模块就是一个重要且常见的模式，被无数\
    \ JS 程序利用，即使没有专门的语法。\n\n经典模块的主要特征是一个外层函数（至少运行一次），该函数返回一个模块的“实例”，该实例暴露了一个或多个可以操作模块实例内部（隐藏）数据的函数。\n\
    \n由于这种形式的模块只是函数，且调用它会产生模块的“实例”，因此这些函数的另一种描述是“模块工厂”。\n\n考虑之前 `Publication`、`Book`\
    \ 和 `BlogPost` 类的经典模块形式：\n\n"
