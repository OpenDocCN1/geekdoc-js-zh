  - '[PAGE 30]


    Various JS environments (like browser JS engines, Node.js, etc.) add APIs into
    the global scope of your JS programs that give you environment-specific capabilities,
    like being able to pop an alert-style box in the user''s browser.


    In fact, a wide range of JS-looking APIs, like fetch(..), getCurrentLocation(..),
    and getUserMedia(..), are all web APIs look like JS. In Node.js, we can access
    hundreds of API methods from various built-in modules, fs.write(..).


    Another common example is console.log(..) (and all the other console.* methods!).
    These are not specified in JS, but because of their universal utility they are
    defined by pretty much every JS environment, according to a roughly agreed consensus.


    So alert(..) and console.log(..) are not defined by JS. But they look like JS.
    They are functions and object methods and obey JS syntax rules. The behaviors
    behind them are controlled by the environment running the JS engine, but on the
    surface they definitely have to abide by JS to be able to play in the JS playground.


    Most of the cross-browser differences people complain with “JS is so inconsistent!”
    claims are actually due to differences in how those environment behaviors work,
    not in how the JS itself works.


    So an alert(..) call is JS, but alert itself is really just a guest, not part
    of the official JS specification.


