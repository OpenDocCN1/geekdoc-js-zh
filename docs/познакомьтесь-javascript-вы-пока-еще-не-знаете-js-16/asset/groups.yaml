    \ { done: true };\n    }\n  }\n};\n\nconsole.log(myIterator.next().value); //\
    \ 0\nconsole.log(myIterator.next().value); // 1\nconsole.log(myIterator.next().value);\
    \ // 2\nconsole.log(myIterator.next().done); // true\n```\n\n"
