  - '[PAGE 60]


    39


    Converting from one value type to another, such as from string to number, is referred
    to in JS as “coercion.” We’ll cover this in more detail later in this chapter.


    Primitive values and object values behave differently when they’re assigned or
    passed around. We’ll cover these details in Appendix A, "Values vs References."


    # Declaring and Using Variables


    To be explicit about something that may not have been obvious in the previous
    section: in JS programs, values can either appear as literal values (as many of
    the preceding examples illustrate), or they can be held in variables; think of
    variables as just containers for values.


    Variables have to be declared (created) to be used. There are various syntax forms
    that declare variables (aka, “identifiers”), and each form has different implied
    behaviors.


    For example, consider the var statement:


    ```

    var myName = "Kyle"

    var age;

    ```


    The var keyword declares a variable to be used in that part of the program, and
    optionally allows initial value assignment.


    Another similar keyword is let:


    ```

    let myName = "Kyle"

    let age;

    ```


