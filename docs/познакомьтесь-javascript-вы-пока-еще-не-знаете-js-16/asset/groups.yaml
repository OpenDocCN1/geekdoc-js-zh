    # Web Assembly (WASM)


    One dominating concern that has driven a significant amount of JS''s evolution
    is performance, both how quickly JS can be parsed/compiled and how quickly that
    compiled code can be executed.


    2013, engineers from Mozilla Firefox demonstrated a port of the Unreal 3 game
    engine from C to JS. The ability for this code to run in a browser JS engine at
    full 60fps performance was predicated on a set of optimizations that the JS version
    of the Unreal engine''s code used a style of code that favored a subset of the
    JS language, named "ASM.js".


    This subset is valid JS written in ways that are somewhat uncommon in normal coding,
    but which signal certain important typing information to the engine that allow
    it to make key optimizations. ASM.js was introduced as one way of addressing the
    pressures on the runtime performance of JS.


    But it''s important to note that ASM.js was never intended to be code that was
    authored by developers, but rather a representation of a program having been transpiled
    from another language (such as C), where these typing “annotations” were inserted
    automatically by the tooling.


    Several years after ASM.js demonstrated the validity of tool-creating versions
    of programs that can be processed more efficiently by the JS engine, another group
    of engineers (also, initially, from Mozilla) released Web Assembly (WASM).


    WASM is similar to ASM.js in that its original intent was to provide a path for
    non-JS programs (C, etc.) to be converted to a form that could run in the JS engine.
    Unlike ASM.js, WASM chose to additionally get around some of the inherent delays'
