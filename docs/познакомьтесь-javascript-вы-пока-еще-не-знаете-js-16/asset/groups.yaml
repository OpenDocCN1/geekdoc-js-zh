    \ `1 < 500`、`10 < 500`、`100 < 500` 以及 `1000 < 500`。由于第四个为假，循环在第三次迭代后停止。\n\n这些关系运算符通常使用数值比较，除非比较的两个值已经是字符串的情况；在这种情况下，它们对字符串进行字母顺序（类似字典的）比较：\n\
    \n```javascript\nvar x = \"10\";\nvar y = \"9\";\n\nx < y; // true，注意！\n```\n\n\
    没有办法可以让这些关系运算符避免类型转换，除非在比较中使用了不匹配的类型。这作为一个目标或许值得赞赏，但你很可能仍然遇到类型不同的情况。\n\n更明智的方法不是避免强制转换比较，而是拥抱并学习它们的内部细节。\n\
    \n《你还不懂 JS：入门》(You Don’t Know JS Yet: Get Started)\n\n强制转换比较出现在 JS 的其他地方，例如条件语句\
    \ (`if` 等），我们将在附录 A “强制转换条件比较”中重新回顾它们。\n\n## 我们如何在 JS 中组织代码\n\n组织代码（数据和行为）的两种主要模式广泛应用于整个\
    \ JS 生态系统：类（classes）和模块（modules）。这些模式并不是互斥的；许多程序可以并且确实同时使用这两者。其他程序将只坚持使用一种模式，甚至两种都不用！\n\
    \n在某些方面，这些模式非常不同。但有趣的是，在其他方面，它们只是同一枚硬币的两面。精通 JS 需要理解这两种模式以及它们的适用场景（以及不适用场景）。\n\
    \n## 类\n\n“面向对象”、“面向类”和“类”这些术语都包含了大量的细节和细微差别；它们在定义上并不是通用的。\n\n我们在这里使用一个通用且略带传统的定义，这个定义最可能让具有\
