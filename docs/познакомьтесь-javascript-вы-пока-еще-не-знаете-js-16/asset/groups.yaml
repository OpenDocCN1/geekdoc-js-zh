    \ let count = 0;\n    return {\n      next: function() {\n        if (count <\
    \ 3) {\n          return { value: count++, done: false };\n        } else {\n\
    \          return { done: true };\n        }\n      }\n    };\n  }\n};\n\nfor\
    \ (const value of myIterable) {\n  console.log(value);\n}\n```\n\n## 自定义迭代器\n\n\
    你也可以在不创建完整可迭代对象的情况下创建自定义迭代器。迭代器只是一个具有 `next()` 方法的对象。\n\n```javascript\nconst\
