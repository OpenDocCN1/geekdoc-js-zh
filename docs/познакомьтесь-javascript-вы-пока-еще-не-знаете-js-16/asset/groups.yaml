  - '[PAGE 34]


    # Backwards & Forwards


    One of the most foundational principles that guides JavaScript is preservation
    of backwards compatibility. Many are confused by the implications of this term,
    and often confuse it with a related but different term: forwards compatibility.


    Let’s set the record straight.


    Backwards compatibility means that once something is accepted as valid JS, there
    will not be a future change to the language that causes that code to become invalid
    JS. Code written in 1995—however primitive or limited it may have been!—should
    still work today. As TC39 members often proclaim, “we do not break the web”


    The idea is that JS developers can write code with confidence that their code
    won’t stop working unpredictably because a browser update is released. This makes
    the decision to choose JS for a program a wise and safe investment, for years
    into the future.


    “guarantee” is no small thing. Maintaining backwards compatibility, stretched
    out across almost 25 years of the language’s history, creates an enormous burden
    and a whole slew of unique challenges. You’d be hard pressed to find many other
    examples in computing of such a commitment to backwards compatibility.


    The costs of sticking to this principle should not be casually dismissed. It necessarily
    creates a very high bar to including changing or extending the language; any decision
    becomes effectively permanent, mistakes and all. Once it’s in JS, it can’t be
    taken out because it might break programs, even if we’d really, really like to
    remove it!'
