  - '[PAGE 51]


    However, there are a few factors that reduce the future impact of this non-default
    “obscurity” of strict mode.


    For one, virtually all transpiled code ends up in strict mode even if the original
    source code isn''t written as such. Most JS code in production has been transpiled,
    so that means JS is already adhering to strict mode. It’s possible to undo that
    assumption, but you really have to go out of your way to do so, so it’s highly
    unlikely.


    Moreover, a wide shift is happening toward more/most new JS code being written
    using the ES6 module format. ES6 modules assume strict mode, so all code in such
    files is automatically defaulted to strict mode.


    Taken together, strict mode is largely the de facto default even though technically
    it''s not actually the default.


    # Defined


    JS is an implementation of the ECMAScript standard (version ES2019 as of this
    writing), which is guided by the TC39 committee and hosted by ECMA. It runs in
    browsers and other JS environments such as Node.js.


    JS is a multi-paradigm language, meaning the syntax and capabilities allow a developer
    to mix and match and reshape concepts from various major paradigms, such as procedural,
    object-oriented (OO/classes), and functional (FP).


    JS is a compiled language, meaning the tools (including the JS engine) process
    and verify a program (reporting any errors!) before it executes.


    With our language now defined, let’s start getting to know its ins and outs.'
- md: "\n## Chapter 2: Surveying JS\n\nThe best way to learn JS is to start writing\
    \ JS.\n\nTo do that, you need to know how the language works, and that's what\
    \ we'll focus on here. Even if you've programmed in other languages before, take\
    \ your time getting comfortable with JS, and make sure to practice each piece.\n\
    \nThis chapter is not an exhaustive reference on every bit of syntax of the JS\
    \ language. It's also not intended to be a complete \"intro to JS\" primer.\n\n\
    Instead, we're just going to survey some of the major topic areas of the language.\
    \ Our goal is to get a better feel for it, so we cancan move forward writing our\
    \ own programs with more confidence. We'll revisit many of these topics in successively\
    \ more detail as you go through the rest of the book, and the rest of the series.\n\
    \nPlease don't expect this chapter to be a quick read. It's long and plenty of\
    \ detail to chew on. Take your time.\n\n## Tip\n\nIf you're still getting familiar\
    \ with JS, I suggest you reserve plenty of extra time to work through this chapter.\
    \ Take each section and ponder and explore the topic for awhile. Look through\
    \ existing JS programs and compare what you see in them to the code and explanations\
    \ (and opinions!) presented here. You will get a lot more out of the rest of the\
    \ book and series with a solid foundation of JS's nature.\n\nChapter 2: Surveying\
    \ JS\n\n## Each File is a Program\n\nAlmost every website (web application) you\
    \ use is comprised of many different JS files (typically with the .js file extension).\
    \ It's tempting to think of the whole thing (the application) as one program.\
    \ But JS sees it differently.\n\nIn JS, standalone file is its own separate program.\n\
    \nThe reason this matters is primarily around error handling. Since JS treats\
    \ files as programs, one file may fail (during parse/compile or execution) and\
    \ will not necessarily prevent the next file from being processed. Obviously,\
    \ if your application depends on five .js files, and one of them fails, the overall\
    \ application will probably only partially operate, at best. It's important to\
    \ ensure that each file works properly, and to whatever extent possible, they\
    \ handle failure in other files as gracefully as possible.\n\nIt may surprise\
    \ you to consider separate .js files as separate JS programs. From the perspective\
    \ of your usage of an application, it sure seems like one big program. That's\
    \ because the execution of the application allows these individual programs to\
    \ cooperate and act as one program.\n\n## Note\n\nMany projects use build tools\
    \ that end up combining separate files from the project into a single file to\
    \ be delivered to a web page. When this happens, JS treats this single combined\
    \ file as the entire program.\n\nThe only way multiple standalone .js files act\
    \ as a single program is by sharing their state (and access to their public functionality\
    \ via the “global scope.”) They mix together in this global scope namespace, so\
    \ at runtime they act as a whole.\n\nSince ES6, JS has also supported a module\
    \ format in addition to the typical standalone JS format. Modules are also file-based.\
    \ If a file is loaded via module-loading mechanism such as an import statement\
    \ or a <script type=\"module\"> tag, all its code is treated as a single module.\n\
    \nThough you wouldn't typically think about a module—a collection of state and\
    \ publicly exposed methods to operate on that state—as a standalone program, JS\
    \ does in fact still treat each module separately. Similar to how “global scope”\
    \ allows standalone files to mix together at runtime, importing a module into\
    \ another allows runtime interoperation between them.\n\nRegardless of which code\
    \ organization pattern (and loading mechanism) is used for a file (standalone\
    \ or module), you should still think of each file as its own (mini) program, which\
    \ may then cooperate with other (mini) programs to perform the functions of your\
    \ overall application.\n\n## Values\n\nThe most fundamental unit of information\
    \ in a program is a value. Values are data. They’re how the program maintains\
    \ state. Values come in two forms in JS: primitive and object. Values are embedded\
    \ in programs using literals:\n\n```js\ngreeting(\"My name is Kyle.\");\n```\n\
    \nIn this program, the value \"My name is Kyle.\" is a primitive string literal;\
    \ strings are ordered collections of characters, usually used to represent words\
    \ and sentences.\n\nI used the double-quote \" character to delimit (surround,\
    \ separate, define) the string value. But I could have used the single-quote '\
    \ character as well. The choice of which quote character is is entirely stylistic.\
    \ The important thing, for the sake of code readability and maintainability, is\
    \ to pick one and to use it consistently throughout the program.\n\nAnother option\
    \ to delimit a string literal is to use the back-tick character. However, this\
    \ choice is not merely stylistic, there's a behavioral difference as well. Consider:\n\
    \n```js\nconsole.log(\"My name is ${firstName}.\");\n// My name is ${firstName}.\n\
    ```\n\n```js\nconsole.log('My name is ${firstName}.');\n// My name is ${firstName}.\n\
    ```\n\n```js\nconsole.log(`My name is ${firstName}.`);\n// My name is Kyle.\n\
    ```\n\nAssuming this program has already defined a variable firstName with the\
    \ string value \"Kyle\", the ``-delimited string then resolves the variable expression\
    \ (indicated with ${..}) to its current value. This is called interpolation.\n\
    \nThe back-tick-delimited string can be used without including interpolated expressions,\
    \ but that defeats the whole purpose of that alternate string literal syntax:\n\
    \n```js\nconsole.log(\n  `Am I confusing you by omitting interpolation?`\n);\n\
    // Am I confusing you by omitting interpolation\n```\n\nThe better approach is\
    \ to use \" or ' (again, pick one and stick to it!) for strings unless you need\
    \ interpolation; reserve ` only for strings that will include interpolated expressions.\n\
    \nOther than strings, JS programs often contain other primitive literal values\
    \ such as booleans and numbers:\n\n```js\nwhile (false) {\n  console.log(3.141592);\n\
    }\n```\n\nwhile represents a loop type, a way to repeat operations while condition\
    \ is true.\n\nIn this case, the loop will never run (and nothing will be printed),\
    \ because we used the false boolean value as the loop conditional. true would\
    \ have resulted in a loop that keeps going forever, so be careful!\n\nThe number\
    \ 3.141592 is, as you may know, an approximation of mathematical PI to the first\
    \ six digits. Rather than embed such a value, however, you would typically use\
    \ the predefined Math.PI value for that purpose. Another variation on numbers\
    \ is the bigint (big-integer) primitive type, which is used for storing arbitrarily\
    \ large numbers.\n\nNumbers are most often used in programs for counting steps,\
    \ such as loop iterations, and accessing information in numeric positions (i.e.,\
    \ an array index). We’ll cover arrays/objects in a little bit, but as an example,\
    \ if there was an array called names, we could access the element in its second\
    \ position like this:\n\nChapter 2: Surveying JS\n\n```js\nconsole.log(`My name\
    \ is ${names[1]}.\\`);\n// My name is Kyle.\n```\n\nIn addition to strings, numbers,\
    \ and booleans, two other primitive values in JS programs are null and undefined.\
    \ While there are differences between them (some historic and some contemporary),\
    \ for the most part values serve the purpose of indicating emptiness (or absence)\
    \ of a value.\n\nMany developers prefer to treat both consistently in this fashion,\
    \ which is to say that the values are assumed to be indistinguishable. If care\
    \ is taken, this is often possible. However, it's safest and best to use undefined\
    \ as the single empty value, though null seems attractive in it's shorter to type!\n\
    \n```js\nwhile (value != undefined) {\n  console.log(\"Still got something!\"\
    );\n}\n```\n\nThe final primitive value to be aware of is a special-purpose value\
    \ that behaves as a hidden unguessable value. Symbols are almost exclusively used\
    \ as special keys in objects:\n\n```js\nhitchhikersGuide[ Symbol(\"meaning of\
    \ life\")];\n// 42\n```\n\nYou won't encounter direct usage of symbols very often\
    \ in typical JS programs. They're mostly used in low-level code such as in libraries\
