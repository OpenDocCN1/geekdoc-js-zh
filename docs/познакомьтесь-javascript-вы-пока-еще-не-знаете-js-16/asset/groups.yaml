    # Asking "Why?"


    The intended take-away from this chapter is that there''s a lot more to JS under
    the hood than is obvious from glancing at the surface.


    As you are getting started learning and knowing JS more closely, one of the most
    important skills you can practice and bolster curiosity, and the art of asking
    "Why?” when you encounter something in the language.


    Even though this chapter has gone quite deep on some of the topics, many details
    have still been entirely skimmed over. There''s much more to learn here, and the
    path to that starts with you asking the right questions of your code. Asking the
    right questions is a critical skill of becoming a better developer.


    In the final chapter of this book, we''re going to briefly look at how JS is divided,
    as covered across the rest of the You Don''t Know JS Yet series. Also, don''t
    skip Appendix B of this book, which has some practice code to review some of the
    main topics covered in this book.'
