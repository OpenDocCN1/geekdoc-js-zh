    # Iteration


    Since programs are essentially built to process data (and make decisions on that
    data), the patterns used to step through the data have a big impact on the program’s
    readability.


    The iterator pattern has been around for decades, and suggests a “standardized”
    approach to consuming data from a source one chunk at a time. The idea is that
    it’s more common and helpful to iterate the data source—to progressively handle
    the collection of data by processing the first part, then the next, and so on,
    rather than handling the entire set all at once.


    Imagine a data structure that represents a relational database SELECT query, which
    typically organizes the results as rows. If this query had only one or a couple
    of rows, you could handle the entire result set at once, and assign each row to
    a local variable, and perform whatever operations on that data that were appropriate.


    But if the query has 100 or 1,000 (or more!) rows, you’ll need iterative processing
    to deal with this data (typically, a loop).


    The iterator pattern defines a data structure called an “iterator” that has a
    reference to an underlying data source (like the query result rows), which exposes
    a method like next(). Calling next() returns the next piece of data (i.e., a “record”
    or “row” from a database query).


    You don’t always know how many pieces of data that you will need to iterate through,
    so the pattern indicates completion by some special value or exception once you
    iterate through the entire set and go past the end.


    The importance of the iterator pattern is in adhering to a standard way of processing
    data iteratively, which creates'
  - "[PAGE 90]\n\ncleaner and easier to understand code, as opposed to having every\
    \ data structure/source define its own custom way of handling its data.\n\nAfter\
    \ many years of various JS community efforts around mutually agreed-upon iteration\
    \ techniques, ES6 standardized a specific protocol for the iterator pattern directly\
    \ in the language. The protocol defines a next() whose return is an object called\
    \ an iterator result; the object has value and done properties, where done is\
    \ a boolean that is false until iteration over the underlying data source is complete.\n\
    \n# # Consuming Iterators\n\nWith the ES6 iteration protocol in place, it's workable\
    \ to consume a data source one value at a time, checking after each next() call\
    \ for done to be true to stop the iteration. But this approach is rather manual,\
    \ so ES6 also included several mechanisms (syntax and APIs) for standardized consumption\
    \ of these iterators.\n\nOne such mechanism is the for...of loop:\n\n```\n// given\
    \ an iterator of some data source:\nvar it = /* ... */;;\n\n// loop over its results\
    \ one at a time\nfor (let val of it) {\n  console.log(`Iterator value: ${val}`);\n\
    }\n// Iterator value: ..\n// Iterator value: ..\n// ..\n```"
