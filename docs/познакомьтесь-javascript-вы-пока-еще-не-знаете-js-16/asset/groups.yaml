    \n转译（Transpilation）和填充（polyfilling）是解决代码与网站或应用程序仍需支持的旧环境之间差距的两种非常有效的技术。由于 JS 不会停止改进，这种差距永远不会消失。未来，这两种技术都应该作为每个\
    \ JS 项目生产链的标准部分被接受。\n\n## 解析过程中发生了什么\n\n关于 JS 编写的代码，有一个争论已的问题：它是解释型脚本还是编译型程序？大多数意见认为\
