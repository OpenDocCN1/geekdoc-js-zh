- md: "\n# Backwards & Forwards\n\nOne of the most foundational principles that guides\
    \ JavaScript is preservation of backwards compatibility. Many are confused by\
    \ the implications of this term, and often confuse it with a related but different\
    \ term: forwards compatibility.\n\nLet’s set the record straight.\n\nBackwards\
    \ compatibility means that once something is accepted as valid JS, there will\
    \ not be a future change to the language that causes that code to become invalid\
    \ JS. Code written in 1995—however primitive or limited it may have been!—should\
    \ still work today. As TC39 members often proclaim, “we do not break the web”\n\
    \nThe idea is that JS developers can write code with confidence that their code\
    \ won’t stop working unpredictably because a browser update is released. This\
    \ makes the decision to choose JS for a program a wise and safe investment, for\
    \ years into the future.\n\n“guarantee” is no small thing. Maintaining backwards\
    \ compatibility, stretched out across almost 25 years of the language’s history,\
    \ creates an enormous burden and a whole slew of unique challenges. You’d be hard\
    \ pressed to find many other examples in computing of such a commitment to backwards\
    \ compatibility.\n\nThe costs of sticking to this principle should not be casually\
    \ dismissed. It necessarily creates a very high bar to including changing or extending\
    \ the language; any decision becomes effectively permanent, mistakes and all.\
    \ Once it’s in JS, it can’t be taken out because it might break programs, even\
    \ if we’d really, really like to remove it!\n\n# Chapter 1: What Is JavaScript?\n\
    \nThere are some small exceptions to this rule. JS has had some backwards-incompatible\
    \ changes, but TC39 is extremely cautious in doing so. They study existing code\
    \ on the web (via browser data gathering) to estimate the impact of such breakage,\
    \ and browsers ultimately decide and vote on whether they're willing to take the\
    \ heat from users for a very small-scale breakage weighed against the benefits\
    \ of fixing or improving some aspect of the language for many more sites (and\
    \ users).\n\nThese kinds of changes are rare, and are almost always in corner\
    \ cases of usage that are unlikely to be observably breaking in many sites.\n\n\
    Compare backwards compatibility to its counterpart, forwards compatibility. Being\
    \ forwards-compatible means that including a new addition to the language in a\
    \ program would not cause that program to break if it were run in an older JS\
    \ engine. JS is not forwards-compatible, despite many wishing such, and even incorrectly\
    \ believing the myth that it.\n\nHTML and CSS, by contrast, are forwards-compatible\
    \ but not backwards-compatible. If you dig up some HTML or CSS written back in\
    \ 1995, it is entirely possible it would not work (or work the same) today. But,\
    \ if you use a new feature from 2019 in a browser from 2010, the page isn’t “broken”\
    \ – the unrecognized CSS/HTML is skipped over, while the rest of the CSS/HTML\
    \ would be processed accordingly.\n\nIt may seem desirable for forwards-compatibility\
    \ to be included in programming language design, but it's generally impractical\
    \ to do so. Markup (HTML) or styling (CSS) are declarative in nature, so it's\
    \ much easier to “skip over” unrecognized declarations with minimal impact to\
    \ other declarations.\n\nBut chaos and non-determinism would ensue if a programming\
