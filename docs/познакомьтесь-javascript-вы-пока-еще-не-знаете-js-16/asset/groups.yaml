    \ JS 引擎。\n2. JS 引擎解析代码生成 AST。\n3. 然后引擎将该 AST 转换为某种字节码，一种二进制中间表示 (IR)，然后由优化的 JIT\
    \ 编译器进一步精炼/转换。\n4. 最后，JS 虚拟机执行程序。\n\n为了可视化这些步骤，再次查看：\n\n![](img/80c8c54847b7a375356a79eacf1795de_45_0.png)\n\
    \n图 3：JS 的解析、编译和执行\n\nJS 是更像图 1 那样的解释型、逐行脚本，还是更像在执行之前先经过一次或多次处理的编译型语言（如图 2 和图\
