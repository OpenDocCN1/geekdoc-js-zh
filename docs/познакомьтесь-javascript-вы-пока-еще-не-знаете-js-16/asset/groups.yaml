    Since ES6, JS has also supported a module format in addition to the typical standalone
    JS format. Modules are also file-based. If a file is loaded via module-loading
    mechanism such as an import statement or a <script type="module> tag, all its
    code is treated as a single module.


    Though you wouldn''t typically think about a module—a collection of state and
    publicly exposed methods to operate on that state—as a standalone program, JS
    does in fact still treat each module separately. Similar to how “global scope”
    allows standalone files to mix together at runtime, importing a module into another
    allows runtime interoperation between them.


    Regardless of which code organization pattern (and loading mechanism) is used
    for a file (standalone or module), you should still think of each file as its
    own (mini) program, which may then cooperate with other (mini) programs to perform
    the functions of your overall application.


