  mdcn: "\n## 第 3 章：深入 JS 的根源\n\n通过原型链接在一起的一系列对象被称为“原型链”。\n\n这种原型链接（即从对象 B 到另一个对象\
    \ A）的目的是为了让对 B 的其不具备的属性/方法的访问，被委托给 A 来处理。属性/方法访问的委托允许两个（或多个！）对象相互协作以完成某项任务。\n\n\
    考虑通过普通字面量定义一个对象：\n\n```javascript\nvar homework = {\n  topic: \"JS\"\n};\n```\n\
