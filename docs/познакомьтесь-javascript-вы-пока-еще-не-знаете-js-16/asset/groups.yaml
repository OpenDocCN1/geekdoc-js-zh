    Inheritance is a powerful tool for organizing data/behavior in separate logical
    units (classes), but allowing the child class to cooperate with the parent by
    accessing/using its behavior and data.


    # Modules


    The module pattern has essentially the same goal as the class pattern, which is
    to group data and behavior together into logical units. Also like classes, modules
    can “include” or “access” the data and behaviors of other modules, for cooperation’s
    sake.


    But modules have some important differences from classes. Most notably, the syntax
    is entirely different.


    # Classic Modules


    ES6 added a module syntax to form native JS syntax, which we''ll look at in a
    moment. But from the early days of JS, modules was an important and common pattern
    that was leveraged in countless JS programs, even without a dedicated syntax.


    The key hallmarks of a classic module are an outer function (that runs at least
    once), which returns an “instance” of the module with one or more functions exposed
    that can operate on the module instance’s internal (hidden) data.


    Because a module of this form is just a function, and calling it produces an “instance”
    of the module, another description for these functions is “module factories”.


    Consider the classic module form of the earlier Publication, Book, and BlogPost
