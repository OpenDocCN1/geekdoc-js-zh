    # Chapter 1: What Is JavaScript?


    There are some small exceptions to this rule. JS has had some backwards-incompatible
    changes, but TC39 is extremely cautious in doing so. They study existing code
    on the web (via browser data gathering) to estimate the impact of such breakage,
    and browsers ultimately decide and vote on whether they''re willing to take the
    heat from users for a very small-scale breakage weighed against the benefits of
    fixing or improving some aspect of the language for many more sites (and users).


    These kinds of changes are rare, and are almost always in corner cases of usage
    that are unlikely to be observably breaking in many sites.


    Compare backwards compatibility to its counterpart, forwards compatibility. Being
    forwards-compatible means that including a new addition to the language in a program
    would not cause that program to break if it were run in an older JS engine. JS
    is not forwards-compatible, despite many wishing such, and even incorrectly believing
    the myth that it.


    HTML and CSS, by contrast, are forwards-compatible but not backwards-compatible.
    If you dig up some HTML or CSS written back in 1995, it is entirely possible it
    would not work (or work the same) today. But, if you use a new feature from 2019
    in a browser from 2010, the page isn’t “broken” – the unrecognized CSS/HTML is
    skipped over, while the rest of the CSS/HTML would be processed accordingly.


    It may seem desirable for forwards-compatibility to be included in programming
    language design, but it''s generally impractical to do so. Markup (HTML) or styling
    (CSS) are declarative in nature, so it''s much easier to “skip over” unrecognized
    declarations with minimal impact to other recog-'
