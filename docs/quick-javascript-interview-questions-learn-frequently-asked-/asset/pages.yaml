    Q. What is document fragment in DOM?


    ANSWER


    DocumentFragment is a light weight version of DOM. It does not have any parent
    class. It is generally used by the developer as a temporary storage of DOM elements.
    Below code shows an Example of creating document fragment and adding HTML element
    to it and finally placing it to the body of the DOM.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>DocumentFragment Example</title>

    </head>

    <body>

    <script>

    var aFragment = document.createDocumentFragment(), aHTMLElement = document.createElement("h2"),
    aTEXTMLElement = document.createTextNodeNode("SANDEEP");

    aHTMLElement.appendChild(aTEXTMLElement);

    aFragment.appendChild(aHTMLElement);

    document.body.appendChild(aFragment);

    </script>

    </body>

