    Q. How to define an inline web worker? Demonstrate an inline worker for multiplying
    numbers?


    ANSWER

    An inline web worker can be defined inside an HTML markup using <script> with
    type attribute having value javascript/worker. Syntax:


    ```

    < script type="javascript/worker">

    //JavaScript Code for defining a worker

    </script>

    ```


    Example:

    The inlineWorkerDemo.html file contains the code for defining multiplication worker
    which listens to the messages and calculates the multiplication and returns the
    response. The listener to the multiply worker extracts the result and renders
    in the browser. The following code shows the content of inlineWorkerDemo.html
    file.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="UTF-8">

    <title>Inline Web Worker Demo</title>

    </head>

    <body>

    <h1 id="resultContainer"></h1>

    <input type="number" id="number1" value="8" placeholder="Enter first number">

    <input type="number" id="number2" value="10" placeholder="Enter second number">

    <button id="multiply">Multiply</button>

    <script id="multiplyWorker" type="javascript/worker">

    self.addEventListener("message",function(event{

    var requestData = event.data,

    number1 = requestData.number1,

    number2 = requestData.number2,

    multiplyResult = number1 * number2;

    self.postMessage({result:multiplyResult});

    </script>

    ```'
