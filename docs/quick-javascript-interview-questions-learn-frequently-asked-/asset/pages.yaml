  md: '# Chapter 12 File API


    Q. What is HTML5 File API?


    ANSWER


    HTML5 provides new API to work with files inside a browser. This API provides
    File, FileList and Blob data type to work with files. It Provide FileReader to
    interface read files asynchronously.


    Q. What are the methods provided by FileReader for asynchronous?


    ANSWER


    FileReader provides 4 different methods to work with loaded files. These asynchronous
    methods are listed as follows.


    **readAsBinaryStringBlob | File** : Reads the target file and save it to binary
    string containing integer range 0-255.


    **readAsText | Blob | File, opt_encoding** : Reads the target file and save it
    as UTF-8 text file.


    **readAsDataURL(Blob | File)** : Reads the target file and returns a data URL
    containing base64 ascii string, **readAsArrayBuffer(Blob | File)** : Reads the
    target file and save it in a array buffer.


    Q. What is Blob object in javascript?


    ANSWER


    A blob object refers to a sequence of bytes representing data. The IDL(Interface
    Definition Syntax) for Blob object is as follows:


    ```

    interface Blob {

    readonly attribute unsigned long size; readonly attribute DOMString type; Blob

    ([Clamp]) long long start;

    ```


    ```

    optional([Clamp]) long long end, optional DOMString contentType); void close();

    };

    ```


    The details of the method and properties are as follows: **slice method** : The
    slice method returns a new Blob object


    with bytes ranging from the optional start up to not including the optional end
    parameter, and with a type attribute that is the value of the optional contentType
    parameter


    **close method** : The close method must permanently neuter the original Blob
    object. This is irreversible and nondependent operation; once a Blob has been
    neutered, it cannot be used again; dereferencing a Blob URL to a Blob object on
    which close has been called results in a network error. A neutered Blob must have
    a size of 0.


    **size property** : It returns the size of the Blob in bytes. **type property**
    : It returns the type of the content that the Blob holds.


