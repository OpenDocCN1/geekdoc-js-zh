    # Q. How to call class methods?


    ANSWER


    Using call() and apply() method we can use methods from different context to the
    current context. It is really helpful for reusability of code and context binding.


    call(): It is used to calls a function with a given value and arguments provided
    individually.

    apply(): It is used to call a function with a given value and arguments provided
    as an array.


    Below has two function getTypeOfNumber() and getTypeOfAllNumber(). The details
    pf these functions are below. getTypeOfNumber : This method takes single parameter
    and returns the type either Even or Odd.


    getTypeOfAllNumber : This method takes array of numbers as parameter and return
    the types in an array with Even or Odd.


    ```

    var MyNumber = {

    getTypeOfNumber : function(number){

    var type = (number % 2 === 0) ? "Even" : "Odd"; return type;

    }

    ```


    ```

    getTypeOfAllNumber : function () {

    var result = [],i=0;

    for (; i < arguments.length; i++) {

    var type =

    MyNumber.getTypeOfNumber.call(null,arguments[i]);

    result.push(type)

    }

    return result;

    };

    }

    ```


    ```

    var typeOfNumber =

    MyNumber.getTypeOfNumber.call(null,21) console.log(typeNumber)

    var typeOfAllNumber =

