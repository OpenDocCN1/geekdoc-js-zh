    "marks": {

    value: 0,

    writable: false,

    enumerable:true

    }

    };


    Object.defineProperties(student1, properties);

    student1.name = "Sandeep";nstudent1.subject="Mathematics";nstudent1.marks=75;

    console.log(student1);

    ```


    In the above code student1 object created using Object.create() method. Then some
    new properties like subject and marks are marked enumerable option decided whether
    the property can be enumerated as own property. Writable property decides whether
    the property is modifiable or not. The value property takes the default value
    of the property.'
