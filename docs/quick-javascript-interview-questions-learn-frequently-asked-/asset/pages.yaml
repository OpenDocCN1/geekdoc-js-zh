    # Q. What is the purpose of Object.definePropertyProperties() method? ANSWER


    ECMAScript 5.1 provides Object.definePropertyProperties() method to create new
    properties to a defined object. It provides many configuration options to initialize
    these members. Below code shows the use of this method.


    ```

    function Student(name) {

