    ```


    Q. Why use JSON over XML ?


    ANSWER


    The following points are in favor of JSON over XML format:

    JSON can contain Integer, String, List, Arrays. XML is much simpler and elements
    that need to be parsed into Integer, String and so before it is used by your application.
    JSON is faster, faster and lightweight compared to XML. So for data delivery between
    servers and browsers, JSON is a better choice.


    JSON is best for use of data in web applications from web services supports JSON.
    The overhead of parsing JSON nodes is more compare to a quick look up in JSON.


