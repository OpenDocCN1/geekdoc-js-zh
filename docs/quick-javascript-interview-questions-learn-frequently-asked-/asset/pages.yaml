  md: '# Q. Which is basic DOM?


    ANSWER

    Node is most basic object of DOM. It is the most common interface from which lot
    of other DOM object are inherited. The following interfaces all inherit from Node
    its methods and properties: Document, Element, CharacterData, ProcessingInstruction,
    DocumentFragment, DocumentType, Notion, Entity, EntityReference. These interfaces
    may return null in particular cases where the methods and properties are not relevant.
    They may throw an exception - for example when adding children to a node type
    for which no child can exist.


