  md: "# Chapter 3 Closure\n\nQ. What is Closure?\nANSWER\n\nA closure is an inner\
    \ function that has access to the outer wrapped function's variables. It has three\
    \ different scope accesses:- **Self-scope:\nIt has access to properties present\
    \ in its own scope.\n\n**Wrapped function's scope:**nIt access to the properties\
    \ present to from its enclosing function.\n\n**Global Scope:\nIt has access to\
    \ the properties present in global scope that is window scope.\n\n**Example:\n\
    The inner function still has the access to prop1 though prop1 belongs to outer\
    \ function scope.\n\n```\nfunction myOuterFunction(){ var prop1 = 5;\n  return\
    \ innerFunction(){\n    return prop1;\n  }\n}\n\nvar res = myOuterFunction();\
    \ console.log(res.name);\nconsole.log(res(res));\n```\n\nBelow screenshot shows\
    \ the output of the above code in the console.\n\n| Elements | Resources | Network\
    \ | Sources | Timeline |\n|---|---|---|---|---|n| > function myOuterFunction(){\
    \ prop1 = 5; return innerFunction(){ return prop1; } var res = myOuterFunction();\
    \ console.log(res.name); console.log(res(res)); innerFunction 5 | | | | |\n\n\
    Q. Give an example of practical implication of closure concept? ANSWER\nWeb page\
    \ development closures are more frequently used by the developers. A most common\
    \ scenario is when we need some kind of factory which will return a function object\
    \ with different value that can be used by application.\n\n**Example:\nThe following\
    \ code has a background color named backgroundColorFactory which returns a function\
    \ with an input color. Using this factory we have created greenBackground and\
    \ blueBackground objects bound with the 2 buttons. Once user clicks these the\
    \ background color of the body is changed to the target color."
