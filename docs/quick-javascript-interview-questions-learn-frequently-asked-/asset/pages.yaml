    # Q. What are readable states for a Blob object?


    ANSWER


    A Blob must have a readability state, which is one of OPENED or CLOSED.


    A Blob refers to a byte sequence, including one of 0 bytes, is said to be in the

    OPENED readability state.


    A Blob is said to be closed if its close method has been called. A Blob that is
    closed is said

    to be in the CLOSED readability state.


    # Q. What are different states of FileReader?


    ANSWER


    The FileReader object can be in one of 3 states. The readyState attribute, on
    getting, must

    return the current state, which must be one of the following values:


    **EMPTY**: The FileReader object has been constructed, and there are no pending
    reads.

    None of the read methods have been called. This is the default state of a newly
    minted

    FileReader object, until one of the read methods have been called on it.


    **LOADING**: A File or Blob is being read. One of the read methods is being processed,

    and no error has occurred during the read.


    **DONE**: The entire File or Blob has been read into memory, OR a file error occurred

    during read, OR the read was aborted using abort(). The FileReader is no longer
    reading a

    File or Blob. If readyState is set to DONE it means at least one of the read methods
    have

    been called on this FileReader.'
