  md: '# Chapter 2 Questions on Event


    Q. How Event works?


    ANSWER

    Event propagation follows two phases capturing and bubbling phase.


    ![](img/4114d1a353352cae013b50aa75f4bd2f_15_0.png)


    Capturing Phase:

    in this phase, event first makes its way downwards from the DOCUMENT to the target
    element by passing all inner elements.


    Bubbling Phase:

    in this phase event makes its way back upwards from the target element to DOCUMENT
    by passing all outer wrapped elements.


    Q. How to attach event to an element?


    ANSWER

    According to DOM Level 2 Event Specification an event can be attached to an element
    using addEventListener() method using three arguments.


    Syntax:

    <element>.addEventListener(<eventname>,<callback>,<bo booleanphase>


    eventname:

    Represents type of event as String parameter. For Example click, mouseover, mouseout


    callback:

    This represents the callback function to be called for the event to be handled.


    booleanphase:

    This represents the phase of the event where the listener is attached. A FALSE
    value represents the bubbling phase and a TRUE value represents a capturing phase.


    Example:

    A click listener is added to the document which alerts a message when click occurs.document.addEventListener(''click'',
    function () { alert("Insider Event Listener"); },false);


    Q. How to attach event prior to IE9 browser version? ANSWER'
