  md: '# Chapter 4 Questions on JSON


    Q. What is JSON ?",


    ANSWER


    The JSON text format is syntactically identical to the code for creating JavaScript
    objects. JSON is only a subset of JS object literal notation, but apart from looking
    similar, they have nothing in common. JSON is used as data exchange format, like
    XML. JSON is built on two structures:


    A collection of name/value pairs. In various languages, this is realized as an
    object, record, dictionary, hash table, key list, or associative array. An ordered
    list of values. In most languages, this is realized as an array, vector, list,
    or sequence.


    Q. Why does Google prepend (1); to their JSON responses? ANSWER


    It prevents JSON hijacking. This is to ensure some other site can''t nasty tries
    to steal data. By replacing the array constructor, including this JSON via a `script`
    tag, a malicious thirdparty site could steal the data from the JSON response.
    By putting while(1); at the start, the script will crash. A same-site request
    using XHR and a separate JSON parser, on the other hand, can easily ignore the
    while(1); prefix.


