    - 有序列表。在大多数语言中，它实现为数组、向量、列表或序列。\n\nQ. 为什么 Google 在它们的 JSON 响应前面加上了？答案\n\n这是为了防止\
    \ JSON 劫持。以确保其他网站无法窃取数据。通过 `script` 标签引入此 JSON，恶意第三方网站可以窃取数据。通过在开头放置 `while(1);`，脚本将崩溃。另一方面，使用\
