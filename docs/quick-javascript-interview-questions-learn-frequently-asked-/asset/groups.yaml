    function Student(name){\n  this.name=name;\n}\nStudent.prototype.sayType = function(){\n\
    \  console.log(\"I am student type\");\n}\nfunction ScienceStudent(name){\n  \
    \ own.prototype = new Student();\n}.prototype.constructor = ScienceStudent;\n\
    var student2 = new ScienceStudent('sangeeta');\nconsole.log(student2.sayMyType());\n\
    ```\n\nI am student type\n\nTo test the type of an object belongs to a class or\
    \ not, instanceOf can be used. This returns a Boolean value, TRUE for an object\
    \ belongs to a class or else FALSE. Check the below screenshot for the test of\
    \ student2 using instanceOf.\n\n# Elements Resources Network Sources Timeline\n\
    \n- student2 instanceof Student\n  true\n- student2 instanceof ScienceStudent\n\
    \  true\n\nQ. What is differential inheritance?\n\nANSWER\n\nDifferential Inheritance\
    \ is a common prototype-oriented model that uses the concept that most objects\
    \ are derived from, more generic objects, and only differ in a few small aspects.\
    \ Each object maintains a reference to its prototype and a table of properties\
    \ that are different.\n\nQ. What is Object.create() method do?\n\nANSWER\n\nECMAScript\
    \ 5.1 has this method in its specification. This method can be used to create\
    \ a new object with given prototype object and properties. The syntax of this\
    \ method is listed below.\n\n```javascript\nObject.create(proto, propertiesObject)\n\
    ```\n\nExample:\n\nBelow code has a Student class function with name property\
    \ and the prototype object has a method getStudentName() which return the name\
    \ of the student. A new prototype object has been using Object.create() method\
    \ by passing the prototype object of Student with value of the name as sandeep.\
    \ Then the getStudentName() method is called on student1 object and logged in\
    \ the console.\n\n```javascript\nfunction Student(name) {\n  this.name = name;\n\
    }\nStudent.prototype = {\n  getName: function() {\n    return \"Name of Student\
    \ is :\" + this.name;\n  }\n};\nvar student1 = Object.create(Student.prototype);\
    \ \nstudent1.name = \"Sandeep\";\nconsole.log(student1.getStudentName());\n```\n\
    \nThe following screenshot shows the output of the above code in the developer\
    \ console.\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_11_0.png)\n\nQ. Write a\
    \ polyfill for Object.create() method if it is not present in the browser?\nANSWER\n\
    ECMAScript 5.1 has this method in its specification. If the browser is old then\
    \ Object.create() method is not present. To solve we need to write a polyfill.\
    \ Below code shows the polyfill for Object.create() method.\n\n```javascript\n\
    // if create method is present inside Object\nif (typeof Object!='function') {\n\
    \  //define the create method\n  Object.create = (function() {\n    var Object\
    \ = function() {};\n    return function(prototype) {\n      if (arguments.length\
    \ > 1) {\n        throw Error('Second argument not supported');\n      }\n   \
