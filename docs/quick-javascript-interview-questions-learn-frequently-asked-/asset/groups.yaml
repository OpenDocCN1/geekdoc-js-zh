    \ Questions\n- About The Author\nOne Last Thing...\n\n# Chapter 1 Inheritance\n\
    \nQ. How to create a class?\n\nANSWER\nJavaScript does not have a class definition.\
    \ To mimic classes in JavaScript functions can be used to declare a class.\n\n\
    Example:\nLet's create a student class in JavaScript which takes two parameters\
    \ name and roll as property. The code will look like below,\n\n```javascript\n\
    function Student(name,roll){\n  this.name = name;\n  this.roll = roll;\n}\n```\n\
    \nQ. How to create an object?\n\nANSWER\nAn object in JavaScript can be created\
    \ using two ways:\n\nNew Keyword:\nTo create a student object from the above student\
    \ class we can call the Student function using new keyword.\n\n```javascript\n\
    var student1 = new Student('sandeep', 2)\n```\n\nAnonymous Object:\nAnonymous\
    \ objects can be created using pair of curly braces containing property name and\
    \ value pairs.\n```javascript\nvar rose = {'color': 'red'}\n```\n\nQ. How to declare\
    \ a private and a public member?\n\nPrivate members are declared using var keyword\
    \ and constructor function.\n\n```javascript\nfunction Student(name,roll){\n \
    \ var id = \"ABCD123\";\n  this.name = name;\n  this.roll = roll;\n}\n```\n\n\
    When a Student object will be created the property name and roll will be accessible\
    \ using dot operator but id will not be accessible as it behaves as a private\
    \ member and return undefined on call.\n\nElements Resources Network Sources Timeline\
    \ Profile\n\n```javascript\n> function Student(name,roll){\n  var id = \"ABCD123\"\
    ;\n  this.name = name;\n  this.roll = roll;\n}\nundefined\n\n> var student1 =\
    \ new Student('sandeep', 25)\nundefined\n\n> student1.name\n\"sandeep\"\n\n> student1.id\n\
    undefined\n```\n\nThe above chrome console is showing a student1 object is created.name\
    \ property is accessible as it is showing sandeep on student1.name call. So name\
    \ is a public property for the student object. But id property is not accessible\
    \ and returned undefined on student1.id call. This shows id is a private property\
    \ in student1 object.\n\nQ. What is prototype property?\n\nBy Using Prototype\
    \ we can add new members to an existing object. Every JavaScript object has this\
    \ property internally. Initially it is an empty object.\n\nExample:\n\n```javascript\n\
    function Student(name,roll){\n  this.name = name;\n  this.roll = roll;\n}\nvar\
    \ student1 = new Student('sangeeta', 30); \nStudent.prototype.mark = 100;\n```\n\
    \nCheckout the below chrome console for the use of prototype.\n\nElements Resources\
    \ Network Sources Timeline Profiles\n\n```javascript\n> function Student(name,roll){\n\
    \  this.name = name;\n  this.roll = roll;\n}\nundefined\n> var student1 = new\
    \ Student('sangeeta', 30)\nundefined\n> student1\nStudent {name: \"sangeeta\"\
    , roll: 30}\n> Student.prototype.mark = 100\n> student1\nStudent {name: \"sangeeta\"\
    , roll: 30, mark: 100}\n```\n\nInitially the student1 object has only properties\
    \ name and roll. By using new property mark has been added to student object with\
    \ a value of 100. Now the console shows that the mark property is also added to\
    \ the existing student1 object.\n\n# Q. What is constructor property?\n\nANSWER\n\
    \nConstructor property of an object maintains a reference to its creator function.\
    \ Example:\nLet us checkout an example by creating a student object and calling\
    \ the constructor property on it.\n\n```javascript\nfunction Student(name, mark){\n\
    \  this.name=name;\n  this.mark = mark;\n}\nvar student1 = new Student('sandeep',\
    \ 123); \nconsole.log(student1.constructor);\n```\n\nCheckout the following screen\
    \ shot for above code in chrome console. The console log is printing the referenced\
    \ function by student1 object.\n\nElements Resources Network Sources Timeline\
    \ Profiles Audits Console\n\n```javascript\nfunction Student(name,mark){this.name=name;\
    \ this.mark=mark;}\nundefined\n\nvar student1 = new Student('sandeep', 123)\n\
    undefined\n\nconsole.log(student1.constructor)\nfunction Student(name,mark){this.name=name;\
    \ this.mark=mark;}\n```\n\n# Q. How to call methods?\n\nANSWER\nUsing call() and\
    \ apply() we can call methods with a specific context.\n\ncall():\nThe call()\
    \ method allows you to call a function with a given `this` value, passing arguments\
    \ individually.\n\napply():\nThe apply() method is similar to call(), but it takes\
    \ arguments as an array.\n\nExample:\n```javascript\nfunction greet(greeting,\
    \ punctuation) {\n  console.log(greeting + \", \" + this.name + punctuation);\n\
    }\nvar user = {name: \"Alice\"};\ngreet.call(user, \"Hello\", \"!\");\ngreet.apply(user,\
    \ [\"Hi\", \".\"]);\n```\n"
  mdcn: "\n\n学习常见问题解答\n\n# 快速 JavaScript 面试题\n\n作者：Sandeep Kumar Patel\n\n# 快速 JavaScript\
    \ 面试题\n\n版权所有\n\n保留所有权利。未经出版者 Sandeep Kumar Patel 书面许可，不得以任何形式或通过任何电子或机械手段（包括信息存储和检索系统）复制本书的任何部分（文章或评论中的短引用除外）。\n\
    \n书中使用的所有品牌名称和产品名称均为其所有者的商标、注册商标或贸易名称。我与书中提到的任何产品或供应商均无关联。\n\n出版者\n\nSandeep Kumar\
    \ Patel。\n\n# 目录\n\n- 快速 JavaScript 面试题目录\n- 第 1 章继承\n- 第 2 章 事件问题\n- 第 3 章闭包\n\
    - 第 5 章 DOM 问题\n- 第 6 章 Date 对象\n- 第 7 章 正则表达式\n- 第 8 章 Canvas API 问题\n- 第 9 章\
    \ 地位置 API\n- 第 10 章 Web Workers\n- 第 11 章 Local Storage\n- 第 12 章 File API\n-\
    \ 第 13 章 Web RTC\n- 第 14 章 Drag & Drop API\n- 第 15 章 App Cache API\n- 第 16 章 Server\
    \ Sent Events\n- 第 17 章杂类问题\n- 关于作者\n最后一点\n\n# 第 1 章继承\n\nQ. 如何创建一个类？\n\n答案\n\
    JavaScript 没有类定义。为了在 JavaScript 中模拟类，可以使用函数来声明类。\n\n示例：\n让我们在 JavaScript 中创建一个学生类，它接收\
    \ name 和 roll 两个参数作为属性。代码如下所示：\n\n```javascript\nfunction Student(name,roll){\n\
    \  this.name = name;\n  this.roll = roll;\n}\n```\n\nQ. 如何创建对象？\n\n答案\n可以使用两种方式创建\
    \ JavaScript 对象：\n\nNew 关键字：\n要从上面的学生类创建一个学生对象，我们可以使用 `new` 关键字调用 `Student` 函数。\n\
    \n```javascript\nvar student1 = new Student('sandeep', 2)\n```\n\n匿名对象：\n可以使用包含属性名和值对的大括号对创建匿名对象。\n\
    ```javascript\nvar rose = {'color': 'red'}\n```\n\nQ. 如何声明私有成员和公共成员？\n\n私有成员使用\
    \ `var` 关键字和构造函数声明。\n\n```javascript\nfunction Student(name,roll){\n  var id =\
    \ \"ABCD123\";\n  this.name = name;\n  this.roll = roll;\n}\n```\n\n当创建 Student\
    \ 对象时，可以使用点操作符访问属性 name 和 roll，但 id 无法访问，因为它表现得像一个私有成员，并在调用时返回 `undefined`。\n\n\
    元素 资源 网络 来源 时间线 配置文件\n\n```javascript\n> function Student(name,roll){\n  var id\
    \ = \"ABCD123\";\n  this.name = name;\n  this.roll = roll;\n}\nundefined\n\n>\
    \ var student1 = new Student('sandeep', 25)\nundefined\n\n> student1.name\n\"\
    sandeep\"\n\n> student1.id\nundefined\n```\n\n上面的 Chrome 控制台显示创建了 student1 对象。`name`\
    \ 属性是可以访问的，因为调用 `student1.name` 时显示了 `sandeep`。因此 `name` 是学生对象的公共属性。但 `id` 属性无法访问，并在调用\
    \ `student1.id` 时返回 `undefined`。这表明 `id` 是 student1 对象中的私有属性。\n\nQ. 什么是原型（prototype）属性？\n\
    \n通过使用原型，我们可以向现有对象添加新成员。每个 JavaScript 对象内部都拥有这个属性。初始时，它是一个空对象。\n\n示例：\n\n```javascript\n\
    function Student(name,roll){\n  this.name = name;\n  this.roll = roll;\n}\nvar\
    \ student1 = new Student('sangeeta', 30); \nStudent.prototype.mark = 100;\n```\n\
    \n查看下面的 Chrome 控制台了解原型的使用。\n\n元素 资源 网络 来源 时间线 配置文件\n\n```javascript\n> function\
    \ Student(name,roll){\n  this.name = name;\n  this.roll = roll;\n}\nundefined\n\
    > var student1 = new Student('sangeeta', 30)\nundefined\n> student1\nStudent {name:\
    \ \"sangeeta\", roll: 30}\n> Student.prototype.mark = 100\n> student1\nStudent\
    \ {name: \"sangeeta\", roll: 30, mark: 100}\n```\n\n最初，student1 对象只有 `name` 和\
    \ `roll` 属性。通过使用新属性 `mark`，学生对象已添加了值为 100 的属性。现在控制台显示 `mark` 属性也添加到了现有的 student1\
    \ 对象中。\n\n# Q. 什么是构造函数（constructor）属性？\n\n答案\n\n对象的 `constructor` 属性指向其创建函数的引用。示例：\n\
    让我们通过创建一个学生对象并调用其 `constructor` 属性来查看示例。\n\n```javascript\nfunction Student(name,\
    \ mark){\n  this.name=name;\n  this.mark = mark;\n}\nvar student1 = new Student('sandeep',\
    \ 123); \nconsole.log(student1.constructor);\n```\n\n查看下方 Chrome 控制台中上述代码的截图。控制台日志正在打印\
    \ student1 对象引用的函数。\n\n元素 资源 网络 来源 时间线 配置文件 审计 控制台\n\n```javascript\nfunction\
    \ Student(name,mark){this.name=name; this.mark=mark;}\nundefined\n\nvar student1\
    \ = new Student('sandeep', 123)\nundefined\n\nconsole.log(student1.constructor)\n\
    function Student(name,mark){this.name=name; this.mark=mark;}\n```\n\n# Q. 如何调用方法？\n\
    \n答案\n使用 `call()` 和 `apply()` 可以在特定的上下文中调用方法。\n\ncall():\n`call()` 方法允许你使用给定的\
    \ `this` 值调用函数，并逐个传递参数。\n\napply():\n`apply()` 方法与 `call()` 类似，但它以数组的形式接收参数。\n\
    \n示例：\n```javascript\nfunction greet(greeting, punctuation) {\n  console.log(greeting\
    \ + \", \" + this.name + punctuation);\n}\nvar user = {name: \"Alice\"};\ngreet.call(user,\
    \ \"Hello\", \"!\");\ngreet.apply(user, [\"Hi\", \".\"]);\n```\n\n"
