    function paddingFunction(data){\n  console.log(\"response data processing code\"\
    )\n}\nvar script = document.createElement('script');\nscript.src = '/abcdurl?callback=paddingFunction'\n\
    document.getElementsByTagName('head')[0].appendChild(script);\n```\n\nQ. 为什么使用\
    \ JSON 而不是 XML？\n\n答案\n\n以下是 JSON 相比 XML 的优点：\nJSON 可以包含整数、字符串、列表、数组。XML 要简单得多，而且在应用程序使用之前，元素需要解析为整数、字符串等。与\
    \ XML 相比，JSON 更快、更轻量。因此，对于服务器和浏览器之间的数据传输，JSON 是更好的选择。\n\n"
