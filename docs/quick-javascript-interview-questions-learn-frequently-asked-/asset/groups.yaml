- md: "\n## Q. How to import an external script in web worker? Demonstrate it with\
    \ an example?\n\nANSWER\nTo import external script inside a web worker we need\
    \ to use importScripts() method with a file name as input parameter. To demonstrate\
    \ script functionality we created 3 files: greatest-number-script.js, numberWorker.js,\
    \ numberWorkerDemo.html file. The following screenshot shows these files.\n\n\
    - importScript\n  - greatest-number-script.js\n  - numberWorker.js\n  - numberWorkerDemo.html\n\
    \nThe greatest-number-script.js is the external script that we need to import\
    \ to our web worker. It has a single method findGreatestNumber() to find out a\
    \ bigger number among supplied workers. The following code shows the content of\
    \ greatest-number-script.js.\n\n```javascript\nvar findGreatestNumber = function(number1,number2)\
    \ {\n  return number1>number2 ? number1 : number2;\n};\n```\n\nThe numberWorker.js\
    \ file contains the code for importing the external script inside the web worker\
    \ listener callback method. The following code shows the content of numberWorker.js\
    \ file.\n\n```javascript\nself.addEventListener('message', function(event) {\n\
    \  var numberWorker = self.importScripts('greatest-number-script.js');\n  var\
    \ requestData = event.data;\n  var number1 = requestData.number1;\n  var number2\
    \ = requestData.number2;\n  var greatestNumber = findGreatestNumber(number1,number2);\n\
    \  self.postMessage({result:greatestNumber});\n});\n```\n\nThe numberWorkerDemo.html\
    \ file contains the code for instantiating the web worker and listening to response\
    \ method. The following code shows the content of numberWorkerDemo.html file.\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
    >\n<title>Time Web Worker Demo</title>\n</head>\n<body>\n<h1 id=\"resultContainer\"\
    ></h1>\n<input type=\"number\" id=\"number1\" value=\"\" placeholder=\"Enter first\
    \ number\">\n<input type=\"number\" id=\"number2\" value=\"\" placeholder=\"Enter\
    \ second number\">\n<button id=\"greatButton\">Find Greatest</button>\n<script>\n\
    var numberWorker = new Worker('numberWorker.js');\nvar resultContainer = document.getElementById('resultContainer');\n\
    var greatButton = document.getElementById('greatButton');\nvar number1 = document.getElementById('number1');\n\
    var number2 = document.getElementById('number2');\n\ngreatButton.addEventListener('click',function(){\n\
    \  numberWorker.postMessage({\n    number1:parseInt(number1.value,10),\n    number2:\
    \ parseInt(number2.value,10)\n  });\n});\n\nnumberWorker.addEventListener('message',function(workerEvent)\
    \ {\n  var responseData = workerEvent.data;\n  resultContainer.innerText = \"\
    Greatest Number: \"+responseData.result;\n});\n</script>\n</body>\n</html>\n```\n\
    \nThe output of this code is rendered as the following screenshot containing the\
    \ greatest number from the supplied numbers.\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_59_0.png)\n\
    \n# Greatest Number: 9\n\n## Q. Create a shared worker to calculate the length\
    \ of a string? ANSWER\nThe calculateLengthWorker.js contains the code for listening\
    \ messages and calculates the length of input string. The shared worker listens\
    \ to message in a port by listening to connect. The code for calculateLengthWorker.js\
    \ file is as follows.\n\n```javascript\nself.addEventListener('connect', function(event)\
    \ {\n  var port = event.port;\n  port.addEventListener('message', function(event)\
    \ {\n    var requestData = event.data;\n    var inputString = requestData.string;\n\
    \    var stringLength = inputString.length;\n    port.postMessage({result:stringLength});\n\
    \  }, false);\n  port.start();\n});\n```\n\nThe GreatestWorkerDemo.html file contains\
    \ the code for instantiating the shared worker and rendering the response in browser.\
    \ The code of content GreatestWorkerDemo.html file are listed as follows.\n\n\
    ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
    >\n  <title>Shared Web Worker Demo</title>\n</head>\n<body>\n<h1 id=\"result\"\
    ></h1>\n<input type=\"text\" id=\"inputString\" placeholder=\"Enter a string\"\
    >\n<button id=\"lengthButton\">Get Length</button>\n<script>\nvar worker = new\
    \ SharedWorker(\"calculateLengthWorker.js\");\nvar resultContainer = document.getElementById(\"\
    result\");\nvar lengthButton = document.getElementById(\"lengthButton\");\nvar\
    \ inputString = document.getElementById(\"inputString\");\n\nlengthButton.addEventListener(\"\
    click\", function () {\n  resultContainer.innerText = \"\";\n  worker.port.postMessage({\n\
    \    string : inputString.value\n  });\n});\n\n//start the worker\nworker.port.start();\n\
    \n//Success Handler for the result string.\nworker.port.addEventListener(\"message\"\
    , function (workerEvent) {\n  var response = workerEvent.data;\n  var result =\
    \ response.result;\n  resultContainer.innerText = \"Result: \" + result;\n});\n\
    </script>\n</body>\n</html>\n```\n\nThe output of the preceding code is rendered\
    \ as the following screenshot displaying length of the input string.\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_60_0.png)\n\
    \n## Chapter 1: Local Storage\n\n### Q. What is local storage?\nANSWER\nHTML5\
    \ provides a feature to store data locally in user’s browser. Unlike cookie it\
    \ has average space of 5 MB. This storage comes in types.\n\n### Q. Which one\
    \ is the main interface?\nANSWER\nwindow.Storage is the main interface with definition.\n\
    \n```javascript\ninterface Storage {\n  readonly length: number;\n  key(index);\n\
    \  getItem(key);\n  setItem(key, value);\n  removeItem(key);\n  clear();\n}\n\
    ```\n\nThe details of the above code are as follows:\n- setItem(key,value) : This\
    \ method stored the value in storage.\n- getItem(key) : This method retrieves\
    \ the stored value.\n- removeItem(key) : This method removes the item based on\
    \ the key.\n- clear() : Deletes all the items from the storage.\n- length : This\
    \ property returns the length of storage.\n- key(position) : This method returns\
    \ the key for the value.\n\n### Q. How to store and retrieve an object in local\
    \ storage?\nANSWER\nLocal storage provides setItem() and getItem() for storing\
    \ and retrieving an object. setItem(key, value) method takes 2 parameters to store\
    \ the object. getItem() method retrieves the value using key.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<div id=\"resultContainer\"></div>\n<script>\nvar container\
    \ = document.getElementById(\"resultContainer\");\nlocalStorage.setItem(\"myName\"\
    , \"Sandeep Kumar\");\ncontainer.innerHTML = localStorage.getItem(\"myName\");\n\
    </script>\n</body>\n</html>\n```\n\nBelow screenshot shows the chrome developer\
    \ storage preview which holds the above object as key and value pair.\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_63_0.png)\n\
    \n# Sandeep Kumar\n\n- Elements Network Sources Profiles\n\n| Frames | Key | Value\
    \ |\n| --- | --- | --- |\n| Web SQL | myName | Sandeep Kumar |\n| IndexedDB |\
    \ | |\n| Local Storage | | |\n| http://127.0.0.1:51792 | | |\n| Session Storage\
    \ | | |\n| Cookies | | |\n| Application Cache | | |\n\n### Q. How to attach an\
    \ event to a local storage?\nANSWER\nWhen local storage objects get modified a\
    \ storage event is fired. A callback method can be attached to window object using\
    \ addEventListener() or attachEvent() method.\n\nNOTE:\nWhen the getItem(), removeItem(),\
    \ and clear() methods are called on a Storage x that is associated with a local\
    \ storage area, if methods did something, then in every Document object whose\
    \ Window's localStorage attribute's Storage object is associated with the same\
    \ storage area, other than x, a storage event must be fired.\n\nIn simple sentence,\
    \ a storage event is fired on every window/tab except for the one that updated\
    \ the localStorage object and caused the event. Below code has a callback method\
    \ listening storage event.\n"
  mdcn: "\n\n## Q. 如何在 web worker 中导入外部脚本？请用示例演示。\n\n答案\n要在 web worker 导入外部脚本，我们需要使用\
    \ `importScripts()` 方法并将文件名作为输入参数。为了演示脚本功能，我们创建了 3 个文件：greatest-number-script.js、numberWorker.js\
    \ 和 numberWorkerDemo.html。下面的截图显示了这些文件。\n\n- importScript\n  - greatest-number-script.js\n\
    \  - numberWorker.js\n  - numberWorkerDemo.html\n\ngreatest-number-script.js 是我们需要导入到\
    \ web worker 中的外部脚本。它包含一个方法 `findGreatestNumber()`，用于在提供的数字中找到最大的一个。以下代码显示了 `greatest-number-script.js`\
    \ 的内容。\n\n```javascript\nvar findGreatestNumber = function(number1,number2) {\n\
    \  return number1>number2 ? number1 : number2;\n};\n```\n\nnumberWorker.js 文件包含了在\
    \ web worker 监听回调方法内部导入外部脚本的代码。以下显示了 `numberWorker.js` 文件的内容。\n\n```javascript\n\
    self.addEventListener('message', function(event) {\n  var numberWorker = self.importScripts('greatest-number-script.js');\n\
    \  var requestData = event.data;\n  var number1 = requestData.number1;\n  var\
    \ number2 = requestData.number2;\n  var greatestNumber = findGreatestNumber(number1,number2);\n\
    \  self.postMessage({result:greatestNumber});\n});\n```\n\nnumberWorkerDemo.html\
    \ 文件包含了实例化 web worker 并监听响应方法的代码。以下显示了 `numberWorkerDemo.html` 文件的内容。\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Time\
    \ Web Worker Demo</title>\n</head>\n<body>\n<h1 id=\"resultContainer\"></h1>\n\
    <input type=\"number\" id=\"number1\" value=\"\" placeholder=\"Enter first number\"\
    >\n<input type=\"number\" id=\"number2\" value=\"\" placeholder=\"Enter second\
    \ number\">\n<button id=\"greatButton\">Find Greatest</button>\n<script>\nvar\
    \ numberWorker = new Worker('numberWorker.js');\nvar resultContainer = document.getElementById('resultContainer');\n\
    var greatButton = document.getElementById('greatButton');\nvar number1 = document.getElementById('number1');\n\
    var number2 = document.getElementById('number2');\n\ngreatButton.addEventListener('click',function(){\n\
    \  numberWorker.postMessage({\n    number1:parseInt(number1.value,10),\n    number2:\
    \ parseInt(number2.value,10)\n  });\n});\n\nnumberWorker.addEventListener('message',function(workerEvent)\
    \ {\n  var responseData = workerEvent.data;\n  resultContainer.innerText = \"\
    Greatest Number: \"+responseData.result;\n});\n</script>\n</body>\n</html>\n```\n\
    \n该代码的输出渲染如下截图所示，包含了提供数字中的最大值。\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_59_0.png)\n\
    \n# Greatest Number: 9\n\n## Q. 创建一个 shared worker 来计算字符串的长度？答案\ncalculateLengthWorker.js\
    \ 包含了监听消息和计算输入字符串长度的代码。shared worker 通过监听连接（connect）来监听端口（port）中的消息。calculateLengthWorker.js\
    \ 文件的代码如下。\n\n```javascript\nself.addEventListener('connect', function(event)\
    \ {\n  var port = event.port;\n  port.addEventListener('message', function(event)\
    \ {\n    var requestData = event.data;\n    var inputString = requestData.string;\n\
    \    var stringLength = inputString.length;\n    port.postMessage({result:stringLength});\n\
    \  }, false);\n  port.start();\n});\n```\n\nGreatestWorkerDemo.html 文件包含了实例化 shared\
    \ workerget浏览器中渲染响应的代码。GreatestWorkerDemo.html 文件的内容列如下。\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Shared\
    \ Web Worker Demo</title>\n</head>\n<body>\n<h1 id=\"result\"></h1>\n<input type=\"\
    text\" id=\"inputString\" placeholder=\"Enter a string\">\n<button id=\"lengthButton\"\
    >Get Length</button>\n<script>\nvar worker = new SharedWorker(\"calculateLengthWorker.js\"\
    );\nvar resultContainer = document.getElementById(\"result\");\nvar lengthButton\
    \ = document.getElementById(\"lengthButton\");\nvar inputString = document.getElementById(\"\
    inputString\");\n\nlengthButton.addEventListener(\"click\", function () {\n  resultContainer.innerText\
    \ = \"\";\n  worker.port.postMessage({\n    string : inputString.value\n  });\n\
    });\n\n//start the worker\nworker.port.start();\n\n//Success Handler for the result\
    \ string.\nworker.port.addEventListener(\"message\", function (workerEvent) {\n\
    \  var response = workerEvent.data;\n  var result = response.result;\n  resultContainer.innerText\
    \ = \"Result: \" + result;\n});\n</script>\n</body>\n</html>\n```\n\n上述代码的输出渲染如下截图所示，显示了输入字符串的长度。\n\
    \n![](img/4114d1a353352cae013b50aa75f4bd2f_60_0.png)\n\n## 第一章：Local Storage（本地存储）\n\
    \n### Q. 什么是 local storage？\n答案\nHTML5 提供了一种在用户浏览器本地存储数据的特性。与 cookie 不同，它的平均空间为\
    \ 5 MB。这种存储分为多种类型。\n\n### Q. 哪一个是主接口？\n答案\nwindow.Storage 是带有定义的主接口。\n\n```javascript\n\
    interface Storage {\n  readonly length: number;\n  key(index);\n  getItem(key);\n\
    \  setItem(key, value);\n  removeItem(key);\n  clear();\n}\n```\n\n上述代码的细节如下：\n\
    - setItem(key,value) : 此方法将值存储在存储中。\n- getItem(key) : 此方法检索存储的值。\n- removeItem(key)\
    \ : 此方法根据键移除项。\n- clear() : 从存储中删除所有项。\n- length : 此属性返回存储的长度。\n- key(position)\
    \ : 此方法返回对应值的键名。\n\n### Q. 如何在 local storage 中存储和检索对象？\n答案\nLocal storage 提供 `setItem()`\
    \ 和 `getItem()` 来存储和检索对象。`setItem(key, value)` 方法接受两个参数来存储对象。`getItem()` 方法通过键检索值。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<div id=\"resultContainer\"></div>\n\
    <script>\nvar container = document.getElementById(\"resultContainer\");\nlocalStorage.setItem(\"\
    myName\", \"Sandeep Kumar\");\ncontainer.innerHTML = localStorage.getItem(\"myName\"\
    );\n</script>\n</body>\n</html>\n```\n\n下面的截图显示了 Chrome 开发者工具存储预览，它以键值对的形式持有上述对象。\n\
    \n![](img/4114d1a353352cae013b50aa75f4bd2f_63_0.png)\n\n# Sandeep Kumar\n\n- Elements\
    \ Network Sources Profiles\n\n| Frames | Key | Value |\n| --- | --- | --- |\n\
    | Web SQL | myName | Sandeep Kumar |\n| IndexedDB | | |\n| Local Storage | | |\n\
    | http://127.0.0.1:5172 | | |\n| Session Storage | | |\n| Cookies | | |\n| Application\
    \ Cache | | |\n\n### Q. 如何为 local storage 附加事件？\n答案\n当 local storage 对象被修改时，会触发存储事件。可以使用\
    \ `addEventListener()` 或 `attachEvent()` 方法在 window 对象上附加回调方法。\n\n注意：\n当对关联本地存储区域的\
    \ Storage x 运行 `getItem()`、`removeItem()` 和 `clear()` 方法时，如果方法执行了操作，那么在每个 Window\
    \ 的 localStorage 属性的 Storage 对象关联到相同存储区域的其他其他 Document 对象中，必须触发存储事件。\n\n简单来说，存储事件会在更新\
    \ localStorage 对象并导致事件的窗口之外的所有窗口/标签页上触发。以下代码包含一个监听存储事件的回调方法。\n\n"
