    # Q. What are the different event handlers for a channel? ANSWER


    A channel has 4 different event handlers. These event handlers are as follows.

    Onopen: Executed when the connection is established. Onerror: Executed if there
    is an error creating the connection.

    Onmessage: When you receive a message, this method will execute

    Onclose: Executed if the other peer closes the connection.


    # Q. What is a signal channel? ANSWER


    WebRTC can''t create connections without some sort of server in the middle. We
    call this the Signal Channel.


    # Q. What is an ICE technique? ANSWER


    Interactive Connectivity Establishment (ICE) is a technique used in computer networking
    involving network address translators (NATs) in Internet applications of Voice
    over Internet Protocol (VoIP), peer-to-peer communications, video, instant messaging
    and other interactive media.


    # Q. What is an ICE Candidate? ANSWER


    While communication peers must exchange information about the network connection.
    This is known as an ICE candidate.


    # Q. What are the server side functionalities needed by the Web RTC? ANSWER


    Web RTC requires following functionalities from server side to create a communication
    between peers.

    User discovery and communication.

    Signaling.

    NAT/firewall traversal.

    Relay servers in case peer-to-peer communication failures.


    # Q. What is STUN protocol? ANSWER


    STUN (Session Traversal Utilities for NAT) is a standardized set of methods and
    a network protocol to allow an end host to discover its public IP address if it
    is located behind a NAT.'
- md: "\n## Chapter 14 Drag & Drop API\n\nQ. How to make content draggable inside\
    \ the browser? ANSWER\nHTML5 provides drag and drop feature. An element can be\
    \ made draggable by setting its draggable property to true. Check the below code\
    \ having 2 buttons. One button is draggable and other is just a normal button.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Draggable Element</title>\n\
    </head>\n<body>\n<button draggable=\"true\">Draggable Button</button> <button>Normal\
    \ Button</button>\n</body>\n</html>\n```\n\nBelow screenshot shows both buttons.\
    \ The draggable button is movable while the normal button is fixed in its position.\n\
    \n![](img/4114d1a353352cae013b50aa75f4bd2f_72_0.png)\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>...</head>\n<body>\n<button draggable=\"true\">Draggable Button</button>\n\
    <button>Normal Button</button>\n</body>\n</html>\n```\n\nQ. What happens when\
    \ drag starts for an element? ANSWER\nThere are 3 important key points to note\
    \ when a drag starts. These key points are as follows.\n\n- **Drag Data**: It\
    \ represent the type of data that will be transferred while dragging\n- **Drag\
    \ Feedback**: This image which appears beside the mouse pointer during the drag\
    \ operation.\n- **Drag Effect**: This represents the type of drag happens to element.\
    \ can be 3 types and listed below.\n    - Copy: This effect indicates that the\
    \ data will be copied from its present location to the drop location\n    - Move:\
    \ This effect indicates that the data being dragged will be moved from its original\
    \ position to drop location\n    - Link: This effect indicates that some form\
    \ of relationship or connection will be created between the source and drop locations.\n\
    \n## Q. What are the Drag and drop events?\n\nANSWER\n\nThere are 7 different\
    \ drag and drop events that can be attached with a callback method programmatically.\n\
    - **Dragstart**: it is fired on an element when a drag is started. \n- **Dragenter**:\
    \ it is fired when the mouse enters an element while a drag is occurring.\n- **Dragover**:\
    \ This event is fired as the mouse is moving over an element when a drag is occurring.\n\
    - **Dragleave**: This event is fired when the mouse leaves an element while a\
    \ drag is occurring.\n- **Drop**: The drop event is fired on the element where\
    \ the drop occurred at the end of the drag operation.\n- **Dragend**: The source\
    \ of the drag will receive a dragend event when the drag operation is complete,\
    \ whether it was successful or not.\n\n## Q. What is a dataTransfer property?\n\
    \nANSWER\n\ndataTransfer object holds the piece of data sent in a drag action.\
    \ dataTransfer is set in the dragstart event and read/handled in the drop event.\
    \ The syntax for setting value in dataTransfer object is as follows.\n`event.dataTransfer.setData(format,\
    \ data)`\nThe above syntax will set the object's content to the mime type and\
    \ data payload passed as arguments.\n\n## Q. Develop an example to drag and drop\
    \ an element from one place to another?\n\nANSWER\n\nTo demonstrate drag and drop\
    \ we have created div element with rounded border and background color red. We\
    \ will drag this element and drop it in a container. The following code shows\
    \ the drag and drop example.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n\
    #ball {\n    width: 50px;\n    height: 50px;\n    background-color: red;\n}\n\
    #dropZone {\n    width:200px;\n    height:100px;\n    padding:10px;\n    border:1px\
    \ solid #aaaaaa;\n}\n</style>\n</head>\n<body>\n<div id=\"dropZone\" ondrop=\"\
    drop(event)\" ondragover=\"allowDrop(event)\"><\n<br>\n<div id=\"ball\" draggable=\"\
    true\" ondragstart=\"drag(event)\"></div>\n</div>\n<script>\nfunction allowDefault(ev){ev.preventDefault();}\n\
    function drag(ev){ev.dataTransfer.setData(\"text\",ev.target.id);}\nfunction drop(ev){\n\
    \    ev.preventDefault(); \n    var data =ev.dataTransfer.getData(\"text\");\n\
    \    ev.target.appendChild(document.getElementById(data));\n}\n</script>\n</body>\n\
    </html>\n```\n\nThe output of the code looks like following screenshot before\
    \ dragging with both the element are in their original position.\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_75_0.png)\n\
    \nThe output of the code looks like following screenshot after dragging and dropping\
    \ the draggable element to the container.\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_75_1.png)\n\
    \n## Chapter 15 App Cache\n\nQ. What is app cache? What are the benefits of using\
    \ app cache API in a web application?\nANSWER\n\nCache API is the new feature\
    \ provided by the HTML5. This API power up a web application working without an\
    \ internet connection. The most important benefits by this API are listed below:\n\
    \n- **Speed**: Like all other cache it increases the speed of accessing the page\
    \ content.\n- **Offline browsing**: It increases the usability of application\
    \ as it can be accessed without internet.\n- **Reduced load**: As the content\
    \ and data is now cache in the browser the load of the application is reduced\
    \ the server.\n- **Few network calls**: As most of reusable content is present\
    \ in app cache this reduces the no of network call to.\n\nQ. How to enable app\
    \ cache in html file?\nANSWER\n\nTo enable app cache in HTML file we need to have\
    \ `manifest` attribute in `<html>` element. The syntax is as follows.\n\n```html\n\
    <!DOCTYPE html>\n<html manifest=\"filename.appcache\">\n```\n\nQ. What is the\
    \ media type of appcache?\nANSWER\n\nmanifest file needs `text/cache`.\n\nQ. What\
    \ are the 3 different section of manifest file?\nANSWER\n\nA manifest file has\
    \ 3 sections. as follows:\n- **CACHEIFEST**: Files under this header will be cached\
    \ after they are downloaded for the first time.\n- **NETWORK**: Files under this\
    \ header require a connection to the server, and will never cached.\n- **FALLBACK**:\
    \ Files under this header specifies fallback pages if a page is inaccessible.\n\
    \nQ. What is NETWORK section?\nANSWER\n\nNETWORK is one of the sections in manifest\
    \ file. The file listed in NETWORK is never cached. The following code shows a\
    \ sample of NETWORK:\n`NETWORK:login.html`\n\nQ. What is FALLBACK section?\nANSWER\n\
    \nFALLBACK is one of the sections in manifest file. In this section we can mention\
    \ the file which will be called when application is offline. The following code\
    \ shows a sample of FALLBACK:\n`FALLBACK:/offline.html`\n\nQ. What is CACHE MANIFEST\
    \ section?\nANSWER\n\nCACHE MANIFEST is one of the sections in manifest file.\
    \ The files mentioned in this section is cached locally. The following code shows\
    \ a sample of CACHE MANIFEST:\n`/style.css`\n`/favicon.gif`\n\nQ. How to view\
    \ app cache detail in chrome browser?\nANSWER\n\nWe can view the app cache content\
    \ like it is caching, size and time etc. using the following link in chrome browser:\
    \ `chrome://appcache-internals/`.\nThe following screenshot shows the appcache\
    \ internal for my browser.\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_78_0.png)\n\
    \nManifest: https://www.google.com/_chrome/newtab/manifest?espv=2&ie=UTF-8\nRemove\
    \ View Entries\n\n| Property | Value |\n| :--- | :--- |\n| Size | 232 KB |\n|\
    \ Creation Time | Thursday, 16 October 2014 at 20:37:47 |\n| Last Update Time\
    \ | Sunday, 24 May 2015 at 21:07:19 |\n| Last Access Time | Wednesday, 27 May\
    \ 2015 at 20:19:40 |\n\nQ. How to detect the support of browser for appcache?\n\
    ANSWER\n\nWe can detect the support of appcache by checking the existence of `applicationCache`\
    \ in window object. We can use javascript if statement which checks the truth\
    \ value of `window.applicationCache` object. The following screenshot shows the\
    \ chrome console detecting applicationCache object.\n\nQ. How to update the appcache\
    \ manually?\nANSWER\n\nWe can update the cache by doing hard reload to the browser.\
    \ We can also call `swapCache()` method to programmatically update the cache.\n"
  mdcn: "\n\n## 第 14 章 拖放 API\n\nQ. 如何在浏览器中让内容变得可拖拽？答复\nHTML5 提供了拖放功能。通过将元素的 `draggable`\
    \ 属性设置为 `true`，可以使元素变为可拖拽。查看下面的代码，其中包含两个按钮。一个按钮是可拖拽的，另一个只是普通按钮。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>可拖元素</title>\n</head>\n<body>\n<button draggable=\"\
    true\">可拖按钮</button> <button>普通按钮</button>\n</body>\n</html>\n```\n\n下方的截图显示了这两个按钮。可拖按钮是可以移动的，而普通按钮固定在原有位置。\n\
    \n![](img/4114d1a353352cae013b50aa75f4bd2f_72_0.png)\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>...</head>\n<body>\n<button draggable=\"true\">可拖按钮</button>\n<button>普通按钮</button>\n\
    </body>\n</html>\n```\n\nQ. 当元素的拖拽开始时发生了什么？答复\n拖拽开始时有 3 个关键点需要注意。这些关键点如下：\n\n\
    - **拖拽数据 (Drag Data)**：它代表拖拽过程中传输的数据类型。\n- **拖拽反馈 (Drag Feedback)**：拖拽操作期间出现在鼠标指针旁图像。\n\
    - **拖拽效果 (Drag Effect)**：代表发生在元素上的拖拽类型。共有 3 类型，列如下：\n    - 复制 (Copy)：此效果表示数据将从当前位置复制到落下位置。\n\
    \    - 移动 (Move)：此效果表示正在拖拽的数据将从位置移动到落下位置。\n    - 链接 (Link)：此效果表示源和落下位置之间将建立某种关系或连接。\n\
    \n## Q. 什么是拖放事件？\n\n答复\n\n有 7 种不同的拖放事件，可以通过程序化方法附加回调方法。\n- **Dragstart**：当拖拽开始时，在元素上触发。\n\
    - **Dragenter**：当拖拽进行期间，鼠标进入元素时触发。\n- **Dragover**：当拖拽进行期间，鼠标在元素上方移动时触发此事件。\n\
    - **Dragleave**：当拖拽进行期间，鼠标离开元素时触发此事件。\n- **Drop**：在拖拽操作结束时，在发生落在元素上触发 drop 事件。\n\
    - **Dragend**：无论拖拽操作成功与否，拖拽源都会接收 dragend 事件。\n\n## Q. 什么是 dataTransfer 属性？\n\n\
    答复\n\n`dataTransfer` 对象持有在拖拽操作中发送的数据片段。`dataTransfer` 在 `dragstart` 事件中设置，并在 `drop`\
    \ 事件中读取/处理。在 `dataTransfer` 对象中设置值的语法如下：\n`event.dataTransfer.setData(format,\
    \ data)`\n上述语法将将对象的设置设置为作为参数传递的 mime 类型和数据载荷。\n\n## Q. 开发一个示例，将元素从一个地方拖放到另一个地方？\n\
    \n答复\n\n为了演示拖放功能，我们创建了一个具有圆角边框和红色背景颜色的 `div` 元素。我们将拖动此元素并将其放入容器。以下代码显示了拖放示例。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n#ball {\n    width: 50px;\n\
    \    height: 50px;\n    background-color: red;\n}\n#dropZone {\n    width:200px;\n\
    \    height:100px;\n    padding:10px;\n    border:1px solid #aaaaaa;\n}\n</style>\n\
    </head>\n<body>\n<div id=\"dropZone\" ondrop=\"drop(event)\" ondragover=\"allowDrop(event)\"\
    ><\n<br>\n<div id=\"ball\" draggable=\"true\" ondragstart=\"drag(event)\"></div>\n\
    </</div>\n<script>\nfunction allowDefault(ev){ev.preventDefault();}\nfunction\
    \ drag(ev){ev.dataTransfer.setData(\"text\",ev.target.id);}\nfunction drop(ev){\n\
    \    ev.preventDefault(); \n    var data =ev.dataTransfer.getData(\"text\");\n\
    \    ev.target.appendChild(document.getElementById(data));\n}\n</script>\n</body>\n\
    </html>\n```\n\n代码的输出在拖拽前的截图所示，两个元素都在它们的原始位置。\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_75_0.png)\n\
    \n将可拖拽元素拖放到容器后，代码的输出如下方的所示。\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_75_1.png)\n\
    \n## 第 15 章 应用缓存 (App Cache)\n\nQ. 什么是应用缓存？在 Web 应用中使用缓存 API 有什么好处？答复\n\nCache\
    \ API 是 HTML5 提供的新功能。此 API 让 Web 应用可以在没有互联网连接的情况下运行。此 API 最重要的优点列如下：\n\n- **速度\
    \ (Speed)**：像所有其他缓存一样，它增加了访问页面内容的速度。\n- **离线浏览 (Offline browsing)**：增加了应用程序的可用性，因为可以在互联网访问。\n\
    - **减少负载 (Reduced load)**：由于内容和数据现在缓存在浏览器中，应用程序的负载减少了。\n- **减少网络请求**：由于大部分内容存在缓存中，减少了对服务器的请求。\n\
    \nQ. 如何在 HTML 文件中启用应用缓存？答复\n\n要在 HTML 文件中启用应用缓存，需要在 `<html>` 元素中使用 `manifest`\
    \ 属性。语法如下：\n\n```html\n<!DOCTYPE html>\n<html manifest=\"filename.appcache\">\n\
    ```\n\nQ. appcache 的媒体类型是什么？答复\n\nmanifest 文件需要 `text/cache`。\n\nQ. manifest 文件的\
    \ 3 个不同部分是什么？答复\n\nmanifest 文件有三个部分，如下：\n- **CACHEIFEST**：此头部下的文件在首次下载后将被缓存。\n\
    - **NETWORK**：此头部下的文件需要连接服务器。\n- **FALLBACK**：此头部指定了页面不可访问时的备用页面。\n\nQ. 什么是 NETWORK\
    \ 部分？答复\n\nNETWORK 是 manifest 文件的一部分。在 NETWORK 中列出的文件不需要缓存。以下代码显示了 NETWORK 的示例：\n\
    `NETWORK:login.html`\n\nQ. 什么是 FALLBACK 部分？答复\n\nFALLBACK 是 manifest 文件的一部分。在此部分中我们可以指定应用程序离线时调用的文件。以下代码显示了\
    \ FALLBACK 的示例：\n`FALLBACK:/offline.html`\n\nQ. 什么是 CACHEIFEST 部分？答复\n\nCACHEIFEST\
    \ 是 manifest 文件的一部分。在此部分中提到的文件将在本地缓存。\n\n代码显示了 CACHEIFEST 的示例：\n`/style.css`\n\
    `/favicon.gif`\n\nQ. 如何在 Chrome 浏览器中查看缓存详情？答复\n\n我们可以通过 Chrome 浏览器中的链接 `chrome://appcache-internals/`\
    \ 查看缓存内容，如大小、时间等。下方的截图显示了我浏览器的 appcache 内部信息。\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_78_0.png)\n\
    \nManifest: https://www.google.com/_chrome/newtab/manifest?espv=2&ie=UTF-8\n移除查看\n\
    \n| 属性 | 值 |\n| :--- | :--- |\n| 大小 | 232 KB |\n| 创建时间 | 2014年10月16日 20:37:47\
    \ |\n| 最后更新时间 | 2015年5月24日 21:07:19 |\n| 最后访问时间 | 2015年5月27日 20:19:40 |\n\nQ.\
    \ 如何检测浏览器是否支持 appcache？答复\n\n我们可以通过检查 `window` 对象中是否存在 `applicationCache` 来检测对\
    \ appcache 的支持。可以使用 JavaScript 的 `if` 语句检查 `window.applicationCache` 对象的真值。下方的截图显示了\
    \ Chrome 控制台检测 applicationCache 对象。\n\nQ. 如何手动更新应用缓存？答复\n\n我们可以通过对浏览器进行强制刷新来更新缓存。我们也可以调用\
    \ `swapCache()` 方法来程序化地更新缓存。\n\n"
