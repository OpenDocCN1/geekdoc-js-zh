  mdcn: "\n## 第 16 章 服务器发送事件 (Server Sent Events)\n\nQ. 什么是服务器发送事件 (SSE)？\n\n答案\n\
    HTML5 提供了服务器发送事件功能，网页可以自动从服务器获取更新。该功能的一个绝佳例子是 Facebook 通知或 Google+ 更新。\n\nQ. 服务器发送响应的\
    \ content 类型是什么？答案\n\n服务器响应的 content 类型在 “Content-Type” 响应头中为 “text/event-stream”。\n\
    \nQ. 如何创建一个事件源来监听服务器更新？答案\n\n可以通过通过实例化 `EventSource` 类的对象并提供服务器路径来创建事件源。创建事件源的语法所示：\n\
    \n```javascript\nvar source = new EventSource(\"URL to Server\");\n```\n\nQ. EventSource\
    \ 触发了哪些事件类型？答案\n\nEventSource 会触发 3 种不同的事件。可以将回调方法附加到源上以监听这些事件。这些事件类型列如下：\n\n\
    - onopen : 当服务器向浏览器打开连接时，触发此事件。\n- onmessage: 当服务器向流产生新输出时，触发此事件。\n- onerror:\
    \ 当通过某种发生错误时，触发此事件。\n\nQ. 如何关闭事件流？\n\n答案\n可以使用 `close()` 方法关闭事件流。\n\nQ. 事件流的格式是什么？\n\
    \n答案\n事件流是一个简单的文本数据流，必须使用 UTF-8 编码。每条消息由一对换行符分隔。行首字符为冒号的本质上是一个注释，会被忽略。\n\n## 第\
    \ 17 章 杂记问题\n\nQ. 什么是严格模式 (strict mode)？\n答案\n严格模式是新 ECMA 5 JavaScript 规范中的新指令。它用于安全的\
    \ JavaScript 代码编写。它通过将静默错误转换为抛错误来消除 JavaScript 错误。\n\n编写严格模式的语法表达式如下：\n“use strict\"\
    \n以下代码展示了在函数内部使用严格模式。\n\n```javascript\nfunction sayHello(){\n  \"use strict\"\
    ;\n  myName = \"Sandeep\";\n}\n\nsayHello();\n```\n以下截图显示了在 `sayHello()` 方法中使用未声明变量产生的错误。\n\
    \n![](img/4114d1a353352cae013b50aa75f4bd2f_83_0.png)\n\nQ. 列出一些严格模式下不允许的条件？\n\
    答案\n下面是 ECMA5 严格模式下不允许的条件列表：\n\n- 不允许在未声明的情况下使用变量。不允许删除变量、函数或参数。\n- 不允许重复定义属性。不允许重复参数名。\n\
    - 不允许使用八进制数字字面量和转义字符。\n- 不允许写入只读属性。不允许删除不可删除属性。\n- 字符串 \"eval\" 不能作为变量。字符串 \"\
    arguments\" 不能作为变量。\n- 不允许使用未来保留关键字。\n\nQ. 0.1+0.2 在控制台中的输出是什么？为什么？JavaScript\
    \ 数学库遵循 IEEE 754 标准 标准进行数学运算。IEEE 754 标准使用 64 位表示浮点数。这在评估 `0.1 + 0.2` 表达式时产生了一个问题。下方的截图显示了该表达式的\
    \ Firebug 控制台。\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_84_0.png)\n\nJavaScript\
    \ 内部将 `0.1` 转换为 16 精度，变为 `0.10000000000000001`，加上 `0.2` 后变为 `0.30000000000000004`。\n\
    下方的截图显示了 JavaScript 代码中的这种情况。\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_84_1.png)\n\
    \nQ. 如何解决 0.1+0.2 = 0.30000000000000004 的问题并产生 0.3？答案\n可以使用 `toFixed(1)` 方法来解决这个问题。`toFixed()`\
    \ 方法将数字转换为指定的小位数。下方的截图显示了使用 `toFixed()` 产生正确输出 `0.3`。\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_84_2.png)\n\
    \nQ. 下面代码的输出是什么？为什么？\n\n```javascript\nfunction(){\n  var a = b = 3;\n}());\n\
    console.log(typeof a);\nconsole.log(typeof b);\n```\n\n答案\n上述代码将在控制台中打印 `undefined`\
    \ 和 `Number`。下方的截图显示了上述代码在 Firefox 控制台中的输出。\n\n![](img/4114d1a353352cae013b50aa75f4bd2f_85_0.png)\n\
    \nJavaScript 将代码处理如下图所示。从下面的代码可以明显看出变量 `a` 在函数的局部作用域内，而 `b` 被视为 `this.b`。当前引用代表\
    \ `window`。\n"
