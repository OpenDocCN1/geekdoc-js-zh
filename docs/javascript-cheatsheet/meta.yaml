  md: '# # 13 Browser


    A web browser is a pretty advance piece of software which contains a lot of components.
    Many of these components are accessible to a web developer, so we can create complex
    web apps. At the same time a lot of components are kept out of reach of the web
    developer for security purposes. For instance, we as web developers can get access
    to the user''s location, but we cannot get access to the user''s saved passwords
