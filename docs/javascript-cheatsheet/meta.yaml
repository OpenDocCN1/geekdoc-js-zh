  md: "# # Vocabulary around variables and scope\n\n**Variable Declaration**\nThe\
    \ creation of the variable.\n\n**Scope**\nThe limits in which a variable exists.\n\
    \n```\nvar a;\n```\n\n```\nvar a = \"global\";\n```\n\n**Variable Initialization**\n\
    The initial assignment of value to a variable.\n\n**Global scope**\nThe outer\
    \ most scope is called the Global scope.\n\n```\na = 12;\n```\n\n```\nfunction\
    \ first(){\n  var a = \"fresh\";\n\n  function second(){\n    console.log(a);\n\
    \  }\n}\n```\n\n**Functional scope**\nAny variables inside a function is in scope\
    \ of the function.\n\n**Variable Assignment**\nAssigning value to a variable.\n\
    \n```\na = \"me\";\n```\n\n**Lexical Environment (Lexical scope)**\nThe physical\
    \ location (scope) where a variable or function is declared is its lexical environment\
    \ (lexical scope).\n\n**Scope chain**\nThe nested hierarchy of scope is called\
    \ the scope chain. The JS engine looks for variables in the scope chain upwards\
    \ (it its ancestors, until found)\n\n**Hoisting**\nVariables are declared at the\
    \ top of the function automatically, and initialized at the time they are run.\n\
    \n```\nconsole.log(a);\nvar a = \"me\";\n```\n\n**Rule:**\n(1) Variables in the\
    \ outer scope can be accessed in a nested scope; But variables inside a nested\
    \ scope CANNOT be accessed by the outer scope. (a.k.a private variables.)\n\n\
    (2) Variables are picked up from the lexical environment."
