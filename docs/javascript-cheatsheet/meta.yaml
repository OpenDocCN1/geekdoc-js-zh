  md: "# ④ Function\n\nA function is simply a bunch of code bundled in a section.\
    \ This bunch of code ONLY runs when the function is called. Functions allow for\
    \ organizing code into sections and code reusability.\n\nUsing a function has\
    \ ONLY two parts. (1) Declaring/defining a function, and (2) using/running a function.\n\
    \n# Name of function\n\nThats it, its just a name you give to your function. Tip:\
    \ Make your function names descriptive to what the function does.\n\n# Return\
    \ (optional)\n\nA function can optionally spit-out or \"return\" a value once\
    \ its invoked. Once a function returns, no further lines of code within the function\
    \ run.\n\n```\n// Function declaration / Function statement\nfunction someName(param1,\
    \ param2){\n\n    // bunch of code as needed...\n    var a = param1 + \"love\"\
    \ + param2;\n    return a;\n}\n\n// Invoke (run / call) a function\nsomeName(\"\
    Me\", \"You\")\n```\n\n# Invoke a function\n\nInvoking, calling or running a function\
    \ all mean the same thing. When we write the function name, in this case someName,\
    \ followed by the brackets symbol () like this someName(), the code inside the\
    \ function gets executed.\n\n# Passing parameter(s) to a function (optional)\n\
    \nAt the time of invoking a function, parameter(s) may be passed to the function\
    \ code.\n\n# Parameters / Arguments (optional)\n\nA function can optionally take\
    \ parameters (a.k.a arguments). The function can then use this information within\
    \ the code it has.\n\n# Code block\n\nAny code within the curly braces { ... }\
    \ is called a \"block of code\", \"code block\" or simply \"block\". This concept\
    \ is not just limited to functions. \"if statements\", \"for loops\" and other\
    \ statements use code blocks as well."
