    \n```\nvar a = \"some value\";    // 函数或全局作用域\nlet b = \"some value\";    // 块级作用域\n\
    const c = \"some value\";  // 块级作用域 + 不能被赋予新值\n```\n\n## 事件循环\n\n![](img/100a2f06642446eb339b2146e2383d7b_6_0.png)\n\
    \n## 13 浏览器\n\n网络浏览器是一款相当先进的软件，包含许多组件。其中许多组件对 Web 开发人员是可访问的，因此我们可以创建复杂的 Web 应用程序。同时，出于安全目的，许多组件对\
    \ Web 开发人员是不可访问的。例如，作为 Web 开发人员，我们可以获取用户的*位置*，但无法访问用户保存的密码或浏览历史记录。**下面我们来看看浏览器的结构：**\n\
    \n![](img/100a2f06642446eb339b2146e2383d7b_7_0.png)\n\n## DOM - 文档对象模型\n\n###\
    \ 查询/获取元素\n\n```\n// 推荐方式：\ndocument.querySelector('css-selectors')\ndocument.querySelectorAll('css-selectors',\
    \ ...)\n```\n\n```\n// 旧方式，仍然有效：\ndocument.getElementsByTagName('element-name')\n\
    document.getElementsByClassName('class-name')\ndocument.getElementById('id')\n\
    ```\n\n### 创建 / 克隆元素\n\n```\ndocument.createElement('div')\ndocument.createTextNode('some\
    \ text here')\nnode.cloneNode()\nnode.textContent = 'some text here'\n```\n\n\
    ### 将节点添加到文档\n\n```\nparentNode.appendChild(nodeToAdd)\nparentNode.insertBefore(nodeToAdd,\
    \ childNode)\n```\n\n### 获取元素详情\n\n```\nnode.nextSibling\nnode.firstChild\nnode.lastChild\n\
    node.parentNode\nnode.childNodes\nnode.children\n```\n\n### 修改元素\n\n```\nnode.style.color\
    \ = 'red'\nnode.style.padding = '10px',\nnode.style.fontSize = '200%'\n\nnode.setAttribute('attr-name',\
    \ 'attr-value')\nnode.removeAttribute('attr-name')\n```\n\n### 获取和修改元素类\n\n```\n\
    node.classList\nnode.classList.add('class-name', ...)\nnode.classList.remove('class-name',\
    \ ...)\nnode.classList.toggle('class-name')\nnode.classList.contains('class-name')\n\
    node.classList.replace('old', 'new')\n```\n\n### 移除节点\n\n```\nparentNode.removeChild(nodeToRemove)\n\
    // 移除自身的技巧\nnodeToRemove.parentNode.removeChild(nodeToRemove)\n```\n\n### \"节点\"\
    是什么？\n（在 DOM 的上下文中）\n\n**节点：** DOM 树中的每个项目都称为节点。节点有两种类型——文本节点和元素节点：\n\n**文本节点：**\
    \ 包含文本的节点。\n\n**元素节点：** 包含元素的节点。\n\n**子节点：** 作为另一个节点的子节点的节点。\n\n**父节点：** 拥有一个子节点的节点。\n\
    \n**后代节点：** 嵌套在树深处的节点。\n\n**兄弟节点：** 共享同一父节点的节点。\n\n### 事件\n\n```\nnode.addEventListener('event-name',\
    \ callback-function)\nnode.removeEventListener('event-name', callback-function)\n\
    ```\n\n事件列表：https://developer.mozilla.org/en-US/docs/Web/Events\n或在 Google 搜索\
    \ \"Mozilla event reference\"\n\n## 自动继承的属性\n\n当你在 JavaScript 中创建一个值时，某些属性会自动被该值继承。这种神奇的现象是因为每个**类型**都有一个**构造函数**，其中包含一个名为\
    \ **prototype** 的特殊属性。**原型**上的所有方法都会自动被该**类型**创建的新值继承。看看右侧的一些方法。\n\n```\nconst\
    \ thing = \"some text\";\n```\n\n```\nconst num = 123.45;\n```\n\nGoogle 搜索 'Mozilla\
    \ String' 查找文档\n\nGoogle 搜索 'Mozilla Number' 查找文档\n\nGoogle 搜索 'Mozilla Array'\
    \ 查找文档\n\nGoogle 搜索 'Mozilla Boolean' 查找文档\n\n- `.concat()`\n- `.charAt()`\n-\
    \ `.indexOf()`\n- `.startsWith()`\n- `.endsWith()`\n- `.split()`\n- `.slice()`\n\
    \n- `.toFixed()`\n- `.toPrecision()`\n- `.toString()`\n\n- `.filter()`\n- `.map()`\n\
    - `.find()`\n- `.every()`\n- `.some()`\n- `.sort()`\n- `.slice()`\n- `.splice()`\n\
    - `.reduce()`\n- `.forEach()`\n\n- `.toString()`\n\n## 内置对象\n\nJavaScript 为我们提供了大量有用的内置对象，让我们的生活更轻松。**Date**\
    \ 和 **Math** 对象在日常使用中非常有用。看看右侧它们的一些特性。\n\nJavaScript 内置对象的完整列表，请访问 https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects\n\
    \nGoogle 搜索 'Mozilla Math' 查找文档\n\nGoogle 搜索 'Mozilla Date' 查找文档\n\n```\nMath.pow(2,\
    \ 3) // 8\nMath.sqrt(16) // 4\nMath.min(7, 8, 6) // 6\nMath.max(7, 8, 6) // 8\n\
    Math.floor(123.45) // 123\nMath.ceil(123.45) // 124\nMath.round(123.45) // 123\n\
    Math.random() // 0.45..\n```\n\n```\nconst d = new Date('9/17/1988');\nd.getDay()\n\
    d.getFullYear()\nd.getMonth()\n\nDate.now()\n自 1970 年 1 月 1 日以来的毫秒数\n```\n\n##\
    \ 17 Promise（Promise）\n\n**什么是 Promise？**\n\nPromise 是一个在处理异步任务时提供有用构造的对象。Promise\
    \ 被称为\"Promise\"，是因为它保证在该任务成功或失败时执行。\n\n使用 Promise 包括两个部分：（A）创建 Promise，和（B）使用\
    \ Promise。\n\n**什么是异步任务？**\n\n异步任务是指由第三方进程执行的任务。\n\n示例：\n\n- 向数据库请求/发送数据\n- 通过\
    \ HTTP 协议请求/发送数据\n- 操作计算机的文件系统\n\n```\n// (A) 创建 Promise\nconst p = new Promise((resolve,\
    \ reject)=>{\n  // 执行一些异步任务\n  setTimeout(()=>{\n    if(condition){\n      resolve('Successful\
    \ login');\n    } else {\n      reject('Login failed');\n    }\n  }, 2000)\n})\n\
    ```\n\n```\n// (B) 使用 Promise\np.then((res)=>{\n  console.log(res)\n})\n.catch((err)=>{\n\
    \  console.log(err)\n})\n```\n\n**注意：** 90% 的时间你会使用预先存在的 Promise。\"创建 Promise\"\
    的步骤会由你使用的库、框架或环境为你完成。Promise 的示例：fetch\n\n## 18 'this' 关键字\n\nthis 关键字在函数内部使用。this\
    \ 关键字仅仅是对另一个对象的引用。\n\nthis 关键字指向什么取决于场景或函数的实现方式。以下是 3 个需要记住的场景。\n\n### 场景 #1：函数内的\
    \ this\n\nthis 关键字指向全局对象。\n\n### 场景 #2：方法内的 this\n\nthis 关键字指向方法所属的对象。\n\n###\
    \ 场景 #3：使用 call、bind 或 apply 运行函数时\n\n当使用 .call(param) .bind(param) 或 .apply(param)\
    \ 方法调用函数时，第一个参数成为 this 关键字所引用的对象。\n\n**重要提示：**\n在浏览器中，全局对象是 window 对象。\n在 Node.js\
    \ 中，全局对象是 global 对象。\n\n```\nvar name = \" Fatema\";\n\nfunction fun(){\n    //\
    \ 此处的一些代码\n    console.log(this.name);\n}\n\nconst user = {\n    name: \"Marium\"\
    ,\n    yearOfBirth: 1999,\n    calcAge: function(){\n        const currentYear\
    \ = (new Date()).getFullYear();\n        return currentYear - this.yearOfBirth;\n\
    \    }\n}\n\nfun();           // 'this' 是全局的。输出 \"Fatema\"\nuser.calcAge();  //\
    \ 'this' 是 user 对象\nfun.call(user);  // 'this' 是 user 对象。输出 \"Marium\"\n```\n\n\
    ## 19 构造函数（Constructor）\n\n**什么是构造函数？**\n在 JavaScript 中，构造函数是一种特殊的函数，充当创建新对象的模具。\n\
    \nJavaScript 中有许多内置构造函数，例如 `String`、`Number`、`Promise`、`Date`、`Array`、`Object`\
    \ 等等。\n\n如果需要，我们可以创建自己的自定义构造函数。\n\n构造函数的一个绝佳用途是在创建多个相同类型的对象时。\n\n使用构造函数包括两个部分：\n\
    \n1. **定义构造函数**\n   创建自定义构造函数时\n\n2. **使用构造函数**\n   使用 \"new\" 关键字\n\n```\n//\
    \ 定义构造函数\nfunction Car(make, model, year){\n  this.make = make;\n  this.model\
    \ = model;\n  this.year = year;\n\n  this.setMiles = function(miles){\n    this.miles\
    \ = miles\n    return miles;\n  }\n}\n\n// 使用构造函数\nconst car1 = new Car('Toyota',\
    \ 'Prius', 2016);\nconst car2 = new Car('Hyundai', 'Sonata', 2018);\n\n// 向构造函数原型添加方法\n\
    Car.prototype.age = function(){\n  return (new Date()).getFullYear() - this.year;\n\
    }\n\ncar1.age(); // 2\n```\n\n> **经验法则：**\nA) 在构造函数内设置属性。\n\nB) 在 prototype 属性内设置方法。\n\
    \n> **\"new\" 关键字**\nnew 关键字用于从构造函数创建新对象（实例）。\n\n> **\"prototype\" 属性**\nprototype\
    \ 是每个对象上的特殊属性。附加到 prototype 属性的属性（方法或值）会被继承到构造函数的每个实例。\n"
