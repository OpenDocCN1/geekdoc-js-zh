  md: "# 18 'this' keyword\n\nThe this keyword is used inside a function. The this\
    \ keyword is merely a reference to another object.\n\nWhat the this keyword refers\
    \ to depends on the scenario or the way the function is implemented. Here are\
    \ the 3 scenarios to remember.\n\n# Scenario #1: this inside a function\n\nThe\
    \ this keyword points to global object.\n\n# Scenario #2: this inside a method\n\
    \nThe this keyword points to the object the method is in.\n\n# Scenario #3: When\
    \ function is run with call, bind or apply\n\nWhen a function is called using\
    \ the .call(param) .bind(param) or .apply(param) method, the first param become\
    \ the object that the this keyword refers to.\n\n**Important Note:**\nIn the browser,\
    \ global is the window object.\nIn Node.js, global is the global object.\n\n```\n\
    var name = \" Fatema\";\n\nfunction fun(){\n    // some code here\n    console.log(this.name);\n\
    }\n\nconst user = {\n    name: \"Marium\",\n    yearOfBirth: 1999,\n    calcAge:\
    \ function(){\n        const currentYear = (new Date()).getFullYear();\n     \
    \   return currentYear - this.yearOfBirth;\n    }\n}\n\nfun();           // 'this'\
    \ is global. Logs \"Fatema\"\nuser.calcAge();  // 'this' is the user object\n\
    fun.call(user);  // 'this' is the user object. Logs \"Marium\"\n```"
  merge: -1
