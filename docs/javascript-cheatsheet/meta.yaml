    # JavaScript Cheatsheet


    # 6 Operators


    Full list of JavaScript operators https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators


    Operators are reserved-words that perform action on values and variables.


    Arithmetic

    .. + .. Add

    .. - .. Subtract

    .. * .. Multiply

    .. / .. Divide

    .. % .. Remainder

    .. ** .. Exponential


    Relational / Comparison

    .. >= .. Greater than or equal to

    .. <= .. Less than or equal to

    .. != .. Not equal after coercion

    .. !== .. Not equal


    Operator Precedence

    Given multiple operators are used in an expression, the "Operator Precedence"
    determines which operator will be executed first. The higher the precedence, the
    earlier it will get executed.


    Assignment

    .. = .. Assign value

    .. += .. Add then assign

    .. -= .. Subtract then assign

    .. *= .. Multiply then assign


    Increment / Decrement

    ..++ Postfix increment

    ..-- Postfix decrement


    ++.. Prefix increment

    --.. Prefix increment


    Operator Associativity

    Given multiple operators have the same precedence, "Associativity" determines
    in which direction the code will be parsed.


    See the Operator Precedence and Associativity table here:

    http://bit.ly/operatortable


    Logical

    .. || .. Or

    .. && .. And


    Others

    typeof ..

    .. instanceof ..

    (..)

    ...spread-operator

    .

    ..[.]

    new ..

    delete ..

    (.. ? .. : ..)


    # 7 Coercion


    When trying to compare different "types", the JavaScript engine attempts to convert
    one type into another so it can compare the two values.


    Type coercion priority order:

    1. String

    2. Number

    3. Boolean


    Coercion in action

    Does this make sense?


    Equality

    .. === .. Equality

    .. == .. Equality with coercion


    Conversion

    + .. Convert to number

    - .. Convert to number then negate it

    ! .. Convert to boolean then inverse it


    ```

    2 + "7";  // "27"

    true - 5  // -4

    ```'
  - "[PAGE 4]\n\n# # ⑧ Conditional Statements\n\nConditional statements allow our\
    \ program to run specific code only if certain conditions are met. For instance,\
    \ lets say we have a shopping app. We can tell our program to hide the \"checkout\"\
    \ button if the shopping cart is empty.\n\n**If -else Statement**: Run certain\
    \ code, \"if\" a condition is met. If the condition is not met, the code in the\
    \ \"else\" block is run (if available.)\n\n```\nif (a > 0) {\n    // run this\
    \ code\n} else if (a < 0) {\n    // run this code\n} else {\n    // run this code\n\
    }\n```\n\n# # ⑨ Truthy / Falsy\n\nThere are certain values in JavaScript that\
    \ return true when coerced into boolean. Such values are called **truthy** values.\
    \ On the other hand, there are certain values that return false when coerced to\
    \ boolean. These values are knows as **falsy** values.\n\n**Switch Statement**:\
    \ Takes a single expression, and runs the code of the \"case\" where the expression\
    \ matches. The **\"break\"** keyword is used to end the switch statement.\n\n\
    ```\nswitch (expression) {\n    case choice1:\n        // run this code\n    \
    \    break;\n    case choice1:\n        // run this code\n        break;\n   \
    \ default:\n        // run this code\n}\n```\n\n| Truthy Values | Falsy Values\
    \ |\n| :--- | :--- |\n| true | false |\n| \"text\" | \" \" |\n| 72 | 0 |\n| -72\
    \ | -0 |\n| Infinity | NaN |\n| -Infinity | null |\n| {} | undefined |\n| [] |\
    \ |\n\n**Ternary Operator:** A ternary operator returns the first value if the\
    \ expression is truthy, or else returns the second value.\n\n```\n(expression)?\
    \ ifTrue: ifFalse;\n```"
  - "[PAGE 5]\n\n# ⑩ Loop Statements\n\nLoops are used to do something repeatedly.\
    \ For instance lets say we get a list of 50 blog posts from the database and we\
    \ want to print their titles on our page. Instead of writing the code 50 times,\
    \ we would instead use a loop to make this happen.\n\nFor loop\n\n```\nfor (initial-expression;\
    \ condition; second-expression){\n  // run this code in block\n}\n```\n\n+   Step\
    \ 1: Run the initial expression.\nStep 2: Check if condition meets. If condition\
    \ meets, proceed; or else end the loop.\nStep 3: Run the code in block.\nStep\
    \ 4: Run the second-expression.\nStep 5: Go to Step 2.\n\nWhile loop\n\n```\n\
    while (i<3){\n  // run this code in block\n  i++;\n}\n```\n\n+   Step 1: If the\
    \ condition is true, proceed; or else end the loop.\nStep 2: Run the code in block.\n\
    Step 3: Go to Step 1.\n\nDo while loop\n\n```\ndo {\n  // run this code in block\n\
    \  i++;\n} while (i<3);\n```\n\n+   Step 1: Run the code in block.\nStep 2: If\
    \ the condition is true, proceed; or else end the loop.\nStep 3: Go to Step 1."
- md: " ## Ways to Create a Variable\n\nThere are 3 ways to create variables in JavaScript:\n\
    `var`, `let` and `const`. Variables created with `var` are in scope of the function\
    \ (or global if declared in the global scope); `let` variables are block scoped;\
    \ and `const` variables are like `let` plus their values cannot be re-assigned.\n\
    \n```\nvar a = \"some value\";    // functional or global scoped\nlet b = \"some\
    \ value\";    // block scoped\nconst c = \"some value\";  // block scoped + cannot\
    \ get new value\n```\n\n## Event Loop\n\n![](img/100a2f06642446eb339b2146e2383d7b_6_0.png)\n\
    \n## 13 Browser\n\nA web browser is a pretty advance piece of software which contains\
    \ a lot of components. Many of these components are accessible to a web developer,\
    \ so we can create complex web apps. At the same time a lot of components are\
    \ kept out of reach of the web developer for security purposes. For instance,\
    \ we as web developers can get access to the user's location, but we cannot get\
    \ access to the user's saved passwords or browsing history. **Let's see below\
    \ how a browser is structured:**\n\n![](img/100a2f06642446eb339b2146e2383d7b_7_0.png)\n\
    \n## DOM - Document Object Model\n\n### Query/Get Elements\n\n```\n// Preferred\
    \ way:\ndocument.querySelector('css-selectors')\ndocument.querySelectorAll('css-selectors',\
    \ ...)\n```\n\n```\n// Old ways, and still work:\ndocument.getElementsByTagName('element-name')\n\
    document.getElementsByClassName('class-name')\ndocument.getElementById('id')\n\
    ```\n\n### Create / clone Element\n\n```\ndocument.createElement('div')\ndocument.createTextNode('some\
    \ text here')\nnode.cloneNode()\nnode.textContent = 'some text here'\n```\n\n\
    ### Add node to document\n\n```\nparentNode.appendChild(nodeToAdd)\nparentNode.insertBefore(nodeToAdd,\
    \ childNode)\n```\n\n### Get Element Details\n\n```\nnode.nextSibling\nnode.firstChild\n\
    node.lastChild\nnode.parentNode\nnode.childNodes\nnode.children\n```\n\n### Modify\
    \ Element\n\n```\nnode.style.color = 'red'\nnode.style.padding = '10px',\nnode.style.fontSize\
    \ = '200%'\n\nnode.setAttribute('attr-name', 'attr-value')\nnode.removeAttribute('attr-name')\n\
    ```\n\n### Get and Modify Element Class\n\n```\nnode.classList\nnode.classList.add('class-name',\
    \ ...)\nnode.classList.remove('class-name', ...)\nnode.classList.toggle('class-name')\n\
    node.classList.contains('class-name')\nnode.classList.replace('old', 'new')\n\
    ```\n\n### Remove Node\n\n```\nparentNode.removeChild(nodeToRemove)\n// Hack to\
    \ remove self\nnodeToRemove.parentNode.removeChild(nodeToRemove)\n```\n\n### What\
    \ is a \"Node\"?\n(in the context of DOM)\n\n**Node:** Every item in the DOM tree\
    \ is called a node. There are two types of node - A text node, and an element\
    \ node:\n\n**Text Node:** Node that has text.\n\n**Element Node:** Node that has\
    \ an element.\n\n**Child Node:** A node which is a child of another node.\n\n\
    **Parent Node:** A node which has one LIKE child.\n\n**Descendent Node:** A node\
    \ which is nested deep in the tree.\n\n**Sibling Node:** A node that share the\
    \ same parent node.\n\n### Events\n\n```\nnode.addEventListener('event-name',\
    \ callback-function)\nnode.removeEventListener('event-name', callback-function)\n\
    ```\n\nList of Events: https://developer.mozilla.org/en-US/docs/Web/Events\nor\
    \ google \"Mozilla event reference\"\n\n## Auto Inherited Properties\n\nWhen you\
    \ create a value in JavaScript, certain properties are automatically inherited\
    \ by this value. This magic happens because every **type** has a **constructor**\
    \ with a special property called **prototype**. All methods on the **prototype**\
    \ gets automatically inherited by the new value created for that **type**. Take\
    \ a look at some of of these methods on the right.\n\n```\nconst thing = \"some\
    \ text\";\n```\n\n```\nconst num = 123.45;\n```\n\nGoogle 'Mozilla String' to\
    \ find the docs\n\nGoogle 'Mozilla Number' to find the docs\n\nGoogle 'Mozilla\
    \ Array' to find the docs\n\nGoogle 'Mozilla Boolean' to find the docs\n\n- `.concat()`\n\
    - `.charAt()`\n- `.indexOf()`\n- `.startsWith()`\n- `.endsWith()`\n- `.split()`\n\
    - `.slice()`\n\n- `.toFixed()`\n- `.toPrecision()`\n- `.toString()`\n\n- `.filter()`\n\
    - `.map()`\n- `.find()`\n- `.every()`\n- `.some()`\n- `.sort()`\n- `.slice()`\n\
    - `.splice()`\n- `.reduce()`\n- `.forEach()`\n\n- `.toString()`\n\n## Built-in\
    \ Objects\n\nJavaScript gives us a ton of useful built-in objects to make our\
    \ lives easier. The **Date** and **Math** objects are very useful on a regular\
    \ basis. Take a look at some of their features on the right.\n\nFull list of builtin\
    \ objects in JavaScript visit https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects\n\
    \nGoogle 'Mozilla Math' to find the docs\n\nGoogle 'Mozilla Date' to find the\
    \ docs\n\n```\nMath.pow(2, 3) // 8\nMath.sqrt(16) // 4\nMath.min(7, 8, 6) // 6\n\
    Math.max(7, 8, 6) // 8\nMath.floor(123.45) // 123\nMath.ceil(123.45) // 124\n\
    Math.round(123.45) // 123\nMath.random() // 0.45..\n```\n\n```\nconst d = new\
    \ Date('9/17/1988');\nd.getDay()\nd.getFullYear()\nd.getMonth()\n\nDate.now()\n\
    Milliseconds since Jan 1, 1970\n```\n\n## 17 Promise\n\n**What is a Promise?**\n\
    \nPromise is an object that provides a useful construct when dealing with asynchronous\
    \ tasks. A promise is called a \"Promise\" because it guarantees it will run upon\
    \ success or failure of that task.\n\nWorking with a promise consists of two parts;\
    \ (A) Creating a promise, and (B) Using a promise.\n\n**What is an Async task?**\n\
    \nAn async task is one in which a third-party process is doing the task.\n\nExamples:\n\
    \n- Requesting/sending data to a database\n- Requesting/sending data via HTTP\
    \ protocol\n- Working with the file system of the computer\n\n```\n// (A) Create\
    \ a promise\nconst p = new Promise((resolve, reject)=>{\n  // Do some async task\n\
    \  setTimeout(()=>{\n    if(condition){\n      resolve('Successful login');\n\
    \    } else {\n      reject('Login failed');\n    }\n  }, 2000)\n})\n```\n\n```\n\
    // (B) Using a promise\np.then((res)=>{\n  console.log(res)\n})\n.catch((err)=>{\n\
    \  console.log(err)\n})\n```\n\n**Note:** 90% of the time you will be working\
    \ with pre-existing promises. The step of \"Creating a promise\" would be done\
    \ for you either by a library, framework or environment you are using. Examples\
    \ of promises: fetch\n\n## 18 'this' keyword\n\nThe this keyword is used inside\
    \ a function. The this keyword is merely a reference to another object.\n\nWhat\
    \ the this keyword refers to depends on the scenario or the way the function is\
    \ implemented. Here are the 3 scenarios to remember.\n\n### Scenario #1: this\
    \ inside a function\n\nThe this keyword points to global object.\n\n### Scenario\
    \ #2: this inside a method\n\nThe this keyword points to the object the method\
    \ is in.\n\n### Scenario #3: When function is run with call, bind or apply\n\n\
    When a function is called using the .call(param) .bind(param) or .apply(param)\
    \ method, the first param become the object that the this keyword refers to.\n\
    \n**Important Note:**\nIn the browser, global is the window object.\nIn Node.js,\
    \ global is the global object.\n\n```\nvar name = \" Fatema\";\n\nfunction fun(){\n\
    \    // some code here\n    console.log(this.name);\n}\n\nconst user = {\n   \
    \ name: \"Marium\",\n    yearOfBirth: 1999,\n    calcAge: function(){\n      \
    \  const currentYear = (new Date()).getFullYear();\n        return currentYear\
    \ - this.yearOfBirth;\n    }\n}\n\nfun();           // 'this' is global. Logs\
    \ \"Fatema\"\nuser.calcAge();  // 'this' is the user object\nfun.call(user); \
    \ // 'this' is the user object. Logs \"Marium\"\n```\n\n## 19 Constructor\n\n\
    **What is a constructor?**\nIn JavaScript, a constructor is a special function\
    \ that acts as a mold to create new objects.\n\nThere are numerous built-in constructors\
    \ in JavaScript, such as `String`, `Number`, `Promise`, `Date`, `Array`, `Object`,\
    \ and many more.\n\nWe can create our own custom constructors if need be.\n\n\
    A great place to use a constructor is when you are creating multiple objects of\
    \ the same kind.\n\nThere are two parts to working with a constructor:\n\n1. **Defining\
    \ a constructor**\n   When creating a custom constructor\n\n2. **Using a constructor**\n\
    \   with the \"new\" keyword\n\n```\n// Defining a Constructor\nfunction Car(make,\
    \ model, year){\n  this.make = make;\n  this.model = model;\n  this.year = year;\n\
    \n  this.setMiles = function(miles){\n    this.miles = miles\n    return miles;\n\
    \  }\n}\n\n// Using a constructor\nconst car1 = new Car('Toyota', 'Prius', 2016);\n\
    const car2 = new Car('Hyundai', 'Sonata', 2018);\n\n// Adding method to the constructor\
    \ prototype\nCar.prototype.age = function(){\n  return (new Date()).getFullYear()\
    \ - this.year;\n}\n\ncar1.age(); // 2\n```\n\n> **Rule of thumb:**\nA) Set properties\
    \ inside a constructor.\n\nB) Set methods inside the prototype property.\n\n>\
    \ **\"new\" keyword**\nThe new keyword is used to create a new object (instance)\
    \ from the constructor.\n\n> **\"prototype\" property**\nprototype is a special\
    \ property on every object. Properties (methods or values) attached to the prototype\
    \ property get inherited to every instance of the constructor."
  mdcn: "\n ## 创建变量的方式\n\n在 JavaScript 中有 3 种创建变量的方式：\n`var`、`let` 和 `const`。使用 `var`\
