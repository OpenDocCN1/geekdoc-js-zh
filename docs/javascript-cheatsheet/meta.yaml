  - "[PAGE 10]\n\n# ## 17 Promise\n\n**What is a Promise?**\n\nPromise is an object\
    \ that provides a useful construct when dealing with asynchronous tasks. A promise\
    \ is called a \"Promise\" because it guarantees it will run upon success or failure\
    \ of that task.\n\nWorking with a promise consists of two parts; (A) Creating\
    \ a promise, and (B) Using a promise.\n\n**What is an Async task?**\n\nAn async\
    \ task is one in which a third-party process is doing the task.\n\nExamples:\n\
    \n+   - Requesting/sending data to a database\n- Requesting/sending data via HTTP\
    \ protocol\n- Working with the file system of the computer\n\n```\n// (A) Create\
    \ a promise\nconst p = new Promise((resolve, reject)=>{\n  // Do some async task\n\
    \  setTimeout(()=>{\n    if(condition){\n      resolve('Successful login');\n\
    \    } else {\n      reject('Login failed');\n    }\n  }, 2000)\n})\n```\n\n```\n\
    // (B) Using a promise\np.then((res)=>{\n  console.log(res)\n})\n.catch((err)=>{\n\
    \  console.log(err)\n})\n```\n\n**Note:** 90% of the time you will be working\
    \ with pre-existing promises. The step of \"Creating a promise\" would be done\
    \ for you either by a library, framework or environment you are using. Examples\
    \ of promises: fetch"
  - "[PAGE 11]\n\n# 18 'this' keyword\n\nThe this keyword is used inside a function.\
    \ The this keyword is merely a reference to another object.\n\nWhat the this keyword\
    \ refers to depends on the scenario or the way the function is implemented. Here\
    \ are the 3 scenarios to remember.\n\n# Scenario #1: this inside a function\n\n\
    The this keyword points to global object.\n\n# Scenario #2: this inside a method\n\
    \nThe this keyword points to the object the method is in.\n\n# Scenario #3: When\
    \ function is run with call, bind or apply\n\nWhen a function is called using\
    \ the .call(param) .bind(param) or .apply(param) method, the first param become\
    \ the object that the this keyword refers to.\n\n**Important Note:**\nIn the browser,\
    \ global is the window object.\nIn Node.js, global is the global object.\n\n```\n\
    var name = \" Fatema\";\n\nfunction fun(){\n    // some code here\n    console.log(this.name);\n\
    }\n\nconst user = {\n    name: \"Marium\",\n    yearOfBirth: 1999,\n    calcAge:\
    \ function(){\n        const currentYear = (new Date()).getFullYear();\n     \
    \   return currentYear - this.yearOfBirth;\n    }\n}\n\nfun();           // 'this'\
    \ is global. Logs \"Fatema\"\nuser.calcAge();  // 'this' is the user object\n\
    fun.call(user);  // 'this' is the user object. Logs \"Marium\"\n```"
  - "[PAGE 12]\n\n# 19 Constructor\n\n**What is a constructor?**\nIn JavaScript, a\
    \ constructor is a special function that acts as a mold to create new objects.\n\
    \nThere are numerous built-in constructors in JavaScript, such as `String`, `Number`,\
    \ `Promise`, `Date`, `Array`, `Object`, and many more.\n\nWe can create our own\
    \ custom constructors if need be.\n\nA great place to use a constructor is when\
    \ you are creating multiple objects of the same kind.\n\nThere are two parts to\
    \ working with a constructor:\n\n+   1. **Defining a constructor**\n   When creating\
    \ a custom constructor\n\n2. **Using a constructor**\n   with the \"new\" keyword\n\
    \n```\n// Defining a Constructor\nfunction Car(make, model, year){\n  this.make\
    \ = make;\n  this.model = model;\n  this.year = year;\n\n  this.setMiles = function(miles){\n\
    \    this.miles = miles\n    return miles;\n  }\n}\n\n// Using a constructor\n\
    const car1 = new Car('Toyota', 'Prius', 2016);\nconst car2 = new Car('Hyundai',\
    \ 'Sonata', 2018);\n\n// Adding method to the constructor prototype\nCar.prototype.age\
    \ = function(){\n  return (new Date()).getFullYear() - this.year;\n}\n\ncar1.age();\
    \ // 2\n```\n\n> **Rule of thumb:**\nA) Set properties inside a constructor.\n\
    \nB) Set methods inside the prototype property.\n\n> **\"new\" keyword**\nThe\
    \ new keyword is used to create a new object (instance) from the constructor.\n\
    \n> **\"prototype\" property**\nprototype is a special property on every object.\
    \ Properties (methods or values) attached to the prototype property get inherited\
    \ to every instance of the constructor."
