  md: "# # ⑧ Conditional Statements\n\nConditional statements allow our program to\
    \ run specific code only if certain conditions are met. For instance, lets say\
    \ we have a shopping app. We can tell our program to hide the \"checkout\" button\
    \ if the shopping cart is empty.\n\n**If -else Statement**: Run certain code,\
    \ \"if\" a condition is met. If the condition is not met, the code in the \"else\"\
    \ block is run (if available.)\n\n```\nif (a > 0) {\n    // run this code\n} else\
    \ if (a < 0) {\n    // run this code\n} else {\n    // run this code\n}\n```\n\
    \n# # ⑨ Truthy / Falsy\n\nThere are certain values in JavaScript that return true\
    \ when coerced into boolean. Such values are called **truthy** values. On the\
    \ other hand, there are certain values that return false when coerced to boolean.\
    \ These values are knows as **falsy** values.\n\n**Switch Statement**: Takes a\
    \ single expression, and runs the code of the \"case\" where the expression matches.\
    \ The **\"break\"** keyword is used to end the switch statement.\n\n```\nswitch\
    \ (expression) {\n    case choice1:\n        // run this code\n        break;\n\
    \    case choice1:\n        // run this code\n        break;\n    default:\n \
    \       // run this code\n}\n```\n\n| Truthy Values | Falsy Values |\n| :--- |\
    \ :--- |\n| true | false |\n| \"text\" | \" \" |\n| 72 | 0 |\n| -72 | -0 |\n|\
    \ Infinity | NaN |\n| -Infinity | null |\n| {} | undefined |\n| [] | |\n\n**Ternary\
    \ Operator:** A ternary operator returns the first value if the expression is\
    \ truthy, or else returns the second value.\n\n```\n(expression)? ifTrue: ifFalse;\n\
    ```"
