  md: "# ## 17 Promise\n\n**What is a Promise?**\n\nPromise is an object that provides\
    \ a useful construct when dealing with asynchronous tasks. A promise is called\
    \ a \"Promise\" because it guarantees it will run upon success or failure of that\
    \ task.\n\nWorking with a promise consists of two parts; (A) Creating a promise,\
    \ and (B) Using a promise.\n\n**What is an Async task?**\n\nAn async task is one\
    \ in which a third-party process is doing the task.\n\nExamples:\n\n+   - Requesting/sending\
    \ data to a database\n- Requesting/sending data via HTTP protocol\n- Working with\
    \ the file system of the computer\n\n```\n// (A) Create a promise\nconst p = new\
    \ Promise((resolve, reject)=>{\n  // Do some async task\n  setTimeout(()=>{\n\
    \    if(condition){\n      resolve('Successful login');\n    } else {\n      reject('Login\
    \ failed');\n    }\n  }, 2000)\n})\n```\n\n```\n// (B) Using a promise\np.then((res)=>{\n\
    \  console.log(res)\n})\n.catch((err)=>{\n  console.log(err)\n})\n```\n\n**Note:**\
    \ 90% of the time you will be working with pre-existing promises. The step of\
    \ \"Creating a promise\" would be done for you either by a library, framework\
    \ or environment you are using. Examples of promises: fetch"
  merge: -1
