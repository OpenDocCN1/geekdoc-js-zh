  md: '# # Ways to create a variable


    There are 3 ways to create variables in JavaScript:

    `var`, `let` and `const`. Variables created with `var` are in scope of the function
    (or global if declared in the global scope); `let` variables are block scoped;
    and `const` variables are like `let` plus their values cannot be re-assigned.


    ```

    var a = "some value";    // functional or global scoped

    let b = "some value";    // block scoped

    const c = "some value";  // block scoped + cannot get new value

    ```


