- md: "# Seven (7) Types\n\n1. String\n2. Number\n3. Boolean\n4. Null\n5. Undefined\n\
    6. Symbol\n7. Object\n   - Array\n   - Function\n\n```\n\"Any text\"\n123.45\n\
    true or false\nnull\nundefined\nSymbol('something')\n{ key: 'value' }\n[1, \"\
    text\", false]\nfunction name() { }\n```\n\n# Basic Vocabulary\n\n**Variable**\n\
    A named reference to a value is a variable.\n\n**Operator**\nOperators are reserved-words\
    \ that perform action on values and variables.\nExamples: + - = * in === typeof\
    \ != ...\n\n```\nvar a = 7 + \"2\";\n```\n\n**Statement**\nA group of words, numbers\
    \ and operators that do a task is a statement.\n\n**Keyword / reserved word**\n\
    Any word that is part of the vocabulary of the programming language is called\
    \ a keyword (a.k.a reserved word).\nExamples: var = + if for...\n\n**Expression**\n\
    A reference, value or a group of reference(s) and value(s) combined with operator(s),\
    \ which result in a single value.\n\n**Note:** var, let & const are all valid\
    \ keywords to declare variables. The difference between them is covered on page\
    \ 7 of this cheatsheet.\n\n# Object\n\nAn object is a data type in JavaScript\
    \ that is used to store a combination of data in a simple key-value pair. Thats\
    \ it.\n\n**Key**\nThese are the keys in user object.\n\n```\nvar user = {\n  name:\
    \ \"Aziz Ali\",\n  yearOfBirth: 1988,\n  calculateAge: function(){\n    // some\
    \ code to calculate age\n  }\n}\n```\n\n**Value**\nThese are the values of the\
    \ respective keys in user object.\n\n**Method**\nIf a key has a function as a\
    \ value, its called a method.\n\n# Function\n\nA function is simply a bunch of\
    \ code bundled in a section. This bunch of code ONLY runs when the function is\
    \ called. Functions allow for organizing code into sections and code reusability.\n\
    \nUsing a function has ONLY two parts. (1) Declaring/defining a function, and\
    \ (2) using/running a function.\n\n# Name of function\n\nThats it, its just a\
    \ name you give to your function. Tip: Make your function names descriptive to\
    \ what the function does.\n\n# Return (optional)\n\nA function can optionally\
    \ spit-out or \"return\" a value once its invoked. Once a function returns, no\
    \ further lines of code within the function run.\n\n```\n// Function declaration\
    \ / Function statement\nfunction someName(param1, param2){\n\n    // bunch of\
    \ code as needed...\n    var a = param1 + \"love\" + param2;\n    return a;\n\
    }\n\n// Invoke (run / call) a function\nsomeName(\"Me\", \"You\")\n```\n\n# Invoke\
    \ a function\n\nInvoking, calling or running a function all mean the same thing.\
    \ When we write the function name, in this case someName, followed by the brackets\
    \ symbol () like this someName(), the code inside the function gets executed.\n\
    \n# Passing parameter(s) to a function (optional)\n\nAt the time of invoking a\
    \ function, parameter(s) may be passed to the function code.\n\n# Parameters /\
    \ Arguments (optional)\n\nA function can optionally take parameters (a.k.a arguments).\
    \ The function can then use this information within the code it has.\n\n# Code\
    \ block\n\nAny code within the curly braces { ... } is called a \"block of code\"\
    , \"code block\" or simply \"block\". This concept is not just limited to functions.\
    \ \"if statements\", \"for loops\" and other statements use code blocks as well.\n\
    \n# Vocabulary around variables and scope\n\n**Variable Declaration**\nThe creation\
    \ of the variable.\n\n**Scope**\nThe limits in which a variable exists.\n\n```\n\
    var a;\n```\n\n```\nvar a = \"global\";\n```\n\n**Variable Initialization**\n\
    The initial assignment of value to a variable.\n\n**Global scope**\nThe outer\
    \ most scope is called the Global scope.\n\n```\na = 12;\n```\n\n```\nfunction\
    \ first(){\n  var a = \"fresh\";\n\n  function second(){\n    console.log(a);\n\
    \  }\n}\n```\n\n**Functional scope**\nAny variables inside a function is in scope\
    \ of the function.\n\n**Variable Assignment**\nAssigning value to a variable.\n\
    \n```\na = \"me\";\n```\n\n**Lexical Environment (Lexical scope)**\nThe physical\
    \ location (scope) where a variable or function is declared is its lexical environment\
    \ (lexical scope).\n\n**Scope chain**\nThe nested hierarchy of scope is called\
    \ the scope chain. The JS engine looks for variables in the scope chain upwards\
    \ (in its ancestors, until found).\n\n**Hoisting**\nVariables are declared at\
    \ the top of the function automatically, and initialized at the time they are\
    \ run.\n\n```\nconsole.log(a);\nvar a = \"me\";\n```\n\n**Rule:**\n(1) Variables\
    \ in the outer scope can be accessed in a nested scope; But variables inside a\
    \ nested scope CANNOT be accessed by the outer scope. (a.k.a private variables.)\n\
    \n(2) Variables are picked up from the lexical environment.\n\n# JavaScript Cheatsheet\n\
    \n# 6 Operators\n\nFull list of JavaScript operators https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators\n\
    \nOperators are reserved-words that perform action on values and variables.\n\n\
    **Arithmetic**\n+ Add\n- Subtract\n* Multiply\n/ Divide\n% Remainder\n** Exponential\n\
    \n**Relational / Comparison**\n>= Greater than or equal to\n<= Less than or equal\
    \ to\n!= Not equal after coercion\n!== Not equal\n\n**Operator Precedence**\n\
    Given multiple operators are used in an expression, the \"Operator Precedence\"\
    \ determines which operator will be executed first. The higher the precedence,\
    \ the earlier it will get executed.\n\n**Assignment**\n= Assign value\n+= Add\
    \ then assign\n-= Subtract then assign\n*= Multiply then assign\n\n**Increment\
    \ / Decrement**\n++ Postfix increment\n-- Postfix decrement\n\n++ Prefix increment\n\
    -- Prefix decrement\n\n**Operator Associativity**\nGiven multiple operators have\
    \ the same precedence, \"Associativity\" determines in which direction the code\
    \ will be parsed.\n\nSee the Operator Precedence and Associativity table here:\n\
    http://bit.ly/operatortable\n\n**Logical**\n|| Or\n&& And\n\n**Others**\ntypeof\n\
    instanceof\n()\n...spread-operator\n.\n.[.]\nnew\ndelete\n(.. ? .. : ..)\n\n#\
    \ 7 Coercion\n\nWhen trying to compare different \"types\", the JavaScript engine\
    \ attempts to convert one type into another so it can compare the two values.\n\
    \nType coercion priority order:\n1. String\n2. Number\n3. Boolean\n\n**Coercion\
    \ in action**\nDoes this make sense?\n\n**Equality**\n=== Equality\n== Equality\
    \ with coercion\n\n**Conversion**\n+ Convert to number\n- Convert to number then\
    \ negate it\n! Convert to boolean then inverse it\n\n```\n2 + \"7\";  // \"27\"\
    \ntrue - 5  // -4\n```\n\n# Conditional Statements\n\nConditional statements allow\
    \ our program to run specific code only if certain conditions are met. For instance,\
    \ lets say we have a shopping app. We can tell our program to hide the \"checkout\"\
    \ button if the shopping cart is empty.\n\n**If -else Statement**: Run certain\
    \ code, \"if\" a condition is met. If the condition is not met, the code in the\
    \ \"else\" block is run (if available.)\n\n```\nif (a > 0) {\n    // run this\
    \ code\n} else if (a < 0) {\n    // run this code\n} else {\n    // run this code\n\
    }\n```\n\n# Truthy / Falsy\n\nThere are certain values in JavaScript that return\
    \ true when coerced into boolean. Such values are called **truthy** values. On\
    \ the other hand, there are certain values that return false when coerced to boolean.\
    \ These values are known as **falsy** values.\n\n**Switch Statement**: Takes a\
    \ single expression, and runs the code of the \"case\" where the expression matches.\
    \ The **\"break\"** keyword is used to end the switch statement.\n\n```\nswitch\
    \ (expression) {\n    case choice1:\n        // run this code\n        break;\n\
    \    case choice2:\n        // run this code\n        break;\n    default:\n \
    \       // run this code\n}\n```\n\n| Truthy Values | Falsy Values |\n| :--- |\
    \ :--- |\n| true | false |\n| \"text\" | \" \" |\n| 72 | 0 |\n| -72 | -0 |\n|\
    \ Infinity | NaN |\n| -Infinity | null |\n| {} | undefined |\n| [] | |\n\n**Ternary\
    \ Operator:** A ternary operator returns the first value if the expression is\
    \ truthy, or else returns the second value.\n\n```\n(expression)? ifTrue: ifFalse;\n\
    ```\n\n# Loop Statements\n\nLoops are used to do something repeatedly. For instance\
    \ lets say we get a list of 50 blog posts from the database and we want to print\
    \ their titles on our page. Instead of writing the code 50 times, we would instead\
    \ use a loop to make this happen.\n\n**For loop**\n\n```\nfor (initial-expression;\
    \ condition; second-expression){\n  // run this code in block\n}\n```\n\nStep\
    \ 1: Run the initial expression.\nStep 2: Check if condition meets. If condition\
    \ meets, proceed; or else end the loop.\nStep 3: Run the code in block.\nStep\
    \ 4: Run the second-expression.\nStep 5: Go to Step 2.\n\n**While loop**\n\n```\n\
    while (i<3){\n  // run this code in block\n  i++;\n}\n```\n\nStep 1: If the condition\
    \ is true, proceed; or else end the loop.\nStep 2: Run the code in block.\nStep\
    \ 3: Go to Step 1.\n\n**Do while loop**\n\n```\ndo {\n  // run this code in block\n\
    \  i++;\n} while (i<3);\n```\n\nStep 1: Run the code in block.\nStep 2: If the\
    \ condition is true, proceed; or else end the loop.\nStep 3: Go to Step 1."
  mdcn: "\n# 七种（7）类型\n\n1. String\n2. Number\n3. Boolean\n4. Null\n5. Undefined\n\
    6. Symbol\n7. Object\n   - Array\n   - Function\n\n```\n\"Any text\"\n123.45\n\
    true or false\nnull\nundefined\nSymbol('something')\n{ key: 'value' }\n[1, \"\
    text\", false]\nfunction name() { }\n```\n\n# 基础词汇\n\n**Variable（变量）**\n对值的命名引用就是变量。\n\
    \n**Operator（运算符）**\n运算符是执行值和变量操作的保留字。\n示例：+ - = * in === typeof != ...\n\n```\n\
    var a = 7 + \"2\";\n```\n\n**Statement（语句）**\n完成一项任务的一组单词、数字和运算符。\n\n**Keyword\
    \ / reserved word（关键字 / 保留字）**\n作为编程语言词汇一部分的任何单词称为关键字（又称保留字）。\n示例：var = + if for...\n\
    \n**Expression（表达式）**\n一个引用、值，或引用与值通过运算符组合后产生单一值的结果。\n\n**注意：** var、let 和 const\
    \ 都是声明变量的有效关键字。它们之间的区别在本速查表第 7 页有介绍。\n\n# Object（对象）\n\n对象是 JavaScript 中的一种数据类型，用于以简单的键值对组合存储数据。就这么简单。\n\
    \n**Key（键）**\n这些是 user 对象中的键。\n\n```\nvar user = {\n  name: \"Aziz Ali\",\n  yearOfBirth:\
    \ 1988,\n  calculateAge: function(){\n    // some code to calculate age\n  }\n\
    }\n```\n\n**Value（值）**\n这些是 user 对象中对应键的值。\n\n**Method（方法）**\n如果某个键的值是函数，则称之为方法。\n\
    \n# Function（函数）\n\n函数就是将一组代码打包在一个区块中。这组代码**只有**在函数被调用时才会运行。函数可以将代码组织成区块，并实现代码复用。\n\
    \n使用函数**只有**两个部分：（1）声明/定义函数，以及（2）使用/运行函数。\n\n# 函数名称\n\n就这么简单，就是给函数起个名字。提示：让函数名称具有描述性，说明函数的功能。\n\
    \n# Return（返回，可选）\n\n函数可以选择性地\"吐出\"或\"返回\"一个值，在它被调用时。一旦函数返回，函数内部将不再执行后续代码。\n\n\
    ```\n// 函数声明 / 函数语句\nfunction someName(param1, param2){\n\n    // 根据需要编写的代码...\n\
    \    var a = param1 + \"love\" + param2;\n    return a;\n}\n\n// 调用（运行 / 执行）函数\n\
    someName(\"Me\", \"You\")\n```\n\n# 调用函数\n\n调用、呼叫或运行函数都是同一个意思。当我们写下函数名称，在本例中是\
    \ someName，后跟括号符号 ()，像这样 someName()，函数内部的代码就会被执行。\n\n# 向函数传递参数（可选）\n\n在调用函数时，可以向函数代码传递参数。\n\
    \n# Parameters / Arguments（参数，可选）\n\n函数可以选择性地接收参数（又称实参）。函数随后可以在其代码中使用这些信息。\n\n\
    # 代码块\n\n花括号 { ... } 内的任何代码称为\"代码区块\"、\"代码块\"或简称\"块\"。这个概念不仅限于函数。\"if 语句\"、\"\
    for 循环\"和其他语句也会使用代码块。\n\n# 变量与作用域相关词汇\n\n**Variable Declaration（变量声明）**\n创建变量。\n\
    \n**Scope（作用域）**\n变量存在的范围。\n\n```\nvar a;\n```\n\n```\nvar a = \"global\";\n```\n\
    \n**Variable Initialization（变量初始化）**\n为变量赋予初始值。\n\n**Global scope（全局作用域）**\n最外层的作用域称为全局作用域。\n\
    \n```\na = 12;\n```\n\n```\nfunction first(){\n  var a = \"fresh\";\n\n  function\
    \ second(){\n    console.log(a);\n  }\n}\n```\n\n**Functional scope（函数作用域）**\n\
    函数内部的任何变量都处于该函数的作用域中。\n\n**Variable Assignment（变量赋值）**\n为变量赋值。\n\n```\na = \"\
    me\";\n```\n\n**Lexical Environment (Lexical scope)（词法环境 / 词法作用域）**\n变量或函数声明的物理位置（作用域）就是其词法环境（词法作用域）。\n\
    \n**Scope chain（作用域链）**\n作用域的嵌套层级称为作用域链。JS 引擎会在作用域链中向上查找变量（在其祖先作用域中查找，直到找到）。\n\
    \n**Hoisting（提升）**\n变量会自动声明在函数顶部，并在运行时才初始化。\n\n```\nconsole.log(a);\nvar a = \"\
    me\";\n```\n\n**规则：**\n（1）外层作用域中的变量可以在嵌套作用域中访问；但嵌套作用域中的变量**不能**被外层作用域访问。（又称私有变量。）\n\
    \n（2）变量从其词法环境中获取。\n\n# JavaScript 速查表\n\n# 6 运算符\n\nJavaScript 运算符完整列表 https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators\n\
    \n运算符是执行值和变量操作的保留字。\n\n**Arithmetic（算术）**\n+ 加\n- 减\n* 乘\n/ 除\n% 取余\n** 指数\n\n\
    **Relational / Comparison（关系 / 比较）**\n>= 大于或等于\n<= 小于或等于\n!= 强制转换后不相等\n!== 不相等\n\
    \n**Operator Precedence（运算符优先级）**\n当表达式中使用多个运算符时，\"运算符优先级\"决定哪个运算符会先执行。优先级越高，越早执行。\n\
    \n**Assignment（赋值）**\n= 赋值\n+= 加后赋值\n-= 减后赋值\n*= 乘后赋值\n\n**Increment / Decrement（递增\
    \ / 递减）**\n++ 后缀递增\n-- 后缀递减\n\n++ 前缀递增\n-- 前缀递减\n\n**Operator Associativity（运算符结合性）**\n\
    当多个运算符优先级相同时，\"结合性\"决定代码将按哪个方向解析。\n\n运算符优先级和结合性表见：\nhttp://bit.ly/operatortable\n\
    \n**Logical（逻辑）**\n|| 或\n&& 与\n\n**Others（其他）**\ntypeof\ninstanceof\n()\n...spread-operator\n\
    .\n.[.]\nnew\ndelete\n(.. ? .. : ..)\n\n# 7 Coercion（强制转换）\n\n当尝试比较不同的\"类型\"时，JavaScript\
    \ 引擎会尝试将一种类型转换为另一种类型，以便比较两个值。\n\n类型强制转换优先级：\n1. String\n2. Number\n3. Boolean\n\
    \n**强制转换实例**\n这说得通吗？\n\n**Equality（相等性）**\n=== 相等\n== 带强制转换的相等\n\n**Conversion（转换）**\n\
    + 转换为数字\n- 转换为数字后取反\n! 转换为布尔值后取反\n\n```\n2 + \"7\";  // \"27\"\ntrue - 5  // -4\n\
    ```\n\n# 条件语句\n\n条件允许程序仅在满足特定条件时运行特定代码。例如，假设我们有一个购物应用。我们可以告诉程序，如果购物车为空，则隐藏\"结账\"\
    按钮。\n\n**If-else Statement（if-else 语句）**：如果满足某个条件，就运行特定代码。如果不满足条件，则运行 \"else\"\
    \ 区块中的代码（如果有）。\n\n```\nif (a > 0) {\n    // run this code\n} else if (a < 0) {\n\
    \    // run this code\n} else {\n    // run this code\n}\n```\n\n# Truthy / Falsy（真值\
    \ / 假值）\n\nJavaScript 中有某些值，当被强制转换为布尔值时返回 true。这类值称为 **truthy（真值）**。另一方面，有些值被强制转换为布尔值时返回\
    \ false。这些值称为 **falsy（假值）**。\n\n**Switch Statement（switch 语句）**：接收单个表达式，并运行表达式匹配的\
    \ \"case\" 中的代码。**\"break\"** 关键字用于结束 switch 语句。\n\n```\nswitch (expression) {\n\
    \    case choice1:\n        // run this code\n        break;\n    case choice2:\n\
    \        // run this code\n        break;\n    default:\n        // run this code\n\
    }\n```\n\n| Truthy Values（真值） | Falsy Values（假值） |\n| :--- | :--- |\n| true |\
    \ false |\n| \"text\" | \" \" |\n| 72 | 0 |\n| -72 | -0 |\n| Infinity | NaN |\n\
    | -Infinity | null |\n| {} | undefined |\n| [] | |\n\n**Ternary Operator（三元运算符）：**\
    \ 如果表达式为真值，则返回第一个值，否则返回第二个值。\n\n```\n(expression)? ifTrue: ifFalse;\n```\n\n#\
    \ 循环语句\n\n循环用于重复执行某些操作。例如，假设我们从数据库中获取了 50 篇博客文章，想要将它们的标题打印到页面上。与其将代码写 50 次，不如使用循环来实现。\n\
    \n**For loop（for 循环）**\n\n```\nfor (initial-expression; condition; second-expression){\n\
    \  // run this code in block\n}\n```\n\n步骤 1：执行初始表达式。\n步骤 2：检查条件是否满足。如果满足，继续；否则结束循环。\n\
    步骤 3：运行区块中的代码。\n步骤 4：执行第二个表达式。\n步骤 5：返回步骤 2。\n\n**While loop（while 循环）**\n\n```\n\
    while (i<3){\n  // run this code in block\n  i++;\n}\n```\n\n步骤 1：如果条件为真，继续；否则结束循环。\n\
    步骤 2：运行区块中的代码。\n步骤 3：返回步骤 1。\n\n**Do while loop（do while 循环）**\n\n```\ndo {\n\
    \  // run this code in block\n  i++;\n} while (i<3);\n```\n\n步骤 1：运行区块中的代码。\n\
    步骤 2：如果条件为真，继续；否则结束循环。\n步骤 3：返回步骤 1。\n"
