    \ once its invoked. Once a function returns, no further lines of code within the\
    \ function run.\n\n```\n// Function declaration / Function statement\nfunction\
    \ someName(param1, param2){\n\n    // bunch of code as needed...\n    var a =\
    \ param1 + \"love\" + param2;\n    return a;\n}\n\n// Invoke (run / call) a function\n\
    someName(\"Me\", \"You\")\n```\n\n# Invoke a function\n\nInvoking, calling or\
    \ running a function all mean the same thing. When we write the function name,\
    \ in this case someName, followed by the brackets symbol () like this someName(),\
    \ the code inside the function gets executed.\n\n# Passing parameter(s) to a function\
    \ (optional)\n\nAt the time of invoking a function, parameter(s) may be passed\
    \ to the function code.\n\n# Parameters / Arguments (optional)\n\nA function can\
    \ optionally take parameters (a.k.a arguments). The function can then use this\
    \ information within the code it has.\n\n# Code block\n\nAny code within the curly\
    \ braces { ... } is called a \"block of code\", \"code block\" or simply \"block\"\
    . This concept is not just limited to functions. \"if statements\", \"for loops\"\
    \ and other statements use code blocks as well."
  - "[PAGE 2]\n\n# # Vocabulary around variables and scope\n\n**Variable Declaration**\n\
    The creation of the variable.\n\n**Scope**\nThe limits in which a variable exists.\n\
    \n```\nvar a;\n```\n\n```\nvar a = \"global\";\n```\n\n**Variable Initialization**\n\
    The initial assignment of value to a variable.\n\n**Global scope**\nThe outer\
    \ most scope is called the Global scope.\n\n```\na = 12;\n```\n\n```\nfunction\
    \ first(){\n  var a = \"fresh\";\n\n  function second(){\n    console.log(a);\n\
    \  }\n}\n```\n\n**Functional scope**\nAny variables inside a function is in scope\
    \ of the function.\n\n**Variable Assignment**\nAssigning value to a variable.\n\
    \n```\na = \"me\";\n```\n\n**Lexical Environment (Lexical scope)**\nThe physical\
    \ location (scope) where a variable or function is declared is its lexical environment\
    \ (lexical scope).\n\n**Scope chain**\nThe nested hierarchy of scope is called\
    \ the scope chain. The JS engine looks for variables in the scope chain upwards\
    \ (it its ancestors, until found)\n\n**Hoisting**\nVariables are declared at the\
    \ top of the function automatically, and initialized at the time they are run.\n\
    \n```\nconsole.log(a);\nvar a = \"me\";\n```\n\n**Rule:**\n(1) Variables in the\
    \ outer scope can be accessed in a nested scope; But variables inside a nested\
    \ scope CANNOT be accessed by the outer scope. (a.k.a private variables.)\n\n\
    (2) Variables are picked up from the lexical environment."
