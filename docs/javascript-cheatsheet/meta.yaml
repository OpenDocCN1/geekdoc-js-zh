  md: "# 19 Constructor\n\n**What is a constructor?**\nIn JavaScript, a constructor\
    \ is a special function that acts as a mold to create new objects.\n\nThere are\
    \ numerous built-in constructors in JavaScript, such as `String`, `Number`, `Promise`,\
    \ `Date`, `Array`, `Object`, and many more.\n\nWe can create our own custom constructors\
    \ if need be.\n\nA great place to use a constructor is when you are creating multiple\
    \ objects of the same kind.\n\nThere are two parts to working with a constructor:\n\
    \n+   1. **Defining a constructor**\n   When creating a custom constructor\n\n\
    2. **Using a constructor**\n   with the \"new\" keyword\n\n```\n// Defining a\
    \ Constructor\nfunction Car(make, model, year){\n  this.make = make;\n  this.model\
    \ = model;\n  this.year = year;\n\n  this.setMiles = function(miles){\n    this.miles\
    \ = miles\n    return miles;\n  }\n}\n\n// Using a constructor\nconst car1 = new\
    \ Car('Toyota', 'Prius', 2016);\nconst car2 = new Car('Hyundai', 'Sonata', 2018);\n\
    \n// Adding method to the constructor prototype\nCar.prototype.age = function(){\n\
    \  return (new Date()).getFullYear() - this.year;\n}\n\ncar1.age(); // 2\n```\n\
    \n> **Rule of thumb:**\nA) Set properties inside a constructor.\n\nB) Set methods\
    \ inside the prototype property.\n\n> **\"new\" keyword**\nThe new keyword is\
    \ used to create a new object (instance) from the constructor.\n\n> **\"prototype\"\
    \ property**\nprototype is a special property on every object. Properties (methods\
    \ or values) attached to the prototype property get inherited to every instance\
    \ of the constructor."
  merge: -1
