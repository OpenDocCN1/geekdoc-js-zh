    # Using while Loops


    Like for loops, while loops repeatedly execute the Java code in their bodies.
    Unlike loops, loops are not intended to iterate for a fixed amount of time but
    to loop as long as a certain Boolean condition holds.


    The syntax of a while loop is the following:


    ```

    while(booleanExpression)

    javaCodeBlock

    ```


    This can be read as "while booleanExpression is true, execute javaCodeBlock".
    The booleanExpression is an expression that evaluates to true or false. The javaCodeBlock
    is executed repeatedly as long as the booleanExpression evaluates to true. Otherwise
    execution continues after the while loop.


    while loops are equivalent to the following for loop:


    ```

    for(;booleanExpression);

    javaCodeBlock

    ```


    The reason to use a while loop instead of a for loop is that intuitively a for
    loop would want to go through the whole list of items, whereas the while loop
    searches the list until the item is found. The JSP in Listing 9.7 searches for
    an item, and Figure 9.4 shows the results of both a successful and a failed search.


