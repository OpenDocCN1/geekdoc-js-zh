    \ Model and the forward action is used for Forwarding Requests Model.\n3. If your\
    \ application follows the Loosely Coupled Model and one JSP changes, does it affect\
    \ the other JSP application?\n\n   In the Loosely Coupled Model one JSP application\
    \ does not need to change if the other one has.\n\n![](img/4df77e7d634c573982f3b815243f9fd2_403_0.png)"
