    # # Extracting Host and Port Information


    The request object provides methods to obtain some information about the machine
    from which the request originated, as well as to determine some meta information
    about the request itself. This information can be used to implement some security
    policies that consider the originating host as a safe machine. Table 10.2 lists
    methods useful for determining machine and request information.


    # ## TABLE 10.2 Machine-Related Methods of the Request Object


    | Method | Description |

    | --- | --- |

    | getRemoteAddr() | Returns the IP address of the client machine that generated
    the request; for example, 127.0.0.1 |

    | getRemoteHost() | Returns the name of the machine of the client that generated
    the request; for example, webit |

    | getServerName() | Returns the name of the local server that received the request;
    for example, alice |

    | getServerPort() | Returns the port number the local server is listening to for
    incoming requests from client machines; for example, 7001 |

    | getScheme() | Returns the name of the scheme used to create the request; for
    example, HTTP, or FTP |

    | getProtocol() | Returns the name and version of the protocol used to communicate
    the request; for example, HTTP/1.1 |

    | getMethod() | Returns the name of HTTP method with which the request was made;
    for example, GET, POST, or PUT |

    | getCharacterEncoding() | Returns the character encoding of body of the request;
    for example, Cp1252 |

    | isSecure() | Returns whether the request was made through a secure channel as
    HTTPS |

    | getContentLength() | Returns the length of the body in bytes |

    | getContentType() | Returns the MIME type of the body |'
