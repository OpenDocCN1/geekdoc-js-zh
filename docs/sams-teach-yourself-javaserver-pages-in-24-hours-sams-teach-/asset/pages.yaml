- img_proc: true
  md: '# Hour 19


    A benefit of using custom tags over JavaBeans or other server-side utility classes
    is that tags can contain bodies where a JSP element of template data can be used.


    Extending the functionality of JSPs with custom tags is where tag libraries come
    into play. Tag libraries allow you to create your own action tags.


    The JSP 1.1 specification allows you to create your own action tags, however it
    does not support the creation of custom directives.


    In this hour you will learn


    +   * What a tag library is

    * How to use a tag library


    # Understanding a Tag Library


    A tag library is a collection of user-defined action tags. New custom actions
    are defined using tag handlers. A tag library description (TLD) is used to describe
    the composition of the tag library.


    Tag handlers are server-side objects that are used at runtime to evaluate custom
    actions in a JSP. There are two interfaces that the tag handlers can implement,
    Tag and BodyTag. The Tag interface is used when the custom action does not use
    its body, or if it has one. If the custom action wants to manipulate its body
    content, the tag handler implements the BodyTag interface. The tag handlers can
    also use the TagSupport and BodySupport classes as base classes.


    The focus of this hour will be how to use available tag libraries and not on writing
    your own tag library classes. There are several examples that come with BEA''s
    WebLogic Server 5.1. You will be using their libraries to add more functionality
    to your JSP in this hour.


    A tag library description (TLD) is used to describe the tag library in general,
    each of its individual tags, version information on the JSP container and the
    tag library, and information on each action defined. The TLD is written in XML
    and has a .tld extension.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Extending JSP Functionality with Tag Libraries


    # The taglib Directive


    The taglib directive is used to import a tag library into your JSP. It locates
    the tag library and assigns it a unique handle, a reference to particular tag
    library. Therefore, when you want to use a custom action from that tag library,
    you specify the unique reference to the tag library and the name of the action
    you want to invoke. The general syntax of the taglib directive is


    ```

    <% taglib uri="TagLibraryURI" prefix="tagPrefix" %>

    ```


    The uri attribute takes a Uniform Resource Identifier that identifies the location
    of the tag library descriptor. This can be a relative URI or an absolute URI.


    The prefix is a unique way to identify the custom tags that are part of the tag
    library. Up to this point in this book all the actions you have used had a prefix
    of jsp. Now you will uniquely identify the contents of your JSP with the prefix
    attribute.


    An example of the taglib directive is


    ```

    <% taglib uri="META-INF/taglib.tld" prefix="example" %>

    ```


    The TLD.tld will be looked for in a directory named META-INF off the root of the
    Web Application.


    ![](img/4df77e7d634c573982f3b815243f9fd2_287_0.png)


    > A Web Application is a new concept in the Servlet 2.2 specification. It is a
    grouping of server-side resources such as JSPs, HTML documents, and Servlets.
    In Web Logic, if you do not explicitly define a Web Application, your JSPs will
    be implicitly placed in one with the root of the Web Application or the public_html
    directory. Hour 24, "Packaging and Deploying an Enterprise Application," you will
    create a Web Application and deploy it.


    The prefix is example, so if the tag library provided a custom tag increment that
    did not have a body, the actions would like


    ```

    <example:increment />

    ```


    Another example of a taglib directive is


    ```

    <% taglib uri="weblogic/taglib/session" prefix="session" %>

    ```


    The URI is an alias that resolves to a directory in a Web Application. Web applications
    use a web.xml file to describe the server-side resources, such as Servlets, JSPs,
    and HTML documents that compose the Web Application, and the mapping is done in
    that file. The prefix in the example tag is session, which uniquely identifies
    the tag library. An example of using that tag library would be


    ```

    <session:list />

    ```'
