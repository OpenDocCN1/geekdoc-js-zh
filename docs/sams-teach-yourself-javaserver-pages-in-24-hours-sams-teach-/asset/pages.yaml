  md: '# Processing Requests from the User


    # Summary


    In this hour you learned how to generate and process requests with JSPs. You first
    took a look at what requests are and how the browser generates them. Then you
    dissected the different parts of a URL used to invoke a JSP. Next, you learned
    methods for processing information about the path, the URL, the machines, and
    the request. Finally, you saw how to use HTML forms to dynamically create query
    strings and how to process forms.


    # Q&A


    +   Can JSPs share the request object by a browser?

    JSPs can share the request object by forwarding it to other JSPs, as well as included
    JSPs. Hour 20, “Using Multiple JSPs to Handle the Request,” will show how you
    can a JSP include and share the request with the included JSPs.


    +   The query string in request is just a list of name/value pairs. This seems
    to have its limitations on what can be passed around between browsers and JSPs,
    or even between JSPs. Is there a way to overcome this limitation?


    +   A limitation exists in the amount and type of data that browsers and JSPs
    send to each other. The limitation is imposed by HTTP. Once you extract the parameters
    and their values, you can create objects that represent the data in an object-oriented
    format. These objects can be stored permanently in hard drives, or temporarily
    in a user session to be shared between JSPs and other server side applications.
    Once the request parameters have been converted into objects, the limitation disappears
    on the server side.


    +   HTML FORMS are great for gathering lots of information, but those parameters
    and values as strings seems to have its drawbacks. Is there a more appropriate
    way of processing HTML FORMS?


    +   Yes there is. You can create a JavaBean that has class variables with the
    same names as the parameter names and use the special tag <jsp:setProperty property="*>
    to automatically initialize the class variables of the JavaBean. Hour 16, “Using
    JavaBeans in a JSP” covers JavaBeans in detail.


    # Workshop


    The quiz questions and activities are provided for your further understanding.
    Appendix A, “Answers,” for the answers to the quiz.'
