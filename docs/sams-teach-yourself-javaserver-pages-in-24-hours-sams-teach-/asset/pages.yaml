    Using cookies can quickly become messy because you need to write special code
    that processes them and they don''t have a useful data structure. A better way
    of keeping track of user information is to use server-side session objects that
    are unique to each user.


    # User Sessions


    The HttpSession interface provides JSPs with the functionality to store and share
    information about an ongoing interaction with a user. The HttpSession interface
    is accessible through the getSession() method of the HttpServletRequest. You learned
    about most of the methods of the HttpServletRequest interface in Hours 10 and
    11, postponing those methods pertinent to session management until this hour.


    Within a JSP the implicit session object implements an instance of the HttpSession
    interface. The session object serves, for example, a sketch pad for JSPs of an
    e-commerce application to keep track of temporary data about the user they are
    interacting with. Data that needs to be stored permanently must be persisted to
    a database. Hour 17 covers database interaction using JSPs and JDBC.


    Table 12.2 lists the methods in the HttpServletRequest interface that are relevant
    to managing sessions.'
