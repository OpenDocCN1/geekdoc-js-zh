    # HOUR 9


    # Controlling JSPs with Java Scriptlets


    HTML is a language for describing the layout and content of Web pages. Browsers
    read an HTML document and render the page on the screen as they read it from left
    to right, top to bottom. The order or flow in which the page is interpreted is
    fixed. HTML does not provide mechanisms to control programming decisions, do computations,
    or alter the flow of rendering of a page.


    Java, like many other programming languages, provide control mechanisms to program
    decisions, evaluate expressions, and control the flow of execution, among other
    things.


    JSPs combine both HTML and Java languages into a powerful and easy way to create
    dynamic Web pages. Examples throughout the book have shown you JSP that generates
    HTML content with embedded Java code. The last couple of hours I have covered
    embedded Java declarations and expressions and their associated tags. You have
    seen how to declare Java variables and methods, you have seen how to use these
    in expressions, and, although not formally, you have seen examples of scriptlets.'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'In this chapter you will learn how to


    +   - Use Scriptlets to control the flow of execution of a JSP

    - Use selection control statements if and switch to program decision-making procedures

    - Use iteration control statements for and while to handle individual elements
    of set data


    # # Scriptlets


    Scriptlets consist of embedded Java code within two special JSP tags, <% and %>.
    The Java code consists of a set of declarations, expressions, and statements that
    programmatically control the content of the JSP.


    Scriptlets define the main thread of execution that controls the dynamic behavior
    of a Web page. When a JSP loads, execution begins with the first occurrence of
    a scriptlet. The scriptlet can then make use of declared variables and methods.


    Java provides two flow control structures: selection and iteration.


    # # Selection Control Structures


    Selection control structures allow you to program or encode decisions when the
    JSP is executed. Decisions are programmed by evaluating Boolean expressions and
    selecting a course of action based on the result. For instance, a JSP may evaluate
    whether a registered user is logged in or not decide to welcome the user or demand
    the user log in. There are two selection control structures available in Java:
    the if statement and the switch statement.


    # # Using if Selection Statements


    The if selection statement allows you to select different courses of action depending
    on the outcome of a Boolean conditional expression. if statements provide the
    base for encoding a decision-making procedure. The syntax of an if statement is


    ```

    if(booleanExpression)

    javaCodeBlock

    ```


    If the booleanExpression evaluates to true, javaCodeBlock is executed. Otherwise
    execution continues after the javaCodeBlock. Boolean expressions can be combined
    with Boolean operators && & (and), || (or), and ! (not). 9.1 is a JSP that uses
    an if statement to print an appropriate message if a user is not logged on.'
