  md: '# Hour 4


    It is possible to run multiple instances of WebLogic Server on one machine.

    The weblogic.properties file in the c:/weblogic directory is the global configuration
    file and pertains to all instances of WLS. If you want to configure a specific
    instance, then you would place a weblogic.properties file in that server-specific
    directory (myserver directory is an example of a server-specific directory).


    As you saw from Listing 4.1 this file contains information about the listening
    port, the system password, and Servlet registrations. The weblogic.properties
    file also contains name/value pairs, although it might not look like since the
    names tend to be long and the values tend to be long. There are a few rules to
    this:


    +   * A # denotes a line as a comment.

    * There cannot be any spaces in your name/value pairing.

    * A backslash is used to continue to the next line so you must use a forward slash
    or two backslashes in your directory structures. An example of a directory structure
    would be, c:/weblogic/myserver/classes, or c:\weblogic\myserver\classes.


    # Registering the JSPServlet


    WebLogic uses Servlets as the underlying implementation of how handles different
    types of files. WLS uses the JSPServlet to handle the serving of JSPs. You need
    to register this Servlet in the weblogic.properties file.


    At the top of your weblogic.properties file, type in the following:

    weblogic.http.*.jsp=weblogic.servlet.JSPServlet


    This lets WebLogic know that all files with the .jsp extension are handled with
    the JSPServlet.


    # Setting the Initial Arguments for the JSPServlet


    The JSPServlet takes some initial arguments, such as the JDK compiler to use and
    the number of seconds WLS should wait before checking whether the JSP has been
    updated. Listing 4.2 is one way to configure the JSPServlet in the weblogic.properties
    file:


    # Listing 4.2 Configuring the weblogic.properties File


    ```

    1: weblogic.http.initArgs.*.jsp=

    2: pageCheckSeconds=1,\n3: compileCommand=c:/jdk1.2/2/javac.exe,\

    ```'
  merge: -1
