    The StatsPresentation.jsp just outputs the user''s information in a table to show
    the user exactly what was inserted into the database.


    # Summary


    Spreading the work of your application among multiple JSPs is often desirable.
    There are many ways to separate the work among the JSPs, and this hour discussed
    two models. The Including Request Model has a primary Java Page that looks over
    the work of other JSPs, and includes the output of those files into its page.
    This model is accomplished using the include action tag:


    ```

    <jsp:include page="RelativeURLToIncludedFile"/>

    ```


    The Forwarding Request Model was another way of separating work from the user
    and forwarding the request to another JSP that is responsible for sending the
    response back to the user. This type of application model is also called JSP chaining,
    where the chain of JSPs could be any number. This model is accomplished with the
    forward action tag:


    ```

    <jsp:forward page="RelativeURLToForwardedFile"/>

    ```'
