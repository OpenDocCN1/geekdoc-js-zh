    # HOUR 5


    # Understanding the JSP Application Models


    In this hour you look at how JSPs can interact with each other. It is important
    to understand how JSPs interact before you start coding JSPs. Some-times you want
    a JSP to accept the request and pass it along to another JSP, or you might just
    just want to include the output of another JSP in your JSP. There are many ways
    that JSPs can interact with each other, and this hour you are going to see various
    models that the specification defines.


    In this hour you learn


    +   * What an application model is

    * How to do JSP chaining

    * How JSPs include output from other JSPs


    # What Are Application Models?


    An application model is a description of how JSPs can interact with each other.
    The JSP 1.1 specification defines many models that describe how your'
