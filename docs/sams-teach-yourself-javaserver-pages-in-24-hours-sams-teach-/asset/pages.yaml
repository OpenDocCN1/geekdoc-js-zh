  md: '# New Term: Primitive Data Type


    Primitive data types are types that are directly supported by a programming language.
    These data types can''t generally be taken apart or represented in terms of other
    data types. Programming languages support primitive data types by providing automatic
    memory allocation and operators. The Int data type is an example of a primitive
    type. In contrast, programmers can create custom data types by declaring Java
    classes. Java classes are made up of a collection of data types which can themselves
    be primitive data types or other custom data types. Operations on custom data
    types are implemented by declaring methods in the Java class definition.


    When you declare a variable, memory is allocated to hold the variable''s data.
    Memory can be allocated implicitly or explicitly, depending on the data type you
    use. Primitive data types such as float, double, long, and char allocate memory
    when you declare the variables. Data types implemented through Java classes need
    to be allocated explicitly by using the new operator. The String data type is
    a Java class, but it is so widely used that the Java compiler treats strings as
    if they were primitive data types. You have examples of declaring primitive data
    types. Listing 7.2 is an example of using the new operator to declare Java objects:


    # 7.2 Declaring Java Objects (declaringJavaObjects.jsp)


    ```

    1: <HTML>

    2: <HEAD><TITLE>Declaring Java objects</TITLE></HEAD>

    3: <body>

    4: <% String myList = new String(); // memory allocated explicitly

    5: String anotherString; // memory allocated implicitly

    6: Vector myVector = new Vector(); // memory allocated explicitly

    7: %

    8: </body>

    9: </HTML>

    ```


    In Java, primitive data types have class counterparts to be able to treat the
    data as objects. For instance, the data types int, float, double, and char have
    class counterparts Integer, Float, Double, and Character. The Java classes have
    methods that allow conversion from each other.


    For an exhaustive coverage of Java data types, you should consult a book on the
    Java programming language, such as Java in a Nutshell, by David Flanagan, published
    by O''Reilly (ISBN 1565924878).'
