  md: '# Using JavaBeans in JSP


    The default value of the scope is page. This causes the instance of the JavaBean
    to be stored in the javax.servlet.jsp.PageComponent of the current page. The instance
    is only available from the latest invocation of the JSP. The instance is not available
    to JSPs that might be included, and it is discarded at the end of the page request.


    ![](img/4df77e7d634c573982f3b815243f9fd2_245_0.png)


    The PageContext object provides methods to explicitly get objects that are implicitly
    available in JSP like request, response, and session. The PageContext object is
    responsible for giving access to the objects available to all JSPs and servlets.
    Additionally, the PageContext object allows you to store and retrieve attributes
    across several JSPs as well as forward or redirect requests to other JSPs.


    16


    If the scope is request, the JavaBean is stored in the ServletRequest object (the
    request object was covered in Hour 10, “Processing Requests from the User”). In
    this case the instance is available to included JSPs that share the same request
    object. The instance is still discarded at the end of the request.


    If the scope is session, the JavaBean is stored in the HttpSession object, and
    can be used across HTTP requests.


    If the scope is application, the JavaBean instance is stored in the ServletContext
    object. This means that the JavaBean instance is available to any object (JSPs
    and Servlets, for instance) running in the same application server for the lifespan
    of the application server.


    The following section uses the session scope to keep track of a shopping cart
    JavaBean across several shopping pages.


    # Implementing a Shopping Cart with JavaBeans


    Hour 12 covered techniques for keeping track of user information across several
    JSPs using the HttpSession object. An example of a shopping cart was used to illustrate
    how several JSPs could share information through attributes in the session object.
    A better way of accomplishing the same task is to use JavaBeans to represent the
    items and the shopping cart and use specialized methods of the JavaBeans to initialize
    and update instances of these objects. The state of the objects can be kept automatically
    in the HttpSession or the ServletContext by setting the scope of the JavaBeans
    to session or application, respectively. This way the JavaBeans can be shared
    across several JSPs.


