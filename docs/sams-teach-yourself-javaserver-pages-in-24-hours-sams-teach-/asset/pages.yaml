    in it allows you to access naming services and directory services without knowing
    the implementation of the particular service. This is very useful because naming
    services and directory services handle their services—such as binding, lookup—very
    differently. An example of a naming service is a Domain Name Server (DNS). A DNS
    maps IP addresses to hostnames, which allows you to enter http://www.bea.com and
    communicate to the BEA Web site. This is very much like looking up phone number
    for an individual. You look up the name in your phone book and it provides you
    with the phone number.


