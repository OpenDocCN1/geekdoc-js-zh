  md: '# # Dedications


    I would like to dedicate this book to my wife, Alexandra, who has been so caring,
    loving, and patient me, and has brought us the joy of our three beautiful children,
    Katerina, Rafael, and Victoria. Thank you, you and this is for you.


    This book is also dedicated to the loving memory of my parents Pasquale and Emilia
    Annunziato. Thank you and I wish you were here.


    —Jose Annunziato


    There are many people who have helped me to get where I am today. I would like
    to thank my family and especially my mother and father for always supporting me
    and believing that I can do anything that I put my mind to. Thanks to my Grandma
    Fesler and Grandma Corneau for being proud of me and making me feel like I have
    wings to fly. Am also dedicating this book to my grandfather, John F. Fesler,
    who was truly a great man; it is an absolute honor when people compare me to him.
    Also thanks to my sister, Kristy: you have always been a great big sister and
    have always been there when I needed you. I would also like to mention my puppies,
    Mickey and Minnie, who have added so much joy and laughter to my life.


    Last, but definitely not least, I am dedicating this book to my husband, Chris.
    I love you more and more each day, thanks for loving me, believing in me, and
    most importantly just being you. You are the sweetest man.


    —Stephanie Fesler Kaminaris'
