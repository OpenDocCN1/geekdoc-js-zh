  md: 'Although Figure 1.8 looks rather scary, you can separate the figure into three
    sections:

    the client layer, the application logic level, and the data level.


    Let''s begin dissecting this structure starting with the client layer. Different
    kinds of clients

    be in this structure. For example, a Web client is accessing a Web server using
    TCP/IP\and making requests over HTTP. Another type of client, a Java application,
    can also access

    t application server through other communication protocols as Remote Method

    Invocation (RMI) and Internet Inter-OrB Protocol (IIOP).


    The application logic can be spread over a Web server and serve simple HTML documents.

    The Web server can handle requests from Web clients and serve simple documents.

    If the request is for an application, it can forward the request on the application
    server.

    The application server can handle larger programs from the Web server. Later in
    this

    hour, you will take a closer look at other services an application server provides
    in then“What Are Application Servers?” section.


    The last layer in this structure is the data layer. The data level can be made
    up of one ornmore databases, and it can also include legacy systems, such as mainframes.


    Why are there so many pieces? Well, the philosophy is that you concentrate on
    onething, you should do it well, and that is the philosophy being employed here.
    If a Web

    server concentrates on serving Web pages, it should be able to optimize that process
    and

    serve them efficiently. If an application server focuses on serving applications,
    it should

    be able to offer services that most applications use, such as security. Finally,
    if a

    dabase is responsible for handling data, it can focus on providing services, such
    as

    caching, to access data faster. Another benefit of breaking up the responsibilities
    is that it

    is easier to write and maintain smaller components than large, bulky applications.


    # What Is the Java 2 Enterprise Edition (J2EE) Platform?


    Many companies are placing their products on the Web and building enterprise systems.

    Today''s thought is that it should be easier to program these systems now than
    it was

    few years ago. That is where the Java 2 Enterprise Edition (J2EE) comes into play.


    # Who Developed This Specification?


    The J2EE specification was written by Sun Microsystems. Sun Microsystems accepted

    from the industry (what it actually used is not known) when creating the enterprise
    system

    that includes specifications for messaging, database support, and distributed
    components.'
