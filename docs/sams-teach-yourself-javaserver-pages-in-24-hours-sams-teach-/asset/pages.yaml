    with dif-

    frequent possible outcomes of authorizing a credit card transaction. The transaction
    might go

    fine most of the time but once in a several other things may occur—the server
    at

    the financial institution might be down, the local network connection might be
    down, the

    user does not have sufficient credit available, and so forth. Different exceptions
    might be

    to handle abnormal conditions.


