    means they have access to all server-side resources, such as databases. Even their
    syntax for embedding respective languages is similar. Listing 2.2 is an example
    of an ASP that embeds the current date and time, and Listing 2.3 is an example
    of a JSP that embeds the current date and time. In line 8 of Listing 2.2, you
    can see that the tags <%= %> are used to embed the VScript function ''Now''. Now
    take a look at line 6 of Listing 2.3 and you will see the same tags used to insert
    the Java code `new java.util.Date()`. These tags, which will be covered in more
    detail in Hour 8,"Inserting Expressions in a JSP." are used to insert expressions.


