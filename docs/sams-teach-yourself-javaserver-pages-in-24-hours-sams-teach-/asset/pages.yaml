- img_proc: true
  md: '# Understanding the include Directive


    The include directive sees the included file as a static object and inserts file''s
    code into the JSP. The inclusion of the code happens at translation time, the
    code of the included HTML or JSP is inserted into the JSP, translated into the
    Servlet code, compiled, and executed. (The translation phase of a JSP was discussed
    in Hour 3, "Introduction to Servlets.") As you see in the examples, the point
    where the include directive is located in the JSP is where the HTML document you''re
    including will be placed.


    You can have more than one include directive in your JSP This also allows you
    to include, for example, your company banner at the top and a copyright at the
    bottom of your page.


    > There are many reasons to use the include directive, inserting the company banner
    and copyright are just two reasons. An HTML document that creates a menu bar,
    could be included in each of your JSPs using the include directive. The include
    directive is an easy way to give your JSPs the same look and feel.


    # Using the include Directive


    Using the include directive makes it easy for you to update text without needing
    to modify the code for all JSPs.


    Before taking a look at the general syntax of the include directive, it would
    be beneficial to examine the general syntax of a JSP directive:


    ```

    <@ directive_type directive_attributes %>

    ```


    The directive_type is one of the JSP directives, page, include, and taglib. The
    directive was covered in Hour 14, "Creating Error Pages," and the taglib directive
    was discussed in Hour 19, "Extending JSP Functionality with Tag Libraries."


    The directive_attributes depends on which directive you are using. Each of the
    three types of directives takes different attributes. Hour 14 showed how to use
    the attributes of the page directive to create error pages and use error pages.
    The attributes of the taglib directive are discussed in detail in Hour 19. The
    include directive takes one attribute, the file to be included.


    Now that you have seen the general syntax of the JSP directives, it is time to
    focus on the include directive. The general syntax of the include directive is
    as follows:


    ```

    <@ include file="Relative_URL_and_Filename" %>

    ```


    You can see that the directive_type is include and the directive_attributes is
    file.'
