  md: '# Packaging and Deploying an Enterprise Application


    Navigate through the Web application and notice the URL of the pages. You will
    see that all the pages are being requested through the context you specified,
    humanResources.


    # Summary


    Web applications can be bundled into Web archive files to make for easy portability.
    The Web archive files are deployed on a server. For BEA WebLogic server you just
    needed to add one line to the weblogic.properties file and, when the server starts,
    your Web application is deployed.


    Congratulations on all your work so far. The wondrous journey of JSP enlightenment
    has come to an end for now, but never stop learning and always work will have
    fun.


    # Q&A


    +   * Now that I have learned JSPs, where do I go from here?\n* If you want to
    learn the Java Enterprise Platform (JEP), the next step could be learning Servlet
    programming. You should brush up on your Java skills before tackling this, however.
    After brushing up your Java skills, you can move into technologies such as RMI
    and EJBs. Just do one technology at a time and you will be fine. Just remember,
    never stop learning.


    # Workshop


    The quiz questions and activities are provided for your further understanding.
    Appendix A, "Answers," for the answers to the quiz.


