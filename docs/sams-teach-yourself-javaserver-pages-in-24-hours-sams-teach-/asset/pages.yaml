  md: '# Answers for Hour 19, “Extending JSP

    Functionality with Tag Libraries”


    # Quiz


    +   1. What is a tag handler?

    A handler is a server-side object that is executed at runtime to handle the inter-interpretation
    of a JSP action tag.

    2. What language is the tag library descriptor written in?

    The TLD is written in XML.

    3. When you are using custom actions in JSP, how does it know which tag library

    your custom action is defined?

    When you use a custom action in your JSP, you specify the unique reference name,

    with a colon, the name of the custom action. The unique reference name

    is assigned to the prefix attribute of the taglib directive. For example,

    <friday:thankgoodness />.


    # Answers for Hour 20, “Using Multiple JSPs to

    Handle the Request”


    # Quiz


    +   1. What is the attribute that both the include and forward actions take?

    Both actions take a page for their attribute. The page attribute takes a relative
    path

    to the JSP that is going to be included or forwarded to.

    2. What is the difference between the include action and the include directive?

    The include action includes the output of other JSPs. The include directive

    in the code of the other JSPs into the current JSP.

    3. What would the forward action look like if you wanted to forward to a JSP

    called ForwardToMe.jsp that was subdirectories below your JSP,

    forwardedFiles/anotherSubdirectory?

    <jsp:forward page=*forwardedFiles/anotherSubdirectory/ForwardToMe.jsp />'
