  md: 'query string is extracted from the form, and the name/value pair list is generated
    and appended to the URL.


    HTML forms provide several types of graphical user interface (GUI) components
    that serve as fields you can use to create forms for the user to fill out and
    submit to a JSP for processing. HTML forms are the topic of books that cover HTML
    in general, and so here I will just remind you of the essentials.


    Forms declared using the FORM HTML tag as follows:


    ```

    <FORM ACTION="action" METHOD=method>

    ...form GUI elements...

    </FORM>

    ```


    The action parameter of the FORM tag declares the action to be taken when the
    form is submitted. For JSPs, you use the URL of the JSP to invoke. A query string
    is appended to the URL. The names and values of the name/value pairs in the query
    string are extracted dynamically by the names of the GUI elements and the user
    fills out the form.


    The Method parameter of the FORM tag declares the HTTP method used to post the
    request to the JSP. The value for the METHOD parameter can be GET, POST, or PUT.
    For JSPs, use the POST method.


    Within the forms, you can declare any number of form elements by using the HTML
    INPUT, TEXTAREA, and SELECT. The simplified syntax for the INPUT tag is


    ```

    <INPUT TYPE=type NAME VALUE=defaultValue>

    ```


    The type parameter of the INPUT form element allows you to choose from one of
    several input types. These can be any of the following: TEXT, CHECKBOX, RADIO,
    IMAGE, RESET, and SUBMIT. Although the names for the TYPE parameter are self-explanatory,
    you might want to refer to Sams Teach Yourself Publishing with HTML 4 in 21 Days,
    Professional Reference Edition, by Laura Lemay (ISBN 0672318385), for full coverage
    of the elements.


    The syntax for the TEXTAREA tag is


    ```

    <TEXTAREA NAME=name ROWS=columns VALUE=defaultText>

    ```


    The TEXTAREA tag declares that—a text area where the user has several rows to
    type. The value of this tag is the text types.


    The SELECT declares a list of options from which the user can choose either one
    or multiple options. The value of this tag is selected by the user. Here is the
    syntax of the SELECT:


    ```

    <SELECT NAME=name [SIZE=size MULTIPLE]

    <OPTION [SELECTED]>option</OPTION>

    ...

    ```'
