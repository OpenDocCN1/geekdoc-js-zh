  md: 'In this hour you learn:


    +   - The requirements of the Husky World Human Resources site

    - The resources needed for the Husky World Human Resources site


    # Gathering Design Requirements


    The application you are going to write and deploy is a human resources Web site
    for a company called Husky World. You will use the include directive to include
    a company banner that says "Husky World" in yellow letters with a navy background.
    This Web site will allow employees to


    +   - View the company policies.

    - View the insurance benefits the company offers.

    - View your personal insurance benefits.

    - Change their personal profiles, their names, addresses, and phone numbers.

    - View your current time-off-information.

    - Add new employees.


    There should be a welcome page into the human resources Web site that gives the
    user choices as to what he she wants to do. The choices could be just a group
    of hyperlinks that take the users to the parts of the site they want to go. Figure
    21.1 shows a case diagram that graphically displays what users on the Web site
    will be able to do.


    | A use case diagram models the capabilities of your Web site. It models the users
    of your system and anything that can trigger an activity in your application.
    The person or thing that can trigger an activity in your application is called
    an Actor. Use case diagrams are one way to graphically display what your application
    does. Throughout the planning of your application, you use case diagrams change
    and evolve as more requirements are received from your users. It is very important
    to have a use case diagram, because you can ensure that your system provides all
    the capabilities required. |


    After taking a look at what the user can do on the Web site, it is necessary to
    look at scenarios of the user''s actions on the Web site.


    One scenario is that the employee wants to view the company policies. The employee
    would start at the home page and then follow a link to the appropriate page, which
    will be PresentCompanyPolicies.jsp. Figure 21.2 shows this flow in a graphical
    format.'
