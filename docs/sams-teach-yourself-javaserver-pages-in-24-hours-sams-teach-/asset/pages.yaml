    # The N-Tier Model


    The N-tier model adds server-side resources such as Enterprise JavaBeans. Figure
    5.3 shows the structure of the N-Tier Model.


    # FIGURE 5.3


    EJBs manage resources in the N-Tier Model.


    ![](img/4df77e7d634c573982f3b815243f9fd2_80_1.png)


    In this model the JSPs interact with backend systems such as databases and legacy
    systems via Enterprise JavaBeans. Since the EJBs are handling the access to the
    backend resources, this model scales easier than the Simple Model in which the
    JSPs were managing their resources. Listing 5.2, later in this hour, is an example
    of a JSPs that uses an EJB to retrieve the book information from the database.


    > Recall from Hour 1 that the EJB specification describes how to write components
    in the Java programming language. The specification defines how the components
    communicate with each other. They represent business logic and business data.


    ![](img/4df77e7d634c573982f3b815243f9fd2_80_2.png)'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# Understanding the JSP Application Models


    The advantage of this model is its scalability because the EJBs are managing your
    resources. Also, the EJBs can be used by many JSPs for common functionality so
    you don''t have to keep repeating common code in all your JSPs.


    A disadvantage to this model is that you are still using one JSP, so it will have
    quite a bit of work within it.


    # The Loosely Coupled Model


    The Loosely Coupled Model allows JSPs on remote systems to act as peers or have
    a client/server relationship. Figure 5.4 shows the interaction of the JSPs in
    this model.


    **Figure 5.4** JSPs in the Loosely Coupled Model have equal access to applications.


    ![](img/4df77e7d634c573982f3b815243f9fd2_81_0.png)


    This model represents two applications that can be on the same intranet, or communicating
    over an extranet or Internet.


    > **New Term: Extranet**nAn extranet is a company''s intranet that allows customers
    access to certain applications within that intranet.


    Each JSP application is isolated from changes in the other JSP application communicating
    over HTTP using HTML or XML. An example of a loosely coupled model is a supply
    chain application between vendors. An example of this is when JSP X, Y, communicates
    with JSP Z, on Intranet Q, using the HTTP communication protocol.'
  merge: -1
