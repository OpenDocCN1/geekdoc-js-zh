  md: "# Answers for Hour 8, \"Inserting Java Expressions in a JSP\"\n\n# Quiz\n\n\
    +   1. What happens when a JSP evaluates a JavaBean instance?\nThe toString()\
    \ method of the JavaBean is called to get the string representation of the object.\
    \ If the method is not defined, the JSP searches the inheritance tree until the\
    \ object finds a toString() method. If none can be found, the JSP uses the toString()\
    \ method for the Object class since all classes inherit from the Object class.\n\
    \n# Answers for Hour 9, \"Controlling JSPs with Java Scriplets\"\n\n# Quiz\n\n\
    +   1. What are the differences and similarities of the break and continue statements?\n\
    Both the break and continue statements are used to interrupt the normal flow of\
    \ execution. They are meant to be used within a Java code block nested within\
    \ another Java code block. The break statement in the inner Java code block causes\
    \ execution to halt and continue in the outer code block. The continue statement\
    \ is intended to be used in an iterative code structure. A continue statement\
    \ will cause execution to halt and continue with the next iteration.\n\n+   2.\
    \ How would you implement a for loop using a while loop?\nConsider the syntax\
    \ of the for loop:\nfor(initStatement; conditionalExpression; updateStatement){\n\
    \  javaStatements\n...}\n\nThe initStatement is executed once and is usually used\
    \ to initialize an iteration variable. The iteration variable is tested in the\
    \ conditionalStatement every time the loop is executed to see if the loop should\
    \ continue. The conditionalExpression usually consists of comparing the iteration\
    \ variable to some boundary value. Every time around the for loop executes the\
    \ updateStatement, which usually increments or decrements the iteration variable\
    \ toward its boundary value. The javaStatements are executed every iteration.\n\
    \n![](img/4df77e7d634c573982f3b815243f9fd2_405_0.png)"
