  md: 'Congratulations on creating your first Web archive file. Since your application
    is in the .war file it is much more portable on your system. This .war file can
    be taken and deployed from anywhere on your system.


    # Deploying the .war File


    Now that you have generated your Web archive file, it is time to deploy it on
    WebLogic Server. Deployment involves mapping the Web archive name to a context.
    This context is how the user is going to request documents from his browser. You
    all have to deploy the .war is add one line to the weblogic.properties file:


    ```

    weblogic.httpd.webapp.humanResources=c:\\myWebApp\HumanHumanResources.war

    ```


    This gives the application context name of humanResources and it points to the
    .war file created, example: `http://localhost:7001/humanResources`.


    # Making Requests to Your Application


    You have created the Web archive file and deployed it on WebLogic Server. Now
    it is time to make requests on the Web application. Open your browser of choice,
    whether that is Internet Explorer or Netscape Navigator. For the URL you state
    the name of your server, the list port, and then the context you assigned to your
    Web archive file. For example, http://localhost:7001/humanResources. Since you
    are not requesting a particular file, you serve the welcome file, the HTML document
    HumanResources.html. Figure 24.1 is a snapshot of the welcome page, HumanResources.html.


    FIGURE 24.1

    Viewing the welcome page of the Husky World Human Resources Web site from the
    archive file.


    ![](img/4df77e7d634c573982f3b815243f9fd2_398_0.png)'
