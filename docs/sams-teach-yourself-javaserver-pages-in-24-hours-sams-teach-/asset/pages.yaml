  md: '# Defining Initial Parameters for the Applet with the param Tags


    The Java applet is a Java class, and it can take parameters that are specified
    in the HTML document. Since there are more than one parameter passed to the applet,
    all the param tags are grouped together with a params tag. When you receive an
    applet (for example, if you download it from the Web) the parameters that it takes
    are specified in the documentation. The general syntax of the params and the param
    tag are


    ```

    <params>

    <param name="parameterName" value="parameterValue">

    </params>

    ```


    where parameterName is the name of the attribute defined by the applet and parameterValue
    is a valid value for that particular parameter.


    Make sure to use double quotes around your parameter name and the parameter value
    or the JSP compiler will not understand the tags. The compiler won''t understand,
    it doesn''t process, and all your work will be ignored by the browser.


    Listing 15.3 is a simple example of an applet using the param tags. The applet
    takes parameters two images, which need to be of the same size. When the user''s
    mouse moves over the image, the picture toggles between the two images specified.
    This applet was downloaded from http://www.javafile.com. The applet can also take
    a URL as a parameter so that images can act as hyperlinks.


