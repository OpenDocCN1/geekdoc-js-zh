  md: 'The first step in the JSP is to include the CompanyBanner.html file, which
    is done in line 5. The include directive inserts the code from the HTML file into
    the JSP.


    Line 6 is the page directive and is importing the classes from the java.sql package.
    These classes are necessary for accessing a database from within the JSP.


    The heading on the page is in lines 8–12, letting users know what the page allows
    them to do.


    The company policy is in lines 15–19 and is just text formatted with a font tag.
    The company policy is very simple and tells the employees to be nice to one another.


    Lines 23–27 are the heading for the insurance information. The information is
    formatted in a table that is started in line 29. Lines 30–33 are the column headers
    for the table, describing the data in each column.


    This JSP is going to access the database directly, so line 35 specifies the driver
    for the database. This application uses the Cloudscape database, the driver is
    COM.CLOUDSCAPE.core.JDBCDriver. After specifying the driver, you get a connection
    using the DriverManager class in the java.sql package and specify the database
    URL. The connection to the database is made in lines 36–37. The URL for the database
    is jdbc:cloudscape:c\HumanResources.


    Now that the connection has been established, it can be used to create a statement.
    The statement is created in line 38, and a SQL string is defined in line 39. The
    SQL string is a simple SELECT statement that retrieves all information from the
    table BENEFITINFO. The SQL statement is executed in line 40 and saves the result
    in a ResultSet object referenced by the variable rs.


    Lines 41–48 are the while loop that cycles through all the elements in the ResultSet
    object. Lines 43–46 are the JSP expression tags inserting the column values into
    the output table.


    Lines 49–52 close the statement and connection objects if they are still open.


    The last point you should notice is the include directive found in line 58. It
    inserts the code from the SiteNavigator.html file into the JSP. Figure 22.5 shows
    the output of this.


    This page can be reached from a hyperlink on the page or a hyperlink on the navigator.
    Employees like kept up to date on happenings and this page could be a place to
    that.'
