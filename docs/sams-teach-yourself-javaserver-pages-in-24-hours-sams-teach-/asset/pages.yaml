    # Using the JSP Scriptlet Tags


    Scriptlets allow Web developers to embed Java code in their JSPs. What this means
    is Web developers can take advantage of a powerful programming language to create
    dynamic content and layout.


    Scriptlets provide several flow control structures like decision and iteration
    control structures. The following introduces these concepts. Hour 9,"Controlling
    JSPs with JavaScripts," covers scriptlets in more detail.


    # Using Decision Control Structures


    Decision control structures allow developers to program decision-making criteria
    into Web pages to decide among several possibilities. For instance, a JSP could
    check a user''s identity and password and decide to either greet the user as an
    authenticated user or politely ask the user to register with the Web site. Decision
    control is programmed in scriptlets by the Java if and switch statements. The
    JSP in Listing 6.2 shows an example of using an if statement to check the credentials
    of an imaginary user and decide whether to greet the user to log in.


    # Listing 6.2 A JSP that Uses the if Statement (decisions.jsp)


    ```

    1: <!HTML><HEAD><TITLE></TITLE></HEAD><body>

    2: <% boolean isPasswordAnyGood(String password){

    3:      return false; // go to database to find out

    4:     }

    5: %>

    6: <% if(isPasswordAnyGood(someMoneyPassword)){

    7:     <h1> Welcome </h1>

    8: } else {

    9:     <h1> Please Login </h1>

    10: }%

    11: %>

    12: </body></html>

    ```'
