  md: '# Declaring Variables and Methods in a JSP


    It is a good programming practice to choose descriptive, meaningful names for
    variables and methods. In a professional environment, your code will often be
    read or reused by someone other than yourself who will try to make sense of what
    you wrote in the past, and you may not be around. Meaningful names help make the
    code more readable, increasing its value and its chances of not ending up in the
    garbage.


    # Understanding Data Types


    Data is usually structured in some standard format. This structure is called the
    data type of the variable. Simple data types such as int and float represent integer
    and floatingpoint numbers. More complex data types such as arrays and vectors
    handle collections of data. And custom data types can be declared by the user.


    > **New Term: Data Type**, or just type, is a classification of data into categories
    that describe the characteristics of the data. For instance, numbers are considered
    data, and they can be classified into several types, such as integers and floating-point
    numbers. Hence, programming languages provide data types as Int and float to declare
    variables that can either hold integers or floating-point numbers. Characters
    and concatenation of characters are another form of data. The data types char
    and String are used to declare variables or objects that can hold a single character
    or a set of characters.


    The data type of a variable also determines the operations that are allowed on
    the data represented by the variable. For instance, integer data types allow operations
    such as addition and multiplication but do not generally allow an operation as
    concatenation, like a String data type may allow. Some of the more common data
    types used in this book are listed in Table 7.1.


    # TABLE 7.1 Common Data Types


    | Data Type | Description |

    | --- | --- |

    | int | A primitive data type that can hold integer numbers |

    | float | A primitive data type that can hold floating-point numbers |

    | double | A primitive data type that can hold double precision numbers |

    | long | A primitive data type that can hold large numbers |

    | char | A primitive data class that can hold hold characters |

    | String | A Java class that can hold concatenation of characters |

    | Vector | A Java utility class that can hold a collection of objects of different
    types |

    | Enumeration | A Javaility interface for inspecting collections of objects sequentially
    |'
