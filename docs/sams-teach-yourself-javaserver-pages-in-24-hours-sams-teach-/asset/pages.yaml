  md: "# Declaring Variables and Methods in a JSP\n\n# Q&A\n\nQ What happens if browsers\
    \ try to access my JSP all at once\n\n+   Each browser request will be handled\
    \ by a separate thread, and they will all try to execute the Servlet code generated\
    \ from compiling the JSP. Variables and methods in declarations have class scope.\
    \ This means objects that you declare in a declaration are shared between multiple\
    \ threads executing in the Servlet instance. If you are knowledgeable about thread\
    \ programming, you should synchronize class scope. If you are not thread-programming\
    \ savvy, I suggest that you declare your JSP as threadsafe by using the following\
    \ directive within your JSP:\n\n```\n<@ page isThreadSafe=false %>\n```\n\nBy\
    \ default, a JSP is safe to be threadsafe—that is, isThreadSafe=true. Declaring\
    \ your JSP as threadsafe forces the Servlet to implement the SingleThreadModel\
    \ interface, which prevents multiple threads to execute in the Servlet instance.\n\
