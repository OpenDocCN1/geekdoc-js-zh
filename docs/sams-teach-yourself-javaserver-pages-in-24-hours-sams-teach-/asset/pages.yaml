  md: '# Reviewing the Including Requests Application Model


    The JSP specification describes many models of how JSPs can interact with each
    other. Hour 5 discussed many of the application models, such as the Simple Model
    and the N-Tier Model. Recall from discussion there is an application model called
    the Including Requests Model, which is shown in Figure 20.1.


    FIGURE 20.1

    The Including Requests Application Model features a primary JSP.


    ![](img/4df77e7d634c573982f3b815243f9fd2_302_0.png)


    In the Including Requests Application Model, a primary JavaServer Page oversees
    the work of other JSPs. It is the responsibility of the primary JSP to accept
    the request from the user and generate a response to the user. The response could
    include the output of other JavaServer Pages, though this model is accomplished
    using the include action.


    # A Review of JSP Actions


    Before looking the include action, it is helpful to discuss the general syntax
    of a JSP action. The include action is just one of the six JSP actions. In Hour
    15, "Inserting Applets into Your JSPs," you saw the applet action that allowed
    you to insert Java applets into your JSPs. Hour 16, "Using JavaBeans in a JSP,"
    introduced you to the useBean action that allows you to use a JavaBean, and also
    showed you the getProperty and setProperty actions. From your experience, recall
    that the general syntax of a JSP action is


    ```

    <jsp:action_Name action_parameters />

    ```


    Many of the actions are empty tags, don''t forget to put the forward slash before
    you close the tag. The action_Name is the name of the action you want to perform.
    For the include action the action_Name is include. This hour discusses the forward
    action whose action_Name is forward. In Hour 15, you saw that the action_Name
    to insert an applet was applet, and Hour 16 talked about the getProperty, setProperty,
    and useBean actions.'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# Using Multiple JSPs to Handle the Request


    The action_parameters are dependent on the action you are performing. Each of
    the actions takes various properties. The include and forward actions take the
    name of another JSP as the action_parameter.


    # Using the include action


    The general syntax of the include action


    ```

    <jsp:page="RelativeURL_to_JSP"/>

    ```


    Comparing the include action to the general syntax of a JSP action, the action_Name
    is include, and the action_parameter is page, which is a relative URL to the JSP
    you wanted.


    # Understanding the Difference Between the include Action and the include Directive


    The difference between the include action and the include directive is how the
    included file is treated. The include directive treats the included file as a
    static document and simply inserts the file''s code into the generated Servlet
    code. The include action treats the file as a dynamic document and therefore includes
    the output of the included file. The generated Servlet makes a call to include
    the output of the file instead of including the code.


    > Remember, if you are including static documents as HTML documents or images,
    you will use the include directive. Inserting dynamic pages as JSPs would require
    the include action.


    # Implementing the include Action


    Now it is time to look at an example that uses the include action. This example
    includes an HTML document, a JSP that displays golfer statistics, a JSP that displays
    course information, and a JSP that inserts the other JSPs based on the input from
    the HTML form. The entry point into the application is an HTML document that lets
    users decide if they want to view golfer statistics and course statistics. Listing
    20.1 shows the code for the HTML document.


