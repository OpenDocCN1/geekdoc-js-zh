  md: '# Hour 9


    The details of how the Quicksort algorithm works is beyond the scope of this book,
    but here are the basics. Execution of the JSP code begins with the scriptlet in
    line 36. Two arrays are declared to hold the results of some query. One of them
    titles and the other confidence factors, from 0 to 100%, for each results. The
    confidence factor is a measurement of how well the search engine finds matches
    for items. These could be generated as a result of dynamic query or search from
    a database (see Hour 17). Both arrays are passed to a method called quick(), which
    takes as arguments arrays and two indices. The indices are referred as p and q
    when the quicksort() method declared in lines 3-9. They refer to the portion of
    the arrays that must be sorted, so for the first pass we are  and 5 (elements).
    When quicksort is, the arrays are sorted from least to maximum confidence, and
    for the loop in line 51 points in reverse order. As for the quick() method, it
    repeatedly splits the arrays in two by calling the partition() method, which returns
    the index q where the split should occur. When the array can''t split further
    (r>=p in quicksort()), the arrays have been sorted in ascending order. The sorting
    is accomplished in partition() by choosing a pivot point, that is, an index of
    the array. The partition() method exchanges the elements of the array so that
    elements except the pivot element are to the left of the pivot and all that are
    greater than the pivot to the right of it. Hence the pivot is in the correct ascending
    order. And since all pivot points are evenly chosen when quicksort partitions
    the array, and all points are in their correct ascending order at the end of a
    call to partition(), the array is therefore sorted when the arrays cannot be partitioned
    further.


