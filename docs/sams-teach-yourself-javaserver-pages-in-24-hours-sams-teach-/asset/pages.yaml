  md: '# HOUR 8


    # Inserting Java Expressions in a JSP


    This hour introduces the JSP expression tags <=%> that allow you to evaluate Java
    expressions and embed the resulting text within HTML code. This feature allows
    you to programmatically control the dynamic content at a very fine granularity.
    For instance, a JSP that prints payroll information might query a database for
    all the employees, who meet some criteria. The result of the query would be a
    collection of objects including the names and salary of each of the employees
    that meets the query criteria. To print the output, a JSP might use an iteration
    control structure like a for loop, or while loop (on loops in Hour 9 "Controlling
    JSPs with Java Scriptlets"). Inside the iteration name of the employees is accessed
    from the query result and stored temporarily in a variable called employeeName.
    The output of the JSP will likely be an HTML table with a row for each employee.
    Mixed in the HTML code for the table, the JSP has to insert the name of the employee
    in the employeeName variable in the right table cell. Inserting dynamic content,
    like the value of the variable employeeName, is accomplished by evaluating the
    variable with the JSP expression tags <=%>.


    ![](img/4df77e7d634c573982f3b815243f9fd2_119_0.png)'
