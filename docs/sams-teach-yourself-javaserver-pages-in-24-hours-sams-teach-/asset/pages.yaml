  md: 'You now have a small database that we can use to show how a JSP can connect
    and interact with a database.


    # Java Database Connectivity (JDBC)


    Although there are entire books that deal with Java Database Connectivity (JDBC),
    I will cover the basic parts to give you a sense of how JSPs can interact with
    databases. In the next section, you will create several JSPs that illustrate each
    one of the concepts we discuss. For full coverage of JDBC, I recommend *Database
    Programming with JDBC and Java* from O''Reilly and Associates.


    JDBC is an Application Programming Interface (API) that allows Java programs to
    connect and interact with databases. The API is a set of classes and interfaces
    packaged under the Java packages java.sql and javax.sql. The goal of the JDBC
    API is to provide a consistent and standard way of accessing databases from a
    diverse of vendors.


    The JDBC API strives to shield developers from having to deal with the details
    of which database vendor is being used. This is achieved by using drivers provided
    by the database vendors.


    > New Term: JDBC Drivers

    JDBC drivers are classes provided by database vendors. including JavaServer Pages,
    use JDBC drivers to obtain a connection to a database and then use the connection
    to query and update the database.


    17.5 shows the process of a JSP accessing a database through JDBC. When the JSP
    is invoked, it uses the JDBC API to access the database through queries and updates.
    JDBC interacts with the underlying database in terms of SQL. If a SQL statement
    results rows from the database, these are packaged by JDBC in a ResultSet object.
    The JSP processes the rows and dynamically generates HTML for the browser. Finally,
    the browser renders the page for the user.


    There are, in simple terms, five JDBC classes and interfaces of which you must
    be aware: the driver for your database, the DriverManager class, the Connection
    interface, the Statement interface, and the ResultSet interface. These are used
    to connect and interact with the database in the following way:


    +   The JSP code instantiates, loads, and registers the driver with the DriverManager
    by passing the name of the driver class to Class.forName().


    +   The DriverManager is used in the JSP to obtain a Connection object with the
    DriverManager.getConnection() method.'
