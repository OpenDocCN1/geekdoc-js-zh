  md: "# # Answers for Hour 2, \"Building Your First JSP\"\n\n# ## Quiz\n\n+   What\
    \ is a CGI program?\n  A CGI program is a server-side program that generates dynamic\
    \ content to a Web client. They can be written in C, C++, Perl, and Java.\n\n\
    +   What are the similarities between ASPs and JSPs? What are some of the benefits\
    \ of JSPs?\nASPs and JSPs are both CGI programs that deliver dynamic content with\
    \ HTML documents. Because they both reside on the server, they have access to\
    \ server-side resources. Another similarity is their syntax. The tags they use\
    \ to embed VBScript and Java are very similar.\nSome benefits of JSPs are the\
    \ portability of JSPs and JSPs use the powerful programming language of Java.\n\
    \n+   What extension do you save JSPs with and how do you specify it when saving\
    \ in a text editor?\nSave JSPs with a .jsp extension. Remember when using Notepad\
    \ to save it as a text document and surround the name of the file with double\
    \ quotes. This will prevent Notepad from adding the .txt extension.\n\n# # Answers\
    \ for Hour 3, \"Introduction to Servlets\"\n\n# ## Quiz\n\n+   What method (..)\
    \ in the lifecycle of a JSP/Servlet, is used for initialization?\nThe init(...)\
    \ method is used to initialize a JSP/Servlet. An object that implements the ServletConfig\
    \ interface is passed as one of the arguments and makes it possible to retrieve\
    \ initialization parameters.\n\n+   What kind of Servlet accepts HTTP requests\
    \ and generates HTTP responses?\nAn HttpServlet accepts HTTP requests and generates\
    \ HTTP responses. This is the type of Servlet that is used on the Web.\n\n+  \
    \ Describe the doXXX(...) methods.\nTheXXX(...) methods are used to process form\
    \ requests depending on the type of method used by the form. If the form sent\
    \ data by the GET method, doGet(...) method is used. If the form used the POST\
    \ method, doPost(...) method is used."
