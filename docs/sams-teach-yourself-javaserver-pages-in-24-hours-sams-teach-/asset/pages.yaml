  md: '# Extracting Path and URL Information


    The request object provides methods to process the different parts of the URL
    used to invoke JSP. Table 10.1 lists the methods and a brief description.


    **Table 10.1** Path- and URL-Related Methods


    | Method | Description |

    | --- | --- |

    | String getPathInfo() | Returns portion of the URL after the name of the Servlet
    before the query string |

    | String getPathTranslated() | Converts the URL to a physical path location of
    the JSP |

    | String getContextPath() | Returns portion of the URL that indicates the context
    of the request |

    | String getQueryString() | Returns portion of the URL following the question
    mark (?) |

    | String getRequestURI() | Returns portion of the URL from the protocol name to
    the query string. Depends on method POST or GET |


    The JSP in Listing 10.2 declares a link that points to the JSP itself. When the
    user clicks the link, the browser creates a request and invokes the JSP in the
