- img_proc: true
  md: '# Configuring Application Servers


    # LISTING 4.2 continued


    ```

    4:    workingDir=/weblogic/myserver/classfiles,\

    5:    keepgenerated=true,\

    6:    verbose=true

    ```


    The pageCheckSeconds argument, in line 2, specifies the number of seconds SLS
    waits until it checks whether the JSP has changed. A value of 0 specifies to always
    check it, and a value of -1 specifies not to check it.


    Line 3 sets the compileCommand, which is the fully qualified path to your Java
    compiler. In this example the java compiler is located in c:/jdk1.2.2/javac.exe.
    SLS works with JDK 1.1.* and JDK 1.2.*


    The workingDir argument, in line 4, is the directory where SLS will keep the generated
    Servlet code—weblogic/myserver/classfiles, in this example.


    The keepgenerated argument, in line 5, specifies it checks the generated Servlet
    code. The values can be true or false. A value of true states that you want to
    keep the generated .java files, and false tells not to keep the .java servlet.


    The verbose argument, in line 6, tells SLS to be descriptive if it comes across
    errors. This property can take true or false as values. A value of true tells
    SLS to give debugging information, a value of false tells SLS not to give debugging
    information.


    # Deploying a JSP on WLS


    Once you have registered the JSPServlet and set up the initial arguments, you
    are ready to write a JSP and run it on WLS. Type the content of Listing 4.3 into
    a text editor and save it as OrderForm.jsp. Do not type in the line-numbers. They
    are there for reference purposes only.


