    goes wrong. These exceptions have their own logic of when they should be thrown
    and caught what messages say what went wrong. The messages are of little help
    since the errors propagate deep into the workings of Java with little relation
    to the origin of the error. Java allows developers to create their own custom
    exceptions that can be used to provide more descriptive information to track down
    errors.


    # Creating Custom Exceptions


    Creating custom exceptions allows developers to create their own mechanisms of
    determining what could go wrong with the code and to deail tailored to reflect
    the details of the logic of the application being developed, and the messages
    describing the error can be more meaningful.


    To illustrate the usefulness of custom exceptions, consider a simple JSP that
    checks the validity of an argument in a string called username. If the JSP is
    not careful might the username could be null. This error propagates through the
    JVM (Java Virtual Machine) until a null pointer exception. Tracking the original
    source of the error is often challenging. A more careful logic might check the
    username against several possible values and throw custom exceptions that describe
    what the problem is. For instance, a particular exception could be thrown if the
    username is too short or not defined (null). Each exception could use a custom
    description message of exactly what went wrong.


