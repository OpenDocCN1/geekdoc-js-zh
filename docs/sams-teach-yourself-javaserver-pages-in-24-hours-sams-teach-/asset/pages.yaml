  md: 'Enter some new colors into the HTML form and click the Submit button. You will
    see the colors of the code elements change according to your specification.


    # Summary


    JSPs provide six predefined action tags that you can use in place of chunk of
    code. Actions that you use frequently can be replaced with a custom tag that you
    define in a tag library. A tag library is a collection of tag handlers, the actual
    coding of the action does, and a tag library description (TLD) that describes
    what tags are part of this tag library.


    The taglib directive is used to import a tag library into a JSP. The location
    of the tag library and a unique reference name assigned to the tag library are
    the taglib directive. After specifying the tag library with the taglib directive,
    you are free to use the custom tags defined in the tag library.


    # Q&A


    +   * Why are the tag library descriptors in the META-INF directory of c:\weblogic\myserver\public_html
    and not c:\weblogic\myserver\public_html\myJSPs\hour19?


    +   * When the JSP container is trying to resolve the location of the tag library,
    it looks in the root of the Web Application. If you do not explicitly place your
    JSPs in a Web Application, they are implicitly placed in one with the root c:\weblogic\myserver\public_html
    directory. Therefore, when the JSP specifies the TLD to be in a directory META-INF,
    the JSP container is going to search the root of the Web Application, c:\weblogic\myserver\public_html,
    to find it. Again will be in much more detail about Web Applications in Hour 24.


    +   * Why are custom action tags helpful in JSPs?


    +   * One of the goals of Java Pages is to separate the responsibilities and to
    allow beginner Java programmers to write these pages. With the custom tags, non-Java
    programmers can create dynamic content on the Web by writing JSPs with custom
    action tags instead needing to write the code.


    # Workshop


    The quiz questions and activities are provided for your further understanding.
    See Appendix A, “Answers,” for the answers to the quiz.'
