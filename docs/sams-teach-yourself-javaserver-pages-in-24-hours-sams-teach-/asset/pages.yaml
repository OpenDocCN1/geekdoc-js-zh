  md: "# Answers for Hour 4, \"Configuring Application Servers\"\n\n# Quiz\n\n+  \
    \ 1. What happens if you set the initial argument property pageCheckSecs equals\
    \ to 0?\n\n   If the pageCheckSecs is equal to 0, WLS will always check to see\
    \ if the JSP has been modified since the last request. If it has, WLS will translate\
