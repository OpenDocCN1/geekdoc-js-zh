  md: '# Declaring Variables and Methods in a JSP


    # Initializing Variables


    Initializing a variable consists of associating a value with the variable. Initialization
    can occur either at or after declaration. The data type of the value you want
    to initialize must be compatible with the same type as the variable. Listing 7.3
    is an example of variables being initialized at declaration time:


    +   Listing 7.3 Initializing Variables with Constants (initializingVariables.jsp)


    ```

    <HTML>

    <HEAD><TITLE> Initializing Variables At Declaration</TITLE></HEAD>

    <body>

    <% int myIntegerValue = 123;

    String myStringVariable = "hello world";

    float myFloatVariable = 123.2f;%

    <P>myIntegerValue <%= myIntegerValue %>

    <P>myStringVariable <%= myStringVariable %>

    <P>myFloatVariable <%= myFloatVariable %>

    </body>

    </html>

    ```


    Variables can be initialized with other variables, with expressions containing
    other variables, and even with the result of method invocations. Listing 7.4 illustrates
    this.


    # Listing 7.4 Initializing Variables With Other Variables And Method Calls (initializingVariablesWithOtherVariables.jsp)


    ```

    <HTML>

    <HEAD><TITLE> Different ways of initializing variables</TITLE></HEAD>

    <body>

    <% int a = 4;

    int b = a * 2;

    double c = Math.pow(a, 2) + power(b, 2); %>

    <P>a = <%= a %>

    <P>b = <%= b %>

    <P>c = <%= c %>

    </body>

    </html>

    ```


    The preceding code declares integers a and b (lines 4 and 5). Integer b is initialized
    by multiplying a by two. Variable c is declared to be of type double, and it is
    initialized using method calls to squares squareRoot() and power() and referring
    to the values of a and b. The Math class in line 6 is a standard Java class that
    is accessible from any JSP. The Math contains static methods for computing several
    common'
