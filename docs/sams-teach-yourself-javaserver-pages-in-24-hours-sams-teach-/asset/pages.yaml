  md: '# HOUR 1


    # # Introduction to Web Applications


    Our story begins with a young lady, Marian, who is interested in going to Florida
    for her upcoming vacation. Marian is Internet savvy, so she visited an airline''s
    Web site and entered in her destination, Florida. A list of flights to Florida
    was returned and displayed in an easy-to-read fashion in her browser. Her business
    partner, John, was also planning his upcoming vacation, but he wanted to go to
    Hawaii. Because he was Internet savvy as well, he went to the same airline''s
    Web site, entered in his destination, and received a listing of flights to Hawaii.
    How was it possible that they received such different information from the same
    Web site? The airline''s Web site has an application, called a Web application,
    that accepted their requests and generated a response to each particular query.
    Because the Web application created these documents on-the-fly, it is considered
    to return dynamic content. That means the response from these sites, such as flights
    to various parts of the country, are dynamically created when the particular query
    is entered.


    ![](img/4df77e7d634c573982f3b815243f9fd2_23_0.png)'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'New Term: Web Application

    nA Web application is a program that runs on a Web server.


    Marian and John found their flights and off on vacation they went. Our story about
    Marian and John have come to an end, but our adventure is just beginning. You
    are going to delve into Web structures and understand how Web applications can
    generate different responses to various queries. This book focuses on Sun Microsystems
    technology JavaServer Pages (JSP) to deliver dynamic content to Web clients. So,
    let the adventure begin.


    In this hour, you are going to understand


    +   * What JavaServer Pages

    * The evolution of the Web

    * The reason the Java 2 Enterprise Edition (J2EE) platform was created

    * What application servers are


    # What Are JavaServer Pages (JSPs)?


    JavaServer Pages (JSPs) are a technology defined by Sun Microsystems to create
    dynamic content on the Web. They are HTML documents that are interleaved with
    Java, which provides the dynamic content. JSPs are a server-side application;
    they accept a request and generate a response. Generally the requests are made
    back to the Web client. Because JSPs are a server-side application, they have
    access to the resources on the server, such as Servlets, JavaBeans, EJBs, and
    databases. In Hour 5, “Understanding the JSP Application Models,” you will take
    a look at various design patterns that JSPs can implement, as defined in the JSP
    specification.


    New Term: Web Client

    A client is a client that interacts with a Web server using the HTTP protocol.
    The client runs a Web browser, such as Internet Explorer or Netscape Navigator,
    and requests documents by specifying a URL in the browser.


    There are many benefits to using JavaServer Pages. Because JSPs utilize the Java
    programming language, they follow the write-once, run-anywhere policy. This means
    that a JSP can be run on any application server that supports JSPs without any
    modifications to the specification.'
  merge: -1
