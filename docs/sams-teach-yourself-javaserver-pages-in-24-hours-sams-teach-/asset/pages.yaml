    to define the hierarchy of categories. The CategoryNames array defines the names
    of the categories. The SubCategories array is a two dimensional array that defines
    the subcategories of the nth category in the CategoryNames array. Here is an example
    of the CategoryName array that defines several categories and subcategories:


    | Index | CategoryName |

    | --- | --- |

    | 0 | Toys |

    | 1 | Music |

    | 2 | Construction |

    | 3 | Educational |

    | 4 | Preschool |

    | 5 | Classical |

    | 6 | Rock |

    | 7 | Country |


    The relationship of what category is a subcategory of which is defined by the
    SubCategories array. For any index of the array, the array should contain the
    subcategories of the category in CategoryNames with the same index. For instance,
    the example SubCategories array below defines for index 0 (category Toys) there
    are 3 subcategories: category 2 (Construction), category 3 (Educational), and
    category 4 (Preschool). Also for index 1 (category Music) there are 3 subcategories:
    category 5 (Classical), category 6 (Rock), category 7 (Country).


    | Index | Subcategory 1 | Subcategory 2 | Subcategory 3 |

    | --- | --- | --- | --- |

    | 0 | 3 | 4 | 5 |

    | 1 | 6 | 7 | 8 |


    To simplify, allow a category to have just three subcategories. Also, the SubCategories
    array may allow subcategories to have subcategories themselves. To allow the SubCategories
    array, use the following syntax:


