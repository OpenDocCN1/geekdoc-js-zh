  md: '# Using the Declaration Tags


    Declaring variables and methods consists of listing them within the JSP declaration
    tags &lt;%&gt;. Declarations state the existence of variables and methods that
    are available throughout the JSP code. Declared variables and methods are referenced
    by using their declared name. First, you will see how to declare variables and
    how to declare methods.


    # Declaring Variables in a JSP


    Variables consist of placeholders for data items. Data comes in all shapes and
    sizes and it requires some underlying piece of physical memory to be stored. Variables
    allow you to refer to the content of a particular chunk of memory by name. The
    structure and size of the data is referred to as its *data type* or simple type.
    In-oriented jargon, variables are often called *objects* or *object instances*,
    and data types are classes. The term *object* is often more used when referring
    to a variable that has been declared using a Java class as a data type.


    You declare by declaring the type of the variable and the variable name within
    the &lt;!&gt; tags following this general syntax:

    `dataTypeName = initialization;`


    In this example, initialization is optional and will be covered later this hour.
    In the meantime, Listing 7.1 declares variables:


    # Listing 7.1 Declaring Variables (declaringVariables.jsp)


    ```

    1: <HTML>

    2: <HEAD><TITLE> Variable Declaration Example</TITLE></HEAD>

    3: <BODY>

    4: <% int myIntegerValue;

    5: String myStringVariable;

    6: float myFloatingPointVariable;

    7: %>

    8: </BODY>

    9: </HTML>

    ```


    Line 4 of the preceding code declares a variable called myIntegerValue of type
    int that can hold an integer number. Line 5 declares a variable called myStringVariable
    of type String that can hold a concatenated series of characters. Line 6 declares
    a variable called myFloat of type float that can hold a floating-point number.
    Data types are covered in just a minute, but first a word on variable and method
    names.'
