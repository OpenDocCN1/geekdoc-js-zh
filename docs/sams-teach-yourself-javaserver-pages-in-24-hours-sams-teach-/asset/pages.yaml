  md: '# Creating the Deployment Descriptor


    Once all the files are up to date, you can write the deployment descriptor that
    describes your resources in the Web application.


    Web files contain one, possibly two, deployment descriptors, which are used to
    describe the resources in the Web application, any security constraints, and references
    to external resources. XML is used to write these deployment descriptors. The
    one deployment descriptor you will always have is named web.xml. An optional secondary
    descriptor file is named weblogic.xml, if you are deploying on BEA''s WebLogic
    Server. The web.xml file describes the resources of the Web application, welcome
    files, error pages, and security constraints. The weblogic.xml file describes
    mappings to external resources such as EJBs. Both .xml files are located in the
    WEB-INF directory.


    Are you ready to write the deployment descriptor for the human resources Web application?
    Since this application did not use any external resources, the weblogic.xml file
    is not needed. You only need to write the web.xml deployment descriptor. Listing
    24.11 shows the code for the web.xml file for the application.


    > The Extensible Markup Language (XML) is used throughout the JEE platform to
    describe applications. Since XML is a meta-language, it describes other tag languages,
    and it is a great way to describe your own documents and the elements of those
    documents.


    # LISTING 24.11 Deployment Descriptor for the Human Resources Web Application
    (web.xml)


