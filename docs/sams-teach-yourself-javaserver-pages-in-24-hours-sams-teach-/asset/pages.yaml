- img_proc: true
  md: '# Introduction to Web Applications


    # What Does the Specification Define?


    The specification defines the parts of an enterprise application and the services
    they require. Also defined are how these parts communicate.


    # Who Benefits from This Specification?


    Many benefit from this specification. Most enterprise applications represent or
    use data from a database. The data in database is persistent over time. Also in
    these transactions need to be monitored. A transaction is a group of steps that
    need to all operate without error or not at all. For example, if you transfer
    $100 from your savings account to your checking account, a couple steps need to
    help. The money is withdrawn from your savings and deposited to your checking
    account. If an error occurs after the money is withdrawn and it is not deposited,
    you want that to roll back, or go back to the original state, with the $100 in
    your savings account. Because the specification defines the services that enterprise
    applications need, application server vendors are able to implement many primary
    services—such as transactional support, security, and persistence—so the programmer
    does not need to worry about programming these into his or her code. So this specification
    allows companies or individuals to create products that can help application developers
    decrease the development time while building a scalable application.


    # What Technologies Make Up This Platform?


    The J2EE is made up of 13 technologies:


    +   * JavaServer Pages (JSPs)

    * Servlets

    * Java Messaging Service (JMS)

    * Java Database Connectivity (JDBC)

    * Java Naming and Directory Interface (JNDI)

    * Java Transaction Service (JTS)

    * Java Transaction API API (JTA)

    * JavaMail

    * JavaBeans Activation Framework (JAF)

    * Remote Method Invocation (RMI)

    * Enterprise JavaBeans (EJB)

    * Extensible Markup Language (XML)

    * Java Integrated Definition Language (Java IDL)


    Sun has also recently added J2EE Connector Architecture to the J2EE.'
  merge: -1
