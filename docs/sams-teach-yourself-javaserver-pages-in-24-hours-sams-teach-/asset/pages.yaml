  md: '# Substituting Text in a JSP


    The value for the file attribute is a relative path and is the name of the file
    that should be included into JSP. It is the responsibility of the server to resolve
    the address to the included file. If your JSP is in the c:\weblogic\myserver\myJSPs\hour18
    folder, and you want to include a file called copyright.html located in the c:\weblogic\myserver\myJSPs\hour18\includedFiles,
    then your include directive would look like:


    ```

    <@ include file="includedFiles.copyright"html>

    ```


    What happens if the included file contents change? It would be helpful if there
    was a way for the JSP to be notified of changes in included files, however the
    JSP 1.1 specification does not describe or require that the JSP container be notified
    when included files are modified.


    # Examples of the include Directive


    This section contains several examples using the include directive. The first
    example includes a company banner at the top of the JSP, the second example includes
    a JSP, and the third shows what happens the included file cannot be found.


    # Including a Text Document


    In this example the JSP is going to include a text document, formatted using HTML
    tags, that contains a company banner. The banner is to be included at the top
    of all of the company''s JSPs; putting it into a separate file allows the company
    to modify its banner and propagate the changes to all its JSPs. Listing 18.1 shows
    the HTML file to be included in the JSP.


    +   **Listing 18.1** An HTML File that Contains a Company Banner (companyBanner.html)


