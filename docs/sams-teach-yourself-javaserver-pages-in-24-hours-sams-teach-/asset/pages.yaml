  md: '# TABLE 12.2 Session-Related Methods of the HttpServletRequest Class


    | Method | Description |

    | --- | --- |

    | HttpSession getSession() | Returns the current session or creates one if it
    doesn''t exist |

    | HttpSession getSession(boolean) | Returns the current session or creates one
    if argument is true |

    | String getSessionID() | Returns the session ID |

    | boolean isRequestedIdValid() | Returns true if session ID is valid or false
    otherwise |

    | boolean isRequestedSessionIdFromCookie() | Returns true if the session ID came
    from a cookie, false otherwise |

    | boolean isRequestedSessionIdFromURL() | Returns true if the session ID came
    from an encoded URL (discussed in the "Encoding URLs" section), false otherwise
    |


    Every distinct user starts with an interaction with JSP of an application is associated
    with a unique session object. This is accomplished by creating a unique ID for
    every user that interacts with the application and storing it as a cookie on the
    client''s machine. On every request the client makes to the server application,
    the cookie that holds the client ID is to distinguish among potentially many users.
    The ID is used to determine the correct session instance for the corresponding
    user. This mechanism allows JSPs to maintain a private conversation with each
    other as they jump from page to page. JSPs store and retrieve temporary data in
    a session using the setAttribute() and getAttribute() methods. These methods allow
    developers to bind any object data to a string so that they can be retrieved by
    name. The session object is an implementation of the HttpSession interface and
    its API methods are listed in Table 12.3.


    # TABLE 12.3 Methods of the HttpSession Session


    | Method | Description |

    | --- | --- |

    | Object getAttribute(String) | Returns the object bound to the string in the
    parameter |

    | void setAttribute(String, Object) | Binds the object to the string in the parameter
    |

    | void removeAttribute(String) | Unbinds the object bound to the string in the
    parameter |

    | Enumeration getAttributeNames() | Returns an enumeration of strings for all
    bound objects in the session |

    | long getCreationTime() | Returns the time when the session was created as milliseconds
