    An advantage to this model is its simplicity to program. The page author can very
    easily create dynamic content based on the user''s request.


    A disadvantage to this model is it does not scale easily when the number of clients
    increases. The JSP can then potentially scarce or expensive resources, such as
    a connection to a database. Each client must either establish this resource or
    share one, which can hurt performance when you get many clients.'
