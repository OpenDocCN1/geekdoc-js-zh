  md: '# New Term: Document Type Definition (DTD)


    DTDs are used to define the elements and relationship of elements in your XML
    files. The elements that are defined are the tags that will be used in the XML
    file. Since there are different relationships between tags, grammar is used to
    define the relationship, whether it is a required tag, an optional tag, one or
    more tags, or zero or more tags.


    The content of the web.xml file is surrounded with a <web-app>. The tag starts
    on line 6 and closes on line 57. Within the <web-app> tag is where the real content
    of the document lies, specifying your Servlets and JSPs, welcome files, and security
    on the Web application.


    Recall from Hour 4, "Configuration Applications," that you set up a Servlet named
    JSPServlet in the weblogic..properties file to handle all requests with the .jsp
    extension. After you registered the JPServlet, you set up initial arguments as
    the compileCommand that pointed to your JDK compiler. The JSPServlet automatically
    registered for your Web archive files. However, you need to specify the initial
    arguments in the web.xml file. Use the <context-param> tag to start the initial
    argument name and value. Lines 7–10 use the <context-param> tag to specify the
    JDK compiler. Line 8 has the name of the parameter, <param-name>, specified to
    weblogic.jsp.compileCommand. Line 9 sets the value, <param-value>, of the compileCommand
    आयु to be: d;/jdk1/2.2/bin/javac.exe. Again, this is the compiler you want to
    use to compile the Java in JSPs.


    In this file you need to declare Servlets and JSPs in your Web application. The
    resources Web application does not contain any Servlets, but it contain many JSPs.
    The <servlet> tag contains other tags—<servlet-name> and <servlet-file>if you
    are declaring JSPs. Take a look at lines 15–18 for a moment, a JSP AddNewEmployee
    is declared as part of the Web application and assigned the name AddNewEmployee.
    This type of tags is repeated for each of the JSPs in the Web application.


    In the web.xml file, you can specify files to be welcome files. That way if the
    client does not request a particular file but have a more generic request, such
    as http://www.amazon.com, a document will be sent instead of showing a directory
    structure of amazon.com. Line 51 is the <welcome-file-list> that starts a list
    of <welcome-file> tags specifying your welcome files. Line 52 specifies that HumanResources.html
    is a welcome page for your Web application.


    Security for your Web application can be specified in the web.xml file. For a
    human resources Web application it makes sense that only the employees have access
    to the application. Therefore, you use the <login-config> tag to specify a login
