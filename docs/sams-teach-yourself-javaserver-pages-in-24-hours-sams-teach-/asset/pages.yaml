  md: '# Adding Comments to the Code


    Comments are sentences and phrases inserted by programmers to document the JSP
    source code. Comments are useful for explaining what the code does in plain English.
    Explanations can be very helpful when revising the code after an extended period
    of time, or if it is being reused by other developers. Comments do not affect
    what is displayed in a browser but help a user understand the HTML and JSP source
    generated the page. There are three types of comments: HTML, JSP, and Java.


    # Adding HTML Comments


    HTML comments are created using tags <! - and --. When these tags appear in JSP,
    they are ignored by the JSP unchanged, and they will appear in the resulting HTML
    code that is sent out to the browser. The browser is responsible for ignoring
    the comments. Comments can have dynamic content embedded in them they are not
    simply inserted by the JSP. JSP expressions within an HTML comment will be evaluated
    and inserted in the response to the browser. Here are examples of a simple HTML
    comment and one that includes a JSP expression:


    ```

    <!-- This is a simple comment -->

    <!-- 2 + 2 = 2 + 2 -->

    ```


    The resulting HTML code would be the following:


    ```

    <!-- This is a simple comment -->

    <!-- 2 + 2 = 4 -->

    ```


    Both comments will be ignored by the browser.


    # Adding JSP Comments


    HTML comments are used to document the HTML content generated by the JSP. JSP
    comments are used to document the JSP code itself. JSP comments are not included
    in the response sent back to the browser. They are created using the tags <% -
    - --. The following is a simple example:


    ```

    <%-- This comment won''t go to the browser--%>

    ```


    So unlike HTML comments, JSP comments are ignored by the JSP and do not appear
    in the source code of the Web page in the browser.


    # Adding Java Comments


    Java comments are used to comment the Java code embedded in a JSP. One-line Java
    comments are preceded by //. The pair /* and * */ can comment a whole section
    of code.'
