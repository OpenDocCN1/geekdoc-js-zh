    Hour 13


    A Putting the initialization parameters in JSP source code is an alternative to
    putting them in the configuration file. The benefit of using a configuration file
    is that the source code does not need to change when the initialization parameters
    need to change. This makes the source code more portable and reusable. Also note
    that changes in the source code means that the resulting Servlets need to be recompiled
    and redeployed.


    Q When I change the source of a JSP I usually see the changes right when I reload
    the JSP in my browser. This doesn''t seem to apply for JSPs that have been converted
    to Servlets. Why?


    A Yes, when you convert a JSP to a Servlet you lose the convenience of being able
    to change the JSP and see the changes immediately. The reason is that Servlets
    from a JSP are like any other Servlet—they must be deployed and configured in
    the configuration and the classes that implement them are loaded once by the application
    server. This means that if you change a change in a JSP to reflect on its corresponding
    Servlet, you will need to reboot the application server. Some application servers
    allow hot deployment of some or all of its different services, including Servlets.
    Hot deployment means that some or all of the pieces of an application can be inserted
    or modified without shutting down the application server. Hot deployment together
    deployment tools help the process of reconfiguring JSPs quickly but can''t beat
    the versatility of just changing the source and having those changes take effect
    on-the-fly.


