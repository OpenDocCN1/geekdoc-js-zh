    # Calling a Method of an Object


    Not only can JSP expressions reference methods declared locally within the JSP
    but they can also reference methods of an object declared in Java classes. In
    Listings 8.5 and 8.6 show how a JSP creates an instance of a JavaBean and then
    calls methods on the instance, printing out the string representation of the results
    of each the method calls. The first listing declares the JavaBean with several
    methods, and the second declares the JSP that uses the JavaBean.


    Being able to reference methods both locally in the JSP, and from a JavaBean is
    important because computations in a JSP expression can quickly get out of hand,
    especially if the computation is complex. It is better to declare a method that
    accomplishes the computation, give it a descriptive name, and then reference it
    from the JSP expression.'
