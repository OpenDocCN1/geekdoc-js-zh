  md: '# Accessing a Database from a JSP


    To use a driver you need to instantiate it from your JSP code, configure it, and
    obtain a Connection object. To instantiate the Cloudscape JDBC driver, use the
    method Class.forName(String className), which instantiates the named class:


    ```

    Class.forName("COM.cloudscape.jdbcDriver");

    ```


    The argument to the forName() is a fully qualified class name that can be found
    in the system CLSPATH. For Cloudscape, the COM.cloudscape.jdbc class is located
    in cloudscape.jar, which should be in your system CLSPATH. The virtual machine
    will look for the class and instantiate it. When the JDBC driver is instantiated,
    it registers itself with the DriverManager.


    # Getting a Connection to the Database


    After the JDBC driver has registered with the driver manager, you can use the
    DriverManager.getConnection(String) method to obtain a Connection object from
    the DriverManager object. Here is an example of getting a connection to the Phonebook
    database from the DriverManager:


    ```

    Connection con = DriverManager.getConnection("jdbc:cloudscape:Phonebook");

    ```


    The argument to the getConnection() method consists of a URL with a syntax that
    depends on the database vendor. To make correct use of the URL you need to read
    the documentation of your database provider. For Cloudscape, the URL syntax is


    ```

    jdbc:cloudscape:databaseName

    ```


    The first portion of the URL, jdbc, identifies the communication protocol being
    used. The second part, cloudscape, identifies the vendor-specific protocol. Subsequent
    portions of the URL depend on the particular database vendor you choose. For Cloudscape
    it identifies the path and database name. If the database is located in the same
    directory as the JSP, it suffices to use the name of the database.


    The Connection returned by DriverManager provides methods to manage the lifecycle
    of a connection to a database as well as methods to create different types of
    SQL statement objects. For the purpose of this hour, the focus is on one particularly
    useful method for creating Statement objects, Connection.createStatement().


    ```

    Statement sqlType = con.createStatement();

    ```


    The Statement object represents an SQL statement used to directly interact with
    the underlying database. Database interactions consist of querying and updating
    the database.'
