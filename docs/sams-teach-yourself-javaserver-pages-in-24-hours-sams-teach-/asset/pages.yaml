  md: '# The Including Requests Model


    Sometimes it is helpful to distribute the work of your application among multiple
    JSPs. Figure 5.5 shows one way to split up the work.


    ![](img/4df77e7d634c573982f3b815243f9fd2_82_0.png)


    One JSP could be responsible for the request and the response, but includes the
    output of other JSPs. This is accomplished by using the include action. Hour 20,
    “Using Multiple JSPs to Handle the Request,” covers this action in much more detail.
    Listing 5.2 is a JSP that includes the output of other JSPs, whose code is shown
    in 5.3 and 5.4.


