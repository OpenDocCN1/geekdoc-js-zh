  md: '# HOUR 18


    # Substituting Text in a JSP


    Somtimes you want to include data, such as a copyright, a company logo, or a menu
    bar, in each of your Java Pages. If you typed the copyright into each of your
    JSPs and your copyright changed, you would have to go into each JSP to modify
    it. Well, there is a better way: Instead of typing the text into each JSP, write
    a file and bring that file into your JSP. When you separate the data from the
    JSP, you only need to update one file with changes—any JSP using that file automatically
    receives the update.


    The JSP specification allows data to be inserted into a JSP in one of two ways,
    the include directive and the include action. The include directive treats the
    included file as a static document and inserts that file''s code into the JSP.
    The include action treats the included file as a dynamic object and inserts the
    output of the included file. Hour 20, "Using Multiple JSPs to Handle the Request,"
    discusses the include action in detail.


    In this hour you will


    +   - Learn how the data is inserted into the JSP using the include directive

    - Follow examples of using the include directive'
