    # Summary


    In this hour you were introduced to JavaBeans and how they can be created and
    used from JSPs. The scope of a JavaBean was used to configure its lifespan, and
    a shopping cart example illustrated the relevance of the scope. Finally, the use
    of forms and JavaBeans was demonstrated.


    # Q&A


    +   Variables in a JavaBean can be set or read using the method calls or the setProperty
    and getProperty tags. Why the redundancy?


    +   Variables in a JavaBean are accessible to a JSP in three ways. You can access
    a value directly from a scriptlet by referencing its name as `myBean.myVariable`.
    You can also use the appropriate set or get method to access or set the variable''s
    value. Finally you can use the JSP tags setProperty and getProperty. Referencing
    the variables or using the methods give you the most flexibility, allowing you
    to combine the variables'' value in expressions, statements, and method calls.
    The tags give you simplicity and allow tools to easily manipulate JavaBeans. Tags
    in general, HTML, XML, or JSP make it easier to develop tools to manipulate documents
    and source code.


    +   In a previous hour, the session object was used to implement a shopping cart.
    This time a JavaBean was used. Which one is better and why?'
