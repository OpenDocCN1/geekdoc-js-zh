  md: '# Reviewing the Forwarding Requests Application Model


    Recall from the discussion in Hour 5 that one of the JSP application models is
    the Forwarding Requests Model (shown in Figure 20.5).


    ![](img/4df77e7d634c573982f3b815243f9fd2_311_0.png)


    In the Forwarding Requests Application Model one JSP accepts the request from
    the user, possibly stores data in a JavaBean, and then forwards the request to
    another JSP. This is also known as JSP chaining, since you are in essence chaining
    some Java Pages together. Therefore, in this scenario, one JSP accepts the request
    but another JSP is responsible for sending the response back to the user.


    # Using the forward Action


    The general syntax of the forward action is:


    ```

    <jsp:forward page="RelativeURL_to_JSP">

    ```


    Notice that the forward action is much like the include action: both take a page
    attribute that is a relative path to the file to which is being included or forwarded.
    Also note that this is an empty tag so there is a forward slash for the closing
    >.


    # Implementing the forward action


    Now it is time to look at the forward action in an example. This example is going
    to insert golfer statistics into the database. The user enters the application
    from an HTML document that requests his name, course name, and then his stroke
    count for each hole. Listing 20.5 shows the code for the HTML document.'
