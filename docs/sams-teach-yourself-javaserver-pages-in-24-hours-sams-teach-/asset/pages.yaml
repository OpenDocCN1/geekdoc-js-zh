  md: '# Creating Error Pages


    information about the cause of the error. This can be accomplished by using the
    isErrorPage attribute of the JSP directive and then with the following syntax:


    ```

    <@ page isErrorPage=true|false %>

    ```


    When an error JSP sets the isErrorPage attribute to, the JSP has access to the
    JSP implicit object exception object in addition to the other implicit objects.
    The exception object contains reference to the exception that was thrown and can
    be used by the JSP to find out what went wrong and is more informative. The exception
    object is of type Exception, which inherits all its methods and attributes from
    the class Exception, which in turn inherits all its methods and attributes from
    the class Throwable.


    Listing 14.11, badLoginWithExceptionObject.jsp, shows a JSP that declares itself
    to be an error page and uses the exception object. The JSP is meant to be used
    in place of its simpler version, badLogin.jsp, the example in which of substitution
    you need to edit the page attributes of login.jsp and goodLogin.jsp so that they
    point to badLoginWithExceptionObject.jsp instead of badLogin.jsp.


    The JSP in Listing 14.11 illustrates the use of two methods of the exception object.
    The first is straightforward, getMessage(). Retrieves the message of the exception
    was thrown. The message is set when the exception is instantiated and then thrown
    in UserNameValidationBean.


    The second method, printStackTrace(), is somewhat trickier. It prints the trace
    of the classes and methods through which the exception propagates in Java. This
    is useful information for developers since it helps to track down the root of
    the problem. It is less interesting to users who use the stack trace to be very
    blunt and friendly. There are several versions of the printStackTrace() method
    that accept different parameters depending on where the print should be directed.
    The printed output can go to standard out, the console, or a buffered character
    stream. Streamed buffers allow developers to progressively add bits and pieces
    of data as a computation is in progress. The JSP implicit object is such an object.
    The problem is that the object is of type PrintWriter and none of the printStackTrace()
    methods take it as an argument which is a close to PrintWriter. PrintWriter and
    Writer are derived from a common abstract class, Writer. This allows PrintWriter
    objects to be created from a reference to the JSP(out) using the constructor method
    of PrintWriter. Once an instance of PrintWriter is created with a reference to
    the instance is passed to the printStackTrace() method, which will print to the
    output and be rendered in the browser.


    Listing 14.11 will help you understand the exception object and its methods are
    used.


