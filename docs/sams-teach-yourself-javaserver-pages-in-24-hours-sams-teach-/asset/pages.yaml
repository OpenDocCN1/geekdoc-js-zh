    # Hour 8


    Being able to use numeric operators like + * is important because they let you
    compute numeric expressions on the spot and insert the dynamic result in the HTML
    code. Consider the earlier example of the payroll. One of the columns must list
    the monthly contribution of the employee to their 401K retirement plan. The contribution
    is usually some of the employee''s salary where each employee chooses their own
    and each has a different salary. If the percentage is stored in a variable contribution401K
    (as a %) and their salary is stored in a variable called salary, then the expression
    to com-pute their contribution could be computed with the following expression:


    ```

    <%contribution401K * salary%>

    ```


    The expression can be inserted among the HTML tags that create the row and cell
    for each employee.


    # Overriding the toString() Method


    The JSP compiler knows how to convert standard data types like int, float, and
    double to strings. If the expression evaluates to a value representable by a standard
    data type, then the JSP compiler knows how to convert the value into a string
    representation. However, if the resulting expression evaluates to a custom data
    type created from a user-defined class, JSP will try to use a toString() method
    for that object. If the toString() method has not been defined for that object,
    the JSP determines which superclass of the defined class has a toString() method
    that could be used. If no toString() method is found in the class hierarchy tree,
    all objects inherit from the Object class. This might mean that the resulting
    string is a representation of the binary representation of the object in memory—
    would be gibberish to most of us. Therefore, if you intend for a custom data type
    to have a meaningful representation, you must override the toString() method in
    the custom data type that creates and returns a string representation of the object.


    > The Object class is the root of the class hierarchy. All other classes are derived
    directly or indirectly from the Object class. In object-oriented programming a
    class that is derived from another class inherits its methods and variables. If
    a class inherits from the Object class, it inherits the toString() method which
    can be overridden and tailored to the needs of the class. If the toString() method
    is not overridden and an instance of object is printed, then the method toString()
    inherited from the Object class is used.


    Listings 8.2 and 8.3 implement an example in which a custom data type is declared
    that overrides the toString() method. The method is then used from a JSP to print
    the output representation of the object. This example uses JavaBeans, which will-
    discussed in more detail in Hour 16, "Using JavaBeans in a JSP."


