  md: '# Processing Requests from the User


    HTTP headers and user session management are covered in Hour 11, “Generating a
    Dynamic Response for the User,” and Hour 12, “Keeping Track of the User Session.”


    The following sections explain how a URL is generated from a user interaction
    with a browser. The URL generated by the browser will be dissected and several
    methods will be introduced for obtaining information about the invoking URL, the
    remote and local machines. Then you will see how to include arguments or parameters
    in a request and how to process them. Finally, HTML forms are introduced to gather
    information from the user and JSP code is shown for processing the information.


    # Creating User Requests


    A request contains information that is passed from a user to a JSP. Part of the
    process of generating a request is to declare or generate a URL that represents
    the invocation of the JSP. It is useful to first describe the first parts of a
    URL and its syntax.


    # The Anatomy of a URL


    A URL has the following general syntax:


    ```

    protocol://host:port/virtualPath?queryString

    ```


    +   * protocol—Declares the underlying mechanisms for transferring information
    between remote machines. Valid protocols include http, https, ftp, rmi, and corba.
    For the purpose of this book, you will use the http protocol.

    * host—Identifies the remote machine name or IP address of the machine which will
    be requested for.

    * port—Declares the machine port number on which the host server will be listening
    for requests. For the http protocol the port is usually 80, and it is the default
    value if you leave out this parameter. In this section you will be using WLS as
    the server, and it is configured to listen to port 7001.

    * virtualPath—Contains a set of identifiers delimited by the slash (/) that is
    used by the server to map to a physical path and the location of the JSP.

    * extraPathInformation—The virtualPath may optionally contain several identifiers
    that do not map to any physical path. The identifiers can serve as an argument
    for the JSP to configure its behavior.

    * queryString—A list of name/value pairs passed to the JSP as a query string:


    The following is an example of a URL that invokes a JSP with a query string:


    ```

    http://alice:7001/myJSPs/hour10/request.jsp?p1=val&p2=val2

    ```


    ![](img/4df77e7d634c573982f3b815243f9fd2_149_0.png)'
