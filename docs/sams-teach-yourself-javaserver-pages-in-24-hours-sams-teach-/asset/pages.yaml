    # Declaring Arrays and Collections


    Sometimes it is convenient to handle set of data as a group or collection. Java
    provides several data types to handle data as collections, depending on whether
    the data is all of the same type, whether the size of the collection is fixed,
    and how you intend to access the data.


    The simplest form of a collection of data is the array. Arrays are contiguous
    data slots that can hold values of a certain type. You can create an array out
    of any data type by using the indexing characters [ ]. Arrays are declared by
    appending the [ ] operator to the data declaration and then allocating the array
    with the new operator. This is illustrated in Listing 7.5 where you declare several
    arrays.


    # Listing 7.5 Declaring Arrays (declaringArrays.jsp)


    ```

