  md: '# HOUR 21


    # Designing an Enterprise Application


    You have learned the nuts and bolts of writing JavaScript Pages, now it is time
    to put it all together. Over the remaining hours of this book, you are going to
    write a Web application that usesServer Pages, JavaBeans, and a database. The
    application is going to be a human resources Web site that allows employees to
    view their benefits, change their names, addresses, and phone numbers, and view
    company policies. There will also be the capability to add new employees. Typically,
    only managers will be able to add new employees, but you are just writing the
    pages to implement this capability. Usually, the server in which you deploy the
    application, will handle the security issues. This is a very common part of a
    company''s intranet.


    Writing this application allows you to put almost all that you have learned into
    a practical example. You will use the include directive, the include action, the
    forward action, scriptlets, the page directive, and much more. Take your time
    with this exercise and embell where you see fit. Work hard and have fun.


    ![](img/4df77e7d634c573982f3b815243f9fd2_325_0.png)'
