  md: '# HTTP Is a Stateless Protocol


    The World Wide Web was designed around a simple request/response mechanism. Browsers
    running on client machines request HTML documents, and servers respond by delivering
    the documents. The rules and mechanisms for transferring HTML documents are called
    the Hypertext Transfer Protocol (HTTP). Servers typically receive requests from
    many different clients, and servers are only aware of a particular client until
    they fulfill a request with a response. Servers forget about the client and go
    on to fulfill requests from other clients. HTTP does not provide mechanisms to
    distinguish one client from any requests happen to come from the same client,
    the server is not aware of it. In this sense HTTP is referred to as a stateless
    protocol. This (or lack thereof) posed a limitation on what a Web site could do.
    Servers could not remember bits of information for a particular user since there
    was no way to distinguish one user from another.


    To illustrate this problem, consider a Web site that has an online catalog from
    which a user can select several items and put them in an online shopping cart
    for later checkout. As the user clicks different hyperlinks and buttons it generates
    distinct requests. At the same time there are other users using the same Web site.
    The server must be able to keep track of which requests belong to which user so
    that items be put in distinct shopping carts. The server must be able to maintain
    the state of each of the users, and HTTP does not allow this.


    To solve this, Netscape invented the notion of a cookie. Cookies are bits of information
    and related mechanisms to store user-related information on client machines on
    behalf of the server. The information is then sent to the server every time the
    browser makes a request to the same server. The information in a cookie can consist
    of anything but in general the information is used to identify distinct users
    accessing the same server. The cookie can contain username information, a particular
    ID, personalization information, or anything else that the Web application decides
    to keep track of particular users. The masterful interaction of a client with
    a Web site is known as a stateful conversation or stateful session.


    A Web application sets a cookie by requesting that the server creates a cookie
    on the client machine which the browser is running. The amount of information
    in a cookie and the number of cookies allowed are usually limited because a server
    generally should not be permitted to use a client''s machine as a remote storage
    device. Browsers can be configured to reject cookies, in which case Web applications,
    or parts of them, will refuse or deny any of their services that depend on keeping
    track of their users.


    JSPs provide three ways to maintain a stateful conversation between the client
    side browser and the server application: cookies, sessions, and URL rewriting.'
  merge: -1
