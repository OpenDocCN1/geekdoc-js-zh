    the value of j is less than or equal to 10, which is the first time around. The
    update of j is postponed until the end of the loop by the post increment operator
    (j++). The first time around, j is 1 throughout the entire code block. At the
    end of the loop, j is incremented to 2 and the loop is repeated. The second time
    around, j is initialized but to 10 and incremented at the end of the loop. The
    loop then executes 10 times until j is equal to 10. The last time, when j is equal
    to 10, j is incremented to 11 at the end of the loop and the expression j<=10
    is no longer true, and the loop ends.


