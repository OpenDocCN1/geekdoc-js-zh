    JSP AddNewEmployee.jsp is executed. This JSP will parse the requesting data in
    a JavaBean (NewEmployeeBean). After the data is stored in the JavaBean, it calls
    the method updateDatabase() in the JavaBean to update the database with the new
    employee''s information. The JSP invokes this method, but the logic of storing
    the information into the database is located in the JavaBean. Once the database
    is updated, the AddNewEmployee.jsp forwards the user''s request to another JSP
    (PresentNewEmployeeInfo.jsp), to present the new employee''s information. The
    code for AddNewEmployee.jsp is shown in Listing 23.2.


