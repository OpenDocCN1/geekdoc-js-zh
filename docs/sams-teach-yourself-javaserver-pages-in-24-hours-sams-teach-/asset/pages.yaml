  md: '# Using JavaBeans in JSP


    JavaBeans are particularly convenient because they lend themselves to be represented
    or referenced with special JSP tags. For a Java class to comply with the JavaBean
    specification, it must have a constructor with no arguments and getXXX() and setXXX()
    methods for each class variable. Complying with JavaBeans specification is not
    a requirement, and any Java can be used as a JavaBean from within JSP.


    ![](img/4df77e7d634c573982f3b815243f9fd2_241_0.png)


    The following sections will show several examples of JavaBeans. The first example
    introduces you to simple JavaBeans that model generic employees and a payroll.
    A JSP uses the beans to generate a dynamic payroll Web page. The lifecycle of
    JavaBeans is introduced and how to learn about the lifecycle with the scope of
    the JavaBean. The use of scope is illustrated with an example JavaBean that implements
    an online shopping cart. Special JSP tags are then introduced to access and alter
    the attributes of a JavaBean. Finally, the special tags are used in conjunction
    with HTML forms to initialize JavaBeans in an efficient way.


    # Employee JavaBean: A Simple Example


    This section introduces you to the Employee JavaBean that will be used throughout
    the rest of this hour. The JavaBean can be used to model employees and associated
    data like names, Social Security numbers, and salaries. The JavaBean complies
    with JavaBean specifications by declaring a constructor with no arguments and
    set methods for each of the variables in the class.


    The Employee JavaBean is declared in Listing 16.1. The attributes of the bean
    will be populated with random values created by the utility JavaBean declared
    in Listing 16.2, RandomPeopleGenerator.java.


    The example JSP of listing, randomPayroll.jsp, illustrates how the JavaBean is
    instantiated and used to create a listing of random employees. The random data
    is created by using a second JavaBean that can generate random numbers, integers,
    and Security numbers.


    The JavaBeans are compiled using the javac compiler that comes with any JDK or
    any other development environment you might be using. The JavaBeans (found on
    this book''s CD-ROM) need to be compiled to a directory where your application
    server can find them. If you are using WebLogic Server and a JDK from Sun, you
    can use the following javac command to compile your JavaBeans from a DOS shell
    prompt:


    ```

    javac -d d:\WLS51\classes *.java

    ```'
