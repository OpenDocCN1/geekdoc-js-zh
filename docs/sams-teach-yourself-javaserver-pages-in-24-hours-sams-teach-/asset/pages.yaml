  md: '![](img/4df77e7d634c573982f3b815243f9fd2_223_0.png)


    # HOUR 15


    # # Inserting Applets into Your JSPs


    The argument for inserting small programs into your HTML documents was made in
    Hour 1, “Introduction to Web Applications.” The evolution of the Web was discussed
    in that hour and you were introduced to the Plug-In Web. The goal of the Plug-In
    architecture is to have more of the processing power on the client side, taking
    some of the workload off the server, which can then serve client requests. The
    small programs that were embedded into the HTML documents came in two flavors,
    Java applets and ActiveX controls. Sun Microsystems is responsible for the specification
    of Java applets.


    As discussed in Hour 6, “Understanding the Layout of a JSP.” JSPs offer six preset
    action tags that can be used to replace large sections of code with simple tags.
    One of these is called the plugin action tag. It allows you to insert a Java applet
    or a JavaBean component into your JSP. JavaBean components can be used to create
    a graphical user interface (GUI) on the client side. The plugin action tag is
    converted to the appropriate object tag or embed tag in your HTML documents. You
    can use object tags, embed tags, or applet tags in your HTML documents to insert
    Java applets.'
