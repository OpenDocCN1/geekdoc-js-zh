  md: '# The Simple Model


    JSPs can interact. Your application model could be as simple as a single JSP accepting
    the request and generating the response, or it could be a JSP that includes output
    from another JSP. The following sections explain each of the application models
    in more detail.


    The Simple Model consists of a single JSP. Figure 5.1 shows the request coming
    into the JSP and the response being generated from the JSP.


    Figure 5.1

    In the Simple Model, the JSP handles the request and the response to it.


    ![](img/4df77e7d634c573982f3b815243f9fd2_78_0.png)


    In this model there is one JSP that accepts the request and generates the response.
    It hits the database or legacy system to get the data for its dynamic content.
    This was aimed at replacing CGI scripts. Recall from Hour 1, "Introduction to
    Web Applications," that a CGI script was a program written in C, C++, or Perl
    that created dynamic content on the Web. Until now, all the examples in this book
    are Simple Model JSPs, although none have needed to access a database. Accessing
    a database or legacy system is an option that provides this model with some of
    the dynamic content needs. Listing 5.1 is another example of the Simple Model
    illustrating the JSP accessing the database (in this example the JSP retrieves
    book information). Don''t get hung up with the syntax of how it is accessing the
    database). Hour 17, "Accessing a Database from a JSP." explains that.


    # LISTING 5.1 A JSP that Pulls Book Information from a Database (SimpleBookTable.jsp)


    ```

    1: <HTML>

    2: <HEAD><TITLE>An Example of a Simple Model</TITLE></HEAD>

    3: <BODY>

    4: <CENTER>

    5: <FONT COLOR="blue" SIZE="6">

    6:   A Listing Of Books

    7: </FONT>

    8: </CENTER>

    9: <BR>

    10: <%@page import="java.sql.*" %>

    ```'
