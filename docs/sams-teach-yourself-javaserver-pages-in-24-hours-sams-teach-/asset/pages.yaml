    The JSP code can use the identifier ShoppingCart to call methods on the object
    instance.


    You''ll find more information on JSP action tags in appropriate places throughout
    this book.


    # Using the JSP Built-in Objects


    JSPs have access to several objects that provide functionality to process a request
    from a browser and generate a dynamic response. These objects are


    +   * request out

    * response pageContext

    * session application

    * config page


    # Understanding the request Object


    JSPs have direct access to the request from a browser through the request object.
    The request object implements the HttpServlet interface, which represents the
    request object from a browser through a defined set of methods. The request object''s
    methods allow JSP programmers to access information about the user, HTTP headers,
    the client''s machine, cookie information, request URL, and parameters. Hour 10,
    "Processing Requests from the User," provides several examples of how to create
    requests through simple URLs and how to access the information within the JSP.


    # Understanding the response Object


    JSPs have direct access to the response object to generate dynamic content as
    HTML code. The response object implements the HttpServlet interface, which represents
    the response of the JSP to the browser''s request. The response object''s methods
    allow JSP programmers to set HTTP headers, set cookies, and encode session information
    into URLs, among other things. Hour 11, "Generating a Dynamic Response for the
    User," has several examples of how to use the response object to generate dynamic
    content like dynamic HTML tables, dynamic HTML forms, and a configurable Web page.


    ![](img/4df77e7d634c573982f3b815243f9fd2_97_0.png)'
