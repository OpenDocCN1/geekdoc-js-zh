    # Summary


    Throughout the book you have been learning the pieces of building JSPs, and now
    you have applied your knowledge to a real-life example. You have created a human
    resources Web site using JSPs and a JavaBeans. In Hour 22 you built JSPs that
    displayed company policies and benefits and personal benefits. This hour, you
    created the capabilities for the user to add a new employee and change a current
    employee''s information. You have seen two ways to access a database—from the
    JSP directly to the database, and with the JSP using a JavaBean to manage the
    connection to the database.


    # Q&A


