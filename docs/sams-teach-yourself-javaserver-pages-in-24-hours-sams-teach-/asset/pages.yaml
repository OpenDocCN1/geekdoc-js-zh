  md: '# About the Authors


    **JOSE ANNUNZIATO** received his Master’s and Doctor of Science degrees in computer
    science from completing the University of Massachusetts Lowell. He taught at the
    university for several years while completing his doctorate. Although he was lured
    into private industry, working on a range of Internet-related projects for several
    years, Dr. Annunziato has consulted for several companies working on many distributed
    systems for the Department of Defense. He found a nice blend of academic rigor
    and private-industry challenges at BEA, developing coursework for the industry’s
    leading application server products such as WebLogic Server, WebLogic Commerce
    Server, WebLogic Enterprise. His other interests include 3D animation, robotics,
    virtual reality, artificial intelligence, and classical piano. In his spare time
    he enjoys wrestling with his three children, and the company of his wife.


    **STEHANIE FESLER KAMINARIS** has several years of experience in software development
    training. She split her time between the classroom and writing course materials.
    In time she has written hundreds of pages of course materials on Web development,
    such as HTML, JavaScript, Active Server Pages, JavaScript, and CGI programming.
    She has also written course materials for BEA’s WebLogic Server courses, such
    as WebLogic as a Web Server, JavaServer, Servlets, and Web Applications. In the
    classroom she has taught courses in software programming languages, including
    Java and C++, and Java Enterprise technologies such as EJBs, JSPs, Servlets, JDBC,
    and much more. She also teaches courses on running BEA’s WebLogic Server and Administering
    BEA’s WebLogic Server.'
