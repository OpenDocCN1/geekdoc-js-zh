    # The ServletContext Object


    Servlets, and thereafter JSP, execute within the context of a Servlet container
    as described in Hour 3. The ServletContext contains a set of methods that a Servlet
    can use to communicate with the Servlet container. These methods allow you to
    configure properties that are accessible and common across all Servlets executing
    in the Servlet container. Servlets can use the ServletContext to share objects
    across Servlets, forward requests to other Servlets, log messages to keep track
    of execution or errors, and find out metadata about itself, such as its name and
    version. Table 13.3 lists the API for the Servlet class. Many of these methods
    will be covered in Hour 20, “Using Multiple JSPs to Handle the Request."


