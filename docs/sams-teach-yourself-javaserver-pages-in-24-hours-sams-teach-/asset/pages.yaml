  md: '# Using Iteration Control Structures


    Iteration control structures allow developers to progressively handle a collection
    of data or objects. For instance


    Listing 6.3 is a JSP that lists items from some online shopping cart and computes
    the total purchase amount.


    # Listing 6.3 A JSP that uses a Loop for (iteration.jsp)


    ```

    1: <HTML><HEAD><TITLE></TITLE></BODY>

    2: <% String itemName = ["Item 1", "Item 2", "Item 3\];

    3:     double itemCost = [123.00, 234.50, 345.50];

    4:     double totalCost = 0.0;

    5: %>

    6: <UL>

    7:   <% for (int j=0; j<itemName.length; j++) {

    8:     <li><%=itemName[j]%>, $<%=itemCost[j]%>%

    9:       totalCost = totalCost + itemCost[j];

    10:   }

    11:  %>%

    12: </UL>

    13: Total = <%=totalCost%

    14: </BODY></HTML>

    ```


    Lines 2 and 3 of the JSP declare two arrays that contain information for each
    item, itemName and itemCost. Line 4 declares and initializes the totalCost of
    the items in the shopping cart. Line 7 uses a loop to iterate through each of
    the items in the arrays to print out item names and their costs in line 8. Line
    9 accumulates the total cost of the shopping cart and then prints it in line 13.


    # Declaring JSP Directive Tags


    Directive tags are used to command JSPs to perform certain functions or to behave
    in a particular way.


    For instance, the following directive imports all classes under the package com.macmillan.jspIn24.


    ```

    <@ page import="com.macmillan.jspIn24.*" %>

    ```


    There are three directives—page, include, and taglib—that will be covered in hours
    in the book.


    # Declaring JSP Action Tags


    Action tags are used to extend the functionality of JSPs. There are actions that
    allow JSPs to use objects created in Java, include other JSPs, forward requests
    to other JSPs,'
