    # Evolution of the Web


    The technology of the Web has evolved enormously in the last few years. It was
    not so long ago that the Web consisted of only static documents. Now, programs
    are embedded in HTML and dynamic content can be added to the HTML documents at
    runtime. Take a look at the evolution of the Web.


    # The Static Web


    The Static Web is the simplest Web structure. Figure 1.2 shows a diagram of the
    Static Web. The Web client connects to the Web server using TCP/IP and makes requests
    using HTTP. The server sends an already-made HTML document to the Web client.
    This HTML document contains text, possibly hyperlinks, and the formatting tags.
    It does not contain any dynamic content, nor does it contain a way for the user
    to interact with it. Basically, in this structure HTML documents are stale and
    provide no interaction to the client.'
