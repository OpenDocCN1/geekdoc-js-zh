  md: '4. Many times a Servlet parses the user’s request and uses a JSP to present
    the response. If you were to apply this philosophy to the Husky World Human Resources
    site, what JSP(s) would be replaced with Servlets?


    The JSP that could be represented by Servlets is PersonalInfo.jsp.


    # # Answers for Hour 23, “Programming the Business Logic”


    # ## Quiz


    +   1. What directive imported the appropriate files for doing database access?


    The page directive allows you to import Java packages into your JSPs.


    +   2. What is a benefit of using the include directive?


    The include directive allows you to create HTML or static documents, and then
    dynamically insert their code into your JSPs. A common banner or copyright that
    appears on all your JSPs can be kept in a separate file, and any changes you make
    to it will propagate to all your JSPs.


    +   3. When you execute an SQL statement on a database, what type of object is
    your data stored in?


    The data from the database is returned in a ResultSet object.


    # # Answers for Hour 24, “Packaging and Deploying an Enterprise Application”


    # ## Quiz


    +   1. What is a benefit of a Web archive file?


    A benefit of a Web archive file is portability. You can take the file and deploy
    it on any Servlet 2.2-compliant server.


    +   2. What specification describes Web archive files?


    The Web archive files are described in the Servlet 2.2 specification.


    +   3. What XML file is used to describe the Web application, and where is this
    file located?


    The web.xml file is used to describe the Web application; it is placed in the
    WEB-INF directory.


