    The next few sections cover these steps in detail.


    FIGURE 17.5

    The process involved in a JSP using JDBC to access a database.


    ![](img/4df77e7d634c573982f3b815243f9fd2_263_0.png)


    # JDBC Drivers


    JDBC Drivers are classes provided by database vendors that implement the interfaces
    that a programmer uses to interact with the database. When you purchase a database
    compatible with JDBC, you also receive a JDBC driver or pointers to where you
    can download one. The driver''s job is to communicate SQL queries and updates
    at the JDBC level down to the SQL interpretation level of the database and to
    package and communicate results back to the JDBC layer.


    Vendors often create drivers that are optimized to work with a particular application.
    Table 17.1 shows some of the drivers that are available for use with WebLogic
    Server 5.1 or better.


    # TABLE 17.1 JDBC Drivers


    | Vendor/Database | Type | Class Name and URL |

    |---|---|---|

    | Oracle | 2 | weblogic.jdbc.oci.Driver jdbc:weblogic:oracle |'
