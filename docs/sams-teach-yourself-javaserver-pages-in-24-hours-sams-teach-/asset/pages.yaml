  md: '# Parsing Parameters in the Query String


    User requests canat a list of name/value pairs as an argument to a JSP being invoked.
    Each of the arguments in the argument list is referred to as a parameter. Parameters
    are passed as part of the URL that invokes the JSP. This is accomplished by declaring
    a query string by appending a question mark (?) after the JSP invocation and then
    an ampersand-delimited parameter list. The general syntax of a URL for invoking
    a JSP with an argument list is:


    ```

    URL?queryString


    where queryString has the following syntax:


    name1=value1[,value2...,valueN1][&name2=value1[,value2...,valueN2]]

    ```


    > Notice the {value2...,valueN1} part in the preceding code means that optionally
    a parameter can have more than one value. Also notice that each name/value pair
    is delimited by ampersands (&) and the question mark denotes the beginning of
    the parameter list.


    ![](img/4df77e7d634c573982f3b815243f9fd2_154_0.png)


    The following is an example of a JSP being passed through two parameters, lastName
    and firstName, with their respective values, Doe and John:


    ```

    http://alice:7001/myJSP/hour/10.jsp?lastName=Doe&firstName=John

    ```


    Multivalued parameters are declared by providing several values for a given parameter.
    For instance, the following example assigns three values for the parameter named
    colors:


    ```

    http://localhost:7001/myJSPs/hour/10/myFlag.jsp?

    colors=yellow&color=blue&country=venezuela

    ```


    The parameter list is passed to a JSP in the HttpServlet object, and it is available
    to a JSP through the standard JSP request object. The request object provides
    three methods to access parameters to: These are


    +   * getParameter(String parameterName)—Returns the value of a parameter named
    paramName.

    * getParameterNames()Returns all the parameters as an enumeration of String objects.
    You can then navigate enumeration extracting each String object. The extracted
    String can then be used as an argument to getParameter(String) method to retrieve
    the value of parameter.

    * getParameterValues(String parameterName)—Returns all the values of a multivalued
    parameter.'
