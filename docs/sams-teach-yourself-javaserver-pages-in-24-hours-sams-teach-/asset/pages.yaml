  md: '# HOUR 14


    # Creating Error Pages


    Errors in an application are inevitable. If not handled properly, they can wreak
    havoc and often bring an application to a halt. In this hour you will learn mechanisms
    to properly handle and process errors using Java exceptions and JSP error pages.


    The following topics are covered in this hour:


    +   - Creating and using custom exceptions

    - Raising and catching exceptions

    - Determining and creating error pages

    - Using the JSP implicit exception object


    # Understanding Errors


    Web applications naturally strive to provide services that can endure a 24-hour/7-day-a-week
    work cycle. Part of achieving that goal is handling the unexpected as smoothly
    as possible. Developers design many scenarios through which users might interact
    with their application in the “normal”


    ![](img/4df77e7d634c573982f3b815243f9fd2_205_0.png)'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'way, following the “rules” of the application. But designers, like everyone
    else, know that there are always “exceptions” to the rules, and a good Web application
    should have built-in safety measures to deal with the exceptions.


    JSPs, and Java in general, provide a mechanism for dealing with unpredictable
    scenarios through the use of exception classes and accompanying logic. Handling
    exceptions appropriately can reduce the crashes that an application might hang
    or crash.


    > New Term: Runtime Errors

    There are two types of errors of which you need to take care. Some of the errors
    like syntical errors are caught by the compiler and it will let you know accordingly.
    These typical errors are using a variable that you have not yet declared, or forgetting
    to pass an argument to a method that expects arguments. There are errors that
    are not caught by the compiler and only make their presence known when the application
    executes. These are referred to as runtime errors. Java’s exception mechanism
    is designed to handle runtime errors.


    The idea behind controlling errors is to write code that catches errors in some
    predictable and controllable section of the code. In other words, you do not want
    errors propagating beyond the control of the application, because that usually
    means that the application enters a state from which it cannot recover—and crashes.
    The mechanism of processing errors relies on the concepts of throwing (or raising)
    exceptions and catching exceptions.


    By catching errors under a controlled predictable piece of code, applications
    are able to recover from them gracefully, avoiding a crash.


    # The Exception and Throwableable Classes


    Exceptions are Java classes that contain useful information about what went wrong.
    They capture a small subset of the state of the application that can give you
    a clue to solving the problem. Exceptions are thrown when an error occurs. The
    error propagates through the code until it is caught. If the developer’s code
    does not catch an exception, the core Java system will—by which time it is usually
    too late to be handled properly.


    All exceptions in Java extend the Java Exception. The Exception class does not
    define any methods of its own; it inherits all its methods from the Throwable
    class. Table 14.1 lists all the methods of the Throwable class.'
