  md: '# Keeping Track of the User Session


    # Storing and Retrieving Cookies


    Cookies are created by the server-side application—the JSP—and are stored on the
    client machine on behalf of the JSP. JSPs can add cookies to the client machine
    using the addCookie()method of the response object. The response object implements
    the HttpServletResponse interface and was covered in the last hour. The addCookie()
    takes an instance of the Cookie class, which can contain information relevant
    to the user. You will see the Cookie class shortly.


    The client machine stores the cookies on the local hard drive in a directory managed
    by the browser running on the client machine. Cookies are retrieved by the JSP
    from the client machine when the client sends a request to the JSP. JSPs access
    the cookies using the getCookies() method of the implicit request object. The
    request object implements the HttpServletRequest object and was covered in Hour
    10, "Processing Requests from the User." The getCookies() method returns an array
    of Cookie objects.


    Cookies are represented as classes on the server side by the Cookie class. Table
    12.1 shows the APIs of the Cookie class.


    # Table 12.1 Methods of the Cookie Class


    | Method | Description |

    | --- | --- |

    | String getName() | Returns the name of the cookie |

    | void setComment(String) | Specifies a comment that describes a cookie''s purpose
    |

    | String getComment() | Returns the comment describing the purpose of this cookie
    |

    | void setDomain(String) | Specifies the domain name within which this cookie
    should be presented |

    | String getDomain(String) | Returns the domain name set for this cookie |

    | void setMaxAge(int) | Sets the maximum age of the cookie, in seconds |

    | int getMaxAge() | Returns the maximum age of the cookie, in seconds |

    | void setPath(String) | Specifies a path to which the cookie should return the
    cookie |

    | String getPath() | Returns the path on the server to which this cookie returns
    |

    | void setSecure(boolean) | Indicates to the browser whether the cookie should
    only be sent using a secure protocol, such as HTTPS or SSL |

    | boolean getSecure() | Returns true if the browser is sending cookies only over
    a secure protocol, or false if the browser can send cookies using any protocol
    |

    | void setValue(String) | Assigns a new value to a cookie after the cookie is
    created |

    | String getValue() | Returns the value of the cookie |

    | void setVersion(int) | Sets the version of the cookie protocol this cookie complies
    with |

    | int getVersion() | Returns the version of the protocol this cookie complies
    with |'
