    the JSP is shown in Figure 8.3. Note that the JSP compiler knows how to combine
    several data types. Lines 13 and 14 combine strings and numbers into a resulting
    string. Line 15 combines the individual values into a resulting number. This is
    all handled automatically by Java''s automatic casting mechanism.


    > New Term: Casting

    Casting is the process of transforming one data type into another. Throughout
    this hour, several examples have shown how numeric variables like integers and
    doubles are automatically converted to strings. This transformation is possible
    because Java has rules for how to transform or cast some types to other types.
    For strings, the casting implicitly is just a matter of the compiler calling the
    toString() method of the variable to its string representation. On other data
    types it is not simple; casting must be done explicitly. Consider a variable of
    type vector that can hold a collection of objects of disparate types. The objects
    are stored in the variable as type object since every object directly or indirectly
    in the vector information about their original type is discarded. The objects
    are retrieved from the vector variable, the objects must be cast back to their
    original data types explicitly. The casting cannot occur automatically (implicitly)
    because their original type was discarded when the elements were stored in the
    vector variable.


