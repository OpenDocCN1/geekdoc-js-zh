  md: '# Controlling JSPs with JavaScript Scriptlets


    # LISTING 9.1 Example of Using an if Statement (ifStatement.jsp)


    ```

    1: <HTML><HEAD><TITLE>Example Use of the If Statement</TITLE></HEAD>

    2: <BODY>

    3: % boolean userLoggedIn = false;

    4: boolean securityOn = true;

    5: if (userLoggedIn && securityOn) {%

    6:     <h1>Warning!</h1>

    7:     You have not logged onto the system.

    8:     <A>Please click here to log on</A>

    9: } %%

    10: </BODY></HTML>

    ```


    The actual code that would determine the real value of userLoggedIn in Listing
    9.1 would consist of some mechanism that compares the values of username and password
    of some user some database. Databases will be covered in Hour 17, "Accessing a
    Database from a JSP."


    An statement can be followed by an optional else statement to choose between two
    possible actions depending on whether the Boolean expression is true or false.
    When an else statement accompanies an if, it is often referred to as an if/else
    statement. Here is the syntax of the if/else statement:


    ```

    if(booleanExpression)

    javaCodeBlock1

    else

    javaCodeBlock2

    ```


    If the booleanExpression evaluates to true thenCodeBlock1 is executed, otherwise
    (else) javaCodeBlock2 is executed and execution continues after the if/else statement.
    Listing 9.2 is an example JSP that prints one of two messages depending on the
    user is logged in or not


    # LISTING 9.2 Example of if/else Statement (ifElseStatement.jsp)


    ```

    1: <HTML><HEAD><TITLE>Example Use of the If Statement</TITLE></HEAD>

    2: <BODY>

    3: % boolean userLoggedIn = true;

    4: % if (userLoggedIn) {%

    5:     <h1>Welcome!</h1>

    6:     You have successfully logged onto the system.

    7:     Please click <A HREF="home.html">here</A> to to continue

    8: } else {%

    9:     <h1>Warning!</h1>

    10:     You have not logged onto the system.

    11:     Please click <A HREF="home.html">here</A> to to log on

    12: } %%

