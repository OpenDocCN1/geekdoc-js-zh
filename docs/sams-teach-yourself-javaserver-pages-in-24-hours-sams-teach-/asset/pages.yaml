    # Understanding Overloading


    The names of declared methods need not be unique. What needs to be unique is the
    signature of the method. When you declare methods that have the same name, it
    is called overloading the method.


    > New Term: Method Signature

    The signature of a method consists of the name of the method as well as the parameter
    list and return data type.


    Listing 7.12 is an example of a method that has been overloaded.


    # Listing 7.12 overloading1.jsp—An Overloaded Method Declaration


    ```

    1: <%! int month = 1, day = 1, year = 2000;

    2: void setTodaysDate(int mm, int dd, int yyyy){

    3: month = mm;

    4: day = dd;

    5: year = yyyy;

    6: }

    7: void setTodaysDate(Date date){

    8: month = date.getMonth();

    9: day = date.getDate();

    10: year = date.getYear();

    11: }

    12: %>

    ```


    Note that both method declarations have the same name, (setTodaysDate()), but
    have distinct parameter lists. By the name of the methods, you can guess that
    the methods'
