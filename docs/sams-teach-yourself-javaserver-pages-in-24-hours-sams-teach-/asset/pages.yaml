    # HOUR 17


    # Accessing a Database from a JSP


    In this hour, you will learn how to connect to a database from a JSP. Java-based
    applications generally use JDBC (Java Database Connectivity) to access a database.
    Although there are entire books on JDBC and SQL, this hour will cover the basics
    that you need in order to use JSPs to interact with databases.


    I first give an overview of the basics of JDBC and SQL to create and connect to
    a database. I then explain how to use JDBC within a JSP to update and query a
    database. To illustrate the use of JSPs to access databases I provide an example
    of a database for tracking contact information. As a more advanced example, you
    will create a small online catalog that users can browse and search.


    The main topics covered in this hour are


    +   - Creating a database

    - Understanding Java Database Connectivity (JDBC)

    - Connecting to a database

    - Querying a database'
