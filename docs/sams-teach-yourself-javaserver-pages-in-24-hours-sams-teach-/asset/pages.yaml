  md: '# HOUR 20


    # Using Multiple JSPs to Handle the Request


    Many times you want to spread the work of your application among multiple JSPs.
    Perhaps you would have one JSP accept the request, parse through the request,
    and save the data to a JavaBean. The JSP would then forward the request to another
    JSP that takes the data out of the JavaBean and formats it in an easy-to-read
    fashion. Then again, maybe you want one JSP to look over the work of the other
    JSPs, so your primary JSP includes the output of other JSPs. You saw these scenarios
    in Hour 5, “Understanding the JSP Application Models,” but this hour is going
    to go into much more detail about these scenarios.


    In this hour you will learn


    +   - How to use the include action

    - How to use the forward action'
