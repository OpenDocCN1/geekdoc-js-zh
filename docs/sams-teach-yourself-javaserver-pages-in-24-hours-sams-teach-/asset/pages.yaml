    # Summary


    A Servlet is a Java class that accepts a request and generates a response. The
    Servlets that we are interested in are all HttpServlets. The HttpServlet accepts
    HTTP requests and generates HTTP responses. It is important to understand Servlets
    because they are the underlying implementation of JSPs. The correlation between
    the JSP code and the Servlet code will be pointed out throughout this book to
    deepen your understanding of JSPs.'
