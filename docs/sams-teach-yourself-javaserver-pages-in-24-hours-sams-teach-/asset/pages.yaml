    To understand how JSPs access a database, you first need to create a database
    to connect to. For the examples in this hour, I will use a simple database manager
    called Cloudscape that comes with the WebLogic Server 5.1 download. Cloudscape
    is also available as a free at www.cloudscape.com. Cloudscape is an all-Java database
    available in the WLS installation directory. If WLS version 5.1 has been installed
    (from this book CD-ROM) in D:\wls51\ then Cloudscape can be found in D:\wls51\eval\cloudscape.


    Version 2.0 of Cloudscape is implemented by three files located under the Cloudscape
    lib directory, D:\wls51\eval\cloudscape\lib. These are cloudscape.jar, client.jar,
    and tools.jar. These files need to be in your system CLASPATH environment variable.


    > ### New: CLASPATH Environment Variable

    The CLASPATH, like PATH, is an environment variable that contains paths or directories
    separated by semicolons. The CLASPATH is used by the JVM to search for classes.
    When you execute a Java class using the java command the JVM will search for the
    Java class in the directories listed in the CLASPATH. If the class is not found
    then the JVM will raise an exception informing you that it was unable to find
    the class.


    > There is a newer version of Cloudscape, 3.0, but this version does not come
    with WLS. If you get an evaluation copy or purchase it, read its documentation
    on how to install and use it.


    # Using Cloudscape’s Cloudview


    First, create a directory in to put all your work. Create a directory for this
    hour under the JSP directory you have been using for all the exercises and activities—for
    example, d:\wls51\myserver\public_html\myJSPs\hour17\.


    Start Cloudscape using the following command line at a DOS prompt:


    ```

    java COM.cloudscape.tools.cview

    ```


    This will start a Java application called Cloudview shown in Figure 17.1.'
