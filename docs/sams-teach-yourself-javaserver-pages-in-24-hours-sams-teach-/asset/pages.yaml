  md: '# HOUR 11


    # # Generating a Dynamic Response for the User


    Hour 10, “Processing Requests from the User,” explained how to process user requests
    using the request object. This hour will show how you use a response object to
    generate a dynamic response for the user.


    The topics covered in this hour are


    +   - Creating a response for the user

    - Generating dynamic tables

    - Generating dynamic HTML forms

    - Creating a configurable Web page


    # ## Generating Dynamic Content


    One of the main advantages of JSPs is the ability to generate dynamic content.
    JSPs generate dynamic HTML pages using Java control structures like for loops
    and if statements. For instance, a JSP can generate a fixed text message several
    times by wrapping the message with a for loop.


    ![](img/4df77e7d634c573982f3b815243f9fd2_163_0.png)'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'Similarly JSPs can generate tables with a dynamic number of rows and columns
    by wrapping the appropriate tags within an iteration. Forms can be generated dynamically
    following some logical layout.


    Generating dynamic content in Web applications is important when the content must
    reflect the most current and available data and personalized information. An example
    of such an application is an online stock portfolio. A stock portfolio allows
    users to keep track of their stock information, including options, stock listings,
    current stock prices, and comprehensive daily high and low prices. One of the
    typical Web pages of such an application might include a table that lists a variety
    of stock information in separate rows, generated by a JSP. Each stock would have
    a single row, and the information would be tabulated in columns. Every time the
    user comes to the page, the table will be different, because the JSP accesses
    the latest information and generates the table on-the-fly. The page might also
    provide links and buttons to edit the table, like deleting row, or sorting the
    table by column. Other examples of applications that use dynamic content include
    news outlets, weather information, and personalized Web sites.


    The following sections present how JSPs can be used to generate dynamic HTML.


    # Dynamic Titles


    Consider the simple task of generating a string repeatedly. This can easily be
    done by putting the string inside a loop.


