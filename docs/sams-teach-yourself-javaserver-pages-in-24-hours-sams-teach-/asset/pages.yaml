  md: '2. How would you create a Cookie called FavoriteColor with a value of Blue?

    Create an instance of the Cookie class with the constructor Cookie() and use as
    arguments "FavoriteColor", and "Blue". Then add the cookie to the response using
    its addCookie() method. Use the line below:

    response.addCookie(new Cookie("FavoriteColor", "Blue\));


    # Answers for Hour 13, "Configuring and Initializing JSPs"


    # Quiz


    +   1. How would you change the package name of a Servlet that is compiled from
    a JSP?

    You would use the -package option of the weblogic.jspc compiler.

    2. From a JSP how would you find the name by which the corresponding Servlet is
    registered in the configuration file?

    The method config.getServletName() returns the name under which the Servlet is
    registered with the application server.

    3. How would you list all the names of the initialization parameters from within
    a JSP?

    You would use the method config.getInitParameterNames() to get an Enumeration
    that contains all the names of the initialization parameters. You would iterate
    through the enumeration and print each element individually.


    # Answers for Hour 14, "Creating Error Pages"


    # Quiz


    +   1. What is the stack trace?

    The stack trace is a list of all the methods in a chain of nested method calls
    from where the first method called occurred all the way up to where an exception
    is thrown.

    2. How is a page declared to be an error page?

    A page is declared to be an error page by setting the isErrorPage attribute of
    the page directive to true using the following syntax:

    <% page isErrorPage=true %>'
  merge: -1
  pgno: 408
- img_proc: true
  md: '# Answers for Hour 15, "Inserting Applets into Your JSPs"


    # Quiz


    +   1. What tag is used to pass a parameter to the applet and what are its attributes?


    The param tag is used to pass a parameter to an applet. It takes two attributes,
    name and value. The attributes are the name of the parameter, as specified by
    the applet class, and the value you are assigning it.

    2. What does the codebase attribute specify?

    nThe codebase attribute is a URI that points to the location of the .class files
    for the applet.

    3. Why do you want to use the fallback tag?

    The fallback tag is used to specify text that will appear if the user does not
    have Java enabled on his browser. This is helpful for letting the user know that
    the page is supposed to contain.


    # Answers for Hour 16, "Using JavaBeans a JSP"


    # Quiz


    +   1. Describe each of the four JavaBean scope settings. What is each best suited
    for?

    The four javebane scope settings are:

    Page—JavaBeans of page scope are stored in the PageContext object and only available
    to the current page. Page scope variables are useful for short-term information
    that is not passed between JSPs.

    Request—JavaBeans of request scope are stored in the ServletRequest object and
    available to the called JSP and all included JSPs. Request scope objects are useful
    for term term.

    Session—JavaBeans of session scope are stored into the HttpSession object and
    can be used by all JSPs and servlets in the current request. Session scope objects
    are excellent for passing information between pages, JSPs, and other servlets.

    Application—Application scope objects are stored in the ServletContext object
    and are useful for storing global information, as how often a given page has been
    referenced. Note that you cannot be 100% accurate when using application'
