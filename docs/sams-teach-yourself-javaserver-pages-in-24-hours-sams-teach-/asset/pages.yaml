  md: '# HOUR 7


    # # Declaring Variables and Methods in a JSP


    This hour shows you how to declare variables and methods in a JSP. Although you
    are probably familiar with the Java programming language and how to declare and
    use variables and methods, this hour covers the basics to get you up to speed,
    so that you are able to work through the examples and activities. If you are a
    savvy Java programmer, you might want to skim through the next couple of hours
    just to familiarize yourself with the syntax of declaring variables and methods
    in JSPs.


