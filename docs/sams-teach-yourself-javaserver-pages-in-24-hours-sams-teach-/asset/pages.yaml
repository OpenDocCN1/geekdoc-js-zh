  md: '# Understanding the Layout of a JSP


    a lot of detail on the aspects of developing and using JavaBeans from a JSP but
    here are some of the highlights.


    # The Motivation Behind JavaBeans


    Since JSPs allow developers to mix HTML and Java code in one inherently incoherent
    reason, you might ask why we need JavaBeans at all. There is no reason that you
    should use JavaBeans. Technically, you could do all the work of a JavaBean in
    a JSP. The reality is that JSPs were designed to be the presentation layer. The
    presentation layer is the portion of an application (any application) that deals
    with the direct interaction with the user. This task is complex enough.


    There is still another complex aspect of developing applications: the computations
    and logic that must occur to fulfill some request from interaction with the user.
    The general rule of thumb gathered from the collective experience of science engineers
    in the field of developing applications is that it is best to divide the presentation
    layer and the computation or business logic. Sure, there is quite a lot of computation
    that goes on in a JSP. The computation in a JSP usually accomplishes some aspect
    of laying out the content of the page according to some parameters, dynamically
    including other pages, inserting messages, and creating HTML with a dynamic number
    of rows, all aspects of how data is handled by the user. The heavy computation
    that occurs behind the scenes should be handled by some dedicated computation
    mechanism like JavaBeans.


    There are, course, other computation structures for implementing business logic—like
    Enterprise JavaBeans, interfacing with some C++ DLL through JNI, and using RMI
    to use a remote device, for instance—but these escape the scope of this book.


    # The JavaBeans Specification


    The Java class that implements the JavaBeans will usually have a number of variables.
    These variables are referred to as the properties of the JavaBean. For each of
    the JavaBeans specification requirements, developers must provide matching set
    and get methods to set the value of the variable and get the value of the variable.
    The names of the methods are derived from the name of the variable, for instance
    if the variables name are then the name of the methods would be setABC() and getABC().
    Note the capitalization of the first letter of the variable in the name of the
    method.


    # Instantiating a JavaBean


    The JSP action tag <jsp:useBean> is used to instantiate a JavaBean. The following
    tag instantiates a JavaBean of the class Circle and associates it with the name
    circle in the JSP. The JSP then goes on to set and get properties of circle.


    ```

    <jsp:useBean name="circle" class="com.macmillan.jspIn24.hour@6.Circle">

    ```'
