  md: '# Substituting Text in JSP


    The include directive has one attribute, the file to include in the JSP, and it
    is a relative path to the file. The code from that file is inserted into your
    JSP, translated to the Servlet code, and then compiled and executed. Hour 20 will
    discuss the other method of including data, the include action.


    # Q&A


    +   **What is the difference between the include directive and the include action?**

    A The include directive allows you to insert pre-parsed text into your JSPs, while
    the include action inserts the output of other JSPs. The include directive looks
    at the included file as a static object; the include action sees the included
    file as a dynamic object that takes a request. You will examine the include action
    in Hour 20.


    +   **When is the code from the included file inserted into the JSP?**

    A code is inserted into the JSP at translation time. The include directive treats
    the included file as a static document and inserts the file’s code at the location
    of the include directive in the JSP.


