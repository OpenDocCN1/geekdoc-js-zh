  md: '# Understanding the Layout of a JSP


    # Writing HTML Code


    Usually Page developers use specialized software to create Web pages in standard
    HTML. Some of these tools are aware of other technologies that enhance HTML and
    provide some support for Java applets, JSP, and plug-ins. But for the most part
    the development of HTML consists of creating the static portion of the Web pages
    and determining which portion of the page is dynamic. The dynamic content is then
    implemented by inserting JSP tags.


    # Understanding JSP Tag Elements


    JSP tags allow Web page developers to dynamically generate pages using program
    logic. JSP tags come in two flavors: They can be created using several versions
    of the paired tags <% and or with XML equivalent tags <jsp:tagid> and </jsp:tagid>.


    > All JSP tags have an XML version and a shorthand equivalent. The XML version
    allows JSPs to be forward compatible with the industry’s fast adoption of XML
    as a standard. However, it is impractical to use XML until appropriate tools are
    available to easily create JSPs with XML. In the meantime, JSPs are still better
    developed by hand and the shorthand version of the tags are best.


    # Using the JSP Declaration Tags


    Declaration statements list variables and methods that are available throughout
    the rest of the JSP code. JSP declarations are created using the following JSP
    syntax:


    ```

    <!

    declaration_statement(s)

    %>

    ```


    or the XML equivalent


    ```

    <jsp:declaration>

    declaration_statement(s)

    </jsp:declaration>

    ```


    Listing 6.1 is an example of a JSP that declares two variables (variableA and
    variableB) and two methods (methodX(), methodZ()).


    # LISTING 6.1 A JSP that Declares Variables and Methods (declarations.jsp)


    +   1: <HTML><HEAD><TITLE></TITLE></HEAD>BODY

    2: <% String variableA = "This is a string variable"

    3: int variableB = 123;'
  merge: -1
