  md: '# Using Multiple JSPs to Handle the Request


    Keep in mind that both these actions are empty tags so don''t forget the forward
    slash / the end.


    # Q&A


    +   - **Q What are the pros and cons of using the two models discussed in this
    hour?**

    - **A The advantage of using both models is that you are separating the work of
    your application among multiple JSPs, thereby making your application more scalable.
    An advantage of the Including Requests Model is that one JSP is responsible for
    the request and generating the response, but it is able to take advantage of other
    JSPs to do the work. A disadvantage to the Forwarding Requests Model is that one
    is responsible for the request and another takes care of the response, thereby
    the workflow could get complicated in your application.**

    - **Q How many JSPs can be used in the application models discussed in this hour?**

    - **A Both models allow for many JSPs to be used. There is no limit to the number
    of JSPs that can be used, which means these application models allow for easy
    scalability to your applications. When you want to offer a new service, you just
    add another JSP.


