    The driver you are going to use for the Cloudscape database comes with WebLogic
    Server, although it is not optimized in any particular way to work with that.
    We will come back to the URL shortly in the section "Getting a Connection to the
    Database."


    ![](img/4df77e7d634c573982f3b815243f9fd2_264_0.png)


    There are four types of JDBC drivers, and the Column of Table 17.1 shows the type
    of each of the drivers listed. The type of a driver refers to whether it is an
    All-Java implementation (Type 4) or (Type 1 and 2) and whether it is meant to
    be used in a multier architecture (Type 3). The overhead of database driver is
    an All-Java implementation if it is (Type 4), it can run on any machine that has
    a Java Virtual Machine, it can be downloaded from the server so that the user
    always has the latest version of the application, and there is little to no administration
    at the local machine. The other, native drivers (Type 2) tend to be faster because
    they are optimized for the underlying machine architecture, but suffering from
    being configured for each individual machine; maintenance and upgrades are more
    difficult, too. In a multier architecture, a JDBC driver can be used by middleware
    software to optimize performance of the lifecycle management of connections (Type
    3). Creating and making connections is expensive in terms of the resources involved—that
    is, time and memory. Middleware software can create connections when an application
    is first started so the cost is incurred only once and connections can be reused
    and shared among a set of users. These are advanced topics that are better covered
    in an enterprise book that deals with the issues of designing and creating very
    large applications.'
