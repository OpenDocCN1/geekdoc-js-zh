  md: '# LISTING 3.2 continued


    ```

    12: </TR>

    13: <% // end for loop %

    14: </TABLE>

    15: </BODY>

    16: </html>

    ```


    You will be learning about the various tags used by JSPs throughout the book,
    but let''s take a moment and see what is happening in this JSP.


    Line 1 and 16 are the opening and closing <HTML> tags that specify this page to
    be an HTML document. Line 2 creates the head section of the document and creates
    a title to Powers of 2. The <BODY> tag starts on line 3 and closes on line 15,
    which wraps around the content of the page. Lines 4–6 create a heading on the
    page in level 2 heading that is centered on the page. The heading is Behold The
    Powers of 2. The output of this page is going to be a table, with the exponent
    in one column and creates a table, with a border of size 2 pixels that is raised
    to 2 exponent in the second column. Line 7 creates the for loop into the page.
    The table headers are created in line 8 using the <TH> tags.


    Now for the Java embedded in the HTML document. Line 9 uses a JSP tag called a
    scriptlet tag, <%, which is closed by %>. The scriptlet allows you to insert Java
    code into your JSP. Line 9 uses this tag to insert the for loop into the page.
    Hour 9, "Controlling JSPs with Java Scripts," will explain these tags in detail.


    During the for loop, this page creates rows in the table and adds the exponent
    number by the evaluation of 2, raised to the exponent. Line 10 creates the table
    row with the <TR> tag and specifies the first column to be the exponent, which
    is simply the value of the variable i. Notice there is a new tag setting the value
    of i; it is the scriptlet tag you saw in line 9. This new tag, <%= is called an
    expression tag. This allows you to insert a Java expression that will be evaluated
    and the result is inserted into your JSP. The expression tag will be covered in
    more detail in Hour 8, "Inserting Java Expressions in a JSP."


    After the exponent is inserted into the page, the power of 2 raised to the exponent
    is inserted, using the expression tags. This is shown in line 11. Line 12 ends
    the table-row definition. The for loop needs to be closed. The scriptlet tags
    can be used to insert the final curly brace to end the for loop. Line 13 contains
    this scriptlet.


    The output of the JSP can be seen in Figure 3.4.


    Now let''s look at the equivalent Servlet code. This is the code that will produce
    the same output as the JSP. Earlier you learned that JSPs are translated into
    Servlets. The JSP code would be translated to this Servlet code.'
