    # Iteration Control Structures


    Common solution to a great many problems consists of repeatedly applying some
    methodology to individual elements of an ordered data set. This action is called
    iteration. As a simple example, consider the problem of computing the total of
    the invoice whose items have an associated price. To compute the total you repeatedly
    accumulate each of the items one at a time. When you have iterated through each
    of the items, you will have computed the total.


    Java provides two basic types of iterative control structures. Their difference
    lies on whether the limit of the iteration is a known fixed limit or a conditional
    limit. Although each can be programmed to behave as the other, the syntax suggests
    their intended use. The for loop is mainly used to iterate through a fixed set
    of elements. The while loop and do/while loop are intended to iterate until a
    conditional statement determines the end of the loop.


    # Using for Loops


    for allows you to repeatedly execute a chunk of Java code a given number of times.
    The for loop typically uses a variable to keep track of the progress of the iteration.
    The variable is usually referred to as the "iteration variable" and the for loop
    iterates over the variable. The for loop initializes the variable, repeatedly
    updates the value of the variable at each iteration, and checks to see if its
    value has reached a specified bound. The syntax of a for loop is:


    ```

    for(initStatement; booleanExpression; updateExpression)

    javaCodeBlock

    ```


    The initStatement is a statement used to initialize the iteration variable, such
    as j=0. At the beginning of the iteration, the booleanExpression is evaluated.
    If the expression evaluates to true, the javaCodeBlock is executed once. After
    the javaCodeBlock, the javaCodeBlock is referred to as the body of the for loop
    consists of an arbitrary set of declarations that use the iteration variable to
    reference a particular element of some ordered set or data. The Boolean expression
    is usually used to determine whether the loop has reached its limit, for example
    j<=10. After booleanExpression is evaluated, updateExpression is evaluated to
    update the value of the variable you are iterating on, which is j+1. Listing 9.5
    is a simple example of a for loop that repeats an opinion of mine several times:'
