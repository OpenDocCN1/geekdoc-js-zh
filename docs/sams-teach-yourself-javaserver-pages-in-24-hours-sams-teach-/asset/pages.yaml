    defining the HTML document that get sent back, the users get responses that are
    tailored to their particular request. Remember our Marian and John? They both
    visited the same Web site, but Marian got information about flights to Florida
    and John got information for Hawaii. This was made possible by a CGI program accessing
    a database and executing queries.


    Another technology that was introduced in the Dynamic Web structure was client-side
    scripting.


