    # # Packaging and Deploying an Enterprise Application


    Your journey of JSP enlightenment has almost come to an end. However, there is
    one last part of the Husky World Human Resources Application project to complete.
    In Hour 21 you designed this human resources Web site to allow employees to change
    their current profiles, look at company policies, and look at their personal benefits.
    In Hours 22 and 23 you worked through the different scenarios of the Web site
    and implemented the application with HTML documents, JSPs, and a couple of JavaBeans.


    Now is it time to take that application and bundle it into a Web archive file.
    A Web archive file is a new concept defined in the Servlet 2.2 specification that
    describes how to bundle together a Web application into a single file that has
    a .war extension. The Web archive helps to organize your Web applications and
    to increase its portability.


    In this hour you will learn


    +   * What a Web Archive is

    * The directory structure of a Web archive'
  merge: -1
  pgno: 377
- img_proc: true
  md: '+   * How to create a Web archive

    * How to set up security on the project

    * How to deploy the Web archive


    # # What Is a Web Archive File?


    A Web archive file is made up of server-side resources that comprise a Web application.
    The resources that compose this application can include


    +   1. Servlets

    2. JavaServer Pages

    3. Static HTML documents

    4. Server-side classes

    5. Other resources specific to the application


    The Servlet 2.2 specification describes the directory structure for this application
    and how to bundle the files in the portable Web archive (.war) file. The .war
    file is portable because it can be deployed on any Servlet 2.2 compliant server,
    whether it is a Web server or an application server.


    Each Web archive file has a deployment descriptor that describes the resources
    that make up the Web application and how this should be deployed on the server.
    It can describe welcome files, the JSPs and Servlets that are part of the application,
    and security constraints.


    > New Term: Welcome File

    Welcome files are to greet users at a particular area on your Web site. This is
    the equivalent to the index.html file, in fact that is often the name of the file.
    If they don''t ask for a particular document, you want to send them a file to
    help navigate their way through your application. For example, if you request
    www.amazon.com, you are not requesting a particular file, but you get its home
    page. That is because Amazon has that file listed to be its welcome page.


    You can think of a Web archive as similar to a WinZip file. It is used to bundle
    together, or package, files.'
  merge: -1
  pgno: 378
- img_proc: true
  md: "# Packaging and Deploying an Enterprise Application\n\n# Setting Up the Directory\
    \ Structure for the Web Archive\n\nThere is a specific directory structure defined\
    \ for Web archive files. All of the resources that make up the Web application\
    \ are categorized in this directory structure. The root of the archive is the\
    \ root of the Web application. All files in the root of the Web application are\
    \ considered public and can be served to clients. Two directories are located\
    \ off the root directory: META-INF and WEB-INF. Files located under these two\
    \ directories are considered private files and cannot be served to clients.\n\n\
    Deployment descriptors are used to describe your Web application and the resources\
    \ that it contains. You always have one deployment descriptor, web.xml, and you\
    \ may have a second deployment descriptor, weblogic.xml, if you are deploying\
    \ in BEA's WebLogic Server. The web.xml file describes the resources in the Web\
    \ application, the welcome files, error pages, and security constraints. The weblogic.xml\
    \ file handles mapping of external resources such as EJBs. All deployment descriptors\
    \ are located under the WEB-INF directory. You will be writing the web.xml file\
    \ for the Husky Human Resource Web site later this hour. Since that application\
    \ does not access any EJBs, the second .xml file is not necessary.\n\nUnder the\
    \ WEB-INF directory is a subdirectory named classes. This directory contains server-side\
    \ classes such as Servlets, JavaBeans, and utility classes.\n\nAnother subdirectory\
    \ of the WEB-INF directory is lib, which contains any jar files used for the application.\n\
    \n> New Term: Jar File\nA jar file is a way to bundle Java classes together. This\
    \ is like a Windows zip file. The jar utility is a utility that bundles the files.\
    \ The jar utility is part of the Sun JDK. It is the same utility that you are\
    \ going to use to create the .war files.\n\nIt is time to create the appropriate\
    \ directory structure for the Husky Human Resources Web site. For this Web application,\
    \ create a directory called myWebApp under your c:\\ directory. Within the c:\\\
    myWebApp directory, copy all the HTML and JSP files from the human resources project.\
    \ The files should be located in c:\\weblogic\\myJSPs\\project. \n\n```\nAddNewEmployee.jsp\n\
    CompanyBanner.html\nHumanResources.html\n```"
