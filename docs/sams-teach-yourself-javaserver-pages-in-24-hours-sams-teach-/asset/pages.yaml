  md: '# HOUR 19


    # Extending JSP Functionality with Tag Libraries


    All of the action tags you have learned thus far have been predefined. In Hour
    15, “Inserting Applets into Your JSPs,” you saw how to use the plugin action to
    insert Java JavaBeans components into your JSPs. The useBean, setProperty, and
    getProperty actions were covered in Hour 16, “Using JavaBeans in a JSP?” Hour
    20, “Using Multiple JSPs to Handle the Request,” will discuss the include and
    forward actions.


    All of these actions allow you to perform standard tasks, but what if you often
    use a block of code that is not encompassed in one of these actions? What if you
    frequently dequeries on a database from within your JSPs? You would want to define
    your own action tags so you could employ those tags in your JSPs instead of using
    the code to access that database.'
