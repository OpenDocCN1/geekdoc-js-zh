  md: '# New Term: WLS instance


    When you started WLS running earlier, you started an instance of WebLogic Server.
    An instance is one particular running of WLS on a machine. It is possible to have
    multiple instances of WLS running on a machine.


    The lib folder contains the weblogicaux.jar file that includes all the J2EE classes
    from Sun Microsystems.


    WLS cannot be run without a valid license. There are two forms of the license:
    a Java class or an XML file. Either one can be used as long as it is valid. The
    license dictates how many clients can connect to your server, the database drivers
    you can use, and other aspects of WLS. A valid license to run WLS is on your CD-ROM.


    The myserver directory is your server-specific directory. In there is a weblogic.log
    file that contains all the text that was written to your screen when WLS started
    up. If an error occurred during startup, you can go to this file and read the
    description. The public_html folder in the myserver directory is where you place
    your HTML and JSP files. For with this book, you are going to create a directory
    under the public_html folder myJSPs and under that a folder for each hour, such
    as hour1, hour2, and so over hour19. You will need one folder called project for
