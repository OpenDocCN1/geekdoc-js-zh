  md: "# Answers for Hour 6, \"Understanding the Layout of a JSP\"\n\n# Quiz\n\n+\
    \   1. What are four of the implicit or built-in objects available to a JSP?\n\
    \   The implicit objects available to a JSP are request, response, session, out,\
    \ config, pageContext, application, and page.\n2. What is the JSP declaration\
    \ tag used for?\n   The JSP declaration tag is used to declare variables and methods.\
    \ These can then be referenced by their declared name or identifier throughout\
    \ the rest of the JSP source code.\n\n# Answers for Hour 7, \"Declaring Variables\
    \ and Methods in a JSP\"\n\n# Quiz\n\n+   1. What is method overloading?\n   Method\
    \ overloading consists of declaring several methods with the same name but different\
    \ signature. A method signature consists of the combination of the return type,\
    \ method name, and argument list. Method overloading is used to provide a functionality\
    \ without limiting the type of the input data needed to provide the functionality.\n\
    2. What is a data type?\n   A data type is a classification of the format of data\
    \ and its characteristics. The characteristics of a data type consists of the\
    \ format for representing the data in memory, the value of the data and the operations\
    \ that can operate on the data.\n3. How are Enumerations and Vectors related to\
    \ one another?\n   Enumerations and Vectors are both collections of objects. They\
