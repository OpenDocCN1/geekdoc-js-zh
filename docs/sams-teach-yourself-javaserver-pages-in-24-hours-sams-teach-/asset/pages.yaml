  md: 'Later hours will show how to control the overall layout of a Web page using
    Java control and decision structures.


    The following topics are covered in this hour:


    +   * Understanding the JSP expression tag

    * Referencing variables from a JSP expression

    * Calling local methods from a JSP expression

    * Calling methods on a JavaBean for a JSP expression

    * Overriding the toString() method


    # The JSP Expression Tags


    JSP expressions are pieces of JSP code that can be evaluated to strings and be
    interlaced within HTML code. JSP expressions are declared using the syntax:


    ```

    < expression %>

    ```


    The equal (=) in the left tag means the expression expression should be evaluated
    and the tags should be replaced with the string equivalent of the resulting value.
    Consider the following JSP code:


    ```

    <! int kids = 2 %>

    Dante has <%= kids %> kids

    ```


    The code above evaluates the string Dante has 2 kids. In this case the expression
    happens to be a simple reference to a variable which evaluates to 2.

    The expression inside the tags can be arbitrarily complex, and the result is ultimately
    converted to a string representation. Expressions can be a combination of the:


    +   *1. Numeric and string literal values like 2 and “hello"

    *2. Mathematical operators as +, -, *, and /

    *3. Variables of primitive data types

    *4. Object instances of a custom class

    *5. Local method calls declared in the JSP

    *6. Method calls of an object created from a custom class


    The following sections provide examples that utilize all of the elements.


    # Referencing a Variable from an


    The JSP in Listing 8.1 declares several variables of different primitive data
    types. The JSP compiler knows how to convert primitive data types to a string
    representation.'
