- img_proc: true
  md: '# LISTING 6.1 continued


    ```

    4: int methodX(int newInteger{

    5: variableB = newInteger;

    6: return variableB;

    7: }

    8: String methodZ(String newString){

    9: variableA = newString;

    10: return variableA;

    11: %%

    13: </body></HTML>

    ```


    This JSP declares a string variableA and sets its value to *This is a string variable*
    in line 2. It then declares an integer variable, variableB, and initializes it
    to 123 in line 3. Lines 4–6 declare methodX(), which takes an integer as an argument,
    modifies the value of variableB, and returns its value. Lines 8–11 declare methodZ(),
    which takes a string as an argument, changes the value of variableA, and returns
    its new value.


    When the JSP is rendered by the browser, it does not generate any output. The
    variables and methods do not get evaluated until they are referenced from it by
    a JSP expression tag or a scriptlet tag. The following two sections introduce
    these tags, “Declaring Variables and Methods in a JSP” covers declarations in
    more detail.


    # Using JSP Expression Tags


    Expressions are a combination of constants, references to variables and methods
    with operators. Expressions are evaluated to a single value by evaluating the
    individual elements in the expression and combining them to the operators.


    Expressions can exist inside JSP scriptlets or on their own in a JSP expression
    tag. If in a scriptlet, expressions are usually part of an assignment statement
    or method call. That is, the expression is evaluated and assigned to some other
    variable or passed on some method. When they are in a tag, the expressions are
    evaluated, their result converted to a string representation, and the strings
    are included in the resulting HTML code generated by the JSP.


    The syntax for declaring a JSP expression tag is


    ```

    <%= expression %>

    ```


    or, using the XML equivalent

    <jsp:expression> expression </jsp:expression>'
