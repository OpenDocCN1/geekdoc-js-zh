  md: '# Introduction to Servlets


    FIGURE 3.1

    The lifecycle of JSPs/Servlets is pretty straightforward.


    ![](img/4df77e7d634c573982f3b815243f9fd2_55_0.png)


    You start with a JSP or a Servlet class. The server is responsible for instantiating
    the JSP/Servlet and uses the new() method to accomplish this. This new() method
    is the Java method for creating space in memory for an object.


    After the JSP/Servlet is instantiated, the init() method is invoked for initialization
    purposes. The init() method will be looked at in more detail in a few minutes.


    The JSP/Servlet moves to the Ready state and is prepared to handle client requests.
    You can write a service() method to handle your business logic or write a doGet()
    or doPost() method for your business logic. These methods will be discussed shortly.


    The JSP/Servlet is destroyed when the destroy() method (container invoked). The
    garbage collector finally comes and cleans up the memory with the finalize() method.


    # The JSP Translation Process


    The JSP is translated into the Servlet code, which is a .java file. Many applications
    serve the option of keeping the generated .java files. Once it is translated into
    the .java file it is compiled into the bytecode file (.class). The .class file
    is executed and the output HTML document is generated and sent back to the client.
    Figure 3.2 shows a diagram of this process.


    You may think that this is a large process and the performance will take a large
    hit. Well, after the first invocation of a JSP, subsequent requests will not go
    through the translation phase but will go to the already compiled .class file.
    Many applications allow you to dictate how long an application server should wait
    before it checks if your JSP has changed and needs to be recompiled. Many applications
    also provide a compiler for JSPs so the first hit on the JSP will not notice a
    performance decrease.'
