    # What Are Application Servers?


    Application servers are pieces of software that handle the processing of programs
    and applications. The application server can handle larger processing chores than
    a Web server. Large applications that exist on application servers could consist
    of EJBs, Servlets, and JSPs.


    # The Need for an Application Server


    Recall from the discussion of the N-tier architecture the advantages of separating
    the workload between a Web server and an application server. The Web server can
    focus on serving Web pages so it can optimize the process. The application server
    can then concentrate on serving applications so it can provide many primary services
    that applications need, such as transactional support, security, and persistence
    to a database. With the application server handling these services, the application
    can focus on the business model.


    # What Does It Mean to Be Compliant with the J2EE?


    A compliant application server supports all the technologies defined in the J2EE.
    This helps developers because they can write applications to the specification
    and choose what application server to deploy on. An application written to the
    specification can be deployed on various compliant application servers without
    modifying code. It is valuable because you do not get locked into one vendor.
    As the technology changes and application servers change, know that you can change
    your application server to fit your needs and you don''t have to change your code.


    # A Listing of Application Server Vendors


    More and more vendors are coming out with application servers. If you write your
    applications to the specification, you will be able to change vendors to suit
    your needs. Table 1.1 lists some of the application vendors available to you.'
