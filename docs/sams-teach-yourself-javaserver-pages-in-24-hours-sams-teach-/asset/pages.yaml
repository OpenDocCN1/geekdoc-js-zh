  md: '# APPENDIX A


    # Answers


    Answers for Hour 1, “Introduction to Web Applications”


    Quiz


    +   1. What are the four types of Web structures?

    The Static Web, the Plug-In Web, the Dynamic Web, and the N-tier Web.

    2. Why are there so many parts to the N-tier Web?

    So that each part can concentrate on its responsibilities and optimize them as
    much as possible. It follows the philosophy: Do one thing and do it well.

    3. What are the two types of client-side scripting languages, and what can they
    do?

    JavaScript and VBScript are the two types of client-side scripting languages.
    They allow small business applications, such as form validation, to run on the
    client.'
