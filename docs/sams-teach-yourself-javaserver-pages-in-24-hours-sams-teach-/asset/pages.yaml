  md: '# Implementing Error Pages


    An error page is an additional mechanism for processing exceptions when developing
    Web applications. An error page is a Web page that can be used to inform the user
    of errors and/or document errors that occur in a Web application. It can be used
    as a catch-all page that could handle unexpected behaviors of the application.
    For instance, an error page could be defined to handle stale URLs so that if customers
    click on a link to a page that does not exist anymore, the error page would politely
    inform the user. This is in contrast to the very rude error message 404, Page
    Not Found.


    # Determining the Error Page


    Error pages are declared and referenced from JSPs using the errorPage attribute
    of the JSP using the following syntax:


    ```

    <@ page errorPage="someErrorPage.jsp %>

    ```


    A typical arrangement is to have several related JSPs refer to a common error
    page. If any of the JSPs encounter a problem where an exception is thrown, the
    error page will be shown. The error page should be smart enough to be able to
    handle errors from several pages and the pages should be related enough to justify
    a common error page.


    The JSP in Listing 14.7, login.jsp, uses a form to gather login information and
    sends the request to goodlogin.jsp (Listing 14.8). goodlogin.jsp uses JavaBean
    UsernameValidationBean (Listing 14.9) to validate that the username is at least4
    characters long. The JSPs of Listings 14.7 and 14.8 declare login.jsp as their
    error page. If any reason an exception is thrown within login.jsp or goodlogin.jsp,
    the JSPs will redirect the browser to goodlogin.jsp.


