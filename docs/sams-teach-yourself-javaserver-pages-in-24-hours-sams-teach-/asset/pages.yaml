  md: '# Configuring Application Servers


    Congratulations on running your first JSP on BEA WebLogic Server.


    # Summary


    In this hour you got to work with the most popular application server today, BEA
    WebLogic Server. Throughout the rest of this book you can run your JSPs on WLS
    or Apache’s Tomcat. The rest of the examples in the text and the URLs that are
    shown are running on BEA WebLogic Server.


    # Q&A


    +   - Which server should I use for the rest of the book?


    +   - The examples you see are going to be run on BEA WebLogic Server. You can
    run your code on whichever you prefer. Since WLS is the most popular application
    server you may want to get experience using it. Also, Tomcat is not a production
    server, it does not provide security and Servlet loading. The final project will
    be on WLS, so you can set security on the Web application.


    +   - What directory structure should I use if I am using Tomcat?


    +   - If you decide to use Tomcat for some of the examples, you will want to use
    the directory structure c:\tomcatwebapp\myJSPsHourXX. This type of directory structure
    helps you keep your files organized.


    +   - Does it matter where I register the Servlet and configure its initial arguments
    in the weblogic.properties file?


    +   - No, it does not matter. You can register the Servlet anywhere and configure
    the initial arguments anywhere. If you put your configuration and arguments at
    the top of the file, it will be easy for you to locate them.


    # Workshop


