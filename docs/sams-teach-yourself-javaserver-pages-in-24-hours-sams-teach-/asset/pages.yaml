  md: '# Creating a Presentation Layer 325


    Line 6 uses the page directive to import a Java package into your code. Java places
    similar classes into packages as a way of keeping similar classes together. Since
    this JSP is going to be doing database access, you need to import the appropriate
    files from the java.sql package; therefore it is much simpler to import all the
    classes from that file.


    Lines 8–12 write the heading for the page—the purpose of the page—so users know
    what they are looking at. At this JSP is going to output the benefits the company
    offers. Therefore, the heading is Health, Vision, and Dental Plans.


    Line 14 begins a table that formats the output of the insurance benefits.


    Lines 15–18 are the headings for the columns in the table. The information from
    the database will be the plan''s name, the deductible, and the percentage of coverage
    for doctors in the plan and doctors out of plan.


    It is time to connect to the database, and the first step is to declare what driver
    you are going to use. Since this application is using cloudscape the driver is
    COM.cloudscape.core. Line 20 declares this driver as the driver to use.


    Once the driver is declared, you need to get a connection to the appropriate database.
    Lines 21–22 retrieve a connection to a database called HumanResourcesDB that is
    located in the root c:\ directory. To get to a database use the DriverManager
    class, found in the java.sql package, and its method getConnection(...). A parameter
    to the getConnection(...) method is a URL to the database. For this it is jdbc:cloudscape:\HumanResourcesDB.


    Line 23 creates a statement that you can execute SQL statements on your database.
    Line 24 creates a SQL string, a simple SELECT statement that selects all elements
    of the out table BENEFITINFO.


    Line 25 executes the query and captures the result in a ResultSet object. This
    object can be looped through to get all the information from the database object.
    A while loop is used to go through the elements in the ResultSet object the while
    loop you are going to create a new row in the table and output the plan name,
    deductible, and the percentage covered for doctors in the plan and doctors out
    of the plan. Lines 28–31 are the lines that get to insert the values from the
    ResultSet into the HTML table.


    Lines 34–37 test if the statement and connection are open and close them if they
    are open. Remember it is always good practice to close your statements and connections.


    Line 41 includes the SiteNavigator.html file at the bottom of the JSP. Figure
    22.4 shows the output of the PresentCompanyHealthInfo.jsp jsp.'
