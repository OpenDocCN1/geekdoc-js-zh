  md: "To implement the for loop using a while, all the actions taken by the for loop\
    \ must be implemented. The initialization of the iteration variable can easily\
    \ be accomplished right before the beginning of the while loop. The updating of\
    \ the iteration variable can be done at the very end of the loop. The conditional\
    \ can be implemented in the while's conditionalExpression. The following is a\
    \ generic while statement that implements a generic for loop:\n\n```\ninitStatement;\n\
    while(conditionalExpression){\n  ...\n  javaStatements\n  updateStatement\n}\n\
    ```\n\nSo the following for loop:\n\n```\nfor(int i=0; i<=10; i++)\n  out.println(\"\
    JSPs are great\");\n```\n\nhas the following implementation with a while statement:\n\
    \n```\nint i=0;\nwhile(i<=10){\n  out.println(\"JSPs are great\");\n  i++;\n}\n\
    ```\n\n# Answers for Hour 10, \"Processing Requests from the User\"\n\n# Quiz\n\
    \n+   1. What are the methods used to process parameters in a query string?\n\
    nThe methods used to process parameters in query string are\n* String getParameter(String\
    \ paramName)\n* Enumeration getParameterNames()\n* String[] getParameterValues(String\
    \ paramName)\n\n+   2. What are the different parts of a URL?\nThe different parts\
    \ of a URL are the protocol, the server machine, the port, the virtual path, and\
    \ the query string."
