    they were compiled to your machine language. Dynamic HTML documents were introduced
    with the Dynamic Web because CGI programs were on the server dynamically creating
    HTML documents based on the user''s query. Client-side scripting was introduced
    in the Dynamic Web as a way to take some of the workload off the server'
