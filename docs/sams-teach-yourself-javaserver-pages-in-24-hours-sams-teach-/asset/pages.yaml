  md: '# Introduction


    Welcome to Sams Teach Yourself Java Pages in 24 Hours!

    You have decided that you want to learn how to write JavaServer and Java. Well,
    you have come to the right place. This book introduces you to the basics of JSPs,
    such as their structure, their application models, and how they can be used to
    create dynamic content on the Web. You will also learn about some advanced topics
    such as connecting to a database from a JSP using JavaBeans to access a database.
    Finally, you are going to write a Web application that models a human resources
    Web site for a company''s intranet. Sound like a lot? It is, and you will accomplish
    it all in 24 one-hour lessons. Good luck, work and have fun.


    # Who Is This Book''s Intended Audience


    This book is aimed at individuals who are familiar with HTML and Java. You do
    not need to be an expert in HTML, but you should be familiar with the common tags
    and be able to create a simple HTML document. Also, you do not need to be an expert
    Java programmer, although experience with programming in any language will help
    you work through the activities.


    # What You''ll Learn in the Next 24 Hours


    You will learn what JSPs are and how they fit into Sun Microsystems Java 2 Enterprise
    Edition Platform. You will also see how JSPs compare to other similar technologies
    such as CGI programs and Active Server Pages (ASPs).


    First, we will show you the basics of JSPs, such as the tags that allow you to
    embed Java in HTML pages and how to divide the work among several JSPs. This book
    also goes into advanced features such as connecting to a database from your JSP,
    using a JavaBean or server-side class, and extending the functionality of your
    JSPs using a custom tag library. You will complete the book with a project, writing
    a human resources Web site for a company''s intranet. There is a lot to do, so
    buckle up and enjoy the ride.


    # What You Need


    There are a few things you need before starting your journey. You need a text
    editor, such as Notepad in the Windows operating environment. You also need a
    Java Development Kit, JDK, from Sun Microsystems. The JDK can be downloaded from
    Sun''s Web site,'
