    # Understanding JavaBean Scope


    The scope of a JavaBean refers to the lifespan of a JavaBean after it has been
    instantiated.

    The scope of a JavaBean ranges from the lifetime to the lifetime of the execution
    application server. The scope is set using the scope parameter of the <jsp:useBean>
    tag with the syntax:


    ```

    <jsp:useBean id="beanName" class="beanClass" scope="beanScope">

    ```


    beanScope can take one of these four values: page, request, session, or application.'
