  md: "# Using Forms with JavaBeans\n\nHTML forms are used to gather information from\
    \ users, and that information is, in general, delivered to JSPs in the form of\
    \ name/value pairs in the request object. For instance, a form may be gathering\
    \ information about a user, such as his name, address, and salary. The form sends\
    \ this information to a JSP as several unrelated name/value pairs in the request\
    \ object.\n\nJavaBeans can be used to group the disparate values of the request\
    \ parameters into a cohesive and logical unit. This can be accomplished by extracting\
    \ the values of the parameters in the request object sent by the bean and setting\
    \ the properties of an appropriate JavaBean.\n\nTo set the properties of a JavaBean\
    \ with the parameter values in a request object, you normally have to extract\
    \ every single parameter value and use the following tag for each of the properties\
    \ of the JavaBean that you want to set:\n\n```\n<jsp:setProperty name=\"beanName\"\
    \ property=\"parameter1\" value=\"${request.getParameter(\"parameterA\")}\" />\n\
    ```\n\nThe strings parameter1 and parameterA are not necessarily the same. If\
    \ there are a lot of properties to be set, this can get quickly out of hand.\n\
    \nThe <jsp:setProperty> tag provides a special syntax that can be used to set\
    \ the properties of a JavaBean with the field values of the HTML form all at once.\
    \ The syntax is as follows:\n\n```\n<jsp:setProperty name=\"beanName\" property=\"\
    *\" />\n```\n\nNote the asterisk (*) as the property. This syntax means that all\
    \ the properties of the JavaBean whose name match the parameter name in the request\
    \ object should be set to the values of the parameters in the request object.\n\
    \nThis means instead of going through each of the properties of the JavaBean,\
    \ a single tag can set all of the properties. This only works if the name of the\
    \ parameter and the name of the properties are the same. For example, if a form\
    \ declares two fields as:\n\n```\n<FORM>\n  <INPUT NAME=field1 ...>\n  <INPUT\
    \ NAME=field2 ...>\n</FORM>\n```\n\nand the JavaBean complies with JavaBean specification\
    \ as follows:\n\n```\npublic class SomeJavaBean {\n  String field1, field2;\n\
    \  public SomeJavaBean() {\n```"
