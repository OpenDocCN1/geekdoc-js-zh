    # Answers for Hour 18, ”Substituting Text

    in a JSP””


    # Quiz


    +   1. What is the general syntax of the include directive?

    <%@ include file="Relative_URL_and_Filename" %>

    2. When using the include directive, how is the text of the file included?

    The text is inserted into the JSP at translation time. If it is a JSP or an HTML
    doc-\ment, the code is inserted at the location of the include directive.

    3. How do you specify the filename and location of the included file?

    The file attribute of the include directive specifies the filename and location
    of the

    included file. Remember that it is a relative location—relative to the JSP, that
    is.'
