  md: '# Understanding the session Object


    HTTP is a stateless protocol and therefore a JSP is not able to remember anything
    specific about a particular client. However, the session object together with
    cookies allows JSPs to associate information that is specific to a unique client
    request. The session object implements the HttpSession, which is also accessible
    through the request object. Methods of the session object allow you to bind objects
    to string names so that the objects can be retrieved by name several interactions
    with client browsers. Hour 12, “Keeping Track of the User Session,” shows examples
    of how to use cookies to remember user preferences and how to use the session
    object to keep track of the content of a shopping cart.


    # Understanding the config Object


    The config object implements the javax.servlet.ServletConfig interface. The config
    object gives access to configuration data for initializing the JSP. Hour 13, “Configuring
    and Initializing JSPs,” will cover the config object in detail.


    # An Overview of the Other JSP Built-in


    The other objects available in a JSP—out, pageContext, application, and page—will
    be covered throughout the book with no specific hour devoted to them. A short
    description of each follows.


    The out object is an instance of the class javax.servlet.jsp.JspWriter and provides
    methods to generate output to the browser as well as methods to control the behavior
    of the output generated.


    The pageContext object is an instance of the class javax.servlet.PageContext.
    This gives access to several page attributes and allows you to forward or include
    the request object or from other application components.


    The application object implements the javax.servlet.ServletContext interface for
    communicating with the servlet container. The servlet container manages the lifecycle
    and information of all Servlets.


    The page object represents the servlet instance generated from having compiled
    JSP. It is essentially equivalent to the keyword in this Java; that is, a reference
    to the current instance you are.


    # Understanding JSPs and JavaBeans


    JavaBeans are Java classes that adhere to the JavaBean specification. This establishes
    guidelines for developing code that is easy to use as modular functional blocks
    in a variety of scenarios. Hour 16, “Using JavaBeans in a JSP,” will go into'
