    # do/while Loops


    The do/while loop is very similar to the while loop. Like the while loop, do/while
    allows you to define conditional iterations of a block of Java code. Unlike the
    while loop, do/while loops check whether continue looping at the end of the loop
    instead of at the beginning of the do. This is quite useful when the iteration
    normally execute at least once. The syntax of the do/while loop is


    ```

    do javaBlock while(booleanExpression)

