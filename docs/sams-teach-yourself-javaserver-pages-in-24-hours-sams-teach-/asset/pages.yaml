  md: '![](img/4df77e7d634c573982f3b815243f9fd2_147_0.png)


    # HOUR 10


    # # Processing Requests

    from the User


    In this hour you will learn how to gather and process user requests. User requests
    consist of messages that contain information that can be gathered about users
    and their interaction with the browser. Requests are generated by the browser
    and sent to the JSP for a result of actions taken by users as they interact with
    the browser—for example, clicking a hyperlink or submitting a form. The information
    in a request contains information about the remote and local machine, HTTP headers,
    the invoking URL, hard-coded parameters in the Web page, and HTML form fields.
    All this information is accessible by the JSP through the implicit request when
    the JSP is invoked.


    First, you will learn the details of how requests are represented and how they
    are created. The information contained in a request is categorized, and then you
    see the API used to access the information. You will also learn how to process
    the invoking URL and extract path information. Next, you''ll see how to obtain
    meta information about the request itself and the machines involved in the request.
    Finally, you will look at how to use HTML forms to generate and process requests
    with parameters.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Understanding User Requests


    This hour covers:


    +   - Understanding the ServletRequest and HttpServlet interfaces and the implicit
    JSP request object

    - Creating a request

    - Parsing the invoking URL

    - Obtaining server information

    - Creating and parsing a query string

    - Declaring HTML forms

    - Processing HTML forms


    A user request consists of information that a client provides to a JSP. As you
    may remember from Hour 3, "Introduction to Servlets," user requests are represented
    in a JSP by two interfaces: ServletRequest and HttpServletRequest.


    The ServletRequest models user requests that do not depend on the underlying protocol
    or infrastructure used to communicate the requests. The functionality provided
    by the ServletRequest interface includes


    +   - Providing access to attributes and parameters

    - Obtaining information about the remote and local machines and protocol being
    used

    - Obtaining information about the content of the request


    ServletRequest attributes are usually used when reducing a request to another
    JSP in conjunction with the RequestDispatcher interface. Attributes and the RequestDispatcher
    interface are covered in Hour 20, "Using JSPs to Handle the Request,"


    The HttpServletRequest extends ServletRequest, adding functionality that assumes
    the underlying use of the Hypertext Transfer Protocol (HTTP). The HttpServletRequest
    interface adds the following functionality:


    +   - Provides access to HTTP headers

    - Provides access to user session information with cookies, URL encoding, and
    the HttpSession interface

    - Allows parsing the invoking URL

    - Allows managing user security


    From within a JSP, the implicit request object implements the HttpServletRequest
    interface. The JSP uses the request object to obtain information from the browser,
    cookies, headers, and user session.'
