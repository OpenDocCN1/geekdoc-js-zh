    The continue statement is a close relative of the break statement. It is used
    only in loops. Like the break statement, continue is used to break the normal
    flow of execution by jumping to the end of the code it is. Unlike the break statement,
    the continue statement does not leave the block; rather, it forces a new iteration.
    Listing 9.8 is an example that illustrates the continue statement.


