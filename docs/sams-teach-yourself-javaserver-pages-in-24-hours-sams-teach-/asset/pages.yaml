    # Dynamic Forms


    HTML forms can be generated dynamically by following some layout specification
    that a JSP code can use to create the form. This is especially useful when forms
    are used to gather information from a collection of data or a sequence.


    An example of dynamic forms, together with dynamic tables, is an online shopping
    cart. A shopping cart lists the items a user intends to purchase and information
    such as individual prices, short descriptions, quantities, subtotals, and grand
    total of the purchase. The shopping cart can be created by combining HTML forms
    and tables. The table would be used to populate the items in separate rows, with
    the information for each item filling different columns. The form would be used
    to gather the quantities for each item, so that'
