    # HOUR 12


    # Keeping Track of the User Session


    Many Web sites depend on keeping track of individual user information and user
    state. HTTP is the protocol responsible for transporting Web pages and requests
    back and forth between client browsers and servers. HTTP is not equipped to maintain
    state information of the clients. Several alternatives such as cookies and user
    sessions have been devised to circumvent this problem. This hour presents three
    mechanisms that JSPs provide to maintain a stateful interaction through the use
    of cookies, session objects, and URL encoding.


    The topics covered in this hour are


    +   * HTTP as a stateless protocol

    * Storing and retrieving cookies

    * Using the user session object

    * URL encoding'
  merge: -1
