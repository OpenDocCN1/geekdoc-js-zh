    +   2. How can JavaBeans be used with HTML forms?

    The setProperty tag has a special syntax that allows you to initialize

    JavaBeans with parameter values in an HTML form. The syntax of the

    setProperty tag for HTML forms is

    <jsp:setProperty name="theJava" property="*">

    The tag automatically extracts the parameter values from an HTML form and ini-

    alizes the variables of theJavaBean. For this work, the names of the variables

    and the names of the form inputs must be the same.


