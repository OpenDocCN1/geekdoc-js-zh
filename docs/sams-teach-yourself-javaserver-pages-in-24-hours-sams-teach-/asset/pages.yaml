  md: '# Understanding the Layout of a JSP


    and interact with a Java plugin. There are six JSP action tags: useBean, setProperty,
    getProperty, include, forward, and plugin.


    As an example, the following action instantiates a JavaBean implemented by the
    class ShoppingCart in the package com.macmillan.jsp24.hour16 and associates it
