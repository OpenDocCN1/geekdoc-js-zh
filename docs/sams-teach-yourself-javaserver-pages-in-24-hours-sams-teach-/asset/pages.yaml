  md: '# Creating Error Pages


    Several examples showed you how to create and raise custom exceptions. The examples
    covered several combinations of throwing and raising exceptions in JavaBeans and
    JSPs.


    # Q&A


    +   - Would exceptions would be useful in validating parameters from a form? How
    would that be done?

    - Exceptions would certainly be useful in validating parameters submitted with
    forms. To process the parameters you would need to enumerate the fields of the
    form and the ranges or policies of each field. If the values of the submitted
    fields don''t match the ranges or policies for the fields, an exception would
    be raised. The exception could contain an enumeration of the fields that had trouble
    and a message politely asks the user to complete the highlighted fields appropriately.
    The enumeration of the troubled fields would be used to highlight the fields by
    either bold them or setting their color to red.

    - The examples in this hour showed exceptions being instantiated with a string
    message. Is this the only thing that an exception has to inform the user of the
    problem?

    - Custom exceptions can have constructors with as many extra parameters as you
    see necessary. In any case the first thing any constructor should do is invoke
    super()` to set the error message. After that you can set the data from the arguments
    to the constructor.


