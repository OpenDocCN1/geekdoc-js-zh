    # # HOUR 13

    # Configuring and Initializing JSPs


    A Web application often needs to carry out tasks that are best accomplished when
    the application is first started up. Initialization parameters are used to configure
    the behavior of JSPs as they first execute. This hour will teach you how to configure
    JSPs to handle start-up procedures.


    In this hour you will learn about


    +   - Registering and initializing JSPs

    - Compiling JSPs into Servlets

    - Using the config objects

    - The ServletContext objects


    # ## Understanding the Registration and Initialization of JSPs


    Real-life applications usually have to interact with complex systems like databases,
    other machines, and services. These systems usually have a setup'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'overhead where the systems need to learn about one another, register, and agree
    on the services and protocols that will be used. These overheads are best hidden
    from the users since they would be perceived as an overall degradation of performance.
    Setup overheads are usually best handled when applications start up and are configured
    with special initialization parameters.


    This hour shows how to configure JSPs by using parameters that are available when
    the application first boots. Boot time is the best time for JSPs and other application
    components to accomplish tasks that take a long setup time, like initializing
    and connecting to databases or connecting to other computers.


    JSPs cannot be configured or initialized directly. Instead, they must be converted
    into their equivalent Servlets and then registered and configured by weblogic.properties
    file. Registering and initializing a JSP usually consists of the following steps:


    +   1. Write the JSP as you would any JSP. Optionally, the JSP may use the implicit
    config object to read and process initialization parameters.

    2. Compile the JSP into a Servlet using the JSP compiler and placing the class
    in an appropriate directory that the application server can find.

    3. Register and name the Servlet with the application server using the appropriate
    configuration file. You can declare the initialization parameters in the configuration
    file.

    4. Execute the Servlet using a URL that points to the named Servlet. You can use
    extra path information and query strings as would with a JSP.


    Parameterization of JSPs is useful because it allows you to configure the behavior
    of JSPs without having to change the source code. This makes the JSPs more portable
    and reusable across applications.


    The next few sections present an example JSP that prints out all of the initialization
    parameters. The process of compiling a JSP into an equivalent Servlet is detailed.
    Then the registration and initialization are presented. And finally the API for
    the config object is covered.


    # A Simple JSP that Prints All Initialization Parameters


    The initialization parameters consist of a set of name/value pairs. The parameters
    are accessed through the JSP implicit object config, which will be covered in
    detail later in this hour. The config object provides methods to get all the parameter''s
    names, getInitParameterNames();values of a given parameter, getInitParameter();
    and other less-used methods.'
