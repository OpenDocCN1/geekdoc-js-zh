  md: '# Hour 6


    be HTML tags or JSP tags. This hour provides some general information and conventions
    about JSP tags and their attributes that you will find useful throughout the book.


    # Understanding Single and Paired Tags


    Like HTML, JSP tags can be single tags or paired tags. An example of a tag that
    has both versions and is used lot throughout the book is <jsp:useBean>. As a single
    tag it can instantiate a Java class and associate it to name. Here is an example
    of its use as a single tag:


    ```

    <jsp:useBean name="MyClass" class="SimpleClass" scope="page"/>

    ```


    As a single tag, <jsp:useBean> succeeds in instantiating the class or not. If
    the tag fails to instantiate the exception then the name is used to reference
    the instance, it is likely that a null pointer will be thrown. The paired tag
    version allows you to execute code contingent on the successful instantiation
    of the Java class. Here is the paired tag version of the <jsp:useBean> tag:


    ```

    <jsp:useBean...>

    ...some HTML or JSP code...

    <jsp:useBean/>

    ```


    Many HTML and JSP tags have the same configuration that they can be used as a
    single tag or paired with a closing tag. When used as a paired tag, the first
    of the pair is referred to as the *begin* tag and the second as the *end* tag.
    The general meaning of paired tags is that whatever content is within the tags
    is affected by the containing tags.


    # Configuring Tags with Attributes


    Tags have attributes that configure their behavior. For instance, the HTML anchor
    tag used to declare hyperlinks has an HREF attribute that declares the URL to
    the hyperlink points. The following is an example declaration of a hyperlink that
    points to www.bea.com:


    ```

    <A HREF="http://www.bea.com">Click Here</A>

    ```


    When the user clicks on the hyperlink, the browser will load the page pointed
    to by the HREF attribute.


    JSP tags also have plenty of attributes to configure. The earlier <jsp:useBean>
    example used the attributes name, class, and scope. Here it is again:


    ```

    <jsp:useBean name="myClass" class="SimpleClass" scope="page"/>

    ```


    The attributes configure the useBean tag to instantiate a class called SimpleClass,
    it myClass, and discard it when the JSP is done creating the page.'
