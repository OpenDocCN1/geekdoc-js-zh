- img_proc: true
  md: '# Understanding JavaBeans


    Web applications are often divided into a presentation layer and a business logic
    layer. The presentation layer is what the user sees and interacts with in a browser.
    The business layer consists of several Java classes that work together to model
    and execute the workflow of a business, including business policies, rules, and
    procedures for handling business transactions.


    JSPs fall in the category of presentation layer and JavaBeans in the category
    of business logic layer. JSPs are meant to be used for generating dynamic Web
    pages. Embedded java code in JSP servlets should be used to programmatically decide
    the layout and content of the page. For any serious computation tasks, you should
    considering specialized java code like JavaBeans. Servlets create instances of
    Java classes and use them as objects.


    To illustrate how the different parts of a Web application can be classified as
    either in the presentation layer or the business logic layer, consider a Web site
    that sells several items on the Web. The Web site might consist of the following
    Web pages: a welcome page, a catalog page, a shopping cart page, and a billing
    and information page. These pages make up the presentation layer of the Web application
    and may be implemented by JSPs as home.jsp, catalog.jsp, shoppingcart.jsp, billing.jsp,
    shipping.jsp, jsp and any other supporting JSPs. Users interact with the Web pages
    by clicking hyperlinks and buttons to transition between the pages.


    To illustrate the business logic layer, consider the scenario of the user browsing
    through the catalog, finding an item he wants, and adding it to the shopping cart.
    A reasonable interaction in the presentation layer would be when the user clicks
    a hyperlink called "Add to shopping cart" by transitioning to shoppingcart.jsp.
    he is presented with the content of the shopping cart. (Remember in Hour 12, "Keeping
    Track of the User Session,") you learned how to use the session object to keep
    track of items.) Another way of creating a shopping cart is to have a JavaBean
    implement the shopping cart in Java and use it from the presentation layer. The
    JavaBean would be written in Java. The source of the class could be something
    like ShoppingCart.java and has methods to compute everything you would expect
    to know from a shopping cart, such as what items are in the shopping cart, the
    total cost of the items in the shopping cart, how many of items are in the cart,
    shipping information about a given item, and so on. The shopping cart could be
    written or persisted to a database for customers who want to purchase the items
    in the future. The shopping cart JavaBean could interact with other JavaBeans
    to update inventory, compute taxes for the items, determine credit card authorization,
    and so forth. In other words, JavaBeans could do a of the behind-the-scenes grunt
    work that is part of the details of running a particular business. These mechanisms
    comprise the logic.'
