  md: '# Interacting with the Database with the Statement Object


    The Statement object provides methods to update and query the database. Two of
    the\more important methods are


    ```

    ResultSet Statement.executeQuery(String)

    void Statement.executeUpdate(String)

    ```


    You execute the executeQuery() method when you want to query the database with
    an SQL

    query criterion and edit a set of rows that match the criterion. You use the

    executeUpdate() method when you want to update or change the database content
    and

    dn''t expect any results back. Here''s an example of performing a query:


    ```

    String sql = "SELECT FROM TABLE TOBRAND=LEGO, PRICE<10>";

    ResultSet Statement.executeQuery(sql);

    ```


    These two lines create a ResultSet object that contains a legal statement. The
    state-

    ment that you want to select from the table called TOTABLE those rows that match

    criteria: The column TOBRAND is equal to LEGO and the PRICE column is less than

    $10. In other words, you want all the LEGO toys that cost less than $10. This
    assumes

    there is such a table TOTABLE that has at least columns TOBRAND and PRICE.

    Those columns that match the criteria will be packaged into a ResultSet object
    and

    returned by the Statement object.


    # Navigating Query Results with the ResultSet


    The ResultSet represents a set of rows created by the database as a result of

    performing a query. The ResultSet object is similar to an Enumeration object.
    To

    to inspect each row in the ResultSet object use the method ResultSet.next(). The

    ResultSet object keeps track of the current row position. The current row position
    is

    off referred to as a cursor. Initially, the cursor does not point to any row.
    The next()

    method causes the cursor to advance to the next row, starting with the first,
    and to scroll

    through the ResultSet every time the next() method is invoked. If there are still
    rows

    scroll through, it returns true; otherwise, if there are no more rows, next()
    returns false.

    Typically you use a while loop that gets the result of the next() method to scroll
    through

    all the columns in the ResultSet object.


    When the cursor points to a particular row, you can use several of the ResultSet
    get

    methods to get the data in each of the columns of the current row. The get methods
    allow

    to get a column content by its ordered index in the row or by the name of the

    column. Here are some of the more common methods:


    ```

    get-getInt column name methods

    getInt(String colName)

    getFloat(String colName)

    ```


    ```

    get-by-index methods

    getInt(int index)

    getFloat(int index)

    ```'
