  md: '# Q&A


    +   Q What are the benefits of using JSPs over Servlets?


    +   A There are several benefits of using JSPs. One of the major benefits of using
    Servlets is that you don''t have to be a very experienced Java programmer. You
    only need to understand the basics of Java in order to add the dynamic content.
    Also, JSPs are easier for presentation purposes. You can create your HTML page
    and make it look pretty, or your graphical department can do at this. You can
    then add the dynamic content. A great benefit of JSPs over Servlets is the separation
    of rules.


    +   Q Is it possible to keep the generated Servlet code?


    +   A Many application servers provide the option to keep the generated Servlet
    code. When you configure BEA WebLogic Server in Hour 5, “Understanding the JSP
    Application Models,” you will see how to keep the generated code.


