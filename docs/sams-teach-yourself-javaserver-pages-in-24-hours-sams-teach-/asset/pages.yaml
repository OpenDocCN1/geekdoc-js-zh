  md: '# Calling Methods from an Expression


    JSP expressions can contain variables and method calls. Methods can be declared
    either locally within the JSP code or in a Java class. The following sections
    present examples of these two scenarios.


    # Calling a Local Method


    JSP expressions can reference methods declared locally in the JSP. The methods
    are declared using the JSP declaration tags <%! %> covered in Hour 7, “Declaring
    Variables and Methods in a JSP” The methods can return any data type; they will
    be converted into a string representation, and the entire JSP expression will
    be replaced by the string representation. Again, if the method returns a Java
    data type, the JSP compiler knows how to convert it to a string. If the method
    returns a custom data type, the appropriate to toString() method would be as discussed
    earlier in this hour.


    The JSP in Listing 8.4 demonstrates how a JSP expression can reference methods
    that have been declared locally using the JSP declaration tags. The methods return
    of different types and are converted by the JSP expression so that they can be
    inserted in the resulting HTML code.


    Listing 8.4 A JSP that Calls Methods Within a JSP Expression (callingLocalMethods.jsp)


    ```

    1: <HTML><HEAD>Calling Local Methods</TITLE></HEAD><body>

    2: <% String stringVar = "This is a string variable";

    3: int integerVar = 123;

    4: double doubleVar = 234.345;

    5: string getStringVar() {return stringVar};

    6: int getIntegerVar() {return integerVar};

    7: double getDoubleVar() {return doubleVar};

    8: %>

    9: <UL>

    10: <LI> getStringVar() = <%= getStringVar() %>

    11: <LI> getIntegerVar() = <%= getIntegerVar() %>

    12: <LI> getDoubleVar() = <%= getDoubleVar() %>

    13: <LI> getStringVar() +getIntegerVar() = <%= getStringVar() +getIntegerVar()
    %>

    14: <LI> getStringVar() +doubleVar() = <%= getStringVar() +getDoubleVar() %>

    15: <LI> getIntegerVar() +doubleVar() = <%= getIntegerVar() +getDoubleVar() %>

    16: </UL>

    17: </body></html>

    ```


    The preceding listing lists three methods using the JSP declaration tags in lines
    5–7. Several JSP expression tags are used to reference the methods by them- lines
    10–12 and then combined with one another in lines 13–15. The output of'
