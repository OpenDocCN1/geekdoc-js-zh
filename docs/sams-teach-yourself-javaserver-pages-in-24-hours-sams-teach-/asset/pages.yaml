    JMS allows applications to send messages to each other. Each message is a couple
    of types of messaging: Point-to-Point and Publish/Subscribe. Point-to-Point messaging
    is one producer and one consumer. This is much like sending an email. The producer
    writes and the consumer receives it. Publish/Subscribe messaging is similar to
    a newsgroup. A message gets published to a topic and many consumers can receive
    that message.


