  md: '# HOUR 16


    # # Using JavaBeans in a JSP


    Web applications are often divided into two parts: the presentation and the business
    logic. The presentation piece encompasses all of what the user sees on a browser
    and is usually the product of the execution of some JSP. The business part consists
    of several Java classes that work together to model and execute the regulations,
    procedures, and workflow of the business.


    JavaBeans is a standard for writing Java classes. The JavaBeans specification
    make JavaBeans convenient to use in many different applications including JSPs.
    This hour explains what JavaBeans are and how to use them in JSPs.


    The following topics are covered in this hour:


    +   - Instantiating and using JavaBeans in JSPs

    - JavaBean scope

    - Setting and getting JavaBean properties

    - Using forms with JSPs


    ![](img/4df77e7d634c573982f3b815243f9fd2_239_0.png)'
  merge: -1
