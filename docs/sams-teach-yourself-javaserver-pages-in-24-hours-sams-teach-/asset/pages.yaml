  md: '# Encoding URLs


    Cookies and sessions work only if users have cookies enabled on their browsers.
    Many users disable cookies for various reasons, such as not wanting to be monitored
    or not wanting to leave a trail of what Web sites they have visited in their local
    machines. Although these are legitimate concerns on the part of the user, the
    fact remains that some applications are impossible to build without maintaining
    some state information about the user. Some sites require users to enable cookies
    on their browsers for particular features of the site. Other sites are also built
    to deny their services if cookies are not enabled. Web applications generally
    should assume cookies are enabled and should instead use URL encoding to maintain
    a Stateful with client applications. Maintaining state about a user is not an
    inherently bad practice. What is the purpose of keeping track of users and what
    is done with this information. URL encoding is a less intrusive mechanism that
    avoids the use of cookies, while maintaining user-state information in URLs generated
    by the Web site.


    For instance, consider two distinct users browsing through an online catalog.
    The catalog pages are generated by JSPs. The URLs in the hyperlinks on the pages
    of the catalog can have special parameters and values in the query string. The
    parameters and values distinguish one user from another without the need for cookies.


    The creation of special parameters and their values is somewhat tricky and therefore
    JSPs provide several methods in the response object to handle URL encoding. The
    methods are listed in Table 12.6.


    # Table 12.6 URL Encoding Methods of the response Object


    | Method | Description |

    | --- | --- |

    | encodeURL(String url) | If encoded is needed, it encodes the URL by appending
    the session ID in the query string |

    | encodeRedirect(String url) | If encoded is needed, it encodes the URL to be
    used with the sendRedirect() method |

    | void sendRedirect(String url) | Sends a redirect response to the client using
    the URL |


    The session ID can be stored either in a cookie or in the encoded URL. The resulting
    encoded URL contains an ID that is used to associate the user with an HttpSession
    object. Even though cookies are not enabled, the Web application can still make
    use of a session object associated with particular users.


    Application servers have logic built into them to determine whether cookies are
