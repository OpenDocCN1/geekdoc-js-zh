  md: "# Answers for Hour 21, \"Designing an Enterprise Application\"\n\n# Quiz\n\n\
    +   1. What are the two ways to access a database with a JSP?\n   A JSP can access\
    \ a database directly or it use a JavaBean to access it.\n\n+   2. What are the\
    \ two ways to send data from an HTML form to the server?\n   An HTML form can\
    \ use the POST or GET method in order to send data from an HTML form to the server.\n\
    \n+   3. Where would an application like this an human resources Web site be found?\n\
    \   This application would be found on a company's intranet. Many companies offer\
    \ sites like this to get more interaction with the employees.\n\n+   4. Why do\
    \ you model your application before beginning to code?\n   You should always model\
    \ your applications before you begin coding in order to address all of your requirements.\
    \ It is easier to catch problems in your application during the design phase,\
    \ than it is to wait until the development cycle.\n\n# Answers for Hour 22, \"\
    Creating a Presentation Layer\"\n\n# Quiz\n\n+   1. What two directives were used\
    \ in the PresentCompanyPolicies.jsp file?\n   The include directive and the page\
    \ directive. The include directive included the company banner and the site navigator;\
    \ the page directive imported the appropriate classes for database access.\n\n\
    +   2. What is a benefit of including a file into a JSP via the include directive?\n\
    \   The major benefit of including files via the include directive is that you\
    \ only need to make changes in one place instead of all your files.\n\n+   3.\
    \ What action is used in the PersonalInfo.jsp file? How does this JSP action work?\n\
    \   The PersonalInfo.jsp file uses the include action to insert the output of\
    \ the other JSPs. The include action treats the included files as dynamic files\
    \ and so it includes the output, not the code, of the files."
