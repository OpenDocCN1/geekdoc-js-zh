    Then you will

    see how to process query strings and how they can be used with HTML forms.


    ![](img/4df77e7d634c573982f3b815243f9fd2_150_0.png)


    Requests generated by hyperlinks in static requests; that is, are hard-

    coded at development in a static URL. Requests generated by HTML forms

    are dynamic in the sense that the developer provides the user with fields that

    the fills out. When the form is submitted, the URL is generated with the

    values of the fields set by the user; that is, the URL is not hard-coded—it is

