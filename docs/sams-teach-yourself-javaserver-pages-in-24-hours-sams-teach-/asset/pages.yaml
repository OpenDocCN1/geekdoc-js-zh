  md: '# Summary


    The plugin action tag allows you to insert Java applets into your JSPs. Parameters
    can be passed into the applet by using param tags and passing the name and value
    of the parameter with the name and value attributes. Remember to place the values
    for the name and value attributes in double quotes since JSPs ignore any unknown
    tags.


    # Q&A


    +   - What should I do if the applet does not load and execute?

    - The first thing you can do is look at the code of the HTML file. One way to
    do this is to right-click in the browser and select View Source.

    - If the plugin action tag is still there, then it is not being interpreted by
    the JSP compiler. If this is the case, make sure that the parameter values have
    double quotes around them, that the tags are nested properly, and that there is
    a close tag for each of your open tags.

    - If the embed tag is there and the fallback text is showing, make sure you have
    Java enabled in your browser.


