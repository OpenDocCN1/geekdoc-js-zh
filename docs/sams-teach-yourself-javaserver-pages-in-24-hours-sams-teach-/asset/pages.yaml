  md: '# Summary


    There are many ways to build your applications with JavaServer Pages technology.
    The specification gives guidelines on how to build these applications and ways
    that your JSPs communicate. Hour 20 contains much more detail about the actions
    that help you build your applications to these guidelines.


    # Q&A


    +   - Why is it helpful to know these application models?

    - The application models can guide you in designing your application. They describe
    the work of your application can get done with one JSP or multiple JSPs.

    - What are the actions that are referred to in this hour?

    - JSPs have tags that allow you to do an action, as using a JavaBean, including
    requests from other JSPs, and forwarding requests to another JSP. By simply using
    these tags you can do an action that would typically take multiple lines of code
    to perform.


    # Workshop


    The quiz questions and activities are provided for your further understanding.
    See Appendix A, "Answers," for the answers to the quiz.


    # Quiz


    +   - What application model describes using server-side resources such as EJBs
    to manage your backend resources?

    - What actions are used in the Including Requests Model and the Forwarding Requests
    Model, respectively?

    - If your application follows the Loosely Coupled Model and one JSP changes, it
