    在 JavaScript 中，对象是一种基础数据类型，允许创建复杂的数据结构，并将数据和功能组织成可重用的模块。处理对象时，一个重要的方面是理解对象的属性（attributes）。在本文，我们将通过一些示例来探索
    JavaScript 中对象属性的概念。


    # JavaScript 中的对象属性


    在 JavaScript 中，每个对象都有一组属性，定义了对象的行为以及如何访问该对象。这些属性可以是以下一项或多项：


    - `writable`: 是否可以修改该属性的属性值。默认值为 `true`。

    - `configurable`: 是否可以向对象中添加新属性，以及是否可以删除现有属性。默认值为 `true`。

    - `writable`: 是否可以向对象中添加新属性、是否可以删除现有属性，以及是否可以修改现有属性。默认值为 `false`。


    以下是一个在 JavaScript 中定义和访问对象属性的示例：


    ![image](img/image-9N4IW2PS.png)


    在这个示例中，我们定义了一个名为 `user` 的对象，包含两个属性：`name` 和 `age`。然后，我们使用 `isExtensible()` 方法检查该对象是可扩展的，并使用
    `sealExtensions()` 方法防止向对象中添加新属性。接着，我们尝试向对象添加一个名为 `email` 的新属性，这失败了，因为该对象不再可扩展。我们还尝试从对象中删除该属性，这也失败了，因为对象已被密封。


    ## 对象属性的最佳实践


    - 使用对象属性来控制对象如何被修改和访问。

    - 在性能敏感的代码中，注意使用对象属性对性能的影响。

    - 使用 `Object.defineProperty()`、`Object.defineProperties()` 和 `Object.freeze()`
    方法来设置对象属性。


