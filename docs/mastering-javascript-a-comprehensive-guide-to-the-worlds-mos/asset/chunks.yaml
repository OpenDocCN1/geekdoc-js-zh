    ### 括号内的表达式


    括号内的表达式在任何表达式之前计算。以下是一些示例：


    ```javascript

    let result = (3 + 4) * 5;

    let message = "Hello, " + ("world" + "!");

    ```


    在这些示例中，括号内的表达式先求值，然后用于更大的表达式。


    ## 基础表达式的最佳实践


