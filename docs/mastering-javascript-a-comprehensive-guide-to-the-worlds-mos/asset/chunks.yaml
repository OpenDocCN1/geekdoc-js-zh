    \n```javascript\nfunction Person(name, age) {\n  this.name = name;\n  this.age\
    \ = age;\n  this.sayHello = function() {\n    console.log(\"Hello, \" + this.name\
    \ + \"!\");\n  };\n}\n\nlet person = new Person(\"John\", 42);\nperson.sayHello();\
    \ // 输出 \"Hello, John!\"\n```\n\n在这个示例中，构造函数用于创建一个具有 `name` 和 `age` 属性以及 `sayHello`\
    \ 方法的新对象。\n\n## 对象字面量 (Object Literals)\n对象字面量是创建具有特定属性和方法的对象的快捷方式。它们用一对大括号定义，键值对之间用逗号分隔。这是一个示例：\n\
    \n![image](img/image-VF2ZQIH0.png)\n\n在这个示例中，对象字面量用于创建一个具有这些属性和方法的新对象。\n\n## 方法\
    \ (Method)\n方法是基于现有对象创建新对象的另一种方式。它创建一个具有指定原型对象和可选属性的新对象。这是一个示例：\n\n![image](img/image-RFCE6RIB.png)\n\
    \n在这个示例中，方法用于根据具有这些属性的对象创建一个新对象。\n\n## 对象创建表达式的最佳实践\n- 使用对象构造函数或对象字面量来创建具有特定属性和方法的新对象。\n\
    - 使用对象原型创建具有共享属性和方法的对象。\n- 简单对象使用对象字面量，复杂对象使用对象构造函数。\n- 遵循对象属性和方法的命名规范和最佳实践。\n\
    \n![image](img/image-TAHGE1VP.png)\n\n# 算术表达式 (Arithmetic Expressions)\n\n![image](img/image-3UHZA0MF.png)\n\
    \n在 JavaScript 中，算术表达式是对数字进行数学运算的一种方式。算术表达式是 JavaScript 中的一种基础工具，允许编写动态、灵活且可重用的代码。理解算术表达式对于在\
    \ JavaScript 中编写高效无 Bug 的代码至关重要。让我们通过一些示例探索 JavaScript 中算术表达式的概念。\n\n## 基础算术运算符\n\
    JavaScript 支持加、减、乘、除的基础算术运算符。是一些示例：\n\n![image](img/image-0FPHG8P8.png)\n\n在这个示例中，基础算术运算符用于对变量\
    \ `x` 和 `y` 执行加、减、乘、除运算。\n\n## 取模运算符 (Modulus Operator)\n取模运算符是获取除法余数的方法。这是一个示例：\n\
    \n![image](img/image-1MLW4LB0.png)\n\n在这个示例中，取模运算符用于获取变量 `x` 和 `y` 之间除法运算的余数。\n\
    \n## 增减运算符 (Increment and Decrement Operators)\n增减运算符是增加或减少变量值值为 1 的方法。是一些示例：\n\
    \n![image](img/image-BSYAZ4PK.png)\n\n在这个示例中，增减运算符用于增加或减少变量 `x` 的值值为 1。\n\n##\
    \ 算术表达式的最佳实践\n- 使用易于阅读和理解的描述性变量名。\n- 使用括号分组操作并明确运算顺序。\n- 使用取模运算符获取除法运算的余数。\n-\
    \ 谨慎使用增减运算符，以避免混淆和 Bug。\n\n![image](img/image-TAHGE1VP.png)\n\n# 关系表达式 (Relational\
    \ Expressions)\n\n![image](img/image-3UHZA0MF.png)\n\n在 JavaScript 中，关系表达式是比较值并判断一个值是否大于、小于、等于或不等于另一个值的方式。关系表达式是\
    \ JavaScript 中的一种基础工具，允许编写动态、灵活且可重用的代码。理解关系表达式对于在 JavaScript 中编写高效无 Bug 的代码至关重要。让我们通过一些示例探索\
    \ JavaScript 中关系表达式的概念。\n\n## 基础比较运算符\nJavaScript 支持大于、小于、大于等于、小于等于、等于和不等于的基础比较运算符。是一些示例：\n\
    \n![image](img/image-MW0EC1EI.png)![image](img/image-NF9GMLH3.png)\n\n在这个示例中，基础比较运算符用于比较变量\
    \ `x` 和 `y` 的值。\n\n## 严格比较运算符 (Strict Comparison Operators)\nJavaScript 还支持严格相等和严格不相等的严格比较运算符。严格比较运算符不会进行类型转换，并要求被比较的值具有相同的类型。是一些示例：\n\
    \n![image](img/image-FNDPGUVQ.png)\n\n在这个示例中，严格比较运算符用于通过严格相等和严格不等来比较变量 `x` 和 `y`\
    \ 的值。\n\n## 关系表达式的最佳实践\n- 使用易于阅读和理解的描述性变量名。\n- 在比较不同类型的值时，使用严格比较运算符。\n- 使用括号分组比较并明确运算顺序。\n\
    - 使用逻辑运算符 `&&` 和 `||` 组合多个比较。\n\n![image](img/image-TAHGE1VP.png)\n\n# 逻辑表达式 (Logical\
    \ Expressions)\n\n![image](img/image-3UHZA0MF.png)\n\n在 JavaScript 中，逻辑表达式是组合多个条件并判断特定条件为真为假的方式。逻辑表达式是\
    \ JavaScript 中的一种基础工具，允许编写动态、灵活且可重用的代码。理解逻辑表达式对于在 JavaScript 中编写高效无 Bug 的代码至关重要。让我们通过一些示例探索\
    \ JavaScript 中逻辑表达式的概念。\n\n## 逻辑与运算符 (&&)\n逻辑与运算符 `&&` 在两个条件都为真时返回真。是一些示例：\n\n\
    ![image](img/image-WK0PVK12.png)\n\n在这个示例示例，逻辑与运算符用于组合两个条件并判断它们是否都为真。\n\n## 逻辑或运算符\
    \ (||)\n逻辑或运算符 `||` 在至少一个条件为真时返回真。是一些示例：\n\n![image](img/image-521TEL82.png)\n\
    \n在这个示例中，逻辑或运算符用于组合两个条件并判断是否至少一个为真。\n\n## 逻辑非运算符 (!)\n逻辑非运算符 `!` 返回条件相反的布尔值。是一些示例：\n\
    \n![image](img/image-NCJX9C8W.png)\n\n在这个示例中，逻辑非运算符用于返回条件相反的布尔值。\n\n## 逻辑表达式的最佳实践\n\
    - 使用易于阅读和理解的描述性变量名。\n- 使用括号分组条件并明确运算顺序。\n- 使用逻辑与运算符 `&&` 组合必须真的条件。\n- 使用逻辑或运算符\
    \ `||` 组合至少一个为真的条件。\n- 使用逻辑非运算符 `!` 取反条件。\n\n![image](img/image-TAHGE1VP.png)\n\
    \n# 赋值表达式 (Assignment Expressions)\n\n![image](img/image-3UHZA0MF.png)![image](img/image-MW0EC1EI.png)\n\
    \n在 JavaScript 中，赋值表达式是为变量赋值并更新其值的方式。赋值表达式是 JavaScript 中的一种基础工具，允许编写动态、灵活且可重用的代码。理解赋值表达式对于在\
    \ JavaScript 中编写高效无 Bug 的代码至关重要。\n\n## 基础赋值运算符 (=)\n基础赋值运算符 `=` 用于给变量赋值。是一些示例：\n\
    \n![image](img/image-98R8XCWN.png)\n\n在这个示例中，基础赋值运算符用于将 `y` 的值赋值给 `x`。\n\n## 复合赋值运算符\
    \ (Compound Assignment Operators)\n\n"
