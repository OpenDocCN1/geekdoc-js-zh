    We then log a message to the console indicating that we are reading the file.
    This message will be printed immediately, before the file is actually read.


    When the file is read, the callback function is executed. If there was an error
    reading the file, we log the error to the console. If there was no error, we log
    the data that was read from the file to the console.


    Because the `fs.readFile()` method is asynchronous, it does not block the event
    loop and allows other code to continue executing while the file is being read.
    This makes it possible to perform I/O operations in Node.js without slowing down
    the overall performance of the application.


    Asynchronous I/O is an important feature of Node.js, as it allows you to build
    high-performance, scalable, and responsive applications that can handle large
    amounts of data and concurrent requests.


