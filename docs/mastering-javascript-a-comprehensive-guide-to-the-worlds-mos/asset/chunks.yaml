    We then define a getter and setter for the property `name`, which allow us to
    get and set the value of the property. We then use `Object.defineProperty()` to
    set the attribute of the property to `false`, which prevents it from being enumerated
    using a loop. We then use the getter and setter to get and set the property of
    the object.


    ### Best Practices for Property Attributes


    - Use property attributes to control how properties can be accessed and set.

    - Be aware of the performance implications of using property attributes in performance-critical
    code.

    - Use the `Object.defineProperty()` method to define property attributes.

