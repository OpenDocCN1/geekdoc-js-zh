    ### Property Attributes


    In JavaScript, each property of an object has a set of attributes that define
    how the property can be accessed and set. The attributes can be one or more of
    the following:


    - `writable`: Whether the value of the property can be changed or not. Defaults
    to `true`.

    - `enumerable`: Whether the property can be enumerated using a loop or not. Defaults
    to `false`.

    - `configurable`: Whether the property can be deleted or not, and whether the
    attributes of the property can be changed. Defaults to `true`.

    - `value`: The value of the property.

    - `get`: A function that is called when the property is accessed.

    - `set`: A function that is called when the property is set.


