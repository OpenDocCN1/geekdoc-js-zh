    ## Object-Oriented Techniques in JavaScript


    ![image](Images/image-3UHZA0MF.png)


    JavaScript supports a number of object-oriented programming techniques, including
    encapsulation, inheritance, and polymorphism.


    Encapsulation refers to the practice of hiding the implementation details of an
    object and exposing only its public interface. In JavaScript, you can use closures
    and modules to achieve encapsulation. Here''s an example:


    ![image](Images/image-MWF2DERO.png)


    In this example, we defined a module called Person using an immediately-invoked
    function expression (IIFE). The module has private variables called name and age,
    as well as private functions called setName, setAge, getName, and getAge. We then
    returned an object containing only the public methods, which can be accessed from
    outside the module.


    Inheritance refers to the practice of creating new classes that inherit properties
    and methods from existing classes. In JavaScript, you can use prototypes and the
    Object.create() method to achieve inheritance. Here''s an example:


    ![image](Images/image-K8TCEO7K.png)


    In this example, we defined a Animal class with a speak method that logs a message
    to the console. We then defined a Dog class that inherits from Animal using the
    Object.create() method. We also defined a speak method for Dog that overrides
    the speak method in Animal.


    Polymorphism refers to the practice of treating objects of different types as
    if they were the same type, as long as they have a common interface. In JavaScript,
    you can achieve polymorphism by using duck typing, which means that you check
    for the presence of certain properties or methods instead of checking for the
    object''s type. Here''s an example:


    ![image](Images/image-NH259BV4.png)


    In this example, we defined two objects, cat and dog, that have a name property
    and a speak method. We also defined a speak function that takes an object and
    calls its speak method. We can then pass cat and dog to the speak function, even
    though they are different types of objects, because they both have a speak method.


    ![image](Images/image-TAHGE1VP.png)


    ## Subclasses


    ![image](Images/image-3UHZA0MF.png)


    In JavaScript, you can create subclasses that inherit properties and methods from
    a parent class using the extends keyword. Here''s an example:


    ![image](Images/image-WSEQCNP5.png)


    In this example, we defined a Animal class with a constructor that takes a name
    parameter and sets it as a property of the object using the this keyword. We also
    added a speak method to the class that logs a message to the console.


    We then defined a Dog class that extends Animal using the extends keyword. This
    means that Dog inherits all the properties and methods of Animal. We also defined
    a speak method for Dog that overrides the speak method in Animal.


    Finally, we created a new object using the Dog constructor function and assigned
    it to the variable d. We can call the speak method on the d object to log the
    message to the console.


    ![image](Images/image-TAHGE1VP.png)


    ## Classes in ECMAScript 5


    ![image](Images/image-3UHZA0MF.png)


    ECMAScript 5 (ES5) is an older version of the JavaScript language specification
    that does not have built-in support for the class keyword or the extends keyword
    for creating classes and subclasses. However, it is still possible to define classes
    in ES5 using constructor functions and prototypes.


    Here''s an example:


    ![image](Images/image-VHUE3QJH.png)


    In this example, we defined an Animal constructor function with a speak method
    that logs a message to the console. We then defined a Dog constructor function
    that inherits from Animal by calling Animal with the this keyword and passing
    in the name parameter.


    We then used Object.create() to create a new object with Animal.prototype as its
    prototype, and set it as the prototype of Dog.prototype. This establishes the
    inheritance relationship between Dog and Animal.


    Finally, we defined a speak method for Dog that overrides the speak method in
    Animal. We then created a new object using the Dog constructor function and assigned
    it to the variable d. We can call the speak method on the d object to log the
    message to the console.


