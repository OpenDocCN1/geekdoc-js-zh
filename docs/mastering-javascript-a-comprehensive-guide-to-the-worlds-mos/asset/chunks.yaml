    ## 字符集


    ASCII 字符集是最广泛使用的字符集之一，包含了字母、数字和特殊符号。在 JavaScript 中，你可以使用十进制或十六进制代码处理 ASCII 字符。例如，字母
    "A" 的十进制代码为 65，十六进制代码为 0x41。你可以使用 `String.fromCharCode()` 方法将 ASCII 代码转换为相应的字符：


    ```javascript

    String.fromCharCode(65)

    ```


    ## Unicode 字符集


    Unicode 是更全面的字符集，包含了超过 143,000 个来自语言的字符。在 JavaScript 中，你可以使用代码点处理 Unicode 字符，它们以十六进制值表示。例如，日语字符“こ”的代码点是
    U+3053，表示为 0x3053。你可以使用 Unicode 表示法在 JavaScript 中表示 Unicode 字符：


    ```javascript

    "\u3053"

    ```


    ## UTF-8 编码方案


    UTF-8 是一种常用的 Unicode 编码方案，与 ASCII 兼容。UTF-8 是一种变长编码方案，这意味着它可以根据所代表字符使用不同数量的字节。在
    JavaScript 中，你可以使用内置的 `String` 对象处理 UTF-8 编码字符串。例如，你可以使用 `charCodeAt()` 方法获取字符串中给定字符的
    UTF-8 代码点：


    ```javascript

    "A".charCodeAt(0)

    ```


    ## 处理不同的字符集


    在 JavaScript 中，你可以使用库和框架处理不同的字符集和编码方案。例如，jQuery 库包含了处理文本输入和验证的函数，这对于处理不同的字符集非常有用。以下是使用
    jQuery 验证文本输入框是否存在非 ASCII 字符的示例：


