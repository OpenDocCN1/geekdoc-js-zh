    在第二个示例中，我们创建了一个空数组，`length` 属性 0。


    你也可以通过设置 `length` 属性来修改长度，这会影响数组的内容。如果你将 `length` 设置为小于当前元素数量的值，将从末尾移除元素。如果你将
    `length` 设置为大于当前元素数量的值，将会在数组末尾添加新的 `undefined` 元素。注意，由于我们没有初始化它们，这些新元素是 `undefined`。


