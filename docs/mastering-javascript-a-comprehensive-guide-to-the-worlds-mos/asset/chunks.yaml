    in code. JavaScript supports both integer and floating-point numbers, and includes
    built-in functions and methods for performing mathematical operations on numbers.
    Let''s explore the concept of numbers in JavaScript with some examples.


    Creating Numbers in JavaScript


    In JavaScript, numbers can be created using integer or floating-point notation.
    Here are some examples:


    ![image](Images/image-O2RBGZA7.png)


    Numbers can also be created using scientific notation, using the letter e to represent
    exponential notation:


    ![image](Images/image-BRY3NE0C.png)


    JavaScript also includes two special numeric values, NaN and Infinity, which are
    used to represent non-numeric and infinite values, respectively:


    ![image](Images/image-PSCE46UA.png)


    Performing Mathematical Operations on Numbers


    JavaScript includes built-in functions and methods for performing mathematical
    operations on numbers. Here are some examples:


    ![image](Images/image-P8WJ0DS7.png)


    Working with Decimal Places


    In JavaScript, floating-point numbers can sometimes be imprecise due to the way
    they are stored in memory. To work with decimal places in a more precise way,
    developers can use the toFixed() method, which rounds a number to a specified
    number of decimal places:


    ![image](Images/image-4MJ4W9K3.png)


    Best Practices for Using Numbers


    When working with numbers in JavaScript, it''s important to follow best practices
    to ensure that your code is clear, efficient, and easy to read. Here are some
    tips for using numbers in JavaScript:


    Use descriptive variable names for numbers to make your code more readable.


    Be aware of the limitations of floating-point numbers, and use toFixed() or other
    methods to work with decimal places in a more precise way.


    Use built-in functions and methods for performing mathematical operations on numbers,
    instead of writing your own functions.


    Use NaN and Infinity judiciously, and be aware of their implications when working
    with numbers.


    ![image](Images/image-TAHGE1VP.png)


    ## Text


    ![image](Images/image-3UHZA0MF.png)


    Text is an essential data type in JavaScript, used to represent strings of characters
    in code. JavaScript includes built-in functions and methods for working with text,
    including string manipulation, text formatting, and regular expressions. Let''s
    explore the concept of text in JavaScript with some examples.


    Creating Text in JavaScript


