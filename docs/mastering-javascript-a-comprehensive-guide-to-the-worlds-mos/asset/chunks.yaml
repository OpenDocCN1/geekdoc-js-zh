    ![image](img/image-3UHZA0MF.png)


    在 JavaScript 中，稀疏数组是指某些元素可能缺失或为 `undefined` 的数组。如果你创建一个特定长度的数组但没有初始化其所有元素，就会发生这种情况。这是一个示例：


    ![image](img/image-PME2AJKS.png)


