    ## Closures


    ![image](Images/image-3UHZA0MF.png)


    In JavaScript, a closure is a function that has access to its outer function''s
    scope, even after the outer function has returned. Closures allow for a powerful
    programming technique called "partial application", which allows you to create
    new functions based on an existing function with some of its arguments pre-filled.
    Here''s an example:


    ![image](Images/image-2B60881L.png)


    In this example, we defined a function called `createMultiplier` that takes a
    `multiplier` parameter and returns a new function that multiplies its argument
    by `multiplier`. We then called this function with the argument `2` and assigned
    the returned function to the variable `double`. When we call `double` with the
    argument `5`, it returns `10`, which is the result of multiplying `5` by `2`.


    The reason this works is because the inner function has access to the `multiplier`
    variable in the outer function''s scope, even though the outer function has already
    returned. This is possible because JavaScript supports lexical scoping, which
    means that variables declared in an outer function are available to any inner
    function declared inside that function, regardless of whether the outer function
    has returned or not.


