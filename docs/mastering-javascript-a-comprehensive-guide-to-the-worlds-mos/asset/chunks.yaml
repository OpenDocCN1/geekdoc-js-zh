  trans: '


    JavaScript 还支持用于加法、减、乘法、除法以及获取除法操作余数的复合赋值运算符。以下是一些示例：


    ![image](img/image-DKVBUF08.png)


    在此示例中，复合赋值运算符用于对变量 `x` 执行数学运算并更新其值。


    ### 赋值表达式的最佳实践


    - 使用易于阅读和理解的描述性变量名。

    - 使用复合赋值运算符来简化数学运算并更新变量值。

    - 使用基础赋值运算符为变量分配值。

    - 避免为 JavaScript 中的保留字和关键字分配值。


    ![image](img/image-TAHGE1VP.png)


    ## 评估表达式


    ![image](img/image-3UHZA0MF.png)


    在 JavaScript 中，评估表达式（evaluation expressions）是评估代码并返回值的一种方法。评估表达式是 JavaScript 中的一种基础工具，允许编写动态、灵活且可重用的代码。理解评估表达式对于编写高效且无错误的
    JavaScript 代码至关重要。让我们通过一些示例来探索 JavaScript 中的评估表达式概念。


    ### 基础评估


    JavaScript 支持使用函数对代码进行基础评估。该函数接收字符串作为输入，并将其评估为 JavaScript 代码。以下是一些示例：


    ![image](img/image-YIVVLT5R.png)


    在此示例中，函数用于将字符串 `x + y` 评估为 JavaScript 代码，并返回值 `15`。


    ### 模板字符串字量


    模板字符串字量（Template literals）是 JavaScript 中评估代码更现代的方法。它们允许将变量和表达式插值字符串中，并用于构建动态且可重用的代码。以下是一些示例：


    ![image](img/image-GACPQX26.png)


    在此示例中，使用模板字符串字量评估表达式 `${x + y}`并将 `x` 和 `y` 的值插到字符串中。


    ### 评估表达式的最佳实践


    - 谨慎使用 `function` 并避免对用户生成的内容使用它，因为它可能会引入安全漏洞。

    - 使用模板字符串字量将变量和表达式插值字符串中。

    - 使用易于阅读和理解的描述性变量名。

    - 避免过度使用评估表达式，因为这会让代码更难以阅读和维护。


    ![image](img/image-TAHGE1VP.png)


    ##杂杂运算符


    ![image](img/image-3UHZA0MF.png)


    有几种杂杂运算符用于各种目的，例如从对象中删除属性、检查数据类型的 `typeof` 运算符、用于决策的条件运算符以及用于组合多个表达式的逗号运算符。这些运算符是
    JavaScript 中的基础工具，允许编写动态、灵活且可重用的代码。理解这些运算符对于编写高效且无错误的 JavaScript 代码至关重要。


    ### delete 运算符


    `delete` 运算符用于从对象中删除属性。这是一个示例：


    ![image](img/image-0HYCZ5XX.png)


    在此示例中，使用 `delete` 运算符从对象中删除属性。


    ### typeof 运算符


    `typeof` 运算符用于检查变量或表达式的数据类型。这是一个示例：


    ![image](img/image-2D7K12US.png)


    在此示例中，使用 `typeof` 运算符检查变量 `x` 和 `y` 的数据类型。


    ### 条件运算符


    条件运算符（也称为三元运算符）用于根据条件做决策。这是一个示例：


    ![image](img/image-0PR1KEKC.png)


    在此示例中，使用条件运算符判断 `x` 是否大于 `y` 并返回适当的消息。


    ### 逗号运算符


