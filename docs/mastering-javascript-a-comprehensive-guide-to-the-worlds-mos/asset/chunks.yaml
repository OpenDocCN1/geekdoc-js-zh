    In JavaScript, objects are a fundamental data type that allow for the creation
    of complex data structures and the organization of data and functionality into
    reusable modules. One important aspect of working with objects is understanding
    object attributes. In this article, we''ll explore the concept of object attributes
    in JavaScript with some examples.


    # Object Attributes In JavaScript


    In JavaScript, each object has a set of attributes that define how the object
    behaves and can be accessed. The attributes can be one or more of the following:


    - `writable`: Whether new properties can be added to the object or not. Defaults
    to `true`.

    - `configurable`: Whether new properties can be added to the object and whether
    existing properties can be deleted or not. Defaults to `true`.

    - `writable`: Whether new properties can be added to the object, whether existing
    properties can be deleted, and whether existing properties can be changed or not.
    Defaults to `false`.


    Here is an example of defining and accessing object attributes in JavaScript:


    ![image](Images/image-9N4IW2PS.png)


    In this example, we define an object called `user` with two properties, `name`
    and `age`. We then use the method `isExtensible()` to check if the object is extensible
    or not, and the method `sealExtensions()` to prevent new properties from being
    added to the object. We then attempt to add a new property called `email` to the
    object, which fails because the object is no longer extensible. We also attempt
    to delete the property from the object, which fails because the object is sealed.


    ## Best Practices for Object Attributes


    - Use object attributes to control how objects can be modified and accessed.

    - Be aware of the performance implications of using object attributes in performance-critical
    code.

    - Use the `Object.defineProperty()`, `Object.defineProperties()`, and `Object.freeze()`
    methods to set object attributes.


