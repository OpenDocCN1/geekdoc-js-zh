    JavaScript 是一种动态类型语言，这意味着变量和值可以在运行时更改它们的类型。JavaScript 中的类并不像 `Java` 或 `C++` 等其他面向对象的语言那样强制执行严格的类型或继承。相反，JavaScript
    中的类用于定义具有共享属性和行为的对象。


    这里有一个示例：


    ![image](img/image-EULDB1LU.png)


    在这个示例中，我们定义了一个名为 `Person` 的类，它包含一个构造函数，接收两个参数 `name` 和 `age`，并使用 `this` 关键字将它们设置为新创建对象的属性。我们还为该类添加了一个名为
    `sayHello` 的方法，该方法使用对象的 `name` 和 `age` 属性向控制台打印消息。


    然后，我们使用 `Person` 构造函数创建了一个新对象，并将其赋值给变量 `john`。我们可以在 `john` 对象上调用 `sayHello` 方法向控制台打印消息。


    我们还定义了另一个名为 `jane` 的对象，它具有与 `Person` 类相同的属性和方法，但它是使用对象字面量创建创建。我们也可以在 `jane` 对象上调用
    `sayHello` 方法向控制台打印消息。


    ![image](img/image-TAHGE1VP.png)


    ## JavaScript 中的面向对象技术


    ![image](img/image-3UHZA0MF.png)


    JavaScript 支持许多面向对象的技术，包括封装、继承和多态。


    封装指的是隐藏对象的实现细节并仅暴露其公共接口的实践。在 JavaScript 中，你可以使用闭包和模块来实现封装。这里有一个示例：


    ![image](img/image-MWF2DERO.png)


    在这个示例中，我们使用立即调用函数表达式（IIFE）定义了一个名为 `Person` 的模块。该模块具有名为 `name` 和 `age` 的私有变量，以及名为
    `setName`、`setAge`、`getName` 和 `getAge` 的私有函数。然后，我们返回了一个只包含公共方法的对象，这些方法可以从模块外部访问。


    继承指的是创建新类并从现有类继承属性和方法的实践。在 JavaScript 中，你可以使用原型和 `Object.create()` 方法来实现继承。这里有一个示例：


    ![image](img/image-K8TCEO7K.png)


    在这个示例中，我们定义了一个 `Animal` 类，带有一个 `speak` 方法可以向控制台打印消息。然后，我们使用 `Object.create()`
    方法定义了一个继承自 `Animal` 的 `Dog` 类。我们还为 `Dog` 定义了一个 `speak` 方法，覆盖了 `Animal` 中的 `speak`
    方法。


    多态指的是将不同类型的对象视为相同类型的实践，只要它们具有共同接口。在 JavaScript 中，你可以通过使用鸭类型（duck typing）来实现多态，这意味着你检查某些属性或方法是否存在，而不是检查对象的类型。这里有一个示例：


    ![image](img/image-NH259BV4.png)


    在这个示例中，我们定义了两个对象 `cat` 和 `dog`，它们都有一个 `name` 属性和一个 `speak` 方法。我们还定义了一个 `speak`
    函数，它接收一个对象并调用它的 `speak` 方法。我们可以将 `cat` 和 `dog` 传递给 `speak` 函数，即使它们是不同类型的对象，因为它们都拥有
    `speak` 方法。


    ![image](img/image-TAHGE1VP.png)


    ## 子类


    ![image](img/image-3UHZA0MF.png)


    在 JavaScript 中，你可以使用 `extends` 关键字创建继承自父类属性和方法的子类。这里有一个示例：


    ![image](img/image-WSEQCNP5.png)


    在这个示例中，我们定义了一个 `Animal` 类，其构造函数接收一个 `name` 参数并使用 `this` 关键字将其设置为对象的属性。我们还为该类添加了一个
    `speak` 方法，向控制台打印消息。


    然后，我们使用 `extends` 关键字定义了一个扩展 `Animal` 的 `Dog` 类。这意味着 `Dog` 继承了 `Animal` 的所有属性和方法。我们还为
    `Dog` 定义了一个 `speak` 方法，覆盖了 `Animal` 中的 `speak` 方法。


    最后，我们使用 `Dog` 构造函数创建了一个新对象，并将其赋值给变量 `d`。我们可以在 `d` 对象上调用 `speak` 方法向控制台打印消息。


    ![image](img/image-TAHGE1VP.png)


    ## ECMAScript 5 中的类


    ![image](img/image-3UHZA0MF.png)


    ECMAScript 5 (ES5) 是 JavaScript 规范的一个旧版本，不支持用于创建类和子类的 `class` 关键字或 `extends` 关键字。然而，在
    ES5 中仍然可以使用构造函数和原型定义类。


    这里有一个示例：


    ![image](img/image-VHUE3QJH.png)


    在这个示例中，我们定义了一个 `Animal` 构造函数，带有一个 `speak` 方法可以向控制台打印消息。然后，我们定义了一个 `Dog` 构造函数，通过通过带
    `this` 关键字调用 `Animal` 并传递 `name` 参数来继承 `Animal`。


    然后，我们使用 `Object.create()` 创建了一个以 `Animal.prototype` 为原型的新对象，并将其设置为 `Dog.prototype`
    的原型。这建立了 `Dog` 和 `Animal` 之间的继承关系。


    最后，我们为 `Dog` 定义了一个 `speak` 方法，覆盖了 `Animal` 中的 `speak` 方法。我们使用 `Dog` 构造函数创建了一个新对象并将其赋值给变量
    `d`。我们可以在 `d` 对象上调用 `speak` 方法向控制台打印消息。


    ![image](img/image-TAHGE1VP.png)


    ## 服务端 JavaScript


    ![image](img/image-3UHZA0MF.png)![image](img/image-TAHGE1VP.png)


    ## 使用 Rhino 编写 Java


    ![image](img/image-3UHZA0MF.png)


    Rhino 是完全用 Java 编写的 JavaScript 实现。它可以作为 Java 程序的脚本引擎，允许在 Java 代码中嵌入 JavaScript
    代码。


    这是一个使用 Rhino 执行 JavaScript 的示例：


    ![image](img/image-5V6ZFN14.png)在这个示例中，我们导入了 `org.mozilla.javascript` 包并使用 `enter()`
    方法创建了一个 `Context` 对象。然后我们使用 `initStandardObjects()` 方法初始化了一个 `Scriptable` 作用域。我们定义了一个名为
    `script` 的 JavaScript 代码字符串，将 `x` 和 `y` 分别设置为 10 和 20，然后将它们相加。我们使用 `cx.evaluateString()`
    方法在作用域中执行 JavaScript 代码。`<cmd>"` 参数是文件名，`1` 参数是用于错误信息的行号。`result` 变量包含 JavaScript
    代码的返回值，即 `x` 和 `y` 的和。


    最后，我们使用 `System.out.println()` 将结果打印到控制台。



    Rhino 支持 JavaScript 语言许多功能，包括面向对象编程、正则表达式和 XML 处理。它还包含一个调试器和一个可以优化 JavaScript
    代码性能的编译器。通过使用 Rhino，你可以在 Java 应用中利用 JavaScript 的力量，创建更灵活、更动态的软件。


    ## Node 中的异步 I/O


    ![image](img/image-TAHGE1VP.png)


    ## 使用 Node


    Node.js 是一个构建在 V8 JavaScript 引擎之上的服务端 JavaScript 运行时。它支持异步 I/O，这允许你的代码执行 I/O 操作而不会阻塞事件循环并降低应用程序的整体性能。


    这是一个在 Node.js 中使用异步 I/O 的示例：


    ![image](img/image-G5XX6RZJ.png)在这个示例中，我们正在使用 `fs` 模块异步读取文件。`fs.readFile()` 方法接收三个参数：文件路径、编码类型（在此例中为
    `utf8`）以及在文件读取后执行的回调函数。回调函数接收两个参数：错误对象（如果发生错误）和从文件中读取的数据。


