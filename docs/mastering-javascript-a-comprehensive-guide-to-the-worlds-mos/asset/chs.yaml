  \ 语句\n\n`switch` 语句用于根据不同的情况（case）执行代码块。这是一个示例：\n\n\n在此示例中，`switch` 语句检查 `x` 的值并执行相应的\
  \ `case` 语句。在这种情况下，执行第二个 `case` 语句并打印 `\"x is 2\"`。\n\n### 三元运算符\n\n\n![image](img/image-OPKGAX4X.png)\n\
