  \n![image](img/image-TAHGE1VP.png)\n\n## 条件判断\n\n\n在 JavaScript 中，条件判断用于根据条件执行不同的代码块。条件判断是\
  \ JavaScript 中的基础工具，允许编写动态、灵活且可重用的代码。理解条件判断对于编写高效且无错误的 JavaScript 代码至关重要。让我们通过一些示例来探索\
