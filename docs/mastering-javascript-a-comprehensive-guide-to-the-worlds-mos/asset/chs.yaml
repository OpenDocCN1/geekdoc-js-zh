  \ `10` 被赋值给参数 `a`，值 `20` 被赋值给参数 `b`。在函数内部，我们使用这些参数计算和并打印到控制台。\n\nJavaScript 函数可以有任意数量的参数，包括没有参数。如果调用函数时提供的参数少于预期，缺失的参数将值为\
  \ `undefined`。如果调用函数时提供的参数多于预期，多出的参数将被忽略。\n\n\n![image](img/image-PHRX4.png)\n\n\
  在这个示例中，我们定义了 `greet` 函数，它接受两个参数 `name` 和 `greeting`。`greeting` 参数是可选的，默认值为字符串 \"\
  Hello\"。我们使用字符串插值向控制台打印问候消息。\n\n\n## 函数作为值\n\n![image](img/image-3UHZA0MF.png)\n\
  \n\n![image](img/image-0W9HK.png)\n\n\n\n\n在第一个例子中，我们定义了一个函数表达式并将其赋值给变量 `addNumbers`。然后我们可以像使用其他任何值一样，通过变量来调用这个函数。\n\
  \n在第二个例子中，我们定义了一个名为 `multiplyNumbers` 的函数，它接收两个数字和一个回调函数作为参数。在函数内部，我们计算这两个数字的乘积，并将结果传递给回调函数。我们可以将任何函数（包括匿名函数）作为回调参数传递进去。\n\
  \n\n![image](img/image-TAHGE1VP.png)\n\n## 作为命名空间的函数\n\n\n在 JavaScript 中，函数也可以被用作命名空间来封装相关功能，并避免与其他代码发生命名冲突。这里有一个示例：\n\
  \n![image](img/image-YR5VXWWV.png)\n\n\n通过将函数作为命名空间，我们可以将相关功能组合在一起，避免大量的变量和函数污染全局命名空间。这可以使我们的代码更有组织性，并且更容易阅读和维护。\n\
  \n![image](img/image-TAHGE1VP.png)\n\n\n![image](img/image-3UHZA0MF.png)\n\n在 JavaScript\
  \ 中，闭包是一个可以访问其外部函数作用域的函数，即使在外部函数已经返回后也是如此。闭包允许一种称为“部分应用”（partial application）的编程技术，允许你根据现有函数创建新函数，并预先填充部分参数。这里有一个示例：\n\
  \n\n在这个例子中，我们定义了一个名为 `createMultiplier` 的函数，它接收一个 `multiplier` 参数并返回一个新函数，该新函数将其参数乘以\
  \ `multiplier`。然后我们使用参数 `2` 调用该函数，并将返回的函数赋值给变量 `double`。当我们使用参数 `5` 调用 `double`\
  \ 时，它返回 `10`，这就是 `5` 乘以 `2` 的结果。\n\n这种之所以有效，是因为内部函数可以访问外部函数作用域中的 `multiplier` 变量，即使外部函数已经返回。这是可能的因为\
  \ JavaScript 支持词法作用域（lexical scoping），这意味着在外部函数中声明的变量对于该函数内部声明的任何内部函数都是可见，无论外部函数是否返回。\n\
