  \ 中，对象创建表达式是使用对象构造函数或对象字面量创建新对象的一种。对象创建表达式是 JavaScript 中的基础工具，允许编写动态、灵活且可重用的代码。理解对象创建表达式对于编写高效且无错误的\
  \ JavaScript 代码非常重要。让我们通过一些示例来探索 JavaScript 中对象创建表达式的概念。\n\n\n\n\n# 对象 (Object)\n\
  \n对象构造函数是用于创建具有特定属性和方法的新对象的函数。它们通常以大写字母开头的命名，并使用关键字定义属性和方法。这是一个示例：\n\n```javascript\n\
  function Person(name, age) {\n  this.name = name;\n  this.sayHello = function()\
  \ {\n    console.log(\"Hello, \" + this.name + \"!\");\n  };\n}\n\nperson.sayHello();\
  \ // 输出 \"Hello, John!\"\n```\n\n在这个示例中，构造函数用于创建一个具有 `name` 和 `age` 属性以及 `sayHello`\
  \ 方法的新对象。\n\n## 对象字面量 (Object Literals)\n对象字面量是创建具有特定属性和方法的对象的快捷方式。它们用一对大括号定义，键值对之间用逗号分隔。这是一个示例：\n\
  ![image](img/image-VF2ZQIH0.png)\n\n在这个示例中，对象字面量用于创建一个具有这些属性和方法的新对象。\n\n## 方法 (Method)\n\
