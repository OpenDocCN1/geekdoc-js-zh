  \n## 复合与空语句\n\n![image](img/image-3UHZA0MF.png)\n在 JavaScript 中，复合和空语句用于将语句组合在一起或创建不执行任何操作的语句。复合和空语句是\
  \ JavaScript 中的一种基础工具，允许编写动态、灵活且可重用的代码。理解这些语句对于编写高效且无错误的 JavaScript 代码至关重要。让我们通过一些示例来探索\
  \ JavaScript 中的复合与空语句。\n\n### 复合语句\n\n复合语句（称为块语句）用于将一组语句组合成代码块。复合语句包含在大括号 `{}` 中，可以包含任意数量的语句。以下是一些示例：\n\
