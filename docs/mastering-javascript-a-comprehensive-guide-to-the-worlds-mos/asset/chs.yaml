  \ 的示例：\n\n![image](img/image-5V6ZFN14.png)在这个示例中，我们导入了 `org.mozilla.javascript`\
  \ 包并使用 `enter()` 方法创建了一个 `Context` 对象。然后我们使用 `initStandardObjects()` 方法初始化了一个 `Scriptable`\
  \ 作用域。我们定义了一个名为 `script` 的 JavaScript 代码字符串，将 `x` 和 `y` 分别设置为 10 和 20，然后将它们相加。我们使用\
  \ `cx.evaluateString()` 方法在作用域中执行 JavaScript 代码。`<cmd>\"` 参数是文件名，`1` 参数是用于错误信息的行号。`result`\
