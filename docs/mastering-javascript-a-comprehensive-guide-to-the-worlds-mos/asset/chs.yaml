  \n## 类与类型\n\n\n\n\nJavaScript 是一种动态类型语言，这意味着变量和值可以在运行时更改它们的类型。JavaScript 中的类并不像\
  \ `Java` 或 `C++` 等其他面向对象的语言那样强制执行严格的类型或继承。相反，JavaScript 中的类用于定义具有共享属性和行为的对象。\n\n\
  这里有一个示例：\n![image](img/image-EULDB1LU.png)\n\n在这个示例中，我们定义了一个名为 `Person` 的类，它包含一个构造函数，接收两个参数\
  \ `name` 和 `age`，并使用 `this` 关键字将它们设置为新创建对象的属性。我们还为该类添加了一个名为 `sayHello` 的方法，该方法使用对象的\
  \ `name` 和 `age` 属性向控制台打印消息。\n\n然后，我们使用 `Person` 构造函数创建了一个新对象，并将其赋值给变量 `john`。我们可以在\
  \ `john` 对象上调用 `sayHello` 方法向控制台打印消息。\n我们还定义了另一个名为 `jane` 的对象，它具有与 `Person` 类相同的属性和方法，但它是使用对象字面量创建创建。我们也可以在\
  \ `jane` 对象上调用 `sayHello` 方法向控制台打印消息。\n\n![image](img/image-TAHGE1VP.png)\n\n##\
  \ JavaScript 中的面向对象技术\n![image](img/image-3UHZA0MF.png)\n\nJavaScript 支持许多面向对象的技术，包括封装、继承和多态。\n\
  \n封装指的是隐藏对象的实现细节并仅暴露其公共接口的实践。在 JavaScript 中，你可以使用闭包和模块来实现封装。这里有一个示例：\n\n![image](img/image-MWF2DERO.png)\n\
  在这个示例中，我们使用立即调用函数表达式（IIFE）定义了一个名为 `Person` 的模块。该模块具有名为 `name` 和 `age` 的私有变量，以及名为\
  \ `setName`、`setAge`、`getName` 和 `getAge` 的私有函数。然后，我们返回了一个只包含公共方法的对象，这些方法可以从模块外部访问。\n\
  \n继承指的是创建新类并从现有类继承属性和方法的实践。在 JavaScript 中，你可以使用原型和 `Object.create()` 方法来实现继承。这里有一个示例：\n\
  \n![image](img/image-K8TCEO7K.png)\n在这个示例中，我们定义了一个 `Animal` 类，带有一个 `speak` 方法可以向控制台打印消息。然后，我们使用\
  \ `Object.create()` 方法定义了一个继承自 `Animal` 的 `Dog` 类。我们还为 `Dog` 定义了一个 `speak` 方法，覆盖了\
  \ `Animal` 中的 `speak` 方法。\n\n多态指的是将不同类型的对象视为相同类型的实践，只要它们具有共同接口。在 JavaScript 中，你可以通过使用鸭类型（duck\
  \ typing）来实现多态，这意味着你检查某些属性或方法是否存在，而不是检查对象的类型。这里有一个示例：\n\n![image](img/image-NH259BV4.png)\n\
  在这个示例中，我们定义了两个对象 `cat` 和 `dog`，它们都有一个 `name` 属性和一个 `speak` 方法。我们还定义了一个 `speak` 函数，它接收一个对象并调用它的\
  \ `speak` 方法。我们可以将 `cat` 和 `dog` 传递给 `speak` 函数，即使它们是不同类型的对象，因为它们都拥有 `speak` 方法。\n\
  \n![image](img/image-TAHGE1VP.png)\n\n## 子类\n\n![image](img/image-3UHZA0MF.png)\n\
  在 JavaScript 中，你可以使用 `extends` 关键字创建继承自父类属性和方法的子类。这里有一个示例：\n\n![image](img/image-WSEQCNP5.png)\n\
  \n在这个示例中，我们定义了一个 `Animal` 类，其构造函数接收一个 `name` 参数并使用 `this` 关键字将其设置为对象的属性。我们还为该类添加了一个\
  \ `speak` 方法，向控制台打印消息。\n然后，我们使用 `extends` 关键字定义了一个扩展 `Animal` 的 `Dog` 类。这意味着 `Dog`\
  \ 继承了 `Animal` 的所有属性和方法。我们还为 `Dog` 定义了一个 `speak` 方法，覆盖了 `Animal` 中的 `speak` 方法。\n\
  \n最后，我们使用 `Dog` 构造函数创建了一个新对象，并将其赋值给变量 `d`。我们可以在 `d` 对象上调用 `speak` 方法向控制台打印消息。\n\n\
  ![image](img/image-TAHGE1VP.png)\n## ECMAScript 5 中的类\n\n![image](img/image-3UHZA0MF.png)\n\
  ECMAScript 5 (ES5) 是 JavaScript 规范的一个旧版本，不支持用于创建类和子类的 `class` 关键字或 `extends` 关键字。然而，在\
  \ ES5 中仍然可以使用构造函数和原型定义类。\n\n这里有一个示例：\n\n![image](img/image-VHUE3QJH.png)\n在这个示例中，我们定义了一个\
  \ `Animal` 构造函数，带有一个 `speak` 方法可以向控制台打印消息。然后，我们定义了一个 `Dog` 构造函数，通过通过带 `this` 关键字调用\
  \ `Animal` 并传递 `name` 参数来继承 `Animal`。\n\n然后，我们使用 `Object.create()` 创建了一个以 `Animal.prototype`\
  \ 为原型的新对象，并将其设置为 `Dog.prototype` 的原型。这建立了 `Dog` 和 `Animal` 之间的继承关系。\n\n最后，我们为 `Dog`\
  \ 定义了一个 `speak` 方法，覆盖了 `Animal` 中的 `speak` 方法。我们使用 `Dog` 构造函数创建了一个新对象并将其赋值给变量 `d`。我们可以在\
  \ `d` 对象上调用 `speak` 方法向控制台打印消息。\n![image](img/image-TAHGE1VP.png)\n\n## 服务端 JavaScript\n\
