  \ 是 JavaScript 中的一种特殊值，用于表示刻值的缺失。以下是一些 null 值的示例：\n\n![image](img/image-9VFYB6QW.png)\n\
  \n`null` 通常表示变量或属性没有值或被有意地设置为 `null`。\n\n\n虽然 `null` 和 `undefined` 看起来相似，但它们之间存在重要的区别。以下是一些关键区别：\n\
  \n- `undefined` 是 JavaScript 中的一种原始值，而 `null` 是一个对象。\n- `undefined` 可以作为函数参数的值，而\
  \ `null` 不能。\n- 使用 `==` 运算符比较 `null` 和 `undefined` 时，它们被认为是相等的，但不相同（即 `null == undefined`\
  \ 为 true，但 `null === undefined` 为 false）。\n\n\n\n\n\n\n\n-   使用 `undefined` 表示未初始化的变量或属性。\n\
  -   使用 `null` 表示值的刻意缺失。\n-   注意 `null` 和 `undefined` 之间的区别，并恰善使用它们。\n-   避免在算术操作中使用\
  \ `null` 或 `undefined`，因为它们可能会导致意外之外的结果。\n![image](img/image-TAHGE1VP.png)\n\n##\
  \ 全局对象\n\n![image](img/image-3UHZA0MF.png)\n在 JavaScript 中，全局对象是一个在代码的所有部分都可用的特殊对象。它提供了对多种内置函数和对象的访问，例如\
  \ `console`、`Math` 和 `Date`，并用于定义可以从代码任何地方访问的全局变量和函数。让我们通过示例来探索 JavaScript 中全局对象的概念。\n\
