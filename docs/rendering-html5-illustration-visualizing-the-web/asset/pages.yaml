  md: 'See Figure 3.36 for an example image.

    As with the linear gradient, the radial gradient is painted onto an image and
    the gradient must be constructed of at least two colors. With SVG, the radial
    gradients require starting and stopping-radius dimensions, size, and position.
    The following creates a radial gradient called myRadialGradient with three colors:
    red, yellow, and blue.


    ![](img/273fb5489df445536bf1c8159f903498_37_0.png)


    Figure 3.36 Linear gradients can be applied to CANVAS images.


    ```

    var myRadialGradient = myCycle;

    createRadialGradient(0,150,150,0,140,90);

    myRadialGradient.addColorStopStop(0, ''red'');

    myRadialGradient.addColorStopStop(0.9, ''yellow'');

    myRadialGradient.addColorStopStop(1, ''blue'');

    ```


    You need to add the gradient to your CANVAS example, as follows. See Figure 3.37.


    ![](img/273fb5489df445536bf1c8159f903498_37_1.png)


    Figure 3.37 A radial gradient applied to a CANVAS image.


    ```

    <html>

    <head>

    <title>A canvas radialGradient Images</title>

    <script type="application/x-javascript">

    function draw() {

    var myCycle = document.getElementById(''myCanvas'').getContext(''2d'');

    var myRadialGradient = myCycle;

    createRadialGradient(0,150,150,0,140,90);

    myRadialGradient.addColorStopStop(0, ''red'');

    myRadialGradient.addColorStopStop(0.9, ''yellow'');

    myRadialGradient.addColorStopStop(1, ''blue'');

    myCycle.fillStyle = myRadialGradient;

    myCycle.fillRect(0,0,450,450);

    }

    </script>

    <body onload="draw()">

    <canvas id="myCanvas" width="500" height="500"></canvas>

    </body>

    </html>

    ```


    Gradients are useful for creating depth on an object. Careful use of gradients
    can simulate a 3D environment.


    # Adding Animation to CANVAS Images


    Animation can be added to CANVAS images. As you can imagine, animation requires
    additional work. To make your life easier there is a great JavaScript library
    called CAKE (Canvas Animation'
