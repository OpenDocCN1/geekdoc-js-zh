    # Understanding the Basics of Creating Shapes


    As with HTML, SVG is built of elements. The difference between SVG and HTML is
    the elements in SVG used to construct images. The main elements you will use in
    building your drawings are:


    +   * LINE—for defining lines

    * POLYLINE—for defining shapes constructed of lines

    * RECT—for defining rectangles

    * CIRCLE—for defining circles

    * ELLIPSE—for defining ellipses

    * POLYGON—for defining polygons

    * PATH—for defining arbitrary paths


    The most basic drawing for SVG is a line. To define a straight line you need to
    declare where the line starts on the X and Y axes and where the line ends on the
    X and Y axes. This is referred to as X1, Y1 and X2, Y2. Here is an example of
    a straight line.


    ```

    <xml version="1.0" standalone="no"?>

    <!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"

    "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">

    <svg width="100%" height="100%" version="1.1"

    xmlns="http://www.w3.org/2000/svg">

    <line x1="25" y1="150" x2="300" y2="150"

    style="stroke:red;stroke-width:10"/>

    ```


    In this example the line starts 25 pixels from the left side of the browser window,
    and the line is horizontal along the Y axis. Figure 3.7 is how it looks in your
    web browser with additional CSS stroke to emphasize the line.


    ![](img/273fb5489df445536bf1c8159f903498_10_0.png)


    Figure 3.7 A line is drawn in SVG using the LINE element.'
