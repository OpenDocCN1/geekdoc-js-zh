    # Creating SVG Graphics


    If you are comfortable working with HTML code then you will feel comfortable working
    with SVG. SVG is an XML-based drawing language that allows you to describe your
    drawing using standard XML elements. For instance, the following code is describing
    how to create a star shape. Figure 3.5 shows the resulting SVG drawing.


    ```

    <xml version="1.0" standalone="yes">

    <svg version="1.1"

    viewBox="0.0 0.0 720.0 540.0"

    fill="none" stroke="none">

    ```


    ![](img/273fb5489df445536bf1c8159f903498_6_1.png)


    Figure 3.5 A star drawn using SVG XML syntax.'
