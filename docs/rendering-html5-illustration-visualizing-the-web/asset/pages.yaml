    ```


    You can see that the rectangle image uses a URL string to find the style called
    #yellow_red. The yellow_red color style is the name of the gradient. See Figure
    3.20.


    Radial gradients are similar to linear gradients. The difference is that you essentially
    draw two circles—an outer and inner circle—with the radial gradient. As linear
    gradients, the RADIALGRAD element requires a valid ID name to identify the gradient.
    Following that, you have five attributes to define the inner circle and radius.
    Following is an example where the CX and CY attributes are the outer circle, R
    is the radius, and the FX and FY attributes are the inner circle.


    ```

    <radialGradient id="yellow_red" cx="50%" cy="50%"

    r="50%"

    fx="50%" fy="50%">

    ```


    The colors for the gradient are defined using a STOP list. The following code
    shows the radial gradient applied to a rectangle.


    ![](img/273fb5489df445536bf1c8159f903498_20_0.png)


    Figure 3.20 Linear gradients can be drawn horizontally.'
