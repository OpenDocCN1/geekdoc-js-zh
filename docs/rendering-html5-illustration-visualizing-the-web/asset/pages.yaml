    The most complex element you will create using SVG is the PATH element. Each drawing
    you create with the PATH element is built using a series of special codes that
    explain where the line is supposed to move to on the screen. These codes are:


    +   * M moves to

    * L = line to

    * H = horizontal line to

    * V = vertical line to

    * C = curve to

    * S = smooth curve to

    * Q = quadratic Bezier curve to

    * T = smooth quadratic Bezier curve to

    * A = elliptical arc to

    * Z = close path to


