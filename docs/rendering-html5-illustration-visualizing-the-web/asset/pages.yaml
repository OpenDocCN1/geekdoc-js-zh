    The offset attribute dictates where in the gradient starts. The example above
    draws a smooth gradient change over the space of the image. The style attribute
    allows you to list any CSS-specific color. You can add the two colors to the LINEARGRADIENT
    in the following example.


    ```

    <xml version="1.0" standalone="no"?>

