  md: "31\n\n+   - Radius—the size of the circle.\n- startAngle—the start point of\
    \ the arc.\n- endAngle—the end point of the arc.\n- anticlockwise—a Boolean value\
    \ that dictates the direction\ncircle is drawn.\n\nThe following code describes\
    \ the structure of an arc:\ncontext.arc(260,260,250,0,7,true);\n\nFigure 3.33\
    \ shows the circle as it is drawn on the page.\nThe following code embeds the\
    \ Arc method and instructions into a CANVAS drawing.\n\n![](img/273fb5489df445536bf1c8159f903498_34_0.png)\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Canvas - Creating a Circle</title>\n\
    \  <script type=\"text/javascript\">\n    window.onload = function() {\n     \
    \ var drawingCanvas = document.getElementById('myCircle');\n      if (drawingCanvas\
    \ && drawingCanvas) {\n        var context = drawingCanvas.getContext('2d');\n\
    \        context.strokeStyle = \"yellow\";\n        context.fillStyle = \"red\"\
    ;\n        context.lineWidth = 20;\n        context.beginPath();\n        context.arc(260,260,250,0,Math.PI*2,true);\n\
    \        context.closePath();\n        context.stroke();\n        context.fill();\n\
    \      }\n    }\n  </script>\n</head>\n<body>\n  <canvas id=\"myCircle\" width=\"\
    550\" height=\"550\"></canvas>\n</body>\n</html>\n```\n\nFigure 3.34 illustrates\
    \ how you can add color to your circles.\nin addition to the Arc method you can\
    \ also add Bezier and quadratic curves, both of which are mathematical calculations\
    \ for creating an image. Bezier curves were developed by French mathematician\
