  md: "25\n\nThe only browser that currently does not support CANVAS is Microsoft's\
    \ Internet Explorer. You can, however, add CANVAS support to Internet Explorer\
    \ through a plug-in called ExplorerCanvas, which can be downloaded at http://excanvas.sourceforge.net/\n\
    \nAt the end of the day, SVG is a good solution, whereas CANVAS is an exciting\
    \ emerging solution. A lot of technology from Google, Apple, Opera, and Mozilla\
    \ is being invested into expanding the functionality of CANVAS.\n\n# Starting\
    \ with the Basics\n\nThere are two parts you need to create a visual element using\
    \ CANVAS. The first is the CANVAS element itself used in your HTML. In many ways,\
    \ the CANVAS element is very much the same as any other element used in HTML.\
    \ Here is an example:\n\n```\n<canvas id=\"myCanvas\" width=\"640\" height=\"\
    480\">\n</canvas>\n```\n\nThe tag uses the new HTML5 CANVAS as the opening and\
    \ closing tag. The width and height attributes specify the size of the CANVAS\
    \ on the screen. It is the ID that is important. The ID is \"myCanvas\".\n\nUsing\
    \ JavaScript, you can now program the illustration that will appear in the CANVAS\
    \ tag. The following example creates a black, outlined square that appears in\
    \ your web page using JavaScript and Canvas.\n\n```\n<html>\n<head>\n<title>Basic\
    \ Canvas Drawing</title>\n<script type=\"text/javascript\">\nfunction draw() {\n\
