  md: "myRectangle.fillRect(10,10,650,650);\n\nThe next step is to create a new variable\
    \ that declares a new gradient. The following line creates a new gradient that\
    \ is named verticalGradient. The name is arbitrary; what is not arbitrary is the\
    \ description of the gradient type that follows the name.\n\n```\nvar verticalGradient\
    \ = myRectangle.createLinearGradient\n(0,0,0,650);\n```\n\nHere you are associating\
    \ the gradient with the CANVAS object myRectangle. At this point the gradient\
    \ will not paint the image that comes later—the code at this point merely associates\
    \ the gradient and the image. The property createLinearGradient dictates where\
    \ the gradient will paint an object. The parenthesis are the X and Y axes and\
    \ height and width.\n\nA gradient must have at least two colors. The following\
    \ will paint a gradient color that starts red and then transitions 50% through\
    \ the image to yellow.\n\n```\nverticalGradient.addColorStop(0, 'red');\nverticalGradient.addColorStop(0.5,\
    \ 'yellow');\n```\n\nThe final step is to use the paintStyle property to paint\
    \ the gradient into the rectangle:\n\n```\nmyRectangle.setStyle = verticalGradient;\n\
    ```\n\nThe whole CANVAS script looks as follows.\n\n```\n<html>\n<head>\n  <title>Linear\
    \ Gradient</title>\n  <script type=\"application/x-javascript\">\n  function draw()\
    \ {\n    var myRectangle = document.getElementById('myCanvas').getContext('2d');\n\
    \    var verticalGradient = myRectangle;\n    createLinearGradient(0,0,0,650);\n\
    \    verticalGradient.addColorStop(0, 'red');\n    verticalGradient.addColorStop(0.5,\
    \ 'yellow');\n    myRectangle.setStyle = verticalGradient;\n    myRectangle.fillRect(10,10,650,650);\n\
    \  }\n</script>\n</head>\n<body onload=\"draw();\">\n  <canvas id=\"myCanvas\"\
    \ width=\"800\" height=\"800\"></canvas>\n</body>\n</html>\n```"
