  md: "# 32\n\n![](img/273fb5489df445536bf1c8159f903498_35_0.png)\n\nA quadratic curve\
    \ is based on the Bezier curve. The difference is that the quadratic curve is\
    \ constructed of three points of definition instead of just one. It can be difficult\
    \ to draw complex, Bezier curve images in CANVAS for a single, simple reason:\
    \ There are no visual drawing tools, such as Adobe Illustrator, to export images\
    \ that can be read by the CANVAS element.\n\nFigure 3.35 A Bezier curve.\n\n#\
    \ Adding Color\n\nSo you now have basic shapes on the page. Big deal, right? Using\
    \ JavaScript you can now begin to programmatically paint your objects. The following\
    \ shows two semitransparent squares. You will see that the fill color is a CSS\
    \ style.\n\n```\n<html>\n<head>\n<script type=\"application/x-javascript\">\n\
    function draw() {\n  var canvas = document.getElementById(\"myCanvas\");\n  if\
    \ (canvas.getContext) {\n    var ctx = canvas.getContext(\"2d\");\n    ctx.fillStyle\
    \ = \"rgb(0,0,0)\";\n    ctx.fillRect(10, 10, 150, 150);\n    ctx.fillStyle =\
    \ \"rgba(0, 300, 0, 0.5)\";\n    ctx.fillRect(75, 75, 150, 150);\n  }\n}\n</script>\n\
    </head>\n<body onload=\"draw();\">\n<canvas id=\"myCanvas\" width=\"300\"></canvas>\n\
    </body>\n</html>\n```\n\nThe fill method allows you to apply CSS style formatting.\
    \ CSS increases the amount of visual control you have over your drawings on the\
    \ screen. As SVG you can use any of the CSS color naming formats as Hex and RGB.\n\
    \nLinear and radial gradients can also be applied to CANVAS images. With SVG,\
    \ the linear and radial gradients inherit how CSS implements gradients. The gradient\
    \ construction is developed by creating a shape, giving the gradient name, defining\
    \ the gradient, and then applying the gradient.\n\nThe first step is to create\
    \ a shape. The following is a simple CANVAS rectangle:"
