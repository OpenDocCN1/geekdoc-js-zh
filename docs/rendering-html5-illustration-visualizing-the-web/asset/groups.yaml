  - '[PAGE 37]


    See Figure 3.36 for an example image.

    As with the linear gradient, the radial gradient is painted onto an image and
    the gradient must be constructed of at least two colors. With SVG, the radial
    gradients require starting and stopping-radius dimensions, size, and position.
    The following creates a radial gradient called myRadialGradient with three colors:
    red, yellow, and blue.


    ![](img/273fb5489df445536bf1c8159f903498_37_0.png)


    Figure 3.36 Linear gradients can be applied to CANVAS images.


    ```

    var myRadialGradient = myCycle;

    createRadialGradient(0,150,150,0,140,90);

    myRadialGradient.addColorStopStop(0, ''red'');

    myRadialGradient.addColorStopStop(0.9, ''yellow'');

    myRadialGradient.addColorStopStop(1, ''blue'');

    ```


    You need to add the gradient to your CANVAS example, as follows. See Figure 3.37.


    ![](img/273fb5489df445536bf1c8159f903498_37_1.png)


    Figure 3.37 A radial gradient applied to a CANVAS image.


    ```

    <html>

    <head>

    <title>A canvas radialGradient Images</title>

    <script type="application/x-javascript">

    function draw() {

    var myCycle = document.getElementById(''myCanvas'').getContext(''2d'');

    var myRadialGradient = myCycle;

    createRadialGradient(0,150,150,0,140,90);

    myRadialGradient.addColorStopStop(0, ''red'');

    myRadialGradient.addColorStopStop(0.9, ''yellow'');

    myRadialGradient.addColorStopStop(1, ''blue'');

    myCycle.fillStyle = myRadialGradient;

    myCycle.fillRect(0,0,450,450);

    }

    </script>

    <body onload="draw()">

    <canvas id="myCanvas" width="500" height="500"></canvas>

    </body>

    </html>

    ```


    Gradients are useful for creating depth on an object. Careful use of gradients
    can simulate a 3D environment.


    # Adding Animation to CANVAS Images


    Animation can be added to CANVAS images. As you can imagine, animation requires
    additional work. To make your life easier there is a great JavaScript library
    called CAKE (Canvas Animation'
  - "[PAGE 38]\n\nKit Experiment) that you can download at http://code.google.com/p/cakejs/.\
    \ Using the CAKE library you can easily create CANVAS-based animation. The following\
    \ code will create a pulsing blue circle.\n\n```\nwindow.onload = function ()\
    \ {\n  var CAKECanvas = new Canvas(document.body, 600, 400);\n  var myCircle =\
    \ new Circle(100, \n    {\n      id: 'myCircle',\n      x: CAKECanvas.width /\
    \ 3,\n      y: CAKECanvas.height / 2,\n      stroke: 'blue',\n      strokeWidth:\
    \ 20,\n      endAngle: Math.PI*2\n    }\n  );\n  myCircle.addFrameListener(\n\
    \    function (t, dt) {\n      this.scale = Math.sin(t / 1000);\n    }\n  );\n\
    \  CAKECanvas.append(myCircle);\n}\n```\n\nThe final you need to ensure that your\
    \ animation works is to download the CAKE library files to your Web site. The\
    \ files can be downloaded at http://glim.rubyforge.org/cake/. You will need to\
    \ use the SAKE JS library to save your Web site. In the HEAD section of your page\
    \ you will need to make a linked reference to the CAKE library. It will look like\
    \ this:\n\n```\n<script type=\"text/javascript\" src=\"cake.js\"></script>\n```\n\
    \nTo accomplish the action use the Scale method. The effect is very similar to\
    \ Adobe's Flash, but with the benefit of running correctly on web browsers on\
    \ mobile devices such as the iPhone, MyTouch, and Palm Pre.\n\nThe introduction\
    \ of CANVAS and SVG gives you great opportunities to create complex and compelling\
    \ illustrations inside your HTML5 web pages. It is fair to say that CANVAS is\
    \ still growing in technical scope. Expect additions and changes to the technology\
    \ over the next few years. A big addition will be the inclusion of 3D within CANVAS."
- md: "\n# What You Have Learned\n\nThis article introduced you to scalable vector\
    \ graphics (SVG) and the CANVAS element. These two technologies enable you to\
    \ programmatically build images inside of your web pages without needing graphic\
    \ tools such as Adobe Illustrator, Flash, or Photoshop.\n\n# focal press books\n\
    \nVISUALIZING THE WEB WITH HTML 5\nDownload these other great articles in the\
    \ HTML5: Visualizing the Web series\n\n# HTML5 Rich Media Foundation\n\nLearn\
    \ about the new ways in which video and audio can be easily embedded into your\
    \ HTML5 Web pages. Discover how you can create new Web media content and how JavaScript,\
    \ CSS, and SVG can be integrated to create a compelling, rich media foundation\
    \ for your work.\n\n# Picture CSS3\n\nSee how you can use Cascading Style Sheets\
    \ 3, or CSS3, to quickly and easily increase your control over visual Web page\
    \ design. \n\n# The HTML5 JavaScript Model\n\nJavaScript is the glue that enables\
    \ HTML to become interactive. Learn how you can leverage JavaScript Libraries\
    \ to build beautiful Web applications.\n\n# Rendering HTML5 Illustration\n\nScalable\
    \ Vector Graphics (SVG) and CANVAS are two new tools introduced in HTML5 that\
    \ you can use to add illustration and interactive animation to your Web pages.\
    \ Understand why there are two different formats, how you can use them, and where\
    \ they can be used today.\n\n# HTML5 Tag Structure\n\nTake a gander at the new\
    \ HTML5 elements: how you can take advantage of them and what you need to look\
    \ out for as you design your new Web sites.\n\nAnd look for the HTML5: Visualizing\
    \ the Web book coming in July 2010. The book will feature information and resources\
    \ that expand on the 5-part series.\n\nVisit focalpress.com for video tutorials,\
    \ sample chapters, podcasts and exclusive competitions and discounts.\n\nfocalpress.com\n"
