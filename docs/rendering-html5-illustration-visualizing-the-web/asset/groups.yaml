    </script>\n<style type=\"text/css\">\ncanvas { border: 1px solid black; }\n</style>\n\
    </head>\n<body onload=\"draw();\">\n<canvas id=\"myCanvas\" width=\"150\" height=\"\
    150\"></canvas>\n</body>\n</html>\n```"
