- md: "\nRectangle shapes can be created in SVG using the RECT element. The RECT element\
    \ has two attributes, width and height. The following SVG adds a rectangle of\
    \ width 400 pixels and height 400 pixels. Additional styling using CSS has been\
    \ added to the drawing so you can see it. The results are shown in Figure 3.11.\n\
    \n```xml\n<?xml version=\"1.0\" standalone=\"no\"?>\n<!DOCTYPE svg PUBLIC \"//W3C//DTD\
    \ SVG 1.1//EN\"\n\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\">\n<svg width=\"\
    100%\" height=\"100%\" version=\"1.1\"\nxmlns=\"http://www.w3.org/2000/svg\">\n\
    <rect width=\"400\" height=\"400\"\nstyle=\"fill:red;stroke-width:5;\nstroke:yellow\"\
    />\n</svg>\n```\n\nCreating circles is similar to creating rectangles in SVG.\
    \ At its most basic, you use the CIRC element. The CIRC element only requires\
    \ that you define the radius of the circle using an R attribute. The following\
    \ SVG code draws a circle with a radius of 150 pixels.\n\n![](img/273fb5489df445536bf1c8159f903498_13_0.png)\n\
    \nFigure 3.11 The RECT element allows you to easily create rectangle shapes such\
    \ as this square.\n\n```xml\n<?xml version=\"1.0\" standalone=\"no\"?>\n<!DOCTYPE\
    \ svg PUBLIC \"-//W3C//DTD SVG 1.1//EN\">\n<http=\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
    >\n<svg width=\"100%\" height=\"100%\" version=\"1.1\"\nxmlns=\"http://www.w3.org/2000/svg\"\
    >\n<circle r=\"150\" stroke=\"yellow\"\nstroke-width=\"5\" fill=\"red\"/>\n</svg>\n\
    ```\n\nFigure 3.12 shows results of the CIRCLE element in more detail.\n\nAs you\
    \ can see in the figure, defining the radius forces most of the circle to drop\
    \ off the top-left corner of the browser window. To correct this you can use two\
    \ additional, optional attributes, Cx and CY, to define the X and Y positions\
    \ of the circle on the screen.\n\n```xml\n<?xml version=\"1.0\" standalone=\"\
    no\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 1.1//EN\">\n<http=\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
    >\n<svg width=\"100%\" height=\"100%\" version=\"1.1\"\nxmlns=\"http://www.w3.org/2000/svg\"\
    >\n<circle cx=\"160\" cy=\"160\" r=\"150\" stroke=\"yellow\"\nstroke-width=\"\
    5\" fill=\"red\"/>\n</svg>\n```\n\nFigure 3.13 shows the use of these attributes.\n\
    \n![](img/273fb5489df445536bf1c8159f903498_14_0.png)\n\nFigure 3.12 the CIRCLE\
    \ element allows you to draw circles on the screen.\n\n![](img/273fb5489df445536bf1c8159f903498_15_0.png)\n\
    \nThe ELLIPSE element extends the functionality of the CIRCLE element by allowing\
    \ you to control radius along the X and Y axes using the RX and RY attributes.\
    \ You will see in the following code that the ELLIPSE element also leverages the\
    \ CIRCLE element's CX and CY attributes to position the ellipse in the web browser.\
    \ Figure 3.14 shows the results\n\n```xml\n<?xml version=\"1.0\" standalone=\"\
    no\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 1.1//EN\"\nn=\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
    >\n<svg width=\"100%\" height=\"100%\" version=\"1.1\"\nxmlns=\"http://www.w3.org/2000/svg\"\
    >\n<ellipse cx=\"300\" cy=\"150\" rx=\"250\" ry=\"120\"\nstyle=\"fill:yellow;\n\
    stroke:red;stroke-width:5\"/>\n</svg>\n```\n\n![](img/273fb5489df445536bf1c8159f903498_15_1.png)\n\
    \nA POLYGON is similar to the POLYLINE element. Using X and Y values you can draw\
    \ whole shapes. The following is an example of a triangle. Figure 3.15 shows the\
    \ results.\n\n![](img/273fb5489df445536bf1c8159f903498_16_0.png)\n\nFigure 3.15\
    \ A triangle is created by the POLYGON element.\n\n```xml\n<?xml version=\"1.0\"\
    \ standalone=\"no\"?>\n<!DOCTYPE svg PUBLIC \"//W3C//DTD SVG 1.1//EN\"\n\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
    >\n<svg width=\"100%\" height=\"100%\" version=\"1.1\"\nxmlns=\"http://www.w3.org/2000/svg\"\
    >\n<polygon points=\"220,100 290,220 150,220\"\nstyle=\"fill:yellow;\nstroke:red;stroke-width:5\"\
    />\n</svg>\n```\n\nThe most complex element you will create using SVG is the PATH\
    \ element. Each drawing you create with the PATH element is built using a series\
    \ of special codes that explain where the line is supposed to move on the screen.\
    \ These codes are:\n\n- M moves to\n- L = line to\n- H = horizontal line\n- V\
    \ = vertical line\n- C = curve to\n- S = smooth curve\n- Q = quadratic Bezier\
    \ curve\n- T = smooth Bezier curve\n- A = elliptical arc\n- Z = close path\n\n\
    The following code creates a smiley illustration using the drawing. Figure 3.16\
    \ shows the results from the code.\n\n```xml\n<?xml version=\"1.0\" standalone=\"\
    yes\"?>\n<svg version=\"1.1\" viewBox=\"0.0 152.0 864.0\"\nfill=\"none\" stroke=\"\
    none\" stroke-linecap=\"square\"\nstroke-miter=\"10\" xmlns=\"http://www.w3.org/2000/svg\"\
    \nxmlns:link=\"http://www.w3.org/1999/xlink\">\n<path d=\"M556 108 L556 108 C216,150\
    \ 180,184 332,184 C216,66 216,50 156,108 Z\"\nfill-rule=\"nonzero\" fill=\"#ff0ff\"\
    /></path>\n```\n\n![](img/273fb5489df445536bf1c8159f903498_16_1.png)\n\nFigure\
    \ 3.16 The POLYGON element allows you to create complex images such as this smiley\
    \ face.\n\n```xml\n<path d=\"M102 85 C102,81 106,77 110,77 C119,81 119,85 C119,90\
    \ 115,93 106,93 102,90 102,85 M153,85 C153,81 157,77 162,77 C166,81 170,85 C170,90\
    \ 166,93 162,93 C157,93 153,90 153,85\"\nfill-rule=\"nonzero\" fill=\"#ccc00\"\
    \nstroke stroke-width=\"2.0\"\nstroke-linejoin=\"round\" stroke-linecap=\"butt\"\
    /></path>\n<path d=\"M93,141 Q136,169 179,141 184,56\"\nfill-rule=\"nonzero\"\
    \ stroke=\"#ff0000\" stroke-width=\"2.0\"\nstroke-linejoin=\"round\" stroke-linecap=\"\
    butt\"/></path>\n<path d=\"M56,108 C156,108 56,66 92,32 136,32 C180,32 216,66\
    \ 216,108 C216,180 184,136 142,92 184,56 150,56\"\nfill-rule=\"nonzero\" stroke=\"\
    #ff0000\"\nstroke-width=\"2.0\" stroke-linejoin=\"round\"\nstroke-linecap=\"butt\"\
    /></path>\n</svg>\n```\n\nAs you can see, it is quite complex to create PATH-defined\
    \ illustrations. For this reason, it is recommended that you use an SVG drawing\
    \ tool to create PATH-based illustrations (more on that later).\n\n## Adding CSS-Based\
    \ Color\n\nSVG is a technology that allows you to create drawings. To add color\
    \ to these drawings, you leverage Cascading Style Sheets. There is no need to\
    \ use a different technology as CSS and SVG are partners in HTML5. Both have strengths\
    \ that can be enhanced with each other.\n\nTo provide an example, let us look\
    \ at the ellipse drawing earlier (see Figure 3.14).\n\n```xml\n<?xml version=\"\
    1.0\" standalone=\"no\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 1.1//EN\"\n\"\
    http://www.w3.org/Graphics/SVG/1.1/svg1.1.dtd\">\n<svg width=\"100%\" height=\"\
    100%\" version=\"1.1\"\nxmlns=\"http://www.w3.org/2000/svg\">\n<ellipse cx=\"\
    300\" cy=\"150\" rx=\"250\" ry=\"120\"\nstyle=\"fill:yellow;\nstroke:red;stroke-width:5\"\
    />\n</svg>\n```\n\n![](img/273fb5489df445536bf1c8159f903498_18_0.png)\n\nAfter\
    \ the ellipse is drawn there is a style attribute. The style attribute allows\
    \ you to add CSS style to the image. In HTML it behaves exactly the same. Modifying\
    \ the style attribute will visually change the presentation of the ellipse. The\
    \ following example changes the fill to blue and the stroke color to gray. 3.17\
    \ shows the results.\n\n```xml\n<?xml version=\"1.0\" standalone=\"no\"?>\n<!DOCTYPE\
    \ svg PUBLIC \"//W3C//DTD SVG 1.1//EN\"\n\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
    >\n<svg width=\"100%\" height=\"100%\" version=\"1.1\"\nxmlns=\"http://www.w3.org/2000/svg\"\
    >\n  <ellipse cx=\"300\" cy=\"150\" rx=\"250\" ry=\"120\"\n  style=\"fill:blue;stroke:gray;stroke-width:5\"\
    />\n</svg>\n```\n\nBoth the Fill and Stroke properties control the color of the\
    \ inside of an image. In this example a color name is used, but you can use any\
    \ of the color formats to control CSS, including the following:\n\n- Color name—you\
    \ can have names for colors as brown, red, or cyan.\n- Full hexadecimal—a hexadecimal\
    \ value comprised of alpha-numeric values.\n- Short hexadecimal—a hexadecimal\
    \ value comprised of three alpha-numeric values.\n- RGB—a combination of red,\
    \ green, and blue values.\n- RGBA—a combination of red, green, and blue values\
    \ with a transparency value (alpha).\n- HSL—a combination of hue, saturation,\
    \ and lightness.\n- HSLA—a combination of hue, saturation, and lightness with\
    \ a transparency value (alpha).\n\nIn addition to using CSS colors you can use\
    \ any of the following measurements:\n\n- cm—centimeter\n- in—inch\n- mm—millimeter\n\
    - pc—pica (1 pica = 12 points)\n- pt—point (1 point = 1/2 inch)\n- px—pixels\n\
    \nThrough leveraging CSS you can change the stroke of the ellipse and the measurement\
    \ in CM.\n"
  mdcn: "\n可以使用 SVG 中的 `RECT` 元素创建矩形。`RECT` 元素有两个属性：`width` 和 `height`。下面的 SVG 添加了一个宽度为\
    \ 400 像素、高度为 400 像素的矩形。图中添加了额外的 CSS 样式，以便以便你查看。结果如图 3.11 所示。\n\n```xml\n<?xml\
    \ version=\"1.0\" standalone=\"no\"?>\n<!DOCTYPE svg PUBLIC \"//W3C//DTD SVG 1.1//EN\"\
    \n\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\">\n<svg width=\"100%\" height=\"\
    100%\" version=\"1.1\"\nxmlns=\"http://www.w3.org/2000/svg\">\n<rect width=\"\
    400\" height=\"400\"\nstyle=\"fill:red;stroke-width:5;\nstroke:yellow\"/>\n</svg>\n\
    ```\n\n在 SVG 中创建圆与创建矩形类似。在最基础的情况下，你使用 `CIRCLE` 元素。`CIRCLE` 元素只需要你使用 `R` 属性定义圆的半径。接下来的\
    \ SVG 代码绘制了一个半径为 150 像素的圆。\n\n![](img/273fb5489df445536bf1c8159f903498_13_0.png)\n\
    \n图 3.11 `RECT` 元素允许你轻松创建像这样的正矩形形状。\n\n```xml\n<?xml version=\"1.0\" standalone=\"\
    no\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 1.1//EN\">\n<http=\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
    >\n<svg width=\"100%\" height=\"100%\" version=\"1.1\"\nxmlns=\"http://www.w3.org/2000/svg\"\
    >\n<circle r=\"150\" stroke=\"yellow\"\nstroke-width=\"5\" fill=\"red\"/>\n</svg>\n\
    ```\n\n图 3.12 详细展示了 `CIRCLE` 元素的结果。\n\n如你在图中所示，定义半径会导致圆的大部分部分超出浏览器窗口的左上角。为了修正这一点，你可以使用两个额外的可选属性\
    \ `Cx` 和 `CY` 来定义圆在屏幕上的 X 和 Y 位置。\n\n```xml\n<?xml version=\"1.0\" standalone=\"\
    no\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 1.1//EN\">\n<http=\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
    >\n<svg width=\"100%\" height=\"100%\" version=\"1.1\"\nxmlns=\"http://www.w3.org/2000/svg\"\
    >\n<circle cx=\"160\" cy=\"160\" r=\"150\" stroke=\"yellow\"\nstroke-width=\"\
    5\" fill=\"red\"/>\n</svg>\n```\n\n图 3.13 显示了这些属性的使用。\n\n![](img/273fb5489df445536bf1c8159f903498_14_0.png)\n\
    \n图 3.12 `CIRCLE` 元素允许你在屏幕上绘制圆。\n\n![](img/273fb5489df445536bf1c8159f903498_15_0.png)\n\
    \n`ELLIPSE` 元素扩展了 `CIRCLE` 元素的功能，允许你通过 `RX` 和 `RY` 属性控制 X 和 Y 轴上的半径。你会在下面的代码中看到\
    \ `ELLIPSE` 元素利用 `CIRCLE` 元素的 `CX` 和 `CY` 属性来在浏览器中定位椭圆。图 3.14 显示了结果。\n\n```xml\n\
    <?xml version=\"1.0\" standalone=\"no\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD\
    \ SVG 1.1//EN\">\nn=\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\">\n<svg\
    \ width=\"100%\" height=\"100%\" version=\"1.1\"\nxmlns=\"http://www.w3.org/2000/svg\"\
    >\n<ellipse cx=\"300\" cy=\"150\" rx=\"250\" ry=\"120\"\nstyle=\"fill:yellow;\n\
    stroke:red;stroke-width:5\"/>\n</svg>\n```\n\n![](img/273fb5489df445536bf1c8159f903498_15)\n\
    \n`POLYGON` 类似于 `POLYLINE` 元素。使用 `X` 和 `Y` 值可以绘制整个形状。图 3.15 显示了一个三角形。\n\n![](img/273fb5489df445536bf1c8159f903498_16_0.png)\n\
    \n图 3.15 三角形由 `POLYGON` 元素创建。\n\n```xml\n<?xml version=\"1.0\" standalone=\"no\"\
    ?>\n<!DOCTYPE svg PUBLIC \"//W3C//DTD SVG 1.1//EN\"\n\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
    >\n<svg width=\"100%\" height=\"100%\">\n<polygon points=\"220,100 290,220 150,220\"\
    \nstyle=\"fill:yellow;\nstroke:red;stroke-width:5\"/>\n</svg>\n```\n\n使用 SVG 创建的最复杂的元素是\
    \ `PATH` 元素。你使用 `PATH` 元素创建的每个图形都是使用一系列特殊代码来解释线条在屏幕上的移动方式。这些代码是：\n\n- M 移动到\n\
    - L 连线到\n- H 水平线到\n- V 垂直线到\n- C 曲线到\n- S 平滑曲线到\n- Q 二次贝塞尔曲线\n- T 平滑二次贝塞尔曲线\n\
    - A 椭圆弧\n- Z 闭路径\n\n下面的代码使用绘图创建了一个笑脸图。图 3.16 显示了代码的结果。\n\n```xml\n<?xml version=\"\
    1.0\" standalone=\"yes\"?>\n<svg version=\"1.1\" viewBox=\"0.0 152.0 864.0\"\n\
    fill=\"none\" stroke=\"none\" stroke-linecap=\"square\"\nstroke-miter=\"10\" xmlns=\"\
    http://www.w3.org/2000/svg\"\nxmlns:link=\"http://www.w3.org/1999/xlink\">\n<path\
    \ d=\"M556 108 L556 108 C216,150 180,184 332,184 C216,66 216,50 156,108 Z\"\n\
    fill-rule=\"nonzero\" fill=\"#ff0ff\"/></path>\n```\n\n![](img/273fb5489df445536bf1c8159f903498_16_1.png)\n\
    \n图 3.16 `POLYGON` 元素允许你创建像笑脸这样的复杂的图像。\n\n```xml\n<path d=\"M102 85 C102,81 106,77\
    \ 110,77 C119,81 119,85 C119,90 115,93 106,93 102,90 102,85 M153,85 C153,81 157,77\
    \ 162,77 C166,81 170,85 C170,90 166,93 162,93 C157,93 153,90 153,85\"\nfill-rule=\"\
    nonzero\" fill=\"#ccc00\"\nstroke stroke-width=\"2.0\"\nstroke-linejoin=\"round\"\
    \ stroke-linecap=\"butt\"/></path>\n<path d=\"M93,141 Q136,169 179,141 184,56\"\
    \nfill-rule=\"nonzero\" stroke=\"#ff0000\" stroke-width=\"2.0\"\nstroke-linejoin=\"\
    round\" stroke-linecap=\"butt\"/></path>\n<path d=\"M56,108 C156,108 56,66 92,32\
    \ 136,32 C180,32 216,66 216,108 C216,180 184,136 142,92 184,56 150,56\"\nfill-rule=\"\
    nonzero\" fill=\"#ccc00\"\nstroke stroke-width=\"2.0\"\nstroke-linejoin=\"round\"\
    \ stroke-linecap=\"butt\"/></path>\n</svg>\n```正如你所看到的，使用 `PATH` 元素是复杂的。使用 `PATH`\
    \ 元素创建的每个图形都是使用二次贝塞尔曲线、三次贝塞尔曲线、平滑二次贝塞尔曲线以及椭圆弧来构建的。\n\n## 添加 CSS 颜色\n\n 填充（`fill`）和描边（`stroke`）属性控制图像内部的颜色。在这个示例中使用了颜色名称，但你可以使用任何颜色格式来控制\
    \ CSS，包括以下格式：\n\n字体 颜色名称——你可以拥有棕色、红色或青色等颜色名称。\n- 全六进制——由字母数字组成的十六进制值。\n- 短六进制——由三个字母数字组成的十六进制值。\n\
    - RGB——红、绿、蓝组合。\n- RGBA——红、绿、蓝组合以及透明度值（alpha）。\n- HSL——色调、饱和度和亮度的组合。\n- HSLA——色调、饱和度和亮度组合以及透明度值（alpha）。\n\
    \n除了使用 CSS 颜色外，你还可以使用以下测量单位：\n\n- cm——厘米\n- in——英寸\n- mm——毫米\n- pc——画磅（1 画磅 =\
    \ 12 点）\n- pt——点（1 点 = 1/2 英寸）\n- px——像素\n\n通过利用 CSS，你可以更改椭圆的描边颜色以及以 cm 为单位的测量。\n"
