    The X and Y attributes specify where on the screen the text will appear. Formatting\
    \ of the text is controlled by CSS in the style attribute. Text can have the following\
    \ styles applied to it:\n\n# It was the best of times\n\nFigure 3.24 Text can\
    \ be easily inserted into an SVG drawing using the TEXT element.\n\n![](img/273fb5489df445536bf1c8159f903498_22_0.png)\n\
    \n- Font-family—the name of the font\n- Font-size—the size of the font\n- Kerning—the\
    \ space between letters\n- Stroke—the outside color of a font\n- Fill—the inside\
    \ color of a font\n\nFollowing is an example SVG code showing text formatting.\n\
    \n```xml\n<svg xmlns=\"http://www.w3.org/2000/svg\"\n  xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
