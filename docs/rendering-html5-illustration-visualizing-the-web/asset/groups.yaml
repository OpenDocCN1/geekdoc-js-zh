    stroke-linecap="butt">

    </path></svg>

    ```


    If you want to change the fill color inside the star, you only need to change
    the value of the fill property to a new color. Say you would prefer a red star;
    simply change the fill value to red, as follows:


    fill=red


    Figure 3.6 shows that the star is now red. Using the browser to control the color,
    shape, and visual elements of the SVG image allows you to write programs that
    dynamically control the SVG illustrations.


    SVG comes with some fundamental benefits:


    - Images scale easily.

    - SVG is accessible.

    - Search engines can easily read and understand SVG images.


    These benefits make using SVG very compelling.


    ![](img/273fb5489df445536bf1c8159f903498_7_0.png)


    Figure 3.6 Any element used to build an SVG drawing can be easily edited.


    # The Fundamentals of Creating SVG Images and Adding Them to Your Web Pages


    Unlike traditional drawing, SVG can be "drawn" all in code. You can use your favorite
    text editor to create any type of SVG illustration. The easiest way to manage
    SVG drawings is to save each illustration to a text file with the extension SVG.
    You can then treat your SVG drawings as your image files like JPEG or PNG files.


    All SVG files will start with a line declaring the document is an XML file. The
    following line should be placed at the start of all your SVG documents:


    ```

    <xml version="1.0" standalone="yes"?>

    ```


    Following the XML declaration is some information explaining the SVG document.
    The first line specifies which version of SVG you are using. The most commonly
    adopted version is 1.1:


    ```xml

    <svg version="1.1">

    ```


    The viewBox identifies the size of the canvas you are working with. The viewBox
    is constructed of four properties that identify the X and Y coordinates of the
    viewBox and width and height.


    ```

    viewBox="0.0 0.0 300.0 800.0"

    ```


    You can specify drawing attributes that should be used for all objects in the
    opening SVG properties. Here all objects in the illustration will, by default,
    have no fill or stroke, and a square line will be used to draw images with a stroke
    miter of 5.


    ```xml

    fill="none"

    stroke="none"

    stroke-linecap="square"

    stroke-miterlimit="5"

    ```


