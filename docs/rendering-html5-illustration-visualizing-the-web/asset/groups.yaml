    \ 264 269 284 262 272 302 202 202 28 28 285 253 256 248 234 222 299 281 221 207\
    \ 205 205 205 259 189 186 201 78 340 83 338 306Z\" />\n```\n\nA glyph of the letter\
    \ \"A\".\n\nTo use a full alphabet, you will need to create lowercase for each\
    \ character on the keyboard. A simple font will get very quickly.\n\n## Adding\
    \ Interactivity and JavaScript to Your Drawings\n\nYou can use JavaScript to add\
    \ interactivity to your SVG. You do this using the script element. The following\
    \ example adds a JavaScript that changes the color of shape you click on.\n\n\
    ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD\
    \ SVG 1.0//EN\" \"http://www.w3.org/Graphics/SVG/1.1/svg.dtd\">\n<svg xmlns=\"\
    http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"\
    800\" height=\"800\">\n<script type=\"text/javascript\">\n<![CDATA[\nfunction\
    \ randomColor(evt) {\n  var red = Math.round(Math.random() * 255);\n  var green\
    \ = Math.round(Math.random() * 255);\n  var blue = Math.round(Math.random() *\
    \ 255);\n  evt.target.setAttributeNS(null,\"fill\",\"rgb(\"+red+\",\"++green+\"\
    ,\"++blue+\")\");\n}\n]]>\n</script>\n</svg>\n```\n\nYou can see that this allows\
    \ the script to be correctly interpreted by the JavaScript engine running in the\
    \ web browser. The onclick attribute links the name of the JavaScript function\
    \ with the rectangle.\n\n## 23\n\nUsing JavaScript you can do a lot with SVG.\
    \ Some great sites that push the interactive limits of JavaScript and SVG integration\
    \ are:\n\n- http://raphael.js/\n- http://svgkit.sourceforge.net/\n- http://www.liquidx.net/plotkit/\n\
    - http://www.lututhan.net/svgml/index.html\n- http://code.google.com/pl/svgweb/\n\
    \nEach of these gives you libraries of JavaScript code that allow you to complete\
    \ complex, interactive SVG presentations.\n\n## Leveraging SVG Drawing Tools\n\
    \nIf you have gotten this far then you have realized that drawing with SVG is\
    \ complex. There, unfortunately, very few illustrations you can use to create\
    \ SVG drawings. Fortunately, the few tools that are on the market just happen\
    \ to be very good.\n\nAdobe's Illustrator has supported since CSS2 the ability\
    \ to export any illustration in SVG format. This is great news, as you can take\
    \ complex drawings and import them directly to SVG.\n\nWhile Illustrator export\
    \ to SVG, the Open Source project Inkscape will save and edit SVG files. Inkscape\
    \ is not as easy to use as Illustrator, but it is free, and it is certainly easier\
    \ to create SVG illustrations from scratch.\n\nSketsa is a Java-based drawing\
    \ tool. The tool is quite basic, but again, it is better than nothing.\n\nFinally,\
    \ if you use Google's Docs to create documents online you will be interested to\
    \ know that the \"Insert Image\" feature uses SVG to create the images. Additionally,\
    \ if you use a text, then Google uses the complex Glyph editor to embed the fonts\
    \ for you.\n\nThe good news is that there are tools you can use to create SVG\
    \ illustrations. The bad news is that there are few tools you can use to visually\
    \ add interactivity to your SVG drawings. With SVG becoming more popular for sites\
    \ such as Google Maps and Wikipedia now as a first-class citizen in HTML5, we\
    \ should expect SVG authoring tools to be more common.\n\n## Adding the CANVAS\
    \ Element to Your Web Page\n\nThere is a battle happening in the Web-o-sphere\
    \ between technologies that enable you to create cool, interactive animations.\
    \ The current \"king\" is Adobe's Flash, with Microsoft Silver coming in guns\
    \ blazing. The \"black horse\" contender is the emerging HTML5 standard. Baked\
    \ into HTML5 is a new element called CANVAS. Not sure what CANVAS is? Do you own\
    \ a Mac? Most of the widgets you run on your dashboard are built with HTML5.\n\
    \n![](img/273fb5489df445536bf1c8159f903498_27_0.png)\n\n**Figure 28** CanvasExperiments.com.\n"
