    \ * 255);\n  evt.target.setAttributeNS(null,\"fill\",\"rgb(\"+red+\",\"+green+\"\
    ,\"+blue+\")\");\n}\n]]>\n</script>\n</svg>\n```\n\n你可以，这允许浏览器中的 JavaScript 引擎正确解释脚本。`onclick`\
    \ 属性将 JavaScript 函数名与矩形关联起来。\n\n## JavaScript\n\n使用 JavaScript 你可以用 SVG 做很多事情。一些扩展\
    \ JavaScript 和 SVG 集成极限的优秀网站有：\n\n- http://raphael.js/\n- http://svgkit.sourceforge.net/\n\
    - http://www.liquidx.net/plotkit/\n- http://www.lututhan.net/svgml/index.html\n\
    - http://code.google.com/pl/svgweb/\n\n这些中的每一个都提供了 JavaScript 代码库，允许你完成复杂的交互式\
    \ SVG 演示。\n\n## 利用 SVG 绘画工具\n\n如果你已经读到这里，你已经意识到使用 SVG 绘图是很复杂的。遗憾的是，很少有插图可以用来创建\
    \ SVG 图。幸运的是，市场上的几个工具刚好非常好。\n\nAdobe Illustrator 自 CSS2 起就支持导出任何 SVG 格式的插图。这是一个好消息，因为你可以将复杂的图形直接导入到\
    \ SVG。\n\n虽然 Illustrator 导出为 SVG，但开源项目 Inkscape 可以保存和编辑 SVG 文件。Inkscape 不像 Illustrator\
    \ 那么易用，但它是免费的，而且从零开始创建 SVG 插图要容易得多。\n\nSketsa 是一个基于 Java 的绘画工具。该工具非常基础，但总比比没有好。\n\
    \n最后，如果你使用 Google Docs 在线创建文档，你会发现发现“插入图像”功能使用 SVG 来创建图像。此外，如果你使用文本，Google 会使用复杂的字形编辑器为你嵌入字体。\n\
    \n好消息是你有工具可以创建 SVG 插图。坏消息是，很少有工具可以视觉化地为你的 SVG 图形添加交互性。随着 SVG 在 Google Maps 和 Wikipedia\
