    # Drawing Simple Shapes


    Shapes are described in JavaScript and presented in the CANVAS element. The structure
    for describing a shape takes the following methods:


    +   * beginPath

    * moveTo

    * closePath

    * fill


    The role of the beginPath method is to declare the start of the shape. Following
    the beginPath method is where you start drawing your shape. The moveTo method
    is used to describe that you have moved your virtual pen and are starting to draw
    a new shape. The moveTo method is where you describe the structure of the shape.
    The following code demonstrates how a triangle is started and drawn.


    ```

    myShape.beginPath();

    myShape.moveTo(750,500);

    myShape.lineTo(1000,750);

    myShape.lineTo(1000,250);

    ```


    The first line declares the start of the shape. The second line is the moveTo
    method stating that the drawing will start at 750 pixels from the left (X axis)
    and down 500 pixels (Y axis).

    The triangle itself is a closed shape. By default you do not need to use the closePath
    method. You use the closePath method to close a shape when it is not clear where
    the closure for the shape is.


    ![](img/273fb5489df445536bf1c8159f903498_31_1.png)


    Figure 3.31 A simple triangle is drawn using the CANVAS element.


    The final method is the fill method. Together, the code looks like, and Figure
    3.31 shows the end result.'
