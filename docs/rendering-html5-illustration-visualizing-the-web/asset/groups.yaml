    # Adding CSS-Based Color


    SVG is a technology that allows you to create drawings. To add color to these
    drawings, you leverage Cascading Style Sheets. There is no need to use a different
    technology for applying-color, as CSS and SVG are partners in HTML5. Both have
    strengths that can be enhanced with each other.


    To provide an example, let us look at the ellipse drawing earlier (see Figure
    3.14).


    ```

    <xml version="1.0" standalone="no"?>

    <!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"

    "http://www.w3.org/Graphics/SVG/1.1/svg1.1.dtd">

    <svg width="100%" height="100%" version="1.1"

    xmlns="http://www.w3.org/2000/svg">

    <ellipse cx="300" cy="150" rx="250" ry="120"

    style="fill:yellow;

    stroke:red;stroke-width:5"/>

    </svg>

    ```


    After the ellipse is drawn there is a style attribute. The style attribute in
    SVG allows you to add a CSS style to the image. In HTML you have a style attribute
    that behaves exactly the same.'
