    Photographers Expert Group. The JPEG file format allows you to create photorealistic
    images (Figure 3.1). A great place to go to view millions of JPEG images is Yahoo’s
    Flickr. A JPEG image is identified with the extension of either JPEG or JPG.


    The second file format used widely on the Internet is GIF, graphics interface
    format. Unlike JPEG, which support millions of colors, the GIF file format allows
    you to create images that support a color palette of 256 colors (Figure 3.2).
    On the face of it, the GIF format appears to be in the JPEG format. However, the
    GIF format does have two features the JPEG format does not: setting transparency
    as a color and sequencing a series of images together to play back as a simple
    animation.


    ![](img/273fb5489df445536bf1c8159f903498_5_0.png)


    **Figure 3.1** This is in JPEG format. The right side shows the pixel-by-pixel
    construction of the image.


    Both JPEG and GIF image formats, are now being superseded by a more sophisticated
    image format: PNG. Portable network graphics (PNG) are a raster-based file format
    that gives the best of JPEG and GIF and a little more (Figure 3.3). A PNG image
    format will support 32-byte images for photorealistic presentation. Additionally,
    like GIF images, backgrounds in PNG can be set to be transparent.


    While PNG, GIF, and JPEG images are all great, it is difficult to programmatically
    create the graphical display of images. For instance, you cannot create a chart
    using JPEG images that as new data come in. HTML5 introduces two solutions to
    address this problem: SVG and CANVAS.


    The CANVAS HTML5 allows you to create images programmatically using JavaScript
    as the designer. Through this technique, complex animations and interactive solutions
    can be created. Google has established ChromeExperiments.com (http://www.chromebookexperiments.com/)
    to demonstrate powerful CANVAS and JavaScript experiments (Figure 3.4).


    The second technology, SVG (scalable vector graphics), is vector-based technology
    that enables you to create images and animation using XML syntax similar to HTML.
    SVG started


