    # HTML5 绘图渲染


    HTML5 使用标签以描述性的层级放置和组织内容。这并不意味着页面会看起来很好。页面内容的呈现是通过使用 HTML5 中的层叠样式表第 3 版（即 CSS3）控制的。


    然而，有时你也需要呈现图形。通常，HTML 仅支持 JPEG 和 GIF 格式的基于像素的图像。通过 HTML5，你现在可以创建数学生成的图像。新格式是可缩放矢量
    (SVG) 和 CANVAS。两者的区别在于，SVG 是一种基于 XML 的语言，描述了图像如何在二维 (2D) 结构中显示。CANVAS 标签也描述二维图像，但它是使用
    JavaScript 实现的。CANVAS 标签还允许你使用 JavaScript 轻松管理内部的交互性。


    在本文中你将学习到：


    - HTML5 可用的图像格式。

    - 如何使用 SVG 绘画。

    - 如何使用 CANVAS 绘画。

    - 如何使用 JavaScript 为 CANVAS 添加交互性。


    本文最终的目标是让你理解如何使用 HTML5 中的图像格式。


    ## Web 图像格式的故事


    Web 对设计师来说并不是一个友好的地方。多年来，你一直限于可以使用的文件格式数量。Web 上用于创建图形的两种主要文件格式是 JPEG 和 GIF。


    ## 位图图像：在 Web 上使用 JPEG、GIF 和 PNG


    JPEG 和 GIF 格式都是由单个颜色的像素创建的光栅图像。它们都有其优缺点。JPEG 图像是由联合摄影师专家小组（Joint Photographers
    Expert Group）管理的开放标准。JPEG 文件格式允许你创建写实感的图像（图 3.1）。查看数百万 JPEG 图像的绝佳之处是 Yahoo 的 Flickr。JPEG
    图像以 JPEG 或 JPG 扩展名标识。


    互联网上广泛使用的第二个文件格式是 GIF，图形接口格式（graphics interface format）。与支持数百万种颜色的 JPEG 不同，GIF
    文件格式允许有限的调色板。GIF 文件格式对于具有平涂颜色和透明度的图像非常有用。


    ![](img/273fb5489df445536bf1c8159f903498_5_0.png)

    **图 3.1** JPEG 图像。


    互联网上广泛使用的第三种文件格式是 PNG，便携式网络图形（Portable Network Graphics）。与 JPEG 和 GIF 不同，PNG 是一种无损格式，支持透明度。它通常用于需要锐利边缘和实色的图像。


    互联网上广泛使用的第四种文件格式是 SVG，可缩放矢量（Scalable Vector Graphics）。与光栅图像不同，SVG 图像是矢量的，这意味着它们可以扩展到任何尺寸而不丢失质量。


    ![](img/273fb5489df445536bf1c8159f903498_5_1.png)

    **图 3.2** SVG 图像。


    ## CANVAS 元素


    CANVAS 元素是 HTML5 的一项功能，通过 JavaScript 在 Web 上绘制图形。与矢量的 SVG 不同，CANVAS 是基于光栅的。这意味着一旦在画布上绘制了图像，它就由像素组成。CANVAS
    用于创建动态图形（例如游戏或实时数据处理）。


    ![](img/273fb5489df445536bf1c8159f903498_6_0.png)

    **图 3.3** Canvas 图像。


    ## 图像格式总结


    | 格式 | 类型 | 压缩 | 透明度 | 最佳用途 |

    | :--- | :--- | :--- | :--- | :--- |

    | JPEG | 光栅 | 有损 | 否 | 照片 |

    | GIF | 光栅 | 无损 | 有限 | 简单图形、动画 |

    | PNG | 光栅 | 无损 | 是 | 标志、图标 |

    | SVG | 矢量 | 无/A | 是 | 插图、图标 |

    | CANVAS | 光栅 | 而定 | 是 | 游戏、动态图形 |


