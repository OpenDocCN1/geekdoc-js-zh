    # Applying Gradients to SVG Images


    SVG employs a great technique that allows you to reuse a gradient definition over
    one or more images in your SVG illustration. This is done using either the LINEARGRADIENT
    or RADIALGRADIENT element types. Both gradients allow you to define the horizontal
    and vertical colors and direction of the gradient.


    Let''s look first at linear gradients. The LINEARGRADIENT element is constructed
    by five different attributes that define over a linear direction how the gradient
    will behave. The first attribute you provide for information is the ID attribute,
    which allows you to give your gradient a name you can use to reference from your
    drawing.


    For a linear gradient you can draw your gradient moving over an X-Y axis. To determine
    the direction of the gradient you have to specify the start and end X start and
    end Y points. The following illustrates a left-right gradient:


    ```

    <linearGradient x1="0%" y1="0%" x2="100%" y2="0%">

    ```


    To create a vertical gradient you change the Y and X axes to:


    ```

    <linearGradient x1="0%" y1="100%" x2="0%" y2="0%">

    ```


    You can see the difference between the two numbers is unchanging the X or Y axes
    to 100%. Figure 3.19.


    Changing the X and Y percentages will change how the gradient is drawn. Adding
    color to the gradient is the next step. To do this, you create a list of two or
    more colors using the STOP element. For instance, to create a simple yellow-to-red
    gradient color change you will add two STOP elements as shown in the following.


    ![](img/273fb5489df445536bf1c8159f903498_19_0.png)


    Figure 3.19 Linear gradients can be applied in SVG images using the LINEARGRADIENT
    element.


    ```

    <stop offset="0%" style="stop-color:yellow;opacity:1"/>

    <stop offset="100%" style="stop-color:red;stop-opacity:1"/>

    ```'
