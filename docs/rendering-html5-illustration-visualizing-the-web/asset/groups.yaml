    \ = myRectangle.createLinearGradient(0,0,0,650);\n```\n\n在这里你将渐变与 CANVAS 对象 myRectangle\
    \ 关联。在此时，渐变还没有绘制后面出现的图像——此时的代码仅仅是将渐变和图像关联。`createLinearGradient` 属性决定了渐变在哪里绘制对象。括号内是\
    \ X 和 Y 轴以及高度和宽度。\n\n渐变必须至少有两种颜色。以下将绘制一种从红色开始，在图像 50% 处过渡到黄色的渐变色。\n\n```javascript\n\
    verticalGradient.addColorStop(0, 'red');\nverticalGradient.addColorStop(0.5, 'yellow');\n\
    ```\n\n最后一步是使用 paintStyle 属性将渐变绘制到矩形中：\n\n```javascript\nmyRectangle.setStyle\
    \ = verticalGradient;\n```\n\n整个 CANVAS 脚本如下：\n\n```html\n<html>\n<head>\n  <title>Linear\
