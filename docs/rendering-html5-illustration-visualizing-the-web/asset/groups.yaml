    # 23


    Through using JavaScript you can do a lot with SVG. Some great sites that push
    the interactive limits of JavaScript and SVG integration are:


    +   * http://raphael.js/

    * http://svgkit.sourceforge.net/

    * http://www.liquidx.net/plotkit/

    * http://www.lututhan.net/svgmld/index.html

    * http://code.google.com/pl/svgweb/


    Each of these gives you libraries of JavaScript code that allow you to complete
    complex, interactive SVG presentations.


    # Leveraging SVG Drawing Tools


    If you have gotten this far then you have realized that drawing with SVG is complex.
    There, unfortunately, very few illustrations you can use to create SVG drawings.
    Fortunately, the few tools that are on the market just happen to be very good.


    Adobe''s Illustrator has supported, since CSS2, the ability to export any illustration
    in SVG format. This is great news, as you can take complex drawings and import
    them directly to SVG.


    While Illustrator export to SVG, the Open Source project InkSpace will save and
    edit SVG files. InkSpace is not as easy to use Illustrator, but it is free, and
    it is certainly easier to create SVG illustrations with Inkscape from scratch.


    Sketsa is a Java-based drawing tool. The tool is quite basic, but again, it is
    better than nothing.


    Finally, if you use Google''s Docs to create documents online you will be interested
    to know that the "Insert Image" feature uses SVG to create the images. Additionally,
    if you use a text, then Google uses the complex Glyph editor to embed the fonts
    for you.


    The good news is that there tools you can use to create SVG illustrations. The
    bad news is that there are few tools you can use to visually add interactivity
    to your SVG drawings. With SVG becoming more popular for sites such as Google
    Maps and Wikipedia now as a first-class citizen in HTML5, we should expect SVG
    authoring tools to be more common.


    # Adding the CANVAS Element to Your Web Page


    There is a battle happening in the Web-o-sphere between technologies that enable
    you to create cool, interactive animations. The current "king" is Adobe''s Flash,
    with Microsoft Silver coming in guns blazing. The "black horse" contender is the
    emerging HTML5 standard. Baked into HTML5 is a new'
  - '[PAGE 27]


    element called CANVAS. Not sure what CANVAS is? Do you own a Mac? Most of the
    widgets you run on your dashboard are built with HTML5''s CANVAS element.


    The CANVAS element gives you the ability to build Adobe Flash-like applications
    without having to use Flash. It is in the early stages of development, but some
    of the things you can already accomplish are very impressive. If you are running
    Google''s Chrome, Firefox, or Safari, then you will want to check http://www.chromeexperiments.com/,
    a site that pushes the capabilities of what can be done in your browser (Figure
    3.28). In particular, look at the CANVAS experiments. It is me, or do they look
    Flash-like?


    In many ways, CANVAS looks and feels similar to SVG. Your valid question is: Why
    no technologies that are the same? There is a fundamental difference between CANVAS
    and SVG. SVG is a drawing technology that creates vector images. CANVAS, on the
    other hand, dynamically creates bitmap images. You can think of CANVAS as a programmable
    version of JPEG/PNG images.


    Unlike SVG, a technology that has been maturing for a decade as a separate standard
    and only recently became part of HTML5, CANVAS was created as part of HTML5. The
    CANVAS technology was originally created by Apple to help in the creation of desktop
    widgets for the Mac OSX operating system. The technology was quickly included
    into WebKit, the technology Apple leverages to power its Safari web browser, and
    CANVAS has been adopted by Mozilla''s Firefox, Opera''s Browser, and Google''s
    Chrome. Canvas is a powerful drawing tool that aligns with competing technologies
    such as Adobe''s Flash and SilverLight.


    ![](img/273fb5489df445536bf1c8159f903498_27_0.png)


    **Figure 3.28** Google''s ChromeExperiments.com web site showcases some of the
    best CANVAS solutions on the Web.'
  - "[PAGE 28]\n\n25\n\nThe only browser that currently does not support CANVAS is\
    \ Microsoft's Internet Explorer. You can, however, add CANVAS support to Internet\
    \ Explorer through a plug-in called ExplorerCanvas, which can be downloaded at\
