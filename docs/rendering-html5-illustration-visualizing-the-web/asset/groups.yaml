    \ 36\n\n# RENDERING HTML5 ILLUSTRATION\n\nTags are used in HTML5 to place and\
    \ organize content at a level that is descriptive. This does not mean that the\
    \ page will look good. Presentation of content on the page is controlled using\
    \ Cascading Style Sheets Level 3, or CSS3, in HTML5.\n\nThere are times, however,\
    \ when you need to present graphics, too. Typically, HTML has only provided support\
    \ for pixel-based images in JPEG and GIF image format. With HTML5, you can now\
    \ create mathematically generated images. The new formats are scalable vector\
    \ (SVG) and CANVAS. The difference between the two is that SVG is an XML-based\
    \ language that describes how an image should be displayed in two-dimensional\
    \ (2D) constructs. The CANVAS tag also describes 2D images, but it does using\
    \ JavaScript. The CANVAS tag also allows you to easily manage interactivity within\
    \ it using JavaScript.\n\nIn this article you will learn the following:\n\n- The\
    \ image formats available in HTML5.\n- How to draw using SVG.\n- How to draw with\
    \ CANVAS.\n- How to add interactivity to CANVAS using JavaScript.\n\nThe goal\
    \ at the end of this article is that you will understand how you can use the image\
    \ formats in HTML5.\n\n## Tale of Web Image Formats\n\nThe Web is not a friendly\
    \ place for a designer. For many years you have been limited to the number of\
    \ file formats you can use. There are two predominant file formats used on the\
    \ Web for creating graphics: JPEG and GIF.\n\n## Bitmap Images: Using JPEG, GIF,\
    \ and PNG on the Web\n\nBoth JPEG and GIF image formats are raster images created\
    \ from pixels of individual color. Both have positives and negatives. JPEG images\
    \ are open standard managed by the Joint Photographers Expert Group. The JPEG\
    \ file format allows you to create photorealistic images (Figure 3.1). A great\
    \ place to go to view millions of JPEG images is Yahoo’s Flickr. A JPEG image\
    \ is identified with the extension of either JPEG or JPG.\n\nThe second file format\
    \ used widely on the Internet is GIF, graphics interface format. Unlike JPEG,\
    \ which supports millions of colors, the GIF file format allows for a limited\
    \ palette of colors. The GIF file format is useful for images with flat colors\
    \ and transparency.\n\n![](img/273fb5489df445536bf1c8159f903498_5_0.png)\n**Figure\
    \ 3.1** A JPEG image.\n\nThe third file format used widely on the Internet is\
    \ PNG, Portable Network Graphics. Unlike JPEG and GIF, PNG is a lossless format\
    \ that supports transparency. It is often used for images that require sharp edges\
    \ and solid colors.\n\nThe fourth file format used widely on the Internet is SVG,\
    \ Scalable Vector Graphics. Unlike raster images, SVG images are vector-based,\
    \ which means they can be scaled to any size without losing quality.\n\n![](img/273fb5489df445536bf1c8159f903498_5_1.png)\n\
    **Figure 3.2** An SVG image.\n\n## The Canvas Element\n\nThe CANVAS element is\
    \ an HTML5 feature used to draw graphics on the web via JavaScript. Unlike SVG,\
    \ which is vector-based, CANVAS is raster-based. This means that once an image\
    \ is drawn on the canvas, it is made of pixels. CANVAS is useful for creating\
    \ dynamic graphics, such as games or real-time data processing.\n\n![](img/273fb5489df445536bf1c8159f903498_6_0.png)\n\
    **Figure 3.3** A Canvas image.\n\n## Summary of Image Formats\n\n| Format | Type\
    \ | Compression | Transparency | Best Use |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n| JPEG | Raster | Lossy | No | Photographs |\n| GIF | Raster | Lossless |\
    \ Limited | Simple, animations |\n| PNG | Raster | Lossless | Yes | Logos, icons\
    \ |\n| SVG | Vector | N/A | Yes | Illustrations, icons |\n| CANVAS | Raster |\
    \ Varies | Yes | Games, dynamic graphics |\n"
