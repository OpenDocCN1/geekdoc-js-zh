    \ 'red');\n      verticalGradient.addColorStop(0.5, 'yellow');\n      ctx.fillStyle\
    \ = verticalGradient;\n      ctx.fillRect(10,10,650,650);\n    }\n  }\n  </script>\n\
    </head>\n<body onload=\"draw();\">\n  <canvas id=\"myCanvas\" width=\"800\" height=\"\
    800\"></canvas>\n</body>\n</html>\n```\n"
