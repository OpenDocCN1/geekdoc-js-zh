  md: '# Parsing: Abstract Syntax Trees (ASTs)


    Parsing is a fundamental step in the compilation process, bridging the gap between
    the raw text of a program and its executable form. It involves analyzing the linear
    sequence of characters (the source code) and constructing a hierarchical representation
    of the program''s structure. This hierarchical representation is known as an Abstract
    Syntax Tree (AST).


    # Understanding Abstract Syntax Trees


    An AST is a tree-like data structure where each node represents a construct occurring
    in the abstract syntax of the source code. Unlike a parse tree, which represents
    the concrete syntax including all details such as parentheses and operator precedence,
    AST only includes essential structural information. This abstraction simplifies
    further processing and analysis.


    Each node in the AST typically corresponds to a specific language construct, such
    as a variable declaration, function definition, or arithmetic expression. The
    parent-child relationships between these constructs. For example, the expression
    `2 + 3 * 4` would have a root node representing the addition operation, with nodes
    for the ''2'' and the multiplication operation. The multiplication operation node
    would, in turn, have children for ''3'' and ''4''.


    # Constructing an AST


    The process of creating an AST involves several steps, often handled by a parser.
    The parser takes as input a stream of tokens (lexemes) produced by the lexical
    analyzer (scanner). These tokens represent the basic building blocks of the language,
    such as keywords, identifiers, operators, and literals.


    Parsers use context-free grammars (CFGs) to define the language''s syntax. A CFG
    specifies the rules for combining tokens into valid program structures. The parser
    uses these rules to determine the syntactic structure of the input and constructs
    the corresponding AST.


    There are two main parsing techniques: recursive descent and bottom-up parsing
    (like LR parsing). Recursive descent parsers are relatively easy to implement
    and understand, while bottom-up parsers are more efficient for complex grammars.


