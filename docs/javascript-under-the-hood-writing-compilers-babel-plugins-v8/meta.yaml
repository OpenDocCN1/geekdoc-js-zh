    # Lexical Analysis: The Scanner


    Lexical analysis, often called scanning, is the first phase in the compilation
    process. It acts as a bridge between the source code and the higher-level parsing
    stages. The scanner''s primary role is to break down the continuous stream of
    characters in the source code into a sequence of meaningful units called tokens.
    These tokens represent the basic building blocks of the programming language,
    such as keywords, identifiers, operators, and literals.


    # The Role of the Scanner


    Imagine reading a sentence. You don''t process each individual letter separately;
    instead, you group letters into words, understanding them as individual units
    of meaning. The scanner performs a similar function for programming languages.
    It takes the raw character input and identifies sequences of characters that form
    tokens. This simplifies the subsequent parsing stage, which deals with the grammatical
    structure of the program.


    Consider the JavaScript snippet: let x = 10 + 5; . The scanner would break this
    down into the following tokens:


    +   * let (keyword)

    * X (identifier)

    * = (assignment operator)

    * 10 (numeric literal)

    * + (addition operator)'
