    同样重要的是识别你的兴趣。JavaScript 开发的哪些方面让你兴奋？你对编译器的复杂性感兴趣，还是热于构建用户界面？选择与你的兴趣相一致的项目将在整个开发周期中维持你的动力。


    ## 探索项目想法：分类法


    为了帮助你选择，让我们对潜在的项目想法进行分类：


    ### 1. 专注于编译工具

