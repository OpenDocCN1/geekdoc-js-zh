    \ Babel 进程崩溃。\n\n## 2. Babel 的 `file.setLogMessage`\n\nBabel 提供了一种记录自定义消息的机制 `file.setLogMessage`。这对于不应停止构建过程但仍需向用户反馈的非关键错误或警告特别有用。\n\
