    as follows:


    - Mark phase: V8 starts from root objects (global variables, stack variables)
    and recursively traverses all reachable objects, marking them as live.

    - Sweep phase: The garbage collector iterates through the memory, reclaiming unmarked
    objects (garbage).

    - Compact phase: Live objects are moved closer together to reduce memory fragmentation.
    This helps to improve the efficiency of future allocations.


