    \ 的机制，但修改器赋予了插件修改树结构的能力。修改器函数在访问者内部被调用，并直接更改 AST。这种更改范围从单个节点属性的简单变化到整个子树的重大重构都有。\n\
    \n假设你想在每个函数的开头添加一个 `console.log` 语句。在识别 `FunctionDeclarations` 的访问者触发的修改器，可以插入一个新的\
