    # Examples of Memory Leaks in JavaScript


    A common source of memory leaks is unintentionally creating circular references.
    Consider the following example:


    ```

    let obj1 = {}; let obj2 = {}; obj1.ref = obj2; obj2.ref = obj1; // obj

    obj2 now reference each other, creating a cycle. Even if they are no

