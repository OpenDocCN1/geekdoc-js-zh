    ## Memory Allocation and Deallocation


    When JavaScript code executes, V8 allocates memory to store objects, variables,
    and other data structures. This memory is primarily managed within the engine''s
    heap. Unlike languages with manual memory management (like C or C++), V8 employs
    automatic garbage collection. This means developers don''t explicitly allocate
    memory; V8 automatically reclaims unused memory to prevent memory leaks and improve
    performance.


    Memory allocation in V8 is typically handled through a variety of techniques,
    employing fast allocators for smaller objects and more complex strategies for
    larger ones. The specific allocation method depends on the size and type of the
    object being created. The goal is to find a balance between speed and memory fragmentation.


    ## Garbage Collection in V8


    V8 utilizes a generational garbage collector, which divides the heap into different
    generations based on the objects'' age and survival rate. This approach leverages
    the observation that many objects have short lifespans. The key generations are:


    - New space: This space holds recently allocated objects. It''s typically smaller
    and garbage collected more frequently using a scavenger algorithm (explained further
    below).

    - Old space: This space stores objects that have survived multiple garbage collection
    cycles in the new space. It uses a more sophisticated and less frequent mark-sweep-compact
    algorithm.

    - Large object space: Handles large objects that don''t fit efficiently into the
    new or old space. These are often collected less frequently due to their size.


    ### Scavenger Algorithm (New Space)

    The scavenger algorithm is a copying garbage collector. It works by dividing the
    new space into two halves. When garbage collection is triggered, it iterates through
    one half (the "from" space), copying live objects into the other half (the "to"
    space). Any objects not copied are considered garbage and their memory is reclaimed.
    The roles of "from" and "to" spaces switch.


    This approach is fast because it only needs to process live objects. However,
    it requires twice the memory of a single-space approach.


    ### Mark-Sweep-Compact Algorithm (Old Space)

