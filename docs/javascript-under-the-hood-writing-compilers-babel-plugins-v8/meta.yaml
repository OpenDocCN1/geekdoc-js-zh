    \ [t.stringLiteral('function: ' + path.node.id.name)])\n    );\n    path.node.body.body.unshift(consoleLogStatement);\
    \ // 添加到开头\n  }\n}\n```\n\n注意：上述示例中的 `t` 指的是 Babel 类型实用程序 (types utility)，它提供了创建和操作\
