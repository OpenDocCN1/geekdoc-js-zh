    \n```javascript\nconst sum = (a, b) => a + b;\n```\n\n```\n{\n  \"type\": \"Program\"\
    ,\n  \"body\": [\n    {\n      \"type\": \"VariableDeclaration\",\n      \"declarations\"\
    : [\n        {\n          \"type\": \"VariableDeclarator\",\n          \"id\"\
    : { \"type\": \"Identifier\", \"name\": \"sum\" },\n          \"init\": {\n  \
