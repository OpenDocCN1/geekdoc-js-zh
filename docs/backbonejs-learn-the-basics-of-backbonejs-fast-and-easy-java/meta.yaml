    var R2 = Backbone.View.extend({

    template: ''<b>This is the second route </b>'',

    initialize: function () {

    this.execute();

    },

    execute: function () {

    this.$elem.html(this.template);

    }

    });

    //''ApplicationRouter'' is the name of our router class

    var ApplicationRouter = Backbone.Router.extend({

    routes: {

    '''': ''homeRoute'',

    ''route/1'': ''homeRoute'',

    ''route/2'': ''aboutRoute'',

    },

    //After clicking on route1, it will navigate to our custom view class ''Rt1''

    homeRoute: function () {

    var route1 = new Route1();

    $("#content").html(route1.el);

    },

    //After clicking on r2, it will navigate to our custom view class ''R2''

    aboutRoute: function () {

    var r2 = new R2();

    $("#content").html(r2.elem);

    }

    });

    var applicationRouter = new ApplicationRouter(); //This is an instantiation of
    our router

    //It begins listening to our routes and managing the history for the bookmarkable
    URLs

    Backbone.history.start();

    </script>

    <body>

    <div id="navigation">

    <a href="#/route/1">first route</a>

    <a href="#/route/2">second route</a>

    </div>

    <div id="content"></div>

    </body>

    </html>

    ```


    按照我们编写的方式编写上述程序，然后执行它。你将观察到以下输出：


    first route second route


    这就是该方法的实现方式。


    ## 结论


    可以得出结论，BackboneJS 是一个 JavaScript 库，它在开发人员创建应用程序的客户端时提供帮助。这些是在 Web 浏览器中执行的应用程序。为了构建应用程序的结构，该库使用
    MVC 框架。这意味着应用程序的数据在应用程序的模型部分中进行抽象。这三个层通常通过代码连接在一起。


    该库为开发人员提供了各种构建块，用于构建应用程序的前端部分。这些构建块包括集合、路由器、视图和模型，它们在本章中进行了讨论。它的工作方式是，一旦应用程序的模型部分被更改，HTML
    部分也必须更新以反映更改。使用 BackboneJS，可以将用户界面部分和业务逻辑部分分离。


    有两种方法可以使用 BackboneJS 框架进行开发。可以选择下载它并使用下载后的库。然而，当你访问 BackboneJS 的下载页面时，你会看到三个选项。你需要根据需求下载正确的版本。


    你也可以选择通过 CDN 使用它，在这种情况下，它将在网上为你提供。要访问它，你需要包含指向它的链接。在使用 BackboneJS 编程时，还需要各种 JavaScript
    依赖项。这些在本章中进行了讨论。BackboneJS 也支持事件。这很好，因为它使你能够在 BackboneJS 中完成任务。本章探讨了 BackboneJS
    的各个方面。练习给出的大部分方面和示例，你将成为使用 BackboneJS 的专家。

    '
