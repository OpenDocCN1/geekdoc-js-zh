    \ is how it can be implemented.\n\n## Initialize\n\nThis will create a new constructor\
    \ for instantiation of the router. It takes the syntax given below:\n\n**new Router(options)**\n\
    \nThe parameter \"*options*\" will have to be passed to the initialize function.\n\
    \nThe example given below shows how this can be done:\n\n```\n<!DOCTYPE html>\n\
    <head>\n<title> Router Sample </title>\n<script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
    \ type=\"text/javascript\"></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.2/underscore-min.js\"\
