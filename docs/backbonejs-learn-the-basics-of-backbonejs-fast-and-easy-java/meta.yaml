    \ own Backbone model. It takes the syntax given below:\n\n```\nBackbone.Model.extend(properties,\
    \ [classProperties])\n```\n\nThe following parameters have been used:\n\n- 1.\
    \ properties- it will provide the instance properties for our model class.\n2.\
    \ classProperties- the class properties will have to be attached to our constructor\
    \ function.\n\nThe example given below shows how this can be implemented:\n\n\
    ```\n<!DOCTYPE html>\n<head>\n<title> Model Sample </title>\n<script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
