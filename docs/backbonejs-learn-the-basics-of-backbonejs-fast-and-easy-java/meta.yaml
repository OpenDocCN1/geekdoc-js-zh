  md: '# # Conclusion


    It can be concluded that BackboneJS is a JavaScript library which helps developers
    during the creation of the client sides of applications. These are the applications
    which can be executed in the web browser. For the purpose of structuring applications,
    this library uses the MVC framework. This means that the data for the application
    is abstracted in the model part of the application. The three layers are usually
    joined together via coding.


    The library provides the developer with various building blocks for the purpose
    of building the front part of the application. These building blocks include collections,
    routers, views, and models, and they have been discussed in this book. It works
    in a manner that once the model part of the application has been changed, the
    HTML part also has to be updated so that the changes are reflected. With BackboneJS,
    the user interface part and the business logic part of one’s application are separated.


    There are two ways that one can use BackboneJS framework for development. One
    can choose to download it and use the downloaded library. However, you will see
    three options for downloaded once you visit the download page for BackboneJS.
    You have to download the right version for you, depending on what you need.'
  merge: -1
  pgno: 116
- img_proc: true
  md: You can also choose to use it via DN, in which case it will be provided for
    you online. To access it, you will need to include the links leading to that.
    There are also various JavaScript dependencies which are needed when programming
    in BackboneJS. These have been discussed in this book. Events are also supported
    in BackboneJS. These are good, as they enable you to accomplish your tasks in
    BackboneJS. This book has explored the various aspects of BackboneJS. Practice
    most of the aspects and the examples which have been given, and you will become
    an expert in using BackboneJS.
  merge: -1
