    \ the program as it has been written, and then execute it. You will observe the\
    \ following as its output:\n\nThe number of added players is : 2\n\n## Chapter\
    \ 6- Router\n\nThis is used for the purpose of routing the client side applications,\
    \ and is used for defining the URL representation of the object for the application.\
    \ It is required whenever a web application provides bookmarkable, linkable, and\
    \ sharable URLs for some of the important locations in our app.\n\nLet us discuss\
    \ some of the methods which can be used for the manipulation of BackboneJS-Router.\n\
    \n## Router Navigate\n\nThis method is used when we want to save our application\
    \ as a URL. It just helps us in updating the URL. It takes the syntax given below:\n\
    \n```\nrouter.navigate(fragment, options)\n```\n\nThe following is an explanation\
    \ for the used parameters:\n\n- fragment- it represents the name of the parameter\
    \ in which our URL will be displayed after the parameter.\n- options- this represents\
    \ options such as \"replace\" and \"trigger\" for calling the route function and\
    \ updating the URL.\n\nConsider the example given below, which shows how this\
    \ can be done:\n\n```\n<!DOCTYPE html>\n<head>\n```\n\n```\n<title>Router Sample</title>\n\
    <script src=\"https://code.jquery.com/jquery-2.1.3.min.js\" type=\"text/javascript\"\
    ></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.2/underscore-min.js\"\
    \ type=\"text/javascript\"></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.2/backbone-min.js\"\
    \ type=\"text/javascript\"></script>\n</head>\n<script type=\"text/javascript\"\
    >\n//'RMenu' is the name of our view class\nvar RMenu = Backbone.View.extend({\n\
    elem: '#rmenu',  //'elem' defines the element to be used as our view reference\n\
    //defining the click event to be used on the link\nevents: {\n'click a' : 'onClick'\n\
    },\n//once a link has been clicked, router calls 'navigate' for updating the URL\n\
    onClick: function( ev ) {\n//Using the method navigate() to save the application\
    \ as a URL\nrouter.navigate('/');\n}\n});\nvar Router = Backbone.Router.extend({\n\
    //The 'routes' will map URLs with the parameters to the functions on the router\n\
    routes: {\n'route/:id' : 'defaultRoute'\n},\n});\n//'routemenu' is the instance\
    \ of our view class\nvar rmenu = new RMenu();\n//This will start listening to\
    \ the routes and then manage the history for the bookmarkable URL's\nBackbone.history.start();\n\
    ```\n\n```\n</script>\n<body>\n//This refers to our view class 'RMenu' and will\
    \ create the 3 links that will change the url when we click on the links\n<section\
    \ id=\"rmenu\">\n<ul>\n<li> <a href=\"#/route/1\"> First route </a> </li>\n<li>\
    \ <a href=\"#/route/2\"> Second route </a> </li>\n<li> <a href=\"#/route/3\">\
    \ Third rout </a> </li>\n</ul>\n</section>\n</body>\n</html>\n```\n\nJust write\
    \ the program as it has been written, and then run it. You will observe the following\
