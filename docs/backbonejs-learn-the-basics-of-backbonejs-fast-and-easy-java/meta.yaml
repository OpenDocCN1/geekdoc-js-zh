- md: "# Validate\n\nThis is used for validation of the model and the input which\
    \ the user provides. In case the input is found to be invalid, a specified error\
    \ message will be shown or if it is found to be valid, the result will simply\
    \ be shown without outputting anything negative.\n\nIt takes the syntax given\
    \ below:\n\n```\nmodel.validate(attributes,options)\n```\n\nThe following parameters\
    \ have been used:\n\n- attributes- this is used for definition of the property\
    \ of the model.\n- options- this will include “*true*” as an option for validation\
    \ of the attributes.\n\nConsider the example given below, which shows how this\
    \ can be done:\n\n```html\n<!DOCTYPE html>\n<head>\n<title>Model Sample </title>\n\
    <script src=\"https://code.jquery.com/jquery-2.1.3.min.js\" type=\"text/javascript\"\
    ></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.2/underscore-min.js\"\
    \ type=\"text/javascript\"></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.2/backbone-min.js\"\
    \ type=\"text/javascript\"></script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\nvar Human = Backbone.Model.extend({\ndefaults: {\nname: 'joel',\nage: 26,\n\
    occupation: 'typist'\n},\ninitialize : function(){\nthis.on(\"invalid\",function(model,err){\n\
    document.write(err);\n});\n},\nvalidate: function(attributes) {\nif ( attributes.age\
    \ < 26 ) {\nreturn 'The age of the person is less than 26, enter the correct age!!!\
    \ '\n}\nif ( ! attributes.name ) {\nreturn 'please provide the name!!!';\n}\n\
    },\n});\nvar human = new Human();\nhuman.on('invalid', function() {\nthis.arguments;\n\
    });\nhuman.set({ age : '20' }, { validate : true });\n</script>\n</body>\n</html>\n\
    ```\n\nJust write the program as it has been written, and then execute it. The\
    \ following will be observed as the output:\n\nThe age of the person is less than\
    \ 26, enter the correct age!!!\n\n# # Chapter 5- Collections\n\nCollections are\
    \ used for the representation of an ordered set for models. For one to create\
    \ a new collection, they just have to extend the backbone class of the collection.\
    \ Any event triggered in a model in a particular collection is also directly triggered\
    \ on the collection. This means that anyone will be in a position to listen to\
    \ any changes made to the specific attributes in the model of a collection.\n\n\
    There are some methods which one can use for manipulation of the Backbonejs –\
    \ collection. Let us discuss some of these.\n\n# # Collection Extend\n\nThis is\
    \ used for extension of the backbone collection class for creation of a new collection.\n\
    It takes the syntax given below:\n\n**Backbone.Collection.extend(properties, classProperties)**\n\
    \nThe following parameters have been used in the above syntax:\n\n- properties-\
    \ this is used for provision of instance properties for our collection class.\n\
    - classProperties- the properties for the class are attached to the constructor\
    \ function of the collection.\n\nConsider the example shown below, which shows\
    \ how this can be done:\n\n```html\n<!DOCTYPE html>\n<head>\n<title>Collection\
    \ Sample</title>\n<script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
    \ type=\"text/javascript\"></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.2/underscore-min.js\"\
    \ type=\"text/javascript\"></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.2/backbone-min.js\"\
    \ type=\"text/javascript\"></script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n//The model 'OurTeam' will include the default values and be extended by use\
    \ of the Backbone.Model class\n\nvar OurTeam = Backbone.Model.extend({\n    defaults:\
    \ {\n        player: \"John\",\n        country: \"USA\"\n    },\n});\n\n// 'OurTeam1'\
    \ is an instance of our collection\nvar OurTeam1 = Backbone.Collection.extend({\n\
    \    model: OurTeam // the model 'OurTeam' has been specified for our collection\
    \ by overriding the 'model' property\n});\n\n//The collection 'OurTeam1' should\
    \ be instantiated by use of new keyword\nvar val=new OurTeam1({});\n\n//The JSON.stringify()\
    \ method will return the values of the collection in a JSON format\ndocument.write(\"\
    The values in our collection include: \",JSON.stringify(val));\n</script>\n</body>\n\
    </html>\n```\n\nYou can write the program just as it has been written, and then\
    \ execute it. You will observe the following output:\n\nThe values in our collection\
    \ include: [{\"player\":\"John\",\"country\":\"USA\"}]\n\n# *Model*\n\nFor specification\
    \ of the model class, one has to override the model property of our collection\
    \ class. It takes the syntax given below:\n\n**Backbone.Collection.model**\n\n\
    Consider the example given below, which shows how this can be used:\n\n```html\n\
    <!DOCTYPE html>\n<head>\n<title>Collection Sample</title>\n<script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
    \ type=\"text/javascript\"></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.2/underscore-min.js\"\
    \ type=\"text/javascript\"></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.2/backbone-min.js\"\
    \ type=\"text/javascript\"></script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n//The model 'OurTeam' will include the default values and be extended by use\
    \ of the Backbone.Model class\nvar OurTeam = Backbone.Model.extend({\n  defaults:\
    \ {\n    player: \"john\",\n    country: \"USA\"\n  },\n});\n//'OurTeam1' is the\
    \ instance of our collection\nvar OurTeam1 = Backbone.Collection.extend({\n  model:\
    \ OurTeam // the model 'OurTeam'is specified for the collection by overriding\
    \ our 'model' property\n});\n//The collection 'OurTeam1' is instantiated by use\
    \ of new keyword\nvar val=new OurTeam1({});\n//The JSON.stringify() method will\
    \ return the  values of the collection in a JSON format\ndocument.write(\"The\
    \ values contained in our collection are: \",JSON.stringify(val));\n</script>\n\
    </body>\n</html>\n```\n\nJust write the program as it has been written above,\
    \ and then execute it. You will get the following as its output:\n\n```\nThe values\
    \ contained in our collection are:\n[{\"player\":\"john\",\"country\":\"USA\"\
    }]\n```\n\n# # *Initialize*\n\nWhen the model instance has been created, it can\
    \ be invoked by definition of the “*initialize*” function once the collection\
    \ has been created.\n\nThe method takes the syntax given below:\n\n```\nnew Backbone.Collection(models,\
    \ options)\n```\n\nThe following parameters have been used in the above syntax:\n\
    \n- models- for specification of the initial array of models.\n- options- these\
    \ are the collections types which are directly attached to the collection by passing\
    \ of a model object.\n\nThe example given below shows how this can be done:\n\n\
    ```html\n<!DOCTYPE html>\n<head>\n<title>Collection Sample</title>\n<script src=\"\
    https://code.jquery.com/jquery-2.1.3.min.js\" type=\"text/javascript\">\n</script>\n\
    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.2/underscore-min.js\"\
    \ type=\"text/javascript\"></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.2/backbone-min.js\"\
    \ type=\"text/javascript\"></script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n//The model 'OurTeam' has the default values and is extended by use of the\
    \ Backbone.Model class\nvar OurTeam = Backbone.Model.extend({\ndefaults: {\nplayer:\
    \ \"John\",\ncountry: \"USA\"\n},\n//The model instance will be invoked by definition\
    \ of the initialize function\ninitialize: function(){\ndocument.write(\"Welcome\
    \ to MySite!!!\");\n}\n});\n//The 'OurTeam1' is a collection instance and the\
    \ model 'OurTeam' has been specified by overriding of the 'model' property\nvar\
    \ OurTeam1 = Backbone.Collection.extend({\nmodel: OurTeam\n});\nvar player1 =\
    \ new OurTeam({\nplayer: \"john\",\ncountry: \"USA\"\n});\n//The 'player1' is\
    \ the type of collection by passing of model object in our collection\nvar val=new\
    \ OurTeam1([player1]);\n//The 'val.models' will define the array of models inside\
    \ our collection\ndocument.write(\"<br>\"+JSON.stringify(val.models));\n</script>\n\
    </body>\n</html>\n```\n\nOnce you have written the above program, just execute\
    \ it, and you will observe the following as its output:\n\n![](img/d6f7f47701d5c58895394a113566227d_97_0.png)"
  mdcn: "\n# 验证 (Validate)\n\n此方法用于对用户提供的模型和输入进行验证。如果发现输入的无效性，将显示指定的错误信息；如果确认输入有效，则直接将结果展示而不输出任何负面信息。\n\
    \n它采用以下语法：\n\n```\nmodel.validate(attributes,options)\n```\n\n使用的参数如下：\n\n- attributes\
    \ - 此处用于定义模型的属性。\n- options - 这将包含\"*true*\"选项，供验证属性的使用。\n\n请考虑下面的示例，展示了如何进行此操作：\n\
    \n```html\n<!DOCTYPE html>\n<head>\n<title>模型样本 </title>\n<script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
    \ type=\"text/javascript\"></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.2/underscore-min.js\"\
    \ type=\"text/javascript\"></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.2/backbone-min.js\"\
    \ type=\"text/javascript\"></script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\nvar Human = Backbone.Model.extend({\ndefaults: {\nname: 'joel',\nage: 26,\n\
    occupation: 'typist'\n},\ninitialize : function(){\nthis.on(\"invalid\",function(model,err){\n\
    document.write(err);\n});\n},\nvalidate: function(attributes) {\nif ( attributes.age\
    \ < 26 ) {\nreturn 'The age of the person is less than 26, enter the correct age!!!\
    \ '\n}\nif ( ! attributes.name ) {\nreturn 'please provide the name!!!';\n}\n\
    },\n});\nvar human = new Human();\nhuman.on('invalid', function() {\nthis.arguments;\n\
    });\nhuman.set({ age : '20' }, { validate : true });\n</script>\n</body>\n</html>\n\
    ```\n\n按照上述方式编写程序，然后执行它。观察到的输出如下：\n\n该人的年龄小于 26 岁，请输入正确的年龄！！！\n\n# # 第五章 - 集合\
    \ (Collections)\n\n集合用于表示模型的有序集。若要创建新集合，只需扩展 Backbone 的 collection 类即可。在特定集合中的模型触发的事件也会直接在集合上触发。这意味着任何人都可以监听集合中模型的特定属性所做的任何更改。\n\
    \n有一些方法可用于操作 Backbonejs – collection。让我们讨论其中一些方法。\n\n# # 集合扩展 (Collection Extend)\n\
    \n此功能用于扩展 backbone 的集合类以创建新集合。\n它采用以下语法：\n\n**Backbone.Collection.extend(properties,\
    \ classProperties)**\n\n上述语法中使用的参数如下：\n\n- properties - 此处用于为我们集合类的实例属性提供定义。\n\
    - classProperties - 类属性的值附加到集合的构造函数函数上。\n\n请考虑下面的示例，展示了如何进行此操作：\n\n```html\n<!DOCTYPE\
    \ html>\n<head>\n<title>Collection Sample</title>\n<script src=\"https://code.jquery.com/jquery-2.1.3.min.js\"\
    \ type=\"text/javascript\"></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.2/underscore-min.js\"\
    \ type=\"text/javascript\"></script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.2/backbone-min.js\"\
    \ type=\"text/javascript\"></script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n//模型 'OurTeam' 将包含默认值，并使用 Backbone.Model 类扩展\n\nvar OurTeam = Backbone.Model.extend({\n\
    \    defaults: {\n        player: \"John\",\n        country: \"USA\"\n    },\n\
    });\n\n//'OurTeam1' 是我们集合的实例\nvar OurTeam1 = Backbone.Collection.extend({\n  \
    \  model: OurTeam //我们通过覆盖 'model'属性为 our collection（我们的集合）指定了模型'OurTeam'\n});\n\
