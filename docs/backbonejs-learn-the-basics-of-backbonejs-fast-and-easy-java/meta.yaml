    the trademark is without permission or backing by the trademark owner.** All trademarks
    and brands within this book are for clarifying purposes only and are the owned
    by the owners themselves, not affiliated with this document.


    ## Introduction


    Backbonejs is a very useful framework when it comes to creating applications which
    can be executed in the browser. It helps the developer to create the client-side
    part of the application. It employs the use of the MVC framework so as to structure
    the application.


    This also makes ${}^{\mathscr{C}}$ possible for them to separate the user interface
    part from the business logic of the application. Due to the increased need for
    web applications, you should learn how to use this framework. This will help you
    to create an amazing client part for your application. As long as you are an expert
    in JavaScript, you will find it easy to learn Backbonejs.


    However, even if you have not learned JavaScript, this book will make it easy
    for you to learn Backbonejs.


    ## Chapter 1- Overview


    Backbonejs is a JavaScript library which is used for the development of the client
    side of applications which can run in a web browser. It uses the MVC framework
    so as to structure the app. With this framework, the data is abstracted in model,
    the Dom into views, and events are used for binding the two.


    Jeremy Ashkenas developed Backbonejs and released it on October 13, 2010. It allows
    us to use JavaScript functions so as to create the front-end part of applications
    in an easy manner. With Backbonejs, the developer is provided with various building
    blocks so as to develop the client side of the application. Examples of these
    building blocks include the models, the views, routers, collections, and the events.
    Whenever the model part of the application is changed, the HTML for the app will
    also be updated. With this library, the developer will find it easy for them to
    separate the interface part and the business logic.


    The library is open-source, and it will provide you with over 100 extensions.
    It will help you in structuring your code. It is responsible for handling the
    model having the user data, and this data will be displayed on the server side
    in the same format as it was entered on the client side.


    ## Chapter 2- Setting up the Environment


    The process of setting up Backbonejs is very easy. There are two ways that one
    can set up this library. These are discussed below:


    - 1. Downloading the library from its official website.

    - 2. Downloading the library from CDNs.


    ### Download the library from its official website.


    On visiting the official website for Backbonejs, you will get the following screen:


    As shown in the above figure, you will have three options for download. These
    are discussed below:


    - 1. Development version- just right click on the button and then save as. You
    will be having the full source JavaScript library.

    - 2. Production version- right click on the button and save as. You will have
    a packed and gzipped Backbone-min.js library file.

    - 3. Edge version- right click on the button, and then save as. You will obtain
    an unreleased version of the library, that is, one which is still under development.
    Using this version of the library is associated with a risk.


    ### Dependencies


    The following are the JavaScript files which Backbonejs depends on:


    - 1. Underscore.js- it is a hard dependency and has to be included.

    - 2. jQuery.js- this file has to be included for Restful persistence and history
    support via the Backbone.Router and the DOM manipulation with the Backbone.View.

    - 3. json2.js- this file should be included for support by the older version of
    the Internet Explorer.


    ### Downloading the library from CDNs


    Content Delivery Network (CDN) is just a network made up of servers which is used
    for serving users with files. Once a CDN link has been used in the page, the responsibility
    of hosting the files will be moved from your local server to your external ones.
    This will mean that a visitor who had visited your webpage and downloaded the
    library from the same network will not need to re-download it.


    The following are the JavaScript files which Backbone is dependent on:


    - jQuery

    - Underscore


    The CDN for the above should be as follows:


    ```

    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.5.2/jquery.min.js"></script>

    ```


    ```

    <script type="text/javascript" src="http://ajax.cdnjs.com/ajax/libs/underscore.js/1.1.4/underscore-min.js"></script>

    ```


    ```

    <script type="text/javascript"

    src="http://ajax.cdnjs.com/ajax/libs/backbone.js/0.3.3/backbone-min.js"></script>

    ```


    Consider the example given below, which has been created with Backbone.js:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

    <title>Hello there using Backbone.js</title>

    </head>

    <body>


    <!-- ============ -->

    <!-- The HTML -->

    <!-- ============ -->

    <div id="container">Loading...</div>

    ```'
  mdcn: "\n # Backbone.js\n\n简单的 Web 应用构建。\n\n一天之内掌握 Ember.js！\n\nTodd Abell\n\n#\
    \ Backbone.js\n\n## 快速且轻松地学习 Backbone.js 基础！\n\n作者：Todd Abell\n\n### 版权 © 2016\
    \ Todd Abell\n\n版权所有\n\n版权 © 2016，Todd Abell。版权所有。未经作者事先书面许可，不得以任何形式或任何方式（包括但不限于复印、录音或其他电子或机械方法）复制、分发或传播本出版物的任何部分，但版权法允许的必要引用（用于关键评论）及某些其他非商业用途除外。\n\
