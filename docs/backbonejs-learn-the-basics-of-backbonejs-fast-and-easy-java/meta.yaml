    ## Router Execute


    This is used when a route has matched a corresponding callback. It takes the following
    syntax:


    ```

    router.execute(callback, args)

    ```


    The following parameters have been used in the above syntax:


    - callback- this one is executed whenever a matching route is found.

    - args- these are arguments which are passed within the execute method.


    Consider the example shown below, which shows how this can be done:


    ```

    <!DOCTYPE html>

    <head>

    <title>Router Sample</title>

    <script src="https://code.jquery.com/jquery-2.1.3.min.js" type="text/javascript"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.2/underscore-min.js"
    type="text/javascript"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.2/backbone-min.js"
    type="text/javascript"></script>

    </head>

    <script type="text/javascript">

    //''RMenu'' is the name of our view class

    var Rt1 = Backbone.View.extend({

    //Creating the first route link for the text to be changed after the click event
    has been triggered

    template: ''<b>This is the first route</b>'',

    //The ''initialize'' function will create a new constructor for our router instantiation

    initialize: function () {

    this.execute();

    },

    //This will be called when the route matches its corresponding callback

    execute: function () {

    this.$elem.html(this.template);

    }

    });

    var R2 = Backbone.View.extend({

    template: ''<b>This is the second route </b>'',

    initialize: function () {

    this.execute();

    },

    execute: function () {

    this.$elem.html(this.template);

    }

    });

    //''ApplicationRouter'' is the name of our router class

    var ApplicationRouter = Backbone.Router.extend({

    routes: {

    '''': ''homeRoute'',

    ''route/1'': ''homeRoute'',

    ''route/2'': ''aboutRoute'',

    },

    //After clicking on route1, it will navigate to our custom view class ''Rt1''

    homeRoute: function () {

    var route1 = new Route1();

    $("#content").html(route1.el);

    },

    //After clicking on r2, it will navigate to our custom view class ''R2''

    aboutRoute: function () {

    var r2 = new R2();

    $("#content").html(r2.elem);

    }

    });

    var applicationRouter = new ApplicationRouter(); //This is an instantiation of
    our router

    //It begins listening to our routes and managing the history for the bookmarkable
    URLs

    Backbone.history.start();

    </script>

    <body>

    <div id="navigation">

    <a href="#/route/1">first route</a>

    <a href="#/route/2">second route</a>

    </div>

    <div id="content"></div>

    </body>

    </html>

    ```


