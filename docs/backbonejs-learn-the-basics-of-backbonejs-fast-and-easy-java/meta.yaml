    \ 章 - 模型\n\n第 5 章 - 集合\n\n第 6 章 - 路由器\n\n结论\n\n## 免责声明\n\n**尽管已尽一切努力验证本书中提供的信息，但作者不对其中所含主题的误差、遗漏或相反解释承担任何责任。**\
    \ 本书提供的信息仅用于教育和娱乐目的。读者需对自己的行为负责，作者不对因使用此信息而产生的任何实际或感知的责任或损害承担责任。\n\n本书中使用的商标未获任何许可，商标的发布未经商标所有者同意或授权。本书内所有的商标和品牌仅用于说明目的，归其各自所有者所有，与本文件无关。\n\
    \n**本书中使用的商标未获任何许可，商标的发布未经商标所有者同意或授权。** 本书内所有的商标和品牌仅用于说明目的，归其各自所有者所有，与本文件无关。\n\
    \n## 简介\n\nBackbone.js 是一个非常实用的框架，适用于构建可在浏览器中执行的应用程序。它帮助开发者构建应用程序的客户端部分。它采用 MVC\
    \ 框架来构建应用程序架构。\n\n这也使得${}^{\\mathscr{C}}$ 分离应用程序的用户界面部分与业务逻辑成为可能。由于对 Web 应用程序的需求不断增加，您应该学习如何使用此框架。这将帮助您为您的应用程序创建一个出色的客户端部分。只要您是\
    \ JavaScript 专家，就会觉得学习 Backbone.js 很容易。\n\n然而，即使您尚未学习过 JavaScript，本书也会让您轻松掌握 Backbone.js。\n\
    \n## 第 1 章 - 概述\n\nBackbone.js 是一个 JavaScript 库，用于开发可在 Web 浏览器中运行的应用程序的客户端部分。它使用\
    \ MVC 框架来构建应用程序结构。通过该框架，数据被抽象为模型，DOM 被抽象为视图，而事件则用于将两者绑定在一起。\n\nJeremy Ashkenas\
    \ 开发了 Backbone.js，并于 2010 年 10 月 13 日发布。它允许我们使用 JavaScript 函数以简单的方式创建应用程序的前端部分。Backbone.js\
    \ 为开发者提供了各种构建模块，以便开发应用程序的客户端。这些构建模块的示例包括模型、视图、路由器、集合和事件。每当应用程序的模型部分发生变化时，应用程序的\
    \ HTML 也会随之更新。使用该库，开发者可以轻松地将界面部分与业务逻辑分离。\n\n该库是开源的，并提供超过 100 个扩展。它将帮助您构建代码结构。它负责处理包含用户数据的模型，并且这些数据将以与客户端输入时相同的格式在服务器端显示。\n\
    \n## 第 2 章 - 设置环境\n\n设置 Backbone.js 的过程非常简单。设置该库有两种方式，如下所述：\n\n- 1. 从其官方网站下载库。\n\
    - 2. 从内容分发网络（CDN）下载库。\n\n### 从官方网站下载库\n\n访问 Backbone.js 的官方网站，您将看到以下界面：\n\n如上所示，您有三个下载选项，如下所述：\n\
    \n- 1. 开发版本 (Development version)- 只需右键点击按钮并选择“另存为”。您将获得完整的源代码 JavaScript 库。\n\
    - 2. 生产版本 (Production version)- 右键点击按钮并选择“另存为”。您将获得打包并压缩好的 Backbone-min.js 库文件。\n\
    - 3. 边缘版本 (Edge version)- 右键点击按钮并选择“另存为”。您将获得一个尚未发布的库版本，即仍处于开发中的版本。使用此版本的库存在风险。\n\
    \n### 依赖项\n\n以下是 Backbone.js 所依赖的 JavaScript 文件：\n\n- 1. Underscore.js- 这是硬性依赖项，必须包含。\n\
    - 2. jQuery.js- 此文件必须包含，以支持通过 Backbone.Router 实现的 Restful 持久化和历史功能，以及通过 Backbone.View\
    \ 实现的 DOM 操作。\n- 3. json2.js- 此文件应包含，以支持旧版 Internet Explorer。\n\n### 从 CDN 下载库\n\
    \n内容分发网络 (CDN) 是由服务器组成的网络，用于向用户提供文件。一旦在页面中使用了 CDN 链接，文件的主机责任将从您的本地服务器转移到外部服务器。这意味着访问者如果曾经访问过您的网页并从同一网络下载了库，则无需重新下载。\n\
    \n以下是 Backbone 所依赖的 JavaScript 文件：\n\n- jQuery\n- Underscore\n\n上述内容的 CDN 链接应如下所示：\n\
    \n```\n<script type=\"text/javascript\" src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.5.2/jquery.min.js\"\
    ></script>\n```\n\n```\n<script type=\"text/javascript\" src=\"http://ajax.cdnjs.com/ajax/libs/underscore.js/1.1.4/underscore-min.js\"\
    ></script>\n```\n\n```\n<script type=\"text/javascript\"\nsrc=\"http://ajax.cdnjs.com/ajax/libs/backbone.js/0.3.3/backbone-min.js\"\
    ></script>\n```\n\n以下是一个使用 Backbone.js 创建的示例：\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"UTF-8\">\n<meta http-equiv=\"X-UA-Compatible\" content=\"\
    IE=edge,chrome=1\">\n<title>Hello there using Backbone.js</title>\n</head>\n<body>\n\
    \n<!-- ============ -->\n<!-- The HTML -->\n<!-- ============ -->\n<div id=\"\
    container\">Loading...</div>\n```\n"
