    ## Chapter 3- Events in Backbonejs


    The purpose of events is to bind objects and trigger custom events. To bind custom
    events, one can use the desired name that we choose.


    The following are some of the methods which can be used for the manipulation of
    Backbonejs-Events.


    ## Event On


    It is used for binding an event to an object and the callback function. Whenever
    the event is fired, the callback function will be called. It takes the syntax
    given below:


    ```

    object.on(event, callback function, [context])

    ```


    The following parameters are used:


    - event- this is used for binding an object.

    - callback- this is a reference to the code.

    - context- this is the object which we can pass to the callback function.


    Consider the example given below, which shows how the event can be used:


    ```

    <!DOCTYPE html>


    <head>


    <title>Event On </title>


    <script src="https://code.jquery.com/jquery-2.1.3.min.js" type="text/javascript">


    </script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.2/underscore-min.js"
    type="text/javascript"></script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.2/backbone-min.js"
    type="text/javascript"></script>


    </head>


    <body>


    <script type="text/javascript">

    ```


    //Let us create an object ''myValue'' and extending it with the Backbone.Events
    method


    ```

    var myValue = _.extend({name:''Hello!!!''}, Backbone.Events);

    ```


    // The method "on()" will bind the callback function to the object and invoke
    whenever an event is triggered


    ```

    myValue.on(''myFunction'', function () {


    document.write("The value triggered is: ");


    document.write(this.name);

    ```


    //The name will be shown once the current object has


    been triggered.


    });


    //The function ''myFunc'' will be triggered on the object ''myValue''


    myValue.trigger(''myFunction'');

    </script>

    </body>

    </html>


    That is how it can be done. You can run the program, and you will observe the
    following output:


    ![](img/d6f7f47701d5c58895394a113566227d_24_0.png)


    ## “Off” Event


    With this event, the callback functions or events from an object will be removed.
    It takes the following syntax:


    ```

    object.off(event, callback function, [context])

    ```


    The following parameters have been used in the above syntax:


    - event- this is used for binding an object.

    - callback- this is a reference to the code.

    - context- this is the object which we can pass to the callback function.


    Consider the example given below:


    ```

    <!DOCTYPE html>

    <head>

    <title> Off Event </title>

    <script src="https://code.jquery.com/jquery-2.1.3.min.js" type="text/javascript"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.2/underscore-min.js"
    type="text/javascript"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.2/backbone-min.js"
    type="text/javascript"></script>

    </head>

    <body>

    <script type="text/javascript">

    //we are creating the object ''myValue'' and extending it with the Backbone.Events
    method

    var myValue = _.extend({name:''hello''}, Backbone.Events);

    var myFunction = function () {

    document.write(''Hello'');

    };

    var myFunction1 = function () {

    document.write(''Welcome to my site'');

    };

    //The method on() will bind our callback function to the objects ''myFunction''
    and ''myFunction1''

    myValue.on(''log'',myFunction);

    myValue.on(''log'',myFunction1);

    document.write(''Before we can use the off event, the values will be: '');

    //the trigger() method callbacks for our given event and show the text defined
    in function ''myFunction'' and ''myFunction1'' functions

    myValue.trigger(''log'');

    ```


    //The method off() will remove the callback for function ''myFunction'' and logs
    only

    the text of ''myFunction1''


    myValue.off(''log'',myFunction);

    document.write("<br>");

    document.write(''After the use off event, the values will be: '');

    myValue.trigger(''log'');

    </script>

    </body>

    </html>


    That is how it can be implemented. You can write the code as it has been written
    above

    and then execute it. You will observe the following as the output:


    ![](img/d6f7f47701d5c58895394a113566227d_27_0.png)


    That will be the output after opening the file in an HTML browser.


    ## Trigger Event


    This will invoke the callback functions for the events which have been given.
    It takes the following syntax:


    object.trigger(event,[args])


    The following parameters have been used in the above syntax:


    - event- this is used for binding an object.

    - args- this is the one responsible for passing the arguments or the values to
    the callback function.


    Consider the example given below, which shows how this can be done:


    ```

    <!DOCTYPE html>

    <head>

    <title>Trigger Event </title>

    <script src="https://code.jquery.com/jquery-2.1.3.min.js" type="text/javascript"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.2/underscore-min.js"
    type="text/javascript"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.2/backbone-min.js"
    type="text/javascript"></script>

    </head>

    <body>

    <script type="text/javascript">

    //Creating an object ''myValue'' and extending it by use of Backbone.Events method

    var myValue = _.extend({title:''Hello!!!'', site:''www.mysite.com''}, Backbone.Events);


    //The method on() will bind our callback function to the object

    myValue.on(''myFunction'', function () {

    document.write("The value triggered for the site is: ");

    document.write(this.site); //the value of the site will get displayed by referring
    to the current object

    });

    // The method trigger() will trigger the event ''myFunction'' on ''myValue''

    myValue.trigger(''myFunction'');

    </script>

    </body>

    </html>

    ```


    Just write the program as it is and then execute it. You will observe the following
    as its output:'
