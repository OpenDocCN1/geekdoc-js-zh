    \n## Has（拥有）\n\n如果属性被设置为非 `undefined` 或非 `null` 的值，此方法将返回 `true`。它采用以下语法：\n\n\
    ```\nmodel.has(attribute)\n```\n\n参数 `attribute` 将定义所创建模型的属性。请看下面的示例，了解如何完成此操作：\n\
