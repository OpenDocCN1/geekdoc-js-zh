    route two was called.\");\n\n},\n});\nvar applicationRouter=new Router; //This\
    \ is an instantiation of our router by use of\nthe 'new' keyword\n//It begins\
    \ listening to our routes and managing the history for the bookmarkable\nURL's\n\
    Backbone.history.start();\n</script>\n</body>\n</html>\n```\n\nThat is how it\
    \ can be used. You can write and run the program. The following output will be\
    \ observed from it:\n\nroute one has been called.\n\n## Router Route\n\n**This**\
    \ is used for providing a route for our router and appending the router parameter\
