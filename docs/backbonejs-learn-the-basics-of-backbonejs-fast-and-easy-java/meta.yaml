    \ = Backbone.Model.extend({\ninitialize: function(){\ndocument.write(\"Welcome\
    \ to MySite..\");\n}\n});\nvar ourmodel = new OurModel;\n</script>\n</head>\n\
    <body></body>\n</html>\n```\n\n程序编写并执行后，你将得到以下输出：\n\n![](img/d6f7f47701d5c58895394a113566227d_48_0.png)\n\
    \n## Get（获取）\n\n此方法用于获取模型上特定属性的值。它采用以下语法：\n\n```\nmodel.get(attribute)\n```\n\n\
    其中 `attribute` 将用于定义所创建模型的属性。下面的示例展示了如何实现这一点：\n\n```\n<!DOCTYPE html>\n<head>\n\
