  \n# 勘误\n\n在 BPB Publications，我们对自己的工作深感自豪，并遵循最佳实践确保内容的准确性，为读者提供沉浸式的阅读体验。我们的读者如同镜子，我们借助他们的反馈来反思并改进出版过程中可能出现的任何人为错误。为了保持质量，并帮助我们联系到可能因任何意外错误而遇到困难的读者，请通过以下邮箱联系我们：\n\
  \n**errata@bpbonline.com**\n\nBPB Publications 大家庭非常感谢您的支持、建议和反馈。\n\n# 第 1 章：React\
  \ 入门\n\nJavaScript：它是 Web 的编程语言。自 Web 诞生以来，开发者一直渴望在交互性、动画、效果和稳定性方面为最终用户提供越来越好的体验。JavaScript\
  \ 让这一切成为可能。随着它的发展，出于一些显而易见的原因，需要引入框架和库，以实现更快的开发和更好的稳定性。\n\nReact 就是生态系统中的一员。React\
  \ 自称是“用于构建用户界面的 JavaScript 库”。但老实说，虽然这句话没错，但我们认为 React 远不止于此。它可以发展成一个完整的生态系统，为一些最复杂的\
  \ Web 应用程序系统提供支持，例如 Facebook。\n\n我们将快速浏览 React 基础知识，然后进入中高级主题，这些主题将真正让你领略 React\
  \ 的精髓，并最终帮助你开始使用 React 编写可用于生产环境的应用程序。\n\n简单来说，React 是一个**用户界面**（**UI**）库。我们来分解一下：\n\
  \n1.  React 本身说它是一个库，这意味着它不会试图将所有东西都打包在一起。相反，你可以选择项目中需要的功能并加以实现。\n\n2.  React 说它是一个\
  \ UI 库，用于构建用户可见的界面。这意味着什么？简单来说，就是创建和维护用户在屏幕上看到的内容。\n\n### 结构\n\n*   引言\n*   理解 React\n\
  *   对 React 作为 UI 库工作原理的基本理解\n*   声明式编程与命令式编程\n*   后续 React 主题的速查表\n\n### 目标\n\n\
  在本入门章节中，我们将了解 React 究竟做了什么，以及为什么值得关注。我们将从表面上看它如何作为 UI 库工作，以及 React 的声明式方法在创建更好的\
  \ UI 系统方面有多么强大。最后，我们将开始 React 编程，但本章结尾会提供一些笔记，这些笔记作为 JavaScript 的复习资料可能会很方便。\n\n\
  ## React 基于组件\n\nReact 使用了*组件*。其理念很简单——React 说，与其把所有代码都写在同一处（就像我们编写简单 HTML 页面时通常做的那样），不如将页面的不同（通常是独立的）部分拆分成不同的组件。这大大提高了代码的可维护性，并允许开发者拥有更快、更干净的代码库。我们将有专门的章节来讲解组件的使用，因为它是\
  \ React 的核心。\n\n## React 是声明式的\n\n这里我们主要关注两种编程范式——声明式编程和命令式编程。让我们从一个简单的例子开始。\n\n\
  当你编写代码时，你可以指定：\n\n1.  你想做什么？\n2.  你想怎么做？\n\n如果你同时指定了这两者，那么你就在使用命令式编程实践。如果你只指定了你想做什么，那么你就在使用声明式编程方式。这里有一个简单的例子。\n\
  \n假设你想在盒子周围画一个边框。在 CSS 中，你只需说 `border: 2px solid black`。这就是声明式的。你只说了你想做什么，而不是怎么做。另一方面，如果你尝试用原生\
  \ JavaScript 画边框，你必须指定四个坐标，然后手动用代码画线。这就是命令式的方式。\n\n声明式编程有其优缺点，但优点几乎总是大于缺点：\n\n1.\
  \  声明式代码可以利用高度优化的算法。由于“如何做”对最终用户是抽象的，声明式代码下的命令式模型可以使用非常复杂的代码来提供显著的性能提升，同时为用户提供简单的声明式方式来使用相同的功能。\n\
  \n2.  声明式编程带来了其他好处，如代码可扩展性、更少的错误和更易理解的代码。\n\n回到 React，它是**声明式**的。这意味着你只需告诉 React“什么”你想做，而不是“如何”做。React\
  \ 在底层以非常优化的方式为你管理一切。\n\n我们将在最后一章详细讨论 React 虚拟 DOM、协调以及其他可选的高级功能在底层是如何工作的。\n\n##\
  \ 快速 JS 复习\n\n在深入 React 生态系统之前，我们想提一些你在使用 React 时绝对应该了解的 JS 要点。现在快速浏览一下本节，以后需要时再回来查阅。\n\
  \n### this\n\n对于很多人来说，`this` 在 JavaScript 中出奇地复杂。请记住，在函数中，`this` 总是指向该函数的调用方式，但箭头函数除外，其中\
  \ `this` 是词法作用域的：\n\n```\nfunction myName() {\nreturn this.myname\n}\nconst myNameButArrow\
  \ = () =>console.log(this.myname)\nconst person1 = { myname: “Mehul”, myName }\n\
  const person2 = { myname: “James”, myName }\nconst person3 = { myname: “Enzo”, myName:\
  \ myNameButArrow }\nconsole.log(person1.myName())\nconsole.log(person2.myName())\n\
  console.log(person3.myName())\n```\n\n输出如下截图所示：\n\n![](img/image2.jpg)\n\n**图 1.1：**\
  \ 输出\n\n### 箭头函数\n\n箭头函数允许你编写更小的函数，对 `this` 进行词法作用域绑定，并且不能使用 `new` 关键字实例化：\n\n```\n\
  const obj = {\nmyFunction: function() {\nreturn this\n},\ncoolFunction: () => {\n\
  return this\n}\n}\nconsole.log(obj.myFunction()) // 输出原始 obj\nconsole.log(obj.coolFunction())\
  \ // 输出 window（全局对象）\n```\n\n这里我们看到与前面相同的代码及其输出如下所示。如前所述，第一条语句输出原始对象，第二条语句输出整个 window\
  \ 对象：\n\n![](img/image1.jpg)\n\n**图 1.2：** 输出\n\n### .map\n\n`.map` 允许你操作数组而不改变原始数组——也就是说，`.map`\
  \ 对数组中的每个元素进行操作，并返回一个新数组，该数组由你在传递给 `.map` 的函数中返回的元素组成。\n\n下面是一个快速示例，说明 map 在这种情况下如何工作：\n\
  \n```\nconst arr = [{\nname: “Mehul Mohan”,\ncountry: “India”\n}, {\nname: “James\
  \ Paul”,\ncountry: “USA”\n}]\nconst component = arr.map(name =>arr.name)\nconsole.log(component)\
  \ // 输出 [“Mehul Mohan”, “James Paul”]\nconsole.log(arr) // 输出原始对象\n```\n\n上面的代码输出了更改后的数组，正如你对\
  \ map 函数的预期。然而，这并不会修改原始数组。\n\n### .reduce\n\n`.reduce` 允许你将数组缩减为单个值。这是通过一个累加器和当前迭代的值来实现的。让我们看一个例子来理解：\n\
  \n```\nx = [1,2,3,4,5]\nx.reduce((acc, val) => acc + val, 0)\n```\n\n\n\n\n\n在前面的示例中，`reduce`\
  \ 接受一个函数，该函数每次被调用时都会传入两个值：累加器（accumulator）和当前值（current value）。你在函数中返回的任何内容都会成为下一次函数调用的累加器值。你还可以选择将初始累加器值作为第二个参数传递给\
  \ `.reduce` 函数。如果未提供该参数，累加器将初始化为数组的第一个元素，并从第二个元素开始对数组进行归约。\n\n## 类（Classes）\n\n\
  ES6 中的类仅仅是函数的语法糖。JavaScript 并非面向对象语言，它遵循原型继承模型，类也是如此。不过，提出的语法使其看起来与面向对象非常相似。\n\n\
  以下是 ES6 类的一个示例：\n\n```\nclass ILoveNumbers {\n  constructor(num) {\n    this.anothernum\
  \ = num\n  }\n  getNum() {\n    console.log(this.anothernum)\n  }\n};\n\nclass IHateNumbers\
  \ extends ILoveNumbers {\n  constructor(num) {\n    super(num**num)\n    this.num\
  \ = num\n  }\n  getNum() {\n    console.log(this.num)\n  }\n  getNumFromParent()\
  \ {\n    console.log(super.getNum())\n  }\n};\n\nlet obj = new IHateNumbers(5)\n\
  obj.getNum() // 5\nobj.getNumFromParent() // 3125\n```\n\n关于上述代码的一些重要注意事项：\n\n1.\
  \  这里我们创建了一个简单的类 `ILoveNumbers`，它只存储一个数字。\n\n2.  我们创建了另一个类 `IHateNumbers`，它继承自前一个类。在基于类的语法中，“`扩展`”仅仅意味着你将父类（函数）添加到了当前类（函数）的原型链中。\n\
  \n3.  我们使用了一个特殊的关键字 `super`。通过 `super`，我们可以访问父类。请记住，在方法中使用 `super` 时，`super` 指向的是**定义该方法的对象的原型链**。这意味着，如果我将\
  \ `IHateNumbers` 的原型链更改为其他内容，那么 `super.getFav()` 将无法按预期工作。考虑以下代码：\n\n    ```\n \
  \   class C1{ method() { return 1 } }\n    class C2 extends C1{ method() { return\
  \ super.method() } }\n    class C3{ method() { return 3 } }\n    class C4 extends\
  \ C3{ method() { return 4 } }\n    const obj = new C4\n    console.log(obj.method())\
  \ // 输出 4\n    C4.prototype.method = C2.prototype.method\n    console.log(obj.method())\
  \ // 输出 1\n    ```\n\n4.  这里你可以清楚地看到，`super.method()` 并没有调用 `C3` 的方法，而是调用了 `C1`\
  \ 的方法。然而，如果你将 `C4` 的方法定义为返回 `super.method()`，它就会调用 `C3` 的方法。\n\n## 闭包（Closures）\n\
  \n闭包是 JavaScript 中实现的一个基本概念，它既极其强大又非常优美。用一句话来定义闭包：*函数会记住*。作为计算机科学家，我们普遍认为当函数返回时，它们会清除所有与之关联的局部变量信息。但当你使用闭包时，情况就不同了。例如，考虑以下代码：\n\
  \n```\nfunction a() {\n  let value = 1\n  return () => value++\n}\n\nconst func\
  \ = a()\nfunc() // 1\nfunc() // 2\nfunc() // 3\n```\n\n在上面的函数中，我们可以看到，尽管 `value`\
  \ 是一个局部变量，但在函数 `a` 执行完成后它并没有被销毁。相反，函数记住了它。\n\n## 更多 JavaScript 主题\n\n随着你阅读本书的深入，你会意识到与\
  \ React 框架本身相比，你总是需要用到更多的 JavaScript。虽然我们上面已经讨论了一些常见的 JavaScript 主题，但如果你对 JavaScript\
  \ 基础知识的巩固和夯实感兴趣，我们建议你进一步阅读以下主题。由于本书并非核心 JS 书籍，我们不会过多关注仅限于 JavaScript 的主题，但你随时可以利用这个列表来学习更多内容：\n\
  \n1.  解构（Destructuring）\n\n2.  展开运算符（Spread operator）\n\n3.  ES6 导入/导出模块语法（ES6 import/export\
  \ module syntax）\n\n4.  异步/等待（Async/Await）\n\n5.  JavaScript 中的可选链（Optional chaining）\n\
  \n6.  空值合并（Nullish Coalescing）\n\n7.  原型继承模型（Prototypal inheritance model）\n\n8.\
  \  提升/变量作用域（Hoisting/variable scoping）\n\n## 结论\n\n本章涵盖了一些基本的 React 概念和基础的 JavaScript\
  \ 知识。在下一章中，我们将学习如何搭建 React 开发环境并有效使用它。我们将探索 React 基础知识，逐步深入到服务端渲染框架 Next.js，并最终介绍渐进式\
  \ Web 应用（Progressive Web Apps）的相关信息。请系好安全带，准备开启代码之旅！\n\n# 第 2 章\n\n## 搭建 React\n\
  \n在本章中，我们将介绍一些常见以及不那么常见的将 React 集成到开发工作流中的方法。我们将从最基础的内容开始，比如你应该选择哪个编辑器，一直到最适合你的\
  \ React 应用启动方式，使其满足你的需求并方便你将其投入生产环境。让我们开始吧！\n\n有些人喜欢一直使用**集成开发环境（IDE）**。我们将采用不同的方法。对于\
  \ Web 开发这类事情，IDE 往往会变得非常臃肿。此外，IDE 抽象了很多东西，因此你学到的东西会比预期的少得多。我们将使用（并学习）命令行，使用轻量级文本编辑器编写代码，并构建出色的应用程序！让我们继续本章的内容。\n\
  \n### 结构\n\n*   选择文本编辑器\n\n*   安装 Node 和 NPM\n\n*   搭建 React 项目的方法\n\n*   React\
  \ 的 Hello World\n\n*   JSX\n\n*   转向 TypeScript 用于 React\n\n### 目标\n\n我们将从简单的选择开始——选择你喜欢的文本编辑器来编写代码。然后我们将继续安装和设置所需的技术，这将帮助我们探索搭建第一个\
  \ React 项目的方法。我们还将探讨什么是 JSX 以及它是如何工作的。最后，我们将把重点转向用于 React 的 TypeScript，并在本书中一直使用它，以获得更好的类型系统和无错误的代码。\n\
  \n### 选择文本编辑器\n\n首先，你需要一个编写代码的地方。以下是我们个人推荐的文本编辑器列表。\n\n#### #1 – VSCode\n\n这是目前最流行的文本编辑器，你遇到的大多数\
  \ Web 开发者都会一直使用 VSCode。VSCode 完全可定制，拥有大量额外的插件来提升你的生产力。它是跨平台的（macOS/Linux/Windows），你可以在这里为你的平台获取稳定的二进制文件：[`code.visualstudio.com/#alt-downloads`](https://code.visualstudio.com/#alt-downloads)。\n\
  \n#### #2 – Sublime Text\n\n另一个优秀的文本编辑器是 Sublime Text。如果你对 VSCode 不满意，Sublime Text\
  \ 可以作为第二选择。你可以购买它，但并非强制。Sublime Text 允许你免费使用很长时间，每隔一周左右会弹出一个升级提示。它还附带强大的包系统和出色的主题。从这里下载：[`www.sublimetext.com/3`](https://www.sublimetext.com/3)。\n\
  \n#### #3 – Atom\n\n如果你正在寻找文本编辑器，Atom 也是一个不错的选择。它包含包管理器，完全可定制且免费！你可以从这里下载 Atom 文本编辑器：[`atom.io/`](https://atom.io/)。\n\
  \n### 安装 Node 和 NPM\n\n一旦你的文本编辑器安装并准备就绪（这通常需要 5-10 分钟），就该安装 Node 和 npm 了。如果你的系统上已经安装了它们，可以跳过本节。Node\
  \ 基本上是将 JavaScript 引擎（负责在机器上运行你编写的 JavaScript 的代码）作为本地应用程序放在你的计算机上，而不是仅仅嵌入在 Web\
  \ 浏览器中。而 npm 是其包管理器，用于添加和删除包和依赖项。\n\n\n\n\n\n#### Windows\n\n对于 Windows，请按照以下步骤安装最新稳定版本的\
  \ node 和 npm：\n\n1. 访问 [`nodejs.org/en/download/`](https://nodejs.org/en/download/)。\n\
  2. 下载 **Windows 安装程序 (.msi)** 文件。根据你的操作系统选择 32 位或 64 位版本。\n3. 按照向导指示完成安装。\n4. 通过从**开始**菜单打开\
  \ `cmd` 来验证安装。\n5. 在 cmd 中输入 `node -v`，检查是否显示一个数字。\n\n#### Linux\n\n对于 Linux，请按照以下步骤安装最新稳定版本的\
  \ node 和 npm：\n\n1. 打开你的命令行（终端）。\n2. 输入 `sudo apt-get update && sudo apt-get install\
  \ npm`。\n3. 根据你的发行版，你可能没有 `apt-get` 作为包管理器。只需找出你的包管理器，并从官方仓库安装 `npm` 包。\n4. 完成后，输入以下命令：`sudo\
  \ npm install -g n`。\n5. 这将在你的系统上安装一个名为 `n` 的 node 版本管理器包。\n6. 完成后，输入：`sudo n stable`。\n\
  7. 这将最终安装 node 和 npm 的稳定版本，并将其添加到你的路径中。\n8. 最后，退出终端并重新启动。这次输入 `node -v`，会看到一个版本号弹出。现在你可以开始了！\n\
  \n#### macOS\n\n如果你使用的是 macOS 系统，以下是获取 node 和 npm 的步骤：\n\n1. 在 macOS 上，你需要一个 brew\
  \ 包管理器。如果你不知道它是什么，很可能你还没有安装。在命令行中输入以下内容来安装 brew 包管理器：`/usr/bin/ruby -e \"$(curl\
  \ -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install)\"`。\n\
  2. 你也可以在这里找到 brew 的安装说明：[`brew.sh`](https://brew.sh)。\n3. 安装 brew 后，输入 `brew install\
  \ node`。\n4. 等待安装完成。\n5. 完成！\n\n### 设置 React 项目\n\n现在，让我们讨论启动 React 项目的各种方式。我们将从最基础的方法开始，逐步过渡到更高级的方法。\n\
  \n#### #1 – 使用 CDN 设置\n\n这是在 React 中编写 Hello World 最直接的方式。你只需通过某个 CDN 网站引入 React\
  \ 库，就可以开始了。例如，考虑以下代码：\n\n```html\n<!doctype HTML>\n<html>\n<head>\n<title>React\
  \ hello world</title>\n</head>\n<body>\n<div id=\"root\"></div>\n<script src=\"\
  https://unpkg.com/react@16/umd/react.production.min.js\"></script>\n<script src=\"\
  https://unpkg.com/react-dom@16/umd/react-dom.production.min.js\"></script>\n<script\
  \ src=\"https://unpkg.com/babel-standalone@6/babel.min.js\"></script>\n<script type=\"\
  text/babel\">\nclass HelloWorld extends React.Component {\nrender() {\nreturn (<p>Hello\
  \ world</p>);\n}\n}\nReactDOM.render(\n<HelloWorld />,\ndocument.getElementById('root')\n\
  );\n</script>\n</body>\n```\n\n这段代码中有很多内容。让我们快速分解一下：\n\n1. 首先，我们加载了两个脚本——react 本身和\
  \ react-dom。为什么是两个？嗯，正如你所见，React 本身并不仅限于 Web。你也会看到 React 通过 React Native 在手机上使用。这意味着\
  \ React 独立于**文档对象模型**（**DOM**），DOM 是浏览器用来渲染 HTML 的结构。因为我们处理的是网页，我们需要核心库，即 React，再加上一个协调器来将\
  \ React 和 DOM（浏览器）粘合在一起，因此需要 React DOM。\n2. 然后我们加载了一个名为 **babel** 的库（更多内容将在下一点中说明）。\n\
  3. 最后，你可以看到我们创建了一个类型为 `text/babel` 的 script 标签。这是因为我们不会在这个 script 标签中编写纯 JavaScript。我们将编写一些需要预处理才能作为常规\
  \ JavaScript 执行的代码。\n4. 最后，我们看到一些 React 结构（类和 `ReactDOM`），但我们现在先忽略它们。有趣的是，我们直接编写了\
  \ `<p>Hello World</p>`，没有任何引号。这不是错误。实际上，这是 JSX（更多内容将在后面介绍）。\n\n#### #2 – 使用 create-react-app\n\
  \n`create-react-app` 是一个工具，允许以最少的配置快速启动 React 项目，最终用户只需进行少量配置。使用方法：\n\n1. 再次打开你的终端（Windows\
  \ 上的 `cmd` 或 macOS/Linux 上的 Terminal）。\n2. 输入 `npm install create-react-app -g`。\n\
  3. 完成后，输入 `create-react-app hello-world`。\n4. 等待完成。完成后，你会看到一个名为 `hello-world` 的目录。`cd\
  \ hello-world` 并输入 `npm start`。\n5. 这将启动你的本地开发服务器。在你喜欢的文本编辑器中打开该文件夹，浏览器窗口会自动打开。之后，你可以进行更改，并看到它们直接在浏览器中反映出来。\n\
  \n#### #3 – 从头开始设置\n\n这对于开始学习 React 来说有点高级，但这样设置意味着你可以微调和控制 React 应用程序的各个方面。我们将遵循类似\
  \ `create-react-app` 的模式，但这次所有的配置文件和文件夹都将对我们可见：\n\n1. 创建一个名为 `hello-world-scratch`\
  \ 的新文件夹：\n\n   ```bash\n   cd hello-world-scratch\n   ```\n\n2. 然后执行 `npm init -y`，这将在该目录中创建一个\
  \ `package.json` 文件。该文件负责处理你的项目依赖。\n\n3. 然后执行 `npm install react react-dom --save`。\n\
  \n4. 这将安装 react 和 react DOM 库（就像我们上面讨论的那样），并将它们标记为“生产所需”依赖（也就是说，即使在发布应用程序时，我们也需要\
  \ React 和 `ReactDOM`）。\n\n5. 最后，执行 `npm install webpack webpack-dev-server webpack-cli\
  \ @babel/core babel-loader @babel/preset-env @babel/preset-react html-webpack-plugin\
  \ --save-dev`。\n\n6. 这将安装所有的 `devDependencies`，即你在编码应用程序时需要的依赖，但在生产环境中不需要。现在我们来分解这些依赖的用途：\n\
  \n   * **Webpack**：Webpack 是一个模块打包系统。简单来说，它组合你的各种资源（JS、CSS 等），以便你可以以可维护的方式（即整洁且不同的文件）自由编写代码，并随后自动化代码的组合和压缩。\n\
  \   * `webpack-cli` 使 webpack 能够执行此操作。\n   * `webpack-dev-server` 使我们能够启动一个服务器来查看代码的输出。\n\
  \   * `html-webpack-plugin` 允许我们动态生成一个 HTML 页面，供 React 脚本运行。别担心，我们主要处理 JavaScript\
  \ 文件，因此我们不需要静态创建 HTML 文件。\n   * `@babel` 包将 JSX 转换转换为正常的、可执行的 JavaScript 代码（更多关于\
  \ JSX 的内容见下文）。\n\n7. 完成后，在命令行中进入你的项目目录，执行 `touch .babelrc`。\n\n8. 这将创建一个名为 `.babelrc`\
  \ 的点文件（注意文件名前面的点）。\n\n9. 在其中粘贴以下内容：`{ \"presets\": [\"@babel/preset-env\", \"@babel/preset-react\"\
  ] }`。\n\n10. 这告诉 babel 在处理 React 代码之前使用以下预设。简单来说，它加载了一组预定义的规则，告诉 babel 如何处理 JSX。\n\
  \n11. 最后，由于 webpack 是我们项目的主要打包工具，我们需要告诉 webpack 让 babel 处理相应文件的“方向盘”。具体做法如下：\n\n\
  \    * 在你的项目根目录中创建一个名为 `webpack.config.js` 的文件，并在其中写入以下内容：\n\n      ```javascript\n\
  \      const path = require('path');\n      const HtmlWebpackPlugin = require('html-webpack-plugin');\n\
  \      module.exports = {\n        entry: path.join(__dirname, 'src/index.js'),\n\
  \        output: {\n      ```\n\n\n\n\n```\npath: path.join(__dirname, 'bundle'),\n\
  filename: 'bundle.js'\n},\nmodule: {\nrules: [\n{\ntest: /\\.(js|jsx)$/,\nexclude:\
  \ /node_modules/,\nuse: ['babel-loader']\n}\n]\n},\nmode: process.env.NODE_ENV ||\
  \ 'development',\nresolve: {\nextensions: ['*', '.js', '.jsx']\n},\ndevServer: {\n\
  contentBase: path.join(__dirname, 'src')\n},\nplugins: [new HtmlWebpackPlugin({\n\
  template: path.join(__dirname, 'src/index.html')\n})]\n};\n```\n\n*   这简单地告诉 webpack：嘿，webpack，当你处理\
  \ `.js` 或 `.jsx` 文件时，加载 babel。\n*   当我们想要查看输出时，需要启动一个 webpack 开发服务器，因此我们将以下内容添加到\
  \ `package.json` 文件的 `scripts` 键中：`\"start\": \"webpack-dev-server --open\"`。\n\
  *   现在，我们将为此创建一个静态 HTML 文件，用于 `src/index.html`：\n\n    ```html\n    <!DOCTYPE html>\n\
  \    <html lang=\"en\">\n    <head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta http-equiv=\"\
  X-UA-Compatible\" content=\"ie=edge\">\n    <title>React Hello World!</title>\n\
  \    </head>\n    <body>\n    <div id=\"root\"></div>\n    </body>\n    </html>\n\
  \    ```\n\n*   最后，让我们创建 `src/index.js` 并在其中写入以下内容：\n\n    ```javascript\n    import\
  \ React from 'react'\n    import ReactDOM from 'react-dom'\n    ReactDOM.render(<div>Hello\
  \ World</div>, document.getElementById('root'))\n    ```\n\n*   就是这样！现在，在你的项目根目录下运行\
  \ `npm start`。你的浏览器应该会打开，屏幕上应该会出现 Hello World。\n\n然而，在本课程中，我们将使用 `create-react-app`\
  \ 方法，因为它抽象了所有 webpack 和 babel 配置，让我们能够专注于编写 React 代码。\n\n### JSX\n\n让我们深入了解一下 JSX，即我们刚刚在\
  \ JavaScript 文件中编写的奇怪 HTML 语法：\n\n`ReactDOM.render(<div>Hello World</div>, document.getElementById('root'))`\n\
  \n你看到我们做了什么吗？你可以看到一个直接编写的 div 标签，没有引号。这就是 JSX。JSX 代表 JavaScript 可扩展标记语言。\n\nJSX\
  \ 是一种不同的语法。它允许你利用 HTML 标记的简洁性，同时进行强大的 JavaScript 计算。你可以包含 JavaScript 表达式、动态 props（属性，或者我们在常规\
  \ HTML 中称之为属性的东西），并同时处理 UI 和功能。\n\n你也可以使用花括号在 JSX 中编写表达式。考虑以下 JSX 示例：\n\n`const\
  \ elem = <div>Hello World { document.location.href } { 5 + 5 } { 'Regular string'\
  \ } </div>`\n\n这是一个完全有效的 JSX 语法，但绝对不是有效的 JavaScript。那么，底层发生了什么？\n\n`JSX 转换`\n\n\
  React 将 JSX 编译为普通的 ES5 代码。考虑以下示例：\n\n`const elem = <div className=\"a-classy-div\"\
  >JSX seems so cool!</div>`\n\n这个示例被编译为以下内容：\n\n`const elem = React.createElement('div',\
  \ { className: 'a-classy-div', 'JSX seems so cool!' })`\n\n后者看起来绝对是有效的 JavaScript\
  \ 语法。这就是 JSX 的魔力。你获得了编写 React 组件的视觉辅助，因为现在你可以轻松避免为 UI 部分编写繁琐的额外 JavaScript 代码。\n\
  \n事实上，前面的两个代码片段是相同的，这意味着你可以直接编写 `React.createElement` 部分，而不是 JSX。当然，对于 UI 开发来说，JSX\
  \ 比裸 JavaScript 更清晰易读。\n\n### 迁移到 TypeScript\n\n现在我们已经用 React 启动并运行了一个基本的 JavaScript\
  \ 项目，是时候引入 TypeScript 了。我们不会立即深入 TypeScript 的所有类型转换、接口等特性。相反，我们只会使用 TypeScript 的最佳部分（即自动完成和无错误代码实践），并在整本书中使用它。以下是启动\
  \ TypeScript 项目的方法：\n\n*   删除我们之前创建的 JS hello world 文件夹。\n*   假设你已经按照上述说明安装了 create-react-app\
  \ 工具，在命令行中写入 `create-react-app hello-world-ts --typescript`。\n*   这将使用 TypeScript\
  \ 初始化你的 React 项目。\n*   最终的文件结构应如下所示：\n\n    ![](img/image11.jpg)\n\n    **图 2.1：**\
  \ 文件结构\n\n最后，我们准备好使用 React 了！\n\n## 结论\n\n我们学习了什么是 JSX，如何用 React 创建项目，以及最终迁移到 TypeScript，因为它提供了更好的类型检查，并让你更容易编写无错误的代码。在后续章节中，我们将深入探讨\
  \ React，了解其基础知识以及与之相关的核心概念。\n\n# 第 3 章\n\n## 组件\n\n组件是 React 的基础部分。其理念如下：网页上的所有内容都可以分解为可重用的视图，称为组件。这些组件可以相互链接，可以完全独立，可以感知其父组件，或者也可以对其环境完全“*无感知*”。\n\
  \n让我们进一步了解如何使用它们。\n\n### 结构\n\n*   关于组件\n*   类组件与函数式组件\n*   函数式组件\n    *   Props\n\
  \    *   Children\n    *   Hooks\n        *   `useState`\n        *   `useEffect`\n\
  \        *   `useCallback`\n    *   自定义 Hooks\n*   类组件\n    *   Props\n    *   State\n\
  \    *   生命周期方法\n        *   `getDerivedStateFromProps`\n        *   `Render`\n\
  \        *   `getSnapshotBeforeUpdate`\n        *   `componentDidMount`\n      \
  \  *   `componentDidUpdate`\n*   结论\n\n### 目标\n\n本章旨在向你介绍 React 中的组件以及创建组件的两种主要方式。我们将从函数式组件开始，并很快意识到与基于类的组件创建方式相比，这是一种更好、更清晰的方法。我们将学习一些边缘情况，并最终分别了解函数式组件和基于类组件中的\
  \ hooks 和生命周期事件。最后，我们将以对组件的清晰理解结束本章，并迈向更高级的概念。\n\n### 关于组件\n\n组件是 React 的核心。将组件视为与主\
  \ JavaScript 包解耦的代码片段，以提供可维护性，并便于在现有代码库基础上添加功能。通常，你会根据组件在页面 UI 中出现的位置和方式来进行分离。在\
  \ React 16.8 及以上版本中，有两种精确的方式来编写具有类似功能的组件，正如我们接下来要看到的——函数式组件和基于类的组件。\n\n### 类组件与函数式组件\n\
  \n基于类的组件在 React 中已经存在了很长时间。事实上，几乎一直以来，它都是创建具有自身状态的工作 React 组件的唯一方式。随着 hooks 的引入，这种情况发生了变化，我们将在下一节中介绍\
  \ hooks。然而，以下是 hooks 出现后关于类组件和函数式组件的一些要点：\n\n1.  函数式组件（hooks 出现后）显然是 React 中创建组件的更好方式，因为它们比类更清晰，避免了在基于类的组件代码中常见的许多陷阱（例如\
  \ `this` 的绑定），避免了状态突变，并使用副作用而非基于生命周期的模型。\n\n\n\n\n\n2. React 核心团队也推荐优先使用钩子，原因如上所述。尽管基于类的组件短期内不会消失，但我们都同意函数组件是\
  \ React 库未来发展的方向。\n\n话虽如此，学习超出实际使用范围的知识总是有好处的。我们将快速介绍基于类的组件，然后深入探讨函数组件，后者现在是更重要的方面。但首先，让我们从函数组件开始。\n\
  \n### 函数组件\n\n函数组件在 React 中已经存在很长时间了。在进一步讨论之前，让我们先看看这个 Hello World 的 React 代码：\n\
  \n```\nimport React from 'react'\nimport ReactDOM from 'react-dom'\n\nfunction App()\
  \ {\n  return <p>Hello World</p>\n}\n\nReactDOM.render(<App />, document.getElementById('root'))\n\
  ```\n\n你可以看到，这里我们使用了一个名为 `App` 的函数作为 React 组件。那么，如何知道它是一个 React 组件呢？当你将其用作 JSX（例如\
  \ `<App />`）时，它会被编译成以下内容：\n\n```\nimport React from 'react';\nimport ReactDOM from\
  \ 'react-dom';\n\nfunction App() {\n  return React.createElement(\"p\", null, \"\
  Hello World\");\n}\n\nReactDOM.render(React.createElement(App, null), document.getElementById('root'));\n\
  ```\n\n那么这里发生了什么？\n\n1. 你在 JSX 中编写的所有内容都会被编译成等效的 React 调用（我们在第 1 章中讨论过）。JSX 只是前面示例的语法糖。\n\
  \n2. `React.createElement` 返回一个 JavaScript 对象，看起来像这样：\n\n   ![](img/image7.jpg)\n\
  \n   **图 3.1**\n\n现在，我们不想深入探讨 React 的内部机制，但最终 React 会使用这个对象来创建一个树，即虚拟 DOM。现在让我们回到函数组件的一些属性。\n\
  \n#### Props\n\n传递 props（properties 的缩写）是一种常见场景，你几乎总是会用它来将数据传递给子组件。React 的工作方式是父组件将数据传递给子组件。当然，使用\
  \ Context API 你可以神奇地将数据向下传递多层（稍后会详细介绍），但 props 提供了最简单的数据传递方式。让我们看一个例子：\n\n```\n\
  interface props {\n  name: string\n}\n\nconst App: React.FC<props> = props => {\n\
  \  return <p>Hello {props.name}</p>\n}\n\nReactDOM.render(<App name=\"Mehul\" />,\
  \ document.getElementById('root'))\n```\n\n这里你可以看到我们正在使用 TypeScript 来增强 React。我们没有使用\
  \ `function` 关键字创建函数，而是使用了箭头函数表示法，因为目前你无法拥有带类型的函数。\n\n`React.FC` 或 `React.FunctionalComponent`\
  \ 类型（TypeScript）用于定义 `App` 组件，它可以接受并验证使用组件时传递给组件的 props。此外，你可以在 interface 中列出所有\
  \ props 及其数据类型。\n\n### Children\n\nReact 组件有一个特殊的 prop 叫做 `children`，它基本上包含在自定义组件的开始和结束标签之间传递的任何内容。我提到的是“任何内容”而不是“传递的组件”，因为你可以传递任何你喜欢的东西——组件、字符串、函数等等。请看下面的例子：\n\
  \n```\nconst App: React.FC<{ name: string }> = props => {\n  return <div>\n    Hello\
  \ {props.name}\n    <div className=\"children\">\n      {props.children}\n    </div>\n\
  \  </div>\n}\n```\n\n我们可以这样调用这个组件：\n\n```\n<App name=\"Mehul\">\n  <p>Hey there!</p>\n\
  </App>\n```\n\n这是使用 `children` prop 的一种方式。另一种方式是通过函数来使用它们。看这个例子：\n\n```\nconst App:\
  \ React.FC<{ name: string, children(one: string, two: string): JSX.Element }> =\
  \ props => {\n  return <div>\n    Hello {props.name}\n    <div className=\"children\"\
  >\n      {props.children('one', 'two')}\n    </div>\n  </div>\n}\n```\n\n然后我们这样使用这个组件：\n\
  \n```\n<App name=\"Mehul\">\n  {(one: string, two: string) => <p>Hey there! Passed\
  \ attributes: { one } { two }</p>}\n</App>\n```\n\n以下是上一个示例的快速总结：\n\n1. 我们创建了自定义的\
  \ `children` 类型，它接收两个字符串参数并返回一个 `JSX.Element`（即那个 `<p>` 标签）。\n\n2. 在组件中，我们将 `props.children`\
  \ 作为函数使用，并传入两个值来调用它（而不是简单地渲染它）。\n\n3. 父组件使用子组件传递给父组件的值来渲染子组件。这是一种巧妙的方法，可以将少量数据从子组件传递给父组件；通常数据是从父组件传递给子组件，但通过这种方式你可以实现相反的效果。\n\
  \n事实上，我们刚才所做的被称为**渲染 props** 方法。它指的是当 prop（在我们的例子中是 `children`）是一个函数而不是 JSX 元素或常规值时，进行数据传递的方式。\n\
  \n### Hooks\n\n在 React 16.8 之前，仅使用函数无法创建有状态的函数组件。你看到了问题所在，除非像类组件那样，否则无法使用任何 *state*\
  \ 对象。但随着 hooks 的引入，这种情况发生了变化。通过 hooks 引入状态可以带来很多好处。函数组件现在可以*记住*它们的上下文。让我们从 React\
  \ 中现在可用的各种有用的 hooks 以及如何使用它们开始。\n\n#### useState\n\n`useState` 钩子允许你将类中的 `this.state`\
  \ 和 `this.setState` 功能引入函数组件。以下是一个快速示例，展示如何使用它们：\n\n```\nfunction App() {\n  const\
  \ [name, setName] = useState('Mehul')\n  return <p>Hello {name}</p>\n}\n```\n\n\
  让我们关注这一行 `const [name, setName] = useState('Mehul')`。`useState` 方法返回一个包含两个元素的数组，第一个是\
  \ `getter`，第二个是 `setter`。如果你在函数组件中调用 `console.log(useState(\"Mehul\"))`，你会看到类似这样的结果：\n\
  \n![](img/image21.jpg)\n\n**图 3.2**\n\n这里我们可以清楚地看到数组的第一个值是 `getter`，第二个值是一个 `function`。当调用这个函数时，它会更新我们的\
  \ `setter` 变量，类似于调用 `this.setState` 的效果。让我们看一个简单的例子：\n\n```\nfunction App() {\n\
  \  const [name, setName] = useState('Mehul')\n  setTimeout(() => {\n    setName(Math.random())\n\
  \  }, 1000)\n  return <p>Hello {name}</p>\n}\n```\n\n当你运行这段代码时，你会看到名字每秒都会变为一个 0\
  \ 到 1 之间的随机数。请注意，通常约定使用 `X` 和 `setX` 作为 `getter` 和 `setter` 的变量名。当然，你可以使用任何你喜欢的名字，但我建议遵循这个约定，因为它便于区分。\n\
  \n#### useState 不是同步的\n\n这意味着，每当你调用 `useState` 时，不能保证在调用之后使用 `getter` 就能获得更新后的值。例如，考虑这个例子：\n\
  \n```\nconst App: React.FC = props => {\n  const [currentNumber, setCurrentNumber]\
  \ = useState(Math.random())\n  function changeState() {\n    setCurrentNumber(Math.random())\n\
  \    console.log('New number => ${currentNumber}')\n  }\n  return <button onClick={changeState}>Click\
  \ Me { currentNumber }</button>\n}\n```\n\n以下是代码的输出：\n\n![](img/image4.jpg)\n\n\
  **图 3.3**\n\n如果你使用这个组件，你会看到控制台中显示的内容与 UI 中反映的内容不一致。这是因为 `useState` 是异步运行的，不会立即更新变量。\n\
  \n\n\n\n\n现在还有一个问题：如果 `setX` 不是异步的，这意味着如果变量的下一个状态依赖于前一个状态，我们就不能直接在 `setX` 内部使用 `X`！幸运的是，React\
  \ 允许你在 `setX` 中传入一个函数，该函数的第一个参数保证是最新的值。让我们通过这个例子来进一步了解：\n\n```\nconst App: React.FC\
  \ = props => {\n\nconst [counter, setCounter] = useState(0)\n\nfunction add() {\n\
  \nsetCounter(counter => counter + 1)\n\n}\n\nfunction sub() {\n\nsetCounter(counter\
  \ => counter - 1)\n\n}\n\nreturn <>\n\n<p>{ counter }</p>\n\n<button onClick={add}>++</button>\n\
  \n<button onClick={sub}>--</button>\n\n</>\n\n}\n```\n\n这里需要注意几点：\n\n1.  我们可以使用匿名的\
  \ JSX 元素（即 `<>` 和 `</>`）——这不会在 DOM 结构中显示。\n\n2.  我们可以在 `setX` 中传入一个函数，而不是更新后的值。如果你传入一个函数，React\
  \ 会使用最新的状态变量值调用该函数，然后该函数返回的值将被设置为最新的状态。\n\n一个通用的经验法则是：如果你的状态更新涉及基于前一个状态的结果，请使用函数参数的方式；否则，你可以直接传入新值。\n\
  \n#### useStatecallback\n\n在基于类的组件中，`this.setState` 有一个回调函数，当你希望等待状态变量更新后再触发某个操作时可以使用它。在\
  \ hooks 中，这并不那么直接，不过你可以使用另一个 hook 来实现相同的效果。现在让我们来看看这个 hook。\n\n#### useEffect\n\n\
  这个 hook 允许你在某些内容*变化*时执行一段代码。可以把 `useEffect` 看作是 React 内置基础设施上的一个自定义监听实现。\n\n下面是一个非常简单的\
  \ `useEffect` 示例：\n\n```\nconst App: React.FC = props => {\n\nconst [counter, setCounter]\
  \ = useState(0)\n\nuseEffect(() => {\n\ndocument.title = 'Counter is at ' + counter\n\
  \n})\n\nreturn <>\n\n<p>{ counter }</p>\n\n<button onClick={() =>setCounter(c =>\
  \ c + 1)}>Increment</button>\n\n</>\n\n}\n```\n\n好的，这里我们可以看到，我们通过向 `useEffect` 传入一个函数来使用它。这个函数会在每次\
  \ React 渲染（或重新渲染）我们的组件时执行。这个函数最终将文档标题设置为我们的计数器值。在函数中，你总是能获取到状态变量的最新值。这是因为 React\
  \ 根本不会改变状态变量！在使用函数组件和 hooks 时，React 从不改变状态。即使我们使用 `const` 关键字声明简单的字符串/数值，这一点也相当明显。相反，每当\
  \ React 重新渲染我们的组件时，`useState()` 函数会将新更新的状态返回给状态变量，而 `useEffect` 函数会在每次渲染时调用传入的函数。\n\
  \n#### useEffect 依赖项\n\n你很快就会发现 `useEffect` 可能会对性能造成一定负担，因为即使没有任何变化，它也会在每次渲染时反复运行我们传入的函数。让我们看看下面的例子：\n\
  \n```\nconst [counter1, setCounter1] = useState(0)\n\nconst [counter2, setCounter2]\
  \ = useState(0)\n\nuseEffect(() => {\n\ndocument.title = 'Counter is at ' + counter1\n\
  \nconsole.log('Effect called')\n\n})\n\nreturn <>\n\n<span>{ counter1 }</span>&nbsp;\n\
  \n<span>{ counter2 }</span>\n\n<button onClick={() => setCounter1(c => c + 1)}>Increment\
  \ Counter 1</button>\n\n<button onClick={() => setCounter2(c => c + 1)}>Increment\
  \ Counter 2</button>\n\n</>\n```\n\n上述代码对应的输出：\n\n![](img/image8.jpg)\n\n**图 3.4**\n\
  \n显然，我们从未更新 counter1，但 React 仍然在每次重新渲染时调用我们的 `useEffect` 函数。我们可以做得更好。我们可以告诉 React，某个\
  \ effect 只使用一组特定的变量（以数组形式传入），只有当这些变量发生变化时，React 才应该再次调用 effect 函数。否则，调用就没有意义（因为状态变量的值没有变化）。为此，我们可以向\
  \ `useEffect` hook 传入第二个参数，即该 effect 的依赖项。让我们再次看同一个例子，但这次将 counter1 作为依赖项添加进去：\n\
  \n```\nuseEffect(() => {\n\ndocument.title = 'Counter is at ' + counter1\n\nconsole.log('Effect\
  \ called')\n\n}, [counter1])\n```\n\n现在对应的输出是：\n\n![](img/image6.jpg)\n\n**图 3.5**\n\
  \n你看，现在我们只看到一次 **Effect called**，因为 effect 在首次渲染后初始执行一次。除此之外，只要 counter1 没有被修改，effect\
  \ 函数就不会运行。\n\n#### useEffect 清理\n\n`useEffect` hook 为你提供了一个选项，可以在组件卸载或重新渲染（并再次调用\
  \ `useEffect`）之前，清理你想要移除的任何订阅。也就是说，在前面的例子中，你可以使用 `useEffect` 的清理函数，在组件新状态渲染时调用一个函数。让我们看一个例子来更好地理解：\n\
  \n```\nconst App: React.FC = props => {\n\nconst [counter, setCounter] = useState(0)\n\
  \nuseEffect(() => {\n\ndocument.title = 'Counter is at ' + counter\n\nreturn function\
  \ cleanup() {\n\nconsole.log('This will fire whenever this function gets called\
  \ next/the component unmounts. Counter is ${counter} right now')\n\n}\n\n}, [counter])\n\
  \nreturn <>\n\n<span>{ counter }</span>\n\n<button onClick={() =>setCounter(c =>\
  \ c + 1)}>Increment Counter</button>\n\n</>\n\n}\n```\n\n初始运行这段代码时，控制台不会显示任何内容，如下所示：\n\
  \n![](img/image12.jpg)\n\n**图 3.6**\n\n但一旦我点击 **Increment** 计数器，控制台就会出现一些有趣的内容：\n\
  \n![](img/image5.jpg)\n\n**图 3.7**\n\n好的！我们看到屏幕上计数器实际是 1。但在控制台中，我们收到的日志显示计数器值为 0。我们遗漏了什么吗？这是\
  \ bug 吗？实际上不是，这是预期的行为。\n\n你可以看到，`cleanup` 函数的目的是在*新实例*创建之前移除你想要清除的任何内容。因此，React\
  \ 需要调用旧 `useEffect` 函数的 `cleanup` 函数，以便它能够访问旧的订阅变量及其环境。React 显然不应该触发最新 `useEffect`\
  \ 函数的 `cleanup` 函数，因为它还不需要清理，对吧？\n\n#### useCallback\n\n还记得我们如何在 `useEffect` hook\
  \ 中传入依赖项数组，让 React 知道我们关心的变量吗？这可以让 React 在不需要时避免反复运行 effect 函数。但是，你在 `useEffect`\
  \ 函数内部调用的函数呢？很容易遗漏像这样的情况：\n\n```\nconst [result, setResult] = useState(null)\n\n\
  const [url, setUrl] = useState(null)\n\nasync function someAsyncOperation() {\n\n\
  // 更多代码\n\nreturn await fetch(url)\n\n}\n\nuseEffect(() => {\n\n// 一些长代码…\n\nsomeAsyncOperation().then(r\
  \ => {\n\nsetResult(r)\n\n})\n\n}, [])\n```\n\n哎呀！你能指出这段代码中可能出现的问题吗？你看，虽然从 effect\
  \ 函数来看似乎不需要依赖项（因为我们没有直接使用任何状态变量），但仔细一看，我们实际上在 `someAsyncOperation` 函数内部使用了状态变量 `url`！这意味着，如果某处调用了\
  \ `setResult`，effect 函数不会重新运行，因此不会重新获取 URL，从而产生有 bug 的输出。\n\n\n\n\n\n这种情况可能发生，并且随着代码库的增长通常很难注意到。那么如何确保你不会忘记在\
  \ `useEffect` 钩子中添加依赖项呢？你不需要这样做。你应该将函数作为依赖项传递，因为这样更合理！你看，实际函数 `someAsyncOperation`\
  \ 的行为会因状态变量 `url` 的变化而改变，因此它才应该被添加为依赖项。这不仅简化了事情，而且更符合逻辑。\n\n然而，React 无法在不实际执行函数并查看结果的情况下将函数与之前的版本进行比较，但一旦你执行了函数，就没有必要再回头了。还记得我们在\
  \ `useEffect` 中是如何解决类似问题的吗？是的，依赖数组来救场！但是，如何为独立函数指定依赖数组呢？\n\n这里，你可以使用一个名为 `useCallback`\
  \ 的新钩子。这个钩子允许你创建记忆化函数，只有当传递给它的依赖数组发生变化时，函数的标识才会改变。以下是上面相同的示例，但这次使用了记忆化函数：\n\n```\n\
  const someAsyncOperation = useCallback(async () => {\n  // 更多代码\n  return await\
  \ fetch(url)\n}, [url])\n```\n\n```\nuseEffect(() => {\n  // 一些长代码....\n  someAsyncOperation().then(r\
  \ => {\n    setResult(r)\n  })\n}, [someAsyncOperation])\n```\n\n这里，我们可以看到我们现在将\
  \ `someAsyncOperation` 作为主要副作用函数的依赖项传递，并将 `url` 作为 `someAsyncOperation` 函数本身的依赖项传递。这保持了秩序，并允许你编写可读且干净的代码。\n\
  \nReact 还有更多内置钩子，我们将在接下来的章节中逐步了解。\n\n#### 自定义钩子\n\n既然我们已经对 React 钩子及其底层工作原理有了实用的了解，那么为自己的用例创建简单的自定义钩子就相当简单了。让我们从一个简单的例子开始。还记得我们说过\
  \ `useState` 在状态更新时不提供回调函数吗？让我们将其实现为一个自定义钩子。\n\n```\nimport { useState, useEffect\
  \ } from 'react'\n\nconst useStateCB = (initState: any, cb: Function) => {\n  const\
  \ [state, setState] = useState(initState)\n  useEffect(() => cb(state), [state])\n\
  \  return [state, setState]\n}\n\nexport default useStateCB\n```\n\n我们可以创建一个名为 `useStateCB.ts`\
  \ 的文件，内容如上，然后导入这个*钩子*并在任何地方使用它！那么它是如何工作的呢？\n\n当你调用 `useStateCB(\"test\", updatedState\
  \ => console.log(updatedState))` 时，你实际上是在设置两个钩子——原始的 `useState` 钩子和 `useEffect`\
  \ 钩子。`useEffect` 钩子用于*监视*我们的 `useState` 钩子，一旦*状态*发生变化，我们就用新状态调用传入的回调函数。还记得吗？`useEffect`\
  \ 钩子每次渲染时总是使用最新的状态值运行。通过这种方式，你可以使用一些基本的钩子来定制满足自己需求的自定义钩子。\n\n### 类组件\n\n以下是一个用 TypeScript\
  \ + React 编写的基于类的组件的简单示例：\n\n```\nimport React from 'react'\nimport ReactDOM from\
  \ 'react-dom'\n\nclass App extends React.Component<{}, {}> {\n  render() {\n   \
  \ return <p>Hello World</p>\n  }\n}\n\nReactDOM.render(<App />, document.getElementById('root'))\n\
  ```\n\n这里，我们创建了一个名为 `App` 的组件，它继承了 `React.Component` 类。查看后你会发现，`React.Component`\
  \ 类提供了许多有用的功能，使我们能够在基于类的组件中使用生命周期方法和状态。我们可以在这里指定 props 和 state 的类型 `<{}, {}>`。\n\
  \n#### Props\n\n我们在函数式组件中讨论过 props，以及它们如何作为组件可以传递给其子组件的一小部分数据，以及组件如何定义自身。以下是另一个接收\
  \ prop 的示例：\n\n```\nclass App extends React.Component<{ prop1: string }, {}> {\n\
  \  render() {\n    return <p>Hello World. Prop1 says {this.props.prop1}</p>\n  }\n\
  }\n\nReactDOM.render(<App prop1=\"something\" />, document.getElementById('root'))\n\
  ```\n\n我们使用 TypeScript 指定了可以接收的 props 的类型，然后在渲染组件时传递了 `prop1`。最后，我们使用 `this.props`\
  \ 对象访问了传递的 prop。`this.props` 对象由 React 填充，键是 props 的名称，值是传递给它们的值。\n\n就像在函数式方式中一样，你可以传递任何东西，甚至函数，作为\
  \ props，因为 JavaScript 拥有一等函数。\n\n此外，我们看到有一个名为 `render` 的方法，它负责 React 显示的 UI。无论你在基于类的组件中做什么，从\
  \ render 方法返回的内容是唯一会在屏幕上对用户可见的内容（除非你尝试直接自己修改 DOM——这在使用 React 时当然是一种不好的做法）。\n\n####\
  \ State\n\n在类组件中管理状态非常直接。开箱即用，React 允许你创建一个名为 `state` 的特殊变量。React 还提供了一个 `setState`\
  \ 函数，允许 React 修改状态对象（并随后重新渲染）。如果你想知道这个实现来自哪里，可以看到我们继承了 `React.Component` 类，该类包含了上述功能。\n\
  \n以下是一个简单的示例，演示了基于类的组件中的状态：\n\n```\nclass App extends React.Component<{}, { name:\
  \ string }> {\n  state = {\n    name: 'Mehul'\n  }\n  render() {\n    return <p>{this.state.name}</p>\n\
  \  }\n}\n```\n\n这里我们再次看到，我们可以用 TypeScript 指定状态的类型，然后继续用默认值初始化状态。那么区别在哪里呢？区别在于我们开始使用\
  \ `this.setState` 函数时。调用该函数后，React 会更新我们的状态对象，并自动重新渲染，必要时将更新应用到组件。例如：\n\n```\nclass\
  \ App extends React.Component<{}, { num: number }> {\n  state = {\n    num: Math.random()\n\
  \  }\n  changeNum() {\n    this.setState({\n      num: Math.random()\n    })\n \
  \ }\n  render() {\n    return <p onClick={() => this.changeNum()}>{this.state.num}</p>\n\
  \  }\n}\n```\n\n点击 `p` 标签时，我们会看到状态变量改变了 `num` 属性，并将其设置为一个新的 `Math.random` 值。看看它与函数式组件有何不同。在函数式组件中，状态永远不会被修改，而是在新的渲染中，钩子返回不同（且更新后）的值。然而，在基于类的组件中，React\
  \ 本身会修改 `this` 关键字，以根据正确的行为更新 props 和 state。这表明，尽管函数式组件和基于类的组件可能看起来只是彼此的语法糖，但它们在核心工作方式上有着根本的不同。\n\
  \n### 生命周期方法\n\nReact 提供了一系列生命周期方法，让你可以将代码放入其中，并完全控制组件的渲染机制。让我们从这些方法开始，并在每个组件中看一个简单的示例。此外，我们可以探讨它们与钩子的区别，以及钩子可能的行为替代方案。\n\
  \n#### constructor\n\n如果你有面向对象编程的背景，你会知道 `constructor` 是创建对象时运行的第一个方法。尽管 JavaScript\
  \ 不遵循基于类的继承，但它在 ES6 中引入的类的语法糖与这种模式非常相似。\n\n\n\n\n这不是 React 提供的生命周期方法，而是语言本身。不过，你可以在这里完成所有初始化工作，即初始化状态、设置全局事件监听器（如窗口大小变化等），并为组件的挂载做好准备。\n\
  \n#### static getDerivedStateFromProps\n\n该方法在 v16.3 中新增，允许你在需要时根据 props 更新 state。`getDerivedStateFromProps`\
  \ 方法在首次挂载和后续挂载的 render 方法之前运行。它是静态方法，你不应在此方法中执行副作用（如动画或网络请求）。\n\n实际上，React 文档建议在大多数情况下你不需要实现这个生命周期方法。大部分工作可以通过我们接下来要讨论的其他方法完成：\n\
  \n```\nstatic getDerivedStateFromProps(props, state) {\n  if (props.email !== state.email)\
  \ {\n    return {\n      email: props.email\n    }\n  }\n  return null\n}\n```\n\
  \n可以看到，如果没有更新，我们返回 `null`，表示我们不打算更新组件的 state。你返回的任何内容都将作为组件的 state 进行更新。\n\n####\
  \ render\n\n这是基于类的 React 组件中唯一必须存在的方法。这是因为 React 是一个 UI 库，使用组件的目的是向用户输出一些视觉信息。因此，如果你使用\
  \ React 组件，必须定义 `render` 方法。从此方法返回的任何内容都会显示在屏幕上。以下是一个简单示例：\n\n```\nrender() {\n\
  \  return <p>Hello world!</p>\n}\n```\n\n#### getSnapshotBeforeUpdate\n\nReact 在实际将内容写入浏览器（即\
  \ DOM）之前会调用此方法。此时，render 已被调用，但 DOM 尚未更新。同样，如文档所述，此方法仅用于特定场景，但了解可用的方法总是好的。你需要从此方法返回一个“快照”值，然后在另一个名为\
  \ `componentDidUpdate` 的生命周期方法中访问它。示例如下：\n\n```\ngetSnapshotBeforeUpdate(prevProps,\
  \ prevState) {\n  if (prevProps.prop1 !== this.props.prop1) {\n    return \"Prop\
  \ mismatch\";\n  }\n  return null\n}\n```\n\n返回 `null` 表示没有需要捕获的快照。然后我们可以在 `componentDidUpdate`\
  \ 中访问它，如下所示。\n\n#### componentDidMount\n\n当 React 完成组件的挂载后，会调用 `componentDidMount`\
  \ 方法。但别急！此时组件对用户仍然不可见，因为它尚未写入 DOM。那么“挂载”是什么意思呢？它意味着组件已挂载到 React 的虚拟 DOM 中，并准备推送到真实\
  \ DOM。此时，如果你调用 `setState`，React 会重新渲染组件，但不会显示组件的中间状态。\n\n#### componentDidUpdate\n\
  \n当你的组件更新时，React 会调用此方法。在初始挂载时，此方法不会被调用。它接收三个参数——`prevProps`、`prevState` 和 `snapshot`，分别代表之前的\
  \ props、之前的组件 state 以及来自 `getSnapshotBeforeUpdate` 方法的快照（如上所述）。以下是一个简单示例：\n\n```\n\
  componentDidUpdate(prevProps, prevState, snapshot) {\n  if (this.props.id !== prevProps.id)\
  \ {\n    // 发起新的网络请求并更新 state\n  }\n}\n```\n\n#### componentWillUnmount\n\n顾名思义，此方法在组件被卸载时触发。这是清理全局事件监听器、取消网络请求和定时器等的最佳位置。这是\
  \ React 在组件生命周期中最后调用的方法。\n\n以下是我找到的一张关于 React 生命周期方法的精美开源插图：\n\n![](img/image3.jpg)\n\
  \n**图 3.8**\n\n## 结论\n\n本章非常重要，因为它向我们介绍了组件——函数式组件和基于类的组件。此外，我们学习了钩子（hooks）、它们的工作原理以及如何创建自定义钩子。进一步地，我们了解了如何使用基于类的组件，以及为什么\
  \ React 将函数式组件视为该库的未来。我们将在后续章节中继续深入探讨更多 React 主题。\n\n## 问题\n\n1.  类组件和函数式组件有什么区别？\n\
  \n2.  将以下代码转译为有效的 JS：`<p><span>Hello</span> World</p>`\n\n3.  `useState` 是同步的吗？为什么是/为什么不是？\n\
  \n4.  `useEffect` 钩子的依赖数组有什么作用？\n\n5.  `useEffect` 钩子在组件渲染/更新之前还是之后运行？\n\n6.  为什么钩子没有“生命周期方法”的概念？它与基于类的生命周期模型在根本上有什么不同？\n\
  \n# 第四章\n\n## React 中的应用状态管理\n\n在上一章中，我们扎实地了解了组件以及创建和使用它们的方法。我们注意到，大多数组件在拥有某种与之关联的状态（即组件“记住”的内容）时才真正有用。尽管如此，React\
  \ 通过 `useState` 钩子和 `this.state` 对象分别为函数式组件和基于类的组件提供了出色的支持。但随着代码的增长，有必要以更有组织的方式管理状态，避免\
  \ prop 逐层传递，并使事情更清晰，尤其是在不同嵌套级别的组件之间需要进行信息交换时。\n\n这可以称为管理应用程序的状态。让我们看看如何处理它。\n\n\
  ### 结构\n\n*   组件之间的通信\n*   使用 Context API\n    *   `createContext`\n    *   `useContext`\n\
  *   `useReducer` 钩子\n*   Redux 作为替代方案\n\n### 目标\n\n在本章中，我们旨在介绍 React 提供的用于管理应用程序状态的基本内置功能。在大多数情况下，这些功能足以满足项目需求，甚至更多。对于非常高级的情况，我们将使用基于\
  \ reducer 的模式，如 Redux。自 React 16.8 的钩子以来，React 提供了一个与 Redux 类似（但功能较弱）的内置解决方案。让我们在本章中全面了解它。\n\
  \n### 组件之间的通信\n\n仔细想想，管理应用程序状态大致上就是让大量组件之间有效传递某些信息的另一种说法。\n\n尽管你可以在组件中拥有局部状态，但当你想在组件之间进行通信时，事情就变得棘手了，尤其是当通信需要向上传递到组件层次结构，或者树中相隔很远时。这种情况经常发生。假设你通过内容区域中的链接退出网站，此信息应传递到头部（一个完全不同的组件），以便头部能够将链接更新回未认证用户应看到的链接。\n\
  \n让我们看看本章将学习的一些常见通信方式：\n\n*   Props（父组件向子组件传递数据）\n*   Refs（从父组件调用子组件方法）\n*   Context\
  \ API\n*   Redux（集中式状态）（后续章节）\n\n有趣的是，通过一点技巧，可以使用 Context API 实现双向通信，但 Redux 是真正解耦且集中的状态存储。Redux\
  \ 是中高级应用的首选，因为它具有单向数据流（注意！这并不意味着它只能单向通信）、集中式状态共享和出色的调试工具。我们先来看看 props。\n\n### Prop\
  \ 逐层传递\n\n\n\n\n假设你的 React 应用中有一个 UI 主题，其中包含颜色和字体大小等值。当然，这些值需要被相应的输入字段和文本区域访问。然而，在元素层级中首先找到这些输入字段是一项繁琐的任务。你需要将\
  \ `fontSize` 属性一路向下传递到输入字段，即使中间的所有组件都不需要知道它。让我们看看这是什么。\n\n这是在组件之间共享数据最朴素的技术。你使用\
  \ props 将数据向下传递给子组件。考虑这个非常简单的例子：\n\n```\nimport React from ‘react’\nimport ReactDOM\
  \ from ‘react-dom’\nconst App: React.FC<{ name: string, age: number }> = props =>\
  \ {\nreturn <div>\n<p>We’ve got all of your information!</p>\n<Profile name={props.name}\
  \ age={props.age} />\n</div>\n}\nconst Profile: React.FC<{ name: string, age: number\
  \ }> = props => {\nreturn <div>\n<p>Here’s a complete information about you</p>\n\
  <p>We save everything in our databases</p>\n<NameFormatter name={props.name} />\n\
  <AgeFormatter age={props.age} />\n</div>\n}\nconstNameFormatter: React.FC<{ name:\
  \ string }> = props => {\nreturn <p>Like you can see, here’s your name: <TextField\
  \ value={props.name} type=”text” /></p>\n}\nconstAgeFormatter: React.FC<{ age: number\
  \ }> = props => {\nreturn <p>Your age is: <TextField value={props.age} type=”number”\
  \ /></p>\n}\nconstTextField: React.FC<{ value: any, type: string }> = props => {\n\
  return <input type={props.type} value={props.value} />\n}\nReactDOM.render(<App\
  \ name=”Mehul” age={20} />, document.getElementById(‘root’))\n```\n\n如果你观察这里，你会意识到组件\
  \ `App` 和 `Profile` 从来不需要知道 props `name` 和 `age`。只有 `NameFormatter` 和 `AgeFormatter`\
  \ 需要各自的值来正确渲染 UI。然而，由于 props `name` 和 `age` 在 `App` 组件层级可用，为了到达 `NameFormatter`\
  \ 和 `AgeFormatter` 组件层级，你需要将它们“钻取”下去。\n\n这种做法被称为 prop drilling，通常在我们现在拥有的更高级、更复杂的组件间通信方法（用于不同层级）中是不需要的。让我们看看有哪些不同的方法可以帮助我们避免这种情况。\n\
  \n### Refs\n\nReact 中的 Ref 指的是创建对某物的引用。`ref` 是 React 的一个逃生舱口，允许你直接窥视组件或 DOM，随你喜欢。因此，它应该谨慎使用。因为你用\
  \ refs 做的事情通常遵循命令式模式，这有点打破了 React 希望你以声明式方式工作的方式。但有时，稍微偏离常规是非常有用的，因为 React 本身能提供的功能是有限的。\n\
  \n使用 refs，我们不仅可以与 DOM 直接通信，还可以让父组件调用子组件的方法。我们知道使用 props 可以轻松地反向实现，但无法通过 props 实现父组件需要调用的子组件方法。让我们看看这个例子：\n\
  \n这是 `Parent.tsx` 文件：\n\n```\n// Parent.tsx\nimport React, { useRef } from ‘react’\n\
  import ReactDOM from ‘react-dom’\nimport ChildInput, { ChildInputHandles } from\
  \ ‘./Child’\nconst Parent: React.FC = () => {\nconst ref = useRef<ChildInputHandles>(null)\n\
  function setChildFocus() {\nif (ref.current) {\nref.current.setFocus()\n}\n}\nreturn\
  \ <div>\n<ChildInput ref={ref} defaultValue=”Hello World” />\n<button onClick={setChildFocus}>Set\
  \ focus to input</button>\n</div>\n}\nReactDOM.render(<Parent />, document.getElementById(‘root’))\n\
  ```\n\n以及 `Child.tsx` 文件：\n\n```\n// Child.tsx\nimport React, { RefForwardingComponent,\
  \ forwardRef, useImperativeHandle, useRef } from ‘react’\nexport interface ChildInputHandles\
  \ {\nsetFocus(): void\n}\nexport interface ChildInputProps {\ndefaultValue: string\n\
  }\nconstChildInput: RefForwardingComponent<ChildInputHandles, ChildInputProps> =\
  \ (props, ref) => {\nconstinputRef = useRef<HTMLInputElement>(null)\nuseImperativeHandle(ref,\
  \ () => ({\nsetFocus() {\nif (inputRef.current) {\ninputRef.current.focus()\n}\n\
  }\n}))\nreturn <input {…props} defaultValue={props.defaultValue} ref={inputRef}\
  \ />\n}\nexport default forwardRef(ChildInput)\n```\n\n让我们看看这里发生了什么：\n\n1. 在 `Parent.tsx`\
  \ 文件中，我们首先导入 `ChildRef` 组件，并使用 `useRef` 钩子为其提供一个 `ref`。我们使用 `<ChildInputHandles>`\
  \ 来类型化我们可以通过 `ourref.current` 变量访问的方法和 props。\n2. 在 Parent 中有一个 `setChildFocus`\
  \ 方法，它实际上使用 refs 穿透到子组件并调用指定的函数，即子组件内部的 `setFocus`。\n3. 在 `ChildInput` 组件中，我们将其类型化为\
  \ `RefForwardingComponent`，作为 TypeScript 类型来类型化接收的 props 以及通过 `ref` 转发可用的 props。\n\
  4. 我们使用另一个名为 `useImperativeHandle` 的钩子，它接受我们传递的 ref（参见 `ChildInput` 组件的第二个参数），并绑定某些方法，我们可以在父组件中直接在该\
  \ `ref` 上调用这些方法。\n5. 最后，我们在 Child 内部使用一个常规的 `inputRef` ref，以便在 Child 组件内部的 `setFocus`\
  \ 定义中实际启用焦点。\n\n通过这种方式，我们可以使用 refs 作为逃生舱口，从父组件访问子组件内部的函数和值。然而，在大多数场景中，通常不推荐使用此类方法，并且这确实让人思考，开发者试图实现的目标是否有更好的方式。\n\
  \n现在让我们继续讨论 Context API，看看如何使用它在数据传递中创建“虫洞”。\n\n### Context API\n\n在 prop drilling\
  \ 的例子中，我们看到了 UI 主题如何需要将其 props 一路向下钻取到实际需要它的组件，从而暴露给所有其他甚至不需要知道这些值的组件。认识一下 React\
  \ 中的 Context。Context 允许你在组件中创建数据的虫洞，也就是说，你可以将数据从一个组件传送到树中另一个组件，而中间组件无需知道所传输的数据。\n\
  \n让我们先看代码，并通过这个小型应用程序了解 Context API 通常是如何工作的：\n\n这是我们的 `index.tsx` 文件：\n\n```\n\
  import React from ‘react’\nimport ReactDOM from ‘react-dom’\nimport Component1 from\
  \ ‘./Component1’\nReactDOM.render(<Component1 />, document.getElementById(‘root’))\n\
  ```\n\n这是我们的 `Component1.tsx` 文件：\n\n```\nimport React from ‘react’\nimport Header\
  \ from ‘./Header’\nimport Content from ‘./Content’\nimport Footer from ‘./Footer’\n\
  import ‘./global.css’\nconstComponent1: React.FC = () => {\nreturn (\n<div>\n<Header\
  \ />\n<Content />\n<Footer />\n</div>\n)\n}\nexport default Component1\n```\n\n\
  这是我们的 `Header.tsx` 文件：\n\n```\nimport React from ‘react’\nconst Header: React.FC\
  \ = () => {\nreturn (\n<header>\n<h1>Welcome to my site!</h1>\n<p>Hello mehul</p>\n\
  </header>\n)\n}\nexport default Header\n```\n\n这是我们的 `Content.tsx` 文件：\n\n```\n\
  import React from ‘react’\nimport Sidebar from ‘./Sidebar’\nimport RightArticle\
  \ from ‘./RightArticle’\nconst Content: React.FC = () => {\nreturn (\n<section>\n\
  <Sidebar />\n<RightArticle />\n</section>\n)\n}\nexport default Content\n```\n\n\
  这是我们的 `Sidebar.tsx` 文件：\n\n```\nimport React from ‘react’\nconst Sidebar: React.FC\
  \ = () => {\nreturn (\n<aside>\n<h2>Wow this is a nice sidebar</h2>\n<p>See my logo</p>\n\
  <imgsrc=”https://codedamn.com/assets/images/red-logo.png” />\n</aside>\n)\n}\nexport\
  \ default Sidebar\n```\n\n这是我们的 `RightArticle.tsx` 文件：\n\n```\nimport React from\
  \ ‘react’\n```\n\n\n\n\n\n`constRightArticle: React.FC = () => {`\n`return (`\n\
  `<article>`\n`<h2>This is my site!</h2>`\n`<p>It is very nice</p>`\n`<p>The mode\
  \ right now is: light</p>`\n`<button>Click here to turn on dark mode</button>`\n\
  `</article>`\n`)`\n`}`\n`export default RightArticle`\n\n这是我们的 `Footer.tsx` 文件：\n\
  \n`import React from ‘react’`\n`const Footer: React.FC = () => {`\n`return (`\n\
  `<footer>`\n`<p>Copyright &copy; Me.</p>`\n`<imgsrc=”https://codedamn.com/assets/images/red-logo.png”\
  \ />`\n`</footer>`\n`)`\n`}`\n`export default Footer`\n\n最后，为了添加一些 CSS，这是我们的样式表\
  \ `global.css`：\n\n`* {`\n`margin: 0;`\n`padding: 0;`\n`font-family: Arial;`\n`}`\n\
  `header {`\n`text-align: center;`\n`padding: 10px;`\n`border-bottom: 1px solid #eee;`\n\
  `}`\n`section {`\n`min-height: 80vh;`\n`display: flex;`\n`width: 960px;`\n`margin:\
  \ 10px auto;`\n`justify-content: space-between;`\n`}`\n`article {`\n`flex-grow:\
  \ 1;`\n`margin-left: 10px;`\n`background: rgb(226, 226, 226);`\n`}`\n`aside {`\n\
  `max-width: 250px;`\n`background: rgb(226, 226, 226);`\n`}`\n`img {`\n`height: 80px;`\n\
  `}`\n`footer {`\n`display: flex;`\n`flex-direction: row-reverse;`\n`justify-content:\
  \ center;`\n`align-items: center;`\n`}`\n`footer img {`\n`height: 50px;`\n`margin-right:\
  \ 20px;`\n`}`\n\n这大致会在你的屏幕上渲染出类似这样的效果：\n\n![](img/image22.jpg)\n\n**图 4.1**\n\n\
  为了让你更清楚，文件结构如下所示：\n\n![](img/image31.jpg)\n\n**图 4.2**\n\n请注意，我们使用的是 `create-react-app`。\n\
  \n好的，现在你可以看到我们有一个按钮，上面写着**点击此处开启暗色模式**。点击后，我们会向 body 添加 **dark** 类，CSS 会处理后续样式。但其他变化呢？比如，如果我们处于暗色模式，我们希望将\
  \ logo 从红色改为白色，向 Header 组件传递已登录（假设）用户的用户名，并确保 article 组件知道全局暗色模式状态。\n\n让我们使用 Context\
  \ API 来填补这些空白。我们将创建一个上下文，用于不同的组件。\n\n### Context.Provider\n\n基于之前的工作，让我们看看我们的 `Component1.tsx`\
  \ 文件：\n\n```\nimport React, { createContext, useState } from ‘react’\nimport Header\
  \ from ‘./Header’\nimport Content from ‘./Content’\nimport Footer from ‘./Footer’\n\
  import ‘./global.css’\n\ntype Context = {\n  theme: string\n  name: string\n  logo:\
  \ string\n}\n\nconstStateContext = createContext<Partial<Context>>({})\nexport {\
  \ StateContext }\n\nconstComponent1: React.FC = () => {\n  const [theme, setTheme]\
  \ = useState<string>(‘light’)\n  const defaults = {\n    get theme() {\n      return\
  \ theme\n    },\n    set theme(value) {\n      document.body.classList.remove(‘dark’,\
  \ ‘light’)\n      document.body.classList.add(value)\n      setTheme(value)\n  \
  \  },\n    name: ‘Mehul’,\n    get logo() {\n      return this.theme === ‘dark’\
  \ ? ‘white-logo’ : ‘red-logo’\n    }\n  }\n\n  return (\n    <StateContext.Provider\
  \ value={defaults}>\n      <Header />\n      <Content />\n      <Footer />\n   \
  \ </StateContext.Provider>\n  )\n}\n\nexport default Component1\n```\n\n你看，我们在组件定义之外添加了另一个名为\
  \ context 的变量，其值为 `createContext({})`。\n\n这会创建一个消费者和提供者，你可以在整个应用中使用它们来访问数据。让我们看看如何操作。\n\
  \n我们使用 TypeScript 为这个上下文提供一个类型，指示我们将在此上下文中使用的值。这也会作为该上下文的默认值；我们不在 `Provider` 中指定它。\n\
  \n当我们调用 `createContext` 时，它会创建两个 React 元素：`Context.Provider` 和 `Context.Consumer`。每当你将元素包裹在\
  \ `Context.Provider` 内部时，你可以在子元素中访问该特定上下文。如上所示，我们基本上将应用包裹在了 `<StateContext.Provider>`\
  \ 中。\n\n然而，借助 `useContext` 钩子，我们可以轻松访问上下文的消费者部分。请参见下面的 `useContext` 用法。\n\n### useContext\
  \ 钩子\n\n我们更新后的 `Header.tsx` 文件：\n\n```\nimport React, { useContext } from ‘react’\n\
  import { StateContext } from ‘./Component1’\n\nconst Header: React.FC = () => {\n\
  \  const state = useContext(StateContext)\n\n  return (\n    <header>\n      <h1>Welcome\
  \ to my site!</h1>\n      <p>Hello {state.name}</p>\n    </header>\n  )\n}\n\nexport\
  \ default Header\n```\n\n看看访问 name 是多么方便！一旦我们添加动态功能，事情就变得更有趣了。让我们先修改 CSS 文件以支持暗色模式：\n\
  \n```\n/* 现有 CSS 代码 */\n/* 暗色模式 */\n.dark {\n  background: black;\n  color: rgb(194,\
  \ 194, 194);\n}\n.dark header {\n  border-bottom: 1px solid rgb(56, 56, 56);\n}\n\
  .dark aside, .dark article {\n  background: rgb(53, 53, 53);\n}\n```\n\n现在，让我们让\
  \ `RightArticle.tsx` 上的按钮生效：\n\n```\nimport React, { useContext } from ‘react’\n\
  import { StateContext } from ‘./Component1’\n\nconstRightArticle: React.FC = ()\
  \ => {\n  const state = useContext(StateContext)\n\n  function toggleTheme() {\n\
  \    if(state.theme === ‘dark’) {\n      state.theme = ‘light’\n    } else {\n \
  \     state.theme = ‘dark’\n    }\n  }\n\n  return (\n    <article>\n      <h2>This\
  \ is my site!</h2>\n      <p>It is very nice</p>\n      <p>The mode right now is:\
  \ {state.theme}</p>\n      <button onClick={toggleTheme}>Click here to turn on dark\
  \ mode</button>\n    </article>\n  )\n}\n\nexport default RightArticle\n```\n\n\
  最后，我们也可以实现图片部分：\n\n`Sidebar.tsx`\n\n```\nimport React, { useContext } from ‘react’\n\
  import { StateContext } from ‘./Component1’\n\nconst Sidebar: React.FC = () => {\n\
  \  const { logo } = useContext(StateContext)\n\n  return (\n    <aside>\n      <h2>Wow\
  \ this is a nice sidebar</h2>\n      <p>See my logo</p>\n      <imgsrc={‘https://codedamn.com/assets/images/${logo}.png’}\
  \ />\n    </aside>\n  )\n}\n\nexport default Sidebar\n```\n\n以及 `Footer.tsx`：\n\n\
  ```\nimport React, { useContext } from ‘react’\nimport { StateContext } from ‘./Component1’\n\
  \nconst Footer: React.FC = () => {\n  const { logo } = useContext(StateContext)\n\
  \n  return (\n    <footer>\n      <p>Copyright &copy; Me.</p>\n      <imgsrc={‘https://codedamn.com/assets/images/${logo}.png’}\
  \ />\n    </footer>\n  )\n}\n\nexport default Footer\n```\n\n就是这样！你可以看到父组件向子组件传递值是多么容易，子组件修改值后父组件也能相应调整。这就是网站在亮色和暗色模式下的样子：\n\
  \n亮色模式\n\n![](img/image13.jpg)\n\n**图 4.3：** 亮色模式\n\n![](img/image41.jpg)\n\n**图\
  \ 4.4：** 暗色模式\n\n### useReducer 钩子\n\n现在我们已经了解了 `useContext` 的工作原理，我们可以通过使用 React\
  \ 提供的另一个内置钩子 `useReducer` 来进一步简化应用的状态管理。\n\n让我们从将上述示例中的 `createContext` 解耦到一个单独的文件开始：\n\
  \n这是我们的 `state.ts` 文件：\n\n```\nimport { createContext } from ‘react’\n\ntype Context\
  \ = {\n  theme: string\n  name: string\n  logo: string\n}\n\nconstinitialState =\
  \ {\n  theme: ‘light’,\n  name: ‘Mehul’,\n  logo: ‘red-logo’\n}\n\nfunction stateFunc(state:\
  \ Context, action: { type: string, payload: any }) {\n  const { type, payload }\
  \ = action\n  switch(type) {\n    case ‘SET_THEME’:\n      document.body.classList.remove(‘dark’,\
  \ ‘light’)\n      document.body.classList.add(payload)\n      return {\n       \
  \ …state,\n        theme: payload,\n        logo: payload === ‘dark’ ? ‘white-logo’\
  \ : ‘red-logo’\n      }\n  }\n  return initialState\n}\n\nconstStateContext = createContext<{\
  \ state: Context, dispatch: Function}>({\n  state: initialState,\n  dispatch: ()\
  \ => 0\n})\n\nexport const Provider = StateContext.Provider\nexport const reducer\
  \ = stateFunc\nexport const context = StateContext\nexport constdefaultState = initialState\n\
  ```\n\n这个文件里有很多内容！让我们看看发生了什么：\n\n1.  首先，有一个名为 `stateFunc` 的普通函数，它接收 state 和 action\
  \ 作为输入。\n\n\n\n\n\n2. 动作对象由 `type`（字符串）和 `payload`（任意值）组成。（你可以通过为 `type` 和 `payload`\
  \ 指定更严格的类型来进一步缩小范围）。\n\n3. 现在，基于 `type`，我们有一些分支情况：如果 `type` 是 `SET_THEME`，我们就更新状态并返回它。这将成为我们更新后的状态。如何实现？这是通过\
  \ `useReducer` 钩子完成的，我们稍后会看到。\n\n4. 最后，我们还有原来的 `StateContext`，但这次，我们的上下文不再只保存状态，而是保存两个值：状态和一个\
  \ `dispatch` 函数。\n\n5. 状态是我们的原始状态对象，而 `dispatch` 是一个用于更新状态的方法。你看，这里我们不直接与状态交互，而是发送某些“动作”，这些动作反过来更新状态。\n\
  \n我们用垃圾函数初始化 `dispatch` 方法，但当我们使用上下文提供者时，最终会覆盖它，所以这没关系。\n\n现在，回到 `Component1.tsx`\
  \ 文件，它看起来像这样：\n\n```\nimport React, { useReducer } from 'react'\nimport Header from\
  \ './Header'\nimport Content from './Content'\nimport Footer from './Footer'\nimport\
  \ './global.css'\nimport { Provider, defaultState, reducer } from './state'\n\n\
  const Component1: React.FC = () => {\n  const [state, dispatch] = useReducer(reducer,\
  \ defaultState)\n  return (\n    <Provider value={{ state, dispatch }}>\n      <Header\
  \ />\n      <Content />\n      <Footer />\n    </Provider>\n  )\n}\n\nexport default\
  \ Component1\n```\n\n现在你可以看到我们正在使用一个名为 `useReducer` 的新钩子。这个钩子的作用是返回一个包含两个元素的数组，就像\
  \ `useState` 钩子一样。第一个元素是 `state`，第二个元素是 `dispatch` 函数。\n\n`useState` 和 `useReducer`\
  \ 之间的一个主要区别是：使用 `useState` 时，第二个函数是状态的设置器，也就是说，在 `useState` 中，无论你传入什么参数，它都会被设置为状态；而在\
  \ `useReducer` 中，每当你调用 `dispatch` 方法时，`useReducer` 会调用你的 reducer，然后 reducer 方法返回的任何内容都会被设置为状态。考虑以下代码：\n\
  \n```\nconst [state, setState] = useState(0)\nsetState(1) // ← 将状态变量设置为 1\n\nconst\
  \ [state, dispatch] = useReducer(reducer, 1)\ndispatch({ type: 'do something', value:\
  \ 100 }) // 现在 reducer 被调用\n// 幕后：reducer(state, { type: 'do something', value:\
  \ 100 }) -> 返回 101\n// 状态变为 101\n```\n\n这对于大型数据管理很重要，因为现在你可以更精细地控制数据流。\n\n现在让我们更新其他文件，使其与\
  \ `useReducer` 钩子配合工作：\n\n**Footer.tsx**：\n\n```\nimport React, { useContext } from\
  \ 'react'\nimport { context } from './state'\n\nconst Footer: React.FC = () => {\n\
  \  const { state: { logo } } = useContext(context)\n  return (\n    <footer>\n \
  \     <p>Copyright &copy; Me.</p>\n      <img src={'https://codedamn.com/assets/images/${logo}.png'}\
  \ />\n    </footer>\n  )\n}\n\nexport default Footer\n```\n\n**Header.tsx**：\n\n\
  ```\nimport React, { useContext } from 'react'\nimport { context } from './state'\n\
  \nconst Header: React.FC = () => {\n  const { state: { name } } = useContext(context)\n\
  \  return (\n    <header>\n      <h1>欢迎来到我的网站！</h1>\n      <p>你好 {name}</p>\n  \
  \  </header>\n  )\n}\n\nexport default Header\n```\n\n**RightArticle.tsx**：\n\n\
  ```\nimport React, { useContext } from 'react'\nimport { context } from './state'\n\
  \nconst RightArticle: React.FC = () => {\n  const { state: { theme }, dispatch }\
  \ = useContext(context)\n\n  function toggleTheme() {\n    if(theme === 'dark')\
  \ {\n      dispatch({ type: 'SET_THEME', payload: 'light' })\n    } else {\n   \
  \   dispatch({ type: 'SET_THEME', payload: 'dark' })\n    }\n  }\n\n  return (\n\
  \    <article>\n      <h2>这是我的网站！</h2>\n      <p>它非常棒</p>\n      <p>当前模式是：{theme}</p>\n\
  \      <button onClick={toggleTheme}>点击此处开启暗黑模式</button>\n    </article>\n  )\n\
  }\n\nexport default RightArticle\n```\n\n看到上面我们是如何使用 `dispatch` 函数的吗？它会调用我们的 reducer，而\
  \ reducer 会修改状态，然后状态会传播到使用它的组件中！\n\n还有 `Sidebar.tsx`：\n\n```\nimport React, { useContext\
  \ } from 'react'\nimport { context } from './state'\n\nconst Sidebar: React.FC =\
  \ () => {\n  const { state: { logo } } = useContext(context)\n  return (\n    <aside>\n\
  \      <h2>哇，这是一个很棒的侧边栏</h2>\n      <p>看看我的标志</p>\n      <img src={'https://codedamn.com/assets/images/${logo}.png'}\
  \ />\n    </aside>\n  )\n}\n\nexport default Sidebar\n```\n\n完成所有这些更改后，我们会发现屏幕上仍然显示相同的输出。但请考虑一下：现在在应用程序中实现更多有状态的功能变得非常容易。例如，假设你想通过点击按钮来更改登录用户名。\n\
  \n你只需在任何组件中获取 `dispatch` 方法，并分发一个带有类型（比如 `CHANGE_USERNAME`）和任意负载的动作。\n\n然后在另一个完全不同的文件\
  \ `state.tsx` 中，你可以在 reducer 中添加当动作是 `CHANGE_USERNAME` 时要执行的操作，如下所示：\n\n```\nswitch(type)\
  \ {\n  // ..\n  case 'CHANGE_USERNAME':\n    return {\n      ...state,\n      name:\
  \ payload\n    }\n  // ....\n}\n```\n\n这样就完成了！没有比这更精简的了！\n\n## 结论\n\n在本章中，我们学习了如何利用\
  \ React 内置的解决方案（如 Context API）来实现非常精简的状态管理，而无需任何外部库。在接下来的章节中，我们将探讨如何使用更复杂的技术与 React\
  \ 结合，以实现更多功能。\n\n## 问题\n\n1. 什么是 React 的 Context API？\n2. `useReducer` 钩子是如何工作的？\n\
  3. 什么是 `Context.Consumer`？`Context.Provider` 与 `Context.Consumer` 有何不同？\n\n# 第 5\
  \ 章\n\n## 服务端 React\n\n到目前为止，我们已经了解了 React 在前端的工作方式、使用 React 的各种方法、如何管理状态，甚至还创建了一个简单的工作首页！我们还可以用\
  \ React 做更多事情，尤其是将其迁移到服务端。现在，在服务端使用 React 可能听起来有些奇怪——至少在我第一次接触这个概念时是这样！在服务端使用 React\
  \ 到底意味着什么？它又能给我们带来什么好处？我们将在本章中解答所有这些问题，甚至更多。让我们开始吧。\n\n在本章中，我们将探讨如何将 React 迁移到服务端，本质上是在将\
  \ React 代码发送到浏览器之前，使用 Node.js 对其进行渲染，从而为用户和搜索引擎爬虫提供即时查看内容的无缝体验。\n\n### 结构\n\n* 服务端渲染\n\
  * 为什么需要它\n* 使用 SSR 的 Hello World\n* `ReactDOMServer` 如何工作\n* 向 SSR 添加更多组件\n* 路由\n\
  * 水合 `ReactDOM`\n* 获取数据\n\n### 目标\n\n本章旨在向你介绍使用 React 进行服务端渲染的概念，并讨论为什么如果你刚开始一个项目并且需要\
  \ SEO 和性能达到不可妥协的水平，这是一个不错的选择。我们将通过创建一个非常简单的项目来演示如何使用 React SSR 实现 Hello World，然后逐步添加更多功能。最后，我们将给出强有力的论据，说明为什么选择像\
  \ `Next.js` 这样的服务端渲染框架来构建基于 React 的中大型 SSR 应用是一个好主意。\n\n### 服务端上的 React\n\n目前，当你使用\
  \ React 应用程序时，会发生以下情况：\n\n1. 你访问页面（假设是 [`example.com`](http://example.com)）\n2.\
  \ 页面向远程服务器发出请求。\n3. 远程服务器只向你发送一个像这样的简单 HTML 响应：\n\n![](img/image42.jpg)\n\n**图 5.1**\n\
  \n\n\n\n\n4. 你的浏览器理解这个请求，如果仔细观察，你会发现请求中没有任何可读内容。它只是链接到一堆 CSS 和 JS 文件。\n\n5. 你的浏览器下载这些\
  \ JS 文件。\n\n6. 你的浏览器解析并运行这些 JS 文件（实际上是你编写的 React 代码）。\n\n7. 根据 React 代码，你的浏览器向服务器发出另一个\
  \ HTTP 请求，以获取 React 应用所需的数据。\n\n8. 最后，当数据可用时，首次有意义的内容渲染完成并呈现给用户。\n\n9. 此时 DOM 中填充了你期望看到的所有\
  \ HTML。以下是一个来自 codedamn.com 的使用 React 的示例：\n\n服务器实际返回的响应：\n\n![](img/image51.jpg)\n\
  \n**图 5.2**\n\n最终渲染的 DOM：\n\n![](img/image9.jpg)\n\n**图 5.3**\n\n这种方法当然没问题。但还有另一种方式。你选择\
  \ React 是因为其灵活性和健壮性，这些特性隐藏在底层。但如果你希望页面完全渲染，而不是让浏览器为每个请求来回奔波呢？\n\n这时，**服务端渲染**（**SSR**）就派上用场了。顾名思义，服务端渲染意味着你的服务器将\
  \ React 代码渲染成你上面看到的类似 DOM 的代码，这样浏览器就可以直接渲染，无需或只需极少的 JS 支持。在此之前，我们先回答一些关于 SSR 的常见问题。\n\
  \n### 什么是服务端渲染？\n\n顾名思义，你在服务器上渲染页面并将其交付给客户端，而不是让客户端（浏览器）使用你编写的 JavaScript 自行渲染页面。服务端渲染将客户端的一个步骤移回服务器，即解析\
  \ React 代码逻辑。本质上，SSR 意味着后端完成大部分工作并将页面交付给前端，而不是客户端大量使用 JS 进行路由和状态管理。这正是过去使用 PHP 的应用程序的工作方式。但随着\
  \ JS 标准的提升以及性能更好的设备和智能手机的出现，客户端渲染如今变得越来越流行。\n\n### 为什么需要服务端渲染？\n\n如果客户端渲染这么好，为什么在\
  \ 2020 年代我们还要考虑服务端渲染呢？SSR 有其不可忽视的优势，其中包括：\n\n1. SEO：搜索引擎喜欢读取 HTML 标记并从中理解页面内容。大多数搜索引擎（除了像\
  \ Google 这样的高级引擎）无法真正解释大量 JavaScript，因此必须严重依赖你的“源代码”内容。而对于客户端网站，源代码几乎不包含任何内容，因此搜索引擎无法索引你的网站，从而影响排名。\n\
  \n2. 性能：使用 SSR 时性能明显提升。由于 SSR 在交付前已经渲染了页面，你无需担心 JS 代码中不同浏览器支持、不同设备支持 API 等问题，因为大部分代码根本不会交付给客户端。\n\
  \n因此，为了与搜索引擎兼容，实现 SSR 至关重要，这样你就能两全其美。\n\n### 开始使用 SSR\n\n在没有框架的情况下，使用 React 进行 SSR\
  \ 比较棘手。但我们仍会从基础开始，以便了解在使用其他框架时底层发生了什么。在开始之前，我们将重点关注 React 中的一个特殊部分：ReactDOM。\n\n\
  ### ReactDOM\n\n当我们执行 `ReactDOM.render(<App />, element)` 时，实际上是在告诉 React 将 DOM\
  \ 树（你在 Web 应用中看到的 UI）与宿主树（JavaScript 中包含的 React 代码）进行匹配。\n\n我们之前讨论过 `App` 如何展开成一个嵌套对象（本质上是一棵树）。`ReactDOM`\
  \ 是该特定树的渲染器之一。你能想到其他例子吗？React Native 可以被视为另一个完整的渲染器。\n\n还有另一个渲染器叫做 `ReactDOMServer`。顾名思义，`ReactDOMServer`\
  \ 允许你编写 React 代码，然后不是将其渲染到浏览器环境中，而是在服务器上将其渲染为字符串，作为（接近）静态标记发送给客户端。\n\n现在让我们配置第一个服务端渲染的\
  \ React 应用。\n\n### SSR 项目配置\n\n1. 创建一个名为 `react-ssr` 的空目录。\n\n2. 在终端中，`cd` 进入该目录。\n\
  \n3. 执行 `npm init -y` 以使用默认的 `npm` 配置初始化项目。\n\n   先安装相关的 `npm` 包，运行以下命令：\n\n   `npm\
  \ install react react-dom express --save`\n\n   其他 `dev` 依赖包括：\n\n   `npm install\
  \ @babel/core @babel/preset-react @babel/register webpack webpack-cli --save-dev`\n\
  \n   此时，你的 `package.json` 中的 `dependencies` 和 `devDependencies` 部分应大致如下：\n\n   ```\n\
  \   \"dependencies\": {\n     \"express\": \"⁴.16.3\",\n     \"react\": \"¹⁶.9.0\"\
  ,\n     \"react-dom\": \"¹⁶.9.0\"\n   },\n   \"devDependencies\": {\n     \"babel-loader\"\
  : \"⁸.0.6\",\n     \"@babel/core\": \"⁷.6.0\",\n     \"@babel/preset-react\": \"\
  ⁷.0.0\",\n     \"@babel/register\": \"⁷.6.0\",\n     \"webpack\": \"⁴.19.1\"\n \
  \    \"webpack-cli\": \"³.3.2\"\n   },\n   ```\n\n4. 好了。依赖项正确设置后，我们来编写一些代码。以下是我们的\
  \ `index.js` 文件：\n\n   ```\n   index.js\n\n   require(\"@babel/register\")( {\n\
  \     presets: [ \"@babel/preset-react\" ]\n   } )\n\n   require( \"./src/server\"\
  \ )\n   ```\n\n   这将是我们脚本的入口点。你可以看到我们直接在脚本文件中使用了 `@babel/register` 包。这允许我们在 Node\
  \ 脚本中直接使用 JSX。\n\n5. 虽然也可以通过 `.babelrc` 配置 babel 来解析服务器文件，但我们现在保持简单，采用最简方法。\n\n\
  好了，设置好 `index.js` 文件后，我们来看 `server.js` 文件：\n\n```\n// server.js\n\nconst express\
  \ = require(\"express\")\nconst app = express()\nconst React = require(\"react\"\
  )\nconst { renderToString } = require(\"react-dom/server\")\n\napp.get('/*', (req,\
  \ res) => {\n  const jsx = <div>Hello</div>\n  const reactDom = renderToString(jsx)\n\
  \  res.send(template(reactDom))\n});\n\napp.listen(1337)\n\nfunction template(reactDom)\
  \ {\n  return `\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n \
  \ <title>React SSR</title>\n</head>\n<body>\n  <div id=\"root\">${reactDom}</div>\n\
  </body>\n</html>\n`\n}\n```\n\n好的！我们来分解一下这个文件中发生的事情：\n\n1. 首先，我们引入必要的模块：`express`\
  \ 模块和 `react` 模块。\n\n2. 我们还引入了 `react-dom`，但注意，我们引入的是 `react-dom/server` 而不是 `react-dom`。\n\
  \n3. 这让我们能够使用名为 `renderToString` 的方法，该方法顾名思义：不是将宿主树（JS 中的 vDOM 表示）渲染到实际的 DOM，而是将其渲染为简单的字符串。\n\
  \n4. 最后，我们使用 `res.send` 将响应发送回客户端。\n\n5. 注意，我们使用模板函数将构建好的字符串注入到响应中。\n\n一旦我们使用 `node\
  \ index.js` 启动服务器，就能看到正确的响应：\n\n![](img/image121.jpg)\n\n**图 5.4**\n\n在上面的截图中，你可以看到服务器发送了\
  \ **Hello**，这实际上是运行 React 代码的结果：\n\n![](img/image81.jpg)\n\n**图 5.5**\n\n当你查看页面的源代码时，如上图所示，你会发现这实际上是由服务器发送的，而不是由客户端渲染的。\n\
  \n### 编写更多组件\n\n\n\n\n我们上面已经用 React SSR 完成了基本的 Hello World，这是第一次使用 React 进行服务端渲染。现在让我们添加更多组件。先从首页和关于页面开始：\n\
  \n```javascript\n// Home.js\nconst React = require('react')\nfunction Home(props)\
  \ {\n  return <div className=\"home\">\n    <h2>Hello, this is homepage! Go to <a\
  \ href=\"/about\">About</a></h2>\n  </div>\n}\nmodule.exports = Home\n```\n\n以及\
  \ `About.js` 页面：\n\n```javascript\nconst React = require('react')\nfunction About(props)\
  \ {\n  return <div className=\"about\">\n    <h2>This is the about page</h2>\n \
  \ </div>\n}\nmodule.exports = About\n```\n\n但你是否发现了上面的问题？我们如何将它们链接起来？也就是说，当你在首页点击那个链接时，关于页面应该打开；同样，当你直接访问\
  \ `/about` 端点时，它应该直接提供那个特定页面。让我们来做一些路由。\n\n### SSR 中的路由\n\n路由是当今 Web 应用最重要的方面之一，尤其是当应用稍微复杂时。它允许你在不同的\
  \ URL 路径上提供不同的内容。\n\n首先安装 react-router 包，它将帮助我们实现路由。\n\n`npm install react-router-dom\
  \ --save`\n\n安装完成后，我们就可以做一些改动了。让我们稍微修改一下 `server.js` 文件：\n\n```javascript\n// server.js\n\
  const express = require(\"express\")\nconst app = express()\nconst React = require(\"\
  react\")\nconstReactDOMServer = require(\"react-dom/server\")\nconst { StaticRouter,\
  \ Switch, Route } = require(\"react-router-dom\")\nconst Home = require('./components/Home')\n\
  const About = require('./components/About')\napp.get('/*', (req, res) => {\n  constjsx\
  \ = <StaticRouter>\n    <Switch>\n      <Route path=\"/\" component={Home} exact={true}\
  \ />\n      <Route path=\"/about\" component={About} exact={true} />\n    </Switch>\n\
  \  </StaticRouter>\n  constreactDom = ReactDOMServer.renderToString(jsx)\n  res.send(template(reactDom))\n\
  });\napp.listen(1337)\nfunction template(reactDom) {\n  return '\n<!DOCTYPE html>\n\
  <html>\n<head>\n<meta charset=\"utf-8\">\n<title>React SSR</title>\n</head>\n<body>\n\
  <div id=\"root\">${reactDom}</div>\n</body>\n</html>\n'\n}\n```\n\n好了！让我们看看这里改了什么：\n\
  \n*   我们从 `react-router-dom` 包中引入了 `StaticRouter`、`Switch` 和 `Route` 模块。\n*   `StaticRouter`\
  \ 是一个简单的路由器，其位置永远不会改变。这没问题，因为我们只是在服务器上渲染 React 字符串，不涉及用户交互。\n*   然后我们定义了 `Switch`\
  \ 来匹配第一个路由，接着是 `Route`，它包含了在特定路由上显示哪个组件的额外信息。\n\n如果我们现在访问页面，它会显示首页：\n\n![](img/image10.jpg)\n\
  \n**图 5.6**\n\n但如果你访问 `/about` 路由，它仍然只显示相同的首页组件，如下面的截图所示：\n\n![](img/image23.jpg)\n\
  \n**图 5.7**\n\n上面的截图仍然显示渲染的是 `Home` 组件。这是为什么？仔细看，我们的 `StaticRouter` 虽然是静态的，但仍然需要知道正确的位置才能解析正确的路由。我们在静态路由器上缺少了\
  \ location 属性。另外，对于 Express，`req.url` 提供了请求的路径（即 `/about` 或 `/` 或 `/test`），这正是我们需要传递给\
  \ `StaticRouter` 的内容。让我们在 `server.js` 文件中做如下修改：\n\n```javascript\n<StaticRouter\
  \ location={req.url}>\n  <Switch>\n    <Route path=\"/\" component={Home} exact={true}\
  \ />\n    <Route path=\"/about\" component={About} exact={true} />\n  </Switch>\n\
  </StaticRouter>\n```\n\n所以我们只是给 `StaticRouter` 添加了 `location={req.url}`。完成这一步后，现在如果你直接访问\
  \ `/about`，我们将得到 `/about` 组件：\n\n![](img/image32.jpg)\n\n**图 5.8**\n\n在上面的截图中，我们看到问题已经解决。它正确地渲染了\
  \ `About` 组件在正确的 URL 路径上。到目前为止一切顺利。但我们还可以做得更好。\n\n### 客户端 React\n\nReact 是一个客户端库。然而，在上述\
  \ SSR React 中，我们看到我们可以使用基于静态路由器的系统在服务器上编写类似 React 的标记，并将其发送到客户端机器。但在这个过程中，我们丢失了前端的实际“React”代码。让我们把它找回来。\n\
  \n让我们创建另一个名为 `client.js` 的文件，并在其中编写以下代码：\n\n```javascript\nimport React from 'react'\n\
  import ReactDOM from 'react-dom'\nimport Home from './components/Home'\nimport About\
  \ from './components/About'\nimport { BrowserRouter as Router, Route, Switch } from\
  \ 'react-router-dom'\nconstjsx = (\n  <Router>\n    <Switch>\n      <Route path=\"\
  /\" component={Home} exact={true} />\n      <Route path=\"/about\" component={About}\
  \ exact={true} />\n    </Switch>\n  </Router>\n)\nconst app = document.getElementById('root')\n\
  ReactDOM.hydrate(jsx, app)\n```\n\n我们将把这个文件与 `server.js` 放在一起。为了明确文件结构，以下是到目前为止所有文件的组织：\n\
  \n![](img/image111.jpg)\n\n**图 5.9**\n\n上面的截图显示了项目中的文件结构。你在前面的代码中可能已经注意到，我们使用了 `ReactDOM.hydrate`\
  \ 而不是 `ReactDOM.render`，我们将在本节后面讨论这一点。\n\n首先，让我们设置其他东西。我们还将修改 server.js 文件以包含我们的\
  \ client.js 文件。最终 `server.js` 文件应该如下所示：\n\n```javascript\nconst express = require(\"\
  express\")\nconst app = express()\nconst React = require(\"react\")\nconstReactDOMServer\
  \ = require(\"react-dom/server\")\nconst { StaticRouter, Switch, Route } = require(\"\
  react-router-dom\")\nconst Home = require('./components/Home')\nconst About = require('./components/About')\n\
  app.use(express.static(path.resolve(__dirname, '../dist')))\napp.get('/*', (req,\
  \ res) => {\n  console.log(req.url)\n  constjsx = <StaticRouter location={req.url}>\n\
  \    <Switch>\n      <Route path=\"/\" component={Home} exact={true} />\n      <Route\
  \ path=\"/about\" component={About} exact={true} />\n    </Switch>\n  </StaticRouter>\n\
  \  constreactDom = ReactDOMServer.renderToString(jsx)\n  res.send(template(reactDom))\n\
  });\napp.listen(1337)\nfunction template(reactDom) {\n  return '\n<!DOCTYPE html>\n\
  <html>\n<head>\n<meta charset=\"utf-8\">\n<title>React SSR</title>\n</head>\n<body>\n\
  <div id=\"root\">${reactDom}</div>\n<script src=\"./app.bundle.js\"></script>\n\
  </body>\n</html>\n'\n}\n```\n\n注意加粗的行。首先，在 Express 服务器中，我们配置了提供静态文件（即我们上面创建的客户端打包文件）。\n\
  \n然后，我们在 HTML 响应中包含了脚本本身。\n\n### ReactDOM.hydrate\n\n我们没有使用 `ReactDOM.render`，而是使用了\
  \ `ReactDOM.hydrate`。顾名思义，`ReactDOM.hydrate` 只是*水合*现有的布局，它不会创建布局并替换 DOM 中的内容。`ReactDOM.hydrate`\
  \ 知道布局字符串来自服务器，因此它只需要将客户端 JS（即事件和监听器）与来自服务器的 HTML 代码同步。因此，我们使用了 hydrate 方法。\n\n\
  这里需要注意一件有趣的事情：`ReactDOM.hydrate` 期望你在前端（client.js 中）提供的布局与后端（`server.js`）提供的布局接近，否则会给你带来问题。\n\
  \n最后，让我们为前端设置 webpack，以便我们可以使用 import/export 语法，并实际在前端使用 React。\n\n我们之前已经安装了 webpack，所以直接创建一个\
  \ webpack.config.js 文件，如下所示：\n\n```javascript\nconst path = require('path')\nmodule.exports\
  \ = {\n  mode: 'development',\n  devtool: 'source-map',\n  entry: {\n    app: './src/client.js',\n\
  \  },\n  module: {\n    rules: [\n      {\n        test: /\\.jsx?$/,\n        exclude:\
  \ /(node_modules|bower_components)/,\n```\n\n\n\n\n`loader: \"babel-loader\",`\n\
  `}`\n`],`\n`},`\n`output: {`\n`path: path.resolve(__dirname, 'dist'),`\n`filename:\
  \ '[name].bundle.js',`\n`}`\n`}`\n\n好了！让我们快速看一下 webpack 配置文件中发生了什么：\n\n*   我们将入口点设置为\
  \ `src/client.js` 文件。\n*   我们只有一条规则，每当遇到 JS 或 JSX 文件时，让 `babel-loader` 处理它。\n* \
  \  Babel 加载器将使用我们接下来要创建的 `.babelrc` 文件。\n*   最后，将文件输出到 `dist` 目录中，文件名为 `app.bundle.js`（`[name]`\
  \ 会被替换为 `app`，即入口点的键）。\n\n而我们的 `.babelrc` 文件将如下所示：\n\n```\n{\n  \"presets\": [\n\
  \    \"@babel/preset-react\"\n  ],\n  \"plugins\": [\"@babel/plugin-syntax-dynamic-import\"\
  ]\n}\n```\n\n请记住，我们之前已经安装过这些内容，所以可以直接使用。最后，让我们进入 `package.json` 并创建两个脚本：\n\n```\n\
  \"scripts\": {\n  \"server\": \"nodemonindex.js\",\n  \"client\": \"webpack --watch\
  \ --progress\"\n}\n```\n\n这里，我们定义了两个脚本，一个用于启动 Express 服务器，另一个用于构建客户端的更改（这些更改需要由\
  \ webpack/babel 编译后，浏览器才能读取）。\n\n打开两个不同的终端，在第一个终端中运行 `npm run server`，在第二个终端中运行\
  \ `npm run client`。\n\n最后，再次访问 `http://localhost:1337` 并查看源代码：\n\n![](img/image61.jpg)\n\
  \n**图 5.10**\n\n上面的截图显示，现在我们包含了 React 代码在前端运行所需的 JS：\n\n![](img/image131.jpg)\n\n\
  **图 5.11**\n\n请看上面的截图；它显示了 `app.bundle.js` 文件的内容。太棒了！那么我们现在如何使用它呢？嗯，你可以看到我们已经在 `client.js`\
  \ 和 `server.js` 文件之间共享了 `components` 文件夹，因此我们做的一次更改会在两个空间中重新渲染。\n\n所以，让我们继续，不再使用直接指向关于页面的锚链接，而是使用\
  \ React Router，这样当用户点击超链接时，能提供无缝的体验。\n\n将 `Home.js` 文件更新为：\n\n```\n// Home.js\n\
  const React = require('react')\nconst { Link } = require('react-router-dom')\n\n\
  function Home(props) {\n  return <div className=\"home\">\n    <h2>你好，这是主页！前往 <Link\
  \ to=\"/about\">关于</Link></h2>\n  </div>\n}\n\nmodule.exports = Home\n```\n\n现在，当你访问主页并点击关于链接时，页面不会像之前那样重新加载，而是无需刷新即可导航到\
  \ `/about` 路由。同样，如果你直接访问 `/about` 页面，服务器只会获取 `/about` 页面的内容，并且这些内容同样会在源代码中可见。\n\n\
  这就是服务端渲染！\n\n### 获取数据\n\n尽管使用 React 进行 SSR 很棒，但有时你会遇到某些困难，因为有些东西只在浏览器环境中可用，有些只在\
  \ Node 环境中可用。其中之一就是如何获取数据。\n\n让我们使用一个名为 `isomorphic-fetch` 的包，它允许我们在两种环境中使用 `fetch`：\n\
  \n`npm install isomorphic-fetch --save`\n\n现在，让我们修改 `Home.js` 文件，使其看起来像这样：\n\n```\n\
  // Home.js\nconst React = require('react')\nconst { Link } = require('react-router-dom')\n\
  require('isomorphic-fetch')\nconst { useEffect, useState } = React\n\nfunction Home(props)\
  \ {\n  const [data, setData] = useState(null)\n\n  useEffect(() => {\n    fetch('https://jsonplaceholder.typicode.com/posts/1').then(data\
  \ => data.json())\n    .then(data => setData(data))\n  }, [])\n\n  if(!data) return\
  \ <p>加载中…</p>\n\n  return <div className=\"home\">\n    <h2>{data.title}</h2>\n\
  \    <p>{data.body}</p>\n    <Link to=\"/about\">关于</Link>\n  </div>\n}\n\nmodule.exports\
  \ = Home\n```\n\n注意这里；我们使用了 hooks。由于 `useEffect` 钩子在组件挂载后运行，其中的代码无论如何都不会在服务器上执行。所以我们可以直接使用\
  \ `fetch` 而不需要 `isomorphic-fetch` 库，但暂时我们还是继续使用它。\n\n然后我们最终获取数据并在客户端显示：\n\n![](img/image141.jpg)\n\
  \n**图 5.12**\n\n上面的截图展示了我们如何在客户端获取数据。到目前为止，看起来也不错。但我们能做得更好吗？如果直接在服务器端（Node 环境）获取数据，然后将其发送给客户端，会怎么样？服务器是强大的计算机，可以对常用资源实现强缓存，并能大大加快速度。然而，同步服务端状态和客户端状态开始变得麻烦，正如我们接下来要看到的。\n\
  \n### 在服务器上获取数据\n\n思路是，我们将通过一个属性暴露特定组件所需的任何数据，然后在实际将 JSX 渲染为字符串之前，解析所有的 Promise\
  \ 和数据获取。最后，以某种方式同步状态和 React 代码。让我们简要看看如何实现。让我们看看更新后的 `Home.js` 文件。请稍等一下：\n\n```\n\
  // Home.js\nconst React = require('react')\nconst { Link } = require('react-router-dom')\n\
  require('isomorphic-fetch')\nconst { useEffect, useState } = React\n\nfunction Home(props)\
  \ {\n  const [data, setData] = useState(process.env.BROWSER && window.componentsData[Home.name])\n\
  \n  useEffect(() => {\n    if(!data) {\n      fetch('https://jsonplaceholder.typicode.com/posts/1').then(data\
  \ => data.json())\n      .then(data => setData(data))\n    }\n  }, [])\n\n  if(!data)\
  \ return <p>加载中…</p>\n\n  return <div className=\"home\">\n    <h1>这是主页</h1>\n \
  \   <h2>{data.title}</h2>\n    <p>{data.body}</p>\n    <Link to=\"/about\">关于</Link>\n\
  \  </div>\n}\n\nHome.asyncData = 'https://jsonplaceholder.typicode.com/posts/1'\n\
  \nmodule.exports = Home\n```\n\n让我们通过以下几点来理解上述代码的作用：\n\n*   好了。这里，我们添加了一些检查，看数据是否已经可用。\n\
  *   首先，我们使用 `process.env.BROWSER` 检查是否在浏览器环境中（我们稍后会在 webpack 中配置这个）。\n*   如果是浏览器，我们希望从全局\
  \ window 对象加载状态（我们会设置好这个）。\n*   `Home.name` 返回 \"Home\"，即函数名。\n\n我们还为 `Home` 组件添加了\
  \ `asyncData` 属性，稍后将用于在服务器上预取数据。\n\n让我们也更新 `About.js` 文件：\n\n```\nconst React =\
  \ require('react')\nconst { Link } = require('react-router-dom')\nconst { useState,\
  \ useEffect } = React\n\nfunction About(props) {\n  const [data, setData] = useState(process.env.BROWSER\
  \ && window.componentsData[About.name])\n\n  useEffect(() => {\n    if(!data) {\n\
  \      fetch('https://jsonplaceholder.typicode.com/posts/2').then(data => data.json())\n\
  \      .then(data => setData(data))\n    }\n  }, [])\n\n  if(!data) return <p>加载中…</p>\n\
  \n  return <div className=\"about\">\n    <h1>这是关于页面</h1>\n    <h2>{data.title}</h2>\n\
  \    <p>{data.body}</p>\n    <Link to=\"/\">主页</Link>\n  </div>\n}\n\nAbout.asyncData\
  \ = 'https://jsonplaceholder.typicode.com/posts/2'\n\nmodule.exports = About\n```\n\
  \n与 `Home.js` 类似，我们在 `About.js` 文件中也在获取更多数据。此外，我们为 `About` 组件附加了一个 `asyncData` 属性，稍后将用到。\n\
  \n另外，当 webpack 构建我们的脚本时，我们需要访问 `process.env.BROWSER` 变量，因此我们将在 `webpack.config.js`\
  \ 文件中添加它。最终我们的 `webpack.config.js` 文件将如下所示：\n\n```\nconst path = require('path')\n\
  const webpack = require('webpack')\n\nmodule.exports = {\n  mode: 'development',\n\
  \  devtool: 'source-map',\n  entry: {\n    app: './src/client.js',\n  },\n  module:\
  \ {\n    rules: [\n      {\n        test: /\\.jsx?$/,\n        exclude: /(node_modules|bower_components)/,\n\
  \        loader: \"babel-loader\",\n      }\n    ],\n  },\n  output: {\n    path:\
  \ path.resolve(__dirname, 'dist'),\n    filename: '[name].bundle.js',\n  },\n}\n\
  ```\n\n\n\n\n```\nplugins: [\n  new webpack.DefinePlugin({\n    'process.env': {\n\
  \      'BROWSER': 'true',\n    }\n  })\n]\n```\n\n完成这一步后，我们来看看需要在 `server.js` 文件中做哪些修改：\n\
  \n```\nconst express = require(\"express\")\nconst app = express()\nconst React\
  \ = require(\"react\")\nconst path = require('path')\nconstReactDOMServer = require(\"\
  react-dom/server\")\nconst { StaticRouter, Switch, Route } = require(\"react-router-dom\"\
  )\nconst Home = require('./components/Home')\nconst About = require('./components/About')\n\
  require('isomorphic-fetch')\napp.use(express.static(path.resolve(__dirname, '../dist')))\n\
  app.get('/*', (req, res) => {\n  const components = [Home, About]\n  constasyncData\
  \ = {}\n  const promises = components.map(c => ({\n    link: c.asyncData,\n    name:\
  \ c.name\n  })).filter(item =>item.link).map(item => {\n    return fetch(item.link).then(data\
  \ =>data.json()).then(json => {\n      asyncData[item.name] = json\n    })\n  })\n\
  \  constjsx = <StaticRouter location={req.url}>\n    <Switch>\n      <Route path=\"\
  /\" component={Home} exact={true} />\n      <Route path=\"/about\" component={About}\
  \ exact={true} />\n    </Switch>\n  </StaticRouter>\n  Promise.all(promises).then(()\
  \ => {\n    constreactDom = ReactDOMServer.renderToString(jsx)\n    res.send(template(reactDom,\
  \ asyncData))\n  })\n})\napp.listen(1337)\nfunction template(reactDom, data) {\n\
  \  return '\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>React\
  \ SSR</title>\n</head>\n<body>\n<div id=\"root\">${reactDom}</div>\n<script>\nwindow.componentsData\
  \ = ${JSON.stringify(data)}\n</script>\n<script src=\"./app.bundle.js\"></script>\n\
  </body>\n</html>\n'\n}\n```\n\n好了！这个文件里发生了什么？\n\n*   首先，我们将所有组件收集到一个名为 `components`\
  \ 的数组中。\n*   然后，我们创建一个 Promise 数组。最终，这个数组将包含多个未完成的 fetch 请求。\n*   这里，我们从 `components`\
  \ 数组开始，创建一个新的对象数组，每个对象包含要 fetch 的链接（`asyncData` 链接）和组件的名称（在 JavaScript 中，`Function.name`\
  \ 会返回该函数的名称）。\n*   我们使用名称将其链接到特定组件。\n*   最后，我们过滤这个数组，移除那些没有需要 fetch 的 `async` 数据的元素。\n\
  *   完成后，我们进行最终的映射，在其中 fetch 所有数据并返回 promise。注意，在 fetch 请求中，我将 `item.name` 作为 `asyncData`\
  \ 对象的键，将 `json`（远程服务器返回的结果）作为 `asyncData` 对象的值。\n*   此时，`promises` 包含了所有并行进行的 fetch\
  \ 请求。现在，我们需要等待所有 fetch 请求完成，然后再将数据发送回客户端。\n*   因此，我们使用 `Promise.all` 等待所有 Promise\
  \ 解析。完成后，我们构建 `ReactDOM` 并将其发送给客户端。\n*   对于客户端，我们执行正常的 `hydrate`，但同时也通过一个 script\
  \ 标签发送客户端状态，如 HTML 部分末尾所示。\n\n完成这些操作后，你会看到前端不再有 `fetching` 数据的过程。页面立即加载，并且在 DevTools\
  \ 中看不到 fetch 请求，因为所有数据都已经从服务器端提供给我们：\n\n![](img/image14.jpg)\n\n**图 5.13**\n\n在上面的截图中，你可以看到没有向远程服务器发送数据请求，因为当服务器发送数据时，前端已经拥有了这些数据。太棒了！但即使采用这种方法，我们仍然遇到一些问题：\n\
  \n我们构建的树在服务器端和客户端渲染之间变得不一致。这是因为，当 React 代码在服务器端渲染时，它不知道 `process.env.BROWSER`，因此不会预填充状态变量，从而使用了那个\
  \ `Loading` 片段。然而，在客户端，当 React 重新水合数据时，它已经在全局作用域中拥有了数据，因此它会用实际数据重新水合，从而造成不一致，React\
  \ 也会在控制台中向我们报告这一点：\n\n![](img/image71.jpg)\n\n**图 5.14**\n\n*   在上面的截图中，你可以看到 React\
  \ 抱怨 DOM 不匹配，即它期望的内容与服务器实际发送的内容不一致。\n*   另一个问题是，我们 fetch 了所有组件的 `async` 数据，尽管我们只需要\
  \ fetch 当前活动组件的 `async` 数据。\n*   我们也没有处理嵌套组件的问题，即许多嵌套组件需要彼此之间的 `async` 数据。\n*  \
  \ 单个组件可能需要来自不同来源的多个 `async` 数据；我们也没有处理这种情况。\n\n## 结论\n\n请记住，我们之前讨论过，使用 React 进行\
  \ SSR 并非易事；你需要处理许多边缘情况才能使其正常工作。因此，自己修复每一个小细节是不可行的。所以，我们将使用某些框架，这些框架会为我们抽象掉许多细节，让我们能够更专注于代码本身，而不是这些需要实现的小细节。在接下来的章节中，我们将讨论\
  \ Next.js，这是一个流行的 React 框架，用于创建生产就绪的服务器端渲染应用程序。\n\n## 问题\n\n1.  服务器端渲染与普通的客户端 React\
  \ 代码有何不同？\n2.  PHP 是一种服务器端渲染语言吗？为什么是/为什么不是？\n3.  Babel 的作用是什么？\n4.  `StaticRouter`\
  \ 和普通 `Router` 有什么区别？\n5.  `ReactDOM.render` 和 `ReactDOM.hydrate` 有什么区别？\n6.  同构\
  \ JavaScript 是什么意思？\n\n# 第 6 章\n\n## Next.js 简介\n\n在上一章中，我们学习了很多关于从零开始使用 React 进行服务器端渲染的知识，并看到了仅仅为了让客户端和服务器端机器之间的简单结果同步，需要多少工具配置。现在，让我们进入\
  \ Next.js，看看它是什么，以及为什么它是一个很好的选择。\n\n### 结构\n\n*   什么是 Next.js\n*   安装\n*   默认设置\n\
  *   Next.js 中的页面\n*   静态资源\n*   路由\n*   组件\n*   CSS\n\n### 目标\n\n本章旨在向你介绍 `Next.js`，这是一个为\
  \ React 构建的服务器端渲染框架。`Next.js` 将大大简化你作为开发者的工作流程，从而将更多精力投入到应用程序的逻辑和目的上，减少在基础设施部分上的精力。我们将学习它是什么，如何设置以及如何有效地使用它。\n\
  \n### 什么是 Next.js？\n\n`Next.js` 是一个用于使用 React 构建服务器端应用程序的框架。框架提供了许多开箱即用的功能。`Next.js`\
  \ 提供了路由、页面管理、服务器端渲染、缓存等解决方案，并且非常容易设置。\n\n你可以将 `Next.js` 的易用性与 `create-react-app`\
  \ 相提并论。就像手动设置 React 项目很繁琐一样，在上一章中，我们看到手动设置 React SSR 项目同样繁琐。`Next.js` 来救场了！\n\n\
  ### 为什么选择 Next.js？\n\n根据其官方网站，以下是一些解释为什么它是一个好选择的要点：\n\n1.  服务器渲染：这是使用 Next.js 的主要原因。\n\
  2.  静态导出：这意味着你可以通过几次点击和命令生成网站的静态包（并非所有情况都可行）。\n3.  CSS-in-JS：CSS in JS 是一种流行的技术，人们直接在\
  \ JS 中编写样式。有些人对此不以为然，但社区或多或少地认可它，并围绕它开发了许多解决方案。Next.js 支持所有这些方案。\n4.  零配置：设置起来就像\
  \ `create-react-app` 一样简单。我们将在几分钟内用 Next.js 准备好我们的 Hello World 应用。\n\n\n\n\n5. 完全可扩展：你可以控制\
  \ `babel` 和 `webpack` 配置。一旦能够控制这些，你几乎可以掌控项目的每一个细节。\n\n6. 生产就绪：它是一个开源且高度优化的框架，目前已相当成熟，可用于创建生产级的\
  \ React 应用。\n\n如果你愿意采用基于 React 的 SSR 解决方案，以上是选择 `Next.js` 的众多理由中的一部分。\n\n### 安装\n\
  \n让我们开始为项目设置 `Next.js`。\n\n1. 创建一个名为 `react-ssr-next` 的目录\n\n2. 使用命令行，`cd` 进入该目录\n\
  \n3. 运行以下命令：\n\n   ```\n   npm init -y\n   npm install react react-dom next --save\n\
  \   ```\n\n   这些命令基本上会设置好你的 `package.json` 文件并安装所需的依赖。你是否注意到我们总共只需要三个包？就是 `react`、`react-dom`\
  \ 和 `next` 包！\n\n4. 最后，继续修改 `package.json` 文件中的 `scripts` 部分，使其如下所示：\n\n   ```\n\
  \   \"scripts\": {\n     \"dev\": \"next\",\n     \"build\": \"next build\",\n \
  \    \"start\": \"next start\"\n   }\n   ```\n\n   因此，你的 `package.json` 文件大致如下（版本号可能不同）：\n\
  \n   ```\n   {\n     \"name\": \"nextjs\",\n     \"version\": \"1.0.0\",\n     \"\
  main\": \"index.js\",\n     \"scripts\": {\n       \"dev\": \"next\",\n       \"\
  build\": \"next build\",\n       \"start\": \"next start\"\n     },\n     \"keywords\"\
  : [],\n     \"author\": \"\",\n     \"license\": \"ISC\",\n     \"description\"\
  : \"\",\n     \"dependencies\": {\n       \"next\": \"⁹.1.1\",\n       \"react\"\
  : \"¹⁶.9.0\",\n       \"react-dom\": \"¹⁶.9.0\"\n     }\n   }\n   ```\n\n5. 现在，在根文件夹中创建一个\
  \ `pages` 目录。这是 `Next.js` 框架所要求的。\n\n6. 接着，在同一目录下执行 `npm run dev`。\n\n   它会启动 `Next.js`\
  \ 进程。但由于我们的 `pages` 目录为空，目前还没有页面可提供。\n\n   不过，它会给我们一个包含大量信息的 URL：`http://localhost:3000`：\n\
  \n   ![](img/image82.jpg)\n\n   **图 6.1**\n\n   在上面的截图中，我们可以看到运行 `npm run dev` 会启动一个开发用的\
  \ `Next.js` 服务器供我们使用。\n\n7. 然而，导航到 `localhost:3000` 时，你会看到一个 404 页面。这是因为我们的 `pages`\
  \ 目录为空，`Next.js` 尚未提供任何内容。\n\n### Next.js 默认配置\n\n此时，我们已经正确设置并运行了 `Next.js`。为了避免一开始就处理大量配置，`Next.js`\
  \ 锁定了一些默认配置。让我们逐一了解。\n\n### 页面\n\n我们之前创建了 `pages` 文件夹。这个文件夹名称并非我随意取的。你在该文件夹中创建的任何文件名，都会成为应用中的一个路由！让我们从一个简单的\
  \ `index.js` 页面开始，它是应用的根页面：\n\n在 `pages/index.js` 文件中，编写以下简单的 React 组件：\n\n```\n\
  // pages/index.js\nexport default () => <h1>Hello World</h1>\n```\n\n就这样！刷新 `localhost:3000`\
  \ 页面（由于热重载已开启，它会自动刷新），然后我们就看到了：\n\n![](img/image15.jpg)\n\n**图 6.2**\n\n在上面的截图中，我们可以看到使用\
  \ `Next.js` 成功在屏幕上输出了 Hello World。\n\n查看源代码，我们会看到以下内容：\n\n```\n<!DOCTYPE html><html><head><meta\
  \ charSet=\"utf-8\"/><meta name=\"viewport\" content=\"width=device-width,minimum-scale=1,initial-scale=1\"\
  /><meta name=\"next-head-count\" content=\"2\"/><link rel=\"preload\" href=\"/_next/static/development/pages/index.js?ts=1569413352906\"\
  \ as=\"script\"/><link rel=\"preload\" href=\"/_next/static/development/pages/_app.js?ts=1569413352906\"\
  \ as=\"script\"/><link rel=\"preload\" href=\"/_next/static/runtime/webpack.js?ts=1569413352906\"\
  \ as=\"script\"/><link rel=\"preload\" href=\"/_next/static/runtime/main.js?ts=1569413352906\"\
  \ as=\"script\"/></head><body><div id=\"__next\"><h1>Hello World</h1></div><script\
  \ src=\"/_next/static/development/dll/dll_397dc449097af0b4e992.js?ts=1569413352906\"\
  ></script><script id=\"__NEXT_DATA__\" type=\"application/json\">{\"dataManager\"\
  :\"[]\",\"props\":{\"pageProps\":{}},\"page\":\"/\",\"query\":{},\"buildId\":\"\
  development\",\"nextExport\":true,\"autoExport\":true}</script><script async=\"\"\
  \ data-next-page=\"/\" src=\"/_next/static/development/pages/index.js?ts=1569413352906\"\
  ></script><script async=\"\" data-next-page=\"/_app\" src=\"/_next/static/development/pages/_app.js?ts=1569413352906\"\
  ></script><script src=\"/_next/static/runtime/webpack.js?ts=1569413352906\" async=\"\
  \"></script><script src=\"/_next/static/runtime/main.js?ts=1569413352906\" async=\"\
  \"></script></body></html>\n```\n\n其中大部分是开发环境和热重载脚本。但我们可以清楚地看到 Hello World 标记已渲染在源代码中，而不是通过客户端\
  \ JavaScript 动态创建。嘿，这就是服务端渲染！\n\n现在创建一个 `about.js` 文件：\n\n```\n// pages/about.js\n\
  const AboutMe = () => {\n  return (\n    <div id=\"about-me\">\n      <h1>Hey Guys!</h1>\n\
  \      <p>My name is Mehul and I’m the author of this book.</p>\n      <p>This book\
  \ covers React and stuff</p>\n      <p>I like React</p>\n    </div>\n  )\n}\n\n\
  export default AboutMe\n```\n\n基本上就是这样！保存文件并访问 `localhost:3000/about`，你会看到以下页面：\n\
  \n![](img/image62.jpg)\n\n**图 6.3**\n\n上面的页面展示了我们在 `about.js` 文件中作为 React 组件编写的内容，无需任何额外配置。`Next.js`\
  \ 在底层处理了路由。\n\n### 热代码重载\n\n你看，当我们修改代码时，如果 Next 服务器正在运行（使用 `npm run dev` 命令），我们无需手动前往浏览器刷新更改。`Next.js`\
  \ 会自动与文件系统通信，检测是否有任何更改，如果有，它会重新构建并将消息推送到浏览器以获取新更改并相应更新。\n\n当你使用 Next 时，这是开箱即用的功能。\n\
  \n### 静态文件服务\n\n`Next.js` 还可以通过一个特殊目录名称来提供静态文件（图片、视频、字体等）。在项目根目录下创建一个名为 `static`\
  \ 的目录。你放在此目录下的任何内容都会在 `/static/` 路由下提供。\n\n让我们尝试在 `public/static` 文件夹中放置一张图片。最终的文件夹结构如下：\n\
  \n![](img/image112.jpg)\n\n**图 6.4**\n\n上面的截图显示了文件结构应该是什么样子。\n\n完成后，你应该能够导航到 `localhost:3000/static/profile.jpeg`：\n\
  \n![](img/image33.jpg)\n\n**图 6.5**\n\n你可以将所有静态资源放在项目中的 `static` 目录中。\n\n在 Next\
  \ 的早期版本中，你必须将所有静态资源放在根目录的 `static` 文件夹中。现在，你可以将任何内容放在 `public` 文件夹中，它将在根 URL 路径下可用。但为了明确哪些资源是静态的，我们仍然会将静态资源存储在\
  \ `public/static` 路径下。\n\n### 路由\n\n在 `Next.js` 中，路由非常简单，至少基本路由是这样。上面我们看到了路由如何工作的基本演示——只需在文件夹内创建\
  \ JavaScript 文件。但我们还需要将这些页面*链接*起来。该怎么做呢？\n\n当然，我们可以使用常规的锚标签进行链接，但请记住，就像原始的 React\
  \ SSR 一样，这会导致完全重定向，而我们不希望这样，仅仅是因为我们有能力在后台获取更新数据并使用 React 更新 UI，这正是使用 React 的全部意义！所以，让我们使用\
  \ `Next.js` 中的 `Link`。\n\n### Link\n\n\n\n\n来自 `Next.js` 的 `Link` API 允许你执行导航，就像我们使用\
  \ `react-router-dom` 包中的 `Link` 组件一样。\n\n以下是使用方法。我们将更新 `index.js` 文件，将其链接到关于页面：\n\
  \n```\n// pages/index.js\nimport Link from 'next/link'\nconst Home = () => {\nreturn\
  \ <div id=\"home\">\n<h1>This is a nice homepage</h1>\n<p>Click <Link href=\"/about\"\
  ><a>here</a></Link> to go to about page</p>\n</div>\n}\nexport default Home\n```\n\
  \n以下是具体说明：\n\n*   首先，我们导入要使用的 `Link` 组件。\n*   接着，我们用 `Link` 组件包裹希望作为超链接的文本。\n* \
  \  注意，我们将 `href` 属性赋予 `Link` 组件，并在其内部再次使用了 `anchor` 标签。这一点很重要，我们稍后会讲到。\n*   最后，在\
  \ `href` 属性中，我们传递了要导航到的链接。让我们看看它生成的输出：\n\n    ![](img/image91.jpg)\n\n    **图 6.6**\n\
  \n    上面的截图展示了 `Link` 组件在渲染时如何被转换为 HTML 中的常规 `anchor` 标签。\n*   太棒了！我们可以看到超链接出现在源代码中。但通过使用\
  \ `Link` 组件，`Next.js` 还自动利用 HTML5 history API 处理了客户端导航，我们无需编写任何代码。\n*   现在，当你点击\
  \ **About** 链接时，它会无缝导航到关于页面。\n\n现在，让我们进一步探索这个 `Link` 组件，以及它与我们习惯在 `react-router-dom`\
  \ 中看到的组件有何不同。\n\n### `Link` 只是一个高阶组件\n\n如果你来自 `react-router-dom` 的 `Link` 组件，你可能会将这个\
  \ `Link` 与那个混淆。在 `react-router-dom` 中，你可以直接向该组件传递 props，它会变成一个超链接并使用这些 props（如 `className`、`onClick`\
  \ 等）。但 `Next.js` 提供的 `Link` API 只是一个高阶组件，也就是说，它只是将你的子组件绑定到 history API 变化的点击事件上。它不会将你提供的\
  \ props 传递给子组件，因此你必须对子组件进行任何所需的修改，而不是在 `Link` 组件上。\n\n例如，考虑以下代码片段。这是为 `anchor` 标签分配\
  \ class 的错误方式：\n\n```\n<p>Click <Link href=\"/about\" className=\"mylink\"><a>here</a></Link>\
  \ to go to about page</p>\n```\n\n实际上，如果你运行上述代码，你会发现 `anchor` 标签并没有被附加 `myLink`\
  \ 类。\n\n这是为 `anchor` 标签添加 class 的正确方式：\n\n```\n<p>Click <Link href=\"/about\"><a\
  \ className=\"mylink\">here</a></Link> to go to about page</p>\n```\n\n### 关于 `Link`\
  \ 的更多内容\n\n`Link` 组件基本上会为其子元素附加一个 `onClick` 事件。因此，如果子元素支持 `onClick` 事件，`Link` 就能正常工作。考虑以下情况：\n\
  \n```\n<Link href=\"/about\"><imgsrc=\"/static/profile.jpeg\" /></Link>\n```\n\n\
  在这种情况下，`Link` 会正常工作，导航也会发生，但 HTML 标记中不会出现带有 `href` 属性的 `a` 标签，这可能对 SEO 不利。\n\n因此，你应该将上面的\
  \ `img` 标签包裹在 `anchor` 标签中。\n\n如果你希望 `Next.js` 在 `anchor` 标签以外的标签上显示 `href` 属性（用于调试目的），你可以像这样向\
  \ `Link` 组件传递 `passHref` 属性：\n\n```\n<Link href=\"/about\" passHref>\n<imgsrc=\"\
  /static/profile.jpeg\" />\n</Link>\n```\n\n这将渲染出以下标记：\n\n```\n<imgsrc=\"/static/profile.jpeg\"\
  \ href=\"/about\"/>\n```\n\n这在调试时很有用，当你想要找出点击特定元素时页面将被重定向到的链接时。\n\n### `Next.js`\
  \ 组件\n\n页面没问题，但可复用的代码片段呢？我们显然可以创建组件文件，并将其包含在其他页面中。让我们创建一个名为 **components** 的目录，但请记住，与\
  \ pages 或 static 不同，这次目录的名称并不重要。以下是一个简单的示例：\n\n```\n// components/Header.js\nimport\
  \ Link from 'next/link'\nconst Header = () => (\n<header>\n<Link href=\"/\">\n<a>Home</a>\n\
  </Link>\n<Link href=\"/about\">\n<a>About</a>\n</Link>\n</header>\n)\nexport default\
  \ Header\n```\n\n现在，让我们在 `index.js` 文件中使用上面创建的 `Header` 组件：\n\n```\n// pages/index.js\n\
  import Link from 'next/link'\nimport Header from '../components/Header'\nconst Home\
  \ = () => {\nreturn <div id=\"home\">\n<Header />\n<h1>This is a nice homepage</h1>\n\
  <p>Click <Link href=\"/about\" passHref><imgsrc=\"/static/profile.jpeg\" /></Link>\
  \ to go to about page</p>\n</div>\n}\nexport default Home\n```\n\n`About.js` 文件：\n\
  \n```\n// pages/about.js\nimport Header from '../components/Header'\nconstAboutMe\
  \ = () => {\nreturn (\n<div id=\"about-me\">\n<Header />\n<h1>Hey Guys!</h1>\n<p>My\
  \ name is Mehul and I'm the author of this book.</p>\n<p>This book covers React\
  \ and stuff</p>\n<p>I like React</p>\n</div>\n)\n}\nexport default AboutMe\n```\n\
  \n文件结构如下所示：\n\n![](img/image52.jpg)\n\n**图 6.7**\n\n上面的截图展示了此时文件结构应该是什么样子。\n\n现在你会看到，我们能够在两个页面（`About`\
  \ 和 `Home`）上复用 `Header` 组件。\n\n另外，请注意，如上所述，组件只是一个选择，你可以随意命名这个文件夹，仍然可以使用它（因为我们使用相对路径来引用该文件夹）。\n\
  \n### `Next.js` + CSS\n\n在 `Next.js` 框架中使用 CSS 有多种方式，如今在应用程序中你总会用到 CSS。让我们探索一些常见的方法。\n\
  \n### Styled JSX\n\n这种方法要求你直接在 JSX 模板中编写 CSS。让我们先看一个示例。修改我们的 `Header` 组件以包含一些样式：\n\
  \n```\n// Header.js\nimport Link from 'next/link'\nconst Header = () => (\n<header>\n\
  <style jsx>{\n'\nheader {\npadding: 20px;\nbackground: #1e1e1e;\nborder-bottom:\
  \ 1px solid black;\nfont-size: 30px;\n}\na {\ncolor: white;\nmargin-right: 30px;\n\
  }\n'\n}</style>\n<Link href=\"/\">\n<a>Home</a>\n</Link>\n<Link href=\"/about\"\
  >\n<a>About</a>\n</Link>\n</header>\n)\nexport default Header\n```\n\n这将生成以下效果图：\n\
  \n![](img/image24.jpg)\n\n**图 6.8**\n\n正如代码所描述的，上面的截图显示了预期的输出。\n\n现在，让我们查看渲染后的 HTML。当你查看时，会看到类似这样的内容：\n\
  \n![](img/image101.jpg)\n\n**图 6.9**\n\n上面的截图展示了 Chrome DevTools 中的输出 DOM 树。\n\n\
  请注意，即使我们没有为 `header/anchor` 元素分配任何类，`Next.js` 也自动为我们做了这件事，以实现样式的局部作用域。这样，即使不同组件中有相同的元素，你也可以为它们设置不同的样式，而无需担心样式冲突。当你直接通过标签名或使用非常常见的类（如“container”、“block”等）来定位元素时，这非常有用。\n\
  \n但如果你确实想要全局定位呢？例如，在顶层文件中编写相同的样式以使其全局生效？为此，我们可以包含 `global` 属性。请查看以下示例：\n\n```\n\
  import Link from 'next/link'\nconst Header = () => (\n<header>\n<style jsx global>{\n\
  '\nheader {\npadding: 20px;\nbackground: #1e1e1e;\nborder-bottom: 1px solid black;\n\
  font-size: 30px;\n}\na {\ncolor: white;\nmargin-right: 30px;\n}\n'\n}</style>\n\
  <Link href=\"/\">\n<a>Home</a>\n</Link>\n<Link href=\"/about\">\n<a>About</a>\n\
  </Link>\n</header>\n)\nexport default Header\n```\n\n\n\n这与上面的示例完全相同，唯一的区别是现在我们在\
  \ style 标签中有一个全局属性。尽管 HTML 部分仍然包含自定义作用域的语法，但 CSS 部分现在是真正的全局样式，正如你在渲染输出中看到的：\n\n\
  ![](img/image43.jpg)\n\n**图 6.10**\n\n上面的截图展示了我们的 `Next.js` 代码如何渲染锚点标签。\n\n看，在右侧的样式部分，我们只是针对了\
  \ `anchor` 标签，而不是与之关联的长类名。这意味着我们正在针对页面上的所有锚点标签。\n\n### 导入 CSS 文件\n\n老实说，对我来说，直接在\
  \ JSX 中编写 CSS 有点难以接受，我希望将它们分开以保持清晰。此外，在单独的文件中，你可以获得更好的语法高亮和错误处理。让我们看看如何在页面中设置导入\
  \ CSS 文件。\n\n与 `styled-jsx` 不同，CSS 导入默认并未内置于 `Next.js` 中，因为实现方式有很多种。让我们先安装 `@zeit/next-css`\
  \ 包。按照以下步骤操作：\n\n1.  在你的项目根目录中，执行 `npmi @zeit/next-css --save`\n\n2.  现在，我们需要在项目的根目录中创建一个\
  \ `next.config.js` 文件。文件内容如下：\n\n    ```\n    // next.config.js\n    constwithCSS\
  \ = require(‘@zeit/next-css’)\n    module.exports = withCSS({})\n    ```\n\n3. \
  \ 此时重启你的开发服务器\n\n4.  你可以在 `withCSS` 函数中传递额外选项，例如使用 CSS 模块\n\n5.  完成后，让我们将样式移到单独的文件中\n\
  \n以下是我们的 `Header.js` 组件最终的样子：\n\n```\n// components/Header/index.js\nimport Link\
  \ from ‘next/link’\nimport ‘./style.css’\nconst Header = () => (\n<header>\n<Link\
  \ href=”/”>\n<a>Home</a>\n</Link>\n<Link href=”/about”>\n<a className=”special”>About</a>\n\
  </Link>\n</header>\n)\nexport default Header\n```\n\n而 `style.css` 文件的内容如下：\n\n\
  ```\n// components/Header/style.css\nheader {\npadding: 20px;\nbackground: #1e1e1e;\n\
  border-bottom: 1px solid black;\nfont-size: 30px;\n}\na {\ncolor: white;\nmargin-right:\
  \ 30px;\n}\na.special {\ncolor: yellow;\n}\n```\n\n这将产生以下输出：\n\n![](img/image72.jpg)\n\
  \n**图 6.11**\n\n上面的截图展示了我们刚刚编写的 `Header` 组件文件所产生的输出。\n\n此外，components 目录的文件结构也有所变化。见下方：\n\
  \n![](img/image122.jpg)\n\n**图 6.12**\n\n上面的截图展示了当前的文件结构。\n\n太棒了！现在让我们使用 CSS 模块。我们可以将网站的行为切换为使用\
  \ CSS 模块，这意味着类名将被随机化，从而避免不同组件中相同类名之间的冲突。让我们看看如何实现。将 `next.config.js` 文件修改为以下内容：\n\
  \n```\n// next.config.js\nconstwithCSS = require(‘@zeit/next-css’)\nmodule.exports\
  \ = withCSS({\ncssModules: true\n})\n```\n\n完成此操作并重启服务器后，你会看到你的“About”链接不再是黄色，尽管它在\
  \ HTML 标记中有一个 special 类。这是因为现在启用了 CSS 模块，类名“special”已被 CSS 模块系统重写。现在，要将类应用于特定元素，你必须使用导入的样式。按如下方式修改\
  \ `Header.js` 文件：\n\n```\nimport Link from ‘next/link’\nimport css from ‘./style.css’\n\
  const Header = () => (\n<header>\n<Link href=”/”>\n<a>Home</a>\n</Link>\n<Link href=”/about”>\n\
  <a className={css.special}>About</a>\n</Link>\n</header>\n)\nexport default Header\n\
  ```\n\n现在应该可以工作了！查看 HTML 标记，类名是完全随机的。这基本上就是 webpack CSS 加载器，你还可以使用 webpack 文档中的选项进一步自定义它：[`github.com/webpack-contrib/css-loader`](https://github.com/webpack-contrib/css-loader)。\n\
  \n## 结论\n\n本章介绍了 Next.js 框架，帮助我们理解了一些核心概念，以便开始使用它并设置其某些方面。\n\n我们了解了 Next.js 是什么，如何用它引导第一个项目，并深入了解了发送到浏览器的响应是如何真正渲染为\
  \ HTML 的。\n\n在下一章中，我们将看到如何进一步使用这个框架，并更深入地了解 Next.js 的工作原理，以及如何根据我们的需求调整框架。\n\n##\
  \ 问题\n\n1.  Next.js 与上一章中我们在服务器端运行 React 的方式有何不同？\n\n2.  假设在 `pages/myroute/index.js`\
  \ 有一个组件。在开发模式下运行时，它是否可以在 `localhost:3000/myroute` 访问？\n\n3.  如何在根路径（即 `localhost:3000/robots.txt`）托管\
  \ `robots.txt` 文件？你应该将文件放在哪里？\n\n4.  Next.js 的 Link 与 `react-router-dom` 的 Link\
  \ 有什么区别？\n\n5.  列出一些在 Next.js 组件中使用 CSS 的方法。\n\n# 第七章\n\n## 更多 Next.js 内容\n\n在上一章中，我们学习了\
  \ Next.js，了解了它是什么，以及如何用它快速搭建一个基本的 SSR React 项目。然而，应用程序通常比这更复杂，需要处理许多细节和难点。在本章中，我们将探索\
  \ Next.js 的一些精细部分，并了解如何将它们整合到我们的代码中。这很重要，因为大多数应用程序有时需要根据自身需求进行自定义调整或更改。让我们深入探讨。\n\
  \n### 结构\n\n*   创建 Next.js 项目\n*   Redux 简介\n*   在 Next.js 中设置 Redux\n*   TypeScript\
  \ + Next\n*   使用 Next.js 创建 API 端点\n*   Next.js 自定义文件\n*   动态路由\n\n### 目标\n\n本章的目标是花更多时间全面了解\
  \ `Next.js` 框架，使自己熟悉其生态系统，并从零开始启动一些 `Next.js` 项目，在此过程中探索各种 `Next.js` 概念。\n\n###\
  \ Next.js 应用程序\n\n在本章中，我们将创建一个 `Next.js` 应用，同时讨论关于该应用的重要概念。我们将创建一个登录门户，根据登录的用户类型显示一些自定义值。我们将从基础开始，逐步学习并最终引入\
  \ Redux 等技术。让我们开始吧。\n\n### 启动项目\n\n首先，让我们从创建一个全新的 `Next.js` 项目开始。这很简单，我们在上一章已经做过。以下是本项目需要注意的一些关键点：\n\
  \n*   对于这个项目，目前我们需要一个登录页面、一个注册页面和一个仪表盘页面。\n*   为简单起见，我们将登录页面作为我们的首页。\n*   但在开始之前，让我们先为\
  \ Next.js 切换到 TypeScript（就像我们之前对 React 所做的那样）。\n\n### 切换到 TypeScript\n\nTypeScript\
  \ 已被证明是一种非常可靠的规模化编写 JavaScript 的方法，几乎所有达到一定规模后的代码库都会遇到常见的 JavaScript 陷阱，比如缺乏类型检查支持。TypeScript\
  \ 在这方面非常有用。它编译成 JavaScript，同时允许我们使用最适合开发者的 JavaScript 版本进行编写。\n\n*   要创建一个 TypeScript\
  \ 项目，我们直接使用 `npx` 中的 `create-next-app` 工具\n*   进入你想要设置 Next.js（或者我们应该称之为 `Next.ts`\
  \ 项目）的目录\n*   运行以下命令：\n\n    `npx create-next-app --example with-typescript my-custom-app`\n\
  \n\n\n\n\n*   它的作用是拉取 `create-next-app` 包，并使用提供的参数运行它。它会拉取一个使用 TypeScript 的示例仓库，然后创建名为\
  \ `my-custom-app` 的项目，并自动处理所有 `npm` 安装和 `package.json` 相关事宜。\n\n*   完成后，在文本编辑器中打开该项目。\n\
  \n此时你的文件结构应该如下所示：\n\n![](img/image151.jpg)\n\n**图 7.1**\n\n上面的截图展示了当前的文件结构。\n\n\
  使用 `npm run dev` 启动你的应用程序，这将在 `localhost:3000` 启动一个本地开发服务器。\n\n现在，让我们来看一个名为 Redux\
  \ 的状态管理工具。\n\n### Redux\n\nRedux 是一个通用的状态管理工具，可以作为 React 的选项之一使用。Redux 基本上将状态集中管理，并使数据流单向流动。还记得我们在*状态管理*章节中如何使用\
  \ Context API 吗？Redux 的思路非常类似，只不过它是一个外部依赖，并且附带 Redux DevTools 以及其他一些好处。\n\n让我们看看如何将\
  \ Redux 与 `Next.js` 集成，以及如何一般性地使用它。但在此之前，我们先来看一下 `Next.js` 中名为 `getInitialProps`\
  \ 的生命周期。\n\n### getInitialProps\n\n在 `Next.js` 中，`getInitialProps` 用于在组件渲染之前，根据自定义逻辑填充\
  \ props。该方法在客户端和服务器端都会执行。让我们看一些代码来更好地理解。修改我们项目中的 `about.ts` 文件：\n\n```\n// about.ts\n\
  import * as React from 'react'\nimport Link from 'next/link'\nimport Layout from\
  \ '../components/Layout'\nimport { NextPage, NextPageContext } from 'next'\ntype\
  \ Props = {\n  someprop: string\n}\nconst AboutPage: NextPage<Props> = (props: Props)\
  \ => (\n<Layout title=\"About | Next.js + TypeScript Example\">\n<h1>About</h1>\n\
  <p>This is the about page</p>\n<p>\n<Link href=\"/\">\n<a>Go home {props.someprop}</a>\n\
  </Link>\n</p>\n</Layout>\n)\nAboutPage.getInitialProps = async ({pathname, query}:\
  \ NextPageContext) => {\nconsole.log(pathname, query)\nreturn {\n  someprop: 'customvalue'\n\
  }\n}\nexport default AboutPage\n```\n\n加粗的行是我们在此文件中做的修改。注意我们是如何向 `AboutPage` 添加一个名为\
  \ `getInitialProps` 的函数的。该函数在组件挂载之前运行，如你所见，这个函数应该返回一个 `Promise`。因此，你可以在其中进行各种异步活动，也可以设置我们的\
  \ Redux 存储（稍后详述）。由于它来自 `Next.js`，因此是同构的，既在服务器端运行，也在客户端运行。\n\n在浏览器中，它产生以下输出：\n\n\
  ![](img/image161.jpg)\n\n**图 7.2**\n\n上面的截图展示了浏览器的输出。\n\n控制台看起来如下：\n\n![](img/image142.jpg)\n\
  \n**图 7.3**\n\n上面的截图展示了浏览器的输出。\n\n好的。现在开始我们的应用程序。\n\n### 创建应用\n\n我们从 `index.ts`\
  \ 页面开始，它将是我们的登录页面：\n\n1.  下面是一个 `index.ts` 文件的快速示例：\n\n    ```\n    // pages/index.ts\n\
  \    import React, { useState } from 'react'\n    import { NextPage } from 'next'\n\
  \    import './styles.css'\n    const IndexPage: NextPage = () => {\n    const [username,\
  \ setUsername] = useState<string>('')\n    const [password, setPassword] = useState<string>('')\n\
  \    return (\n    <form method=\"POST\">\n    <div className=\"box\">\n    <h1>Login</h1>\n\
  \    <input type=\"text\" placeholder=\"Username\" className=\"field\" value={username}\
  \ onChange={e =>setUsername(e.target.value)} />\n    <input type=\"password\" placeholder=\"\
  Password\" className=\"field\" value={password} onChange={e =>setPassword(e.target.value)}\
  \ />\n    <div className=\"btn\">Sign In</div>\n    </div>\n    </form>\n    )\n\
  \    }\n    export default IndexPage\n    ```\n\n    上面的组件只是创建了一个简单的受控登录表单，我们很快就会看到。\n\
  \n2.  与 `index.js` 文件关联的 `styles.css` 文件应为：\n\n    ```\n    // styles.css\n    *\
  \ {\n    margin: 0;\n    padding: 0;\n    box-sizing: border-box;\n    outline:\
  \ 0;\n    }\n    body {\n    font-family: 'Open Sans', sans-serif;\n    background:\
  \ #3498db;\n    margin: 0 auto 0 auto;\n    width: 100%;\n    text-align: center;\n\
  \    margin: 20px 0px 20px 0px;\n    }\n    p {\n    font-size: 12px;\n    text-decoration:\
  \ none;\n    color: #ffffff;\n    }\n    h1 {\n    font-size: 1.5em;\n    color:\
  \ #525252;\n    }\n    .box {\n    background: white;\n    width: 300px;\n    position:\
  \ absolute;\n    top: 50%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n\
  \    border-radius: 6px;\n    padding: 20px;\n    box-shadow: 0 0 5px black;\n \
  \   }\n    .field {\n    background: #ecf0f1;\n    border: #ccc 1px solid;\n   \
  \ border-bottom: #ccc 2px solid;\n    padding: 8px;\n    width: 100%;\n    color:\
  \ #AAA;\n    margin-top: 10px;\n    font-size: 1em;\n    border-radius: 4px;\n \
  \   }\n    .btn {\n    background: #2ecc71;\n    width: 100%;\n    cursor: pointer;\n\
  \    padding: 5px 0;\n    color: white;\n    border-radius: 4px;\n    border: #27ae60\
  \ 1px solid;\n    margin-top: 20px;\n    font-weight: 800;\n    font-size: 0.8em;\n\
  \    }\n    .btn:hover {\n    background: #2CC06B;\n    }\n    ```\n\n注意，我是从另一个文件导入\
  \ `styles.css` 的，因此我们还需要在项目根目录中有一个自定义的 `next.config.js` 文件（如上一章所述）：\n\n```\n// next.config.js\n\
  const withCSS = require('@zeit/next-css')\nmodule.exports = withCSS({})\n```\n\n\
  并且还要安装 `@zeit/next-cssnpm` 模块：\n\n`npmi @zeit/next-css -S`\n\n完成后，别忘了重启服务器。\n\n\
  这将为我们提供如下漂亮的输出：\n\n![](img/image63.jpg)\n\n**图 7.4**\n\n上面的截图展示了我们上面创建的登录表单的输出。\n\
  \n注意，我们现在使用 `useState` 钩子来管理该组件的用户名和密码。这是正确的方法，因为我们不需要将组件的这种局部状态存储到 redux 存储中。让我们继续。\n\
  \n现在，我们将在 `Next.js` 中快速设置一个后端来接收登录请求并进行处理。\n\n### 使用 Next.js 的 API\n\n当我们启动 TypeScript\
  \ 演示时，你一定注意到在 `pages` 文件夹下有一个名为 `api` 的文件夹。这个文件夹很特殊。在 Next.js v9 之前，我们必须设置自己的服务器来处理\
  \ API 调用。这很麻烦，因为维护两个服务于单一目的的 Node 服务器很累人。但现在，`Next.js` 原生支持处理 API 调用。我们稍后还会介绍动态路由。\n\
  \n删除 `api` 文件夹中已有的内容，创建一个名为 `login` 的新文件夹，并在其中创建一个名为 `index.ts` 的文件。其内容应如下所示：\n\n\
  ```\n// pages/api/login/index.ts\nimport { NextApiRequest, NextApiResponse } from\
  \ 'next'\nexport default async (req: NextApiRequest, res: NextApiResponse) => {\n\
  const { username, password } = req.body\nif(username === 'admin' && password ===\
  \ 'admin') {\nreturn res.json({\nstatus: 'ok',\ndata: {\nname: 'Mehul Mohan',\n\
  age: 21,\nfavQuote: 'Nobody cares about your feelings bro.'\n}\n})\n}\nreturn res.json({\
  \ status: 'error', message: 'Invalid login' })\n}\n```\n\n好了！那么这个文件中发生了什么？\n\n*\
  \   我们在 `pages/api/login/index.ts` 下创建了一个文件。\n*   在这个文件中，我们导出了一个函数，而不是一个 React 组件。这是因为这是我们的\
  \ API 端点，我们可以在其中编写逻辑。\n\n\n\n\n\n*   `Next.js` 为我们传递了两个参数供我们使用。第一个是 `req`（请求处理器），第二个是\
  \ `res`（响应处理器）。\n*   第一个参数 `req` 包含了当前请求到达该特定端点的所有相关信息。这可能包括 POST 请求体数据、身份验证 Cookie、自定义标头等。\n\
  *   第二个参数 `res` 可由你（开发者）写入。它提供了一些方法，调用这些方法会在底层生成一个 HTTP 响应，API 端点应将该响应发送回客户端。\n\
  *   如果你曾经在 `Node.js` 中使用过 Express，那么这可能会非常熟悉。\n*   首先，我们从 `req.body` 中提取用户名和密码。`req`\
  \ 处理器上的 `body` 属性将包含我们从客户端发送到服务器的任何内容。由于我们期望的是 JSON 请求，我们可以直接解构它。\n*   获取到这些值后，我们对其进行校验。\n\
  *   如果两者都是 admin，则进行身份验证（目前如此）。\n*   如果不是，则发送自定义错误消息。\n*   注意，我们使用 `res.json()`\
  \ 方法发送响应。如果查看 `NextApiResponse` 的类型声明，我们会发现 `res` 对象支持以下方法：\n\n```\nexport declare\
  \ type NextApiResponse<T = any> = ServerResponse& {\n  /**\n   * Send data ‘any’\
  \ data in response\n   */\n  send: Send<T>;\n  /**\n   * Send data ‘json’ data in\
  \ response\n   */\n  json: Send<T>;\n  status: (statusCode: number) =>NextApiResponse<T>;\n\
  };\n```\n\n*   正如注释所述，`send` 只是将原始文本发送回客户端。\n*   `json` 方法接收对象，将其序列化为 JSON 字符串，设置适当的\
  \ Content-Type 标头，然后发送给客户端。\n*   如果你还想设置自定义状态码（默认为 200 OK），可以使用附加的 `status` 方法。\n\
  \n现在，让我们更新首页的 `index.tsx` 文件，将数据发送回服务器 API：\n\n```\n// pages/index.tsx\nimport React,\
  \ { useState } from ‘react’\nimport { NextPage } from ‘next’\nimport ‘./styles.css’\n\
  \nconst IndexPage: NextPage = () => {\n  const [username, setUsername] = useState<string>(‘’)\n\
  \  const [password, setPassword] = useState<string>(‘’)\n\n  async function submitForm()\
  \ {\n    const req = await fetch(‘/api/login’, {\n      method: ‘POST’,\n      headers:\
  \ {\n        ‘Content-Type’: ‘application/json’\n      },\n      body: JSON.stringify({\
  \ username, password })\n    })\n    const json = await req.json()\n    console.log(json)\n\
  \  }\n\n  return (\n    <form method=”POST”>\n      <div className=”box”>\n    \
  \    <h1>Login</h1>\n        <input type=”text” placeholder=”Username” className=”field”\
  \ value={username} onChange={e =>setUsername(e.target.value)} />\n        <input\
  \ type=”password” placeholder=”Password” className=”field” value={password} onChange={e\
  \ =>setPassword(e.target.value)} />\n        <div className=”btn” onClick={submitForm}>Sign\
  \ In</div>\n      </div>\n    </form>\n  )\n}\n\nexport default IndexPage\n```\n\
  \n我们添加了一个名为 `submitForm` 的新函数，当点击“登录”按钮时触发。结果如下：\n\n登录失败：\n\n![](img/image102.jpg)\n\
  \n**图 7.5**\n\n上面的截图展示了用户登录失败的情况。\n\n登录成功：\n\n![](img/image25.jpg)\n\n**图 7.6**\n\
  \n上面的截图展示了用户登录成功的情况。\n\n太棒了！我们刚刚使用 `Next.js` 实现了第一个 API 端点。现在，让我们继续将这些数据放入 Redux\
  \ 存储中。现在开始实现 Redux。这很重要，因为我们希望将服务器传递的数据用于不同的页面/组件，而集中式存储将帮助我们实现这一点。\n\n### 设置 Redux\
  \ + Next.js\n\n首先，安装 `redux` 和 `next-redux-wrapper`，它们将为 `Next.js` 项目提供 `Redux.js`\
  \ 包装器。使用以下命令在系统上安装该包：\n\n`npm install react-redux redux next-redux-wrapper --save`\n\
  \n接下来，我们将设置 Redux 存储。回想一下我们在 Context API 中如何设置默认状态。这与那些行非常相似。存储基本上是一个集中式位置，所有组件都可以在其中存储数据并从该特定区域检索数据。\n\
  \n由于它是集中式的并且与组件解耦，因此读取/写入该区域的值可能会出现问题；因此，必须有一种简化的方式来仅访问组件需要读取的值。\n\n类似地，如果你想写入（更新）Redux\
  \ 状态，你不能直接操作。你必须为其编写一个**归约器**，即用于归约状态的东西。一旦你为存储编写了归约器，你就可以编写**调度器**。这些函数被称为调度器，因为它们将某些动作分派给这些归约器，而归约器在接收到这些动作后，会根据接收到的动作相应地更新状态。下图简要展示了\
  \ Redux 架构的工作原理：\n\n![](img/image113.jpg)\n\n**图 7.7**\n\n如果这让你感到困惑，别担心。当我们再次通过代码来讲解时，一切都会变得清晰得多。现在，让我们看看归约器代码：\n\
  \n1.  在项目目录下的 `redux` 文件夹中创建一个名为 `reducer.ts` 的文件（创建 `redux` 文件夹）。以下是归约器代码：\n\n\
  ```\n// reducer.ts\ntype Action = {\n  type: string\n  payload?: any\n}\n\nexport\
  \ type UserDetails = {\n  name: string\n  age: number\n  favQuote: string\n}\n\n\
  export type State = {\n  user: UserDetails | null\n}\n\nconst defaultState: State\
  \ = {\n  user: null\n}\n\nconst reducer = (state: State = defaultState, action:\
  \ Action) => {\n  switch (action.type) {\n    case ‘SET_USER_DETAILS’:\n      return\
  \ {\n        …state,\n        user: <UserDetails>action.payload\n      }\n    default:\n\
  \      return state\n  }\n}\n\nexport default reducer\n```\n\n在这里，你可以看到我们正在创建一个\
  \ Redux 存储和归约器。如上所述，`store` 是存储数据的地方，而归约器是一个函数，它使用某些分派的动作来更新存储。让我们了解这段代码是如何工作的：\n\
  \n*   首先，我们定义了一些 TypeScript 类型。\n*   然后我们创建了一个 `reducer` 函数。\n*   `reducer` 函数接受两个参数，第一个是实际的应用程序状态，在\
  \ `redux` 调用归约器之前，它会由 redux 自动填充。\n*   第二个参数是动作。我们的任务只是通过 `dispatcher` 函数分派这些动作。Redux\
  \ 会自动调用 `reducer` 函数。\n*   这个动作实际上是一个对象，包含一个类型和负载。\n*   `type` 属性定义了该动作应该更新什么。\n\
  *   `payload` 属性是你可以传递给归约器以更新状态的一些附加数据。\n\n文件结构如下所示：\n\n![](img/image73.jpg)\n\n\
  **图 7.8**\n\n上面的截图展示了当前的文件结构。\n\n2.  完成后，现在我们必须将 Redux 集成到我们的应用中。我们使用特殊的 `pages/_app.js`（实际上是\
  \ `_app.tsx`）文件来实现这一点。现在我们来讨论一下。\n\n### _app.js 文件\n\n根据文档：\n\n*   `Next.js` 使用\
  \ `App` 组件来初始化页面\n*   要覆盖，请创建 `./pages/_app.js` 文件并覆盖 `App` 类\n\n基本上，这个文件允许你覆盖 `Next.js`\
  \ 用于提供页面的一些默认配置。由于我们希望 Redux 在每个页面上都可用，我们可以将 Redux 的 Provider（就像我们包装 Context API\
  \ provider 一样）包装在这个特定文件中。\n\n因为我们使用的是 TypeScript，所以我们将创建一个名为 `_app.tsx` 的文件。让我们继续创建它：\n\
  \n\n\n\n\n```\n// pages/_app.tsx\n\nimport React from 'react'\nimport { createStore,\
  \ Store, compose } from 'redux'\nimport { Provider } from 'react-redux'\nimport\
  \ withRedux from 'next-redux-wrapper'\nimport reducer, { State } from '../redux/reducer'\n\
  import { NextPage } from 'next'\nimport { NextComponentType, NextPageContext } from\
  \ 'next/dist/next-server/lib/utils'\n\nlet devTools = (f: any) => f\n\nif(process.browser)\
  \ {\n  const _window = window as any\n  if(_window.__REDUX_DEVTOOLS_EXTENSION__)\
  \ {\n    devTools = _window.__REDUX_DEVTOOLS_EXTENSION__()\n  }\n}\n\nconst makeStore\
  \ = (initialState: State) => {\n  return createStore(reducer, initialState, compose(devTools))\n\
  }\n\ntype Props = {\n  Component: NextComponentType<NextPageContext>,\n  pageProps:\
  \ any,\n  store: Store\n}\n\nconst MyApp: NextPage<Props> = props => {\n  const\
  \ { Component, pageProps, store } = props\n  return (\n    <Provider store={store}>\n\
  \      <Component {...pageProps} />\n    </Provider>\n  )\n}\n\nexport default withRedux(makeStore)(MyApp)\n\
  ```\n\n让我们来看看这个文件中发生了什么：\n\n*   我们从 `redux` 包中导入了 `createStore` 和 `Store`。`Store`\
  \ 是我们将要使用的 store 的接口。\n*   我们获取了 `withRedux` 高阶组件（HOC）。\n*   然后我们注册了 redux devtools\
  \ 以确保其正常工作。为此，你必须在浏览器中安装 Redux DevTools Chrome 扩展。你可以在扩展商店免费找到它。\n*   接着，我们像编写一个普通的\
  \ Next 页面一样编写文件，并带有类型化的 props。\n*   看到我们从 `MyApp` 的 props 中解构了 `Component`、`pageProps`\
  \ 和 `store` 吗？这是因为这个文件在每次页面发送之前由 `Next.js` 运行，你可以在页面渲染（或发送）之前对其进行修改。\n*   我们只是将原本要发送的原始\
  \ `Component` 包裹在 react-redux 包提供的 `Provider` 组件中。\n*   `next-redux-wrapper` 包在底层初始化了客户端和服务端的\
  \ store，并处理了技术细节。\n\n此时，如果你查看你的应用程序，并下载 Chrome 的 Redux DevTools 扩展，在 Chrome DevTools\
  \ 中，你应该会看到 Redux 正在工作，并且你会得到一个空的 redux 用户 store：\n\n![](img/image92.jpg)\n\n**图\
  \ 7.9**\n\n上面的截图展示了我们在应用中集成 Redux 的情况。\n\n完成这些后，让我们回到应用逻辑，并在其中使用 Redux。你可以看到 Redux\
  \ 使用我们 reducer 的名称（本例中为 user）作为 store 的名称。\n\n### 派发 Redux Actions\n\n为了改变 Redux\
  \ store 中的状态，我们需要派发 actions。Actions 通知 Redux 条件发生了变化，状态应该以某种方式被修改。然而，并非每次派发都必须更新状态。让我们创建一个名为\
  \ `redux/actions.ts` 的新文件，其中包含以下代码：\n\n```\nimport { UserDetails } from './reducer'\n\
  \nexport const setUserDetails = (payload: UserDetails) => {\n  return { type: 'SET_USER_DETAILS',\
  \ payload }\n}\n```\n\n现在，我们将在根页面中使用这个 action。让我们将 `pages/index.tsx` 更新为以下内容：\n\n\
  ```\nimport React, { useState } from 'react'\nimport { NextPage } from 'next'\n\
  import './styles.css'\nimport { connect } from 'react-redux'\nimport { setUserDetails\
  \ } from '../redux/actions'\n\ntype Props = {\n  setUserDetails(json: any): void\n\
  \  name?: string\n}\n\nconst IndexPage: NextPage<Props> = (props) => {\n  const\
  \ [username, setUsername] = useState<string>('')\n  const [password, setPassword]\
  \ = useState<string>('')\n\n  async function submitForm() {\n    const req = await\
  \ fetch('/api/login', {\n      method: 'POST',\n      headers: {\n        'Content-Type':\
  \ 'application/json'\n      },\n      body: JSON.stringify({ username, password\
  \ })\n    })\n    const json = await req.json()\n    console.log(json)\n    props.setUserDetails(json.data)\n\
  \  }\n\n  return (\n    <form method=\"POST\">\n      <div className=\"box\">\n\
  \        <h1>Login</h1>\n        {props.name || 'na'}\n        <input type=\"text\"\
  \ placeholder=\"Username\" className=\"field\" value={username} onChange={e => setUsername(e.target.value)}\
  \ />\n        <input type=\"password\" placeholder=\"Password\" className=\"field\"\
  \ value={password} onChange={e => setPassword(e.target.value)} />\n        <div\
  \ className=\"btn\" onClick={submitForm}>Sign In</div>\n      </div>\n    </form>\n\
  \  )\n}\n\nconst mapStateToProps = ({ user }: any) => {\n  return {\n    name: user\
  \ && user.name\n  }\n}\n\nexport default connect(mapStateToProps, { setUserDetails\
  \ })(IndexPage)\n```\n\n那么，这个文件中发生了什么？让我们看看：\n\n*   我们导入了刚刚创建的 `action` 函数。\n* \
  \  登录时，我们现在调用一个以某种方式作为组件 props 接收到的函数。怎么做到的？我们马上会看到。\n*   然后我们创建了一个叫做 `mapStateToProps`\
  \ 的东西。对于 Redux，我们可以从中央 store 中提取我们想要的某些值。还记得我们的 reducer 名称是 user 吗？我们解构（ES6 解构）了\
  \ user reducer，并尝试提取 name 属性（如果存在的话）。\n*   最后，我们导出了组件，但不是直接导出 `IndexPage`，而是将其包裹在一个高阶组件中。第一个参数是我们创建的\
  \ `mapStateToProps`。第二个参数是我们传递的方法，这些方法将在我们的 props 中可用。当你调用这些方法时，这些方法的返回值会被派发到 Redux\
  \ store。现在，其中一个 reducer 会捕获该 action（通过其 type），并相应地更新状态。\n\n现在你会看到，当我们使用正确的凭据（用户名和密码均为\
  \ admin）登录时，我们的名字会替换在登录表单中，如果你检查 Redux DevTools，你会看到相应的 action 也被派发了，从而更新了 Redux\
  \ 状态：\n\n![](img/image16.jpg)\n\n**图 7.10**\n\n上面的截图展示了正确地向我们的 Redux store 派发了一个\
  \ action。\n\n但即使对于这个页面，我们还可以做更多！当 React 引入 hooks 时，Redux 也很快引入了 hooks 支持！因此，我们可以直接使用提供的\
  \ Redux hooks 从 store 中获取所需的值，而不是使用 `connect` 函数将中央 store 与组件连接起来。\n\n类似地，如果我们想要派发\
  \ actions，我们也可以通过 Redux 提供的 dispatcher（通过 hook）来派发它们。让我们修改上面的文件，改用 hooks。\n\n###\
  \ useSelector 和 useDispatch\n\n这两个 hooks 允许我们在 React 中使用 hooks 来使用 Redux（几乎就像你使用\
  \ `useContext` 一样）。让我们看看上面的文件如何用 hooks 编写：\n\n```\nimport React, { useState } from\
  \ 'react'\nimport { NextPage } from 'next'\nimport './styles.css'\nimport { useSelector,\
  \ useDispatch } from 'react-redux'\nimport { setUserDetails } from '../redux/actions'\n\
  \nconst IndexPage: NextPage = () => {\n  const dispatch = useDispatch()\n  const\
  \ name = useSelector((state: any) => state.user && state.user.name)\n  const [username,\
  \ setUsername] = useState<string>('')\n  const [password, setPassword] = useState<string>('')\n\
  \n  async function submitForm() {\n    const req = await fetch('/api/login', {\n\
  \      method: 'POST',\n      headers: {\n        'Content-Type': 'application/json'\n\
  \      },\n      body: JSON.stringify({ username, password })\n    })\n    const\
  \ json = await req.json()\n    console.log(json)\n    dispatch(setUserDetails(json.data))\n\
  \  }\n\n  return (\n    <form method=\"POST\">\n      <div className=\"box\">\n\
  \        <h1>Login</h1>\n        {name || 'na'}\n        <input type=\"text\" placeholder=\"\
  Username\" className=\"field\" value={username} onChange={e => setUsername(e.target.value)}\
  \ />\n        <input type=\"password\" placeholder=\"Password\" className=\"field\"\
  \ value={password} onChange={e => setPassword(e.target.value)} />\n        <div\
  \ className=\"btn\" onClick={submitForm}>Sign In</div>\n      </div>\n    </form>\n\
  \  )\n}\n\nexport default IndexPage\n```\n\n以下是发生的事情：\n\n\n\n\n*   显然，我们可以看到这段代码比上面的代码更简洁、更清晰，而且我们避免了在主组件上方不使用高阶组件（HoC）时产生的额外组件层级。\n\
  \n*   `useDispatch()` 钩子只是返回一个 dispatch 函数，我们需要用它来包裹我们的 dispatch 方法。请记住，`setUserDetails`\
  \ 函数实际上返回一个普通对象，而我们实际上只是将第一个参数作为一个普通 JSON 对象传递给 dispatch。我们之前不需要调用 dispatch 的原因是因为当我们将其传递给\
  \ `connect` 方法时，Redux 在底层已经完成了这项工作。\n\n*   `useSelector()` 钩子允许你传入一个函数，该函数可以过滤出你想要提取的值。`useSelector()`\
  \ 默认在变化时执行浅比较，如果浅比较检测到任何变化，就会重新渲染组件。就我们目前的情况而言，我们的 user 对象从 null 变为一个定义明确的对象，所以应该没问题。\n\
  \n现在，如果我们查看输出，应该没有任何区别，一切正常。这就是我们如何在 React + Redux 中使用钩子的方式。\n\n### 创建仪表盘页面\n\n\
  让我们继续在 `pages/` 目录下创建一个包含 `dashboard/index.tsx` 文件的仪表盘页面。文件结构如下所示：\n\n![](img/image34.jpg)\n\
  \n**图 7.11**\n\n上面的截图显示了当前的文件结构。\n\n我们暂时保持仪表盘页面简单，只需在 `dashboard/index.tsx` 文件中放入以下代码：\n\
  \n```\nimport React from ‘react’\nimport { NextPage } from ‘next’\nimport { useSelector\
  \ } from ‘react-redux’\n\nconst DashboardPage: NextPage = () => {\n  const user\
  \ = useSelector((state: any) =>state.user)\n  if(!user) return <p>User not available</p>\n\
  \  return (\n    <div id=”dashboard”>\n      <h1>Hello {user.name}</h1>\n      <p>Your\
  \ favorite quote: {user.favQuote}</p>\n    </div>\n  )\n}\n\nexport default DashboardPage\n\
  ```\n\n好了！现在该将用户重定向到 `/dashboard` 路由了，但仅在登录正确时进行。让我们更新 `pages/index.tsx` 文件。\n\n\
  ### 条件路由\n\n为了有条件地将用户重定向到不同的页面，我们将使用 `next/router` 中的 Router 包。让我们继续使用它：\n\n```\n\
  // pages/index.tsx\nimport React, { useState } from ‘react’\nimport { NextPage }\
  \ from ‘next’\nimport ‘./styles.css’\nimport { useSelector, useDispatch } from ‘react-redux’\n\
  import { setUserDetails } from ‘../redux/actions’\nimport Router from ‘next/router’\n\
  \nconst IndexPage: NextPage = () => {\n  const dispatch = useDispatch()\n  const\
  \ name = useSelector((state: any) =>state.user&& state.user.name)\n  const [username,\
  \ setUsername] = useState<string>(‘’)\n  const [password, setPassword] = useState<string>(‘’)\n\
  \n  async function submitForm() {\n    const req = await fetch(‘/api/login’, {\n\
  \      method: ‘POST’,\n      headers: {\n        ‘Content-Type’: ‘application/json’\n\
  \      },\n      body: JSON.stringify({ username, password })\n    })\n    const\
  \ json = await req.json()\n    if(json.status === ‘ok’) {\n      dispatch(setUserDetails(json.data))\n\
  \      `Router.push(‘/dashboard’)`\n    } else {\n      alert(‘Incorrect Login’)\n\
  \    }\n  }\n\n  return (\n    <form method=”POST”>\n      <div className=”box”>\n\
  \        <h1>Login</h1>\n        {name || ‘na’}\n        <input type=”text” placeholder=”Username”\
  \ className=”field” value={username} onChange={e =>setUsername(e.target.value)}\
  \ />\n        <input type=”password” placeholder=”Password” className=”field” value={password}\
  \ onChange={e =>setPassword(e.target.value)} />\n        <div className=”btn” onClick={submitForm}>Sign\
  \ In</div>\n      </div>\n    </form>\n  )\n}\n\nexport default IndexPage\n```\n\
  \n现在，当你使用正确的凭据登录时，应该会看到类似这样的内容：\n\n![](img/image83.jpg)\n\n**图 7.12**\n\n上面的截图显示了仪表盘页面的样子。\n\
  \n当你刷新页面时，应该会看到消息 `User not found`，这在逻辑上是正确的，因为我们没有持久化 Redux 存储，也没有尝试检查用户是否已登录应用程序，如果已登录则检索用户数据。我们稍后会修复这个问题。\n\
  \n首先，让我们看看嵌套路由。\n\n### 嵌套路由\n\n让我们从一个简单的用例开始。我们已经创建了顶级路径（例如 `/home` 或 `/about` 等），但是\
  \ `/home/page-x` 呢？实际上，在 `Next.js` 中，这就像将文件夹嵌套在一起一样简单。让我们创建以下文件：\n\n`pages/path1/path2/path3.tsx`\n\
  \n并在其中写入以下代码：\n\n```\nimport React from ‘react’\nimport { NextPage } from ‘next’\n\
  \nconst PathPage: NextPage = () => {\n  return (\n    <h1>Hello from very deep inside!</h1>\n\
  \  )\n}\n\nexport default PathPage\n```\n\n让服务器应用更改，当你访问 `http://localhost:3000/path1/path2/path3`\
  \ 时，你应该能够看到以下内容：\n\n![](img/image53.jpg)\n\n**图 7.13**\n\n上面的截图展示了浏览器中嵌套路由的示例。\n\
  \n你还需要了解的另一件事是，你可以将 `path3` 创建为文件夹，并将上述代码放在 `path3/index.tsx` 中，效果是一样的。在 Next.js\
  \ 9+ 中，我们还支持动态路由。让我们看看它是什么以及如何工作。\n\n### 动态路由\n\nNext.js 最近引入了动态路由，这为匹配大量 URL 打开了大门，而不仅仅是我们在\
  \ `pages` 目录中一直使用的静态路由。让我们在 `pages/` 目录中创建一个名为 `users/index.tsx` 的文件。我们还将创建一个名为\
  \ `users/[param].tsx` 的文件。以下是两者的代码：\n\n```\n// pages/users/index.tsx\nimport React\
  \ from ‘react’\nimport { NextPage } from ‘next’\n\nconst UsersPage: NextPage = ()\
  \ => {\n  return (\n    <h1>Just a regular file</h1>\n  )\n}\n\nexport default UsersPage\n\
  ```\n\n以及另一个文件：\n\n```\n// pages/users/[param].tsx\nimport React from ‘react’\n\
  import { NextPage } from ‘next’\n\nconst UsersPageDynamic: NextPage = () => {\n\
  \  return (\n    <h1>Just a regular file too</h1>\n  )\n}\n\nexport default UsersPageDynamic\n\
  ```\n\n现在，当你访问 `http://localhost:3000/users` 时，你会看到这个页面：\n\n![](img/image123.jpg)\n\
  \n**图 7.14**\n\n但是，如果你访问任何其他匹配 `/users/<anything here>` 的路由，你会看到这个：\n\n![](img/image44.jpg)\n\
  \n**图 7.15**\n\n但我们知道我们没有名为 `users/abcd` 的文件。那么，这里发生了什么？\n\n*   当你用方括号命名文件时（就像我们对\
  \ `[param].tsx` 所做的那样），这意味着 `Next.js` 会将其视为匹配任何放在不同路由下的内容。\n\n*   那么文件名呢？实际上，我们可以使用参数（即文件名）来提取有关路由的信息。让我们修改\
  \ `[param].tsx` 文件以更好地反映这一点：\n\n    ```\n    // pages/users/[param].tsx\n    import\
  \ React from ‘react’\n    import { NextPage } from ‘next’\n    import { useRouter\
  \ } from ‘next/router’\n\n    const UsersPageDynamic: NextPage = () => {\n     \
  \ const router = useRouter()\n      console.log(router)\n      return (\n      \
  \  <h1>Just a regular file too {router.query.param}</h1>\n      )\n    }\n\n   \
  \ export default UsersPageDynamic\n    ```\n\n有了这个，如果我访问 URL `http://localhost:3000/users/mehul`，我应该在控制台中看到以下内容：\n\
  \n![](img/image132.jpg)\n\n**图 7.16**\n\n让我们讨论一下为什么会这样：\n\n*   你可以看到，在 URL 中，`param`\
  \ 的值是 `mehul`，这反映在屏幕上，因为使用了 `router.query.param`。\n\n*   在右侧的控制台中，我们可以获取 `useRouter`\
  \ 钩子返回的所有信息。我们可以看到 `param` 是 `query` 属性中的其中之一。这直接来自文件名。如果你将文件命名为其他名称，它也会是其他名称。\n\
  \n\n\n\n好的。现在我们了解了动态路由，就能更轻松地处理像创建社交媒体网站这样的用例——你可以在 URL 中访问任何人的个人资料。接下来，让我们在我们的应用中快速实现一个注册页面。\n\
  \n### 注册页面\n\n让我们使用 `Next.js` 创建一个路径 `/register`：\n\n```typescript\n// pages/register/index.tsx\n\
  import React, { useState } from 'react'\nimport { NextPage } from 'next'\nimport\
  \ './styles.css'\nimport { useDispatch } from 'react-redux'\nimport { setUserDetails\
  \ } from '../../redux/actions'\nimport Router from 'next/router'\n\nconst RegisterPage:\
  \ NextPage = () => {\n  const dispatch = useDispatch()\n  const [username, setUsername]\
  \ = useState<string>('')\n  const [password, setPassword] = useState<string>('')\n\
  \  const [name, setName] = useState<string>('')\n  const [age, setAge] = useState<string>('')\n\
  \  const [quote, setQuote] = useState<string>('')\n\n  async function submitForm()\
  \ {\n    const req = await fetch('/api/register', {\n      method: 'POST',\n   \
  \   headers: {\n        'Content-Type': 'application/json'\n      },\n      body:\
  \ JSON.stringify({ username, password, name, age, quote })\n    })\n    const json\
  \ = await req.json()\n    if(json.status === 'ok') {\n      dispatch(setUserDetails(json.data))\n\
  \      Router.push('/dashboard')\n    } else {\n      alert('Error Registering')\n\
  \    }\n  }\n\n  return (\n    <form method=\"POST\">\n      <div className=\"box\"\
  >\n        <h1>Register</h1>\n        <input type=\"text\" placeholder=\"Username\"\
  \ className=\"field\" value={username} onChange={e => setUsername(e.target.value)}\
  \ />\n        <input type=\"text\" placeholder=\"Name\" className=\"field\" value={name}\
  \ onChange={e => setName(e.target.value)} />\n        <input type=\"text\" placeholder=\"\
  Age\" className=\"field\" value={age} onChange={e => setAge(e.target.value)} />\n\
  \        <input type=\"text\" placeholder=\"Fav. Quote\" className=\"field\" value={quote}\
  \ onChange={e => setQuote(e.target.value)} />\n        <input type=\"password\"\
  \ placeholder=\"Password\" className=\"field\" value={password} onChange={e => setPassword(e.target.value)}\
  \ />\n        <div className=\"btn\" onClick={submitForm}>Register</div>\n     \
  \ </div>\n    </form>\n  )\n}\n\nexport default RegisterPage\n```\n\n在这里，我们只是从用户那里获取所有需要的信息，并将其发送到我们的\
  \ API 后端。\n\n然后我们直接从 `IndexPage` 复制粘贴样式：\n\n```css\n// pages/register/styles.css\n\
  * {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n  outline: 0;\n}\n\n\
  body {\n  font-family: 'Open Sans', sans-serif;\n  background: #3498db;\n  margin:\
  \ 0 auto 0 auto;\n  width: 100%;\n  text-align: center;\n  margin: 20px 0px 20px\
  \ 0px;\n}\n\np {\n  font-size: 12px;\n  text-decoration: none;\n  color: #ffffff;\n\
  }\n\nh1 {\n  font-size: 1.5em;\n  color: #525252;\n}\n\n.box {\n  background: white;\n\
  \  width: 300px;\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  transform:\
  \ translate(-50%, -50%);\n  border-radius: 6px;\n  padding: 20px;\n  box-shadow:\
  \ 0 0 5px black;\n}\n\n.field {\n  background: #ecf0f1;\n  border: #ccc 1px solid;\n\
  \  border-bottom: #ccc 2px solid;\n  padding: 8px;\n  width: 100%;\n  color: #AAA;\n\
  \  margin-top: 10px;\n  font-size: 1em;\n  border-radius: 4px;\n}\n\n.btn {\n  background:\
  \ #2ecc71;\n  width: 100%;\n  cursor: pointer;\n  padding: 5px 0;\n  color: white;\n\
  \  border-radius: 4px;\n  border: #27ae60 1px solid;\n  margin-top: 20px;\n  font-weight:\
  \ 800;\n  font-size: 0.8em;\n}\n\n.btn:hover {\n  background: #2CC06B;\n}\n```\n\
  \n现在让我们创建 `api/register` 端点：\n\n```typescript\n// api/register/index.ts\nimport\
  \ { NextApiRequest, NextApiResponse } from 'next'\nimport methods from './userlist'\n\
  \nexport default async (req: NextApiRequest, res: NextApiResponse) => {\n  const\
  \ { username, password, name, age, favQuote } = req.body\n  if(!methods.doesUserExist(username))\
  \ {\n    methods.addUser(username, password, { name, age, favQuote })\n    return\
  \ res.json({ status: 'ok', data: { name, age, favQuote } })\n  } else {\n    return\
  \ res.json({ status: 'error', message: 'User already registered' })\n  }\n}\n```\n\
  \n在这里，你可以看到我使用了一个名为 `userlist.ts` 的文件，并通过它调用一些工具函数。在真实网站中，这实际上会是一个数据库，但为了简单起见，我们可以使用一个内存中的数据结构（一个\
  \ JS 对象）来临时存储注册信息。\n\n`userlist.ts` 文件的内容如下：\n\n```typescript\ntype DataType = {\n\
  \  name: string\n  age: string\n  favQuote: string\n}\n\ntype UserType = {\n  username:\
  \ string\n  password: string\n  data: DataType\n}\n\nconst users: UserType[] = []\n\
  \nconst methods = {\n  getUsers(): UserType[] {\n    return users\n  },\n  doesUserExist(username:\
  \ string): boolean {\n    return !!users.find(user => user.username === username)\n\
  \  },\n  addUser(username: string, password: string, data: DataType) {\n    users.push({\
  \ username, password, data })\n    return true\n  }\n}\n\nexport default methods\n\
  ```\n\n这个文件不言自明。我们暴露了一系列方法来操作我们在用户数组中维护的动态用户列表。由于 Node 的导出是单例的（即对同一文件的多次导入指向内存中的同一个\
  \ `object/array`），我们可以预期它是一致的。\n\n好了！现在我们可以继续在前端注册一些带有自定义引言的账户了！作为练习，尝试进一步完善这个应用，包括在所有页面上进行身份验证检查，并在用户登录时获取数据。\n\
  \n## 结论\n\n在本章中，我们花了必要的时间深入 `Next.js` 生态系统。我们还深入研究了 `Redux`，将 `redux` 与 `Next.js`\
  \ 集成，使用 `Next` 进行路由，以及如何在不脱离 `Next.js` 框架的情况下创建 API。现在我们掌握了足够的知识，可以用 `Next.js` 创建从基础到中等复杂度的服务端渲染后端。在下一章中，我们将进一步了解在渐进式\
  \ Web 应用领域，使用 `React` 技术可以实现哪些功能。\n\n## 问题\n\n1.  `TypeScript` 和 `JavaScript` 有什么区别？所有有效的\
