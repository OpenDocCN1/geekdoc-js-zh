  \n5.  `Redux` 中的 `reducer` 是什么意思？\n\n6.  `_app.js` 文件的作用是什么？`Next.js` 中还有另一个名为 `_document.js`\
  \ 的文件。你能找出它的作用吗？\n\n7.  嵌套路由和动态路由有什么区别？在 `Next v9.x` 中，动态路由可以嵌套吗？\n\n# 第 8 章\n\n\
  ## 渐进式 Web 应用\n\n在上一章中，我们学习了 `Next.js` 技术，以及它如何推动当今 `React` 的 `SSR` 世界。当 Web 应用遇到原生应用时，一种不同类型的应用诞生了，那就是渐进式\
  \ Web 应用。在本章中，我们将全面了解 `PWA`，并学习如何使用 `React` 作为主要前端库来创建一个 PWA。\n\n### 结构\n\n*   什么是\
  \ `渐进式 Web 应用`（`PWA`）\n*   `PWA` 入门\n*   `manifest.json` 文件\n*   服务工作线程\n*   使用\
  \ `Next.js` 的 `PWA`\n*   使用 `Next.js` 的自定义服务器\n\n### 目标\n\n在本章中，我们的主要目标是理解什么是渐进式\
  \ Web 应用，以及如何将它们集成到我们的 `React` 和 `Next.js` 项目中。在此过程中，我们将进一步了解这些技术。\n\n### 什么是渐进式\
  \ Web 应用？\n\n渐进式 Web 应用本质上仍然是 Web 应用，但更胜一筹。它利用现代 Web 功能来提供出色的用户体验，类似于使用原生应用时的体验。渐进式\
  \ Web 应用的一些特性：\n\n1.  响应式：显然，你的应用应该适配所有屏幕和尺寸。幸运的是，如今创建一个响应式网站（或将现有网站转换为响应式设计）并不太难，除非代码非常陈旧。\n\
  \n\n\n\n2. 独立于互联网：你的 PWA 将使用称为服务工作线程（稍后详细介绍）的东西，使其能够在离线或低速互联网连接下工作。\n\n3. HTTPS：PWA\
  \ 仅适用于 HTTPS。\n\n4. 可安装：你的 PWA 可以像普通应用一样安装在手机上（以及作为 Chrome 浏览器应用）。\n\n5. 可链接：可以通过一个简单的\
  \ URL 分享。\n\n#### Hello World\n\n让我们使用`create-react-app`创建一个新的 React 项目，并开始实现我们的\
  \ PWA。我们将从使用 TypeScript 的简单方式开始：\n\n`create-react-app pwa-app --typescript`\n\n\
  一旦准备就绪，我们将看到类似这样的文件结构：\n\n![](img/image64.jpg)\n\n**图 8.1**\n\n让我们看看`src/index.tsx`文件中以下加粗的行：\n\
  \n```\nimport React from ‘react’;\nimport ReactDOM from ‘react-dom’;\nimport ‘./index.css’;\n\
  import App from ‘./App’;\nimport * as serviceWorker from ‘./serviceWorker’;\nReactDOM.render(<App\
  \ />, document.getElementById(‘root’));\n// If you want your app to work offline\
  \ and load faster, you can change\n// unregister() to register() below. Note this\
  \ comes with some pitfalls.\n// Learn more about service workers: https://bit.ly/CRA-PWA\n\
  serviceWorker.unregister();\n```\n\n我们正在导入一个名为`serviceWorker`的文件。稍后我们会介绍服务工作线程是什么，但现在，让我们将`unregister`方法调用改为\
  \ register，并使用以下命令构建应用：\n\n`npm run build`\n\n这将在项目的根目录中创建一个`build`文件夹。现在，在此目录中运行一个简单的本地开发服务器。这取决于你安装的依赖项。如果你安装了\
  \ Python（macOS 和 Linux 默认安装），请在`build`文件夹中运行以下命令：\n\n`python -m SimpleHTTPServer\
  \ 1234 # for python 2`\n\n如果你使用的是`python3`，请使用以下 bash 命令：\n\n`python3 -m http.server\
  \ 1234`\n\n如果你安装了 PHP 命令行，也可以通过以下命令启动本地开发服务器：\n\n`php -S localhost:1234`\n\n确保在命令行中位于\
  \ build 文件夹内运行所有这些命令，因为它们将作为`http://localhost:1234`的根目录。\n\n现在，让我们继续访问站点`localhost:1234`。除了两件事之外，没有什么特别的。如果我们查看\
  \ Chrome 开发者工具中的**网络请求**选项卡，我们会看到一些特殊文件被请求，它们前面有一个齿轮图标（称为服务工作线程）：\n\n![](img/image54.jpg)\n\
  \n**图 8.2**\n\n另一件事是我们在 Chrome 的地址栏中看到一个小添加图标（**+**）：\n\n![](img/image103.jpg)\n\
  \n**图 8.3**\n\n点击它会弹出一个对话框，提示将此应用程序添加到 Chrome，就像我们在浏览器中安装某种应用程序一样！让我们添加它：\n\n![](img/image84.jpg)\n\
  \n**图 8.4**\n\n安装应用后，它是一个独立的应用程序，你可以在 Chrome 应用文件夹中看到。双击该应用实际上会打开一个单独的窗口，其中我们看到相同的应用，但这次感觉就像在运行一个真正的桌面应用程序，而不是一个网站或网页\
  \ URL。这是一个渐进式 Web 应用的非常基本的例子。\n\n现在，虽然我们在 localhost 上运行，但如果你将此网站部署到在线某处（需要 HTTPS），并像我们一样使用（**+**）图标添加应用，你会看到你的应用即使在没有互联网的情况下也能工作！我们很快就会看到这是如何发生的，现在我们将进一步了解\
  \ PWA：\n\n![](img/image17.jpg)\n\n**图 8.5**\n\n#### manifest.json 文件\n\n在 public\
  \ 文件夹中，有一个名为`manifest.json`的文件，它是一个简单的 JSON 文件，描述了我们安装的 PWA 的一些属性。你可以看到我们使用以下代码行将`manifest.json`包含在`index.html`文件中：\n\
  \n`<link rel=”manifest” href=”%PUBLIC_URL%/manifest.json” />`\n\n而`manifest.json`文件内容如下：\n\
  \n```\n{\n  “short_name”: “React App”,\n  “name”: “Create React App Sample”,\n \
  \ “icons”: [\n    {\n      “src”: “favicon.ico”,\n      “sizes”: “64x64 32x32 24x24\
  \ 16x16”,\n      “type”: “image/x-icon”\n    },\n    {\n      “src”: “logo192.png”,\n\
  \      “type”: “image/png”,\n      “sizes”: “192x192”\n    },\n    {\n      “src”:\
  \ “logo512.png”,\n      “type”: “image/png”,\n      “sizes”: “512x512”\n    }\n\
  \  ],\n  “start_url”: “.”,\n  “display”: “standalone”,\n  “theme_color”: “#000000”,\n\
  \  “background_color”: “#ffffff”\n}\n```\n\n让我们快速浏览这些属性：\n\n*   `short_name`/`name`：用于命名你的应用程序。至少必须指定其中一个（可以同时指定两者）。如果同时指定，`short_name`将用于空间有限的地方，例如工具栏（你可以在上面的截图中看到，工具栏显示的是标题\
  \ React App，而不是 Create React App Sample）。\n\n*   `icons`：正如属性名所说，这些是用于你的应用程序的图标，也是最终用户看到的图标。\n\
  \n*   `start_url`：此 URL 是应用程序启动时应打开的 URL。通常，你只需将其保留为根 URL，或者可以传入一些查询参数来跟踪应用程序何时被打开。例如，传入`/?utm_source=app_opened`可以让你跟踪\
  \ PWA 被打开的次数。\n\n*   `display`：这允许你设置应用程序的启动方式。因为 PWA 毕竟是一个 Web 应用，它只在浏览器实例中启动。以下是可用的值及其作用：\n\
  \n| **值** | **描述** |\n| --- | --- |\n| `fullscreen` | 以全屏模式打开应用 |\n| `standalone`\
  \ | 以类似原生应用窗口的方式打开应用 |\n| `minimal-ui` | 类似于全屏，但提供更多用于控制导航的 UI 元素 |\n| `browser`\
  \ | 在浏览器中打开你的 URL |\n\n如果你想要我们刚才看到的“添加到主屏幕”提示，你的 display 值应仅设置为 standalone：\n\n\
  *   `theme_color`：这是应用程序工具栏的颜色。\n\n*   `background_color`：这是应用启动时的启动屏幕背景颜色（适用于手机）。\n\
  \n实际上，你可以使用在线工具（如[`app-manifest.firebaseapp.com/`](https://app-manifest.firebaseapp.com/)）轻松生成自己的`manifest.json`文件。\n\
  \n#### 服务工作线程\n\n将服务工作线程视为位于应用程序和网络层之间的 JavaScript 文件。这意味着，每当你的浏览器尝试连接到网络（你拥有的 URL）时，都会经过一个服务工作线程文件。类似地，当网络（你的服务器）返回响应时，该响应在到达你的应用程序之前也会经过服务工作线程。\n\
  \n需要注意的重要一点是，服务工作线程与 Web Worker 一样，在单独的线程中运行（这并不意味着 JS 是多线程的），因此你的 UI 永远不会被阻塞。\n\
  \n#### 生命周期\n\n这是一张很好的图片，展示了服务工作线程的生命周期：\n\n![](img/image74.jpg)\n\n**图 8.6**\n\n\
  在我们的例子中，一旦服务工作线程被激活，它就会开始获取静态资源，并开始缓存它们以供本地/离线使用。\n\n让我们看看我们的`build`文件夹。在`build`文件夹中，有一个名为`service-worker.js`的文件，它在顶部导入了以下两个脚本：\n\
  \n```\nimportScripts(“https://storage.googleapis.com/workbox-cdn/releases/4.3.1/workbox-sw.js”);\n\
  importScripts(\n  “/precache-manifest.01aeacade56ec22296e752a5407421fc.js”\n);\n\
  ```\n\n第一个脚本是 Workbox 脚本。Workbox 是 Google 在现有原始 PWA API 之上构建的一组 JavaScript 库，用于提供灵活的方法和方式来实现\
  \ PWA 中的缓存等功能，并消除了大量样板代码。\n\n第二个脚本是由`create-react-app`生成的文件，如果你打开它，你会看到它包含你的应用程序正在使用的静态资源（HTML\
  \ 文件、CSS 文件、JavaScript 文件和图像）及其绝对 URL 路径。最后，`service-worker.js`文件包含以下代码片段：\n\n\n\
  \n\n```\nself.__precacheManifest = [].concat(self.__precacheManifest || []);\nworkbox.precaching.precacheAndRoute(self.__precacheManifest,\
  \ {});\nworkbox.routing.registerNavigationRoute(workbox.precaching.getCacheKeyForURL(\"\
  /index.html\"), {\nblacklist: [/^\\/_/,/\\/[^\\/?]+\\.[^\\/]+$/],\n});\n```\n\n\
  简而言之，这段脚本将 `precache-manifest` 文件中描述的所有路由注册到 Service Worker，并指示其缓存这些资源。由于 React\
  \ 应用本质上是**单页应用**（**SPA**），我们使用 `workbox.routing` API 的 `registerNavigationRoute`\
  \ 方法，将 `index.html` 文件发送到用户访问应用时触发的任何路由上。这样，React 就能重新接管路由系统，并使用 `react-router`\
  \ 或任何现有实现进行必要的内部路由。\n\n### 使用 Next.js 实现 PWA\n\n现在，我们对 PWA 是什么以及其基本工作原理有了不错的理解，接下来将重点讨论如何使用\
  \ `Next.js` 实现 PWA。\n\n首先，创建一个简单的 `Next.js` 项目。你可以像前几章那样手动设置 `Next.js`，也可以直接使用方便的\
  \ `create-next-app` 工具，如下所示：\n\n![](img/image93.jpg)\n\n**图 8.7**\n\n这基本上会像之前一样初始化我们的设置。完成后，我们需要安装另一个名为\
  \ `next-offline` 的包。这将为我们的应用启用 Service Worker 支持，并最终支持 PWA。\n\n`npm install --save\
  \ next-offline`\n\n这将安装 `next-offline` 包。完成后，在项目中创建一个名为 `next.config.js` 的新文件，并在其中写入以下内容：\n\
  \n```\n// next.config.js\nconstwithOffline = require('next-offline')\nconstnextConfig\
  \ = {}\nmodule.exports = withOffline(nextConfig)\n```\n\n`next-offline` 包使用了大量默认配置，默认情况下我们可以安全地沿用这些配置。基本上，`withOffline`\
  \ 函数的作用是：在准备 `Next.js` 的打包文件时，注入一个带有传入选项的 Service Worker 脚本。让我们使用 `npm run build`\
  \ 构建项目。在 `build` 文件夹中，我们会在 `main-<hash>.js` 文件中看到类似以下压缩片段：\n\n`navigator.serviceWorker.register(\"\
  /service-worker.js\",{scope:\"/\"}).then….`\n\n现在，就像我们之前对 React 应用所做的那样，我们需要提供 `service-worker.js`\
  \ 文件。别担心，我们不需要自己编写它，因为它同样是由 Next 自动创建的！但我们确实需要将其在 `/service-worker.js` URL 上提供，而且你知道，在\
  \ Next 中，静态文件是通过 `static` 目录提供的。\n\n虽然我们可以将 Service Worker 文件移动到 `static` 目录，并通过上述配置更改\
  \ Service Worker 的路径，但我们将继续尝试将所有对 `/service-worker.js` 的请求重定向到文件系统中的文件，并通过创建自定义服务器让\
  \ Next 处理其余请求。\n\n#### 自定义 Next.js 服务器\n\n在项目根目录创建一个名为 `server.js` 的文件，并在其中写入以下内容：\n\
  \n```\nconst { createServer } = require('http')\nconst { join } = require('path')\n\
  const { parse } = require('url')\nconst next = require('next')\nconst app = next({\
  \ dev: process.env.NODE_ENV !== 'production' })\nconst handle = app.getRequestHandler()\n\
  app.prepare()\n.then(() => {\ncreateServer((req, res) => {\nconstparsedUrl = parse(req.url,\
  \ true)\nconst { pathname } = parsedUrl\n// handle GET request to /service-worker.js\n\
  if (pathname === '/service-worker.js') {\nconstfilePath = join(__dirname, '.next',\
  \ pathname)\napp.serveStatic(req, res, filePath)\n} else {\nhandle(req, res, parsedUrl)\n\
  }\n})\n.listen(3000, () => {\nconsole.log('> Ready on http://localhost:${3000}')\n\
  })\n})\n```\n\n这段代码直接取自 Next 官方文档，但让我们看看这里发生了什么：\n\n*   由于此脚本由 `node` 直接执行，不会经过\
  \ `webpack` 或 `babel`，因此这里必须使用 CommonJS 导入。\n*   然后我们从 `http` 包中引入 Node 的 `createServer`\
  \ 方法来创建自定义服务器。\n*   我们还导入了 `next` 包。以下是 `next` API 的工作方式。\n\n##### next(config:\
  \ object)\n\n`config` 对象包含以下内容：\n\n*   `dev`：布尔值，表示开发/生产模式（`默认值：false`）\n*   `dir`：项目所在位置（`默认值：'.'`）\n\
  *   `quiet`：是否隐藏包含服务器信息的错误消息（`默认值：false`）\n*   `conf`：Next.js 配置对象（与从 `next.config.js`\
  \ 文件中读取的对象相同）\n\n这返回给我们一个 `app` 对象，该对象关联了一系列用于自定义路由的方法。不过我们只关注 `getRequestHandler`\
  \ 和 `serveStatic`。\n\n##### getRequestHandler()\n\n此方法基本上允许 Next 像默认方式一样处理路由，因此，当我们不希望执行自定义逻辑时，我们将使用\
  \ `createServer` 方法中适当的 `req` 和 `res` 对象调用此方法。\n\n它返回另一个函数 `handle`，可以使用来自服务器的请求和响应对象调用该函数。\n\
  \n##### serveStatic()\n\n我们使用另一个名为 `url` 的包将 URL 解析为不同部分——`hostname`、`pathname`、`protocol`、`port`\
  \ 等。\n\n最后，我们检查路径名是否与 `/service-worker.js` 匹配。如果匹配，则使用 `app.serveStatic()` 方法。基本上，我们传入\
  \ `req` 和 `res` 对象以及解析静态资源的路径。在我们的例子中，`service-worker.js` 文件作为直接子文件存在于 `.next` 文件夹中，因此我们直接使用\
  \ `path.join` 获取路径。\n\n完成后，我们还需要对 `package.json` 文件进行一些修改。JSON 文件中的 `scripts` 部分应如下所示：\n\
  \n```\n“scripts”: {\n“dev”: “node server.js”,\n“build”: “next build”,\n“start”:\
  \ “NODE_ENV=production node server.js”\n}\n```\n\n最后，像上次一样创建一个 `manifest.json` 文件，将其放在\
  \ `.next` 文件夹中，并为其添加自定义路由。因此 `manifest.json` 文件将如下所示：\n\n```\n{\n“short_name”: “React\
  \ App”,\n“name”: “Create React App Sample”,\n“icons”: [\n{\n“src”: “favicon.ico”,\n\
  “sizes”: “64x64 32x32 24x24 16x16”,\n“type”: “image/x-icon”\n},\n{\n“src”: “logo192.png”,\n\
  “type”: “image/png”,\n“sizes”: “192x192”\n},\n{\n“src”: “logo512.png”,\n“type”:\
  \ “image/png”,\n“sizes”: “512x512”\n}\n],\n“start_url”: “.”,\n“display”: “standalone”,\n\
  “theme_color”: “#000000”,\n“background_color”: “#ffffff”\n}\n```\n\n而我们的 `server.js`\
  \ 文件将如下所示：\n\n```\nconst { createServer } = require('http')\nconst { join } = require('path')\n\
  const { parse } = require('url')\nconst next = require('next')\nconst app = next({\
  \ dev: process.env.NODE_ENV !== 'production' })\nconst handle = app.getRequestHandler()\n\
  app.prepare()\n.then(() => {\ncreateServer((req, res) => {\nconstparsedUrl = parse(req.url,\
  \ true)\nconst { pathname } = parsedUrl\n// handle GET request to /service-worker.js\n\
  if (pathname === '/service-worker.js' || pathname === '/manifest.json' || pathname\
  \ === '/logo512.png' || pathname === '/logo192.png') {\nconstfilePath = join(__dirname,\
  \ '.next', pathname)\napp.serveStatic(req, res, filePath)\n} else {\nhandle(req,\
  \ res, parsedUrl)\n}\n})\n.listen(3000, () => {\nconsole.log('> Ready on http://localhost:${3000}')\n\
  })\n})\n```\n\n别忘了也将图标放在 `.next` 文件夹中！最后，为了提供 `manifest.json` 文件，我们需要在每个页面中将其作为\
  \ `link` 标签包含（就像上面 React 示例中那样）。让我们使用 `Next.js` 中的 `_document.js` 文件来实现。\n\n#####\
  \ _document.js\n\n\n\n\n\n`pages`文件夹内的这个文件允许我们在各个位置（如页面头部）注入自定义标记。我们将使用以下文件来注入`manifest.json`：\n\
  \n```javascript\n// pages/_document.js\nimport Document, { Html, Head, Main, NextScript\
  \ } from 'next/document'\nclass MyDocument extends Document {\n  static async getInitialProps(ctx)\
  \ {\n    constinitialProps = await Document.getInitialProps(ctx)\n    return { …initialProps\
  \ }\n  }\n  render() {\n    return (\n      <Html>\n        <Head>\n          <link\
  \ rel=\"manifest\" href=\"/manifest.json\" />\n        </Head>\n        <body>\n\
  \          <Main />\n          <NextScript />\n        </body>\n      </Html>\n\
  \    )\n  }\n}\nexport default MyDocument\n```\n\n就是这样！最终的文件结构如下所示：\n\n![](img/image35.jpg)\n\
  \n**图 8.8**\n\n现在我们可以继续运行`npm run build`和`npm start`来启动应用的生产构建。完成后，你会看到现在可以安装 PWA\
  \ 的选项：\n\n![](img/image26.jpg)\n\n**图 8.9**\n\n同样，在手机上，我们也能获得相同的体验：\n\n![](img/p192.jpg)\n\
  \n**图 8.10**\n\n## 结论\n\n在本章中，我们学习了渐进式 Web 应用，以及如何让我们的 React 和 Next 应用变得渐进式。我们还了解了如何在此过程中设置自定义的\
  \ Next.js 服务器。在下一章中，我们将总结一些 React 的最佳实践以及整个库的未来。\n\n## 问题\n\n1.  什么是 PWA？\n2.  PWA\
  \ 与原生应用或混合应用有何不同？\n3.  Service Worker 和 Web Worker 有什么区别？\n4.  在 Next.js 框架中，`_document.js`文件的作用是什么？\n\
  5.  自定义 Next.js 服务器与在 Next.js 中编程的自定义 API 端点有何不同？\n\n# 第 9 章\n\n## 前沿 React\n\n\
  自 2013 年发布以来，React 已经走过了很长的路。如今，React 拥有全球最大的开发者社区之一。就在我们说话的当下，React 也在不断改进和发展。本章将涵盖\
  \ React 的一些前沿特性，这些特性要么仍在开发中，要么在 React 框架中处于非常实验性的阶段，并且必将塑造框架和整个社区的未来。让我们深入探讨吧！\n\
  \n### 结构\n\n*   React 的工作原理\n    *   协调器\n    *   渲染器\n*   并发模式\n*   并发模式的工作原理\n\
  *   选择加入并发模式\n*   React Suspense\n\n### 目标\n\n在最后一章中，我们将看到 React 为未来所做的一些事情。并发模式是一个重要的特性，目前开发者可以实验性地尝试。我们将在本章中学习它。\n\
  \n### React 是如何工作的？\n\n在深入探讨新技术的基础之前，了解 React 的工作原理非常重要。从较高层次来看，React 由协调器和渲染器组成。协调器是\
  \ React 在其内存中处理 DOM 树虚拟实现的方式。让我们先看一个 vDOM 中的例子。\n\n### 协调器\n\n虚拟 DOM 是 React 在内存中维护浏览器向最终用户显示的原始\
  \ DOM 副本的方式。React 协调器仅在内存中处理这棵树的创建。请注意，这棵树仍然不知道它处于哪个环境中。例如，当你编写以下 JSX 代码时：\n\n```jsx\n\
  <div className=\"myClass\">\n  <h1>Hello World</h1>\n  <p>This is a nice paragraph</p>\n\
  </div>\n```\n\n这段代码会被 Babel 转译成以下内容：\n\n```javascript\nReact.createElement(\"div\"\
  , {\n  className: \"myClass\"\n}, React.createElement(\"h1\", null, \"Hello World\"\
  ), React.createElement(\"p\", null, \"This is a nice paragraph\"));\n```\n\n进一步，它在内存中表示为以下内容：\n\
  \n```json\n{\n  \"type\": \"div\",\n  \"key\": null,\n  \"ref\": null,\n  \"props\"\
  : {\n    \"className\": \"myClass\",\n    \"children\": [\n      {\n        \"type\"\
  : \"h1\",\n        \"key\": null,\n        \"ref\": null,\n        \"props\": {\n\
  \          \"children\": \"Hello World\"\n        }\n      },\n      {\n       \
  \ \"type\": \"p\",\n        \"key\": null,\n        \"ref\": null,\n        \"props\"\
  : {\n          \"children\": \"This is a nice paragraph\"\n        }\n      }\n\
  \    ]\n  }\n}\n```\n\n请注意，为了清晰起见，我从上面的对象中删除了一些属性。但我们之前看到的是 React 在内存中拥有的一个对象。这实际上就是\
  \ vDOM。请注意，虽然这里没有“DOM”的东西，但我们仍然将其称为虚拟 DOM，这有点不准确。\n\n### 渲染器\n\nReact 的第二部分是 React\
  \ 渲染器。现在，DOM 是能够使用 React 的主机环境之一。还有其他主机环境，比如 React Native（用于移动端），或者 React Hardware。渲染器基本上允许协调器与主机环境通信。\n\
  \n例如，对于 DOM，我们知道元素是通过浏览器暴露的`document.createElement` API 创建的。但对于移动端主机（比如 Android）来说，情况可能并非如此。在那里，你必须使用其他方式在屏幕上创建\
  \ UI 元素，但这会影响协调器吗？不会！这就是为什么将协调器和渲染器拆分成不同的包是一个很好的决定。当你为网页安装 React 时，你会安装`react`和`react-dom`这两个包。在这里，`react`包基本上是协调器，而`react-dom`包是渲染器。\n\
  \n### 从类组件迁移\n\n我完全知道 React 对基于类的组件提供了一流支持，但本章旨在介绍与 React 相关的未来技术和实验性技术，并且团队已经明确表示，未来函数组件将是开发重点。有了\
  \ Hooks，函数组件完全能够完成基于类的组件所能做的一切。如果你刚开始学习 React，我建议你只需了解基于类的组件到足以重构它们的程度，但如果你要创建自己的组件，始终使用函数组件。\n\
  \n基于类的组件有其自身的优缺点，例如，它们实际上会改变状态和 props，而函数组件则在渲染时捕获 props 和 state。这避免了讨厌的 bug。此外，函数组件是一种比类更友好的编码方式，仅仅因为\
  \ JavaScript 没有类；它只是函数的语法糖。\n\n### 并发模式\n\nReact 中的并发模式是一种全新的 React 工作方式。在计算机科学中，并发通常意味着基于时间分片执行多个任务。React\
  \ 一旦完成 vDOM 差异计算，就必须将这些更改提交到 DOM。计算 vDOM 中的更改是非阻塞的，即使现在也是如此，并且这是 React 内部的工作方式（通过调用浏览器中的`requestIdleCallback`函数利用浏览器的空闲时间，并在其他主机环境中使用不同的线程），然而提交阶段，即写入\
  \ DOM，是同步的。并发模式的一些显著特性：\n\n1.  **可中断渲染**：考虑一个包含大量项目的大列表，你可以对项目进行筛选。如果你曾经使用过这样的应用程序，你会知道它可能会变得卡顿和延迟，除非有某种`debounce`函数，该函数在用户停止输入之前不会运行搜索\
  \ JavaScript 逻辑（例如，检查最后一次按键是否在 200 毫秒之前）。并发模式通过使渲染可被高优先级中断中断来解决这个问题。用户与输入字段交互是比\
  \ React 渲染更新视图更高优先级的中断，因此 React 暂停其执行并释放主线程来处理输入。\n\n2.  **加载序列**：你是否见过这样的应用程序：即使你处于快速连接中，加载旋转器也只会出现一瞬间？并发模式也解决了这个问题。\n\
  \n\n\n\n\n### 3. 并发\n\n最后但同样重要的是，React 现在可以真正并发地工作，即它可以同时处理多个状态更新。这意味着，如果你有一些 I/O\
  \ 密集型数据（HTTP 网络请求）需要加载，React 可以暂时跳过这些数据，先渲染视图。当数据到达时，React 可以简单地将其放置到位。目前的标准做法是，如果数据不可用，我们会阻止整个视图的渲染。\n\
  \n并发 React 使代码获取、数据获取和资源获取真正并发，如果浏览器支持，还可以并行。目前，并发 React 仍处于实验阶段，除了代码分割之外，并不稳定。因此，我们不会为不稳定的\
  \ API 提供代码示例。\n\n### 选择并发模式\n\nReact 的并发模式目前是可选加入的。要使用它，不要使用：\n\n```\nReactDOM.render(<Component\
  \ />, container)\n```\n\n而是使用以下方式：\n\n```\nReactDOM.createRoot(container).render(<Component\
  \ />)\n```\n\n现在你就在并发模式下运行 React 了。这个 API 仅存在于实验性构建中，未来很可能你不再需要它。\n\n### Suspense\
  \ – 代码获取\n\nReact 自带 Suspense，这是一个组件，用于处理应用中某部分因某种原因被挂起的情况。基本上，Suspense 允许你的应用等待某个东西。这个“东西”可以是任何异步操作——无论是\
  \ I/O 密集型还是内存密集型。让我们看看如何利用它来处理代码。请看下面的示例：\n\n```\nimport React from 'react'\n\n\
  constProfilePage = React.lazy(() => import('./ProfilePage')); // 懒加载\n\n// 在个人资料加载时显示一个加载指示器\n\
  \n<Suspense fallback={<Spinner />}>\n  <ProfilePage />\n</Suspense>\n```\n\n我们没有直接导入组件，而是将其包裹在\
  \ `React.lazy` 调用中。当这个组件被使用时，React 发现它不可用，就会发起一个请求来获取该组件的代码。\n\n与此同时，React 还会尝试在其上方的树中查找\
  \ `Suspense` 组件，并使用指定的 `fallback` 组件作为占位符。因此，只要 `ProfilePage` 尚未可用和就绪，Suspense 就会在其位置显示\
  \ Spinner。\n\n### Suspense – 数据获取\n\n这才是真正有趣的地方。Suspense 允许你像使用同步数据一样获取数据。这仍然是实验性的，所以我们不会深入代码细节。另外，如果你在未来阅读本书，请务必检查更新后的代码，因为\
  \ API 可能已经发生了变化。让我们看一些代码！\n\n```\n// 这不是一个 Promise。它是来自 Suspense 集成的特殊对象。\nconst\
  \ resource = fetchProfileData();\n\nfunction ProfilePage() {\n  return (\n    <Suspense\
  \ fallback={<h1>正在加载个人资料…</h1>}>\n      <ProfileDetails />\n      <Suspense fallback={<h1>正在加载帖子…</h1>}>\n\
  \        <ProfileTimeline />\n      </Suspense>\n    </Suspense>\n  );\n}\n\nfunction\
  \ ProfileDetails() {\n  // 尝试读取用户信息，尽管它可能尚未加载完成\n  const user = resource.user.read();\n\
  \  return <h1>{user.name}</h1>;\n}\n\nfunction ProfileTimeline() {\n  // 尝试读取帖子，尽管它们可能尚未加载完成\n\
  \  const posts = resource.posts.read();\n  return (\n    <ul>\n      {posts.map(post\
  \ => (\n        <li key={post.id}>{post.text}</li>\n      ))}\n    </ul>\n  );\n\
  }\n```\n\n这段代码包含了很多内容。让我们逐一分析。\n\n*   首先，我们创建了一个 `resource`。这是特殊的。它既不是 Promise 也不是普通对象。这个对象由\
  \ React 创建，我们可以像同步拥有数据一样使用它。如果数据不可用，React 会自动在树中搜索最近的 Suspense 组件，并让它显示 fallback\
  \ 加载器。我们稍后会讨论这个代码！（该代码高度实验性，很可能发生变化，所以请不要在未来使用它）。\n\n*   然后我们使用 `resource.posts.read()`\
  \ 从 resource 中读取数据。注意，这是同步执行的。在内部，如果数据不存在，`read()` 方法实际上会在底层抛出异常，供 `Suspense` 组件捕获，这样后续执行就不会进行。如果数据可用，则返回数据。\n\
  \n*   最后，我们在组件中正常使用它。\n\n现在我们来讨论 resource 是如何创建的。以下是 `fetchProfileData` 当前的 `unstable`\
  \ 实现：\n\n```\nimport { unstable_createResource } from 'react-cache'\n\nfunction\
  \ fetchProfileData() {\n  return {\n    user: unstable_createResource(\n      ()\
  \ => fetch('…').then(res => res.json()) // 返回一个 Promise\n    ),\n    posts: unstable_createResource(\n\
  \      () => fetch('…').then(res => res.json()) // 返回一个 Promise\n    )\n  }\n}\n\
  ```\n\n基本上，目前你必须使用 `unstable_createResource`，未来它可能会被替换为 `createResource`。在这里，目前（这可能会改变！）你必须返回一个\
  \ `Promise`，当它被解析时，该特定资源将对你的 React 组件可用，并且你的组件将能够像我们在前面的示例中看到的那样，使用 `resource.read()`\
  \ 读取返回值。\n\n## 结论\n\n在本书的最后一章中，我们了解了即将到来的 React 并发模式及其工作原理。我希望这本书能让你对 React 和 Next\
  \ 的整体使用有一个基础理解，并巩固你对 React 的概念。在使用 React 这么多年之后，我认为它不仅仅是一个 UI 库，而是一个完整的开发生态系统，还有更多东西需要学习！祝你未来的努力一切顺利。\n\
  \n## 问题\n\n1.  协调器（reconciler）和渲染器（renderer）有什么区别？react-native 是协调器还是渲染器？\n\n2.\
  \  基于类的组件在由父组件/宿主更新时会改变 state 和 props，而函数组件则不会。请找出函数组件在底层是如何工作的。（提示：函数组件使用 hooks，每次渲染都会返回一个新值）\n\
  \n3.  并发模式与普通 React 模式有何不同？\n\n4.  Suspense 的主要本质是什么？（提示：等待某个东西）\n\n"
