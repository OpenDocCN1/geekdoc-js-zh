    # [manifest.json file](#toc.xhtml_s127a)


    In the public folder, there is a file called `manifest.json,` which is a simple
    JSON file describing some properties of our installed PWA. You can see that we
    include this `manifest.json` in our index.html file using the following line of
    code:


    `<link rel=”manifest” href=”%PUBLIC_URL%/manifest.json” />`


    And the `manifest.json` file looks like the following:


    `{`


    `“short_name”: “React App”,`


    `“name”: “Create React App Sample”,`


    `“icons”: [`


    `{`


    `“src”: “favicon.ico”,`


    `“sizes”: “64x64 32x32 24x24 16x16”,`


    `“type”: “image/x-icon”`


    `},`


    `{`


    `“src”: “logo192.png”,`


    `“type”: “image/png”,`


    `“sizes”: “192x192”`


    `},`


    `{`


    `“src”: “logo512.png”,`


    `“type”: “image/png”,`


    `“sizes”: “512x512”`


    `}`


    `],`


    `“start_url”: “.”,`


    `“display”: “standalone”,`


    `“theme_color”: “#000000”,`


    `“background_color”: “#ffffff”`


    `}`


    Let’s go on these properties quickly:


    *   `short_name`/`name`: These are used for naming your application. At least
    one of them must be specified (you can specify both). If you specify both, `short_name`
    would be used in places with limited space, like the toolbar (you can see above
    in the screenshot, the toolbar holds the title React App and not Create React
    App Sample).


    *   `icons`: As the prop name says, these are the icons used for your application
    and what the end-user sees.


    *   `start_url`: This URL is the URL where your app should start when it is launched.
    Usually, you’ll just want to keep it to your root URL, or you can pass in some
    query parameters to track when your app is opened. For example, passing `/?utm_source=app_opened`
    would allow you to track how many times your PWA is opened.


    *   `display`: This allows you to set how your app should be launched. Because
    PWA is a web app anyway, it’s launched inside a browser instance only. Here are
    the values and what they do:


    | **value** | **Description** |


    | `fullscreen` | Opens the app in fullscreen mode |


    | `standalone` | Opens the app in a native-looking app window |


    | `minimal-ui` | Similar to fullscreen, but provides more UI elements for controlling
    navigation |


    | `browser` | Opens your URL in the browser |


    If you want the Add to Home Screen Prompt we just saw above, your display value
    should be set to standalone only:


    *   `theme_color`: This is the color of the toolbar of the application.


    *   `background_color`: This is the splash screen background color (for mobile
    phones) when the app is launched.


    You can, in fact, generate your own `manifest.json` file easily using online tools
    like [https://app-manifest.firebaseapp.com/](https://app-manifest.firebaseapp.com/).


    # [Service workers](#toc.xhtml_s128a)


    Think of a service worker as a JavaScript file sitting between your application
    and the network layer. That means, whenever your browser tries to connect to the
    network (URL owned by you), that passes through a service worker file. Similarly,
    when there’s a response back from the network (your server), that goes through
    the service worker before it is received by your app.


    One important thing to note is that service workers, just like web workers, run
    in a separate thread (that doesn’t mean that JS is multithreaded), so your UI
    is never blocked.


    # [Lifecycle](#toc.xhtml_s129a)


