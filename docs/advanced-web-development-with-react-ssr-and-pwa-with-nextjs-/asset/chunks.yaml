  trans: "\n\n2. React 核心团队也推荐优先使用钩子，原因如上所述。尽管基于类的组件短期内不会消失，但我们都同意函数组件是 React 库未来发展的方向。\n\
    \n话虽如此，学习超出实际使用范围的知识总是有好处的。我们将快速介绍基于类的组件，然后深入探讨函数组件，后者现在是更重要的方面。但首先，让我们从函数组件开始。\n\
    \n# 函数组件\n\n函数组件在 React 中已经存在很长时间了。在进一步讨论之前，让我们先看看这个 Hello World 的 React 代码：\n\
    \n```\nimport React from 'react'\nimport ReactDOM from 'react-dom'\n\nfunction\
    \ App() {\n  return <p>Hello World</p>\n}\n\nReactDOM.render(<App />, document.getElementById('root'))\n\
    ```\n\n你可以看到，这里我们使用了一个名为 `App` 的函数作为 React 组件。那么，如何知道它是一个 React 组件呢？当你将其用作 JSX（例如\
    \ `<App />`）时，它会被编译成以下内容：\n\n```\nimport React from 'react';\nimport ReactDOM\
    \ from 'react-dom';\n\nfunction App() {\n  return React.createElement(\"p\", null,\
    \ \"Hello World\");\n}\n\nReactDOM.render(React.createElement(App, null), document.getElementById('root'));\n\
    ```\n\n那么这里发生了什么？\n\n1. 你在 JSX 中编写的所有内容都会被编译成等效的 React 调用（我们在第 1 章中讨论过）。JSX 只是前面示例的语法糖。\n\
    \n2. `React.createElement` 返回一个 JavaScript 对象，看起来像这样：\n\n   ![](img/image7.jpg)\n\
    \n   **图 3.1**\n\n现在，我们不想深入探讨 React 的内部机制，但最终 React 会使用这个对象来创建一个树，即虚拟 DOM。现在让我们回到函数组件的一些属性。\n\
    \n# Props\n\n传递 props（properties 的缩写）是一种常见场景，你几乎总是会用它来将数据传递给子组件。React 的工作方式是父组件将数据传递给子组件。当然，使用\
    \ Context API 你可以神奇地将数据向下传递多层（稍后会详细介绍），但 props 提供了最简单的数据传递方式。让我们看一个例子：\n\n```\n\
    interface props {\n  name: string\n}\n\nconst App: React.FC<props> = props =>\
    \ {\n  return <p>Hello {props.name}</p>\n}\n\nReactDOM.render(<App name=\"Mehul\"\
    \ />, document.getElementById('root'))\n```\n\n这里你可以看到我们正在使用 TypeScript 来增强 React。我们没有使用\
    \ `function` 关键字创建函数，而是使用了箭头函数表示法，因为目前你无法拥有带类型的函数。\n\n`React.FC` 或 `React.FunctionalComponent`\
    \ 类型（TypeScript）用于定义 `App` 组件，它可以接受并验证使用组件时传递给组件的 props。此外，你可以在 interface 中列出所有\
    \ props 及其数据类型。\n\n# Children\n\nReact 组件有一个特殊的 prop 叫做 `children`，它基本上包含在自定义组件的开始和结束标签之间传递的任何内容。我提到的是“任何内容”而不是“传递的组件”，因为你可以传递任何你喜欢的东西——组件、字符串、函数等等。请看下面的例子：\n\
    \n```\nconst App: React.FC<{ name: string }> = props => {\n  return <div>\n  \
    \  Hello {props.name}\n    <div className=\"children\">\n      {props.children}\n\
    \    </div>\n  </div>\n}\n```\n\n我们可以这样调用这个组件：\n\n```\n<App name=\"Mehul\">\n\
    \  <p>Hey there!</p>\n</App>\n```\n\n这是使用 `children` prop 的一种方式。另一种方式是通过函数来使用它们。看这个例子：\n\
    \n```\nconst App: React.FC<{ name: string, children(one: string, two: string):\
    \ JSX.Element }> = props => {\n  return <div>\n    Hello {props.name}\n    <div\
    \ className=\"children\">\n      {props.children('one', 'two')}\n    </div>\n\
    \  </div>\n}\n```\n\n然后我们这样使用这个组件：\n\n```\n<App name=\"Mehul\">\n  {(one: string,\
    \ two: string) => <p>Hey there! Passed attributes: { one } { two }</p>}\n</App>\n\
    ```\n\n以下是上一个示例的快速总结：\n\n1. 我们创建了自定义的 `children` 类型，它接收两个字符串参数并返回一个 `JSX.Element`（即那个\
    \ `<p>` 标签）。\n\n2. 在组件中，我们将 `props.children` 作为函数使用，并传入两个值来调用它（而不是简单地渲染它）。\n\n\
    3. 父组件使用子组件传递给父组件的值来渲染子组件。这是一种巧妙的方法，可以将少量数据从子组件传递给父组件；通常数据是从父组件传递给子组件，但通过这种方式你可以实现相反的效果。\n\
    \n事实上，我们刚才所做的被称为**渲染 props** 方法。它指的是当 prop（在我们的例子中是 `children`）是一个函数而不是 JSX 元素或常规值时，进行数据传递的方式。\n\
    \n# Hooks\n\n在 React 16.8 之前，仅使用函数无法创建有状态的函数组件。你看到了问题所在，除非像类组件那样，否则无法使用任何 *state*\
    \ 对象。但随着 hooks 的引入，这种情况发生了变化。通过 hooks 引入状态可以带来很多好处。函数组件现在可以*记住*它们的上下文。让我们从 React\
    \ 中现在可用的各种有用的 hooks 以及如何使用它们开始。\n\n# useState\n\n`useState` 钩子允许你将类中的 `this.state`\
    \ 和 `this.setState` 功能引入函数组件。以下是一个快速示例，展示如何使用它们：\n\n```\nfunction App() {\n  const\
    \ [name, setName] = useState('Mehul')\n  return <p>Hello {name}</p>\n}\n```\n\n\
    让我们关注这一行 `const [name, setName] = useState('Mehul')`。`useState` 方法返回一个包含两个元素的数组，第一个是\
    \ `getter`，第二个是 `setter`。如果你在函数组件中调用 `console.log(useState(\"Mehul\"))`，你会看到类似这样的结果：\n\
    \n![](img/image21.jpg)\n\n**图 3.2**\n\n这里我们可以清楚地看到数组的第一个值是 `getter`，第二个值是一个 `function`。当调用这个函数时，它会更新我们的\
    \ `setter` 变量，类似于调用 `this.setState` 的效果。让我们看一个简单的例子：\n\n```\nfunction App() {\n\
    \  const [name, setName] = useState('Mehul')\n  setTimeout(() => {\n    setName(Math.random())\n\
    \  }, 1000)\n  return <p>Hello {name}</p>\n}\n```\n\n当你运行这段代码时，你会看到名字每秒都会变为一个\
    \ 0 到 1 之间的随机数。请注意，通常约定使用 `X` 和 `setX` 作为 `getter` 和 `setter` 的变量名。当然，你可以使用任何你喜欢的名字，但我建议遵循这个约定，因为它便于区分。\n\
    \n# useState 不是同步的\n\n这意味着，每当你调用 `useState` 时，不能保证在调用之后使用 `getter` 就能获得更新后的值。例如，考虑这个例子：\n\
    \n```\nconst App: React.FC = props => {\n  const [currentNumber, setCurrentNumber]\
    \ = useState(Math.random())\n  function changeState() {\n    setCurrentNumber(Math.random())\n\
    \    console.log('New number => ${currentNumber}')\n  }\n  return <button onClick={changeState}>Click\
    \ Me { currentNumber }</button>\n}\n```\n\n以下是代码的输出：\n\n![](img/image4.jpg)\n\n\
    **图 3.3**\n\n如果你使用这个组件，你会看到控制台中显示的内容与 UI 中反映的内容不一致。这是因为 `useState` 是异步运行的，不会立即更新变量。\n\
    \n"
- fmt: '

    There’s another problem now if `setX` is not asynchronous, that means if the next
    state of the variable depends on the previous state, we cannot use the `X` directly
    inside `setX`! Fortunately, for that, react allows you to pass a function inside
    `setX` whose first argument is guaranteed to be the new value. Let’s see this
    example to learn more:


    ```

    const App: React.FC = props => {


    const [counter, setCounter] = useState(0)


    function add() {


    setCounter(counter => counter + 1)


    }


    function sub() {


    setCounter(counter => counter - 1)


    }


    return <>


    <p>{ counter }</p>


    <button onClick={add}>++</button>


    <button onClick={sub}>--</button>


    </>


    }

    ```


    Couple of things to be noted here:


    1.  We could use nameless JSX element (simply `<>` and `</>`) - This would not
    show in the DOM structure.


    2.  We could pass a function inside `setX` instead of the updated value. If you
    pass a function, React would call that function with the latest state variable
    value and then whatever that function returns would be assigned as the latest
    state.


    A general rule of thumb is if your state mutation involves results based on the
    previous state, use the functional parameter approach;otherwise you could directly
    pass the new value.


    # useStatecallback


    Well, in class-based components, we had a callback associated with `this.setState`
    which could be used in case you wanted to wait for the state variables to update
    and then trigger an action. It is not that straightforward with hooks, however,
    you could make use of another hook to achieve the same effect. Let’s take a look
    at that hook now.


    # useEffect


    This hook allows you to call a piece of code whenever something *changes*. Think
    of `useEffect` as a custom watch implementation over React’s inbuilt infrastructure.


    Here’s a very simple example of `useEffect`:


    ```

    const App: React.FC = props => {


    const [counter, setCounter] = useState(0)


    useEffect(() => {


    document.title = ‘Counter is at ‘ + counter


    })


    return <>


    <p>{ counter }</p>


    <button onClick={() =>setCounter(c => c + 1)}>Increment</button>


    </>


    }

    ```


    Alright, here we could see that we’re making use of the `useEffect` hook by passing
    a function to it. This function is executed every time React renders (or re-renders)
    our component. This function eventually sets the document’s title to our counter
    value. And in the function, you’ll always have the latest value of the state variable.
    This is because React does not mutate the state variables at all! When using functional
    components and hooks, React does not mutate state ever. You could see this fairly
    clearly by the use of our `const` keyword over simple string/number values too.
    Instead, whenever React re-renders our component, the `useState()` function returns
    the newly updated state to the state variable, and the `useEffect` function calls
    the `passed` function on every single render.


    # useEffect dependencies


    You could quickly see how `useEffect` could become a little heavy on performance
    as it would be running our passed function again and again on every render even
    when nothing has been changed. Let’s take a look at the following example:


    ```

    const [counter1, setCounter1] = useState(0)


    const [counter2, setCounter2] = useState(0)


    useEffect(() => {


    document.title = ‘Counter is at ‘ + counter1


    console.log(‘Effect called’)


    })


    return <>


    <span>{ counter1 }</span>&nbsp;


    <span>{ counter2 }</span>


    <button onClick={() => setCounter1(c => c + 1)}>Increment Counter 1</button>


    <button onClick={() => setCounter2(c => c + 1)}>Increment Counter 2</button>


    </>

    ```


    And the output associated with the code above:


    ![](images/image8.jpg)


    **Figure 3.4**


    Clearly, we never updated counter1, but still, React calls our `useEffect` function
    on every re-render. We can do better. We can tell React that a particular effect
    only uses a certain set of variables passed as an array, which if changed, React
    should call the effect function again. Otherwise, it’s just no point (because
    the value is the same for our state variables anyway). To do that, we can pass
    a second argument to the `useEffect` hook, which would be our dependencies for
    that effect. Let’s take a look at the same example again but this time with added
    counter1 as a dependency:


    ```

    useEffect(() => {


    document.title = ‘Counter is at ‘ + counter1


    console.log(‘Effect called’)


    }, [counter1])

    ```


    And the output associated now is:


    ![](images/image6.jpg)


    **Figure 3.5**


    You see, now we get **Effect called** only once because effects run initially
    after the first render. Other than that, as long as counter1 is untouched, the
    effect function won’t run.


    # useEffectcleanup


    The hook `useEffect` provides you with an option to clean up any subscription
    you want to get rid of before either the component is unmounted or it is re-rendered,
    and the `useEffect` is called again. That being said, in the preceding example,
    you could call a function when the new component state is rendered using `useEffectcleanup`
    function. Let’s take a look at an example to understand it in a better way:


    ```

    const App: React.FC = props => {


    const [counter, setCounter] = useState(0)


    useEffect(() => {


    document.title = ‘Counter is at ‘ + counter


    return function cleanup() {


    console.log(‘This will fire whenever this function gets called next/the component
    unmounts. Counter is ${counter} right now’)


    }


    }, [counter])


    return <>


    <span>{ counter }</span>


    <button onClick={() =>setCounter(c => c + 1)}>Increment Counter</button>


    </>


    }

    ```


    When running this code initially, we would see nothing in the console, like the
    following:


    ![](images/image12.jpg)


    **Figure 3.6**


    But once I click on the **Increment** counter, something interesting would show
    up in the console:


    ![](images/image5.jpg)


    **Figure 3.7**


    Alright! We see that on the screen, the counter is actually 1\. But in the console,
    we receive the log with the counter value of 0\. Did we miss something? Is this
    a bug? Actually no, this is expected behaviour.


    Well, you could see that the purpose of the `cleanup` function is to remove anything
    you want to get rid of before the *new instance* of that thing is created. Hence,
    React needs to call the `cleanup` function of the older `useEffect` function so
    that it could access the old subscription variable and that environment. React
    obviously should not fire the `cleanup` function of the latest `useEffect` function
    because well, it does not require a cleanup yet, does it?


    # useCallback


    Remember how we passed a dependency array in `useEffect` hook to let React know
    about the variables we cared about? This let React not to run the effect functions
    again and again when they were not required. But what about the functions you
    call inside the `useEffect` function itself? It is easy to miss things like these:


    ```

    const [result, setResult] = useState(null)


    const [url, setUrl] = useState(null)


    async function someAsyncOperation() {


    // some more code


    return await fetch(url)


    }


    useEffect(() => {


    // some long code….


    someAsyncOperation().then(r => {


    setResult(r)


    })


    }, [])

    ```


    Oops! Can you point out the problem in the code snippet that might occur? You
    see, although looking at the effect function it seems like no dependency is required
    (well, because we’re not using any state variable directly, upon closely looking
    we could see that we’re actually using the state variable `url`inside the `someAsyncOpeartion`
    function! That means, if somewhere `setResult` was called, the effect function
    would not re-run hence not re-fetch the URL and hence would produce a buggy output.

