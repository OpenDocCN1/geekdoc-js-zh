  trans: "\n\n```\nplugins: [\n  new webpack.DefinePlugin({\n    'process.env': {\n\
    \      'BROWSER': 'true',\n    }\n  })\n]\n```\n\n完成这一步后，我们来看看需要在 `server.js`\
    \ 文件中做哪些修改：\n\n```\nconst express = require(\"express\")\nconst app = express()\n\
    const React = require(\"react\")\nconst path = require('path')\nconstReactDOMServer\
    \ = require(\"react-dom/server\")\nconst { StaticRouter, Switch, Route } = require(\"\
    react-router-dom\")\nconst Home = require('./components/Home')\nconst About =\
    \ require('./components/About')\nrequire('isomorphic-fetch')\napp.use(express.static(path.resolve(__dirname,\
    \ '../dist')))\napp.get('/*', (req, res) => {\n  const components = [Home, About]\n\
    \  constasyncData = {}\n  const promises = components.map(c => ({\n    link: c.asyncData,\n\
    \    name: c.name\n  })).filter(item =>item.link).map(item => {\n    return fetch(item.link).then(data\
    \ =>data.json()).then(json => {\n      asyncData[item.name] = json\n    })\n \
    \ })\n  constjsx = <StaticRouter location={req.url}>\n    <Switch>\n      <Route\
    \ path=\"/\" component={Home} exact={true} />\n      <Route path=\"/about\" component={About}\
    \ exact={true} />\n    </Switch>\n  </StaticRouter>\n  Promise.all(promises).then(()\
    \ => {\n    constreactDom = ReactDOMServer.renderToString(jsx)\n    res.send(template(reactDom,\
    \ asyncData))\n  })\n})\napp.listen(1337)\nfunction template(reactDom, data) {\n\
    \  return '\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>React\
    \ SSR</title>\n</head>\n<body>\n<div id=\"root\">${reactDom}</div>\n<script>\n\
    window.componentsData = ${JSON.stringify(data)}\n</script>\n<script src=\"./app.bundle.js\"\
    ></script>\n</body>\n</html>\n'\n}\n```\n\n好了！这个文件里发生了什么？\n\n*   首先，我们将所有组件收集到一个名为\
    \ `components` 的数组中。\n*   然后，我们创建一个 Promise 数组。最终，这个数组将包含多个未完成的 fetch 请求。\n* \
    \  这里，我们从 `components` 数组开始，创建一个新的对象数组，每个对象包含要 fetch 的链接（`asyncData` 链接）和组件的名称（在\
    \ JavaScript 中，`Function.name` 会返回该函数的名称）。\n*   我们使用名称将其链接到特定组件。\n*   最后，我们过滤这个数组，移除那些没有需要\
    \ fetch 的 `async` 数据的元素。\n*   完成后，我们进行最终的映射，在其中 fetch 所有数据并返回 promise。注意，在 fetch\
    \ 请求中，我将 `item.name` 作为 `asyncData` 对象的键，将 `json`（远程服务器返回的结果）作为 `asyncData` 对象的值。\n\
    *   此时，`promises` 包含了所有并行进行的 fetch 请求。现在，我们需要等待所有 fetch 请求完成，然后再将数据发送回客户端。\n*\
    \   因此，我们使用 `Promise.all` 等待所有 Promise 解析。完成后，我们构建 `ReactDOM` 并将其发送给客户端。\n*  \
    \ 对于客户端，我们执行正常的 `hydrate`，但同时也通过一个 script 标签发送客户端状态，如 HTML 部分末尾所示。\n\n完成这些操作后，你会看到前端不再有\
    \ `fetching` 数据的过程。页面立即加载，并且在 DevTools 中看不到 fetch 请求，因为所有数据都已经从服务器端提供给我们：\n\n\
    ![](img/image14.jpg)\n\n**图 5.13**\n\n在上面的截图中，你可以看到没有向远程服务器发送数据请求，因为当服务器发送数据时，前端已经拥有了这些数据。太棒了！但即使采用这种方法，我们仍然遇到一些问题：\n\
    \n我们构建的树在服务器端和客户端渲染之间变得不一致。这是因为，当 React 代码在服务器端渲染时，它不知道 `process.env.BROWSER`，因此不会预填充状态变量，从而使用了那个\
    \ `Loading` 片段。然而，在客户端，当 React 重新水合数据时，它已经在全局作用域中拥有了数据，因此它会用实际数据重新水合，从而造成不一致，React\
    \ 也会在控制台中向我们报告这一点：\n\n![](img/image71.jpg)\n\n**图 5.14**\n\n*   在上面的截图中，你可以看到\
    \ React 抱怨 DOM 不匹配，即它期望的内容与服务器实际发送的内容不一致。\n*   另一个问题是，我们 fetch 了所有组件的 `async`\
    \ 数据，尽管我们只需要 fetch 当前活动组件的 `async` 数据。\n*   我们也没有处理嵌套组件的问题，即许多嵌套组件需要彼此之间的 `async`\
    \ 数据。\n*   单个组件可能需要来自不同来源的多个 `async` 数据；我们也没有处理这种情况。\n\n# 结论\n\n请记住，我们之前讨论过，使用\
    \ React 进行 SSR 并非易事；你需要处理许多边缘情况才能使其正常工作。因此，自己修复每一个小细节是不可行的。所以，我们将使用某些框架，这些框架会为我们抽象掉许多细节，让我们能够更专注于代码本身，而不是这些需要实现的小细节。在接下来的章节中，我们将讨论\
    \ Next.js，这是一个流行的 React 框架，用于创建生产就绪的服务器端渲染应用程序。\n\n# 问题\n\n1.  服务器端渲染与普通的客户端 React\
    \ 代码有何不同？\n2.  PHP 是一种服务器端渲染语言吗？为什么是/为什么不是？\n3.  Babel 的作用是什么？\n4.  `StaticRouter`\
    \ 和普通 `Router` 有什么区别？\n5.  `ReactDOM.render` 和 `ReactDOM.hydrate` 有什么区别？\n6. \
    \ 同构 JavaScript 是什么意思？\n\n# 第 6 章\n\n# Next.js 简介\n\n在上一章中，我们学习了很多关于从零开始使用 React\
    \ 进行服务器端渲染的知识，并看到了仅仅为了让客户端和服务器端机器之间的简单结果同步，需要多少工具配置。现在，让我们进入 Next.js，看看它是什么，以及为什么它是一个很好的选择。\n\
    \n# 结构\n\n*   什么是 Next.js\n*   安装\n*   默认设置\n*   Next.js 中的页面\n*   静态资源\n*   路由\n\
    *   组件\n*   CSS\n\n# 目标\n\n本章旨在向你介绍 `Next.js`，这是一个为 React 构建的服务器端渲染框架。`Next.js`\
    \ 将大大简化你作为开发者的工作流程，从而将更多精力投入到应用程序的逻辑和目的上，减少在基础设施部分上的精力。我们将学习它是什么，如何设置以及如何有效地使用它。\n\
    \n# 什么是 Next.js？\n\n`Next.js` 是一个用于使用 React 构建服务器端应用程序的框架。框架提供了许多开箱即用的功能。`Next.js`\
    \ 提供了路由、页面管理、服务器端渲染、缓存等解决方案，并且非常容易设置。\n\n你可以将 `Next.js` 的易用性与 `create-react-app`\
    \ 相提并论。就像手动设置 React 项目很繁琐一样，在上一章中，我们看到手动设置 React SSR 项目同样繁琐。`Next.js` 来救场了！\n\n\
    # 为什么选择 Next.js？\n\n根据其官方网站，以下是一些解释为什么它是一个好选择的要点：\n\n1.  服务器渲染：这是使用 Next.js 的主要原因。\n\
    2.  静态导出：这意味着你可以通过几次点击和命令生成网站的静态包（并非所有情况都可行）。\n3.  CSS-in-JS：CSS in JS 是一种流行的技术，人们直接在\
    \ JS 中编写样式。有些人对此不以为然，但社区或多或少地认可它，并围绕它开发了许多解决方案。Next.js 支持所有这些方案。\n4.  零配置：设置起来就像\
    \ `create-react-app` 一样简单。我们将在几分钟内用 Next.js 准备好我们的 Hello World 应用。\n\n"
- fmt: "\n5. Fully extensible: You can control the `babel` and `webpack` configuration.\
    \ And once you’re able to control that, you can pretty much control every fine\
    \ detail of your project.\n\n6. Ready for production: It is an open-source and\
    \ highly optimized framework which is quite mature now for creating production-ready\
    \ apps with React.\n\nThese are some of the many reasons you could go with `Next.js`\
    \ if you’re willing to opt into an SSR solution using React.\n\n# Installation\n\
    \nLet’s begin by setting up `Next.js` for our project.\n\n1. Create a directory\
    \ named `react-ssr-next`\n\n2. Using the command line, `cd` into that directory\n\
    \n3. Run the following commands:\n\n   ```\n   npm init -y\n   npm install react\
    \ react-dom next --save\n   ```\n\n   These commands basically setup your `package.json`\
    \ file and install the required dependencies. Did you notice that we only needed\
    \ three packages in total? The `react`, `react-dom`, and the `next` package!\n\
    \n4. Finally, go ahead and make these changes to your `package.json` file’s scripts\
    \ section, so it looks like this:\n\n   ```\n   \"scripts\": {\n     \"dev\":\
    \ \"next\",\n     \"build\": \"next build\",\n     \"start\": \"next start\"\n\
    \   }\n   ```\n\n   So, your `package.json` file would look more or less like\
    \ the following (your version numbers might be different):\n\n   ```\n   {\n \
    \    \"name\": \"nextjs\",\n     \"version\": \"1.0.0\",\n     \"main\": \"index.js\"\
    ,\n     \"scripts\": {\n       \"dev\": \"next\",\n       \"build\": \"next build\"\
    ,\n       \"start\": \"next start\"\n     },\n     \"keywords\": [],\n     \"\
    author\": \"\",\n     \"license\": \"ISC\",\n     \"description\": \"\",\n   \
    \  \"dependencies\": {\n       \"next\": \"^9.1.1\",\n       \"react\": \"^16.9.0\"\
    ,\n       \"react-dom\": \"^16.9.0\"\n     }\n   }\n   ```\n\n5. Now, we would\
    \ create a `pages` directory inside the `root` folder. This is required by the\
    \ `Next.js` framework.\n\n6. Let’s go ahead and do `npm run dev` in the same directory.\n\
    \n   It’ll spin up `Next.js` processes. But because our `pages` directory is empty,\
    \ we don’t have any page to serve yet.\n\n   Anyway, it’ll give us a URL with\
    \ a bunch of information: `http://localhost:3000`:\n\n   ![](images/image82.jpg)\n\
    \n   **Figure 6.1**\n\n   In the preceding screenshot, we can see that running\
    \ `npm run dev` starts a development `Next.js` server for us to use.\n\n7. On\
    \ navigating to `localhost:3000` however, you’ll see a 404 page. This is because\
    \ our `pages` directory is empty, and `Next.js` doesn’t serve anything yet.\n\n\
    # Next.js defaults\n\nAt this point, we’ve `Next.js` set up correctly and running.\
    \ With `Next.js`, to avoid messing around with a lot of configuration in the beginning,\
    \ `Next.js` locks down certain default configuration. Let’s look at them one by\
    \ one.\n\n# Pages\n\nWe created the `pages` folder above. That folder is just\
    \ not a random name I gave from my side. Whatever filename you create inside that\
    \ folder; it is created as a route in your application! Let’s start with simple\
    \ `index.js` page, which is the root page of the application:\n\nIn the `pages/index.js`\
    \ file, let’s write the following simple React component:\n\n```\n// pages/index.js\n\
    export default () => <h1>Hello World</h1>\n```\n\nThat’s it! Go ahead and refresh\
    \ the `localhost:3000` page (it’ll refresh automatically anyway because hot reloading\
    \ is on), and there we have it:\n\n![](images/image15.jpg)\n\n**Figure 6.2**\n\
    \nIn the preceding screenshot, we could see that we successfully got a Hello World\
    \ output on the screen using `Next.js`.\n\nUpon looking at the source code, we’ll\
    \ see the following:\n\n```\n<!DOCTYPE html><html><head><meta charSet=\"utf-8\"\
    /><meta name=\"viewport\" content=\"width=device-width,minimum-scale=1,initial-scale=1\"\
    /><meta name=\"next-head-count\" content=\"2\"/><link rel=\"preload\" href=\"\
    /_next/static/development/pages/index.js?ts=1569413352906\" as=\"script\"/><link\
    \ rel=\"preload\" href=\"/_next/static/development/pages/_app.js?ts=1569413352906\"\
    \ as=\"script\"/><link rel=\"preload\" href=\"/_next/static/runtime/webpack.js?ts=1569413352906\"\
    \ as=\"script\"/><link rel=\"preload\" href=\"/_next/static/runtime/main.js?ts=1569413352906\"\
    \ as=\"script\"/></head><body><div id=\"__next\"><h1>Hello World</h1></div><script\
    \ src=\"/_next/static/development/dll/dll_397dc449097af0b4e992.js?ts=1569413352906\"\
    ></script><script id=\"__NEXT_DATA__\" type=\"application/json\">{\"dataManager\"\
    :\"[]\",\"props\":{\"pageProps\":{}},\"page\":\"/\",\"query\":{},\"buildId\":\"\
    development\",\"nextExport\":true,\"autoExport\":true}</script><script async=\"\
    \" data-next-page=\"/\" src=\"/_next/static/development/pages/index.js?ts=1569413352906\"\
    ></script><script async=\"\" data-next-page=\"/_app\" src=\"/_next/static/development/pages/_app.js?ts=1569413352906\"\
    ></script><script src=\"/_next/static/runtime/webpack.js?ts=1569413352906\" async=\"\
    \"></script><script src=\"/_next/static/runtime/main.js?ts=1569413352906\" async=\"\
    \"></script></body></html>\n```\n\nA lot of this is just the development stuff\
    \ and hot reloading scripts. But we could clearly see that Hello World markup\
    \ is rendered in source code, and not created on the fly using client-side JavaScript.\
    \ Hey, that’s server-side rendering!\n\nLet’s create an `about.js` file now:\n\
    \n```\n// pages/about.js\nconst AboutMe = () => {\n  return (\n    <div id=\"\
    about-me\">\n      <h1>Hey Guys!</h1>\n      <p>My name is Mehul and I’m the author\
    \ of this book.</p>\n      <p>This book covers React and stuff</p>\n      <p>I\
    \ like React</p>\n    </div>\n  )\n}\n\nexport default AboutMe\n```\n\nAnd that’s\
    \ basically it! Save the file and visit `localhost:3000/about` and you’ll see\
    \ the following page:\n\n![](images/image62.jpg)\n\n**Figure 6.3**\n\nThe preceding\
    \ page shows our content which we wrote as a React component in the file `about.js`\
    \ without any extra configuration from our end. `Next.js` takes care of the routing\
    \ under the hood.\n\n# Hot code reloading\n\nYou see when we make changes to our\
    \ code, and the next server is running (using `npm run dev` command), we don’t\
    \ have to go to the browser and refresh the changes manually. `Next.js` automatically\
    \ communicates with the filesystem to detect whether there has been any change\
    \ and if there has been, it’ll build it again and push the message to the browser\
    \ to fetch new changes and update accordingly.\n\nThis is offered out of the box\
    \ when you’re using Next.\n\n# Static file serving\n\n`Next.js` can also serve\
    \ your static files (images, videos, fonts, and so on) using a special directory\
    \ name. Go ahead and create a directory named `static` at the root of the project.\
    \ Anything you place under this directory is served on `/static/` route.\n\nLet’s\
    \ try to put an image in the `public/static` folder. The final folder structure\
    \ looks like the following:\n\n![](images/image112.jpg)\n\n**Figure 6.4**\n\n\
    The preceding screenshot shows what the file structure should look like.\n\nOnce\
    \ you do that, you should be able to navigate to `localhost:3000/static/profile.jpeg`:\n\
    \n![](images/image33.jpg)\n\n**Figure 6.5**\n\nYou could place all your static\
    \ assets in the `static` directory in your project.\n\nIn the earlier versions\
    \ of Next, you had to place all the static assets inside the `static` folder in\
    \ the root directory. Now, you can place anything you want inside the `public`\
    \ folder, and it’ll be available at your root URL path. But still, we’ll store\
    \ static assets in `public/static` path to be clear what assets are static and\
    \ what are not.\n\n# Routing\n\nIn `Next.js`, routing is a cakewalk, at least\
    \ the basic routing. Above, we saw a very basic demonstration of how routing could\
    \ work - just by creating JavaScript files inside a folder. But we need to *link*\
    \ these pages together as well. How would we go about that?\n\nOf course, we could\
    \ do linking using our regular anchor tags, but remember, just like raw React\
    \ SSR, this would perform a full redirect, and we don’t want that simply because\
    \ we have the ability to perform a background fetch of updated data and update\
    \ the UI using React, that’s the whole point of using React! So, let’s use `Link`\
    \ from `Next.js`.\n\n# Link\n"
  raw: "5.  Fully extensible: You can control the babel and webpack configuration.\
