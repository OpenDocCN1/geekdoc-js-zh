    # 关于作者


    **Mehul Mohan** 是一位企业家、开发者和安全研究员。目前，他在 BITS Pilani 攻读计算机科学学士学位。他是 WWDC''19 学者，并运营着
    codedamn——一个供人们学习编程的平台。你经常能在他的 YouTube 频道 codedamn 上看到他制作编程教程，该频道拥有超过 10 万订阅者。他曾因作为安全研究员的贡献而受到
    Google、Microsoft、Sony 等公司的表彰。


    # 关于审校者


    一位自我驱动、富有魅力的程序员，目前在美国 Verizon 担任技术分析师，专注于前端编程。参与了将 Verizon 网站页面从 Angular 迁移到 React
    Js 的工作。拥有印度 Mody 科技大学计算机科学学位。


    一位技术爱好者，热爱 UI 设计。在软件开发、前端开发方面拥有丰富经验，涉及基于 OO JavaScript、HTML5、CSS3、BootStrap、ReactJS、JSON、Redux、JQuery
    的 Web 应用分析、设计、开发与测试。以高度承诺、灵活应对多重角色而闻名。曾参与 Sprint 规划、每日 Scrum 会议、Sprint 演示和 Sprint
    回顾会议。在 UI 开发、Web UI 分析、响应式设计、编码、单元测试、实施和支持方面拥有丰富经验，参与过多个项目。


    在敏捷软件开发团队中使用 SCRUM、TDD（测试驱动开发）进行实施。擅长使用 Core Java 概念（如 OOPS）开发应用程序。具备出色的沟通和人际交往能力，自我驱动，善于作为团队成员与他人协作。在加入
    Verizon 之前，曾在 Orange France 担任 Java 开发人员，参与了将 Orange 的计费系统从 DML（一种遗留代码语言）迁移到 Java
    的工作。拥有法语文凭，法语知识对该项目帮助很大，并曾为同事教授法语课程，这也很有趣。


    还曾在 HCL 和 C-DOT 实习。喜欢在线贡献开源项目。空闲时间喜欢做自由职业项目。爱好：探索全球新地方、结识新朋友、阅读关于太空的内容。


    # 致谢


    我想感谢一些人在我撰写本书期间给予的持续支持。首先，我要感谢我的妈妈——Ritu Mohan 女士和我的爸爸——Vinay Kumar Mohan 先生，无论何时何地，他们总是在我需要的时候陪伴在我身边。


    我还要感谢我的妹妹 Ishumita Mohan 女士，她也是本书的技术编辑，感谢她一直以来的支持。


    最后，我要感谢 BPB Publications 的 Nrip Jain 先生，感谢他给我这个机会为他们撰写我的第一本书。


    # 前言


    随着 Web 在过去 5-6 年间的飞速发展，基于市场上已有的最佳实践进行构建，而不是从头开始，是理所当然的选择。React 就是这样一个工具，用于构建高度响应和可扩展的
    Web 应用，它包含了行业最佳实践，并被像 Facebook 这样的互联网前端所使用。因此，开发者提升自己的 Web 开发技能，将 React 纳入自己的技能库变得极为重要。


    随着企业对优化用户体验和搜索引擎优化的需求日益增长，像服务端渲染（SSR）和渐进式 Web 应用（PWA）这样的技术能够帮助企业构建更好的产品，同时减少现有代码库的技术维护成本。


    本书是一本面向开发者的实用手册，适合那些希望学习前沿 React 特性、巩固 React 技能，或开始使用 Next.js 和 React 进行 SSR/PWA
    开发的开发者。这些技能最终将帮助他们基于高度维护且可信的开源代码来扩展现有应用。本书将带你了解构建适用于 SSR 部署或转换为 PWA 的应用所需的不同离散概念。在本书的
    9 个章节中，你将学习以下内容。


    **第 1 章** 向你介绍 React。我们将深入探讨 React 是什么，以及为什么它是当今构建高度可扩展应用的绝佳选择。我们还将快速复习一些后续章节所需的必要
    JS 概念。


    **第 2 章** 将涵盖使用多种方法设置 React，并讨论每种方法的优缺点。我们还将开始使用 React 编写基本应用，并开始看到 React 开箱即用的优势。


    **第 3 章** 将介绍在 React 中创建组件的两种方式，并讨论 React 对组件采用的现代方法——函数式方式。我们还将在此章节中使用 hooks，并探讨为什么它们比其对应物——类——更有意义。


    **第 4 章** 介绍 React 中的状态管理。我们将讨论使用 React 管理状态的可能选项。我们将了解使用 Redux 管理状态，以及使用最新的 hooks——useContext
    和 useReducer 来模拟 Redux 存储。


    **第 5 章** 介绍 React 中的服务端渲染，我们将了解什么是 SSR 以及它是如何工作的。我们将在本章中从头开始实现 SSR，并讨论其优缺点。


    **第 6 章** 本章向你介绍 Next.js——在使用 React 进行 SSR 时一个流行的 SSR 框架选择。我们将了解如何设置 Next.js 以及它自带的多种内置功能。


    **第 7 章** 我们将在本章中探索更高级的 Next.js 特性，深入框架内部，并使用 Next.js 框架设置 API 端点。


    **第 8 章** 本章介绍渐进式 Web 应用以及如何使用 Next.js 和 React 框架创建 PWA。


    **第 9 章** 本章涵盖前沿的 React 特性以及一些关于 React 底层工作原理的信息。


