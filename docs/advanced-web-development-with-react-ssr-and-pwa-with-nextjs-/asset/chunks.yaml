  trans: "\n\n这种情况可能发生，并且随着代码库的增长通常很难注意到。那么如何确保你不会忘记在 `useEffect` 钩子中添加依赖项呢？你不需要这样做。你应该将函数作为依赖项传递，因为这样更合理！你看，实际函数\
    \ `someAsyncOperation` 的行为会因状态变量 `url` 的变化而改变，因此它才应该被添加为依赖项。这不仅简化了事情，而且更符合逻辑。\n\
    \n然而，React 无法在不实际执行函数并查看结果的情况下将函数与之前的版本进行比较，但一旦你执行了函数，就没有必要再回头了。还记得我们在 `useEffect`\
    \ 中是如何解决类似问题的吗？是的，依赖数组来救场！但是，如何为独立函数指定依赖数组呢？\n\n这里，你可以使用一个名为 `useCallback` 的新钩子。这个钩子允许你创建记忆化函数，只有当传递给它的依赖数组发生变化时，函数的标识才会改变。以下是上面相同的示例，但这次使用了记忆化函数：\n\
    \n```\nconst someAsyncOperation = useCallback(async () => {\n  // 更多代码\n  return\
    \ await fetch(url)\n}, [url])\n```\n\n```\nuseEffect(() => {\n  // 一些长代码....\n\
    \  someAsyncOperation().then(r => {\n    setResult(r)\n  })\n}, [someAsyncOperation])\n\
    ```\n\n这里，我们可以看到我们现在将 `someAsyncOperation` 作为主要副作用函数的依赖项传递，并将 `url` 作为 `someAsyncOperation`\
    \ 函数本身的依赖项传递。这保持了秩序，并允许你编写可读且干净的代码。\n\nReact 还有更多内置钩子，我们将在接下来的章节中逐步了解。\n\n# 自定义钩子\n\
    \n既然我们已经对 React 钩子及其底层工作原理有了实用的了解，那么为自己的用例创建简单的自定义钩子就相当简单了。让我们从一个简单的例子开始。还记得我们说过\
    \ `useState` 在状态更新时不提供回调函数吗？让我们将其实现为一个自定义钩子。\n\n```\nimport { useState, useEffect\
    \ } from 'react'\n\nconst useStateCB = (initState: any, cb: Function) => {\n \
    \ const [state, setState] = useState(initState)\n  useEffect(() => cb(state),\
    \ [state])\n  return [state, setState]\n}\n\nexport default useStateCB\n```\n\n\
    我们可以创建一个名为 `useStateCB.ts` 的文件，内容如上，然后导入这个*钩子*并在任何地方使用它！那么它是如何工作的呢？\n\n当你调用 `useStateCB(\"\
    test\", updatedState => console.log(updatedState))` 时，你实际上是在设置两个钩子——原始的 `useState`\
    \ 钩子和 `useEffect` 钩子。`useEffect` 钩子用于*监视*我们的 `useState` 钩子，一旦*状态*发生变化，我们就用新状态调用传入的回调函数。还记得吗？`useEffect`\
    \ 钩子每次渲染时总是使用最新的状态值运行。通过这种方式，你可以使用一些基本的钩子来定制满足自己需求的自定义钩子。\n\n# 类组件\n\n以下是一个用 TypeScript\
    \ + React 编写的基于类的组件的简单示例：\n\n```\nimport React from 'react'\nimport ReactDOM from\
    \ 'react-dom'\n\nclass App extends React.Component<{}, {}> {\n  render() {\n \
    \   return <p>Hello World</p>\n  }\n}\n\nReactDOM.render(<App />, document.getElementById('root'))\n\
    ```\n\n这里，我们创建了一个名为 `App` 的组件，它继承了 `React.Component` 类。查看后你会发现，`React.Component`\
    \ 类提供了许多有用的功能，使我们能够在基于类的组件中使用生命周期方法和状态。我们可以在这里指定 props 和 state 的类型 `<{}, {}>`。\n\
    \n# Props\n\n我们在函数式组件中讨论过 props，以及它们如何作为组件可以传递给其子组件的一小部分数据，以及组件如何定义自身。以下是另一个接收\
    \ prop 的示例：\n\n```\nclass App extends React.Component<{ prop1: string }, {}> {\n\
    \  render() {\n    return <p>Hello World. Prop1 says {this.props.prop1}</p>\n\
    \  }\n}\n\nReactDOM.render(<App prop1=\"something\" />, document.getElementById('root'))\n\
    ```\n\n我们使用 TypeScript 指定了可以接收的 props 的类型，然后在渲染组件时传递了 `prop1`。最后，我们使用 `this.props`\
    \ 对象访问了传递的 prop。`this.props` 对象由 React 填充，键是 props 的名称，值是传递给它们的值。\n\n就像在函数式方式中一样，你可以传递任何东西，甚至函数，作为\
    \ props，因为 JavaScript 拥有一等函数。\n\n此外，我们看到有一个名为 `render` 的方法，它负责 React 显示的 UI。无论你在基于类的组件中做什么，从\
    \ render 方法返回的内容是唯一会在屏幕上对用户可见的内容（除非你尝试直接自己修改 DOM——这在使用 React 时当然是一种不好的做法）。\n\n\
    # State\n\n在类组件中管理状态非常直接。开箱即用，React 允许你创建一个名为 `state` 的特殊变量。React 还提供了一个 `setState`\
    \ 函数，允许 React 修改状态对象（并随后重新渲染）。如果你想知道这个实现来自哪里，可以看到我们继承了 `React.Component` 类，该类包含了上述功能。\n\
    \n以下是一个简单的示例，演示了基于类的组件中的状态：\n\n```\nclass App extends React.Component<{}, { name:\
    \ string }> {\n  state = {\n    name: 'Mehul'\n  }\n  render() {\n    return <p>{this.state.name}</p>\n\
    \  }\n}\n```\n\n这里我们再次看到，我们可以用 TypeScript 指定状态的类型，然后继续用默认值初始化状态。那么区别在哪里呢？区别在于我们开始使用\
    \ `this.setState` 函数时。调用该函数后，React 会更新我们的状态对象，并自动重新渲染，必要时将更新应用到组件。例如：\n\n```\n\
    class App extends React.Component<{}, { num: number }> {\n  state = {\n    num:\
    \ Math.random()\n  }\n  changeNum() {\n    this.setState({\n      num: Math.random()\n\
    \    })\n  }\n  render() {\n    return <p onClick={() => this.changeNum()}>{this.state.num}</p>\n\
    \  }\n}\n```\n\n点击 `p` 标签时，我们会看到状态变量改变了 `num` 属性，并将其设置为一个新的 `Math.random` 值。看看它与函数式组件有何不同。在函数式组件中，状态永远不会被修改，而是在新的渲染中，钩子返回不同（且更新后）的值。然而，在基于类的组件中，React\
    \ 本身会修改 `this` 关键字，以根据正确的行为更新 props 和 state。这表明，尽管函数式组件和基于类的组件可能看起来只是彼此的语法糖，但它们在核心工作方式上有着根本的不同。\n\
    \n# 生命周期方法\n\nReact 提供了一系列生命周期方法，让你可以将代码放入其中，并完全控制组件的渲染机制。让我们从这些方法开始，并在每个组件中看一个简单的示例。此外，我们可以探讨它们与钩子的区别，以及钩子可能的行为替代方案。\n\
    \n## constructor\n\n如果你有面向对象编程的背景，你会知道 `constructor` 是创建对象时运行的第一个方法。尽管 JavaScript\
    \ 不遵循基于类的继承，但它在 ES6 中引入的类的语法糖与这种模式非常相似。\n\n"
- fmt: "\nThis is not a lifecycle method provided by React, but rather the language\
    \ itself. However, you could do all of the initialization work here, that is,\
    \ initializing your state, setting up any global event listeners (like window\
    \ resize, and so on) and get ready for your component to get mounted.\n\n## static\
    \ getDerivedStateFromProps\n\nThis method was added in v16.3 and simply allows\
    \ you to update the state to match the props if required. The method `getDerivedStateFromProps`\
    \ runs before the render method both on the first mount and subsequent mounts.\
    \ It is static and you should not perform side effects (like animations or network\
    \ requests) in this method.\n\nIn fact, React docs recommend that in most cases\
    \ you don’t need to implement this lifecycle method anyway. Most of your work\
    \ could be done by the other ones we’ll discuss now:\n\n```\nstatic getDerivedStateFromProps(props,\
    \ state) {\n  if (props.email !== state.email) {\n    return {\n      email: props.email\n\
    \    }\n  }\n  return null\n}\n```\n\nYou see that we return `null` if there’s\
    \ no update, indicating that we do not intend to update the state of the component.\
    \ Whatever you return would be updated as the state of the component.\n\n## render\n\
    \nThis is the only method which is mandatory to be present in a class based React\
    \ component. That is because React is a UI library and the point of using a component\
    \ is to spit out some visual information to the user. So if you’re using React\
    \ component, `render` method is a must to define. Whatever you return from this\
    \ method gets displayed on the screen. Here’s a simple example:\n\n```\nrender()\
    \ {\n  return <p>Hello world!</p>\n}\n```\n\n## getSnapshotBeforeUpdate\n\nReact\
    \ calls this method before react actually writes anything to the browser, that\
    \ is, to the DOM. At this point, render has been called but the DOM has not been\
    \ updated. Again, as the docs says, this method has specific use cases only, but\
    \ it’s always good to know about the available methods. You have to return a “snapshot”\
    \ value from this method which then you’ll be able to access in another lifecycle\
    \ method called `componentDidUpdate`. Here’s an example:\n\n```\ngetSnapshotBeforeUpdate(prevProps,\
    \ prevState) {\n  if (prevProps.prop1 !== this.props.prop1) {\n    return \"Prop\
    \ mismatch\";\n  }\n  return null\n}\n```\n\nReturning `null` indicates that there\
    \ was no snapshot to be captured. And then we could access it in the `componentDidUpdate`\
    \ as we’ll see now.\n\n## componentDidMount\n\nThe method `componentDidMount`\
    \ is called once react is finished mounting the component. But not so fast! The\
    \ component is still not visible to the user as it has not been written to the\
    \ DOM yet. So what does it mean to be mounted? It means that the component has\
    \ been mounted in the virtual DOM of the React and is ready to be pushed to the\
    \ DOM. At this moment, if you call `setState`, React would perform a component\
    \ re-render but would not show the intermediate state of the component.\n\n##\
    \ componentDidUpdate\n\nThis method is called by React when your component updates.\
    \ On the initial mount, this method is not called. This gets called with three\
    \ parameters - `prevProps`, `prevState` and `snapshot` which are previous props,\
    \ previous component state and the snapshot from `getSnapshotBeforeUpdate` method\
    \ as discussed above. Here’s a simple example:\n\n```\ncomponentDidUpdate(prevProps,\
    \ prevState, snapshot) {\n  if (this.props.id !== prevProps.id) {\n    // perform\
    \ a new network request and update state\n  }\n}\n```\n\n## componentWillUnmount\n\
    \nAs the name suggests, this method is fired when your component is being unmounted.\
    \ This is the best place for cleanup of global event listeners, cancelling network\
    \ requests and timers, and so on. This is the last lifecycle React would ever\
    \ call in a component’s lifetime.\n\nHere’s a beautiful open source illustration\
    \ I found for lifecycle methods of React:\n\n![](images/image3.jpg)\n\n**Figure\
    \ 3.8**\n\n## Conclusion\n\nThis chapter was an important one as it introduced\
    \ us to components - functional and class based. Additionally, we learned about\
    \ hooks, how they work under the hood and how you could create custom hooks. Further,\
    \ we saw how to work with class based components as well and why React sees functional\
    \ components as the future of the library. We’ll keep covering more React topics\
    \ in depth in the chapters further.\n\n## Questions\n\n1.  What is the difference\
    \ between class and functional components?\n\n2.  Transpile the following into\
    \ valid JS: `<p><span>Hello</span> World</p>`\n\n3.  Is `useState` synchronous?\
    \ Why/Why not?\n\n4.  What does the dependencies array of `useEffect` hook do?\n\
    \n5.  Does the `useEffect` hook run before or after the component is rendered/updated?\n\
    \n6.  Why does hook have no “lifecycle methods” concept? How does it differ fundamentally\
    \ from the class-based model of lifecycles?\n\n# CHAPTER 4\n\n## Application State\
    \ Management in React\n\nIn the last chapter, we got our basic and solid understanding\
    \ of components and the ways to create and work with them. One thing we noticed\
    \ is that most components are truly useful when they have some sort of state associated\
    \ with them, that is, the components “remember”. That being said, React does a\
    \ great job with the hooks like `useState` and the `this.state` object for functional\
    \ and class-based components, respectively. But as your code grows, there’s a\
    \ necessity of managing state in a more organized way, avoid prop drilling and\
    \ make things cleaner, especially when there has to be an information exchange\
    \ among different components at different levels of nesting.\n\nThis could be\
    \ referred to as managing the state of the application. Let’s see how we could\
    \ work with it.\n\n### Structure\n\n*   Communication between components\n*  \
    \ Using Context API\n    *   `createContext`\n    *   `useContext`\n*   `useReducer`\
    \ hook\n*   Redux as an alternative\n\n### Objectives\n\nIn this chapter, we aim\
    \ to cover basic out of the box functionality which react provides us to manage\
    \ state in our applications. In most of the cases, it would be all one would need\
    \ for his/her projects, and even a bit beyond. For very advanced cases, we’ll\
    \ use a reducer based pattern like Redux. Since React 16.8 hooks, React provides\
    \ an out of the box solution similar (but less powerful) to redux. Let’s learn\
    \ all about that in this chapter.\n\n### Communication between components\n\n\
    If you think about it, managing application state is roughly another way of saying\
    \ effective communication of some information among a lot of components.\n\nAlthough\
    \ you could have a local state in components, things get tricky when you want\
    \ to communicate between components, especially when it is up the component hierarchy\
    \ or even be very far relatives in the tree. This happens all the time. Consider\
    \ you logout from a website using a link in the content area, this information\
    \ should be dispatched to the header, which is a completely different component,\
    \ so that header could update the links back to the ones to be shown to an unauthenticated\
    \ user.\n\nLet’s see some common ways we’ll learn in this chapter to communicate\
    \ between the components:\n\n*   Props (parent to child data flow)\n*   Refs (Calling\
    \ child methods from a parent)\n*   Context API\n*   Redux (Centralized state)\
    \ (in later chapters)\n\nIt is interesting to note that with a slight trick, it\
    \ is possible to use Context API to have two-way communication, however redux\
    \ is truly decoupled and centralized state store. Redux is the go-to choice for\
    \ intermediate to advanced applications because of its unidirectional data flow\
    \ (careful! This doesn’t mean that it can only communicate in one way), centralized\
    \ state share and great debugging tools. Let’s take a look at props first.\n\n\
    ### Prop drilling\n"
