  trans: "\n\n4. 你的浏览器理解这个请求，如果仔细观察，你会发现请求中没有任何可读内容。它只是链接到一堆 CSS 和 JS 文件。\n\n5. 你的浏览器下载这些\
    \ JS 文件。\n\n6. 你的浏览器解析并运行这些 JS 文件（实际上是你编写的 React 代码）。\n\n7. 根据 React 代码，你的浏览器向服务器发出另一个\
    \ HTTP 请求，以获取 React 应用所需的数据。\n\n8. 最后，当数据可用时，首次有意义的内容渲染完成并呈现给用户。\n\n9. 此时 DOM\
    \ 中填充了你期望看到的所有 HTML。以下是一个来自 codedamn.com 的使用 React 的示例：\n\n服务器实际返回的响应：\n\n![](img/image51.jpg)\n\
    \n**图 5.2**\n\n最终渲染的 DOM：\n\n![](img/image9.jpg)\n\n**图 5.3**\n\n这种方法当然没问题。但还有另一种方式。你选择\
    \ React 是因为其灵活性和健壮性，这些特性隐藏在底层。但如果你希望页面完全渲染，而不是让浏览器为每个请求来回奔波呢？\n\n这时，**服务端渲染**（**SSR**）就派上用场了。顾名思义，服务端渲染意味着你的服务器将\
    \ React 代码渲染成你上面看到的类似 DOM 的代码，这样浏览器就可以直接渲染，无需或只需极少的 JS 支持。在此之前，我们先回答一些关于 SSR 的常见问题。\n\
    \n# 什么是服务端渲染？\n\n顾名思义，你在服务器上渲染页面并将其交付给客户端，而不是让客户端（浏览器）使用你编写的 JavaScript 自行渲染页面。服务端渲染将客户端的一个步骤移回服务器，即解析\
    \ React 代码逻辑。本质上，SSR 意味着后端完成大部分工作并将页面交付给前端，而不是客户端大量使用 JS 进行路由和状态管理。这正是过去使用 PHP\
    \ 的应用程序的工作方式。但随着 JS 标准的提升以及性能更好的设备和智能手机的出现，客户端渲染如今变得越来越流行。\n\n# 为什么需要服务端渲染？\n\n\
    如果客户端渲染这么好，为什么在 2020 年代我们还要考虑服务端渲染呢？SSR 有其不可忽视的优势，其中包括：\n\n1. SEO：搜索引擎喜欢读取 HTML\
    \ 标记并从中理解页面内容。大多数搜索引擎（除了像 Google 这样的高级引擎）无法真正解释大量 JavaScript，因此必须严重依赖你的“源代码”内容。而对于客户端网站，源代码几乎不包含任何内容，因此搜索引擎无法索引你的网站，从而影响排名。\n\
    \n2. 性能：使用 SSR 时性能明显提升。由于 SSR 在交付前已经渲染了页面，你无需担心 JS 代码中不同浏览器支持、不同设备支持 API 等问题，因为大部分代码根本不会交付给客户端。\n\
    \n因此，为了与搜索引擎兼容，实现 SSR 至关重要，这样你就能两全其美。\n\n# 开始使用 SSR\n\n在没有框架的情况下，使用 React 进行 SSR\
    \ 比较棘手。但我们仍会从基础开始，以便了解在使用其他框架时底层发生了什么。在开始之前，我们将重点关注 React 中的一个特殊部分：ReactDOM。\n\
    \n# ReactDOM\n\n当我们执行 `ReactDOM.render(<App />, element)` 时，实际上是在告诉 React 将 DOM\
    \ 树（你在 Web 应用中看到的 UI）与宿主树（JavaScript 中包含的 React 代码）进行匹配。\n\n我们之前讨论过 `App` 如何展开成一个嵌套对象（本质上是一棵树）。`ReactDOM`\
    \ 是该特定树的渲染器之一。你能想到其他例子吗？React Native 可以被视为另一个完整的渲染器。\n\n还有另一个渲染器叫做 `ReactDOMServer`。顾名思义，`ReactDOMServer`\
    \ 允许你编写 React 代码，然后不是将其渲染到浏览器环境中，而是在服务器上将其渲染为字符串，作为（接近）静态标记发送给客户端。\n\n现在让我们配置第一个服务端渲染的\
    \ React 应用。\n\n# SSR 项目配置\n\n1. 创建一个名为 `react-ssr` 的空目录。\n\n2. 在终端中，`cd` 进入该目录。\n\
    \n3. 执行 `npm init -y` 以使用默认的 `npm` 配置初始化项目。\n\n   先安装相关的 `npm` 包，运行以下命令：\n\n \
    \  `npm install react react-dom express --save`\n\n   其他 `dev` 依赖包括：\n\n   `npm\
    \ install @babel/core @babel/preset-react @babel/register webpack webpack-cli\
    \ --save-dev`\n\n   此时，你的 `package.json` 中的 `dependencies` 和 `devDependencies`\
    \ 部分应大致如下：\n\n   ```\n   \"dependencies\": {\n     \"express\": \"⁴.16.3\",\n\
    \     \"react\": \"¹⁶.9.0\",\n     \"react-dom\": \"¹⁶.9.0\"\n   },\n   \"devDependencies\"\
    : {\n     \"babel-loader\": \"⁸.0.6\",\n     \"@babel/core\": \"⁷.6.0\",\n   \
    \  \"@babel/preset-react\": \"⁷.0.0\",\n     \"@babel/register\": \"⁷.6.0\",\n\
    \     \"webpack\": \"⁴.19.1\"\n     \"webpack-cli\": \"³.3.2\"\n   },\n   ```\n\
    \n4. 好了。依赖项正确设置后，我们来编写一些代码。以下是我们的 `index.js` 文件：\n\n   ```\n   index.js\n\n  \
    \ require(\"@babel/register\")( {\n     presets: [ \"@babel/preset-react\" ]\n\
    \   } )\n\n   require( \"./src/server\" )\n   ```\n\n   这将是我们脚本的入口点。你可以看到我们直接在脚本文件中使用了\
    \ `@babel/register` 包。这允许我们在 Node 脚本中直接使用 JSX。\n\n5. 虽然也可以通过 `.babelrc` 配置 babel\
    \ 来解析服务器文件，但我们现在保持简单，采用最简方法。\n\n好了，设置好 `index.js` 文件后，我们来看 `server.js` 文件：\n\n\
    ```\n// server.js\n\nconst express = require(\"express\")\nconst app = express()\n\
    const React = require(\"react\")\nconst { renderToString } = require(\"react-dom/server\"\
    )\n\napp.get('/*', (req, res) => {\n  const jsx = <div>Hello</div>\n  const reactDom\
    \ = renderToString(jsx)\n  res.send(template(reactDom))\n});\n\napp.listen(1337)\n\
    \nfunction template(reactDom) {\n  return `\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <title>React SSR</title>\n</head>\n<body>\n  <div\
    \ id=\"root\">${reactDom}</div>\n</body>\n</html>\n`\n}\n```\n\n好的！我们来分解一下这个文件中发生的事情：\n\
    \n1. 首先，我们引入必要的模块：`express` 模块和 `react` 模块。\n\n2. 我们还引入了 `react-dom`，但注意，我们引入的是\
    \ `react-dom/server` 而不是 `react-dom`。\n\n3. 这让我们能够使用名为 `renderToString` 的方法，该方法顾名思义：不是将宿主树（JS\
    \ 中的 vDOM 表示）渲染到实际的 DOM，而是将其渲染为简单的字符串。\n\n4. 最后，我们使用 `res.send` 将响应发送回客户端。\n\n\
    5. 注意，我们使用模板函数将构建好的字符串注入到响应中。\n\n一旦我们使用 `node index.js` 启动服务器，就能看到正确的响应：\n\n![](img/image121.jpg)\n\
    \n**图 5.4**\n\n在上面的截图中，你可以看到服务器发送了 **Hello**，这实际上是运行 React 代码的结果：\n\n![](img/image81.jpg)\n\
    \n**图 5.5**\n\n当你查看页面的源代码时，如上图所示，你会发现这实际上是由服务器发送的，而不是由客户端渲染的。\n\n# 编写更多组件\n\n"
- fmt: "\nWe’ve done our basic Hello World with React SSR above, which got us into\
    \ server-side rendering for the first time using React. Let’s add some more components.\
    \ Let’s start with the Home page and About page:\n\n```javascript\n// Home.js\n\
    const React = require('react')\nfunction Home(props) {\n  return <div className=\"\
    home\">\n    <h2>Hello, this is homepage! Go to <a href=\"/about\">About</a></h2>\n\
    \  </div>\n}\nmodule.exports = Home\n```\n\nAnd the `About.js` page:\n\n```javascript\n\
    const React = require('react')\nfunction About(props) {\n  return <div className=\"\
    about\">\n    <h2>This is the about page</h2>\n  </div>\n}\nmodule.exports = About\n\
    ```\n\nBut do you see the problem above? How do we link them to each other, that\
    \ is, when you click that link on the homepage, the about page should open? Similarly,\
    \ when you directly visit `/about` the endpoint, it should directly serve that\
    \ particular page. Let’s do some routing.\n\n# [Routing in SSR](#toc.xhtml_s77a)\n\
    \nRouting is one of the most important aspects of a web app these days, especially\
    \ if it is a bit complex. It allows you to serve different content on different\
    \ URL paths.\n\nLet’s start by installing the react-router package, which would\
    \ help us to implement the routing.\n\n`npm install react-router-dom --save`\n\
    \nOnce you do that, we’re good to make some changes. Let’s change our `server.js`\
    \ file a bit:\n\n```javascript\n// server.js\nconst express = require(\"express\"\
    )\nconst app = express()\nconst React = require(\"react\")\nconstReactDOMServer\
    \ = require(\"react-dom/server\")\nconst { StaticRouter, Switch, Route } = require(\"\
    react-router-dom\")\nconst Home = require('./components/Home')\nconst About =\
    \ require('./components/About')\napp.get('/*', (req, res) => {\n  constjsx = <StaticRouter>\n\
    \    <Switch>\n      <Route path=\"/\" component={Home} exact={true} />\n    \
    \  <Route path=\"/about\" component={About} exact={true} />\n    </Switch>\n \
    \ </StaticRouter>\n  constreactDom = ReactDOMServer.renderToString(jsx)\n  res.send(template(reactDom))\n\
    });\napp.listen(1337)\nfunction template(reactDom) {\n  return '\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"utf-8\">\n<title>React SSR</title>\n</head>\n\
    <body>\n<div id=\"root\">${reactDom}</div>\n</body>\n</html>\n'\n}\n```\n\nAlright!\
    \ Let’s see what changed here:\n\n*   We included the `StaticRouter`, `Switch`\
    \ and `Route` modules from the `react-router-dom` package.\n*   `StaticRouter`\
    \ is a simple router in which the location is never changed. This is okay because\
    \ we’re rendering the React string on the server anyway, and there’s no user interaction\
    \ involved.\n*   Then we defined the `Switch` to match the first route, and then\
    \ the `Route` which contains additional information on which component to display\
    \ on which particular route.\n\nIf we visit the page right now, it willshow us\
    \ the homepage:\n\n![](images/image10.jpg)\n\n**Figure 5.6**\n\nBut if you go\
    \ to `/about`the route, it’ll still show the same homepage component only, as\
    \ shown in the following screenshot:\n\n![](images/image23.jpg)\n\n**Figure 5.7**\n\
    \nThe preceding screenshot still shows the `Home` component being rendered. Why\
    \ is that? See closely, our `StaticRouter`, although static, still needs to know\
    \ the correct location in order to parse the proper route. We are missing the\
    \ location prop on a static router. Also, for express, `req.url` gives us the\
    \ requested path (that is, `/about` or `/` or `/test`) which is what we need to\
    \ feed into our `StaticRouter`. Let’s make the following change in the `server.js`\
    \ file:\n\n```javascript\n<StaticRouter location={req.url}>\n  <Switch>\n    <Route\
    \ path=\"/\" component={Home} exact={true} />\n    <Route path=\"/about\" component={About}\
    \ exact={true} />\n  </Switch>\n</StaticRouter>\n```\n\nSo we just added `location={req.url}`\
    \ to our `StaticRouter`. Once we do this, now if you go to `/about` directly,\
    \ we’ll be served with `/about` component:\n\n![](images/image32.jpg)\n\n**Figure\
    \ 5.8**\n\nIn the preceding screenshot, we see that our problem is fixed. It correctly\
    \ renders the `About` component on the correct URL path. So far, so good. But\
    \ we can still do better than this.\n\n# [Client-Side React](#toc.xhtml_s78a)\n\
    \nReact is aclient-side library. However, in the above SSR react, we’ve seen that\
    \ we could write React-like markup on a server and send it to our client machine\
    \ using a static router-based system. But in the process, we lost the actual “React”\
    \ code on the frontend. Let’s bring it back.\n\nLet’s create another file called\
    \ `client.js`, and write the following code inside it:\n\n```javascript\nimport\
    \ React from 'react'\nimport ReactDOM from 'react-dom'\nimport Home from './components/Home'\n\
    import About from './components/About'\nimport { BrowserRouter as Router, Route,\
    \ Switch } from 'react-router-dom'\nconstjsx = (\n  <Router>\n    <Switch>\n \
    \     <Route path=\"/\" component={Home} exact={true} />\n      <Route path=\"\
    /about\" component={About} exact={true} />\n    </Switch>\n  </Router>\n)\nconst\
    \ app = document.getElementById('root')\nReactDOM.hydrate(jsx, app)\n```\n\nWe\
    \ would place this file with the `server.js` file. And just to be clear on the\
    \ file structure, here are all the files organized till now:\n\n![](images/image111.jpg)\n\
    \n**Figure 5.9**\n\nThe preceding screenshot shows the file structure organized\
    \ in the project. What you would’ve seen in the preceding code, is that we’re\
    \ using something called `ReactDOM.hydrate` instead of `ReactDOM.render`, we would\
    \ come to this later in this section.\n\nFirst, let us set up other things. We\
    \ would also modify our server.js file to include our client.js file. This is\
    \ how the `server.js` file should look finally:\n\n```javascript\nconst express\
    \ = require(\"express\")\nconst app = express()\nconst React = require(\"react\"\
    )\nconstReactDOMServer = require(\"react-dom/server\")\nconst { StaticRouter,\
    \ Switch, Route } = require(\"react-router-dom\")\nconst Home = require('./components/Home')\n\
    const About = require('./components/About')\napp.use(express.static(path.resolve(__dirname,\
    \ '../dist')))\napp.get('/*', (req, res) => {\n  console.log(req.url)\n  constjsx\
    \ = <StaticRouter location={req.url}>\n    <Switch>\n      <Route path=\"/\" component={Home}\
    \ exact={true} />\n      <Route path=\"/about\" component={About} exact={true}\
    \ />\n    </Switch>\n  </StaticRouter>\n  constreactDom = ReactDOMServer.renderToString(jsx)\n\
    \  res.send(template(reactDom))\n});\napp.listen(1337)\nfunction template(reactDom)\
    \ {\n  return '\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>React\
    \ SSR</title>\n</head>\n<body>\n<div id=\"root\">${reactDom}</div>\n<script src=\"\
    ./app.bundle.js\"></script>\n</body>\n</html>\n'\n}\n```\n\nFocus on lines in\
    \ bold. Firstly, in the express server, we’re configuring to serve our static\
    \ files (that is, the client-side bundle file which we created above).\n\nThen\
    \ we included the script itself in the HTML response.\n\n# [ReactDOM.hydrate](#toc.xhtml_s79a)\n\
    \nInstead of making use of `ReactDOM.render`, we’re making use of `ReactDOM.hydrate`.\
    \ `ReactDOM.hydrate`, as the name says, just *hydrates* the existing layout, it\
    \ doesn’t create the layout and replaces it in DOM. `ReactDOM.hydrate` knows that\
    \ the layout string is coming from the server, so it just needs to sync the client-side\
    \ JS (i.e. events and listeners) with the coming server-side HTML code. Hence,\
    \ we make use of the hydrate method.\n\nOne interesting thing here to note is\
    \ that `ReactDOM.hydrate` expects the layout you provide on the frontend (in client.js)\
    \ to be close to that coming from the backend (`server.js`), otherwise it’ll create\
    \ problems for you.\n\nFinally, let’s set up webpack for frontend so that we canmake\
    \ use of the import/export syntax and actually use React on the frontend.\n\n\
    We already installed webpack earlier, so just go ahead and create a webpack.config.js\
    \ file like this:\n\n```javascript\nconst path = require('path')\nmodule.exports\
    \ = {\n  mode: 'development',\n  devtool: 'source-map',\n  entry: {\n    app:\
    \ './src/client.js',\n  },\n  module: {\n    rules: [\n      {\n        test:\
    \ /\\.jsx?$/,\n        exclude: /(node_modules|bower_components)/,\n```\n"
