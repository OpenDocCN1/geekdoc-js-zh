    \ {\nextensions: ['*', '.js', '.jsx']\n},\ndevServer: {\ncontentBase: path.join(__dirname,\
    \ 'src')\n},\nplugins: [new HtmlWebpackPlugin({\ntemplate: path.join(__dirname,\
    \ 'src/index.html')\n})]\n};\n```\n\n*   This simply tells the webpack that hey\
