    \ look at what’s going on in the webpack config file:\n\n*   We’re setting up\
    \ an entry point as the `src/client.js` file.\n*   We only have a single rule,\
    \ whenever you see a JS or JSX file, let `babel-loader` handle it.\n*   Babel\
