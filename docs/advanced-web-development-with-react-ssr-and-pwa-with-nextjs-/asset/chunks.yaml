    \ run `npm start` in your project’s root directory. Your web browser should open,\
    \ and Hello World should appear on your screen.\n\nFor this course, however, we’ll\
    \ be making use of `create-react-app` approach as it abstracts away all the webpack\
    \ and babel configuration and gives us a great opportunity to write and focus\
    \ on our React code.\n\n# JSX\n\nLet’s dive a little into JSX, the weird HTML\
    \ syntax that we just wrote in JavaScript file:\n\n`ReactDOM.render(<div>Hello\
    \ World</div>, document.getElementById('root'))`\n\nDo you see what we did there?\
    \ You can see a div tag written directly, without the quotes. That is JSX. JSX\
    \ stands for JavaScript eXtensible markup language.\n\nJSX is a different syntax.\
    \ It allows you to harness the simplicity of the HTML markup, whilst making powerful\
    \ JavaScript computation together. You can include JavaScript expressions, dynamic\
    \ props (properties, or what we call attributes in regular HTML), and handling\
    \ UI and functionality at the same time.\n\nYou could also write expressions in\
    \ JSX using curly braces. Consider the following JSX example:\n\n`const elem =\
    \ <div>Hello World { document.location.href } { 5 + 5 } { 'Regular string' } </div>`\n\
    \nThis is a completely valid JSX syntax, but definitely not valid JavaScript.\
    \ So, what happens under the hood?\n\n`JSX transformation`\n\nReact compiles down\
    \ JSX to normal ES5 code. Consider the following example:\n\n`const elem = <div\
    \ className=\"a-classy-div\">JSX seems so cool!</div>`\n\nThis example is compiled\
    \ to the following:\n\n`const elem = React.createElement('div', { className: 'a-classy-div',\
    \ 'JSX seems so cool!' })`\n\nThe latter definitely looks like a valid JavaScript\
    \ syntax. This is the magic of JSX. You get a visual aid of writing the React\
    \ components, because now you can easily avoid the cumbersome, additional JavaScript\
    \ code that you have to write for the UI part.\n\nIn fact, the preceding two code\
    \ snippets are the same, which means that instead of JSX you could directly write\
    \ that `React.createElement` part. But of course, JSX is much cleaner to eyes\
    \ than the barebones JS, for UI development.\n\n# Moving to TypeScript\n\nNow\
    \ that we’re up and running with a basic JavaScript project in React, it’s time\
    \ to introduce TypeScript. We’ll not be focusing too much TypeScript with all\
