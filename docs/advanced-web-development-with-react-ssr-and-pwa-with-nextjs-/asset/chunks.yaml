    \nThis chapter aims to introduce you to the concept of server-side rendering using\
    \ React and discuss why it is a good option to go about if you’re just starting\
    \ off with a project and need SEO and performance to be of no-compromise-area.\
    \ We’ll see how we can do Hello World with React SSR by creating a very simple\
    \ project, and then proceed to add more and more functionality to it. Finally,\
    \ we would conclude with the strong argument why it is a good idea to choose a\
    \ server-side rendering framework like `Next.js` for React to work on medium to\
    \ large scale SSR apps built with React.\n\n# [React on Server](#toc.xhtml_s70a)\n\
    \nCurrently, what happens when you use a React application is the following:\n\
    \n1. You visit the page (let’s say [http://example.com](http://example.com))\n\
    2. The page makes a request to the remote server.\n3. The remote server sends\
    \ you just a little HTML response like this:\n\n![](images/image42.jpg)\n\n**Figure\
    \ 5.1**\n"
