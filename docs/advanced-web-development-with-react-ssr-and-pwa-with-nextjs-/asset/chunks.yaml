    \n**Figure 4.2**\n\nNotice that we’re using `create-react-app`.\n\nOkay, so now\
    \ you can see we have a button saying **Click here to turn on dark mode**. On\
    \ clicking this, we would add **dark** class to our body and the CSS would take\
    \ care from there. But what about other changes? Like we want to change the logo\
    \ from red logo to white logo if we’re indark mode, give the Header component\
    \ the logged in (assumed) user’s username, and make sure the article component\
    \ knows about the global dark mode state.\n\nLet’s use context API to fill these\
    \ gaps. We’ll create a context which we would be usedin different components.\n\
    \n# Context.Provider\n\nBuilding upon our previous work, let’s take a look at\
    \ our `Component1.tsx` file:\n\n```\nimport React, { createContext, useState }\
    \ from ‘react’\nimport Header from ‘./Header’\nimport Content from ‘./Content’\n\
    import Footer from ‘./Footer’\nimport ‘./global.css’\n\ntype Context = {\n  theme:\
    \ string\n  name: string\n  logo: string\n}\n\nconstStateContext = createContext<Partial<Context>>({})\n\
    export { StateContext }\n\nconstComponent1: React.FC = () => {\n  const [theme,\
    \ setTheme] = useState<string>(‘light’)\n  const defaults = {\n    get theme()\
    \ {\n      return theme\n    },\n    set theme(value) {\n      document.body.classList.remove(‘dark’,\
    \ ‘light’)\n      document.body.classList.add(value)\n      setTheme(value)\n\
    \    },\n    name: ‘Mehul’,\n    get logo() {\n      return this.theme === ‘dark’\
    \ ? ‘white-logo’ : ‘red-logo’\n    }\n  }\n\n  return (\n    <StateContext.Provider\
    \ value={defaults}>\n      <Header />\n      <Content />\n      <Footer />\n \
    \   </StateContext.Provider>\n  )\n}\n\nexport default Component1\n```\n\nYou\
    \ see, we’ve added another variable named context outside the component definition,\
    \ which has the value of `createContext({})`.\n\nThis creates a consumer and provider\
    \ which you could use across the app to access the data. Let’s see how.\n\nWe\
    \ supply a type to this using TypeScript that indicates the value we’ll be using\
    \ inside this context. This would also be used as the default value for this context;\
    \ we don’t specify it in the `Provider`.\n\nWhen we call `createContext`, it creates\
    \ two React elements, `Context.Provider` and `Context.Consumer`. Whenever you\
    \ wrap elements inside `Context.Provider`, you can access that particular context\
    \ inside the child elements. As you can see above, we wrapped our app essentially\
    \ in `<StateContext.Provider>`.\n\nWith the `useContext` hook, however, we can\
    \ access the consumer part of the context in a breeze. See the following usage\
    \ of `useContext`.\n\n# useContext hook\n\nOur updated `Header.tsx` file:\n\n\
    ```\nimport React, { useContext } from ‘react’\nimport { StateContext } from ‘./Component1’\n\
    \nconst Header: React.FC = () => {\n  const state = useContext(StateContext)\n\
    \n  return (\n    <header>\n      <h1>Welcome to my site!</h1>\n      <p>Hello\
    \ {state.name}</p>\n    </header>\n  )\n}\n\nexport default Header\n```\n\nSee\
    \ how convenient it is to access the name! It gets really interesting once we\
    \ add dynamic functionality to play. Let’s modify our CSS file first for dark\
    \ mode:\n\n```\n/* existing css here */\n/* dark mode */\n.dark {\n  background:\
    \ black;\n  color: rgb(194, 194, 194);\n}\n.dark header {\n  border-bottom: 1px\
    \ solid rgb(56, 56, 56);\n}\n.dark aside, .dark article {\n  background: rgb(53,\
    \ 53, 53);\n}\n```\n\nAnd now, let’s make the button functional on `RightArticle.tsx`:\n\
    \n```\nimport React, { useContext } from ‘react’\nimport { StateContext } from\
    \ ‘./Component1’\n\nconstRightArticle: React.FC = () => {\n  const state = useContext(StateContext)\n\
    \n  function toggleTheme() {\n    if(state.theme === ‘dark’) {\n      state.theme\
    \ = ‘light’\n    } else {\n      state.theme = ‘dark’\n    }\n  }\n\n  return\
    \ (\n    <article>\n      <h2>This is my site!</h2>\n      <p>It is very nice</p>\n\
    \      <p>The mode right now is: {state.theme}</p>\n      <button onClick={toggleTheme}>Click\
    \ here to turn on dark mode</button>\n    </article>\n  )\n}\n\nexport default\
    \ RightArticle\n```\n\nFinally, we could implement the image part as well:\n\n\
    `Sidebar.tsx`\n\n```\nimport React, { useContext } from ‘react’\nimport { StateContext\
    \ } from ‘./Component1’\n\nconst Sidebar: React.FC = () => {\n  const { logo }\
    \ = useContext(StateContext)\n\n  return (\n    <aside>\n      <h2>Wow this is\
    \ a nice sidebar</h2>\n      <p>See my logo</p>\n      <imgsrc={‘https://codedamn.com/assets/images/${logo}.png’}\
    \ />\n    </aside>\n  )\n}\n\nexport default Sidebar\n```\n\nAnd `Footer.tsx`:\n\
    \n```\nimport React, { useContext } from ‘react’\nimport { StateContext } from\
    \ ‘./Component1’\n\nconst Footer: React.FC = () => {\n  const { logo } = useContext(StateContext)\n\
    \n  return (\n    <footer>\n      <p>Copyright &copy; Me.</p>\n      <imgsrc={‘https://codedamn.com/assets/images/${logo}.png’}\
    \ />\n    </footer>\n  )\n}\n\nexport default Footer\n```\n\nThat’s it! You could\
    \ see how easy it is for parents to pass values to children and how easy it is\
    \ for children to modify values which would then allow parents to behave accordingly.\
    \ This is how the site looks in both dark and light mode:\n\nLight mode\n\n![](images/image13.jpg)\n\
    \n**Figure 4.3:** Light mode\n\n![](images/image41.jpg)\n\n**Figure 4.4:** Dark\
    \ mode\n\n# useReducer hook\n\nNow that we’ve seen how `useContext` works, we\
    \ can streamline our state of the application even further by using yet another\
    \ inbuilt hook called `useReducer` provided by React.\n\nLet’s start by decoupling\
    \ our `createContext` from the above example into a different file:\n\nThis is\
    \ our `state.ts` file:\n\n```\nimport { createContext } from ‘react’\n\ntype Context\
