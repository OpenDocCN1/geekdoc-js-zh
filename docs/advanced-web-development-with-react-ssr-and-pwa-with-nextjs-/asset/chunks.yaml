  trans: "\n来自 `Next.js` 的 `Link` API 允许你执行导航，就像我们使用 `react-router-dom` 包中的 `Link`\
    \ 组件一样。\n\n以下是使用方法。我们将更新 `index.js` 文件，将其链接到关于页面：\n\n```\n// pages/index.js\n\
    import Link from 'next/link'\nconst Home = () => {\nreturn <div id=\"home\">\n\
    <h1>This is a nice homepage</h1>\n<p>Click <Link href=\"/about\"><a>here</a></Link>\
    \ to go to about page</p>\n</div>\n}\nexport default Home\n```\n\n以下是具体说明：\n\n\
    *   首先，我们导入要使用的 `Link` 组件。\n*   接着，我们用 `Link` 组件包裹希望作为超链接的文本。\n*   注意，我们将 `href`\
    \ 属性赋予 `Link` 组件，并在其内部再次使用了 `anchor` 标签。这一点很重要，我们稍后会讲到。\n*   最后，在 `href` 属性中，我们传递了要导航到的链接。让我们看看它生成的输出：\n\
    \n    ![](img/image91.jpg)\n\n    **图 6.6**\n\n    上面的截图展示了 `Link` 组件在渲染时如何被转换为\
    \ HTML 中的常规 `anchor` 标签。\n*   太棒了！我们可以看到超链接出现在源代码中。但通过使用 `Link` 组件，`Next.js` 还自动利用\
    \ HTML5 history API 处理了客户端导航，我们无需编写任何代码。\n*   现在，当你点击 **About** 链接时，它会无缝导航到关于页面。\n\
    \n现在，让我们进一步探索这个 `Link` 组件，以及它与我们习惯在 `react-router-dom` 中看到的组件有何不同。\n\n# `Link`\
    \ 只是一个高阶组件\n\n如果你来自 `react-router-dom` 的 `Link` 组件，你可能会将这个 `Link` 与那个混淆。在 `react-router-dom`\
    \ 中，你可以直接向该组件传递 props，它会变成一个超链接并使用这些 props（如 `className`、`onClick` 等）。但 `Next.js`\
    \ 提供的 `Link` API 只是一个高阶组件，也就是说，它只是将你的子组件绑定到 history API 变化的点击事件上。它不会将你提供的 props\
    \ 传递给子组件，因此你必须对子组件进行任何所需的修改，而不是在 `Link` 组件上。\n\n例如，考虑以下代码片段。这是为 `anchor` 标签分配\
    \ class 的错误方式：\n\n```\n<p>Click <Link href=\"/about\" className=\"mylink\"><a>here</a></Link>\
    \ to go to about page</p>\n```\n\n实际上，如果你运行上述代码，你会发现 `anchor` 标签并没有被附加 `myLink`\
    \ 类。\n\n这是为 `anchor` 标签添加 class 的正确方式：\n\n```\n<p>Click <Link href=\"/about\"\
    ><a className=\"mylink\">here</a></Link> to go to about page</p>\n```\n\n# 关于\
    \ `Link` 的更多内容\n\n`Link` 组件基本上会为其子元素附加一个 `onClick` 事件。因此，如果子元素支持 `onClick` 事件，`Link`\
    \ 就能正常工作。考虑以下情况：\n\n```\n<Link href=\"/about\"><imgsrc=\"/static/profile.jpeg\"\
    \ /></Link>\n```\n\n在这种情况下，`Link` 会正常工作，导航也会发生，但 HTML 标记中不会出现带有 `href` 属性的 `a`\
    \ 标签，这可能对 SEO 不利。\n\n因此，你应该将上面的 `img` 标签包裹在 `anchor` 标签中。\n\n如果你希望 `Next.js` 在\
    \ `anchor` 标签以外的标签上显示 `href` 属性（用于调试目的），你可以像这样向 `Link` 组件传递 `passHref` 属性：\n\n\
    ```\n<Link href=\"/about\" passHref>\n<imgsrc=\"/static/profile.jpeg\" />\n</Link>\n\
    ```\n\n这将渲染出以下标记：\n\n```\n<imgsrc=\"/static/profile.jpeg\" href=\"/about\"/>\n\
    ```\n\n这在调试时很有用，当你想要找出点击特定元素时页面将被重定向到的链接时。\n\n# `Next.js` 组件\n\n页面没问题，但可复用的代码片段呢？我们显然可以创建组件文件，并将其包含在其他页面中。让我们创建一个名为\
    \ **components** 的目录，但请记住，与 pages 或 static 不同，这次目录的名称并不重要。以下是一个简单的示例：\n\n```\n\
    // components/Header.js\nimport Link from 'next/link'\nconst Header = () => (\n\
    <header>\n<Link href=\"/\">\n<a>Home</a>\n</Link>\n<Link href=\"/about\">\n<a>About</a>\n\
    </Link>\n</header>\n)\nexport default Header\n```\n\n现在，让我们在 `index.js` 文件中使用上面创建的\
    \ `Header` 组件：\n\n```\n// pages/index.js\nimport Link from 'next/link'\nimport\
    \ Header from '../components/Header'\nconst Home = () => {\nreturn <div id=\"\
    home\">\n<Header />\n<h1>This is a nice homepage</h1>\n<p>Click <Link href=\"\
    /about\" passHref><imgsrc=\"/static/profile.jpeg\" /></Link> to go to about page</p>\n\
    </div>\n}\nexport default Home\n```\n\n`About.js` 文件：\n\n```\n// pages/about.js\n\
    import Header from '../components/Header'\nconstAboutMe = () => {\nreturn (\n\
    <div id=\"about-me\">\n<Header />\n<h1>Hey Guys!</h1>\n<p>My name is Mehul and\
    \ I'm the author of this book.</p>\n<p>This book covers React and stuff</p>\n\
    <p>I like React</p>\n</div>\n)\n}\nexport default AboutMe\n```\n\n文件结构如下所示：\n\n\
    ![](img/image52.jpg)\n\n**图 6.7**\n\n上面的截图展示了此时文件结构应该是什么样子。\n\n现在你会看到，我们能够在两个页面（`About`\
    \ 和 `Home`）上复用 `Header` 组件。\n\n另外，请注意，如上所述，组件只是一个选择，你可以随意命名这个文件夹，仍然可以使用它（因为我们使用相对路径来引用该文件夹）。\n\
    \n# `Next.js` + CSS\n\n在 `Next.js` 框架中使用 CSS 有多种方式，如今在应用程序中你总会用到 CSS。让我们探索一些常见的方法。\n\
    \n# Styled JSX\n\n这种方法要求你直接在 JSX 模板中编写 CSS。让我们先看一个示例。修改我们的 `Header` 组件以包含一些样式：\n\
    \n```\n// Header.js\nimport Link from 'next/link'\nconst Header = () => (\n<header>\n\
    <style jsx>{\n'\nheader {\npadding: 20px;\nbackground: #1e1e1e;\nborder-bottom:\
    \ 1px solid black;\nfont-size: 30px;\n}\na {\ncolor: white;\nmargin-right: 30px;\n\
    }\n'\n}</style>\n<Link href=\"/\">\n<a>Home</a>\n</Link>\n<Link href=\"/about\"\
    >\n<a>About</a>\n</Link>\n</header>\n)\nexport default Header\n```\n\n这将生成以下效果图：\n\
    \n![](img/image24.jpg)\n\n**图 6.8**\n\n正如代码所描述的，上面的截图显示了预期的输出。\n\n现在，让我们查看渲染后的\
    \ HTML。当你查看时，会看到类似这样的内容：\n\n![](img/image101.jpg)\n\n**图 6.9**\n\n上面的截图展示了 Chrome\
    \ DevTools 中的输出 DOM 树。\n\n请注意，即使我们没有为 `header/anchor` 元素分配任何类，`Next.js` 也自动为我们做了这件事，以实现样式的局部作用域。这样，即使不同组件中有相同的元素，你也可以为它们设置不同的样式，而无需担心样式冲突。当你直接通过标签名或使用非常常见的类（如“container”、“block”等）来定位元素时，这非常有用。\n\
    \n但如果你确实想要全局定位呢？例如，在顶层文件中编写相同的样式以使其全局生效？为此，我们可以包含 `global` 属性。请查看以下示例：\n\n```\n\
    import Link from 'next/link'\nconst Header = () => (\n<header>\n<style jsx global>{\n\
    '\nheader {\npadding: 20px;\nbackground: #1e1e1e;\nborder-bottom: 1px solid black;\n\
    font-size: 30px;\n}\na {\ncolor: white;\nmargin-right: 30px;\n}\n'\n}</style>\n\
    <Link href=\"/\">\n<a>Home</a>\n</Link>\n<Link href=\"/about\">\n<a>About</a>\n\
    </Link>\n</header>\n)\nexport default Header\n```\n"
- fmt: "\nThis is exactly the same example as above with the exception that now we\
    \ have a global attribute in the style tag. Although the HTML part would still\
    \ include syntax for custom scoping, the CSS part is now truly global, as you\
    \ can see in the rendered output:\n\n![](images/image43.jpg)\n\n**Figure 6.10**\n\
    \nThe preceding screenshot shows how the anchor tag is rendered by our `Next.js`\
    \ code.\n\nSee, in the style section on the right, we have simply the `anchor`\
    \ tag being targeted, instead of the long class name associated with it. This\
    \ means we’re targeting all the anchor tags on the page.\n\n# Importing CSS files\n\
    \nHonestly, for me, writing CSS directly inside JSX is a bit overwhelming, and\
    \ I would like to keep it separated for clarity. Moreover, in separate files,\
    \ you’ll be able to get better syntax highlighting and error handling. Let’s see\
    \ how we can set up importing CSS files in our pages.\n\nUnlike `styled-jsx`,\
    \ CSS imports are not baked in `Next.js` by default just because there could be\
    \ many ways to achieve this. Let’s install the `@zeit/next-css` package first.\
    \ Follow the steps:\n\n1.  In your project root, do `npmi @zeit/next-css --save`\n\
    \n2.  Now, we’ve to create a `next.config.js` file in the root directory of the\
    \ project. Here’s how the file would look like:\n\n    ```\n    // next.config.js\n\
    \    constwithCSS = require(‘@zeit/next-css’)\n    module.exports = withCSS({})\n\
    \    ```\n\n3.  Restart your dev server at this point\n\n4.  You could pass additional\
    \ options in `withCSS` function, for example, using CSS modules\n\n5.  Once this\
    \ is done, let’s move our styles in a separate file\n\nHere’s how our `Header.js`\
    \ component looks finally:\n\n```\n// components/Header/index.js\nimport Link\
    \ from ‘next/link’\nimport ‘./style.css’\nconst Header = () => (\n<header>\n<Link\
    \ href=”/”>\n<a>Home</a>\n</Link>\n<Link href=”/about”>\n<a className=”special”>About</a>\n\
    </Link>\n</header>\n)\nexport default Header\n```\n\nAnd here’s how the `style.css`\
    \ file would look like:\n\n```\n// components/Header/style.css\nheader {\npadding:\
    \ 20px;\nbackground: #1e1e1e;\nborder-bottom: 1px solid black;\nfont-size: 30px;\n\
    }\na {\ncolor: white;\nmargin-right: 30px;\n}\na.special {\ncolor: yellow;\n}\n\
    ```\n\nAnd this would produce the following output:\n\n![](images/image72.jpg)\n\
    \n**Figure 6.11**\n\nThe preceding screenshot shows the output produced by the\
    \ `Header` component file we just coded.\n\nAlso, there’s a change in the file\
    \ structure for the components directory. See below:\n\n![](images/image122.jpg)\n\
    \n**Figure 6.12**\n\nThe preceding screenshot shows how the file structure looks\
    \ right now.\n\nAwesome! Let’s use CSS modules now. We can switch the site’s behaviour\
    \ to use CSS modules, which means that the class names would be randomized so\
    \ that there’s no collision between the same class names in different components.\
    \ Let’s see how this is done. Change the `next.config.js` file to the following:\n\
    \n```\n// next.config.js\nconstwithCSS = require(‘@zeit/next-css’)\nmodule.exports\
    \ = withCSS({\ncssModules: true\n})\n```\n\nOnce you do this and restart the server,\
    \ you’ll see that your `About` link is no longer yellow even though it has a special\
    \ class in the HTML markup. This is because now you have CSS modules in place,\
    \ and the class name “special” has been rewritten by the CSS module system. Now,\
    \ in order to apply a class to a particular element, you have to use the imported\
    \ styles. Change the `Header.js` file as follows:\n\n```\nimport Link from ‘next/link’\n\
    import css from ‘./style.css’\nconst Header = () => (\n<header>\n<Link href=”/”>\n\
    <a>Home</a>\n</Link>\n<Link href=”/about”>\n<a className={css.special}>About</a>\n\
    </Link>\n</header>\n)\nexport default Header\n```\n\nAnd this should work now!\
    \ See the HTML markup, and it is a completely random class name. This is basically\
    \ the webpack CSS loader, and you can customize it, even more, using the options\
    \ present in webpack docs: [https://github.com/webpack-contrib/css-loader](https://github.com/webpack-contrib/css-loader).\n\
    \n# Conclusion\n\nThis chapter introduced us to the Next.js framework and helped\
    \ us understand some of its core concepts in order to get started with it and\
    \ set up certain aspects of it.\n\nWe learned about what Next.js is, bootstrapping\
    \ our first project with it and seeing under the hood how the response sent to\
    \ the browser is truly rendered HTML.\n\nIn the next chapter, we’ll see how we\
    \ can work even more with this framework and dive deeper under the hood to see\
    \ how Next.js works and how we can tweak the framework to our needs.\n\n# Questions\n\
    \n1.  How does Next.js differ from running React on the server-side as we did\
    \ in the last chapter?\n\n2.  Consider there’s a component at `pages/myroute/index.js.`\
    \ Would it be accessible at `localhost:3000/myroute` when running in development\
    \ mode?\n\n3.  How do you host a file `robots.txt` on the root path, that is,\
    \ at `localhost:3000/robots.txt`? Where do you place the file?\n\n4.  What is\
    \ the difference between Link from Next.js and Link from `react-router-dom`?\n\
    \n5.  List some ways to use CSS with your Next.js component.\n\n# CHAPTER 7\n\n\
    # More with Next.js\n\nIn the last chapter, we learned about Next.js, what it\
    \ is, and how to spin up a basic SSR React project with it very quickly. However,\
    \ applications are often more complicated than that and require a lot of nits\
    \ and grits to be handled. In this chapter, we’ll explore some fine parts of Next.js\
    \ and see how we can incorporate them into our code. This is important as most\
    \ of the applications would sometimes need a custom tweak or changes according\
    \ to their needs. Let’s dive into it.\n\n## Structure\n\n*   Creating a Next.js\
    \ project\n*   Introduction to Redux\n*   Setting up Redux with Next.js\n*   TypeScript\
    \ + Next\n*   Creating API endpoints with Next.js\n*   Next.js custom files\n\
    *   Dynamic routing\n\n## Objective\n\nThe objective of this chapter is to spend\
    \ more time with `Next.js` framework as a whole to make ourselves comfortable\
    \ with the ecosystem and spinning up some projects in `Next.js` from scratch exploring\
    \ various `Next.js` concepts on the way.\n\n## Next.js application\n\nIn this\
    \ chapter, let’s create a `Next.js` app while discussing important concepts regarding\
    \ the application. We’ll create a login portal showing some custom values depending\
    \ on what kind of user logged in. We’ll start from the basics and learn and include\
    \ technologies like Redux eventually. Let’s start.\n\n## Getting project up\n\n\
    First things first, let’s start with a fresh `Next.js` project now. It is simple,\
    \ and we did it in the last chapter. Here are some key points we’ll take care\
    \ of this project:\n\n*   Now for this project, for now, we need a login page,\
    \ a registration page, and a dashboard page.\n*   Let’s keep our login page as\
    \ our index page for simplicity.\n*   But before anything, let’s switch to TypeScript\
    \ for Next.js (just like we did with React earlier).\n\n## Switching to TypeScript\n\
    \nTypeScript has proven itself to be a very reliable method writing JavaScript\
    \ on the scale, and almost every codebase after hitting a certain scale would\
    \ suffer from the common JavaScript pitfalls like no type checking support. TypeScript\
    \ comes very handily in this sense. It compiles down to JavaScript, at the same\
    \ time allows us to use the best version of JavaScript for developers to write.\n\
    \n*   To create a TypeScript project, let’s use the `create-next-app` utility\
    \ directly from `npx`\n*   Go to a directory where you want to set up your Next.js\
    \ (or should we call it, `Next.ts` project\n*   Run the following command:\n\n\
    \    `npx create-next-app --example with-typescript my-custom-app`\n"
