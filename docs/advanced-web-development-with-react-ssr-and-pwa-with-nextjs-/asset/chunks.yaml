  trans: "\n\n`pages`文件夹内的这个文件允许我们在各个位置（如页面头部）注入自定义标记。我们将使用以下文件来注入`manifest.json`：\n\
    \n```javascript\n// pages/_document.js\nimport Document, { Html, Head, Main, NextScript\
    \ } from 'next/document'\nclass MyDocument extends Document {\n  static async\
    \ getInitialProps(ctx) {\n    constinitialProps = await Document.getInitialProps(ctx)\n\
    \    return { …initialProps }\n  }\n  render() {\n    return (\n      <Html>\n\
    \        <Head>\n          <link rel=\"manifest\" href=\"/manifest.json\" />\n\
    \        </Head>\n        <body>\n          <Main />\n          <NextScript />\n\
    \        </body>\n      </Html>\n    )\n  }\n}\nexport default MyDocument\n```\n\
    \n就是这样！最终的文件结构如下所示：\n\n![](img/image35.jpg)\n\n**图 8.8**\n\n现在我们可以继续运行`npm run\
    \ build`和`npm start`来启动应用的生产构建。完成后，你会看到现在可以安装 PWA 的选项：\n\n![](img/image26.jpg)\n\
    \n**图 8.9**\n\n同样，在手机上，我们也能获得相同的体验：\n\n![](img/p192.jpg)\n\n**图 8.10**\n\n# 结论\n\
    \n在本章中，我们学习了渐进式 Web 应用，以及如何让我们的 React 和 Next 应用变得渐进式。我们还了解了如何在此过程中设置自定义的 Next.js\
    \ 服务器。在下一章中，我们将总结一些 React 的最佳实践以及整个库的未来。\n\n# 问题\n\n1.  什么是 PWA？\n2.  PWA 与原生应用或混合应用有何不同？\n\
    3.  Service Worker 和 Web Worker 有什么区别？\n4.  在 Next.js 框架中，`_document.js`文件的作用是什么？\n\
    5.  自定义 Next.js 服务器与在 Next.js 中编程的自定义 API 端点有何不同？\n\n# 第 9 章\n\n# 前沿 React\n\n\
    自 2013 年发布以来，React 已经走过了很长的路。如今，React 拥有全球最大的开发者社区之一。就在我们说话的当下，React 也在不断改进和发展。本章将涵盖\
    \ React 的一些前沿特性，这些特性要么仍在开发中，要么在 React 框架中处于非常实验性的阶段，并且必将塑造框架和整个社区的未来。让我们深入探讨吧！\n\
    \n# 结构\n\n*   React 的工作原理\n    *   协调器\n    *   渲染器\n*   并发模式\n*   并发模式的工作原理\n\
    *   选择加入并发模式\n*   React Suspense\n\n# 目标\n\n在最后一章中，我们将看到 React 为未来所做的一些事情。并发模式是一个重要的特性，目前开发者可以实验性地尝试。我们将在本章中学习它。\n\
    \n# React 是如何工作的？\n\n在深入探讨新技术的基础之前，了解 React 的工作原理非常重要。从较高层次来看，React 由协调器和渲染器组成。协调器是\
    \ React 在其内存中处理 DOM 树虚拟实现的方式。让我们先看一个 vDOM 中的例子。\n\n# 协调器\n\n虚拟 DOM 是 React 在内存中维护浏览器向最终用户显示的原始\
    \ DOM 副本的方式。React 协调器仅在内存中处理这棵树的创建。请注意，这棵树仍然不知道它处于哪个环境中。例如，当你编写以下 JSX 代码时：\n\n\
    ```jsx\n<div className=\"myClass\">\n  <h1>Hello World</h1>\n  <p>This is a nice\
    \ paragraph</p>\n</div>\n```\n\n这段代码会被 Babel 转译成以下内容：\n\n```javascript\nReact.createElement(\"\
    div\", {\n  className: \"myClass\"\n}, React.createElement(\"h1\", null, \"Hello\
    \ World\"), React.createElement(\"p\", null, \"This is a nice paragraph\"));\n\
    ```\n\n进一步，它在内存中表示为以下内容：\n\n```json\n{\n  \"type\": \"div\",\n  \"key\": null,\n\
    \  \"ref\": null,\n  \"props\": {\n    \"className\": \"myClass\",\n    \"children\"\
    : [\n      {\n        \"type\": \"h1\",\n        \"key\": null,\n        \"ref\"\
    : null,\n        \"props\": {\n          \"children\": \"Hello World\"\n     \
    \   }\n      },\n      {\n        \"type\": \"p\",\n        \"key\": null,\n \
    \       \"ref\": null,\n        \"props\": {\n          \"children\": \"This is\
    \ a nice paragraph\"\n        }\n      }\n    ]\n  }\n}\n```\n\n请注意，为了清晰起见，我从上面的对象中删除了一些属性。但我们之前看到的是\
    \ React 在内存中拥有的一个对象。这实际上就是 vDOM。请注意，虽然这里没有“DOM”的东西，但我们仍然将其称为虚拟 DOM，这有点不准确。\n\n\
    # 渲染器\n\nReact 的第二部分是 React 渲染器。现在，DOM 是能够使用 React 的主机环境之一。还有其他主机环境，比如 React Native（用于移动端），或者\
    \ React Hardware。渲染器基本上允许协调器与主机环境通信。\n\n例如，对于 DOM，我们知道元素是通过浏览器暴露的`document.createElement`\
    \ API 创建的。但对于移动端主机（比如 Android）来说，情况可能并非如此。在那里，你必须使用其他方式在屏幕上创建 UI 元素，但这会影响协调器吗？不会！这就是为什么将协调器和渲染器拆分成不同的包是一个很好的决定。当你为网页安装\
    \ React 时，你会安装`react`和`react-dom`这两个包。在这里，`react`包基本上是协调器，而`react-dom`包是渲染器。\n\
    \n# 从类组件迁移\n\n我完全知道 React 对基于类的组件提供了一流支持，但本章旨在介绍与 React 相关的未来技术和实验性技术，并且团队已经明确表示，未来函数组件将是开发重点。有了\
    \ Hooks，函数组件完全能够完成基于类的组件所能做的一切。如果你刚开始学习 React，我建议你只需了解基于类的组件到足以重构它们的程度，但如果你要创建自己的组件，始终使用函数组件。\n\
    \n基于类的组件有其自身的优缺点，例如，它们实际上会改变状态和 props，而函数组件则在渲染时捕获 props 和 state。这避免了讨厌的 bug。此外，函数组件是一种比类更友好的编码方式，仅仅因为\
    \ JavaScript 没有类；它只是函数的语法糖。\n\n# 并发模式\n\nReact 中的并发模式是一种全新的 React 工作方式。在计算机科学中，并发通常意味着基于时间分片执行多个任务。React\
    \ 一旦完成 vDOM 差异计算，就必须将这些更改提交到 DOM。计算 vDOM 中的更改是非阻塞的，即使现在也是如此，并且这是 React 内部的工作方式（通过调用浏览器中的`requestIdleCallback`函数利用浏览器的空闲时间，并在其他主机环境中使用不同的线程），然而提交阶段，即写入\
    \ DOM，是同步的。并发模式的一些显著特性：\n\n1.  **可中断渲染**：考虑一个包含大量项目的大列表，你可以对项目进行筛选。如果你曾经使用过这样的应用程序，你会知道它可能会变得卡顿和延迟，除非有某种`debounce`函数，该函数在用户停止输入之前不会运行搜索\
    \ JavaScript 逻辑（例如，检查最后一次按键是否在 200 毫秒之前）。并发模式通过使渲染可被高优先级中断中断来解决这个问题。用户与输入字段交互是比\
    \ React 渲染更新视图更高优先级的中断，因此 React 暂停其执行并释放主线程来处理输入。\n\n2.  **加载序列**：你是否见过这样的应用程序：即使你处于快速连接中，加载旋转器也只会出现一瞬间？并发模式也解决了这个问题。\n\
    \n"
- fmt: "\n# 3. Concurrency\n\nLast but not least, React can now work truly concurrently,\
    \ i.e. it can work on multiple state updates simultaneously. This means that if\
    \ you have some I/O bound data (HTTP network requests) to bring in some data,\
    \ React can skip over the data for a while and render views. When the data arrives,\
    \ React can simply place it there. Current standard practice is that we block\
    \ the whole view from rendering if data is not available.\n\nConcurrent React\
    \ makes code fetching, data fetching and resource fetching truly concurrent, and\
    \ if the browser supports, parallel too. As of now, concurrent React is experimental\
    \ and not stable except for code splitting. So we’ll not be using code examples\
    \ for unstable APIs.\n\n# Opting in concurrent mode\n\nThe concurrent mode in\
    \ React is opt-in right now. To use it, instead of:\n\n```\nReactDOM.render(<Component\
    \ />, container)\n```\n\nUse the following:\n\n```\nReactDOM.createRoot(container).render(<Component\
    \ />)\n```\n\nNow you’re running React in concurrent mode. This API only exists\
    \ in the experimental build, and it is very much possible that in the future you\
    \ might not need this.\n\n# Suspense – Code fetching\n\nReact comes with Suspense,\
    \ a component that handles when a part of your application is suspended due to\
    \ some reason. Basically, Suspense allows your application to wait for something.\
    \ This “something” could be any async operation - either I/O or memory bound.\
    \ Let’s see how we can make use of that with code. Take a look at the example\
    \ below:\n\n```\nimport React from 'react'\n\nconstProfilePage = React.lazy(()\
    \ => import('./ProfilePage')); // Lazy-loaded\n\n// Show a spinner while the profile\
    \ is loading\n\n<Suspense fallback={<Spinner />}>\n  <ProfilePage />\n</Suspense>\n\
    ```\n\nInstead of importing the component directly, we wrap it inside `React.lazy`\
    \ call. When this component is used, React sees that it is not available and starts\
    \ a request to fetch the code for this component.\n\nMeanwhile, React also tries\
    \ to look for a `Suspense` component as a node in the tree above it and uses the\
    \ specified `fallback` component as the placeholder for the same. So, now, as\
    \ long as `ProfilePage` is not available and ready, Suspense would show the Spinner\
    \ in its place.\n\n# Suspense – Data fetching\n\nThis is where things get interesting.\
    \ Suspense allows you to fetch data as if you were using data synchronously. This\
    \ is still experimental, so we’ll not be diving deep into the code. Also, make\
    \ sure to check the updated code if you’re reading this book in the future, as\
    \ the API might have changed. Let’s see some code!\n\n```\n// This is not a Promise.\
    \ It’s a special object from Suspense integration.\nconst resource = fetchProfileData();\n\
    \nfunction ProfilePage() {\n  return (\n    <Suspense fallback={<h1>Loading profile…</h1>}>\n\
    \      <ProfileDetails />\n      <Suspense fallback={<h1>Loading posts…</h1>}>\n\
    \        <ProfileTimeline />\n      </Suspense>\n    </Suspense>\n  );\n}\n\n\
    function ProfileDetails() {\n  // Try to read user info, although it might not\
    \ have loaded yet\n  const user = resource.user.read();\n  return <h1>{user.name}</h1>;\n\
    }\n\nfunction ProfileTimeline() {\n  // Try to read posts, although they might\
    \ not have loaded yet\n  const posts = resource.posts.read();\n  return (\n  \
    \  <ul>\n      {posts.map(post => (\n        <li key={post.id}>{post.text}</li>\n\
    \      ))}\n    </ul>\n  );\n}\n```\n\nThis code has a lot going on. Let’s break\
    \ it down.\n\n*   Firstly, we create a `resource`. This is special. This is not\
    \ a Promise or a plain object. This object is created by React which we can use\
    \ as if we have the data synchronously available with us. If not, React would\
    \ automatically search the tree for the nearest Suspense component and would let\
    \ it show the fallback loader. We’ll discuss the code for this soon! (The code\
    \ is highly experimental and is likely to change, so please don’t use it in future).\n\
    \n*   Then we read from the resource using `resource.posts.read()`. Notice that\
    \ this is performed synchronously. Internally, if data is not present, the `read()`\
    \ method actually throws under the hood for the `Suspense` component to catch,\
    \ and this way, further execution is not performed. In case data is available,\
    \ it is returned.\n\n*   Finally, we use it normally with components.\n\nLet’s\
    \ discuss how the resource is created now. Here’s the current `unstable` implementation\
    \ of `fetchProfileData`:\n\n```\nimport { unstable_createResource } from 'react-cache'\n\
    \nfunction fetchProfileData() {\n  return {\n    user: unstable_createResource(\n\
    \      () => fetch('…').then(res => res.json()) // return a Promise\n    ),\n\
    \    posts: unstable_createResource(\n      () => fetch('…').then(res => res.json())\
    \ // return a Promise\n    )\n  }\n}\n```\n\nBasically, right now, you have to\
    \ make use of `unstable_createResouce` which would probably be replaced by just\
    \ `createResource` in the future. Here, right now (this might change!) you have\
    \ to return a `Promise` which when resolved would make that particular resource\
    \ available for your React components, and your component would be able to read\
    \ the return value using `resource.read()` just like we saw in the earlier example.\n\
    \n# Conclusion\n\nIn the final chapter of this book, we learned about the upcoming\
    \ concurrent mode to React and how it would work. I hope this book gave you a\
    \ base understanding of working with React and Next as a whole and solidified\
    \ your concepts for React. After all these years working with React, I don’t think\
    \ it is just a UI library, it is a whole development ecosystem, and there’s so\
    \ much more to learn! All the best for your future endeavours.\n\n# Questions\n\
    \n1.  What is the difference between a reconciler and a renderer? Is react-native\
    \ a reconciler or a renderer?\n\n2.  Class-based components mutate the state and\
    \ props when they’re updated by parent/host, and functional components do not.\
    \ Find out how functional components work under the hood. (Hint: functional components\
    \ use hooks which return a new value on every render)\n\n3.  How is concurrent\
    \ mode different from normal React mode?\n\n4.  What is the main essence of Suspense?\
    \ (Hint: waiting for something)\n"
