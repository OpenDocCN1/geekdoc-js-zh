    \ lang=\"en\">\n    <head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n    <meta http-equiv=\"\
    X-UA-Compatible\" content=\"ie=edge\">\n    <title>React Hello World!</title>\n\
    \    </head>\n    <body>\n    <div id=\"root\"></div>\n    </body>\n    </html>\n\
    \    ```\n\n*   最后，让我们创建 `src/index.js` 并在其中写入以下内容：\n\n    ```javascript\n   \
    \ import React from 'react'\n    import ReactDOM from 'react-dom'\n    ReactDOM.render(<div>Hello\
    \ World</div>, document.getElementById('root'))\n    ```\n\n*   就是这样！现在，在你的项目根目录下运行\
    \ `npm start`。你的浏览器应该会打开，屏幕上应该会出现 Hello World。\n\n然而，在本课程中，我们将使用 `create-react-app`\
    \ 方法，因为它抽象了所有 webpack 和 babel 配置，让我们能够专注于编写 React 代码。\n\n# JSX\n\n让我们深入了解一下 JSX，即我们刚刚在\
    \ JavaScript 文件中编写的奇怪 HTML 语法：\n\n`ReactDOM.render(<div>Hello World</div>, document.getElementById('root'))`\n\
    \n你看到我们做了什么吗？你可以看到一个直接编写的 div 标签，没有引号。这就是 JSX。JSX 代表 JavaScript 可扩展标记语言。\n\nJSX\
    \ 是一种不同的语法。它允许你利用 HTML 标记的简洁性，同时进行强大的 JavaScript 计算。你可以包含 JavaScript 表达式、动态 props（属性，或者我们在常规\
    \ HTML 中称之为属性的东西），并同时处理 UI 和功能。\n\n你也可以使用花括号在 JSX 中编写表达式。考虑以下 JSX 示例：\n\n`const\
    \ elem = <div>Hello World { document.location.href } { 5 + 5 } { 'Regular string'\
    \ } </div>`\n\n这是一个完全有效的 JSX 语法，但绝对不是有效的 JavaScript。那么，底层发生了什么？\n\n`JSX 转换`\n\n\
    React 将 JSX 编译为普通的 ES5 代码。考虑以下示例：\n\n`const elem = <div className=\"a-classy-div\"\
    >JSX seems so cool!</div>`\n\n这个示例被编译为以下内容：\n\n`const elem = React.createElement('div',\
    \ { className: 'a-classy-div', 'JSX seems so cool!' })`\n\n后者看起来绝对是有效的 JavaScript\
    \ 语法。这就是 JSX 的魔力。你获得了编写 React 组件的视觉辅助，因为现在你可以轻松避免为 UI 部分编写繁琐的额外 JavaScript 代码。\n\
    \n事实上，前面的两个代码片段是相同的，这意味着你可以直接编写 `React.createElement` 部分，而不是 JSX。当然，对于 UI 开发来说，JSX\
    \ 比裸 JavaScript 更清晰易读。\n\n# 迁移到 TypeScript\n\n现在我们已经用 React 启动并运行了一个基本的 JavaScript\
    \ 项目，是时候引入 TypeScript 了。我们不会立即深入 TypeScript 的所有类型转换、接口等特性。相反，我们只会使用 TypeScript\
    \ 的最佳部分（即自动完成和无错误代码实践），并在整本书中使用它。以下是启动 TypeScript 项目的方法：\n\n*   删除我们之前创建的 JS hello\
    \ world 文件夹。\n*   假设你已经按照上述说明安装了 create-react-app 工具，在命令行中写入 `create-react-app\
    \ hello-world-ts --typescript`。\n*   这将使用 TypeScript 初始化你的 React 项目。\n*   最终的文件结构应如下所示：\n\
    \n    ![](img/image11.jpg)\n\n    **图 2.1：** 文件结构\n\n最后，我们准备好使用 React 了！\n\n#\
    \ 结论\n\n我们学习了什么是 JSX，如何用 React 创建项目，以及最终迁移到 TypeScript，因为它提供了更好的类型检查，并让你更容易编写无错误的代码。在后续章节中，我们将深入探讨\
    \ React，了解其基础知识以及与之相关的核心概念。\n\n# 第 3 章\n\n# 组件\n\n组件是 React 的基础部分。其理念如下：网页上的所有内容都可以分解为可重用的视图，称为组件。这些组件可以相互链接，可以完全独立，可以感知其父组件，或者也可以对其环境完全“*无感知*”。\n\
    \n让我们进一步了解如何使用它们。\n\n# 结构\n\n*   关于组件\n*   类组件与函数式组件\n*   函数式组件\n    *   Props\n\
    \    *   Children\n    *   Hooks\n        *   `useState`\n        *   `useEffect`\n\
    \        *   `useCallback`\n    *   自定义 Hooks\n*   类组件\n    *   Props\n    * \
    \  State\n    *   生命周期方法\n        *   `getDerivedStateFromProps`\n        *  \
    \ `Render`\n        *   `getSnapshotBeforeUpdate`\n        *   `componentDidMount`\n\
    \        *   `componentDidUpdate`\n*   结论\n\n# 目标\n\n本章旨在向你介绍 React 中的组件以及创建组件的两种主要方式。我们将从函数式组件开始，并很快意识到与基于类的组件创建方式相比，这是一种更好、更清晰的方法。我们将学习一些边缘情况，并最终分别了解函数式组件和基于类组件中的\
    \ hooks 和生命周期事件。最后，我们将以对组件的清晰理解结束本章，并迈向更高级的概念。\n\n# 关于组件\n\n组件是 React 的核心。将组件视为与主\
    \ JavaScript 包解耦的代码片段，以提供可维护性，并便于在现有代码库基础上添加功能。通常，你会根据组件在页面 UI 中出现的位置和方式来进行分离。在\
    \ React 16.8 及以上版本中，有两种精确的方式来编写具有类似功能的组件，正如我们接下来要看到的——函数式组件和基于类的组件。\n\n# 类组件与函数式组件\n\
    \n基于类的组件在 React 中已经存在了很长时间。事实上，几乎一直以来，它都是创建具有自身状态的工作 React 组件的唯一方式。随着 hooks 的引入，这种情况发生了变化，我们将在下一节中介绍\
    \ hooks。然而，以下是 hooks 出现后关于类组件和函数式组件的一些要点：\n\n1.  函数式组件（hooks 出现后）显然是 React 中创建组件的更好方式，因为它们比类更清晰，避免了在基于类的组件代码中常见的许多陷阱（例如\
    \ `this` 的绑定），避免了状态突变，并使用副作用而非基于生命周期的模型。\n\n"
- fmt: "\n2. React core team recommends preferring hooks as well because of the reasons\
    \ stated above. Although class-based components are not going anywhere anytime\
    \ soon, still, we could all agree that functional components are the future React\
    \ library is aiming at.\n\nWith that being said, there’s always an advantage in\
    \ learning more than you’d use. We’ll cover class-based components here quickly\
    \ and dive deep into functional components which is a more important aspect now.\
    \ But first, let’s start with functional components.\n\n# [Functional Components](#toc.xhtml_s32a)\n\
    \nFunctional components have existed in React for a long time. Let us take a look\
    \ at this hello world React code before going further:\n\n```\nimport React from\
    \ 'react'\nimport ReactDOM from 'react-dom'\n\nfunction App() {\n  return <p>Hello\
    \ World</p>\n}\n\nReactDOM.render(<App />, document.getElementById('root'))\n\
    ```\n\nYou can see here, that we’re using a function called `App` here as a React\
    \ component. Well, how does one know that it is a React component? When you use\
    \ it as JSX (like `<App />`), it gets transpiled to the following:\n\n```\nimport\
    \ React from 'react';\nimport ReactDOM from 'react-dom';\n\nfunction App() {\n\
    \  return React.createElement(\"p\", null, \"Hello World\");\n}\n\nReactDOM.render(React.createElement(App,\
    \ null), document.getElementById('root'));\n```\n\nSo what is happening here?\n\
    \n1. Everything you write in JSX is transpiled to equivalent React calls (we discussed\
    \ this in [Chapter 1](#c01.xhtml)) JSX is just syntactic sugar for the preceding\
    \ example.\n\n2. `React.createElement` returns a JavaScript object which looks\
    \ something like this:\n\n   ![](images/image7.jpg)\n\n   **Figure 3.1**\n\nNow,\
    \ we don’t want to get into the internals of React right now, but eventually,\
    \ React uses this object to create a tree, a virtual DOM, to say. Let’s get back\
    \ to some properties of the functional components now.\n\n# [Props](#toc.xhtml_s33a)\n\
    \nPassing props (short for properties) is a common scenario, and you’ll be doing\
    \ it almost always as a way to pass down data to child components. React works\
    \ in a way where parents pass down data to child components. Sure, with the context\
    \ API you could magically transport the data multiple level downs (more on this\
    \ later), but props enable you the simplest way of data passing. Let’s take a\
    \ look at this example:\n\n```\ninterface props {\n  name: string\n}\n\nconst\
    \ App: React.FC<props> = props => {\n  return <p>Hello {props.name}</p>\n}\n\n\
    ReactDOM.render(<App name=\"Mehul\" />, document.getElementById('root'))\n```\n\
    \nHere you can see that we’re making use of TypeScript to enhance React. Instead\
    \ of creating a function using the `function` keyword, we’re making use of the\
    \ arrow function notation because right now, you cannot have typed functions.\n\
    \n`React.FC` or `React.FunctionalComponent` types (TypeScript) the `App` component\
    \ which could accept and validate what props goes to the component when using\
    \ the component. Additionally, you could list all the props and their data types\
    \ in the interface as defined.\n\n# [Children](#toc.xhtml_s34a)\n\nA special prop\
    \ called `children` is available for React components which basically includes\
    \ anything passed within an opening and closing tag of your custom component.\
    \ Now, I mention anything passed instead of a component passed because you could\
    \ literally pass anything you like - a component, a string, a function, and so\
    \ on. Take a look at the following example:\n\n```\nconst App: React.FC<{ name:\
    \ string }> = props => {\n  return <div>\n    Hello {props.name}\n    <div className=\"\
    children\">\n      {props.children}\n    </div>\n  </div>\n}\n```\n\nAnd we could\
    \ call this component as:\n\n```\n<App name=\"Mehul\">\n  <p>Hey there!</p>\n\
    </App>\n```\n\nThat is one way of using the `children` prop. Another way you could\
    \ use them is via a function. See this example:\n\n```\nconst App: React.FC<{\
    \ name: string, children(one: string, two: string): JSX.Element }> = props =>\
    \ {\n  return <div>\n    Hello {props.name}\n    <div className=\"children\">\n\
    \      {props.children('one', 'two')}\n    </div>\n  </div>\n}\n```\n\nAnd that’s\
    \ how we’ll use this component:\n\n```\n<App name=\"Mehul\">\n  {(one: string,\
    \ two: string) => <p>Hey there! Passed attributes: { one } { two }</p>}\n</App>\n\
    ```\n\nHere’s a quick summary of what we did in the last example:\n\n1. We created\
    \ our custom `children` type receiving two string parameters which return a `JSX.Element`\
    \ (that is, that `<p>` tag).\n\n2. In the component, we used `props.children`\
    \ as a function and called it (instead of simply rendering it) with two values\
    \ passed.\n\n3. The parent renders the child component with the values passed\
    \ by the child to the parent. This is a neat trick to pass a little bit of data\
    \ from child to parent; usually, data is passed from parents to children but this\
    \ way you could achieve the opposite.\n\nIn fact, what we did previously is called\
    \ as **render props** method. It simply refers to data passing when a prop (`children`\
    \ in our case) is a function instead of a JSX element or a regular value.\n\n\
    # [Hooks](#toc.xhtml_s35a)\n\nBefore React 16.8, it was not possible to create\
    \ stateful functional components just using functions. You see where the problem\
    \ lies unless, like class components, there was no way to make use of any *state*\
    \ object. But this was changed with the introduction of hooks. Introducing state\
    \ with hooks could bring in tons of benefits. Functional components could now\
    \ *remember* their context. Let us start with the various kinds of useful hooks\
    \ we have now in React and how to use them.\n\n# [useState](#toc.xhtml_s36a)\n\
    \n`useState` hook allows you to bring `this.state` and `this.setState` functionality\
    \ from classes to functional components. Here’s a quick example on how to use\
    \ them:\n\n```\nfunction App() {\n  const [name, setName] = useState('Mehul')\n\
    \  return <p>Hello {name}</p>\n}\n```\n\nLet’s focus on this line `const [name,\
    \ setName] = useState('Mehul')`. The `useState` method returns an array with two\
    \ elements, the first being the `getter` and second being the `setter`. If you\
    \ just call `console.log(useState(\"Mehul\"))` within your functional component\
    \ you’re going to see something like this:\n\n![](images/image21.jpg)\n\n**Figure\
    \ 3.2**\n\nHere, we can clearly see the array having the first value as the `getter`\
    \ and the second value as a `function`. This function, when called, will update\
    \ our `setter` variable, similar to how calling `this.setState` does that. Let’s\
    \ take a look at this simple example:\n\n```\nfunction App() {\n  const [name,\
    \ setName] = useState('Mehul')\n  setTimeout(() => {\n    setName(Math.random())\n\
    \  }, 1000)\n  return <p>Hello {name}</p>\n}\n```\n\nHere, when you run this code,\
    \ you’ll see that the name changes every second to a random number between 0 and\
    \ 1. Note that it is a convention to use `X` and `setX` for the variable names\
    \ of `getter` and `setter`. You can, however, use whatever you like, but I’d recommend\
    \ sticking to the convention as it makes it easy to distinguish.\n\n# [useState\
    \ is not synchronous](#toc.xhtml_s37a)\n\nThat means, whenever you call `useState`,\
    \ there is no guarantee that after calling it if you use the `getter` you’ll get\
    \ the updated value. For instance, consider this example:\n\n```\nconst App: React.FC\
    \ = props => {\n  const [currentNumber, setCurrentNumber] = useState(Math.random())\n\
    \  function changeState() {\n    setCurrentNumber(Math.random())\n    console.log('New\
    \ number => ${currentNumber}')\n  }\n  return <button onClick={changeState}>Click\
    \ Me { currentNumber }</button>\n}\n```\n\nHere’s the output of the code:\n\n\
    ![](images/image4.jpg)\n\n**Figure 3.3**\n\nIf you use this component, you’ll\
    \ see that what you see in console isn’t what is reflected in the UI. This is\
    \ because `useState` runs asynchronously and wouldn’t update the variables right\
    \ away.\n"
