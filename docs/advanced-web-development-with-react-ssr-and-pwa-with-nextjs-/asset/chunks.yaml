- fmt: "\nThis file inside the `pages` folder allows us to inject our custom markup\
    \ in various places (like the head of the page). We’ll use the following file\
    \ to inject the `manifest.json`:\n\n```javascript\n// pages/_document.js\nimport\
    \ Document, { Html, Head, Main, NextScript } from 'next/document'\nclass MyDocument\
    \ extends Document {\n  static async getInitialProps(ctx) {\n    constinitialProps\
    \ = await Document.getInitialProps(ctx)\n    return { …initialProps }\n  }\n \
    \ render() {\n    return (\n      <Html>\n        <Head>\n          <link rel=\"\
    manifest\" href=\"/manifest.json\" />\n        </Head>\n        <body>\n     \
    \     <Main />\n          <NextScript />\n        </body>\n      </Html>\n   \
    \ )\n  }\n}\nexport default MyDocument\n```\n\nAnd that’s it! Here’s how the final\
    \ file structure would look like:\n\n![](images/image35.jpg)\n\n**Figure 8.8**\n\
    \nNow we can go ahead and run `npm run build` and `npm start` to start production\
    \ build of the app. Once we do, you’ll see that you get an option to install PWA\
    \ now:\n\n![](images/image26.jpg)\n\n**Figure 8.9**\n\nAlso, on phones, we get\
    \ the same experience:\n\n![](images/p192.jpg)\n\n**Figure 8.10**\n\n# Conclusion\n\
    \nIn this chapter, we learned about progressive web apps and how to make our React\
    \ and Next apps progressive. We also saw how to set up a custom Next.js server\
    \ in the process. In the next chapter, we’ll be closing with some of the best\
    \ practices with React and the future of the library as a whole.\n\n# Questions\n\
    \n1.  What do you mean by a PWA?\n2.  How is a PWA different from a native app\
    \ or a hybrid app?\n3.  What is the difference between a service worker and a\
    \ web worker?\n4.  What is the function of the file `_document.js` in Next.js\
    \ framework?\n5.  How does a custom Next.js server differ from a custom API endpoint\
    \ programmed in Next.js?\n\n# CHAPTER 9\n\n# Bleeding Edge React\n\nReact has\
    \ come a long way since its launch in 2013. Today, React has one of the biggest\
    \ developer communities all over the world. React is continuously improving and\
    \ developing, as we speak. This chapter would cover some of the bleeding edge\
    \ features of React, which are either still in the works or are in very experimental\
    \ stages right now in the React framework, and is definitely going to shape the\
    \ future of the framework, and the community as a whole. Let’s dive into it!\n\
    \n# Structure\n\n*   How React works\n    *   Reconciler\n    *   Renderer\n*\
    \   Concurrent Mode\n*   How concurrent mode works\n*   Opt-in concurrent mode\n\
    *   React Suspense\n\n# Objective\n\nIn the final chapter, we’ll see some things\
    \ React has been working on for the future. The concurrent mode is a big thing,\
    \ which is experimentally available at the moment for the developers to try out.\
    \ We’ll learn about that in this chapter.\n\n# How does React work?\n\nBefore\
    \ diving deep into the fundamentals of the new technology, it’s important to make\
    \ ourselves aware of how React works anyway. On a higher level, React consists\
    \ of a reconciler and a renderer. A reconciler is a way how React handles the\
    \ virtual implementation of the DOM tree inside its memory. Let’s look at an example\
    \ first in vDOM.\n\n# Reconciler\n\nVirtual DOM is how React maintains a copy\
    \ of the original DOM the browser shows the end-user, in its own memory. React\
    \ reconciler handles the creation of this tree in memory only. Note that this\
    \ tree still doesn’t know which environment it is in. For example, when you write\
    \ the following JSX code:\n\n```jsx\n<div className=\"myClass\">\n  <h1>Hello\
    \ World</h1>\n  <p>This is a nice paragraph</p>\n</div>\n```\n\nThis gets transpiled\
    \ by Babel into the following:\n\n```javascript\nReact.createElement(\"div\",\
    \ {\n  className: \"myClass\"\n}, React.createElement(\"h1\", null, \"Hello World\"\
    ), React.createElement(\"p\", null, \"This is a nice paragraph\"));\n```\n\nWhich\
    \ is further, gets represented as the following in memory:\n\n```json\n{\n  \"\
    type\": \"div\",\n  \"key\": null,\n  \"ref\": null,\n  \"props\": {\n    \"className\"\
    : \"myClass\",\n    \"children\": [\n      {\n        \"type\": \"h1\",\n    \
    \    \"key\": null,\n        \"ref\": null,\n        \"props\": {\n          \"\
    children\": \"Hello World\"\n        }\n      },\n      {\n        \"type\": \"\
    p\",\n        \"key\": null,\n        \"ref\": null,\n        \"props\": {\n \
    \         \"children\": \"This is a nice paragraph\"\n        }\n      }\n   \
    \ ]\n  }\n}\n```\n\nNote that I’ve removed some properties from the object above\
    \ just for clarity. But what we could see previously is an object which React\
    \ has in its memory. This is, in effect, the vDOM. Note that although there is\
    \ nothing “DOM” here, still, we refer to it as virtual DOM, which is kind of wrong.\n\
    \n# Renderer\n\nReact’s second part is the react renderer. Now, DOM is one of\
    \ the host environments which could use React. There are other host environments\
    \ as well, like React Native (for mobile), or maybe React Hardware. Renderers\
    \ basically allow the reconciler to talk to the host environment.\n\nFor example,\
    \ with DOM, we know that an element is created using `document.createElement`\
    \ API exposed by browsers. This might not be the case with a mobile host, say\
    \ Android. There, you would have to use some other way to create a UI element\
    \ on the screen, but does it affect the reconciler in any way? No! That is why\
    \ it is a great decision to split the reconciler and renderer into different packages.\
    \ When you install react for web pages, you install the package `react` and `react-dom`.\
    \ Here, the package `react` is basically the reconciler, and the package `react-dom`\
    \ is renderer.\n\n# Moving from classes\n\nI’m fully aware that React has first-class\
    \ support for class-based components, but this chapter aims at future tech and\
    \ experimental tech associated with React, and the team has made it very clear\
    \ that in the future, functional components would be the ones which would get\
    \ the most focus on development. With hooks, functional components are fully capable\
    \ of doing everything class-based components do. If you’re just picking up React,\
    \ I would say just know about class-based components enough to refactor them,\
    \ but if you’re creating your own components, always go with functional components.\n\
    \nClass-based components have their own pros and cons, like, they actually mutate\
    \ state and props, whereas functional components actually capture the props and\
    \ state at the time of render. This avoids nasty bugs. Moreover, functional components\
    \ are a more friendly way to code than classes, simply because JavaScript has\
    \ no classes; it is just syntactic sugar over functions.\n\n# Concurrent mode\n\
    \nThe concurrent mode in React is a completely new way of working with React.\
    \ In Computer Science, concurrency usually means performing multiple tasks on\
    \ the basis of time slicing. React, once it is done with the vDOM diffs, now has\
    \ to commit these changes to the DOM. Calculating the changes in vDOM is non-blocking,\
    \ even now, and it is how internally React works (using browser’s idle time by\
    \ calling `requestIdleCallback` function in browsers and in different threads\
    \ for other host environments), however the commit phase, that is, writing to\
    \ DOM is synchronous. Some notable features of concurrent mode:\n\n1.  **Interruptible\
    \ rendering**: Consider a huge list consisting of items where you could filter\
    \ for the items. If you ever used such an application, you know that it could\
    \ become all jittery and lagging unless there is some sort of `debounce` function\
    \ in place which doesn’t run the search JavaScript logic unless the user has stopped\
    \ typing (say checking if the last keystroke was 200ms before or so). Concurrent\
    \ mode fixes this by making the renders interruptible by high priority interrupts.\
    \ A user interacting with an input field is a higher priority interrupt than react,\
    \ rendering the updated view, hence, react pauses its execution and frees the\
    \ main thread to handle the input.\n\n2.  **Loading sequences**: Have you ever\
    \ seen applications where you see the loading spinner just for a split second\
    \ even though you’re on a fast connection? The concurrent mode also solves that\
    \ problem.\n"
