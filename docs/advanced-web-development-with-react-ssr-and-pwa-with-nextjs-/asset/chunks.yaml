    \n**图 7.9**\n\n上面的截图展示了我们在应用中集成 Redux 的情况。\n\n完成这些后，让我们回到应用逻辑，并在其中使用 Redux。你可以看到\
    \ Redux 使用我们 reducer 的名称（本例中为 user）作为 store 的名称。\n\n# 派发 Redux Actions\n\n为了改变\
    \ Redux store 中的状态，我们需要派发 actions。Actions 通知 Redux 条件发生了变化，状态应该以某种方式被修改。然而，并非每次派发都必须更新状态。让我们创建一个名为\
    \ `redux/actions.ts` 的新文件，其中包含以下代码：\n\n```\nimport { UserDetails } from './reducer'\n\
    \nexport const setUserDetails = (payload: UserDetails) => {\n  return { type:\
    \ 'SET_USER_DETAILS', payload }\n}\n```\n\n现在，我们将在根页面中使用这个 action。让我们将 `pages/index.tsx`\
    \ 更新为以下内容：\n\n```\nimport React, { useState } from 'react'\nimport { NextPage\
    \ } from 'next'\nimport './styles.css'\nimport { connect } from 'react-redux'\n\
    import { setUserDetails } from '../redux/actions'\n\ntype Props = {\n  setUserDetails(json:\
    \ any): void\n  name?: string\n}\n\nconst IndexPage: NextPage<Props> = (props)\
    \ => {\n  const [username, setUsername] = useState<string>('')\n  const [password,\
    \ setPassword] = useState<string>('')\n\n  async function submitForm() {\n   \
    \ const req = await fetch('/api/login', {\n      method: 'POST',\n      headers:\
    \ {\n        'Content-Type': 'application/json'\n      },\n      body: JSON.stringify({\
    \ username, password })\n    })\n    const json = await req.json()\n    console.log(json)\n\
    \    props.setUserDetails(json.data)\n  }\n\n  return (\n    <form method=\"POST\"\
    >\n      <div className=\"box\">\n        <h1>Login</h1>\n        {props.name\
    \ || 'na'}\n        <input type=\"text\" placeholder=\"Username\" className=\"\
    field\" value={username} onChange={e => setUsername(e.target.value)} />\n    \
    \    <input type=\"password\" placeholder=\"Password\" className=\"field\" value={password}\
    \ onChange={e => setPassword(e.target.value)} />\n        <div className=\"btn\"\
    \ onClick={submitForm}>Sign In</div>\n      </div>\n    </form>\n  )\n}\n\nconst\
    \ mapStateToProps = ({ user }: any) => {\n  return {\n    name: user && user.name\n\
    \  }\n}\n\nexport default connect(mapStateToProps, { setUserDetails })(IndexPage)\n\
    ```\n\n那么，这个文件中发生了什么？让我们看看：\n\n*   我们导入了刚刚创建的 `action` 函数。\n*   登录时，我们现在调用一个以某种方式作为组件\
    \ props 接收到的函数。怎么做到的？我们马上会看到。\n*   然后我们创建了一个叫做 `mapStateToProps` 的东西。对于 Redux，我们可以从中央\
    \ store 中提取我们想要的某些值。还记得我们的 reducer 名称是 user 吗？我们解构（ES6 解构）了 user reducer，并尝试提取\
    \ name 属性（如果存在的话）。\n*   最后，我们导出了组件，但不是直接导出 `IndexPage`，而是将其包裹在一个高阶组件中。第一个参数是我们创建的\
    \ `mapStateToProps`。第二个参数是我们传递的方法，这些方法将在我们的 props 中可用。当你调用这些方法时，这些方法的返回值会被派发到\
    \ Redux store。现在，其中一个 reducer 会捕获该 action（通过其 type），并相应地更新状态。\n\n现在你会看到，当我们使用正确的凭据（用户名和密码均为\
    \ admin）登录时，我们的名字会替换在登录表单中，如果你检查 Redux DevTools，你会看到相应的 action 也被派发了，从而更新了 Redux\
    \ 状态：\n\n![](img/image16.jpg)\n\n**图 7.10**\n\n上面的截图展示了正确地向我们的 Redux store 派发了一个\
    \ action。\n\n但即使对于这个页面，我们还可以做更多！当 React 引入 hooks 时，Redux 也很快引入了 hooks 支持！因此，我们可以直接使用提供的\
    \ Redux hooks 从 store 中获取所需的值，而不是使用 `connect` 函数将中央 store 与组件连接起来。\n\n类似地，如果我们想要派发\
    \ actions，我们也可以通过 Redux 提供的 dispatcher（通过 hook）来派发它们。让我们修改上面的文件，改用 hooks。\n\n\
    # useSelector 和 useDispatch\n\n这两个 hooks 允许我们在 React 中使用 hooks 来使用 Redux（几乎就像你使用\
    \ `useContext` 一样）。让我们看看上面的文件如何用 hooks 编写：\n\n```\nimport React, { useState }\
    \ from 'react'\nimport { NextPage } from 'next'\nimport './styles.css'\nimport\
    \ { useSelector, useDispatch } from 'react-redux'\nimport { setUserDetails } from\
    \ '../redux/actions'\n\nconst IndexPage: NextPage = () => {\n  const dispatch\
    \ = useDispatch()\n  const name = useSelector((state: any) => state.user && state.user.name)\n\
    \  const [username, setUsername] = useState<string>('')\n  const [password, setPassword]\
    \ = useState<string>('')\n\n  async function submitForm() {\n    const req = await\
    \ fetch('/api/login', {\n      method: 'POST',\n      headers: {\n        'Content-Type':\
    \ 'application/json'\n      },\n      body: JSON.stringify({ username, password\
    \ })\n    })\n    const json = await req.json()\n    console.log(json)\n    dispatch(setUserDetails(json.data))\n\
    \  }\n\n  return (\n    <form method=\"POST\">\n      <div className=\"box\">\n\
    \        <h1>Login</h1>\n        {name || 'na'}\n        <input type=\"text\"\
    \ placeholder=\"Username\" className=\"field\" value={username} onChange={e =>\
    \ setUsername(e.target.value)} />\n        <input type=\"password\" placeholder=\"\
    Password\" className=\"field\" value={password} onChange={e => setPassword(e.target.value)}\
    \ />\n        <div className=\"btn\" onClick={submitForm}>Sign In</div>\n    \
    \  </div>\n    </form>\n  )\n}\n\nexport default IndexPage\n```\n\n以下是发生的事情：\n\
