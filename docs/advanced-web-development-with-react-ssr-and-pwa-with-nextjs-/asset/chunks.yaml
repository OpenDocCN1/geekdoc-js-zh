    # Preface


    With web evolving so rapidly in the past 5-6 years, it is a no-brainer to build
    on top of existing best practices available in the market instead of going through
    scratch. React is one such tool to build highly responsive and scalable web applications,
    and comes with best practices from industry, used by front faces of the internet
    like Facebook. Hence, it becomes extremely important for developers to level up
    their web development skills to include React as a skill in their toolkit.


    With the increasing need of businesses to optimize for user experience as well
    as search engine optimizations, technologies like Server-Side Rendering (SSR)
    and Progressive Web Apps (PWAs) could enable companies to build better products
    whilst cutting down technical maintenance of existing codebase.


    This book is a go-to handbook for developers who want to learn bleeding-edge React
    features, brush up their React skills, or start working with SSR/PWA using Next.js
    and React, which would eventually help them to scale their existing applications
    on the top of highly maintained and trusted open-source code. This book would
    take you through a journey of different discrete concepts you’ll need to know
    in order to build parts of application ready for SSR deployment or converting
    it into a PWA. Over the course of 9 chapters in the book, you’ll learn about the
    following.


    **[Chapter 1](#c01.xhtml)** Introduces React to you. We’ll dig up what React is
    and why it is a great choice for building highly scalable applications in today’s
    world. We’ll also quickly brush up some necessary JS concepts required for future
    chapters.


    **[Chapter 2](#c02.xhtml)** Would cover setting up React using various methods
    and discuss the benefits and drawbacks of each. We’ll also start writing basic
    applications with React and start seeing benefits React offers out of the box.


    **[Chapter 3](#c03.xhtml)** Would introduce 2 ways to create components in React
    and discuss a modern approach React takes for components – functional way. We’ll
    also work with hooks in this chapter and see why they make more sense than their
    counterpart – Classes.


    **[Chapter 4](#c04.xhtml)** Introduces state management with React. Here we discuss
    possible options to manage the state with React. We’ll see managing state with
    Redux, and using latest hooks – useContext and useReducer to emulate Redux store.


    **[Chapter 5](#c05.xhtml)** Introduces server-side rendering in React, where we’ll
    see what SSR is, and how it works. We’ll implement SSR in this chapter ourselves
    from scratch, and discuss the pros and cons with it.


    **[Chapter 6](#c06.xhtml)** This chapter introduces you to Next.js – a popular
    choice for SSR frameworks when doing SSR using React. We’ll see how to setup Next.js
    and various baked-in features which come with it.


    **[Chapter 7](#c07.xhtml)** We’ll explore more advanced Next.js features in this
    chapter, digging deep into the framework and setting up API endpoints using Next.js
    framework.


    **[Chapter 8](#c08.xhtml)** This chapter introduces Progressive Web Apps and how
    to create PWAs using Next.js and React framework.


    **[Chapter 9](#c09.xhtml)** This chapter covers bleeding-edge React features and
    some information on how React works under the hood.


