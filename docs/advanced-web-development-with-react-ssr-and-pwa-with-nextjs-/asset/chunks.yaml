    \ ‘react’\nimport { StateContext } from ‘./Component1’\n\nconst Sidebar: React.FC\
    \ = () => {\n  const { logo } = useContext(StateContext)\n\n  return (\n    <aside>\n\
    \      <h2>Wow this is a nice sidebar</h2>\n      <p>See my logo</p>\n      <imgsrc={‘https://codedamn.com/assets/images/${logo}.png’}\
    \ />\n    </aside>\n  )\n}\n\nexport default Sidebar\n```\n\n以及 `Footer.tsx`：\n\
    \n```\nimport React, { useContext } from ‘react’\nimport { StateContext } from\
    \ ‘./Component1’\n\nconst Footer: React.FC = () => {\n  const { logo } = useContext(StateContext)\n\
    \n  return (\n    <footer>\n      <p>Copyright &copy; Me.</p>\n      <imgsrc={‘https://codedamn.com/assets/images/${logo}.png’}\
    \ />\n    </footer>\n  )\n}\n\nexport default Footer\n```\n\n就是这样！你可以看到父组件向子组件传递值是多么容易，子组件修改值后父组件也能相应调整。这就是网站在亮色和暗色模式下的样子：\n\
    \n亮色模式\n\n![](img/image13.jpg)\n\n**图 4.3：** 亮色模式\n\n![](img/image41.jpg)\n\n\
    **图 4.4：** 暗色模式\n\n# useReducer 钩子\n\n现在我们已经了解了 `useContext` 的工作原理，我们可以通过使用 React\
    \ 提供的另一个内置钩子 `useReducer` 来进一步简化应用的状态管理。\n\n让我们从将上述示例中的 `createContext` 解耦到一个单独的文件开始：\n\
    \n这是我们的 `state.ts` 文件：\n\n```\nimport { createContext } from ‘react’\n\ntype Context\
    \ = {\n  theme: string\n  name: string\n  logo: string\n}\n\nconstinitialState\
    \ = {\n  theme: ‘light’,\n  name: ‘Mehul’,\n  logo: ‘red-logo’\n}\n\nfunction\
    \ stateFunc(state: Context, action: { type: string, payload: any }) {\n  const\
    \ { type, payload } = action\n  switch(type) {\n    case ‘SET_THEME’:\n      document.body.classList.remove(‘dark’,\
    \ ‘light’)\n      document.body.classList.add(payload)\n      return {\n     \
    \   …state,\n        theme: payload,\n        logo: payload === ‘dark’ ? ‘white-logo’\
    \ : ‘red-logo’\n      }\n  }\n  return initialState\n}\n\nconstStateContext =\
    \ createContext<{ state: Context, dispatch: Function}>({\n  state: initialState,\n\
    \  dispatch: () => 0\n})\n\nexport const Provider = StateContext.Provider\nexport\
    \ const reducer = stateFunc\nexport const context = StateContext\nexport constdefaultState\
    \ = initialState\n```\n\n这个文件里有很多内容！让我们看看发生了什么：\n\n1.  首先，有一个名为 `stateFunc` 的普通函数，它接收\
    \ state 和 action 作为输入。\n\n"
- fmt: "\n2. The action object consists of `type` as string and `payload` as any value.\
    \ (You could narrow this down even more by specifying stricter types for `type`\
    \ and `payloads`).\n\n3. Now, on the basis of the `type`, we have certain cases,\
    \ if the `type` is `SET_THEME`, we do update the state and return it. This becomes\
    \ our updated state. How? That is done by the `useReducer` hook which we’ll see\
    \ in a minute.\n\n4. Finally, we have our old `StateContext`, but this time, instead\
    \ of holding just the state, our context holds two values. The state and a `dispatch`\
    \ function.\n\n5. The state is our original state object, and `dispatch` is a\
    \ method which is used to update the state. You see, here, we don’t interact with\
    \ the state directly, instead, we send certain “actions” which in turn update\
    \ the state.\n\nWe initialize the `dispatch` method with a garbage function, but\
    \ we’ll overwrite that eventually when we’re using the context provider, so it\
    \ doesn’t matter.\n\nNow, coming back to `Component1.tsx` file, this is how it\
    \ would look like:\n\n```\nimport React, { useReducer } from 'react'\nimport Header\
    \ from './Header'\nimport Content from './Content'\nimport Footer from './Footer'\n\
    import './global.css'\nimport { Provider, defaultState, reducer } from './state'\n\
    \nconst Component1: React.FC = () => {\n  const [state, dispatch] = useReducer(reducer,\
    \ defaultState)\n  return (\n    <Provider value={{ state, dispatch }}>\n    \
    \  <Header />\n      <Content />\n      <Footer />\n    </Provider>\n  )\n}\n\n\
    export default Component1\n```\n\nNow you can see we’re making use of a new hook\
    \ called `useReducer`. What this hook does is, it returns us an array with two\
    \ elements in it, just like we had for `useState` hook. The first element is the\
    \ `state`, and the second element is the `dispatch` function.\n\nOne major difference\
    \ here between `useState` and `useReducer` is that with `useState`, your second\
    \ function is the `setter` of your state, that is, whatever you pass as the argument\
    \ in the function in case of `useState` gets set as the state, whereas in `useReducer`,\
    \ whenever you call `dispatch` method, `useReducer` calls your reducer on it,\
    \ and then whatever you return from the reducer method gets set as the state.\
    \ Consider this:\n\n```\nconst [state, setState] = useState(0)\nsetState(1) //\
    \ ← sets the state variable to 1\n\nconst [state, dispatch] = useReducer(reducer,\
    \ 1)\ndispatch({ type: 'do something', value: 100 }) // Now reducer is called\n\
    // behind the scenes: reducer(state, { type: 'do something', value: 100 }) ->\
    \ returns 101\n// state becomes 101\n```\n\nThis is important for large data management,\
    \ as now you could have much finer control over your data flow.\n\nLet’s now update\
    \ other files to work accordingly with the `useReducer` hook:\n\n**Footer.tsx**:\n\
    \n```\nimport React, { useContext } from 'react'\nimport { context } from './state'\n\
    \nconst Footer: React.FC = () => {\n  const { state: { logo } } = useContext(context)\n\
    \  return (\n    <footer>\n      <p>Copyright &copy; Me.</p>\n      <img src={'https://codedamn.com/assets/images/${logo}.png'}\
    \ />\n    </footer>\n  )\n}\n\nexport default Footer\n```\n\n**Header.tsx**:\n\
    \n```\nimport React, { useContext } from 'react'\nimport { context } from './state'\n\
    \nconst Header: React.FC = () => {\n  const { state: { name } } = useContext(context)\n\
    \  return (\n    <header>\n      <h1>Welcome to my site!</h1>\n      <p>Hello\
    \ {name}</p>\n    </header>\n  )\n}\n\nexport default Header\n```\n\n**RightArticle.tsx**:\n\
    \n```\nimport React, { useContext } from 'react'\nimport { context } from './state'\n\
    \nconst RightArticle: React.FC = () => {\n  const { state: { theme }, dispatch\
    \ } = useContext(context)\n\n  function toggleTheme() {\n    if(theme === 'dark')\
    \ {\n      dispatch({ type: 'SET_THEME', payload: 'light' })\n    } else {\n \
    \     dispatch({ type: 'SET_THEME', payload: 'dark' })\n    }\n  }\n\n  return\
    \ (\n    <article>\n      <h2>This is my site!</h2>\n      <p>It is very nice</p>\n\
    \      <p>The mode right now is: {theme}</p>\n      <button onClick={toggleTheme}>Click\
    \ here to turn on dark mode</button>\n    </article>\n  )\n}\n\nexport default\
    \ RightArticle\n```\n\nSee how we’re making use of the `dispatch` function above?\
    \ That calls our reducer on it, and our reducer modifies the state which is propagated\
    \ to the components using it!\n\nAnd `Sidebar.tsx`:\n\n```\nimport React, { useContext\
    \ } from 'react'\nimport { context } from './state'\n\nconst Sidebar: React.FC\
    \ = () => {\n  const { state: { logo } } = useContext(context)\n  return (\n \
    \   <aside>\n      <h2>Wow this is a nice sidebar</h2>\n      <p>See my logo</p>\n\
    \      <img src={'https://codedamn.com/assets/images/${logo}.png'} />\n    </aside>\n\
    \  )\n}\n\nexport default Sidebar\n```\n\nOnce we complete all these changes,\
    \ we’ll see that we still have the same output on the screen. But consider this.\
    \ It’s now so easy to implement even more stateful things in the application.\
    \ For example, let’s say you want to change the logged in name on clicking of\
    \ a button.\n\nYou’ll simply get to the `dispatch` method in any component and\
    \ dispatch an action with a type, say, `CHANGE_USERNAME` and a payload of whatever\
    \ you wish to do.\n\nNow in a completely different file, that is, `state.tsx`\
    \ you’ll add to your reducer what you wish to do when action is `CHANGE_USERNAME`\
    \ as follows:\n\n```\nswitch(type) {\n  // ..\n  case 'CHANGE_USERNAME':\n   \
    \ return {\n      ...state,\n      name: payload\n    }\n  // ....\n}\n```\n\n\
    And you’re done! It couldn’t get more streamlined than this!\n\n# [Conclusion](#toc.xhtml_s66a)\n\
    \nIn this chapter, we learned about how we could leverage inbuilt React solutions\
    \ like Context API to implement very streamlined state management without any\
    \ external libraries. In the further chapters, we’ll be looking at how to use\
    \ more sophisticated technologies with React to achieve even more.\n\n# [Questions](#toc.xhtml_s67a)\n\
    \n1. What is Context API from React?\n2. How does `useReducer` hook work?\n3.\
    \ What is `Context.Consumer`? How does `Context.Provider` differ from `Context.Consumer`?\n\
    \n# [CHAPTER 5](#toc.xhtml_c05)\n\n# [Server Side React](#toc.xhtml_c05)\n\nSo\
    \ far we’ve seen how React works on the frontend, various ways to work with React,\
    \ managing state with it and even created a little working front page for us!\
    \ There’s so much more we could do with React, especially once we move it to the\
    \ server-side. Now it is strange to think about React on the server, at least\
    \ it was for me when I was first introduced to the concept! What does it even\
    \ mean to use React on a server? And what benefits does it provide us? We’ll answer\
    \ everything on this and more in this chapter. Let’s get started.\n\nIn this chapter\
    \ we’ll explore how we can move React to a server, essentially using Node.js to\
    \ render React code before we send it to the browsers so that we give users and\
