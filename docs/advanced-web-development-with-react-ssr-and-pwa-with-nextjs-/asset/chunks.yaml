    \    ![](images/image11.jpg)\n\n    **Figure 2.1:** File structure\n\nFinally,\
    \ we’re ready to work with React!\n\n# Conclusion\n\nWe learned what JSX is, how\
    \ to create our project with React, and eventually, move to TypeScript, as it\
    \ provides better type checking and allows you to write bug-free code more easily.\
    \ In the further chapters, we’ll be diving deep into React and seeing the fundamentals,\
    \ as well as the core concepts associated with it.\n\n# CHAPTER 3\n\n# Components\n\
    \nComponents area fundamental part of React. The ideology goes like this: everything\
