    简而言之，这段脚本将 `precache-manifest` 文件中描述的所有路由注册到 Service Worker，并指示其缓存这些资源。由于 React
    应用本质上是**单页应用**（**SPA**），我们使用 `workbox.routing` API 的 `registerNavigationRoute`
    方法，将 `index.html` 文件发送到用户访问应用时触发的任何路由上。这样，React 就能重新接管路由系统，并使用 `react-router`
    或任何现有实现进行必要的内部路由。


    # 使用 Next.js 实现 PWA


    现在，我们对 PWA 是什么以及其基本工作原理有了不错的理解，接下来将重点讨论如何使用 `Next.js` 实现 PWA。


    首先，创建一个简单的 `Next.js` 项目。你可以像前几章那样手动设置 `Next.js`，也可以直接使用方便的 `create-next-app` 工具，如下所示：


    ![](img/image93.jpg)


    **图 8.7**


    这基本上会像之前一样初始化我们的设置。完成后，我们需要安装另一个名为 `next-offline` 的包。这将为我们的应用启用 Service Worker
    支持，并最终支持 PWA。


    `npm install --save next-offline`


    这将安装 `next-offline` 包。完成后，在项目中创建一个名为 `next.config.js` 的新文件，并在其中写入以下内容：


    ```

    // next.config.js

    constwithOffline = require(''next-offline'')

    constnextConfig = {}

    module.exports = withOffline(nextConfig)

    ```


    `next-offline` 包使用了大量默认配置，默认情况下我们可以安全地沿用这些配置。基本上，`withOffline` 函数的作用是：在准备 `Next.js`
    的打包文件时，注入一个带有传入选项的 Service Worker 脚本。让我们使用 `npm run build` 构建项目。在 `build` 文件夹中，我们会在
    `main-<hash>.js` 文件中看到类似以下压缩片段：


    `navigator.serviceWorker.register("/service-worker.js",{scope:"/"}).then….`


    现在，就像我们之前对 React 应用所做的那样，我们需要提供 `service-worker.js` 文件。别担心，我们不需要自己编写它，因为它同样是由
    Next 自动创建的！但我们确实需要将其在 `/service-worker.js` URL 上提供，而且你知道，在 Next 中，静态文件是通过 `static`
    目录提供的。


    虽然我们可以将 Service Worker 文件移动到 `static` 目录，并通过上述配置更改 Service Worker 的路径，但我们将继续尝试将所有对
    `/service-worker.js` 的请求重定向到文件系统中的文件，并通过创建自定义服务器让 Next 处理其余请求。


    ## 自定义 Next.js 服务器


    在项目根目录创建一个名为 `server.js` 的文件，并在其中写入以下内容：


    ```

    const { createServer } = require(''http'')

    const { join } = require(''path'')

    const { parse } = require(''url'')

    const next = require(''next'')

    const app = next({ dev: process.env.NODE_ENV !== ''production'' })

    const handle = app.getRequestHandler()

    app.prepare()

    .then(() => {

    createServer((req, res) => {

    constparsedUrl = parse(req.url, true)

    const { pathname } = parsedUrl

    // handle GET request to /service-worker.js

    if (pathname === ''/service-worker.js'') {

    constfilePath = join(__dirname, ''.next'', pathname)

    app.serveStatic(req, res, filePath)

    } else {

    handle(req, res, parsedUrl)

    }

    })

    .listen(3000, () => {

    console.log(''> Ready on http://localhost:${3000}'')

    })

    })

    ```


    这段代码直接取自 Next 官方文档，但让我们看看这里发生了什么：


    *   由于此脚本由 `node` 直接执行，不会经过 `webpack` 或 `babel`，因此这里必须使用 CommonJS 导入。

    *   然后我们从 `http` 包中引入 Node 的 `createServer` 方法来创建自定义服务器。

    *   我们还导入了 `next` 包。以下是 `next` API 的工作方式。


    ### next(config: object)


    `config` 对象包含以下内容：


    *   `dev`：布尔值，表示开发/生产模式（`默认值：false`）

    *   `dir`：项目所在位置（`默认值：''.''`）

    *   `quiet`：是否隐藏包含服务器信息的错误消息（`默认值：false`）

    *   `conf`：Next.js 配置对象（与从 `next.config.js` 文件中读取的对象相同）


    这返回给我们一个 `app` 对象，该对象关联了一系列用于自定义路由的方法。不过我们只关注 `getRequestHandler` 和 `serveStatic`。


    ### getRequestHandler()


    此方法基本上允许 Next 像默认方式一样处理路由，因此，当我们不希望执行自定义逻辑时，我们将使用 `createServer` 方法中适当的 `req`
    和 `res` 对象调用此方法。


    它返回另一个函数 `handle`，可以使用来自服务器的请求和响应对象调用该函数。


    ### serveStatic()


    我们使用另一个名为 `url` 的包将 URL 解析为不同部分——`hostname`、`pathname`、`protocol`、`port` 等。


    最后，我们检查路径名是否与 `/service-worker.js` 匹配。如果匹配，则使用 `app.serveStatic()` 方法。基本上，我们传入
    `req` 和 `res` 对象以及解析静态资源的路径。在我们的例子中，`service-worker.js` 文件作为直接子文件存在于 `.next` 文件夹中，因此我们直接使用
    `path.join` 获取路径。


    完成后，我们还需要对 `package.json` 文件进行一些修改。JSON 文件中的 `scripts` 部分应如下所示：


    ```

    “scripts”: {

    “dev”: “node server.js”,

    “build”: “next build”,

    “start”: “NODE_ENV=production node server.js”

    }

    ```


    最后，像上次一样创建一个 `manifest.json` 文件，将其放在 `.next` 文件夹中，并为其添加自定义路由。因此 `manifest.json`
    文件将如下所示：


    ```

    {

    “short_name”: “React App”,

    “name”: “Create React App Sample”,

    “icons”: [

    {

    “src”: “favicon.ico”,

    “sizes”: “64x64 32x32 24x24 16x16”,

    “type”: “image/x-icon”

    },

    {

    “src”: “logo192.png”,

    “type”: “image/png”,

    “sizes”: “192x192”

    },

    {

    “src”: “logo512.png”,

    “type”: “image/png”,

    “sizes”: “512x512”

    }

    ],

    “start_url”: “.”,

    “display”: “standalone”,

    “theme_color”: “#000000”,

    “background_color”: “#ffffff”

    }

    ```


    而我们的 `server.js` 文件将如下所示：


    ```

    const { createServer } = require(''http'')

    const { join } = require(''path'')

    const { parse } = require(''url'')

    const next = require(''next'')

    const app = next({ dev: process.env.NODE_ENV !== ''production'' })

    const handle = app.getRequestHandler()

    app.prepare()

    .then(() => {

    createServer((req, res) => {

    constparsedUrl = parse(req.url, true)

    const { pathname } = parsedUrl

    // handle GET request to /service-worker.js

    if (pathname === ''/service-worker.js'' || pathname === ''/manifest.json'' ||
    pathname === ''/logo512.png'' || pathname === ''/logo192.png'') {

    constfilePath = join(__dirname, ''.next'', pathname)

    app.serveStatic(req, res, filePath)

    } else {

    handle(req, res, parsedUrl)

    }

    })

    .listen(3000, () => {

    console.log(''> Ready on http://localhost:${3000}'')

    })

    })

    ```


    别忘了也将图标放在 `.next` 文件夹中！最后，为了提供 `manifest.json` 文件，我们需要在每个页面中将其作为 `link` 标签包含（就像上面
    React 示例中那样）。让我们使用 `Next.js` 中的 `_document.js` 文件来实现。


