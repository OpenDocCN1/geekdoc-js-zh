    \ `.jsx` 文件时，加载 babel。\n*   当我们想要查看输出时，需要启动一个 webpack 开发服务器，因此我们将以下内容添加到 `package.json`\
    \ 文件的 `scripts` 键中：`\"start\": \"webpack-dev-server --open\"`。\n*   现在，我们将为此创建一个静态\
