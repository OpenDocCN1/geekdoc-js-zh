- fmt: "\n*   Clearly, we can see that this code looks much concise and cleaner than\
    \ the above, plus we avoid the extra component hierarchy when we don’t use an\
    \ HoC above our main component.\n\n*   `useDispatch()` hook just returns us a\
    \ dispatch function which we have to wrap around our dispatch methods. Remember,\
    \ the function `setUserDetails` actually returns a plain object, and we’re actually\
    \ calling dispatch with the first argument as a plain JSON object only. The reason\
    \ we didn’t need to call dispatch earlier was because that was done by redux under\
    \ the hood when we passed it in the `connect` method.\n\n*   `useSelector()` hook\
    \ allows you to pass a function that allows you to filter out which value you\
    \ want to extract out. `useSelector()` performs a shallow comparison by default\
    \ on change and would re-render the component if that shallow comparison detects\
    \ any change. For our case right now, our user object changes from null to a well-defined\
    \ object, so it should be fine for us.\n\nNow if we look at the output, there\
    \ should be no difference whatsoever, and it should just work fine. This is how\
    \ we would use hooks with React + Redux.\n\n# [Creating the Dashboard page](#toc.xhtml_s116a)\n\
    \nLet’s go ahead and create a dashboard page with a `dashboard/index.tsx` file\
    \ in `pages/` directory. Here’s how the file structure would look like:\n\n![](images/image34.jpg)\n\
    \n**Figure 7.11**\n\nThe preceding screenshot shows how the file structure looks\
    \ right now.\n\nWe’ll keep our dashboard page simple for now, and would just put\
    \ the following code in the `dashboard/index.tsx` file:\n\n```\nimport React from\
    \ ‘react’\nimport { NextPage } from ‘next’\nimport { useSelector } from ‘react-redux’\n\
    \nconst DashboardPage: NextPage = () => {\n  const user = useSelector((state:\
    \ any) =>state.user)\n  if(!user) return <p>User not available</p>\n  return (\n\
    \    <div id=”dashboard”>\n      <h1>Hello {user.name}</h1>\n      <p>Your favorite\
    \ quote: {user.favQuote}</p>\n    </div>\n  )\n}\n\nexport default DashboardPage\n\
    ```\n\nAlright! Now it’s time to redirect the user to `/dashboard` route only\
    \ when the login was correct. Let’s update our `pages/index.tsx` file.\n\n# [Conditional\
    \ routing](#toc.xhtml_s117a)\n\nTo conditionally redirect the user to a different\
    \ page, we’ll use the Router package from `next/router`. Let’s go ahead and use\
    \ it:\n\n```\n// pages/index.tsx\nimport React, { useState } from ‘react’\nimport\
    \ { NextPage } from ‘next’\nimport ‘./styles.css’\nimport { useSelector, useDispatch\
    \ } from ‘react-redux’\nimport { setUserDetails } from ‘../redux/actions’\nimport\
    \ Router from ‘next/router’\n\nconst IndexPage: NextPage = () => {\n  const dispatch\
    \ = useDispatch()\n  const name = useSelector((state: any) =>state.user&& state.user.name)\n\
    \  const [username, setUsername] = useState<string>(‘’)\n  const [password, setPassword]\
    \ = useState<string>(‘’)\n\n  async function submitForm() {\n    const req = await\
    \ fetch(‘/api/login’, {\n      method: ‘POST’,\n      headers: {\n        ‘Content-Type’:\
    \ ‘application/json’\n      },\n      body: JSON.stringify({ username, password\
    \ })\n    })\n    const json = await req.json()\n    if(json.status === ‘ok’)\
    \ {\n      dispatch(setUserDetails(json.data))\n      `Router.push(‘/dashboard’)`\n\
    \    } else {\n      alert(‘Incorrect Login’)\n    }\n  }\n\n  return (\n    <form\
    \ method=”POST”>\n      <div className=”box”>\n        <h1>Login</h1>\n      \
    \  {name || ‘na’}\n        <input type=”text” placeholder=”Username” className=”field”\
    \ value={username} onChange={e =>setUsername(e.target.value)} />\n        <input\
    \ type=”password” placeholder=”Password” className=”field” value={password} onChange={e\
    \ =>setPassword(e.target.value)} />\n        <div className=”btn” onClick={submitForm}>Sign\
    \ In</div>\n      </div>\n    </form>\n  )\n}\n\nexport default IndexPage\n```\n\
    \nNow when you hit login with correct credentials, you should get something like\
    \ this:\n\n![](images/image83.jpg)\n\n**Figure 7.12**\n\nThe preceding screenshot\
    \ shows what the Dashboard page would look like.\n\nAnd when you refresh the page,\
    \ you should get the message `User not found`, which is correct by logic, as we’re\
    \ not persisting our redux store, nor are we trying to see if the user is already\
    \ logged in the application and if yes, retrieve the user data. We’ll fix that\
    \ later.\n\nLet’s look at nested routing first.\n\n# [Nested routes](#toc.xhtml_s118a)\n\
    \nLet’s start with a simple use case. We’ve created top-level paths (that is,\
    \ `/home` or `/about`, and so on) but how about `/home/page-x?` Well, it turns\
    \ out that in `Next.js` it is as simple as nesting folders inside one another.\
    \ Let’s create the following file:\n\n`pages/path1/path2/path3.tsx`\n\nAnd write\
    \ the following code inside it:\n\n```\nimport React from ‘react’\nimport { NextPage\
    \ } from ‘next’\n\nconst PathPage: NextPage = () => {\n  return (\n    <h1>Hello\
    \ from very deep inside!</h1>\n  )\n}\n\nexport default PathPage\n```\n\nLet the\
    \ server apply changes, and when you visit `http://localhost:3000/path1/path2/path3`,\
    \ you should be able to see the following:\n\n![](images/image53.jpg)\n\n**Figure\
    \ 7.13**\n\nThe preceding screenshot shows an example of nesting routing in the\
    \ browser.\n\nAnother thing you should know about is that you can create `path3`\
    \ as the folder and place the preceding code in `path3/index.tsx` and it would\
    \ work just the same. With Next.js 9+, we also have support for dynamic routing.\
    \ Let’s see what it is and how it can work.\n\n# [Dynamic routing](#toc.xhtml_s119a)\n\
    \nNext.js has recently introduced dynamic routing, which opens doors for matching\
    \ a whole lot of URLs instead of just static routes which we’ve been doing so\
    \ far with the `pages` directory. Let’s create a file called `users/index.tsx`\
    \ inside the `pages/` directory. We would also create a file called `users/[param].tsx`.\
    \ Here’s the code for both:\n\n```\n// pages/users/index.tsx\nimport React from\
    \ ‘react’\nimport { NextPage } from ‘next’\n\nconst UsersPage: NextPage = () =>\
    \ {\n  return (\n    <h1>Just a regular file</h1>\n  )\n}\n\nexport default UsersPage\n\
    ```\n\nAnd the other file:\n\n```\n// pages/users/[param].tsx\nimport React from\
    \ ‘react’\nimport { NextPage } from ‘next’\n\nconst UsersPageDynamic: NextPage\
    \ = () => {\n  return (\n    <h1>Just a regular file too</h1>\n  )\n}\n\nexport\
    \ default UsersPageDynamic\n```\n\nNow, when you visit `http://localhost:3000/users`,\
    \ you’ll see this page:\n\n![](images/image123.jpg)\n\n**Figure 7.14**\n\nBut\
    \ if you visit any other route matching `/users/<anything here>` you’ll see this:\n\
    \n![](images/image44.jpg)\n\n**Figure 7.15**\n\nBut we know that we don’t have\
    \ any file named `users/abcd`. So, what’s happening here?\n\n*   When you name\
    \ a file in square brackets (like we did with `[param].tsx`), that means `Next.js`\
    \ considers it to match anything when placed under a different route.\n\n*   Then\
    \ what about the name of the file? Well, we can extract information about the\
    \ route using the param, that is, the name of the file. Let’s modify our `[param].tsx`\
    \ file to better reflect this:\n\n    ```\n    // pages/users/[param].tsx\n  \
    \  import React from ‘react’\n    import { NextPage } from ‘next’\n    import\
    \ { useRouter } from ‘next/router’\n\n    const UsersPageDynamic: NextPage = ()\
    \ => {\n      const router = useRouter()\n      console.log(router)\n      return\
    \ (\n        <h1>Just a regular file too {router.query.param}</h1>\n      )\n\
    \    }\n\n    export default UsersPageDynamic\n    ```\n\nWith this being there,\
    \ if I visit the URL `http://localhost:3000/users/mehul` I should see the following\
    \ in the console:\n\n![](images/image132.jpg)\n\n**Figure 7.16**\n\nLet’s discuss\
    \ why that is the case:\n\n*   You can see, in the URL the `param` value is `mehul`\
    \ which is reflected on the screen because of `router.query.param`\n\n*   On the\
    \ right, in the console, we can get all the information the hook `useRouter` returns\
    \ us. We can see `param` is one of them inside the `query` property. This is coming\
    \ directly from the name of the file. If you name the file something else, it\
    \ would be something else.\n"
