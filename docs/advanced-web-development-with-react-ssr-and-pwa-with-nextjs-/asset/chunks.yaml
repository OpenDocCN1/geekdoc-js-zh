    `<script src=”./app.bundle.js”></script>`


    `</body>`


    `</html>`


    `’`


    `}`


    Okay! So what’s happening in this file?


    *   First, we collect all components together in an array called components.


    *   Then we create an array of Promises. Finally, this array would contain multiple
    unresolved fetch requests.


    *   Here, we start with our components array and create a new array of objects
    with the link to fetch (the `asyncData` link) and the name of the component (in
    JavaScript, `Function.name` gives you the name of that function)


    *   We use the name to link it to a specific component.


    *   Finally, we filter this array to remove elements that did not have any `async`
    data to be fetched.


    *   When we’re done with it, we do a final map where we fetch all the data and
    return the promise. See, in the fetch request, I’m assigning `item.name` as the
    key in `asyncData` object, and `json` (the result returned from a remote server),
    as the value in `asyncData` object.


    *   At this point, promises contain all fetch requests going on in parallel. Now,
    we want to wait for all the fetch requests before sending data back to the client.


    *   Hence, we wait for all Promises to resolve using `Promise.all`. Once that
    is done, we construct our ReactDOM and send it to the client.


    *   For the client, we do a normal hydrate, but we also send the client state
    using a script tag, as seen at the endof the HTML section.


    And once we do that, you would be able to see that there is no *fetching* of data
    on the frontend. The page loads up immediately, and there’s no fetch request in
    the DevTools because all the data is already available for us from the server:


    ![](images/image14.jpg)


    **Figure 5.13**


    In the preceding screenshot, you can see there’s no data request to the remote
    server because it is already available with the frontend when the server sendsthe
    data. Awesome! But we have some problems even after this approach:


    Our constructed tree is now inconsistent between server and client renders. This
    is because, when the react code is rendered on the server, it doesn’t know about
    `process.env.BROWSER` hence it doesn’t prefill the state variable, and hence it
    usesthat `Loading` segment. On the client-side, however, when React rehydrates
    the data, it already has the data in the global scope, so it rehydrates it with
    the actual data, hence creating an inconsistency, which React reports to us as
    well in the console:


    ![](images/image71.jpg)


    **Figure 5.14**


    *   In this preceding screenshot, you can see that React complains about DOM mismatch,
    what it expects versus what server actually sent.


    *   Another thing, we’re fetching the `async` data of all components, although
    we just need to fetch the `async` data of the active component.


    *   We are also not handling the nested component problem, where a lot of nested
    components need `async` data from each other.


    *   A single component might need multiple `async` data from various sources;we
    don’t handle that either.


    # [Conclusion](#toc.xhtml_s82a)


    Remember, we discussed back that SSR with React is not a cakewalk;you need to
    handle a lot of edge cases for it to work for you properly. Hence, it is not feasible
    to fix each and every small detail yourself. Hence, we’ll be using certain frameworks
    that would abstract a lot of these details from us and allow us to focus more
    on the code rather than on these small details to be implemented. In the coming
    chapters, we’ll be talking about Next.js, one such popular framework for React
    to create production-ready server-side rendering applications.


    # [Questions](#toc.xhtml_s83a)


    1.  How does Server Side Rendering differ from normal client-side React code?


    2.  Is PHP a server-side rendering language? Why/Why not?


    3.  What does Babel do?


    4.  What is the difference between `StaticRouter` and Normal `Router`?


    5.  What is the difference between `ReactDOM.render` and `ReactDOM.hydrate`?


    6.  What do you mean by isomorphic JavaScript?


    # [CHAPTER 6](#toc.xhtml_c06)


    # [Introduction to Next.js](#toc.xhtml_c06)


    In the last chapter, we learned a lot about getting started with server-side rendering
    with React from bare-bones and saw how much tooling it could take just to get
    to simple results synchronized between client and server machines. Now, let’s
    get into Next.js, see what it is and why it is a great option to go about.


    # [Structure](#toc.xhtml_s84a)


    *   What is Next.js


    *   Installation


    *   Default settings


    *   Pages in Next.js


    *   Static assets


    *   Routing


    *   Components


    *   CSS


    # [Objective](#toc.xhtml_s85a)


    This chapter aims to introduce you to `Next.js`, which is a server-side rendering
    framework built for React. `Next.js` is going to simplify a lot of workflow for
    you as a developer so that more energy could be spent on the application logic
    and purpose and less energy on the infrastructure part. We’ll learn about what
    it is, how to set it up and work with it in an effective manner.


    # [What is Next.js?](#toc.xhtml_s86a)


    `Next.js` is a framework for building server-side applications with React. A framework
    provides a lot of things out of the box. `Next.js` provides solutions to routing,
    managing pages, server-side rendering, caching, etc. out of the box and is extremely
    easy to set up.


    You could compare `Next.js` ease-of-setup that to of create-react-app. Just like
    how cumbersome it is to set up a React project manually, in the last chapter,
    we saw that it is equally cumbersome to set up a React SSR project manually. `Next.js`
    to the rescue!


    # [Why Next.js?](#toc.xhtml_s87a)


    From their official site, here are some points explaining why it is a good choice:


    1.  Server Rendering: This is the main reason for using Next.js.


    2.  Static Export: This means that you could generate a static bundle of your
    website (not possible in every case) if you want within a few clicks and commands.


    3.  CSS-in-JS: CSS in JS is a popular technique in which people write styles directly
    in JS. Some people frown upon the practice, but more or less, the community appreciates
    it and has developed numerous solutions around it. Next.js supports all of them


    4.  Zero setup: It is as simple as create-react-app when setting it up. We’ll
    be up and ready with our Hello World with Next.js within a few minutes.'
