  trans: "\n我们上面已经用 React SSR 完成了基本的 Hello World，这是第一次使用 React 进行服务端渲染。现在让我们添加更多组件。先从首页和关于页面开始：\n\
    \n```javascript\n// Home.js\nconst React = require('react')\nfunction Home(props)\
    \ {\n  return <div className=\"home\">\n    <h2>Hello, this is homepage! Go to\
    \ <a href=\"/about\">About</a></h2>\n  </div>\n}\nmodule.exports = Home\n```\n\
    \n以及 `About.js` 页面：\n\n```javascript\nconst React = require('react')\nfunction\
    \ About(props) {\n  return <div className=\"about\">\n    <h2>This is the about\
    \ page</h2>\n  </div>\n}\nmodule.exports = About\n```\n\n但你是否发现了上面的问题？我们如何将它们链接起来？也就是说，当你在首页点击那个链接时，关于页面应该打开；同样，当你直接访问\
    \ `/about` 端点时，它应该直接提供那个特定页面。让我们来做一些路由。\n\n# SSR 中的路由\n\n路由是当今 Web 应用最重要的方面之一，尤其是当应用稍微复杂时。它允许你在不同的\
    \ URL 路径上提供不同的内容。\n\n首先安装 react-router 包，它将帮助我们实现路由。\n\n`npm install react-router-dom\
    \ --save`\n\n安装完成后，我们就可以做一些改动了。让我们稍微修改一下 `server.js` 文件：\n\n```javascript\n//\
    \ server.js\nconst express = require(\"express\")\nconst app = express()\nconst\
    \ React = require(\"react\")\nconstReactDOMServer = require(\"react-dom/server\"\
    )\nconst { StaticRouter, Switch, Route } = require(\"react-router-dom\")\nconst\
    \ Home = require('./components/Home')\nconst About = require('./components/About')\n\
    app.get('/*', (req, res) => {\n  constjsx = <StaticRouter>\n    <Switch>\n   \
    \   <Route path=\"/\" component={Home} exact={true} />\n      <Route path=\"/about\"\
    \ component={About} exact={true} />\n    </Switch>\n  </StaticRouter>\n  constreactDom\
    \ = ReactDOMServer.renderToString(jsx)\n  res.send(template(reactDom))\n});\n\
    app.listen(1337)\nfunction template(reactDom) {\n  return '\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"utf-8\">\n<title>React SSR</title>\n</head>\n\
    <body>\n<div id=\"root\">${reactDom}</div>\n</body>\n</html>\n'\n}\n```\n\n好了！让我们看看这里改了什么：\n\
    \n*   我们从 `react-router-dom` 包中引入了 `StaticRouter`、`Switch` 和 `Route` 模块。\n*  \
    \ `StaticRouter` 是一个简单的路由器，其位置永远不会改变。这没问题，因为我们只是在服务器上渲染 React 字符串，不涉及用户交互。\n*\
    \   然后我们定义了 `Switch` 来匹配第一个路由，接着是 `Route`，它包含了在特定路由上显示哪个组件的额外信息。\n\n如果我们现在访问页面，它会显示首页：\n\
    \n![](img/image10.jpg)\n\n**图 5.6**\n\n但如果你访问 `/about` 路由，它仍然只显示相同的首页组件，如下面的截图所示：\n\
    \n![](img/image23.jpg)\n\n**图 5.7**\n\n上面的截图仍然显示渲染的是 `Home` 组件。这是为什么？仔细看，我们的 `StaticRouter`\
    \ 虽然是静态的，但仍然需要知道正确的位置才能解析正确的路由。我们在静态路由器上缺少了 location 属性。另外，对于 Express，`req.url`\
    \ 提供了请求的路径（即 `/about` 或 `/` 或 `/test`），这正是我们需要传递给 `StaticRouter` 的内容。让我们在 `server.js`\
    \ 文件中做如下修改：\n\n```javascript\n<StaticRouter location={req.url}>\n  <Switch>\n\
    \    <Route path=\"/\" component={Home} exact={true} />\n    <Route path=\"/about\"\
    \ component={About} exact={true} />\n  </Switch>\n</StaticRouter>\n```\n\n所以我们只是给\
    \ `StaticRouter` 添加了 `location={req.url}`。完成这一步后，现在如果你直接访问 `/about`，我们将得到 `/about`\
    \ 组件：\n\n![](img/image32.jpg)\n\n**图 5.8**\n\n在上面的截图中，我们看到问题已经解决。它正确地渲染了 `About`\
    \ 组件在正确的 URL 路径上。到目前为止一切顺利。但我们还可以做得更好。\n\n# 客户端 React\n\nReact 是一个客户端库。然而，在上述\
    \ SSR React 中，我们看到我们可以使用基于静态路由器的系统在服务器上编写类似 React 的标记，并将其发送到客户端机器。但在这个过程中，我们丢失了前端的实际“React”代码。让我们把它找回来。\n\
    \n让我们创建另一个名为 `client.js` 的文件，并在其中编写以下代码：\n\n```javascript\nimport React from 'react'\n\
    import ReactDOM from 'react-dom'\nimport Home from './components/Home'\nimport\
    \ About from './components/About'\nimport { BrowserRouter as Router, Route, Switch\
    \ } from 'react-router-dom'\nconstjsx = (\n  <Router>\n    <Switch>\n      <Route\
    \ path=\"/\" component={Home} exact={true} />\n      <Route path=\"/about\" component={About}\
    \ exact={true} />\n    </Switch>\n  </Router>\n)\nconst app = document.getElementById('root')\n\
    ReactDOM.hydrate(jsx, app)\n```\n\n我们将把这个文件与 `server.js` 放在一起。为了明确文件结构，以下是到目前为止所有文件的组织：\n\
    \n![](img/image111.jpg)\n\n**图 5.9**\n\n上面的截图显示了项目中的文件结构。你在前面的代码中可能已经注意到，我们使用了\
    \ `ReactDOM.hydrate` 而不是 `ReactDOM.render`，我们将在本节后面讨论这一点。\n\n首先，让我们设置其他东西。我们还将修改\
    \ server.js 文件以包含我们的 client.js 文件。最终 `server.js` 文件应该如下所示：\n\n```javascript\n\
    const express = require(\"express\")\nconst app = express()\nconst React = require(\"\
    react\")\nconstReactDOMServer = require(\"react-dom/server\")\nconst { StaticRouter,\
    \ Switch, Route } = require(\"react-router-dom\")\nconst Home = require('./components/Home')\n\
    const About = require('./components/About')\napp.use(express.static(path.resolve(__dirname,\
    \ '../dist')))\napp.get('/*', (req, res) => {\n  console.log(req.url)\n  constjsx\
    \ = <StaticRouter location={req.url}>\n    <Switch>\n      <Route path=\"/\" component={Home}\
    \ exact={true} />\n      <Route path=\"/about\" component={About} exact={true}\
    \ />\n    </Switch>\n  </StaticRouter>\n  constreactDom = ReactDOMServer.renderToString(jsx)\n\
    \  res.send(template(reactDom))\n});\napp.listen(1337)\nfunction template(reactDom)\
    \ {\n  return '\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>React\
    \ SSR</title>\n</head>\n<body>\n<div id=\"root\">${reactDom}</div>\n<script src=\"\
    ./app.bundle.js\"></script>\n</body>\n</html>\n'\n}\n```\n\n注意加粗的行。首先，在 Express\
    \ 服务器中，我们配置了提供静态文件（即我们上面创建的客户端打包文件）。\n\n然后，我们在 HTML 响应中包含了脚本本身。\n\n# ReactDOM.hydrate\n\
    \n我们没有使用 `ReactDOM.render`，而是使用了 `ReactDOM.hydrate`。顾名思义，`ReactDOM.hydrate` 只是*水合*现有的布局，它不会创建布局并替换\
    \ DOM 中的内容。`ReactDOM.hydrate` 知道布局字符串来自服务器，因此它只需要将客户端 JS（即事件和监听器）与来自服务器的 HTML\
    \ 代码同步。因此，我们使用了 hydrate 方法。\n\n这里需要注意一件有趣的事情：`ReactDOM.hydrate` 期望你在前端（client.js\
    \ 中）提供的布局与后端（`server.js`）提供的布局接近，否则会给你带来问题。\n\n最后，让我们为前端设置 webpack，以便我们可以使用 import/export\
    \ 语法，并实际在前端使用 React。\n\n我们之前已经安装了 webpack，所以直接创建一个 webpack.config.js 文件，如下所示：\n\
    \n```javascript\nconst path = require('path')\nmodule.exports = {\n  mode: 'development',\n\
    \  devtool: 'source-map',\n  entry: {\n    app: './src/client.js',\n  },\n  module:\
    \ {\n    rules: [\n      {\n        test: /\\.jsx?$/,\n        exclude: /(node_modules|bower_components)/,\n\
    ```\n\n"
