    \n# 获取数据\n\n尽管使用 React 进行 SSR 很棒，但有时你会遇到某些困难，因为有些东西只在浏览器环境中可用，有些只在 Node 环境中可用。其中之一就是如何获取数据。\n\
    \n让我们使用一个名为 `isomorphic-fetch` 的包，它允许我们在两种环境中使用 `fetch`：\n\n`npm install isomorphic-fetch\
    \ --save`\n\n现在，让我们修改 `Home.js` 文件，使其看起来像这样：\n\n```\n// Home.js\nconst React =\
    \ require('react')\nconst { Link } = require('react-router-dom')\nrequire('isomorphic-fetch')\n\
    const { useEffect, useState } = React\n\nfunction Home(props) {\n  const [data,\
    \ setData] = useState(null)\n\n  useEffect(() => {\n    fetch('https://jsonplaceholder.typicode.com/posts/1').then(data\
    \ => data.json())\n    .then(data => setData(data))\n  }, [])\n\n  if(!data) return\
    \ <p>加载中…</p>\n\n  return <div className=\"home\">\n    <h2>{data.title}</h2>\n\
    \    <p>{data.body}</p>\n    <Link to=\"/about\">关于</Link>\n  </div>\n}\n\nmodule.exports\
    \ = Home\n```\n\n注意这里；我们使用了 hooks。由于 `useEffect` 钩子在组件挂载后运行，其中的代码无论如何都不会在服务器上执行。所以我们可以直接使用\
    \ `fetch` 而不需要 `isomorphic-fetch` 库，但暂时我们还是继续使用它。\n\n然后我们最终获取数据并在客户端显示：\n\n![](img/image141.jpg)\n\
    \n**图 5.12**\n\n上面的截图展示了我们如何在客户端获取数据。到目前为止，看起来也不错。但我们能做得更好吗？如果直接在服务器端（Node 环境）获取数据，然后将其发送给客户端，会怎么样？服务器是强大的计算机，可以对常用资源实现强缓存，并能大大加快速度。然而，同步服务端状态和客户端状态开始变得麻烦，正如我们接下来要看到的。\n\
    \n# 在服务器上获取数据\n\n思路是，我们将通过一个属性暴露特定组件所需的任何数据，然后在实际将 JSX 渲染为字符串之前，解析所有的 Promise\
    \ 和数据获取。最后，以某种方式同步状态和 React 代码。让我们简要看看如何实现。让我们看看更新后的 `Home.js` 文件。请稍等一下：\n\n```\n\
    // Home.js\nconst React = require('react')\nconst { Link } = require('react-router-dom')\n\
    require('isomorphic-fetch')\nconst { useEffect, useState } = React\n\nfunction\
    \ Home(props) {\n  const [data, setData] = useState(process.env.BROWSER && window.componentsData[Home.name])\n\
    \n  useEffect(() => {\n    if(!data) {\n      fetch('https://jsonplaceholder.typicode.com/posts/1').then(data\
    \ => data.json())\n      .then(data => setData(data))\n    }\n  }, [])\n\n  if(!data)\
    \ return <p>加载中…</p>\n\n  return <div className=\"home\">\n    <h1>这是主页</h1>\n\
    \    <h2>{data.title}</h2>\n    <p>{data.body}</p>\n    <Link to=\"/about\">关于</Link>\n\
    \  </div>\n}\n\nHome.asyncData = 'https://jsonplaceholder.typicode.com/posts/1'\n\
    \nmodule.exports = Home\n```\n\n让我们通过以下几点来理解上述代码的作用：\n\n*   好了。这里，我们添加了一些检查，看数据是否已经可用。\n\
    *   首先，我们使用 `process.env.BROWSER` 检查是否在浏览器环境中（我们稍后会在 webpack 中配置这个）。\n*   如果是浏览器，我们希望从全局\
    \ window 对象加载状态（我们会设置好这个）。\n*   `Home.name` 返回 \"Home\"，即函数名。\n\n我们还为 `Home` 组件添加了\
    \ `asyncData` 属性，稍后将用于在服务器上预取数据。\n\n让我们也更新 `About.js` 文件：\n\n```\nconst React\
    \ = require('react')\nconst { Link } = require('react-router-dom')\nconst { useState,\
    \ useEffect } = React\n\nfunction About(props) {\n  const [data, setData] = useState(process.env.BROWSER\
    \ && window.componentsData[About.name])\n\n  useEffect(() => {\n    if(!data)\
    \ {\n      fetch('https://jsonplaceholder.typicode.com/posts/2').then(data =>\
    \ data.json())\n      .then(data => setData(data))\n    }\n  }, [])\n\n  if(!data)\
    \ return <p>加载中…</p>\n\n  return <div className=\"about\">\n    <h1>这是关于页面</h1>\n\
    \    <h2>{data.title}</h2>\n    <p>{data.body}</p>\n    <Link to=\"/\">主页</Link>\n\
    \  </div>\n}\n\nAbout.asyncData = 'https://jsonplaceholder.typicode.com/posts/2'\n\
    \nmodule.exports = About\n```\n\n与 `Home.js` 类似，我们在 `About.js` 文件中也在获取更多数据。此外，我们为\
    \ `About` 组件附加了一个 `asyncData` 属性，稍后将用到。\n\n另外，当 webpack 构建我们的脚本时，我们需要访问 `process.env.BROWSER`\
    \ 变量，因此我们将在 `webpack.config.js` 文件中添加它。最终我们的 `webpack.config.js` 文件将如下所示：\n\n\
    ```\nconst path = require('path')\nconst webpack = require('webpack')\n\nmodule.exports\
    \ = {\n  mode: 'development',\n  devtool: 'source-map',\n  entry: {\n    app:\
    \ './src/client.js',\n  },\n  module: {\n    rules: [\n      {\n        test:\
    \ /\\.jsx?$/,\n        exclude: /(node_modules|bower_components)/,\n        loader:\
    \ \"babel-loader\",\n      }\n    ],\n  },\n  output: {\n    path: path.resolve(__dirname,\
    \ 'dist'),\n    filename: '[name].bundle.js',\n  },\n}\n```\n"
- fmt: "\n```\nplugins: [\n  new webpack.DefinePlugin({\n    'process.env': {\n  \
    \    'BROWSER': 'true',\n    }\n  })\n]\n```\n\nOnce this is done, let’s see what\
    \ changes we have to make in the `server.js` file:\n\n```\nconst express = require(\"\
    express\")\nconst app = express()\nconst React = require(\"react\")\nconst path\
    \ = require('path')\nconstReactDOMServer = require(\"react-dom/server\")\nconst\
    \ { StaticRouter, Switch, Route } = require(\"react-router-dom\")\nconst Home\
    \ = require('./components/Home')\nconst About = require('./components/About')\n\
    require('isomorphic-fetch')\napp.use(express.static(path.resolve(__dirname, '../dist')))\n\
    app.get('/*', (req, res) => {\n  const components = [Home, About]\n  constasyncData\
    \ = {}\n  const promises = components.map(c => ({\n    link: c.asyncData,\n  \
    \  name: c.name\n  })).filter(item =>item.link).map(item => {\n    return fetch(item.link).then(data\
    \ =>data.json()).then(json => {\n      asyncData[item.name] = json\n    })\n \
    \ })\n  constjsx = <StaticRouter location={req.url}>\n    <Switch>\n      <Route\
    \ path=\"/\" component={Home} exact={true} />\n      <Route path=\"/about\" component={About}\
    \ exact={true} />\n    </Switch>\n  </StaticRouter>\n  Promise.all(promises).then(()\
    \ => {\n    constreactDom = ReactDOMServer.renderToString(jsx)\n    res.send(template(reactDom,\
    \ asyncData))\n  })\n})\napp.listen(1337)\nfunction template(reactDom, data) {\n\
    \  return '\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>React\
    \ SSR</title>\n</head>\n<body>\n<div id=\"root\">${reactDom}</div>\n<script>\n\
    window.componentsData = ${JSON.stringify(data)}\n</script>\n<script src=\"./app.bundle.js\"\
    ></script>\n</body>\n</html>\n'\n}\n```\n\nOkay! So what’s happening in this file?\n\
    \n*   First, we collect all components together in an array called `components`.\n\
    *   Then we create an array of Promises. Finally, this array would contain multiple\
    \ unresolved fetch requests.\n*   Here, we start with our `components` array and\
    \ create a new array of objects with the link to fetch (the `asyncData` link)\
    \ and the name of the component (in JavaScript, `Function.name` gives you the\
    \ name of that function)\n*   We use the name to link it to a specific component.\n\
    *   Finally, we filter this array to remove elements that did not have any `async`\
    \ data to be fetched.\n*   When we’re done with it, we do a final map where we\
    \ fetch all the data and return the promise. See, in the fetch request, I’m assigning\
    \ `item.name` as the key in `asyncData` object, and `json` (the result returned\
    \ from a remote server), as the value in `asyncData` object.\n*   At this point,\
    \ `promises` contain all fetch requests going on in parallel. Now, we want to\
    \ wait for all the fetch requests before sending data back to the client.\n* \
    \  Hence, we wait for all Promises to resolve using `Promise.all`. Once that is\
    \ done, we construct our `ReactDOM` and send it to the client.\n*   For the client,\
    \ we do a normal `hydrate`, but we also send the client state using a script tag,\
    \ as seen at the endof the HTML section.\n\nAnd once we do that, you would be\
    \ able to see that there is no `fetching` of data on the frontend. The page loads\
    \ up immediately, and there’s no fetch request in the DevTools because all the\
    \ data is already available for us from the server:\n\n![](images/image14.jpg)\n\
    \n**Figure 5.13**\n\nIn the preceding screenshot, you can see there’s no data\
    \ request to the remote server because it is already available with the frontend\
    \ when the server sendsthe data. Awesome! But we have some problems even after\
    \ this approach:\n\nOur constructed tree is now inconsistent between server and\
    \ client renders. This is because, when the react code is rendered on the server,\
    \ it doesn’t know about `process.env.BROWSER` hence it doesn’t prefill the state\
    \ variable, and hence it usesthat `Loading` segment. On the client-side, however,\
    \ when React rehydrates the data, it already has the data in the global scope,\
    \ so it rehydrates it with the actual data, hence creating an inconsistency, which\
    \ React reports to us as well in the console:\n\n![](images/image71.jpg)\n\n**Figure\
    \ 5.14**\n\n*   In this preceding screenshot, you can see that React complains\
    \ about DOM mismatch, what it expects versus what server actually sent.\n*   Another\
    \ thing, we’re fetching the `async` data of all components, although we just need\
    \ to fetch the `async` data of the active component.\n*   We are also not handling\
    \ the nested component problem, where a lot of nested components need `async`\
    \ data from each other.\n*   A single component might need multiple `async` data\
    \ from various sources;we don’t handle that either.\n\n# Conclusion\n\nRemember,\
    \ we discussed back that SSR with React is not a cakewalk;you need to handle a\
    \ lot of edge cases for it to work for you properly. Hence, it is not feasible\
    \ to fix each and every small detail yourself. Hence, we’ll be using certain frameworks\
    \ that would abstract a lot of these details from us and allow us to focus more\
    \ on the code rather than on these small details to be implemented. In the coming\
    \ chapters, we’ll be talking about Next.js, one such popular framework for React\
    \ to create production-ready server-side rendering applications.\n\n# Questions\n\
    \n1.  How does Server Side Rendering differ from normal client-side React code?\n\
    2.  Is PHP a server-side rendering language? Why/Why not?\n3.  What does Babel\
    \ do?\n4.  What is the difference between `StaticRouter` and Normal `Router`?\n\
    5.  What is the difference between `ReactDOM.render` and `ReactDOM.hydrate`?\n\
    6.  What do you mean by isomorphic JavaScript?\n\n# CHAPTER 6\n\n# Introduction\
    \ to Next.js\n\nIn the last chapter, we learned a lot about getting started with\
    \ server-side rendering with React from bare-bones and saw how much tooling it\
    \ could take just to get to simple results synchronized between client and server\
    \ machines. Now, let’s get into Next.js, see what it is and why it is a great\
    \ option to go about.\n\n# Structure\n\n*   What is Next.js\n*   Installation\n\
    *   Default settings\n*   Pages in Next.js\n*   Static assets\n*   Routing\n*\
    \   Components\n*   CSS\n\n# Objective\n\nThis chapter aims to introduce you to\
    \ `Next.js`, which is a server-side rendering framework built for React. `Next.js`\
    \ is going to simplify a lot of workflow for you as a developer so that more energy\
    \ could be spent on the application logic and purpose and less energy on the infrastructure\
    \ part. We’ll learn about what it is, how to set it up and work with it in an\
    \ effective manner.\n\n# What is Next.js?\n\n`Next.js` is a framework for building\
    \ server-side applications with React. A framework provides a lot of things out\
    \ of the box. `Next.js` provides solutions to routing, managing pages, server-side\
    \ rendering, caching, etc. out of the box and is extremely easy to set up.\n\n\
    You could compare `Next.js` ease-of-setup that to of `create-react-app`. Just\
    \ like how cumbersome it is to set up a React project manually, in the last chapter,\
    \ we saw that it is equally cumbersome to set up a React SSR project manually.\
    \ `Next.js` to the rescue!\n\n# Why Next.js?\n\nFrom their official site, here\
    \ are some points explaining why it is a good choice:\n\n1.  Server Rendering:\
    \ This is the main reason for using Next.js.\n2.  Static Export: This means that\
    \ you could generate a static bundle of your website (not possible in every case)\
    \ if you want within a few clicks and commands.\n3.  CSS-in-JS: CSS in JS is a\
    \ popular technique in which people write styles directly in JS. Some people frown\
    \ upon the practice, but more or less, the community appreciates it and has developed\
    \ numerous solutions around it. Next.js supports all of them\n4.  Zero setup:\
    \ It is as simple as `create-react-app` when setting it up. We’ll be up and ready\
    \ with our Hello World with Next.js within a few minutes.\n"
