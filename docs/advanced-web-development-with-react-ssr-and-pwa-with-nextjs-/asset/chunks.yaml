  trans: "\n这不是 React 提供的生命周期方法，而是语言本身。不过，你可以在这里完成所有初始化工作，即初始化状态、设置全局事件监听器（如窗口大小变化等），并为组件的挂载做好准备。\n\
    \n## static getDerivedStateFromProps\n\n该方法在 v16.3 中新增，允许你在需要时根据 props 更新 state。`getDerivedStateFromProps`\
    \ 方法在首次挂载和后续挂载的 render 方法之前运行。它是静态方法，你不应在此方法中执行副作用（如动画或网络请求）。\n\n实际上，React 文档建议在大多数情况下你不需要实现这个生命周期方法。大部分工作可以通过我们接下来要讨论的其他方法完成：\n\
    \n```\nstatic getDerivedStateFromProps(props, state) {\n  if (props.email !==\
    \ state.email) {\n    return {\n      email: props.email\n    }\n  }\n  return\
    \ null\n}\n```\n\n可以看到，如果没有更新，我们返回 `null`，表示我们不打算更新组件的 state。你返回的任何内容都将作为组件的 state\
    \ 进行更新。\n\n## render\n\n这是基于类的 React 组件中唯一必须存在的方法。这是因为 React 是一个 UI 库，使用组件的目的是向用户输出一些视觉信息。因此，如果你使用\
    \ React 组件，必须定义 `render` 方法。从此方法返回的任何内容都会显示在屏幕上。以下是一个简单示例：\n\n```\nrender() {\n\
    \  return <p>Hello world!</p>\n}\n```\n\n## getSnapshotBeforeUpdate\n\nReact 在实际将内容写入浏览器（即\
    \ DOM）之前会调用此方法。此时，render 已被调用，但 DOM 尚未更新。同样，如文档所述，此方法仅用于特定场景，但了解可用的方法总是好的。你需要从此方法返回一个“快照”值，然后在另一个名为\
    \ `componentDidUpdate` 的生命周期方法中访问它。示例如下：\n\n```\ngetSnapshotBeforeUpdate(prevProps,\
    \ prevState) {\n  if (prevProps.prop1 !== this.props.prop1) {\n    return \"Prop\
    \ mismatch\";\n  }\n  return null\n}\n```\n\n返回 `null` 表示没有需要捕获的快照。然后我们可以在 `componentDidUpdate`\
    \ 中访问它，如下所示。\n\n## componentDidMount\n\n当 React 完成组件的挂载后，会调用 `componentDidMount`\
    \ 方法。但别急！此时组件对用户仍然不可见，因为它尚未写入 DOM。那么“挂载”是什么意思呢？它意味着组件已挂载到 React 的虚拟 DOM 中，并准备推送到真实\
    \ DOM。此时，如果你调用 `setState`，React 会重新渲染组件，但不会显示组件的中间状态。\n\n## componentDidUpdate\n\
    \n当你的组件更新时，React 会调用此方法。在初始挂载时，此方法不会被调用。它接收三个参数——`prevProps`、`prevState` 和 `snapshot`，分别代表之前的\
    \ props、之前的组件 state 以及来自 `getSnapshotBeforeUpdate` 方法的快照（如上所述）。以下是一个简单示例：\n\n\
    ```\ncomponentDidUpdate(prevProps, prevState, snapshot) {\n  if (this.props.id\
    \ !== prevProps.id) {\n    // 发起新的网络请求并更新 state\n  }\n}\n```\n\n## componentWillUnmount\n\
    \n顾名思义，此方法在组件被卸载时触发。这是清理全局事件监听器、取消网络请求和定时器等的最佳位置。这是 React 在组件生命周期中最后调用的方法。\n\n\
    以下是我找到的一张关于 React 生命周期方法的精美开源插图：\n\n![](img/image3.jpg)\n\n**图 3.8**\n\n## 结论\n\
    \n本章非常重要，因为它向我们介绍了组件——函数式组件和基于类的组件。此外，我们学习了钩子（hooks）、它们的工作原理以及如何创建自定义钩子。进一步地，我们了解了如何使用基于类的组件，以及为什么\
    \ React 将函数式组件视为该库的未来。我们将在后续章节中继续深入探讨更多 React 主题。\n\n## 问题\n\n1.  类组件和函数式组件有什么区别？\n\
    \n2.  将以下代码转译为有效的 JS：`<p><span>Hello</span> World</p>`\n\n3.  `useState` 是同步的吗？为什么是/为什么不是？\n\
    \n4.  `useEffect` 钩子的依赖数组有什么作用？\n\n5.  `useEffect` 钩子在组件渲染/更新之前还是之后运行？\n\n6. \
    \ 为什么钩子没有“生命周期方法”的概念？它与基于类的生命周期模型在根本上有什么不同？\n\n# 第四章\n\n## React 中的应用状态管理\n\n\
    在上一章中，我们扎实地了解了组件以及创建和使用它们的方法。我们注意到，大多数组件在拥有某种与之关联的状态（即组件“记住”的内容）时才真正有用。尽管如此，React\
    \ 通过 `useState` 钩子和 `this.state` 对象分别为函数式组件和基于类的组件提供了出色的支持。但随着代码的增长，有必要以更有组织的方式管理状态，避免\
    \ prop 逐层传递，并使事情更清晰，尤其是在不同嵌套级别的组件之间需要进行信息交换时。\n\n这可以称为管理应用程序的状态。让我们看看如何处理它。\n\n\
    ### 结构\n\n*   组件之间的通信\n*   使用 Context API\n    *   `createContext`\n    *   `useContext`\n\
    *   `useReducer` 钩子\n*   Redux 作为替代方案\n\n### 目标\n\n在本章中，我们旨在介绍 React 提供的用于管理应用程序状态的基本内置功能。在大多数情况下，这些功能足以满足项目需求，甚至更多。对于非常高级的情况，我们将使用基于\
    \ reducer 的模式，如 Redux。自 React 16.8 的钩子以来，React 提供了一个与 Redux 类似（但功能较弱）的内置解决方案。让我们在本章中全面了解它。\n\
    \n### 组件之间的通信\n\n仔细想想，管理应用程序状态大致上就是让大量组件之间有效传递某些信息的另一种说法。\n\n尽管你可以在组件中拥有局部状态，但当你想在组件之间进行通信时，事情就变得棘手了，尤其是当通信需要向上传递到组件层次结构，或者树中相隔很远时。这种情况经常发生。假设你通过内容区域中的链接退出网站，此信息应传递到头部（一个完全不同的组件），以便头部能够将链接更新回未认证用户应看到的链接。\n\
    \n让我们看看本章将学习的一些常见通信方式：\n\n*   Props（父组件向子组件传递数据）\n*   Refs（从父组件调用子组件方法）\n*   Context\
    \ API\n*   Redux（集中式状态）（后续章节）\n\n有趣的是，通过一点技巧，可以使用 Context API 实现双向通信，但 Redux 是真正解耦且集中的状态存储。Redux\
    \ 是中高级应用的首选，因为它具有单向数据流（注意！这并不意味着它只能单向通信）、集中式状态共享和出色的调试工具。我们先来看看 props。\n\n###\
    \ Prop 逐层传递\n\n"
- fmt: '

    Imagine you have a UI theme in your React application which holds values like
    colours and font sizes. Now, of course, these values need to be accessed by respective
    input fields and textareas. However, getting to those input fields in the first
    place in the hierarchy of the elements is a cumbersome task. You’ll need to drill
    your `fontSize` prop all the way down to the input field, even though none of
    the components in between needs to be aware ofit. Let’s see what this is.


    It is the most naivetechnique in sharing data among components. You use props
    to pass down data to the child components. Consider this very simple example:


    ```

    import React from ‘react’

    import ReactDOM from ‘react-dom’

    const App: React.FC<{ name: string, age: number }> = props => {

    return <div>

    <p>We’ve got all of your information!</p>

    <Profile name={props.name} age={props.age} />

    </div>

    }

    const Profile: React.FC<{ name: string, age: number }> = props => {

    return <div>

    <p>Here’s a complete information about you</p>

    <p>We save everything in our databases</p>

    <NameFormatter name={props.name} />

    <AgeFormatter age={props.age} />

    </div>

    }

    constNameFormatter: React.FC<{ name: string }> = props => {

    return <p>Like you can see, here’s your name: <TextField value={props.name} type=”text”
    /></p>

    }

    constAgeFormatter: React.FC<{ age: number }> = props => {

    return <p>Your age is: <TextField value={props.age} type=”number” /></p>

    }

    constTextField: React.FC<{ value: any, type: string }> = props => {

    return <input type={props.type} value={props.value} />

    }

    ReactDOM.render(<App name=”Mehul” age={20} />, document.getElementById(‘root’))

    ```


    If you observe here, you’d realize that the component `App` and `Profile` never
    needed to know about the props name and age. It was only `NameFormatter` and `AgeFormatter,`
    which required the respective values to render the UI correctly. However, because
    the props name and age are available at the `App` component level, in order to
    reach to `NameFormatter` and `AgeFormatter` component levels, you need to `drill`
    it down to them.


    This practice refers to prop drilling and usually is not required with the more
    advanced and sophisticated methods we have now for communication between components
    at the different hierarchical level. Let’s take a look at the different methods
    which could help us prevent situations like these.


    # [Refs](#toc.xhtml_s61a)


    Ref in react refers to creating a reference to something. A `ref` is an escape
    hatch from React, allowing you to peek directly inside the component or DOM, whatever
    you like. Hence, it should be handled with care. Because the things you do with
    refs areusually following imperative patterns, it kind of breaks the way react
    wants you to work with it - declaratively. But sometimes, it is very useful to
    go out the way a little because there’s only so much React could bring to the
    table cooked within itself.


    Using refs, not only could we communicate with the DOM directly, but we could
    also allow a parent to call a child’s method. We know that we could do it easily
    the other way using props, but it cannot be done using props for child component
    method which needs to be called by a parent. Let’s take a look at this example:


    This is `Parent.tsx` file:


    ```

    // Parent.tsx

    import React, { useRef } from ‘react’

    import ReactDOM from ‘react-dom’

    import ChildInput, { ChildInputHandles } from ‘./Child’

    const Parent: React.FC = () => {

    const ref = useRef<ChildInputHandles>(null)

    function setChildFocus() {

    if (ref.current) {

    ref.current.setFocus()

    }

    }

    return <div>

    <ChildInput ref={ref} defaultValue=”Hello World” />

    <button onClick={setChildFocus}>Set focus to input</button>

    </div>

    }

    ReactDOM.render(<Parent />, document.getElementById(‘root’))

    ```


    And the `Child.tsx` file:


    ```

    // Child.tsx

    import React, { RefForwardingComponent, forwardRef, useImperativeHandle, useRef
    } from ‘react’

    export interface ChildInputHandles {

    setFocus(): void

    }

    export interface ChildInputProps {

    defaultValue: string

    }

    constChildInput: RefForwardingComponent<ChildInputHandles, ChildInputProps> =
    (props, ref) => {

    constinputRef = useRef<HTMLInputElement>(null)

    useImperativeHandle(ref, () => ({

    setFocus() {

    if (inputRef.current) {

    inputRef.current.focus()

    }

    }

    }))

    return <input {…props} defaultValue={props.defaultValue} ref={inputRef} />

    }

    export default forwardRef(ChildInput)

    ```


    Let’s take a look what’s happening here:


    1. In `Parent.tsx` file, we first import the `ChildRef` component and give it
    a `ref` using the `useRef` hook. We use `<ChildInputHandles>` to type the methods
    and props we could access via `ourref.current` variable.

    2. We have a method `setChildFocus` function in Parent which actually uses refs
    to penetrate into the child component and call the specified function, that is,`setFocus`
    inside the child.

    3. In the `ChildInput` component, we type it as `RefForwardingComponent` as the
    TypeScript type to type the receiving props and props available via `ref` forwarding.

    4. We use another hook called `useImperativeHandle` which accepts our passed ref
    (see the second argument of `ChildInput` component) and binds certain methods
    which we could directly call on that `ref` inside the parent.

    5. Finally, we use a regular `inputRef` ref inside the Child itself to actually
    enable the focus inside the definition of `setFocus` inside the Child component.


    In this way, we could use the refs as an escape hatch to access functions and
    values inside children from parent components. However, approaches like these
    are usually not recommended in most scenarios and really put forward the thought
    that there’s a better way to implement whatever the developer is trying to do.


    Let us now move on to Context API and see how to use it to create `worm-holes`
    in data passing.


    # [Context API](#toc.xhtml_s62a)


    In prop drilling example, we saw how a UI theme would need to drill its props
    all the way down to a component which actually needs it, exposing it to all other
    components which don’t even need to know about those values. Meet Context in React.
    Context allows you to create wormholes of data in components, that is, you could
    teleport data from one component to another down the tree without the intermediate
    components knowing about the transferred data.


