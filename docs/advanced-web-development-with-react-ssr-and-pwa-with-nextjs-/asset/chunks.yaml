    \ { type, payload } = action\n  switch(type) {\n    case ‘SET_THEME’:\n      document.body.classList.remove(‘dark’,\
    \ ‘light’)\n      document.body.classList.add(payload)\n      return {\n     \
    \   …state,\n        theme: payload,\n        logo: payload === ‘dark’ ? ‘white-logo’\
    \ : ‘red-logo’\n      }\n  }\n  return initialState\n}\n\nconstStateContext =\
    \ createContext<{ state: Context, dispatch: Function}>({\n  state: initialState,\n\
    \  dispatch: () => 0\n})\n\nexport const Provider = StateContext.Provider\nexport\
    \ const reducer = stateFunc\nexport const context = StateContext\nexport constdefaultState\
    \ = initialState\n```\n\nA lot of stuff is going on in this file! Let’s see what’s\
