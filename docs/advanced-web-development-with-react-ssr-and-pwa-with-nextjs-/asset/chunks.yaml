  trans: "\n\n2. 动作对象由 `type`（字符串）和 `payload`（任意值）组成。（你可以通过为 `type` 和 `payload` 指定更严格的类型来进一步缩小范围）。\n\
    \n3. 现在，基于 `type`，我们有一些分支情况：如果 `type` 是 `SET_THEME`，我们就更新状态并返回它。这将成为我们更新后的状态。如何实现？这是通过\
    \ `useReducer` 钩子完成的，我们稍后会看到。\n\n4. 最后，我们还有原来的 `StateContext`，但这次，我们的上下文不再只保存状态，而是保存两个值：状态和一个\
    \ `dispatch` 函数。\n\n5. 状态是我们的原始状态对象，而 `dispatch` 是一个用于更新状态的方法。你看，这里我们不直接与状态交互，而是发送某些“动作”，这些动作反过来更新状态。\n\
    \n我们用垃圾函数初始化 `dispatch` 方法，但当我们使用上下文提供者时，最终会覆盖它，所以这没关系。\n\n现在，回到 `Component1.tsx`\
    \ 文件，它看起来像这样：\n\n```\nimport React, { useReducer } from 'react'\nimport Header\
    \ from './Header'\nimport Content from './Content'\nimport Footer from './Footer'\n\
    import './global.css'\nimport { Provider, defaultState, reducer } from './state'\n\
    \nconst Component1: React.FC = () => {\n  const [state, dispatch] = useReducer(reducer,\
    \ defaultState)\n  return (\n    <Provider value={{ state, dispatch }}>\n    \
    \  <Header />\n      <Content />\n      <Footer />\n    </Provider>\n  )\n}\n\n\
    export default Component1\n```\n\n现在你可以看到我们正在使用一个名为 `useReducer` 的新钩子。这个钩子的作用是返回一个包含两个元素的数组，就像\
    \ `useState` 钩子一样。第一个元素是 `state`，第二个元素是 `dispatch` 函数。\n\n`useState` 和 `useReducer`\
    \ 之间的一个主要区别是：使用 `useState` 时，第二个函数是状态的设置器，也就是说，在 `useState` 中，无论你传入什么参数，它都会被设置为状态；而在\
    \ `useReducer` 中，每当你调用 `dispatch` 方法时，`useReducer` 会调用你的 reducer，然后 reducer 方法返回的任何内容都会被设置为状态。考虑以下代码：\n\
    \n```\nconst [state, setState] = useState(0)\nsetState(1) // ← 将状态变量设置为 1\n\n\
    const [state, dispatch] = useReducer(reducer, 1)\ndispatch({ type: 'do something',\
    \ value: 100 }) // 现在 reducer 被调用\n// 幕后：reducer(state, { type: 'do something',\
    \ value: 100 }) -> 返回 101\n// 状态变为 101\n```\n\n这对于大型数据管理很重要，因为现在你可以更精细地控制数据流。\n\
    \n现在让我们更新其他文件，使其与 `useReducer` 钩子配合工作：\n\n**Footer.tsx**：\n\n```\nimport React,\
    \ { useContext } from 'react'\nimport { context } from './state'\n\nconst Footer:\
    \ React.FC = () => {\n  const { state: { logo } } = useContext(context)\n  return\
    \ (\n    <footer>\n      <p>Copyright &copy; Me.</p>\n      <img src={'https://codedamn.com/assets/images/${logo}.png'}\
    \ />\n    </footer>\n  )\n}\n\nexport default Footer\n```\n\n**Header.tsx**：\n\
    \n```\nimport React, { useContext } from 'react'\nimport { context } from './state'\n\
    \nconst Header: React.FC = () => {\n  const { state: { name } } = useContext(context)\n\
    \  return (\n    <header>\n      <h1>欢迎来到我的网站！</h1>\n      <p>你好 {name}</p>\n\
    \    </header>\n  )\n}\n\nexport default Header\n```\n\n**RightArticle.tsx**：\n\
    \n```\nimport React, { useContext } from 'react'\nimport { context } from './state'\n\
    \nconst RightArticle: React.FC = () => {\n  const { state: { theme }, dispatch\
    \ } = useContext(context)\n\n  function toggleTheme() {\n    if(theme === 'dark')\
    \ {\n      dispatch({ type: 'SET_THEME', payload: 'light' })\n    } else {\n \
    \     dispatch({ type: 'SET_THEME', payload: 'dark' })\n    }\n  }\n\n  return\
    \ (\n    <article>\n      <h2>这是我的网站！</h2>\n      <p>它非常棒</p>\n      <p>当前模式是：{theme}</p>\n\
    \      <button onClick={toggleTheme}>点击此处开启暗黑模式</button>\n    </article>\n  )\n\
    }\n\nexport default RightArticle\n```\n\n看到上面我们是如何使用 `dispatch` 函数的吗？它会调用我们的 reducer，而\
    \ reducer 会修改状态，然后状态会传播到使用它的组件中！\n\n还有 `Sidebar.tsx`：\n\n```\nimport React, {\
    \ useContext } from 'react'\nimport { context } from './state'\n\nconst Sidebar:\
    \ React.FC = () => {\n  const { state: { logo } } = useContext(context)\n  return\
    \ (\n    <aside>\n      <h2>哇，这是一个很棒的侧边栏</h2>\n      <p>看看我的标志</p>\n      <img\
    \ src={'https://codedamn.com/assets/images/${logo}.png'} />\n    </aside>\n  )\n\
    }\n\nexport default Sidebar\n```\n\n完成所有这些更改后，我们会发现屏幕上仍然显示相同的输出。但请考虑一下：现在在应用程序中实现更多有状态的功能变得非常容易。例如，假设你想通过点击按钮来更改登录用户名。\n\
    \n你只需在任何组件中获取 `dispatch` 方法，并分发一个带有类型（比如 `CHANGE_USERNAME`）和任意负载的动作。\n\n然后在另一个完全不同的文件\
    \ `state.tsx` 中，你可以在 reducer 中添加当动作是 `CHANGE_USERNAME` 时要执行的操作，如下所示：\n\n```\n\
    switch(type) {\n  // ..\n  case 'CHANGE_USERNAME':\n    return {\n      ...state,\n\
    \      name: payload\n    }\n  // ....\n}\n```\n\n这样就完成了！没有比这更精简的了！\n\n# 结论\n\n\
    在本章中，我们学习了如何利用 React 内置的解决方案（如 Context API）来实现非常精简的状态管理，而无需任何外部库。在接下来的章节中，我们将探讨如何使用更复杂的技术与\
    \ React 结合，以实现更多功能。\n\n# 问题\n\n1. 什么是 React 的 Context API？\n2. `useReducer` 钩子是如何工作的？\n\
    3. 什么是 `Context.Consumer`？`Context.Provider` 与 `Context.Consumer` 有何不同？\n\n# 第\
    \ 5 章\n\n# 服务端 React\n\n到目前为止，我们已经了解了 React 在前端的工作方式、使用 React 的各种方法、如何管理状态，甚至还创建了一个简单的工作首页！我们还可以用\
    \ React 做更多事情，尤其是将其迁移到服务端。现在，在服务端使用 React 可能听起来有些奇怪——至少在我第一次接触这个概念时是这样！在服务端使用\
    \ React 到底意味着什么？它又能给我们带来什么好处？我们将在本章中解答所有这些问题，甚至更多。让我们开始吧。\n\n在本章中，我们将探讨如何将 React\
    \ 迁移到服务端，本质上是在将 React 代码发送到浏览器之前，使用 Node.js 对其进行渲染，从而为用户和搜索引擎爬虫提供即时查看内容的无缝体验。\n\
    \n# 结构\n\n* 服务端渲染\n* 为什么需要它\n* 使用 SSR 的 Hello World\n* `ReactDOMServer` 如何工作\n\
    * 向 SSR 添加更多组件\n* 路由\n* 水合 `ReactDOM`\n* 获取数据\n\n# 目标\n\n本章旨在向你介绍使用 React 进行服务端渲染的概念，并讨论为什么如果你刚开始一个项目并且需要\
    \ SEO 和性能达到不可妥协的水平，这是一个不错的选择。我们将通过创建一个非常简单的项目来演示如何使用 React SSR 实现 Hello World，然后逐步添加更多功能。最后，我们将给出强有力的论据，说明为什么选择像\
    \ `Next.js` 这样的服务端渲染框架来构建基于 React 的中大型 SSR 应用是一个好主意。\n\n# 服务端上的 React\n\n目前，当你使用\
    \ React 应用程序时，会发生以下情况：\n\n1. 你访问页面（假设是 [`example.com`](http://example.com)）\n\
    2. 页面向远程服务器发出请求。\n3. 远程服务器只向你发送一个像这样的简单 HTML 响应：\n\n![](img/image42.jpg)\n\n**图\
    \ 5.1**\n\n"
- fmt: "\n4. Your browser understands this request, and if you look closely, you’ll\
    \ see that the request contains no readable content whatsoever. It is just linking\
    \ to a bunch of CSS and JS files only.\n\n5. Your browser downloads those JS files.\n\
    \n6. Your browser parses and runs those JS files (which is actually React code\
    \ you wrote)\n\n7. Depending on the React code, your browser makes another HTTP\
    \ request to the server to bring in the data required by the React app.\n\n8.\
    \ Finally, when the data is available, first meaningful content render is done\
    \ to the user.\n\n9. The DOM is now populated with all the HTML you expect to\
    \ see. Here’s an example from codedamn.com which uses React:\n\nThe actual response\
    \ from the server:\n\n![](images/image51.jpg)\n\n**Figure 5.2**\n\nThe rendered\
    \ DOM finally:\n\n![](images/image9.jpg)\n\n**Figure 5.3**\n\nThis approach is\
    \ definitely fine. But there exists an alternate way to do things. The reason\
    \ you chose react is because of its flexibility and robustness, which lies under\
    \ the hood. But what if you want a completely rendered page instead of letting\
    \ the browser go to and fro for every request?\n\nHere, **Server Side Rendering**\
    \ (**SSR**) comes into place. As the name suggests, Server Side Rendering basically\
    \ means your server renders your React code into the DOM-like code you saw above,\
    \ so that browser could directly render it without any/minimal JS support. Before\
    \ that, let’s answer some common SSR questions.\n\n# [What is Server-Side Rendering?](#toc.xhtml_s71a)\n\
    \nAs the name says, you are rendering the page on the server and delivering it\
    \ to the client, instead of letting the client (browser) render the page itself\
    \ using JavaScript you wrote. Server-Side Rendering takes one step from the client\
    \ back into the server, that is, parsing the React code logic. In its very essence,\
    \ SSR means the backend is doing most of the job and delivering the pages to the\
    \ frontend, instead of the client making heavy use of JS for routing and state\
    \ management. That was how applications using PHP used to work back in the days.\
    \ But with enhancement in JS standards and better-performing devices and smartphones,\
    \ client-side rendering is becoming much more popular these days.\n\n# [Why Server\
    \ Side Rendering?](#toc.xhtml_s72a)\n\nIf client-side rendering is so good, why\
    \ are we considering server-side rendering in the 2020 decade? Well, SSR has its\
    \ own benefits which cannot be ignored, some of them includes:\n\n1. SEO: Search\
    \ engines love reading HTML markup and making sense of the page out of that. Most\
    \ of the search engines, except advanced ones like Google, cannot really interpret\
    \ a lot of JavaScript and hence have to rely heavily on what your “source code”\
    \ says. And since for client-side websites, source code doesn’t say anything at\
    \ all, the search engines are not able to index your site which impacts your rankings.\n\
    \n2. Performance: There is an obvious boost in performance when you’re using SSR.\
    \ Since SSR involves rendering a page already before delivering, you don’t have\
    \ to worry about different browser support, different device support APIs, etc.\
    \ in your JS code, because most of them never get delivered anyway.\n\nHence,\
    \ for compatibility reasons with search engines, it is most important to have\
    \ SSR implemented, so that you can get the best of both worlds.\n\n# [Starting\
    \ with SSR](#toc.xhtml_s73a)\n\nSSR with React is tricky without any framework.\
    \ But still, we would begin with that just so that we know what happens under\
    \ the hood when we’re working with other frameworks. Before starting off, we’ll\
    \ focus on one special thing in React, ReactDOM.\n\n# [ReactDOM](#toc.xhtml_s74a)\n\
    \nWhen we do `ReactDOM.render(<App />, element)`, we’re effectively telling React\
    \ to match the DOM tree (what you see as UI of the web app) with the host tree\
    \ (what is contained in JavaScript as your React code)\n\nWe discussed above how\
    \ `App` unfolds into a nested object (a tree, essentially). `ReactDOM` is one\
    \ of the renderers of that particular tree. Can you think of any other example?\
    \ React Native could be thought of as another complete renderer.\n\nThere’s another\
    \ renderer called `ReactDOMServer`. `ReactDOMServer`, as the name says, enables\
    \ you to write React code and then, instead of rendering it into a browser like\
    \ an environment, render it as a string on a server to be sent to the client as\
    \ (close to) static markup.\n\nLet us now configure our very first server-side\
    \ rendering React app.\n\n# [SSR project configuration](#toc.xhtml_s75a)\n\n1.\
    \ Go ahead and create an empty directory named `react-ssr`\n\n2. Using your terminal,\
    \ `cd` into that\n\n3. Do a `npminit -y` to initialize it with default `npm` configuration\n\
    \n   Let’s install the relevant `npm` packages first, run the following command:\n\
    \n   `npm install react react-dom express --save`\n\n   And the other `dev` dependencies\
    \ would include:\n\n   `npm install @babel/core @babel/preset-react @babel/register\
    \ webpack webpack-cli --save-dev`\n\n   At this point, your `package.json` dependency\
    \ and `devDependency` section should look roughly like this:\n\n   ```\n   \"\
    dependencies\": {\n     \"express\": \"^4.16.3\",\n     \"react\": \"^16.9.0\"\
    ,\n     \"react-dom\": \"^16.9.0\"\n   },\n   \"devDependencies\": {\n     \"\
    babel-loader\": \"^8.0.6\",\n     \"@babel/core\": \"^7.6.0\",\n     \"@babel/preset-react\"\
    : \"^7.0.0\",\n     \"@babel/register\": \"^7.6.0\",\n     \"webpack\": \"^4.19.1\"\
    \n     \"webpack-cli\": \"^3.3.2\"\n   },\n   ```\n\n4. Alright. Once we have\
    \ our dependencies setup correctly, let’s write some code now. Here’s our `index.js`\
    \ file:\n\n   ```\n   index.js\n\n   require(\"@babel/register\")( {\n     presets:\
    \ [ \"@babel/preset-react\" ]\n   } )\n\n   require( \"./src/server\" )\n   ```\n\
    \n   This would be the entry point of our script. You can see that we’re using\
    \ `@babel/register` package directly in the script file. This allows us to use\
    \ JSX inside our node scripts directly.\n\n5. Although babel could be configured\
    \ via `.babelrc` to parse the server files as well, we’ll just keep it simple\
    \ right now and go with the minimal approach.\n\nAlright, once our `index.js`\
    \ file is setup, let’s see the `server.js` file:\n\n```\n// server.js\n\nconst\
    \ express = require(\"express\")\nconst app = express()\nconst React = require(\"\
    react\")\nconst { renderToString } = require(\"react-dom/server\")\n\napp.get('/*',\
    \ (req, res) => {\n  const jsx = <div>Hello</div>\n  const reactDom = renderToString(jsx)\n\
    \  res.send(template(reactDom))\n});\n\napp.listen(1337)\n\nfunction template(reactDom)\
    \ {\n  return `\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n\
    \  <title>React SSR</title>\n</head>\n<body>\n  <div id=\"root\">${reactDom}</div>\n\
    </body>\n</html>\n`\n}\n```\n\nOkay! Let’s break down what is happening in this\
    \ file:\n\n1. Firstly, we require the necessary modules, the `express` module,\
    \ and the `react` module.\n\n2. We also import `react-dom` but notice that instead\
    \ of just `react-dom`, we actually include `react-dom/server`.\n\n3. This gives\
    \ us access to the method called `renderToString`, which does what the name says.\
    \ Instead of rendering the host tree (the vDOM representation in JS) to the actual\
    \ DOM, we render it to a simple string.\n\n4. Finally, we send the response back\
    \ to the client using `res.send`.\n\n5. Notice we’re using the template function\
    \ to inject the constructed string into the response.\n\nAnd once we start the\
    \ server using `node index.js`, you could see that we get the correct response:\n\
    \n![](images/image121.jpg)\n\n**Figure 5.4**\n\nIn the preceding screenshot, you\
    \ can see that we get **Hello** sent by server which is actually running React\
    \ code:\n\n![](images/image81.jpg)\n\n**Figure 5.5**\n\nAnd once you see the source\
    \ code of the page, as shown in the preceding screenshot, you’ll see that this\
    \ is actually sent by the server, and not rendered by the client.\n\n# [Writing\
    \ more components](#toc.xhtml_s76a)\n"
