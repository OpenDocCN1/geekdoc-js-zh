    \ detail of your project.\n\n6.  Ready for production: It is an open-source and\
    \ highly optimized framework which is quite mature now for creating production-ready\
    \ apps with React.\n\nThese are some of the many reasons you could go with `Next.js`\
    \ if you’re willing to opt into an SSR solution using React.\n\n# [Installation](#toc.xhtml_s88a)\n\
    \nLet’s begin by setting up `Next.js` for our project.\n\n1.  Create a directory\
    \ named `react-ssr-next`\n\n2.  Using the command line, `cd` into that directory\n\
    \n3.  Run the following commands:\n\n    **`npminit -y`**\n\n    **`npm install\
    \ react react-dom next --save`**\n\n    These commands basically setup your `package.json`\
    \ file and install the required dependencies. Did you notice that we only needed\
    \ threepackages in total? The `react`, `react-dom`, and the `next package`!\n\n\
    4.  Finally, go ahead and make these changes to your `package.json` file’s scripts\
    \ section, so it looks like this:\n\n    `“scripts”: {`\n\n    `“dev”: “next”,`\n\
    \n    `“build”: “next build”,`\n\n    `“start”: “next start”`\n\n    `}`\n\n \
    \   So, your `package.json` file would look more or less like the following (your\
    \ version numbers might be different):\n\n    `{`\n\n    `“name”: “nextjs”,`\n\
    \n    `“version”: “1.0.0”,`\n\n    `“main”: “index.js”,`\n\n    `“scripts”: {`\n\
    \n    `“dev”: “next”,`\n\n    `“build”: “next build”,`\n\n    `“start”: “next\
    \ start”`\n\n    `},`\n\n    `“keywords”: [],`\n\n    `“author”: “”,`\n\n    `“license”:\
    \ “ISC”,`\n\n    `“description”: “”,`\n\n    `“dependencies”: {`\n\n    `“next”:\
    \ “^9.1.1”,`\n\n    `“react”: “^16.9.0”,`\n\n    `“react-dom”: “^16.9.0”`\n\n\
    \    `}`\n\n    `}`\n\n5.  Now, we would create a pages directory inside the `root`\
    \ folder. This is required by the `Next.js` framework.\n\n6.  Let’s go ahead and\
    \ do `npm run dev` in the same directory.\n\n    It’ll spin up Next.js processes.\
    \ But because our pages directory is empty, we don’t have any page to serve yet.\n\
    \n    Anyway, it’ll give us a URL with a bunch of information: `http://localhost:3000`:\n\
    \n    ![](images/image82.jpg)\n\n    **Figure 6.1**\n\n    In the preceding screenshot,\
    \ we can see that running `npm run dev` starts a development Next.js server for\
    \ us to use.\n\n7.  On navigating to localhost:3000 however, you’ll see a 404\
    \ page. This is because our pages directory is empty, and Next.js doesn’t serve\
    \ anything yet.\n\n# [Next.js defaults](#toc.xhtml_s89a)\n\nAt this point, we’ve\
    \ `Next.js` set up correctly and running. With `Next.js`, to avoid messing around\
    \ with a lot of configuration in the beginning, `Next.js` locks down certain default\
    \ configuration. Let’s look at them one by one.\n\n# [Pages](#toc.xhtml_s90a)\n\
    \nWe created the `pages` folder above. That folder is just not a random name I\
    \ gave from my side. Whatever filename you create inside that folder; it is created\
    \ as a route in your application! Let’s start with simple index.js page, which\
    \ is the root page of the application:\n\nIn the `pages/index.js` file, let’s\
    \ write the following simple React component:\n\n`// pages/index.js`\n\n`export\
    \ default () =><h1>Hello World</h1>`\n\nThat’s it! Go ahead and refresh the `localhost:3000`\
    \ page (it’ll refresh automatically anyway because hot reloading is on), and there\
    \ we have it:\n\n![](images/image15.jpg)\n\n**Figure 6.2**\n\nIn the preceding\
    \ screenshot, we could see that we successfully got a Hello World output on the\
    \ screen using `Next.js`.\n\nUpon looking at the source code, we’ll see the following:\n\
    \n`<!DOCTYPE html><html><head><meta charSet=”utf-8”/><meta name=”viewport” content=”width=device-width,minimum-scale=1,initial-scale=1”/><meta\
    \ name=”next-head-count” content=”2”/><link rel=”preload” href=”/_next/static/development/pages/index.js?ts=1569413352906”\
    \ as=”script”/><link rel=”preload” href=”/_next/static/development/pages/_app.js?ts=1569413352906”\
    \ as=”script”/><link rel=”preload” href=”/_next/static/runtime/webpack.js?ts=1569413352906”\
    \ as=”script”/><link rel=”preload” href=”/_next/static/runtime/main.js?ts=1569413352906”\
    \ as=”script”/></head><body><div id=”__next”><h1>Hello World</h1></div><script\
    \ src=”/_next/static/development/dll/dll_397dc449097af0b4e992.js?ts=1569413352906”></script><script\
    \ id=”__NEXT_DATA__” type=”application/json”>{“dataManager”:”[]”,”props”:{“pageProps”:{}},”page”:”/”,”query”:{},”buildId”:”development”,”nextExport”:true,”autoExport”:true}</script><script\
    \ async=”” data-next-page=”/” src=”/_next/static/development/pages/index.js?ts=1569413352906”></script><script\
    \ async=”” data-next-page=”/_app” src=”/_next/static/development/pages/_app.js?ts=1569413352906”></script><script\
    \ src=”/_next/static/runtime/webpack.js?ts=1569413352906” async=””></script><script\
    \ src=”/_next/static/runtime/main.js?ts=1569413352906” async=””></script></body></html>`\n\
    \nA lot of this is just the development stuff and hot reloading scripts. But we\
    \ could clearly see that Hello World markup is rendered in source code, and not\
    \ created on the fly using client-side JavaScript. Hey, that’s server-side rendering!\n\
    \nLet’s create an `about.js` file now:\n\n`// pages/about.js`\n\n`constAboutMe\
    \ = () => {`\n\n`return (`\n\n`<div id=”about-me”>`\n\n`<h1>Hey Guys!</h1>`\n\n\
    `<p>My name is Mehul and I’m the author of this book.</p>`\n\n`<p>This book covers\
    \ React and stuff</p>`\n\n`<p>I like React</p>`\n\n`</div>`\n\n`)`\n\n`}`\n\n\
    `export default AboutMe`\n\nAnd that’s basically it! Save the file and visit `localhost:3000/about`\
    \ and you’ll see the following page:\n\n![](images/image62.jpg)\n\n**Figure 6.3**\n\
    \nThe precedingpage shows our content which we wrote as a React component in the\
    \ file `about.js` without any extra configuration from our end. `Next.js` takes\
    \ care of the routing under the hood.\n\n# [Hot code reloading](#toc.xhtml_s91a)\n\
    \nYou see when we make changes to our code, and the next server is running (using\
    \ `npm run dev` command), we don’t have to go to the browser and refresh the changes\
    \ manually. `Next.js` automatically communicates with the filesystem to detect\
    \ whether there has been any change and if there has been, it’ll build it again\
    \ and push the message to the browser to fetch new changes and update accordingly.\n\
    \nThis is offered out of the box when you’re using Next.\n\n# [Static file serving](#toc.xhtml_s92a)\n\
    \nNext.js can also serve your static files (images, videos, fonts, and so on)\
    \ using a special directory name. Go ahead and create a directory named static\
    \ at the root of the project. Anything you place under this directory is served\
    \ on `/static/ route`.\n\nLet’s try to put an image in the `public/static` folder.\
    \ The final folder structure looks like the following:\n\n![](images/image112.jpg)\n\
    \n**Figure 6.4**\n\nThe preceding screenshot shows whatthe file structure should\
    \ look like.\n\nOnce you do that, you should be able to navigate to `localhost:3000/static/profile.jpeg`:\n\
    \n![](images/image33.jpg)\n\n**Figure 6.5**\n\nYou could place all your static\
    \ assets in the static directory in your project.\n\nIn the earlier versions of\
    \ Next, you had to place all the static assets inside the static folder in the\
    \ root directory. Now, you can place anything you want inside the public folder,\
    \ and it’ll be available at your root URL path. But still, we’ll store static\
    \ assets in `public/static` path to be clear what assets are static and what are\
    \ not.\n\n# [Routing](#toc.xhtml_s93a)\n\nIn `Next.js`, routing is a cakewalk,\
    \ at least the basic routing. Above, we saw a very basic demonstration of how\
    \ routing could work - just by creating JavaScript files inside a folder. But\
    \ we need to *link* these pages together as well. How would we go about that?\n\
    \nOf course, we could do linking using our regular anchor tags, but remember,\
    \ just like raw React SSR, this would perform a full redirect, and we don’t want\
    \ that simply because we have the ability to perform a background fetch of updated\
    \ data and update the UI using React, that’s the whole point of using React! So,\
    \ let’s use Link from `Next.js`.\n\n# [Link](#toc.xhtml_s94a)"
  toc: []
  trans: "\n5. 完全可扩展：你可以控制 `babel` 和 `webpack` 配置。一旦能够控制这些，你几乎可以掌控项目的每一个细节。\n\n6.\
    \ 生产就绪：它是一个开源且高度优化的框架，目前已相当成熟，可用于创建生产级的 React 应用。\n\n如果你愿意采用基于 React 的 SSR 解决方案，以上是选择\
    \ `Next.js` 的众多理由中的一部分。\n\n# 安装\n\n让我们开始为项目设置 `Next.js`。\n\n1. 创建一个名为 `react-ssr-next`\
    \ 的目录\n\n2. 使用命令行，`cd` 进入该目录\n\n3. 运行以下命令：\n\n   ```\n   npm init -y\n   npm install\
    \ react react-dom next --save\n   ```\n\n   这些命令基本上会设置好你的 `package.json` 文件并安装所需的依赖。你是否注意到我们总共只需要三个包？就是\
    \ `react`、`react-dom` 和 `next` 包！\n\n4. 最后，继续修改 `package.json` 文件中的 `scripts`\
    \ 部分，使其如下所示：\n\n   ```\n   \"scripts\": {\n     \"dev\": \"next\",\n     \"build\"\
    : \"next build\",\n     \"start\": \"next start\"\n   }\n   ```\n\n   因此，你的 `package.json`\
    \ 文件大致如下（版本号可能不同）：\n\n   ```\n   {\n     \"name\": \"nextjs\",\n     \"version\"\
    : \"1.0.0\",\n     \"main\": \"index.js\",\n     \"scripts\": {\n       \"dev\"\
    : \"next\",\n       \"build\": \"next build\",\n       \"start\": \"next start\"\
    \n     },\n     \"keywords\": [],\n     \"author\": \"\",\n     \"license\": \"\
    ISC\",\n     \"description\": \"\",\n     \"dependencies\": {\n       \"next\"\
    : \"⁹.1.1\",\n       \"react\": \"¹⁶.9.0\",\n       \"react-dom\": \"¹⁶.9.0\"\n\
    \     }\n   }\n   ```\n\n5. 现在，在根文件夹中创建一个 `pages` 目录。这是 `Next.js` 框架所要求的。\n\n\
    6. 接着，在同一目录下执行 `npm run dev`。\n\n   它会启动 `Next.js` 进程。但由于我们的 `pages` 目录为空，目前还没有页面可提供。\n\
    \n   不过，它会给我们一个包含大量信息的 URL：`http://localhost:3000`：\n\n   ![](img/image82.jpg)\n\
    \n   **图 6.1**\n\n   在上面的截图中，我们可以看到运行 `npm run dev` 会启动一个开发用的 `Next.js` 服务器供我们使用。\n\
    \n7. 然而，导航到 `localhost:3000` 时，你会看到一个 404 页面。这是因为我们的 `pages` 目录为空，`Next.js` 尚未提供任何内容。\n\
    \n# Next.js 默认配置\n\n此时，我们已经正确设置并运行了 `Next.js`。为了避免一开始就处理大量配置，`Next.js` 锁定了一些默认配置。让我们逐一了解。\n\
    \n# 页面\n\n我们之前创建了 `pages` 文件夹。这个文件夹名称并非我随意取的。你在该文件夹中创建的任何文件名，都会成为应用中的一个路由！让我们从一个简单的\
    \ `index.js` 页面开始，它是应用的根页面：\n\n在 `pages/index.js` 文件中，编写以下简单的 React 组件：\n\n```\n\
    // pages/index.js\nexport default () => <h1>Hello World</h1>\n```\n\n就这样！刷新 `localhost:3000`\
    \ 页面（由于热重载已开启，它会自动刷新），然后我们就看到了：\n\n![](img/image15.jpg)\n\n**图 6.2**\n\n在上面的截图中，我们可以看到使用\
    \ `Next.js` 成功在屏幕上输出了 Hello World。\n\n查看源代码，我们会看到以下内容：\n\n```\n<!DOCTYPE html><html><head><meta\
    \ charSet=\"utf-8\"/><meta name=\"viewport\" content=\"width=device-width,minimum-scale=1,initial-scale=1\"\
    /><meta name=\"next-head-count\" content=\"2\"/><link rel=\"preload\" href=\"\
    /_next/static/development/pages/index.js?ts=1569413352906\" as=\"script\"/><link\
    \ rel=\"preload\" href=\"/_next/static/development/pages/_app.js?ts=1569413352906\"\
    \ as=\"script\"/><link rel=\"preload\" href=\"/_next/static/runtime/webpack.js?ts=1569413352906\"\
    \ as=\"script\"/><link rel=\"preload\" href=\"/_next/static/runtime/main.js?ts=1569413352906\"\
    \ as=\"script\"/></head><body><div id=\"__next\"><h1>Hello World</h1></div><script\
    \ src=\"/_next/static/development/dll/dll_397dc449097af0b4e992.js?ts=1569413352906\"\
    ></script><script id=\"__NEXT_DATA__\" type=\"application/json\">{\"dataManager\"\
    :\"[]\",\"props\":{\"pageProps\":{}},\"page\":\"/\",\"query\":{},\"buildId\":\"\
    development\",\"nextExport\":true,\"autoExport\":true}</script><script async=\"\
    \" data-next-page=\"/\" src=\"/_next/static/development/pages/index.js?ts=1569413352906\"\
    ></script><script async=\"\" data-next-page=\"/_app\" src=\"/_next/static/development/pages/_app.js?ts=1569413352906\"\
    ></script><script src=\"/_next/static/runtime/webpack.js?ts=1569413352906\" async=\"\
    \"></script><script src=\"/_next/static/runtime/main.js?ts=1569413352906\" async=\"\
    \"></script></body></html>\n```\n\n其中大部分是开发环境和热重载脚本。但我们可以清楚地看到 Hello World 标记已渲染在源代码中，而不是通过客户端\
    \ JavaScript 动态创建。嘿，这就是服务端渲染！\n\n现在创建一个 `about.js` 文件：\n\n```\n// pages/about.js\n\
    const AboutMe = () => {\n  return (\n    <div id=\"about-me\">\n      <h1>Hey\
    \ Guys!</h1>\n      <p>My name is Mehul and I’m the author of this book.</p>\n\
    \      <p>This book covers React and stuff</p>\n      <p>I like React</p>\n  \
    \  </div>\n  )\n}\n\nexport default AboutMe\n```\n\n基本上就是这样！保存文件并访问 `localhost:3000/about`，你会看到以下页面：\n\
    \n![](img/image62.jpg)\n\n**图 6.3**\n\n上面的页面展示了我们在 `about.js` 文件中作为 React 组件编写的内容，无需任何额外配置。`Next.js`\
    \ 在底层处理了路由。\n\n# 热代码重载\n\n你看，当我们修改代码时，如果 Next 服务器正在运行（使用 `npm run dev` 命令），我们无需手动前往浏览器刷新更改。`Next.js`\
    \ 会自动与文件系统通信，检测是否有任何更改，如果有，它会重新构建并将消息推送到浏览器以获取新更改并相应更新。\n\n当你使用 Next 时，这是开箱即用的功能。\n\
    \n# 静态文件服务\n\n`Next.js` 还可以通过一个特殊目录名称来提供静态文件（图片、视频、字体等）。在项目根目录下创建一个名为 `static`\
    \ 的目录。你放在此目录下的任何内容都会在 `/static/` 路由下提供。\n\n让我们尝试在 `public/static` 文件夹中放置一张图片。最终的文件夹结构如下：\n\
    \n![](img/image112.jpg)\n\n**图 6.4**\n\n上面的截图显示了文件结构应该是什么样子。\n\n完成后，你应该能够导航到 `localhost:3000/static/profile.jpeg`：\n\
    \n![](img/image33.jpg)\n\n**图 6.5**\n\n你可以将所有静态资源放在项目中的 `static` 目录中。\n\n在 Next\
    \ 的早期版本中，你必须将所有静态资源放在根目录的 `static` 文件夹中。现在，你可以将任何内容放在 `public` 文件夹中，它将在根 URL 路径下可用。但为了明确哪些资源是静态的，我们仍然会将静态资源存储在\
    \ `public/static` 路径下。\n\n# 路由\n\n在 `Next.js` 中，路由非常简单，至少基本路由是这样。上面我们看到了路由如何工作的基本演示——只需在文件夹内创建\
    \ JavaScript 文件。但我们还需要将这些页面*链接*起来。该怎么做呢？\n\n当然，我们可以使用常规的锚标签进行链接，但请记住，就像原始的 React\
    \ SSR 一样，这会导致完全重定向，而我们不希望这样，仅仅是因为我们有能力在后台获取更新数据并使用 React 更新 UI，这正是使用 React 的全部意义！所以，让我们使用\
    \ `Next.js` 中的 `Link`。\n\n# Link\n\n"
- fmt: "\n`Link` API from `Next.js` allows you to perform the navigation just like\
    \ we did with the `Link` component from the `react-router-dom` package.\n\nHere’s\
    \ how to use it. We’ll update our `index.js` file to link it to our about page:\n\
    \n```\n// pages/index.js\nimport Link from 'next/link'\nconst Home = () => {\n\
    return <div id=\"home\">\n<h1>This is a nice homepage</h1>\n<p>Click <Link href=\"\
    /about\"><a>here</a></Link> to go to about page</p>\n</div>\n}\nexport default\
    \ Home\n```\n\nHere’s what’s going on:\n\n*   Firstly, we import the `Link` component\
    \ to use.\n*   Next, we surround the text we want to act as a hyperlink with the\
    \ `Link` component.\n*   Notice we’re giving `href` attribute to the `Link` component,\
    \ and inside that, we’re again making use of `anchor` tag. This is important,\
    \ and we’ll come to this later.\n*   Finally, in the `href` attribute, we’re passing\
    \ the link we want to navigate to. Let’s see what output it generates:\n\n   \
    \ ![](images/image91.jpg)\n\n    **Figure 6.6**\n\n    The preceding screenshot\
    \ shows how the `Link` component gets transpiled to the regular `anchor` tag in\
    \ HTML on render.\n*   Great! We can see that our hyperlink is there in the source\
    \ code. But using the `Link` component, `Next.js` also handles the client-side\
    \ navigation using the HTML5 history API automatically without us ever touching\
    \ any code.\n*   Now when you click on the **About**link, it’ll seamlessly navigate\
    \ to the about page.\n\nNow, let’s explore more about this `Link` component and\
    \ how it is different from the one we’re used to seeing with `react-router-dom`.\n\
    \n# [`Link` is just HoC](#toc.xhtml_s95a)\n\nIf you’re coming from the `react-router-dom`,\
    \ `Link` component, you might confuse this `Link` with that one. In `react-router-dom`,\
    \ you could actually pass props to that component itself, and it’ll turn into\
    \ a hyperlink and use those props (like `className`, `onClick`, and so on). But\
    \ with the `Link` API provided by `Next.js`, it is just a Higher Order Component,\
    \ that is, it just glues your child component to the click event of history API\
    \ changes. It won’t pass down the props you supply to it, to the children, and\
    \ hence you have to make whatever changes you want to make on the child, and not\
    \ on the `Link` component.\n\nFor example, consider the following code snippet.\
    \ This is wrong way of assigning a class to the `anchor` tag:\n\n```\n<p>Click\
    \ <Link href=\"/about\" className=\"mylink\"><a>here</a></Link> to go to about\
    \ page</p>\n```\n\nIn fact, if you run the precedingcode, you’ll see that you\
    \ don’t get `myLink` class attached to your `anchor` tag.\n\nThis is the correct\
    \ way to add class to that `anchor` tag:\n\n```\n<p>Click <Link href=\"/about\"\
    ><a className=\"mylink\">here</a></Link> to go to about page</p>\n```\n\n# [More\
    \ on `Link`](#toc.xhtml_s96a)\n\nThe `Link` component basically attaches an `onClick`\
    \ event to its child. So, if the child supports `onClick` event, `Link` would\
    \ work. Consider the following case:\n\n```\n<Link href=\"/about\"><imgsrc=\"\
    /static/profile.jpeg\" /></Link>\n```\n\nIn this case, `Link` would work correctly,\
    \ and the navigation would happen, but you won’t get any `a`tags with the `href`\
    \ attribute set in the HTML markup, which might be bad for SEO.\n\nHence, you\
    \ should wrap the `img` tag above in an `anchor` tag.\n\nIf you want `Next.js`\
    \ to display the `href` attribute on tags other than `anchor` tag (for debugging\
    \ purposes), you can pass `passHref` attribute to the `Link` component like this:\n\
    \n```\n<Link href=\"/about\" passHref>\n<imgsrc=\"/static/profile.jpeg\" />\n\
    </Link>\n```\n\nThis would render the following markup:\n\n```\n<imgsrc=\"/static/profile.jpeg\"\
    \ href=\"/about\"/>\n```\n\nThis is good for debugging purposes when you want\
    \ to find out what is the link page is going to be redirected on clicking that\
    \ particular element.\n\n# [`Next.js` components](#toc.xhtml_s97a)\n\nPages are\
    \ fine, but what about reusable code pieces? We can obviously create component\
    \ files which could be included in other pages. Let’s create a directory called\
    \ **components**, but remember, unlike pages or static, this time the name of\
    \ the directory is not important. Here’s a simple example:\n\n```\n// components/Header.js\n\
    import Link from 'next/link'\nconst Header = () => (\n<header>\n<Link href=\"\
    /\">\n<a>Home</a>\n</Link>\n<Link href=\"/about\">\n<a>About</a>\n</Link>\n</header>\n\
    )\nexport default Header\n```\n\nNow, let’s use this `Header` component we created\
    \ above in the `index.js` file:\n\n```\n// pages/index.js\nimport Link from 'next/link'\n\
    import Header from '../components/Header'\nconst Home = () => {\nreturn <div id=\"\
    home\">\n<Header />\n<h1>This is a nice homepage</h1>\n<p>Click <Link href=\"\
    /about\" passHref><imgsrc=\"/static/profile.jpeg\" /></Link> to go to about page</p>\n\
    </div>\n}\nexport default Home\n```\n\n`About.js` file:\n\n```\n// pages/about.js\n\
    import Header from '../components/Header'\nconstAboutMe = () => {\nreturn (\n\
    <div id=\"about-me\">\n<Header />\n<h1>Hey Guys!</h1>\n<p>My name is Mehul and\
    \ I'm the author of this book.</p>\n<p>This book covers React and stuff</p>\n\
    <p>I like React</p>\n</div>\n)\n}\nexport default AboutMe\n```\n\nAnd the file\
    \ structure looks like this:\n\n![](images/image52.jpg)\n\n**Figure 6.7**\n\n\
    The preceding screenshot shows whatthe file structure should look like at this\
    \ moment.\n\nNow you’ll see that we’re able to reuse the `Header` component on\
    \ both the pages (`About` and `Home`).\n\nAlso, note that, as said above, components\
    \ are just a choice, you could name this folder anything you like and still use\
    \ it (as we’re using a relative path to address the folder).\n\n# [`Next.js` +\
    \ CSS](#toc.xhtml_s98a)\n\nThere are a bunch of ways to use CSS with the `Next.js`\
    \ framework, and you would always use CSS in applications these days. Let’s explore\
    \ some of the common ways to do that.\n\n# [Styled JSX](#toc.xhtml_s99a)\n\nThis\
    \ method requires you to write your CSS directly in the JSX template. Let’s look\
    \ at an example first. Let’s modify our `Header` component to include some styles:\n\
    \n```\n// Header.js\nimport Link from 'next/link'\nconst Header = () => (\n<header>\n\
    <style jsx>{\n'\nheader {\npadding: 20px;\nbackground: #1e1e1e;\nborder-bottom:\
    \ 1px solid black;\nfont-size: 30px;\n}\na {\ncolor: white;\nmargin-right: 30px;\n\
    }\n'\n}</style>\n<Link href=\"/\">\n<a>Home</a>\n</Link>\n<Link href=\"/about\"\
    >\n<a>About</a>\n</Link>\n</header>\n)\nexport default Header\n```\n\nThis generates\
    \ the following mockup:\n\n![](images/image24.jpg)\n\n**Figure 6.8**\n\nJust like\
    \ the code describes, the preceding screenshot shows the output we expected.\n\
    \nNow, let’s look at the rendered HTML. When you see that, you’ll see something\
    \ like this:\n\n![](images/image101.jpg)\n\n**Figure 6.9**\n\nThe preceding screenshot\
    \ shows us the output DOM tree from the Chrome DevTools.\n\nSee that even though\
    \ we didn’t assign any class to our `header/anchor` elements, `Next.js` did that\
    \ itself for us to locally scope the styles. This way, even if you have the same\
    \ elements in different components, you can style them differently without worrying\
    \ about style conflicts. This is extremely useful when you’re targeting elements\
    \ directly either through their tag names or through some use of very common classes\
    \ (like “container”, “block”, and so on).\n\nBut what about the cases where you\
    \ actually want to target global? For example, writing the same styles in the\
    \ top file for it to have effects globally? For that, we could include the global\
    \ attribute. Check the following example:\n\n```\nimport Link from 'next/link'\n\
    const Header = () => (\n<header>\n<style jsx global>{\n'\nheader {\npadding: 20px;\n\
    background: #1e1e1e;\nborder-bottom: 1px solid black;\nfont-size: 30px;\n}\na\
    \ {\ncolor: white;\nmargin-right: 30px;\n}\n'\n}</style>\n<Link href=\"/\">\n\
    <a>Home</a>\n</Link>\n<Link href=\"/about\">\n<a>About</a>\n</Link>\n</header>\n\
    )\nexport default Header\n```\n"
  raw: "Link API from `Next.js` allows you to perform the navigation just like we\
    \ did with the Link component from the `react-router-dom` package.\n\nHere’s how\
    \ to use it. We’ll update our `index.js` file to link it to our about page:\n\n\
    `// pages/index.js`\n\n`import Link from ‘next/link’`\n\n`const Home = () => {`\n\
    \n`return <div id=”home”>`\n\n`<h1>This is a nice homepage</h1>`\n\n`<p>Click\
    \ <Link href=”/about”><a>here</a></Link> to go to about page</p>`\n\n`</div>`\n\
    \n`}`\n\n`export default Home`\n\nHere’s what’s going on:\n\n*   Firstly, we import\
    \ the `Link` component to use.\n\n*   Next, we surround the text we want to act\
    \ as a hyperlink with the `Link` component.\n\n*   Notice we’re giving `href`\
    \ attribute to the `Link` component, and inside that, we’re again making use of\
    \ `anchor` tag. This is important, and we’ll come to this later.\n\n*   Finally,\
    \ in the `href` attribute, we’re passing the link we want to navigate to. Let’s\
    \ see what output it generates:\n\n    ![](images/image91.jpg)\n\n    **Figure\
    \ 6.6**\n\n    The preceding screenshot shows how the `Link` component gets transpiled\
    \ to the regular `anchor` tag in HTML on render.\n\n*   Great! We can see that\
    \ our hyperlink is there in the source code. But using the `Link` component, `Next.js`\
    \ also handles the client-side navigation using the HTML5 history API automatically\
    \ without us ever touching any code.\n\n*   Now when you click on the **About**link,\
    \ it’ll seamlessly navigate to the about page.\n\nNow, let’s explore more about\
    \ this Link component and how it is different from the one we’re used to seeing\
    \ with `react-router-dom`.\n\n# [Link is just HoC](#toc.xhtml_s95a)\n\nIf you’re\
    \ coming from the `react-router-dom`,`Link` component, you might confuse this\
    \ `Link` with that one. In `react-router-dom`, you could actually pass props to\
    \ that component itself, and it’ll turn into a hyperlink and use those props (like\
    \ `className`, `onClick`, and so on). But with the Link API provided by `Next.js`,\
    \ it is just a Higher Order Component, that is, it just glues your child component\
    \ to the click event of history API changes. It won’t pass down the props you\
    \ supply to it, to the children, and hence you have to make whatever changes you\
    \ want to make on the child, and not on the `Link` component.\n\nFor example,\
    \ consider the following code snippet. This is wrong way of assigning a class\
    \ to the `anchor` tag:\n\n`<p>Click <Link href=”/about” className=”mylink”><a>here</a></Link>\
    \ to go to about page</p>`\n\nIn fact, if you run the precedingcode, you’ll see\
    \ that you don’t get `myLink` class attached to your `anchor` tag.\n\nThis is\
    \ the correct way to add class to that `anchor` tag:\n\n`<p>Click <Link href=”/about”><a\
    \ className=”mylink”>here</a></Link> to go to about page</p>`\n\n# [More on Link](#toc.xhtml_s96a)\n\
    \nThe `Link` component basically attaches an `onClick` event to its child. So,\
    \ if the child supports `onClick` event, `Link` would work. Consider the following\
    \ case:\n\n`<Link href=”/about”><imgsrc=”/static/profile.jpeg” /></Link>`\n\n\
    In this case, `Link` would work correctly, and the navigation would happen, but\
    \ you won’t get any `a`tags with the `href` attribute set in the HTML markup,\
    \ which might be bad for SEO.\n\nHence, you should wrap the `img` tag above in\
    \ an `anchor` tag.\n\nIf you want `Next.js` to display the `href` attribute on\
    \ tags other than `anchor` tag (for debugging purposes), you can pass `passHref`\
    \ attribute to the `Link` component like this:\n\n`<Link href=”/about” passHref>`\n\
    \n`<imgsrc=”/static/profile.jpeg” />`\n\n`</Link>`\n\nThis would render the following\
    \ markup:\n\n`<imgsrc=”/static/profile.jpeg” href=”/about”/>`\n\nThis is good\
    \ for debugging purposes when you want to find out what is the link page is going\
    \ to be redirected on clicking that particular element.\n\n# [Next.js components](#toc.xhtml_s97a)\n\
    \nPages are fine, but what about reusable code pieces? We can obviously create\
    \ component files which could be included in other pages. Let’s create a directory\
    \ called **components**, but remember, unlike pages or static, this time the name\
    \ of the directory is not important. Here’s a simple example:\n\n`// components/Header.js`\n\
    \n`import Link from ‘next/link’`\n\n`const Header = () => (`\n\n`<header>`\n\n\
    `<Link href=”/”>`\n\n`<a>Home</a>`\n\n`</Link>`\n\n`<Link href=”/about”>`\n\n\
    `<a>About</a>`\n\n`</Link>`\n\n`</header>`\n\n`)`\n\n`export default Header`\n\
    \nNow, let’s use this `Header` component we created above in the `index.js` file:\n\
    \n`// pages/index.js`\n\n`import Link from ‘next/link’`\n\n`import Header from\
    \ ‘../components/Header’`\n\n`const Home = () => {`\n\n`return <div id=”home”>`\n\
    \n`<Header />`\n\n`<h1>This is a nice homepage</h1>`\n\n`<p>Click <Link href=”/about”\
    \ passHref><imgsrc=”/static/profile.jpeg” /></Link> to go to about page</p>`\n\
    \n`</div>`\n\n`}`\n\n`export default Home`\n\n`About.js` file:\n\n`// pages/about.js`\n\
    \n`import Header from ‘../components/Header’`\n\n`constAboutMe = () => {`\n\n\
    `return (`\n\n`<div id=”about-me”>`\n\n`<Header />`\n\n`<h1>Hey Guys!</h1>`\n\n\
    `<p>My name is Mehul and I’m the author of this book.</p>`\n\n`<p>This book covers\
    \ React and stuff</p>`\n\n`<p>I like React</p>`\n\n`</div>`\n\n`)`\n\n`}`\n\n\
    `export default AboutMe`\n\nAnd the file structure looks like this:\n\n![](images/image52.jpg)\n\
    \n**Figure 6.7**\n\nThe preceding screenshot shows whatthe file structure should\
    \ look like at this moment.\n\nNow you’ll see that we’re able to reuse the `Header`\
    \ component on both the pages (`About` and `Home`).\n\nAlso, note that, as said\
    \ above, components are just a choice, you could name this folder anything you\
    \ like and still use it (as we’re using a relative path to address the folder).\n\
    \n# [Next.js + CSS](#toc.xhtml_s98a)\n\nThere are a bunch of ways to use CSS with\
    \ the `Next.js` framework, and you would always use CSS in applications these\
    \ days. Let’s explore some of the common ways to do that.\n\n# [Styled JSX](#toc.xhtml_s99a)\n\
    \nThis method requires you to write your CSS directly in the JSX template. Let’s\
    \ look at an example first. Let’s modify our `Header` component to include some\
    \ styles:\n\n`// Header.js`\n\n`import Link from ‘next/link’`\n\n`const Header\
    \ = () => (`\n\n`<header>`\n\n`<style jsx>{`\n\n`‘`\n\n`header {`\n\n`padding:\
    \ 20px;`\n\n`background: #1e1e1e;`\n\n`border-bottom: 1px solid black;`\n\n`font-size:\
    \ 30px;`\n\n`}`\n\n`a {`\n\n`color: white;`\n\n`margin-right: 30px;`\n\n`}`\n\n\
    `’`\n\n`}</style>`\n\n`<Link href=”/”>`\n\n`<a>Home</a>`\n\n`</Link>`\n\n`<Link\
    \ href=”/about”>`\n\n`<a>About</a>`\n\n`</Link>`\n\n`</header>`\n\n`)`\n\n`export\
    \ default Header`\n\nThis generates the following mockup:\n\n![](images/image24.jpg)\n\
    \n**Figure 6.8**\n\nJust like the code describes, the preceding screenshot shows\
    \ the output we expected.\n\nNow, let’s look at the rendered HTML. When you see\
    \ that, you’ll see something like this:\n\n![](images/image101.jpg)\n\n**Figure\
    \ 6.9**\n\nThe preceding screenshot shows us the output DOM tree from the Chrome\
    \ DevTools.\n\nSee that even though we didn’t assign any class to our `header/anchor`\
    \ elements, `Next.js` did that itself for us to locally scope the styles. This\
    \ way, even if you have the same elements in different components, you can style\
    \ them differently without worrying about style conflicts. This is extremely useful\
    \ when you’re targeting elements directly either through their tag names or through\
    \ some use of very common classes (like “container”, “block”, and so on).\n\n\
    But what about the cases where you actually want to target global? For example,\
    \ writing the same styles in the top file for it to have effects globally? For\
    \ that, we could include the global attribute. Check the following example:\n\n\
    `import Link from ‘next/link’`\n\n`const Header = () => (`\n\n`<header>`\n\n`<style\
    \ jsx global>{`\n\n`‘`\n\n`header {`\n\n`padding: 20px;`\n\n`background: #1e1e1e;`\n\
    \n`border-bottom: 1px solid black;`\n\n`font-size: 30px;`\n\n`}`\n\n`a {`\n\n\
    `color: white;`\n\n`margin-right: 30px;`\n\n`}`\n\n`’`\n\n`}</style>`\n\n`<Link\
    \ href=”/”>`\n\n`<a>Home</a>`\n\n`</Link>`\n\n`<Link href=”/about”>`\n\n`<a>About</a>`\n\
    \n`</Link>`\n\n`</header>`\n\n`)`\n\n`export default Header`"
