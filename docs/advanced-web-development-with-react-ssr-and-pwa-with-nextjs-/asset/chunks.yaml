    \  }\n    ```\n\n注意，我是从另一个文件导入 `styles.css` 的，因此我们还需要在项目根目录中有一个自定义的 `next.config.js`\
    \ 文件（如上一章所述）：\n\n```\n// next.config.js\nconst withCSS = require('@zeit/next-css')\n\
    module.exports = withCSS({})\n```\n\n并且还要安装 `@zeit/next-cssnpm` 模块：\n\n`npmi @zeit/next-css\
    \ -S`\n\n完成后，别忘了重启服务器。\n\n这将为我们提供如下漂亮的输出：\n\n![](img/image63.jpg)\n\n**图 7.4**\n\
    \n上面的截图展示了我们上面创建的登录表单的输出。\n\n注意，我们现在使用 `useState` 钩子来管理该组件的用户名和密码。这是正确的方法，因为我们不需要将组件的这种局部状态存储到\
    \ redux 存储中。让我们继续。\n\n现在，我们将在 `Next.js` 中快速设置一个后端来接收登录请求并进行处理。\n\n# 使用 Next.js\
    \ 的 API\n\n当我们启动 TypeScript 演示时，你一定注意到在 `pages` 文件夹下有一个名为 `api` 的文件夹。这个文件夹很特殊。在\
    \ Next.js v9 之前，我们必须设置自己的服务器来处理 API 调用。这很麻烦，因为维护两个服务于单一目的的 Node 服务器很累人。但现在，`Next.js`\
    \ 原生支持处理 API 调用。我们稍后还会介绍动态路由。\n\n删除 `api` 文件夹中已有的内容，创建一个名为 `login` 的新文件夹，并在其中创建一个名为\
    \ `index.ts` 的文件。其内容应如下所示：\n\n```\n// pages/api/login/index.ts\nimport { NextApiRequest,\
    \ NextApiResponse } from 'next'\nexport default async (req: NextApiRequest, res:\
    \ NextApiResponse) => {\nconst { username, password } = req.body\nif(username\
    \ === 'admin' && password === 'admin') {\nreturn res.json({\nstatus: 'ok',\ndata:\
    \ {\nname: 'Mehul Mohan',\nage: 21,\nfavQuote: 'Nobody cares about your feelings\
    \ bro.'\n}\n})\n}\nreturn res.json({ status: 'error', message: 'Invalid login'\
    \ })\n}\n```\n\n好了！那么这个文件中发生了什么？\n\n*   我们在 `pages/api/login/index.ts` 下创建了一个文件。\n\
    *   在这个文件中，我们导出了一个函数，而不是一个 React 组件。这是因为这是我们的 API 端点，我们可以在其中编写逻辑。\n\n"
- fmt: "\n*   There are two arguments which `Next.js` passes for us to work with.\
    \ The first one is `req` (the request handler) and the second one is `res` (the\
    \ response handler).\n*   The first parameter, `req`, contains all the relevant\
    \ information about the current request hitting that particular endpoint. This\
    \ might include the POST body data, authentication cookies, custom headers, and\
    \ so on.\n*   The second parameter, `res`, is writable by you, the developer.\
    \ This has methods to call which would, in turn, create an HTTP response under\
    \ the hood which the API endpoint is supposed to send back to the client.\n* \
    \  If you have ever used Express with `Node.js`, this might seem very familiar.\n\
    *   We, first of all, pull out the username and password from `req.body`. The\
    \ body property on the req handler would contain whatever we send from the client\
    \ to the server. Since we’re expecting a JSON request, we can just destructure\
    \ it directly.\n*   Once we get that, we check against the values.\n*   If both\
    \ are admin, we authenticate (for now).\n*   If not, we send a custom error message.\n\
    *   Note we’re using the `res.json()` method to send back the response. If we\
    \ look at the type declaration of `NextApiResponse`, we’ll see that the following\
    \ methods are supported on `res` object:\n\n```\nexport declare type NextApiResponse<T\
    \ = any> = ServerResponse& {\n  /**\n   * Send data ‘any’ data in response\n \
    \  */\n  send: Send<T>;\n  /**\n   * Send data ‘json’ data in response\n   */\n\
    \  json: Send<T>;\n  status: (statusCode: number) =>NextApiResponse<T>;\n};\n\
    ```\n\n*   As the comments describe, `send` just sends the raw text back to the\
    \ client.\n*   The `json` method takes the object, serializes it into a JSON string,\
    \ sets appropriate Content-Type header, and sends it to the client.\n*   If you\
    \ want a custom status code set as well (default is 200 OK), you can use the `status`\
    \ method attached to it.\n\nLet’s update our `index.tsx` file of the homepage\
    \ to send the data back to server API:\n\n```\n// pages/index.tsx\nimport React,\
    \ { useState } from ‘react’\nimport { NextPage } from ‘next’\nimport ‘./styles.css’\n\
    \nconst IndexPage: NextPage = () => {\n  const [username, setUsername] = useState<string>(‘’)\n\
    \  const [password, setPassword] = useState<string>(‘’)\n\n  async function submitForm()\
    \ {\n    const req = await fetch(‘/api/login’, {\n      method: ‘POST’,\n    \
    \  headers: {\n        ‘Content-Type’: ‘application/json’\n      },\n      body:\
    \ JSON.stringify({ username, password })\n    })\n    const json = await req.json()\n\
    \    console.log(json)\n  }\n\n  return (\n    <form method=”POST”>\n      <div\
    \ className=”box”>\n        <h1>Login</h1>\n        <input type=”text” placeholder=”Username”\
    \ className=”field” value={username} onChange={e =>setUsername(e.target.value)}\
    \ />\n        <input type=”password” placeholder=”Password” className=”field”\
    \ value={password} onChange={e =>setPassword(e.target.value)} />\n        <div\
    \ className=”btn” onClick={submitForm}>Sign In</div>\n      </div>\n    </form>\n\
    \  )\n}\n\nexport default IndexPage\n```\n\nWe added a new function called `submitForm`,\
    \ which is fired when the `Login` button is clicked. And the result of the following\
    \ is:\n\nIncorrect login:\n\n![](images/image102.jpg)\n\n**Figure 7.5**\n\nThe\
    \ preceding screenshot shows a representation of incorrect login done by the user.\n\
    \nCorrect login:\n\n![](images/image25.jpg)\n\n**Figure 7.6**\n\nThe preceding\
    \ screenshot shows a representation of the correct login done by the user.\n\n\
    Great! We just implemented our first API endpoint using `Next.js`. Let’s go ahead\
    \ and put this data in our Redux store now. Let’s start implementing Redux now.\
    \ This is important because we want to use the data passed from the server into\
    \ different pages/components, and a centralized store would help us in that.\n\
    \n# Setting up Redux + Next.js\n\nFirst, let’s install `redux` and `next-redux-wrapper`\
    \ which would provide `Redux.js` wrapper for `Next.js` projects. Install the package\
    \ on your systems using the following command:\n\n`npm install react-redux redux\
    \ next-redux-wrapper --save`\n\nNext, we’ll set up our Redux store. Think of how\
    \ we set up the default state in the case of Context API. This is very similar\
    \ to those lines. A store is basically a centralized place for all of your components\
    \ to store their data and retrieve data from that particular area.\n\nBecause\
    \ it is centralized and decoupled from your components, there could be problems\
    \ reading/writing values to that area; hence, there has to be a streamlined way\
    \ to access only the values a component needs to read.\n\nSimilarly, if you want\
    \ to write (update) the redux state, you cannot do it directly. You have to write\
    \ a **reducer** for it, that is, something that reduces your state. Once you write\
    \ a reducer for your store, you can then write **dispatchers**. These functions\
    \ are called dispatchers because they dispatch certain actions to these reducers,\
    \ and these reducers on receiving those actions, update the state accordingly\
    \ depending on what actions they received. The following diagram shows how Redux\
    \ architecture works in a nutshell:\n\n![](images/image113.jpg)\n\n**Figure 7.7**\n\
    \nIf this confusesyou, don’t worry. It’ll make a lot more sense when we go through\
    \ this thing again but using code this time. Let’s now look at our reducer code:\n\
    \n1.  Create a file named `reducer.ts` in the `redux` folder located in the project\
    \ directory (create the `redux` folder). Here’s the reducer code:\n\n```\n// reducer.ts\n\
    type Action = {\n  type: string\n  payload?: any\n}\n\nexport type UserDetails\
    \ = {\n  name: string\n  age: number\n  favQuote: string\n}\n\nexport type State\
    \ = {\n  user: UserDetails | null\n}\n\nconst defaultState: State = {\n  user:\
    \ null\n}\n\nconst reducer = (state: State = defaultState, action: Action) =>\
    \ {\n  switch (action.type) {\n    case ‘SET_USER_DETAILS’:\n      return {\n\
    \        …state,\n        user: <UserDetails>action.payload\n      }\n    default:\n\
    \      return state\n  }\n}\n\nexport default reducer\n```\n\nHere, you could\
    \ see that we’re creating a Redux store and reducer. A `store`, as described above,\
    \ is a place to store data, whereas a reducer is a function that uses certain\
    \ dispatched actions to update the store. Let’s learn about how this code is working:\n\
    \n*   First, we defined some types ofTypeScript.\n*   Then we created a `reducer`\
    \ function.\n*   The `reducer` function takes two arguments, the first one is\
    \ the actual application state, which is populated by redux automatically before\
    \ the reducer is called by `redux`.\n*   The second argument is the action. Our\
    \ task is just to dispatch these actions via `dispatcher` functions. Redux automatically\
    \ calls the `reducer` function.\n*   This action is actually an object, which\
    \ consists of a type and payload.\n*   The type of property defines what this\
    \ action is supposed to update.\n*   The `payload` property is some additional\
    \ data you can transfer to the reducer to update the state.\n\nThis is how the\
    \ file structure looks like:\n\n![](images/image73.jpg)\n\n**Figure 7.8**\n\n\
    The preceding screenshot shows how the file structure looks right now.\n\n2. \
    \ Once that is done, now we have to integrate Redux in our app. We use the special\
    \ `pages/_app.js` (or actually, `_app.tsx`) file to do that. Let’s discuss that\
    \ now.\n\n# _app.js File\n\nAccording to the documentation:\n\n*   `Next.js` uses\
    \ the `App` component to initialize pages\n*   To override, create the `./pages/_app.js`\
    \ file and override the `App` class\n\nBasically, this file allows you to override\
    \ some default configuration `Next.js` uses to serve the pages. Since we want\
    \ Redux to be available everywhere on every page, we can wrap the Redux’s Provider\
    \ (just like we wrapped the Context API provider) in this particular file.\n\n\
    Because we’re using TypeScript, we’ll be creating a file called `_app.tsx` file\
    \ instead. Let’s go ahead and create it:\n"
