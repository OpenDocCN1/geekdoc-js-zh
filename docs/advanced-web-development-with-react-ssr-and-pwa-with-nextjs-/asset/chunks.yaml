  trans: "\n*   显然，我们可以看到这段代码比上面的代码更简洁、更清晰，而且我们避免了在主组件上方不使用高阶组件（HoC）时产生的额外组件层级。\n\n\
    *   `useDispatch()` 钩子只是返回一个 dispatch 函数，我们需要用它来包裹我们的 dispatch 方法。请记住，`setUserDetails`\
    \ 函数实际上返回一个普通对象，而我们实际上只是将第一个参数作为一个普通 JSON 对象传递给 dispatch。我们之前不需要调用 dispatch 的原因是因为当我们将其传递给\
    \ `connect` 方法时，Redux 在底层已经完成了这项工作。\n\n*   `useSelector()` 钩子允许你传入一个函数，该函数可以过滤出你想要提取的值。`useSelector()`\
    \ 默认在变化时执行浅比较，如果浅比较检测到任何变化，就会重新渲染组件。就我们目前的情况而言，我们的 user 对象从 null 变为一个定义明确的对象，所以应该没问题。\n\
    \n现在，如果我们查看输出，应该没有任何区别，一切正常。这就是我们如何在 React + Redux 中使用钩子的方式。\n\n# 创建仪表盘页面\n\n\
    让我们继续在 `pages/` 目录下创建一个包含 `dashboard/index.tsx` 文件的仪表盘页面。文件结构如下所示：\n\n![](img/image34.jpg)\n\
    \n**图 7.11**\n\n上面的截图显示了当前的文件结构。\n\n我们暂时保持仪表盘页面简单，只需在 `dashboard/index.tsx` 文件中放入以下代码：\n\
    \n```\nimport React from ‘react’\nimport { NextPage } from ‘next’\nimport { useSelector\
    \ } from ‘react-redux’\n\nconst DashboardPage: NextPage = () => {\n  const user\
    \ = useSelector((state: any) =>state.user)\n  if(!user) return <p>User not available</p>\n\
    \  return (\n    <div id=”dashboard”>\n      <h1>Hello {user.name}</h1>\n    \
    \  <p>Your favorite quote: {user.favQuote}</p>\n    </div>\n  )\n}\n\nexport default\
    \ DashboardPage\n```\n\n好了！现在该将用户重定向到 `/dashboard` 路由了，但仅在登录正确时进行。让我们更新 `pages/index.tsx`\
    \ 文件。\n\n# 条件路由\n\n为了有条件地将用户重定向到不同的页面，我们将使用 `next/router` 中的 Router 包。让我们继续使用它：\n\
    \n```\n// pages/index.tsx\nimport React, { useState } from ‘react’\nimport { NextPage\
    \ } from ‘next’\nimport ‘./styles.css’\nimport { useSelector, useDispatch } from\
    \ ‘react-redux’\nimport { setUserDetails } from ‘../redux/actions’\nimport Router\
    \ from ‘next/router’\n\nconst IndexPage: NextPage = () => {\n  const dispatch\
    \ = useDispatch()\n  const name = useSelector((state: any) =>state.user&& state.user.name)\n\
    \  const [username, setUsername] = useState<string>(‘’)\n  const [password, setPassword]\
    \ = useState<string>(‘’)\n\n  async function submitForm() {\n    const req = await\
    \ fetch(‘/api/login’, {\n      method: ‘POST’,\n      headers: {\n        ‘Content-Type’:\
    \ ‘application/json’\n      },\n      body: JSON.stringify({ username, password\
    \ })\n    })\n    const json = await req.json()\n    if(json.status === ‘ok’)\
    \ {\n      dispatch(setUserDetails(json.data))\n      `Router.push(‘/dashboard’)`\n\
    \    } else {\n      alert(‘Incorrect Login’)\n    }\n  }\n\n  return (\n    <form\
    \ method=”POST”>\n      <div className=”box”>\n        <h1>Login</h1>\n      \
    \  {name || ‘na’}\n        <input type=”text” placeholder=”Username” className=”field”\
    \ value={username} onChange={e =>setUsername(e.target.value)} />\n        <input\
    \ type=”password” placeholder=”Password” className=”field” value={password} onChange={e\
    \ =>setPassword(e.target.value)} />\n        <div className=”btn” onClick={submitForm}>Sign\
    \ In</div>\n      </div>\n    </form>\n  )\n}\n\nexport default IndexPage\n```\n\
    \n现在，当你使用正确的凭据登录时，应该会看到类似这样的内容：\n\n![](img/image83.jpg)\n\n**图 7.12**\n\n上面的截图显示了仪表盘页面的样子。\n\
    \n当你刷新页面时，应该会看到消息 `User not found`，这在逻辑上是正确的，因为我们没有持久化 Redux 存储，也没有尝试检查用户是否已登录应用程序，如果已登录则检索用户数据。我们稍后会修复这个问题。\n\
    \n首先，让我们看看嵌套路由。\n\n# 嵌套路由\n\n让我们从一个简单的用例开始。我们已经创建了顶级路径（例如 `/home` 或 `/about` 等），但是\
    \ `/home/page-x` 呢？实际上，在 `Next.js` 中，这就像将文件夹嵌套在一起一样简单。让我们创建以下文件：\n\n`pages/path1/path2/path3.tsx`\n\
    \n并在其中写入以下代码：\n\n```\nimport React from ‘react’\nimport { NextPage } from ‘next’\n\
    \nconst PathPage: NextPage = () => {\n  return (\n    <h1>Hello from very deep\
    \ inside!</h1>\n  )\n}\n\nexport default PathPage\n```\n\n让服务器应用更改，当你访问 `http://localhost:3000/path1/path2/path3`\
    \ 时，你应该能够看到以下内容：\n\n![](img/image53.jpg)\n\n**图 7.13**\n\n上面的截图展示了浏览器中嵌套路由的示例。\n\
    \n你还需要了解的另一件事是，你可以将 `path3` 创建为文件夹，并将上述代码放在 `path3/index.tsx` 中，效果是一样的。在 Next.js\
    \ 9+ 中，我们还支持动态路由。让我们看看它是什么以及如何工作。\n\n# 动态路由\n\nNext.js 最近引入了动态路由，这为匹配大量 URL 打开了大门，而不仅仅是我们在\
    \ `pages` 目录中一直使用的静态路由。让我们在 `pages/` 目录中创建一个名为 `users/index.tsx` 的文件。我们还将创建一个名为\
    \ `users/[param].tsx` 的文件。以下是两者的代码：\n\n```\n// pages/users/index.tsx\nimport React\
    \ from ‘react’\nimport { NextPage } from ‘next’\n\nconst UsersPage: NextPage =\
    \ () => {\n  return (\n    <h1>Just a regular file</h1>\n  )\n}\n\nexport default\
    \ UsersPage\n```\n\n以及另一个文件：\n\n```\n// pages/users/[param].tsx\nimport React\
    \ from ‘react’\nimport { NextPage } from ‘next’\n\nconst UsersPageDynamic: NextPage\
    \ = () => {\n  return (\n    <h1>Just a regular file too</h1>\n  )\n}\n\nexport\
    \ default UsersPageDynamic\n```\n\n现在，当你访问 `http://localhost:3000/users` 时，你会看到这个页面：\n\
    \n![](img/image123.jpg)\n\n**图 7.14**\n\n但是，如果你访问任何其他匹配 `/users/<anything here>`\
    \ 的路由，你会看到这个：\n\n![](img/image44.jpg)\n\n**图 7.15**\n\n但我们知道我们没有名为 `users/abcd`\
    \ 的文件。那么，这里发生了什么？\n\n*   当你用方括号命名文件时（就像我们对 `[param].tsx` 所做的那样），这意味着 `Next.js`\
    \ 会将其视为匹配任何放在不同路由下的内容。\n\n*   那么文件名呢？实际上，我们可以使用参数（即文件名）来提取有关路由的信息。让我们修改 `[param].tsx`\
    \ 文件以更好地反映这一点：\n\n    ```\n    // pages/users/[param].tsx\n    import React from\
    \ ‘react’\n    import { NextPage } from ‘next’\n    import { useRouter } from\
    \ ‘next/router’\n\n    const UsersPageDynamic: NextPage = () => {\n      const\
    \ router = useRouter()\n      console.log(router)\n      return (\n        <h1>Just\
    \ a regular file too {router.query.param}</h1>\n      )\n    }\n\n    export default\
    \ UsersPageDynamic\n    ```\n\n有了这个，如果我访问 URL `http://localhost:3000/users/mehul`，我应该在控制台中看到以下内容：\n\
    \n![](img/image132.jpg)\n\n**图 7.16**\n\n让我们讨论一下为什么会这样：\n\n*   你可以看到，在 URL 中，`param`\
    \ 的值是 `mehul`，这反映在屏幕上，因为使用了 `router.query.param`。\n\n*   在右侧的控制台中，我们可以获取 `useRouter`\
    \ 钩子返回的所有信息。我们可以看到 `param` 是 `query` 属性中的其中之一。这直接来自文件名。如果你将文件命名为其他名称，它也会是其他名称。\n\
    \n"
- fmt: "\nOkay. Now that we know about dynamic routing, it’ll be easier for us to\
    \ handle use cases like creating social media like a website where you can access\
    \ anyone’s profile within the URL. Let’s now go ahead and implement a quick registration\
    \ page as well in our app.\n\n# Registration page\n\nLet’s create a path `/register`\
    \ using `Next.js`:\n\n```typescript\n// pages/register/index.tsx\nimport React,\
    \ { useState } from 'react'\nimport { NextPage } from 'next'\nimport './styles.css'\n\
    import { useDispatch } from 'react-redux'\nimport { setUserDetails } from '../../redux/actions'\n\
    import Router from 'next/router'\n\nconst RegisterPage: NextPage = () => {\n \
    \ const dispatch = useDispatch()\n  const [username, setUsername] = useState<string>('')\n\
    \  const [password, setPassword] = useState<string>('')\n  const [name, setName]\
    \ = useState<string>('')\n  const [age, setAge] = useState<string>('')\n  const\
    \ [quote, setQuote] = useState<string>('')\n\n  async function submitForm() {\n\
    \    const req = await fetch('/api/register', {\n      method: 'POST',\n     \
    \ headers: {\n        'Content-Type': 'application/json'\n      },\n      body:\
    \ JSON.stringify({ username, password, name, age, quote })\n    })\n    const\
    \ json = await req.json()\n    if(json.status === 'ok') {\n      dispatch(setUserDetails(json.data))\n\
    \      Router.push('/dashboard')\n    } else {\n      alert('Error Registering')\n\
    \    }\n  }\n\n  return (\n    <form method=\"POST\">\n      <div className=\"\
    box\">\n        <h1>Register</h1>\n        <input type=\"text\" placeholder=\"\
    Username\" className=\"field\" value={username} onChange={e => setUsername(e.target.value)}\
    \ />\n        <input type=\"text\" placeholder=\"Name\" className=\"field\" value={name}\
    \ onChange={e => setName(e.target.value)} />\n        <input type=\"text\" placeholder=\"\
    Age\" className=\"field\" value={age} onChange={e => setAge(e.target.value)} />\n\
    \        <input type=\"text\" placeholder=\"Fav. Quote\" className=\"field\" value={quote}\
    \ onChange={e => setQuote(e.target.value)} />\n        <input type=\"password\"\
    \ placeholder=\"Password\" className=\"field\" value={password} onChange={e =>\
    \ setPassword(e.target.value)} />\n        <div className=\"btn\" onClick={submitForm}>Register</div>\n\
    \      </div>\n    </form>\n  )\n}\n\nexport default RegisterPage\n```\n\nHere,\
    \ we just get all the required information we need from the user and send it to\
    \ our API backend.\n\nAnd we’ll just copy-paste the styles from `IndexPage` itself:\n\
    \n```css\n// pages/register/styles.css\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing:\
    \ border-box;\n  outline: 0;\n}\n\nbody {\n  font-family: 'Open Sans', sans-serif;\n\
    \  background: #3498db;\n  margin: 0 auto 0 auto;\n  width: 100%;\n  text-align:\
    \ center;\n  margin: 20px 0px 20px 0px;\n}\n\np {\n  font-size: 12px;\n  text-decoration:\
    \ none;\n  color: #ffffff;\n}\n\nh1 {\n  font-size: 1.5em;\n  color: #525252;\n\
    }\n\n.box {\n  background: white;\n  width: 300px;\n  position: absolute;\n  top:\
    \ 50%;\n  left: 50%;\n  transform: translate(-50%, -50%);\n  border-radius: 6px;\n\
    \  padding: 20px;\n  box-shadow: 0 0 5px black;\n}\n\n.field {\n  background:\
    \ #ecf0f1;\n  border: #ccc 1px solid;\n  border-bottom: #ccc 2px solid;\n  padding:\
    \ 8px;\n  width: 100%;\n  color: #AAA;\n  margin-top: 10px;\n  font-size: 1em;\n\
    \  border-radius: 4px;\n}\n\n.btn {\n  background: #2ecc71;\n  width: 100%;\n\
    \  cursor: pointer;\n  padding: 5px 0;\n  color: white;\n  border-radius: 4px;\n\
    \  border: #27ae60 1px solid;\n  margin-top: 20px;\n  font-weight: 800;\n  font-size:\
    \ 0.8em;\n}\n\n.btn:hover {\n  background: #2CC06B;\n}\n```\n\nLet’s create our\
    \ `api/register` endpoint now:\n\n```typescript\n// api/register/index.ts\nimport\
    \ { NextApiRequest, NextApiResponse } from 'next'\nimport methods from './userlist'\n\
    \nexport default async (req: NextApiRequest, res: NextApiResponse) => {\n  const\
    \ { username, password, name, age, favQuote } = req.body\n  if(!methods.doesUserExist(username))\
    \ {\n    methods.addUser(username, password, { name, age, favQuote })\n    return\
    \ res.json({ status: 'ok', data: { name, age, favQuote } })\n  } else {\n    return\
    \ res.json({ status: 'error', message: 'User already registered' })\n  }\n}\n\
    ```\n\nHere, you can see that I’m making use of a file called `userlist.ts` and\
    \ calling some utility functions through it. This would technically be a database\
    \ on a real site, but for simplicity, we can have an in-memory data structure\
    \ (a JS object) to store our registrations temporarily.\n\nHere’s how the `userlist.ts`\
    \ file would look like:\n\n```typescript\ntype DataType = {\n  name: string\n\
    \  age: string\n  favQuote: string\n}\n\ntype UserType = {\n  username: string\n\
    \  password: string\n  data: DataType\n}\n\nconst users: UserType[] = []\n\nconst\
    \ methods = {\n  getUsers(): UserType[] {\n    return users\n  },\n  doesUserExist(username:\
    \ string): boolean {\n    return !!users.find(user => user.username === username)\n\
    \  },\n  addUser(username: string, password: string, data: DataType) {\n    users.push({\
    \ username, password, data })\n    return true\n  }\n}\n\nexport default methods\n\
    ```\n\nThis file is pretty much self-explanatory. We are exposing a bunch of methods\
    \ to operate on a dynamic user list we are maintaining in the user array. Since\
    \ Node exports are singletons (that is, multiple imports to the same file refer\
    \ to the same `object/array` in memory), we can expect this to be consistent.\n\
    \nAlright! Now we can go ahead and register some accounts on the frontend with\
    \ their custom quotes! As an assignment, try to complete this app even more by\
    \ including authentication checks and data fetching on all pages if the user is\
    \ logged in.\n\n# Conclusion\n\nIn this chapter, we spent the much-needed time\
    \ we needed to spend in the `Next.js` ecosystem. We also looked at `Redux` in-depth,\
    \ setting up `redux` with `Next.js`, routing with `Next` and how to spin APIs\
    \ without getting out of `Next.js` framework. We now have a good amount of knowledge\
    \ to create basic to intermediate complex server-side rendered backends with `Next.js`.\
    \ In the next chapter, we’ll learn more about what we could achieve with the `React`\
    \ technology, in the field of Progressive Web Apps.\n\n# Questions\n\n1.  What\
    \ is the difference between `TypeScript` and `JavaScript`? Is all valid `JavaScript`\
    \ valid `TypeScript` too?\n\n2.  What is `Redux`? How does it work?\n\n3.  What\
    \ does `getInitialProps` do in `Next.js`?\n\n4.  What is the difference between\
    \ the pages folder and the api folder in `Next.js`?\n\n5.  What do you mean by\
    \ `reducer` in `Redux`?\n\n6.  What does the `_app.js` file do? There is another\
    \ such file called `_document.js` in `Next.js`. Can you find what it does?\n\n\
    7.  What is the difference between nested and dynamic routing? Can dynamic routes\
    \ be nested with `Next v9.x`?\n\n# CHAPTER 8\n\n## Progressive Web Apps\n\nIn\
    \ the last chapter, we learned about `Next.js` technology and how it is powering\
    \ the `SSR` world of `React` today. When web apps meet native apps, a different\
    \ type of application is born, which is Progressive Web App. We’ll learn all about\
    \ `PWA`s in this chapter and see how to create one using `React` as our primary\
    \ frontend library.\n\n### Structure\n\n*   What is `Progressive Web App` (`PWA`)\n\
    *   Getting started with `PWA`\n*   `manifest.json` File\n*   Service workers\n\
    *   `PWA` using `Next.js`\n*   Custom server with `Next.js`\n\n### Objective\n\
    \nIn this chapter, our main aim would be to understand what progressive web apps\
    \ are and how to set them up with our `React` and `Next.js` projects. Along the\
    \ way, we’ll learn more about these technologies.\n\n### What is a progressive\
    \ web app?\n\nA progressive web app is a web app eventually, but a bit better.\
    \ It uses modern web features to deliver great user experience, similar to the\
    \ one you’ll experience using a native app. Some features of a progressive web\
    \ app:\n\n1.  Responsive: Obviously, your app should be fit for all screens and\
    \ sizes, and fortunately, these days creating a responsive site (or converting\
    \ an existing site to responsive design) is not very hard unless the code is very\
    \ old.\n"
