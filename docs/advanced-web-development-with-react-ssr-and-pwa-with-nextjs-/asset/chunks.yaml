    Here’s how the `userlist.ts` file would look like:


    `type DataType = {`


    `name: string`


    `age: string`


    `favQuote: string`


    `}`


    `type UserType = {`


    `username: string`


    `password: string`


    `data: DataType`


    `}`


    `const users: UserType[] = []`


    `const methods = {`


    `getUsers(): UserType[] {`


    `return users`


    `},`


    `doesUserExist(username: string): boolean {`


    `return !!users.find(user =>user.username === username)`


    `},`


    `addUser(username: string, password: string, data: DataType) {`


    `users.push({ username, password, data })`


    `return true`


    `}`


    `}`


    `export default methods`


    This file is pretty much self-explanatory. We are exposing a bunch of methods
    to operate on a dynamic user list we are maintaining in the user array. Since
    Node exports are singletons (that is, multiple imports to the same file refer
    to the same `object/array` in memory), we can expect this to be consistent.


    Alright! Now we can go ahead and register some accounts on the frontend with their
    custom quotes! As an assignment, try to complete this app even more by including
    authentication checks and data fetching on all pages if the user is logged in.


    # [Conclusion](#toc.xhtml_s121a)


    In this chapter, we spent the much-needed time we needed to spend in the `Next.js`
    ecosystem. We also looked at Redux in-depth, setting up redux with `Next.js`,
