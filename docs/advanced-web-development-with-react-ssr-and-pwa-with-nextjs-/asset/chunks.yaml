    And this is how our `.babelrc` file would look like:\n\n```\n{\n  \"presets\"\
    : [\n    \"@babel/preset-react\"\n  ],\n  \"plugins\": [\"@babel/plugin-syntax-dynamic-import\"\
    ]\n}\n```\n\nRemember, we’ve already installed this stuff before, so we could\
    \ directly use it. Finally, let’s go to `package.json` and create two scripts:\n\
    \n```\n\"scripts\": {\n  \"server\": \"nodemonindex.js\",\n  \"client\": \"webpack\
    \ --watch --progress\"\n}\n```\n\nHere, we’re defining two scripts, one is for\
    \ starting an express server, and the second one is for building our client-side\
    \ changes (they need to be compiled by webpack/babel before the browser can read\
    \ them).\n\nFire up two different terminals and run `npm run server` in the first\
    \ one and `npm run client` in the second one.\n\nFinally, visit `http://localhost:1337`\
    \ again and see the source code:\n\n![](images/image61.jpg)\n\n**Figure 5.10**\n\
    \nThe preceding screenshot shows that now we include the JS required for the React\
    \ code to run on the frontend:\n\n![](images/image131.jpg)\n\n**Figure 5.11**\n\
    \nSee the preceding screenshot; it shows the contents of `app.bundle.js` file.\
    \ Great! So how do we use it now? Well, you could see that we’re already sharing\
    \ components folder between the `client.js` and `server.js` file, so whatever\
    \ change we make once is rendered again in both the spaces.\n\nSo let’s go ahead\
    \ and instead of a direct anchor link to about page, let’s do it with React Router,\
    \ which would provide a seamless experience to the user when the user clicks on\
    \ the hyperlink.\n\nUpdate the `Home.js` file to:\n\n```\n// Home.js\nconst React\
    \ = require('react')\nconst { Link } = require('react-router-dom')\n\nfunction\
    \ Home(props) {\n  return <div className=\"home\">\n    <h2>Hello, this is homepage!\
    \ Go to <Link to=\"/about\">About</Link></h2>\n  </div>\n}\n\nmodule.exports =\
    \ Home\n```\n\nNow, when you visit the homepage and click on the about link, it\
    \ would not reload the page like before and navigate you without reloading to\
    \ the `/about` page route. Similarly, if you land directly to /about page, the\
    \ server would fetch you the contents of only /about page, and that is again,\
    \ visible to you in the source code.\n\nThat’s server-side rendering for you!\n\
    \n# Fetching data\n\nAlthough SSR with react is great, oftentimes you’ll face\
    \ difficulties with certain things because some things are only available in the\
    \ browser environment and some things are only available in the node environment.\
    \ One of those things is how to fetch data.\n\nLet’s make use of the package called\
    \ `isomorphic-fetch` which allows us to use `fetch` in both the environments:\n\
    \n`npm install isomorphic-fetch --save`\n\nNow, let’s modify our `Home.js` file\
    \ to look something like this:\n\n```\n// Home.js\nconst React = require('react')\n\
    const { Link } = require('react-router-dom')\nrequire('isomorphic-fetch')\nconst\
    \ { useEffect, useState } = React\n\nfunction Home(props) {\n  const [data, setData]\
    \ = useState(null)\n\n  useEffect(() => {\n    fetch('https://jsonplaceholder.typicode.com/posts/1').then(data\
    \ => data.json())\n    .then(data => setData(data))\n  }, [])\n\n  if(!data) return\
    \ <p>Loading…</p>\n\n  return <div className=\"home\">\n    <h2>{data.title}</h2>\n\
    \    <p>{data.body}</p>\n    <Link to=\"/about\">About</Link>\n  </div>\n}\n\n\
    module.exports = Home\n```\n\nNotice here; we’re using hooks. Since the `useEffect`\
    \ hook runs after the component is mounted, the code inside it is not executed\
    \ on the server anyway. So we could’ve just used fetch without the `isomorphic-fetch`\
    \ library, but still, we’ll keep using it for now.\n\nThen we finally grab the\
    \ data and display it on the client-side:\n\n![](images/image141.jpg)\n\n**Figure\
    \ 5.12**\n\nThe preceding screenshot shows how we’re fetching the data on the\
    \ client-side. So far, it looks good too. But can we do even better? How about\
    \ fetching the data on the server side (in the Node environment) itself and then\
    \ sending it to the client? Servers are powerful computers and can implement strong\
    \ caching for commonly used resources, and could speed up things a lot. However,\
    \ it starts becoming a pain with syncing server-side state and client-side state,\
    \ as we’ll see now.\n\n# Fetching data on the server\n\nSo the idea is that we’ll\
    \ expose whatever data a particular component wants through a property, and then\
    \ we’ll resolve all the promises and data fetching before we actually render the\
    \ JSX to string. Finally, we’ll somehow sync up the state and react code. Let’s\
    \ see how we would do this briefly. Let us see the updated `Home.js` file. Bear\
    \ with me for a moment:\n\n```\n// Home.js\nconst React = require('react')\nconst\
    \ { Link } = require('react-router-dom')\nrequire('isomorphic-fetch')\nconst {\
    \ useEffect, useState } = React\n\nfunction Home(props) {\n  const [data, setData]\
    \ = useState(process.env.BROWSER && window.componentsData[Home.name])\n\n  useEffect(()\
    \ => {\n    if(!data) {\n      fetch('https://jsonplaceholder.typicode.com/posts/1').then(data\
    \ => data.json())\n      .then(data => setData(data))\n    }\n  }, [])\n\n  if(!data)\
    \ return <p>Loading…</p>\n\n  return <div className=\"home\">\n    <h1>This is\
    \ home page</h1>\n    <h2>{data.title}</h2>\n    <p>{data.body}</p>\n    <Link\
    \ to=\"/about\">About</Link>\n  </div>\n}\n\nHome.asyncData = 'https://jsonplaceholder.typicode.com/posts/1'\n\
    \nmodule.exports = Home\n```\n\nLet’s understand what the preceding code does\
    \ with the following points:\n\n*   Alright. So here, we’ve added some checks\
    \ if the data is already available with us or not.\n*   We, first of all, check\
    \ whether we’re in the browser environment or not using `process.env.BROWSER`\
    \ (we’ll configure this in webpack soon).\n*   If the browser, we want to load\
    \ the state from the global window object (we would set this up).\n*   `Home.name`\
    \ gives us “Home”, that is, the name of the function.\n\nWe’ve also added `asyncData`\
    \ property to the `Home` component, which we’ll use later to pre-fetch data on\
    \ the server.\n\nLet’s update the `About.js` file as well:\n\n```\nconst React\
    \ = require('react')\nconst { Link } = require('react-router-dom')\nconst { useState,\
    \ useEffect } = React\n\nfunction About(props) {\n  const [data, setData] = useState(process.env.BROWSER\
    \ && window.componentsData[About.name])\n\n  useEffect(() => {\n    if(!data)\
    \ {\n      fetch('https://jsonplaceholder.typicode.com/posts/2').then(data =>\
    \ data.json())\n      .then(data => setData(data))\n    }\n  }, [])\n\n  if(!data)\
    \ return <p>Loading…</p>\n\n  return <div className=\"about\">\n    <h1>This is\
    \ home page</h1>\n    <h2>{data.title}</h2>\n    <p>{data.body}</p>\n    <Link\
    \ to=\"/\">Home</Link>\n  </div>\n}\n\nAbout.asyncData = 'https://jsonplaceholder.typicode.com/posts/2'\n\
    \nmodule.exports = About\n```\n\nSimilar to `Home.js`, we’re fetching more data\
    \ in `About.js` file too. Also, we have an `asyncData` prop attached to `About`\
    \ component which we’ll use later.\n\nAlso, we need access to `process.env.BROWSER`\
    \ variable when webpack is building our scripts, so we’ll add that in the `webpack.config.js`\
    \ file. This is how our `webpack.config.js` file would finally look like:\n\n\
    ```\nconst path = require('path')\nconst webpack = require('webpack')\n\nmodule.exports\
    \ = {\n  mode: 'development',\n  devtool: 'source-map',\n  entry: {\n    app:\
    \ './src/client.js',\n  },\n  module: {\n    rules: [\n      {\n        test:\
    \ /\\.jsx?$/,\n        exclude: /(node_modules|bower_components)/,\n        loader:\
    \ \"babel-loader\",\n      }\n    ],\n  },\n  output: {\n    path: path.resolve(__dirname,\
    \ 'dist'),\n    filename: '[name].bundle.js',\n  },\n}\n```\n"
