  trans: "\n\n*   `Next.js` 为我们传递了两个参数供我们使用。第一个是 `req`（请求处理器），第二个是 `res`（响应处理器）。\n\
    *   第一个参数 `req` 包含了当前请求到达该特定端点的所有相关信息。这可能包括 POST 请求体数据、身份验证 Cookie、自定义标头等。\n*\
    \   第二个参数 `res` 可由你（开发者）写入。它提供了一些方法，调用这些方法会在底层生成一个 HTTP 响应，API 端点应将该响应发送回客户端。\n\
    *   如果你曾经在 `Node.js` 中使用过 Express，那么这可能会非常熟悉。\n*   首先，我们从 `req.body` 中提取用户名和密码。`req`\
    \ 处理器上的 `body` 属性将包含我们从客户端发送到服务器的任何内容。由于我们期望的是 JSON 请求，我们可以直接解构它。\n*   获取到这些值后，我们对其进行校验。\n\
    *   如果两者都是 admin，则进行身份验证（目前如此）。\n*   如果不是，则发送自定义错误消息。\n*   注意，我们使用 `res.json()`\
    \ 方法发送响应。如果查看 `NextApiResponse` 的类型声明，我们会发现 `res` 对象支持以下方法：\n\n```\nexport declare\
    \ type NextApiResponse<T = any> = ServerResponse& {\n  /**\n   * Send data ‘any’\
    \ data in response\n   */\n  send: Send<T>;\n  /**\n   * Send data ‘json’ data\
    \ in response\n   */\n  json: Send<T>;\n  status: (statusCode: number) =>NextApiResponse<T>;\n\
    };\n```\n\n*   正如注释所述，`send` 只是将原始文本发送回客户端。\n*   `json` 方法接收对象，将其序列化为 JSON 字符串，设置适当的\
    \ Content-Type 标头，然后发送给客户端。\n*   如果你还想设置自定义状态码（默认为 200 OK），可以使用附加的 `status` 方法。\n\
    \n现在，让我们更新首页的 `index.tsx` 文件，将数据发送回服务器 API：\n\n```\n// pages/index.tsx\nimport\
    \ React, { useState } from ‘react’\nimport { NextPage } from ‘next’\nimport ‘./styles.css’\n\
    \nconst IndexPage: NextPage = () => {\n  const [username, setUsername] = useState<string>(‘’)\n\
    \  const [password, setPassword] = useState<string>(‘’)\n\n  async function submitForm()\
    \ {\n    const req = await fetch(‘/api/login’, {\n      method: ‘POST’,\n    \
    \  headers: {\n        ‘Content-Type’: ‘application/json’\n      },\n      body:\
    \ JSON.stringify({ username, password })\n    })\n    const json = await req.json()\n\
    \    console.log(json)\n  }\n\n  return (\n    <form method=”POST”>\n      <div\
    \ className=”box”>\n        <h1>Login</h1>\n        <input type=”text” placeholder=”Username”\
    \ className=”field” value={username} onChange={e =>setUsername(e.target.value)}\
    \ />\n        <input type=”password” placeholder=”Password” className=”field”\
    \ value={password} onChange={e =>setPassword(e.target.value)} />\n        <div\
    \ className=”btn” onClick={submitForm}>Sign In</div>\n      </div>\n    </form>\n\
    \  )\n}\n\nexport default IndexPage\n```\n\n我们添加了一个名为 `submitForm` 的新函数，当点击“登录”按钮时触发。结果如下：\n\
    \n登录失败：\n\n![](img/image102.jpg)\n\n**图 7.5**\n\n上面的截图展示了用户登录失败的情况。\n\n登录成功：\n\
    \n![](img/image25.jpg)\n\n**图 7.6**\n\n上面的截图展示了用户登录成功的情况。\n\n太棒了！我们刚刚使用 `Next.js`\
    \ 实现了第一个 API 端点。现在，让我们继续将这些数据放入 Redux 存储中。现在开始实现 Redux。这很重要，因为我们希望将服务器传递的数据用于不同的页面/组件，而集中式存储将帮助我们实现这一点。\n\
    \n# 设置 Redux + Next.js\n\n首先，安装 `redux` 和 `next-redux-wrapper`，它们将为 `Next.js`\
    \ 项目提供 `Redux.js` 包装器。使用以下命令在系统上安装该包：\n\n`npm install react-redux redux next-redux-wrapper\
    \ --save`\n\n接下来，我们将设置 Redux 存储。回想一下我们在 Context API 中如何设置默认状态。这与那些行非常相似。存储基本上是一个集中式位置，所有组件都可以在其中存储数据并从该特定区域检索数据。\n\
    \n由于它是集中式的并且与组件解耦，因此读取/写入该区域的值可能会出现问题；因此，必须有一种简化的方式来仅访问组件需要读取的值。\n\n类似地，如果你想写入（更新）Redux\
    \ 状态，你不能直接操作。你必须为其编写一个**归约器**，即用于归约状态的东西。一旦你为存储编写了归约器，你就可以编写**调度器**。这些函数被称为调度器，因为它们将某些动作分派给这些归约器，而归约器在接收到这些动作后，会根据接收到的动作相应地更新状态。下图简要展示了\
    \ Redux 架构的工作原理：\n\n![](img/image113.jpg)\n\n**图 7.7**\n\n如果这让你感到困惑，别担心。当我们再次通过代码来讲解时，一切都会变得清晰得多。现在，让我们看看归约器代码：\n\
    \n1.  在项目目录下的 `redux` 文件夹中创建一个名为 `reducer.ts` 的文件（创建 `redux` 文件夹）。以下是归约器代码：\n\n\
    ```\n// reducer.ts\ntype Action = {\n  type: string\n  payload?: any\n}\n\nexport\
    \ type UserDetails = {\n  name: string\n  age: number\n  favQuote: string\n}\n\
    \nexport type State = {\n  user: UserDetails | null\n}\n\nconst defaultState:\
    \ State = {\n  user: null\n}\n\nconst reducer = (state: State = defaultState,\
    \ action: Action) => {\n  switch (action.type) {\n    case ‘SET_USER_DETAILS’:\n\
    \      return {\n        …state,\n        user: <UserDetails>action.payload\n\
    \      }\n    default:\n      return state\n  }\n}\n\nexport default reducer\n\
    ```\n\n在这里，你可以看到我们正在创建一个 Redux 存储和归约器。如上所述，`store` 是存储数据的地方，而归约器是一个函数，它使用某些分派的动作来更新存储。让我们了解这段代码是如何工作的：\n\
    \n*   首先，我们定义了一些 TypeScript 类型。\n*   然后我们创建了一个 `reducer` 函数。\n*   `reducer` 函数接受两个参数，第一个是实际的应用程序状态，在\
    \ `redux` 调用归约器之前，它会由 redux 自动填充。\n*   第二个参数是动作。我们的任务只是通过 `dispatcher` 函数分派这些动作。Redux\
    \ 会自动调用 `reducer` 函数。\n*   这个动作实际上是一个对象，包含一个类型和负载。\n*   `type` 属性定义了该动作应该更新什么。\n\
    *   `payload` 属性是你可以传递给归约器以更新状态的一些附加数据。\n\n文件结构如下所示：\n\n![](img/image73.jpg)\n\
    \n**图 7.8**\n\n上面的截图展示了当前的文件结构。\n\n2.  完成后，现在我们必须将 Redux 集成到我们的应用中。我们使用特殊的 `pages/_app.js`（实际上是\
    \ `_app.tsx`）文件来实现这一点。现在我们来讨论一下。\n\n# _app.js 文件\n\n根据文档：\n\n*   `Next.js` 使用\
    \ `App` 组件来初始化页面\n*   要覆盖，请创建 `./pages/_app.js` 文件并覆盖 `App` 类\n\n基本上，这个文件允许你覆盖\
    \ `Next.js` 用于提供页面的一些默认配置。由于我们希望 Redux 在每个页面上都可用，我们可以将 Redux 的 Provider（就像我们包装\
    \ Context API provider 一样）包装在这个特定文件中。\n\n因为我们使用的是 TypeScript，所以我们将创建一个名为 `_app.tsx`\
    \ 的文件。让我们继续创建它：\n\n"
- fmt: "\n```\n// pages/_app.tsx\n\nimport React from 'react'\nimport { createStore,\
    \ Store, compose } from 'redux'\nimport { Provider } from 'react-redux'\nimport\
    \ withRedux from 'next-redux-wrapper'\nimport reducer, { State } from '../redux/reducer'\n\
    import { NextPage } from 'next'\nimport { NextComponentType, NextPageContext }\
    \ from 'next/dist/next-server/lib/utils'\n\nlet devTools = (f: any) => f\n\nif(process.browser)\
    \ {\n  const _window = window as any\n  if(_window.__REDUX_DEVTOOLS_EXTENSION__)\
    \ {\n    devTools = _window.__REDUX_DEVTOOLS_EXTENSION__()\n  }\n}\n\nconst makeStore\
    \ = (initialState: State) => {\n  return createStore(reducer, initialState, compose(devTools))\n\
    }\n\ntype Props = {\n  Component: NextComponentType<NextPageContext>,\n  pageProps:\
    \ any,\n  store: Store\n}\n\nconst MyApp: NextPage<Props> = props => {\n  const\
    \ { Component, pageProps, store } = props\n  return (\n    <Provider store={store}>\n\
    \      <Component {...pageProps} />\n    </Provider>\n  )\n}\n\nexport default\
    \ withRedux(makeStore)(MyApp)\n```\n\nLet’s go over what’s happening in this file:\n\
    \n*   We import `createStore` and `Store` from the `redux` package. The store\
    \ is an interface for the store we’ll use.\n*   We get `withRedux` Higher Order\
    \ Component (HOC).\n*   We then register for redux devtools to work correctly.\
    \ For this, you must have Redux DevTools chrome extension installed in your browser.\
    \ You can find it for free on extension store.\n*   Then we write our file like\
    \ a normal next page with typed props.\n*   See where we destructure the `Component`,\
    \ `pageProps`, and store from the props of `MyApp`? That’s because this file is\
    \ run by `Next.js` before every page is sent and you could modify that before\
    \ that is rendered (or sent).\n*   We just wrap our original `Component` which\
    \ was supposed to be sent in the Provider component provided by the react-redux\
    \ package.\n*   The package `next-redux-wrapper` under the hood initializes the\
    \ store both on the client and server and handles the technical part.\n\nAt this\
    \ point, if you see your application and download the Redux DevTools extension\
    \ for Chrome, in your Chrome DevTools, you should see that Redux is working and\
    \ you should get an empty redux user store:\n\n![](images/image92.jpg)\n\n**Figure\
    \ 7.9**\n\nThe preceding screenshot shows our integration of Redux in the app.\n\
    \nWith that done, let’s move back to our app logic and use Redux in it. You can\
    \ see redux uses the name of our reducer (i.e. user in this case) as the name\
    \ of the store as well.\n\n# [Dispatching Redux Actions](#toc.xhtml_s114a)\n\n\
    In order to change the state in the Redux store, we need to dispatch actions.\
    \ Actions inform redux that there is a change in conditions and state should be\
    \ modified somehow. However, it is not necessary that a dispatch should always\
    \ update the state. Let’s create a new file called `redux/actions.ts` which would\
    \ have the following code:\n\n```\nimport { UserDetails } from './reducer'\n\n\
    export const setUserDetails = (payload: UserDetails) => {\n  return { type: 'SET_USER_DETAILS',\
    \ payload }\n}\n```\n\nAnd now, we would use this action in our root page. Let’s\
    \ update `pages/index.tsx` to the following:\n\n```\nimport React, { useState\
    \ } from 'react'\nimport { NextPage } from 'next'\nimport './styles.css'\nimport\
    \ { connect } from 'react-redux'\nimport { setUserDetails } from '../redux/actions'\n\
    \ntype Props = {\n  setUserDetails(json: any): void\n  name?: string\n}\n\nconst\
    \ IndexPage: NextPage<Props> = (props) => {\n  const [username, setUsername] =\
    \ useState<string>('')\n  const [password, setPassword] = useState<string>('')\n\
    \n  async function submitForm() {\n    const req = await fetch('/api/login', {\n\
    \      method: 'POST',\n      headers: {\n        'Content-Type': 'application/json'\n\
    \      },\n      body: JSON.stringify({ username, password })\n    })\n    const\
    \ json = await req.json()\n    console.log(json)\n    props.setUserDetails(json.data)\n\
    \  }\n\n  return (\n    <form method=\"POST\">\n      <div className=\"box\">\n\
    \        <h1>Login</h1>\n        {props.name || 'na'}\n        <input type=\"\
    text\" placeholder=\"Username\" className=\"field\" value={username} onChange={e\
    \ => setUsername(e.target.value)} />\n        <input type=\"password\" placeholder=\"\
    Password\" className=\"field\" value={password} onChange={e => setPassword(e.target.value)}\
    \ />\n        <div className=\"btn\" onClick={submitForm}>Sign In</div>\n    \
    \  </div>\n    </form>\n  )\n}\n\nconst mapStateToProps = ({ user }: any) => {\n\
    \  return {\n    name: user && user.name\n  }\n}\n\nexport default connect(mapStateToProps,\
    \ { setUserDetails })(IndexPage)\n```\n\nSo, what’s going on in this file? Let’s\
    \ see:\n\n*   We imported the `action` function, which we just created.\n*   When\
    \ we login, we now call a function which we are receiving somehow as the component\
    \ props. How? We’ll see.\n*   Then we create something called `mapStateToProps`.\
    \ For redux, we can extract certain values we want from our central store. Remember\
    \ the name of our reducer was user? We destruct (ES6 destruction) the user reducer\
    \ and try to extract the name property if it is available.\n*   We finally exported\
    \ the component, not as `IndexPage` but wrapped inside an HoC. The first argument\
    \ is the `mapStateToProps` we created. The second argument is the methods we pass,\
    \ which would be available in our props. When you call these methods, the return\
    \ value from these methods is dispatched to the redux store. Now, one of the reducers\
    \ would capture that action (using its type) and update the state accordingly.\n\
    \nYou would see now, that when we login using the correct credentials (admin and\
    \ admin as the username and password), we would see our name replaced in the login\
    \ form, and if you check the Redux DevTools, you’ll see an appropriate action\
    \ dispatched against it as well, which would update the redux state:\n\n![](images/image16.jpg)\n\
    \n**Figure 7.10**\n\nThe preceding screenshot shows correctly dispatching an action\
    \ to our Redux store.\n\nBut there’s something more we can do, even to this page!\
    \ When React introduced hooks, redux shortly brought in hooks support as well!\
    \ So, instead of using the `connect` function to connect the central store with\
    \ components, we can bring the values we need from the store using the provided\
    \ redux hooks directly.\n\nSimilarly, if we want to dispatch actions, we can dispatch\
    \ them too using a dispatcher redux provides us, through a hook. Let’s change\
    \ our above file to make use of hooks instead.\n\n# [useSelector and useDispatch](#toc.xhtml_s115a)\n\
    \nThese two hooks allow us to make use of Redux with hooks in React (pretty much\
    \ how you’d use `useContext`). Let’s see how above file could be written in hooks:\n\
    \n```\nimport React, { useState } from 'react'\nimport { NextPage } from 'next'\n\
    import './styles.css'\nimport { useSelector, useDispatch } from 'react-redux'\n\
    import { setUserDetails } from '../redux/actions'\n\nconst IndexPage: NextPage\
    \ = () => {\n  const dispatch = useDispatch()\n  const name = useSelector((state:\
    \ any) => state.user && state.user.name)\n  const [username, setUsername] = useState<string>('')\n\
    \  const [password, setPassword] = useState<string>('')\n\n  async function submitForm()\
    \ {\n    const req = await fetch('/api/login', {\n      method: 'POST',\n    \
    \  headers: {\n        'Content-Type': 'application/json'\n      },\n      body:\
    \ JSON.stringify({ username, password })\n    })\n    const json = await req.json()\n\
    \    console.log(json)\n    dispatch(setUserDetails(json.data))\n  }\n\n  return\
    \ (\n    <form method=\"POST\">\n      <div className=\"box\">\n        <h1>Login</h1>\n\
    \        {name || 'na'}\n        <input type=\"text\" placeholder=\"Username\"\
    \ className=\"field\" value={username} onChange={e => setUsername(e.target.value)}\
    \ />\n        <input type=\"password\" placeholder=\"Password\" className=\"field\"\
    \ value={password} onChange={e => setPassword(e.target.value)} />\n        <div\
    \ className=\"btn\" onClick={submitForm}>Sign In</div>\n      </div>\n    </form>\n\
    \  )\n}\n\nexport default IndexPage\n```\n\nHere’s what’s happening:\n"
