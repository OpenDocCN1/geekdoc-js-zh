    \ value is `mehul` which is reflected on the screen because of `router.query.param`\n\
    \n*   On the right, in the console, we can get all the information the hook `useRouter`\
    \ returns us. We can see `param` is one of them inside the `query` property. This\
    \ is coming directly from the name of the file. If you name the file something\
    \ else, it would be something else."
