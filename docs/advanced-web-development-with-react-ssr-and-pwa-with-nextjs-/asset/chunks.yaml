    \ 7.3**\n\nThe preceding screenshot shows the output from the browser.\n\nOkay.\
    \ Let’s start with our app now.\n\n# Creating App\n\nLet’s start with the `index.ts`\
    \ page which would be our login page:\n\n1.  Here’s a quick example of `index.ts`\
    \ file we could use:\n\n    ```\n    // pages/index.ts\n    import React, { useState\
    \ } from 'react'\n    import { NextPage } from 'next'\n    import './styles.css'\n\
    \    const IndexPage: NextPage = () => {\n    const [username, setUsername] =\
    \ useState<string>('')\n    const [password, setPassword] = useState<string>('')\n\
    \    return (\n    <form method=\"POST\">\n    <div className=\"box\">\n    <h1>Login</h1>\n\
    \    <input type=\"text\" placeholder=\"Username\" className=\"field\" value={username}\
    \ onChange={e =>setUsername(e.target.value)} />\n    <input type=\"password\"\
    \ placeholder=\"Password\" className=\"field\" value={password} onChange={e =>setPassword(e.target.value)}\
    \ />\n    <div className=\"btn\">Sign In</div>\n    </div>\n    </form>\n    )\n\
    \    }\n    export default IndexPage\n    ```\n\n    The component above just\
    \ creates a simple controlled Login form in React which we’ll see soon.\n\n2.\
    \  The `styles.css` file associated with the `index.js` file should be:\n\n  \
    \  ```\n    // styles.css\n    * {\n    margin: 0;\n    padding: 0;\n    box-sizing:\
    \ border-box;\n    outline: 0;\n    }\n    body {\n    font-family: 'Open Sans',\
    \ sans-serif;\n    background: #3498db;\n    margin: 0 auto 0 auto;\n    width:\
    \ 100%;\n    text-align: center;\n    margin: 20px 0px 20px 0px;\n    }\n    p\
    \ {\n    font-size: 12px;\n    text-decoration: none;\n    color: #ffffff;\n \
    \   }\n    h1 {\n    font-size: 1.5em;\n    color: #525252;\n    }\n    .box {\n\
    \    background: white;\n    width: 300px;\n    position: absolute;\n    top:\
    \ 50%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n    border-radius:\
    \ 6px;\n    padding: 20px;\n    box-shadow: 0 0 5px black;\n    }\n    .field\
    \ {\n    background: #ecf0f1;\n    border: #ccc 1px solid;\n    border-bottom:\
    \ #ccc 2px solid;\n    padding: 8px;\n    width: 100%;\n    color: #AAA;\n   \
    \ margin-top: 10px;\n    font-size: 1em;\n    border-radius: 4px;\n    }\n   \
    \ .btn {\n    background: #2ecc71;\n    width: 100%;\n    cursor: pointer;\n \
    \   padding: 5px 0;\n    color: white;\n    border-radius: 4px;\n    border: #27ae60\
    \ 1px solid;\n    margin-top: 20px;\n    font-weight: 800;\n    font-size: 0.8em;\n\
    \    }\n    .btn:hover {\n    background: #2CC06B;\n    }\n    ```\n\nNote that\
    \ I’m importing `styles.css` from a different file, hence we need a custom `next.config.js`\
    \ file as well in our project root directory (as discussed in the last chapter):\n\
    \n```\n// next.config.js\nconst withCSS = require('@zeit/next-css')\nmodule.exports\
    \ = withCSS({})\n```\n\nAnd also install the `@zeit/next-cssnpm` module:\n\n`npmi\
    \ @zeit/next-css -S`\n\nOnce you do that, don’t forget to restart the server.\n\
    \nThis would give us a nice output of following:\n\n![](images/image63.jpg)\n\n\
