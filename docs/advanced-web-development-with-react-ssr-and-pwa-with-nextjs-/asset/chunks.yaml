    *   Custom server with Next.js


    # [Objective](#toc.xhtml_s124a)


    In this chapter, our main aim would be to understand what progressive web apps
    are and how to set them up with our React and Next.js projects. Along the way,
    we’ll learn more about these technologies.


    # [What is a progressive web app?](#toc.xhtml_s125a)


    A progressive web app is a web app eventually, but a bit better. It uses modern
    web features to deliver great user experience, similar to the one you’ll experience
    using a native app. Some features of a progressive web app:


    1.  Responsive: Obviously, your app should be fit for all screens and sizes, and
    fortunately, these days creating a responsive site (or converting an existing
    site to responsive design) is not very hard unless the code is very old.'
