    is suspended due to some reason. Basically, Suspense allows your application to
    wait for something. This “something” could be any async operation - either I/O
    or memory bound. Let’s see how we can make use of that with code. Take a look
    at the example below:


    `import React from ‘react’`


    `constProfilePage = React.lazy(() => import(‘./ProfilePage’)); // Lazy-loaded`


    `// Show a spinner while the profile is loading`


    `<Suspense fallback={<Spinner />}>`


    `<ProfilePage />`


    `</Suspense>`


    Instead of importing the component directly, we wrap it inside React.lazy call.
    When this component is used, React sees that it is not available and starts a
    request to fetch the code for this component.


    Meanwhile, React also tries to look for a `Suspense` component as a node in the
    tree above it and uses the specified `fallback` component as the placeholder for
    the same. So, now, as long as `ProfilePage` is not available and ready, Suspense
    would show the Spinner in its place.


    # [Suspense – Data fetching](#toc.xhtml_s147a)


    This is where things get interesting. Suspense allows you to fetch data as if
    you were using data synchronously. This is still experimental, so we’ll not be
    diving deep into the code. Also, make sure to check the updated code if you’re
    reading this book in the future, as the API might have changed. Let’s see some
    code!


    `// This is not a Promise. It’s a special object from Suspense integration.`


    **`const resource = fetchProfileData();`**


    `function ProfilePage() {`


    `return (`


    `<Suspense fallback={<h1>Loading profile…</h1>}>`


    `<ProfileDetails />`


    `<Suspense fallback={<h1>Loading posts…</h1>}>`


    `<ProfileTimeline />`


    `</Suspense>`


    `</Suspense>`


    `);`


    `}`


    `function ProfileDetails() {`


    `// Try to read user info, although it might not have loaded yet`


    **`const user = resource.user.read();`**


    `return <h1>{user.name}</h1>;`


    `}`


    `function ProfileTimeline() {`


    `// Try to read posts, although they might not have loaded yet`


    **`const posts = resource.posts.read();`**


    `return (`


    `<ul>`


    `{posts.map(post => (`


    `<li key={post.id}>{post.text}</li>`


    `))}`


    `</ul>`


    `);`


    `}`


    This code has a lot going on. Let’s break it down.


    *   Firstly, we create a `resource`. This is special. This is not a Promise or
    a plain object. This object is created by React which we can use as if we have
    the data synchronously available with us. If not, React would automatically search
    the tree for the nearest Suspense component and would let it show the fallback
    loader. We’ll discuss the code for this soon! (The code is highly experimental
    and is likely to change, so please don’t use it in future).


    *   Then we read from the resource using `resource.posts.read()`. Notice that
    this is performed synchronously. Internally, if data is not present, the `read()`
    method actually throws under the hood for the `Suspense` component to catch, and
    this way, further execution is not performed. In case data is available, it is
    returned.


    *   Finally, we use it normally with components.


    Let’s discuss how the resource is created now. Here’s the current `unstable` implementation
    of `fetchProfileData`:


    `import { unstable_createResource } from ‘react-cache’`


    `function fetchProfileData() {`


    `return {`


    `user: unstable_createResource(`


    `() => fetch(‘…’).then(res =>res.json()) // return a Promise`


    `),`


    `posts: unstable_createResource(`


    `() => fetch(‘…’).then(res =>res.json()) // return a Promise`


    `}`


    `}`


    Basically, right now, you have to make use of `unstable_createResouce` which would
    probably be replaced by just `createResource` in the future. Here, right now (this
    might change!) you have to return a `Promise` which when resolved would make that
    particular resource available for your React components, and your component would
    be able to read the return value using `resource.read()` just like we saw in the
    earlier example.


    # [Conclusion](#toc.xhtml_s148a)


    In the final chapter of this book, we learned about the upcoming concurrent mode
    to React and how it would work. I hope this book gave you a base understanding
    of working with React and Next as a whole and solidified your concepts for React.
    After all these years working with React, I don’t think it is just a UI library,
    it is a whole development ecosystem, and there’s so much more to learn! All the
    best for your future endeavours.


    # [Questions](#toc.xhtml_s149a)


    1.  What is the difference between a reconciler and a renderer? Is react-native
    a reconciler or a renderer?


    2.  Class-based components mutate the state and props when they’re updated by
    parent/host, and functional components do not. Find out how functional components
    work under the hood. (Hint: functional components use hooks which return a new
    value on every render)


    3.  How is concurrent mode different from normal React mode?


    4.  What is the main essence of Suspense? (Hint: waiting for something)'
