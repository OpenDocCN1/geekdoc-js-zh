- fmt: '

    This could happen and is usually hard to notice as your codebase grows. So how
    to ensure that you don’t miss adding the dependency in the `useEffect` hook? You
    don’t. You pass the function as a dependency because it makes more sense that
    way! You see, the behaviour of the actual function `someAsyncOperation` changes
    due to the change in the state `url` variable, and hence it should be the one
    which should be added as a dependency. Not only this simplifies things but seems
    more logical.


    However, there’s no way React could compare a function with the previous version
    without actually executing it and seeing the result, but once you execute the
    function anyway, there’s no point in going back. Remember how we solved this similar
    issue in `useEffect`? Yes, dependencies array to the rescue! But how do we specify
    a dependency array for a standalone function?


    Here, you could use a new hook called `useCallback`. This hook would allow you
    to create memorized functions which would only change its identity if the dependency
    array passed to it changes. Here’s the same example from above but this time with
    a memorized function:


    ```

    constsomeAsyncOperation = useCallback(async () => {

    // some more code

    return await fetch(url)

    }, [url])

    ```


    ```

    useEffect(() => {

    // some long code….

    someAsyncOperation().then(r => {

    setResult(r)

    })

    }, [someAsyncOperation])

    ```


    Here, we could see that we’re now passing `someAsyncOperation` as the dependency
    of the main side effect function, and we’re passing `url` as the dependency of
    the `someAsyncOperation` function itself. This keeps things in order and allows
    you to write readable and clean code.


    React has a bunch of more inbuilt hooks which we’ll take a look at eventually
    as we proceed in the coming chapters.


    # Custom hooks


    Now that we have a working knowledge of React hooks and how they work under the
    hood, it is fairly simple to create simple custom hooks for your own use case.
    Let’s start with a simple example. Remember we talked about how `useState` doesn’t
    provide a callback function when the state is updated? Let’s implement that as
    a custom hook.


    ```

    import { useState, useEffect } from ‘react’


    constuseStateCB = (initState: any, cb: Function) => {

    const [state, setState] = useState(initState)

    useEffect(() =>cb(state), [state])

    return [state, setState]

    }


    export default useStateCB

    ```


    We could create something like the above in a file called `useStateCB.ts` and
    import this *hook* anywhere and use it! So how does it work?


    When you call `useStateCB(“test”, updatedState =>console.log(updateState))`, what
    you’re doing is you’re setting up twohooks - the original `useState` hook and
    the `useEffect` hook. The `useEffect` hook is used to keep a *watch* over our
    `useState` hook, and once the *state* changes we call the pass callback function
    with the new state. Because remember? The `useEffect` hook always runs withthe
    latest state value once per render. In this way, you can tailor custom hooks to
    your needs using some basic fundamental hooks.


    # Class components


    Here’s a quick example of a class based component written in TypeScript + React:


    ```

    import React from ‘react’

    import ReactDOM from ‘react-dom’


    class App extends React.Component<{}, {}> {

    render() {

    return <p>Hello World</p>

    }

    }


    ReactDOM.render(<App />, document.getElementById(‘root’))

    ```


    Here, we create a component named `App` which extends the class `React.Component`.
    Upon looking, you’d find that `React.Component` class provides a lot of useful
    features which enables us to use lifecycle methods and state inside class based
    components. We could specify the types of our props and types of our state here
    `<{}, {}>`.


    # Props


    We discussed in functional components about props and how they’re simply a small
    piece of data that a component could pass on to its children and how it could
    define itself as well. Here’s another example which receives a prop:


    ```

    class App extends React.Component<{ prop1: string }, {}> {

    render() {

    return <p>Hello World. Prop1 says {this.props.prop1}</p>

    }

    }


    ReactDOM.render(<App prop1=”something” />, document.getElementById(‘root’))

    ```


    We specified the types of props which we could receive using TypeScript and then
    we passed `prop1` when rendering the component. Finally, we accessed the passed
    prop using `this.props` object. The `this.props` object is populated by React
    with the keys being the names of props and values being the value passed with
    them.


    Just like in the functional way, you could pass anything, even functions, as props
    as JavaScript has first class functions.


    Additionally, we see that we have a method called `render` which is responsible
    for what the UI is displayed by React. No matter what you do in a class based
    component, whatever you return from the render method is the only thing which
    would be visible to the user on the screen (unless obviously you try to modify
    the DOM directly by yourself - which is of course a bad practice when using React)


    # State


    Managing state in class components is very straightforward. Out of the box, React
    allows you to create a specially named variable called `state`. React also provides
    a `setState` function which allows the mutation of the state object by React (and
    subsequent re-render). If you’re wondering from where this implementation comes,
    you could see that we inherit from the `React.Component` class, which contains
    the functionality mentioned.


    Here’s a simple example demonstrating the state in a class based component:


    ```

    class App extends React.Component<{}, { name: string }> {

    state = {

    name: ‘Mehul’

    }

    render() {

    return <p>{this.state.name}</p>

    }

    }

    ```


    Here we could see once again that we could specify the type of the state in TypeScript,
    and then we could go ahead and initialize our state with the defaults. So where’s
    the difference? The difference comes when we start using `this.setState` function.
    Upon calling that, React will update our state object and would automatically
    re-render and apply the updates to the component if necessary. For example:


    ```

    class App extends React.Component<{}, { num: number }> {

    state = {

    num: Math.random()

    }

    changeNum() {

    this.setState({

    num: Math.random()

    })

    }

    render() {

    return <p onClick={() =>this.changeNum()}>{this.state.num}</p>

    }

    }

    ```


    On clicking the `p` tag, we’ll see that the state variable changes the `num` property
    and sets it to a new `Math.random` value. See how it is different from a functional
    component. In a functional component, the state is never mutated, instead in a
    new render, the hooks return different (and updated) values. In class based components
    however, React itself mutates the `this` keyword to update the props and state
    according to the correct behaviour. This shows that although functional and class
    based components might just look like syntactic sugar over one another, fundamentally
    they’re very different from each other at their core of working.


    # Lifecycle methods


    React provides a bunch of lifecycle methods for you to put your code in and take
    full control over the rendering mechanism of the components. Let’s start with
    those and see a quick example in every component. Additionally, we could explore
    how they differ from hooks and what could be a possible behaviour replacement
    for hooks.


    ## constructor


    If you’re coming from an OOP background, you’ll know `constructor` is the first
    method which runs whenever you create an object. Although JavaScript doesn’t follow
    class-based inheritance, the syntactic sugar it introduced with classes in ES6
    resembles pretty closely to the same pattern.

