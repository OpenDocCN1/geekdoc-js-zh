    # [ReactDOM.hydrate](#toc.xhtml_s79a)


    Instead of making use of `ReactDOM.render`, we’re making use of `ReactDOM.hydrate`.
    `ReactDOM.hydrate`, as the name says, just *hydrates* the existing layout, it
    doesn’t create the layout and replaces it in DOM. `ReactDOM.hydrate` knows that
    the layout string is coming from the server, so it just needs to sync the client-side
    JS (i.e. events and listeners) with the coming server-side HTML code. Hence, we
    make use of the hydrate method.


