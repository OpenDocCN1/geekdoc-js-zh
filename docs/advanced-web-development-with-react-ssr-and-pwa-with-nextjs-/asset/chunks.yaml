    \ [username, setUsername] = useState<string>('')\n    const [password, setPassword]\
    \ = useState<string>('')\n    return (\n    <form method=\"POST\">\n    <div className=\"\
    box\">\n    <h1>Login</h1>\n    <input type=\"text\" placeholder=\"Username\"\
    \ className=\"field\" value={username} onChange={e =>setUsername(e.target.value)}\
    \ />\n    <input type=\"password\" placeholder=\"Password\" className=\"field\"\
    \ value={password} onChange={e =>setPassword(e.target.value)} />\n    <div className=\"\
    btn\">Sign In</div>\n    </div>\n    </form>\n    )\n    }\n    export default\
    \ IndexPage\n    ```\n\n    上面的组件只是创建了一个简单的受控登录表单，我们很快就会看到。\n\n2.  与 `index.js`\
