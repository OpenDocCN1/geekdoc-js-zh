    \ {\n  constructor(num) {\n    this.anothernum = num\n  }\n  getNum() {\n    console.log(this.anothernum)\n\
    \  }\n};\n\nclass IHateNumbers extends ILoveNumbers {\n  constructor(num) {\n\
