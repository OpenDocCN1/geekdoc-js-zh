    \ code practices) and would use it throughout the book. Here’s how you’re going\
    \ to start a TypeScript project:\n\n*   Nuke the JS hello world folder we created\
    \ earlier.\n*   Assuming that you’ve already installed the create-react-app utility\
    \ using the instructions above, in your command line, write `create-react-app\
    \ hello-world-ts --typescript`.\n*   This will initialize your React project with\
