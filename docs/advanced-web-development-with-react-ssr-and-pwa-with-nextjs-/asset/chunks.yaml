  trans: "\n这与上面的示例完全相同，唯一的区别是现在我们在 style 标签中有一个全局属性。尽管 HTML 部分仍然包含自定义作用域的语法，但 CSS\
    \ 部分现在是真正的全局样式，正如你在渲染输出中看到的：\n\n![](img/image43.jpg)\n\n**图 6.10**\n\n上面的截图展示了我们的\
    \ `Next.js` 代码如何渲染锚点标签。\n\n看，在右侧的样式部分，我们只是针对了 `anchor` 标签，而不是与之关联的长类名。这意味着我们正在针对页面上的所有锚点标签。\n\
    \n# 导入 CSS 文件\n\n老实说，对我来说，直接在 JSX 中编写 CSS 有点难以接受，我希望将它们分开以保持清晰。此外，在单独的文件中，你可以获得更好的语法高亮和错误处理。让我们看看如何在页面中设置导入\
    \ CSS 文件。\n\n与 `styled-jsx` 不同，CSS 导入默认并未内置于 `Next.js` 中，因为实现方式有很多种。让我们先安装 `@zeit/next-css`\
    \ 包。按照以下步骤操作：\n\n1.  在你的项目根目录中，执行 `npmi @zeit/next-css --save`\n\n2.  现在，我们需要在项目的根目录中创建一个\
    \ `next.config.js` 文件。文件内容如下：\n\n    ```\n    // next.config.js\n    constwithCSS\
    \ = require(‘@zeit/next-css’)\n    module.exports = withCSS({})\n    ```\n\n3.\
    \  此时重启你的开发服务器\n\n4.  你可以在 `withCSS` 函数中传递额外选项，例如使用 CSS 模块\n\n5.  完成后，让我们将样式移到单独的文件中\n\
    \n以下是我们的 `Header.js` 组件最终的样子：\n\n```\n// components/Header/index.js\nimport Link\
    \ from ‘next/link’\nimport ‘./style.css’\nconst Header = () => (\n<header>\n<Link\
    \ href=”/”>\n<a>Home</a>\n</Link>\n<Link href=”/about”>\n<a className=”special”>About</a>\n\
    </Link>\n</header>\n)\nexport default Header\n```\n\n而 `style.css` 文件的内容如下：\n\n\
    ```\n// components/Header/style.css\nheader {\npadding: 20px;\nbackground: #1e1e1e;\n\
    border-bottom: 1px solid black;\nfont-size: 30px;\n}\na {\ncolor: white;\nmargin-right:\
    \ 30px;\n}\na.special {\ncolor: yellow;\n}\n```\n\n这将产生以下输出：\n\n![](img/image72.jpg)\n\
    \n**图 6.11**\n\n上面的截图展示了我们刚刚编写的 `Header` 组件文件所产生的输出。\n\n此外，components 目录的文件结构也有所变化。见下方：\n\
    \n![](img/image122.jpg)\n\n**图 6.12**\n\n上面的截图展示了当前的文件结构。\n\n太棒了！现在让我们使用 CSS 模块。我们可以将网站的行为切换为使用\
    \ CSS 模块，这意味着类名将被随机化，从而避免不同组件中相同类名之间的冲突。让我们看看如何实现。将 `next.config.js` 文件修改为以下内容：\n\
    \n```\n// next.config.js\nconstwithCSS = require(‘@zeit/next-css’)\nmodule.exports\
    \ = withCSS({\ncssModules: true\n})\n```\n\n完成此操作并重启服务器后，你会看到你的“About”链接不再是黄色，尽管它在\
    \ HTML 标记中有一个 special 类。这是因为现在启用了 CSS 模块，类名“special”已被 CSS 模块系统重写。现在，要将类应用于特定元素，你必须使用导入的样式。按如下方式修改\
    \ `Header.js` 文件：\n\n```\nimport Link from ‘next/link’\nimport css from ‘./style.css’\n\
    const Header = () => (\n<header>\n<Link href=”/”>\n<a>Home</a>\n</Link>\n<Link\
    \ href=”/about”>\n<a className={css.special}>About</a>\n</Link>\n</header>\n)\n\
    export default Header\n```\n\n现在应该可以工作了！查看 HTML 标记，类名是完全随机的。这基本上就是 webpack CSS\
    \ 加载器，你还可以使用 webpack 文档中的选项进一步自定义它：[`github.com/webpack-contrib/css-loader`](https://github.com/webpack-contrib/css-loader)。\n\
    \n# 结论\n\n本章介绍了 Next.js 框架，帮助我们理解了一些核心概念，以便开始使用它并设置其某些方面。\n\n我们了解了 Next.js 是什么，如何用它引导第一个项目，并深入了解了发送到浏览器的响应是如何真正渲染为\
    \ HTML 的。\n\n在下一章中，我们将看到如何进一步使用这个框架，并更深入地了解 Next.js 的工作原理，以及如何根据我们的需求调整框架。\n\n\
    # 问题\n\n1.  Next.js 与上一章中我们在服务器端运行 React 的方式有何不同？\n\n2.  假设在 `pages/myroute/index.js`\
    \ 有一个组件。在开发模式下运行时，它是否可以在 `localhost:3000/myroute` 访问？\n\n3.  如何在根路径（即 `localhost:3000/robots.txt`）托管\
    \ `robots.txt` 文件？你应该将文件放在哪里？\n\n4.  Next.js 的 Link 与 `react-router-dom` 的 Link\
    \ 有什么区别？\n\n5.  列出一些在 Next.js 组件中使用 CSS 的方法。\n\n# 第七章\n\n# 更多 Next.js 内容\n\n在上一章中，我们学习了\
    \ Next.js，了解了它是什么，以及如何用它快速搭建一个基本的 SSR React 项目。然而，应用程序通常比这更复杂，需要处理许多细节和难点。在本章中，我们将探索\
    \ Next.js 的一些精细部分，并了解如何将它们整合到我们的代码中。这很重要，因为大多数应用程序有时需要根据自身需求进行自定义调整或更改。让我们深入探讨。\n\
    \n## 结构\n\n*   创建 Next.js 项目\n*   Redux 简介\n*   在 Next.js 中设置 Redux\n*   TypeScript\
    \ + Next\n*   使用 Next.js 创建 API 端点\n*   Next.js 自定义文件\n*   动态路由\n\n## 目标\n\n本章的目标是花更多时间全面了解\
    \ `Next.js` 框架，使自己熟悉其生态系统，并从零开始启动一些 `Next.js` 项目，在此过程中探索各种 `Next.js` 概念。\n\n##\
    \ Next.js 应用程序\n\n在本章中，我们将创建一个 `Next.js` 应用，同时讨论关于该应用的重要概念。我们将创建一个登录门户，根据登录的用户类型显示一些自定义值。我们将从基础开始，逐步学习并最终引入\
    \ Redux 等技术。让我们开始吧。\n\n## 启动项目\n\n首先，让我们从创建一个全新的 `Next.js` 项目开始。这很简单，我们在上一章已经做过。以下是本项目需要注意的一些关键点：\n\
    \n*   对于这个项目，目前我们需要一个登录页面、一个注册页面和一个仪表盘页面。\n*   为简单起见，我们将登录页面作为我们的首页。\n*   但在开始之前，让我们先为\
    \ Next.js 切换到 TypeScript（就像我们之前对 React 所做的那样）。\n\n## 切换到 TypeScript\n\nTypeScript\
    \ 已被证明是一种非常可靠的规模化编写 JavaScript 的方法，几乎所有达到一定规模后的代码库都会遇到常见的 JavaScript 陷阱，比如缺乏类型检查支持。TypeScript\
    \ 在这方面非常有用。它编译成 JavaScript，同时允许我们使用最适合开发者的 JavaScript 版本进行编写。\n\n*   要创建一个 TypeScript\
    \ 项目，我们直接使用 `npx` 中的 `create-next-app` 工具\n*   进入你想要设置 Next.js（或者我们应该称之为 `Next.ts`\
    \ 项目）的目录\n*   运行以下命令：\n\n    `npx create-next-app --example with-typescript my-custom-app`\n\
    \n"
- fmt: "\n*   What this does is that it pulls the `create-next-app` package and runs\
    \ it with the supplied arguments. It pulls an example repo that uses TypeScript\
    \ and then creates our project with the name `my-custom-app` with all the `npm`\
    \ install and `package.json` stuff already taken care of.\n\n*   Once you do that,\
    \ open the project in your text editor.\n\nThis is how your file structure should\
    \ look like right now:\n\n![](images/image151.jpg)\n\n**Figure 7.1**\n\nThe preceding\
    \ screenshot shows the file structure right now.\n\nStart your application using\
    \ `npm run dev` which would start a local development server at `localhost:3000`\n\
    \nNow, let’s look at a state management tool called Redux.\n\n# Redux\n\nRedux\
    \ is a generic state management tool that could be used as one of the options\
    \ with React. Redux basically centralizes the state and makes the flow of data\
    \ unidirectional. Remember how we used Context API in the *State Management* chapter?\
    \ Redux falls on very similar lines, just that it is an external dependency and\
    \ comes with Redux DevTools and a bunch of other benefits.\n\nLet’s see how we\
    \ can integrate Redux with `Next.js` and how to work with it in general. But before\
    \ that, let’s look at something called `getInitialProps` lifecycle in `Next.js`.\n\
    \n# getInitialProps\n\nIn `Next.js`, `getInitialProps` is used to populate the\
    \ props with some custom logic if you want to before the component is rendered.\
    \ This method is executed on both the client and the server. Let’s look at some\
    \ code to understand in a better way. Let’s modify the `about.ts` file present\
    \ in our project:\n\n```\n// about.ts\nimport * as React from 'react'\nimport\
    \ Link from 'next/link'\nimport Layout from '../components/Layout'\nimport { NextPage,\
    \ NextPageContext } from 'next'\ntype Props = {\n  someprop: string\n}\nconst\
    \ AboutPage: NextPage<Props> = (props: Props) => (\n<Layout title=\"About | Next.js\
    \ + TypeScript Example\">\n<h1>About</h1>\n<p>This is the about page</p>\n<p>\n\
    <Link href=\"/\">\n<a>Go home {props.someprop}</a>\n</Link>\n</p>\n</Layout>\n\
    )\nAboutPage.getInitialProps = async ({pathname, query}: NextPageContext) => {\n\
    console.log(pathname, query)\nreturn {\n  someprop: 'customvalue'\n}\n}\nexport\
    \ default AboutPage\n```\n\nThe lines in bold are the changes we did in this file.\
    \ Notice how we have added a function called `getInitialProps` to the `AboutPage`.\
    \ This function runs before the component is mounted, as you can see, this function\
    \ is supposed to return a `Promise`. Thus, you can do all sorts of async activity\
    \ in it as well, as well as set up our Redux store (more on this later). Since\
    \ this is coming out from `Next.js`, it is isomorphic and runs both on server\
    \ and client.\n\nIn the browser it produces the following output:\n\n![](images/image161.jpg)\n\
