    # PWA using Next.js


    Now that we have a decent understanding of what a PWA is and how it works basically
    let’s shift our focus to how we can implement PWA using `Next.js`.


    Let’s start by creating a simple `Next.js` project. You can setup `Next.js` manually
    as we did in the last chapters, or we can just make use of a handy `create-next-app`
    utility like this to do the same:


    ![](images/image93.jpg)


    **Figure 8.7**


    This would basically initialize our setup in the same way we did before. Once
    that is done, we need to install another package called `next-offline`. This would
    enable service worker support for our app and eventually support for PWA.


    `npm install --save next-offline`


    This would install the `next-offline` package. Once that is done, create a new
    file called `next.config.js` in the project, and this is what would go inside
    that file:


    ```

    // next.config.js

    constwithOffline = require(''next-offline'')

    constnextConfig = {}

    module.exports = withOffline(nextConfig)

    ```


    There is a lot of default configuration which the `next-offline` package uses,
    and by default, we can safely stick to it. Basically, what the `withOffline` function
    would do, is that it would inject a service worker script with the passed options
    when the bundle for `Next.js` is prepared. Let’s build our next project using
    `npm run build`. In the `build` folder, we’ll see that in the `main-<hash>.js`
    file, you’ll see the following compressed snippet somewhere:


    `navigator.serviceWorker.register("/service-worker.js",{scope:"/"}).then….`


    Now, just like we did with the above react app, we need to serve our `service-worker.js`
    file. Don’t worry, and we don’t have to code it ourselves as it is again, created
    by Next automatically! But we surely need to serve it on `/service-worker.js`
    URL, and you know, in Next, static files are served under the static directory.


    Now, although we can move our service worker file in the static directory and
    change the path of service worker using the configuration above, we’ll go ahead
    and try to redirect all requests coming to `/service-worker.js` to the file on
    our filesystem and let Next handle rest of the requests by creating a custom server.


    ## Custom Next.js Server


    Create a file called `server.js` in the root of project and write the following
    contents inside it:


    ```

    const { createServer } = require(''http'')

    const { join } = require(''path'')

    const { parse } = require(''url'')

    const next = require(''next'')

    const app = next({ dev: process.env.NODE_ENV !== ''production'' })

    const handle = app.getRequestHandler()

    app.prepare()

    .then(() => {

    createServer((req, res) => {

    constparsedUrl = parse(req.url, true)

    const { pathname } = parsedUrl

    // handle GET request to /service-worker.js

    if (pathname === ''/service-worker.js'') {

    constfilePath = join(__dirname, ''.next'', pathname)

    app.serveStatic(req, res, filePath)

    } else {

    handle(req, res, parsedUrl)

    }

    })

    .listen(3000, () => {

    console.log(''> Ready on http://localhost:${3000}'')

    })

    })

    ```


    This code is directly picked from official Next docs, but let’s go over what is
    happening here:


    *   Because this script is directly executed by `node`, it doesn''t pass through
    `webpack` or `babel`, so you have to use CommonJS imports here.

    *   Then we bring in the Node''s `createServer` method from the `http` package
    to create a custom server.

    *   We also import the package `next`. Here''s how the `next` API works.


    ### next(config: object)


    The `config` object consists of the following:


    *   `dev`: A Boolean indicating the development/production mode (`default: false`)

    *   `dir`: Location where the project is present (`default: ''.''`)

    *   `quiet`: Whether to hide error messages containing server info (`default:
    false`)

    *   `conf`: Next.js configuration object (same object which is read from `next.config.js`
    file)


    This returns us the app object, which has a bunch of methods associated with it
    for custom routing. We’ll only look at `getRequestHandler` and `serveStatic` though.


    ### getRequestHandler()


    This method basically allows Next to handle routing just like default way, so
    in essence, when we don’t want our custom logic to take place, we’ll call this
    method with the appropriate `req` and `res` objects from the `createServer` method.


    It returns us another function, `handle`, which can be called using the request
    and response objects coming from our server.


    ### serveStatic()


    We use another package called `url` to parse the URL into different parts—`hostname`,
    `pathname`, `protocol`, `port`, and so on.


    Finally, we check, if the pathname actually matches `/service-worker.js`. If yes,
    we use the `app.serveStatic()` method. Basically, we pass in the `req` and `res`
    objects with the path where to resolve the static asset to. In our case, our file
    `service-worker.js` is present inside the `.next` folder as a direct child, so
    we just use `path.join` to get the path directly.


    Once that is done, we’ll need to make a bunch of changes to our `package.json`
    file too. Your scripts section inside the JSON file should look like this:


    ```

    “scripts”: {

    “dev”: “node server.js”,

    “build”: “next build”,

    “start”: “NODE_ENV=production node server.js”

    }

    ```


    Finally, let’s create a `manifest.json` file similar to last time and place it
    in the `.next` folder and add a custom route for it. So the `manifest.json` file
    would look like:


    ```

    {

    “short_name”: “React App”,

    “name”: “Create React App Sample”,

    “icons”: [

    {

    “src”: “favicon.ico”,

    “sizes”: “64x64 32x32 24x24 16x16”,

    “type”: “image/x-icon”

    },

    {

    “src”: “logo192.png”,

    “type”: “image/png”,

    “sizes”: “192x192”

    },

    {

    “src”: “logo512.png”,

    “type”: “image/png”,

    “sizes”: “512x512”

    }

    ],

    “start_url”: “.”,

    “display”: “standalone”,

    “theme_color”: “#000000”,

    “background_color”: “#ffffff”

    }

    ```


    And our `server.js` file would look like:


    ```

    const { createServer } = require(''http'')

    const { join } = require(''path'')

    const { parse } = require(''url'')

    const next = require(''next'')

    const app = next({ dev: process.env.NODE_ENV !== ''production'' })

    const handle = app.getRequestHandler()

    app.prepare()

    .then(() => {

    createServer((req, res) => {

    constparsedUrl = parse(req.url, true)

    const { pathname } = parsedUrl

    // handle GET request to /service-worker.js

    if (pathname === ''/service-worker.js'' || pathname === ''/manifest.json'' ||
    pathname === ''/logo512.png'' || pathname === ''/logo192.png'') {

    constfilePath = join(__dirname, ''.next'', pathname)

    app.serveStatic(req, res, filePath)

    } else {

    handle(req, res, parsedUrl)

    }

    })

    .listen(3000, () => {

    console.log(''> Ready on http://localhost:${3000}'')

    })

    })

    ```


    Don’t forget to place your icons as well in the `.next` folder! Finally, to serve
    our `manifest.json` file, we need to include it as a `link` tag in every page
    (just like we did with React example above). Let’s do that using the `_document.js`
    file in `Next.js`.


