  trans: "\n\n在前面的示例中，`reduce` 接受一个函数，该函数每次被调用时都会传入两个值：累加器（accumulator）和当前值（current\
    \ value）。你在函数中返回的任何内容都会成为下一次函数调用的累加器值。你还可以选择将初始累加器值作为第二个参数传递给 `.reduce` 函数。如果未提供该参数，累加器将初始化为数组的第一个元素，并从第二个元素开始对数组进行归约。\n\
    \n# 类（Classes）\n\nES6 中的类仅仅是函数的语法糖。JavaScript 并非面向对象语言，它遵循原型继承模型，类也是如此。不过，提出的语法使其看起来与面向对象非常相似。\n\
    \n以下是 ES6 类的一个示例：\n\n```\nclass ILoveNumbers {\n  constructor(num) {\n    this.anothernum\
    \ = num\n  }\n  getNum() {\n    console.log(this.anothernum)\n  }\n};\n\nclass\
    \ IHateNumbers extends ILoveNumbers {\n  constructor(num) {\n    super(num**num)\n\
    \    this.num = num\n  }\n  getNum() {\n    console.log(this.num)\n  }\n  getNumFromParent()\
    \ {\n    console.log(super.getNum())\n  }\n};\n\nlet obj = new IHateNumbers(5)\n\
    obj.getNum() // 5\nobj.getNumFromParent() // 3125\n```\n\n关于上述代码的一些重要注意事项：\n\n\
    1.  这里我们创建了一个简单的类 `ILoveNumbers`，它只存储一个数字。\n\n2.  我们创建了另一个类 `IHateNumbers`，它继承自前一个类。在基于类的语法中，“`扩展`”仅仅意味着你将父类（函数）添加到了当前类（函数）的原型链中。\n\
    \n3.  我们使用了一个特殊的关键字 `super`。通过 `super`，我们可以访问父类。请记住，在方法中使用 `super` 时，`super` 指向的是**定义该方法的对象的原型链**。这意味着，如果我将\
    \ `IHateNumbers` 的原型链更改为其他内容，那么 `super.getFav()` 将无法按预期工作。考虑以下代码：\n\n    ```\n\
    \    class C1{ method() { return 1 } }\n    class C2 extends C1{ method() { return\
    \ super.method() } }\n    class C3{ method() { return 3 } }\n    class C4 extends\
    \ C3{ method() { return 4 } }\n    const obj = new C4\n    console.log(obj.method())\
    \ // 输出 4\n    C4.prototype.method = C2.prototype.method\n    console.log(obj.method())\
    \ // 输出 1\n    ```\n\n4.  这里你可以清楚地看到，`super.method()` 并没有调用 `C3` 的方法，而是调用了 `C1`\
    \ 的方法。然而，如果你将 `C4` 的方法定义为返回 `super.method()`，它就会调用 `C3` 的方法。\n\n# 闭包（Closures）\n\
    \n闭包是 JavaScript 中实现的一个基本概念，它既极其强大又非常优美。用一句话来定义闭包：*函数会记住*。作为计算机科学家，我们普遍认为当函数返回时，它们会清除所有与之关联的局部变量信息。但当你使用闭包时，情况就不同了。例如，考虑以下代码：\n\
    \n```\nfunction a() {\n  let value = 1\n  return () => value++\n}\n\nconst func\
    \ = a()\nfunc() // 1\nfunc() // 2\nfunc() // 3\n```\n\n在上面的函数中，我们可以看到，尽管 `value`\
    \ 是一个局部变量，但在函数 `a` 执行完成后它并没有被销毁。相反，函数记住了它。\n\n# 更多 JavaScript 主题\n\n随着你阅读本书的深入，你会意识到与\
    \ React 框架本身相比，你总是需要用到更多的 JavaScript。虽然我们上面已经讨论了一些常见的 JavaScript 主题，但如果你对 JavaScript\
    \ 基础知识的巩固和夯实感兴趣，我们建议你进一步阅读以下主题。由于本书并非核心 JS 书籍，我们不会过多关注仅限于 JavaScript 的主题，但你随时可以利用这个列表来学习更多内容：\n\
    \n1.  解构（Destructuring）\n\n2.  展开运算符（Spread operator）\n\n3.  ES6 导入/导出模块语法（ES6\
    \ import/export module syntax）\n\n4.  异步/等待（Async/Await）\n\n5.  JavaScript 中的可选链（Optional\
    \ chaining）\n\n6.  空值合并（Nullish Coalescing）\n\n7.  原型继承模型（Prototypal inheritance\
    \ model）\n\n8.  提升/变量作用域（Hoisting/variable scoping）\n\n# 结论\n\n本章涵盖了一些基本的 React\
    \ 概念和基础的 JavaScript 知识。在下一章中，我们将学习如何搭建 React 开发环境并有效使用它。我们将探索 React 基础知识，逐步深入到服务端渲染框架\
    \ Next.js，并最终介绍渐进式 Web 应用（Progressive Web Apps）的相关信息。请系好安全带，准备开启代码之旅！\n\n# 第 2\
    \ 章\n\n## 搭建 React\n\n在本章中，我们将介绍一些常见以及不那么常见的将 React 集成到开发工作流中的方法。我们将从最基础的内容开始，比如你应该选择哪个编辑器，一直到最适合你的\
    \ React 应用启动方式，使其满足你的需求并方便你将其投入生产环境。让我们开始吧！\n\n有些人喜欢一直使用**集成开发环境（IDE）**。我们将采用不同的方法。对于\
    \ Web 开发这类事情，IDE 往往会变得非常臃肿。此外，IDE 抽象了很多东西，因此你学到的东西会比预期的少得多。我们将使用（并学习）命令行，使用轻量级文本编辑器编写代码，并构建出色的应用程序！让我们继续本章的内容。\n\
    \n### 结构\n\n*   选择文本编辑器\n\n*   安装 Node 和 NPM\n\n*   搭建 React 项目的方法\n\n*   React\
    \ 的 Hello World\n\n*   JSX\n\n*   转向 TypeScript 用于 React\n\n### 目标\n\n我们将从简单的选择开始——选择你喜欢的文本编辑器来编写代码。然后我们将继续安装和设置所需的技术，这将帮助我们探索搭建第一个\
    \ React 项目的方法。我们还将探讨什么是 JSX 以及它是如何工作的。最后，我们将把重点转向用于 React 的 TypeScript，并在本书中一直使用它，以获得更好的类型系统和无错误的代码。\n\
    \n### 选择文本编辑器\n\n首先，你需要一个编写代码的地方。以下是我们个人推荐的文本编辑器列表。\n\n#### #1 – VSCode\n\n这是目前最流行的文本编辑器，你遇到的大多数\
    \ Web 开发者都会一直使用 VSCode。VSCode 完全可定制，拥有大量额外的插件来提升你的生产力。它是跨平台的（macOS/Linux/Windows），你可以在这里为你的平台获取稳定的二进制文件：[`code.visualstudio.com/#alt-downloads`](https://code.visualstudio.com/#alt-downloads)。\n\
    \n#### #2 – Sublime Text\n\n另一个优秀的文本编辑器是 Sublime Text。如果你对 VSCode 不满意，Sublime\
    \ Text 可以作为第二选择。你可以购买它，但并非强制。Sublime Text 允许你免费使用很长时间，每隔一周左右会弹出一个升级提示。它还附带强大的包系统和出色的主题。从这里下载：[`www.sublimetext.com/3`](https://www.sublimetext.com/3)。\n\
    \n#### #3 – Atom\n\n如果你正在寻找文本编辑器，Atom 也是一个不错的选择。它包含包管理器，完全可定制且免费！你可以从这里下载 Atom\
    \ 文本编辑器：[`atom.io/`](https://atom.io/)。\n\n### 安装 Node 和 NPM\n\n一旦你的文本编辑器安装并准备就绪（这通常需要\
    \ 5-10 分钟），就该安装 Node 和 npm 了。如果你的系统上已经安装了它们，可以跳过本节。Node 基本上是将 JavaScript 引擎（负责在机器上运行你编写的\
    \ JavaScript 的代码）作为本地应用程序放在你的计算机上，而不是仅仅嵌入在 Web 浏览器中。而 npm 是其包管理器，用于添加和删除包和依赖项。\n\
    \n"
- fmt: "\n# [Windows](#toc.xhtml_s21a)\n\nFor Windows, follow the steps to install\
    \ the latest stable versions of node and npm:\n\n1. Go to [https://nodejs.org/en/download/](https://nodejs.org/en/download/).\n\
    2. Download the **Windows Installer (.msi)** file. Choose according to your operating\
    \ system - 32 bit or 64 bit.\n3. Follow the wizard instructions and complete the\
    \ installation.\n4. Verify your installation by opening `cmd` from the **Start**\
    \ menu.\n5. Type `node -v` in cmd and check if it displays a number.\n\n## Linux\n\
    \nFor Linux, follow the steps to install the latest stable versions of node and\
    \ npm:\n\n1. Open your command line (terminal).\n2. Write `sudo apt-get update\
    \ && sudo apt-get install npm`.\n3. Depending on your distribution, you might\
    \ not have `apt-get` as the package manager. Just find out what your package manager\
    \ is, and install the `npm` package from the official repository.\n4. Once it\
    \ completes, write the following: `sudo npm install -g n`.\n5. This will install\
    \ a node version manager package called `n` on your systems.\n6. Once this completes,\
    \ write: `sudo n stable`.\n7. This would finally install a stable release of both,\
    \ node and npm, and add it to your path as well.\n8. Finally, quit your terminal\
    \ and start again. This time write `node -v`, and see a version number pop up.\
    \ You’re good to go now!\n\n## macOS\n\nIf you have a macOS system, here are the\
    \ steps you need to follow in order to get node and npm on your systems:\n\n1.\
    \ On macOS, you need a brew package manager. If you don’t know what it is, you\
    \ probably don’t have that installed. Write the following in your command line\
    \ to install the brew package manager: `/usr/bin/ruby -e \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install)\"\
    `.\n2. You can find the brew installation instructions here as well: [https://brew.sh](https://brew.sh).\n\
    3. Once the brew is installed, write `brew install node`.\n4. Wait for it to install.\n\
    5. You’re done!\n\n# [Setting up React projects](#toc.xhtml_s22a)\n\nNow, let\
    \ us discuss of the various ways in which we could bootstrap our React project.\
    \ We’ll start with the most barebones method first, and gradually proceed towards\
    \ more advanced methods.\n\n## [#1 – Setting up with CDN](#toc.xhtml_s23a)\n\n\
    This is the most straightforward way to write Hello World in React. You just throw\
    \ in the React libraries using some CDN website, and you’re good to go. For example,\
    \ consider the following code:\n\n```html\n<!doctype HTML>\n<html>\n<head>\n<title>React\
    \ hello world</title>\n</head>\n<body>\n<div id=\"root\"></div>\n<script src=\"\
    https://unpkg.com/react@16/umd/react.production.min.js\"></script>\n<script src=\"\
    https://unpkg.com/react-dom@16/umd/react-dom.production.min.js\"></script>\n<script\
    \ src=\"https://unpkg.com/babel-standalone@6/babel.min.js\"></script>\n<script\
    \ type=\"text/babel\">\nclass HelloWorld extends React.Component {\nrender() {\n\
    return (<p>Hello world</p>);\n}\n}\nReactDOM.render(\n<HelloWorld />,\ndocument.getElementById('root')\n\
    );\n</script>\n</body>\n```\n\nA lot is happening in this code. Let us break this\
    \ down quickly:\n\n1. Firstly, we’re loading two scripts—react itself and react-dom.\
    \ Why 2? Well, as you can see that React itself isn’t just limited to the web.\
    \ You see React being used on mobile phones as well using React Native. That means\
    \ React is independent of the **Document Object Model** (**DOM**), a construction\
    \ which the browser uses to render HTML. Because we’re working with web pages,\
    \ we need the core library, that is, React, plus we need the reconciler that would\
    \ glue React and DOM (browser) together, hence React DOM.\n2. Then we load a library\
    \ called **babel** (more on this in next points).\n3. Finally, you can see that\
    \ we create a script tag with the type `text/babel`. This is because we’re not\
    \ going to write pure JavaScript in this script tag. We’ll write some code that\
    \ needs to be pre-processed, before being executed as regular JavaScript.\n4.\
    \ Finally, we see some React constructs (classes and `ReactDOM`), but we’ll ignore\
    \ it for now. What is interesting is that we wrote `<p>Hello World</p>` directly,\
    \ without any quotes. This is not an error. It is, in fact, JSX (more on this\
    \ will follow).\n\n## [#2 – Using create-react-app](#toc.xhtml_s24a)\n\n`create-react-app`\
    \ is a tool that allows very quick bootstrapping of React projects with minimal\
    \ configuration to be done by the end-user. To use it:\n\n1. Open your terminal\
    \ again (`cmd` on Windows or Terminal on macOS/Linux).\n2. Write `npm install\
    \ create-react-app -g`.\n3. Once that is completed, write `create-react-app hello-world`.\n\
    4. Let it complete. Once it does, you’ll see a directory named `hello-world`.\
    \ `cd hello-world` and write `npm start`.\n5. This will start your local development\
    \ server. Open the folder in your favorite text editor, and a browser window would\
    \ open automatically. There onwards, you can make your changes and see them reflecting\
    \ directly in the browser.\n\n## #3 – Setting up from scratch\n\nThis is a bit\
    \ advanced for starting with React but setting this up means that you are fine-tuning\
    \ and controlling every aspect of your React application. We’ll follow a model\
    \ like `create-react-app`, but this time all the configuration files and folders\
    \ would be visible to us:\n\n1. Create a new folder called `hello-world-scratch`:\n\
    \n   ```bash\n   cd hello-world-scratch\n   ```\n\n2. Then do a `npm init -y`,\
    \ which would create a `package.json` file in that directory. This file is responsible\
    \ for handling your project dependencies.\n\n3. Then do `npm install react react-dom\
    \ --save`.\n\n4. This will install react and react DOM libraries (just like we\
    \ discussed above) and would mark them as “need-at-production” dependencies (that\
    \ is, we’ll need React and `ReactDOM` even when we’re shipping the application).\n\
    \n5. Finally, do `npm install webpack webpack-dev-server webpack-cli @babel/core\
    \ babel-loader @babel/preset-env @babel/preset-react html-webpack-plugin --save-dev`.\n\
    \n6. This will install all the `devDependencies`, the dependencies you need while\
    \ coding the application, but not on production. We’ll breakdown the need for\
    \ these dependencies now:\n\n   * **Webpack**: Webpack is a module bundler system.\
    \ Simply speaking, it combines various assets of yours (JS, CSS, and so on), so\
    \ that you can freely write your code in a maintainable way (i.e. clean and different\
    \ files) and could later automate the combination and compression of the code.\n\
    \   * `webpack-cli` enables webpack to perform this.\n   * `webpack-dev-server`\
    \ enables us to launch a server to see the output of the code.\n   * `html-webpack-plugin`\
    \ would allow us to dynamically generate an HTML page for react scripts to work\
    \ on. Don’t worry, we’ll be mostly working with JavaScript files, so we don’t\
    \ need to statically create HTML files anyway.\n   * `@babel` packages run the\
    \ JSX transformations into normal, executable JavaScript code (more on JSX below).\n\
    \n7. Once you do that, in your project directory in the command line, do `touch\
    \ .babelrc`.\n\n8. It’ll create a dotfile called `.babelrc` (notice the dot at\
    \ the front of the filename).\n\n9. Paste the following content inside it: `{\
    \ \"presets\": [\"@babel/preset-env\", \"@babel/preset-react\"] }`.\n\n10. This\
    \ tells babel to use the following presets, before working on the React code.\
    \ Simply speaking, it loads a bunch of pre-defined rules to babel about how it\
    \ should handle JSX.\n\n11. Finally, because webpack is the main bundler of our\
    \ project, we need to tell the webpack to let babel handle the steering wheel\
    \ on the appropriate files. Here’s how we do that:\n\n    * Create a file called\
    \ `webpack.config.js` in your project’s root, and write the following in it:\n\
    \n      ```javascript\n      const path = require('path');\n      const HtmlWebpackPlugin\
    \ = require('html-webpack-plugin');\n      module.exports = {\n        entry:\
    \ path.join(__dirname, 'src/index.js'),\n        output: {\n      ```\n"
