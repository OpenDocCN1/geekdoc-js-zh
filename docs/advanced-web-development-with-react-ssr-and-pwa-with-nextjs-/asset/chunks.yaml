    \ on the topics restricted to JavaScript, but you can always use this list to\
    \ learn more:\n\n1.  Destructuring\n\n2.  Spread operator\n\n3.  ES6 import/export\
    \ module syntax\n\n4.  Async/Await\n\n5.  Optional chaining in JavaScript\n\n\
    6.  Nullish Coalescing\n\n7.  Prototypal inheritance model\n\n8.  Hoisting/variable\
    \ scoping\n\n# Conclusion\n\nThis chapter covered some basic React concepts and\
    \ fundamental JavaScript knowledge. In the next chapter, we’ll be learning about\
    \ how to set up our development environment with React and using it effectively.\
    \ We’ll be exploring React basics and make our way up to server-side rendering\
    \ framework Next.js, and cover information about Progressive Web Apps eventually.\
    \ Hold tight for a code-train ride!\n\n# CHAPTER 2\n\n## Setting up React\n\n\
    In this chapter, we’ll see some common, and not so common ways to set up React\
    \ into your development workflow. We’ll start from the very basics, of which editor\
    \ you should probably go with, all the way to the best way for you to bootstrap\
    \ your React application, so that it matches your needs and is convenient for\
    \ you to take it to the production. Let’s go!\n\nSome people like to work with\
    \ **Integrated Development Environments** (**IDEs**) all the time. We’ll take\
    \ a different approach here. IDEs tend to get super heavy for things like web\
    \ development. Plus, IDEs abstract a lot of stuff, so you get to learn a lot less\
    \ than you expect. We’ll be using (and learning) command line, working with code\
    \ using light text editors and build great applications! Let’s proceed with the\
    \ chapter.\n\n### Structure\n\n*   Choosing a text editor\n\n*   Setting up Node\
    \ and NPM\n\n*   Ways to set up a React project\n\n*   Hello World with React\n\
    \n*   JSX\n\n*   Shifting to TypeScript for React\n\n### Objective\n\nWe’ll start\
    \ this chapter with a simple choice—choosing a text editor that you would like\
    \ to write the code in. We’ll then be moving on the installation and setting up\
    \ of the required technologies, which would help us explore the ways to set up\
    \ our first react project. We’ll also be exploring what JSX is and how it works.\
    \ Finally, we’ll shift our focus to TypeScript for React and stick with it throughout\
    \ the book, for a better type system and bug-free code.\n\n### Choosing a text\
    \ editor\n\nFirst things first -you need a place to write code. Here’s a list\
    \ of text editors that we recommend personally.\n\n#### #1 – VSCode\n\nThis is\
    \ the most popular text editor out right now and a major chunk of web developers\
    \ you find, would be using VSCode all the time. VSCode is fully customizable,\
    \ with tons of additional plugins to supercharge your productivity. It is cross-platform\
    \ (macOS/Linux/Windows) and you can get a stable binary for your platform here:\
    \ [https://code.visualstudio.com/#alt-downloads](https://code.visualstudio.com/#alt-downloads).\n\
    \n#### #2 – Sublime Text\n\nAnother great text editor is Sublime Text. If you’re\
    \ unhappy with VSCode, Sublime text can be the second choice. You can purchase\
    \ it, but you’re not forced to. Sublime Text allows you to use it for free for\
    \ a very long time, with a little popup coming to your screen every week or so\
    \ to upgrade. It also ships with a powerful package system and great themes. Download\
    \ it from here: [https://www.sublimetext.com/3](https://www.sublimetext.com/3).\n\
    \n#### #3 – Atom\n\nAtom is also a decent alternative, if you’re looking for text\
    \ editors. It does include a package manager, is fully customizable and free!\
    \ You can download the Atom text editor from here: [https://atom.io/](https://atom.io/).\n\
    \n### Setting up Node and NPM\n\nOnce your text editor is installed and is ready\
    \ (which should relatively take 5-10 minutes), it’s time to setup node and npm.\
    \ If you already have that on your system, you can skip this section. Node is\
    \ basically taking the JavaScript engine (a piece of code responsible for running\
    \ your written JavaScript on the machine) and putting it on your computer as a\
    \ local app, instead of embedding it inside just a web browser. And npm, is its\
    \ package manager to add and remove the packages and dependencies.\n"
  raw: "In the preceding example, reduce accepts a function thatis called every time\
    \ with two values: the accumulator, and the current value. Whatever you return\
    \ from the function, becomes the accumulator value for the next function call.\
    \ Optionally, you can pass the initial accumulator value as the second argument\
    \ to the `.reduce` function. This, if not present, would initialize the accumulator\
    \ with the first element in the array, and would start reducing the array from\
    \ the second value.\n\n# [Classes](#toc.xhtml_s10a)\n\nClasses in ES6 is merely\
    \ syntactic sugar for functions. JavaScript is not OOP. It follows the prototypal\
    \ inheritance model, and that’s what classes do as well. Although, the proposed\
    \ syntax makes it look very similar to OOP.\n\nHere’s an example of ES6 class:\n\
    \n`class ILoveNumbers {`\n\n`constructor(num) {`\n\n`this.anothernum = num`\n\n\
    `}`\n\n`getNum() {`\n\n`console.log(this.anothernum)`\n\n`}`\n\n`};`\n\n`class\
    \ IHateNumbers extends ILoveNumbers {`\n\n`constructor(num) {`\n\n`super(num**num)`\n\
    \n`this.num = num`\n\n`}`\n\n`getNum() {`\n\n`console.log(this.num)`\n\n`}`\n\n\
    `getNumFromParent() {`\n\n`console.log(super.getNum())`\n\n`}`\n\n`};`\n\n`let\
    \ obj = new IHateNumbers(5)`\n\n`obj.getNum() // 5`\n\n`obj.getNumFromParent()\
    \ // 3125`\n\nSome important points to note aboutthe preceding code:\n\n1.  Here\
    \ we created a simple class called `ILoveNumbers`, which just stores a number.\n\
    \n2.  We created another class,`IHateNumbers,` which extends from our previous\
    \ class. “`Extending`” in class-based syntax merely means that you’re adding the\
    \ parent class (function) to the prototypal chain of the current class (function).\n\
    \n3.  We make use of a special keyword, called `super`. Using `super,` we can\
    \ access the parent class. Remember, when using super in a method, super refers\
    \ to the **prototype chain of the object** it was defined with. Thismeans, if\
    \ I change the prototype chain of `IHateNumbers` to something else, the `super.getFav()`\
    \ should not work as expected. Consider the following code:\n\n    `class C1{\
    \ method() { return 1 } }`\n\n    `class C2 extends C1{ method() { return super.method()\
    \ } }`\n\n    `class C3{ method() { return 3 } }`\n\n    `class C4 extends C3{\
    \ method() { return 4 } }`\n\n    `const obj = new C4`\n\n    `console.log(obj.method())\
    \ // outputs 4`\n\n    `C4.prototype.method = C2.prototype.method`\n\n    `console.log(obj.method())\
    \ // outputs 1`\n\n4.  Here you can clearly see that `super.method()` does not\
    \ call the method of `C3.`, Instead, it calls the method of `C1`. However, if\
    \ you would have defined the method of `C4` to return `super.method()`, it would\
    \ call the method of `C3`.\n\n# [Closures](#toc.xhtml_s11a)\n\nClosure is a fundamental\
    \ concept implemented in JavaScript that is extremely powerful and beautiful at\
    \ the same time. To define closure in one line,:*the function remembers*. We have\
    \ a common understanding as a Computer Scientist that when functions return, they\
    \ remove all the local variable information associated with them. This is changed\
    \ when you use a closure. For example, consider the following piece of code:\n\
    \n`function a() {`\n\n`let value = 1`\n\n`return () => value++`\n\n`}`\n\n`const\
    \ func = a()`\n\n`func() // 1`\n\n`func() // 2`\n\n`func() // 3`\n\nIn the preceding\
    \ function, we can see that although `value` is a local variable, it is not destroyed\
    \ when the execution of function `a` is completed. Instead, the function remembers.\n\
    \n# [More JavaScript topics](#toc.xhtml_s12a)\n\nAs you proceed through this book,\
    \ you’ll realize you would always need to use a lot more JavaScript than React\
    \ as a framework itself. Although we’ve discussed some common JavaScript topics\
    \ above, wesuggest reading more about the following ones, if you’re interested\
    \ in JavaScript’s basic solidification and foundation. Since this is not a core\
    \ JS book, we’ll not be focusing a lot on the topics restricted to JavaScript,\
    \ but you can always use this list to learn more:\n\n1.  Destructuring\n\n2. \
    \ Spread operator\n\n3.  ES6 import/export module syntax\n\n4.  Async/Await\n\n\
    5.  Optional chaining in JavaScript\n\n6.  Nullish Coalescing\n\n7.  Prototypal\
    \ inheritance model\n\n8.  Hoisting/variable scoping\n\n# [Conclusion](#toc.xhtml_s13a)\n\
    \nThis chapter covered some basic React concepts and fundamental JavaScript knowledge.\
