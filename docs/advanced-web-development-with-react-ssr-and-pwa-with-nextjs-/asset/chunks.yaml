    现在还有一个问题：如果 `setX` 不是异步的，这意味着如果变量的下一个状态依赖于前一个状态，我们就不能直接在 `setX` 内部使用 `X`！幸运的是，React
    允许你在 `setX` 中传入一个函数，该函数的第一个参数保证是最新的值。让我们通过这个例子来进一步了解：


    ```

    const App: React.FC = props => {


    const [counter, setCounter] = useState(0)


    function add() {


    setCounter(counter => counter + 1)


    }


    function sub() {


    setCounter(counter => counter - 1)


    }


    return <>


    <p>{ counter }</p>


    <button onClick={add}>++</button>


    <button onClick={sub}>--</button>


    </>


    }

    ```


    这里需要注意几点：


    1.  我们可以使用匿名的 JSX 元素（即 `<>` 和 `</>`）——这不会在 DOM 结构中显示。


    2.  我们可以在 `setX` 中传入一个函数，而不是更新后的值。如果你传入一个函数，React 会使用最新的状态变量值调用该函数，然后该函数返回的值将被设置为最新的状态。


    一个通用的经验法则是：如果你的状态更新涉及基于前一个状态的结果，请使用函数参数的方式；否则，你可以直接传入新值。


    # useStatecallback


    在基于类的组件中，`this.setState` 有一个回调函数，当你希望等待状态变量更新后再触发某个操作时可以使用它。在 hooks 中，这并不那么直接，不过你可以使用另一个
    hook 来实现相同的效果。现在让我们来看看这个 hook。


    # useEffect


    这个 hook 允许你在某些内容*变化*时执行一段代码。可以把 `useEffect` 看作是 React 内置基础设施上的一个自定义监听实现。


    下面是一个非常简单的 `useEffect` 示例：


    ```

    const App: React.FC = props => {


    const [counter, setCounter] = useState(0)


    useEffect(() => {


    document.title = ''Counter is at '' + counter


    })


    return <>


    <p>{ counter }</p>


    <button onClick={() =>setCounter(c => c + 1)}>Increment</button>


    </>


    }

    ```


    好的，这里我们可以看到，我们通过向 `useEffect` 传入一个函数来使用它。这个函数会在每次 React 渲染（或重新渲染）我们的组件时执行。这个函数最终将文档标题设置为我们的计数器值。在函数中，你总是能获取到状态变量的最新值。这是因为
    React 根本不会改变状态变量！在使用函数组件和 hooks 时，React 从不改变状态。即使我们使用 `const` 关键字声明简单的字符串/数值，这一点也相当明显。相反，每当
    React 重新渲染我们的组件时，`useState()` 函数会将新更新的状态返回给状态变量，而 `useEffect` 函数会在每次渲染时调用传入的函数。


    # useEffect 依赖项


    你很快就会发现 `useEffect` 可能会对性能造成一定负担，因为即使没有任何变化，它也会在每次渲染时反复运行我们传入的函数。让我们看看下面的例子：


    ```

    const [counter1, setCounter1] = useState(0)


    const [counter2, setCounter2] = useState(0)


    useEffect(() => {


    document.title = ''Counter is at '' + counter1


    console.log(''Effect called'')


    })


    return <>


    <span>{ counter1 }</span>&nbsp;


    <span>{ counter2 }</span>


    <button onClick={() => setCounter1(c => c + 1)}>Increment Counter 1</button>


    <button onClick={() => setCounter2(c => c + 1)}>Increment Counter 2</button>


    </>

    ```


    上述代码对应的输出：


    ![](img/image8.jpg)


    **图 3.4**


    显然，我们从未更新 counter1，但 React 仍然在每次重新渲染时调用我们的 `useEffect` 函数。我们可以做得更好。我们可以告诉 React，某个
    effect 只使用一组特定的变量（以数组形式传入），只有当这些变量发生变化时，React 才应该再次调用 effect 函数。否则，调用就没有意义（因为状态变量的值没有变化）。为此，我们可以向
    `useEffect` hook 传入第二个参数，即该 effect 的依赖项。让我们再次看同一个例子，但这次将 counter1 作为依赖项添加进去：


    ```

    useEffect(() => {


    document.title = ''Counter is at '' + counter1


    console.log(''Effect called'')


    }, [counter1])

    ```


    现在对应的输出是：


    ![](img/image6.jpg)


    **图 3.5**


    你看，现在我们只看到一次 **Effect called**，因为 effect 在首次渲染后初始执行一次。除此之外，只要 counter1 没有被修改，effect
    函数就不会运行。


    # useEffect 清理


    `useEffect` hook 为你提供了一个选项，可以在组件卸载或重新渲染（并再次调用 `useEffect`）之前，清理你想要移除的任何订阅。也就是说，在前面的例子中，你可以使用
    `useEffect` 的清理函数，在组件新状态渲染时调用一个函数。让我们看一个例子来更好地理解：


    ```

    const App: React.FC = props => {


    const [counter, setCounter] = useState(0)


    useEffect(() => {


    document.title = ''Counter is at '' + counter


    return function cleanup() {


    console.log(''This will fire whenever this function gets called next/the component
    unmounts. Counter is ${counter} right now'')


    }


    }, [counter])


    return <>


    <span>{ counter }</span>


    <button onClick={() =>setCounter(c => c + 1)}>Increment Counter</button>


    </>


    }

    ```


    初始运行这段代码时，控制台不会显示任何内容，如下所示：


    ![](img/image12.jpg)


    **图 3.6**


    但一旦我点击 **Increment** 计数器，控制台就会出现一些有趣的内容：


    ![](img/image5.jpg)


    **图 3.7**


    好的！我们看到屏幕上计数器实际是 1。但在控制台中，我们收到的日志显示计数器值为 0。我们遗漏了什么吗？这是 bug 吗？实际上不是，这是预期的行为。


    你可以看到，`cleanup` 函数的目的是在*新实例*创建之前移除你想要清除的任何内容。因此，React 需要调用旧 `useEffect` 函数的 `cleanup`
    函数，以便它能够访问旧的订阅变量及其环境。React 显然不应该触发最新 `useEffect` 函数的 `cleanup` 函数，因为它还不需要清理，对吧？


    # useCallback


    还记得我们如何在 `useEffect` hook 中传入依赖项数组，让 React 知道我们关心的变量吗？这可以让 React 在不需要时避免反复运行 effect
    函数。但是，你在 `useEffect` 函数内部调用的函数呢？很容易遗漏像这样的情况：


    ```

    const [result, setResult] = useState(null)


    const [url, setUrl] = useState(null)


    async function someAsyncOperation() {


    // 更多代码


    return await fetch(url)


    }


    useEffect(() => {


    // 一些长代码…


    someAsyncOperation().then(r => {


    setResult(r)


    })


    }, [])

    ```


    哎呀！你能指出这段代码中可能出现的问题吗？你看，虽然从 effect 函数来看似乎不需要依赖项（因为我们没有直接使用任何状态变量），但仔细一看，我们实际上在
    `someAsyncOperation` 函数内部使用了状态变量 `url`！这意味着，如果某处调用了 `setResult`，effect 函数不会重新运行，因此不会重新获取
    URL，从而产生有 bug 的输出。


