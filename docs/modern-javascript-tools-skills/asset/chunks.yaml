  trans: "\n嗯……这不对。地点已经添加了，但国家没有显示。问题显然不在 HTML 表格代码，因为第一行已经填充了国家单元格，所以 JavaScript\
    \ 端一定发生了什么。打开 `app.js` 并在第 58 行添加一个断点，代码内容是：\n\n```\naddPlace(city, country);\n\
    ```\n\n重启调试会话并尝试再次添加新地点。执行将在你设置的断点处暂停。开始将鼠标悬停在相关变量上。你也可以将表达式添加到监视（watch）面板中，如下所示：\n\
    \n![发现国家 bug](img/152442838920-country-bug-found.png)\n\n如你所示，`country` 变量是 `undefined`，但\
    \ `city` 变量是有值的。如果你查看在监视面板中设置的 jQuery 选择器表达式，你会发现 `#country` 选择器没有返回任何。这意味着它不存在于\
    \ DOM 中。前往 `index.html` 进行验证。\n\n哎！如果你查看定义国家输入框的第 59 行，发现它缺少 `id` 属性。你需要像这样添加一个：\n\
    \n```\n<input type=\"text\" placeholder=\"Enter Country\" name=\"country\" id=\"\
    country\">\n```\n\n重启调试会话并尝试添加新地点。\n\n![修复国家 bug](img/152442839121-country-fixed.png)\n\
    \n现在可以工作了！干得好，在没有 `console.log` 的情况下修复另一个 bug。现在让我们处理最后一个 bug。\n\n## 调试客户端路由\n\
    \n点击导航栏中的 *Convert* 链接。你应该会被带到此视图执行快速转换：\n\n![转换货币](img/152442839322-convert-currency.png)\n\
    \n那个运行得良好。那里没有 bug。\n\n实际上是有的，而且它们与表单无关。要发现它们，请刷新页面。\n\n一旦你点击刷新，用户就会被导航回 `/`，即应用的根目录。这显然是一个路由问题，Vanilla\
    \ Router 软件包本应该处理它。回到 `app.js` 并寻找这一行：\n\n```\nrouter.navigateTo(window.location.path);\n\
    ```\n\n这段代码的作用是根据提供的 URL 将用户路由到正确的页面。但为什么它不起作用呢？让我们在这里添加一个断点，然后导航回 `/convert`\
    \ URL 并再次尝试刷新页面。\n\n一旦你刷新，编辑器就会在断点处暂停。鼠标悬停在表达式 `windows.location.path` 上。弹出的窗口显示值为\
    \ `undefined`。让我们进入调试控制台并输入下面的表达式：\n\n![导航错误](img/15244283923-navigation-error.png)\n\
    \n等一下！调试控制台刚刚给了我们正确的表达式。它应该是 `window.location.pathname`。修正该行代码，移除断点并重启调试会话。\n\n\
    导航到 `/convert` URL 并刷新。页面应该加载正确的路径。太棒了！\n\n这是我们要消灭的最后一个 bug 了，但我确实建议你在调试会话中继续尝试。设置新的断点来检查其他变量。例如，查看\
    \ `router('/convert')` 函数中的 `response` 对象。这演示了在处理新的 REST 端点时，如何使用调试会话来确定 API 请求返回的数据结构。\n\
    \n![检查响应](img/152442840424-response-inspect.png)\n\n## 总结\n\n现在我们已经到了本教程的末尾，你应该为自己学习了编程中的一项重要技能感到自豪。学习如何正确调试代码将帮助你更快修复错误。然而，你应该意识到，这篇文章仅仅触及了可能性的一角，你应该查看\
    \ VS Code 完整的[调试文档](https://code.visualstudio.com/docs/editor/debugging)。在这里你将找到更多关于特定命令的详细信息，以及我们还没有涵盖的断点类型，例如[条件断点](https://code.visualstudio.com/docs/editor/debugging#_conditional-breakpoints)。\n\
    \n我希望从现在起你停止使用 `console.log` 来调试，而是使用 VS Code 像专业人士一样调试 JavaScript！\n\n# 第 6 章：介绍\
    \ Axios，一个流行的基于 Promise 的 HTTP 客户端\n\n### 作者：Nilson Jacques\n\n[Axios](https://www.npmjs.com/package/axios)\
    \ 是一个流行的基于 Promise 的 HTTP 客户端，拥有易于使用的 API，并可以在浏览器和 Node.js 中使用。\n\n发送 HTTP 请求来获取或保存数据是客户端\
    \ JavaScript 应用程序最常见的任务之一。第三方库——尤其是 jQuery——长期以来一直是与冗冗的浏览器 API 交互的流行方式，并抽象了任何跨浏览器差异。\n\
    \n随着人们逐渐放弃 jQuery 而转向改进的原生 DOM API，或像 React 和 Vue.js 等前端 UI 库，纯粹为了 `$.ajax` 功能而包含它已经意义不大了。\n\
    \n让我们看看如何在代码中开始使用 Axios，并看看一些让它在 JavaScript 开发者中广受欢迎的特性。\n\n## Axios vs Fetch\n\
    \n正如你可能意识到的，现代浏览器内置了较新的 [Fetch API](https://www.sitepoint.com/introduction-to-the-fetch-api/)，那么为什么不直接用它呢？两者之间有许多差异，许多人认为这是\
    \ Axios 的优势所在。\n\n其中一个差异是两个库处理 [HTTP 错误](https://en.wikipedia.org/List_of_HTTP_status_codes)的方式。使用\
    \ Fetch 时，如果服务器返回 4xx 系列错误，不会触发 `catch()`。而 Axios 则会拒绝请求。\n\n另一个让初学 API 的开发者困惑的小差异是，Fetch\
    \ 在发送请求时不会自动发送 Cookie 到服务器。你需要显式地传递一个选项来包含它们。Axios 可以做到。\n\n对某些人来说障碍的是上传/下载的进度更新。由于\
    \ Axios 是构建在旧的 XHR API 之上的，你可以注册 `onUploadProgress` 和 `onDownloadProgress` 回调函数，在你的应用中显示完成百分比。目前\
    \ Fetch 不支持。\n\n最后，Axios 可以在浏览器和 Node.js 中使用。这有助于在浏览器和后端之间共享 JavaScript 代码，或进行服务端渲染。\n\
    \n#### Node 的 Fetch API\n\n虽然有[版本的 Fetch API](https://www.npmjs.com/package/isomorphic-fetch)，但我认为，Axios\
    \ 提供的其他功能使其更有优势。\n\n## 安装\n\n正如你预期的，安装 Axios 的常用方法是通过 npm 包管理器：\n\n```\nnpm i\
    \ axios\n```\n\n并在需要的地方引入它：\n\n```\n// ES2015 样式导入\nimport axios from 'axios';\n\
    \n// Node.js 样式 require\nconst axios = require('axios');\n```\n\n如果你没有使用任何模块打包器（例如\
    \ webpack），那么你始终可以通过传统方式从 CDN 引入库：\n\n```\n<script src=\"https://unpkg.com/axios/dist/axios.min.js\"\
    ></script>\n```\n\n### 浏览器支持\n\nAxios 支持所有现代浏览器以及 Internet Explorer 8+。\n\n##\
    \ 发送请求\n\n类似于 jQuery 的 `$.ajax` 函数，你可以通过向 Axios 传递配置对象来发送任何类型的 HTTP 请求：\n\n```\n\
    axios({\n  method: 'post',\n  url: '/login',\n  data: {\n    user: 'brunos',\n\
    \    lastName: 'ilovenodejs'\n  }\n});\n```\n\n在这里，我们告诉 Axios 我们想要使用哪种 HTTP 方法（例如\
    \ GET/POST/DELETE 等）以及向哪个 URL 发起请求。\n\n我们还以简单的 JavaScript 键值对的形式提供了一些随请求发送的数据。默认情况下，Axios\
    \ 将其序列化为 JSON 并作为请求体发送。\n\n### 请求选项\n"
- fmt: "\nThere are a whole bunch of [additional options](https://github.com/axios/axios#request-config)\
    \ you can pass when making a request, but here are the most common ones:\n\n*\
    \ `baseUrl`: if you specify a base URL, it’ll be prepended to any relative URL\
    \ you use.\n* `headers`: an object of key/value pairs to be sent as headers.\n\
    * `params`: an object of key/value pairs that will be serialized and appended\
    \ to the URL as a query string.\n* `responseType`: if you’re expecting a response\
    \ in a format other than JSON, you can set this property to `arraybuffer`, `blob`,\
    \ `document`, `text`, or `stream`.\n* `auth`: passing an object with `username`\
    \ and `password` fields will use these credentials for HTTP Basic auth on the\
    \ request.\n\n## Convenience methods\n\nAlso like jQuery, there are shortcut methods\
    \ for performing different types of request.\n\nThe `get`, `delete`, `head` and\
    \ `options` methods all take two arguments: a URL, and an optional config object.\n\
    \n```\naxios.get('/products/5');\n```\n\nThe `post`, `put`, and `patch` methods\
    \ take a data object as their second argument, and an optional config object as\
    \ the third:\n\n```\naxios.post(\n  '/products',\n  { name: 'Waffle Iron', price:\
    \ 21.50 },\n  { options }\n);\n```\n\n## Receiving a Response\n\nOnce you make\
    \ a request, Axios returns a promise that will resolve to either a response object\
    \ or an error object.\n\n```\naxios.get('/product/9')\n  .then(response => console.log(response))\n\
    \  .catch(error => console.log(error));\n```\n\n### The response object\n\nWhen\
    \ the request is successful, your `then()` callback will receive a response object\
    \ with the following properties:\n\n* `data`: the payload returned from the server.\
    \ By default, Axios expects JSON and will parse this back into a JavaScript object\
    \ for you.\n* `status`: the HTTP code returned from the server.\n* `statusText`:\
    \ the HTTP status message returned by the server.\n* `headers`: all the headers\
    \ sent back by the server.\n* `config`: the original request configuration.\n\
    * `request`: the actual `XMLHttpRequest` object (when running in a browser).\n\
    \n### The error object\n\nIf there’s a problem with the request, the promise will\
    \ be rejected with an error object containing at least some of the following properties:\n\
    \n* `message`: the error message text.\n* `response`: the response object (if\
    \ received) as described in the previous section.\n* `request`: the actual `XMLHttpRequest`\
    \ object (when running in a browser).\n* `config`: the original request configuration.\n\
    \n## Transforms and Interceptors\n\nAxios provides a couple of neat features inspired\
    \ by [Angular’s $http library](https://docs.angularjs.org/api/ng/service/$http).\
    \ Although they appear similar, they have slightly different use cases.\n\n###\
    \ Transforms\n\nAxios allows you to provide functions to transform the outgoing\
    \ or incoming data, in the form of two configuration options you can set when\
    \ making a request: `transformRequest` and `transformResponse`. Both properties\
    \ are arrays, allowing you to chain multiple functions that the data will be passed\
    \ through.\n\nAny functions passed to `transformRequest` are applied to PUT, POST\
    \ and PATCH requests. They receive the request data, and the `headers` object\
    \ as arguments and must return a modified data object.\n\n```\nconst options =\
    \ {\n  transformRequest: [\n    (data, headers) => {\n      // do something with\
    \ data\n      return data;\n    }\n  ]\n}\n```\n\nFunctions can be added to `transformResponse`\
    \ in the same way, but are called only with the response data, and before the\
    \ response is passed to any chained `then()` callbacks.\n\nSo what could we use\
    \ transforms for? One potential use case is dealing with an API that expects data\
    \ in a particular format — say XML or even CSV. You could set up a pair of transforms\
    \ to convert outgoing and incoming data to and from the format the API requires.\n\
    \nIt’s worth noting that Axios’ default `transformRequest` and `transformResponse`\
    \ functions transform data to and from JSON, and specifying your own transforms\
    \ will override these.\n\n### Interceptors\n\nWhile transforms let you modify\
    \ outgoing and incoming data, Axios also allows you to add functions called [interceptors](https://github.com/axios/axios#interceptors).\
    \ Like transforms, these functions can be attached to fire when a request is made,\
    \ or when a response is received.\n\n```\n// Add a request interceptor\naxios.interceptors.request.use((config)\
    \ => {\n    // Do something before request is sent\n    return config;\n  }, (error)\
    \ => {\n    // Do something with request error\n    return Promise.reject(error);\n\
    \  });\n\n// Add a response interceptor\naxios.interceptors.response.use((response)\
    \ => {\n    // Do something with response data\n    return response;\n  }, (error)\
    \ => {\n    // Do something with response error\n    return Promise.reject(error);\n\
    \  });\n```\n\nAs you might have noticed from the examples above, interceptors\
    \ have some important differences from transforms. Instead of just receiving the\
    \ data or headers, interceptors receive the full request config or response object.\n\
    \nWhen creating interceptors, you can also choose to provide an error handler\
    \ function that allows you to catch any errors and deal with them appropriately.\n\
    \nRequest interceptors can be used to do things such as [retrieve a token from\
    \ local storage and send with all requests](https://www.npmjs.com/package/axios-token-interceptor),\
    \ while a response interceptor could be used to [catch 401 responses and redirect\
    \ to a login page](https://gist.github.com/yajra/5f5551649b20c8f66aec48549ef5cf).\n\
    \n## Third-party Add-ons\n\nBeing a popular library, Axios benefits from an ecosystem\
    \ of third-party libraries that extend its functionality. From interceptors to\
    \ testing adaptors to loggers, there’s quite a variety available. Here are a few\
    \ that I think you may find useful:\n\n* [axios-mock-adaptor](https://github.com/ctimmerm/axios-mock-adapter):\
    \ allows you to easily mock requests to facilitate testing your code.\n* [axios-cache-plugin](https://github.com/jin5354/axios-cache-plugin):\
    \ a wrapper for selectively caching GET requests.\n* [redux-axios-middleware](https://github.com/svrcekmichal/redux-axios-middleware):\
    \ if you’re a Redux user, this middleware provides a neat way to dispatch Ajax\
    \ requests with plain old actions.\n\nA list of more [Axios add-ons and extentions](https://github.com/axios/axios/blob/master/ECOSYSTEM.md)\
    \ is available on the Axios GitHub repo.\n\nIn summary, Axios has a lot to recommend\
    \ it. It has a straightforward API, with helpful shortcut methods that will be\
    \ familiar to anyone who’s used jQuery before. Its popularity, and the availability\
    \ of a variety of third-party add-ons, make it a solid choice for including in\
    \ your apps, whether front end, back end, or both.\n"
  raw: "There are a whole bunch of [additional options](https://github.com/axios/axios#request-config)\
    \ you can pass when making a request, but here are the most common ones:\n\n*\
    \   `baseUrl`: if you specify a base URL, it’ll be prepended to any relative URL\
    \ you use.\n\n*   `headers`: an object of key/value pairs to be sent as headers.\n\
    \n*   `params`: an object of key/value pairs that will be serialized and appended\
    \ to the URL as a query string.\n\n*   `responseType`: if you’re expecting a response\
    \ in a format other than JSON, you can set this property to `arraybuffer`, `blob`,\
    \ `document`, `text`, or `stream`.\n\n*   `auth`: passing an object with `username`\
    \ and `password` fields will use these credentials for HTTP Basic auth on the\
    \ request.\n\n### Convenience methods\n\nAlso like jQuery, there are shortcut\
    \ methods for performing different types of request.\n\nThe `get`, `delete`, `head`\
    \ and `options` methods all take two arguments: a URL, and an optional config\
    \ object.\n\n```\naxios.get('/products/5');\n```\n\nThe `post`, `put`, and `patch`\
    \ methods take a data object as their second argument, and an optional config\
    \ object as the third:\n\n```\naxios.post(\n  '/products',\n  { name: 'Waffle\
    \ Iron', price: 21.50 },\n  { options }\n);\n```\n\n## Receiving a Response\n\n\
    Once you make a request, Axios returns a promise that will resolve to either a\
    \ response object or an error object.\n\n```\naxios.get('/product/9')\n  .then(response\
    \ => console.log(response))\n  .catch(error => console.log(error));\n```\n\n###\
    \ The response object\n\nWhen the request is successful, your `then()` callback\
    \ will receive a response object with the following properties:\n\n*   `data`:\
    \ the payload returned from the server. By default, Axios expects JSON and will\
    \ parse this back into a JavaScript object for you.\n\n*   `status`: the HTTP\
    \ code returned from the server.\n\n*   `statusText`: the HTTP status message\
    \ returned by the server.\n\n*   `headers`: all the headers sent back by the server.\n\
    \n*   `config`: the original request configuration.\n\n*   `request`: the actual\
    \ `XMLHttpRequest` object (when running in a browser).\n\n### The error object\n\
    \nIf there’s a problem with the request, the promise will be rejected with an\
    \ error object containing at least some of the following properties:\n\n*   `message`:\
    \ the error message text.\n\n*   `response`: the response object (if received)\
    \ as described in the previous section.\n\n*   `request`: the actual `XMLHttpRequest`\
    \ object (when running in a browser).\n\n*   `config`: the original request configuration.\n\
    \n## Transforms and Interceptors\n\nAxios provides a couple of neat features inspired\
    \ by [Angular’s $http library](https://docs.angularjs.org/api/ng/service/$http).\
    \ Although they appear similar, they have slightly different use cases.\n\n###\
    \ Transforms\n\nAxios allows you to provide functions to transform the outgoing\
    \ or incoming data, in the form of two configuration options you can set when\
    \ making a request: `transformRequest` and `transformResponse`. Both properties\
    \ are arrays, allowing you to chain multiple functions that the data will be passed\
    \ through.\n\nAny functions passed to `transformRequest` are applied to PUT, POST\
    \ and PATCH requests. They receive the request data, and the headers object as\
    \ arguments and must return a modified data object\n\n```\nconst options = {\n\
    \  transformRequest: [\n    (data, headers) => {\n      // do something with data\n\
    \      return data;\n    }\n  ]\n}\n```\n\nFunctions can be added to `transformResponse`\
    \ in the same way, but are called only with the response data, and before the\
    \ response is passed to any chained `then()` callbacks.\n\nSo what could we use\
    \ transforms for? One potential use case is dealing with an API that expects data\
    \ in a particular format — say XML or even CSV. You could set up a pair of transforms\
    \ to convert outgoing and incoming data to and from the format the API requires.\n\
    \nIt’s worth noting that Axios’ default `transformRequest` and `transformResponse`\
    \ functions transform data to and from JSON, and specifying your own transforms\
    \ will override these.\n\n### Interceptors\n\nWhile transforms let you modify\
    \ outgoing and incoming data, Axios also allows you to add functions called [interceptors](https://github.com/axios/axios#interceptors).\
    \ Like transforms, these functions can be attached to fire when a request is made,\
    \ or when a response is received.\n\n```\n// Add a request interceptor\naxios.interceptors.request.use((config)\
    \ => {\n    // Do something before request is sent\n    return config;\n  }, (error)\
    \ => {\n    // Do something with request error\n    return Promise.reject(error);\n\
    \  });\n\n// Add a response interceptor\naxios.interceptors.response.use((response)\
    \ => {\n    // Do something with response data\n    return response;\n  }, (error)\
    \ => {\n    // Do something with response error\n    return Promise.reject(error);\n\
    \  });\n```\n\nAs you might have noticed from the examples above, interceptors\
    \ have some important differences from transforms. Instead of just receiving the\
    \ data or headers, interceptors receive the full request config or response object.\n\
    \nWhen creating interceptors, you can also choose to provide an error handler\
    \ function that allows you to catch any errors and deal with them appropriately.\n\
    \nRequest interceptors can be used to do things such as [retrieve a token from\
    \ local storage and send with all requests](https://www.npmjs.com/package/axios-token-interceptor),\
    \ while a response interceptor could be used to [catch 401 responses and redirect\
    \ to a login page](https://gist.github.com/yajra/5f5551649b20c8f668aec48549ef5c1f)\
    \ for authorization.\n\n## Third-party Add-ons\n\nBeing a popular library, Axios\
    \ benefits from an ecosystem of third-party libraries that extend its functionality.\
    \ From interceptors to testing adaptors to loggers, there’s quite a variety available.\
    \ Here are a few that I think you may find useful:\n\n*   [axios-mock-adaptor](https://github.com/ctimmerm/axios-mock-adapter):\
    \ allows you to easily mock requests to facilitate testing your code.\n\n*   [axios-cache-plugin](https://github.com/jin5354/axios-cache-plugin):\
    \ a wrapper for selectively caching GET requests.\n\n*   [redux-axios-middleware](https://github.com/svrcekmichal/redux-axios-middleware):\
    \ if you’re a Redux user, this middleware provides a neat way to dispatch Ajax\
    \ requests with plain old actions.\n\nA list of more [Axios add-ons and extentions](https://github.com/axios/axios/blob/master/ECOSYSTEM.md)\
    \ is available on the Axios GitHub repo.\n\nIn summary, Axios has a lot to recommend\
    \ it. It has a straightforward API, with helpful shortcut methods that will be\
    \ familiar to anyone who’s used jQuery before. Its popularity, and the availability\
    \ of a variety of third-party add-ons, make it a solid choice for including in\
    \ your apps, whether front end, back end, or both."
