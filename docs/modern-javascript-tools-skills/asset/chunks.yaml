    测试是软件开发的关键部分，特别是对于处于生产阶段的项目。你可以获取 JavaScript 测试的概述，并在我们的指南中了解更多不同类型的测试——[JavaScript
    测试：单元测试与集成测试](https://www.sitepoint.com/javascript-testing-unit-functional-integration/)。以下是一些常用的
