    \     }\n+         ]\n+       }\n      ]\n    }\n  }\n```\n\n使用此命令下载一个[测试图像](https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png)：\n\
    \n```\ncurl https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png\
    \ --output src/code.png\n```\n\n使用 `Ctrl` + `C` 和 `npm run develop` 重启构建，现在你可以像模块一样导入了！\n\
    \n`src/index.js`\n\n```\n import { groupBy } from 'lodash-es'\n  import people\
    \ from './people'\n\n  import './style.scss'\n+ import './image-example'\n\n \
    \ ...\n```\n\n`src/image-example.js`\n\n```\nimport codeURL from \"./code.png\"\
    \n\nconst img = document.createElement(\"img\")\nimg.src = codeURL\nimg.style\
    \ = \"background: #2B3A42; padding: 20px\"\nimg.width = 32\ndocument.body.appendChild(img)\n\
    ```\n\n这将包含一个图像，其中 `src` 属性包含了图像自身的 [data URI](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/Data_URIs)：\n\
    \n```\n<img src=\"data:image/png;base64,iVBO...\" style=\"background: #2B3A42;\
    \ padding: 20px\" width=\"32\">\n```\n\n我们 CSS 中的背景图像也由 `file-loader` 处理。\n\n\
    `src/style.scss`\n\n```\n $bluegrey: #2b3a42;\n\n  pre {\n    padding: 8px 16px;\n\
    -   background: $bluegrey;\n+   background: $bluegrey url(\"code.png\") no-repeat\
    \ center center / 32px 32px;\n    color: #e1e6e9;\n    font-family: Menlo, Courier,\
    \ monospace;\n    font-size: 13px;\n    line-height: 1.5;\n    text-shadow: 0\
    \ 1px 0 rgba(23, 31, 35, 0.5);\n    border-radius: 3px;\n  }\n```\n\n每个单独出现的变量名\
    \ (`varName`)、函数名 (`funcName()`)、类名 (`ClassName`)、路径名 (`/path.to.xxx`)、命令名 (`cmdname`)\
    \ 以及以及它们的语句或表达式 (`ClassName.funcName(var1 + var2, \"cmd0 arg1\")`) 都需要反引号。如果上面的内容是加粗的\
    \ (****) 或斜体的 (**)，请删除星号并添加反引号。\n\n代码块由三个反引号包围。\n\n### 为什么要这样做？\n\n我在这里不会深入探讨这个话题，但有几个原因值得考虑：\n\
    \n*   你可能想要包含在项目中的 JavaScript 组件可能依赖于其他资源才能正常运行（HTML、CSS、图像、SVG）。如果这些内容都能打包在一起，那么导入和使用它们将简单得多。\n\
    \n*   死代码消除：当 JS 组件不再被你的代码导入时，CSS 也也不再被导入。生成的包将只包含发挥作用的代码。\n\n*   CSS Modules：CSS\
    \ 的全局命名空间使得你很难确定对 CSS 的更改是否会产生任何副作用。[CSS modules](https://github.com/css-modules/css-modules)\
    \ 通过让 CSS 默认变为局部的，并暴露可以在 JavaScript 中引用的唯一类名来改变这一点。\n\n*   通过巧妙的方式打包/拆分代码来减少 HTTP\
    \ 请求数。\n\n（注：由于提供的原文后部分存在大量重复的文本，已根据您的“不要重复输出原文”原则进行了去重处理，仅保留核心逻辑部分的翻译。）\n\n"
