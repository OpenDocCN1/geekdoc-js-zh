    \      <div class=\"ui submit primary button\">Add Place</div</div></div>\n  \
    \  </div>\n  </form>\n  <br>\n  <div id=\"places-table\"></div>\n</script>\n\n\
    <!-- Places Table Template -->\n<script id=\"places-table-template\" type=\"text/x-handlebars-template\"\
    >\n  <table class=\"ui celled striped table\">\n    <thead>\n      <tr>\n    \
    \    <th>Id</th>\n        <th>City</th>\n        <th>Country</th>\n        <th>NumType</th>\n\
    \      </tr>\n    </thead>\n    <tbody>\n      {{#each places}}\n      <tr>\n\
