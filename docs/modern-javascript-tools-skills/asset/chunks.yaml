    \ as necessary:\n\n*   `html` — compiled static HTML files\n\n*   `images` — compressed\
    \ images\n\n*   `js` — a single concatenated and minified JavaScript file\n\n\
    *   `css` — a single compiled and minified CSS file\n\nYour project will almost\
    \ certainly be different but this structure is used for the examples below.\n\n\
    #### Following Along on Unix\n\nIf you're on a Unix-based system and you just\
    \ want to follow along with the tutorial, you can recreate the folder structure\
    \ with the following command:\n\n```\nmkdir -p src/{html,images,js,scss} build/{html,images,js,css}\
    \ \n```\n\n## Step 4: Install Gulp Locally\n\nYou can now install Gulp in your\
    \ project folder using the command:\n\n```\nnpm install gulp --save-dev\n```\n\
    \nThis installs Gulp as a development dependency and the `\"devDependencies\"\
    ` section of `package.json` is updated accordingly. We’ll presume Gulp and all\
    \ plugins are development dependencies for the remainder of this tutorial.\n\n\
    ### Alternative Deployment Options\n\nDevelopment dependencies are not installed\
    \ when the `NODE_ENV` environment variable is set to `production` on your operating\
    \ system. You would normally do this on your live server with the Mac/Linux command:\n\
    \n```\nexport NODE_ENV=production\n```\n\nOr on Windows:\n\n```\nset NODE_ENV=production\n\
    ```\n\nThis tutorial presumes your assets will be compiled to the `build` folder\
    \ and committed to your Git repository or uploaded directly to the server. However,\
    \ it may be preferable to build assets on the live server if you want to change\
    \ the way they are created. For example, HTML, CSS and JavaScript files are minified\
    \ on production but not development environments. In that case, use the `--save`\
    \ option for Gulp and all plugins, i.e.\n\n```\nnpm install gulp --save\n```\n\
    \nThis sets Gulp as an application dependency in the `\"dependencies\"` section\
    \ of `package.json`. It will be installed when you enter `npm install` and can\
    \ be run wherever the project is deployed. You can remove the `build` folder from\
    \ your repository since the files can be created on any platform when required.\n\
    \n## Step 4: Create a Gulp Configuration File\n\nCreate a new `gulpfile.js` configuration\
    \ file in the root of your project folder. Add some basic code to get started:\n\
    \n```\n// Gulp.js configuration\nvar\n  // modules\n  gulp = require('gulp'),\n\
    \n  // development mode?\n  devBuild = (process.env.NODE_ENV !== 'production'),\n\
    \n  // folders\n  folder = {\n    src: 'src/',\n    build: 'build/'\n  }\n;\n\
    ```\n\nThis references the Gulp module, sets a `devBuild` variable to `true` when\
    \ running in development (or non-production mode) and defines the source and build\
    \ folder locations.\n\n#### ES6\n\nES6 note: ES5-compatible JavaScript code is\
    \ provided in this tutorial. This will work for all versions of Gulp and Node.js\
    \ with or without the `--harmony` flag. [Most ES6 features are supported in Node\
    \ 6 and above](http://node.green/) so feel free to use arrow functions, `let`,\
    \ `const`, etc. if you're using a recent version.\n\n`gulpfile.js` won't do anything\
    \ yet because you need to …\n\n## Step 5: Create Gulp Tasks\n\nOn its own, Gulp\
    \ does nothing. You must:\n\n1.  install Gulp plugins, and\n\n2.  write tasks\
    \ which utilize those plugins to do something useful.\n\nIt's possible to write\
    \ your own plugins but, since almost 3,000 are available, it's unlikely you'll\
    \ ever need to. You can search using Gulp's own directory at [gulpjs.com/plugins/](http://gulpjs.com/plugins/),\
    \ on [npmjs.com](https://www.npmjs.com/), or search \"gulp *something*\" to harness\
    \ the mighty power of Google.\n\nGulp provides three primary task methods:\n\n\
    *   `gulp.task` — defines a new task with a name, optional array of dependencies\
    \ and a function.\n\n*   `gulp.src` — sets the folder where source files are located.\n\
    \n*   `gulp.dest` — sets the destination folder where build files will be placed.\n\
    \nAny number of plugin calls are set with `pipe` between the `.src` and `.dest`.\n\
    \n### Image Task\n\nThis is best demonstrated with an example, so let's create\
    \ a basic task which compresses images and copies them to the appropriate `build`\
    \ folder. Since this process could take time, we'll only compress new and modified\
    \ files. Two plugins can help us: [gulp-newer](https://www.npmjs.com/package/gulp-newer)\
    \ and [gulp-imagemin](https://www.npmjs.com/package/gulp-imagemin). Install them\
    \ from the command-line:\n\n```\nnpm install gulp-newer gulp-imagemin --save-dev\n\
    ```\n\nWe can now reference both modules the top of `gulpfile.js`:\n\n```\n//\
    \ Gulp.js configuration\n\nvar\n  // modules\n  gulp = require('gulp'),\n  newer\
    \ = require('gulp-newer'),\n  imagemin = require('gulp-imagemin'),\n```\n\nWe\
    \ can now define the image processing task itself as a function at the end of\
    \ `gulpfile.js`:"
