    \nWith very little effort, we’ve added dynamic code splitting and lazy loading\
    \ of modules to our app. This is a great starting point for building a highly\
    \ performant web app.\n\n## Plugins\n\nWhile `loaders` operate transforms on single\
    \ files, `plugins` operate across larger chunks of code.\n\nNow that we’re bundling\
    \ our code, external modules *and* static assets, our bundle will grow — *quickly*.\
    \ Plugins are here to help us split our code in clever ways and optimize things\
    \ for production.\n\nWithout knowing it, we’ve actually already used many [default\
    \ Webpack plugins with “mode”](https://webpack.js.org/concepts/mode/#usage)\n\n\
    ### development\n\n*   Provides `process.env.NODE_ENV` with value “development”\n\
    *   `NamedModulesPlugin`\n\n### production\n\n*   Provides `process.env.NODE_ENV`\
    \ with value “production”\n*   `UglifyJsPlugin`\n*   `ModuleConcatenationPlugin`\n\
    *   `NoEmitOnErrorsPlugin`\n\n#### Production\n\nBefore adding additional plugins,\
    \ we’ll first split our config up so that we can apply plugins specific to each\
    \ environment.\n\nRename `webpack.config.js` to `webpack.common.js` and add a\
    \ config file for development and production.\n\n```\n- |- webpack.config.js\n\
    + |- webpack.common.js\n+ |- webpack.dev.js\n+ |- webpack.prod.js\n```\n\nWe’ll\
    \ use `webpack-merge` to combine our common config with the environment-specific\
    \ config:\n\n```bash\nnpm install --save-dev webpack-merge\n```\n\n#### webpack.dev.js\n\
    \n```javascript\nconst merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
    \nmodule.exports = merge(common, {\n  mode: 'development'\n})\n```\n\n#### webpack.prod.js\n\
    \n```javascript\nconst merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
    \nmodule.exports = merge(common, {\n  mode: 'production'\n})\n```\n\n#### package.json\n\
    \n```json\n \"scripts\": {\n-    \"develop\": \"webpack --watch --mode development\"\
    ,\n-    \"build\": \"webpack --mode production\"\n+    \"develop\": \"webpack\
    \ --watch --config webpack.dev.js\",\n+    \"build\": \"webpack --config webpack.prod.js\"\
    \n   },\n```\n\nNow we can add plugins specific to development into `webpack.dev.js`\
    \ and plugins specific to production in `webpack.prod.js`.\n\n#### Split CSS\n\
    \nIt’s considered best practice to split your CSS from your JavaScript when bundling\
    \ for production using [ExtractTextWebpackPlugin](https://webpack.js.org/plugins/extract-text-webpack-plugin).\n\
    \nThe current `.scss` loaders are perfect for development, so we’ll move those\
    \ from `webpack.common.js` into `webpack.dev.js` and add `ExtractTextWebpackPlugin`\
    \ to `webpack.prod.js` only.\n\n```bash\nnpm install --save-dev extract-text-webpack-plugin@4.0.0-beta.0\n\
    ```\n\n#### webpack.common.js\n\n```javascript\n ...\n  module.exports = {\n \
    \   ...\n    module: {\n      rules: [\n        ...\n-       {\n-         test:\
    \ /\\.scss$/,\n-         use: [\n-           {\n-             loader: 'style-loader'\n\
    -           }, {\n-             loader: 'css-loader'\n-           }, {\n-    \
    \         loader: 'sass-loader'\n-           }\n-         ]\n-       },\n    \
    \    ...\n      ]\n    }\n  }\n```\n\n#### webpack.dev.js\n\n```javascript\n const\
    \ merge = require('webpack-merge')\n  const common = require('./webpack.common.js')\n\
    \n  module.exports = merge(common, {\n    mode: 'development',\n+   module: {\n\
    +     rules: [\n+       {\n+         test: /\\.scss$/,\n+         use: [\n+  \
    \         {\n+             loader: 'style-loader'\n+           }, {\n+       \
    \      loader: 'css-loader'\n+           }, {\n+             loader: 'sass-loader'\n\
    +           }\n+         ]\n+       }\n+     ]\n+   }\n  })\n```\n\n#### webpack.prod.js\n\
    \n```javascript\n const merge = require('webpack-merge')\n+ const ExtractTextPlugin\
    \ = require('extract-text-webpack-plugin')\n  const common = require('./webpack.common.js')\n\
    \n  module.exports = merge(common, {\n    mode: 'production',\n+   module: {\n\
    +     rules: [\n+       {\n+         test: /\\.scss$/,\n+         use: ExtractTextPlugin.extract({\n\
    +           fallback: 'style-loader',\n+           use: ['css-loader', 'sass-loader']\n\
    +         })\n+       }\n+     ]\n+   },\n+   plugins: [\n+     new ExtractTextPlugin('style.css')\n\
    +   ]\n  })\n```\n\nLet’s compare the output of our two build scripts:\n\n```\n\
