    \ class Database {\n  function new();\n  function getProperty<T>(property:Property<T>):T;\n\
    \  function setProperty<T>(property:Property<T>, value:T):Void;\n}\n\nabstract\
    \ Property<T>(String) {\n  public inline function new(name) {\n    this = name;\n\
    \  }\n}\n\nclass Main {\n  static inline var PLAYER_NAME = new Property<String>(\"\
    playerName\");\n  static inline var PLAYER_LEVEL = new Property<Int>(\"playerLevel\"\
    );\n\n  static function main() {\n    var db = new Database();\n\n    var playerName\
    \ = db.getProperty(PLAYER_NAME);\n    trace(playerName.toUpperCase());\n\n   \
    \ db.setProperty(PLAYER_LEVEL, 1);\n  }\n}\n```\n\nCheck out the Haxe site’s [getting\
    \ started with Haxe](https://haxe.org/documentation/introduction/language-introduction.html)\
    \ pages for more.\n\n# Nim\n\n`Nim` is a statically typed, multi-paradigm programming\
    \ language with minimalist and whitespace-sensitive syntax that can compile to\
    \ JavaScript as well as C, C++.\n\nThe language itself is very small, but its\
    \ metaprogramming capabilities make it attractive to implement features by yourself\
    \ that you might find built-in to other languages. The building blocks for this\
    \ are `macros`, `templates`, and `generics`, and with them you can implement things\
    \ from simple features to different paradigms. This makes `Nim` an extremely versatile\
    \ language that can be adapted to your needs, in the spirit of `Lisp`.\n\nThe\
    \ syntactic abstraction features of `Nim` allow you to adapt the language to your\
    \ problems, making true [DSLs](https://en.wikipedia.org/wiki/Domain-specific_language)\
    \ possible. If you have specialized tasks to solve, you can get a higher level\
    \ of expressiveness:\n\n```nim\n# Reverse a string\nproc reverse(s: string): string\
    \ =\n  result = \"\"\n  for i in countdown(high(s), 0):\n    result.add s[i]\n\
    \nvar str1 = \"Reverse This!\"\necho \"Reversed: \", reverse(str1)\n\n# Using\
    \ templates\ntemplate genType(name, fieldname: expr, fieldtype: typedesc) =\n\
    \  type\n    name = object\n      fieldname: fieldtype\n\ngenType(Test, foo, int)\n\
    \nvar x = Test(foo: 4566)\necho(x.foo) # 4566\n```\n\nThe `Nim` site has some\
    \ useful [getting started](https://nim-lang.org/documentation.html) docs for more\
    \ information.\n\n# Conclusion\n\nIf `JavaScript` isn’t your favorite language,\
    \ you can still create web applications without having to suffer the shortcomings\
    \ of the technology. The options available to create those applications can fill\
    \ a wide spectrum of taste, from purely functional languages like `PureScript`\
    \ to object-oriented ones like `Dart`. And if you want something more than a one-to-one\
    \ language translation, you have options like `Elm` that provide you with tools\
    \ like a virtual DOM and a built-in architecture.\n\n# Chapter 5: 10 Must-have\
    \ VS Code Extensions for JavaScript Developers\n\nby Michael Wanyoike\n\n**In\
    \ this article, I’ll focus on a list of must-have VS Code extensions for JavaScript\
    \ developers.**\n\n[Visual Studio Code](https://code.visualstudio.com/) is undoubtedly\
    \ the most popular lightweight code editor today. It does borrow heavily from\
    \ other popular code editors, mostly `Sublime Text` and `Atom`. However, its success\
    \ mainly comes from its ability to provide better performance and stability. In\
    \ addition, it also provides much needed features like `IntelliSense`, which were\
    \ only available in full-sized IDEs like `Eclipse` or `Visual Studio 2017`.\n\n\
    The power of `VS Code` no doubt comes from the [marketplace](https://marketplace.visualstudio.com/vscode).\
    \ Thanks to the wonderful open-source community, the editor is now capable of\
    \ supporting almost every programming language, framework and development technology.\
    \ Support for a library or framework comes in various ways, which mainly includes\
    \ snippets, syntax highlighting, [Emmet](https://emmet.io/) and `IntelliSense`\
    \ features for that specific technology.\n\n## VS Code Extensions by Category\n\
    \nFor this article, I’ll focus on `VS Code` extensions specifically targeting\
    \ JavaScript developers. Currently, there are many `VS Code` extensions that fit\
    \ this criterion, which of course means I won’t be able to mention all of them.\
    \ Instead, I’ll highlight `VS Code` extensions that have gained popularity and\
    \ those that are indispensable for JavaScript developers. For simplicity, I’ll\
    \ group them into ten specific categories.\n\n## Snippet Extensions\n\nWhen you\
    \ first install `VS Code`, it comes with a several snippets for `JavaScript` and\
    \ `Typescript`. Before you start writing modern `JavaScript`, you’ll need some\
    \ additional snippets to help you quickly write repetitive ES6/ES7 code:\n\n*\
    \   [VS Code JavaScript (ES6) snippets](https://marketplace.visualstudio.com/items?itemName=xabikos.JavaScriptSnippets):\
    \ currently the most popular, with over 1.2 million installs to date. This extension\
    \ provides ES6 syntax for JavaScript, TypeScript, HTML, React and Vue extensions.\n\
    \n*   [JavaScript Snippet Pack](https://marketplace.visualstudio.com/items?itemName=akamud.vscode-javascript-snippet-pack):\
    \ a collection of useful snippets for JavaScript.\n\n*   [Atom JavaScript Snippet](https://marketplace.visualstudio.com/items?itemName=gluons.vscode-atom-javascript-snippet):\
    \ JavaScript snippets ported from the `atom/language-javascript` extension.\n\n\
    *   [JavaScript Snippets](https://marketplace.visualstudio.com/items?itemName=nathanchapman.JavaScriptSnippets):\
    \ a collection of ES6 snippets. This extension has snippets for Mocha, Jasmine\
    \ and other BDD testing frameworks.\n\n## Syntax Extensions\n\n`VS Code` comes\
    \ with pretty good syntax highlighting for JavaScript code. You can change the\
    \ colors by installing themes. However, you need a syntax highlighter extension\
    \ if you want a certain level of readability. Here are a couple of them:\n\n*\
    \   [JavaScript Atom](https://marketplace.visualstudio.com/items?itemName=ms-vscode.js-grammar):\
    \ this extension replaces the JavaScript grammar in Visual Code with the JavaScript\
    \ grammar from the `Atom` editor.\n\n*   [Babel JavaScript](https://marketplace.visualstudio.com/items?itemName=mgmcdermott.vscode-language-babel):\
    \ syntax highlighting for ES21x JavaScript, React, FlowType and GraphQL.\n\n*\
    \   [DotENV](https://marketplace.visualstudio.com/items?itemName=mikestead.dotenv):\
    \ syntax highlighting for `.env` files. Handy if you’re working with `Node`.\n\
    \n## Linter Extensions\n\nWriting JavaScript code efficiently with minimum fuss\
    \ requires a linter that enforces a specific standard for all team members. `ESLint`\
    \ is the most popular, since it supports many styles. Here are the most popular\
    \ linter plugins for Studio Code:\n\n*   [ESLint](https://marketplace.visualstudio.com/items?itemName=dbaeumer.vscode-eslint):\
    \ this extension integrates [ESLint](https://eslint.org/) into VS Code. It’s the\
    \ most popular linter extension, with over 6.7 million installs to date. Rules\
    \ are configured in `.eslintrc.json`.\n\n*   [JSHint](https://marketplace.visualstudio.com/items?itemName=dbaeumer.jshint):\
    \ a code checker extension for [JSHint](http://jshint.com/about/). Uses `.jshintrc`file\
    \ at the root of your project for configuration.\n\n*   [JavaScript Standard Style](https://marketplace.visualstudio.com/items?itemName=chenxsan.vscode-standardjs):\
    \ a linter with zero configuration and rigid rules. Enforces the [StandardJS Rules](https://github.com/standard/standard).\n\
    \n*   [JSLint](https://marketplace.visualstudio.com/items?itemName=ajhyndman.jslint):\
    \ linter extension for [JSLint](http://jslint.com/help.html).\n\nIf you’d like\
    \ an overview of available linters and their pros and cons, check out our [comparison\
    \ of JavaScript linting tools](https://www.sitepoint.com/comparison-javascript-linting-tools/).\n\
    \n## Node Extensions\n\nEvery JavaScript project needs to at least one Node package,\
    \ unless you’re someone who likes doing things the hard way. Here are a few VS\
    \ Code extensions that will help you work with Node modules more easily.\n"
