    \  [emitted]  chat\n```\n\n```\n> npm run build\n\nAsset           Size      \
    \ Chunks        Chunk Names\nchat.bundle.js  375 bytes  0  [emitted]  chat\napp.bundle.js\
    \   1.82 KiB   1  [emitted]  app\nstyle.css       424 bytes  1  [emitted]  app\n\
    ```\n\nNow that our CSS is extracted from our JavaScript bundle for production,\
    \ we need to `<link>` to it from our HTML.\n\n**dist/index.html**\n\n```\n <!DOCTYPE\
    \ html>\n  <html>\n    <head>\n      <meta charset=\"UTF-8\">\n      <title>Code\
    \ Splitting</title>\n+     <link href=\"style.css\" rel=\"stylesheet\">\n    </head>\n\
    \    <body>\n      <script type=\"text/javascript\" src=\"app.bundle.js\"></script>\n\
    \    </body>\n  </html>\n```\n\nThis allows for parallel download of the CSS and\
    \ JavaScript in the browser, so will be faster-loading than a single bundle. It\
    \ also allows the styles to be displayed before the JavaScript finishes downloading.\n\
    \n### Generating HTML\n\nWhenever our outputs have changed, we’ve had to keep\
    \ updating `index.html` to reference the new file paths. This is precisely what\
    \ `html-webpack-plugin` was created to do for us automatically.\n\nWe may as well\
