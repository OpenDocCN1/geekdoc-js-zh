  trans: "\n\n[TypeScript](https://www.typescriptlang.org/) 是 JavaScript 的超集。一个有效的\
    \ JavaScript 程序也是有效的 TypeScript，但添加了静态类型。该编译器还可以作为从 ES2015+ 到当前实现的转译器，因此你始终可以获得最新功能。\n\
    \n与许多其他语言不同，TypeScript 保持了 JavaScript 的精髓，只添加了改进代码健壮性的功能。这些是类型注解和其他类型相关的功能，它们让编写\
    \ JavaScript 变得更加愉快，这得益于静态分析器等专用工具的启用，这些工具有助于重构过程。此外，类型的添加改进了应用程序中不同组件之间的接口。\n\
    \n它支持类型推断，因此你不需要从一开始就写所有的类型。你可以编写快速的解决方案，然后添加所有类型以对你的代码充满信心。\n\nTypeScript 还支持高级类型，例如交叉类型、联合类型、类型别名、判别联合和类型守卫。你可以在\
    \ [TypeScript 文档](https://www.typescriptlang.org/docs) 网站中的[高级类型](https://www.typescriptlang.org/docs/handbook/advanced-types.html)\
    \ 页面查看所有这些内容。\n\n如果你使用 React，通过添加 React 类型也可以支持 JSX：\n\n```\nclass Person {\n\
    \  private name: string;\n  private age: number;\n  private salary: number;\n\n\
    \  constructor(name: string, age: number, salary: number) {\n    this.name = name;\n\
    \    this.age = age;\n    this.salary = salary;\n  }\n\n  toString(): string {\n\
    \    return `${this.name} (${this.age}) (${this.salary})`;\n  }\n}\n```\n\n关于\
    \ TypeScript 的更多信息，请查看 SitePoint 的 [TypeScript 入门](https://www.sitepoint.com/introduction-to-typescript/)\
    \ 文章。\n\n## Elm\n\nElm 是一种纯函数式编程语言，可以编译为 JavaScript、HTML 和 CSS。你只需要用 Elm 就能构建一个完整的网站，使其成为\
    \ React 等 JavaScript 框架的极佳替代方案。用它构建的应用会自动使用虚拟 DOM 库，使其非常快速。一个很大的优势是内置架构，它让你忘记数据流，转而关注数据声明和逻辑。\n\
    \n在 Elm 中，所有函数都是纯的，这意味着对于给定的输入，它们将始终返回相同的输出。除非你指定，否则它们不能做任何其他事情。例如，为了访问远程 API，你会创建\
    \ `command` 函数来与外部世界通信，并使用 `subscriptions` 来监听响应。纯性的另一个点是值是不可变的：当你需要某些东西时，你创建新值，而不是修改它们。\n\
    \n采用 Elm 可以是渐进的。你可以使用 `ports` 与 JavaScript 和其他库通信。尽管 Elm 还没有达到版本 1，但它已被用于复杂和大型应用程序，使其成为复杂应用程序的可行解决方案。\n\
    \nElm 最具吸引力的特性之一是对初友的编译器，它不是产生难以读的消息，而是生成帮助你修复代码的代码。如果你正在学习这门语言，编译器本身可以提供很大帮助。\n\
    \n```\nmodule Main exposing (..)\n\nimport Html exposing (..)\n\n-- MAIN\n\nmain\
    \ : Program Never Model Msg\nmain =\n    Html.program\n        { init = init\n\
    \        , update = update\n        , view = view\n        , subscriptions = subscriptions\n\
    \        }\n\n-- INIT\n\ntype alias Model = String\n\ninit : ( Model, Cmd Msg\
    \ )\ninit = ( \"Hello World!\", Cmd.none )\n\n-- UPDATE\n\ntype Msg\n    = DoNothing\n\
    \nupdate : Msg -> Model -> ( Model, Cmd Msg )\nupdate msg model =\n    case msg\
    \ of\n        DoNothing ->\n            ( model, Cmd.none )\n\n-- VIEW\n\nview\
    \ : Model -> Html Msg\nview model =\n    div [] [text model]\n\n-- SUBSCRIPTIONS\n\
    \nsubscriptions : Model -> Sub Msg\nsubscriptions model =\n    Sub.none \n```\n\
    \n如果你想了解更多，SitePoint 有有一篇方便的 [Elm 入门](https://www.sitepoint.com/functional-reactive-programming-elm-introduction/)\
    \ 文章。\n\n## PureScript\n\n[PureScript](http://www.purescript.org/) 是一种纯函数且强类型的编程语言，由\
    \ Phil Freeman 创建。它旨在与现有的 JavaScript 库提供强兼容性，精神上类似于 Haskell，但将 JavaScript 作为核心。\n\
    \nPureScript 的一个优势是它的极简主义。它不包含任何在其他语言中被认为本质的功能库。例如，与其在编译器本身中包含生成器和承诺（promises），你可以使用特定的库来完成任务。你可以为需要的特性选择所需的实现方式，这使得在使用\
    \ PureScript 时能够获得极高效且个性化的体验，同时保持生成的代码尽可能小。\n\n其编译器的另一个独特之处是能够在保持与 JavaScript（包括库和工具）兼容的同时，编写整洁可读的代码。\n\
    \n与其他语言一样，PureScript 有它自己的[构建工具称为 Pulp](https://github.com/purescript-contrib/pulp)，它可以与\
    \ Gulp 相比，但用于用这种语言编写的项目。\n\n关于类型系统——与 Elm（另一种类 ML 语言）不同——PureScript 支持高级类型功能，如[高阶阶类型](https://en.wikipedia.org/wiki/Kind_%28type_theory%29)\
    \ 和类型类，这些特性源自 Haskell，允许创建复杂的抽象：\n\n``` evenmodule Main where\n\nimport Prelude\n\
    import Data.Foldable (fold)\nimport TryPureScript\n\nmain =\n    render $ fold\n\
    \      [ h1 (text \"Try PureScript!\")\n      , p (text \"Try out the examples!\"\
    )\n      , h2 (text \"Examples\")\n      , list (map fromExample)\n      ]\n \
    \ where\n    fromExample { title, gist } =\n      link (\"gist=\" <> gist) (text\
    \ title)\n\n    examples =\n      [ { title: \"Algebraic Data Types\"\n      \
    \  , gist: \"37c3c97f47a43f20c54\"\n        }\n      , { title: \"Loops\"\n  \
    \      , gist: \"cfdab085d4ac3dc\"\n        }\n      , { title: \"Operators\"\n\
    \        , gist: \"3044550f29a7c53d0\"\n      ]\n```\n\n要进一步学习 PureScript，请查看\
    \ GitHub 上的 [PureScript 入门](https://github.com/purescript/documentation/blob/master/guides/Getting-Started.md)\
    \ 指南。\n\n## CoffeeScript\n\nCoffeeScript 是一种旨在暴露 JavaScript 优点同时提供更简洁语法并保持语义的语言。尽管该语言的流行程度近年来有所下降，但它正在改变方向，并最近获得了支持\
    \ ES2015+ 功能的新版本。用 CoffeeScript 编写的代码直接转换为可读的 JavaScript 代码，并与现有库兼容。从版本 2 开始，编译器产生与最新\
    \ ECMAScript 版本兼容的代码。例如，每当你使用 `class` 时，你在 JavaScript 中就会得到 `class`。此外，如果你使用 React，有一个好消息：JSX\
    \ 与 CoffeeScript 兼容。\n\n编译器的一个非常独特的特性是能够处理以[文式风格](https://en.wikipedia.org/wiki/Literate_programming)编写的代码，在这种风格下，你不是在代码中强调并将注释作为额外，而是先编写注释，代码偶尔出现。这种编程风格由\
    \ Donald Knuth 引入，使得代码文件非常像技术文章。\n\n"
- fmt: "\n```\n# Assignment:\nnumber   = 42\nopposite = true\n\n# Conditions:\nnumber\
    \ = -42 if opposite\n\n# Functions:\nsquare = (x) -> x * x\n\n# Arrays:\nlist\
    \ = [1, 2, 3, 4, 5]\n\n# Objects:\nmath =\n  root:   Math.sqrt\n  square: square\n\
    \  cube:   (x) -> x * square x\n\n# Splats:\nrace = (winner, runners...) ->\n\
    \  print winner, runners\n\n# Existence:\nalert \"I knew it!\" if elvis?\n\n#\
    \ Array comprehensions:\ncubes = (math.cube num for num in list)\n```\n\nThe CoffeeScript\
    \ site has a handy [getting started with CoffeeScript 2](http://coffeescript.org/v2/#coffeescript-2)\
    \ resource.\n\n## ClojureScript\n\nClojureScript is a compiler that translates\
    \ the Clojure programming language to JavaScript. It’s a general-purpose, functional\
    \ language with dynamic typing and support for immutable data structures.\n\n\
    It’s the only one from this list that belongs to the Lisp family of programming\
    \ languages and, naturally, it shares a lot of the features. For example, the\
    \ code can be treated as data, and a macro system is available, making metaprogramming\
    \ techniques possible. Unlike other Lisps, Clojure has support for immutable data\
    \ structures, making the management of side effects easier.\n\nThe syntax can\
    \ look intimidating for newcomers because of its use of parentheses, but it has\
    \ profound reasons to be that way, and you’ll certainly appreciate it in the long\
    \ run. That minimalism in the syntax and its syntactic abstraction capabilities\
    \ make Lisp a powerful tool for solving problems that require high levels of abstraction.\n\
    \nAlthough Clojure is mainly a functional language, it isn’t pure like PureScript\
    \ or Elm. Side effects can still happen, but other functional features are still\
    \ present.\n\nClojureScript uses Google Closure for code optimization and also\
    \ has compatibility with existing JavaScript libraries:\n\n```\n; Extracted from\
    \ https://github.com/clojure/clojurescript/blob/master/samples/dom/src/dom/test.cljs\n\
    \n(ns dom.test\n  (:require [clojure.browser.event :as event]\n            [clojure.browser.dom\
    \   :as dom]))\n\n(defn log [& args]\n  (.log js/console (apply pr-str args)))\n\
    \n(defn log-obj [obj]\n  (.log js/console obj))\n\n(defn log-listener-count []\n\
