    \ revolutionize your workflow. I hope you found this tutorial useful and consider\
    \ Gulp for your production process.\n\n# Chapter 4: 10 Languages That Compile\
    \ to JavaScript\n\n### by James Kolce\n\n**This chapter includes a list of ten\
    \ interesting languages that can compile to JavaScript to be executed in the browser\
    \ or on a platform like Node.js.**\n\nModern applications have [different requirements](https://www.sitepoint.com/anatomy-of-a-modern-javascript-application/)\
    \ from simple websites. But the browser is a platform with a (mostly) fixed set\
    \ of technologies available, and JavaScript remains as the core language for web\
    \ applications. Any application that needs to run in the browser has to be implemented\
    \ in that language.\n\nWe all know that JavaScript isn’t the best language for\
    \ every task, and when it comes to complex applications, it might fall short.\
    \ To avoid this problem, several new languages and transpilers of existing ones\
    \ have been created, all of them producing code that can work in the browser without\
    \ any lines of JavaScript having to be written, and without you having to think\
    \ about the limitations of the language.\n\n## Dart\n\nDart is a classical, object-oriented\
    \ language where everything is an object and any object is an instance of a class\
    \ (objects can act as functions too.) It’s specially made to build applications\
    \ for browsers, servers, and mobile devices. It’s maintained by Google and is\
    \ [the language that powers the next generation AdWords UI](http://news.dartlang.org/2016/03/the-new-adwords-ui-uses-dart-we-asked.html),\
    \ the most important product of Google regarding revenue, which is in itself a\
    \ proof of its power at scale.\n\nThe language can be translated to JavaScript\
    \ to be used in a browser, or be directly interpreted by the Dart VM, which allows\
    \ you to build server applications too. Mobile applications can be made using\
    \ the Flutter SDK.\n\nComplex applications also require a mature set of libraries\
    \ and language features specially designed for the task, and Dart includes all\
    \ of this. An example of a popular library is [AngularDart](https://webdev.dartlang.org/angular/),\
    \ a version of Angular for Dart.\n\nIt allows you to write type-safe code without\
    \ being too intrusive. You can write types, but you aren’t required to do so,*\
    \ since they can be inferred. This allows for rapid prototyping without having\
    \ to overthink the details, but once you have something working, you can add types\
    \ to make it more robust.\n\nRegarding concurrent programming in the VM, instead\
    \ of shared-memory threads (Dart is single-threaded), Dart uses what they call\
    \ **Isolates**, with their own memory heap, where communication is achieved using\
    \ messages. In the browser, the story is a little different: instead of creating\
    \ new isolates, you create new **Workers**.\n\n```\n// Example extracted from\
    \ dartlang.org\n\nimport 'dart:async';\nimport 'dart:math' show Random;\n\nmain()\
    \ async {\n  print('Compute π using the Monte Carlo method.');\n  await for (var\
    \ estimate in computePi()) {\n    print('π ≅ $estimate');\n  }\n}\n\n/// Generates\
    \ a stream of increasingly accurate estimates of π.\nStream<double> computePi({int\
    \ batch: 1000000}) async* {\n  var total = 0;\n  var count = 0;\n  while (true)\
    \ {\n    var points = generateRandom().take(batch);\n    var inside = points.where((p)\
    \ => p.isInsideUnitCircle);\n    total += batch;\n    count += inside.length;\n\
    \    var ratio = count / total;\n    // Area of a circle is A = π⋅r², therefore\
    \ π = A/r².\n    // So, when given random points with x ∈ <0,1>,\n    // y ∈ <0,1>,\
    \ the ratio of those inside a unit circle\n    // should approach π / 4\\. Therefore,\
    \ the value of π\n    // should be:\n    yield ratio * 4;\n  }\n}\n\nIterable<Point>\
    \ generateRandom([int seed]) sync* {\n  final random = new Random(seed);\n  while\
    \ (true) {\n    yield new Point(random.nextDouble(), random.nextDouble());\n \
    \ }\n}\n\nclass Point {\n  final double x, y;\n  const Point(this.x, this.y);\n\
    \  bool get isInsideUnitCircle => x * x + y * y <= 1;\n}\n```\n\nFor more reading,\
    \ I recommend Dart’s [Get started with Dart](https://www.dartlang.org/guides/get-started)\
    \ resource.\n\n## TypeScript"
