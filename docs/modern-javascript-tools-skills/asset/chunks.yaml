    \   (dom/get-element \"source\"))\n(def destination (dom/get-element \"destination\"\
    ))\n\n(dom/append source\n            (dom/element \"Testing me \")\n        \
    \    (dom/element \"out!\"))\n\n(def success-count (atom 0))\n\n(log-listener-count)\n\
    \n(event/listen source\n              :click\n              (fn [e]\n        \
    \        (let [i (swap! success-count inc)\n                      e (dom/element\
    \ :li\n                                      {:id \"testing\"\n              \
