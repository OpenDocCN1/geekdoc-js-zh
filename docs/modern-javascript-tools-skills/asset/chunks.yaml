  trans: "\n\n```\n+ const webpack = require('webpack')\n  const merge = require('webpack-merge')\n\
    \  const common = require('./webpack.common.js')\n\n  module.exports = merge(common,\
    \ {\n    mode: 'development',\n+   devServer: {\n+     hot: true\n   },\n+   plugins:\
    \ [\n+     new webpack.HotModuleReplacementPlugin()\n   ],\n    ...\n  }\n```\n\
    \n现在我们需要从代码中 `accept` 更改的模块以重新初始化。\n\n`src/app.js`\n\n```\n+ if (module.hot) {\n\
    +   module.hot.accept()\n+ }\n\n  ...\n```\n\n## 热模块替换 (Hot Module Replacement)\n\
    \n当启用热模块替换时，`module.hot` 在开发环境下设置为 `true`，在生产环境下设置为 `false`，因此这些代码会被从包中移除。\n\n\
    重新构建并执行以下操作，看看会发生什么：\n\n* 点击 `Open chat`（打开聊天）\n* 在 `people.js` 模块中添加一个新人\n* 再次点击\
    \ `Open chat`\n\n![向聊天窗口添加人员](img/1521906879hmr.png)\n\n以下是发生的情况：\n\n1. 点击 `Open\
    \ chat` 时，获取并初始化 `chat.js` 模块\n2. HMR 检测到 `people.js` 被修改\n3. `index.js` 中的 `module.hot.accept()`\
    \ 导致所有由该入口块加载的模块被替换\n4. 当再次再次点击 `Open chat` 时，将使用更新后模块的代码运行 `chat.init()`\n\n\
    ### CSS 替换\n\n让我们将按钮颜色改为红色，看看会发生什么：\n\n`src/app.scss`\n\n```\n button {\n    ...\n\
    -   background: #24b47e;\n+   background: red;\n    ...\n  }\n```\n\n![更改 CSS](img/1521906881hmr2.png)\n\
    \n现在我们可以看到样式的实时更新，而不会丢失任何状态。这极大地提升了开发者体验！这种感觉就像未来。\n\n## HTTP/2\n\n使用 Webpack\
    \ 这样的模块打包器的主要优势之一是，它通过让你控制资产在客户端如何被 `built`（构建）以及 `fetched`（获取），帮助你提高性能。多年来，通过合并文件来减少客户端所需的请求数量一直被认为是[最佳实践](https://developer.yahoo.com/performance/rules.html)。这仍然有效，但\
    \ [HTTP/2 现在允许在单次请求中交付多个文件](https://www.sitepoint.com/file-bundling-and-http2/)，因此合并不再是万能妙药。你的应用程序实际上可能会从许多许多小文件的独立缓存中获益。客户端可以只获取单个更改的模块，而无需重新获取一个内容\
    \ `mostly` 相同的整个包。\n\nWebpack 的创建者 [Tobias Koppers](https://twitter.com/wSokra)\
    \ 编写了一篇信息丰富的文章，解释了为什么即使在 HTTP/2 时代，打包仍然重要。\n\n你可以在 [Webpack & HTTP/2](https://medium.com/webpack/webpack-http-2-7083ec3f3ce6)\
    \ 了解更多信息。\n\n## 轮到你了\n\n希望你发现这段 Webpack 介绍对你有帮助，并能够开始有效地使用它。理解 Webpack 的配置、加载器（loaders）和插件（plugins）可能需要一些时间，但学习这个工具的工作原理将是值得的。\n\
    \nWebpack 4 的文档目前正在编写中，但组织得非常好。我强烈建议阅读 [Concepts](https://webpack.js.org/concepts/)\
    \ 和 [Guides](https://webpack.js.org/guides/) 章节以获取更多信息。以下是一些你可能感兴趣的其他主题：\n\n*\
    \ [开发环境 Source Maps](https://webpack.js.org/guides/development/#using-source-maps)\n\
    * [生产环境 Source Maps](https://webpack.js.org/guides/production/#source-mapping)\n\
    * [使用哈希文件名进行缓存失效](https://webpack.js.org/guides/caching/)\n* [拆分 vendor 包](https://webpack.js.org/plugins/commons-chunk-plugin/#explicit-vendor-chunk)\n\
    \n# 第 3 章：Gulp.js 简介\n\n### 作者：Craig Buckler\n\n开发者花在代码的时间非常宝贵。即使我们忽略掉烦人的会议，工作中的大部分也涉及一些会消耗你工作日的基础任务：\n\
    \n* 从模板和内容文件生成 HTML\n* 压缩新图像和修改后的图像\n* 将 Sass 编译为 CSS 代码\n* 从脚本中移除 `console` 和\
    \ `debugger` 语句\n* 将 ES6 转换为跨浏览器兼容的 ES5 代码\n* 代码规范检查和验证\n* 合并并压缩 CSS 和 JavaScript\
    \ 文件\n* 将文件部署到开发、测试和生产服务器。\n\n每当你做出更改时，就必须重复这些任务。你可能初衷良好，但即使是最严谨的开发者也会忘记压缩一两个图像。随着时间的推移，生产前任务变得越来越繁琐且耗时；你将畏惧不可避免的内容和模板更改。这是一项令人枯燥、重复的工作。把时间花在更有价值的工作上难道不是更好吗？\n\
    \n如果是这样，你需要一个 `task runner`（任务运行器）或 `build process`（构建过程）。\n\n## 听起来非常复杂！\n\n\
    创建一个构建过程需要时间。\n\n## 任务运行器：选项\n\n诸如 [GNU Make](https://www.gnu.org/software/make/)\
    \ 这样的构建工具已经存在了几十年，但针对 Web 的任务运行器还较新。第一个取得成功的是 [Grunt](http://gruntjs.com/) ——\
    \ 一种使用 JSON 文件（最初）的 Node.js 任务运行器。Grunt 取得了成功，但存在许多问题：\n\n1. Grunt 需要插件来实现文件监听等功能。\n\
    2. Grunt 插件通常执行多个任务，这使得自定义变得很困难。\n3. JSON 配置对于所有操作可能变得难以维护。\n4. 任务运行缓慢，因为它在每个处理步骤之间保存文件。\n\
    \n许多问题在后续版本中得到了解决，但 [Gulp](http://gulpjs.com/)已经已经并提供了许多改进：\n\n1. 内置了文件监听功能。\n\
    2. Gulp 插件大多设计用于单一工作。\n3. Gulp 使用的 JavaScript 配置更简洁、更易读、更易修改，并提供了更好的灵活性。\n4. Gulp\
    \ 更快，因为它使用 [Node.js streams](https://www.sitepoint.com/basics-node-js-streams/)\
    \ 在一系列管道插件之间传递数据。仅在任务结束时写入文件。\n\n当然，Gulp 本身并不完美，新的任务运行器如 [Broccoli.js](http://broccolijs.com/)、[Brunch](http://brunch.io/)\
    \ 和 [webpack](https://webpack.github.io/) 也在竞争开发者的关注。最近，[npm 本身也被推崇为更简单的方案](https://www.sitepoint.com/guide-to-npm-as-a-build-tool/)。所有工具都有优缺点，但\
    \ [Gulp 仍然是最受欢迎的，目前被 40%以上的 Web 开发者使用]。\n\nGulp 需要 Node.js，虽然一些 JavaScript 知识会有帮助，但所有\
    \ Web 领域的开发者都能受益。\n\n## Gulp 4 怎么样？\n\n本教程介绍了如何使用 Gulp 3 —— 编写时的最新版本。Gulp 4 已经开发一段时间，但仍然是一个测试产品。你可以[使用或切换到\
    \ Gulp 4](https://www.joezimjs.com/javascript/complete-guide-upgrading-gulp-4/)，但我建议在最终发布前坚持使用版本\
    \ 3。\n\n## 第一步：安装 Node.js\n\n"
- fmt: "\nNode.js can be downloaded for Windows, macOS and Linux from [nodejs.org/download/](https://nodejs.org/download/).\
    \ There are various options for installing from binaries, package managers and\
    \ docker images, and full instructions are available.\n\n## Windows Users\n\n\
    Node.js and `Gulp` run on Windows, but some plugins may not install or run if\
    \ they depend on native Linux binaries such as image compression libraries. One\
    \ option for Windows 10 users is the new [bash command-line](https://msdn.microsoft.com/en-us/commandline/wsl/install_guide),\
    \ which solves many issues.\n\nOnce installed, open a command prompt and enter:\n\
    \n```\nnode -v\n```\n\nThis reveals the version number. You're about to make heavy\
    \ use of `npm` — the Node.js package manager which is used to install modules.\
    \ Examine its version number:\n\n```\nnpm -v\n```\n\n## For Linux Users\n\nNode.js\
    \ modules can be installed globally so they’re available throughout your system.\
    \ However, most users will not have permission to write to the global directories\
    \ unless `npm` commands are prefixed with `sudo`. There are a number of [options\
    \ to fix npm permissions](https://docs.npmjs.com/getting-started/fixing-npm-permissions)\
    \ and tools such as [nvm can help](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/),\
    \ but I often change the default directory. For example, on Ubuntu/Debian-based\
    \ platforms:\n\n```\ncd ~\n        mkdir .node_modules_global\n        npm config\
    \ set prefix=$HOME/.node_modules_global\n        npm install npm -g \n```\n\n\
    Then add the following line to the end of `~/.bashrc`:\n\n```\nexport PATH=\"\
    $HOME/.node_modules_global/bin:$PATH\" \n```\n\nFinally, update with this:\n\n\
    ```\nsource ~/.bashrc \n```\n\n## Step 2: Install Gulp Globally\n\nInstall `gulp`\
    \ command-line interface globally so the `gulp` command can be run from any project\
    \ folder:\n\n```\nnpm install gulp-cli -g\n```\n\nVerify `Gulp` has installed\
    \ with this:\n\n```\ngulp -v\n```\n\n## Step 3: Configure Your Project\n\n###\
    \ For Node.js Projects\n\nYou can skip this step if you already have a `package.json`\
    \ configuration file.\n\nPresume you have a new or pre-existing project in the\
    \ folder `project1`. Navigate to this folder and initialize it with `npm`:\n\n\
    ```\ncd project1\nnpm init\n```\n\nYou’ll be asked a series of questions. Enter\
    \ a value or hit `Return` to accept defaults. A `package.json` file will be created\
    \ on completion which stores your `npm` configuration settings.\n\n### For Git\
    \ Users\n\nNode.js installs modules to a `node_modules` folder. You should add\
    \ this to your `.gitignore` file to ensure they’re not committed to your repository.\
    \ When deploying the project to another PC, you can run `npm install` to restore\
    \ them.\n\nFor the remainder of this article, we'll presume your project folder\
    \ contains the following sub-folders:\n\n`src` folder: preprocessed source files\n\
    \nThis contains further sub-folders:\n\n* `html` - HTML source files and templates\n\
    * `images` — the original uncompressed images\n* `js` — multiple preprocessed\
    \ script files\n* `scss` — multiple preprocessed Sass `.scss` files\n\n`build`\
    \ folder: compiled/processed files\n\nGulp will create files and create sub-folders\
    \ as necessary:\n\n* `html` — compiled static HTML files\n* `images` — compressed\
    \ images\n* `js` — a single concatenated and minified JavaScript file\n* `css`\
    \ — a single compiled and minified CSS file\n\nYour project will almost certainly\
    \ be different but this structure is used for the examples below.\n\n### Following\
    \ Along on Unix\n\nIf you're on a Unix-based system and you just want to follow\
    \ along with the tutorial, you can recreate the folder structure with the following\
    \ command:\n\n```\nmkdir -p src/{html,images,js,scss} build/{html,images,js,css}\
    \ \n```\n\n## Step 4: Install Gulp Locally\n\nYou can now install `Gulp` in your\
    \ project folder using the command:\n\n```\nnpm install gulp --save-dev\n```\n\
    \nThis installs `Gulp` as a development dependency and the `\"devDependencies\"\
    ` section of `package.json` is updated accordingly.\n\n### Alternative Deployment\
    \ Options\n\nDevelopment dependencies are not installed when the `NODE_ENV` environment\
    \ variable is set to `production` on your operating system. You would normally\
    \ do this on your live server with the Mac/Linux command:\n\n```\nexport NODE_ENV=production\n\
    ```\n\nOr on Windows:\n\n```\nset NODE_ENV=production\n```\n\nThis tutorial presumes\
    \ your assets will be compiled to the `build` folder and committed to your Git\
    \ repository or uploaded directly to the server. However, it may be preferable\
    \ to build assets on the live server if you want to change the way they are created.\
    \ For example, HTML, CSS and JavaScript files are minified on production but not\
    \ development environments. In that case, use the `--save` option for `Gulp` and\
    \ all plugins, i.e.\n\n```\nnpm install gulp --save\n```\n\nThis sets `Gulp` as\
    \ an application dependency in the `\"dependencies\"` section of `package.json`.\
    \ It will be installed when you enter `npm install` and can be run wherever the\
    \ project is deployed. You can remove the `build` folder from your repository\
    \ since the files can be created on any platform when required.\n\n## Step 4:\
    \ Create a Gulp Configuration File\n\nCreate a new `gulpfile.js` configuration\
    \ file in the root. Add some basic code to get started:\n\n```javascript\n// Gulp.js\
    \ configuration\nvar\n  // modules\n  gulp = require('gulp'),\n\n  // development\
    \ mode\n  devBuild = (process.env.NODE_ENV !== 'production'),\n\n  // folders\n\
    \  folder = {\n    src: 'src/',\n    build: 'build/'\n  };\n```\n\nThis references\
    \ the `gulp` module, sets `devBuild` to `true` when running in development (non-production)\
    \ and defines the source and build locations.\n\n### ES6\n\nES6 features are supported\
    \ in Node 6 and above, so if you're using a recent version, `gulpfile.js` won't\
    \ do anything yet because you need to...\n\n## Step 5: Create Gulp Tasks\n\nOn\
    \ its own, Gulp does nothing. You must:\n\n1. install Gulp plugins, and\n2. write\
    \ tasks which utilize those plugins to do something useful.\n\nIt's possible to\
    \ write your own plugins but, since almost 3,000 are available, it's unlikely\
    \ you'll ever need to. You can search to harness the mighty power of Google.\n\
    \nGulp provides three primary task methods:\n\n* `gulp.task` — defines a new task\
    \ with a name, optional array of dependencies and a function.\n* `gulp.src` —\
    \ sets the folder where source files are located.\n* `gulp.dest` — sets the destination\
    \ folder where build files will be placed.\n\nAny number of plugin calls are set\
    \ with `pipe` between the `.src` and `.dest`.\n\n### Image Task\n\nThis is best\
    \ demonstrated with an example, so let's create a basic task which compresses\
    \ images and copies them to the appropriate `build` folder. Since this process\
    \ could take time, we'll only compress new and modified files. Two plugins can\
    \ help us: [gulp-newer](https://www.npmjs.com/package/gulp-newer) and [gulp-imagemin](https://www.npmjs.com/package/gulp-imagemin).\
    \ Install them from the command-line:\n\n```\nnpm install gulp-newer gulp-imagemin\
    \ --save-dev\n```\n\nWe can now reference both modules the top of `gulpfile.js`:\n\
    \n```javascript\n// Gulp.js configuration\n\nvar\n  // modules\n  gulp = require('gulp'),\n\
    \  newer = require('gulp-newer'),\n  imagemin = require('gulp-imagemin'),\n```\n\
    \nWe can now define the image processing task itself as a function at the end\
    \ of `gulpfile.js`:\n"
