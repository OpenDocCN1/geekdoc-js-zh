    \        <td>{{numType}}</td>\n      </tr>\n      {{/each}}\n    </tbody>\n  </table>\n\
    </script>\n```\n\n如果你快速扫一眼，代码看起来是正确的。那么问题一定在 `app.js` 中。打开该文件并分析那里的代码。下面是你应该注意的代码段。请花时间阅读注释以理解代码。\n"
- fmt: "\nHmm … that's not right. The place is added, but the country is not being\
    \ displayed. The problem obviously isn't the HTML table code, since the first\
    \ row has the country cell populated, so something must be happening on the JavaScript\
    \ side. Open `app.js` and add a breakpoint on line 58 where it says:\n\n```\n\
    addPlace(city, country);\n```\n\nRestart the debug session and try to add a new\
    \ place again. The execution should pause at the breakpoint you just set. Start\
    \ hovering over the relevant variables. You can also add expressions to the watch\
    \ panel, as seen below:\n\n![Country bug found](Images/152442838920-country-bug-found.png)\n\
    \nAs you can see, the `country` variable is undefined, but the `city` variable\
    \ is. If you look at the jQuery selector expressions that have been set up in\
    \ the watch panel, you'll notice that the `#country` selector returns nothing.\
    \ This means it wasn't present in the DOM. Head over to `index.html` to verify.\n\
    \nAlas! If you look at line 59 where the country input has been defined, it's\
    \ missing the ID attribute. You need to add one like this:\n\n```\n<input type=\"\
    text\" placeholder=\"Enter Country\" name=\"country\" id=\"country\">\n```\n\n\
    Restart the debugging session and try to add a new place.\n\n![Country bug fixed](Images/152442839121-country-fixed.png)\n\
    \nIt now works! Great job fixing another bug without `console.log`. Let's now\
    \ move on to our final bug.\n\n## Debugging Client-side Routing\n\nClick the *Convert*\
    \ link in the navigation bar. You should be taken to this view to perform a quick\
    \ conversion:\n\n![Convert currency](Images/152442839322-convert-currency.png)\n\
    \nThat runs fine. No bugs there.\n\nActually there are, and they have nothing\
    \ to do with the form. To spot them, refresh the page.\n\nAs soon as you hit reload,\
    \ the user is navigated to back to `/`, the root of the app. This is clearly a\
    \ routing problem which the Vanilla Router package is suppose to handle. Head\
    \ back to `app.js` and look for this line:\n\n```\nrouter.navigateTo(window.location.path);\n\
    ```\n\nThis piece of code is supposed to route users to the correct page based\
    \ on the URL provided. But why isn't it working? Let's add a breakpoint here,\
    \ then navigate back to the `/convert` URL and try refreshing the page again.\n\
    \nAs soon as you refresh, the editor pauses at the breakpoint. Hover over the\
    \ express `windows.location.path`. A popup appears which says the value is `undefined`.\
    \ Let's go to the debug console and start typing the expression below:\n\n![Navigation\
    \ error](Images/15244283923-navigation-error.png)\n\nHold up! The debug console\
    \ just gave us the correct expression. It's supposed to read `window.location.pathname`.\
    \ Correct the line of code, remove the breakpoint and restart the debugging session.\n\
    \nNavigate to the `/convert` URL and refresh. The page should reload the correct\
    \ path. Awesome!\n\nThat's the last bug we're going to squash, but I do recommend\
    \ you keep on experimenting within the debug session. Set up new breakpoints in\
    \ order to inspect other variables. For example, check out the `response` object\
    \ in the `router('/convert')` function. This demonstrates how you can use a debug\
    \ session to figure out the data structure returned by an API request when dealing\
    \ with new REST endpoints.\n\n![Response inspect](Images/152442840424-response-inspect.png)\n\
    \n## Summary\n\nNow that we’ve come to the end of this tutorial, you should be\
    \ proud of yourself for learning a vital skill in programming. Learning how to\
    \ debug code properly will help you fix errors faster. You should be aware, however,\
    \ that this article only scratches the surface of what’s possible, and you should\
    \ take a look at the complete [debugging documentation](https://code.visualstudio.com/docs/editor/debugging)\
    \ for VS Code. Here you'll find more details about specific commands and also\
    \ types of breakpoint we haven't covered, such as [Conditional Breakpoints](https://code.visualstudio.com/docs/editor/debugging#_conditional-breakpoints).\n\
    \nI hope from now on you'll stop using `console.log` to debug and instead reach\
    \ for VS Code to start debugging JavaScript like a pro!\n\n# Chapter 6: Introducing\
    \ Axios, a Popular, Promise-based HTTP Client\n\n### by Nilson Jacques\n\n[Axios](https://www.npmjs.com/package/axios)\
    \ is a popular, promise-based HTTP client that sports an easy-to-use API and can\
    \ be used in both the browser and Node.js.\n\nMaking HTTP requests to fetch or\
    \ save data is one of the most common tasks a client-side JavaScript application\
    \ will need to do. Third-party libraries — especially jQuery — have long been\
    \ a popular way to interact with the more verbose browser APIs, and abstract away\
    \ any cross-browser differences.\n\nAs people move away from jQuery in favor of\
    \ improved native DOM APIs, or front-end UI libraries like React and Vue.js, including\
    \ it purely for its `$.ajax` functionality makes less sense.\n\nLet’s take a look\
    \ at how to get started using Axios in your code, and see some of the features\
    \ that contribute to its popularity among JavaScript developers.\n\n## Axios vs\
    \ Fetch\n\nAs you’re probably aware, modern browsers ship with the newer [Fetch\
    \ API](https://www.sitepoint.com/introduction-to-the-fetch-api/) built in, so\
    \ why not just use that? There are several differences between the two that many\
    \ feel gives Axios the edge.\n\nOne such difference is in how the two libraries\
    \ treat [HTTP error codes](https://en.wikipedia.org/List_of_HTTP_status_codes).\
    \ When using Fetch, if the server returns 4xx series error, your `catch()` callback\
    \ won’t be triggered. Axios, on the other hand, will reject the request if one\
    \ of these codes is returned.\n\nAnother small difference, which often trips up\
    \ developers new to the API, is that Fetch doesn’t automatically send cookies\
    \ back to the server when making a request. It’s necessary to explicitly pass\
    \ an option for them to be included. Axios has your back here.\n\nOne difference\
    \ that may end up being a show-stopper for some is progress updates on uploads/downloads.\
    \ As Axios is built on top of the older XHR API, you’re able to register callback\
    \ functions for `onUploadProgress` and `onDownloadProgress` to display the percentage\
    \ complete in your app’s UI. Currently, Fetch has no support for doing this.\n\
    \nLastly, Axios can be used in both the browser and Node.js. This facilitates\
    \ sharing JavaScript code between the browser and back end or doing server-side\
    \ rendering of your front-end apps.\n\n#### Fetch API for Node\n\nthere are versions\
    \ of the [Fetch API available for Node](https://www.npmjs.com/package/isomorphic-fetch)\
    \ but, in my opinion, the other features Axios provides give it the edge.\n\n\
    ## Installing\n\nAs you might expect, the most common way to install Axios is\
    \ via the npm package manager:\n\n```\nnpm i axios\n```\n\nand include it in your\
    \ code where needed:\n\n```\n// ES2015 style import\nimport axios from 'axios';\n\
    \n// Node.js style require\nconst axios = require('axios');\n```\n\nIf you’re\
    \ not using some kind of module bundler (e.g. webpack), then you can always pull\
    \ in the library from a CDN in the traditional way:\n\n```\n<script src=\"https://unpkg.com/axios/dist/axios.min.js\"\
    ></script>\n```\n\n### Browser support\n\nAxios works in all modern web browsers,\
    \ and Internet Explorer 8+.\n\n## Making Requests\n\nSimilar to jQuery’s `$.ajax`\
    \ function, you can make any kind of HTTP request by passing an options object\
    \ to Axios:\n\n```\naxios({\n  method: 'post',\n  url: '/login',\n  data: {\n\
    \    user: 'brunos',\n    lastName: 'ilovenodejs'\n  }\n});\n```\n\nHere, we’re\
    \ telling Axios which HTTP method we’d like to use (e.g. GET/POST/DELETE etc.)\
    \ and which URL the request should be made to.\n\nWe’re also providing some data\
    \ to be sent along with the request in the form of a simple JavaScript object\
    \ of key/value pairs. By default, Axios will serialize this as JSON and send it\
    \ as the request body.\n\n### Request Options\n"
  raw: "Hmm … that's not right. The place is added, but the country is not being displayed.\
    \ The problem obviously isn't the HTML table code, since the first row has the\
    \ country cell populated, so something must be happening on the JavaScript side.\
    \ Open `app.js` and add a breakpoint on line 58 where it says:\n\n```\naddPlace(city,\
    \ country);\n```\n\nRestart the debug session and try to add a new place again.\
    \ The execution should pause at the breakpoint you just set. Start hovering over\
    \ the relevant variables. You can also add expressions to the watch panel, as\
    \ seen below:\n\n![Country bug found](Images/152442838920-country-bug-found.png)\n\
    \nAs you can see, the `country` variable is undefined, but the `city` variable\
    \ is. If you look at the jQuery selector expressions that have been set up in\
    \ the watch panel, you'll notice that the `#country` selector returns nothing.\
    \ This means it wasn't present in the DOM. Head over to `index.html` to verify.\n\
    \nAlas! If you look at line 59 where the country input has been defined, it's\
    \ missing the ID attribute. You need to add one like this:\n\n```\n<input type=\"\
    text\" placeholder=\"Enter Country\" name=\"country\" id=\"country\">\n```\n\n\
    Restart the debugging session and try to add a new place.\n\n![Country bug fixed](Images/152442839121-country-fixed.png)\n\
    \nIt now works! Great job fixing another bug without `console.log`. Let's now\
    \ move on to our final bug.\n\n## Debugging Client-side Routing\n\nClick the *Convert*\
    \ link in the navigation bar. You should be taken to this view to perform a quick\
    \ conversion:\n\n![Convert currency](Images/152442839322-convert-currency.png)\n\
    \nThat runs fine. No bugs there.\n\nActually there are, and they have nothing\
    \ to do with the form. To spot them, refresh the page.\n\nAs soon as you hit reload,\
    \ the user is navigated to back to `/`, the root of the app. This is clearly a\
    \ routing problem which the Vanilla Router package is suppose to handle. Head\
    \ back to `app.js` and look for this line:\n\n```\nrouter.navigateTo(window.location.path);\n\
    ```\n\nThis piece of code is supposed to route users to the correct page based\
    \ on the URL provided. But why isn't it working? Let's add a breakpoint here,\
    \ then navigate back to the `/convert` URL and try refreshing the page again.\n\
    \nAs soon as you refresh, the editor pauses at the breakpoint. Hover over the\
    \ express `windows.location.path`. A popup appears which says the value is `undefined`.\
    \ Let's go to the debug console and start typing the expression below:\n\n![Navigation\
    \ error](Images/152442839923-navigation-error.png)\n\nHold up! The debug console\
    \ just gave us the correct expression. It's supposed to read `window.location.pathname`.\
    \ Correct the line of code, remove the breakpoint and restart the debugging session.\n\
    \nNavigate to the `/convert` URL and refresh. The page should reload the correct\
    \ path. Awesome!\n\nThat's the last bug we're going to squash, but I do recommend\
    \ you keep on experimenting within the debug session. Set up new breakpoints in\
    \ order to inspect other variables. For example, check out the `response` object\
    \ in the `router('/convert')` function. This demonstrates how you can use a debug\
    \ session to figure out the data structure returned by an API request when dealing\
    \ with new REST endpoints.\n\n![Response inspect](Images/152442840424-response-inspect.png)\n\
    \n## Summary\n\nNow that we’ve come to the end of this tutorial, you should be\
    \ proud of yourself for learning a vital skill in programming. Learning how to\
    \ debug code properly will help you fix errors faster. You should be aware, however,\
    \ that this article only scratches the surface of what’s possible, and you should\
    \ take a look at the complete [debugging documentation](https://code.visualstudio.com/docs/editor/debugging)\
    \ for VS Code. Here you'll find more details about specific commands and also\
    \ types of breakpoint we haven't covered, such as [Conditional Breakpoints](https://code.visualstudio.com/docs/editor/debugging#_conditional-breakpoints).\n\
    \nI hope from now on you'll stop using `console.log` to debug and instead reach\
    \ for VS Code to start debugging JavaScript like a pro!\n\n# Chapter 6: Introducing\
    \ Axios, a Popular, Promise-based HTTP Client\n\n### by Nilson Jacques\n\n**[Axios](https://www.npmjs.com/package/axios)\
    \ is a popular, promise-based HTTP client that sports an easy-to-use API and can\
    \ be used in both the browser and Node.js.**\n\nMaking HTTP requests to fetch\
    \ or save data is one of the most common tasks a client-side JavaScript application\
    \ will need to do. Third-party libraries — especially jQuery — have long been\
    \ a popular way to interact with the more verbose browser APIs, and abstract away\
    \ any cross-browser differences.\n\nAs people move away from jQuery in favor of\
    \ improved native DOM APIs, or front-end UI libraries like React and Vue.js, including\
    \ it purely for its `$.ajax` functionality makes less sense.\n\nLet’s take a look\
    \ at how to get started using Axios in your code, and see some of the features\
    \ that contribute to its popularity among JavaScript developers.\n\n## Axios vs\
    \ Fetch\n\nAs you’re probably aware, modern browsers ship with the newer [Fetch\
    \ API](https://www.sitepoint.com/introduction-to-the-fetch-api/) built in, so\
    \ why not just use that? There are several differences between the two that many\
    \ feel gives Axios the edge.\n\nOne such difference is in how the two libraries\
    \ treat [HTTP error codes](https://en.wikipedia.org/wiki/List_of_HTTP_status_codes#4xx_Client_errors).\
    \ When using Fetch, if the server returns a 4xx or 5xx series error, your `catch()`\
    \ callback won’t be triggered and it is down to the developer to check the response\
    \ status code to determine if the request was successful. Axios, on the other\
    \ hand, will reject the request promise if one of these status codes is returned.\n\
    \nAnother small difference, which often trips up developers new to the API, is\
    \ that Fetch doesn’t automatically send cookies back to the server when making\
    \ a request. It’s necessary to explicitly pass an option for them to be included.\
    \ Axios has your back here.\n\nOne difference that may end up being a show-stopper\
    \ for some is progress updates on uploads/downloads. As Axios is built on top\
    \ of the older XHR API, you’re able to register callback functions for `onUploadProgress`\
    \ and `onDownloadProgress` to display the percentage complete in your app’s UI.\
    \ Currently, Fetch has no support for doing this.\n\nLastly, Axios can be used\
    \ in both the browser and Node.js. This facilitates sharing JavaScript code between\
    \ the browser and the back end or doing server-side rendering of your front-end\
    \ apps.\n\n#### Fetch API for Node\n\nthere are versions of the [Fetch API available\
    \ for Node](https://www.npmjs.com/package/isomorphic-fetch) but, in my opinion,\
    \ the other features Axios provides give it the edge.\n\n## Installing\n\nAs you\
    \ might expect, the most common way to install Axios is via the npm package manager:\n\
    \n```\nnpm i axios\n```\n\nand include it in your code where needed:\n\n```\n\
    // ES2015 style import\nimport axios from 'axios';\n\n// Node.js style require\n\
    const axios = require('axios');\n```\n\nIf you’re not using some kind of module\
    \ bundler (e.g. webpack), then you can always pull in the library from a CDN in\
    \ the traditional way:\n\n```\n<script src=\"https://unpkg.com/axios/dist/axios.min.js\"\
    ></script>\n```\n\n### Browser support\n\nAxios works in all modern web browsers,\
    \ and Internet Explorer 8+.\n\n## Making Requests\n\nSimilar to jQuery’s `$.ajax`\
    \ function, you can make any kind of HTTP request by passing an options object\
    \ to Axios:\n\n```\naxios({\n  method: 'post',\n  url: '/login',\n  data: {\n\
    \    user: 'brunos',\n    lastName: 'ilovenodejs'\n  }\n});\n```\n\nHere, we’re\
    \ telling Axios which HTTP method we’d like to use (e.g. GET/POST/DELETE etc.)\
    \ and which URL the request should be made to.\n\nWe’re also providing some data\
    \ to be sent along with the request in the form of a simple JavaScript object\
    \ of key/value pairs. By default, Axios will serialize this as JSON and send it\
    \ as the request body.\n\n### Request Options"
