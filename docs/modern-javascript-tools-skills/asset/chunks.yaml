    \ either directly or indirectly by the instructions contained in this book, or\
    \ by the software or hardware products described herein.\n\n## Trademark Notice\n\
    \nRather than indicating every occurrence of a trademarked name as such, this\
    \ book uses the names only in an editorial fashion and to the benefit of the trademark\
    \ owner with no intention of infringement of the trademark.\n\n![SitePoint logo](Images/sitepoint-logo-2012.png)\n\
    \nPublished by SitePoint Pty. Ltd.\n\n48 Cambridge Street Collingwood\nVIC Australia\
    \ 3066\nWeb: www.sitepoint.com\nEmail: books@sitepoint.com\n\n## About SitePoint\n\
    \nSitePoint specializes in publishing fun, practical, and easy-to-understand content\
    \ for web professionals. Visit [http://www.sitepoint.com/](http://www.sitepoint.com/)\
    \ to access our blogs, books, newsletters, articles, and community forums. You’ll\
    \ find a stack of information on JavaScript, PHP, design, and more.\n\n# Preface\n\
    \nThere’s no doubt that the JavaScript ecosystem changes fast. Not only are new\
    \ tools and frameworks introduced and developed at a rapid rate, the language\
    \ itself has undergone big changes with the introduction of `ES2015` (aka `ES6`).\
    \ Understandably, many articles have been written complaining about how difficult\
    \ it is to learn modern JavaScript development these days. We're aiming to minimize\
    \ that confusion with this set of books on modern JavaScript.\n\nThis book outlines\
    \ essential tools and skills that every modern JavaScript developer should know.\n\
    \n## Who Should Read This Book?\n\nThis book is for all front-end developers who\
    \ wish to improve their JavaScript skills. You’ll need to be familiar with `HTML`\
    \ and `CSS` and have a reasonable level of understanding of `JavaScript` in order\
    \ to follow the discussion.\n\n## Conventions Used\n\n### Code Samples\n\nCode\
    \ in this book is displayed using a fixed-width font, like so:\n\n```\n <h1>A\
    \ Perfect Summer's Day</h1>\n<p>It was a lovely day for a walk in the park.\n\
    The birds were singing and the kids were all back at school.</p> \n```\n\nWhere\
    \ existing code is required for context, rather than repeat all of it, ⋮ will\
    \ be displayed:\n\n```\n function animate() {\n    ⋮\nnew_variable = \"Hello\"\
    ;\n}\n```\n\nSome lines of code should be entered on one line, but we’’ve had\
    \ to wrap them because of page constraints. An ➥ indicates a line break that exists\
    \ for formatting purposes only, and should be ignored:\n\n```\n URL.open(\"http://www.sitepoint.com/responsive-web-\n\
    ➥design-real-user-testing/?responsive1\");\n```\n\nYou’ll notice that we’ve used\
    \ certain layout styles throughout this book to signify different types of information.\
    \ Look out for the following items.\n\n### Tips, Notes, and Warnings\n\n#### Hey,\
    \ You!\n\nTips provide helpful little pointers.\n\n#### Ahem, Excuse Me ...\n\n\
    Notes are useful asides that are related—but not critical—to the topic at hand.\
    \ Think of them as extra tidbits of information.\n\n#### Make Sure You Always\
    \ ...\n\n... pay attention to these important points.\n\n#### Watch Out!\n\nWarnings\
    \ highlight any gotchas that are likely to trip you up along the way.\n\n# Chapter\
    \ 1: A Beginner’s Guide to Babel\n\n### by James Kolce\n\nThis article introduces\
    \ [Babel](https://babeljs.io/), a JavaScript compiler that allows developers to\
    \ use next-generation JavaScript today.\n\nIt can be frustrating to write JavaScript\
    \ when building web applications. We have to think about the features available\
    \ in the browsers we’re targeting and what happens when a feature isn’t implemented.\
    \ Some people would recommend simply not using it, which is a painful experience\
    \ most of the time if we’re building something complicated.\n\nThankfully, some\
    \ tools allow us to stop worrying about what’s supported and just write the best\
    \ code we can. They’re called transpilers. A `transpiler` is a tool that takes\
    \ source code as input and produces new source code as output, with a different\
    \ syntax but semantically as close as possible — or ideally equivalent — to the\
    \ original.\n\n`Babel` is pretty much the standard transpiler to translate modern\
    \ JavaScript (`ES2015+`) into compatible implementations that run in old browsers.\
    \ It’s the perfect solution if you just want to concentrate on writing JavaScript.\n\
    \nAnd although the main goal of `Babel` is to translate the latest standards of\
    \ `ECMAScript` (`ES`) for old — or sometimes current — browsers, it can do more.\
    \ There’s an ecosystem of presets and plugins that make possible the addition\
    \ of non-standard features as well. Each plugin makes a new feature/transformation\
    \ available for your code, and presets are just a collection of plugins.\n\n##\
    \ Getting Started\n\nThere are different ways to set up `Babel` depending on your\
    \ project and the tools you use. In this article, we’re going to explain how to\
    \ set up `Babel` using the `CLI`, although if you’re using a build system or framework,\
    \ you can check out specific instructions on the [official site](https://babeljs.io/docs/setup/).\n\
    \nThe first step to set up `Babel` in a project is to install the package using\
    \ `npm` and add it as a dev dependency. Assuming you have a working `Node.js`\
    \ environment in place, it’s just a matter of running the following in your terminal:\n\
    \n```\nmkdir babel-test\ncd babel-test\nnpm init -y\nnpm install --save-dev babel-cli\n\
    ```\n\nThis will create a directory (`babel-test`) change into it, initialize\
    \ an npm project (thus creating a `package.json` file).\n\nNext, we can open `package.json`\
    \ and add a `build` command to our npm scripts:\n\n```\n\"scripts\": {\n  \"build\"\
    : \"babel src -d dist\"\n}\n```\n\nThis will take the source files from the `src`\
    \ directory and output the result in a `dist` directory.\n\nBut wait! Before running\
    \ `Babel` we must install and set up the plugins that will transform our code.\
    \ The easiest and quickest way to do this is to add the [Env preset](https://babeljs.io/docs/plugins/preset-env/),\
    \ which selects the appropriate plugins depending on the target browsers that\
    \ you indicate. It can be installed using:\n\n```\nnpm install babel-preset-env\
    \ --save-dev\n```\n\nThen create a `.babelrc` file in the root of your project\
    \ and add the preset:\n\n```\n{\n  \"presets\": [\"env\"]\n}\n```\n\nThe `.babelrc`\
    \ file is the place where you put all your settings for `Babel`. You’ll be using\
    \ this primarily for setting up presets and plugins, but a lot more options are\
    \ available. You can check the complete list in the [Babel API page](https://babeljs.io/docs/usage/api/#options).\n\
    \nPlease note that, depending on your operating system, files beginning with a\
    \ dot will be hidden by default. If this is problematic for you (or if you just\
    \ prefer fewer files), you can put your Babel settings in the `package.json` file,\
    \ under a `babel` key, like so:\n\n```json{\n  \"name\": \"babel-test\",\n  \"\
    version\": \"1.0.0\",\n  \"babel\": {\n    // config\n  }\n}\n```\n"
