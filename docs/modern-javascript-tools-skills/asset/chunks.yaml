    \ = require('clean-webpack-plugin');\n+ const HtmlWebpackPlugin = require('html-webpack-plugin');\n\
    \n  module.exports = {\n    ...\n+   plugins: [\n+     new CleanWebpackPlugin(['dist']),\n\
    +     new HtmlWebpackPlugin({\n+       title: 'My killer app'\n+     })\n+   ]\n\
    \  }\n```\n\nNow every time we build, dist will be cleared out. We’ll now see\
    \ `index.html` output too, with the correct paths to our entry bundles.\n\nRunning\
    \ `npm run develop` produces this:\n\n```\n<!DOCTYPE html>\n<html>\n  <head>\n\
    \    <meta charset=\"UTF-8\">\n    <title>My killer app</title>\n  </head>\n \
    \ <body>\n    <script type=\"text/javascript\" src=\"app.bundle.js\"></script>\n\
    \  </body>\n</html>\n```\n\nAnd `npm run build` produces this:\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n  <head>\n    <meta charset=\"UTF-8\">\n    <title>My killer\
    \ app</title>\n    <link href=\"style.css\" rel=\"stylesheet\">\n  </head>\n \
    \ <body>\n    <script type=\"text/javascript\" src=\"app.bundle.js\"></script>\n\
    \  </body>\n</html>\n```\n\n## Development\n\nThe webpack-dev-server provides\
    \ you with a simple web server and gives you *live reloading*, so you don’t need\
    \ to manually refresh the page to see changes.\n\n```\nnpm install --save-dev\
    \ webpack-dev-server\n```\n\n**package.json**\n\n```\n {\n    ...\n    \"scripts\"\
    : {\n-     \"develop\": \"webpack --watch --config webpack.dev.js\",\n+     \"\
    develop\": \"webpack-dev-server --config webpack.dev.js\",\n    }\n    ...\n \
    \ }\n```\n\n```\n> npm run develop\n\nℹ ｢wds｣: Project is running at http://localhost:8080/\n\
    ℹ ｢wds｣: webpack output is served from /\n```\n\nOpen up http://localhost:8080/\
    \ in the browser and make a change to one of the JavaScript or CSS files. You\
    \ should see it build and refresh automatically.\n\n### HotModuleReplacement\n\
    \nThe `HotModuleReplacement` plugin goes one step further than Live Reloading\
    \ and swaps out modules at runtime *without the refresh*. When configured correctly,\
    \ this saves a huge amount of time during development of single page apps. Where\
    \ you have a lot of state in the page, you can make incremental changes to components,\
    \ and only the changed modules are replaced and updated.\n\n**webpack.dev.js**"
