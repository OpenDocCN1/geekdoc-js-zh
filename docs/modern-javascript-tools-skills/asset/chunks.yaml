  trans: "\n\n你可以从 [nodejs.org/download/](https://nodejs.org/download/) 下载适用于 Windows、macOS\
    \ 和 Linux 的 Node.js。提供从二进制文件、包管理器和 Docker 镜像安装的多种选项。\n\n## Windows 用户\n\nNode.js\
    \ 和 `Gulp` 可以在 Windows 上运行，但某些插件如果依赖原生 Linux 二进制文件（如图像压缩库），它们可能无法安装或运行。Windows\
    \ 10 用户的一种可选方案是使用新的 [bash 命令行](https://msdn.microsoft.com/en-us/commandline/wsl/install_guide)，它可以解决许多问题。\n\
    \n安装完成后，打开命令提示符并输入：\n\n```\nnode -v\n```\n\n这会显示版本号。你将要频繁使用 `npm` —— 用于安装模块的 Node.js\
    \ 包管理器。检查它的版本号：\n\n```\nnpm -v\n```\n\n## 针对 Linux 用户\n\nNode.js 模块可以全局安装，这样它们在整个系统中都可用。然而，除非在\
    \ `npm` 命令前加上 `sudo`，否则大多数用户没有权限写入全局目录。有许多[修复 npm 权限的选项](https://docs.npmjs.com/getting-started/fixing-npm-permissions)以及像\
    \ [nvm 帮助](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/) 这样的工具，但我经常会更改默认目录。例如，在基于\
    \ Ubuntu/Debian 的平台上：\n\n```\ncd ~\n        mkdir .node_modules_global\n     \
    \   npm config set prefix=$HOME/.node_modules_global\n        npm install npm\
    \ -g \n```\n\n然后将以下行添加到 `~/.bashrc` 的文件末尾：\n\n```\nexport PATH=\"$HOME/.node_modules_global/bin:$PATH\"\
    \ \n```\n\n最后，使用此命令更新：\n\n```\nsource ~/.bashrc \n```\n\n## 步骤 2：全局安装 Gulp\n\n\
    全局安装 `gulp` 命令行界面，以便可以在任何项目文件夹中运行 `gulp` 命令：\n\n```\nnpm install gulp-cli -g\n\
    ```\n\n使用以下命令验证 `Gulp` 是否已安装：\n\n```\ngulp -v\n```\n\n## 步骤 3：配置你的项目\n\n### 针对\
    \ Node.js 项目\n\n如果你已经有了一个 `package.json` 配置文件，可以跳过此步骤。\n\n假设你在 `project1` 文件夹中有一个新项目或已存在的项目。进入该文件夹并使用\
    \ `npm` 初始化：\n\n```\ncd project1\nnpm init\n```\n\n你将会被问一系列问题。输入值或按 `Return` 键接受默认值。完成后将创建一个\
    \ `package.json` 文件，用于存储你的 `npm` 配置设置。\n\n### 针对 Git 用户\n\nNode.js 将模块安装在 `node_modules`\
    \ 文件夹中。你应该将其添加到 `.gitignore` 文件中，以确保它们不会被提交到仓库中。当将项目部署到另一台电脑时，你可以运行 `npm install`\
    \ 来恢复这些模块。\n\n在本文的剩余部分，我们假设你的项目文件夹包含以下子文件夹：\n\n`src` 文件夹：预处理过的源文件\n\n它包含以下子文件夹：\n\
    \n* `html` - HTML 源文件和模板\n* `images` — 原始未压缩图像\n* `js` — 多个预处理过的脚本文件\n* `scss`\
    \ — 多个预处理过的 Sass `.scss` 文件\n\n`build` 文件夹：编译/处理后的文件\n\nGulp 将根据需要创建文件和子文件夹：\n\
    \n* `html` — 编译后的静态 HTML 文件\n* `images` — 压缩后的图像\n* `js` — 单个合并并压缩的 JavaScript\
    \ 文件\n* `css` — 单个编译并压缩的 CSS 文件\n\n你的项目几乎肯定会有不同，但下面的示例使用了此结构。\n\n### 在 Unix 上跟随操作\n\
    \n如果你使用的是基于 Unix 的系统，并且只想跟随本教程操作，可以使用以下命令重建文件夹结构：\n\n```\nmkdir -p src/{html,images,js,scss}\
    \ build/{html,images,js,css} \n```\n\n## 步骤 4：本地安装 Gulp\n\n你现在可以使用以下命令在项目文件夹中安装\
    \ `Gulp`：\n\n```\nnpm install gulp --save-dev\n```\n\n这会将 `Gulp` 作为开发依赖安装，并相应地更新\
    \ `package.json` 中的 `\"devDependencies\"` 部分。\n\n### 备用部署方案\n\n当操作系统上的 `NODE_ENV`\
    \ 环境变量设置为 `production` 时，不会安装开发依赖。你通常会在生产服务器上使用 Mac/Linux 命令执行此操作：\n\n```\nexport\
    \ NODE_ENV=production\n```\n\n或在 Windows 上：\n\n```\nset NODE_ENV=production\n\
    ```\n\n本教程假设你的资源将编译到 `build` 文件夹，并提交到你的 Git 仓库或直接上传到服务器。然而，如果你想更改创建资源的方式，那么在生产服务器上构建资源可能更好。例如，HTML、CSS\
    \ 和 JavaScript 文件在生产环境中会经过压缩，但在开发环境中不是。在这种情况下，对 `Gulp` 和所有插件使用 `--save` 选项，即：\n\
    \n```\nnpm install gulp --save\n```\n\n这会将 `Gulp` 设置为 `package.json` 中 `\"dependencies\"\
    ` 部分的应用程序依赖。当你输入 `npm install` 时它会被安装，并且可以在项目部署的任何地方运行。你可以从仓库中移除 `build` 文件夹，因为在需要时可以在任何平台上创建这些文件。\n\
    \n## 步骤 4：创建 Gulp 配置文件\n\n在根目录下创建一个新的 `gulpfile.js` 配置文件。添加一些基础代码开始：\n\n```javascript\n\
    // Gulp.js configuration\nvar\n  // modules\n  gulp = require('gulp'),\n\n  //\
    \ development mode\n  devBuild = (process.env.NODE_ENV !== 'production'),\n\n\
    \  // folders\n  folder = {\n    src: 'src/',\n    build: 'build/'\n  };\n```\n\
    \n这引用了 `gulp` 模块，在开发模式下将 `devBuild` 设置为 `true`，并定义了源文件和构建位置。\n\n### ES6\n\nNode\
    \ 6 及以上版本支持 ES6 特性，所以如果你使用的是新版本，`gulpfile.js` 还没有...\n\n## 步骤 5：创建 Gulp 任务\n\n\
    Gulp 本身无用。你必须：\n\n1. 安装 Gulp 插件，以及\n2. 编写利用这些插件完成有用任务的任务。\n\n编写自己的插件，，由于已有 3000\
    \ 多个插件，你可能不需要。你可以搜索来利用其强大的功能。\n\nGulp 提供了三个主要的任务方法：\n\n* `gulp.task` — 定义一个带有名称、可选依赖数组和函数的任务任务。\n\
    * `gulp.src` — 设置源文件的位置。\n* `gulp.dest` — 设置构建文件存放的位置。\n\n任何数量的插件调用都在 `.src` 和\
    \ `.dest` 之间通过 `pipe` 设置。\n\n### 图像任务\n\n通过示例演示效果最好，因此让我们创建一个基础任务来压缩图像并移动到相应的\
    \ `build` 文件夹。由于这个过程需要时间，我们将只压缩新的和修改过的文件有两个插件可以帮助我们：[gulp-newer](https://www.npmjs.com/package/gulp-newer)\
    \ 和 [gulp-imagemin](https://www.npmjs.com/package/gulp-imagemin)。从命令行安装它们：\n\n\
    ```\nnpm install gulp-newer gulp-imagemin --save-dev\n```\n\n我们现在可以在 `gulpfile.js`\
    \ 顶部引用这两个模块：\n\n```javascript\n// Gulp.js configuration\n\nvar\n  // modules\n\
    \  gulp = require('gulp'),\n  newer = require('gulp-newer'),\n  imagemin = require('gulp-imagemin'),\n\
    ```\n\n我们现在可以在 `gulpfile.js` 的末尾以函数的形式定义图像处理任务本身：\n\n"
- fmt: "\n```javascript\n// image processing\ngulp.task('images', function() {\n \
    \ var out = folder.build + 'images/';\n  return gulp.src(folder.src + 'images/**/*')\n\
    \    .pipe(newer(out))\n    .pipe(imagemin({ optimizationLevel: 5 }))\n    .pipe(gulp.dest(out));\n\
    });\n```\n\nAll tasks are syntactically similar. This code:\n\n1. Creates a new\
    \ task named `images`.\n2. Defines a function with a return value which …\n3.\
    \ Defines an `out` folder where build files will be located.\n4. Sets the Gulp\
    \ `src` source folder. The `/**/*` ensures that images in sub-folders are also\
    \ processed.\n5. Pipes all files to the `gulp-newer` module. Source files that\
    \ are newer than corresponding destination files are passed through. Everything\
    \ else is removed.\n6. The remaining new or changed files are piped through `gulp-imagemin`\
    \ which sets an optional `optimizationLevel` argument.\n7. The compressed images\
    \ are output to the Gulp `dest` folder set by `out`.\n\nSave `gulpfile.js` and\
    \ place a few images in your project's `src/images` folder before running the\
    \ task from the command line:\n\n```bash\ngulp images\n```\n\nAll images are compressed\
    \ accordingly and you’ll see output such as:\n\n```text\nUsing file gulpfile.js\n\
    Running 'imagemin'...\nFinished 'imagemin' in 5.71 ms\ngulp-imagemin: image1.png\
    \ (saved 48.7 kB)\ngulp-imagemin: image2.jpg (saved 36.2 kB)\ngulp-imagemin: image3.svg\
    \ (saved 12.8 kB)\n```\n\nTry running `gulp images` again and nothing should happen\
    \ because no newer images exist.\n\n## HTML Task\n\nWe can now create a similar\
    \ task which copies files from the source HTML folder. We can safely minify our\
    \ HTML code to remove unnecessary whitespace and attributes using the [gulp-htmlclean](https://www.npmjs.com/package/gulp-htmlclean)`gulp-htmlclean`](https://www.npmjs.com/package/gulp-htmlclean)\
    \ plugin:\n\n```bash\nnpm install gulp-htmlclean --save-dev\n```\n\nThis is then\
    \ referenced at the top of `gulpfile.js`:\n\n```javascript\nvar\n  // modules\n\
    \  gulp = require('gulp'),\n  newer = require('gulp-newer'),\n  imagemin = require('gulp-imagemin'),\n\
    \  htmlclean = require('gulp-htmlclean'),\n```\n\nWe can now create an `html`\
    \ task at the end of `gulpfile.js`:\n\n```javascript\n// HTML processing\ngulp.task('html',\
    \ ['images'], function() {\n  var\n    out = folder.build + 'html/',\n    page\
    \ = gulp.src(folder.src + 'html/**/*')\n      .pipe(newer(out));\n\n  // minify\
    \ production code\n  if (!devBuild) {\n    page = page.pipe(htmlclean());\n  }\n\
    \n  return page.pipe(gulp.dest(out));\n});\n```\n\nThis reuses `gulp-newer` and\
    \ introduces a couple of concepts:\n\n1. The `[images]` argument states that our\
    \ `images` task must be run before processing the HTML (the HTML is likely to\
    \ reference images). Any number of dependent tasks can be listed in this array\
    \ and all will complete before the task function runs.\n2. We only pipe the HTML\
    \ through `gulp-htmlclean` if `NODE_ENV` is set to `production`. Therefore, the\
    \ HTML remains uncompressed during development which may be useful for debugging.\n\
    \nSave `gulpfile.js` and run `gulp html` from the command line. Both the `html`\
    \ and `images` tasks will run.\n\n## JavaScript Task\n\nToo easy for you? Let's\
    \ process all our JavaScript files by building a basic module bundler. It will:\n\
    \n1. Ensure dependencies are loaded first using the [gulp-deporder](https://www.npmjs.com/package/gulp-deporder)`gulp-deporder`](https://www.npmjs.com/package/gulp-deporder)\
    \ plugin. This analyses comments at the top of each script to ensure correct ordering.\
    \ For example, `// requires: defaults.js lib.js`.\n2. Concatenate all script files\
    \ into a single `main.js` file using [gulp-concat](https://www.npmjs.com/package/gulp-concat)`gulp-concat`](https://www.npmjs.com/package/gulp-concat).\n\
    3. Remove all `console` and `debugging` statements with [gulp-strip-debug](https://www.npmjs.com/package/gulp-strip-debug)`gulp-strip-debug`](https://www.npmjs.com/package/gulp-strip-debug)\
    \ and minimize code with [gulp-uglify](https://www.npmjs.com/package/gulp-uglify)`gulp-uglify`](https://www.npmjs.com/package/gulp-uglify).\
    \ This step will only occur when running in production mode.\n\nInstall the plugins:\n\
    \n```bash\nnpm install gulp-deporder gulp-concat gulp-strip-debug gulp-uglify\
    \ --save-dev\n```\n\nReference them at the top of `gulpfile.js`:\n\n```javascript\n\
    var\n  ...\n  concat = require('gulp-concat'),\n  deporder = require('gulp-deporder'),\n\
    \  stripdebug = require('gulp-strip-debug'),\n  uglify = require('gulp-uglify'),\n\
    ```\n\nThen add a new `js` task:\n\n```javascript\n// JavaScript processing\n\
    gulp.task('js', function() {\n\n  var jsbuild = gulp.src(folder.src + 'js/**/*')\n\
    \    .pipe(deporder())\n    .pipe(concat('main.js'));\n\n  if (!devBuild) {\n\
    \    jsbuild = jsbuild\n      .pipe(stripdebug())\n      .pipe(uglify());\n  }\n\
    \n  return jsbuild.pipe(gulp.dest(folder.build + 'js/'));\n\n});\n```\n\nSave\
    \ then run `gulp js` to watch the magic happen!\n\n## CSS Task\n\nFinally, let’s\
    \ create a CSS task. Note the `images` task is set as a dependency because the\
    \ `postcss-assets` plugin can reference images during the build. In addition,\
    \ most plugins can be passed arguments (refer to their documentation): [gulp-sass](https://www.npmjs.com/package/gulp-sass)`gulp-sass`](https://www.npmjs.com/package/gulp-sass)\
    \ which compiles `.scss` to a single `.css`.\n\nFirst, install all modules:\n\n\
    ```bash\nnpm install gulp-sass postcss postcss-assets autoprefixer mqpacker cssnano\n\
    ```\n\nReference them at the top of `gulpfile.js`:\n\n```javascript\nvar\n  ...\n\
    \  sass = require('gulp-sass'),\n  postcss = require('postcss'),\n  assets = require('postcss-assets'),\n\
    \  autoprefixer = require('autoprefixer'),\n  mqpacker = require('mqpacker'),\n\
    \  cssnano = require('cssnano'),\n```\n\nWe can now create a `css` task at the\
    \ end of `gulpfile.js`:\n\n```javascript\n// CSS processing\ngulp.task('css',\
    \ ['images'], function() {\n\n  var postCssOpts = [\n    assets({ loadPaths: ['images/']\
    \ }),\n    autoprefixer({ browsers: ['last 2 versions', '> 2%'] }),\n    mqpacker\n\
    \  ];\n\n  if (!devBuild) {\n    postCssOpts.push(cssnano);\n  }\n\n  return gulp.src(folder.src\
    \ + 'scss/main.scss')\n    .pipe(sass({\n      outputStyle: 'nested',\n      imagePath:\
    \ 'images/',\n      precision: 3,\n      errLogToConsole: true\n    }))\n    .pipe(postcss(postCssOpts))\n\
    \    .pipe(gulp.dest(folder.build + 'css/'));\n\n});\n```\n\nSave the file and\
    \ run the task from the command line:\n\n```bash\ngulp css\n```\n\n## Step 6:\
    \ Automate Tasks\n\nWe've been running one task at a time. We can run them all\
    \ in one command by adding a new `run` task to `gulpfile.js`:\n\n```javascript\n\
    // run all tasks\ngulp.task('run', ['html', 'css', 'js']);\n```\n\nSave and enter\
    \ `gulp run` at the command line to execute all tasks. Note that I omitted the\
    \ `images` task because it's already set as a dependency for the `html` and `css`\
    \ tasks.\n\nIs this still too much hard work? Gulp offers another method — `gulp.watch`\
    \ — which can monitor your source files and run an appropriate task whenever a\
    \ file is changed. Let's create a new `watch` task at the end of `gulpfile.js`:\n"
