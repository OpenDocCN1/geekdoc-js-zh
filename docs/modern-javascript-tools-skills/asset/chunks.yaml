  trans: "\n在浏览器中打开 `http://localhost:5000` 并观察发生了什么。初始只获取了 `bundle.js`。当点击按钮时，聊天模块被导入并初始化。\n\
    \n![显示分块懒加载的网络请求](img/1521906882lazy-loading.png)\n\n只需少少精力，我们就为应用添加了动态代码分割和模块的懒加载。这是构建高性能\
    \ Web 应用程序的绝佳起点。\n\n## 插件\n\n虽然 `loaders` 在单个文件上执行转换，但 `plugins` 在跨越更大的代码块上进行操作。\n\
    \n现在我们正在打包代码、外部模块*以及*静态资源，我们的包体积将会增长——*非常快*。插件的作用是帮助我们以智能的方式分割代码，并为生产环境进行优化。\n\
    \n在不经意间，我们已经使用了许多[带有“mode”的默认 Webpack 插件](https://webpack.js.org/concepts/mode/#usage)\n\
    \n### development\n\n*   提供值为“development”的 `process.env.NODE_ENV`\n*   `NamedModulesPlugin`\n\
    \n### production\n\n*   提供值为“production”的 `process.env.NODE_ENV`\n*   `UglifyJsPlugin`\n\
    *   `ModuleConcatenationPlugin`\n*   `NoEmitOnErrorsPlugin`\n\n#### Production\n\
    \n在添加额外的插件之前，我们首先拆分配置，以便针对每个环境应用特定的插件。\n\n将 `webpack.config.js` 重命名为 `webpack.common.js`，并为开发和生产添加配置文件。\n\
    \n```\n- |- webpack.config.js\n+ |- webpack.common.js\n+ |- webpack.dev.js\n+\
    \ |- webpack.prod.js\n```\n\n我们将使用 `webpack-merge` 将通用配置与特定环境的配置合并：\n\n```bash\n\
    npm install --save-dev webpack-merge\n```\n\n#### webpack.dev.js\n\n```javascript\n\
    const merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
    \nmodule.exports = merge(common, {\n  mode: 'development'\n})\n```\n\n#### webpack.prod.js\n\
    \n```javascript\nconst merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
    \nmodule.exports = merge(common, {\n  mode: 'production'\n})\n```\n\n#### package.json\n\
    \n```json\n \"scripts\": {\n-    \"develop\": \"webpack --watch --mode development\"\
    ,\n-    \"build\": \"webpack --mode production\"\n+    \"develop\": \"webpack\
    \ --watch --config webpack.dev.js\",\n+    \"build\": \"webpack --config webpack.prod.js\"\
    \n   },\n```\n\n现在我们可以将开发环境特定的插件添加到 `webpack.dev.js`，将生产环境特定的插件添加到 `webpack.prod.js`。\n\
    \n#### Split CSS\n\n在为生产环境打包时，使用 [ExtractTextWebpackPlugin](https://webpack.js.org/plugins/extract-text-webpack-plugin)\
    \ 将 CSS 从 JavaScript 分离被认为最佳实践。\n\n目前的 `.scss` loaders 非常非常适合开发，因此我们将把它们从 `webpack.common.js`\
    \ 移动到 `webpack.dev.js`，并仅在 `webpack.prod.js` 中添加 `ExtractTextWebpackPlugin`。\n\
    \n```bash\nnpm install --save-dev extract-text-webpack-plugin@4.0.0-beta.0\n```\n\
    \n#### webpack.common.js\n\n```javascript\n ...\n  module.exports = {\n    ...\n\
    \    module: {\n      rules: [\n        ...\n-       {\n-         test: /\\.scss$/,\n\
    -         use: [\n-           {\n-             loader: 'style-loader'\n-     \
    \      }, {\n-             loader: 'css-loader'\n-           }, {\n-         \
    \    loader: 'sass-loader'\n-           }\n-         ]\n-       },\n        ...\n\
    \      ]\n    }\n  }\n```\n\n#### webpack.dev.js\n\n```javascript\n const merge\
    \ = require('webpack-merge')\n  const common = require('./webpack.common.js')\n\
    \n  module.exports = merge(common, {\n    mode: 'development',\n+   module: {\n\
    +     rules: [\n+       {\n+         test: /\\.scss$/,\n+         use: [\n+  \
    \         {\n+             loader: 'style-loader'\n+           }, {\n+       \
    \      loader: 'css-loader'\n+           }, {\n+             loader: 'sass-loader'\n\
    +           }\n+         ]\n+       }\n+     ]\n+   }\n  })\n```\n\n#### webpack.prod.js\n\
    \n```javascript\n const merge = require('webpack-merge')\n+ const ExtractTextPlugin\
    \ = require('extract-text-webpack-plugin')\n  const common = require('./webpack.common.js')\n\
    \n  module.exports = merge(common, {\n    mode: 'production',\n+   module: {\n\
    +     rules: [\n+       {\n+         test: /\\.scss$/,\n+         use: ExtractTextPlugin.extract({\n\
    +           fallback: 'style-loader',\n+           use: ['css-loader', 'sass-loader']\n\
    +         })\n+       }\n+     ]\n+   },\n+   plugins: [\n+     new ExtractTextPlugin('style.css')\n\
    +   ]\n  })\n```\n\n让我们比较两个构建脚本的输出：\n\n```\n> npm run develop\n\nAsset       \
