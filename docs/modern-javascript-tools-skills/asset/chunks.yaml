    \n#### Watch Out!\n\nWarnings highlight any gotchas that are likely to trip you\
    \ up along the way.\n\n# Chapter 1: A Beginner’s Guide to Babel\n\n### by James\
    \ Kolce\n\n**This article introduces [Babel](https://babeljs.io/), a JavaScript\
    \ compiler that allows developers to use next-generation JavaScript today.**\n\
    \nIt can be frustrating to write JavaScript when building web applications. We\
    \ have to think about the features available in the browsers we’re targeting and\
    \ what happens when a feature isn’t implemented. Some people would recommend simply\
    \ not using it, which is a painful experience most of the time if we’re building\
    \ something complicated.\n\nThankfully, some tools allow us to stop worrying about\
    \ what’s supported and just write the best code we can. They’re called transpilers.\
    \ A **transpiler** is a tool that takes source code as input and produces new\
    \ source code as output, with a different syntax but semantically as close as\
    \ possible — or ideally equivalent — to the original.\n\nBabel is pretty much\
    \ the standard transpiler to translate modern JavaScript (ES2015+) into compatible\
    \ implementations that run in old browsers. It’s the perfect solution if you just\
    \ want to concentrate on writing JavaScript.\n\nAnd although the main goal of\
    \ Babel is to translate the latest standards of ECMAScript (ES) for old — or sometimes\
    \ current — browsers, it can do more. There’s an ecosystem of presets and plugins\
    \ that make possible the addition of non-standard features as well. Each plugin\
    \ makes a new feature/transformation available for your code, and presets are\
    \ just a collection of plugins.\n\n## Getting Started\n\nThere are different ways\
    \ to set up Babel depending on your project and the tools you use. In this article,\
    \ we’re going to explain how to set up Babel using the CLI, although if you’re\
    \ using a build system or framework, you can check out specific instructions on\
    \ the [official site](https://babeljs.io/docs/setup/). Most of the time the CLI\
    \ is the fastest and easiest way to get started, so if you’re a first-time user,\
    \ feel free to continue.\n\nThe first step to set up Babel in a project is to\
    \ install the package using npm and add it as a dev dependency. Assuming you have\
    \ a working Node.js environment already in place, it’s just a matter of running\
    \ the following in your terminal:\n\n```\nmkdir babel-test\ncd babel-test\nnpm\
    \ init -y\nnpm install --save-dev babel-cli\n```\n\nThis will create a directory\
    \ (`babel-test`) change into the directory, initialize an npm project (thus creating\
    \ a `package.json` file) and then install the babel-cli as a dev dependency.\n\
    \nIf you need any help with the above, please consult our tutorials on [installing\
    \ Node](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/) and [working\
    \ with npm](https://www.sitepoint.com/beginners-guide-node-package-manager/).\n\
    \nNext, we can open `package.json` and add a `build` command to our npm scripts:\n\
    \n```\n\"scripts\": {\n  \"build\": \"babel src -d dist\"\n}\n```\n\nThis will\
    \ take the source files from the `src` directory and output the result in a `dist`\
    \ directory. Then we can execute it as:\n\n```\nnpm run build\n```\n\nBut wait!\
    \ Before running Babel we must install and set up the plugins that will transform\
    \ our code. The easiest and quickest way to do this is to add the [Env preset](https://babeljs.io/docs/plugins/preset-env/),\
    \ which selects the appropriate plugins depending on the target browsers that\
    \ you indicate. It can be installed using:\n\n```\nnpm install babel-preset-env\
    \ --save-dev\n```\n\nThen create a `.babelrc` file in the root of your project\
    \ and add the preset:\n\n```\n{\n  \"presets\": [\"env\"]\n}\n```\n\nThe `.babelrc`\
    \ file is the place where you put all your settings for Babel. You’ll be using\
    \ this primarily for setting up presets and plugins, but a lot more options are\
    \ available. You can check the complete list in the [Babel API page](https://babeljs.io/docs/usage/api/#options).\n\
    \nPlease note that, depending on your operating system, files beginning with a\
