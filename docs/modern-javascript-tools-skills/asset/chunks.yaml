    \ hard-to-read messages, generates code that helps you to fix your code. If you’re\
    \ learning the language, the compiler itself can be of big help.\n\n```\nmodule\
    \ Main exposing (..)\n\nimport Html exposing (..)\n\n-- MAIN\n\nmain : Program\
    \ Never Model Msg\nmain =\n    Html.program\n        { init = init\n        ,\
    \ update = update\n        , view = view\n        , subscriptions = subscriptions\n\
    \        }\n\n-- INIT\n\ntype alias Model = String\n\ninit : ( Model, Cmd Msg\
    \ )\ninit = ( \"Hello World!\", Cmd.none )\n\n-- UPDATE\n\ntype Msg\n    = DoNothing\n\
    \nupdate : Msg -> Model -> ( Model, Cmd Msg )\nupdate msg model =\n    case msg\
    \ of\n        DoNothing ->\n            ( model, Cmd.none )\n\n-- VIEW\n\nview\
    \ : Model -> Html Msg\nview model =\n    div [] [text model]\n\n-- SUBSCRIPTIONS\n\
    \nsubscriptions : Model -> Sub Msg\nsubscriptions model =\n    Sub.none \n```\n\
    \nSitePoint has a handy [getting started with Elm](https://www.sitepoint.com/functional-reactive-programming-elm-introduction/)\
    \ article if you want to find out more.\n\n## PureScript\n\n[PureScript](http://www.purescript.org/)\
    \ is a purely functional and strongly typed programming language, created by Phil\
    \ Freeman. It aims to provide strong compatibility with available JavaScript libraries,\
    \ similar to Haskell in spirit, but keeping JavaScript at its core.\n\nA strong\
    \ point for PureScript is its minimalism. It doesn’t include any libraries for\
    \ functionality that would be considered essential in other languages. For example,\
    \ instead of including generators and promises in the compiler itself, you can\
    \ use specific libraries for the task. You can choose the implementation you want\
    \ for the feature you need, which allows a highly efficient and personalized experience\
    \ when using PureScript, while keeping the generated code as small as possible.\n\
    \nAnother distinctive feature of its compiler is the ability to make clean and\
