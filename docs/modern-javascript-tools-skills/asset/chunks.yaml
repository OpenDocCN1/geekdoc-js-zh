    \n*   [Cache busting with hashed filenames](https://webpack.js.org/guides/caching/)\n\
    \n*   [Splitting a vendor bundle](https://webpack.js.org/plugins/commons-chunk-plugin/#explicit-vendor-chunk)\n\
    \n# Chapter 3: An Introduction to Gulp.js\n\n### by Craig Buckler\n\n**Developers\
    \ spend precious little time coding. Even if we ignore irritating meetings, much\
    \ of the job involves basic tasks which can sap your working day:**\n\n*   generating\
    \ HTML from templates and content files\n\n*   compressing new and modified images\n\
    \n*   compiling Sass to CSS code\n\n*   removing `console` and `debugger` statements\
    \ from scripts\n\n*   transpiling ES6 to cross-browser–compatible ES5 code\n\n\
    *   code linting and validation\n\n*   concatenating and minifying CSS and JavaScript\
    \ files\n\n*   deploying files to development, staging and production servers.\n\
    \nTasks must be repeated every time you make a change. You may start with good\
    \ intentions, but the most infallible developer will forget to compress an image\
    \ or two. Over time, pre-production tasks become increasingly arduous and time-consuming;\
    \ you'll dread the inevitable content and template changes. It's mind-numbing,\
    \ repetitive work. Wouldn’t it be better to spend your time on more profitable\
    \ jobs?\n\nIf so, you need a *task runner* or *build process*.\n\n## That Sounds\
    \ Scarily Complicated!\n\nCreating a build process will take time. It's more complex\
    \ than performing each task manually, but over the long term, you’ll save hours\
    \ of effort, reduce human error and save your sanity. Adopt a pragmatic approach:\n\
    \n*   Automate the most frustrating tasks first.\n\n*   Try not to over-complicate\
    \ your build process. An hour or two is more than enough for the initial setup.\n\
    \n*   Choose task runner software and stick with it for a while. Don't switch\
    \ to another option on a whim.\n\nSome of the tools and concepts may be new to\
    \ you, but take a deep breath and concentrate on one thing at a time.\n\n## Task\
    \ Runners: the Options\n\nBuild tools such as [GNU Make](https://www.gnu.org/software/make/)\
    \ have been available for decades, but web-specific task runners are a relatively\
    \ new phenomenon. The first to achieve critical mass was [Grunt](http://gruntjs.com/)\
    \ — a Node.js task runner which used plugins controlled (originally) by a JSON\
    \ configuration file. Grunt was hugely successful, but there were a number of\
    \ issues:\n\n1.  Grunt required plugins for basic functionality such as file watching.\n\
    \n2.  Grunt plugins often performed multiple tasks, which made customisation more\
    \ awkward.\n\n3.  JSON configuration could become unwieldy for all but the most\
    \ basic tasks.\n\n4.  Tasks could run slowly because Grunt saved files between\
    \ every processing step.\n\nMany issues were addressed in later editions, but\
    \ [Gulp](http://gulpjs.com/) had already arrived and offered a number of improvements:\n\
    \n1.  Features such as file watching were built in.\n\n2.  Gulp plugins were *(mostly)*\
    \ designed to do a single job.\n\n3.  Gulp used JavaScript configuration code\
    \ that was less verbose, easier to read, simpler to modify, and provided better\
    \ flexibility.\n\n4.  Gulp was faster because it uses [Node.js streams](https://www.sitepoint.com/basics-node-js-streams/)\
    \ to pass data through a series of piped plugins. Files were only written at the\
    \ end of the task.\n\nOf course, Gulp itself isn't perfect, and new task runners\
    \ such as [Broccoli.js](http://broccolijs.com/), [Brunch](http://brunch.io/) and\
    \ [webpack](https://webpack.github.io/) have also been competing for developer\
    \ attention. More recently, [npm itself has been touted as a simpler option](https://www.sitepoint.com/guide-to-npm-as-a-build-tool/).\
    \ All have their pros and cons, but [Gulp remains the favorite and is currently\
    \ used by more than 40% of web developers](https://ashleynolan.co.uk/blog/frontend-tooling-survey-2016-results#js-task-runners).\n\
    \nGulp requires Node.js, but while some JavaScript knowledge is beneficial, developers\
    \ from all web programming faiths will find it useful.\n\n## What About Gulp 4?\n\
    \nThis tutorial describes how to use Gulp 3 — the most recent release version\
    \ at the time of writing. Gulp 4 has been in development for some time but remains\
    \ a beta product. It's possible to [use or switch to Gulp 4](https://www.joezimjs.com/javascript/complete-guide-upgrading-gulp-4/),\
    \ but I recommend sticking with version 3 until the final release.\n\n## Step\
    \ 1: Install Node.js"
