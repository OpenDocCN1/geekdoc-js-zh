    \n希望此列表向你介绍了可以帮助你工作流的新 VS Code 扩展。\n\n# 第 6 章：使用 VS Code 和 Chrome Debugger 调试\
    \ JavaScript 项目\n\n### 作者：Michael Wanyoike\n\n调试 JavaScript 并不是 编程中最有趣的部分，但它是一项关键技能。本文介绍了两个可以帮助你像专业人士一样调试\
    \ JavaScript 的工具。\n\n想象一下，如果 JavaScript 中不存在 `console.log()` 函数。我确信你问自己的第一个问题将会是：“我该如何确认我的代码运行正常呢？”\n\
    \n答案在于使用调试工具。长期以来，大多数开发者（包括我在内）一直在使用 `console.log` 来调试故障代码。它快速且易于使用。然而，如果你不知道错误在哪里以及是由什么引起的，有时情况会变得非常棘手。你经常发现自己在整个代码中到处布置\
    \ `console.log` 陷阱，看看哪一个能揭露罪祸首。\n\n为了解决这个问题，我们需要改变习惯并开始使用调试工具。有很多工具可用于调试 JavaScript\
    \ 代码，例如 Chrome 工具、[Node Debugger](https://www.sitepoint.com/debugging-javascript-node-debugger/)、`Node\
    \ Inspect` 等。事实上，每个[主流浏览器](https://www.w3schools.com/js/js_debugging.asp)都提供了自己的工具。\n\
    \n在本文中，我们将查看如何使用 Visual Studio Code 提供的调试功能。我们还将查看如何使用 [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
    \ 扩展，该扩展允许 VS Code 与 Chrome 开发工具集成。一旦完成，你将再也不想用 `console.log()` 了。\n\n## 先决条件\n\
    \n对于本教程，你只需要在[现代 JavaScript](https://www.sitepoint.com/anatomy-of-a-modern-javascript-application/)方面有坚实的基础。我们将查看如何使用\
    \ Visual Studio Code 提供的调试功能。我们还将查看如何使用 [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
    \ 扩展，该扩展允许 VS Code 与 Chrome 开发工具集成。一旦完成，你将再也不想用 `console.log()` 了。\n\n## 在 VS\
    \ Code 中调试 JavaScript\n\n我想让你查看的第一个文件是 `src/places.js`。你需要打开 `debug-project` 文件夹（*文件*\
    \ > *打开文件夹*）并在编辑器中选择该文件。\n\n```javascript\nconst places = [];\n\nmodule.exports\
    \ = {\n  places,\n\n  addPlace: (city, country) => {\n    const id = ++places.length;\n\
    \    let numType = 'odd';\n    if (id % 2) {\n      numType = 'even';\n    }\n\
    \    places.push({\n      id, city, country, numType,\n    });\n  },\n};\n```\n\
    \n代码非常简单，如果你有足够的编程经验，你可能会注意到它有几个 bug。如果你发现了，请忽略它们。如果没有发现，太完美了。让我们在底部添加几行代码来手动测试：\n\
    \n```javascript\nmodule.exports.addPlace('Mombasa', 'Kenya');\nmodule.exports.addPlace('Kingston',\
    \ 'Jamaica');\nmodule.exports.addPlace('Cape Town', 'South Africa');\n```\n\n\
    现在，我确定你已经很想用用 `console.log` 来输出 `places` 的值了。但我们不要这样做。相反，让我们添加断点。只需左键侧边栏（即行号旁边的空白区域）即可添加断点：\n\
    \n看到左侧的红点了吗？那些就是断点。断点只是告诉调试器在何处暂停执行的视觉指示。接下来，在操作栏上，点击调试按钮（显示“No Bugs Allowed”的图标）。\n\
    \n查看顶部区域。你会注意到有一个带红点的齿轮图标。只需点击它。系统会为你创建一个调试配置文件 `launch.json`。按如下方式更新配置，你就可以使用\
    \ VS Code 调试器运行 `places.js` 了：\n\n"
- fmt: "\n```json\n\"configurations\": [\n  {\n    \"type\": \"node\",\n    \"request\"\
    : \"launch\",\n    \"name\": \"Launch Places\",\n    \"program\": \"${workspaceFolder}\\\
    \\src\\\\places.js\"\n  }\n]\n```\n\n### Backslashes\n\nDepending on your operating\
    \ system, you might have to replace the double backslash (`\\\\`) with a single\
    \ forward slash (`/`).\n\nAfter you’ve saved the file, you'll notice that the\
    \ debug panel has a new dropdown, `Launch Places`. To run it, you can:\n\n* hit\
    \ the Green Play button on the debug panel\n* press `F5`\n* click `Debug` > `Start\
    \ Debugging` on the menu bar.\n\nUse whatever method you like and observe the\
    \ debug process in action:\n\n![Debug running](Images/152442833503-debug-node-running.png)\n\
    \nA number of things happen in quick succession once you hit the debug button.\
    \ First, there's a toolbar that appears at the top of the editor. It has the following\
    \ controls:\n\n* **Drag Dots anchor**: for moving the toolbar to somewhere it’s\
    \ not blocking anything\n* **Continue**: continue the debugging session\n* **Step\
    \ over**: execute code line by line, skipping functions\n* **Step into**: execute\
    \ code line by line, going inside functions\n* **Step out**: if already inside\
    \ a function, this command will take you out\n* **Restart**: restarts the debugging\
    \ session\n* **Stop**: stops the debugging session.\n\nRight now, you'll notice\
    \ that the debug session has paused on your first breakpoint. To continue the\
    \ session, just hit the `Continue` button, which will cause execution to continue\
    \ until it reaches the second breakpoint and pause again. Hitting `Continue` again\
    \ will complete the execution and the debugging session will complete.\n\nLet's\
    \ start the debugging process again by hitting `F5`. Make sure the two breakpoints\
    \ are still in place. When you place a breakpoint, the code pauses at the specified\
    \ line. It doesn’t execute that line unless you hit `Continue` (`F5`) or `Step\
    \ Over` (`F10`). Before you hit anything, let's take a look at the sections that\
    \ make up the debug panel:\n\n* **Variables**: displays local and global variables\
    \ within the current scope (i.e. at the point of execution)\n* **Watch**: you\
    \ can manually add expressions of variables you want to monitor\n* **Call Stack**:\
    \ displays a call stack of the highlighted code\n* **Breakpoints**: displays a\
    \ list of files with breakpoints, along with their line numbers.\n\nTo add an\
    \ expression to the `Watch` section, simply click the `+` sign and add any valid\
    \ JavaScript expression — such as `places.length`. When the debugger pauses, if\
    \ your expression is in scope, the value will be printed out. You can also hover\
