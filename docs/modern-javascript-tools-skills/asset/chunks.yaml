    \ JavaScript in VS Code\n\nThe first file I’d like you to look at is `src/places.js`.\
    \ You'll need to open the `debug-project` folder (*File* > *Open Folder*) and\
    \ select the file from within the editor.\n\n```javascript\nconst places = [];\n\
    \nmodule.exports = {\n  places,\n\n  addPlace: (city, country) => {\n    const\
    \ id = ++places.length;\n    let numType = 'odd';\n    if (id % 2) {\n      numType\
    \ = 'even';\n    }\n    places.push({\n      id, city, country, numType,\n   \
    \ });\n  },\n};\n```\n\nThe code is pretty simple, and if you have enough experience\
