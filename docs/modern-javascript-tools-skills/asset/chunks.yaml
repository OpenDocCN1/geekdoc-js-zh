  trans: "\n\n[Webpack](https://webpack.js.org/) 已成为现代 Web 开发中最重要的工具之一。它主要是一个用于 JavaScript\
    \ 的模块打包器，但也可以教它来转换你所有的前端资源，如 HTML、CSS 甚至图像。它可以让你对应用发出的 HTTP 请求数量有更多控制，并允许你使用这些资源的其他格式（例如\
    \ Pug、Sass 和 ES8）。Webpack 还允许你轻松地使用来自 npm 的包。\n\n本文面向 Webpack 初学者，将涵盖初始设置与配置、模块、加载器（loaders）、插件、代码分割和热模块替换。如果你觉得视频教程很有帮助，我强烈推荐将\
    \ Glen Maddern 的 [Webpack from First Principles](https://www.youtube.com/watch?v=WQue1AN93YU)\
    \ 作为起点，来理解是什么让 Webpack 变得特别的。它现在有点老了，但原理仍然一样，而且是一个非常棒的介绍。\n\n## 示例代码\n\n为了在家里跟着练习，你需要[安装好\
    \ Node.js](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。你也可以[从\
    \ GitHub 下载演示应用](https://github.com/markbrown4/webpack-demo)。\n\n## 安装\n\n让我们用\
    \ npm 初始化一个新项目并安装 `webpack` 和 `webpack-cli`：\n\n```\nmkdir webpack-demo && cd\
    \ webpack-demo\nnpm init -y\nnpm install --save-dev webpack webpack-cli\n```\n\
    \n接下来我们将创建以下目录结构和内容：\n\n```\n webpack-demo\n  |- package.json\n+ |- webpack.config.js\n\
    + |- /src\n+   |- index.js\n+ |- /dist\n+   |- index.html\n```\n\n### `dist/index.html`\n\
    \n```\n<!doctype html>\n<html\n  <head>\n    <title>Hello Webpack</title>\n  </head>\n\
    \  <body>\n    <script src=\"bundle.js\"></script>\n  </body>\n</html>\n```\n\n\
    ### `src/index.js`\n\n```javascript\nconst root = document.createElement(\"div\"\
    )\nroot.innerHTML = `<p>Hello Webpack.</p>`\ndocument.body.appendChild(root)\n\
    ```\n\n### `webpack.config.js`\n\n```javascript\nconst path = require('path')\n\
    \nmodule.exports = {\n  entry: './src/index.js',\n  output: {\n    filename: 'bundle.js',\n\
    \    path: path.resolve(__dirname, 'dist')\n  }\n}\n```\n\n这告诉 Webpack 编译我们入口点\
    \ `src/index.js` 中的代码并在 `/dist/bundle.js` 输出一个包。让我们添加一个运行 Webpack 的 [npm 脚本](https://docs.npmjs.com/misc/scripts)。\n\
    \n### `package.json`\n\n```json\n {\n    ...\n    \"scripts\": {\n-     \"test\"\
    : \"echo \\\"Error: no test specified\\\" && exit 1\"\n+     \"develop\": \"webpack\
    \ --mode development --watch\",\n+     \"build\": \"webpack --mode production\"\
    \n    },\n    ...\n  }\n```\n\n使用 `npm run develop` 命令，我们可以创建第一个包！\n\n```\nAsset\
    \      Size      Chunks           Chunk Names\nbundle.js  2.92 KiB  main  [emitted]\
    \  main\n```\n\n你现在应该能够在浏览器中加载 `dist/index.html` 并看到“Hello Webpack”。\n\n打开 `dist/bundle.js`\
    \ 查看 Webpack 做了什么。顶部是 Webpack 的模块引导代码，最底部就是我们的模块。你可能现在还没觉得惊艳，但如果你已经到了这一步，现在就可以开始使用\
    \ ES Modules 了，Webpack 将能够生成一个可以在所有浏览器中运行的生产环境包。\n\n使用 `Ctrl` + `C` 重启构建并运行 `npm\
    \ run build` 在生产模式下编译我们的包。\n\n```\nAsset      Size       Chunks           Chunk\
    \ Names\nbundle.js  647 bytes  main  [emitted]  main\n```\n\n注意包的大小已经从 `2.92 KiB`\
    \ 降到了 `647 bytes`。\n\n再次查看 `dist/bundle.js`，你会看到一团杂乱的代码。我们的包已经通过 UglifyJS 进行了压缩：代码的运行方式完全相同，但实现了最小的文件大小。\n\
    \n*   `--mode development` 针对构建速度和调试进行优化\n*   `--mode production` 针对运行时执行速度和输出文件大小进行优化\n\
    \n## 模块\n\n使用 ES Modules，可以将大型程序拆分为许多较小的、自包含的程序。\n\n默认情况下，Webpack 知道如何使用 `import`\
    \ 和 `export` 语句消费 ES Modules。例如，让我们现在通过安装 [lodash-es](https://lodash.com/) 并添加第二个模块来尝试一下：\n\
    \n```bash\nnpm install --save-dev lodash-es\n```\n\n### `src/index.js`\n\n```javascript\n\
    import { groupBy } from \"lodash-es\"\nimport people from \"./people\"\n\nconst\
    \ managerGroups = groupBy(people, \"manager\")\n\nconst root = document.createElement(\"\
    div\")\nroot.innerHTML = `<pre>${JSON.stringify(managerGroups, null, 2)}</pre>`\n\
    document.body.appendChild(root)\n```\n\n### `src/people.js`\n\n```javascript\n\
    const people = [\n  {\n    manager: \"Jen\"\n  },\n  {\n    manager: \"Bob\"\n\
    \  },\n  {\n    name: \"Shirley\"\n  }\n]\n\nexport default people\n```\n\n###\
    \ 导入\n\n等待，原文文本包含了一些重复或损坏的片段。在“模块”部分：\n\n```javascript\nimport { groupBy } from\
    \ \"lodash-es\"\nimport people from \"./people\"\n\nconst managerGroups = groupBy(people,\
    \ \"manager\")\n\nconst root = document.createElement(\"div\")\nroot.innerHTML\
    \ = `<pre>${JSON.stringify(managerGroups, null, 2)}</pre>`\ndocument.body.appendChild(root)\n\
    ```\n\n### 加载器 (Loaders)\n\n加载器允许你对导入的内容运行预处理器。这在处理类似 [Babel](http://babel.io/)\
    \ 的：\n\n```bash\nnpm install --save-dev babel-loader\n```\n\n### `webpack.config.js`\n\
    \n```javascript\nconst path = require('path')\n\nmodule.exports = {\n  entry:\
    \ './src/index.js',\n  output: {\n    filename: 'bundle.js',\n    path: path.resolve(__dirname,\
    \ 'dist')\n  },\n  module: {\n    rules: [\n      {\n        test: /\\.js$/,\n\
    \        exclude: /(node_modules|bower_components)/,\n        use: {\n       \
    \   loader: 'babel-loader',\n        }\n      }\n    ]\n  }\n}\n```\n\n### `.babelrc`\n\
    \n```json\n{\n  \"presets\": [\n    [\"@babel/env\", {\n      \"modules\": false\n\
    \    }]\n  ],\n  \"plugins\": [\"syntax-dynamic-import\"]\n}\n```\n\n此配置防止 Babel\
    \ 将 `import` 和 `export` 语句编译为 ES5，并启用动态导入——我们稍后将在代码分割章节中讨论。\n\n### Sass\n\n加载器可以链联成一系列转换。一种演示其如何运作的良好方法是从\
    \ JavaScript 中导入 Sass：\n\n```bash\nnpm install --save-dev style-loader css-loader\
    \ sass-loader node-sass\n```\n\n### `webpack.config.js`\n\n```javascript\nmodule.exports\
    \ = {\n  ...\n  module: {\n    rules: [\n      ...\n      {\n        test: /\\\
    .scss$/,\n        use: [\n          {\n            loader: 'style-loader'\n  \
    \        },\n          {\n            loader: 'css-loader'\n          },\n   \
    \       {\n            loader: 'sass-loader'\n          }\n        ]\n      }\n\
    \    ]\n  }\n}\n```\n\n这些加载器按照相反的顺序处理：\n\n*   `sass-loader` 将 Sass 转换为 CSS。\n\
    *   `css-loader` 解析 CSS 为 JavaScript 并解析任何依赖。\n*   `style-loader` 将我们的 CSS 输出到文档中的\
    \ `<style>` 标签中。\n\n你可以将这些想象成函数调用。一个加载器的输出作为下一个加载器的输入：\n\n```javascript\nstyleLoader(cssLoader(sassLoader(\"\
    source\")))\n```\n\n"
- fmt: "\nLet’s add a Sass source file and import is a module.\n\n`src/style.scss`\n\
    \n```\n$bluegrey: #2b3a42;\n\npre {\n  padding: 8px 16px;\n  background: $bluegrey;\n\
    \  color: #e1e6e9;\n  font-family: Menlo, Courier, monospace;\n  font-size: 13px;\n\
    \  line-height: 1.5;\n  text-shadow: 0 1px 0 rgba(23, 31, 35, 0.5);\n  border-radius:\
    \ 3px;\n}\n```\n\n`src/index.js`\n\n```\n import { groupBy } from 'lodash-es'\n\
    \  import people from './people'\n\n+ import './style.scss'\n\n  ...\n```\n\n\
    Restart the build with `Ctrl` + `C` and `npm run develop`. Refresh `index.html`\
    \ in the browser and you should see some styling.\n\n## CSS in JS\n\nWe just imported\
    \ a Sass file from our JavaScript, as a module.\n\nOpen up `dist/bundle.js` and\
    \ search for “pre {”. Indeed, our Sass has been compiled to a string of CSS and\
    \ saved as a module within our bundle. When we import this module into our JavaScript,\
    \ `style-loader` outputs that string into an embedded `<style>` tag.\n\n### Why\
    \ would you do such a thing?\n\nI won’t delve too far into this topic here, but\
    \ here are a few reasons to consider:\n\n*   A JavaScript component you may want\
    \ to include in your project may depend on other assets to function properly (HTML,\
    \ CSS, Images, SVG). If these can all be bundled together, it’s far easier to\
    \ import and use.\n\n*   Dead code elimination: When a JS component is no longer\
    \ imported by your code, the CSS will no longer be imported either. The bundle\
    \ produced will only ever contain code that does something.\n\n*   CSS Modules:\
    \ The global namespace of CSS makes it very difficult to be confident that a change\
    \ to your CSS will not have any side effects. [CSS modules](https://github.com/css-modules/css-modules)\
    \ change this by making CSS local by default and exposing unique class names that\
    \ you can reference in your JavaScript.\n\n*   Bring down the number of HTTP requests\
    \ by bundling/splitting code in clever ways.\n\n## Images\n\nThe last example\
    \ of loaders we’ll look at is the handling of images with `file-loader`.\n\nIn\
    \ a standard HTML document, images are fetched when the browser encounters an\
    \ `img` tag or an element with a `background-image` property. With Webpack, you\
    \ can optimize this in the case of small images by storing the source of the images\
    \ as strings inside your JavaScript. By doing this, you preload them and the browser\
    \ won’t have to fetch them with separate requests later:\n\n```\nnpm install --save-dev\
    \ file-loader\n```\n\n`webpack.config.js`\n\n```\n module.exports = {\n    ...\n\
    \    module: {\n      rules: [\n        ...\n+       {\n+         test: /\\.(png|svg|jpg|gif)$/,\n\
    +         use: [\n+           {\n+             loader: 'file-loader'\n+      \
    \     }\n+         ]\n+       }\n      ]\n    }\n  }\n```\n\nDownload a [test\
    \ image](https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png)\
    \ with this command:\n\n```\ncurl https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png\
    \ --output src/code.png\n```\n\nRestart the build with `Ctrl` + `C` and `npm run\
    \ develop` and you’ll now be able to import images as modules!\n\n`src/index.js`\n\
    \n```\n import { groupBy } from 'lodash-es'\n  import people from './people'\n\
    \n  import './style.scss'\n+ import './image-example'\n\n  ...\n```\n\n`src/image-example.js`\n\
    \n```\nimport codeURL from \"./code.png\"\n\nconst img = document.createElement(\"\
    img\")\nimg.src = codeURL\nimg.style = \"background: #2B3A42; padding: 20px\"\n\
    img.width = 32\ndocument.body.appendChild(img)\n```\n\nThis will include an image\
