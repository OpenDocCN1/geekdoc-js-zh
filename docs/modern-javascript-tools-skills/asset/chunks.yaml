  trans: "\n\n在发送请求时，你可以传递许多[额外的选项](https://github.com/axios/axios#request-config)，但这里是几个最常用的：\n\
    \n* `baseUrl`:如果你指定了基础 URL，它将会被 set 置到你使用的任何相对 URL 之前。\n* `headers`:一个包含键/值对的对象，将作为请求头发送。\n\
    * `params`:一个包含键/值对的对象，该对象将被序列化并作为查询字符串附加到 URL 中。\n* `responseType`:如果你期望的响应格式\
    \ JSON 于 JSON，可以将此属性设置为 `arraybuffer`、`blob`、`document`、`text` 或 `stream`。\n*\
    \ `auth`:传递一个包含 `username` 和 `password` 字段的对象，将在请求中使用这些凭据进行 HTTP Basic 认证。\n\n\
    ## 便捷方法\n\n就像 jQuery 一样，还有用于执行不同类型请求的快捷方法。\n\n`get`、`delete`、`head` 和 `options`\
    \ 方法都接受两个参数：URL 和可选的配置对象。\n\n```\naxios.get('/products/5');\n```\n\n`post`、`put`\
    \ 和 `patch` 方法接受一个数据对象作为第二个参数，接受一个可选的配置对象作为第三个参数：\n\n```\naxios.post(\n  '/products',\n\
    \  { name: 'Waffle Iron', price: 21.50 },\n  { options }\n);\n```\n\n## 接收响应\n\
    \n一旦发送请求，Axios 返回一个 promise，该 promise 将解析为响应对象或错误对象。\n\n```\naxios.get('/product/9')\n\
    \  .then(response => console.log(response))\n  .catch(error => console.log(error));\n\
    ```\n\n### 响应对象\n\n当请求成功时，你的 `then()` 回调将接收一个包含以下属性的响应对象：\n\n* `data`:从服务器返回的负载。默认情况下，Axios\
    \ 期望 JSON 并将其解析回 JavaScript 对象。\n* `status`:服务器返回的 HTTP 状态码。\n* `statusText`:服务器返回的\
    \ HTTP 状态消息。\n* `headers`:服务器返回的所有响应头。\n* `config`:原始请求配置。\n* `request`: 实际的 `XMLHttpRequest`\
    \ 对象（当在浏览器中运行时）。\n\n### 错误对象\n\n如果请求出现问题，promise 将拒绝并返回一个错误对象，该对象至少包含以下某些属性：\n\
    \n* `message`:错误消息文本。\n* `response`:响应对象（如果已收到），如上一节所述。\n* `request`:实际的 `XMLHttpRequest`\
    \ 对象（当在浏览器中运行时）。\n* `config`:原始请求配置。\n\n## 转换器与拦截器\n\nAxios 提供了两个受[Angular $http\
    \ 库](https://docs.angularjs.org/api/ng/service/$http)启发的巧妙功能。尽管它们看起来相似，但用途略有不同。\n\
    \n### 转换器\n\nAxios 允许你提供函数来转换发送或传入的数据，形式为在发送请求时可以设置的两个配置选项：`transformRequest`\
    \ 和 `transformResponse`。这两个属性都是数组，允许你链式调用数据通过的多个函数。\n\n传递给 `transformRequest`\
    \ 的任何函数都适用于 PUT、POST 和 PATCH 请求。它们接收请求数据和 `headers` 对象作为参数，并必须返回修改后的数据对象。\n\n\
    ```\nconst options = {\n  transformRequest: [\n    (data, headers) => {\n    \
    \  // 对数据进行一些操作\n      return data;\n    }\n  ]\n}\n```\n\n可以以相同的方式向 `transformResponse`\
    \ 添加函数，但它们只用响应数据调用，并且在响应传递给任何链式 `then()` 回调之前进行调用。\n\n那么我们可以用转换器做什么呢？一个潜在的用例是处理期望特定格式数据的\
    \ API —— 例如 XML 甚至 CSV。你可以设置一对转换器，将传出和传入的数据与 API 要求的格式之间进行转换。\n\n值得注意的是，Axios\
    \ 默认的 `transformRequest` 和 `transformResponse` 函数会在数据与 JSON 之间进行转换，而指定你自己的转换器将覆盖这些默认设置。\n\
    \n### 拦截器\n\n虽然转换器允许你修改发送和传入的数据，但 Axios 还允许你添加名为[拦截器](https://github.com/axios/axios#interceptors)的函数。与转换器一样，这些函数可以挂载并在发送请求时或接收到响应时触发。\n\
    \n```\n// 添加请求拦截器\naxios.interceptors.request.use((config) => {\n    // 在发送请求之前做一些操作\n\
    \    return config;\n  }, (error) => {\n    // 对请求错误做一些操作\n    return Promise.reject(error);\n\
    \  });\n\n// 添加响应拦截器\naxios.interceptors.response.use((response) => {\n    //\
    \ 对响应数据做一些操作\n    return response;\n  }, (error) => {\n    // 对响应错误做一些操作\n   \
    \ return Promise.reject(error);\n  });\n```\n\n正如你可能从上面的示例中注意到的，拦截器与转换器有一些重要的区别。拦截器不仅仅接收数据或头部，它们接收完整的请求配置或响应对象。\n\
    \n在创建拦截器时，你还可以选择提供一个错误处理函数，允许你捕获任何错误并妥善处理它们。\n\n请求拦截器可以用于诸如[从本地存储中检索令牌并随所有请求发送](https://www.npmjs.com/package/axios-token-interceptor)，而响应拦截器可以用于[捕获\
    \ 401 响应并重定向到登录页面](https://gist.github.com/yajra/5f5551649b20c8f6aec48549ef5cf)。\n\
    \n## 第三插件\n\n作为一个流行的库，Axios 受益于扩展其功能的第三方库生态系统。从拦截器到测试适配器到日志记录，有很多选择。这里有几个你可能觉得有用的：\n\
    \n* [axios-mock-adapter](https://github.com/ctimmerm/axios-mock-adapter):允许你轻松模拟请求以方便测试代码。\n\
    * [axios-cache-plugin](https://github.com/jin5354/axios-cache-plugin):用于选择性缓存\
    \ GET 请求的封装。\n* [redux-axios-middleware](https://github.com/svrcekmichal/redux-axios-middleware):如果你是\
    \ Redux 用户，此中间件提供了一种通过普通 action 调度 Ajax 请求的方便方法。\n\n更多[Axios 添加和扩展](https://github.com/axios/axios/blob/master/ECOSYSTEM.md)列表可以在\
    \ Axios GitHub 仓库中找到。\n\n总来说，Axios 有很多推荐它的理由。它具有简单的 API，并带有对于任何使用过 jQuery 的人来说都是熟悉的实用快捷方法。它的流行程度以及各种第三方插件的可用性，使其成为包含在应用程序（无论是前端、后端还是两者）中的的可靠选择。\n\
    \n"
