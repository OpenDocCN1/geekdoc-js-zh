  trans: "\n\n```json\n\"configurations\": [\n  {\n    \"type\": \"node\",\n    \"\
    request\": \"launch\",\n    \"name\": \"Launch Places\",\n    \"program\": \"\
    ${workspaceFolder}\\\\src\\\\places.js\"\n  }\n]\n```\n\n### 反斜杠\n\n根据你的操作系统，你可能需要将双反斜杠（`\\\
    \\`）替换为单正斜杠（`/`）。\n\n保存文件后，你会发现调试面板有了一个新的下拉菜单，`Launch Places`。要运行它，你可以：\n\n* \
    \  点击调试面板上的绿色播放按钮\n*   按下 `F5`\n*   在菜单栏上点击 `Debug` > `Start Debugging`\n\n使用你喜欢的任何方法并观察调试过程的运行：\n\
    \n![Debug running](img/152442833503-debug-node-running.png)\n\n一旦你点击调试按钮，一系列操作会接连发生。首先，编辑器顶部会出现一个工具栏。它包含以下控制按钮：\n\
    \n*   **拖动锚点锚点**：用于将工具栏移动到不会遮挡任何内容的地方\n*   **继续 (Continue)**：继续调试会话\n*   **逐行\
    \ (Step over)**：逐行执行代码，跳过函数\n*   **单步 (Step into)**：逐行执行代码，进入函数内部\n*   **单出 (Step\
    \ out)**：如果已经在函数内部，此命令将带你跳出来\n*   **重启 (Restart)**：重启调试会话\n*   **停止 (Stop)**：停止调试会话\n\
    \n现在，你会注意到调试会话暂停在了你的第一个断点上。要继续会话，只需点击 `Continue` 按钮，这将导致执行继续，直到到达第二个断点并再次暂停。再次点击\
    \ `Continue` 将完成执行，调试会话也将结束。\n\n让我们通过 `F5` 重新开始调试过程。确保两个断点仍然有效。当你放置断点时，代码会在指定的行暂停。除非你点击\
    \ `Continue`（`F5`）或 `Step Over`（`F10`），否则它不会执行该行。在点击任何内容之前，让我们来看一下组成调试面板的区域：\n\
    \n*   **Variables (变量)**：显示当前作用域内（即执行点处）的局部和全局变量\n*   **Watch (监视)**：你可以手动添加想要监控的变量表达式\n\
    *   **Call Stack (调用堆栈)**：显示高亮代码的调用堆栈\n*   **Breakpoints (断点)**：显示带有断点的文件列表以及它们的行号。\n\
    \n要向 `Watch` 区域添加表达式，只需点击 `+` 号并添加任何有效的 JavaScript 表达式——例如 `places.length`。当调试器暂停时，如果你的表达式在作用域内，该值就会打印出来。你也可以悬停在当前作用域内的变量上，会弹出一个窗口显示它们的值。\n\
    \n目前，`places` 数组是空的。按下任何导航控制控件查看调试是如何工作的。例如，`Step over` 将跳转到下一行，而 `Step into`\
    \ 将导航到 `addPlace` 函数。花一点时间熟悉一下这些控制按钮。\n\n一旦你完成了一些单步操作，悬停在 `places` 变量上。会弹出一个窗口。展开内部的值，直到你看到类似的视图：\n\
    \n![The places popup](img/152442833804-places-hover.png)\n\n你还可以在 `Variables`\
    \ 区域检查作用域内的所有变量。\n\n![The variables section](img/152442834005-local-variables.png)\n\
    \n与我们通常使用的 `console.log` 相比，这太棒了。调试器允许我们在更深层次上检查变量。你可能已经注意到 `places` 数组输出中的几个问题：\n\
    \n1.  数组中有多个空格——即 `places[0]` 和 `places[2]` 是 `undefined`\n2.  `numType` 属性对奇数\
    \ `id` 值显示为 `even`。\n\n目前，只需结束调试会话。我们将在下一节修复它们。\n\n### 使用 Mocha 进行调试测试\n\n打开 `test/placesTest.js`\
    \ 并检查编写用于测试 `places.test` 中代码的代码。如果你从未用过 Mocha，需要先全局安装它才能运行测试。\n\n```bash\n# 全局安装\
    \ mocha\nnpm install -g mocha\n\n# 运行 mocha 测试\nmocha\n```\n\n你也可以运行 `npm test`\
    \ 来执行测试。你应该会得到如下输出：\n\n![Failing mocha tests](img/152442834406-failing-mocha-tests.png)\n\
    \n所有测试都失败了。为了找到问题，我们将在调试模式下运行测试。为了做到，我们需要一个新的配置。转到调试面板并点击下拉菜单访问 `Add Configuration`\
    \ 选项：\n\n![Add configuration](img/152442834507-add-configuration.png)\n\n`launch.json`\
    \ 文件将打开，并弹出一个列出若干个配置供你选择。\n\n![Add mocha tests](img/152442834707-mocha-test-configuration.png)\n\
    \n只需选择 `Mocha Tests`。将为你插入以下配置：\n\n```json\n{\n  \"type\": \"node\",\n  \"request\"\
    : \"launch\",\n  \"name\": \"Mocha Tests\",\n  \"program\": \"${workspaceFolder}/node_modules/mocha/bin/mocha\"\
    ,\n  \"args\": [\n    \"-u\",\n    \"tdd\",\n    \"--timeout\", \"9999\",\n  \
    \  \"--colors\",\n    \"${workspaceFolder}/test/placesTest.js\"\n  ],\n  \"internalConsole\"\
    : \"openOnStart\"\n}\n```\n\n默认设置是正确的。回到下拉菜单选择 `Mocha Tests`。点击 `Play` 按钮开始调试会话。\n\
    \n![Mocha start](img/152442834908-mocha-start.png)\n\n在测试开始时，`places.length` 应该是\
    \ 0。如果你点击 `Step over`，`places.length` 显示为 2，但我们只添加了一个地方。这是怎么了？注释掉 `places.js`\
    \ 中的最后三行，否则测试将运行：\n\n```javascript\naddPlace('Nairobi', 'Kenya');\n```\n\n在监视区域中确保添加了\
    \ `places.length`。重启调试会话，这次使用 `Step into` 进入 `addPlace` 函数。调试器将带你进入 `places.js`。`places.length`\
    \ 仍然是 0。点击 `Step over` 执行当前行。\n\n![Mocha step](img/152442835209-mocha-step.png)\n\
    \n啊哈！`places.length` 的值增加了 1，但我们还没有添加任何内容。问题出在 `++` 运算符，它改变了数组的长度。为了修复这个问题，只需将该行替换为：\n\
    \n```javascript\nconst id = places.length + 1;\n```\n\n这样我们就可以安全地获取 `id` 的值而不会改变\
    \ `places.length`。当我们仍处于调试模式时，让我们尝试修复另一个问题：`numType` 属性在 `id` 为 1 时被赋值为 `even`。问题似乎是\
    \ `if` 语句内部的取模表达式：\n\n![Mocha if error](img/152442835410-mocha-if-error.png)\n\
    \n让我们使用调试控制台进行快速实验。为 `if` 语句输入正确的表达式：\n\n![Mocha debug console](img/152442835511-mocha-debug-console.png)\n\
    \n调试控制台类似于浏览器控制台。它允许你使用当前作用域内的变量进行实验。通过尝试一些想法，你可以轻松找到解决方案而不离开编辑器。现在让我们修复失败的 `if`\
    \ 语句：\n\n```javascript\nif (id % 2 === 0) {\n  numType = 'even';\n}\n```\n\n重启调试会话并点击\
    \ `Continue` 跳过当前断点。第一个测试“can add a place”现在通过了。但第二个测试没有通过。为了修复这个问题，我们需要另一个断点。移除当前断点，并在第\
    \ 16 行放置新断点，那里写着：\n\n```javascript\naddPlace('Cape Town', 'South Africa');\n```\n\
    \n启动新的调试会话：\n\n![Mocha test2 fail](img/152442835812-mocha-test2-error.png)\n\n"
- fmt: "\nThere! Look at the `Variables` section. Even before the second test begins\
    \ we discover that the `places` array already has existing data created by the\
    \ first test. This has obviously polluted our current test. To fix this, we need\
    \ to implement some kind of `setup` function that resets the `places` array for\
    \ each test. To do this in Mocha, just add the following code before the tests:\n\
    \n```\nbeforeEach(() => {\n  places.length = 0;\n});\n```\n\nRestart the debugger\
    \ and let it pause on the breakpoint. Now the `places` array has a clean state.\
    \ This should allow our test to run unpolluted. Just click *Continue* to let the\
    \ rest of the test code execute.\n\n![Mocha tests passed](Images/152442836013-mocha-tests-passing.png)\n\
    \nAll tests are now passing. You should feel pretty awesome, since you've learned\
    \ how to debug code without writing a single line of `console.log`. Let's now\
    \ look at how to debug client-side code using the browser.\n\n## Debugging JavaScript\
    \ with Chrome Debugger\n\nNow that you’ve become familiar with the basics of debugging\
    \ JavaScript in VS Code, we’re going to see how to debug a slightly more complex\
    \ project using the [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
    \ extension. Simply open the marketplace panel via the action bar. Search for\
    \ the extension and install it.\n\n![Debugger for Chrome](Images/152442836414-debugger-for-chrome.png)\n\
    \nAfter installation, hit reload to activate the extension. Let's quickly review\
    \ the code that we'll be debugging. The web application is mostly a client-side\
