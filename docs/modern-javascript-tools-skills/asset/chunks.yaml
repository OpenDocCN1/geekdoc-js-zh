    \  // html changes\n  gulp.watch(folder.src + 'html/**/*', ['html']);\n\n  //\
    \ javascript changes\n  gulp.watch(folder.src + 'js/**/*', ['js']);\n\n  // css\
    \ changes\n  gulp.watch(folder.src + 'scss/**/*', ['css']);\n\n});\n```\n\nRather\
    \ than running `gulp watch` immediately, let's add a default task:\n\n```javascript\n\
    // default task\ngulp.task('default', ['run', 'watch']);\n```\n\nSave `gulpfile.js`\
    \ and enter `gulp` at the command line. Your images, HTML, CSS and JavaScript\
    \ will all be processed, then Gulp will remain active watching for updates and\
    \ re-running tasks as necessary. Hit `Ctrl/Cmd` + `C` to abort monitoring and\
    \ return to the command line.\n\n## Step 7: Profit!\n\nOther plugins you may find\
    \ useful:\n\n- [gulp-load-plugins](https://www.npmjs.com/package/gulp-load-plugins)\
    \ ± load all Gulp plugin modules without `require` declarations\n- [gulp-preprocess](https://www.npmjs.com/package/gulp-preprocess)\
    \ — a simple HTML and JavaScript [preprocessor](https://github.com/jsoverson/preprocess)\n\
    - [gulp-less](https://www.npmjs.com/package/gulp-less) — the [Less CSS preprocessor](http://lesscss.org/)\
    \ plugin\n- [gulp-stylus](https://www.npmjs.com/package/gulp-stylus) — the [Stylus\
    \ CSS preprocessor](http://stylus-lang.com/) plugin\n- [gulp-sequence](https://www.npmjs.com/package/gulp-sequence)\
    \ — run a series of gulp tasks in a specific order\n- [gulp-plumber](https://www.npmjs.com/package/gulp-plumber)\
    \ — error handling which prevents Gulp stopping on failures\n- [gulp-size](https://www.npmjs.com/package/gulp-size)\
    \ — displays file sizes and savings\n- [gulp-nodemon](https://www.npmjs.com/package/gulp-nodemon)\
    \ — uses [nodemon](https://www.npmjs.com/package/nodemon) to automatically restart\
    \ Node.js applications when changes occur.\n- [gulp-util](https://www.npmjs.com/package/gulp-util)\
    \ — utility functions including logging and color coding.\n\nOne useful method\
    \ in `gulp-util` is `.noop()` which passes data straight through without performing\
    \ any action. This could be used for cleaner development/production processing\
    \ code. For example:\n\n```javascript\nvar gutil = require('gulp-util');\n\n//\
