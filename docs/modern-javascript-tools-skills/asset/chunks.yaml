    *   [React Native Tools](https://marketplace.visualstudio.com/items?itemName=vsmobile.react-native):
    provides IntelliSense, commands and debugging features for the React Native framework.

    *   [Vetur](https://marketplace.visualstudio.com/items?itemName=octref.vetur):
    provides syntax highlighting, snippets, Emmet, linting, formatting, IntelliSense
    and debugging support for the Vue framework. It comes with proper documentation
    published on [GitBook](https://vuejs.github.io/vetur/)

    *   [Ember](https://marketplace.visualstudio.com/items?itemName=felixrieseberg.vsc-ember-cli):
