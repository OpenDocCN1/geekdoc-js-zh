    \n*   [Loading Data](https://webpack.js.org/guides/asset-management/#loading-data)\n\
    \n### Dependency Graph\n\nYou should now be able to see how loaders help to build\
    \ up a tree of dependencies amongst your assets. This is what the image on the\
    \ Webpack home page is demonstrating.\n\n![JS requires SCSS requires CSS requires\
    \ PNG](Images/1484692838webpack-dependency-tree.png)\n\nThough JavaScript is the\
    \ entry point, Webpack appreciates that your other asset types — like HTML, CSS,\
    \ and SVG — each have dependencies of their own, which should be considered as\
    \ part of the build process.\n\n## Code Splitting\n\nFrom the [Webpack docs](https://webpack.js.org/guides/code-splitting/):\n\
    \n> Code splitting is one of the most compelling features of Webpack. This feature\
    \ allows you to split your code into various bundles which can then be loaded\
    \ on demand or in parallel. It can be used to achieve smaller bundles and control\
    \ resource load prioritization which, if used correctly, can have a major impact\
    \ on load time.\n\nSo far, we’ve only seen a single entry point — `src/index.js`\
    \ — and a single output bundle — `dist/bundle.js`. When your app grows, you’ll\
    \ need to split this up so that the entire codebase isn’t downloaded at the start.\
    \ A good approach is to use [Code Splitting](https://webpack.js.org/guides/code-splitting/)\
    \ and [Lazy Loading](https://webpack.js.org/guides/lazy-loading/) to fetch things\
    \ on demand as the code paths require them.\n\nLet’s demonstrate this by adding\
    \ a “chat” module, which is fetched and initialized when someone interacts with\
    \ it. We’ll make a new entry point and give it a name, and we’ll also make the\
    \ output’s filename dynamic so it’s different for each chunk.\n\n**webpack.config.js**\n\
    \n```\n const path = require('path')\n\n  module.exports = {\n-   entry: './src/index.js',\n\
    +   entry: {\n+     app: './src/app.js'\n+   },\n    output: {\n-     filename:\
    \ 'bundle.js',\n+     filename: '[name].bundle.js',\n      path: path.resolve(__dirname,\
    \ 'dist')\n    },\n    ...\n  }\n```\n\n**src/app.js**\n\n```\nimport './app.scss'\n\
    \nconst button = document.createElement(\"button\")\nbutton.textContent = 'Open\
    \ chat'\ndocument.body.appendChild(button)\n\nbutton.onclick = () => {\n  import(/*\
    \ webpackChunkName: \"chat\" */ \"./chat\").then(chat => {\n    chat.init()\n\
    \  })\n}\n```\n\n**src/chat.js**\n\n```\nimport people from \"./people\"\n\nexport\
    \ function init() {\n  const root = document.createElement(\"div\")\n  root.innerHTML\
    \ = `<p>There are ${people.length} people in the room.</p>`\n  document.body.appendChild(root)\n\
    }\n```\n\n**src/app.scss**\n\n```\nbutton {\n  padding: 10px;\n  background: #24b47e;\n\
    \  border: 1px solid rgba(#000, .1);\n  border-width: 1px 1px 3px;\n  border-radius:\
    \ 3px;\n  font: inherit;\n  color: #fff;\n  cursor: pointer;\n  text-shadow: 0\
    \ 1px 0 rgba(#000, .3), 0 1px 1px rgba(#000, .2);\n}\n```\n\n#### Not Webpack\
    \ Specific Syntax\n\nNote: Despite the `/* webpackChunkName */` comment for giving\
    \ the bundle a name, this syntax is *not* Webpack specific. It’s the [proposed\
    \ syntax for dynamic imports](https://github.com/tc39/proposal-dynamic-import)\
    \ intended to be supported directly in the browser.\n\nLet’s run `npm run build`\
    \ and see what this generates:\n\n```\nAsset           Size       Chunks     \
    \   Chunk Names\nchat.bundle.js  377 bytes  0  [emitted]  chat\napp.bundle.js\
    \   7.65 KiB   1  [emitted]  app\n```\n\nAs our entry bundle has changed, we’ll\
    \ need to update our path to it as well.\n\n**dist/index.html**\n\n```\n <!doctype\
