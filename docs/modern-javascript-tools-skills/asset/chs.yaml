  \ 支持使用 Mocha 库测试。此扩展帮助你直接在代码上运行测试并通过装饰器显示错误。\n*   [ES6 Mocha Snippets](https://marketplace.visualstudio.com/items?itemName=spoonscen.es6-mocha-snippets):\
  \ ES6 语法的 Mocha 代码片段。此扩展的重点是保持代码简洁（dry），尽可能利用箭头函数并省略大括号。可以配置允许分号。\n*   [Jasmine\
