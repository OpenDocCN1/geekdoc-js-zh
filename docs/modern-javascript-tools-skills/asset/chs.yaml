  \ 这是另一个非常优秀的扩展，用于计算 JavaScript 和 TypeScript 代码的复杂度。\n\n## 扩展包\n\n现在我们已经来到了最后一个类别，我想告诉大家\
  \ VS Code 市场有一个专门的[扩展包分类](https://marketplace.visualstudio.com/search?term=extension%20packs&target=VSCode&category=All%20categories&sortBy=Relevance)。本质上，这些是将相关的\
