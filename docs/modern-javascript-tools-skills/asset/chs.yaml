  *   [Ionic Extension Pack](https://marketplace.visualstudio.com/items?itemName=loiane.ionic-extension-pack):\
  \ 此包包含了许多用于 Ionic、Angular、`RxJS`、Cordova 和 HTML 开发的 VS Code 扩展。\n\n## 总结\n\nVS Code\
  \ 海量的高质量扩展使其成为 JavaScript 开发者的热门选择。编写如此高效的 JavaScript 代码从未如此简单。像 `ESLint` 这样的扩展可以帮助你避免常见错误，而像\
  \ `Debugger for Chrome` 这样的扩展可以帮助你更轻松地调试代码。Node.js 扩展凭借其 `IntelliSense` 功能帮助你正确导入模块，而\
  \ `Live Server` 和 `REST client` 等工具的可用减少了你对外部工具完成工作的依赖。所有这些工具都让你的迭代过程变得简单得多。\n\n\
  希望此列表向你介绍了可以帮助你工作流的新 VS Code 扩展。\n\n# 第 6 章：使用 VS Code 和 Chrome Debugger 调试 JavaScript\
  \ 项目\n\n### 作者：Michael Wanyoike\n\n调试 JavaScript 并不是 编程中最有趣的部分，但它是一项关键技能。本文介绍了两个可以帮助你像专业人士一样调试\
  \ JavaScript 的工具。\n\n想象一下，如果 JavaScript 中不存在 `console.log()` 函数。我确信你问自己的第一个问题将会是：“我该如何确认我的代码运行正常呢？”\n\
  \n答案在于使用调试工具。长期以来，大多数开发者（包括我在内）一直在使用 `console.log` 来调试故障代码。它快速且易于使用。然而，如果你不知道错误在哪里以及是由什么引起的，有时情况会变得非常棘手。你经常发现自己在整个代码中到处布置\
  \ `console.log` 陷阱，看看哪一个能揭露罪祸首。\n\n为了解决这个问题，我们需要改变习惯并开始使用调试工具。有很多工具可用于调试 JavaScript\
  \ 代码，例如 Chrome 工具、[Node Debugger](https://www.sitepoint.com/debugging-javascript-node-debugger/)、`Node\
  \ Inspect` 等。事实上，每个[主流浏览器](https://www.w3schools.com/js/js_debugging.asp)都提供了自己的工具。\n\
  \n在本文中，我们将查看如何使用 Visual Studio Code 提供的调试功能。我们还将查看如何使用 [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
  \ 扩展，该扩展允许 VS Code 与 Chrome 开发工具集成。一旦完成，你将再也不想用 `console.log()` 了。\n\n## 先决条件\n\n\
  对于本教程，你只需要在[现代 JavaScript](https://www.sitepoint.com/anatomy-of-a-modern-javascript-application/)方面有坚实的基础。我们将查看如何使用\
  \ Visual Studio Code 提供的调试功能。我们还将查看如何使用 [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
  \ 扩展，该扩展允许 VS Code 与 Chrome 开发工具集成。一旦完成，你将再也不想用 `console.log()` 了。\n\n## 在 VS Code\
  \ 中调试 JavaScript\n\n我想让你查看的第一个文件是 `src/places.js`。你需要打开 `debug-project` 文件夹（*文件*\
  \ > *打开文件夹*）并在编辑器中选择该文件。\n\n```javascript\nconst places = [];\n\nmodule.exports\
  \ = {\n  places,\n\n  addPlace: (city, country) => {\n    const id = ++places.length;\n\
  \    let numType = 'odd';\n    if (id % 2) {\n      numType = 'even';\n    }\n \
  \   places.push({\n      id, city, country, numType,\n    });\n  },\n};\n```\n\n\
  代码非常简单，如果你有足够的编程经验，你可能会注意到它有几个 bug。如果你发现了，请忽略它们。如果没有发现，太完美了。让我们在底部添加几行代码来手动测试：\n\
  \n```javascript\nmodule.exports.addPlace('Mombasa', 'Kenya');\nmodule.exports.addPlace('Kingston',\
  \ 'Jamaica');\nmodule.exports.addPlace('Cape Town', 'South Africa');\n```\n\n现在，我确定你已经很想用用\
  \ `console.log` 来输出 `places` 的值了。但我们不要这样做。相反，让我们添加断点。只需左键侧边栏（即行号旁边的空白区域）即可添加断点：\n\
  \n看到左侧的红点了吗？那些就是断点。断点只是告诉调试器在何处暂停执行的视觉指示。接下来，在操作栏上，点击调试按钮（显示“No Bugs Allowed”的图标）。\n\
  \n查看顶部区域。你会注意到有一个带红点的齿轮图标。只需点击它。系统会为你创建一个调试配置文件 `launch.json`。按如下方式更新配置，你就可以使用 VS\
  \ Code 调试器运行 `places.js` 了：\n\n\n\n\n\n```json\n\"configurations\": [\n  {\n   \
  \ \"type\": \"node\",\n    \"request\": \"launch\",\n    \"name\": \"Launch Places\"\
  ,\n    \"program\": \"${workspaceFolder}\\\\src\\\\places.js\"\n  }\n]\n```\n\n\
  ### 反斜杠\n\n根据你的操作系统，你可能需要将双反斜杠（`\\\\`）替换为单正斜杠（`/`）。\n\n保存文件后，你会发现调试面板有了一个新的下拉菜单，`Launch\
  \ Places`。要运行它，你可以：\n\n*   点击调试面板上的绿色播放按钮\n*   按下 `F5`\n*   在菜单栏上点击 `Debug` > `Start\
  \ Debugging`\n\n使用你喜欢的任何方法并观察调试过程的运行：\n\n![Debug running](img/152442833503-debug-node-running.png)\n\
  \n一旦你点击调试按钮，一系列操作会接连发生。首先，编辑器顶部会出现一个工具栏。它包含以下控制按钮：\n\n*   **拖动锚点锚点**：用于将工具栏移动到不会遮挡任何内容的地方\n\
  *   **继续 (Continue)**：继续调试会话\n*   **逐行 (Step over)**：逐行执行代码，跳过函数\n*   **单步 (Step\
  \ into)**：逐行执行代码，进入函数内部\n*   **单出 (Step out)**：如果已经在函数内部，此命令将带你跳出来\n*   **重启 (Restart)**：重启调试会话\n\
  *   **停止 (Stop)**：停止调试会话\n\n现在，你会注意到调试会话暂停在了你的第一个断点上。要继续会话，只需点击 `Continue` 按钮，这将导致执行继续，直到到达第二个断点并再次暂停。再次点击\
  \ `Continue` 将完成执行，调试会话也将结束。\n\n让我们通过 `F5` 重新开始调试过程。确保两个断点仍然有效。当你放置断点时，代码会在指定的行暂停。除非你点击\
  \ `Continue`（`F5`）或 `Step Over`（`F10`），否则它不会执行该行。在点击任何内容之前，让我们来看一下组成调试面板的区域：\n\n\
  *   **Variables (变量)**：显示当前作用域内（即执行点处）的局部和全局变量\n*   **Watch (监视)**：你可以手动添加想要监控的变量表达式\n\
  *   **Call Stack (调用堆栈)**：显示高亮代码的调用堆栈\n*   **Breakpoints (断点)**：显示带有断点的文件列表以及它们的行号。\n\
  \n要向 `Watch` 区域添加表达式，只需点击 `+` 号并添加任何有效的 JavaScript 表达式——例如 `places.length`。当调试器暂停时，如果你的表达式在作用域内，该值就会打印出来。你也可以悬停在当前作用域内的变量上，会弹出一个窗口显示它们的值。\n\
  \n目前，`places` 数组是空的。按下任何导航控制控件查看调试是如何工作的。例如，`Step over` 将跳转到下一行，而 `Step into` 将导航到\
  \ `addPlace` 函数。花一点时间熟悉一下这些控制按钮。\n\n一旦你完成了一些单步操作，悬停在 `places` 变量上。会弹出一个窗口。展开内部的值，直到你看到类似的视图：\n\
  \n![The places popup](img/152442833804-places-hover.png)\n\n你还可以在 `Variables` 区域检查作用域内的所有变量。\n\
  \n![The variables section](img/152442834005-local-variables.png)\n\n与我们通常使用的 `console.log`\
  \ 相比，这太棒了。调试器允许我们在更深层次上检查变量。你可能已经注意到 `places` 数组输出中的几个问题：\n\n1.  数组中有多个空格——即 `places[0]`\
  \ 和 `places[2]` 是 `undefined`\n2.  `numType` 属性对奇数 `id` 值显示为 `even`。\n\n目前，只需结束调试会话。我们将在下一节修复它们。\n\
  \n### 使用 Mocha 进行调试测试\n\n打开 `test/placesTest.js` 并检查编写用于测试 `places.test` 中代码的代码。如果你从未用过\
  \ Mocha，需要先全局安装它才能运行测试。\n\n```bash\n## 全局安装 mocha\nnpm install -g mocha\n\n## 运行\
  \ mocha 测试\nmocha\n```\n\n你也可以运行 `npm test` 来执行测试。你应该会得到如下输出：\n\n![Failing mocha\
  \ tests](img/152442834406-failing-mocha-tests.png)\n\n所有测试都失败了。为了找到问题，我们将在调试模式下运行测试。为了做到，我们需要一个新的配置。转到调试面板并点击下拉菜单访问\
  \ `Add Configuration` 选项：\n\n![Add configuration](img/152442834507-add-configuration.png)\n\
  \n`launch.json` 文件将打开，并弹出一个列出若干个配置供你选择。\n\n![Add mocha tests](img/152442834707-mocha-test-configuration.png)\n\
  \n只需选择 `Mocha Tests`。将为你插入以下配置：\n\n```json\n{\n  \"type\": \"node\",\n  \"request\"\
  : \"launch\",\n  \"name\": \"Mocha Tests\",\n  \"program\": \"${workspaceFolder}/node_modules/mocha/bin/mocha\"\
  ,\n  \"args\": [\n    \"-u\",\n    \"tdd\",\n    \"--timeout\", \"9999\",\n    \"\
  --colors\",\n    \"${workspaceFolder}/test/placesTest.js\"\n  ],\n  \"internalConsole\"\
  : \"openOnStart\"\n}\n```\n\n默认设置是正确的。回到下拉菜单选择 `Mocha Tests`。点击 `Play` 按钮开始调试会话。\n\
  \n![Mocha start](img/152442834908-mocha-start.png)\n\n在测试开始时，`places.length` 应该是\
  \ 0。如果你点击 `Step over`，`places.length` 显示为 2，但我们只添加了一个地方。这是怎么了？注释掉 `places.js` 中的最后三行，否则测试将运行：\n\
  \n```javascript\naddPlace('Nairobi', 'Kenya');\n```\n\n在监视区域中确保添加了 `places.length`。重启调试会话，这次使用\
  \ `Step into` 进入 `addPlace` 函数。调试器将带你进入 `places.js`。`places.length` 仍然是 0。点击 `Step\
  \ over` 执行当前行。\n\n![Mocha step](img/152442835209-mocha-step.png)\n\n啊哈！`places.length`\
  \ 的值增加了 1，但我们还没有添加任何内容。问题出在 `++` 运算符，它改变了数组的长度。为了修复这个问题，只需将该行替换为：\n\n```javascript\n\
  const id = places.length + 1;\n```\n\n这样我们就可以安全地获取 `id` 的值而不会改变 `places.length`。当我们仍处于调试模式时，让我们尝试修复另一个问题：`numType`\
  \ 属性在 `id` 为 1 时被赋值为 `even`。问题似乎是 `if` 语句内部的取模表达式：\n\n![Mocha if error](img/152442835410-mocha-if-error.png)\n\
  \n让我们使用调试控制台进行快速实验。为 `if` 语句输入正确的表达式：\n\n![Mocha debug console](img/152442835511-mocha-debug-console.png)\n\
  \n调试控制台类似于浏览器控制台。它允许你使用当前作用域内的变量进行实验。通过尝试一些想法，你可以轻松找到解决方案而不离开编辑器。现在让我们修复失败的 `if`\
  \ 语句：\n\n```javascript\nif (id % 2 === 0) {\n  numType = 'even';\n}\n```\n\n重启调试会话并点击\
  \ `Continue` 跳过当前断点。第一个测试“can add a place”现在通过了。但第二个测试没有通过。为了修复这个问题，我们需要另一个断点。移除当前断点，并在第\
  \ 16 行放置新断点，那里写着：\n\n```javascript\naddPlace('Cape Town', 'South Africa');\n```\n\
  \n启动新的调试会话：\n\n![Mocha test2 fail](img/152442835812-mocha-test2-error.png)\n\n\n\
  \n\n搞定！看 `Variables` 部分。即使在第二次测试开始之前，我们也发现 `places` 数组已经包含了由第一次测试创建的现有。这显然污染了我们当前的测试。为了修复这个问题，我们需要实现某种\
  \ `setup` 函数，为每个测试重置 `places` 数组。在 Mocha 中实现这一操作，只需在测试之前添加以下代码即可：\n\n```\nbeforeEach(()\
  \ => {\n  places.length = 0;\n});\n```\n\n重启调试器并让它停在断点处。现在，`places` 数组拥有了干净的状态。这应该允许我们的测试在不受污染的情况下运行。只需点击\
  \ *Continue*（继续）让剩余的测试代码执行即可。\n\n![Mocha tests passed](img/152442836013-mocha-tests-passing.png)\n\
  \n现在所有测试都通过了。你应该感觉很棒，因为你已经学会了如何在不写任何一行 `console.log` 的情况下调试代码。现在，让我们来看看如何使用浏览器调试客户端代码。\n\
  \n## 使用 Chrome 调试器 调试 JavaScript\n\n现在你已经熟悉了在 VS Code 中调试 JavaScript 的基础知识，我们将学习如何使用\
  \ [Debugger for Chrome](https://marketplace.visualstudio.com/items?itemName=msjsdiag.debugger-for-chrome)\
  \ 扩展来调试一个稍微复杂的项目。只需通过操作栏打开市场面板。搜索并安装该扩展。\n\n![Debugger for Chrome](img/152442836414-debugger-for-chrome.png)\n\
  \n安装完成后，点击刷新（reload）以激活扩展。让我们快速回顾一下将调试的代码。该 Web 应用程序主要是一个客户端 JavaScript 项目，通过运行\
  \ Express 服务器启动：\n\n```\nconst express = require('express');\n\nconst app = express();\n\
  const port = 3000;\n\n// Set public folder as root\napp.use(express.static('public'));\n\
  \n// Provide access to node_modules folder\napp.use('/scripts', express.static(`${__dirname}/node_modules/`));\n\
  \n// Redirect all traffic to index.html\napp.use((req, res) => res.sendFile(`${__dirname}/public/index.html`));\n\
  \napp.listen(port, () => {\n  console.info('listening on %d', port);\n});\n```\n\
  \n所有的客户端代码都在 `public` 文件夹中。项目的依赖项包括 `Semantic-UI-CSS`、`jQuery`、`Vanilla Router`、`Axios`\
  \ 和 `Handlebars`。这就是当你使用 `npm start` 运行项目时的样子。你需要在浏览器中打开 URL [localhost:3000](http://localhost:3000)\
  \ 查看应用程序。\n\n![Places missing table](img/152442836615-places-missing-table.png)\n\
  \n尝试添加一个新地点。当你这样做时，你会发现似乎什么发生。显然出问题了，是时候查看内部原理了。在开始调试会之前，我们先回顾代码。打开 `public/index.html`。我们目前的关注点是这一部分：\n\
  \n```\n<!-- TEMPLATES -->\n<!-- Places Form Template -->\n<script id=\"places-form-template\"\
  \ type=\"text/x-handlebars-template\">\n  <h1 class=\"ui header\">\n    <i class=\"\
  map marker alternate icon\"></i>\n    <div class=\"content\"> Places</div\n  </h1>\n\
  \  <hr>\n  <br>\n  <form class=\"ui form\">\n    <div class=\"fields\">\n      <div\
  \ class=\"inline field\">\n        <label>City</label>\n        <input type=\"text\"\
  \ placeholder=\"Enter city\" id=\"city\" name=\"city\">\n      </div\n      <div\
  \ class=\"inline field\">\n        <label>Country</label>\n        <input type=\"\
  text\" placeholder=\"Enter Country\" name=\"country\">\n      </</div>\n      <div\
  \ class=\"ui submit primary button\">Add Place</div</div></div>\n    </div>\n  </form>\n\
  \  <br>\n  <div id=\"places-table\"></div>\n</script>\n\n<!-- Places Table Template\
  \ -->\n<script id=\"places-table-template\" type=\"text/x-handlebars-template\"\
  >\n  <table class=\"ui celled striped table\">\n    <thead>\n      <tr>\n      \
  \  <th>Id</th>\n        <th>City</th>\n        <th>Country</th>\n        <th>NumType</th>\n\
  \      </tr>\n    </thead>\n    <tbody>\n      {{#each places}}\n      <tr>\n  \
  \      <td>{{id}}</td>\n        <td>{{city}}</td>\n        <td>{{country}}</td>\n\
  \        <td>{{numType}}</td>\n      </tr>\n      {{/each}}\n    </tbody>\n  </table>\n\
  </script>\n```\n\n如果你快速扫一眼，代码看起来是正确的。那么问题一定在 `app.js` 中。打开该文件并分析那里的代码。下面是你应该注意的代码段。请花时间阅读注释以理解代码。\n\
  \n\n\n嗯……这不对。地点已经添加了，但国家没有显示。问题显然不在 HTML 表格代码，因为第一行已经填充了国家单元格，所以 JavaScript 端一定发生了什么。打开\
  \ `app.js` 并在第 58 行添加一个断点，代码内容是：\n\n```\naddPlace(city, country);\n```\n\n重启调试会话并尝试再次添加新地点。执行将在你设置的断点处暂停。开始将鼠标悬停在相关变量上。你也可以将表达式添加到监视（watch）面板中，如下所示：\n\
  \n![发现国家 bug](img/152442838920-country-bug-found.png)\n\n如你所示，`country` 变量是 `undefined`，但\
  \ `city` 变量是有值的。如果你查看在监视面板中设置的 jQuery 选择器表达式，你会发现 `#country` 选择器没有返回任何。这意味着它不存在于\
  \ DOM 中。前往 `index.html` 进行验证。\n\n哎！如果你查看定义国家输入框的第 59 行，发现它缺少 `id` 属性。你需要像这样添加一个：\n\
  \n```\n<input type=\"text\" placeholder=\"Enter Country\" name=\"country\" id=\"\
  country\">\n```\n\n重启调试会话并尝试添加新地点。\n\n![修复国家 bug](img/152442839121-country-fixed.png)\n\
  \n现在可以工作了！干得好，在没有 `console.log` 的情况下修复另一个 bug。现在让我们处理最后一个 bug。\n\n## 调试客户端路由\n\n\
  点击导航栏中的 *Convert* 链接。你应该会被带到此视图执行快速转换：\n\n![转换货币](img/152442839322-convert-currency.png)\n\
  \n那个运行得良好。那里没有 bug。\n\n实际上是有的，而且它们与表单无关。要发现它们，请刷新页面。\n\n一旦你点击刷新，用户就会被导航回 `/`，即应用的根目录。这显然是一个路由问题，Vanilla\
  \ Router 软件包本应该处理它。回到 `app.js` 并寻找这一行：\n\n```\nrouter.navigateTo(window.location.path);\n\
  ```\n\n这段代码的作用是根据提供的 URL 将用户路由到正确的页面。但为什么它不起作用呢？让我们在这里添加一个断点，然后导航回 `/convert` URL\
  \ 并再次尝试刷新页面。\n\n一旦你刷新，编辑器就会在断点处暂停。鼠标悬停在表达式 `windows.location.path` 上。弹出的窗口显示值为 `undefined`。让我们进入调试控制台并输入下面的表达式：\n\
  \n![导航错误](img/15244283923-navigation-error.png)\n\n等一下！调试控制台刚刚给了我们正确的表达式。它应该是 `window.location.pathname`。修正该行代码，移除断点并重启调试会话。\n\
  \n导航到 `/convert` URL 并刷新。页面应该加载正确的路径。太棒了！\n\n这是我们要消灭的最后一个 bug 了，但我确实建议你在调试会话中继续尝试。设置新的断点来检查其他变量。例如，查看\
  \ `router('/convert')` 函数中的 `response` 对象。这演示了在处理新的 REST 端点时，如何使用调试会话来确定 API 请求返回的数据结构。\n\
  \n![检查响应](img/152442840424-response-inspect.png)\n\n## 总结\n\n现在我们已经到了本教程的末尾，你应该为自己学习了编程中的一项重要技能感到自豪。学习如何正确调试代码将帮助你更快修复错误。然而，你应该意识到，这篇文章仅仅触及了可能性的一角，你应该查看\
  \ VS Code 完整的[调试文档](https://code.visualstudio.com/docs/editor/debugging)。在这里你将找到更多关于特定命令的详细信息，以及我们还没有涵盖的断点类型，例如[条件断点](https://code.visualstudio.com/docs/editor/debugging#_conditional-breakpoints)。\n\
  \n我希望从现在起你停止使用 `console.log` 来调试，而是使用 VS Code 像专业人士一样调试 JavaScript！\n\n# 第 6 章：介绍\
  \ Axios，一个流行的基于 Promise 的 HTTP 客户端\n\n### 作者：Nilson Jacques\n\n[Axios](https://www.npmjs.com/package/axios)\
  \ 是一个流行的基于 Promise 的 HTTP 客户端，拥有易于使用的 API，并可以在浏览器和 Node.js 中使用。\n\n发送 HTTP 请求来获取或保存数据是客户端\
  \ JavaScript 应用程序最常见的任务之一。第三方库——尤其是 jQuery——长期以来一直是与冗冗的浏览器 API 交互的流行方式，并抽象了任何跨浏览器差异。\n\
  \n随着人们逐渐放弃 jQuery 而转向改进的原生 DOM API，或像 React 和 Vue.js 等前端 UI 库，纯粹为了 `$.ajax` 功能而包含它已经意义不大了。\n\
  \n让我们看看如何在代码中开始使用 Axios，并看看一些让它在 JavaScript 开发者中广受欢迎的特性。\n\n## Axios vs Fetch\n\n\
  正如你可能意识到的，现代浏览器内置了较新的 [Fetch API](https://www.sitepoint.com/introduction-to-the-fetch-api/)，那么为什么不直接用它呢？两者之间有许多差异，许多人认为这是\
  \ Axios 的优势所在。\n\n其中一个差异是两个库处理 [HTTP 错误](https://en.wikipedia.org/List_of_HTTP_status_codes)的方式。使用\
  \ Fetch 时，如果服务器返回 4xx 系列错误，不会触发 `catch()`。而 Axios 则会拒绝请求。\n\n另一个让初学 API 的开发者困惑的小差异是，Fetch\
  \ 在发送请求时不会自动发送 Cookie 到服务器。你需要显式地传递一个选项来包含它们。Axios 可以做到。\n\n对某些人来说障碍的是上传/下载的进度更新。由于\
  \ Axios 是构建在旧的 XHR API 之上的，你可以注册 `onUploadProgress` 和 `onDownloadProgress` 回调函数，在你的应用中显示完成百分比。目前\
  \ Fetch 不支持。\n\n最后，Axios 可以在浏览器和 Node.js 中使用。这有助于在浏览器和后端之间共享 JavaScript 代码，或进行服务端渲染。\n\
  \n#### Node 的 Fetch API\n\n虽然有[版本的 Fetch API](https://www.npmjs.com/package/isomorphic-fetch)，但我认为，Axios\
  \ 提供的其他功能使其更有优势。\n\n## 安装\n\n正如你预期的，安装 Axios 的常用方法是通过 npm 包管理器：\n\n```\nnpm i axios\n\
  ```\n\n并在需要的地方引入它：\n\n```\n// ES2015 样式导入\nimport axios from 'axios';\n\n// Node.js\
  \ 样式 require\nconst axios = require('axios');\n```\n\n如果你没有使用任何模块打包器（例如 webpack），那么你始终可以通过传统方式从\
  \ CDN 引入库：\n\n```\n<script src=\"https://unpkg.com/axios/dist/axios.min.js\"></script>\n\
  ```\n\n### 浏览器支持\n\nAxios 支持所有现代浏览器以及 Internet Explorer 8+。\n\n## 发送请求\n\n类似于 jQuery\
  \ 的 `$.ajax` 函数，你可以通过向 Axios 传递配置对象来发送任何类型的 HTTP 请求：\n\n```\naxios({\n  method:\
  \ 'post',\n  url: '/login',\n  data: {\n    user: 'brunos',\n    lastName: 'ilovenodejs'\n\
  \  }\n});\n```\n\n在这里，我们告诉 Axios 我们想要使用哪种 HTTP 方法（例如 GET/POST/DELETE 等）以及向哪个 URL\
  \ 发起请求。\n\n我们还以简单的 JavaScript 键值对的形式提供了一些随请求发送的数据。默认情况下，Axios 将其序列化为 JSON 并作为请求体发送。\n\
  \n### 请求选项\n\n\n\n\n在发送请求时，你可以传递许多[额外的选项](https://github.com/axios/axios#request-config)，但这里是几个最常用的：\n\
  \n* `baseUrl`:如果你指定了基础 URL，它将会被 set 置到你使用的任何相对 URL 之前。\n* `headers`:一个包含键/值对的对象，将作为请求头发送。\n\
  * `params`:一个包含键/值对的对象，该对象将被序列化并作为查询字符串附加到 URL 中。\n* `responseType`:如果你期望的响应格式 JSON\
  \ 于 JSON，可以将此属性设置为 `arraybuffer`、`blob`、`document`、`text` 或 `stream`。\n* `auth`:传递一个包含\
  \ `username` 和 `password` 字段的对象，将在请求中使用这些凭据进行 HTTP Basic 认证。\n\n## 便捷方法\n\n就像 jQuery\
  \ 一样，还有用于执行不同类型请求的快捷方法。\n\n`get`、`delete`、`head` 和 `options` 方法都接受两个参数：URL 和可选的配置对象。\n\
  \n```\naxios.get('/products/5');\n```\n\n`post`、`put` 和 `patch` 方法接受一个数据对象作为第二个参数，接受一个可选的配置对象作为第三个参数：\n\
  \n```\naxios.post(\n  '/products',\n  { name: 'Waffle Iron', price: 21.50 },\n \
  \ { options }\n);\n```\n\n## 接收响应\n\n一旦发送请求，Axios 返回一个 promise，该 promise 将解析为响应对象或错误对象。\n\
  \n```\naxios.get('/product/9')\n  .then(response => console.log(response))\n  .catch(error\
  \ => console.log(error));\n```\n\n### 响应对象\n\n当请求成功时，你的 `then()` 回调将接收一个包含以下属性的响应对象：\n\
  \n* `data`:从服务器返回的负载。默认情况下，Axios 期望 JSON 并将其解析回 JavaScript 对象。\n* `status`:服务器返回的\
  \ HTTP 状态码。\n* `statusText`:服务器返回的 HTTP 状态消息。\n* `headers`:服务器返回的所有响应头。\n* `config`:原始请求配置。\n\
  * `request`: 实际的 `XMLHttpRequest` 对象（当在浏览器中运行时）。\n\n### 错误对象\n\n如果请求出现问题，promise\
  \ 将拒绝并返回一个错误对象，该对象至少包含以下某些属性：\n\n* `message`:错误消息文本。\n* `response`:响应对象（如果已收到），如上一节所述。\n\
  * `request`:实际的 `XMLHttpRequest` 对象（当在浏览器中运行时）。\n* `config`:原始请求配置。\n\n## 转换器与拦截器\n\
  \nAxios 提供了两个受[Angular $http 库](https://docs.angularjs.org/api/ng/service/$http)启发的巧妙功能。尽管它们看起来相似，但用途略有不同。\n\
  \n### 转换器\n\nAxios 允许你提供函数来转换发送或传入的数据，形式为在发送请求时可以设置的两个配置选项：`transformRequest` 和\
  \ `transformResponse`。这两个属性都是数组，允许你链式调用数据通过的多个函数。\n\n传递给 `transformRequest` 的任何函数都适用于\
  \ PUT、POST 和 PATCH 请求。它们接收请求数据和 `headers` 对象作为参数，并必须返回修改后的数据对象。\n\n```\nconst options\
  \ = {\n  transformRequest: [\n    (data, headers) => {\n      // 对数据进行一些操作\n   \
  \   return data;\n    }\n  ]\n}\n```\n\n可以以相同的方式向 `transformResponse` 添加函数，但它们只用响应数据调用，并且在响应传递给任何链式\
  \ `then()` 回调之前进行调用。\n\n那么我们可以用转换器做什么呢？一个潜在的用例是处理期望特定格式数据的 API —— 例如 XML 甚至 CSV。你可以设置一对转换器，将传出和传入的数据与\
  \ API 要求的格式之间进行转换。\n\n值得注意的是，Axios 默认的 `transformRequest` 和 `transformResponse`\
  \ 函数会在数据与 JSON 之间进行转换，而指定你自己的转换器将覆盖这些默认设置。\n\n### 拦截器\n\n虽然转换器允许你修改发送和传入的数据，但 Axios\
  \ 还允许你添加名为[拦截器](https://github.com/axios/axios#interceptors)的函数。与转换器一样，这些函数可以挂载并在发送请求时或接收到响应时触发。\n\
  \n```\n// 添加请求拦截器\naxios.interceptors.request.use((config) => {\n    // 在发送请求之前做一些操作\n\
  \    return config;\n  }, (error) => {\n    // 对请求错误做一些操作\n    return Promise.reject(error);\n\
  \  });\n\n// 添加响应拦截器\naxios.interceptors.response.use((response) => {\n    // 对响应数据做一些操作\n\
  \    return response;\n  }, (error) => {\n    // 对响应错误做一些操作\n    return Promise.reject(error);\n\
  \  });\n```\n\n正如你可能从上面的示例中注意到的，拦截器与转换器有一些重要的区别。拦截器不仅仅接收数据或头部，它们接收完整的请求配置或响应对象。\n\
  \n在创建拦截器时，你还可以选择提供一个错误处理函数，允许你捕获任何错误并妥善处理它们。\n\n请求拦截器可以用于诸如[从本地存储中检索令牌并随所有请求发送](https://www.npmjs.com/package/axios-token-interceptor)，而响应拦截器可以用于[捕获\
  \ 401 响应并重定向到登录页面](https://gist.github.com/yajra/5f5551649b20c8f6aec48549ef5cf)。\n\
  \n## 第三插件\n\n作为一个流行的库，Axios 受益于扩展其功能的第三方库生态系统。从拦截器到测试适配器到日志记录，有很多选择。这里有几个你可能觉得有用的：\n\
  \n* [axios-mock-adapter](https://github.com/ctimmerm/axios-mock-adapter):允许你轻松模拟请求以方便测试代码。\n\
  * [axios-cache-plugin](https://github.com/jin5354/axios-cache-plugin):用于选择性缓存 GET\
  \ 请求的封装。\n* [redux-axios-middleware](https://github.com/svrcekmichal/redux-axios-middleware):如果你是\
  \ Redux 用户，此中间件提供了一种通过普通 action 调度 Ajax 请求的方便方法。\n\n更多[Axios 添加和扩展](https://github.com/axios/axios/blob/master/ECOSYSTEM.md)列表可以在\
  \ Axios GitHub 仓库中找到。\n\n总来说，Axios 有很多推荐它的理由。它具有简单的 API，并带有对于任何使用过 jQuery 的人来说都是熟悉的实用快捷方法。它的流行程度以及各种第三方插件的可用性，使其成为包含在应用程序（无论是前端、后端还是两者）中的的可靠选择。\n\
  \n"
