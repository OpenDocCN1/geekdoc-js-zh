- "# 现代 JavaScript 工具与技能\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 前言\n\n毫无疑问，JavaScript\
  \ 生态系统的变化非常快。不仅新工具和框架以快速的速度引入和开发，随着 `ES2015`（又称 `ES6`）的引入，语言本身也发生了巨大的变化。可以理解，有许多文章在抱怨如今学习现代\
  \ JavaScript 开发有多困难。我们的目标是通过这系列关于现代 JavaScript 的书籍尽量减少这种困惑。\n\n本书概述了每个现代 JavaScript\
  \ 开发者都应该掌握的基础工具和技能。\n\n## 谁应该读这本书？\n\n本书适合所有希望提高 JavaScript 技能的前端开发者。你需要熟悉 `HTML`\
  \ 和 `CSS`，并对 `JavaScript` 有合理的理解，才能跟上讨论。\n\n## 使用的规范\n\n### 代码示例\n\n书中的代码使用等宽字体显示，如下：\n\
  \n```\n <h1>一个完美的夏日</h1>\n<p>这是一个在公园散步的好日子。\n鸟儿在歌唱，孩子们都已回学校了。</p> \n```\n\n当需要现有代码作为上下文时，而不是重复所有内容，将显示\
  \ ⋮：\n\n```\n function animate() {\n    ⋮\nnew_variable = \"Hello\";\n}\n```\n\n\
  某些行代码应该在一行内输入，但由于页面限制，我们对它们进行了换行处理。➥ 表示仅为了格式目的而存在的换行，应该被忽略：\n\n```\n URL.open(\"\
  http://www.sitepoint.com/responsive-web-\n➥design-real-user-testing/?responsive1\"\
  );\n```\n\n你会注意到，我们在本书中使用了特定的布局样式来表示不同类型的信息。请关注以下项目。\n\n#### 提示、注释和警告\n\n#### 嘿，你！\n\
  \n提示（Tips）提供有用的小建议。\n\n#### 咳，打扰一下……\n\n注释（Notes）是与当前主题相关但并非关重要的补充说明。将它们视为额外的信息片段。\n\
  \n#### 确保你始终……\n\n…… 注意这些重要要点。\n\n#### 注意！\n\n警告（Warnings）突出了在过程中可能让你出错的任何陷阱。\n\n\
  # 第 1 章：Babel 入门指南\n\n### 作者 James Kolce\n\n本文介绍了 [Babel](https://babeljs.io/)，这是一个\
  \ JavaScript 编译器，允许开发者现在就使用下一代 JavaScript。\n\n在构建 Web 应用程序时，编写 JavaScript 可能会令人沮丧。我们必须考虑目标浏览器中可用的功能，以及当某个功能未实现时会发生什么。有些人会建议干脆不要使用，但如果我们正在复杂的东西，这在大多数情况下是非常痛苦的经历。\n\
  \n幸运的是，有些工具允许我们停止担心支持情况，只需编写我们能写的最好的代码。它们被称为转译器（transpilers）。`transpiler` 是一种将源代码作为输入并产生新源代码作为输出的工具，其语法不同，但在语义上尽可能接近原始代码——或理想情况下等同。\n\
  \n`Babel` 几乎是是将现代 JavaScript (`ES2015+`) 翻译为可在旧浏览器中运行的兼容实现的标准转译器。如果你只想专注于编写 JavaScript，它是完美的解决方案。\n\
  \n尽管 `Babel` 的主要目标是为旧（有时是当前的）浏览器翻译最新的 `ECMAScript` (`ES`) 标准，但它还可以做更多。存在一个由预设（presets）和插件（plugins）组成的生态系统，使得添加非标准功能成为可能。每个插件为你的代码提供一个新功能/转换，而预设只是插件的集合。\n\
  \n## 入门\n\n根据你的项目和使用的工具，有不同的方法来设置 `Babel`。在本文中，我们将解释如何使用 `CLI` 设置 `Babel`，尽管如果你正在使用构建系统或框架，可以查看[官方网站](https://babeljs.io/)上的特定说明。\n\
  \n在项目中设置 `Babel` 的第一步是使用 `npm` 安装包并将其作为开发依赖项。假设你已经准备好了 `Node.js` 环境，只需在终端中运行以下命令：\n\
  \n```\nmkdir babel-test\ncd babel-test\nnpm init -y\nnpm install --save-dev babel-cli\n\
  ```\n\n这将创建一个目录 (`babel-test`) 初始化项目（创建一个 `package.json` 文件）。\n\n接下来，我们可以打开 `package.json`\
  \ 并在 npm 脚本中添加一个 `build` 命令：\n\n```\n\"scripts\": {\n  \"build\": \"babel src -d\
  \ dist\"\n}\n```\n\n这将从 `src` 目录获取源文件并将输出到 `dist` 目录。\n\n等等！在运行 `Babel` 之前，我们必须安装并设置转换代码的插件。这样做最简单快速的方法是添加\
  \ [Env 预设](https://babeljs.io/docs/plugins/preset-env/)，它根据你指定的浏览器选择合适的插件。可以使用以下命令安装：\n\
  \n```\nnpm install babel-preset-env --save-dev\n```\n\n然后在项目的根目录下创建一个 `.babelrc`\
  \ 文件并添加预设：\n\n```\n{\n  \"presets\": [\"env\"]\n}\n```\n\n`.babelrc` 文件是你放置所有 Babel\
  \ 设置的地方。你将主要用它来设置预设和插件，但还有更多选项。你可以在 [Babel API 页面](https://babeljs.io/docs/usage/api/#options)\
  \ 查看完整列表。\n\n请注意，根据你的操作系统，点开头的文件默认是隐藏的。如果这对你来说有问题（或者你只是喜欢更少的文件），可以将 Babel 设置放在 `package.json`\
  \ 文件中，位于 `babel` 键下，如下：\n\n```json{\n  \"name\": \"babel-test\",\n  \"version\"\
  : \"1.0.0\",\n  \"babel\": {\n    // config\n  }\n}\n```\n\n\n\n\n最后，让我们创建 Babel\
  \ 期望找到的目录和文件：\n\n```\nmkdir src dist\n```\n\n并提供一些需要进行转换的内容：\n\n```\nlet a = 1;\n\
  let b = 2;\n[a, b] = [b, a];\nconsole.log(a);\nconsole.log(b);\n```\n\n此示例使用了[解构赋值](https://www.sitepoint.com/preparing-ecmascript-6-destructuring-assignment/)来交换两个变量的值。\n\
  \n## 运行 Babel\n\n现在你已经有了一个现用的 Babel 安装，可以执行 `build` 命令来运行编译过程：\n\n```\nnpm run build\n\
  ```\n\n这会将从 `src/main.js` 取出的代码，将其转换为 ES5 代码，并将转换后的代码输出到 `dist/main.js`。\n\n以下是生成的结果：\n\
  \n```\n\"use strict\";\n\nvar a = 1;\nvar b = 2;\nvar _ref = [b, a];\na = _ref[0];\n\
  b = _ref[1];\n\nconsole.log(a);\nconsole.log(b);\n```\n\n如你所见，`let` 已替换为 `var`，并且\
  \ Babel 引入了一个临时变量（用下划线表示）来方便交换。\n\n就是这样。你在 `src` 目录中编写的代码将被翻译为语言之前的版本。默认情况下，如果你不在预设（preset）中添加任何选项，它将加载所有转换。你也可以如下所示指定目标浏览器：\n\
  \n```json\n{\n  \"presets\": [\n    [\"env\", {\n      \"targets\": {\n        \"\
  browsers\": [\"last 2 versions\", \"safari >= 7\"]\n      }\n    }]\n  ]\n}\n```\n\
  \n这将加载支持每个浏览器最后两个版本以及大于等于版本 7 的 Safari 所需的转换。你可以在 [Browserlist 仓库](https://github.com/ai/browserslist#queries)\
  \ 中找到目标浏览器的可用选项。\n\n## Babel 生态系统：概述\n\n正如你在上一节中注意到的，安装 Babel 后，它本身不会做任何事情。我们必须安装一组插件来获得所需的行为，或者可以使用预设，它们是预定义的插件集合。\n\
  \n通常，你想要包含的每个功能都会以插件的形式存在。ES2015 的一些示例包括：\n\n* [常量](https://babeljs.io/docs/plugins/check-es2015-constants/)\n\
  * [箭头函数](https://babeljs.io/docs/plugins/transform-es2015-arrow-functions/)\n* [块级作用域函数](https://babeljs.io/docs/plugins/transform-es2015-block-scoped-functions/)\n\
  * [类](https://babeljs.io/docs/plugins/transform-es2015-classes/)\n* [for-of](https://babeljs.io/docs/plugins/transform-es2015-for-of/)\n\
  * [展开运算符](https://babeljs.io/docs/plugins/transform-es2015-spread/)\n* [模板字符串](https://babeljs.io/docs/plugins/transform-es2015-template-literals/)\n\
  \n请查看 Babel 文档中的[插件页面](https://babeljs.io/docs/plugins/#transform-plugins)获取完整列表。\n\
  \n但有时你不想一个一个地包含所有插件。因此，有一些预构建的预设，可以方便安装每个插件的过程。\n\n目前提供的三个官方预设是：\n\n* [Env](https://babeljs.io/docs/plugins/preset-env/)\n\
  * [React](https://babeljs.io/docs/plugins/preset-react/)\n* [Flow](https://babeljs.io/docs/plugins/preset-flow/)\n\
  \n`Env` 是最常用的预设，也是我们在这里使用的。它会根据目标浏览器自动加载所有必要的转换以使你的代码兼容。\n\n`React` 预设转换 React 项目中常见的代码，主要增加了对\
  \ [Flow](https://flow.org/) 注解和 [JSX](https://facebook.github.io/jsx/) 的兼容性。\n\n\
  最后，`Flow` 预设用于清理 [Flow](https://flow.org/) 类型注释（尽管它不会检查类型是否有效）。\n\n### Babel Polyfill（垫片）\n\
  \n有些 JavaScript 特性无法在语法上进行转换，通常是因为没有实现相应的功能——例如 Promises 和生成器函数（generator functions）。\n\
  \n这类功能必须通过库在浏览器实现才能在你的代码中使用，这就是 polyfill 的工作。\n\nBabel polyfill 由 [core-js](https://github.com/zloirock/core-js)\
  \ 和 [Regenerator](https://github.com/facebook/regenerator) 运行时组成。它们共同涵盖了 ES2015+\
  \ 的所有功能。\n\n### 高级用法\n\n如所述，Babel 还可以用于转换语言中尚未实现的功能。一个很好的例子是类字段（class fields）提案（目前处于\
  \ [TC39 stage 3 ：候选阶段](https://github.com/tc39/proposal-class-fields)）。这在 React\
  \ 开发者中特别流行，因为它消除了显式将方法绑定到特定组件的必要，并且意味着组件的 `state` 可以声明为类。\n\n\n\n\n[Webpack](https://webpack.js.org/)\
  \ 已成为现代 Web 开发中最重要的工具之一。它主要是一个用于 JavaScript 的模块打包器，但也可以教它来转换你所有的前端资源，如 HTML、CSS\
  \ 甚至图像。它可以让你对应用发出的 HTTP 请求数量有更多控制，并允许你使用这些资源的其他格式（例如 Pug、Sass 和 ES8）。Webpack 还允许你轻松地使用来自\
  \ npm 的包。\n\n本文面向 Webpack 初学者，将涵盖初始设置与配置、模块、加载器（loaders）、插件、代码分割和热模块替换。如果你觉得视频教程很有帮助，我强烈推荐将\
  \ Glen Maddern 的 [Webpack from First Principles](https://www.youtube.com/watch?v=WQue1AN93YU)\
  \ 作为起点，来理解是什么让 Webpack 变得特别的。它现在有点老了，但原理仍然一样，而且是一个非常棒的介绍。\n\n## 示例代码\n\n为了在家里跟着练习，你需要[安装好\
  \ Node.js](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。你也可以[从\
  \ GitHub 下载演示应用](https://github.com/markbrown4/webpack-demo)。\n\n## 安装\n\n让我们用 npm\
  \ 初始化一个新项目并安装 `webpack` 和 `webpack-cli`：\n\n```\nmkdir webpack-demo && cd webpack-demo\n\
  npm init -y\nnpm install --save-dev webpack webpack-cli\n```\n\n接下来我们将创建以下目录结构和内容：\n\
  \n```\n webpack-demo\n  |- package.json\n+ |- webpack.config.js\n+ |- /src\n+  \
  \ |- index.js\n+ |- /dist\n+   |- index.html\n```\n\n### `dist/index.html`\n\n```\n\
  <!doctype html>\n<html\n  <head>\n    <title>Hello Webpack</title>\n  </head>\n\
  \  <body>\n    <script src=\"bundle.js\"></script>\n  </body>\n</html>\n```\n\n\
  ### `src/index.js`\n\n```javascript\nconst root = document.createElement(\"div\"\
  )\nroot.innerHTML = `<p>Hello Webpack.</p>`\ndocument.body.appendChild(root)\n```\n\
  \n### `webpack.config.js`\n\n```javascript\nconst path = require('path')\n\nmodule.exports\
  \ = {\n  entry: './src/index.js',\n  output: {\n    filename: 'bundle.js',\n   \
  \ path: path.resolve(__dirname, 'dist')\n  }\n}\n```\n\n这告诉 Webpack 编译我们入口点 `src/index.js`\
  \ 中的代码并在 `/dist/bundle.js` 输出一个包。让我们添加一个运行 Webpack 的 [npm 脚本](https://docs.npmjs.com/misc/scripts)。\n\
  \n### `package.json`\n\n```json\n {\n    ...\n    \"scripts\": {\n-     \"test\"\
  : \"echo \\\"Error: no test specified\\\" && exit 1\"\n+     \"develop\": \"webpack\
  \ --mode development --watch\",\n+     \"build\": \"webpack --mode production\"\n\
  \    },\n    ...\n  }\n```\n\n使用 `npm run develop` 命令，我们可以创建第一个包！\n\n```\nAsset\
  \      Size      Chunks           Chunk Names\nbundle.js  2.92 KiB  main  [emitted]\
  \  main\n```\n\n你现在应该能够在浏览器中加载 `dist/index.html` 并看到“Hello Webpack”。\n\n打开 `dist/bundle.js`\
  \ 查看 Webpack 做了什么。顶部是 Webpack 的模块引导代码，最底部就是我们的模块。你可能现在还没觉得惊艳，但如果你已经到了这一步，现在就可以开始使用\
  \ ES Modules 了，Webpack 将能够生成一个可以在所有浏览器中运行的生产环境包。\n\n使用 `Ctrl` + `C` 重启构建并运行 `npm\
  \ run build` 在生产模式下编译我们的包。\n\n```\nAsset      Size       Chunks           Chunk\
  \ Names\nbundle.js  647 bytes  main  [emitted]  main\n```\n\n注意包的大小已经从 `2.92 KiB`\
  \ 降到了 `647 bytes`。\n\n再次查看 `dist/bundle.js`，你会看到一团杂乱的代码。我们的包已经通过 UglifyJS 进行了压缩：代码的运行方式完全相同，但实现了最小的文件大小。\n\
  \n*   `--mode development` 针对构建速度和调试进行优化\n*   `--mode production` 针对运行时执行速度和输出文件大小进行优化\n\
  \n## 模块\n\n使用 ES Modules，可以将大型程序拆分为许多较小的、自包含的程序。\n\n默认情况下，Webpack 知道如何使用 `import`\
  \ 和 `export` 语句消费 ES Modules。例如，让我们现在通过安装 [lodash-es](https://lodash.com/) 并添加第二个模块来尝试一下：\n\
  \n```bash\nnpm install --save-dev lodash-es\n```\n\n### `src/index.js`\n\n```javascript\n\
  import { groupBy } from \"lodash-es\"\nimport people from \"./people\"\n\nconst\
  \ managerGroups = groupBy(people, \"manager\")\n\nconst root = document.createElement(\"\
  div\")\nroot.innerHTML = `<pre>${JSON.stringify(managerGroups, null, 2)}</pre>`\n\
  document.body.appendChild(root)\n```\n\n### `src/people.js`\n\n```javascript\nconst\
  \ people = [\n  {\n    manager: \"Jen\"\n  },\n  {\n    manager: \"Bob\"\n  },\n\
  \  {\n    name: \"Shirley\"\n  }\n]\n\nexport default people\n```\n\n### 导入\n\n\
  等待，原文文本包含了一些重复或损坏的片段。在“模块”部分：\n\n```javascript\nimport { groupBy } from \"lodash-es\"\
  \nimport people from \"./people\"\n\nconst managerGroups = groupBy(people, \"manager\"\
  )\n\nconst root = document.createElement(\"div\")\nroot.innerHTML = `<pre>${JSON.stringify(managerGroups,\
  \ null, 2)}</pre>`\ndocument.body.appendChild(root)\n```\n\n### 加载器 (Loaders)\n\n\
  加载器允许你对导入的内容运行预处理器。这在处理类似 [Babel](http://babel.io/) 的：\n\n```bash\nnpm install --save-dev\
  \ babel-loader\n```\n\n### `webpack.config.js`\n\n```javascript\nconst path = require('path')\n\
  \nmodule.exports = {\n  entry: './src/index.js',\n  output: {\n    filename: 'bundle.js',\n\
  \    path: path.resolve(__dirname, 'dist')\n  },\n  module: {\n    rules: [\n  \
  \    {\n        test: /\\.js$/,\n        exclude: /(node_modules|bower_components)/,\n\
  \        use: {\n          loader: 'babel-loader',\n        }\n      }\n    ]\n\
  \  }\n}\n```\n\n### `.babelrc`\n\n```json\n{\n  \"presets\": [\n    [\"@babel/env\"\
  , {\n      \"modules\": false\n    }]\n  ],\n  \"plugins\": [\"syntax-dynamic-import\"\
  ]\n}\n```\n\n此配置防止 Babel 将 `import` 和 `export` 语句编译为 ES5，并启用动态导入——我们稍后将在代码分割章节中讨论。\n\
  \n### Sass\n\n加载器可以链联成一系列转换。一种演示其如何运作的良好方法是从 JavaScript 中导入 Sass：\n\n```bash\nnpm\
  \ install --save-dev style-loader css-loader sass-loader node-sass\n```\n\n### `webpack.config.js`\n\
  \n```javascript\nmodule.exports = {\n  ...\n  module: {\n    rules: [\n      ...\n\
  \      {\n        test: /\\.scss$/,\n        use: [\n          {\n            loader:\
  \ 'style-loader'\n          },\n          {\n            loader: 'css-loader'\n\
  \          },\n          {\n            loader: 'sass-loader'\n          }\n   \
  \     ]\n      }\n    ]\n  }\n}\n```\n\n这些加载器按照相反的顺序处理：\n\n*   `sass-loader` 将 Sass\
  \ 转换为 CSS。\n*   `css-loader` 解析 CSS 为 JavaScript 并解析任何依赖。\n*   `style-loader` 将我们的\
  \ CSS 输出到文档中的 `<style>` 标签中。\n\n你可以将这些想象成函数调用。一个加载器的输出作为下一个加载器的输入：\n\n```javascript\n\
  styleLoader(cssLoader(sassLoader(\"source\")))\n```\n\n\n\n\n让我们添加 Sass 源文件并将其作为模块导入。\n\
  \n`src/style.scss`\n\n```\n$bluegrey: #2b3a42;\n\npre {\n  padding: 8px 16px;\n\
  \  background: $bluegrey;\n  color: #e1e6e9;\n  font-family: Menlo, Courier, monospace;\n\
  \  font-size: 13px;\n  line-height: 1.5;\n  text-shadow: 0 1px 0 rgba(23, 31, 35,\
  \ 0.5);\n  border-radius: 3px;\n}\n```\n\n`src/index.js`\n\n```\n import { groupBy\
  \ } from 'lodash-es'\n  import people from './people'\n\n+ import './style.scss'\n\
  \n  ...\n```\n\n使用 `Ctrl` + `C` 和 `npm run develop` 重启构建。在浏览器中刷新 `index.html`，你应该就能看到一些样式了。\n\
  \n## CSS in JS\n\n我们刚刚作为模块从 JavaScript 中导入了一个 Sass 文件。\n\n打开 `dist/bundle.js` 并搜索\
  \ “pre {”。事实上，我们的 Sass 已经编译成了一个 CSS 字符串并作为模块保存在我们的包中。当我们将此模块导入到 JavaScript 时，`style-loader`\
  \ 会将该字符串输出到嵌入的 `<style>` 标签中。\n\n### 为什么要这样做？\n\n我在这里不会深入探讨这个话题，但有几个原因值得考虑：\n\n\
  *   你可能想要包含在项目中的 JavaScript 组件可能依赖于其他资源才能正常运行（HTML、CSS、图像、SVG）。如果这些内容都能打包在一起，那么导入和使用它们将简单得多。\n\
  \n*   **死代码消除（Dead code elimination）**：当 JS 组件不再被你的代码导入时，CSS 也也不再被导入。生成的包将只包含发挥作用的代码。\n\
  \n*   **CSS Modules**：CSS 的全局命名空间使得你很难确定对 CSS 的更改是否会产生任何副作用。[CSS modules](https://github.com/css-modules/css-modules)\
  \ 通过让 CSS 默认变为局部的，并暴露可以在 JavaScript 中引用的唯一类名来改变这一点。\n\n*   通过巧妙的方式打包/拆分代码来减少 HTTP\
  \ 请求数。\n\n## Images\n\n我们将查看的最后一个 loader 示例是使用 `file-loader` 处理图像。\n\n在标准的 HTML\
  \ 文档中，浏览器遇到 `img` 标签或带有 `background-image` 属性的元素时会获取图像。使用 Webpack，对于小图像，可以通过将图像源作为字符串存储在\
  \ JavaScript 内部来优化。这样做，你预加载了它们，浏览器以后就不需要单独的请求来获取它们：\n\n```\nnpm install --save-dev\
  \ file-loader\n```\n\n`webpack.config.js`\n\n```\n module.exports = {\n    ...\n\
  \    module: {\n      rules: [\n        ...\n+       {\n+         test: /\\.(png|svg|jpg|gif)$/,\n\
  +         use: [\n+           {\n+             loader: 'file-loader'\n+        \
  \   }\n+         ]\n+       }\n      ]\n    }\n  }\n```\n\n使用此命令下载一个[测试图像](https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png)：\n\
  \n```\ncurl https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png\
  \ --output src/code.png\n```\n\n使用 `Ctrl` + `C` 和 `npm run develop` 重启构建，现在你可以像模块一样导入了！\n\
  \n`src/index.js`\n\n```\n import { groupBy } from 'lodash-es'\n  import people from\
  \ './people'\n\n  import './style.scss'\n+ import './image-example'\n\n  ...\n```\n\
  \n`src/image-example.js`\n\n```\nimport codeURL from \"./code.png\"\n\nconst img\
  \ = document.createElement(\"img\")\nimg.src = codeURL\nimg.style = \"background:\
  \ #2B3A42; padding: 20px\"\nimg.width = 32\ndocument.body.appendChild(img)\n```\n\
  \n这将包含一个图像，其中 `src` 属性包含了图像自身的 [data URI](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/Data_URIs)：\n\
  \n```\n<img src=\"data:image/png;base64,iVBO...\" style=\"background: #2B3A42; padding:\
  \ 20px\" width=\"32\">\n```\n\n我们 CSS 中的背景图像也由 `file-loader` 处理。\n\n`src/style.scss`\n\
  \n```\n $bluegrey: #2b3a42;\n\n  pre {\n    padding: 8px 16px;\n-   background:\
  \ $bluegrey;\n+   background: $bluegrey url(\"code.png\") no-repeat center center\
  \ / 32px 32px;\n    color: #e1e6e9;\n    font-family: Menlo, Courier, monospace;\n\
  \    font-size: 13px;\n    line-height: 1.5;\n    text-shadow: 0 1px 0 rgba(23,\
  \ 31, 35, 0.5);\n    border-radius: 3px;\n  }\n```\n\n每个单独出现的变量名 (`varName`)、函数名\
  \ (`funcName()`)、类名 (`ClassName`)、路径名 (`/path.to.xxx`)、命令名 (`cmdname`) 以及以及它们的语句或表达式\
  \ (`ClassName.funcName(var1 + var2, \"cmd0 arg1\")`) 都需要反引号。如果上面的内容是加粗的 (****) 或斜体的\
  \ (**)，请删除星号并添加反引号。\n\n代码块由三个反引号包围。\n\n### 为什么要这样做？\n\n我在这里不会深入探讨这个话题，但有几个原因值得考虑：\n\
  \n*   你可能想要包含在项目中的 JavaScript 组件可能依赖于其他资源才能正常运行（HTML、CSS、图像、SVG）。如果这些内容都能打包在一起，那么导入和使用它们将简单得多。\n\
  \n*   死代码消除：当 JS 组件不再被你的代码导入时，CSS 也也不再被导入。生成的包将只包含发挥作用的代码。\n\n*   CSS Modules：CSS\
  \ 的全局命名空间使得你很难确定对 CSS 的更改是否会产生任何副作用。[CSS modules](https://github.com/css-modules/css-modules)\
  \ 通过让 CSS 默认变为局部的，并暴露可以在 JavaScript 中引用的唯一类名来改变这一点。\n\n*   通过巧妙的方式打包/拆分代码来减少 HTTP\
  \ 请求数。\n\n（注：由于提供的原文后部分存在大量重复的文本，已根据您的“不要重复输出原文”原则进行了去重处理，仅保留核心逻辑部分的翻译。）\n\n\n\n\
  \n在浏览器中打开 `http://localhost:5000` 并观察发生了什么。初始只获取了 `bundle.js`。当点击按钮时，聊天模块被导入并初始化。\n\
  \n![显示分块懒加载的网络请求](img/1521906882lazy-loading.png)\n\n只需少少精力，我们就为应用添加了动态代码分割和模块的懒加载。这是构建高性能\
  \ Web 应用程序的绝佳起点。\n\n## 插件\n\n虽然 `loaders` 在单个文件上执行转换，但 `plugins` 在跨越更大的代码块上进行操作。\n\
  \n现在我们正在打包代码、外部模块*以及*静态资源，我们的包体积将会增长——*非常快*。插件的作用是帮助我们以智能的方式分割代码，并为生产环境进行优化。\n\n\
  在不经意间，我们已经使用了许多[带有“mode”的默认 Webpack 插件](https://webpack.js.org/concepts/mode/#usage)\n\
  \n### development\n\n*   提供值为“development”的 `process.env.NODE_ENV`\n*   `NamedModulesPlugin`\n\
  \n### production\n\n*   提供值为“production”的 `process.env.NODE_ENV`\n*   `UglifyJsPlugin`\n\
  *   `ModuleConcatenationPlugin`\n*   `NoEmitOnErrorsPlugin`\n\n#### Production\n\
  \n在添加额外的插件之前，我们首先拆分配置，以便针对每个环境应用特定的插件。\n\n将 `webpack.config.js` 重命名为 `webpack.common.js`，并为开发和生产添加配置文件。\n\
  \n```\n- |- webpack.config.js\n+ |- webpack.common.js\n+ |- webpack.dev.js\n+ |-\
  \ webpack.prod.js\n```\n\n我们将使用 `webpack-merge` 将通用配置与特定环境的配置合并：\n\n```bash\nnpm\
  \ install --save-dev webpack-merge\n```\n\n#### webpack.dev.js\n\n```javascript\n\
  const merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
  \nmodule.exports = merge(common, {\n  mode: 'development'\n})\n```\n\n#### webpack.prod.js\n\
  \n```javascript\nconst merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
  \nmodule.exports = merge(common, {\n  mode: 'production'\n})\n```\n\n#### package.json\n\
  \n```json\n \"scripts\": {\n-    \"develop\": \"webpack --watch --mode development\"\
  ,\n-    \"build\": \"webpack --mode production\"\n+    \"develop\": \"webpack --watch\
  \ --config webpack.dev.js\",\n+    \"build\": \"webpack --config webpack.prod.js\"\
  \n   },\n```\n\n现在我们可以将开发环境特定的插件添加到 `webpack.dev.js`，将生产环境特定的插件添加到 `webpack.prod.js`。\n\
  \n#### Split CSS\n\n在为生产环境打包时，使用 [ExtractTextWebpackPlugin](https://webpack.js.org/plugins/extract-text-webpack-plugin)\
  \ 将 CSS 从 JavaScript 分离被认为最佳实践。\n\n目前的 `.scss` loaders 非常非常适合开发，因此我们将把它们从 `webpack.common.js`\
  \ 移动到 `webpack.dev.js`，并仅在 `webpack.prod.js` 中添加 `ExtractTextWebpackPlugin`。\n\n\
  ```bash\nnpm install --save-dev extract-text-webpack-plugin@4.0.0-beta.0\n```\n\n\
  #### webpack.common.js\n\n```javascript\n ...\n  module.exports = {\n    ...\n \
  \   module: {\n      rules: [\n        ...\n-       {\n-         test: /\\.scss$/,\n\
  -         use: [\n-           {\n-             loader: 'style-loader'\n-       \
  \    }, {\n-             loader: 'css-loader'\n-           }, {\n-             loader:\
  \ 'sass-loader'\n-           }\n-         ]\n-       },\n        ...\n      ]\n\
  \    }\n  }\n```\n\n#### webpack.dev.js\n\n```javascript\n const merge = require('webpack-merge')\n\
  \  const common = require('./webpack.common.js')\n\n  module.exports = merge(common,\
  \ {\n    mode: 'development',\n+   module: {\n+     rules: [\n+       {\n+     \
  \    test: /\\.scss$/,\n+         use: [\n+           {\n+             loader: 'style-loader'\n\
  +           }, {\n+             loader: 'css-loader'\n+           }, {\n+      \
  \       loader: 'sass-loader'\n+           }\n+         ]\n+       }\n+     ]\n\
  +   }\n  })\n```\n\n#### webpack.prod.js\n\n```javascript\n const merge = require('webpack-merge')\n\
  + const ExtractTextPlugin = require('extract-text-webpack-plugin')\n  const common\
  \ = require('./webpack.common.js')\n\n  module.exports = merge(common, {\n    mode:\
  \ 'production',\n+   module: {\n+     rules: [\n+       {\n+         test: /\\.scss$/,\n\
  +         use: ExtractTextPlugin.extract({\n+           fallback: 'style-loader',\n\
  +           use: ['css-loader', 'sass-loader']\n+         })\n+       }\n+     ]\n\
  +   },\n+   plugins: [\n+     new ExtractTextPlugin('style.css')\n+   ]\n  })\n\
  ```\n\n让我们比较两个构建脚本的输出：\n\n```\n> npm run develop\n\nAsset           Size      Chunks\
  \           Chunk Names\napp.bundle.js   28.5 KiB  app   [emitted]  app\nchat.bundle.js\n\
  ```\n\n```\nAsset           Size      Chunks           Chunk Names\napp.bundle.js\
  \   28.5 KiB  app   [emitted]  app\nchat.bundle.js\n```\n\n让我们比较两个构建脚本的输出：\n\n```\n\
  > npm run develop\nAsset           Size      Chunks           Chunk Names\napp.bundle.js\
  \   28.5 KiB  app   [emitted]  app\nchat.bundle.js\n```\n\n```\nAsset          \
  \ Size      Chunks           Chunk Names\napp.bundle.js   28.5 KiB  app   [emitted]\
  \  app\nchat.bundle.js\n```\n\n现在我们有了 `index.html`：\n\n```\n\n\n等待，提供的文本有些重复/损坏。让我根据提供的内容提供一个干净的版本。\n\
