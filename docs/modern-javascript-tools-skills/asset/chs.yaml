  \   28.5 KiB  app   [emitted]  app\nchat.bundle.js\n```\n\n让我们比较两个构建脚本的输出：\n\n```\n\
  > npm run develop\nAsset           Size      Chunks           Chunk Names\napp.bundle.js\
  \   28.5 KiB  app   [emitted]  app\nchat.bundle.js\n```\n\n```\nAsset          \
