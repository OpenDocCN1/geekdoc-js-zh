    \ be on the top of the call stack. As you can see the primary function calls the\
    \ secondary one. At that point, it creates a third context for secondary. The\
    \ call stack has the secondary on top, the primary in the middle and the Global\
    \ one on the bottom. Think of it like a Big Mac!\n\n# SCOPE AND SCOPE CHAIN\n\n\
    Two vital concepts to understand in JavaScript are Scope and Scope Chain. We have\
    \ been working through both of these without a real explanation. Now let's explain\
    \ them so you are aware of what they do.\n\n# Scope\n\nIn our code, variables\
    \ are not always accessible. Scope is the area where we can access them. When\
    \ we can't access them we say, “They are out of scope.” Let’s look at some code\
    \ to see a picture of this.\n\n```\n{\n  let scopeExample = 2222;\n}\n// scopeExample\
    \ can NOT be used here\n```\n\nWe declare a variable in the brackets. Once we\
    \ get outside the variable is out of scope. You see this all the time in loops.\
    \ This is an example of block Note that block scope was added in ES6. Block scope\
    \ variables are created with let and const. Declaring a variable with var is for\
    \ function scope. Remember var was originally in JavaScript. The other two were\
    \ added later.\n\nLet's see what the global scope looks like.\n\n```\nlet globalVar\
    \ = 93; // Declared in global scope\n```\n\n```\nfunction myFunction() {\n   \
    \ console.log(globalVar); // Accessing global variable inside\n}\n```\n\n```\n\
    myFunction(); // Output: 93\n```\n\nWe created the global var and then referenced\
    \ it inside the function. Now we can wrap this up with function scope.\n\n```\n\
    var sport = \"tennis\"; // global\n```\n\n```\nfunction changeSport() {\n    var\
    \ sport = \"racquetball\"; // local\n    console.log(sport);\n}\n```\n\n```\n\
    console.log(sport);\nchangeSport();\n```\n\n```\nconsole.log(sport);\n```\n\n\
    Do you know what the output will be? Here you go.\n\n![](img/ab725de6c0882bc442fb13461ecf8740_96_0.png)\n\
    \nSo once we are out of the function the variable is out of scope. We go back\
    \ to tennis from racquetball.\n\n# Scope Chain\n\nWhen we reference a variable\
    \ in JavaScript it will look up the scope chain to find it. For instance, our\
    \ function scope example has two sport variables. One in the function and one\
    \ that is global.\n\n```\nlet globalVar = 10; // Global scope\n```\n\n```\nfunction\
    \ outer() {\n  let outerFuncVar = 20; // Outer function scope\n```\n\n```javascript\n\
    function inner() {\n  let innerFuncVar = 30; // Inner function scope\n  console.log(globalVar);\
    \ // Accesses global variable\n  console.log(outerFuncVar); // Accesses variable\
    \ from outer scope\n  console.log(innerFuncVar); // Accesses local variable\n\
    \  inner();\n}\n\nouter();\n```\n\nIn this example, you can see the scope chain\
    \ in use. As the code is executed the console log statements access the values\
    \ in the variables. It prints out the following:\n\n![](img/ab725de6c0882bc442fb13461ecf8740_97_0.png)\n\
    \n# Lexical Scope\n\nJavaScript also has Lexical Scope, which refers to how variables\
