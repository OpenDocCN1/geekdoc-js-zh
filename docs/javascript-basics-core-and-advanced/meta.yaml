    \ name = 'Tom';\nconst primary = () => {\n  let x = 1;\n  const y = secondary();\n\
    \  x = x + y;\n  return x;\n}\nfunction secondary() {\n  var z = 2;\n  return\
    \ z;\n}\n```\n\nInitially the name, primary, and secondary are loaded. This is\
    \ the top-level code. Where the function body is only executed when called, this\
    \ all happens in the Execution Context.\n\n# Execution Context\n\nThis is defined\
    \ as an environment where a piece of JavaScript is executed. In this space, it\
    \ stores all the necessary information for code execution. Think of it as a container\
    \ for your JavaScript code. Similar to how your beer comes in a bottle.\n\n# Global\
    \ Execution Context\n\nThere is always one Global Execution Context where top-level\
    \ code. This is code not in a function. This is the default context for your JavaScript\
    \ code.\n\nOnce the top-level code is complete the functions and callbacks begin\
    \ to execute. There is one execution context per function. For each function call\
    \ a new context is created.\n\n# Inside\n\nWhat is inside the execution context\
    \ is the variable environment. Variables declared with var are inside as well\
    \ as functions and arguments object. The scope chain is also part of. This is\
    \ a reference to variables outside the current context. The this keyword is part\
    \ of it as well. All this is part of the creation phase which takes place before\
    \ execution.\n\n# Variable Environment\n\nScope Chain\n\nthis keyword\n\n# Arrow\
    \ Function Clarification\n\nArrow functions do not get arguments object or this\
    \ keyword. They can use the arguments object and this keyword from their closest\
    \ regular function parent. Don't let this detail trip you up when we use arrow\
    \ functions.\n\n# Creation\n\nLet's revisit our previous example. As we look at\
    \ this code block we need to see three different Execution Context created.\n\n\
    ```\nconst name = 'Tom';\nconst primary = () => {\n  let x = 1;\n  const y = secondary();\n\
    \  x = x + y;\n  return x;\n}\nfunction secondary() {\n  var z = 2;\n  return\
    \ z;\n}\n```\n\nIn the Global Execution Context there is the name variable then\
    \ references to primary and secondary functions. Also, each function gets an execution\
    \ context. The primary has a value of x that is known, whereas the value of y\
    \ is unknown until the secondary function is run.\n\n# Call Stack\n\nThe call\
    \ stack and the memory heap make up the JavaScript Engine. The call stack is where\
    \ the execution context gets stacked. This helps the system keep track of where\
    \ we are in the execution. The current execution context would be on the top.\n\
    \nSo in our example code, it first creates the Global Execution Context. Then\
