    # Execution Context


    This is defined as an environment where a piece of JavaScript is executed. In
    this space, it stores all the necessary information for code execution. Think
    of it as a container for your JavaScript code. Similar to how your beer comes
    in a bottle.


    # Global Execution Context


    There is always one Global Execution Context where top-level code. This is code
    not in a function. This is the default context for your JavaScript code.


    Once the top-level code is complete the functions and callbacks begin to execute.
    There is one execution context per function. For each function call a new context
    is created.


    # Inside


    What is inside the execution context is the variable environment. Variables declared
    with var are inside as well as functions and arguments object. The scope chain
    is also part of. This is a reference to variables outside the current context.
    The this keyword is part of it as well. All this is part of the creation phase
    which takes place before execution.'
