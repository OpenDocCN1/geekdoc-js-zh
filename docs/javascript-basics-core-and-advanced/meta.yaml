    # JAVASCRIPT HOISTING AND TDZ


    Working as a developer can seem like magic at times. Coding solutions can become
    tricky. Of course, you need to understand what is happening behind the scenes.
    One of those things in JavaScript is Hoisting.


    # Hoisting


    Hoisting is when JavaScript makes variables accessible before they are lifted
    to the top of their scope. Kind of sounds like magic, huh? Behind the scenes,
    the code is scanned for variable declarations. Then they are created in the variable
    environment object. Hoisting was added to the language to allow us to reference
    functions before they are declared.


    This process works differently for different types of variables. A function declaration
    is hoisted, its initial value is set to the function, and the scope is block (if
    you are in strict mode). A var variable is also hoisted. The default value is
    set to undefined. The scope is set to function. Using var for variables can be
    a cause of many bugs. Therefore, it should be avoided.


    When we use let and const to declare variables they are not hoisted. These variables
    are in The Temporal Dead Zone or'
- md: "\nTDZ. If you use it before it is declared you will get an error.\nThey are\
    \ block-scoped. So they only exist in the block.\n\n# Temporal Dead Zone\n\nTo\
    \ better understand the Temporal Dead Zone or TDZ, let's look at an example.\n\
    \n```javascript\nconst car = 'Honda';\n\nif (car === 'Honda') {\n  console.log(`Car\
    \ is a ${model}\\`); // Error\n  const years = 2024 - 2012;\n  console.log(years);\n\
    \  const model = 'Accord';\n  console.log(`Car is a ${model}\\`);\n}\n```\n\n\
    In this example, the model variable is used before it is defined. Therefore, it\
    \ is in the Temporal Dead Zone until it is declared. The reference will get a\
    \ Reference Error. Once it is initialized it is then safe to use. The TDZ was\
    \ created in ES6 to avoid other issues.\n\nMost programming languages have maps.\
    \ As I have worked in Java for many years I have grown accustomed to its usefulness.\
    \ JavaScript didn't originally have them. They were added in ES6 or ECMAScript.\n\
    \nA map is a data structure to map values to keys. Similar to objects where the\
    \ key is always a string. On a map, we can have any key. It could be an object,\
    \ array, or other map.\n\n# Declare\n\nTo declare a Map is similar to a set. Of\
    \ course, we need to add the key too.\n\n```javascript\nconst coffeeShops = new\
    \ Map();\ncoffeeShops.set(1,\"Starbucks Main Street\");\ncoffeeShops.set(2,\"\
    Starbucks Clinton Avenue\");\ncoffeeShops.set(3,\"Dunkin Donuts - First Ave\"\
    );\nconsole.log(coffeeShops);\n```\n\nIn this case, I just made the key integers.\
    \ With a map, I could use other things for the key too. Running this code results\
    \ in this message.\n\n![](img/ab725de6c0882bc442fb13461ecf8740_103_0.png)\n\n\
    It is also possible to chain calls to the set method like the following.\n\n```javascript\n\
    const coffeeShops = new Map();\ncoffeeShops.set(1,\"Starbucks Main Street\");\n\
    coffeeShops.set(2,\"Starbucks Clinton Avenue\");\ncoffeeShops.set(3,\"Dunkin Donuts\
    \ - First Ave\").set(4, \"Tom's Coffee House\");\ncoffeeShops.set(5,\"Central\
    \ Perk\");\nconsole.log(coffeeShops);\n```\n\nSo that is nice we can declare a\
    \ map and put data in. What if we want to retrieve data from the map?\n\n# Retrieve\n\
    \nTo get data out of the map we can use the get method. You just have to use the\
    \ key value to retrieve it.\n\n```javascript\nconst coffeeShops = new Map();\n\
    coffeeShops.set(1,\"Starbucks Main Street\");\ncoffeeShops.set(2,\"Starbucks Clinton\
    \ Avenue\");\ncoffeeShops.set(3,\"Dunkin Donuts - First Ave\").set(4, \"Tom's\
    \ Coffee House\");\ncoffeeShops.set(5,\"Central Perk\");\nconsole.log(coffeeShops.get(4));\n\
    ```\n\nWhen we run this we get out the value with a key of 4.\n\n![](img/ab725de6c0882bc442fb13461ecf8740_104_0.png)\n\
    \nImportant to note that the data type of the key does matter. So if I change\
    \ my 4 to a string it won't work.\n\n```javascript\nconst coffeeShops = new Map();\n\
    coffeeShops.set(1,\"Starbucks Main Street\");\ncoffeeShops.set(2,\"Starbucks Clinton\
    \ Avenue\");\ncoffeeShops.set(3,\"Dunkin Donuts - First Ave\").set(4, \"Tom's\
    \ Coffee House\");\ncoffeeShops.set(5,\"Central Perk\");\nconsole.log(coffeeShops.get('4'));\n\
    ```\n\nWhile we don’t get an error it just comes back as undefined.\n\n![](img/ab725de6c0882bc442fb13461ecf8740_105_0.png)\n\
    \nSo pay attention to the datatype or you might miss something. Not that I would\
    \ ever make a mistake :)\n\n# Delete\n\nSomething happens and we need to remove\
    \ something from the map. For instance, I must close my coffee shop.\n\n```javascript\n\
    const coffeeShops = new Map();\ncoffeeShops.set(1,\"Starbucks Main Street\");\n\
    coffeeShops.set(2,\"Starbucks Clinton Avenue\");\ncoffeeShops.set(3,\"Dunkin Donuts\
    \ - First Ave\").set(4, \"Tom's Coffee House\");\ncoffeeShops.set(5,\"Central\
    \ Perk\");\ncoffeeShops.delete(4);\nconsole.log(coffeeShops);\n```\n\nThen the\
