    \ to them they define it like this.\n\nJSON (JavaScript Object Notation) is a\
    \ lightweight data-interchange format. It is easy for humans to read and write.\
    \ It is easy for machines to parse and generate.\n\nWhere XML is more heavyweight\
    \ and not quite human-readable, JSON tries to reverse this. Of course, we can\
    \ let you decide that. Here is an example.\n\n```json\n{\"developer\":\"Tom\"\
    , \"linesCode\": 12000, \"repo\":\"accounting\", \"ide\": null}\n```\n\nThis object\
    \ has a few properties. Developer, lines of code, repo, and ide. The basic structure\
