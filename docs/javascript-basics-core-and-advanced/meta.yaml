    \ Rose\"];\n```\n\n```javascript\nconsole.log(stingSongs); // [\"Fields of Gold\"\
    ,\"King of Pain\",\"Wrapped Around Your Finger\",\"Desert Rose\"];\n```\n\n如果你需要混合数组，展开运算符也可以做到。当你修改并向数组中添加元素时，这会非常有用。\n\
    \n## 剩余运算符 (Rest Operator)\n\n剩余运算符允许函数处理不同配置的参数。它可以帮助设置数组或重构对象。\n\n```javascript\n\
    function total(...num) {\n  let tot = 0;\n  for (const n of num) {\n    tot +=\
    \ n;\n  }\n  return tot;\n}\nconsole.log (total(11, 22, 33, 44)); // 110\n```\n\
    \n这个 `total` 函数可以处理传递给它的多个参数。剩余运算符启用了该选项。\n\n## 对象解构 (Object Destructuring)\n\n\
    如果你有一个数组，你可能需要解包这些部分。为了做到这一点，你可以使用对象。\n\n```javascript\nconst atariGames = ['Pitfall',\
    \ 'Space Invaders', 'E.T.'];\n```\n\n```javascript\nconst [great, good, awful]\
    \ = atariGames;\n```\n\n这会将三个 Atari 游戏中的每一个赋值给单独的对象。如果有必要，你可以跳过一个并留空，如下：\n\n```javascript\n\
    const atariGames = ['Pitfall', 'Space Invaders', 'E.T.'];\n```\n\n```javascript\n\
    const [great, , awful] = atariGames;\n```\n\n在这种情况下，我们只使用第一个和最后一个游戏。JavaScript\
    \ 提供了很多工具来处理数组。展开和剩余运算符可以进行一些切分处理。然后你可以使用对象解构将它们拆开。如果你了解你的工具，你可以做任何你想做的事。\n\n\
    ## 第三部分 (PART THREE)\n\n这一部分涵盖了更高级的主题。例如执行上下文、调用栈、变量作用域和作用域链。每个部分都为你提供了 JavaScript\
    \ 拼图的碎片。\n\n## JavaScript Promise.all() (JAVASCRIPT PROMISE.ALL())\n\n如果你从未处理过异步任务，这可能会很有趣。它类似于告诉某人去给你买咖啡，然后继续其他工作。这些函数非常强大，但我们需要理解如何使用它们。\n\
    \n## Promise.all()\n\n`Promise.all()` 是一个静态方法。它接收一个可迭代的 Promise。这意味着什么？一个示例可以是完成值或任务的数组。代码示例可能会有所帮助。\n\
    \n```javascript\nconst promiseA = Promise.resolve(\"Tom\");\nconst promiseB =\
    \ 2024;\nconst promiseC = new Promise((resolve, reject) => {\n  setTimeout(resolve,\
    \ 100, 'foo');\n});\n```\n\nPromise.all([promiseA, promiseB, promiseC]).then((values)\
    \ => {\n  console.log(values);\n});\n```\n\n所有这些代码将输出以下。\n\n## 用例 (Use Case)\n\
    \n`Promise.all()` 用法的一个主要用例是调用一系列异步 API。一旦它们都响应，你可以将所有响应放入一个数组中。例如，你可能需要在多个社交媒体平台上发布内容。一旦它们都响应，你就可以查看是否成功。\n\
    \n## Promise.allSettled()\n\n类似于 `Promise.all()` 有 `Promise.allSettled()`。它也接收一个可迭代的\
    \ Promise。它在所有 Promise 都已决后返回。\n\n```javascript\nconst promise1 = Promise.resolve(3);\n\
    const promise2 = new Promise((resolve, reject) => {\n  setTimeout(reject, 100,\
    \ 'foo');\n});\n\nconst promises = [promise1, promise2];\n\nPromise.allSettled(promises).then((results)\
    \ =>\n  results.forEach((result) => console.log(result.status)),\n);\n```\n\n\
    ## all() vs allSettled()\n\n如果我们使用 `Promise.all()` 并调用三个 Promise，当其中一个被拒绝时，它们全部被拒绝。`Promise.allSettled()`\
    \ 则会分别解析或拒绝它们。因如此，你需要在选择一个之前了解需要什么。\n\n所以再次重申一下，如果你使用 `Promise.all()`，一旦其中一个 Promise\
    \ 被拒绝，它就会被拒绝。而 `Promise.allSettled()` 永远不会被拒绝，它会解析或拒绝数组中的每一个 Promise。\n\n结论是，JavaScript\
    \ 的异步工作是有帮助的。\n\n"
