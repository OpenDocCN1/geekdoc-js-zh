    \nDelta LTD Jimmyville\n\nXYZ Company New Heights\n\nThe tags in XML can make\
    \ things longer. JSON makes things a little shorter too. Most programming languages\
    \ can handle either one with the proper library.\n\n## Uses\n\nJSON is used primarily\
    \ to represent data for calling an API. Many developers prefer it over XML as\
    \ it is lightweight. Also, it is language-independent so you can use it with most\
    \ languages. Here is an example of calling an API with JSON.\n\n```json\n[\n \
    \ {\"command\" : \"ServerInfoService.getVersion\"},\n  {\"command\" : \"Examples.echo\"\
    ,\"args\" :{\"echo\" : \"Some text.\"}}\n]\n```\n\nThe service may respond with\
    \ this response.\n\n```json\n[{\n  \"result\" : {\n    \"version\" : \"9.0.9000\"\
    \n  },\n  \"result\" : {\n    \"echo\" : \"Some text.\"\n  }\n]\n```\n\nOur friends\
    \ at SmartBear detail this more in-depth. This simple example gives you a basic\
    \ understanding of calling an API or web service.\n\nWorking with JavaScript,\
    \ you will encounter JSON. This lightweight data format is easy to use. It has\
    \ some distinct advantages over XML. Where at one time AJAX was more common, today\
    \ most web applications use JSON instead.\n\n## JAVASCRIPT SPREAD AND REST OPERATOR\n\
    \nAs a kid, I would take things apart. My wristwatch, a radio, anything that I\
    \ could get my hands on. I am still curious about how things work. Although, I\
    \ try not to break things anymore.\n\nRussian nesting dolls can be challenging.\
    \ Each new one has another inside. JavaScript has something similar. The spread\
    \ operator can help us break apart an array or string.\n\n## Spread Operator\n\
    \nThe spread operator in JavaScript is (...) and is used to allow an array to\
    \ be expanded into separate elements.\n\n```javascript\nlet numbers = [1,2,3,4,5];\n\
    let maximum = Math.max(...numbers);\nlet minimum = Math.min(...numbers);\nconsole.log(maximum);\
    \ // 5\nconsole.log(minimum); // 1\n```\n\nHere we use it along with the Math\
    \ operators to get the maximum and minimum of the array. This is only one handy\
    \ use of the spread operator.\n\n```javascript\nconst policeSongs = [\"King of\
    \ Pain\", \"Wrapped Around Your Finger\"];\n```\n\n```javascript\nconst stingSongs\
    \ = [\"Fields of Gold\", ...policeSongs, \"Desert Rose\"];\n```\n\n```javascript\n\
    console.log(stingSongs); // [\"Fields of Gold\",\"King of Pain\",\"Wrapped Around\
    \ Your Finger\",\"Desert Rose\"];\n```\n\nIf you need to mix arrays, the spread\
    \ operator can also do that. This can come in handy as you modify and add elements\
    \ to arrays.\n\n## Rest Operator\n\nThe rest operator allows a function to handle\
    \ different configurations of parameters. It can help set up an array or restructure\
    \ an object.\n\n```javascript\nfunction total(...num) {\n  let tot = 0;\n  for\
    \ (const n of num) {\n    tot += n;\n  }\n  return tot;\n}\nconsole.log (total(11,\
    \ 22, 33, 44)); // 110\n```\n\nThis total function can handle multiple parameters\
    \ passed to it. The rest operator enables that option.\n\n## Object Destructuring\n\
    \nIf you have an array, you might need to unpack the parts. To do this you can\
    \ use object.\n\n```javascript\nconst atariGames = ['Pitfall', 'Space Invaders',\
    \ 'E.T.'];\n```\n\n```javascript\nconst [great, good, awful] = atariGames;\n```\n\
    \nThis assigns each one of the three Atari games to an individual object. If necessary,\
    \ you can omit one and leave it empty like this.\n\n```javascript\nconst atariGames\
    \ = ['Pitfall', 'Space Invaders', 'E.T.'];\n```\n\n```javascript\nconst [great,\
    \ , awful] = atariGames;\n```\n\nIn this scenario, we only use the first and last\
    \ games. JavaScript gives you a lot of tools to handle arrays. The spread and\
    \ rest operator can do some slicing and dicing. Then you can use object destructing\
    \ to pull things apart. If you know your tools you can do about anything you want.\n\
    \n## PART THREE\n\nThis section covers the more advanced topics. Such as, the\
    \ execution context, call stack, variable scope and the scope chain. Each gives\
    \ you a piece of the JavaScript puzzle.\n\n## JAVASCRIPT PROMISE.ALL()\n\nIf you\
    \ have never worked with asynchronous tasks, it can be interesting. It's similar\
    \ to telling someone to get you a coffee and continue with other work. These functions\
    \ are powerful but we need to understand how to use them.\n\n## Promise.all()\n\
    \nThe Promise.all() is a static method. It takes an iterable of promises. What\
    \ does that mean? An example could be an array of fulfillment values or tasks.\
    \ A code example may help.\n\n```javascript\nconst promiseA = Promise.resolve(\"\
    Tom\");\nconst promiseB = 2024;\nconst promiseC = new Promise((resolve, reject)\
    \ => {\n  setTimeout(resolve, 100, 'foo');\n});\n```\n\nPromise.all([promiseA,\
    \ promiseB, promiseC]).then((values) => {\n  console.log(values);\n});\n```\n\n\
    All this code prints the following.\n\n## Use Case\n\nOne prime use case for the\
    \ Promise.all() usage is to call a series of asynchronous APIs. Then once they\
    \ all respond you can put all of the responses into an array. For instance, you\
    \ may have to post content on several social media platforms. Once they respond\
    \ you can review to see if it was successful.\n\n## Promise.allSettled()\n\nSimilar\
    \ to the Promise.all() is the Promise.allSettled(). It also takes an iterable\
    \ of promises. It returns when the promises are fulfilled.\n\n```javascript\n\
    const promise1 = Promise.resolve(3);\nconst promise2 = new Promise((resolve, reject)\
    \ => {\n  setTimeout(reject, 100, 'foo');\n});\n\nconst promises = [promise1,\
    \ promise2];\n\nPromise.allSettled(promises).then((results) =>\n  results.forEach((result)\
    \ => console.log(result.status)),\n);\n```\n\n## all() vs allSettled()\n\nIf we\
    \ use Promise.all() and call three promises when one is rejected they are all.\
    \ Where Promise.allSettled() will resolve or reject them separately. For this\
    \ reason, you need to understand what is required before you choose one.\n\nSo\
    \ to reiterate this if you use Promise.all() will be rejected as soon as one promise\
    \ is rejected. Where Promise.allSettled() will never be rejected it will it resolve\
    \ or reject each promise in the array.\n\nIn conclusion, asynchronous work in\
    \ JavaScript can be helpful.\n"
