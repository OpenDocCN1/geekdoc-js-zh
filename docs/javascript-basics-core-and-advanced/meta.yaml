    ## functions


    There are a myriad of functions that we can use on strings in JavaScript. We can
    look over a few.


    ## length


    We can get the length of the string with the length function.


    ```javascript

    let sampleText = "A long time ago in a galaxy far far away...";

    let length = sampleText.length;

    ```


    This can be used a lot with loops.


    ## indexOf


    The indexOf can give us the location of a word or letter.


    ```javascript

    let sentence = "A quick brown fox jumped over the lazy dog.";

    let foxIndex = text.indexOf("fox");

    ```


    Using the indexOf and the slice function can help you break strings apart.


    ## slice


    If you need to pull out parts of a string the slice function can come in handy.


    ```javascript

    let animals = "Fox, Horse, Cow";

    let farmAnimals = animals.slice(5);

    ```


    We take the last two words of this string and create a new string.


    ## Comparing


    Comparing strings in JavaScript has two types: Strict and loose comparisons that
    are subtly different.


    ```javascript

    let str1 = "lowBasketball";

    let str2 = "Basketball";

    ```


    ```javascript

    console.log(str1 === str2); // false

    ```


    This is an example of strict comparison.


    ```javascript

    let num1= 23;

