    Here is an example of a closure. The outer function outerFunction() creates a
    variable x and a function innerFunction(). The inner function innerFunction()
    returns the value of the variable x. The outer function then returns the inner
    function innerFunction().


    Next inner function innerFunction() is assigned to the variable inner. When the
    variable inner is called, it returns the value of the variable x, even though
    the outer function outerFunction() has already returned.


    In a moment we can cover lexical scoping. First, let''s understand why we need
    them. Plus some disadvantages too.


    # Pros and Cons


    Closures can help hide the encapsulation details. Like Java’s private variables
    and functions, this allows us to control access. The downside of this is closures
    take up more memory. These items can not be garbage collected. Lastly, it can
    slow down execution. Deepak Mankotia explores this more in-depth.


    # Lexical Scoping


