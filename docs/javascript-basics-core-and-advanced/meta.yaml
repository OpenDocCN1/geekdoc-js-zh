  md: "# Variable Environment\n\nScope Chain\n\nthis keyword\n\n# Arrow Function Clarification\n\
    \nArrow functions do not get arguments object or this keyword. They can use the\
    \ arguments object and this keyword from their closest regular function parent.\
    \ Don't let this detail trip you up when we use arrow functions.\n\nCreation\n\
    \nLet's revisit our previous example. As we look at this code block we need to\
