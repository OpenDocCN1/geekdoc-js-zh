    ## JavaScript Number


    So we can do things like this in JavaScript.


    ```javascript

    let num1 = 1.234;      // A number with decimals

    let num2 = 5;           // A number without decimals

    ```


    We can use decimals or we can use whole numbers.


    ```javascript

    let bigNum = 423e6;      // 423000000

    let smallNum = 552e-5;   // 0.00552

    ```


    When numbers get large we can use scientific notation too. These two show us how
