    \ 2: \"Sta...\"\n  Number 1: \"Starbucks Main Street\"\n  Number 2: \"Starbucks\
    \ Clinton Avenue\"\n  Number 3: \"Dunkin Donuts - First Ave\"\n  Number 5: \"\
    Central Perk\"}\n```\n\nNow the map only has the four elements left.\n\n# Size\n\
    \nWe get the size of the map with the size method. It can be helpful as you add\
    \ and remove elements.\n\n```javascript\nconst coffeeShops = new Map();\ncoffeeShops.set(1,\"\
    Starbucks Main Street\");\ncoffeeShops.set(2,\"Starbucks Clinton Avenue\");\n\
    coffeeShops.set(3,\"Dunkin Donuts - First Ave\").set(4, \"Tom's Coffee House\"\
    );\ncoffeeShops.set(5,\"Central Perk\");\nconsole.log(coffeeShops.size);\n```\n\
    \nSo when you run this would see 5 as the output.\n\n# Clear\n\nYou can also clear\
    \ everything out of your map with the clear method.\n\n```javascript\nconst coffeeShops\
    \ = new Map();\ncoffeeShops.set(1,\"Starbucks Main Street\");\ncoffeeShops.set(2,\"\
    Starbucks Clinton Avenue\");\ncoffeeShops.set(3,\"Dunkin Donuts - First Ave\"\
    ).set(4,\"Tom's Coffee House\");\ncoffeeShops.set(5,\"Central Perk\");\nconsole.log(coffeeShops.size);\n\
    coffeeShops.clear();\nconsole.log(coffeeShops.size);\n```\n\nWhen you run this\
    \ would see 5 and then o.\n\n# Objects as Key\n\nThere may come a time when you\
    \ need to create a map with an object as a key.\n\n```javascript\nconst numArr\
    \ = [2,4];\nconst numMap = new Map();\nnumMap.set(numArr,\"value\");\nconsole.log(numMap.get(numArr));\n\
    ```\n\nWhen we run this note the output in the second scenario. We can use the\
    \ elements of numArr.\n\n![](img/ab725de6c0882bc442fb13461ecf8740_108_0.png)\n\
    \nMaps can do a lot for you. Take time to master them. Early in my career I am\
    \ amazed at how JavaScript has progressed with all these features.\n\n# JAVASCRIPT\
    \ SETS\n\nPart of learning to program is to understand your options. A collection\
    \ of things can be stored in a few ways. Sets were introduced. A Set is a collection\
    \ of unique values and they never have duplicates. They can be quite handy to\
    \ use.\n\n# Declare\n\nTo declare a set in JavaScript is quite simple. Here is\
    \ a set of cars:\n\n```javascript\nconst cars = new Set([\"Ford\", \"Chevy\",\
    \ \"Honda\"]);\n```\n\nWe have three elements. What if we put a value in twice?\n\
    \n# Duplicates\n\nA Set will take care of duplicates for you. It will remove the\
    \ repeated values. Here is an example where we added Ford twice.\n\n```javascript\n\
    const cars = new Set([\"Ford\", \"Chevy\", \"Honda\", \"Ford\"]);\nconsole.log(cars);\n\
    ```\n\nWhat do you think this will print out? Four or three? Let's take a look.\n\
    \n![](img/ab725de6c0882bc442fb13461ecf8740_110_0.png)\n\n# Size\n\nWe can get\
    \ the size of the set like this:\n\n```javascript\nconst runningShoes = new Set([\"\
    Nike\", \"Asics\", \"Hoka\"]);\nconsole.log(\"set of running shoes has \" + runningShoes.size\
    \ + \" elements.\");\n```\n\nThe output would look like this:\n\n```\nConsole\
    \ ×\nset of running shoes has 3 elements.\n```\n\nNote that the size is for sets\
    \ whereas length is for arrays. That can be confusing.\n\n# Check\n\nWhen we want\
    \ to check for an element in the set we can use the has method.\n\n```javascript\n\
    const taxYears = new Set([2023, 2024, 2025]);\nconsole.log(taxYears.has(2025));\n\
    console.log(taxYears.has(2015));\n```\n\nHere we have a set of numbers representing\
    \ the tax years. Using the has method we check to see if our set contains the\
    \ years. Here is our output.\n\n![](img/ab725de6c0882bc442fb13461ecf8740_112_0.png)\n\
    \nThe has method is similar to the includes for arrays.\n\n# Delete\n\nIf you\
    \ need to remove an element from the set you can use the delete method.\n\n```javascript\n\
    const taxYears = new Set([2023, 2024, 2025]);\nconsole.log(taxYears);\ntaxYears.delete(2025);\n\
    console.log(taxYears);\n```\n\nWhen we run this we see the following:\n\n![](img/ab725de6c0882bc442fb13461ecf8740_112_1.png)\n\
    \nThere is no way to retrieve values from a set. Unlike arrays, they don't have\
    \ an index. You can use the has method to see if a value is in the set. If you\
    \ need to retrieve values, you should use an array, not a set.\n\n# Clear\n\n\
    You can use the clear method if you need to delete all of the elements in the\
    \ set.\n\n```javascript\nconst taxYears = new Set([2023, 2024, 2025]);\nconsole.log(taxYears);\n\
    taxYears.clear();\nconsole.log(taxYears);\n```\n\nAnd I bet you can guess what\
    \ happens. Of course, be careful using this. Once its gone its gone.\n\n# Iterate\n\
    \nYou can iterate through a set. We can use a for loop to do that.\n\n```javascript\n\
    const nbaLegends = new Set([\"Michael Jordan\", \"Jerry West\"]);\nfor (let legend\
    \ of nbaLegends) {\n  console.log(legend);\n}\n```\n"
