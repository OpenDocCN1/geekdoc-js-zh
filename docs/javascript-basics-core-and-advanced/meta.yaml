    ```\n\n```javascript\n} while (donutsEaten < 5)\nconsole.log(\"I'm full of Donuts!\"\
    );\n```\n\n`do while` 会一直运行到条件为 `false`——这与我们讨论过的其他两种循环类型相反。输出看起来如下：\n\n- Donuts\
    \ eaten 0\n- Donuts eaten 1\n- Donuts eaten 2\n- Donuts eaten 3\n- Donuts eaten\
    \ 4\n- I'm full of Donuts!\n\n当你需要循环执行代码时，JavaScript 为你提供了几种选择。像其他编程语言一样，它有 `for`、`while`\
    \ 和 `do-while` 循环。只需确保它符合你的需求即可。\n\n## JavaScript 变量作用域\n\n我妻子切换话题很快。我开开玩笑说她需要转向灯，这样我就能跟上她转移的焦点。她正在聊晚餐，然后我们就转到了下一次度假。\n\
    \n## 作用域\n\n我们的代码也有类似的作用域概念。变量可以快速进入或作用域。作为开发者，我们必须将这个概念放在核心位置。\n\n在 JavaScript\
    \ 中有几种不同类型的作用域。我们可以相应地使用它们。如果你做过其他编程，就会遇到过类似的概念。\n\n## 全局\n\n全局作用域的项随处可见。在我们的示例中，我们在函数内部和外部创建了可见的变量。\n\
    \n```javascript\nlet myGlobalVariable = \"TheBigGlobalVariable\";\n```\n\n```javascript\n\
    function logOutGlobalVariable() {\n    console.log(myGlobalVariable);\n}\n\nlogOutGlobalVariable();\n\
    ```\n\n我打赌你在想，如果我在函数里添加一个变量呢？这让我们看到了局部作用域的示例。\n\n## 局部\n\n局部变量仅在函数内部可见。这里有一个示例可以尝试一下。\n\
    \n```javascript\nlet myGlobalVariable = \"TheBigGlobalVariable\";\n\nfunction\
    \ logOutGlobalVariable() {\n    console.log(myGlobalVariable);\n    let localVariable\
    \ = \"TheLocalOne\";\n    console.log(localVariable);\n}\n\nlogOutGlobalVariable();\n\
    ```\n\n```javascript\nconsole.log(localVariable);\n```\n\n如果我们运行这段代码，在最后一行将会得到一个错误。\n\
    \n```javascript\nconsole.log(localVariable);\n^\nReferenceError: localVariable\
    \ is not defined\n```\n\n所以你可以看到当你不小心将变量放在错误位置时会发生什么。\n\n## 块\n\n如果说局部作用域是在函数内部，那么块级作用域（block\
    \ scope）则在大括号内部。有时你会创建大括号来标识某些代码。让我们来看看我的意思。\n\n```javascript\nconsole.log(\"\
    here\");\n{\n  let blockScopeVariable = 0;\n  console.log(blockScopeVariable);\n\
    }\n// 我们在此处无法引用 blockScopeVariable\n```\n\n```javascript\nconsole.log(blockScopeVariable);\
    \ // 无法工作\n```\n\n你可以看到，我们在大括号内创建了一个块级作用域变量。然后在外部，它将无法被引用。\n\n## 陷阱\n\n作用域可能会令人困惑并导致一些错误。随着你\
    \ JavaScript 经验的增加，你可以尽早发现它们。例如，如果我们看这段代码片段：\n\n```javascript\nconst colors =\
    \ ['red', 'blue', 'white'];\n\nfor (let i = 0, l = colors.length; i < l; i++)\
    \ {\n  console.log(colors[i]); // 'red', 'blue', 'white'\n}\nconsole.log(l); //\
    \ ???\nconsole.log(i); // ???\n```\n\n变量 `i` 和 `l` 将导致引用错误。它们与我们之前的示例一样超出了作用域。Dmitry\
    \ Pavlutin 更深入地解释了这一点。他还涵盖了我们在编码中可能犯的更多常见错误。\nJavaScript 作用域有几个需要记住的基本原则。全局作用域随处可见。局部和块级作用域更集中。总体而言，你应该使用后者并避免前者。继续编码吧！\n\
    \n## 7\n\n## JavaScript 闭包\n\n在我的开发生涯中偶尔接触 JavaScript，闭包（Closures）是我不经常遇到的东西。它们有很大的价值。\n\
    \n## 闭包\n\n我们如何定义闭包？嗯，这篇文章是这样定义的：“闭包是一种词法作用域（lexical scoping）的形式，用于在函数的内部作用域保留来自函数外部作用域的变量。”\n\
    \n```javascript\nfunction outerFunction() {\n  var x = 10;\n  function innerFunction()\
    \ {\n    return x;\n  }\n  return innerFunction;\n}\n```\n\nvar inner = outerFunction();\n\
    \n```javascript\nconsole.log(inner());\n```\n\n这是一个闭包的示例。外部函数 `outerFunction()`\
    \ 创建了一个变量 `x` 和一个函数 `innerFunction()`。内部函数 `innerFunction()` 返回变量 `x` 的值。然后外部函数返回内部函数\
    \ `innerFunction()`。\n\n接下来，内部函数 `innerFunction()` 被赋值给变量 `inner`。当调用变量 `inner`\
    \ 时，它返回变量 `x` 的值，即使外部函数 `outerFunction()` 已经返回。\n\n稍后我们可以涵盖词法作用域。首先，让我们理解为什么我们需要它们。以及一些缺点。\n\
    \n## 优缺点\n\n闭包可以帮助隐藏封装细节。类似于 Java 的私有变量和函数，这允许我们控制访问。此的缺点是闭包占用更多内存。这些项无法被垃圾收集。最后，它可以减慢执行。Deepak\
    \ Mankotia 更深入地探讨了这一点。\n\n## 词法作用域\n\n词法作用域术是指变量定义的位置。以及它是否可以被引用。\n\n```javascript\n\
    let x = 10\nlet myFunc = function () {\n  let y = 20;\n  console.log(\"x and y\
    \ is accessible (outer):\", x, y);\n  let insideFunc= function () {\n    let z\
    \ = 30;\n    console.log(\"x and y and z is accessible (inner):\", x, y, z);\n\
    \  }\n  insideFunc();\n  return;\n}\nmyFunc();\n```\n\nconsole.log(\"only x is\
    \ accessible (global):\", a);\n\n"
