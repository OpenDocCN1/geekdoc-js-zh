  md: '# Statement


    The statement is the basic instruction for JavaScript. We can create some variables
    and then assign them values.


    ```

    let a, b, c;      // Statement creating three variables

    a = 2;                   // Statement assign the value of 2 to

    variable a

    b = 3;               // Statement assign the value of 3 to

    c = a + b;              // Statement assign a plus b to c

    ```


    The semicolon is at the end of the statement. However, we could put multiple statements
    together.


    ```

    a = 2; b = 3;

    ```


    This isn''t as readable as most programmers prefer not to. So just because you
    can do something doesn''t mean you should.


    # Functions


    When we want to perform a task we can create a function. If we need to sum two
    numbers we could do this in code or create a function.'
