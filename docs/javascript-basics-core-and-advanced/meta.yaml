  md: '# JAVASCRIPT HOISTING AND TDZ


    Working as a developer can seem like magic at times. Coding solutions can become
    tricky. Of course, you need to understand what is happening behind the scenes.
    One of those things in JavaScript is Hoisting.


    # Hoisting


    Hoisting is when JavaScript makes variables accessible before they are lifted
    to the top of their scope. Kind of sounds like magic, huh? Behind the scenes,
    the code is scanned for variable declarations. Then they are created in the variable
    environment object. Hoisting was added to the language to allow us to reference
    functions before they are declared.


    This process works differently for different types of variables. A function declaration
    is hoisted, its initial value is set to the function, and the scope is block (if
    you are in strict mode). A var variable is also hoisted. The default value is
    set to undefined. The scope is set to function. Using var for variables can be
    a cause of many bugs. Therefore, it should be avoided.


    When we use let and const to declare variables they are not hoisted. These variables
    are in The Temporal Dead Zone or'
