    In the Global Execution Context there is the name variable then references to
    primary and secondary functions. Also, each function gets an execution context.
    The primary has a value of x that is known, whereas the value of y is unknown
    until the secondary function is run.


    # Call Stack


    The call stack and the memory heap make up the JavaScript Engine. The call stack
    is where the execution context gets stacked. This helps the system keep track
    of where we are in the execution. The current execution context would be on the
    top.


    So in our example code, it first creates the Global Execution Context. Then when
    the primary function is called it would create its context that would then be
    on the top of the call stack. As you can see the primary function calls the secondary
    one. At that point, it creates a third context for secondary. The call stack has
    the secondary on top, the primary in the middle and the Global one on the bottom.
    Think of it like a Big Mac!'
