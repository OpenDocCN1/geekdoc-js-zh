    \n```\nReferenceError: vInner is not defined\nat outerFunc (<anonymous>:19:15)\n\
    at <anonymous>:22:1\nat mn (<anonymous>:16:5455)\n```\n\nThe global variable is\
    \ accessible everywhere. The outer is accessible in the outer function and inner\
