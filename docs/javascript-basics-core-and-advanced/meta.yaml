    \ the Temporal Dead Zone or TDZ let's look at an example.\n\n```\nconst car =\
    \ 'Honda';\n\nif (car === 'Honda') {\n  console.log(`Car is a ${model}\\`);\n\
    \  const years = 2024 - 2012;\n  console.log(years);\n  const model = 'Accord';\n\
