    # 执行上下文与调用栈\n\n当我们执行 JavaScript 代码时，代码会被经过编译的。然后，它会创建一个全局执行上下文。我们可以通过这段代码看到这一点。\n\
    \n```\nconst name = 'Tom';\nconst primary = () => {\n  let x = 1;\n  const y =\
    \ secondary();\n  x = x + y;\n  return x;\n}\nfunction secondary() {\n  var z\
    \ = 2;\n  return z;\n}\n```\n\n最初，`name`、`primary` 和 `secondary` 被加载。这些是顶层代码。函数体只在被调用时才会执行，而这一切都发生在执行上下文（Execution\
    \ Context）中。\n\n# 执行上下文\n\n它被定义为执行 JavaScript 代码的环境。在这个空间内，它存储了代码执行所需的所有信息。将其想象成你\
    \ JavaScript 代码的容器。就像啤酒装在瓶里一样。\n\n# 全局执行上下文\n\n始终有一个全局执行上下文，用于存放顶层代码。这些是不在函数内的代码。它是你\
    \ JavaScript 代码的默认上下文。\n\n一旦顶层代码完成，函数和回调就会开始执行。每个函数都有一个执行上下文。对于每次函数调用，都会创建一个新的上下文。\n\
    \n# 内部\n\n执行上下文内部是变量环境（Variable Environment）。用 `var` 声明的变量在其中，函数和 `arguments`\
    \ 对象也在其中。作用域链（Scope Chain）也是一部分。它是对当前上下文外部变量的引用。`this` 关键字也是其中的。这一切都是创建阶段的一部分，该阶段发生在执行之前。\n\
    \n# 变量环境\n\n作用域链\n\nthis 关键字\n\n# 箭头函数说明\n\n箭头函数不会获取 `arguments` 对象或 `this` 关键字。它们可以使用其最近的普通函数父级中的\
    \ `arguments` 对象和 `this` 关键字。在使用箭头函数时，不要让这个细节困扰你。\n\n# 创建\n\n让我们回到之前的例子。当我们观察这段代码块时，我们需要看到三个不同的执行上下文被创建。\n\
    \n```\nconst name = 'Tom';\nconst primary = () => {\n  let x = 1;\n  const y =\
    \ secondary();\n  x = x + y;\n  return x;\n}\nfunction secondary() {\n  var z\
    \ = 2;\n  return z;\n}\n```\n\n在全局执行上下文中，有一个 `name` 变量，然后是对 `primary` 和 `secondary`\
    \ 函数的引用。此外，每个函数都获得一个执行上下文。`primary` 有一个已的 x 值，而在运行 `secondary` 函数之前，`y` 的值是未知的。\n\
    \n# 调用栈\n\n调用栈（Call Stack）和内存堆（Memory Heap）组成了 JavaScript 引擎。调用栈是执行上下文堆叠的地方。这有助于系统跟踪我们在执行中的位置。当前的执行上下文位于顶部。\n\
    \n在我们的示例代码中，它首先创建全局执行上下文。然后当调用 `primary` 函数时，它会创建它的上下文，然后该上下文将位于调用栈顶部。如你所见，`primary`\
    \ 函数调用了 `secondary`。此时，它为 `secondary` 创建了第三个上下文。调用栈顶部是 `secondary`，中间是 `primary`底部是全局。把它想象成一个巨麦当！\n\
    \n# 作用域与作用域链\n\n在 JavaScript 中理解的两个重要概念是作用域（Scope）和作用域链（Scope Chain）。我们一直在处理这两个概念，但还没有真正的解释。现在让我们解释一下它们，以便你了解它们的作用。\n\
    \n# 作用域\n\n在我们的代码中，变量并不总是可访问的。作用域是我们能够访问它们的区域。当我们无法访问它们时，我们说“它们超出了作用域”。让我们看一些代码来直观理解。\n\
    \n```\n{\n  let scopeExample = 2222;\n}\n// 这里**无法**使用 scopeExample\n```\n\n我们在括号中声明了一个变量。一旦离开括号，该变量就超出了作用域。你在循环中经常看到这一点。这是一个块作用域的例子。注意，块作用域（block\
    \ scope）是在 ES6 中添加的。块作用域变量用 `let` 和 `const` 创建。用 `var` 声明变量用于函数作用域。记住 `var` 最初就在\
    \ JavaScript 中。另外两个是后来添加的。\n\n让我们看看全局作用域是什么。\n\n```\nlet globalVar = 93; // 在全局作用域中声明\n\
    ```\n\n```\nfunction myFunction() {\n    console.log(globalVar); // 在内部访问全局变量\n\
    }\n```\n\n```\nmyFunction(); // 输出: 93\n```\n\n我们创建了全局变量，然后在函数内部引用了它。现在我们可以用函数作用域来封装它。\n\
    \n```\nvar sport = \"tennis\"; // 全局\n```\n\n```\nfunction changeSport() {\n \
    \   var sport = \"racquetball\"; // 局域\n    console.log(sport);\n}\n```\n\n```\n\
    console.log(sport);\nchangeSport();\n```\n\n```\nconsole.log(sport);\n```\n\n\
    你知道输出会是什么吗？答案在这里。\n\n![](img/ab725de6c0882bc442fb13461ecf8740_96_0.png)\n\n所以，一旦我们离开函数，变量就超出了作用域。我们从壁球回到了网球。\n\
    \n# 作用域链\n\n当我们在 JavaScript 中引用变量时，它将向上查找作用域链来寻找。例如，我们的函数作用域示例有两个 `sport` 变量。一个在函数内，一个在全局。\n\
    \n```\nlet globalVar = 10; // 全局作用域\n```\n\n```javascript\nfunction outer() {\n\
    \  let outerFuncVar = 20; // 外部函数作用域\n```\n\n```javascript\nfunction inner() {\n\
    \  let innerFuncVar = 30; // 内部函数作用域\n  console.log(globalVar); // 访问全局变量\n  console.log(outerFuncVar);\
    \ // 访问外部作用域的变量\n  console.log(innerFuncVar); // 访问局部变量\n  inner();\n}\n\nouter();\n\
    ```\n\n在这个例子中，你可以看到作用域链的使用。随着代码的执行，`console.log` 语句访问变量中的值。它打印出：\n\n![](img/ab725de6c0882bc442fb13461ecf8740_97_0.png)\n\
    \n# 词法作用域\n\nJavaScript 还有词法作用域（Lexical Scope），它指的是根据源代码中的位置来如何访问变量和函数。\n\n```javascript\n\
    const vGlobal = \"Global\";\n\nfunction outerFunc() {\n  const vOuter = \"Outer\"\
    ;\n  function innerFunc() {\n    const vInner = \"Inner\";\n    console.log(vGlobal);\n\
    \    console.log(vOuter);\n    console.log(vInner);\n  }\n  innerFunc();\n  console.log(vInner);\n\
    }\nouterFunc();\nconsole.log(vOuter);\n```\n\n在这个例子中，我们看到了词法作用域的几个不同示例。具有两个不同的函数和一个全局变量。当我们运行代码时，我们看到这个：\n\
    \n```\nReferenceError: vInner is not defined\nat outerFunc (<anonymous>:19:15)\n\
    at <anonymous>:22:1\nat mn (<anonymous>:16:5455)\n```\n\n全局变量随处可访问。外部变量在外部函数和内部函数中都是可访问的，因为它是嵌套的。内部变量只在内部函数中可访问。总结一下，内部函数可以访问在外部作用域声明的变量。反之则不然。外部函数无法访问在内部作用域声明的变量。\n\
    \n"
