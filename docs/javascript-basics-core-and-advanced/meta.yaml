    As we work with JavaScript we see similar changes. The two types we want to discuss
    are Type Conversion and Type Coercion. They have some similarities. Let''s review
    them and how they relate and differ.


    # Type Conversion


    There can be times when we need to convert a number to a string and vice versa.
    Perhaps you need to process input from the user or another system. Type conversion
    in JavaScript is a manual process.


    ```

    const inputYear = "1992";nconsole.log(Number(inputYear), inputYear); // 1992 "1992"

    console.log(String(73), 73); // 73 73

    ```'
