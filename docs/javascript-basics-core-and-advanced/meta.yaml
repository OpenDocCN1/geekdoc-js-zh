- md: "\n# Title Author\n\n# Javascript.\nBasics, Core, and Advanced\n\ntom henricksen\n\
    \n# Tom Henricksen\n\n# JAVASCRIPT.\nBasics, Core, and Advanced\n\nCopyright ©\
    \ 2024 by Tom Henricksen\n\nAll rights reserved. No part of this publication may\
    \ be reproduced, stored or transmitted in any form or by any means, electronic,\
    \ mechanical, photocopying, recording, scanning, or otherwise without written\
    \ permission from the publisher. It is illegal to copy this book, post it to a\
    \ website, or distribute it by any other means without permission.\n\nFirst edition\n\
    \nThis book was professionally typeset on Reedsyn. Find out more at reedsy.com\n\
    \n# Contents\n\nPreface\n\nI. JAVASCRIPT BASICS\n\n- 1. Starting out with JavaScript\n\
    - 2. JavaScript variables and values\n- 3. JavaScript functions\n- 4. JavaScript\
    \ Conditionals\n- 5. JavaScript loops\n- 6. JavaScript Variable Scope\n- 7. JavaScript\
    \ Closures\n\nII. CORE JAVASCRIPT\n\n# 8. JavaScript Objects\n# 9. JavaScript\
    \ Arrays\n# 10. JavaScript Type Conversion and Coercion\n# 11. JavaScript Strings\n\
    # 12. JavaScript Numbers\n# 13. JavaScript Arrow Function\n# 14. JavaScript Strict\
    \ Equality and Inequality\n# 15. JavaScript Object Notation\n# 16. JavaScript\
    \ spread and Rest operator\n\nIII. PART THREE\n\n# 17. JavaScript Promise.all()\n\
    # 18. Execution Context and Call Stack\n\n# 19. Scope and Scope Chain\n# 20. JavaScript\
    \ Hoisting and TDZ\n# 21. JavaScript Maps\n# 22. JavaScript Sets\n# 23. JavaScript\
    \ Call, Bind, and Apply\n# 24. DOM\n\nAbout the Author\n\n# Preface\n\nThe first\
    \ part focuses on JavaScript basics. Covering topics like variables, functions,\
    \ and conditionals. We also cover loops and closures too.\n\nThen in part two,\
    \ we cover the core of JavaScript. Objects, Arrays, Type Conversion, Strings,\
    \ and Numbers. Also, we review arrow functions that can be confusing syntax. The\
    \ spread and rest operators are powerful to use.\n\nThe third part gets to the\
    \ advanced topics. For instance, the execution context and call stack are important\
    \ to understand. Similarly, variable scope and the scope chain can help you know\
    \ when you can and can't use a variable.\n\nOverall, this book gives you a clear\
    \ picture of the strength of JavaScript. It has evolved quite a bit over the many\
    \ years of use. Starting quite small and growing into a more complete language.\n\
    \n# JAVASCRIPT BASICS\n\nIn part three, we start with the basics of JavaScript.\
    \ We code some fundamental aspects to help you understand how to get around.\n\
    \nI have a confession. JavaScript and I started badly. My first foray was for\
    \ form validation. I would cuss about its existence.\n\nAs luck would have, after\
    \ being reintroduced to it, I began to respect it. Over the years it has grown\
    \ into a powerful language.\n\n# JavaScript\n\nWith its humble beginnings, JavaScript\
    \ has evolved into a modern programming language. From the browser to the server\
    \ it can handle almost everything. Node.js gives it a powerful framework on the\
    \ server side.\n\nMozilla created it and here is how they define it. “JavaScript\
    \ is a lightweight interpreted programming language with first-class functions.”\
    \ That is a mouthful!\n\n# Code\n\nLet's look at some basic code. It is an HTML\
    \ file displaying some JavaScript. Save this code to your local machine.\n\n```html\n\
    ```\n\n# Test 1\n\n# Test 2\n\nRegular text\n\nWhen we run this we will see this.\n\
    \nJavaScript alert message\n\nOnce you click ok you will see this.\n\n# Test 1\n\
    \n# Test 2\n\nRegular text\n\nHTML Screen-shot\n\n# Statement\n\nThe statement\
    \ is the basic instruction for JavaScript. We can create some variables and then\
    \ assign them values.\n\n```\nlet a, b, c;      // Statement creating three variables\n\
    a = 2;                   // Statement assign the value of 2 to variable a\nb =\
    \ 3;               // Statement assign the value of 3 to b\nc = a + b;       \
    \       // Statement assign a plus b to c\n```\n\nThe semicolon is at the end\
    \ of the statement. However, we could put multiple statements together.\n\n```\n\
    a = 2; b = 3;\n```\n\nThis isn't as readable as most programmers prefer not to.\
    \ So just because you can do something doesn't mean you should.\n\n# Functions\n\
    \nWhen we want to perform a task we can create a function. If we need to sum two\
    \ numbers we could do this in code or create a function.\n\n```javascript\n//\
    \ Add two numbers\nnum3 = num1 + num2;\n```\n\n```javascript\n// Function to sum\
    \ two numbers\nfunction sumTwoNumbers(num1, num2) {\n  return num1 + num2;\n}\n\
    ```\n\nIn this example, we perform the same code one in a function and one not.\
    \ Using a function has value. We can call it repeatedly. Also, we could easily\
    \ add some error checking too.\n\n```javascript\n// Function to sum two numbers\n\
    function sumTwoNumbers(num1, num2) {\n  return num1 + num2;\n}\n\nlet sum = sumTwoNumbers(6,4);\n\
    ```\n\nWe can do it like this example if you want to call the function. Here we\
    \ pass in two numbers. These numbers could be replaced with variables as well.\n\
    \nIn closing, we have touched on why we would use JavaScript. Then we started\
    \ to code. Using statements and functions we began to see what is under the hood.\
    \ Try it out for yourself!\nYou won't regret it.\n\n# JAVASCRIPT VARIABLES AND\
    \ VALUES\n\nSome people find differences easily. Their eye can see the one thing\
    \ out of place. Others look for commonalities.\n\nI find myself in the latter\
    \ camp. Especially, as I look at programming languages. JavaScript is quite similar\
    \ to other languages. Let's focus on values and variables.\n\n# Values\n\nThe\
    \ data we keep track of is our value. That could be some words or numbers. Perhaps\
    \ even some special characters for the computer to process.\n\n# Variables\n\n\
    We give the data a name or a handle if you will. This allows us to reference it\
    \ elsewhere.\n\n```javascript\nlet tomsJavaScriptVariable = \"stuff\";\n```\n\n\
    This code example has a value, \"stuff\", and a variable name, A lot happened\
    \ here so let me explain it.\n\n# Declare\n\nFirst thing we must declare a variable.\
    \ This can be done by the following.\n\n```javascript\nlet declareVariable; //\
    \ just declaring\n```\n\nThe let keyword followed by the name declares the variable.\
    \ Note our previous example set the value. This one does not.\n\n# Initialize\n\
    \nWhen we give it a value we are initializing the variable. So we can use our\
    \ declareVariable here and initialize it too.\n\n```javascript\ndeclareVariable\
    \ = 123; // initialize variable\n```\n\nAs you look through the examples you see\
    \ that your first example did all this at once. So you can declare and initialize\
    \ on separate lines or all at once. This can be personal preference. It can aid\
    \ in the readability of separating them.\n\n# Naming\n\nAs you name your variables\
    \ you have a few rules to learn in JavaScript. The length can be as short as one\
    \ character. There is no upper limit. The first character is limited to letters,\
    \ underscore(_), and dollar sign($). Numbers are not allowed for the first character.\n\
    \n```javascript\nlet a; // letter\nareallylongnameforvariablethatwontwantoread;\
    \ // long but legal\nlet _var; // underscore first\nlet $sal; // dollar sign first\n\
    let 4num; // illegal - won't work!\n```\n\nThe other characters in the name can\
    \ be letters, numbers, and characters. Also, the case can be mixed too.\n\n```javascript\n\
    let aMixtureOfUpperAndLowerCase;\nlet a123$;\nlet _jsfgsiu23432;\n```\n\nJavaScript\
    \ gives you a lot of options to name your variables. Your fellow developers would\
    \ appreciate meaningful names. I like to make wisecracks, but your code is not\
    \ a good place to try this.\n\n# Const\n\nIf you have a variable you don't want\
    \ to change you can use the const keyword to declare it. This is in place of the\
    \ let keyword.\n\n```javascript\nconst pi = 3.14; // not able to change\nlet exchangeRate\
    \ = 3.4; // able to change\n```\n\nJust make sure you think this through. Use\
    \ the const keyword wisely. If you get crazy with it you will have issues.\n\n\
    # let vs var\n\nVariables can be declared with the var keyword too. Using the\
    \ var keyword declares the variable in the whole function. While let is only for\
    \ the block it is defined.\n\n```javascript\nfunction varScoping() {\n  var x\
    \ = 1;\n```\n\n```javascript\nif (true) {\n  var x = 2;\n}\n```\n"
  mdcn: "\n\n# 标题 作者\n\n# Javascript.\n基础、核心与进阶\n\ntom henricksen\n\n# Tom Henricksen\n\
    \n# JAVASCRIPT.\n基础、核心与进阶\n\n版权 © 2024 Tom Henricksen\n\n保留所有权利。未经出版者面许可，不得以任何形式或通过任何手段（电子、机械、复印、录音、扫描或其他）对本书的任何部分进行复制、存储或传输。未经许可复制本书、将其发布到网站或通过任何其他方式分发都是非法的。\n\
    \n第一版\n\n本书在 Reedsyn 上经过了专业排版。访问 reedsy.com 了解更多信息。\n\n# 目录\n\n序言\n\nI. JavaScript\
    \ 基础\n\n- 1. 开始 JavaScript\n- 2. JavaScript 变量与值\n- 3. JavaScript 函数\n- 4. JavaScript\
    \ 条件语句\n- 5. JavaScript 循环\n- 6. JavaScript 变量作用域\n- 7. JavaScript 闭包\n\nII. JavaScript\
    \ JavaScript\n\n# 8. JavaScript 对象\n# 9. JavaScript 数组\n# 10. JavaScript 类型转换与强制转换\n\
    # 11. JavaScript 字符串\n# 12. JavaScript 数字\n# 13. JavaScript 箭头函数\n# 14. JavaScript\
    \ 严格相等与不等\n# 15. JavaScript 对象表示法 (JSON)\n# 16. JavaScript 展开运算符与剩余运算符\n\nIII.\
    \ 第三部分\n\n# 17. JavaScript Promise.all()\n# 18. 执行上下文与调用栈\n\n# 19. 作用域与作用域链\n\
    # 20. JavaScript 提升与 TDZ（暂时死区）\n# 21. JavaScript Maps\n# 22. JavaScript Sets\n\
    # 23. JavaScript Call, Bind 和 Apply\n# 24. DOM\n\n关于作者\n\n# 序言\n\n第一部分专注于 JavaScript\
    \ 基础。涵盖了变量、函数和条件语句等主题。我们还涵盖了循环和闭包。\n\n在第二部分中，我们涵盖了 JavaScript 的核心。对象、数组、类型转换、字符串和数字。我们还回顾了可能会引起困惑的箭头函数。展开和剩余运算符非常强大。\n\
    \n第三部分进入了高级主题。例如，理解执行上下文和调用栈是关重要的。同样，变量作用域和作用域链可以帮助你了解何时可以使用何时不能使用变量。\n\n总体来说，这本书让你对\
    \ JavaScript 的优势有一个清晰的认识。在多年的使用过程中，它已经进化很大。从很小开始成长为更完整的语言。\n\n# JavaScript 基础\n\
    \n在第三部分，我们从 JavaScript 的基础开始。我们编写了一些基础代码来帮助你理解如何操作。\n\n我有一个坦白。JavaScript 和我的开始并不愉快。我的第一次尝试是为了表单验证。我曾咒它的存在。\n\
    \n幸运的是，在重新接触之后，我开始尊重它。多年来，它已经成长了一种强大的语言。\n\n# JavaScript\n\n尽管起点低微，JavaScript\
    \ 已演变为一种现代编程语言。从浏览器到服务器，它几乎可以处理一切。Node.js 在服务器端为它提供了一个强大的框架。\n\n它由 Mozilla 创建，以下是他们的定义：“JavaScript\
    \ 是一种轻量级的解释型编程语言，具有一等函数。”这听起来真绕口！\n\n# 代码\n\n让我们看一些基础代码。这是一个显示 JavaScript 的 HTML\
    \ 文件。将此代码保存到你的本地机器。\n\n```html\n```\n\n# 测试 1\n\n# 测试 2\n\n普通文本\n\n当我们运行它时，我们将看到这个。\n\
    \nJavaScript 弹出消息\n\n一旦你点击确定，你就会看到这个。\n\n# 测试 1\n\n# 测试 2\n\n普通文本\n\nHTML 截图\n\
    \n# 语句\n\n语句是 JavaScript 的基础指令。我们可以创建一些变量并给它们赋值。\n\n```\nlet a, b, c;      //\
    \ 创建创建三个变量的语句\na = 2;                   // 语句将 2 赋值给变量 a\nb = 3;             \
    \  // 语句将 3 赋值给 b\nc = a + b;              // 语句将 a 加 b 赋值给 c\n```\n\n分号位于语句末尾。然而，我们可以将多个语句组合在一起。\n\
    \n```\na = 2; b = 3;\n```\n\n这并不符合大多数程序员喜欢的易读性。所以，仅仅因为你可以做某事，并不意味着你应该这样做。\n\n\
    # 函数\n\n当我们想要执行某个任务时，可以创建一个函数。如果我们需要两个数字之和，我们可以在代码中这样做，也可以创建一个函数。\n\n```javascript\n\
    // 加两个数字\nnum3 = num1 + num2;\n```\n\n```javascript\n// 两个数字之和的函数\nfunction sumTwoNumbers(num1,\
    \ num2) {\n  return num1 + num2;\n}\n```\n\n在这个例子中，我们执行相同的代码，一个在函数内，一个不在。使用函数是有值的。我们可以重复调用它。此外，我们还可以轻松添加一些错误检查。\n\
    \n```javascript\n// 两个数字之和的函数\nfunction sumTwoNumbers(num1, num2) {\n  return\
    \ num1 + num2;\n}\n\nlet sum = sumTwoNumbers(6,4);\n```\n\n如果你想调用函数，可以像这个例子这样做。在这里我们传入两个数字。这些数字也可以被替换为变量。\n\
    \n最后，我们接触了为什么要使用 JavaScript。然后我们开始编写代码。通过语句和函数，我们开始看到内部运行了什么。亲自尝试一下吧！\n你不会后悔的。\n\
    \n# JavaScript 变量与值\n\n有些人很容易发现差异。他们的眼睛能看到某一个不协调的地方。而其他人则寻找共同点。\n\n我发现自己属于后阵营。尤其是当我观察编程语言时。JavaScript\
    \ 与其他语言非常相似。让我们关注值和变量。\n\n# 值\n\n我们记录的数据就是我们的值。它可以是一些单词或数字。也许甚至是计算机处理的一些特殊字符。\n\
    \n# 变量\n\n我们给数据起一个名字，或者说你说的一个句柄。这允许我们在其他地方引用它。\n\n```javascript\nlet tomsJavaScriptVariable\
    \ = \"stuff\";\n```\n\n这个代码示例有一个值 \"stuff\" 和一个变量名。这里发生了很多事情，让我解释一下。\n\n# 声明\n\
    \n首先我们必须声明变量。可以通过以下方式实现。\n\n```javascript\nlet declareVariable; // 声明\n```\n\n\
    let 关键字后面跟着名称声明了变量。注意我们之前的例子设置了值。这个没有。\n\n# 初始化\n\n当我们给它一个值时，我们正在初始化变量。所以我们在这里初始化它。\n\
    \n```javascript\ndeclareVariable = 123; // 初始化变量\n```\n\n当你查看这些示例时，你会看到你的例子一次性完成了。所以你可以分开声明和初始化。这取决于个人偏好。这有助于代码的可读性。\n\
    \n# 命名\n\n当你命名变量时，在 JavaScript 中需要学习一些规则。长度可以短到只有一个字符。没有上限。第一个字符限制为字母、下划线(_) 和美元符号($)。数字不允许作为第一个字符。\n\
    \n```javascript\nlet a; // 字母\nareallylongnameforvariablethatwontwantoread; //\
    \ 长但合法\nlet _var; // 下划线开头\nlet $sal; // 美元开头\nlet 4num; // 非法——无效！\n```\n\n名称中的其他字符可以是字母、数字和字符。同样，大小写也可以混合。\n\
    \n```javascript\nlet aMixtureOfUpperAndLowerCase;\nlet a123$;\nlet _jsfgsiu23432;\n\
    ```\n\nJavaScript 提供了许多命名选项。你的同事会感谢。我喜欢开玩笑，但你的代码不是尝试这样做的好地方。\n\n# const\n\n如果你有一个不想更改的变量，可以使用\
    \ const 关键字来声明它。这是替代 let 关键字的。\n\n```javascript\nconst pi = 3.14; // 不能更改\nlet\
    \ exchangeRate = 3.4; // 可以更改\n```\n\n只需确保你想清楚这一切。明智地使用 const 关键字。如果你疯狂使用它，就会有问题。\n\
    \n# let vs var\n\n变量也可以用 var 关键字声明。使用 var 关键字会在整个函数范围内声明变量。而 let 仅在它定义的块中有效。\n\
    \n```javascript\nfunction varScoping() {\n  var x = 1;\n```\n\n```javascript\n\
    if (true) {\n  var x = 2;\n}\n```\n\n"
