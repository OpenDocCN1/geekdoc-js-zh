    \ = 0;\nconst zeroObj = new String(\"0\");\nconst zeroStr = \"0\";\n```\n\n```javascript\n\
    console.log(zero === zeroObj); // false\nconsole.log(zero == zeroObj); // true\n\
    ```\n\n```javascript\nconsole.log(zero === zeroStr); // false\nconsole.log(zero\
    \ == zeroStr); // true\n```\n\n```javascript\nconsole.log(zeroObj === zeroStr);\
    \ // false\nconsole.log(zeroObj == zeroStr); // true\n```\n\nWe have zero as a\
    \ number, a string, and an object. You can see the big differences between the\
    \ two types of equality. For this reason, many developers suggest not to use loose\
