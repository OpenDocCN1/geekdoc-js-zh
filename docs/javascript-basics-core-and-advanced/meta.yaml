    \ `false`，循环就会停止。\n\n## do-while\n\n`for` 和 `while` 循环先检查条件再运行代码语句。`do-while`\
    \ 的不同之处在于它先运行代码然后再检查你的条件。它不常见，但在特殊情况下非常有用。\n\n```javascript\nlet donutsEaten =\
