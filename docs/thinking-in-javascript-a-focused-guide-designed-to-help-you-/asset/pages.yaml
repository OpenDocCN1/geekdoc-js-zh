  md: "20\n\nUsing the ID\n\nLet's have a look at the following code snippet to see\
    \ how we access the elements by their IDs:\n\n$(document).ready(function()\n\n\
    \ {\n\n var x = $(\"#packt\");\n\n });\n\nFor an element with an ID packt, we\
    \ can refer to it using the # operator similar to the way \n\nit is done in CSS.\
    \ We need to remember that the ID has to be preceded by a # and should \n\nbe\
    \ enclosed in double quotes.\n\nUsing the class\n\nLet's have a look at the following\
    \ code snippet to see how we access the elements by \n\ntheir class:\n\n$(document).ready(function()\n\
    \n {\n\n var y = $(\".pubman\");\n\n });\n\nFor an element defined with a class\
    \ pubman, we can refer it using the dot (.) operator. \n\nThe class has to be\
    \ preceded by a dot (.) operator similar to the way it is done in CSS. \n\nHowever,\
    \ the class has to be enclosed in double quotes.\n\nUsing the tag\n\nLet's have\
    \ a look at the following code snippet to see how we access the elements by their\
    \ \n\ntag name:\n\n$(document).ready(function)\n\n {\n\n var links = $(\"a\");\n\
    \n });\n\nThe elements can be accessed by their tag name in jQuery by referring\
    \ to the tag enclosed in \n\ndouble quotes.\n\nAnonymous functions\n\nLet's have\
    \ a look at the way we use anonymous functions in jQuery.\n\nThe following code\
    \ will give us an idea about its functionality:\n\n$(document).ready(function()\n\
    \n {"
