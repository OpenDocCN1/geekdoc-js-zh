  md: "Overview\n\nInstead of wandering through loads of theory, we have used practical\
    \ examples in this \n\nbook. The examples in this book are compatible with almost\
    \ every browser. Instead of \n\nusing the verbatim code, you can modify the code\
    \ and see the change in the output \n\nthereby understanding the subtle nuances\
    \ of JavaScript.\n\nBy the end of the book, with practice, you can achieve better\
    \ things and get more \n\nacquainted with JavaScript."
