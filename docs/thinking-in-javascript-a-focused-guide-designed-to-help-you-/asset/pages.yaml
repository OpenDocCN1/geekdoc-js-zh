  md: "21\n\n $('#packt').click(function()\n\n {\n\n $('div').remove();\n\n });\n\n\
    \ });\n\nLet's understand the meaning of the code.\n\nThe document ready feature\
    \ has already been explained. Then we query the DOM for the \n\nelement with the\
    \ ID packt and we assign a click event to it. Inside the function, we have \n\n\
    included the remove method, which will remove all <div> elements.\n\nFor the various\
    \ methods used in jQuery, we can have a look at books such \n\nas *jQuery for\
    \ Designers: Beginner's Guide*, which are on the Packt website \n\nat www.packtpub.com.\
    \ Alternatively, we can refer to the Packt online \n\nlibrary at http://packtlib.packtpub.com/.\n\
    \njQuery is widely used for animation. We will now have a look at the following\
    \ code where we \n\nhide and show elements on the web page:\n\n<html>\n\n<head>\n\
    \n<title>jQuery Animation</title>\n\n<script src=\"http://ajax.aspnetcdn.com/ajax/jquery/jquery-1.9.0.js\"\
    > \n\n</script>\n\n<script type=\"text/javascript\">\n\n $(document).ready(function()\
    \ {\n\n $(\"#packt\").click(function () {\n\n $(\".pubman\").show( 2000);\n\n\
    \ });\n\n $(\"#packtpub\").click(function () {\n\n $(\".pubman\").hide( 3500 );\n\
    \n });\n\n });\n\n</script>\n\n<style>\n\n.pubman{ margin:5px;padding:7px;\n\n\
    \ border:3px dashed navy;\n\n color:lime;"
  merge: -1
