    \n因此，在 jQuery 中包含文档准备就绪功能是一个良好的习惯。我们必须使用以下语法来实现文档准备就绪功能：\n\n$(document).ready(function()\n\
    \n如果我们观察代码片段，该函数是在文档准备就绪以实现 jQuery 后必须执行的回调函数。我们还可以看到一个 $ 符号。$ 符号是 jQuery() 函数的同义词。在标签名、标签\
    \ ID 或类名之前不需要写 jQuery，而是使用 $。它简化了代码并表明这是一个 jQuery 代码片段。使用适当的语法使代码更整洁、更短；这在页面加载时至关重要。\n\
    \n## 使用 jQuery 访问 DOM 元素\n\n与 CSS 类似，我们可以使用 jQuery 访问文档对象模型（DOM）中的元素。在 JavaScript\
    \ 中，我们使用 `getElementByID` 函数通过 ID 访问 DOM 中的元素。然而，在 jQuery 中可以用更短的代码实现这一点。\n\n\
