    \ <body> tag. This ensures that the web page and its resources have \n\nbeen loaded\
    \ completely before JavaScript comes into the picture. Another reason is that\
    \ any \n\nresource, except for a JavaScript file, loads asynchronously. However,\
    \ when a JavaScript file is \n\nbeing loaded, it happens one at a time. This hampers\
    \ the performance."
  - "[PAGE 9]\n\n3\n\nWe must understand that if there is a lot of code to be written,\
    \ it is always systematic to \n\nkeep the JavaScript code separate from the HTML\
    \ code. In this book, we will embed \n\nJavaScript in the HTML between the <script>\
    \ tags for the sake of convenience. However, \n\nin real-world situations, it\
    \ is good practice to keep the JavaScript code as a standalone. For \n\nthat,\
    \ we need to create a standalone JavaScript file and save it with a .js extension.\
    \ The \n\nJavaScript code must be written in this separate .js file. Suppose we\
    \ create a JavaScript file \n\ncalled main.js. We then invoke the main.js file\
    \ in our HTML code. Let's have a look at a \n\ncode example to view the procedure:\n\
    \n<!DOCTYPE html>\n\n<html>\n\n<head>\n\n<title> Introduction to JavaScript </title>\n\
    \n**<script type=\"text/javascript\" src=\"main.js\"></script>**\n\n</head>\n\n\
    </html>\n\nIn the .js file, we need to write the following code snippet:\n\nalert(\"\
    \ Welcome to Packt \");\n\nWhen we execute the code, we will get the same output\
    \ as shown in the earlier example. As \n\nwe can see, we have invoked the main.js\
    \ file by using the following code in our HTML file:\n\n<script type=\"text/javascript\"\
    \ src=\"main.js\"></script>\n\nHere, the main.js file should be on the same path\
    \ as the HTML file. If it is in a different \n\nfolder, we need to specify the\
    \ entire path.\n\nThereby, we have seen the procedure to applying JavaScript in\
    \ our code.\n\nVariables\n\nIn JavaScript, we need containers that will store\
    \ data and values for processing purposes. \n\nHence, we use variables in JavaScript.\
    \ We can assign a numeric or a string value to a variable. \n\nA string needs\
    \ to be enclosed in quotes. We also have the concept of constants. A constant\
    \ \n\nis assigned a value that is permanent in the script, unlike variables where\
    \ the values can \n\nbe changed.\n\nLet's have a look at the way we declare variables\
    \ and constants in JavaScript:\n\nvar amount;\n\nvar amount=5;\n\nconst a;"
  - "[PAGE 10]\n\n4\n\nIt is quite evident that the variable should be preceded by\
    \ the var keyword whereas constants \n\nmust be preceded by the const keyword.\
    \ We can also see that the value can be assigned \n\nto a variable at the time\
    \ of declaring it.\n\nconst is compatible with modern versions of all browsers\
    \ except \n\nInternet Explorer.\n\nA variable can be either local or global. Let's\
    \ look at how we differentiate between local \n\nand global variables.\n\nRemember\
    \ that JavaScript is case-sensitive. Hence \"myAttribute\" is \n\n*not* the same\
    \ as \"myattribute\". One more point to note is that every \n\nstatement ends\
    \ with a semicolon. Spaces inside the quotes will be \n\nreflected in the output.\n\
    \nGlobal and local variables\n\nGlobal variables can be accessed from any location\
    \ in the script, whereas local variables can \n\nbe accessed only within the function.\n\
    \nLet's have a look at the following code to understand it better:\n\n<!DOCTYPE\
    \ html>\n\n<html>\n\n<head>\n\n<title> Introduction to JavaScript </title>\n\n\
    </head>\n\n<body>\n\n<h1> Variables in JavaScript </h1>\n\n<script type=\"text/javascript\"\
    >\n\n function subtraction(a, b)\n\n {\n\n var c;\n\n c = a-b;\n\n return c;\n\
    \n }\n\n var z = subtraction(10, 7);\n\n document.write(\"After subtraction, the\
    \ difference is \" + z);\n\n</script>\n\n</body>\n\n</html>"
- md: "\n5\n\nIn the code, a as well as b have been passed as arguments to the function.\
    \ a and b are local\n\nvariables that can be accessed only within the function,\
    \ as they exist in the function. However,\n\nz is declared outside the function\
    \ and hence is a global variable.\n\nWe can see the output of the executed code\
    \ in the following screenshot:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_11_0.png)\n\
    \nFunctions will be explained under the heading *Functions* in this book, so let's\
    \ stick to variables\nas of now.\n\nTo understand the scope and concept of variables\
    \ better, let's have a look at the\nfollowing code:\n\n<html>\n\n<head>\n\n<title>\
    \ Scope of variables </title>\n</head>\n\n<body>\n\n<script type=\"text/javascript\"\
    >\n\n var a = \"Packt publishes Books on Technology\";\n\n var b = \"Welcome to\
    \ Packt\";\n\n function Packt()\n\n {\n\n var a = \"Packt Publishing has an online\
    \ book library\";\n\n alert(a);\n\n alert(b);\n\n } \n\n Packt();\n\n alert(a);\n\
    \n</script>\n\n</body>\n\n</html>\n\nOn execution, we see three alerts in the\
    \ following order :\n\nPackt Publishing has an online book library\n\nWelcome\
    \ to Packt\n\nPackt publishes Books on Technology\n\n6\n\nFrom the output, it\
    \ is quite evident that the function can access the local variable (hence the\n\
    first alert) as well as the global variable (hence the second alert). However,\
    \ anything outside a\nspecific function cannot access the variables inside that\
    \ function (hence the third alert). That\nclears the concept of global and local\
    \ variables.\n\n## Operators\n\nThe three types of commonly used operators in\
    \ JavaScript are as follows:\n\n- Arithmetic operators\n- Logical operators\n\
    - Comparison operators\n\n### Arithmetic operators\n\nThe following table displays\
    \ the various kinds of Arithmetic operators:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_12_0.png)\n\
    \nThe operators mentioned in the table are used for Arithmetic operations.\n\n\
    The Addition, Subtraction, Multiplication, and Division operators are self explanatory.\n\
    The Modular operator (%) is used for the remnant left after division (we call\
    \ this the modulus). Increment operators are used to increase the value by one\
    \ whereas the\ndecrement operator is used to decrease the value by one.\n\nFor\
    \ example, x=x+1 can also be written as x++ whereas y=y-1 can be written as y--.\n\
    \n7\n\nLogical operators\n\nThe following table displays the different types of\
    \ logical operators:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_13_0.png)\n\n\
    The AND operator is used when all the conditions must be satisfied. For example,\
    \ X>5 &&\ny=5 means that x should be greater than 5 and y must be equal to 5 for\
    \ the condition to\nbe true.\n\nThe OR operator is used when one of the conditions\
    \ must be true. For example, x=5 || y<3\nmeans that the condition is true when\
    \ x is equal to 5 or y is less than 3.\n\nThe NOT operator is used when the antithesis\
    \ is true. For example, !(x>5) is true when x\nis equal to or less than 5.\n\n\
    ## Conditions and Loops\n\nThe main purpose of JavaScript is to add dynamic functionality.\
    \ In order to execute a lot of\nactions and iterations, we have the concept of\
    \ conditions and loops in JavaScript. The\nif-else statement is primarily used\
    \ for various conditions. The structure of the If-else\nstatement is as follows:\n\
    \nif (condition)\n {\n JavaScript statements to be executed\n }\nelse\n {\n JavaScript\
    \ statements to be executed\n }\n\nFor example, consider the following code snippet:\n\
    \nIf (i>5)\n {\n x=50;\n }\nelse\n {\n x=100;\n }\n\n8\n\nThe interpretation of\
    \ this code is simple. If the value of i is greater than 5, the value of x will\n\
    be 50. If the value of i is not greater than 5, then the value of x will be 100.\n\
    \nAt times, we know the number of iterations to be performed. Suppose we need\
    \ to execute the\ncode and get the output, say 10 times. At that time, we use\
    \ loops to perform multiple\niterations as we know the number of times the loop\
    \ will be repeated. We will see an example\nof the for loop in this chapter.\n\
    \nThe structure of the for loop is as follows:\n\nfor (initialization;condition;increment)\n\
    \ {\n JavaScript statements\n }\n\nLet us have a look at a code snippet:\n\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<script type=\"text/javascript\">\n\n for (i=0;i<5;i++)\n\
    \ {\n document.write(i+ \"<br>\");\n }\n</script>\n<p>Hi</p>\n<p>This is an example\
    \ of the execution of the for loop</p>\n</body>\n</html>\n\nThe output of the\
    \ code on execution would be as follows:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_14_0.png)\n\
    \n9\n\n## Functions\n\nFunctions are an integral part of JavaScript. Let's understand\
    \ the concept of functions. We know\nthat the imperative purpose of JavaScript\
    \ is to add functionality to the web page. Say, we want\nto add certain functionality\
    \ in JavaScript. Suppose we need to implement it on different pages of\nthe website\
    \ or different places on the same web page. Instead of adding functionality each\
    \ time,\nwe can use the concept of functions where we can declare the function\
    \ once. From there on, we\ncan use it multiple times on multiple web pages or\
    \ at different places on the website.\n\nThere are many inbuilt functions in JavaScript.\
    \ We can also craft our own functions in\nJavaScript and customize them according\
    \ to our needs. Let's look at the following code\nto understand how the functions\
    \ work:\n\n<!DOCTYPE html>\n<html>\n<head>\n<title> Java Script in a nutshell\
    \ </title>\n<<h1> Functions in JavaScript </h1>\n<p> Click on \"Click Here\" to\
    \ execute the code in the function </p>\n<script type=\"text/javascript\">\n\n\
    \ function PacktPub()\n {\n var x = prompt(\"Hey\", \"\");\n alert(\"Welcome to\
    \ Packt, \" + x);\n }\n</script>\n</head>\n<body>\n\n<a href=\"javascript:PacktPub()\"\
    >Click Here</a>\n</body>\n</html>\n\nThe execution of the code will give us the\
    \ following output:\n\n![](img/e22f9ec0935e89c75d7b9cd0b6f17410a_15_0.png)\n\n\
    10\n\nOn clicking the Click Here link, we can see the following output:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_16_0.png)\n\
    \nWe get a prompt box that requests for an input. Say we enter the name Joe and\
    \ click on OK.\nWe will get the following alert box as defined in the code.\n\n\
    ![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_16_1.png)\n\nLet's now understand how\
    \ the code works. We have used two functions in the code:\nalert and prompt are\
    \ inbuilt functions in JavaScript. JavaScript is case-sensitive; hence, we must\
    \ use lowercase for\nalert and prompt, otherwise the code will not work.\n\n11\n\
    \nThe alert and prompt functions are commonly used in JavaScript. An alert box\
    \ is used\nwhen we need to inform the user about some development. Similarly,\
    \ a prompt box is used\nwhen we want an input from the user before he accesses\
    \ the page. If you observe the code, it is quite evident that the PacktPub() function\
    \ was declared prior to calling it. In the PacktPub() function, we have used the\
    \ prompt and alert functions.\nThe prompt command on execution will prompt the\
    \ user for an input. The double quotes\nafter Hey are for the default string that\
    \ has to be entered as the input. In the code, x is\na variable that is assigned\
    \ a prompt function. Again, x is used in the alert command in the\nvery next line.\n\
    \nOnce we enter the name Joe, we get an alert: Welcome to Packt, Joe.\n\nThe concept\
    \ of functions must be clear by now. Functions are used extensively in JavaScript\n\
    and are widely used to return a value in real-world programming. Hence, functions\
    \ are an\nimperative part of JavaScript.\n\n## Objects and their role in JavaScript\n\
    \nJavaScript is an object-oriented language. We have inbuilt objects such as Math,\
    \ Date, and\nDocument, to mention a few. However, we can also create our own objects\
    \ and customize\nthem to suit our needs.\n\nAn object has properties and methods\
    \ to define it. These are attributes that give meaning\nto the object-oriented\
    \ concept in JavaScript. A property is an attribute that defines values for\n\
    the object. Methods define the action that can be implemented on the objects.\n\
    \nLet's have a look at the following code to understand how properties define\
    \ values for\nan object:\n\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\n var\
    \ animal=new Object();\n\n animal.species=\"Dog\";\n\n animal.nickname=\"Monster\"\
    ;\n\n animal.age=10;\n\n animal.eyecolor=\"brown\"; \n\n document.write(animal.nickname\
    \ + \" is a dog that has \" +\nanimal.eyecolor + \" eyes\");\n\n</script>\n</body>\n\
    </html>\n"
  mdcn: "\n5\n\n在代码中，a 和 b 都已作为参数传递给函数。a 和 b 是局部变量，只能在函数内部访问，因为它们存在于函数之中。然而，z 是在函数外部声明的，因此是一个全局变量。\n\
    \n我们可以在下面的截图中看到执行代码的输出：\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_11_0.png)\n\
    \n函数将在本书的 *Functions*（函数）章节下进行介绍，所以我们目前先关注变量。\n\n为了更好地理解变量的作用域和概念，让我们来看下面的代码：\n\
    \n<html>\n\n<head>\n\n<title> 变量的作用域 </title>\n</head>\n\n<body>\n\n<script type=\"\
    text/javascript\">\n\n var a = \"Packt des Books on Technology\";\n\n var b =\
    \ \"Welcome to Packt\";\n\n function Packt()\n\n {\n\n var a = \"Packt Publishing\
    \ has an online book library\";\n\n alert(a);\n\n alert(b);\n\n } \n\n Packt();\n\
    \n alert(a);\n\n</script>\n\n</body>\n</html>\n\n执行时，我们按照以下顺序看到三个 alert：\n\nPackt\
    \ Publishing has an online book library\n\nWelcome to Packt\n\nPackt publishes\
    \ Books on Technology\n\n6\n\n从输出中显而易见，函数可以访问局部变量（因此是第一个 alert）以及全局变量（因此是第二个 alert）。然而，特定函数外部的任何内容无法访问该函数内部的变量（因此是第三个\
    \ alert）。这解释了全局变量和局部变量的概念。\n\n## 运算符\n\nJavaScript 中常用的三种运算符如下：\n\n- 算术运算符\n-\
    \ 逻辑运算符\n- 比较运算符\n\n### 算术运算符\n\n下表显示了各种算术运算符：\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_12_0.png)\n\
    \n表中提到的运算符用于算术运算。\n\n加、减、乘、除运算符是自言自懂的。取模运算符 (%) 用于除法后留下的余数（我们称之为模）。自增运算符用于将值加一，而自减运算符用于将值减一。\n\
    \n例如，x=x+1 也可以写成 x++，而 y=y-1 可以写成 y--。\n\n7\n\n逻辑运算符\n\n下表显示了不同类型的逻辑运算符：\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_13_0.png)\n\
    \nAND（与）运算符用于所有条件都必须满足的情况。例如，X>5 && y=5 意味着 x 必须大于 5 且 y 必须等于 5，条件才成立。\n\nOR（或）运算符用于其中一个条件为真的情况。例如，x=5\
    \ || y<3 意味着 x 等于 5 或 y 小于 3 时条件为真。\n\nNOT（非）运算符用于反面为真的情况。例如，!(x>5) 在 x 等于或小于\
    \ 5 时为真。\n\n## 条件与循环\n\nJavaScript 的主要目的是添加动态功能。为了执行大量的操作和迭代，我们在 JavaScript 中有了条件和循环的概念。if-else\
    \ 语句主要用于各种条件。if-else 语句的结构如下：\n\nif (condition)\n {\n 要执行的 JavaScript 语句\n }\n\
    else\n {\n 要执行的 JavaScript 语句\n }\n\n例如，考虑以下代码片段：\n\nIf (i>5)\n {\n x=50;\n }\n\
    else\n {\n x=100;\n }\n\n8\n\n这段代码的解释非常简单。如果 i 的值大于 5，则 x 的值将是 50。如果 i 的值大于 5，那么\
    \ x 的值将是 100。\n\n有时，我们知道需要执行的迭代次数。假设我们需要执行代码并获取输出，比如 10 次。这时，我们使用循环来执行多次迭代，因为我们知道循环重复的次数。我们将在本章查看\
    \ for 循环的示例。\n\nfor 循环的结构如下：\n\nfor (initialization;condition;increment)\n {\n\
    \ JavaScript 语句\n }\n\n让我们来看代码片段：\n\n<!DOCTYPE html>\n<html>\n<body>\n<script\
    \ type=\"text/javascript\">\n\n for (i=0;i<5;i++)\n {\n document.write(i+ \"<br>\"\
    );\n }\n</script>\n<p>Hi</p>\n<p>这是一个 for 循环执行的示例</p>\n</body>\n</html>\n\n代码执行后的输出将如下：\n\
    \n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_14_0.png)\n\n9\n\n## 函数\n\n函数是 JavaScript\
    \ 的不可或缺的一部分。让我们理解函数的概念。我们知道 JavaScript 的命令性目的是为网页添加功能。假设我们想在 JavaScript 中添加某些功能。假设我们需要在网站的不同页面或同一网页的不同位置实现它。与其每次都添加一次功能，不如使用函数的概念，我们可以只声明一次函数。从那时起，我们可以在多个网页上或在网站的不同位置多次使用它。\n\
    \nJavaScript 中有很多内置函数。我们也可以在 JavaScript 中编写自己的函数并根据需要进行自定义。让我们来看下面的代码以理解函数是如何工作的：\n\
    \n<!DOCTYPE html>\n<html>\n<head>\n<title> 简述 JavaScript </title>\n<h1> JavaScript\
    \ 中的函数 </h1>\n<p> 点击“Click Here”执行函数中的代码 </p>\n<script type=\"text/javascript\"\
    >\n\n function PacktPub()\n {\n var x = prompt(\"Hey\", \"\");\n alert(\"Welcome\
    \ to Packt, \" + x);\n }\n</script>\n</head>\n<body>\n\n<a href=\"javascript:PacktPub()\"\
    >Click Here</a>\n</body>\n</html>\n\n代码的执行将给我们带来以下输出：\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_15_0.png)\n\
    \n10\n\n点击 Click Here 链接后，我们看到以下输出：\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_16_0.png)\n\
    \n我们得到一个请求输入的提示框。假设我们输入名字 Joe 并点击 OK。我们将得到代码中定义的以下 alert 框：\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_16_1.png)\n\
    \n11\n\n这两个函数在 JavaScript 中常用。当我们需要向用户告知某些进展时，使用 alert 框。同样，当我们在用户访问页面之前想要输入时，使用\
    \ prompt 框。观察代码可以显而易见，PacktPub() 函数在调用之前已经声明。在 PacktPub() 函数中，我们使用了 prompt 和 alert\
    \ 函数。执行 prompt 命令将提示用户输入。Hey 后面的双引号是作为输入的默认字符串。在代码中，x 是赋值给 prompt 函数的变量。再次，x 在紧接的一行的\
    \ alert 命令中使用。\n\n一旦输入名字 Joe，我们就得到 alert：Welcome to Packt, Joe。\n\n现在应该理解函数的概念。函数在\
    \ JavaScript 中被广泛使用，并在实际编程中广泛用于返回值。因此，函数是 JavaScript 的重要部分。\n\n## 对象在 JavaScript\
    \ 中的作用\n\nJavaScript 是一种面向对象的语言。我们提到了一些内置对象，我们也可以创建自己的对象并根据需要进行自定义。\n\n对象通过属性和方法来定义。这些属性为\
    \ JavaScript 中的对象概念赋予了意义。属性是定义对象的属性。方法定义可以在对象上实现的操作。\n\n让我们来看下面的代码，理解属性是如何定义对象的：\n\
    \n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\n var animal=new Object();\n\n animal.species=\"\
    Dog\";\n\n animal.nickname=\"Monster\";\n\n animal.age=10;\n\n animal.eyecolor=\"\
    brown\"; \n\n document.write(animal.nickname + \" is a dog that has \" +\nanimal.eyecolor\
    \ + \" eyes\");\n\n</script>\n</body>\n</html>\n\n"
