    \ call this the \n\nmodulus). Increment operators are used to increase the value\
    \ by one whereas the \n\ndecrement operator is used to decrease the value by one.\n\
    \nFor example, x=x+1 can also be written as x++ whereas y=y-1 can be written as\
    \ y--."
  - "[PAGE 13]\n\n7\n\nLogical operators\n\nThe following table displays the different\
    \ types of logical operators:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_13_0.png)\n\
    \nThe AND operator is used when all the conditions must be satisfied. For example,\
    \ X>5 && \n\ny=5 means that x should be greater than 5 and y must be equal to\
    \ 5 for the condition to \n\nbe true.\n\nThe OR operator is used when one of the\
    \ conditions must be true. For example, x=5 || y<3 \n\nmeans that the condition\
    \ is true when x is equal to 5 or y is less than 3.\n\nThe NOT operator is used\
    \ when the antithesis is true. For example, !(x>5) is true when x \n\nis equal\
    \ to or less than 5.\n\nConditions and Loops\n\nThe main purpose of JavaScript\
    \ is to add dynamic functionality. In order to execute a lot \n\nof actions and\
    \ iterations, we have the concept of conditions and loops in JavaScript. The \n\
    \nif-else statement is primarily used for various conditions. The structure of\
    \ the If-else \n\nstatement is as follows:\n\nif (condition)\n\n {\n\n JavaScript\
    \ statements to be executed\n\n }\n\nelse\n\n {\n\n JavaScript statements to be\
    \ executed\n\n }\n\nFor example, consider the following code snippet:\n\nIf (i>5)\n\
    \n {\n\n x=50;\n\n }\n\nelse\n\n {\n\n x=100;\n\n }"
  - "[PAGE 14]\n\n8\n\nThe interpretation of this code is simple. If the value of\
    \ i is greater than 5, the value of x will \n\nbe 50. If the value of i is not\
    \ greater than 5, then the value of x will be 100.\n\nAt times, we know the number\
    \ of iterations to be performed. Suppose we need to execute \n\nthe code and get\
    \ the output, say 10 times. At that time, we use loops to perform multiple \n\n\
    iterations as we know the number of times the loop will be repeated. We will see\
    \ an example \n\nof the for loop in this chapter.\n\nThe structure of the for\
    \ loop is as follows:\n\nfor (initialization;condition;increment)\n\n {\n\n JavaScript\
    \ statements\n\n }\n\nLet us have a look at a code snippet:\n\n<!DOCTYPE html>\n\
    \n<html>\n\n<body>\n\n<script type=\"text/javascript\">\n\n for (i=0;i<5;i++)\n\
    \n {\n\n document.write(i+ \"<br>\");\n\n }\n\n</script>\n\n<p>Hi</p>\n\n<p>This\
    \ is an example of the execution of the for loop</p>\n\n</body>\n\n</html>\n\n\
    The output of the code on execution would be as follows:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_14_0.png)"
  - "[PAGE 15]\n\n9\n\nFunctions\n\nFunctions are an integral part of JavaScript.\
    \ Let's understand the concept of functions. We know \n\nthat the imperative purpose\
    \ of JavaScript is to add functionality to the web page. Say, we want \n\nto add\
    \ certain functionality in JavaScript. Suppose we need to implement it on different\
    \ pages of \n\nthe website or different places on the same web page. Instead of\
    \ adding functionality each time, \n\nwe can use the concept of functions where\
    \ we can declare the function once. From there on, we \n\ncan use it multiple\
    \ times on multiple web pages or at different places on the website.\n\nThere\
    \ are many inbuilt functions in JavaScript. We can also craft our own functions\
    \ in \n\nJavaScript and customize them according to our needs. Let's look at the\
    \ following code \n\nto understand how the functions work:\n\n<!DOCTYPE html>\n\
    \n<html>\n\n<head>\n\n<title> Java Script in a nutshell </title>\n\n<h1> Functions\
    \ in JavaScript </h1>\n\n<p> Click on \"Click Here\" to execute the code in the\
    \ function </p>\n\n<script type=\"text/javascript\">\n\n function PacktPub()\n\
    \n {\n\n var x = prompt(\"Hey\", \"\");\n\n alert(\"Welcome to Packt, \" + x);\n\
    \n }\n\n</script>\n\n</head>\n\n<body>\n\n<a href=\"javascript:PacktPub()\">Click\
    \ Here</a>\n\n</body>\n\n</html>\n\nThe execution of the code will give us the\
    \ following output:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_15_0.png)"
  - "[PAGE 16]\n\n10\n\nOn clicking the Click Here link, we can see the following\
    \ output:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_16_0.png)\n\nWe get a prompt\
    \ box that requests for an input. Say we enter the name Joe and click on OK. \n\
    \nWe will get the following alert box as defined in the code.\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_16_1.png)\n\
    \nLet's now understand how the code works. We have used two inbuilt functions\
    \ in the code:\n\nf\n\nf\n\nalert\n\nf\n\nf\n\nprompt\n\nalert and prompt are\
    \ inbuilt functions in JavaScript.\n\nJavaScript is case-sensitive; hence, we\
    \ must use lowercase for \n\nalert and prompt, otherwise the code will not work."
  - "[PAGE 17]\n\n11\n\nThe alert and prompt functions are commonly used in JavaScript.\
    \ An alert box is used \n\nwhen we need to inform the user about some development.\
    \ It is also used when we want to \n\ngive the user some information prior to\
    \ clicking on a link or surfing the website. Similarly, a \n\nprompt box is used\
    \ when we want an input from the user before he accesses the page.\n\nIf you observe\
    \ the code, it is quite evident that the PacktPub() function was declared prior\
    \ \n\nto calling it. In the PacktPub() function, we have used the prompt and alert\
    \ functions. \n\nThe prompt command on execution will prompt the user for an input.\
    \ The double quotes \n\n(\"\") after Hey are for the default string that has to\
    \ be entered as the input. In the code, x is \n\na variable that is assigned a\
    \ prompt function. Again, x is used in the alert command in the \n\nvery next\
    \ line.\n\nOnce we enter the name Joe, we get an alert: Welcome to Packt, Joe.\n\
    \nThe concept of functions must be clear by now. Functions are used extensively\
    \ in JavaScript \n\nand are widely used to return a value in real-world programming.\
    \ Hence, functions are an \n\nimperative part of JavaScript.\n\nObjects and their\
    \ role in JavaScript\n\nJavaScript is an object-oriented language. We have inbuilt\
    \ objects such as Math, Date, and \n\nDocument, to mention a few. However, we\
    \ can also create our own objects and customize \n\nthem to suit our needs.\n\n\
    An object has properties and methods to define it. These are attributes that give\
    \ meaning  \n\nto the object-oriented concept in JavaScript. A property is an\
    \ attribute that defines values for  \n\nthe object. Methods define the action\
    \ that can be implemented on the objects.\n\nLet's have a look at the following\
    \ code to understand how properties define values for  \n\nan object:\n\n<!DOCTYPE\
    \ html>\n\n<html>\n\n<body>\n\n<script>\n\n var animal=new Object();\n\n animal.species=\"\
    Dog\";\n\n animal.nickname=\"Monster\";\n\n animal.age=10;\n\n animal.eyecolor=\"\
    brown\"; \n\n document.write(animal.nickname + \" is a dog that has \" + \n\n\
    animal.eyecolor + \" eyes\");\n\n</script>\n\n</body>\n\n</html>"
- md: "\n12\n\nThe output of the code would be as follows:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_18_0.png)\n\
    \nThus, we have defined properties for a dog called Monster. If you observe the\
    \ code and the \noutput, we can see that we have connected the properties using\
    \ string values connected by \nan operator known as the concatenation operator.\
    \ The concatenation operator is used to \nconnect several pieces of text together.\
    \ One point to remember is that the empty space in the \nstring is taken into\
    \ consideration. Observe how we have a space preceding and following the \n\"\
    \ is a dog that has \" string and how it reflects in the output. Coming back to\
    \ objects, we have \ndefined the properties for the dog by specifying its name,\
    \ age, and eye color.\n\nIn JavaScript, all the user-defined objects and the inbuilt\
    \ objects belong to an object called \nObject. Let's understand the concept of\
    \ the new operator and the constructor function. In \nthe earlier code, there\
    \ is a line of code `var animal=new Object();`. Hence, it is evident \nthat the\
    \ new operator is used to create an instance of the object. The constructor used\
    \ in \nthis case is Object(). The new operator is always followed by a constructor\
    \ method. That \nexplains the code structure to create a new object.\n\nInstead\
    \ of the inbuilt functions, we can also use user-defined functions. Let's have\
    \ a look at \nthe following code to understand how it works:\n\n<html>\n\n<head>\n\
    \n<script type=\"text/javascript\">\n\n function rate(cost){\n\n this.sellingPrice\
    \ = cost;\n\n }\n\n function prose(name, company){\n\n this.name= name; \n\n this.company\
    \ = company;\n\n this.rate = rate; \n\n }\n\n</script>\n</head>\n\n<body>\n\n\
    <script type=\"text/javascript\">\n\n var y = new prose(\"JavaScript\", \"Packt\
    \ Publishing\");\n\n y.rate(50);\n\n document.write(\"The name of the book is\
    \ \" + y.name+ \"<br>\");\n\n document.write(\"The name of the publishing company\
    \ is : \" + \ny.company + \"<br>\");\n\n document.write(\"The cost of the book\
    \ is $\" + y.sellingPrice+ \n\"<br>\");\n\n</script>\n</body>\n\n</html>\n\nThe\
    \ output of the code would be as follows:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_19_0.png)\n\
    \nWe need to understand that a function and method are very similar. The only\
    \ difference is \nthat a function is a standalone bunch of statements whereas\
    \ a method belongs to an object \nand can be referenced by the this keyword. In\
    \ the code, we have defined the rate function \nthat will act as the method; then\
    \ we assign the rate method as a property in the function \nprose. Hence, we have\
    \ seen the concept of properties and methods in JavaScript objects.\n\nAs we mentioned,\
    \ JavaScript is an object-oriented language. As with any object-oriented \nlanguage,\
    \ the OOP concept applies to JavaScript as well. Encapsulation, Inheritance, \n\
    Abstraction, and Polymorphism are features of OOP that can be applied to JavaScript.\n\
    \n## Arrays\n\nIn many programming languages such as C++, Java, and PHP to mention\
    \ a few, we use \nthe concept of arrays. Similarly, we use the concept of arrays\
    \ in JavaScript too. Objects in \nJavaScript store and allow manipulation of data.\
    \ So far, we have seen variables that are \nrestricted to a single piece of data.\
    \ However, in an array, we can store multiple items and \nretrieve them with ease.\n\
    \nArrays can be created in different ways. Let's have a look at the following\
    \ code snippet to \nunderstand it better:\n\n```javascript\nvar animals = new\
    \ Array();\nanimals[0]=\"cat\";\nanimals[1]=\"dog\";\nanimals[2]=\"mouse\";\n\
    ```\n\nWe can also create an array by entering the items directly within the new\
    \ Array constructor. \nThe following code snippet will show how it works:\n\n\
    ```javascript\nvar animals = new Array(\"cat\", \"dog\", \"mouse\");\n```\n\n\
    We can also define an array without using the new Array constructor.\n\n```javascript\n\
    var animals = [\"cat\", \"dog\", \"mouse\"];\n```\n\nThe index position of an\
    \ array starts with 0. The index feature helps us in accessing the data \nstored\
    \ in the array. Let's say we define the array as follows:\n\n```javascript\nvar\
    \ animals = [\"cat\", \"dog\", \"mouse\"];\n```\n\nIf we want to retrieve the\
    \ third item in the array, we need to specify its index position.\n\nLet's have\
    \ a look at the following code to understand how it works:\n\n<html>\n\n<head>\n\
    \n<title> Index in Arrays </title>\n</head>\n\n<body>\n\n<script type= \"text/javascript\"\
    >\n\nvar animals = [\"cat\", \"dog\", \"mouse\"];\n\nvar x = animals[2];\n\ndocument.write(x);\n\
    \n</script>\n</body>\n\n</html>\n\nThe output of the following code would be as\
    \ follows:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_20_0.png)\n\nAn array has\
    \ inbuilt properties and methods. For example, length is a property of arrays.\
    \ \nLet's have a look at the following code to see how it works:\n\n<html>\n\n\
    <head>\n\n<title> Index in Arrays </title>\n</head>\n\n<body>\n\n<script type=\
    \ \"text/javascript\">\n\nvar animals = [\"cat\", \"dog\", \"mouse\"];\n\ny=animals.length\n\
    \ndocument.write(y);\n\n</script>\n</body>\n\n</html>\n\nThe output of the code\
    \ would be 3.\n\nIn brief, let's look at the various properties and methods of\
    \ arrays:\n\n- push: To add an item at the end of the array\n- pop: To remove\
    \ an item at the end of the array\n- reverse: To reverse the order of elements\
    \ in the array\n- toString: To convert an array to a string\n- sort: To sort items\
    \ alphabetically or numerically in an ascending or descending order\n\n## An overview\
    \ on jQuery – the need of the hour\n\njQuery, a multi-browser JavaScript library,\
    \ was invented by John Resig. It is an open source \nlibrary. Modern complex websites\
    \ that have a lot of animation and navigation can be \ndeveloped with ease using\
    \ jQuery. jQuery mobile (JQM) is also an offshoot of the \nsmartphones and tablets,\
    \ responsive design is the trend today.\n\nIncluding a hosted copy of jQuery\n\
    \nWe can use the Content Delivery Network (CDN) of Google or Microsoft to host\
    \ the jQuery \nfile. Let's have a look at the following code snippet to see how\
    \ it works.\n\nIf we go to the Google CDN, we can see the following code snippet\
    \ that has to be included \nin order to use jQuery:\n\n```html\n<script src=\"\
    //ajax.googleapis.com/ajax/libs/jquery/2.0.0/jquery.min.js\"></script>\n```\n\n\
    If we go to the Microsoft CDN, we can see the following code snippet that has\
    \ to be included \nin order to use jQuery:\n\n```html\n<script src=\"http://ajax.aspnetcdn.com/ajax/jquery/jquery-1.9.0.js\"\
    ></script>\n```\n\nWe also have the minified version that can be used:\n\n```html\n\
    <script src=\"http://ajax.aspnetcdn.com/ajax/jquery/jquery-1.9.0.min.js\"></script>\n\
    ```\n"
  mdcn: "\n\n12\n\n代码的输出如下：\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_18_0.png)\n\
    \n因此，我们为一只名为 Monster 的狗定义了属性。如果我们观察代码和输出，我们可以看到我们使用被称为连接运算符（concatenation operator）的运算符通过字符串值连接属性。连接运算符用于将几段文本连接在一起。记住的一点是，字符串中的空格是被考虑在内的。观察我们在\
    \ \" is a dog that has \" 字符串前后各有一个空格，以及它是如何反映在输出中的。回到对象，我们通过指定名称、年龄和眼睛颜色定义了只狗的属性。\n\
    \n在 JavaScript 中，所有用户定义的对象和内置对象都属于一个名为 `Object` 的对象。让我们来理解 `new` 运算符和构造函数的概念。在之前的代码中，有一行代码\
    \ `var animal=new Object();`。因此，显而易见，`new` 运算符被用于创建对象的实例。在这种情况下，使用的构造函数是 `Object()`。`new`\
    \ 运算符后面总是跟着一个构造方法。这解释了创建新对象的代码结构。\n\n除了内置函数，我们也可以使用用户定义的函数。让我们来看下面的代码以理解它是如何工作的：\n\
    \n<html>\n\n<head>\n\n<script type=\"text/javascript\">\n\n function rate(cost){\n\
    \n this.sellingPrice = cost;\n\n }\n\n function prose(name, company){\n\n this.name=\
    \ name; \n\n this.company = company;\n\n this.rate = rate; \n\n }\n\n</script>\n\
    </head>\n\n<body>\n\n<script type=\"text/javascript\">\n\n var y = new prose(\"\
    JavaScript\", \"Packt Publishing\");\n\n y.rate(50);\n\n document.write(\"The\
    \ name of the book is \" + y.name+\"<br>\");\n\n document.write(\"The name of\
    \ the publishing company is : \" + \ny.company + \"<br>\");\n\n document.write(\"\
    The cost of the book is $\" + y.sellingPrice+ \n\"<br>\");\n\n</script>\n</body>\n\
    \n</html>\n\n代码的输出如下：\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_19_0.png)\n\n\
    我们需要理解函数和方法非常相似。唯一的区别是，函数是一组独立的语句，而方法属于一个对象，并可以通过 `this` 关键字进行引用。在代码中，我们定义了 `rate`\
    \ 函数它将作为方法运行；然后我们将 `rate` 方法赋值为 `prose` 函数中的一个属性。因此，我们已经看到了 JavaScript 对象中属性和方法的概念。\n\
    \n正如我们所提到的，JavaScript 是一种面向对象的语言。和任何其他面向对象的语言一样，OOP 概念也适用于 JavaScript。封装、继承、抽象和多态是适用于\
    \ JavaScript 的 OOP 特性。\n\n## 数组 (Arrays)\n\n在许多编程语言中，如 C++、Java 和 PHP 等，我们使用数组的概念。同样，我们在\
    \ JavaScript 中也使用数组的概念。JavaScript 对象存储并允许对数据进行操作。到为止，我们看到的变量局限于单个数据。然而，在数组中，我们可以存储多个项目并轻松地检索它们。\n\
    \n数组可以通过不同的方式创建。让我们来看下面的代码片段以更好地理解：\n\n```javascript\nvar animals = new Array();\n\
    animals[0]=\"cat\";\nanimals[1]=\"dog\";\nanimals[2]=\"mouse\";\n```\n\n我们也可以通过在\
    \ `new Array` 构造函数直接输入项目来创建数组。下面的代码片段将显示它是如何工作的：\n\n```javascript\nvar animals\
    \ = new Array(\"cat\", \"dog\", \"mouse\");\n```\n\n我们也可以不使用 `new Array` 构造函数来定义数组。\n\
    \n```javascript\nvar animals = [\"cat\", \"dog\", \"mouse\"];\n```\n\n数组的索引位置从\
    \ 0 开始。索引功能帮助我们访问存储在数组中的数据。假设我们如下定义数组：\n\n```javascript\nvar animals = [\"cat\"\
    , \"dog\", \"mouse\"];\n```\n\n如果我们想检索数组中的第三项，我们需要指定它的索引位置。\n\n让我们来看下面的代码以理解它是如何工作的：\n\
    \n<html>\n\n<head>\n\n<title> 中的索引 </title>\n</head>\n\n<body>\n\n<script type=\
    \ \"text/javascript\">\n\nvar animals = [\"cat\", \"dog\", \"mouse\"];\n\nvar\
    \ x = animals[2];\n\ndocument.write(x);\n\n</script>\n</body>\n\n</html>\n\n以下代码的输出如下：\n\
    \n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_20_0.png)\n\n数组有内置属性和方法。例如，`length`\
    \ 是数组的属性。让我们来看下面的代码看看它是如何工作的：\n\n<html>\n\n<head>\n\n<title> 中的索引 </title>\n</head>\n\
    \n<body>\n\n<script type= \"text/javascript\">\n\nvar animals = [\"cat\", \"dog\"\
    , \"mouse\"];\n\ny=animals.length\n\ndocument.write(y);\n\n</script>\n</body>\n\
    \n</html>\n\n代码的输出为 3。\n\n简而言之，让我们来看数组的各种属性和方法：\n\n- push: 在数组末尾添加项目\n- pop: 从数组末尾删除项目\n\
    - reverse: 反转数组中元素的顺序\n- toString: 将数组转换为字符串\n- sort: 按字母顺序或数字顺序升序或降序对项目进行排序\n\
    \n## jQuery 概述 – 时代所需之需\n\njQuery 是一个多浏览器 JavaScript 库，由 John Resig 发明。它是一个开源库。具有大量动画和导航的现代复杂网站可以使用\
    \ jQuery 轻松开发。jQuery mobile (JQM) 也是智能手机和平板电脑的衍生产品，响应式设计是今天的趋势。\n\n包含托管副本的 jQuery\n\
    \n我们可以使用 Google 或 Microsoft 的内容传递网络 (CDN) 来托管 jQuery 文件。让我们来看下面的代码片段看看它是如何工作的。\n\
    \n如果我们去 Google CDN，我们可以看到为了使用 jQuery 必须包含的代码片段：\n\n```html\n<script src=\"//ajax.googleapis.com/ajax/libs/jquery/2.0.0/jquery.min.js\"\
    ></script>\n```\n\n如果我们去 Microsoft CDN，我们可以看到为了使用 jQuery 必须包含的代码片段：\n\n```html\n\
    <script src=\"http://ajax.aspnetcdn.com/ajax/jquery/jquery-1.9.0.js\"></script>\n\
    ```\n\n我们还有一个可以使用的压缩版本：\n\n```html\n<script src=\"http://ajax.aspnetcdn.com/ajax/jquery/jquery-1.9.0.min.js\"\
    ></script>\n```\n\n"
