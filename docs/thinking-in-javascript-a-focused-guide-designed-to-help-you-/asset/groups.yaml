    \ Publishing 无法保证这些信息的准确性。\n\n首次出版：2014年3月\n\n制作参考号：1130314\n\nPackt Publishing\
    \ Ltd 出版\n\nLivery Place\n35 Livery Street\nBirmingham B3 2PB, UK.\n\nwww.packtpub.com\n\
    \n封面设计：Ankita Jha (ankitajha17@gmail.com)\n\n## 致谢\n\n### 作者\nAravind Shenoy\n\
    \n### 审核员\n- Arturas Lebedevas\n- Anirudh Prabhu\n\n### 内容开发编辑\n- Nehma Ramakrishnan\n\
    \n### 技术编辑\n- Dennis John\n\n### 校对员\n- Stephen Copestake\n\n### 制作协调员\n- Nitesh\
    \ Thakur\n- Pooja Chiplunkar\n\n### 封面制作\n- Prachali Bhiwandkar\n\n## 关于作者\n\n\
    Aravind Shenoy 是 Packt Publishing 的内部作者。他毕业于马尼帕尔理工学院（Manipal Institute of Technology），他的核心兴趣包括技术写作、网页设计和软件测试。他是印度孟买人，目前居住在那里。他曾编写过\
    \ *Hadoop: A Big Data Initiative* 和 *Thinking in CSS* 等书籍。他还编写了畅销书：*HTML5 and\
    \ CSS3 Transition, Transformation, and Animation*, *Packt Publishing*, (http://www.packtpub.com/html5-and-css3-for-transition-transformation-animation/book)。他是一个音乐爱好者，他的歌单里被\
    \ *The Doors*、*Oasis* 和 *R.E.M* 占据。\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_5_0.png)\n\
    \n## 概述\n\n在书中没有在海量的理论中徘徊，而是使用了实践示例。书中的示例兼容几乎所有的浏览器。你不需要照抄代码，而是修改代码并查看输出的变化，从而理解\
    \ JavaScript 的细微差别。\n\n通过练习，在本书结束时，你可以取得更好的成就并更熟悉 JavaScript。\n\n## JavaScript\
    \ 思维\n\nJavaScript 是一种用于 Web 的脚本语言。在我们深入研究 JavaScript 的复杂性之前，我们需要知道为什么要使用它。虽然\
    \ HTML 告诉浏览器页面应该什么样，但 JavaScript 将用于动态内容和添加功能。\n\n开始学习 JavaScript 的前提条件如下：\n\n\
    - HTML 的先验知识\n- 一个如记事本之类的文本编辑器\n- 你的网页浏览器已启用 JavaScript\n\nJavaScript 执行代码不需要编译器。JavaScript\
    \ 可以嵌入到 HTML 代码中。网页浏览器在页面加载时解释 JavaScript。\n\n在书中，我们将采用实践方法，以便对 JavaScript 有更深入的了解。在本书结束时，我们应该能够理解\
    \ JavaScript 的概念，以便我们可以在现实应用中实现它。\n\n## 应用 JavaScript\n\n我们不会绕圈子或在海量的理论中徘徊，而是将直接从简单的代码开始。\n\
    \n让我们来看下面的代码，了解 JavaScript是如何应用于网页的：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title> JavaScript 简介 </title>\n<script type=\"text/javascript\">\n alert(\" Welcome\
    \ to Packt \");\n</script>\n</head>\n</html>\n```\n\n当我们 own看这段代码时，可以看到我们在 `<head>`\
    \ 部分包含了一行：`script type=\"text/javascript\"`。`<script>` 标签及其类型属性告诉浏览器我们在 HTML 代码中引入了\
    \ JavaScript。我们还可以看到代码中有一个 `alert` 命令。我们将在书的稍后部分讨论 `alert` 命令。执行代码后，我们可以在屏幕上看到以下输出：\n\
    \n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_8_0.png)\n\n我们可以看到 JavaScript 代码必须插入在\
    \ `<script>` 和 `</script>` 标签之间。\n\n我们的 JavaScript 代码可以放在 `<head>` 或 `<body>`\
    \ 标签中。这取决于选择并取决于网页。如果有很多样式和视频，最好将 JavaScript 代码保留在 `<body>` 标签中。这确保了网页及其资源在 JavaScript\
    \ 出现之前完全加载。另一个原因是除了 JavaScript 文件外，任何资源都是异步加载的。然而，当加载 JavaScript 文件时，它是一个一个加载的。这会影响性能。\n\
    \n我们必须理解，如果有代码要写，将 JavaScript 代码与 HTML 代码分离始终是系统化的。在书中，为了方便起见，我们将 JavaScript 嵌入在\
    \ HTML 的 `<script>` 标签之间。然而，在现实世界中，将 JavaScript 代码保持为独立是一个良好的做法。为了这样做，我们需要创建一个独立的\
    \ JavaScript 文件并以 .js 扩展名保存它。JavaScript 代码必须写在这个单独的 .js 文件中。假设我们创建了一个名为 `main.js`\
    \ 的 JavaScript 文件。然后我们在 HTML 代码中调用 `main.js` 文件。让我们看一下代码示例以查看该过程：\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title> JavaScript 简介 </title>\n<script type=\"\
    text/javascript\" src=\"main.js\"></script>\n</head>\n</html>\n```\n\n在 `.js`\
    \ 文件中，我们需要编写以下代码段：\n\n```javascript\nalert(\" Welcome to Packt \");\n```\n\n当我们执行代码时，将得到与之前示例相同的输出。正如我们所看到的，我们通过在\
    \ HTML 文件中使用以下代码调用了 `main.js` 文件：\n\n`<script type=\"text/javascript\" src=\"\
    main.js\"></script>`\n\n在这里，`main.js` 文件应该与 HTML 文件处于同一路径。如果它在不同的文件夹，我们需要指定整个路径。\n\
    \n由此，我们看到了在代码中应用 JavaScript 的方法。\n\n## 变量\n\n在 JavaScript 中，我们需要用于存储数据和值的容器。因此，我们在\
    \ JavaScript 中使用变量。我们可以为变量分配数值或字符串值。字符串需要包含引号内。我们还有常量的概念。常量被分配了一个永久的值，而变量的值可以改变。\n\
    \n让我们来看看 JavaScript 中声明变量和常量的方式：\n\n```javascript\nvar amount;\nvar amount=5;\n\
    const a;\n```\n\n显而易见，变量之前应该是 `var` 关键字，而常量应该是 `const` 关键字。我们还可以看到可以在声明时给变量赋值。`const`\
    \ 兼容除 Internet Explorer 以外的所有现代版本。\n\n变量可以是局部的也可以是全局的。让我们看看如何区分局部和全局变量。\n\n记住\
    \ JavaScript 是区分大小写的。因此 \"myAttribute\" 不等于 \"myattribute\"。另一个注意点是每条语句都以分号结束。引号内的空格将反映在输出中。\n\
    \n### 全局变量和局部变量\n\n全局变量可以在脚本的任何位置访问，而局部变量只能在函数内部访问。\n\n让我们来看下面的代码以更好地理解：\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title> JavaScript 简介 </title>\n</head>\n<body>\n\
    <h1> JavaScript 中的变量 </h1>\n<script type=\"text/javascript\">\n function subtraction(a,\
    \ b)\n{\n var c;\n c = a-b;\n return c;\n }\nvar z = subtraction(10, 7);\n document.write(\"\
    相减后，差值是 \" + z);\n</script>\n</body>\n</html>\n```\n\n"
