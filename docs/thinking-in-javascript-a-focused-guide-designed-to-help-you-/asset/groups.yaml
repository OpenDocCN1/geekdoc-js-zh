    \ 中一样。我们需要记住 ID 前必须有一个 `#`，并且应该包含在双引号中。\n\n### 使用类\n\n让我们来看这段代码，查看如何通过类访问元素：\n\
    \n$(document).ready(function() {\n  var y = $(\".pubman\");\n});\n\n对于定义类为 `pubman`\
    \ 的元素，我们可以使用点 `.` 运算符来引用它。类的前必须有一个点 `.` 运算符，就像在 CSS 中一样。然而，类必须包含在双引号中。\n\n###\
    \ 使用标签\n\n让我们来看这段代码，查看如何通过标签名访问元素：\n\n$(document).ready(function) {\n  var links\
