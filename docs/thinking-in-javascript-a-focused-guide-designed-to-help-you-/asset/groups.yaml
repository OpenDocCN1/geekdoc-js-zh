    \nHence, it is a good practice to include the document ready feature in jQuery.\
    \ We have to use the following syntax to implement the document ready feature:\n\
    \n$(document).ready(function()\n\nIf we observe the code snippet, the function\
    \ is the callback function that has to be executed once the document gets ready\
    \ for implementing jQuery. We can also observe a $ sign. The $ sign is the synonym\
    \ for the jQuery() function. Instead of writing jQuery before the tag name, tag\
    \ id, or class, we can use $. It simplifies and shows that it is a jQuery code\
    \ snippet. Using the appropriate syntax makes up for cleaner and shorter code;\
    \ this is of prime importance when the page loads.\n\n## Accessing DOM elements\
    \ using jQuery\n\nSimilar to CSS, we can access elements in the Document Object\
    \ Model (DOM) using jQuery. In JavaScript, we use the getElementByID function\
    \ to access elements in the DOM by using their ID. However, we can do that in\
    \ jQuery in a much shorter code.\n\n20\n\n### Using the ID\n\nLet's have a look\
    \ at the following code snippet to see how we access the elements by their IDs:\n\
    \n$(document).ready(function() {\n  var x = $(\"#packt\");\n});\n\nFor an element\
    \ with an ID packt, we can refer to it using the # operator similar to the way\
    \ it is done in CSS. We need to remember that the ID has to be preceded by a #\
    \ and should be enclosed in double quotes.\n\n### Using the class\n\nLet's have\
    \ a look at the following code snippet to see how we access the elements by their\
    \ class:\n\n$(document).ready(function() {\n  var y = $(\".pubman\");\n});\n\n\
    For an element defined with a class pubman, we can refer it using the dot (.)\
    \ operator. The class has to be preceded by a dot (.) operator similar to the\
    \ way it is done in CSS. However, the class has to be enclosed in double quotes.\n\
    \n### Using the tag\n\nLet's have a look at the following code snippet to see\
    \ how we access the elements by their tag name:\n\n$(document).ready(function)\
    \ {\n  var links = $(\"a\");\n});\n\nThe elements can be accessed by their tag\
    \ name in jQuery by referring to the tag enclosed in double quotes.\n\n### Anonymous\
    \ functions\n\nLet's have a look at the way we use anonymous functions in jQuery.\
    \ The following code will give us an idea about its functionality:\n\n$(document).ready(function()\
    \ {\n  $('#packt').click(function() {\n    $('div').remove();\n  });\n});\n\n\
    Let's understand the meaning of the code.\n\nThe document ready feature has already\
    \ been explained. Then we query the DOM for the element with the ID packt and\
    \ we assign a click event to it. Inside the function, we have included the remove\
    \ method, which will remove the element. \n\n21\n\nThe document ready feature\
    \ has already been explained. Then we query the DOM for the element with the ID\
    \ packt and we assign a click event to it. Inside the function, we have included\
    \ the remove method, which will remove the element. (Wait, let's re-read the flow).\n\
    \n<html>\n\n<head>\n<title>jQuery Animation</title>\n<script src=\"http://ajax.aspnetcdn.com/ajax/jquery/jquery-1.9.0.js\"\
    ></script>\n<script type=\"text/javascript\">\n$(document).ready(function() {\n\
    \  $(\"#packt\").click(function() {\n    $(\".pubman\").show(2000);\n  });\n \
    \ $(packt).click(function() {\n    $(\".pubman\").hide(3500);\n  });\n});\n</script>\n\
    <style>\n.pubman{\nmargin:5px;\npadding:5px;\nborder:3px dashed;\ncolor:lime;\n\
    display:inline;\nwidth:110px;\nheight:40px;\n}\n</style>\n</head>\n\n<body>\n\n\
    <br>\n<div class=\"pubman\">Packt Publishing</div>\n<input id=\"packpub\" type=\"\
    button\" value=\"Click to Hide\" />\n<input id=\"packt\" type=\"button\" value=\"\
    Click to Display\" />\n</body>\n</html>\n\nLet's have a look at the output on\
    \ execution:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_28_0.png)\n\nWhen we\
    \ click on Click to Hide, the box containing the text vanishes. When we click\
    \ on Click to Display, the box appears again. We have used the show() method as\
    \ well as the hide() method in jQuery. We have also specified the time in milliseconds\
    \ for the transition to take place. Hence, we can see how easy it is to create\
    \ animations using jQuery. There are various other methods as toggle and fade,\
    \ to mention a few, but we cannot cover everything that jQuery has to offer in\
    \ this book.\n\n23\n\nCoding gets better with practice. We would really appreciate\
