    \ UK.\n\nwww.packtpub.com\n\nCover Image by Ankita Jha (ankitajha17@gmail.com)\n\
    \n## Credits\n\n### Author\nAravind Shenoy\n\n### Reviewers\n- Arturas Lebedevas\n\
    - Anirudh Prabhu\n\n### Content Development Editor\n- Nehma Ramakrishnan\n\n###\
    \ Technical Editor\n- Dennis John\n\n### Proofreaders\n- Stephen Copestake\n\n\
    ### Production Coordinators\n- Nitesh Thakur\n- Pooja Chiplunkar\n\n### Cover\
    \ Work\n- Prachali Bhiwandkar\n\n## About the Author\n\nAravind Shenoy is an in-house\
    \ author at Packt Publishing. An engineering graduate from the Manipal Institute\
    \ of Technology, his core interests include technical writing, web designing,\
    \ and software testing. He is a native of Mumbai, India, and currently resides\
    \ there. He has penned down books such as *Hadoop: A Big Data Initiative* and\
    \ *Thinking in CSS*. He has also authored the bestselling book: *HTML5 and CSS3\
    \ Transition, Transformation, and Animation*, *Packt Publishing*, (http://www.packtpub.com/html5-and-css3-for-transition-transformation-animation/book).\
    \ He is a music buff with *The Doors*, *Oasis*, and *R.E.M* ruling his playlists.\n\
    \n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_5_0.png)\n\n## Overview\n\nInstead\
    \ of wandering through loads of theory, we have used practical examples in this\
    \ book. The examples in this book are compatible with almost every browser. Instead\
    \ of using the verbatim code, you can modify the code and see the change in the\
    \ output thereby understanding the subtle nuances of JavaScript.\n\nBy the end\
    \ of the book, with practice, you can achieve better things and get more acquainted\
    \ with JavaScript.\n\n## Thinking in JavaScript\n\nJavaScript is a scripting language\
    \ for the Web. Before we delve into the intricacies of JavaScript, we need to\
    \ know why it is used. While HTML tells your browser how the page will look, JavaScript\
    \ will be used for dynamic content and to add functionality.\n\nThe prerequisites\
    \ for getting started with JavaScript are as follows:\n\n- Prior knowledge of\
    \ HTML\n- A text editor such as Notepad\n- JavaScript enabled on your web browser\n\
    \nJavaScript does not require a compiler to execute the code. JavaScript can be\
    \ embedded within the HTML code. The web browser interprets the JavaScript while\
    \ the page loads.\n\nIn this book, we are going to use a practical approach so\
    \ that we can gain more insight into JavaScript. By the end of the book, we should\
    \ be able to understand the concepts of JavaScript so that we can implement it\
    \ in our real-life applications.\n\n## Applying JavaScript\n\nInstead of beating\
    \ around the bush and wandering through loads of theory, we will start with a\
    \ simple code right away.\n\nLet's look at the following code to understand how\
    \ JavaScript is applied to a web page:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title> Introduction to JavaScript </title>\n<script type=\"text/javascript\"\
    >\n alert(\" Welcome to Packt \");\n</script>\n</head>\n</html>\n```\n\nWhen we\
    \ look at this code, we can see that we have included a line: `script type=\"\
    text/javascript\"` in the `<head>` section. The script tag and its type attribute\
    \ tell the browser that we have introduced a JavaScript in the HTML code. We can\
    \ also see that there is an alert command in the code. We will talk about the\
    \ alert command later in this book. On executing the code, we can see the following\
    \ output on the screen:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_8_0.png)\n\
    \nWe can see that the JavaScript code must be inserted between the `<script>`\
    \ and `</script>` tags.\n\nOur JavaScript code can be kept in the `<head>` or\
    \ `<body>` tags. It is a matter of choice and depends on the web page. If there\
    \ are a lot of styles and videos, it is preferable to keep the JavaScript code\
    \ in the `<body>` tag. This ensures that the web page and its resources have been\
    \ loaded completely before JavaScript comes into the picture. Another reason is\
    \ that any resource, except for a JavaScript file, loads asynchronously. However,\
    \ when a JavaScript file is being loaded, it happens one at a time. This hampers\
    \ the performance.\n\nWe must understand that if there is a lot of code to be\
    \ written, it is always systematic to keep the JavaScript code separate from the\
    \ HTML code. In this book, we will embed JavaScript in the HTML between the `<script>`\
    \ tags for the sake of convenience. However, in real-world situations, it is good\
    \ practice to keep the JavaScript code as a standalone. For that, we need to create\
    \ a standalone JavaScript file and save it with a .js extension. The JavaScript\
    \ code must be written in this separate .js file. Suppose we create a JavaScript\
    \ file called `main.js`. We then invoke the `main.js` file in our HTML code. Let's\
    \ have a look at a code example to view the procedure:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title> Introduction to JavaScript </title>\n<script type=\"text/javascript\"\
    \ src=\"main.js\"></script>\n</head>\n</html>\n```\n\nIn the `.js` file, we need\
    \ to write the following code snippet:\n\n```javascript\nalert(\" Welcome to Packt\
    \ \");\n```\n\nWhen we execute the code, we will get the same output as shown\
    \ in the earlier example. As we can see, we have invoked the `main.js` file by\
    \ using the following code in our HTML file:\n\n`<script type=\"text/javascript\"\
    \ src=\"main.js\"></script>`\n\nHere, the `main.js` file should be on the same\
    \ path as the HTML file. If it is in a different folder, we need to specify the\
    \ entire path.\n\nThereby, we have seen the procedure to applying JavaScript in\
    \ our code.\n\n## Variables\n\nIn JavaScript, we need containers that will store\
    \ data and values for processing purposes. Hence, we use variables in JavaScript.\
    \ We can assign a numeric or a string value to a variable. A string needs to be\
    \ enclosed in quotes. We also have the concept of constants. A constant is assigned\
    \ a value that is permanent in the script, unlike variables where the values can\
    \ be changed.\n\nLet's have a look at the way we declare variables and constants\
    \ in JavaScript:\n\n```javascript\nvar amount;\nvar amount=5;\nconst a;\n```\n\
    \nIt is quite evident that the variable should be preceded by the `var` keyword\
    \ whereas constants must be preceded by the `const` keyword. We can also see that\
    \ the value can be assigned to a variable at the time of declaring it. `const`\
    \ is compatible with modern versions of all browsers except Internet Explorer.\n\
    \nA variable can be either local or global. Let's look at how we differentiate\
    \ between local and global variables.\n\nRemember that JavaScript is case-sensitive.\
    \ Hence \"myAttribute\" is *not* the same as \"myattribute\". One more point to\
    \ note is that every statement ends with a semicolon. Spaces inside the quotes\
    \ will be reflected in the output.\n\n### Global and local variables\n\nGlobal\
    \ variables can be accessed from any location in the script, whereas local variables\
    \ can be accessed only within the function.\n\nLet's have a look at the following\
    \ code to understand it better:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title> Introduction to JavaScript </title>\n</head>\n<body>\n<h1> Variables in\
    \ JavaScript </h1>\n<script type=\"text/javascript\">\n function subtraction(a,\
    \ b)\n{\n var c;\n c = a-b;\n return c;\n }\nvar z = subtraction(10, 7);\n document.write(\"\
    After subtraction, the difference is \" + z);\n</script>\n</body>\n</html>\n```\n"
