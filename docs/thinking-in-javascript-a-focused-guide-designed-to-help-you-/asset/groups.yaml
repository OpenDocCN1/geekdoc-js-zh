    \ DOM 中 ID 为 `packt` 的元素，并为它分配一个点击事件。在函数内部，我们包含了 `remove` 方法，它将移除该元素。\n\n21\n\n\
    文档准备就绪功能已经解释过了。然后我们查询 DOM 中 ID 为 `packt` 的元素，并为它分配一个点击事件。在函数内部，我们包含了 `remove`\
