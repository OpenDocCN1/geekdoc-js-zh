  - "[PAGE 24]\n\n18\n\n$(\"p\").click(function() {\n\n alert(\"Welcome to Packt Publishing\"\
    );\n\n});\n\n</script>\n\n</head>\n\n<body>\n\n<p>Click here to understand the\
    \ document ready feature</p>\n\n</body>\n\n</html>\n\nOn execution, we can see\
    \ the following output:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_24_0.png)\n\
    \nAccording to the code, when we click on the text, an alert dialog box is displayed\
    \ that reads \n\nWelcome to Packt Publishing.\n\nHowever, we do not see any alert\
    \ box. This is because the events must be fired, or should \n\nperform the desired\
    \ action, before the page loads. If you observe the code, the alert box is \n\n\
    not displayed as the method is not called before the click event takes place.\
    \ By using the \n\ndocument ready feature, we can solve this issue. Let's tweak\
    \ the code a bit and include the \n\ndocument ready feature.\n\n<html>\n\n<head>\n\
    \n<title>Understanding the document ready function</title>\n\n<script src=\"http://ajax.aspnetcdn.com/ajax/jquery/jquery-1.9.0.js\"\
    > \n\n</script>\n\n<script type=\"text/javascript\">\n\n$(document).ready(function()\
    \ {\n\n $(\"p\").click(function() {\n\n alert(\"Welcome to Packt Publishing\"\
    );\n\n });\n\n});\n\n</script>\n\n</head>\n\n<body>\n\n<p>Click here to understand\
    \ the document ready feature</p>\n\n</body>\n\n</html>"
  - "[PAGE 25]\n\n19\n\nThe code on execution will display the following output:\n\
    \n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_25_0.png)\n\nHowever, the difference\
    \ here is that on clicking the text in the output, the following alert box \n\n\
    gets displayed:\n\n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_25_1.png)\n\nHence,\
    \ it is a good practice to include the document ready feature in jQuery. We have\
    \ to use \n\nthe following syntax to implement the document ready feature:\n\n\
    $(document).ready(function()\n\nIf we observe the code snippet, the function is\
    \ the callback function that has to be executed \n\nonce the document gets ready\
    \ for implementing jQuery. We can also observe a $ sign. \n\nThe $ sign is the\
    \ synonym for the jQuery() function. Instead of writing jQuery before \n\nthe\
    \ tag name, tag id, or class, we can use $. It simplifies and shows that it is\
    \ a jQuery code \n\nsnippet. Using the appropriate syntax makes up for cleaner\
    \ and shorter code; this is of \n\nprime importance when the page loads.\n\nAccessing\
    \ DOM elements using jQuery\n\nSimilar to CSS, we can access elements in the Document\
    \ Object Model (DOM) using jQuery. \n\nIn JavaScript, we use the getElementByID\
    \ function to access elements in the DOM by using \n\ntheir ID. However, we can\
    \ do that in jQuery in a much shorter code."
  - "[PAGE 26]\n\n20\n\nUsing the ID\n\nLet's have a look at the following code snippet\
    \ to see how we access the elements by their IDs:\n\n$(document).ready(function()\n\
    \n {\n\n var x = $(\"#packt\");\n\n });\n\nFor an element with an ID packt, we\
    \ can refer to it using the # operator similar to the way \n\nit is done in CSS.\
    \ We need to remember that the ID has to be preceded by a # and should \n\nbe\
    \ enclosed in double quotes.\n\nUsing the class\n\nLet's have a look at the following\
    \ code snippet to see how we access the elements by \n\ntheir class:\n\n$(document).ready(function()\n\
    \n {\n\n var y = $(\".pubman\");\n\n });\n\nFor an element defined with a class\
    \ pubman, we can refer it using the dot (.) operator. \n\nThe class has to be\
    \ preceded by a dot (.) operator similar to the way it is done in CSS. \n\nHowever,\
    \ the class has to be enclosed in double quotes.\n\nUsing the tag\n\nLet's have\
    \ a look at the following code snippet to see how we access the elements by their\
    \ \n\ntag name:\n\n$(document).ready(function)\n\n {\n\n var links = $(\"a\");\n\
    \n });\n\nThe elements can be accessed by their tag name in jQuery by referring\
    \ to the tag enclosed in \n\ndouble quotes.\n\nAnonymous functions\n\nLet's have\
    \ a look at the way we use anonymous functions in jQuery.\n\nThe following code\
    \ will give us an idea about its functionality:\n\n$(document).ready(function()\n\
    \n {"
  - "[PAGE 27]\n\n21\n\n $('#packt').click(function()\n\n {\n\n $('div').remove();\n\
    \n });\n\n });\n\nLet's understand the meaning of the code.\n\nThe document ready\
    \ feature has already been explained. Then we query the DOM for the \n\nelement\
    \ with the ID packt and we assign a click event to it. Inside the function, we\
    \ have \n\nincluded the remove method, which will remove all <div> elements.\n\
    \nFor the various methods used in jQuery, we can have a look at books such \n\n\
    as *jQuery for Designers: Beginner's Guide*, which are on the Packt website \n\
    \nat www.packtpub.com. Alternatively, we can refer to the Packt online \n\nlibrary\
    \ at http://packtlib.packtpub.com/.\n\njQuery is widely used for animation. We\
    \ will now have a look at the following code where we \n\nhide and show elements\
    \ on the web page:\n\n<html>\n\n<head>\n\n<title>jQuery Animation</title>\n\n\
    <script src=\"http://ajax.aspnetcdn.com/ajax/jquery/jquery-1.9.0.js\"> \n\n</script>\n\
    \n<script type=\"text/javascript\">\n\n $(document).ready(function() {\n\n $(\"\
    #packt\").click(function () {\n\n $(\".pubman\").show( 2000);\n\n });\n\n $(\"\
    #packtpub\").click(function () {\n\n $(\".pubman\").hide( 3500 );\n\n });\n\n\
    \ });\n\n</script>\n\n<style>\n\n.pubman{ margin:5px;padding:7px;\n\n border:3px\
    \ dashed navy;\n\n color:lime;"
  - "[PAGE 28]\n\n22\n\n width:110px;\n\n height:40px;\n\n display:inline;\n\n }\n\
    \n</style>\n\n</head>\n\n<body>\n\n<br>\n\n<div class=\"pubman\">\n\nPackt Publishing\n\
    \n</div>\n\n<input id=\"packtpub\" type=\"button\" value=\"Click here to Hide\"\
    \ />\n\n<input id=\"packt\" type=\"button\" value=\"Click here to Display\" />\n\
    \n</body>\n\n</html>\n\nLet's have a look at the output of the code on execution:\n\
    \n![](img/e2f9ec0935e89c75d7b9cd0b6f17410a_28_0.png)\n\nWhen we click on Click\
    \ here to Hide, the box containing the text Packt Publishing vanishes. \n\nWhen\
    \ we click on Click here to Display, the box appears again. We have used the show()\
    \ \n\nmethod as well as the hide() method in the jQuery code. We have also specified\
    \ the time in \n\nmilliseconds for the transition to take place.\n\nHence, we\
    \ can see how easy it is to create animations using jQuery. There are various\
    \ other \n\nmethods such as toggle and fade, to mention a few, but we cannot cover\
    \ everything that \n\njQuery has to offer in this book.\n\njQuery is a vast subject\
    \ and the book will only look at a certain aspect of it. Packt has a lot of \n\
    \nbooks on jQuery such as *jQuery for Designers: Beginner's Guide*, Packt Publishing,\
    \ and you \n\ncan visit our web page at http://www.packtpub.com/books?keys=jquery\
    \ to see the \n\nvarious books on jQuery customized for your needs."
