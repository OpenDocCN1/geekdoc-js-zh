    # Working with the START Command


    The START command provides an alternative way of opening a Windows command console
    and starting a new Windows shell session. The START command automatically opens
    a new Windows console each time it is executed. This provides a handy way to work
    with multiple Windows consoles at the same time. The START command also provides
    more control over new Windows shell sessions. The START command''s syntax is shown
    below.


    ```

    START ["TITLE"] [/Dpath] [/I] [/MAX] [/SEPARATE] | [/SHARED]

    [/LOW] [/NORMAL] [/HIGH] [/REALTIME] [/ABENORMAL] | [/BELOWNORMAL]

    [/WAIT] [/B] [Program/Command] [Parameters]

    ```'
