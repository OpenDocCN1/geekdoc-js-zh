  md: '# APPENDIX


    # # Windows Shell Scripting Administrative Scripts


    In addition to serving as a great introductory computing language, Windows shell
    scripting serves a very practical purpose: assisting the automated administration
    of computer and network tasks. As such, this book would be remiss if it did not
    provide you with some practical examples of Windows shell scripts designed to
    do something other than play games. In this appendix, you will find a collection
    of seven scripts that demonstrate various tasks that can be automated using Windows
    shell scripts. Some of the scripts have more practical value than others. However,
    you can use them as a foundation for developing scripts that suit your specific
    needs.


    Specifically, you will learn


    +   - How to programmatically connect to network disk drives

    - How to automate the creation of user and administrator accounts

    - How to automate the Windows disk defrag process

    - How to automate the execution of your Windows shell scripts

    - How to create a network chat script

    - How to execute and control third-party utilities and programs from within Windows
    shell scripts'
  merge: -1
