  md: 'the value assigned to the variable is greater than 22,000. It will take a different
    set of actions if the value is greater than 11,000 but less than 22,000. Finally,
    a third set of actions is taken if the variable''s value is less than 11,000 but
    greater than zero.


    The rest of the script consists of three major sections. The statements that make
    up each section are very similar, so I''ll explain the statements that comprise
    the first section in detail and provide a high-level overview of the remaining
    sections.


    # Clearing the Windows Command Console


    Now check the value stored in the TestVariable to see if it is greater than 22,000.
    You can do this by adding the three lines of code you see below.


    ```

    %TestVariable% GTR 22000 (\n

    CLS

    ```


    The first line can be translated like this: "If the value assigned to TestVariable
    is greater than 22,000, then perform the following action." The action to be performed
    is enclosed within parentheses (a pair of () characters). Actually, the opening
    ( character is at the end of the first line and the closing ) character is on
    the third line. Nonetheless, the CLS command is still considered enclosed within
    them. This command clears the Windows command console, giving the script a clear
    screen onto which to write additional text.


    # Modifying the Windows Command Console Title Bar


    Next, add the statement shown below in bold. This statement uses the TITLE command
    to post a text message in the Windows command console''s title bar. The message
    consists of two parts. The first part is a text string (e.g., UCP - The Unpredictable
    Command Prompt). The second part is a reference to the TestVariable. When referenced
