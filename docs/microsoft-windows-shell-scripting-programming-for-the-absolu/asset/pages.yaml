- img_proc: true
  md: '# Developing the :DisplayMenu Procedure


    The game''s welcome screen is displayed whenever the :DisplayMenu procedure is
    called. As you can see, this procedure clears the display and then uses FOR and
    ECHO commands to display the welcome screen.


    :DisplayMenu


    ```

    CLS


    FOR /L %%I IN (1,3) DO ECHO.


    ECHO WELCOME TO

    ECHO.

    ECHO ROCK, PAPER, SCISSORS!

