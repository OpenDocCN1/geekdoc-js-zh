    # Overview of Windows Shell Scripting


    In the early days of Windows operating systems, there was no point-and-click graphical
    user interface. Everything was done via the keyboard by typing commands at the
    Windows command prompt. This meant that users had to memorize all kinds of commands
    in order to use their computers. Worse still, most Windows commands could be entered
    using a number of variations, making it virtually impossible to memorize all possible
    commands. Naturally, this meant people spent a lot of time looking up commands.
    Often users found that they needed to type the same set of commands over and again.
    To make this easier and eliminate typing errors, users and administrators created
    batch files. A batch file is a plain-text file made up of the same Windows commands
    that you type in the Windows command prompt. Batch files have a .bat extension.
    They are executed by typing them at the command prompt and pressing the Enter
    key. The operating system executes each command in the batch file, one at a time,
    starting at the beginning of the file.


    In the early 1980s, Microsoft introduced its graphical user interface and most
    users happily left behind all memory of Windows commands and the command prompt.
    However, batch files still remained valuable tools for automating the execution
    of commands and utilities, and were especially useful to power users and administrators.


    Batch files remained limited to sequential Windows command execution. The only
    alternatives available to batch files were manually executing commands at the
    Windows command prompt, purchasing an application to perform tasks, or creating
    a custom program using an advanced language such as C or C++ to create a new custom
    application capable of performing the required tasks.


    As I''m sure you must be thinking, none of these three options was very practical.
    They required either too money or more time than users and administrators were
    willing to spend. Finally, in the early 1990s, Microsoft introduced Windows NT.
    This Microsoft operating system featured a built-in scripting language known as
    Windows shell scripting. Windows shell scripting differed from old-style'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'batch files in that featured a complete set of programming statements, thus
    allowing for the development of scripts that included support for conditional
    logic, iterative logic, and the storage and retrieval of data using computer memory.


    The term conditional logic refers to a script''s ability to examine data and then
    adjust what it does based on the results of a conditional analysis.


    The term iterative logic refers to a script''s ability to repeatedly execute a
    series of steps over and again.


    A statement is a line of code. Most statements repeat on on a single line; however,
    lengthy statements can be spread over multiple lines.


    Microsoft has since added support for Windows shell scripting to all Windows operating
    systems that have been built on Windows NT technology (e.g., Windows 2000, XP,
    and 2003).


    While the collection of programming statements that make up the Windows script
    language has remained essentially the same over the years, a few of the statements
    have been modified to extend their functionality. Rather than attempt to identify
    and examine differences in Windows shell scripting statements between each of
    the different Windows operating systems, this book uses Windows XP as its as-developed
    platform.


    If you plan on writing scripts that will be executed by older operating systems,
    you should retain the scripts on each operating system to make sure that they
    work as you expect them to. In addition, you can check any Windows command''s
    syntax to see what it supports on a given operating system by accessing the Windows
    command prompt and typing the name of the command by a space and the word HELP.


    Windows scripts are saved with a .bat ("batch") or .cmd ("command") file extension.
    This way, when the operating system is asked to run them, it will execute them
    using the Windows shell.


    The .cmd file extension is another file extension that Windows associates with
    Windows shell scripts.'
  merge: -1
