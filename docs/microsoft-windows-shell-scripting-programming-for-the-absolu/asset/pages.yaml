  md: 'you how to add comments to scripts in order to make them self-documenting.
    In addition, I''ll discuss the importance of using comments to create a Windows
    shell script documentation template that you can use to improve the overall organization
    and manageability of your scripts.


    # Documenting Your Scripts with Comments


    Adding comments to your Windows shell scripts makes them easier for other people
    to understand. Comments provide you with the ability to embed documentation with
    a script so that you can explain and why you wrote it the way that you did. Adding
    comments to scripts is a little bit like adding a trail of bread crumbs. They
    give you something to follow if you find that you need to fix or modify a script
    sometime down the road.


    Comments are added to Windows shell scripts using the REM statement, which has
    the following syntax:


    ```

    REM Comment

    ```


    Comment is a text string representing the documentation that you wish to embed
    in the script. REM statements have no impact on the execution of your script.
    The Windows shell ignores them during script execution. You can use the REM statement
    in either of two ways. One way to use the REM statement is to include it on a
    line by itself to describe or document the action of one or more statements that
    follow, as demonstrated below.


    ```

    @ECHO off

    ```


    ```

    REM Display the Welcome Screen


    ECHO.

    ECHO.

    CHO WELCOME TO THE

    ECHO.

    ECHO FORTUNE TELLER GAME!

    ECHO.

    ECHO.

    ECHO.

    ```


    ```

    REM Make the player hit a key in order for the game to continue


    PAUSE

    ```'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'A second way to use the REM statement is to place it at the end of another
    statement, as demonstrated below.


    PAUSE REM Make the player hit a key in order for the game to continue


    Always begin with the @ECHO statement as the first script statement. If you forget
    and leave this statement out of your script, all your script statements (including
    your comments) will be displayed as the script executes, thus defeating much of
    the benefit for adding comments to your scripts.


    # Creating a Script Template


    Now that you know how to use the REM statement to add comments to your Windows
    shell scripts, consider a second application for this highly useful statement.


    Instead of using the REM statement just to document your script''s logic, how
    about using it to improve your scripts over overall organization? Specifically,
    I am suggesting that you create a Windows shell script template similar to the
