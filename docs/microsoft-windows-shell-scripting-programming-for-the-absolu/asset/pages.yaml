  md: '# Reorganizing Your Windows Shell Scripts


    As you have now many times, Windows shell scripts execute by default from top
    to bottom. However, you can use the GOTO command along with a LABEL statement
    to direct scripts to jump from one location to another and resume execution. You
    have also seen on numerous occasions where I have used the GOTO command and a
    LABEL statement to set up loops.


    The Windows shell provides another use for GOTO command and LABEL statement: creating
    subroutines. A subroutine is created whenever you use the GOTO command and the
    LABEL statement to switch processing control to a later section of the script
    (as opposed to a loop, where processing control is passed back to an earlier section
    of the script).


    The Windows also allows you to define procedures using the CALL command and the
    LABEL statement. Using procedures, you switch processing control from one portion
    of the script to another section and then back again when the procedure finishes
    executing.


    # Understanding Labels


    Even though you have seen them many times, I have not yet formally defined labels.
    Labels are markers that you place inside your Windows shell scripts. Labels are
    used to establish loops, subroutines, and procedures. The syntax for the LABEL
    statement is shown below.


    ```

    :LABEL

    ```


    As you can see, a label consists of the colon character followed by the label''s
    name. Label names are not case-sensitive, and you may use any combination of letters
    and numbers as well as the underscore character when specifying labels.


    # Defining Subroutines


    When you set up a subroutine and then execute it, your script skips the execution
    of any statements that occur after the GOTO command and before the specified LABEL
    statement, as depicted in Figure 7.6.'
