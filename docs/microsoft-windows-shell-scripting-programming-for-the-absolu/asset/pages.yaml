    # Customizing the Windows Command Console


    The Windows command console provides you with a text-based interface to the Windows
    shell. By default, it displays text in a Window that is 25 lines long and 80 characters
    wide. All text is displayed in white and the background color is set to be black.
    Like most Windows features, the Windows command console can be configured from
    the Windows desktop in a number of different ways.


    # Customization Options


    Windows command console customization is performed by the Command Prompt Dialogs.
    You can open this dialog by opening the Windows command console and right-clicking
    on the Command Prompt icon in the upper-left corner of the console and selecting
    Properties. This dialog is organized into four property sheets as listed below.


    +   * Options

    * Font

    * Layout

    * Colors


    Each of these property sheets configures a different set of properties for the
    Windows command console as explained in the sections that follow.


    # Configuring Options Settings


    The Windows XP Options property sheet, shown in Figure 2.6, provides access to
    the following configuration settings:'
