    # Reversing the Logic of Conditional Tests


    Sometimes it makes sense to test for the inverse of a particular condition. For
    example, it makes more sense to check if the previous command did not return an
    exit code of 0 rather than to see if it returned an exit code greater than 0.
    In the end, I suppose deciding whether inverting a conditional test makes sense
    depends on the way you think.


    The Windows shell lets you use the NOT keyword to each of the supported forms
    of IF statement. In the sections that, I''ll show you examples of how to use the
    NOT keyword to invert the conditional logic for each of the different types of
    IF statements that you''ve seen in this chapter.


    # IF NOT


    By adding the NOT keyword to the IF statement, you can test for the opposite of
    any condition that you might want to check. The syntax for this form of the IF
    statement is outlined below.


    ```

    IF NOT condition1 -- condition2 command

    ```


    For example, you might want to use the NOT statement when working with variables.
    The following example demonstrates how to set up an IF statement that checks to
    see if a variable has been set equal to C:\Scripts, and if it has, its value is
    changed.


    ```

    IF NOT "Scripts$" == "C:\Scripts" SET Scripts=C:\Scripts"

    ```


    I recommend that you use the NOT statement in every Windows shell script you create
    (especially if you share them with other people) and that you set it up to prevent
    the script''s accidental execution on unsupported Windows operating systems (e.g.,
    Windows 95, 98, and Me). This can be easily accomplished by making the statement
    part of your standard Windows shell template as demonstrated below.


    ```

    @ECHO off

    REM *********************************************************************

    REM

    REM Script Name: XXXXXxx.bat

    ```'
