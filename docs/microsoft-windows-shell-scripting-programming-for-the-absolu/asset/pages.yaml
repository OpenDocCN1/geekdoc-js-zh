  md: '# IN THE REAL WORLD


    As mentioned in Chapter 2, "Interacting with the Windows Shell," numerous commands
    have been enhanced to support new command extensions. A list of these commands
    includes ASSOC, CALL, CD, COLOR, DEL, ENDLOCAL, FOR, FTYPE, GOTO, IF, MD, MOTOD,
    PROMPT, PUSHO, SET, SETLOCAL, SHIFT, START. If you create Windows shell scripts
    that take advantage of features provided by the new command extensions these commands
    and try to run your scripts on a computer running a version of Windows that does
    not support the command extensions, your scripts will run into errors. Therefore,
    you must test your Windows scripts rigorously on all operating systems you intend
    to support. If, for example, you have a script that needs to run on Windows NT
    4 that uses the SET /P switch to interact with the user, you will need to rewrite
    the script to use the unsupported command switch. In example, you can use the
    Windows NT 4 Resource Kit CHDICE.EXE command to interactively prompt the user
    for the information the script requires.


    By using the IF CMDEXTVERSION statement to check the value of the CMDEXTVERSION
    variable, you can enable your scripts to detect which version of the Windows shell
    is being used to execute them and then to react accordingly. For example, if your
    scripts make use of command extensions, you might halt script execution, or you
    might use conditional logic to have your scripts skip steps.


    The syntax you must follow to use the IF CMDEXTVERSION statement is outlined below.


    ```

    IF CMDEXTVERSION VersionNo Command

    ```


    VersionNo is a placeholder that represents the Windows shell version number that
    you want to test, and Command is a Windows command that will be executed if the
    value of CMDEXTVERSION is equal to or less than the value specified by VersionNo.
    For example, the following script checks to see whether the script is executing
    on a computer running Windows NT, 2000, XP, or 2003, and if it isn''t, the script
    terminates its own execution. Using this programming technique, you can prevent
    your Windows shell scripts from trying to run on other Windows operating systems.


    ```

    @ECHO off

    IF CMDEXTVERSION 1 ECHO Unsupported operating system and GOTO :EOF

    ```


