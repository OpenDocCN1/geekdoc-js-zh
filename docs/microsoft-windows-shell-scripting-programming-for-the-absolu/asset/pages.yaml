  md: '# Debugging and Error Handling


    The focus of this final chapter is to help you deal with errors that are bound
    to occur as you develop your scripts. To begin, I''ll discuss the different types
    of errors that you will experience, and then I will give you advice on how to
    deal with them. You''ll learn how to display intermediary results during script
    execution and how to create an optional debug execution mode.


    In addition to all this, you''ll learn how to report on errors that your scripts
    are unable to avoid. This reporting will include the creation of error reports
    and the generation of custom error messages. I''ll also show you how to set up
    scripts that, when executed as procedures, will return an exit code to their calling
    script.


    Specifically, you will learn


    +   * How to display intermediary results during script execution

    * How to create scripts that include an optional script debug mode

    * How to create error reports when problems occur within scripts

    * How to pass exit code data back to calling scripts from scripts executed as
    external procedures'
