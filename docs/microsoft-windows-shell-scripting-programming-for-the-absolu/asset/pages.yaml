  md: '# Creating, Modifying, and Deleting Script Variables


    While you are limited as to what you can do within a script with environment variables,
    you have complete control over your script variables. For example, to create a
    script variable gamename and assign it a value of WonderDog, you would use the
    SET command to define the variable, as shown below.


    ```

    SET gamename=WonderDog

    ```


    Note that there are no blank spaces between either the variable name and the equals
    sign between the equals sign and the assigned value. If a blank space were added
    before the equals sign, the Windows shell would interpret to mean that the blank
    space was part of the variable''s name. If a blank space was inserted between
    the equals sign and the assigned value, the Windows shell would interpret the
    blank space as part of the assigned text.


    To change the value assigned to the variable, you would again use the SET command,
    as demonstrated below.


    ```

    SET gamename=BuzzTheDog

    ```


    When used this way, the SET command simply replaces the value assigned to the
    specified variable. You can also use the SET command to delete a variable by setting
    the variable equal to nothing, as demonstrated below.


    ```

    SET gamename=

    ```


    # Naming Variables


    While the Windows shell is very flexible when it comes to working with variables,
    there are still a few rules that you must follow to avoid errors. These rules
    are outlined below.


    +   * If you include quotation marks as part of the variable''s assigned value,
    the Windows shell will treat the quotation marks as part of the value assignment.

    * You may not include reserved characters in a variable''s value assignment unless
    you enclose them within double quotation marks.

    * Blank spaces included before the equals sign are considered part of the variable''s
    name.

    * Blank spaces included after the equals sign are considered part of the variable''s
    assigned value.'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'In addition to these rules, I have some additional friendly advice that you
    should keep in mind when working with variables.


    +   - Make variable names as descriptive of their contents possible.

    - While there is no practical limit to the length of a variable name, I recommend
    keeping them less than 20 characters to help make them easy to read and manage.

    - Variable names are not case-sensitive. However, I recommend that you be consistent
    in whatever naming convention you choose to adopt. In other words, don''t mix
    things up.


    # Determining the Limits of Variable Access


    By default, access to variables is global throughout a script, meaning that variables
    can be accessed from any location within the script. However, if you wish to exercise
    strict control over variables in your scripts, you can localize accessibility
    to variables by restricting the location within a script where they can be referenced.
    To perform this trick you''ll need to learn how to work with the SETLOCAL and
    ENDLOCAL commands.


    You use the SETLOCAL and ENDLOCAL commands together to define a starting and ending
    location within a script where a variable and its value can be referenced. For
    example, consider the following script:


    ```

    SETLOCAL

    SET x = %x%

    CHO x = %x%

    ENDLOCAL

    ECHO x = %x%

    ```


    This script begins by using the SETLOCAL command to localize the value of a variable
    called x. It assigns a value of true to x and displays its value. The ENDLOCAL
    command is then used to terminate the scope of the x variable, effectively deleting
    it. Therefore, when the script attempts to reference it a second time, no value
    is displayed. The following output shows what you will see if you create and run
    this script.


    ```

    x = true

    x =

    ```


    Chapter 4 Storing and Retrieving Information in Variables'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'The SETLOCAL and ENDLOCAL commands can also be used to localize changes made
    to an existing variable, with the result that any changes made to the variable
    within the localized scope are discarded when the scope terminates. For example,
    consider the following example.


    ```

    @ECHO off

    ```


    ```

    SET x=true

    ECHO x = %x%

    ```


    ```

    SETLOCAL

    SET x =false

    ECHO x = %x%

    ```


    ```

    ENDLOCAL

    ECHO x = %x%

    ```


    In this example, the script begins by defining a variable x and assigning it a
    value of true. It displays this value. Next, the SETLOCAL and ENDLOCAL commands
    set up a temporary localized scope in which the value of x is changed to false
    and then displayed. However, as soon as the localized scope terminates, the previous
    value assigned to x is restored. Thus when the value of x is displayed again,
    its value is equal to true, as shown below.


    +   - x = true

    - x = false

    - x = true


    > TRICK THE SETLOCAL and ENDLOCAL commands are often used in combination with
    subroutines and procedures, which are covered later in Chapter 7, "Creating Procedures
    and Subroutines."


    # Working with Mathematical Variables


    As mentioned earlier, when the /A switch is used with the SET command, the Windows
    shell knows that it needs to treat any data assigned to the defined variable as
    numeric. By labeling a value as numeric, you enable the ability to manipulate
    it using mathematical expressions. The Windows shell can manipulate numbers'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'within the range of -2,147,483,648 to 2,147,483,647. Any attempt to work with
    a number smaller or larger than this range will result in an error. However, I
    doubt that this limitation will ever affect your scripts.


    The following statement demonstrates how to assign a numeric value to a variable.


    ```

    SET /Ax = 1

    ```


    In this example, x has been set to 1. You can also use mathematical expressions
    to assign a numeric value to a variable, as demonstrated below.


    ```

    SET /Ax = x + 2

    ```


    In addition, you can use values stored in other numeric variables in building
    expressions, as demonstrated below.


    ```

    SET /A y = 2

    SET /Az = x + y + 3

    ECHO z

    ```


    If you run this example, you would see that the value of z is 6. In each of these
    examples, the = (equals sign) is used to assign numeric values to variables. Windows
    shell also provides a number of other arithmetic operators, as listed in Table
    4.3, that you can use to assign values to numeric variables.


    | Operator | Purpose |

    | --- | --- |

    | += | Adds two values together and assigns the result |

    | -= | Subracts one value from another and assigns the result |

    | *= | Multiplies two values and assigns the result |

    | /= | divides one value into another and assigns the result |

    | %= | Assigns the remaining portion of a division operation (e.g., the modulus)
    |


    For example, the following statement sets the value of x equal to the current
    value of x plus 1.


    ```

    SET /A x += 1

    ```'
