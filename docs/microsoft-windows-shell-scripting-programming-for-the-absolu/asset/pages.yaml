  md: '# Introducing Windows Shell Scripting


    Windows shell scripting is one of two scripting solutions provided by Microsoft
    for developing small programs, or scripts, that automate a variety of tasks on
    Windows computers. (The other scripting solution is known as the Microsoft Script
    Host, or WSH.) Scripts provide a means of developing small utility programs that
    automate mundane or complex tasks with a minimal investment of time and effort.


    Windows shell scripting provides a way to perform tasks on Windows computers without
    requiring you to wade though the array of windows and dialog boxes that make up
    the Windows graphical user interface, or GUI. Scripts help to eliminate mistakes
    or other errors that often occur when you perform a task manually. Therefore,
    scripts not only faster but more accurately well, especially when you''re working
    on tasks comprised of a large number of steps. In this chapter, I''ll introduce
    you to Windows shell scripting and provide you with the background information
    you''ll need for the rest of the book. In addition, I''ll show you how to develop
    your first Windows shell script game.


    Specifically, you will learn


    +   * The capabilities of Windows shell scripts

    * The history of Windows shell scripting

    * The differences between Windows shell scripts and the Windows Script Host

    * How to configure the script development and testing environment'
  merge: -1
