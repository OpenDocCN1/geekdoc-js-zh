    the output of the TYPE command and use it for the SORT command, as demonstrated
    below.


    ```

    c:\scripts>TYPE TestFile.txt | SORT

    ```


    +   Apple

    Blue Berry

    Grape

    Orange

    Strawberry


    The SORT command sorts data as input and sends the result to standard output.


    # Generating Reports


    The redirection operator enables you to send command output to a destination other
    than standard output. It provides an easy way to generate report and log files.
    In addition, the >> operators provide the ability to append data to the end of
    existing report and log files. Look at an example of these two redirection operators
    in action.


