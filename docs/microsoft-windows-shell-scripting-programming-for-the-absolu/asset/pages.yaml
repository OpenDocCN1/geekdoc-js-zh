    # Summary


    In this chapter, you learned how to reorganize your Windows shell scripts using
    subroutines and procedures. This included learning how to create both internal
    and external procedures as well as to localize variables within procedures and
    how to tunnel out from procedures. You were also introduced to flowcharting as
    a tool for assisting your development of Windows scripts. Finally, you learned
    how to create the Rock, Paper, Scissors game and to organize the entire game using
    procedures.


    # EXERISES


    +   1. Modify the Rock, Paper, Scissors game''s welcome screen so it includes
