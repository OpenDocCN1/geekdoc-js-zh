  md: 'Likewise, the following example sets x equal to x plus 5.


    SET /A x += 5


    In addition to the assignment operators listed in Table 4.3, you may use any of
    the arithmetic operators shown in Table 4.4 when manipulating the contents of
    numeric variables.


    # Table 4.4 Arithmetic Operators


    | Operator | Purpose |n + | Adds numeric values together | - | Subtracts one value
    from another | * | Multiplies two values together | / | Divides one value into
    another | % | Determines the quotient when dividing two numbers (also referred
    to as the modulus) |


    For example, the following statements define a variable called x, assign it initial
    value of 2 and then multiplies the result by 5 before subtracting 3.


    SET /A x = 2


    SET /A x = x * 5 - 3


    The end result is that x is equal to 7.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_124_0.png)


    I don''t know if you have noticed yet or not, but when you use the /A switch with
    the SET command, you can add blank spaces before and after the arithmetic operator
    and the Windows shell automatically ignores them. This allows you to make your
    scripts more readable.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_124_1.png)


    The Windows follows a strict set of rules whenever it performs a mathematical
    operation. First, it resolves quotient values (i.e., the modulus). Then it performs
    multiplication and division from left to right. Finally, it does any remaining
    addition and subtraction, again working from left to right.'
