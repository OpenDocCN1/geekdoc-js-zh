- img_proc: true
  md: 'By dispersing ECHO statements throughout your scripts in this manner, you can
    trace the execution of each component of your scripts during testing. In addition
    to tracing script execution, you''ll also want to keep track of your variables
    to make sure they are being assigned data properly. Again, you can do this by
    using the ECHO statement to display variable values, as demonstrated below.


    ```

    ECHO Variable: TotalCount = %TotalCount%

    ```


    By adding ECHO statements after anything that sets or modifies variables, you
    can track their variables during the execution of your scripts. Once you have
    your scripts fully tested and working as you want them to work, you can either
    delete these extra ECHO statements or better, keep them out using the REM statement,
    as demonstrated below.


    ```

    REM ECHO Variable: TotalCount = %TotalCount%

    ```


    By commenting out these statements, you can keep them around you you need to use
    them again later to debug the script. I have an even better suggestion that you
    can use to make this tracing and debugging technique even useful. It involves
    a little more work up front, but if you are working on a critical script, it is
    probably worth the effort.


    You''ll still need to embed statements throughout your scripts that display information
    about which sections are currently executing and what the current values assigned
    to variables are. What changes is the manner in which you can enable and disable
    debugging statements. Instead of writing a debugging statement as


    ```

    ECHO Variable: TotalCount = %TotalCount%

    ```


    you would write it as


    ```

    %trace Variable: TotalCount = %TotalCount%

    ```


    Notice that a variable called trace has been substituted for the ECHO or REM commands.
    When writing in this manner, you provide the ability to toggle statements between
    ECHO and REM by placing a statement similar to the following at the beginning
    of your script:


    ```

    IF / "$1"=="Debug" (SET trace=ECHO) ELSE (SET trace=REM)

    ```


    As you can see, this statement sets the value of trace equal to ECHO when the
    script is passed an argument of Debug. Otherwise, it sets the value of trace to
    REM. The net effect is that if you run the script by simply entering its name
    at the command prompt and pressing Enter, the value of trace is equal to REM and
    all of the extra statements that you embedded in your script are turned into comments.
    This will be the default execution mode for the script.'
