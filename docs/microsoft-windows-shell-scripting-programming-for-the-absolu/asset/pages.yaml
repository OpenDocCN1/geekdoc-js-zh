    # Back to the Six-Million-Dollar Quiz


    The Six-Million-Dollar Quiz introduces you to a number of new tricks, including

    t application of a text-based menu on the game''s welcome screen, as well as the

    addition of Help and About screens. In addition, you''ll learn how to create a
    score

    card report that you''ll then save on the player''s hard drive.


    # Using Pseudo Code


    As your Windows scripts grow more and more complicated, you''ll find your-

    self spending more time designing them. One design technique I think you''ll find

    particularly handy is pseudo code.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_196_1.png)


    Pseudo code is a rough, English-like outline of the logic used in all or part
    of the script.


    Using pseudo code, you can outline a high-level design for particularly compli-

    cated of your script by simply writing a rough logical outline of the steps

    involved. For example, one portion of the Six-Million-Dollar Quiz involves the
    dis-

    play of a text-based menu on the game''s welcome screen. Since you have not worked

    with text-based menus before, you''ll find it helpful to outline your

    operation using pseudo code, as demonstrated.


    +   - Display a Welcome menu and set it up to display Play, Exit, Help, and About
    options.

    - Prompt the player to enter an option.

    - If the player enters an invalid option, clear the screen and redisplay the

    Welcome menu.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '+   • If the player presses Enter without entering an option, clear the screen
    and redisplay the Welcome menu.


    +   • If the player enters Exit, terminate the quiz’s execution.


    +   • If the player enters Help, clear the screen and display the Help screen.
    When the player is reading the Help screen, clear it and redisplay the Welcome
    menu.


    +   • If the player enters About, clear the screen and display the About screen.
    When the player is reading the About screen, clear it and redisplay the Welcome
    menu.


    +   • If the player enters Play, clear the screen and begin the game.


    With this pseudo outline describing the operation of the script’s text-based system,
    you can now work to turn this descriptive outline into code. For example, the
    first two statements listed above are the English equivalent to the following
    statements:


    ```

    ECHO [Play] [Exit] [Help] [About]

    SET /p reply=:

    ```


    As you will see soon, the rest of the steps outlined in the previous pseudo code
    can also be translated directly into code.


    # Designing the Game


    OK. Now take a few moments to outline the steps involved in the development of
    the Six-Million-Dollar Quiz. As you can see from the list that I have outlined
    below, I plan to complete the development of the game in 10 steps.


    +   1. Set up the execution environment


    +   2. Display the welcome screen and main menu


    +   3. Process menu selections


    +   4. Set up the Help screen


    +   5. Set up the About screen


    +   6. Control game play


    +   7. Start the score card report


    +   8. Grade quiz results


    +   9. Append quiz statistics


    +   10. Display game results for player review'
  merge: -1
