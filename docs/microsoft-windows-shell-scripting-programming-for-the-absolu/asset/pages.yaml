    # Creating Loops


    You''ve already seen how to create loops within Windows shell scripts using labels
    and the goto command. This type of loop provides the ability to jump from one
    point in a script to an earlier point in order to repeat the execution of previous
    steps, yet this type of loop is generally considered clunky. I will show you a
    much better way to group statements together for frequent execution in Chapter
    7, "Creating Procedures and Subroutines."


    The Windows shell provides support for a second type of loop using the FOR command.
    Loops created with the FOR loop are highly specialized. A number of variations
    of the FOR loop exist, each of which is designed to process a'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'different type of data. Specifically, you can create FOR loops that can iteratively
    process any of the following types of resources:


    +   * String contents

    * Command output

    * Collections of files

    * Collections of folders

    * Text file contents


    In addition, you can set up loops that execute a specified number of times. For
    example, you could set up a loop that executes exactly 10 times.


    While varying slightly, loops created by the FOR command are based on the following
    syntax:


    ```

    FOR /%%variable IN (collection) DO command

    ```


    The switch parameter is used to specify the types of data that the loop will process.
    A list of the switches supported by the FOR command is provided in Table 6.1.


    | Table 6.1 Switches Supported By the FOR Command |

    | Switch | Description |

    | /l | Sets up the loop to process a range of values |

    | /f | Sets up the loop to process all elements stored within a string |

    | /d | Sets up the loop to process all files stored within a specified folder
    |

    | /r | Sets up the loop to process all subfolders stored within a specified parent
    folder |


    The %%variable is a special type of variable referred to as an iterator. The iterator
    must be a single letter between A and Z. The FOR command automatically increments
    the value assigned to the iterator each time the loop repeats itself. The iterator
    variable is local in scope within the FOR loop, meaning that it cannot be referenced
    before or after the loop is executed. Collection specifies one of the following
    types of resources:


    +   * A text string

    * A list of files

    * A list of folders

    * A range'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Command specifies a command that will be executed each time the loop executes.


    > TRAP The FOR loops iterator is case-sensitive. This means that I and i are not
    considered the same. Be careful and make sure you are consistent when referencing
    the FOR loops iterator variable that you don''t accidentally mix up the case.


    Each of the variations of the FOR command mentioned above are outlined in detail
    in the sections that follow.


    # Looping Through String Contents


    One of the uses of the FOR command is to set up a loop that can iterate through
    and parse the contents of a string. For example, you might want to develop a Windows-shell
    script that deletes a list of files passed to it as arguments. Since % represents
    a list of all the arguments passed to the script, you can create a loop that iterates
    its way through each argument. To set up this type of loop, use the following-syntax:


    ```

    FOR /F ["options"] %%variable IN ("string") DO command

    ```


    You can further refine the execution of this type of loop by specifying any of
    the options listed in Table 6.2.


    TABLE 6.2 FOR COMMAND PARSING OPTIONS

    | Option | Function |

    |---|---|n| DELIMS=x | Changes the characters used to delimit data from the default
    of blank space to the specified collection of characters |

    | EOL=c | Specifies an end-of-line character |

    | SKIP=n | Sets a specific number of lines to be skipped at the top of the file
    |

    | TOKENS=a,b,a-c | Sets the tokens to be used when processing data |


    > DEFINITION A token represents a piece of data in a text string.'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'This particular form of the FOR loop parses the contents of the specified string
    and assigns them to tokens. By specifying the TOK option when setting up the FOR
    loop, you can specify which tokens you want your scripts to process.


    You can work with tokens in two ways. The first way is to specify specific tokens
    in the form of a,b, where a and b represent the first and second data elements
    in the string. The second way is to specify a range of tokens in the form of a-c.
    Here, the first three tokens in a string are specified.


    Below are a couple of examples to help you understand how to work with this version
    of the FOR loop. In the first example, I''ve written a script that uses a FOR
    loop to parse and display the first five arguments passed to the script.


    ```

    @ECHO off


    FOR /F DELIMS=, TOKENS=1-5 %%a IN (**) DO (

    ECHO %%a

    ECHO %%b

    ECHO %%c

    ECHO %%d

    ECHO %%e

    )

    ```


    By specifying DELIMS= I have set up the FOR loop to parse arguments passed to
    the script and separated by the character . By specifying TOKENS=1-5, I have configured
    the FOR loop so that it processes only the first five arguments passed to the
    script, regardless of how many are actually passed. When executed, this script
    displays a list of the first five arguments passed to the script. However, you
    could easily modify the functionality of this script by replacing the ECHO command
    with a different command. For example, you could change the ECHO command to DEL
    in order to delete a list of files passed to the script.


    Before moving on to the next type of FOR loop, look at one more example. In this
    example, shown below, a Windows shell script has been set up to process the contents
    of a string variable. This variable has been assigned a value comprised of names,
    each of which is separated, or delineated, by a blank space.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '@ECHO off


    SET UserList=Alexander William Molly Mary Jerry


    ```

    FOR /F "TOKENS=1-3" %%a IN (%%%UserList%%) DO (

    ECHO %%a

    ECHO %%b

    ECHO %%c

    ```


    Since the default delineator for the FOR command is a blank space, I did not have
    to specify the DELIMS option this time. In addition, since I only wanted to parse
    the first three names stored in the string, I SET the TOKENS option equal to 1-3.


    # Looping Through Command Output


    Another variation of the FOR loop enables scripts to loop through all the output
    produced by a command. This way, instead of just assuming that a command worked
    successfully because it did not return a non-zero exit code, you can directly
    integrate commands. By iterating through command output, not only can you verify
    that the command did what you wanted to, but you can also use the command output
    as input for script processing.


    To use this form of the FOR command, you must use the following syntax:

    FOR /F ["*"] %%variable (''command'') DO command


    The options parameter represents different parsing capabilities for the FOR command,
    as listed in Table 6.2. Also, take note of the fact that the command output is
    to be parsed must be enclosed both a a pair of matching single quotation marks
    as well as a pair of parentheses.


    Now look at this form of the FOR statement in action. In this example, I''ve created
    a Windows shell script that executes the SET command. When executed without any
    additional arguments, the SET command displays a list of environment variables,
    which can be somewhat hard to read, as demonstrated below.


    ```

    C:\>set

    ALLUSERSPROFILE=C:\Documents and Settings\All Users

    ```'
