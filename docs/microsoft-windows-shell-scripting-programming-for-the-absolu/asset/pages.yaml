  md: '# # Assembling Your First Windows Shell Script


    Now let''s examine the steps involved in creating, saving, and executing a Windows
    shell script. The best way to learn how to do this is by working though an example.
    The example that I''ll show you will only be one line long; however, regardless
    of the size of your scripts, the same process is used each time to create, save,
    and run them.


    First, by opening your editor. For example, to use Notepad that you would click
    on Start, All Programs, Accessories, and then Notepad. Notepad opens and displays
    an empty file. Type the following line into Notepad (as shown in Figure 1.8).


    Echo Hello World!


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_35_0.png)


    Using Notepad to create your first Windows shell script.


    # IN THE REAL WORLD


    Unlike many programming languages, Windows shell scripting does not require you
    to first learn how to use a complicated GUI-based development environment to write
    scripts. Instead, you can create Windows shell scripts using any editor that can
    save your files as plain text. However, there are advantages to using GUI-based
    script editors. These advantages include


    +   * Statement color-coding of Windows shell script keywords to make code readable

    * Line numbering to make locating a specific line easier

    * Advanced find and replace capabilities

    * Automatic indenting and outdenting of statements to make code more readable

    * The ability to manage multiple scripts as a single project


    Fortunately, a number of third-party text and script editors include these advanced
    features. I have provided two excellent editors on this book’s companion CD-ROM.
    To learn more about them, see Appendix B, “What''s on the CD-ROM?”'
