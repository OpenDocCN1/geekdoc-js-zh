- img_proc: true
  md: 'The first statement turns off the automatic display of script statements, and
    the next three statements set the Windows command console''s color scheme to yellow
    on black, post the name of the game in the console''s title bar, and clear the
    console''s display.


    # Constructing the Script''s Main Processing Section


    The script''s Main Processing Section, shown below, begins with a label called
    :StartOver. This label will be used later in the script to allow players to restart
    the game. Next, a series of four variables are defined. Player is used when determining
    which player''s turn it is. By default, Player X always goes first. Winner is
    used to determine when one of the players has no game. Initially, it is equal
    to None. NoMooves is used to keep count of the total number of moves made by both
    players. When the total number of moves equals to 9, and no player has managed
    to line up three Xs or Os, the game board is filled and the game is declared a
    tie.


    ```

    :StartOver


    SET Player=X

    SET Winner=None

    SET /A NoMooves = 0


    CALL :InitializeBlanks


    CALL :Welcome


    IF /I %%%% -- ** CLS & GOTO :StartOver

    IF /I %%%% -- Play CLS & CALL :Play

    IF /I %%%% -- Quit CLS & GOTO :EOF

    IF /I %%%% -- Help CLS & CALL :Help

    IF /I %%%% -- About CLS & CALL :About


    GOTO :StartOver


    GOTO :EOF

    ```


    Next, the :InitializeBlanks procedure is called. This procedure sets variables
    located in each square of the game board equal to a blank space. This way, when
    the game board'
