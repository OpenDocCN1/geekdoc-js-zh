  md: '# Back to the Knock Knock Joke


    Now let''s turn our attention back to the Enter main project, the Knock Knock
    joke. Through the development of this script, you will learn how to create a script
    that interacts with the player by displaying messages, collecting player responses,
    and displaying additional information based on the player''s responses. This basic
    interaction forms the basis of All Windows shell script games.


    # Designing the Game


    The first step in computer game development is to outline the game''s design.
    The Knock Knock joke game is relatively simple, so a lot of up-front design is
    not required. Just like a regular Knock Knock joke, the game will begin by displaying
    the message Knock Knock! in the Windows console. It will then wait for the player
    to respond by typing “Who is there?” The player must respond exactly as shown,
    using the quotation marks and question mark character. Once the player types the
    required response and presses the Enter key, the game will display the message
    Orange! and wait for the player to type “Orange who?” Once the player types in
    the second response correctly, the game will display its punch line and terminate,
    redesigning the Windows command prompt.


    This project will be completed in six steps, as outlined below.


    +   1. Create an initial blank script file and name it KnockKnock.bat

    2. Configure the Windows command console''s title bar and color scheme

    3. Format the display with blank lines

    4. Collect player responses

    5. Confirm that the player provided valid input

    6. Display the joke''s final punch line


    # The Script Development Process


    The first step in creating the Knock Knock game is to create an empty file KnockKnock.bat
    and save it in the C:\Scripts folder. The following procedure outlines the steps
    involved in performing this task using the Windows Notepad editor.


    +   1. Click on Start, All Programs, Accessories, and then Notepad. The Notepad
    editor appears.

    2. Click on File and then Save. The Save As dialog appears. Type KnockKnock.bat
    into the File name field and specify c:\scripts as the location where the file
    should be saved.

    3. Click on Save.'
