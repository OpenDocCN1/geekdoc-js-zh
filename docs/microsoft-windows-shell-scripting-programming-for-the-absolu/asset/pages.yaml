- img_proc: true
  md: '# Creating Loops to process Collections of Data


    In order to create computer games or really powerful administrative scripts, you
    need a way of repeating a series of steps in order to effectively process collections
    of data. For example, in the Guess a Number game that you created in Chapter 5,
    "Applying Conditional Logic," you needed to set up the game up so that it would
    repeatedly give the user chances to guess the mystery number. This kind of iterative
    or forative processing is known as looping.


    The Windows shell provides the FOR command as your tool for creating loops. Like
    the IF command, the FOR command comes in many different flavors, allowing you
    to create Windows shell scripts that loop through collections of files and folders,
    command output, and text strings, and also to repeatedly execute one or more commands.
    By creating scripts that iteratively loop through collections of data, you can
    process enormous amounts of data and perform tasks in seconds that would otherwise
    take you hours to perform manually, and you can do so without the mistakes that
    humans often make when performing tedious work.


    Specifically, you will learn


    +   * How to process collections of files and folders

    * How to execute a collection of statements a predetermined number of times

    * How to loop through and process the output produced by the execution of your
    script commands

    * How to process the contents of files'
  merge: -1
  pgno: 177
