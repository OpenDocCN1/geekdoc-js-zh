- img_proc: true
  md: "# Creating the Main Processing Section\n\nThe Main Processing Section, shown\
    \ below, looks a little different than the Main Processing Section of other scripts\
    \ that you have seen in this book. This Main Processing Section is designed to\
    \ control the game's overall execution by making calls to the appropriate procedures.\
    \ In addition to procedure calls, the Main Processing Section includes a label\
    \ called :startAgain and an IF...Else statement. By placing the label at the beginning\
    \ of the Main Processing Section, the IF...Else statement is able to initiate\
    \ a replay of the game if the player elects to play another round. Otherwise,\
    \ :DisplayStatus procedure is called and the script terminates its execution.\n\
    \n```\nCALL :DisplayMenu\n\n:StartAgain\n\nCALL :CollectChoice\n\nCALL :GetComputerChoice\n\
    \nCALL :CompareChoices\n\nCALL :CheckForInvalid\n\nCALL :DisplayResults\n\nIF\
    \ /I \"%response:-,.1%% EQU \"y\" (\n    GOTO :StartAgain\n) ELSE (\n    CALL\
    \ :DisplayStats\n    GOTO :EOF\n)\n\nGOTO :EOF\n```"
