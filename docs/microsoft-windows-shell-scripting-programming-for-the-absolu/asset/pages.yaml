    # Creating Error Logs


    By default, Windows shell scripts send error messages and output to the same location
    (e.g., the Windows command console). However, if you wish, you can redirect any
    errors to occur somewhere else. For example, you might want to send all errors
    to a log file that you can monitor to see what''s going on your scripts.


    For example, let''s say that you created an empty file Errors.log, located in
    C:\Scripts in order to have a centralized place to record script error messages
    as you developed and tested them. Once, you can write error output from any of
    your scripts to this file using the > redirection output, as demonstrated below.


    ```

    TYPE C:\Reports\Report.txt 2> C:\Scripts\Errors.log

    ```


    In this example, the TYPE command is used to display the contents of a file called
    Report.txt located in C:\Reports. If Report.txt exists, then its contents are
    displayed. If the Report.txt file does not exist, the following error will occur
    and be written to the C:\Scripts\Errors.log file.


    The system cannot find the file specified.


    In addition, since the error above was redirected to the log file, it would not
    have been displayed in the Windows command console when the script executed.'
