  md: '# Performing Different Kinds of Comparisons


    Up to this point in this chapter, you have seen the use of the -- characters repeatedly
    as a mean of comparing two conditions to determine whether they are equal. The
    Windows shell supports a number of other comparison operators, which you can use
    to perform even more complex comparisons. These comparison operators are listed
    in Table 5.2.


    TABLE 5.2 COMPARISON OPERATORS

    | Operator | Description |

    | --- | --- |

    | -- | Determines whether two values are equal |

    | EQU | Determines whether two values are equal |

    | LSS | Determines whether one value is less than another |

    | GTR | Determines whether one value is greater than another |

    | LEQ | Determines whether one value is less than or equal to another |

    | GEO | Determines whether one value is greater than or equal to another |

    | NEQ | Determines if one value is not equal to another |


    For example, you can compare the value of a variable as shown below.


    ```

    IF NOT "%05%%" == "Windows_NT" GOTO :EOF

    ```


    Alternatively, you could rewrite this same statement using the EQU operator, as
    shown below.


    ```

    IF "%05%%" EQU "Windows_NT" GOTO :EOF

    ```


    The operators listed in Table 5.2 enable you to make numerous types of numeric
    comparisons, as demonstrated by the following example:


    ```

    SET /a Counter = 3

    ```


    ```

    IF %Counter% LEQ 5 ECHO Terminating script execution.

    ```


    In this example, the value of a variable is arbitrarily set to 3 to facilitate
    the comparison operation that follows. The next statement checks to see if the
    value of Counter is less than or equal to 5. Since this is the case, the statement
    displays a message in the Windows command console.'
