    # How Windows Locates Commands


    To work efficiently with the Windows shell, it helps to understand how it locates
    the commands that you want to execute it. The following series of steps outlines'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'the process that the Windows shell goes through in order to try to execute
    the commands you specify.


    +   1. If you supply the command''s complete path name, the Windows shell looks
    in the specified folder and executes the command. If the command is not found,
    an error is generated.


    +   2. If you specify a command without its path, the Windows shell first checks
    to see if the command is one of its internal commands and executes the command
    if it is.


    +   3. Next, the Windows shell looks for the command in the current working directory
    and executes the command if it is found.


    +   4. If the command is not found at this point, the Windows shell begins looking
    through each of the folders in the path variable (in the order in they are listed).
    If a matching command is found, it is executed and the search stops. If the command
    is not found, an error is generated.


    # Using the PATH Command


    Windows stores information about the location of commands in a variable called
    path. This variable stores a list of folders that the Windows shell will search
    when it needs to locate an external Windows command. You can view and modify the
    contents of this variable using the PATH command, which has the following syntax.


    ```

    PATH [[drive:]:path{...}] [%path%]]

    ```


    To view the list of folders stored in the path variable, open the Windows command
    prompt and type PATH. The output displayed by the command will resemble the following.


    ```

    C:\

    PATH=C:\WINNT\system32;C:\WINNT\system32\WBMEM

    ```


    ```

    C:\

    ```


    The output displayed in this example shows that the Windows shell will search
    three folders when looking for a command to execute. The folders are searched
    in the order presented, from left to right. Therefore C:\Winnnt\system32 will
    be searched first and if the command is not found, C:\Winnnt will be searched
    second followed by C:\Winnnt\system32\wbem.'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'If you want, you can add additional folders to the search list stored in the
    path variable. For example, you might want to add the folder where you store all
    your Windows shell scripts to the path variable so that the Windows shell can
    always find them.


    The following example demonstrates how to add a folder C:\Scripts to the beginning
    of the list of folders stored in the path variable.


    ```

    PATH C:\scripts;%path%

    ```


    As you can see


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_59_0.png)


    Placing a folder at the beginning of the path variable search ensures that it
    will be the first folder checked. This way, if you give a script name that happens
    to match a Windows command, your script will be executed in place of the Windows
    command. Remember, the Windows shell looking for commands as soon as it finds
    the first match.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_59_1.png)


    I have not yet covered the use of variables in this book, but they are such fundamental
    part of scripting that it is almost impossible to do anything without using them.
    For now, just note that to reference them within a script you must enclose the
    variable''s name inside a pair of percentage characters. Keep reading along and
    I will explain how to work with variables in detail in Chapter 4, "Storing and
    Retrieving Variables."


    You can easily add a folder to the search list, as shown below.


    ```

    PATH C:\scripts;%path%

    ```


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_59_2.png)


    Don''t forget to add the %path% variable to either the beginning or the end of
    the PATH command when modifying your search path. Otherwise, the list of folders
    that made the original search path will be deleted and replaced by your new addition,
    which is not what you want to do.


    Any changes that you make to the path variable by modifying it from a Windows
    shell script are just temporary. In other words, the changes you make are lost
    when you close the Windows command console and terminate your Windows session.'
