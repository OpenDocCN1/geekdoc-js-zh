  md: 'IF %1 LSS %MysteryNumber% GOTO :GuessAgain

    IF %1 GTR %MysteryNumber% GOTO :GuessAgain


    In this example, the script set a variable called MysteryNumber equal to a randomly
    selected number between 0 and 32,767. It then checks the value of an argument
    passed to it to see if the value of the argument is equal to the value assigned
    to the MysteryNumber variable. If the two values are equal, nothing happens. But
    if they are not equal, the IF statements nested within the first IF statement
    begin to execute in order to determine what the script should do. If the nested
    IF statements were moved from inside the first IF statement and placed outside
    of the statement, as shown below, the script would still work. However, the previously
    embedded IF statements would be needlessly executed in the event that the argument
    passed to the script was equal to the randomly generated number.


    ```

    @ECHO off

    ```


    ```

    SET /A MysteryNumber = %random%

    ```


    ```

    REM Check to see if the correct number was guessed

    IF NOT "%1" == "%MysteryNumber%"

    ECHO match did not occur!


    REM If the correct number was not guessed, check to make sure it is in bounds

    IF %1 LSS 0 ECHO Your guess is out of bounds! & GOTO :HELP

    IF %1 GTR 32767 ECHO Your guess is out of bounds! & GOTO :HELP

    ```


    ```

