    # Mastering Command Redirection


    So far, all the examples you''ve seen in this book have demonstrated that script
    output is, by default, written to the Windows command console. In addition, all
    input has come directly from the computer''s keyboard. However, the Windows shell
    let''s specify different sources of input, such as


    +   * The keyboard

    * A file

    * The output generated by another command'
