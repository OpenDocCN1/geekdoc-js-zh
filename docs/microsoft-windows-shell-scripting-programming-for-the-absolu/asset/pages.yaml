  md: 'greeting message will be displayed each time. I''ll show you how to complete
    the

    Unpredictable Command Prompt script in nine steps, as outlined below.


    +   1. Get a random number


    +   2. Clear the Windows command console


    +   3. Post a message in the Windows command console''s title bar


    +   4. Modify foreground and background colors


    +   5.reet the user


    +   6. Modify the appearance of the command prompt


    +   7. Terminate the script


    +   8. Build the second scenario


    +   9. Build the third scenario


    As in the previous chapter, I will use a couple of programming techniques in this

    script that I have not yet covered in this book. Specifically, I will use environment

    variables and the If statement to create a conditional logic. It is hard to write
    a

    ful script without using either of these resources. However, I wanted to provide
    you

    with some foundation concepts regarding Windows shell scripting and the Windows

    shell before I delve into specific Windows shell scripting. For now, just follow
    along

    with my high-level explanations of the portions of the script that use these program-

    iques as you go through the steps in creating the script.


    # Selecting a Random Number


    The first step in creating the Unpredictable Command Prompt script is to create
    a

    new script and add the following statements:


    ```

    @ECHO off


    SET TestVariable=%random%

    ```


    The first statement prevents the Windows shell from displaying script statements

    as it processes them. This will make the script''s output less cluttered and present

    a cleaner and more polished output. The second statement uses the SET

    command to assign a random number to a variable called TestVariable. The random

    variable is generated automatically by the operating system on Windows 2000, XP,

    and 2003 computers. Whenever it is referenced, it returns a random number-

    tween 1 and 32,767.


    The script will reference the random value assigned to this variable to determine

    which of three possible actions to take. Specifically, it will take one set of
    actions'
  merge: -1
  pgno: 71
