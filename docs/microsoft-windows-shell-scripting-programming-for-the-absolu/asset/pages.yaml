    If an error occurs when performing the copy operation, the script''s :EXIT procedure
    is executed. This procedure uses the EXIT command and passes back an exit code
    of 4 to the calling or parent script.


    @ECHO off


    ```

    COPY *.bak C:\Temp > C:\Temp\ScriptLog.log 2>&1


    IF ERRORLEVEL 1 GOTO :EXIT


    GOTO :EOF


    :EXIT

    EXIT /B 4

    ```


    The following statements make up the calling, parent, script. As you can see,
    it calls the external procedures (e.g., TestScript.bat), waits for it to finish
    executing, and then checks the exit code returned by the external procedure to
    see if it is equal 4.


    @ECHO off


    ```

    CALL TestScript.bat


    IF ERRORLEVEL 4 (

    ECHO No backup files were found

    )

    ```


    # Other Things to Look Out For


    Finally, the sections that will follow review some of the other issues and problems
    that you might run into as you begin working and more with the Windows shell and
    Windows shell scripts. In addition, I''ll provide you with suggestions for avoiding,
    fixing, or working around these issues and problems.'
