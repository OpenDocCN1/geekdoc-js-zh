    # # Back to “The Story of Buzz the Wonder Dog"


    The purpose behind “The Story of Buzz the Wonder Dog” is to provide reinforcement
    of your understanding of how to create and reference variables within Windows
    shell scripts. Using a Mad lib-style format, you will write a script that prompts
    the reader for input that the script will then use to tell the story. The trick,
    however, is that readers won’t know how their input will be used within the story.
    As you will see when you run the completed script, this can lead to surprising
    and unusual twists and turns.


    # # Designing the Game


    “The Story of Buzz the Wonder Dog” will be completed in five steps, as outlined
    below.


    +   1. Initialize the scripting environment

    2. Display the welcome screen

    3. Notify the reader that their help is required

    4. Prompt for reader input

    5. Display the story


    In the sections that follow, I will explain just what you need to do to complete
    the script development of each of these steps.


    # # Configuring the Windows Command Console


    As with previous Windows shell script projects, this one begins by disabling the
    display of statements within the scripts at execution time, as shown below. In
    addition, the foreground text color is modified to display as yellow. Next, the
    screen is cleared and the title of the story is posted in the Windows command
    console''s title bar.


    ```

    @ECHO off

    ```


    ```

    CLS


    TITLE = THE STORY OF BUZZ THE WONDER DOG

    ```


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_127_0.png)'
