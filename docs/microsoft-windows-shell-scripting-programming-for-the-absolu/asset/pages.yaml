  md: '# # Letter from the Series Editor


    At some point, you''ve probably begun to want more control of your computer. You
    may want to make programs act a little bit differently than the default behavior,
    automate tedious tasks, or perform certain things automatically. Ultimately, things
    come down to programming. The programming world can be very intimidating, with
    all the integrated environments, complex languages, and dizzying variety of resources.
    Programming looks hard, and, frankly, it looks boring.


    In this book, Jerry Lee Ford will show you how to control your computer in amazing
    ways. You''ll learn relatively easy tricks that will profoundly improve the way
    you work with your computer, and you''ll learn the basics of the programming art
    along the way. Windows shell scripting is not the most complex programming environment,
    and that''s a major part of its charm. This reasonably clean language is ideal
    for beginners precisely because it is focused.


    While shell scripting is extremely useful, that doesn''t mean learning about it
    has to be dry and boring. Like all the books in this series, this book teaches
    through simple game programming. Nobody''s going to use Windows shell scripting
    to write the next immersive 3-D action game, but games can be an interesting way
    to learn the process of writing more traditional programs. Don''t worry, there
    will be lots of practical examples as you go through this book.


    If you''re to programming, you won''t find a better place to start than this book.
    If you''re already an experienced programmer, you''ll be amazed at how you can
    use the skills in this book to leverage your abilities. Regardless, you''ll learn
    a lot and have a good time doing it.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_16_0.png)


    For the Absolute Beginner Series Editor'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction


    Windows shell scripting is a built-in scripting language found on modern Windows
    operating systems. It provides the ability to create and run small programs or
    Windows script files made up of Windows shell script statements and Windows commands.
    Windows shell scripts are created as plain text files that are saved with .bat
    or .cmd file extensions and run from the Windows command prompt.


    Windows shell scripts are often small files that can be created and tested within
    minutes. In fact, many good Windows shell scripts are less than 10 or 15 lines
    long. This makes it a perfect language for quickly automating Windows tasks. This
    also makes Windows shell scripting a great first language to learn.


    Unlike modern programming languages, Windows shell scripting is not object oriented.
    In addition, it does not require you to learn how to operate a complex development
    environment. However, Windows shell scripting does have a complete collection
    of statements—the elements that make up its programming language. This allows
    first-time programmers to focus on learning the basics of program design without
    being burdened with the added requirements imposed by many other programming languages.


    Windows shell scripts also provide a way to automate complex tasks, especially
    those prone to human error. Once created, Windows scripts can be shared with other
    people, allowing you to distribute and share your work. Using Windows shell scripts,
    you can access and manipulate Windows resources such as the Windows file system
    and disk and printer resources, and you can even automate the execution of network
    tasks. In addition, as this book will demonstrate, you can create Windows shell
    scripts that automate and control the execution of all kinds of things. For example,
    this book will show you how to create Windows shell scripts


    +   - Play computer games like Rock, Paper, Scissors and Tic-Tac-Toe.

    - Copy and move files and folders.

    - Establish connections to network resources such as network disk drives and folders.

    - Create text reports and log files.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '+   * Execute Windows utilities such as the Windows Disk Defragmenter.

    * Create user accounts and administer group account membership.

    * Control third-party applications such as WinZip.


    # # Why Windows Shell Scripting?


    Windows scripting is a great language for developing small scripts that automatically
    commonly performed tasks. At the same time, you can use it to create incredibly
    complex scripts. However, in most cases you will find most Windows shells are
    not very large. Often shell scripts are only a fraction of the size of programs
    written in higher-level languages such as Visual Basic and C++. This reduces complexity
    and results in shorter development time. It also makes Windows shell scripting
    a great tool for rapid development, allowing you to quickly create and test scripts
    and move on to your work.


    Windows scripting makes an excellent first programming language. As far as programming
    languages goes, it is straightforward and easy to learn. Yet, using Windows shell
    scripting you can learn the most complex programming concepts. All that you need
    to begin creating Windows shell scripts is a plain text editor such as Windows
    Notepad.


    By learning Windows scripting, you will begin to build a foundation for learning
    other programming languages. Once you have mastered Windows scripting you may
    wish to tackle other scripting languages such as VBScript or JavaScript, both
    of which can be used to perform advanced shell scripting on Windows computers.
    You may also want to use Windows shell scripting as a jumping point for more advanced
    object-oriented programming languages like Visual Basic and C++. The bottom line
    is that learning to use Windows scripts will give you a foundation that will facilitate
    learning other programming languages.


    # # Who Should Read This Book?


    I have designed this book to teach you how to become a programmer using Windows
    shell scripting. A previous programming background is not required. However, you
    will need a basic understanding of computers in general and a good overall working
    knowledge of at least one operating system.


    So whether you are a first-time programmer looking for a good language to learn
    or you are looking to quickly learn a second programming language, this book can
    help you. In addition, I think you will find that this book''s games-based approach
    will help to keep things fun as you learn.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# What You Need to Begin


    To use this book effectively, you will need a number of things. First, you will
    need a Windows operating system that supports Windows shell scripting. These operat-systems
    include


    +   - Windows NT 4.0

    - Windows 2000

    - Windows XP

    - Windows 2003


    You will also need an editor that supports the creation of plain text files. As
    a starter editor, you can begin working with the Windows Notepad text editor.
    However, over time you will probably find that Notepad is rather limited, and
    you will want to use a more advanced editor that supports features like syntax
    cod-ing and advanced search-and-replace features. To help you out, I have included
    excellent editors on this book''s companion CD-ROM. To learn more about these
    editors, check out Appendix B, "What''s on the CD-ROM"


    # How This Book Is Organized


    I wrote this book based on the assumption that you would read sequentially, beginning
    to end. If this is your first programming experience or if you feel that you need
    a programming refresher, I suggest that you read the book in this manner. If you
    are a veteran programmer and intend to learn Windows shell script-ing as an additional
    language, you may want to skip around and read topics that are of the most interest
    to you.


    The first part of this book introduces you to Windows shell scripting. It provides
    an overview of Windows shell scripting and the Windows command prompt.


    The second part of this book teaches you the basics of Windows shell script devel-opers.
    It covers how to display script output and how to use comments and vari-ables.
    It also covers the shell script statements that provide the ability to apply conditional
    logic and establish loops.


    The third part of this book focuses on a variety of advanced topics. Here will
    show you how to improve the organization of your Windows shell scripts using procedures
    and subroutines. I will go over the steps involved in debugging and handling script
    errors.


    The final part of this book contains the book''s appendices. Here you will find
    a collection of real-world sample scripts, information about the materials found
    on the book''s CD-ROM, and information about places where you can go to continue
    your Windows shell scripting education.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'A detailed breakdown of the information you will find in this book is outlined
    below.


    +   - Chapter 1—Introducing Windows Shell Scripting. This chapter explains what
    Windows shell scripting is and why it is an excellent first programming language
    to learn. This chapter provides a brief history of Windows scripting as well as
    a comparison to Microsoft''s other scripting technology, the Windows Script Host,
    and explains the differences between these two scripting solutions. This chapter
    closes by teaching you how to write your first Windows script game, the Knock
    Knock joke.


    +   - Chapter 2—Interacting with the Windows Shell. This chapter provides you
    with a review of the Windows shell and explains how to work with it (e.g., starting
    a new shell, issuing commands, and closing the shell). The chapter goes on discuss
    how to work with the Windows command prompt and explains command syntax. Specific
    commands that affect the appearance of the Windows command console are then reviewed.
    This will lead into a discussion on command console customization. Finally, the
    chapter concludes by showing you how to write a script called the Unpredictable
    Command.


    +   - Chapter 3—Windows Shell Scripting Basics. In this chapter, I will provide
    you with a review of basic Windows scripting techniques, including how to control
    the display of output and how to format the display using blank lines. I will
    discuss the importance of creating a documentation template. This chapter will
    also show you how to shell input and output and how to redirect command output
    in order to create report and log files. This chapter will also show you how to
    create the Fortune Teller game, which answers questions of it by the player.


    +   - Chapter 4—Scripting and Retrieving Information in Variables. This chapter
    shows you how to write scripts that accept and process input at runtime. You will
    also learn how to retrieve information about your computer system variables. You
    will then learn about the rules that apply to the creation of variables. This
    chapter will also demonstrate different ways to manipulate the value of numeric
    variables as well as how to access all or portion of text stored in string variables.
    The chapter will end by teaching you how to create "The Story of Buzz the Wonder
    Dog" game, which creates a customized story based on information it collects from
    the user.


    +   - Chapter 5—Applying Conditional Logic. In this chapter, you will learn how
    to apply conditional logic in your scripts. This will enable you to create scripts
    that can collect and test the value of data and then alter the way the script
    executes depending on the value of the data. You will also learn how to develop
    more complicated logic by nesting one logical test within another. This chapter
    concludes by'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'introducing the Guess a Number game, in which the player is challenged to guess
    a number between 1 and 32,000 with the fewest possible guesses.


    +   - Chapter 6—Creating Loops to Process Collections of Data. This chapter covers
    the creation of loops as a means of processing large amounts of data. It will
    demonstrate how to use loops to process string contents, command output, and file
    and folder contents. This chapter also introduces you to the use of pseudo code
    as a tool for establishing a high-level script design. This chapter ends by teaching
    you how to create the Six-Million-Dollar Quiz game. In this game, the player is
    presented with a series of quiz questions that, once answered, are graded and
    used to generate a game score report file.


    +   - Chapter 7—Debugging Procedures and Subroutines. This chapter introduces
    you to the use of a design tool. It also shows how to execute one script within
    another script. The chapter also covers the use of procedures and subroutines,
    which enable you to improve script organization while also adding complexity.
    This chapter concludes by covering the development of the Rock, Paper, Scissors
    game.


    +   - Chapter 8—Debugging and Error Handling. In this final chapter, I''ll introduce
    you to a number of different topics. I''ll give you tips on how to develop your
    script in a modular fashion and how to test your scripts one module at a time.
    You''ll learn how to test intermediate references during script development and
    testing. Things constantly change on a computer system, and as your results may
