  md: '# Reading Text Files


    Another good use of the FOR command is to read and process the contents of text
    files. This allows you to create scripts that can process files created by other
    scripts or even other applications as space-, comma-, or tab-delimited text files
    created by Microsoft Excel. The syntax for this type of FOR loop is outlined below.


    ```

    FOR /F "%options" %%variable IN (filename) DO command

    ```


    For example, suppose you had the following information stored in a text file called
    C:\Contact.txt:


    ```

    =============================================================

    =============================================================

    ```


    Personal contact list


    ```

    ------------------------------------------------------------

    ```


    name      Internet_Address      Phone_No


    Molly      molly@zxync.com     550-8888

    Williamwilliam@abcd.net     550-9999

    X-Man      alexander@xyz.com     050-9876

    Mike       michael@iwworld.net     550-1234

    Mark       markland@iwworld.net     550-7744

    Nick       nick@anyplace.com     666-8912


    In its current size, this file is small and easy to work with. But as the file
    grows over time, it may become difficult to work with. By creating a Windows shell
    script, you can easily read and process some or all of the data stored in this
    file.


    The first six lines in the file consist of headers and two blank lines. Each of
    the remaining lines in the file contains tab-delimited information about different
    personal contacts, including their names, e-mail addresses, and phone numbers.


    The following script demonstrates how to use a FOR loop to display the information
    of all the people listed in the file:


    ```

    FOR /F %% IN (contacts.txt) DO ECHO %%TOKENS=1%%

    ```


    In the absence of a TOKENS parameter, the script will default to "TOKEN=1". As
    a result, this statement processes the file and displays only the information
    stored in'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'the first token of each line (e.g., the first word in each line). As a result,
    the state-ment displays the following output:


    # Personal


    +   name

    Molly

    William

    X-Man

    Mike

    Mark

    Nick


    If you want to process all of the information stored in the file, you could rewrite
    the statement as shown below:


    ```

    FOR /%%TOKENS=** %% IN (contacts.txt) DO ECHO %%

    ```


    As you can see, the TOKENS option has been added to the statement and set equal
    to *, which means all tokens should be processed. When executed, this state-ment
    would display the following output in the Windows command console:


    # Personal contact list


    | name | Internet_Address | Phone_No |

    | Molly | molly@zyinc.com | 550-8888 |

    | William | william@abcd.net | 550-9999 |

    | X-Man | alexander@xyz.com | 050-9876 |

    | Mike | michael@ivworld.net | 550-1234 |

    | Mark | markland@ivworld.com | 550-7744 |

    | Nick | nick@anyplace.com | 666-8912 |


    If you wish, you could reformat the previous statement so that it processes only
    specific tokens. For example, to limit processing to the name and phone number
    of each individual listed in the file, you would specify TOKENS=1,3. In addition,
    you'
