    # Displaying Error Messages


    Another way to handle errors is to display them. Better yet, you could suppress
    cryptic Windows error messages and display useful English-like error messages
    that users can understand. The easiest way to display error information is as
    text in the Windows command console using the ECHO command. Another option is
    to take advantage of the NET SEND command to display error messages in graphical
    pop-up dialogs. Both of these options are explored further in the sections follow.


