    # Command Shell Command Syntax


    The Windows shell provides an interface for working with text-based commands and
    utilities. In addition, you will use it to run your Windows shell scripts. Integrated
    into the Windows shell is the shell scripting language. This scripting language
    includes a large number of statements.


    Each Windows command has its own unique syntax that must be followed strictly
    for the command to work. However, all Windows commands follow a common format.
    Figure 2.4 breaks down this format.


    | Command | Arguments |

    | --- | --- |

    | cmd /t:70 /k dir |

    | Modifier | Parameter |

    | Switch |


    # FIGURE 2.4


    Examining the basic format used by all Windows commands.'
