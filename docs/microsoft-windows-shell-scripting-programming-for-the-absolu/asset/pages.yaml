    # Scheduling Script Execution


    One of the major benefits of Windows shell scripting is that it facilitates the
    automated execution of tasks. This enables you to use the Windows operating system’s
    built-in Task Scheduler service to run the script anytime you wish. For example,
    the Defrager.bat script developed earlier in this appendix is a good candidate
    to set up as a scheduled task. The DEFRAG.EXE command used within that script
    takes a while to run and consumes a lot of system resources, making your computer
    run slow. By running this script as a scheduled task, you can defrag your hard
    disk while you sleep or at any other time that suits you.


    Windows provides two different ways to work with the Windows Scheduler service.
    The first option is to use the Windows AT command. The AT command is a text-based
    interface with which you can view, add, and delete scheduled tasks. The second
    option is to use the Windows Task Scheduler Wizard, which walks you through the
    steps required to set up new scheduled tasks manually. Both of these options are
    discussed in detail in the sections that follow.


    # The AT Command


    The Windows AT command allows you to set up the scheduled execution of your Windows
    shell scripts. Using the AT command without any additional arguments, you can
    display a listing of currently scheduled tasks as demonstrated below.


    ```

    C:\AT

    Status ID Day Time Command Line

    0 Each S 5:00 AM Defrager.bat

    1 Tomorrow 11:00 AM DiskClean.bat

    ```'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'Here, two scripts have been set up to execute as scheduled tasks. The first
    script is called Defrager.bat and is set up to run every Saturday at 5 A.M. The
    second script is called DiskClean.bat and is set up to run at 11 A.M. on the next
    day.


    Only administrators can configure scheduled tasks on Windows NT, XP, 2000, and
    2003.


    The following command demonstrates how to use the AT command to set up the scheduled
    execution of a new task for a script called TestScript.bat.


    ```

    AT 22:00 /EVERY:M,T,W,Th,F,S,Su CMD /C TestScript.bat

    ```


    In this example, the Windows script that will run as a scheduled task will be
    executed every day of the week at 10 P.M. You can also use the AT command to delete
    scheduled tasks by passing the ID assigned to the task, as demonstrated below.


    ```

    AT 1 /DELETE

    ```


    Here I told the AT command to remove the DiskClean.bat script from the execution
    schedule.


    If you want to delete all of the currently scheduled tasks, you can save time
    by executing the AT command as follows:


    ```

    AT /DELETE

    ```


    Just be sure that this is what you really want to do.


    The AT command can also be used to set the execution of scripts on other network
    computers. To accomplish this, you must use the UNC format of the target computer''s
    name, as demonstrated below.


    ```

    AT \\ServerName 22:00 /EVERY:M,T,W,Th,F,S,Su CMD /C Defrager.bat

    ```


    There are more uses of the AT command than I have room to cover in this appendix.
    To learn more about this command, type AT HELP in the Windows command prompt or
    search for information about the command in the Windows system help.


    When run by the Windows Scheduler Service, your scripts will not have access to
    the same set of resources that are available when you execute them manually. For
    example, mapped drives you may have set up are not available to the script. In
    these situations, you must equip your scripts with the ability to set up connections
    to whatever resources they may require.'
