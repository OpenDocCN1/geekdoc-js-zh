- img_proc: true
  md: '# Insufficient Authority


    At some point you may find that your scripts fail because you do not have the
    appropriate set of security permissions or rights to perform a given task. The
    main thing to remember is that if you do not have the ability to perform a particular
    task from the Windows desktop, then you won''t have the ability to perform it
    from the Windows shell either.


    The bottom line is unless you have been assigned administrative-level access to
    the computer, then you run the risk of not being able to perform certain tasks.
    For example, Windows provides key functionality by running internal programs and
    utilities known as services. While you may be an administrator over your local
    computer with complete control over your computer''s services, you may find that
    if you create a script that starts and stops services and then take it to another
    computer, it will not be allowed to do its job. This may be because you lack the
    appropriate level of security permissions on that computer.


    Security issues often arise when you are developing scripts on corporate networks
    and are subject to the security restrictions imposed by system administrators.
    Perhaps you''ll need to do in this situation is ask for additional security privileges.
    Security issues also arise when you attempt to run scripts on a computer other
    than the one you developed and test your scripts. You''ll probably have to seek
    out your system administrator''s assistance.


    In addition to the above security concerns, you may find that your scripts begin
    failing when other people begin running them. This may happen if they do not have
    the same level of security access that you do.


    # Dealing with Scripts That Are Difficult to Read and Understand


    As you write your scripts, take care to make sure you always document them using
    plenty of comments and a script template like the one presented in this book.
    Use indentation as a technique for making your code easier to read and understand,
    and add plenty of blank spaces between groups of statements to help visually organize
    things.


    In addition to following these steps, make sure that you focus on keeping things
    as simple as possible. For example, use SET /A X +=1 instead of SET /A X = X +
    1. It is shorter and just as easy to understand. Finally, consider adding checks
    to your scripts that prevent them from being inappropriately executed. For example
    I recommend including the following check as your script template:


    ```

    IF NOT "%OS%" == "Windows_NT" GOTO :EOF

    ```'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Working with Windows Commands


    Windows commands are not case-sensitive, so you won''t get into trouble if you
    mix up your case when you include them in your Windows shell scripts. However,
    mixing case in this manner can make your scripts difficult to read. So be consistent
    in whatever case you decide to use. However, you need to remember that while mixing
    case will not cause script errors, you still need to follow the syntax rules specified
    for each individual command. For example, keep an eye on the order of command
    switches in any order you wish, others will not. Also, make sure that you run
    any command that you plan to use manually from the command prompt first to ensure
    that you understand how it works before adding it to your script.


    # Managing Arguments and Variables


    The Windows shell imposes many rules upon the use of arguments and variables,
    which you need to watch out for. Below is a brief overview of some of these rules.


    +   - Arguments and variables that contain spaces must be enclosed within double
    quotes.

    - Blank spaces included just before or after the equal sign in SET statements
    result in the inclusion of blank spaces in variable names and values (except when
    assigning data to numeric variables).

    - Arguments or variables that may contain spaces should be enclosed inside double
    quotation marks.

    - Use the SET command''s /A switch to explicitly define any values that you wish
    to treat as numeric.

    - Make sure you apply the order of precedence implemented by the Windows shell
    when setting up mathematical expressions.


    > Whenever possible, reference your environment variables to avoid having hard
    code data into your scripts. This will make your scripts easier to support. It
    makes them more portable. For example, Microsoft has changed the location of the
    system root folders. On Windows NT and 2000 it is C:\Win but Windows XP is C:\Windows.
    If you ever need to access this folder, you can reference the environment %systemroot%
    to find it having to be concerned with what operating system your script is running
    on.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_284_0.png)'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# Handling Files and Folders


    File and folder administration can be tricky. You never know when someone will
    come along and rename or delete them. Likewise, a file that you expect to be automatically
    created by another application or script may not have been created. Perhaps the
    application was not run or perhaps it experienced an error. In any event, you
    can guard against these types of situations by using the IF EXIST statement to
    verify in advance that a file or folder exists before attempting to create, modify,
    or delete it.


    Also, when working with files and folders, be sure to ensure any file names or
    folder names that contain blank spaces inside a matching pair of double quotation
    marks. Otherwise errors will occur. Be aware that you don''t append data to files
    that you wish to write and don''t overwrite files which you wish to append data.
    When keying in statements, you must therefore be careful to make sure that you
    use the > only once when you begin to write to a file and ensure that all remaining
    writing operations are performed using the >> characters to append data instead
    of overwriting it.


    # Taking Precautions with Loops


    A loop is a very powerful scripting tool. It enables you to execute a collection
    of statements repeatedly and to process enormous amounts of data. However, loops
    can also create problems when not properly constructed. To begin, with you always
    make sure that when you create a loop that you provide a way to break out of it
    in order to avoid the creation of endless loops.


    > An endless loop that runs forever, preventing your script from ever finishing
    or completing its task.


    For example, you could accidentally create an endless loop by setting up a FOR
    command that counts from 1 to 5 using an increment of 1. However, by accidentally
    typing in it the Windows shell adds -1 to the value of your loop''s iterator,
    it will never equal 5. So double-check any code that creates a loop and make sure
    that it will eventually end.


    If, despite your best efforts, an endless loop does occur, you can break out of
    it if it''s a script that you started manually. Press CTRL+C and respond with
    a Y when prompted to terminate the script. However, if the script was started
    in background mode using the Windows Task Scheduler service, you''ll need to terminate
    it using the Windows Task Manager.'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'Also, remember that the FOR command''s iterator character is case-sensitive.
    Therefore $$$ and %%% are not the same variable.


    # Keeping Procedures Straight


    Procedures are a powerful tool for organizing scripts and creating collections
    of reusable code. However, they are not without their own set of issues. Don''t
    forget that procedures do not have access to script arguments. If your procedure
    needs to access script arguments, pass the arguments to the procedure as procedure
    arguments. Alternatively, you can store data in files and set up your procedure
    to read and access them that way.


    When you use the SETLOCAL and ENDLOCAL commands in conjunction with procedures,
    you can exercise strict control over procedure variables by localizing their access.
    However, when you do this you also make it difficult for a procedure to return
    any results back to script. However, you have different ways of enforcing control
    over procedure variables without preventing your procedures from returning any
    output. One option is to tunnel a variable using variable tunneling. And, if your
    procedure has a lot of data that it needs to return, you can always try writing
    to a file and then having the script open and read the file.


    # Back to the Tic-Tac-Toe Game


    Now let''s begin work on the book''s last chapter project, the Tic-Tac-Toe game.
    This script will facilitate the execution of a computerized two-player, head-to-head
    game. The computer will display the game board, collect player input, control
    player turns, ensures that only valid selections are processed, and ultimately
    determine who, if anyone, has won the game.


    Given the game''s size and complexity, you are certain to run into some errors
    as you develop this game. This will give you the opportunity to put to test some
    of the debugging and error resolution techniques that you have learned in this
    chapter. Along the way, I''ll arm you with a few tricks to avoid problems, and
    I''ll point out few pitfalls that you''ll want to avoid.


    # Designing the Game


    The overall construction of the Tic-Tac-Toe game consists of the development of
    the following sections, which nicely correspond to the three sections that make
    up this book''s standard shell template:


    +   - The Initialization Section. This section will set up the script''s execution
    environment.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '+   • The Main Processing Section. This section will control the display and
    processing of the game''s main menu and will initiate and ultimately terminate
    the game''s execution.


    +   • The Procedure Section. This section will consist of a collection of 10 procedures,
    each which will be designed to perform a specific subset of the game''s functionality.


    Because this script will be rather long, you''ll need to focus on using procedures
    as the primary means of organizing the script. Otherwise, given the complexity
    of this script, you''ll run into trouble early on as the number of variables and
    tasks that you''ll need to work with begins to pile up and all your code begins
    to become intertwined.


    The tasks that need to be performed by these 10 procedures are outlined below.
    This chapter will develop the procedures in the order suggested below. However,
    that is not a requirement. You can work on the development of these procedures
    in almost any order that makes sense to you, although a few of the procedures
    are closely related and best developed in sequence.


    +   1. Initialize game board values

    2. Display the welcome screen

    3. Display the game board

    4. Create a Help screen

    5. Create an About screen

    6. Create a game controlling procedure

    7. Validate player choices

    8. Associate player choices with game board squares

    9. Display game results

    10. Check for wins, losses, or ties


    # Performing Script Initialization Tasks


    To begin the Tic-Tac-Toe script, create a new script file, copy in the shell script
    template, and then add the following statements to the Initialization Section:


    ```

    @ECHO off


    COLOR OE


    TITLE = T I C - T A C - T O E


    CLS

    ```'
