    # # Account Administration


    Windows offers a number of commands that support the command line administration
    of user accounts. These commands include


    +   * NET USER. Creates new user accounts.

    * NET GROUP. Adds user accounts to global groups.

    * NET LOCALGROUP. Adds user accounts to local groups.

    * NET ACCOUNTS. Configures user account password policies.


    These commands enable you to configure both local and domain user accounts and
    groups.


    In the next Windows script example, I will demonstrate how to automate the creation
    and administration of user accounts. The name of the script will be AdminCreator.bat.
    It will be designed to create a new user account whose name will be passed to
    it as an argument, and the script will then add that user account to the local
    administrators group. The syntax required to execute this script properly is outline
    below.


    AdminCreator UserName


    > TRICK Windows Resource Kits provide a command line utility called ADDUSERS.EXE
    that you can also use to create new accounts. This command line utility is designed
    to facilitate the creation of accounts stored as a list in a comma-delimited text
    input file.


    The script''s source code is listed below.


    ```

    @ECHO off


    REM *************************************************

    REM

    REM Script Name: AdminCreator.bat

    REM Author: Jerry Ford

    REM Date: August 1, 2003


    REM

    ```'
