  md: 'By completing this project, you will reinforce your understanding of how to
    use variables within Windows shell scripts and lay some foundation for developing
    more advanced scripts.


    # Passing Data to Scripts at Execution Time


    You can write completely self-contained scripts, meaning that they do not require
    any additional information in order to execute and perform a useful function.
    However, many scripts, especially games, require interaction with the user to
    execute. Earlier in this book, you have seen several sneak previews of the use
    of variables as a means of collecting input from the user. This chapter will explain
    in detail how to work with and control variables.


    But before I go over this material, I want to take a little time to go over another
    option for passing data to scripts. Using this option, you pass data or arguments
    to the script when you run it. Arguments are passed to scripts by typing the name
    of the script followed by a space and then one or more arguments, each of which
    is separated by a space as demonstrated below. The space serves as a delimiter
    between each argument passed to the script.


    ```

    ScriptName argument1 argument2 ......

    ```


    | DEFINITION | An argument is a piece of data passed to a command or script when
    it executes. |

    | DEFINITION | A delimiter is a marker that identifies the boundaries of individual
    pieces of data passed to a script or command. |


    Don''t be fooled if you see that someone else has used commas, tabs, equal signs,
    or semicolons as delimiters within Windows shell scripts. While most programmers
    use blank spaces to separate arguments, the Windows will allow any of these characters
    to serve as delimiters.


    # In The Real WORLD


    As you continue to create Windows shell scripts, you might find that you need
    more than one script to tackle certain tasks. In these situations, you''ll probably
    want to start one script and then have it trigger the execution of the next script.
    In this scenario, you''ll probably need to have the first script pass arguments
    to the second script in order for the second script to know what to do.'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'A Windows shell script processes arguments by assigning them to parameters.
    The Windows shell allows you to access up to eleven different script input parameters
    at a time, as listed in Table 4.1.


    # Table 4.1 WINDOWS SHELL SCRIPT PARAMETERS


    | Parameter | Description |

    | --- | --- |

    | % | Lists all the arguments that have been passed to the script |

    | %0 | Stores the name of the script |

    | %1 | Stores the first argument passed to the script |

    | %2 | Stores the second argument passed to the script |

    | %3 | Stores the third argument passed to the script |

    | %4 | Stores the fourth argument passed to the script |

    | %5 | Stores the fifth argument passed to the script |

    | %6 | Stores the sixth argument passed to the script |

    | %7 | Stores the seventh argument passed to the script |

    | %8 | Stores the eighth argument passed to the script |

    | %9 | Stores the ninth argument passed to the script |


    Look at an example of how to write a Windows shell script that processes a pair
    of arguments passed to it execution time.


    ```

    @ECHO off

    ECHO %1

    ECHO %2

    ```


    This script should be easy to understand. It simply displays the arguments that
    have been passed to it. Go ahead and create and save this script as Test.bat.
    Then run it by typing its name followed by two arguments, as demonstrated below.


    Test.bat C:\Temp\Scripts


    Once executed, you should see the following results displayed in the Windows command
    console:


    ```

    C:\Temp

    C:\Scripts

    ```'
