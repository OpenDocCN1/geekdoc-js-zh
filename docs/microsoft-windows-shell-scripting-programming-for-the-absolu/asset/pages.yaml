- img_proc: true
  md: 'Like all procedures, this one ends with the GOTO :EOF statement, which returns
    the processing control of the script back to the statement immediately following
    the statement that called this procedure.


    # Developing the :CollectChoice Procedure


    The :CollectChoice procedure, shown below, defines several variables and then
    displays a screen that prompts the player to type his selection.


    ```

    :CollectChoice


    SET answer=No Answer*

    SET response=N

    SET results=None


    CLS


    FOR /L %%i IN (1,1,8) DO ECHO.


    SET /p answer= Type either rock, paper or scissors:


    GOTO :EOF

    ```


    # Developing the :GetChoice Procedure


    The :GetChoice procedure, shown below, obtains a random number between 0 and 32,767
    by referencing the random environment variable. If the value of the random number
    is greater than 22,000, the computer is assigned a selection of rock. If the value
    of the random number is less than 22,000 and greater than 11,000, the computer
    is assigned a selection of scissors. Finally, if the value of the random number
    is less than 11,000, the computer is assigned a selection of paper.


    ```

