    # Building Multi-Line IF Statements


    So far, in all the examples you''ve seen in this chapter, I have managed to accomplish
    everything I needed to do within single-line IF statements (unless, of course,
    I used the ELSE keyword to provide an alternative execution path).


    For example, the following statement checks the exit code of the previously executed
    command and then, using compound commands, performs three tasks:


    ```

    IF NOT %ERRORLEVEL== 0 CLS & ECHO Fatal error occurred & GOTO :EOF

    ```


    While certainly effective, there is a limit to the usefulness of compound commands.
    For one thing, bunching together too many commands on a single-line statement
    can make scripts difficult to read. Generally speaking, you''ll be better off
    spreading a statement as the one above across multiple lines. You''ll find that
    it makes scripts easier to read and write.


    To break up complex IF statements into separate lines, use the following syntax:


    ```

    if condition1 == condition2 command (


    -

    -

    )

    ```'
