    # Processing Collections of Files


    One of many uses of the FOR command is to process all of the files located within
    a given folder. For example, you may want to create a script that you run at the
    end of each month that deletes all of the files in your C:\Temp folder in order'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'to help free up disk space. When used to process files in this manner, the
    FOR command has the following syntax:


    ```

    FOR %%variable IN (collection) DO command

    ```


    collection specifies the location of the folder where the files are to be processed.


    For example, you can use the FOR command to display all Microsoft Word files located
    in a folder C:\MyDocs using the following statement:


    ```

    FOR %%I IN (C:\MyDocs\*.doc) ECHO %%I

    ```


    Notice that I use the * character to instruct the script to process all files
    with a .doc file extension. The * character is an example of a wild character.
    It is used to create matches based on a pattern. In the example, the pattern was
    set up to match all files ending with the .doc file extension. I could have just
    as easily looked for all files that begin with the letters Jan and also end with
    a .doc file extension by specifying Jan*.doc.


    The Windows shell supports a second type of wild card character: the ? character.
    The character matches the pattern to a single character. For example, Jan?.doc
    would limit matches to files whose file name begins with Jan and includes a single
    character between Jan and the .doc file extension, as Jan7.doc.


    You can set the FOR statement to process more than one file type at a time by
    separating each file type with a blank space. For example, the following Windows
    shell script demonstrates how to process all files that begin with either a .bat
    or .cmd file extension and are located within the same folder as the script.


    ```

    :DisplayConsole


    ECHO.

    ECHO.

    ECHO.

    ECHO.

    Windows Shell Script Console

    ECHO.

    FOR %%I IN (*.bat *.cmd) DO (

    IF NOT %%I == ScriptConsole.bat ECHO %%I

    ```'
