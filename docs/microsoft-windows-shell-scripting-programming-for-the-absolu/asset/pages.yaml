    \ For example, the following statement could be used to process all the data stored\
    \ in a file name is My Contacts.txt.\n\n```\nFOR /F \"TOKENS=*\" %%i IN (\"My\
    \ Contacts.txt*\") DO ECHO %%i\n```"
