    PROMPT

    GOTO :EOF

    )

    ```


    If you were to forget and leave out the GOTO :EOF statement from this section
    of the script, then any changes made by this portion of the script would always
    be overwritten by changes made in the two sections that follow. This will happen
    because the script would keep on processing the statements that follow. For example,
