    the called script terminates its execution, the calling script resumes its own
    execution beginning with the statement following the CALL statement. Figure 7.8
    depicts the way that external procedures work.


    You may make as many calls to external scripts as you wish. Each external script
    is executed within the same execution environment as the calling script. Therefore,'
