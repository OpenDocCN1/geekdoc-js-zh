    # Creating Scripts That Return a Custom Exit Code


    If you plan on developing scripts that take advantage of external procedures as
    a means of creating reusable code that can be shared by multiple Shell scripts,
    you''ll appreciate this topic. As you know, one of the advantages of using procedures
    is that you can use them to isolate access to procedure variables. However, this
    also limits the ability of procedures to share variable access with the rest of
    the script.


    Variable tunneling provides a way to pass data back to calling statements or scripts.
    Another way to return data back from an external procedure is to set it up to
    pass back an exit code. The calling script can interrogate this exit code and
    ascertain what it represents. To accomplish this you''ll need to use the EXIT
    command. This command terminates the execution of the external procedure (or script)
    and, alternatively, sends back a custom exit code.


    The syntax of the EXIT command is outlined below.


    ```

    EXIT [/B] [ExitCode]

    ```


    The /B switch is optional. When used, it passes back to the calling script a numeric
    value specified by the ExitCode placeholder. To see how this works, look at the
    following pair of scripts.'
