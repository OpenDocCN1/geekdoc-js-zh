    > Don''t forget to end all your procedures with the GOTO :EOF statement. Otherwise,
    the Windows shell will treat any statements that follow a procedure as part of
    that procedure, producing unpredictable results.


    Unlike subroutines, which have complete access to all the arguments passed to
    the script, procedures are expected to accept and process their own arguments.
    To pass arguments to a script, you simply add the arguments, separated by spaces,
    to the end of the CALL statement, as outlined below.


    ```

    CALL :ProcedureName arg1 arg2 arg3

    ```


    Procedures can access these procedure arguments as %1, %2, %3, and so on in the
    same manner that scripts access script arguments. Since procedures have their
    own unique set of arguments, they are not permitted to have direct access to script
    arguments. This is true even if a procedure does not process any procedure-level
    arguments of its own. However, you can always pass script-level arguments to'
