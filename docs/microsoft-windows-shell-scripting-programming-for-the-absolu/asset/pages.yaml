  md: '# CHAPTER 5


    # Applying Conditional Logic


    You''ve already seen examples of conditional logic presented in many of the chapter
    projects presented earlier in this book. That''s because conditional logic is
    such a core programming concept that it is all but impossible to write a useful
    script of any complexity without using some form of conditional logic.


    In Chapter 3, “Windows Shell Scripting Basics,” you learned how to perform conditional
    logic using compound commands in which the execution of one command was made dependent
    on the success or failure of another command. In this chapter, you will learn
    how to use the IF statement to implement conditional logic that goes beyond the
    capabilities of simple compound commands. You''ll also learn how to create multi-line
    IF statements that allow you to execute numerous commands based on the results
    of a single conditional test. In addition, you''ll learn how to nest, or embed,
    one IF statement within another to produce powerfully intricate logic.


    Specifically, you will learn


    +   * To work with the various forms of the IF statement

    * How to determine whether variables have been defined

    * How to determine whether errors have occurred when executing commands

    * How to determine what version of the Windows shell is being used to run your
    scripts

    * How to determine whether files or folders exist before you attempt to access
    them'
  merge: -1
