- img_proc: true
  md: 'exitcode is a placeholder representing a numeric value that specifies the minimum
    error level that you are looking for. If the exit code returned by the previously
    executed command is equal to or greater than the value specified by exitcode,
    then the specified command is executed. Otherwise the command is not executed
    and the script continues running. For example, look at the following statements:


    ```

    COPY c:\Script.bat C:\Temp

    ```


    ```

    IF ERRORLEVEL 1 ECHO copy terminated. The specified file was not found.

    ```


    The first statement attempts to copy a file to the C:\Temp folder. The second
    statement checks to see if an error occurred when the first statement executed
    and displays an error message if an error did occur.


    The syntax for the ERRORLEVEL statement is outlined below.


    ```

    IF ERRORLEVEL == exitcode

    ```


    This exit code specifies a execution error code that must be exactly matched in
    order to trigger the execution of the specified command. In other words, if you
    set exitcode equal to 2, as demonstrated below, and an exitcode of 1 is returned,
    the execution of the specified command is skipped.


    ```

    IF "%ERRORLEVEL%"==2" Fatal error occurred & GOTO :EOF

    ```


    In the above example, the IF ERROR statement checks to see if the previous command
    returned an exit code of 2, and if it did, an error message is displayed and the
    script''s execution terminates.


    # Checking the Windows Shell Version


    Microsoft has continued to steadily improve and enhance its operating systems
    over the years. This includes enhancements to the Windows shell. Windows scripting
    was first introduced with Windows NT 4. It was later enhanced in Windows 2000
    with the addition of new command extensions. If you find that you need to work
    with Windows NT 4, some functionality might be missing that you have to expect
    from Windows 2000, XP, or 2003. For example, Windows NT 4 does not support the
    SET command''s /P switch that allows the command to prompt for user input.


    In addition to scanning your scripts and looking for statements that might not
    be supported on earlier versions of Windows operating systems, you can use the
    IF CMDEXTVERSION statement to check what version of the Windows shell is being
    used. Windows NT 4 runs version 1. Windows 2000, XP, and 2003 all run version
    2. This means that while your scripts might run into trouble Windows NT, they
    will probably work fine on these other Windows operating systems.'
  merge: -1
