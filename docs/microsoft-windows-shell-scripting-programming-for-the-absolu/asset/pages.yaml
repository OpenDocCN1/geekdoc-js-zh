    \ %%j\n\n)\n\nIn this example, tokens 1 and 3 map out to arguments %%i and %%j.\
    \ When executed, this statement displays the output shown below.\n\n+   Name:\
    \ Molly\nPhone: 550-8888\nName: William\nPhone: 550-9999\nName: X-Man\nPhone:\
    \ 050-9876\nName: Mike\nPhone: 550-1234\nName: Mark\nPhone: 550-7744\nName: Nick\n\
    Phone: 666-8912\n\nBe mindful of using the FOR command to process files that include\
