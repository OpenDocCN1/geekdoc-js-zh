    # The Scheduled Task Wizard


    As an alternative to using the AT command to add, view, and delete scheduled tasks,
    you can also use the Windows Scheduled Task Wizard.


    > HINT

    On Windows NT, XP, 2000, and 2003, only administrators are permitted to create
    and manage scheduled tasks.


    The Windows Scheduled Task Wizard walks you through the steps required to set
    an automated execution schedule for your scripts using any of the following schedules:


    +   * Daily

    * Weekly

    * Monthly

    * One time only

    * At startup

    * At login


    By default, scheduled tasks run by using a special built-in Windows account called
    LocalSystem. Unfortunately, this account lacks sufficient security permissions
    to run many tasks. One advantage the Windows Scheduled Task Wizard over the AT
    command is the ability to easily associate user accounts and their associated
    passwords with specific tasks. This allows tasks that require specific levels
    of access to execute using the security access of the specified user account.


    If you elect to associate a user account and its password with a scheduled task,
    the started task will stop executing if the user account''s password expires.
    In addition, the task will stop running if the user account''s password is changed
    and you forget to return and update the password in the scheduled task. One around
    this problem is to create a new user account whose sole purpose is to run scheduled
    tasks. You can set up the account so that its password will not expire and will
    never change.'
