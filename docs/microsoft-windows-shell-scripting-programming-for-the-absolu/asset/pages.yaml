  md: '# Windows Shell Scripting Basics


    In this chapter, I''ll explain the importance of adding comments to your Windows
    shell scripting to make your code self-documenting. I''ll also provide you with
    a Windows shell script template that you can use as the basis for organizing and
    documenting your scripts. You will learn about a programming technique called
    *redirection*, and you''ll learn how to use it to control script input and output.


    This chapter also shows you how to group commands and make the execution of one
    command dependent on the outcome of another command. Finally, you will learn how
    to create the Fortune Teller game. This game builds on the programming techniques
    that have been used in previous games and demonstrates how to create a script
    that continues to execute indefinitely by looping back and re-executing previous
    statements.


    Specifically, you will learn


    +   * How to add comments to your Windows shell scripts

    * How to place two or more statements on the same line

    * How to set up conditional command execution

    * How to make the output of one command the input for another command

    * How to create report and log files and append data to existing report and log
    files'
