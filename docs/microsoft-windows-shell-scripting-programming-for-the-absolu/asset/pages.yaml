- img_proc: true
  md: '# PATHEXT


    When you type an external command, you must specify its name. Optionally, you
    can specify an external command''s file extension. Normally, all you''ll need
    the name of the command itself. When you type in a command''s name without its
    file extension, the Windows shell uses the list of file extensions stored in the
    pathext variable to search for a matching command. The pathext variable lists
    all of the file extensions that Windows associates as executing files.


    When you type a command without its file extension, the Windows shell uses the
    collection of file extensions stored in pathext to search for a matching file.
    It does by substituting each file extension listed in pathext as the command''s
    file extension until it finds a match. The first match that is found ends the
    search. The Windows shell executes this command.


    By default, the pathext variable lists the following file extensions in the order:


    +   - .COM

    - .EXE

    - .BAT

    - .CMD


    You can display the contents of the pathext variable by typing the following command
    at the Windows command prompt.


    ```

    ECHO %pathext%

    ```


    The output you get back should look something like this:


    ```

    C:\ECHO %pathext%

    .COM;.EXE;.BAT;.CMD

    ```


    However, you may see additional file extensions listed depending on what software
    you have installed on your computer. If you wish, you can add a new file extension
    to pathext as demonstrated below.


    ```

    SET pathext=%pathext%.shl

    ```


    In this example, the file extension .SHL is added to the end of the pathext variable
    using the SET command. You''ll find yourself using the SET command a lot when
    working with variables. I will explain in detail in Chapter 4, "Storing and Retrieving
    Information in Variables."'
  merge: -1
  pgno: 60
