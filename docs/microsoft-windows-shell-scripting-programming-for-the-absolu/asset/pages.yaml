  md: '![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_371_0.png)


    # What Next?


    Instead of seeing this book as the end of your Windows shell scripting education,
    you should think of it as the beginning. To become an accomplished Windows shell
    script programmer, you will need to spend time developing and honing your programming
    skills by writing and testing new scripts. You also need to continue to read and
    learn more about Windows shell scripting. To help you get started, I have put
    together a list of books and Web sites where you can go to learn more.'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# Recommended Reading


    Following is a collection of books that will help you further develop your Windows
    shell script programming skills.


    # Microsoft Windows XP Professional Resource Kit Documentation


    by Microsoft Corporation


    ISBN: 0735614857, Microsoft Press, 2001


    This book provides a collection of command line utilities for Windows XP. The
    utility programs provided by this resource kit are essential tools for any system
    administrator. Complete documentation for all these utilities is also provided.


    # Windows Shell Scripting and WSH Administrator’s Guide


    by Jerry Ford, Jr.


    ISBN: 0138141268, Premier Press, 2001


    The first half of this book provides additional coverage of Windows shell scripting.
    This book will also give you a solid introduction to Microsoft’s other shell scripting
    technology, the Windows Script Host, or WSH. This book serves as a great guide
    for current or future system administrators, programmers, and power users, or
    for beginner programmers who are ready to take that next step.


    # Windows 2000 Commands Pocket Reference


    by Aleen Frisch


    ISBN: 0596001487, O''Reilly & Associates, 2001


    This little guide provides documentation of the command line commands for Windows
    2000. The guide includes a review of Windows shell scripting statements, making
    it a good resource for any Windows shell script programmer. Additionally, this
    guide reviews the syntax of the command line utilities provided by the Windows-2000
    Resource Kit.'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# Windows NT Shell Scripting


    by Tim Hill


    ISBN: 1578700477, Que, 1998


    Although this book does not cover recent enhancements to Windows shell scripting
    available in Windows 2000 and XP, it still provides a solid review of Windows
    shell scripting.


    # Locating Internet Resources


    Books are not the only source of information available to you for Windows shell
    scripting. Perhaps the best source of free information is the Internet, where
    you can find additional documentation and tons of free sample scripts. Following
    is a list of Web sites where you can learn more.


    www.labmice.net/scripting


    The Scripting and Batch Programming Resources Web site provides access to information
    on Windows shell scripting as well as other programming languages. Here you will
    find a Windows command reference, a reference for Windows Resource Kit and links
    to articles that provide all of information related to Windows shell scripting.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_373_0.png)


    FIGURE C.1


    Scripting resources at www.labmice.net/scripting/default.htm.'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# www.robvandwoude.com


    Another excellent resource is Rob van der Woude''s Scripting Pages Web site (Figure
    C.2). Here you will find plenty of Windows shell scripting examples. However,
    the site states that its main objective is to help you teach how to create scripts.
    You can expect to find plenty of information on how scripting works. In addition,
    you will find information about a number of other scripting languages.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_374_0.png)


    FIGURE C2


    The The Batches page at www. robvandwoude.com.


    # www.onesmartclick.com/programming/batch-files.html


    Another excellent site is www.OneSmartClick.com (Figure C.3). This site is loaded
    with links to articles where you will find all kinds of information related to
    Windows- shell scripting.


    # www.windowshellscripting.com


    This final recommended site (Figure C.4) is good for finding more information
    about Windows shell scripting. You will find tutorials covering Windows shell
    scripting as well as sample scripts that you can download. In addition, this site
    features an online discussion forum where you can post questions and receive answers
    from other Windows shell scripting programmers.'
