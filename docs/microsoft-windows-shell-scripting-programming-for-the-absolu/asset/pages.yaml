    # Examining Different Ways of Dealing with Errors


    There are a number of different ways that you can attempt to cope with errors
    in your Windows shell scripts. To begin with, you could


    +   - Educate your users so that they''ll know what your scripts run into an error.

    - Develop a script trace capability that assists you in tracking down and fixing
    errors.

    - Try to anticipate commands that are most likely to result in errors and attempt
    to programmatically fix or work around problems.

    - Record errors that occur in error log files for later review.

    - Report errors by displaying them as soon as they occur.


    I''ll discuss each of these options in detail in the sections that follow.


    # Educating Your Users


    Even the best and most experienced programmers run into errors. That''s part of
    the reality of modern-day programming and script development. One way you'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'can deal with errors that you did not anticipate or cannot prevents is to educate
    the people with whom you share your scripts.


    By educate, I mean that you should provide them with detailed instructions as
    to what to do problems occur. For example, you might


    +   - Ask users to document any error messages that are displayed.

    - Ask users to document exactly what steps they had taken that led up to the errors
    (e.g., what input they had given the script, and when the script was started,
    etc.).

    - Ask users to report immediately any problems that occur.


    By supplying you with this type of information, users might enable you to reproduce
    and identify the error, so you can prevent the error from happening again in the
    future. Just remember this: Unless you provide them with some instruction, most
    users will have no idea what to do when a script occurs. By providing them with
    instructions up front, you only minimize inconvenience and facilitate problem
    resolution but also encourage feedback and support, which can be critical in a
    professional setting.


    # # Tracing Logic within Scripts


    Sometimes errors can be difficult to track down, especially if the script is fully
    written and you have not looked at it in a while. Unfortunately, unlike some advanced
    programming languages, Windows shell scripting does not provide any sort of built-in
    debugging or tracing mechanism that allows you to track the operation of your
    scripts as they execute.


    One way to deal with this is to remove the @CHO statement from the beginning of
    your script. This will allow you to observe the execution of each command as it
    executes. However, this option can flood the Windows command console''s display,
    and it may soon become difficult to follow. Fortunately, other options are available.


    One basic way of implementing tracing within your Windows scripts is to embed
    ECHO statements throughout your scripts. For example, to track script execution,
    you could place an ECHO statement at the beginning and ending of the script''s
    Initialization and Main Processing Sections as well as in procedures in order
    to identify which portion of the script is currently executing. These ECHO statements
    could be as simple as those shown below.


    ```

    ECHO Procedure :DisplayResults not executing

    ```


    ```

    ECHO Procedure :DisplayResults finished executing

    ```'
  merge: -1
