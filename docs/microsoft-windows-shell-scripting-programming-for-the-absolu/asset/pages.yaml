  md: '# Configuring the Execution Environment


    At this point you should be looking at an empty Notepad file. Type in the following
    text.


    ```

    @ECHO off

    ```


    ```

    TITLE "KnockKnock.bat - The KnockKnock joke game!"

    ```


    ```

    COLOR OE

    ```


    The first statement prevents the display of script statements during execution,
    making the script''s output more presentable. The second statement uses the Windows
    Title command to display the text KnockKnock.bat - The KnockKnock joke game in
    the Windows console''s title bar when uses the Windows COLOR command to display
    all text in yellow when the script runs. At this point, don''t worry about the
    specifics of any of these commands or their syntax. I''ll go over them in detail
    in Chapter 2. Just accept my somewhat high-level explanations of how things work
    and keep writing script while focusing on the overall process you are going through.


    # Formatting the Display


    The default behavior of the Windows command console is to display line of output
    immediately after the command that generated it. For example, if you entered two
    commands, the Windows console would display the first command and its output,
    followed by the second command and its output. This can make for a very cluttered
    display. To format your script''s output and make it easier to interact with you,
    you can do a couple of things. First, you can use the CLS command to clear the
    Windows command console, thus displaying a blank display. You can then use the
    ECHO statement to display blank lines to the Windows command console and control
    the location where text will be displayed. For example, the following clear the
    Windows command console and then display 10 blank lines. This way, the next line
    of text displayed will appear in the middle of the Windows command console. Note
    that the period following the ECHO command must be included exactly as shown.'
