    the Window Preview section of the property sheet.


    Making changes to font type also has an impact on the size of the Windows command
    console. Depending on the font type you select, the Bold fonts option (to the
    right of the selection list) may become enabled. This option can help to make
    text easier to read. You can preview the effects of font selection in the Selected
