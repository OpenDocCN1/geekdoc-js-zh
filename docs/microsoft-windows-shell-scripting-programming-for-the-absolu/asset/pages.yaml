  md: '![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_67_0.png)


    Use the Options property sheet to configure cursor size and command history as
    well as display and edit options.


    +   - **Cursor Size.** Sets either a small, medium, or large cursor size.

    - **Display Options.** Sets the Windows command console to open either in a window
    or in full screen mode.

    - **Command History.** Sets the number of commands that the Windows command console
    can recall, the number of available buffers, and controls whether duplicate commands
    are discarded.

    - **Edit Options.** Enables or disables the QuickEdit and Insert Edit modes. QuickEdit
    allows to text to be copied and cut from the Windows command console and pasted,
    and for text to be pasted to the Windows command prompt. Insert Mode controls
    whether text is overwritten or inserted when editing command.


    # Specifying Font Settings


