    # IN THE REAL WORLD


    Any true power user or system administrator is, by definition, good at working
    with the Windows shell. Often working with the Windows shell means typing in the
    same sets of commands repeatedly. To speed up and increase their efficiency, power
    users and administrators learn all of tricks to help them work faster. One technique
    that many people use is access quick history, which provides a list of previously
    executed commands that you can quickly access and run again. To access the Windows
    shell''s command history, press the F7 key. Use the up and down arrows to select
    a previously executed command and press the Enter key.


    # Back to the Unpredictable Command Prompt


    Now let''s turn our attention to the chapter''s main project, the Unpredictable
    Command Prompt. Through the development of this script, you will learn how to
    create a script that interacts with the Windows shell environment and the Windows
    command console. You will also get some more exposure to working with variables
    and using simple conditional logic.


    # Designing the Game


    The Unpredictable Command Prompt is designed to randomly modify the Windows console
    environment each time it is executed. In total, three different scenarios may
    occur, each of which will modify the Windows title bar, command prompt, and foreground
    and background colors. In addition, a different'
  merge: -1
  pgno: 70
