    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_222_0.png)


    # EXERISES


    +   1. Modify the Six-Million-Dollar Quiz so that it displays the correct answers
    to any question missed by the player.


    +   2. Modify the Six-Million-Dollar Quiz so that the Score Card Report is not
    automatically generated. Instead, display a prompt at the end of the game that
    asks players whether they would like the report to be generated.


    +   3. Each script statement that writes or appends data to the Quiz.txt file
    has the name and location of the report file hard coded on. Make the script easier
    to maintain and modify by defining a variable that specifies the location where
    the file should be stored and then replace each hard-coded reference with this
    variable.


    +   4. Add logic to the end of the Six-Million-Dollar Quiz that grades the score
    earned on the quiz. For example, assign A+ if all questions were answered correctly,
    a B+ if only one question was missed, and so on.'
