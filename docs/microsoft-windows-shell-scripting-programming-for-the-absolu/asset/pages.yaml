    System environment variables are displayed at the bottom of the dialog. You''ll
    usually find a number of different system environment variables listed here, including


    +   - COMSPEC: Specifies the location of the Windows shell (e.g., CMD.EXE).

    - OS: Identifies the currently running Windows operating system.

    - PATH: Specifies the default search path.

    - PATHEXT: Lists file extensions that represent executable programs.

    - Prompt: Specifies the default command prompt format.

    - TEMP: Specifies the location of a folder where the system may store temporary
    files.

    - WINDIR: Identifies the folder where system files are located.


    # Modifying Environment Variables


    While you can view and access environment variables from within your Windows shell
    scripts, you cannot permanently change them. You can, however, make changes to
    user and system environment variables from the Environment Variables dialog provided
    you have administrative rights for the computer which you''re working.


    By clicking on the New, Edit, or Delete buttons associated with either the user
    or system environment variables, you can create, change, or delete environment
    variables. For example, to create a new system variable, click on the New button
    located at the bottom of the Environment Variables dialog. The New System Variable
    will appear, as shown in Figure 4.7. To create the new variable, type its name
    in the Variable name field and its value in the Variable value field and click
    on OK.'
