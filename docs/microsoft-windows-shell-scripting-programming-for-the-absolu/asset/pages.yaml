    # IF NOT DEFINED


    The NOT keyword seems especially suited to working with the IF DEFINED statement,
    providing an easy means of checking to see if a variable does not exist. The syntax
    for this form of the IF statement is outlined below.


    ```

    IF NOT DEFINED variable command

    ```


    For example, following IF NOT DEFINED statement checks to make sure that an environment
    variable called Scripts not already exist before defining a script variable of
    the same name. Using this technique, you can set up your Windows shell scripts
    to look for environment variables that control their execution, but still fall
    back and use hard-coded default values in the event that the environment variables
    are not present.


    ```

    IF NOT DEFINED %Scripts% SET Scripts=C:\Scripts

    ```


    Refer to Chapter 4, "Storing and Retrieving Information in Variables," for information
    on how to manually define and assign values to environment variables.'
