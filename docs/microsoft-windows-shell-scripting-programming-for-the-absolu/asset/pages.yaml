- img_proc: true
  md: '# Working with Network Drives


    If your computer is connected to a home network or if your desktop computer work
    is connected to a network, you are probably familiar with many of the advantages
    of computer networks. These advantages include things like group e-mail and instant
    messaging. They also include the sharing of resources as disk drives and printers.


    Using the NET USE command, you can automate the establishment of connections to
    network resources. For example, you can create a mapped-network drive connection
    to shared network drives using the following syntax:


    ```

    NET USE DriveLetter:\ServerName\ShareName

    ```


    DriveLetter specifies an available drive letter on the local computer which will
    be used to represent the network connection. ServerName specifies the name of
    the computer where the shared network folder or drive resides, and ShareName is
    the name assigned to the shared resource.


    > DriveLetter is an alphabetical representation of a disk drive. Windows computers
    use letters of the alphabet to represent connections to local and network drives.
    As such, a maximum of 26 network drive connections can be set up or mapped on
    your computer.


    > The \ServerName\ShareName parameter defined previously is an example of the
    application of the Universal Naming Convention, or UNC. The UNC establishes standards
    for identifying local and network resources. UNC names begin with two backslashes
    followed by the name of a network device, another slash, and then the name of
    the shared resource.


    You can also use the NET USE command to break connections to network resources.
    To disconnect a connection to a shared network drive, use the following syntax:


    ```

    NET USE DriveLetter:/DELETE

    ```


    DriveLetter represents the drive letter currently associated with the connection
    and /DELETE is a switch that tells the NET USE command to terminate the computer''s
    connection.'
  merge: -1
  pgno: 320
