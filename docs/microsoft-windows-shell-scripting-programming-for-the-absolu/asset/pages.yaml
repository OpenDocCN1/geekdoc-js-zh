    # # Interacting with the Windows Shell


    In this chapter, you will learn how to work with and control the Windows shell
    environment. In doing so you will also learn how to configure the appearance and
    behavior of the Windows command console and the Windows command prompt. You will
    also learn about the commands internally defined by the Windows shell. These commands
    include all of the programming statements that make up the Windows shell scripting
    language.


    This chapter will also explain how the Windows shell works with external commands
    and utility programs, including how it locates and executes these commands and
    utilities. The chapter will conclude by demonstrating how to develop the Unpredictable
    Command Prompt script. This script provides a fun demonstration of how to automate
    the configuration of the Windows shell environment.


    Specifically, you will learn


    +   * The basics of Windows command syntax

    * Different ways of starting Windows command consoles and configuring the Windows
    shell environment

    * The differences between internal Windows shell script commands and external
    Windows commands and utilities

    * How to manually customize the Windows command console from the Windows desktop'
