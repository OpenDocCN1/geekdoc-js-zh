  md: '# Glossary


    @. A Windows shell script command that suppresses the display of any statement
    from the Windows command console.


    @ECHO off. A Windows shell script statement that suppresses the display of all
    statements within a script.


    .bat. The file extension assigned to batch files, also known as Windows shell
    script files.


    .cmd. The file extension assigned to command files, also known as Windows shell
    script files.


    :E0F. A built-in Windows shell script function that simulates the end-of-file
    marker, providing the ability to terminate procedures and scripts.


    **Application Event Log.** A log file maintained by Windows NT, XP, 2000, and
    2003 operating systems where application error messages are written.


    **Argument.** An individual piece of data passed to a command, procedure, or script
    at execution time.


    **Arithmetic Operators.** Characters that you use to specify the type of mathematical
    operation to perform within a script (+, -, *, /, and %).


    **Assignment Operators.** Characters that you use when assigning values to numeric
    variables using expressions (+=, -=, *=, /=, and %=).


    ASSOC. A Windows command that displays or modifies file name extension associations.


    AT. A Windows command that provides the ability to view, create, and modify scheduled
    tasks.


    **Batch Files.** Files with a .bat file extension that contain Windows shell scripts.


    CALL. A Windows shell command used to execute internal or external procedures
    in which the calling script pauses and for the called script to finish execution
    before resuming its own execution.


    CD (CHDIR). A Windows command used to change the current directory.'
  merge: -1
  pgno: 377
- img_proc: true
  md: 'CHOICE, EXE. A Windows Resource Kit command that provides the ability to actively
    prompt the user for text input.


    CLS. A Windows command that clears the Windows command console screen, leaving
    only the command prompt visible.


    COLOR. A Windows command that sets foreground and background colors in the Windows
    command console.


    Command Extensions. Modifications made to Windows shell commands since the initial
    release of the Windows shell.


    Command History. A list of previously executed commands that can be recalled and
    executed by pressing F7 when using the Windows command console.


    Command Prompt. Enables the Windows command console to accept text input which
    is then passed to the operating system for processing.


    Comments. Statements embedded within scripts that document the script without
    affecting its execution. (See REM).


    Comparison Operators. Characters that you use to specify the type of comparison
    you wish to perform when formulating IF statements (==, EQ, LSS, GTR, LEQ, GEQ
    andQ).


    Compound Commands. The execution of two or more commands using a collection of
    reserved characters (&, && |, ()) that specify how and when commands follow the
    first command are to be executed.


    Computename. An environment variable that stores the name assigned to the local
    computer.


    COMSPEC. An environment variable that identifies the location of the Windows shell
    (e.g., CMD.EXE).


    COPY. A Windows command that copies one or more files from one location to another.


    CMD. A Windows command that is used to open a new Windows shell session within
    the current Windows command console.


    CMDEXTVERSION. An environment variable that stores a string identifying the Windows
    shell version number.


    date. A variable that provides access to the current system date.


    DATE. A Windows command that displays or modifies the system date.'
  merge: -1
  pgno: 378
- img_proc: true
  md: 'Debug. A term used to refer to the processes involved in locating and fixing
    errors within scripts and programs.


    Defrag. A Windows command-line utility program that defragments files stored on
    hard drives to reorganize disk space and improve disk performance by creating
    larger contiguous sections of free space.


    Defragmenter. A graphical Windows utility that defragments files stored on hard
    drives to reorganize disk space and improve disk performance by creating larger
    contiguous sections of space.


    DEL. A Windows command that removes or deletes one or more files.


    Delimiter. A marker (e.g., a space, comma, tab character, etc.) that identifies
    the boundaries between individual pieces of data passed to commands, procedures,
    or scripts.


    DIR. A Windows command that displays the files and folders located in the specified
    folder or directory.


    Directory. A term that is synonymous with the terms folder and subfolder.


    Dynamic Environment Variables. Environment variables generated by the operating
    system that change over time.


    ECHO. A Windows shell command that displays text and blank lines within the Windows
    command console.


    Endless Loop. A loop that never finishes processing and prevents a script from
    completing its task.


    ENDLOCAL. A Windows shell command that terminates variable localization by restoring
    variables to their values as existed before the preceding SETLOCAL command. (See
    SETLOCAL.)


    Environment Variable. A variable defined and managed by the operating system.


    ERASE. A Windows command that removes or deletes one or more specified files.


    Error. A problem that occurs during the execution of a script.


    ERRORLEVEL. A dynamically generated variable that contains a numeric value representing
    the exit code created by the previously executed command.


    Execution Environment. The environment in which a script runs. For Windows shell
    scripts, this is the Windows shell.'
  merge: -1
  pgno: 379
- img_proc: true
  md: 'EXIT. A command that terminates script execution and closes the Windows command
    console. This command is also capable of returning an exit code back to a calling
    command or script.


    Exit Code. A numeric value returned by commands that indicates whether they ran
    successfully or experienced an error. Also known as a Return Code.


    Expression. A script statement that evaluates the value of variables.


    External Command. A non-Windows shell command stored as an executable file on
    the computer''s hard drive. (See Internal Command.)


    External Procedure. A Windows shell script that is called by another script. (See
    Internal Procedure.)


    Flowchart. A graphic outline that provides a high-level overview of the components
    of a script and shows their relationship to one another.


    FOR. A Windows command that executes one or more commands repetitively to facilitate
    the processing of files, folders, command output, and scripts.


    FTYPE. A Windows command that displays and modifies file types that are associated
    with file name extensions.


    Global Variables. Variables that can be accessed from any location within the
    script.


    GOTO. A Windows shell command that alters processing flow within a script by transferring
    control to a line containing a specified label.


    GUI (Graphical User Interface). The point-and-click graphical interface used to
    control Windows operating systems and their applications.


    HELP. A Windows command that provides command prompt access to additional information
    regarding Windows commands.


    IF. A Windows shell command that performs conditional processing and alters the
    execution flow within the script based on tested results.


    IFCMDEXTVERSION. A form of the IF statement that retrieves a numeric value indicating
    the current version of the Windows shell.


    IF DEFINED. A form of the IF statement that provides the ability to determine
    whether a variable already exists.


    IF...ELSE. A form of the IF statement that provides the ability to execute either
    two sets of commands based on the outcome of a conditional test


    IF ERRORLEVEL. A form of the IF statement that provides the ability to check the
    exit code of the previously executed command.'
  merge: -1
  pgno: 380
- img_proc: true
  md: 'IF EXIST. A form of the IF statement that provides the ability to determine
    whether a file or folder exists.


    IF NOT. A form of the IF statement that provides the ability to perform a conditional
    test and take an action on a negative result.


    Integrated Development Environment. An application that is used to facilitate
    the development and debugging of other scripts or programs.


    Internal Command. A command built into the Windows shell. (See External Command.)


    Internal Procedure. A procedure defined within the script that, when called, executes
    and then returns control back to the statement that follows the statement called
    it.(See External Procedure.)


    Iterate. The act of executing one or more commands.


    JScript. A Microsoft scripting language based on Netscape''s JavaScript programming
    language.


    Label. A marker placed inside Windows shell to set up loops, subroutines, and
    procedures.


    Local Variables. Variables created within a procedure that cannot be accessed
    outside of the procedure.


    LOGEVENT.EXE. A Windows Resource Kit command line utility that can be used to
    write messages to the Windows application event log.


    Logical Error. An error created when the programmer tells the script to do something
    other than what was actually intended to do, such as adding two numbers that really
    should have been subtracted.


    Loop. A collection of statements that are executed repeatedly.

    MD (MKDIR). A Windows command that creates a new subdirectory or subfolder.


    Modifiers. Parameters that can be used to change the behavior of a command''s
    switches.


    MOVE. A Windows command that moves one or more files from one location to another.


    Multi-line IF Statement. A form of the IF statement that allows programmers to
    embed more than one statement inside IF statements.


    Mutually Exclusive. A term that refers to situations in which only one of a collection
    of options can be selected.'
  merge: -1
  pgno: 381
- img_proc: true
  md: 'Nested IF Statement. One or more IF statements within another IF statement.


    NET CONTINUE. A Windows command that reactivates a suspended service.


    NET GROUP. A Windows command that modifies membership of global groups.


    NET LOCALGROUP. A Windows command that modifies membership of local groups.


    NET PAUSE. A Windows command that suspends the execution of a service.


    NET START. A Windows command used to start services.


    NET SEND. A Windows command used to send text messages to other users or processes
    that will be displayed in the form of a graphical pop-up dialog.


    NET STOP. A Windows command that terminates the execution of a service.


    NET USE. A Windows command that provides the ability to establish connections
    to network drivers, folders, and printers.


    NET USER. A Windows command that provides the ability to programmatically create
    new user accounts.


    **Order of Precedence.** A term that refers to the order in which the Windows
    shell performs different types of mathematical operations when evaluating expressions.


    **OS.** An environment variable that identifies the currently running Windows
    operating system.


    **Parameter.** One or more arguments to be passed to commands, procedures, or
    scripts for processing.


    **Parsing.** The act of extracting a portion of a string.


    path. An environment variable that specifies which folders are to be searched
    when looking for a command in which the user has not specified the location of
    the command.


    PATH. A Windows command that provides the ability to modify the path variable
    for the duration of the execution of a Windows shell session.


    pathext. An environment variable that identifies a list of file extensions representing
    executable programs.


    PAUSE. A Windows shell command that halts script execution until the user presses
    a key.


    **Perl (Practical Extraction and Reporting Language).** A scripting language originally
    made popular by its use on UNIX operating systems.'
  merge: -1
  pgno: 382
- img_proc: true
  md: 'Pipe. The redirection of one command''s output to another command.

    This output is processed by the second command as input.


    Pixel. The smallest area on the display screen that a computer can display or
    print.


    PPOD. Changes the current folder to the folder stored by a corresponding PUSH
    command. (See PUSHD.)


    Procedure. A collection of statements that can be executed as a unit. Procedures
    are used to switch control from one portion of a script to another section and
    then back when the procedure finishes executing.


    Procedure Variable. A variable that has been localized within a procedure, prohibiting
    other parts of the script from accessing the variable. (See Script Variable.)


    PROMPT. A Windows command that is used to modify the format of the Windows command
    prompt.


    Pseudo Code. A rough, English-like outline of the logic used in all or part of
    a script.


    PUSH. Changes the current working directory to the specified folder and stores
    the previous folder for later reference by the PPOD command. (See PPOD.)


    Python. A scripting language with a UNIX heritage that is named after the comic
    Monty Python.


    random. An environment variable that returns a randomly generated number between
    1 and 32,767.


    RD (RMDIR). A Windows command that removes or deletes a specified folder.


    Recursive. A script goes through when it reinitiates its own execution or the
    execution of a specific collection of statements.


    Redirection. The altering of a command''s input or output from its default source.


    REG. A Windows Resource Kit command line utility that provides the ability to
    access and change information stored in the Windows registry.


    Registry. A specialized database used by Windows computers to store about users,
    hardware, software, and operating system configuration settings.


    REM. A Windows shell command that provides the ability to add comments to a script.


    REN (RENAME). A Windows command that renames a file or folder.


    Return Code. A numeric value returned by commands and external procedures indicating
    whether they ran successfully or terminated with an error. Also known as an Exit
    Code.'
  merge: -1
  pgno: 383
- img_proc: true
  md: 'REXX (Restructured Extended Extractor language). A scripting language developed
    originally for execution on mainframe computers and later ported over to Windows.


    Run-Time Error. A type of error that occurs when a script attempts to perform
    an illegal action, such as referencing a non-existing disk drive. (Also known
    as Execution Error.)


    Scheduled Task Folder. A folder in which Windows operating systems store and manage
    scheduled tasks.


    Scheduled Task Wizard. A graphical interface that assists in the creation of scheduled
    tasks.


    Script. An executable file made up of one or more scripting language statements.


    Script Editor. A specialized text editor that facilitates the development of scripts
    by providing features such as color coding and line numbering.


    Script Variable. A variable created during the execution of a Windows shell script
    that can be accessed from any location within the script. (See Procedure Variable.)


    SET. A Windows shell command that provides the ability to collect and assign values
    to variables.


    SETLOCAL. A Windows shell command that records the current values assigned to
    environment variables in the Windows shell, allowing them to be later restored
    by the ENDLOCAL command. (See ENDLOCAL.)


    SHIFT. A Windows shell command that alters the position of script parameters in
    order to allow Windows shell scripts to access more than nine script input parameters.


    Shortcut. A graphical link to an application or resource (often placed on the
    Windows desktop).


    SORT. A Windows shell command that sorts data provided to it as input and sends
    the result to standard output.


    Standard Error. The default location where the Windows shell sends all error messages.
    (By default, this is the Windows command console.)


    Standard Input. The location where the Windows shell looks for command input.
    (By default, this is the computer''s keyboard.)


    Standard Output. The default location where the Windows shell sends all output.
    (By default, this is the Windows command console.)'
  merge: -1
  pgno: 384
- img_proc: true
  md: 'START. A Windows shell command that starts a new Windows shell session opening
    a new Windows command console.


    Statement. A line of code in a script or program.


    String Substitution. The search for and replacement of a portion of text within
    a string.


    Subdirectory. Another term that refers to folders and subfolders.


    Subroutine. A collection of statements that scripts jump to and continue processing.
    Unlike procedures, subroutines do not return processing control back to the statement
    that follows the statement executed the subroutine.


    Substring. A portion of text extracted from a text string.


    Switch. An optional control that modifies the way in which a command is processed.


    Syntax. A set of rules that outline the format in which commands must be formulated
    for execution.


    Syntax Error. A type of error that occurs when programmers fail to follow the
    syntax rules that govern the formatting of commands.


    systemroot. An environment variable that specifies the location of the Windows
    system root folders.


    TEMP. An environment variable that identifies the name of a folder that can be
    used by applications for temporary storage.


    time. An environment variable that stores a string representing the current system
    time.


    TIME. A Windows shell command that displays and modifies the system time.


    TITLE. A Windows shell command that modifies the text displayed in the Windows
    command console''s title bar.


    Token. A representation of a piece of data located in a text string.


    TMP. An environment variable that identifies the name of a folder that can be
    used by applications for temporary storage.


    Tracing. The process of tracking each script execution flow or variable values
    during the execution of a script.


    TYPE. A Windows command that displays the contents of files by sending their output
    to standard output.'
  merge: -1
  pgno: 385
- img_proc: true
  md: 'username. An environment variable that stores the username of the currently
    logged in on user.


    **Variable.** A reference to a location in the computer''s memory where the script
    stores a value.


    **Variable Tunneling.** A technique used to pass procedure variables and their
    values out of procedures where localization has been implemented.


    **VBScript.** A WSH supported scripting language that consists of a subset of
    the Visual Basic programming language.


    **VER.** A Windows shell command that displays the Windows version number.


    **Wild Card.** A special character (either " or ?) that can be used to create
    matches files based on a pattern.


    **WINDIR.** An environment variable that identifies the folder where Windows system
    files are stored.


    **Windows Command Console.** A window through which a new Windows shell session
    can be accessed via the command prompt.


    **Windows Registry.** A special built-in database that is a part of all Windows
    operating systems, starting with Windows 95, where configuration is stored regarding
    system, application, hardware, and users settings.


    **Windows Shell.** A text-based interface to the Windows operating system that
    provides access to text-based commands and utilities.


    **Windows Shell Scripting.** A built-in scripting language available on Windows
    NT, XP, 2000, and 2003 that features a complete set of programming statements,
    allowing for the development of scripts that include support for conditional logic,
    iterative logic, and the storage and retrieval of data via computer memory.


    **Working Directory.** A reference to the Windows folder on which the Windows
    command console is currently focused.


    **WSH (Windows Script Host).** An alternative scripting environment available
    on all Windows operating systems starting with Windows 95.


    **WSH Object Model.** A collection of objects provided by the Windows Script Host
    that provides access to system resources such as printers and drives.'
  merge: -1
