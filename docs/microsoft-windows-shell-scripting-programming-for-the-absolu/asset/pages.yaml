  pgno: 266
- img_proc: true
  md: '# Syntax Errors


    Windows shell script errors occur at a number of different times and for a number
    of different reasons. One type of error that you are sure to encounter is a syntax
    error. These types of errors happen when you mistype statements within your Windows
    shell scripts. For example, you might mistype the spelling of a command or leave
    the closing parenthesis in a multi-line IF statement.


    > DEFINITION Syntax errors occur when programmers fail to follow the syntax rules
    that govern the formatting of commands.


    Syntax errors are usually caught by the Windows when your script begins to run
    and will prevent your script from executing. The Windows shell displays an error
    message indicating the cause of the first syntax error it finds within the script.
    Using the information provided by the error message and a little detective work,
    you can eliminate most syntax errors during script development and testing.


    # Run-Time Errors


    Another category of error that you will run into is, run-time, errors. Run-time
    errors occur only when the statements that generate them execute. Therefore, unless
    you are careful to test the execution of every statement within your script, run-time
    errors can sneak through. For example, you might have a script that contains a
    procedure that is not always used. If this procedure contains a statement that
    would generate a run-time error, you would not know it until some time later.


    > DEFINITION An execution error, or run-time error, is one that happens as a result
    of the script attempting to perform an illegal action. A good example is when
    GOTO or CALL command attempts to reference a label that has not been defined within
    the Windows shell script.


    The good news is that in most cases you can avoid run-time errors by carefully
    designing and testing your scripts during development. Unfortunately, you may
    not be able to entirely prevent run-time errors from occurring. For example, users
    can be unpredictable. You can never be completely assured that they will supply
    your scripts with data that make sense, resulting in run-time errors. Other causes
    of run-time errors include environment problems. For example, if your script is
    designed to create a report about the user''s hard disk has become full, your
    script will fail with an error.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Logical Errors


    Another category of errors that every programmer runs into from time to time is
    logical errors. Logical errors occur when you tell a script to do one thing when
    you really meant it to do something else. As a result, the script does exactly
    what you told it to do but the output you expected is wrong.


    > DEFINITIONnA logical error is one that occurs as a result of a mistake made
    by the programmer, such as telling a script to add two numbers that should have
    been subtracted.


    Logical errors usually make their presence known in the form of unexpected output.
    In other words, the script seems to run without any problems, but the end result
    isn''t what you intended. Since logical errors do not announce themselves in the
    form of error messages, they can be the most difficult type of errors to track
    down and fix. As a result, most logical errors are fixed by reviewing all of your
    script line-by-line to figure out where you went wrong. However I will show you
    a few tricks in this chapter that will help you track down logical errors.


    Fortunately, most logical errors can be prevented by taking the time to plan the
    design of your scripts properly. For example, a good design might start with a
    flowchart and a pseudo code outline of the logic involved in certain procedures.
    Even with the best preliminary designs, logical errors sometimes still manage
    to creep into scripts. However, by developing your scripts in a modular fashion
    using subroutines and procedures, and by carefully testing, you can usually catch
    any logical errors during script development.


    # Examining Windows Shell Error Messages


    The Windows shell automatically generates error messages for both syntax and runtime
    errors. By default all error messages are displayed in the Windows command console.
    However, using I/O redirection, as discussed in Chapter 3, "Windows Shell Scripting
    Basics," you have the option of redirecting errors messages elsewhere.


    # Common Syntax Errors


    Unfortunately, error messages produced by the Windows shell often leave much to
    be desired. Unlike other scripting languages, which display an error code and
    description as well information regarding the line number of the statement that
    generated the error, the information provided by the Windows shell is'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'meager and is limited to a cryptic message that often provides very little
    helpful information. For example, consider the following Windows shell script.


    ```

    @ECHO OFF


    SET /A X = 5

    SET /A Y = 10


    IF X GTR Y ECHO X is greater than Y ELSE ECHO Y is greater than X

    ```


    There is an error in this script. If you were to save and run the script, the
    error message you would see is shown below.


    The syntax of the command is incorrect.


    As you can see, the Windows shell has told you that it found an error but has
    not provided you with any other useful information. If you look closely, you''ll
    see that the error is a missing left parenthesis at the end of the fourth line
    in the script. Now look at another example of a common Windows shell script error.


    ```

    @ECHO OFF


    SET WindowsFiles=%windir%


    %WindowsFiles%

    ```


    In this example, the name of the windir environment variable has been misspelled.
