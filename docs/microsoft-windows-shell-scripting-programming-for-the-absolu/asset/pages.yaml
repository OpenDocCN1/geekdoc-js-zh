  md: '# Iterating a Specified Number of Times


    The final form of loop supported by the FOR command is one that iterates a predetermined
    number of times. In this form of the loop, you must provide the FOR command with
    a number indicating a starting point, an increment number, and a final number
    that reached terminates the loop''s execution. The syntax for this form of the
    loop is outlined below.


    ```

    FOR /L %%variable IN (begin,increment,end) DO command

    ```


    For example, the following statement uses this form of the FOR loop to count to
    3. The loop begins at 1, increments by 1 upon each iteration, and stops after
    the third iteration.


    ```

    FOR /L %%i IN (1,1,3) DO ECHO %%

    ```


    The output produced by this statement is shown below.


    +   1

    2

    3


    Now look at a somewhat more useful way to use this form of the FOR loop. In this
    example, I will use the FOR loop to display the contents of an output screen.
    As you can see, I was able to create the screen using only four statements (excluding
    the @ECHO off statement).


    ```

    @ECHO off


    FOR /L %%i IN (1,1,11) DO ECHO

    ECHO Welcome to ............

    FOR /L %%i IN (1,1,11) DO ECHO.


    PAUSE

    ```


    Figure 6.8 shows the screen displayed when this script is executed.


    Now compare the number of statements that it took to display this output to the
    number of statements you''ve used with previous methods in this book, as shown
    below.


    ```

    @ECHO off


    ECHO.

    ```'
