- img_proc: true
  md: '# Handling Arguments That Include Blank Spaces


    Sometimes a single argument may consist of more than a single word. In other words,
    it may include blank spaces. Unless you take special steps to mark the beginning
    and end of the argument, the Windows shell will treat each word as a separate
    argument, producing undesirable effects within your Windows scripts.


    To prevent this from occurring, make sure you remember to enclose multi-word arguments
    within a pair of matching double quotation marks before passing to a script. For
    example, suppose you had a script to which you wanted to pass the following arguments:


    ```

    C:\Temp\Rough Outline.txt

    C:\Temp\Sample Report.doc

    ```


    Since both of these files have file names that include blank spaces, you would
    need to surround both file names with double quotes before passing them to your
    script, as demonstrated below.


    ```

    Test.bat "C:\Temp\Rough Outline.txt" "C:\Temp\Sample Report.doc"

    ```


    The script, Test.bat, would then be able to reference these two file names at
    %1 and %2.


    # Working with Variables


    Now let''s turn our attention to understanding and working with variables. A variable
    is a reference to a location in the computer''s memory where your scripts can
    store and retrieve data. There are two primary types of variables that you will
    work with Windows shell scripts, environment variables, and script variables.
    Your scripts can access and use the values stored in environment variables. The
    other type of variable that you''ll use are script variables. A script variable
    is created during the execution of a script and then deleted when the script stops
    running.


    The Windows shell provides the SET command as your primary means for displaying,
    modifying, and deleting variables. The SET command supports several variations
    of syntax, as shown below.


    ```

    SET Variable=[Value]

    ```


    ```

    SET /A Expression

    SET /P Variable=[MessagePrompt]

    ```'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'When used in its first form, the SET command displays, creates, modifies, and
    deletes variables. Variable specifies the name of the variable to be displayed,
    created, modified, or deleted. Value specifies an optional data assignment.


    The second form of the SET command defines numeric variables. /k designates that
    the value stored in the variable is be treated as a number and Expression specifies
    the value assigned to the variable.


    The final format of the SET command allows you to interactively prompt the user
    to type input, which is then assigned to a variable. /P specifies that the SET
    command should prompt for user input. Variable defines the name of the variable
    to which the user''s input is assigned, and MessagePrompt is an optional text
    string that you can use to prompt the user with instructions on what you want
    him to enter.


    # Accessing Environment Variables


    Windows operating systems collect and store information about the computer and
    its users in a special database known as the Windows registry. The information
    stored in the registry is collected from a few sources. Some of the registry''s
    information is made available to you in the form of environment variables. There
    are two types of environment variables:


    +   * User environment variables provide information specific to the individual
    users.

    * System environment variables provide information specific to the computer and
    its execution environment.


    # Viewing Environment Variables


    On Windows XP, a number of environment variables can be accessed from the System
    Properties dialog using the following procedure:


    +   1. Click on Start, right-click on My Computer, and select Properties from
    the menu that appears.

    2. Select the Advanced property sheet.

    3. Click on the Environment Variables button located at the bottom of the dialog.
    The Environment Variables dialog appears, as shown in Figure 4.6.


    User variables associated with the currently logged-on user are displayed at the
    top of the dialog. In this example, two environment variables are shown, of which
    specify the location of different temporary folders.'
  merge: -1
  pgno: 116
- img_proc: true
