- img_proc: true
  md: 'The last four statements shown above start the creation of a new score card
    report. The first statement creates the new report using the > redirection character.
    This redirection character will either create the report if it does not already
    exist or overwrite it if it already exists. The remaining three statements append
    the name of the quiz and two blank lines to the report file.


    # Grading Player Results


    Next, the script begins to analyze the player''s answers to each of the quiz''s
    10 questions to see which ones the player got right and which ones got wrong.
    Because there is no way of knowing the case in which the player will choose to
    enter answers, the IF statement includes the /I switch, which results in a caseinsensitive
    comparison. The player''s answer is then compared to the correct answer. If the
    player got right answer, a series of ECHO statements is redirected to the report
    file stating so. Otherwise, the ELSE portion of the conditional test executes,
    redirecting a different set of ECHO statements to the report file. Finally, on
    whether or not the player answered correctly, the value of either the right or
    wrong variable is increased by one.


    ```

    IF %quest1== Steve (

    ECHO >> C:\TEMP\Quiz.txt

    ECHO 1. What was the Six-Million-Dollar Man''s first name? >> C:\TEMP\Quiz.txt

    ECHO >> C:\TEMP\Quiz.txt

    ECHO Your answer: Steve - Correct! >> C:\TEMP\Quiz.txt

    ECHO >> C:\TEMP\Quiz.txt

    SET /A right += 1

    ELSE (

    ECHO >> C:\TEMP\Quiz.txt

    ECHO 1. What was the Six-Million-Dollar Man''s first name? >> C:\TEMP\Quiz.txt

    ECHO >> C:\TEMP\Quiz.txt

    ECHO Your answer: %quest1 - Incorrect. >> C:\TEMP\Quiz.txt

    ECHO >> C:\TEMP\Quiz.txt

    SET /A wrong += 1

    )

    ```


    As you might expect, the code required to grade the remaining nine questions is
    essentially the same as shown above, for the sake of space, I have decided not
    to list it here. However, you will find it in the fully assembled script at the
    end of this chapter.'
