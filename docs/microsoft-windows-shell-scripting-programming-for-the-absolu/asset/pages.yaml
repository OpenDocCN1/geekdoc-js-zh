    # Logging Error Messages


    One way to handle it is to write to a log or report file for later review and
    analysis. This way, by reviewing the log file, you can observe problems that occur
    over time, including those that the user may not have bothered to report. For
    example, the following statements demonstrate how to create and append statements
    to an error log called ScriptLog.log.


    ```

    @ECHO off


    COPY *.bak C:\TEMP


    IF ERRORLEVEL 1 (

    IF EXIST C:\TEMP\ScriptLog.log (

    ECHO %date% %time% - Backup files copied to C:\Temp\ScriptLog.log

    ) ELSE (

    ECHO %date% %time% - Backup files copied to C:\TEMP > C:\Temp\ScriptLog.log

    )

    )

    ```


    GOTO :EOF


    This script begins attempting to copy any files found in the current working directory
    to the computer''s C:\TEMP folder. It then checks to if an error occurred. If
    an error did occur, the IF EXIST checks to see if the ScriptLog.log'
