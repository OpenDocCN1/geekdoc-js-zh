  md: '# Premier for the absolute beginner Series


    # the fun way to learn programming


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_399_0.png)


    # Let''s face it.


    C++, JavaScript, and Java can be a little intimidating. That''s why Premier Press
