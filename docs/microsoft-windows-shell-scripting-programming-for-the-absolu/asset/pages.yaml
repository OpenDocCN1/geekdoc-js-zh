- img_proc: true
  md: '# Improving Script Organization with Procedures


    As I have already stated, the CALL command can be used along with the LABEL statement
    to set up procedures. Unlike subroutines, which switch processing control to another
    part of the script and terminate at the end of the file, procedures execute and
    return processing control back to the statement that follows the CALL command
    that executed the procedure in the first place.


    The Windows shell supports two types of procedures, as outlined below.


    +   - Internal. A procedure that is defined within the script when called, executes
    and returns control back to the statement that follows the CALL command.

    - External. A call to another script. The calling script then waits for the called
    script to execute and terminate at which time the calling script begins executing
    again.


    # Setting Up Internal Procedures


    Internal procedures are similar to subroutines. However, unlike subroutines, they
    return processing control after they have finished executing, as depicted in Figure
    7.7.


    Like subroutines, internal procedures start with a LABEL and terminate with the
    GOTO :EOF statement. Procedures are called and executed by the CALL command, which
    has the following syntax:


    ```

    CALL :ProcedureName

    ```


    As you can see, the CALL statements begin with the CALL command followed by a
    space, a colon, and finally the name of the procedure. The format that must be
    followed when creating a procedure is outlined below.


    ```

    :ProcedureName

    --


    GOTO :EOF

    ```


    The beginning of the procedure is marked by a LABEL called :ProcedureName. The
    end of the procedure is marked by the GOTO :EOF statement. Everything in between
    makes up the procedure itself.'
  merge: -1
  pgno: 230
