- img_proc: true
  md: 'In addition, the Windows shell let''s you send output to different destinations,
    such as


    +   * The Windows command console display

    * A file

    * A printer


    # Examining Data Input and Output


    The Windows shell can work with three different command sources, as outlined below.


    +   * Standard Input. The location where the Windows shell looks for command input.
    By default, this is the computer''s keyboard.

    * Standard Output. The default location where the Windows shell sends all output.
    By default, this is the Windows command console.

    * Standard Error. The default location where the Windows shell sends all error
    messages. By default, this is the Windows command console.


    When you modify the Windows shell''s default source for input or output, you perform
    what is known as *redirection*. Input and output redirection is remarkably easy
    to set up and can be used to perform a number of useful tasks, including


    +   * Automatically supplying commands with input to process

    * Report generation

    * Error log file creation


    To support input and output redirection, the Windows shell uses a number of special
    characters. These characters and their function are outlined in Table 3.1.


    > In addition redirecting output to files, you can also send it to a printer by
    specifying the appropriate port number, such as LPT1.


    I''ll demonstrate how to work with these redirection operators in the sections
    that follow.'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'Table 3.1 REDIRECTION OPERATORS

    | Operator | Example | Description |

    | --- | --- | --- |

    | > | command > file | Sends output to a file or device |

    | < | command < file | Retrieves input from a file |

    | >> | command >> file | Appends output to a file |

    | 2> | command 2> file | Sends all error output to a file or device |

    | 2& | command 2& | Sends all error output to the same location as all normal
    output |

    | | command1 | command2 | Uses the output from one command as the input for another
    command |


    # Using Another Command''s Output as Another Command''s Input


    The | redirection operator enables you to feed, or pipe, the output of one command
    to another command as input. The best way I can explain this is by showing you
    example. First, let''s say that you created a text file called TestFile.txt, then
    added the following lines to it:


    +   Strawberry

    Apple

    Grape

    Blue Berry

    Orange


    One way to view the contents of this file from the Windows command console would
    be with the TYPE command, as demonstrated below.


    ```

    c:\scripts>TYPE TestFile.txt

    ```


    +   Strawberry

    Apple

    Grape

    Blue Berry

    Orange


    > The TYPE command displays the contents of files by sending its output to standard
    output. By default, this is the Windows command console.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_87_0.png)'
