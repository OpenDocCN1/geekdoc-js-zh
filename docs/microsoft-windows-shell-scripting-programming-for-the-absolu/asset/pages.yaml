  md: 'The script then makes three procedure calls before terminating its own execution.
    The first procedure called is :UpdatePath. This procedure appends the location
    of the WinZip folder to the end of the search path. This way, the Shell will be
    able to execute the WINZIP32.EXE command. Next, the :DisplayWarning procedure
    is called. This procedure displays a warning message that explains to the user
    what the script is about to do. The script waits until user presses a key, at
    which time the :CreateArchive procedure is finally called. This procedure executes
    the WINZIP32.EXE in minimized mode, telling it to create a new Zip file specified
    by ZipFileName and add all the files specified by ScriptFile to. The procedure
    then uses an ERRORLEVEL statement to check the value of the code returned by WINZIP32.EXE
    command to determine if an error occurred.


    Once executed, the script creates a new Zip file containing all .bat files that
    were located in the C:\Scripts folder. Figure A18 demonstrates how the Zip file
