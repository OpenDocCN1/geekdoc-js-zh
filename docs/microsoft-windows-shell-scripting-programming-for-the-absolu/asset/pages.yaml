  md: '# Summary


    In this chapter, you learned how to work with all of the forms of the IF statement
    supported by the Windows shell. You learned how to check for the existence of
    files, folders, and variables. You also learned to test for errors and figure
    out what version of the Windows shell is being used to run your scripts. On top
    of this, I showed you how to create multi-line IF statements as well as how to
    nest statements within another to create powerful conditional logic tests. You
    also learned to invert conditional tests using the NOT keyword. Finally, I showed
    you how to create the Guess a Number game, in which you learned how to use conditional
    logic to create a game that runs until the player successfully guesses a randomly
