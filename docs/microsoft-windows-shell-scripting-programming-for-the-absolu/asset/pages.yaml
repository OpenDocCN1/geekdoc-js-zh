  md: '# Handling Large Numbers of Arguments


    Using the information just presented, you should be able to create Windows shell
    scripts that can accept and process up to nine arguments at execution time. While
    this will certainly accommodate most situations, at some time you may find a need
    to create a script that can accept and process more than nine arguments at run
    time.


    When you think of script parameters, think of them as being lined up in a row
    with the first argument passed to the script lined up on the far left and the
    last argument passed to the script lined up on the far right. At most, the Windows
    shell allows you to access nine parameters at a time, as shown below.


    ```

    $1 $2 $3 $4 $5 $6 $7 $8 $9

    ```


    The Windows shell allows you to pass as many arguments as you want to your scripts.
    For example, the following list defines a collection of 12 arguments you might
    want to pass to a script.


    ```

    arg1 arg2 arg3 arg4 arg5 arg6 arg7 arg8 arg9 arg10 arg11 arg12

    ```


    The Windows shell automatically associates each argument with its parameter. For
    example, the first argument passed to the script would represent the script''s
    first parameter, as represented by $1.


    While the Windows shell won''t let you access more than nine arguments at a time,
    it allows you to pass as many arguments as you want. To access arguments passed
    to the script beyond the ninth one, you must learn how to use the SHIFT command.
    This command allows you to move to the left by all parameters representing arguments
    passed to your script. For example, the command moves all of the parameters to
    the left by one.


    ```

    SHIFT

    ```


    The net effect of the previous command is that the value stored in $2 becomes
    $1 and the value stored in $3 becomes $2, and as a result, the script''s ninth
    parameter ($9) frees up and is automatically assigned the value passed to the
    script by the tenth argument. Therefore, by using the SHIFT command repeatedly,
    you can create a script that can access every argument passed to it.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_114_0.png)


    If you wish, you can specify the parameter position at which you begin shifting
    arguments. For example, typing SHIFT /3 leaves the contents of the script''s input
    parameters stored in $1 and $2 unaltered but shifts the values stored in the rest
    of the script''s input parameters. Thus the values of the arguments stored in
    $3 - $9 will all be shifted to the left by one.'
  merge: -1
