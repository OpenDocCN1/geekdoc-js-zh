  md: '# Command line extensions are improvements made to Windows commands in later
    versions of Windows operating systems. By default, command line extensions are
    enabled. The only reason you might want to disable them is to allow an alert that
    uses the old version of a Windows command that does not support the execution
    of command line extensions. Many Windows commands support these extensions, including
    ASOC, CALL, CD, COLOR, DEL, ENDOCAL, FOR, FTYPE, GOTO, IF, MD, POPD, PROMPT, PUSHED,
    SET, LOCALCMD, SHIFT, and START.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_53_0.png)


    Lets look at a few examples of how to work with CMD. First, click on Start, Run,
    and then type CMD and click OK to start a new Windows shell session. This opens
    a new Windows command console which you can begin working with the Windows command
    prompt.


    If you want, you can start a new Windows shell session and pass it a command to
    execute at the same time by clicking Start, Run, and then typing CMD followed
    by a command as shown below.


    In this example, a new Windows command console will open and display the text
    message of Welcome in its title bar. Sometimes you may want to simply start a
    new Windows shell session, pass it a command, have the command execute, and automatically
    close the Windows command console. You can do this as follows.


    ```

    CMD /DEL C:\Temp\*.txt

    ```


    The CMD demonstrates how /K and /C switches are examples of mutually exclusive
    parameters. /K specifies that the Windows command console should remain open after
    executing the command whereas /C specifies that the Windows command console should
    close after the command completes processing.


    The next example demonstrates how to use a modifier to control the execution of
    the CMD command. In this example, the /T switch, which sets foreground and background-ground
    colors, is used to invert the Windows color scheme from white to black on white.


    ```

    CMD /T:FO

    ```


    In this example, the switch is /T. It has a modifier, which is preceded by the
    colon character. The first character in the modifier sets the Windows command
    console''s foreground color (e.g., the color of text) and the second character
    of the modifier sets the background color. You can specify a range of different
    foreground and background colors in the Windows command console, as shown in Table
    2.2.'
