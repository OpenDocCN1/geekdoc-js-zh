  md: '# Internal vs. External Commands


    The Windows shell works with two different types of commands: internal and external.
    Internal commands are built into the Windows shell, whereas external commands
    exist as separate executable files stored on the computer''s hard drive. Most
    Windows commands are found in \Windows\System32. Both internal and external commands
    follow the same basic syntax rules. Table 2.4 provides a listing of the Windows
    shell''s internal commands.


    ### TABLE 2.4 BUILT-IN WINDOWS SHELL COMMANDS

    | Command | Overview |

    |---||

