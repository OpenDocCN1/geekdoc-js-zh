- img_proc: true
  md: 'To execute Windows commands from the Windows command prompt, you type the name
    of the command followed by one or more optional arguments that tell the command
    you want to do it. Command arguments can consist of several different elements,
    including


    +   - Switches. Modify the way in which a command is processed. Switches consist
    of a forward slash followed by one or more characters. Each Windows command has
    its own unique set of switches.

    - Modifiers. Change the behavior of a switch. Modifiers consist of a colon followed
    by one or more characters. Each Windows command has its own set of modifiers.

    - Parameters. Arguments passed to commands for processing.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_50_0.png)


    If you are uncertain of a command''s syntax, you can view it from the Windows
    command console by typing Help followed by the name of the command. For example,
    if you type HELP DATE and press Enter, you will see the following:


    ```

    C:\HELP DATE


    Displays or sets the date.


    DATE [/T | date]

    ```


    Type DATE without parameters to display the current date setting and a prompt
    for a new one. Press ENTER to keep the same date.


    If Command Extensions are enabled the DATE command supports the /T switch which
    tells the command to just output the current date, without prompting for a new
    date.


    ```

    C:\

    ```


    A good way to gain an understanding of Windows command syntax is by looking at
    an example. The following example shows the command syntax of the CMD command.


    ```

    CMD [/A | /U] [/Q] [/D] [/E:ON | /E:OFF] [/F:ON | /F:OFF] [/V:ON | /V:OFF]

    [[/S] [/C | /K] string

    ```'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'As you can see, the syntax of the CMD command consists of its name, a collection
    of switches, some of which have modifiers, and a string which would consist of
    any data you wanted the CMD command to process (such as the name of a Windows
    shell script).


    You must follow a number of formatting rules when working with Windows commands.
    These rules are outlined below:


    +   * Spaces must be used to separate each component of the command

    * Arguments shown inside brackets are optional

    * Arguments inside brackets are not shown in italics must be typed exactly as
    shown

    * Arguments in italics represent values that you must supply

    * Arguments inside brackets and separated by a | | sign are mutually exclusive

    * Arguments that contain spaces must be enclosed within a matching pair of double
    quotes


    > > **DEFINITION**  When referring to Windows commands, the term *mutually exclusive*
    means that only one of the collection of options can be selected. For example,
    when executing the command you have the option of specifying the E:/ON or E:/OFF,
    but you cannot specify both options at the same time.


    In this book I have chosen to display Windows commands in upper case. Windows
    commands are not case-sensitive, which means you can type them using upper case,
    lower case, or a combination of upper and lower case and achieve the same results.
    For example, as far as the Windows shell is concerned, all of the following commands
    are equivalent:


    +   * ECHO Greetings

    * echo Greetings

    * Echo Greetings

    * EHo Greetings


    # # Starting Windows Shell Sessions


    You can use one of two commands to open Windows shell sessions. These commands
    are CMD and START. When executed from the Windows Run dial (click on Start, Run,
    type CMD, and click on OK), CMD opens a new Windows command console.'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'However, when executed within an open Windows command console, the CMD command
    opens a new Windows shell session within the current console. In contrast, the
    START command (which works only from within an already open Windows command console)
    starts a new Windows shell session by opening a new Windows command console each
    time.


    # Working with the CMD Command


    Most often, you will use the CMD command to initiate a Windows shell session.
    The syntax of the CMD command is shown below. Table 2.1 defines each of its switches.
    Don''t worry if you see some terms mentioned in the table that you have not yet
    learned. They will be explained as they are used throughout the rest of the book.


    ```

    CMD [/A | /U] [/E] | [/O] [/E:ON] | /E:OFF] [/F:ON] | /F:OFF] [/V:ON] | /V:OFF]

    [/S] [/C | /K] string

    ```


    | TABLE 2.1 CMD.EXE Command Switches |

    | Switch | Function |

    | /C | Executes the command and closes the Windows shell |

    | /K | Executes the command but does not close the Windows shell |

    | /S | Changes the handling of the string after the /C or /K switch |

    | /Q | Disables echo |

    | /D | Prevents the execution of AutoRun commands specified in the registry |

    | /A | Formats command output in ANSI format |

    | /U | Formats command output in Unicode format |

    | /T:FG | Sets the Windows command console''s foreground and background colors
    |

    | /E:ON | Enables extensions to the Windows shell required by certain commands
    |

    | /E:OFF | Disables extensions to the Windows shell (required by certain commands)
    |

    | /F:ON | Enables file and folder name completion |

    | /F:OFF | Disables file and folder name completion |

    | /V:ON | Allows for the delayed expansion of environment variables |

    | /V:OFF | Prevents the delayed expansion of environment variables |'
  merge: -1
  pgno: 52
