- img_proc: true
  md: '# What Can Shell Scripts Do?


    Windows shell scripts can accomplish any task that can be completed from the Windows
    command prompt. Despite continual efforts to improve the Windows graphical interface
    and to make easier for users by providing only a complete point-and-click experience,
    Microsoft has continued to update and expand the Windows command line functionality
    (e.g., each new operating system adding new commands and refines existing commands).


    Microsoft also adds command line access to many of its utility programs, allowing
    them to be accessed and controlled by scripts. For example, the Defragmenter utility
    (which reorganizes files stored on your disk drive for more efficient storage)
    can be run from the Windows graphical interface on Windows XP by selecting Start,
    All Programs, Accessories, System Tools, and then Disk Defragmenter. Alternatively,
    you can execute this utility from within a Windows shell script. For example,
    by typing defrag c /if you can automate the defragmentation of your computer''s
    drive using this utility.


    Windows shell scripts can be used to automate all of the following categories
    of tasks:


    +   - Complicated tasks. This category of scripted tasks includes any tasks that
    are highly subject to error when performed manually, such as the administration
    of system resources like disk drives and printers.

    - Repetitive tasks. These scripted tasks include any tasks that must be performed
    over and again, such as the deletion of certain file types from specific orders
    on a regular basis.

    - Lengthy tasks. These scripted tasks include any tasks that take too long to
    perform manually, such as the creation of a few hundred new user accounts.

    - Scheduled tasks. These scripted tasks include any tasks that must be run during
    off hours, at times when users and administrators are not using their computers
    (such as the Disk Defragmenter utility).


    You can develop shell scripts that perform an assortment of different tasks on
    Windows computers. Once completed, these scripts will help you work faster and
    more productive. For example, using Windows shell scripts, you can


    +   - Collect and display information about your computer

    - Manage Windows services

    - Manage shared folders and drives

    - Automate the creation of new user accounts

    - Create output files and reports

    - Process data stored in input files'
  merge: -1
  pgno: 28
- img_proc: true
  md: '+   * Create and manage scheduled tasks

    * Manage local and network printers

    * Set up connections to network folders and drives

    * Execute Windows commands or command line utilities


    # Supported Microsoft Operating Systems


    As mentioned previously, Windows shell scripting is supported on Windows NT, 2000,
    XP, and 2003. However, other Microsoft operating systems do not support it. These
    other operating systems include Windows 95, 98, and Me. Of course, you can still
    use old-style batch files to automate the execution of small collections of commands
    on the operating systems, but the ability to add programmatic logic on the level
    of Windows shell scripts is still missing. If you need to develop scripts for
    these operating systems, you will need to look at alternative scripting languages,
    which I will cover in the following sections.


    # Alternatives to Windows Shell Scripting


    While Shell scripting may be the easiest scripting language to learn, there are
    plenty of alternative scripting languages available from Microsoft and other third-party
    software developers. Below, I briefly describe some of these other scripting languages.
    However, if you are new to programming, I recommend that you first master Shell
    scripting before you consider moving on and trying to learn the more complicated
    scripting languages.


    # The Windows Script Host


    The Windows Script Host, or WSH, provides Microsoft operating systems with an
    advanced script execution environment. Using WSH, you can develop scripts that
    can execute on any Windows operating systems starting with Windows 95. This means
    that unlike Windows shell scripts, which run only on Windows NT, 2000, XP, and
    2003, WSH scripts can also run on computers that use Windows 95, 98, or Me (provided
    that WSH is installed on these computers). The WSH runs as an addon to the Windows
    operating system and can be enabled or disabled. By default, WSH is installed
    and enabled on Windows 2000, XP, and 2003.


    > **DEFINITION** The term execution environment refers to the grouping of resources
    that scripts require in order to execute, such as a script interpreter that translates
    script states into instructions that the computer can execute.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# WSH Advantages and Disadvantages


    When deciding whether it is better to use Windows shell scripting or the WSH to
    automate a task, there are a number of criteria to consider. WSH provides a more
    comprehensive execution environment with direct access to many resources. For
    example, a WSH script can write messages to Windows event logs or read and write
    to the Windows registry. Therefore, if your scripts need to access these resources,
    using the WSH may make more sense. However, a great tasks never require access
    to such resources, negating these WSH advantages.


    > DEFINITION

    The Windows application event log is a file maintained by the Windows NT, 2000,
    XP, and 2003 systems where application errors and messages are recorded for later
    audit review.


    > DEFINITION

    The Windows registry is a special built-in database that is a part of all Windows
    operating systems, starting with Windows 95, where configuration information is
    stored regarding system, application, hardware, and users settings.


    To use the WSH you need to know how to write scripts using at least one scripting
    language, such as VBScript or JavaScript. You also have to learn how to work with
    the WSH execution environment.


    Typically, it makes sense to use the WSH to create scripts when


    +   - You have expertise with another scripting language such as VBScript or JavaScript
    and need access to a programming feature provided by these languages only

    - You need to run your scripts on Windows operating systems other than Windows
    NT, 2000, XP, and 2003


    # IN THE REAL WORLD


    If you have access to the Windows Resource Kit for the operating systems for which
    you are developing scripts, you can use command line utilities provided by the
    Resource Kit to indirectly access system resources. For example, using the LOGEVENT
    command line utility you can write to the Windows application event log from within
    a shell script. Similarly, using the REG command line utility, you can access
    and change information stored in the Windows registry. To learn more about Windows
    Resource Kits, visit www.microsoft.com/windows/reskits/default.asp.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '+   • You cannot find a Windows or Resource Kit command or command line utility
    that can perform a specific task


    +   • You need to communicate directly with users via graphical pop-up dialogs


    +   • You need to work directly with other applications such as Microsoft Word
    or Excel


    +   • You need to perform advanced file and folder administration


    In contrast, you may want to work with Windows shell scripting when


    +   • You are writing a script that will run on Windows NT, 2000, XP, or 2003


    +   • You know of a command or conEX line utility that can perform the desired
    task


    +   • You do not have expertise with WSH-compatible scripting language


    +   • You want to automate the execution of Windows command or command line utilities


    +   • You want to execute a collection of Windows commands repeatedly


    # WSH Complexities


    In order to write scripts that work with the WSH, you must first learn how to
    write scripts using a WSH supported scripting language. By default, the WSH provides
    support for VBScript and JavaScript. VBScript is a scripting language that consists
    of a subset of the Visual Basic programming language. JavaScript is Microsoft''s
    WSH-compatible version of Netscape''s JavaScript scripting language. In addition,
    you can use third-party WSH-compatible scripting languages that allow the WSH
    to run scripts written in Perl, Python, and REXX scripting languages.


    Unlike Windows shells, other scripting languages involve how to use language-specific
    statements and commands, many of which are not very Unlike. Therefore it takes
    longer to master these languages. In addition to learning how to develop scripts
    using a different scripting language, you must also learn how to work with the
    WSH object model in order to develop WSH scripts. The WSH core object model provides
    access to Windows resources such as printers, files, and folders by representing
    them as objects that scripts can access and manipulatematically. The WSH object
    model is complex and requires a great deal of time and effort to master. First-time
    programmers are better off learning how to write Windows shell scripts. The Windows
    shell scripting language uses familiar Windows commands and does not require mastery
    of an object model, thus allowing first-time programmers to focus on learning
    core programming concepts'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'and logic without the requirement of learning advanced concepts. In addition,
    Windows scripting provides an excellent platform for jumping over to other many
    advanced scripting and programming languages.


    # Third-Party Scripting Languages


    In addition to Windows scripting and the WSH, you can also develop scripts on
    Windows based computers using any number of third-party scripting languages. One
    scripting language that you could use is Perl. Perl stands for Practical Extraction
    and Reporting Language. Perl started out as a scripting language for the UNIX
    operating system where it was originally used to read and extract information
    from text files and to create new reports.


    Compared to Windows shell scripting, Perl is a complicated scripting language
    to master, especially as a first language. Over the years, support for Perl has
    been added to most major operating systems. Perl can be used as a WSH-compatible
    scripting language, allowing you to create scripts that leverage the strengths
    of the WSH.


    Another scripting language with a UNIX heritage that has been ported to Windows
    is Python. Python was named after the comedic troupe Monty Python. Python enjoys
    enormous support among Linux users and is generally considered easier to learn
    than Perl. A version of Python that is available is compatible with the WSH. However,
    compared to Windows shell scripting, it is still a difficult first language to
    master.


    Another scripting language available to Windows users and administrators is REXX.
    REXX stands for Restructured Extended Extractor language. REXX was originally
    developed as a mainframe scripting language. IBM made it the built-in scripting
    language on its OS/2 operating system. Today, there are numerous versions of REXX
    available for Windows.


    # Understanding the Windows Shell


    To become an effective Windows shell script programmer, you must become intimately
    familiar with the Windows shell. The Windows shell is a text-based interface to
    the Windows operating system as opposed to the Windows desktop, which is a GUI-based
    interface. Figure 1.6 depicts the Windows shell and its relationship to the operating
    system and the user.


    The Windows shell is accessed through the Windows command console. The Windows
    shell accepts user commands and translates them into a format that can be processed
    by the operating system. It displays any output returned by the operating system
    back in the Windows command console.'
  merge: -1
  pgno: 32
