    # Understanding Windows Shell Script Errors


    No matter how a good programmer becomes, one thing will always remain true—errors
    happen. Errors can be especially frustrating to programmers who are just getting
    started. One of the goals of this chapter is to help prepare you for dealing with
    errors when they occur. Another goal is to provide advice and tips for avoiding
    errors in the first place. However, the reality is that some errors simply cannot
    be avoided; often the best you can hope is to set up your scripts to terminate
    as gracefully as possible, perhaps by logging the error or displaying a user-friendly
    error message.'
