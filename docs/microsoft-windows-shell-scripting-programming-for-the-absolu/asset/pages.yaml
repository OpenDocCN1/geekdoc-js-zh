    # Working with Third-Party Applications


    You can create Windows shell scripts that interact with and control many Windows
    applications developed by software developers other than Microsoft. You can do
    this because many software developers include built-in command line support for
    their applications, allowing you to control the application from the Windows command
    line.


    The amount of functionality of an application’s command line interface will vary.
    Some developers provide no command line functionality, others provide basic application
    functionality, while some others attempt to make available every feature and function
    that is built into their GUI interface.


    An excellent example of a third-party application that exposes application functionality
    via the command line is WinZip. WinZip is a popular file-compression and archive-management
    program. WinZip is a shareware application that you can download and try before
    deciding whether you want to purchase it. You can download a copy of the latest
    version of WinZip from www.winzip.com.'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'To start WinZip, double-click on its executable file, named WINZIP32.EXE, which
    by default is installed in C:\ProgramFiles\WinZip. However, WINZIP32.EXE also
    provides a command line interface which gives you the ability to create and extract
    Zip files under the control of Windows shell scripts. The syntax for WINZIP32.EXE
    is outlined below.


    ```

    WINZIP32 [-min] [action] filename[.zip] files

    ```


    The -min parameter enables WinZip to run minimized so that you won''t see its
    GUI when your scripts run it. You must select from one of the following switches
    to define the action parameter:


    +   - -a. Create a new Zip file.

    - -f. Refresh an archive.

    - -u. Update an existing archive.

    - -m. Move an archive.


    You can include any of the following parameters in place of the options placeholder:


    +   - -r. Adds files and folders to the Zip file.

    - -p. Includes information about folder membership for each file.

    - -hs. Includes any hidden and system files.

    - -s. Specifies an optional password, which results in a Zip file that is protected
    and encrypted. The password is specified using the format of -setPassword.


    You may also optionally specify any of the following switches in place of the
    options placeholder:


    +   - -ex. Applies WinZip''s maximum compression rate.

    - -en. Applies WinZip''s default compression rate.

    - -ef. Applies a lower than normal compression rate.

    - -es. Applies the lowest available compression rate.

    - -e0. Creates an uncompressed Zip file.


    Finally, the WINZIP32.EXE files parameter is used to specify the file or files
    to be added to the Zip file. For example, the following command demonstrates how
    to use the WINZIP32.EXE command to create a new Zip file called TestArchive in
    the C:\Tmp folder and to add to all .txt files found in the C:\Reports folder.


    ```

    WINZIP32 -A C:\Tmp\TestArchive.zip C:\Reports\*.txt

    ```


    The following Windows shell script demonstrates how to leverage WinZip''s built-in
    command line support to automate the creation of a new Zip file. In this example,'
  merge: -1
  pgno: 357
- img_proc: true
  md: 'the script will create a Zip file that stores all of the Windows shell scripts
    found in the computer''s C:\Scripts folder.


    ```

    @ECHO off


    ********************************************************************

    REM

    REM Script Name: Zipper.bat

    REM Author: Jerry Ford

    REM Date: August 1, 2003

    REM

    REM Description: This script demonstrates how to execute WinZip functionality

    REM from within Windows shell scripts.

    REM

    ********************************************************************


    REM ***** Script Initialization Section *****


    REM Specify the location where WinZip was installed.

    SET InstallLocation=D:\Program Files\WinZip


    REM Specify the files to be zipped up.

    SET ScriptFileLoc=C:\Scripts\*.bat


    REM Specify the name of the Zip file that is to be created

    SET ZipFileName-Name=C:\Scripts\Script.ZIP


    REM Call the procedure that temporarily adds the WinZip folder to the

    REM search path.

    CALL :UpdatePath


    REM Display a message allowing the user an opportunity to halt script

    REM execution.

    ```'
