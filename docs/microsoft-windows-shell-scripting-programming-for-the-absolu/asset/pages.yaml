  md: '# Project Preview:

    The Unpredictable Command Prompt


    This chapter''s main project is called the Unpredictable Command Prompt. It demonstrates
    how to randomly alter the appearance of the Windows command console. Among the
    Windows command console features customized by the script are the foreground and
    background colors of the Windows command console, the text displayed in the title
    bar, the format of the Windows command prompt, and the message that is initially
    displayed when the Windows command console first appears.


    The Unpredictable Command script randomly configures one of three different sets
    of configuration settings each time it is executed. For example, as Figure 2.1,
    in one scenario the user may be greeted by name and told to Code well and Prosper.
    The text displayed in the Windows command console appears in green on a black
    background.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_48_0.png)


    Figure 2.2 shows a second view that the user may see. In this case, the user is
    greeted by the message, "Hello. It is good to be working with you today!" In addition,
    the color of the foreground text is changed to yellow and the Windows command
    prompt now displays both the day of the week and the date.


    Figure 2.3 shows the final view the user will see. In this case, the text message,
    "Boo! Did I scare you?" is displayed and the text appears as black characters
    on a yellow background.


    This script also gives you a sneak peek of several other important Windows scripting
    techniques, which are explored further later in the book. These techniques include
    the storage of data in variables, the use of conditional logic to control script
    execution, and the ability to perform numeric comparisons.'
