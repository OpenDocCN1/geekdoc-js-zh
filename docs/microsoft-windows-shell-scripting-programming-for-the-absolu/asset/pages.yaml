  md: '# Changing Colors


    By using the COLOR command, you can take control of the foreground and background
    colors displayed in the Windows command console. The syntax of the COLOR command
    is outlined below.


    ```

    COLOR BF

    ```


    The COLOR command requires two arguments. B represents a numeric value that specifies
    the background color to be used, and F represents the foreground color (e.g.,
    the color of displayed text). The COLOR command supports the same colors as the
    CMO command, which were listed earlier in this Table 2.2.


    By default, the Windows command console displays text in white on a black background.
    Using the COLOR command, you can change these settings as demonstrated below.


    ```

    COLOR E4

    ```


    This command modifies the Windows command console so that it displays all text
    in red on a yellow background. To restore the Windows command console color settings
    to their default setting, you can type COLOR OF, or as a shortcut, just type COLOR
    and the Windows command console default white-on-black color scheme will be restored.


    # CLS


    The Windows command console automatically scrolls text off the display as it fills
    up. However, this can make the console cluttered and difficult to read. If you
    prefer, you can use the CLS command to clear out all currently displayed text,
    leaving only the command visible. The CLS command''s syntax is outlined below.


    ```

    CLS

    ```


    As you can see, the CLS command does not accept any arguments, making it extremely
    easy to use.


    # ECHO


    The ECHO command gives you the ability to display text messages in the Windows
    command console. Using the ECHO command you can create scripts that keep the user
    informed about their execution status and display their results. The syntax of
    the ECHO command is outlined below.


    ```

    ECHO [ON | OFF] [message]

    ```'
