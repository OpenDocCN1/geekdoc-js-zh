  md: '# Conditional Command Execution


    The Windows shell provides the ability to chain together the execution of multiple
    commands using a technique referred to as compound commands. Compound commands
    use a collection of reserved characters, shown in Table 3.2, to set up a relationship
    between two or more commands.


    | TABLE 3.2 COMPOUND COMMAND OPERATORS |

    | Operator | Example | Description |

    | --- | --- | --- |

    | & | command & command | Runs the first command followed by the second command
    |

    | && | command && command | Runs the second command if the first command was successful
    |

    | || | command || command | Runs the second command if the first command had an
    error |

    | () | (command || command) || Defines the order in which |

    | | (command & command) | commands are to be executed |


    # Chaining Two Commands Together


    The most straightforward type of command is created using the & operator. Using
    this operator, you can chain together the execution of any two commands, as demonstrated
    below.


    ```

    MKDIR C:\Scripts\Reports & COPY *.txt C:\Scripts\

    ```


    This command begins by executing the MKDIR command, which creates a new directory
    or subfolder called Reports in the C:\Scripts folder. Once this command completes
    execution, the second command in the command executes. In this example, the COPY
    copies all files with a .txt extension in the current working directory to C:\Scripts\Reports.


    # Setting Up Conditional Command Execution


    A more advanced compound command is created using the && operator. This operator
    executes the second command only if the first command was successful. Otherwise,
    the execution of the second command is omitted. For example,'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'following statement is set up to display all .log files found in the current
    working directory and copy those log files, if any exist, to C:\Scripts\LogFiles.


    ```

    DIR *.log && COPY *.Log C:\Scripts\LogFiles

    ```


    The || compound operator is the exact opposite of the && operator, performing
    the second command only in when the first command fails. For example, the following
    compound command by displaying all .log files in the current working directory.
    If no .log files are found, the result of the ECHO statement is redirected to
    C:\Scripts\Debug.


    ```

    DIR *.log || ECHO No .log files found >> C:\Scripts\Debug.log

    ```


    The Windows allows you to chain more than two commands at a time if needed. For
    example, the following statement chains three commands:


    ```

    DIR *.log & COPY *.txt C:\Temp & ECHO .LOG files have been copied.

    ```


    # Grouping Commands


    The Windows shall enables you to explicitly group commands to dictate the order
    in which they are executed. This is accomplished using the () operator. For example,
    the following statement consists of five different commands:


    ```

    CD C:\Scripts\Reports && (COPY *.txt A:\ & COPY *.bak A:\) && (DEL *.txt & DEL
    *.bak).

    ```


    The first command changes the current working directory to C:\Scripts\Reports.
    The first && operator ensures that the remaining commands execute only if the
    first command is successful. The second and third commands have grouped together
    to ensure they execute before the last two commands are processed, which execute
    only if the second and third commands are both processed successfully. These two
    commands copy all .txt and all .bak files to the computer''s floppy drive (A:\).
    Finally, if both of these commands executed successfully, the last two commands
    delete all .txt and .bak files found in C:\Scripts\Reports.


