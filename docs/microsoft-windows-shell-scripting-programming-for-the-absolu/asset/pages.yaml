    \ (\n  CLS\n  ECHO Fatal error occurred\nGOTO :EOF\n)\n```\n\nAs you can see,\
    \ even with this small example, the multi-line form of the IF statement makes\
    \ things a lot easier to read.\n\n# Creating Advanced Conditional Logic Tests\n\
    \nIt won't take long before you find yourself wanting to create Windows shell\
    \ scripts that require the use of some pretty complicated logic. For example,\
    \ you may want to test a condition and then, based on the results of the test,\
    \ perform one or more additional tests. To facilitate this type of logical thinking,\
