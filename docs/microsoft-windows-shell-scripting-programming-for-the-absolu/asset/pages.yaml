  md: '# Variable String Manipulation


    The Windows shell also provides you tools for manipulating the contents of variables
    containing text strings. The first programming technique is known as string substitution
    and involves the search for replacement of a portion of text within a string.
    The second technique is to perform a substring operation. A substring operation
    is one which you extract a portion of text from a text string.


    # Replacing a Portion of a String


    Using string substitution, you can replace all or part of one string with another
    string. You might find string operations useful in situations where you need your
    script to edit arguments passed to the script or to edit input provided by the
    user. For example, you might create a script that prompts the user to reply by
    entering the letter Y in order to continue running. However, some users may instead
    respond by typing Yes instead. By performing a substring operation on the input
    provided by the user, you could replace the Yes string with a Y string.


    The syntax you must follow when performing string substitution operations is outlined
    below.


    ```

    %VariableName=ReplacementString=OriginalString%

    ```


    %VariableName is the name of a variable to which you want to assign the result
    of the substring operation. It is immediately followed by the colon character.
    ReplacementString is a placeholder representing the string to be substituted (e.g.,
    the Y string in the previous example) and OriginalString is a placeholder representing
    the string in which the replacement is to occur (e.g., the Yes string in the previous
    example).


    Below is an example of string substitution in action. In this example, a variable
    called x is set equal to a small text phrase. Then, using string substitution,
    a second variable z is set equal to the value of x, but only after a substring
    operation has been completed. In the substring operation, the word blue is substituted
    for the word gray.


    ```

    ECHO off


    SET x=The sky above was quite gray

    SET z=%x:gray=blue%


    ECHO %%

    ```


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_125_0.png)'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# If you save and run this script, you''ll see the output shown below.


    The sky above was quite blue


    You may also use string substitution to delete portions of a text string. To accomplish
    this trick, leave the replacement string blank. For example, to remove the word
    gray from the string in the previous example, you would set the value of z as
    shown below.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_126_0.png)


    ```

    SET z=%x:gray=-%

    ```


    # Extracting a Portion of a String


    Another string manipulation technique supported by the Windows shell is substring
    operations, in which a portion of a text string is extracted from the string.
    You simply specify the starting location of the first character in the string
    to be extracted and, optionally, the number of characters to be extracted from
    that point. What do you do with the substring once you have extracted it is up
    to you. You might assign it as the value of a new variable or reassign it back
    to the original variable, replacing the original string with the substring.


    The syntax you follow when performing a substring operation is outlined below.


    ```

    %%VariableName:-StartPosition,Length%

    ```


    First you specify the variable name. Then you add the colon and the tilde (~)
    exactly as shown above. Next the StartPosition placeholder is used to specify
    the position of the first character in the substring. Length is optional. If Length
    is omitted, the substring will consist of all characters starting at StartPosition
    all the way to the end of the string. When Length is specified, the substring
    will consist of all the characters beginning at StartPosition plus the number
    of specified characters to the right of the starting position. To see how substring
    operations work, look at the following example:


    ```

    %CHO off

    ```


    ```

    SET x=The sky above was quite gray

    SET z=%x:-0,7%

    ```


    ```

    %CHO %z%

    ```


    In this example, the second SET statement extracts a substring from a text string
    stored in the x variable. It then assigns the substring text to a variable called
    z.'
