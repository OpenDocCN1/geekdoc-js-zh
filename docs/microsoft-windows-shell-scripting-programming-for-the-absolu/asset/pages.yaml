    # Adding a Graphical Interface


    As you saw in the previous chat example, you can take advantage of the Windows
    NET SEND command to display information to users in graphical pop-up dialogs.
    This provides an effective alternative for presenting users with information.
    But what about collecting user information graphically? Well, that can be done
    as well. To do so, you will need to download any of a number of freely distributed
    utility programs from the Internet. One such utility is called MESSAGEBOX.EXE,
    which you can download by visiting http://optimumx.com/ and Another similar utility
    is called MSGBOX.EXE, which you can download from http://claudiosoft.online.fr/msgbox.html.


    You can write Windows scripts that can execute either of these utility programs
    and pass messages to be displayed. You can also specify which buttons you want
    displayed (OK, OK/Cancel, Yes/No, etc.). The MessageBox.EXE downloads as a Zip
    file. One way to use it is to unzip its contents into the folder where your Windows
    shell scripts are stored. To learn its syntax, open a Windows command console
    and change the current working directory to the folder where you unzipped the
    utility and type MSGBOX as demonstrated below.


    ```

    C:\MSGBOX

    ```


    Claudiosoft MessageBox 1.2


    This program is FREEWARE for private use.


    (C) Claudiosoft 2001


    Usage : MsgBox Message Title Flag | YESNO | OKCANCEL | YESNANCEL'
