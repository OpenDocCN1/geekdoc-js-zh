  md: '# Applying Conditional Logic to Control Script Execution


    While you can always use compound commands to apply limited conditional logic
    when developing Windows shell scripts, the IF statement provides a significantly
    more flexible and powerful alternative that is capable of performing conditional
    tests on a wide range of different situations. The IF statement comes in many
    different flavors, as outlined in Table 5.1.


    Table 5.1 TYPES OF IF STATEMENTS

    | Type | Function |

    |---|---|

    | IF | Performs a true/false test to determine whether one or more commands should
    be executed |

    | IF...ELSE | Executes either of two sets of commands based on the outcome of
    a conditional test |

    | IF DEFINED | Determines whether a variable actually exists |

    | IF ERROR | | the exit code of the previously executed command |

    | IF CMDEXTVERSION | Retrieves a numeric value indicating the current version
    of the Windows shell |

    | IF EXIST | Determines whether a file or folder exists |

    | IF NOT | Performs a conditional test and takes an action based on a negative
    result |


    # Working with the IF Statement


    The IF command performs a conditional test and executes a command if the result
    of the test proves to be true. People perform this same type of test all the time.
    For example, when I go to lunch today I''ll probably decide whether or not I want
    to eat steak based on the amount of cash I have in my wallet. If I have $10, I''ll
    order the steak. Otherwise, I won''t. The IF statement works in the same way as
    yours.


    ```

    IF condition1 == condition2 command

    ```


    Loosely translated, the above statement reads like this: "If the first specified
    condition equals the second condition, then the specified command will be executed."
    Otherwise it won''t be executed. Look at the following example:


    IF %OS% == Windows_NT ECHO The script is running on a supported operating system'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'In this example, the value assigned to an environment variable called OS is
    compared to a text string that consists of Windows_NT. If OS has a value of Windows_NT,
    the result of the test will be true and the ECHO command that follows the test
    will execute automatically. Otherwise, the ECHO command will be skipped.


    ```

    The %0s variable identifies the type of operating system currently running. This
    variable will be set equal to Windows_NT on any computer running a Windows NT,
    2000, XP, or 2003 operating system.

    ```


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_149_0.png)


    Now that the previous example blank spaces were included both before and after
    the double equals sign. Although not required, adding blank spaces makes this
    easier to read. Now look at another example. In this example, the statement is
    set up to compare the value stored in the first argument passed to the script
    against a text string of PLAY. If the results of the test are true, then the ECHO
    command will be executed.


    ```

    @ECHO off

    IF %1 -- ECHO Ready to begin play.....

    ```


    Save this example as a script and run it by entering the name of the script followed
    by a blank space and then the word Play. You should see the following output displayed:


    Ready to begin play.....


    Now, run the script again and pass it an argument other than the word Play or
    just don''t enter anything at all. As you''ll, the following error will appear:


    ```

    ECHO was unexpected at this time.

    ```


    This error occurred because the value of %1 was not set and the Windows shell
    ended up with a logical statement that looked like the one shown below. Since
    this statement is syntactically incorrect, the error occurred.


    ```

    IF -- ECHO Ready to begin play.....

    ```


    There may be times when you want your scripts to keep on running even when they
    are started without any arguments. For example, you could perform a test to see
    if an argument was supplied, and if it wasn''t, you could use a default value
    that you had coded into your script. To prevent the above error from appearing,
    you should enclose both of the conditionals tested by the IF statement within
    a pair of matching double quotation marks, as shown below.


    ```

    IF "%1*" == "Play" ECHO Ready to begin play.....

    ```'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'Using double quotation marks in this manner does not affect the results of
    the test when both conditions are equal. They still remain equal even with the
    addition of the double quotation marks. However, in the case the argument is missing,
    formatting it statement in this manner prevents an error the Windows shell would
    interpret the command as shown below. Syntactically, this passes the muster and
    allows the script to continue executing without an error.


    ```

    IF == "Play" ECHO Ready to begin play.....

    ```


    There are other times when you will want to enclose your variables within double
    quotation marks. For example, there may be a time when you write a script that
    prompts the user for input. However, you may have no way of knowing whether users
    will include one or more blank spaces in their response. To ensure the blank spaces
    are properly interpreted, you should enclose the variable within double quotes.
    You may remember from Chapter 1, "Introducing Windows Shell Scripting," when you
    created the Knock joke game you had to make the player responsible for enclosing
    his response double quotation marks. Using this new technique, you can rewrite
    the script and unburden the player from responsibility.


    In the previous example, you compared a variable''s value against a hard-coded
    text string. However, you can easily compare the values stored in two variables,
    as demonstrated below.


    ```

    SET hisname=Alexander

    SET hername=Molly

    IF %hisname%== %hername% ECHO We have a match!

    ```


    When comparing string values against one another, the Windows shell examines not
    only the text of both strings but also their case. Therefore, for example, it
    would interpret x and X as not equal. However, if you wish, you can override this
    case-sensitivity requirement and perform a case-insensitive comparison by using
    the /I switch, as demonstrated below.


    ```

    SET hisname=Chris

    SET hername=Chris

    IF /I %hisname%== %hername% ECHO We have two people named Chris with us today.

    ```


    In addition to determining whether two strings are equal, the IF statement provides
    the ability to perform a host of mathematical comparisons. For example, the following
    statements demonstrate how to compare the values stored in two numeric variables.'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'SET /A totalcount = 10

    SET /A currentcount = 10

    IF %totalcount% = %currentcount% ECHO Both values are the same


    # Providing for an Alternative Course of Action


    By itself, the IF statement provides the ability to test two conditions and take
    action when the result of the test is true. But what if you want to take one action
    if the result is true and a different action if the result of the comparison is
    false? The solution to this dilemma is to append the ELSE keyword to the IF statement.
    The version of the IF statement has the following syntax:


    ```

    IF condition1 == condition2 (command1) ELSE (command2)

    ```


    If both conditions are equal, command1 is executed; otherwise, command2 is executed.
    You place both commands inside parentheses for the Windows shell to recognize
    the ELSE portion of the statement. The following statement demonstrates one particularly
    good use of IF...ELSE statement:


    ```

    IF "%OS%" == "Windows_NT" (ECHO Script now executing) ELSE (GOTO :EOF)

    ```


    In this example, the IF statement begins by checking to see if the script is executing
    on a computer running Windows NT, 2000, XP, or 2003. If the result of the comparison
    is true, then a message announces that the script will now begin executing. Otherwise,
    if the comparison results in a value of false, the ELSE portion of the statement
    executes, in which case a GOTO :EOF causes the script to terminate its own execution.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_151_0.png)


    By including a check of the OS variables at the beginning of your Windows shell
    scripts, you can prevent accidental execution on unsupported operating systems
    such as Windows 95, 98, or Me. These operating systems lack a robust script-running
    environment, and while your scripts will run on them, they probably won''t run
    for long before an error occurs.


    # Determining Whether a Variable Already Exists


    Errors occur when your Windows shell scripts run into something unexpected. One
    example of something unexpected would be a missing environment variable. For example,
    suppose you created a script that accesses an environment variable called ScriptFolder,
    which you had created some time ago to store the location of the folder where
    you keep your shell script files. If you were to run this'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'script on any other computer; without first remembering to create a new instance
    of the environment variable on the other computer, your script would probably
    fail when it tried to reference a variable that was not defined. This is because
    the Windows shell returns an empty value any time it is unable to locate a variable.


    Depending on how you wrote your script, what it was designed to do, and at what
    point in the script the variable reference occurred, the results could unpredictable.
    As a result, your script may have done nothing, or it may have the opportunity
    to complete a portion of its task, leaving you to manually figure out what was
    and not done and potentially having a mess to clean up.


    However, you could avoid this problem by adding code to the beginning of your
    script that would prevent it from running in the event that it could not find
    your custom environment variable. This is accomplished using the IF DEFINED statement,
    which has the following syntax:


    ```

    IF DEFINED variable command

    ```


    For example, the following statement demonstrates how to determine an environment
    variable named ScriptFolder has defined:


    ```

    IF DEFINED ScriptFolder SET sourcefolder=ScriptFolder%

    ```


    In this example, a check is made to determine whether the ScriptFolder variable
    has been defined. If it has been defined, then script variable is defined and
    set equal to the value stored in ScriptFolder. Otherwise, the script variable
    is not defined.


    In certain cases you may be able to provide your scripts with default settings
    that it can use in the event that they are unable to locate environment variables.
    For example, by adding the ELSE keyword to the previous example, you could specify
    a default folder to be substituted when necessary.


    ```

    IF DEFINED ScriptFolder (SET sourcefolder=$ScriptFolder%) ELSE (SET sourcefolder=C:\Scripts)

    ```


    # Keeping an Eye Out for Errors


    You''ve already experienced more than one error as you have followed along with
    this book and tried to duplicate the scripts that you have seen. Some errors are
    your fault. For example, you might use the wrong syntax when working with a command.
    This is referred to as a syntax error. You might also create an error by trying
    to tell your scripts to do something they cannot, such as trying to multiply a
    number and a text string. We call these logical errors. Another category of errors
    is run-time errors, which occur when a script is executing and runs into a problem
    that is not the result of a syntax or logical'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'problem. For example, a run-time error would occur if a script tried to delete
    a file that did not exist. It might be that the application creates this file
    every night wasn''t run like it was supposed to be on a given night. Perhaps someone
    renamed the file. There could be many reasons why a run-time error might occur.


    You can prevent many syntax errors by double-checking your code before running
    your scripts. You can prevent many logical errors by taking the time to properly
    design your script before you begin on it and by carefully testing it as you develop.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_153_0.png)


    Even the best programmers run into syntax and logical errors, so don''t be shocked
    when they happen to you. To help you work through these types of situations, I''ll
    give you some basic debugging tips in Chapter 8, "Debugging and Error Handling"


    One way to deal with run-time errors is to anticipate places within your scripts
    where errors are likely to occur, and then test to see if they occur. You can
    do this using the IF ERRORLEVEL statement, which checks the exit code of the previously
    issued command.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_153_1.png)


    An exit code (or return code) is a numeric value returned by commands that indicates
    whether they ran successfully or experienced an error.


    # IN THE REAL WORLD


    Almost every Windows command and utility program provides information in the form
    of a numeric exit code. This code is returned by the command to the resource that
    invoked it (e.g., your Windows shell script). The value of the exit code indicates
    whether the command thought that it ran correctly. Commands that process out errors
    will return an exit code of 0. Any value higher than 0 indicates some type of
    error. Many Windows commands and utilities document their possible range of exit
    codes and their meanings. You may be able to find information about the possible
    range of exit codes for a given command or utility by checking the Windows Help
    system or searching by www.microsoft.com. If you''re working with a command or
    utility provided by a third-party software developer, you can consult both the
    supplied documentation and the vendor''s Web site.


    You can use either of two versions of the IF ERRORLEVEL statement when developing
    your Windows shell scripts. The syntax for the first version of the IF ERRORLEVEL
    statement is outlined below.


    ```

    IF ERRORLEVEL exitcode command

    ```'
