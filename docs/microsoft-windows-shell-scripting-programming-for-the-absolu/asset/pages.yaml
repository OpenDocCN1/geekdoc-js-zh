  md: '# 216


    # TRAP


    External scripts and the calling script are running within the same instance of
    the Windows shell. This means that the called script has access to any script
    variables already defined by the calling script. This also means that any changes
    to the script variables by the calling script will be in effect when the calling
    script begins executing again. So, unless you intend that the calling and called
    scripts share script variables in this manner, be sure that you use different
    sets of variables within each script.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_238_0.png)


    # Windows Script Programming for the Absolute Beginner


    One advantage of this redesigned process is that it helps further isolate the
    subroutines for debugging purposes. In other words, if I find that I need to modify
    the statements stored in one of the procedures, I can do without affecting the
    statements stated in the main script or in the other external procedures. As a
    result, the effects of a type are minimized and isolated to just the procedure
    instead of an entire script.


    # TRICK


    As you begin writing and more Windows shell scripts, you may find that you begin
    to rewrite common procedures over and over again. For example, you might develop
    four or five scripts, all of which need to access the contents of a network drive.
    Using the NET command, you can develop an internal procedure that establishes
    a remote connection to the network drive. However, rather than duplicate this
    procedure in each script that needs it, you can save it as a separate script and
    then call that script as a procedure from any script that needs it. This way,
    you won''t have to keep reinventing the wheel.


    # Using Procedures to Localize Variable Access


    In Chapter 4, “Storing and Retrieving Information in Variables,” you were introduced
    to the idea of limiting or localizing access to script variables using the SETLOCAL
    and ENDLOCAL commands. By combining the use of these commands with procedures,
    you can lock down the variable access to specific locations within your scripts.
    This is an especially useful programming technique when developing complex and
    lengthy scripts that perform a lot of variable manipulation. As these types of
    scripts grow, it can become difficult to keep track of variables, thus opening
    up the possibility that one part of your script might accidentally alter a variable
    without realizing it. By localizing variable access, you can exercise strict control
    over all your script''s variables.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_238_1.png)'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'To localize variable access within procedures, make sure that the first statement
    in each procedure is the SETLOCAL statement and that the last statement is the
    ENDLOCAL statement, as demonstrated below.


    :DemoProcedure


    ```

    SETLOCAL


    --


    --


    ENDLOCAL

    GOTO :EOF

    ```


    Using this format, any variables defined within the procedure are isolated from
    the rest of the script and when the procedure terminates.


    > When localizing variables within procedures, take extra care to make sure you
    remember to execute the ENDLOCAL command. Otherwise, your procedure variables
    will become script variables with potentially damaging effects. One thing you
    should specifically guard against is the use of GOTO commands within procedures,
    because that could transfer processing control to a different part of the script
    without first finishing the procedure. In this case, you can turn the GOTO command
    into a compound command in order to retain variable localization as demonstrated
    below.


    ```

    ENDLOCAL & GOTO :ProcedureName

    ```


    # Tunneling Data Out Of Your Procedures


    While there are advantages to localizing variables within procedures via the SETLOCAL
    and ENDLOCAL commands, it also has one disadvantage. It makes it difficult for
    your internal procedures to return any results back to the script, which can greatly
    limit the usefulness of procedures. For example, the following procedure demonstrates
    this limitation:


    :DemoProcedure


    ```

    SETLOCAL

    SET /A ret = 5

    ENDLOCAL

    GOTO :EOF

    ```'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'In this procedure, the value of a variable named ret is set equal to 5. However,
    this variable and its value are not accessible to the rest of the script.


    Using a programming technique called variable tunneling, you can get around this
    limitation. Variable tunneling works like this: First you create a variable containing
    whatever information you wish to pass to the rest of the script, and then you
    turn the ENDLOCK command into a compound command using the following syntax:


    ```

    ENDLOCK & SET ret=%%

    ```


    The result will be a statement that ends the scope of procedure variables while
    tunneling out, or making accessible, the ret variable, as demonstrated in the
    following example:


    :DemoProcedure


    ```

    SETLOCAL

    SET /A RET = 5

    ENDLOCK & SET ret=%%

    GOTO :EOF

    ```


    # Back to the Rock, Paper, Scissors Game


    In the Rock, Paper, Scissors game, the player chooses from one of three available
    selections. The player''s selection is then compared to the computer''s randomly
    generated selection, and the results of the comparison are displayed. The criteria
    used to determine game results are very simple and outlined in Table 7.1.


    # Using a Flowchart as a Script Development Tool


    As you will see, the Rock, Paper, Scissors game provide an excellent chance to
    demonstrate the benefits of organizing your Windows shell scripts using procedures.
    As a preliminary step in designing this game, let''s look at a new type of development
    tool, called flowcharting, which I think you will find useful.


    > A flowchart is a graphic outline that provides a high-level overview of the
    components of a script and shows their relationship to one another.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# TABLE 7.1 ROCK, PAPER, SCISSORS RULES


    | Player 1 Picks | Player 2 Picks | Results |

    | --- | --- | --- |

    | Rock | Rock | Tie |

    | Paper | Paper | Tie |

    | Scissors | Scissors | Rock breaks Scissors: Player 1 wins |

    | Rock | Scissors | Rock breaks Scissors: Player 2 wins |

    | Paper | Rock | Paper covers Rock: Player 1 wins |

    | Rock | Paper | Paper covers Rock: Player 2 wins |

    | Scissors | Paper | Scissors cut paper: Player 1 wins |

    | Paper | Scissors | Scissors cut paper: Player 2 wins |


    Programmers often begin the development of complex projects by starting with a
    flowchart design. Flowcharts provide a visual tool for the outline of high-level
    logic. In addition, they provide the added benefit of serving as an excellent
    documentation tool.


    Figure 7.9 shows the flowchart I developed for this Rock, Paper, Scissors project.
    As you can see, the flowchart''s design is not very complex. I used rectangles
    to identify discrete modules of code as procedures. I used a diamond shape to
    represent major decision points, and I used a circle to identify the logical end
    of the script. Then, to show the game''s overall flow, I drew arrows showing the
    logical flow of the game from beginning to end.


    Roughly translated, the flowchart reads like this: First the script''s Initialization
    Section. Then the script''s main menu is displayed and the game starts. Next,
    the game collects the player''s selection and compares it to the computer selection.
    A check is made to ensure that an invalid selection was not made, and the results
    of the game are displayed. At this point, the player will be prompted to decide
    whether to play again. If the player decides to play again, the game restarts.
    Otherwise, game statistics are displayed and the game ends.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_242_0.png)


    # FIGURE 7.9


    Using a flowchart to help create a preliminary design for your Windows shell script.


    # IN THE REAL WORLD


    The larger and more complex the project, the more beneficial flowcharting becomes.
    Programmers use flowcharts to break down projects into discrete tasks. This makes
    it easier to focus on the development of each individual component of the script
    by knowing how it relates to other components. Flowcharting also helps programmers
    who work on teams to break down projects into different parts, each of which may
    be worked on by a different programmer.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Translating Flowchart Design into Script Requirements


    Using the flowchart as a basis for outlining the steps involved in developing
    the Rock, Paper, Scissors game, I have decided to tackle this project in nine
    steps, as outlined below.


    +   1. Set up the Initialization Section

    2. Set up the Main Processing Section

    3. Develop the :Displaymenu procedure

    4. Develop the :CollectChoice procedure

    5. Develop the :GetComputerChoice procedure

    6. Develop the :CompareChoices procedure

    7. Develop the :CheckForInvalid procedure

    8. Develop the :DisplayResults procedure

    9. Develop the :DisplayStats procedure


    # Creating the Initialization Section


    The script''s Initialization Section, shown below, displays the name of the game
    in the Windows command console''s title bar and sets the color scheme to yellow
    on black. In addition, four variables that are used throughout the script are
    defined and assigned initial default values. These variables will be used to track
    game results and provide the player with information at the end of the game regarding
    the number of wins, losses, ties, and invalid selections.


    ```

    TITLE = Rock, Paper, Scissors

    ```


    ```

    COLOR OE

    ```


    ```

    SET /aNoWins = 0

    SET /aNoLosses = 0

    SET /aNoTies = 0

    SET /aNoInvalid = 0

    ```'
