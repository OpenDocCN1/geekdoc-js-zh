    # Chapter 4 Storing and Retrieving Information in Variables


    While you cannot make permanent changes to environment variables from within your
    Windows shell scripts, you can create variables that have the same name as environment
    variables and modify their values. These variables will then tempor-arily override
    the values of the environment variables for your script.


    ![](img/d1ef3fa5bce28f9ca37c3c0b14a37975_119_0.png)


    Although you cannot see them using any of the previously mentioned procedures,
    Windows 2000 and XP also provide access to a small collection of dynamically created
    environment variables. These variables are listed in Table 4.2.


    | Table 4.2 Dynamic Environment Variables |

    | Variable | Description |

    | CD | Stores a string representing the current working directory |

    | DATE | Stores a string representing the current system date |

    | Time | Stores a string representing the current system time |

    | RANDOM | Retrieves a random number between 0 and 32,767 |

    | ERRORLEVEL | Retrieves the exit code of the previously executed command |

    | CMDEXTVERSION | Stores a string identifying the Windows shell version number
    |

    | CMDCMDLINE | Stores a string showing the command that was used to start the
    current Windows shell session |'
