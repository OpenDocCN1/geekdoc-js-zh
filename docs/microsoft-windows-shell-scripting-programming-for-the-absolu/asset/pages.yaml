  md: '# Back to the Guess a Number Game


    OK, now it''s time to take your knowledge of the IF statement and put it to the
    test by creating the Guess a Number game. As with previous projects, I''ll begin
    by discussing the steps involved in designing the game. After that, I''ll step
    you through the details of the specific steps, and then you can run and test the
    game and fix any typos or other problems that you may run into.


    # Designing the Game


    The Guess a Number game will be completed in five steps, each of which is outlined
    briefly below.


    +   1. Set up the script''s execution environment, define variables used by the
    script, and establish initial variable values


    +   2. Display a welcome screen that greets the player


    +   3. Prompt the player to make a guess, assign the number provided by the player
    to a variable, and keep a running count of the number guesses


    +   4. Interrogate each guess made by the player to determine if the guess is
    high, low, or correct, and loop back to allow the player to make another guess
    if necessary


    +   5. Display the results of the game, including the number of guesses it took
    for the player to win the game


    # Configuring the Execution Environment


    To begin, create a new script called GuessANumber.bat. Next, copy your script
    template into the file and add the following statements:


    ```

    @ECHO off


    COLOR OE


    CLS


    SET RandomNo=%random%


    SET /a NoGuesses = 0


    TITLE - THE GUESS A NUMBER GAME - %RandomNo%",

    ```'
