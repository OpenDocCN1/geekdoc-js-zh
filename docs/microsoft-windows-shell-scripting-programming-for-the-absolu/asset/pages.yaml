- img_proc: true
  md: 'I''ll explain in detail the work involved in completing each of these steps
    in the sections that follow. When you get to step 3, you can refer back to the
    pseudo code example shown earlier and see how the pseudo code outline was used
    to guide the development of the code in that part of the script.


    # Configuring the Script''s Execution Environment


    The script begins by disabling the display of statements in the Windows command
    console. It sets the console''s color scheme to yellow on black. The screen is
    then cleared, and the name of the game is displayed on the console''s title bar.
    Finally, two variables are defined that are used throughout the script. The first
    variable is used to keep count of the number of correctly answered quiz questions
    and the second variable is used to keep track of the number of incorrectly answered
    questions. Both variables are assigned an initial value of 0.


    ```

    @ECHO off


    COLOR OE


    CLS


    TITLE = THE SIX MILLION DOLLAR QUIZ


    SET /A Right = 0

    SET /A Wrong = 0

    ```


    # Creating a Welcome Screen and Main Menu


    The Six-Million-Dollar Quiz''s welcome screen looks similar to many of the other
    welcome screens that you have seen in this book. However, there are several key
    differences. First, the screen is preceded by a label called :StartGame. This
    label was placed here to allow to redraw the main menu after the player has visited
    either the Help or About menus.


    ```

    :StartGame


    ECHO.


    ECHO.

    ```'
