    ECHO G G U U E S S A A NN N U U M MM M B B E R R R

    ECHO G U U E SSS SSS AAAA N N N U U M M M M B B E RRR

    ECHO G GG U U EEE SSS A A N N N U U M M M BBB EEE RR

    ```'
