    # Beginning the Score Card Report


    Next, let''s begin creating the quiz''s score card report. The script is set up
    to store the report in the C:\TEMP folder on the computer''s hard drive. Therefore,
    the first you want to make sure that this folder exists. If it does not, you''ll
    want to create it as done by the first three statements below.


    ```

    IF NOT EXIST C:\TEMP\.

    MKDIR C:\Scripts


    ECHO > C:\TEMP\Quiz.txt

    ECHO The Six-Million-Dollar-Man Quiz Score Card Report >> C:\TEMP\Quiz.txt

    ECHO, >> C:\TEMP\Quiz.txt

    ECHO, >> C:\TEMP\Quiz.txt

    ```'
