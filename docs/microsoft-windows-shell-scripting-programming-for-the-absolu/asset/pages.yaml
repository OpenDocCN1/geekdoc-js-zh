    and then I''ll keep moving on with the project.


    # TRICK


    I used a substring operation above to provide a quick way for the script to end.
    When coded this way, the player could end the game by typing end, exit, or e.


    # TRAP


    Be careful when using a substring operation as shown above if the player formulates
    a question using a word that begins with the letter e, the game would instead
    of providing the player with an answer. In a game like this one, it''s a fairly
    safe bet that most questions will begin with phrases as "Will I" and "Should I,"
    using the letter e is probably safe enough.


    # IN THE REAL WORLD


    The statement SET trigger=%reply:-1 is an example of a substring operation. A
    substring is portion of a string found within another string. Extracting and parsing
    out substrings is a very common practice in programming. For example, scripts
    often have to read and process strings of user input or portions of text files
    in order to extract specific pieces of data to work with.'
