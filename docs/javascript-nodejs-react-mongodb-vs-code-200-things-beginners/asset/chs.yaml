  \ is truthy\nvalue4 is truthy\n```\n\n在 JavaScript 中，某些值被认为是“真值”，这意味着它们在布尔语境下求值为\
  \ true。这些包括非空字符串、非零数字、对象、数组等。理解真值对于编写条件语句和控制程序流程至关重要。\n\n### 补充\n真值是 JavaScript\
  \ 中的基础概念，理解它们有助于避免 bug 并编写更高效的代码。即使是空对象和数组也被认为是真值，如果不妥考虑，有时会导致意想不到的行为。\n\n### 60.\
