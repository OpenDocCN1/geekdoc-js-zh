  Osaka\" }\n[\"yellow\", \"green\", \"blue\"]\nHello, Alice!\n```\n\nJavaScript 中的对象是可变的，这意味着它们的属性和值在创建后可以被更改。这种灵活性允许动态数据操作。例如，你可以添加、修改或删除对象的属性。数组是对象的特殊类型，允许对值的有序集合，并且它们也是可变的。函数是另一种类型的对象，它们封装了可以使用不同输入执行的可重用代码块。\n\
  \n理解如何操作对象是 JavaScript 编程的基础，因为它们被广泛用于构建结构化数据和实现功能。与基本类型不同，对象是通过引用传递的，这意味着函数内部对对象的更改将影响函数外的原始对象。\n\
  \n### 补充\nJavaScript 对象可以是嵌套的，这意味着一个对象可以包含其他对象、数组或函数作为属性。这种嵌套能力允许创建复杂的数据结构，对于构建复杂的应用程序至关重要。此外，JavaScript\
  \ 为对象和数组提供了各种内置方法。\n\n### 59. 理解 JavaScript 中的真值 (Truthy Values)\n\n学习优先级：★★★★★\n\
  难度：★★☆☆\n\n在 JavaScript 中，真值是在布尔语境下（例如在 if 语句中）求值为为 true 的值。\n\n这里有一个演示 JavaScript\
