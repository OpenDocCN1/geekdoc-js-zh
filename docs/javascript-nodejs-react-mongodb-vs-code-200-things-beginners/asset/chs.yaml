  \ my name is John and I am 30 years old.\n\n\n示例：\n```javascript\nconst message\
  \ = `This is a multi-line\nconsole.log(message);\n```\n结果：\nThis is a multi-line\n\
  \n### 补充\n模板字符串引入于 `ECMAScript 2015 (ES6)`。与传统的字符串字面量相比，它们提供了一种更强大、更灵活的字符串处理方式。\n\
  \n\n学习优先级★★★★☆\n难度★★★★★\n\n\n使用默认参数，函数可以通过替换预定义值来优雅地处理缺失的参数。\n\n### 示例代码\n// 带有默认参数的函数\n\
  function greet(name = \"Guest\", greeting = \"Hello\") {\n    return `${greeting},\
  \ ${name}!`;\n}\nconsole.log(greet());\n// 带一个参数调用函数\nconsole.log(greet(\"John\"\
  ));\n// 带两个参数调用函数\n```\n\n### 执行结果\nHello, Guest!\nHi, John!\n\nJavaScript 函数中的默认参数提供了一种在调用函数时未提供参数时设置默认值的方法。这对于创建带有可选参数的函数或在缺少预期参数时避免错误特别有用。默认值可以是任何有效的\
  \ JavaScript 表达式。\n\n```javascript\nfunction multiply(a, b = 1) {\n    return a\
  \ * b;\n}\nconsole.log(multiply(5, 2)); // 10\n```\n在此示例中，如果未提供第二个参数 `b`，它默认为 1。\n\
  \n默认参数引入于 `ECMAScript 2015 (ES6)`。在 ES6 之前，开发者必须使用通通方法，例如在函数体内部检查 `undefined` 并手动分配默认值。\n\
  \n## 13. 使用展开语法展开可迭代对象\n\n难度★★★☆☆\n\n展开语法（`...`）允许将可迭代对象（如数组或字符串）展开为单独元素。\n\n\n\
  ### 示例代码\n```javascript\n// 使用展开语法合并数组\nconst arr2 = [4, 5, 6];\nconst combinedArr\
  \ = [...arr1, ...arr2];\nconsole.log(combinedArr); // [1, 2, 3, 4, 5, 6]\n```\n\
  ### 执行结果\n[1, 2, 3, 4, 5, 6]\n\n展开语法（`...`）是 JavaScript 中的一项强大功能，允许将可迭代对象（如数组或字符串）展开为单独元素。在上面的示例中，`arr1`\
  \ 和 `arr2` 被展开并合并成新数组 `combinedArr`。\n`const arr1 = [1, 2, 3];` 声明了一个包含元素 1, 2,\
  \ 3 的数组 `arr1`。\n`const arr2 = [4, 5, 6];` 声明另一个包含元素 4, 5, 6 的数组 `arr2`。\n`const\
  \ combinedArr = [...arr1, ...arr2];` 通过展开 `arr1` 和 `arr2` 的元素创建一个新数组 `combinedArr`。\n\
  \n\n### 补充\n展开语法也可以用于对象以创建浅拷贝或合并属性。例如：\n```javascript\nconst obj2 = { c: 3, d: 4\
  \ };\nconst combinedObj = { ...obj1, ...obj2 };\nconsole.log(combinedObj); // {\
  \ a: 1, b: 2, c: 3, d: 4 }\n```\n## 14. 使用剩余参数合并元素为数组\n\n学习优先级★★★★☆\n难度★★★☆☆\n剩余参数（Rest\
  \ parameters）`...` 允许将多个元素合并为一个数组。\n\n这是一个简单的示例演示了如何在函数中使用剩余参数将参数收集成数组。\n\n```javascript\n\
  // 使用剩余参数将参数收集成数组\n```\n\n\n\n```javascript\nfunction sum(...numbers) {\n}\n\nconsole.log(sum(1,\
  \ 2, 3, 4)); // 10\n```\n[Execution Result]\n10\n\n剩余参数 `(...)` 在函数定义中用于将所有剩余参数收集到一个数组中。在上面的示例中，`sum`\
  \ 函数使用剩余参数将它的所有参数收集到 `numbers` 数组中。\n`function sum(...numbers)` 定义了一个名为 `sum` 的函数，接收任意数量的参数并将它们汇聚到数组\
  \ `numbers` 中。\n\n`return numbers.reduce((acc, curr) => acc + curr, 0);` 使用 `reduce`\
  \ 方法累加 `numbers` 数组中的所有元素。\n\n\n[Supplement]\n\n剩余参数必须是函数定义中的最后一个参数。例如：\n```javascript\n\
  function example(a, b, ...rest) {\n  console.log(a); // 第一个参数\n  console.log(b);\
  \ // 第二个参数\n}\n\nexample(1, 2, 3, 4, 5);\n// 输出:\n// 2\n// [3, 4, 5]\n```\n\n\n\
  学习优先级★★★★★\n难度★★★☆☆\n\n\n以下是在 JavaScript 中使用 `map`、`filter` 和 `reduce` 方法的示例。\n\n\
  [Code Example]\n// map 示例：将每个元素乘以 2\nconst numbers = [1, 2, 3, 4];\nconst doubled\
  \ = numbers.map(num => num * 2);\nconsole.log(doubled); // [2, 4, 6, 8]\n// filter\
  \ 示例：仅获取偶数\nconst evens = numbers.filter(num => num % 2 === 0);\nconsole.log(evens);\
  \ // [2, 4]\n\nconst sum = numbers.reduce((accumulator, currentValue) => accumulator\
  \ + currentValue, 0);\nconsole.log(sum); // 10\n```\n\n[2, 4, 6, 8]\n[2, 4]\n10\n\
  \n`filter`: 创建一个新数组，包含所有通过所提供函数测试的元素。\n`reduce`: 在数组的每个元素上执行还原器函数，结果得到单个输出值。\n\n\
  这些方法之所以有用，是因为它们提供了一种处理数组操作的声明式方式，使代码更具可读性和可维护性。\n[Supplement]\n\n`map`、`filter`\
  \ 和 `reduce` 是高阶函数，这意味着它们接受其他函数作为参数。\n\n\n理解这些方法对于在 JavaScript 中处理函数式编程概念至关重要。\n\
  \n### 16. JavaScript 的单线程特性\n学习优先级★★★★☆\n难度★★☆☆☆\n\nJavaScript 引擎以单线程方式执行代码，这意味着一次只运行一条命令。这对于理解\
  \ JavaScript 如何处理任务和异步操作非常重要。\n这是一个演示 JavaScript 单线程执行以及它如何处理异步代码的示例。\n\n[Code Example]\n\
  ```javascript\n// 使用 setTimeout 模拟耗时任务\nsetTimeout(() => {\n  console.log('Timeout\
  \ finished');\n}, 2000);\n```\n\n[Execution Result]\nStart\nTimeout finished\n\n\
  JavaScript 逐行运行代码，但它可以使用 `setTimeout`、`Promises` 和 `async/await` 等机制处理异步操作。\n\n\n\
  这种行为对于构建响应式应用程序至关重要，因为它允许 JavaScript 在等待异步操作完成的同时处理其他任务。\n\n[Supplement]\nJavaScript\
  \ 的单线程特性由事件循环（event loop）管理，事件循环通过将操作排队队列来处理多个操作的执行。\n\n理解事件循环如何工作对于调试和优化 JavaScript\
  \ 程序的性能至关重要。\n\n\n### 17. 理解 Node.js 中的事件循环和回调\n\n学习优先级★★★★★\n\n事件循环和回调是 Node.js\
  \ 中处理非阻塞操作的基础，能够高效地执行异步代码。\n\n事件循环允许 Node.js 在可能的情况下将操作卸载到系统内核，从而执行非阻塞 I/O 操作。回调是在给定任务完成后执行的函数。\n\
  [Code Example]\n```javascript\n// 使用 setTimeout 的非阻塞操作示例\n// 此函数将在 2 秒后被调用\n  console.log('这条消息将在\
  \ 2 秒后显示');\n}, 2000);\n// 这条消息将立即显示\nconsole.log('这条消息将立即显示');\n\n[Execution Result]\n\
  这条消息将立即显示\n这条消息将在 2 秒后显示\n在 Node.js 中，事件循环是处理异步操作的机制。当启动异步操作时，事件循环将其卸载到系统内核。一旦操作完成，内核通知\
  \ Node.js 执行相应的回调。\n\n在示例中，`setTimeout` 调度回调在 2 秒后执行，但其余代码继续执行，而无需等待。\n\n\nNode.js\
  \ 使用 `libuv` 库来实现事件循环。`libuv` 是一个多平台库，专注于异步 I/O。它提供了处理文件系统事件、网络事件和其他操作的机制。\n\n##\
  \ 18. Node.js：服务器端执行的 JavaScript 运行时\n学习优先级★★★★★\n难度★★★★☆\n\nNode.js 是一个允许服务器端执行\
  \ JavaScript 的运行时，能够开发可扩展和高性能的网络应用程序。\nNode.js 使用 Google Chrome 相同的 V8 JavaScript\
  \ 引擎在浏览器之外执行 JavaScript。它提供了丰富的模块库来简化服务器端的开发。\n\n[Code Example]\n```javascript\n\
  // 导入 http 模块\nconst http = require('http');\n// 创建 HTTP 服务器\nconst server = http.createServer((req,\
  \ res) => {\n  res.writeHead(200, {'Content-Type': 'text/plain'});\n  // 发送响应体\n\
  \  res.end('Hello, World!\\n');\n});\n// 服务器监听 3000 端口\nserver.listen(3000, '127.0.0.1',\
  \ () => {\n  console.log('Server running at http://127.0.0.1:3000/');\n});\n\n[Execution\
  \ Result]\nServer running at http://127.0.0.1:3000/\n\nHello, World!\n\nNode.js\
  \ 构建在 V8 JavaScript 引擎之上，该引擎将 JavaScript 直接编译为原生机器码，使其非常高效。它设计用于构建可扩展的网络应用程序，特别是需要实时交互的应用程序，例如聊天应用、在线游戏和协作工具。\n\
  \n\n\n\n\nNode.js 的包生态系统 `npm`（Node 包管理器）是全球最大的开源库生态系统。它提供了大量的可重用代码模块，这些模块可以轻松地集成到\
  \ Node.js 应用中，显著缩短了开发时间。\n\n## 19. 在 Node.js 中使用 require 和 import 引入外部模块\n\n难度★★★★☆\n\
  \n在 Node.js 中，你可以使用 `require` 或 `import` 来引入外部模块。`require` 是 CommonJS 模块系统的一部分，而\
  \ `import` 用于 ES6 模块。理解这两种方法对于处理各种 Node.js 项目至关重要。\n\n\n[Code Example]\n\n```javascript\n\
  \nconst fs = require('fs'); // 导入文件系统模块\n\nfs.writeFileSync('test.txt', 'Hello,\
  \ world!'); // 写入文件\nconsole.log('File created using require');\n\n// 使用 ES6 模块\
  \ 的 import\n\n\nwriteFileSync('test_es6.txt', 'Hello, ES6!'); // 写入文件\n\nconsole.log('File\
  \ created using import');\n\n[Execution Result]\n\n```\nFile created using import\n\
  ```\n\n`require`: 此函数用于通过 CommonJS 模块系统在 Node.js 中引入模块。它同步加载模块。\n`import`: 此关键字用于通过\
  \ ES6 模块系统在 Node.js 中引入模块。它允许更灵活和异步的模块加载。\n\n要在 Node.js 中使用 `import`，你需要在 `package.json`\
  \ 文件中设置 `\"type\": \"module\"` 或者使用 `.mjs` 文件扩展名。\n\n\n[Supplement]\n\nCommonJS\
  \ 是 Node.js 原始的模块系统，但引入 ES6 模块是为了提供一种跨越 JavaScript 环境的引入模块的标准化方式。\nES6 模块支持树摇（tree\
  \ shaking），这可以通过消除未使用的代码来帮助缩小 JavaScript 包的大小。\n\n### 20. 理解 Node.js 中的 CommonJS\
  \ 和 ES6 模块\n\n难度★★★☆☆\n\nNode.js 支持两种模块系统：CommonJS 和 ES6 模块。CommonJS 使用 `require`\
  \ 和 `module.exports`，而 ES6 模块使用 `import` 和 `export`。了解它们的差异以及如何使用两者对于现代 JavaScript\
  \ 开发至关重要。\n\n\n[Code Example]\n\n```javascript\n// math.js\nmodule.exports.add =\
  \ (a, b) => a + b;\nmodule.exports.subtract = (a, b) => a - b;\n\nconst math = require('./math');\n\
  console.log(math.add(2, 3)); // 5\nconsole.log(math.subtract(5, 2)); // 3\n\n//\
  \ math.mjs\nexport  const add = (a, b) => a + b;\nexport  const subtract = (a, b)\
  \ => a - b;\n\nimport { add, subtract } from  './math.mjs';\nconsole.log(add(2,\
  \ 3)); // 5\nconsole.log(subtract(5, 2)); // 3\n```\n[Execution Result]\n\n```\n\
  5\n```\n\nCommonJS: 该模块系统使用 `require` 导入模块并使用 `module.exports` 导出它们。它是同步的，曾是 Node.js\
  \ 的默认模块系统。\n\n\n要在 Node.js 中运行 ES6 模块，请确保你的文件扩展名为 `.mjs` 或在 `package.json` 中设置 `\"\
  type\": \"module\"`。\n\n两个系统都可以在同一个项目中使用，但理解它们的差异和兼容性问题是非常重要的。\n[Supplement]\n\n\
  CommonJS 模块由于其简单性和同步特性在 Node.js 中被广泛使用，这非常符合服务器端开发。\n\n\n## 21. 在 Node.js 中使用 npm\
