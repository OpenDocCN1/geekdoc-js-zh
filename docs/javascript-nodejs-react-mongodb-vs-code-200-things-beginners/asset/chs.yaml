  [Supplement]\n\n`npm` 是世界上最大的软件注册表，托管了数百万个免费的可重用代码。\n\n\n学习优先级★★★★★\n难度★★★☆☆\n\n\
  \n当你初始化 Node.js 项目时，会自动创建一个 `package.json` 文件。这是它可能的样子。\n\n[Code Example]\n```json\n\
