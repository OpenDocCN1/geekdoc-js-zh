  ### 38. 在 MongoDB 集合中存储文档\n\n学习优先级：★★★★★\n难度：★★☆\nMongoDB 中的文档存储在集合（collections）中，这类似于关系型数据库中的表。每个文档都是一条记录，集合将这些文档组合在一起。\n\
  \n以下是如何使用 Node.js 从 MongoDB 集合中检索文档的示例。\n\n\n```javascript\n// 从 mongodb 包中导入 MongoClient\
  \ 类\nconst { MongoClient } = require('mongodb');\n// 连接到 MongoDB 服务器的 URL\nconst\
  \ url = 'mongodb://localhost:27017';\n\n// 数据库名称\n\n// 创建一个新的 MongoClient\nconst\
  \ client = new MongoClient(url);\n\n  try {\n    // 连接客户端到服务器\n    await client.connect();\n\
  \    console.log(\"Connected successfully to server\");\n    // 获取数据库\n    const\
  \ db = client.db(dbName);\n\n    // 获取集合\n\n    // 查找一些文档\n    const findResult\
  \ = await collection.find().toArray();\n    console.log('Found documents:', findResult);\n\
  \    // 关闭连接\n    await client.close();\n  }\n}\nrun().catch(console.dir);\n```\n\
  \n### 运行结果\n```text\nConnected successfully to server\nFound documents: [ { name:\
  \ 'John', age: 30, city: 'New York' } ]\n```\n这段代码演示了如何连接到 MongoDB 服务器、访问特定的数据库以及从集合中检索文档。`find`\
  \ 方法用于查询集合，`toArray` 方法将游标转换为数组。结果是集合中文档的数组。\n\n### 补充\n\n\n## 39. 使用 Mongoose 在\
  \ Node.js 中进行 MongoDB 对象数据建模\n\n学习优先级：★★★★☆\n\nMongoose 是在 Node.js 中操作 MongoDB 的强大工具。它提供了一种基于模式（schema）的解决方案来建模应用程序数据，通过为数据提供结构和验证，使得操作\
  \ MongoDB 变得更容易。\n\n这是一个如何使用 Mongoose 定义模式并执行基础操作（如创建和读取文档）的简单示例。\n### 代码示例\n\n\
  ```javascript\n// 导入 mongoose\n\n// 连接到 MongoDB\nmongoose.connect('mongodb://localhost:27017/mydatabase',\
  \ { useNewUrlParser: true, useUnifiedTopology: true });\n\nconst userSchema = new\
  \ mongoose.Schema({\n  name: String,\n  age: Number,\n  email: String\n\n// 根据 schema\
  \ 创建模型\nconst User = mongoose.model('User', userSchema);\n\nconst newUser = new\
  \ User({ name: 'John Doe', age: 30, email: 'john.doe@example.com' });\n\n// 将用户文档保存到数据库\n\
  newUser.save((err) => {\n  console.log('User saved successfully!');\n\n  // 在数据库中查找用户文档\n\
  \  User.findOne({ name: 'John Doe' }, (err, user) => {\n    console.log('User found:',\
  \ user);\n\n    // 关闭连接\n    mongoose.connection.close();\n});\n```\n\n### 运行结果\n\
  ```text\nUser saved successfully!\nUser found: { _id: 1234567890, name: 'John Doe',\
  \ age: 30, email: 'john.doe@example.com' }\n```\n\n\n\n\n\n# Model（模型）：model 是 `schema`\
  \ 的编译版本。它是根据 `schema` 构建文档的类。\n\n# Connection（连接）：`mongoose.connect` 建立与 `MongoDB`\
  \ 数据库的连接。\n# CRUD 操作：Mongoose 提供了如 `save` 和 `findOne` 等方法来对数据库执行操作。\n\n# Error Handling（错误处理）：始终包含错误处理，以管理数据库操作期间可能出现的问题。\n\
  \nMongoose 不仅提供 schema 验证，还提供了中间件（middleware），它允许你为各种操作定义 `pre` 和 `post` 钩子（hooks），使其成为管理数据逻辑强大工具。\n\
  \n## 40. 理解 CRUD 操作：创建、读取、更新和删除\n\n简单程度★★★★☆\n\nCRUD 操作是持久化存储的四个基本功能。它们对于与数据库交互至关重要，是任何管理数据的应用程序的基础。\n\
  \n\n### [代码示例]\n```javascript\n// Import Mongoose\n\n// Connect to MongoDB\nmongoose.connect('mongodb://localhost:27017/mydatabase',\
  \ { useNewUrlParser: true, useUnifiedTopology: true });\n\nconst userSchema = new\
  \ mongoose.Schema({\n  name: String,\n  age: Number,\n  email: String\n\n// Create\
  \ a model based on the schema\nconst User = mongoose.model('User', userSchema);\n\
  \nconst createUser = async () => {\n  const newUser = new User({ name: 'Jane Doe',\
  \ age: 25, email: 'jane.doe@example.com' });\n  await newUser.save();\n  console.log('User\
  \ created:', newUser);\n\n// Read (R)\nconst readUser = async () => {\n  const user\
  \ = await User.findOne({ name: 'Jane Doe' });\n};\n\n// Update (U)\nconst updateUser\
  \ = async () => {\n  console.log('User updated:', user);\n};\n\n// Delete (D)\n\
  \  await User.deleteOne({ name: 'Jane Doe' });\n  console.log('User deleted');\n\
  };\n\nconst executeCRUD = async () => {\n  await createUser();\n  await readUser();\n\
  \  await updateUser();\n  await deleteUser();\n  mongoose.connection.close();\n\
  };\n\n```\n\n### [执行结果]\n```\nUser read: { _id: 1234567890, name: 'Jane Doe', age:\
  \ 25, email: 'jane.doe@example.com' }\nUser updated: { _id: 1234567890, name: 'Jane\
  \ Doe', age: 26, email: 'jane.doe@example.com' }\nUser read: { _id: 1234567890,\
  \ name: 'Jane Doe', age: 26, email: 'jane.doe@example.com' }\nUser deleted\n\n-\
  \ **Create (创建)**：使用 `save` 方法向数据库添加新文档。\n- **Read (读取)**：使用 `findOne` 方法从数据库检索文档。\n\
  - **Update (更新)**：使用 `findOneAndUpdate` 方法更新现有文档。`{ new: true }` 返回更新后的文档。\n- **Async/Await**：使用\
  \ `async/await` 语法确保数据库操作按顺序执行并妥善处理错误。\n\n### [补充]\nCRUD 操作构成了数据库管理的骨柱。对于任何处理数据库工作的开发者来说，理解并掌握这些操作至关重要，因为它们是操作数据的手段。\n\
  ## 41. 使用查询从 MongoDB 集合中检索数据\n\n学习优先级★★★★☆\n简单程度★★★☆☆\n`MongoDB` 中的查询用于从集合中检索数据。它们允许你对数据库中的数据进行过滤、排序和投影。\n\
  \n以下是一个使用 `MongoDB` 查询查找集合中文档的简易示例。\n\n```javascript\n// Import MongoClient from\
