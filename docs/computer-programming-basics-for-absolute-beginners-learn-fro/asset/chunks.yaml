    答：缩进对 Python 很重要。它指定了一个代码块。循环、类、函数等中的所有代码都在缩进块内指定。通常使用四个空格字符。如果你的代码没有正确缩进，它将无法准确执行，并且还会抛出错误。


    ## Q15. Python 数组和列表有什么区别？


    答：在 Python 中，数组和列表存储数据的方式相同。但是，数组只能保存一种数据类型的元素，而列表可以保存任何数据类型的元素。


