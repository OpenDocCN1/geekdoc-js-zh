    ## Q19. Python 中的 self 是什么？


    答：Self 是一个类的实例或对象。在 Python 中，它被显式地作为第一个参数包含在内。然而，在 Java 中并非如此，它是可选的。它有助于区分类的属性和方法与局部变量。


    `init` 方法中的 `self` 变量指向新创建的对象，而在其他方法中，它指向调用该方法的对象。


    ## Q20. `break`、`continue` 和 `pass` 是如何工作的？


    - `break` – 当满足某个条件时，允许终止循环，并将控制权转移到后续语句。

    - `continue` – 当满足某个特定条件时，允许跳过循环的某一部分，并将控制权转移到循环的开头。

    - `pass` – 当你需要在语法上有一个代码块，但希望跳过其执行时使用。这基本上是一个空操作。执行时不会发生任何事情。


