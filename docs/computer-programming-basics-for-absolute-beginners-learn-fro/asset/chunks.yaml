    ### Q35. 什么是多线程？


    答：多线程是一种在单个程序中同时运行多个任务的概念。线程共享相同的进程堆栈并并行运行。它有助于提高任何程序的效率。


    ### Q36. 为什么在 Java 中使用 Runnable 接口？


    答：`Runnable` 接口在 Java 中用于执行多线程应用程序。`Java.Lang.Runnable` 接口由类实现以支持多线程。


    ### Q37. 在 Java 中执行多线程的两种方式是什么？


    答：在 Java 中，可以通过以下两种技术之一来建立多线程应用程序：


    1. 通过使用 `Java.Lang.Runnable` 接口。类实现此接口以启用多线程。该接口中有一个 `Run()` 方法需要实现。

    2. 通过创建一个扩展 `Java.Lang.Thread` 类的类。


    ### Q38. 当数据需要大量更改时，应该选择使用哪一个？String 还是 StringBuffer？


    答：考虑到 `StringBuffer` 本质上是动态的，并且我们可以改变 `StringBuffer` 对象的值，而 `String` 是不可变的，因此当数据被频繁更改时，使用
    `StringBuffer` 总是一个很好的选择。如果在这种情况下使用 `String`，每次数据更改都会产生一个新的 `String` 对象，这将带来额外的开销。


    ### Q39. 在 switch 语句的每个 case 中使用 break 的作用是什么？


    答：在 switch 语句中，每个 case（除了最后一个）之后使用 `break`，以便代码在匹配的 case 之后跳出，而不会继续执行后续的 case
    实例。如果每个 case 之后没有使用 `break`，那么匹配的 case 之后的所有实例也会被执行，导致错误的结果。


    ### Q40. Java 中如何进行垃圾回收？


    答：在 Java 中，当一个对象不再被引用时，就会发生垃圾回收，该对象会被自动销毁。对于自动垃圾回收，Java 会调用 `System.gc()` 方法或
    `Runtime.gc()` 方法。


    ### Q41. 如何在 main 方法之前执行任何代码？


    答：如果我们想在类加载时甚至在创建对象之前执行任何声明，可以在类中使用静态代码块。这个静态代码块中的任何语句将在类加载时执行一次，甚至在创建对象和 main
    方法之前。


    ### Q42. 一个类可以同时是超类和子类吗？举例说明。


