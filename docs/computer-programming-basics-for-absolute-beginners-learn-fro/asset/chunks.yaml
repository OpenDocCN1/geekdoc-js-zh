    ## Q11. Python 区分大小写吗？


    答：是的。Python 是一种区分大小写的语言。


    ## Q12. 什么是 Python 中的类型转换？


    答：类型转换是指将一种数据类型转换为另一种数据类型。


    - `int()` – 将任何数据类型转换为整数类型

    - `float()` – 将任何数据类型转换为浮点类型

    - `ord()` – 将字符转换为整数

    - `hex()` – 将整数转换为十六进制

    - `oct()` – 将整数转换为八进制

    - `tuple()` – 此函数用于转换为元组。

    - `set()` – 此函数在转换为集合后返回类型。

    - `list()` – 此函数用于将任何数据类型转换为列表类型。

    - `dict()` – 此函数用于将 (键, 值) 顺序的元组转换为字典。

    - `str()` – 用于将整数转换为字符串。

    - `complex(real,imag)` – 此函数将实数转换为 `complex(real,imag)` 数。


