    ## Q55. 举例说明 Python 中的继承。


    答：继承允许一个类获取另一个类的所有成员（如属性和方法）。继承提供了代码复用性，使应用程序的创建和维护更加容易。被继承的类称为超类，继承的类称为派生类/子类。


    Python 支持不同类型的继承：


    单继承——派生类获取一个超类的成员。


    多级继承——派生类 d1 继承自基类 base1，d2 继承自 base2。


    层次继承——从一个基类可以继承任意数量的子类。


    多重继承——派生类继承自多个基类。


    ## Q56. 如何在 Python 中创建类？


    答：Python 中使用 `class` 关键字创建类。


