    ## Q31. 如何在 Python 中注释多行？


    答：多行注释出现在多行中。所有需要注释的行都要以 `#` 开头。你也可以使用一个很好的快捷方法来注释多行。你只需按住 `ctrl` 键，然后在每个你想插入
    `#` 字符的位置左键单击，再输入一次 `#` 即可。这样就会在你放置光标的所有行上添加注释。


    ## Q32. Python 中的文档字符串是什么？


    答：文档字符串实际上不是注释，而是文档字符串。这些文档字符串位于三重引号内。它们不分配给任何变量，因此有时也起到注释的作用。


