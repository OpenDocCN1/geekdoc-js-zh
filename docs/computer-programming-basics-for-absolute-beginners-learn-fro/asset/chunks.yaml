    ## Q80. 解释 Django 框架中会话（session）的用途。


    答：Django 提供了会话机制，允许你按站点访问者存储和检索数据。Django 抽象了发送和接收 cookie 的过程，通过在客户端放置会话 ID cookie，并将所有相关数据存储在服务器端。


    ![](img/Image00052.jpg)


    图：Python 面试题 – Django 框架


    因此，数据本身并不存储在客户端。从安全角度来看，这非常不错。


    ## Q81. 列出 Django 中的继承风格。


    答：在 Django 中，有三种可能的继承风格：


    抽象基类：当你希望父类仅包含你不必为每个子模型重复输入的信息时，使用此风格。


    多表继承：当你对现有模型进行子类化，并且希望每个模型都有自己的数据库表时，使用此风格。


    代理模型：如果你只想修改模型的 Python 级别行为，而不更改模型字段，则可以使用此模型。


