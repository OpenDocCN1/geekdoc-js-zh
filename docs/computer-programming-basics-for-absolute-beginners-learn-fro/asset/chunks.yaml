    的实例可以用于指示多线程程序，该程序为各个线程创建单独的实例。此中使用的其他随机生成器包括：


    - `randrange(a, b)`：它选择一个整数，并定义范围在 [a, b) 之间。它通过从指定范围内随机选择元素来返回元素。它不会构建一个范围对象。

