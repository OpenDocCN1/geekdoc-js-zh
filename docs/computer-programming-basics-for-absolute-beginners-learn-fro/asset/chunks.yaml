    \ 和 Jinja2 是其两个依赖项。这意味着它对外部库的依赖很少甚至没有。这使得框架轻量，同时需要更新的依赖项少，安全漏洞也更少。\n\n会话基本上允许你在一个请求到另一个请求之间记住信息。在\
    \ Flask 中，会话使用签名 cookie，因此用户可以查看会话内容并进行修改。用户只有在拥有密钥`Flask.secret_key`时才能修改会话。\n\
    \n## Q74. Django 比 Flask 更好吗？\n\n答：Django 和 Flask 将用户在 Web 浏览器中输入的 URL 或地址映射到\
    \ Python 函数。\n\n与 Django 相比，Flask 简单得多，但 Flask 不会为你做太多事情，这意味着你需要指定细节，而 Django\
    \ 为你做了很多事情，你不需要做太多工作。Django 包含预编写的代码，用户需要分析这些代码，而 Flask 允许用户编写自己的代码，因此更容易理解代码。从技术上讲，两者同样优秀，各有优缺点。\n\
    \n## Q75. 指出 Django、Pyramid 和 Flask 之间的区别。\n\n答：\n\nFlask 是一个“微框架”，主要针对需求较简单的小型应用程序构建。在\
    \ Flask 中，你必须使用外部库。Flask 开箱即用。\n\n"
