    Pyramid 是为大型应用而设计的。它提供了灵活性，让开发者能够为项目选择合适的工具。开发者可以自由选择数据库、URL 结构、模板风格等。Pyramid
    具有高度可配置性。


    Django 也可以用于大型应用，与 Pyramid 有些类似。它内置了 ORM。


    ## Q76. 讨论 Django 的架构。


    答：Django MVT 模式：


    ![](img/Image00049.jpg)


    图：Python 面试题 – Django 架构


    开发者提供模型（Model）、视图（View）和模板（Template），然后将其映射到 URL，Django 就会自动处理，将内容呈现给用户。


    ## Q77. 解释如何在 Django 中配置数据库。


    答：你可以使用命令 `edit mysite/setting.py`，这是一个传统的 Python 模块，模块级别定义了 Django 的设置。


    Django 默认使用 SQLite；这对 Django 用户来说很方便，因为它不需要额外的安装。如果你选择了其他数据库，则需要修改 `DATABASE`
    配置中 `''default''` 项下的以下键值，以匹配你的数据库连接设置。


    引擎：你可以通过使用 `''django.db.backends.sqlite3''`、`''django.db.backends.mysql''`、`''django.db.backends.postgresql_psycopg2''`、`''django.db.backends.oracle''`
    等来更改数据库。


    名称：你的数据库名称。如果你使用 SQLite 作为数据库，那么数据库将是一个文件，名称应为该文件的完整绝对路径（包括文件名）。


    如果你没有选择 SQLite 作为数据库，则需要添加密码、主机、用户等设置。


    Django 默认使用 SQLite 作为数据库，它将数据存储为文件系统中的一个文件。如果你有数据库服务器（PostgreSQL、MySQL、Oracle、MSSQL）并希望使用它而不是
    SQLite，那么请使用数据库管理工具为你的 Django 项目创建一个新数据库。无论哪种方式，有了（空的）数据库后，剩下的就是告诉 Django 如何使用它。这就是项目中的
    `settings.py` 文件发挥作用的地方。


