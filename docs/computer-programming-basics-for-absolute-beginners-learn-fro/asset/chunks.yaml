    ## Q64. Java 中的变量可以不初始化就使用吗？


    答：在 Java 中，如果变量在代码中使用前没有通过有效值进行初始化，程序将无法编译并报错，因为 Java 不会为变量分配默认值。


    ## Q65. Java 中的类可以继承多个类吗？


    答：在 Java 中，一个类只能派生自一个类，而不能派生自多个类。Java 不支持多重继承。


    ## Q66. Java 中构造函数的名称可以与类名不同吗？


