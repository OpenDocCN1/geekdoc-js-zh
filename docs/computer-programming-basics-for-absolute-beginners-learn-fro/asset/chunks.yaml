    ## Q45. NumPy 数组相比（嵌套的）Python 列表有哪些优势？


    答：


    Python 的列表是高效的通用容器。它们支持（相当）高效的插入、删除、追加和连接，并且 Python 的列表推导式使它们易于构建和操作。


    但它们也有一定的局限性：它们不支持“向量化”操作（如逐元素加法和乘法），而且由于它们可以包含不同类型的对象，这意味着 Python 必须为每个元素存储类型信息，并且在操作每个元素时必须执行类型分发代码。


    NumPy 不仅更高效，而且更方便。你可以免费获得大量的向量和矩阵操作，这有时可以避免不必要的工作。而且它们也实现了高效的执行。


    NumPy 数组更快，并且 NumPy 内置了大量功能，如 FFT、卷积、快速搜索、基本统计、代数、直方图等。


