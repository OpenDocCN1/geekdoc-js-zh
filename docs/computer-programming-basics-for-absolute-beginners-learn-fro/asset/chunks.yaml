    ![](img/Image00003.jpg)


    **Q9. Java 中`double`和`float`变量有什么区别？**


    答：在 Java 中，`float`占用 4 字节内存，而`Double`占用 8 字节内存。`Float`是单精度浮点十进制数，而`Double`是双精度十进制数。


    **Q10. Java 中的`final`关键字是什么？给出一个例子。**


    答：在 Java 中，常量使用关键字`final`声明。值只能被赋值一次，赋值后常量的值不能更改。


    在下面的示例中，声明了一个名为`const_val`的常量并赋了值：


    ```

    private final int const_val = 100;

    ```


    当一个方法被声明为`final`时，它不能被子类重写。这种方法比其他任何方法都快，因为它们在编译时就被解析了。


    当一个类被声明为`final`时，它不能被继承。例如`String`、`Integer`和其他包装类。


