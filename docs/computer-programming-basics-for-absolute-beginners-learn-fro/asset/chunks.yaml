    答：可以，一个类可以有多个参数不同的构造方法。具体使用哪个构造方法来创建对象，取决于创建对象时传递的参数。


    ## Q29. 我们可以重写类的静态方法吗？


    答：我们不能重写静态方法。静态方法属于类而不是单个对象，并且在编译时（而不是运行时）处理。即使我们尝试重写静态方法，也不会得到编译错误，但在运行代码时也不会产生重写的效果。


