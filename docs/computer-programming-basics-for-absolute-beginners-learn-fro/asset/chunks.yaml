    负数索引从 ''-1'' 开始，表示序列中的最后一个索引，''-2'' 表示倒数第二个索引，以此类推，与正数索引类似。


    负索引用于去除字符串中的换行空格，并允许字符串排除最后一个字符，例如 `S[:-1]`。负索引也用于以正确的顺序表示字符串的索引。


