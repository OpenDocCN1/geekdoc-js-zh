    # Python 面试题


    ## Q25. `range` 和 `xrange` 有什么区别？


    答：首先，`xrange` 和 `range` 在功能上几乎完全相同。它们都提供了一种获取整数列表供你使用的方式，具体用法随你喜好。唯一的区别在于 `range`
    返回一个 Python 列表对象，而 `xrange` 返回一个 `xrange` 对象。


    这意味着 `xrange` 实际上不会像 `range` 那样在运行时生成一个静态列表。它通过一种称为“生成”（yielding）的特殊技术按需创建值。这种技术用于一种称为生成器的对象。也就是说，如果你有一个非常大的范围需要生成列表，比如十亿，那么
    `xrange` 就是应该使用的函数。


    这一点在你处理内存非常敏感的系统（比如手机）时尤为明显，因为 `range` 会尽可能多地占用内存来创建整数数组，这可能导致内存错误并使程序崩溃。它是个内存贪婪的家伙。


    ## Q26. 如何在 Python 中编写注释？


    答：Python 中的注释以 `#` 字符开头。不过，有时也会使用文档字符串（用三重引号括起来的字符串）来进行注释。


    > 示例：


    ```

    #Python 中的注释是这样开始的

    print("Python 中的注释以 # 开头")

    ```


    输出：Python 中的注释以 # 开头


    ## Q27. 什么是 pickling 和 unpickling？


    答：`Pickle` 模块接受任何 Python 对象，将其转换为字符串表示形式，并通过 `dump` 函数将其转储到文件中，这个过程称为 pickling。而从存储的字符串表示形式中检索原始
    Python 对象的方法称为 unpickling。


    ## Q28. Python 中的生成器是什么？


    答：返回可迭代对象集合的函数称为生成器。


    ## Q27. 什么是 pickling 和 unpickling？


    答：`Pickle` 模块接受任何 Python 对象，将其转换为字符串表示形式，并通过 `dump` 函数将其转储到文件中，这个过程称为 pickling。而从存储的字符串表示形式中检索原始
    Python 对象的方法称为 unpickling。


    ## Q28. Python 中的生成器是什么？


    答：返回可迭代对象集合的函数称为生成器。


    ## Q29. 如何将字符串的首字母大写？


    答：在 Python 中，`capitalize()` 方法可以将字符串的首字母大写。如果字符串开头已经是大写字母，则返回原字符串。


