    ## Q61. 有人说他成功编译了一个 Java 类，即使其中没有 main 方法？这可能吗？


    答：main 方法是 Java 类的入口点，是程序执行所必需的；然而，即使没有 main 方法，类也能成功编译。不过它无法运行。


    ## Q62. 我们可以从静态方法内部调用非静态方法吗？


    答：非静态方法由类的对象拥有，具有对象级别的作用域。为了从静态块（如静态 main 方法）中调用非静态方法，需要创建该类的对象。然后通过对象引用，可以调用这些方法。


