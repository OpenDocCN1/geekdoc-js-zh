    `monkey_f()`


    ## Q58. Python 支持多重继承吗？


    答：多重继承意味着一个类可以从多个父类派生。与 Java 不同，Python 支持多重继承。


    ## Q59. Python 中的多态是什么？


    答：多态意味着能够呈现多种形式。例如，如果父类有一个名为 `ABC` 的方法，那么子类也可以有一个同名的方法 `ABC`，并带有自己的参数和变量。Python
    允许多态。


    ## Q60. 定义 Python 中的封装？


    答：封装意味着将代码和数据绑定在一起。Python 类就是封装的一个例子。


