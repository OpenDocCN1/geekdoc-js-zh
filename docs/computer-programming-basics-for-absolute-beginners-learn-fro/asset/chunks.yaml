    **Q8. `continue`和`break`语句有什么区别？**


    答：`break`和`continue`是循环中使用的两个重要关键字。当在循环中使用`break`关键字时，循环会立即中断；而当使用`continue`关键字时，当前迭代被中断，循环继续执行下一次迭代。


