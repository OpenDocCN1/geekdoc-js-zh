    答案：与二维绘图类似，三维图形超出了 `NumPy` 和 `SciPy` 的范围，但即使在二维情况下，也存在与 `NumPy` 集成的包。`Matplotlib`
    在 `mplot3d` 子包中提供了基本的三维绘图功能，而 `Mayavi` 则利用强大的 `VTK` 引擎提供了丰富的高质量三维可视化特性。


    # 多项选择题（MCQ）——Python 面试题


    ### Q91. 以下哪些语句会创建一个字典？（多选）


    a) `d = {}`


    b) `d = {"john":40, "peter":45}`


    c) `d = {40:"john", 45:"peter"}`


    d) `d = (40:"john", 45:"50")`


    **答案：** b、c 和 d。


    字典是通过指定键和值来创建的。


    ### Q92. 以下哪个是整除运算符？


    a) `/`


    b) `//`


    c) `%`


    d) 以上都不是


    **答案：** b) `//`


    当两个操作数都是整数时，Python 会截去小数部分并返回四舍五入后的值，要获得精确结果请使用整除。例如，`5/2 = 2.5`，但由于两个操作数都是整数，该表达式在
    Python 中的结果是 2。要得到 2.5 作为答案，请使用 `//` 进行整除。因此，`5//2 = 2.5`。


    ### Q93. 标识符的最大可能长度是多少？


    a) 31 个字符


    b) 63 个字符


    c) 79 个字符


    d) 以上都不是


    **答案：** d) 以上都不是


    标识符可以是任意长度。


    ### Q94. 为什么以下划线开头的局部变量名不被鼓励？


    a) 它们用于表示类的私有变量


    b) 它们会混淆解释器


    c) 它们用于表示全局变量


    d) 它们会降低执行速度


    **答案：** a) 它们用于表示类的私有变量


    由于 Python 没有私有变量的概念，前导下划线用于表示不应从类外部访问的变量。


    ### Q95. 以下哪个是无效语句？


    a) `abc = 1,000,000`


    b) `a b c = 1000 2000 3000`


    c) `a,b,c = 1000, 2000, 3000`


    d) `a_b_c = 1,000,000`


    **答案：** b) `a b c = 1000 2000 3000`


    变量名中不允许有空格。


    ### Q96. 以下代码的输出是什么？


    ![](img/Image00056.jpg)


    a) someError has occured


    b) someError has not occured


    c) invalid code


    d) 以上都不是


    **答案：** c) invalid code


    新的异常类必须继承自 `BaseException`。这里没有这样的继承。


    ### Q97. 假设 `list1` 是 `[2, 33, 222, 14, 25]`，那么 `list1[-1]` 是什么？


    a) 错误


    b) None


    c) 25


    d) 2


    **答案：** c) 25


    索引 `-1` 对应列表中的最后一个索引。


    ### Q98. 要打开文件 `c:scores.txt` 进行写入，我们使用


    a) `outfile = open("c:scores.txt", "r")`


    b) `outfile = open("c:scores.txt", "w")`


    c) `outfile = open(file = "c:scores.txt", "r")`


    d) `outfile = open(file = "c:scores.txt", "o")`


    **答案：** b) 路径中包含双反斜杠（`\\`），并且使用 `w` 表示正在写入文件。


    ### Q99. 以下代码的输出是什么？


    ![](img/Image00057.jpg)


    a) True


    b) False


    c) None


    d) 错误


    **答案：** a) True


    当 `with` 语句与 `open` 文件一起使用时，它保证在 `with` 块退出时文件对象被关闭。


    ### Q100. `try-except-else` 中的 `else` 部分何时执行？


    a) 总是


    b) 当发生异常时


    c) 当没有异常发生时


    d) 当异常发生在 except 块中时


    **答案：** c) 当没有异常发生时


    `else` 部分在没有异常发生时执行。


    希望这套 Python 面试题能帮助你准备面试。祝你好运！

