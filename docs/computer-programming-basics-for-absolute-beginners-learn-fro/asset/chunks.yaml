    答：它是一个环境变量，在导入模块时使用。每当导入一个模块时，也会检查 `PYTHONPATH`，以确认导入的组件是否存在于多个目录中。解释器利用它来确定要加载哪个模块。


    ## Q9. 什么是 Python 组件？列举一些 Python 中常用的内置模块。


    答：Python 组件是包含 Python 代码的文件。这些代码可以是函数、类或变量。一个 Python 组件就是一个包含可执行代码的 `.py` 文件。


