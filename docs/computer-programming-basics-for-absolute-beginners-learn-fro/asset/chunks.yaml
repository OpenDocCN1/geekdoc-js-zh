    - `sys`

    - `math`

    - `random`

    - `data time`

    - `JSON`


    ## Q10. 什么是 Python 中的局部变量和全局变量？


    **全局变量：**


    在函数外部或全局作用域中声明的变量称为全局变量。程序中的任何函数都可以访问这些变量。


    **局部变量：**


    在函数内部声明的任何变量都称为局部变量。该变量存在于局部空间，而非全局空间。


