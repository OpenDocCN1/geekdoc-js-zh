    ## Q33. `is`、`not` 和 `in` 运算符的用途是什么？


    答：运算符是特殊的函数。它们接受一个或多个值并产生相应的结果。


    `is`：当两个操作数都为真时返回真（例如："a" is ''a''）


    `not`：返回布尔值的相反值


    `in`：检查某个元素是否存在于某个序列中


    ## Q34. Python 中 `help()` 和 `dir()` 函数的用途是什么？


    答：`help()` 和 `dir()` 这两个函数都可以从 Python 解释器中访问，用于查看内置函数的汇总转储。


    `help()` 函数：`help()` 函数用于显示文档字符串，还可以帮助你查看与模块、关键字、属性等相关的帮助信息。


    `dir()` 函数：`dir()` 函数用于显示已定义的符号。


    ## Q35. 每当 Python 退出时，为什么没有释放所有内存？


    答：


    每当 Python 退出时，尤其是那些包含对其他对象的循环引用或从全局命名空间引用的对象的 Python 模块，并不总是被释放或回收。


    C 库保留的那部分内存是无法释放的。


