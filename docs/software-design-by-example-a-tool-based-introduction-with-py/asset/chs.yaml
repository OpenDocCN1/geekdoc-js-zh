  \ `getter` 会做什么？如果名称不在那里，你的 `setter` 会做什么？如果更新值的类型与当前值的类型不同，它会做什么？\n\n### 什么是可以改变？\n\
  \n解释为什么这个程序无法工作：\n\n```python\ndef make_counter():\n    value = 0\n    def _inner():\n\
