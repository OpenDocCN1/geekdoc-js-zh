  \n\n\n\n\n# 献辞\n\n这一本献给 Mike 和 Jon：\n\n很高兴你们总是能抽空聊天。\n\n# 1 引言\n\n在任何领域中学习设计的最好方法是研究实例\
  \ [Schon1984; Petre2016]，而最易于理解的实例是读者所处的实例。最易于理解的实例是读者熟悉的实例。这些课程展示了设计者是如何思考的。我们希望如果你了解\
  \ Python，将能够更好地进行设计。在任何领域学习设计的最好方法是研究实例。\n\n## 1.1 读者\n\n这描述了本书的读者群体：\n\n> Maya\
  \ 拥有硕士学位。她了解足够的 Python，但在编写时感到吃力。这些课程将展示如何设计。\n\n像 Maya 一样，你应该能够：\n\n- 使用列表、条件语句、字典。\n\
  - 使用 `ls` 和 `mkdir`。\n- 使用 `git`。\n- 使用 `python`。\n- 使用 `classes`。\n- 使用 `exceptions`。\n\
  - 使用 `functions`。\n- 使用 `data`。\n- 使用 `test`。\n- 使用 `files`。\n\n## 1.2 核心理念\n\n\
  我们的设计方法基于三个核心理念。首先，随着组件数量的增加，系统的复杂度也会增加（图 1.1）。这就是我们所谓的“设计”。\n\n其次，“理解”取决于我们。当我们使用低级语言时，我们需要承担将微步骤组装某些东西的负担。另一方面，当我们使用高级语言时，我们需要承担将函数翻译为数据的负担。这意味着对于任何给定任务，新手最快理解的代码几乎与专家最能理解的代码不同（图\
  \ 1.3）。\n\n我们的第三个核心理念是程序只是另一种数据。源代码只是文本，我们可以像处理其他文件一样处理它。同样，内存中的程序只是一个我们可以检查和修改的数据结构。将代码视为数据使我们能够以优雅的方式解决难题，但代价是增加了抽象层级。\n\
