  \ 却抛出异常？\n\n### SHA-256 性能如何？\n\n1. 编写一个函数，计算文本文件中每个唯一行的 SHA-256 哈希值。\n2. 将这些哈希值的十六进制摘要转换为整数。\n\
  3. 使用 20 个分箱（bins）绘制这些整数值的直方图。\n4. 哈希值的分布有多均匀？随着你处理更大的文件，分布发生怎样的变化？\n\n# 4 模式匹配\n\
  \n我们使用 `*.txt` 来告诉第 3 章中的重复文件查找器比较哪些文件。老牌程序员（如本作者）将这种模式匹配称为**通配匹配 (globbing)**，因为早期的\
  \ Unix 有一个名为 `glob` 的工具¹ 来实现它。通配匹配非常有用，因此很快被添加到 shell 中，并且 Python 标准库包含一个名为 `glob`²\
  \ 的模块，以相同的方式匹配文件名。例如，`2023-*.{pdf,txt}` 匹配 `2023-01.txt` 和 `2023-final.pdf`，但并不匹配\
  \ `draft-2023.docx` (图 4.1)。\n\n![](img/fig4_1.jpg)\n\n图 4.1： glob 匹配示例。\n\n通配匹配模式比用于从文本文件中抓取数据的**正则表达式**要简单，但原理是相同的。因此，本章实现了一个通配匹配的简单版本，以展示模式匹配是如何工作的。这个匹配器将只处理表\
  \ 4.1 中的情况，但正如练习题所示，我们的设计使其于添加新类型的模式。\n\n表 4.1： 模式匹配案例。\n\n| 模式 | 文本 | 匹配？ | 模式\
  \ | 文本 | 匹配？ |\n| --- | --- | --- | --- | --- | --- |\n| abc | “abc” | true | a*c\
  \ | “abc” | true |\n| ab | “abc” | false | {a,b} | “a” | true |\n| abc | “ab” |\
  \ false | {a,b} | “c” | false |\n| * | ”“ | true | {a,b} | “ab” | false |\n| * |\
  \ “abc” | true | *{x,y} | “abcx” | true |\n\n## 4.1 简单模式\n\n匹配在概念上非常简单。如果模式的第一个元素匹配当前位置的目标字符串，我们就检查模式的其余部分是否匹配字符串的剩余部分。如果元素不匹配字符串的前部，或者模式的其余部分无法匹配字符串的剩余部分，则匹配失败。（这种行为使得通配匹配与正则表达式不同，后者可以匹配字符串的部分。）\n\
  \n这种设计利用了**责任链 (Chain of Responsibility)** 设计模式。如果每个匹配器能够匹配成功，它就可以请求链中的下一个匹配器来尝试匹配剩余文本(图\
  \ 4.2)。关键在于，对象并不知道它们后面的链有多多长：它们只需要知道下一个问谁。\n\n![](img/fig4_2.jpg)\n\n图 4.2： 责任链匹配。\n\
  \n在某些情况下，我们需要额外信息，例如字面量 “abc”。因此，我们创建一个类来存储固定字符串。它有一个 `__init__` 和 `match` 方法：\n\
  \n```python\nclass Lit:\n    def __init__(self, chars, rest=None):\n        self.chars\
  \ = chars\n        self.rest = rest\n\n    def match(self, text, start=0):\n   \
  \     end = start + len(self.chars)\n        if text[start:end] != self.chars:\n\
  \            return False\n        if self.rest:\n            return self.rest.match(text,\
  \ end)\n        return end == len(text)\n```\n\n`match` 方法接收要匹配的文本以及一个可选的 `start`\
  \ 参数（指示从何处开始）。为了看看它是否有效，让我们运行几次测试：\n\n```python\ndef test_literal_match():\n   \
  \ # /abc/ 匹配 \"abc\"\n    assert Lit(\"abc\").match(\"abc\")\n\ndef test_literal_substring_no_match():\n\
  \    # /ab/ 不匹配 \"abc\"\n    assert not Lit(\"ab\").match(\"abc\")\n\ndef test_literal_superstring_no_match():\n\
  \    # /abc/ 不匹配 \"ab\"\n    assert not Lit(\"abc\").match(\"ab\")\n```\n\n注意我们为测试起了长且有意义的名字，以便测试运行器的报告更易读。我们可以立即构建一些匹配器，但正如\
  \ [Petre2016] 所说，优秀的程序员会尽早构建并检查他们*最不确定*的代码部分。因此，我们写了一个测试来确保当一个字面量匹配器后面另一个时，链是有效的：\n\
  \n```python\ndef test_literal_followed_by_literal_match():\n    # /a+/b/ 匹配 \"ab\"\
  \n    assert Lit(\"a\", Lit(\"b\")).match(\"ab\")\n\ndef test_literal_followed_by_literal_no_match():\n\
  \    # /a+/b/ 不匹配 \"ac\"\n    pass # 示例省略\n```\n\n这些针对 Lit 的测试通过了，所以我们准备好处理通配符了。模式中的\
  \ `*` 字符匹配零或多个字符，因此如果链中没有更多的匹配器，那么这个 `*` 就匹配到字符串的末尾，`match` 立即返回 `True`。另一方面，如果*还有*其他匹配器，我们会尝试匹配零个字符、一个字符、两个字符，以此此类推，看看其他匹配器是否能让我们到达字符串的结尾。如果这些可能性都没有成功，整个匹配就会失败(图\
  \ 4.3)。\n\n\n\n\n\n```python\nclass Any:\n    def __init__(self, rest=None):\n \
  \       self.rest = rest\n\n    def match(self, text, start=0):\n        if self.rest\
  \ is None:\n            return True\n        for i in range(start, len(text)):\n\
  \            if self.rest.match(text, i):\n                return True\n       \
  \ return False\n```\n\n![](img/fig4_3.jpg)\n\n图 4.3: 通配符匹配是如何工作原理。\n\n在继续之前，我们再次编写了几个测试：\n\
  \n```python\ndef test_any_matches_empty():\n    # /*/ 匹配 \"\"\n    assert Any().match(\"\
  \")\n\ndef test_any_matches_entire_string():\n    # /*/ 匹配 \"abc\"\n    assert Any().match(\"\
  abc\")\n\ndef test_any_matches_as_prefix():\n    # /*def/ 匹配 \"abcdef\"\n    assert\
  \ Any(Lit(\"def\")).match(\"abcdef\")\n\ndef test_any_matches_as_suffix():\n   \
  \ # /abc*/ 匹配 \"abcdef\"\n    assert Lit(\"abc\", Any()).match(\"abcdef\")\n\ndef\
  \ test_any_matches_interior():\n    # /a*c/ 匹配 \"abc\"\n    assert Lit(\"a\", Any(Lit(\"\
  c\"))).match(\"abc\")\n```\n\n二或（Either/or）匹配的工作方式非常相似。如果第一个选项匹配，我们就尝试链的剩余部分。如果没有，我们就尝试第二个选项，如果第二个选项也不行，我们就失败：\n\
  \n```python\nclass Either:\n    def __init__(self, left, right, rest=None):\n  \
  \      self.left = left\n        self.right = right\n        self.rest = rest\n\n\
  \    def match(self, text, start=0):\n        return self.left.match(text, start)\
  \ or \\\n               self.right.match(text, start)\n```\n\n我们的前几个测试通过了：\n\n```python\n\
  def test_either_two_literals_first():\n    # /{a,b}/ 匹配 \"a\"\n    assert Either(Lit(\"\
  a\"), Lit(\"b\")).match(\"a\")\n\ndef test_either_two_literals_not_both():\n   \
  \ # /{a,b}/ 不匹配 \"ab\"\n    assert not Either(Lit(\"a\"), Lit(\"b\")).match(\"ab\"\
  )\n```\n\n但进一步的测试发现了一个 bug：\n\n```python\ndef test_either_followed_by_literal_match():\n\
  \    # /{a,b}c/ 匹配 \"ac\"\n    assert Either(Lit(\"a\"), Lit(\"b\"), Lit(\"c\")).match(\"\
  ac\")\n\ndef test_either_followed_by_literal_no_match():\n    # /{a,b}c/ 不匹配 \"\
  ax\"\n    assert not Either(Lit(\"a\"), Lit(\"b\"), Lit(\"c\")).match(\"ax\")\n\
  ```\n\n```\n======================= test session starts ========================\n\
  \ntest_glob_problem.py F. [100%]\n\n===================== short test summary info\
  \ ======================\nFAILED test_glob_problem.py::test_either_followed_by_literal_match\n\
  =================== 1 failed, 1 passed in 0.00s ====================\n```\n\n问题在于\
  \ `Either.match` 没有正确地使用 `rest`——事实上，它完全没有使用 `rest`，因为它不知道应该传递什么作为起点。我们不需要让 `match`\
  \ 方法返回 `True` 或 `False`，而是需要它们返回一个下一次匹配应该开始的位置指示，这样 `Either` 就可以将该信息传递给 `rest`。在进行此更改之前，我们将清理代码中的一些`技术债`。\n\
  \n## 4.2 重新思考\n\n我们现在有了三个相同接口的匹配器。在进行任何进一步工作之前，我们将使用一种名为“提取父类”（Extract Parent Class）的模式进行`重构`，使匹配器之间的关系变得清晰（图\
  \ 4.4）。同时，每个匹配器都在检查其 `rest` 是否为 `None`。我们可以通过创建一个表示“这里什么也没有”的类来简化这一点，这被称为“空对象”（Null\
  \ Object）模式。\n\n![](img/fig4_4.jpg)\n\n图 4.4: 使用提取父类进行重构。\n\n我们新的父类 `Match` 看起来如下：\n\
  \n```python\nclass Match:\n    def __init__(self, rest):\n        self.rest = rest\
  \ if rest is not None else Null()\n\n    def match(self, text):\n        result\
  \ = self._match(text, 0)\n        return result == len(text)\n```\n\n`Match.rest`\
  \ 要求每个`子类`都有一个名为 `_match` 的`辅助方法`，该方法返回继续搜索的位置。`Match.match` 检查整个匹配是否到达目标字符串的末尾，并返回\
  \ `True` 或 `False`。\n\n我们新的 `Null` 类如下：\n\n```python\nclass Null(Match):\n    def\
  \ __init__(self):\n        self.rest = None\n\n    def _match(self, text, start):\n\
  \        return start\n```\n\n`Null` 对象必须位于匹配链的末尾，即它们的 `rest` 必须是 `None`，因此我们从类的构造函数中删除了\
  \ `rest` 参数，并将 `None` 传递给`父`构造函数。由于 `Null` 对象不匹配任何内容，`Null._match` 会立即返回任何起始位置。有了这些更改后，字面量匹配器变为：\n\
  \n```python\nclass Lit(Match):\n    def __init__(self, chars, rest=None):\n    \
  \    super().__init__(rest)\n        self.chars = chars\n\n    def _match(self,\
  \ text, start):\n        end = start + len(self.chars)\n        if text[start:end]\
  \ != self.chars:\n            return None\n        return self.rest._match(end)\n\
  ```\n\n`Lit` 构造函数调用其`父`类来初始化所有类共享的数据，然后添加该类特有的内容。如果 `rest` 是 `Null` 的`实例`，它会返回 `None`。与之前，`Any`\
  \ 检查匹配目标字符串的一部分：\n\n```python\nclass Any(Match):\n    def __init__(self, rest=None):\n\
  \        super().__init__(rest)\n\n    def _match(self, text, start):\n        for\
  \ i in range(start, len(text) + 1):\n            end = self.rest._match(text, i)\n\
  \            if end is not None:\n                    return end\n        return\
  \ None\n```（练习会问循环为什么要运行到 `len(text) + 1`。）最后，二或匹配器变为：\n\n```python\nclass Either(Match):\n\
  \    def __init__(self, left, right, rest=None):\n        super().__init__(rest)\n\
  \        self.left = left\n        self.right = right\n\n    def _match(self, text,\
  \ start):\n        for pat in [self.left, self.right]:\n            end = pat._match(text,\
  \ start)\n            if end is not None:\n                end = self.rest._match(text,\
  \ end)\n            if end == len(text):\n                    return end\n     \
  \   return None\n```\n\n遍历 `left` 和 `right` 避免了重复代码。它还简化了两个以上选项的处理，我们在练习中讨论这一点。\n\
  \n至关重要的是，现有的测试没有任何变化，因为匹配类的构造函数没有改变，`match` 方法的签名（它们现在`继承`自 `Match` 类）也保持不变。我们应该为\
  \ `Null` 添加一些测试，但我们已经实现了原始目标，并且正如练习所示，我们可以轻松地添加其他类型的匹配器。\n\n## 4.3 总结\n\n图 4.5 总结了本章的核心思想；我们将再次看到`空对象`和`责任链`设计模式。\n\
