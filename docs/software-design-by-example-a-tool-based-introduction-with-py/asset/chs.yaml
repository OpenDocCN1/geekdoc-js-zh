  ### 按字符串过滤\n\n修改 `filter` 和 `select` 的比较，使其适用于包含字符串列而非数字列的表格，并观察这如何改变性能。为了进行测试，使用\
  \ A-Z 字符创建随机 4 位字符串，然后按以下项进行过滤：\n\n* 精确匹配，\n* 以特定字符开头的字符串，\n* 包含特定字符的字符串。\n\n###\
  \ 检查\n\n使用 Python 的 `inspect`⁴ 模块重写 `DfCol.filter`，使得用户的过滤函数只需要为感兴趣的列定义参数。\n\n###\
  \ 连接性能\n\n连接（join）根据匹配的键合并两个表的数据。例如，如果两个表是：\n\n| Key | Left |\n| --- | --- |\n|\
  \ A | a1 |\n| B | b1 |\n| C | c1 |\n\n以及：\n\n| Key | Right |\n| --- | --- |\n| A\
  \ | a2 |\n| A | a3 |\n| B | b2 |\n\n那么连接是：\n\n| Key | Left | Right |\n| --- | ---\
  \ | --- |\n| A | a1 | a2 |\n| A | a1 | a3 |\n| B | b1 | b2 |\n\n编写一个测试来比较在基于匹配数字键连接两个表时，行存储与列存储的性能。答案取决于匹配键的比例吗？\n\
  \n### 连接优化\n\n`join` 两个表最简单的方法是使用双重循环查找匹配的键。另一种方法是为每个表构建一个索引（index），然后使用它来构建匹配。例如，假设表为：\n\
  \n| Key | Left |\n| --- | --- |\n| A | a1 |\n| B | b1 |\n| C | c1 |\n\n以及：\n\n|\
  \ Key | Right |\n| --- | --- |\n| A | a2 |\n| A | a3 |\n| B | b2 |\n\n第一步是创建一个 `Map`，显示每个键在第一个表中的位置：\n\
  \n```\n{A: [0], B: [1], C: [2]}\n```\n\n第二步是为第二个表创建一个类似的 `Map`：\n\n```\n{A: [0,\
  \ 1], B: [2]}\n```\n\n然后我们可以遍历其中一个 map 中的键，在第二个 map 中查找值，并构建所有匹配项。\n\n编写以这种方式连接两个表的函数。它是更快还是更慢？\n\
  \n\n\n\n\n```python\n def save(writer, thing):\n    if isinstance(thing, bool):\n\
  \        print(f\"bool:{thing}\", file=writer)\n\n    elif isinstance(thing, float):\n\
  \        print(f\"float:{thing}\", file=writer)\n\n    elif isinstance(thing, int):\n\
  \        print(f\"int:{thing}\", file=writer)\n\n    else:\n        raise ValueError(f\"\
  unknown type of thing {type(thing)}\")\n```\n\n加载数据的函数首先读取单行，去掉末尾的换行符（这是 `save`\
  \ 函数中的 `print` 语句自动添加的），然后根据冒号分割该行。在检查是否存在两个字段后，它使用第一个字段中的类型名称来决定如何处理第二个字段：\n\n\
  ```python\n def load(reader):\n    line = reader.readline()[:-1]\n    assert line,\
  \ \"Nothing to read\"\n    fields = line.split(\":\", maxsplit=1)\n    assert len(fields)\
  \ == 2, f\"Badly-formed line {line}\"\n    key, value = fields\n\n    if key ==\
  \ \"bool\":\n        names = {\"True\": True, \"False\": False}\n        assert\
  \ value in names, f\"Unknown Boolean {value}\"\n        return names[value]\n\n\
  \    elif key == \"float\":\n        return float(value)\n\n    elif key == \"int\"\
  :\n        return int(value)\n\n    else:\n        raise ValueError(f\"unknown type\
  \ of thing {line}\")\n```\n\n保存列表几乎同样简单：我们保存列表中的项目数量，并使用递归 `call`。例如，列表 `[55, True,\
  \ 2.71]` 保存如图 16.1 所示。实现此操作的代码如下：\n\n```python\n elif isinstance(thing, list):\n\
  \    print(f\"list:{len(thing)}\", file=writer)\n    for item in thing:\n      \
  \  save(writer, item)\n```\n\n![](img/fig16_1.jpg)\n\n图 16.1： 保存嵌套数据结构。\n\n而加载列表时，我们只需要读取指定数量的项目：\n\
  \n```python\n elif key == \"list\":\n    return [load(reader) for _ in range(int(value))]\n\
  ```\n\n注意 `save` 和 `load` 不需要知道列表中包含什么类型的值。每个递归调用都会将输入或输出流 正好移动其所需的行数。因此，这种方法应该处理空列表和嵌套列表，而无需任何额外工作。\n\
  \n我们的函数处理集合的方式与列表完全相同；唯一的区别是使用关键字 `set` 而不是 `list`。要保存字典，我们先保存条目数量，然后依次保存每个键和值：\n\
  \n```python\n elif isinstance(thing, dict):\n    print(f\"dict:{len(thing)}\", file=writer)\n\
  \    for (key, value) in thing.items():\n        save(writer, key)\n        save(writer,\
  \ value)\n```\n\n加载字典的代码是类似的。有了这些机制，我们就可以保存我们的第一个数据结构了：\n\n```python\n save(sys.stdout,\
  \ [False, 3.14, \"hello\", {\"left\": 1, \"right\": [2, 3]}])\n```\n\n```text\n\
  \ list:4\nbool:False\nfloat:3.14\nstr:1\nhello\ndict:2\nstr:1\nleft\nint:1\nstr:1\n\
  right\nlist:2\nint:2\nint:3\n```\n\n我们现在需要编写一些单元测试。在执行此操作时我们将使用两个技巧：\n\n1. Python\
  \ `io`³ 模块中的 `StringIO` 类允许我们从字符串读取内容，并使用我们通常用于读写文件的函数向其写入。这让我们在运行测试时不会产生大量小文件作为副作用。\n\
  2. Python `textwrap`⁴ 模块中的 `dedent` 函数可以移除字符串体前前缩进。如下下面的示例所示，`dedent` 允许我们像缩进 Python\
  \ 代码一样缩进测试固件（fixture），这使得测试更易读。\n\n```python\n def test_save_list_flat():\n    fixture\
  \ = [0, False]\n    expected = dedent(\"\"\"\\\n    list:2\n    int:0\n    bool:False\n\
  \    \"\"\")\n    output = StringIO()\n    save(output, fixture)\n    assert output.getvalue()\
  \ == expected\n```\n\n## 16.2 转换为类\n\n我们在上一节中构建的 `save` 和 `load` 函数可以工作，但当我们扩展它们时，每当想要做新事情就必须修改它们的内部实现。\n\
  \n**开闭原则**（Open-Closed Principle）指出软件应该对扩展开放，对修改关闭，即应该可能在不重写现有代码的情况下扩展功能。这允许旧代码使用新功能，但前提是设计允许。我们无法预料一切，先修改一次或三次设计是正常的。\n\
  \n在这种情况下，我们通过使用类而不是函数来遵循开闭原则。我们将此类命名为 `SaveObjects` 而不仅仅是 `Save`，因为我们将创建它的变体。`SaveObjects.save`\
  \ 通过根据对象的类型构造名称、检查方法是否存在并调用该方法来确定调用哪个方法来保存特定项目。正如在之前的示例所示，处理特定项目的方法必须具有相同的签名，以便相互调用。\n\
  \n```python\n class SaveObjects:\n    def __init__(self, writer):\n        self.writer\
  \ = writer\n\n    def save(self, thing):\n        typename = type(thing).__name__\n\
  \        method = f\"save_{typename}\"\n        assert hasattr(self, method), f\"\
  Unknown type {typename}\"\n        getattr(self, method)(thing)\n```\n\n保存的核心是：\n\
  \n```python\n class SaveObjects:\n    def __init__(self, writer):\n        self.writer\
  \ = writer\n\n    def save(self, thing):\n        typename = type(thing).__name__\n\
  \        method = f\"save_{typename}\"\n        assert hasattr(self, method), f\"\
  Unknown type {typename}\"\n        getattr(self, method)(thing)\n```\n\n例如，写入整数和字符串的方法是：\n\
  \n```python\n def save_int(self, thing):\n    self._write(\"int\", thing)\n\ndef\
  \ save_str(self, thing):\n    lines = thing.split(\"\\n\")\n    self._write(\"str\"\
  , len(lines))\n    for line in lines:\n        print(line, file=self.writer)\n```\n\
  \n`LoadObjects.load` 将动态分发与我们加载函数的字符串处理结合：\n\n```python\nclass LoadObjects:\n  \
  \  def __init__(self, reader):\n        self.reader = reader\n\n    def load(self):\n\
  \        line = self.reader.readline()[:-1]\n        assert line, \"Nothing to read\"\
  \n        fields = line.split(\":\", maxsplit=1)\n        assert len(fields) ==\
  \ 2, f\"Badly-formed line {line}\"\n        key, value = fields\n        method\
  \ = f\"load_{key}\"\n        assert hasattr(self, method), f\"Unknown object type\
  \ {key}\"\n        return getattr(self, method)(value)\n```\n\n加载单个项目的方法甚至简单。例如，我们这样加载一个浮点数：\n\
  \n```python\n def load_float(self, value):\n    return float(value)\n```\n\n## 16.3\
  \ 别名\n\n\n\n\n考虑下方的两行代码，它们创建了 图 16.2 所示的数据结构。如果我们保存了这个结构并使用我们目前构建的内容将其重新加载，我们最终将得到两个包含字符串“content”的列表副本，而不是一个。如果我们只读取重新加载的数据，这将不是问题；但如果我们修改了\
  \ `fixture[0]` 的新副本，我们将无法在 `fixture[1]` 中看到该变化的反映，而在原始数据结构中，我们*本应该*看到这个变化：\n\n```\n\
  \ shared = [\"content\"]\nfixture = [shared, shared]\n```\n\n![](img/fig16_2.jpg)\n\
  \n图 16.2： 在不尊重别名的情况下保存了带有别名的数据。\n\n\n\n问题在于列表 `shared` 被别名化了，即它有两个或多个指向它的引用。为了正确地重构原始数据，我们需要：\n\
  \n1. 跟踪我们保存过的所有内容；\n2. 当我们尝试第二次保存某个对象时，保存一个标记而不是对象本身；以及\n3. 在加载数据时反转这个过程。\n\n我们可以使用\
  \ Python 的内置函数 `id` 来跟踪我们保存的内容，该函数为程序中的每个对象返回一个唯一的 ID。例如，即使两个列表包含完全相同的值，`id` 也会为这些列表报告不同的\
  \ ID，因为它们存储在内存中不同的位置。我们可以利用这一点：\n\n1. 将所有已保存对象的 ID ID 存储在一个 `set` 中，然后\n2. 当我们第二次看到一个对象时，写入一个带有关键字\
  \ `alias` 及其唯一 ID 的特殊条目。\n\n这里处是 `SaveAlias` 的开头：\n\n```\n class SaveAlias(SaveObjects):\n\
  \    def __init__(self, writer):\n        super().__init__(writer)\n        self.seen\
  \ = set()\n\n    def save(self, thing):\n        thing_id = id(thing)\n        if\
  \ thing_id in self.seen:\n            self._write(\"alias\", thing_id, \"\")\n \
  \           return\n\n        self.seen.add(id(thing))\n        typename = type(thing).__name__\n\
  \        method = f\"save_{typename}\"\n        assert hasattr(self, method), f\"\
  Unknown object type {typename}\"\n        getattr(self, method)(thing)\n```\n\n\
  它的构造函数创建了一个到目前为止看到的 ID 的空集合。如果 `SaveAlias.save` 注意到它要保存的对象之前已经保存过，它会写入这样的一行：\n\n\
  ```\n alias:12345678:\n```\n\n其中 `12345678` 是对象的 ID。（练习将要求解释为什么末尾需要那个冒号。）如果之前没见过该对象，`SaveAlias`\
  \ 将保存对象的类型、其 ID 以及它的值或其长度：\n\n```\n def save_list(self, thing):\n    self._write(\"\
  list\", id(thing), len(thing))\n    for item in thing:\n        self.save(item)\n\
  ```\n\n`SaveAlias._list` 与 `SaveObjects._list` 有些不同，因为它必须保存每个对象的标识符连同其类型及其值或长度。我们的\
  \ `LoadAlias` 类与 `LoadObjects` 相比也需要类似的更改。第一个版本所示；正如我们将看到的，它包含一个细微的 bug：\n\n```\n\
  \ class LoadAlias(LoadObjects):\n    def __init__(self, reader):\n        super().__init__(reader)\n\
  \        self.seen = {}\n\n    def load(self):\n        line = self.reader.readline()[:-1]\n\
  \        assert line, \"Nothing to read\"\n        fields = line.split(\":\", maxsplit=2)\n\
  \        assert len(fields) == 3, f\"Badly-formed line {line}\"\n        key, ident,\
  \ value = fields\n\n        # 下面的行包含一个 bug\n        if key == \"alias\":\n     \
  \       assert ident in self.seen:\n                return self.seen[ident]\n\n\
  \        method = f\"load_{key}\"\n        assert hasattr(self, method), f\"Unknown\
  \ object type {key}\"\n        result = getattr(self, method)(value)\n        self.seen[ident]\
  \ = result\n        return result\n```\n\n我们新代码的第一个测试是：\n\n```\n def test_aliasing_no_aliasing():\n\
  \    fixture = [\"a\", {\"b\": True, \"c\": \"d\"}]\n    assert roundtrip(fixture)\
  \ == fixture\n```\n\n它使用了这个辅助函数：\n\n```\n def roundtrip(fixture):\n    writer =\
  \ StringIO()\n    SaveAlias(writer).save(fixture)\n    reader = StringIO(writer.getvalue())\n\
  \    return LoadAlias(reader).load()\n```\n\n测试用例中没有任何别名化，但这是故意的：我们想确保在继续之前没有破坏以前运行正常的代码。这里有一个实际上包含一些别名化的测试：\n\
  \n```\n def test_aliasing_shared_child():\n    shared = [\"content\"]\n    fixture\
  \ = [shared, shared]\n    result = roundtrip(fixture)\n    assert result == fixture\n\
  \    assert id(result[0]) == id(result[1])\n    result[0][0] = \"changed\"\n   \
  \ assert result[1][0] == \"changed\"\n```\n\n它检查在数据恢复后别名化的子列表是否仍然是别名，然后检查更改是否生效。它检查别名化的子列表在数据恢复后确实是别名化的，然后检查更改是否生效。由于由于别名化，`LoadAlias`\
  \ 会显示一个 bug，配合这些行：\n\n```\n fixture = []\nfixture.append(fixture)\n```\n\n创建了 图\
  \ 16.3 所示的结构，它包含对自身的引用。由于别名化，`LoadAlias` 会显示一个 bug，配合这些行：\n\n```\n def load_list(self,\
  \ value):\n    result = []\n    for _ in range(int(value)):\n        result.append(self.load())\n\
  \    return result\n```\n\n由于别名化，`LoadAlias` 会显示一个 bug，配合这些行：\n\n```\n result =\
  \ []\n```\n\n解决方案是重新排序操作，跟踪保存数据：\n\n```\n list:44802600:\n```\n\n1. 第一行告诉我们有一个 ID\
  \ 为 `44802600` 的列表，`LoadObjects._list` 还没有创建该列表——它仍在读取元素——所以 `LoadAlias` 还没有将列表加入\
  \ `seen`。\n2. `LoadObjects._list` 递归地加载这一个元素。\n3. `LoadAlias.load` 读取了 ID 为 `44802600`\
  \ 的别名行，配合 `LoadObjects` 的：\n\n```\n def load_list(self, value):\n    result = []\n\
  \    self.seen[ident] = result\n    for _ in range(int(value)):\n        result.append(self.load())\n\
  \    return result\n```\n\n该方法创建了它将返回的列表，立即将其添加到 `seen` 字典中，然后递归地加载列表项。我们必须传递列表的\
  \ ID 作为 `seen` 中的键，并且必须使用循环而不是列表推导式，但对 `save_set` 和 `save_dict` 的更改遵循完全相同的模式。\n\n\
  ```\n word = \"word\"\nchild = [word, word]\nparent = []\nparent.append(parent)\n\
  parent.append(child)\n\nsaver = SaveAlias(sys.stdout)\nsaver.save(parent)\n```\n\
  \n```\n list:453974200:2\nalias:453974200:\nlist:4539552960:2\nstr:4539552048:1\n\
  word\nalias:4539552048:\n```\n\n## 16.4 总结\n\n图 16.4 总结了本章介绍的概念，而 附录 B 展示了如何扩展我们的框架来处理用户类。\n\
  \n![](img/fig16_4.jpg)\n\n## 16.5 练习\n\n### 冒号\n\n当我们创建别名标记时，为什么 `alias:12345678:`\
  \ 的末尾有一个冒号？\n\n### 版本控制\n\n我们现在有多个版本的数据存储格式。我们早期版本的代码无法读取后期版本创建的存档，而后期版本无法读取早期创建的存档（早期每行使用两个字段而不是三个）。这个问题在长期运行的库和应用程序中经常出现，通常解决方案是在存档的开头包含某种版本标记，以指示是由哪个版本的软件创建的（因此应该如何读取它）。修改我们目前编写的代码来实现这一点。\n\
  \n\n\n\n### 字符串 (Strings)\n\n修改框架，使字符串使用 `\\ n` 等转义字符存储，而不是跨越多行显示。\n\n### 谁来计算？\n\
  \n为什么 `LoadAlias.load` 不计算对象 ID？它为什么使用存储在存档中的 ID 呢？\n\n### 使用全局变量 (Using Globals)\n\
  \n单元测试课程引入了 `globals` 函数，它可以查找程序顶层定义的所有内容。\n\n1.  修改持久化框架，使其使用 `globals` 查找 `save_`\
  \ 和 `load_` 函数。\n\n2.  为什么这是一个坏主意？\n\n# 17 二进制制数据 (Binary Data)\n\nPython 和其他高级语言保护程序员免受计算机实际存储和处理数据的低级细节的影响，但迟早会有人需要考虑位和字节。本章将探索计算机如何表示数字和文本，并展示如何在此分层面上处理数据。\n\
  \n## 17.1 整数 (Integers)\n\n让我们先看看整数是如何存储的。使用 0 和 1 进行这种操作的自然方法是使用二进制，因此二进制的 `1001`\
  \ 是 `(1��× 8) + (0��× 4) + (0��× 2) + (1��× 1)`，即十进制的 9。我们可以通过保留最高位作为符号位来处理负数，因此\
  \ `01001` 是 +9，而 `11001` 是 −9。这种表示法有两个缺点。不重要的一个是它给了我们两个零，一个正，一个负。较大的缺点是，对这种**符号位**表示法进行算术运算所需的硬件比另一种名为**补码**（two's\
  \ complement）的方案所需的硬件更复杂。补码不是镜像正值，而是在低于零时像汽车里程表一样溢出。例如，三位整数给出了表 17.1 所示的数值。\n\n\
  Table 17.1: 使用补码的 3 位整数值。\n\n| 十进制 | 二进制 |\n| --- | --- |\n| 3 | 011 |\n| 2 | 010\
  \ |\n| 1 | 001 |\n| 0 | 000 |\n| -1 | 111 |\n| -2 | 110 |\n| -3 | 101 |\n| -4 |\
  \ 100 |\n\n我们仍然可以通过观察第一位来判断一个数字是正是负：负数位 1，正数位 0。然而，补码是非对称的：由于 0 被视为正数，数字的范围是从 −4\
  \ 到 3，或者从 −16 到 15，依此类推。结果是，即使 `x` 是一个有效数字，`-x` 也可能无效。\n\n我们可以直接在 Python 中使用 `0b`\
  \ 前缀写二进制数：\n\n```\nprint(0b101101) # (1 * 32) + (1 * 8) + (1 * 4) + 1\n```\n\n```\n\
  45\n```\n\n正如第 3 章所示，程序员通常使用十六进制：数字 0–9 具有通常含义，字母 A-F（或 a-f）用于表示数字 11–15。我们用 `0x`\
  \ 前缀表示我们正在使用十六进制，因此 `0xF7` 是 `(15��× 16) + 7`，即十进制的 247。每个十六进制位对应四个位（表 17.2），所以两个十六进制位正好是一个字节，这使得位与数字之间的转换变得非常容易：例如，`0xF7`\
  \ 是 `0b11110111`。\n\nTable 17.2: 十六进制数字。\n\n| 十进制 | 十六进制 | 位 | 十进制 | 十六进制 | 位 |\n\
  | --- | --- | --- | --- | --- | --- |\n| 0 | 0 | 0000 | 8 | 8 | 1000 |\n| 1 | 1\
  \ | 0001 | 9 | 9 | 1001 |\n| 2 | 2 | 0010 | 10 | A | 1010 |\n| 3 | 3 | 0011 | 11\
  \ | B | 1011 |\n| 4 | 4 | 0100 | 12 | C | 1100 |\n| 5 | 5 | 0101 | 13 | D | 1101\
  \ |\n| 6 | 6 | 0110 | 14 | E | 1110 |\n| 7 | 7 | 0111 | 15 | F | 1111 |\n\n## 17.2 位运算\
  \ (Bitwise Operations)\n\n和大多数基于 C 的语言一样，Python 拥有用于直接处理 1 和 0 的**位运算**：`&`（与）、`|`（或）、`^`（异或）、`~`（取反）。`&`\
  \ 只有当两个位都为 1 时才产生 1，`|` 只要其中一个位为 1 就会产生 1。`^` 称为**异或**（exclusive or），当两个位不同时产生 1。最后，`~`\
  \ 反转其参数：1 变成 0，0 变成 1。当这些运算符应用于多位值时，它们独立处理位，如表 17.3 所示。\n\nTable 17.3: 位运算。\n\n\
  | 表达式 | 位运算 | 结果（位） | 结果（十进制） |\n| --- | --- | --- | --- |\n| 12 & 6 | 1100 & 0110\
  \ | 0100 | 4 |\n| 12 | 6 | 1100 | 0110 | 14 |\n| 12 ^ 6 | 1100 ^ 0110 | 1010 | 10\
  \ |\n| 12 ~ 6 | ~1100 | ~0110 | 1001 | 9 |\n| 12 << 2 | 1100 << 2 | 110000 | 48\
  \ |\n| 12 >> 2 | 1100 >> 2 | 0011 | 3 |\n\n我们仍然可以通过观察第一位来判断一个数字是正是负：负数位 1，正数位 0。然而，补码是非对称的：由于\
  \ 0 被视为正数，数字的范围是从 −4 到 3，或者从 −16 到 15，依此类推。结果是，即使 `x` 是一个有效数字，`-x` 也可能无效。\n\n##\
  \ 17.3 文本 (Text)\n\n存储文本的规则使得整数变得简单。20 世纪 70 年代初，大多数程序使用 **ASCII**，它用数字 32 到 127\
  \ 表示无重音拉丁字符。（数字 0 到 31 用于**控制代码**，如换行、回车和响铃。）由于计算机使用 8 位字节，而数字 0–127 只需要 7 位，程序员可以自由使用数字\
  \ 128–255 表示其他字符。遗憾的是，不同的程序员使用它们来表示不同的符号：非拉丁字符、如方框之类的图形字符等等。这种混乱最终被 **ANSI 标准**所平定，该标准（例如）定义值\
  \ 231 为字符“ç”。\n\n\n\n\n\n解决方案是一种名为 `Unicode` 的新双部分标准。第一部分为每个字符定义了一个 `code point`（代码点）：例如大写拉丁字母“A”对应\
  \ `U+0065`，黑色星形对应 `U+2605` 等等（Unicode 联盟网站[¹ 提供了完整的列表）。第二部分定义了在内存中存储这些值的方法。其中最的是\
  \ `UTF-32`，它将每个字符存储存储一个 32 位数字。如果文本是用西欧语言编写的，这种方案会浪费大量内存，因为它使用的存储空间是绝对必要的四倍，但它很容易处理。\n\
  \n最流行的编码是 `UTF-8`，它是`变变长度`的。从 0 到 127 的每一个代码点都存储在一个字节中，其高位为 0，这与原始的 ASCII 标准完全相同。另一方面，如果字节的最高位为\
  \ 1，则高位之后、第一个 0 之前的 1 的数量将告诉 `UTF-8` 该字符的表示还需要额外多少个字节。例如，如果字符的第一个字节是 `11101101`\
  \ 则：\n\n*   第一个 1 信号这是一个多字节字符；\n*   接下来的两个 1 信号该字符还包含了后续两个字节的位；\n*   0 将字节计数与用于字符的前几个位隔离开来；以及\n\
  *   最后的 `1101` 是该字符的前四位。\n\n但并不是全部：每一个作为字符延续的字节都以位 `10` 开头。（意料之中，这些字节被称为 `continuation\
  \ bytes`，延续字节）。这条规则意味着，如果我们查看字符串中的任何字节，都可以立即判断它是某个字符的开始，还是某个字符的延续。因此，为了表示代码点为 1789\
  \ 的字符：\n\n*   我们将十进制 1789 转换为二进制 `11011111101`。\n*   我们计数并发现我们需要两个字节：第一个字节存储字符的高\
  \ 5 位，第二个字节存储低 6 位。\n*   我们将高 5 位编码为 `11011011`：“一个包含一个延续字节和 5 位负载位 `11011` 的字符的开头”。\n\
  *   我们将低 6 位编码为 `10111101`：“一个带有 6 位负载位 `111101` 的延续字节”。\n\n## 17.4 现在，关于持久化\n\n\
  第 16 章 展示了如何将数据存储为人类可读的文本。将其存储在人们无法轻易读取的格式中通常三个原因：\n\n1.  大小。字符串“10239472”长度为 8\
  \ 字节，但它代表的 32 位整数在内存中只需要 4 字节。对于小型数据集这并不重要，但对于大数据集是，而且数据必须在磁盘和内存之间或不同计算机之间移动时，这一点非常重要。\n\
  2.  速度。相加整数 34 和 56 是单机器操作。相加字符串“34”和“56”所代表的值需要几十次操作；我们将在练习中探讨这一点。大多数读写文本文件的程序都会使用类似\
  \ `int` 或 `float` 的函数将文件中的值转换为二进制数据，但如果我们打算多次处理数据，那么避免重复支付转换成本是有意义的。\n3.  没有更好的方法。可以将图像表示为\
  \ ASCII 艺术，但声音呢？或者视频呢？这是可能的，但几乎不合理。\n\n最后，无论值最终如何存储，某处的某人都必须将来自数字温度计的信号转换为数字。这些信号几乎肯定是以\
  \ 1 和 0 的流的形式到达，而上面的位运算几乎肯定被用于这种转换。\n\n保存和加载二进制数据的第一步是正确地写入和读取它。如果我们使用 `open(\"\
  filename\", \"r\")` 打开文件进行读取，Python 则假设我们想从文件中读取字符字符串。因此，它：\n\n*   向操作系统请求默认字符编码（几乎总是是\
  \ `UTF-8`）；\n*   使用该编码将字节转换为字符；以及\n*   如有必要将 Windows 换行符转换为 Unix 标准。由于历史原因，Windows\
  \ 同时使用回车符 `\\r` 和换行符 `\\n` 来标记一行的结束，而 Unix 只使用后者。Python 在输入时将 Windows 转换为 Unix，在输出时反之亦然，这样程序（通常）就不需要担心这种差异。\n\
  \n当我们处理文本时，这些翻译非常方便，但它们会破坏二进制数据：我们可能不希望 PNG 图像中的像素以这些方式被转换。正如第 3 章 中提到的，如果我们使用 `open(filename,\
  \ \"rb\")`（在 'r' 后面加小写的 'b'）以二进制模式打开文件，Python 将以 `bytes` 对象而不是字符字符串的形式返回文件内容。在这种情况下，我们几乎总是使用\
  \ `reader.read(N)` 每次读取 `N` 个字节，而不是使用 `line in reader`，因为文件中实际上并没有文本行。\n\n但我们实际上应该存储什么值？C\
  \ 和 Fortran 操作的是“裸”值：程序直接使用它们得到的值。\n\n\n\n\n\n`\\x1f` 是什么？它为什么会在我们的数据中？如果 Python\
  \ 在字符串中发现一个不对应打印字符的字节，它会以十六进制打印一个 2 位数的 `escape sequence`（转义序列）。因此，Python 正在告诉我们我们的字符串包含了这八个字节\
  \ [`\\x1f`, `\\x00`, `\\x00`, `\\x00`, `A`, `\\x00`, `\\x00`, `\\x00`]。十六进制的 `1F`\
  \ 等于 `(1 × 16¹) + (15 × 16⁰)`，即 31；‘A’是我们的 65，因为大写字母 `A` 的 ASCII 码值为 65。所有其他字节都是零（`\\\
  x00`），因为我们的每个整数都是 32 位的，而有效位只填充了每个字节。\n\n`struct` 模块提供了许多不同的格式，其中一些在表 17.4 中显示。某些格式，如代表单个字符的\
  \ `c`，是自解释其明的。`B` 格式打包或解包整数的最低 8 位；`h` 格式取最低 16 位并执行相同的操作。之所以需要它们，是因为二进制数据格式通常只存储它们需要的数据，因此我们需要一种方法从文件中提取\
  \ 8 位和 16 位的值。（例如，许多音频格式每个样本只存储 16 位。）\n\nTable 17.4: struct 数据包格式。\n\n| 格式 | 含义\
  \ |\n| --- | --- |\n| `c` | 单个字符（即长度为 1 的字符串） |\n| `B` | 无符号 8 位整数，所有 8 位都用于表示值\
  \ |\n| `h` | 16 位整数 |\n| `i` | 32 位整数 |\n| `d` | 64 位浮点数 |\n\n任何格式前面都可以跟上一个计数，所以格式\
  \ `3i` 意味着`三个整数`：\n\n```\nfrom struct import pack\n\nprint(pack(\"3i\", 1, 2, 3))\n\
  print(pack(\"5s\", bytes(\"hello\", \"utf-8\")))\nprint(pack(\"5s\", bytes(\"a longer\
  \ string\", \"utf-8\")))\n```\n\n```\nb'\\x01\\x00\\x00\\x00\\x02\\x00\\x00\\x00\\\
  x03\\x00\\x00\\x00'\nb'hello'\nb'a lon'\n```\n\n我们在最后一次调用中得到了错误的答案，因为我们只告诉 Python\
  \ 打包五个字符。我们该如何告诉它无论长度如何都打包所有存在的数据呢？\n\n短答案是我们不能这样做：我们必须指定想要打包的内容。但这并不意味着我们无法处理变长字符串；它只是意味着我们必须使用这样的表达式动态构造格式：\n\
  \n```python\nformat = f\"{len(str)}s\"\n```\n\n如果 `str` 包含字符串 `example`，上面的表达式会将\
  \ `7s` 赋值给 `format`，在*只要所有字符都能用单个字节表示*的情况下，这恰好就是用于打包它的正确格式。我们将在练习题中探索带有其他字符的字符串打包和解包。\n\
  \n在写入时保存格式解决了一半问题，但在读取时我们如何知道获取多少数据呢？例如，假设我们有两个字符串 `hello` 和 `Python`。我们可以这样打包它们：\n\
  \n```python\npack('5s6s', 'hello', 'Python')\n```\n\n但我们如何知道先解包 5 个字符再 6 个字符呢？技巧是将大小与数据一起保存。如果我们始终使用完全相同的字节数来存储大小，就可以安全地读取它，然后用它来确定字符串有多大：\n\
  \n```python\ndef pack_string(as_string):\n    as_bytes = bytes(as_string, \"utf-8\"\
  )\n    header = pack(\"i\", len(as_bytes))\n    format = f\"{len(as_bytes)}s\"\n\
  \    body = pack(format, as_bytes)\n    return header + body\n```\n\n```python\n\
  if __name__ == \"__main__\":\n    result = pack_string(\"hello!\")\n    print(repr(result))\n\
  ```\n\n```\nb'\\x06\\x00\\x00\\x00hello!'\n```\n\n解包函数也是类似的。我们将**内存缓冲区**拆分为一个恰好为四个字节长度的头部（即整数的正确大小）和一个由剩余部分组成的体。然后我们解包头部（我们知道头部的格式），以确定字符串中有多少个字符。一旦得到了这些信息，我们使用之前之前的技巧动态构造正确的格式，然后解包字符串并返回。\n\
