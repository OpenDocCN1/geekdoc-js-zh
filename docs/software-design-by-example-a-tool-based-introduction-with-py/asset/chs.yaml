  \n## B. 使用属性\n\n由于函数是对象，它们拥有属性。`dir()` 函数返回它们的名称列表：\n\n```python\ndef example():\n\
  \    \"Docstring for example.\"\n    print(\"example\")\n\nprint(dir(example))\n\
  ```\n\n```\n['__annotations__', '__builtins__', '__call__', '__class__', '__closure__',\
  \ '__code__', '__defaults__', '__delattr__', '__dict__', '__dir__', '__doc__', '__eq__',\
  \ '__format__', '__ge__', '__get__', '__getattribute__', '__globals__', '__hash__',\
  \ '__init__', '__init_subclass__', '__kwdefaults__', '__le__', '__lt__', '__module__',\
  \ '__name__', '__ne__', '__new__', '__qualname__', '__reduce__', '__reduce_ex__',\
  \ '__repr__', '__setattr__', '__sizeof__', '__str__', '__subclass__']\n```\n\n大多数程序员不需要使用这些大部分属性，但\
  \ `name` 存储函数的原始名称，`doc` 存储它的文档字符串（docstring）：\n\n```python\nprint(\"docstring:\"\
  , example.__doc__)\nprint(\"name:\", example.__name__)\n```\n\n```\ndocstring: Docstring\
  \ for example.\nname: example\n```\n\n我们可以修改第六章的测试器，使用函数的 `name` 属性而不是 `globals`\
  \ 字典中的键：\n\n```python\ndef run_tests(prefix):\n    for (name, func) in globals().items():\n\
  \        if name.startswith(prefix):\n            try:\n                func()\n\
  \                print(func.__name__, \"passed\")\n            except AssertionError:\n\
  \                print(func.__name__, \"failed\")\n            except Exception:\n\
  \                print(func.__name__, \"had error\")\n\nrun_tests(\"test_\")\n```\n\
  \n```\ntest_sign_negative passed\ntest_sign_positive passed\ntest_sign_zero failed\n\
  test_sign_error had error\n```\n\n非常有用，我们可以说，如果测试函数的文档字符串包含 `test:skip` 字符串，我们就跳过该测试，而\
  \ `test:fail` 表示我们预期该测试失败。让我们重写测试来展示这一点：\n\n```python\nTEST_FAIL = \"test:fail\"\
  \nTEST_SKIP = \"test:skip\"\n\ndef test_sign_negative():\n    \"test:skip\"\n  \
  \  assert sign(-3) == -1\n\ndef test_sign_positive():\n    assert sign(19) == 1\n\
  \ndef test_sign_zero():\n    \"test:fail\"\n    assert sign(0) == 0\n\ndef test_sign_error():\n\
  \    \"\"\"Expect an error.\"\"\"\n```\n\n\n\n\n```python\ndef run_tests(prefix):\n\
  \    all_names = [n for n in globals() if n.startswith(prefix)]\n    for name in\
  \ all_names:\n        func = globals()[name]\n        kind = classify(func)\n  \
  \      try:\n            if kind == \"skip\":\n                print(f\"skip: {name}\"\
  )\n            else:\n                func()\n                print(f\"pass: {name}\"\
  )\n        except AssertionError as e:\n            if kind == \"fail\":\n     \
  \           print(f\"pass (expected failure): {name}\")\n            else:\n   \
  \             print(f\"fail: {name} {str(e)}\")\n        except Exception as e:\n\
  \            print(f\"error: {name} {str(e)}\")\n\nrun_tests(\"test_\")\n```\n\n\
  ## B.2 延迟求值\n\n> *本内容扩展了 第 7 章。*\n\n评估设计的一种方法是询问它的可扩展性如何。对于我们的解释器，答案现在是“非常容易”。例如，我们可以通过编写\
  \ `do_comment` 函数来添加一个什么都不做并返回 None 的“操作”注释：\n\n```python\ndef do_comment(env, args):\n\
  \    \"\"\"忽略指令。\n    [\"comment\" \"text\"] => None\n    \"\"\"\n    return None\n\
  ```\n\nif 语句稍微复杂一些。如果它的第一个参数为真，它会求值并返回第二个参数（“if”分支）。否则，它会求值并返回第三个参数（“else”分支）：\n\
  \n```python\ndef do_if(env, args):\n    \"\"\"做出选择：仅有一个子表达式被求值。\n    [\"if\" C B]\
  \ => A if B\n    \"\"\"\n    assert len(args) == 3\n    cond = do(env, args[0])\n\
  \    choice = args[1] if cond else args[2]\n    return do(env, choice)\n```\n\n\
  正如我们在 [第 8 章] 中提到的，这被称为延迟求值（lazy evaluation），以区别于评估所有内容的普通急求值（eager evaluation）。`do_if`\
  \ 只求值它绝对需要的内容；大多数语言这样做是为了让我们安全地编写如下代码：\n\n```python\nif x != 0:\n    return x\n\
  else:\n    return None\n```\n\n如果语言总是求值两者，那么当 `x` 为零时，上面的代码就会失败。在这种情况下，语言应该做什么似乎是显而易见的，但大多数语言对\
  \ `and` 和 `or` 也使用延迟求值，这样像这样的表达式：\n\n```\nthing and thing.part\n```\n\n如果 `thing`\
  \ 是 None，那么它将产生 None。\n\n## B.3 扩展\n\n> *本内容扩展了 第 13 章。*\n\n通过扩展 `NodeVisitor` 来检查单个规则是很容易的，但如果我们想检查几十条规则呢？转换几十次\
  \ AST 将是低效的。而且，如果我们想让人们能够添加自己的规则呢？继承并不是解决此问题的正确工具：如果几个人都创建了带有 `visit_Name` 方法的自定义\
  \ `NodeVisitor`，我们必须继承所有的类，然后让新类的 `visit_Name` 调用所有父类的方法。\n\n解决此问题的一种方法是在类定义后向类中注入方法。下面的代码片段创建了一个名为\
  \ `NodeVisitor` 的新类，它没有向 `NodeVisitor` 添加任何内容，然后在它定义后使用 `setattr` 为其添加了一个方法：\n\n\
  ```python\nclass BlankNodeVisitor(ast.NodeVisitor):\n    pass\n\ndef print_name(self,\
  \ node):\n    print(node.id)\n\nsetattr(BlankNodeVisitor, \"visit_Name\", print_name)\n\
  ```\n\n![](img/figb_1.jpg)\n\n图 B.1 在定义后向类添加方法。\n\n这个技巧之所以有效，是因为类和对象只是特殊化的字典（在某种意义上“如此”）。如果我们创建一个\
  \ `BlankNodeVisitor` 的对象并调用它的 `visit` 方法：\n\n```python\nwith open(sys.argv[1], \"\
  r\") as reader:\n    source = reader.read()\ntree = ast.parse(source)\nfinder =\
  \ BlankNodeVisitor()\nfinder.visit(tree)\n```\n\n那么继承的 `generic_visit` 方法将执行它如常的操作。当它遇到\
  \ `Name` 节点时，它会在对象中查找名为 `visit_Name` 的内容。由于没有找到，它会在对象的类中查找同名内容，找到我们注入的方法并调用它。\n\n\
  再多花一点精力，我们可以让注入的方法保存并调用在添加到类时已存在的任何 `visit_Name` 方法，但我们很快就会遇到问题。正如我们在之前的示例中看到的，处理节点的方法负责决定以及何时递归进入这些节点的节点。如果我们把方法堆在另一个方法之上，那么每个方法都会触发递归（因此我们会递归很多次），或者必须某种方式让每个方法信号它是否执行了递归，以便其他方法不要这样做。\n\
  \n为了避免这种复杂性，大多数系统使用不同的方法。考虑这个类：\n\n```python\nHandler = namedtuple(\"Handler\",\
  \ [\"func\", \"data\"])\n\nclass RegisterNodeVisitor(ast.NodeVisitor):\n    def\
  \ __init__(self):\n        super().__init__()\n        self.handlers = {}\n\n  \
  \  def add_handler(self, nodeType, func, data=None):\n        handler = Handler(func,\
  \ data)\n        if nodeType not in self.handlers:\n            self.handlers[nodeType]\
  \ = []\n        self.handlers[nodeType].append(handler)\n\n    def visit_Name(self,\
  \ node):\n        for handler in self.handlers.get(ast.Name, []):\n            handler.func(node,\
  \ handler.data)\n```\n\n`add_handler` 方法接受三个参数：回调函数旨在处理的节点类型、函数本身，以及一个与 AST 节点一起传递给函数的可选额外数据。它将处理函数和数据保存在以\
  \ `nodeType` 索引的查找表中。\n\n## B.4 追踪继承\n\n> *本内容扩展了 第 13 章。*\n\n为了跟踪我们写的代码，我们构建了一个工具来报告类中定义了方法。为了展示它的工作原理，此文件定义了类，每个类都定义了方法：\n\
  \n```python\nclass Parent:\n    def red(self):\n        pass\n\n    def green(self):\n\
  \        pass\n\nclass LeftChild(Parent):\n    def green(self):\n        pass\n\n\
  \    def blue(self):\n        pass\n\nclass RightChild(Parent):\n    def red(self):\n\
  \        pass\n\n    def blue(self):\n        pass\n\nclass GrandChild(LeftChild):\n\
  \    def red(self):\n        pass\n\n    def blue(self):\n        pass\n\n    def\
  \ orange(self):\n        pass\n```\n\n正如 [第 13 章] 所示，我们类的构造函数创建了一个栈来跟踪我们所在的位置。它还创建了几个字典来跟踪类之间的继承关系以及每个类定义的方法：\n\
  \n```python\nclass FindClassesAndMethods(ast.NodeVisitor):\n    def __init__(self):\n\
  \        super().__init__()\n        self.stack = []\n        self.parents = {}\n\
  \        self.methods = {}\n```\n\n当我们遇到一个新的类定义时，我们将它的名称推入栈，记录其父类，并创建一个空集来存放它的方法：\n\
  \n```python\ndef visit_ClassDef(self, node):\n    class_name = node.name\n    assert\
  \ class_name not in self.methods\n    self.stack.append(class_name)\n    self.methods[class_name]\
  \ = set()\n    self.parents[class_name] = {p.id for p in node.bases}\n    self.generic_visit(node)\n\
  \    self.stack.pop()\n```\n\n\n\n\n\n当我们遇到函数定义时，执行的第一件事是检查栈。如果栈是空的，说明我们正在看的是一个顶层函数而不是方法，因此我们无事要做。（实际上，我们应该递归遍历函数的子节点，因为在函数内部定义类是可能的，但我们将其留作练习题。）另一方面，如果这个函数定义在一个类内部，我们将它的名称加入记录中：\n\
  \n```python\n def visit_FunctionDef(self, node):\n    if not self.stack:\n     \
  \   return\n    class_name = self.stack[-1]\n    assert class_name in self.methods\n\
  \    method_name = node.name\n    assert method_name not in self.methods[class_name]\n\
  \    self.methods[class_name].add(method_name)\n```\n\n一旦完成对 AST（抽象语法树）的搜索，我们就打印出见过的类和方法的表格（表\
  \ B.1）。我们可以让这种显示更易读——例如，我们可以按照父类到子类的顺序对类进行排序，并按照首次定义的顺序显示方法——但这些都不需要我们检查 AST。\n\n\
  Table B.1: 继承与方法。\n\n| | GrandChild | LeftChild | Parent | RightChild |\n| --- |\
  \ --- | --- | --- | --- |\n| blue | X | X | | X |\n| green | | X | X | |\n| orange\
  \ | X | | | |\n| red | X | | X | X |\n\n## B.5 检查函数\n\n> [Note]: *本材料扩展了 第 15 章。*\n\
  \n第 15 章中 dataframe 过滤的实现有些脆弱。更好的过滤实现将利用 Python 的 `inspect`¹ 模块，该模块允许我们检查内存中的对象。特别地，`inspect.signature`\
  \ 可以告诉我们函数接受了哪些参数：\n\n```python\n import inspect\n\ndef example(first, second):\n\
  \    pass\n\nsig = inspect.signature(example)\nprint(\"signature:\", sig)\nprint(\"\
  type:\", type(sig))\nprint(\"names:\", sig.parameters)\nprint(\"parameters:\", list(sig.parameters.keys()))\n\
  ```\n\n```python\n signature: (first, second)\ntype: <class 'inspect.Signature'>\n\
  names: OrderedDict([('first', <Parameter \"first\">), ('second', \\\n<Parameter\
  \ \"second\">)])\nparameters: ['first', 'second']\n```\n\n例如，如果用户想要比较 dataframe\
  \ 的红色和蓝色列，他们可以给我们提供一个有两个名为 `red` 和 `blue` 参数的函数。然后我们可以使用这些参数名称来确定我们需要从 dataframe\
  \ 中获取哪些列。\n\n## B.6 用户自定义类\n\n> [Note]: *本材料扩展了 第 16 章。*\n\n第 16 章的持久化框架只处理内置数据类型，但可以很容易扩展到处理用户自定义类。首先，我们重构代码，使得\
  \ `save` 方法不会变得过大：\n\n```python\n class SaveExtend(SaveAlias):\n    def __init__(self,\
  \ writer):\n        super().__init__(writer)\n\n    def save(self, thing):\n   \
  \     if self._aliased(thing):\n            return\n        if self._builtin(thing):\n\
  \            return\n        assert False, f\"Don't know how to handle {thing}\"\
  \n```\n\n处理内置类型的方法是：\n\n```python\n def _builtin(self, thing):\n    typename = type(thing).__name__\n\
  \    method = f\"_{typename}\"\n    if not hasattr(self, method):\n        return\
  \ False\n    self.seen.add(id(thing))\n    getattr(self, method)(thing)\n    return\
  \ True\n```\n\n而处理别名的是：\n\n```python\n def _aliased(self, thing):\n    thing_id\
  \ = id(thing)\n    if thing_id not in self.seen:\n        return False\n    self._write(\"\
  alias\", thing_id, \"\")\n    return True\n```\n\n这些代码并不是新的：我们只是将它们移动到了方法中，以便每个方法都更容易理解。那么，类如何指示它它可以被保存和加载呢？我们的选项有：\n\
  \n1. 要求它继承自我们提供的基类，这样我们就可以使用 `isinstance` 来检查对象是否是持久化的。这种方法用于 Java 这种强类型语言中，但方法\
  \ #2 被认为更具 `Pythonic`](#glossary.xhtml_d25)。\n2. 要求它实现一个特定名称的方法，而不需要派自特定的类。这种方法被称为`鸭子类型`](#glossary.xhtml_d11）：如果它走起来像鸭，叫起来也像鸭，那它就是只鸭。由于选项\
  \ #1 要求用户编写该方法，因此这是我们将选择的选项。\n3. 要求用户注册一个`辅助类`](#glossary.xhtml_d15)，该辅助类知道如何保存和加载我们感兴趣的类的对象。这种方法也常用于强类型语言，作为一种在破坏层次结构后添加持久化的方式。\n\
  \n为了实现选项 #2，我们规定：如果一个类有一个 `to_dict` 方法，我们将调用它来以字典的形式获取对象的内容，然后对其进行持久化。尽管在这样做之前，我们会保存一行，指示该字典应该被用于重构某个特定类的对象：\n\
  \n```python\n def _extension(self, thing):\n    if not hasattr(thing, \"to_dict\"\
  ):\n        return False\n    self._write(\"@extension\", id(thing), thing.__class__.__name__)\n\
  \    save(thing.to_dict())\n    return True\n```\n\n加载用户自定义类需要更多工作，因为我们必须将类名映射回实际类（我们也可以使用内省来找到程序中的*所有*类，并为具有正确方法的类构建查找表）。我们首先修改加载器的构造函数，使其接受零个或多个\
  \ `extensions` 作为参数，然后从它们构建一个从名称到类的查找表：\n\n```python\n class LoadExtend(LoadAlias):\n\
  \    def __init__(self, reader, *extensions):\n        super().__init__(reader)\n\
  \        self.seen = {}\n        self.extensions = {e.__name__ for e in extensions}\n\
  ```\n\n`load` 方法随后按顺序查找别名、内置类型和扩展。我们不是使用 `if` 语句链，而是遍历处理这些情况的方法。如果某个方法决定可以处理输入的数据，它将返回结果；如果不能，它将抛出\
  \ `KeyError` 异常，如果没有任何方法能处理该情况，我们就失败：\n\n```python\n def load(self):\n    key, ident,\
  \ value = self._next()\n    for method in (self._aliased, self._builtin, self._extension):\n\
  \        try:\n            return method(key, ident, value)\n        except KeyError:\n\
  \            pass\n    assert False, f\"Don't know how to handle {key} {ident} {value}\"\
  \n```\n\n处理内置类型和别名的代码是从之前的工作中复制并修改为抛出 `KeyError` 的：\n\n```python\n def _aliased(self,\
  \ key, value):\n    if key != \"alias\":\n        raise KeyError()\n    assert ident\
  \ in self.seen\n    return self.seen[ident]\n\ndef _builtin(self, key, value):\n\
  \    method = f\"_{key}\"\n    if not hasattr(self, method):\n        raise KeyError()\n\
  \    return getattr(self, method)(ident, value)\n```\n\n处理扩展的方法检查刚读取的值是否指示扩展，然后从输入流读取包含对象内容的字典，并使用它构建正确类的实例：\n\
  \n```python\n def _extension(self, key, value):\n    if (key != \"@extension\")\
  \ or (value not in self.extensions):\n        raise KeyError()\n    cls = self.extensions[value]\n\
  \    contents = self.load()\n    return cls(**contents)\n```\n\n这是一个定义了所需类：\n\n\
  ```python\n class Parent:\n    def __init__(self, name):\n        self.name = name\n\
  \n    def to_dict(self):\n        return {\"name\": self.name}\n```\n\n这是一个为了确保一切正常运行的测试：\n\
  \n```python\n def test_extend_extension_class():\n    fixture = Parent(\"subject\"\
  )\n    writer = StringIO()\n    Save(writer).save(fixture)\n    reader = StringIO(writer.getvalue())\n\
  \    result = Load(reader, Parent).load()\n    assert isinstance(result, Parent)\n\
  \    assert result.name == fixture.name\n```\n\n\n\n\n\n浮点数的存储规则使得 Unicode 的规则显得非常简单。问题的根源在于，我们无法用有限的位模式来表示无限多个实值。无论我们表示的是什么值，在每两个值之间都有无限多个我们无法表示的数值。接下来的解释为了易于理解进行了简化；更多详细信息请参阅\
  \ `[Goldberg1991]`。\n\n浮点数由符号位、一个尾数和一个指数组成。在 32 位字中，`IEEE 754` 标准要求使用 1 位符号位、23\
  \ 位尾数和 8 位指数。我们将使用一个小得多的表示方法来说明其工作原理：无符号位，3 位尾数，以及 2 位指数。图 B.2 显示了该方案可以表示的值。\n\n\
  ![](img/figb_2.jpg)\n\n图 B.2: 表示浮点数。\n\nIEEE 标准通过移动位置来避免这种表示法中的冗余。然而尽管如此，这种格式仍然无法表示许多值：例如，我们的方案可以存储\
  \ 8 和 10，但不能存储 9。这与手持计算器处理 1/3 等分数时面临的问题完全相同：在十进制中，我们必须将其舍入为 0.3333 或 0.3334。\n\n\
  但如果该方案没有 9 的表示，那么 8 + 1 必须被存储为 8 或 10。那么 8 + 1 + 1 应该是多少？如果我们从左侧加，(8 + 1) + 1 是\
  \ 8 + 1 是 8；但如果我们从右侧加，8 + (1 + 1) 是 8 + 2 是 10。改变运算顺序会导致正确与错误的区别。\n\n数值库的作者花费大量时间担心这类问题。在这种情况下，对值进行排序并从小到大相加，获得最佳可能答案的机会最大。在其他情况下（例如求矩阵逆），规则要复杂得多。\n\
  \n关于我们的数线的另一个观察结果是，虽然值的分布是不均匀的，但每组值之间的*相对*间距保持不变：第一组之间的间隔为 1，然后间距变为 2，然后是 4，依此类推。这一观察得出了几个实用的定义：\n\
  \n*   近似值的绝对误差 是近似值与实际值之间差值的绝对值。\n*   相对误差 是绝对误差与我们所近似的绝对值之比。\n\n例如，在近似 8+1 和 56+1\
  \ 时偏差 1 是相同的绝对误差，但第一种情况的相对误差比第二种大。相对误差几乎比绝对误差更有用：当问题数值是十分之一时，说我们偏差了百分分之一几乎没有意义。\n\
  \n这的一个影响是，我们永远不应该使用 `==` 或 `!=` 来比较浮点数，因为以不同方式计算的两个数字位可能没有完全相同。不过，使用 `<`, `>`, `=`\
  \ 和其他排序是安全的，因为它们不依赖于精确到最后一位的相同。\n\n如果我们确实想比较浮点数，可以使用类似 `pytest`³ 中的 `approx` 类²，它会检查两个数字是否在彼此的某个容差范围内。另一种完全不同的方法是使用类似\
  \ `fractions`⁴ 模块（正如其名所示，使用分子和分母来避免某些精度问题）。本文⁵ 描述了该模块的一个巧妙用法。\n\n## B.8 大端序和小端序\n\
  \n> *本部分内容扩展了第 17 章。*\n\n假设我们要在内存中存储一个 32 位整数。如图 B.3 所示，我们可以以两种不同的方式对四个字节进行排序。小端\
  \ 将整数的低有效位存储在内存的第一个（最低）地址，而大端序先存储高有效位。\n\n![](img/figb_3.jpg)\n\n图 B.3: 大端序和小端序字节序。\n\
  \n现代英特尔处理器使用小端序，但正如本文⁶ 所解释的，某些其他处理器（以及大多数网络协议）使用大端序。两者都有优缺点，我们在此不展开。你*确实*需要知道，如果你将数据从一种架构移动到另一种架构，翻转字节是你的责任，因为机器会指示这一点。\n\
  \n| 字符 | 字节序 | 大小 |\n| :--- | :--- | :--- |\n| --- | --- | --- |\n| @ | native |\
  \ native |\n| = | native | native |\n| < | little | endian |\n| > | big | endian\
  \ |\n| ! | big | endian |\n\n## B.9 生成测试用例\n\n> *本部分内容扩展了第 20 章.*\n\n假设我们要在内存中存储一个\
  \ 32 位整数。像 Z3⁸ 这样的定理证明器比大多数想象的强大得多。借鉴 Andreas Zeller⁹ 的例子，我们可以生成测试用例。我们可以设置整数变量：\n\
  \n```\nA = Int(\"A\")\nB = Int(\"B\")\nC = Int(\"C\")\nlengths = (A > 0, B > 0,\
  \ C > 0)\n```\n\n然后让它创建一个等边三角形：\n\n```\nequilateral = And(A == B, B == C)\nsolver\
  \ = Solver()\nsolver.add(lengths)\nsolver.add(equilateral)\nprint(\"equilateral\"\
  , solver.check(), solver.model())\n```\n\n```\nequilateral sat [C = 1, B = 1, A\
  \ = 1]\n```\n\n同样的技术可以生成不等边三角形：\n\n```\nscalene = And(A != B, B != C, C != A)\n\
  solver = Solver()\nsolver.add(lengths)\nsolver.add(scalene)\nprint(\"scalene\",\
  \ solver.check(), solver.model())\n\n```\n\n```\nscalene sat [C = 3, A = 1, B =\
  \ 2]\n```\n\n以及等腰三角形：\n\n```\nisosceles = Or(\n  And(A == B, C != A),\n  And(A ==\
  \ B, B != C),\n  And(A != B, B == C)\n)\nsolver = Solver()\nsolver.add(lengths)\n\
  solver.add(isosceles)\nprint(\"isosceles\", solver.check(), solver.model())\n```\n\
  \n```\nisosceles sat [C = 2, A = 1, B = 2]\n```\n\n\n\n\n- 哈希函数的输出是确定性的，但并不容易被预测。\n\
  - 一个良好的哈希函数的输出是均匀分布的。\n- 大规模加密哈希可用于唯一标识一个文件的内容。\n\n## 模式匹配\n\n- 使用通配符（globs）和正则表达式来匹配文本中的模式。\n\
  - 使用继承使匹配器具有可组合性和可扩展性。\n- 通过对象将工作委托给其他对象来简化代码。\n- 使用 `Null Object` 空对象模式来消除代码中的特殊情况。\n\
  - 使用标准重构将代码从一个工作状态移动到另一个状态。\n- 先构建并检查你最不把握的代码部分，以确定你的设计是否可行。\n\n## 文本解析\n\n- 解析是将人类易读的文本转换为计算机易处理的对象。\n\
  - 语法定义了解析器识别的文本模式。\n- 大多数解析器会对输入文本进行分词（tokenize），然后分析这些标记（tokens）。\n- 大多数解析器需要实现某种形式的优先级，以便对不同的模式进行排序。\n\
  - 加法和函数调用等操作的工作方式与定义的函数一样。\n- 程序可以通过定义编译器或解释器识别的特殊命名方法来重载内置运算符。\n\n## 运行测试\n\n-\
  \ 函数是可以保存在数据结构中或传递给其他函数的对象。\n- Python 使用类似字典的结构存储局部和变量。\n- 单元测试对固件（fixture）执行操作并通过、失败或产生错误。\n\
  - 程序可以使用内省（introspection）在运行时查找函数和其他对象。\n\n## 解释器\n\n- 编译器和解释器仅仅是程序。\n- 基础算术运算只是具有特殊表示法的函数。\n\
  - 程序可以表示为树，并存储为嵌套列表。\n- 解释器递归地将操作分发给实现底层步骤的函数。\n- 程序将变量存储在称为环境的堆式字典中。\n- 评估程序设计的方法之一是询问它的扩展性如何。\n\
  \n## 函数与闭包\n\n- 当我们定义函数时，我们的编程系统会保存指令供以后使用。\n- 由于函数仅仅是数据，我们可以将创建与命名分离。\n- 大多数编程语言使用急求值（eager\
  \ evaluation），在调用函数之前对参数进行求值。\n- 编程语言也可以使用懒性求值（lazy evaluation），将表达式传递给函数进行即时评估。\n\
  - 每次函数调用都会在调用堆栈上创建一个新的栈帧。\n- 当函数查找变量时，它会检查自己的栈帧和全局帧。\n- 闭包存储了在特定作用范围内引用的变量。\n\n\
  ## 协议\n\n- 临时用模拟对象（mock objects）替换函数可以简化测试。\n- 模拟对象可以它们的调用和/或返回变量结果。\n- Python 定义了协议，代码可以通过语言中的关键字触发。\n\
  - 使用上下文管理器协议确保清理操作始终执行。\n- 使用装饰器在定义函数后对其封装。\n- 使用闭包创建接收额外参数的装饰器。\n- 使用迭代器协议使对象能够用于\
  \ for 循环。\n\n## 文件归档器\n\n- 版本控制工具使用哈希来唯一标识每个保存的文件。\n- 文件组的每个快照都记录在清单（manifest）中。\n\
  - 测试时使用模拟文件系统比使用真实的更安全、更快。\n- 涉及多个文件的操作可能会遭受竞态条件的影响。\n- 使用基类来指定组件必须做什么，并派生子类来实现这些操作。\n\
  \n## HTML 验证器\n\n- HTML 由文本和由带有属性的标签表示的元素组成。\n- HTML 在内存中表示为 `Document Object Model`\
  \ (`DOM`) 树。\n- 树通常使用递归进行处理。\n- 访问者设计模式常用于对数据结构的每个成员执行操作。\n- 我们可以通过访问每个节点并记录发现的内容来总结并检查\
  \ HTML 页面的结构。\n\n## 模板扩展器\n\n- 静态网站生成器从模板、指令和数据创建 HTML 页面。\n- 静态网站生成器具有与语言相同的核心功能。\n\
  - 特用的小型语言很快变得与其他语言一样复杂。\n- 静态方法是将函数组合在一起的方便方法。\n\n## 代码检查器（Linter）\n\n- Linter 检查程序符合符合风格和使用规则。\n\
  - Linter 通常使用访问者模式在抽象语法树（AST）中寻找感兴趣的节点。\n- 程序可以修改程序的 `AST` 然后将其反解析（unparse）以创建原始程序的修改版本。\n\
  - 动态代码修改非常强大，但这种技术可能会产生不安全且不可维护的代码。\n\n## 页面布局\n\n- 布局引擎根据元素的大小和组织放置页面元素。\n- 页面元素组织为由基本块、行和列组成的树。\n\
  - 布局引擎根据每个块的大小及其父节点的位置计算每个块的位置。\n- 将块堆叠是渲染它们的简单方法。\n- 使用多重继承和混入类（mixin classes）将方法注入类中。\n\
  \n## 性能分析\n\n- 创建抽象类来指定接口。\n- 将二维数据存储为行或列。\n- 使用反射将数据匹配到函数参数。\n- 测量性能以评估工程上的权衡。\n\
  \n## 对象持久化\n\n- 持久化框架保存并恢复对象。\n- 持久化必须处理别名（aliasing）和循环引用。\n- 用户应该能够扩展持久化以处理他们自定义类型的对象。\n\
  - 软件设计应当对扩展开放，但对修改关闭。\n\n## 二进制数据\n\n- 程序通常使用补码而非符号和值来存储整数。\n- 字符通常使用 `ASCII`、`UTF-8`\
  \ 或 `UTF-32` 编码为字节。\n- 程序可以使用位运算符直接操作表示数据的位。\n- 低层编译语言通常存储原始值，而高层解释语言使用装箱值（boxed\
  \ values）。\n- 值的集合可以打包成连续的字节数组以便高效传输和存储。\n\n## 数据库\n\n- 数据库存储记录以便通过键访问。\n- 日志结构数据库将新记录追加到数据库并使旧版本失效。\n\
  - 类是可以像任何其他数据一样保存的数据结构。\n- 文件系统以固定大小的页保存数据。\n- 我们可以通过块存储记录来提高数据库的效率。\n\n## 构建管理器\n\
  \n- 构建管理器跟踪文件之间的依赖并更新过期的文件。\n- 每个构建规则都有目标、某些依赖项以及更新目标的配方。\n- 构建规则形成一个无环的有向图。\n-\
  \ 模式规则描述了相似文件的依赖关系和配方。\n- 模式规则可以使用自动变量指定配方中的目标和依赖。\n\n## 包管理器\n\n- 软件包通常有多个版本，通常由多部分语义版本号标识。\n\
  - 包管理器必须找到一组相互兼容的依赖项以安装包。\n- 寻找兼容包集等于在多维空间中搜索。\n- 寻找兼容包集的工作量随包数量的增加呈指数级增长。\n\n\n\
  \n\n\n* 自动定理证明器可以确定一组逻辑命题是否可以保持相互一致。\n* 大多数包管理器使用某种定理证明器来寻找兼容的软件包集合以进行安装。\n\n##\
  \ 传输文件\n\n* 网络上的每台计算机都有一个唯一的 IP 地址。\n* 域名系统 (DNS) 将人类可读的转换为 IP 地址。\n* 程序通过编号的套接字（sockets）发送和接收消息。\n\
  * 接收消息的程序负责解释消息中的字节。\n* 为了测试依赖网络的程序，可以使用模拟消息传输和接收的 mock 对象来替换网络。\n\n## 提供网页服务\n\n\
  * 超文本传输协议 (HTTP) 规定了通过套接字进行消息交互的一种方式。\n* 一个最小的 HTTP 请求包含一个方法、一个 URL 和协议版本。\n* 一个完整的\
  \ HTTP 请求可能还包含头部（headers）和主体（body）。\n* HTTP 响应包含状态码、状态描述，以及可选的头部和主体。\n* HTTP 是一个无状态协议：应用程序负责在请求之间记录信息。\n\
  \n## 文件查看器\n\n* `curses` 模块以平台无关的方式管理文本终端。\n* 当屏幕不可用时，将调试信息写入日志文件。\n* 可以使用可调用对象代替函数，以满足\
  \ API 的要求。\n* 使用合成数据测试程序。\n* 使用延迟构造和/或工厂方法可以使代码更容易演进。\n* 在尝试添加新功能之前重构代码。\n* 将管理数据的逻辑与显示数据的逻辑分离。\n\
  \n## 撤销与重做\n\n* 用 mock 对象替换用户界面组件以简化测试。\n* 记录操作和状态以检查这些 mock 对象的行为。\n* 使用对象表示操作以记录历史并实现撤销。\n\
  * 记录状态比记录更改更容易但成本更高。\n\n## 虚拟机\n\n* 每台计算机都有一个具有特定指令集、某些寄存器和内存的处理器。\n* 指令只是数字，但可以以汇编代码表示。\n\
  * 指令可以引用寄存器、内存、两者或两者都不引用。\n* 处理器通常按顺序执行指令，但可能会根据条件的真假跳转到另一个位置。\n\n## 调试器\n\n* 可以通过模拟输入和记录输出来测试交互式程序。\n\
  * 如果交互式程序的输入输出可以很容易替换为 mock 对象，那么测试交互式程序将变得更容易。\n* 调试器通常通过临时将实际指令替换为特殊指令来实现断点。\n\
  * 使用查找表进行函数或方法分发使程序更容易扩展。\n\n# D 许可证\n\n所有编写的材料均根据知识共享 署名-非商业性 4.0 国际许可 (`CC-BY-NC-4.0`)\
