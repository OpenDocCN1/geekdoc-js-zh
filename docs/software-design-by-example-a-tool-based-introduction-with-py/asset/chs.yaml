  \ 语句？\n2. 这些检查中有多少可以改用 `type hints`（类型提示）？\n\n# 8 函数与闭包\n\n评估一个软件设计的一种方法是询问它的扩展性如何，即我们多容易地添加或更改内容\
  \ [Wilson2022b]。对于第 7 章中的解释器的答案是“相当容易”，但对于它所解释的小型语言的答案是“完全不能”，因为用户无法在小型语言本身中定义新操作。我们需要给他们一种定义和调用函数的方法。这样做少于\
  \ 60 行代码，一旦我们理解了定义的原理，我们就能理解大多数现代编程语言的高级特性是如何工作的。\n\n## 8.1 定义与存储\n让我们从定义一个接受单个参数并立即返回它的函数开始。在\
  \ Python 中，它是：\n\n```python\n def same(num):\n    return num\n```\n\n它有一个名称、一个（可能是空的）参数列表和一个函数体（在这种情况下函数体是单条语句）。\n\
  \n我们的小型语言处理方式不同。由于函数只是另一种对象，我们可以独立定义它而不必给它命名：\n\n```\n [\"func\", [\"num\"], [\"\
  get\", \"num\"]]\n```\n\n为了以后使用保存该函数，我们只需将其赋值给名称，就像赋值任何其他值一样：\n\n```\n [\"set\"\
  , \"same\", [\"func\", [\"num\"], [\"get\", \"num\"]]]\n```\n\n## 8.2 调用函数\n在 Python\
  \ 中，我们通过 `same(3)` 调用此函数。我们的小型语言要求我们显式指定一个运算符，因此我们这样写调用：\n\n```\n [\"call\", \"\
  same\", 3]\n```\n\n为了让“call”按照大多数程序员预期的方式工作，我们需要实现作用域（scope），使得函数内部使用的参数和变量不会与外部定义的混淆。换句话说，我们需要防止命名冲突。当用一个或多个表达式作为参数调用函数时，我们将：\n\
  \n1. 求所有这些表达式的值。\n2. 查找函数。\n3. 根据函数的参数名和表达式的值创建一个新的环境（environment）。\n4. 调用 `do`\
  \ 来运行函数的动作并捕捉结果。\n5. 丢弃步骤 3 中创建的环境。\n6. 返回函数的结果。\n\n为了使此机制生效，环境必须是字典列表，而不是单个字典。这个列表是程序的程序的调用栈（call\
  \ stack），列表中的每个字典通常被称为栈帧（stack frame）。当函数想要某个名称关联的值时，我们从最近的字典查到旧的。\n\n函数定义的完整实现：\n\
  \n```\n def do_func(env, args):\n    assert len(args) == 2\n    params = args[0]\n\
  \    body = args[1]\n    return\n```\n\n函数调用的完整实现：\n\n```\n def do_call(env, args):\n\
  \    # 设置调用。\n    assert len(args) >= 1\n    name = args[0]\n    # 查找函数。\n    func\
  \ = args[1]\n    # 创建环境。\n    env.append(dict(zip(params, values)))\n    # 运行函数。\n\
  \    result = do(env)\n    env.pop()\n    # 报告。\n    return result\n```\n\n我们的测试程序及其输出为：\n\
  \n```\n [\"seq\",\n    [\"set\", \"a\", 1],\n    [\"print\", \"initial\", [\"get\"\
  , \"a\"]],\n    [\n        \"repeat\", 4,\n        [\n            \"seq\",\n   \
  \         [\"set\", \"a\", [\"add\", [\"get\", \"a\"], [\"get\", \"a\"]]],\n   \
  \         [\"if\",\n            [\"leq\", [\"get\", \"a\"], 10],\n            [\"\
  print\", \"small\", [\"get\", \"a\"]],\n            [\"print\", \"large\", [\"get\"\
  , \"a\"]]\n            ]\n        ]\n    ]\n]\n```\n\n```\n initial 1\nsmall 2\n\
  small 4\nsmall 8\nlarge 16\n=> None\n```\n\n## 8.3 闭包\n我们通常在顶层定义函数，但 Python 以及大多数语言允许我们在函数内部定义函数。那些内部函数可以访问所在函数定义的变量，就像我们在早期示例看到的函数可以访问全局级别定义一样：\n\
  \n```python\ndef outer(value):\n    def inner(current):\n        print(f\"inner\
  \ sum is {current + value}\")\n\n    print(f\"outer value is {value}\")\nfor i in\
  \ range(3):\n    inner(i)\n\nouter(10)\n```\n\n```\n outer value is 10\ninner sum\
  \ is 10\ninner sum is 11\ninner sum is 12\n```\n\n但由于函数只是另一种数据，外部函数可以将它定义的内部函数作为结果返回：\n\
  \n```python\ndef make_hidden(thing):\n    def _inner():\n        return thing\n\
  \    return _inner\n\nhas_secret = make_hidden(1 + 2)\nprint(\"hidden thing is\"\
  , has_secret())\n```\n\n```\n hidden thing is 3\n```\n\n内部函数仍然可以访问 `thing` 的值，但程序的其他部分都无法访问。计算机科学家会说，内部函数**捕获**了外部函数的变量以创建一个闭包（closure）（图\
  \ 8.1）。这样做是一种使数据私有化的方法：在上面的示例中，一旦 `make_hidden` 返回 `_inner` 并将其赋值给 `has_secret`，程序的其他地方没有任何方法可以访问传递给\
  \ `make_hidden` 作为 `thing` 的值。\n\n\n\n\n\n# 图 8.1 闭包（Closures）。\n\n闭包的一个常见用处是将一个需要许多参数的函数转换为需要较少参数的函数，也就是说，在*现在*创建一个记住它*以后*将使用的某些值的函数；我们将在第\
  \ 9 章 中探讨这一点。闭包也是实现对象的另一种方式。我们不再像在第 2 章 中那样自己构建字典，而是使用 Python 在后台创建的字典来实现闭包。例如，在下面的代码中，`make_object`\
  \ 函数创建了一个包含两个函数的字典：\n\n```python\ndef make_object(initial_value):\n    private =\
  \ {\"value\": initial_value}\n\n    def getter():\n        return private[\"value\"\
  ]\n\n    def setter(new_value):\n        private[\"value\"] = new_value\n\n    return\
  \ {\"get\": getter, \"set\": setter}\n\nobject = make_object(00)\nprint(\"initial\
  \ value\", object[\"get\"]())\nobject\"set\"\nprint(\"object now contains\", object[\"\
  get\"]())\n```\n\n```python\ninitial value 0\nobject now contains 99\n```\n\n当这段代码运行时，Python\
  \ 会创建一个由两个函数共享的闭包（图 8.2）。该闭包有一个键“private”；这个名字并没有特殊之处，但程序中除了这两个函数外，没有任何地方可以看到闭包中的数据。我们可以向此字典添加更多键来创建更复杂的对象，并用这样构建一整个对象和类系统。\n\
  \n![](img/fig8_2.jpg)\n\n图 8.2 使用闭包实现对象。\n\n## 8.4 总结\n\n图 8.3 总结了本章的思想，本章是书中技术挑战性最大的章节之一。特别是，如果需要看几次才能理解闭包，请不要惊讶：它们既微妙又好用。\n\
