  \ 嵌套列表\n\n编写一个函数，接受一个表示包含数字嵌套列表的字符串并返回实际列表。例如，输入 `[1, [2, [3, 4], 5]]` 应该产生相应的 Python\
  \ 列表。\n\n### 简单算术\n\n编写一个函数，接受由数字和基本算术运算符 `+`、`-`、`*` 和 `/` 组成的字符串，并产生一个显示操作顺序正确的嵌套结构。例如，`1\
  \ + 2 * 3` 应该产生 `[\"+\", 1, [\"*\", 2, 3]]`。\n\n# 6 运行测试\n\n并不是所有软件都需要严格测试：例如，通过在我们添加每个阶段时查看其输出来检查一次性的数据分析脚本是可以的。但我们都应该感激\
  \ `SQLite`¹ 数据库中 98% 的代码是为了让另外 2% 的代码始终执行正确的操作。\n\n书中的示例处于这两个极端情况之间。它们总长度超过 7000\
  \ 行；为了确保它们运行无误，我们使用 `pytest`² 编写了数百个`unit tests`。我们使用这个框架是因为它让测试更容易编写，而且它以一种可靠、可重复的方式运行测试\
  \ [Meszaros2007; Aniche2022]。理解此类工具的工作原理将帮助你更有效地使用它们，并将强化本书的核心思想之一：程序只是另一种数据。\n\n\
  ## 6.1 存储和运行测试\n\n正如我们在第 2 章中提到的，函数只是一个我们可以赋值给变量的对象。我们也可以像存储数字或字符串一样将它们存储在列表中(图\
  \ 6.1)：\n\n![](img/fig6_1.jpg)\n\n图 6.1: 函数列表。\n\n```python\n def first():\n   \
  \ print(\"First\")\n\ndef second():\n    print(\"Second\")\n\ndef third():\n   \
  \ print(\"Third\")\n\neverything = [first, second, third]\nfor func in everything:\n\
  \    func()\n```\n\n```\nFirst\nSecond\nThird\n```\n\n然而，为了让这个技巧生效，我们必须能够相同的方式调用函数，这意味着它们具有相同的签名：\n\
  \n```python\n def zero():\n    print(\"zero\")\n\ndef one(value):\n    print(\"\
  one\", value)\n\nfor func in [zero, one]:\n    func()\n```\n\n```\nzero\nTraceback\
  \ (most recent call last):\n  File \"/sdx/test/signature.py\", line 8, in <module>\n\
  \    func()\nTypeError: one() missing 1 required argument: 'value'\n```\n\n现在假设我们有一个想要测试的函数：\n\
  \n```python\n def sign(value):\n    if value < 0:\n        return -1\n    else:\n\
  \        return 1\n```\n\n以及一些测试它的函数（其中两个包含错误）：\n\n```python\n def test_sign_negative():\n\
