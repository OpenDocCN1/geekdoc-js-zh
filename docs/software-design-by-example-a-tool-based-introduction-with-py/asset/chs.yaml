  \ None)\n```\n\n## 18.2 存储记录\n\n构建可用数据库的下一步是让它存储记录，而不仅仅是引用用户的对象。由于我们不希望数据库绑定到任何类型的记录，记录必须知道如何自己打包和解包。我们本可以使用第\
  \ 17 章的技术，但为了让我们的输出更易读，我们将使用空字节作为分隔符来打包记录：\n\n```python\n@staticmethod\ndef pack(record):\n\
  \    assert isinstance(record, Experiment)\n    readings = \"\\0\".join(str(r) for\
  \ r in self._readings)\n    result = f\"{record._name}\\0{record._timestamp}\\0{readings}\"\
  \n    if len(result) < RECORD_LEN:\n        result += \"\\0\" * (RECORD_LEN - len(result))\n\
  \    return result\n```\n\n对应的解包方法是：\n\n```\nabcdef.12345.6\n```\n\n记录看起来如下（使用 `.`\
  \ 表示空字节）：\n\n```python\n@staticmethod\ndef unpack(raw):\n    assert isinstance(raw,\
  \ str)\n    parts = raw.split(\"\\0\")\n    name = parts[0]\n    timestamp = int(parts[1])\n\
  \    readings = [int(r) for r in parts[2:]]\n    return Experiment(name, timestamp,\
  \ readings)\n```\n\n为了完成，我们通过连接和拆分单个记录来同时打包多个记录：\n\n```python\n@staticmethod\ndef\
  \ pack_multi(records):\n    return ''.join([Experiment.pack(r) for r in records])\n\
  \n@staticmethod\ndef unpack_multi(raw):\n    size = Experiment.size()\n    split\
  \ = [raw[i:i + size] for i in range(0, len(raw), size)]\n    return [Experiment.unpack(s)\
  \ for s in split]\n```\n\n并给我们的记录类一个计算单个记录大小的静态方法：\n\n```python\nclass Experiment(BasicRec):\n\
  \    @staticmethod\n    def size():\n        return RECORD_LEN\n```\n\n## 18.3 持久化的数据库\n\
  \n我们现在可以扩展字典实现，将记录写入文件并在需要时加载：\n\n```python\nclass FileBacked(Database):\n    def\
  \ __init__(self, record_cls, filename):\n        super().__init__(record_cls)\n\
  \        self._filename = Path(filename)\n        if not self._filename.exists():\n\
  \            self._filename.touch()\n        self._load()\n\n    def add(self, record):\n\
  \        key = self._record_cls.key(record)\n        self._data[key] = record\n\
  \        self._save()\n\n    def get(self, key):\n        return self._data[key]\n\
  ```\n\n这种实现将所有内容存储在单个文件中，该文件名必须提供给数据库的构造函数（图 18.2）。如果数据库对象创建时该文件不存在，我们使用 `Path.touch`\
  \ 创建一个空文件；无论如何，我们随后将整个数据库加载到内存中。当我们添加记录时，将其保存到字典并调用辅助方法 `_save` 将整个数据库写回文件。当我们获取记录时，直接从内存字典中获取。\n\
  \n为了让这些工作，我们需要的两个辅助方法是：\n\n\n\n\n```python\n def _save(self):\n    packed = self._record_cls.pack_multi(self._data.values())\n\
  \    with open(self._filename, \"w\") as writer:\n        writer.write(packed)\n\
  \ndef _load(self):\n    assert self._filename.exists()\n    with open(self._filename,\
  \ \"r\") as reader:\n        raw = reader.read()\n    records = self._record_cls.unpack_multi(raw)\n\
  \    self._data = {self._record_cls.key(r): r for r in records}\n```\n\n这种方法并不高效——我们在第一次想要获取单个记录时就要加载整个数据库，并且在每次添加记录时都要保存整个数据库——但我们正在接近一个可能实际使用的方案。\n\
  \n## 18.4 玩转块（Playing with Blocks）\n\n我们如何让这种基于文件的实现更高效呢？一种方案是将每个记录保存在它自己的文件中，就像我们在第\
  \ 10 章中保存文件的每个版本一样。然而，这种策略带来的性能提升可能没有我们预期的那么大。原因是计算机执行文件 I/O 时使用的是`pages`（页），其大小通常为\
  \ 2 或 4 千字节。即使我们只想读取一个字节，操作系统总是读取一整页，然后只返回我们请求的那个字节。\n\n更高效的策略是将记录分组在`blocks of\
  \ memory`（内存块）中，每个块的大小与页相同，并在内存中创建一个索引，用来告诉我们哪些记录位于哪些块中。当我们添加记录时，只将其所在的块写入磁盘；同样，当我们需要一个某个块不在内存中的记录时，我们只读取该块。\n\
  \n此时，我们需要处理一个本该早些解决的问题。我们如何处理记录的更新？例如，假设我们已经有一个 ID 为 12345 的记录；当我们收到另一个具有相同 ID 的记录时，该怎么办？如果我们将整个数据库存储在一个字典中，字典会帮我们处理好，但如果我们把内容存储在块中，我们会有多个字典。\n\
  \n这就是我们设计中“日志结构”部分的用武之场。每当我们向数据库添加记录时，我们就将其追加到当前块中，或者如果当前块满了就开始一个新块（图 18.3）。我们在添加每个记录时都会为其分配一个序列号（sequence\
  \ number），我们的全局索引跟踪从记录 ID 到序列 ID 的映射。由于我们知道一个块中有多少条记录，可以快速计算出哪个块包含特定序列 ID 的记录。\n\
  \n![](img/fig18_3.jpg)\n\n图 18.3： 将记录映射到块。\n\n让我们为每个块使用一个字典，创建一个新的内存数据库。构造函数创建了\
  \ `self._next` 来存储下一个记录的序列 ID，创建了 `self._index` 来将记录 ID 映射到序列 ID，以及一个列表 `self._blocks`\
  \ 来存储块：\n\n```python\n class Blocked(Database):\n    RECORDS_PER_BLOCK = 2\n\n \
  \   @staticmethod\n    def size():\n        return Blocked.RECORDS_PER_BLOCK\n\n\
  \    def __init__(self, record_cls):\n        super().__init__(record_cls)\n   \
  \     self._next = 0\n        self._index = {}\n        self._blocks = []\n\n  \
  \  def num_blocks(self):\n        return len(self._blocks)\n\n    def num_records(self):\n\
  \        return len(self._index)\n```\n\n为了添加记录，我们：\n\n1. 获取该记录的序列 ID；\n2. 在索引中存储键到序列的映射；\n\
  3. 找到或创建适当的块；以及\n4. 添加记录。\n\n```python\n def add(self, record):\n    key = self._record_cls.key(record)\n\
  \    seq_id = self._next_seq_id()\n    self._index[key] = seq_id\n    block_id =\
  \ self._get_block_id(seq_id)\n    block = self._get_block(block_id)\n    block[seq_id]\
  \ = record\n```\n\n根据记录 ID 获取记录时，我们首先检查是否拥有该记录。如果存在，我们：\n\n1. 找到它当前的序列 ID；\n2. 找到对应的块；以及\n\
  3. 获取记录。\n\n```python\n def get(self, key):\n    if key not in self._index:\n  \
  \      return None\n    seq_id = self._index[key]\n    block_id = self._get_block_id(seq_id)\n\
  \    block = self._get_block(block_id)\n    return block[seq_id]\n```\n\n三个辅助方法\
  \ `add` 和 `get` 依赖于：\n\n```python\n def _next_seq_id(self):\n    seq_id = self._next\n\
  \    self._next += 1\n    return seq_id\n\ndef _get_block_id(self, seq_id):\n  \
  \  return seq_id // Blocked.RECORDS_PER_BLOCK\n\ndef _get_block(self, block_id):\n\
  \    while block_id >= len(self._blocks):\n        self._blocks.append({})\n   \
  \ return self._blocks[block_id]\n```\n\n## 18.5 持久化块（Persisting Blocks）\n\n现在我们有了这两个部分的可运行原型。我们现在有了两个部分的原型：将块保存到文件以及加载块。为了合并它们，我们需要继承\
  \ `Blocked` 并扩展它：\n\n```python\nclass BlockedFile(Blocked):\n    def __init__(self,\
  \ record_cls, db_dir):\n        super().__init__(record_cls)\n        self.db_dir\
  \ = Path(db_dir)\n\n    def add(self, record):\n        super().add(record)\n  \
  \      self._build_index()\n\n    def get(self, key):\n        if key not in self._index:\n\
  \            return None\n        return super().get(key)\n```\n\n加载块涉及到几乎相同的步骤，但我们将其分为两个部分：\n\
  \n```python\n def _save(self, record):\n    key = self._record_cls.key(record)\n\
  \    seq_id = self._next_seq_id()\n    self._index[key] = seq_id\n    block_id =\
  \ self._get_block_id(seq_id)\n    block = self._get_block(block_id)\n    packed\
  \ = self._record_cls.pack_multi(block.values())\n\n    filename = self._filename(block_id)\n\
  \    with open(filename, \"w\") as writer:\n        writer.write(''.join(packed))\n\
  ```\n\n保存一个块主要是记录工作。给定一个记录，我们确定它属于哪个块，并将其保存到文件：\n\n```python\n def _load_block(self,\
  \ block_id):\n    filename = self._filename(block_id)\n    with open(filename, \"\
  r\") as reader:\n        raw = reader.read()\n\n    records = self._record_cls.unpack_multi(raw)\n\
  \    base = self.size() * block_id\n    block = self._get_block(block_id)\n    for\
  \ i, r in enumerate(records):\n        block[base + i] = r\n```\n\n我们将加载单个块的代码放在自己的方法中，因为我们在重启数据库时需要初始化索引：\n\
  \n```python\n def _build_index(self):\n    seq_id = 0\n    for (block_id, filename)\
  \ in enumerate(\n        sorted(self.db_dir.iterdir())\n    ):\n        self._load_block(block_id,\
  \ filename)\n        for record in self._get_block(block_id).values():\n       \
  \     key = self._record_cls.key(record)\n            self._index[key] = seq_id\n\
  \            seq_id += 1\n```\n\n我们对设计的一个明显扩展是每次添加或修改记录时都将索引保存在单独的文件。然而，在投入生产环境之前，我们应该对此更改进行性能分析，看看它是否真的提高了性能（第\
  \ 15 章），因为多次小写入的成本可能高于一次多文件读取。我们还需要做一些措施来避免竞态条件；正如第 10 章所示，操作两个文件（一个索引，一个块）可能会导致有害的不一致性。\n\
  \n## 18.6 清理（Cleaning Up）\n\n我们实现的最后一步是清理不再需要的块，因为我们有了它们包含的每个记录的更新版本。通过这种方式回收未使用空间是另一种形式的**垃圾回收**。Python\
  \ 和其他大多数现代语言会自动这样做以回收未使用内存，但我们需要负责为数据库创建的文件进行清理。\n\n清理步骤是：\n\n1. 为每个记录计算一个新的序列 ID。\n\
  2. 找出哪些块包含我们需要保留的记录。\n3. 为这些块生成新的块 ID，同时创建一个可以删除的块 ID 集合，因为它们的所有记录都过了。\n\n\n\n\n\
  \n## 4. 删除并重命名块。\n\n## 5. 生成新的内存中索引。\n\n这些步骤的实现主要是账记工作的问题：\n\n```python\n def _cleanup(self):\n\
  \    new_seq = {\n        o: i for i, o in enumerate(self._index.values())\n   \
  \ }\n    keep = {self._get_block_id(o) for o in new_seq}\n\n    renaming = {o: i\
  \ for i, o in enumerate(list(sorted(keep)))}\n    garbage_ids = {\n        i for\
  \ i in range(len(self._blocks))\n        if i not in renaming\n    }\n\n    self._delete_blocks(garbage_ids)\n\
  \    self._rename_blocks(renaming)\n\n    new_index = {\n        k: new_seq[self._index[k]]\
  \ for k in self._index\n    }\n    self._index = new_index\n    self._next = len(self._index)\n\
  ```\n\n该方法并没有对存储进行**压缩**，也就是说它不会通过移动记录来消除记录内部过时的块。生产级数据库会定期执行此操作，以便更有效地利用磁盘；我们将在练习中探索这一想法。\n\
  \n## 18.7 总结\n\n图 18.4 总结了本章介绍的关键思想。大多数真实数据库使用与我们不同的数据结构，但必须面对同样的挑战：在不丢失数据或不允许数据变得不一致的情况下，提高数据访问速度。\n\
  \n![](img/fig18_4.jpg)\n\n图 18.4： 日志结构数据库的概念图。\n\n## 18.8 练习\n\n### 打包空字节\n\n修改实验性记录类，使记录以字符串形式打包，但能够安全地包含空字节。\n\
  \n### 二进制中的打包\n\n1. 修改实验性记录类，使其自身打包在固定大小的二进制记录中。\n2. 这如何改变 `database` 类中的文件 I/O\
  \ 操作？\n3. 这些操作是否应该移动到 `record` 类中？\n\n### 实现压缩\n\n在 `database` 中添加一个静态方法来压缩块，即重写所有块，使得只存储活跃记录（live\
  \ records）。\n\n### 独立保存索引\n\n1. 修改 `database`，将整个索引保存在单个文件中。\n2. 设计并运行一个实验，以确定此更改是否改进了性能。\n\
  \n# 19 构建管理器\n\n假设 `plot.py` 根据 `collated.csv` 生成 `result.svg`，`collated.csv` 由\
  \ `analyze.py` 从 `samples.csv` 和 `controls.csv` 产生，而 `samples.csv` 依赖于 `normalize.py`\
  \ 和 `raw.csv`。如果 `raw.csv` 变化，我们想要重新运行三个程序；如果 `controls.csv` 变化，我们只需要重新运行分析和绘图。如果我们尝试手动管理这些，不可避免会出错。相反，我们应该使用构建管理器来跟踪哪些文件依赖于哪些文件，以及为了创建或更新文件需要哪些操作。本章展示了简单的构建管理器是如何工作的；在此过程中，它介绍了一些处理图的算法。\n\
  \n## 19.1 概念\n\n第一个构建管理器 `Make` 是由贝尔实验室 70 年代的一名实习生编写的。还有许多其他的（如 `Cons` 和 `Snakake`），但它们执行的是相同的基本操作。如果一个目标（target）相对于其任何依赖项（dependencies）是过时的（stale），构建管理器就会运行一个配方（recipe）来刷新它。\n\
  \n构建管理器按照尊重依赖顺序运行配方，并且每个配方只运行一次（如果需要）。为了实现这一点，目标和依赖项必须形成一个有向无环图（directed acyclic\
  \ graph），即不存在从节点指向自身的链接循环（cycle）。构建管理器构造该图的拓扑排序（topological ordering），即按照每个节点在其依赖项之后的顺序排列，并以此顺序构建所需内容（图\
  \ 19.1）。\n\n![](img/fig19_1.jpg)\n\n图 19.1： 依赖关系与拓扑排序。\n\n## 19.2 初始设计\n\n我们的第一步是决定如何表示构建规则（build\
  \ rules）。我们可以发明一种特殊的语法来适应此问题，但正如第 5 章提到的，世界上的格式已经足够了。相反，我们将把配方表示为 JSON。例如，此文件描述了两个目标\
  \ `A` 和 `B`，并说明前者依赖后者：\n\n```json {\n  \"A\": {\"depends\": [\"B\"], \"rule\": \"\
  build A\"},\n  \"B\": {\"depends\": [], \"rule\": \"build B\"}\n}\n```\n\n与第 10\
  \ 章一样，我们将使用逐步细化的方法来创建第一个构建管理器。我们的 `BuildBase` 类接收一个配置文件作为参数，加载它，创建拓扑排序，然后刷新每个目标。目前，“刷新”意味着“打印更新规则”；我们稍后会回来使其复杂化。\n\
  \n```python\nclass BuildBase:\n    def build(self, config_file):\n        config\
  \ = self._configure(config_file)\n        ordered = self._topo_sort(config)\n  \
  \      for node in ordered:\n            self._refresh(config, node)\n\n    def\
  \ _refresh(self, config, node):\n        assert node in config, f\"Unknown node\
  \ {node}\"\n        print(config[node][\"rule\"])\n```\n\n加载配置文件，我们读取 JSON，构建目标集，然后使用辅助方法\
  \ `_check` 验证每个规则：\n\n```python\n def _configure(self, config_file):\n    with open(config_file,\
  \ \"r\") as reader:\n        config = json.load(reader)\n        known = set(config.keys())\n\
  \        return {\n            n: self._check(n, d)\n            for n, d in config.items()\n\
  \        }\n```\n\n检查规则，我们确保表示它的字典包含所需的键，并且它提到的每个依赖项都有规则。我们还对规则结构进行了一些转换，以便后续处理：\n\
  \n```python\n def _check(self, name, details, known):\n    assert \"rule\" in details,\
  \ f\"Missing rule for {name}\"\n    assert \"depends\" in details, f\"Missing depends\
  \ for {name}\"\n    depends = set(details[\"depends\"])\n    assert depends.issubset(known),\
  \ \\\n        f\"Unknown depends for {name}\"\n    return {\"rule\": details[\"\
  rule\"], \"depends\": depends}\n```\n\n![](img/fig19_2.jpg)\n\n图 19.2：表示图。\n\n##\
  \ 19.3 拓扑排序\n\n下一步是确定一个安全的构建顺序。图 19.3 展示了我们的算法是如何工作的：\n\n1. 我们找到依赖图中所有没有依赖项的节点。\n\
  2. 将这些节点添加到结果中，并从图中其他节点的依赖中移除它们。\n3. 如果图中仍有内容，则返回第一步。\n4. 如果在任何点图不为空但没有可用节点，我们发现了循环依赖（circular\
  \ dependency），因此报告问题并失败。\n\n```python\n def _topo_sort(self, config):\n    graph\
  \ = {n: config[\"depends\"] for n in config}\n    result = []\n    while graph:\n\
  \        available = {n for n in graph if not graph[n]}\n        assert available,\
  \ f\"Circular graph {graph.keys()}\"\n        result.extend(available)\n       \
  \ graph = {\n            n: graph[n] - available\n            for n in graph\n \
  \           if n not in available\n        }\n    return result\n```\n\n一切准备就绪后，我们可以运行第一个测试：\n\
  \n```\nbuild B\nbuild A\n```\n\n\n\n\n\n3. `assert` 并不是处理用户错误的友好方式；我们应该抛出 `ValueError`（或自定义的异常）来指示问题的出现。\n\
  \n4. 我们的拓扑排序不是**稳定**的（stable），也就是说，我们无法预测两个“相等”节点被添加到排序中的顺序。我们将在练习中探索其中的原因，但目前，我们应该在节点添加到结果列表时对节点名称进行排序，这样我们的测试就知道检查什么了。\n\
  \n5. 我们可能想向规则添加其他键，因此我们应该将该检查放在一个独立的方法中，以便我们可以对其进行重写。\n\n我们改进后的构建管理器顶层如下：\n\n```python\n\
  \ class BuildBetter:\n    def build(self, config):\n        config = self._configure(config)\n\
  \        ordered = self._topo_sort(config)\n        actions = []\n        for node\
  \ in ordered:\n            self._refresh(config, node, actions)\n      return actions\n\
  \n    def _refresh(self, config, node, actions):\n        assert node in config,\
  \ f\"Unknown node {node}\"\n        actions.append(config[node][\"rule\"])\n\n \
  \   def _must(self, condition, message):\n        if not condition:\n          \
  \  raise ValueError(message)\n```\n\n修改后的配置代码为：\n\n```python\n def _configure(self,\
  \ config):\n    known = set(config.keys())\n    return {n: self._check(n, d, known)\n\
  \            for n, d in config.items()}\n\ndef _check(self, name, details, known):\n\
  \    self._check_keys(name, details)\n    depends = set(details[\"depends\"])\n\
  \    self._must(\n        depends.issubset(known), f\"Unknown depends for {name}\"\
  \n    )\n    result = details.copy()\n    result[\"depends\"] = depends\n    return\
  \ result\n\ndef _check_keys(self, name, details):\n    self._must(\"rule\" in details,\
  \ f\"Missing rule for {name}\")\n    self._must(\"depends\" in details, f\"Missing\
  \ depends for {name}\")\n```\n\n更新后的拓扑方法为：\n\n```python\n def _topo_sort(self, config):\n\
  \    graph = {n: config[n][\"depends\"] for n in config}\n    result = []\n    while\
  \ graph:\n        available = {n for n in graph if not graph[n]}\n        self._must(\n\
  \            available,\n            f\"Circular graph {list(graph.keys())}\",\n\
  \        )\n        result.extend(sorted(available))\n        graph = {\n      \
  \      n: graph[n] - available\n            for n in graph\n            if n not\
  \ in available\n        }\n    return result\n```\n\n我们现在可以测试代码是否能检测依赖图中的循环引用：\n\
  \n```python\n def test_circular():\n    action_A = \"build A\"\n    action_B = \"\
  build B\"\n    config = {\n        \"A\": [\"B\"], \"rule\": action_A,\n       \
  \ \"B\": [\"A\"], \"rule\": action_B,\n    }\n    try:\n        Builder().build(config)\n\
  \        assert False, \"should had exception\"\n    except ValueError:\n      \
  \  pass\n```\n\n以及它是否能够构建它应该构建的内容：\n\n```python\n def test_no_dep():\n    action_A\
  \ = \"build A\"\n    action_B = \"build B\"\n    config = {\n        \"A\": [],\
  \ \"rule\": action_A,\n        \"B\": [], \"rule\": action_B,\n    }\n    assert\
  \ Builder().build(config) == [action_A, action_B]\n```\n\n我们还可以扩展它。例如，假设我们只想更新比其依赖项更旧的目标（毕竟，这构建管理器的全部意义）。如果目标是实际文件，我们可以检查它们的时间戳，但为了测试目的，我们希望在配置中指定伪时间：\n\
  \n```python\n def test_diamond_dep():\n    action_A = \"build A\"\n    action_B\
  \ = \"build B\"\n    action_C = \"build C\"\n    action_D = \"build D\"\n    config\
  \ = {\n        \"A\": [\"B\", \"C\"], \"rule\": action_A, \"time\": 0,\n       \
  \ \"B\": [\"D\"], \"rule\": action_B, \"time\": 0,\n        \"C\": [\"D\"], \"rule\"\
  : action_C, \"time\": 1,\n        \"D\": [], \"rule\": action_D, \"time\": 1,\n\
  \    }\n    assert Builder().build(config) == [action_B, action_A]\n```\n\n从我们目前编写的类开始，我们需要重写三个方法：\n\
  \n```python\nclass BuildTime(BuildBetter):\n    def _check_keys(self, name, details):\n\
  \        super()._check_keys(name, details)\n        self._must(\"time\" in details)\n\
  \n    def _refresh(self, config, node, actions):\n        assert node in config,\
  \ f\"Unknown node {node}\"\n        actions.append(config[node][\"rule\"])\n\n \
  \   def _needs_update(self, config):\n        return any(\n            config[d][\"\
  time\"] < config[node][\"time\"]\n            for d in config[node][\"depends\"\
  ]\n        )\n```\n\n## 19.5 总结\n\n`Figure 19.4` 总结了本章介绍的思想。\n\n## 19.6 练习\n\n###\
  \ 稳定排序\n最近版本的 Python 保证了它们被添加的顺序，解释为什么这使得测试变得困难。\n\n### 检查检查\n重写验证器以使用 `JSON`。\n\
  \n### 处理失败\n1. 修改构建管理器，使配置文件可以指定其规则是否失败。\n2. 修改它，使得规则失败时，仍然构建其他目标（但直接或间接依赖于失败目标的目标）。\n\
  3. 编写测试检查此更改是否有效。\n\n### 文件合并\n1. 修改本章构建的工具，使其从另一个文件导入定义和依赖。\n2. 如果多个文件指定了相同的规则，你的解决方案如何处理？\n\
  \n### 使用哈希\n1. 编写一个名为 `build_init.py` 的程序，计算每个文件的哈希，并与文件名一起存储在 `build_hash.json`\
  \ 中。\n2. 修改构建管理器，比较当前文件的哈希与 `build_hash.json` 中存储的哈希，以确定哪些过期，并在每次运行时更新 `build_hash.json`。\n\
  \n### 干运行\n构建的**干运行**会显示将执行的规则但不会实际执行它们。修改本章的构建系统，使其能够进行干运行。\n\n### 伪目标\n**伪目标**是不对应于文件的目标。开发者经常在构建文件中放置伪目标，以便方便地重新运行测试、检查代码风格等。修改本章的构建系统，允许用户将目标标记为伪目标。\n\
  \n\n\n\n\n大多数软件项目使用 `semantic versioning`（语义版本化）进行软件发布。每个版本由三个整数 X.Y.Z 组成，其中 X 是主版本，Y\
  \ 是次版本，Z 是 `patch`（补丁）。\n\n当包的更改破坏了 `backward compatibility`（后兼容性）时，包的作者会增加主版本号，即为旧版本构建的代码在新版本上运行失败或表现出不可预测的行为。当更改不会破坏任何现有代码时，增加次版本号；对于不添加任何新功能的\
  \ Bug 修复时，更改补丁号。\n\n指定版本范围的表示法看起来像算术运算：`>= =1.2.3` 表示“从 1.2.3 开始的任何版本”，`< 4` 表示“4.anything\
  \ 之前的任何版本”，而 `1.0-3.1` 表示“指定范围内的任何版本（包括补丁）”。注意，版本 2.1 大于版本 1.99：无论次版本号变得多大，它都不会溢出到主版本号。\n\
  \n比较简单的语义版本标识符并不困难，但处理整个标准几乎和正确处理日期和时间一样棘手。因此，我们的示例使用普通整数对版本计数；我们建议使用 `semantic-version`\
  \ 包来处理实际情况。\n\n## 20.2 穷举搜索\n\n为了避免在解析器上浪费时间，我们将可用包的清单存为 JSON：\n\n```json\n {\n\
  \    \"A\": {\n      \"3\":   {\"B\": [\"3\", \"2\"], \"C\": [\"2\"]},\n      \"\
  2\":   {\"B\": [\"2\"], \"C\": [\"2\", \"1\"]},\n      \"1\":   {\"B\": [\"1\"]}\n\
  \    },\n    \"B\": {\n      \"3\":   {\"C\": [\"2\"]},\n      \"2\":   {\"C\":\
  \ [\"1\"]},\n      \"1\":   {\"C\": [\"1\"]}\n    },\n    \"C\": {\n      \"2\"\
  :   [],\n      \"1\":   []\n    }\n}\n```\n\n主字典中的键标识包（为了简单起见，我们称它们 A、B 和 C）。每个包都有一个字典，其键是版本号，每个版本都有一个字典显示哪些包的哪些版本是依赖。这是一个复杂的数据结构，但所有细节都是必要的。\n\
  \n![](img/fig20_1.jpg)\n\n[图 20.1：版本依赖清单的结构。]\n\n假设我们需要每个包都是多维网格上的一个轴，因此网格上的每个点都是包版本的可能组合。我们可以使用对包版本的约束来排除网格的某些区域；剩余的点代表合法的组合。\n\
  \n![](img/fig20_2.jpg)\n\n[图 20.2：寻找包版本的允许组合。]\n\n检查所有这些可能性需要多少工作？我们的示例有 3 × 3 ×\
  \ 2 = 18 种组合。如果我们向其中再添加一个两个版本的包，`search space`（搜索空间）将翻倍；再添加一个，它会再次翻倍，这意味着如果每个包大约有\
  \ `c` 个版本且有 `N` 个包，工作量按 `O(c^(N))` 增长。这种指数行为被称为 `combinatorial explosion`（组合爆炸），使得即使对于小问题，暴力破解解也是不切行的。我们将实现它作为从起点（并为我们提供一个测试更复杂解决方案的基），但随后我们需要找到更高效的方法。\n\
  \n我们的暴力破解程序生成包版本的所有可能组合，然后消除与清单不兼容的组合。它的主体只是按顺序执行这些步骤，并带有几个打印语句显示结果：\n\n```python\n\
  \ def main():\n    manifest = json.load(sys.stdin)\n    possible = make_possibilities(manifest)\n\
  \    print(f\"{len(possible)} possibilities\")\n    allowed = [p for p in possible\
  \ if compatible(manifest, p)]\n    print(f\"{len(allowed)} allowed\")\n    for a\
  \ in allowed:\n        print(a)\n```\n\n为了生成可能性，我们创建每个包可用版本的列表，然后使用 Python 的 `itertools`\
  \ 模块生成包含所有项目可能组合的 `cross product`（笛积）：\n\n```python\n def make_possibilities(manifest):\n\
  \    available = []\n    for package, versions in manifest.items():\n      available.append([(package,\
  \ v) for v in versions])\n    return list(itertools.product(*available))\n```\n\n\
  ![](img/fig20_3.jpg)\n\n[图 20.3：生成项目所有可能的组合。]\n\n要检查候选项目是否符合清单，我们将每个条目 X 与每个条目 Y\
  \ 进行比较：\n\n1. 如果 `X` 和 `Y` 是同一个包，我们继续查找。我们需要这条规则是因为我们正在将每个条目与每个条目比较，这意味着我们正在将包版本与其自身比较。\n\
  2. 如果 `X` 的要求没有关于 `Y` 的说明，我们继续搜索。这条规则处理了 `X` 不关心 `Y` 的情况，但这也是我们需要比较所有内容的原因，因为 `Y`\
  \ 可能关心 `X`。\n3. 最后，如果 `X` 依赖 `Y`，但 `X` 的特定版本没有列出 `Y` 的特定版本，我们可以排除这种组合。\n4. 如果在所有这些检查之后还没有排除候选项目，我们就将其添加到允许列表中。\n\
  \n确实，这些规则在 18 种可能性中找到了 3 种有效组合：\n\n```python\n def compatible(manifest, combination):\n\
  \    for package_i, version_i in combination:\n        lookup_i = manifest[package_i][version_i]\n\
  \        for package_j, version_j in combination:\n            if package_i == package_j:\n\
  \                continue\n            if package_j not in lookup_i:\n         \
  \       continue\n            if version_j not in lookup_i[package_j]:\n       \
  \         return False\n    return True\n```\n\n```\n 18 possibilities\n3 allowed\n\
  (('A', '3'), ('B', '3'), ('C', '2'))\n(('A', '2'), ('B', '2'), ('C', '1'))\n(('A',\
  \ '1'), ('B', '1'), ('C', '1'))\n```\n\n## 20.3 手动生成可能性\n\n我们的暴力代码使用 `itertools.product`\
  \ 生成多个列表的所有可能组合。为了查看它是如何工作的，让我们重写 `make_possibilities` 使用我们自己的函数：\n\n```python\n\
  \ def make_possibilities(manifest):\n    available = []\n    for package, versions\
  \ in manifest.items():\n      available.append([(package, v) for v in versions])\n\
  \n    accum = []\n    _make_possible(available, [], accum)\n    return accum\n```\n\
  \n前半部分创建与之前相同的列表，每个子列表都是单个包的可用版本。然后它创建一个空的累加器来收集所有组合，并调用一个名为 `_make_possible` 的递归函数来填充它。\n\
  \n每次调用 `_make_possible` 处理一个包的工作。如果包是 `X`，函数遍历 `X` 的可用版本，将该版本添加到进行中的组合中，并带有剩余的版本列表自调用自身。如果没有更多列表可以遍历，递归调用已经包含了每个包的一个版本，因此组合被添加到累加器中。\n\
  \n```python\n def _make_possible(remaining, current, accum):\n    if not remaining:\n\
  \        accum.append(current)\n    else:\n      head, tail = remaining[0], remaining[1:]\n\
  \      for h in head:\n        _make_possible(tail, current + [h], accum)\n```\n\
  \n```\n 18 possibilities\n3 allowed\n(('A', '3'), ('B', '3'), ('C', '2'))\n(('A',\
  \ '2'), ('B', '2'), ('C', '1'))\n(('A', '1'), ('B', '1'), ('C', '1'))\n```\n\n![](img/fig20_4.jpg)\n\
  \n[图 20.4：递归生成项目所有可能的组合。]\n\n\n\n\n`make_possible` 使用递归而不是嵌套循环，因为我们不知道需要写多少层循环。如果我们知道清单（manifest）只包含三个包，我们将编写一个三层嵌套循环来生成组合；但如果有四个包，我们需要一个四层嵌套循环，依此类推。这种“递归枚举”（`Recursive\
  \ Enumeration`）设计模式每个循环使用一次递归函数调用，这样我们就能自动获得所需数量的循环。\n\n## 20.4 增量搜索\n\n生成指数级数量的组合然后丢弃其中大部分是低效的。相反，我们可以修改递归生成器，如果一个部分生成的包的组合不合法，则停止生成。将生成与检查相结合使得代码变得更加复杂，但正如我们将看到的，它确实带来了一些重大的改进。\n\
  \n我们修改后的程序的主函数与之前的版本相似。在加载清单后，我们生成了所有包名称的列表。与之前的代码不同，列表中的项不包含版本，因为我们将在处理过程中检查它们：\n\
  \n```python\n def main():\n    manifest = json.load(sys.stdin)\n    packages = list(manifest.keys())\n\
  \    if len(sys.argv) > 1:\n        packages.reverse()\n\n    accum = []\n    count\
  \ = find(manifest, packages, accum, [], 0)\n\n    print(f\"count {count}\")\n  \
  \  for a in accum:\n        print(a)\n```\n\n注意，如果用户提供了额外的命令行参数，我们在开始搜索之前会反转包列表。我们将利用此来观察顺序如何影响效率。\n\
  \n我们的 `find` 函数现在有五个参数：\n\n1. 清单，告诉我们哪些与哪些是兼容的。\n2. 我们尚未考虑的包的名称。\n3. 累加器，用于存储我们到为止找到的所有有效组合。\n\
  4. 我们下一步要扩展的半完成组合。\n5. 到目前为止考虑的组合计数，我们将其作为效率的衡量。\n\n```python\n def find(manifest,\
  \ remaining, accum, current, count):\n    count += 1\n    if not remaining:\n  \
  \      accum.append(current)\n    else:\n        head, tail = remaining[0], remaining[1:]\n\
  \        for version in manifest[head]:\n            candidate = current + [(head,\
  \ version)]\n            if compatible(manifest, candidate):\n                count\
  \ = find(\n                    manifest, tail, accum, candidate, count\n       \
  \         )\n    return count\n```\n\n该算法结合了我们已经编写的生成与检查：\n\n1. 如果没有剩余的包需要考虑——如果\
  \ `remaining` 是空列表——那么我们目前在 `current` 中构建的内容必须是有效的，因此我们将其添加到累加器中。\n2. 否则，我们将下一个要考虑的包放在\
  \ `head` 中，将所有剩余包放在 `tail` 中。然后我们依次检查 `head` 包的每个版本。如果将其添加到当前的包集合中不会引起问题，我们继续使用该版本进行搜索。\n\
  \n增量检查为我们节省了多少工作？使用之前相同的测试用例，我们只创建了 11 个候选对象而不是 18 个，因此我们将搜索减少了约三分之一：\n\n```bash\n\
  \ python incremental.py < triple.json\n count 11\n[('A', '3'), ('B', '3'), ('C',\
  \ '2')]\n[('A', '2'), ('B', '2'), ('C', '1')]\n[('A', '1'), ('B', '1'), ('C', '1')]\n\
  ```\n\n然而，如果我们反转搜索的顺序，生成的候选对象将只有之前的一半：\n\n```bash\n python incremental.py reversed\
  \ < triple.json\n count 9\n[('C', '2'), ('B', '3'), ('A', '3')]\n[('C', '2'), ('B',\
  \ '2'), ('A', '2')]\n[('C', '1'), ('B', '1'), ('A', '1')]\n```\n\n## 20.5 使用定理证明器\n\
  \n定理证明器（Theorem Prover）可以解决复杂的约束问题。使用 Z3 库，我们可以轻松地处理包之间的依赖关系。在我们的例子中，我们需要处理包 A、B、C\
  \ 之间的关系。\n\n```python\nfrom z3 import Bool, Or, And, Implies\n\nsolver = Solver()\n\
  \nA1 = Bool('A1')\nA2 = Bool('A2')\nA3 = Bool('A3')\nB1 = Bool('B1')\nB2 = Bool('B2')\n\
  B3 = Bool('B3')\nC1 = Bool('C1')\nC2 = Bool('C2')\nC3 = Bool('C3')\n```\n\n我们告诉求解器我们想要包\
  \ A 的一个版本：\n\n```python\nsolver.add(Or(A1, A2, A3))\n```\n\n并且包 A 的三个版本是互斥的：\n\n\
  ```python\nsolver.add(Implies(A1, Not(A2, A3)))\nsolver.add(Implies(A2, Not(A1,\
  \ A3)))\nsolver.add(Implies(A3, Not(A1, A2)))\n```\n\n我们需要包 B 和 C 的等价语句；我们将在练习中探索如何从清单生成这些。最后，我们添加包之间的依赖关系并搜索结果：\n\
  \n```python\nsolver.add(Implies(A3, And(Or(B3, B2), C2)))\nsolver.add(Implies(A2,\
  \ And(B2, Or(C2, C1))))\nsolver.add(Implies(A1, B1))\nsolver.add(Implies(B3, C2))\n\
  solver.add(Implies(B2, C1))\nsolver.add(Implies(B1, C1))\n\nprint(\"result\", solver.check(),\
  \ solver.model())\n```\n\n```text\nresult sat [B.3 = True, A.1 = False, C.2 = True,\
  \ C.1 = False, B.2 = False, A.3 = True, A.2 = False, B.1 = False]\n```\n\n输出告诉我们，`A.3`、`B.3`\
  \ 和 `C.2` 的组合将满足我们的约束。\n\n然而，我们之前看到我们的约束有三个解决方案。找到其他解决方案的方法是让求解器在排除初始解决方案后再次解决问题。我们可以多次重复此过程，每次向约束中添加“不是最新解决方案”，直到问题变得不可解决：\n\
  \n\n\n\n```\neverything = [A1, A2, A3, B1, B2, B3, C1, C2]\nwhile solver.check()\
  \ == sat:\n    model = solver.model()\n    print([var for var in model.decls() if\
  \ model[var]])\n    settings = [var == model[var] for var in everything]\n    cond\
  \ = Not(And(*settings))\n    solver.add(cond)\n```\n\n```\n[B.3, C.2, A.3]\n[C.1,\
  \ B.2, A.2]\n[A.1, C.1, B.1]\n```\n\n\n\n\n这段代码声明了一个套接字，监听直到接收到单个连接请求，读取最多 1 字节的数据，打印一条消息并回复客户端。图\
  \ 21.2 显示了当我们在单独的终端窗口中运行客户端和服务器时的操作顺序和消息。\n\n![](img/fig21_2.jpg)\n\n图 21.2: 客户端-服务器交互中的步骤和消息。\n\
  \n这里涉及的操作非常多，因此大多数在该层级进行编程的人都会使用 Python 的 `socketserver`¹ 模块，它提供了两个东西：一个名为 `TCPServer`\
  \ 的类，用于管理传入的连接；另一个名为 `BaseRequestHandler` 的类，负责处理处理传入数据以外的所有工作。为了实现这一点，我们从 `BaseRequestHandler`\
  \ 派生了自己的类，并提供了一个 `handle` 方法（图 21.3）。每当 `TCPServer` 收到新连接时，它都会创建我们类的一个对象，并调用该对象的\
  \ `handle` 方法。\n\n![](img/fig21_3.jpg)\n\n图 21.3: 基础 TCP 服务器中使用的类。\n\n使用 `TCPServer`\
  \ 和 `BaseRequestHandler` 作为起点，我们的服务器如下：\n\n```python\n import socketserver\n\nCHUNK_SIZE\
  \ = 1024\nSERVER_ADDRESS = (\"localhost\", 8080)\n\nclass MyHandler(socketserver.BaseRequestHandler):\n\
  \    def handle(self):\n        data = self.request.recv(CHUNK_SIZE)\n        cli\
  \ = self.client_address[0]\n        msg = f\"got request from {cli}: {len(data)}\"\
  \n        print(msg)\n        self.request.sendall(bytes(msg, \"utf-8\"))\n\nif\
  \ __name__ == \"__main__\":\n    server = socketserver.TCPServer(SERVER_ADDRESS,\
  \ MyHandler)\n    server.serve_forever()\n```\n\n这两个类使用的设计与我们之前看到的不同。`socketserver`\
  \ 模块并没有为程序员创建一个用于扩展的类，而是将低级细节放在了 `TCPServer` 中（它可以可以直接使用），并要求用户从 `BaseRequestHandler`\
  \ 创建一个插件类以供服务器使用。这种方法在本质上并不比我们之前看到的“派生并重写”方法更好或更差；它们只是软件设计师工具箱中的另外两个工具。\n\n---\n\
  \n## 21.2 分块处理 (Chunking)\n\n我们最近的服务器使用 `self.request.recv(CHUNK_SIZE)` 恰好读取一次数据，其中\
  \ `CHUNK_SIZE` 设置为 `1024`。如果客户端发送了超过 1 字节的数据，我们的服务器将忽略它。这可能导致**死锁**：服务器正尝试发送回复，而客户端正尝试发送消息的剩余部分，由于双方都没有监听，因此都无法进行。增加用于存储传入消息的内存缓冲区大小并不能解决这个问题：客户端（或恶意攻击者）始终可以发送比我们允许的更多的数据。\n\
  \n相反，我们需要修改服务器，使其持续读取数据，直到没有数据可读为止。下文所示的 `handle` 方法每循环一次，它都会尝试读取另一个 1 字节。如果收到了这么多数据，它将其追加到\
  \ `data` 中并再次尝试。如果收到的少于 1 字节，说明我们已到达传输结束，可以返回结果：\n\n```python\n class FileHandler(socketserver.BaseRequestHandler):\n\
  \    def handle(self):\n        print(\"server about to start receiving\")\n   \
  \     data = bytes()\n        while True:\n            latest = self.request.recv(CHUNK_SIZE)\n\
  \            print(f\"...server received {len(latest)} bytes\")\n            data\
  \ += latest\n            if len(latest) < CHUNK_SIZE:\n                print(f\"\
  ...server breaking\")\n                break\n        print(f\"server finished received,\
  \ about to reply\")\n        self.request.sendall(bytes(f\"{len(data)}\", \"utf-8\"\
  ))\n```\n\n我们也可以修改客户端分块发送数据，但我们的处理方式略有不同。函数中的每次调用 `conn.send` 都会尝试发送所有剩余数据。函数返回的值告诉我们实际发送了多少字节。如果该数字让我们达到了正在发送数据的末尾，函数就可以退出。否则，它会将发送的字节数加到\
  \ `total` 中，以便知道从哪里开始下一次循环：\n\n```python\n def send_file(conn, filename):\n    with\
  \ open(filename, \"rb\") as reader:\n        data = reader.read()\n    print(f\"\
  client sending {len(data)} bytes\")\n    total = 0\n    while total < len(data):\n\
  \        sent = conn.send(data[total:])\n        print(f\"...client sent {sent}\
  \ bytes\")\n        if sent == 0:\n            break\n        total += sent\n  \
  \      print(f\"...client total now {total} bytes\")\n    return total\n```\n\n\
  既然都在这里了，我们顺便写一个创建套接字的函数：\n\n```python\n def make_socket(host, port):\n    conn =\
  \ socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n    conn.connect((host, port))\n\
  \    return conn\n```\n\n另一个另一个等待服务器确认的函数：\n\n```python\n def receive_ack(conn):\n\
  \    received = conn.recv(CHUNK_SIZE)\n    return int(str(received, \"utf-8\"))\n\
  ```\n\n主程序如下：\n\n```python\n def main(host, port, filename):\n    conn = make_socket(host,\
  \ port)\n    bytes_sent = send_file(conn, filename)\n    print(f\"client sent {bytes_sent}\
  \ bytes\")\n    bytes_received = receive_ack(conn)\n    print(f\"client received\
  \ {bytes_received} bytes\")\n```\n\n当运行客户端和服务器时，客户端会输出：\n\n```\nclient sending 2048\
  \ bytes\n...client sent 1024 bytes\n...client total now 1024 bytes\n...client sent\
  \ 1024 bytes\n...client total now 2048 bytes\nclient sent 2048 bytes\n```\n\n而服务器端会输出：\n\
  \n```\nserver about to start receiving\n...server received 1024 bytes\n...server\
  \ received 1024 bytes\n...server breaking\nserver finished received, about to reply\n\
  client received 2048 bytes\n```\n\n---\n\n## 21.3 测试 (Testing)\n\n测试单进程命令行应用程序已经够困难了。为了测试上面的客户端-服务器应用程序，我们必须启动服务器，等待它就绪，然后运行客户端，然后让服务器自动关闭。交互式地这样做很容易，但自动化它很困难，因为没有方法可以指示等待多久，也没有简单的方法关闭服务器。\n\
  \n部分解决方案是使用模拟对象（第 9 章:\n    def handle(self):\n        self.debug(\"server about\
  \ to start receiving\")\n        data = bytes()\n        while True:\n         \
  \   latest = self.request.recv(CHUNK_SIZE)\n            self.debug(f\"...server\
  \ received {len(latest)} bytes\")\n            data += latest\n            if len(latest)\
  \ < CHUNK_SIZE:\n                self.debug(server breaking\")\n               \
  \ break\n        self.debug(\"server finished received, about to reply\")\n    \
  \    self.request.sendall(bytes(f\"{len(data)}\", \"utf-8\"))\n```\n\n`debug` 方法接收任意数量的参数并将其传递给\
  \ `print`：\n\n```python\ndef debug(self, *args):\n    print(*args)\n```\n\n该类中的\
  \ `handle` 方法依赖于框架创建 `self.request` 对象来发送和接收数据。我们可以通过从 `LoggingHandler` 派生类来创建一个可测试服务器，该类继承了我们要测试的\
  \ `handle` 方法，但创建一个模拟请求对象并重写 `debug` 方法以不再打印日志消息：\n\n```python\nclass MockHandler(LoggingHandler):\n\
  \    def __init__(self, message):\n        self.request = MockRequest(message)\n\
  \n    def debug(self, *args):\n        pass\n```\n\n注意，我们*没有*在 `MockHandler` 的构造函数中调用\
  \ `LoggingHandler` 的构造函数。如果我们这样做，就会触发对 `BaseRequestHandler` 构造函数的调用，它会因为我们没有定义主机或端口而感到不满。\n\
  \n用于创建模拟请求对象的类需要三个东西：\n\n```python\nclass MockRequest:\n    def __init__(self, message):\n\
  \        self.message = message\n        self.index = 0\n\n    def recv(self, buf):\n\
  \        chunk = self.message[self.index:self.index + buf]\n        self.index +=\
  \ len(chunk)\n        return chunk\n\n    def send(self, data):\n        pass\n\
  ```\n\n现在我们可以编写测试代码：\n\n```python\ndef test_handler():\n    message = b\"hello world\"\
  \n    handler = MockHandler(message)\n    handler.handle()\n```\n\n运行 `test_handler()`\
  \ 将产生输出：\n\n```\nserver about to start receiving\n...server received 11 bytes\n\
  ...server breaking\nserver finished received, about to reply\n```\n\n\n\n1.  一个构造函数，用于记录我们伪装从\
  \ socket 接收到的数据，并完成其他所需的设置。\n2.  一个 `recv` 方法，其签名与真实对象的 `recv` 方法相同。\n3.  一个 `sendall`\
  \ 方法，其签名也与真实对象匹配。\n\n整个类如下：\n\n```python\n class MockRequest:\n    def __init__(self,\
  \ message):\n        self._message = message\n        self._position = 0\n     \
  \   self._sent = []\n\n    def recv(self, max_bytes):\n        assert self._position\
  \ <= len(self._message)\n        top = min(len(self._message), self._position +\
  \ BLOCK_SIZE)\n        result = self._message[self._position:top]\n        self._position\
  \ = top\n        return result\n\n    def sendall(self, outgoing):\n        self._sent.append(outgoing)\n\
  ```\n\n有了它，我们现在可以编写这样的单元测试了：\n\n```python\n def test_short():\n    msg = bytes(\"\
  message\", \"utf-8\")\n    handler = MockHandler(msg)\n    handler.handle()\n  \
  \  assert handler.request._sent == [bytes(f\"{len(msg)}\", \"utf-8\")]\n```\n\n\
  我们方法的关键是**保真度**（fidelity）的概念：我们测试的内容与生产环境中使用的有多接近？在理想世界中，它们是完全相同的，但在这种情况下，为了测试性牺牲一点保真度是有意义的。\n\
  \n## 21.4 总结\n\n图 21.4 总结了本章介绍的思想。虽然理解如何在网络上发送数据很重要，但知道如何测试与外部世界交互的程序同样重要。\n\n![](img/fig21_4.jpg)\n\
  \n图 21.4: 文件传输概念图。\n\n## 21.5 练习\n\n### 分块大小\n\n如果客户端尝试向服务器发送 0 字节会发生什么？如果它发送恰好\
  \ `CHUNK_SIZE` 字节或 `CHUNK_SIZE+1` 字节会发生什么？\n\n### 效率\n\n假设客户端向服务器发送 `N` 个数据块。目前的实现会将第一个块复制\
  \ `N-1` 次，第二个块复制 `N-2` 次，依此类推，因此总拷贝工作量为 `O(N²)`。修改服务器，使其将数据块收集在列表中，并在最后进行拼接代替。\n\
  \n### 保存和列出文件\n\n1.  修改本章客户端和服务器使用的协议，让客户端发送文件名、一个换行符，然后是文件内容，让服务器以该名称保存文件。\n2.\
  \  再次修改协议，让客户端可以发送单词 `dir` 后跟一个换行符且不包含其他数据，让服务器返回其当前工作目录下的文件列表。\n\n### Socket 客户端类\n\
  \n构建一个 `socketclient` 类，它的工作方式类似于 `socketserver` 类，但发送数据而不是处理请求。它在实践中有多用？\n\n# 22\
  \ 提供网页服务\n\n从一台机器复制文件到另一台机器是有用的（第 21 章），但我们想做更多。我们*不想*为每个应用程序创建一个新协议，就像我们不会创建新的文件格式一样（第\
  \ 5 章）。\n\n**超文本传输协议**（HTTP）定义了程序在网络上交换数据的方法。它是刻意简单的：客户端通过 socket 发送一个指定其想要内容的**请求**（request），服务器发送一个包含某些数据的**响应**（response）。服务器可以按任意方式构造响应：它们可以从磁盘复制文件、动态生成\
  \ HTML，或者程序员能想到的任何操作。\n\n本章展示了如何构建一个理解 HTTP 基础的简单 Web 服务器，以及如何测试这类程序。我们将构建的比 Apache¹、`nginx`²\
  \ 或工业级服务器要简单得多，但所有的核心思想都会在那里。\n\n## 22.1 协议\n\nHTTP 请求只是文本：任何想要程序都可以创建或解析它。一个绝对极简的\
  \ HTTP 请求在单行内包含一个**方法**的名称、一个**URL** 和**协议版本**，并用空格分隔：\n\n```\n GET /index.html\
  \ HTTP/1.1\n```\n\nHTTP 方法几乎总是 `GET`（获取信息）或 `POST`（提交表单数据或上传文件）。`URL` 指定了客户端想要的内容。\n\
  \n\n\n```python\n from http.server import BaseHTTPRequestHandler, HTTPServer\n\n\
  PAGE = \"\"\"<html><body><p>test page</p></body></html>\"\"\"\n\nclass RequestHandler(BaseHTTPRequestHandler):\n\
  \    def do_GET(self):\n        content = bytes(PAGE, \"utf-8\")\n        self.send_response(200)\n\
  \        self.send_header(\n            \"Content-Type\", \"text/html; charset=utf-8\"\
  \n        )\n        self.send_header(\"Content-Length\", str(len(content)))\n \
  \       self.end_headers()\n        self.wfile.write(content)\n\nif __name__ ==\
  \ \"__main__\":\n    server_address = (\"localhost\", 8080)\n    server = HTTPServer(server_address,\
  \ RequestHandler)\n    server.serve_forever()\n```\n\n让我们从底部开始，向上看。\n\n1. `server_address`\
  \ 指定了服务器的主机名和端口。\n\n2. `HTTPServer` 类负责解析请求和发送响应。当我们构建它时，我们为它提供了服务器地址以及我们编写的按我们需要的方式请求的类名——在这种情况下，是\
  \ `RequestHandler`。\n\n3. 最后，我们调用服务器的 `serve_forever` 方法，它会一直运行直到崩溃或我们用 Ctrl-C 停止它。\n\
  \n那么 `RequestHandler` 是做什么的呢？\n\n1. 当服务器接收到 GET 请求时，它会在请求处理器中查找名为 `do_GET` 的方法。（如果收到\
  \ POST 请求，它会查找 `do_POST`，依此类推。）\n\n2. `do_GET` 将我们想要返回的页面文本从字符转换为字节——我们将在下文中讨论这一点。\n\
  \n3. 接着，它发送一个响应码（200）、几个告知内容类型和接收者应该期望的字节数的头部，以及一个空行（由 `end_headers` 方法产生）。\n\n\
  4. 最后，`do_GET` 通过调用 `self.wfile.write` 发送响应内容。`self.wfile` 看起来和作用都像一个只写文件，但实际上是将字节发送到套接字连接。\n\
  \n如果我们从命令行运行此程序，它不会显示任何内容：\n\n```bash\n python basic_http_server.py\n```\n\n但如果我们随后用浏览器访问\
  \ [`localhost:8080`](http://localhost:8080)，我们就会看到：\n\n```\n Hello, web!\n```\n\n\
  并且在 shell 中看到：\n\n```\n 127.0.0.1 - - [16/Sep/2022 06:34:59] \"GET / HTTP/1.1\"\
  \ 200 -\n127.0.0.1 - - [16/Sep/2022 06:35:00] \"GET /favicon.ico HTTP/1.1\" 200\
  \ -\n```\n\n第一行很直了当：由于我们没有请求特定的文件，我们的浏览器请求了 `/`（服务器提供的任何根目录）。第二行的出现是因为我们的浏览器会自动发送对名为\
  \ `/favicon.ico` 的图像文件的第二个请求，如果它存在，将将其作为图标显示在地址栏中。\n\n## 22.3 提供文件\n\n为每个请求提供相同的页面并没有特别有用，所以让我们重写简单的服务器来返回文件。基本逻辑如下：\n\
  \n```python\n class RequestHandler(BaseHTTPRequestHandler):\n    def do_GET(self):\n\
  \        try:\n            url_path = self.path.lstrip(\"/\")\n            full_path\
  \ = Path.cwd().joinpath(url_path)\n            if not full_path.exists():\n    \
  \            raise ServerException(f\"{self.path} not found\")\n            elif\
  \ full_path.is_file():\n                self.handle_file(self.path, full_path)\n\
  \            else:\n                raise ServerException(f\"{self.path} unknown\"\
  )\n        except Exception as msg:\n            self.handle_error(msg)\n```\n\n\
  我们首先通过删除开头的 `/` 将 URL 中的路径转换为本地文件路径。这种文件名转换的方式被称为**路径解析**（path resolution），在此过程中，我们假设所有应该提供的文件都存在于服务器运行目录或其子目录下。如果解析后的路径对应于文件，我们就将其返回给客户端；否则，我们就生成并发送错误消息。\n\
  \n使用 if/else 代替 try/except 来重写 `do_GET` 看起来可能更简单，但后者有一个优势：我们可以在同一个地方、以相同的方式处理调用的方法（如\
  \ `handle_file`）内部发生的错误。\n\n```python\ndef handle_file(self, path, full_path):\n\
  \    try:\n        with open(full_path, 'rb') as reader:\n            content =\
  \ reader.read()\n        self.send_content(content, HTTPStatus.OK)\n    except IOError:\n\
  \        self.handle_error(f\"Cannot read {path}\")\n\ndef handle_error(self, msg):\n\
  \    ERROR_PAGE = \"\"\"<html><body><head><title>Error accessing {path}</title></head><body><h1>Error\
  \ {msg}</h1></body></html>\"\"\"\n    content = bytes(ERROR_PAGE.format(path=self.path,\
  \ msg=msg), \"utf-8\")\n    self.send_content(content, HTTPStatus.NOT_FOUND)\n\n\
  def send_content(self, content, status):\n    self.send_response(int(status))\n\
  \    self.send_header(\"Content-Type\", \"text/html; charset=utf-8\")\n    self.send_header(\"\
  Content-Length\", str(len(content)))\n    self.end_headers()\n    self.wfile.write(content)\n\
  ```\n\n我们首先通过删除开头的 `/` 将 URL 中的路径转换为本地文件路径。这种文件名转换的方式被称为**路径解析**，在此过程中，我们假设所有应该提供的文件都存在于服务器运行目录或其子目录下。如果解析后的路径对应于文件，我们就将其返回给客户端；否则，我们就生成并发送错误消息。\n\
  \n使用 if/else 代替 try/except 来重写 `do_GET` 看起来可能更简单，但后者有一个优势：我们可以在同一个地方、以相同的方式处理调用的方法（如\
  \ `handle_file`）内部发生的错误。\n\n（注：提供的文本包含了一些 `handle_file`、`handle_error` 和 `send_content`\
  \ 的重复且碎片化的逻辑片段。我根据提供的上下文将它们重构为逻辑代码块。）\n\n\n\n\n\n`MockRequestHandler` 只有几行代码，尽管如果我们的应用程序依赖于所替换的库类中的更多方法，它的代码会更长：\n\
  \n```python\n from io import BytesIO\n\nclass MockRequestHandler:\n    def __init__(self,\
  \ path):\n        self.path = path\n        self.status = None\n        self.headers\
  \ = {}\n        self.wfile = BytesIO()\n\n    def send_response(self, status):\n\
  \        self.status = status\n\n    def send_header(self, key, value):\n      \
  \  if key not in self.headers:\n            self.headers[key] = []\n        self.headers[key].append(value)\n\
  \n    def end_headers(self):\n        pass\n```\n\n特定于应用的类包含了我们已经见过的代码：\n\n```python\n\
  \ class ApplicationRequestHandler:\n    def do_GET(self):\n        try:\n      \
  \      url_path = self.path.lstrip(\"/\")\n            full_path = Path.cwd().joinpath(url_path)\n\
  \            if not full_path.exists():\n                raise ServerException(f\"\
  '{self.path}' not found\")\n            elif full_path.is_file():\n            \
  \    self.handle_file(self.path, full_path)\n        else:\n            raise ServerException(f\"\
  Unknown object '{self.path}'\")\n        except Exception as msg:\n            self.handle_error(msg)\n\
  \n    # ...etc...\n```\n\nMockHandler 处理模拟请求，并存储客户端将收到的值：\n\n```python\n def test_existing_path(fs):\n\
  \    content_str = \"actual\"\n    content_bytes = bytes(content_str, \"utf-8\"\
  )\n    fs.create_file(\"/actual.txt\", contents=content_str)\n    handler = MockHandler(\"\
  /actual.txt\")\n    handler.do_GET()\n    assert handler.status == int(HTTPStatus.OK)\n\
  \    assert handler.headers[\"Content-Type\"] == \\\n        [\"text/html; charset=utf-8\"\
  ]\n    assert handler.headers[\"Content-Length\"] == \\\n        [str(len(content_bytes))]\n\
  \    assert handler.wfile.getvalue() == content_bytes\n```\n\n我们可运行服务器的主体结合这两个类来创建它所需的内容：\n\
  \n```python\n if __name__ == '__main__':\n    class RequestHandler(\n          \
  \  BaseHTTPRequestHandler,\n            ApplicationRequestHandler\n    ):\n    \
  \    pass\n\n    serverAddress = ('', 8080)\n    server = HTTPServer(serverAddress,\
  \ RequestHandler)\n    server.serve_forever()\n```\n\n另一方面，我们的测试创建了一个带有模拟方法的服务器：\n\
  \n```python\n class MockHandler(\n        MockRequestHandler,\n        ApplicationRequestHandler\n\
  ):\n    pass\n```\n\n## 22.5 总结\n\n`图 22.3` 总结了本章介绍的理念。鉴于万维网的影响，新手们会对 HTTP 的如此简单感到惊讶。\n\
  \n![](img/fig22_3)\n\n图 22.3：HTTP 概念图。\n\n## 22.6 练习\n\n### 解析 HTTP 请求\n编写一个函数，接收行列表作为输入，并像解析\
  \ HTTP 请求一样对其进行解析。结果应该是一个包含请求方法、URL、版本和标头的字典。\n\n### 查询参数\nURL 可以包含`query parameters`。阅读\
  \ `urlparse` 模块的文档，然后修改文件服务器，使得包含 `bytes=N`（`N` 为正整数）的 URL 返回所请求文件的前 `N` 个字节。\n\n\
  ### 更好的路径解析\n修改文件服务器，使其：\n1. 启动时必须提供目录的绝对路径作为命令行参数；\n2. 仅提供该目录或其子目录的文件（这样就无法包含 `..`\
  \ 的路径来获取任意文件）。\n\n### 更好的内容类型\n阅读 `mimetypes` 模块的文档，然后修改文件服务器，为非 HTML 文件（如图像）返回正确的内容类型。\n\
  \n### 上传文件\n修改文件服务器以处理 `POST` 请求：\n1. URL 必须指定正在上传的文件名。\n2. 请求正文必须是文件的字节流。\n3. 所有上传的文件都保存在单一目录中，即路径不能包含组件。\n\
  \n### 检查内容长度\n修改文件服务器，使其：\n1. 如果客户端发送的内容比 `Content-Length` 标头指示的多，则读取但忽略额外的字节；\n\
  2. 如果客户端发送的内容较少，服务器不会无限等待缺失的字节。服务器应该向客户端返回什么状态码？\n\n### 目录列表\n1. 修改文件服务器，如果 URL\
  \ 的路径部分标识为一个目录，服务器将返回目录内容的纯文本列表。\n2. 使用 `pyfakefs` 模块为此功能编写测试。\n\n### 动态结果\n修改文件服务器，使得如果客户端请求\
  \ `/time`，服务器将返回一个 HTML 页面，报告服务器机器上的当前时间。\n\n### 模板化结果\n修改文件服务器以：\n1. 将 URL 中的查询参数转换为字典；\n\
  2. 使用该字典填充模板页面；\n3. 将生成的 HTML 页面返回给客户端。\n\n# 23 文件查看器\n\n在需要版本控制工具或解释器之前，程序员需要一种编辑文本文件的方法。即即使是像\
  \ `Notepad` 和 `Nano` 这样简单的编辑器也能做很多事情：移动光标、插入和删除字符等。本章将构建一个文件查看工具，`24 章` 将扩展其实现撤销和重做功能。我们的示例受\
  \ Wasim Lorgat 文章的启发。\n\n## 23.1 Curses\n\n我们的起点是 `curses` 模块，它以统一的方式处理不同操作系统的终端交互。一个非常简单的\
  \ curses 程序如下：\n\n```python\n import curses\n\ndef main(stdscr):\n    while True:\n\
  \        key = stdscr.getkey()\n\nif __name__ == \"__main__\":\n    curses.wrapper(main)\n\
  ```\n\n`curses.wrapper` 接收一个带有参数的函数，进行一些设置，然后用一个作为接口的对象调用该函数。类似于标准输入 `stdin` 和标准输出\
  \ `stdout`，它被称为 `stdscr`（标准屏幕）。我们的 `main` 函数只是一个消耗输入的无限循环。当我们运行程序时，它会清除屏幕并等待用户通过\
  \ Ctrl-C 中断。\n\n我们希望看到用户输入的内容，但由于程序接管了屏幕，`print` 语句将无法使用。在单步调试中运行此程序同样具有挑战性，因此目前我们将创建一个`日志文件`\
  \ 来写入：\n\n```python\n LOG = None\n\ndef open_log(filename):\n    global LOG\n  \
  \  LOG = open(filename, \"w\")\n\ndef log(*args):\n    print(*args, file=LOG)\n\
  ```\n\n有了这些，我们可以重写程序，使其接收日志文件名作为唯一的命令行参数，并向该文件打印消息以显示按下的键。我们还可以修改程序，当用户按下 q 时，程序可以安全退出：\n\
  \n```python\n def main(stdscr):\n    while True:\n        key = stdscr.getkey()\n\
  \        util.log(repr(key))\n        if key.lower() == \"q\":\n            return\n\
  \nif __name__ == \"__main__\":\n    util.open_log(sys.argv[1])\n    curses.wrapper(main)\n\
  ```\n\n注意我们使用 `repr` 打印字符的表示，这样（例如）换行符会在文件中显示为 `\\n` 而空行。\n\n我们现在准备好显示某些文本了。给定字符串列表，下面的修改后的\
  \ `main` 函数将重复执行：\n\n1. 清除屏幕，\n2. 在正确的位置显示每行文本，\n3. 等待按键，并且\n4. 如果键是 q 则退出。\n\n\n\
  \n\n\n```python\n def main(stdscr, lines):\n    while True:\n        stdscr.erase()\n\
  \        for (y, line) in enumerate(lines):\n            stdscr.addstr(y, 0, line)\n\
  \        key = stdscr.getkey()\n        if key.lower() == \"q\":\n            return\n\
  ```\n\n关于这个函数需要记住两点。首先，如第 14 章所解释，屏幕将 `(0, 0)` 置于左上角而不是左下角，且 `Y`值的增加是向下而不是向上。为了让情况变得更加混乱，`curses`\
  \ 使用 `(row, column)` 坐标，所以我们必须记住写 `(y, x)` 而不是 `(x, y)`。\n\n这个函数中的另一个奇怪之处是，用户每次按下按键时都会清除整个屏幕。在大多数情况下，这样做是没有必要的——如果用户的操作没有修改正在显示的文本，就没有必要重绘——但跟踪哪些操作需要以及哪些不需要重绘将需要额外的代码（以及额外的调试）。目前，我们采用这种简单但低效的方法。\n\
  \n以下是运行修改后的 `main` 函数的方式：\n\n```python\n if __name__ == \"__main__\":\n    num_lines,\
  \ logfile = int(sys.argv[1]), sys.argv[2]\n    lines = make_lines(num_lines)\n \
  \   open_log(logfile)\n    curses.wrapper(lambda stdscr: main(stdscr, lines))\n\
  ```\n\n从上到下，我们创建了一个用于显示的字符串列表，打开日志文件，然后使用 `lambda` 创建了一个接受单个屏幕对象作为输入的匿名函数（这是 `curses.wrapper`\
  \ 所要求的），并立即使用*它*所需的两个参数调用 `main`。\n\n真正的文本查看器会显示文件的内容，但为了开发，我们只需构造一个规则文本模式：\n\n\
  ```python\n from string import ascii_lowercase\n\ndef make_lines(num_lines):\n \
  \   result = []\n    for i in range(num_lines):\n        ch = ascii_lowercase[i\
  \ % len(ascii_lowercase)]\n        result.append(ch + \"\".join(str(j % 10) for\
  \ j in range(i)))\n    return result\n```\n\n如果我们请求五行，模式如下：\n\n```\n a\nb0\nc01\n\
  d012\ne0123\n```\n\n这些行是**合成数据**的一个非常（非常）简单的例子，即为了测试目的而构造的数据。如果查看器对这些文本无法正常工作，那么它在实际文件上可能无法无法工作，而且合成数据中的模式将帮助我们发现显示中的错误。\n\
  \n## 23.2 窗口\n\n我们的文件查看器可以工作，但仅适用于小规模示例。如果我们要求它显示 100 行或任何比屏幕大的内容，它就会崩溃并显示消息 `curses.error:\
  \ addwstr() returned ERR`，因为它正试图在屏幕之外绘图。解决方案是创建一个 `Window` 类，让它知道屏幕有多大，并且只显示适应其内部的行（或行的部分）：\n\
  \n```python\n class Window:\n    def __init__(self, screen):\n        self._screen\
  \ = screen\n\n    def draw(self, lines):\n        self._screen.erase()\n       \
  \ for (y, line) in enumerate(lines):\n            if 0 <= y < curses.LINES:\n  \
  \              self._screen.addstr(y, 0, line[:curses.COLS])\n```\n\n我们的 `main`\
  \ 函数随后变为：\n\n```python\n def main(stdscr, lines):\n    window = Window(stdscr)\n\
  \    window.draw(lines)\n    while True:\n        key = stdscr.getkey()\n      \
  \  if key.lower() == \"q\":\n            return\n```\n\n注意 `main` 创建了窗口对象。我们不能早早创建它并像传递\
  \ `lines` 那样将其传入 `main`，因为 `Window` 的构造函数需要屏幕对象，而该对象在 `curses.wrapper` 调用 `main`\
  \ 之前是不存在的。这是**延迟构造**的一个示例，并将限制我们后续的设计（图 23.1）。\n\n![](img/fig23_1.jpg)\n\n图 23.1\
  \ 延迟构造中的操作顺序。\n\n并没有规定我们必须让窗口的大小与显示它的终端完全相同。事实上，如果我们能够创建任意大小的窗口（只要它们不*大于*终端），测试将简单得多。这个版本的\
  \ `Window` 有一个额外的参数 `size`，其值可以是 `None`（意味着“使用整个终端”）或指定所需大小的 `(rows, columns)` 对：\n\
  \n```python\n class Window:\n    def __init__(self, screen, size):\n        self._screen\
  \ = screen\n        if size is None:\n            self._nrow = curses.LINES\n  \
  \          self._ncol = curses.COLS\n        else:\n            self._nrow, self._ncol\
  \ = size\n\n    def draw(self, lines):\n        self._screen.erase()\n        for\
  \ (y, line) in enumerate(lines):\n            if 0 <= y < self._nrow:\n        \
  \        self._screen.addstr(y, 0, line[:self._ncol])\n```\n\n在这个程序中会有大量的二维 `(row,\
  \ column)` 坐标，使用一对常量比直接用 `0` 和 `1` 更具可读性。\n\n```\n ROW = 0\nCOL = 1\n```\n\n```python\n\
  \ class Window:\n    def draw(self, lines):\n        self._screen.erase()\n    \
  \    for (y, line) in enumerate(lines):\n            if 0 <= y < self._nrow:\n \
  \               self._screen.addstr(y, 0, line[:self._ncol])\n```\n\n## 23.3 移动\n\
  \n当给定大型输入时，我们的程序不再崩溃，但我们看不见任何文本。为了修复这个问题，我们需要教应用程序学会滚动；让我们创建另一个类来跟踪位置：\n\n```python\n\
  \ class Cursor:\n    def __init__(self):\n        self._pos = [0, 0]\n\n    def\
  \ pos(self):\n        return tuple(self._pos)\n\n    def up(self):\n        self._pos[0]\
  \ -= 1\n\n    def down(self):\n        self._pos[0] += 1\n\n    def left(self):\n\
  \        self._pos[1] -= 1\n\n    def right(self):\n        self._pos[1] += 1\n\
  ```\n\n现在我们有了跟踪光标位置的方法，可以让 curses 在每次渲染时绘制光标：\n\n```python\n def main(stdscr, size,\
  \ lines):\n    window = Window(stdscr, size)\n    cursor = Cursor()\n    while True:\n\
  \        window.draw(lines)\n        stdscr.move(*cursor.pos())\n        key = stdscr.getkey()\n\
  \        if key == \"KEY_UP\":\n            cursor.up()\n        elif key == \"\
  KEY_DOWN\":\n            cursor.down()\n        elif key == \"KEY_LEFT\":\n    \
  \        cursor.left()\n        elif key == \"KEY_RIGHT\":\n            cursor.right()\n\
  \        elif key.lower() == \"q\":\n            return\n```\n\n如代码所示，屏幕的 getkey\
  \ 方法返回方向键的名字。由于 `stdscr.move` 需要两个参数而 `cursor.pos` 返回一个双元素元组，我们通过 `*` 展开后者以满足前者。\n\
  \n我们需要限制光标的移动，使其留在文本内部（而不仅仅窗口内），同时在适当的情况下向上或向下移动。在解决这些问题之前，我们将重组代码以获得更好的起点。\n\n\
  ## 23.4 重构\n\n我们的第一个变化是编写一个类来表示整个应用程序；我们的程序随后创建该类的一个实例，该实例将拥有窗口和光标。让这运行起来的技巧是利用在第\
  \ 9 章中引入的协议之一：如果一个对象有一个名为 `__call__` 的方法，当该对象像函数一样被调用时，该方法将被调用：\n\n\n\n\n\n```python\n\
  \ class Pretend:\n    def __init__(self, increment):\n        self._increment =\
  \ increment\n\n    def __call__(self, value):\n        return value + self._increment\n\
  \np = Pretend(3)\nresult = p(10)\nprint(result)\n```\n\n```\n13\n```\n\n由于下方的 `MainApp`\
  \ 类定义了 `__call__`，`curses.wrapper` 认为我们已经提供了它所需的单参数函数：\n\n```python\n class MainApp:\n\
  \    def __init__(self, size, lines):\n        self._size = size\n        self._lines\
  \ = lines\n\n    def __call__(self, screen):\n        self._setup(screen)\n    \
  \    self._run()\n\n    def _setup(self, screen):\n        self._screen = screen\n\
  \        self._window = Window(self._screen, self._size)\n        self._cursor =\
  \ Cursor()\n```\n\n`__call__` 方法调用 `_setup` 来创建并存储应用程序所需的对象，然后调用 `_run` 处理交互。后者是：\n\
  \n```python\n def _run(self):\n    while True:\n        self._window.draw(self._lines)\n\
  \        self._screen.move(*self._cursor.pos())\n        key = self._screen.getkey()\n\
  \        if key == \"KEY_UP\": self._cursor.up()\n        elif key == \"KEY_DOWN\"\
  : self._cursor.down()\n        elif key == \"KEY_LEFT\": self._cursor.left()\n \
  \       elif key == \"KEY_RIGHT\": self._cursor.right()\n        elif key.lower()\
  \ == \"q\":\n            return\n```\n\n最后，我们将启动代码提取到函数 `start` 中，以便在代码的后续版本中使用它：\n\
  \n```python\n def start():\n    num_lines, logfile = int(sys.argv[1]), sys.argv[2]\n\
  \    size = None\n    if len(sys.argv) > 3:\n        size = (int(sys.argv[3]), int(sys.argv[4]))\n\
  \    lines = make_lines(num_lines)\n    open_log(logfile)\n    return size, lines\n\
  ```\n\n然后像这样启动我们的应用程序：\n\n```python\n if __name__ == \"__main__\":\n    size, lines\
  \ = start()\n    app = MainApp(size, lines)\n    curses.wrapper(app)\n```\n\n接下来，我们重构\
  \ `_run`，使用动态分发来处理按键，而不是长长的 `if/elif` 语句链：\n\n```python\n TRANSLATE = {\n    \"\\\
  x18\": \"CONTROL_X\"\n}\n\ndef _interact(self):\n    key = self._screen.getkey()\n\
  \    key = self.TRANSLATE.get(key, key)\n    name = f\"_do_{key}\"\n    if hasattr(self,\
  \ name):\n        getattr(self, name)()\n\ndef _do_CONTROL_X(self):\n    self._running\
  \ = False\n\ndef _do_KEY_UP(self):\n    self._cursor.up()\n```\n\n通过实验发现，虽然 `curses`\
  \ 模块对箭头键使用类似“KEY_DOWN”的名称，但对于 Ctrl-X 等组合键，它返回的是实际的控制代码`TRANSLATE` 字典将这些转换为人类可读的名称，我们可以通过\
  \ `_do_` 将它们拼接在一起形成方法名；我们通过将按键记录到文件中并查看其内容得到了十六进制值“\\x18”。如果我们足够努力寻找，可能可以在某处的文档中找到这个值，但一个十秒钟的实验似乎更简单。\n\
  \n有了 `_interact`，我们可以重写 `_run`，使其仅有五行代码：\n\n```python\n class DispatchApp(MainApp):\n\
  \    def __init__(self, size, lines):\n        super().__init__(size, lines)\n \
  \       self._running = True\n\n    def _run(self):\n        while self._running:\n\
  \            self._window.draw(self._lines)\n            self._screen.move(*self._cursor.pos())\n\
  \            self._interact()\n```\n\n它现在依赖于一个名为 `_running` 的成员变量来保持循环。我们本可以让每个按键处理程序返回\
  \ `True` 或 `False` 来指示是否继续，但我们付出了教训发现这很容易忘记，因为几乎所有处理方法的结果都是相同的。\n\n我们现在有了表示应用程序、窗口和光标的类，但我们仍然将文本存储为裸裸的行列表。让我们将其封装在一个类中：\n\
  \n```python\n class Buffer:\n    def __init__(self, lines):\n        self._lines\
  \ = lines[:]\n    def lines(self):\n        return self._lines\n```\n\n这个 `buffer`\
  \ 类目前还没有做什么，但稍后将跟踪可视区域。同样，我们对 `lines` 进行了拷贝而不是使用调用者提供的列表，这样其他代码就无法更改缓冲区的内部。应用程序相应的更改是：\n\
  \n```python\n class BufferApp(DispatchApp):\n    def __init__(self, size, lines):\n\
  \        super().__init__(size, lines)\n\n    def _setup(self, screen):\n      \
  \  self._screen = screen\n        self._make_window()\n        self._make_buffer()\n\
  \        self._make_cursor()\n\n    def _make_window(self):\n        self._window\
  \ = Window(self._screen, self._size)\n\n    def _make_buffer(self):\n        self._buffer\
  \ = Buffer(self._lines)\n\n    def _make_cursor(self):\n        self._cursor = Cursor()\n\
  ```\n\n## 23.5 裁剪 (Clipping)\n\n我们现在准备好将光标保持在文本内部。`ClipCursor` 类接收 `buffer` 作为构造参数，以便它可以询问有多少行以及每一行有多大，但它的\
  \ `up`、`down` 和 `right` 方法与 `Cursor` 签名完全相同：\n\n```python\nclass ClipCursor(Cursor):\n\
  \    def __init__(self, buffer):\n        super().__init__()\n        self._buffer\
  \ = buffer\n\n    def up(self):\n        self._pos[ROW] = max(self._pos[ROW]-1,\
  \ 0)\n\n    def down(self):\n        self._pos[ROW] = min(self._pos[ROW]+1, self._buffer.nrow()-1)\n\
  \n    def left(self):\n        self._pos[COL] = max(self._pos[COL]-1, 0)\n\n   \
  \ def right(self):\n        self._pos[COL] = min(self._pos[COL]+1, self._buffer.ncol(self._pos[ROW])-1)\n\
  ```\n\n运行此程序时，我们不再能够将光标移动到窗口或显示文本之外——除非我们先到长行的末尾然后移动到较短的行。问题在于 `up` 和 `down` 只改变了光标对所在行的认知；它们没有检查列位置是否仍在文本内部。修复方法很简单：\n\
  \n```python\nclass ClipCursorFixed(ClipCursor):\n    def up(self):\n        super().up()\n\
  \        self._fix()\n\n    def down(self):\n        super().down()\n        self._fix()\n\
  \n    def _fix(self):\n        self._pos[COL] = min(self._pos[COL], self._buffer.ncol(self._pos[ROW])-1)\n\
  ```\n\n## 23.6 视口 (Viewport)\n\n我们终于准备好垂直滚动文本，以便无论窗口多小都能看到所有的行。（我们将水平滚动留作练习。）一个功能齐全的编辑器会引入另一个类，通常称为**视口**，用于跟踪缓冲区的可视部分。为了保持简单，我们将直接在缓冲区中添加两个成员变量来跟踪顶部的可视行和窗口高度：\n\
  \n\n\n\n\n```python\nclass ViewportBuffer(ClipBuffer):\n    def __init__(self, lines):\n\
  \        super().__init__(lines)\n        self._top = 0\n        self._height =\
  \ None\n\n    def lines(self):\n        return self._lines[self._top:self._top +\
  \ self._height]\n\n    def set_height(self, height):\n        self._height = height\n\
  \n    def _bottom(self):\n        return self._top + self._height\n```\n\n缓冲区中最重要的变化是\
  \ `lines` 返回的是文本的可视部分，而不是全部内容。另一个变化是缓冲区将 `_height` 初始化为 `None`，并要求后续有人将其设置为真实值，因为应用程序的\
  \ `_setup` 方法是独立创建光标、缓冲区和窗口的。如果我们构建的是一个单一类，而不是在教程类上层层堆叠，我们可能会回过头来修改 `_setup` 以消除这种需求。\n\
  \n我们的缓冲区还获得了两个方法。第一个方法将光标的位置从缓冲区坐标转换为屏幕坐标：\n\n```python\ndef transform(self, pos):\n\
  \    result = (pos[ROW] - self._top, pos[COL])\n    return result\n```\n\n第二个方法在我们到达显示器边缘时移动\
  \ `_top` 向上或向下：\n\n```python\ndef scroll(self, row, col):\n    old = self._top\n\
  \    if (row == self._top - 1) and self._top > 0:\n        self._top -= 1\n    elif\
  \ (row == self._bottom()) and \\\n         (self._bottom() < self.nrow()):\n   \
  \     self._top += 1\n```\n\n和之前一样，我们派生出一个应用程序类来创建合适的缓冲区对象。我们还重写了 `_run`，在每次与用户交互后滚动缓冲区：\n\
  \n```python\nclass ViewportApp(ClipAppFixed):\n    def _make_buffer(self):\n   \
  \     self._buffer = ViewportBuffer(self._lines)\n\n    def _make_cursor(self):\n\
  \        self._cursor = ViewportCursor(self._buffer, self._window)\n\n    def _run(self):\n\
  \        self._buffer.set_height(self._window.size()[ROW])\n        while self._running:\n\
  \            self._window.draw(self._buffer.lines())\n            screen_pos = self._buffer.transform(self._cursor.pos())\n\
  \            self._screen.move(*screen_pos)\n            self._interact()\n    \
  \        self._buffer.scroll(*self._cursor.pos())\n```\n\n注意 `ViewportApp` 类创建了一个\
  \ `ViewportCursor`。当我们测试程序时，发现我们引入了一个 bug：如果光标当前所在的行比窗口宽，光标可能会再次移动到窗口之外。解决方案是在 `_fix`\
  \ 中添加另一个检查，并确保左右移动像垂直移动一样限制了光标的位置：\n\n```python\nclass ViewportCursor(ClipCursorFixed):\n\
  \    def __init__(self, buffer, window):\n        super().__init__(buffer)\n   \
  \     self._window = window\n\n    def left(self):\n        super().left()\n   \
  \     self._fix()\n\n    def right(self):\n        super().right()\n        self._fix()\n\
  \n    def _fix(self):\n        self._pos[COL] = min(\n            self._pos[COL],\n\
  \            self._buffer.ncol(self._pos[ROW]) - 1,\n            self._window.size()[COL]\
  \ - 1\n        )\n```\n\n## 23.7 总结\n\n图 23.2 总结了本章介绍的思想。跟踪多组坐标是一项大量的记录工作；像 `Textual`\
  \ 这样的框架的吸引力之一在于它们为我们做了多少工作。\n\n## 23.8 练习\n\n### 使用 global\n1. 为什么 `open_log` 需要\
  \ `global`？如果删该它会发生什么？\n2. 为什么 `log` 函数不需要这条语句？\n\n### 水平滚动\n修改应用程序使其也能进行水平滚动。\n\
  \n### 解释 Bug\n将代码最终版本中的 `ViewportCursor` 类替换为较早的 `ClipCursorFixed` 类，然后解释创建 `ViewportCursor`\
  \ 是为了修复什么。\n\n### 行号\n修改文件查看器在左侧显示行号。\n\n### 继承\n图 23.3 显示了我们在教程中创建的类。总结每个类的变化。\n\
  \n### 尺寸控制\n本章定义的 `Window` 类接受用户输入以确定绘图区域的大小，默认使用 `curses.LINES` 和 `curses.COLS`。如果用户提供的尺寸大于可用区域并尝试在该区域绘图，`curses`\
  \ 会抛出错误。修改代码使其不再报错。\n\n# 24 撤销与重做\n\n查看文本文件很有用，但我们还希望能够编辑它们。这一章将修改第 23 章的文件查看器，以便我们可以添加和删除文本。由于人会出错，我们还将实现撤销功能，这将引入另一个常用的设计模式。\n\
  \n## 24.1 入门\n\n我们的文件查看器有四个类类：\n\n*   `Window` 可以绘制行并报告其大小。\n*   `Buffer` 存储文本行，跟踪视口，并将缓冲区坐标转换为屏幕坐标。\n\
  *   `Cursor` 知道自己在缓冲区中的位置并可以上、下、左、右移动。\n*   `App` 创建窗口、缓冲区和光标，然后将键映射到操作。\n\n为了让单元测试更简单，我们首先增加一个类：替代\
  \ `curses` 模块提供的屏幕对象。该类以网格形式存储当前的显示状态，以便测试检查：\n\n```python\nclass HeadlessScreen:\n\
  \    def __init__(self, size, keystkes):\n        self._size = size\n        self._keys\
  \ = keystkes\n        self._i_key = 0\n        self.erase()\n\n    def getkey(self):\n\
  \        if self._i_key == len(self._keys):\n            key = \"CONTROL_X\"\n \
  \       else:\n            key = self._keys[self._i_key]\n            self._i_key\
  \ += 1\n        return key\n\n    def addstr(self, row, col, text):\n        assert\
  \ 0 <= row < self._size[ROW]\n        assert col == 0\n        assert len(text)\
  \ <= self._size[COL]\n        self._display[row] = text + self._\n```\n\n不显示任何内容的\
  \ GUI 应用程序通常被称为**无头（headless）**应用程序。将模拟按键传递给屏幕似乎很奇怪——更合理的做法是让 `App` 有一个获取按键的方法——但这是放在现有类中最简单的方法。\n\
  \n为了完成这一更改，我们还需要定义一个 `HeadlessWindow` 来接收屏幕尺寸并将其传递给屏幕：\n\n```python\nclass HeadlessWindow(Window):\n\
  \    def __init__(self, screen, size):\n        assert size is not None and len(size)\
  \ == 2\n        super().__init__(screen, size)\n```\n\n最后，我们新的应用程序类记录按键、光标位置和屏幕内容以便测试：\n\
  \n```python\nclass HeadlessApp(App):\n    def __init__(self, size, lines):\n   \
  \     super().__init__(size, lines)\n        self._log = []\n\n    def get_log(self):\n\
  \        return self._log\n\n    def _add_log(self, key):\n        self._log.append((key,\
  \ self._cursor.pos(), self._screen.display()))\n\n    def _make_window(self):\n\
  \        self._window = HeadlessWindow(self._screen, self._size)\n```\n\n我们现在可以这样编写测试了：\n\
  \n```python\ndef test_scroll_down():\n    size = (2, 2)\n    lines = [\"abc\", \"\
  def\", \"ghi\"]\n    keys = [\"KEY_DOWN\"] * 3\n    screen = HeadlessScreen(size,\
  \ keys)\n    app = HeadlessApp(size, lines)\n    app(screen)\n    assert app.get_log()[-1]\
  \ == (\"CONTROL_X\", (2, 0), [\"de\", \"gh\"])\n```\n\n## 24.2 插入与删除\n\n我们现在准备好实现插入和删除。第一步是在缓冲区类中添加更新文本行的方法：\n\
  \n\n\n\n\n```python\nclass InsertDeleteBuffer(Buffer):\n    def insert(self, pos,\
  \ char):\n        assert 0 <= pos[ROW] < self.nrow()\n        assert 0 <= pos[COL]\
  \ <= self.ncol(pos[ROW])\n        line = self._lines[pos[ROW]]\n        line = line[:pos[COL]]\
  \ + char + line[pos[COL]:]\n        self._lines[pos[ROW]] = line\n\n    def delete(self,\
  \ pos):\n        assert 0 <= pos[ROW] < self.nrow()\n        assert 0 <= pos[COL]\
  \ < self.ncol(pos[ROW])\n        line = self._lines[pos[ROW]]\n        line = line[:pos[COL]]\
  \ + line[pos[COL] + 1:]\n        self._lines[pos[ROW]] = line\n```\n\n注意，我们删除的是光标*下方*的字符，而不是光标左侧的字符：这是原地删除（delete-in-place），而不是退格删除（backspace-delete）。同时注意，我们通过了一些防御性编程，检查了操作的坐标是否合理。\n\
  \n为了支持插入和删除，窗口、光标和屏幕不需要改变，但应用程序类需要进行若干更新。首先是定义可以插入的字符集（在我们的示例中是字母和数字），并创建一个相应类型的缓冲区：\n\
  \n```python\nclass InsertDeleteApp(HeadlessApp):\n    INSERTABLE = set(string.ascii_letters\
  \ + string.digits)\n\n    def _make_buffer(self):\n        self._buffer = InsertDeleteBuffer(self._lines)\n\
  ```\n\n我们还需要为插入和删除创建处理程序：\n\n```python\ndef _do_DELETE(self):\n    self._buffer.delete(self._cursor.pos())\n\
  \ndef _do_INSERT(self, key):\n    self._buffer.insert(self._cursor.pos(), key)\n\
  ```\n\n最后，由于我们不想为每个可插入的字符都添加一个处理器，让我们写一个 `_get_key` 方法来返回一个值对。第一个值表示按键的“族”，第二个是实际的按键。如果族为\
  \ `None`，则该键是一个带有自己处理器的特殊键；否则，我们查找该键所属族的处理器：\n\n```python\ndef _get_key(self):\n\
  \    key = self._screen.getkey()\n    if key in self.INSERTABLE:\n        return\
  \ \"INSERT\", key\n    else:\n        return None, key\n\ndef _interact(self):\n\
  \    family, key = self._get_key()\n    if family is None:\n        name = f\"_do_{key}\"\
  \n        if hasattr(self, name):\n            getattr(self, name)()\n    else:\n\
  \        name = f\"_do_{family}\"\n        if hasattr(self, name):\n           \
  \ getattr(self, name)(key)\n    self._add_log(key)\n```\n\n我们将为这个应用程序编写很多测试，所以让我们写一个辅助函数来创建固件、运行程序并返回它：\n\
  \n```python\ndef make_fixture(keys, size, lines):\n    screen = HeadlessScreen(size,\
  \ keys)\n    app = InsertDeleteApp(size, lines)\n    app(screen)\n    return app\n\
  ```\n\n我们的测试现在设置和检查变得非常直接：\n\n```python\ndef test_delete_middle():\n    app = make_fixture([\"\
  KEY_RIGHT\", \"DELETE\"], (1, 3), [\"abc\"])\n    assert app.get_log()[-1] == (\"\
  CONTROL_X\", (0, 1), [\"ac_\"])\n```\n\n## 24.3 向后回\n\n为了撤销操作，我们必须：\n\n1. 跟踪 `actions`（动作）并反转它们，\n\
  2. 跟踪 `state`（状态）并恢复它。\n\n记录动作的实现可能更复杂，但比每次更改后保存整个状态所需的空间更少，因此系统都是这样做的。起点是在日志中追加每个动作的记录：\n\
  \n```python\nclass History(InsertDeleteApp):\n    def __init__(self, size, keystro):\n\
  \        super().__init__(size, keystro)\n        self._history = []\n\n    def\
  \ get_history(self):\n        return self._history\n\n    def _do_DELETE(self):\n\
  \        row, col = self._cursor.pos()\n        char = self._buffer.char(row, col)\n\
  \        self._history.append((\"delete\", (row, col), char))\n        self._buffer.delete(self._cursor.pos())\n\
  ```\n\n但是撤销光标移动呢？如果我们添加一个字符，移动到另一个地方，然后撤销，光标不应该回到删除该字符之前的位置吗？我们该如何解释这些记录？我们需要一个带有其自身处理器的第二个方法吗？\n\
  \n解决这些问题的通用方案是使用 `Command`（命令）设计模式。这种模式将动词转换为名词，即每个动作都表示为一个具有向前移动和向后移动的方法的对象。我们的动作继承自一个抽象基类，以便可以相互使用。该基类是：\n\
  \n```python\nclass Action:\n    def __init__(self, app):\n        self._app = app\n\
  \n    def do(self):\n        raise NotImplementedError(f\"{self.__class__.__name__}:\
  \ do\")\n\n    def undo(self):\n        raise NotImplementedError(f\"{self.__class__.__name__}:\
  \ undo\")\n```\n\n插入和删除的子类是：\n\n```python\nclass Insert(Action):\n    def __init__(self,\
  \ app, pos, char):\n        super().__init__(app)\n        self._pos = pos\n   \
  \     self._char = char\n\n    def do(self):\n        self._app.buffer.insert(self._pos,\
  \ self._char)\n\n    def undo(self):\n        self._app.buffer.delete(self._pos)\n\
  \nclass Delete(Action):\n    def __init__(self, app, pos):\n        super().__init__(app)\n\
  \        self._pos = pos\n\n    def do(self):\n        self._app.buffer.delete(self._pos)\n\
  \n    def undo(self):\n        self._app.buffer.insert(self._pos, self._char)\n\n\
  class Move(Action):\n    def __init__(self, app, direction):\n        super().__init__(app)\n\
  \        self._direction = direction\n        self._old = self._app.cursor.pos()\n\
  \        self._new = None\n\n    def do(self):\n        self._app.cursor.act(self._direction)\n\
  \        self._new = self._app.cursor.pos()\n\n    def undo(self):\n        self._app.cursor.move_to(self._old)\n\
  ```\n\n这个类记录了新的光标位置以及旧的位置，以便调试。它依赖于 `Cursor` 中添加按名称（例如“右”或“左”）移动的方法以及移动到特定位置的方法：\n\
  \n```python\nclass Cursor:\n    def act(self, direction):\n        assert hasattr(self,\
  \ direction)\n        getattr(self, direction)()\n\n    def move_to(self, pos):\n\
  \        self._pos = pos\n```\n\n应用程序的 `interact` 方法也发生了变化。它不再依赖按键处理器方法来执行操作，而是期望它们创建动作对象（见图\
  \ 24.1](#fig24_1)。这些对象被追加到历史记录中，然后要求执行 `do`：\n\n```python\ndef _interact(self):\n\
  \    family, key = self._get_key()\n    name = f\"_do_{family}\" if family else\
  \ f\"_do_{key}\"\n    if not hasattr(self, name):\n        return\n    action =\
  \ getattr(self, name)(key)\n    self._history.append(action)\n    action.do()\n\
  \    self._add_log(key)\n```\n\n注意，我们修改了所有处理器方法以接收按键作为输入参数，这样我们不需要区分需要和不需要的情况。这稍微简化了代码，代价是为特殊键的处理器引入了未使用的参数。\n\
  \n最后，每个处理器方法现在构建一个对象并返回：\n\n```python\ndef _do_DELETE(self, key):\n    return Delete(self,\
  \ self._cursor.pos())\n\ndef _do_INSERT(self, key):\n    return Insert(self, self._cursor.pos(),\
  \ key)\n\ndef _do_KEY_UP(self, key):\n    return Move(self, \"up\")\n```\n\n有了所有这些更改，我们的应用程序*几乎*可以工作。我们添加了一个\
  \ `_do_UNDO` 处理器，从历史记录中弹出最近的动作并调用其 `undo` 方法。但是，当我们测试它时，会陷入无限循环，因为我们在执行动作之前将动作追加到了历史记录中，所以我们实际上是在撤销我们的撤销。解决方案是修改基类\
  \ `Action`，使其具有 `save` 方法，告诉应用程序是否保存该动作。默认实现返回 `True`，但我们在 `Undo` 中覆盖了它以返回 `False`：\n\
  \n\n\n\n\n```\n class Undo(Action):\n    def do(self):\n        action = self._app._history.pop()\n\
  \        action.undo()\n\n    def save(self):\n        return False\n\n    def __str__(self):\n\
  \        return f\"Undo({self._app._history[-1]})\"\n```\n\n注意，从历史栈中弹出最近的操作只有在我们修改了应用程序的\
  \ `_interact` 方法后才有效，该方法现在只保存应该被保存的操作：\n\n```\n class UndoableApp(ActionApp):\n\
  \    def _interact(self):\n        family, key = self._get_key()\n        name =\
  \ f\"_do_{family}\" if family else f\"_do_{key}\"\n        if not hasattr(self,\
  \ name):\n            return\n        action = getattr(self, name)(key)\n      \
  \  action.do()\n        if action.save():\n            self._history.append(action)\n\
  \        self._add_log(key)\n```\n\n我们现在可以编写这样的测试来检查是否可以插入字符、撤销该操作，并回到原来的屏幕状态：\n\
  \n```\n def test_insert_undo():\n    app = make_fixture([\"z\", \"UNDO\"])\n   \
  \ assert get_screen(app) == [\"ab\", \"cd\"]\n```\n\n## 24.4 总结\n\n图 24.2 总结了本章介绍的概念。真实的文本编辑器（即使是简单的）显然有更多功能，但我们现在已经看到了大部分的核心思想。\n\
  \n![](img/fig24_2.jpg)\n\n图 24.2: 概念图。\n\n## 24.5 练习\n\n### 合并移动\n\n修改应用程序，使连续的移动操作合并为一个撤销步骤。\n\
  \n### 忘记移动\n\n大多数编辑器不在撤销历史中保存光标移动。修改本章的代码，使撤销只对编辑内容的更改有效。\n\n### 限制历史\n\n修改应用程序，使得只能撤销最近的百次操作。\n\
  \n### 换行\n\n修改代码，按下回车键插入新行或将当前行断开。为了使此操作可以撤销，你需要存储什么信息？\n\n### 重做操作\n\n实现一个“重做”命令，重新执行已撤销的操作。重做与撤销一个撤销有什么区别？重做一个未执行的操作有意义吗？\n\
  \n### 重复操作\n\n1. 实现一个重复最近操作的命令。\n2. 重复的操作在应用程序的历史记录中应该如何表示？\n\n### 保存操作\n\n使用第 16\
  \ 章中的思想将操作保存到文件中并重新加载，以便用户恢复编辑会话。\n\n# 25 虚拟机\n\n第 7 章 中的解释器依赖 Python 来完成大部分实际工作。Python\
  \ 标准版本是用 C 实现的，并依赖 C 的运算符来进行数字加法、数组索引等，但 C 被编译为针对特定处理器的指令。因此，第 7 章 中小型语言中的每个操作都会通过几层软件扩展，变成硬件实际上可以运行的内容。为了展示底层是如何的工作原理，本章构建了一个小型计算机的模拟器。如果你想深入研究这一层次的编程，可以看看游戏《资源大亨¹。\n\
  \n## 25.1 架构\n\n我们的**虚拟机** (VM) 模拟了一个包含三个部分的计算机（图 25.1）：\n\n1. **指令指针** (`IP`) 持有下一个要执行指令的内存地址。它被自动初始化指向地址\
  \ 0，因此每个程序都必须从这里开始。这个要求是我们我们虚拟机**应用二进制接口** (`ABI`) 的一部分。\n2. 四个名为 `R0` 到 `R3` 的**寄存器**，指令可以直接访问它们。我们的虚拟机中没有内存到内存的操作：一切都在寄存器中或通过寄存器发生。\n\
  3. 256 个**字**内存，每个字可以存储单个值。程序及其数据都存在于这块内存中；我们选择 256 这个大小是为了让每个字的地址都能放入一个字节中。\n\n\
  ![](img/fig25_1.jpg)\n\n图 25.1: 虚拟机的架构。\n\n我们处理器的**指令集**定义了它可以做什么。指令只是数字，但我们将使用一种名为**汇编代码**的简单文本格式来编写它们，这些数字提供了人类可读的名称。\n\
  \n我们虚拟机的指令长度为 3 字节。**操作码**占用一个字节，每个指令可能包含零、一个或两个单字节操作数。（指令有时被称为**字节码**，因为它们被封装成字节，但计算机中的其他所有内容也是这样。）\n\
  \n每个操作数都是一个寄存器标识符、常量或地址（地址只是一个标识内存位置的常量）。由于常量必须适应一个字节，这意味着我们能直接表示的最大的数字是 256。表 25.1\
  \ 使用字母 `r` 和 `v` 来指示指令格式，其中 `r` 表示寄存器标识符，`v` 表示常量值。\n\n表 25.1: 虚拟机指令码。\n\n| 指令名称\
  \ | 代码 | 示例 |\n| --- | --- | --- |\n| hlt | 1 | 停止 |\n| ldc | 2 | 加载常量 |\n| ldr\
  \ | 3 | 加载寄存器 |\n| cpy | 4 | 复制寄存器 |\n| str | 5 | 存储寄存器 |\n| add | 6 | 加法 |\n| sub\
  \ | 7 | 减法 |\n| beq | 8 | 如果相等则跳转 |\n| bne | 9 | 如果不相等则跳转 |\n| prr | 10 | 打印寄存器\
  \ |\n| prm | 11 | 打印内存 |\n\n为了启动我们的虚拟机，我们将虚拟机的细节放在一个可以被模块加载的文件中，这样更易于查找，而不是分散在多个文件中：\n\
  \n```\nNUM_REG = 4 # 寄存器数量\nRAM_LEN = 256 # RAM 中的字数\n\nOPS = {\n    \"hlt\": {\"\
  code\": 0x1, \"fmt\": \"--\"}, # 停止\n    \"ldc\": {\"code\": 0x2, \"fmt\": \"rv\"\
  }, # 加载常量\n    \"ldr\": {\"code\": 0x3, \"fmt\": \"rr\"}, # 加载寄存器\n    \"cpy\":\
  \ {\"code\": 0x4, \"fmt\": \"rr\"}, # 复制寄存器\n    \"str\": {\"code\": 0x5, \"fmt\"\
  : \"rr\"}, # 存储寄存器\n    \"add\": {\"code\": 0x6, \"fmt\": \"rr\"}, # 加法\n    \"\
  sub\": {\"code\": 0x7, \"fmt\": \"rr\"}, # 减法\n    \"beq\": {\"code\": 0x8, \"fmt\"\
  : \"rv\"}, # 如果相等则跳转\n    \"bne\": {\"code\": 0x9, \"fmt\": \"rv\"}, # 如果不相等则跳转\n\
  \    \"prr\": {\"code\": 0xA, \"fmt\": \"r-\"}, # 打印寄存器\n    \"prm\": {\"code\"\
  : 0xB, \"fmt\": \"r-\"}, # 打印内存\n}\n\nOP_MASK = 0xFF # 选择单个字节\nOP_SHIFT = 8 # 向右移一个字节\n\
  OP_WIDTH = 6 # 打印时的操作宽度\n```\n\n这种设计模式没有特定的名称，但将定义系统的常量放在一个文件中而不是分散在多个文件中，使其更容易查找，同时也确保了一致性。\n\
  \n## 25.2 执行\n\n我们首先定义一个包含指令指针、一些寄存器和一些内存以及输出提示的类。程序只是表示指令的数字数组。为了将程序加载到虚拟机，我们将这些数字复制到内存并重置指令指针和寄存器：\n\
  \n```\nclass VirtualMachine:\n    def __init__(self):\n        self.initialize([])\n\
  \        self.prompt = \">>\"\n\n    def initialize(self, program):\n        assert\
  \ len(program) <= RAM_LEN, \"程序太长\"\n        self.ram = [\n            program[i]\
  \ if (i < len(program)) else 0\n            for i in range(RAM_LEN)\n        ]\n\
  \        self.ip = 0\n        self.reg = [0] * NUM_REG\n```\n\n\n\n\n\n注意，VM 的构造函数调用了\
  \ `initialize` 并传入一个空数组（即一个没有指令的程序）来进行初始设置。如果一个对象具有重置或重新初始化自身的方法，那么让其构造函数使用该方法是避免代码重复的一种方法。\n\
  \n为了执行下一条指令，VM 获取指令指针当前指向的内存中的值，并将指令指针向前移动一个地址。然后，它使用位运算（第 17 章）从指令中提取操作码（op code）和操作数（图\
  \ 25.2）。\n\n```\ndef fetch(self):\n    instruction = self.ram[self.ip]\n    self.ip\
  \ += 1\n    op = instruction & OP_MASK\n    instruction >>= OP_SHIFT\n    arg0 =\
  \ instruction & OP_MASK\n    instruction >>= OP_SHIFT\n    arg1 = instruction &\
  \ OP_MASK\n    return [op, arg0, arg1]\n```\n\n![](img/fig25_2.jpg)\n\n图 25.2: 使用位运算解包指令。\n\
  \n无论指令是否包含操作数，我们总是解包两个操作数，因为这是大多数硬件实现所做的。\n\n下一步是为我们的 VM 添加一个 `run` 方法，该方法获取指令并执行它们，直到被命令停止：\n\
  \n```\ndef run(self):\n    running = True\n    while running:\n        op, arg0,\
  \ arg1 = self.fetch()\n        if op == OPS[\"hlt\"][\"code\"]:\n            running\
  \ = False\n        elif op == OPS[\"ldc\"][\"code\"]:\n            self.reg[arg0]\
  \ = arg1\n        elif op == OPS[\"ldr\"][\"code\"]:\n            self.reg[arg0]\
  \ = self.ram[self.reg[arg1]]\n        elif op == OPS[\"cpy\"][\"code\"]:\n     \
  \       self.reg[arg0] = self.reg[arg1]\n        else:\n            assert False,\
  \ f\"Unknown op {op:06x}\"\n```\n\n让我们仔细观察这三条指令中的三。第一条 `str` 将一个寄存器的值存储到另一个寄存器所持有的地址中：\n\
  \n```\nelif op == OPS[\"str\"][\"code\"]:\n    self.ram[self.reg[arg1]] = self.reg[arg0]\n\
  ```\n\n将一个寄存器中的值加上另一个寄存器中的值更为简单：\n\n```\nelif op == OPS[\"add\"][\"code\"]:\n  \
  \  self.reg[arg0] += self.reg[arg1]\n```\n\n当寄存器中的值为 0 时，跳转到固定地址也是如此。这条**条件跳转**指令就是我们实现\
  \ `if` 的方式：\n\n```\nelif op == OPS[\"beq\"][\"code\"]:\n    if self.reg[arg0] ==\
  \ 0:\n        self.ip = arg1\n```\n\n## 25.3 汇编代码\n\n我们可以像早期的程序员² 那样手写数值操作码。然而，使用**汇编器**要容易得多，汇编器只是一个针对非常接近实际机器指令的语言的小型编译器。\n\
  \n我们汇编语言中的每条命令都匹配 VM 中的一条指令。这里有一个汇编语言程序，用于打印存储在 R1 中的值然后停止：\n\n```\n# 打印 R1 的初始内容。\n\
  prr R1\nhlt\n```\n\n它的数值表示（十六进制）为：\n\n```\n00010a\n000001\n```\n\n汇编语言拥有的而指令集不具备的是内存地址上的**标签**（labels）。标签\
  \ `loop` 不占用任何空间；相反，它告诉汇编器给下一条指令的地址起名字，以便我们可以在跳转指令中引用 `@loop`。例如，这个程序打印从 0 到 2 的数字（图\
  \ 25.3）：\n\n![](img/fig25_3.jpg)\n\n图 25.3: 从 0 数到 2 的汇编语言程序流程图。\n\n```\n# 数到 3。\n\
  # - R0: 循环索引。\n# - R1: 循环限制。\nldc R0 0\nldc R1 3\nloop:\nprr R0\nldc R2 1\nadd R0\
  \ R2\ncpy R2 R1\nsub R2 R0\nne R2 @loop\nhlt\n```\n\n```\n000002\n030102\n0000a\n\
  01022\n02006\n01024\n00207\n02209\n00001\n```\n\n让我们追踪这个程序的执行过程（[图 25.4]）：\n\n1.\
  \ `R0` 持有当前的循环索引。\n2. `R1` 持有循环边界（在本例中为 3）。\n3. 循环打印 `R0` 的值（一条指令）。\n4. 程序将 `R0`\
  \ 加 1。这需要两条指令，因为我们只能对寄存器进行加法。\n5. 它检查是否再次循环，这需要三条指令。\n6. 如果程序不跳转，它就会停止。\n\n![](img/fig25_4.jpg)\n\
  \n图 25.4: 追踪程序的执行过程。\n\n## 25.4 数组\n\n当每个值都需要一个唯一的名称时，编写程序是非常繁琐的。一旦有了数组，我们就可以做更多，所以让我们在汇编器中添加它们。我们不需要对虚拟机进行任何更改，因为它并不在乎我们是将一组数字视为个体还是数组元素，但我们确实需要一种创建数组并引用它们的方法。\n\
  \n我们将在程序末尾为数组分配存储，使用单独的一一行 `.data` 来标记数据部分的开始，然后使用 `标签: 数字` 给某个区域命名并分配一些存储空间（图 25.5）。\n\
  \n![](img/fig25_5.jpg)\n\n图 25.5: 在虚拟机中为数组分配存储。\n\n这项增强只需要对汇编器进行几处更改。首先，我们需要将行分为指令和数据分配：\n\
  \n\n\n\n\n```pythonDIVIDER = \".data\"\n\ndef assemble(self, lines):\n    lines\
  \ = self._get_lines(lines)\n    to_compile, to_allocate = self._split(lines)\n\n\
  \    labels = self._find_labels(lines)\n    instructions = [ln for ln in to_compile\
  \ if not self._is_label(ln)]\n\n    base_of_data = len(instructions)\n    self._add_allocations(base_of_data,\
  \ labels, to_allocate)\n\n    compiled = [self._compile(instr, labels) for instr\
  \ in instructions]\n    program = self._to_text(compiled)\n    return program\n\n\
  def _split(self, lines):\n    try:\n        split = lines.index(self.DIVIDER)\n\
  \        return lines[0:split], lines[split + 1:]\n    except ValueError:\n    \
  \    return lines, []\n```\n\n其次，我们需要确定每个分配所在的位置，并相应创建一个标签：\n\n```python\ndef _add_allocations(self,\
  \ base_of_data, labels, to_allocate):\n    for alloc in to_allocate:\n        fields\
  \ = [a.strip() for a in alloc.split(\":\")]\n        assert len(fields) == 2, f\"\
  Invalid allocation directive '{alloc}'\"\n        lbl, num_words_text = fields\n\
  \        assert lbl not in labels, f\"Duplicate label '{lbl}' in allocation\"\n\
  \        num_words = int(num_words_text)\n        assert (base_of_data + num_words)\
  \ < RAM_LEN, \\\n            f\"Allocation '{lbl}' requires too much memory\"\n\
  \        labels[lbl] = base_of_data\n        base_of_data += num_words\n```\n\n\
  就是这样：编译或执行部分都不需要其他更改。为了测试它，让我们用从 0 到 3 的数字填充数组：\n\n```assembly\n# 计数到 3。\n# - R0:\
  \ 循环索引。\n# - R1: 循环限制。\n# - R2: 数组索引。\n# - R3: 临时变量。\nldc R0 0\nldc R1 3\nldc R2\
  \ @array\nloop:\nstr R0 R2\nldc R3 1\nadd R0 R3\nadd R2 R3\ncpy R3 R1\nsub R3 R0\n\
  bne R3 @loop\nhlt\n.data\narray: 10\n```\n\n```text\nR000000   = 000003\nR000001\
  \   = 000003\nR000002   = 00000e\nR000003   = 000000\n000000:   000002 030102  \
  \ 0b0202   020005\n000004:   010302 030006   030206   010304\n000008:   000307 030309\
  \   000001   000000\n00000c:   000001 000002   000000   000000\n```\n\n## 25.5 总结\n\
  \n`图 25.6` 总结了本章中的新思想。真实的处理器和语言的虚拟机更为复杂，但经验表明，保持简单可以让它们运行得快速且可靠。\n\n`图 25.6`：虚拟机和汇编器的概念图。\n\
  \n## 25.6 练习\n\n### 交换值\n编写一个汇编语言程序，交换 `R1` 和 `R2` 中的值，而不影响其他寄存器。\n\n### 翻转数组\n\
  编写一个汇编语言程序，起始部分如下：\n* 一个字存储数组的基地址\n* 下一个字存储数组的长度 `N`\n* 之后是各个值\n并在原处翻转该数组。\n\n###\
  \ 递增与递减\n1. 添加指令 `inc` 和 `dec`，这两个指令分别向寄存器的值加 1 和减 1。\n2. 重写示例以使用这些指令。它们让程序变短了多少？它们变得更容易读了吗？\n\
  \n### 使用长地址\n1. 修改虚拟机，使 `ldr` 和 `str` 指令包含 16 位地址而不是 8 位。将虚拟机的内存增加到 64K 以匹配。\n2.\
  \ 这如何增加解释的复杂性？\n\n### 操作字符串\nC 编程语言将字符串存储为非零字节，并以包含零的字节终止。\n1. 编写一个程序，起始于 `R1` 中的字符串基地址，结束于在该寄存器中输出字符串的长度（不包括终止符）。\n\
  2. 编写一个程序，起始于 `R1` 中的字符串基地址和 `R2` 中的某个其他内存块的基地址，并将字符串复制到该新位置（包括终止符）。\n3. 如果缺少终止符，每种情况下发生什么？\n\
  \n### 调用与返回\n1. 在虚拟机中添加另一个名为 `SP`（代表“栈指针”）的寄存器，它会自动初始化为内存中的最后一个地址。\n2. 添加指令 `phs`（push\
  \ 的缩写），它将寄存器中的值复制到 `SP` 存储的地址，并将 `SP` 减 1。\n3. 添加指令 `pop`，它将值从 `SP` 存储的地址复制到寄存器，并将\
  \ `SP` 增加 1。\n4. 添加指令 `call`，它跳转到目标地址，并在返回前将当前指令计数器推入栈中。\n5. 添加指令 `ret`，它从栈中弹出返回地址并跳转回该地址。\n\
  \n\n\n\n旧的 `run` 方法会一直运行到程序结束。新的 `run` 方法必然更加复杂。虚拟机初始处于 `STEPPING` 状态（因为如果我们在 `RUNNING`\
  \ 状态下启动它，我们将永远没有机会与它交互来改变它的状态）。只要程序未结束，我们就像往常一样获取、解码并执行下一条指令，但如果是单步执行模式，我们会在执行每一条后停止：\n\
  \n```python\n def run(self):\n    self.state = VMState.STEPPING\n    while True:\n\
  \        if self.state == VMState.STEPPING:\n            self.interact(self.ip)\n\
  \        if self.state == VMState.FINISHED:\n            break\n        instruction\
  \ = self.ram[self.ip]\n        self.ip += 1\n        op, arg0, arg1 = self.decode(instruction)\n\
  \        self.execute(op, arg0, arg1)\n```\n\n`interact` 方法需要处理几种情况：\n\n1. 用户输入了一个空行（即按了回车键），在这种情况下它会循环并等待其他输入。\n\
  2. 用户请求反汇编当前指令或显示内存内容，在这种情况下它会执行该操作并循环。\n3. 用户想要退出，因此 `interact` 将虚拟机的状态更改为 `FINISHED`。\n\
  4. 用户想要运行程序的剩余部分而不停止，因此 `interact` 将虚拟机的状态更改为 `RUNNING`。\n5. 用户想要执行单步，在这种情况下该方法将跳出循环而不改变虚拟机的状态。随后\
  \ `run` 将会发现虚拟机仍然处于单步执行模式，并执行单条指令。\n\n反汇编指令以向我们展示即将执行的操作的方法会检查一个`反向查找表`，以创建指令及其操作数的可打印表示：\n\
  \n```python\n def disassemble(self, addr, instruction):\n    op, arg0, arg1 = self.decode(instruction)\n\
  \    assert op in OPS_LOOKUP, f\"Unknown op code {op} at {addr}\"\n    return f\"\
  {OPS_LOOKUP[op]} | {arg0} | {arg1}\"\n```\n\n我们从 `architecture.py` 中的 `OPS` 表构建反向查找表，以确保它始终与我们用于构建操作的表保持同步（图\
  \ 26.1）：\n\n```python\n OPS_LOOKUP = {value[\"code\"]: key for key, value in OPS.items()}\n\
  ```\n\n![](img/fig26_1.jpg)\n\n图 26.1： 构建一致的查找表。\n\n如果我们自己编写反向查找表，很快就会会在更新正向查找表时忘记更新它。\n\
  \n但这个新虚拟虚拟机中还有一个更重要的变化。它没有使用 Python 内置的 `input` 函数获取用户输入——或者说，它使用了，但仅在默认情况下。我们单步执行虚拟机的构造函数是：\n\
  \n```python\n def __init__(self, reader=input, writer=sys.stdout):\n    super().__init__(writer)\n\
  \    self.reader = reader\n```\n\n它的 `read` 方法是：\n\n```python\n def read(self, prompt):\n\
  \    return self.reader(prompt).strip()\n```\n\n与上一节引入的 `write` 方法一样，添加这个包装方法将有助于我们进行测试，这是我们的下一个话题。\n\
  \n## 26.2 测试\n\n我们的调试器是一个交互式应用程序，它等待用户输入，执行某些可能打印或不打印输出的操作，然后再次等待。这种等待对于 `pytest`³\
  \ 这样的工具来说是个问题，它们期望测试的函数在启动后运行完成。\n\n为了让我们的单步执行虚拟机可测试，我们必须在它需要输入时提供输入，并捕获其输出。我们在测试第\
  \ 21 章 的服务器和第 24 章 的编辑器时遇到过类似的问题：我们将用模拟对象来替换 `input` 和 `print`。\n\n如之前，我们的虚拟机使用一个具有\
  \ `write` 方法的对象产生输出。我们可以定义一个 `Writer` 类，该方法将消息保存在列表中供后续检查，而不是打印：\n\n```python\n\
  class Writer:\n    def __init__(self):\n        self.seen = []\n\n    def write(self,\
  \ *args):\n        self.seen.extend(args)\n```\n\n同样，我们的虚拟机从一个接受 `prompt` 参数的函数获取输入。我们可以定义一个\
  \ `Reader` 类，其 `__call__` 方法像函数一样，但从列表中返回字符串而不是等待用户：\n\n```python\nclass Reader:\n\
  \    def __init__(self, *args):\n        self.commands = args\n        self.index\
  \ = 0\n\n    def __call__(self, prompt):\n        assert self.index < len(self.commands)\n\
  \        self.index += 1\n        return self.commands[self.index - 1]\n```\n\n\
  有了这些工具，我们可以写一个辅助函数 `execute`，它编译程序、创建虚拟机并使用模拟 reader 和 writer 运行：\n\n```python\n\
  \ def execute(source, reader, writer):\n    program = Assembler().assemble(source.split(\"\
  \\n\"), False)\n    vm = VM(reader, writer)\n    vm.initialize(program)\n    vm.run()\n\
  ```\n\n我们现在可以写测试了，比如针对 `disassemble` 命令的：\n\n```python\n def test_disassemble():\n\
  \    source = \"\"\"\n    hlt\n    \"\"\"\n    reader = Reader(\"d\", \"q\")\n \
  \   writer = Writer()\n    execute(source, reader, writer)\n    assert writer.seen\
  \ == [\"hlt | 0\\n\"]\n```\n\n逐行来看：\n1. 创建要测试的程序（在这里由单条 `hlt` 指令组成）。\n2. 创建一个 `Reader`\
  \ 按顺序提供 `d`（反汇编）和 `q`（退出）命令。\n3. 创建一个 `Writer` 来捕获程序的输出。\n4. 使用该 `reader` 和 `writer`\
  \ 在新的 `VM` 中运行程序。\n5. 检查 `writer` 中捕获的输出是否正确。\n\n为一个单行程序定义两个类和一个辅助函数似乎工作量很大，但并不是在测试单行程序或\
  \ `VM`——我们是在测试调试器。例如：\n\n1. 定义一个多行字符串，将 `55` 加载到 `R0`，打印，然后在停止前加载 `65` 到同一个寄存器。\n\
  2. 创建一个 `Reader` 发布三个 `s`（单步）命令和一个 `q`（退出）命令。注意，这不足以到达第二个 `print` 命令。\n3. 执行程序。\n\
  4. 检查 `Writer` 只有一行输出而不是两行。\n\n```python\n def test_print_two_values():\n    source\
  \ = \"\"\"\n    ldc R0 55\n    prr R0\n    ldc R0 65\n    prr R0\n    hlt\n    \"\
  \"\"\n    reader = Reader(\"s\", \"s\", \"s\", \"q\")\n    writer = Writer()\n \
  \   execute(source, reader, writer)\n    assert writer.seen == [\"000037\\n\"]\n\
  ```\n\n这个测试实际上发现了调试器早期版本中的一个 bug，在指示退出时它总是多执行一条指令。交互式测试可能会发现这一点，但它很容易再次出现；如果出现，这个测试会警告我们。\n\
  \n我们的 `Reader` 和 `Writer` 对于测试 `VM` 之外没有用，但其他工具可以为更广泛的应用程序模拟输入输出。`Expect`⁴（可以通过\
  \ Python 的 `pexpect`⁵ 模块使用）经常用于命令行应用程序脚本以及测试它们。`Selenium`⁶ 和 `Cypress`⁷ 对基于浏览器的应用程序执行相同：程序员可以使用它们来模拟鼠标点击、窗口调整大小和其他事件，然后检查应用程序生成的页面内容。它们在设置和使用上都比简单的\
  \ `1+1` 等于 `2` 的测试困难，但那是它们做的事情确实复杂。在考虑测试的情况下设计应用程序（例如，将所有输入和输出路由到单个方法）有助于减少这种复杂性。\n\
  \n## 26.3 可扩展性\n\n我们将为调试器添加另一个大功能，但在此之前，让我们进行一些重构。首先，我们将每个交互操作移动到它自己的方法中，该方法执行某些操作，如果调试器应该保持交互模式则返回\
  \ `True`，如果交互结束则返回 `False`。显示内存内容的方法是：\n\n\n\n\n\n```python\ndef _do_memory(self,\
  \ addr):\n    self.show()\n    return True\n```\n\n而前进一步步的操作是：\n\n```python\ndef\
  \ _do_step(self, addr):\n    self.state = VMState.STEPPING\n    return False\n```\n\
  \n以此此类推。一旦完成这些工作，我们就修改 `interact` 方法，从名为 `self.handlers` 的查找表中选择操作。它的键是用户输入的命令，值是我们恰恰创建的操作方法：\n\
  \n```python\ndef interact(self, addr):\n    prompt = \"\".join(sorted({key[0] for\
  \ key in self.handlers}))\n    interacting = True\n    while interacting:\n    \
  \    try:\n            command = self.read(f\"{addr:06x} [{prompt}]> \")\n     \
  \       if not command:\n                continue\n            elif command not\
  \ in self.handlers:\n                self.write(f\"Unknown command {command}\")\n\
  \            else:\n                interacting = self.handlerscommand\n       \
  \ except EOFError:\n            self.state = VMState.FINISHED\n            interacting\
  \ = False\n```\n\n最后，我们扩展虚拟机的构造函数来构建所需的查找表。为了方便起见，我们同时在单字母键和较长的命令名下注册这些方法：\n\n```python\n\
  def __init__(self, reader=input, writer=sys.stdout):\n    super().__init__(reader,\
  \ writer)\n    self.handlers = {\n        \"d\": self._do_disassemble,\n       \
  \ \"dis\": self._do_disassemble,\n        \"i\": self._do_ip,\n        \"ip\": self._do_ip,\n\
  \        \"m\": self._do_memory,\n        \"memory\": self._do_memory,\n       \
  \ \"q\": self._do_quit,\n        \"quit\": self._do_quit,\n        \"r\": self._do_run,\n\
  \        \"run\": self._do_run,\n        \"s\": self._do_step,\n        \"step\"\
  : self._do_step,\n    }\n```\n\n与之前的章节一样，创建这样一个查找表使得类变得更容易扩展。如果我们想添加另一个命令（我们将在下一节中执行这一点），只需添加一个执行操作的方法并将其注册到查找表中即可。只要新命令需要的除了当前指令地址之外的任何内容，我们就永远不需要再次修改\
  \ `interact`。\n\n## 26.4 断点\n\n假设我们怀疑程序中有一个错误，它在执行了数千行代码后才会出现。如果我们想单步执行所有这些代码，一次都会非常绝望，更不用说在探索新想法或尝试新修复时执行几十次了。相反，我们想要设置一个`breakpoint`（断点），告诉计算机在特定位置停止并允许我们进入调试器。我们甚至可能使用`conditional\
  \ breakpoint`（条件断点），它只会在例如变量 `x` 在该点为零时停止，但我们将把这个留给练习。\n\n实现断点最简单的方法是让虚拟机在一个集合（set）中存储它们的地址。然后我们修改\
  \ `run` 方法，使其在每次应该获取新指令时都检查该集合，如果处于其中一个地址，则停止（见图 26.2）。\n\n![](img/fig26_2.jpg)\n\
  \n图 26.2： 在程序旁边存储断点。\n\n另一种设计是在我们的架构中添加一个名为 `brk` 的新指令。当用户在某个地址处设置断点时，我们将该地址处的指令替换为断点指令，并将原始指令存储在查找表中。如果用户以后`clears`（清除）了断点，我们将原始指令复制回原位；如果虚拟机在运行时遇到断点指令，它将进入交互模式（见图\
  \ 26.3）。\n\n![](img/fig26_3.jpg)\n\n图 26.3： 在程序中插入断点。\n\n将断点内联存储比将它们存储在程序旁边要复杂得多，但这正是\
  \ C 等低级语言调试器的实际工作方式。它还让虚拟机更加高效：我们不再在每次执行指令时都花费几条（实际的）指令来检查断点表，只有在实际上遇到断点时才付出代价。这种差异对于我们的玩具程序并不重要，但在像\
  \ Python 或 JavaScript 这样语言的真实解释器中，这种微小的节省将会积少成多。\n\n实现断点的第一步是在我们在上一节中创建的查找表中添加两个命令：\n\
  \n```python\ndef __init__(self):\n    super().__init__()\n    self.breaks = {}\n\
  \    self.handlers |= {\n        \"b\": self._do_add_breakpoint,\n        \"break\"\
  : self._do_add_breakpoint,\n        \"c\": self._do_clear_breakpoint,\n        \"\
  clear\": self._do_clear_breakpoint,\n    }\n```\n\n要添加断点，我们将给定地址处的指令复制到字典 `self.breaks`\
  \ 中，并将其替换为断点指令：\n\n```python\ndef _do_add_breakpoint(self, addr):\n    if self.ram[addr]\
  \ == OPS[\"brk\"][\"code\"]:\n        return True\n    self.breaks[addr] = self.ram[addr]\n\
  \    self.ram[addr] = OPS[\"brk\"][\"code\"]\n    return True\n```\n\n如果该地址处已经是断点，则我们什么都不做，并返回\
  \ `True` 告诉 `interact` 等待另一个命令。清除断点同样简单：\n\n```python\ndef _do_clear_breakpoint(self,\
  \ addr):\n    if self.ram[addr] != OPS[\"brk\"][\"code\"]:\n        return True\n\
  \    self.ram[addr] = self.breaks[addr]\n    del self.breaks[addr]\n    return True\n\
  ```\n\n我们还更新 `show` 方法以显示任何已的断点：\n\n```python\ndef show(self):\n    super().show()\n\
  \    if self.breaks:\n        self.write(\"-\" * 6)\n        for key, instruction\
  \ in self.breaks.items():\n            self.write(f\"{key:06x}: {self.disassemble(key)}\"\
  )\n```\n\n最后一步是修改 `run` 使虚拟机在断点处停止：\n\n```python\ndef run(self):\n    self.state\
  \ = VMState.STEPPING\n    while self.state != VMState.FINISHED:\n        instruction\
  \ = self.ram[self.ip]\n        op, arg0, arg1 = self.decode(instruction)\n\n   \
  \     if op == OPS[\"brk\"][\"code\"]:\n            original = self.breaks[self.ip]\n\
  \            op, arg0, arg1 = self.decode(original)\n            self.interact(self.ip)\n\
  \            self.ip += 1\n            self.execute(op, arg0, arg1)\n\n        else:\n\
  \            if self.state == VMState.STEPPING:\n                self.interact(self.ip)\n\
  \            self.ip += 1\n            self.execute(op, arg0, arg1)\n```\n\n这里的逻辑相对直接。如果指令是断点，虚拟机使用查找表中的原始指令，然后在执行该原始指令之前给用户交互的机会。否则，如果处于单步执行模式，虚拟机将与用户交互并像以前一样继续。\n\
  \n我们可以使用在本章早期开发的工具测试我们改进后的虚拟机，但在在此之前，对 `run` 的修改告诉我们应该重新考虑某些设计。为交互命令使用查找表允许我们在不修改\
  \ `interact` 的情况下添加命令；另一个查找表允许我们在无需修改 `run` 的情况下添加新指令。我们将在练习中探讨这一点。\n\n## 26.5 总结\n\
  \n图 26.4 总结了本章的核心思想。\n\n![](img/fig26_4.jpg)\n\n图 26.4： 调试器概念。\n\n## 26.6 练习\n\n\
  ### 显示范围\n\n修改调试器，如果用户向 `memory` 命令提供单个地址，调试器显示该地址处的值。另一方面，如果用户提供两个地址，调试器显示这两个地址之间的所有内存。\n\
  \n1. 这是如何改变命令查找和执行方式的？\n2. 你的解决方案是否足够通用，可以处理未来的变化而无需重写？\n\n### 断点地址\n\n\n\n\n\n\
  修改调试器，使得用户向 `break` 或 `clear` 命令提供单个地址时，调试器会在该地址设置或清除断点。此功能是否需要在使用上一个练习所做的更改之外进行任何修改？\n\
  \n### 命令补全\n\n修改调试器，使其能够根据任意数量的特定开头字符识别命令。例如，`m`、`me`、`mem` 等任何一个输入都应该触发 `do_memory`\
  \ 方法。程序员 `不` 应该亲自指定所有这些选项；相反，他们应该能够指定完整的命令名称及其对应的方法，并由 VM 的构造函数处理其余其余工作。\n\n###\
  \ 条件断点\n\n修改调试器，使用户可以为断点指定条件，例如，可以指定 VM 仅当 `R0` 包含零或内存中特定位置的值大于 3 时才在某处停止。（这个练习可能非常大；你可以通过限制用户可以设置的条件类型来使问题更易处理，或者探索使用\
  \ `eval` 来支持通用情况的方法。）\n\n### 监视点\n\n修改调试器和 VM，使用户可以创建 `watchpoints`（监视点），即可以指定当特定地址的值发生变化时，调试器应停止\
  \ VM。例如，如果用户为地址 `0x0010` 指定了监视点，那么每当该位置存储一个新值时，VM 就会自动停止。\n\n### 指令查找\n\n修改虚拟机，使得\
  \ `execute` 以与调试器命令相同的方式在表中查找指令。\n\n### 修改内存\n\n修改调试器，使用户在程序运行时可以更改寄存器或内存中特定地址的值。\n\
  \n### 显示源码\n\n1. 修改调试器，使得当调试器显示内存时，它能显示特定地址对应的汇编指令以及相应的数值代码。\n2. 调试器如何区分包含指令的位置和包含数据的位置？\n\
  \n### 交替测试\n\n修改本章开发的测试工具，使用户可以按照自然发生的方式指定输入和输出，即：可以指定一个或多个命令，然后是这些命令的预期输出，接着是更多的输入和相应的输出，以此此类推。\n\
  \n### 测试中的模式匹配\n\n1. 像 `Expect` 这样的工具允许程序员使用正则表达式匹配输出。修改本章开发的测试工具以也实现这一功能。\n2. 这在什么时候有用？在什么时候可能存在危险？\n\
