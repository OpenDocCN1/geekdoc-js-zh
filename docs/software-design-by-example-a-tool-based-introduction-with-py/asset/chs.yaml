  \ -f 10 $filename\ndone\n```\n\n数据文件和程序输出显示如下：\n\n```yaml\n- name: read\n  params:\n\
  \  - sample_data.csv\n```\n\n```\nalpha\nbeta\ngamma\ndelta\n```\n\n\n\n\n\n本书的源代码可以在我们的\
