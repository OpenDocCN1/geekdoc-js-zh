  \ 1\n\ndef test_sign_zero():\n    assert sign(0) == 0\n\ndef test_sign_error():\n\
  \    assert sgn(1) == 1\n``` (注：原文此处可能误为 `sgn` 应为 `sign`，但翻译保持原文或根据逻辑理解，此处按原文 `sgn`\
  \ 保持)\n\n这里，我发现原文中 `sgn(1)` 可能是 `sign(1)` 的笔误，但根据指令不翻译代码块。\n\n(纠正：原文 `test_sign_error`\
  \ 内部是 `assert sgn(1) == 1`，我将原样输出代码块)\n\n这里，我发现原文中 `test_sign_error` 内部是 `assert\
  \ sgn(1) == 1` 可能是 `sign(1)` 的笔误，但根据指令不翻译代码块。\n\n(纠正：原文 `test_sign_error` 内部是 `assert\
  \ sgn(1) == 1`，我将原样输出代码块)\n\n这里，我发现原文中 `test_sign_error` 内部是 `assert sgn(1) == 1`\
  \ 可能是 `sign(1)` 的笔误，但根据指令不翻译代码块。\n\n(纠正：原文 `test_sign_error` 内部是 `assert sgn(1)\
  \ == 1` 可能是 `sign(1)` 的笔误，但根据指令不翻译代码块)\n\n这里，我发现原文中 `test_sign_error` 内部是 `assert\
  \ sgn(1) == 1` 可能是 `sign(1)` 的笔误，但根据指令不翻译代码块。\n\n(此处直接进入正文翻译)\n\n现在假设我们有一个想要测试的函数：\n\
  \n（代码块略）\n\n以及一些测试它的函数（其中两个包含错误）：\n\n（代码块略）\n\n这种分类方案如下：\n\n1. 如果函数没有抛出任何异常，则测试通过。\n\
  2. 如果函数抛出 `AssertionError`，则测试失败。\n3. 如果函数抛出任何其他异常，则认为发生错误。\n\n我们将这些规则转化为代码，得到了\
  \ `run_tests`，它统计每种结果：\n\n```python\n def run_tests(all_tests):\n    results = {\"\
  pass\": 0, \"fail\": 0, \"error\": 0}\n    for test in all_tests:\n        try:\n\
  \            test()\n            results[\"pass\"] += 1\n        except AssertionError:\n\
  \            results[\"fail\"] += 1\n        except Exception:\n            results[\"\
  error\"] += 1\n    print(f\"pass {results['pass']}\")\n    print(f\"fail {results['fail']}\"\
  )\n    print(f\"error {results['error']}\")\n```\n\n我们通过将所有的测试函数放入列表并传递给测试运行器来使用它：\n\
  \n```python\n TESTS = [\n    test_sign_negative,\n    test_sign_positive,\n    test_sign_zero,\n\
  \    test_sign_error\n]\n\nrun_tests(TESTS)\n```\n\n```\npass 2\nfail 1\nerror 1\n\
  ```\n\n## 6.2 查找函数\n\n创建列表很容易出错：我们很快就会两次向 `TESTS` 添加函数或忘记添加。因此我们希望测试运行器自己发现测试，可以通过利用\
  \ Python 将变量存储在类似于的结构来实现。\n\n让我们运行解释器并调用 `globals` 函数。为了让输出更易读，我们将使用 Python 的 `pprint`³\
  \ 模块进行漂亮打印：\n\n```python\n import pprint\npprint.pprint(globals())\n```\n\n```python\n\
  \ {'__annotations__': {},\n  '__builtins__': <module 'builtins' (built-in)>,\n \
  \ '__cache__': None,\n  '__doc__': None,\n  '__file__': '/sdx/test/globals.py',\n\
  \  '__loader__': <_frozen_importlib_external.SourceFile object \\\nat 0x10d65290>,\n\
  \  '__name__': '__main__',\n  '__package__': None,\n  '__spec__': None,\n  'pprint':\
  \ <module 'pprint' from \\\n'/sdx/conda/envs/sdxpy/lib/python3.11/pprint.py'>}\n\
  ```\n\n输出显示，`globals` 是包含程序全局作用范围内所有变量的字典。由于我们刚刚启动解释器，看到的都是 Python 自动定义的变量。（按照约定，Python\
  \ 使用双下划线表示特殊含义的名称。）\n\n当我们定义自己的变量时会发生什么？\n\n```python\n import pprint\nmy_variable\
  \ = 123\npprint.pprint(globals())\n```\n\n\n\n\n\n```python\n {'__annotations__':\
  \ {},\n  '__builtins__': <module 'builtins' (built-in)>,\n  '__cached__': None,\n\
  \  '__doc__': None,\n  '__file__': '/sdx/test/globals_plus.py',\n  '__loader__':\
  \ <_frozen_importlib_external.SourceFileLoader object \\\nat 0x108039290>,\n  '__name__':\
  \ '__main__',\n  '__package__': None,\n  '__spec__': None,\n  'my_variable': 123,\n\
  \  'pprint': <module 'pprint' from \\\n'/sdx/conda/envs/sdxpy/lib/python3.11/pprint.py'>}\n\
  ```\n\n果真，`my_variable` 现在已经在字典中了。\n\n如果函数名只是变量，而程序的变量存储在字典中，我们可以遍历这个字典来找到所有以 `test_`\
  \ 开头的函数：\n\n```python\n def find_tests(prefix):\n    for (name, func) in globals().items():\n\
  \        if name.startswith(prefix):\n            print(name, func)\n\nfind_tests(\"\
  test_\")\n```\n\n```python\n test_sign_negative <function test_sign_negative at\
  \ 0x105bcd440>\ntest_sign_positive <function test_sign_positive at 0x105bcd4e0>\n\
  test_sign_zero <function test_sign_zero at 0x105bcd580>\ntest_sign_error <function\
  \ test_sign_error at 0x105bcd620>\n```\n\n输出中的十六进制数字显示了每个函数对象在内存中的位置，除非我们正在扩展语言，否则这并没有特别用，但至少它不占用太多屏幕空间。\n\
  \n让运行中的程序像这样自己查找自己被称为**自省**（introspection），它是后续章节中许多设计的关键。将自省与上一节的“通过-失败-错误”模式相结合，我们得到了一个寻找测试函数、运行它们并总结结果的工具：\n\
  \n```python\n def run_tests():\n    results = {\"pass\": 0, \"fail\": 0, \"error\"\
  : 0}\n    for (name, test) in globals().items():\n        if not name.startswith(\"\
  test_\"):\n            continue\n        try:\n            test()\n            results[\"\
  pass\"] += 1\n        except AssertionError:\n            results[\"fail\"] += 1\n\
  \        except Exception:\n            results[\"error\"] += 1\n    print(f\"pass\
  \ {results['pass']}\")\n    print(f\"fail {results['fail']}\")\n    print(f\"error\
  \ {results['error']}\")\n```\n\n```\n pass 2\nfail 1\nerror 1\n```\n\n我们可以向此添加许多更多功能（`pytest`⁴\
  \ 确实是这样），但几乎每个现代测试运行器都使用了这种设计。\n\n## 6.3 总结\n\n在回顾本章介绍的概念（图 6.2）时，值得记住克克的第三定律⁵，该定律指出：任何足够先进的技术与魔法没有区别。像自省这样的编程技巧也是如此：能够动态查找测试的代码对于理解“代码即数据”专家来说是透明的，但对于初学者来说可能是不可理解的。正如我们在第\
  \ 1 章讨论理解曲线时提到的，没有任何软件能兼顾这两类受众；解决问题的唯一办法是教育，这就是为什么会有这类书籍。请参附录 B 获取与这些概念相关的额外材料。\n\
  \n![](img/fig6_2.jpg)\n\n图 6.2： 概念图。\n\n## 6.4 练习\n\n### 遍历 globals\n\n运行这段代码会发生什么？\n\
  \n```python\n for name in globals():\n    print(name)\n```\n\n如果运行这段代码会发生什么？\n\n\
  ```python\n name = None\nfor name in globals():\n    print(name)\n```\n\n为什么这两者不同？\n\
  \n### 个别结果\n\n1. 修改框架以报告哪些测试通过、失败或出现错误。\n2. 编写单元测试来检查它是否正常工作。\n\n### 设置与拆卸\n\n测试框架通常允许在每个测试之前运行\
  \ `setup` 并在之后 `teardown` 进行清理。\n\n1. 修改框架，使 `setup` 只运行一次。\n2. 添加一个类似的 `teardown`\
  \ 函数。\n\n### 测试耗时\n\n修改工具，使其记录所花费的时间。\n\n### 选择测试\n\n修改工具，如果用户提供一个字符串，它将选择测试。\n\n\
  ### 查找函数\n\nPython 是动态类型语言，这意味着它在运行时检查类型。\n\n1. 检查结果是否为内置内容。\n2. 使用该函数进行操作。\n\n\
  ### 局部变量\n\nPython 有一个函数可以返回在当前作用域内定义的所有变量。\n\n1. 预测代码将打印什么。\n2. 运行代码并对比你的预测。\n\n\
  # 7 解释器\n\n第 2 章 和第 6 章 引入了程序是数据的概念。**编译器**和**解释器**也是程序。编译器不是为了计算总和或在屏幕上绘制字符，而是将文本转换为解释器运行的指令。\n\
  \n大多数真实语言有两个部分：一个将源代码转换为数据结构的**解析器**，以及一个执行指令的**运行时**。第 5 章探讨了解析；本章将构建一个简单的解释器，而第\
  \ 25 章将研究如何 `compile` 代码以提高运行效率。\n\n## 7.1 表达式\n\n让我们从构建一个可以评估如 1+2 或 `abs(-3.5)`\
  \ 等简单**表达式**开始。我们将每个表达式表示为一个列表，第一个项是操作名称，其他项是要操作的值。如果有多个操作，我们使用嵌套列表：\n\n```\n [\"\
  add\", 1, 2] # 1 + 2\n[\"abs\", -3.5] # abs(-3.5)\n[\"add\", [\"abs\", -5], 9] #\
  \ abs(-5) + 9\n```\n\n相加两个的函数如下：\n\n```python\n def do_add(args):\n  _assert len(args)\
  \ == 2\n  left = do(args[0])\n  right = do(args[1])\n  return left + right\n```\n\
  \n它的唯一参数是一个包含两个待评估并相加子表达式的列表。在检查该列表包含所需的数值后，它调用一个尚未编写的函数 `do` 来评估这些子表达式。（我们把函数命名为\
  \ `do` 而不是 `eval` 是因为 Python 已经有一个名为 `eval` 的函数了。）一旦 `do_add` 获得了两个数值，它们就会相加并返回结果。\n\
  \ndo_abs 以相同的方式实现值。唯一的区别在于它期望一个值而不是两个，并且计算不同的返回值：\n\n```python\n def do_abs(args):\n\
    assert len(args) == 1\n  val = do(args[0])\n  return abs(val)\n```\n\n\n\n\n\n\
  注意 `do_abs` 和 `do_add` 具有相同的签名。与 第 6 章 中的单元测试函数一样，这允许我们交替地调用它们。\n\n那么 `do` 是如何工作的呢？它首先检查输入是否为整数。如果是，它会立即返回该值，因为整数“求值”的结果本身。否则，`do`\
  \ 会检查其参数是否为列表，然后使用列表中的第一个值来决定调用哪个函数。\n\n```python\n def do(expr):\n    # 整数求值为其本身。\n\
  \    if isinstance(expr, int):\n        return expr\n\n    # 列表触发函数调用。\n    assert\
  \ isinstance(expr, list)\n    if expr[0] == \"abs\":\n        return do_abs(expr[1:])\n\
  \    if expr[0] == \"add\":\n        return do_add(expr[1:])\n    assert False,\
  \ f\"Unknown operation {expr[0]}\"\n```\n\n这种查找并调用的过程被称为**动态调度**（dynamic dispatch），因为程序在运行时决定将工作交给谁。这导致了这样的情况：`do`\
  \ 调用了像 `do_add` 这样的函数，该函数反过来调用 `do`，而 `do` 可能会调用 `do_add`（或其他函数），依此类推（图 7.1）。函数直接或间接调用自己被称为递归，递归以难以理解闻名。但正如我们的解释器所示，它是解决广泛问题的自然方式：每个递归步骤处理整个问题的较小部分，直到我们遇到整数或某些不需要进一步处理的值。\n\
  \n![](img/fig7_1.jpg)\n\n图 7.1： 递归求值表达式 [‘abs’,[‘add’,1,2]]。\n\n在所有代码就绪后，程序的主体可以读取包含执行指令的文件，调用\
  \ `do` 并打印结果：\n\n```python\n def main():\n    assert len(sys.argv) == 2, \"Usage:\
  \ expr.py filename\"\n    with open(sys.argv[1], \"r\") as reader:\n        program\
  \ = json.load(reader)\n    result = do(program)\n    print(f\"=> {result}\")\n\n\
  if __name__ == \"__main__\":\n    main()\n```\n\n我们想要解释的程序是一个嵌套列表的列表，因此我们可以使用 `json.load`\
  \ 将其读取为 JSON，而不是编写我们自己的解析器。例如，如果我们的程序文件包含：\n\n```\n [\"add\", [\"abs\", -3], 2]\n\
  ```\n\n那么我们的小解释器将打印：\n\n```\n => 5\n```\n\n为了实现 Python 已经具备的功能，这需要大量的代码，但它展示了 Python（以及其他语言）内部是如何运行的。当我们运行：\n\
  \n```bash\n python expr.py expr.tll\n```\n\nPython 读取 `expr.py`，将其转换为一个包含操作标识符和常数的数据结构，并使用这些操作标识符来决定调用哪些函数。Python\
  \ 内部的函数是用 C 编写的并编译为机器指令，但查找和调用的循环与我们的小解释器是完全相同的。\n\n## 7.2 变量\n\n对常量进行算术运算是一个开始，但如果我们能定义变量来为值命名，我们的程序将更易读。我们可以通过传递一个包含目前为止看到的所有变量的字典为我们的解释器添加变量。这种字典有时被称为**环境**（environment），因为它是表达式求值的设置；第\
  \ 6 章中引入的 `globals` 和 `locals` 函数返回的字典都是环境。\n\n让我们修改 `do_add`、`do_abs`、`do` 和 `main`，使其接受环境作为额外参数并在需要时传递它：\n\
  \n```python\n def do_abs(env, args):\n    assert len(args) == 1\n    val = do(env,\
  \ args[0])\n    return abs(val)\n```\n\n在需要值时查找变量是直接的。我们检查是否有一个变量名以及该名是否在环境中，然后返回存储的值：\n\
  \n```python\n def do_get(env, args):\n    assert len(args) == 1\n    assert isinstance(args[0],\
  \ str)\n    assert args[0] in env, f\"Unknown variable {args[0]}\"\n    return env[args[0]]\n\
  ```\n\n要定义新变量或更改现有变量，我们对表达式进行求值并值存储在环境中：\n\n```python\n def do_set(env, args):\n\
  \    assert len(args) == 2\n    assert isinstance(args[0], str)\n    value = do(env,\
  \ args[1])\n    env[args[0]] = value\n    return value\n```\n\n我们需要再添加一个函数来使之工作。我们的程序不再由单个表达式组成；相反，我们可能有多个设置变量并使用它们的表达式。为了处理这种情况，我们添加了一个\
  \ `do_seq` 函数，它按顺序执行一个表达式序列。这个函数是我们的第一个**控制流**（control flow）：它不是计算一个值，而是控制表达式何时以及如何被求值。它的实现如下：\n\
  \n```python\n def do_seq(env, args):\n    assert len(args) > 0\n    for item in\
  \ args:\n        result = do(env, item)\n    return result\n```\n\n让我们试一下。我们的测试程序是：\n\
  \n```\n [\n    \"seq\",\n    [\"set\", \"alpha\", 1],\n    [\"set\", \"beta\", 2],\n\
  \    [\"get\", \"alpha\"]\n ]\n```\n\n```\n => 1\n```\n\n## 7.3 反省\n\n现在我们有了求值、函数查找和环境，我们可以编写小程序。然而，我们的\
  \ `do` 函数现在看起来是：\n\n```python\n def do(env, expr):\n    if isinstance(expr, int):\n\
  \        return expr\n\n    assert isinstance(expr, list)\n    if expr[0] == \"\
  abs\":\n        return do_abs(env, expr[1:])\n    if expr[0] == \"add\":\n     \
  \   return do_add(env, expr[1:])\n    if expr[0] == \"get\":\n        return do_get(env,\
  \ expr[1:])\n    if expr[0] == \"seq\":\n        return do_seq(env, expr[1:])\n\
  \    if expr[0] == \"set\":\n        return do_set(env, expr[1:])\n    assert False,\
  \ f\"Unknown operation {expr[0]}\"\n```\n\n决定调用哪个函数的 if 语句序列变得臃肿。（快速思考：你能看到任何操作名称重复了吗？）我们可以通过使用**反省**（introspection）创建一个表，存储所有以\
  \ `do_` 开头的函数（图 7.2）：\n\n```python\n OPS = {\n    name.replace(\"do_\", \"\"): func\n\
  \    for (name, func) in globals().items()\n    if name.startswith(\"do_\")\n}\n\
  ```\n\n![](img/fig7_2.jpg)\n\n图 7.2： 动态生成的函数查找表。\n\n逐行解释：\n\n1. 我们使用字典推导式在一个语句中创建字典。\n\
  2. 我们只添加名称以 `do_` 开头的函数。\n3. 字典中的每个键值对都是操作名称和实现该操作的函数。操作名称是函数名中 `do_` 之后。\n\n有了这个表，选择并运行操作的代码为：\n\
  \n```python\n def do(env, expr):\n    # 整数求值为其本身。\n    if isinstance(expr, int):\n\
  \        return expr\n\n    # 列表触发函数调用。\n    assert isinstance(expr, list)\n   \
  \ assert expr[0] in OPS, f\"Unknown operation {expr[0]}\"\n    func = OPS[expr[0]]\n\
  \    return func(env, expr[1:])\n```\n\n与第 6 章 中的单元测试函数一样，`do_*` 函数必须具有完全相同的签名，以便我们可以环境和参数列表调用任何一个，而不需要具体知道调用的是哪个函数。正如寻找测试一样，反省比手写的查找表更可靠，但更难理解。如果我们显式地写出查找表如下：\n\
  \n```python\n OPS = {\n    \"abs\": do_abs,\n    \"add\": do_add,\n    \"get\":\
  \ do_get,\n    \"seq\": do_seq,\n    \"set\": do_set,\n}\n```\n\n那么我们就可以看到哪些可用操作以及它们的名称是什么。如果我们使用反省，我们必须搜索源文件（可能是多个文件）来找到所有可用操作，但我们可以写一次\
  \ do 然后再也不用担心了。\n\n## 7.4 总结\n\n\n\n\n\n图 7.3 总结了本章介绍的思想。这里包含很多内容，但核心思想是：程序只是另一种类型的数据。请参阅附录\
