  \nHippocratic License 是一种伦理源许可⁴。\n\n# E 行为准则\n\n为了营造一个开放欢迎的环境，我们作为贡献者和维护者，承诺让每个人参与我们的项目和社区时都有不受骚扰的体验，无论年龄、体型、残障、种族、性别身份和表达、经验水平、教育程度、社会经济地位、国籍、个人形象、种族、宗教或性身份和倾向。\n\
  \n## E.1 我们的标准\n\n有助于营造积极环境的行为示例包括：\n\n- 使用欢迎和包容的语言，\n- 尊重不同的观点和经验，\n- 体面地接受建设性批评，\n\
  - 关注对社区最好的事情，以及\n- 对其他社区成员表现同理心。\n\n参与者不可接受的行为示例包括：\n\n- 使用性化语言或图像，以及不受欢迎的性关注或挑逗，\n\
  - 恶意攻击（trolling）、侮辱/贬低评论以及个人或政治攻击，\n- 公开或私下骚扰，\n- 未经明确许可发布他人的隐私信息（如物理或电子地址），\n以及\
  \ 其他在专业环境中可能被合理认为不恰当的行为。\n\n## E.2 我们的职责\n\n项目维护者负责明确可接受行为的标准，并预计在任何任何不可接受行为时采取适当且公平的纠正措施。\n\
  \n项目维护者有权也有责任删除、编辑或拒绝不符合本行为准则的注释、提交、代码、wiki 编辑、问题和其他贡献，或对任何被认为不恰当、具有威胁性、冒犯性或有害行为的贡献者进行临时或永久封禁。\n\
  \n## E.3 范围\n\n本行为准则既适用于项目空间，也适用于个人代表项目或社区的公共空间。代表项目或社区的示例包括使用官方项目电子邮件地址、通过官方社交媒体账户发布内容，或作为在线或线下活动中的委派代表。对项目的代表可能由项目维护者进一步定义和澄清。\n\
  \n## E.4 执行\n\n发生滥用、骚扰或其他不可接受行为的情况可以通过电子邮件向项目团队进行报告。所有投诉都将经过审查和调查，并根据情况给出认为必要且适当的回应。项目团队有义务对事件报告者进行保密。特定执行政策的更多细节可能会另行发布。\n\
  \n未诚实遵守或执行本行为准则的项目维护者可能会面临由项目领导其他成员决定的临时或永久后果。\n\n## E.5 归属\n\n本行为准则改编自贡献者公约（Contributor\
  \ Covenant）¹ 版本 1.4。\n\n# F 贡献\n\n非常欢迎贡献；请通过电子邮件或在此网站提交问题（issue）与我们联系。所有贡献者必须遵守我们的行为准则。\n\
  \n## F.1 编辑内容\n\n1. 在 [`github.com/gvwilson/sdxpy`](https://github.com)¹ 处克隆 GitHub\
  \ 仓库。\n2. 创建一个新的 Python 虚拟环境。\n3. `pip install -r lib/mccole/requirements.txt`。\n\
  4. `pip install -r ./requirements.txt`。\n5. `make` 将显示可用命令列表。\n6. `make build` 从\
  \ Markdown 重新生成 HTML。\n    - 生成的 HTML 可以在 `./docs` 中找到。\n    - 你必须安装 `draw.io`²\
  \ 并将其置于路径中，以便重新生成图表。\n7. `make serve` 重新生成 HTML 本地预览。\n    - 预览地址为 [`localhost:4000/`](http://localhost:4000/)。\n\
  \    - `Ark`³ 会在 Markdown 文件被编辑和保存时重新生成 HTML。\n8. 要更改代码示例及其输出：\n    1. `cd src/chapter`。\n\
  \    2. 编辑你想修改的 Python 文件。\n    3. 在目录下运行 `make`。\n\n请查看 GitHub 仓库⁴ 目录下的 `CONTRIBUTING.md`\
  \ 获取完整说明。\n\n## F.2 决策制定\n\n本项目使用 Martha 规则（Martha's Rules）⁵ 进行共识决策：\n\n1. 在每次会议之前，任何人都可以通过在\
  \ GitHub 中提交标记为“comm-proposal”的 issue 来发起提案。人们必须在会议前 24 小时提交提案，以便在会议上考虑，且必须包含：\n\
  \    - 一行摘要（issue 的主题）\n    - 提案的全文\n    - 任何必要的背景信息\n    - 优点和缺点\n    - 可能的替代方案\n\
  2. 如果半数或以上的投票成员出席，则会议达到法定人数。\n3. 一旦有人发起了提案，他们就负责该提案。除非发起者或其代表在，否则小组不得讨论或投票该问题。发起者还负责向小组展示提案。\n\
  4. 在发起者展示提案后，在任何讨论之前进行“感觉”投票：\n    - 谁喜欢这个提案？\n    - 谁可以接受这个提案？\n    - 谁对这个提案感到不安？\n\
  5. 如果大家都喜欢或可以接受，则提案立即通过。\n6. 如果大多数人对提案感到不安，则将其推迟由发起者重新修改。\n7. 否则，感到不安的成员可以简要说明他们的反对意见。随后设置计时器，由协调员主持简短讨论。10\
  \ 分钟后或在没有进一步意见时（以较者为准），协调员对“我们是否应该在存在上述反对的情况下实施这一决策？”进行是否投票。\n\n## F.3 常见问题解答\n\n\
  ### 为什么这本书在线免费阅读？\n\n\n\n\n因为只有极少数的技术书籍能赚到足够的钱来补偿创建它们所需的时间成本，而且我更愿意能够纠正错误，而不是让人们盗版过时的\
  \ PDF。\n\n### 为什么版税要捐给慈善？\n\n红门避难所（Red Door Family Shelter⁶中自顶向下方法的构建系统。\n\n* 一个使用了了\
  \ [Zeller2023] 中某些思想的模糊测试器。\n\n* 一个包安装器，用于补充第 20 章中的包管理器。\n\n* 一个像 `zip` 的文件压缩工具。\n\
  \n* 一个使用 `B-trees` 而不是日志进行存储的数据库。\n\n### 为什么要构建自己的生产流水线？\n\n我曾用 `GitBook`⁹、`Quarto`¹⁰、`Jupyter\
  \ Book`¹¹ 以及其他工具编写或编辑书籍，发现它们比帮助更令人沮丧。例如，书中的代码样本通常只显示类中的一或两个方法，而不是整个类；对于基于计算笔记本的工具来说，没有简单的方法可以实现这一点。尽管如此，我确定那些系统的作者也会觉得这本书的工具像我发现它们的工具一样令人沮丧。\n\
  \n# 术语表\n\n**绝对误差 (absolute error)**:\n\n观测值与正确值之间差值的绝对值。绝对误差通常没有`相对误差 (relative\
  \ error)` 有用。\n\n**抽象基类 (abstract base class)**:\n\n目标 `class` 派生的 `abstract class`。\n\
  \n**抽象类 (abstract class)**:\n\n一种定义或要求未实现方法的类。抽象类通常指定了`子类` 必须具备的方法，但不提供默认实现。另另：`具体类\
  \ (concrete class)`。\n\n**抽象方法 (abstract method)**:\n\n在`面向对象编程`中，定义但未实现的`方法`。程序员会在`父类`中定义抽象方法，以指定`子类`\
  \ 必须提供的操作。\n\n**抽象语法树 (AST)**:\n\n一种深度嵌套的数据结构（或`树`），用于表示程序的结构。例如，AST 可能会有一个表示 `while`\
  \ 循环的`节点`，其中一个`子节点`表示循环条件，另一个表示循环体。\n\n**偶然复杂度 (accidental complexity)**:\n\n由于糟糕的符号、糟糕的工具、不清晰的问题描述或干扰等为问题增加的额外难度。该术语与内在复杂度\
  \ (intrinsic complexity)` 相对使用。\n\n**累加器 (accumulator)**:\n\n一个收集和/或组合多个值的变量。例如，如果一个程序通过将数组中的所有值加到一个名为\
  \ `result` 的变量来求和，那么 `result` 就是累加器。\n\n**实际结果 (actual result (of test))**:\n\n\
  在测试中运行代码生成的值。如果它匹配`预期结果 (expected result)`，则测试`通过`；如果两者不同，则测试`失败`。\n\n**示能性 (affordance)**:\n\
  \n一个物体可以执行的操作：例如，门可以打开，文档可以打印。良好的用户界面让示能性易于发现。\n\n**别名 (alias)**:\n\n对同一对象的第二次或后续引用。别名很有用，但增加了读者的认知负担，因为他们必须记住这些这些都指向同一个事物。\n\
  \n**匿名函数 (anonymous function)**:\n\n没有名字的函数。JavaScript 等语言频繁使用匿名函数；Python 提供了一种称为\
  \ `lambda expression` 的有限形式。\n\n**ANSI 编码 (ANSI character encoding)**:\n\n`ASCII`\
  \ 的扩展，对代码 128 到 255 表示西欧语言常用字符，现在大部分被 `Unicode` 取代。另：`ANSI 编码`。\n\n**追加模式 (append\
  \ mode)**:\n\n一种写入文件的选项，其中新数据被追加而不是被替换。\n\n**应用程序二进制接口 (ABI)**:\n\n软件要在特定类型机器上运行必须具备的底层布局。另：`应用程序编程接口\
  \ (API)`。\n\n**应用程序编程接口 (API)**:\n\n软件库或网络服务提供的函数集，其他软件可以调用。另：`应用程序二进制接口 (ABI)`。\n\
  \n**参数 (argument)**:\n\n传入函数或方法调用的值。另：`形式 (parameter)`。\n\n**ASCII 编码 (ASCII character\
  \ encoding)**:\n\n一种用 7 位整数表示西方语言常用字符的标准方法，现在主要被 `Unicode` 取代。另：`ANSI 编码`。\n\n**汇编器\
  \ (assembler)**:\n\n一种将`汇编代码`翻译成机器指令的`编译器`。另：`反汇编器 (disassembler)`。\n\n**汇编代码 (assembly\
  \ code)**:\n\n一种与特定类型处理器的实际`指令集`密切对应的低级编程语言。\n\n**断言 (assertion)**:\n\n程序中某处必须为真的的`布尔表达式`。断言可以是语言内置的，也可以作为函数提供。\n\
  \n**原子操作 (atomic operation)**:\n\n一种保证能够完成的操作，即不能在中途被中断的操作。\n\n**原子值 (atomic value)**:\n\
  \n不能拆分为更小部分的值，例如`布尔`或整数。\n\n**注意力预算 (attention budget)**:\n\n你的活动允许组织内其他人花费的时间。\n\
  \n**属性 (attribute)**:\n\n与对象关联的键值对，用于存储有关对象的`元数据`，例如数组的维度。\n\n**向后兼容 (backward-compatible)**:\n\
  \n系统能够与旧遗留系统或为此类系统设计的输入相互操作的特性。\n\n**批处理 (batch processing)**:\n\n\n\n\n在计算机上执行一组非交互式任务，例如备份文件或夜夜将数据从一个数据库复制到另一个。\n\
  \n### 基准 (benchmark)\n\n用于衡量计算机系统性能的程序或程序集。\n\n### 大端序 (big endian)\n\n一种存储方案，其中数字最高位存储在地址最低的字节中。例如，258\
  \ 的 16 位大端表示将 `0x01` 存储在低字节，将 `0x02` 存储在高字节。参见：`小端序 (little endian)`。\n\n### 大 O\
  \ 表示 (big-oh notation)\n\n一种表达算法运行时间或内存需求随问题规模增大而增加的方法。参见：`空间复杂度`, `时间复杂度`。\n\n\
  ### 二进制模式 (binary mode)\n\n一种读写文件的选项，其中每个字节按原样传输。术术与`文本模式 (text mode)` 相对使用。\n\n\
  ### 位掩码 (bit mask)\n\n用于设置或清除内存中字节或 `word` 中位的位模式。\n\n### 位移 (bit shifting)\n\n\
  将字节或 `word` 中的位向左或向右移动。\n\n### 位运算 (bitwise operation)\n\n一种操作内存中单个位的操作。常见的位运算包括\
  \ `and`、`or`、`not` 和 `xor`。\n\n### 内存块 (block (of memory))\n\n固定常量大小的内存区域。数据通常被分成块以优化硬件层输入输出；然后使用软件在块和\
  \ `流 (streams)` 之间转换。\n\n### 页面块 (block (on page))\n\n页面上的矩形区域，可能包含文本、图像和其他视觉元素，以及其他块。\n\
  \n### HTTP 请求或响应体 (body (of HTTP request or response))\n\n与 `HTTP request` 或 `response`\
  \ 相关的“额外”数据，例如正在上传的文件或返回显示的页面。\n\n### 布尔表达式 (Boolean expression)\n\n一个为真或为假的 `expression`，即产生\
  \ `布尔值 (Boolean value)` 的表达式。\n\n### 布尔值 (Boolean value)\n\n“真”或“假”两个值之一。以 19 世纪数学家乔治·布尔（George\
  \ Boole）的名字命名。\n\n### 装箱值 (boxed value)\n\n嵌入在内存中较大结构中的值（例如整数），该结构带有关于其类型、有多少结构引用它等\
  \ `元数据 (metadata)`。\n\n### 断点 (breakpoint)\n\n程序中的一点，调试器应在此停止执行以便与用户交互。\n\n### 桶\
  \ (bucket)\n\n数据集中值的子集，通常由直方图中的单条柱表示。\n\n### 内存缓冲区 (buffer (in memory))\n\n内存中的临时存储区域。\n\
  \n### 文本缓冲区 (buffer (of text))\n\n在查看或编辑文本时存储文本的数据结构。\n\n### 构建管理器 (build manager)\n\
  \n一种跟踪文件间相互依赖关系的程序，并运行命令更新任何过期的文件。构建器的发明是为了仅 `compile` 程序中已更改的部分，但现在通常用于实现工作流，其中图表依赖结果文件，而结果文件又依赖原始数据文件或配置文件。\n\
  \n### 构建配方 (build recipe)\n\n`build rule` 的一部分，描述如何更新过期的内容。\n\n### 构建规则 (build rule)\n\
  \n对 `build manager` 的规范，描述某些文件如何依赖于其他文件，以及当这些文件过期时该如何做。\n\n### 字节码 (bytecode)\n\n\
  一组设计用于 `解释器 (interpreter)` 高效执行的指令。\n\n### 缓存 (cache)\n\n一种存储数据副本的东西，以便更快速地满足未来的后续请求。计算机中的\
  \ CPU 使用硬件缓存来保存最近访问的值；许多程序依赖软件缓存来减少网络流量和延迟。确定缓存中的某些内容何时过期并应该被替换是 `计算机科学中的两个难题之一`\
  \ 之一。\n\n### 调用栈 (call stack)\n\n一种存储关于正在执行的活动子程序信息的数据结构。\n\n### 捕异常 (catch (an\
  \ exception))\n\n处理由 `exception` 表示的错误或其他意外事件。\n\n### 责任链模式 (Chain of Responsibility\
  \ pattern)\n\n一种 `design pattern`，其中每个 `object` 要么处理请求，要么将其传递给另一个对象。\n\n### 字符编码\
  \ (character encoding)\n\n一种将字符表示为字节的方法。常见示例包括 `ASCII` 和 `UTF-8`。\n\n### 子节点 (child\
  \ (in a tree))\n\n`tree` 中位于另一个节点（称为 `父节点 (parent)`）下方的 `node`。\n\n### 子类 (child\
  \ class)\n\n在`面向对象编程` 中，派自另一个类（称为 `父类 (parent class)`）的 `class`。\n\n### 循环依赖 (circular\
  \ dependency)\n\n一种 `build target` 直接或间接依赖于自身的情况，即 `dependencies` 的 `DAG` 包含 `循环\
  \ (cycle)` 的情况。\n\n### 类 (class)\n\n在`面向对象编程` 中，一种结合数据和操作（称为 `方法 (methods)`）的结构。程序随后使用\
  \ `构造函数 (constructor)` 创建具有这些属性和方法的 `object`。程序员通常将通用或可重用的行为放在`父类 (parent classes)`\
  \ 中，将更详细或特定的行为放在`子类 (child classes)` 中。\n\n### 类方法 (class method)\n\n定义在类内部的函数，接受类对象而不是类的类的实例。参见：`静态方法\
  \ (static method)`。\n\n### 清除断点 (clear (a breakpoint))\n\n从程序中移除 `breakpoint`。\n\
  \n### 客户端 (client)\n\n一种如浏览器之类的程序，向服务器发送请求并对响应进行处理。\n\n### 结束标签 (closing tag)\n\n\
  HTML 文档中显示 `element` 结束的文本标记，书写为 `< /tag >`。\n\n### 闭包 (closure)\n\n一种存储函数及其`环境\
  \ (environment)` 的记录，以便在函数定义时处于作用域内的变量即使在对函数不再可见，仍然可以从函数内部访问。\n\n### 字符点 (code point)\n\
  \n在 `Unicode` 标准中唯一标识字符的数字。\n\n### 认知负载 (cognitive load)\n\n解决问题所需的心理努力。\n\n###\
  \ 哈希冲突 (collision (in hashing))\n\n两个或多个值具有相同 `hash code` 的情况。\n\n### 列式存储 (column-wise\
  \ storage)\n\n组织二维表的内存，使得每列的值在连续块中。参见：`行式存储 (row-wise storage)`。\n\n### 组合爆炸 (combinatorial\
  \ explosion)\n\n当搜索一组项目的所有可能组合时，问题规模或求解所需时间的指数级增长。\n\n### 命令模式 (Command pattern)\n\
  \n一种 `design pattern`，将操作表示为对象，以便存储和重用。\n\n### 数据或文件压缩 (compact (data or files))\n\
  \n压缩数据以消除未使用空间。\n\n### 编译 (compile)\n\n将文本源码转换为另一种形式。`编译型语言` 中的程序被翻译成机器指令供计算机运行，`Markdown`\
  \ 通常被翻译成 `HTML` 显示。\n\n### 编译型语言 (compiled language)\n\n最初是指像 C 或 Fortran 这样被翻译成机器指令执行的语言。Java\
  \ 等语言在执行之前也会编译，但编译成 `字节码` 而不是机器指令，而 JavaScript 等`解释型语言 (interpreted languages)`\
  \ 则实时编译字节码。\n\n### 编译器 (compiler)\n\n将某些语言编写的程序翻译成机器指令或 `字节码` 的应用程序。\n\n### 压缩 (compression\
  \ (of file))\n\n存储文件所需的各种技术。压缩通过寻找模式并将其替换为更短的位字节来实现。\n\n### 具体类 (concrete class)\n\
  \n可以实际实例化的类。术语与`抽象类 (abstract class)` 相对使用。\n\n### 条件断点 (conditional breakpoint)\n\
  \n只有当用户指定的条件为真才会停止的 `breakpoint`。\n\n### 条件跳转 (conditional jump)\n\n一种指令，如果条件为真，则告诉处理器从其他地址开始执行。条件跳转被用于实现高级结构，如\
  \ if 语句和循环。\n\n### 构造函数 (constructor)\n\n用于初始化类实例的特殊方法。\n\n\n\n\n\n创建一个特定 `class`\
  \ 的 `object` 的函数。\n\n### 上文管理器 (context manager):\n\n在代码块开始时自动执行某些操作并在块结束时执行其他操作的对象。\n\
  \n### 延续字节 (continuation byte):\n\n多字节 `character encoding` 中的第二个或随后的字节。\n\n###\
  \ 控制码 (control code):\n\n最初是一种让电字机执行某些操作（如移动到下一行或响铃）的“字符”。目前只有制表符和换行等少数控制码常用。\n\n\
  ### 控制流 (control flow):\n\n程序执行语句和表达式的顺序。\n\n### 协调世界时 (UTC):\n\n定义其他时间的标准时间。UTC\
  \ 是经度 0°的时间，且不进行夏令调整。`Timestamps` 通常以 UTC 格式报告，这样无论计算机处于什么时区，它们都是相同的。\n\n### 叉积\
  \ (cross product):\n\n一个或多个集合中所有可能的组合集合。\n\n### 加密哈希函数 (cryptographic hash function):\n\
  \n一种对任何输入产生看似随机值的 `hash function`。\n\n### CSV (逗号分隔值，comma-separated values):\n\n\
  一种用于表格数据的文本格式，其中每个 `record` 为一行，`fields` 由逗号分隔。有许多细微变体，特别是在 `strings` 的引用方面。\n\n\
  ### 循环 (cycle):\n\n`directed graph` 中一条从 `node` 回到自身的路径。\n\n### 数据工程师 (data engineer):\n\
  \n负责设计、开发和维护用于收集、存储和分析数据的系统的员。\n\n### 数据迁移 (data migration):\n\n将数据从一个系统或格式移动到另一个的行为。\n\
  \n### 数据帧 (dataframe):\n\n一种用于在内存中存储表格数据的二维数据结构。行表示 `records`，列表示 `fields`。\n\n\
  ### 死锁 (deadlock):\n\n一种没有任何人都无法继续的情况，因为每个人都在等待他人而被阻塞。\n\n### 调试器 (debugger):\n\n\
  一个允许用户监控和控制另一个程序的程序，通常通过单步执行（single-stepping）其执行或设置断点（breakpoints）来实现。\n\n### 装饰器\
  \ (decorator):\n\n在定义函数 `B` 时可以应用于另一个函数 `B` 的函数 `A`，以某种方式改变其行为。\n\n### 防御性编程 (defensive\
  \ programming):\n\n一组编程实践，假设错误会发生并对其报告或纠正，例如插入 `assertions` 来报告本不应发生的情况。\n\n###\
  \ 延迟构造 (delayed construction):\n\n在需要某个东西的对象构造之后构造该对象的做法，而不是之前。见：`lazy evaluation`。\n\
  \n### 依赖（构建中，dependency in build):\n\n`build target` 所依赖的内容。\n\n### 派生类 (derived\
  \ class):\n\n在 `object-oriented programming` 中，对 `base class` 进行直接或间接扩展的类。见：`child\
  \ class`。\n\n### 契约设计 (design by contract):\n\n一种软件设计风格，其中函数指定了运行必须满足的前置条件（pre-conditions）以及返回时保证为真的后置条件（post-conditions）。这样，函数就可以被具有较弱的前置条件（即接受更广泛的输入集）和/或更强的后置条件（即产生更小范围的输出）的函数替换，而不会破坏其他部分。见：`Liskov\
  \ Substitution Principle`（里氏替换原则）。\n\n### 设计模式 (design pattern):\n\n软件设计中反复出现的模式，具体到足以命名，但又不过具体到无法由\
  \ `library` 提供单一最佳实现。见：`Iterator pattern`（迭代器模式）、`Singleton pattern`（单例模式）、`Template\
  \ Method pattern`（模板方法模式）、`Visitor pattern`（访问者模式）。\n\n### 字典 (dictionary):\n\n\
  一种通过值查找项的数据结构。字典通常使用 `hash tables` 实现。\n\n### 字典推导式 (dictionary comprehension):\n\
  \n一种通过遍历键值对来构造字典的单一表达式。见：`list comprehension`（列表推导式）。\n\n### 有向无环图 (DAG):\n\n一种不包含任何\
  \ `cycles` 的 `directed graph`（即无法通过边从 `node` 回到自身）。\n\n### 有向图 (directed graph):\n\
  \n`edges` 具有方向的 `graph`。\n\n### 反汇编 (disassemble):\n\n将机器指令转换为 `assembly code` 或某些高级语言。\n\
  \n### 反汇编器 (disassembler):\n\n一个将机器指令翻译为 `assembly code` 或某些高级语言的程序。见：`assembler`（汇编器）。\n\
  \n### 文档字符串 (docstring):\n\nPython 中模块、类或函数开头的未赋值给变量字符串，用于存储该部分代码的文档。\n\n### DOM\
  \ (DOM):\n\n`HTML` 和 `XML` 的标准内存表示。每个 `element` 存储为 `DOM tree` 中的一个 `node`，并带有一组命名的\
  \ `attributes`；包含的元素是 `child nodes`。\n\n### DOM 树 (DOM tree):\n\n由一组正确嵌套的 `DOMnodes`\
  \ 形成的 `tree`。\n\n### 域名系统 (DNS):\n\n一种用于计算机的去中心化命名系统，将 `hostnames` 翻译为特定计算机的 `IP\
  \ address`。\n\n### 跑运行 (dry run):\n\n不改变任何内容的程序执行。\n\n### 鸭子类型 (duck typing):\n\n\
  一种编程风格，其中对象恰好的方法决定了它可以如何被使用，而不是它继承自哪些类。\n\n### 动态分发 (dynamic dispatch):\n\n在程序运行时通过名称查找\
  \ `object` 的函数或属性。例如，程序可能不用 `obj.name` 获取对象的特定属性，而是使用 `obj[someVariable]`，其中 `someVariable`\
  \ 可能包含“name”或其他其他属性名。\n\n### 动态作用域 (dynamic scoping):\n\n通过查看查找时刻 `call stack` 上的内容来查找变量的值。几乎所有编程语言都改用\
  \ `lexical scoping`（词法作用域），因为它更具预测性。\n\n### 动态类型 (dynamic typing):\n\n一种在程序运行时检查类型的系统。见：`static\
  \ typing`（静态类型）、`type hint`（类型提示）。\n\n### 饥求值 (eager evaluation):\n\n在使用之前评估表达式。见：`lazy\
  \ evaluation`（懒求值）。\n\n### 模式 (easy mode):\n\n借自游戏的术语，指在简化障碍或困难的情况下完成某事，通常用于练习目的。\n\
  \n### 边 (edge):\n\n`graph` 中两个 `nodes` 之间的连接。边可以关联相关的数据，如名称或距离。\n\n### 元素（HTML 中的元素，element）\n\
  \n`HTML` 或 `XML` 文档中的命名组件。元素通常写为 `<name>...</name>`，其中“...”代表元素的内容。元素通常有 `attributes`。\n\
  \n### 枚举 (enumeration):\n\n程序中定义的一组不同命名值的集合。\n\n### 环境 (environment):\n\n程序中当前定义的变量集。\n\
  \n### 错误（测试结果，error result of test）\n\n当 `unit test` 出现问题而非被测系统出错时发出。在这种情况下，我们对系统的正确性一无所知。\n\
  \n### 错误处理 (error handling):\n\n程序检测并纠正错误的方法。包括在找不到指定的配置时打印消息并使用默认配置。\n\n### 转义序列\
  \ (escape sequence):\n\n用于表示通常无法表示的字符的两个或多个字符。例如，转义序列 `\\\"` 用于在双引号字符串内部表示单个“字符。\n\
  \n### 异常 (exception):\n\n一个存储程序中错误或其他意外事件信息的对象。程序的一部分会创建并**抛出（raise）异常**以信号发生了意外情况；程序的另一部分会**捕获（catch）**它。\n\
  \n### 异或 (exclusive or):\n\n一种逻辑（或位）运算符，当操作数值不同时为真（或 1），当相同时为假（或 0）。异或实现了“二选一”。\n\
  \n### 预期结果（测试结果，expected result of test）:\n\n软件在以特定方式测试时应该产生的值，或它应该在系统中留下的状态。\n\n\
  ### 指数 (exponent):\n\n\n\n\n\n浮点数中控制小数点位置的部分。参见：`mantissa`（尾数）。\n\n### 表达式\n程序中产生一个值的部分，例如\
  \ `1+2`。参见：`statement`（语句）。\n\n### 扩展性\n向程序中添加新功能或更改现有功能的难易程度。\n\n### 提取父类重构\n一种\
  \ `refactoring`（重构），其其中将现有类或一组类的某些功能移动到新创建的`parent class`（父类）中。\n\n### 工厂方法\n唯一作用是构造某种类型对象的`method`。创建工厂方法通常是为了让`child\
  \ classes`更容易构造其他类型的对象。\n\n### 失败（测试结果）\n如果`actual result`（实际结果）与`expected result`（预期结果）不匹配，则测试失败。\n\
  \n### 假阴性\n报告某内容缺失，但实际上它存在。参见：`false positive`（假阳性）。\n\n### 假阳性\n报告某内容存在，但实际上它不存在。参见：`false\
  \ negative`（假阴性）。\n\n### 虚假\n指在布尔表达式中被视为假的值。在 Python 中，这包括空字符串、列表和数字零。参见：`truthy`（真值）。\n\
  \n### 字段\n`record`（记录）中包含单个值的组件。数据库`table`（表）中的每个记录都有相同的字段。\n\n### 文件锁定\n限制对文件的更新或删除，使得对文件的操作看起来是`atomic`（原子的）。\n\
  \n### 固件\n运行测试的实体，例如被测试函数的`parameters`（参数）或正在处理的文件。\n\n### 格式化字符串\n包含特殊标记的字符串，显示如何格式化值。例如，字符串“{age:02d}\
  \ years old”指定将`age`的值插入到字符串开头，并格式化为带有前导零的两位位小数（如有）。\n\n### 垃圾回收\n程序中的一种自动过程，用于寻找并回收不再使用的内存。\n\
  \n### 通用函数\n一组目的相似的函数，每个函数操作于不同类型的数据。\n\n### 全局\n指程序的顶层或最外层`scope`（作用域）。参见：`local`（局部）。\n\
  \n### 通配符匹配\n根据模式匹配文件名。名称源于早期的 Unix 实用程序 `glob`（“global”的缩写）。Glob 模式是`regular expressions`（正则表达式）的子集。参见：`regular\
  \ expression`（正则表达式）。\n\n### 语法\n定义由`parser`（解析器）识别的正式语言的规则。\n\n### 图（数据结构）\n一种`nodes`通过`edges`（边）相互连接的数据结构。参见：`tree`（树）。\n\
  \n### 贪婪匹配\n在找到有效匹配的同时尽可能多匹配。参见：`lazy matching`（懒惰匹配）。\n\n### 哈希值\n由`hash function`（哈希函数）生成的值。良好的哈希值具有随机数相同的属性，以减少`collisions`（冲突）的频率。\n\
  \n### 哈希函数\n将任意数据转换为固定大小位数组或`key`（键）的函数。哈希函数用于确定数据应该存储在`hash table`（哈希表）的位置。\n\n\
  ### 哈希表\n一种数据结构，为其传递的每个值计算一个伪随机键（位置），并将值存储在该位置。哈希表实现了对任意数据的快速查找。这是以额外内存为代价的，因为哈希表必须始终大于需要存储的信息量，以避免当哈希函数对两个不同的值返回相同的键时发生数据冲突的可能性。\n\
  \n### 头部（HTTP 请求或响应）\n`HTTP request`或`response`开头的键值对。头部用于指定发送者可以处理的数据格式、消息发送的日期和时间等。\n\
  \n### 无头应用程序\n在没有其通常图形界面的情况下运行的应用程序。浏览器、编辑器和其他应用程序经常为了测试目的以无头模式运行。\n\n### 辅助类\n\
  为了支持另一个类而创建的`class`，其本身没有其他用途。\n\n### 辅助函数\n为了支持另一个函数的函数，其本身没有其他用途。\n\n### 辅助方法\n\
  设计用于支持其他方法的`method`，位于其他类中。\n\n### 异构\n包含混合类型的数据。例如，`HTTP request`中的方法。\n\n### 十进制\n\
  一种 16 进制表示法，使用 A-F 字母。`homogeneous`（同构）。\n\n### 主机名\n网络计算机的可读名称。\n\n### HTML（超文本标记语言）\n\
  用于网页的常用`markup language`，使用`DOM`（对象模型）表示。\n\n### 和服务器之间交换信息的协议。由`requests`（请求）和`responses`（响应）组成。\n\
  \n### HTTP（超文本传输协议）\n浏览器和网站之间交换信息的协议。指定使用的`HTTP`版本。\n\n### HTTP 方法\n`HTTP request`中定义客户端想要做的动作。常见方法有\
  \ GET（获取数据）和 POST（提交数据）。\n\n### HTTP 请求\n`client`发送到`server`的精确格式化的文本块，指定请求的资源、客户端可以接受的数据格式等。\n\
  \n### HTTP 响应\n`server`返回给`client`的精确格式化的文本块。\n\n### HTTP 状态码\n指示处理`HTTP request`时发生什么的数值代码，例如\
  \ 200（OK）、404（未找到）或 500（内部服务器错误）。\n\n### 不变\n创建后无法更改。不变数据更容易思考，特别是当数据结构在多个任务之间共享时，但可能会增加内存需求。\n\
  \n### 索引（数据库）\n数据库中用于加速某些项搜索的辅助数据结构。索引增加了内存和磁盘需求，但缩短了搜索时间。\n\n### 无限循环\n由于控制条件永远不为假而永远不会的循环（通常是\
  \ while 循环）。参见：`infinite recursion`（无限递归）。\n\n### 无限递归\n由于永远无法不需要进一步评估的情况而永远停止的递归；**无限循环**的递归等价物。\n\
  \n### 中间法\n将运算符放在操作数之间的表达式，例如用 1+2 加 1 和 2。参见：`prefix notation, postfix notation`。\n\
  \n### 继承\n从现有类创建新`class`的行为，通常通过添加或更改其属性或`methods`。参见：`multiple inheritance`（多继承）。\n\
  \n### 实例\n特定`class`的`object`。\n\n### 指令指针\n处理器中的特殊`register`，存储下一个执行指令的地址。\n\n###\
  \ 指令集\n特定处理器可以直接执行的基本操作。\n\n### 互联网协议 (IP)\n计算机通信的一种规范。`TCP/IP` 是最广泛使用的。\n\n###\
  \ 解释型语言\n一种不被计算机直接执行的高级语言，而是由`interpreter`运行，该解释器动态将程序指令翻译成机器命令。\n\n### 解释器\n\n\n\
  \n\n\n运行由高级`interpreted language`编写的程序的程序。解释器可以交互式运行，也可以执行保存在文件中的命令。\n\n### intrinsic\
  \ complexity（内在复杂度）\n问题固有的困难性。该术语与`accidental complexity`（意外复杂度）相对使用。\n\n### introspection（自省）\n\
  见 `reflection`（反射）。\n\n### IP address (IP)\n唯一标识网络上计算机的四部分数字。\n\n### ISO date format\n\
  一种日期格式的国际标准。虽然整个标准非常复杂，但最常用的形式是 `YYYY-MM-DD`，即四位年份、两位月份和两位日期，用连字符分隔。\n\n### iterator（迭代器）\n\
  一种能够按顺序产生集合中每个值以便处理的函数或对象。\n\n### Iterator pattern（迭代器模式）\n一种使用`iterators`来隐藏不同数据结构之间差异的`design\
  \ pattern`，以便可以使用循环处理所有内容。参见：`Visitor pattern`（访问者模式）。\n\n### join (tables)\n一种合并两个`tables`\
  \ 的操作，通常通过将一个表的 `keys` 与另一个表的 `keys` 匹配来实现。\n\n### JSON (JavaScript Object Notation)\n\
  一种通过在 `lists` 和 `key-value` 结构中组合数字和字符字符串等基本值来表示数据的方法。该缩写代表“JavaScript Object Notation”。与\
  \ `XML` 这种定义更良好的标准不同，它不受注释语法或定义 `schema` 方式限制。\n\n### key（键）\n一个`field` 或多个字段的组合，其值可唯一标识`table`\
  \ 或数据集中的`record`。键通常用于选择特定记录以及在 `joins`（连接）操作中使用。\n\n### key-value store（键值存储）\n\
  一种简单的数据库形式，其中每个`record` 只能通过单个 `key` 访问。\n\n### label (of address in memory)（内存地址标签）\n\
  在用`assembly code`编写程序时，赋予内存特定位置的可读名称。\n\n### lambda expression（Lambda 表达式）\n一种接受零或多个参数并产生结果的表达式。Lambda\
  \ 表达式有时被称为`anonymous function`（匿名函数）；该名称来源于表示此类表达式的数学符号 λ。\n\n### layout engine（布局引擎）\n\
  一段决定页面上文本、图像和其他元素放置位置的软件。\n\n### lazy evaluation（惰性求值）\n仅在绝对必要时才计算表达式。参见：`eager\
  \ evaluation`（强制求值）。\n\n### lazy matching（惰性匹配）\n在仍然找到有效匹配的情况下尽可能少地匹配。参见：`greedy\
  \ matching`（贪婪匹配）。\n\n### lexical scoping（词法作用域）\n根据程序的文本结构查找与名称关联的值。大多数编程语言使用词法作用域而非`dynamic\
  \ scoping`（动态作用域），因为后者的可预测性较低。\n\n### library（库）\n一种可安装的软件集合，也常称为 `module`（模块）或\
  \ `package`（包）。\n\n### link (a program)（链接程序）\n将单独`compiled`的模块组合成单个可运行的程序。\n\n\
  ### linter（静态检查工具）\n一种检查软件中常见问题的程序，例如违反缩进规则或变量命名规范。该名称源于此类工具中的第一种工具，名为 lint。\n\n\
  ### Liskov Substitution Principle（里氏夫替换原则）\n一种设计规则，规定可以使用派生类的对象替换程序中的基类对象而不破坏程序。`Design\
  \ by contract`（契约设计）旨在强制执行这一规则。\n\n### list（列表）\n一种可以包含许多不同（`heterogeneous`）类型值的\
  \ `vector`。\n\n### list comprehension（列表推导式）\n一种通过遍历其项来构造列表的单一表达式。\n\n### literal\
  \ (in parsing)（字面量）\n程序中固定值的表示，例如数字 `123` 代表数字 `123` 或包含这三个字母的字符串“abc”。\n\n### little\
  \ endian（小端）\n一种存储方案，将数字的最有效部分存储在地址最高的字节中。例如，`258` 的 16 位大端表示将 `0x02` 存储在低字节，将 `0x01`\
  \ 存储在高字节。参见：`big endian`大端）。\n\n### local（本地）\n指程序中的当前或最内层 `scope`。参见：`global`（全局）。\n\
  \n### log file（日志文件）\n程序向写入状态或调试信息以便以后分析的文件。\n\n### log-structured database（日志结构数据库）\n\
  一种只能追加写入数据的数据库，即现有记录不能被覆盖。\n\n### manifest（清单/清单）\n某物部分或组件的列表。\n\n### mantissa（尾数）\n\
  浮点数定义其特定值的部分。参见：`exponent`（指数）。\n\n### Markdown\n一种具有简单语法的 `markup language`，旨在替代\
  \ `HTML`。\n\n### markup language（标记语言）\n一组用于注释文本的规则，以定义其含义或显示方式。标记通常不显示，而是控制底层文本如何被解释或显示。`Markdown`\
  \ 和 `HTML` 是广泛用于网页的标记语言。参见：`XML`。\n\n### metadata（元数据）\n关于数据的数据，例如数据集存档的时间。\n\n\
  ### method（方法）\n处理特定类对象的 `generic function`（泛函数）的实现。\n\n### method injection（方法注入）\n\
  在现有类定义后向其添加方法。\n\n### mixin class（混入类）\n一种本身不打算被实例化的类，但它包含了可以添加到其他类中的方法（通常通过 `multiple\
  \ inheritance` 多重继承实现）。\n\n### mock object（模拟对象）\n程序部分的简化替代品，其行为易于控制和预测。模拟对象用于 `unit\
  \ tests`（单元测试）以模拟数据库、Web 服务和其他复杂的系统。\n\n### model（模型）\n满足一组特定约束条件的变量值集。\n\n### module（模块）\n\
  一种可重用的软件 `package`，也常称为 `library`（库）。\n\n### monkey patching（猴子补丁）\n在运行时不修改原始代码的情况下替换\
  \ `class` 或 `object` 中的 `methods`。\n\n### multiple inheritance（多重继承）\n在创建新类时继承两个或多个类。\n\
  \n### name collision（命名冲突）\n两个或多个事物在同一时间或同一 `scope` 内尝试使用相同名称的情况。\n\n### node（节点）\n\
  `graph` 中的元素，通过 `edges` 与其他节点连接。节点通常关联有数据。\n\n### null byte（空字节）\n值为零的字节。空字节用于标记\
  \ C 和 C++ 中字符串，有时用于填充固定大小二进制记录。\n\n### Null Object pattern（空对象模式）\n一种使用位置对象代替 None\
  \ 的 `design pattern`。该对象具有通常使用的方法，但这些方法什么都不做。这种模式避免了其他代码频繁检查 None。\n\n### object（对象）\n\
  在 `object-oriented programming` 中，包含特定 `class` 实例数据的结构。对象的操作由类的方法定义。\n\n### object-oriented\
  \ programming (OOP)（面向对象编程）\n一种编程风格，将函数和数据绑定在 `objects` 中，对象通过良好定义的接口相互交互。\n\n###\
  \ off-by-one error（差一）\n编程中一种常见错误，程序引用结构元素 `i` 时本应引用 `i-1` 或 `i+1`，或者处理 `N` 个元素时本应处理\
  \ `N-1` 或 `N+1`。\n\n### online analytical processing (OLAP)\n批量分析数据。该术语与 `OLTP`相对。\n\
  \n### online transaction processing (OLTP)\n向数据库添加记录或查询单个记录。该术语与 `OLAP`相对。\n\n###\
  \ op code（操作码）\n处理器可以执行的指令的操作码。\n\n### Open-Closed Principle（开闭原则）\n一种设计规则，规定软件应对扩展开放的，对修改关闭的，即可以在不重写现有代码的情况下扩展功能。\n\
  \n### opening tag（起始标签）\n\n\n\n\n\nHTML 文档中显示 `element` 开始的文本标记，写为 `< tag >`。起始标签可能包含\
  \ `attributes`（属性）。\n\n### 运算符重载\n定义或重新定义如 `+` 等内置运算符的实现。\n\n### 包\n代码、数据和文档的集合，可以分发和重用。在某些语言中也称为\
  \ `library`（库）或 `module`（模块）。\n\n### 页面\n固定大小的存储空间块。大多数现代文件系统使用 `4K` `pages` 管理磁盘，许多其他应用程序（如数据库）也使用相同的页面大小以最大化效率。\n\
  \n### 参数\n函数在被调用时传递给它的某个值的名称。另见：`argument`（实参）。\n\n### 参数扫描\n使用不同的参数多次执行一个程序，以找出其行为或性能如何依赖于这些参数。\n\
  \n### 父节点（在树中）\n`tree` 中位于另一个节点（称为 `child` 子节点）之上的 `node`。树中`root node`（根节点）外，每个节点只有一个父节点。\n\
  \n### 父类\n在`object-oriented programming`（面向对象编程）中，子类（称为 `child class` 子类）派生的 `class`。\n\
  \n### 解析器\n读取按照某些`grammar`（语法）格式化的文本并将其转换为内存中数据结构的函数或程序。每种编程语言都有一个读取该语言编写的程序的解析器；各种数据格式也存在解析器。\n\
  \n### 通过（测试结果）\n如果`actual result`（实际结果）与`expected result`（预期结果），则测试通过。\n\n### 补丁\n\
  包含一组文件更改的单个文件，更改由标记分隔，标记指示每个单独更改应应用的位置，或者是此类文件的`semantic versioning`（语义版本化）标识符。\n\
  \n### 路径解析\n将 `URL` 的文件名部分转换为磁盘上特定文件的过程。\n\n### 持久化\n保存和恢复数据的行为，特别是具有不规则结构的`heterogeneous`（异构）数据。\n\
  \n### 伪目标\n不更新任何文件的`build recipe`（构建配方）。伪目标通常用于使测试等任务具有可重复性。\n\n### 管道（在 Unix shell\
  \ 中）\n符号 `|` 用于将一个命令的输出作为下一个命令的输入。\n\n### 多态\n对同一个接口有许多不同的实现。如果一组函数或对象是多态的，那么它们可以被替调用。\n\
  \n### 端口\n通信的逻辑端点，类似于办公大楼里的电话号码。在任何时候，计算机上只有一个程序可以使用该计算机上的特定端口。\n\n### 后置条件\n函数成功运行后保证为真的项。后置条件通常表示为`assertions`（断言），这些断言保证函数结果真实。另见：`design\
  \ by contract, pre-condition`（契约设计，前置条件）。\n\n### 后置法\n将运算符放在操作数后面的表达式，例如用 `2 3 +`\
  \ 表示加 2 和 3。另见：`infix notation`（中缀法）、`prefix notation`（前缀法）。\n\n### 前置条件\n函数为了正确运行之前必须为真的项。前置条件通常表示为`assertions`（断言），为了让函数成功运行，输入必须为真。另见：`design\
  \ by contract, post-condition`（契约设计，后置条件）。\n\n### 前置法\n将运算符放在操作数前面的表达式，例如用 `+ 3\
  \ 4` 表示加 3 和 4。另见：`infix notation`（中缀法）、`postfix notation`（后置法）。\n\n### 前提条件\n`build\
  \ target`（构建目标）依赖的项。另见：`dependency (in build)`（构建中的依赖）。\n\n### 美化打印\n以易于阅读的方式格式化文本输出。\n\
  \n### 性能分析器\n测量程序性能的一个或多个方面的工具。\n\n### 性能分析\n测量程序在何处花费时间、哪些操作消耗内存或磁盘空间的行为。另见：`profiler`。\n\
  \n### 协议\n某物承诺遵守的规则集，即该事物与其用户之间的契约。\n\n### Pythonic\n符合常见的 Python 编程风格和实践。\n\n###\
  \ 查询参数\n附加到 `URL` 路径部分的键值对。\n\n### 竞态条件\n结果取决于两个或多个并发操作执行顺序的情况。\n\n### 抛出（异常）\n\
  通过创建一个`exception`（异常）并将其交给`error-handling`（错误处理）系统来信号程序发生了意外或异常情况，系统随后尝试在程序中找到一个可以`catch`（捕获）它的点。另见：`throw\
  \ exception`（抛出异常）。\n\n### 记录\n存储在一起的相关值组。记录可以表示为`tuple`（元组）或`table`（表）中的行；在后者，表中的每个记录都有相同的`fields`（字段）。\n\
  \n### 递归\n用自身定义自身，或函数调用自身的行为（直接或间接）。\n\n### 递归枚举模式\n一种`design pattern`（设计模式），使用递归函数调用生成一组项目的`cross\
  \ product`（笛卡尔积）。每一层递归都从一组可能的集合中的项添加到`accumulator`（累加器）。\n\n### 重构\n在不改变功能的情况下重写现有代码，使其更简单或更高效。\n\
  \n### 反射\n以通用方式检查运行程序的属性。反射依赖于程序只是另一个数据结构这一事实。\n\n### 注册（在代码中）\n将函数、类或其他对象添加到查找表中供稍后使用。\n\
  \n### 注册（在硬件中）\n处理器内置的一小块内存（通常为一个`word` 长度），操作可以直接引用它。\n\n### 正则表达式\n用于匹配文本的模式，以文本形式编写。正则表达式有时被称为\
  \ `regexp`、`regex` 或 `RE`，是处理文本的强大工具。\n\n### 关系数据库\n将信息组织成`table`的数据库，每个表具有固定的`fields`（字段）和变数的`records`（记录）。另见：`SQL`。\n\
  \n### 相对误差\n实际值与正确值差值的绝对值除以正确值。例如，如果实际值为 9，正确值为 10，则相对误差为 0.1。相对误差通常比`absolute error`（绝对误差）有用。\n\
  \n### 反向查找\n查找与特定值相关的键。\n\n### 根节点（在树中）\n树中所有其他节点的直接或间接`children`，或树中唯一没有`parent`的节点。\n\
  \n### 行存储\n组织二维表的内存，使得每行的值在连续块中排列。另见：`column-wise storage`（列存储）。\n\n### 运行时\n实现编程语言基本操作的程序。\n\
  \n### 沙箱\n代码可以安全执行的空间。\n\n### 模式\n数据集格式的规范，包括每个`table`的名称、格式和内容。\n\n### 作用域\n可以在其中定义名称而不与程序其他定义冲突的区域。在\
  \ Python 中，每个`module`和函数都会创建一个新的作用域。\n\n### 评分函数\n衡量问题解决方案有多坏的函数。\n\n### 搜索空间\n\
  问题所有可能解的集合，即算法搜索以找到答案的可能性集。\n\n### 自闭合标签\nHTML 文档中无内容的 `element` 文本标记，写为 `< tag/\
  \ >`。自闭合标签可能包含 `attributes`（属性）。\n\n### 语义版本化\n标识软件版本的标准。在版本标识符 `major.minor.patch`\
  \ 中，新版本与旧版本不兼容时使用 major，在现有版本中添加新功能时使用 minor，在修复小 bug 时使用 patch。\n\n\n\n\n\n###\
  \ server (服务器)\n一个等待 `clients` 请求并向其返回数据的程序。\n\n### SHA-256 (哈希函数)\n一种产生 256 位输出的`cryptographic\
  \ hash function`。\n\n### sign and magnitude (符号位)\n整数的二进制表示法，其中一个位表示值的正负，其余位表示其其幅值。参见：`two's\
  \ complement`（补码）。\n\n### signature (签名)\n参数和返回有序列表，规定了如何调用函数以及该函数的返回值。\n\n### single\
  \ stepping (单步执行)\n逐行或逐条指令地执行程序。\n\n### singleton (单例)\n仅包含一个元素的集合，或者只有一个 `instance`\
  \ 的 `class`。参见：`Singleton pattern`（单例模式）。\n\n### Singleton pattern (单例模式)\n一种创建\
  \ `singletonobject` 以管理某些资源或服务（如数据库或 `cache`）的`design pattern`。在`object-oriented\
  \ programming` 中，该模式通常通过某种方式隐藏 `class` 的 `constructor`来实现，使其只能被调用一次。\n\n### socket\
  \ (套接字)\n两台计算机之间的通信通道，提供一种类似于读写文件的接口。\n\n### space complexity (空间复杂度)\n算法所需的内存随问题规模而增长的方式，通常使用`big-oh\
  \ notation` 表示。参见：`time complexity`（时间复杂度）。\n\n### spread (展开)\n自动将调用者提供的列表或字典中的值匹配到函数的参数上。\n\
  \n### SQL\n用于为`relational database`编写查询的语言。该术最初是 Structured Query Language（结构查询语言）的缩写。\n\
  \n### stable sort (稳定排序)\n一种保留相等项原始顺序的排序算法。\n\n### stack frame (栈帧)\n`call stack`\
  \ 的一部分，记录对特定函数单次调用的细节。\n\n### stale (in build) (过时)\n与`prerequisite` 相比已过期。`build\
  \ manager` 会找到并更新过时的内容。\n\n### standard error (标准错误)\n一种预定义的通信通道，通常用于报告错误。参见：`standard\
  \ input`（标准输入）、`standard output`（标准输出）。\n\n### standard input (标准输入)\n一种预定义的通信通道，通常用于从键盘或\
  \ `pipe` 中的上一个进程读取输入。参见：`standard error`、`standard output`。\n\n### standard output\
  \ (标准输出)\n一种预定义的通信通道，通常用于将输出到屏幕或 `pipe` 中的下一个进程。参见：`standard error`、`standard input`。\n\
  \n### statement (语句)\n程序中不产生值的部分。Python 中的 `for` 循环和 `if` 都是语句。参见：`expression`（表达式）。\n\
  \n### static method (静态方法)\n定义在 `class` 内部的函数，但不需要将类本身或类的实例作为参数。参见：`class method`（类方法）。\n\
  \n### static site generator (SSG) (静态网站生成器)\n一种从模板和内容创建 HTML 页面的软件工具。\n\n### static\
  \ typing (静态类型)\n在代码被`compiled` 时检查值类型的系统。参见：`dynamic typing`（动态类型）、`type hint`（类型提示）。\n\
  \n### stream (流)\n长度可变的字节流或其他数据序列，只能按顺序处理。\n\n### streaming API (流式 API)\n一种分块处理数据而非需要一次性将所有数据加载到内存中的\
  \ `API`。流式 API 通常需要处理“数据开始”、“下一块”和“数据结束”等事件的处理器。\n\n### string (字符串)\n程序中的文本块。该术语是“character\
  \ string”的缩写。\n\n### successive refinement (逐层细化)\n参见 `top-down design`（自顶设计）。\n\
  \n### synthetic data (合成数据)\n具有真实数据相同显著特征的虚构数据，通常为测试创建。\n\n### table (表格)\n`relational\
  \ database` 或 `dataframe` 中的一组 `records`。\n\n### tag (in HTML) (HTML 标签)\n显示 HTML\
  \ 文档中 `element` 开始和/或结束的文本标记。参见：`closing tag`（闭合标签）、`opening tag`（开启标签）、`self-closing\
  \ tag`（自闭标签）。\n\n### target (in build) (目标)\n如果文件与其`dependencies` 相比已过期，则`build\
  \ rule` 将更新的文件。\n\n### technical debt (技术债)\n由于今天有限的快速修复解决方案或未处理的复杂性，导致未来需要完成的工作。\n\
  \n### Template Method pattern (模板方法模式)\n一种`design pattern`，其中`parent class` 通过调用`child\
  \ classes` 必须实现的`abstract methods`来定义整体操作序列。每个子类都以相同的通用方式运行，但实现步骤不同。\n\n### test\
  \ fidelity (测试保真度)\n`mock object` 或系统部分/全部替代品为了测试目的模拟该系统行为的程度。\n\n### test-driven\
  \ development (测试驱动开发)\n在编写待测试代码之前先编写测试的实践。研究表明，顺序实际上并没有区别，重要的是在测试和编码之间进行短时间的交替。\n\
  \n### text mode (文本模式)\n一种读写文件的选项，其中字节被转换为字符字符，且换行符被归一化。该术语与`binary mode`（二进制模式）相对。\n\
  \n### throw exception (抛出异常)\n`raising`异常的另一种术语。\n\n### throw low, catch high (低层抛，高层捕)\n\
  一种广泛使用的`exceptions` 管理模式，其中异常在程序底层的许多地方被`raised`，但在少数可以采取纠正措施的高层地方被`caught`。\n\n\
  ### time complexity (时间复杂度)\n算法运行时间随问题规模而增长的方式，通常使用`big-oh notation` 表示。参见：`space\
  \ complexity`（空间复杂度）。\n\n### time of check - time of use (检查时间-使用时间)\n一种`race condition`，其中进程检查某物的状态然后对其进行操作，但另一个进程可能会检查和操作之间更改该状态。\n\
  \n### timestamp (时间戳)\n显示某物创建或访问时间的数字标识符。时间戳应使用`ISO date format` 以保证可移植性。\n\n###\
  \ token (标记)\n解析器的不可拆分的文本单元，例如变量名或数字。什么构成标记取决于语言。\n\n### tokenizer (分词器)\n将单个字符分组为标记的软件。\n\
  \n### top-down design (自顶设计)\n软件设计中的一种实践，先编写程序的抽象或高层次的部分，然后逐层填充细节。在实践中，程序员几乎总是在处理底层时修改上层，但随着更多细节的填充，高层的修改会减少。参见：`successive\
  \ refinement`。\n\n### topological order (拓扑排序)\n`graph` 中`nodes`的一种符合`edges`方向的排序，例如，如果从节点\
  \ A 到节点 B 有边，则 A 在 B 之前。特定的图可能有许多拓扑排序。\n\n### Transmission Control Protocol (TCP/IP)\n\
  `IP` 协议族中最流行的成员。TCP/IP 尝试可靠且按顺序地传递消息，以便程序可以像读写文件一样进行通信。\n\n### tree (树)\n一种`graph`，其中`root`\
  \ 之外的每个节点仅有一个`parent`。\n\n### truthy (真值)\n在布尔表达式中被视为真的值。在 Python 中，这包括非空字符串和列表以及零外的数字。参见：`falsy`（假值）。\n\
  \n### tuple (元组)\n具有固定数量部分的值，例如红绿蓝颜色规范的三个颜色分量。\n\n### two hard problems in computer\
  \ science (计算机科学中的两个难题)\n引用 Phil Karlton 的名言：“计算机科学中只有两个困难的问题——缓存失效和命名。”许多变体作为一个玩笑添加了第三个问题，例如`off-by-one\
  \ errors`（差一错误）。\n\n### two's complement (补码)\n整数的二进制表示法，像里程表一样溢出来表示负值。参见：`sign\
  \ and magnitude`（符号位）。\n\n\n\n\n\n添加到程序中的额外信息，用于指示变量应该具有的数据类型或多个类型。类型提示（Type hints）是`静态类型`与`动态类型`之间的一种折中。\n\
  \n### Unicode\n一种定义数千个字符和符号数值编码的标准。Unicode 并不定义这些数字是如何存储的；那是由 `UTF-8` 等标准完成的。\n\n\
  ### 单元测试\n对软件的某个函数或功能进行测试，并产生 `pass`、`fail` 或 `error` 结果。\n\n### 资源定位符 (URL)\n一种多部分标识符用于指定计算机网络上的某个对象。URL\
  \ 可能包含协议（如 `http`）、主机名（如 [example.com](http://example.com)）、端口（如 80）、路径（如 `/homepage.html`）以及其他各种内容。\n\
  \n### 上层调用 (upcall)\n在`子类` 内部显式调用`父类`方法的行为。子类中的某个方法可以作为扩展该方法的一部分，对父类中对应的方法进行上层调用。\n\
  \n### UTF-32\n一种存储表示 `Unicode` 字符的数值编码的方法，其中每个字符都存储为一个 32 位整数。\n\n### UTF-8\n一种存储表示\
  \ `Unicode` 字符的数值编码的方法，它与旧的 `ASCII` 标准`后兼容`。\n\n### 可变参数 (varargs)\n“variable arguments”的缩写，一种捕获函数或方法的任何“额外”参数的机制。\n\
  \n### 变量捕获\n`闭包`“记住”创建时作用域内变量的过程。\n\n### 变长编码\n任何表示数据的技术，其中单个逻辑数据单元可以使用数量变化的位或字节表示。\n\
  \n### 向量\n值的序列，通常是`同质`类型。\n\n### 版本控制系统\n用于管理软件开发过程中所更改的系统。\n\n### 视口\n一种`class`或其他数据结构，其目的是跟踪用户当前可见的内容。\n\
  \n### 虚拟机\n一个假装是计算机的程序。这看起来可能有些多余，但虚拟机创建和启动速度很快，而且在虚拟机内部进行的更改会被限制在该虚拟机内部中，因此我们可以安装新的\
  \ `packages` 或运行完全不同的操作系统，而不会影响底层计算机。\n\n### 访问者模式\n一种`设计模式`，其中要执行的操作会依次轮数据结构中的每个元素。它通常通过让一个知道如何到达结构元素的“访问者”生成器来实现，该访问者为每个元素提供一个要调用的函数或方法，并执行特定的操作。另见：`迭代器模式`。\n\
  \n### 观察点 (watchpoint)\n由调试器监控的位置或变量。如果该位置的值或该变量中的值发生变化，调试器将停止运行并给用户一个检查程序的机会。\n\
  \n### 字 (内存字)\n特定处理器最自然处理的内存单元。虽然字节（byte）的大小是固定的（8 位），但字根据处理器可以是 16 位、32 位或 64 位。\n\
  \n### XML (可扩展标记语言)\n一组用于定义类似 `HTML` 标签并使用它们来格式化文档（通常是数据）的规则。XML 在 2000 年初非常流行，但其复杂性导致许多程序员转而采用\
  \ `JSON`。\n\n### YAML (YAML 并不是标记语言)\n一种使用缩进而非 `JSON` 中的大圆括号和逗号来表示嵌套数据的方法。YAML 常用于配置文件以及为不同风格的\
  \ `Markdown` 文档定义`parameters`。\n\n### Z 缓冲 (z-buffering)\n一种绘图方法，它跟踪每个像素“下方”内容的深度，以便显示距离观察者最近的内容。\n\
