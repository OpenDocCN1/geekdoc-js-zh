  \ Python 代码将 Markdown 转换为 HTML、填充交叉引用等。为了保持这些代码的可读性，我们使用 `black¹`、`flake8²` 和 `isort³`\
  \ 来检查行是否过长、类和函数名称是否一致、模块导入顺序是否一致以及其他数十种问题。\n\n检查工具通常被称为 `linters`（检查器），因为早期一种发现\
  \ C 程序中垃圾代码的类似工具被称为 `lint`。许多项目坚持要求代码在提交到版本控制之前通过 lint 检查。为了展示 linters 的工作原理，本章构建了一组工具，用于查找字典中的重复键、查找未使用的变量，并创建一个表格显示层级结构中哪些类定义了哪些方法。\n\
  \n## 13.1 机制\n\n第 11 章 将 HTML 表示为 DOM 树。我们也可以将程序的结构表示为抽象语法树 (AST)，其节点代表函数、语句、数组索引等。\n\
  \nPython 的 `ast⁴` 模块将解析源代码并为我们生成 AST。例如，图 13.1 显示了下面简短程序的 AST 关键部分：\n\n```python\n\
  def double(x):\n  return 2 * x\n\nresult = double(3)\n```\n\n![](img/fig13_1.jpg)\n\
  \n图 13.1： 简短程序的 AST 结构。\n\nAST 包含了许多细节。如果我们想看到它们，可以使用 `ast.parse` 来生成 AST 并使用 `ast.dump`\
  \ 来显示。\n\n\n\n\n\n### 3. `position` 方法依赖于这样一个事实：AST 中的每个节点都记录其在源代码中的来源。\n\n要使用此类类，我们需要读取想要分析的程序源代码，对其进行解析，然后调用我们类的\
  \ `visit` 方法来触发递归：\n\n```python\nwith open(sys.argv[1], \"r\") as reader:\n  source\
  \ = reader.read()\ntree = ast.parse(source)\ncollector = CollectNames()\ncollector.visit(tree)\n\
  print(collector.names)\n```\n\n```python\npython walk_ast.py simple.py\n```\n\n\
  ```python\n{'double': {(1, 0)}, 'result': {(4, 0)}}\n```\n\n再多花一点功夫我们就可以记录类名，然后检查（例如）类名是否使用了\
  \ `CamelCase`，而函数和变量名是否使用了 `pothole_case`（下划线命名法）。我们将在练习中解决这个问题。\n\n## 13.2 查找重复键\n\
  \n许多程序在字典中存储配置。随着字典变得越来越大，程序员很容易无意中重新定义值。例如，这段简短代码中的字典对键 \"third\" 有两个项目：\n\n```python\n\
  has_duplicates = {\n    \"third\": 3,\n    \"fourth\": 4,\n    \"fourth\": 5,\n\
  \    \"third\": 6\n}\nprint(has_duplicates)\n```\n\nPython 可以将此视为错误、保留第一个条目、保留最后一个条目或某种方式合并条目。如下方的所示，它选择了第三种方案：\n\
  \n```python\n{'third': 6, 'fourth': 5}\n```\n\n我们只需要几行代码和 Python `collections` 模块中的\
  \ `Counter` 类，就可以构建一个查找像 `has_duplicates` 这样的字典的 linter（该类实现了一种用于计算键出现次数的特殊字典）。我们为\
  \ `NodeVisitor` 定义一个 `visit_Dict` 方法，将每个常量键添加到计数器中，然后查找出现过一次以上的的键：\n\n```python\n\
  class FindDuplicateKeys(ast.NodeVisitor):\n    def visit_Dict(self, node):\n   \
  \     seen = Counter()\n        for key in node.keys:\n            if isinstance(key,\
  \ ast.Constant):\n                seen[key.value] += 1\n        problems = {k for\
  \ (k, v) in seen.items() if v > 1}\n        self.report(node, problems)\n      \
  \  self.generic_visit(node)\n\n    def report(self, node, problems):\n        if\
  \ problems:\n            msg = \", \".join(p for p in problems)\n            print(f\"\
  duplicate key(s) {{{msg}} at {node.lineno}\")\n```\n\n当我们解析 `has_duplicate_keys.py`并将\
  \ AST 传递给 `FindDuplicateKeys` 时，我们得到：\n\n```python\nduplicate key(s) {fourth, third}\
  \ at 1\n```\n\n## 13.3 查找未使用变量\n\n查找未使用变量（分配了值但从未使用过的变量）比我们之前的示例更具挑战性。问题在于作用域：在函数或方法中定义的变量可能与定义的定义的变量相同，但它们是不同的变量。\n\
  \n让我们从定义一个处理模块和函数的变量类开始。由于函数可以定义在模块和其他函数内部，我们类的构造函数创建一个列表，作为栈来跟踪我们当前所处的作用域：\n\n\
  ```python\nclass FindUnusedVariables(ast.NodeVisitor):\n    def __init__(self):\n\
  \        super().__init__()\n        self.stack = []\n\n    def visit_Module(self,\
  \ node):\n        self.search(\"global\", node)\n\n    def visit_FunctionDef(self,\
  \ node):\n        self.search(node.name, node)\n```\n\n我们可以仅使用包含三个值的列表来记录每个作用域的信息，但使用\
  \ `namedtuple`（同样来自 Python 的 `collections` 模块）可以明确告诉读者每个作用域由什么组成：\n\n```python\n\
  Scope = namedtuple(\"Scope\", [\"name\", \"load\", \"store\"])\n```\n\n每当我们遇到一个新的作用域时，都会栈中推入一个新的\
  \ `Scope` 三元组，其中包含名称、一组使用的变量和一组定义的变量。然后，我们调用 `generic_visit` 从栈中弹出作用域并报告任何未使用的变量：\n\
  \n```python\ndef search(self, name, node):\n    self.stack.append(Scope(name, set(),\
  \ set()))\n    self.generic_visit(node)\n    scope = self.stack.pop()\n    unused\
  \ = scope.load - scope.store\n    if unused:\n        print(f\"unused variables\
  \ in {name}: {', '.join(unused)}\")\n```\n\n谜题的最后部分是 `visit_Name`。如果变量正在被读取，`ctx`\
  \ 类型将是 `ast.Load`。如果被写入，`ctx` 类型将是 `ast.Store`。\n\n```python\ndef visit_Name(self,\
  \ node):\n    if isinstance(node.ctx, ast.Load):\n        self.stack[-1].load.add(node.id)\n\
  \    elif isinstance(node.ctx, ast.Store):\n        self.stack[-1].store.add(node.id)\n\
  ```\n\n当我们解析 `has_duplicate_keys.py`并将 AST 传递给 `FindDuplicateKeys` 时，我们得到：\n\n```python\n\
  duplicate key(s) {fourth, third} at 1\n```\n\n\n\n\n\n你可能是在浏览器中以 HTML 格式、作为电子书或在打印页面上阅读这些内容。在这三种情况下，`layout\
  \ engine`（布局引擎）都会接收一些文本和布局指令，并决定每个字符和图像的位置。为了探索它们是如何运作的，我们将根据 Matt Brubeck 的教程以及\
  \ Pavel Panchekha 和 Chris Harrelson 的书籍*Web Browser Engineering》（网页浏览器工程）构建一个小型布局引擎。由于我们的重点是布局，我们将自己创建对象来表示\
  \ DOM 节点，而不是解析 HTML。\n\n## 14.1 尺寸计算\n\n让我们从`简单模式`开始，不考虑外边距、内边距、换行或其他复杂情况。我们能放在屏幕上的所有内容都表示为一个矩形单元格，每个单元格都是行、列或`block`（块）。块有固定的宽度和高度：\n\
  \n```python\n class Block:\n    def __init__(self, width, height):\n        self.width\
  \ = width\n        self.height = height\n\n    def get_width(self):\n        return\
  \ self.width\n\n    def get_height(self):\n        return self.height\n```\n\n![](img/fig14_1.jpg)\n\
  \n图 14.1: 的坐标系。\n\n行水平方向排列一个或多个单元格；其宽度是所有子元素宽度的之和，而高度是最高的子元素的高度（[图 14.2]）：\n\n```python\n\
  \ class Row:\n    def __init__(self, *children):\n        self.children = list(children)\n\
  \n    def get_width(self):\n        return sum([c.get_width() for c in self.children])\n\
  \n    def get_height(self):\n        return max(\n            [c.get_height() for\
  \ c in self.children],\n            default=0\n        )\n```\n\n![](img/fig14_2.jpg)\n\
  \n图 14.2::\n        self.children = list(children)\n\n    def get_width(self):\n\
  \        return max(\n            [c.get_width() for c in self.children],\n    \
  \        default=0\n        )\n\n    def get_height(self):\n        return sum([c.get_height()\
  \ for c in self.children])\n```\n\n行和列相互嵌套：一行不能跨越两列或更多列，一列不能跨越两行之间的边界。因此，我们可以将文档表示为一棵树，并在每次需要时计算每个单元格的宽度和高度。这种方法简单但效率低下：我们可以同时计算宽度和高度并缓存这些值以避免重复计算，但我们之所以称“简单模式”是有原因的。\n\
  \n尽管代码简单，它仍然可能包含错误（在开发过程中确实如此），因此在尝试构建更复杂的内容之前，我们编写一些测试来检查它是否正常工作。其中一个测试是：\n\n```python\n\
  \ def test_lays_out_a_grid_of_rows_of_columns():\n    fixture = Col(\n        Row(Block(1,\
  \ 2), Block(3, 4)),\n        Row(Block(5, 6), Col(Block(7, 8), Block(9, 10)))\n\
  \    )\n    assert fixture.get_width() == 14\n    assert fixture.get_height() ==\
  \ 22\n```\n\n## 14.2 定位\n\n一旦我们知道了单元格的大小，就可以确定将它们放在哪里。假设我们从浏览器的左上角开始：上（upper）是因为我们从上到下布局页面，左（left）是因为我们从左到右进行。如果单元格是`block`，我们就将其放置在那里。相反，如果单元格是`row`，我们获取它的高度，然后计算其底部为\
  \ `y1 = y0 + height`。然后我们将第一个子元素的左上角放在 `(x0, y1-height)`，第二个子元素放在 `(x0 + width,\
  \ y1-height)`，依此类推。同样地，如果单元格是`column`，我们将第一个子元素放在 `(x0, y0)`，下一个放在 `(x0, y0 + height)`，依此类推。\n\
  \n![](img/fig14_3.jpg)\n\n图 14.3::\n    def __init__(self, width, height):\n   \
  \     super().__init__(width, height)\n        self.x0 = None\n        self.y0 =\
  \ None\n\n    def place(self, x0, y0):\n        self.x0 = x0\n        self.y0 =\
  \ y0\n\n    def report(self):\n        return [\n            \"block\",\n      \
  \      self.x0, self.y0,\n            self.x0 + width, self.y0 + height\n      \
  \  ]\n```\n\n`PlacedCol` 类的构造函数和报告方法看起来一样。它的放置方法是：\n\n```python\n def place(self,\
  \ x0, y0):\n    self.x0 = x0\n    self.y0 = y0\n\n# (注：原文代码块格式似乎乱了，已根据逻辑对齐)\n```\n\
  \n（注：原文中部分代码块的结构在粘贴时出现了错乱，以下为基于上下文的还原逻辑）\n\n```python\n def place(self, x0, y0):\n\
  \    self.x0 = x0\n    self.y0 = y0\n\n# 对于 Row 的放置方法\n def place(self, x0, y0):\n\
  \    self.x0 = x0\n    self.y0 = y0\n    current_y = y0\n    for child in self.children:\n\
  \        child.place(x0, current_y)\n        current_y += child.get_height()\n\n\
  # 对于 Col 的放置方法\n def place(self, x0, y0):\n    self.x0 = x0\n    self.y0 = y0\n\
  \    current_x = x0\n    for child in self.children:\n        child.place(current_x,\
  \ y0)\n        current_x += child.get_width()\n```\n\n再次，我们编写测试来确保一切运行正常。其中一个测试是：\n\
  \n```python\n def test_places_column_of_blocks():\n    fixture = Col(\n        Row(Block(1,\
  \ 2), Block(3, 4)),\n        Row(Block(5, 6), Col(Block(7, 8), Block(9, 10)))\n\
  \    )\n    fixture.place(0, 0)\n    assert fixture.report() == [\n        \"col\"\
  , 0, 0, 2, 5,\n        [\"block\", 0, 0, 1, 2],\n        [\"block\", 1, 0, 4, 4],\n\
  \        [\"block\", 0, 2, 5, 4],\n        [\"block\", 5, 2, 7, 5],\n    ]\n```\n\
  \n## 14.3 渲染\n\n我们在图纸上画了块来确定上述测试的预期答案。我们可以通过创建一个空格字符的“屏幕”并让每个块自己绘制来实现类似的操作。如果我们从树的根开始，子元素将覆盖父元素的标记，这将自动产生正确的结果。（3D\
  \ 图形中这种更复杂的版本被称为 `z-buffering`，它跟踪每个像素的深度，以便无论顺序如何都能正确绘制对象。）\n\n![](img/fig14_4.jpg)\n\
  \n图 14.4::\n    screen = []\n    for i in range(height):\n        screen.append([\"\
  \ \"] * width)\n    return screen\n```\n\n我们将使用连续的小写字母显示每个块，即根块将使用‘a’，而它的子元素将是‘b’、‘c’等。\n\
  \n```python\n def draw(screen, node, fill=None):\n    fill = next_fill(fill)\n \
  \   node.render(screen, fill)\n    if hasattr(node, \"children\"):\n        for\
  \ child in node.children:\n            fill = draw(screen, child, fill)\n    return\
  \ fill\n\ndef next_fill(fill):\n    return \"a\" if fill is None else chr(ord(fill)\
  \ + 1)\n```\n\n为了教每种类型的单元格渲染，我们从现有的类派生新类，并给这些新类中的每一个一个具有相同签名的 `render` 方法。由于 Python\
  \ 支持多继承，我们可以使用 `mixin class`（[图 14.5]）。`Renderable` 混合类是：\n\n```python\nclass Renderable:\n\
  \    def render(self, screen, fill):\n        for ix in range(self.get_width()):\n\
  \            for iy in range(self.get_height()):\n                screen[self.y0\
  \ + iy][self.x0 + ix] = fill\n```\n\n使用它，新的单元格类简单如下：\n\n\n\n\n\n```python\nclass\
  \ RenderedBlock(PlacedBlock, Renderable):\n    pass\n\nclass RenderedCol(PlacedCol,\
  \ Renderable):\n    pass\n\nclass RenderedRow(PlacedRow, Renderable):\n    pass\n\
  ```\n\n使用渲染后，简单的测试会变得易读一些，尽管我们仍然必须在纸上画图来确定预期的结果：\n\n```python\ndef test_renders_a_column_of_two_blocks():\n\
  \    fixture = Col(Block(1, 1), Block(2, 4))\n    fixture.place(0, 0)\n    expected\
  \ = \"\\n\".join([\"ba\", \"cc\", \"cc\", \"cc\", \"cc\"])\n    assert render(fixture)\
  \ == expected\n```\n\n我们的测试难以理解，这一事实说明我们应该进行更多的测试。我们很容易得到一个错误的结果并说服自己它是正确的；这种**确认偏差**在软件开发中非常常见。\n\
  \n## 14.4 换行（Wrapping）\n\n浏览器与打印页面之间最大的区别之一是浏览器中的文本会随着窗口大小的调整自动换行。（现在的另一个区别是，打印页面不会监视我们，尽管无疑有人正在研究这一点。）\n\
  \n在我们的布局引擎中添加换行的第一步是固定行的宽度。如果子元素的总宽度大于行的宽度，布局引擎就需要对子元素进行换行处理。这假设列可以根据需要任意增长，即我们可以通过垂直方向增长来补偿水平方向的限制。它还假设行的任何一个子元素的宽度都不大于行的宽度，以便每个元素在必要时都能放入自己的一行中。我们将在练习中查看当这种情况不成立时会发生什么。\n\
  \n我们的布局引擎通过转换树来管理换行。块的高度和宽度是固定的，因此它们保持不变。列也是如此，但由于它们拥有可能需要换行的子元素，代表列的类需要一个新方法：\n\
  \n```python\nclass WrappedBlock(PlacedBlock):\n    def wrap(self):\n        return\
  \ self\n\nclass WrappedCol(PlacedCol):\n    def wrap(self):\n        return PlacedCol(*[c.wrap()\
  \ for c in self.children])\n```\n\n（上述代码最后一行传递给 `PlacedCol` 的列表前的 `*` 是第 2 章中引入的展开操作（spreading）的另一种用法。）\n\
  \n行承担了所有的繁重工作。每个原始行都被替换为一个新行，该新行包含一个带有一个或多行的列，每一行都是换行单元的“一行”（图 14.6）。当所有内容都能放入单行中时，这种替换是不必要的，但编写每次都执行此操作的代码是最简单的；我们将在练习中查看如何提高其效率。\n\
  \n![](img/fig14_6.jpg)\n\n图 14.6::\n    def __init__(self, width, *children):\n\
  \        super().__init__(*children)\n        assert width >= 0, \"需要非负宽度\"\n  \
  \      self.width = width\n\n    def get_width(self):\n        return self.width\n\
  ```\n\n换行将子元素放入“桶”中，然后将这些桶转换为由行组成的列中的行：\n\n```python\ndef wrap(self):\n    children\
  \ = [c.wrap() for c in self.children]\n    rows = self._bucket(children)\n    new_rows\
  \ = [PlacedRow(*r) for r in rows]\n    new_col = PlacedCol(*new_rows)\n    return\
  \ PlacedRow(new_col)\n```\n\n为了对子元素进行分桶，我们将它们逐一个添加到添加到临时列表中。如果添加另一个节点会导致列表中节点的总宽度过大，我们使用该节点来启动一个新的临时列表：\n\
  \n```python\ndef _bucket(self, children):\n    result = []\n    current_row = []\n\
  \    current_x = 0\n\n    for child in children:\n        child_width = child.get_width()\n\
  \        if (current_x + child_width) <= self.width:\n            current_row.append(child)\n\
  \            current_x += child_width\n        else:\n            result.append(current_row)\n\
  \            current_row = [child]\n            current_x = child_width\n    result.append(current_row)\n\
  \    return result\n```\n\n再次，我们引入之前所有的测试，并编写一些新测试来测试我们添加的功能：\n\n```python\ndef\
  \ test_wrap_a_row_of_two_blocks_that_do_not_fit_on_one_row():\n    fixture = WrappedRow(3,\
  \ WrappedBlock(2, 1), WrappedBlock(2, 1))\n    wrapped = fixture.wrap()\n    wrapped.place(0,\
  \ 0)\n    assert wrapped.report() == [\n        \"row\",\n        0, 0, 2, 2,\n\
  \        [\n            \"col\",\n            0, 0, 2, 2,\n            [\"row\"\
  , 0, 0, 2, 1, [\"block\", 0, 0, 2, 1]],\n            [\"row\", 0, 0, 2, 1, [\"block\"\
  , 0, 0, 2, 1]],\n        ],\n    ]\n```\n\n换行将行的子元素放入桶中，然后将这些桶转换为由行组成的列中的行：（此处省略了部分子元素的逻辑描述）\n\
  \n我们可以让行来处理缩放，但如果我们愿意接受，让列来处理会更好。\n\n## 14.5 总结\n\n图 14.7 总结了本章引入的思想。真实的页面布局比我们描述的复杂得多。\n\
  \n## 14.6 练习\n\n### 重构（Refactoring）\n重构表示块、行和列的类，使得：\n1. 它们都继承自同一个父类。\n2. 公共行为定义在该父类中（使用占位符方法）。\n\
  \n### 展开（Removing Spreads）\n本章的代码大量使用了变参数和展开，即使用 `*children` 来捕获多个参数。你觉得重写后的代码更容易理解了吗？\n\
  \n### 回收（Recycling）\n修改换行代码，只有在需要时才创建行和列。例如，如果宽度为 10 的行包含一个 4 字符的文本节点，则不插入新的行和列。\n\
  \n### 渲染背景（Rendering Clear Background）\n修改渲染代码，只显示块中的文本，即将行和列中的空白渲染为空格。\n\n### 文本裁剪（Clipping\
  \ Text）\n1. 修改换行和渲染逻辑，如果文本块对于可用空间太宽，则裁剪掉额外的字符。例如，如果宽度为 5 的列包含“unfittable”，只显示“unfit”。\n\
  2. 扩展你的解决方案，根据需要在空格处换行以避免裁剪。\n\n### 双向渲染（Bidirectional Rendering）\n修改现有软件，根据请求从左到右或从右到左进行渲染。\n\
  \n### 等宽（Equal Sizing）\n修改现有代码以支持弹性列，即使行中的所有列自动调整为相同的宽度。如果列数不能整除行宽，则从左到右尽可能平均分配剩余空间。\n\
  \n### 属性（Properties）\n查看 Python `@property` 装饰器的文档，并修改块类，用属性 `width` 和 `height`\
  \ 替换 `get_width` 和 `get_height` 方法。\n\n### 画边框（Drawing Borders）\n1. 修改现有代码，使元素带有如下边框：\n\
  ```\n+----+\n|text|\n+----+\n```\n\n### 填充元素（Padding Elements）\n修改现有代码，使得：\n1. 作者可以为行和列元素定义填充属性。\n\
  2. 当节点被渲染时，在内容的四个侧添加相应数量的空格。\n\n例如，填充为 1 的字符串“text”将渲染为：\n\n```\n + - - - - -+\n\
  |         |\n|    text   |\n|         |\n+ - - - - -+\n```\n\n\n\n\n线条显示渲染的外部边界。\n\
  \n### 表格\n\n添加另一种节点类型 `Table`，满足以下条件：\n\n1. 表格的所有子节点必须是行。\n2. 每一行必须包含完全相同的列数。\n\
  3. 当表格渲染时，每一列在每行中的宽度必须相同。\n\n# 15 性能剖析\n\n在线出版书籍的一个危险是过度痴迷于分析数据。今天有多少人访问了网站？他们看了哪些页面，看了多久？无论我们使用\
  \ `Excel`、`SQL` 还是 `Python`，我们几乎肯定会在分析具有具有命名列和多行的表格。这类表格被称为 `dataframes`（数据框），当我们处理大型数据集时，它们的性能至关重要。因此，本章将通过两种方式实现\
  \ `dataframes`，并展示如何比较它们的性能。\n\n## 15.1 选项\n\n首先，让我们创建一个抽象类 `DataFrame`，定义我们的数据框类将支持的方法。该类要求具体类来实现下面显示的方法：\n\
  \n```python\n class DataFrame:\n    def ncol(self):\n        \"\"\"报告列数.\"\"\"\n\
  \n    def nrow(self):\n        \"\"\"报告行数.\"\"\"\n\n    def cols(self):\n      \
  \  \"\"\"返回列名的集合.\"\"\"\n\n    def eq(self, other):\n        \"\"\"检查与另一个数据框的相等性.\"\
  \"\"\n\n    def get(self, col, row):\n        \"\"\"获取标量值.\"\"\"\n\n    def select(self,\
  \ *names):\n        \"\"\"选择命名的列子集.\"\"\"\n\n    def filter(self, func):\n     \
  \   \"\"\"通过测试值选择行子集.\"\"\"\n```\n\n对于我们的第一个可用实现，我们将派生一个类 `DfRow`，它使用行存储（`row-wise`\
  \ storage）（[图 15.1]）。数据框存储为字典列表，每个字典代表一行。所有的字典都必须具有相同的键，这样“列”的概念才有意义，并且与特定键关联的值必须都具有相同的类型。\n\
  \n![](img/fig15_1.jpg)\n\n[图 15.1: 以行形式存储数据框数据。]\n\n我们的第二个实现 `DfCol` 将使用列存储（`column-wise`\
  \ storage）（[图 15.2]）。每一列都存储为一个值的列表，且所有值的类型都是相同的。数据框本身是此类列表的字典，所有列表的长度相同，因此任何行都不会有空隙。我们如何存储数据决定了哪些方法容易实现，哪些难以实现，以及哪些快速或缓慢。\n\
  \n![](img/fig15_2.jpg)\n\n[图 15.2: 以列形式存储数据框数据。]\n\n## 15.2 行存储\n\n我们首先从 `DataFrame`\
  \ 派生 `DfRow` 并编写它的构造函数，该函数接受一个字典列表作为参数，检查它们之间的一致性并保存它们：\n\n```python\n from df_base\
  \ import DataFrame\nfrom util import dict_match\n\nclass DfRow(DataFrame):\n   \
  \ def __init__(self, rows):\n        assert len(rows) > 0\n        assert all(dict_match(r,\
  \ rows[0]) for r in rows)\n        self._data = rows\n```\n\n检查一组字典是否具有相同键以及与这些键关联相同类型值的辅助函数是：\n\
  \n```python\n def dict_match(d, prototype):\n    if set(d.keys()) != set(prototype.keys()):\n\
  \        return False\n    return all(type(d[k]) == type(prototype[k]) for k in\
  \ d)\n```\n\n注意，`DfRow` 的构造函数将所有行与第一行进行比较。这意味着我们无法创建一个空数据框，即没有行的数据框。这个限制并不是我们原始设计的一部分：它是实现上的一个意外，可能会让我们的用户感到惊讶。在原型设计阶段不修复它是没关系的，但我们将在练习中寻找解决它的方法。\n\
  \n`DataFrame` 需要的四个方法在行存储之上易于实现的，尽管再次，我们的实现假设至少有一行：\n\n```python\n def ncol(self):\n\
  \    return len(self._data[0])\n\ndef nrow(self):\n    return len(self._data)\n\n\
  def cols(self):\n    return set(self._data[0].keys())\n\ndef get(self, col, row):\n\
  \    assert col in self._data[0]\n    assert 0 <= row < len(self._data)\n    return\
  \ self._data[row][col]\n```\n\n检查相等性也相对简单。如果两个数据框具有完全相同的列且每列中的值也相同，则它们是相同的：\n\n\
  ```python\n def eq(self, other):\n    assert isinstance(other, DataFrame)\n    for\
  \ (i, row) in enumerate(self._data):\n        for key in row:\n            if key\
  \ not in other.cols():\n                return False\n            if row[key] !=\
  \ other.get(key, i):\n                return False\n    return True\n```\n\n注意，我们使用\
  \ `other.cols()` 和 `other.get()` 而不是直接访问另一个数据框。我们计划以几种方式实现数据框，并且我们可能想要比较这些实现类的实例。由于它们可能有不同的内部结构，执行此操作唯一安全的方法是依赖接口。\n\
  \n我们最后的操作是选择（selection），它返回原始数据框列的子集，以及过滤（filtering），它返回行的子集。由于我们不知道用户可能想要多少列，我们给\
  \ `select` 方法提供了一个单一参数 `*names`，它可以捕捉零或多个位置参数。然后我们构建一个新的字典列表，其中仅包含这些名称的字段（[图 15.3]）：\n\
  \n```python\n def select(self, *names):\n    assert all(n in self._data[0] for n\
  \ in names)\n    rows = [{key: r[key] for key in names} for r in self._data]\n \
  \   return DfRow(rows)\n```\n\n![](img/fig15_3.jpg)\n\n[图 15.3: 从行存储的数据中选择列。]\n\n\
  我们现在需要决定如何过滤行。典型的过滤条件包括“保留 `red` 非零的行”、“保留 `red` 大于 `green` 的行”以及“保留 `red+green`\
  \ 在 `blue` 的 10% 以内的行”。与其尝试预测每可能的规则，我们要求用户定义参数与表格列名匹配的函数。例如，如果我们有这个测试固件：\n\n```python\n\
  \ def odd_even():\n    return DfRow([{\"a\": 1, \"b\": 3}, {\"a\": 2, \"b\": 4}])\n\
  ```\n\n那么我们应该能够编写这样的测试：\n\n```python\n def test_filter():\n    def odd(a, b):\n\
  \        return (a % 2) == 1\n\n    df = odd_even()\n    assert df.filter(odd).eq(DfRow([{\"\
  a\": 1, \"b\": 3]))\n```\n\n我们通过使用 `**` 将行展开到函数参数来实现这一点（第 2 章）。如果行中的键与参数不匹配或反之，Python\
  \ 将抛出异常，但这可能正是我们想要的。使用这，`DfRow.filter` 的实现为：\n\n```python\n def filter(self, func):\n\
  \    result = [r for r in self._data if func(**r)]\n    return DfRow(result)\n```\n\
  \n注意，由 `filter` 创建的数据框重用了原始数据框的行（[图 15.4]）。只要数据框是不可变的，即其内容从不被就地修改，这样做就是安全且高效的。大多数数据库都这样做：回收内存可以节省一点时间，但通常会让\
  \ Bug 变得难以追踪。\n\n![](img/fig15_4.jpg)\n\n[图 15.4: 过滤行存储的数据。]\n\n## 15.3 列存储\n\n\
  在完成这些思考后，我们的列存储数据框类写起来简单一些。我们像以前一样从它的构造函数开始：\n\n```python\n from df_base import\
  \ DataFrame\nfrom util import all_eq\n\nclass DfCol(DataFrame):\n    def __init__(self,\
  \ **kwargs):\n        assert len(kwargs) > 0\n        assert all_eq(len(kwargs[k])\
  \ for k in kwargs)\n        for k in kwargs:\n            assert all_eq(type(v)\
  \ for v in kwargs[k])\n        self._data = kwargs\n```\n\n并使用辅助函数 `all_eq` 检查任何列中的所有值是否具有相同的类型：\n\
  \n\n\n\n\n```python\n def all_eq(*values):\n    return (not values) or all(v ==\
  \ values[0] for v in values)\n```\n\n对于 `DfRow` 来说，编写简单的这四个方法对于 `DfCol` 同样简单，尽管由于我们的原型实现意外地不允许了空数据框：\n\
  \n```python\n def ncol(self):\n    return len(self._data)\n\ndef nrow(self):\n \
  \   n = list(self._data.keys())[0]\n    return len(self._data[n])\n\ndef cols(self):\n\
  \    return set(self._data.keys())\n\ndef get(self, col, row):\n    assert col in\
  \ self._data\n    assert 0 <= row < len(self._data[col])\n    return self._data[col][row]\n\
  ```\n\n与 `DfRow` 一样，检查相等性的方法依赖于所属类的内部细节，但使用 `DataFrame` 定义的接口来访问另一个对象：\n\n```python\n\
  \ def eq(self, other):\n    assert isinstance(other, DataFrame)\n    for n in self._data:\n\
  \        if n not in other.cols():\n            return False\n        for i in range(len(self._data[n])):\n\
  \            if self.get(n, i) != other.get(n, i):\n                return False\n\
  \    return True\n```\n\n为了选择列，我们选取调用者指定的列并使用它们来创建一个新的数据框。再次，这复用了现有的存储：\n\n```python\n\
  \ def select(self, *names):\n    assert all(n in self._data for n in names)\n  \
  \  return DfCol(**{n: self._data[n] for n in names})\n```\n\n![](img/fig15_5.jpg)\n\
  \n图 15.5：列级选择。\n\n最后，我们需要过滤列式数据框的行。这样做是复杂的：由于值存储在列中，我们必须提取属于每一行的值，并将它们传递给用户定义的过滤函数（图\
  \ 15.6）。如果这还不够，我们希望仅对用户函数需要的列执行此操作。\n\n![](img/fig15_6.jpg)\n\n图 15.6： 从列中提取值以创建临时行。\n\
  \n目前，我们将通过要求用户过滤函数定义参数来匹配数据框的所有列（无论它们是否被用于过滤）来解决这个问题。然后我们将构建一个包含“行”中所有值的（即跨列的对应值）临时字典，并使用\
  \ `**` 将其展开到过滤函数。附录 B 查看了一种更安全但更复杂的方法。\n\n```python\n def filter(self, func):\n\
  \    result = {n: [] for n in self._data}\n    for i in range(self.nrow()):\n  \
  \      args = {n: self._data[n][i] for n in self._data}\n        if func(**args):\n\
  \            for n in self._data:\n                result[n].append(self._data[n][i])\n\
  \    return DfCol(**result)\n```\n\n是时候写一些测试了。这一个检查我们是否可以构造带有某些值的数据框：\n\n```python\n\
  \ def test_construct_with_two_pairs():\n    df = DfCol(a=[1, 2], b=[3, 4])\n   \
  \ assert df.get(\"a\", 0) == 1\n    assert df.get(\"a\", 1) == 2\n    assert df.get(\"\
  b\", 0) == 3\n    assert df.get(\"b\", 1) == 4\n```\n\n而这一个检查 filter 是否工作正常：\n\n\
  ```python\n def test_filter():\n    def odd(a, b):\n        return (a % 2) == 1\n\
  \    df = DfCol(a=[1, 2], b=[3, 4])\n    assert df.filter(odd).eq(DfCol(a=[1], b=[3]))\n\
  ```\n\n## 5.4 性能\n\n我们的两个实现具有相同的接口，那么我们如何选择？\n\n为了比较这些类的速度，让我们写一个短程序来创建数据框，并测量过滤行需要多长时间。为了保持简单，我们将创建具有整数值的数据框，并测量选择列需要多长时间，以查看其保留的行。\n\
  \n```python\nRANGE = 10\n\ndef make_col(nrow):\n    fill = {n: [0]*nrow for n in\
  \ [\"a\", \"b\"]}\n    return DfCol(**fill)\n\ndef make_row(nrow):\n    fill = {\"\
  a\": [0 for _ in range(nrow)], \"b\": [0 for _ in range(nrow)]}\n    return DfRow(**fill)\n\
  ```\n\n由于 `DfCol` 和 `DfRow` 派自相同的基类，`time_filter` 并不关心我们使用哪一个。\n\n```python\nimport\
  \ time\n\ndef time_filter(df, func):\n    start = time.time()\n    df.filter(func)\n\
  \    return time.time() - start\n\ndef time_select(df, names):\n    start = time.time()\n\
  \    df.select(*names)\n    return time.time() - start\n```\n\n最后，我们写一个接受字符串列表（如\
  \ 3x3 或 100x20）的函数，创建数据框，计时操作并报告结果。我们调用这个函数 `sweep` 是为了在不同的参数执行代码：\n\n```python\n\
  def sweep(sizes):\n    result = []\n    for (nrow, ncol) in sizes:\n        df_col\
  \ = make_col(nrow)\n        df_row = make_row(nrow)\n        times = [\n       \
  \     time_filter(df_col, lambda a, b: a % 2 == 0),\n            time_select(df_col,\
  \ [\"a\", \"b\"]),\n            time_filter(df_row, lambda a, b: a % 2 == 0),\n\
  \            time_select(df_row, [\"a\", \"b\"]),\n        ]\n        result.append([nrow,\
  \ ncol, *times])\n    return result\n```\n\n结果显示在 表 15.1 和 图 15.7。对于一个 1000 × 1000\
  \ 的数据框，列式选择比行式存储快 250 倍，而过滤则慢 1.8 倍。\n\n\n\n\n再深入观察一下，`DfCol.filter` 中的字典推导式也花费了大量时间。这并不意外：当我们进行过滤时，会将每一行的值从列中复制到一个临时字典中，而构建所有这些临时字典会累积大量时间。\n\
  \n## 15.5 总结\n\n图 15.8 总结了本章介绍的核心思想。最重要的的一点是，实验可以帮助我们决定如何实现软件的关键功能，但实验的结果取决于我们具体测量了什么。良好的软件设计人员一直在收集和分析数据，以确定一种网站设计是否优于另一种\
  \ [Kohavi2020]，或者提高 CPU 的性能 [Patterson2017]。几个这样的简单实验就能节省几周甚至几个月的错误努力。\n\n![](img/fig15_8.jpg)\n\
  \n图 15.8: 数据框的概念。\n\n## 15.6 练习\n\n### 更高效的过滤\n\n从 `DfCol` 派生一个类并重写其 `filter` 方法，使得用户定义的过滤函数接受零或多个列以及名为\
  \ `i_row` 的行索引作为参数，并返回 `True` 或 `False` 以指示该行是否通过测试。\n\n1. 这会让过滤速度快多少？\n2. 在什么情况下，过滤函数不接受任何列参数会有用？\n\
