  \n\n###\n\n\n\n1.....pip`48 来安装 `Black`49 以。\n2. 在你的电脑上运行你编写的一些程序。（本书根目录下的 `setup.cfg`52\
  \ 包含了我们使用的设置。）这些工具报告了哪些问题？你对哪些问题有异议？53 的。\n\n### 避免开坑\n\n前往本书的 GitHub 仓库 53 查看这些\
  \ open issues。哪些问题让你能够理解？哪些问题让你难以理解？\n\n# 2 对象和类\n\n我们将在课程中创建很多对象和类，如果我们理解了它们的实现，使用它们将会变得容易。这样做是为了：\n\
  \n1. 用什么更自然的方式表示现实世界中的“事物”？\n2. 如何组织代码使其更容易理解、测试和扩展？\n\n## 2.1 对象\n\n作为一个启发性的问题，让我们定义一下绘图包中通用形状必须做的一些事情：\n\
  \n```python\nclass Shape:\n    def __init__(self, name):\n        self.name = name\n\
  \n    def perimeter(self):\n        raise NotImplementedError(\"perimeter\")\n\n\
  \    def area(self):\n        raise NotImplementedError(\"area\")\n```\n\n这样的规范有时被称为**契约**，因为一个[对象]必须满足它才能被视为形状，即必须提供具有这些名称并按照其名称建议的方法。例如，我们可以从\
  \ `Shape` 派生类来表示正方形和圆形。\n\n```python\nclass Square(Shape):\n    def __init__(self,\
  \ name, side):\n        super().__init__(name)\n        self.side = side\n\n   \
  \ def perimeter(self):\n        return 4 * self.side\n\n    def area(self):\n  \
  \      return self.side ** 2\n\nclass Circle(Shape):\n    def __init__(self, name,\
  \ radius):\n        super().__init__(name)\n        self.radius = radius\n\n   \
  \ def perimeter(self):\n        return 2 * math.pi * self.radius\n\n    def area(self):\n\
  \        return math.pi * self.radius ** 2\n```\n\n\n\n\n由于正方形和圆形具有相同的方法，我们可以交替使用它们。这被称为多态，它通过允许使用相关事物的人忽略它们之间的差异来降低认知负载：\n\
  \n```\n examples = [Square(\"sq\", 3), Circle(\"ci\", 2)]\nfor thing in examples:\n\
  \    n = thing.name\n    p = thing.perimeter()\n    a = thing.area()\n    print(f\"\
  {n} has perimeter {p:.2f} and area {a:.2f}\")\n```\n\n```\n sq has perimeter 12.00\
  \ and area 9.00\nci has perimeter 12.57 and area 12.57\n```\n\n但多态是如何工作的呢？我们首先需要理解的是，函数也是对象。虽然字符串中的字节代表字符，而图像中的字节代表像素，但函数中的字节是指令（图\
  \ 2.1）。当 Python 执行 执行下面的代码时，它会在内存中创建一个包含打印字符串指令的对象，并将该对象赋值给变量 `example`：\n\n```\n\
  \ def example():\n    print(\"in example\")\n```\n\n![](img/fig2_1.jpg)\n\n图 2.1:\
  \ 字节可以解释为文本、图像、指令等。\n\n我们可以通过将函数赋值给另一个变量来创建别名，然后通过引用第二个变量来调用函数。这样做不会改变或擦除函数与原始名称之间的连接：\n\
  \n```\n alias = example\nalias()\n```\n\n```\n in example\n```\n\n我们还可以将函数对象存储在列表和字典等数据结构。让我们写一些与原始\
  \ Python 中方法功能相同的函数，并将它们存储在字典中以表示正方形（图 2.2）：\n\n```\n def square_perimeter(thing):\n\
  \    return 4 * thing[\"side\"]\n\ndef square_area(thing):\n    return thing[\"\
  side\"] ** 2\n\ndef square_new(name, side):\n    return {\n        \"name\": name,\n\
  \        \"side\": side,\n        \"perimeter\": square_perimeter,\n        \"area\"\
  : square_area\n    }\n```\n\n![](img/fig2_2.jpg)\n\n图 2.2: 使用字典模拟对象。\n\n如果我们想使用此字典中的其中一个“方法”，我们可以像这样调用它：\n\
  \n```\n def call(thing, method_name):\n    return thingmethod_name\n\nexamples =\
  \ [square_new(\"sq\", 3), circle_new(\"ci\", 2)]\nfor ex in examples:\n    n = ex[\"\
  name\"]\n    p = call(ex, \"perimeter\")\n    a = call(ex, \"area\")\n    print(f\"\
  {n} {p:.2f} {a:.2f}\")\n```\n\n函数调用查找字典中存储的函数，然后将字典作为第一个对象传递给该函数；换句话说，我们没有使用 `obj.meth(arg)`，而是使用\
  \ `obj[\"meth\"]](obj, arg)`。在背后，这（几乎）是对象实际的工作方式。我们可以将对象视为一种特殊的字典。方法只是一个接受正确类型对象作为第一个参数的函数（在\
  \ Python 中通常称为 `self`）。\n\n## 2.2 类\n\n用字典实现对象的一个问题是，它允许每个单独对象的行为都略有不同。在实践中，我们希望对象存储不同的值（例如，不同的正方形有不同的大小），但行为相同（例如，所有正方形应该具有相同的方法）。我们可以通过将方法存储在一个名为\
  \ `Square` 的字典中（对应于一个类），并让每个单独的正方形包含指向该高级字典的引用（图 2.3）。在下面的代码中，该特殊引用使用了键 `_class`：\n\
  \n```\n def square_perimeter(thing):\n    return 4 * thing[\"side\"]\n\ndef square_area(thing):\n\
  \    return thing[\"side\"] ** 2\n\nSquare = {\n    \"perimeter\": square_perimeter,\n\
  \    \"area\": square_area,\n    \"_classname\": \"Square\"\n}\n\ndef square_new(name,\
  \ side):\n    return {\n        \"name\": name,\n        \"side\": side,\n     \
  \   \"_class\": Square\n    }\n```\n\n![](img/fig2_3.jpg)\n\n图 2.3: 使用字典模拟类。\n\n\
  调用方法涉及多一次查找，因为我们必须从对象到类，但再次我们使用对象作为第一个参数来调用“方法”：\n\n```\n def call(thing, method_name):\n\
  \    return thing[\"_class\"]method_name\n\nexamples = [square_new(\"sq\", 3), circle_new(\"\
  ci\", 2)]\nfor ex in examples:\n    n = ex[\"name\"]\n    p = call(ex, \"perimeter\"\
  )\n    a = call(ex, \"area\")\n    c = ex[\"_class\"][\"_classname\"]\n    print(f\"\
  {n} is {c}: {p:.2f} {a:.2f}\")\n```\n\n作为额外奖励，我们现在可以通过检查 `_class` 键指向的内容，可靠地识别对象的类，并询问两个对象是否属于同一类。\n\
  \n## 2.3 参数\n\n我们目前为止定义的方法在对象字典的值上进行操作，但没有一个方法接受任何额外的参数。实现这一点有点棘，因为不同的方法可能需要不同数量的参数。我们可以定义\
  \ `call_0`、`call_1`、`call_2` 来处理每种情况，但像大多数语言一样，Python 给了我们更好的方法。如果在函数中定义了一个开头带有\
  \ `*` 的参数，它会捕捉传递给函数的任何与命名参数不匹配的“额外”值。同样，如果我们定义了一个带有双星号 `**` 的参数，它会捕捉任何额外的命名参数：\n\
  \n```\n def show_args(title, *args, **kwargs):\n    print(f\"{title} args '{args}'\
  \ and kwargs '{kwargs}'\")\n\nshow_args(\"nothing\")\nshow_args(\"one unnamed argument\"\
  , 1)\nshow_args(\"one named argument\", second=\"2\")\nshow_args(\"one of each\"\
  , 3, fourth=\"4\")\n```\n\n```\n nothing args '()' and kwargs '{}'\none unnamed\
  \ argument args '(1,)' and kwargs '{}'\none named argument args '()' and kwargs\
  \ '{second': '2'}\none of each args '(3,)' and kwargs '{fourth': '4'}\n```\n\n这种机制有时被称为\
  \ `varargs`（variable arguments 的缩写）。一种互补的机制 `spreading` 允许我们将一个装满参数的列表或字典展开，以匹配函数的参数：\n\
  \n```\n def show_spread(left, middle, right):\n    print(f\"left {left} middle {middle}\
  \ right {right}\")\n\nall_in_list = [1, 2, 3]\nshow_spread(*all_in_list)\n\nall_in_dict\
  \ = {\"right\": 30, \"left\": 10, \"middle\": 20}\nshow_spread(**all_in_dict)\n\
  ```\n\n```\n left 1 2 3\nleft 10 20 30\n```\n\n有了这些工具，现在我们在 `Square` 类中添加一个方法，告诉我们正方形是否大于用户指定的大小：\n\
  \n```\n def square_larger(thing, size):\n    return call(thing, \"area\") > size\n\
  \nSquare = {\n    \"perimeter\": square_perimeter,\n    \"area\": square_area,\n\
  \    \"larger\": square_larger,\n    \"_classname\": \"Square\"\n}\n```\n\n实现此检查的圆形函数完全相同：\n\
  \n```\n def circle_larger(thing, size):\n    return call(thing, \"area\") > size\n\
  ```\n\n然后我们修改 `call` 将额外的参数捕捉在 `*args` 中，并展开到被调用的函数中：\n\n```\n def call(thing, method_name,\
  \ *args):\n    return thing[\"_class\"]method_name\n```\n\n我们的测试显示这是可行的：\n\n```\n\
  \ examples = [square_new(\"sq\", 3), circle_new(\"ci\", 2)]\nfor ex in examples:\n\
  \    result = call(ex, \"larger\", 10)\n    print(f\"is {ex['name']} larger? {result}\"\
  )\n```\n\n```\n is sq larger? False\n is ci larger? True\n```\n\n然而，我们现在有两个功能相同的函数——它们之间唯一的区别就是名称。程序中在多个处重复的任何内容最终会导致一个地方出现错误，因此我们需要找到某种共享这些代码的方法。\n\
  \n## 2.4 继承\n\n我们需要的工具是继承。为了看到它在 Python 中是如何工作的，让我们在原始的 `Shape` 类中添加一个名为 `density`\
  \ 的方法，该方法使用类定义的其他方法。\n\n\n\n\n\n```python\n class Shape:\n    def __init__(self,\
  \ name):\n        self.name = name\n\n    def perimeter(self):\n        raise NotImplementedError(\"\
  perimeter\")\n\n    def area(self):\n        raise NotImplementedError(\"area\"\
  )\n\n    def density(self, weight):\n        return weight / self.area()\n```\n\n\
  ```python\n examples = [Square(\"sq\", 3), Circle(\"ci\", 2)]\nfor ex in examples:\n\
  \    n = ex.name\n    d = ex.density(5)\n    print(f\"{n}: {d:.2f}\")\n```\n\n```\n\
  \ sq: 0.56\nci: 0.40\n```\n\n为了让我们这种基于字典的“类”也能执行相同的操作，我们创建一个字典来表示通用形状，并给它一个计算密度的“方法”：\n\
  \n```python\n def shape_density(thing, weight):\n    return weight / call(thing,\
  \ \"area\")\n\nShape = {\n    \"density\": shape_density,\n    \"_classname\": \"\
  Shape\",\n    \"_parent\": None\n}\n```\n\n然后，我们为像 `Square` 这样的“类”字典添加另一个特殊命名的字段，以跟踪它们的父类：\n\
  \n```python\n Square = {\n    \"perimeter\": square_perimeter,\n    \"area\": square_area,\n\
  \    \"_classname\": \"Square\",\n    \"_parent\": Shape\n}\n```\n\n并修改 `call` 函数来查找请求的方法\
  \ (图 2.4)：\n\n```python\n def call(thing, method_name, *args):\n    method = find(thing[\"\
  _class\"], method_name)\n    return method(thing, *args)\n\ndef find(cls, method_name):\n\
  \    while cls is not None:\n        if method_name in cls:\n            return\
  \ cls[method_name]\n        cls = cls[\"_parent\"]\n    raise NotImplementedError(\"\
  method_name\")\n```\n\n![](img/fig2_4.jpg)\n\n图 2.4: 使用字典搜索来实现继承。\n\n简单的测试显示这正按预期工作：\n\
  \n```python\n examples = [square_new(\"sq\", 3), circle_new(\"ci\", 2)]\nfor ex\
  \ in examples:\n    n = ex[\"name\"]\n    d = call(ex, \"density\", 5)\n    print(f\"\
  {n}: {d:.2f}\")\n```\n\n```\n sq: 0.56\nci: 0.40\n```\n\n不过，我们还有一个最后一个任务要完成：我们需要确保在创建正方形或圆形时，它是正确创建的。简而言之，我们需要实现**构造函数**。我们通过给实现类的字典提供一个特殊的键\
  \ `_new` 来实现，其值为构建该类型对象的函数：\n\n```python\n def shape_new(name):\n    return {\n\
  \        \"name\": name,\n        \"_class\": Shape\n    }\n\nShape = {\n    \"\
  density\": shape_density,\n    \"_classname\": \"Shape\",\n    \"_parent\": None,\n\
  \    \"_new\": shape_new\n}\n```\n\n为了创建一个对象，我们调用与其 `_new` 键关联的函数：\n\n```python\n\
  \ def make(cls, *args):\n    return cls\"_new\"\n```\n\n该函数负责**向上调用**其父类的构造函数。例如，正方形的构造函数会调用通用形状的构造函数，并使用\
  \ `|` 组合两个字典来添加正方形特定的值：\n\n```python\n def square_new(name, side):\n    return make(Shape,\
  \ name) | {\n        \"side\": side,\n        \"_class\": Square\n    }\n\nSquare\
  \ = {\n    \"perimeter\": square_perimeter,\n    \"area\": square_area,\n    \"\
  _classname\": \"Square\",\n    \"_parent\": Shape,\n    \"_new\": square_new\n}\n\
  ```\n\n当然，在测试之前我们还没算完：\n\n```python\n examples = [make(Square, \"sq\", 3), make(Circle,\
  \ \"ci\", 2)]\nfor ex in examples:\n    n = ex[\"name\"]\n    d = call(ex, \"density\"\
  , 5)\n    print(f\"{n}: {d:.2f}\")\n```\n\n```\n sq: 0.56\nci: 0.40\n```\n\n## 2.5\
  \ 总结\n\n我们只触及 Python 对象系统的冰一角。**多继承、类方法、静态方法**和**猴子补丁**都是强大的工具，但它们都可以被理解为包含属性、函数和其他字典引用的字典\
  \ (图 2.5)。\n\n![](img/fig2_5.jpg)\n\n图 2.5: 实现对象和类的概念图。\n\n## 2.6 练习题\n\n### 处理命名参数\n\
  `call` 的最终版本声明了一个参数 `*args` 来捕获被调用方法的所有位置参数并对其进行展开。修改它使其也能捕获命名参数。\n\n### 多继承\n使用字典实现多继承。你的实现查找方法的顺序与\
  \ Python 相同吗？\n\n### 类方法和静态方法\n1. 解释类方法和静态方法的区别。\n2. 使用字典实现这两种方法。\n\n### 报告类型\n\
  Python `type` 方法 `isinstance` 判断对象是否直接或间接继承自某个类型。添加你版本的这两种方法。\n\n### 使用递归\n**递归函数**是指调用自身的函数，无论是直接还是间接。修改\
  \ `find` 函数使其使用递归而不是循环。哪个版本更容易理解？哪个版本更高效？\n\n### 缓存\n我们的实现每次调用都会查找字节。另一种替代方案是为对象添加一个特殊的\
  \ `cache` 键，其值为已经查找过的方法。例如，字典的键是方法。这种方法需要多少存储空间？\n\n### 查找文件\n假设我们想要找到重复的文件，例如照片或数据集。人们经常重命名文件，所以我们必须比较内容，但如果文件很多，这将很慢。`N`\
  \ 对象可以有 `N(N-1)` 种配对方式。如果我们去重配对（即认为 A-B 视为同一对），那么就有 `N(N-1)/2` 组合。随着 `N` 变大，这个值的**时间复杂度**为\
  \ `O(N²)`，读作“N 的平方”。简单来说，当文件数量翻倍时，运行时间大约增加四倍，这意味着每个文件的时间随文件数量而增加。\n\n## 3.1 开始\n\
  \n我们将从实现低效的 `N²` 方法开始，以便与我们后的设计进行比较。下面的短程序从命令行获取文件名，查找重复项并打印匹配项：\n\n```python\n\
  def find_duplicates(filenames):\n    matches = []\n    for left in filenames:\n\
  \        for right in filenames:\n            if same_bytes(left, right):\n    \
  \            matches.append((left, right))\n    return matches\n\nif __name__ ==\
  \ \"__main__\":\n    duplicates = find_duplicates(sys.argv[1:])\n    for (left,\
  \ right) in duplicates:\n        print(left, right)\n```\n\n该程序使用名为 `same_bytes`\
  \ 的函数，读取两个文件并逐字节进行比较：\n\n```python\ndef same_bytes(left_name, right_name):\n   \
  \ left_bytes = open(left_name, \"rb\").read()\n    right_bytes = open(right_name,\
  \ \"rb\").read()\n    return left_bytes == right_bytes\n```\n\n注意文件是以二进制模式“rb”打开的，正如我们在[第\
  \ 17 章]中看到的，这告诉 Python 正确读取字节而不是尝试将它们转换为字符。\n\n\n\n\n为了测试这个程序以及我们即将编写的其他程序，我们创建了一个包含六个文件的\
  \ `tests` 目录：\n\n| 句名 | a1.txt | a2.txt | a3.txt | b1.txt | b2.txt | c1.txt |\n\
  | --- | --- | --- | --- | --- | --- | --- |\n| 内容 | aaa | aaa | aaa | bb | bb |\
  \ c |\n\n我们期望三个 a 文件和两个 b 文件会被报告为重复文件。这些测试并没有什么特殊的理由——我们只需要从某个地方开始。我们的第一个测试如下：\n\
  \n```python\npython brute_force_1.py tests/*.txt\n```\n\n```\ntests/a1.txt  tests/a1.txt\n\
  tests/a1.txt  tests/a2.txt\ntests/a1.txt  tests/a3.txt\ntests/a2.txt  tests/a1.txt\n\
  tests/a2.txt  tests/a2.txt\ntests/a2.txt  tests/a3.txt\ntests/a3.txt  tests/a1.txt\n\
  tests/a3.txt  tests/a2.txt\ntests/a3.txt  tests/a3.txt\ntests/b1.txt  tests/b1.txt\n\
  tests/b1.txt  tests/b2.txt\ntests/b2.txt  tests/b1.txt\ntests/b2.txt  tests/b2.txt\n\
  tests/c1.txt  tests/c1.txt\n```\n\n我们程序的输出是正确的，但没有用处：每个文件都被报告为与自身相同，而且每一对不同文件的匹配都被报告两次。让我们修复\
  \ `find_duplicates` 中的嵌套循环，以便我们只检查一次可能不同的文件对（图 3.1）：\n\n```python\ndef find_duplicates(filenames):\n\
  \    matches = []\n    for i_left in range(len(filenames)):\n        left = filenames[i_left]\n\
  \        for i_right in range(i_left):\n            right = filenames[i_right]\n\
  \            if same_bytes(left, right):\n                matches.append((left,\
  \ right))\n    return matches\n```\n\n![](img/fig3_1.jpg)\n\n图 3.1: 限制内部循环范围以产生唯一的组合。\n\
  \n## 3.2 哈希文件\n\n与其将每个文件与其他所有文件进行比较，不如处理每个文件一次，生成一个仅取决于文件内容的短标识符，然后只比较具有相同标识符（即*可能*相等的）的文件。如果文件被平均分成\
  \ *g* 组，那么每组将大约包含 *N/g* 个文件，因此总工作量将大约是 `O(g*(N/g)²))`（即 `g` 组乘以每组内的 `(N/g)²` 次比较）。简化来说，这是\
  \ `N²/g`，因此随着组数的增加，整体运行时间应该会减少（图 3.2）。\n\n![](img/fig3_2.jpg)\n\n图 3.2: 按哈希值分组将比较次数从\
  \ 15 次减少到 4 次。\n\n我们可以使用 `哈希函数`（hash function）为文件构建 ID 以生成一个 `哈希值`（hash code）。由于字节只是数字，我们可以通过相加文件中的字节并对某个数字取模，来创建一个非常简单的哈希函数：\n\
  \n```python\ndef naive_hash(data):\n    return sum(data) % 13\n```\n\n这里有一个快速测试，用于计算单词“hashing”中长度逐渐增加长的子字符串的哈希值：\n\
  \n```python\nexample = bytes(\"hashing\", \"utf-8\")\nfor i in range(1, len(example)\
  \ + 1):\n    substring = example[:i]\n    hash = naive_hash(substring)\n    print(f\"\
  {hash:2} {substring}\")\n```\n\n```\n 0   b'h'\n 6   b'ha'\n 4   b'has'\n 4   b'hash'\n\
  \ 5   b'hashi'\n11   b'hashin'\n10   b'hashing'\n```\n\n输出看起来是随机的，但真的如此吗？作为一个更严格的测试，让我们尝试对古腾堡计划版¹小说《德古拉》中的每行文本进行哈希并绘制分布图（图\
  \ 3.3）。\n\n![](img/fig3_3.jpg)\n\n图 3.3: 《德古拉》中每行的哈希值分布。\n\n大多数 `桶`（buckets）的高度大致相同，但为什么零处有一个峰值？我们对算法效率的大\
  \ O 估计取决于文件是否均匀分布在组之间；如果并非如此，我们的代码将没有我们想象的那么快。\n\n经过一番挖掘，发现我们处理的文本文件使用空行来分隔段落。这些哈希值为零，因此峰值反映了我们数据中的分布不均。如果我们绘制*唯一*行的哈希值分布，结果会更均匀（图\
  \ 3.4）。\n\n![](img/fig3_4.jpg)\n\n图 3.4: 《德古拉》中每个唯一行的哈希值分布。\n\n哈希是一种极其强大的工具：例如，Python\
  \ 的字典通过哈希它们的键来执行查找。现在我们可以对文件进行哈希，构建一个以哈希值为键、文件名集合为值的字典。实现此操作的代码如下所示；每次计算一个哈希值时，它都会检查该值之前是否出现过。如果没有，它会在\
  \ `groups` 中创建一个新条目，以哈希值为键并带一个空集合。然后它就可以确定要添加的集合了：\n\n```python\ndef find_groups(filenames):\n\
  \    groups = {}\n    for fn in filenames:\n        data = open(fn, \"rb\").read()\n\
  \        hash_code = naive_hash(data)\n        if hash_code not in groups:\n   \
  \         groups[hash_code] = set()\n        groups[hash_code].add(fn)\n    return\
  \ groups\n```\n\n我们现在可以重用之前的大部分代码来查找每组内的重复文件：\n\n```python\ngroups = find_groups(sys.argv[1:])\n\
  for filenames in groups:\n    # (此处省略重用的逻辑)\n```\n\n（注：原文示例代码在此处不完整，已根据上下文逻辑推断翻译内容）\n\
  \n实际上，由于提供的原文在结尾处中断了，我将基于提供的文本片段完成翻译：\n\n```python\ngroups = find_groups(sys.argv[1:])\n\
  for filenames in groups:\n    # 这里的代码逻辑原文中未完整\n```\n\n\n\n\n```\ntests/a1.txt, tests/a2.txt,\
  \ tests/a3.txt\ntests/b1.txt, tests/b2.txt\ntests/c1.txt\n```\n\n更重要的是，我们的新方法可以扩展到非常大的文件集：如上文所述，我们只需要查看每个文件一次，因此运行时间达到了最优状态。\n\
  \n## 3.4 总结\n\n图 3.5 总结了本章的核心思想，其中最重要的的一点是某些算法在本质上优于其他算法。\n\n![](img/fig3_5.jpg)\n\
