    Ah, but there is: Node.js! People think of Node as a JavaScript web server (more
    on that in Chapter 6, [*Server-Side Apps with Node.js*](#f_0053.html_chp.nodejs)),
    but it’s so much more. Fundamentally, it’s a bridge between JavaScript code and
    your operating system. Node also has a wonderful tool called npm, the Node Package
    Manager.[[15]](#f_0016.html_FOOTNOTE-15) If your background is in Ruby, think
    of it as the Node analog of RubyGems. It’s become the de facto standard for installing
    and managing Node apps and libraries.


    The rest of this section will be about installing Node and npm, which we need
    in order to use CoffeeScript’s canonical `coffee` compiler. (We’ll also need Node
    and npm for the last chapter of this book.) But if you’re in a rush to get your
    feet wet, you might want to head over to [http://coffeescript.org/](http://coffeescript.org/),
    hit the “Try CoffeeScript” button, and skip ahead to the next chapter. (You’ll
    need something in your browser to display `console` output, such as Firebug Lite.[[16]](#f_0016.html_FOOTNOTE-16))


    Ready? Let’s get to it.


    ### CoffeeScript with Node.js and npm


    Although there are many ways to run CoffeeScript without Node (several of which
    are covered in Appendix B, [*Ways of Running CoffeeScript*](#f_0066.html_app.ways)),
    I’ll assume throughout this book that you’re using the standard `coffee` command,
    which was designed to run under Node. The final chapter, Chapter 6, [*Server-Side
    Apps with Node.js*](#f_0053.html_chp.nodejs), is the only one that explicitly
    requires Node and npm.


    Heads up—if you’re on Windows, you’ll need to get Cygwin before we continue.[[17]](#f_0016.html_FOOTNOTE-17)
    Cygwin basically acts as a Linux emulator. While first-class Windows support is
    on the Node.js roadmap for version 0.6, using Cygwin is the most reliable approach
    available as of this writing.


    If you’re on a Mac, you’ll need to install Xcode,[[18]](#f_0016.html_FOOTNOTE-18)
    not for the app itself but for the command-line developer tools that come with
    it. You can check whether these tools are already on your system by trying to
    run `gcc`, the GNU Compiler Collection:


    ```

    $ gcc

    i686-apple-darwin10-gcc-4.2.1: no input files

    ```


    If your output looked like that, you’re set. If not, get Xcode (if you’re on a
    Mac) or install the standard build tools directly (if you’re on Linux or Cygwin).


    Everyone’s on a Linux/Unix/Mac-type system with standard build tools now? Great!
    Now head to [http://gist.github.com/579814](http://gist.github.com/579814). There
    you’ll find a bewildering array of installation options curated by npm creator
    Isaac Schlueter. For all the Mac users out there, I recommend the Homebrew approach
    (install Homebrew first).[[19]](#f_0016.html_FOOTNOTE-19) For everyone else, the
    direct approach—first on the list—is probably best. Node is a big package, so
    it may take a few minutes to install.


    Once Node is on your system, run the latest remote install script for npm:


    ```

    $ curl http://npmjs.org/install.sh | sh

    ```


    If you get a permissions error, either `chown` the directory Node is installed
    in (this will save you from headaches down the road) or use `sudo sh` instead
    of plain `sh`.


    No matter how you installed them, check that `node` and `npm` are on your path:
    `PATH`


    ```

    $ node -v

    v0.4.8

    $ npm -v

    1.0.13

    ```


    (A word on versions: Node’s API is stable in even-numbered point releases. So,
    the examples in this book should run fine under the latest 0.4.x. Node 0.5.x,
    on the other hand, will feature API changes, which will be incorporated into the
    stable 0.6.x. As to npm, I’ll assume throughout this book that you’re using npm
    1.x. So if you’re still on npm 0.x, now would be a good time to upgrade.)


    Now grab the latest CoffeeScript release:


    ```

    $ npm install -g coffee-script

    /usr/local/bin/cake -> /usr/local/lib/node_modules/coffee-script/bin/cake

    /usr/local/bin/coffee -> /usr/local/lib/node_modules/coffee-script/bin/coffee

    ```


    The `-g` flag, short for `--global`, makes the installed library available system-wide.
    (By default, `npm install [package]` puts the given package in the local `node_modules`
    subdirectory, which is handy when installing a package that is only for a specific
    project.) I recommend using `-g` whenever you install packages that include binaries.


    The output from `npm install` tells us that two binaries were installed as part
    of the package: `cake` and `coffee`. Let’s check that `coffee` is on our system’s
    `PATH`:


    ```

    $ coffee -v

    CoffeeScript version 1.1.1

    ```


    If that didn’t work, look at the directory before `->` in your `npm install` output
    (for example, `/usr/local/bin`) and add that directory to your `PATH`. On a Mac
    with the default `bash` shell, do that by adding the following line to your `~/.profile`:


    ```

    export PATH=/usr/local/bin:$PATH

    ```


    Make sure to include the `:$PATH` part—otherwise, `/usr/local/bin` would replace
    your `PATH` rather than being added to it! For the line to take effect, you’ll
    have to save the file and start a new shell session (for example, by opening a
    new Terminal window and closing the old one).


    If you’re using a different OS or shell, these steps might be slightly different;
    enter `echo $SHELL` to find out which shell you’re using. Don’t forget that you
    have to restart your shell session after modifying the file in order for it to
    take effect.


    There’s one last step: just as our binaries have to be on `PATH` for us to be
    able to use them from anywhere, the Node libraries npm installs have to be on
    `NODE_PATH`. To see where Node is installing its libraries, type the following:


    ```

    $ npm ls -g

    /usr/local/lib

    ```


    (This command also lists all of the packages that npm has installed globally.
    If you omit `-g`, you’ll see all the packages installed in the current directory.)
    We need to add the `node_modules` subdirectory of that path to `NODE_PATH`. On
    my system, that means adding the following to `~/.profile`:


    ```

    export NODE_PATH=/usr/local/lib/node_modules

    ```


    Once again, the steps you’ll need to take may be different on your system. To
    test that `NODE_PATH` is working its magic, start a new shell session and enter
    the `node` command. That’ll take you to the Node.js REPL, an environment where
    you can interactively run commands. Now enter this:


    ```

    > require(''coffee-script'')

    ```


    I promise, that’s the only JavaScript you’ll have to type in this book!


    If `NODE_PATH` isn’t set correctly, you’ll get `Error: Cannot find module ’coffee-script’`.
    If you see a long object description instead, you’re golden. When you’re done
    with Node’s REPL, enter `process.exit()`, or just hit `Ctrl`-`c`.


    By the way, the `coffee-script` library is beyond the scope of this book; suffice
    it to say that it lets you compile CoffeeScript to JavaScript from within your
    CoffeeScript or JavaScript program. You can do some pretty cool stuff with this,
    like writing your own compiler with custom postprocessing,[[20]](#f_0016.html_FOOTNOTE-20)
    or writing your own build script as a Cakefile.[[21]](#f_0016.html_FOOTNOTE-21)


    #### Staying on the Bleeding Edge


    If you absolutely must have the latest CoffeeScript, it’s actually pretty easy.
    Just use `git` to clone the CoffeeScript repo, then have `npm` install it from
    the local directory:


    ```

    $ git clone http://github.com/jashkenas/coffee-script.git

    $ cd coffee-script

    $ npm install -g

    ```


    This will install the current `master` branch, which may or may not be stable.
    You can revert to a specific version of CoffeeScript (say, 1.1.1) by running the
    following:


    ```

    $ npm install -g coffee-script@1.1.1

    ```


    Whew! I know that installation may have felt like a lot of work, but believe me,
    those efforts will pay off now that we have the full power of Node and npm at
    our disposal. Now let’s set up your editing environment.

    '
