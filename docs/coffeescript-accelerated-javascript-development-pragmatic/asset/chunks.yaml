  trans: "\n`body { color: #333 }`\n\n如果不使用样式表，我们每次创建带有文本的新元素时，都必须调用 `$elem.css('color',\
    \ '#333')`。真是麻烦。\n\n为了避免这种麻烦，我们现在就来决定页面的布局方式。我们将用 5 个 `ul` 行来表示 5x5 的方块网格，每行包含\
    \ 5 个 `li`，并放在 `#grid` 容器中。我们希望 `#grid` 居中显示，并使用大号等宽字体：\n\n[jQuery/5x5/style.css](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/style.css)\n\
    \n```\n#grid {\n    position: relative;\n    text-align: center;\n    width: 480px;\n\
    \    margin: 16px auto;\n    padding: 32px 0;\n    border: 2px solid #555;\n \
    \   font-size: 64px;\n    font-family: Monaco, \"DejaVu Sans Mono\", \"Lucida\
    \ Console\", monospace;\n}\n```\n\n为了让每一行水平显示，我们将 `ul` 元素设置为 `list-style: none`，`li`\
    \ 元素设置为 `display: inline`。同时设置 `cursor: pointer`，使鼠标光标在方块上时像链接一样响应，并提供一个 `hover`\
    \ 样式，让鼠标悬停的方块改变颜色。哦，如果方块带有 `selected` 类，也会改变颜色。\n\n其他需要的 CSS 元素包括用于提示下一步操作的 `#message`、用于显示每一步结果的\
    \ `.notice` 容器，以及一个 `#scores` 表格：\n\n[jQuery/5x5/style.css](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/style.css)\n\
    \n```\n#message {\n    position: relative;\n    text-align: center;\n    margin:\
    \ 32px;\n    font-size: 24px;\n}\n```\n\n[jQuery/5x5/style.css](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/style.css)\n\
    \n```\n.notice {\n    position: relative;\n    text-align: center;\n    width:\
    \ 486px;\n    margin: 0 auto;\n    padding: 16px 0;\n    background: #eb4;\n \
    \   font-size: 18px;\n}\n```\n\n[jQuery/5x5/style.css](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/style.css)\n\
    \n```\n#scores {\n    position: relative;\n    text-align: center;\n    width:\
    \ 484px;\n    margin: 16px auto;\n    border: 1px solid #555;\n    font-size:\
    \ 24px;\n}\n```\n\n### jq5x5.coffee\n\n现在进入项目的核心部分！我们首先定义一些需要模块级作用域的变量：\n\n[jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)\n\
    \n```\ngrid = dictionary = currPlayer = player1 = player2 = selectedCoordinates\
    \ = null\n```\n\n这些变量中的大部分将在我们新的 `newGame` 函数中被赋予实际值：\n\n[jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)\n\
    \n```\nnewGame = ->\n    grid = new Grid\n    dictionary = new Dictionary(OWL2,\
    \ grid)\n    currPlayer = player1 = new Player('Player 1', dictionary)\n    player2\
    \ = new Player('Player 2', dictionary)\n    drawTiles()\n\n    player1.num = 1\n\
    \    player2.num = 2\n    for player in [player1, player2]\n        $(\"#p#{player.num}name\"\
    ).html player.name\n        $(\"#p#{player.num}score\").html 0\n        showMessage\
    \ 'firstTile'\n```\n\n由于这个函数引用了页面上的 HTML，我们需要确保它在文档就绪之前不会被调用。因此，它通过 `$(document).ready`\
    \ 回调来调用：\n\n[jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)\n\
    \n```\n$(document).ready ->\n    newGame()\n    $('#grid li').live 'click', tileClick\n\
    ```\n\n你可能对 `newGame` 中的 `drawTiles` 函数感到好奇。它就在这里：\n\n[jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)\n\
    \n```\ndrawTiles = ->\n    gridHtml = ''\n    for x in [0...grid.tiles.length]\n\
    \        gridHtml += '<ul>'\n        for y in [0...grid.tiles.length]\n      \
    \      gridHtml += \"<li id='tile#{x}_#{y}'>#{grid.tiles[x][y]}</li>\"\n     \
    \   gridHtml += '</ul>'\n    $('#grid').html gridHtml\n```\n\n我们本可以使用 jQuery 逐个生成并插入每个方块，但当你需要一次性向文档添加大量内容时，直接创建一大段\
    \ HTML 字符串并没有什么问题。事实上，这通常是最有效的方法，因为操作字符串比操作 DOM 开销更小。\n\n现在，如果没有输入，游戏就不算真正开始——我们需要定义\
    \ `tileClick`，它通过 jQuery 的 `live` 函数绑定到 `#grid` 中的 `li` 元素上。为什么用 `live` 而不是 `bind`？因为\
    \ `live` 事件无论绑定的元素发生什么变化都会触发——即使元素被彻底销毁再重新创建，这些可靠的 `live` 事件依然存在。此外，它还有效率优势——`live`\
    \ 只创建一个事件处理程序，而 `bind` 会创建二十五个。\n\n总之，当你点击一个方块时会发生以下事情：\n\n[jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)\n\
    \n```\ntileClick = ->\n    $tile = $(this)\n    if $tile.hasClass 'selected'\n\
    \        # 撤销\n        selectedCoordinates = null\n        $tile.removeClass 'selected'\n\
    \        showMessage 'firstTile'\n    else\n        $tile.addClass 'selected'\n\
    \        [x, y] = @id.match(/(\\d+)_(\\d+)/)[1..]\n        selectTile x, y\n```\n\
    \njQuery 事件回调的上下文是触发事件的 DOM 元素——在本例中，就是被点击的 `li`。我们将该元素包装成 jQuery 对象，并命名为 `$tile`。如果方块已被选中，则取消选中并返回要求玩家选择第一个方块的状态。如果是有效的选择，则继续执行\
    \ `selectTile`：\n\n[jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)\n\
    \n```\nselectTile = (x, y) ->\n    if selectedCoordinates is null\n        selectedCoordinates\
    \ = {x1: x, y1: y}\n        showMessage 'secondTile'\n    else\n        selectedCoordinates.x2\
    \ = x\n        selectedCoordinates.y2 = y\n        $('#grid li').removeClass 'selected'\n\
    \        doMove()\n```\n\n如果 `selectedCoordinates` 为 `null`，说明这是玩家选择的第一个方块，我们只需存储坐标。否则，玩家已经为本回合选择了两个方块，于是进入\
    \ `doMove`，该函数让 `Player` 实例移动方块并计算得分，然后将结果显示在通知框中：\n\n[jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)\n\
    \n```\ndoMove = ->\n    {moveScore, newWords} = currPlayer.makeMove selectedCoordinates\n\
    \    if moveScore is 0\n        $notice = $(\"\"\"#{currPlayer.name} formed no\
    \ words this turn.\"\"\")\n    else\n        $notice = $(\"\"\"\n            <p\
    \ class=\"notice\">\n            #{currPlayer} formed the following #{newWords.length}\
    \ word(s):<br />\n            <b>#{newWords.join(', ')}</b><br />\n          \
    \  earning <b>#{moveScore / newWords.length}x#{newWords.length} = #{moveScore}</b>\
    \ points!\n            </p>\n            \"\"\")\n    showThenFade $notice\n \
    \   endTurn()\n```\n\n`showThenFade` 是一个视觉小特效，它在网格下方添加一个黄色框，然后淡出并压缩它，最后将其从 DOM\
    \ 中完全移除：\n\n[jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)\n\
    \n```\nshowThenFade = ($elem) ->\n```\n\n"
- fmt: "\n`$elem.insertAfter $('#grid')`\n\n`animationTarget = opacity: 0, height:\
    \ 0, padding: 0`\n\n`$elem.delay(5000).animate animationTarget, 500, -> $elem.remove()`\n\
    \nFinally, `endTurn` updates the tile grid and the score table and then tells\
    \ the next player that they’re up to bat.\n\nTo see how the game looks when it\
    \ all comes together, take a look at Figure 5, [*5x5, powered by jQuery*](#f_0050.html_fig.jq5x5).\n\
    \n![images/jq5x5.png](images/jq5x5.png)\n\n**Figure 5. 5x5, powered by jQuery**\n\
    \nThere are, of course, plenty more features we could add—for instance, a list\
    \ of words that have already been used, a time limit for each turn, and a “game\
    \ over” screen after each player has taken a certain number of turns (or after\
    \ a certain time limit), not to mention fancier animations and interface elements\
    \ (like drag-and-drop, a feature that’s a snap to implement with jQuery UI.)[[42]](#f_0052.html_FOOTNOTE-42)\
    \ But I’ll leave those avenues for you to explore on your own.\n\n## 5.6 The Future\
    \ Is jQueryfied\n\nIn this chapter, we’ve touched on all the basics of jQuery,\
    \ the closest thing JavaScript has to a standard library for working with web\
    \ pages. You’ve learned to grab elements with selectors, manipulate their CSS\
    \ styles and HTML attributes, and attach events. The prospect of building an interactive\
    \ web page from scratch should no longer cause you to break out in a cold sweat.\n\
    \nOne major topic we haven’t addressed is Ajax. jQuery makes communicating with\
    \ the server a breeze. You can find the relevant docs at [http://api.jquery.com/category/ajax/](http://api.jquery.com/category/ajax/).\n\
    \nThere’s something else worth mentioning. Thanks to Node.js, jQuery can now be\
    \ run easily on the server. How? Through a library called jsdom, which provides\
    \ a simulated browser environment within Node.[[43]](#f_0052.html_FOOTNOTE-43)\
    \ One fantastic use case for jsdom and jQuery is templating. Why bother writing\
    \ server-side templates (such as ERB files in Ruby on Rails) when you can just\
    \ take raw HTML and manipulate it on the server with jQuery before serving it?\
    \ That way, you can serve an initial version of the page that makes sense (great\
    \ for search engines and screen readers) and then reuse the same code on the client\
    \ side to add dynamic content.\n\nI encourage you to play with Ajax and jsdom\
    \ on your own. In the next chapter, we’ll take a different approach: we’ll use\
    \ WebSocket (through a library called Socket.io) to enable two-way asynchronous\
    \ communication between the client and the server. And we’ll get to know Node.js\
    \ a little better while we’re at it, using it to host the multiplayer version\
    \ of 5x5.\n\n## 5.7 Exercises\n\n1.  One common (in fact, nearly universal) mistake\
    \ made by jQuery newbies is that they think of jQuery selectors as “live.” For\
    \ example, they think that they can add new items to the menu (that is, inserting\
    \ new `li`s as children of `#menu`) that will also be hidden by using the following:\n\
    \n    ```\n    $('#menu li').hide()\n    ```\n\n    False! How would you go about\
    \ achieving the desired behavior, without calling any methods on the individual\
    \ `li` elements? (You’re allowed to use a stylesheet.)\n\n2.  What does this code\
    \ do? Is the world safe?\n\n    ```\n    $('a').click(destroyWorld).unbind('click')\n\
    \    ```\n\n3.  Three of the following selectors are functionally equivalent.\
    \ Which would behave differently, and how?\n\n    ```\n    $('#awayTeam .redShirt').die()\n\
    \    ```\n\n    ```\n    $('#awayTeam').find('.redShirt').die()\n    ```\n\n \
    \   ```\n    $('.redShirt, #awayTeam').die()\n    ```\n\n    ```\n    $('.redShirt',\
    \ $('#awayTeam')).die()\n    ```\n\n    (By the way, `die` really is a jQuery\
    \ method—it’s used to unbind events attached with `live`!)\n\n4.  Find, explain,\
    \ and fix the bug in this code:\n\n    ```\n    $('#drJekyll').click ->\n    alert\
    \ 'Now I shall transform!'\n    $('#drJekyll').attr 'id', 'mrHyde'\n    $('#drJekyll').unbind\
    \ 'click'\n    ```\n\n#### Footnotes\n\n- [[35]](http://jquery.com/)\n- [[36]](http://trends.builtwith.com/javascript/JQuery)\n\
    - [[37]](http://jquerymobile.com/)\n- [[38]](http://api.jquery.com/jQuery.noConflict/)\n\
    - [[39]](http://plugins.jquery.com/)\n- [[40]](http://stackoverflow.com/questions/1910794/jquery-text-vs-html)\n\
    - [[41]](http://www.alfajango.com/blog/the-difference-between-jquerys-bind-live-and-delegate/)\n\
    - [[42]](http://jqueryui.com/)\n- [[43]](http://jsdom.org/)\n\nCopyright © 2011,\
    \ The Pragmatic Bookshelf.\n\n# Chapter 6\n\nServer-Side Apps with Node.js\n\n\
    Running JavaScript on the server has long been a dream of web developers. Rather\
    \ than switching back and forth between a client-side language and a server-side\
    \ language, a developer using a JavaScript-powered server would only need to be\
    \ fluent in that lingua franca of web apps—or in its twenty-first-century offshoot,\
    \ CoffeeScript.\n\nNow that dream is finally a reality. In this chapter, we’ll\
    \ take a brief tour of Node.js, starting with its module pattern (part of the\
    \ CommonJS specification). Then we’ll figure out just what an “evented architecture”\
    \ is, with its implications for both server performance and our sanity. Finally,\
    \ we’ll add a Node back end to our 5x5 project from the last chapter, with real-time\
    \ multiplayer support powered by WebSocket.\n\n## 6.1 What Is Node.js?\n\nIgnore\
    \ the name: Node.js isn’t a JavaScript library. Instead, Node.js is a JavaScript\
    \ interpreter (powered by V8, the engine used by Google’s Chrome browser) that\
    \ interfaces with the underlying operating system. That way, JavaScript run by\
    \ Node.js can read and write files, spawn processes, and—most enticingly—send\
    \ and receive HTTP requests.\n\nLike CoffeeScript, Node is a new project (dating\
    \ to early 2009) that’s taken off rapidly and attracted all kinds of excitement.\
    \ Witness the Node.js Knockout, a Rails Rumble-inspired competition to develop\
    \ the best Node app in forty-eight hours.[[44]](#f_0059.html_FOOTNOTE-44)\n\n\
    A number of awesome projects have already been written with Node and CoffeeScript.\
    \ The following is a small, select sampling. You might want to come back to this\
    \ list after you’ve completed the book; reading real-world code is a great way\
    \ to take your mastery to the next level:\n\n*   *Docco* [Ash11]: Uber-computer\
    \ scientist Donald Knuth advocated “literate programming,” in which code and comments\
    \ are written so that someone encountering the program for the first time can\
    \ understand it just by reading it once. Docco, written by Jeremy Ashkenas, supports\
    \ this methodology by generating beautiful web pages in which comments and code\
    \ are displayed side-by-side.\n\n*   *Eco* [Ste11]: Say you’re writing a Node-based\
    \ web application. You have all of these HTML skeletons and a mess of application\
    \ code, but you’re not sure how to combine the two. Eco lets you embed CoffeeScript\
    \ within your markup, turning it into a server-side templating language.\n\n*\
    \   *Zappa* [NM11]: Creating web applications from scratch has never been simpler.\
    \ Zappa is a layer on top of Node’s popular Express framework that lets you succinctly\
    \ define how your web server should respond to arbitrary HTTP requests.[[45]](#f_0059.html_FOOTNOTE-45)\
    \ Works great with Eco, too!\n"
  raw: "|   | `$elem.insertAfter $(`*`'#grid'`*`)` |\n\n|   | `animationTarget = opacity:\
    \ 0, height: 0, padding: 0` |\n\n|   | `$elem.delay(5000).animate animationTarget,\
    \ 500,` **`->`** `$elem.remove()` |\n\nFinally, `endTurn` updates the tile grid\
    \ and the score table and then tells the next player that they’re up to bat.\n\
    \nTo see how the game looks when it all comes together, take a look at Figure\
    \ 5, [​*5x5, powered by jQuery*​](#f_0050.html_fig.jq5x5).\n\n| ![images/jq5x5.png](images/jq5x5.png)\
    \ |\n\n|  \n\n* * *\n\n**Figure 5\\. 5x5, powered by jQuery** |\n\nThere are,\
    \ of course, plenty more features we could add—for instance, a list of words that\
    \ have already been used, a time limit for each turn, and a “game over” screen\
    \ after each player has taken a certain number of turns (or after a certain time\
    \ limit), not to mention fancier animations and interface elements (like drag-and-drop,\
    \ a feature that’s a snap to implement with jQuery UI.)[[42]](#f_0052.html_FOOTNOTE-42)\
    \ But I’ll leave those avenues for you to explore on your own.\n\n## 5.6 The Future\
    \ Is jQueryfied\n\nIn this chapter, we’ve touched on all the basics of jQuery,\
    \ the closest thing JavaScript has to a standard library for working with web\
    \ pages. You’ve learned to grab elements with selectors, manipulate their CSS\
    \ styles and HTML attributes, and attach events. The prospect of building an interactive\
    \ web page from scratch should no longer cause you to break out in a cold sweat.\n\
    \nOne major topic we haven’t addressed is Ajax. jQuery makes communicating with\
    \ the server a breeze. You can find the relevant docs at [http://api.jquery.com/category/ajax/](http://api.jquery.com/category/ajax/).\n\
    \nThere’s something else worth mentioning. Thanks to Node.js, jQuery can now be\
    \ run easily on the server. How? Through a library called jsdom, which provides\
    \ a simulated browser environment within Node.[[43]](#f_0052.html_FOOTNOTE-43)\
    \ One fantastic use case for jsdom and jQuery is templating. Why bother writing\
    \ server-side templates (such as ERB files in Ruby on Rails) when you can just\
    \ take raw HTML and manipulate it on the server with jQuery before serving it?\
    \ That way, you can serve an initial version of the page that makes sense (great\
    \ for search engines and screen readers) and then reuse the same code on the client\
    \ side to add dynamic content.\n\nI encourage you to play with Ajax and jsdom\
    \ on your own. In the next chapter, we’ll take a different approach: we’ll use\
    \ WebSocket (through a library called Socket.io) to enable two-way asynchronous\
    \ communication between the client and the server. And we’ll get to know Node.js\
    \ a little better while we’re at it, using it to host the multiplayer version\
    \ of 5x5.\n\n## 5.7 Exercises\n\n1.  One common (in fact, nearly universal) mistake\
    \ made by jQuery newbies is that they think of jQuery selectors as “live.” For\
    \ example, they think that they can add new items to the menu (that is, inserting\
    \ new `li`s as children of `#menu`) that will also be hidden by using the following:\n\
    \n    |   | `$(`*`'#menu li'`*`).hide()` |\n\n    False! How would you go about\
    \ achieving the desired behavior, without calling any methods on the individual\
    \ `li` elements? (You’re allowed to use a stylesheet.)\n\n2.  What does this code\
    \ do? Is the world safe?\n\n    |   | `$(`*`'a'`*`).click(destroyWorld).unbind(`*`'click'`*`)`\
    \ |\n\n3.  Three of the following selectors are functionally equivalent. Which\
    \ would behave differently, and how?\n\n    |   | `$(`*`'#awayTeam .redShirt'`*`).die()`\
    \ |\n\n    |   | `$(`*`'#awayTeam'`*`).find(`*`'.redShirt'`*`).die()` |\n\n  \
    \  |   | `$(`*`'.redShirt, #awayTeam'`*`).die()` |\n\n    |   | `$(`*`'.redShirt'`*`,\
    \ $(`*`'#awayTeam'`*`)).die()` |\n\n    (By the way, `die` really is a jQuery\
    \ method—it’s used to unbind events attached with `live`!)\n\n4.  Find, explain,\
    \ and fix the bug in this code:\n\n    |   | `$(`*`'#drJekyll'`*`).click` **`->`**\
    \ |\n\n    |   | `alert` *`'Now I shall transform!'`* |\n\n    |   | `$(`*`'#drJekyll'`*`).attr`\
    \ *`'id'`*`,` *`'mrHyde'`* |\n\n    |   | `$(`*`'#drJekyll'`*`).unbind` *`'click'`*\
    \ |\n\n#### Footnotes\n\n| [[35]](#f_0045.html_FNPTR-35) | [http://jquery.com/](http://jquery.com/)\
