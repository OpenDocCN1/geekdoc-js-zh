    # 附录 3


    JavaScript 开发者速查表


    本速查表总结了 CoffeeScript 提供的大多数关键字和运算符及其 JavaScript 等价物。在下表中，**符号** 指 CoffeeScript
    中推荐使用的形式，而 **别名** 指不太推荐使用的替代形式。通常，别名与 JavaScript 中的相同。例如，在 CoffeeScript 中推荐使用
    `or` 而非 `||`，但两者都允许。


    有时，给出的 JavaScript 代码会略有简化，并在某些边缘情况下与 CoffeeScript 有所不同；这些差异会在每个表格底部的注释中说明。


    与 JavaScript 中相同的符号（例如数学和位运算符）在此不提及。


    ## A3.1 布尔运算符


    | 符号 | 别名 | JavaScript |

    | --- | --- | --- |

    | `not x` | `!x` | `!x` |

    | `x or y` | `x &#124;&#124; y` | `x &#124;&#124; y` |

    | `x or= y` | `x &#124;&#124;= y` | `x = x &#124;&#124; y` |

    | `x and y` | `x && y` | `x && y` |

    | `x and= y` | `x &&= y` | `x = x && y` |


    ## A3.2 存在运算符


    | 符号 | 别名 | JavaScript |

    | --- | --- | --- |

    | `x?` |  | `typeof x != ’undefined’ && x !== null` |

    | `func?()` |  | `if (typeof func === ’function’) {func()}` |

    | `x?.y` | `x.y if x?` | `typeof x !== ’undefined’ && x !== null ? x.y : undefined`
    |

    | `x ?= y` | `x = y unless x?` | `if (typeof x === ’undefined’ &#124;&#124; x
    === null) {x=y}` |


    ## A3.3 上下文和原型访问器


    | 符号 | 别名 | JavaScript |

    | --- | --- | --- |

    | `@` | `this` | `this` |

    | `@x` | `this.x` | `this.x` |

    | `@[’x’]` | `this[’x’]` | `this[’x’]` |

    | `obj::y` | `obj.prototype.y` | `obj.prototype.y` |

    | `obj::[’y’]` | `obj.prototype[’y’]` | `obj.prototype[’y’]` |


    ## A3.4 函数定义


    | 符号 | JavaScript |

    | --- | --- |

    | `func = (a) -> ...` | `func = function(a) {...}` |

    | `func = (a) => ...` | `func = bind(function(a) {...}, this)`* |


    *其中 `bind` 返回一个包装函数，该函数在给定的上下文中运行。参见 ​*=> 是如何工作的？*​。


    ## A3.5 条件语句


    | 符号 | 别名 | JavaScript |

    | --- | --- | --- |

    | `y if x` | `if x then y`* | `if (x) {y}` |


    '
- fmt: '

    | `y unless x` | `y if not x` | `if (!x) {y}` |

    | `a = if x then y` | `if x then a = y else a = undefined` | `a = x ? y : undefined`
    |

    | `a = if x then y else z` | `if x then a = y else a = z` | `a = x ? y : z` |

    | `switch x` |  | See [​*Polymorphism and Switching*​](#f_0041.html_sec.switch).
    |


    *Indentation may be used instead of `then`.


    ## A3.6 Property Existence


    | Symbol | JavaScript |

    | --- | --- |

    | `x of obj` | `x in obj` |

    | `x in arr` | `y.indexOf(x) >= 0`* |


    *CoffeeScript actually uses the `indexOf` method directly from the `Array` prototype;
    and if `Array.prototype.indexOf` is undefined (as in Internet Explorer 8 and below),
    an equivalent function is used instead.


    ## A3.7 Iteration


    | Symbol | Alias | JavaScript |

    | --- | --- | --- |

    | `f() for x of obj` | `for x of obj then f()` | `for (x in obj) {f()}` |

    | `f() for x in arr` | `for x in arr then f()` | `for (var i = 0; i < arr.length;
    i++) {f()}`* |

    | `f() for x in [a..b]` | `for x in [a..b] then f()` | `for (var i = a; i <= b;
    i++) {f()}`** |

    | `f() for x in [a...b]` | `for x in [a...b] then f()` | `for (var i = a; i <
    b; i++) {f()}`** |


    *`arr.length` is cached in the CoffeeScript version, so that changes made to the
    array during the loop will not affect the range of iteration.


    **Assuming `a < b`. If `a > b`, then the loop counts downward instead of upward.


