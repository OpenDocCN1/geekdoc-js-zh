    但数组模式匹配不仅仅是进行多重赋值的漂亮语法。首先，你可以在赋值的两边引用同一个变量，使得交换操作变成一行代码，而不是三行：


    ```

    [newBoss, oldBoss] = [oldBoss, newBoss]

    ```


    我们也可以像在 2.6 节 ​*展开运算符 (...)*​ 的函数定义中使用展开运算符一样使用它：


    ```

    [theBest, theRest...] = topStudents

    ```


    如果你觉得数组模式匹配很棒，那么你会爱上对象模式匹配。假设我们想从一个对象中提取几个值：


    ```

    myRect =

    x: 100

    y: 200

    {x: myX, y: myY} = myRect

    ```


    同样，赋值左侧的“对象”并不是真正的对象，而是一个模式，它提供了键和变量名来匹配这些键。所以这等价于：


    ```

    myX = myRect.x; myY = myRect.y

    ```


    这看起来可能没什么大不了的，但请记住（正如我们在 ​*同名键值对*​ 中讨论的），`{x}` 是 `{x: x}` 的简写。这个规则在模式中也适用，这意味着如果你只想把
    `rect.x` 和 `rect.y` 复制到名为 `x` 和 `y` 的局部变量中，你只需这样写：


    ```

    {x, y} = rect

    ```


    相信我，这种语法将永远改变你从对象中读取属性的方式。再举一个例子，假设我们正在使用 Node 的 `assert` 模块编写一些测试。具体来说，我们想使用
    `assert.ok` 和 `assert.strictEqual` 方法。我们可以这样将它们加载为名为 `ok` 和 `strictEqual` 的变量：


    ```

    {ok, strictEqual} = require ''assert''

    ```


    最后一点提示——我有没有提到数组模式和对象模式可以相互嵌套？


    ```

    {languages: [favoriteLanguage, otherLanguages...]} = resume

    ```


    这段代码的意思是：“获取 `resume.languages`，将其第一个条目赋值给名为 `favoriteLanguage` 的变量，然后将剩余条目赋值给一个名为
    `otherLanguages` 的新数组。”一行代码就能做到，不错吧？


    模式匹配也被称为解构赋值，是 JavaScript 1.7 标准的一部分（目前受最新版 Firefox 支持）。但你不需要等待这个标准普及——CoffeeScript
    会将每个模式编译成一系列简单的赋值。


    我知道这一章内容很多，但现在是时候整理一下，将它们组合成我们单词游戏的第一个可用版本了。别忘了后面的练习——我保证它们很有挑战性。


    ## 3.7 项目：5x5 纸牌游戏


    既然我们在上一章处理了输入，那么我们的应用只需要做几件事就能成为一个完整的游戏。让我们从最简单的拼图开始，然后逐步解决更难的。


    首先：我们需要一些单词。幸运的是，Scrabble 锦标赛使用的单词列表——第二官方锦标赛和俱乐部单词列表（死忠 Scrabble 玩家称之为 OWL2）是公开的。本书的代码中包含了其中一个版本。[[31]](#f_0036.html_FOOTNOTE-31)


    我们将把这个单词列表存储为一个数组。（其他数据结构，比如二叉树，能提供更高效的查找，但我把这些优化留给读者去实现。）但首先，我们需要通过 Node 的文件系统（`fs`）模块来访问它：


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

    fs = require ''fs''

    owl2 = fs.readFileSync ''OWL2.txt'', ''utf8''

    ```


    `readFileSync` 只是将文件内容读取为一个字符串。`Sync` 后缀意味着，与大多数 Node.js I/O 函数不同，这个函数会阻塞程序的执行直到完成。如果我们在读取文件的同时还有后台工作要做，那么我们会使用带回调的
    `readFile`，这样在操作系统后台加载文件时，我们可以继续处理。


    字典的每一行包含一个单词及其定义和句子成分，例如：


    ```

    OD a hypothetical force of natural power [n -S]

    ```


    尽管这些附加信息很有趣，但我们不会用到它们。所以让我们用一个简单的正则表达式从每行中提取第一个单词：


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

    wordList = owl2.match /^(\w+)/mg

    ```


    然后我们将单词列表缩减为那些可能适合网格的单词：


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

    wordList = (word for word in wordList when word.length <= GRID_SIZE)

    ```


    其中 `GRID_SIZE` 是一个常量，我们将其设置为 5。（当然，我们可以通过调整正则表达式只捕获短单词来更高效地完成这个操作。）


    现在我们将定义一个函数来检查给定的单词是否有效：


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

    isWord = (str) ->

    str in wordList

    ```


    很简单，对吧？回想一下，`x in arr` 只是告诉我们值 `x` 是否在数组 `arr` 中。（这与 JavaScript 的 `in` 不同，CoffeeScript
    中对应的操作符是 `of`。）


    生成随机网格会稍微复杂一些。首先我们需要一种生成具有正确概率分布的随机字母的方法：


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

    # 概率取自 Scrabble，只是没有空白牌。

    # 参见 http://www.hasbro.com/scrabble/en_US/faqGeneral.cfm

    tileCounts =

    A: 9, B: 2, C: 2, D: 4, E: 12, F: 2, G: 3, H: 2, I: 9, J: 1, K: 1, L: 4

    M: 2, N: 6, O: 8, P: 2, Q: 1, R: 6, S: 4, T: 6, U: 4, V: 2, W: 2, X: 1

    Y: 2, Z: 1

    totalTiles = 0

    totalTiles += count for letter, count of tileCounts


    # JavaScript 哈希是无序的，所以我们需要自己创建键数组：

    alphabet = (letter for letter of tileCounts).sort()


    randomLetter = ->

    randomNumber = Math.ceil Math.random() * totalTiles

    x = 1

    for letter in alphabet

    x += tileCounts[letter]

    return letter if x > randomNumber

    ```


    现在，我们使用嵌套数组推导式生成网格：


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

    # grid 是一个二维数组：grid[col][row]，其中 0, 0 是左上角

    grid = for x in [0...GRID_SIZE]

    for y in [0...GRID_SIZE]

    randomLetter()

    ```


    我们还需要漂亮地打印网格（这是一个单词游戏，不是 Zork）：


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

    printGrid = ->

    # 转置网格以便绘制行

    rows = for x in [0...GRID_SIZE]

    for y in [0...GRID_SIZE]

    grid[y][x]

    rowStrings = ('' '' + row.join('' | '') for row in rows)

    rowSeparator = (''-'' for i in [1...GRID_SIZE * 4]).join('''')

    console.log ''\n'' + rowStrings.join("\n#{rowSeparator}\n") + ''\n''

    ```


    最后，我们进入计分环节。我们将从一个包含 Scrabble 字母值的哈希和一个用于跟踪已使用单词的数组开始：


    '
- fmt: '

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)


    ```

    # Each letter has the same point value as in Scrabble.

    tileValues =

    A: 1, B: 3, C: 3, D: 2, E: 1, F: 4, G: 2, H: 4, I: 1, J: 8, K: 5, L: 1

    M: 3, N: 1, O: 1, P: 3, Q: 10, R: 1, S: 1, T: 1, U: 1, V: 4, W: 4, X: 8,

    Y: 4, Z: 10


    moveCount = 0

    score = 0

    usedWords = []

    ```


    Now for our actual scoring function. It takes a grid and the zero-indexed coordinates
    of the two tiles that were swapped and relies on a `wordsThroughTile` function
    that returns every word going through a particular tile of the grid:


    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)


    ```

    scoreMove = (grid, swapCoordinates) ->

    {x1, x2, y1, y2} = swapCoordinates

    words = wordsThroughTile(grid, x1, y1).concat wordsThroughTile(grid, x2, y2)

    moveScore = multiplier = 0

    newWords = []

    for word in words when word not in usedWords and word not in newWords

    multiplier++

    moveScore += tileValues[letter] for letter in word

    newWords.push word

    usedWords = usedWords.concat newWords

    moveScore *= multiplier

    {moveScore, newWords}

    ```


    The `wordsThroughTile` function itself is trickier, since we need to go through
    a point in a 2-D array in four different directions while ensuring we don’t go
    out of range. Let’s look at the whole thing, and then I’ll break it down a bit:


    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)


    ```

    wordsThroughTile = (grid, x, y) ->

    strings = []

    for length in [MIN_WORD_LENGTH..GRID_SIZE]

    range = length - 1

    addTiles = (func) ->

    strings.push (func(i) for i in [0..range]).join ''''

    for offset in [0...length]

    # Vertical

    if inRange(x - offset, y) and inRange(x - offset + range, y)

    addTiles (i) -> grid[x - offset + i][y]

    # Horizontal

    if inRange(x, y - offset) and inRange(x, y - offset + range)

    addTiles (i) -> grid[x][y - offset + i]

    # Diagonal (upper-left to lower-right)

    if inRange(x - offset, y - offset) and

    inRange(x - offset + range, y - offset + range)

    addTiles (i) -> grid[x - offset + i][y - offset + i]

    # Diagonal (lower-left to upper-right)

    if inRange(x - offset, y + offset) and

    inRange(x - offset + range, y + offset - range)

    addTiles (i) -> grid[x - offset + i][y + offset - i]

    str for str in strings when isWord str

    ```


    The outer loop `for length in [MIN_WORD_LENGTH..GRID_SIZE]` iterates through all
    game-level legal word sizes (in our case, from 2 to 5). We define an `addTiles`
    function that calls a given function with each integer value `i` from 0 to `length
    - 1` inclusive and then combines the results (which are characters) as a single
    string. The argument to `addTiles` is a function that, given `i`, returns the
    value of the tile `i` steps from the starting point in a certain direction.


    The inner loop, `for offset in [0...length]`, is there because we want all words
    through the given tile, not just those starting at it. For instance, in the vertical
    direction and when offset is 0, we get all the words going down from the given
    tile; when offset is 1, we get all the words going down from the tile above the
    given tile; and so on up to the edge of the grid.


    Speaking of edges, those `inRange` checks ensure that both ends of a potential
    word are within the grid. If those tests pass, we send a callback to `addTiles`
    providing the tile value at each step `i`, and `addTiles` pushes the potential
    word to our `strings` list. Those items in `strings` that pass the `isWord` test
    get returned from the function.


    (The use of function passing in `addTiles` may seem unnecessary, but it actually
    greatly simplified the `wordsThroughTile` function; in an earlier version, the
    same loop and `join` code was repeated four times!)


    Whew! Now to initialize the game. We’ll want to count words that are already in
    the grid at the start as used, which we can do by performing `scoreMove` on a
    “swap” of each tile with itself:


    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)


    ```

    console.log "Welcome to 5x5!"

    for x in [0...GRID_SIZE]

    for y in [0...GRID_SIZE]

    scoreMove grid, {x1: x, x2: x, y1: y, y2: y}

    unless usedWords.length is 0

    console.log """

    Initially used words:

    #{usedWords.join('', '')}

    """

    console.log "Please choose a tile in the form (x, y)."

    ```


    Finally, we plug in the input code from the last chapter, modifying our prompts
    to actually work:


    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)


    ```

    promptForTile1 = ->

    printGrid()

    console.log "Please enter coordinates for the first tile."

    inputCallback = (input) ->

    try

    {x, y} = strToCoordinates input

    catch e

    console.log e

    return

    promptForTile2 x, y

    ```


    ![images/console5x5.png](images/console5x5.png)


    * * *


    **Figure 4\. Playing with our command-line prompt**


    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)


    ```

    promptForTile2 = (x1, y1) ->

    console.log "Please enter coordinates for the second tile."

    inputCallback = (input) ->

    try

    {x: x2, y: y2} = strToCoordinates input

    catch e

    console.log e

    return

    if x1 is x2 and y1 is y2

    console.log "The second tile must be different from the first."

    else

    console.log "Swapping (#{x1}, #{y1}) with (#{x2}, #{y2})..."

    x1--; x2--; y1--; y2--; # convert 1-based indices to 0-based

    [grid[x1][y1], grid[x2][y2]] = [grid[x2][y2], grid[x1][y1]]

    {moveScore, newWords} = scoreMove grid, {x1, y1, x2, y2}

    unless moveScore is 0

    console.log """

    You formed the following word(s):

    #{newWords.join('', '')}


    """

    score += moveScore

    moveCount++

    console.log "Your score after #{moveCount} moves: #{score}"

    promptForTile1()

    ```


    That’s it! Run the game (`coffee game.coffee`), and you should see something like
    Figure 4, [​*Playing with our command-line prompt*​](#f_0034.html_fig.console5x5).


    Of course, this program is far from a masterpiece. On the front end, the interface
    is a little…classical? And on the programmer side of things, the code is awfully
    disorganized. We’ll be addressing the latter problem in the next chapter, and
    then we’ll move on to use jQuery to turn our humble command-line game into a much
    more sophisticated browser-based experience. Finally, we’ll use a Node server-side
    app to add multiplayer support.

