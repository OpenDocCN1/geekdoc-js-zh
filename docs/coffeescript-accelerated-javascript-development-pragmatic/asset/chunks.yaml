    Instead, you iterate over arrays with operations like map, reduce, and compact.
    Many of these operations can be added to JavaScript through libraries, such as
    Underscore.js.[[30]](#f_0036.html_FOOTNOTE-30) But to gain maximum succinctness
    and flexibility, a language needs array comprehensions (also known as list comprehensions).


    Think of all the times you’ve looped over an array just to create another array
    based on the first. For instance, to negate an array of numbers in JavaScript,
    you’d write the following:


    |   | `positiveNumbers = [1, 2, 3, 4];` |


    |   | `negativeNumbers = [];` |


    |   | **`for`** `(i = 0; i < positiveNumbers.length; i++) {` |


    |   | `negativeNumbers.push(-positiveNumbers[i]);` |


    |   | `}` |


    Now here’s the equivalent CoffeeScript, using an array comprehension:


    |   | `negativeNumbers = (-num` **`for`** `num` **`in`** `[1, 2, 3, 4])` |


    You can also use the comprehension syntax with a conditional loop:


    |   | `keysPressed = (char` **`while`** `char = handleKeyPress())` |


    Do you see what’s going on here? Every loop in CoffeeScript returns a value. That
    value is an array containing the result of every loop iteration (except those
    skipped by a `continue` or `break` or as a result of a `when` clause). And it’s
    not just one-line loops that do this:


    |   | `code = [`*`''U''`*`,` *`''U''`*`,` *`''D''`*`,` *`''D''`*`,` *`''L''`*`,`
    *`''R''`*`,` *`''L''`*`,` *`''R''`*`,` *`''B''`*`,` *`''A''`*`]` |


    |   | `codeKeyValues =` **`for`** `key` **`in`** `code` |


    |   | **`switch`** `key` |


    |   | **`when`***`''L''`***`then`** `37` |


    |   | **`when`***`''U''`***`then`** `38` |


    |   | **`when`***`''R''`***`then`** `39` |


    |   | **`when`***`''D''`***`then`** `40` |


    |   | **`when`***`''A''`***`then`** `65` |


    |   | **`when`***`''B''`***`then`** `66` |


    (Do you see why we needed to use parentheses for the one-liners, but we don’t
    here? Also, you’re probably wondering about `switch`; it’ll become clearer in
    [​*Polymorphism and Switching*​](#f_0041.html_sec.switch).)


    Note that you can use comprehensions in conjunction with the `for` loop modifiers,
    `by` and `when`:


    |   | `evens = (x` **`for`** `x` **`in`** `[2..10]` **`by`** `2)` |


    |   | `isInteger = (num)` **`->`** `num is Math.round(num)` |


    |   | `numsThatDivide960 = (num` **`for`** `num` **`in`** `[1..960]` **`when`**
    `isInteger(960 / num))` |


    List comprehensions are the consequence of a core part of CoffeeScript’s philosophy:
    everything in CoffeeScript is an expression. And every expression has a value.
    So what’s the value of a loop? An array of the loop’s iteration values, naturally.


    Another part of CoffeeScript’s philosophy is DRY: Don’t Repeat Yourself. In the
    next section, we’ll meet one of my favorite antirepetition features.


    ## 3.6 Pattern Matching (or, Destructuring Assignment)


    In JavaScript, assignment is a strict one-at-a-time affair. If you had a list
    of values that you wanted to transfer to a list of variables, you’d probably write
    a custom function. But in CoffeeScript, you can just write one line of code:


    |   | `[firstName, middleInitial, lastName] = [`*`''Joe''`*`,` *`''T''`*`,` *`''Plumber''`*`]`
    |


    This syntax, called array pattern matching, may look odd at first. The square
    brackets on the left side of the assignment aren’t really creating an array, after
    all. Instead, it’s just describing a “pattern” of variables that the array on
    the right side fills in. So the line above is equivalent to this:'
