  trans: "\n啊，但你当然知道，当 `callback` 在没有相关对象的情况下被调用时，`this` 只会指向全局对象——或者指向其他库通过 `call`\
    \ 或 `apply` 设置的任何上下文。难道就没有办法让 `this` 始终指向同一个对象，无论函数如何被调用吗？\n\nJavaScript 可以做到这一点，但需要编写大量样板代码（参见\
    \ *=> 是如何工作的？*，不过值得一提的是，ECMAScript 5 作为最新一代浏览器支持的标准，在 `Function` 原型上提供了一个更简单的\
    \ `bind` 方法）。幸运的是，CoffeeScript 让将函数绑定到当前上下文变得像改变一个字符一样简单：用 `=>` 代替 `->`。我们将 `=>`\
    \ 称为“绑定函数运算符”，或者更非正式地称为“胖箭头”。\n\n于是我们的回调函数变成了这样：\n\n```\ncallback = (message)\
    \ => @voicemail.push message\n```\n\n现在我们可以放松了，因为 `this` 在函数内部的意义与函数定义处的意义相同，无论它在哪里被调用！\n\
    \n## => 是如何工作的？\n\n我们可以用 JavaScript 这样编写 `callback = (message) => @voicemail.push\
    \ message`：\n\n```\nvar callback;\ncallback = (function(__this) {\n  var __func\
    \ = function(message) {\n    return this.voicemail.push(message);\n  };\n  return\
    \ function() {\n    return __func.apply(__this, arguments);\n  };\n})(this);\n\
    ```\n\n①④\n\n最外层的函数将当前上下文 `this` 作为参数 `__this` 传入。\n\n②\n\n`__func` 包含我们想要绑定到当前上下文的函数代码。\n\
    \n③\n\n这里定义的匿名函数将成为 `callback`。因此，每当调用 `callback` 时，它的参数都会被传递给 `__func`，而 `__func`\
    \ 在 `__this` 作用域中运行，并返回 `__func` 的结果。\n\n注意，传递给 `callback` 本身的上下文从未被使用，并且 `__func`\
    \ 从未暴露给外部世界，从而确保它始终在定义 `callback` 的上下文中被调用。\n\n在实践中，CoffeeScript 使用一个名为 `__bind`\
    \ 的辅助函数，但底层技术是相同的。`=>` 可能是 CoffeeScript 最强大的简写形式。\n\n你可能会想，为什么不总是使用 `=>` 而不是 `->`\
    \ 呢？有两个原因。首先，绑定代码会在文件大小和执行时间上带来一些微小开销，而且通常是不必要的。但更重要的是，虽然上下文像变色龙一样的特性常常令人困惑，但它也能实现非常优雅的代码。例如，许多库通过上下文将关键信息传递给回调函数。这里有一个简单的例子（在第五章\
    \ *使用 jQuery 实现网页交互* 中会更清楚）：\n\n```\n$('#clickToHide').click -> $(this).hide()\n\
    ```\n\n与其严格地只使用普通函数或绑定函数，你需要在每次定义使用 `this`/`@` 的函数时仔细思考上下文应该意味着什么。\n\n作用域和上下文就讲到这里——现在你可以自认为是函数语义的大师了！接下来的几节将介绍一些有用的语法糖，然后我们终于要开始处理游戏项目的第一次迭代了。\n\
    \n## 2.4 属性参数（@arg）\n\n还记得我们之前定义的那个函数吗？它只是将参数的值设置为其上下文对象的属性：\n\n```\nsetName =\
    \ (name) -> @name = name\n```\n\n实际上，CoffeeScript 为此提供了一个方便的简写形式：\n\n```\nsetName\
    \ = (@name) -> # 无需代码！\n```\n\n很简单，当 `@` 出现在函数参数名称之前时，该函数会自动将参数赋值给上下文对象 `this`\
    \ 上同名的属性。\n\n这对于构造函数尤其有用，在第四章 *模块和类* 中我们将大量使用它。通常，为了设置实例对象的初始属性，我们会向构造函数传递四五个参数。而使用\
    \ `@argument` 语法，可以节省那么多行代码。不错。\n\n## 2.5 默认参数（arg =）\n\n假设你有一个函数，它的某个参数在大多数情况下都会取一个特定的值，比如这样：\n\
    \n```\nringFireAlarm = (isDrill) ->\n  # 几乎总是演习\n  ...\n```\n\n如果 `ringFireAlarm()`\
    \ 是更常见的 `ringFireAlarm true` 的简写，那该多好啊？我们可以这样写：\n\n```\nringFireAlarm = (isDrill)\
    \ ->\n  isDrill = true unless isDrill?\n  ...\n```\n\n这里 `unless (expression)`\
    \ 是 `if not (expression)` 的简写。`isDrill?` 中的 `?` 是存在运算符，它用于检查给定值 (1) 是否存在于当前作用域中，并且\
    \ (2) 不是 `undefined` 或 `null`。在心里，你可以将 `x?` 理解为“`x` 存在”。\n\n存在运算符也可以放在两个变量之间：`a\
    \ ? b` 如果 `a?` 则返回 `a`，否则返回 `b`。它还可以与 `=` 结合形成复合赋值运算符：`c ?= d` 是 `c = d unless\
    \ c?` 的简写。你可以理解为“让 `d` 成为 `c` 的默认值”。\n\n### 使用 'or=' 实现真值默认\n\n你可能会看到有人这样写：\n\n\
    ```\na or= b\n```\n\n这（或其等价形式 `a ||= b`）是一种让 `b` 成为 `a` 默认值的方法。那么，它与 `a ?= b`\
    \ 究竟有何不同？\n\n答案与“真值性”有关。在 CoffeeScript 中（与 JavaScript 一样），所有值都会被布尔逻辑运算符 `&&` 和\
    \ `||`（在 CoffeeScript 风格中称为 `and` 和 `or`）以及 `if` 隐式地强制转换为布尔值。大多数值会变成 `true`，而少数值——特别是\
    \ `null`、`undefined`、`0` 和空字符串——会变成 `false`。\n\n这种宽松灵活的布尔逻辑方法也延续到了布尔运算符的结果上。虽然某些语言只会从\
    \ `a or b` 语句中返回 `true` 或 `false`，但 CoffeeScript（像 JavaScript 一样）如果 `a` 为真则返回\
    \ `a`，否则返回 `b`。（`x and y` 如果两者都为真则返回 `y`，如果两者都为假则返回 `x`，如果只有一个为假则返回那个假值。）\n\n\
    这给了我们很多有用的快捷方式——包括 `a = a or b`（通常简写为 `a or= b`），意思是“如果 `a` 的值为假，则将 `a` 设置为 `b`”。虽然不如\
    \ `?=` 那么方便，但 `or=` 也是一个好帮手。\n\n```\nringFireAlarm = (isDrill) ->\n  isDrill ?=\
    \ true\n  ...\n```\n\n当然，正如你可能从本节标题中推断出的那样，还有一种更简洁的方式：\n\n```\nringFireAlarm =\
    \ (isDrill = true) ->\n  ...\n```\n\n“那么，”你可能会问，“你为什么花了那么多时间讨论存在运算符？”有两个原因。首先，存在运算符很酷。其次，CoffeeScript\
    \ 中默认参数的行为与其他编程语言（如 Ruby、Python 和 PHP）有些不同。在这些语言中，传递给函数的参数数量才是关键——只有当 `ringFireAlarm`\
    \ 被无参数调用时，`isDrill = true` 的赋值才会执行。相比之下，CoffeeScript 在幕后使用了存在运算符。这意味着显式传递 `null`\
    \ 或 `undefined` 与完全省略参数是一样的。\n\n如果不小心，这可能会导致令人不快的意外，但它也更灵活。你可以为一个参数设置多个默认值，调用者可以选择为其中任意子集使用默认值，如下所示：\n\
    \n```\nchooseMeals = (breakfast = 'waffles', lunch = 'gyros', dinner = 'pizza')\
    \ ->\n  ...\n\nchooseMeals null, 'burrito', null # 不喜欢 gyros\n```\n"
- fmt: '

    You can, of course, implement the more conventional default argument behavior
    by making the assignments conditional on `arguments.length`. But if you find yourself
    doing so, ask yourself whether you really need to accept `null` as a value. How
    about `false` or `NaN` or even a custom type instead?


    There is one more detail worth mentioning—you can use arbitrary expressions as
    default arguments, though this generally isn’t recommended. If you do so, the
    expression will be executed from whatever context the function is being called
    in, before any expression in the function body and only if the assignment is made.
    In other words, the following two expressions are exactly equivalent. Here’s the
    first way:


    ```

    dontTryThisAtHome = (noArgNoProblem = @iHopeThisWorks()) ->

    ...

    ```


    Here’s the other way:


    ```

    dontTryThisAtHome = (noArgNoProblem) ->

    noArgNoProblem ?= @iHopeThisWorks()

    ...

    ```


    There’s just one last feature to talk about before we get to our first project,
    and it’s a humdinger. Never before has a single ellipse done so much…


    ## 2.6 Splats (...)


    Taking a varying number of arguments is both easy and hard in JavaScript: it’s
    easy because every argument passed to a function (regardless of the number in
    the function’s declaration) is available from the `arguments` object, and it’s
    hard because `arguments` doesn’t support standard `Array` methods like `slice`
    and `shift`.


    Fortunately, CoffeeScript lets you convert any range of arguments to an array
    automatically. Just add an ellipsis, `...` (also known as “the splat”), to the
    end of any argument name:


    ```

    refine = (wheat, chaff...) ->

    console.log "The best: #{wheat}"

    console.log "The rest: #{chaff.join('', '')}"

    ```


    The splat here means “take every argument after the first one, `wheat`, and combine
    them into an array, `chaff`.” Calling `refine` with a list of four arguments results
    in the following:


    ```

    refine ''great'', ''not bad'', ''so-so'', ''meh''

    The best: great

    The rest: not bad, so-so, meh

    ```


    If just one argument is given, or if none are, then `chaff` will just be an empty
    array.


    A splatted argument doesn’t have to go at the end of an argument list. The CoffeeScript
    compiler is smart about determining the appropriate arguments to put in the array:


    ```

    sandwich = (beginning, middle..., end) ->

    ...

    ```


    Nonsplatted arguments always get filled in first. So if `sandwich` is called with
    only two arguments, those will become `beginning` and `end`. Only when there are
    three or more arguments is there a `middle`. Splats soak up any and all extra
    arguments.


    Even if the splat comes first, the plain arguments take priority:


    ```

    spoiler = (filler..., theEnding) -> console.log theEnding

    spoiler ''Darth Vader is Luke\''s father!''

    Darth Vader is Luke''s father!

    ```


    Of course, it only makes sense to have one splatted argument in a given function.
    Otherwise, the splats would have to duke it out over how to split the arguments
    amongst themselves.


    It’s worth mentioning that splats can also be used to divvy up arrays on the fly
    without the use of a function. Go ahead and launch the REPL (just run `coffee`
    with no arguments, remember?) and play with this feature a little:


    ```

    coffee> birds = [''duck'', ''duck'', ''duck'', ''duck'', ''goose!'']

    coffee> [ducks..., goose] = birds

    coffee> ducks

    duck,duck,duck,duck

    ```


    We’ll learn more about this syntax in Section 3.6, [​*Pattern Matching (or, Destructuring
    Assignment)*​](#f_0033.html_sec.patternMatching).


    In a function call, splats mean precisely the inverse of what they mean in argument
    lists and pattern-matching assignments: they expand an array into a series of
    arguments, rather than collapsing a series of arguments into an array. Let’s go
    to the REPL again:


    ```

    coffee> console.log 1, 2, 3, 4

    1 2 3 4

    coffee> arr = [1, 2, 3]

    coffee> console.log arr, 4

    [ 1, 2, 3 ] 4

    coffee> console.log arr..., 4

    1 2 3 4

    ```


    As you might have guessed, this syntax uses `apply` (which we met in Section 2.3,
    [​*Context (or, “What Is ’this’?”)*​](#f_0020.html_sec.context)) behind the scenes.


    Hopefully this chapter has given you a lot to take in. Now it’s time for us to
    put it all together with a small project, followed by a healthy helping of brainteasers.


    ## 2.7 Project: 5x5 Input Parser


    Remember our little word game idea (see [​*About the Example Project: 5x5*​](#f_0009.html_sec.5x5))?
    Well, it’s time to turn it into a reality! Now, we don’t know enough about hashes,
    arrays, and loops yet to implement a fully working version (omissions we’ll rectify
    in Chapter 3, [​*Collections and Iteration*​](#f_0027.html_chp.collections)).
    Still, we can at least get our feet wet by writing a command-line prompt using
    Node.js.


    But before we get started, we need to understand nonblocking IO. In most languages,
    we could write something like this:


    ```

    input = getInput()

    # now process input...

    ```


    The `getInput` function would wait for the user to type something and then returns
    it. This is called blocking IO, because `getInput` would “block” the execution
    of our program until the input is available.


    However, we can’t do this with Node because its IO is nonblocking (with the exception
    of a handful of convenience functions whose names end with `Sync`). Instead, we
    need to give Node a callback, which will get run whenever there’s an input event.
    (We’ll go into more depth on Node’s event model in Section 6.3, [​*Thinking Asynchronously*​](#f_0056.html_sec.async).)
    The closest analog to the above in Node is this:


    ```

    stdin.on ''data'', (input) ->

    # now process input...

    ```


    (The `stdin` object requires some initialization, which we’ll get to in a moment.)
    If you’re used to blocking IO, the transition to nonblocking IO can be jarring.
    But the benefits can be tremendous, because waiting for input (and, to a lesser
    extent, output) has long been a major source of performance degradation and limited
    scalability. Neither of these is really a big issue in this particular app, but
    designing applications to keep running while waiting for input is a good habit
    to develop, and Node essentially forces you to. The only way to write a blocking
    function is to create a native extension in C++.


    So let’s think a little bit about the structure of our app. Here’s what we need
    it to do:


    1.  Prompt for coordinates (`x, y`) for the first tile.

    2.  If the input is valid (two integers, each between 1 and the size of the grid),
    then prompt for the coordinates of the second tile.

    3.  Validate the input again. If it passes, say we’re swapping the two tiles.
    If it fails, explain why and offer a chance to try again.


    Let’s start by “opening” the standard input:


    [Functions/5x5/prompt.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/5x5/prompt.coffee)


    ```

    stdin = process.openStdin()

    stdin.setEncoding ''utf8''

    ```


    Where did `process` come from? It’s part of the Node environment, one of the few
    parts that doesn’t require a `require` statement to access. `process` provides
    methods for getting command-line arguments, managing memory, and, of course, dealing
    with standard IO.


    If we run the app at this point (with `coffee prompt.coffee`), we get a never-ending
    series of prompts. (`Ctrl`-`c` is your friend.) Each time you hit `Return`, Node
    looks for a callback to pass that input to. Since we haven’t given it a callback,
    nothing happens. Let’s fix that, shall we?


    [Functions/5x5/prompt.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/5x5/prompt.coffee)


    ```

    inputCallback = null

    stdin.on ''data'', (input) -> inputCallback input

    ```

    '
