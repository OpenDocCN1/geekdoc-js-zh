    但随着时间推移，有一个库变得如此流行，以至于成为了事实上的标准：jQuery。[[35]](#f_0052.html_FOOTNOTE-35) jQuery
    最初由当时 22 岁的 John Resig 于 2006 年发布，如今在访问量最高的前一万个网站中，近三分之一使用了 jQuery，[[36]](#f_0052.html_FOOTNOTE-36)而
    Resig 也已成为世界上最著名的程序员之一。最近的衍生项目，包括 jQuery Mobile，已将 jQuery 熟悉的语法带到了远超桌面端网页的领域。[[37]](#f_0052.html_FOOTNOTE-37)尽管其他库仍被广泛使用，但
    jQuery 确实独树一帜。


    在本章中，我们将介绍使用 jQuery 操作网页元素和响应事件的基础知识。（如果你熟悉 JavaScript 中的 jQuery，那么这只是一次复习，只需注意一些语法上的细微调整。）在本章末尾，我们将利用这些新获得的超能力，把我们那个古色古香的小文字游戏变成一个功能完备的基于浏览器的应用。


    ## 5.1 jQuery 之道


    每个 JavaScript 库都有其独特的哲学，而 jQuery 的哲学与 JavaScript（以及 CoffeeScript！）天然契合。


    jQuery 不会修改 JavaScript 的内置对象原型，例如`String`和`Array`。这是 jQuery 与第二流行的 JavaScript
    库 Prototype 之间的根本区别。Prototype 可以做一些令人惊叹的事情，但使用它意味着可能会破坏任何并非为 Prototype 编写的代码。例如，某个库可能使用`for
    x of arr`来遍历数组的索引，却没有意识到这也会包含 Prototype.js 添加到`Array.prototype`上的属性。（部分出于这个原因，在数组迭代中`for...in`比`for...of`更受青睐。在这种情况下，`for
    own...of`也能正常工作，因为它会跳过未通过`hasOwnProperty`测试的属性。）


    相反，jQuery 的强大功能被安全地封装在一个对象`jQuery`中，通常用别名`$`表示。本书将全程使用`$`这个别名，但请注意，可以禁用该别名，以防其他库也想使用这个变量名。[[38]](#f_0052.html_FOOTNOTE-38)


    jQuery 对象让你能够完成从动画过渡、添加事件回调到从服务器获取数据等各种操作。这甚至还没有用到成千上万个免费插件。[[39]](#f_0052.html_FOOTNOTE-39)当然，本章和下一章篇幅有限，无法展示
    jQuery 的全部能力，但应该能让你充分理解，从而在探索 jQuery 的广阔功能时避免常见陷阱——这些功能在[`api.jquery.com`](http://api.jquery.com)上有详尽的文档说明。


    ## 5.2 操作 DOM


    如果你熟悉在网页上下文中使用原生 JavaScript，你就会知道像`<p>`这样的 HTML 标签定义了 DOM 元素，JavaScript 代码可以读取、修改甚至从头创建这些元素。


    jQuery 将这些元素封装在自己的对象中，与直接访问元素相比，提供了更方便的功能（以及更强的跨浏览器一致性）。要获取一个 jQuery 对象，通常需要使用选择器，即传递给
    jQuery 对象的字符串。我们将在下一节 5.3 *选择元素*中进一步了解选择器；目前你只需要知道它们是 CSS 的超集。因此，要选择 ID 为`pikachu`的
    DOM 元素并将结果存储在 jQuery 对象`$pokemon`中（通常的样式约定是所有 jQuery 对象名称都以`$`为前缀），你可以这样写：


    `$pokemon = $(''pikachu'')`


    那些 DOM 元素去哪了？


    你创建的每个 jQuery 对象实际上就是一个有序的 DOM 元素列表，外面包裹着一个功能丰富、整洁的包装。要取出这些元素，官方文档建议你使用`get`：


    `pikachu = $(''pikachu'').get(0)`


    但 jQuery 对象有一个不为人知的小秘密：它们通过数字索引存储 DOM 元素，从而允许以数组方式访问：


    `pikachu = $(''pikachu'')[0]`


    你甚至可以使用数组函数，如`length`和`slice`（但不能使用`push`或`concat`——可以尝试用`add`代替）。


    当然，除非你清楚自己在做什么，否则应该克制直接使用 DOM 元素的冲动。如果你的在 Firefox 上测试通过的 DOM 代码在 IE7 中崩溃了，那只能怪你自己。


    一旦你有了一个 jQuery 对象，你就拥有了一个庞大的函数库可供使用。通常，这些函数会作用于所有匹配的元素。因此，如果你有两个段落，并写下以下代码，两个段落都会淡出：


    `$(''p'').fadeOut()`


    这条规则的一个例外是“getter”函数。它们只作用于第一个匹配的元素（但`text`是一个明显的例外，它会将所有匹配元素的文本内容合并成一个字符串）。考虑以下代码：


    `sonnet = $(''p'').html()`


    这段代码只会返回文档中第一个段落的 HTML 内容。相比之下，“setter”函数则作用于所有匹配的元素。通常，它们具有相同的名称，例如：


    `sonnet = $(''p'').html()`


    `$(''p'').html sonnet`


    这将会先读取第一个段落的 HTML，然后将所有段落的 HTML 设置为相同内容。（`text` getter 会去除 HTML 标签，并将所有匹配元素的内容拼接起来。在提取内容时，请仔细考虑使用`text`还是`html`更合适。[[40]](#f_0052.html_FOOTNOTE-40)）当然，这可以简化为一行（有点令人费解）的代码：


    `$(''p'').html $(''p'').html()`


    这个故事的寓意是：jQuery 和 CoffeeScript 可以用来编写优雅、可读的代码——你也可以用它来制作可运行的 ASCII 艺术。能力越大，责任越大。


    ## 5.3 选择元素


    当你向 jQuery 传递一个字符串时，它会被解释为一个选择器，并返回一个包含匹配元素的对象。选择器语法旨在镜像并扩展 CSS 的选择器语法。单独一个 HTML
    标签类型（例如`''p''`）会匹配所有该类型的元素。以`#`开头的标识符是唯一 ID，以`.`开头的是类名。


    你可以列出多个选择器，用逗号分隔，以匹配所有它们。例如，`$(''a, button, .link'')`会匹配所有`a`元素、所有`button`元素以及所有具有`link`类的元素。同样的元素集合也可以通过`$(''a'').add($(''button'')).add($(''.link''))`获得。


    当多个标识符用空格连接时，它们匹配后代元素。例如，`$(''#header img'')`匹配所有位于唯一 ID 为`header`的元素内部的`img`标签。同样的选择可以通过链式调用`find`方法实现：`$(''#header'').find(''img'')`。如果你只想要`header`的直接子元素中的图片，可以使用
    CSS2 语法`$(''#header > img'')`或链式调用`$(''#header'').children(''img'')`。


    除了这些 CSS 选择器，jQuery 还添加了几个特殊修饰符。例如，要只匹配奇数表格行，可以写`$(''tr:odd'')`。要只匹配包含链接的列表项，可以写`$(''li:has(a)'')`。匹配所有已选中的复选框只需写`$('':checked'')`。


    关于 jQuery 中选中的元素，有两点需要牢记。第一，选择只执行一次——选择器不是“实时”的（除了恰如其名地命名为`live`的方法以及功能类似的`delegate`，它们会在每次事件触发时根据需要运行给定的选择器）。第二，jQuery
    中不区分单个元素和元素集合；单个元素只是一个大小为 1 的集合。因此，例如，如果页面上的第一个`div`的 id 是`header`，那么`$(''#header'')`、`$(''div:first'')`和`$(''div'').first()`都是等价的。

