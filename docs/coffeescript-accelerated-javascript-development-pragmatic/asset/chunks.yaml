- fmt: "\nThe `stdin.on 'data'` call tells Node, “Each time a new line of input comes\
    \ in, pass it to this function.” That function simply forwards the input to another\
    \ function, `inputCallback`. Or rather, `inputCallback` will be a function later—right\
    \ now it’s just `null`. Why are we doing this? Because this proxy function makes\
    \ it easy to change the callback behavior. The `inputCallback = null` line (where\
    \ `null` is arbitrary) tells the compiler to give the variable module-level scope,\
    \ allowing it to be modified outside of the anonymous function.\n\nNote that if\
    \ we tried to set multiple callbacks on `stdin.on 'data'`, they would simply “stack,”\
    \ so each one would be called every time new input came in. We could unbind the\
    \ existing callback using `stdin.removeListener` if we stored a reference to the\
    \ listener, but that would entail a two-step process (unbind, bind). Instead,\
    \ we just change the value of `inputCallback`.\n\nOur simple app will have two\
    \ “states”: prompting for the coordinates of the first tile and prompting for\
    \ those of the second. Going into a state is a simple matter of displaying a message\
    \ and then setting `inputCallback`:\n\n[Functions/5x5/prompt.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/5x5/prompt.coffee)\n\
    \n```\npromptForTile1 = ->\n  console.log \"Please enter coordinates for the first\
    \ tile.\"\n  inputCallback = (input) ->\n    promptForTile2() if strToCoordinates\
    \ input\n```\n\nWhen new input comes in, the callback checks with the not-yet-defined\
    \ `strToCoordinates` function; if it gives the go-ahead, we pass control to the\
    \ mirror image prompt for the second tile of the move:\n\n[Functions/5x5/prompt.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/5x5/prompt.coffee)\n\
    \n```\npromptForTile2 = ->\n  console.log \"Please enter coordinates for the second\
    \ tile.\"\n  inputCallback = (input) ->\n    if strToCoordinates input\n     \
    \ console.log \"Swapping tiles...done!\"\n      promptForTile1()\n```\n\nNow,\
    \ what’s this about validation? Well, first let’s write a simple test for whether\
    \ a (zero-indexed) `x`, `y` pair is on the grid or not:\n\n[Functions/5x5/prompt.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/5x5/prompt.coffee)\n\
    \n```\nGRID_SIZE = 5\ninRange = (x, y) ->\n  0 <= x < GRID_SIZE and 0 <= y < GRID_SIZE\n\
    ```\n\n`GRID_SIZE` is in all-caps to indicate that it’s a constant (a stylistic\
    \ convention for us humans, not the compiler). The function takes advantage of\
    \ CoffeeScript’s chained comparisons feature: `0 <= x < GRID_SIZE` is shorthand\
    \ for `(0 <= x) and (x < GRID_SIZE)`.\n\nHere’s another simple test for whether\
    \ a number is an integer:\n\n[Functions/5x5/prompt.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/5x5/prompt.coffee)\n\
    \n```\nisInteger = (num) ->\n  num is Math.round(num)\n```\n\nNow let’s use these\
    \ to make a magical string-to-coordinate converter, complete with handy error\
    \ messages:\n\n[Functions/5x5/prompt.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/5x5/prompt.coffee)\n\
    \n```\nstrToCoordinates = (input) ->\n  halves = input.split(',')\n  if halves.length\
    \ is 2\n    x = parseFloat halves[0]\n    y = parseFloat halves[1]\n    if !isInteger(x)\
    \ or !isInteger(y)\n      console.log \"Each coordinate must be an integer.\"\n\
    \    else if not inRange x - 1, y - 1\n      console.log \"Each coordinate must\
    \ be between 1 and #{GRID_SIZE}.\"\n    else\n      {x, y}\n  else\n    console.log\
    \ 'Input must be of the form `x, y`.'\n```\n\nYou might wonder how this works\
    \ for the `if` conditions in the two `inputCallback` implementations. Well, `console.log`\
    \ returns `undefined`, which gets coerced to `false` by condition checks, and\
    \ any nonempty object gets coerced to `true`. So, we either return `{x, y}` or\
    \ we give an error message, and all our boolean needs are taken care of for us.\n\
    \nNow there’s just one piece missing: we need to start in one of our states so\
    \ that `inputCallback` gets defined before it’s called:\n\n[Functions/5x5/prompt.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/5x5/prompt.coffee)\n\
    \n```\nconsole.log \"Welcome to 5x5!\"\npromptForTile1()\n```\n\nAnd that’s it!\
    \ Run `prompt.coffee` to try it for yourself. It should look like Figure 3, [*Playing\
    \ with our command-line prompt*](#f_0024.html_fig.5x5_prompt).\n\n![images/5x5_prompt.png](images/5x5_prompt.png)\n\
    \n* * *\n\n**Figure 3. Playing with our command-line prompt**\n\nHopefully you’ve\
    \ developed an appreciation for the power and syntactic ease of CoffeeScript functions.\
    \ In the next chapter, we’ll learn about working with objects and arrays, and\
    \ we’ll turn our little experiment in standard IO into a full-fledged game.\n\n\
    ## 2.8 You’ve Done Well, Young Padawan\n\nIt’s safe to say that you now know more\
    \ about CoffeeScript than 99.999 percent of the Earth’s population. You’ve learned\
    \ how to define, call, and return values from functions. You’ve also learned that\
    \ functions create scope, and that the context variable `this` is a fickle creature\
    \ that depends on how the function is called—unless the function is bound to the\
    \ context it’s defined in by being defined with `=>`.\n\nYou’ve also sampled a\
    \ smorgasbord of CoffeeScript’s other features: `if/unless`, `try...catch`, default\
    \ argument values, and property arguments among them. Then we used those features\
    \ to write a simple command-line app that runs on Node.js.\n\nThere are only two\
    \ areas of CoffeeScript that we haven’t touched yet: collections (objects and\
    \ arrays) and iteration (loops). By a happy coincidence, those are the subject\
    \ of the next chapter.\n\nBut before we go on, test your knowledge with the following\
    \ exercises. You weren’t thinking of skipping them, were you? Trust me: they’ll\
    \ save you from pain in the future.\n\n## 2.9 Exercises\n\n### 1.\n\nThe following\
    \ function will remove all elements from the given array and return the result\
    \ of the `splice`, which in this case will be a copy of the original array. (We’ll\
    \ learn more about that particular function in [*Slicing and Splicing*](#f_0029.html_sec.sliceSplice).)\n\
    \n```\nclearArray = (arr) ->\n  arr.splice 0, arr.length\n```\n\nHow would I make\
    \ `clearArray` return the cleared array instead? How would I make it return nothing\
    \ at all?\n\n(While this is a trivial example, marking functions as returning\
    \ nothing often allows the CoffeeScript compiler to generate more efficient output,\
    \ especially when loops are involved.)\n\n### 2.\n\nWrite a function called `run`\
    \ that takes a function as its first argument and passes all additional arguments\
    \ to the called function. That is, `run func, a, b` should be equivalent to `func(a,\
    \ b)`. Hint: This shouldn’t take more than one line.\n\n### 3.\n\nImplicit parentheses\
    \ always go to the end of the expression but not necessarily to the end of the\
    \ line. Find a case where implicit parentheses fall short of the end of the line.\n\
    \n### 4.\n\nWhen you use explicit parentheses in a function call, CoffeeScript\
    \ doesn’t allow any whitespace after the function name. For instance, `f (a, b)`\
    \ is a syntax error. Can you think of a reason why this rule is in place? (Hint:\
    \ What does `f (g) h` mean?)\n\n### 5.\n\nWhat is the context of the function\
    \ call `foo.bar.baz()`? What about `@hoo()`? `@hoo.rah()`?\n\n### 6.\n\n`x` refers\
    \ to a variable that obeys scoping rules, while `@x` refers to a variable that\
    \ obeys context rules. The two will never be equivalent—they may reference the\
    \ same object, but writing `x = y` would not affect `@x` and vice versa.) But\
    \ `what.x` and `@x` can be equivalent. If they are, then what is `what`?\n\nTo\
    \ find the answer, add a very short line to this code that will generate the output\
    \ “quantum entanglement”:\n\n```\nxInContext = ->\n  console.log @x\n```\n"
