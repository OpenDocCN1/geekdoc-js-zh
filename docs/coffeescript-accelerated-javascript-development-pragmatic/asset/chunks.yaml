  trans: "\n\n## 1.2 CoffeeScript 的文本编辑器\n\n支持 CoffeeScript 的最新文本编辑器列表可在 [`github.com/jashkenas/coffee-script/wiki/Text-editor-plugins`](http://github.com/jashkenas/coffee-script/wiki/Text-editor-plugins)\
    \ 找到。如果你使用 Mac，我推荐由 Jeremy Ashkenas 本人维护的 TextMate 插件。[[22]](#f_0016.html_FOOTNOTE-22)\
    \ 在撰写本文时，还有适用于 Vim、Emacs、gedit、jEdit 和 IntelliJ IDEA 的插件。\n\n最近，使用基于 Web 的文本编辑器进行编码已成为可能，这可以实现实时协作，并让你摆脱特定设备的束缚。目前，对\
    \ CoffeeScript 支持最好的 Web 编辑器是 Cloud9，配合 Cloud9 Live CoffeeScript 扩展。[[23]](#f_0016.html_FOOTNOTE-23)\n\
    \n当然，你可以使用任何你喜欢的编辑器，但使用支持 CoffeeScript 的编辑器会带来三大优势：语法高亮、智能缩进和内置编译快捷键。前两点很容易理解，但最后一点是许多程序员未能充分利用的。\n\
    \n![images/TextMate_run.png](img/TextMate_run.png)\n\n**图 2. 直接从 TextMate 运行选中的代码**\n\
    \n在 TextMate 中，我可以使用 ⌘R（“运行”）来运行 CoffeeScript 文件，或者使用 ⌘B（“构建”）仅查看编译后的 JavaScript。编译只需几毫秒，因此如果我不确定某个\
    \ CoffeeScript 表达式如何转换为 JavaScript，快速构建是最快的查找方式。如果选中了文本，这些命令将仅对选中的部分执行，而不是整个文件，这使得测试代码片段和定位语法错误更加容易。\n\
    \n有一点需要提醒——某些编辑器（包括 TextMate）默认不会读取 `PATH`，这意味着当它尝试运行 `coffee` 时，你会收到类似 `command\
    \ not found` 的错误。如果遇到此问题，请进入编辑器的偏好设置（可能在“Shell 变量”下），并将 `PATH` 设置为与你在 shell 中运行\
    \ `echo $PATH` 时得到的输出一致。你还可以顺便设置 `NODE_PATH`。\n\n## 1.3 认识 `coffee`\n\n现在你已经设置好了编辑器，是时候介绍\
    \ `coffee`——标准命令行编译器了。让我们从必不可少的“Hello, world!”程序开始。打开编辑器，创建一个名为 `hello.coffee`\
    \ 的新文件，内容如下：\n\n```\nconsole.log 'Hello, world!'\n```\n\n现在只需运行它：\n\n```\n$ coffee\
    \ hello.coffee\n```\n\n```\nHello, world!\n```\n\n你可能会疑惑几个问题：首先，那个 `console.log`\
    \ 函数是从哪里来的？（答案：它是 Node.js 的全局函数。）其次，JavaScript 在哪里？CoffeeScript 的意义不就是编译成 JavaScript\
    \ 吗？\n\n这里发生的是，`coffee` 在内部将 `hello.coffee` 编译成 JavaScript，然后将输出直接传递给 Node 立即执行。如果这不是你想要的效果，你需要使用\
    \ `coffee` 的众多选项中的一个或多个。要查看它们，请使用 `coffee -h`：\n\n```\n$ coffee -h\n\nUsage: coffee\
    \ [options] path/to/script.coffee\n\n-c, --compile compile to JavaScript and save\
    \ as .js files\n-i, --interactive run an interactive CoffeeScript REPL\n-o, --output\
    \ set the directory for compiled JavaScript\n-j, --join concatenate the scripts\
    \ before compiling\n-w, --watch watch scripts for changes, and recompile\n-p,\
    \ --print print the compiled JavaScript to stdout\n-l, --lint pipe the compiled\
    \ JavaScript through JSLint\n-s, --stdio listen for and compile scripts over stdio\n\
    -e, --eval compile a string from the command line\n-r, --require require a library\
    \ before executing your script\n-b, --bare compile without the top-level function\
    \ wrapper\n-t, --tokens print the tokens that the lexer produces\n-n, --nodes\
    \ print the parse tree that Jison produces\n--nodejs pass options through to the\
    \ \"node\" binary\n-v, --version display CoffeeScript version\n-h, --help display\
    \ this help message\n```\n\n因此，如果你想查看编译器刚才隐藏的 JavaScript，可以运行以下命令：\n\n```\n$ coffee\
    \ -p hello.coffee\n(function() {\n  console.log('Hello, world!');\n}).call(this);\n\
    ```\n\n关于那两行额外代码的解释，请参见 *JavaScript 的包装*。\n\n### JavaScript 的包装\n\n你可能想知道为什么 CoffeeScript\
    \ 的输出会被包装在一个函数中。原因很简单：命名空间。如果你将一堆 JavaScript 文件加载到浏览器应用程序中，它们会被视为一大块代码。这很容易导致意外后果：\n\
    \n```\n// 第一个文件\nfunction declareNuclearWar() {\n  alert('放松。这只是一次测试');\n}\nwindow.onload\
    \ = function() {\n  declareNuclearWar();\n}\n\n// 第二个文件\nfunction declareNuclearWar()\
    \ {\n  alert('轰炸将在 5 分钟后开始。');\n}\n```\n\n编写第一个文件的人完全不知道那段代码会引发怎样的混乱！通过将每个文件包装在一个匿名函数中，可以避免灾难，从而隔离两个\
    \ `declareNuclearWar` 声明。（参见第 2.2 节 *作用域：你在哪里看到它们*。）这被称为模块模式。\n\n为了让模块之间能够通信，你需要“导出”一些变量。（更多内容请参见第\
    \ 4.1 节 *模块：拆分应用*。）\n\n哦——如果你必须去掉包装，请使用 `-b`（“bare”）标志运行 `coffee`。\n\n### 编译为\
    \ JavaScript\n\n最常用的标志可能是 `-c`（“compile”），它将 JavaScript 输出保存到文件中。文件名与原文件相同，只是扩展名从\
    \ `coffee` 变为 `js`。让我们继续以咖啡因饮料为主题：\n\n```\n$ coffee -c mochaccino.coffee\n```\n\
    \n这会在同一目录下编译生成一个名为 `mochaccino.js` 的文件。你可以使用 `-o`（“output”）标志将输出放到其他位置，后跟目标目录名称：\n\
    \n```\n$ coffee -co output source\n```\n\n此示例读取 `source` 目录（及其子目录）中的每个 `coffee`\
    \ 文件，并将对应的 `js` 文件写入 `output` 目录。注意，`-co` 只是 `-c -o` 的简写形式。顺序很重要：`-o` 需要紧跟在输出目录名称之前。\n\
    \n另一个常用的标志是 `-w`（“watch”），它告诉 `coffee` 在后台持续运行；与 `-c` 结合使用时，它会在你每次修改代码时重新编译。它甚至适用于目录，并保留嵌套的文件结构。因此，如果我运行以下命令，`coffee`\
    \ 目录中的所有内容将不断重新编译到 `js` 目录：\n\n```\n$ coffee -cwo js coffee\n```\n\n这将持续运行，直到我按\
    \ `Ctrl`-`c` 终止编译器。\n\n### REPL\n\n如果你直接运行 `coffee` 而不带任何参数，你将进入被过度复杂的程序员称为 REPL（读取-求值-输出循环）的环境。通俗地说，这意味着你输入一些内容，它运行，你看到输出，然后重复。\n\
    \n这对于尝试语言特性非常有用。REPL 在 Node.js 环境中运行，并打印每个表达式的结果。例如，如果我们想回顾一下 JavaScript 的 `parseInt`\
    \ 函数的一些古怪之处，可以尝试以下操作：\n\n```\n$ coffee\ncoffee> parseInt '221'\n221\ncoffee> parseInt\
    \ '221b'\n221\ncoffee> parseInt 'b221'\nNaN\n```\n\n"
- fmt: "\nThat’s it for our coverage of `coffee`. By the way, if you want to see how\
    \ `coffee` works, check out the annotated source.[[24]](#f_0016.html_FOOTNOTE-24)\
    \ If you’d like, you can even reverse-engineer it and write your own interface\
    \ for the CoffeeScript compiler (like my own Jitter[[25]](#f_0016.html_FOOTNOTE-25)).\n\
    \nRemember that `coffee` is a lightweight tool; it doesn’t offer features like\
    \ minification or automatically running tests after compilation. If you want to\
    \ add those to your project, you should write your own build script, typically\
    \ as a Cakefile. You can find some documentation on Cakefiles over at the CoffeeScript\
    \ wiki.[[26]](#f_0016.html_FOOTNOTE-26)\n\nYou’re almost ready to start writing\
    \ CoffeeScript code—but first, what should you do if something goes awry?\n\n\
    ## 1.4 Debugging CoffeeScript\n\nOne issue many folks have with writing code in\
    \ a language like CoffeeScript is that runtime errors reference `compiled` code,\
    \ not source code. That’s a legitimate concern, and several solutions have been\
    \ discussed.[[27]](#f_0016.html_FOOTNOTE-27) Unfortunately, for now you’re left\
    \ with stack traces whose line numbers have little to do with your source code.\n\
    \nHere’s the good news: CoffeeScript’s compiled JavaScript is very readable. If\
    \ you understand how the two languages are related (and I hope you will after\
    \ reading this book), then matching a point of failure in your program to the\
    \ original CoffeeScript source is pretty easy.\n\nIt’s not ideal, but it’s the\
    \ price of being on the cutting edge. As the CoffeeScript ecosystem grows and\
    \ the tools get better, it’ll get easier and easier to track down bugs. The folks\
    \ at the Mozilla Foundation are hard at work adding CoffeeScript debugging support\
    \ to Firefox, and Node can’t be far behind. Until then, test your code thoroughly,\
    \ use debug-mode logging, and know your JavaScript.\n\nWhat was that middle thing?\
    \ Oh, right. Under Node.js and browsers equipped with a developer console (or\
    \ a bookmarklet like the previously mentioned Firebug Lite), you can display messages\
    \ using `console.log`. Two possible problems: you don’t always want to log every\
    \ detail, and you don’t want to call `console.log` if it doesn’t exist. A common\
    \ solution is to use a wrapper function, but then you don’t get those precious\
    \ JavaScript line numbers when you log something (since all the logging is being\
    \ done from the same place: the wrapper function). So here’s one approach I recommend:\n\
    \n```\nwindow.debugMode = document.location.hash.match(/debug/) and console?\n\
    console.log 'This is the first of many debug-mode outputs' if debugMode\n```\n\
    \nIn this example, `debugMode` will be `true` if and only if the “hash” in the\
    \ address bar contains the string `debug` (e.g. `page.html#debug`) and the browser\
    \ has a `console` object. This gives you an easy way to enable/disable all those\
    \ extra messages when you load the page. Declaring `debugMode` as a property of\
    \ `window` makes it a global variable.\n\nA simpler but less versatile approach\
    \ is to use a soak (see [​*Soaks: ’a?.b’*​](#f_0028.html_sec.soaks)) to ensure\
    \ that `console.log` is only called when `console` exists:\n\n```\nconsole?.log\
    \ 'Thanks to ?, this line is perfectly safe!'\n```\n\nUnder Node, there are plenty\
    \ of libraries for displaying output at several levels of verbosity (just do a\
    \ quick Google search for “nodejs logging library”), including my own styout,\
    \ which comes with support for colored-console output.[[28]](#f_0016.html_FOOTNOTE-28)\n\
    \nLogging can replace comments, providing more information during development\
    \ on how the code is working. For example, here’s a typical piece of documented\
    \ code:\n\n```\narea = height * (base1 + base2) / 2\n# now we have the area of\
    \ the trapezoid\n```\n\nThe comment could be replaced with a call to `console.log`\
    \ as follows:\n\n```\narea = height * (base1 + base2) / 2\nconsole.log \"The area\
    \ of the trapezoid is #{area}\" if debugMode\n```\n\nAnother common idiom is to\
    \ make assertions throughout code. The standard `console` object has an `assert`\
    \ function that serves that purpose nicely, taking a value and an error message\
    \ (to be displayed if the value is non-truthy):\n\n```\nfundamentalLaws = ['death',\
    \ 'taxes', 'gravity']\nif debugMode\n  console.assert 'gravity' in fundamentalLaws,\
    \ 'gravity oughta be a law!'\n```\n\nFinally, the most important guard against\
    \ bugs is to write well-structured code. While the tools don’t exist yet to give\
    \ you an exact line number for your runtime error, at least you should always\
    \ be able to track down the part of your app that’s causing you grief.\n\n## 1.5\
    \ Ready to Roll!\n\nIn this chapter, you’ve learned how to install CoffeeScript\
    \ on your machine using Node.js and npm. You’ve also gotten your favorite text\
    \ editor on speaking terms with the language, explored some of the ways you can\
    \ use CoffeeScript as part of your development workflow, and considered the challenge\
    \ of debugging.\n\nSo now that you know how to run CoffeeScript code, it’s about\
    \ time we went into the nuts and bolts of the language itself. The rest of this\
    \ book will be jam-packed with snippets of code. The best way to follow along\
    \ is to run these from your favorite text editor; if you don’t understand how\
    \ they work, try tweaking a line or two to see what happens. You might also want\
    \ to look at the compiled JavaScript from time to time.\n\nCode snippets that\
    \ refer to a file, like so, may require additional pieces in order to run:\n\n\
    ```\nGettingStarted/outOfContext.coffee\nfoo bar, baz\n```\n\nThose that don’t\
    \ are self-contained:\n\n```\nOK = 'computer'\nconsole.log 'No alarms and no surprises.'\
    \ if OK\n```\n\nAnd trust me—you’re going to have a lot more fun if your editor\
    \ is equipped with a Run command so that you can see the code’s results just by\
    \ tapping a keyboard shortcut. It’s a CoffeeScript learner’s best friend.\n\n\
