  trans: "\n\n`$elem.insertAfter $('#grid')`\n\n`animationTarget = opacity: 0, height:\
    \ 0, padding: 0`\n\n`$elem.delay(5000).animate animationTarget, 500, -> $elem.remove()`\n\
    \n最后，`endTurn` 更新了瓷砖网格和计分表，然后通知下一位玩家轮到他们了。\n\n要查看游戏整合后的效果，请参见图 5，*5x5，由 jQuery\
    \ 驱动*。\n\n![images/jq5x5.png](img/jq5x5.png)\n\n**图 5. 5x5，由 jQuery 驱动**\n\n当然，我们还可以添加更多功能——例如，已使用单词列表、每回合的时间限制、每位玩家进行一定回合数（或一定时间后）的“游戏结束”画面，更不用说更炫酷的动画和界面元素（比如拖放功能，用\
    \ jQuery UI 实现起来轻而易举）。[[42]](#f_0052.html_FOOTNOTE-42) 但这些就留给你自己去探索了。\n\n## 5.6\
    \ 未来已 jQuery 化\n\n在本章中，我们涵盖了 jQuery 的所有基础知识，它是 JavaScript 中与网页交互最接近标准库的东西。你学会了用选择器抓取元素、操作它们的\
    \ CSS 样式和 HTML 属性，以及绑定事件。从头开始构建一个交互式网页的前景，应该不会再让你冷汗直冒了。\n\n我们尚未涉及的一个主要主题是 Ajax。jQuery\
    \ 让与服务器通信变得轻而易举。你可以在 [`api.jquery.com/category/ajax/`](http://api.jquery.com/category/ajax/)\
    \ 找到相关文档。\n\n还有一点值得一提。得益于 Node.js，jQuery 现在可以轻松地在服务器上运行。怎么做到的？通过一个名为 jsdom 的库，它在\
    \ Node 中提供了一个模拟的浏览器环境。[[43]](#f_0052.html_FOOTNOTE-43) jsdom 和 jQuery 的一个绝佳用例是模板化。当你可以直接获取原始\
    \ HTML 并在服务器上用 jQuery 操作它再提供服务时，何必还要费心编写服务器端模板（比如 Ruby on Rails 中的 ERB 文件）呢？这样，你可以提供一个有意义的页面初始版本（对搜索引擎和屏幕阅读器非常友好），然后在客户端重用相同的代码来添加动态内容。\n\
    \n我鼓励你自己尝试 Ajax 和 jsdom。在下一章中，我们将采用不同的方法：使用 WebSocket（通过一个名为 Socket.io 的库）来实现客户端和服务器之间的双向异步通信。同时，我们也会更深入地了解\
    \ Node.js，用它来托管 5x5 的多玩家版本。\n\n## 5.7 练习\n\n1.  jQuery 新手常犯的一个（实际上几乎是普遍的）错误是认为\
    \ jQuery 选择器是“活的”。例如，他们认为可以向菜单中添加新项目（即，将新的 `li` 作为 `#menu` 的子元素插入），这些项目也会被以下代码隐藏：\n\
    \n    ```\n    $('#menu li').hide()\n    ```\n\n    错！在不调用单个 `li` 元素上的任何方法的情况下，你会如何实现所需的行为？（你可以使用样式表。）\n\
    \n2.  这段代码做了什么？世界安全吗？\n\n    ```\n    $('a').click(destroyWorld).unbind('click')\n\
    \    ```\n\n3.  以下三个选择器在功能上是等价的。哪一个行为不同，以及如何不同？\n\n    ```\n    $('#awayTeam .redShirt').die()\n\
    \    ```\n\n    ```\n    $('#awayTeam').find('.redShirt').die()\n    ```\n\n \
    \   ```\n    $('.redShirt, #awayTeam').die()\n    ```\n\n    ```\n    $('.redShirt',\
    \ $('#awayTeam')).die()\n    ```\n\n    （顺便说一句，`die` 确实是 jQuery 的一个方法——它用于解绑通过\
    \ `live` 绑定的事件！）\n\n4.  找出、解释并修复这段代码中的 bug：\n\n    ```\n    $('#drJekyll').click\
    \ ->\n    alert 'Now I shall transform!'\n    $('#drJekyll').attr 'id', 'mrHyde'\n\
    \    $('#drJekyll').unbind 'click'\n    ```\n\n#### 脚注\n\n- [[35]](http://jquery.com/)\n\
    - [[36]](http://trends.builtwith.com/javascript/JQuery)\n- [[37]](http://jquerymobile.com/)\n\
    - [[38]](http://api.jquery.com/jQuery.noConflict/)\n- [[39]](http://plugins.jquery.com/)\n\
    - [[40]](http://stackoverflow.com/questions/1910794/jquery-text-vs-html)\n- [[41]](http://www.alfajango.com/blog/the-difference-between-jquerys-bind-live-and-delegate/)\n\
    - [[42]](http://jqueryui.com/)\n- [[43]](http://jsdom.org/)\n\n版权所有 © 2011，The\
    \ Pragmatic Bookshelf。\n\n# 第 6 章\n\n使用 Node.js 构建服务器端应用\n\n长期以来，在服务器上运行 JavaScript\
    \ 一直是 Web 开发者的梦想。使用 JavaScript 驱动的服务器，开发者无需在客户端语言和服务器端语言之间来回切换，只需精通这种 Web 应用的通用语言——或者它的\
    \ 21 世纪分支 CoffeeScript。\n\n如今，这个梦想终于成为现实。在本章中，我们将简要介绍 Node.js，从它的模块模式（CommonJS\
    \ 规范的一部分）开始。然后，我们将弄清楚什么是“事件驱动架构”，以及它对服务器性能和我们的心智的影响。最后，我们将为上一章的 5x5 项目添加一个 Node\
    \ 后端，并通过 WebSocket 提供实时多玩家支持。\n\n## 6.1 什么是 Node.js？\n\n忽略这个名字：Node.js 不是一个 JavaScript\
    \ 库。相反，Node.js 是一个 JavaScript 解释器（由 V8 驱动，即 Google Chrome 浏览器使用的引擎），它与底层操作系统交互。这样，由\
    \ Node.js 运行的 JavaScript 可以读写文件、生成进程，以及——最吸引人的——发送和接收 HTTP 请求。\n\n与 CoffeeScript\
    \ 一样，Node 是一个新项目（始于 2009 年初），它迅速崛起并吸引了各种关注。看看 Node.js Knockout 就知道了，这是一个受 Rails\
    \ Rumble 启发的竞赛，旨在 48 小时内开发出最好的 Node 应用。[[44]](#f_0059.html_FOOTNOTE-44)\n\n许多令人惊叹的项目已经用\
    \ Node 和 CoffeeScript 编写完成。以下是一个精选的小样本。你可能想在读完本书后再回来看看这个列表；阅读真实世界的代码是提升你掌握程度的绝佳方式：\n\
    \n*   *Docco* [Ash11]：超级计算机科学家 Donald Knuth 倡导“文学编程”，即代码和注释的编写方式使得初次接触程序的人只需阅读一遍就能理解。Jeremy\
    \ Ashkenas 编写的 Docco 通过生成漂亮的网页来支持这种方法，其中注释和代码并排显示。\n\n*   *Eco* [Ste11]：假设你正在编写一个基于\
    \ Node 的 Web 应用程序。你有一堆 HTML 骨架和一堆应用程序代码，但不确定如何将两者结合起来。Eco 允许你在标记中嵌入 CoffeeScript，将其转变为服务器端模板语言。\n\
    \n*   *Zappa* [NM11]：从头开始创建 Web 应用程序从未如此简单。Zappa 是 Node 流行的 Express 框架之上的一个层，让你可以简洁地定义\
    \ Web 服务器应如何响应任意 HTTP 请求。[[45]](#f_0059.html_FOOTNOTE-45) 与 Eco 配合使用效果也很好！\n\n"
- fmt: "\n`Zombie.js` [Ark11]: There’s a new kid on the full-stack web app testing\
    \ block: `Zombie.js`. Zombie lets you validate your application’s behavior with\
    \ the power of Sizzle, the same selection engine that powers jQuery. Not only\
    \ is it easy to use, it’s also insanely fast.\n\nYou can find a more comprehensive\
    \ list of CoffeeScript-powered apps of all kinds at [http://github.com/jashkenas/coffee-script/wiki/In-The-Wild](http://github.com/jashkenas/coffee-script/wiki/In-The-Wild).\n\
    \n## 6.2 Modularizing Code with `exports` and `require`\n\nIn past chapters, we’ve\
    \ used `global` to put variables in an application-wide namespace. While `global`\
    \ has its place, Noders generally prefer to keep their code nice and modular,\
    \ with each file having its own namespace. How, then, do you share objects from\
    \ one file with another?\n\nThe answer is a special object called `exports`, which\
    \ is part of the CommonJS module standard. A file’s `exports` object is returned\
    \ when another file calls `require` on it. So, for instance, let’s say that I\
    \ have two files:\n\n`Nodejs/app.coffee`:\n\n```\nutil = require './util'\nconsole.log\
    \ util.square(5)\n```\n\n`Nodejs/util.coffee`:\n\n```\nconsole.log 'Now generating\
    \ utility functions...'\nexports.square = (x) -> x * x\n```\n\nWhen you run `coffee\
    \ app.coffee`, `require './util'` executes `util.coffee` and then returns its\
    \ `exports` object, giving you the following:\n\n```\nNow generating utility functions...\n\
    25\n```\n\nYou might be wondering why we didn’t need to specify a file extension.\
    \ A `js` file extension is always optional under Node.js. `coffee` is also optional\
    \ but only if the running application has loaded the `coffee-script` library,\
    \ which is always implicitly done when we use `coffee` to run a file. `coffee-script`\
    \ also tells Node how to handle CoffeeScript files. So if we compiled `app` to\
    \ JavaScript but not `util`, then we’d have to write this:\n\n`Nodejs/app.js`:\n\
    \n```\nrequire('coffee-script');\nvar util = require('./util');\nconsole.log(util.square(5));\n\
    ```\n\nWhen a library’s name isn’t prefixed with `.` or `/`, Node looks for a\
    \ matching file in one of its library paths, which you can see by looking at `require.paths`.\n\
    \nBy convention, a library’s name for `require` is the same as its name for `npm`.\
    \ Recall, for instance, that we used `npm install -g coffee-script` to install\
    \ CoffeeScript. That gave us the `coffee` binary, but also the `coffee-script`\
    \ library. We’ll be using npm to install some more libraries for our project at\
    \ the end of this chapter.\n\n## 6.3 Thinking Asynchronously\n\nOne of the most\
    \ common complaints about JavaScript has always been its lack of support for threading.\
    \ While popular languages like Java, Ruby, and Python allow several tasks to be\
    \ carried out simultaneously, JavaScript is strictly linear.\n\nYet what might\
    \ seem on its surface to be JavaScript’s greatest weakness is now widely seen\
    \ as a blessing in disguise. Without threads, there are no mutexes, no race conditions,\
    \ no endless `sleep` loops. Many of the most common sources of software bugs are\
    \ banished. What’s more, multithreading often adds significant overhead to an\
    \ application, especially to web servers, which is one reason why Node.js has\
    \ a reputation as an efficient alternative to frameworks in languages that typically\
    \ rely on threads for concurrency.\n\n(Of course, without threads there’s no way\
    \ to take advantage of multiple processors. The good news is that there are already\
    \ projects out there, such as multi-node and cluster, that effectively bind multiple\
    \ instances of your app to the same server port, giving you the performance advantages\
    \ of parallel processing without the headaches of sharing data across threads.[[46]](#f_0059.html_FOOTNOTE-46))\n\
    \nBecause JavaScript is event-oriented rather than thread-oriented, events only\
    \ run when all other execution has stopped. Imagine how frustrating it would be\
    \ if every time your application made a request (say, to the file system or to\
    \ an HTTP server), it froze up completely until the request was completed! For\
    \ that reason, nearly every function in the Node.js API uses a callback: you make\
    \ your request, Node.js quickly passes it along, and your application continues\
    \ as if nothing happened. When your request is completed (or goes awry), the function\
    \ you passed to Node.js gets called.\n\nFor example, if you wanted to show the\
    \ contents of the current directory, you would write the following:\n\n```\nfs\
    \ = require 'fs'\nfs.readdir '.', (err, files) ->\n  console.log files\nconsole.log\
    \ 'This will happen first.'\n```\n\nHere’s what happens:\n\n1.  We ask Node.js\
    \ to read the current directory with `fs.readdir`, passing a callback.\n2.  Node.js\
    \ passes the request along to the operating system, then immediately returns.\n\
    3.  We print `'This will happen first.'` to the console.\n4.  Once our code has\
    \ run, Node.js checks to see if the operating system has answered our request\
    \ yet. It has, so it runs our callback, and a list of files in the current directory\
    \ is printed to the console.\n\nYou got that? This is very important to understand.\
    \ Your code is never interrupted. No matter how many RPMs your hard drive has,\
    \ that callback isn’t getting run until after all of your code has run. JavaScript\
    \ code never gets interrupted. Even the seemingly precise `setTimeout` and `setInterval`\
    \ will wait forever if your code gets stuck in an infinite loop.\n\nAll of that\
    \ is as true in the browser as it is in Node, but it’s doubly important to understand\
    \ in Node because your application logic will take the form of tangled chains\
    \ of callbacks. Have no doubt about it. The challenge is to manage them in a way\
    \ that humans can understand.\n\nConsider how a simple form submission to a web\
