- fmt: "\n`%` is the modulus operator; it gives us the remainder after division. The\
    \ `is` keyword compiles to JavaScript’s `===`, the strict equality operator. (There\
    \ is no analog to JavaScript’s `==`; see [*Strict Equality or Nothing*](#f_0018.html_sb.looseEquals).)\
    \ Hence, `odd` will return `true` if the given number is a positive integer that\
    \ is not divisible by 2 and `false` otherwise. (Because `%` coerces its values\
    \ to numbers, `odd` will also return `true` for, say, the string `’3’`.)\n\n###\
    \ Strict Equality or Nothing\n\nCoffeeScript’s `is` and `==` both compile to JavaScript’s\
    \ `===`; there’s no way to get the loose, type-coercing equality check of JavaScript’s\
    \ `==`, which is frowned upon by JSLint and others as the source of many “WTF?”\
    \ moments. Let’s borrow an example from [http://wtfjs.com/2011/02/11/all-your-commas-are-belong-to-Array](http://wtfjs.com/2011/02/11/all-your-commas-are-belong-to-Array):\n\
    \n```\n\",,,\" == new Array(4) // true\n'' == '0' // false\n0 == '' // true\n\
    0 == '0' // true\n```\n\nTo avoid these head-scratchers, you should perform type\
    \ conversions explicitly.\n\nNow in most settings this would be considered a perfectly\
    \ good oddness check. But let’s suppose that you’re writing a math library with\
    \ very strict specifications that state that if the function is given a value\
    \ that isn’t strictly a positive integer, then it should throw an exception. We\
    \ can do that by using conditionals, like so:\n\n```\n# Functions/odd.coffee\n\
    odd = (num) ->\n  if typeof num is 'number'\n    if num is Math.round num\n  \
    \    if num > 0\n        num % 2 is 1\n      else\n        throw \"#{num} is not\
    \ positive\"\n    else\n      throw \"#{num} is not an integer\"\n  else\n   \
    \ throw \"#{num} is not a number\"\n```\n\nNote the use of significant indentation\
    \ to delimit both the function and each conditional branch, rather than the curly\
    \ braces of JavaScript. In CoffeeScript, curly braces are used for one thing only:\
    \ declaring JSON-style objects. (More on that in the next chapter.)\n\nNow if\
    \ you try calling `odd` with anything but a positive integer, you’ll get `undefined`\
    \ (since `throw` statements have no return value). In order to actually see the\
    \ error message, you’ll need to use a `try...catch` block:\n\n```\n# Functions/odd.coffee\n\
    try\n  odd 5.1\ncatch e\n  console.log e\n# 5.1 is not an integer\n```\n\nWe could\
    \ improve the style of the `odd` function by simply checking each of our three\
    \ conditions in turn:\n\n```\n# Functions/odd.coffee\nodd = (num) ->\n  unless\
    \ typeof num is 'number'\n    throw \"#{num} is not a number\"\n  unless num is\
    \ Math.round num\n    throw \"#{num} is not an integer\"\n  unless num > 0\n \
    \   throw \"#{num} is not positive\"\n  num % 2 is 1\n```\n\n(If those lines weren’t\
    \ so long, we’d use the postfix style, `throw a unless b`, rather than the indented\
    \ style.) In general, whenever conditions lead to `throw` or `return`, we can\
    \ simplify branching logic to a simple series check.\n\nOf course, functions aren’t\
    \ limited to just returning values and throwing exceptions; they can also do stuff\
    \ by modifying variables and running other functions. (In functional programming\
    \ parlance, these are known as side effects.) These work just as you would expect\
    \ from JavaScript:\n\n```\ncount = 0\nincrementCount = -> count++\nincrementCount()\
    \ # count is now 1\n```\n\nNow you know the basics of defining and calling functions\
    \ in CoffeeScript. But the devil’s in the details, so let’s look at one of the\
    \ most important details: Where are variables visible?\n\n## 2.2 Scope: Where\
    \ You See ’Em\n\nSo far, we haven’t worried about where variables live. Alas,\
    \ we can’t always be so cavalier. Consider this example:\n\n```\nage = 99\nreincarnate\
    \ = -> age = 0\nreincarnate()\nconsole.log \"I am #{age} years old\"\n```\n\n\
    As you’d probably expect, the output is this:\n\n```\nI am 0 years old\n```\n\n\
    However, we can try flipping the first and second lines around, like this:\n\n\
    ```\nreincarnate = -> age = 0\nage = 99\nreincarnate()\nconsole.log \"I am #{age}\
    \ years old\"\n```\n\nNow hit Run and the code tells a very different story:\n\
    \n```\nI am 99 years old\n```\n\nStrange—the `reincarnate()` call doesn’t have\
    \ any effect! And what if we cut out `age = 99` altogether?\n\n```\nreincarnate\
    \ = -> age = 0\nreincarnate()\nconsole.log \"age = #{age}\"\n```\n\n```\nReferenceError:\
    \ age is not defined\n```\n\nWe’ve got ourselves a “scope” issue! But what is\
    \ scope? A variable’s scope is its home, as defined by three rules:\n\n1. Every\
    \ function creates a scope, and the only way to create a scope is to define a\
    \ function.\n2. A variable lives in the outermost scope in which an assignment\
    \ has been made to that variable.\n3. Outside of its scope, a variable is invisible.\n\
    \nFor instance, the scope of `age` in the first example was the global scope;\
    \ in the middle example, there was a variable named `age` in the global scope\
    \ and another in the `reincarnate` function’s scope; and in the last example,\
    \ there was just the `reincarnate`-scoped `age`. That’s why we got a `ReferenceError`\
    \ from trying to display `age` outside of `reincarnate`: no variable with that\
    \ name exists outside of that function.\n\nCoffeeScript’s approach to scope is\
    \ known as lexical scope, and it’s the same as in JavaScript, except that a variable’s\
    \ scope is defined explicitly in JavaScript using the `var` keyword while CoffeeScript\
    \ infers scope from assignments. This not only saves your fingers precious effort,\
    \ it also discourages you from shadowing one variable by giving a different variable\
    \ in a nested scope the same name. See [*Shadowing: The Name’s the Same*](#f_0019.html_sb.shadowing).\n\
    \n### Shadowing: The Name’s the Same\n\nThere are only two ways to shadow a variable\
    \ in CoffeeScript: One is, as we saw in the second `reincarnate` example, to create\
    \ a variable in a surrounding scope after a variable with inner scope. The other\
    \ way is with a function argument:\n\n```\nx = 5\ntriple = (x) -> x *= 3\ntriple\
    \ x # 15\nx # 5\n```\n\nShadowing is generally considered bad style and should\
    \ be avoided. Give your variables distinct names, lest you sew the seeds of scope\
    \ confusion.\n\nA function’s scope is nested within the scope that the function\
    \ itself lives in. (Remember, functions are just variables.) This is another important\
    \ thing to understand about scope: it doesn’t depend on where or how the function\
    \ is being called. You can always tell which scope something lives in just by\
    \ eyeballing the code or by compiling to JavaScript and looking for `var` declarations,\
    \ which are always placed at the top of their scope:\n\n```\nsingCountdown = (count)\
    \ ->\n  singBottleCount = (specifyLocation) ->\n    locationStr = if specifyLocation\
    \ then 'on the wall' else ''\n    bottleStr = if count is 1 then 'bottle' else\
    \ 'bottles'\n    console.log \"#{count} #{bottleStr} of beer #{locationStr}\"\n\
    \  singDecrement = ->\n    console.log \"Take one down, pass it around\"\n   \
    \ count--\n  singBottleCount true; singBottleCount false\n  singDecrement(); singBottleCount\
    \ true\n```\n"
