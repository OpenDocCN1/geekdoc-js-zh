    \ then the slice goes all the way to the end, whether you use two dots or three:\n\
    \n```\ncoffee> ['this', 'that', 'the other'][1..]\n['that', 'the other']\n```\n\
    \n```\ncoffee> ['this', 'that', 'the other'][1...]\n['that', 'the other']\n```\n\
    \n#### Slicing Strings\n\nCuriously, JavaScript provides strings with a `slice`\
    \ method, even though its behavior is identical to `substring`. This is handy,\
    \ because it means you can use CoffeeScript’s slicing syntax to get substrings:\n\
    \n```\ncoffee> 'The year is 3022'[-4..]\n3022\n```\n\nHowever, don’t get too carried\
    \ away—while slicing works fine on strings, splicing doesn’t. Once a JavaScript\
    \ string is defined, it can never be altered.\n\nCoffeeScript also provides a\
    \ shorthand for `splice`, the value-inserting cousin of `slice`. It looks like\
    \ you’re making an assignment to the slice:\n\n```\ncoffee> arr = ['a', 'c']\n\
    coffee> arr[1...2] = ['b']\ncoffee> arr\n['a', 'b']\n```\n\nThe range defines\
    \ the part of the array to be replaced. If the range is empty, a pure insertion\
    \ occurs at the first index:\n\n```\ncoffee> arr = ['a', 'c']\ncoffee> arr[1...1]\
    \ = ['b']\ncoffee> arr\n['a', 'b', 'c']\n```\n\nOne important caveat: While negative\
    \ indices work great for slicing, they fail completely when splicing. The trick\
    \ of omitting the last index works fine, though:\n\n```\ncoffee> steveAustin =\
    \ ['regular', 'guy']\ncoffee> replacementParts = ['better', 'stronger', 'faster']\n\
    coffee> steveAustin[0..] = replacementParts\ncoffee> steveAustin\n['better', 'stronger',\
    \ 'faster']\n```\n\nThat does it for slicing and splicing. You should now consider\
    \ yourself a wizard when it comes to extracting substrings and subarrays using\
    \ ranges! But ranges have another, even more fantastical use in the `for...in`\
    \ syntax, as we’ll see in the next section.\n\n## 3.3 Iterating over Collections\n\
    \nThere are two built-in syntaxes for iterating over collections in CoffeeScript:\
    \ one for objects and another for arrays (and other enumerable objects, but usually\
    \ arrays). The two look similar, but they behave very differently:\n\nTo iterate\
