    \ |\n\n|   | **`if`** `inRange(x, y - offset) and inRange(x, y - offset + range)`\
    \ |\n\n|   | `addTiles (i)` **`->`** `grid[x][y - offset + i]` |\n\n|   | *`#\
    \ Diagonal (upper-left to lower-right)`* |\n\n|   | **`if`** `inRange(x - offset,\
    \ y - offset) and` |\n\n|   | `inRange(x - offset + range, y - offset + range)`\
    \ |\n\n|   | `addTiles (i)` **`->`** `grid[x - offset + i][y - offset + i]` |\n\
    \n|   | *`# Diagonal (lower-left to upper-right)`* |\n\n|   | **`if`** `inRange(x\
    \ - offset, y + offset) and` |\n\n|   | `inRange(x - offset + range, y + offset\
    \ - range)` |\n\n|   | `addTiles (i)` **`->`** `grid[x - offset + i][y + offset\
    \ - i]` |\n\n|   | `str` **`for`** `str` **`in`** `strings` **`when`** `isWord\
    \ str` |\n\nThe outer loop `for length in [MIN_WORD_LENGTH..GRID_SIZE]` iterates\
    \ through all game-level legal word sizes (in our case, from 2 to 5). We define\
    \ an `addTiles` function that calls a given function with each integer value `i`\
    \ from 0 to `length - 1` inclusive and then combines the results (which are characters)\
    \ as a single string. The argument to `addTiles` is a function that, given `i`,\
    \ returns the value of the tile `i` steps from the starting point in a certain\
    \ direction.\n\nThe inner loop, `for offset in [0...length]`, is there because\
    \ we want all words through the given tile, not just those starting at it. For\
    \ instance, in the vertical direction and when offset is 0, we get all the words\
    \ going down from the given tile; when offset is 1, we get all the words going\
    \ down from the tile above the given tile; and so on up to the edge of the grid.\n\
    \nSpeaking of edges, those `inRange` checks ensure that both ends of a potential\
    \ word are within the grid. If those tests pass, we send a callback to `addTiles`\
    \ providing the tile value at each step `i`, and `addTiles` pushes the potential\
    \ word to our `strings` list. Those items in `strings` that pass the `isWord`\
    \ test get returned from the function.\n\n(The use of function passing in `addTiles`\
    \ may seem unnecessary, but it actually greatly simplified the `wordsThroughTile`\
    \ function; in an earlier version, the same loop and `join` code was repeated\
    \ four times!)\n\nWhew! Now to initialize the game. We’ll want to count words\
    \ that are already in the grid at the start as used, which we can do by performing\
    \ `scoreMove` on a “swap” of each tile with itself:\n\n| [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)\
    \ |\n\n|   | `console.log` *`\"Welcome to 5x5!\"`* |\n\n|   | **`for`** `x` **`in`**\
    \ `[0...GRID_SIZE]` |\n\n|   | **`for`** `y` **`in`** `[0...GRID_SIZE]` |\n\n\
    |   | `scoreMove grid, {x1: x, x2: x, y1: y, y2: y}` |\n\n|   | **`unless`** `usedWords.length\
    \ is 0` |\n\n|   | `console.log` *`\"\"\"`* |\n\n|   | *`Initially used words:`*\
    \ |\n\n|   | `#{usedWords.join(`*`', '`*`)}` |\n\n|   | *`\"\"\"`* |\n\n|   |\
    \ `console.log` *`\"Please choose a tile in the form (x, y).\"`* |\n\nFinally,\
    \ we plug in the input code from the last chapter, modifying our prompts to actually\
    \ work:\n\n| [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)\
    \ |\n\n|   | `promptForTile1 =` **`->`** |\n\n|   | `printGrid()` |\n\n|   | `console.log`\
    \ *`\"Please enter coordinates for the first tile.\"`* |\n\n|   | `inputCallback\
    \ = (input)` **`->`** |\n\n|   | **`try`** |\n\n|   | `{x, y} = strToCoordinates\
    \ input` |\n\n|   | **`catch`** `e` |\n\n|   | `console.log e` |\n\n|   | **`return`**\
    \ |\n\n|   | `promptForTile2 x, y` |\n\n| ![images/console5x5.png](images/console5x5.png)\
    \ |\n\n|  \n\n* * *\n\n**Figure 4\\. Playing with our command-line prompt** |\n\
    \n| [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)\
    \ |\n\n|   | `promptForTile2 = (x1, y1)` **`->`** |\n\n|   | `console.log` *`\"\
    Please enter coordinates for the second tile.\"`* |\n\n|   | `inputCallback =\
    \ (input)` **`->`** |\n\n|   | **`try`** |\n\n|   | `{x: x2, y: y2} = strToCoordinates\
    \ input` |\n\n|   | **`catch`** `e` |\n\n|   | `console.log e` |\n\n|   | **`return`**\
    \ |\n\n|   | **`if`** `x1 is x2 and y1 is y2` |\n\n|   | `console.log` *`\"The\
    \ second tile must be different from the first.\"`* |\n\n|   | **`else`** |\n\n\
    |   | `console.log` *`\"Swapping (`*`#{x1}`*`,`* `#{y1}`*`) with (`*`#{x2}`*`,`*\
    \ `#{y2}`*`)...\"`* |\n\n|   | `x1--; x2--; y1--; y2--;` *`# convert 1-based indices\
    \ to 0-based`* |\n\n|   | `[grid[x1][y1], grid[x2][y2]] = [grid[x2][y2], grid[x1][y1]]`\
    \ |\n\n|   | `{moveScore, newWords} = scoreMove grid, {x1, y1, x2, y2}` |\n\n\
    |   | **`unless`** `moveScore is 0` |\n\n|   | `console.log` *`\"\"\"`* |\n\n\
    |   | *`You formed the following word(s):`* |\n\n|   | `#{newWords.join(`*`',\
    \ '`*`)}` |\n\n|   |  |\n\n|   | *`\"\"\"`* |\n\n|   | `score += moveScore` |\n\
    \n|   | `moveCount++` |\n\n|   | `console.log` *`\"Your score after`* `#{moveCount}`\
    \ *`moves:`* `#{score}`*`\"`* |\n\n|   | `promptForTile1()` |\n\nThat’s it! Run\
    \ the game (`coffee game.coffee`), and you should see something like Figure 4,\
    \ [​*Playing with our command-line prompt*​](#f_0034.html_fig.console5x5).\n\n\
    Of course, this program is far from a masterpiece. On the front end, the interface\
    \ is a little…classical? And on the programmer side of things, the code is awfully\
    \ disorganized. We’ll be addressing the latter problem in the next chapter, and\
    \ then we’ll move on to use jQuery to turn our humble command-line game into a\
    \ much more sophisticated browser-based experience. Finally, we’ll use a Node\
    \ server-side app to add multiplayer support."
