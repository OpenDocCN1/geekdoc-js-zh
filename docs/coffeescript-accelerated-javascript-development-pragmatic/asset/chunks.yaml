    版权所有 © 2011，The Pragmatic Bookshelf。


    # 前言


    JavaScript 从来就不是为了成为世界上最重要的编程语言而设计的。它是在十天内拼凑出来的，融合了 Scheme 和 Self 的思想，并套上了类似 C
    的语法。甚至连它的名字都显得格格不入，除了几个关键字之外，与另一种语言几乎毫无共同之处。[[2]](#f_0010.html_FOOTNOTE-2) 但一旦
    JavaScript 发布，就再也无法控制它了。作为所有主流浏览器都能理解的唯一语言，JavaScript 迅速成为了 Web 的通用语言。随着 21 世纪初
    Ajax 的引入，这种最初只是用于增强网页的简单脚本语言，突然变成了一种成熟的富应用开发语言。


    随着 JavaScript 的崛起，不满之声从四面八方传来。一些人指出了它众多的小毛病和不一致性。[[3]](#f_0010.html_FOOTNOTE-3)
    另一些人则抱怨它缺乏类和继承。而新一代的开发者，他们是在 Ruby 和 Python 的熏陶下成长起来的，却被 JavaScript 那密密麻麻的花括号、圆括号和分号所困扰。


    少数勇敢的人创建了 Web 应用开发框架，这些框架能从其他语言生成 JavaScript 代码，其中最著名的是 Google 的 GWT 和 280 North
    的 Objective-J。但很少有程序员愿意在自己和浏览器之间添加一层厚厚的抽象。不，他们将继续前进，通过将自己限制在“精华部分”（正如 Douglas
    Crockford 在 2008 年同名书中所说）来应对 JavaScript 的缺陷。


    也就是说，直到现在。


    ## 新来的小家伙


    2009 年圣诞节，Jeremy Ashkenas 首次发布了 CoffeeScript，这是一种被他称为“JavaScript 不那么张扬的小兄弟”的小型语言。该项目迅速在
    GitHub 上吸引了数百名关注者，Ashkenas 和其他贡献者每月都会添加大量新功能。该语言的编译器最初是用 Ruby 编写的，但在 2010 年 3
    月被一个用 CoffeeScript 编写的编译器所取代。


    在 2010 年圣诞节发布 1.0 版本后，CoffeeScript 成为了 GitHub 上“最受关注”的项目之一。2011 年 4 月，当 David
    Heinemeier Hansson 确认了 CoffeeScript 支持将包含在 Ruby on Rails 3.1 中的传言时，该语言再次引起了广泛关注。


    为什么这种小语言能如此迅速地流行起来？我想到了三个原因：熟悉感、安全性和可读性。


    ### 精华部分依然存在


    JavaScript 博大精深。它包罗万象。JavaScript 提供了函数式语言的许多最佳特性，同时保留了命令式语言的感觉。这种微妙的力量是 JavaScript
    常常让新手感到困惑的原因之一：函数可以作为参数传递，也可以从其他函数返回；对象可以随时添加新方法；简而言之，函数是一等公民。


    所有这些力量在 CoffeeScript 中依然存在，同时还有鼓励你明智使用它的语法。


    ### 编译器来帮忙了


    想象一种没有语法错误的语言，一种计算机能原谅你的拼写错误并尽力理解你给出的代码的语言。那将是多么美好的世界！当然，程序并不总是按你预期的方式运行，但这就是测试的目的。


    现在想象一下，你编写了一次代码并将其发布到全世界，包括所有拼写错误，数百万台计算机以微妙不同的方式处理你的小错误。突然，你的计算机默默跳过的语句导致整个应用崩溃，影响了成千上万的用户。


    可悲的是，这就是我们生活的世界。JavaScript 没有标准的解释器。相反，数百种浏览器和服务器端框架以各自的方式运行 JavaScript。调试跨平台的不一致性是一件非常痛苦的事情。


    CoffeeScript 无法治愈所有这些弊病，但编译器会尽力生成符合 JavaScript Lint 规范的输出[[4]](#f_0010.html_FOOTNOTE-4)，这对于过滤常见的人为错误和非标准惯用法来说是一个很好的过滤器。而且，如果你输入了一些毫无意义的内容，比如
    `2 = 3`，CoffeeScript 编译器会告诉你。早发现总比晚发现好。


    ### 现在一切都清晰了


    编写 CoffeeScript 可能会让人上瘾。为什么？看看这段 JavaScript 代码：


    ```

    function cube(num) {

    return Math.pow(num, 3);

    }

    var list = [1, 2, 3, 4, 5];

    var cubedList = [];

    for (var i = 0; i < list.length; i++) {

    cubedList.push(cube(list[i]));

    }

    ```


    现在，这是等价的 CoffeeScript 代码片段：


    ```

    cube = (num) -> Math.pow num, 3

    list = [1, 2, 3, 4, 5]

    cubedList = (cube num for num in list)

    ```


    对于正在计数的各位来说，字符数减少了一半，行数减少了一半以上！这种收益在 CoffeeScript 中很常见。正如 Paul Graham 曾经说过的，“简洁就是力量。”[[5]](#f_0010.html_FOOTNOTE-5)


    更短的代码更容易阅读、更容易编写，而且也许最关键的是，更容易修改。庞大的代码堆往往步履蹒跚，因为任何重大修改都需要付出巨大的努力。而小块的代码只需几次快速的按键就能重写，从而鼓励更敏捷、更迭代的开发风格。


    值得补充的是，切换到 CoffeeScript 并不是一个全有或全无的命题——CoffeeScript 代码和 JavaScript 代码可以自由交互。CoffeeScript
    的字符串就是 JavaScript 的字符串，它的数字就是 JavaScript 的数字；甚至它的类也能在像 Backbone.js[[6]](#f_0010.html_FOOTNOTE-6)
    这样的 JavaScript 框架中工作。所以不要害怕从 CoffeeScript 代码中调用 JavaScript 代码，反之亦然。例如，我们将在第 5
    章 ​*使用 jQuery 实现 Web 交互*​ 中讨论如何将 CoffeeScript 与 JavaScript 最流行的库之一结合使用。


    在 CoffeeScript 中嵌入 JavaScript


    现在正好可以提一下，你可以通过将 JavaScript 代码用反引号括起来，将其嵌入到 CoffeeScript 代码中，如下所示：


    ```

    console.log `impatient ? useBackticks() : learnCoffeeScript()`

    ```


    CoffeeScript 编译器会忽略反引号之间的所有内容。这意味着，例如，如果你在反引号之间声明了一个变量，该变量将不遵守常规的 CoffeeScript
    作用域规则。


    在我编写 CoffeeScript 的所有时间里，我从未需要过使用反引号转义。它们充其量是碍眼的东西，最坏的情况下是危险的。所以，借用 Troy McClure
    的不朽名言：“既然你知道怎么做了——就别做。”


    但历史已经说得够多了。编码才是真理，其他一切都是元讨论，正如 Jeff Atwood 曾经说过的，“元讨论就是谋杀。”[[7]](#f_0010.html_FOOTNOTE-7)
    所以让我们先谈谈你现在正在读的这本书，然后——我保证，就在几页之后！——我们将开始编写一些热辣的代码。


    ## 本书适合谁


    如果你有兴趣学习 CoffeeScript，那你来对地方了！然而，由于 CoffeeScript 与 JavaScript 紧密相连，本书实际上涉及两种语言——而且没有足够的篇幅来同时教你两者。因此，我将假设你了解一些
    JavaScript。


    '
