    ## 3.4 Conditional Iteration


    If you’re finding `for...of` and `for...in` a little perplexing, don’t worry—there
    are simpler loops to be had. In fact, these loops are downright self-explanatory:


    |   | `makeHay()` **`while`** `sunShines()` |


    |   | `makeHay()` **`until`** `sunSets()` |


    As you’ve probably guessed, `until` is simply shorthand for `while not`, just
    as `unless` is shorthand for `if not`.


    Note that in both these syntaxes, `makeHay()` isn’t run at all if the condition
    isn’t initially met. There’s no equivalent of JavaScript’s `do...while` syntax,
    which runs the loop body at least once. We’ll define a utility function for this
    in the exercises for this chapter.


    In many languages, you’ll see `while true` loops, indicating that the block is
    to be repeated until it forces a `break` or `return`. CoffeeScript provides a
    shorthand for this, the simply-named `loop`:


    |   | **`loop`** |


    |   | `console.log` *`''Home''`* |


    |   | **`break`****`if`** `@flag is` **`true`** |


    |   | `console.log` *`''Sweet''`* |


    |   | `@flag =` **`true`** |


    Note that all loop syntaxes except `loop` allow both postfix and indented forms,
    just as `if`/`unless` does. `loop` is unique in that it’s prefixed rather than
    postfixed, like so:


    |   | `a = 0` |


    |   | **`loop`****`break`****`if`** `++a > 999` |


    |   | `console.log a` *`# 1000`* |


    Though `while`, `until` and `loop` aren’t as common as `for` syntax, their versatility
    should make them an invaluable addition to your repertoire.


