    # Chapter 3


    Collections and Iteration


    In the last chapter, we mastered functions. Now it’s time to start applying those
    functions to collections of data.


    We’ll start by looking at objects in a new light as all-purpose storage. Then
    we’ll learn about arrays, which give us a more ordered place to save our bits.
    From there, we’ll segue into loops, the lingua franca of iteration. We’ll also
    learn about building arrays directly from loops using comprehensions and about
    extracting parts of arrays using pattern matching. Finally, we’ll complete the
    command-line version of 5x5 that we started in the last chapter and recap what
    we’ve learned with a fresh batch of exercises.


    ## 3.1 Objects as Hashes


    Let’s start by reviewing what we know about objects in JavaScript and then check
    out the syntactic additions that CoffeeScript provides.


    ### Objects 101: A JavaScript Refresher


    Every programming language worth its bits has some data structure that lets you
    store arbitrary named values. Whether you call them hashes, maps, dictionaries,
    or associative arrays, the core functionality is the same: you provide a key and
    a value, and then you use the key to fetch the value.


    In JavaScript, every object is a hash. And just about everything is an object;
    the only exceptions are the primitives (booleans, numbers, and strings), and a
    few special constants like `undefined` and `NaN`.


    The simplest object can be written like this:


    ```

    obj = new Object()

    ```


    Or (more commonly) you can use JSON-style syntax:


    ```

    obj = {}

    ```


    In JSON, objects are denoted by `{}`, arrays by `[]`. Note that JSON is a subset
    of JavaScript and can usually be pasted directly into CoffeeScript code. (The
    exception is when the JSON contains indentation that might be misinterpreted by
    the CoffeeScript compiler.)


    But there are plenty of other ways of creating objects. In fact, we created a
    ton of them in the last chapter, because all functions are objects.


    There are two ways of accessing object properties: dot notation and bracket notation.
    Dot notation is simple: `obj.x` refers to the property of `obj` named `x`. Bracket
    notation is more versatile: any expression placed in the brackets is evaluated
    and converted to a string, and then that string is used as the property name.
    So `obj[’x’]` is always equivalent to `obj.x`, while `obj[x]` refers to the property
    whose name matches the (stringified) value of `x`.


    Usually you want to use dot notation if you know a property’s name in advance
    and bracket notation if you need to determine it dynamically. However, since property
    names can be arbitrary strings, you might sometimes need to use bracket notation
    with a literal key:


    ```

    symbols.+ = ''plus'' # illegal syntax

    ```


    ```

    symbols[''+''] = ''plus'' # perfectly valid

    ```


    We can create objects with several properties at once using JSON-style constructs,
    which separate keys from values using `:` like so:


    ```

    father = {

    name: ''John'',

    daughter: {

    name: ''Jill''

    },

    son: {

    name: ''Jack''

    }

    }

    ```


    Note that while curly braces have many uses in JavaScript, their only purpose
    in CoffeeScript is to declare objects.


    Quotes are optional around the keys as long as they obey standard variable naming
    rules; otherwise, single- or double-quotes can be used:


    ```

    symbols = {

    ''+'': ''plus''

    ''-'': ''minus''

    }

    ```


    Note that string interpolation is not supported in hash keys.


    ### Streamlined JSON


    CoffeeScript takes JSON and distills it to its essence. While full-blown JSON
    is perfectly valid, significant whitespace can be used in place of much of the
    “symbology”: commas are optional between properties that are separated by new
    lines, and, best of all, curly braces are optional when an object’s properties
    are indented. That means that the JSON above can be replaced with something more
    YAML-like:


    ```

    father =

    name: ''John''

    daughter:

    name: ''Jill''

    son:

    name: ''Jack''

    ```


    You can also use this streamlined notation inline:


    ```

    fellowship = wizard: ''Gandalf'', hobbits: [''Frodo'', ''Pippin'', ''Sam'']

    ```


    This code is equivalent to the following:


    ```

    fellowship = {wizard: ''Gandalf'', hobbits: [''Frodo'', ''Pippin'', ''Sam'']}

    ```


    The magic here is that every time the CoffeeScript compiler sees `:`, it knows
    that you’re building an object. This technique is especially handy when a function
    takes a hash of options as its last argument:


    ```

    drawSprite x, y, invert: true

    ```


    ### Same-Name Key-Value Pairs


    One handy trick that CoffeeScript offers is the ability to omit the value from
    a key-value pair when the value is a variable named by the key. For instance,
    the following two pieces of code are equivalent. Here’s the short way:


    ```

    delta = ''\u0394''

    ```


    ```

    greekUnicode = {delta}

    ```


    This is a little longer:


    ```

    delta = ''\u0394''

    ```


    ```

    greekUnicode = {delta: delta}

    ```


    (Note that this shorthand only works with explicit curly braces.) We’ll discover
    a common use for this trick in Section 3.6, [​*Pattern Matching (or, Destructuring
    Assignment)*​](#f_0033.html_sec.patternMatching).


    ### Soaks: ’a?.b’


    Before we move on to arrays, there’s one last CoffeeScript feature you should
    be aware of when accessing object properties: the existential chain operator,
    which has come to be known as the “soak.”


    Soaks are a special case of the existential operator we met in Section 2.5, [​*Default
    Arguments (arg =)*​](#f_0022.html_sec.defaultArguments). Recall that `a = b ?
    c` means “Set `a` to `b` if `b` exists; otherwise, set `a` to `c`.” But let’s
    say that we want to set `a` to a property of `b` if `b` exists. A naïve attempt
    might look like this:


    ```

    a = b.property ? c # bad!

    ```


    The problem? If `b` doesn’t exist when this code runs, we’ll get a `ReferenceError`.
    That’s because the code only checks that `b.property` exists, implicitly assuming
    that `b` itself does.


    The solution? Put a `?` before the property accessor:


    ```

    a = b?.property ? c # good

    ```


    Now if either `b` or `b.property` doesn’t exist, `a` will be set to `c`. You can
    chain as many soaks as you like, with both dots and square brackets, and even
    use the syntax to check whether a function exists before running it:


    ```

    cats?[''Garfield'']?.eat?() if lasagna?

    ```


    In one line, we just said that if there’s lasagna and if we have cats and if one
    is named Garfield and if Garfield has an `eat` function, then run that function!


    Pretty cool, right? But sometimes the universe is a little bit more orderly than
    that. And when I think of things that are ordered, a very special kind of object
    comes to mind.


    ## 3.2 Arrays


    While you could use any old object to store an ordered list of values, arrays
    (which inherit the properties of the `Array` prototype) offer you several nice
    features.[[29]](#f_0036.html_FOOTNOTE-29)


    Arrays can be defined using JSON-style syntax:


    ```

    mcFlys = [''George'', ''Lorraine'', ''Marty'']

    ```


    This is equivalent to the following:


    ```

    mcFlys = new Array()

    mcFlys[0] = ''George''

    mcFlys[1] = ''Lorraine''

    mcFlys[2] = ''Marty''

    ```


    Remember that all object keys are converted to strings, so `arr[1]`, `arr[’1’]`,
    and even `arr[{toString: -> ’1’}]` are synonymous. (When an object has a `toString`
    method, its return value is used when the object is converted to a string.)

