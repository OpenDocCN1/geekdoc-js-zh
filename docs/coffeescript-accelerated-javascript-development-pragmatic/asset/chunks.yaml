    In the Ruby world, the middleware of choice is Rack. The most mature Rack integration
    is the aptly named `rack-coffee`.[[58]](#f_0073.html_FOOTNOTE-58) It’s compatible
    with Rails, Sinatra, and all other major Ruby web frameworks (though Sinatra has
    actually had built-in CoffeeScript support since October 2010). More recently,
    the aforementioned Barista has been modified to run in any Rack-based framework,
    not just Rails.


    Meanwhile, over in the land of Python, CoffeeCup offers some first-class CoffeeScript
    support for Django, Pylons, CherryPy, and countless other WSGI-based frameworks.[[59]](#f_0073.html_FOOTNOTE-59)
    If having significant whitespace in both your front and back end is important,
    that’s a great option. Of course, another option would be to write your front
    and back end in the same language entirely.


    ## A2.5 CoffeeScript on Node.js


    Recall that `coffee` files can be run directly on Node.js using the `coffee` command.
    So on the back end, no compilation is needed. The real trick is serving compiled
    JavaScript for the front end.


    Fortunately, Connect (the standard core for Node.js web frameworks) comes with
    middleware that does this automatically. It just takes a little bit of configuration.
    You need to hook in Connect’s `compiler` and `static` middlewares, in that order,
    like so. (We used this technique in Chapter 6, [​*Server-Side Apps with Node.js*​](#f_0053.html_chp.nodejs).)


    ```

    compiler = connect.compiler src: coffeeDir, enable: [''coffeescript'']

    static = connect.static coffeeDir

    connect.createServer compiler, static

    ```


    In this example, `coffee` files in `coffeeDir` will automatically be compiled
    and served as `js` files.


    Some Node frameworks include preconfigured CoffeeScript-serving power. See, for
    instance, brunch and Zappa.


    While it seems like everyone and their dog is developing web apps with Rails or
    Django these days, there are still plenty of sites that just don’t need a back
    end at all. Wouldn’t it be nice to be able to leverage CoffeeScript—along with
    Haml and Sass, perhaps—to develop ordinary websites, all while generating standards-compliant
    HTML/CSS and minified JavaScript for deployment?


    ## A2.6 Rapid Websites with Middleman


    Luckily, there’s Thomas Reynolds’s Middleman.[[60]](#f_0073.html_FOOTNOTE-60)
    If you’ve already got Ruby and RubyGems installed, then getting up and running
    with Middleman is as easy as doing this:


    ```

    $ gem install middleman

    $ mm-init myProject

    $ cd myProject

    $ mm-server

    ```


    Now head to [http://localhost:4567](http://localhost:4567), where your site is
    up and running. Then modify the template files in the `view` directory and refresh
    your browser; repeat as needed until you’re ready to deploy.


    Middleman expects CoffeeScript files to be saved anywhere in the `view` folder
    with the extension `js.coffee`. For instance, if you put `awesome.js.coffee` in
    `view/scripts`, then the corresponding `<script>` tag would refer to `scripts/awesome.js`.
    No such file exists, mind you—it’s generated automatically by the server on every
    request. This means that when you change your CoffeeScript code and refresh the
    browser, the page will always be served with the latest and greatest JavaScript.


    When you’re ready to deploy, just run this:


    ```

    $ mm-build

    ```


    All the HTML/CSS/JavaScript you need will show up in the `build` folder. Upload
    that folder to a server, and your site is live!


    ## A2.7 CoffeeScript for System Scripts


    Before we finish this appendix, did you know that you can use CoffeeScript for
    the kinds of system tasks that you’d normally associate with Perl or Python? Just
    start your file with a “shebang” line that gives the path to `coffee` (sorry,
    Windows folks, this only works on Unix-y systems):


    ```

    #!/usr/bin/env coffee

    console.log ''Hello, world!''

    ```


    Ensure that the script is executable (`chmod +x helloscript.coffee`); then you
    can run it with either `sh helloscript.coffee` or `./helloscript.coffee`. (The
    familiar `coffee helloscript.coffee` will also still work.)


    Remember, this script will only run on systems where the CoffeeScript compiler
    is installed and on the `PATH`.


    That concludes our tour of the CoffeeScript build tool ecosystem, but no doubt
    many other awesome projects have sprung up since the time of this writing! Be
    sure to check out [http://github.com/jashkenas/coffee-script/wiki](http://github.com/jashkenas/coffee-script/wiki)
    for an up-to-date list, and follow @CoffeeScript on Twitter to keep tabs on new
    developments.


