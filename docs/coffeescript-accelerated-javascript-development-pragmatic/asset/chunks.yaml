    \ the database accordingly.\n3.  We read a template from the file system, customize\
    \ it appropriately, and send it to the user.\n\nThen, at the very least, our application\
    \ skeleton looks like this:\n\n```\nformRequestReceived = (req) ->\n  checkDatabaseForPermissions\
    \ req, ->\n    updateDatabase req, ->\n      renderTemplate req, (tmpl) ->\n \
    \       sendResponse tmpl\n```\n\nAnd that’s without error-handling at each step!\n\
    \nUnfortunately, that matryoshka doll feeling is never quite going to go away.\
    \ The fact is, in most languages you’d rely on threads so that you could just\
    \ write something like this:\n\n```\nformRequestReceived = (req) ->\n  if checkDatabaseForPermissions\
