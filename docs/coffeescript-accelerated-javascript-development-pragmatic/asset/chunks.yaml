    # Preface


    JavaScript was never meant to be the most important programming language in the
    world. It was hacked together in ten days, with ideas from Scheme and Self packed
    into a C-like syntax. Even its name was an awkward fit, referring to a language
    with little in common besides a few keywords.[[2]](#f_0010.html_FOOTNOTE-2) But
    once JavaScript was released, there was no controlling it. As the only language
    understood by all major browsers, JavaScript quickly became the lingua franca
    of the Web. And with the introduction of Ajax in the early 2000s, what began as
    a humble scripting language for enhancing web pages suddenly became a full-fledged
    rich application development language.


    As JavaScript’s star rose, discontent came from all corners. Some pointed to its
    numerous little quirks and inconsistencies.[[3]](#f_0010.html_FOOTNOTE-3) Others
    complained about its lack of classes and inheritance. And a new generation of
    coders, who had cut their teeth on Ruby and Python, were stymied by its thickets
    of curly braces, parentheses, and semicolons.


    A brave few created frameworks for web application development that generated
    JavaScript code from other languages, notably Google’s GWT and 280 North’s Objective-J.
    But few programmers wanted to add a thick layer of abstraction between themselves
    and the browser. No, they would press on, dealing with JavaScript’s flaws by limiting
    themselves to “the good parts” (as in Douglas Crockford’s 2008 similarly titled
    book).


    That is, until now.


    ## The New Kid in Town


    On Christmas Day 2009, Jeremy Ashkenas first released CoffeeScript, a little language
    he touted as “JavaScript’s less ostentatious kid brother.” The project quickly
    attracted hundreds of followers on GitHub as Ashkenas and other contributors added
    a bevy of new features each month. The language’s compiler, originally written
    in Ruby, was replaced in March 2010 by one written in CoffeeScript.


    After its 1.0 release on Christmas 2010, CoffeeScript became one of Github’s “most-watched”
    projects. And the language attracted another flurry of attention in April 2011,
    when David Heinemeier Hansson confirmed rumors that CoffeeScript support would
    be included in Ruby on Rails 3.1.


    Why did this little language catch on so quickly? Three reasons come to mind:
    familiarity, safety, and readability.


    ### The Good Parts Are Still There


    JavaScript is vast. It contains multitudes. JavaScript offers many of the best
    features of functional languages while retaining the feel of an imperative language.
    This subtle power is one of the reasons that JavaScript tends to confound newcomers:
    functions can be passed around as arguments and returned from other functions;
    objects can have new methods added at any time; in short, functions are first-class
    objects.


    All that power is still there in CoffeeScript, along with a syntax that encourages
    you to use it wisely.


    ### The Compiler Is Here to Help


    Imagine a language with no syntax errors, a language where the computer forgives
    you your typos and tries as best it can to comprehend the code you give it. What
    a wonderful world that would be! Sure, the program wouldn’t always run the way
    you expected, but that’s what testing is for.


    Now imagine that you write that code once and send it out to the world, typos
    and all, and millions of computers work around your small mistakes in subtly different
    ways. Suddenly statements that your computer silently skipped over are crashing
    your entire app for thousands of users.


    Sadly, that’s the world we live in. JavaScript doesn’t have a standard interpreter.
    Instead, hundreds of browsers and server-side frameworks run JavaScript in their
    own way. Debugging cross-platform inconsistencies is a huge pain.


    CoffeeScript can’t cure all of these ills, but the compiler tries its best to
    generate JavaScript Lint-compliant output[[4]](#f_0010.html_FOOTNOTE-4), which
    is a great filter for common human errors and nonstandard idioms. And if you type
    something that just doesn’t make any sense, such as `2 = 3`, the CoffeeScript
    compiler will tell you. Better to find out sooner than later.


    ### It’s All So Clear Now


    Writing CoffeeScript can be highly addictive. Why? Take this piece of JavaScript:


    ```

    function cube(num) {

    return Math.pow(num, 3);

    }

    var list = [1, 2, 3, 4, 5];

    var cubedList = [];

    for (var i = 0; i < list.length; i++) {

    cubedList.push(cube(list[i]));

    }

    ```


    Now here’s an equivalent snippet of CoffeeScript:


    ```

    cube = (num) -> Math.pow num, 3

    list = [1, 2, 3, 4, 5]

    cubedList = (cube num for num in list)

    ```


    For those of you keeping score, that’s half the character count and less than
    half the line count! Those kinds of gains are common in CoffeeScript. And as Paul
    Graham once put it, “Succinctness is power.”[[5]](#f_0010.html_FOOTNOTE-5)


    Shorter code is easier to read, easier to write, and, perhaps most critically,
    easier to change. Gigantic heaps of code tend to lumber along, as any significant
    modifications require a Herculean effort. But bite-sized pieces of code can be
    revamped in a few swift keystrokes, encouraging a more agile, iterative development
    style.


    It’s worth adding that switching to CoffeeScript isn’t an all-or-nothing proposition—CoffeeScript
    code and JavaScript code can interact freely. CoffeeScript’s strings are just
    JavaScript strings, and its numbers are just JavaScript numbers; even its classes
    work in JavaScript frameworks like Backbone.js.[[6]](#f_0010.html_FOOTNOTE-6)
    So don’t be afraid of calling JavaScript code from CoffeeScript code or vice versa.
    As an example, we’ll talk about using CoffeeScript with one of JavaScript’s most
    popular libraries in Chapter 5, [​*Web Interactivity with jQuery*​](#f_0045.html_chp.jquery).


    Embedding JavaScript in CoffeeScript


    This is as good a place as any to mention that you can stick JavaScript inside
    of CoffeeScript code by surrounding it with backticks, like so:


    ```

    console.log `impatient ? useBackticks() : learnCoffeeScript()`

    ```


    The CoffeeScript compiler simply ignores everything between the backticks. That
    means that if, for instance, you declare a variable between the backticks, that
    variable won’t obey conventional CoffeeScript scope rules.


    In all my time writing CoffeeScript, I’ve never once needed to use backtick escapes.
    They’re an eyesore at best and dangerous at worst. So in the immortal words of
    Troy McClure: “Now that you know how it’s done—don’t do it.”


    But enough ancient history. Coding is believing, everything else is just meta,
    and as Jeff Atwood once said,“Meta is murder.”[[7]](#f_0010.html_FOOTNOTE-7) So
    let’s talk a little bit about the book you’re reading now, and then—in just a
    few pages, I promise!—we’ll start banging out some hot code.


    ## Who This Book Is For


    If you’re interested in learning CoffeeScript, you’ve come to the right place!
    However, because CoffeeScript is so closely linked to JavaScript, there are really
    two languages running through this book—and not enough pages to teach you both.
    Therefore, I’m going to assume that you know some JavaScript.

