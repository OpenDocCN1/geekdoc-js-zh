  raw: 'But as the years passed, one library became so popular as to become the de
    facto standard: jQuery.[[35]](#f_0052.html_FOOTNOTE-35) Initially released by
    the then twenty-two-year-old John Resig in 2006, jQuery is now used by nearly
    one-third of the ten thousand most-visited websites,[[36]](#f_0052.html_FOOTNOTE-36)
    and Resig has become one of the world’s most famous programmers. Recent spin-offs,
    including jQuery Mobile, have brought jQuery’s familiar syntax far beyond the
    desktop-oriented web.[[37]](#f_0052.html_FOOTNOTE-37)Although other libraries
    are still widely used, jQuery truly stands apart.


    In this chapter, we’ll go through the basics of using jQuery to manipulate the
    elements of a web page and respond to events. (If you’re familiar with jQuery
    on JavaScript, this will just be a review with minor syntactic adjustments.) At
    the end of the chapter, we’ll use these newfound superpowers to turn our quaint
    little word game into a full-fledged browser-based app.


    ## 5.1 The Tao of jQuery


    Each JavaScript library has its own particular philosophy, and jQuery’s is a natural
    fit for JavaScript (and CoffeeScript, too!).


    jQuery doesn’t modify JavaScript’s built-in object prototypes, such as `String`
    and `Array`. That’s the fundamental difference between jQuery and Prototype, the
    second-most popular JavaScript library. Prototype can do some amazing things,
    but using it means potentially breaking any code that wasn’t written with Prototype
    in mind. For instance, a library might use `for x of arr` to iterate over an array’s
    indices, not realizing that this will also include the properties of `Array.prototype`
    added by Prototype.js. (It’s partly for this reason that `for...in` is preferred
    to `for...of` for array iteration. `for own...of` would also work in this case,
    because it skips properties that fail the `hasOwnProperty` test.)


    Instead, jQuery’s power is safely tucked away in one object, `jQuery`, which is
    normally aliased as `$`. We’ll use the `$` alias throughout this book, but be
    aware that it’s possible to disable it, in case another library wants to use that
    variable name.[[38]](#f_0052.html_FOOTNOTE-38)


    The jQuery object lets you do everything from animating transitions to adding
    event callbacks to pulling data from the server. And that’s without even drawing
    on the thousands of free plugins available.[[39]](#f_0052.html_FOOTNOTE-39) Of
    course, this chapter and the next are too brief to show you everything jQuery
    is capable of, but it should give you enough of an understanding to avoid common
    pitfalls while exploring jQuery’s vast capabilities, which are exquisitely documented
    at [http://api.jquery.com](http://api.jquery.com).


    ## 5.2 Manipulating the DOM


    If you’re familiar with raw JavaScript in a web context, you know that HTML tags
    like `<p>` define DOM elements, which JavaScript code can read, modify, and create
    from whole cloth.


    jQuery wraps these elements with its own objects, which provide more convenient
    functionality (and much more cross-browser consistency) than accessing the elements
    directly. To obtain a jQuery object, you usually use a selector, a string passed
    to the jQuery object. We’ll learn more about selectors in the next section, Section
    5.3, [​*Getting Selective*​](#f_0048.html_sec.jquerySelectors); for now, all you
    need to know is that they’re a superset of CSS. So to select a DOM element with
    the ID `pikachu` and store the result in a jQuery object `$pokemon` (it’s a common
    stylistic convention to prefix all jQuery object names with `$`), you would write
    this:


    |   | `$pokemon = $(`*`''#pikachu''`*`)` |


    Where’d Those DOM Elements Go?


    Every jQuery object you create is just an ordered list of DOM elements wrapped
    up with a neat feature-rich bow. To get those elements out, the official docs
    suggest that you use the `get`:


    |   | `pikachu = $(`*`''#pikachu''`*`).get(0)` |


    But a dirty little secret of jQuery objects is that they store their DOM elements
    by numerical index, allowing array-style access:


    |   | `pikachu = $(`*`''#pikachu''`*`)[0]` |


    You can even use array functions like `length` and `slice` (though not `push`
    or `concat`—instead, try `add`).


    Of course, unless you know what you’re doing, you should resist the urge to use
    DOM elements directly. If your Firefox-tested DOM code crashes in IE7, you have
    only yourself to blame.


    Once you’ve got a jQuery object, you have a massive arsenal of functions at your
    disposal. As a rule, these functions act on all of the matched elements. So if
    you have two paragraphs and you write the following, both paragraphs will be faded
    out:


    |   | `$(`*`''p''`*`).fadeOut()` |


    An exception to this rule is “getter” functions. These only act on the first matched
    element (with the notable exception of `text`, which combines the textual context
    of all matched elements into a single string). Consider this:


    |   | `sonnet = $(`*`''p''`*`).html()` |


    This code will only return the HTML content of the first paragraph in your document.
    By contrast, “setters” act on all matched elements. Often, these have the same
    name, like so:


    |   | `sonnet = $(`*`''p''`*`).html()` |


    |   | `$(`*`''p''`*`).html sonnet` |


    This will first read the HTML of the first paragraph, then set the HTML of all
    paragraphs to match. (The `text` getter would strip out HTML tags, as well as
    concatenating the content of all matched elements. Think carefully about whether
    `text` or `html` is more appropriate when extracting content.[[40]](#f_0052.html_FOOTNOTE-40))
    Of course, this can be condensed to a (somewhat baffling) one-liner:


    |   | `$(`*`''p''`*`).html $(`*`''p''`*`).html()` |


    The moral of this story is this: jQuery and CoffeeScript can be used to write
    elegant, readable code—or you can just make runnable ASCII art. With great power
    comes great responsibility.


    ## 5.3 Getting Selective


    When you pass a string to jQuery, it’s interpreted as a selector, and an object
    containing the matching elements is returned. The selector syntax is designed
    to mirror and extend CSS’s selector syntax. By itself, an HTML tag type (such
    as `’p’`) will match all elements of that type. An identifier preceded by `#`
    is a unique ID, and one preceded by `.` is a class name.


    You can list multiple selectors, separated by commas, to match all of them. For
    instance, `$(’a, button, .link’)` would match all `a` elements, all `button` elements,
    and all elements with the `link` class. The same set of elements could be obtained
    with `$(’a’).add($(’button’)).add($(’.link’))`.


    When multiple identifiers are joined by spaces, they match descendants. For instance,
    `$(’#header img’)` matches all `img` tags that are within the element with the
    unique ID `header`. The same selection could be done through chaining with the
    `find` method: `$(’#header’).find(’img’)`. If you only wanted images that are
    the immediate children of `header`, you could either use the CSS2 syntax `$(’#header
    > img’)` or the chain `$(’#header’).children(’img’)`.


    In addition to these CSS selectors, there are several special modifiers added
    by jQuery. For instance, to match only odd table rows, we could write `$(’tr:odd’)`.
    To match only list items that contain links, we could write `$(’li:has(a)’)`.
    Matching all checked checkboxes is as easy as writing `$(’:checked’)`.


    There are two important points to remember about selected elements in jQuery.
    First, the selection is performed only once—selectors are not “live” (except in
    the appropriately named `live` method and the functionally similar `delegate`,
    which run the given selector as needed every time an event is fired). Second,
    there’s no distinction in jQuery between a single element and a collection of
    elements; a single element is just a collection of size 1. So for instance, if
    the first `div` on your page has the id `header`, then `$(’#header’)`, `$(’div:first’)`,
    and `$(’div’).first()` are all equivalent.'
