    # Appendix 3


    Cheat Sheet for JavaScripters


    This cheat sheet summarizes most of the keywords and operators that CoffeeScript
    provides in terms of their JavaScript equivalents. In the tables below, Symbol
    refers to the preferred style in CoffeeScript, while Alias refers to a less-preferred
    alternative. Often, the alias is the same in JavaScript. For instance, `or` is
    recommended over `||` in CoffeeScript, but both are allowed.


    Occasionally, the JavaScript code given is slightly simplified and differs from
    the CoffeeScript in some edge cases; these are clarified in notes at the foot
    of each table.


    Symbols that are unchanged from JavaScript, such as the math and bitwise operators,
    are not mentioned here.


    ## A3.1 Boolean Operators


    | Symbol | Alias | JavaScript |

    | --- | --- | --- |

    | `not x` | `!x` | `!x` |

    | `x or y` | `x &#124;&#124; y` | `x &#124;&#124; y` |

    | `x or= y` | `x &#124;&#124;= y` | `x = x &#124;&#124; y` |

    | `x and y` | `x && y` | `x && y` |

    | `x and= y` | `x &&= y` | `x = x && y` |


    ## A3.2 The Existential Operator


    | Symbol | Alias | JavaScript |

    | --- | --- | --- |

    | `x?` |  | `typeof x != ’undefined’ && x !== null` |

    | `func?()` |  | `if (typeof func === ’function’) {func()}` |

    | `x?.y` | `x.y if x?` | `typeof x !== ’undefined’ && x !== null ? x.y : undefined`
    |

    | `x ?= y` | `x = y unless x?` | `if (typeof x === ’undefined’ &#124;&#124; x
    === null) {x=y}` |


    ## A3.3 Context and Prototype Accessors


    | Symbol | Alias | JavaScript |

    | --- | --- | --- |

    | `@` | `this` | `this` |

    | `@x` | `this.x` | `this.x` |

    | `@[’x’]` | `this[’x’]` | `this[’x’]` |

    | `obj::y` | `obj.prototype.y` | `obj.prototype.y` |

    | `obj::[’y’]` | `obj.prototype[’y’]` | `obj.prototype[’y’]` |


    ## A3.4 Function Definitions


    | Symbol | JavaScript |

    | --- | --- |

    | `func = (a) -> ...` | `func = function(a) {...}` |

    | `func = (a) => ...` | `func = bind(function(a) {...}, this)`* |


    *Where `bind` returns a wrapper that runs the function in the given context. See
    [​*How Does => Work?*​](#f_0020.html_sb.functionBinding).


    ## A3.5 Conditionals


    | Symbol | Alias | JavaScript |

    | --- | --- | --- |

    | `y if x` | `if x then y`* | `if (x) {y}` |

