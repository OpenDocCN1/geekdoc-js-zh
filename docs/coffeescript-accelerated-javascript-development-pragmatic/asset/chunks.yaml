    when it comes to extracting substrings and subarrays using ranges! But ranges
    have another, even more fantastical use in the `for...in` syntax, as we’ll see
    in the next section.


    ## 3.3 Iterating over Collections


    There are two built-in syntaxes for iterating over collections in CoffeeScript:
    one for objects and another for arrays (and other enumerable objects, but usually
    arrays). The two look similar, but they behave very differently:


    To iterate over an object’s properties, use this syntax:


    |   | **`for`** `key, value` **`of`** `object` |


    |   | *`# do things with key and value`* |


    ''hasOwnProperty'' and ''for own''


    JavaScript makes a distinction between properties “owned” by an object and properties
    inherited from its prototype. You can check whether a particular property is an
    object’s own by using `object.hasOwnProperty(key)`.


    Because it’s common to want to loop through an object’s own properties, not those
    it shares with all its siblings, CoffeeScript lets you write `for own` to automatically
    perform this check and skip the properties that fail it. Here’s an example:


    |   | **`for`** `own sword` **`of`** `Kahless` |


    |   | `...` |


    This is shorthand for the following:


    |   | **`for`** `sword` **`of`** `Kahless` |


    |   | **`continue`****`unless`** `Kahless.hasOwnProperty(sword)` |


    |   | `...` |


    Whenever a `for...of` loop is giving you properties you didn’t expect, try using
    `for own...of` instead.


    This loop will go through all the keys of the object and assign them to the first
    variable named after the `for`. The second variable, named `value` above, is optional;
    as you might expect, it’s set to the value corresponding to the key. So, `value
    = object[key]`.


    For an array, the syntax is a little different:


