  trans: '

    啊，但确实有：Node.js！人们通常认为 Node 只是一个 JavaScript 网络服务器（更多内容见第 6 章 *用 Node.js 构建服务端应用*），但它的功能远不止于此。从根本上说，它是
    JavaScript 代码与操作系统之间的桥梁。Node 还有一个出色的工具叫 npm，即 Node 包管理器。[[15]](#f_0016.html_FOOTNOTE-15)
    如果你有 Ruby 背景，可以把它看作 RubyGems 在 Node 中的对应物。它已成为安装和管理 Node 应用及库的事实标准。


    本节剩余部分将介绍如何安装 Node 和 npm，因为我们需要它们来使用 CoffeeScript 的标准 `coffee` 编译器。（本书最后一章也需要
    Node 和 npm。）但如果你急于上手，可以直接访问 [`coffeescript.org/`](http://coffeescript.org/)，点击“Try
    CoffeeScript”按钮，然后跳到下一章。（你需要在浏览器中安装能显示 `console` 输出的工具，例如 Firebug Lite。[[16]](#f_0016.html_FOOTNOTE-16)）


    准备好了吗？我们开始吧。


    ### 在 Node.js 和 npm 环境下使用 CoffeeScript


    虽然有很多方法可以在没有 Node 的情况下运行 CoffeeScript（附录 B *运行 CoffeeScript 的方式* 中介绍了几种），但本书假设你使用的是标准的
    `coffee` 命令，该命令设计为在 Node 下运行。只有最后一章（第 6 章 *用 Node.js 构建服务端应用*）明确需要 Node 和 npm。


    注意——如果你使用的是 Windows，在继续之前需要先安装 Cygwin。[[17]](#f_0016.html_FOOTNOTE-17) Cygwin
    基本上充当了 Linux 模拟器。虽然 Node.js 的 0.6 版本路线图中包含了对 Windows 的一流支持，但在撰写本文时，使用 Cygwin 是最可靠的方法。


    如果你使用的是 Mac，则需要安装 Xcode，[[18]](#f_0016.html_FOOTNOTE-18) 不是为了 Xcode 本身，而是为了它附带的命令行开发者工具。你可以尝试运行
    `gcc`（GNU 编译器集合）来检查这些工具是否已存在于系统中：


    ```

    $ gcc

    i686-apple-darwin10-gcc-4.2.1: no input files

    ```


    如果输出类似上述内容，说明已就绪。如果没有，请获取 Xcode（如果你用的是 Mac），或者直接安装标准构建工具（如果你用的是 Linux 或 Cygwin）。


    现在大家都使用带有标准构建工具的 Linux/Unix/Mac 系统了吗？太好了！接下来请访问 [`gist.github.com/579814`](http://gist.github.com/579814)。在那里你会看到由
    npm 创建者 Isaac Schlueter 整理的一系列令人眼花缭乱的安装选项。对于所有 Mac 用户，我推荐使用 Homebrew 方法（先安装 Homebrew）。[[19]](#f_0016.html_FOOTNOTE-19)
    对于其他用户，列表中的第一种方法——直接安装——可能是最好的。Node 是一个大型包，因此安装可能需要几分钟。


    一旦 Node 安装到你的系统上，运行 npm 的最新远程安装脚本：


    ```

    $ curl http://npmjs.org/install.sh | sh

    ```


    如果遇到权限错误，要么 `chown` 修改 Node 安装目录的所有权（这样可以避免以后出现麻烦），要么使用 `sudo sh` 代替普通的 `sh`。


    无论你如何安装，请检查 `node` 和 `npm` 是否在你的 `PATH` 路径中：


    ```

    $ node -v

    v0.4.8

    $ npm -v

    1.0.13

    ```


    （关于版本说明：Node 的 API 在偶数次点版本中是稳定的。因此，本书中的示例在最新的 0.4.x 版本下应该能正常运行。而 Node 0.5.x 将包含
    API 更改，这些更改将被整合到稳定的 0.6.x 版本中。至于 npm，本书假设你使用的是 npm 1.x。因此，如果你仍在使用 npm 0.x，现在正是升级的好时机。）


    现在获取最新的 CoffeeScript 版本：


    ```

    $ npm install -g coffee-script

    /usr/local/bin/cake -> /usr/local/lib/node_modules/coffee-script/bin/cake

    /usr/local/bin/coffee -> /usr/local/lib/node_modules/coffee-script/bin/coffee

    ```


    `-g` 标志是 `--global` 的缩写，它使安装的库在系统范围内可用。（默认情况下，`npm install [package]` 会将指定包放在本地的
    `node_modules` 子目录中，这在安装仅用于特定项目的包时很方便。）我建议在安装包含二进制文件的包时始终使用 `-g`。


    `npm install` 的输出告诉我们，该包安装了两个二进制文件：`cake` 和 `coffee`。让我们检查一下 `coffee` 是否在系统的 `PATH`
    中：


    ```

    $ coffee -v

    CoffeeScript version 1.1.1

    ```


    如果上述命令没有生效，请查看 `npm install` 输出中 `->` 之前的目录（例如 `/usr/local/bin`），并将该目录添加到你的 `PATH`
    中。在 Mac 上使用默认的 `bash` shell 时，可以通过将以下行添加到 `~/.profile` 文件中来实现：


    ```

    export PATH=/usr/local/bin:$PATH

    ```


    务必包含 `:$PATH` 部分——否则 `/usr/local/bin` 会替换你的 `PATH`，而不是添加到其中！要使该行生效，你需要保存文件并启动一个新的
    shell 会话（例如，打开一个新的终端窗口并关闭旧的窗口）。


    如果你使用的是不同的操作系统或 shell，这些步骤可能略有不同；输入 `echo $SHELL` 来查看你正在使用的 shell。别忘了，修改文件后必须重启
    shell 会话才能生效。


    最后一步：就像我们的二进制文件必须位于 `PATH` 中才能从任何地方使用它们一样，npm 安装的 Node 库也必须位于 `NODE_PATH` 中。要查看
    Node 将库安装在哪里，请键入以下命令：


    ```

    $ npm ls -g

    /usr/local/lib

    ```


    （此命令还会列出 npm 全局安装的所有包。如果省略 `-g`，你将看到当前目录下安装的所有包。）我们需要将该路径下的 `node_modules` 子目录添加到
    `NODE_PATH` 中。在我的系统上，这意味着将以下内容添加到 `~/.profile` 中：


    ```

    export NODE_PATH=/usr/local/lib/node_modules

    ```


    同样，你在系统上需要执行的步骤可能有所不同。要测试 `NODE_PATH` 是否正常工作，请启动一个新的 shell 会话并输入 `node` 命令。这将进入
    Node.js REPL，一个可以交互式运行命令的环境。现在输入以下内容：


    ```

    > require(''coffee-script'')

    ```


    我保证，这是你在本书中唯一需要输入的 JavaScript 代码！


    如果 `NODE_PATH` 设置不正确，你会看到 `Error: Cannot find module ’coffee-script’`。如果你看到的是一个长对象描述，那就说明一切正常。完成
    Node REPL 后，输入 `process.exit()`，或者直接按 `Ctrl`-`c`。


    顺便提一下，`coffee-script` 库超出了本书的讨论范围；只需知道它允许你在 CoffeeScript 或 JavaScript 程序中将 CoffeeScript
    编译为 JavaScript 即可。你可以用它做一些很酷的事情，比如编写带有自定义后处理的编译器，[[20]](#f_0016.html_FOOTNOTE-20)
    或者编写自己的构建脚本作为 Cakefile。[[21]](#f_0016.html_FOOTNOTE-21)


    #### 保持最新版本


    如果你绝对需要最新的 CoffeeScript，其实非常简单。只需使用 `git` 克隆 CoffeeScript 仓库，然后让 `npm` 从本地目录安装即可：


    ```

    $ git clone http://github.com/jashkenas/coffee-script.git

    $ cd coffee-script

    $ npm install -g

    ```


    这将安装当前的 `master` 分支，该分支可能稳定也可能不稳定。你可以通过运行以下命令回退到 CoffeeScript 的特定版本（例如 1.1.1）：


    ```

    $ npm install -g coffee-script@1.1.1

    ```


    呼！我知道安装过程可能感觉有些繁琐，但请相信我，既然我们现在拥有了 Node 和 npm 的全部功能，这些努力是值得的。接下来，让我们设置你的编辑环境。

    '
- fmt: "\n## 1.2 Text Editors for CoffeeScript\n\nAn up-to-date list of text editors\
    \ with CoffeeScript support can be found at [http://github.com/jashkenas/coffee-script/wiki/Text-editor-plugins](http://github.com/jashkenas/coffee-script/wiki/Text-editor-plugins).\
    \ If you’re on a Mac, I recommend the TextMate plugin maintained by Jeremy Ashkenas\
    \ himself.[[22]](#f_0016.html_FOOTNOTE-22) As of this writing, there are also\
    \ plugins for Vim, Emacs, gedit, jEdit, and IntelliJ IDEA.\n\nRecently, it’s become\
    \ viable to code with a web-based text editor, enabling real-time collaboration\
    \ and freeing you from any particular device. Currently, the web-based editor\
    \ with the best support for CoffeeScript is Cloud9, with the Cloud9 Live CoffeeScript\
    \ Extension.[[23]](#f_0016.html_FOOTNOTE-23)\n\nOf course, you can use any editor\
    \ you like, but using an editor with CoffeeScript support gives you three big\
    \ advantages: syntax highlighting, smart indentation, and built-in compilation\
    \ shortcuts. The first two are easy to appreciate, but the last is something many\
    \ coders fail to take advantage of.\n\n![images/TextMate_run.png](images/TextMate_run.png)\n\
    \n**Figure 2. Running selected code directly from TextMate**\n\nIn TextMate, I\
    \ can use ⌘R (“Run”) to run a CoffeeScript file, or ⌘B (“Build”) just to look\
    \ at the compiled JavaScript. Compilation takes mere milliseconds, so if I’m not\
    \ sure how a CoffeeScript expression translates into JavaScript, a quick build\
    \ is the fastest way to find out. If text is selected, these commands run on the\
    \ selection instead of on the whole file, which makes it a lot easier to test\
    \ pieces of code and nail down syntax errors.\n\nOne quick caution—some editors\
    \ (including TextMate) don’t pick up `PATH` by default, which means you get an\
    \ error like `command not found` when it tries to run `coffee`. If you run into\
    \ this problem, go into your editor’s preferences (perhaps under Shell Variables)\
    \ and set `PATH` to match the output you get when you run `echo $PATH` in your\
    \ shell. You might want to set `NODE_PATH` while you’re at it.\n\n## 1.3 Meet\
    \ ’coffee’\n\nNow that you’ve got your editor set up, it’s time to introduce `coffee`,\
    \ the standard command line compiler. Let’s start with the obligatory “Hello,\
    \ world!” program. Open up your editor and create a new file called `hello.coffee`\
    \ with the following contents:\n\n```\nconsole.log 'Hello, world!'\n```\n\nNow\
    \ you just need to run it:\n\n```\n$ coffee hello.coffee\n```\n\n```\nHello, world!\n\
    ```\n\nYou might be wondering several things: First, where did that `console.log`\
    \ function come from? (Answer: It’s a Node.js global.) Second, where’s the JavaScript?\
    \ Isn’t the point of CoffeeScript that it compiles to JavaScript?\n\nWhat’s happening\
    \ here is that `coffee` is compiling `hello.coffee` to JavaScript internally,\
    \ then piping that output straight to Node for immediate execution. If that’s\
    \ not what you want to do, you’ll have to use one or more of `coffee`’s many options.\
    \ To see them, use `coffee -h`:\n\n```\n$ coffee -h\n\nUsage: coffee [options]\
    \ path/to/script.coffee\n\n-c, --compile compile to JavaScript and save as .js\
    \ files\n-i, --interactive run an interactive CoffeeScript REPL\n-o, --output\
    \ set the directory for compiled JavaScript\n-j, --join concatenate the scripts\
    \ before compiling\n-w, --watch watch scripts for changes, and recompile\n-p,\
    \ --print print the compiled JavaScript to stdout\n-l, --lint pipe the compiled\
    \ JavaScript through JSLint\n-s, --stdio listen for and compile scripts over stdio\n\
    -e, --eval compile a string from the command line\n-r, --require require a library\
    \ before executing your script\n-b, --bare compile without the top-level function\
    \ wrapper\n-t, --tokens print the tokens that the lexer produces\n-n, --nodes\
    \ print the parse tree that Jison produces\n--nodejs pass options through to the\
    \ \"node\" binary\n-v, --version display CoffeeScript version\n-h, --help display\
    \ this help message\n```\n\nSo if you wanted to see the JavaScript that the compiler\
    \ hid from you just now, you’d run this:\n\n```\n$ coffee -p hello.coffee\n(function()\
    \ {\n  console.log('Hello, world!');\n}).call(this);\n```\n\nSee [*JavaScript,\
    \ Under Wraps*](#f_0014.html_sb.wrapper) for an explanation of those extra two\
    \ lines.\n\n### JavaScript, Under Wraps\n\nYou’re probably wondering why CoffeeScript\
    \ output comes wrapped in a function. The reason is, in a word, namespacing. If\
    \ you load a bunch of JavaScript files into a browser application, they’re treated\
    \ like one big block of code. That can easily lead to unintended consequences:\n\
    \n```\n// First file\nfunction declareNuclearWar() {\n  alert('Relax. This is\
    \ only a test');\n}\nwindow.onload = function() {\n  declareNuclearWar();\n}\n\
    \n// Second file\nfunction declareNuclearWar() {\n  alert('The bombing begins\
    \ in 5 minutes.');\n}\n```\n\nWhoever wrote the first file had no idea the havoc\
    \ that code was going to unleash! Calamity could have been averted by wrapping\
    \ each file in an anonymous function, thus isolating the two `declareNuclearWar`\
    \ declarations. (See Section 2.2, [*Scope: Where You See ’Em*](#f_0019.html_sec.scope).)\
    \ This is called the module pattern.\n\nTo get modules to talk to each other,\
    \ you’ve got to “export” some variables. (There’s more on that in Section 4.1,\
    \ [*Modules: Splitting Up Apps*](#f_0038.html_sec.modules).)\n\nOh—and if you\
    \ must get rid of the wrapping, run `coffee` with the `-b` (“bare”) flag.\n\n\
    ### Compiling to JavaScript\n\nProbably the most common flag is `-c` (“compile”),\
    \ which saves the JavaScript output to a file. The file is named the same as the\
    \ original, except with a `js` extension instead of `coffee`. Let’s stick with\
    \ the caffeinated beverage theme:\n\n```\n$ coffee -c mochaccino.coffee\n```\n\
    \nThis compiles to a file named `mochaccino.js` in the same directory. You can\
    \ put the output somewhere else with the `-o` (“output”) flag, followed by the\
    \ name of the target directory:\n\n```\n$ coffee -co output source\n```\n\nThis\
    \ example reads every `coffee` file in `source` (and its subdirectories) and writes\
    \ the corresponding `js` files in `output`. Note that `-co` is simply shorthand\
    \ for `-c -o`. The order matters: `-o` needs to immediately precede the output\
    \ directory name.\n\nAnother popular flag is `-w` (“watch”), which tells `coffee`\
    \ to keep running in the background; in conjunction with `-c`, it’ll recompile\
    \ your code every time you make changes. It even works on directories and preserves\
    \ nested file structures. So if I run the following, everything in the `coffee`\
    \ directory will be continuously recompiled to the `js` directory:\n\n```\n$ coffee\
    \ -cwo js coffee\n```\n\nThis will continue until I kill the compiler with `Ctrl`-`c`.\n\
    \n### The REPL\n\nIf you just run `coffee` with no arguments, you’ll enter what\
    \ overly sophisticated programmers call the REPL, or the Read-Eval-Print Loop.\
    \ In layman’s terms, this means you type something, it runs, you see the output,\
    \ repeat.\n\nThis is great for playing around with the language. The REPL runs\
    \ in a Node.js environment and prints the result of each expression. For instance,\
    \ if we want to remind ourselves of some of the quirks of JavaScript’s `parseInt`\
    \ function, we can try this:\n\n```\n$ coffee\ncoffee> parseInt '221'\n221\ncoffee>\
    \ parseInt '221b'\n221\ncoffee> parseInt 'b221'\nNaN\n```\n"
