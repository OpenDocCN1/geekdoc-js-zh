    and `each`.


    ### Ranges


    Fire up the REPL, because the best way to get acquainted with CoffeeScript range
    syntax—and its close friends, the slice and splice syntaxes, introduced in the
    next section—is `(’practice’ for i in [1..3]).join(’, ’)`.


    CoffeeScript adds a Ruby-esque syntax for defining arrays of consecutive integers:


    |   | `coffee>` **`[1..5]`** |


    |   | `[1, 2, 3, 4, 5]` |


    The `..` defines an inclusive range. But often, we want to omit the last value;
    in those cases, we add an extra `.` to create an exclusive range:


    |   | `coffee>` **`[1...5]`** |


    |   | `[1, 2, 3, 4]` |


    (As a mnemonic, picture the extra `.` replacing the end value.) Ranges can also
    go backward:


    |   | `coffee>` **`[5..1]`** |


    |   | `[5, 4, 3, 2, 1]` |


    No matter which direction the range goes in, an exclusive range omits the end
    value:


    |   | `coffee>` **`[5...1]`** |


    |   | `[5, 4, 3, 2]` |


    This syntax is rarely used on its own, but as we’ll soon see, it’s essential to
    CoffeeScript’s `for` loops.


    ### Slicing and Splicing


    When you want to tear a chunk out of a JavaScript array, you turn to the violent-sounding
    `slice` method:


    |   | `coffee>` **`[''a'', ''b'', ''c'', ''d''].slice 0, 3`** |


    |   | `[''a'', ''b'', ''c'']` |


    The two numbers given to `slice` are indices; everything from the first index
    up to but not including the second index is copied to the result. You might look
    at that and say, “That sounds kind of like an exclusive range.” And you’d be right:


    |   | `coffee>` **`[''a'', ''b'', ''c'', ''d''][0...3]`** |


    |   | `[''a'', ''b'', ''c'']` |


    And you can use an inclusive range, too:


    |   | `coffee>` **`[''a'', ''b'', ''c'', ''d''][0..3]`** |


    |   | `[''a'', ''b'', ''c'', ''d'']` |


    The rules here are slightly different than they were for standalone ranges, though,
    due to the nature of `slice`. Notably, if the first index comes after the second,
    the result is an empty array rather than a reversal:


    |   | `coffee>` **`[''a'', ''b'', ''c'', ''d''][3...0]`** |


    |   | `[]` |


    Also, negative indices count backward from the end of the array. While `arr[-1]`
    merely looks for a property named `’-1’`, `arr[0...-1]` means “Give me a slice
    from the start of the array up to, but not including, its last element.” In other
    words, when slicing `arr`, `-1` means the same thing as `arr.length - 1`.


    If you omit the second index, then the slice goes all the way to the end, whether
    you use two dots or three:


    |   | `coffee>` **`[''this'', ''that'', ''the other''][1..]`** |


    |   | `[''that'', ''the other'']` |


    |   | `coffee>` **`[''this'', ''that'', ''the other''][1...]`** |


    |   | `[''that'', ''the other'']` |


    Slicing Strings


    Curiously, JavaScript provides strings with a `slice` method, even though its
    behavior is identical to `substring`. This is handy, because it means you can
    use CoffeeScript’s slicing syntax to get substrings:


    |   | `coffee>` **`''The year is 3022''[-4..]`** |


    |   | `3022` |


    However, don’t get too carried away—while slicing works fine on strings, splicing
    doesn’t. Once a JavaScript string is defined, it can never be altered.


    CoffeeScript also provides a shorthand for `splice`, the value-inserting cousin
    of `slice`. It looks like you’re making an assignment to the slice:


    |   | `coffee>` **`arr = [''a'', ''c'']`** |


    |   | `coffee>` **`arr[1...2] = [''b'']`** |


    |   | `coffee>` **`arr`** |


    |   | `[''a'', ''b'']` |


    The range defines the part of the array to be replaced. If the range is empty,
    a pure insertion occurs at the first index:


    |   | `coffee>` **`arr = [''a'', ''c'']`** |


    |   | `coffee>` **`arr[1...1] = [''b'']`** |


    |   | `coffee>` **`arr`** |


    |   | `[''a'', ''b'', ''c'']` |


    One important caveat: While negative indices work great for slicing, they fail
    completely when splicing. The trick of omitting the last index works fine, though:


    |   | `coffee>` **`steveAustin = [''regular'', ''guy'']`** |


    |   | `coffee>` **`replacementParts = [''better'', ''stronger'', ''faster'']`**
    |


    |   | `coffee>` **`steveAustin[0..] = replacementParts`** |


    |   | `coffee>` **`steveAustin`** |


    |   | `[''better'', ''stronger'', ''faster'']` |


