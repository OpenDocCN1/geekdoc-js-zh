    \n## A1.1 Functions, Scope, and Context\n\nAnswers to Section 2.9, [*Exercises*](#f_0026.html_sec.functionsExercises):\n\
    \n1.  Functions in CoffeeScript return the value of their last expression—in this\
    \ case, the return value of the `splice` method. To change the return value, just\
    \ add a new line, like so:\n\n    ```coffeescript\n    clearArray = (arr) ->\n\
    \      arr.splice 0, arr.length\n      arr\n    ```\n\n    This returns the now-empty\
    \ `arr`. To have the function return nothing, use this:\n\n    ```coffeescript\n\
    \    clearArray = (arr) ->\n      arr.splice 0, arr.length\n      return\n   \
    \ ```\n\n2.  You can write this one of two ways, either of which will do just\
    \ fine. Here’s the first:\n\n    ```coffeescript\n    run = (func, args...) ->\
    \ func.apply this, args\n    ```\n\n    Here’s the second:\n\n    ```coffeescript\n\
    \    run = (func, args...) -> func.call this, args...\n    ```\n\n    Note that\
    \ the use of `this` allows a context to be passed in by calling `run` in the desired\
    \ context.\n\n3.  The postfix operators (`if`/`unless` and `for`/`while`/`until`)\
    \ are the only major exceptions to the rule that implicit parentheses go to the\
    \ end of the line. For example, all of the following lines are equivalent:\n\n\
    \    ```coffeescript\n    return abortMission warning if warning?\n    return\
    \ abortMission(warning) if warning?\n    if warning? then return abortMission\
    \ warning\n    if warning? then return abortMission(warning)\n    ```\n\n    Adding\
    \ explicit parentheses that go to the end of the line would change the meaning\
    \ considerably:\n\n    ```coffeescript\n    return abortMission(warning if warning?)\n\
    \    ```\n\n    Now we `return` and call `abortMission` no matter what! The expression\
    \ `warning if warning?` is evaluated, but to little effect (it converts `null`\
    \ to `undefined` but leaves all other values of `warning` untouched).\n\n4.  CoffeeScript\
    \ doesn’t allow space between a function and its explicit parentheses because\
    \ this would allow parentheses around an expression to radically change its meaning.\
    \ Here are some examples:\n\n    ```coffeescript\n    f g h\n    ```\n\n    This\
    \ expression really means the following:\n\n    ```coffeescript\n    f(g(h))\n\
    \    ```\n\n    Compare that meaning with this expression:\n\n    ```coffeescript\n\
    \    f (g) h\n    ```\n\n    Here the parentheses really mean this:\n\n    ```coffeescript\n\
    \    f(g)(h)\n    ```\n\n    CoffeeScript’s rule is that if there’s whitespace\
    \ after any identifier (and something other than a postfix operator after the\
    \ whitespace), then that identifier is a function with implicit parentheses.\n\
    \n5.  `foo.bar.baz()` runs in the `foo.bar` context. `@hoo` runs in `this` (also\
    \ known as `@`). `@hoo.rah()` runs in `@hoo`.\n\n6.  `what.x` and `@x` are, of\
    \ course, equivalent if and only if `what` is `this`. Again, it’s perfectly possible\
    \ for `what.x` and `@x` to refer to the same object, but `what.x = y` will not\
    \ overwrite `@x` unless `what` is `this`.\n"
