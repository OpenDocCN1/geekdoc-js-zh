    In order to do this without a stylesheet, we’d have to call `$elem.css ’color’,
    ’#333’` every single time we created a new element with text. Ugh.


    To save us that trouble, let’s decide now how we’re going to lay out our page.
    We’ll represent our 5x5 grid of tiles as 5 `ul` rows, each with 5 `li`s, within
    the `#grid` div. We want `#grid` to be centered and have a large, monospaced font:


    | [jQuery/5x5/style.css](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/style.css)
    |


    |   | `#grid {` |


    |   | `position: relative;` |


    |   | `text-align: center;` |


    |   | `width: 480px;` |


    |   | `margin: 16px auto;` |


    |   | `padding: 32px 0;` |


    |   | `border: 2px solid #555;` |


    |   | `font-size: 64px;` |


    |   | `font-family: Monaco,` *`"DejaVu Sans Mono"`*`,` *`"Lucida Console"`*`,
    monospace;` |


    |   | `}` |


    To display each row horizontally, we set the `ul` elements to have `list-style:
    none` and the `li` elements to have `display: inline`. We also set `cursor: pointer`,
    so that the mouse cursor reacts to the tiles as if they were links, and provide
    a `hover` style, so that the tile being hovered over changes color. Oh, and tiles
    also change color if they have the `selected` class.


    Other CSS elements that we’ll need include a `#message` to prompt the next move,
    a `.notice` div to display the result of each move, and a `#scores` table:


    | [jQuery/5x5/style.css](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/style.css)
    |


    |   | `#message {` |


    |   | `position: relative;` |


    |   | `text-align: center;` |


    |   | `margin: 32px;` |


    |   | `font-size: 24px;` |


    |   | `}` |


    | [jQuery/5x5/style.css](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/style.css)
    |


    |   | `.notice {` |


    |   | `position: relative;` |


    |   | `text-align: center;` |


    |   | `width: 486px;` |


    |   | `margin: 0 auto;` |


    |   | `padding: 16px 0;` |


    |   | `background: #eb4;` |


    |   | `font-size: 18px;` |


    |   | `}` |


    | [jQuery/5x5/style.css](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/style.css)
    |


    |   | `#scores {` |


    |   | `position: relative;` |


    |   | `text-align: center;` |


    |   | `width: 484px;` |


    |   | `margin: 16px auto;` |


    |   | `border: 1px solid #555;` |


    |   | `font-size: 24px;` |


    |   | `}` |


    ### jq5x5.coffee


    Now for the meat of the project! We’ll start by defining some variables that we
    want to have module-level scope:


    | [jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)
    |


    |   | `grid = dictionary = currPlayer = player1 = player2 = selectedCoordinates
    =` **`null`** |


    Most of those variables will be given real values in our new `newGame` function:


    | [jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)
    |


    |   | `newGame =` **`->`** |


    |   | `grid =` **`new`** `Grid` |


    |   | `dictionary =` **`new`** `Dictionary(OWL2, grid)` |


    |   | `currPlayer = player1 =` **`new`** `Player(`*`''Player 1''`*`, dictionary)`
    |


    |   | `player2 =` **`new`** `Player(`*`''Player 2''`*`, dictionary)` |


    |   | `drawTiles()` |


    |   |  |


    |   | `player1.num = 1` |


    |   | `player2.num = 2` |


    |   | **`for`** `player` **`in`** `[player1, player2]` |


    |   | `$(`*`"#p`*`#{player.num}`*`name"`*`).html player.name` |


    |   | `$(`*`"#p`*`#{player.num}`*`score"`*`).html 0` |


    |   | `showMessage` *`''firstTile''`* |


    Now, because this function refers to HTML on the page, we want to ensure that
    it isn’t called until the document is ready. Hence, it’s called from a `$(document).ready`
    callback:


    | [jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)
    |


    |   | `$(document).ready` **`->`** |


    |   | `newGame()` |


    |   | `$(`*`''#grid li''`*`).live` *`''click''`*`, tileClick` |


    You might be wondering about the `drawTiles` function in `newGame`. Here it is:


    | [jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)
    |


    |   | `drawTiles =` **`->`** |


    |   | `gridHtml =` *`''''`* |


    |   | **`for`** `x` **`in`** `[0...grid.tiles.length]` |


    |   | `gridHtml +=` *`''<ul>''`* |


    |   | **`for`** `y` **`in`** `[0...grid.tiles.length]` |


    |   | `gridHtml +=` *`"<li id=''tile`*`#{x}`*`_`*`#{y}`*`''>`*`#{grid.tiles[x][y]}`*`</li>"`*
    |


    |   | `gridHtml +=` *`''</ul>''`* |


    |   | `$(`*`''#grid''`*`).html gridHtml` |


    We could’ve used jQuery to generate and insert each tile individually, but there’s
    nothing wrong with creating a big ol’ HTML string when you need to add a whole
    lot of stuff at once to a document. In fact, it’s often the most efficient approach,
    since it’s less expensive to manipulate a string than to manipulate the DOM.


    Now, it’s not much of a game until we take some input—we need to define `tileClick`,
    which we bound to the `li` elements within `#grid` using jQuery’s `live` function.
    Why `live` rather than `bind`? Well, `live` events are triggered no matter what
    happens to the elements they’re bound to—the elements can be burned down to the
    ground then built back up from nothing, and those trusty `live` events will still
    be there. There’s also an efficiency advantage—`live` only creates a single event
    handler, while `bind` would create twenty-five of them.


    Anyway, here’s what happens when you click a tile:


    | [jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)
    |


    |   | `tileClick =` **`->`** |


    |   | `$tile = $(`**`this`**`)` |


    |   | **`if`** `$tile.hasClass` *`''selected''`* |


    |   | *`# undo`* |


    |   | `selectedCoordinates =` **`null`** |


    |   | `$tile.removeClass` *`''selected''`* |


    |   | `showMessage` *`''firstTile''`* |


    |   | **`else`** |


    |   | `$tile.addClass` *`''selected''`* |


    |   | `[x, y] = @id.match(/(\d+)_(\d+)/)[1..]` |


    |   | `selectTile x, y` |


    The context of a jQuery event callback is the DOM element that triggered the event—in
    this case, the `li` that was clicked. We wrap that element to get a jQuery object,
    which we call `$tile`. If the tile is already selected, we unselect it and go
    back to asking players to select their first tile. If it’s a bona fide selection,
    we proceed to `selectTile`:


    | [jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)
    |


    |   | `selectTile = (x, y)` **`->`** |


    |   | **`if`** `selectedCoordinates is` **`null`** |


    |   | `selectedCoordinates = {x1: x, y1: y}` |


    |   | `showMessage` *`''secondTile''`* |


    |   | **`else`** |


    |   | `selectedCoordinates.x2 = x` |


    |   | `selectedCoordinates.y2 = y` |


    |   | `$(`*`''#grid li''`*`).removeClass` *`''selected''`* |


    |   | `doMove()` |


    If `selectedCoordinates` is `null`, then this is the player’s first tile selection,
    so we just store the coordinates. Otherwise, the player has chosen both tiles
    for this turn, so we go on to `doMove`, which has the `Player` instance move the
    tiles around and tabulate score, then displays the results in a notice box:


    | [jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)
    |


    |   | `doMove =` **`->`** |


    |   | `{moveScore, newWords} = currPlayer.makeMove selectedCoordinates` |


    |   | **`if`** `moveScore is 0` |


    |   | `$notice = $(`*`"`*`#{currPlayer.name}` *`formed no words this turn."`*`)`
    |


    |   | **`else`** |


    |   | `$notice = $(`*`"""`* |


    |   | *`<p class="notice">`* |


    |   | `#{currPlayer}` *`formed the following`* `#{newWords.length}` *`word(s):<br
    />`* |


    |   | *`<b>`*`#{newWords.join(`*`'', ''`*`)}`*`</b><br />`* |


    |   | *`earning <b>`*`#{moveScore / newWords.length}`*`x`*`#{newWords.length}`
    *`=`* |


    |   | `#{moveScore}`*`</b> points!`* |


    |   | *`</p>`* |


    |   | *`"""`*`)` |


    |   | `showThenFade $notice` |


    |   | `endTurn()` |


    `showThenFade` is a bit of eye candy that adds a yellow box below the grid, then
    fades and squashes it before removing it from the DOM entirely:


    | [jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)
    |


    |   | `showThenFade = ($elem)` **`->`** |'
