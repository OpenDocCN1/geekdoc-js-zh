    `is` keyword compiles to JavaScript’s `===`, the strict equality operator. (There
    is no analog to JavaScript’s `==`; see [​*Strict Equality or Nothing*​](#f_0018.html_sb.looseEquals).)
    Hence, `odd` will return `true` if the given number is a positive integer that
    is not divisible by 2 and `false` otherwise. (Because `%` coerces its values to
    numbers, `odd` will also return `true` for, say, the string `’3’`.)


    Strict Equality or Nothing


    CoffeeScript’s `is` and `==` both compile to JavaScript’s `===`; there’s no way
    to get the loose, type-coercing equality check of JavaScript’s `==`, which is
    frowned upon by JSLint and others as the source of many “WTF?” moments. Let’s
    borrow an example from [http://wtfjs.com/2011/02/11/all-your-commas-are-belong-to-Array](http://wtfjs.com/2011/02/11/all-your-commas-are-belong-to-Array):


    |   | *`",,,"`* `==` **`new`** `Array(4)` *`// true`* |


    There are also cases where `==` isn’t transitive:


    |   | *`''''`* `==` *`''0''`**`// false`* |


    |   | `0 ==` *`''''`**`// true`* |


    |   | `0 ==` *`''0''`**`// true`* |


    To avoid these head-scratchers, you should perform type conversions explicitly.


    Now in most settings this would be considered a perfectly good oddness check.
    But let’s suppose that you’re writing a math library with very strict specifications
    that state that if the function is given a value that isn’t strictly a positive
    integer, then it should throw an exception. We can do that by using conditionals,
    like so:


    | [Functions/odd.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/odd.coffee)
    |


    |   | `odd = (num)` **`->`** |


    |   | **`if`****`typeof`** `num is` *`''number''`* |


    |   | **`if`** `num is Math.round num` |


    |   | **`if`** `num > 0` |


    |   | `num % 2 is 1` |


    |   | **`else`** |


    |   | **`throw`***`"`*`#{num}` *`is not positive"`* |


    |   | **`else`** |


    |   | **`throw`***`"`*`#{num}` *`is not an integer"`* |


    |   | **`else`** |


    |   | **`throw`***`"`*`#{num}` *`is not a number"`* |


    Note the use of significant indentation to delimit both the function and each
    conditional branch, rather than the curly braces of JavaScript. In CoffeeScript,
    curly braces are used for one thing only: declaring JSON-style objects. (More
    on that in the next chapter.)


    Now if you try calling `odd` with anything but a positive integer, you’ll get
    `undefined` (since `throw` statements have no return value). In order to actually
    see the error message, you’ll need to use a `try...catch` block:


    | [Functions/odd.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/odd.coffee)
    |


    |   | **`try`** |


    |   | `odd 5.1` |


    |   | **`catch`** `e` |


    |   | `console.log e` |


    |   | `5.1 is not an integer` |


    We could improve the style of the `odd` function by simply checking each of our
    three conditions in turn:


    | [Functions/odd.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/odd.coffee)
    |


    |   | `odd = (num)` **`->`** |


    |   | **`unless`****`typeof`** `num is` *`''number''`* |


    |   | **`throw`***`"`*`#{num}` *`is not a number"`* |


    |   | **`unless`** `num is Math.round num` |


    |   | **`throw`***`"`*`#{num}` *`is not an integer"`* |


    |   | **`unless`** `num > 0` |


    |   | **`throw`***`"`*`#{num}` *`is not positive"`* |


    |   | `num % 2 is 1` |


    (If those lines weren’t so long, we’d use the postfix style, `throw a unless b`,
    rather than the indented style.) In general, whenever conditions lead to `throw`
    or `return`, we can simplify branching logic to a simple series check.


    Of course, functions aren’t limited to just returning values and throwing exceptions;
    they can also do stuff by modifying variables and running other functions. (In
    functional programming parlance, these are known as side effects.) These work
    just as you would expect from JavaScript:


    |   | `count = 0` |


    |   | `incrementCount =` **`->`** `count++` |


    |   | `incrementCount()` *`# count is now 1`* |


    Now you know the basics of defining and calling functions in CoffeeScript. But
    the devil’s in the details, so let’s look at one of the most important details:
    Where are variables visible?


    ## 2.2 Scope: Where You See ’Em


    So far, we haven’t worried about where variables live. Alas, we can’t always be
    so cavalier. Consider this example:


    |   | `age = 99` |


    |   | `reincarnate =` **`->`** `age = 0` |


    |   | `reincarnate()` |


    |   | `console.log` *`"I am`* `#{age}` *`years old"`* |


    As you’d probably expect, the output is this:


    |   | `I am 0 years old` |


    However, we can try flipping the first and second lines around, like this:


    |   | `reincarnate =` **`->`** `age = 0` |


    |   | `age = 99` |


    |   | `reincarnate()` |


    |   | `console.log` *`"I am`* `#{age}` *`years old"`* |


    Now hit Run and the code tells a very different story:


    |   | `I am 99 years old` |


    Strange—the `reincarnate()` call doesn’t have any effect! And what if we cut out
    `age = 99` altogether?


    |   | `reincarnate =` **`->`** `age = 0` |


    |   | `reincarnate()` |


    |   | `console.log` *`"age =`* `#{age}`*`"`* |


    |   | `ReferenceError: age is not defined` |


    We’ve got ourselves a “scope” issue! But what is scope? A variable’s scope is
    its home, as defined by three rules:


    1.  Every function creates a scope, and the only way to create a scope is to define
    a function.


    2.  A variable lives in the outermost scope in which an assignment has been made
    to that variable.


    3.  Outside of its scope, a variable is invisible.


    For instance, the scope of `age` in the first example was the global scope; in
    the middle example, there was a variable named `age` in the global scope and another
    in the `reincarnate` function’s scope; and in the last example, there was just
    the `reincarnate`-scoped `age`. That’s why we got a `ReferenceError` from trying
    to display `age` outside of `reincarnate`: no variable with that name exists outside
    of that function.


    CoffeeScript’s approach to scope is known as lexical scope, and it’s the same
    as in JavaScript, except that a variable’s scope is defined explicitly in JavaScript
    using the `var` keyword while CoffeeScript infers scope from assignments. This
    not only saves your fingers precious effort, it also discourages you from shadowing
    one variable by giving a different variable in a nested scope the same name. See
    [​*Shadowing: The Name’s the Same*​](#f_0019.html_sb.shadowing).


    Shadowing: The Name’s the Same


    There are only two ways to shadow a variable in CoffeeScript: One is, as we saw
    in the second `reincarnate` example, to create a variable in a surrounding scope
    after a variable with inner scope. The other way is with a function argument:


    |   | `x = 5` |


    |   | `triple = (x)` **`->`** `x *= 3` |


    |   | `triple x` *`# 15`* |


    |   | `x` *`# 5`* |


    Shadowing is generally considered bad style and should be avoided. Give your variables
    distinct names, lest you sew the seeds of scope confusion.


    A function’s scope is nested within the scope that the function itself lives in.
    (Remember, functions are just variables.) This is another important thing to understand
    about scope: it doesn’t depend on where or how the function is being called. You
    can always tell which scope something lives in just by eyeballing the code or
    by compiling to JavaScript and looking for `var` declarations, which are always
    placed at the top of their scope:


    |   | `singCountdown = (count)` **`->`** |


    |   | `singBottleCount = (specifyLocation)` **`->`** |


    |   | `locationStr =` **`if`** `specifyLocation` **`then`***`''on the wall''`***`else`***`''''`*
    |


    |   | `bottleStr =` **`if`** `count is 1` **`then`***`''bottle''`***`else`***`''bottles''`*
    |


    |   | `console.log` *`"`*`#{count}``#{bottleStr}` *`of beer`* `#{locationStr}`*`"`*
    |


    |   | `singDecrement =` **`->`** |


    |   | `console.log` *`"Take one down, pass it around"`* |


    |   | `count--` |


    |   | `singBottleCount` **`true`**`; singBottleCount` **`false`** |


    |   | `singDecrement(); singBottleCount` **`true`** |'
