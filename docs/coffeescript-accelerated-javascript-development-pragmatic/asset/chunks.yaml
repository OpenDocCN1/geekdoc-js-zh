    |   | `singBottleCount =` **`function`**`(specifyLocation) {` |


    |   | **`var`** `bottleStr, locationStr;` |


    |   | *`// ...`* |


    |   | `}` |


    |   | *`// ...`* |


    |   | `}` |


    You might be wondering, “How do I give a variable a scope without making an assignment?”
    The answer is, you don’t. Instead, you make an assignment, traditionally with
    `null` or some more sensible initial value. Here’s an example:


    |   | `obj =` **`null`** |


    |   | `initializeObj =` **`->`** |


    |   | `obj = ...` *`# create object with superpowers`* |


    |   | `window.onload = initializeObj` |


    That does it for our discussion of scope in CoffeeScript. And now for something
    completely different: `this`.


    ## 2.3 Context (or, “What Is ’this’?”)


    Scope and context are kissing cousins, but don’t get ’em mixed up. While scope
    is about which variable an identifier is referring to, context (also known as
    the receiver) is about the `this` keyword—and its handy CoffeeScript shorthand,
    `@`.


    JavaScript and CoffeeScript newcomers often find `this` baffling. Used rightly,
    it feels like magic. Used wrongly, it may be unrivaled as a source of errors.
    No doubt some of the confusion stems from the word itself; people expect `this`
    to refer to “this object.” Instead, you should think of it as “this context.”
    And as we’ll soon see, the context (aka `this`/`@`) can be something different
    every time a function is called.


    (Before we go on, I should note that using the term context to describe `this`,
    while popular, is not standard. Some frown on it because the JavaScript specification
    defines something called execution context, which is related but different. Unfortunately,
    there is no other universally agreed-upon term for the value of `this`, so throughout
    this book, I’ll continue to refer to it as the context.)


    Let’s go through some examples using this simple function:


    | [Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)
    |


    |   | `setName = (name)` **`->`** `@name = name` |


    Here, `name` and `@name` are totally different variables: `name` (which we could
    call anything, really) is a local variable, one that will never be visible outside
    of the function, while `@name` (shorthand for `this.name`) is a property of the
    context.


    The main purpose of context is to give an object’s methods (functions attached
    as properties) a way of referring to the object they’re being called on:


    | [Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)
    |


    |   | `cat = {}` |


    |   | `cat.setName = setName` |


    |   | `cat.setName` *`''Mittens''`* |


    |   | `console.log cat.name` *`# ''Mittens''`* |


    When we call `cat.setName`, we’re calling `setName` with the `cat` object as its
    context; thus `this` (or `@`) refers to the cat, and `@name` refers to `cat.name`.
    The function itself hasn’t changed. We could call the following:


    |   | `setName` *`''Mr. Mistoffelees''`* |


    And it would have no effect on `cat`.


    We can invoke a function in a particular context without attaching the function
    to that object by using the `call` or `apply` methods, which all functions have.
    (If you’re fuzzy on how properties work in JavaScript or surprised to learn that
    functions are objects, then you may want to skip ahead to Section 3.1, [​*Objects
    as Hashes*​](#f_0028.html_sec.objects) and then come back.) `apply` takes a context
    and an array of arguments to pass to the function:


    | [Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)
    |


    |   | `pig = {}` |


    |   | `setName.apply pig, [`*`''Babe''`*`]` |


    |   | `console.log pig.name` *`# ''Babe''`* |


    `call` works the same way, except that it takes individual arguments rather than
    a single array. So the equivalent of the previous would be this:


    |   | `setName.call pig,` *`''Babe''`* |


    In practice, `apply` is more commonly used than `call` because it’s more versatile:
    `call` only lets you change the context of a normal function call, while `apply`
    lets you change the context and pass in an arbitrary number of arguments.


    You can use `call` and `apply` to “borrow” one object’s methods and use them on
    another:


    | [Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)
    |


    |   | `horse = {}` |


    |   | `cat.setName.apply horse, [`*`''Mr. Ed''`*`]` |


    |   | `console.log horse.name` *`# ''Mr. Ed''`* |


    Here, it doesn’t matter that we’re using `cat.setName` instead of `setName`: they’re
    the same function.


    Finally, one last way of giving a function a context is with `new`, which creates
    a new object using the function as a constructor:


    | [Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)
    |


    |   | `Dog = setName` *`# By convention, constructors are capitalized`* |


    |   | `dog1 =` **`new`** `Dog(`*`''Jimmy''`*`)` |


    |   | `dog2 =` **`new`** `Dog(`*`''Jake''`*`)` |


    |   | `console.log dog1.name` *`# ''Jimmy''`* |


    |   | `console.log dog2.name` *`# ''Jake''`* |


    The `new` keyword says, “Don’t return the result of the function; instead, create
    a new object, run the function in that object’s context, and then return the object.”
    (We can also give the object created by `new` additional properties using a prototype,
    as we’ll see in Section 4.2, [​*The Power of Prototypes*​](#f_0039.html_sec.prototypes).)
    Because the `new` keyword sets the new `Dog` as the context, `@name` points to
    the new dog’s `name` property.


    If a function isn’t called as a method and you don’t use the `new` keyword or
    `call`/`apply`, then the context is the global object. We’ll learn more about
    the global context in Section 4.1, [​*Modules: Splitting Up Apps*​](#f_0038.html_sec.modules);
    for now, just remember that it’s generally a bad idea to use `this` when it’s
    pointing at the global object:


    | [Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)
    |


    |   | `setName` *`''Lulu''`* |


    |   | `console.log name` *`# ''Lulu''`* |


    |   | `console.log @name` *`# undefined`* |


    So, you see that context is determined purely by how a function is called; unlike
    scope, it has nothing to do with where the function is defined. (Of course, we’d
    often like for the context to be determined by where the function is defined.
    Fortunately, there’s a clever technique that lets us effectively do this, one
    we’ll meet in [​*Bound Functions: ’this’ Means ’this’*​](#f_0020.html_sec.boundFunctions).)


    To review, here are the CoffeeScript rules of context in a nutshell, with earlier
    rules taking precedence over later ones:


    1.  When the `new` keyword is put in front of a function call, its context is
    the new object.


    2.  When a function is called with `call` or `apply`, the context is the first
    argument given.


    3.  Otherwise, if a function is called as an object property (`obj.func`) or `obj[’func’]`),
    it runs in that object’s context.


    4.  If none of the above apply, then the function runs in the global context.


    We’ll learn more about the global context in Section 4.1, [​*Modules: Splitting
    Up Apps*​](#f_0038.html_sec.modules).


    ### Bound Functions: ’this’ Means ’this’


    Sometimes you want a function to run in the current context no matter how it’s
    called. This is especially common with event callbacks. Let’s say that you want
    someone to leave a message in your `voicemail` array (bound to the current context).
    Then you might write something like this:


    |   | `callback = (message)` **`->`** `@voicemail.push message` |'
