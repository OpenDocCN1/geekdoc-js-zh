    \ a `sleep` loop saying, “I hope someone else does something useful while I wait\
    \ to hear from the database.” It’s simpler on the surface, but at a price in memory,\
    \ CPU, and—more often than not—unpleasant surprises.\n\nNote that many NodeJS\
    \ API functions do offer a synchronous version for convenience. For instance,\
    \ instead of using `fs.readdir` with a callback, you can call `fs.readdirSync`\
