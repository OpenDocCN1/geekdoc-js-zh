  trans: "\n\n```\n$('a').click(destroyWorld).unbind('click')\n```\n\n首先，`destroyWorld`\
    \ 永远不会被调用，因为 `click` 事件处理器在绑定后立即被解绑。其次，这里的 `unbind` 会移除所有 `<a>` 元素上的所有 `click`\
    \ 事件处理器。\n\n3.  在这四个选择器中，与众不同的是第三个：`$(’.redShirt, #awayTeam’).die()`：\n\n    ```\n\
    \    $('#awayTeam .redShirt').die()\n    $('#awayTeam').find('.redShirt').die()\n\
    \    $('.redShirt, #awayTeam').die()\n    $('.redShirt', $('#awayTeam')).die()\n\
    \    ```\n\n    这会杀死所有带有 `redShirt` 类的元素以及 `awayTeam` 元素上的所有实时事件，而不仅仅是 `awayTeam`\
    \ 中属于 `redShirt` 类的成员。\n\n4.  以下代码实际上会将 `drJekyll` 的 ID 更改为 `mrHyde`。\n\n    ```\n\
    \    $('#drJekyll').click ->\n    alert 'Now I shall transform!'\n    $('#drJekyll').attr\
    \ 'id', 'mrHyde'\n    $('#drJekyll').unbind 'click'\n    ```\n\n    但烦人的是，每次点击它都会弹出“Now\
    \ I shall transform!”。问题在于，ID 更改后，`'#drJekyll'` 选择器不再匹配任何元素。将 `unbind` 移到 `click`\
    \ 函数的顶部是一种解决方案。使用 `$(this)` 代替 `$('#drJekyll')` 则更好。\n\n## A1.5 使用 Node.js 的服务器端应用\n\
    \n第 6.6 节 *练习* 的答案：\n\n1.  给出的代码不幸是一个无限循环：\n\n    ```\n    countdown = 10\n  \
    \  h = setInterval (-> countdown--), 100\n    do (->) until countdown is 0\n \
    \   clearInterval h\n    console.log 'Surprise!'\n    ```\n\n    无论经过多少百毫秒，`countdown`\
    \ 都不会减少，因为循环代码永远不会结束运行。以下是可用的版本：\n\n    ```\n    countdown = 10\n    decreaseCountdown\
    \ = ->\n    countdown--\n    if countdown is 0\n    clearInterval h\n    console.log\
    \ 'Surprise!'\n    h = setInterval decreaseCountdown, 100\n    ```\n\n    注意，当我们写下\
    \ `clearInterval h` 这一行时，`h` 还不存在，这并不构成问题。当这行代码运行时，程序会在当前作用域中找不到 `h`，然后检查外部作用域，从而找到\
    \ `setInterval` 返回的句柄。这种非线性思维，唉，正是我们为摆脱线程祸害所付出的代价。\n\nCopyright © 2011, The Pragmatic\
    \ Bookshelf.\n\n# 附录 2\n\n运行 CoffeeScript 的方式\n\n尽管 CoffeeScript 的生态系统还很年轻，但已经有大量用于编译和运行\
    \ CoffeeScript 代码的工具。我们在第 1.3 节 *认识 'coffee'* 中已经介绍了官方的命令行编译器；本附录将介绍我推荐的其他几个选项。更全面的列表请访问\
    \ [`github.com/jashkenas/coffee-script/wiki`](http://github.com/jashkenas/coffee-script/wiki)。\n\
    \n## A2.1 网页控制台\n\n如果你访问 [`coffeescript.org`](http://coffeescript.org)，你不仅会看到大量示例，还会找到一个标有“Try\
    \ CoffeeScript”的按钮。点击它，一个实时控制台就会弹出。你最好使用带有开发者控制台的浏览器，这样就不必忍受 `alert` 输出了。[[51]](#f_0073.html_FOOTNOTE-51)\
    \ 尝试输入以下内容：\n\n```\nconsole.log ['a','b','c'][0...-1]\n```\n\n你会立刻看到右侧出现编译后的 JavaScript：\n\
    \n```\nconsole.log(['a','b','c'].slice(0, -1));\n```\n\n点击 Run，你会在浏览器的控制台中看到结果\
    \ `[\"a\", \"b\"]`。\n\n当你想要并排查看 CoffeeScript 和编译后的 JavaScript 时，“Try CoffeeScript”非常棒，但如果你想要更像\
    \ REPL 的体验，比如可以让你尝试 CoffeeScript 以及 jQuery 和 Underscore.js 等库，那该怎么办？那就试试 JS Console。[[52]](#f_0073.html_FOOTNOTE-52)\
    \ 虽然它有限制（目前无法编写多行表达式），但非常流畅，甚至还有 iPhone 版本！\n\n你可能会对这些控制台的速度感到惊讶。对于基于网页的 Ruby\
    \ 或 Python 控制台，所有命令都必须在服务器上远程运行。但这些网站是在你的浏览器中运行 CoffeeScript 编译器。你也可以做到这一点——请参阅下一节。\n\
    \n## A2.2 在网页应用中运行 CoffeeScript\n\n如果你能直接将 CoffeeScript 包含在 HTML 中，而无需先将其编译为 JavaScript，那该多好啊？啊，你可以做到！\n\
    \n```\n<script type=\"text/coffeescript\">\nalert 'Wow, this CoffeeScript is right\
    \ in your HTML!'\n</script>\n```\n\n唯一的条件是，你必须包含一个特殊版本的 CoffeeScript 编译器，其体积高达\
    \ 170 KB。[[53]](#f_0073.html_FOOTNOTE-53)\n\n由于它简化了开发，我们在第 5 章 *使用 jQuery 实现网页交互*\
    \ 的示例项目中使用了基于浏览器的编译器。但除非你正在构建自己的 CoffeeScript 控制台，否则不建议在生产环境中使用这种方法。除了编译器本身的庞大体积外，所有\
    \ CoffeeScript 文件都是在编译器加载后通过 Ajax 加载的。\n\n接下来我们将介绍几个工具，旨在弥合简易网页开发与高效部署之间的差距。\n\
    \n## A2.3 Rails 上的 CoffeeScript\n\nCoffeeScript 在很大程度上归功于 Ruby。它的第一个编译器是用 Ruby\
    \ 编写的；许多早期用户也是 Ruby 开发者；如今，这门语言得到了 37signals 的杰出 Ruby 开发者的支持。2011 年 4 月，宣布将通过\
    \ Sprockets 2 在 Rails 3.1 中集成 CoffeeScript 支持。在撰写本文时，两者均未发布，但你可以在 [`github.com/sstephenson/sprockets`](https://github.com/sstephenson/sprockets)\
    \ 查看最新的 Sprockets。\n\n较早版本的 Rails 仍然可以通过一个名为 `Barista` 的插件享受一流的 CoffeeScript 集成：[[54]](#f_0073.html_FOOTNOTE-54)\
    \ 你将 `coffee` 文件放在一个目录中，对应的 `js` 文件会在每次页面请求时根据需要自动生成。你还可以在 ERB 和 Haml 模板中嵌入 CoffeeScript。\n\
    \n`Barista` 更进一步，允许你从 gems 中打包和引入 CoffeeScript。这是将大型项目拆分为可重用、版本清晰组件的绝佳方式。此外，它\
    \ 100% 兼容 Heroku；只需插入 `therubyracer-heroku`，这是一个设计用于在任何 Ruby 环境中运行的 JavaScript\
    \ 解释器。[[55]](#f_0073.html_FOOTNOTE-55) （同样适用于 Rails 3.1 应用；`Barista` 和 Rails 3.1\
    \ 都使用相同的 gem 来封装 CoffeeScript 编译器。）[[56]](#f_0073.html_FOOTNOTE-56)\n\n`Barista`（以及大多数其他\
    \ CoffeeScript 的 Web 框架集成）的一个缺点是，如果你的代码中有语法错误，只有当你刷新页面并看到损坏的 JavaScript 时才会发现。为了解决这个问题，我编写了一个插件，扩展了\
    \ `Barista`，以便在 CoffeeScript 编译失败时提供 Growl 通知。[[57]](#f_0073.html_FOOTNOTE-57)\n\
    \n## A2.4 通过中间件使用 CoffeeScript\n\n如果你的应用可以认为自己使用的是普通的旧 JavaScript，而服务器透明地处理 CoffeeScript\
    \ 编译，那该多好啊？嗯，通过中间件——一种紧密贴合在 Web 框架和服务器之间的软件——所有这些梦想，甚至更多，都可以实现！\n\n"
