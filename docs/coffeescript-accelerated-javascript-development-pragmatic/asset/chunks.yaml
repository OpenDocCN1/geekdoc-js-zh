    # Chapter 2


    Functions, Scope, and Context


    The heart and soul of CoffeeScript consists of two characters: `->`. That’s all
    it takes to define a new function, but don’t let the terseness fool you; as we’ll
    soon see, functions are powerful, versatile objects. Mastering them is the first
    step to mastering CoffeeScript.


    While functions are the major players of this chapter, we’ll meet a cheerful supporting
    cast along the way: variables, strings, conditionals, exceptions, and everything
    else you need to write useful functions. We’ll also have a refresher on two crucial
    concepts, scope and context, and show how they carry over to CoffeeScript. Then
    we’ll conclude our tour by looking at some very cool features: property arguments,
    default arguments, and splats.


    At this point we’ll be ready to tackle our first project, in which we’ll put together
    an input prompt for our little word game. And last but not least, this chapter’s
    exercises will push your newfound CoffeeScript expertise to its limits.


    ## 2.1 Functions 101


    It’s finally time to declare our first function! Check it out:


    ```

    -> ''Hello, functions!''

    ```


    I didn’t say it would be a useful function, did I? But it does do something: it
    returns a string.


    Don’t take my word for it. Punch this into your favorite text editor and hit the
    Run command:


    ```

    console.log do -> ''Hello, functions!''

    ```


    You’ll be greeted with something cheerful:


    ```

    Hello, functions!

    ```


    What does `do` do? (It has nothing to do with JavaScript’s `do...while` loop.)
    It just means “run the following function.” We could have done the same thing
    using a mess of parentheses:


    ```

    console.log (-> ''Hello functions!'')()

    ```


    ```

    Hello, functions!

    ```


    “Where’s the `return` keyword,” you ask? CoffeeScript takes a cue from Ruby here,
    implicitly returning the last expression from each function. You can still use
    `return` explicitly, but it’s optional, and the preferred style is to omit it
    unless you’re breaking the flow of execution. If you don’t want to return anything,
    use `return` by itself.


    So far, our function has been anonymous. Anonymous functions have their uses,
    but this one is really aching for a name:


    ```

    hi = -> ''Hello, functions!''

    ```


    ```

    console.log hi()

    ```


    Once again, we get this response:


    ```

    Hello, functions!

    ```


    Naming a function in CoffeeScript just means assigning it to a variable. Note
    that we could have written `do hi` instead of `hi()`. But in practice, `do` is
    usually only used to create scope, especially during iteration. More on that in
    [​*Scope in Loops*​](#f_0056.html_sec.scopeInLoops).


    ### A Tale of Two Function Declaration Syntaxes


    In JavaScript, there are two ways of defining a function. Here’s one:


    ```

    var cube1 = function(x) { return Math.pow(x, 3); };

    ```


    Here’s another:


    ```

    function cube2(x) { return Math.pow(x, 3); }

    ```


    The main difference between these two is that if you were to call `cube1` before
    it’s defined, you would get an error, but if you called `cube2` from earlier within
    its scope, the interpreter would automatically look ahead to the function definition.


    Due to a thorny issue in IE, CoffeeScript always generates variable-style function
    declarations, like `cube1`. (The one exception is that “named” functions are generated
    by the `class` keyword, as we’ll see in Section 4.3, [​*Classes: Functions with
    Prototypes*​](#f_0040.html_sec.classes).) So don’t forget to define your functions
    before you call them!


    But what’s the use of just returning a constant from a function? Not much. So
    let’s make this function a bit more versatile:


    ```

    greeting = (subject) -> "Hello, #{subject}!"

    ```


    ```

    console.log greeting ''arguments''

    ```


    ```

    ''Hello, arguments!''

    ```


    We’ve added an argument list, `(subject)`, in front of the `->`. (Note that parentheses
    are optional in function calls but not in argument lists, except when the argument
    list is empty. For details, see [​*Implicit Parentheses*​](#f_0018.html_sb.implicitParentheses).)
    And we’ve used string interpolation to insert an expression into a string.


    CoffeeScript’s interpolation syntax is similar to Ruby’s: `"A#{expression}Z"`
    is equivalent to `''A'' + (expression) + ''Z''`. Interpolations only work in double-quoted
    strings. (As a matter of style, I prefer to use single-quoted strings whenever
    I’m not doing an interpolation so as to clearly convey that there’s no funny business
    going on.)


    Word to the wise: CoffeeScript’s `+` operator is sensitive to whitespace. So string
    concatenation like this works fine:


    ```

    squadron = ''Red''

    xWing = squadron + 5 # ''Red5''

    ```


    However, this doesn’t:


    ```

    squadron = ''Red''

    xWing = squadron +5 # TypeError

    ```


    The problem is that `squadron +5` compiles to `squadron(+5)`. (The `+` prefix
    is a handy way of converting strings to numbers.) Since `squadron` is a string,
    not a function, this gives us an error. String interpolation prevents this gotcha:


    ```

    squadron = ''Red''

    xWing = "#{squadron}5" # ''Red5''

    ```


    ### Implicit Parentheses


    The ability to omit parentheses from function calls is a double-edged sword. To
    use this power wisely, you need to understand one simple rule: implicit parentheses
    don’t close until the end of the expression.


    Expecting CoffeeScript to understand what you’re trying to do is a common rookie
    mistake. For instance, you might be surprised if you were to write the following:


    ```

    console.log(Math.round 3.1, Math.round 5.2)

    ```


    The output for this is `3`. What happened to `Math.round 5.2`? The answer is clear
    when we make the parentheses explicit:


    ```

    console.log(Math.round(3.1, Math.round(5.2)))

    ```


    `Math.round(5.2)` was evaluated, but then it was passed as an argument to the
    other `Math.round` (which ignored it), rather than to `console.log` as intended.


    To avoid confusion, I like to use parentheses for everything but the outermost
    function call:


    ```

    console.log Math.round(3.1), Math.round(5.2) # 3, 5

    ```


    ### Accessing ’arguments’


    This is as good a time as any to mention that you can access all arguments to
    a function using JavaScript’s array-like `arguments` object, whether they’re declared
    in the argument list or not. For example, we could’ve written our `greeting` function
    like this:


    ```

    greeting = -> "Hello, #{arguments[0]}!"

    ```


    The `arguments` object is typically used when a function needs to accept a varying
    number of arguments. Of course, this versatility comes at the price of readability.
    It’s also a common source of JavaScript headaches, as `arguments` acts like an
    array without supporting many of a normal array’s methods.


    Fortunately, you rarely need to work with `arguments` directly in CoffeeScript,
    thanks to a feature we’ll learn about in Section 2.6, [​*Splats (...)*​](#f_0023.html_sec.splats).


    ### Conditionals and Exceptions


    Now, let’s write a numeric function for a change of pace:


    ```

    cube = (num) -> Math.pow num, 3

    ```


    Notice that the `Math` object, as part of the JavaScript standard, is identical
    in CoffeeScript (and, for that matter, across all major browser and server-side
    environments).


    How about something a little more complex: a boolean test?


    ```

    odd = (num) -> num % 2 is 1

    ```

