    \ 1.0 版本。\n\n## 6.5 客户端、服务器——有什么区别？\n\n本章我们只是浅尝了 Node.js。尽管它还很年轻，但 Node 已经是一个拥有蓬勃生态系统的强大框架，使得\
    \ CoffeeScript 成为一种在浏览器之外也可行的语言。\n\nNode 之所以引起大量炒作，部分原因在于其基于非阻塞 IO 的事件驱动架构，这使其成为依赖多线程的\
