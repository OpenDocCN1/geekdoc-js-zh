- fmt: "\n```\n$('a').click(destroyWorld).unbind('click')\n```\n\nFirst, `destroyWorld`\
    \ will never get called, because the `click` event handler is unbound immediately\
    \ after it’s bound. Second, the `unbind` here will remove all `click` event handlers\
    \ from all `<a>` elements.\n\n3.  Of the four selectors, the odd one out is #3,\
    \ `$(’.redShirt, #awayTeam’).die()`:\n\n    ```\n    $('#awayTeam .redShirt').die()\n\
    \    $('#awayTeam').find('.redShirt').die()\n    $('.redShirt, #awayTeam').die()\n\
    \    $('.redShirt', $('#awayTeam')).die()\n    ```\n\n    This would kill all\
    \ live events on all elements with the `redShirt` class and on the `awayTeam`\
    \ element as well, rather than just on the `redShirt`-class members of the `awayTeam`.\n\
    \n4.  The following code will, in fact, change `drJekyll`’s ID to `mrHyde`.\n\n\
    \    ```\n    $('#drJekyll').click ->\n    alert 'Now I shall transform!'\n  \
    \  $('#drJekyll').attr 'id', 'mrHyde'\n    $('#drJekyll').unbind 'click'\n   \
    \ ```\n\n    But annoyingly, it’ll shout “Now I shall transform!” every time it’s\
    \ clicked. The problem is that the `’#drJekyll’` selector doesn’t match anything\
    \ after the ID change. Moving the `unbind` to the top of the `click` function\
    \ would be one solution. Using `$(this)` instead of `$(’#drJekyll’)` would be\
    \ even better.\n\n## A1.5 Server-Side Apps with Node.js\n\nAnswers to Section\
    \ 6.6, [*Exercises*](#f_0059.html_sec.nodeExercises):\n\n1.  The code given is,\
    \ alas, an infinite loop:\n\n    ```\n    countdown = 10\n    h = setInterval\
    \ (-> countdown--), 100\n    do (->) until countdown is 0\n    clearInterval h\n\
    \    console.log 'Surprise!'\n    ```\n\n    No matter how many hundreds of milliseconds\
    \ pass, `countdown` will never decrease, because the loop code never finishes\
    \ running. Here’s a working version:\n\n    ```\n    countdown = 10\n    decreaseCountdown\
    \ = ->\n    countdown--\n    if countdown is 0\n    clearInterval h\n    console.log\
    \ 'Surprise!'\n    h = setInterval decreaseCountdown, 100\n    ```\n\n    Note\
    \ that it’s not a problem that `h` doesn’t exist yet when we write the line `clearInterval\
    \ h`. When the line is run, the program will see that there’s no `h` in the current\
    \ scope, check the outer scope, and thus find the handle returned by `setInterval`.\
    \ Such nonlinear thinking is, alas, the price we pay to be rid of the scourge\
    \ of threads.\n\nCopyright © 2011, The Pragmatic Bookshelf.\n\n# Appendix 2\n\n\
    Ways of Running CoffeeScript\n\nAlthough CoffeeScript’s ecosystem is young, there\
    \ are a vast number of tools out there for compiling and running CoffeeScript\
    \ code. We already covered the official command-line compiler in Section 1.3,\
    \ [*Meet ’coffee’*](#f_0014.html_sec.running); this appendix covers a few of the\
    \ other options I recommend. For a more comprehensive list, visit [http://github.com/jashkenas/coffee-script/wiki](http://github.com/jashkenas/coffee-script/wiki).\n\
    \n## A2.1 Web Consoles\n\nIf you head over to [http://coffeescript.org](http://coffeescript.org),\
    \ you’ll find not only a ton of examples but also a button labeled “Try CoffeeScript.”\
    \ Click it, and a live console pops out. You’ll want to use a browser with a developer\
    \ console so that you don’t have to put up with `alert` for output.[[51]](#f_0073.html_FOOTNOTE-51)\
    \ Try typing this:\n\n```\nconsole.log ['a','b','c'][0...-1]\n```\n\nYou’ll instantly\
    \ see the compiled JavaScript appear on the right:\n\n```\nconsole.log(['a','b','c'].slice(0,\
    \ -1));\n```\n\nClick Run and you’ll see the result `[\"a\", \"b\"]` in your browser’s\
    \ console.\n\n“Try CoffeeScript” is great when you want to see CoffeeScript and\
    \ compiled JavaScript side-by-side, but what if you want more of a REPL experience,\
    \ maybe one that lets you try CoffeeScript along with libraries like jQuery and\
    \ Underscore.js? Then check out JS Console.[[52]](#f_0073.html_FOOTNOTE-52) Although\
    \ limited (there’s currently no way to write multiline expressions), it’s very\
    \ slick, and there’s even an iPhone version!\n\nYou might be surprised at how\
    \ fast these consoles are. With a web-based console for Ruby or Python, say, all\
    \ the commands have to run remotely on the server. But these sites run the CoffeeScript\
    \ compiler in your browser. And you can do this, too—see the next section.\n\n\
    ## A2.2 Running CoffeeScript in Your Web App\n\nWouldn’t it be nice if you could\
    \ include CoffeeScript directly in your HTML without having to compile it to JavaScript\
    \ first? Ah, but you can!\n\n```\n<script type=\"text/coffeescript\">\nalert 'Wow,\
    \ this CoffeeScript is right in your HTML!'\n</script>\n```\n\nThe only catch\
    \ is that you have to include a special version of the CoffeeScript compiler,\
    \ which weighs in at a whopping 170 KB.[[53]](#f_0073.html_FOOTNOTE-53)\n\nSince\
    \ it simplifies development, we used the browser-based compiler for our example\
    \ project in Chapter 5, [*Web Interactivity with jQuery*](#f_0045.html_chp.jquery).\
    \ But unless you’re building your own CoffeeScript console, this approach isn’t\
    \ recommended for production use. In addition to the sheer size of the compiler,\
    \ all CoffeeScript files are loaded via Ajax after the compiler has been loaded.\n\
    \nThe next few tools we’ll be looking at are aimed at bridging that gap between\
    \ easy web development and efficient deployment.\n\n## A2.3 CoffeeScript on Rails\n\
    \nCoffeeScript owes a lot to Ruby. Its first compiler was written in Ruby; many\
    \ of its earliest users were also Rubyists; and now the language enjoys the support\
    \ of the preeminent Rubyists at 37signals. In April 2011, it was announced that\
    \ CoffeeScript support will be included in Rails 3.1 via Sprockets 2\\. As of\
    \ this writing, neither has been released, but you can check out the latest Sprockets\
    \ at [https://github.com/sstephenson/sprockets](https://github.com/sstephenson/sprockets).\n\
    \nEarlier versions of Rails can still enjoy first-class CoffeeScript integration,\
    \ thanks to a plugin called `Barista`:[[54]](#f_0073.html_FOOTNOTE-54) you put\
    \ your `coffee` files in one directory, and the corresponding `js` files are automatically\
    \ generated as needed on each page request. You can also embed CoffeeScript in\
    \ ERB and Haml templates.\n\n`Barista` goes even further by allowing you to package\
    \ and pull in CoffeeScript from gems. This is a terrific way to split large projects\
    \ into reusable, cleanly versioned components. Plus, it’s 100 percent Heroku-compatible;\
    \ just plug in `therubyracer-heroku`, a JavaScript interpreter designed to run\
    \ in any Ruby environment.[[55]](#f_0073.html_FOOTNOTE-55) (The same applies to\
    \ Rails 3.1 apps; both `Barista` and Rails 3.1 employ the same gem to wrap around\
    \ the CoffeeScript compiler.)[[56]](#f_0073.html_FOOTNOTE-56)\n\nOne bummer with\
    \ `Barista` (and most other web framework integrations for CoffeeScript) is that\
    \ if there’s a syntax error in your code, you won’t find out about it until you\
    \ refresh the page and get broken JavaScript. To help with this, I wrote a plugin\
    \ that extends `Barista` to provide a Growl notification whenever your CoffeeScript\
    \ fails to compile.[[57]](#f_0073.html_FOOTNOTE-57)\n\n## A2.4 CoffeeScript via\
    \ Middleware\n\nWouldn’t it be nice if your app could think it’s using plain old\
    \ JavaScript, while the server handles the CoffeeScript compilation transparently?\
    \ Well, with middleware—software that fits snugly between your web framework and\
    \ the server—all these dreams, and more, can come true!\n"
