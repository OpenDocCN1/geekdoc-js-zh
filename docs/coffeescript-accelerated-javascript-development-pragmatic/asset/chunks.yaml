    \ **`copy[1] = 'B' + copy[1][1..]`** |\n\n    |   | `coffee>` **`original.join\
    \ ' '`** |\n\n    |   | `Mary Poppins` |\n\n    |   | `coffee>` **`copy.join '\
    \ '`** |\n\n    |   | `Shary Boppins` |\n\n    Explain how `copy = original[0..]`\
    \ differs from `copy = original`.\n\n2.  One subtle difference between CoffeeScript’s\
    \ `for...in` loops and the C-style `for` loops in JavaScript is illustrated by\
    \ this code. Explain why this code produces the following result:\n\n    |   |\
    \ `once =` **`->`** |\n\n    |   | **`if`** `once.hasRun` |\n\n    |   | **`null`**\
    \ |\n\n    |   | **`else`** |\n\n    |   | `once.hasRun =` **`true`** |\n\n  \
    \  |   | `[1, 2, 3]` |\n\n    |   | `console.log x` **`for`** `x` **`in`** `once()`\
    \ |\n\n    |   | `1` |\n\n    |   | `2` |\n\n    |   | `3` |\n\n3.  What is the\
    \ output of this code?\n\n    |   | **`for`** `x` **`in`** `[1, 2]` |\n\n    |\
    \   | `setTimeout (`**`->`** `console.log x), 50` |\n\n    Bonus question: Does\
    \ it matter if the timeout is `0`?\n\n    For illumination, see [​*Scope in Loops*​](#f_0056.html_sec.scopeInLoops).\n\
    \n4.  Recall that `’foo’ in arr` will tell you whether the array `arr` contains\
    \ the string `’foo’` and whether `’bar’ of obj` will tell you if `obj.bar` exists.\
    \ But how would you check whether an arbitrary object contains a given value?\
    \ Start with this:\n\n    |   | `objContains = (obj, val)` **`->`** |\n\n5.  Let’s\
    \ say that we need to run a function at least once and then run it again repeatedly\
    \ until a condition is met. In C/Java/JavaScript, we can write this:\n\n    |\
    \   | **`do`** `{` |\n\n    |   | `user.harangue()` |\n\n    |   | `}` **`while`**\
    \ `(!user.paidInFull)` |\n\n    The direct CoffeeScript equivalent would be the\
    \ following:\n\n    |   | `user.harangue()` |\n\n    |   | `user.harangue()` **`until`**\
    \ `user.paidInFull` |\n\n    But this violates the sacred principle of DRY (Don’t\
    \ Repeat Yourself). Define a `doAndRepeatUntil` function that takes two functions\
    \ (equivalent to the loop body and the condition), so that we can instead write\
    \ it this way:\n\n    |   | `doAndRepeatUntil user.harangue,` **`->`** `user.paidInFull`\
    \ |\n\n6.  For the project in this chapter, we set `MIN_WORD_LENGTH` as a constant.\
    \ However, it makes more sense from a modularity standpoint to derive this from\
    \ the dictionary we load into the game. How would you do that on one line using\
    \ `Math.min.apply` and a list comprehension? (`Math.min` returns the argument\
    \ given with the lowest value, such as `Math.min 15, 16, 23, 42, 5, 8` is `5`.)\n\
    \n#### Footnotes\n\n| [[29]](#f_0029.html_FNPTR-29) | [http://developer.mozilla.org/en/JavaScript/Reference/Global_Objects/Array](http://developer.mozilla.org/en/JavaScript/Reference/Global_Objects/Array)\
    \ |\n\n| [[30]](#f_0032.html_FNPTR-30) | [http://documentcloud.github.com/underscore/](http://documentcloud.github.com/underscore/)\
    \ |\n\n| [[31]](#f_0034.html_FNPTR-31) | From [http://www.zyzzyva.net/wordlists.shtml](http://www.zyzzyva.net/wordlists.shtml)\
    \ |\n\nCopyright © 2011, The Pragmatic Bookshelf.\n\n# Chapter 4\n\nModules and\
    \ Classes\n\nIn the preceding chapters, we learned how to make sentences out of\
    \ the verbs and nouns of CoffeeScript. But strings of sentences do not always\
    \ an elegant program make. What we need are higher-order abstractions. In particular,\
    \ we need a clean way of describing types of objects.\n\nIn classical object-oriented\
    \ languages like C++, there’s a sharp distinction between objects and classes:\
    \ an object is an instance of a class, inheriting its methods but storing its\
    \ own data. Many dynamic languages, like Ruby, blur that distinction by allowing\
    \ an object’s methods to be modified at runtime. JavaScript obliterates the distinction:\
    \ there are no classes. There are only prototypes, which make it easy for objects\
    \ to share methods. For that reason, JavaScript is sometimes described as a prototype-based\
    \ language.\n\nThis dynamic approach to sharing methods is powerful but has a\
    \ cost in clarity. If you’re reading code in a strictly class-based language and\
    \ you want to find out which methods a particular object supports, you just have\
    \ to look at the code that defines that object’s class. But if you want to know\
    \ which methods a JavaScript object has (without running the code), you have to\
    \ track down every possible reference to that object or its prototype anywhere\
    \ in the application.\n\nSeveral approaches have popped up over the years for\
    \ organizing JavaScript code into something resembling classes. Over time, a standard\
    \ pattern evolved. That pattern provides the basis for CoffeeScript’s `class`\
    \ keyword. In this chapter, we’ll learn how CoffeeScript classes work and then\
    \ use them to modularize our code for 5x5.\n\nBut before we get into the workings\
    \ of CoffeeScript classes, we need to talk a bit about how modules interact in\
    \ CoffeeScript.\n\n## 4.1 Modules: Splitting Up Apps\n\nIn a browser environment,\
    \ JavaScript doesn’t care about files. No matter how many files you may have,\
    \ it’s just a bunch of lines. So, if two files in an application happen to declare\
    \ global-scope variables with the same name, well, they’re just going to have\
    \ to fight it out. May the best code win.\n\nThis is a huge problem for complex\
    \ JavaScript apps. If a team is splitting up a project, how can they be sure that\
    \ they aren’t overwriting each other’s variables? How can you be sure that open-source\
    \ code you drop in doesn’t conflict with your own?\n\nThe solution is namespacing.\
    \ In JavaScript (and therefore CoffeeScript), every function has its own namespace.\
    \ A variable declared in a function is never visible outside of that function.\
    \ So, a common JavaScript convention is to make each file a module by wrapping\
    \ it in a function, which is immediately executed. Server-side environments like\
    \ Node.js, which implement the CommonJS specification, always treat each file\
    \ as a separate module.\n\nAs mentioned in [​*JavaScript, Under Wraps*​](#f_0014.html_sb.wrapper),\
    \ the CoffeeScript compiler wraps each `coffee` file in an anonymous function\
    \ wrapper, unless it’s invoked with the `--bare` flag. CoffeeScript also prevents\
    \ you from declaring global variables by mistake, which in JavaScript is as easy\
    \ as forgetting the `var` keyword. So the question is, how do you share data between\
    \ modules?\n\nThe answer is you attach them to an existing global variable. One\
    \ option is to use the root object, which is the only object whose properties\
    \ can be referenced without qualification. In a browser environment, the root\
    \ object is `window`. In Node, it’s `global`.\n\nIn fact, all of the globals you’re\
    \ used to dealing with are actually properties of the root object. For instance,\
    \ `parseInt` is actually `window.parseInt`/`global.parseInt`, and `Math` is `window.Math`/`global.Math`.\
    \ Even the objects that define the built-in types, like `String`, are actually\
    \ `window.String`/`global.String`."
