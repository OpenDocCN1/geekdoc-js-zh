    ## 3.7 Project: 5x5 Solitaire


    Since we handled input in the last chapter, there are just a few things our app
    has to do in order to be a full-fledged game. Let’s start with the simplest pieces
    of the puzzle, then move on to the harder ones.


    First things first: We’ll need some words. Fortunately, the word list used at
    Scrabble tournaments, the Second Official Tournament and Club Word List (known
    to die-hard Scrabblers as the OWL2) is publicly available. One version of it is
    included with the book’s code.[[31]](#f_0036.html_FOOTNOTE-31)


    We’ll store this word list as an array. (Another data structure, such as a binary
    tree, would yield more efficient lookups, but I’ll leave such optimizations in
    the reader’s capable hands.) But first, we need to access it through Node’s file
    system (`fs`) module:


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

    fs = require ''fs''

    owl2 = fs.readFileSync ''OWL2.txt'', ''utf8''

    ```


    `readFileSync` simply reads the contents of a file into a string. The `Sync` suffix
    means that, unlike most Node.js I/O functions, this one blocks our program’s execution
    until it completes. If we had some work to do in the background while the file
    is being read, then we’d use `readFile` with a callback instead, allowing us to
    continue processing while the operating system loads the file in the background.


    Each line of our dictionary contains a word along with its definition and sentence
    part, such as this:


    ```

    OD a hypothetical force of natural power [n -S]

    ```


    As fascinating as this additional information is, we won’t be using it. So let’s
    use a simple regex to extract just the first word from each line:


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

    wordList = owl2.match /^(\w+)/mg

    ```


    Then we cut the word list down to just those words that could plausibly fit on
    the grid:


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

    wordList = (word for word in wordList when word.length <= GRID_SIZE)

    ```


    where `GRID_SIZE` is a constant that we’ve set to 5. (Of course, we could have
    done this more efficiently by tweaking our regex to only capture short words.)


    Now we’ll define a function to check whether a given word is valid:


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

    isWord = (str) ->

    str in wordList

    ```


    Simple, right? Recall that `x in arr` just tells us whether the value `x` is in
    the array `arr`. (This differs from JavaScript’s `in`, whose CoffeeScript analog
    is `of`.)


    Generating a random grid will be a little bit trickier. First we’ll need a way
    of generating random letters with the right probability distribution:


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

    # Probabilities are taken from Scrabble, except that there are no blanks.

    # See http://www.hasbro.com/scrabble/en_US/faqGeneral.cfm

    tileCounts =

    A: 9, B: 2, C: 2, D: 4, E: 12, F: 2, G: 3, H: 2, I: 9, J: 1, K: 1, L: 4

    M: 2, N: 6, O: 8, P: 2, Q: 1, R: 6, S: 4, T: 6, U: 4, V: 2, W: 2, X: 1

    Y: 2, Z: 1

    totalTiles = 0

    totalTiles += count for letter, count of tileCounts


    # JavaScript hashes are unordered, so we need to make our own key array:

    alphabet = (letter for letter of tileCounts).sort()


    randomLetter = ->

    randomNumber = Math.ceil Math.random() * totalTiles

    x = 1

    for letter in alphabet

    x += tileCounts[letter]

    return letter if x > randomNumber

    ```


    And now we generate the grid using a nested array comprehension:


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

    # grid is a 2D array: grid[col][row], where 0, 0 is the upper-left corner

    grid = for x in [0...GRID_SIZE]

    for y in [0...GRID_SIZE]

    randomLetter()

    ```


    We’ll also want to pretty-print the grid (this is a word game, not Zork):


    ```

    [Collections/5x5/game.coffee](http://media.pragprog.com/titles/tbcoffee/code/Collections/5x5/game.coffee)

