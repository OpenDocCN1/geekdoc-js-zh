    6.  `what.x` 和 `@x` 当然等价当且仅当 `what` 是 `this`。同样，`what.x` 和 `@x` 完全有可能指向同一个对象，但\
    \ `what.x = y` 不会覆盖 `@x`，除非 `what` 是 `this`。\n\n"
