  trans: "\n回想一下我们在第 2.2 节 ​*作用域：你在哪里看到它们*​ 中学到的内容：只有函数会创建作用域。期望循环创建作用域会导致原本温和的程序员在处理异步回调时引发可怕的\
    \ bug。事实上，这可能是异步代码中最常见的困惑来源。\n\n例如，假设我们有一个应用程序，它从某个（同步）源加载数字，并持续累加这些数字，直到总和达到或超过\
    \ `limit`。每次加载一个数字时，都需要保存该数字以及当前的总和。此外，由于过于严格的安全要求，每次保存都需要使用该数字独有的密钥进行加密。该密钥必须通过\
    \ `getEncryptionKey` 函数异步获取。\n\n第一次尝试可能如下所示：\n\n```\nsum = 0\nwhile sum < limit\n\
    \  sum += x = nextNum()\n  getEncryptionKey (key) ->\n    saveEncrypted key, x,\
    \ sum # FAIL!\n```\n\n这里的问题是，当 `getEncryptionKey` 回调被调用时，`x` 和 `sum` 已经发生了变化——实际上，整个循环已经运行完毕。因此，对于循环中经过的每个\
    \ `x`，保存的将是循环结束后 `x` 和 `sum` 的值（很可能使用了错误的加密密钥）。\n\n解决方案是捕获 `x` 和 `sum` 的值。最简单的方法是使用匿名函数。CoffeeScript\
    \ 添加了 `do` 关键字正是为了这个目的：\n\n```\nsum = 0\nwhile sum < limit\n  sum += x = nextNum()\n\
    \  do (x, sum) ->\n    getEncryptionKey (key) ->\n      saveEncrypted key, x,\
    \ sum # Success!\n```\n\n如果你熟悉 Lisp，这种 `do` 的用法应该会让你想起 `let` 关键字。`do (x, sum)\
    \ -> ...` 是 `((x, sum) -> ...)(x, sum)` 的简写。因此，现在 `saveEncrypted key, x, sum`\
    \ 这一行引用的是由 `do` 创建的 `x` 和 `sum` 的副本，而不是循环所使用的 `x` 和 `sum`。\n\n请注意，这种形式会遮蔽外部的 `x`\
    \ 和 `sum`，使它们无法访问。如果你希望在捕获它们值的同时仍然能够访问原始变量，那么可以这样写：\n\n```\ndo ->\n  capturedX\
    \ = x; capturedSum = sum\n  ...\n```\n\n现在，是时候开始我们自己的一个小项目了：为 jQuery 版本的 5x5 游戏添加一个基于\
    \ Node 的后端。\n\n## 6.4 项目：多人 5x5\n\n我们将构建一个 Web 服务器，让玩家可以在 5x5 游戏中相互对战。在客户端，我们将使用与上一章基本相同的\
    \ HTML 和 CSS；我们的服务器将提供所有这些静态文件（当然还有一些 CoffeeScript），并处理游戏状态。\n\n有多种方法可以处理客户端与服务器的协调问题。我们希望在客户端放置多少逻辑，在服务器上放置多少逻辑？许多框架（例如\
    \ Backbone.js）的存在就是为了从概念上简化这个问题。[[47]](#f_0059.html_FOOTNOTE-47) 通常，我们希望将一些逻辑放在客户端（为了性能），一些逻辑放在服务器端（为了安全），两者可能有所重叠。但出于我们的目的，我们将倾向于采用“哑客户端”方法，将所有逻辑放在服务器端。这意味着当玩家\
    \ A 执行一步操作时，会发生以下情况：\n\n1.  玩家 A 的客户端将操作（即交换的方块坐标）发送给服务器。\n2.  如果操作有效，服务器将操作结果发送给两个客户端。\n\
    3.  两个客户端显示结果。\n\n很简单，对吧？这种方法使客户端库非常轻量，因为 `Dictionary`、`Grid` 和 `Player` 类只需要存在于服务器端（更不用说\
    \ 2.1 MB 的有效单词列表了！）。缺点是玩家在看到自己操作的结果之前会有一些延迟。在实际应用中，我们需要更多地考虑优化响应速度。（例如，Google\
    \ Docs 会将你输入的每个单词同步到服务器，但想象一下，如果直到服务器确认后你才能在屏幕上看到这些字母，那该有多令人沮丧！）\n\n我们将处理两个文件：`5x5client.coffee`\
    \ 和 `5x5server.coffee`。让我们从服务器开始。\n\n### 5x5server.coffee\n\n我们将基于流行的 Connect\
    \ 框架构建服务器。[[48]](#f_0059.html_FOOTNOTE-48) Connect 扩展了 Node 自身的 `net` 模块，并被更强大的框架（如\
    \ Express 和 Zappa）进一步扩展。对于更复杂的应用程序，你绝对应该看看这些其他框架，它们增加了诸如用于定义 URL 路由的 DSL 等便利功能。然而，对于我们的单页应用，Connect\
    \ 就足够了。让我们安装它：\n\n```\n$ npm install connect\n```\n\n（请确保从项目目录运行该命令，或者通过添加 `-g`\
    \ 标志进行全局安装。）\n\n现在，让我们通过创建一个 Connect 服务器实例来开始我们的服务器代码：\n\n[Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nconnect = require 'connect'\n\napp = connect.createServer(\n  connect.compiler(src:\
    \ __dirname + '/client', enable: ['coffeescript']),\n  connect.static(__dirname\
    \ + '/client'),\n  connect.errorHandler dumpExceptions: true, showStack: true\n\
    )\n\nport = 3000\napp.listen port\nconsole.log \"Browse to http://localhost:#{port}\
    \ to play\"\n\nio = require 'socket.io'\nsocket = io.listen app\nsocket.on 'connection',\
    \ (client) ->\n  if assignToGame client\n    client.on 'message', (message) ->\
    \ handleMessage client, message\n    client.on 'disconnect', -> removeFromGame\
    \ client\n  else\n    client.send 'full'\n\nassignToGame = (client) ->\n  idClientMap[client.sessionId]\
    \ = client\n  return false if game.isFull()\n  game.addPlayer client.sessionId\n\
    \  if game.isFull() then welcomePlayers()\n  true\n\nremoveFromGame = (client)\
    \ ->\n  delete idClientMap[client.sessionId]\n  game.removePlayer client.sessionId\n\
    \nwelcomePlayers = ->\n  players = [game.player1, game.player2]\n  info = {players,\
    \ tiles: game.grid.tiles, currPlayerNum: game.currPlayer.num}\n  for player in\
    \ players\n    playerInfo = extend {}, info, {yourNum: player.num}\n    idClientMap[player.id].send\
    \ \"welcome:#{JSON.stringify playerInfo}\"\n\nhandleMessage = (client, message)\
    \ ->\n  {type, content} = typeAndContent message\n  if type is 'move'\n    return\
    \ unless client.sessionId is game.currPlayer.id # no cheating!\n    swapCoordinates\
    \ = JSON.parse content\n    {moveScore, newWords} = game.currPlayer.makeMove swapCoordinates\n\
    \    result = {swapCoordinates, moveScore, newWords, player: game.currPlayer}\n\
    \    socket.broadcast \"moveResult:#{JSON.stringify result}\"\n    game.endTurn()\n\
    \ntypeAndContent = (message) ->\n  [ignore, type, content] = message.match /(.*?):(.*)/\n\
    \  {type, content}\n\nextend = (a, others...) ->\n  for o in others\n    a[key]\
    \ = val for key, val of o\n  a\n```\n\n"
- fmt: "\nWhile we could use `Connect` in conjunction with Apache or nginx, it’s perfectly\
    \ capable of serving our static files (in the `client` subdirectory) on its own.\
    \ We just have to ask it to do so in its `configure` block. We’ll also throw in\
    \ an error handler while we’re at it; otherwise, exceptions would just be silently\
    \ swallowed:\n\n[Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\napp = connect.createServer(\n  connect.compiler(src: __dirname + '/client',\
    \ enable: ['coffeescript']),\n  connect.static(__dirname + '/client'),\n  connect.errorHandler\
    \ dumpExceptions: true, showStack: true\n)\n```\n\nWe only need to do one more\
    \ thing in order to start our server: tell it which port to run on, via the `listen`\
    \ function. The choice of port is largely arbitrary; in production, we’d most\
    \ likely want to use port 80 (the standard for HTTP), but to avoid potential conflicts,\
    \ let’s use 3000:\n\n[Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nport = 3000\napp.listen port\nconsole.log \"Browse to http://localhost:#{port}\
    \ to play\"\n```\n\nIf we just run what we’ve got and head to `http://localhost:3000/`\
    \ in our browser, we’ll be automatically served `index.html`. Now we just need\
    \ to add the means to talk to our client code. But how? When one player performs\
    \ an action, both players need to be informed of the results. Ajax is ill-suited\
    \ to that sort of thing; what we need is a way to broadcast data from the server\
    \ to several clients at once, at any time.\n\nFortunately, a new technology called\
    \ WebSocket provides exactly that. A Node library called Socket.IO makes this\
    \ a breeze; plus, it automatically falls back on other protocols in browsers that\
    \ don’t yet have WebSocket support.\n\nWe’ll install Socket.io in trusty npm fashion:\n\
    \n```\n$ npm install socket.io\n```\n\nAnd now we’ll use it on the server:\n\n\
    [Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nio = require 'socket.io'\nsocket = io.listen app\nsocket.on 'connection',\
    \ (client) ->\n  if assignToGame client\n    client.on 'message', (message) ->\
    \ handleMessage client, message\n    client.on 'disconnect', -> removeFromGame\
    \ client\n  else\n    client.send 'full'\n```\n\nNow each time a browser connects\
    \ to the server, we get a new Socket.io `client` instance. We implement two callbacks:\
    \ one for when the client sends a message (that is, a move) and another for when\
    \ they disconnect. We also assign the client to a game immediately.\n\nFor simplicity,\
    \ this server implementation only hosts one game at a time, but the game state\
    \ has been encapsulated by a `Game` class, so it should be simple to extend the\
    \ project to a multigame server. That gives us just two variables with module\
    \ scope (other than the functions, of course): the game itself and a map from\
    \ IDs to clients.\n\n[Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\ngame = new Game\nidClientMap = {}\n```\n\nEach `Player` instance now has\
    \ an `id` attribute, so when we need to send a message to a particular player,\
    \ we use `idClientMap` to get their `client` object. Here’s how we add a new client\
    \ to the game:\n\n[Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nassignToGame = (client) ->\n  idClientMap[client.sessionId] = client\n\
    \  return false if game.isFull()\n  game.addPlayer client.sessionId\n  if game.isFull()\
    \ then welcomePlayers()\n  true\n```\n\nOnce the game has two players, we send\
    \ each of them a welcome message with the list of tiles and, in case someone arrives\
    \ midgame, the scores:\n\n[Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nwelcomePlayers = ->\n  players = [game.player1, game.player2]\n  info =\
    \ {players, tiles: game.grid.tiles, currPlayerNum: game.currPlayer.num}\n  for\
    \ player in players\n    playerInfo = extend {}, info, {yourNum: player.num}\n\
    \    idClientMap[player.id].send \"welcome:#{JSON.stringify playerInfo}\"\n```\n\
    \nNotice that `extend` in there? That’s a small utility for adding the properties\
    \ of one object to another. It’s equivalent to `_.extend` from Underscore.js:\n\
    \n[Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nextend = (a, others...) ->\n  for o in others\n    a[key] = val for key,\
    \ val of o\n  a\n```\n\nThe only thing that’s left is to handle player moves:\n\
    \n[Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nhandleMessage = (client, message) ->\n  {type, content} = typeAndContent\
    \ message\n  if type is 'move'\n    return unless client.sessionId is game.currPlayer.id\
    \ # no cheating!\n    swapCoordinates = JSON.parse content\n    {moveScore, newWords}\
    \ = game.currPlayer.makeMove swapCoordinates\n    result = {swapCoordinates, moveScore,\
    \ newWords, player: game.currPlayer}\n    socket.broadcast \"moveResult:#{JSON.stringify\
    \ result}\"\n    game.endTurn()\n```\n\nNotice that we use the client’s unique\
    \ session ID (provided by Socket.io) as a simple security check to prevent one\
    \ player from making the other player’s move. After we’ve calculated the results\
    \ of the move, we use `socket.broadcast`, a handy shorthand when we want to send\
    \ the same message to every connected client.\n\n### 5x5client.coffee\n\nSo how\
    \ do we interact with Socket.io from the client? Well, handily, Socket.io provides\
    \ us with a client library. We just have to include it:\n\n[Nodejs/5x5/client/index.html](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/client/index.html)\n\
    \n```\n<script type=\"text/javascript\" src=\"/socket.io/socket.io.js\"></script>\n\
    ```\n\nIf you’re exceptionally nosy, you might have noticed that there is no file\
    \ called `socket.io.js` in our static directory. And yet, if you request it from\
    \ the server, it’s there!\n\nIt turns out that the server-side Socket.io library\
    \ automagically serves its own client library. Of course, in production you’d\
    \ want to minify and concatenate that script along with all your other scripts,\
    \ but for development, the feature is very handy. If you update to a new version\
    \ of Socket.io on the server side, then you won’t have to worry about serving\
    \ the new client library—it’s taken care of for you.\n\nSo, how do we actually\
    \ use it? Well, it’s actually quite similar to what we wrote for the server:\n\
    \n[Nodejs/5x5/client/5x5client.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/client/5x5client.coffee)\n\
    \n```\n$(document).ready ->\n  $('#grid li').live 'click', tileClick\n  socket\
    \ = new io.Socket()\n  socket.connect()\n  socket.on 'connect', -> showMessage\
    \ 'waitForConnection'\n  socket.on 'message', handleMessage\n```\n\nWe need to\
    \ handle two types of messages: the initial welcome and the result of a move:\n\
    \n[Nodejs/5x5/client/5x5client.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/client/5x5client.coffee)\n\
    \n```\nhandleMessage = (message) ->\n  {type, content} = typeAndContent message\n\
    \  switch type\n    when 'welcome'\n      {players, currPlayerNum, tiles, yourNum:\
    \ myNum} = JSON.parse content\n      startGame players, currPlayerNum\n```\n"
  raw: 'While we could use Connect in conjunction with Apache or nginx, it’s perfectly
    capable of serving our static files (in the `client` subdirectory) on its own.
    We just have to ask it to do so in its `configure` block. We’ll also throw in
    an error handler while we’re at it; otherwise, exceptions would just be silently
    swallowed:


    | [Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)
    |


    |   | `app = connect.createServer(` |


    |   | `connect.compiler(src: __dirname +` *`''/client''`*`, enable: [`*`''coffeescript''`*`]),`
    |


    |   | `connect.static(__dirname +` *`''/client''`*`),` |


    |   | `connect.errorHandler dumpExceptions:` **`true`**`, showStack:` **`true`**
    |


    |   | `)` |


    We only need to do one more thing in order to start our server: tell it which
    port to run on, via the `listen` function. The choice of port is largely arbitrary;
    in production, we’d most likely want to use port 80 (the standard for HTTP), but
    to avoid potential conflicts, let’s use 3000:


    | [Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)
    |


    |   | `port = 3000` |


    |   | `app.listen port` |


    |   | `console.log` *`"Browse to http://localhost:`*`#{port}` *`to play"`* |


    If we just run what we’ve got and head to `http://localhost:3000/` in our browser,
    we’ll be automatically served `index.html`. Now we just need to add the means
    to talk to our client code. But how? When one player performs an action, both
    players need to be informed of the results. Ajax is ill-suited to that sort of
    thing; what we need is a way to broadcast data from the server to several clients
    at once, at any time.


    Fortunately, a new technology called WebSocket provides exactly that. A Node library
    called Socket.IO makes this a breeze; plus, it automatically falls back on other
    protocols in browsers that don’t yet have WebSocket support.


    We’ll install Socket.io in trusty npm fashion:


    |   | `$` **`npm install socket.io`** |


    And now we’ll use it on the server:


    | [Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)
    |


    |   | `io = require` *`''socket.io''`* |


    |   | `socket = io.listen app` |


    |   | `socket.on` *`''connection''`*`, (client)` **`->`** |


    |   | **`if`** `assignToGame client` |


    |   | `client.on` *`''message''`*`, (message)` **`->`** `handleMessage client,
    message` |


    |   | `client.on` *`''disconnect''`*`,` **`->`** `removeFromGame client` |


    |   | **`else`** |


    |   | `client.send` *`''full''`* |


    Now each time a browser connects to the server, we get a new Socket.io `client`
    instance. We implement two callbacks: one for when the client sends a message
    (that is, a move) and another for when they disconnect. We also assign the client
    to a game immediately.


    For simplicity, this server implementation only hosts one game at a time, but
    the game state has been encapsulated by a `Game` class, so it should be simple
    to extend the project to a multigame server. That gives us just two variables
    with module scope (other than the functions, of course): the game itself and a
    map from IDs to clients.


    | [Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)
    |


    |   | `game =` **`new`** `Game` |


    |   | `idClientMap = {}` |


    Each `Player` instance now has an `id` attribute, so when we need to send a message
    to a particular player, we use `idClientMap` to get their `client` object. Here’s
    how we add a new client to the game:


    | [Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)
    |


    |   | `assignToGame = (client)` **`->`** |


    |   | `idClientMap[client.sessionId] = client` |


    |   | **`return`****`false`****`if`** `game.isFull()` |


    |   | `game.addPlayer client.sessionId` |


    |   | **`if`** `game.isFull()` **`then`** `welcomePlayers()` |


    |   | **`true`** |


    Once the game has two players, we send each of them a welcome message with the
    list of tiles and, in case someone arrives midgame, the scores:


    | [Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)
    |


    |   | `welcomePlayers =` **`->`** |


    |   | `players = [game.player1, game.player2]` |


    |   | `info = {players, tiles: game.grid.tiles, currPlayerNum: game.currPlayer.num}`
    |


    |   | **`for`** `player` **`in`** `players` |


    |   | `playerInfo = extend {}, info, {yourNum: player.num}` |


    |   | `idClientMap[player.id].send` *`"welcome:`*`#{JSON.stringify playerInfo}`*`"`*
    |


    Notice that `extend` in there? That’s a small utility for adding the properties
    of one object to another. It’s equivalent to `_.extend` from Underscore.js:


    | [Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)
    |


    |   | `extend = (a, others...)` **`->`** |


    |   | **`for`** `o` **`in`** `others` |


    |   | `a[key] = val` **`for`** `key, val` **`of`** `o` |


    |   | `a` |


    The only thing that’s left is to handle player moves:


    | [Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)
    |


    |   | `handleMessage = (client, message)` **`->`** |


    |   | `{type, content} = typeAndContent message` |


    |   | **`if`** `type is` *`''move''`* |


    |   | **`return`****`unless`** `client.sessionId is game.currPlayer.id` *`# no
    cheating!`* |


    |   | `swapCoordinates = JSON.parse content` |


    |   | `{moveScore, newWords} = game.currPlayer.makeMove swapCoordinates` |


    |   | `result = {swapCoordinates, moveScore, newWords, player: game.currPlayer}`
    |


    |   | `socket.broadcast` *`"moveResult:`*`#{JSON.stringify result}`*`"`* |


    |   | `game.endTurn()` |


    Notice that we use the client’s unique session ID (provided by Socket.io) as a
    simple security check to prevent one player from making the other player’s move.
    After we’ve calculated the results of the move, we use `socket.broadcast`, a handy
    shorthand when we want to send the same message to every connected client.


    ### 5x5client.coffee


    So how do we interact with Socket.io from the client? Well, handily, Socket.io
    provides us with a client library. We just have to include it:


    | [Nodejs/5x5/client/index.html](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/client/index.html)
    |


    |   | **`<script`** `type=`*`"text/javascript"`* `src=`*`"/socket.io/socket.io.js"`***`>`****`</script>`**
    |


    If you’re exceptionally nosy, you might have noticed that there is no file called
    `socket.io.js` in our static directory. And yet, if you request it from the server,
    it’s there!


    It turns out that the server-side Socket.io library automagically serves its own
    client library. Of course, in production you’d want to minify and concatenate
    that script along with all your other scripts, but for development, the feature
    is very handy. If you update to a new version of Socket.io on the server side,
    then you won’t have to worry about serving the new client library—it’s taken care
    of for you.


    So, how do we actually use it? Well, it’s actually quite similar to what we wrote
    for the server:


    | [Nodejs/5x5/client/5x5client.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/client/5x5client.coffee)
    |


    |   | `$(document).ready` **`->`** |


    |   | `$(`*`''#grid li''`*`).live` *`''click''`*`, tileClick` |


    |   | `socket =` **`new`** `io.Socket()` |


    |   | `socket.connect()` |


    |   | `socket.on` *`''connect''`*`,` **`->`** `showMessage` *`''waitForConnection''`*
    |


    |   | `socket.on` *`''message''`*`, handleMessage` |


    We need to handle two types of messages: the initial welcome and the result of
    a move:


    | [Nodejs/5x5/client/5x5client.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/client/5x5client.coffee)
    |


    |   | `handleMessage = (message)` **`->`** |


    |   | `{type, content} = typeAndContent message` |


    |   | **`switch`** `type` |


    |   | **`when`***`''welcome''`* |


    |   | `{players, currPlayerNum, tiles, yourNum: myNum} = JSON.parse content` |


    |   | `startGame players, currPlayerNum` |'
