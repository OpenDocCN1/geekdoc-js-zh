  trans: "\nCoffeeScript 的一大优点在于，我们可以在所有这些环境中复用其代码。无论我们是在浏览器中还是在服务器上运行游戏，用于计算走棋得分的代码都将保持不变。这种客户端与服务器的融合具有各种实际用途——例如表单验证。而且，通过深入理解对象和循环，你已经在掌握这门语言的道路上迈出了坚实的一步。\n\
    \n## 3.8 超越基础\n\n完成以下练习后，你就可以自称是黄带 CoffeeScripter 了。如何达到黑带？模块，小菜鸟。虽然 CoffeeScript\
    \ 让我们能用少量代码表达丰富的内容，但有些程序需要大量代码。最好使用许多小文件，每个文件都有明确的目的，而不是使用几个大文件，让读者感觉像迷宫里的老鼠。\n\
    \n## 3.9 练习\n\n1.  通常使用 `slice` 来复制整个数组：\n\n    ```\n    coffee> original = ['Mary',\
    \ 'Poppins']\n    coffee> copy = original[0..]\n    coffee> copy[0] = 'Sh' + copy[0][1..]\n\
    \    coffee> copy[1] = 'B' + copy[1][1..]\n    coffee> original.join ' '\n   \
    \ Mary Poppins\n    coffee> copy.join ' '\n    Shary Boppins\n    ```\n\n    解释\
    \ `copy = original[0..]` 与 `copy = original` 有何不同。\n\n2.  以下代码展示了 CoffeeScript\
    \ 的 `for...in` 循环与 JavaScript 中 C 风格 `for` 循环的一个细微差别。解释为什么这段代码会产生以下结果：\n\n   \
    \ ```\n    once = ->\n      if once.hasRun\n        null\n      else\n       \
    \ once.hasRun = true\n        [1, 2, 3]\n\n    console.log x for x in once()\n\
    \    1\n    2\n    3\n    ```\n\n3.  这段代码的输出是什么？\n\n    ```\n    for x in [1,\
    \ 2]\n      setTimeout (-> console.log x), 50\n    ```\n\n    附加题：超时时间设为 `0` 是否有影响？\n\
    \n    有关说明，请参见 *循环中的作用域*。\n\n4.  回想一下，`'foo' in arr` 会告诉你数组 `arr` 是否包含字符串 `'foo'`，而\
    \ `'bar' of obj` 会告诉你 `obj.bar` 是否存在。但如何检查任意对象是否包含给定的值？从以下代码开始：\n\n    ```\n \
    \   objContains = (obj, val) ->\n    ```\n\n5.  假设我们需要至少运行一次函数，然后重复运行直到满足条件。在\
    \ C/Java/JavaScript 中，我们可以这样写：\n\n    ```\n    do {\n      user.harangue()\n \
    \   } while (!user.paidInFull)\n    ```\n\n    CoffeeScript 的直接等价写法如下：\n\n   \
    \ ```\n    user.harangue()\n    user.harangue() until user.paidInFull\n    ```\n\
    \n    但这违反了 DRY（不要重复自己）的神圣原则。定义一个 `doAndRepeatUntil` 函数，它接受两个函数（分别对应循环体和条件），这样我们就可以这样写：\n\
    \n    ```\n    doAndRepeatUntil user.harangue, -> user.paidInFull\n    ```\n\n\
    6.  在本章的项目中，我们将 `MIN_WORD_LENGTH` 设置为常量。然而，从模块化的角度来看，根据加载到游戏中的字典来推导这个值更有意义。如何使用\
    \ `Math.min.apply` 和列表推导式在一行代码中实现这一点？（`Math.min` 返回参数中最小值，例如 `Math.min 15, 16,\
    \ 23, 42, 5, 8` 的结果是 `5`。）\n\n#### 脚注\n\n- [[29]](#f_0029.html_FNPTR-29) [`developer.mozilla.org/en/JavaScript/Reference/Global_Objects/Array`](http://developer.mozilla.org/en/JavaScript/Reference/Global_Objects/Array)\n\
    - [[30]](#f_0032.html_FNPTR-30) [`documentcloud.github.com/underscore/`](http://documentcloud.github.com/underscore/)\n\
    - [[31]](#f_0034.html_FNPTR-31) 来自 [`www.zyzzyva.net/wordlists.shtml`](http://www.zyzzyva.net/wordlists.shtml)\n\
    \n版权所有 © 2011，The Pragmatic Bookshelf。\n\n# 第 4 章\n\n模块与类\n\n在前面的章节中，我们学习了如何用\
    \ CoffeeScript 的动词和名词组成句子。但句子串并不总能构成优雅的程序。我们需要的是更高层次的抽象。特别是，我们需要一种清晰的方式来描述对象类型。\n\
    \n在像 C++ 这样的经典面向对象语言中，对象和类之间有明显的区别：对象是类的实例，继承其方法但存储自己的数据。许多动态语言（如 Ruby）通过允许在运行时修改对象的方法来模糊这种区别。JavaScript\
    \ 则完全消除了这种区别：没有类。只有原型，这使得对象可以轻松共享方法。因此，JavaScript 有时被描述为一种基于原型的语言。\n\n这种动态共享方法的方式功能强大，但清晰度上有所牺牲。如果你在严格基于类的语言中阅读代码，并且想找出某个特定对象支持哪些方法，你只需查看定义该对象类的代码。但如果你想知道一个\
    \ JavaScript 对象有哪些方法（在不运行代码的情况下），你必须追踪该对象或其原型在应用程序中所有可能的引用。\n\n多年来，出现了几种将 JavaScript\
    \ 代码组织成类似类结构的方法。随着时间的推移，一种标准模式逐渐形成。该模式为 CoffeeScript 的 `class` 关键字提供了基础。在本章中，我们将学习\
    \ CoffeeScript 类的工作原理，然后使用它们来模块化我们的 5x5 游戏代码。\n\n但在深入 CoffeeScript 类的工作原理之前，我们需要先讨论一下模块在\
    \ CoffeeScript 中如何交互。\n\n## 4.1 模块：拆分应用\n\n在浏览器环境中，JavaScript 不关心文件。无论你有多少个文件，它们都只是一堆代码行。因此，如果应用中的两个文件恰好声明了同名的全局作用域变量，那么它们就只能互相冲突了。让最好的代码胜出。\n\
    \n对于复杂的 JavaScript 应用来说，这是一个巨大的问题。如果一个团队正在拆分项目，他们如何确保不会覆盖彼此的变量？你如何确保引入的开源代码不会与自己的代码冲突？\n\
    \n解决方案是命名空间。在 JavaScript（以及 CoffeeScript）中，每个函数都有自己的命名空间。在函数中声明的变量在函数外部永远不可见。因此，一种常见的\
    \ JavaScript 约定是将每个文件包装在一个立即执行的函数中，从而使其成为一个模块。像 Node.js 这样的服务器端环境实现了 CommonJS\
    \ 规范，总是将每个文件视为单独的模块。\n\n正如在 *JavaScript 的包装* 中提到的，CoffeeScript 编译器会将每个 `coffee`\
    \ 文件包装在一个匿名函数中，除非使用 `--bare` 标志调用。CoffeeScript 还防止你意外声明全局变量，而在 JavaScript 中，忘记\
    \ `var` 关键字很容易导致这种情况。那么问题来了，如何在模块之间共享数据？\n\n答案是将其附加到现有的全局变量上。一种选择是使用根对象，这是唯一一个无需限定即可引用其属性的对象。在浏览器环境中，根对象是\
    \ `window`。在 Node 中，它是 `global`。\n\n事实上，你习惯处理的所有全局变量实际上都是根对象的属性。例如，`parseInt`\
    \ 实际上是 `window.parseInt`/`global.parseInt`，而 `Math` 是 `window.Math`/`global.Math`。甚至定义内置类型的对象（如\
    \ `String`）实际上也是 `window.String`/`global.String`。\n"
- fmt: "\nIn JavaScript, attaching variables to the root object is easy—in fact, it’s\
    \ commonly done by mistake when the `var` keyword is omitted. In CoffeeScript,\
    \ on the other hand, you need to be explicit:\n\n```\nroot = global ? window\n\
    \n# file1.coffee\nroot.emergencyNumber = 911\n\n# file2.coffee\nconsole.log emergencyNumber\
    \ # '911'\nemergencyNumber is root.emergencyNumber # true\n```\n\nThe first line\
    \ defines `root` to be `global` if it exists, and `window` otherwise, ensuring\
    \ compatibility with both Node and browser environments.\n\n## Caution: Globals\
    \ and Implicit Declarations\n\nWhile you can get globals without referencing the\
    \ root object, you can’t set them that way. This is an easy mistake to make:\n\
    \n```\nroot = global ? window\n\n# file1.coffee\nroot.dogName = 'Fido'\ndogName\
    \ is root.dogName # true\n\n# file2.coffee\nconsole.log dogName # undefined\n\
    dogName = 'Bingo'\ndogName is root.dogName # false\n```\n\nWhy is `dogName` undefined\
    \ at the start of the second module? Because a variable with the same name is\
    \ assigned later on. CoffeeScript interprets that as a new variable declaration,\
    \ and all variable declarations in CoffeeScript are automatically moved to the\
    \ top of the scope.\n\nSo remember: always, always, always use the root object\
    \ when setting a global variable! Statements of the form `x = y` will never change\
    \ the value of `x` in other modules.\n\nNode has another special object called\
    \ `exports`. Usually, you’ll want to use that instead of `global` (more on that\
    \ in Section 6.2, [*Modularizing Code with ’exports’ and ’require’*](#f_0055.html_sec.nodeExports)).\
    \ I used `global ? window` in the example above rather than `exports ? window`\
    \ so that the code looks the same in every environment; an alternative would be\
    \ to use a library, like RequireJS, that allows you to modularize code the same\
    \ way in every environment without using objects like `global` and `window` that\
    \ are available everywhere by default.[[32]](#f_0044.html_FOOTNOTE-32)\n\nOf course,\
    \ it’s considered poor practice to put every little thing in the global namespace.\
    \ Instead, it’s much more natural to package variables into cleanly referenced\
    \ objects. Here’s an example:\n\n```\nroot = global ? window\nroot.httpCodes =\n\
    \  movedPermanently: 301\n  pageNotFound: 404\n  serverError: 500\n```\n\nOnce\
    \ this module has run, other modules can reference `httpCodes.pageNotFound`, for\
    \ instance.\n\n## 4.2 The Power of Prototypes\n\nBefore we move on to classes,\
    \ it’s important to understand how prototypes work. If you’re fluent in JavaScript,\
    \ this section will just be a refresher.\n\nA prototype is an object whose properties\
    \ are shared by all objects that have that prototype. An object’s prototype can\
    \ usually be accessed using the aptly-named `prototype` property, though there\
    \ are exceptions.[[33]](#f_0044.html_FOOTNOTE-33)\n\nHowever, you can’t just go\
    \ and write `A.prototype = B`. Instead, you need to use the `new` keyword, which\
    \ takes a function called a constructor and creates an object that “inherits”\
    \ the constructor’s prototype. Here’s a quick example:\n\n```\nBoy = -> # by convention,\
    \ constructor names are capitalized\nBoy::sing = -> console.log \"It ain't easy\
    \ being a boy named Sue\"\nsue = new Boy()\nsue.sing()\n```\n\nHere, `Boy::sing`\
    \ is shorthand for `Boy.prototype.sing`. The `::` symbol is to `prototype` as\
    \ `@` is to `this`.\n\nThe output looks like this:\n\n```\nIt ain't easy being\
    \ a boy named Sue\n```\n\nThis is the result because `sue` inherits the properties\
    \ of `Boy.prototype`. Pretty cool! But how does it work?\n\n### Prototypes, Precedence,\
    \ and 'hasOwnProperty'\n\nWhen an object inherits properties from a prototype,\
    \ changes to the prototype will change the inherited properties as well:\n\n[Classes/Raven.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Raven.coffee)\n\
    \n```\nRaven = ->\nRaven::quoth = -> console.log 'Nevermore'\nraven1 = new Raven()\n\
    raven1.quoth() # Nevermore\n\nRaven::quoth = -> console.log \"I'm hungry\"\nraven1.quoth()\
    \ # I'm hungry\n```\n\nProperties attached directly to objects take precedence\
    \ over prototype properties. So we can remove that ambiguity by writing this:\n\
    \n[Classes/Raven.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Raven.coffee)\n\
    \n```\nraven2 = new Raven()\nraven2.quoth = -> console.log \"I'm my own kind of\
    \ raven\"\nraven1.quoth() # I'm hungry\nraven2.quoth() # I'm my own kind of raven\n\
    ```\n\nTo check whether a property is attached to an object directly or inherited\
    \ from a prototype, use the `hasOwnProperty` function:\n\n[Classes/Raven.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Raven.coffee)\n\
    \n```\nconsole.log raven1.hasOwnProperty('quoth') # false\nconsole.log raven2.hasOwnProperty('quoth')\
    \ # true\n```\n\nWhen we use `new`, several things happen: a new object is created,\
    \ that object is given the prototype from the constructor, and the constructor\
    \ is executed (in the new object’s context). So let’s say we want every new object\
    \ to store its name and announce the existing number of gifts:\n\n```\nGift =\
    \ (@name) ->\n  Gift.count++\n  @day = Gift.count\n  @announce()\n\nGift.count\
    \ = 0\nGift::announce = ->\n  console.log \"On day #{@day} of Christmas I received\
    \ #{@name}\"\n\ngift1 = new Gift('a partridge in a pear tree')\ngift2 = new Gift('two\
    \ turtle doves')\n```\n\nHere’s the output:\n\n```\nOn day 1 of Christmas I received\
    \ a partridge in a pear tree\nOn day 2 of Christmas I received two turtle doves\n\
    ```\n\nEach time the `Gift` constructor runs, it does four things: assigns the\
    \ given name to `@name` (using the argument shorthand), increments the `count`\
    \ property on the `Gift` constructor, copies that value to `@day`, and runs the\
    \ `@announce` function inherited from the prototype. The important thing to notice\
    \ here is that all of the functions on the new object run in the context of the\
    \ object.\n\nThis is all well and good, but it’s a bit messy, isn’t it? Shouldn’t\
    \ there be a clearer way of distinguishing constructor properties (like `Gift.count`)\
    \ from prototype properties (like `Gift::announce`)? And of distinguishing constructors\
    \ from ordinary functions? Well, as a matter of fact, there is.\n\n## 4.3 Classes:\
    \ Functions with Prototypes\n\nCoffeeScript’s class declaration syntax looks just\
    \ like its object declaration syntax. That’s no coincidence; when you’re defining\
    \ a class, you’re defining an object. Specifically, you’re defining a prototype.\
    \ The only class property that isn’t part of the prototype is the `constructor`\
    \ function, if you define one.\n\nLet’s look at an example, illustrating the well-known\
    \ fact that the trouble a tribble makes is directly proportional to the number\
    \ of existing tribbles:\n\n[Classes/Tribble.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Tribble.coffee)\n\
    \n```\nclass Tribble\n  constructor: ->\n    @isAlive = true\n    Tribble.count++\n\
    \n  # Prototype properties\n  breed: -> new Tribble if @isAlive\n  die: ->\n \
    \   Tribble.count-- if @isAlive\n    @isAlive = false\n\n  # Class-level properties\n\
    \  @count: 0\n  @makeTrouble: -> console.log ('Trouble!' for i in [1..@count]).join('\
    \ ')\n```\n\nThere’s a lot of new syntax here. Let’s go through this one piece\
    \ at a time.\n"
  raw: 'In JavaScript, attaching variables to the root object is easy—in fact, it’s
    commonly done by mistake when the `var` keyword is omitted. In CoffeeScript, on
    the other hand, you need to be explicit:


    |   | `root = global ? window` |


    |   |  |


    |   | *`# file1.coffee`* |


    |   | `root.emergencyNumber = 911` |


    |   |  |


    |   | *`# file2.coffee`* |


    |   | `console.log emergencyNumber` *`# ''911''`* |


    |   | `emergencyNumber is root.emergencyNumber` *`# true`* |


    The first line defines `root` to be `global` if it exists, and `window` otherwise,
    ensuring compatibility with both Node and browser environments.


    Caution: Globals and Implicit Declarations


    While you can get globals without referencing the root object, you can’t set them
    that way. This is an easy mistake to make:


    |   | `root = global ? window` |


    |   |  |


    |   | *`# file1.coffee`* |


    |   | `root.dogName =` *`''Fido''`* |


    |   | `dogName is root.dogName` *`# true`* |


    |   |  |


    |   | *`# file2.coffee`* |


    |   | `console.log dogName` *`# undefined`* |


    |   | `dogName =` *`''Bingo''`* |


    |   | `dogName is root.dogName` *`# false`* |


    Why is `dogName` undefined at the start of the second module? Because a variable
    with the same name is assigned later on. CoffeeScript interprets that as a new
    variable declaration, and all variable declarations in CoffeeScript are automatically
    moved to the top of the scope.


    So remember: always, always, always use the root object when setting a global
    variable! Statements of the form `x = y` will never change the value of `x` in
    other modules.


    Node has another special object called `exports`. Usually, you’ll want to use
    that instead of `global` (more on that in Section 6.2, [​*Modularizing Code with
    ’exports’ and ’require’*​](#f_0055.html_sec.nodeExports)). I used `global ? window`
    in the example above rather than `exports ? window` so that the code looks the
    same in every environment; an alternative would be to use a library, like RequireJS,
    that allows you to modularize code the same way in every environment without using
    objects like `global` and `window` that are available everywhere by default.[[32]](#f_0044.html_FOOTNOTE-32)


    Of course, it’s considered poor practice to put every little thing in the global
    namespace. Instead, it’s much more natural to package variables into cleanly referenced
    objects. Here’s an example:


    |   | `root = global ? window` |


    |   | `root.httpCodes =` |


    |   | `movedPermanently: 301` |


    |   | `pageNotFound: 404` |


    |   | `serverError: 500` |


    Once this module has run, other modules can reference `httpCodes.pageNotFound`,
    for instance.


    ## 4.2 The Power of Prototypes


    Before we move on to classes, it’s important to understand how prototypes work.
    If you’re fluent in JavaScript, this section will just be a refresher.


    A prototype is an object whose properties are shared by all objects that have
    that prototype. An object’s prototype can usually be accessed using the aptly-named
    `prototype` property, though there are exceptions.[[33]](#f_0044.html_FOOTNOTE-33)


    However, you can’t just go and write `A.prototype = B`. Instead, you need to use
    the `new` keyword, which takes a function called a constructor and creates an
    object that “inherits” the constructor’s prototype. Here’s a quick example:


    |   | `Boy =` **`->`***`# by convention, constructor names are capitalized`* |


    |   | `Boy::sing =` **`->`** `console.log` *`"It ain''t easy being a boy named
    Sue"`* |


    |   | `sue =` **`new`** `Boy()` |


    |   | `sue.sing()` |


    Here, `Boy::sing` is shorthand for `Boy.prototype.sing`. The `::` symbol is to
    `prototype` as `@` is to `this`.


    The output looks like this:


    |   | `It ain''t easy being a boy named Sue` |


    This is the result because `sue` inherits the properties of `Boy.prototype`. Pretty
    cool! But how does it work?


    Prototypes, Precedence, and ''hasOwnProperty''


    When an object inherits properties from a prototype, changes to the prototype
    will change the inherited properties as well:


    | [Classes/Raven.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Raven.coffee)
    |


    |   | `Raven =` **`->`** |


    |   | `Raven::quoth =` **`->`** `console.log` *`''Nevermore''`* |


    |   | `raven1 =` **`new`** `Raven()` |


    |   | `raven1.quoth()` *`# Nevermore`* |


    |   |  |


    |   | `Raven::quoth =` **`->`** `console.log` *`"I''m hungry"`* |


    |   | `raven1.quoth()` *`# I''m hungry`* |


    Properties attached directly to objects take precedence over prototype properties.
    So we can remove that ambiguity by writing this:


    | [Classes/Raven.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Raven.coffee)
    |


    |   | `raven2 =` **`new`** `Raven()` |


    |   | `raven2.quoth =` **`->`** `console.log` *`"I''m my own kind of raven"`*
    |


    |   | `raven1.quoth()` *`# I''m hungry`* |


    |   | `raven2.quoth()` *`# I''m my own kind of raven`* |


    To check whether a property is attached to an object directly or inherited from
    a prototype, use the `hasOwnProperty` function:


    | [Classes/Raven.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Raven.coffee)
    |


    |   | `console.log raven1.hasOwnProperty(`*`''quoth''`*`)` *`# false`* |


    |   | `console.log raven2.hasOwnProperty(`*`''quoth''`*`)` *`# true`* |


    When we use `new`, several things happen: a new object is created, that object
    is given the prototype from the constructor, and the constructor is executed (in
    the new object’s context). So let’s say we want every new object to store its
    name and announce the existing number of gifts:


    |   | `Gift = (@name)` **`->`** |


    |   | `Gift.count++` |


    |   | `@day = Gift.count` |


    |   | `@announce()` |


    |   |  |


    |   | `Gift.count = 0` |


    |   | `Gift::announce =` **`->`** |


    |   | `console.log` *`"On day`* `#{@day}` *`of Christmas I received`* `#{@name}`*`"`*
    |


    |   |  |


    |   | `gift1 =` **`new`** `Gift(`*`''a partridge in a pear tree''`*`)` |


    |   | `gift2 =` **`new`** `Gift(`*`''two turtle doves''`*`)` |


    Here’s the output:


    |   | `On day 1 of Christmas I received a partridge in a pear tree` |


    |   | `On day 2 of Christmas I received two turtle doves` |


    Each time the `Gift` constructor runs, it does four things: assigns the given
    name to `@name` (using the argument shorthand), increments the `count` property
    on the `Gift` constructor, copies that value to `@day`, and runs the `@announce`
    function inherited from the prototype. The important thing to notice here is that
    all of the functions on the new object run in the context of the object.


    This is all well and good, but it’s a bit messy, isn’t it? Shouldn’t there be
    a clearer way of distinguishing constructor properties (like `Gift.count`) from
    prototype properties (like `Gift::announce`)? And of distinguishing constructors
    from ordinary functions? Well, as a matter of fact, there is.


    ## 4.3 Classes: Functions with Prototypes


    CoffeeScript’s class declaration syntax looks just like its object declaration
    syntax. That’s no coincidence; when you’re defining a class, you’re defining an
    object. Specifically, you’re defining a prototype. The only class property that
    isn’t part of the prototype is the `constructor` function, if you define one.


    Let’s look at an example, illustrating the well-known fact that the trouble a
    tribble makes is directly proportional to the number of existing tribbles:


    | [Classes/Tribble.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Tribble.coffee)
    |


    |   | **`class`** `Tribble` |


    |   | `constructor:` **`->`** |


    |   | `@isAlive =` **`true`** |


    |   | `Tribble.count++` |


    |   |  |


    |   | *`# Prototype properties`* |


    |   | `breed:` **`->`****`new`** `Tribble` **`if`** `@isAlive` |


    |   | `die:` **`->`** |


    |   | `Tribble.count--` **`if`** `@isAlive` |


    |   | `@isAlive =` **`false`** |


    |   |  |


    |   | *`# Class-level properties`* |


    |   | `@count: 0` |


    |   | `@makeTrouble:` **`->`** `console.log (`*`''Trouble!''`***`for`** `i` **`in`**
    `[1..@count]).join(`*`'' ''`*`)` |


    There’s a lot of new syntax here. Let’s go through this one piece at a time.'
  toc: []
  trans: "\n\n在 JavaScript 中，将变量附加到根对象很容易——实际上，当省略 `var` 关键字时，这通常是误操作造成的。而在 CoffeeScript\
    \ 中，你需要显式地这样做：\n\n```\nroot = global ? window\n\n# file1.coffee\nroot.emergencyNumber\
    \ = 911\n\n# file2.coffee\nconsole.log emergencyNumber # '911'\nemergencyNumber\
    \ is root.emergencyNumber # true\n```\n\n第一行定义了 `root`：如果 `global` 存在则取 `global`，否则取\
    \ `window`，从而确保在 Node 和浏览器环境中都能兼容。\n\n## 注意：全局变量与隐式声明\n\n虽然你可以不引用根对象就获取全局变量，但你不能用那种方式设置它们。这是一个容易犯的错误：\n\
    \n```\nroot = global ? window\n\n# file1.coffee\nroot.dogName = 'Fido'\ndogName\
    \ is root.dogName # true\n\n# file2.coffee\nconsole.log dogName # undefined\n\
    dogName = 'Bingo'\ndogName is root.dogName # false\n```\n\n为什么在第二个模块开始时 `dogName`\
    \ 是 `undefined`？因为后面又赋值了一个同名的变量。CoffeeScript 将其解释为一个新的变量声明，而 CoffeeScript 中的所有变量声明都会自动提升到作用域的顶部。\n\
    \n所以请记住：在设置全局变量时，一定要、一定要、一定要使用根对象！形如 `x = y` 的语句永远不会改变其他模块中 `x` 的值。\n\nNode 还有另一个特殊对象叫做\
    \ `exports`。通常，你应该使用它而不是 `global`（更多内容见第 6.2 节 *使用 'exports' 和 'require' 模块化代码*）。我在上面的例子中使用了\
    \ `global ? window` 而不是 `exports ? window`，这样代码在每个环境中看起来都一样；另一种方法是使用像 RequireJS\
    \ 这样的库，它允许你在每个环境中以相同的方式模块化代码，而无需使用像 `global` 和 `window` 这样默认随处可用的对象。[[32]](#f_0044.html_FOOTNOTE-32)\n\
    \n当然，把每件小事都放在全局命名空间中通常被认为是不好的做法。相反，更自然的做法是将变量打包到清晰引用的对象中。下面是一个例子：\n\n```\nroot\
    \ = global ? window\nroot.httpCodes =\n  movedPermanently: 301\n  pageNotFound:\
    \ 404\n  serverError: 500\n```\n\n一旦这个模块运行完毕，其他模块就可以引用 `httpCodes.pageNotFound`\
    \ 了。\n\n## 4.2 原型的力量\n\n在继续讨论类之前，理解原型的工作原理非常重要。如果你精通 JavaScript，本节只是复习一下。\n\n\
    原型是一个对象，它的属性被所有拥有该原型的对象共享。通常可以通过名为 `prototype` 的属性访问对象的原型，尽管也有例外。[[33]](#f_0044.html_FOOTNOTE-33)\n\
    \n然而，你不能直接写 `A.prototype = B`。相反，你需要使用 `new` 关键字，它接受一个称为构造函数的函数，并创建一个“继承”该构造函数原型的对象。下面是一个快速示例：\n\
    \n```\nBoy = -> # 按照惯例，构造函数名称首字母大写\nBoy::sing = -> console.log \"It ain't easy\
    \ being a boy named Sue\"\nsue = new Boy()\nsue.sing()\n```\n\n这里，`Boy::sing`\
    \ 是 `Boy.prototype.sing` 的简写。`::` 符号之于 `prototype`，就像 `@` 之于 `this`。\n\n输出如下：\n\
    \n```\nIt ain't easy being a boy named Sue\n```\n\n这是因为 `sue` 继承了 `Boy.prototype`\
    \ 的属性。很酷吧！但它是如何工作的呢？\n\n### 原型、优先级与 'hasOwnProperty'\n\n当一个对象从原型继承属性时，对原型的更改也会更改继承的属性：\n\
    \n[Classes/Raven.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Raven.coffee)\n\
    \n```\nRaven = ->\nRaven::quoth = -> console.log 'Nevermore'\nraven1 = new Raven()\n\
    raven1.quoth() # Nevermore\n\nRaven::quoth = -> console.log \"I'm hungry\"\nraven1.quoth()\
    \ # I'm hungry\n```\n\n直接附加到对象上的属性优先于原型属性。因此，我们可以通过编写以下代码来消除这种歧义：\n\n[Classes/Raven.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Raven.coffee)\n\
    \n```\nraven2 = new Raven()\nraven2.quoth = -> console.log \"I'm my own kind of\
    \ raven\"\nraven1.quoth() # I'm hungry\nraven2.quoth() # I'm my own kind of raven\n\
    ```\n\n要检查一个属性是直接附加到对象上还是从原型继承而来，请使用 `hasOwnProperty` 函数：\n\n[Classes/Raven.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Raven.coffee)\n\
    \n```\nconsole.log raven1.hasOwnProperty('quoth') # false\nconsole.log raven2.hasOwnProperty('quoth')\
    \ # true\n```\n\n当我们使用 `new` 时，会发生几件事：创建一个新对象，该对象被赋予构造函数的原型，然后执行构造函数（在新对象的上下文中）。因此，假设我们希望每个新对象都存储自己的名字，并宣布现有的礼物数量：\n\
    \n```\nGift = (@name) ->\n  Gift.count++\n  @day = Gift.count\n  @announce()\n\
    \nGift.count = 0\nGift::announce = ->\n  console.log \"On day #{@day} of Christmas\
    \ I received #{@name}\"\n\ngift1 = new Gift('a partridge in a pear tree')\ngift2\
    \ = new Gift('two turtle doves')\n```\n\n输出如下：\n\n```\nOn day 1 of Christmas I\
    \ received a partridge in a pear tree\nOn day 2 of Christmas I received two turtle\
    \ doves\n```\n\n每次运行 `Gift` 构造函数时，它会做四件事：将给定的名称赋值给 `@name`（使用参数简写），递增 `Gift` 构造函数上的\
    \ `count` 属性，将该值复制到 `@day`，并运行从原型继承的 `@announce` 函数。这里需要注意的重要一点是，新对象上的所有函数都在该对象的上下文中运行。\n\
    \n这一切都很好，但有点混乱，不是吗？难道不应该有一种更清晰的方式来区分构造函数属性（如 `Gift.count`）和原型属性（如 `Gift::announce`）吗？以及区分构造函数和普通函数？事实上，确实有。\n\
    \n## 4.3 类：带原型的函数\n\nCoffeeScript 的类声明语法看起来与它的对象声明语法一模一样。这并非巧合；当你定义一个类时，你就是在定义一个对象。具体来说，你是在定义一个原型。唯一不属于原型的类属性是\
    \ `constructor` 函数（如果你定义了一个的话）。\n\n让我们看一个例子，说明一个众所周知的事实：tribble 制造的麻烦与现有 tribble\
    \ 的数量成正比：\n\n[Classes/Tribble.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Tribble.coffee)\n\
    \n```\nclass Tribble\n  constructor: ->\n    @isAlive = true\n    Tribble.count++\n\
    \n  # 原型属性\n  breed: -> new Tribble if @isAlive\n  die: ->\n    Tribble.count--\
    \ if @isAlive\n    @isAlive = false\n\n  # 类级属性\n  @count: 0\n  @makeTrouble:\
    \ -> console.log ('Trouble!' for i in [1..@count]).join(' ')\n```\n\n这里有很多新语法。让我们逐一分析。\n\
    \n"
- fmt: "\nEach time a new tribble is created, `Tribble.count` is increased by one.\
    \ (We can call it `@count` here because the value of `this` in the class body\
    \ is the class itself.) When `Tribble.makeTrouble()` is called, it’ll display\
    \ “Trouble!” `Tribble.count` times.\n\nLet’s test this:\n\n[Classes/Tribble.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Tribble.coffee)\n\
    \n```\ntribble1 = new Tribble\ntribble2 = new Tribble\nTribble.makeTrouble() #\
    \ \"Trouble! Trouble!\"\n```\n\nNotice that `Tribble.count` is referred to as\
    \ `@count` in the `Tribble` class context but not within `Tribble` methods. This\
    \ is a little baffling at first, but remember that there are three objects we’re\
    \ dealing with here: the `Tribble` object itself (which is actually the `constructor`\
    \ function), `Tribble.prototype`, and the `Tribble` instance. By default, `Tribble`\
    \ properties (other than `constructor`) are attached to the prototype. When we\
    \ use the `@` prefix, we’re insisting that we want to attach the property to the\
    \ class object itself.\n\nBecause the functions attached to the prototype are\
    \ invoked in the context of the individual object (as is the constructor), variables\
    \ prefixed with `@` within those functions are references to instance properties.\
    \ This is why we define `@isAlive` in the constructor: we need to attach a separate\
    \ `@isAlive` property to each instance. That lets us do this:\n\n[Classes/Tribble.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Tribble.coffee)\n\
    \n```\ntribble1.die()\nTribble.makeTrouble() # \"Trouble!\"\n```\n\nKilling `tribble1`\
    \ off again would have no effect, thanks to the `if @isAlive` check. And as we\
    \ know, tribbles are born pregnant, so it won’t be long before the species repopulates\
    \ our program:\n\n[Classes/Tribble.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Tribble.coffee)\n\
    \n```\ntribble2.breed().breed().breed()\nTribble.makeTrouble() # \"Trouble! Trouble!\
    \ Trouble! Trouble!\"\n```\n\n## 4.4 Inheritance with ’extends’\n\nSo far, we’ve\
    \ talked about how prototypes make it easy to share functionality across a set\
    \ of objects and how CoffeeScript’s classes provide a useful syntax for bundling\
    \ prototype properties together. And if that were all classes did, they’d be mildly\
    \ useful. But where classes really shine is when we want to use inheritance.\n\
    \nJavaScript supports inheritance through something called “prototype chains.”\
    \ Let’s say that `A`’s prototype, `B`, has its own prototype, `C`. Then we write\
    \ this:\n\n```\na = new A\nconsole.log a.flurb()\n```\n\nFirst, the runtime checks\
    \ to see if the particular `A` instance, `a`, has a property `flurb`; if not,\
    \ it checks `A`’s prototype (`B`); and if that’s still no dice, it checks `B`’s\
    \ prototype (`C`). In short, it’s traversing the prototype chain.\n\nWhat happens\
    \ if `C` has no `flurb`, either? Then the runtime checks the default object prototype\
    \ (that is, the prototype of `{}`). So, every prototype inherits from `{}`’s prototype,\
    \ but there may be other prototypes in between.\n\nAll of this assigning prototypes\
    \ to prototypes to prototypes gets a little messy. That’s where CoffeeScript’s\
    \ `extends` keyword comes in.\n\nLet’s make a declaration:\n\n```\nclass B extends\
    \ A\n```\n\nThen, `B`’s prototype inherits from `A`’s prototype. In addition,\
    \ `A`’s class-level properties are copied over to `B`. So if we left the definition\
    \ of `B` alone, `B` instances would have exactly the same behavior as `A` instances.\
    \ (There is one exception: `B.name` would be `’B’` while `A.name` would be `’A’`—`name`\
    \ is a special property).\n\nNow let’s look at a slightly deeper example:\n\n\
    ```\nclass Pet\n  constructor: -> @isHungry = true\n  eat: -> @isHungry = false\n\
    \nclass Dog extends Pet\n  eat: ->\n    console.log '*crunch, crunch*'\n    super()\n\
    \  fetch: ->\n    console.log 'Yip yip!'\n    @isHungry = true\n```\n\nThe constructor\
    \ from `Pet` is inherited by `Dog`, which means that dogs start out hungry. When\
    \ a dog eats, it makes some noises and then invokes `super()`, which means “call\
    \ the method of the same name on the parent class.” (More precisely, it means\
    \ `Pet::eat.call this`.) Then the dog is no longer hungry.\n\nIf a constructor\
    \ is defined on the child class, then it overrides the constructor from the parent\
    \ class. It can invoke the parent constructor at any time using `super()`. It’s\
    \ usually wise to call `super()` (or, more likely, `super`—see [​*’super’ Isn’t\
    \ ’super()’*​](#f_0041.html_sb.superParens)) at the start of a subclass constructor.\n\
    \n'super' Isn't 'super()'\n\nWhat’s wrong with this code?\n\n```\nclass Appliance\n\
    \  constructor: (warranty) ->\n    warrantyDb.save(this) if warranty\n\nclass\
    \ Toaster extends Appliance\n  constructor: (warranty) ->\n    super()\n```\n\n\
    When we create a new `Toaster`, `super()` will invoke the parent constructor without\
    \ passing along the `warranty` argument, which means that the toaster won’t be\
    \ saved in the warranty database.\n\nWe could fix this by writing `super(warranty)`,\
    \ but there’s a shorthand we can use instead: `super`. With no parentheses or\
    \ arguments, `super` will pass on every one of the current function’s arguments.\
    \ If you’re a Rubyist, this will seem familiar. If not, just think of `super`\
    \ as a greedy, greedy keyword—if you don’t tell it which arguments you want it\
    \ to pass along, it’ll take ’em all.\n\nBelieve it or not, you now know everything\
    \ there is to know about classes. As with everything in CoffeeScript, the syntax\
    \ may be distant from JavaScript, but the translation is straightforward. If you’re\
    \ a fan of classical OOP (object-oriented programming) methodology, this next\
    \ section’s for you.\n\n### Polymorphism and Switching\n\nOne great use of classes\
    \ is polymorphism, which is a fancy object-oriented programming term for “a thing\
    \ can be a lot of different things, but not just any thing.” Here’s a classic\
    \ example:\n\n```\nclass Shape\n  constructor: (@width) ->\n  computeArea: ->\
    \ throw new Error('I am an abstract class!')\n\nclass Square extends Shape\n \
    \ computeArea: -> Math.pow @width, 2\n\nclass Circle extends Shape\n  radius:\
    \ -> @width / 2\n  computeArea: -> Math.PI * Math.pow @radius(), 2\n\nshowArea\
    \ = (shape) ->\n  unless shape instanceof Shape\n    throw new Error('showArea\
    \ requires a Shape instance!')\n  console.log shape.computeArea()\n\nshowArea\
    \ new Square(2) # 4\nshowArea new Circle(2) # pi\n```\n\nNotice that the `showArea`\
    \ function checks that the object passed to it is a `Shape` instance (using the\
    \ `instanceof` keyword). But it doesn’t care what kind of shape it’s been given;\
    \ both `Square` and `Circle` instances will work. While this is a trivial example,\
    \ it’s not hard to imagine a rich geometry library that takes this approach.\n\
    \nIf we didn’t use the `instanceof` check, that would be known as “duck typing”\
    \ (as in, “If it looks like a duck…”). If the target object doesn’t have a `computeArea`\
    \ function, then we’ll get a meaningful error message anyway. Duck typing is great,\
    \ but there are times when you want to be sure that a particular object is what\
    \ you think it is.\n"
  raw: 'Each time a new tribble is created, `Tribble.count` is increased by one. (We
    can call it `@count` here because the value of `this` in the class body is the
    class itself.) When `Tribble.makeTrouble()` is called, it’ll display “Trouble!”
    `Tribble.count` times.


    Let’s test this:


    | [Classes/Tribble.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Tribble.coffee)
    |


    |   | `tribble1 =` **`new`** `Tribble` |


    |   | `tribble2 =` **`new`** `Tribble` |


    |   | `Tribble.makeTrouble()` *`# "Trouble! Trouble!"`* |


    Notice that `Tribble.count` is referred to as `@count` in the `Tribble` class
    context but not within `Tribble` methods. This is a little baffling at first,
    but remember that there are three objects we’re dealing with here: the `Tribble`
    object itself (which is actually the `constructor` function), `Tribble.prototype`,
    and the `Tribble` instance. By default, `Tribble` properties (other than `constructor`)
    are attached to the prototype. When we use the `@` prefix, we’re insisting that
    we want to attach the property to the class object itself.


    Because the functions attached to the prototype are invoked in the context of
    the individual object (as is the constructor), variables prefixed with `@` within
    those functions are references to instance properties. This is why we define `@isAlive`
    in the constructor: we need to attach a separate `@isAlive` property to each instance.
    That lets us do this:


    | [Classes/Tribble.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Tribble.coffee)
    |


    |   | `tribble1.die()` |


    |   | `Tribble.makeTrouble()` *`# "Trouble!"`* |


    Killing `tribble1` off again would have no effect, thanks to the `if @isAlive`
    check. And as we know, tribbles are born pregnant, so it won’t be long before
    the species repopulates our program:


    | [Classes/Tribble.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Tribble.coffee)
    |


    |   | `tribble2.breed().breed().breed()` |


    |   | `Tribble.makeTrouble()` *`# "Trouble! Trouble! Trouble! Trouble!"`* |


    ## 4.4 Inheritance with ’extends’


    So far, we’ve talked about how prototypes make it easy to share functionality
    across a set of objects and how CoffeeScript’s classes provide a useful syntax
    for bundling prototype properties together. And if that were all classes did,
    they’d be mildly useful. But where classes really shine is when we want to use
    inheritance.


    JavaScript supports inheritance through something called “prototype chains.” Let’s
    say that `A`’s prototype, `B`, has its own prototype, `C`. Then we write this:


    |   | `a =` **`new`** `A` |


    |   | `console.log a.flurb()` |


    First, the runtime checks to see if the particular `A` instance, `a`, has a property
    `flurb`; if not, it checks `A`’s prototype (`B`); and if that’s still no dice,
    it checks `B`’s prototype (`C`). In short, it’s traversing the prototype chain.


    What happens if `C` has no `flurb`, either? Then the runtime checks the default
    object prototype (that is, the prototype of `{}`). So, every prototype inherits
    from `{}`’s prototype, but there may be other prototypes in between.


    All of this assigning prototypes to prototypes to prototypes gets a little messy.
    That’s where CoffeeScript’s `extends` keyword comes in.


    Let’s make a declaration:


    |   | **`class`** `B` **`extends`** `A` |


    Then, `B`’s prototype inherits from `A`’s prototype. In addition, `A`’s class-level
    properties are copied over to `B`. So if we left the definition of `B` alone,
    `B` instances would have exactly the same behavior as `A` instances. (There is
    one exception: `B.name` would be `’B’` while `A.name` would be `’A’`—`name` is
    a special property).


    Now let’s look at a slightly deeper example:


    |   | **`class`** `Pet` |


    |   | `constructor:` **`->`** `@isHungry =` **`true`** |


    |   | `eat:` **`->`** `@isHungry =` **`false`** |


    |   |  |


    |   | **`class`** `Dog` **`extends`** `Pet` |


    |   | `eat:` **`->`** |


    |   | `console.log` *`''*crunch, crunch*''`* |


    |   | **`super`**`()` |


    |   | `fetch:` **`->`** |


    |   | `console.log` *`''Yip yip!''`* |


    |   | `@isHungry =` **`true`** |


    The constructor from `Pet` is inherited by `Dog`, which means that dogs start
    out hungry. When a dog eats, it makes some noises and then invokes `super()`,
    which means “call the method of the same name on the parent class.” (More precisely,
    it means `Pet::eat.call this`.) Then the dog is no longer hungry.


    If a constructor is defined on the child class, then it overrides the constructor
    from the parent class. It can invoke the parent constructor at any time using
    `super()`. It’s usually wise to call `super()` (or, more likely, `super`—see [​*’super’
    Isn’t ’super()’*​](#f_0041.html_sb.superParens)) at the start of a subclass constructor.


    ''super'' Isn''t ''super()''


    What’s wrong with this code?


    |   | **`class`** `Appliance` |


    |   | `constructor: (warranty)` **`->`** |


    |   | `warrantyDb.save(`**`this`**`)` **`if`** `warranty` |


    |   |  |


    |   | **`class`** `Toaster` **`extends`** `Appliance` |


    |   | `constructor: (warranty)` **`->`** |


    |   | **`super`**`()` |


    When we create a new `Toaster`, `super()` will invoke the parent constructor without
    passing along the `warranty` argument, which means that the toaster won’t be saved
    in the warranty database.


    We could fix this by writing `super(warranty)`, but there’s a shorthand we can
    use instead: `super`. With no parentheses or arguments, `super` will pass on every
    one of the current function’s arguments. If you’re a Rubyist, this will seem familiar.
    If not, just think of `super` as a greedy, greedy keyword—if you don’t tell it
    which arguments you want it to pass along, it’ll take ’em all.


    Believe it or not, you now know everything there is to know about classes. As
    with everything in CoffeeScript, the syntax may be distant from JavaScript, but
    the translation is straightforward. If you’re a fan of classical OOP (object-oriented
    programming) methodology, this next section’s for you.


    ### Polymorphism and Switching


    One great use of classes is polymorphism, which is a fancy object-oriented programming
    term for “a thing can be a lot of different things, but not just any thing.” Here’s
    a classic example:


    |   | **`class`** `Shape` |


    |   | `constructor: (@width)` **`->`** |


    |   | `computeArea:` **`->`****`throw`****`new`** `Error(`*`''I am an abstract
    class!''`*`)` |


    |   |  |


    |   | **`class`** `Square` **`extends`** `Shape` |


    |   | `computeArea:` **`->`** `Math.pow @width, 2` |


    |   |  |


    |   | **`class`** `Circle` **`extends`** `Shape` |


    |   | `radius:` **`->`** `@width / 2` |


    |   | `computeArea:` **`->`** `Math.PI * Math.pow @radius(), 2` |


    |   |  |


    |   | `showArea = (shape)` **`->`** |


    |   | **`unless`** `shape` **`instanceof`** `Shape` |


    |   | **`throw`****`new`** `Error(`*`''showArea requires a Shape instance!''`*`)`
    |


    |   | `console.log shape.computeArea()` |


    |   |  |


    |   | `showArea` **`new`** `Square(2)` *`# 4`* |


    |   | `showArea` **`new`** `Circle(2)` *`# pi`* |


    Notice that the `showArea` function checks that the object passed to it is a `Shape`
    instance (using the `instanceof` keyword). But it doesn’t care what kind of shape
    it’s been given; both `Square` and `Circle` instances will work. While this is
    a trivial example, it’s not hard to imagine a rich geometry library that takes
    this approach.


    If we didn’t use the `instanceof` check, that would be known as “duck typing”
    (as in, “If it looks like a duck…”). If the target object doesn’t have a `computeArea`
    function, then we’ll get a meaningful error message anyway. Duck typing is great,
    but there are times when you want to be sure that a particular object is what
    you think it is.'
