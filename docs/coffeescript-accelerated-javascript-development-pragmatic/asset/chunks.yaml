  trans: "\n\n`if count isnt 0 then singCountdown count`\n\n这个示例会产生以下结果（省略了除创建作用域的\
    \ `function` 和存在于其中的 `var` 之外的所有内容）：\n\n```\nvar singCountdown;\nsingCountdown\
    \ = function(count) {\n  var singBottleCount, singDecrement;\n  singBottleCount\
    \ = function(specifyLocation) {\n    var bottleStr, locationStr;\n    // ...\n\
    \  }\n  // ...\n}\n```\n\n你可能会想：“如何在不进行赋值的情况下给变量一个作用域？”答案是：你做不到。相反，你需要进行赋值，传统上使用\
    \ `null` 或某个更合理的初始值。下面是一个例子：\n\n```\nobj = null\ninitializeObj = ->\n  obj = ...\
    \ # 创建具有超能力的对象\n  window.onload = initializeObj\n```\n\n以上就是我们对 CoffeeScript 中作用域的讨论。接下来是完全不同的内容：`this`。\n\
    \n## 2.3 上下文（或者说，“`this` 是什么？”）\n\n作用域和上下文是近亲，但不要混淆它们。作用域涉及标识符指向哪个变量，而上下文（也称为接收者）则涉及\
    \ `this` 关键字——以及它方便的 CoffeeScript 简写 `@`。\n\nJavaScript 和 CoffeeScript 的新手常常觉得\
    \ `this` 令人困惑。用得对，它就像魔法；用得错，它可能是错误的头号来源。毫无疑问，部分困惑源于这个词本身；人们期望 `this` 指向“这个对象”。相反，你应该把它理解为“这个上下文”。而且我们很快就会看到，上下文（即\
    \ `this`/`@`）在每次调用函数时都可能不同。\n\n（在继续之前，我应该指出，用“上下文”来描述 `this` 虽然流行，但并非标准。有些人对此不以为然，因为\
    \ JavaScript 规范定义了一个叫做“执行上下文”的东西，它相关但不同。不幸的是，对于 `this` 的值，没有其他普遍认可的术语，因此在本书中，我将继续称其为上下文。）\n\
    \n让我们通过这个简单的函数来看一些例子：\n\n[Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)\n\
    \n```\nsetName = (name) -> @name = name\n```\n\n这里，`name` 和 `@name` 是完全不同的变量：`name`（实际上我们可以叫它任何名字）是一个局部变量，在函数外部永远不可见；而\
    \ `@name`（`this.name` 的简写）是上下文的一个属性。\n\n上下文的主要目的是让对象的方法（作为属性附加的函数）能够引用它们被调用的对象：\n\
    \n[Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)\n\
    \n```\ncat = {}\ncat.setName = setName\ncat.setName 'Mittens'\nconsole.log cat.name\
    \ # 'Mittens'\n```\n\n当我们调用 `cat.setName` 时，我们是在以 `cat` 对象作为上下文调用 `setName`；因此\
    \ `this`（或 `@`）指向猫，而 `@name` 指向 `cat.name`。函数本身没有改变。我们可以这样调用：\n\n```\nsetName\
    \ 'Mr. Mistoffelees'\n```\n\n这不会对 `cat` 产生任何影响。\n\n我们可以通过使用所有函数都有的 `call` 或 `apply`\
    \ 方法，在特定上下文中调用函数，而无需将该函数附加到该对象上。（如果你对 JavaScript 中属性的工作方式感到模糊，或者惊讶于函数也是对象，那么你可能需要先跳到第\
    \ 3.1 节 *对象作为哈希表*，然后再回来。）`apply` 接受一个上下文和一个参数数组传递给函数：\n\n[Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)\n\
    \n```\npig = {}\nsetName.apply pig, ['Babe']\nconsole.log pig.name # 'Babe'\n\
    ```\n\n`call` 的工作方式相同，只是它接受单个参数而不是一个数组。因此，与上面等效的是：\n\n```\nsetName.call pig, 'Babe'\n\
    ```\n\n在实践中，`apply` 比 `call` 更常用，因为它更灵活：`call` 只允许你改变普通函数调用的上下文，而 `apply` 允许你改变上下文并传入任意数量的参数。\n\
    \n你可以使用 `call` 和 `apply` 来“借用”一个对象的方法并在另一个对象上使用：\n\n[Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)\n\
    \n```\nhorse = {}\ncat.setName.apply horse, ['Mr. Ed']\nconsole.log horse.name\
    \ # 'Mr. Ed'\n```\n\n这里，我们使用 `cat.setName` 而不是 `setName` 并不重要：它们是同一个函数。\n\n最后，给函数指定上下文的最后一种方式是使用\
    \ `new`，它会以该函数作为构造函数创建一个新对象：\n\n[Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)\n\
    \n```\nDog = setName # 按照惯例，构造函数首字母大写\ndog1 = new Dog('Jimmy')\ndog2 = new Dog('Jake')\n\
    console.log dog1.name # 'Jimmy'\nconsole.log dog2.name # 'Jake'\n```\n\n`new`\
    \ 关键字的意思是：“不要返回函数的结果；而是创建一个新对象，在该对象的上下文中运行函数，然后返回该对象。”（我们还可以使用原型为 `new` 创建的对象添加额外属性，我们将在第\
    \ 4.2 节 *原型的力量* 中看到。）因为 `new` 关键字将新的 `Dog` 设置为上下文，所以 `@name` 指向新狗的 `name` 属性。\n\
    \n如果一个函数不是作为方法调用的，并且你没有使用 `new` 关键字或 `call`/`apply`，那么上下文就是全局对象。我们将在第 4.1 节 *模块：拆分应用*\
    \ 中了解更多关于全局上下文的内容；现在，只需记住，当 `this` 指向全局对象时，通常是一个坏主意：\n\n[Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)\n\
    \n```\nsetName 'Lulu'\nconsole.log name # 'Lulu'\nconsole.log @name # undefined\n\
    ```\n\n所以，你看，上下文完全由函数的调用方式决定；与作用域不同，它与函数定义的位置无关。（当然，我们通常希望上下文由函数定义的位置决定。幸运的是，有一种巧妙的技术可以让我们有效地做到这一点，我们将在\
    \ *绑定函数：'this' 意味着 'this'* 中遇到。）\n\n回顾一下，以下是 CoffeeScript 上下文规则的简要总结，前面的规则优先于后面的规则：\n\
    \n1.  当 `new` 关键字放在函数调用前面时，上下文是新创建的对象。\n2.  当函数通过 `call` 或 `apply` 调用时，上下文是第一个参数。\n\
    3.  否则，如果函数作为对象属性（`obj.func` 或 `obj['func']`）调用，则在该对象的上下文中运行。\n4.  如果以上都不适用，则函数在全局上下文中运行。\n\
    \n我们将在第 4.1 节 *模块：拆分应用* 中了解更多关于全局上下文的内容。\n\n### 绑定函数：`this` 意味着 `this`\n\n有时你希望一个函数无论以何种方式调用，都在当前上下文中运行。这在事件回调中尤其常见。假设你想让某人在你的\
    \ `voicemail` 数组（绑定到当前上下文）中留言。那么你可能会这样写：\n\n```\ncallback = (message) -> @voicemail.push\
    \ message\n```\n\n"
- fmt: "\nAh, but of course you realize that when `callback` is called without the\
    \ relevant object, `this` will simply refer to the global object—or to whichever\
    \ context the other library sets via `call` or `apply`. Isn’t there any way to\
    \ make `this` always point to the same object, no matter how the function is called?\n\
    \nJavaScript lets you do that, but there’s a lot of boilerplate code involved\
    \ (see [*How Does => Work?*](#f_0020.html_sb.functionBinding), though it’s worth\
    \ mentioning that ECMAScript 5, a standard supported by the latest generation\
    \ of browsers, provides a much simpler `bind` method on the `Function` prototype).\
    \ Thankfully, CoffeeScript makes binding a function to the current context as\
    \ easy as a single character change: `=>` instead of `->`. We call `=>` the “bound\
    \ function operator” or, less formally, the “fat arrow.”\n\nSo our callback function\
    \ becomes this:\n\n```\ncallback = (message) => @voicemail.push message\n```\n\
    \nNow we can relax, assured that the meaning of `this` is the same within the\
    \ function as it is where the function is defined, no matter where it’s called\
    \ from!\n\n## How Does => Work?\n\nWe could write `callback = (message) => @voicemail.push\
    \ message` in JavaScript like so:\n\n```\nvar callback;\ncallback = (function(__this)\
    \ {\n  var __func = function(message) {\n    return this.voicemail.push(message);\n\
    \  };\n  return function() {\n    return __func.apply(__this, arguments);\n  };\n\
    })(this);\n```\n\n①④\n\nThe outermost function takes the current context, `this`,\
    \ as an argument called `__this`.\n\n②\n\n`__func` contains the code of the function\
    \ we want to bind to the current context.\n\n③\n\nThe anonymous function defined\
    \ here is what becomes `callback`. So whenever `callback` is called, its arguments\
    \ are passed to `__func`, which is run in the `__this` scope, and `__func`’s result\
    \ is returned.\n\nNotice that the context given to `callback` itself is never\
    \ used, and `__func` is never exposed to the outside world, ensuring that it’s\
    \ always called in the context in which `callback` was defined.\n\nIn practice,\
    \ CoffeeScript uses a helper function named `__bind`, but the underlying technique\
    \ is the same. `=>` may be CoffeeScript’s most powerful shorthand.\n\nYou might\
    \ wonder why you shouldn’t just always use `=>` instead of `->`. There are two\
    \ reasons. First, the binding code leads to some small overhead in both file size\
    \ and execution time and is usually unnecessary. But more importantly, while the\
    \ chameleon-like nature of context is often confusing, it can also allow for very\
    \ elegant code. For instance, many libraries pass critical information to callback\
    \ functions through context. Here’s a simple example (one that will make more\
    \ sense in Chapter 5, [*Web Interactivity with jQuery*](#f_0045.html_chp.jquery)):\n\
    \n```\n$('#clickToHide').click -> $(this).hide()\n```\n\nRather than strictly\
    \ using either normal functions or bound functions, you need to think carefully\
    \ each time you define a function that uses `this`/`@` about what the context\
    \ should mean.\n\nThat’s it for scope and context—consider yourself a master of\
    \ function semantics! The next couple of sections will cover some helpful syntactic\
    \ sugars before we finally tackle the first iteration of our game project.\n\n\
    ## 2.4 Property Arguments (@arg)\n\nRemember that function we defined just to\
    \ set a property on its context object to the value of an argument?\n\n```\nsetName\
    \ = (name) -> @name = name\n```\n\nWell, it turns out CoffeeScript offers a handy\
    \ shorthand for this:\n\n```\nsetName = (@name) -> # no code required!\n```\n\n\
    Quite simply, when `@` precedes the name of an argument to a function, that function\
    \ automatically makes the assignment from the argument to the property with that\
    \ name on the context object, `this`.\n\nThis is especially great for constructors,\
    \ which we’ll be up to our knees in when we get to Chapter 4, [*Modules and Classes*](#f_0037.html_chp.classes).\
    \ It’s common to pass four or five arguments to a constructor just to set initial\
    \ properties on the instance object. By using the `@argument` syntax instead,\
    \ you save that many lines of code. Nice.\n\n## 2.5 Default Arguments (arg =)\n\
    \nLet’s say that you have a function where one of its arguments is going to have\
    \ one particular value most of the time, like this:\n\n```\nringFireAlarm = (isDrill)\
    \ ->\n  # it's pretty much always a drill\n  ...\n```\n\nWouldn’t it be nice if\
    \ `ringFireAlarm()` were shorthand for the much more common `ringFireAlarm true`?\
    \ Well, we could do that by writing this:\n\n```\nringFireAlarm = (isDrill) ->\n\
    \  isDrill = true unless isDrill?\n  ...\n```\n\nHere `unless (expression)` is\
    \ a shorthand for `if not (expression)`. The `?` in `isDrill?` is the existential\
    \ operator, and it’s shorthand for checking that the given value (1) exists in\
    \ this scope and (2) isn’t `undefined` or `null`. In your head, `x?` should read\
    \ as “`x` exists.”\n\nThe existential operator can also be placed between two\
    \ variables: `a ? b` returns `a` if `a?`, and `b` otherwise. And it can be combined\
    \ with `=` to form a compound assignment operator: `c ?= d` is shorthand for `c\
    \ = d unless c?`. You can read that as, “Let `d` be the default value for `c`.”\n\
    \n### Getting Truthy with 'or='\n\nYou’re likely to see someone write the following:\n\
    \n```\na or= b\n```\n\nThis (or it’s equivalent, `a ||= b`) is a way of making\
    \ `b` the default value for `a`. How, exactly, does this differ from `a ?= b`?\n\
    \nThe answer has to do with “truthiness.” In CoffeeScript (as in JavaScript),\
    \ all values are implicitly coerced to booleans by the boolean logic operators,\
    \ `&&` and `||` (known as `and` and `or` under CoffeeScript style), as well as\
    \ `if`. Most values become `true`, while a handful—notably `null`, `undefined`,\
    \ `0`, and the empty string—become `false`.\n\nThis loose, flexible approach to\
    \ boolean logic carries over to the results of boolean operators. While some languages\
    \ would just return `true` or `false` from the statement `a or b`, CoffeeScript\
    \ (like JavaScript) returns `a` if `a` is truthy and returns `b` otherwise. (`x\
    \ and y` returns `y` if both are truthy, `x` if both are falsy, and the falsy\
    \ one if only one is falsy.)\n\nThis gives us lots of useful shortcuts—including\
    \ `a = a or b` (typically shortened to `a or= b`) as a way of saying “set `a`\
    \ to `b` if the value of `a` is falsy.” While not quite as handy as `?=`, `or=`\
    \ is a good friend to have.\n\n```\nringFireAlarm = (isDrill) ->\n  isDrill ?=\
    \ true\n  ...\n```\n\nOf course, as you probably inferred from the section heading,\
    \ there’s an even more succinct way of doing this:\n\n```\nringFireAlarm = (isDrill\
    \ = true) ->\n  ...\n```\n\n“So why,” you might ask, “did you spend all that time\
    \ talking about the existential operator?” There are two reasons. First, the existential\
    \ operator is sweet. Second, the behavior of default arguments in CoffeeScript\
    \ is somewhat different from that of other programming languages like Ruby, Python,\
    \ and PHP. In those languages, the number of arguments passed to the function\
    \ is what matters—the `isDrill = true` assignment would only be carried out if\
    \ `ringFireAlarm` was called with no arguments. By contrast, CoffeeScript uses\
    \ the existence operator behind the scenes. This means that explicitly passing\
    \ `null` or `undefined` is the same as omitting the argument altogether.\n\nThis\
    \ can lead to unpleasant surprises if you’re not careful, but it’s also more flexible.\
    \ You can have an argument with several default values, and callers can choose\
    \ to use the defaults for any subset of them, like so:\n\n```\nchooseMeals = (breakfast\
    \ = 'waffles', lunch = 'gyros', dinner = 'pizza') ->\n  ...\n\nchooseMeals null,\
    \ 'burrito', null # not a gyro fan\n```\n"
  raw: 'Ah, but of course you realize that when `callback` is called without the relevant
    object, `this` will simply refer to the global object—or to whichever context
    the other library sets via `call` or `apply`. Isn’t there any way to make `this`
    always point to the same object, no matter how the function is called?


    JavaScript lets you do that, but there’s a lot of boilerplate code involved (see
    [​*How Does => Work?*​](#f_0020.html_sb.functionBinding), though it’s worth mentioning
    that ECMAScript 5, a standard supported by the latest generation of browsers,
    provides a much simpler `bind` method on the `Function` prototype). Thankfully,
    CoffeeScript makes binding a function to the current context as easy as a single
    character change: `=>` instead of `->`. We call `=>` the “bound function operator”
    or, less formally, the “fat arrow.”


    So our callback function becomes this:


    |   | `callback = (message)` **`=>`** `@voicemail.push message` |


    Now we can relax, assured that the meaning of `this` is the same within the function
    as it is where the function is defined, no matter where it’s called from!


    How Does => Work?


    We could write `callback = (message) => @voicemail.push message` in JavaScript
    like so:


    |   | **`var`** `callback;` |


    | ①  | `callback = (`**`function`**`(__this) {` |


    | ②  | **`var`** `__func =` **`function`**`(message) {` |


    |   | **`return`** `this.voicemail.push(message);` |


    |   | `};` |


    | ③  | **`return`****`function`**`() {` |


    |   | **`return`** `__func.apply(__this, arguments);` |


    |   | `};` |


    | ④  | `})(this);` |


    ①④


    The outermost function takes the current context, `this`, as an argument called
    `__this`.


    ②


    `__func` contains the code of the function we want to bind to the current context.


    ③


    The anonymous function defined here is what becomes `callback`. So whenever `callback`
    is called, its arguments are passed to `__func`, which is run in the `__this`
    scope, and `__func`’s result is returned.


    Notice that the context given to `callback` itself is never used, and `__func`
    is never exposed to the outside world, ensuring that it’s always called in the
    context in which `callback` was defined.


    In practice, CoffeeScript uses a helper function named `__bind`, but the underlying
    technique is the same. `=>` may be CoffeeScript’s most powerful shorthand.


    You might wonder why you shouldn’t just always use `=>` instead of `->`. There
    are two reasons. First, the binding code leads to some small overhead in both
    file size and execution time and is usually unnecessary. But more importantly,
    while the chameleon-like nature of context is often confusing, it can also allow
    for very elegant code. For instance, many libraries pass critical information
    to callback functions through context. Here’s a simple example (one that will
    make more sense in Chapter 5, [​*Web Interactivity with jQuery*​](#f_0045.html_chp.jquery)):


    |   | `$(`*`''#clickToHide''`*`).click` **`->`** `$(`**`this`**`).hide()` |


    Rather than strictly using either normal functions or bound functions, you need
    to think carefully each time you define a function that uses `this`/`@` about
    what the context should mean.


    That’s it for scope and context—consider yourself a master of function semantics!
    The next couple of sections will cover some helpful syntactic sugars before we
    finally tackle the first iteration of our game project.


    ## 2.4 Property Arguments (@arg)


    Remember that function we defined just to set a property on its context object
    to the value of an argument?


    |   | `setName = (name)` **`->`** `@name = name` |


    Well, it turns out CoffeeScript offers a handy shorthand for this:


    |   | `setName = (@name)` **`->`***`# no code required!`* |


    Quite simply, when `@` precedes the name of an argument to a function, that function
    automatically makes the assignment from the argument to the property with that
    name on the context object, `this`.


    This is especially great for constructors, which we’ll be up to our knees in when
    we get to Chapter 4, [​*Modules and Classes*​](#f_0037.html_chp.classes). It’s
    common to pass four or five arguments to a constructor just to set initial properties
    on the instance object. By using the `@argument` syntax instead, you save that
    many lines of code. Nice.


    ## 2.5 Default Arguments (arg =)


    Let’s say that you have a function where one of its arguments is going to have
    one particular value most of the time, like this:


    |   | `ringFireAlarm = (isDrill)` **`->`** |


    |   | *`# it''s pretty much always a drill`* |


    |   | `...` |


    Wouldn’t it be nice if `ringFireAlarm()` were shorthand for the much more common
    `ringFireAlarm true`? Well, we could do that by writing this:


    |   | `ringFireAlarm = (isDrill)` **`->`** |


    |   | `isDrill =` **`true`****`unless`** `isDrill?` |


    |   | `...` |


    Here `unless (expression)` is a shorthand for `if not (expression)`. The `?` in
    `isDrill?` is the existential operator, and it’s shorthand for checking that the
    given value (1) exists in this scope and (2) isn’t `undefined` or `null`. In your
    head, `x?` should read as “`x` exists.”


    The existential operator can also be placed between two variables: `a ? b`returns`a`
    if `a?`, and `b` otherwise. And it can be combined with `=` to form a compound
    assignment operator: `c ?= d` is shorthand for `c = d unless c?`. You can read
    that as, “Let `d` be the default value for `c`.”


    Getting Truthy with ''or=''


    You’re likely to see someone write the following:


    |   | `a or= b` |


    This (or it’s equivalent, `a ||= b`) is a way of making `b` the default value
    for `a`. How, exactly, does this differ from `a ?= b`?


    The answer has to do with “truthiness.” In CoffeeScript (as in JavaScript), all
    values are implicitly coerced to booleans by the boolean logic operators, `&&`
    and `||` (known as `and` and `or` under CoffeeScript style), as well as `if`.
    Most values become `true`, while a handful—notably `null`, `undefined`, `0`, and
    the empty string—become `false`.


    This loose, flexible approach to boolean logic carries over to the results of
    boolean operators. While some languages would just return `true` or `false` from
    the statement `a or b`, CoffeeScript (like JavaScript) returns `a` if `a` is truthy
    and returns `b` otherwise. (`x and y` returns `y` if both are truthy, `x` if both
    are falsy, and the falsy one if only one is falsy.)


    This gives us lots of useful shortcuts—including `a = a or b` (typically shortened
    to `a or= b`) as a way of saying “set `a` to `b` if the value of `a` is falsy.”
    While not quite as handy as `?=`, `or=` is a good friend to have.


    |   | `ringFireAlarm = (isDrill)` **`->`** |


    |   | `isDrill ?=` **`true`** |


    |   | `...` |


    Of course, as you probably inferred from the section heading, there’s an even
    more succinct way of doing this:


    |   | `ringFireAlarm = (isDrill =` **`true`**`)` **`->`** |


    |   | `...` |


    “So why,” you might ask, “did you spend all that time talking about the existential
    operator?” There are two reasons. First, the existential operator is sweet. Second,
    the behavior of default arguments in CoffeeScript is somewhat different from that
    of other programming languages like Ruby, Python, and PHP. In those languages,
    the number of arguments passed to the function is what matters—the `isDrill =
    true` assignment would only be carried out if `ringFireAlarm` was called with
    no arguments. By contrast, CoffeeScript uses the existence operator behind the
    scenes. This means that explicitly passing `null` or `undefined` is the same as
    omitting the argument altogether.


    This can lead to unpleasant surprises if you’re not careful, but it’s also more
    flexible. You can have an argument with several default values, and callers can
    choose to use the defaults for any subset of them, like so:


    |   | `chooseMeals = (breakfast =` *`''waffles''`*`, lunch =` *`''gyros''`*`,
    dinner =` *`''pizza''`*`)` **`->`** |


    |   | `...` |


    |   |  |


    |   | `chooseMeals` **`null`**`,` *`''burrito''`*`,` **`null`***`# not a gyro
    fan`* |'
