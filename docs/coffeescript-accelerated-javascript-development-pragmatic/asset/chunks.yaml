  trans: "\n\n每当创建一个新的 tribble 时，`Tribble.count` 就会增加 1。（在这里我们可以称之为 `@count`，因为类体中\
    \ `this` 的值就是类本身。）当调用 `Tribble.makeTrouble()` 时，它会显示 `Tribble.count` 次 “Trouble!”。\n\
    \n我们来测试一下：\n\n[Classes/Tribble.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Tribble.coffee)\n\
    \n```\ntribble1 = new Tribble\ntribble2 = new Tribble\nTribble.makeTrouble() #\
    \ \"Trouble! Trouble!\"\n```\n\n注意，在 `Tribble` 类的上下文中，`Tribble.count` 被引用为 `@count`，但在\
    \ `Tribble` 方法内部则不是。一开始这有点令人困惑，但请记住，这里涉及三个对象：`Tribble` 对象本身（实际上是 `constructor`\
    \ 函数）、`Tribble.prototype` 以及 `Tribble` 实例。默认情况下，`Tribble` 的属性（除了 `constructor`）都附加到原型上。当我们使用\
    \ `@` 前缀时，我们坚持要将属性附加到类对象本身。\n\n由于附加到原型上的函数是在单个对象的上下文中调用的（构造函数也是如此），这些函数中以 `@`\
    \ 为前缀的变量是对实例属性的引用。这就是为什么我们在构造函数中定义 `@isAlive`：我们需要为每个实例附加一个独立的 `@isAlive` 属性。这样我们就可以做到：\n\
    \n[Classes/Tribble.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Tribble.coffee)\n\
    \n```\ntribble1.die()\nTribble.makeTrouble() # \"Trouble!\"\n```\n\n再次杀死 `tribble1`\
    \ 不会产生任何效果，这要归功于 `if @isAlive` 检查。而且我们知道，tribble 生来就怀孕，所以用不了多久，这个物种就会在我们的程序中重新繁衍：\n\
    \n[Classes/Tribble.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/Tribble.coffee)\n\
    \n```\ntribble2.breed().breed().breed()\nTribble.makeTrouble() # \"Trouble! Trouble!\
    \ Trouble! Trouble!\"\n```\n\n## 4.4 使用 `extends` 实现继承\n\n到目前为止，我们已经讨论了原型如何使一组对象之间轻松共享功能，以及\
    \ CoffeeScript 的类如何提供一种有用的语法来将原型属性捆绑在一起。如果类只做这些，那它们还算有点用。但类真正大放异彩的地方在于我们想要使用继承时。\n\
    \nJavaScript 通过所谓的“原型链”支持继承。假设 `A` 的原型 `B` 有自己的原型 `C`。那么当我们这样写：\n\n```\na = new\
    \ A\nconsole.log a.flurb()\n```\n\n首先，运行时检查特定的 `A` 实例 `a` 是否具有属性 `flurb`；如果没有，则检查\
    \ `A` 的原型（`B`）；如果还是没有，则检查 `B` 的原型（`C`）。简而言之，它正在遍历原型链。\n\n如果 `C` 也没有 `flurb` 呢？那么运行时就会检查默认的对象原型（即\
    \ `{}` 的原型）。因此，每个原型都继承自 `{}` 的原型，但中间可能还有其他原型。\n\n所有这些将原型赋给原型再赋给原型的操作会变得有点混乱。这时\
    \ CoffeeScript 的 `extends` 关键字就派上用场了。\n\n让我们声明：\n\n```\nclass B extends A\n```\n\
    \n那么，`B` 的原型继承自 `A` 的原型。此外，`A` 的类级属性也会被复制到 `B` 中。因此，如果我们不对 `B` 的定义做任何修改，`B` 的实例将具有与\
    \ `A` 实例完全相同的行为。（有一个例外：`B.name` 会是 `'B'`，而 `A.name` 会是 `'A'`——`name` 是一个特殊属性。）\n\
    \n现在来看一个稍微深入一点的例子：\n\n```\nclass Pet\n  constructor: -> @isHungry = true\n  eat:\
    \ -> @isHungry = false\n\nclass Dog extends Pet\n  eat: ->\n    console.log '*crunch,\
    \ crunch*'\n    super()\n  fetch: ->\n    console.log 'Yip yip!'\n    @isHungry\
    \ = true\n```\n\n`Pet` 的构造函数被 `Dog` 继承，这意味着狗一开始是饥饿的。当狗吃东西时，它会发出一些声音，然后调用 `super()`，这表示“调用父类中同名的方法”。（更准确地说，它表示\
    \ `Pet::eat.call this`。）然后狗就不再饿了。\n\n如果在子类中定义了构造函数，那么它会覆盖父类的构造函数。它可以随时使用 `super()`\
    \ 调用父构造函数。通常明智的做法是在子类构造函数的开头调用 `super()`（或者更可能是 `super`——参见 ​*'super' 不是 'super()'*​）。\n\
    \n'super' 不是 'super()'\n\n这段代码有什么问题？\n\n```\nclass Appliance\n  constructor: (warranty)\
    \ ->\n    warrantyDb.save(this) if warranty\n\nclass Toaster extends Appliance\n\
    \  constructor: (warranty) ->\n    super()\n```\n\n当我们创建一个新的 `Toaster` 时，`super()`\
    \ 会调用父构造函数，但没有传递 `warranty` 参数，这意味着烤面包机不会被保存到保修数据库中。\n\n我们可以通过编写 `super(warranty)`\
    \ 来修复这个问题，但有一个简写形式可以使用：`super`。不带括号或参数时，`super` 会传递当前函数的所有参数。如果你是 Ruby 开发者，这看起来会很熟悉。如果不是，只需将\
    \ `super` 视为一个贪婪的关键字——如果你不告诉它要传递哪些参数，它就会全部拿走。\n\n信不信由你，你现在已经知道了关于类的所有知识。与 CoffeeScript\
    \ 中的一切一样，语法可能远离 JavaScript，但转换是直接的。如果你是经典 OOP（面向对象编程）方法的爱好者，那么下一节就是为你准备的。\n\n\
    ### 多态与切换\n\n类的一个伟大用途是多态，这是一个花哨的面向对象编程术语，意思是“一个东西可以是很多不同的东西，但又不是任何东西”。下面是一个经典例子：\n\
    \n```\nclass Shape\n  constructor: (@width) ->\n  computeArea: -> throw new Error('I\
    \ am an abstract class!')\n\nclass Square extends Shape\n  computeArea: -> Math.pow\
    \ @width, 2\n\nclass Circle extends Shape\n  radius: -> @width / 2\n  computeArea:\
    \ -> Math.PI * Math.pow @radius(), 2\n\nshowArea = (shape) ->\n  unless shape\
    \ instanceof Shape\n    throw new Error('showArea requires a Shape instance!')\n\
    \  console.log shape.computeArea()\n\nshowArea new Square(2) # 4\nshowArea new\
    \ Circle(2) # pi\n```\n\n注意，`showArea` 函数检查传递给它的对象是否是 `Shape` 实例（使用 `instanceof`\
    \ 关键字）。但它并不关心传入的是哪种形状；`Square` 和 `Circle` 实例都可以工作。虽然这是一个简单的例子，但不难想象一个丰富的几何库会采用这种方法。\n\
    \n如果我们不使用 `instanceof` 检查，那将被称为“鸭子类型”（就像“如果它看起来像鸭子……”）。如果目标对象没有 `computeArea`\
    \ 函数，我们仍然会得到一个有意义的错误消息。鸭子类型很棒，但有时你需要确保某个特定对象确实是你认为的那个对象。\n\n"
- fmt: "\nA common idiom in more classical object-oriented languages is to use polymorphism\
    \ with `switch`. We haven’t talked about CoffeeScript’s `switch` yet, and there\
    \ are a number of differences between it and JavaScript’s: first, there’s an implicit\
    \ break between clauses to prevent unintended “fall­through”; second, the result\
    \ of the switch is returned. (When the return value is used, `break` and `return`\
    \ are not allowed. If you try, you’ll get `SyntaxError: cannot include a pure\
    \ statement in an expression`. This is jargon for saying that it doesn’t make\
    \ sense to say `a = return x`, so the compiler won’t allow it as a possibility.)\n\
    \nCoffeeScript also makes several syntactic changes, in part to remind JavaScripters\
    \ of these hidden differences: `when` is used instead of `case` and `else` instead\
    \ of `default`. (The keywords are borrowed from Ruby, where the `case` structure\
    \ has similar semantics.) A single `when` can be followed by several potential\
    \ matches, delimited by commas. Also, instead of `:`, those match clauses are\
    \ separated from their outcomes by indentation (or `then`).\n\nHere’s how it all\
    \ comes together in a simple factory function:\n\n```\nrequisitionStarship = (captain)\
    \ ->\n  switch captain\n    when 'Kirk', 'Picard', 'Archer'\n      new Enterprise()\n\
    \    when 'Janeway'\n      new Voyager()\n    else\n      throw new Error('Invalid\
    \ starship captain')\n```\n\nThat’s it for our coverage of modules and classes.\
    \ Just remember: CoffeeScript certainly doesn’t require you to use classes or\
    \ classical object-oriented design patterns—most JavaScript developers do perfectly\
    \ fine without either, after all—but for some applications, classes feel like\
    \ a natural fit.\n\nSpeaking of which, remember that mess of code from the project\
    \ in the last chapter? Let’s see what we can do about it.\n\n## 4.5 Project: Refactoring\
    \ 5x5\n\nClasses give a nice clean way to reorganize the code we’ve written so\
    \ far, to encourage modularity and extensibility. Let’s create three classes:\n\
    \n1.  `Dictionary`, which can find valid words on the grid\n2.  `Grid`, which\
    \ manages the letter tiles\n3.  `Player`, which keeps track of a player’s score\n\
    \nWe’ll save these classes in three different `coffee` files. Also, we’ll make\
    \ these classes compatible with all major browser environments as well as with\
    \ Node.js, paving the way for the jQuery version of the game in the next chapter.\
    \ To make the game playable under Node, we’ll have a `console.coffee` file that\
    \ provides a prompt and `require`s the three classes.\n\n### The Dictionary Class\n\
    \nBecause we want to support browsers, it makes sense to convert our word list\
    \ from a text file to JavaScript code that can be loaded directly. I wrote a short\
    \ script to do just that:\n\n```\nfs = require 'fs'\nowl2 = fs.readFileSync 'OWL2.txt',\
    \ 'utf8'\nwordList = owl2.match /^(\\w+)/mg\nfileContents = \"\"\"\nroot = typeof\
    \ exports === \"undefined\" ? window : exports;\nroot.OWL2 = ['#{wordList.join\
    \ \"',\\n'\"}']\n\"\"\"\nfs.writeFile 'OWL2.js', fileContents\n```\n\nThe triple-quote\
    \ `\"\"\"` syntax, which should be familiar to Python coders, is called a heredoc\
    \ string. It allows you to write multiline strings in a human-readable format.\
    \ You can also use three single quotes, `'''`, to delimit a heredoc string. The\
    \ difference between `\"\"\"` and `'''` is the same as the difference between\
    \ `\"` and `'`: The former allows interpolation, while the latter does not.\n\n\
    After running the script, the resulting `OWL2.js` looks like this:\n\n```\nroot\
    \ = typeof global === \"undefined\" ? window : global;\nroot.OWL2 = ['AA',\n...\n\
    'ZOOGEOGRAPHICAL'];\n```\n\n(I’ve omitted the middle 178,687 lines for the sake\
    \ of brevity.)\n\nNow, in order to decouple `Dictionary` from Node, let’s have\
    \ the word list and the game’s grid get passed in to `Dictionary`’s constructor:\n\
    \n```\nclass Dictionary\n  constructor: (@originalWordList, grid) ->\n    @setGrid\
    \ grid if grid?\n```\n\nNote the implicit assignment of the first argument to\
    \ `@originalWordList` (a feature we covered back in Section 2.4, [*Property Arguments\
    \ (@arg)*](#f_0021.html_sec.propertyArguments)).\n\nWhen a new game starts, we’ll\
    \ call `setGrid` ourselves with the new grid. This grid could be of a different\
    \ size, so we’ll copy and filter our original word list each time (`slice(0)`\
    \ is a well-known trick for copying JavaScript arrays):\n\n```\nsetGrid: (@grid)\
    \ ->\n  @wordList = @originalWordList.slice(0)\n  @wordList = (word for word in\
    \ @wordList when word.length <= @grid.size)\n  @minWordLength = Math.min.apply\
    \ Math, (w.length for w in @wordList)\n  @usedWords = []\n  for x in [0...@grid.size]\n\
    \    for y in [0...@grid.size]\n      @markUsed word for word in @wordsThroughTile\
    \ x, y\n```\n\nNotice that we also reset the `usedWords` list here. We’ll want\
    \ a way of indicating that a word has been used:\n\n```\nmarkUsed: (str) ->\n\
    \  if str in @usedWords\n    false\n  else\n    @usedWords.push str\n    true\n\
    ```\n\nLet’s provide one method that says whether a word is valid and another\
    \ that says whether a word is usable at this point in the game:\n\n```\nisWord:\
    \ (str) -> str in @wordList\nisNewWord: (str) -> str in @wordList and str not\
    \ in @usedWords\n```\n\nHere’s the hard part: given a pair of coordinates, we’d\
    \ like to be able to find all words that go through that tile of the `Grid` instance.\
    \ I’ll spare you the excerpt, since it’s basically the same as our `wordsThroughTile`\
    \ function from the last chapter.\n\nNow in order to make the class accessible,\
    \ let’s make it a global:\n\n```\nroot = exports ? window\nroot.Dictionary = Dictionary\n\
    ```\n\n### The Grid Class\n\nBefore we define the `Grid` class, let’s put some\
    \ other variables in `grid.coffee`, giving them module scope:\n\n```\ntileCounts\
    \ =\n  A: 9, B: 2, C: 2, D: 4, E: 12, F: 2, G: 3, H: 2, I: 9, J: 1, K: 1, L: 4\n\
    \  M: 2, N: 6, O: 8, P: 2, Q: 1, R: 6, S: 4, T: 6, U: 4, V: 2, W: 2, X: 1\n  Y:\
    \ 2, Z: 1\n\ntotalTiles = 0\ntotalTiles += count for letter, count of tileCounts\n\
    alphabet = (letter for letter of tileCounts).sort()\n\nrandomLetter = ->\n  randomNumber\
    \ = Math.ceil Math.random() * totalTiles\n  x = 1\n  for letter in alphabet\n\
    \    x += tileCounts[letter]\n    return letter if x > randomNumber\n```\n\nWhen\
    \ we instantiate a grid, let’s generate its initial `tiles` matrix automatically:\n\
    \n```\nclass Grid\n  constructor: ->\n    @size = size = 5\n    @tiles = for x\
    \ in [0...size]\n```\n"
