  trans: "\n\n虽然我们可以将 `Connect` 与 Apache 或 nginx 结合使用，但它完全有能力独立提供静态文件（位于 `client`\
    \ 子目录中）。我们只需在其 `configure` 块中要求它这样做即可。同时，我们还会添加一个错误处理器；否则，异常会被静默吞掉：\n\n[Nodejs/5x5/5x5\
    \ 服务器.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\napp = connect.createServer(\n  connect.compiler(src: __dirname + '/client',\
    \ enable: ['coffeescript']),\n  connect.static(__dirname + '/client'),\n  connect.errorHandler\
    \ dumpExceptions: true, showStack: true\n)\n```\n\n为了启动服务器，我们只需要再做一件事：通过 `listen`\
    \ 函数告诉它运行在哪个端口。端口的选择很大程度上是任意的；在生产环境中，我们很可能希望使用 80 端口（HTTP 标准端口），但为了避免潜在冲突，我们使用\
    \ 3000：\n\n[Nodejs/5x5/5x5 服务器.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nport = 3000\napp.listen port\nconsole.log \"Browse to http://localhost:#{port}\
    \ to play\"\n```\n\n如果我们直接运行现有代码，并在浏览器中访问 `http://localhost:3000/`，我们会自动获得 `index.html`。现在，我们只需要添加与客户端代码通信的方式。但如何实现呢？当一名玩家执行操作时，两名玩家都需要被告知结果。Ajax\
    \ 不适合这类场景；我们需要一种能够随时将数据从服务器同时广播到多个客户端的方法。\n\n幸运的是，一种名为 WebSocket 的新技术正好提供了这种能力。一个名为\
    \ Socket.IO 的 Node 库让这一切变得轻而易举；此外，它还能在不支持 WebSocket 的浏览器中自动回退到其他协议。\n\n我们将以可靠的\
    \ npm 方式安装 Socket.io：\n\n```\n$ npm install socket.io\n```\n\n现在，我们在服务器上使用它：\n\
    \n[Nodejs/5x5/5x5 服务器.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nio = require 'socket.io'\nsocket = io.listen app\nsocket.on 'connection',\
    \ (client) ->\n  if assignToGame client\n    client.on 'message', (message) ->\
    \ handleMessage client, message\n    client.on 'disconnect', -> removeFromGame\
    \ client\n  else\n    client.send 'full'\n```\n\n现在，每当浏览器连接到服务器时，我们都会获得一个新的 Socket.io\
    \ `client` 实例。我们实现了两个回调：一个用于客户端发送消息（即移动操作）时，另一个用于客户端断开连接时。同时，我们立即将客户端分配到一个游戏中。\n\
    \n为简单起见，此服务器实现一次只托管一个游戏，但游戏状态已由 `Game` 类封装，因此将项目扩展为多游戏服务器应该很简单。这样，我们只需要两个模块作用域变量（当然，除了函数之外）：游戏本身和一个从\
    \ ID 到客户端的映射。\n\n[Nodejs/5x5/5x5 服务器.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\ngame = new Game\nidClientMap = {}\n```\n\n每个 `Player` 实例现在都有一个 `id` 属性，因此当我们需要向特定玩家发送消息时，我们使用\
    \ `idClientMap` 获取其 `client` 对象。以下是将新客户端添加到游戏的方法：\n\n[Nodejs/5x5/5x5 服务器.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nassignToGame = (client) ->\n  idClientMap[client.sessionId] = client\n\
    \  return false if game.isFull()\n  game.addPlayer client.sessionId\n  if game.isFull()\
    \ then welcomePlayers()\n  true\n```\n\n一旦游戏有两名玩家，我们就会向每位玩家发送一条欢迎消息，其中包含方块列表，以及如果有人中途加入，还会包含分数：\n\
    \n[Nodejs/5x5/5x5 服务器.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nwelcomePlayers = ->\n  players = [game.player1, game.player2]\n  info =\
    \ {players, tiles: game.grid.tiles, currPlayerNum: game.currPlayer.num}\n  for\
    \ player in players\n    playerInfo = extend {}, info, {yourNum: player.num}\n\
    \    idClientMap[player.id].send \"welcome:#{JSON.stringify playerInfo}\"\n```\n\
    \n注意到其中的 `extend` 了吗？这是一个小型工具函数，用于将一个对象的属性添加到另一个对象。它等同于 Underscore.js 中的 `_.extend`：\n\
    \n[Nodejs/5x5/5x5 服务器.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nextend = (a, others...) ->\n  for o in others\n    a[key] = val for key,\
    \ val of o\n  a\n```\n\n剩下的唯一事情就是处理玩家的移动操作：\n\n[Nodejs/5x5/5x5 服务器.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nhandleMessage = (client, message) ->\n  {type, content} = typeAndContent\
    \ message\n  if type is 'move'\n    return unless client.sessionId is game.currPlayer.id\
    \ # no cheating!\n    swapCoordinates = JSON.parse content\n    {moveScore, newWords}\
    \ = game.currPlayer.makeMove swapCoordinates\n    result = {swapCoordinates, moveScore,\
    \ newWords, player: game.currPlayer}\n    socket.broadcast \"moveResult:#{JSON.stringify\
    \ result}\"\n    game.endTurn()\n```\n\n注意，我们使用客户端唯一的会话 ID（由 Socket.io 提供）作为简单的安全检查，以防止一名玩家替另一名玩家移动。计算出移动结果后，我们使用\
    \ `socket.broadcast`，这是一个方便的简写，用于向每个连接的客户端发送相同的消息。\n\n### 5x5 客户端.coffee\n\n那么，我们如何从客户端与\
    \ Socket.io 交互呢？幸运的是，Socket.io 为我们提供了一个客户端库。我们只需包含它：\n\n[Nodejs/5x5/client/index.html](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/client/index.html)\n\
    \n```\n<script type=\"text/javascript\" src=\"/socket.io/socket.io.js\"></script>\n\
    ```\n\n如果你特别好奇，可能会注意到我们的静态目录中并没有名为 `socket.io.js` 的文件。然而，如果你向服务器请求它，它就在那里！\n\n\
    原来，服务器端的 Socket.io 库会自动提供自己的客户端库。当然，在生产环境中，你会希望将该脚本与其他所有脚本一起压缩和合并，但对于开发来说，这个功能非常方便。如果你在服务器端更新到新版本的\
    \ Socket.io，则无需担心提供新的客户端库——它会自动处理。\n\n那么，我们实际上如何使用它呢？嗯，它实际上与我们为服务器编写的代码非常相似：\n\
    \n[Nodejs/5x5/client/5x5 客户端.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/client/5x5client.coffee)\n\
    \n```\n$(document).ready ->\n  $('#grid li').live 'click', tileClick\n  socket\
    \ = new io.Socket()\n  socket.connect()\n  socket.on 'connect', -> showMessage\
    \ 'waitForConnection'\n  socket.on 'message', handleMessage\n```\n\n我们需要处理两种类型的消息：初始欢迎消息和移动结果消息：\n\
    \n[Nodejs/5x5/client/5x5 客户端.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/client/5x5client.coffee)\n\
    \n```\nhandleMessage = (message) ->\n  {type, content} = typeAndContent message\n\
    \  switch type\n    when 'welcome'\n      {players, currPlayerNum, tiles, yourNum:\
    \ myNum} = JSON.parse content\n      startGame players, currPlayerNum\n```\n\n"
- fmt: "\n```coffeescript\nwhen 'moveResult'\n{player, swapCoordinates, moveScore,\
    \ newWords} = JSON.parse content\nshowMoveResult player, swapCoordinates, moveScore,\
    \ newWords\n\nstartGame = (players, currPlayerNum) ->\n  for player in players\n\
    \    $(\"#p#{player.num}name\").html player.name\n    $(\"#p#{player.num}score\"\
    ).html player.score\n  drawTiles()\n  if myNum is currPlayerNum\n    startTurn()\n\
    \  else\n    endTurn()\n\nshowMoveResult = (player, swapCoordinates, moveScore,\
    \ newWords) ->\n  $(\"#p#{player.num}score\").html player.score\n  $notice = $('<p\
    \ class=\"notice\"></p>')\n  if moveScore is 0\n    $notice.html \"#{player.name}\
    \ formed no words this turn.\"\n  else\n    $notice.html \"\"\"\n      #{player.name}\
    \ formed the following #{newWords.length} word(s):<br />\n      <b>#{newWords.join(',\
    \ ')}</b><br />\n      earning <b>#{moveScore / newWords.length}x#{newWords.length}\n\
    \      = #{moveScore}</b> points!\n    \"\"\"\n  showThenFade $notice\n  swapTiles\
    \ swapCoordinates\n  if player.num isnt myNum then startTurn()\n```\n\nAnd that’s\
    \ it! The rest of the code is pretty similar to the version from the last chapter—simpler,\
    \ in fact, since the game logic is all on the server.\n\n![images/node5x5.png](images/node5x5.png)\n\
    \n* * *\n\n**Figure 6. Playing multiplayer 5x5**\n\nRunning `coffee 5x5server.coffee`\
    \ gives you this invitation:\n\n```\nBrowse to http://localhost:3000 to play\n\
    ```\n\nOpen up two browsers, point them both to that address, and you’ll get something\
    \ like Figure 6, [*Playing multiplayer 5x5*](#f_0057.html_fig.node5x5).\n\n###\
    \ Is That All?\n\nGee whiz—you’ve built a fully buzzword-compliant multiplayer\
    \ gaming app with Node.js and WebSocket! It may not be the next viral sensation\
    \ on YouFace, but it demonstrates that using cutting-edge web technologies can\
    \ actually be pretty easy.\n\nOf course, for larger-scale apps, you’d want to\
    \ use a more robust web framework (like brunch or the aforementioned Zappa);[[49]](#f_0059.html_FOOTNOTE-49)\
    \ hook in a database (Node.js already has first-rate bindings for MySQL, MongoDB,\
    \ and Redis); and add in logging, tracking, and performance-monitoring (perhaps\
    \ with the sleek, Node-powered Hummingbird).[[50]](#f_0059.html_FOOTNOTE-50) It’s\
    \ just amazing how vibrant the Node ecosystem is—and it hasn’t even hit 1.0 yet.\n\
    \n## 6.5 Client, Server—What’s the Difference?\n\nWe’ve only scratched the surface\
    \ of Node.js in this chapter. Despite its youth, Node is already a powerful framework\
    \ with a thriving ecosystem, making CoffeeScript a viable language well beyond\
    \ the browser.\n\nNode has attracted a lot of hype in part because of its evented\
    \ architecture, built around nonblocking IO, which makes it an efficient alternative\
    \ to web platforms that rely on multithreading. But perhaps more exciting for\
    \ the code-monkey masses is that we can now write for our client and server in\
    \ the same language and even migrate code from one to the other. The techniques\
    \ this allows are only beginning to be explored, ranging from testing to templating\
    \ to validation. Who knows what’s next?\n\nThat, alas, is beyond the realm of\
    \ this humble book, which I hereby congratulate you on completing! You’ve now\
    \ learned to apply CoffeeScript to both front- and back-end environments, using\
    \ its power to provide shorter, clearer code than even the greatest JavaScripter\
    \ could produce (nothing personal, Resig).\n\nConsider yourself a graduate of\
    \ CoffeeScript University, and remember: virtus brevitas!\n\n## 6.6 Exercises\n\
    \n1.  What will this code do?\n\n    ```coffeescript\n    countdown = 10\n   \
    \ h = setInterval (-> countdown--), 100\n    do (->) until countdown is 0\n  \
    \  clearInterval h\n    console.log 'Surprise!'\n    ```\n\n    (Bonus exercise:\
    \ Rewrite this to do what the coder likely intended.)\n\n#### Footnotes\n\n[[44]](#f_0054.html_FNPTR-44)\
