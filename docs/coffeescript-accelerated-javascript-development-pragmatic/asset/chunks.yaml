    # 读者对《CoffeeScript：加速 JavaScript 开发》的评价


    如今很难想象一个不大量使用 JavaScript 的新 Web 应用，但如果你习惯了像 Ruby 这样的语言，处理 JavaScript 会感觉像是明显降级，更像是苦差事而非乐趣。CoffeeScript
    应运而生：它是一个预编译器，去除了 JavaScript 所有不必要的冗长，让编写和阅读变成一种享受。加油，Coffee！这本书是对 CoffeeScript
    世界的绝佳入门。


    | → | David Heinemeier Hansson |

    |  | Rails 创始人 |


    正如 CoffeeScript 本身一样，Trevor 直击要点，向你展示 CoffeeScript 的优势以及如何编写简洁、清晰的 CoffeeScript
    代码。


    | → | Scott Leberknight |

    |  | Near Infinity 首席架构师 |


    尽管 CoffeeScript 是一门新语言，但你几乎到处都能找到它的身影。这本书将向你展示 CoffeeScript 可以多么强大和有趣。


    | → | Stan Angeloff |

    |  | PSP WebTech Bulgaria 董事总经理 |


    这本书帮助读者在学习 CoffeeScript 的过程中成为更好的 JavaScript 开发者。更重要的是，读起来非常过瘾，尤其是当你刚接触 CoffeeScript
    并准备学习时。


    | → | Brendan Eich |

    |  | JavaScript 创始人 |


    CoffeeScript 可能成为 Web 应用开发的伟大创新之一；自从我第一次发现它，就再也不用写一行纯 JavaScript 了。希望这本精彩书籍的读者也能说出同样的话。


    | → | Dr. Nic Williams |

    |  | Mocra CEO/创始人 |


    《CoffeeScript：加速 JavaScript 开发》是来自社区最受尊敬成员之一的优秀 CoffeeScript 指南。无论你编写的是浏览器端还是服务端代码，它都能帮你迅速掌握这门语言。Trevor
    的这本书应该出现在每位 CoffeeScript 开发者的书架上。


    | → | Sam Stephenson |

    |  | Prototype JavaScript 框架创始人 |


    CoffeeScript 是过去几年编程语言世界中最有趣的发展之一。它吸收了 Ruby 和 Python 等语言在过去十年中的经验教训，是一门具有强大表现力的语言。《CoffeeScript：加速
    JavaScript 开发》是你学习这门新语言的指南，也是那些希望高效使用 JavaScript 的人必读之作。


    | → | Travis Swicegood |

    |  | 《Pragmatic Version Control Using Git》作者 |


    Trevor 提供了丰富的语言概述和实际案例，展示了我为何将 CoffeeScript 视为 iOS、Android 和 WebOS 移动开发的秘密武器。


    | → | Wynn Netherland |

    |  | The Changelog 联合主持人 |


    系好安全带，与 Trevor Burnham 一起从 JavaScript 驶向 CoffeeScript，重新享受 Web 开发的乐趣。


    | → | Javier Collado |

    |  | Canonical Ltd. QA 自动化工程师 |


    # 前言


    JavaScript 生而自由，但直到最近，它处处都戴着镣铐。


    JavaScript 从来都不是一种令人愉悦的编程语言：速度极慢，在不同浏览器中实现方式各异，自 1990 年代末以来就停滞在时间的琥珀中。也许你过去曾用它实现下拉菜单或可排序列表，但你可能并不享受这个过程。


    幸运的是，如今的 JavaScript 正迎来当之无愧的复兴。得益于浏览器实现者的不懈努力，它已成为最快的动态主流语言；它无处不在，从服务器到 Photoshop，并且是唯一能全方位编程
    Web 的语言。


    CoffeeScript 是一门小巧的语言，旨在让你轻松触及 JavaScript 的精华部分：一等函数、类似哈希的对象，甚至是被广泛误解的原型链。如果我们做得好，你最终将少写三分之一的代码，却能生成与你原本会编写的
    JavaScript 几乎相同的代码。


    CoffeeScript 高度重视代码的可读性和消除语法杂乱。同时，CoffeeScript 与 JavaScript 之间几乎是一一对应的关系，这意味着不会有性能损失——事实上，许多
    JavaScript 库在移植到 CoffeeScript 后，由于编译器能进行一些优化，运行速度反而更快。


    你很幸运能读到这本书，因为 Trevor 从早期就是 CoffeeScript 的热情贡献者。很少有人比他更了解这门语言的方方面面，以及语言特性与取舍背后的争论历史。这本书是在专家引导下对
    CoffeeScript 的温和介绍。


    我期待听到由此产生的所有激动人心的项目，而且——谁知道呢——也许你会受到启发，创造属于你自己的小语言。


    Jeremy Ashkenas，CoffeeScript 创始人


    2011 年 4 月


    版权所有 © 2011, The Pragmatic Bookshelf.


    # 致谢


    CoffeeScript 是一门年轻的语言。但从一开始，它就吸引了异常多样且充满活力的人群。正是那种美妙的能量——在 IRC、GitHub、Hacker News、博客、Twitter
    和其他地方——激励我写了这本书。感谢每一位在 CoffeeScript 初期就热情拥抱它的人。


    当然，感谢 Jeremy Ashkenas 创造了这门语言，并为本书撰写了慷慨的前言；CoffeeScript 不可能有更好的 BDFL 了。还要感谢 CoffeeScript
    的其他贡献者，他们人数众多，无法在此一一列举。[[1]](#f_0004.html_FOOTNOTE-1)


    感谢技术审阅者——任何遗留的错误完全是我的“锅”。我从 Javier Collado、Kevin Gisi、Darcy Laycock、Scott Leberknight、Sam
    Stephenson、Travis Swicegood、Federico Tomassetti、Stefan Turalski 和 Dr. Nic Williams
    那里获得了有益的反馈。特别感谢 Jeremy Ashkenas（再次）和 Michael Ficarra，他们是 CoffeeScript 项目的核心贡献者，在百忙之中抽出时间纠正了我对语言许多细节的理解。还要感谢
    JavaScript 创始人 Brendan Eich，他亲切地澄清了几个要点。


    感谢 Pragmatic Bookshelf 团队。首先是我的编辑 Michael Swaine，我以称他为编辑为荣。还要感谢执行编辑 Susannah Pfalzer，以及大人物
    Dave Thomas 和 Andy Hunt，他们冒险出版了一本关于鲜为人知语言的书，作者更是名不见经传。


    最后，感谢 Scott 和 Teresa Burnham，我和至少另外两个人通常称他们为“爸爸”和“妈妈”。他们的支持和榜样作用，价值无法估量。


