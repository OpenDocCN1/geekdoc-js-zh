  trans: "\n你不必成为约翰·“JavaScript 忍者”·雷西格。事实上，如果你只是个业余的 JavaScript 爱好者，那太好了！在阅读本书的过程中，你会学到很多\
    \ JavaScript 知识。请查看脚注中我推荐的额外资源链接。如果你是编程新手，一定要看看*《Eloquent JavaScript》*[Hav11]，它也有交互式在线版本。[[8]](#f_0010.html_FOOTNOTE-8)\
    \ 如果你已经涉猎过一些，但想成为专家，可以去 JavaScript 花园。[[9]](#f_0010.html_FOOTNOTE-9) 如果你想要一份全面的参考手册，没有人比\
    \ Mozilla 开发者网络做得更好。[[10]](#f_0010.html_FOOTNOTE-10)\n\n你可能会注意到，我在本书中经常提到 Ruby。Ruby\
    \ 启发了 CoffeeScript 的许多优秀特性，比如隐式返回、展开运算符和后置`if`/`unless`。而且，得益于 Rails 3.1，CoffeeScript\
    \ 在 Ruby 世界中拥有大量追随者。所以，如果你是 Ruby 开发者，那太好了！你已经有了先发优势。如果不是，也别担心；一旦你掌握了一些示例，一切都会水到渠成。\n\
    \n如果书中有任何让你困惑的地方，我鼓励你在本书的论坛上提问。[[11]](#f_0010.html_FOOTNOTE-11) 虽然我力求清晰，但编程语言唯一能完全理解的对象是计算机——而它们几乎不买书。\n\
    \n## 本书的组织方式\n\n我们将从探索编译和运行 CoffeeScript 代码的各种方法开始这段旅程。然后，我们会深入探讨这门语言的细节。每一章都会介绍与我们正在进行的项目相关的概念和约定（见下一节）。\n\
    \n要掌握 CoffeeScript，你需要了解它如何与 JavaScript 生态系统的其他部分协同工作。因此，在学习语言基础之后，我们将简要介绍 jQuery（世界上最流行的\
    \ JavaScript 框架）和 Node.js（一个令人兴奋的新项目，让你可以在浏览器之外运行 JavaScript）。虽然我们不会深入探讨这两个工具，但我们会发现它们与\
    \ CoffeeScript 的搭配就像巧克力和花生酱一样完美。通过结合它们的力量，我们只需几个小时就能编写一个完整的多人游戏。\n\n无论你处于什么水平，一定要完成每章末尾的练习。这些练习设计得既快速又具有挑战性，展示了\
    \ CoffeeScript 开发者最容易陷入的一些常见陷阱。在查看附录 A《练习答案》之前，请尝试自己解决。\n\n本书中展示的代码、勘误和讨论论坛都可以在\
    \ PragProg 页面上找到：[`pragprog.com/titles/tbcoffee/coffeescript`](http://pragprog.com/titles/tbcoffee/coffeescript)。\n\
    \n## 关于示例项目：5x5\n\n| ![images/compare5x5.png](img/compare5x5.png) |\n\n|  \n\n\
    * * *\n\n**图 1. 在控制台和网页版本的项目中，游戏逻辑代码是相同的。** |\n\n每章的最后一节会将新概念应用到一个名为 5x5 的原创文字游戏中。顾名思义，5x5\
    \ 是在一个 5 格宽、5 格高的网格上进行的。游戏开始时，每个格子上随机放置一个字母。然后玩家轮流交换网格上的字母，根据交换后形成的所有单词计分（每次交换的两个格子可能各形成四个单词：一个水平方向、一个垂直方向、两个对角线方向——只有从左到右的对角线算数）。\n\
    \n计分基于所形成单词中字母的 Scrabble 分值，并根据形成的不同单词数量乘以倍数。因此，在极限情况下，如果一次移动形成了八个单词，那么每个单词的分值都会乘以八。游戏中已经使用过的单词不计分。\n\
    \n我们将在第 2-4 章构建一个命令行版本的游戏，然后在第 5 章《使用 jQuery 实现网页交互》中将其迁移到浏览器，最后在第 6 章《使用 Node.js\
    \ 构建服务器端应用》中添加多人游戏功能。将代码从命令行迁移到浏览器再到服务器将非常容易——它们都使用同一种语言！\n\n## CoffeeScript 社区\n\
    \n没有强大的社区，再好的语言也用处不大。如果你遇到问题，该找谁呢？\n\n在 StackOverflow 上提问（记得给你的问题加上`coffeescript`标签）是获得帮助的绝佳方式，尤其是当你附上困扰你的代码片段时。[[12]](#f_0010.html_FOOTNOTE-12)\
    \ 如果你需要更即时的答案，通常可以在 Freenode IRC 的`#coffeescript`频道找到友好的人。如果想轻松讨论 CoffeeScript\
    \ 的各种话题，可以试试 Google Group。[[13]](#f_0010.html_FOOTNOTE-13) 对于更严重的问题，比如可能的 bug，你应该在\
    \ GitHub 上创建一个 issue。[[14]](#f_0010.html_FOOTNOTE-14) 你也可以在那里请求新的语言特性。CoffeeScript\
    \ 仍在发展中，整个团队欢迎反馈。\n\n文档呢？你可能已经看过[`coffeescript.org`](http://coffeescript.org)上漂亮的官方文档了。还有一个官方维基：[`github.com/jashkenas/coffee-script/wiki`](http://github.com/jashkenas/coffee-script/wiki)。现在，还有这本书。\n\
    \n这就说到我了。我在 Twitter 上运营@CoffeeScript；你可以通过 Twitter 联系我，或者通过老式的电子邮件：trevorburnham@gmail.com。\n\
    \n对于 Web 开发来说，这是一个激动人心的时代。欢迎加入！\n\n#### 脚注\n\n| [[2]](#f_0005.html_FNPTR-2) |\
    \ 参见 Peter Seibel 对 JavaScript 创始人 Brendan Eich 的访谈，收录于《Coders at Work》[Sei09]。\
    \ |\n\n| [[3]](#f_0005.html_FNPTR-3) | [`wtfjs.com/`](http://wtfjs.com/) |\n\n\
    | [[4]](#f_0006.html_FNPTR-4) | [`www.javascriptlint.com/`](http://www.javascriptlint.com/)\
    \ |\n\n| [[5]](#f_0006.html_FNPTR-5) | [`www.paulgraham.com/power.html`](http://www.paulgraham.com/power.html)\
    \ |\n\n| [[6]](#f_0006.html_FNPTR-6) | [`documentcloud.github.com/backbone/`](http://documentcloud.github.com/backbone/)\
    \ |\n\n| [[7]](#f_0006.html_FNPTR-7) | [`www.codinghorror.com/blog/2009/07/meta-is-murder.html`](http://www.codinghorror.com/blog/2009/07/meta-is-murder.html)\
    \ |\n\n| [[8]](#f_0007.html_FNPTR-8) | [`eloquentjavascript.net/`](http://eloquentjavascript.net/)\
    \ |\n\n| [[9]](#f_0007.html_FNPTR-9) | [`javascriptgarden.info/`](http://javascriptgarden.info/)\
    \ |\n\n| [[10]](#f_0007.html_FNPTR-10) | [`developer.mozilla.org/en/JavaScript/Guide`](https://developer.mozilla.org/en/JavaScript/Guide)\
    \ |\n\n| [[11]](#f_0007.html_FNPTR-11) | [`forums.pragprog.com/forums/169`](http://forums.pragprog.com/forums/169)\
    \ |\n\n| [[12]](#f_0010.html_FNPTR-12) | [`stackoverflow.com`](http://stackoverflow.com)\
    \ |\n\n| [[13]](#f_0010.html_FNPTR-13) | [`groups.google.com/forum/#!forum/coffeescript`](http://groups.google.com/forum/#!forum/coffeescript)\
    \ |\n\n| [[14]](#f_0010.html_FNPTR-14) | [`github.com/jashkenas/coffee-script/issues`](http://github.com/jashkenas/coffee-script/issues)\
    \ |\n\n版权所有 © 2011，The Pragmatic Bookshelf。\n\n# 第 1 章\n\n## 开始\n\n如果你读过前言，那么你现在已经知道\
    \ CoffeeScript 是什么、它从何而来，以及为什么它是自 Herman Miller 以来程序员遇到的最好的东西。但你还没有真正写过一行代码。等待是难以忍受的，对吧？\n\
    \n好吧，深呼吸；时候到了。在本章中，我们将把 CoffeeScript 安装到你的系统上，让你的编辑器跟上节奏，最后运行一些代码！\n\n### 1.1\
    \ 安装 CoffeeScript\n\nCoffeeScript 编译器是用 CoffeeScript 编写的。这带来了一个先有鸡还是先有蛋的问题：我们如何在没有\
    \ CoffeeScript 编译器的系统上运行编译器？要是能在没有网页浏览器的情况下在你的机器上运行 JavaScript，并让代码访问本地文件系统就好了……\n"
