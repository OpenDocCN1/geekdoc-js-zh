    \ an amateur JavaScripter, great! You’ll learn a lot about JavaScript as you go\
    \ through this book. Check the footnotes for links to additional resources that\
    \ I recommend. If you’re new to programming entirely, you should definitely check\
    \ out *Eloquent JavaScript* [Hav11], which is also available in an interactive\
    \ online format.[[8]](#f_0010.html_FOOTNOTE-8) If you’ve dabbled a bit but want\
    \ to become an expert, head to the JavaScript Garden.[[9]](#f_0010.html_FOOTNOTE-9)\
    \ And if you want a comprehensive reference, no one does it better than the Mozilla\
    \ Developer Network.[[10]](#f_0010.html_FOOTNOTE-10)\n\nYou may notice that I\
    \ talk about Ruby a lot in this book. Ruby inspired many of CoffeeScript’s great\
    \ features, like implicit returns, splats, and postfix `if`/`unless`. And thanks\
    \ to Rails 3.1, CoffeeScript has a huge following in the Ruby world. So if you’re\
    \ a Rubyist, great! You’ve got a head start. If not, don’t sweat it; everything\
    \ will fall into place once you have a few examples under your belt.\n\nIf anything\
    \ in the book doesn’t make sense to you, I encourage you to post a question about\
    \ it on the book’s forum.[[11]](#f_0010.html_FOOTNOTE-11) While I try to be clear,\
    \ the only entities to whom programming languages are completely straightforward\
    \ are computers—and they buy very few books.\n\n## How This Book Is Organized\n\
    \nWe’ll start our journey by discovering the various ways that we can compile\
    \ and run CoffeeScript code. Then we’ll delve into the nuts and bolts of the language.\
    \ Each chapter will introduce concepts and conventions that tie into our ongoing\
    \ project (see the next section).\n\nTo master CoffeeScript, you’ll need to know\
    \ how it works with the rest of the JavaScript universe. So after learning the\
    \ basics of the language, we’ll take brief tours of jQuery, the world’s most popular\
    \ JavaScript framework, and Node.js, an exciting new project that lets you run\
    \ JavaScript outside of the browser. While we won’t go into great depth with either\
    \ tool, we’ll see that they go with CoffeeScript like chocolate and peanut butter.\
    \ And by combining their powers, we’ll be able to write an entire multiplayer\
    \ game in just a few hours.\n\nNo matter what level you’re at, be sure to do the\
    \ exercises at the end of each chapter. They’re designed to be quick yet challenging,\
    \ illustrating some of the most common pitfalls CoffeeScripters fall into. Try\
    \ to solve them on your own before you check the answers in Appendix A, [​*Answers\
    \ to Exercises*​](#f_0060.html_app.answers).\n\nThe code presented in this book,\
    \ as well as errata and discussion forums, can be found on its PragProg page:\
    \ [http://pragprog.com/titles/tbcoffee/coffeescript](http://pragprog.com/titles/tbcoffee/coffeescript).\n\
    \n## About the Example Project: 5x5\n\n| ![images/compare5x5.png](images/compare5x5.png)\
    \ |\n\n|  \n\n* * *\n\n**Figure 1\\. In the console and web versions of our project,\
    \ the game logic code will be the same.** |\n\nThe last section of each chapter\
    \ applies the new concepts to an original word game called 5x5. As its name suggests,\
    \ 5x5 is played on a grid five tiles wide and five tiles high. Each tile has a\
    \ random letter placed on it at the start. Then the players take turns swapping\
    \ letters on the grid, scoring points for all words formed as a result of the\
    \ swap (potentially, this can be four words at each of the two swapped tiles:\
    \ one running horizontally, one vertically, and two diagonally—only left-to-right\
    \ diagonals count).\n\nScoring is based on the Scrabble point value of the letters\
    \ in the formed words, with a multiplier for the number of distinct words formed.\
    \ So, at the upper limit, if eight words are formed in one move, then the point\
    \ value of each is multiplied by eight. Words that have already been used in the\
    \ game don’t count.\n\nWe’ll build a command-line version of the game in Chapters\
    \ 2--4, then move it to the browser in Chapter 5, [​*Web Interactivity with jQuery*​](#f_0045.html_chp.jquery),\
    \ and finally add multiplayer capability in Chapter 6, [​*Server-Side Apps with\
    \ Node.js*​](#f_0053.html_chp.nodejs). Moving the code from the command line to\
    \ the browser to the server will be super-easy—they all speak the same language!\n\
    \n## The CoffeeScript Community\n\nA great language is of little use without a\
    \ strong community. If you run into problems, who you gonna call?\n\nPosting a\
    \ question to StackOverflow (being sure to tag your question `coffeescript`) is\
    \ a terrific way to get help, especially if you post a snippet of the code that’s\
    \ hassling you.[[12]](#f_0010.html_FOOTNOTE-12) If you need a more immediate answer,\
    \ you can usually find friendly folks in the `#coffeescript` channel on Freenode\
    \ IRC. For relaxed discussion of CoffeeScript miscellany, try the Google Group.[[13]](#f_0010.html_FOOTNOTE-13)\
    \ For more serious problems, such as possible bugs, you should create an issue\
    \ on GitHub.[[14]](#f_0010.html_FOOTNOTE-14) You can also request new language\
    \ features there. CoffeeScript is still evolving, and the whole team welcomes\
    \ feedback.\n\nWhat about documentation? You’ve probably already seen the snazzy\
    \ official docs at [http://coffeescript.org](http://coffeescript.org). There’s\
    \ also an official wiki at [http://github.com/jashkenas/coffee-script/wiki](http://github.com/jashkenas/coffee-script/wiki).\
    \ And now there’s this book.\n\nWhich brings us to me. I run @CoffeeScript on\
    \ Twitter; you can reach me there, or by good old-fashioned email at trevorburnham@gmail.com.\n\
    \nThese are exciting times for web development. Welcome aboard!\n\n#### Footnotes\n\
