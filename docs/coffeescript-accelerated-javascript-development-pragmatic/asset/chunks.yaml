    not allowed. If you try, you’ll get `SyntaxError: cannot include a pure statement
    in an expression`. This is jargon for saying that it doesn’t make sense to say
    `a = return x`, so the compiler won’t allow it as a possibility.)


    CoffeeScript also makes several syntactic changes, in part to remind JavaScripters
    of these hidden differences: `when` is used instead of `case` and `else` instead
    of `default`. (The keywords are borrowed from Ruby, where the `case` structure
    has similar semantics.) A single `when` can be followed by several potential matches,
    delimited by commas. Also, instead of `:`, those match clauses are separated from
    their outcomes by indentation (or `then`).


    Here’s how it all comes together in a simple factory function:


    |   | `requisitionStarship = (captain)` **`->`** |


    |   | **`switch`** `captain` |


    |   | **`when`***`''Kirk''`*`,` *`''Picard''`*`,` *`''Archer''`* |


    |   | **`new`** `Enterprise()` |


    |   | **`when`***`''Janeway''`* |


    |   | **`new`** `Voyager()` |


    |   | **`else`** |


    |   | **`throw`****`new`** `Error(`*`''Invalid starship captain''`*`)` |


    That’s it for our coverage of modules and classes. Just remember: CoffeeScript
    certainly doesn’t require you to use classes or classical object-oriented design
    patterns—most JavaScript developers do perfectly fine without either, after all—but
    for some applications, classes feel like a natural fit.


    Speaking of which, remember that mess of code from the project in the last chapter?
    Let’s see what we can do about it.


    ## 4.5 Project: Refactoring 5x5


    Classes give a nice clean way to reorganize the code we’ve written so far, to
    encourage modularity and extensibility. Let’s create three classes:


    1.  `Dictionary`, which can find valid words on the grid


    2.  `Grid`, which manages the letter tiles


    3.  `Player`, which keeps track of a player’s score


    We’ll save these classes in three different `coffee` files. Also, we’ll make these
    classes compatible with all major browser environments as well as with Node.js,
    paving the way for the jQuery version of the game in the next chapter. To make
    the game playable under Node, we’ll have a `console.coffee` file that provides
    a prompt and `require`s the three classes.


    ### The Dictionary Class


    Because we want to support browsers, it makes sense to convert our word list from
    a text file to JavaScript code that can be loaded directly. I wrote a short script
    to do just that:


    | [Classes/5x5/convert.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/convert.coffee)
    |


    |   | `fs = require` *`''fs''`* |


    |   | `owl2 = fs.readFileSync` *`''OWL2.txt''`*`,` *`''utf8''`* |


    |   | `wordList = owl2.match /^(\w+)/mg` |


    |   | `fileContents =` *`"""`* |


    |   | *`root = typeof exports === "undefined" ? window : exports;`* |


    |   | *`root.OWL2 = [''`*`#{wordList.join` *`"'',\n''"`*`}`*`'']`* |


    |   | *`"""`* |


    |   | `fs.writeFile` *`''OWL2.js''`*`, fileContents` |


    The triple-quote `"""` syntax, which should be familiar to Python coders, is called
    a heredoc string. It allows you to write multiline strings in a human-readable
    format. You can also use three single quotes, `”’`, to delimit a heredoc string.
    The difference between `"""` and `”’` is the same as the difference between `"`
    and `’`: The former allows interpolation, while the latter does not.


    After running the script, the resulting `OWL2.js` looks like this:


    |   | `root =` **`typeof`** `global ===` *`"undefined"`* `? window : global;`
    |


    |   | `root.OWL2 = [`*`''AA''`*`,` |


    |   | `...` |


    |   | *`''ZOOGEOGRAPHICAL''`*`];` |


    (I’ve omitted the middle 178,687 lines for the sake of brevity.)


    Now, in order to decouple `Dictionary` from Node, let’s have the word list and
    the game’s grid get passed in to `Dictionary`’s constructor:


    | [Classes/5x5/Dictionary.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Dictionary.coffee)
    |


    |   | **`class`** `Dictionary` |


    |   | `constructor: (@originalWordList, grid)` **`->`** |


    |   | `@setGrid grid` **`if`** `grid?` |


    Note the implicit assignment of the first argument to `@originalWordList` (a feature
    we covered back in Section 2.4, [​*Property Arguments (@arg)*​](#f_0021.html_sec.propertyArguments)).


    When a new game starts, we’ll call `setGrid` ourselves with the new grid. This
    grid could be of a different size, so we’ll copy and filter our original word
    list each time (`slice(0)` is a well-known trick for copying JavaScript arrays):


    | [Classes/5x5/Dictionary.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Dictionary.coffee)
    |


    |   | `setGrid: (@grid)` **`->`** |


    |   | `@wordList = @originalWordList.slice(0)` |


    |   | `@wordList = (word` **`for`** `word` **`in`** `@wordList` **`when`** `word.length
    <= @grid.size)` |


    |   | `@minWordLength = Math.min.apply Math, (w.length` **`for`** `w` **`in`**
    `@wordList)` |


    |   | `@usedWords = []` |


    |   | **`for`** `x` **`in`** `[0...@grid.size]` |


    |   | **`for`** `y` **`in`** `[0...@grid.size]` |


    |   | `@markUsed word` **`for`** `word` **`in`** `@wordsThroughTile x, y` |


    Notice that we also reset the `usedWords` list here. We’ll want a way of indicating
    that a word has been used:


    | [Classes/5x5/Dictionary.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Dictionary.coffee)
    |


    |   | `markUsed: (str)` **`->`** |


    |   | **`if`** `str` **`in`** `@usedWords` |


    |   | **`false`** |


    |   | **`else`** |


    |   | `@usedWords.push str` |


    |   | **`true`** |


    Let’s provide one method that says whether a word is valid and another that says
    whether a word is usable at this point in the game:


    | [Classes/5x5/Dictionary.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Dictionary.coffee)
    |


    |   | `isWord: (str)` **`->`** `str` **`in`** `@wordList` |


    |   | `isNewWord: (str)` **`->`** `str` **`in`** `@wordList and str not` **`in`**
    `@usedWords` |


    Here’s the hard part: given a pair of coordinates, we’d like to be able to find
    all words that go through that tile of the `Grid` instance. I’ll spare you the
    excerpt, since it’s basically the same as our `wordsThroughTile` function from
    the last chapter.


    Now in order to make the class accessible, let’s make it a global:


    | [Classes/5x5/Dictionary.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Dictionary.coffee)
    |


    |   | `root = exports ? window` |


    |   | `root.Dictionary = Dictionary` |


    ### The Grid Class


    Before we define the `Grid` class, let’s put some other variables in `grid.coffee`,
    giving them module scope:


    | [Classes/5x5/Grid.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Grid.coffee)
    |


    |   | `tileCounts =` |


    |   | `A: 9, B: 2, C: 2, D: 4, E: 12, F: 2, G: 3, H: 2, I: 9, J: 1, K: 1, L: 4`
    |


    |   | `M: 2, N: 6, O: 8, P: 2, Q: 1, R: 6, S: 4, T: 6, U: 4, V: 2, W: 2, X: 1`
    |


    |   | `Y: 2, Z: 1` |


    |   |  |


    |   | `totalTiles = 0` |


    |   | `totalTiles += count` **`for`** `letter, count` **`of`** `tileCounts` |


    |   | `alphabet = (letter` **`for`** `letter` **`of`** `tileCounts).sort()` |


    |   |  |


    |   | `randomLetter =` **`->`** |


    |   | `randomNumber = Math.ceil Math.random() * totalTiles` |


    |   | `x = 1` |


    |   | **`for`** `letter` **`in`** `alphabet` |


    |   | `x += tileCounts[letter]` |


    |   | **`return`** `letter` **`if`** `x > randomNumber` |


    When we instantiate a grid, let’s generate its initial `tiles` matrix automatically:


    | [Classes/5x5/Grid.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Grid.coffee)
    |


    |   | **`class`** `Grid` |


    |   | `constructor:` **`->`** |


    |   | `@size = size = 5` |


    |   | `@tiles =` **`for`** `x` **`in`** `[0...size]` |'
