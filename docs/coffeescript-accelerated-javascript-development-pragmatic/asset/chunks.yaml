  trans: "\n`%` 是模运算符；它返回除法后的余数。`is` 关键字编译为 JavaScript 的 `===`，即严格相等运算符。（没有与 JavaScript\
    \ 的 `==` 对应的运算符；请参阅 *严格相等或什么都不做*。）因此，如果给定的数字是一个不能被 2 整除的正整数，`odd` 将返回 `true`，否则返回\
    \ `false`。（因为 `%` 会将其值强制转换为数字，所以对于字符串 `'3'` 这样的值，`odd` 也会返回 `true`。）\n\n### 严格相等或什么都不做\n\
    \nCoffeeScript 的 `is` 和 `==` 都编译为 JavaScript 的 `===`；无法获得 JavaScript 的 `==` 那种宽松的、类型强制转换的相等性检查，这种检查被\
    \ JSLint 等工具视为许多“WTF？”时刻的根源。让我们借用 [`wtfjs.com/2011/02/11/all-your-commas-are-belong-to-Array`](http://wtfjs.com/2011/02/11/all-your-commas-are-belong-to-Array)\
    \ 中的一个例子：\n\n```\n\",,,\" == new Array(4) // true\n'' == '0' // false\n0 == ''\
    \ // true\n0 == '0' // true\n```\n\n为了避免这些令人困惑的情况，你应该显式地进行类型转换。\n\n在大多数情况下，这会被认为是一个非常好的奇偶性检查。但假设你正在编写一个具有非常严格规范的数学库，该规范规定如果函数接收到的值不是严格的正整数，则应该抛出异常。我们可以通过使用条件语句来实现，如下所示：\n\
    \n```\n# Functions/odd.coffee\nodd = (num) ->\n  if typeof num is 'number'\n \
    \   if num is Math.round num\n      if num > 0\n        num % 2 is 1\n      else\n\
    \        throw \"#{num} is not positive\"\n    else\n      throw \"#{num} is not\
    \ an integer\"\n  else\n    throw \"#{num} is not a number\"\n```\n\n注意使用有意义的缩进来界定函数和每个条件分支，而不是\
    \ JavaScript 的花括号。在 CoffeeScript 中，花括号只用于一件事：声明 JSON 风格的对象。（更多内容将在下一章中介绍。）\n\n\
    现在，如果你尝试用非正整数的参数调用 `odd`，你将得到 `undefined`（因为 `throw` 语句没有返回值）。为了实际看到错误消息，你需要使用\
    \ `try...catch` 块：\n\n```\n# Functions/odd.coffee\ntry\n  odd 5.1\ncatch e\n \
    \ console.log e\n# 5.1 is not an integer\n```\n\n我们可以通过依次检查三个条件来改进 `odd` 函数的风格：\n\
    \n```\n# Functions/odd.coffee\nodd = (num) ->\n  unless typeof num is 'number'\n\
    \    throw \"#{num} is not a number\"\n  unless num is Math.round num\n    throw\
    \ \"#{num} is not an integer\"\n  unless num > 0\n    throw \"#{num} is not positive\"\
    \n  num % 2 is 1\n```\n\n（如果这些行不那么长，我们会使用后缀风格 `throw a unless b`，而不是缩进风格。）通常，只要条件导致\
    \ `throw` 或 `return`，我们就可以将分支逻辑简化为简单的系列检查。\n\n当然，函数不仅限于返回值或抛出异常；它们还可以通过修改变量和运行其他函数来执行操作。（在函数式编程术语中，这些被称为副作用。）这些行为与你在\
    \ JavaScript 中预期的一样：\n\n```\ncount = 0\nincrementCount = -> count++\nincrementCount()\
    \ # count is now 1\n```\n\n现在你已经了解了在 CoffeeScript 中定义和调用函数的基础知识。但细节决定成败，让我们来看一个最重要的细节：变量在哪里可见？\n\
    \n## 2.2 作用域：你在哪里看到它们\n\n到目前为止，我们还没有担心过变量存在于何处。唉，我们不能总是如此漫不经心。考虑这个例子：\n\n```\n\
    age = 99\nreincarnate = -> age = 0\nreincarnate()\nconsole.log \"I am #{age} years\
    \ old\"\n```\n\n正如你可能预期的，输出是这样的：\n\n```\nI am 0 years old\n```\n\n然而，我们可以尝试交换第一行和第二行，像这样：\n\
    \n```\nreincarnate = -> age = 0\nage = 99\nreincarnate()\nconsole.log \"I am #{age}\
    \ years old\"\n```\n\n现在点击运行，代码讲述了一个截然不同的故事：\n\n```\nI am 99 years old\n```\n\n\
    奇怪——`reincarnate()` 调用没有任何效果！如果我们完全去掉 `age = 99` 呢？\n\n```\nreincarnate = -> age\
    \ = 0\nreincarnate()\nconsole.log \"age = #{age}\"\n```\n\n```\nReferenceError:\
    \ age is not defined\n```\n\n我们遇到了一个“作用域”问题！但什么是作用域？变量的作用域就是它的家，由三条规则定义：\n\n1.\
    \ 每个函数都会创建一个作用域，而创建作用域的唯一方法是定义一个函数。\n2. 变量存在于对其进行了赋值的最外层作用域中。\n3. 在其作用域之外，变量是不可见的。\n\
    \n例如，第一个例子中 `age` 的作用域是全局作用域；中间的例子中，全局作用域中有一个名为 `age` 的变量，`reincarnate` 函数的作用域中也有一个；最后一个例子中，只有\
    \ `reincarnate` 作用域内的 `age`。这就是为什么我们尝试在 `reincarnate` 外部显示 `age` 时得到了 `ReferenceError`：在该函数外部不存在同名的变量。\n\
    \nCoffeeScript 的作用域方法被称为词法作用域，与 JavaScript 相同，不同之处在于 JavaScript 使用 `var` 关键字显式定义变量的作用域，而\
    \ CoffeeScript 从赋值中推断作用域。这不仅节省了你宝贵的手指劳动，还阻止了你通过在嵌套作用域中给不同变量起相同名称来遮蔽变量。请参阅 *遮蔽：同名之惑*。\n\
    \n### 遮蔽：同名之惑\n\n在 CoffeeScript 中，只有两种方式可以遮蔽变量：一种是在内部作用域变量之后，在外部作用域中创建一个变量，正如我们在第二个\
    \ `reincarnate` 例子中看到的那样。另一种方式是通过函数参数：\n\n```\nx = 5\ntriple = (x) -> x *= 3\n\
    triple x # 15\nx # 5\n```\n\n遮蔽通常被认为是不良风格，应该避免。给你的变量起不同的名字，以免埋下作用域混乱的种子。\n\n函数的作用域嵌套在函数本身所在的作用域中。（记住，函数只是变量。）这是关于作用域需要理解的另一个重要点：它不依赖于函数被调用的位置或方式。你总是可以通过查看代码或编译为\
    \ JavaScript 并查找 `var` 声明来判断某个东西存在于哪个作用域中，这些 `var` 声明总是放在其作用域的顶部：\n\n```\nsingCountdown\
    \ = (count) ->\n  singBottleCount = (specifyLocation) ->\n    locationStr = if\
    \ specifyLocation then 'on the wall' else ''\n    bottleStr = if count is 1 then\
    \ 'bottle' else 'bottles'\n    console.log \"#{count} #{bottleStr} of beer #{locationStr}\"\
    \n  singDecrement = ->\n    console.log \"Take one down, pass it around\"\n  \
    \  count--\n  singBottleCount true; singBottleCount false\n  singDecrement();\
    \ singBottleCount true\n```\n"
- fmt: "\n`if count isnt 0 then singCountdown count`\n\nThis example yields the following\
    \ (omitting everything but the `function`s that create scope and the `var`s that\
    \ inhabit them):\n\n```\nvar singCountdown;\nsingCountdown = function(count) {\n\
    \  var singBottleCount, singDecrement;\n  singBottleCount = function(specifyLocation)\
    \ {\n    var bottleStr, locationStr;\n    // ...\n  }\n  // ...\n}\n```\n\nYou\
    \ might be wondering, “How do I give a variable a scope without making an assignment?”\
    \ The answer is, you don’t. Instead, you make an assignment, traditionally with\
    \ `null` or some more sensible initial value. Here’s an example:\n\n```\nobj =\
    \ null\ninitializeObj = ->\n  obj = ... # create object with superpowers\n  window.onload\
    \ = initializeObj\n```\n\nThat does it for our discussion of scope in CoffeeScript.\
    \ And now for something completely different: `this`.\n\n## 2.3 Context (or, “What\
    \ Is `this`?”)\n\nScope and context are kissing cousins, but don’t get ’em mixed\
    \ up. While scope is about which variable an identifier is referring to, context\
    \ (also known as the receiver) is about the `this` keyword—and its handy CoffeeScript\
    \ shorthand, `@`.\n\nJavaScript and CoffeeScript newcomers often find `this` baffling.\
    \ Used rightly, it feels like magic. Used wrongly, it may be unrivaled as a source\
    \ of errors. No doubt some of the confusion stems from the word itself; people\
    \ expect `this` to refer to “this object.” Instead, you should think of it as\
    \ “this context.” And as we’ll soon see, the context (aka `this`/`@`) can be something\
    \ different every time a function is called.\n\n(Before we go on, I should note\
    \ that using the term context to describe `this`, while popular, is not standard.\
    \ Some frown on it because the JavaScript specification defines something called\
    \ execution context, which is related but different. Unfortunately, there is no\
    \ other universally agreed-upon term for the value of `this`, so throughout this\
    \ book, I’ll continue to refer to it as the context.)\n\nLet’s go through some\
    \ examples using this simple function:\n\n[Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)\n\
    \n```\nsetName = (name) -> @name = name\n```\n\nHere, `name` and `@name` are totally\
    \ different variables: `name` (which we could call anything, really) is a local\
    \ variable, one that will never be visible outside of the function, while `@name`\
    \ (shorthand for `this.name`) is a property of the context.\n\nThe main purpose\
    \ of context is to give an object’s methods (functions attached as properties)\
    \ a way of referring to the object they’re being called on:\n\n[Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)\n\
    \n```\ncat = {}\ncat.setName = setName\ncat.setName 'Mittens'\nconsole.log cat.name\
    \ # 'Mittens'\n```\n\nWhen we call `cat.setName`, we’re calling `setName` with\
    \ the `cat` object as its context; thus `this` (or `@`) refers to the cat, and\
    \ `@name` refers to `cat.name`. The function itself hasn’t changed. We could call\
    \ the following:\n\n```\nsetName 'Mr. Mistoffelees'\n```\n\nAnd it would have\
    \ no effect on `cat`.\n\nWe can invoke a function in a particular context without\
    \ attaching the function to that object by using the `call` or `apply` methods,\
    \ which all functions have. (If you’re fuzzy on how properties work in JavaScript\
    \ or surprised to learn that functions are objects, then you may want to skip\
    \ ahead to Section 3.1, [​*Objects as Hashes*​](#f_0028.html_sec.objects) and\
    \ then come back.) `apply` takes a context and an array of arguments to pass to\
    \ the function:\n\n[Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)\n\
    \n```\npig = {}\nsetName.apply pig, ['Babe']\nconsole.log pig.name # 'Babe'\n\
    ```\n\n`call` works the same way, except that it takes individual arguments rather\
    \ than a single array. So the equivalent of the previous would be this:\n\n```\n\
    setName.call pig, 'Babe'\n```\n\nIn practice, `apply` is more commonly used than\
    \ `call` because it’s more versatile: `call` only lets you change the context\
    \ of a normal function call, while `apply` lets you change the context and pass\
    \ in an arbitrary number of arguments.\n\nYou can use `call` and `apply` to “borrow”\
    \ one object’s methods and use them on another:\n\n[Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)\n\
    \n```\nhorse = {}\ncat.setName.apply horse, ['Mr. Ed']\nconsole.log horse.name\
    \ # 'Mr. Ed'\n```\n\nHere, it doesn’t matter that we’re using `cat.setName` instead\
    \ of `setName`: they’re the same function.\n\nFinally, one last way of giving\
    \ a function a context is with `new`, which creates a new object using the function\
    \ as a constructor:\n\n[Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)\n\
    \n```\nDog = setName # By convention, constructors are capitalized\ndog1 = new\
    \ Dog('Jimmy')\ndog2 = new Dog('Jake')\nconsole.log dog1.name # 'Jimmy'\nconsole.log\
    \ dog2.name # 'Jake'\n```\n\nThe `new` keyword says, “Don’t return the result\
    \ of the function; instead, create a new object, run the function in that object’s\
    \ context, and then return the object.” (We can also give the object created by\
    \ `new` additional properties using a prototype, as we’ll see in Section 4.2,\
    \ [​*The Power of Prototypes*​](#f_0039.html_sec.prototypes).) Because the `new`\
    \ keyword sets the new `Dog` as the context, `@name` points to the new dog’s `name`\
    \ property.\n\nIf a function isn’t called as a method and you don’t use the `new`\
    \ keyword or `call`/`apply`, then the context is the global object. We’ll learn\
    \ more about the global context in Section 4.1, [​*Modules: Splitting Up Apps*​](#f_0038.html_sec.modules);\
    \ for now, just remember that it’s generally a bad idea to use `this` when it’s\
    \ pointing at the global object:\n\n[Functions/setName.coffee](http://media.pragprog.com/titles/tbcoffee/code/Functions/setName.coffee)\n\
    \n```\nsetName 'Lulu'\nconsole.log name # 'Lulu'\nconsole.log @name # undefined\n\
    ```\n\nSo, you see that context is determined purely by how a function is called;\
    \ unlike scope, it has nothing to do with where the function is defined. (Of course,\
    \ we’d often like for the context to be determined by where the function is defined.\
    \ Fortunately, there’s a clever technique that lets us effectively do this, one\
    \ we’ll meet in [​*Bound Functions: ’this’ Means ’this’*​](#f_0020.html_sec.boundFunctions).)\n\
    \nTo review, here are the CoffeeScript rules of context in a nutshell, with earlier\
    \ rules taking precedence over later ones:\n\n1.  When the `new` keyword is put\
    \ in front of a function call, its context is the new object.\n\n2.  When a function\
    \ is called with `call` or `apply`, the context is the first argument given.\n\
    \n3.  Otherwise, if a function is called as an object property (`obj.func`) or\
    \ `obj['func']`), it runs in that object's context.\n\n4.  If none of the above\
    \ apply, then the function runs in the global context.\n\nWe’ll learn more about\
    \ the global context in Section 4.1, [​*Modules: Splitting Up Apps*​](#f_0038.html_sec.modules).\n\
    \n### Bound Functions: `this` Means `this`\n\nSometimes you want a function to\
    \ run in the current context no matter how it's called. This is especially common\
    \ with event callbacks. Let's say that you want someone to leave a message in\
    \ your `voicemail` array (bound to the current context). Then you might write\
    \ something like this:\n\n```\ncallback = (message) -> @voicemail.push message\n\
    ```\n"
