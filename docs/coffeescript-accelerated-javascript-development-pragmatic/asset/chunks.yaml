    The code example can be solved by writing `xInContext.call what`.


    7. The code fails because of the `x = x`, which is a no-op. Here’s the problem
    part again:


    ```

    x = true

    showAnswer = (x = x) ->

    console.log if x then ''It works!'' else ''Nope.''

    showAnswer()

    ```


    Recall that the default argument syntax `a = b` is equivalent to placing `a ?=
    b` at the top of the function body; there’s no way to bring the `x` from the outer
    scope into the function. The solution is to either use `showAnswer x` or to ditch
    the shadowing.


    ## A1.2 Collections and Iteration


    Answers to Section 3.9, [​*Exercises*​](#f_0036.html_sec.collectionsExercises):


    1. When you use `slice`, the result is a new array containing some or all of the
    items from the original array; adding, removing, or replacing items in the new
    array will not affect the original. That’s why you’ll see `arr.slice[0..]` in
    a lot in functions—when someone passes you an array and you want to modify it
    for your own purposes, working with a copy is just common courtesy.


    2. In the following code it’s important to realize that `once` is only called,
    well, `once()`:


    ```

    once = ->

    if once.hasRun

    null

    else

    once.hasRun = true

    [1, 2, 3]

    console.log x for x in once()

    ```


    That last line is equivalent to this:


    ```

    onceResult = once()

    console.log x for x in onceResult

    ```


    In short, CoffeeScript takes care of caching the function result automatically
    in a `for` loop. If you want to call a function on each loop iteration, you should
    use `while` or `until`.


    3. Look at this section:


    ```

    for x in [1, 2]

    setTimeout (-> console.log x), 50

    ```


    This gives the following output:


    ```

    2

    2

    ```


    What’s going on? The key here is that there’s only one `x` variable. The timeout
    is invoked after the loop has finished and `x` has been set to `2`; it doesn’t
    matter what the value of `x` was when the function was declared.


    Changing the timeout to `0` has no effect because `setTimeout` always adds its
    target to the “event queue,” which isn’t invoked until after all other code has
    run.


    The easiest solution is to use `do` to capture the value of `x` in each loop iteration:


    ```

    for x in [1, 2]

    do (x) ->

    setTimeout (-> console.log x), 50

    ```


    4. Here’s a function that checks whether a particular value is attached to the
    given object:


    ```

    objContains = (obj, match) ->

    for k, v of obj

    if v is match

    return true

    false

    ```


    Note that `k` is unused but necessary; the `of` syntax always goes in the order
    `key, value`, and we want that value.


    In practice, you should be writing your code so that this sort of loop is unnecessary.
    The whole point of the hash structure is that fetching values is fast when you
    know the corresponding key. If you’re frequently checking whether a value is in
    a hash or not, you should be using a different data structure.


    5. To run a function once and then repeat it until a condition is called, we can
    write this:


    ```

    doAndRepeatUntil = (func, condition) ->

    func.call this

    func.call this until condition()

    ```


    6. To get the length of the shortest string in our `wordList` array, we can write
    the following:


    ```

    Math.min.apply Math, (w.length for w in wordList)

    ```


    The comprehension `(w.length for w in wordList)` generates a list of the length
    of each word in `wordList`. Using `apply` passes it to `Math.min` as an enormous
    list of arguments. (The first argument to `apply` ensures that `Math.min` runs
    in the `Math` context, just as it would if we called `Math.min` directly.) This
    isn’t the most efficient approach, but it’s very succinct.


    ## A1.3 Modules and Classes


    Answers to Section 4.7, [​*Exercises*​](#f_0044.html_sec.classesExercises):


    1. Why doesn’t this give us the same old aphorism twice?


    ```

    root = global ? window


    root.aphorism = ''Fool me 8 or more times, shame on me''


    do restoreOldAphorism = ->

    aphorism = ''Fool me once, shame on you''

    console.log aphorism


    console.log aphorism

    ```


    The issue here is that `restoreOldAphorism` declares a variable called `aphorism`
    in its own scope. The compiler doesn’t realize that setting `root.aphorism` has
    created a variable with the same name in the global scope; its scoping rules only
    apply to simple assignments of the form `aphorism = ...`.


    It’s fine to read `root.aphorism` as just `aphorism`, but assignments have to
    be made to `root.aphorism`.


    2. The following code is confusing because it uses `@wishesLeft` to refer to both
    a property of the prototype and a property of the instance:


    ```

    Genie = ->

    Genie::wishesLeft = 3


    Genie::grantWish = ->

    if @wishesLeft > 0

    console.log ''Your wish is granted!''

    @wishesLeft--

    ```


    The result is that each genie will grant three wishes, rather than enforcing a
    total limit of three wishes.


    To understand why, consider this:


    ```

    @wishesLeft--

    ```


    This is equivalent to `@wishesLeft = @wishesLeft - 1`. The first time this line
    is run on a `Genie` instance (let’s call it `genie1`), it reads `Genie::wishesLeft`,
    subtracts 1 from it, and then assigns that value to a new instance property, `genie1.wishesLeft`!


    You can read prototype properties from an object as if the property were attached
    to the object, but when you write `obj.x = y`, you’re always setting the value
    of a property on the object itself (potentially shadowing a prototype property).


    As a rule, you should never use the same name for a prototype property and an
    instance property. The best solution in this case is to replace both `Genie::wishesLeft`
    and `@wishesLeft` with `Genie.wishesLeft`.


    3. The answer is based on the definitions given:


    ```

    class Season

    class Spring extends Season

    ```


    Both `(new Season).__proto__.__proto__` and `(new Spring).__proto__.__proto__.__proto__`
    are equal to `{}.__proto__`, the default object prototype.


    4. Bound functions on classes work as you were probably hoping. When you call
    `foo = new Foo()`, instance methods defined on `Foo` with `=>` are automatically
    bound to the instance context.


    This is the behavior you want 95 percent of the time. However, there is a overhead
    from bound functions (in both code size and instantiation time), so they may not
    be suitable for performance-critical code.


    ## A1.4 Web Interactivity with jQuery


    Answers to Section 5.7, [​*Exercises*​](#f_0052.html_sec.jqueryExercises):


    1. This line of code will hide all current list items contained by `#menu`, but
    it will not affect those created in the future:


    ```

    $(''#menu li'').hide()

    ```


    To hide all current and future list items in `#menu`, there are two things we
    need to do. First, we modify our stylesheet to provide a special class for `#menu`,
    `hideItems`:


    ```

    #menu.hideItems li {

    visibility: hidden;

    }

    ```


    With the aid of that bit of CSS, hiding all menu items is as easy as using jQuery’s
    `addClass` method:


    ```

    $(''#menu'').addClass ''hideItems''

    ```


    Now all current and future menu items shall be unseen until we call `removeClass`.


