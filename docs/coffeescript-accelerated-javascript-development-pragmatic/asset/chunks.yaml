    We’ve seen how jQuery makes it easy to grab, change, and even add elements to
    the page. But jQuery, in its heart of hearts, has seen fit to bestow still one
    more miracle upon us mortals: simple event binding.


    How simple? Well, let’s say that we want the big headline on our page to gain
    an exclamation point every time it gets clicked:


    |   | `$(`*`''h1''`*`).click` **`->`** `$(`**`this`**`).html $(`**`this`**`).html()
    +` *`''!''`* |


    This code selects all `h1` elements on the page, then binds a click event handler
    to each of them. When that click handler is triggered, it appends `’!’` to the
    clicked element’s contents.


    Event callbacks are called in the context of the DOM element that triggered the
    event. Often, we want to jQuerify the context element, as we do in the example
    above, by writing `$(this)`.


    jQuery Chain Gang


    Check this out:


    |   | `$(`*`''#logo''`*`)` |


    |   | `.css(fontSize: 64)` |


    |   | `.hover(`**`->`** `$(`**`this`**`).css(fontWeight:` *`''bold''`*`))` |


    |   | `.click(`**`->`** `alert` *`''How dare you click the mighty logo!''`*`)`
    |


    Here we’re using chaining—nearly all jQuery methods return the object they were
    called on, so the above is equivalent to this:


    |   | `$logo = $(`*`''#logo''`*`)` |


    |   | `$logo.css fontSize: 64` |


    |   | `$logo.hover` **`->`** `$logo.css fontWeight:` *`''bold''`* |


    |   | `$logo.click` **`->`** `alert` *`''How dare you click the mighty logo!''`*
    |


    Generally, chaining is a good thing—it tends to improve readability by reducing
    repetition, and it lets code minify a tad better. But be warned: some jQueryers
    go “chain crazy,” turning their entire app into one long, meandering chain. Use
    it in moderation.


    What happens if we bind multiple event handlers of the same type to the same elements?


    |   | `$(`*`''h1''`*`)` |


    |   | `.click(`**`->`** `$(`**`this`**`).html $(`**`this`**`).html() +` *`''!''`*`)`
    |


    |   | `.click(`**`->`** `alert $(`**`this`**`).text())` |


    Each of those `click` calls is made on the same object; see [​*jQuery Chain Gang*​](#f_0049.html_sb.jquery.chaining).
    Note that whitespace here is not significant; it’s purely a stylistic convention.
    We could easily collapse this code into a single line: `$(’h1’).click(-> ...).click(->
    ...)`. That means that while the parentheses around the callback on the last line
    are optional, those around `’h1’` and the callback on the second line are not.


    All of the event handlers will run in the order in which they were attached. So
    when we click a heading in this example, `’!’` will be added to its contents and
    the resulting text will be (irritatingly) displayed in an alert box.


    You can unbind events using—wait for it—`unbind`. Calling `$elem.unbind()` will
    unbind everything attached to `$elem`, while `$elem.unbind ’click’` will just
    unbind the click events. (What if you want to unbind a specific event? See the
    exercises at the end of this chapter.)


    There’s one last thing you’ll need to know before we get to our project. Remember
    how I said that selectors aren’t “live”? Well, there’s one exception to that rule:
    when you use the aptly-named `live` method to bind an event handler. Let’s do
    an example:


    |   | `$(`*`''#oldSpiceGuy''`*`).live` *`''click''`*`,` **`->`** `alert` *`"I''m
    on a horse."`* |


    |   | `$(`*`''body''`*`).html` *`''<p id="oldSpiceGuy">The man your man could
    smell like</p>''`* |


    Even though `$(’#oldSpiceGuy’)` doesn’t match anything in the first line, the
    event handler will work. You see, unlike all other jQuery methods, `live` doesn’t
    care about the elements that were matched when you made the selection: it only
    cares about the selector string itself. (jQuery makes this string available via
    the `.selector` property.)


    A full explanation of how `live` works is beyond the scope of this book, but it
    has to do with “event bubbling.”[[41]](#f_0052.html_FOOTNOTE-41)


