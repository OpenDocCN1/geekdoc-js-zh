  trans: "\n\n以上就是关于 `coffee` 的全部内容。顺便提一下，如果你想了解 `coffee` 的工作原理，可以查看带注释的源代码。[[24]](#f_0016.html_FOOTNOTE-24)\
    \ 如果你愿意，甚至可以对其进行逆向工程，并为 CoffeeScript 编译器编写自己的接口（比如我自己的 Jitter[[25]](#f_0016.html_FOOTNOTE-25)）。\n\
    \n请记住，`coffee` 是一个轻量级工具；它不提供诸如压缩或编译后自动运行测试等功能。如果你想将这些功能添加到项目中，应该编写自己的构建脚本，通常以\
    \ Cakefile 的形式。你可以在 CoffeeScript 维基上找到一些关于 Cakefile 的文档。[[26]](#f_0016.html_FOOTNOTE-26)\n\
    \n你几乎已经准备好开始编写 CoffeeScript 代码了——但首先，如果出现问题该怎么办？\n\n## 1.4 调试 CoffeeScript\n\n\
    许多人在使用 CoffeeScript 这类语言编写代码时遇到的一个问题是，运行时错误引用的是`编译后`的代码，而不是源代码。这是一个合理的担忧，并且已经讨论过几种解决方案。[[27]](#f_0016.html_FOOTNOTE-27)\
    \ 不幸的是，目前你只能面对堆栈跟踪中行号与源代码几乎无关的情况。\n\n好消息是：CoffeeScript 编译后的 JavaScript 非常易读。如果你理解这两种语言之间的关系（我希望你在读完本书后能够理解），那么将程序中的失败点与原始\
    \ CoffeeScript 源代码对应起来就相当容易了。\n\n这并不理想，但这是站在前沿所付出的代价。随着 CoffeeScript 生态系统的发展和工具的改进，追踪\
    \ bug 会变得越来越容易。Mozilla 基金会的人员正在努力为 Firefox 添加 CoffeeScript 调试支持，Node 也不会落后太多。在此之前，请彻底测试你的代码，使用调试模式日志记录，并熟悉你的\
    \ JavaScript。\n\n中间那部分是什么？哦，对了。在 Node.js 和配备了开发者控制台（或像前面提到的 Firebug Lite 这样的书签工具）的浏览器中，你可以使用\
    \ `console.log` 显示消息。有两个可能的问题：你并不总是想记录每一个细节，而且如果 `console.log` 不存在，你也不想调用它。一个常见的解决方案是使用包装函数，但这样在记录某些内容时，你就无法获得宝贵的\
    \ JavaScript 行号（因为所有日志记录都是从同一个地方进行的：包装函数）。因此，我推荐以下方法：\n\n```\nwindow.debugMode\
    \ = document.location.hash.match(/debug/) and console?\nconsole.log 'This is the\
    \ first of many debug-mode outputs' if debugMode\n```\n\n在这个例子中，当且仅当地址栏中的“哈希”包含字符串\
    \ `debug`（例如 `page.html#debug`）并且浏览器有 `console` 对象时，`debugMode` 将为 `true`。这为你提供了一种在加载页面时轻松启用/禁用所有额外消息的方法。将\
    \ `debugMode` 声明为 `window` 的属性使其成为全局变量。\n\n一种更简单但通用性较差的方法是使用浸入（参见 ​*浸入: ’a?.b’*​）来确保仅在\
    \ `console` 存在时才调用 `console.log`：\n\n```\nconsole?.log 'Thanks to ?, this line\
    \ is perfectly safe!'\n```\n\n在 Node 环境下，有许多库可以在不同详细级别显示输出（只需快速谷歌搜索“nodejs logging\
    \ library”），包括我自己的 styout，它支持彩色控制台输出。[[28]](#f_0016.html_FOOTNOTE-28)\n\n日志记录可以替代注释，在开发过程中提供更多关于代码如何工作的信息。例如，下面是一段典型的带注释的代码：\n\
    \n```\narea = height * (base1 + base2) / 2\n# now we have the area of the trapezoid\n\
    ```\n\n该注释可以用对 `console.log` 的调用来替换，如下所示：\n\n```\narea = height * (base1 + base2)\
    \ / 2\nconsole.log \"The area of the trapezoid is #{area}\" if debugMode\n```\n\
    \n另一个常见的习惯是在代码中进行断言。标准的 `console` 对象有一个 `assert` 函数，可以很好地满足这一目的，它接受一个值和一个错误消息（如果该值为假，则显示该消息）：\n\
    \n```\nfundamentalLaws = ['death', 'taxes', 'gravity']\nif debugMode\n  console.assert\
    \ 'gravity' in fundamentalLaws, 'gravity oughta be a law!'\n```\n\n最后，防止 bug 最重要的方法是编写结构良好的代码。虽然目前还没有工具能为你提供运行时错误的确切行号，但至少你应该始终能够追踪到应用程序中导致问题的部分。\n\
    \n## 1.5 准备就绪！\n\n在本章中，你学习了如何使用 Node.js 和 npm 在机器上安装 CoffeeScript。你还让你的首选文本编辑器与这门语言“对话”，探索了将\
    \ CoffeeScript 作为开发工作流程一部分的几种方式，并考虑了调试的挑战。\n\n那么，既然你已经知道如何运行 CoffeeScript 代码，是时候深入了解这门语言本身的细节了。本书的其余部分将充满代码片段。最好的学习方法是使用你最喜欢的文本编辑器运行这些代码；如果你不理解它们的工作原理，试着修改一两行看看会发生什么。你也可以时不时地查看编译后的\
    \ JavaScript。\n\n像这样引用文件的代码片段可能需要额外的部分才能运行：\n\n```\nGettingStarted/outOfContext.coffee\n\
