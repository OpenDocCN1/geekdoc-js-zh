  raw: 'That’s it for our coverage of `coffee`. By the way, if you want to see how
    `coffee` works, check out the annotated source.[[24]](#f_0016.html_FOOTNOTE-24)
    If you’d like, you can even reverse-engineer it and write your own interface for
    the CoffeeScript compiler (like my own Jitter[[25]](#f_0016.html_FOOTNOTE-25)).


    Remember that `coffee` is a lightweight tool; it doesn’t offer features like minification
    or automatically running tests after compilation. If you want to add those to
    your project, you should write your own build script, typically as a Cakefile.
    You can find some documentation on Cakefiles over at the CoffeeScript wiki.[[26]](#f_0016.html_FOOTNOTE-26)


    You’re almost ready to start writing CoffeeScript code—but first, what should
    you do if something goes awry?


    ## 1.4 Debugging CoffeeScript


    One issue many folks have with writing code in a language like CoffeeScript is
    that runtime errors reference `compiled` code, not source code. That’s a legitimate
    concern, and several solutions have been discussed.[[27]](#f_0016.html_FOOTNOTE-27)
    Unfortunately, for now you’re left with stack traces whose line numbers have little
    to do with your source code.


    Here’s the good news: CoffeeScript’s compiled JavaScript is very readable. If
    you understand how the two languages are related (and I hope you will after reading
    this book), then matching a point of failure in your program to the original CoffeeScript
    source is pretty easy.


    It’s not ideal, but it’s the price of being on the cutting edge. As the CoffeeScript
    ecosystem grows and the tools get better, it’ll get easier and easier to track
    down bugs. The folks at the Mozilla Foundation are hard at work adding CoffeeScript
    debugging support to Firefox, and Node can’t be far behind. Until then, test your
    code thoroughly, use debug-mode logging, and know your JavaScript.


    What was that middle thing? Oh, right. Under Node.js and browsers equipped with
    a developer console (or a bookmarklet like the previously mentioned Firebug Lite),
    you can display messages using `console.log`. Two possible problems: you don’t
    always want to log every detail, and you don’t want to call `console.log` if it
    doesn’t exist. A common solution is to use a wrapper function, but then you don’t
    get those precious JavaScript line numbers when you log something (since all the
    logging is being done from the same place: the wrapper function). So here’s one
    approach I recommend:


    |   | `window.debugMode = document.location.hash.match(/debug/) and console?`
    |


    |   | `console.log` *`''This is the first of many debug-mode outputs''`***`if`**
    `debugMode` |


    In this example, `debugMode` will be `true` if and only if the “hash” in the address
    bar contains the string `debug` (e.g. `page.html#debug`) and the browser has a
    `console` object. This gives you an easy way to enable/disable all those extra
    messages when you load the page. Declaring `debugMode` as a property of `window`
    makes it a global variable.


    A simpler but less versatile approach is to use a soak (see [​*Soaks: ’a?.b’*​](#f_0028.html_sec.soaks))
    to ensure that `console.log` is only called when `console` exists:


    |   | `console?.log` *`''Thanks to ?, this line is perfectly safe!''`* |


    Under Node, there are plenty of libraries for displaying output at several levels
    of verbosity (just do a quick Google search for “nodejs logging library”), including
    my own styout, which comes with support for colored-console output.[[28]](#f_0016.html_FOOTNOTE-28)


    Logging can replace comments, providing more information during development on
    how the code is working. For example, here’s a typical piece of documented code:


    |   | `area = height * (base1 + base2) / 2` |


    |   | *`# now we have the area of the trapezoid`* |


    The comment could be replaced with a call to `console.log` as follows:


    |   | `area = height * (base1 + base2) / 2` |


    |   | `console.log` *`"The area of the trapezoid is`* `#{area}`*`"`***`if`** `debugMode`
    |


    Another common idiom is to make assertions throughout code. The standard `console`
    object has an `assert` function that serves that purpose nicely, taking a value
    and an error message (to be displayed if the value is non-truthy):


    |   | `fundamentalLaws = [`*`''death''`*`,` *`''taxes''`*`,` *`''gravity''`*`]`
    |


    |   | **`if`** `debugMode` |


    |   | `console.assert` *`''gravity''`***`in`** `fundamentalLaws,` *`''gravity
    oughta be a law!''`* |


    Finally, the most important guard against bugs is to write well-structured code.
    While the tools don’t exist yet to give you an exact line number for your runtime
    error, at least you should always be able to track down the part of your app that’s
    causing you grief.


    ## 1.5 Ready to Roll!


    In this chapter, you’ve learned how to install CoffeeScript on your machine using
    Node.js and npm. You’ve also gotten your favorite text editor on speaking terms
    with the language, explored some of the ways you can use CoffeeScript as part
    of your development workflow, and considered the challenge of debugging.


    So now that you know how to run CoffeeScript code, it’s about time we went into
    the nuts and bolts of the language itself. The rest of this book will be jam-packed
    with snippets of code. The best way to follow along is to run these from your
    favorite text editor; if you don’t understand how they work, try tweaking a line
    or two to see what happens. You might also want to look at the compiled JavaScript
    from time to time.


    Code snippets that refer to a file, like so, may require additional pieces in
    order to run:


    | [GettingStarted/outOfContext.coffee](http://media.pragprog.com/titles/tbcoffee/code/GettingStarted/outOfContext.coffee)
    |


    |   | `foo bar, baz` |


    Those that don’t are self-contained:


    |   | `OK =` *`''computer''`* |


    |   | `console.log` *`''No alarms and no surprises.''`***`if`** `OK` |


    And trust me—you’re going to have a lot more fun if your editor is equipped with
    a Run command so that you can see the code’s results just by tapping a keyboard
    shortcut. It’s a CoffeeScript learner’s best friend.


