    ```\n\n为什么要有单独的语法？为什么不直接使用`for key, value of array`？因为没有什么能阻止数组拥有额外的方法或数据。如果你想要全部内容，那么当然可以使用`of`。但如果你只想把数组当作数组来对待，请使用`in`——你只会按顺序得到`array[0]`、`array[1]`，直到`array[array.length\
