    ```\n\n#### `hasOwnProperty` 和 `for own`\n\nJavaScript 区分对象“自有”属性和从原型继承的属性。你可以使用`object.hasOwnProperty(key)`来检查某个属性是否为对象自身的属性。\n\
    \n由于通常只想遍历对象自身的属性，而不是与所有兄弟对象共享的属性，CoffeeScript 允许你编写`for own`来自动执行此检查并跳过未通过的属性。示例如下：\n\
