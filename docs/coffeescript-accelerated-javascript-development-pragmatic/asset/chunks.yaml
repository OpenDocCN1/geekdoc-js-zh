  trans: "\n`Zombie.js` [Ark11]：全栈 Web 应用测试领域出现了一个新成员：`Zombie.js`。Zombie 让你能够借助 Sizzle（即\
    \ jQuery 所使用的选择引擎）来验证应用的行为。它不仅易于使用，而且速度极快。\n\n你可以在 [`github.com/jashkenas/coffee-script/wiki/In-The-Wild`](http://github.com/jashkenas/coffee-script/wiki/In-The-Wild)\
    \ 找到一份更全面的各类 CoffeeScript 应用列表。\n\n## 6.2 使用 `exports` 和 `require` 实现代码模块化\n\n\
    在前几章中，我们使用 `global` 将变量放入应用全局命名空间。虽然 `global` 有其用武之地，但 Node 开发者通常更倾向于保持代码的整洁和模块化，让每个文件拥有自己的命名空间。那么，如何在不同文件之间共享对象呢？\n\
    \n答案是使用一个名为 `exports` 的特殊对象，它是 CommonJS 模块标准的一部分。当另一个文件通过 `require` 调用某个文件时，会返回该文件的\
    \ `exports` 对象。例如，假设我有两个文件：\n\n`Nodejs/app.coffee`：\n\n```\nutil = require './util'\n\
    console.log util.square(5)\n```\n\n`Nodejs/util.coffee`：\n\n```\nconsole.log 'Now\
    \ generating utility functions...'\nexports.square = (x) -> x * x\n```\n\n当你运行\
    \ `coffee app.coffee` 时，`require './util'` 会执行 `util.coffee`，然后返回它的 `exports`\
    \ 对象，你会看到以下输出：\n\n```\nNow generating utility functions...\n25\n```\n\n你可能想知道为什么我们不需要指定文件扩展名。在\
    \ Node.js 中，`js` 文件扩展名始终是可选的。`coffee` 也是可选的，但前提是运行中的应用已经加载了 `coffee-script` 库——当我们使用\
    \ `coffee` 运行文件时，这一操作是隐式完成的。`coffee-script` 还会告诉 Node 如何处理 CoffeeScript 文件。因此，如果我们将\
    \ `app` 编译为 JavaScript 但未编译 `util`，那么我们需要这样写：\n\n`Nodejs/app.js`：\n\n```\nrequire('coffee-script');\n\
    var util = require('./util');\nconsole.log(util.square(5));\n```\n\n当库的名称不以 `.`\
    \ 或 `/` 开头时，Node 会在其库路径中查找匹配的文件，你可以通过查看 `require.paths` 来了解这些路径。\n\n按照惯例，`require`\
    \ 使用的库名称与其在 `npm` 中的名称相同。例如，我们曾使用 `npm install -g coffee-script` 安装 CoffeeScript。这为我们提供了\
    \ `coffee` 二进制文件，同时也提供了 `coffee-script` 库。在本章末尾，我们将使用 npm 为项目安装更多库。\n\n## 6.3\
    \ 异步思维\n\n关于 JavaScript 最常见的抱怨之一，始终是它缺乏对线程的支持。虽然 Java、Ruby 和 Python 等流行语言允许同时执行多个任务，但\
    \ JavaScript 严格来说是线性的。\n\n然而，表面上看似 JavaScript 最大弱点的特性，如今却被广泛视为因祸得福。没有线程，就没有互斥锁、没有竞态条件、没有无尽的\
    \ `sleep` 循环。许多最常见的软件错误来源都被消除了。更重要的是，多线程通常会给应用（尤其是 Web 服务器）带来显著的开销，这也是 Node.js\
    \ 被誉为高效替代方案的原因之一，它取代了那些通常依赖线程实现并发的语言框架。\n\n（当然，没有线程就无法利用多处理器的优势。好消息是，已经有一些项目（例如\
    \ multi-node 和 cluster）能够将应用的多个实例有效地绑定到同一个服务器端口，从而在不跨线程共享数据带来的麻烦下，获得并行处理的性能优势。[[46]](#f_0059.html_FOOTNOTE-46)）\n\
    \n由于 JavaScript 是事件导向而非线程导向，事件只会在所有其他执行停止后运行。想象一下，如果你的应用每次发起请求（比如向文件系统或 HTTP 服务器）时，都会完全冻结直到请求完成，那该有多令人沮丧！正因如此，Node.js\
    \ API 中几乎每个函数都使用回调：你发起请求，Node.js 迅速将其传递出去，然后你的应用继续运行，仿佛什么都没发生。当你的请求完成（或出错）时，你传递给\
    \ Node.js 的函数就会被调用。\n\n例如，如果你想显示当前目录的内容，可以这样写：\n\n```\nfs = require 'fs'\nfs.readdir\
    \ '.', (err, files) ->\n  console.log files\nconsole.log 'This will happen first.'\n\
    ```\n\n以下是执行过程：\n\n1.  我们通过 `fs.readdir` 请求 Node.js 读取当前目录，并传入一个回调函数。\n2.  Node.js\
    \ 将请求传递给操作系统，然后立即返回。\n3.  我们在控制台打印 `'This will happen first.'`。\n4.  一旦我们的代码运行完毕，Node.js\
    \ 会检查操作系统是否已经响应了我们的请求。如果已经响应，它就会运行我们的回调函数，并将当前目录中的文件列表打印到控制台。\n\n你明白了吗？理解这一点非常重要。你的代码永远不会被中断。无论你的硬盘转速有多快，那个回调函数都要等到你的所有代码运行完毕后才会执行。JavaScript\
    \ 代码永远不会被中断。即使看似精确的 `setTimeout` 和 `setInterval`，如果你的代码陷入无限循环，它们也会永远等待下去。\n\n\
    以上所有内容在浏览器中和 Node 中同样适用，但在 Node 中理解这一点尤为重要，因为你的应用逻辑将以错综复杂的回调链形式呈现。这一点毋庸置疑。挑战在于如何以人类可理解的方式管理它们。\n\
    \n考虑一下，一个简单的表单提交到 Web 应用是如何被处理的：\n\n1.  我们从数据库中获取用户信息，以检查他们是否有权限发起请求。\n2.  如果有权限，我们相应地更新数据库。\n\
    3.  我们从文件系统中读取模板，进行适当的定制，然后发送给用户。\n\n那么，至少我们的应用骨架看起来是这样的：\n\n```\nformRequestReceived\
    \ = (req) ->\n  checkDatabaseForPermissions req, ->\n    updateDatabase req, ->\n\
    \      renderTemplate req, (tmpl) ->\n        sendResponse tmpl\n```\n\n而且这还没有考虑每一步的错误处理！\n\
    \n不幸的是，这种套娃式的感觉永远不会完全消失。事实上，在大多数语言中，你会依赖线程，这样你就可以直接写出类似这样的代码：\n\n```\nformRequestReceived\
    \ = (req) ->\n  if checkDatabaseForPermissions req\n    updateDatabase req\n \
    \   tmpl = renderTemplate req\n    sendResponse tmpl\n```\n\n但这些语言是在假装将异步操作同步化。在那些调用数据库和读取文件的函数中，总有一个\
    \ `sleep` 循环在说：“希望在我等待数据库回复的时候，有其他人能做点有用的事。” 这在表面上更简单，但代价是内存、CPU，而且往往还会带来不愉快的意外。\n\
    \n请注意，许多 NodeJS API 函数为了方便也提供了同步版本。例如，你可以调用 `fs.readdirSync` 直接获取返回的文件名列表，而不必使用带回调的\
    \ `fs.readdir`。如果你的应用没有等待触发的事件，那么没有理由不使用这些便捷的替代方案。\n\n不幸的是，在 JavaScript 或 CoffeeScript\
    \ 中，无法为任意异步函数实现同步版本。这只能通过原生扩展（通常用 C++ 编写）来实现，而这超出了本书的范围。\n\n### 循环中的作用域\n\n"
- fmt: "\nRemember what we learned in Section 2.2, [​*Scope: Where You See ’Em*​](#f_0019.html_sec.scope):\
    \ only functions create scope. Expecting loops to create scope leads otherwise\
    \ mild-mannered programmers to summon forth horrific bugs when dealing with asynchronous\
    \ callbacks. In fact, this is probably the most common source of confusion in\
    \ asynchronous code.\n\nFor instance, let’s say that we have an application that\
    \ loads numbers from some (synchronous) source and keeps a running tally of those\
    \ numbers until the sum meets or exceeds `limit`. Each time a number is loaded,\
    \ that number—and the sum thus far—needs to be saved. Also, due to overzealous\
    \ security requirements, each save needs to be encrypted using a key unique to\
    \ the given number. That key must be fetched asynchronously via the `getEncryptionKey`\
    \ function.\n\nA first attempt might look like this:\n\n```\nsum = 0\nwhile sum\
    \ < limit\n  sum += x = nextNum()\n  getEncryptionKey (key) ->\n    saveEncrypted\
    \ key, x, sum # FAIL!\n```\n\nThe problem here is that by the time the `getEncryptionKey`\
    \ callback is called, `x` and `sum` have moved on—in fact, the entire loop has\
    \ been run. So for each `x` the loop goes through, the values of `x` and `sum`\
    \ after the loop has finished running will be saved (most likely with the wrong\
    \ encryption key).\n\nThe solution is to capture the values of `x` and `sum`.\
    \ The easiest way to do that is to use an anonymous function. The `do` keyword\
    \ was added to CoffeeScript for precisely this purpose:\n\n```\nsum = 0\nwhile\
    \ sum < limit\n  sum += x = nextNum()\n  do (x, sum) ->\n    getEncryptionKey\
    \ (key) ->\n      saveEncrypted key, x, sum # Success!\n```\n\nIf you’re familiar\
    \ with Lisp, this use of `do` should remind you of the `let` keyword. `do (x,\
    \ sum) -> ...` is shorthand for `((x, sum) -> ...)(x, sum)`. So now the line `saveEncrypted\
    \ key, x, sum` references the copies of `x` and `sum` created by the `do` instead\
    \ of the `x` and `sum` used by the loop.\n\nNote that this form shadows the outer\
    \ `x` and `sum`, making them inaccessible. If you want to have access to the original\
    \ variables while still capturing their values, then you might write something\
    \ like this:\n\n```\ndo ->\n  capturedX = x; capturedSum = sum\n  ...\n```\n\n\
    Now it’s time for a little project of our own, extending the jQuery version of\
    \ 5x5 with a Node-powered back end.\n\n## 6.4 Project: Multiplayer 5x5\n\nWe’re\
    \ going to build a web server that can let folks take each other on at 5x5\\.\
    \ On the client side, we’ll be using essentially the same HTML and CSS as in the\
    \ last chapter; our server will serve all of those static files (and some CoffeeScript,\
    \ of course) and handle the game state.\n\nThere are a number of ways that we\
    \ could handle the problem of coordinating the clients with the server. How much\
    \ logic do we want to put in the client and how much on the server? Many frameworks,\
    \ such as Backbone.js, exist to make this problem conceptually simpler.[[47]](#f_0059.html_FOOTNOTE-47)\
    \ Often it’s desirable to have some logic on the client side (for performance)\
    \ and some logic on the server side (for security), and the two may overlap. But\
    \ for our purposes, we’re going to lean toward a “dumb client” approach, putting\
    \ all of the logic on the server side. That means that when player A makes a move,\
    \ the following happens:\n\n1.  Player A’s client sends the move (that is, the\
    \ coordinates of the swapped tiles) to the server.\n2.  If the move is valid,\
    \ the server sends both clients the results of the move.\n3.  The two clients\
    \ display the results.\n\nSimple, right? This approach makes the client library\
    \ very light, since the `Dictionary`, `Grid`, and `Player` classes only need to\
    \ exist on the server side (not to mention the 2.1 MB list of valid words!). The\
    \ downside is that there’s going to be a bit of lag before players see the results\
    \ of their actions. In a real application, we’d want to put more thought into\
    \ optimizing responsiveness. (For instance, Google Docs syncs every word you type\
    \ to the server, but imagine how frustrating it would be to not see those letters\
    \ on your screen until the server acknowledged them!)\n\nThere are two files we’ll\
    \ be working with: `5x5client.coffee` and `5x5server.coffee`. Let’s start with\
    \ the server.\n\n### 5x5server.coffee\n\nWe’re going to build our server on the\
    \ popular Connect framework.[[48]](#f_0059.html_FOOTNOTE-48) Connect extends Node’s\
    \ own `net` module and is in turn extended by more robust frameworks such as Express\
    \ and Zappa. For more sophisticated apps, you should definitely take a look at\
    \ those other frameworks, which add niceties such as DSLs for defining URL routes.\
    \ However, for our single-page app, Connect will do just fine. Let’s install it:\n\
    \n```\n$ npm install connect\n```\n\n(Be sure to either run that command from\
    \ the project directory or do a global install by adding the `-g` flag.)\n\nNow\
    \ let’s start our server code by creating a Connect server instance:\n\n[Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)\n\
    \n```\nconnect = require 'connect'\n\napp = connect.createServer(\n  connect.compiler(src:\
    \ __dirname + '/client', enable: ['coffeescript']),\n  connect.static(__dirname\
    \ + '/client'),\n  connect.errorHandler dumpExceptions: true, showStack: true\n\
    )\n\nport = 3000\napp.listen port\nconsole.log \"Browse to http://localhost:#{port}\
    \ to play\"\n\nio = require 'socket.io'\nsocket = io.listen app\nsocket.on 'connection',\
    \ (client) ->\n  if assignToGame client\n    client.on 'message', (message) ->\
    \ handleMessage client, message\n    client.on 'disconnect', -> removeFromGame\
    \ client\n  else\n    client.send 'full'\n\nassignToGame = (client) ->\n  idClientMap[client.sessionId]\
    \ = client\n  return false if game.isFull()\n  game.addPlayer client.sessionId\n\
    \  if game.isFull() then welcomePlayers()\n  true\n\nremoveFromGame = (client)\
    \ ->\n  delete idClientMap[client.sessionId]\n  game.removePlayer client.sessionId\n\
    \nwelcomePlayers = ->\n  players = [game.player1, game.player2]\n  info = {players,\
    \ tiles: game.grid.tiles, currPlayerNum: game.currPlayer.num}\n  for player in\
    \ players\n    playerInfo = extend {}, info, {yourNum: player.num}\n    idClientMap[player.id].send\
    \ \"welcome:#{JSON.stringify playerInfo}\"\n\nhandleMessage = (client, message)\
    \ ->\n  {type, content} = typeAndContent message\n  if type is 'move'\n    return\
    \ unless client.sessionId is game.currPlayer.id # no cheating!\n    swapCoordinates\
    \ = JSON.parse content\n    {moveScore, newWords} = game.currPlayer.makeMove swapCoordinates\n\
    \    result = {swapCoordinates, moveScore, newWords, player: game.currPlayer}\n\
    \    socket.broadcast \"moveResult:#{JSON.stringify result}\"\n    game.endTurn()\n\
    \ntypeAndContent = (message) ->\n  [ignore, type, content] = message.match /(.*?):(.*)/\n\
    \  {type, content}\n\nextend = (a, others...) ->\n  for o in others\n    a[key]\
    \ = val for key, val of o\n  a\n```\n"
  raw: 'Remember what we learned in Section 2.2, [​*Scope: Where You See ’Em*​](#f_0019.html_sec.scope):
    only functions create scope. Expecting loops to create scope leads otherwise mild-mannered
    programmers to summon forth horrific bugs when dealing with asynchronous callbacks.
    In fact, this is probably the most common source of confusion in asynchronous
    code.


    For instance, let’s say that we have an application that loads numbers from some
    (synchronous) source and keeps a running tally of those numbers until the sum
    meets or exceeds `limit`. Each time a number is loaded, that number—and the sum
    thus far—needs to be saved. Also, due to overzealous security requirements, each
    save needs to be encrypted using a key unique to the given number. That key must
    be fetched asynchronously via the `getEncryptionKey` function.


    A first attempt might look like this:


    |   | `sum = 0` |


    |   | **`while`** `sum < limit` |


    |   | `sum += x = nextNum()` |


    |   | `getEncryptionKey (key)` **`->`** |


    |   | `saveEncrypted key, x, sum` *`# FAIL!`* |


    The problem here is that by the time the `getEncryptionKey` callback is called,
    `x` and `sum` have moved on—in fact, the entire loop has been run. So for each
    `x` the loop goes through, the values of `x` and `sum` after the loop has finished
    running will be saved (most likely with the wrong encryption key).


    The solution is to capture the values of `x` and `sum`. The easiest way to do
    that is to use an anonymous function. The `do` keyword was added to CoffeeScript
    for precisely this purpose:


    |   | `sum = 0` |


    |   | **`while`** `sum < limit` |


    |   | `sum += x = nextNum()` |


    |   | **`do`** `(x, sum)` **`->`** |


    |   | `getEncryptionKey (key)` **`->`** |


    |   | `saveEncrypted key, x, sum` *`# Success!`* |


    If you’re familiar with Lisp, this use of `do` should remind you of the `let`
    keyword. `do (x, sum) -> ...` is shorthand for `((x, sum) -> ...)(x, sum)`. So
    now the line `saveEncrypted key, x, sum` references the copies of `x` and `sum`
    created by the `do` instead of the `x` and `sum` used by the loop.


    Note that this form shadows the outer `x` and `sum`, making them inaccessible.
    If you want to have access to the original variables while still capturing their
    values, then you might write something like this:


    |   | **`do`****`->`** |


    |   | `capturedX = x; capturedSum = sum` |


    |   | `...` |


    Now it’s time for a little project of our own, extending the jQuery version of
    5x5 with a Node-powered back end.


    ## 6.4 Project: Multiplayer 5x5


    We’re going to build a web server that can let folks take each other on at 5x5\.
    On the client side, we’ll be using essentially the same HTML and CSS as in the
    last chapter; our server will serve all of those static files (and some CoffeeScript,
    of course) and handle the game state.


    There are a number of ways that we could handle the problem of coordinating the
    clients with the server. How much logic do we want to put in the client and how
    much on the server? Many frameworks, such as Backbone.js, exist to make this problem
    conceptually simpler.[[47]](#f_0059.html_FOOTNOTE-47) Often it’s desirable to
    have some logic on the client side (for performance) and some logic on the server
    side (for security), and the two may overlap. But for our purposes, we’re going
    to lean toward a “dumb client” approach, putting all of the logic on the server
    side. That means that when player A makes a move, the following happens:


    1.  Player A’s client sends the move (that is, the coordinates of the swapped
    tiles) to the server.


    2.  If the move is valid, the server sends both clients the results of the move.


    3.  The two clients display the results.


    Simple, right? This approach makes the client library very light, since the `Dictionary`,
    `Grid`, and `Player` classes only need to exist on the server side (not to mention
    the 2.1 MB list of valid words!). The downside is that there’s going to be a bit
    of lag before players see the results of their actions. In a real application,
    we’d want to put more thought into optimizing responsiveness. (For instance, Google
    Docs syncs every word you type to the server, but imagine how frustrating it would
    be to not see those letters on your screen until the server acknowledged them!)


    There are two files we’ll be working with: `5x5client.coffee` and `5x5server.coffee`.
    Let’s start with the server.


    ### 5x5server.coffee


    We’re going to build our server on the popular Connect framework.[[48]](#f_0059.html_FOOTNOTE-48)
    Connect extends Node’s own `net` module and is in turn extended by more robust
    frameworks such as Express and Zappa. For more sophisticated apps, you should
    definitely take a look at those other frameworks, which add niceties such as DSLs
    for defining URL routes. However, for our single-page app, Connect will do just
    fine. Let’s install it:


    |   | `$` **`npm install connect`** |


    (Be sure to either run that command from the project directory or do a global
    install by adding the `-g` flag.)


    Now let’s start our server code by creating a Connect server instance:


    | [Nodejs/5x5/5x5server.coffee](http://media.pragprog.com/titles/tbcoffee/code/Nodejs/5x5/5x5server.coffee)
    |


    |   | `connect = require` *`''connect''`* |


    |   |  |


    |   | `app = connect.createServer(` |


    |   | `connect.compiler(src: __dirname +` *`''/client''`*`, enable: [`*`''coffeescript''`*`]),`
    |


    |   | `connect.static(__dirname +` *`''/client''`*`),` |


    |   | `connect.errorHandler dumpExceptions:` **`true`**`, showStack:` **`true`**
    |


    |   | `)` |


    |   |  |


    |   | `port = 3000` |


    |   | `app.listen port` |


    |   | `console.log` *`"Browse to http://localhost:`*`#{port}` *`to play"`* |


    |   |  |


    |   | `io = require` *`''socket.io''`* |


    |   | `socket = io.listen app` |


    |   | `socket.on` *`''connection''`*`, (client)` **`->`** |


    |   | **`if`** `assignToGame client` |


    |   | `client.on` *`''message''`*`, (message)` **`->`** `handleMessage client,
    message` |


    |   | `client.on` *`''disconnect''`*`,` **`->`** `removeFromGame client` |


    |   | **`else`** |


    |   | `client.send` *`''full''`* |


    |   |  |


    |   | `assignToGame = (client)` **`->`** |


    |   | `idClientMap[client.sessionId] = client` |


    |   | **`return`****`false`****`if`** `game.isFull()` |


    |   | `game.addPlayer client.sessionId` |


    |   | **`if`** `game.isFull()` **`then`** `welcomePlayers()` |


    |   | **`true`** |


    |   |  |


    |   | `removeFromGame = (client)` **`->`** |


    |   | **`delete`** `idClientMap[client.sessionId]` |


    |   | `game.removePlayer client.sessionId` |


    |   |  |


    |   | `welcomePlayers =` **`->`** |


    |   | `players = [game.player1, game.player2]` |


    |   | `info = {players, tiles: game.grid.tiles, currPlayerNum: game.currPlayer.num}`
    |


    |   | **`for`** `player` **`in`** `players` |


    |   | `playerInfo = extend {}, info, {yourNum: player.num}` |


    |   | `idClientMap[player.id].send` *`"welcome:`*`#{JSON.stringify playerInfo}`*`"`*
    |


    |   |  |


    |   | `handleMessage = (client, message)` **`->`** |


    |   | `{type, content} = typeAndContent message` |


    |   | **`if`** `type is` *`''move''`* |


    |   | **`return`****`unless`** `client.sessionId is game.currPlayer.id` *`# no
    cheating!`* |


    |   | `swapCoordinates = JSON.parse content` |


    |   | `{moveScore, newWords} = game.currPlayer.makeMove swapCoordinates` |


    |   | `result = {swapCoordinates, moveScore, newWords, player: game.currPlayer}`
    |


    |   | `socket.broadcast` *`"moveResult:`*`#{JSON.stringify result}`*`"`* |


    |   | `game.endTurn()` |


    |   |  |


    |   | `typeAndContent = (message)` **`->`** |


    |   | `[ignore, type, content] = message.match /(.*?):(.*)/` |


    |   | `{type, content}` |


    |   |  |


    |   | `extend = (a, others...)` **`->`** |


    |   | **`for`** `o` **`in`** `others` |


    |   | `a[key] = val` **`for`** `key, val` **`of`** `o` |


    |   | `a` |'
