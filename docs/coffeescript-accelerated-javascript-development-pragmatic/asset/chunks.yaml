    \ the player has chosen both tiles for this turn, so we go on to `doMove`, which\
    \ has the `Player` instance move the tiles around and tabulate score, then displays\
    \ the results in a notice box:\n\n[jQuery/5x5/jq5x5.coffee](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/jq5x5.coffee)\n\
    \n```\ndoMove = ->\n    {moveScore, newWords} = currPlayer.makeMove selectedCoordinates\n\
    \    if moveScore is 0\n        $notice = $(\"\"\"#{currPlayer.name} formed no\
    \ words this turn.\"\"\")\n    else\n        $notice = $(\"\"\"\n            <p\
    \ class=\"notice\">\n            #{currPlayer} formed the following #{newWords.length}\
