- fmt: "\nBecause arrays are objects, you can freely add all kinds of properties to\
    \ an array, though it’s not a common practice. It’s more common to modify the\
    \ `Array` prototype, adding special methods to all arrays. For instance, the Prototype.js\
    \ framework does this to make arrays more Ruby-like, adding methods like `flatten`\
    \ and `each`.\n\n### Ranges\n\nFire up the REPL, because the best way to get acquainted\
    \ with CoffeeScript range syntax—and its close friends, the slice and splice syntaxes,\
    \ introduced in the next section—is `('practice' for i in [1..3]).join(', ')`.\n\
    \nCoffeeScript adds a Ruby-esque syntax for defining arrays of consecutive integers:\n\
    \n```\ncoffee> [1..5]\n[1, 2, 3, 4, 5]\n```\n\nThe `..` defines an inclusive range.\
    \ But often, we want to omit the last value; in those cases, we add an extra `.`\
    \ to create an exclusive range:\n\n```\ncoffee> [1...5]\n[1, 2, 3, 4]\n```\n\n\
    (As a mnemonic, picture the extra `.` replacing the end value.) Ranges can also\
    \ go backward:\n\n```\ncoffee> [5..1]\n[5, 4, 3, 2, 1]\n```\n\nNo matter which\
    \ direction the range goes in, an exclusive range omits the end value:\n\n```\n\
    coffee> [5...1]\n[5, 4, 3, 2]\n```\n\nThis syntax is rarely used on its own, but\
    \ as we’ll soon see, it’s essential to CoffeeScript’s `for` loops.\n\n### Slicing\
    \ and Splicing\n\nWhen you want to tear a chunk out of a JavaScript array, you\
    \ turn to the violent-sounding `slice` method:\n\n```\ncoffee> ['a', 'b', 'c',\
    \ 'd'].slice 0, 3\n['a', 'b', 'c']\n```\n\nThe two numbers given to `slice` are\
    \ indices; everything from the first index up to but not including the second\
    \ index is copied to the result. You might look at that and say, “That sounds\
    \ kind of like an exclusive range.” And you’d be right:\n\n```\ncoffee> ['a',\
    \ 'b', 'c', 'd'][0...3]\n['a', 'b', 'c']\n```\n\nAnd you can use an inclusive\
    \ range, too:\n\n```\ncoffee> ['a', 'b', 'c', 'd'][0..3]\n['a', 'b', 'c', 'd']\n\
    ```\n\nThe rules here are slightly different than they were for standalone ranges,\
    \ though, due to the nature of `slice`. Notably, if the first index comes after\
    \ the second, the result is an empty array rather than a reversal:\n\n```\ncoffee>\
