    ## 3.5 Comprehensions\n\nIn functional languages like Scheme, Haskell, and OCaml,\
    \ you rarely need loops. Instead, you iterate over arrays with operations like\
    \ map, reduce, and compact. Many of these operations can be added to JavaScript\
    \ through libraries, such as Underscore.js.[[30]](#f_0036.html_FOOTNOTE-30) But\
    \ to gain maximum succinctness and flexibility, a language needs array comprehensions\
    \ (also known as list comprehensions).\n\nThink of all the times you’ve looped\
    \ over an array just to create another array based on the first. For instance,\
    \ to negate an array of numbers in JavaScript, you’d write the following:\n\n\
    ```\npositiveNumbers = [1, 2, 3, 4];\nnegativeNumbers = [];\nfor (i = 0; i < positiveNumbers.length;\
    \ i++) {\n  negativeNumbers.push(-positiveNumbers[i]);\n}\n```\n\nNow here’s the\
    \ equivalent CoffeeScript, using an array comprehension:\n\n```\nnegativeNumbers\
    \ = (-num for num in [1, 2, 3, 4])\n```\n\nYou can also use the comprehension\
    \ syntax with a conditional loop:\n\n```\nkeysPressed = (char while char = handleKeyPress())\n\
    ```\n\nDo you see what’s going on here? Every loop in CoffeeScript returns a value.\
    \ That value is an array containing the result of every loop iteration (except\
    \ those skipped by a `continue` or `break` or as a result of a `when` clause).\
    \ And it’s not just one-line loops that do this:\n\n```\ncode = ['U', 'U', 'D',\
    \ 'D', 'L', 'R', 'L', 'R', 'B', 'A']\ncodeKeyValues = for key in code\n  switch\
    \ key\n    when 'L' then 37\n    when 'U' then 38\n    when 'R' then 39\n    when\
    \ 'D' then 40\n    when 'A' then 65\n    when 'B' then 66\n```\n\n(Do you see\
    \ why we needed to use parentheses for the one-liners, but we don’t here? Also,\
    \ you’re probably wondering about `switch`; it’ll become clearer in [*Polymorphism\
    \ and Switching*](#f_0041.html_sec.switch).)\n\nNote that you can use comprehensions\
    \ in conjunction with the `for` loop modifiers, `by` and `when`:\n\n```\nevens\
    \ = (x for x in [2..10] by 2)\nisInteger = (num) -> num is Math.round(num)\nnumsThatDivide960\
    \ = (num for num in [1..960] when isInteger(960 / num))\n```\n\nList comprehensions\
    \ are the consequence of a core part of CoffeeScript’s philosophy: everything\
    \ in CoffeeScript is an expression. And every expression has a value. So what’s\
    \ the value of a loop? An array of the loop’s iteration values, naturally.\n\n\
    Another part of CoffeeScript’s philosophy is DRY: Don’t Repeat Yourself. In the\
    \ next section, we’ll meet one of my favorite antirepetition features.\n\n## 3.6\
    \ Pattern Matching (or, Destructuring Assignment)\n\nIn JavaScript, assignment\
    \ is a strict one-at-a-time affair. If you had a list of values that you wanted\
    \ to transfer to a list of variables, you’d probably write a custom function.\
    \ But in CoffeeScript, you can just write one line of code:\n\n```\n[firstName,\
    \ middleInitial, lastName] = ['Joe', 'T', 'Plumber']\n```\n\nThis syntax, called\
    \ array pattern matching, may look odd at first. The square brackets on the left\
    \ side of the assignment aren’t really creating an array, after all. Instead,\
    \ it’s just describing a “pattern” of variables that the array on the right side\
    \ fills in. So the line above is equivalent to this:\n"
