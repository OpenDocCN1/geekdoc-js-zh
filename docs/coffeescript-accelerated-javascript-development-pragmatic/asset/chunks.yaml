    [jQuery/5x5/index.html](http://media.pragprog.com/titles/tbcoffee/code/jQuery/5x5/index.html)

    <link rel="stylesheet" type="text/css" href="./style.css" />

    ```


    页面的 `head` 部分就这些了。现在我们只需要一个包含三个元素的 `body`——一个名为 `message` 的 `p`（用于向玩家显示消息）、一个名为
    `grid` 的 `div`（用于包含方块）以及一个名为 `scores` 的 `table`（猜猜看）：


