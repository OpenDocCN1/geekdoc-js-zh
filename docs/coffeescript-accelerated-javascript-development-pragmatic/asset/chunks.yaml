  trans: "\n\n现在我们将定义一些简单的函数，用于检查某个 (x, y) 坐标对是否超出范围、交换两个方块（给定一个包含两个坐标对的对象），以及获取网格的转置版本（即行数组而非列数组）：\n\
    \n[`Classes/5x5/Grid.coffee`](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Grid.coffee)\n\
    \n```\ninRange: (x, y) ->\n  0 <= x < @size and 0 <= y < @size\n\nswap: ({x1,\
    \ y1, x2, y2}) ->\n  [@tiles[x1][y1], @tiles[x2][y2]] = [@tiles[x2][y2], @tiles[x1][y1]]\n\
    \nrows: ->\n  for x in [0...@size]\n    for y in [0...@size]\n      @tiles[y][x]\n\
    ```\n\n我就不展示将类设为全局的那两行代码了。\n\n### Player 类\n\n每个 `Player` 实例都应拥有自己的名字，并且可以选择性地拥有一个初始网格。（与\
    \ `Dictionary` 一样，当新游戏开始时，我们会使用 `setGrid`。）玩家自然从 0 分开始：\n\n[`Classes/5x5/Player.coffee`](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Player.coffee)\n\
    \n```\nclass Player\n  constructor: (@name, dictionary) ->\n    @setDictionary\
    \ dictionary if dictionary?\n\n  setDictionary: (@dictionary) ->\n    @score =\
    \ 0\n    @moveCount = 0\n```\n\n让我们为玩家提供一种执行移动的方式：\n\n[`Classes/5x5/Player.coffee`](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Player.coffee)\n\
    \n```\nmakeMove: (swapCoordinates) ->\n  @dictionary.grid.swap swapCoordinates\n\
    \  @moveCount++\n  result = scoreMove @dictionary, swapCoordinates\n  @score +=\
    \ result.moveScore\n  result\n```\n\n### Console.Coffee 接口\n\n上一章中所有未重构到其他类中的代码——即所有与命令行\
    \ I/O 相关的内容——都位于 `console.coffee` 中。这里我不再重复那些复用的代码，但重要的部分是前四行：\n\n[`Classes/5x5/console.coffee`](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/console.coffee)\n\
    \n```\n{Dictionary} = require './Dictionary'\n{Grid} = require './Grid'\n{Player}\
    \ = require './Player'\n{OWL2} = require './OWL2'\n```\n\n每个文件名前的 `./` 前缀告诉 Node\
    \ 从当前路径加载文件。另一种方法（在 Node 0.4 中新增）是在 `console.coffee` 的工作路径下创建一个 `node_modules`\
    \ 目录，然后将文件放入其中[[34]](#f_0044.html_FOOTNOTE-34)。这样就不需要前缀了。\n\n大功告成！自己试试看：\n\n```\n\
    $ coffee console.coffee\nWelcome to 5x5!\n```\n\n我们已经将过去杂乱无章的代码重构为四个整洁的模块，其中三个将在接下来的两章中复用——首先在浏览器中，然后在服务器上。通过将可复用的游戏逻辑代码与命令行部分分离，我们为自己节省了大量工作（松了一口气），以后再也不提命令行部分了。继续前进！\n\
    \n## 4.6 一勺糖\n\n在本章中，我们学习了 CoffeeScript 支持模块化程序的两种方式：首先，各个文件（“模块”）彼此隔离，除非显式导出变量。其次，函数和数据可以组合成类。\n\
    \n我们应用这两种技术清理了上一章中快速而粗糙的 5x5 版本。结果如何？代码不仅更易读，而且重构起来也容易得多，正如我们在下一章中将看到的——将老式的基于文本的程序转变为新潮的\
    \ Web 应用。而且我们将借助 JavaScript 的好朋友 jQuery 来实现这一目标。\n\n## 4.7 练习\n\n1.  解释以下输出，并修复代码，使那句古老的格言显示两次：\n\
    \n    ```\n    root = global ? window\n\n    root.aphorism = 'Fool me 8 or more\
    \ times, shame on me'\n\n    do restoreOldAphorism = ->\n      aphorism = 'Fool\
    \ me once, shame on you'\n      console.log aphorism\n\n    console.log aphorism\n\
    \    Fool me once, shame on you\n    Fool me 8 or more times, shame on me\n  \
    \  ```\n\n2.  众所周知，精灵工人国际联盟规定所有精灵的愿望总数不得超过三个。以下代码旨在强制执行该规则，但存在缺陷：\n\n    ```\n\
    \    Genie = ->\n      Genie::wishesLeft = 3\n\n    Genie::grantWish = ->\n  \
    \    if @wishesLeft > 0\n        console.log 'Your wish is granted!'\n       \
    \ @wishesLeft--\n    ```\n\n    这段代码有什么问题？你如何修复它？\n\n3.  不幸的是，`prototype` 属性并不是对象的“真正”原型。好消息是，你可以通过\
    \ `__proto__` 获取真正的原型。坏消息是，`__proto__` 并非在所有 JavaScript 环境中都受支持；特别是在 Internet\
    \ Explorer 中不可用。\n\n    尽管如此，使用 `__proto__` 来说明我们之前讨论的原型继承规则仍然很有用：\n\n    ```\n\
    \    class Season\n    class Spring extends Season\n\n    (new Season).__proto__.__proto__\n\
    \    (new Spring).__proto__.__proto__.__proto__\n    ```\n\n    在支持它的环境中（例如 Node），这里显示的两个原型的值是什么？\n\
    \n4.  我们还没有讨论类上的绑定函数，因此或许有必要演示一下。你期望以下代码生成什么输出？\n\n    ```\n    (window ? global).property\
    \ = 'global context'\n    @property = 'surrounding context'\n    class Foo\n \
    \     constructor: -> @property = 'instance context'\n      bar: => console.log\
    \ @property\n\n    foo = new Foo\n    bar = foo.bar\n    foo.bar()\n    bar()\n\
    \    ```\n\n    为什么你可能更倾向于使用 `->` 来定义 `bar`？\n\n#### 脚注\n\n| [[32]](#f_0038.html_FNPTR-32)\
    \ | [`requirejs.org/`](http://requirejs.org/) |\n\n| [[33]](#f_0039.html_FNPTR-33)\
    \ | [`javascriptweblog.wordpress.com/2010/06/07/understanding-javascript-prototypes/`](http://javascriptweblog.wordpress.com/2010/06/07/understanding-javascript-prototypes/)\
    \ |\n\n| [[34]](#f_0042.html_FNPTR-34) | [`nodejs.org/docs/v0.4.8/api/modules.html`](http://nodejs.org/docs/v0.4.8/api/modules.html)\
    \ |\n\n版权所有 © 2011，The Pragmatic Bookshelf。\n\n# 第 5 章\n\n使用 jQuery 实现 Web 交互\n\
    \n曾几何时，程序员们用纯 JavaScript 编写 Web 应用程序，不受繁重框架的束缚。富有冒险精神的程序员在这片肥沃的土地上漫游，为他们的应用设计出令人兴奋的新功能。但一切并非尽善尽美，因为这些动态骑士们完成的每一个大胆壮举都必须至少做两次：一次在\
    \ Netscape（及其开源后代）中，一次在 Internet Explorer 中。\n\n为了减轻这一负担，程序员们开始编写函数，以避免代码中的重复。这些函数变得越来越多、越来越复杂，最终融合成由数千行代码组成的库。很快，围绕这些库形成了相互争斗的派系。其中包括\
    \ MooTools、Prototype、Dojo 和 YUI。\n\n"
