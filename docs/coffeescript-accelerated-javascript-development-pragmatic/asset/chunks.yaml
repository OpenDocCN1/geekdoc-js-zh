    在 Ruby 世界中，首选的中间件是 Rack。最成熟的 Rack 集成方案是名副其实的 `rack-coffee`。[[58]](#f_0073.html_FOOTNOTE-58)
    它与 Rails、Sinatra 以及所有其他主流 Ruby Web 框架兼容（尽管 Sinatra 实际上自 2010 年 10 月起就已内置了对 CoffeeScript
    的支持）。最近，前面提到的 Barista 已被修改为可在任何基于 Rack 的框架中运行，而不仅仅是 Rails。


    与此同时，在 Python 领域，CoffeeCup 为 Django、Pylons、CherryPy 以及无数其他基于 WSGI 的框架提供了一流的 CoffeeScript
    支持。[[59]](#f_0073.html_FOOTNOTE-59) 如果你希望前端和后端都使用有意义的空白缩进，那将是一个很好的选择。当然，另一种选择是完全用同一种语言编写前端和后端。


    ## A2.5 Node.js 上的 CoffeeScript


    回想一下，`coffee` 文件可以直接在 Node.js 上使用 `coffee` 命令运行。因此在后端，无需编译。真正的技巧在于为前端提供编译后的 JavaScript。


    幸运的是，Connect（Node.js Web 框架的标准核心）附带了自动完成此操作的中间件。只需进行少量配置即可。你需要按顺序挂载 Connect 的
    `compiler` 和 `static` 中间件，如下所示。（我们在第 6 章 ​*使用 Node.js 构建服务端应用*​ 中使用了此技术。）


    ```

    compiler = connect.compiler src: coffeeDir, enable: [''coffeescript'']

    static = connect.static coffeeDir

    connect.createServer compiler, static

    ```


    在此示例中，`coffeeDir` 中的 `coffee` 文件将自动编译并作为 `js` 文件提供。


    一些 Node 框架包含了预配置的 CoffeeScript 服务功能。例如，参见 brunch 和 Zappa。


    虽然如今似乎每个人都在用 Rails 或 Django 开发 Web 应用，但仍然有很多网站根本不需要后端。如果能利用 CoffeeScript——或许还有
    Haml 和 Sass——来开发普通网站，同时生成符合标准的 HTML/CSS 和用于部署的压缩 JavaScript，那岂不是很好？


    ## A2.6 使用 Middleman 快速构建网站


    幸运的是，有 Thomas Reynolds 的 Middleman。[[60]](#f_0073.html_FOOTNOTE-60) 如果你已经安装了 Ruby
    和 RubyGems，那么启动并运行 Middleman 就像这样简单：


    ```

    $ gem install middleman

    $ mm-init myProject

    $ cd myProject

    $ mm-server

    ```


    现在访问 [`localhost:4567`](http://localhost:4567)，你的网站已经启动并运行。然后修改 `view` 目录中的模板文件并刷新浏览器；重复此过程直到你准备好部署。


    Middleman 期望 CoffeeScript 文件保存在 `view` 文件夹中的任何位置，扩展名为 `js.coffee`。例如，如果你将 `awesome.js.coffee`
    放在 `view/scripts` 中，那么相应的 `<script>` 标签将引用 `scripts/awesome.js`。请注意，这样的文件并不存在——它是由服务器在每个请求时自动生成的。这意味着当你更改
    CoffeeScript 代码并刷新浏览器时，页面将始终提供最新最好的 JavaScript。


    当你准备好部署时，只需运行：


    ```

    $ mm-build

    ```


    所有需要的 HTML/CSS/JavaScript 都会出现在 `build` 文件夹中。将该文件夹上传到服务器，你的网站就上线了！


    ## A2.7 用于系统脚本的 CoffeeScript


    在结束本附录之前，你是否知道你可以使用 CoffeeScript 来完成通常与 Perl 或 Python 相关的系统任务？只需在文件开头添加一个“shebang”行，指定
    `coffee` 的路径（抱歉，Windows 用户，这只在类 Unix 系统上有效）：


    ```

    #!/usr/bin/env coffee

    console.log ''Hello, world!''

    ```


    确保脚本是可执行的（`chmod +x helloscript.coffee`）；然后你可以使用 `sh helloscript.coffee` 或 `./helloscript.coffee`
    运行它。（熟悉的 `coffee helloscript.coffee` 仍然有效。）


    请记住，此脚本只能在安装了 CoffeeScript 编译器且其位于 `PATH` 中的系统上运行。


    至此，我们对 CoffeeScript 构建工具生态系统的介绍就结束了，但毫无疑问，自本书撰写以来，许多其他优秀的项目已经涌现！请务必查看 [`github.com/jashkenas/coffee-script/wiki`](http://github.com/jashkenas/coffee-script/wiki)
    以获取最新列表，并在 Twitter 上关注 @CoffeeScript 以了解新进展。


