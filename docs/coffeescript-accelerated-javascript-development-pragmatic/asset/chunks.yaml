    ```

    firstName = ''Joe''; middleInitial = ''T''; lastName = ''Plumber''

    ```


    But array pattern matching isn’t just a pretty syntax for making multiple assignments.
    For one thing, you can reference the same variable(s) on both sides of the assignment,
    making swaps a one-line affair instead of a three-line chore:


    ```

    [newBoss, oldBoss] = [oldBoss, newBoss]

    ```


    We can also use splats the same way that we used them in function definitions
    in Section 2.6, [​*Splats (...)*​](#f_0023.html_sec.splats):


    ```

    [theBest, theRest...] = topStudents

    ```


    If you think array pattern matching is great, you’ll love object pattern matching.
    Say we want to pick out a few values from an object:


    ```

    myRect =

    x: 100

    y: 200

    {x: myX, y: myY} = myRect

    ```


    Again, the “object” on the left side of the assignment isn’t really an object,
    it’s a pattern, providing keys and variable names to match these keys. So this
    is equivalent to the following:


    ```

    myX = myRect.x; myY = myRect.y

    ```


    This might not look like much of a gain, but remember (as we discussed in [​*Same-Name
    Key-Value Pairs*​](#f_0028.html_sec.sameNamePairs)) how `{x}` is short for `{x:
    x}`? Well, that works in patterns, too, which means that if you just want to copy
    `rect.x` and `rect.y` to local variables named `x` and `y`, then all you have
    to write is this:


    ```

    {x, y} = rect

    ```


    Believe me, this syntax will change the way you read properties from objects forever.
    To give another example, let’s say that we’re writing some tests using Node’s
    `assert` module. Specifically, we want to use the `assert.ok` and `assert.strictEqual`
    methods. We can load them as variables called `ok` and `strictEqual` by writing
    this:


    ```

    {ok, strictEqual} = require ''assert''

    ```


    One last tip—did I mention that array patterns and object patterns can be nested
    inside of each other?


    ```

    {languages: [favoriteLanguage, otherLanguages...]} = resume

    ```


    This code translates as “Take `resume.languages`, assign its first entry to a
    variable called `favoriteLanguage`, then assign the remaining entries to a new
    array called `otherLanguages`.” Not bad for one line, right?


    Pattern matching is also known as destructuring assignment and is a part of the
    JavaScript 1.7 standard (currently supported by the latest version of Firefox).
    But you don’t have to wait for that standard to catch on—CoffeeScript compiles
    each pattern to a series of simple assignments.


