    ## A3.7 迭代


    | 符号 | 别名 | JavaScript |

    | --- | --- | --- |

    | `f() for x of obj` | `for x of obj then f()` | `for (x in obj) {f()}` |

    | `f() for x in arr` | `for x in arr then f()` | `for (var i = 0; i < arr.length;
    i++) {f()}`* |

    | `f() for x in [a..b]` | `for x in [a..b] then f()` | `for (var i = a; i <= b;
    i++) {f()}`** |

    | `f() for x in [a...b]` | `for x in [a...b] then f()` | `for (var i = a; i <
    b; i++) {f()}`** |


    *在 CoffeeScript 版本中，`arr.length` 被缓存，因此循环期间对数组所做的更改不会影响迭代范围。


    **假设 `a < b`。如果 `a > b`，则循环向下计数而非向上。


