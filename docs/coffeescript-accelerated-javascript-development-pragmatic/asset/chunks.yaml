  trans: "\n在更经典的面相对象语言中，一个常见的惯用法是结合 `switch` 使用多态。我们还没有讨论 CoffeeScript 的 `switch`，它与\
    \ JavaScript 的 `switch` 有许多不同之处：首先，每个分支之间隐式地存在 `break`，以防止意外的“穿透”；其次，`switch`\
    \ 的结果会被返回。（当返回值被使用时，不允许使用 `break` 和 `return`。如果你尝试这样做，会得到 `SyntaxError: cannot\
    \ include a pure statement in an expression`。这是行话，意思是说 `a = return x` 没有意义，因此编译器不允许这种写法。）\n\
    \nCoffeeScript 还做了几处语法上的改动，部分目的是提醒 JavaScript 开发者注意这些隐藏的差异：用 `when` 代替 `case`，用\
    \ `else` 代替 `default`。（这些关键字借自 Ruby，在 Ruby 中 `case` 结构具有类似的语义。）单个 `when` 后面可以跟多个可能的匹配项，用逗号分隔。此外，这些匹配子句与其结果之间不再使用\
    \ `:`，而是通过缩进（或 `then`）来分隔。\n\n下面是一个简单的工厂函数，展示了所有这些特性：\n\n```\nrequisitionStarship\
    \ = (captain) ->\n  switch captain\n    when 'Kirk', 'Picard', 'Archer'\n    \
    \  new Enterprise()\n    when 'Janeway'\n      new Voyager()\n    else\n     \
    \ throw new Error('Invalid starship captain')\n```\n\n以上就是我们对模块和类的介绍。请记住：CoffeeScript\
    \ 当然不要求你使用类或经典的面相对象设计模式——毕竟大多数 JavaScript 开发者即使不使用这些也能做得很好——但对于某些应用来说，类是一种很自然的选择。\n\
    \n说到这个，还记得上一章项目中那堆混乱的代码吗？让我们看看能对它做些什么。\n\n## 4.5 项目：重构 5x5\n\n类提供了一种简洁清晰的方式来重新组织我们到目前为止编写的代码，以促进模块化和可扩展性。让我们创建三个类：\n\
    \n1.  `Dictionary`，用于在网格上查找有效单词\n2.  `Grid`，用于管理字母方块\n3.  `Player`，用于跟踪玩家的得分\n\
    \n我们将把这些类保存在三个不同的 `coffee` 文件中。此外，我们还会让这些类兼容所有主流浏览器环境以及 Node.js，为下一章中基于 jQuery\
    \ 的游戏版本铺平道路。为了让游戏能在 Node 下运行，我们将创建一个 `console.coffee` 文件，提供提示符并 `require` 这三个类。\n\
    \n### Dictionary 类\n\n由于我们希望支持浏览器，因此将单词列表从文本文件转换为可直接加载的 JavaScript 代码是合理的。我写了一个简短脚本来完成这项工作：\n\
    \n```\nfs = require 'fs'\nowl2 = fs.readFileSync 'OWL2.txt', 'utf8'\nwordList\
    \ = owl2.match /^(\\w+)/mg\nfileContents = \"\"\"\nroot = typeof exports === \"\
    undefined\" ? window : exports;\nroot.OWL2 = ['#{wordList.join \"',\\n'\"}']\n\
    \"\"\"\nfs.writeFile 'OWL2.js', fileContents\n```\n\n三引号 `\"\"\"` 语法（Python 程序员应该很熟悉）被称为\
    \ heredoc 字符串。它允许你以人类可读的格式编写多行字符串。你也可以使用三个单引号 `'''` 来界定 heredoc 字符串。`\"\"\"` 和\
    \ `'''` 的区别与 `\"` 和 `'` 的区别相同：前者允许插值，而后者不允许。\n\n运行脚本后，生成的 `OWL2.js` 看起来像这样：\n\n\
    ```\nroot = typeof global === \"undefined\" ? window : global;\nroot.OWL2 = ['AA',\n\
    ...\n'ZOOGEOGRAPHICAL'];\n```\n\n（为简洁起见，我省略了中间的 178,687 行。）\n\n现在，为了将 `Dictionary`\
    \ 与 Node 解耦，我们将单词列表和游戏网格传递给 `Dictionary` 的构造函数：\n\n```\nclass Dictionary\n  constructor:\
    \ (@originalWordList, grid) ->\n    @setGrid grid if grid?\n```\n\n注意第一个参数隐式赋值给了\
    \ `@originalWordList`（这个特性我们在第 2.4 节 *属性参数 (@arg)* 中介绍过）。\n\n当新游戏开始时，我们会自己调用 `setGrid`\
    \ 并传入新网格。这个网格可能有不同的大小，因此我们每次都会复制并过滤原始单词列表（`slice(0)` 是复制 JavaScript 数组的著名技巧）：\n\
    \n```\nsetGrid: (@grid) ->\n  @wordList = @originalWordList.slice(0)\n  @wordList\
    \ = (word for word in @wordList when word.length <= @grid.size)\n  @minWordLength\
    \ = Math.min.apply Math, (w.length for w in @wordList)\n  @usedWords = []\n  for\
    \ x in [0...@grid.size]\n    for y in [0...@grid.size]\n      @markUsed word for\
    \ word in @wordsThroughTile x, y\n```\n\n注意我们在这里也重置了 `usedWords` 列表。我们需要一种方法来标记某个单词已被使用：\n\
    \n```\nmarkUsed: (str) ->\n  if str in @usedWords\n    false\n  else\n    @usedWords.push\
    \ str\n    true\n```\n\n我们提供一个方法来判断单词是否有效，另一个方法来判断单词在当前游戏阶段是否可用：\n\n```\nisWord:\
    \ (str) -> str in @wordList\nisNewWord: (str) -> str in @wordList and str not\
    \ in @usedWords\n```\n\n下面是难点：给定一对坐标，我们希望找到所有经过 `Grid` 实例中该方块的单词。这里我就不详细列出了，因为它基本上与上一章中的\
    \ `wordsThroughTile` 函数相同。\n\n现在，为了让这个类可访问，我们将其设为全局：\n\n```\nroot = exports ?\
    \ window\nroot.Dictionary = Dictionary\n```\n\n### Grid 类\n\n在定义 `Grid` 类之前，我们先在\
    \ `grid.coffee` 中放置一些其他变量，赋予它们模块作用域：\n\n```\ntileCounts =\n  A: 9, B: 2, C: 2,\
    \ D: 4, E: 12, F: 2, G: 3, H: 2, I: 9, J: 1, K: 1, L: 4\n  M: 2, N: 6, O: 8, P:\
    \ 2, Q: 1, R: 6, S: 4, T: 6, U: 4, V: 2, W: 2, X: 1\n  Y: 2, Z: 1\n\ntotalTiles\
    \ = 0\ntotalTiles += count for letter, count of tileCounts\nalphabet = (letter\
    \ for letter of tileCounts).sort()\n\nrandomLetter = ->\n  randomNumber = Math.ceil\
    \ Math.random() * totalTiles\n  x = 1\n  for letter in alphabet\n    x += tileCounts[letter]\n\
    \    return letter if x > randomNumber\n```\n\n当我们实例化一个网格时，自动生成其初始的 `tiles` 矩阵：\n\
    \n```\nclass Grid\n  constructor: ->\n    @size = size = 5\n    @tiles = for x\
    \ in [0...size]\n```\n\n"
- fmt: "\nNow we’ll define some simple functions that allow us to check whether an\
    \ (x, y) pair is out of range, to swap two tiles (given an object with two coordinate\
    \ pairs), and to get a transposed version of the grid (an array of rows rather\
    \ than columns):\n\n[`Classes/5x5/Grid.coffee`](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Grid.coffee)\n\
    \n```\ninRange: (x, y) ->\n  0 <= x < @size and 0 <= y < @size\n\nswap: ({x1,\
    \ y1, x2, y2}) ->\n  [@tiles[x1][y1], @tiles[x2][y2]] = [@tiles[x2][y2], @tiles[x1][y1]]\n\
    \nrows: ->\n  for x in [0...@size]\n    for y in [0...@size]\n      @tiles[y][x]\n\
    ```\n\nI’ll spare you the two lines where we make the class a global.\n\n### The\
    \ Player Class\n\nEach `Player` instance should be given its own name and, optionally,\
    \ an initial grid. (As with `Dictionary`, we’ll use `setGrid` when a new game\
    \ starts.) The player starts with a score of 0, naturally:\n\n[`Classes/5x5/Player.coffee`](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Player.coffee)\n\
    \n```\nclass Player\n  constructor: (@name, dictionary) ->\n    @setDictionary\
    \ dictionary if dictionary?\n\n  setDictionary: (@dictionary) ->\n    @score =\
    \ 0\n    @moveCount = 0\n```\n\nLet’s provide a way for a player to make a move:\n\
    \n[`Classes/5x5/Player.coffee`](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Player.coffee)\n\
    \n```\nmakeMove: (swapCoordinates) ->\n  @dictionary.grid.swap swapCoordinates\n\
    \  @moveCount++\n  result = scoreMove @dictionary, swapCoordinates\n  @score +=\
    \ result.moveScore\n  result\n```\n\n### The Console.Coffee Interface\n\nAll of\
    \ the code from the last chapter that we didn’t refactor into other classes—that\
    \ is, everything related to command-line IO—is in `console.coffee`. I won’t repeat\
    \ the recycled code here, but the important part is these first four lines:\n\n\
    [`Classes/5x5/console.coffee`](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/console.coffee)\n\
    \n```\n{Dictionary} = require './Dictionary'\n{Grid} = require './Grid'\n{Player}\
    \ = require './Player'\n{OWL2} = require './OWL2'\n```\n\nThe `./` prefix in front\
    \ of each filename tells Node to load the file from the current path. An alternative\
    \ approach, added in Node 0.4, would be to create a `node_modules` directory in\
    \ `console.coffee`’s working path and then put the files in there.[[34]](#f_0044.html_FOOTNOTE-34)\
    \ Then no prefix would be needed.\n\nAnd we’re done! Try it for yourself:\n\n\
    ```\n$ coffee console.coffee\nWelcome to 5x5!\n```\n\nWe’ve refactored our old,\
    \ haphazard code into four nice, clean modules, three of which we’ll be reusing\
    \ in the next two chapters, first in a browser, then on a server. We saved ourselves\
    \ a ton of work by separating the reusable game logic code from the command-line\
    \ stuff, which (sigh of relief) we shall never speak of again. Onward!\n\n## 4.6\
    \ Just a Spoonful of Sugar\n\nIn this chapter, we’ve learned about two ways that\
    \ CoffeeScript supports modular programs: First, individual files (“modules”)\
    \ are isolated from each other, except when variables are explicitly exported.\
    \ And second, functions and data can be combined into classes.\n\nWe applied both\
    \ techniques to clean up our quick-and-dirty version of 5x5 from the last chapter.\
    \ The result? Not only is the code more readable, but it’s also much easier to\
    \ refactor, as we’ll see in the next chapter when we transform our old-school\
    \ text-based program into a newfangled web app. And we’ll do it with a little\
    \ help from JavaScript’s good pal, jQuery.\n\n## 4.7 Exercises\n\n1.  Explain\
    \ this output, and fix the code so that the old aphorism is displayed twice:\n\
    \n    ```\n    root = global ? window\n\n    root.aphorism = 'Fool me 8 or more\
    \ times, shame on me'\n\n    do restoreOldAphorism = ->\n      aphorism = 'Fool\
    \ me once, shame on you'\n      console.log aphorism\n\n    console.log aphorism\n\
    \    Fool me once, shame on you\n    Fool me 8 or more times, shame on me\n  \
    \  ```\n\n2.  As everyone knows, the Genie Workers International Union mandates\
    \ a limit of three wishes across all genies. The following code is designed to\
    \ enforce that rule, but it has a flaw:\n\n    ```\n    Genie = ->\n      Genie::wishesLeft\
    \ = 3\n\n    Genie::grantWish = ->\n      if @wishesLeft > 0\n        console.log\
    \ 'Your wish is granted!'\n        @wishesLeft--\n    ```\n\n    What’s wrong\
    \ with this code, and how would you fix it?\n\n3.  The `prototype` property is\
    \ not, unfortunately, the “true” prototype of an object. The good news is that\
    \ you can get the true prototype with `__proto__`. The bad news is that `__proto__`\
    \ isn’t supported in all JS environments; in particular, it’s not available under\
    \ Internet Explorer.\n\n    Still, it’s useful to use `__proto__` to illustrate\
    \ the rules we talked about regarding prototype inheritance:\n\n    ```\n    class\
    \ Season\n    class Spring extends Season\n\n    (new Season).__proto__.__proto__\n\
    \    (new Spring).__proto__.__proto__.__proto__\n    ```\n\n    In an environment\
    \ that supports it (such as Node), what is the value of the two prototypes shown\
    \ here?\n\n4.  We haven’t discussed bound functions on classes, so perhaps a demonstration\
    \ is in order. What output do you expect the following code to generate?\n\n \
    \   ```\n    (window ? global).property = 'global context'\n    @property = 'surrounding\
    \ context'\n    class Foo\n      constructor: -> @property = 'instance context'\n\
    \      bar: => console.log @property\n\n    foo = new Foo\n    bar = foo.bar\n\
    \    foo.bar()\n    bar()\n    ```\n\n    Why might you prefer to define `bar`\
    \ using `->` instead?\n\n#### Footnotes\n\n| [[32]](#f_0038.html_FNPTR-32) | [http://requirejs.org/](http://requirejs.org/)\
    \ |\n\n| [[33]](#f_0039.html_FNPTR-33) | [http://javascriptweblog.wordpress.com/2010/06/07/understanding-javascript-prototypes/](http://javascriptweblog.wordpress.com/2010/06/07/understanding-javascript-prototypes/)\
    \ |\n\n| [[34]](#f_0042.html_FNPTR-34) | [http://nodejs.org/docs/v0.4.8/api/modules.html](http://nodejs.org/docs/v0.4.8/api/modules.html)\
    \ |\n\nCopyright © 2011, The Pragmatic Bookshelf.\n\n# Chapter 5\n\nWeb Interactivity\
    \ with jQuery\n\nOnce upon a time, programmers wrote web applications in pure\
    \ JavaScript, unencumbered by heavy frameworks. Adventurous programmers roamed\
    \ these fertile lands, devising exciting new functionality for their apps. But\
    \ all was not well, for every bold feat performed by these dynamic knights had\
    \ to be done twice (at least): once in Netscape (and its open-source descendants)\
    \ and once in Internet Explorer.\n\nTo alleviate this burden, programmers began\
    \ to write functions that allowed them to avoid repetition in their code. These\
    \ functions became ever more numerous and complex, fusing into libraries made\
    \ up of thousands of lines of code. Soon, warring factions began to form around\
    \ them. Among these were MooTools, Prototype, Dojo, and YUI.\n"
  raw: "|   | **`for`** `y` **`in`** `[0...size]` |\n\n|   | `randomLetter()` |\n\n\
    Now we’ll define some simple functions that allow us to check whether an (x, y)\
    \ pair is out of range, to swap two tiles (given an object with two coordinate\
    \ pairs), and to get a transposed version of the grid (an array of rows rather\
    \ than columns):\n\n| [Classes/5x5/Grid.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Grid.coffee)\
    \ |\n\n|   | `inRange: (x, y)` **`->`** |\n\n|   | `0 <= x < @size and 0 <= y\
    \ < @size` |\n\n|   |  |\n\n|   | `swap: ({x1, y1, x2, y2})` **`->`** |\n\n|  \
    \ | `[@tiles[x1][y1], @tiles[x2][y2]] = [@tiles[x2][y2], @tiles[x1][y1]]` |\n\n\
    |   |  |\n\n|   | `rows:` **`->`** |\n\n|   | **`for`** `x` **`in`** `[0...@size]`\
    \ |\n\n|   | **`for`** `y` **`in`** `[0...@size]` |\n\n|   | `@tiles[y][x]` |\n\
    \nI’ll spare you the two lines where we make the class a global.\n\n### The Player\
    \ Class\n\nEach `Player` instance should be given its own name and, optionally,\
    \ an initial grid. (As with `Dictionary`, we’ll use `setGrid` when a new game\
    \ starts.) The player starts with a score of 0, naturally:\n\n| [Classes/5x5/Player.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Player.coffee)\
    \ |\n\n|   | **`class`** `Player` |\n\n|   | `constructor: (@name, dictionary)`\
    \ **`->`** |\n\n|   | `@setDictionary dictionary` **`if`** `dictionary?` |\n\n\
    |   |  |\n\n|   | `setDictionary: (@dictionary)` **`->`** |\n\n|   | `@score =\
    \ 0` |\n\n|   | `@moveCount = 0` |\n\nLet’s provide a way for a player to make\
    \ a move:\n\n| [Classes/5x5/Player.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/Player.coffee)\
    \ |\n\n|   | `makeMove: (swapCoordinates)` **`->`** |\n\n|   | `@dictionary.grid.swap\
    \ swapCoordinates` |\n\n|   | `@moveCount++` |\n\n|   | `result = scoreMove @dictionary,\
    \ swapCoordinates` |\n\n|   | `@score += result.moveScore` |\n\n|   | `result`\
    \ |\n\n### The Console.Coffee Interface\n\nAll of the code from the last chapter\
    \ that we didn’t refactor into other classes—that is, everything related to command-line\
    \ IO—is in `console.coffee`. I won’t repeat the recycled code here, but the important\
    \ part is these first four lines:\n\n| [Classes/5x5/console.coffee](http://media.pragprog.com/titles/tbcoffee/code/Classes/5x5/console.coffee)\
    \ |\n\n|   | `{Dictionary} = require` *`'./Dictionary'`* |\n\n|   | `{Grid} =\
    \ require` *`'./Grid'`* |\n\n|   | `{Player} = require` *`'./Player'`* |\n\n|\
    \   | `{OWL2} = require` *`'./OWL2'`* |\n\nThe `./` prefix in front of each filename\
    \ tells Node to load the file from the current path. An alternative approach,\
    \ added in Node 0.4, would be to create a `node_modules` directory in `console.coffee`’s\
    \ working path and then put the files in there.[[34]](#f_0044.html_FOOTNOTE-34)\
    \ Then no prefix would be needed.\n\nAnd we’re done! Try it for yourself:\n\n\
    |   | `$` **`coffee console.coffee`** |\n\n|   | `Welcome to 5x5!` |\n\nWe’ve\
    \ refactored our old, haphazard code into four nice, clean modules, three of which\
    \ we’ll be reusing in the next two chapters, first in a browser, then on a server.\
    \ We saved ourselves a ton of work by separating the reusable game logic code\
    \ from the command-line stuff, which (sigh of relief) we shall never speak of\
    \ again. Onward!\n\n## 4.6 Just a Spoonful of Sugar\n\nIn this chapter, we’ve\
    \ learned about two ways that CoffeeScript supports modular programs: First, individual\
    \ files (“modules”) are isolated from each other, except when variables are explicitly\
    \ exported. And second, functions and data can be combined into classes.\n\nWe\
    \ applied both techniques to clean up our quick-and-dirty version of 5x5 from\
    \ the last chapter. The result? Not only is the code more readable, but it’s also\
    \ much easier to refactor, as we’ll see in the next chapter when we transform\
    \ our old-school text-based program into a newfangled web app. And we’ll do it\
    \ with a little help from JavaScript’s good pal, jQuery.\n\n## 4.7 Exercises\n\
    \n1.  Explain this output, and fix the code so that the old aphorism is displayed\
    \ twice:\n\n    |   | `root = global ? window` |\n\n    |   |  |\n\n    |   |\
    \ `root.aphorism =` *`'Fool me 8 or more times, shame on me'`* |\n\n    |   |\
    \  |\n\n    |   | **`do`** `restoreOldAphorism =` **`->`** |\n\n    |   | `aphorism\
    \ =` *`'Fool me once, shame on you'`* |\n\n    |   | `console.log aphorism` |\n\
    \n    |   |  |\n\n    |   | `console.log aphorism` |\n\n    |   | `Fool me once,\
    \ shame on you` |\n\n    |   | `Fool me 8 or more times, shame on me` |\n\n2.\
    \  As everyone knows, the Genie Workers International Union mandates a limit of\
    \ three wishes across all genies. The following code is designed to enforce that\
    \ rule, but it has a flaw:\n\n    |   | `Genie =` **`->`** |\n\n    |   | `Genie::wishesLeft\
    \ = 3` |\n\n    |   |  |\n\n    |   | `Genie::grantWish =` **`->`** |\n\n    |\
    \   | **`if`** `@wishesLeft > 0` |\n\n    |   | `console.log` *`'Your wish is\
    \ granted!'`* |\n\n    |   | `@wishesLeft--` |\n\n    What’s wrong with this code,\
    \ and how would you fix it?\n\n3.  The `prototype` property is not, unfortunately,\
    \ the “true” prototype of an object. The good news is that you can get the true\
    \ prototype with `__proto__`. The bad news is that `__proto__` isn’t supported\
    \ in all JS environments; in particular, it’s not available under Internet Explorer.\n\
    \n    Still, it’s useful to use `__proto__` to illustrate the rules we talked\
    \ about regarding prototype inheritance:\n\n    |   | **`class`** `Season` |\n\
    \n    |   | **`class`** `Spring` **`extends`** `Season` |\n\n    |   |  |\n\n\
    \    |   | `(`**`new`** `Season).__proto__.__proto__` |\n\n    |   | `(`**`new`**\
    \ `Spring).__proto__.__proto__.__proto__` |\n\n    In an environment that supports\
    \ it (such as Node), what is the value of the two prototypes shown here?\n\n4.\
    \  We haven’t discussed bound functions on classes, so perhaps a demonstration\
    \ is in order. What output do you expect the following code to generate?\n\n \
    \   |   | `(window ? global).property =` *`'global context'`* |\n\n    |   | `@property\
    \ =` *`'surrounding context'`* |\n\n    |   | **`class`** `Foo` |\n\n    |   |\
    \ `constructor:` **`->`** `@property =` *`'instance context'`* |\n\n    |   |\
    \ `bar:` **`=>`** `console.log @property` |\n\n    |   |  |\n\n    |   | `foo\
    \ =` **`new`** `Foo` |\n\n    |   | `bar = foo.bar` |\n\n    |   | `foo.bar()`\
    \ |\n\n    |   | `bar()` |\n\n    Why might you prefer to define `bar` using `->`\
    \ instead?\n\n#### Footnotes\n\n| [[32]](#f_0038.html_FNPTR-32) | [http://requirejs.org/](http://requirejs.org/)\
    \ |\n\n| [[33]](#f_0039.html_FNPTR-33) | [http://javascriptweblog.wordpress.com/2010/06/07/understanding-javascript-prototypes/](http://javascriptweblog.wordpress.com/2010/06/07/understanding-javascript-prototypes/)\
    \ |\n\n| [[34]](#f_0042.html_FNPTR-34) | [http://nodejs.org/docs/v0.4.8/api/modules.html](http://nodejs.org/docs/v0.4.8/api/modules.html)\
    \ |\n\nCopyright © 2011, The Pragmatic Bookshelf.\n\n# Chapter 5\n\nWeb Interactivity\
    \ with jQuery\n\nOnce upon a time, programmers wrote web applications in pure\
    \ JavaScript, unencumbered by heavy frameworks. Adventurous programmers roamed\
    \ these fertile lands, devising exciting new functionality for their apps. But\
    \ all was not well, for every bold feat performed by these dynamic knights had\
    \ to be done twice (at least): once in Netscape (and its open-source descendants)\
    \ and once in Internet Explorer.\n\nTo alleviate this burden, programmers began\
    \ to write functions that allowed them to avoid repetition in their code. These\
    \ functions became ever more numerous and complex, fusing into libraries made\
    \ up of thousands of lines of code. Soon, warring factions began to form around\
    \ them. Among these were MooTools, Prototype, Dojo, and YUI."
