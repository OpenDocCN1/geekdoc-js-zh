- "# Node.js 入门指南：中级开发者解锁服务器端 JavaScript 力量终极指南\n\n\n\n![](img/image_rsrc21P.jpg)\n\
  \n\n在本书中，你将学习带有图解的说明和实操练习，通过成功执行练习获得带有输出的现成解决方案，以及逐步解释。AMIT K\n\n\n## 序言\n循步学习 Node\
  \ Js。\n初学者 Node Js：中级开发者释放服务器端 Javascript 力的终极指南\n\n通过《精通 Node.js：中级开发者释放服务器端 JavaScript\
  \ 力的终极指南》，解锁 `Node.js` 的全部潜力，并彻底改变你的 Web 和服务器端开发技能。\n\n`Node.js` 因其速度、可扩展性和丰富的生态系统席卷了\
  \ Web 开发领域。在这本全面的电子书中，我们将带你开启一段从中级到高级 `Node.js` 开发者的旅程，为你提供应对复杂项目和构建高性能应用程序的知识和技能。\n\
  \n探索 `Node.js` 的核心概念，从异步编程、事件驱动架构到使用 `npm` 和 `Yarn` 管理依赖。通过 `Express.js` 深入 Web\
  \ 应用的世界，并探索用于创建 RESTful API 的专用框架，无论是构建单页应用程序还是高流量服务。\n\n学习使用 `WebSockets` 进行实时通信的艺术，它非常适合构建交互式应用程序并提供实时数据更新。探索与\
  \ `MySQL` 数据库的集成。\n\n## 第 1 章：NodeJs 简介\n\n### 什么是 NodeJs\n在直接回答“什么是 NodeJS?”之前，我将先向你介绍\
  \ `NodeJS` 的诞生背景，这有助于你更容易理解相关问题。\n\n### Chrome 与 V8 Javascript 引擎\n人知道 `Chrome`\
  \ 是一个著名的免费 Google 浏览器，第一个版本于 2008 年 12 月发布，其中 `V8 JavaScript Engine` 是一个用 `C++`\
  \ 编写的程序，代码开源，用于 Google `Chrome` 以高性能地解析和执行 Javascript 代码。它解析 Javascript 语法并将其解释为计算机代码以执行。\n\
  \n| ![](img/image_rsrc21R.jpg) |\n\n注意：除 `Chrome` 之外的浏览器可能使用其他的 Javascript 引擎。\n\
  \n| 浏览器 | Javascript 引擎 |\n| :--- | :--- |\n| Chrome | V8 JS Engine |\n| Firefox\
  \ | SpiderMonkey |\n| IE, Edge | Chakra |\n\n### NodeJS\n你可以使用“Javascript 语法”编写代码片段来连接数据库。`V8\
  \ JS Engine` 会解析你的 Javascript 代码并将其解释为计算机代码以执行。当然，这种代码片段不是用于客户端，而是用于服务器端的。因此，一种能力被开启了，你可以使用“Javascript\
  \ 语法”编写服务器端 Web 应用，而不是使用 `PHP` 或 `Java`。\n\nJavascript 代码\n```javascript\nconst\
  \ mysql = require('mysql');const connection = mysql.createConnection({host: 'localhost',user:\
  \ 'user',password: 'password',database: 'database name'});connection.connect((err)\
  \ => {if (err) throw err;console.log('Connected!');});\n```\n`NodeJS` 诞生了。`V8 Javascript\
  \ Engine` 是 `NodeJS` 的组件之一。下面是 `NodeJS` 的架构图：\n\n### NodeJs Javascript 库\n| ![](img/image_rsrc21S.jpg)\
  \ |\n\n简而言之，`NodeJS` 可以替换 `PHP`、`Java` 来构建服务器端 Web 应用。你不再通过 `PHP`、`Java` 编写代码，而是使用\
  \ Javascript 语法。\n\n### 所以，什么是 NodeJS\n`NodeJS` 是浏览器外的 JavaScript 运行时环境。`NodeJS`\
  \ 还包含其他组件和库，因此它可以像 Web 应用服务器一样运行。\n\n重要提示：`NodeJS` 不是 Javascript 的扩展语言。\n\n## 第\
  \ 2 章：安装 Atom 编辑器\n\n### 什么是 Atom 软件\nAtom 是一个免费的文本（及源代码）编辑器。其开源代码支持 `Linux`、`Mac\
  \ OS`、`Windows` 等操作系统。它支持通过 `NodeJS` 插件并嵌入由 `GitHub` 开发的 `Git-Control`。\n\n`Atom`\
  \ 被评估为文本编辑（及源代码）软件，与类似的软件相比，它具有现代、易于使用的界面和卓越的特性。\n\n`Atom` 支持以下语言：\nC/C++, C#, Clojure,\
  \ CSS, CoffeeScript, `GitHub Flavored Markdown`, Go, Git, HTML, JavaScript, Java,\
  \ JSON, Julia, Less, Make, Mustache, Objective-C, PHP, Perl, Property List (Apple),\
  \ Python, Ruby on Rails, Sass, Shell script, Scala, SQL, TOML, XML, YAML\n\n| ![](img/image_rsrc21T.jpg)\
  \ |\n\n### 下载 Atom\n要下载 `Atom`，请访问其主页。请注意，`Atom` 支持各种操作系统。如果你使用 `Windows`，请确保你的操作系统是\
  \ `Windows 7` 64 位或更高版本。\n\n* https://atom.io/\n\n| ![](img/image_rsrc21U.jpg) |\n\
  \n成功下载后，你将获得一个文件。\n\n| ![](img/image_rsrc21V.jpg) |\n\n好的，在完成下载并安装 `Atom` 后，这是 `Atom`\
  \ 的界面：\n\n| ![](img/image_rsrc21W.jpg) |\n\n## 第 3 章：在 Windows 上安装 NodeJS\n\n###\
  \ 下载 NodeJS\n要下载 `NodeJS`，你需要访问以下地址：\n\n* https://nodejs.org/download/\n\n| ![](img/image_rsrc21X.jpg)\
  \ |\n\n成功下载后，你将获得一个文件。\n\n| ![](img/image_rsrc21Y.jpg) |\n\n### 安装 NodeJS\n在 `Windows`\
  \ 上安装 `NodeJS` 非常简单。接受默认选项并一直“Next”直到最后一步。\n\n| ![](img/image_rsrc21Z.jpg) |\n\n\
  | ![](img/image_rsrc220.jpg) |\n\n| ![](img/image_rsrc221.jpg) |\n\n默认情况下，`NPM`\
  \ 软件也安装在你的系统中。这是一个管理 Javascript 库的软件。\n\n| ![](img/image_rsrc222.jpg) |\n\n| ![](img/image_rsrc223.jpg)\
  \ |\n\n| ![](img/image_rsrc224.jpg) |\n\n### 检查并配置\n好的，在上面的步骤中，我们成功下载并安装了 `NodeJS`。现在，你需要检查安装结果并配置\
  \ `NodeJS`。\n\n打开 `CMD` 窗口并执行以下命令来检查 `NodeJS` 和 `NPM` 的版本：\n\n```bash\nnode -v\n\
  npm -v\n```\n\n| ![](img/image_rsrc225.jpg) |\n\n## 第 4 章：什么是 NPM\n\n### 什么是 NPM\n\
  `NPM` 代表 Node Package Manager（Node 包管理器），是一个用于 `Node.js` Javascript 编程库的（程序）工具。这个工具对于开源世界实际上是必要的。在\
  \ Javascript 社区中，开发者共享成千上万的代码片段，帮助新项目避免重写基础组件、编程库甚至框架。每个代码片段可能依赖许多许多开源代码。\n\n`NPM`\
  \ 基本上与 `Maven` 相似。区别在于 `NPM` 管理 Javascript 库，而 `Maven` 管理 Java 库。\n\n\n\n\n\n一个与\
  \ NPM 类似的软件是 `Yarn`，由 Facebook 开发，其卓越的特性使其成为 NPM 的替代方案。在相同的情况下，Java 库管理软件是 `Gradle`，凭借其卓越的特性，逐渐取代\
  \ Maven。\n\n### NPM 的特性\n\n要运行 NPM 软件，你的系统需要安装 `NodeJS`。NPM 软件内置在 `NodeJS` 安装程序中，因此，当你完成\
  \ `NodeJS` 的安装后，你将同时拥有它们。\n\n在你的电脑上安装好 NPM 后，你可以检查它的版本：\n\n```\nnpm -v\n```\n\n\
  ![](img/image_rsrc226.jpg)\n\n因为 NPM 是安装在你的电脑上的一个软件，你可以用它从互联网安装 Javascript 库。要安装一个库，只需要打开\
  \ `CMD` 窗口并执行以下命令：\n\n```bash\nnpm install <package name>\n```\n\n```bash\nnpm install\
  \ vue\n```\n\n你可以在你的 Javascript 代码中使用 `Vue.js`：\n\n```javascript\nvar Vue = require('vue');\n\
  ```\n\n## 第 5 章：NodeJS\n\n### 创建一个 NodeJS 项目\n\n首先，你需要创建一个名为 `MyProject` 的目录，或者你喜欢的任何名称。\n\
  \n![](img/image_rsrc227.jpg)\n\n打开 `CMD` 和 `CD` 窗口进入你刚刚创建的目录。之后运行以下命令，让 NPM 为你创建项目。\n\
  \n```bash\nnpm init\n```\n\n![](img/image_rsrc228.jpg)\n\n接受默认选项并按“回车”直到完成。\n\n\
  ![](img/image_rsrc229.jpg)\n\n在你的项目中创建了一个名为 `package.json` 的文件。\n\n![](img/image_rsrc22A.jpg)\n\
  \n你的项目需要一些库包，你需要在 NPM 的支持下安装它们：\n\n#### Express\n`Express.js`（或简单称为 `Express`）是一个用于\
  \ `NodeJS` 的 Web 应用框架。它为 Web 和移动应用提供了一系列强大的功能。\n\n#### Ejs\n`EJS` 代表“嵌入式 JavaScript\
  \ 模板”（Embedded JavaScript templating），这是一个库，用于解析 `ejs` 文件并创建 HTML 返回给客户端（浏览器）。\n\
  \n```bash\nnpm install express ejs\n```\n\n![](img/image_rsrc22B.jpg)\n\n安装完成后，你可以看到项目发生了变化：\n\
  \n![](img/image_rsrc22C.jpg)\n\n### 创建项目结构\n\n在上面的步骤中，我们通过命令创建了项目。现在我们将使用一个更可视化的工具打开这个项目。在这里，我使用\
  \ `Atom` 编辑器（我在上面的步骤建议你安装的软件）。\n\n*   `File/Add Project Folder`\n\n![](img/image_rsrc22D.jpg)\n\
  \n好的，项目已在 `Atom` 中打开：\n\n![](img/image_rsrc22E.jpg)\n\n项目中创建两个子目录：`public` 和 `views`：\n\
  \n*   `public`：一个包含用户可以访问的所有文件的目录，例如图片、视频等...\n*   `views`：你的网站将有很多页面，例如首页、登录页...此目录是存放你所有页面的地方。\n\
  \n![](img/image_rsrc22F.jpg)\n\n在 `views` 目录中，我们创建了 两个文件：\n\n*   `homePage.ejs`\n\
  *   `testPage.ejs`\n\n![](img/image_rsrc22G.jpg)\n\n**homePage.ejs**\n```html\n\
  <!DOCTYPE html><html lang=\"en\" dir=\"ltr\"><head><meta charset=\"utf-8\"><title>Home</title></head><body><h1>This\
  \ is Home Page</h1></body></html>\n```\n\n**testPage.ejs**\n```html\n<!DOCTYPE html><html\
  \ lang=\"en\" dir=\"ltr\"><head><meta charset=\"utf-8\"><title>Test</title></head><body><h1>This\
  \ is Test Page</h1></body></html>\n```\n\n接下来，创建一个名为 `index.js` 的文件，并输入该文件的内容。这是你项目的配置文件：\n\
  \n![](img/image_rsrc22H.jpg)\n\n**index.js**\n```javascript\nvar express = require(\"\
  express\");\nvar app = express();\napp.use(express.static(\"public\"));\napp.set(\"\
  view engine\", \"ejs\");\napp.set(\"views\", \"./views\");\napp.listen(3000);\n\
  app.get(\"/\", function(request, response)  {response.render(\"homePage\");});\n\
  app.get(\"/test\", function(request, response)  {response.render(\"testPage\");});\n\
  ```\n\n好的，现在是解释上面 `index.js` 文件的内容了。\n\n| 代码 |  |\n| :--- | :--- |\n| `var express\
  \ = require(\"express\");` | `ExpressJS` 是一个 Web 应用框架。这行代码表示你想使用它。 |\n| `var app\
  \ = express();` | 创建一个 `Express` 对象。 |\n| `app.use(express.static(\"public\"));`\
  \ | 这行代码告诉应用程序服务器你想使用 `public` 目录来存放静态数据，用户可以访问该目录下的文件。 |\n| `app.set(\"view engine\"\
  , \"ejs\");` | 这行代码告诉应用程序服务器你想使用 `EJS` 库。它是处理你页面的机制。`EJS` 将创建 HTML 返回给用户的浏览器。 |\n\
  | `app.set(\"views\", \"./views\");` | 这行代码向应用程序服务器显示目录的路径。 |\n| `app.listen(3000);`\
  \ | 应用程序在 3000 端口上监听。 |\n| `app.get(\"/\", function(request, response)  {response.render(\"\
  homePage\");});` | 定义根路由。 |\n| `app.get(\"/test\", function(request, response) \
  \ {response.render(\"testPage\");});` | 定义 /test 路由。 |\n\n### 运行应用程序\n\n打开 `CMD`\
  \ 窗口进入你刚刚创建的目录。\n\n```bash\nnode index.js\n```\n\n\n\n\n\n| Module | Description\
  \ |\n| :--- | :--- |\n| dgram | 提供 UDP 数据报套接字的实现 |\n| dns | 用于 DNS 查询和域名解析函数 |\n\
  | events | 用于处理事件 |\n| fs | 处理文件系统 |\n| http | 让 Node.js 充当 HTTP 服务器 |\n| https\
  \ | 让 Node.js 充当 HTTPS 服务器 |\n| net | 创建服务器和客户端 |\n| os | 提供有关操作系统的信息 |\n| path\
  \ | 处理文件路径 |\n| querystring | 处理 URL 查询字符串 |\n| readline | 逐行处理可读流 |\n| stream |\
  \ 处理流式数据 |\n| string_decoder | 将 buffer 对象解码为字符串 |\n| timers | 在指定的毫秒数后执行函数 |\n\
  | tls | 实现 TLS 和 SSL 协议 |\n| tty | 提供供文本终端使用的类 |\n| url | 解析 URL 字符串 |\n| util |\
  \ 访问实用函数 |\n\n要使用模块，请使用 `require(moduleName)` 函数。例如，`http` 是一个让 NodeJS 运行得像 HTTP\
  \ 服务器的模块。\n\n在你的 NodeJS 项目中，创建一个 `module-examples` 目录来包含你在在本课程中练习的 Javascript 文件。\n\
  \n| ![](img/image_rsrc22Z.jpg) |\n\n在 `module-examples` 目录下创建一个名为 `http-example.js`\
  \ 的文件。\n\n| ![](img/image_rsrc230.jpg) |\n\n`http-example.js`\n\n```javascript\n\
  var http = require(\"http\");\nhttp.createServer(function(req, res) {\n  res.writeHead(200,\
  \ {\"Content-Type\": \"text/html\"});\n  res.write(\"<h1>Hello World</h1>\");\n\
  \  res.write(\"<h2>Hello Http</h2>\");\n  res.end();\n}).listen(8080)\n```\n\n打开\
  \ CMD 窗口进入进入项目目录，使用 NodeJS 运行 `http-example.js` 文件：\n\n```bash\nnode ./module-examples/http-example.js\n\
  ```\n\n打开浏览器并访问路径：\n* http://localhost:8080/\n\n| ![](img/image_rsrc231.jpg) |\n\
  \n## 创建你的模块\n\n在 NodeJS 中，你可以创建一个自定义模块。模块是一个 Javascript 文件。请注意该文件的位置，因为它会影响你使用它的方式。你有\
  \ 2 种选择该文件位置的方法：\n\n1. 将模块文件放在名为 `node_modules` 的目录中（项目的子目录）。这是推荐的位置。\n2. 将模块文件放在你的其中一个目录中，而不是\
  \ `node_modules` 中。\n\n| ![](img/image_rsrc232.jpg) |\n\nNodeJS 建议你将你的模块文件放在项目的\
  \ `node_modules` 目录中。请等一分钟，我将解释为什么你的模块应该放在这个目录中。\n\n### 在你的 Javascript 文件中导出内容的语法。\n\
  \n```javascript\nexports = something;// 或者：module.exports = something; \n```\n\n\
  `my-first-module.js`\n\n首先，在 `node_modules` 目录下创建一个 `my-first-module.js` 文件，在另一个目录下创建一个\
  \ `test-my-first-module.js` 文件。\n\n| ![](img/image_rsrc233.jpg) |\n\n在例例中，`my-first-module.js`\
  \ 文件有很多函数，但我只导出了 \"sum\" 函数。\n\n`node_modules/my-first-module.js`\n\n```javascript\n\
  subtract = function(a, b) {return a - b;}\nsum = function (a, b) {return a + b;}\n\
  module.exports = sum;\n```\n\n| ![](img/image_rsrc234.jpg) |\n\n`module-examples/test-my-first-module.js`\n\
  \n```javascript\nvar sum = require(\"my-first-module.js\");\nconsole.log(\"Sum 100\
  \ and 150\");\nvar c = sum(100, 150);\nconsole.log(\"Value = \" + c);\n```\n\n运行上面的示例：\n\
  \n```bash\nnode ./module-examples/test-my-first-module.js\n```\n\n## 第 8 章：NodeJS\
  \ 中的回调 (Callback) 概念\n\n### 什么是回调 (Callback)\n\n为了解释什么是回调，让我们来看以下情况：\n\n你去一家商店买你喜欢的东西。店员告诉你该商品现在缺货了。你留下了电话号码，并他们在到货后立即给你回电。然后你就可以出去或工作，不需要再担心这家商店，直到你接到商店的电话通知你请求的商品已到。\n\
  \n| ![](img/image_rsrc235.jpg) |\n\nNodeJS 服务器可以接收来自许多用户的许多请求。因此，为了提高可用性，NodeJS\
  \ 的所有 API 都设计为支持回调。“回调”是一个在 NodeJs 完成特定任务时被调用的函数。\n\n### NodeJS 回调\n\n在 NodeJS 中，API\
  \ 被设计为支持回调。假设你正在编写一个读取 2 个文件的程序。为了实现这一点，你使用了 `fs` 模块，它提供了两个函数如 `readFile` 和 `readFileSync`\
  \ 来读取文件。我们将学习这两个函数之间的区别。\n\n#### 阻塞 (Blocking)\n\n`readFileSync` 是一个同步读取文件的函数。因此，当该函数执行时，它会阻塞程序执行后续代码行。\n\
  \n`blocking-example.js`\n\n```javascript\nvar fs = require(\"fs\");\n// -----> 读取文件\
  \ 1:\nconsole.log(\"\\n\");\nconsole.log(\"Read File 1\");\nvar data1 = fs.readFileSync('C:\\\
  \\test\\\\file1.txt');\nconsole.log(\"- Data of file 1: \");\nconsole.log(data1.toString());\n\
  // -----> 读取文件 2:\nconsole.log(\"\\n\");\nconsole.log(\"Read File 2\");\nvar data2\
  \ = fs.readFileSync('C:\\\\test\\\\file2.txt');\nconsole.log(\"- Data of file 2:\
  \ \");\nconsole.log(data2.toString());\nconsole.log(\"\\n\");\nconsole.log(\"Program\
  \ Ended\");\n```\n\n打开 CMD 窗口并执行 `blocking-example.js` 文件：\n\n```bash\nnode callback-examples/blocking-example.js\n\
  ```\n\n#### 非阻塞 (Non Blocking)\n\n你应该使用 `readFile` 函数来为程序获得更好的性能。该函数异步读取文件。它不会阻塞程序执行后续代码行。换句话说，程序不会等待函数完成。但当该函数完成它的任务时，它会调用回调函数。\n\
  \n```javascript\n// 异步读取文件。\nfs.readFile('C:\\\\test\\\\file1.txt', aCallbackFunction\
  \ );\n```\n\n查看完整示例：\n\n`non-blocking-example.js`\n\n```javascript\nvar fs = require(\"\
  fs\");\n// 一个回调函数！\nfunction readFinishedFile1(err, data) {\n  if (err) console.log(err);\n\
  \  console.log(\"- Data of file 1: \");\n  console.log(data.toString());\n}\n//\
  \ 一个回调函数！\nfunction readFinishedFile2(err, data) {\n  if (err) console.log(err);\n\
  \  console.log(\"- Data of file 2: \");\n  console.log(data.toString());\n}\n//\
  \ -----> 读取文件 1:\nconsole.log(\"\\n\");\nconsole.log(\"Read File 1\");\nfs.readFile('C:\\\
  \\test\\\\file1.txt', readFinishedFile1);\n// -----> 读取文件 2:\nconsole.log(\"\\n\"\
  );\nconsole.log(\"Read File 2\");\nfs.readFile('C:\\\\test\\\\file2.txt', readFinishedFile2);\n\
  console.log(\"\\n\");\nconsole.log(\"Program Ended\");\n```\n\n打开 CMD 窗口并运行 `non-blocking-example.js`：\n\
  \n```bash\nnode callback-examples/non-blocking-example.js\n```\n\n## 第 9 章：理解 NodeJS\
  \ 中的事件循环 (Event Loop)\n\n### 事件循环概述\n\nNodeJS 是一个单线程应用程序，运行在由 C++ 编写的平台上。该平台使用多线程来同时执行任务。\n\
  \n下图说明了从用户侧发送到 NodeJS 的请求。\n\n| ![](img/image_rsrc236.jpg) |\n\n来自用户的每个请求被 NodeJS\
  \ 视为一个事件。它们被放置在事件队列中。NodeJS 使用先入先出 (FIFO) 原则，这意味着先请求将先处理。\n\n### 事件循环 (Event Loop)\n\
  \n作为一个无限循环，它将请求传递给线程池，每个请求注册了一个回调函数。当请求处理完成后，相应的回调函数将被调用并执行。\n\n### 线程池 (Thread\
  \ Pool)\n\n由于是 C++ 语言编写，它支持多线程。因此，这里会在不同的线程上处理。NodeJS 也支持多进程。这意味着它们可以在不同的核心上执行。\n\
  \n| ![](img/image_rsrc237.jpg) |\n\n当请求处理完成后。NodeJS 将调用为该请求注册的回调函数来执行它。\n\n| ![](img/image_rsrc238.jpg)\
  \ |\n\n## 结论\n\n第一个基本结论：如果每个连接都打开一个线程。这将消耗大量的内存。当你比较 Apache 和 Nginx（两个部署 PHP 程序的\
  \ Web 服务器）时，这一点得到了证明。\n\nNodeJS 与 Nginx 的相似之处在于，它们都只使用单个线程接收来自用户的连接，并将用户的每个请求视为一个事件。\n\
  \n\n\n\n第二个基本结论：I/O 活动消耗了系统大量的资源，因此 NodeJS 严格管理着 I/O 活动的使用。所以，在执行与 I/O 相关的任务时，你只需要使用\
  \ `Callback`。\n\n# 第 10 章：NodeJS EventEmitter\n\nNodeJS 非常完美地支持应用程序中的事件。计算机上的每一个动作都是一个事件。例如，当你从硬盘上读取文件时。这意味着你在完成读取后必须执行“打开文件”和“关闭文件”这两个动作，因此这里有两个“Open”（打开）和“Close”（关闭）事件。基于事件，你可以插入代码执行某些操作。\n\
  \n```javascript\nvar fs = require('fs'); // 创建一个流来读取文件\nvar rs = fs.createReadStream('C:/test/demo.txt');\
  \ // 'open' 事件：\nrs.on('open', function() {console.log('File opened!');});\n```\n\
  \n模块事件为你提供了一个 `EventEmitter` 类，它是 NodeJS 中的一个核心类，辅助定义事件、注册该事件的监听器（Listeners）以及发射（emit）事件。\n\
  \n### 监听器 (Listener)\n\n在 NodeJS 中，监听器是一个函数。当事件发生时，它会被调用并执行。可能某个此类事件绑定了 0、1 或多个监听器。\n\
  \n为了简单起见，请看下面的插图：一只老鼠和一个捕鼠夹。一个事件准备发生。当事件发生时（蛋糕被偷了），捕鼠夹将执行它的任务。这里的捕鼠夹就是“监听器”，它会在事件发生时工作。\n\
  \n### EventEmitter 示例\n\n导入 `events` 模块并声明一个 `EventEmitter` 对象：\n\n```javascript\n\
  // 导入 events 模块\nvar events = require('events');\n// 创建一个 EventEmitter 对象\nvar eventEmitter\
  \ = new events.EventEmitter();\n```\n\n注册监听器（当事件发生时，这些函数将被调用执行）。\n\n```javascript\n\
  // 添加事件监听器\neventEmitter.addListener('bellRing', bellRingHandler1);\n// 添加事件监听器\n\
  eventEmitter.addListener('bellRing', bellRingHandler2);\n```\n\n发射事件：\n\n```javascript\n\
  // 触发 bellRing 事件!!\neventEmitter.emit('bellRing', 'Jerry');\n```\n\n![](img/image_rsrc239.jpg)\n\
  \n**first-example.js**\n\n```javascript\n// 导入 events 模块\nvar events = require('events');\n\
  // 创建一个 eventEmitter 对象\nvar eventEmitter = new events.EventEmitter();\n// 一个监听器\n\
  var bellRingHandler1 = function bellRingHandler1(who) {\n    console.log(\"\\n\"\
  );\n    console.log('The Bell Ringing..... (Handler 1)');\n    console.log(\" \"\
  \ + who + \" was standing behind the door!\");\n    if(who == 'Jerry') {\n     \
  \   console.log(' Tom, help me!!');\n        return;\n    }\n    console.log(\"\
  \ Welcome \" + who);\n}\n// 一个监听器\nvar bellRingHandler2 = function bellRingHandler2(who)\
  \ {\n    console.log(\"\\n\");\n    console.log('The Bell Ringing..... (Handler\
  \ 2)');\n    eventEmitter.emit(\"nobodyIsAtHome\");\n}\n// 一个监听器\nvar nobodyIsAtHomeHandler\
  \ = function nobodyIsAtHomeHandler() {\n    console.log(\"\\n\");\n    console.log(\"\
  \ Sorry, Nobody is at home now, Please leave your message!\")\n}\n// 添加事件监听器\neventEmitter.addListener('bellRing',\
  \ bellRingHandler1);\neventEmitter.addListener('bellRing', bellRingHandler2);\n\
  eventEmitter.addListener('nobodyIsAtHome', nobodyIsAtHomeHandler);\n// ----- 测试\
  \ ------\n// 触发 bellRing 事件!!\neventEmitter.emit('bellRing', 'Jerry');\n```\n\n\
  运行示例：\n\n```bash\nnode eventemitter-examples/first-example.js\n```\n\n# 第 11 章：软件安装\n\
