    Introduction


    Learning Node Js step by step.


    Node Js For Beginner : The Ultimade Guide for Intermediate Developer to Unleash
    the Power of Server Side Javascript


    Unlock the full potential of Node.js and revolutionize your web and server-side
    development skills with "Mastering Node.js: The Ultimate Guide for Intermediate
    Developers to Unleash the Power of Server-Side JavaScript."


    Node.js has taken the world of web development by storm, thanks to its speed,
    scalability, and rich ecosystem. In this comprehensive ebook, we take you on a
    journey from intermediate to advanced Node.js developer, arming you with the knowledge
    and skills to tackle complex projects and build high-performance applications.


    Discover the core concepts of Node.js, from asynchronous programming and event-driven
    architecture to managing dependencies with npm and Yarn. Dive into the world of
    web applications with Express.js and explore specialized frameworks for creating
    RESTful APIs, whether it''s building a single-page application or a high-traffic
    service.


    Learn the art of real-time communication with WebSockets, perfect for crafting
    interactive applications and delivering data updates in real-time. Explore database
    integration with MySQL databases.


    Chapter 1 :


    Introduction to NodeJs


    What is NodeJs


    Before directly answering the question "What is NodeJS?", I am going to introduce
    you about the birth context of the NodeJS, which helps you understand the matter
    more easily.


    Chrome & V8 Javascript Engine


    Everyone knows that Chrome is a famous and free Google browser with the first
    version released in December 2008, of which V8 JavaScript Engine is a program
    written on C++, open source code, used in the Google Chrome to parse and execute
    Javascript code with high performance. It parses Javascript syntax and interprets
    it into computer code for execution.


    | ![](image_rsrc21R.jpg) |


    Note : The Browser other than the Chrome may use another Javascript Engine.


    | Browser | Javascript Engine |


    | Chrome | V8 JS Engine |


    | Firefox | SpiderMonkey |


    | IE, Edge | Chakra |


    NodeJS


    You can use "thesyntax of Javascript" to write code snippets to connect to a database.
    The V8 JS Engine will parse your Javascript code and interprets it into computer
    code for execution. Of course, such code snippet is not for execution at the client
    side. it is used at the server side. Thus, an ability is opened, you can use "theJavascript
    syntax" to write server-side web applications instead of using PHP or Java.


    Javascript code


    | const mysql = require(''mysql'');const connection = mysql.createConnection({host:
    ''localhost'',user: ''user'',password: ''password'',database: ''database name''});connection.connect((err)
    => {if (err) throw err;console.log(''Connected!'');}); |


    and NodeJS was born. The V8 Javascript Engine is one of components of the NodeJS.
    Below is the architecture image of the NodeJS:


    NodeJs Javascript Library


    | ![](image_rsrc21S.jpg) |


    In short, the NodeJS may replace PHP, Java to build Server-side web applications.
    Instead of writing code by PHP, Java you use the syntax of Javascript.


    So, What is NodeJS


    The NodeJS is JavaScript Runtime Environment outside browser. The NodeJS also
    consists of other components and libraries so that it may operate like a Web Application
    Server.


    Important note: The NodeJS is not the extended language of Javascript.


    Chapter 2 :


    Install Atom Editor


    What is Atom software


    Atom is a text (and source code) editor free of charge. The open source code supports
    operating systems such as Linux, Mac OS, Windows. It supports plugins to program
    with the NodeJS and embed Git-Control, which is developed by GitHub.


    Atom is evaluated as text editing (and source code) software with a modern, easy-to-use
    interface and outstanding features compared to similar pieces of software.


    The languages are supported by the Atom:


    C/C++, C#, Clojure, CSS, CoffeeScript, GitHub Flavored Markdown, Go, Git, HTML,
    JavaScript, Java, JSON, Julia, Less, Make, Mustache, Objective-C, PHP, Perl, Property
    List (Apple), Python, Ruby on Rails, Ruby, Sass, Shell script, Scala, SQL, TOML,
    XML, YAML


    | ![](image_rsrc21T.jpg) |


    Download Atom


    To download the Atom, let''s visit its home page at the following address. it
    is noted that the Atom supports all of three kinds of operating systems: Windows,
    Mac OS, and Linux. If you use Windows, ensure that your operating system is Windows
    7 64bit or later.


    *   https://atom.io/


    | ![](image_rsrc21U.jpg) |


    After downloading successfully, you have a file with capacity of approximately
    150MB.


    | ![](image_rsrc21V.jpg) |


    OK, after finishing downloading and installing the Atom, this is the interface
    image of the Atom:


    | ![](image_rsrc21W.jpg) |


    Chapter 3 :


    Install NodeJS on Windows


    Download NodeJS


    To download NodeJS, you need to access to the following address:


    *   https://nodejs.org/en/download/


    | ![](image_rsrc21X.jpg) |


    After downloading successfully, you have a file.


    | ![](image_rsrc21Y.jpg) |


    Install NodeJS


    The installation of NodeJS on Windows is very simple. Accept default options and
    press "Next .. Next" until final step.


    | ![](image_rsrc21Z.jpg) |


    | ![](image_rsrc220.jpg) |


    | ![](image_rsrc221.jpg) |


    By default, NPM software is also installed in your system. This is a piece of
    software that manages Javascript libraries.


    | ![](image_rsrc222.jpg) |


    | ![](image_rsrc223.jpg) |


    | ![](image_rsrc224.jpg) |


    Check and configure


    OK, in the above step, we have downloaded and installed the NodeJS successfully.
    Now, you need to check installation results and configure the NodeJS.


    Open the CMD window and execute the following command to inspect the version of
    the NodeJS and the NPM:


    | node -vnpm -v |


    | ![](image_rsrc225.jpg) |


    Chapter 4 :


    What is NPM


    What is NPM


    NPM stands for Node Package Manager, which is a (program) tool managing Javascript
    programming libraries for Node.js. This tool is actually necessary for the open
    source world. In the Javascript community, developers share hundreds of thousands
    of code snippets that help new projects avoid rewriting basic components, programming
    libraries or even frameworks. Each of these code snippets may depend on many other
    open source codes. Fortunately, library management tools are born. If not, it
    will take a lot of effort to manage these libraries.


    NPM is basically similar to Maven. The difference here is that the NPM manages
    Javascript libraries while the Maven manages Java libraries.'
