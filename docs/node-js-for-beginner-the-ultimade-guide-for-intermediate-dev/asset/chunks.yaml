    # Chapter 7 : NodeJS Modules


    ### What is NodeJS Module


    Speaking simply, NodeJS Module is a Javascript library. It is a set of functions,
    objects and variables, which you can put into your applications to use. Using
    Module helps simplify writing code and manage it in your application. Normally,
    each module will be written in a separate file.


    The NodeJS builds in quite many Modules. It has standard libraries for you to
    develop applications. Below is the list:


    | Module | Description |

    | :--- | :--- |

    | `assert` | Provides a set of assertion tests |

    | `buffer` | To handle binary data |

    | `child_process` | To run a child process |

    | `cluster` | To split a single Node process into multiple processes |

    | `crypto` | To handle OpenSSL cryptographic functions |

