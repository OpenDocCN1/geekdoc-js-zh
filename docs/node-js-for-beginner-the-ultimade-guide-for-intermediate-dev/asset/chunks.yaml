    A piece of software similar to the NPM is `Yarn`, developed by Facebook, with
    outstanding features is emerging as an alternative to the NPM. In the same situation,
    Java library management software is `Gradle`, with its outstanding features, which
    is gradually replacing Maven.


    ## Features of the NPM


    To be able to run NPM software, your system needs installing `NodeJS`. The NPM
    software is built in `NodeJS` installer, therefore, when you have finished installing
    the `NodeJS`, you will have both of them.


    After the NPM has been installed on your computer, you can examine its version:


    ```

    npm -v

    ```


    ![](image_rsrc226.jpg)


    Because the NPM is a piece of software installed on your computer, you can use
    it to install Javascript libraries from the Internet. To install a library, it
    is necessary to open only `CMD` window and execute the command as below:


    ```

    npm install <package name>

    ```


    ```bash

    npm install vue

    ```


    And you can use `Vue.js` in your Javascript code:


