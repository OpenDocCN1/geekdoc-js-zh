    # Chapter 5 : NodeJS


    ### Create a NodeJS project


    First of all, you need to create a directory named `MyProject`, or a name that
    you want.


    ![](image_rsrc227.jpg)


    Open `CMD` and `CD` windows to the directory just created by you. After that run
    the following command so that NPM creates project for you.


    ```bash

    npm init

    ```


    ![](image_rsrc228.jpg)


    Accept default options and press "Enter" until completion.


    ![](image_rsrc229.jpg)


    A file with the name of `package.json` has been created on your project.


    ![](image_rsrc22A.jpg)


    There are some library packages necessary for your project, and you need to install
    it with the support of NPM:


    #### Express

    `Express.js` (or simply `Express`) means a Web Application Framework for the `NodeJS`.
    It provides a set of strong features to web and mobile applications.


    #### Ejs

    `EJS` stands for "Embedded JavaScript templating", which is a library, used to
    parse `ejs` files and create HTML to return to client (browser).


    ```bash

    npm install express ejs

    ```


    ![](image_rsrc22B.jpg)


    After the installation finishes, you can see changes on your project:


    ![](image_rsrc22C.jpg)


    ### Create structure for project


    In the above step, we have created a project by command. Now we will open this
    project by a more visual tool. Here, I use `Atom` editor (The software which I
    advise you to install in the above step).


    *   `File/Add Project Folder`


    ![](image_rsrc22D.jpg)


    OK, Project is opened on the `Atom`:


    ![](image_rsrc22E.jpg)


    On the project, create 2 sub-directories: `public` & `views`:


    *   `public`: a directory containing all files which users can access, for example
    image, video,..

    *   `views`: Your website will have a lot of pages, for example, home page, login
    page, ...This directory is the place containg all your pages.


    ![](image_rsrc22F.jpg)


    In `views` directory, we create 2 files:


    *   `homePage.ejs`

    *   `testPage.ejs`


    ![](image_rsrc22G.jpg)


    **homePage.ejs**

    ```html

    <!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8"><title>Home</title></head><body><h1>This
    is Home Page</h1></body></html>

    ```


    **testPage.ejs**

    ```html

    <!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="utf-8"><title>Test</title></head><body><h1>This
    is Test Page</h1></body></html>

    ```


    Next, create a file named `index.js`, and enter contents for this file. This is
    configuration file for your project:


    ![](image_rsrc22H.jpg)


    **index.js**

    ```javascript

    var express = require("express");

    var app = express();

    app.use(express.static("public"));

    app.set("view engine", "ejs");

    app.set("views", "./views");

    app.listen(3000);

    app.get("/", function(request, response)  {response.render("homePage");});

    app.get("/test", function(request, response)  {response.render("testPage");});

    ```


    OK, Now, it is time to explain the contents of the `index.js` above file.


    | Code | Description |

    | :--- | :--- |

    | `var express = require("express");` | `ExpressJS` means a Web Application Framework.This
    code line says that you want to use it. |

    | `var app = express();` | Create an `Express` object. |

    | `app.use(express.static("public"));` | This code line tells Application Server
    that you want to use `public` directory to contain static data, users can access
    the files in this directory. |

    | `app.set("view engine", "ejs");` | This code line tells the Application Server
    that you want to use `EJS` library. It is a machinery to handle your page. The
    `EJS` will create HTML to return to user''s browser. |

    | `app.set("views", "./views");` | This code line shows the Application Server
    the path to the directory containing your pages |

    | `app.listen(3000);` | Your application will listen on port 3000 when it is deployed
    |

    | `app.get("/test", function(req, res) { ...});` | Define the path to access to
    a page. |


    ### Run Application Server


    Open the `CMD`, and `CD` window to go to the directory of your project.


    ```bash

    node index.js

    ```


    ![](image_rsrc22I.jpg)


    ![](image_rsrc22J.jpg)


    Note: Close the `CMD` window because the is is running......22src:3000. You can
    check it by the following link:


    *   `http://localhost:3000`


