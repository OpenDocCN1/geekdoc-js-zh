    \ can receive many requests from many users. Therefore to improve serviceability,\
    \ all APIs of the NodeJS are designed to support Callback. The \"callback\" is\
    \ a function that will be called when the NodeJs completes a specific task.\n\n\
    ### NodeJS Callback\n\nIn the NodeJS, APIs is designed to support the Callback.\
    \ Assume that you are writing a program to read 2 files. To do this you use the\
    \ `fs` module, which gives you two functions such as `readFile` and `readFileSync`\
    \ to read the file. We will learn about the differences between these two functions.\n\
    \n#### Blocking\n\nThe `readFileSync` is a function reading files synchronously,.\
    \ Therefore, while this function is executing, it will block the program from\
    \ executing next code lines.\n\n`blocking-example.js`\n\n```javascript\nvar fs\
    \ = require(\"fs\");\n// -----> Read file 1:\nconsole.log(\"\\n\");\nconsole.log(\"\
    Read File 1\");\nvar data1 = fs.readFileSync('C:\\\\test\\\\file1.txt');\nconsole.log(\"\
    - Data of file 1: \");\nconsole.log(data1.toString());\n// -----> Read file 2:\n\
    console.log(\"\\n\");\nconsole.log(\"Read File 2\");\nvar data2 = fs.readFileSync('C:\\\
    \\test\\\\file2.txt');\nconsole.log(\"- Data of file 2: \");\nconsole.log(data2.toString());\n\
    console.log(\"\\n\");\nconsole.log(\"Program Ended\");\n```\n\nOpen CMD window\
    \ and execute the `blocking-example.js` file:\n\n```bash\nnode callback-examples/blocking-example.js\n\
    ```\n\n#### Non Blocking\n\nYou should use `readFile` function to achieve better\
    \ performance for the program. This function reads files asynchronously. It doesn't\
    \ block the program executing the next code lines. In other words, the program\
    \ does not wait for the function to complete. But when this function completes\
    \ its task, it calls the Callback function.\n\n```javascript\n// Read a file Asynchronous.\n\
    fs.readFile('C:\\\\test\\\\file1.txt', aCallbackFunction );\n```\n\nSee the full\
    \ example:\n\n`non-blocking-example.js`\n\n```javascript\nvar fs = require(\"\
    fs\");\n// A Callback function!\nfunction readFinishedFile1(err, data) {\n  if\
    \ (err) console.log(err);\n  console.log(\"- Data of file 1: \");\n  console.log(data.toString());\n\
    }\n// A Callback function!\nfunction readFinishedFile2(err, data) {\n  if (err)\
    \ console.log(err);\n  console.log(\"- Data of file 2: \");\n  console.log(data.toString());\n\
    }\n// -----> Read file 1:\nconsole.log(\"\\n\");\nconsole.log(\"Read File 1\"\
    );\nfs.readFile('C:\\\\test\\\\file1.txt', readFinishedFile1);\n// -----> Read\
    \ file 2:\nconsole.log(\"\\n\");\nconsole.log(\"Read File 2\");\nfs.readFile('C:\\\
    \\test\\\\file2.txt', readFinishedFile2);\nconsole.log(\"\\n\");\nconsole.log(\"\
    Program Ended\");\n```\n\nOpen CMD window and run the `non-blocking-example.js`\
    \ file:\n\n```bash\nnode callback-examples/non-blocking-example.js\n```\n\n##\
    \ Chapter 9: Understanding Event Loop in NodeJS\n\n### NodeJS Event Loop Overview\n\
    \nNodeJS is a Single Thread application, which operates on a platform written\
    \ by C++. This platform uses multi-thread to carry out tasks at the same time.\n\
    \nThe following figure illustrates requests sent to the NodeJS server from the\
    \ users side.\n\n| ![](image_rsrc236.jpg) |\n\nEach request from the users side\
    \ is treated to be an event by the NodeJS. They is placed into an Event Queue.\
    \ The NodeJS uses FIFO (First In First Out) principle, which means that the requests\
    \ coming first will be handled first.\n\n### Event Loop\n\nAs an endless loop,\
    \ it passes the requests to the thread Pool and each request is registered a Callback\
    \ function. When a request is finished handling, the corresponding Callback function\
    \ will be called to be executed.\n\n### Thread Pool\n\nBeing a program by C++\
    \ language, it supports multi threads. Therefore, herein, requests will be handled\
    \ on different threads. The NodeJS also supports Multi Processes. This means that\
    \ they can be executed on different cores.\n\n| ![](image_rsrc237.jpg) |\n\nWhen\
    \ a request is finished handling. The NodeJS will call the Callback function (registered\
    \ for this request) to execute it.\n\n| ![](image_rsrc238.jpg) |\n\n## CONCLUSIONS\n\
    \nFirst basic conclusion: If each connection to Server opens a Thread . It will\
    \ take very much memory. This has been proven when you compare Apache and Nginx\
    \ (two Web Servers deploying PHP applications).\n\nThe NodeJS is similar to the\
    \ Nginx in the fact that they use only a Single thread to receive connections\
    \ from an user, and treat each request of the user as an event.\n"
