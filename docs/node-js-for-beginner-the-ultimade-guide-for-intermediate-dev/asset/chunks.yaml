    \ the `http-example.js` file:\n\n```bash\nnode ./module-examples/http-example.js\n\
    ```\n\nOpen the browser and visit the path:\n* http://localhost:8080/\n\n| ![](image_rsrc231.jpg)\
    \ |\n\n## Create your Module\n\nIn the NodeJS, you can create a customized module.\
    \ The Module is a Javascript file. please note to the position of this file because\
