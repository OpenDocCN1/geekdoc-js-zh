    |


    Module events provides you with an EventEmitter class, that is a central class
    in the NodeJS, assisting in defining an event, registering Listeners of this event,
    and emitting (emit) the event.


    Listener


    In the NodeJS, the Listener is a function. It will be called to execute when an
    event occurs. Probably, 0, 1 or many Listeners are being bound to such event.


    For simplicity, look at the following illustration: a mouse and a mouse trap.
