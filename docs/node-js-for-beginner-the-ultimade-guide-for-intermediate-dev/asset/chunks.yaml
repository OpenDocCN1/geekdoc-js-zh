    \ create a `my-first-module.js` file in the `node_modules` directory and the `test-my-first-module.js`\
    \ file in another directory.\n\n| ![](image_rsrc233.jpg) |\n\nIn this example,\
    \ the `my-first-module.js` file has a lot of functions but I only export\"sum\"\
    \ function.\n\n`node_modules/my-first-module.js`\n\n```javascript\nsubtract =\
    \ function(a, b) {return a - b;}\nsum = function (a, b) {return a + b;}\nmodule.exports\
    \ = sum;\n```\n\n| ![](image_rsrc234.jpg) |\n\n`module-examples/test-my-first-module.js`\n\
    \n```javascript\nvar sum = require(\"my-first-module.js\");\nconsole.log(\"Sum\
    \ 100 and 150\");\nvar c = sum(100, 150);\nconsole.log(\"Value = \" + c);\n```\n\
    \nRun the above example:\n\n```bash\nnode ./module-examples/test-my-first-module.js\n\
    ```\n\n## Chapter 8: The concept of Callback in NodeJS\n\n### What is Callback\n\
    \nTo explain what the Callback is, let's see a situation as follows:\n\nYou come\
    \ to a shop to buy a something you like. The shop staff tells you that the item\
    \ is out of stock now. You leave the phone number and ask them to call back immediately\
    \ after the goods is available. Then you can go out or do a job and do not need\
