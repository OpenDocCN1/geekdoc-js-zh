  trans: "\n\n| Module | Description |\n| :--- | :--- |\n| dgram | 提供 UDP 数据报套接字的实现\
    \ |\n| dns | 用于 DNS 查询和域名解析函数 |\n| events | 用于处理事件 |\n| fs | 处理文件系统 |\n| http\
    \ | 让 Node.js 充当 HTTP 服务器 |\n| https | 让 Node.js 充当 HTTPS 服务器 |\n| net | 创建服务器和客户端\
    \ |\n| os | 提供有关操作系统的信息 |\n| path | 处理文件路径 |\n| querystring | 处理 URL 查询字符串 |\n\
    | readline | 逐行处理可读流 |\n| stream | 处理流式数据 |\n| string_decoder | 将 buffer 对象解码为字符串\
    \ |\n| timers | 在指定的毫秒数后执行函数 |\n| tls | 实现 TLS 和 SSL 协议 |\n| tty | 提供供文本终端使用的类\
    \ |\n| url | 解析 URL 字符串 |\n| util | 访问实用函数 |\n\n要使用模块，请使用 `require(moduleName)`\
    \ 函数。例如，`http` 是一个让 NodeJS 运行得像 HTTP 服务器的模块。\n\n在你的 NodeJS 项目中，创建一个 `module-examples`\
    \ 目录来包含你在在本课程中练习的 Javascript 文件。\n\n| ![](img/image_rsrc22Z.jpg) |\n\n在 `module-examples`\
    \ 目录下创建一个名为 `http-example.js` 的文件。\n\n| ![](img/image_rsrc230.jpg) |\n\n`http-example.js`\n\
    \n```javascript\nvar http = require(\"http\");\nhttp.createServer(function(req,\
    \ res) {\n  res.writeHead(200, {\"Content-Type\": \"text/html\"});\n  res.write(\"\
    <h1>Hello World</h1>\");\n  res.write(\"<h2>Hello Http</h2>\");\n  res.end();\n\
    }).listen(8080)\n```\n\n打开 CMD 窗口进入进入项目目录，使用 NodeJS 运行 `http-example.js` 文件：\n\
    \n```bash\nnode ./module-examples/http-example.js\n```\n\n打开浏览器并访问路径：\n* http://localhost:8080/\n\
    \n| ![](img/image_rsrc231.jpg) |\n\n## 创建你的模块\n\n在 NodeJS 中，你可以创建一个自定义模块。模块是一个\
    \ Javascript 文件。请注意该文件的位置，因为它会影响你使用它的方式。你有 2 种选择该文件位置的方法：\n\n1. 将模块文件放在名为 `node_modules`\
    \ 的目录中（项目的子目录）。这是推荐的位置。\n2. 将模块文件放在你的其中一个目录中，而不是 `node_modules` 中。\n\n| ![](img/image_rsrc232.jpg)\
    \ |\n\nNodeJS 建议你将你的模块文件放在项目的 `node_modules` 目录中。请等一分钟，我将解释为什么你的模块应该放在这个目录中。\n\
    \n### 在你的 Javascript 文件中导出内容的语法。\n\n```javascript\nexports = something;// 或者：module.exports\
    \ = something; \n```\n\n`my-first-module.js`\n\n首先，在 `node_modules` 目录下创建一个 `my-first-module.js`\
    \ 文件，在另一个目录下创建一个 `test-my-first-module.js` 文件。\n\n| ![](img/image_rsrc233.jpg)\
    \ |\n\n在例例中，`my-first-module.js` 文件有很多函数，但我只导出了 \"sum\" 函数。\n\n`node_modules/my-first-module.js`\n\
    \n```javascript\nsubtract = function(a, b) {return a - b;}\nsum = function (a,\
    \ b) {return a + b;}\nmodule.exports = sum;\n```\n\n| ![](img/image_rsrc234.jpg)\
    \ |\n\n`module-examples/test-my-first-module.js`\n\n```javascript\nvar sum = require(\"\
    my-first-module.js\");\nconsole.log(\"Sum 100 and 150\");\nvar c = sum(100, 150);\n\
    console.log(\"Value = \" + c);\n```\n\n运行上面的示例：\n\n```bash\nnode ./module-examples/test-my-first-module.js\n\
    ```\n\n## 第 8 章：NodeJS 中的回调 (Callback) 概念\n\n### 什么是回调 (Callback)\n\n为了解释什么是回调，让我们来看以下情况：\n\
    \n你去一家商店买你喜欢的东西。店员告诉你该商品现在缺货了。你留下了电话号码，并他们在到货后立即给你回电。然后你就可以出去或工作，不需要再担心这家商店，直到你接到商店的电话通知你请求的商品已到。\n\
    \n| ![](img/image_rsrc235.jpg) |\n\nNodeJS 服务器可以接收来自许多用户的许多请求。因此，为了提高可用性，NodeJS\
    \ 的所有 API 都设计为支持回调。“回调”是一个在 NodeJs 完成特定任务时被调用的函数。\n\n### NodeJS 回调\n\n在 NodeJS\
    \ 中，API 被设计为支持回调。假设你正在编写一个读取 2 个文件的程序。为了实现这一点，你使用了 `fs` 模块，它提供了两个函数如 `readFile`\
    \ 和 `readFileSync` 来读取文件。我们将学习这两个函数之间的区别。\n\n#### 阻塞 (Blocking)\n\n`readFileSync`\
    \ 是一个同步读取文件的函数。因此，当该函数执行时，它会阻塞程序执行后续代码行。\n\n`blocking-example.js`\n\n```javascript\n\
    var fs = require(\"fs\");\n// -----> 读取文件 1:\nconsole.log(\"\\n\");\nconsole.log(\"\
    Read File 1\");\nvar data1 = fs.readFileSync('C:\\\\test\\\\file1.txt');\nconsole.log(\"\
    - Data of file 1: \");\nconsole.log(data1.toString());\n// -----> 读取文件 2:\nconsole.log(\"\
    \\n\");\nconsole.log(\"Read File 2\");\nvar data2 = fs.readFileSync('C:\\\\test\\\
    \\file2.txt');\nconsole.log(\"- Data of file 2: \");\nconsole.log(data2.toString());\n\
    console.log(\"\\n\");\nconsole.log(\"Program Ended\");\n```\n\n打开 CMD 窗口并执行 `blocking-example.js`\
    \ 文件：\n\n```bash\nnode callback-examples/blocking-example.js\n```\n\n#### 非阻塞\
    \ (Non Blocking)\n\n你应该使用 `readFile` 函数来为程序获得更好的性能。该函数异步读取文件。它不会阻塞程序执行后续代码行。换句话说，程序不会等待函数完成。但当该函数完成它的任务时，它会调用回调函数。\n\
    \n```javascript\n// 异步读取文件。\nfs.readFile('C:\\\\test\\\\file1.txt', aCallbackFunction\
    \ );\n```\n\n查看完整示例：\n\n`non-blocking-example.js`\n\n```javascript\nvar fs = require(\"\
    fs\");\n// 一个回调函数！\nfunction readFinishedFile1(err, data) {\n  if (err) console.log(err);\n\
    \  console.log(\"- Data of file 1: \");\n  console.log(data.toString());\n}\n\
    // 一个回调函数！\nfunction readFinishedFile2(err, data) {\n  if (err) console.log(err);\n\
    \  console.log(\"- Data of file 2: \");\n  console.log(data.toString());\n}\n\
    // -----> 读取文件 1:\nconsole.log(\"\\n\");\nconsole.log(\"Read File 1\");\nfs.readFile('C:\\\
    \\test\\\\file1.txt', readFinishedFile1);\n// -----> 读取文件 2:\nconsole.log(\"\\\
    n\");\nconsole.log(\"Read File 2\");\nfs.readFile('C:\\\\test\\\\file2.txt', readFinishedFile2);\n\
    console.log(\"\\n\");\nconsole.log(\"Program Ended\");\n```\n\n打开 CMD 窗口并运行 `non-blocking-example.js`：\n\
    \n```bash\nnode callback-examples/non-blocking-example.js\n```\n\n## 第 9 章：理解\
    \ NodeJS 中的事件循环 (Event Loop)\n\n### 事件循环概述\n\nNodeJS 是一个单线程应用程序，运行在由 C++ 编写的平台上。该平台使用多线程来同时执行任务。\n\
    \n下图说明了从用户侧发送到 NodeJS 的请求。\n\n| ![](img/image_rsrc236.jpg) |\n\n来自用户的每个请求被 NodeJS\
    \ 视为一个事件。它们被放置在事件队列中。NodeJS 使用先入先出 (FIFO) 原则，这意味着先请求将先处理。\n\n### 事件循环 (Event Loop)\n\
    \n作为一个无限循环，它将请求传递给线程池，每个请求注册了一个回调函数。当请求处理完成后，相应的回调函数将被调用并执行。\n\n### 线程池 (Thread\
    \ Pool)\n\n由于是 C++ 语言编写，它支持多线程。因此，这里会在不同的线程上处理。NodeJS 也支持多进程。这意味着它们可以在不同的核心上执行。\n\
    \n| ![](img/image_rsrc237.jpg) |\n\n当请求处理完成后。NodeJS 将调用为该请求注册的回调函数来执行它。\n\n| ![](img/image_rsrc238.jpg)\
    \ |\n\n## 结论\n\n第一个基本结论：如果每个连接都打开一个线程。这将消耗大量的内存。当你比较 Apache 和 Nginx（两个部署 PHP 程序的\
    \ Web 服务器）时，这一点得到了证明。\n\nNodeJS 与 Nginx 的相似之处在于，它们都只使用单个线程接收来自用户的连接，并将用户的每个请求视为一个事件。\n\
    \n"
- fmt: "\nSecond basic conclusion:I/O activities cost many resources of the system,\
    \ therefore, the NodeJS manages use of I/O activities strictly. So you need to\
    \ use only `Callback` when you execute the duties related to I/O.\n\n# Chapter\
    \ 10: NodeJS EventEmitter\n\nNodeJS supports events in applications very perfectly.\
    \ Every action on a computer is an event. For example, when you read a file on\
    \ hard drive. It means that you have to do two actions \"open the file\" and \"\
    close it\" after finishing reading it, so here we have two \" Open \" &\" Close\
    \ \" events. Based on events, you insert your codes to do something.\n\n```javascript\n\
    var fs = require('fs'); // Create a stream to read file\nvar rs = fs.createReadStream('C:/test/demo.txt');\
    \ // The event 'open':\nrs.on('open', function() {console.log('File opened!');});\n\
    ```\n\nModule events provides you with an `EventEmitter` class, that is a central\
    \ class in the NodeJS, assisting in defining an event, registering Listeners of\
    \ this event, and emitting (`emit`) the event.\n\n### Listener\n\nIn the NodeJS,\
    \ the Listener is a function. It will be called to execute when an event occurs.\
    \ Probably, 0, 1 or many Listeners are being bound to such event.\n\nFor simplicity,\
    \ look at the following illustration: a mouse and a mouse trap. An event is prepared\
    \ to take place. When the event occurs (the cake is stolen), the mouse trap will\
    \ perform its task. The mouse trap herein is a \"Listener\", which will work when\
    \ the event happens.\n\n### Example of EventEmitter\n\nImport `events` module,\
    \ and declare an `EventEmitter` object:\n\n```javascript\n// Import events module\n\
    var events = require('events');\n// Create an EventEmitter object\nvar eventEmitter\
    \ = new events.EventEmitter();\n```\n\nRegister Listeners (The functions will\
    \ be called to execute when an event occurs).\n\n```javascript\n// Add Event Listener\n\
    eventEmitter.addListener('bellRing', bellRingHandler1);\n// Add Event Listener\n\
    eventEmitter.addListener('bellRing', bellRingHandler2);\n```\n\nEmit the event:\n\
    \n```javascript\n// Fire bellRing event!!\neventEmitter.emit('bellRing', 'Jerry');\n\
    ```\n\n![](image_rsrc239.jpg)\n\n**first-example.js**\n\n```javascript\n// Import\
    \ events module\nvar events = require('events');\n// Create an eventEmitter object\n\
    var eventEmitter = new events.EventEmitter();\n// A Listener\nvar bellRingHandler1\
    \ = function bellRingHandler1(who) {\n    console.log(\"\\n\");\n    console.log('The\
    \ Bell Ringing..... (Handler 1)');\n    console.log(\" \" + who + \" was standing\
    \ behind the door!\");\n    if(who == 'Jerry') {\n        console.log(' Tom, help\
    \ me!!');\n        return;\n    }\n    console.log(\" Welcome \" + who);\n}\n\
    // A Listener\nvar bellRingHandler2 = function bellRingHandler2(who) {\n    console.log(\"\
    \\n\");\n    console.log('The Bell Ringing..... (Handler 2)');\n    eventEmitter.emit(\"\
    nobodyIsAtHome\");\n}\n// A Listener\nvar nobodyIsAtHomeHandler = function nobodyIsAtHomeHandler()\
    \ {\n    console.log(\"\\n\");\n    console.log(\" Sorry, Nobody is at home now,\
    \ Please leave your message!\")\n}\n// Add Event Listeners\neventEmitter.addListener('bellRing',\
    \ bellRingHandler1);\neventEmitter.addListener('bellRing', bellRingHandler2);\n\
    eventEmitter.addListener('nobodyIsAtHome', nobodyIsAtHomeHandler);\n// ----- Testing\
    \ ------\n// Fire bellRing event!!\neventEmitter.emit('bellRing', 'Jerry');\n\
    ```\n\nRun the example:\n\n```bash\nnode eventemitter-examples/first-example.js\n\
