    ## 序言\n循步学习 Node Js。\n初学者 Node Js：中级开发者释放服务器端 Javascript 力的终极指南\n\n通过《精通 Node.js：中级开发者释放服务器端\
    \ JavaScript 力的终极指南》，解锁 `Node.js` 的全部潜力，并彻底改变你的 Web 和服务器端开发技能。\n\n`Node.js` 因其速度、可扩展性和丰富的生态系统席卷了\
    \ Web 开发领域。在这本全面的电子书中，我们将带你开启一段从中级到高级 `Node.js` 开发者的旅程，为你提供应对复杂项目和构建高性能应用程序的知识和技能。\n\
    \n探索 `Node.js` 的核心概念，从异步编程、事件驱动架构到使用 `npm` 和 `Yarn` 管理依赖。通过 `Express.js` 深入 Web\
    \ 应用的世界，并探索用于创建 RESTful API 的专用框架，无论是构建单页应用程序还是高流量服务。\n\n学习使用 `WebSockets` 进行实时通信的艺术，它非常适合构建交互式应用程序并提供实时数据更新。探索与\
    \ `MySQL` 数据库的集成。\n\n## 第 1 章：NodeJs 简介\n\n### 什么是 NodeJs\n在直接回答“什么是 NodeJS?”之前，我将先向你介绍\
    \ `NodeJS` 的诞生背景，这有助于你更容易理解相关问题。\n\n### Chrome 与 V8 Javascript 引擎\n人知道 `Chrome`\
    \ 是一个著名的免费 Google 浏览器，第一个版本于 2008 年 12 月发布，其中 `V8 JavaScript Engine` 是一个用 `C++`\
    \ 编写的程序，代码开源，用于 Google `Chrome` 以高性能地解析和执行 Javascript 代码。它解析 Javascript 语法并将其解释为计算机代码以执行。\n\
    \n| ![](img/image_rsrc21R.jpg) |\n\n注意：除 `Chrome` 之外的浏览器可能使用其他的 Javascript 引擎。\n\
    \n| 浏览器 | Javascript 引擎 |\n| :--- | :--- |\n| Chrome | V8 JS Engine |\n| Firefox\
    \ | SpiderMonkey |\n| IE, Edge | Chakra |\n\n### NodeJS\n你可以使用“Javascript 语法”编写代码片段来连接数据库。`V8\
    \ JS Engine` 会解析你的 Javascript 代码并将其解释为计算机代码以执行。当然，这种代码片段不是用于客户端，而是用于服务器端的。因此，一种能力被开启了，你可以使用“Javascript\
    \ 语法”编写服务器端 Web 应用，而不是使用 `PHP` 或 `Java`。\n\nJavascript 代码\n```javascript\nconst\
    \ mysql = require('mysql');const connection = mysql.createConnection({host: 'localhost',user:\
    \ 'user',password: 'password',database: 'database name'});connection.connect((err)\
    \ => {if (err) throw err;console.log('Connected!');});\n```\n`NodeJS` 诞生了。`V8\
    \ Javascript Engine` 是 `NodeJS` 的组件之一。下面是 `NodeJS` 的架构图：\n\n### NodeJs Javascript\
    \ 库\n| ![](img/image_rsrc21S.jpg) |\n\n简而言之，`NodeJS` 可以替换 `PHP`、`Java` 来构建服务器端\
    \ Web 应用。你不再通过 `PHP`、`Java` 编写代码，而是使用 Javascript 语法。\n\n### 所以，什么是 NodeJS\n`NodeJS`\
    \ 是浏览器外的 JavaScript 运行时环境。`NodeJS` 还包含其他组件和库，因此它可以像 Web 应用服务器一样运行。\n\n重要提示：`NodeJS`\
    \ 不是 Javascript 的扩展语言。\n\n## 第 2 章：安装 Atom 编辑器\n\n### 什么是 Atom 软件\nAtom 是一个免费的文本（及源代码）编辑器。其开源代码支持\
    \ `Linux`、`Mac OS`、`Windows` 等操作系统。它支持通过 `NodeJS` 插件并嵌入由 `GitHub` 开发的 `Git-Control`。\n\
    \n`Atom` 被评估为文本编辑（及源代码）软件，与类似的软件相比，它具有现代、易于使用的界面和卓越的特性。\n\n`Atom` 支持以下语言：\nC/C++,\
    \ C#, Clojure, CSS, CoffeeScript, `GitHub Flavored Markdown`, Go, Git, HTML, JavaScript,\
    \ Java, JSON, Julia, Less, Make, Mustache, Objective-C, PHP, Perl, Property List\
    \ (Apple), Python, Ruby on Rails, Sass, Shell script, Scala, SQL, TOML, XML, YAML\n\
    \n| ![](img/image_rsrc21T.jpg) |\n\n### 下载 Atom\n要下载 `Atom`，请访问其主页。请注意，`Atom`\
    \ 支持各种操作系统。如果你使用 `Windows`，请确保你的操作系统是 `Windows 7` 64 位或更高版本。\n\n* https://atom.io/\n\
    \n| ![](img/image_rsrc21U.jpg) |\n\n成功下载后，你将获得一个文件。\n\n| ![](img/image_rsrc21V.jpg)\
    \ |\n\n好的，在完成下载并安装 `Atom` 后，这是 `Atom` 的界面：\n\n| ![](img/image_rsrc21W.jpg) |\n\
    \n## 第 3 章：在 Windows 上安装 NodeJS\n\n### 下载 NodeJS\n要下载 `NodeJS`，你需要访问以下地址：\n\n\
    * https://nodejs.org/download/\n\n| ![](img/image_rsrc21X.jpg) |\n\n成功下载后，你将获得一个文件。\n\
    \n| ![](img/image_rsrc21Y.jpg) |\n\n### 安装 NodeJS\n在 `Windows` 上安装 `NodeJS` 非常简单。接受默认选项并一直“Next”直到最后一步。\n\
    \n| ![](img/image_rsrc21Z.jpg) |\n\n| ![](img/image_rsrc220.jpg) |\n\n| ![](img/image_rsrc221.jpg)\
