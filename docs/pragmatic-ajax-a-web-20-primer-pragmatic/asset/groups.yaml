    this case. One of these is XOAD Events which allows you to fire events from one
    computer and process them on another. This is all done by using an observer pattern,
    and having one piece of code firing events, and another listening for them. This
    is useful for Ajax applications that need to be very responsive to data passing
    between tier (like a chat client, for example).


    # 9.4 Wrapping Up


    We have shown you two of the most popular PHP-based Ajax frameworks. These frameworks
    amply demonstrate the power of integrated Ajax code; the simplicity of the model
    is evident. You never have to leave the cozy confines of PHP to achieve dramatic
    Ajax results. In fact, you don''t even have to look at the JavaScript if you don''t
    want to. However, just because these frameworks can hide the details of JavaScript
    on the client, that doesn''t mean that you have to ignore yourself. There can
    be quite a lot of benefit to leveraging a high level abstraction layer like'
