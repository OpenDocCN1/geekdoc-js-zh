    So we bookmark the page. If we come back, open the bookmark, and end up back at
    the index page instead, we''re displeased.


    When a user arrives at an Ajaxified page, the URL that appears in the address
    bar is whatever they typed in or clicked on to get there. When a bookmark is added
    to a browser, it makes a copy of the current address in the address bar. If the
    page has allowed the user to progress through tens or hundreds of interactions,
    the URL in the address bar is exactly the same as it was for the initial request.
    A user who navigates to the bookmark will always end up at the original state
    of the page; Ajax-based changes will be long forgotten.


    Once again, we are faced with the distinction between a major topic area of the
    application vs. a minor shift in focus. Users will accept certain limitations
    on their bookmarking ability; for example, most people don''t expect to be able
    to bookmark a page halfway through the check-wizard at an ecommerce site. Clearly,
    users have to learn the difference between static pages and stateful processes
    which can''t be snapshotted. Developers now have to come to the same realization:
    what transitions can I encapsulate in a non-bookmarkable process, and what requires
    page transitions in order to allow pause-and-resume behavior?


    ## GET is for Getting, POST is for Doing


    In the world of HTTP, browsers communicate with servers using (typically) either
    GET or POST requests. A GET request is generated whenever you click on a hyperlink;
    the idea is that it gets the next page. A POST request is sent when you hit the
    submit button on an HTML form. It posts the data from that form back to the application
    for processing.


    In 2005, the team that created Basecamp (and Ruby on Rails) learned this valuable
    lesson: GET is for getting things, POST is for doing things. The HTTP specification
    is pretty specific on this topic. GETs are for retrieving data. POSTs are for
    interacting with the server in a way that might change server state. When you
    avoid the recommendations of a specification, bad things can—and often do—happen.
    Their public tussle with this issue serves as a cautionary tale for the rest of
    us: if these kinds of issues can affect the best and brightest, we need to be
    extra careful in our applications to avoid similar problems.


    Basecamp''s problem was that, at the time, the default method for creating links
    back to the server with Rails was a GET. It didn''t matter what the link was doing:
    redirecting to a new page, reading a record, deleting a record. Then, Google released
    the Google Accelerator. The Google Accelerator installs in your browser and redirects
    requests through Google''s servers. If Google has already cached the page version,
    speeding up your access time, you''ll be rewarded with it cached. If the page
    has not been cached, then the request is forwarded as normal. Google Accelerator
    walks all the links off of the returned page, caching it and all of its sub pages.


    For an application whose controls are all provided as simple GET-method links,
    Google Accelerator becomes the most efficient destructive force imaginable. Think
    of it as the Terminator of web apps. It is single-minded: fire to every link on
    the page. It is efficient. And it absolutely will not stop until your app is dead.


    37signals didn''t realize there was a problem until data disappearing from the
    Basecamp database. As users began reporting that their data was mysteriously missing,
    the team finally realized that the common thread was Google Accelerator. Normally,
    such a thing wouldn''t be a terrible problem. After all, Google''s indexing worms
    essentially the same path; find a page, navigate to all the endpoints, cache.
    But with Google Accelerator, the worm finally has access to information it has
    never had before: your username and password. Navigate to your Basecamp account,
    for example, and log in. The Accelerator can now follow all the links on your
    private page. It then clicks everything it, as fast as possible. And some of those
    links are labeled *Delete Item*.


    The solution was to change their framework, Rails, to create POST-method links
    for updates. They did this by creating a second view helper in `link_to()` that
    creates a `<form>` element to surround a button. The parameters are embedded as
    hidden `<input>`. The `<form>` is set to POST as its method. Now, your update-related
    links don''t fail to the Accelerator.


    When you Ajaxify an application, the temptation to write pages this way is strong.
    You present your user with a list of items. You want them to be able to add new
    or delete existing ones from the page without a refresh. So you add a link to
    the bottom, *New Record*. Embedded in each item on the list is a link called *Delete*.
    You use a simple GET with an URL like this: http://www.mydomain.com/my/app/delete?recid=545.
    What could be easier? Of course, the Accelerator will knock on your door.

    “Sarah Connor?” it will ask. And that will be the end of that.


    ## Tell People When Updates are Happening


    When browsing a Web 1.0 application, pay careful attention to the feedback you
    get from the application, the browser, and your OS. For example, when you click
    on a link to another page and the data has started render (but slowly), what feedback
    are you getting? The refresh icon in the upper right corner of your browser begins
    to spin or jump or change colors. On the Mac, the cursor turns into the Rainbow
    Wheel of Doom and you can''t click on anything in the browser window (though the
    browser’s menus are usually still accessible). That’s because the navigation operation
    is synchronous; you are forced to wait until it has completed before you can use
    the contents of the window. Or when you choose File→Print from the menu. The dialog
    box often takes a second to appear as you scan your network for configured printers.
    While this is happening, your cursor might turn into an hourglass and wait won''t
    be able to click on anything in the browser window OR on the menus.


    Synchronous operations come with their own feedback. If it is related to requesting
    new information, the browser tells you via the refresh icon. You get feedback
    in the form of not being able to click on resources. your cursor changes to tell
    you “Quit clicking that.” You know Ajax. The asynchronous part makes everything
    different. When you fire an asynchronous request back to the server, there is
    nothing the browser will do unless you automatically provides feedback to the
    user that is going on. It will quietly and invisibly wait for the response to
    come back, then put your JavaScript tell it to Suddenly, as if by magic, the rendered
    HTML is updated. Voila! Some previously hidden `<div>` pops into view, filled
    with useful but surprising information! Unfortunately, your user has already scrolled
    past that part of the page, and misses all the fun.


    It is up to you to provide adequate warning to your user that some activity is
    being performed on their behalf. Because they are able to continue to work with
    the page and the browser after firing an asynchronous call, you have to provide
    visual cues to let them know that something is on the way. Earlier in this chapter,
    we showed you a technique for popping up a notification animation. This technique
    is enough. But sometimes, you''ll have to do more. Perhaps change the cursor,
    perhaps show a full bar. Regardless of the specific technique, you should always
    provide a mechanism to warn your users that clicking that link, or pressing that
    button, or doing whatever it is, has now fired a request and the browser is waiting
    for a response.


    ## Don''t Reinvent the Wheel


    We''ve grown accustomed to certain UI conventions. Modern operating systems and
    their windowing toolkits offer us certain abstractions that have settled in our
    consciousness. We know what a window is, for example. Even my parents know when
    they see a box on the screen with an outset border, a header at the top and some
    buttons in upper left right corners, that thing can be dragged around the screen
    and it can be closed. We know what a button looks like and that the appropriate
    thing to do is click on it, once, to press. We''ve been trained that text along
    the top of a window is probably menus, and if we hover the mouse over them or
    click on them, they are likely to spawn submenu. I''ve actually run this experiment
    with my family. They are Microsoft Windows users. If I put them in front of a
    Mac, the actual graphical look is entirely different. They have no idea what the
    Dock is for, but the common abstractions are plain and clear. Likewise, when they
    sit at a Gnome or KDE desktop on my Linux box, everything is straightforward.


    The web has taught us some additional standards. Now, we agree that text along
    the top or left edges may be a menu, and hovering the mouse over a menu is preferable
    to clicking on it to get the submenu to appear. We know that words, underlined
    and off blue, are hyperlinks that will navigate us to a new page. Square boxes
    next to words are checkboxes, which can be checked and unchecked individually,
    while groups of gray circles are radio buttons, and clicking on one affects the
    others. And when the cursor turns into a little pointing hand, means whatever
