    and ORB-like removing.


    # 9.2 Working with Sajaj


    Let''s return to Hector and his CRM application. He''s decided to move his team
    to an open source platform, named PHP. He''s convinced that team will be able
    to get more leverage by using an integrated Ajax framework. This means the team
    can add these new effects and callbacks without leaving the confines of PHP. We''ll
    first port the application to Sajaj?


    # What is Sajax?


    Sajax is one of the earliest Ajax web frameworks available, originally written
    for PHP. It is an open source project, and allows you to bind your web UI to server-side
    functions. It accomplishes this by exporting client-side JavaScript functions
    that invoke a Sajaj bridge to the server-side code that is actually executed,
    wrapping it all in an XHR request.


    Sajax is an ORB-like removing layer, which means that we will be able to first
    write the server side functions that we need (consisting of talking to the database,
    and returning the correct data back) and then bind our UI directly to these functions.
    There will be no XMLHttpRequest object to be found, and you may be surprised with
    some of the JavaScript calls that we can run, since we will not see them in the
    PHP code itself.


    There is some tension in the development community surrounding this this kind
    of object removing strategy. Some developers are very keen on


