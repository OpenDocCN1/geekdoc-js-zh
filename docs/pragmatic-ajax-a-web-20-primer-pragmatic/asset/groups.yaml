    # 详尽 XHR


    让我们聊聊 XHR 直此尚未涵盖的其他功能。


    ## 状态


    `onreadystatechange` 属性是 XHR 的关键特性。它允许你注册一个异步回调处理程序，当 XHR 在与服务器进行通信期间状态发生时，该处理器会被调用。在上一章中，我们查看了
    `readyState` 属性的五种可能状态。通常，重要的状态是 4（已完成）。其他四个状态都是“未完成”的不同程度。


    ## 头部


    除了显示有关当前状态的细粒度信息外，XHR 还允许你在请求中修改或添加 HTTP 头部，并查看响应中的头部。这是通过使用 `setRequestHeader()`、`getResponse()`
    和 `getAllHeaders()` 函数实现的。在这个示例中，我们伪造浏览器发送 XHR：`xhr.setRequestHeader("User-Agent",
    "My Custom Browser")`


    ## 响应数据


    在这些示例中，我们使用了 `responseText` 属性从服务器获取响应体。还有另一个属性 `responseXML()`，它将服务器的响应作为 DOM
    实例返回。如果你想从服务器向网页发送结构化数据，这就会非常有用；你可以使用 DOM API 将数据作为 XML 进行导航，并根据这些数据相应地更新网页。


    ## 3.4 总结


    这一章深入了 Ajax 的底层。你已经近距离接触了 JavaScript 语言和 DOM 模型。虽然仅使用你看到的这些构造来编写应用程序是可能的，但程序员通常倾向于青睐提供更多杠杆的工具。在我们处理实现
    Google Maps 之后，接下来的章节将介绍近期涌出的框架，它们让 DOM 操作、事件绑定和节点遍历的繁琐细节消失。


    # 第 4 章


    ## 创建 Google Maps


    对于我们许多人来说，Google Maps (http://maps.google.com) 点燃了 Ajax 革命。虽然在 Google Maps 出现之前，Ajax
    技术已经开始渗透主流网站，但在最近记忆中，没有任何东西能为通用浏览器带来如此视觉上令人震撼的体验。Google Maps 向世界展示了隐藏在我们自认为已充分掌握的技术背后的巨大潜力。


    本章的目的是揭示 Google 用 Google Maps 吸引我们所有人的技术。我们在这里发现的内容引人入胜且重要；它可能超出了你现在的承受范围。如果是这样，不要担心直接跳到书的其他部分，以后再回到这里；我们不会介意的。


    ## 4.1 火箭科学家？


    在 Google Maps 发布后不久，那些依赖传统的基于 HTML 的 Web 界面赚钱的根深蒂固的利益迅速声称，主流 HTML 开发者不需要尝试创建像
    Google Maps 那样的 Web 界面。流行的 Flash 浏览器插件供应商 Macromedia 的首席执行官在至少一次采访中表示，这种非 Flash
    Web 界面需要“火箭科学家”的技能。（讽刺的是，当 Macromedia 在四个月或五个月后终于制作出 Google Maps 的 Flash 克隆版本时，它在我们用来测试的几台
    Mac 笔记本电脑上无法运行——实际上导致了浏览器崩溃。而 Google Maps 在两台机器上都运行良好。我们实际上并不反对 Flash；我们只是觉得这很讽刺，仅此而已。）


    此类说法增加了许多开发者的普遍印象，即创建像 Google Maps 这样的东西只是，嗯，很难。


    事实上，一些开发者甚至感到了一丝恐惧和畏惧——担心不久后的将来，他们会被要求创建像 Google Maps 这样的东西！


    无疑，我们许多编写了多年 HTML 的人可能愿意相信，需要一个火箭科学家团队才能产生一系列支持 Google Maps 界面背后技术的创新，至少可以作为我们一直以来没有编写此类应用程序的借口。然而，我们认为所有关于火箭科学家和恐吓的言论都有些夸张了。


    事实上，在花十分分钟深入研究 Google Maps 之后，我们意识到，Google Maps 界面远非火箭科学家的产物，实际上实现起来相当简单。也许有人会说，很容易。不是“和写
    PHP Web 表单投入精力一样”，但我们能够在大约两小时内实现一个非常相似的东西。不仅仅是两分钟；你们在技术会议期间在拥挤的会议中心里花了两个小时，期间每分钟都会被我们的朋友打断。


    所以毫无疑问 Google Maps 最近聘请了一些知名度最高的计算机科学家——也许是我们行业中最接近“火箭科学家”式大脑脑力的例子，例如 Adam Bosworth（著名的微软创新者）和
    Vince Cerf（著名的互联网创新者）——我们非常确定他们没有参与 Google Maps 界面的创建。现实是，如果我们可以在几小时内创建一个像 Google
    Maps 那样的界面，想象一下几个能力出众的 开发者在几周或一个月内能做什么。


    ## 4.2 你自己的 Google Maps


    事实上，我们将免去你测试想象力。让我们亲手展示如何创建你自己的 Google Maps 版本。在接下来的几页中，我们将引导你创建“Ajaxian Maps”，我们对这个大头
    GM 的衍生品。我们将从解释 Google Maps 使用界面如何工作开始。


    ## 拆解 Google Maps


    我们将逐一拆解 Google Maps 的元素。让我们从最具戏剧性的特性开始：巨大的滚动地图，它是应用程序的核心。


    ## 真正的火箭科学


    好吧，好吧，我们承认——创建像 Google Maps 这样的东西并不容易。背后的地理编码功能（将地址映射到地图上的位置）、将地图特征相对于卫星图像归一化到如此令人惊讶的程度以至于它们可以相互叠加并看起来相当准确，以及从
    A 点到 B 点的路线绘制都是极其不凡的。


    然而，我们认为 Google Maps 的地理编码功能并不特别具有创新性或令人印象深刻。MapQuest 和其他软件软件包已经做了这种工作多年了。不，Google
    Maps 令人印象深刻的是位于地理编码引擎之上的 Web 界面。而且我们觉得容易的是界面，而不是盖子下的地理编码。


    但正如我们的好朋友 Glenn Vanderbilt 所说：“从技术上来说很容易，但这种界面的构思才是真正神奇的部分，仅仅是有这个想法并意识到它是可以实现的。一旦你看到它是可能的，很多事情就变得简单了。核心教训是，Google
    Maps 表明一旦你构思了下一个伟大的 UI 想法，你就可以放心知道，实现它的技术解决方案可能并不那么令畏。


    ## 地图


    如你所知，地图的工作原理允许你通过鼠标拖动地图本身来交互式移动地图。我们已经在浏览器中看到鼠标拖拽多年了，但令人印象深刻的是滚动地图是巨大的，可以有缩放级别等等。它们是如何做到的？


    当然，浏览器永远无法一次将如此大的地图放入内存中。例如，整个世界的街道级地图可能是百万像素见。显示该地图需要多少内存？为了方便讨论，让我们假设地图仅以 256
    色显示，这意味着每个像素仅消耗一个字节内存。这样的地图将需要 1,000,000,000,000 字节，或者大约一千 GB RAM。所以，仅仅显示一个 <img>
    元素是不可行的。


    ![](img/5a8d358ff7a4bc74757620e01fde970c_46_0.png)

    # 图 4.1: Google Maps


    所有的瓦片都布局在一个单个 HTML div 元素中，而这个 div 元素包含另一个 div；我们将称这两个 div 为内层 div 和外层 div。


    为了内存限制，Google Maps 对瓦片网格进行了虚拟化处理


