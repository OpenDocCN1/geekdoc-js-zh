    # Chapter 7


    # Ajax UI, Part II


    In the last chapter, we started to look at using some of the available Ajax JavaScript
    libraries to drive the user interface in a browser. Understanding how these libraries
    help you more efficiently control the UI is the UI. Step 1. Step 2 is understanding
    what you should do with your new-found tools.


    This chapter will present some of the standard techniques for utilizing Ajax on
    the UI. We''ll talk through validation, notification and data management strategies
    that have proven themselves to increase the utility AND usability of web applications.
    Later, we''ll talk about some patterns, too, the things you should avoid and the
    tests you should apply when Ajaxifying your application. This chapter isn''t exhaustive.
    Our intent is to give you a set of foundational tools for deciding how to (and
    when not) proceed.


    # 7.1 Some Standard Usages


    Let''s look at several common applications of Ajax using the libraries we talked
    about in the previous chapter: Prototype, Script.aculo.us and Dojo.


