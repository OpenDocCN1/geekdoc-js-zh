    我们再次面临着应用程序主要主题区域与关注点微小切换之间的区别。用户会接受其书签功能上的某些局限性；例如，大多数人并不期望能在电子商务网站的结账向导执行中途对某个页面加入书签。显然，用户必须学会静态页面与无法进行快照的状态化过程之间的区别。开发者现在必须意识到同样的这一点：哪些转换可以封装在一个不可存书签的进程中，而哪些转换需要页面跳转以便允许“暂停并恢复”的行为？


    ## GET 用于获取，POST 用于执行


    在 HTTP 的世界里，浏览器使用（通常是）GET 或 POST 请求与服务器通信。每当你点击超链接时，就会生成一个 GET 请求；其意图是获取下一个页面。当你点击
    HTML 表单上的提交按钮时，会发送一个 POST 请求。它将该表单的数据提交回应用程序进行处理。


    2005 年，创建 Basecamp（以及 Ruby on Rails）的团队汲取了这课宝贵的教训：GET 用于获取东西，POST 用于执行操作。HTTP
    规范对这一主题有非常具体的规定。GET 用于检索数据。POST 用于与服务器进行交互，这种交互可能会改变服务器状态。当你违背了规范的建议时，坏事就会发生——而且往往真的会发生。他们与这一问题上的公开斗争，为我们其他人提供了一个警示故事：如果这类问题会影响到最优秀、最聪明明的人，那么我们在开发应用时也需要格外小心，以避免类似的问题。


    Basecamp 的问题在于，当时使用 Rails 创建返回服务器的链接的默认方法是 GET。无论该链接在做什么：跳转到新页面、读取记录、删除记录，都一样。然后，Google
    发布了 Google 加速器（Google Accelerator）。Google 加速器安装在你的浏览器中，并将请求重定向到 Google 服务器。如果
    Google 已经缓存了该页面版本并加速了你的访问时间，你将获得缓存的奖励。如果页面未被缓存，则请求将正常转发。Google 加速器会遍历返回页面上的所有链接，并将其及其所有子页面进行缓存。


    对于一个所有控件都作为简单 GET 方法链接提供的应用程序来说，Google 加速器就成了想象中最高效的破坏性力量。把它想象成 Web 应用程序的“终结者”。它目标专一：向页面上的每一个链接开火。它是高效的。而且在你的应用死掉之前，它绝对不会停止。


    37signals 直到 Basecamp 数据库中的数据消失时才意识出了问题。当用户开始报告他们的数据其妙消失时，团队终于意识到共同点是 Google 加速器。通常情况下，这种事情不会是一个严重的问题。毕竟，Google
    的索引爬虫本质上遵循相同的路径：找到一个页面，导航到所有端点，缓存。但通过 Google 加速器，爬虫最终能够访问它以前从未获得过的信息：你的用户名和密码。例如，导航到你的
    Basecamp 账户并登录。加速器现在可以遵循你私有页面上的所有链接。然后它以最快的速度点击所有内容。而其中某些链接被标记为*删除项目*（Delete Item）。


