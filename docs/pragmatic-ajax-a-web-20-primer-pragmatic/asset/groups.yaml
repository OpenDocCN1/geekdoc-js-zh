    Form offers three UI relative methods:


    +   - disable(): disables every input field in the form (sets the background to
    gray and allows changes)

    - enable(): enables every input field in the form

    - focusFirstElement(): sets the focus to the topmost field in the form


    These methods allow you to work with the entire form as a single entity. For example,
    it is a common pattern to display information to the user that they may wish to
    edit. Web developers have to decide between showing them the data as plain HTML,
    switching to a form view when the user chooses to edit, or just showing it in
    the form view from the get go. With Form.enable and Form.disable, the decision
    is easier. You can display the data in a disabled form; when the user clicks the
    "Edit" button, simply enable the entire form.


    # Position


    Prototype contains several methods for understanding the current position of elements
    on a rendered page. Specifically, they allow you to discover the relative position
    of an element on a scrollable page, including whether or not the element is on
    the currently visible portion of the page. If not, you can retrieve the scroll
    offsets (horizontal or vertical) to the element from the visible section. Most
    developers won''t use these features directly, but instead use frameworks to build
    on top of them to provide higher-level features (like Scriptaculous, for example).


    # Script.aculo.us


    Thomas Fuchs built on top of the base Prototype library to dramatically increase
    the number and kinds of effects that can be created with JavaScript. Script.aculo.us
    is the result of his efforts. Where Prototype is focused on extending the baseline
    capabilities of JavaScript and the DOM, Script.aculo.us allows web developers
    to make HTML look and act just like any other "rich client" platform. The kinds
    of effects range from simple hiding and showing tricks all the way up to drag-and-drop
    and sortability.'
  - "[PAGE 107]\n\n# Effects\n\nThe library is divided between the five core effects\
    \ and a series of combination effects built on top of them. The core effects are:\
    \ Opacity, Highlight, MoveBy, Scale, and Parallel. Every effect represents a transition\
    \ between two states that occur over time. The effects have default values for\
    \ start and end points, as well as duration. These defaults can be overridden\
    \ for a fully customized effect. The various effects have different required parameters\
    \ (for instance, MoveBy() requires x and y deltas), and each can accept any of\
    \ the standard options as well. The general syntax for launching an Effect is:\n\
    \n```\nnew Effect.EffectName(element, required-params, {options});\n```\n\nThe\
    \ effects are all asynchronous which means if you launch effects simultaneously\
    \ they will render simultaneously. This is true whether the effects target different\
    \ elements, or all the same element. Quick-fired users wont be surprised by browser\
    \ lockups as your `<div>` turns yellow and balloon to twice their size, and you\
    \ can fade out many deleted items from your list as you desire at the time.\n\n\
    This section will examine all possible ways to utilize the core effects from the\
    \ library. In Chapter 7, Ajax UI, Part II, on page 115, we'll learn how to use\
    \ them effectively to increase the usability of the user interface. For all their\
    \ cool factor, these kinds of effects can be overused and become another `<blink>`\
    \ tag, knowing why you would employ them is just as useful as knowing how.\n\n\
    The standard options you can pass to the effects:\n\n+   - duration: the number\
    \ of seconds the transition will take (default 1.0)\n- fps: target frames per\
    \ second rate (default 25)\n- transition: an algorithm for determining how to\
    \ move from the starting point to the ending point. These are represented as a\
    \ series of, essentially, enumerated constants. Can be one of:\n  - sinusoidal:\
    \ start slow, peak in the middle, slow down on the way out\n  - linear: constant\
    \ speed from start to end\n  - reverse: constant speed, but from end to end"
