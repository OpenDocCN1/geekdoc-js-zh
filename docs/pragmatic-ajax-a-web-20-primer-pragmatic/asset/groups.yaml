    - colorFadeOut(): 从元素的原始背景颜色渐变到指定的颜色\n- wipeIn(): 将元素的高度设置为 0，然后将其放大到原始大小\n- wipeOut():\
    \ 将元素的高度设为原始大小，然后收缩到 0\n- explode(): 从一个节点到另一个节点，扩大该节点的大小直到与目标节点匹配\n- explodeFromBox():\
    \ 接收一组起始坐标和一个结束节点，让节点从起始坐标增长到结束节点位置\n- implode(): 接收一个起始节点和一个结束节点，收缩“起始节点”以填满“结束节点”空间\n\
    - implodeToBox(): 接收一个起始节点和一组目标坐标，收缩“起始节点”到坐标指定的形状\n\n## 6.2 结论\n\n在本章中，我们向你介绍了三个不同\
    \ Ajax 库的基础型 UI 元素。Script.aculo.us 和 Dojo 似乎提供了许多重叠的效果，但正如你所见，这两个库的使用风格截然不同。你最终为自己的项目选择哪一个取决于个人品味和需求；在功能方面，Dojo\
    \ 提供的比 Script.aculo.us 丰富得多，如果你需要这些功能，那么使用 Dojo 的效果也是合合理的。然而，如果你对这些高级功能不感兴趣，仅仅想要效果，那么\
    \ Script.aculo.us 是一个更轻量级的替代方案。从带宽消耗和学习成本的角度来看，它的开销更低。\n\n在下一章中，我们将使用这些库来重新实现具有酷炫\
    \ UI 特性的 CRM 应用程序。我们将展示服务器端验证、通知技术、进度指示器等内容。此外，我们还将讨论在使用 Ajax 时**不应该**做的事。在外面还有一些大大的反模式（antippatterns）等着你；我们会提醒你如何保持应用程序的整洁。\n\
    \n# 第 7 章\n\n# Ajax UI，第二部分\n\n在上一章中，我们开始学习使用一些可用的 Ajax JavaScript 库来驱动浏览器用户界面。理解这些库如何帮助你更有效地控制\
    \ UI 是 UI 开发的核心。第一步之后，第二步是理解你应该如何利用这些新发现的工具。\n\n本章将介绍在 UI 上使用 Ajax 的一些标准技术。我们将讨论验证、通知和数据管理策略，这些策略已被证明可以提高\
    \ Web 应用程序的实用性和可用性。随后，我们还将讨论一些模式，即在应用进行 Ajax 化时应该避免的事项以及应该采用的测试。本章并不是详尽的，我们的意图是提供一套基础工具，以便你决定如何（以及何时不）继续进行。\n\
    \n## 7.1 一些标准用法\n\n让我们看看使用上一章提到过的库（Prototype、Script.aculo.us 和 Dojo）对 Ajax 的几种常见应用：\n\
    \n## 服务器端验证\n\nWeb 应用程序面临各种标准问题。验证就是其中之一，它产生了无数的解决方案。随着时间的推移，我们了解到有一个必须考虑的通用界限：服务器端对比客户端。或者说我们曾是这样认为的。客户端验证对用户很有帮助，因为他们可以获得关于数据输入正确性的“即时”反馈，而无需等待整个页面刷新。然而，客户端验证对应用程序开发者来说意义较小，因为用户可以很容易地绕过客户端\
    \ JavaScript。嘿，用户完全可以忽略我们渲染的 HTML，并使用 Telnet 向我们的系统构建请求。因此，服务器端验证始终是强制性的。客户端验证是对我们用户可用性的增强。\n\
    \nAjax 允许我们结合这两种技术以获得更大的可用性。客户端技术的问题在于，验证规则本身必须能够移植到浏览器。这意味着你可以执行正则表达式矩阵、必填字段检查，甚至是小规模的数据比较（例如，检查某个州的缩写是否是标准的\
    \ 50 个双字母缩写之一）。然而，你无法针对数据库或任何存储在服务器上的数据或规则对输入进行验证。通过 Ajax，我们既获得了客户端验证的益处（无需刷新页面的“即时”反馈），又拥有服务器端验证的力量（与服务器存储的数据或规则进行对比）。\n\
    \n这意味着我们可以像以前那样创建具有完整验证的 Web 应用程序，但方式是不同的。我们可以使用一个完整的规则引擎来验证单个字段。但请记住，我们在最终提交时仍然需要验证数据。这种这种模式为我们提供了更强大的客户端可用性，但并没有从根本上解决问题。\n\
    \n我们将通过新的 Ajax 模式修改早期章节中的 CRM 应用程序。对于这个验证示例，我们必须开始准备 UI 本身。这里是 Name 和 Address\
    \ 字段的原始 HTML：\n\n```html\n<tr>\n  <td>Customer Name:</td>\n  <td><input type=\"\
    text\" name=\"name\"></td>\n</tr>\n<tr>\n  <td>Address:</td>\n  <td><input type=\"\
