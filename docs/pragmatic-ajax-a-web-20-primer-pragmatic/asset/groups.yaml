    \ are defined with the same name, the version that was last processed by JavaScript\
    \ is invoked. In our example, that turns out to be the one defined on line .\n\
    \nBecause a function's parameters play no role in defining it, their presence\
    \ is entirely optional. In fact, there's even a way to reference an invocation's\
    \ parameters without declaring them—but we'll come back to that in just a bit.\n\
    \n# The Function Type\n\nEarlier, we talked about the four types of values in\
    \ JavaScript (object, number, string, and boolean) and hinted that more exist.\
    \ Functions are in fact a type in JavaScript. In fact, once you define a function\
    \ using the traditional syntax we saw earlier, a variable exists that references\
    \ the function; the variable takes on the same name as the function itself.\n\n\
    Consider this next example:\n\n```javascript\nfunction myFunction() {\n  // imagine\
    \ that this function does something useful\n}\nalert(typeof myFunction)\n```\n\
    \nIf you execute this code in your browser, JavaScript's built-in alert will cause\
    \ a dialog to appear that displays the type of the myFunction variable; the contents\
    \ of the dialog will be \"function\".\n\nThis particular property of JavaScript—having\
    \ functions as a type—leads to some pretty interesting behaviors. Consider the\
    \ following:\n\n```javascript\nfunction myFunction() {\n  // we created a variable\
    \ myFunction\n  return \"Hello\";              // of the type \"function\"\n}\n\
    var myFunction = 10;          // we now reassigned myFunction to be a number\n\
    var myResult = myFunction();  // an error -- we can't invoke a number\n```\n\n\
    Yikes! In many languages, code like this would work fine; functions and functions\
    \ are entirely different entities and their names don't collide. In JavaScript,\
    \ because functions are variables, code like this is nonsense.\n\nIn addition\
    \ to the conventional syntax for defining functions that we've used up to now,\
    \ there's another way to define a function:\n\n```javascript\nvar a = 10;\nvar\
    \ b = 12;\nvar myFunction = function() {\n  return a + b;\n}\nvar result = myFunction();\
    \  // result is 22\n```\n\nIn this example, we've created a new function named\
    \ myFunction(). The cool bit is it that the function is able to access the state\
    \ of its enclosing block. We can reference the a and b variables from within the\
    \ function. This feature is often referred to as a closure, and it's a very powerful\
    \ feature. Normally, values in the enclosing scope are lost when the scope terminates.\
    \ A closure retains access to the state of the enclosing block; when used, that\
    \ state is still available to the closure.\n\n# JavaScript Events: Binding to\
    \ the Web Page\n\nUp to now, nothing of what we've considered about JavaScript\
    \ is specific to web browsers. In fact, many people actually use JavaScript outside\
    \ of web browsers. From here on, however, we will start to consider properties\
    \ unique to the JavaScript environment hosted in modern web browsers.\n\nThe first\
    \ consideration is how web pages interact with JavaScript. If you've ever written\
    \ JavaScript before, you probably know that most JavaScript in the web page must\
    \ be included inside a <script> tag. By convention, this is typically included\
    \ in the web page's <head> section, as:\n\n```html\n<head>\n  <script type=\"\
    text/javascript\">\n    /* javascript code here */\n  </script>\n</head>\n<body>\n\
    \  <!-- the web page contents -->\n</body>\n</html>\n```\n\nActually, you can\
    \ include <script> elements anywhere in the web page; their contents will be executed\
    \ in top-to-bottom order. It is generally considered bad form to include them\
    \ anywhere but the <head>, however.\n\n# Defining Events\n\nThe most common way\
    \ to launch JavaScript code from a web page is to use HTML events. These events\
    \ provide hooks for web pages to execute arbitrary code when the user interacts\
    \ in certain ways. For example, in the last chapter, you saw an example of the\
    \ onload registered on an <input> tag:\n\n```html\n<input onblur=\"getData(this.value)\"\
    \ type=\"text\" name=\"zip\"/>\n```\n\n# JavaScript in a Web Page\n\nWe said that\
    \ \"most\" JavaScript in a page should be included in a <script> tag. The exception\
    \ is that JavaScript can be embedded in-line as the value of attributes on a tag.\
    \ Specifically, instead of referencing JavaScript functions in event handlers,\
    \ you can embed JavaScript directly. There is no functional difference between:\n\
    \n```html\n<div id=\"myDiv\" onclick=\"handleClick();\">\n<script type=\"text/javascript\"\
    >\n  function handleClick() {\n    alert(\"You clicked me!\");\n    alert(\"Jerk!\"\
    );\n  }\n</script>\n```\n\nand this:\n<div id=\"myDiv\" onclick=\"alert('You clicked\
    \ me!'); alert('Jerk!');\"/>\n```\n\nAs we explained back then, the onblur event\
    \ is fired (that is, its contents are executed) when the user moves the cursor\
    \ from the input component to some other place on the web page. In this example,\
    \ the contents of the event attribute is a function invocation.\n\nThere are a\
    \ large number of events available in a web page. These range from the so-classic\
    \ events defined many years ago in the official HTML 4 specification to some additional\
    \ de facto events that have emerged in various browsers in more recent years.\
    \ There are numerous resources on the web for discovering the various types of\
    \ events possible in browsers; our favorite website is QuirksMode.org¹.\n\nFor\
    \ your convenience, we've included a selection of important events starting on\
    \ page ??; it is by no means an exhaustive reference. As you explore the rest\
    \ of this book, you'll see some additional examples.\n\n¹ http://www.quirksmode.org\n"
  mdcn: "\n\n# JavaScript、布尔值与你\n\n谈到布尔值，JavaScript 也可以将数字和字符串评估为布尔值：任何非空字符串和任何非零数字都会评估为\
    \ true。\n\n在第 3 行或，如在 `mySumTotal = myVariable + myOtherVariable` 中，会抛出一个错误。\n\
    \n出于如此，我们认为在声明变量时使用可选的 `var` 关键字是一种良好的风格：这可以明确地表明一个变量是有意声明的，还是说一个声明可能是一个类型。使用\
    \ `var`，示例如下：\n\n```javascript\nvar myVariable = 10\nvar myOtherVariable = 20\n\
    var mySumTotal = myVariable + myOtherVariable\nmyVariable = 5\nmyOtherVariable\
    \ = 10\nmySumTotal = myVariable + myOtherVariable\n```\n\nJavaScript 支持四种基本值类型：对象、数字、字符串和布尔值（还有其他类型，但现在并不重要）。与大多数其他语言不同，JavaScript\
    \ 的变量声明并不声明它们所存储的数据类型。相反，类型是根据赋值给变量的值以及变量所用表达式的类型自动确定的。此外，JavaScript 变量会根据需要自动更改类型。考虑以下示例：\n\
    \n```javascript\nmyVariable = \"What am I? Who made me\" // 一个字符串\nmyVariable\
    \ = 42 // 现在是一个数字\nmyVariable = 42 + \"The answer\" // 一个字符串 (\"42The answer\"\
    )\nmyVariable = true // 一个布尔\n```\n\n# 函数\n\n从表面上看，JavaScript 中的函数工作方式与任何其他语言中的一样。它们用\
    \ `function()` 关键字声明，可以接受零个或多个参数，并且可以返回结果：\n\n```javascript\nfunction addNumbers(one,\
    \ two) {\n  return one + two;\n}\n```\n\n# undefined（未定义）\n\n`undefined` 值是 JavaScript\
    \ 中的一种一等类型。最常见的情况下，它是 JavaScript 为已声明但从未赋值过值的变量所提供的值。某些 JavaScript 实现还将其用于从未声明过的变量的值，尽管这并不常见，因为大多数\
    \ JavaScript 解释器允许内联变量声明。\n\n需要注意的是，它不仅仅是一个值。尽管它有字符串表示形式（'undefined'），但它实际上是一个一等类型。这意味着当\
    \ `typeof()` 运算符作用于具有该值的变量时，将返回 `Undefined`。\n\nJava/C# 开发者可能会觉得没有返回类型来返回值很奇怪，它只是在某处使用\
    \ `return()` 关键字。创建一个在一条路径分支并返回值而在另一条路径不返回值的函数是完全合法的。赋值了非返回函数结果的变量包含特殊的 JavaScript\
    \ 值 `undefined`。\n\n考虑下面这段代码片段：\n\n```javascript\nfunction myFunction(a) {\n \
    \ return \"Hello\";\n}\nfunction myFunction() { \n  return \"World\";\n}\nvar\
    \ myResult = myFunction(\"aValue\"); \n```\n\n你认为这一行中 `myResult` 的值是什么？如果你使用支持方法重载的语言，你可能会期望值是\
    \ `Hello`。事实上，并非如此。JavaScript 不支持重载；也就是说，它不会根据函数的名称和参数来匹配函数调用和函数定义；仅根据名称。\n\n\
    因此，在运行时，给定名称只能有一个函数。如果定义了两个或多个同名的函数，则最后一个被 JavaScript 处理的版本将被调用。在我们的示例中，结果证明是在第\
    \ . 行定义的那一个。\n\n由于函数的参数在定义函数时并不起任何作用，因此它们的存在完全是可选的。事实上，甚至有一种方法可以在不声明参数的情况下引用调用的参数——但我们稍后会回到这一点。\n\
    \n# 函数类型\n\n早些，我们讨论了 JavaScript 中的四种值类型（对象、数字、字符串和布尔值），并暗示了更多类型。事实上，函数是 JavaScript\
    \ 中的一种类型。事实上，一旦你使用之前看到的传统语法定义了函数，就会存在一个引用该函数的变量；该变量采用了与函数本身相同的名称。\n\n考虑下一个示例：\n\
    \n```javascript\nfunction myFunction() {\n  // 假设这个函数在做一些有用的事情\n}\nalert(typeof\
    \ myFunction)\n```\n\n如果你在浏览器中执行此代码，JavaScript 内置的 `alert` 将弹出一个对话框，显示 `myFunction`\
    \ 变量的类型；对话框的内容将是 \"function\"。\n\nJavaScript 的这种属性——将函数作为类型——导致了一些有趣的行为。考虑以下：\n\
    \n```javascript\nfunction myFunction() {\n  // 我们创建了一个变量 myFunction\n  return\
    \ \"Hello\";              // 类型为 \"function\"\n}\nvar myFunction = 10;       \
    \   // 我们现在将 myFunction 重新赋值为数字\nvar myResult = myFunction();  // 错误 -- 我们不能调用一个数字\n\
    ```\n\n哎呀！在许多语言中，这样的代码可以运行良好；函数和函数是完全不同的实体，它们的名称不会冲突。在 JavaScript 中，因为函数是变量，这样的代码是毫无意义的。\n\
    \n除了我们目前为止使用的定义函数的常规语法外，还有另一种定义函数的方法：\n\n```javascript\nvar a = 10;\nvar b = 12;\n\
    var myFunction = function() {\n  return a + b;\n}\nvar result = myFunction();\
    \  // result 是 22\n```\n\n在这个示例中，我们创建了一个名为 `myFunction()` 的新函数。酷的一点在于该函数能够访问其闭包块的状态。我们可以从函数内部引用\
    \ `a` 和 `b` 变量。这个特性通常被称为闭包（closure），是一个非常强大的特性。通常，当作用域结束时，封装作用域中的值就会丢失。闭包保留了对闭包块状态的访问；当使用时，该状态对于闭包来说仍然可用。\n\
    \n# JavaScript 事件：绑定到网页\n\n到目前为止，我们考虑的 JavaScript 内容没有是特定于网页浏览器的。事实上，许多人实际上在网页浏览器之外使用\
    \ JavaScript。但从这里开始，我们将开始考虑现代网页浏览器托管的 JavaScript 环境特有的属性。\n\n第一个考虑因素是网页如何与 JavaScript\
    \ 交互。如果你以前写过 JavaScript，你可能知道网页中的大部分 JavaScript 必须包含在 `<script>` 标签内部。按照惯例，这通常包含在网页的\
    \ `<head>` 部分，如下：\n\n```html\n<head>\n  <script type=\"text/javascript\">\n  \
    \  /* 此处写 javascript 代码 */\n  </script>\n</head>\n<body>\n  <!-- 网页内容 -->\n</body>\n\
    </html>\n```\n\n实际上，你可以在网页的任何地方包含 `<script>` 元素；它们的内容将按从上下的顺序执行。然而，通常认为在 `<head>`\
    \ 以外任何地方包含它们是不良好的。\n\n# 定义事件\n\n从网页启动 JavaScript 最常见的方法是使用 HTML 事件。这些事件为网页在特定交互时执行任意代码提供了钩子。例如，在上章节中，你看到了一个在\
    \ `<input>` 标签上注册的示例：\n\n```html\n<input onblur=\"getData(this.value)\" type=\"\
    text\" name=\"zip\"/>\n```\n\n# 网页中的 JavaScript\n\n我们说过页面中的“大部分”JavaScript 应该包含在\
    \ `<script>` 标签中。异常是 JavaScript 可以内联在标签属性的值中。具体来说，与其在事件处理程序中引用 JavaScript 函数，你可以直接嵌入\
    \ JavaScript。以下两者之间没有功能上的区别：\n\n```html\n<div id=\"myDiv\" onclick=\"handleClick();\"\
    >\n<script type=\"text/javascript\">\n  function handleClick() {\n    alert(\"\
    You clicked me!\");\n    alert(\"Jerk!\");\n  }\n</script>\n```\n\n和：\n<div id=\"\
    myDiv\" onclick=\"alert('You clicked me!'); alert('Jerk!');\"/>\n\n正如我们之前解释的，当用户从输入组件移动到网页上的其他地方时，`onblur`\
    \ 事件触发（即执行其内容）。在这个示例中，事件属性的内容是一个函数调用。\n\n网页中有大量的事件。这些事件从许多年前在官方 HTML 4 规范中定义的经典事件，到最近在各种浏览器中出现的其他事实标准事件不等。互联网上有许多资源可以发现浏览器中可能的各种事件；我们最喜欢的网站是\
    \ QuirksMode.org¹。为了方便起见，我们从第 ?? 页列出了一些重要的事件；这绝不是详尽的参考。在探索本书的其余部分时，你会看到一些额外的示例。\n\
    \n¹ http://www.quirksmode.org\n\n"
