- md: "\nThe official DOM requires that developers manually manipulate all of an element's\
    \ child nodes, and add new ones, in order to change their contents. Some time\
    \ ago, Internet Explorer introduced an alternative mechanism for changing the\
    \ contents of an element—one that is dramatically easier to use. In recent years,\
    \ Mozilla and Safari have both implemented support for this feature. Take a look\
    \ at the revised\n\n```\nfunction modifyPage() {\n  var divElement = document.getElementById(\"\
    Replace\")\n  divElement.innerHTML = \"Goodbye, world!\";\n}\n```\n\nAhh, finally—that's\
    \ so easy to write! The de facto innerHTML property allows you to change the contents\
    \ of element by passing it a string that it will parse as XML and use to replace\
    \ the current contents of the element. Nice and easy.\n\nWhile the prose of these\
    \ last sections has been biased against the more traditional DOM API methods,\
    \ you can choose for yourself which mechanism seems most natural to you. Some\
    \ folks prefer dealing with nodes directly and actually enjoy writing code like\
    \ the previous iterations of our example you saw. In our experience, however,\
    \ most people prefer these shortcut mechanisms for retrieving elements and modifying\
    \ their contents.\n\n## Attributes\n\nSo far we've talked about dealing with XML\
    \ elements using JavaScript. What about attributes? Just as with elements, changes\
    \ to attributes take effect immediately in the browser's view of a web page, so\
    \ manipulating them can be pretty handy.\n\nThe DOM API presents a generic mechanism\
    \ for manipulating attributes. Once you have a reference to an element, you can\
    \ use the getAttribute() and setAttribute() functions to change attribute values,\
    \ such as in this example:\n\n```\nvar div = document.getElementById(\"someDiv\"\
    )\ndiv.setAttribute(\"style\", \"background: red\") // make the div red\n```\n\
    \nSurprisingly, this is fairly easy. After dealing with the DOM API elements,\
    \ you might have expected to have to navigate through some obtuse list of attributes\
    \ in order to change them. In fact, changing attribute values can be even easier\
    \ than this.\n\n## Inner and Outer\n\nThe innerHTML() property that we've just\
    \ demonstrated is very useful, but it has a rather storied history. It was introduced\
    \ as a proprietary addition to Internet Explorer; other browsers have decided\
    \ to support it as it has proved fairly useful, for obvious reasons. There are,\
    \ though, two related properties: innerText(), outerHTML().\n\ninnerText() accomplishes\
    \ almost the same thing as innerHTML(). The internal representation of the referenced\
    \ node is replaced with the text passed into the method. However, unlike innerHTML(),\
    \ the new text is not parsed as XML. It is, rather, rendered directly as a textual\
    \ child of the containing node. This is actually a lot more performant than parsing\
    \ the text as XML, and is preferable for just adding data than adding new elements\
    \ to the tree.\n\nouterHTML() is a different beast. innerHTML() detaches any and\
    \ all existing children of the target node, parses the new text, and adds the\
    \ new nodes as children of the target (essentially, replacing everything between\
    \ the opening and closing tags of the target node). outerHTML(), on the other\
    \ hand, replaces the target itself. All children of the existing node are lost\
    \ as a byproduct of destroying the target node. The node is replaced by whatever\
    \ new nodes are created by parsing the input to the method.\n\nThis latter approach\
    \ is actually much more useful when writing web pages that aggregate components.\
    \ The server-side code that renders the component can return the full entity (top-level\
    \ node and its children) which can be placed anywhere on the page. Using innerHTML(),\
    \ the containing page has full control over the layout of the components, with\
    \ specifically designed container nodes to use as targets. The server endpoints\
    \ only output the contents of a node: if the containing page puts them in the\
    \ wrong kind of node, or at the root of the document, the rendering will likely\
    \ be wrong.\n\nUsing outerHTML(), however, the server target renders the containing\
    \ node AND its contents, ensuring that no matter where the containing page puts\
    \ the results, it will be fully contained as designed. A real component, not just\
    \ component contents. This sounds like an excellent thing, and it is. Except it\
    \ is still a proprietary IE addition, and Firefox, for example, has not adopted\
    \ it, and has no public plans to do so.\n\nCast your mind back to the CRM application\
    \ we enhanced for the last chapter. Specifically, let's review a particular JavaScript\
    \ excerpt that powered that application:\n\n```\nfunction processZipData() {\n\
    \    if (xhr.readyState == 4) {\n        var data = xhr.responseText;\n      \
    \  var cityState = data.split(',');\n        document.getElementById(\"city\"\
    ).value = cityState[0];\n        document.getElementById(\"state\").value = cityState[1];\n\
    \    }\n}\n```\n\nTake a look at lines 5 and 6. What that .value bit do? What's\
    \ actually doing is changing the value attribute for the input element. Given\
    \ what we just talked about a few paragraphs ago, we ought to accomplish this\
    \ using the setAttribute('value', 'city'). What's value property all about?\n\n\
    It turns out the DOM API also defines a standard for mapping specific attributes\
    \ from the HTML grammar directly into the extended version of the DOM API that\
    \ browsers use. Using these special extensions, the element itself can set an\
    \ attribute's value by modifying a property of the object. Thus, when getElementById('city')\
    \ returns an input element, we can change its value attribute by setting the value\
    \ property on the object. Nifty!\n\n## 3.3 Retrieving Data\n\nWe've talked about\
    \ JavaScript, we've talked about how to manipulate the web page with the DOM API,\
    \ we're just missing one key element to explain retrieving data. The heart of\
    \ data retrieval is the XMLHttpRequest object (XHR for short) that we introduced\
    \ in the last chapter. In this section, we'll discuss more details about XHR.\n\
    \n## XMLHttpRequest\n\nIn the previous chapter, we showed the basics on how to\
    \ create an instance of XHR and use it to retrieve data. Let's review that again,\
    \ briefly in the context of a different example. The following code listing how\
    \ a simple web page can retrieve a message and display it.\n\n```html\n<html>\n\
    <head>\n    <script type=\"text/javascript\">\n        var xhr;\n        function\
    \ modifyPage() {\n          try {\n            xhr = new XMLHttpRequest(\"Msxml2.XMLHttpRequest\"\
    );\n          } catch (e) {\n            try {\n              xhr = new XMLHttpRequest(\"\
    Microsoft.XMLHttpRequest\");\n            } catch (E) {\n              xhr = false;\n\
    \            }\n          }\n          if (!xhr && typeof XMLHttpRequest != 'undefined')\
    \ {\n            xhr = new XMLHttpRequest();\n          }\n          xhr.open(\"\
    GET\", \"message\");\n          xhr.onreadystatechange=function() {\n        \
    \    if (xhr.readyState != 4) return;\n            document.getElementById(\"\
    message\").innerHTML = xhr.responseText;\n          }\n          xhr.send(null);\n\
    \        }\n    </script>\n</head>\n<body>\n<div id=\"message\">\n<button onclick=\"\
    modifyPage()\">Click Me</button>\n</div>\n</body>\n</html>\n```\n\nThis HTML will\
    \ render a very simple web page that presents a button to the user. Once clicked,\
    \ the page will display the results of a query to the server in the page above\
    \ the button. Line 21 shows the requested URL as '/message'; you could implement\
    \ this URL using any web-enabled language. A Java Servlet implementation would\
    \ look something like this:\n\n```\nimport javax.servlet.http.*;\nimport javax.servlet.ServletException;\n\
    import java.io.IOException;\nimport java.util.Date;\npublic class MessageServlet\
    \ extends HttpServlet {\n  protected void doGet(HttpServletRequest request,\n\
    \      HttpServletResponse response)\n  throws ServletException, IOException {\n\
    \    response.getWriter().println(\"Hello world, the current time is \" + new\
    \ Date());\n  }\n}\n```\n\nBut really, you could also implement the message URL\
    \ as a flat file containing plain text or an HTML snippet: it really doesn't matter.\
    \ XHR requests the URL just like the browser, and returns the results just as\
    \ though you entered the URL in the browser field.\n"
  mdcn: "\n\n官方 DOM 要求开发者手动操作元素的所有子节点并添加新节点，以更改其内容。早些时候，Internet Explorer 引入了一种更改元素内容的替代机制——这种机制用起来要方便得多。在最近几年里，Mozilla\
    \ 和 Safari 都实现了对该功能的支持。看看这个修改后的版本：\n\n```\nfunction modifyPage() {\n  var divElement\
    \ = document.getElementById(\"Replace\")\n  divElement.innerHTML = \"Goodbye,\
    \ world!\";\n}\n```\n\n啊，终于——这写起来实在太简单了！事实上的 `innerHTML` 属性允许你通过传递一个字符串来更改元素的内容，该字符串会被解析为\
    \ XML 并用于替换元素的当前内容。既方便又简单。\n\n虽然最后这几节的叙述对更传统的 DOM API 方法有偏见，但你可以自己选择哪种机制对你来说最自然。有些人倾向于直接处理节点，并且实际上喜欢编写像你之前看到的示例之前的迭代版本的代码。然而，根据我们的经验，大多数人倾向于使用这些快捷机制来获取元素并修改其内容。\n\
    \n## 属性\n\n到为止，我们讨论了如何使用 JavaScript 处理 XML 元素。那么属性呢？与元素一样，属性的更改在浏览器 Web 页面的视图中立即生效，因此操作它们可能非常有用。\n\
    \nDOM API 提供了一种操作属性的通用机制。一旦你获取了元素的引用，就可以使用 `getAttribute()` 和 `setAttribute()`\
    \ 函数来更改属性值，如下例所示：\n\n```\nvar div = document.getElementById(\"someDiv\")\ndiv.setAttribute(\"\
    style\", \"background: red\") // 让 div 变成红色\n```\n\n惊讶的是，这相当容易。在处理完 DOM API 元素后，你可能认为需要遍历一些晦涩的属性列表才能更改它们。事实上，更改属性值可以比这还要简单。\n\
    \n## 内部与外部（Inner and Outer）\n\n我们演示的 `innerHTML()` 属性非常有用，但它有一段相当传奇的历史。它是作为 Internet\
    \ Explorer 的一个专有扩展引入的；由于它被证明非常有用（原因明显），其他浏览器也决定支持它。然而，有两个相关的属性：`innerText()` 和\
    \ `outerHTML()`。\n\n`innerText()` 实现的功能与 `innerHTML()` 几乎相同。被引用节点的内部表示被传递给方法的文本所替换。然而，与\
    \ `innerHTML()` 不同，新文本不会被解析为 XML。相反，它被直接作为包含节点的文本子渲染。这实际上比将文本解析为 XML 性能高得多，而且对于仅仅添加数据而不是向树中添加新元素来说是更优的。\n\
    \n`outerHTML()` 则是另一回事。`innerHTML()` 会分离目标节点的所有任何现有子节点，解析新文本，并将新节点作为目标的子节点（本质上是替换目标节点起始和结束标签之间的所有内容）。另一方面，`outerHTML()`\
    \ 替换目标本身。作为破坏目标节点的副作用，现有节点的所有节点都会丢失。节点将被通过解析方法输入时创建的任何新节点所替换。\n\n在编写聚合组件的 Web\
    \ 时，后一种方法实际上有用得多。渲染组件的服务器端代码可以返回完整的实体（顶层节点及其子节点），它可以放置在页面的任何位置。使用 `innerHTML()`，包含页面对组件的布局具有完全的控制权，可以使用专门设计的容器节点作为目标。服务器端点只输出节点的内容：如果包含页面将它们放在错误的节点中，或者文档的根部，渲染结果可能是错误的。\n\
    \n然而，使用 `outerHTML()`，服务器目标会渲染包含节点**以及**其内容，确保无论包含页面将结果放在哪里，它都会按照设计被完整包含。这是一个真实的组件，而不仅仅是组件内容。这听起来是极好的，事实也如此。只是它仍然\
    \ IE 的专有扩展，例如 Firefox 尚未采用它，也没有公开的采用计划。\n\n回想我们在上一章中增强的 CRM 应用程序。具体来说，让我们回顾一下驱动该程序的特定\
    \ JavaScript 代码段：\n\n```\nfunction processZipData() {\n    if (xhr.readyState\
    \ == 4) {\n        var data = xhr.responseText;\n        var cityState = data.split(',');\n\
    \        document.getElementById(\"city\").value = cityState[0];\n        document.getElementById(\"\
    state\").value = cityState[1];\n    }\n}\n```\n\n看看第 5 行和第 6 行。那个 `.value` 部分是做什么的？实际执行的操作是更改输入元素的\
    \ `value` 属性。考虑到我们几段话之前讨论的内容，我们应该使用 `setAttribute('value', 'city')` 来实现这一点。`value`\
    \ 属性到底是什么？\n\n事实证明 DOM API 还定义了一个标准，将 HTML 语法中的特定属性直接映射到浏览器使用的扩展版 DOM API 中。通过这些特殊的扩展，元素本身可以通过修改对象的属性来设置属性值。因此，当\
    \ `getElementById('city')` 返回一个输入元素时，我们可以通过设置对象上的 `value` 属性来更改其 `value` 属性。巧妙！\n\
    \n## 3.3 获取数据\n\n我们讨论了 JavaScript，讨论了如何使用 DOM API 操作 Web 页面，只缺少一个关键元素来解释获取数据。数据获取的核心是\
    \ `XMLHttpRequest` 对象（简称 XHR），这是我们在上一章中引入的。在这一节中，我们将讨论更多关于 XHR 的细节。\n\n## XMLHttpRequest\n\
    \n在上一章中，我们展示了如何创建 XHR 实例并使用它来获取数据的基础。让我们在不同的示例背景下再次简要回顾一下。下面的代码列出了简单的 Web 页面如何获取并显示消息。\n\
    \n```html\n<html>\n<head>\n    <script type=\"text/javascript\">\n        var\
    \ xhr;\n        function modifyPage() {\n          try {\n            xhr = new\
    \ XMLHttpRequest(\"Msxml2.XMLHttpRequest\");\n          } catch (e) {\n      \
    \      try {\n              xhr = new XMLHttpRequest(\"Microsoft.XMLHttpRequest\"\
    );\n            } catch (E) {\n              xhr = false;\n            }\n   \
    \       }\n          if (!xhr && typeof XMLHttpRequest != 'undefined') {\n   \
    \         xhr = new XMLHttpRequest();\n          }\n          xhr.open(\"GET\"\
    , \"message\");\n          xhr.onreadystatechange=function() {\n            if\
    \ (xhr.readyState != 4) return;\n            document.getElementById(\"message\"\
    ).innerHTML = xhr.responseText;\n          }\n          xhr.send(null);\n    \
    \    }\n    </script>\n</head>\n<body>\n<div id=\"message\">\n<button onclick=\"\
    modifyPage()\">Click Me</button>\n</div>\n</body>\n</html>\n```\n\n此 HTML 将渲染一个非常简单的\
    \ Web 页面，向用户提供一个按钮。点击后，页面将在服务器查询的结果显示在按钮上方。第 21 行显示请求的 URL 为 '/message'；你可以使用任何支持\
    \ Web 的语言实现此 URL。一个 Java Servlet 实现如下：\n\n```\nimport javax.servlet.http.*;\n\
    import javax.servlet.ServletException;\nimport java.io.IOException;\nimport java.util.Date;\n\
    public class MessageServlet extends HttpServlet {\n  protected void doGet(HttpServletRequest\
    \ request,\n      HttpServletResponse response)\n  throws ServletException, IOException\
    \ {\n    response.getWriter().println(\"Hello world, the current time is \" +\
    \ new Date());\n  }\n}\n```\n\n但实际上，你也可以将消息 URL 实现为包含纯文本或 HTML 片段的静态文件：这真的并不重要。XHR\
    \ 像浏览器一样请求 URL，并返回结果，就像你在浏览器栏中输入该 URL 一样。\n\n"
