    #  7.2 It Isn''t All Just Wine and Roses...


    Ajax is fantastic. It opens the web to a whole new way of developing and delivering
    applications to your users. Largely, it changes the experience of using a web
    app from reading to using. As long-time instructors and trainers, we know first-hand
    the value of interaction in keeping students engaged and happy. The same phenomenon
    applies to applications, as well. If your application is passive, and makes your
    users passive consumers, then the application will not capture your users'' attention.
    An interactive version, however, has the power to excite.


    Even though Ajax has this power to change the web so radically, it behoes us all
    developers to remember why the web enjoys such broad acceptance. It is based around
    certain standards (technical and visual) that have allowed users of all stripes
    to take advantage of ser-'
  - '[PAGE 135]


    vices provided there. Those standards, some written and some sim-ply understood,
    are vital to the success of all applications on the web, whether or not they use
    Ajax.


    The key to a successful Ajaxification is to not ignore important convent-ions.
    There are certain laws of the land that made the web so popular and accessible,
    in ways that other applications and technologies never were. As you add this new
    technology into your application, think both tactically and strategically. Ask
    yourself the following questions:


    +   - “Is I’m adding increasing the usability of my application, or the length
    of my resume?”

    - “Does it break an ingrained habit of my users?”

    - “Is the value worth the cognitive dissonance such a break cause for my users?”


    Tactically, the change might increase the usability of this single page, but strategically,
    reduce the usability of the application as a whole.


    We''ll walk through some of the biggest anti-patterns to watch out for. This list
    is not exhaustive. When in doubt about something you are working on, check it
    against our smell-test questions above. And keep in mind that the key is usability
    and function: if it increases both, then do it!


    # Watch That Back Button!


    Two things set the World Wide Web apart from everything that came before it: the
    back button, the bookmark. Applications histori-c were guided tours. Users were
    encouraged to follow certain paths through the information provided. At best,
    users might be able to search for a specific item or screen and navigate directly
    to it. If they moved on, the only way to get back was to run the search again.
    And even this was a rare enough feature for an application. Consider Quicken circa
    1998, or those multimedia encyclopedias we all bought back in ''96. had tables
    of contents, and search capabilities, but no notion of the history of your actions.


    The back button isn''t just a button; its a symbol of freedom. It means you are
    free from the shackles of the guided tour. You forge your own path through the
    information at your fingertips, and can retrace your steps at your leisure. You
    become the master of the applic-tion, instead of the other way around. Don''t
    believe me? Go into your'
  - '[PAGE 136]


    browser and turn off the navigation bar and see how long you go before having
    to turn it back again.


    Bearing this in mind, now picture how the back button actually works. The default
    behavior for a browser is to cache pages as they are downloaded. Clearly, this
    can be overridden at either the browser or server level, but the default is to
    create a local cache. Only the original state of a page downloaded from the server
    is cached. If the DOM is modified in any way by client-side JavaScript, those
    changes are not reflected in the cache at all. Conversely, if the page was cached,
    the back button merely sends a new request to the server which will return the
    page in its original state anyway. The practical upshot of all this is that all
    your Ajax goodness is lost when the user navigates away from your page and back
    again.


    Its even worse than it looks at first glance, see if the page has elements whose
    value is determined at parse-time, those values will be cached along with the
    rest of the page. Clicking the back button will normally result in a load from
    cache where possible: the elements will contain possibly outdated values since
    the server-side parse never takes a second time. At that point, only if the user
    manually refreshes the page will the new values appear.


    It becomes incumbent on the designer of the application to distinguish between
    information retrieval and navigation. When a user wants to proceed to a new topic
    area, they generally want a history of where they were previously. The back button
    is the instant access to that history: navigating to a new subject area via an
    Ajax in-page replacement nullifies the ability of the back button to perform its
    appointed duties. Take, for example, the very common practice of online newspapers
    splitting its articles over multiple pages. In standard HTML, the current page
    shows a link to NextPage>>. Clicking that reloads the browser and shows page 2
    of the article. At the bottom are links to the back button to navigate backwards.
    Since the pages are part of a whole, and the user is already trained to use the
    NextPage link for forward navigation, it wouldn''t be too much of a stretch to
    do an Ajax version where the pages are loaded into a <div> on the fly. Users would
    use the build-in navigation as before clicking the back button would take them
    away from the article entirely, back to the table of contents. This seems fairly
    natural.


    Alternatively, imagine the same online newspaper site, but with a table'
  - '[PAGE 137]


    of contents whose links to articles operate in Ajax fashion. Clicking on the title
    of an article replaces the table of contents with the text of the article. Navigating
    forward and back in the article happens via Ajax as well. When the user clicks
    the Next and Previous buttons, pages are loaded into the <div>. What happens if
    the user clicks the back button now? They don''t end up at the table of contents;
    instead, they end up at whatever site they were before coming to the newspaper
    site at. This is because the table of contents was forced into the same page context
    as the articles listed. By doing so, you have essentially eliminated the history
    of a topic transition for your user (toc → article) that they would normally expect
    to be maintained for them.


    It is hard to pin down the exact point at which Ajax breaks this rule. But it
    is really easy to spot it after you have done it. Just use your application a
    few times. Whenever you find yourself annoyed because you can''t retrace your
    steps, you have probably found an instance of this anti-pattern.


    # Bookmarking Makes the Web


    Bookmarking is the kissing cousin of the back button. It is a usercontrolled meta-history
    of their browsing exploits. Bookmarking the index page (the welcome mat) is less
    useful now than it was in the past. With Google as our shared bookmarks, most
    people don''t bother bookmark the index page anymore. It is just easy to run to
    Google, in the page name, and click the result linking (or even the I''m feeling
    lucky button, which we almost never are). Instead, we use bookmarks for deep linking.
    This means capturing the state of the application or site at some point after
    you begun interacting with it. Perhaps the results of a search at Amazon, or the
    report of your current holdings at your financial institution, or some particular
    article at the New York Times.


    Deep linking means that users have the ability to pause and return to your application.
    If state is maintained (cookies, long term sessions, backend storage, whatever)
    and users can specify where in the application flow to resume their work, they
    are not chained to your timetable. We often find ourselves in the middle of something
    on an application but forced to take a call, or to a meeting. We want to know
    that we can pick up right where we left off at some later time.'
