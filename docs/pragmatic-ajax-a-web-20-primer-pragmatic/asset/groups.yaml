    这将是一种全新的认知体验；我们必须花上一天的时间阅读帮助文档，才能检查 Eagle 的得分。那样的话 Web 将变得毫无用处。


    不要受诱惑，认为自己比集体更聪明。由于人们往往会陷入某种傲慢，认为“我可以比最低公约数做得更好”。问题不在于相信这种观点，而在于将“普通”误认为是“最底层”。仅仅因为每个人都在做，并不意味着它就是坏的。这种逻辑如此违背直觉，以迎合我那过去幼稚的自我——例如，对
    The Cure 乐队和 Metallica 乐队的痴迷是因为我觉得菲尔·柯林斯（Phil Collins）不可能好，因为有这么多的人在听他的音乐。


    例如，Ajax 让我们以正确的方式创建门户网站。（有关门户的进一步处理，请参阅第 ?? 页的 ??。）基本上，门户网站是一个在单个页面上显示多个内容区域的网站。可能包含天气状况、当前登录网站的最后五封邮件、RSS
    Feed馈等。每个内容区域都是自包含的，可以被单独添加或删除，通常还可以最小化、完全隐藏、拖动和重新定位。这种对我们正在考虑的东西的使用……嗯，那是什么来着……哦，对了，窗口！就是它！门户中的内容区域就像窗口！而且我们目前有一套设计窗口的约定，让用户知道如何操作它。这意味着一个非常好的门户网站看起来应该像下一页的图
    7.5。


    最近的各个独立门户是可以关闭和最小化的，如果发现它们是可以拖动的，我们完全不应该感到意外。诱人的做法可能是强化所有这些——带有明显标题栏的圆角窗口，左下角用于关闭窗口的圆点。虽然我们是前卫设计的粉丝，但我们不喜欢苦苦与界面斗争以弄清楚它是如何工作的。我们更不喜欢被界面带来惊喜。坚持使用有效的方法。


    同样，基于与页面的非标准交互向服务器启动异步类将会让你的用户感到不安。将鼠标悬停在屏幕顶部显而易见的菜单上并导致菜单弹出，即使这涉及到（快速的）往返，也是可以的。如果在移动过段落中的随机单词时弹出菜单，将是令人惊恐的。用户点击按钮时导致数据刷新是符合预期的。用户点击链接时导致数据刷新可能会令人惊讶。老天爷，在开始对屏幕上的元素进行抖动、吹气和挤压之前，请务仔细思考。问问你自己，这种效果是用户在上下文中能够理解的，还是他们仅仅会感到惊讶。


    ![](img/5a8d358ff7a4bc74757620e01fde970c_143_0.png)

    图 7.5：设计良好的门户


    ## 7.3 结论


    在本章中，我们讨论了在 UI 中有效利用 Ajax 的一些常见模式。在大多数情况下，我们展示了如何使用 Ajax 让 Web 页面的响应更像客户已经习惯的其他界面。提醒用户数据变化，或告知他们在数据输入时犯了错误，这些都是在保持标准约定的同时提高应用程序响应能力的方法。如自动更新文本框等技术允许客户更高效地使用我们的应用程序。数据排序和拖放功能使
    UI 变得更像桌面系统中的标准“重量级”UI 组件。


    然而，对于任何事情来说，诀窍在于知道何时*不*这样做。我们本章的后半部分完全关于让我们自己关注最重要的点：易用性。当这些技术让我们的用户更容易完成任务时，该技术就是成功的。当它们成为阻碍，导致我们的用户必须思考他们正在做什么时，我们就应该重新评估我们的决定。最重要的是，永远不要让用户感到意外。


    ## 第 8 章

    ## 服务端框架集成


    在接下来的四章中，我们将引入四个 Web 应用开发框架，并检查它们用于整合 Ajax 的服务器端集成技术。这种集成对于开发团队来说非常有价值，允许团队成员将精力集中在一个逻辑层（服务器）上，同时为两个物理层（服务器和客户端）生成产物。


    为了探索这些框架，我们将引导 Hector 的团队将他们的 CRM 应用程序迁移到每个框架中。在此过程中，我们将讨论 Hector 可能考虑每种迁移的原因，以及每个选择带来的相对优势和挑战。我们将检查的四个框架是：


    - PHP：Sajax 是 PHP 的第一个 Ajax 集成工具包，我们将使用新的 Najax 库对其进行检查。

    - Ruby on Rails：Rails 与 Prototype 和 Script.ulous 集成非常紧密。事实上，这两个框架的作者也是 Rails 的提交者。

    - Spring (Java)：我们将查看 DWR 框架与 Java Web 应用程序的集成。

    - ASP.NET：我们将查看开源 Ajax 库 Ajax.NET 以及微软官方即将推出的 Atlas 工具包。


    在我们观察这四个框架并将 Hector 的应用程序迁移到每个框架时，请记住，我们无法比较和对比框架的每一个方面。这并不是一本关于比较性 Web 开发的书；这是一本关于
    Ajax 以及如何使用它来构建今天的应用程序的书。我们希望这些服务端章节能带给你……


    ### 8.1 集成的不同策略


    开发团队可以选择多种种策略。选择在很大程度上取决于框架的哲学：开发者应该使用 HTML 吗？应用程序应该像 HTML 吗？通常情况下，策略分为三大类：视觉工具、自定义标签库（以及辅助函数）以及类
    ORB 的远程调用。


    #### 工具


    某些框架是围绕使用视觉工具进行开发的想法构建的。例如在 Visual Studio 中获得支持的 ASP.NET，以及 Java 中的 JSF。组件本身负责管理其生命周期。这些框架现在通过声明式属性集成
    Ajax。事实上，ASP.NET 已经有这种支持一段时间了。程序员只需选择其中一个属性来启用所需的行为即可。


    #### 辅助标签


    Ajax 集成的第二种方法是自定义标签库。诸如 AjaxAnywhere¹ 和 Ruby on Rails 使用自定义标签库（或类似的结构）作为嵌入 HTML
    的服务器端功能的代名词。这些标签库（有时被称为辅助标签）由给定框架的模板引擎解析，模板引擎再根据自定义标签的属性生成客户端产物。


    结果是一个看起来像 HTML 的页面，但其实际内容是在解析时确定的。标签为将我们的服务器端代码集成到客户端模板中提供了一层抽象。这是一种非常强大的能力，因为它允许开发者专注于单一产物（模板），而不是在模板和替代代码文件之间来回跳去。


    我们将在 ?? 页的 ?? 页查看 Ruby on Rails 的 Ajax 集成。


    #### 类 ORB 的远程调用


    我们与服务端框架集成 Ajax 的最后一类策略是使用类 ORB 的远程调用将客户端 JavaScript 与现有的服务端功能连接。通过使用 JSON-RPC、DWR（用于
    Java）、Ajax.NET 或任何 PHP 框架，开发者可以为浏览器编写 JavaScript 代码，看似可以直接访问服务器端的领域模型。这些框架的效果是，你的领域代码现在可以跨客户端层复用，为两个层提供无缝的对象模型。


    在讨论 PHP 及其 Ajax 集成时，我们将在 ?? 页的 ?? 查看类 ORB 的远程调用。首先，我们将查看所有 PHP/Ajax 集成项目中的鼻祖 Sajax。接下来，我们将对比较新的玩家
    Najax。


    ¹http://www.ajaxian.com/archives/2005/09/ajaxanywhere_aj.html

