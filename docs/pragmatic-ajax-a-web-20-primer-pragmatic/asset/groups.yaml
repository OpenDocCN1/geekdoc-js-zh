    \ 0。\n\n## 高级技术 (Advanced Techniques)\n\nScript.aculo.us 提供了一系列更高级的技术，例如拖放和排序功能。我们将在下一章中检查这些内容。\n\
    \n## Dojo\n\nDojo 与 Prototype 和 Script.aculo.us 是完全不同的物种。虽然这些库规模较小，并且更关注与良好的 XHR\
