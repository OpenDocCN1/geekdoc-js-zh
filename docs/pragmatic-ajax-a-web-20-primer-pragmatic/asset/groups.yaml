    THIS!” He hissed the last word with venom and scorn. He flipped the laptop around
    so the table could see it. There, quietly couched in his browser window, was Google
    Maps.

    “Why,” he said, through clenched teeth, “can’t I have this?”


    # Today


    Since meeting, Hector and his team have been on fire to rethink the user interface.
    Hector went out to learn what was going on here, how Google could have completely
    ignored conventional wisdom and such a thing. He came across an article by Jesse
    Garrett describing this thing called Ajax. He’s been digging since then, learning
    everything he can out about this new way of making Internet applications.


    The team has been re-implementing the UI. They’re using JavaScript and HTML5 techniques
    to provide a more dynamic experience. Most of all, they’ve begun taking advantage
    of a useful object available in modern browsers called XMLHttpRequest (XHR for
    short). This little guy lets Hector and his team request and receive fresh data
    from the server without reloading everything in the page.


    In other words, Hector has spearheaded a move from Web 1.0 to Web 2.0. And his
    customer is happy again.


    # Tomorrow


    What comes next for Hector? His team is learning a bunch of JavaScript, and,,
    and even more than CSS than it ever knew before. The team is really excited about
    the results: the user experience is just like any other application, now the team
    doesn’t have to manage an installer as well as the application itself. But they’ve
    realized that there’s a downside to it all.


    Now, they are writing a ton of code in JavaScript. It turns out that all this
    page manipulation and XHR access requires a lot of real, honest-to-goodness code.
