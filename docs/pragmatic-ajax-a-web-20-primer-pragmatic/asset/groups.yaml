  - "[PAGE 105]\n\n# Beware Before and After\n\nDon't get too carried away with Before()\
    \ and After(). While each will happily let you insert plain text or renderable\
    \ markup into the document at the appropriate point, you cannot use them to create\
    \ new containers around an existing item. To do so, you would have to execute\
    \ two separate statements: an Insertion.Before() for the opening tag, and an Insertion.After()\
    \ for the closing tag. Modern DOM rendering engines will not allow you to add\
    \ malformed XML to the document. Therefore, the first call, containing just the\
    \ opening tag, will have a matching closing tag inserted at the end of the value\
    \ you passed in. The second call will have the closing tag simply stripped from\
