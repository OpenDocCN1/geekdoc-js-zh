    }\n```\n\n我们在创建动画后手动启动它。然后，随着动画通过曲线并获取值，这些值会被发送到事件监听器。在这种情况下，`onAnimate` 在动画的每一帧中被调用，它接收一个特殊的事件参数，提供动画状态的信息，包括当前值、完成百分比、设计的结束时间等。在\
