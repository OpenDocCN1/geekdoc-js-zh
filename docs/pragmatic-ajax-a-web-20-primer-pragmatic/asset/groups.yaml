    ```\n\n# Update Notification\n\nWeb surfers are largely trained to believe that\
    \ something loaded on a page is static. They understand that, in order to update\
    \ the contents of a page, the must be reloaded. The only cognitive exception to\
    \ this rule is animations. The web surfing population understands that certain\
