    \ browser compatibility issues and give us more options for controlling the remoting\
    \ calls.\n\nWe will first port our application to use the Dojo Toolkit, explain-choices\
    \ that you have gone along the way, and finally discussing more advanced features.\n\
    \n# What is the Dojo Toolkit?\n\nDojo is a browser toolkit. It is an open source\
    \ project, that (to quote its marketing text) aims to \"allow you to easily build\
    \ dynamic capabilities into pages and any other environment that supports JavaScript.\
    \ Dojo provides components that let you make your sites more usable, responsive,\
    \ and functional. With Dojo you can build degrade user interfaces, prototype interactive\
    \ widgets quickly, animate transitions, and build Ajax-based requests simply.\n\
    \nIt is a fully featured toolkit that has many packages including:\n\n- dojo.io:\
    \ The core package that we will look at in this chapter, that makes Ajax requests\
    \ easy.\n- dojo.event: Browser compatible event system.\n- dojo.lang: Support\
    \ for mixins, and object extension.\n- dojo.graphics: Support for nifty HTML effects\
    \ (e.g. fadein/Out, slideTo/By, explode/implode, etc.).\n- dojo.dnd: Drag and\
    \ Drop support.\n- dojo.animation: Create animation effects.\n- dojo.hostenv:\
    \ Support for JavaScript packages (think imports/includes of having to create\
    \ script src...\")\n\n# Porting CRM to dojo.io.bind()\n\nThis chapter is all about\
    \ the remoting layer, and in Dojo that means the dojo.io package. We are going\
    \ to go from where we left off with the CRM application, and replace the raw XMLHttpRequest\
    \ object with a call to dojo.io.bind()\n\n> ¹http://dojotoolkit.org\n\n# autocomplete=\"\
    off\"\n\nAs part of cleanup, we added the HTML attribute `autocomplete=\"off\"\
    ` on the city and state input values. This stops your browser from trying to do\
    \ its own completion, which gets in the way when the value is being set by a return\
    \ from Ajax.\n\n# Cleaning up the JavaScript\n\nBefore we get into Dojo, we should\
    \ clean up the JavaScript and encapsulate the acts of assigning the city and state\
    \ in the form, and announcing errors. Until now these acts were hidden in the\
    \ callback function used by XMLHttpRequest.\n\nFirst, we create a function that\
    \ assigns the city and state:\n\n```javascript\nfunction assignCityAndState(data)\
    \ {\n    var cityState = data.id.split(',');\n    document.getElementById(\"city\"\
    ).value = cityState[0];\n    document.getElementById(\"state\").value = cityState[1];\n\
    \    document.getElementById(\"zipError\").innerHTML = \"\";\n}\n```\n\nThen we\
    \ have a simple error assignment procedure:\n\n```javascript\nfunction assignError(error)\
    \ {\n    document.getElementById(\"zipError\").innerHTML = \"Error: \" + error;\n\
    }\n```\n\nWith this simple abstraction, we will be able to use remoting solution\
    \ and reuse these functions.\n\n# Migrating to dojo.io.bind()\n\nWe now get to\
    \ the Dojo IO package, and in particular, a dojo.io.bind() function that encapsulates\
    \ remoting. Everything you need to do for remoting can be done with this simple\
    \ function. dojo.io.bind() takes a hash as input, using the values to initialize\
    \ the underlying XHR object and register callbacks to other JavaScript functions.\n\
    \nFirst, we have to include Dojo by including the correct JavaScript in our HTML\
    \ head element:\n\n```html\n<script language=\"JavaScript\" type=\"text/javascript\"\
    \ src=\"../scripts/dojo/dojo.js\"></script>\n```\n\nLet's take a look at the code\
    \ that now uses the Ajax request for the zip data:\n\n```javascript\nfunction\
    \ getZipData(zipCode) {\n  dojo.io.bind({\n    url: url + \"?zip=\" + zipCode,\n\
    \    load: function(type, data, ev){ assignCityAndState(data);},\n    error: function(type,\
    \ error){ assignError(error); },\n    mime: \"text/plain\"\n  });\n}\n```\n\n\
    The must-have-element in the dojo.io.bind() is the parameter key. In our example\
    \ it will become /ajaxian-book-crm/zipService?zip=53711 if you are looking up\
    \ a Wisconsin city.\n\nThe load key takes a function object as a callback. After\
    \ the Ajax request has loaded a response, this function will be called (think\
    \ of this as being the callback when the status from a XMLHttpRequest is). In\
    \ your callback you get access to:\n\n- type, which tells you whether the response\
    \ returned normally (load) or from an error condition (error)\n- data, the actual\
    \ response (harvested from XHR.responseText). This is the payload of the request.\n\
    - evt, the DOM event\n\nThe error key handles errors, whereas load handles requests\
    \ that went through nearly. The function callback gets access to the error message\
    \ itself in its second parameter.\n\nThe mimetype key is important. We have discussed\
    \ how there are various styles of returning, and how you can choose to return\
    \ HTML, JavaScript, or your own text. Here, we decided to use text/plain, get\
    \ back the city/state information as the string Madison,WI, and split up for our\
    \ usage.\n\n# Changing dojo.io.bind() to Use a Return Type of JavaScript\n\nNow\
    \ we have our Ajax request encapsulated in one simple dojo.io.bind() function\
    \ call. This is a lot more elegant than the raw XMLHttpRequest API, and we will\
    \ soon see how we have access to features above and beyond the simple requesting\
    \ and retrieving of data.\n\nWhat if we wanted to talk to a service that responded\
    \ directly with JavaScript\n\n# Generic Handle\n\nRather than separating the load\
    \ and error handlers, in theory you can use one handler named handle. This is\
    \ when you would use:\n\n```javascript\nhandle: function(type, data, evt){\n \
    \ if (type == \"load\") {\n    assignCityAndState(data);\n  } else if (type ==\
    \ \"error\") {\n    assignError(error);\n  } else {\n    // potentially other\
    \ types\n  }\n}\n```\n\nMaking this change quite trivial with Dojo, and we will\
    \ simplify our code. For example, instead of returning we could use:\n\n```javascript\n\
    function getZipData(zipCode) {\n  dojo.io.bind({\n    url: url + \"?zip=\" + zipCode\
    \ + \"&type=eval\",\n    error: function(type, error){assignError(error);},\n\
    \    mimetype: \"text/javascript\"\n  ));\n}\n```\n\n```javascript\ndocument.getElementById('city').value\
    \ = 'WI'; \n```\n\nNotice that we added eval to the URL, to make sure the server\
    \ sends back JavaScript this time.\n\n# Advanced Features of dojo.io.bind\n\n\
    Hopefully at this point you have seen that it makes little sense to use the low\
    \ level API when you have a nice, simple interface. It turns out that dojo.io.bind()\
    \ can do a lot more for you. For one, it is able to browser detection.\n\n# Transport\
    \ Enforcement\n\nSometimes, we don’t want graceful, transparent failover. If,\
    \ some reason, we must mandate that only certain kinds of transport mechanisms\
    \ be used, we can pass in rule on the dojo.io.bind() call. If we want to enforce\
    \ one transport only, we can do so by setting `transport: 'XMLHttpRequest'` in\
    \ the hash that we pass in. If it can’t find one, it can drop back to iframes\
    \ to do the deed. All of this happens transparently to the developer.\n\n# Submitting\
    \ Forms\n\nDojo can submit a form asynchronously for you as well as accessing\
    \ a URL. All you need to do to submit your form is tell Dojo about the form element\
    \ in your HTML via:\n\n```javascript\ndojo.io.bind({\n  url: \"http://your.formsub.url\"\
    ,\n  load: function(type, obj) { /* use the response */,\n  formNode: document.getElementById('yourForm')\n\
    })\n```\n\n# Support for Browser back/forward Buttons\n\nThis feature is a gem.\
    \ One of the issues with using XMLHttpRequest while an iframe is that iframe events\
    \ are placed in the browser history, while XHR events are not. This can cause\
    \ an issue if a user clicks on something that causes an Ajax request which changes\
    \ the page, and then they hit the back button assuming that it will take them\
    \ to the state they were before that request. Instead, they are taken to the page\
    \ before the Ajax (which could be away from your website!). Dojo allows you to\
    \ tie into the browser buttons, passing in the work that you want to do when a\
    \ user clicks on back or forward. In our CRM example, you could save the current\
    \ city and state information\n"
  mdcn: "\n\n# 使用 Dojo Toolkit 进行远程调用 80\n\n这是上一个章节的示例，但我们希望向栈上层移动，利用远程调用工具包来抽象浏览器兼容性问题，并为我们控制远程调用提供更多选项。\n\
    \n我们将首先将应用迁移到使用 Dojo Toolkit，解释你在此过程中所经历的选择，最后讨论更高级的特性。\n\n# 什么是 Dojo Toolkit？\n\
    \nDojo 是一个浏览器工具包。它是一个开源项目（引用其营销文案的话），目标是“允许你轻松地在页面以及任何支持 JavaScript 的环境中构建动态功能。Dojo\
    \ 提供了许多组件，让你的网站更易用、响应更迅速且功能更强。通过 Dojo，你可以构建降级用户界面、快速原型交互式小组件、制作过渡动画，并简单地构建基于 Ajax\
    \ 的请求。”\n\n它是一个功能全工具包，包含许多包：\n\n- dojo.io: 我们将在本章中查看的核心包，它让 Ajax 请求变得简单。\n- dojo.event:\
    \ 浏览器兼容的事件系统。\n- dojo.lang: 支持混入（mixins）和对象扩展。\n- dojo.graphics: 支持酷炫的 HTML 效果（例如\
    \ fadein/Out, slideTo/By, explode/implode 等）。\n- dojo.dnd: 拖放功能支持。\n- dojo.animation:\
    \ 创建动画效果。\n- dojo.hostenv: 支持 JavaScript 包（想象无需手动创建 script src 即可进行 imports/includes……）\n\
    \n# 将 CRM 迁移到 dojo.io.bind()\n\n这一章完全关于远程调用层，在 Dojo 中，这意味着 `dojo.io` 包。我们将从 CRM\
    \ 应用的上次留下的地方继续，将原始的 `XMLHttpRequest` 对象替换为对 `dojo.io.bind()` 的调用。\n\n> ¹http://dojotoolkit.org\n\
    \n# autocomplete=\"off\"\n\n作为清理工作的一部分，我们在城市和州的输入值框上添加了 HTML 属性 `autocomplete=\"\
    off\"`。这阻止了浏览器尝试进行自己的自动完成，因为当值通过 Ajax 返回进行设置时，这种自动完成会产生干扰。\n\n# 清理 JavaScript\n\
    \n在进入 Dojo 之前，我们应该清理 JavaScript，并将在表单中分配城市和州以及宣布错误的操作封装起来。目前为止，这些操作都隐藏在 `XMLHttpRequest`\
    \ 使用的回调函数中。\n\n首先，我们创建一个分配城市和州的函数：\n\n```javascript\nfunction assignCityAndState(data)\
    \ {\n    var cityState = data.id.split(',');\n    document.getElementById(\"city\"\
    ).value = cityState[0];\n    document.getElementById(\"state\").value = cityState[1];\n\
    \    document.getElementById(\"zipError\").innerHTML = \"\";\n}\n```\n\n然后，我们有一个简单的错误分配程序：\n\
    \n```javascript\nfunction assignError(error) {\n    document.getElementById(\"\
    zipError\").innerHTML = \"Error: \" + error;\n}\n```\n\n通过这种简单的抽象，我们将能够使用远程解决方案并重用这些函数。\n\
    \n# 迁移到 dojo.io.bind()\n\n我们现在进入 Dojo IO 包，特别是一个封装了远程调用的 `dojo.io.bind()` 函数。你远程调用所需的一切都可以通过这个简单的函数完成。`dojo.io.bind()`\
    \ 接受一个哈希（hash）作为输入，使用这些值初始化底层的 XHR 对象并注册到其他 JavaScript 函数的回调。\n\n首先，我们必须通过在 HTML\
    \ head 元素中包含正确的 JavaScript 来引入 Dojo：\n\n```html\n<script language=\"JavaScript\"\
    \ type=\"text/javascript\" src=\"../scripts/dojo/dojo.js\"></script>\n```\n\n\
    让我们看看现在使用 Ajax 请求获取邮编数据的代码：\n\n```javascript\nfunction getZipData(zipCode) {\n\
    \  dojo.io.bind({\n    url: url + \"?zip=\" + zipCode,\n    load: function(type,\
    \ data, ev){ assignCityAndState(data);},\n    error: function(type, error){ assignError(error);\
    \ },\n    mime: \"text/plain\"\n  });\n}\n```\n\n`dojo.io.bind()` 中必不可少的元素是参数键。在我们的示例中，如果你查询威斯康星州的城市，它将变为\
    \ `/ajaxian-book-crm/zipService?zip=53711`。\n\n`load` 接收一个函数对象作为回调。在 Ajax 请求加载响应后，该函数将被调用（将其想象为\
    \ `XMLHttpRequest` 状态改变时的回调）。在你的回调中，你可以访问到：\n\n- type：告诉你响应是正常返回（load）还是来自错误条件（error）。\n\
    - data：实际的响应（从 `XHR.responseText` 中提取）。这是请求的负载。\n- evt：DOM 事件。\n\n`error` 键处理错误，而\
    \ `load` 处理几乎完成的请求。函数回调可以在其第二个参数中获取错误消息本身。\n\n`mimetype` 键非常重要。我们讨论过有多种返回样式，以及如何选择返回\
    \ HTML、JavaScript 或你自己的文本。在这里，我们决定使用 `text/plain`，获取如 `Madison,WI` 的字符串城市/州信息，并对其进行拆分。\n\
    \n# 修改 dojo.io.bind() 使用 JavaScript 返回类型\n\n现在我们把 Ajax 请求封装在了一个简单的 `dojo.io.bind()`\
    \ 函数调用中。这比原始的 `XMLHttpRequest` API 要优雅得多，我们很快就会看到如何访问超出简单请求和检索数据之外的功能。\n\n如果我们想与一个直接响应\
    \ JavaScript 的服务通信呢？\n\n# 通用处理程序\n\n理论上，与其分离 `load` 和 `error` 处理器，可以使用命名为 `handle`\
    \ 的一个处理器。你可以这样做：\n\n```javascript\nhandle: function(type, data, evt){\n  if (type\
    \ == \"load\") {\n    assignCityAndState(data);\n  } else if (type == \"error\"\
    ) {\n    assignError(error);\n  } else {\n    // 可能的其他类型\n  }\n}\n```\n\n使用 Dojo\
    \ 让这种变化变得非常简单，我们将简化我们的代码。例如，与其返回，我们可以使用：\n\n```javascript\nfunction getZipData(zipCode)\
    \ {\n  dojo.io.bind({\n    url: url + \"?zip=\" + zipCode + \"&type=eval\",\n\
    \    error: function(type, error){assignError(error);},\n    mimetype: \"text/javascript\"\
    \n  ));\n}\n```\n\n```javascript\ndocument.getElementById('city').value = 'WI';\
    \ \n```\n\n注意我们在 URL 中添加了 `eval`，确保服务器这次返回 JavaScript。\n\n# dojo.io.bind 的高级特性\n\
    \n希望此时你已经看到使用低级 API 的意义不大。事实证明 `dojo.io.bind()` 还能做更多。例如，它可以进行浏览器检测。\n\n# 传输强制\n\
    \n有时，我们不希望进行优雅的故障转移。由于某些原因，我们必须强制只使用某些传输机制，我们可以在 `dojo.io.bind()` 调用中传递规则。如果我们只想强制使用一种传输，可以通过在传入的哈希中设置\
    \ `transport: 'XMLHttpRequest'` 来实现。如果找不到，它可以回退到 iframe 执行。这一切对开发者来说都是透明的。\n\n\
    # 提交表单\n\nDojo 不仅可以异步提交表单，还可以访问 URL。提交表单只需要通过以下告诉 Dojo HTML 中的表单元素：\n\n```javascript\n\
    dojo.io.bind({\n  url: \"http://your.formsub.url\",\n  load: function(type, obj)\
    \ { /* 使用响应 */,\n  formNode: document.getElementById('yourForm')\n})\n```\n\n\
    # 支持浏览器后退/前进按钮\n\n这个功能是一个宝石。使用 iframe 时的一个问题是， iframe 事件会被放入浏览器历史中，而 XHR 事件不会。如果用户点击了导致\
    \ Ajax 请求并改变页面的内容，然后点击后退按钮，认为这会回到请求之前的状态，就会产生问题。实际上，他们被带到了请求之前的页面（可能离开了你的网站！）。Dojo\
    \ 允许你挂钩浏览器按钮，并在用户点击后退或前进时传入你想执行的操作。在我们的 CRM 示例中，你可以保存当前的城市和州信息\n\n"
