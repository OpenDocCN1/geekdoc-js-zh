    # XHR in Detail


    Let''s talk about some of the other features of XHR that we haven''t covered thus
    far.


    # States


    The onreadystatechange property is a key feature of XHR. It lets you register
    an asynchronous callback handler that will be invoked as the state of XHR changes
    during a request/response communication with a server. In the last chapter, we
    looked at the five possible states of the readyState property. Generally speaking,
    the important state is 4 (Completed). The other four states are all different
    shades of "incomplete".


    # Headers


    In addition to expose somewhat granular information about its current, XHR also
    lets you modify or add HTTP headers in the request and view headers in the response.
    This is accomplished using the setRequestHeader(), getResponse(), and getAllHeaders()
    functions. In this example, we spoof the browser to send the XHR: `xhr.setRequestHeader("User-Agent",
    "My Custom Browser")`


    # Response Data


    In the examples, we''ve used the responseText property to retrieve the response
    body from the server. There''s another property, responseXML(), that returns the
    response from the server as a DOM instance. This can be useful if you want to
    send structured data back to the web page from the server; you can use the DOM
    API to navigate through the data as XML and update the web page as appropriate
    based on that data.


    # 3.4 Summary


    This chapter dives into the underpinnings of Ajax. You''ve seen the JavaScript
    language and DOM model up close and personal. Though it is certainly possible
    to write applications using only the constructs you''ve seen here, programmers
    generally tend to appreciate tools that give them more leverage. After we tackle
    implementing Google Maps, the next several chapters will look at the frameworks
    that have sprouted'
