    # 6.2 Conclusion


    In this chapter, we''ve exposed you to the basic UI elements of three different
    Ajax libraries. Script.aculo.us and Dojo seem to provide a lot of overlapping
    effects, as you can see, the style of use is drastically different between the
    two libraries. Which one you end up choosing for your own projects is a matter
    of both taste and need; Dojo provides a lot more in terms of functionality than
    Script.aculo.us, and if you require those features, then it makes sense to work
    with Dojo''s effects as well. However, if you are less interested in those advanced
    features and just want the effects, Script.aculo.us is a much lighter weight alternative.
    It has lower overhead from a bandwidth and a learning perspective.


    In the next chapter, we''ll use these libraries to re-implement our CRM application
    with whizzy UI features. We''ll show server-side validation, notification techniques,
    progress indicators, and more. Additionally, we''ll talk about what NOT to do
    with Ajax. There are some big antippatterns waiting for you out there; we''ll
    give you the heads up on how to keep your app clean.'
