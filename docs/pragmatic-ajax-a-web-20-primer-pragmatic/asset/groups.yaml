    \ 架构\n\nAjax 这种令人兴奋的演变在于你如何构建 Web 应用程序。让我们先传统的传统的 架构：\n\n- 1. 为应用程序中的每个事件定义一个页面：查看项目、购买项目、结算等。\n\
    - 2. 每个事件（或操作）都会向浏览器返回一个*完整的*页面。\n- 3. 该页面被渲染给用户。\n\n这对我们来说似乎很自然。在 Web 诞生初期，这是合理的，当时的\
    \ Web 并不真正关于应用程序。Web 起初更像是一个文档存储库；一个你可以简单地以临时方式链接文档的世界。它关乎文档和数据的共享，而不是任何实质意义上的交互性。\n\
    \n想象一个丰富的桌面应用程序。想象一下，如果每点击一次，应用程序屏幕上所有的组件都会从头重绘，你会怎么想？这似乎有点慢，不是吗？在 Web 上，在 Ajax\
    \ 出现之前这就是我们所处的世界。\n\nAjax 启用了一种新的架构。这种架构的重要部分是：\n\n- 1. *小型的服务端事件*：现在 Web 应用程序中的组件可以向服务器发送小型请求，获取一些信息，并通过更改\
    \ DOM 来调整所查看的页面。无需刷新整个页面。\n- 2. *异步*：发送回服务器的请求不会阻塞浏览器。用户可以继续使用应用程序的其他部分，并且可以更新\
    \ UI 以通知用户正在进行请求。\n- 3. *onAnything（任何事件）*：我们可以根据用户几乎做的任何操作与服务器进行通信。现代浏览器跟踪与操作系统相同的大多数用户事件：鼠标点击、鼠标事件、按键等等。任何用户事件都可以触发异步请求。\n\
