    \ a servlet that implements the auto completion feature. Any reasonable production-quality\
    \ version would use a database of zip codes. Here's the servlet:\n\n```java\n\
    package ajax.book.servlet;\n\nimport javax.servlet.*;\nimport javax.servlet.http.*;\n\
    import java.io.*;\nimport java.util.*;\n\npublic class AutoCompleter extends HttpServlet\
    \ {\n    public void doPost(HttpServletRequest request, HttpServletResponse response)\
    \ throws Exception {\n        ArrayList results = new ArrayList();\n        String\
    \ val = request.getParameter(\"zip\");\n        for (int i = 0; i < zipCodes.length;\
    \ i++) {\n            if (zipCodes[i].startsWith(val)) {\n                results.add(zipCodes[i]);\n\
    \            }\n        }\n        String message = \"<ul>\";\n        Iterator\
    \ iter = results.iterator();\n        while (iter.hasNext()) {\n            message\
    \ += \"<li>\" + (String)iter.next() + \"</li>\";\n        }\n        message +=\
    \ \"</ul>\";\n        response.setContentType(\"text/html\");\n        PrintWriter\
    \ out = response.getWriter();\n        out.println(message);\n    }\n}\n```\n\n\
    Next, we'll have to use the AutoCompleter and a container to hold the responses\
    \ we get from the server. The update to the UI is shown here:\n\n```html\n<tr>\n\
    \  <th>Zip:</th>\n  <td>\n    <input autocomplete=\"off\" onblur=\"getZipData(this.value)\"\
    \ type=\"text\" zip=\"...\">\n    <div class=\"auto-complete\" id=\"zip_values\"\
    ></div>\n  </td>\n  <script type=\"text/javascript\">\n    new Ajax.AutoCompleter('zip',\
    \ 'zip_values', '/ajax-book-cm/autoCompleter', {});\n  </script>\n  <td id=\"\
    zipError\" style=\"color: red\"></td>\n</tr>\n```\n\nFirst, we had to make a minor\
    \ change to the zip field itself. We added the autocomplete=\"off\" attribute,\
    \ which prevents the browser from attempting to fill in the value. This would\
    \ pre-empt our JavaScript version, and nullify the whole exercise, so we disable\
    \ it. Next, we had to add a container to hold the results; that's the div named\
    \ \"zip_values\". Finally, we added a <script to invoke the Ajax.AutoCompleter.\
    \ The first parameter is the id of the input field to be auto-completed, the second\
    \ is the id of the container to display the results, the third is the server endpoint\
    \ to send the request to, and the final parameter is a collection of options.\n\
    \nIn our case, we're not using any of the optional parameters since the defaults\
    \ work just fine for this purpose. However, the options you have to customize\
    \ the behavior of the AutoCompleter are:\n\n- paramName: a name to use for the\
    \ value sent to the server (defaults to the name of the target input field)\n\n\
    - frequency: how often to check for changes to the input field and send the request\
    \ (defaults to 0.4 seconds)\n"
  mdcn: "\n通过像荧光笔一样高亮页面上的某个区域来吸引用户的注意力，但要让这种侵入性效果消失，以免影响页面的整体视觉感受。\n\n为了实现这一点，你可能需要编写一些代码来操作元素的\
    \ `background-color` 样式。你可能想要捕捉原始的 `background-color`，以便在效果将元素恢复到原始状态。你不得不处理这样一个事实：大多数浏览器内部以\
    \ `rgb(nnn, nnn, nnn)` 的形式存储颜色。如果你更喜欢使用十六进制法（#ffffff），则你必须自己进行转换。同样，你必须想出一种策略，同时将每种颜色（红、绿、蓝）从原始值移动到目标值，以获得平滑的过渡。\n\
    \n幸运的是，已经有人为你完成了这一切。之前，我们使用 Prototype 库来执行服务器端验证和进度通知。现在我们要在在此基础上叠加 Script.aculo.us\
    \ 库，以便当城市（City）和州（State）字段的内容更新时，让表单 YFT 通知你。\n\n首先，我们完全不需要修改 HTML。我们已经有一个具有唯一\
    \ ID 的容器元素，可以用于高亮效果。它是包含城市和州字段的 `<tr>`。它的 ID 是 `rewrite`。\n\n```html\n<tr id=\"\
    rewrite\">\n  <th id=\"City\"></th>\n  <td>\n    <input id=\"city\" type=\"text\"\
    \ name=\"city\"/>\n  </td>\n  <th id=\"State\"></th>\n  <td>\n    <input id=\"\
    state\" type=\"text\" name=\"state\" size='3' maxlength='2'/>\n  </td>\n</tr>\n\
    ```\n\n第二部分是更新 `getZipData()` 函数，以便在数据加载后触发该效果。记住，XHR 具有 `onreadstatechange` 事件，用于在请求状态发生变化时提醒你的代码。但在这种情况下，Prototype\
    \ 为我们提供了另一个选项。正如我们在第 XXX 章中提到的的那样，Prototype 库提供了两个新事件：`onSuccess` 和 `onFailure`，因此我们可以编写能够感知错误的异步方法。我们当前版本的\
    \ `getZipData()` 已经使用了 `onFailure` 来在请求失败时提醒用户：\n\n> http://script.aculo.us/\n\
    \n```javascript\nfunction getData(zipCode) {\n  new Ajax.Updater('rewrite', url,\
    \ {\n    asynchronous: true,\n    method: 'get',\n    parameters: 'zipCode=' +\
    \ zipCode + \"&type=html\",\n    onFailure: function(request) {\n      assignError(request.responseText);\n\
    \    }\n  });\n}\n```\n\n当请求失败时，会调用 `assignError()` 函数来显示消息。现在我们将为 `onSuccess`\
    \ 方法添加一个处理程序来执行 YFT。我们使用 `onSuccess` 而不是 `onComplete`，因为 `onComplete` 无论响应内容如何都会触发。这会导致我们即使在数据没有更新的情况下也会高亮城市和州。相反，我们使用\
    \ `onSuccess`，它只在返回的数据最终进入显示字段中时才会触发。\n\n```javascript\nfunction getData(zipCode)\
    \ {\n  new Ajax.Updater('rewrite', url, {\n    asynchronous: true,\n    method:\
    \ 'get',\n    parameters: 'zipCode=' + zipCode + \"&type=html\",\n    onSuccess:\
    \ function(request) {\n      new Effect.Highlight('rewrite');\n    },\n    onFailure:\
    \ function(request) {\n      assignError(request.responseText);\n    }\n  });\n\
    }\n```\n\n该处理程序的效果是，每当请求成功时，包含城市和州的行就会变为黄色，然后在一秒内淡回白色。请记住，正如我们在上一章中学到的那样，你可以通过向调用提交选项来影响过渡行为。例如，你可以通过更改调用将过渡改为在三秒内通过线性过渡从矢尾蓝（cornflower）变为深蓝色：\n\
    \n```javascript\nnew Effect.Highlight('rewrite', {\n  startcolor: '#92A4E2',\n\
    \  duration: 3.0,\n  transition: Effect.Transitions.linear });\n```\n\n如果需要，你也可以选择结束颜色（`endcolor`）以及淡出后使用的最终颜色（`restorecolor`）。\n\
    \n## 自动更新\n\n传统胖客户端与轻客户端区分开来的常见特点之一是能够对用户的操作做出快速反应。例如，有很多本地安装的应用程序可以对用户的操作做出反应，并对如何为用户完成单词做出智能猜测。Google（再次）证明了通过\
    \ Google Suggest 在 Web 上也可以实现同样的功能。这一功能被称为*自动补全（autocomplete）*。\n\nScriptacular\
    \ 提供了一个极其易用的版本，称为 `AutoCompleter`。它监控输入字段并发送名称的一些参数到注册的服务器端。结果渲染在另一个容器节点中，允许用户从结果中选择。整个效果只需添加一个容器即可实现。\n\
    \n它监控输入字段并发送名称的一些参数到注册的服务器端。结果渲染在另一个容器节点中，允许用户从结果中选择。整个效果只需添加一个容器即可实现。\n"
