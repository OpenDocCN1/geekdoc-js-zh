    # Chapter 6


    # # Ajax UI, Part I


    In the last several chapters, we gave you an earful about what Ajax is, what it
    isn’t, and where it came from. By now, you’ve seen the “asynchronous” and “xml”
    parts. Over the next two chapters, we’re going to introduce you to the “JavaScript”
    and flashy UI parts of the framework. You’ll get to see the CRM application grow
    into a full-fledged rich client application and learn some of the emerging standard
    patterns for Ajaxifying the UI. Perhaps most importantly, we’ll walk you through
    a cautionary tale about going too far, and knowing when to say.


    # ## 6.1 Ajax and JavaScript for the UI


    Dynamic HTML. The words roll around your brain and make you think of Nirvana,
    Lewinski and Razorfish. HTML was so ‘97. Most readers might be wondering “what’s
    Ajax got that HTML didn’t have?” The answer, it turns out, is fairly complex.
    It starts with maturity.


    When we were doing HTML apps back in the ‘90s, browsers were still duking it out
    the best way to render tags. Heck, we didn’t have <div> tags until the late ‘90s.
    Cascading stylesheets were just coming out, and the language hadn’t settled. There
    were browser-specific extensions to the DOM and the CSS language, and browsers
    couldn’t even be trusted to render their own extensions properly on a consistent
    basis.


    Fast forward to 2005. Browsers are still disagreeing about the best way to render
    tags, and there are still browser-specific extensions to worry about. The amount
    of commonality between modern browsers has grown immensely in the intervening
    years, leaving a'
- md: '

    ## AJAX and JavaScript for the UI


    much greater common ground. Gone are the days when you had to have browser-specific
    rendering of simple CSS styles. We have a much broader scope of acceptable UI
    techniques that will work anywhere. This kind of common ground, which eliminates
    the need for vast tracts of browser-specific JavaScript and CSS, makes the development
    of rich client apps much more straightforward and accessible.


    Further, when we were developing DHTML applications back then, we didn''t have
    the benefit of universal XMLHttpRequest support. IE4 had it built in as an ActiveX
    component, but that can hardly be considered universal. Justin remembers telling
    die-hard Windows developers about it in ''99 and getting a lot of odd stares in
    response, so even for those developers to whom it was available, it wasn''t widely
    used. Without an asynchronous, embedded channel back to the server, DHTML applications
    were just about pop and flash. They added only marginal usability improvements
    and of themselves, and if we wanted to make them talk back to the server, we ended
    up jumping through major hoops.


    Think of that much ubiquitous DHTML widgets, the tree nav. It was easy to write
    HTML-based trees. We invented a couple of CSS styles, so onceclick handlers and
    some crossed fingers, but it didn''t much effort. And, in return, we got collapsible,
    expandable tree navigation. What we didn''t get, unless we put in endless hours
    of effort, was a way to update portions of the tree from the server without reloading
    the whole thing. So we ended up putting the tree in a frame, all by its lonesome
    self, and refreshing it in tato whenever the app demanded. This made for tortured
    JavaScript and a less ideal user experience.


    We even went so far as invent the iframe to allow us to execute background threads
    of operation. As we previously, the iframe was a convenient, nonstandard, way
    to cause a secondary request to be sent to the server. JavaScript can modify the
    src attribute to cause a new request to be posted. This seems, at first glance,
    to provide everything. Dig down, though, and you''ll see some problems. frames
    provide no graceful method for checking on the state of a request; once fired,
    either the iframe renders its results or it doesn''t. Secondly, the iframe automatically
    renders the response sent back from the server. If the response isn''t HTML, the
    iframe must be navigated, DOM-style, to retrieve the results. All this is effective,
    but hard efficient, and certainly not elegant.


    The ability to exert fine-grained control over pieces of the UI only becomes profound
    when we also exert similar fine-grained control over the data we are retrieving
    from the server. Being able to flash the back-ground color of a <div> tag as the
    user mouses over it is pretty; being able to auto-update a text box as the user
    types into it is an actual usability improvement. The code to control the UI of
    the latter is not appropriately harder than the former; it is the access to an
    asynchronous trip to the server to fetch more information that makes it special.


    ## Ajax Encourages OO Over DOM


    The biggest change from HTML to Ajax has to do with the way we think about JavaScript
    code in the browser. In old HTML, we wrote JavaScript to manipulate the DOM; we
    treated the DOM as a giant repository of dumb entities, each with a collection
    of styles appended to it. We walked the DOM with nightmarish


    ```

    element.parent.sibling.child

    ```


    style code, and when we got there, we set text properties to interpreted as style
    changes in the rendering engine. We wrote our common code as a series of functions,
    devoid of organizing classes or conventions. None of this looked like the server
    side code we were writing; it certainly didn''t feel modern in any way. JavaScript
    was an adjunct to our “real work,” and it showed.


    Ajax strives to treat JavaScript in the browser as the first-class programming
    environment it can. Instead of writing procedural programs, we write class libraries
    to encapsulate our behavior. Instead of treating the DOM as a collection of dumb
    elements, we treat it as a hierarchy of types. Instead of thinking of them as
    strings to be constructed and parsed, we think of them as properties of objects,
    to be modified. We write modern OO code, complete with error handling, instance
    methods, static methods and type hierarchies.


    Even better, though, we write this modern OO code using a language more expressive
    than the statically typed languages we use on the server. With JavaScript, we
    can extend types without modifying the base code. If we want to add functionality
    to the document object, we can declare a new function and supply it with an anonymous
    definition. This new function has full access to the instance data of document,
    and can be called by any other type contained in our JavaScript. Functions can
    be sent around like data objects, invoked without knowing the originating instance.
    In other words, metaprogramming without extraneous reflection syntax.


    We say that Ajax encourages this style of programming. There is nothing-inherent
    in Ajax that mandates this, however. You can happily write the same old style
    of procedural, DOM-oriented JavaScript code and achieve Effects. The frameworks
    that have sprouted up around Ajax, though all eagerly pursue the more modern,
    object-oriented style of programming. They supply common APIs and types through
    which to modify the look and behavior of elements in the DOM. They provide better
    ways to navigate the DOM for specific elements, as well. Typically, these frameworks
    하다 object-oriented libraries and metaprogramming. For example, the Spectacular
    library adds a new method, getClassName(), to the document object at the root
    of the DOM model. By injecting this method into the existing class, we get a more
    convenient method for navigating our DOM tree, through OO methods.


    ## Common UI Frameworks


    With the creation of Ajax moniker, there has been a concomitant explosion of JavaScript
    libraries to help users take better advantage of the technology shift. Instead
    of making users find their own paths through the desert, these libraries drastically
    shorten the learning and adaption curves for Ajax. We''ve already talked about
    them in the previous chapter; here, we focused on what they do for UI. The first
    area is DOM navigation. The DOM model is a beast to get around; as much as it
    seems a highly standard operation, there can be interesting differences between
    browser and version. Navigating the DOM tree, using parent references and children
    collections often leads to finding the wrong element, or no element at all. The
    major UI frameworks find ways around this problem. In addition to the standard
    getElementById() method, these frameworks allow you to discover elements by class,
    style, tag, and a variety of other options. They give you ways to treat elements
    and names interchangeably, so that you can pass either to a function and get the
    correct result. Mostly, they provide handy shortcuts to tedious navigation, usually
    with more predictable results. Affecting the style and DOM nodes is a painful
    exercise in string-based CSS, element property modulation, and general mucking
    about trying to get the element or act the way you want. Do you increase the size:
    in pixels or percent? What''s the best way to move an element around the page?
    The answers are an ungainly mix of techniques which seem to feel like guesswork
    than solid programming.


    Good AJAX libraries take the guesswork and pain out of manipulating element styles.
    Instead of having to guess what of properties you have to modify for the desired
    behavior, certain typical and canonical effects are captured and supplied to you
    through a single method call. Users can modify the default behavior of the effects,
    or combine them in unique ways to achieve tailored results.


    # Prototype


    The Prototype library libraries (notably, Scriptaculous) are built on top of the
    basic functionality provided here. Prototype is a relatively simple JavaScript
    file;ing in 1041 lines of code as of version 1.4.0_pre2, it manages to pack an
    enormous punch for dealing with UI issues in the browser. We''ve already covered
    what Prototype does for remoting in earlier chapters. Now we''ll examine how it
    replaces the standard DOM and CSS idioms for manipulating UI elements.

