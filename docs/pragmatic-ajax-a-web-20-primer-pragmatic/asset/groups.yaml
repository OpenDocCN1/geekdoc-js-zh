    \ the document. In the case above, if there's no element with id element_two,\
    \ the call still returns an array of length 3. The second element, however, is\
    \ null instead of a reference to a DOM node. Also bear in mind that $() only works\
    \ for input elements. If you are looking for the text contained within an arbitrary\
    \ DOM node, $() is useless."
  - '[PAGE 100]


    # innerHTML Limitations


    According to the documentation for the IE, the innerHTML property is read-only
    for the following list of enclosing tags: COL, COL-GROUP, FRAMESET, HTML, STYLE,
    TABLE, BODY, TFOOT, THEAD, TITLE, TR. Which means, in IE, you cannot use the innerHTML
    property to set the contents of a table row. This works fine in all other browsers,
    but can be a serious limitation to cross-browser effects.


    Prototype also extends the document object to include the new getElementsByClassName()
    method. You pass in the string name of a CSS class and the function will collect
    all the elements in the DOM which contain that class in their list. It doesn''t
    matter if the class is the first or only entry in the element''s list. Prototype
    will still find it.


    ```

    <div id="one" class="class1">

    <div id="two" class="class2">

    <div id="three" class="class1">

    <div id="four" class="class2, class1">\n<script type="text/javascript">

    var classOn = document.getElementsByClassName(''class1'').length; // 3

    var classTwos = document.getElementsByClassName(''class2'').length; // 2

    var classThrees = document.getElementsByClassName(''class3'').length; // 0

    </script>

    ```


    This method only takes a single class name, though. It is up to you to make any
    sort of union if you are looking for elements implementing one of a lists.


    Once you can successfully retrieve nodes from the DOM, the next step is manipulating
    them. Among the most common things to do is to simply change the content of a
    node by resetting the value of its innerHTML property. innerHTML is just string
    representation of the contents of the node. If you fill it with properly formatted
    HTML, the browser will render it as HTML. When you retrieve it, you will want
    to maintain the tag structure in its original format. Other times, you''ll want
    to actually display the tags as strings rather than them rendered as HTML. Prototype
    extends the JavaScript String class with new methods. escapeHTML() returns the
    innerHTML, but with any HTML tags escaped so they can be displayed as text. unescapeHTML()
    does the exact opposite. This is very useful for displaying HTML source within
    an HTML page.'
  - "[PAGE 101]\n\n# AJAX and JavaScript for the UI\n\nA final case is when you want\
    \ to eliminate the tags altogether. Imagine a div that contains a bibliography\
    \ entry, rendered so that the title of the book is underlined and the author's\
    \ name is boldfaced. You want to retrieve that value as data; any embedded style\
    \ notation (or, Heaven help us, <b> tags) are extraneous. String now has the striptags()\
    \ method which eliminates any angle brackets (and what's inside them) from the\
    \ output. Whitespace is otherwise maintained, allowing you to treat HTML as raw\
    \ data.\n\n# Element\n\nPrototype introduces a new class, Element, that controls\
    \ basic styling properties of a DOM node. Element is a static class, in that you\
    \ do not need create an instance of it to access its functionality. Its various\
    \ methods all take an element ID or an element itself as a parameter and perform\
    \ some action on them.\n\nWe spend a lot of hiding and showing nodes of a DOM\
    \ tree. Error messages are invisible unless validation fails, for example, or\
    \ trees collapsible nodes. Most of the dynamic nature of a web page is wrapped\
    \ in the mysterious appearance and disappearance of blocks of data. The standard\
    \ JavaScript strategy for accomplishing that uses the div.display property.\n\n\
    ```\n<div id=\"hideOrShow\">\n  You can turn me on and off.\n</div>\n<input type=\"\
    button\" value=\"Toggle\" onclick=\"toggle('hideOrShow');\" />\n<script type=\"\
    text/javascript\">\nfunction toggle(elemName) {\n  var elem = document.getElementById(elemName);\n\
    \  if(elem.style.display=='none') elem.style.display = '';\n  else elem.style.display\
    \ = 'none';\n}\n</script>\n```\n\nElement provides the toggle command which accomplishes\
    \ the exact same thing, with the added benefit of being able to pass in many element\
    \ names (or elements) as you like to a single call. Toggle will iterate over all\
    \ the arguments, toggling the state of each in turn. This provides a convenient\
    \ way to swap visibility of elements.\n\n```\n<div id=\"up\">\n  <img src=\"images/up.gif\"\
    >Up\n</div>\n<div id=\"down\" style=\"display:none;\">\n  <img src=\"images/down.gif\"\
    >Down\n</div>\n```"
  - '[PAGE 102]


    ```

    <input type="button" value="Toggle" onclick="Element.toggle(''up'', ''down'');"/>

    ```


    To be sure, we don''t always want to toggle. Element also exposes arguments each
    take takes a variable number of arguments, ensures that each has its display property
    set correctly. Sometimes, toggling isn''t enough. Setting an element''s display
    property to ''none'' renders the rest of the page layout as though the element
    did not exist in the DOM. However, the mere existence of the hidden element contained
    form elements, for example, would be submitted to the action as though they were
    visible. The same is true for scripts that traverse the DOM elements or manipulate
    page layout.


    Instead of merely setting the div''s display property to ''none'', we can remove
    the div from DOM tree entirely. Normally, this would mean navigating to the <div>''s
    parent node and removing the div from the parent''s child. The DOM specifies a
    removeChild() method for this purpose. The node is removed from the tree, the
    entire tree re-rendered to keep that block from influencing the flow. Furthermore,
    containing elements no longer have any knowledge of the node, and scripts will
    not be able to discover it. This is irreversible, unless you cached a copy of
    the node in another variable and add it back manually later. Prototype exposes
    the removeChild() feature as a function called Element.remove().


    # Inserting Data


    Showing and hiding data is nice, but it implies that we have a nice container
    dedicated for displaying that piece of data. Showing an error message, for example,
    usually means that we have a hidden div or span standing to take that data, then
    display it to the user. Often, though, what we want to add more data to an existing
    element. Most commonly, we want to add items to an already-visible list of items.
    The standard HTML way to do this is to recreate a new version of the list items
    which include the additions, then replace the contents of the list with the new
    version. With Ajax, this would mean having a server-side method which you call
    sends the list back with any new items appended. While effective, this might be
    extremely long-running, and if it involved a database, mandates at least a round
    trip to the datastore to re-fill the list.'
- md: "\nPrototype introduces the Insertion class. Insertion allows us to add information\
    \ to an existing container without replacing what currently exists in the list.\
    \ Prototype.Top() enters the new data at the beginning of the container's, while\
    \ Insertion.Bottom() enters it at the end. This means that you can easily append\
    \ single lines to a list without re-rendering the whole list.\n\n```html\n<ul\
    \ id=\"mylist\">\n  <li>one</li>\n  <li>two</li>\n  <li>three</li>\n</ul>\n<input\
    \ type=\"text\" id=\"newval\"/>\n<input type=\"button\"\n  onclick=\"new Insertion.Bottom('mylist',\
    \ \n    '<li>\\'' + Element.get(\\'newval\\').value + \\'</li>\\');');\"/>\n```\n\
    \nKeep in mind that you have the full value you want rendered. In the example,\
    \ we are appending the text value of the input field to the bottom of the list.\
    \ We have to wrap it in the <li> tags in order to get it to render as a list item;\
    \ without those tags, the new value is just pasted as text inside the list, which\
    \ is rendered without the bullet, and as inline text.\n\nPrototype actually grows\
    \ a little further, and lets you append text around the container as well. In\
    \ all, Insertion offers four placements for your new data: Before(), Bottom(),\
    \ and After(). Figure 6.1, on the following page demonstrates where each lives.\n\
    \nThis is fairly powerful, since you can modify a section of the page from which\
    \ you do not have an ID (or there may be no ID at all).\n\n## Forms\n\nWorking\
    \ with forms has historically been a bit of a drag. Forms are useful for only\
    \ one purpose: collecting data from a user. The input fields that exist on a form,\
    \ though varied in style, are essentially identical in nature. They represent\
    \ an item that a user can use to tell us something. Before Ajax and the re-thinking\
    \ of the DOM that it brought with it, we had to treat forms and inputs just like\
    \ any other HTML elements, navigating the DOM to find them, modifying their style\
    \ properties to affect their behavior.\n\nPrototype uses tools to think about\
    \ forms differently. Instead of representing a chunk of HTML that happens to have\
    \ input boxes embedded in it, Prototype encourages us to think of forms as collections\
    \ of data fields. Using the library, we can manipulate the properties of all the\
    \ fields on a form simultaneously when that suits our needs, and navigate them\
    \ as an array of fields, not as scattered children in a subtree of the DOM.\n\n\
    The vehicles for this change are the new classes Form and Field. Field provides\
    \ three major UI-related methods:\n\n- select(): selects the current value of\
    \ the field\n- focus(): moves the focus to the field\n- activate(): a combination\
    \ of select() and focus()\n\nFor example, you could create a form with certain\
    \ fields visible at all times, but a second set of advanced options only visible\
    \ when the user requests them. For convenience, you would want the user to begin\
    \ typing into the topmost field immediately upon making visible, which you could\
    \ accomplish with activate.\n\n```html\n<form action=\"postback.jsp\" method=\"\
    post\">\nFirst Name: <input type=\"text\" name=\"firstname\"/><br>\nLast Name:\
    \ <input type=\"text\" name=\"lastname\"/><br>\n<a href=\"#\" onclick=\"Element.toggle('advanced_options');Element.activate('petname');\"\
    >\nAdvanced Options\n</a>\n<div id=\"advanced_options\" style=\"display:none;\"\
    >\nPet's name: <input type=\"text\" name=\"petname\"/><br>\nFavorite color: <input\
    \ type=\"text\" name=\"favoritecolor\"/>\n</div>\n```\n\n## Beware Before and\
    \ After\n\nDon't get too carried away with Before() and After(). While each will\
    \ happily let you insert plain text or renderable markup into the document at\
    \ the appropriate point, you cannot use them to create new containers around an\
    \ existing item. To do so, you would have to execute two separate statements:\
    \ an Insertion.Before() for the opening tag, and an Insertion.After() for the\
    \ closing tag. Modern DOM rendering engines will not allow you to add malformed\
    \ XML to the document. Therefore, the first call, containing just the opening\
    \ tag, will have a matching closing tag inserted at the end of the value you passed\
    \ in. The second call will have the closing tag simply stripped from the input.\n\
    \nImagine you have an element containing a new header tag that you want to surround\
    \ with a new <div>. Your code would look like this:\n\n```html\n<ul id=\"mylist\"\
    >\n  <li>one</li>\n  <li>two</li>\n  <li>three</li>\n</ul>\n<input type=\"text\"\
    \ id=\"newval\"/>\n<input type=\"button\" value=\"Add Item\" onclick=\"wrapList('mylist')\"\
    >\n<script type=\"text/javascript\">\n  function wrapList(list) {\n    Insertion.Before(list,\
    \ '<div><h2>New Title</h2>');\n    Insertion.After(list, '</div>');\n  }\n</script>\n\
    ```\n\nWhen you execute this, the rendered DOM tree, you could see it using view\
    \ source, would look like this:\n\n```html\n<div><h2>New Title</h2></div>\n<ul\
    \ id=\"mylist\">\n  <li>one</li>\n  <li>two</li>\n  <li>three</li>\n</ul>\n```\n\
    \n### In-line elements\n\n| Before | Open tag | Top | Internal Data | Bottom |\
    \ Close tag | After |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n\n\
    ### Block elements\n\n| Before |\n| :--- |\n| line break |\n| Open tag | Top |\
    \ Internal Data | Bottom | Close tag |\n| :--- | :--- | :--- | :--- | :--- | :---\
    \ |\n| line break |\n| After |\n| :--- |\n\n![](img/5a8d358ff7a4bc74757620e01fde970c_104_0.png)\n\
    \n## Position\n\nPrototype contains several methods for understanding the current\
    \ position. Specifically, they allow to retrieve the offsets (horizontal or vertical).\
    \ The kinds of effects range from simple hiding and showing tricks all the way\
    \ to drag-and-drop.\n\n## Effects\n\nThe library is divided between the five core\
    \ effects and a series of combination effects built on top of them. The core effects\
    \ are: Opacity, Highlight, MoveBy, Scale, and Parallel. Every effect represents\
    \ a transition between two states that occur over time. The effects have default\
    \ values for start and end points, as well as duration. These defaults can be\
    \ overridden for a customized effect. The various effects have different required\
    \ parameters (for instance, MoveBy() requires x and y deltas), and each can accept\
    \ any of the standard options as well. The general syntax for launching an Effect\
    \ is:\n\n```javascript\nnew Effect.EffectName(element, required-params, {options});\n\
    ```\n\nThe effects are all asynchronous which means if you launch effects simultaneously\
    \ they will render simultaneously. This is true whether the effects target different\
    \ elements, or all the same element. Quick-fired users won't be surprised by browser\
    \ lockups as your <div> turns yellow and balloon to twice their size, and you\
    \ can fade out many deleted items from your list as you desire at the time.\n\n\
    This section will examine all possible ways to utilize the core effects from the\
    \ library. In Chapter 7, Ajax UI, Part II, on page 115, we'll learn how to use\
    \ them effectively to increase the usability of the user interface. For all their\
    \ cool factor, these kinds of effects can be overused and become another <blink>\
    \ tag, knowing why you would employ them is just as useful as knowing how.\n\n\
    The standard options you can pass to the effects:\n\n- duration: the number of\
    \ seconds the transition will take (default 1.0)\n- fps: target frames per second\
    \ rate (default 25)\n- transition: an algorithm for determining how to move from\
    \ the starting point to the ending point. These are represented as a series of,\
    \ essentially, enumerated constants. Can be one of:\n  - sinusoidal: start slow,\
    \ peak in the middle, slow down on the way out\n  - linear: constant speed from\
    \ start to end\n  - reverse: constant speed, but from end to end\n"
  mdcn: "\nPrototype 引入了 `Insertion` 类。`Insertion` 允许我们向现有容器添加信息，而不会替换列表中现有的内容。`Prototype.Top()`\
    \ 将新数据插入到容器的开头，而 `Insertion.Bottom()` 则将其插入到末尾。这意味着你可以轻松地向列表追加单行，而无需重新渲染整个列表。\n\
    \n```html\n<ul id=\"mylist\">\n  <li>one</li>\n  <li>two</li>\n  <li>three</li>\n\
    </ul>\n<input type=\"text\" id=\"newval\"/>\n<input type=\"button\"\n  onclick=\"\
    new Insertion.Bottom('mylist', \n    '<li>\\'' + Element.get(\\'newval\\').value\
    \ + Element.get(\\'newval\\').value + \\'</li>\\');');\"/>\n```\n\n请记住，你拥有想要渲染的完整值。在示例中，我们将输入字段的文本值添加到列表的底部。我们必须将其封装在\
    \ `<li>` 标签中，以便将其渲染为列表项；如果没有这些标签，新值将作为文本粘贴在列表内部，渲染时不会有项目符号，且以内联文本的形式显示。\n\nPrototype\
    \ 实际上更进了一步，还允许你在容器周围添加文本。总而言之，`Insertion` 为你的新数据提供了四种位置：`Before()`、`Bottom()`\
    \ 和 `After()`。下一页的图 6.1 展示了每个方法的位置。\n\n这非常强大，因为你可以修改一个没有 ID 的页面部分（或者可能根本没有 ID）。\n\
    \n## 表单 (Forms)\n\n在历史上，处理表单一直有点费劲。表单只有一个用途：从用户那里收集数据。表单上的输入字段虽然样式各异，但在本质上是完全相同的。它们代表了用户可以使用来告诉我们某些信息的项目。在\
    \ Ajax 出现以及它带来的 DOM 重新思考之前，我们必须像处理其他 HTML 元素一样处理表单和输入，通过遍历 DOM 来找到它们，修改它们的样式属性来影响它们的行为。\n\
    \nPrototype 使用工具以不同的方式思考表单。Prototype 不再鼓励将其视为一个嵌入了输入框的 HTML 块，而是鼓励我们将表单视为数据字段的集合。使用该库，我们可以在需要时同时操作表单上所有字段的属性，并像字段数组一样遍历它们，而不是作为\
    \ DOM 子树中零散的子节点。\n\n这种变化的载体是新的类 `Form` 和 `Field`。`Field` 提供了三个与 UI 相关的方法：\n\n\
    - select()：选择字段的当前值\n- focus()：将焦点移动到字段\n- activate()：`select()` 和 `focus()` 的组合\n\
    \n例如，你可以创建一个表单，某些字段始终可见，而第二组高级选项仅在用户请求时才显示。为了方便起见，你可能希望用户在字段显示后立即在最顶部的字段中输入，这可以通过\
    \ `activate` 实现。\n\n```html\n<form action=\"postback.jsp\" method=\"post\">\n\
    名: <input type=\"text\" name=\"firstname\"/><br>\n姓: <input type=\"text\" name=\"\
    lastname\"/><br>\n<a href=\"#\" onclick=\"Element.toggle('advanced_options');Element.activate('petname');\"\
    >\n高级选项\n</a>\n<div id=\"advanced_options\" style=\"display:none;\">\n宠物名: <input\
    \ type=\"text\" name=\"petname\"/><br>\n喜喜欢的颜色: <input type=\"text\" name=\"favoritecolor\"\
    />\n</div>\n```\n\n## 注意 Before 和 After\n\n不要过度沉溺于 `Before()` 和 `After()`。虽然每个方法都能让你乐意地在合适的位置插入纯文本或可渲染的标记，但你不能用它们在现有项目周围创建新的容器。要这样做，你必须执行两个独立的语句：用于起始标签的\
    \ `Insertion.Before()` 和用于闭合标签的 `Insertion.After()`。现代 DOM 渲染引擎不允许你向文档添加格式不正确的\
    \ XML。因此，包含起始标签的第一次调用将在你传递的值末尾插入一个匹配的闭合标签。第二次调用将直接从输入中剥离闭合标签。\n\n假设你有一个包含新标题标签的元素，你想用一个新的\
    \ `<div>` 包围它。你的代码看起来像下面所示：\n\n```html\n<ul id=\"mylist\">\n  <li>one</li>\n \
    \ <li>two</li>\n  <li>three</li>\n</ul>\n<input type=\"text\" id=\"newval\"/>\n\
    <input type=\"button\" value=\"Add Item\" onclick=\"wrapList('mylist')\">\n<script\
    \ type=\"text/javascript\">\n  function wrapList(list) {\n    Insertion.Before(list,\
    \ '<div><h2>New Title</h2>');\n    Insertion.After(list, '</div>');\n  }\n</script>\n\
    ```\n\n当你执行此操作时，渲染后的 DOM 树（你可以通过查看源代码看到）将是这样的：\n\n```html\n<div><h2>New Title</h2></div>\n\
    <ul id=\"mylist\">\n  <li>one</li>\n  <li>two</li>\n  <li>three</li>\n</ul>\n\
    ```\n\n### 内联元素 (In-line elements)\n\n| Before | 标签 | Top | 内部数据 | Bottom | 闭合标签\
    \ | After |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n\n### 块级元素 (Block\
    \ elements)\n\n| Before |\n| :--- |\n| 换行 |\n| 标签 | Top | 内部数据 | Bottom | 闭合标签\
    \ |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 换行 |\n| After |\n|\
    \ :--- |\n\n![](img/5a8d35ff7a4bc7457620e1de97c104.png)\n\n## 位置 (Position)\n\n\
    Prototype 包含了几种获取当前位置的方法。具体来说，它们允许获取偏移量（水平或垂直）。效果的种类从简单的隐藏和显示技巧到拖放。\n\n## 效果 (Effects)\n\
    \n该库分为五个核心效果以及构建在它们之上的系列组合效果。核心效果有：`Opacity`（透明度）、`Highlight`（高亮）、`MoveBy`（移动）、`Scale`（缩放）和\
    \ `Parallel`（并行）。每个效果都代表随时间发生的两个状态之间的过渡。效果具有起点和终点的默认值，以及时长。这些默认值可以被覆盖。不同的效果具有不同的参数（例如\
    \ `MoveBy()` 需要 x 和 y 偏移），每个效果都可以接受标准选项。启动效果的通用语法为：\n\n```javascript\nnew Effect.EffectName(element,\
    \ required-params, {options});\n```\n\n效果都是异步的，这意味着如果同时启动，它们将同时渲染。无论效果针对的是不同的元素还是同一个元素都是如此。快速的用户不会因为你的\
    \ `<div>` 变成黄色并放大两倍而崩溃，你可以根据需要淡出列表中删除的项目。\n\n本节将检查库中核心效果的所有可能用法。在第 7 章 Ajax UI\
    \ 第二部分第 115 页，我们将学习如何有效地使用它们来提高用户界面的可用性。尽管这些效果很酷，但可能会被过度使用而变成另一个 `<blink>` 标签，因此知道何时使用它们与知道如何使用同样重要。\n\
    \n传递给效果的标准选项有：\n\n- duration：过渡持续秒数（默认 1.0）\n- fps：目标每秒帧率（默认 25）\n- transition：决定如何从起点移动到终点的算法。这些表示为一系列本质上是枚举常量。可以是之一：\n\
    \  - sinusoidal（正弦波）：开始慢，中间快，结束时减慢。\n  - linear（线性）：从起点到终点匀速。\n  - reverse（反转）：匀速，但从终点到起点。\n\
    \n"
