    ## 用于 UI 的 AJAX 和 JavaScript


    我们现在有了更大的共同基础。那种必须为简单的 CSS 样式编写特定浏览器渲染代码的时代已经过去了。我们现在有了更广泛的可接受的 UI 技术范围，这些技术可以在任何地方运行。这种共同基础消除了对大量特定浏览器的
    JavaScript 和 CSS 的需求，使得富客户端应用程序的开发变得更加简单且易于实现。


    此外，当我们那时开发 DHTML 应用时，并没有享受到通用 `XMLHttpRequest` 支持的红利。IE4 将其作为 ActiveX 组件内置在其中，但这很难被认为是通用的。Justin
    记得在 1999 年向那些固执的 Windows 开发者提到过它，结果却换来了许多异样的目光，因此，即使对于那些可以使用该功能的开发者来说，它也没有被广泛使用。由于缺乏返回到服务器的异步嵌入式通道，DHTML
    应用仅仅是些弹出窗口（pop）和动画（flash）。它们本身对可用性的改进微乎其微，而且如果我们想让它们与服务器进行通信，最终往往得费费巨大的周折。


    想一下那些无处不在的 DHTML 组件，比如树形导航。编写基于 HTML 的树形很容易。我们发明了几个 CSS 样式，使用了 `onclick` 事件处理程序并祈祷好运，但这并没费什么精力。作为回报，我们得到了可折叠、可扩展的树形导航。我们没有得到的（除非投入无数的精力）是一种在不重新加载整个树的情况下从服务器更新树的部分的方法。因此，我们最终把树放在一个框架里，让它孤立存在，并在应用需要的时候刷新它。这导致了
    JavaScript 代码的编写非常痛苦，用户体验也不够理想。


    我们甚至大到发明了 `iframe` 来允许我们执行后台线程操作。正如之前提到的，`iframe` 是一种方便的非标准方式，可以向服务器发送次级请求。JavaScript
    可以修改 `src` 属性来导致发布新请求。乍一看，这似乎提供了所有功能。但深入研究，你会发现一些问题。框架没有提供任何优雅的方法来检查请求状态；一旦触发，`iframe`
    要么渲染结果，要么不渲染。其次，`iframe` 会自动渲染服务器返回的响应。如果响应不是 HTML，则必须以 DOM 风格导航 `iframe` 以检索结果。所有这些方法虽然有效，但并不高效，而且绝不优雅。


    对 UI 部分进行细粒度控制的能力，只有当我们对从服务器获取的数据也进行进行类似的细粒度控制时，才会变得深远。能够在用户鼠标悬停在 `<div>` 标签上时闪烁背景颜色是很漂亮的；能够在用户向文本框输入内容时自动更新文本框则是真正的可用性改进。控制后者的
    UI 代码难度并不比前者更高级；它的特殊之处在于能够通往服务器的异步访问以获取更多信息。


    ## Ajax 鼓励使用面向对象（OO）优于 DOM


    从 HTML 到 Ajax 最大的变化在于我们对浏览器中 JavaScript 代码的思考方式。在旧的 HTML 中，我们编写 JavaScript 来操作
    DOM；我们将 DOM 视为一个巨大的“愚笨实体”仓库，每个实体都附加了一系列样式。我们用噩梦般的在 DOM 中穿行的：


    ```

    element.parent.sibling.child

    ```


    样式代码，并且当我们到达那里时，我们设置文本属性以将其解释为渲染引擎中的样式变化。我们将通用代码写成一系列函数，缺乏组织的类或约定。这些内容没有任何一个看起来像我们编写的服务器端代码；它在任何方面都不显现代。JavaScript
    只是我们“正职工作”的辅助品，这一点显而易见。


    Ajax 致力于将浏览器中的 JavaScript 视为它可以成为的一等编程环境。我们不再编写过程化程序，而是编写类库来封装我们的行为。不再将 DOM 视为愚笨元素的集合，而是将其视为类型的层次结构。不再将它们看作是待构造和解析的字符串，而是将其看作待修改的对象属性。我们编写现代的面向对象代码，配备错误处理、实例方法、静态方法和类型层次结构。


    更棒的是，我们使用比我们在服务器上使用的静态类型语言更具表现力的语言来编写这些现代面向对象代码。通过 JavaScript，我们可以在不修改基础代码的情况下扩展类型。如果我们想给
    `document` 对象添加功能，我们可以声明一个新函数并为其提供一个匿名定义。这个新函数可以完全访问 `document` 的实例数据，并被我们 JavaScript
    中包含的任何其他类型调用。函数可以像数据对象一样到处传递，在不知道源自实例的情况下被调用。换句话说，这是不需要额外反射语法的元编程。


    我们说 Ajax 鼓励这种编程风格。然而，Ajax 本身并没有什么强制要求这种做法。你完全可以乐意地编写旧的过程化的、DOM 导向的 JavaScript
    代码并实现效果。尽管如此，Ajax 周围涌现的框架都在积极追求更现代的、面向对象的编程风格。它们提供了常用的 API 和类型，通过它们修改 DOM 中元素的外观和行为。它们还为特定元素提供了更好的
    DOM 导航方法。通常，这些框架实现了面向对象的库和元编程。例如，Spectacular 库为 DOM 模型根部结的 `document` 对象添加了一个新方法
    `getClassName()`。通过将此方法注入到现有的类中，我们获得了一种更方便的方法通过面向对象的方法导航我们的 DOM 树。


    ## 常用 UI 框架


    随着 Ajax 术语的出现，JavaScript 库随之爆发，以帮助用户更好地利用这一技术转变。这些库没有让用户在沙漠中自己寻找道路，而是极大地缩短了 Ajax
    的学习和适应曲线。我们已经在上一章中讨论过它们了；在这里，我们关注它们对 UI 所起的作用。


    '
