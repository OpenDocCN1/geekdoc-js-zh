    \ 快捷方式\n\n幸运的是，DOM API 包含了一些快捷方式。Document 对象有一个 `getElementsByTagName()` 方法，这在我们的示例中可以派上用场。考虑这个替代函数：\n\
    \n```javascript\nfunction modifyPage() {\n  var divElements = document.getElementsByTagName(\"\
