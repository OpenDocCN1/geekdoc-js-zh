    # More Than A Million Pixels


    We say in "The Map" section that a street-level map of the world would be about
    a million square pixels. Actually, that number''s a wild underestimate. At Google''s
    highest level of magnification, a square mile consumes about 7,700,000 pixels.
    The Earth is estimated to contain 200,000,000 square miles, but only 30% of that
    is land, so let''s reduce the number to 60,000,000 square miles.


    Multiplying the number of pixels by the number of square miles in the Earth produces
    the mind boggling number of 462 million pixels, which at 16.7 million colors (the
    color depth of any modern home computer) would consume at least three times that
    amount of memory in bytes. Of course, most image viewing programs have some sort
    of paged memory subsystem that views a portion of the image at any one time, but
    you get the idea...


    ![](img/5a8d358ff7a4bc74757620e01fde970c_47_0.png)


    Figure 4.2: Google Maps Tiles'
  - '[PAGE 48]


    in memory and only displays the set of tiles that the user can see, in addition
    to a few additional tiles outside of the viewing area to keep the scrolling smooth.


    If this whole grid virtualization mishash sounds a little complex, don''t worry,
    it''s fairly straight-forward, though it is the most complicated bit of the UI.


    # Zoom Level


    Another key feature of Google Maps is the ability to zoom in and out, enlarging
    or reducing the size of the map, letting you get a view of the entire world at
    one moment, and a view of your street the next. This is actually the simplest
    of the features to implement. Changing the zoom level changes the size of the
    tile grid in memory as well as the URLs of the tiles that are requested.


    For example, the URL to one of tiles in the screen is http://mt.google.com/mt?v=w2.
    By changing the value of the last parameter, "zoom=3", to another value, such
    as "zoom=1", you can retrieve a tile at a different level. In practice, it''s
    not quite simple because the grid coordinates change rather a great deal with
    each zoom level and they often become invalid.


    How do they get the zoom to constantly hover over the map in a constant position?
    The zoom level widget is an image embedded in the outer div, and makes use of
    transparency to blend in with the map image.


    # Push Pins and Dialogs


    Another neat-o feature is the push pins and dialogs that appear after a search.
    Figure 4.3, on the following page shows a screenshot with these elements present.
    These are especially cool because they both include these rounded edges and shadows
    that make them blend in with the background map in a sophisticated fashion.


    We said the zoom level was the easiest feature, and frankly, we were probably
    wrong. This is ridiculous. The push pins and dialogs are simply a PNG image. The
    PNG image format is supported by the major browsers and supports a feature called
    alpha transparency. Alpha transparency allows for more than just the simple transparency
    that GIF images support; it allows a pixel to be one of 254 different


    ![](img/5a8d358ff7a4bc74757620e01fde970c_48_0.png)'
  - '[PAGE 49]


    ![](img/5a8d358ff7a4bc74757620e01fde970c_49_0.png)


    Figure 4.3: The Google Maps Push Pin and Dialog


    in-between-fully transparent and fully opaque, and this gradient transparency
    support that allows the push pins and dialog to use a shadow that blends with
    the map.


    Showing these features is simply a matter of positioning images in the inner div
    at an absolute position.


    # Feature Review


    There are other features, of course. But we''ll stick to the set of features we
    have enumerated; we think these represent the vast majority of the "ooh, ah" factor.
    In review, they were:


    +   **The scrolling map.** This is implemented as an outer div containing an inner
    div. Mouse listeners allow the inner div to be moved within the confines of the
    outer div. Tiles are displayed as image elements inside the inner div, but only
    those tiles necessary to display the viewing area and a buffer area around it
    are present in the inner div.


    +   **The zoom level.** This is an image embedded in the outer div. When clicked,
    it changes size of the grid representing the tiles.'
