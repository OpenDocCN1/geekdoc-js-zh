    \ will take.\n- acceleration: whether the animation is accelerating or decelerating\n\
    - repeatCount: number of times to repeat (-1 means forever)\n\nA curve is just\
    \ an object that exposes a method, getValue(n), where n is a number between 0\
    \ and 1. Dojo provides multiple implementations of curves. They range from the\
