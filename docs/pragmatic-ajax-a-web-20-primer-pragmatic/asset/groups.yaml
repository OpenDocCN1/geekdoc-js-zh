    When a user arrives at an Ajaxified page, the URL that appears in the address
    bar is whatever they typed in or clicked on to get there. When a bookmark is added
    to a browser, it makes a copy of the current address in the address bar. If the
    page has allowed the user to progress through tens or hundreds of interactions,
    the URL in the address bar is exactly the same as it was for the initial request.
    A user who navigates to the bookmark will always end up at the original state
    of the page; Ajax-based changes will be long forgotten.


    Once again, we are faced with the distinction between a major topic area of the
    application vs. a minor shift in focus. Users will accept certain limitations
    on their bookmarking ability; for example, most people don''t expect to be able
    to bookmark a page halfway through the check-wizard at an ecommerce site. Clearly,
    users have to learn the difference between static pages and stateful processes
    which can''t be snapshotted. Developers now have to come to the same realization:
    what transitions can I encapsulate in a non-bookmarkable process, and what requires
    page transitions in order to allow pause-and-resume behavior?


    # GET is for Getting, POST is for Doing


    In the world of HTTP, browsers communicate with servers using (typically) either
    GET or POST requests. A GET request is generated whenever you click on a hyperlink;
    the idea is that it gets the next page. A POST request is sent when you hit the
    submit button on an HTML form. It posts the data from that form back to the application
    for processing.


    In 2005, the team that created Basecamp (and Ruby on Rails) learned this valuable
    lesson: GET is for getting things, POST is for doing things. The HTTP specification
    is pretty specific on this topic. GETs are for retrieving data. POSTs are for
    interacting with the server in a way that might change server state. When you
    avoid the recommendations of a specification, bad things can—and often do—happen.
    Their public tuss with this issue serves as a cautionary tale for the rest of
    us: if these kinds of issues can affect the best and brightest, we need to be
    extra careful in our applications to avoid similar problems.'
  - '[PAGE 139]


    Basecamp''s problem was that, at the time, the default method for creating links
    back to the server with Rails was a GET. It didn''t matter what the link was doing:
    redirecting to a new page, reading a record, deleting a record. Then, Google released
    the Google Accelerator. The Google Accelerator installs in your browser and redirects
    requests through Google''s servers. If Google has already cached the page version,
    speeding up your access time, you''ll be rewarded with it cached. If the page
    has not been cached, then the request is forarded as normal. Google Accelerator
    walks all the links off of the returned page, caching it and all of its sub pages.


    For an application whose controls are all provided as simple GET-method links,
    Google Accelerator becomes the most efficient destructive force imaginable. Think
    of it as the Terminator of web apps. It is single-minded: fire to every link on
    the page. It is efficient. And it absolutely will not stop until your app is dead.


    37signals didn''t realize there was a problem until data disappearing from the
    Basecamp database. As users began reporting that their data was mysteriously missing,
    the team finally realized that the common thread was Google Accelerator. Normally,
    such a thing wouldn''t be a terrible problem. After all, Google''s indexing worms
    essentially the same path; find a page, navigate to all the endpoints, cache.
    But with Google Accelerator, the worm finally has access to information it has
    never had before: your username and password. Navigate to your Basecamp account,
    for example, and log in. The Accelerator can now follow all the links on your
    private page. It then clicks everything it, as fast as possible. And some of those
    links are labeled *Delete Item*.


    The solution was to change their framework, Rails, to create POST-method links
    for updates. They did this by creating a second view helper in `link_to()` that
    creates a `<form>` element to surround a button. The parameters are embedded as
    hidden `<input>`. The `<form>` is set to POST as its method. Now, your update-related
    links don''t fail to the Accelerator.


    When you Ajaxify an application, the temptation to write pages this way is strong.
    You present your user with a list of items. You want them to be able to add new
    or delete existing ones from the page without a refresh. So you add a link to
    the bottom, *New Record*. Embedded in each item on the list is a link called *Delete*.
    You use a simple GET with an URL like this: http://www.mydomain.com/my/app/delete?recid=545.
