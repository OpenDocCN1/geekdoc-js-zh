    \ combines BlindUp and Shrink to get the appearance that the item is folding up.\
    \ First, shrinks the element vertically, then horizontally, down to 0.\n\n## Advanced\
    \ Techniques\n\nScript.aculo.us provides a series of more advanced techniques,\
    \ such as Drag And Drop and sorting capabilities. We'll examine these in the next\
    \ chapter.\n\n## Dojo\n\nDojo is a different kind of animal than Prototype and\
    \ Script.aculo.us. Whereas of those libraries are smaller, and more focused on\
