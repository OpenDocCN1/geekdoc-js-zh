    Goodbye, world!\"),\n        divElement.childNodes[0]);\n}\n```\n\n更容易接受。但是，我们仍然面临脆弱的顺序问题。我们假设感兴趣的\
    \ `<div>` 元素总是相对于其他 `<div>` 元素处于相同的位置。在我们平凡的示例中，这个假设是安全的，但在现实世界中，这完全无效。\n\n我们真正需要的是一种轻松引用网页中特定元素的方法。当浏览器将此\
