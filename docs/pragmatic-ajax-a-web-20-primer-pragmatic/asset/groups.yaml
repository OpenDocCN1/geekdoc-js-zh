    Error: \" + error.message;\n    return true;\n}\n```\n\n最后一块拼图是再次封装 `getZipData()`\
    \ 以连接到我们的对象：\n\n```javascript\nfunction getZipData(zipCode) {\n    obj.get_city_state(zipCode,\
    \ assignCityAndState);\n}\n```\n\n## 返回丰富类型 (Returning Rich Types)\n\n我们提到过 XOAD\
    \ 能够处理比 Sajaj 更丰富的类型。让我们更改代码来尝试一下。为了做到这一点，我们将 `get_city_state()` 修改为返回类型为 `ZipCityState`\
    \ 的对象。这是一个包含了所有必要数据的结构，而不是一个需要在你在客户端进行解析的字符串表示。\n\n`ZipCityState` 结构是一个简单类型。我们只需要给它提供一些公共变量，以存储和检索我们的数据。更好的是，我们可以为数据使用访问器（accessors）和变异器（mutators）。\n\
