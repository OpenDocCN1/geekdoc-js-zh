    \n图 7.4：自动补全演示\n\n## 7.2 这并不仅仅是鲜花和阳光……\n\nAjax 是奇妙的。它为 Web 向你的用户开发和交付应用程序开启了全新的方式。在很大程度上，它将使用\
    \ Web 应用的体验从“阅读”转变为“使用”。作为长期的讲师和培训师，我们亲身体会了交互在保持学生投入和快乐方面的巨大价值。同样的现象也适用于应用程序。如果你的应用程序是被动的，让你的用户成为被动的消费者，那么应用程序将无法吸引用户的注意力。然而，交互式版本具有激发人心的力量。\n\
    \n尽管 Ajax 具有这种从根本上改变 Web 的力量，但我们所有开发者都要记住为什么 Web 能获得如此广泛的接受。它是基于某些标准（技术和视觉），这些标准让各种背景的用户都能利用那里提供的服务。这些标准（有些是书面规定的，有些仅仅是约定）对于所有\
    \ Web 应用程序的成功至关重要，无论它们是否使用 Ajax。\n\n成功的 Ajax化的关键在于不要忽视重要的约定。某些“土地法则”让 Web 变得如此流行和易于访问，这是其他应用程序和技术所无法比拟的。当你将这项新技术引入应用程序时，要兼顾战术和战略地考虑。问问自己以下问题：\n\
    \n- “我是在增加应用程序的可用性，还是在增加简历的长度？”\n- “它是否打破了用户根深蒂固的习惯？”\n- “价值是否值得这种打破给用户带来的认知失调？”\n\
    \n从战术上讲，这种变化可能会增加此页面的可用性，但从战略上讲，可能会降低整个应用程序的可用性。\n\n我们将介绍一些需要注意的最主要的反模式。这个列表并不是详尽的。当你对正在工作的某件事有疑问时，请对照我们上面的“气味测试”问题进行检查。并记住，关键是可用性和功能：如果它能同时提高这两者，那就尽管去做！\n\
    \n## 注意那个后退按钮！\n\n两件事让万维网与它之前的一切事物区别开来：后退按钮、书签。从历史上看，应用程序是引导式之旅。用户被鼓励按照提供的信息遵循某些路径。在最好的情况下，用户可以搜索特定的项目或屏幕并直接导航到那里。如果他们离开了，返回的唯一方法是重新运行搜索。即使如此，这对于一个应用程序来说也是一个相当罕见的功能。考虑一下\
    \ 1998 年左右的 Quicken，或者我们所有在 96 年购买的那些多媒体百科全书；它们有目录和搜索功能，但没有你操作历史的概念。\n\n后退按钮不仅仅是一个按钮；它是自由的象征。意味着你脱了引导式之旅的束缚。你可以在指尖的信息中开辟自己的路径，并可以从地回溯自己的足迹。你变成了应用程序的主人，而不是相反。不信？进入浏览器关闭导航栏，看看你能坚持多久而不再次打开它。\n\
    \n记住这一点，现在想象后退按钮实际上是如何工作的。浏览器的默认行为是在下载时缓存页面。显然，这可以在浏览器或服务器级别被覆盖，但默认是创建一个本地缓存。只有从服务器下载的页面原始状态会被缓存。如果客户端\
    \ JavaScript 对 DOM 进行了任何修改，这些更改完全不会反映在缓存中。相反，如果页面已缓存，后退按钮只是向服务器发送一个新请求，服务器将会返回原始状态的页面。这一切的实际结果是，当用户离开你的页面并返回时，你所有的\
    \ Ajax 效果都会丢失。\n\n情况比表面看起来还要糟糕；查看页面是否具有值在解析时确定的元素，那些值将与页面其他部分一起缓存。点击后退按钮通常会在可能的情况下从缓存加载：元素将包含过过的值，因为服务器端的解析从未再次进行。在那时，只有当用户手动刷新页面时，新值才会出现。\n\
    \n应用程序的设计者有责任区分信息检索和导航。当用户想要继续操作时，他们通常希望后退按钮将他们带回之前的地方。这是因为目录被强加到与文章相同的语境中。或者，想象同一份报纸，但目录的链接以\
    \ Ajax 方式运行。点击文章标题会替换目录。在文章中向前和向后导航也通过 Ajax 实现。当用户现在点击后退按钮时会发生什么？他们没有回到目录，而是回到了他们之前的网站。这看起来相当自然。\n\
    \n## 书签让 Web 运转\n\n书签是后退按钮的亲密兄弟。它是用户控制的浏览行为的元历史。书签首页（欢迎页）现在比过去没那么有用了。有了 Google\
    \ 作为我们的共享书签，大多数人不再懒于书签首页了。只需运行到 Google，输入页面名称并点击结果即可。相反，我们使用书签来进行深度链接。深度链接意味着用户有能力暂停并返回你的应用程序。如果状态得到了维护（Cookie、长期会话、后端存储等），并且用户可以指定从应用程序流程中的任何位置恢复工作，他们就不会被束缚在你的时间表上。\n\
    \n"
