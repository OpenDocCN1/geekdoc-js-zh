    Ajax requests easy.

    - dojo.event: Browser compatible event system.

    - dojo.lang: Support for mixins, and object extension.

    - dojo.graphics: Support for nifty HTML effects (e.g. fadein/Out, slideTo/By,
    explode/implode, etc.).

    - dojo.dnd: Drag and Drop support.

    - dojo.animation: Create animation effects.

    - dojo.hostenv: Support for JavaScript packages (think imports/includes of having
    to create script src...")


