  - "[PAGE 28]\n\n# JavaScript, booleans, and You\n\nSpeaking of booleans, JavaScript\
    \ can evaluate numbers and strings as booleans, too: any non-empty string and\
    \ any non-zero number evaluate to true.\n\nin line 3 or, as in mySumTotal = myVariable\
    \ + myOtherVariable, an error would be thrown.\n\nFor this reason, we consider\
    \ it good style to use the optional var keyword when declaring variables: this\
    \ makes it explicit whether a variable was intended to be declared or whether\
    \ a declaration is a probable type. With var, the example looks as follows:\n\n\
    ```\nvar myVariable = 10\nvar myOtherVariable = 20\nvar mySumTotal = myVariable\
    \ + myOtherVariable\nmyVariable = 5\nmyOtherVariable = 10\nmySumTotal = myVariable\
    \ + myOtherVariable\n```\n\nJavaScript supports four basic types of values: object,\
    \ number, string, and boolean (there are some others, but they aren't important\
    \ just now). Unlike most other languages, JavaScript variable declarations do\
    \ not declare the type of data they store. Rather, the type is determined automatically\
    \ based on what has been assigned to the variable and the type of expression in\
    \ which the variable is used. What's more, JavaScript variables change their type\
    \ automatically as necessary. Consider the following examples:\n\n```\nmyVariable\
    \ = \"What am I? Who made me\" // a string\nmyVariable = 42 // now a number\n\
    myVariable = 42 + \"The answer\" // a string (\"42The answer\")\nmyVariable =\
    \ true // a boolean\n```\n\n# Functions\n\nOn the surface, functions in JavaScript\
    \ work as they do in any other language. They are declared with the keyword function(),\
    \ they can take zero or more parameters, and they can return values:\n\n```\n\
    function addNumbers(one, two) {\n  return one + two;\n}\n```"
  - "[PAGE 29]\n\n# Undefined\n\nThe undefined value is a first-class type in JavaScript.\
    \ Most commonly, it is the value provided by JavaScript for a variable that has\
    \ been declared, but whose value has never been assigned. Some JavaScript implementations\
    \ also use it for the value of variables that have never been declared, though\
    \ this is less common, since most JavaScript interpreters allow for in-line variable\
    \ declaration.\n\nIt is important to note that it isn't merely a value. Though\
    \ it has a string representation ('undefined'), it is actually a first-class type.\
    \ This means that the typeof() operator, when applied to a variable with this\
    \ value, will return Undefined.\n\nJava/C# developers may find it odd that no\
    \ return type returns a value, it simply uses the return() keyword at some point.\
    \ It is perfectly legal to create functions that branch and return a value in\
    \ one path but not in another. Variables that are assigned the result of a non-returning\
    \ function contain the special JavaScript value undefined.\n\nConsider this next\
    \ example snippet:\n\n```\nfunction myFunction(a) {\n  return \"Hello\";\n}\n\
    function myFunction() { // <label=code.js4.function>\n  return \"World\";\n}\n\
    var myResult = myFunction(\"aValue\"); // <label=code.js4.return>\n```\n\nWhat\
    \ do you suppose the value of myResult on line is? If you use a language that\
