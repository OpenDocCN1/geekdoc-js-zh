    \n## 从后向向前 (Back to Front)\n\n我们像处理 Sajax 一样，从客户端开始。我们加载了我们需要的所有内容，并为所有 XOAD 定义了基础目录。在这种情况下，我们正在使用一个名为\
    \ 'najax' 的子目录。\n\n```php\ndefine('NAJAX_BASE', 'najax');\nrequire_once('najax/najax.php');\n\
    require_once('zipService.najax.php');\nNAJAX_Server::allClasses('ZipServer');\n\
    if (NAJAX_Server::runServer()) {\n    exit;\n}\n```\n\n我们还将注册想要远程调用的类。这在技术上并不是必须的，但被认为是一种礼貌的做法。XOAD\
    \ 维护着两个类哈希表，一个用于允许类，另一个用于拒绝类。在拒绝的类上调用方法会导致错误；对允许或未分配方法的调用将继续。然而，为了符合建议的用法，我们将使用\
    \ `XOAD_Server::allowClasses()` 向 XOAD 注册 `ZipServer` 类。\n\nXOAD 设置 XHR 请求返回同一个\
    \ PHP 服务器意味着我们的 PHP 页面以两种模式被访问：一种是显示主页面，另一种是访问回调函数。`XOAD_Server::runServer()`\
    \ 中的检查是为了处理 XHR 请求；如果请求不是 XHR 回调，它将立即返回 `false`。否则，该方法将根据请求参数触发绑定的服务器方法并返回结果。\n\
    \n再次，我们很快就完成了 PHP 头部代码，并进入了 HTML 本身。我们需要包含所有的 XOAD 辅助 JavaScript 代码，这是在 HTML `head`\
    \ 元素顶部完成的：\n\n```php\n<?= NAJAX_Utilities::header('najax') ?>\n```\n\n## XOAD\
    \ 序列化器 (XOAD Serializer)\n\n此时，XOAD 使用一个序列化对象来以便能够转换这两个世界。我们在 PHP 5.1 上运行时发现了一个问题，并且不得不更改\
    \ `Serializer.class.php` 文件，将 `function serialize(&$var)` 变为 `function serialize($var)`（即我们删除了引用符号\
