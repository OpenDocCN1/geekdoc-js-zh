    \  transition: Effect.Transitions.linear });\n```\n\nYou can also choose the end\
    \ color (endcolor) and the final color to use after the fade (restorecolor) if\
    \ you need to.\n\n## Auto Update\n\nOne of things that often sets traditional\
    \ thick clients apart from thin clients is the ability to quickly react to what\
    \ the user is doing. For example, there are lots of locally installed applications\
    \ that can react to what a user is doing, and make intelligent guesses about how\
