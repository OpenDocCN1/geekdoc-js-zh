  - "[PAGE 131]\n\n# Auto Update\n\nOne of things that often sets traditional thick\
    \ clients apart from thin clients is the ability to quickly react to what the\
    \ user is doing. For example, there are lots of locally installed applications\
    \ that can react to what a user is doing, and make intelligent guesses about how\
    \ to complete the word(s) for the user. Google (once again) showed that the same\
    \ thing could be accomplished on the web with Google Suggest. This feature has\
    \ come to be known as autocomplete.*\n\nScriptacular provides an amazingly simple-to-use\
    \ version called the AutoCompleter. It watches an input field and sends some parameter\
    \ of the name to register server endpoint. The results are rendered in another\
    \ container node, allowing the user to choose from the results. The whole effect\
    \ can be achieved with the addition of one container, one of JavaScript and a\
    \ little simple CSS.\n\nLet's add this feature to the sample CRM application.\
    \ We will prompt the user with potential zip code matches based on what they are\
    \ typing in the zip field. As they type into the zip field, we'll compare against\
    \ the list of available zip codes, and return those that are potential matches\
    \ (the ones that start with the characters entered so far).\n\nLet's start with\
    \ a servlet that implements the auto completion feature. Any reasonable production-quality\
    \ version would use a database of zip codes, and the SQL \"SELECT x WHERE zip\
    \ LIKE %y%\" notation to retrieve values. To keep it simple for the sake, the\
    \ servlet will just keep an array of strings to compare against. Here's the\n\n\
    ```\npackage ajaxian.book.crm.servlet;\nimport javax.servlet.http.HttpServlet;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    import javax.servlet.http.ServletConfig;\nimport java.io.PrintWriter;\nimport\
    \ java.io.IOException;\nimport java.util.Iterator;\nimport java.util.ArrayList;\n\
    \npublic class AutoCompleterServlet extends HttpServlet {\n    public void doPost(HttpServletRequest\
    \ request, HttpServletResponse response) \n    throws Exception {\n        System.out.println(request);\n\
    \        String[] args = new String[]{\n            \"10010\", \"10205\", \"27707\"\
    , \"31000\", \"32230\", \"34434\",\n            \"45555\", \"46666\", \"46785\"\
    , \"46699\", \"49999\", \"53711\", \"53703\";\n        };\n        ArrayList results\
    \ = new ArrayList();\n```"
