    \ it when we show the entire page in just a few paragraphs. (Or, you can see it\
    \ by visiting http://www.ajaxian.com/pragajax/code/maps/XXX.html).\n\nThe call\
    \ to Math.floor() will round the quotient to an integer, discarding the remainder\
    \ (1.4 will be rounded down to 1). This will cause partial tiles to be displayed.\
    \ Math.abs() converts values to positive number, which in our case is necessary\
    \ as the inner div position will nearly always be negative to the outer div, whereas\
    \ the columns/rows are always positive numbers. Finally, we subtract one from\
    \ the result to make our map load the touch easily for smoother effect.\n\nThe\
    \ final bit of calculation is to determine the number of rows and columns that\
    \ are visible in the viewport:\n\n```\nvar tileX = Math.ceil(viewportWidth / tileSize)\
    \ + 1;\nvar tileY = Math.ceil(viewportHeight / tileSize) + 1;\n```\n\nAs with\
    \ tileSize(), we'll declare both viewportWidth and imageHeight as global variables\
    \ and show that in just a bit. We use Math.ceil() (it rounds the quotient regardless\
    \ of size remainder), to ensure that if any portion of a column or row is visible,\
    \ we will display it. And, as we subtracted one from the index of the tiles in\
    \ the previous lines, we will add one to the number of columns and rows to make\
    \ the scroll smooth effect.\n\nWe now have all the data we need to calculate all\
    \ of the visible tiles in the viewport, plus as we've discussed, a few around\
    \ the edges that aren't immediately visible but will be shortly. Now we'll build\
    \ an array that contains all the tiles that need to be loaded. To build this array,\
    \ we'll write two loops, one nested inside the other, that perform an iteration\
    \ for each column and row that is currently visible. Inside each loop, we will\
    \ add the column and row number of each tile to display:\n\n```\nvar visibleTileArray\
    \ = [];\nvar counter = 0;\nfor (var x = startX; x < (tilesX + startX); x++) {\n\
    \  for (var y = startY; y < (tilesY + startY); y++) {\n    visibleTileArray[counter++]\
    \ = [x, y];\n  }\n}\nreturn visibleTileArray;\n```\n\nNote that we're actually\
    \ creating a two dimensional array, the value of each item in our array is another\
    \ array. We did this because we needed to pass back two values: the column and\
    \ row index. And now, we're calculating the tiles and work on the code to actually\
    \ display them. But first, let's view all of the code we've written so far:\n\n\
    ```\nfunction checkTiles() {\n  // check which tiles should be visible in the\
    \ inner div\n  var visibleTiles = getVisibleTiles();\n  // add each tile to the\
    \ inner div, checking first to see\n  // if it has already been added\n}\nfunction\
    \ getVisibleTiles() {\n  var innerDiv = document.getElementById(\"innerDiv\");\n\
    \  var mapX = stripPx(innerDiv.style.left);\n  var mapY = stripPx(innerDiv.style.top);\n\
    \  var startX = Math.abs(Math.floor(mapX / tileSize)) - 1;\n  var tilesX = Math.ceil(viewportWidth\
    \ / tileSize) + 1;\n  var tilesY = Math.ceil(viewportHeight / tileSize) + 1;\n\
    \  var visibleTileArray = [];\n  var counter = 0;\n  for (var x = startX; x <\
    \ (tilesX + startX); x++) {\n    for (var y = startY; y < (tilesY + startY); y++)\
    \ {\n      visibleTileArray[counter++] = [x, y];\n    }\n  }\n  return visibleTileArray;\n\
    }\n```\n\n## Displaying the Visible Tiles\n\nWe've now coded half of the checkTiles()\
    \ function, which as you may recall the function is responsible for both calculating\
    \ the visible tiles and displaying them. Now, let's implement the other half of\
    \ that function: displaying the tiles.\n\nAll we need to do here is to iterate\
    \ each element of the array of visible tiles we returned from the getVisibleTiles()\
    \ function, and for each array element, add a tile to the inner div. Here's the\
    \ new code for our checkTiles()\n\n```\nfunction checkTiles() {\n    // check\
    \ which tiles should be visible in the inner div\n    var visibleTiles = getVisibleTiles();\n\
    \    // add each tile to the inner div, checking first to see\n    // if it has\
    \ already been added\n    var innerDiv = document.getElementById(\"innerDiv\"\
    );\n    for (var i = 0; i < visibleTiles.length; i++) {\n        var tileArray\
    \ = visibleTiles[i];\n        var tileName = \"x\" + tileArray[0] + \"y\" + tileArray[1]\
    \ + \"z\" + tileArray[2];\n        var img = document.getElementById(tileName);\n\
    \        if (!img) {\n            img = document.createElement(\"img\");\n   \
    \         img.src = \"resources/tiles/\" + tileName + \".jpg\";\n            img.style.position\
    \ = \"absolute\";\n            img.style.left = (tileArray[0] * tileSize) + \"\
    px\";\n            img.style.top = (tileArray[1] * tileSize) + \"px\";\n     \
    \       img.setAttribute(\"id\", tileName);\n            innerDiv.appendChild(img);\n\
    \        }\n    }\n}\n```\n\nWe start out on line 8 creating a map (in the sense\
    \ of a hash that contains the values). We're going to add an entry to this map\
    \ for each tile that will be loaded. On line 9 we loop through the array we sent\
    \ back from getVisibleTiles(). For each element, we build the name of the image\
    \ file that will be loaded. (If you call it, the numbers are replaced with the\
    \ index of the grid.) We also use this name as the key in visibleTilesMap variable,\
    \ and on line 13 we check if we've already added a tile to the inner div.\n\n\
    Finally, in line 15 through 21 we create the <img> element and add it to the inner\
    \ div. Note that on line 16 we have to specify the URI of the image tile. If you\
