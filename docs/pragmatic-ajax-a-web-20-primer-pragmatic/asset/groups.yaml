- md: '

    # XHR in Detail


    Let''s talk about some of the other features of XHR that we haven''t covered thus
    far.


    ## States


    The onreadystatechange property is a key feature of XHR. It lets you register
    an asynchronous callback handler that will be invoked as the state of XHR changes
    during a request/response communication with a server. In the last chapter, we
    looked at the five possible states of the readyState property. Generally speaking,
    the important state is 4 (Completed). The other four states are all different
    shades of "incomplete".


    ## Headers


    In addition to expose somewhat granular information about its current, XHR also
    lets you modify or add HTTP headers in the request and view headers in the response.
    This is accomplished using the setRequestHeader(), getResponse(), and getAllHeaders()
    functions. In this example, we spoof the browser to send the XHR: `xhr.setRequestHeader("User-Agent",
    "My Custom Browser")`


    ## Response Data


    In the examples, we''ve used the responseText property to retrieve the response
    body from the server. There''s another property, responseXML(), that returns the
    response from the server as a DOM instance. This can be useful if you want to
    send structured data back to the web page from the server; you can use the DOM
    API to navigate through the data as XML and update the web page as appropriate
    based on that data.


    ## 3.4 Summary


    This chapter dives into the underpinnings of Ajax. You''ve seen the JavaScript
    language and DOM model up close and personal. Though it is certainly possible
    to write applications using only the constructs you''ve seen here, programmers
    generally tend to appreciate tools that give them more leverage. After we tackle
    implementing Google Maps, the next several chapters will look at the frameworks
    that have sprouted lately to make the gory details of DOM manipulation, event
    binding and node traversal disappear.


    # Chapter 4


    ## Creating Google Maps


    For many of us, Google Maps (http://maps.google.com) ignited the Ajax revolution.
    While ajaxian techniques were creeping into mainstream websites before Google
    Maps, nothing in recent memory presented commodity browsers with a visually impressive
    experience. Google Maps showed the world a wide world of potential that lay hidden
    in the technologies we thought we understood well.


    The purpose of this chapter is to lay bare the techniques Google used to woo us
    all with Google Maps. What we''ll discover here is fascinating and important;
    it might also be more than you want to bite off right now. If so, don''t worry
    about skipping ahead to the rest of the book and coming back here later; we won''t
    mind.


    ## 4.1 Rocket Scientists?


    Shortly after Google Maps launched, entrenched commercial interests who relied
    upon the staidness of standard HTML-based web interfaces to make money were quick
    to claim that mainstream HTML developers need not attempt to create web interfaces
    like Google Maps. The CEO of Macromedia, maker of the popular Flash browser plug-in,
    stated in least one interview that such non-Flash web interfaces required the
    skills of “rocket scientists.” (Ironically, when Macromedia finally produced a
    clone of Google Maps in Flash four or five months later, it failed to function
    on the two Mac laptops we used to try it—actually locking up the browser. Google
    Maps works just fine on both machines. We''re actually not anti-Flash; we just
    found it ironic, that''s all.)


    Such statements have added to the general impression many developers have that
    creating something like Google Maps is just, well, hard.


    In fact, some developers have even felt a little fear and intimidation—fear that
    someday soon, they''ll be asked to create something like Google Maps!


    Certainly many of us who have been writing HTML for years might like to believe
    that it took a team of rocket scientists to produce a litany of innovations supporting
    the technologies behind the Google Maps interface, if nothing else to provide
    an excuse as why we haven''t been writing apps like all this time. However, we
    believe all this business about rocket science and intimidation is a bit exaggerated.


