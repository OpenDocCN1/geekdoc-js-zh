    这一切将由一个完全出乎意料的实体提供。以下是一个开发团队的故事、那个火花，以及它如何改变我们处理 Web 软件的方式。


    ## 1.1 三幕剧


    Hector 是某家 Web 应用开发公司的项目经理。凭借在 Perl CGI、ASP、Servlet 和 JSP 开发方面的深厚背景，Hector 已经是个老兵了。在过去的一年里，他的团队为一家在全球各地设有办事处的世界
    500 强公司开发一个 CRM 应用程序。该应用程序曾是一个绿屏大型机程序；现在公司希望利用互联网的巨大覆盖范围，将应用程序部署到每个办公室。


    Hector 和他的团队将大量精力集中在应用程序的服务器端。他们一直使用 Java 社区的现代 MVC 框架之一来实现业务逻辑；使用一个高性能框架来访问数据库；以及使用基于消息的基础设施来连接其他现有系统。


    ## 昨天


    在客户端，Hector 和他的团队已经成为了 CSS 的大师。页面的外观完全听从他们的；当客户想要圆角时，他们就能得到圆角。悬停颜色？那轻而易举。多种色彩方案？不。事实上，Hector
    和他的团队早就达到了一种他们不再真正担心用户界面的程度。要知道，Web 是单向运行的：它本质上分发静态文档。当用户想要更多数据时，他们必须经历整个界面刷新。从效率角度来看这并非最优，但这就是
    Web 的工作方式，用户也学会了适应它。


    然后，在几周前的某次，Hector 的客户来参加会议。这位客户通常是一个礼貌、随和的同胞。他理解 Web，也理解为了获得互联网覆盖范围而必须接受的限制。事实上，Hector
    从未见过他真正发火。直到这次会议。


    他一一进门，团队就知道情况不妙。他带了笔记本电脑，而他以前从不随身携带。当他冲进房间时，团队环顾桌子：我们都干了什么？客户坐在桌子旁，打开笔记本电脑，在键盘上疯狂敲击了一分钟。当他用力点击按键时，他告诉团队：“昨晚，我跟我妻子受邀参加
    CEO 家里的一个派对。”

    “哦哦，”团队想，“这可没好结果。”


    “嗯，我当然抓住了这个机会，”他继续说道，“我以前从没去过。这个项目让我进入了他的视野。”（“双重哦哦，”Hector 想。）“当我无法用我的城市地图找到去那里的路时，我上了互联网。我发现了这个！”他在说出最后一个词时带着毒液和轻蔑。他转过笔记本电脑，让桌上的人都能看到。在那里，静静地躺在他的浏览器窗口里，是
    Google Maps。

    “为什么，”他咬着牙说，“我不能拥有这个东西？”


    ## 今天


    自从见面以后，Hector 和他的团队一直像火了了一样热于重新思考用户界面。Hector 出去了解这是怎么回事，Google 是如何完全忽略了常识并做出这种事情的。他偶然读到
    Jesse Garrett 写的描述这种称为 Ajax 的东西的文章。从那时起，他一直在钻研，学习一切可能的关于这种制作互联网应用程序的新方法的事知识。


    团队正在重新实现 UI。他们正在使用 JavaScript 和 HTML5 技术来提供更动态的体验。最重要的是，他们开始利用现代浏览器中可用的一种有用对象，它被称为
    `XMLHttpRequest`（简称为 `XHR`）。这个小家伙让 Hector 和他的团队能够在不重新加载整个页面的情况下，从服务器请求并接收最新数据。


    换句话说，Hector带头了从 Web 1.0 到 Web 2.0 的转变。他的客户再次开心了。


    ## 明天


    Hector 接下来的路会是什么？他的团队正在学习大量的 JavaScript，而且……甚至比以前学过的 CSS 还要多。团队对结果非常兴奋：用户体验就像任何其他应用程序一样，现在团队不仅要管理安装程序，还要管理应用程序本身。但他们意识到这一切也有负面影响。


    现在，他们正在用 JavaScript 写大量的代码。事实证明，所有的页面操作和 XHR 访问都需要大量的真实的、实实在在地的代码。尽管 JavaScript
    **看起来**很像 Java，但他们发现它实际上是一只完全不同的野兽。现在他们有两个代码库需要管理、测试和维护。


    所以，Hector 必须找到解决这些问题的方法。他将会看到，大多数 Web 应用开发框架正在迅速将 Ajax 工具整合到它们自己的套件中。很快，Hector
    和他的团队就能利用 Tapestry 组件、Spring 标签库、.NET nets、Rails 帮助工具和 PHP 库来利用 Ajax，而无需引入第二种工作方式。Ajax
    开发的未来是完全的、隐形的集成。这正是 Hector 所需要的。


    ## Google Maps：缺失的火花


    Google Maps (http://maps.google.com) 真正点燃了 Ajax 之火。而 Google 仅仅是最出乎意料的候选者。想想是什么让
    Google 一夜成名：最好的搜索结果和世界上最极简的 UI。它是一个白页面，中间有一个文本框和一个按钮。没有比这更极了。如果 Google 有配乐，那一定是
    Philip Glass 写的。


    当 Google 将进入地图领域变得很明显时，它的构想是：


    -   1. 使用 XHTML 和 CSS 进行标准的展示

    -   2. 使用文档对象模型进行动态显示和交互

    -   3. 使用 XML 和 XSLT 进行数据交换和处理

    -   4. 使用 XMLHttpRequest 或 XMLHttpRequest（来自 Microsoft）进行异步数据检索

    -   5. JavaScript 绑定一切


    虽然使用这些技术进行开发很常见，但它可能会变得事多大于利。在接下来的书中，我们将展示你如何：


    -   1. 加入不使用正式 XML 进行数据传输的 Ajax 技术

    -   2. 绕过 DOM API 自身来操作内存中的页面模型

    -   3. 使用同步调用服务器，这虽然强大但也很危险


    ## 1.3 什么是 Ajax？


    Ajax 是一个很难浓缩成一句话的野兽。之所以困难，是因为它有两个方面：


    -   1. Ajax 可以被视为一组技术

    -   2. Ajax 可以被视为一种架构


    ### Ajax：异步 JavaScript 和 XML


    Ajax 这个名字源于常用启用技术的组合：JavaScript、XML 以及浏览器与服务器之间的异步通信通道。当它被定义时，它的构想是：


    -   使用 XHTML 和 CSS 进行标准的展示

    -   使用文档对象模型（Document Object Model）进行动态显示和交互

    -   使用 XML 和 XSLT 进行数据交换和处理

    -   使用 XMLHttpRequest 或 XMLHttpRequest（来自 Microsoft）进行异步数据检索

    -   JavaScript 绑定一切

    '
