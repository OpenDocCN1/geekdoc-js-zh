  - '[PAGE 84]


    # Simple JavaScript Driven Effects


    In Chapter 6, Ajax UI, Part I, on page 89 and Chapter 7, Ajax UI, Part II, on
    page 115, we will look at several frameworks that use pure JavaScript and HTML
    to create extremely complex UI effects. These kinds of frameworks provide high-level
    abstractions on top of meaty JavaScript, making the effects simple to implement
    in your application. The results are often completely cross-browser compatible,
    and fail gracefully to static HTML in legacy browsers.


    # Ajaxian Web Frameworks


    At the top of the tower are the web frameworks that are aware of Ajax. This is
    a growing group, and covers all of the platforms. All the major players are represented:
    Java, .NET, Ruby, PHP, Python, Perl, etc.


    Once again, the various frameworks offer different models for how you can work
    with them in an Ajaxian world.


    # Code Generation


    The Ruby on Rails community jumped on Ajax like nobody else. They offer high-level
    Ruby helper functions that generate Prototype-based JavaScript code. WebWork2
    is doing the same thing on the Java platform, utilizing the Dojo Toolkit as the
    base JavaScript framework. Many other frameworks are following, from Spring to
    CherryPy to PHP.


    # Component-based


    ASP.NET had components before there was Ajax. Other frameworks such as JavaScript
    Faces and Tapestry on the Java platform join ASP.NET by letting you use components
    that may happen to use Ajax techniques. In this world, you drag your DataTableComponent
    onto your designer view and start tweaking the property sheet for that component.
    Here you may see a checkbox for auto-update. Simply checking that box will put
    this component in Ajax mode and the rest is history.


    # 5.2 Remoting with the Dojo Toolkit


    Now that''ve examined the landscape of available helper toolkits, we''ll port
