    # Chapter 1


    # Building Rich Internet Applications with Ajax


    This is a book about developing effective web applications. We''re not going to
    dance around this issue. Underneath everything else, this book is about XHTML,
    JavaScript, CSS, and standards that have been around for almost a decade now.
    Not only do we admit this truth, we embrace it. Just because these standards have
    been around for a while doesn''t mean that we can''t build something new and exciting
    out of them. Technology, like Jello, takes a while to solidify something tasty
    and satisfying.


    Ajax (and Web 2.0) represents the maturation of Internet standards into a viable
    development platform. The combination of stable standards, better understanding
    and a unifying vision amount to a whole that is greater, by far, the sum of its
    parts. With Ajax, you''ll be able to achieve the double Holy Grail: feature-filled
    user interfaces and a no-hassle, no-installation story.


    It wasn''t long ago that Jesse James Garrett coined the term Ajax. When he first
    released the term onto the public consciousness, it stood for Asynchronous JavaScript
    And XML. It has since, like SOAP before it, lost its acronym and is just a word.
    However, it is an enormously powerful word. With this single word, Jesse James
    was able to harness an industry-wide trend towards richer, install-free web applications
    and give it focus.


    Naming a thing is powerful. In this case, not quite enough to become a movement,
    though. There was still a spark that was lacking.'
- md: "\nIt was to be provided by an entirely unlikely entity. What follows is the\n\
    story of one development team, that spark, and how it changed the way\nwe approach\
    \ web software.\n\n## 1.1 A Tale in Three Acts\n\nHector is a project manager\
    \ for a web application development shop.\nWith a long history of Perl CGI, ASP,\
    \ Servlet, and JSP development\nunder his belt, Hector has been around the block.\
    \ For the last year\nhis team has been building a CRM application for a large\
    \ Fortune 500\ncompany with offices all over the world. The application used to\
    \ be a\ngreen-screen mainframe application; the company wants to take advan-tage\
    \ of the great reach of the Internet to deploy the application to every\noffice.\n\
    \nHector and his team focus lot of their energy on the server side of the\napplication.\
    \ They have been using one of the modern MVC frameworks\nfrom the Java community\
    \ to implement the business logic; a high-\nperformance framework to access the\
    \ database; messaging-\nbased infrastructure to connect to other existing systems.\n\
    \n## Yesterday\n\nOn the client side, Hector and his team have become masters\
    \ of CSS.\nThe look of the pages belongs to their will; when the customer wants\n\
    rounded corners, they get rounded corners. Rollover colors? That's\neasy. Multiple\
    \ color schemes? No. In fact, Hector and his\nteam had long ago reached a point\
    \ where they weren't really worried\nout the user interface. See, the web operates\
    \ one way: it essentially\ndistributes static documents. When users want more\
    \ data, they incur\na complete interface refresh. It isn't optimal from an efficiency\
    \ perspec-cu\ttive, but it's how the web works and users have just learned to\
    \ live with\nit.\n\nThen, sometimes a couple of weeks ago, Hector's customer came\
    \ to a\nmeeting. The customer was usually a polite, accomod fellow. He\nunderstood\
    \ the web, understood the restrictions he had to live with to\nget reach of the\
    \ Internet. In fact, Hector had never seen him get\nreally angry. Until this meeting.\n\
    \nAs soon as he walked in, the team knew something was up. He had his\nlaptop\
    \ with him, and he never carried it. As he stormed into the room,\nthe team glanced\
    \ around the table: what have we done? The customer\nsat down at the table, fired\
    \ up the laptop, hammered away at the keyboard for a minute. While he pounded\
    \ the keys, he told the team\n“Last night, my wife and I were invited to a party\
    \ at the CEO’s house.\n“Uh oh,” thought the team, “this can’t be good.”\n\n“Well,\
    \ I certainly jumped at the chance,” he continued. “I’ve never been before. This\
    \ project got me on his radar.” (“Double uh oh,” thought Hector.)“When I couldn’t\
    \ figure out how to get there with my city map, I went to the Internet. I found\
    \ THIS!” He hissed the last word with venom and scorn. He flipped the laptop around\
    \ so the table could see it. There, quietly couched in his browser window, was\
    \ Google Maps.\n“Why,” he said, through clenched teeth, “can’t I have this?”\n\
    \n## Today\n\nSince meeting, Hector and his team have been on fire to rethink\
    \ the user interface. Hector went out to learn what was going on here, how Google\
    \ could have completely ignored conventional wisdom and such a thing. He came\
    \ across an article by Jesse Garrett describing this thing called Ajax. He’s been\
    \ digging since then, learning everything he can out about this new way of making\
    \ Internet applications.\n\nThe team has been re-implementing the UI. They’re\
    \ using JavaScript and HTML5 techniques to provide a more dynamic experience.\
    \ Most of all, they’ve begun taking advantage of a useful object available in\
    \ modern browsers called XMLHttpRequest (XHR for short). This little guy lets\
    \ Hector and his team request and receive fresh data from the server without reloading\
    \ everything in the page.\n\nIn other words, Hector has spearheaded a move from\
    \ Web 1.0 to Web 2.0. And his customer is happy again.\n\n## Tomorrow\n\nWhat\
    \ comes next for Hector? His team is learning a bunch of JavaScript, and,, and\
    \ even more than CSS than it ever knew before. The team is really excited about\
    \ the results: the user experience is just like any other application, now the\
    \ team doesn’t have to manage an installer as well as the application itself.\
    \ But they’ve realized that there’s a downside to it all.\n\nNow, they are writing\
    \ a ton of code in JavaScript. It turns out that all this page manipulation and\
    \ XHR access requires a lot of real, honest-to-goodness code. And even though\
    \ JavaScript LOOKS a lot like Java, they've discovered that it is really a different\
    \ beast. And now they have\ntwo codebases to manage, test, and maintain.\n\nSo\
    \ Hector is to find out how to solve these problems. And what\nhe will see is\
    \ most web application development frameworks are\nrapidly incorporating Ajax\
