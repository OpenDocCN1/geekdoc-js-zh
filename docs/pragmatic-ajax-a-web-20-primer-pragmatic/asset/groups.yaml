    \ can be passed by reference in /path/to/najax/classes/Seria\n```\n\n我们提到过 XOAD\
    \ 的核心是类和对象，而不仅仅是函数。要注册一个类并在 JavaScript 中访问它，你只需要另外一个辅助函数：\n\n```javascript\nvar\
    \ obj = NAJAX_Client::register(new ZipService());\n```\n\n我们正在从服务器注册一个匿名对象，但你也可以注册匿名项，例如内联列表。要做到这一点，只需进行如下操作：\n\
    \n```javascript\nvar arr = XOAD_Client::register(1, \"bob\", array(\"nested\"\
    ));\n```\n\n为了处理可能发生的错误，你遵循一种命名约定，这允许你为你调用的每个方法都拥有处理器。处理器的格式为 `obj.on(Name of\
    \ method)Error()`，方法名的第一个字母变为大写。我们在应用程序中通过以下方式处理错误：\n\n```javascript\nobj.onGet_city_stateError\
