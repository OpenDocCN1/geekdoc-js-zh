    \ doesn't get\nmore minimal than that. If Google had a soundtrack, it would have\n\
    written by Philip Glass.\n\nWhen it became obvious that Google was going to enter\
    \ map, it envisioned as:\n\n- 1. standards-based presentation using XHTML and\
    \ CSS\n- 2. dynamic display and interaction using the Document Object Model\n\
    - 3. data interchange and manipulation using XML and XSLT\n- 4. asynchronous data\
    \ retrieval using XMLHttpRequest or XMLHttpRequest (from Microsoft)\n- 5. JavaScript\
    \ binding everything together\n\nAlthough it is common to develop using these\
