    \ 156\n\n# Chapter 1\n\n# Building Rich Internet Applications with Ajax\n\nThis\
    \ is a book about developing effective web applications. We're not going to dance\
    \ around this issue. Underneath everything else, this book is about XHTML, JavaScript,\
    \ CSS, and standards that have been around for almost a decade now. Not only do\
    \ we admit this truth, we embrace it. Just because these standards have been around\
    \ for a while doesn't mean that we can't build something new and exciting out\
    \ of them. Technology, like Jello, takes a while to solidify something tasty and\
    \ satisfying.\n\nAjax (and Web 2.0) represents the maturation of Internet standards\
    \ into a viable development platform. The combination of stable standards, better\
    \ understanding and a unifying vision amount to a whole that is greater, by far,\
    \ the sum of its parts.\n\nNaming a thing is powerful. In this case, not quite\
    \ enough to become a movement, though. There was still a spark that was lacking.\n"
