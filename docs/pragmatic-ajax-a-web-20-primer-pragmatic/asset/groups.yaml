    # Chapter 9


    # Ajax with PHP


    PHP is the framework of choice for many web developers. It is free and open source,
    which means that it is widely adopted. For those who use it, they find that it
    is a pragmatic choice, one with a bustling community of users and developers.
    The community is so strong, in fact, that the library of available additions to
    the framework is quite large. If you find yourself wishing for a piece of functionality
    that isn''t in the PHP core, make sure you have Googled a bit before running off
    and implementing it yourself. Chances are, someone in the PHP community has done
    that work already.


    This is true with the marriage of Ajax and PHP. There are several PHP-based frameworks
    out there, of various quality and richness of features. In fact, the first PHP
    frameworks were announced within days of the coinage of the term "Ajax". In this
    chapter, we will take a look at the most popular of these frameworks and will
    again rewrite Hector''s CRM application. We''ll finally focus on the server side
