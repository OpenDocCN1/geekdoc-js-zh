    # Prototype


    The Prototype library is libraries (notably, Scriptaculous) are built on top of
    the basic functionality provided here. Prototype is a relatively simple JavaScript
    file;ing in 1041 lines of code as of version 1.4.0_pre2, it manages to pack an
    enormous punch for dealing with UI issues in the browser. We''ve already covered
    what Prototype does for remoting in earlier chapters. Now we''ll examine how it
    replaces the standard DOM and CSS idioms for manipulating UI elements.'
- md: "\n## Extensions to Common Types\n\nPrototype adds a series of helpful utility\
    \ methods to its lexicon, either by providing globally accessible functions or,\
    \ in some cases, existing types in JavaScript or the DOM. Since JavaScript types\
    \ can be extended at runtime without modifying the original source (the very definition\
    \ of a dynamic language), this is relatively straightforward to do. The result\
    \ is that Prototype can provide extremely useful shortcuts to common functionality,\
    \ but present it in the most natural way possible: as properties and methods of\
    \ the types where we would expect such features to appear.\n\nPrior to the Ajax\
    \ libraries, the two most common lines of JavaScript in HTML applications were:\n\
    \n```\nvar myElem = document.getElementById('some_element');\nmyValue = document.getElementById('some_other_element').value;\n\
    ```\n\nThough this is not particularly glaring, it is difficult to read, and can\
    \ make even the simplest of functions to scan and understand. Bear in mind, that\
    \ bandwidth is (even today) an expensive resource. For instance, I present the\
    \ current crop of JavaScript compressors with which you can eliminate all the\
    \ whitespace from your scripts to provide quicker downloading. Given that the\
    \ above code is ubiquitous and repeated, it would make sense to find a way to\
    \ minimize the surface area of these statements. Prototype replaces them with\
    \ the following lines:\n\n```\nvar myElem = $('some_element');\nmyValue = $F('some_other_element');\n\
    ```\n\nEven better, $F() can take an arbitrary number of IDs and return an Array\
    \ of elements to match.\n\n```\nvar elems = $('element_one', 'element_two', 'element_three');\n\
    for(var i=0;i<elems.length;i++) {\n  elems[i].value = 'changed';\n}\n```\n\nThere\
    \ is a major cost to this technique, though. Prototype doesn't bother to check\
    \ if the ID you passed is valid within the document. In the case above, if there's\
    \ no element with id element_two, the call still returns an array of length 3.\
    \ The second element, however, is null instead of a reference to a DOM node. Also\
    \ bear in mind that $() only works for input elements. If you are looking for\
    \ the text contained within an arbitrary DOM node, $() is useless.\n\n## innerHTML\
    \ Limitations\n\nAccording to the documentation for the IE, the innerHTML property\
    \ is read-only for the following list of enclosing tags: COL, COL-GROUP, FRAMESET,\
    \ HTML, STYLE, TABLE, BODY, TFOOT, THEAD, TITLE, TR. Which means, in IE, you cannot\
    \ use the innerHTML property to set the contents of a table row. This works fine\
    \ in all other browsers, but can be a serious limitation to cross-browser effects.\n\
    \nPrototype also extends the document object to include the new getElementsByClassName()\
    \ method. You pass in the string name of a CSS class and the function will collect\
    \ all the elements in the DOM which contain that class in their list. It doesn't\
    \ matter if the class is the first or only entry in the element's list. Prototype\
    \ will still find it.\n\n```\n<div id=\"one\" class=\"class1\">\n<div id=\"two\"\
    \ class=\"class2\">\n<div id=\"three\" class=\"class1\">\n<div id=\"four\" class=\"\
    class2, class1\">\n<script type=\"text/javascript\">\nvar classOn = document.getElementsByClassName('class1').length;\
    \ // 3\nvar classTwos = document.getElementsByClassName('class2').length; // 2\n\
    var classThrees = document.getElementsByClassName('class3').length; // 0\n</script>\n\
    ```\n\nThis method only takes a single class name, though. It is up to you to\
    \ make any sort of union if you are looking for elements implementing one of a\
    \ lists.\n\nOnce you can successfully retrieve nodes from the DOM, the next step\
    \ is manipulating them. Among the most common things to do is to simply change\
    \ the content of a node by resetting the value of its innerHTML property. innerHTML\
    \ is just string representation of the contents of the node. If you fill it with\
    \ properly formatted HTML, the browser will render it as HTML. When you retrieve\
    \ it, you will want to maintain the tag structure in its original format. Other\
    \ times, you'll want to actually display the tags as strings rather than them\
    \ rendered as HTML. Prototype extends the JavaScript String class with new methods.\
    \ escapeHTML() returns the innerHTML, but with any HTML tags escaped so they can\
    \ be displayed as text. unescapeHTML() does the exact opposite. This is very useful\
    \ for displaying HTML source within an HTML page.\n\n## AJAX and JavaScript for\
    \ the UI\n\nA final case is when you want to eliminate the tags altogether. Imagine\
    \ a div that contains a bibliography entry, rendered so that the title of the\
    \ book is underlined and the author's name is boldfaced. You want to retrieve\
    \ that value as data; any embedded style notation (or, Heaven help us, <b> tags)\
    \ are extraneous. String now has the striptags() method which eliminates any angle\
    \ brackets (and what's inside them) from the output. Whitespace is otherwise maintained,\
    \ allowing you to treat HTML as raw data.\n\n## Element\n\nPrototype introduces\
    \ a new class, Element, that controls basic styling properties of a DOM node.\
    \ Element is a static class, in that you do not need to create an instance of\
    \ it to access its functionality. Its various methods all take an element ID or\
    \ an element itself as a parameter and perform some action on them.\n\nWe spend\
    \ a lot of hiding and showing nodes of a DOM tree. Error messages are invisible\
    \ unless validation fails, for example, or trees collapsible nodes. Most of the\
    \ dynamic nature of a web page is wrapped in the mysterious appearance and disappearance\
    \ of blocks of data. The standard JavaScript strategy for accomplishing that uses\
    \ the div.display property.\n\n```\n<div id=\"hideOrShow\">\n  You can turn me\
    \ on and off.\n</div>\n<input type=\"button\" value=\"Toggle\" onclick=\"toggle('hideOrShow');\"\
    />\n<script type=\"text/javascript\">\nfunction toggle(elemName) {\n  var elem\
    \ = document.getElementById(elemName);\n  if(elem.style.display=='none') elem.style.display\
    \ = '';\n  else elem.style.display = 'none';\n}\n</script>\n```\n\nElement provides\
    \ the toggle command which accomplishes the same thing, with the added benefit\
    \ of being able to pass many element names (or elements) to a single call. Toggle\
    \ will iterate over all the arguments, toggling the state of each.\n\n```\n<div\
    \ id=\"up\">\n  <img src=\"up.gif\">Up\n</div>\n<div id=\"down\" style=\"display:none;\"\
    >\n  <img src=\"down.gif\">Down\n</div>\n```\n```\n<input type=\"button\" value=\"\
    Toggle\" />\n```\n\nTo be sure, we don't always want to toggle. Element also exposes\
    \ arguments each take variable number of arguments, ensures that each has display\
    \ property set correctly. Sometimes, toggling isn't enough. Setting an element's\
    \ display property to 'none' renders the rest of the page as though the element\
    \ did not exist. However, the mere existence of the hidden element contained form\
    \ elements, for example, would be submitted to the action as though they were\
    \ visible.\n\nInstead of merely setting the div's display property to 'none',\
    \ we can remove the div from tree entirely. Normally, this would mean navigating\
    \ to the <div>'s parent node and removing the div from the parent. The DOM specifies\
    \ a removeChild() method for this purpose. The node is removed from the tree,\
    \ the entire tree re-rendered to keep that block from influencing the flow. Furthermore,\
    \ containing elements no longer have any knowledge of the node, and scripts will\
    \ not be able to discover it. This is irreversible, unless you cached a copy of\
    \ the node in another variable and add it back later. Prototype exposes the removeChild()\
    \ feature as a function Element.remove().\n\n## Inserting Data\n\nShowing and\
    \ hiding data is nice, but it implies that we have a nice container dedicated\
    \ for displaying that piece of data. Showing an error message, for example, usually\
    \ means that we have a hidden div or span standing to take that data, then display\
    \ it to the user. Often, though, what we want to add more data to an existing\
    \ element. Most commonly, we want to add items to an already-visible list of items.\
    \ The standard HTML way to do this is to recreate a new version of the list items\
    \ which include the additions, then replace the contents of the list with the\
    \ new version. With Ajax, this would mean having a server-side method which you\
    \ call sends the list back with any new items appended. While effective, this\
    \ might be extremely long-running, and if it involved a database, mandates at\
    \ least a round trip to the datastore to re-fill the list.\n"
