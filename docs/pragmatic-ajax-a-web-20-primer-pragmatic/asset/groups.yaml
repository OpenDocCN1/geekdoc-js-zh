    \n## 底层的 XML\n\n现代浏览器会将你访问的每个网页以 XML 文档的形式存储在内存中，无论你访问的是现代 XHTML 站点还是旧的、简陋的 HTML\
    \ 2.0 时代站点。（当网页格式正确时，浏览器会遵循一种内部算法将 HTML 提升为 XML。）这种网页的内存表示可以被 JavaScript 代码访问，以程序化的方式确定关于页面的各种信息。\n\
    \n更重要的是，XML 文档是可以修改的，这些修改会立即在在对该页面的渲染中。因此，为了实现动画、动态修改效果，只需要修改网页底层的 XML 文档即可。我们现在考虑如何进行此类修改。\n\
