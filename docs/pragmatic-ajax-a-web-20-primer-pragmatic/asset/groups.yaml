    \ and shows what each attempts to provide to developers. The Dojo Toolkit, JSON-RPC,\
    \ and Prototype are all pure JavaScript frameworks that are agnostic about the\
    \ world of the server side (although Prototype was built with Ruby in mind).\n\
    \n## iframes\n\nPrior to the broad adoption of the XMLHttpRequest object, many\
    \ web applications were using a hidden iframe to accomplish in-page round trips\
    \ back to the server. An iframe is just like a normal HTML frame (a container\
    \ that can be targeted at a URL and render the results) except that it is embedded\
    \ in another page. These applications simply created an iframe of 0px by 0px,\
    \ then caused it to refresh again a given URL in order to pull more data back\
    \ from the server.\n\nWhile the technique is valid, and worked for many, there\
    \ were two inherent problems. The first is, if you wanted multiple asynchronous\
    \ requests, you had to have multiple iframes. This became a game of guessing how\
    \ many you would need and embedding that many in the page, which is not a tremendous\
    \ burden, just somewhat ungainly.\n\nMore important is the question of coding\
    \ intentionally: the use of iframe is a quintessential kludge. By that, we mean\
    \ it's the repurposing of a technology to do something it wasn't quite meant to\
    \ do. Though it works, it always feels a little like cheating. XMLHttpRequest,\
    \ however poorly named, is an object specifically designed for initiating, monitoring,\
    \ and harvesting the results of in-page postbacks. Programming against it feels\
    \ natural, and lends itself itself to more readable (and therefore maintainable)\
    \ code.\n\nA third issue, that mainly affects IE, is that the iframe issues audio\
    \ feedback to the user whenever it makes a request. This comes in the form of\
    \ a \"click\" sound, which can be jarring for the user since they usually have\
    \ no other indication of ongoing asynchronous behavior.\n\n## Toolkit Resources\n\
    \n- Dojo: http://dojototoolkit.com\n- Prototype: http://prototype.conio.net/\n\
    - Script.aculo.us: http://script.aculo.us\n- DWR: https://dwr.dev.java.net/\n\
    - Backbase: http://www.backbase.com\n- SmartClient: http://www.isomorphic.com\n\
    - Ajax.NET: http://ajax.schwarz-interactive.de/\n- SAJAX: http://www.modernmethod.com/sajax/\n\
    - JSON-RPC: http://json-rpc.org/\n\nOthers, such as DWR (Remote Remoting), couple\
    \ a JavaScript client library with a server-side listener piece written for the\
    \ Java platform. JSON-RPC itself has various bindings for many back-end languages.\n\
    DWR, JSON-RPC, Ajax.NET, and SAJAX are all examples of ORB-based Ajax frameworks.\
    \ They allow you to map JavaScript methods to back end services, treating the\
    \ client-side JavaScript as though it could directly access your server-side objects.\n\
    \n## UI Toolkit\n\nAbove, or potentially alongside, removing toolkits we find\
    \ JavaScript UI libraries. These give us the ability to use rich UI components\
    \ and effects out of the box, but differ in many ways.\n\n## Richer UI Components\n\
    \nToolkits like Dojo give us rich widgets like trees, tabbed panes or menus. These\
    \ are self-contained, instantiable UI components that can be used to compose a\
    \ rich, though still very “web-ish” application. The result is still unmistakably\
    \ an HTML UI.\n\n## Web Application Toolkit\n\nToolkits such as SmartClient aim\
    \ to give widgets that build a UI that looks and feels the same as a native application\
    \ on Windows or Mac OSX. These are useful if you are building an application that\
    \ happens to be on the web, versus a website that uses a couple of UI effects\
    \ and components. SmartClient, for example, features widgets that make the page\
    \ look and feel exactly like a Windows NT application.\n\n## Markup Based\n\n\
    Backbase allows you to add rich components through a markup-programming API. Your\
    \ traditional HTML becomes something like:\n\n```html\n<cmp bbase=\"true\" style=\"\
    display:none\" xmlns:nav=\"http://www.backbase.com/site/nav\">\n  <s:event b:on=\"\
    construct\" b:action=\"show\">\n  <div style=\"display:none\">\n```\n\nSuch a\
    \ framework could potentially a new generation of visual tools. Part of the problem\
    \ with such tools is the conflict between markup and code. Traditional JavaScript-based\
    \ pages have caused problems for such tools. An all-markup framework, on the other\
    \ hand, would provide the right abstractions for these. Se, for example, the markup-based\
    \ components in ASP.NET, Tapestry and Java Server Faces.\n\n![](img/5a8d358ff7a4bc74757620e01fde970c_83_0.png)\n\
    \n## Simple JavaScript Driven Effects\n\nIn Chapter 6, Ajax UI, Part I, on page\
    \ 89 and Chapter 7, Ajax UI, Part II, on page 115, we will look at several frameworks\
    \ that use pure JavaScript and HTML to create complex UI effects. These kinds\
    \ of frameworks provide high-level abstractions on top of JavaScript, making the\
    \ effects simple to implement in your application. The results are often completely\
    \ cross-browser compatible, and fail gracefully to static HTML in legacy browsers.\n\
    \n## Ajaxian Web Frameworks\n\nAt the top of the tower are the web frameworks\
    \ that are aware of Ajax. This is a growing group, and covers all of the platforms.\
    \ All the major players are represented: Java, .NET, Ruby, PHP, Python, Perl,\
    \ etc.\n\nOnce, the various frameworks offer different models for how you can\
    \ work with them in an Ajaxian world.\n\n## Code Generation\n\nThe Ruby on Rails\
    \ community jumped on Ajax like nobody else. They offer high-level Ruby helper\
    \ functions that generate Prototype-based JavaScript code. WebWork2 is doing the\
    \ same thing on the Java platform, utilizing the Dojo Toolkit as the base JavaScript\
    \ framework. Many other frameworks are following, from Spring to CherryPy to PHP.\n\
    \n## Component-based\n\nASP.NET had components before there was Ajax. Other frameworks\
    \ such as JavaScript Faces and Tapestry on the Java platform join ASP.NET by letting\
    \ you use components that may happen to use Ajax techniques. In this world, you\
    \ drag your DataTableComponent onto your designer view and start tweaking the\
    \ property sheet for that component. Here you may see a checkbox for auto-update.\
    \ Simply checking that box will put this component in Ajax mode and the rest is\
    \ history.\n\n## 5.2 Remoting with the Dojo Toolkit\n\nNow that've examined the\
    \ landscape of available helper toolkits, we'll port Hector's CRM application\
    \ to several of them to see how they work. Hector's CRM system is working OK with\
    \ our low-level XMLHttpRequest\n"
  mdcn: "\n\n## Ajax Web 框架\n\nRails, Tapestry, WebWork, ASP.NET, ...\n\n## UI 工具包\n\
    \nDojo, SmartClient, Backbase, ...\n\n## 远程工具包\n\nDWR, JSON-RPC, dojo.lo.bind()\n\
    \n![](img/5a8d358ff7a4bc74757620e01fde970c_80_0.png)\n\n![](img/5a8d358ff7a4bc74757620e01fde970c_80_1.png)\n\
    \n图 5.1：Ajax 框架的层级\n\nserver？它是在页面内重新渲染新数据吗？还是仅仅操作现有 DOM 节点的属性？\n\n图 5.1 阐明了 Ajax\
    \ 本身的不同层次。\n\n## 远程工具包\n\nAjax 辅助工具的最底层是远程工具包。如果你想创建自己的工具包，可能从这里开始：用你自己的 API 封装\
    \ `XMLHttpRequest` 以让变得更简单。一个优秀的远程工具包应该做的远不止隐藏我们那些丑陋的 `try/catch` XHR 实例化代码。如果你的\
    \ Ajax 页面由不支持 `XMLHttpRequest` 的浏览器加载会发生什么？它应该设法在可能的情况下，通过其他手段提供所有（或至少是）功能。例如，某些远程工具包将使用隐藏的\
    \ `iframe` 为页面提供 XHR 支持。\n\n图 5.1 列出了若干此类框架，并展示了每个框架尝试为开发者提供什么。Dojo Toolkit、JSON-RPC\
    \ 和 Prototype 都是纯 JavaScript 框架，它们对服务端世界是不可知的（尽管 Prototype 设计时考虑了 Ruby）。\n\n##\
    \ iframes\n\n在 `XMLHttpRequest` 对象被广泛采用之前，许多 Web 应用程序使用隐藏的 `iframe` 来实现页面到服务器的往返。`iframe`\
    \ 就像普通的 HTML 框架（一个可以指向 URL 并渲染结果的容器），不同之处在于它嵌入另一个页面中。这些应用程序简单地创建一个 0px  0px 的\
    \ `iframe`，然后让它刷新给定的 URL，以便从服务器拉取更多数据。\n\n虽然这种技术是可行的且对许多人有效，但它存在两个固有的问题。第一个是，如果你需要多个异步请求，就必须有多个\
    \ `iframe`。这变成了一场猜测需要多少个 `iframe` 并在页面中嵌入相应数量的游戏，这并不是巨大的负担，只是有些笨拙。\n\n更重要的是编码意图化的问题：使用\
    \ `iframe` 是一种典型的权宜之计（kludge）。我们的意思是，它是对某项技术的重新利用来执行它并非完全是为了的事情。虽然它有效，但总感觉有点像在作弊。`XMLHttpRequest`\
    \ 尽管命名不好听，但它是专门设计用于启动、监控和收集页面内回传结果的对象。针对它进行编程感觉很自然，并且有助于编写更具读性（因此更易维护）的代码。\n\n\
    第三个问题主要影响 IE，是 `iframe` 每当发送请求时都会向用户发出音频反馈。这种反馈以“点击”声的形式出现会让用户感到刺耳，因为他们通常没有其他指示表明正在进行异步行为。\n\
    \n## 工具包资源\n\n- Dojo: http://dojototoolkit.com\n- Prototype: http://prototype.conio.net/\n\
    - Script.aculo.us: http://script.aculo.us\n- DWR: https://dwr.dev.java.net/\n\
    - Backbase: http://www.backbase.com\n- SmartClient: http://www.isomorphic.com\n\
    - Ajax.NET: http://ajax.schwarz-interactive.de/\n- SAJAX: http://www.modernmethod.com/sajax/\n\
    - JSON-RPC: http://json-rpc.org/\n\n其他工具，如 DWR（远程调用），将 JavaScript 客户端库与为 Java\
    \ 平台编写的服务端监听器结合。JSON-RPC 本身对许多后端语言有各种绑定。\nDWR、JSON-RPC、Ajax.NET 和 SAJAX 都是基于 ORB\
    \ 的 Ajax 框架示例。它们允许你将 JavaScript 方法映射到后端服务，将客户端 JavaScript 视为可以直接访问你的服务端对象。\n\n\
    ## UI 工具包\n\n在上面，或者可能与移除工具包并存，我们发现了 JavaScript UI 库。这些库赋予我们开箱即用丰富 UI 组件和效果的能力，但在许多方面有所不同。\n\
    \n## 更丰富的 UI 组件\n\n像 Dojo 这样的工具包为我们提供了丰富的部件，如树形、标签页或菜单。这些是自包含的、可实例化的 UI 组件，可以用于构建一个丰富但仍然非常“Web\
    \ 化”的应用程序。结果仍然显而易见的 HTML UI。\n\n## Web 应用程序工具包\n\n像 SmartClient 这样的工具包旨在提供让 UI\
    \ 看起来和感觉与 Windows 或 Mac OSX 原生应用程序相同的部件。如果你正在构建一个运行在 Web 上的应用程序，而不是一个使用几个 UI 效果和组件的网站，这些工具非常有用。例如，SmartClient\
    \ 具有让页面看起来和感觉完全像 Windows NT 应用程序的部件。\n\n## 基于标记\n\nBackbase 允许你通过标记编程 API 添加丰富的组件。你传统的\
    \ HTML 将变成类似这样的：\n\n```html\n<cmp bbase=\"true\" style=\"display:none\" xmlns:nav=\"\
    http://www.backbase.com/site/nav\">\n  <s:event b:on=\"construct\" b:action=\"\
    show\">\n  <div style=\"display:none\">\n```\n\n这样的框架可能会催生新一代的可视工具。此类工具的问题之一是标记与代码之间的冲突。基于\
    \ JavaScript 的传统页面给此类工具带来了麻烦。另一方面，一个全标记的框架将为这些工具提供正确的抽象。例如，ASP.NET、Tapestry 和\
    \ Java Server Faces 中基于标记的组件。\n\n![](img/5a8d358ff7a4bc74757620e01fde970c_83_0.png)\n\
    \n## 简单的 JavaScript 驱动效果\n\n在第 6 章 Ajax UI 第一部分（第 89 页）和第 7 章 Ajax UI 第二部分（第 115\
    \ 页），我们将查看几个使用纯 JavaScript 和 HTML 创建复杂 UI 效果的框架。这类框架在 JavaScript 之上提供了高层抽象，使得效果在应用程序中实现变得简单。结果通常是完全跨浏览的，并在旧版浏览器中优雅地降级为静态\
    \ HTML。\n\n## Ajax Web 框架\n\n在顶端是感知 Ajax 的 Web 框架。这是一个不断增长的群体，涵盖所有平台。所有主要参与者都有代表：Java、.NET、Ruby、PHP、Python、Perl\
    \ 等。\n\n现在，各种框架为你在 Ajax 世界中工作提供了不同的模型。\n\n## 代码生成\n\nRuby on Rails 社区对 Ajax 的投入无人情。他们提供了高级的\
    \ Ruby 辅助函数来生成基于 Prototype 的 JavaScript 代码。WebWork 在 Java 平台上也在做同样，利用 Dojo Toolkit\
    \ 作为基础 JavaScript 框架。许多其他框架也随其后，从 Spring 到 CherryPy 再到 PHP。\n\n## 基于组件\n\nASP.NET\
    \ 在 Ajax 出现之前就有组件了。Java 平台上的 JavaScript Faces 和 Tapestry 等框架通过允许使用可能使用 Ajax 技术的组件加入了这一行列。在这个世界中，你将\
    \ DataTableComponent 拖到设计器视图并开始调整该组件的属性表。在这里你可以看到一个自动更新的复选框。勾选该框即可让组件进入 Ajax 模式，剩下的就不用管了。\n\
    \n## 5.2 使用 Dojo Toolkit 进行远程调用\n\n现在已经检查了可用辅助工具包，我们将 Hector's CRM 应用程序迁移到几个工具包以看看它们是如何工作的。Hector's\
    \ CRM 系统在我们底层的 `XMLHttpRequest` 上运行良好\n\n"
