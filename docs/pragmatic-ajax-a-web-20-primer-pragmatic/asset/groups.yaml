    `<form>` 元素来包围按钮。参数嵌入在隐藏的 `<input>` 中。`<form>` 的方法设置为 POST。现在，你与更新相关的链接就不会被加速器拦截失败了。


    当你对一个应用程序进行 Ajax 化时，这种方式编写页面的诱惑是巨大的。你向用户展示一个项目列表。你希望他们能够在不刷新的情况下从页面上添加新项目或删除现有项目。因此你在底部添加了一个名为*新记录*（New
    Record）的链接。列表中的每个项目都嵌入了一个名为*删除*（Delete）的链接。你使用简单的 GET 请求，带有如下 URL：http://www.mydomain.com/my/app/delete?recid=545。还有比这更简单的吗？当然，加速器会敲响你的门。

