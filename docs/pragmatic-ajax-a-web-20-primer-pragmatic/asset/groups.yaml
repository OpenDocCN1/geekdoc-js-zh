- md: "\n## 4. Abstract away the complexity of XMLHttpRequest\n\nIt is for these reasons\
    \ that the more important definition for Ajax is...\n\n## Ajax: The Architecture\n\
    \nThe exciting evolution that is Ajax is in how you architect web applications.\
    \ Let's look first at the conventional web architecture:\n\n- 1. Define a page\
    \ for every event in the application: view items, purchase items, checkout, and\
    \ so on.\n- 2. Each event, or action, returns a *full* page back to the browser.\n\
    - 3. That page is rendered to the user.\n\nThis seems natural to us. It made sense\
    \ at the beginning of the web, the web wasn't really about applications. The web\
    \ started off as more of a document repository; a world in which you can simply\
    \ link documents in an ad-hoc way. It was about document and data sharing, not\
    \ interactivity in any meaningful sense.\n\nPicture a rich desktop application\
    \ for a moment. Imagine what you would think if, on every click, all of the components\
    \ on the application screen re-draw from scratch. It seems a little slow, doesn't\
    \ it? On the web that was the world we inhabited until Ajax came along.\n\nAjax\
    \ enables a new architecture. The important parts of this architecture are:\n\n\
    - 1. *Small Server Side Events*: Now components in a web application can make\
    \ small requests back to a server, get some info, and tweak the page that is viewed\
    \ by changing the DOM. No full page refresh.\n- 2. *Asynchronous*: Requests posted\
    \ back to the server do not cause the browser to block. The user can continue\
    \ to use other parts of the application, and the UI can be updated to alert the\
    \ user that a request is taking place.\n- 3. *onAnything*: We can talk back to\
    \ a server based on almost anything the user does. Modern browsers track most\
    \ of the same user events that the operating system does: mouse clicks, mouse\
    \ events, keypresses, etc. Any user event can trigger an asynchronous request.\n\
    \nFigure 1.1 demonstrates the new lifecycle of an Ajax page:\n\n![](img/5a8d358ff7a4bc74757620e01fde970c_12_0.png)\n\
    \n### Figure 1.1: Ajax Page Lifecycle\n\n- 1. User makes initial request against\
    \ a given URL\n- 2. Server returns original HTML page\n- 3. Browser renders page\
    \ as in-memory DOM tree\n- 4. User activity causes subsequent request against\
    \ another URL asynchronously, leaving existing DOM tree untouched\n- 5. Browser\
    \ returns data to a callback function inside the existing page\n- 6. Browser parses\
    \ result and updates in-memory DOM with the new data, which is then reflected\
    \ on the user (the page is redrawn, but not 'refreshed')\n\nThis all sounds great,\
    \ doesn't? With this change we have to be careful though. One of the greatest\
    \ things about the web is that anybody can use it. Having simple semantics helps\
    \ that happen. If we go overboard, we might begin surprising the users with UI\
    \ abstractions. This is a common complaint with Flash UI, where users are confronted\
    \ with new symbols, metaphors and required actions to achieve useful results.\
    \ Usability is an important topic that we will delve into Chapter 7, Ajax UI,\
    \ Part II, on page 115.\n\n## 1.4 Whither Now?\n\nThe rest of this book will introduce\
    \ you to the breadth of the Ajax movement. We'll walk through the conversion of\
    \ an application to this new style, and take a deep look at the enabling technologies\
    \ behind Ajax. We'll introduce you to commonly available toolsets and frameworks\
    \ that make seemingly advanced effects as simple as a single line of code. You'll\
    \ get to see what your favorite development platforms are doing to take advantage\
    \ of, and integrate with, this new style of development.\n\nMost importantly,\
    \ we're going to talk a lot about how to use Ajax effectively, pragmatically,\
    \ even. Because the only thing worse than being left behind when the train leaves\
    \ the station is getting on the wrong train. We intend this book to be a guide\
    \ through a new and rapidly evolving landscape. We want to help you find out how,\
    \ and even if, Ajax can help your projects. We're not trying to sell you anything\
    \ (except this book). But we believe that Ajax represents a major event, and we\
    \ want to be there to help you make the best of it.\n\n## Chapter 2\n\n## Ajax\
    \ In Action\n\nIn the last chapter, Hector and his team went on a voyage of discovery\
    \ about the possibilities for web applications. They learned that Ajaxian techniques\
    \ can transform conventional web pages into dynamic web interfaces. This chapter\
    \ is about lifting the veil and showing you how Ajax really works. To do this,\
    \ we'll transform a traditional web page into an Ajax application right before\
    \ your eyes.\n\n### 2.1 Ajaxifying a Web Application\n\nLet's consider the case\
    \ of our friend Hector, the erstwhile project manager from our previous chapter.\
    \ Hector released the first version of the application a few months ago. As he\
    \ reviewed the user feedback, he found that some users expressed frustration with\
    \ a customer entry screen.\n\nFigure 2.1, on the next page is a screenshot of\
    \ the current version of the page.\n\nSo what's the problem with this screen?\
    \ It turns out that the users of Hector's application are used to the behavior\
    \ of the “green-screen” application it replaced. In the old application, all users\
    \ had to enter the customer's zip code and the “City” and “State” fields would\
    \ auto-populate with the correct values; the users of Hector's new web application\
    \ are frustrated that they now have to enter this data manually.\n\n**Corporate\
    \ CRM System**\n\n### Enter Customer Data\n\n| Field | Value |\n| :--- | :---\
    \ |\n| Customer Name: | |\n| Address: | |\n| City: | |\n| State: | |\n| Zip: |\
    \ |\n\n![](img/5a8d358ff7a4bc74757620e01fde970c_12_0.png)\nFigure 2.1: Hector's\
    \ Entry Screen\n\nSo what's the problem with this screen? It turns out that the\
    \ users of Hector's application are used to the behavior of the “green-screen”\
    \ application it replaced. In the old application, all users had to enter the\
    \ customer's zip code and the “City” and “State” fields would auto-populate with\
    \ the correct values; the users of Hector's new web application are frustrated\
    \ that they now have to enter this data manually.\n\n## 2.2 Ajaxifying a Web Application\n\
    \n**Preparing the HTML**\n\n... of HTML? You know, after ten years, we are. The\
