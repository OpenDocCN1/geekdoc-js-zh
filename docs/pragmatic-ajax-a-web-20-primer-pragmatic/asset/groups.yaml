    # Don''t Reinvent the Wheel


    We''ve grown accustomed to certain UI conventions. Modern operating systems and
    their windowing toolkits offer us certain abstractions that have settled in our
    consciousness. We know what a window is, for example. Even my parents know when
    they see a box on the screen with an outset border, a header at the top and some
    buttons in upper left or right corners, that thing can be dragged around on the
    screen and it can be closed. We know what a button looks like and that the appropriate
    thing to do is click on it, once, to press. We''ve been trained that text along
    the top edge of a window is probably menus, and if we hover the mouse over them
    or click on them, they are likely to spawn little submenu. I''ve actually run
    this experiment with my family. They are Microsoft Windows users. If I put them
    in front of a Mac, they the actual graphical look is entirely different. They
    have no idea what the Dock is for, but the common abstractions are plain and clear.
    Likewise, when they sit at a Gnome or KDE desktop on my Linux box, everything
    is fairly straightforward.


    The web has taught us some additional standards. Now, we agree that text along
    the top or left edges may be a menu, and hovering the mouse over a menu is preferable
    to clicking on it to get the submenu to appear. We know that words, underlined
