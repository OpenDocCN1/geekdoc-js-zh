    \n最后一块拼图是再次封装 `getZipData()` 以连接到我们的对象：\n\n我们提到过 XOAD 能够处理比 Sajaj 更丰富的类型。让我们更改代码来尝试一下。为了做到这一点，我们将\
    \ `get_city_state()` 修改为返回类型为 `ZipCityState` 的对象。这是一个包含了所有必要数据的结构，而不是一个需要在你在客户端进行解析的字符串表示。\n\
    \n`ZipCityState` 结构是一个简单类型。我们只需要给它提供一些公共变量，以存储和检索我们的数据。更好的是，我们可以为数据使用访问器和变异器。\n\
    \n```javascript\nclass ZipCityState {\n    var $zip;\n    var $city;\n    var\
    \ $state;\n    function ZipCityState($zip, $city, $state) {\n        $this->zip\
    \ = $zip;\n        $this->city = $city;\n        $this->state = $state;\n    }\n\
    }\n```\n\n现在我们有了 `ZipCityState`，并可以使用它：\n\n```javascript\nfunction assignCityState(zcs)\
    \ {\n    if (zcs.city) {\n        document.getElementById(\"city\").value = zcs.city;\n\
    \        document.getElementById(\"state\").value = zcs.state;\n        document.getElementById(\"\
    zipError\").innerHTML = \"\";\n    } else {\n        document.getElementById(\"\
    zipError\").innerHTML = \"Error: \" + zcs.zip;\n    }\n}\n```\n\n这结束了对 XOAD 的介绍，我们已经看到它是一个面向对象的系统，而\
    \ Sajax 是基于函数的结构。XOAD 序列化器允许你返回丰富的对象，这些对象会被转换为 JavaScript JavaScript引擎可以消费的 JSON\
    \ 对象。\n\nXOAD 库还有其他我们在案例中没有看到的有趣方面。其中之一是 XOAD 事件，它允许你从一台计算机触发事件并在另一台计算机上处理。这都是通过使用观察者模式，让一部分代码触发事件，另一部分监听事件实现的。这对于对层间传递的数据非常敏感的\
    \ Ajax 应用非常有用（例如聊天客户端）。\n\n# 9.4 总结\n\n我们向你展示了两个流行的基于 PHP 的 Ajax 框架。这些框架充分证明了集成\
    \ Ajax 代码的力量；其模型的简单性显而易见。你永远不需要离开 PHP 的舒适范围就能取得显著的结果。事实上，如果你不想，你甚至不需要看 JavaScript。然而，仅仅因为这些框架可以隐藏客户端的\
    \ JavaScript 细节，并不意味着你必须忽略它。利用像 Sajax 或 XOAD 这样的高层抽象层会有很多益处，但同时也使用 JavaScript\
    \ 直接操作 DOM 来实现更复杂的客户端行为也是有益的。\n\n"
