    \ of Animations in Dojo, and take a look at how they are used to create effects\
    \ we saw in Script.aculo.us.\n\n## Animations\n\nA Dojo animation is an object\
    \ that defines the parameters of a transition between two states. The states can\
    \ be anything: opacity levels, position, color. The states can be anything: opacity\
