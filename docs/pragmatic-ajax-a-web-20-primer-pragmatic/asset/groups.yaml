    # What is the Dojo Toolkit?


    Dojo is a browser toolkit. It is an open source project, that (to quote its marketing
    text) aims to "allow you to easily build dynamic capabilities into pages and any
    other environment that supports JavaScript. Dojo provides components that let
    you make your sites more usable, responsive, and functional. With Dojo you can
    build degrade user interfaces, prototype interactive widgets quickly, animate
    transitions, and build Ajax-based requests simply.


