    \ rest of the interfaces that our customers have grown accustomed to. Alerting\
    \ our user to change in data, or that they who have committed errors in their\
    \ data entry are all just ways of increasing the responsiveness of the application\
    \ while keeping with standard conventions. Techniques like auto-updating text\
    \ boxes allow customers to use our applications more efficiently. Sorting data,\
    \ and drag and drop capabilities, make the UI more like the standard “thick” UI\
    \ components of our desktop systems.\n\nAs anything, though, the trick is knowing\
    \ when *not* to do it. The second half of our chapter was all about keeping ourselves\
    \ focused on the most important point: usability. When these techniques make it\
    \ easier for our users to accomplish a task, then the technique is successful.\
    \ When they get in the way, when they cause our users to have to think about what\
    \ they are doing, then we should reevaluate our decision. And above all, never\
    \ surprise the user.\n\n## Chapter 8\n## Server-side Framework Integration\n\n\
    Over the next four chapters, we're going to introduce four web application development\
    \ frameworks and examine the server-side integration techniques they use for incorporating\
    \ Ajax. This kind of integration can be very valuable for a development team,\
    \ allowing the members of the team to focus their efforts on one logical tier\
    \ (the server) while simultaneously generating artifacts for two physical tiers\
    \ (server and client).\n\nTo explore these frameworks, we're going to walk Hector's\
    \ team through porting their CRM application to each framework. Along the way,\
    \ we'll talk about the reasons why Hector might consider each port, and the relative\
    \ strengths and challenges each choice presents. The four frameworks we'll examine:\n\
    \n- PHP: Sajax is the first Ajax integration toolkit for PHP, and we'll examine\
    \ it using the newer Najax library.\n- Ruby on Rails: Rails integrates very closely\
    \ with Prototype and Script.ulous. In fact, the authors of those two frameworks\
    \ are also Rails committers.\n- Spring (Java): We'll look at the integration of\
    \ the DWR framework with Spring for Java web applications.\n- ASP.NET: we'll look\
    \ at both Ajax.NET, an open source Ajax library, and the upcoming Atlas toolkit\
    \ from Microsoft itself.\n\nAs we look at these four frameworks, and port Hector's\
    \ application to each, bear in mind that we can't compare and contrast every aspect\
    \ of the frameworks. This isn't a book about comparative web development; it's\
    \ a book about Ajax and how to use it to make applications today. We hope that\
    \ these server-side chapters give you...\n\n### 8.1 Different Strategies for Integration\n\
    \nThere are several strategies that development teams can choose from. The choice\
    \ largely depends on the philosophy of the framework: should developers be using\
    \ HTML? Should the application be like HTML? In general, the strategies fall into\
    \ three major categories: visual tools, custom tag libraries (and helpers), and\
    \ ORB-like remoting.\n\n#### Tooling\n\nSome frameworks are built around the idea\
    \ of using visual tools for development. Examples are ASP.NET with its support\
    \ in Visual Studio, and JSF in Java. The components themselves are in charge of\
    \ their lifecycle. These frameworks are now integrating Ajax through declarative\
    \ properties. In fact, ASP.NET has had such support for some time. The programmer\
    \ merely selects one of the properties which enables desired behavior.\n\n####\
    \ Helper Tags\n\nA second approach to Ajax integration is custom tag libraries.\
    \ Like AjaxAnywhere¹, and Ruby on Rails use custom tag libraries (or similar constructs)\
    \ as HTML-embedded stand for server-side functionality. These tag libraries, sometimes\
    \ referred to as helper tags, are parsed by the template engine of the given framework,\
    \ which in turn generates client-side artifacts based on the attributes of the\
    \ custom tag.\n\nThe result is a page that looks like HTML, but whose actual content\
    \ is determined at parse time. The tags provide a layer of abstraction for integrating\
    \ our server-side code into client-side templates. This can be a quite powerful\
    \ ability, as it allows the developer to focus on a single artifact (the template)\
    \ instead of jumping around between template and alternate code files.\n\nWe'll\
    \ look at Ruby on Rails' Ajax integration in ??, on ??.\n\n#### ORB-like Remoting\n\
    \nOur last category of Ajax integration with a server framework is to use ORB-like\
    \ remoting to connect client-side JavaScript to existing server-side functionality.\
    \ Using tools like JSON-RPC, DWR (for Java), Ajax.NET, or any PHP frameworks,\
    \ developer can write JavaScript code for the browser that can seemingly access\
    \ the server-side domain model directly. The effect of these frameworks is that\
