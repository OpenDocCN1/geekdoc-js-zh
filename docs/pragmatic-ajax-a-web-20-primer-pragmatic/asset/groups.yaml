  mdcn: "\n我们需要首先确定 `getVisibleTiles()` 中内层 `div` 相对于外层 `div` 的位置。这非常简单：\n\n```\n\
    function getVisibleTiles() {\n  var innerDiv = document.getElementById(\"innerDiv\"\
    );\n  var mapX = stripPx(innerDiv.style.left);\n  var mapY = stripPx(innerDiv.style.top);\n\
    }\n```\n\n之前展示过的 `stripPx()` 函数将 `innerDiv.style.left` 返回的字符串值（例如 '100px'）转换为数值（例如\
    \ 100）。现在，我们可以将这些位置除以瓦片的大小，以计算出瓦片的起始行和列。这只需要两行代码：\n\n```\nvar startX = Math.abs(Math.floor(mapX\
    \ / tileSize)) - 1;\nvar startY = Math.abs(Math.floor(mapY / tileSize)) - 1;\n\
    ```\n\n注意，我们还没有定义 `tileSize` 变量；我们将在 JavaScript 代码的顶部全局定义它，在接下来的几个段落中显示整个页面时，你就会看到它。（或者，你可以通过访问\
    \ http://www.ajaxian.com/pragajax/code/maps/XXX.html 查看它。）\n\n`Math.floor()` 调用会将商数取整为整数，舍弃余数（1.4\
    \ 将向下取整为 1）。这会导致部分瓦片被显示。`Math.abs()` 将值转换为正数，在我们的情况下这是必要的，因为内层 `div` 的位置相对于外层\
    \ `div` 几乎总是负的，而列/行始终是正数。最后，我们从结果中减去 1，以便我们的地图能够处理触摸以获得更平滑的效果。\n\n最后部分的计算是确定视口中可见的行和列数：\n\
    \n```\nvar tileX = Math.ceil(viewportWidth / tileSize) + 1;\nvar tileY = Math.ceil(viewportHeight\
    \ / tileSize) + 1;\n```\n\n与 `tileSize()` 一样，我们将 `viewportWidth` 和 `imageHeight`\
    \ 都声明为全局变量，并在稍后显示。我们使用 `Math.ceil()`（无论余数大小如何，它都会向上取整），以确保如果列或行的任何部分可见，我们都会显示它。而且，由于我们在之前的几行中从瓦片的索引中减了\
    \ 1，我们将列和行数加 1，以实现平滑的滚动效果。\n\n现在我们拥有了计算视口中所有可见瓦片所需的所有数据，正如我们讨论的，还包括边缘几个目前不可见但很快就会可见的瓦片。现在，我们将构建一个包含所有需要加载瓦片的数组。为了构建此数组，我们将编写两个嵌套的循环，对当前可见的每一列和每一行进行迭代。在每个循环内部，我们将要显示的每个瓦片的列号和行号添加到数组中：\n\
    \n```\nvar visibleTileArray = [];\nvar counter = 0;\nfor (var x = startX; x <\
    \ (tilesX + startX); x++) {\n  for (var y = startY; y < (tilesY + startY); y++)\
    \ {\n    visibleTileArray[counter++] = [x, y];\n  }\n}\nreturn visibleTileArray;\n\
    ```\n\n注意，我们实际上在创建一个二维数组，我们数组中每个项的值都是另一个数组。我们这样做是因为我们需要返回两个值：列索引和行索引。现在，我们正在计算瓦片，并编写代码来实际显示它们。首先，让我们查看目前为止编写的所有代码：\n\
    \n```\nfunction checkTiles() {\n  // 检查哪些瓦片应该在内层 div 中\n  var visibleTiles = getVisibleTiles();\n\
    \  // 将每个瓦片添加到内层 div，首先检查\n  // 它是否已经添加\n}\nfunction getVisibleTiles() {\n  var\
    \ innerDiv = document.getElementById(\"innerDiv\");\n  var mapX = stripPx(innerDiv.style.left);\n\
    \  var mapY = stripPx(innerDiv.style.top);\n  var startX = Math.abs(Math.floor(mapX\
    \ / tileSize)) - 1;\n  var tilesX = Math.ceil(viewportWidth / tileSize) + 1;\n\
    \  var tilesY = Math.ceil(viewportHeight / tileSize) + 1;\n  var visibleTileArray\
    \ = [];\n  var counter = 0;\n  for (var x = startX; x < (tilesX + startX); x++)\
    \ {\n    for (var y = startY; y < (tilesY + startY); y++) {\n      visibleTileArray[counter++]\
    \ = [x, y];\n    }\n  }\n  return visibleTileArray;\n}\n```\n\n## 显示可见瓦片\n\n我们现在编写了\
    \ `checkTiles()` 函数的一半，正如你可能记得，该函数负责计算可见瓦片并显示它们。现在，让我们实现该函数的另一部分：显示瓦片。\n\n我们现在需要做的是遍历从\
    \ `getVisibleTiles()`返回的瓦片数组，并对每个数组元素将瓦片添加到内层 `div`。这是我们 `checkTiles()` 的新代码：\n\
    \n```\nfunction checkTiles() {\n    // 检查哪些瓦片应该在内层 div 中\n    var visibleTiles\
    \ = getVisibleTiles();\n    // 将每个瓦片添加到内层 div，首先检查\n    // 它是否已经添加\n    var innerDiv\
    \ = document.getElementById(\"innerDiv\");\n    for (var i = 0; i < visibleTiles.length;\
    \ i++) {\n        var tileArray = visibleTiles[i];\n        var tileName = \"\
    x\" + tileArray[0] + \"y\" + tileArray[1] + \"z\" + tileArray[2];\n        var\
    \ img = document.getElementById(tileName);\n        if (!img) {\n            img\
    \ = document.createElement(\"img\");\n            img.src = \"resources/tiles/\"\
    \ + tileName + \".jpg\";\n            img.style.position = \"absolute\";\n   \
    \         img.style.left = (tileArray[0] * tileSize) + \"px\";\n            img.style.top\
    \ = (tileArray[1] * tileSize) + \"px\";\n            img.setAttribute(\"id\",\
    \ tileName);\n            innerDiv.appendChild(img);\n        }\n    }\n}\n```\n\
    \n我们从第 8 行开始创建一个映射（包含值的哈希表）。我们将为每个需要加载的瓦片在该映射中添加一个条目。在第 9 行，我们遍历从 `getVisibleTiles()`\
    \ 返回的数组。对于每个元素，我们构建要加载的文件的文件。（如果你调用它，数字将被替换为网格索引。）我们还将此名称作为 `visibleTilesMap`\
    \ 变量的键，并在第 13 行检查我们是否已经将瓦片添加到内层 `div`。\n\n最后，在第 15 行到 21 行，我们创建 `<img>` 元素并将其添加到内层\
    \ `div`。注意在第 16 行，我们必须指定图像瓦片的 URI。如果你安装了 Java 并执行了步骤 1 和 2 中的代码来创建自己的瓦片，那太好了！请参考\
    \ http://www.ajaxian.com/pragajax/code/maps/x0yz0.jpg，其中 x0yz0 应该替换为你想要加载的瓦片。\n\
    \n现在你可以在浏览器中查看你的网页，并享受可以滚动的西班牙地图！我们放在了：\n\n"
