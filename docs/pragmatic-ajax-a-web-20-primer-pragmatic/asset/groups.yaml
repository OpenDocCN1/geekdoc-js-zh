    \ set of target coordinates, shrinks the from node to the shape specified by the\
    \ coordinates\n\n## 6.2 Conclusion\n\nIn this chapter, we've exposed you to the\
    \ basic UI elements of three different Ajax libraries. Script.aculo.us and Dojo\
    \ seem to provide a lot of overlapping effects, as you can see, the style of use\
    \ is drastically different between the two libraries. Which one you end up choosing\
    \ for your own projects is a matter of both taste and need; Dojo provides a lot\
    \ more in terms of functionality than Script.aculo.us, and if you require those\
    \ features, then it makes sense to work with Dojo's effects as well. However,\
    \ if you are less interested in those advanced features and just want the effects,\
    \ Script.aculo.us is a much lighter weight alternative. It has lower overhead\
    \ from a bandwidth and a learning perspective.\n\nIn the next chapter, we'll use\
    \ these libraries to re-implement our CRM application with whizzy UI features.\
    \ We'll show server-side validation, notification techniques, progress indicators,\
    \ and more. Additionally, we'll talk about what NOT to do with Ajax. There are\
    \ some big antippatterns waiting for you out there; we'll give you the heads up\
    \ on how to keep your app clean.\n\n# Chapter 7\n\n# Ajax UI, Part II\n\nIn the\
    \ last chapter, we started to look at using some of the available Ajax JavaScript\
    \ libraries to drive the user interface in a browser. Understanding how these\
    \ libraries help you more efficiently control the UI is the UI. Step 1. Step 2\
    \ is understanding what you should do with your new-found tools.\n\nThis chapter\
    \ will present some of the standard techniques for utilizing Ajax on the UI. We'll\
    \ talk through validation, notification and data management strategies that have\
    \ proven themselves to increase the utility AND usability of web applications.\
    \ Later, we'll talk about some patterns, too, the things you should avoid and\
    \ the tests you should apply when Ajaxifying your application. This chapter isn't\
    \ exhaustive. Our intent is to give you a set of foundational tools for deciding\
    \ how to (and when not) proceed.\n\n## 7.1 Some Standard Usages\n\nLet's look\
    \ at several common applications of Ajax using the libraries we talked about in\
    \ the previous chapter: Prototype, Script.aculo.us and Dojo.\n\n## Server-side\
    \ Validation\n\nWeb applications are faced with a variety of standard problems.\
    \ Validation is one that has spawned an infinite array of potential solutions.\
    \ We have learned over time that there is one universal delineation to be taken\
    \ into account: server-side vs. client-side. Or so we thought. Client-side validation\
    \ is handy for our users because they get \"instant\" feedback about the correctness\
    \ of their data entry without having to wait for the whole page to refresh. Client-side\
    \ validation is largely-less to the application developer, however, since it is\
    \ trivial for a user to circumvent client-side JavaScript. Heck, users can ignore\
    \ our rendered HTML entirely and craft requests to our system using Telnet. Therefore,\
    \ server-side validation is always mandatory. Client-side validation is usability\
    \ enhancement for our users.\n\nAjax allows us to combine the two techniques for\
    \ greater usability. The problem with client-side techniques is that the validation\
    \ rule itself has to be portable to the browser. This means you can execute regular\
    \ expression matrices, required field checking, and even small-scale data comparisons\
    \ (for example, is the state abbreviation of one of the standard 50 two-letter\
    \ abbreviations). You can't, however, validate the inputs against your database,\
    \ or against any server-resident data or rules. With Ajax, we get the benefits\
    \ of client-side validation (“instant” feedback without a page refresh) but the\
    \ power of server-side validation (comparison against server-resident data or\
    \ rules).\n\nThis means we can create web applications with full validation the\
    \ way we have historically been able to do in fat client applications. We can\
    \ use a full-fledged rules engine, for validating individual data fields. But\
    \ keep in mind that we are still required to validate the data on the final submission,\
    \ because users can bypass an Ajaxified web application just easily as a standard,\
    \ which means the final POST must be checked from top to bottom. So, this pattern\
    \ gives us more powerful client-side usability, but does not solve the underlying\
    \ problem at all.\n\nWe're going to modify the CRM application from the earlier\
    \ chapters with our new Ajax patterns. For this validation example, we have to\
    \ start by preparing the UI itself. Here is the original HTML for rendering the\
    \ Customer Name and Address fields for input:\n\n```\n<tr>\n  <td>Customer Name:</td>\n\
    \  <td><input type=\"text\" name=\"name\"/></td>\n</tr>\n<tr>\n  <td>Address:</td>\n\
    \  <td><input type=\"text\" name=\"address\"/></td>\n</tr>\n```\nIt includes a\
    \ label and an input field for each data. It does not have any place to put an\
    \ error message when validation fails. Error messages should be conveniently located\
    \ with the input fields, so we'll add a new <span> element beside\n\n## Error\
    \ Messages\n\nIn addition to displaying error messages next to the fields they\
    \ describe, it is also common (and, dare we say, appropriate) to include a general\
    \ message area that provides a summary of all error messages. Adding one is left\
    \ as an exercise to the reader.\n\nThe <span>s will be marked with a specific\
    \ class so that we can control their look (in this case, we'll style the text\
    \ red). Plus, we'll update the input fields to have a unique ID, which we can\
    \ use to extract the values at runtime, and the new <span>s also has IDs so we\
    \ can fill them in with innerHTML after.\n\nSecondly, we'll need to hook our validation\
    \ code up to an event on the input fields. The standard event hook for this purpose\
    \ is the onblur event. This event fires when the user changes away from the field,\
    \ by clicking elsewhere or tabbing away from it. We'll call a JavaScript method\
    \ from the onblur event that will perform the validation. The method is called\
    \ validate(), and we will examine it more in a minute. Now, know that the function\
    \ takes four parameters:\n\n- id: the id of the input field being validated\n\
    - required: whether or not this field is a required field\n- validation: the validation\
    \ rule used to execute on the data\n- update: the id of the field used to display\
    \ the error message\n\nThe new version of the UI elements looks like this:\n\n\
    ```\n<tr>\n  <th>Customer Name:</th>\n  <td>\n    <input type=\"text\" id=\"name\"\
    \ name=\"name\" \n    onblur=\"validateField('name', 'required', 'name', 'nameError')\"\
    />\n  </td>\n  <td colspan=\"2\">\n    <span style=\"border-bottom: solid 1px\
    \ red; color: red;\" id=\"nameError\"></span>\n  </td>\n</tr>\n```\n"
