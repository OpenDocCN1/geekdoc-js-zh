    \ number of milliseconds the animation will take.\n- acceleration: whether the\
    \ animation is accelerating or decelerating (not implemented at time of writing)\n\
    - repeatCount: number of times to repeat the animation (-1 means forever)\n\n\
    A curve is just an object that exposes a method, getValue(n), where n is a number\
    \ between 0 and 1. The return value is an array of numbers that can be used to\
    \ calculate current state. For example, you could create a linear curve to move\
    \ from [0,0] to [100,100], tracing a line through a Cartesian plane that has a\
    \ 45 degree angle in the upper right quadrant. Or, you could create an arc curve\
