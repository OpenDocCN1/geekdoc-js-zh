- md: "\n# SOME STANDARD USAGES\n\n- minChars: how many characters the user has to\
    \ enter before the first request is sent (defaults to 1)\n- afterUpdateElement:\
    \ a callback hook for the values that are returned and set into the target container\n\
    \nScriptacious also provides another object, AutoCompleter.Local which uses a\
    \ locally cached list of values instead of making roundtrips to the server. This\
    \ would increase speed at the expense of stale data.\n\nTo finish the example,\
    \ we have just to make the results look pretty. Without any style help, the results\
    \ will be displayed in a transparent `<div>` as a series of bulleted list items,\
    \ without keyboard navigation. Clicking on one with the mouse would be the only\
    \ way to select and an entry from the list. We are using the styles provided by\
    \ Scriptacious to make our list entries navigable and pretty, as shown below:\n\
    \n```html\n<style>\ndiv.auto_complete {\n  width: 350px;\n  background: #fff;\n\
    }\ndiv.auto_complete ul {\n  border:1px solid #888;\n  margin:0;\n  padding:0;\n\
    \  width:100%;\n  list-style-type:none;\n}\ndiv.auto_complete ul li {\n  margin:0;\n\
    \  padding:3px;\n}\ndiv.auto_complete ul li.selected {\n  background-color: #ffb;\n\
    }\ndiv.auto_complete ul strong.highlight {\n  color: #000;\n  margin:0;\n  padding:0;\n\
    }\n</style>\n```\n\nThe result is shown in Figure 7.4, on the following page.\
    \ Notice how the effect is like a drop-down box. The `<div>` has a narrow border,\
    \ the individual items are displayed without list bullets, and as you key up and\
    \ down the list, the items highlight with (in this case) a pale yellow. Pressing\
    \ enter while an item is highlighted, or clicking one with the mouse, causes that\
    \ value to be set into the input field.\n\n## Customer Data Screen\n\n### Corporate\
    \ CRM System\n\n### Enter Customer Data\n\nCustomer Name:\nAddress:\nZip:\nCity:\n\
    \n![](img/5a8d358ff7a4bc74757620e01fde970c_134_0.png)\n\nFigure 7.4: Auto-complete\
    \ in action\n\n## 7.2 It Isn't All Just Wine and Roses...\n\nAjax is fantastic.\
    \ It opens the web to a whole new way of developing and delivering applications\
    \ to your users. Largely, it changes the experience of using a web app from reading\
    \ to using. As long-time instructors and trainers, we know first-hand the value\
    \ of interaction in keeping students engaged and happy. The same phenomenon applies\
    \ to applications, as well. If your application is passive, and makes your users\
    \ passive consumers, then the application will not capture your users' attention.\
    \ An interactive version, however, has the power to excite.\n\nEven though Ajax\
    \ has this power to change the web so radically, it behoes us all developers to\
    \ remember why the web enjoys such broad acceptance. It is based around certain\
    \ standards (technical and visual) that have allowed users of all stripes to take\
    \ advantage of services provided there. Those standards, some written and some\
    \ simply understood, are vital to the success of all applications on the web,\
    \ whether or not they use Ajax.\n\nThe key to a successful Ajaxification is to\
    \ not ignore important conventions. There are certain laws of the land that made\
    \ the web so popular and accessible, in ways that other applications and technologies\
    \ never were. As you add this new technology into your application, think both\
    \ tactically and strategically. Ask yourself the following questions:\n\n- “Is\
    \ I’m increasing the usability of my application, or the length of my resume?”\n\
    - “Does it break an ingrained habit of my users?”\n- “Is the value worth the cognitive\
    \ dissonance such a break cause for my users?”\n\nTactically, the change might\
    \ increase the usability of this single page, but strategically, reduce the usability\
    \ of the application as a whole.\n\nWe'll walk through some of the biggest anti-patterns\
    \ to watch out for. This list is not exhaustive. When in doubt about something\
    \ you are working on, check it against our smell-test questions above. And keep\
    \ in mind that the key is usability and function: if it increases both, then do\
    \ it!\n\n## Watch That Back Button!\n\nTwo things set the World Wide Web apart\
    \ from everything that came before it: the back button, the bookmark. Applications\
    \ historically were guided tours. Users were encouraged to follow certain paths\
    \ through the information provided. At best, users might be able to search for\
    \ a specific item or screen and navigate directly to it. If they moved on, the\
    \ only way to get back was to run the search again. And even this was a rare enough\
    \ feature for an application. Consider Quicken circa 1998, or those multimedia\
    \ encyclopedias we all bought back in '96; they had tables of contents, and search\
    \ capabilities, but no notion of the history of your actions.\n\nThe back button\
    \ isn't just a button; it's a symbol of freedom. It means you are free from the\
    \ shackles of the guided tour. You forge your own path through the information\
    \ at your fingertips, and can retrace your steps at your leisure. You become the\
    \ master of the application, instead of the other way around. Don't believe me?\
    \ Go into your browser and turn off the navigation bar and see how long you go\
    \ before having to turn it back again.\n\nBearing this in mind, now picture how\
    \ the back button actually works. The default behavior for a browser is to cache\
    \ pages as they are downloaded. Clearly, this can be overridden at either the\
    \ browser or server level, but the default is to create a local cache. Only the\
    \ original state of a page downloaded from the server is cached. If the DOM is\
    \ modified in any way by client-side JavaScript, those changes are not reflected\
    \ in the cache at all. Conversely, if the page was cached, the back button merely\
    \ sends a new request to the server which will return the page in its original\
    \ state anyway. The practical upshot of all this is that all your Ajax goodness\
    \ is lost when the user navigates away from your page and back again.\n\nIt's\
    \ even worse than it looks at first glance; see if the page has elements whose\
    \ value is determined at parse-time, those values will be cached along with the\
    \ rest of the page. Clicking the back button will normally result in a load from\
    \ cache where possible: the elements will contain possibly outdated values since\
    \ the server-side parse never takes a second time. At that point, only if the\
    \ user manually refreshes the page will the new values appear.\n\nIt becomes incumbent\
    \ on the designer of the application to distinguish between information retrieval\
    \ and navigation. When a user wants to proceed, they generally want the back button\
    \ to take them where they were before. This is because the table of contents was\
    \ forced into the same context as the article. Alternatively, imagine the same\
    \ newspaper, but with table of contents whose links operate Ajax fashion. Clicking\
    \ on the title of article replaces the table of contents. Navigating forward and\
    \ back in the article happens via Ajax as well. When the user clicks the Next\
    \ and Previous buttons, pages are loaded into `<div>`. What happens if the user\
    \ clicks the back button now? They don't end up at the table of contents; instead,\
    \ they end up at whatever site they were before. This seems fairly natural.\n\n\
    ## Bookmarking Makes the Web\n\nBookmarking is the kissing cousin of the back\
    \ button. It is a usercontrolled meta-history of their browsing exploits. Bookmarking\
    \ the index page (the welcome mat) is less useful now than it was in the past.\
    \ With Google as our shared bookmarks, most people don't bother bookmark the index\
    \ page anymore. It is just easy to run to Google, in the page name, and click\
    \ the result. Instead, we use bookmarks for deep linking.\n\nDeep linking means\
    \ that users have the ability to pause and return to your application. If state\
    \ is maintained (cookies, long term sessions, backend storage, whatever) and users\
    \ can specify where in the application flow to resume their work, they are not\
    \ chained to your timetable. We often find ourselves in the middle of something\
    \ on an application but forced to take a call, or to a meeting. We want to know\
    \ that we can pick up right where we left off at some later time.\n"
  mdcn: "\n\n# 一些标准用法\n\n- minChars：在发送第一次请求之前，用户必须输入的字符数（默认值为 1）。\n- afterUpdateElement：一个针对返回并设置到目标容器中的值的回调钩子。\n\
    \nScriptacious 还提供了另一个对象 `AutoCompleter.Local`，它使用本地缓存的值列表，而不是向服务器进行往返请求。这会提高速度，但代价是数据可能会过时。\n\
