    \nPrototype 还扩展了 `document` 对象，以包含新的 `getElementsByClassName()` 方法。你传入一个 CSS 类的字符串名称，该函数将收集\
    \ DOM 中所有包含该类的元素并存入列表中。无论该类是元素列表中的第一个还是唯一条目，Prototype 都能找到它。\n\n```\n<div id=\"\
