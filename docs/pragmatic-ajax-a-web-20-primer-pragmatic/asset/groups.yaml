    \ just manipulate the properties of existing DOM nodes?\n\nFigure 5.1 clarifies\
    \ the distinct layers of Ajax proper.\n\n## Remoting Toolkit\n\nThe lowest level\
    \ of Ajax helpers is a remoting toolkit. If you were to create your own toolkit,\
    \ this would probably be where you started: wrapping XMLHttpRequest with your\
    \ own API to make life easier. A really good remoting toolkit should be to do\
    \ much more than hide our ugly try/catch XHR instantiation code. What would happen\
    \ if your Ajax page is loaded by a browser that does not support XMLHttpRequest?\
    \ It ought to find a way, if possible, to provide all (or at least) of its functionality\
    \ by other means. For example, some remoting toolkits will use a hidden iframe\
