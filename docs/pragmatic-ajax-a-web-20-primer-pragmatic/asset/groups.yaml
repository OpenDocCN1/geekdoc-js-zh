- md: "\n## A REVIEW OF CLIENT-SIDE JAVASCRIPT\n\n## Defining Events Outside of HTML\n\
    \nWe have so far shown that JavaScript event handler functions can be wired up\
    \ to node events through HTML attributes. This is fairly common practice, though\
    \ there is a class of programmer (we'll call them \"purists\") who frown upon\
    \ this usage. Even though JavaScript is embedded within the web page itself, many\
    \ developers like to consider the JavaScript and the HTML as separate artifacts.\
    \ Specifically, web designers will want to work on the HTML and styles, while\
    \ programmers will want to focus on the scripting. Directly embedding the JavaScript\
    \ into the HTML is too much coupling.\n\nThe main alternative is to use JavaScript\
    \ object properties. Once you have retrieved a reference to a node of an HTML\
    \ document, it exposes its events as a series of properties. Functions can be\
    \ directly attached to those properties. The following\n\n```html\n<div id=\"\
    div\" onclick=\"myfunction()\">\n```\n\nis functionally equivalent to\n\n```html\n\
    <div id=\"div\"/>\n<script type=\"text/javascript\">\n  document.getElementById('div').onclick\
    \ = myfunc;\n</script>\n```\n\nThe value to this technique is that the designer\
    \ can worry about HTML, and only HTML. Programmers can hook events transparently.\
    \ However, the downside is that the scripts that reference these events must be\
    \ parsed after the HTML they reference. Otherwise, the event cannot be found by\
    \ getElementById(), and the result is that no event is actually handled. There\
    \ is a relatively new library out called Behavior (http://bennolan.com/behaviour/)\
    \ that helps programmers by allowing you to assign behaviors to CSS classes, adding\
    \ an extra layer of indirection.\n\nModern browsers support a new kind of binding.\
    \ The new attachEventListener() function takes the name of the event to handle\
    \ (the \"on\" part), the function pointer, and a boolean value called capture\
    \ mode. The beauty of the new attachEventListener() method is that it can wire\
    \ up multiple handlers to the same event, creating a chain of handlers. Using\
    \ the direct property access, any subsequent assignments to a property just override\
    \ the last assignment. Before using attachEventListener(), make sure your browser\
    \ is supported. At last, IE5 for Windows, Firefox 1.0+ and Safari 1.2+ were all\
    \ supported, but not IE for the Mac.\n\n## 3.2 Manipulating the Web Page\n\nSo\
    \ far, we've covered the basics of JavaScript and discussed how to get a web page\
    \ to call JavaScript functions in response to user events. This covers a third\
    \ of what you need to create an Ajax application. The next major piece is knowing\
    \ how to actually change web page content from JavaScript.\n\n## XML Under the\
    \ Covers\n\nModern browsers store a copy of every web page you visit in memory\
    \ as an XML document, regardless of whether you're visiting a modern XHTML site\
    \ or an old crafty HTML 2.0-era site. (When a web page is well-formed, the browser\
    \ follows an internal algorithm for promoting the HTML to XML.) This in-memory\
    \ representation of the web page can be accessed by JavaScript code to programmatically\
    \ determine all kinds of information about the page.\n\nMore importantly, the\
    \ XML document can be modified, and such modifications are instantly reflected\
    \ by the browser's rendering of that page. Thus, to achieve animation, dynamic\
    \ modification, and other effects, all one has to do is modify the web page's\
    \ underlying XML document. We'll now consider how to go about making such modifications.\n\
    \n## Modifying the XML: The DOM API\n\nThe major browsers all implement the same\
    \ API for exposing the XML document to JavaScript code; it's known as the DOM\
    \ API. Short for Document Object Model, DOM represents XML elements, attributes,\
    \ and other components as objects in memory. The DOM API models an XML document\
    \ in memory as a Document object.\n\nYou can obtain a reference to the Document\
    \ object that represents the current web page by referencing a variable named\
    \ `document`. From this instance, you can retrieve references to individual XML\
    \ elements in the web page, which are modeled as Element objects. You can also\
    \ modify the attributes of an XML element via an Element object.\n\nIt's for an\
    \ example. This next code excerpt contains a simple web page that will modify\
    \ when its button is clicked:\n\n```html\n<head>\n  <script type=\"text/javascript\"\
    >\n    function modifyPage() {\n      var htmlElement = document.documentElement\n\
    \      var children = htmlElement.childNodes;\n      var bodyElement;\n      for\
    \ (i = 0; i < children.length; i++) {\n        if (children[i].nodeName == \"\
    BODY\") {\n          bodyElement = children[i];\n          break;\n        }\n\
    \      }\n      children = bodyElement.childNodes;\n      var divElement;\n  \
    \    for (i = 0; i < children.length; i++) {\n        if (children[i].nodeName\
    \ == \"DIV\") {\n          divElement = children[i];\n          break;\n     \
    \   }\n      }\n      divElement.replaceChild(document.createTextNode(\"Goodbye,\
    \ world!\"),\n      divElement.childNodes[0]);\n    }\n  </script>\n  <body>\n\
    \    <div>Hello, world.</div>\n    <button onclick=\"modifyPage()\">Click Me</button>\n\
    \  </body>\n</html>\n```\n\nAs you can see, the DOM API is a straightforward pleasure\
    \ to use. Actually, no, it's not. The DOM API is actually quite obtuse. If you've\
    \ never used the DOM API before, you might expect something that models XML in\
    \ an intuitive and easy fashion. For example, you might expect to be able to say,\
    \ get a reference to the root element in your web page, the `<html>` element,\
    \ and from there say something like:\n`htmlElement.getElement(\"BODY\")`\n\nNo\
    \ such luck, my. You see, the DOM API models all the different types of content\
    \ (elements, attributes, comments, and processing instructions) as nodes and,\
    \ inexplicably, the API does not provide a way to retrieve just the element. Frankly,\
    \ there is just an easy and convenient mechanism. If you give an element an `id=`\
    \ attribute, you can retrieve that element using a simple function on the Document\
    \ object called `getElementById`. Consider this further revised version of the\
    \ earlier example:\n\n```html\n<html\n  <head>\n    <script type=\"text/javascript\"\
    >\n      function modifyPage() {\n        var divElement = document.getElementById(\"\
    toReplace\");\n        divElement.replaceChild(document.createTextNode(\"Goodbye,\
    \ world!\"),\n              divElement.childNodes[0]);\n      }\n    </script>\n\
    \  </head>\n  <body>\n    <div id=\"toReplace\">Hello, world.</div>\n    <button\
    \ onclick=\"modifyPage()\">Click Me</button>\n  </body>\n</html>\n```\n\nHey,\
    \ that's not looking too bad. Line 5 seems a fairly clean way to get the `<div>`\
    \ we're looking for. Now, if we could clean up the next two lines; they still\
    \ seem a bit complex. And actually, we can.\n\n## DOM Shortcuts\n\nFortunately,\
    \ the DOM API includes a few shortcuts. Document objects have a method `getElementsByTagName()`\
    \ that could have come handy in our example. Consider this alternate function:\n\
    \n```javascript\nfunction modifyPage() {\n  var divElements = document.getElementsByTagName(\"\
    DIV\");\n  var divElement = divElements[0];\n  divElement.replaceChild(document.createTextNode(\"\
    Goodbye, world!\"),\n        divElement.childNodes[0]);\n}\n```\n\nThat's more\
    \ palatable. But, we still have the brittle ordering problem. We're assuming the\
    \ `<div>` element we're interested in will always occur in the same location relative\
    \ to other `<div>` elements. In our trivial example, this is a safe assumption,\
    \ but in the real world, this won't work at all.\n\nWhat we really need is a way\
    \ to easily reference a specific element in the web page. When the browser converts\
    \ this HTML to XML, it automatically adds a `<body>` element as a child of the\
    \ `<html>` element. For example, consider the case of HTML table:\n\n```html\n\
    <table>\n  <tr>\n    <td>A table</td>\n  </tr>\n</table>\n```\n"
  mdcn: "\n\n## 客户端 JavaScript 概述\n\n## 在 HTML 外部定义事件\n\n到此为止，我们已经展示了 JavaScript 事件处理函数可以通过\
