  ![](img/image_rsrc8SA.jpg)\n![](img/image_rsrc8SB.jpg)\n\n# 4 通过 Javascript 提交\n\
  \n在表单内点击 `<button type=\"submit\">` 或 `<input type=\"submit\">` 可以帮助你将表单数据发送到服务器，但你也可以通过\
