  \n# 第 13 章\n\n## JavaScript Web Cookies\n\n## 1 什么是 Web Cookie\n\n## 2 Cookie 存储在哪里\n\
  \n### 3 在浏览器中查看 Cookie\n\n## 4 ECMAScript Cookie\n\n## 1 什么是 Web Cookie\n\n\n\n\n\
  \n如你所知，Web 浏览器和服务器之间通过 HTTP 协议进行通信。当你使用浏览器访问某个网站时，你的请求会被发送到服务器，服务器将将内容返回给浏览器进行显示。\n\
  \n| ![](img/image_rsrc8SR.jpg) |\n\nCookie 是一种帮助网站在你的计算机上存储某些信息的技术。它会保存你曾经访问该网站的信息和痕迹。\n\
  \n| ![](img/image_rsrc8SS.jpg) |\n\n为了简单起见，请看以下情况：\n\n| ![](img/image_rsrc8ST.jpg)\
  \ |\n\n你访问了一个从未访问过的网站。假设该网站支持 2 种语言：英语、法语。因为你以前从未访问过该网站，将显示默认的英语界面。你重置并显示其他语言（如法语）。服务器响应你的请求，并向浏览器发送一个包含你偏好语言（法语）的\
  \ Cookie。\n\n你关闭电脑并在第二天再次访问该网站。当请求发送到服务器时，保存在你计算机上的 Cookie 会随请求一起发送，这将帮助服务器确定你的偏好语言并以该语言返回内容。\n\
  \n## 什么是 Web Cookie\n\n- Cookie 是由 Web 服务器发送到你的浏览器的一小段文本。Cookie 可以存储在内存中，也可以作为文件存储在用户的计算机上。Cookie\
  \ 也可以由运行在浏览器上的 Javascript 生成。\n- 存储在客户端的 Cookie 在用户每次访问该网站的任何页面时都会包含在请求中。\n\nCookie\
  \ 的主要信息是一对“名称/值”对；例如：\n\n```\nSessionID = AAA22311languagePreference = FRheaderColor\
  \ = BLUE\n```\n\n| ![](img/image_rsrc8SU.jpg) |\n\n电子商务网站使用的 Cookie。用户在该网站上购买商品。用户购买的商品存储在\
  \ `Cart`（购物车）中。在首次访问时，买家（浏览器）将接收到一个唯一的 `SessionId`（与其他用户不冲突）。\n\n每个 `SesionId` 都关联到在\
  \ Web 服务器上管理的购物车。`SessionId/Value` 信息片段是存储在用户计算机上的 Cookie。每当用户创建一个新请求时，此 Cookie\
  \ 都会附加在请求中，这有助于 Web 服务器区分不同的用户。\n\n## Cookie 包含什么\n\nCookie 意味着从浏览器传输到 Web 服务器以及反之的简单数据记录，它的结构如下：\n\
  \n```\nSSID=Ap4P…GTEq; Domain=amazon.com; Path=/; Expires=Wed, 13 Jan 2023 22:23:01\
  \ GMT; Secure;HSID=AYQEVn…DKrdst; Domain=.amazon.com; Path=/; Expires=Wed, 13 Jan\
  \ 2023 22:23:01 GMT; HttpOnlyHSID=AYQEVn…DKrdst; Domain=amazon.com; Path=/; Max-Age=300;\
  \ HttpOnly\n```\n\n|  | 含义 |\n| :--- | :--- |\n| `Name=Value` | Cookie 的名称及其值 |\n\
  | `Domain` | 网站的域名。 |\n| `Expires` | 指定此 Cookie 过期的日期和时间。如果 Cookie 未设置 `Expires`\
  \ 和 `Max-Age`，它将在用户退出浏览器后立即过期。 |\n| `Max-Age` | 该 Cookie 自创建起存在的时间以秒为单位。如果 Cookie\
  \ 同时具有 `Expires` 和 `Max-Age` 信息，则优先考虑 `Max-Age`。 |\n| `Path` | 设置此 Cookie 的目录或页面路径。如果你想在每个目录或每个页面访问此\
  \ Cookie，此处可以留空。 |\n| `Secure` | 如果此属性可用，即只有安全的服务器可以访问此 Cookie |\n| `HttpOnly` |\
  \ 如果此属性可用，即此 Cookie 只能在服务器端进行操作，但通过浏览器上的 Javascript 无法操作此 Cookie。 |\n\n## 2 Cookie\
  \ 存储在哪里\n\nCookie 可以存储在内存中或文件中。在本节中，我仅提到存储在用户计算机文件中的 Cookie。\n\n### IE (Internet\
  \ Explorer)\n\n使用 `IE` 浏览器时，同一网站的 Cookie 存储在同一个文件中。你可以在下面的目录找到它们：\n\n```\nC:\\Users\\\
  {CurrentUser}\\AppData\\Roaming\\Microsoft\\Windows\\Cookies\n```\n\n## 3 在浏览器上查看\
  \ Cookie\n\n在浏览器上查看 Cookie 非常简单，例如使用 Chrome 浏览器：\n\n| ![](img/image_rsrc8SV.jpg)\
  \ |\n\n## 4 ECMAScript Cookie\n\n基本上，你有 2 种方法处理 Cookie：\n\n- 在服务器端操作 Cookie。\n-\
  \ 通过运行在用户浏览器上的 Javascript 操作 Cookie。\n\n在用户浏览器中，使用 Javascript(`ECMAScript`)，你可以在没有\
  \ `HttpOnly` 属性的情况下操作 Cookie。\n\n下面使用 Javascript 处理 Cookie 的示例。\n\n### cookie-example.html\n\
  \n```html\n<!DOCTYPE html><<html><head><meta charset=\"UTF-8\"><title>Cookie example</title><script\
  \ type=\"text/javascript\" src=\"cookie-example.js\"></script></head><body onload=\"\
  readCookie()\">Your Name: <input type=\"text\" name=\"fullName\" id=\"fullName\"\
  \ /><br/>Fovorite Color:<select name=\"favoriteColor\" id=\"favoriteColor\"><option\
  \ value=\"red\">Red</option><option value=\"blue\">Blue</option><option value=\"\
  green\">Green</option></select><br><button onclick=\"writeCookies()\">Write Cookies</button><button\
  \ onclick=\"killCookies()\">Kill Cookies</button><br/><br/><<!--  Read Cookie Results:\
  \ --><hr />Read Cookie Results:<div id=\"logArea\" style=\"border:1px solid #ccc;padding:\
  \ 5px;height:150px;\"></div><button  value = \"Get Cookie\" onclick = \"readCookie()\"\
  >Read cookies</button></</body></html>\n```\n\n### cookie-example.js\n\n```javascript\n\
  // maxAge: Seconds\nfunction writeCookies(maxAge) {\nlet expires = new Date();\n\
  expires.setSeconds(expires.getSeconds() + maxAge);\nlet selectedColor = document.getElementById(\"\
  favoriteColor\").value;\nlet cookie1 = \"favoriteColor=\" + selectedColor + \";\"\
  ;\ncookie1 += \"Expires=\" + expires.toUTCString() + \";\";\ncookie1 += \"Path=/\"\
  ; // Path: Required in Chrome!!\n// Write Cookie 1\ndocument.cookie = cookie1;\n\
  let fullName = document.getElementById(\"fullName\").value;\nlet cookie2 = \"fullName=\"\
  \ + fullName + \";\";\ncookie2 += \"Max-Age=\" + maxAge + \";\"; // Secondsc\ncookie2\
  \ += \"Path=/\"; // Path: Required in Chrome!!\n// Write Cookie 2\ndocument.cookie\
  \ = cookie2;\nalert(\"Write Successful!\");\n}\nfunction killCookies() {\nwriteCookies(0);\n\
  }\nfunction readCookie() {\nvar allCookies = document.cookie;\nlet logText = \"\
  All Cookies : \" + allCookies + \"<br/>\";\n// Get all the cookies pairs in an array\n\
  let cookieArray = allCookies.split(';');\n// Now take key value pair out of this\
  \ array\nfor (var i = 0; i < cookieArray.length; i++) {\nlet kvArray = cookieArray[i].split('=');\n\
  logText += \"Cookie name: \" + kvArray[0] + \"<br/>\";\nlogText += \"Cookie value:\
  \ \" + kvArray[1] + \"<br/>\";\n}\ndocument.getElementById(\"logArea\").innerHTML\
  \ = logText;\n}\n```\n\n你可以直接在 Firefox 上运行 `cookie-example.html` 来测试此示例。使用 Chrome\
  \ 浏览器时，必须在 HTTP 服务器上运行此文件。\n\n```\nhttp://localhost:8080/cookies/cookie-example.html\n\
  ```\n\n| ![](img/image_rsrc8SW.jpg) |\n\n在表单上输入名称并选择你喜欢的颜色，然后点击“Write Cookies”按钮。Cookie\
  \ 将被生成并保存到用户的计算机中。\n\n| ![](img/image_rsrc8SX.jpg) |\n\n| ![](img/image_rsrc8SY.jpg)\
  \ |\n\n| ![](img/image_rsrc8SZ.jpg) |\n\n# 第 14 章：JavaScript void 关键字\n\n## 1 void\
  \ 关键字\n\n`void` 是 ECMAScript 中一个重要的关键字。它具有以下特性：\n\n- `void` 充当运算符，位于任何类型的单操作数之前。\n\
  - `void` 用于评估表达式。它不会返回任何值，换句话说，它返回 undefined 值。\n\n`void` 运算符置于任何表达式之前以获取 undefined\
  \ 值。\n\n### void-expression-example.js\n\n```javascript\nvoid console.log(\"Test1\"\
  );  // Test1\nconsole.log( void (\"Test2\") ); // undefined\nconsole.log( void (2\
  \ == \"2\") );  // undefined\nconsole.log( void (2) == \"2\" ); // false\nconsole.log(\
  \ void (2) == undefined); // true\n```\n\n## 2 Void 和 JavaScript URIs\n\n`<a href\
  \ =\"javascript:URI\">..\"a>` 在 HTML 中很常见。浏览器将评估 URI 并取由 URI 返回的值来替换当前页面的内容。\n\n\
  | ![](img/image_rsrc8T0.jpg) |\n\n| ![](img/image_rsrc8T1.jpg) |\n\n| ![](img/image_rsrc8T2.jpg)\
  \ |\n\n\n\n\n\n### href-javascript-example.html\n\n```html\n<!DOCTYPE html><html><head><meta\
  \ charset=\"UTF-8\"><title>Href Javascript</title><script>function getHtmlContentToShow()\
  \  {console.log(\"Do something here...\");alert(\"Do something here...\");// Return\
  \ new HTML content to replace current Page.return \"<h1 style='color:red;'>Other\
  \ HTML Content!</h1>\";}</script></head><body><h1>Href:javascript example</h1><a\
  \ href=\"javascript:getHtmlContentToShow()\">Click me!</a></body></html>\n```\n\n\
  如果 URI 返回 `undefined`，浏览器将不会替换页的内容。\n\n### href-javascript-void-example.html\n\n\
  ```html\n<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>Href Javascript\
  \ Void</title><script>function getHtmlContentToShow()  {console.log(\"Do something\
  \ here...\");alert(\"Do something here..\");// Return new HTML content to replace\
  \ current Page.return \"<h1 style='color:red;'>Other HTML Content!</h1>\";}</script></head><body><h1>Href:javascript\
  \ void example</h1><a href=\"javascript:void getHtmlContentToShow()\">Click me!</a></body></html>\n\
  ```\n\n## 3 一次性函数\n\n通常情况下，你需要定义一个函数然后调用它。\n\n#### function-example.js\n\n```javascript\n\
  // 定义一个函数\nfunction sayHello()  {console.log(\"Hello Everyone\");}// 调用函数\nsayHello();\n\
  ```\n\n下面的示例向你展示了如何创建一个仅供一次目的的函数。它会被立即调用。你将无法在程序的任何地方再次使用此函数因为它因为它在用后就不存在了。\n\n\
  #### used-once-function-example.js\n\n```javascript\n// 定义一个函数，并调用它。\n(function\
  \ sayHello()  {console.log(\"Hello Everyone\");}) ();\ntry  {\n// 这个函数不存在。\nsayHello();}\n\
  }catch(e)  {\nconsole.log(e); // ReferenceError: sayHello is not defined\n} \n```\n\
  \n你也可以使用 `void` 关键字创建一个仅使用一次的函数。它会被立即调用，并且在调用后就不再存在了。\n\n#### void-function-example.js\n\
  \n```javascript\n// 定义一个函数，并调用它。\nvoid function sayHello()  {console.log(\"Hello\
  \ Everyone\");}();\ntry  {\n// 这个函数不存在。\nsayHello();}\n}catch(e)  {\nconsole.log(e);\
  \ // ReferenceError: sayHello is not defined\n} \n```\n\n# 第 15 章：类与对象\n\n1. 你的第一个类\n\
  2. Getter & Setter\n3. 静态属性\n4. 静态方法\n5. 对象比较运算符\n\n## 1 你的第一个类\n\n下面，我有一个 `Rectangle`（矩形），它有两个重要的属性：`width`\
  \ 和 `height`。我们将使用 ES6 语法定义一个名为 `Rectangle` 的类来模拟它。\n\n![](img/image_rsrc8T3.jpg)\n\
  \n创建一个资源文件 `rectangle.js`：\n\n### rectangle.js\n\n```javascript\n// 定义一个类。\nclass\
  \ Rectangle  {\n// 带有 2 个参数的构造函数。\n// (用于实例化)\n// this.width 指向类的宽度属性\nconstructor\
  \ (width = 5 , height = 10)  {this.width = width;this.height = height;}\n// 一个方法计算矩形的面积。\n\
  getArea() {var area = this.width * this.height\nreturn area}}\n// 通过构造函数创建 Rectangle\
  \ 的对象。\nvar rect = new Rectangle(3, 5);\nconsole.log(\"Height \"+ rect.height);\n\
  console.log(\"Width \"+ rect.width);\n// 调用方法\nlet area = rect.getArea();\nconsole.log(\"\
  Area \"+ area );\n```\n\n运行示例：\n\n**输出**\nHeight 5\nWidth 3\nArea 15\n\n当你从类的构造函数创建一个对象时会发生什么？\n\
  \n![](img/image_rsrc8T4.jpg)\n\n当你调用类的构造函数时，会创建一个新对象，对象的属性将从参数中赋值。\n\n在 ECMAScript\
  \ 中，每个类最多只有一个构造函数。像函数一样，构造函数的参数也可以有默认值。因此你可以以不同的方式创建对象。\n\n```javascript\n// width\
  \ = 3, height = 5\nlet rect = new Rectangle(3, 5);\n// width = 15, height = 10 (默认值)\n\
  let rect2 = new Rectangle(15);\n// width = 5 (默认值), height = 50\nlet rect3 = new\
  \ Rectangle(undefined, 50);\n// width = 5 (默认值), height = 10 (默认值)\nlet rect4 =\
  \ new Rectangle();\n```\n\n## 2 Getter & Setter\n\n在给出 Getter & Setter 的概念之前，让我们先分析一种情况：\n\
  \n假设我们有一个 `Person` 类，这个类有一个名为 `name` 的属性。\n\n#### Class Person\n\n```javascript\n\
  class Person  {constructor(name) {this.name = name;}}\n```\n\n你可以访问对象的属性，或者给它赋新值而不会出现任何问题。\n\
  \n```javascript\n// 创建对象\nlet person = new Person(\"Tom\");\n// 访问属性 name。\nconsole.log(\
  \ person.name); // Tom\n// 给属性 name 赋新值。\nperson.name = \"Jerry\"; // !!!\nconsole.log(\
  \ person.name ); // Jerry\n```\n\n在类外部自由属性并更改其值是非常危险的。有时，你希望某个属性无法被访问，或者无法从类外部对其赋新值。Getter/Setter\
  \ 允许你创建这样的属性。\n\n好的，我们重新写一遍 `Person` 类。在没有类参数的方法前加上 `get` 关键字，可以创建一个名称与方法名相同的属性。每当程序访问此属性时，该方法就会被调用。\n\
  \n#### getter-example1.js\n\n```javascript\nclass Person  {\nconstructor (name)\
  \  {//属性: __name\nthis.__name = name;}\n// 属性 name 的 getter\nget name()  {console.log(\"\
  Call getter of property 'name'!!\");\nreturn this.__name;}}\n// ------------ 测试\
  \ -----------------\nlet person = new Person(\"Tom\");\n// 访问属性 'name' ==> 调用 getter\n\
  console.log( person.name); // Tom\n// 给属性 name 赋新值。\nperson.name = \"Jerry\"; //\
  \ 无效!!!!\n// 访问属性 'name' ==> 调用 getter\nconsole.log( person.name); // Tom\n```\n\
  \n在带有一个类参数的方法前加上 `set` 关键字，可以创建一个名称与方法名相同的属性。每当程序为此属性赋新值时，该方法就会被调用。\n\n#### setter-example1.js\n\
  \n```javascript\nclass Person  {constructor (name)  {//属性: __name\nthis.__name =\
  \ name;}\n// 属性 name 的 setter\nset name(newName)  {console.log(\"Call setter of\
  \ property 'name'!!\");\nthis.__name = newName;}\n// 一个方法\nshowInfo()  {console.log(\"\
  Person: \" + this.__name);}}\n// ------------ 测试 -----------------\nlet person =\
  \ new Person(\"Tom\");\n// 无法访问属性 'name'\nconsole.log( person.name); // undefined\n\
  // 为属性 'name' 赋新值 ==> 调用 setter\nperson.name = \"Jerry\";\nperson.showInfo(); //\
  \ Person: Tom\n```\n\n带有 Getter & Setter 的属性示例：\n\n#### getter-setter-example.js\n\
  \n```javascript\nclass Rectangle  {constructor (width = 5 , height = 10)  {this.__width\
  \ = width;this.height = height;}\n// 属性 width 的 getter\nget width()  {return this.__width;}\n\
  // 属性 width 的 setter\nset width(newWidth)  {if(newWidth > 0) {this.__width = newWidth;}\
  \ else{console.log(\"Invalid width \" + newWidth);}}}\n// ------------ 测试 ------------------\n\
  var rect = new Rectangle(3, 5);\nconsole.log(\"Height \"+ rect.height); // Height:\
  \ 5\nconsole.log(\"Width \"+ rect.width); // Width: 3\nrect.width = -100;\nconsole.log(\"\
  Height \"+ rect.height); // Height: 5\nconsole.log(\"Width \"+ rect.width); // Width:\
  \ 3\nrect.width = 100;\nconsole.log(\"Height \"+ rect.height); // Height: 5\nconsole.log(\"\
  Width \"+ rect.width); // Width: 100\n```\n\n**输出**\nHeight 5\nWidth 3\nInvalid\
  \ width -100\nHeight 5\nWidth 3\nHeight 5\nWidth 100\n\n#### 私有属性\n\n```javascript\n\
  class Something {constructor(){this.#someProperty = \"test\";}}\nconst instance\
  \ = new Something();\nconsole.log(instance.#someProperty); // undefined\n```\n\n\
  #### getter-example2.js\n\n```javascript\nclass Person  {constructor (name)  {//\
  \ 私有属性: #name\nthis.#name = name;}\n// 属性 name 的 getter\nget name()  {console.log(\"\
  Call getter of property 'name'!!\");\nreturn this.#name;}}\n```\n\n## 3 静态属性\n\n\
  `static` 关键字出现在 Getter 或 Setter 声明中，帮助你定义一个静态属性。你可以通过类名访问静态属性。\n\n具有固定值（不可更改）的静态属性被称为常量静态属性。\n\
  \nstatic-field-example1.js\n\n\n\n\n\n```javascript\nclass Employee {\n  constructor(fullName,\
  \ age) {\n    this.fullName = fullName;\n    if (age < Employee.MIN_AGE || age >\
  \ Employee.MAX_AGE) {\n      throw \"Invalid Age \" + age;\n    }\n    this.age\
  \ = age;\n  }\n  // 一个静态字段: MIN_AGE\n  static get MIN_AGE() {\n    return 18;\n\
  \  }\n  // 一个静态字段: MAX_AGE\n  static get MAX_AGE() {\n    if (!Employee.__MAXA)\
  \ {\n      Employee.__MAXA = 60;\n    }\n    return Employee.__MAXA;\n  }\n  static\
  \ set MAX_AGE(newMaxAge) {\n    Employee.__MAXA = newMaxAge;\n  }\n}\n// ---- TEST\
  \ ---------\nconsole.log(\"Mininum Age Allowed: \" + Employee.MIN_AGE);\nconsole.log(\"\
  Maximum Age Allowed: \" + Employee.MAX_AGE);\n// 设置新的最大年龄:\nEmployee.MAX_AGE = 65;\n\
  console.log(\"Maximum Age Allowed: \" + Employee.MAX_AGE);\nlet baby = new Employee(\"\
  Some Baby\", 1); // 错误!!\n```\n\n你还有另一种声明类静态字段的方法，但通过这种方式创建的静态字段不会是常量，因为它的值可以改变。以下是一个示例：\n\
  \n`static-field-example2.js`\n\n```javascript\nclass Employee {\n  constructor(fullName,\
  \ age) {\n    this.fullName = fullName;\n    if (age < Employee.MIN_AGE || age >\
  \ Employee.MAX_AGE) {\n      throw \"Invalid Age \" + age;\n    }\n    this.age\
  \ = age;\n  }\n}\nEmployee.MIN_AGE = 18;\nEmployee.MAX_AGE = 60;\n// ---- TEST ---------\n\
  console.log(\"Mininum Age Allowed: \" + Employee.MIN_AGE);\nconsole.log(\"Maximum\
  \ Age Allowed: \" + Employee.MAX_AGE);\n// 设置新的最大年龄:\nEmployee.MAX_AGE = 65;\nconsole.log(\"\
  Maximum Age Allowed: \" + Employee.MAX_AGE);\nlet baby = new Employee(\"Some Baby\"\
  , 1); // 错误!!\n```\n\n## 4. 静态方法\n\n在类方法的声明中出现的 `Static` 关键字可以帮助你定义一个静态方法。你可以通过类名调用静态方法。静态方法不能通过类的对象调用。静态方法通常用作应用程序的工具函数。\n\
  \n![](img/image_rsrc8T5.jpg)\n\n`point.js`\n\n```javascript\nclass Point {\n  constructor(x,\
  \ y) {\n    this.x = x;\n    this.y = y;\n  }\n  // 计算两点之间的距离\n  static distance(point1,\
  \ point2) {\n    const dx = point1.x - point2.x;\n    const dy = point1.y - point2.y;\n\
  \    return Math.hypot(dx, dy);\n  }\n}\n// --- TEST ---\nlet point1 = new Point(5,\
  \ 10);\nlet point2 = new Point(15, 20);\n// 距离\nlet d = Point.distance(point1, point2);\n\
  console.log(\"Distance between 2 points: \" + d);\n```\n\n### 输出\n`Distance between\
  \ 2 points: 14.142135623730951`\n\n## 5. 对象比较运算符\n\n在 ECMAScript 中，通过构造函数创建对象时，内存中会创建一个真实的实体，它有一个指定的地址。\n\
  \n将 `AA` 对象赋值给 `BB` 对象不会在内存中创建新实体，它只是将 `BB` 的地址指向 `AA` 的地址。\n\n![](img/image_rsrc8T6.jpg)\n\
  \n`===` 运算符用于比较两个指向的对象，如果两个对象引用内存中的同一个地址，则返回 true。`!==` 用于比较两个对象指向的地址，如果两个对象指向两个不同的地址，则返回\
  \ true。\n\n`identify-operator-example.js`\n\n```javascript\n// 定义一个类。\nclass Rectangle\
  \ {\n  constructor(width = 5, height = 10) {\n    this.width = width;\n    this.height\
  \ = height;\n  }\n  getArea() {\n    var area = this.width * this.height;\n    return\
  \ area;\n  }\n}\n// 创建对象: r1\nlet r1 = new Rectangle(20, 10);\n// 创建对象: r2\nlet\
  \ r2 = new Rectangle(20, 10);\nlet r3 = r1;\nlet b12 = r1 === r2; // false\nlet\
  \ b13 = r1 === r3; // true\nconsole.log(\"r1 === r2 ? \" + b12); // false\nconsole.log(\"\
  r1 === r3 ? \" + b13); // true\nvar bb12 = r1 !== r2; // true\nvar bb13 = r1 !==\
  \ r3; // false\nconsole.log(\"r1 !== r2 ? \" + bb12); // true\nconsole.log(\"r1\
  \ !== r3 ? \" + bb13); // false\n```\n\n运行示例：\n\n### 输出\n`r1 === r2 ? false`\n`r1\
  \ === r3 ? true`\n`r1 !== r2 ? true`\n`r1 !== r3 ? false`\n\n# 第 16 章：类与继承\n\n##\
  \ 1. JavaScript 中的类\n## 2. ES3 中的类与继承\n## 3. ES5 中的类与继承\n\n## 1. JavaScript 中的类\n\
  \nJavaScript 实际上是一个函数和对象的世界。它最初的设计非常简单，没有的类的概念。也许 JavaScript 的创造者没有考虑到有一天这门语言会被如此广泛地使用。\n\
  \nJavaScript 中的对象意味着一个具有多个“键/值”对的实体，你可以通过对象和键来访问值。\n\n`object-example1.js`\n\n```javascript\n\
  var tom = {name: \"Tom\", country: \"USA\" };\n// 访问：\nconsole.log(tom.name); //\
  \ Tom\nconsole.log(tom.country); // USA\nconsole.log(tom[\"name\"]); // Tom\nconsole.log(tom[\"\
  country\"]); // USA\n```\n\n你可以向现有对象添加新的“键/值”对，或删除它的“键/值”对。\n\n`object-example2.js`\n\
  \n```javascript\nvar tom = {name: \"Tom\", country: \"USA\" };\n// 删除属性 - country\n\
  delete tom[\"country\"]; // 等于: delete tom.country;\n// 添加属性 - gender\ntom[\"gender\"\
  ] = \"Male\"; // 等于: tom.gender = \"Male\";\n// 访问：\nconsole.log(tom.name); // Tom\n\
  console.log(tom[\"name\"]); // Tom\nconsole.log(tom[\"country\"]); // undefined\n\
  console.log(tom.country); // undefined\nconsole.log(tom[\"gender\"]); // Male\n\
  ```\n\n首先，看 ES6 引入的现代语法，创建一个带有返回面积的 `getArea()` 方法的 `Rectangle` 类。\n\n![](img/image_rsrc8T7.jpg)\n\
  \n`es6-example.js`\n\n```javascript\n// ECMAScript 6\nclass Rectangle {\n  constructor(width,\
  \ height) {\n    this.width = width;\n    this.height = height;\n  }\n  getArea()\
  \ {\n    return this.width * this.height;\n  }\n}\n// ------------- 测试\nvar rect\
  \ = new Rectangle(10, 5);\nvar area = rect.getArea();\nconsole.log(\"Width: \" +\
  \ rect.width);\nconsole.log(\"Height: \" + rect.height);\nconsole.log(\"Area: \"\
  \ + area);\n```\n\n通过 ES6 创建一个类的子类非常简单：\n\n`es6-inheritance.js`\n\n```javascript\n\
  class Shape {\n  constructor(x, y) {\n    this.x = x;\n    this.y = y;\n  }\n}\n\
  // 子类\nclass Circle extends Shape {\n  constructor(x, y, radius) {\n    super(x,\
  \ y);\n    this.radius = radius;\n  }\n  getArea() {\n    return Math.PI * this.radius\
  \ * this.radius;\n  }\n}\n// 测试\nvar circle = new Circle(0, 0, 5);\nconsole.log(\"\
  x: \" + circle.x);\nconsole.log(\"y: \" + circle.y);\nconsole.log(\"Area: \" + circle.getArea());\n\
  ```\n\n## 2. ES3 中的类与继承\n\nES3 使用 `function` 关键字来定义“构造函数”。当你使用 `new` 运算符调用此函数时，会创建一个新的对象：\n\
  \n```javascript\n// ECMAScript 3\nfunction Rectangle(width, height) {\n  this.width\
  \ = width;\n  this.height = height;\n}\n// 创建对象\nvar rect = new Rectangle(10, 5);\n\
  ```\n\n下面的图说明了 JavaScript 机器的操作：\n\n![](img/image_rsrcT8.jpg)\n\n* `rect` 对象被创建（它只是一个普通对象）\n\
  * 为 `rect` 对象添加 `__proto__` 属性。这是一个隐藏属性。\n* 该变量将指向 `rect` 对象的地址。\n* 为“rect”对象添加\
  \ `width` 属性。\n* 为 `rect` 对象添加 `height` 属性。\n\n原型概念也引入了 ES3。让我们它的用途：\n\n```javascript\n\
  // ECMAScript 3\nfunction Rectangle(width, height) {\n  this.width = width;\n  this.height\
  \ = height;\n}\nRectangle.prototype.bgColor = \"red\";\nRectangle.prototype.borderColor\
  \ = \"blue\";\n// 创建一个对象\nvar rect = new Rectangle(10, 5);\nconsole.log(rect); //\
  \ Rectangle { width: 10, height: 5 }\nconsole.log(rect.__proto__); // Rectangle\
  \ { bgColor: 'red',borderColor: 'blue' }\nconsole.log(rect.__proto__.bgColor); //\
  \ red\nconsole.log(rect.__proto__.borderColor); // blue\n// （阅读解释）\nconsole.log(rect.bgColor);\
  \ // red\nconsole.log(rect.borderColor); // blue\n```\n\n![](img/image_rsrcT9.jpg)\n\
  \n当 JavaScript 运行时遇到 `myObject.myProperty` 表达式时发生了什么？\n\n答案是它会检查 `myObject` 对象是否存在\
  \ `myProperty` 属性。如果有，它就访问该属性；反之，它访问 `myObject.__proto__.myProperty`。\n\n`es3-proto-example3.js`\n\
  \n```javascript\nvar rect = {\n  __proto__: { bgColor: \"red\", borderColor: \"\
  blue\" },\n  width: 10,\n  height: 5\n};\nconsole.log(rect.width); // 10\nconsole.log(rect.__proto__.bgColor);\
  \ // red\nconsole.log(rect.bgColor); // red\n```\n\n\n\n\n\n# 继承\n\n![](img/image_rsrc8TA.jpg)\n\
  \n在 ES3 中，你可以通过许多不同的方式来模拟继承另一个类的类。当然，这不像在 ES6 中那样那么简单，而且对许多程序员来说这非常困惑。\n\n为了简单起见，我提供了一个继承的示例，并分析了在这种情况下\
  \ JavaScript 运行时的操作规则。\n\n* `Animal` 类拥有 2 个属性：`name` 和 `gender`。\n* `Cat` 类继承自\
  \ `Animal` 类。它有 1 个 `color` 属性。\n\n![](img/image_rsrc8TB.jpg)\n\nes3-inheritance-example1.js\n\
  \n```javascript\nfunction Animal(n, g) {this.name = n;this.gender = g;}function\
  \ Cat(n, g, c) {Animal.call(this, n, g);this.color = c;}var tom = new Cat(\"Male\"\
  , \"Tom\", \"Black\");// Cat { gender: 'Male', name: 'Tom', color: 'Black' }console.log(tom);\n\
  ```\n\n![](img/image_rsrc8TC.jpg)\n\n# 继承与原型链的作用 (ES3)\n\nes3-inheritance-example2.js\n\
  \n```javascript\n// Class: Animal\nfunction Animal(n, g) {this.name = n;this.gender\
  \ = g;}Animal.prototype.sleep = function()  {console.log(\"Animal sleeping..\");}Animal.prototype.move\
  \ = function()  {console.log(\"Animal moving..\");}// Class: Cat\nfunction Cat(n,\
  \ g, c) {Animal.call(this, n, g); // 重要!!this.color = c;}// 重要!!var TempFunc = function()\
  \ {}; // 临时类.TempFunc.prototype = Animal.prototype;Cat.prototype = new TempFunc();//\
  \ ------------------Cat.prototype.cry = function()  {console.log(\"Meo meo\");}//\
  \ 重写 Animal 的 'move' 方法.Cat.prototype.move = function() {console.log(\"Cat moving..\"\
  );}var tom = new Cat(\"Male\", \"Tom\", \"Black\");// Cat { gender: 'Male', name:\
  \ 'Tom', color: 'Black' }console.log(tom);tom.move(); // Cat moving..tom.sleep();\
  \ // Animal sleeping..tom.cry(); // Meo meo\n```\n\n# 3. ES5 中的类与继承\n\n## Object.create(srcObject)\n\
  \n`Object.create(srcObject)` 方法创建一个新的 `newObject` 对象，其中 `newObject.__proto__` 是\
  \ `srcObject` 的拷贝。\n\n![](img/image_rsrc8TD.jpg)\n\nmethod-object-create-example.js\n\
  \n```javascript\nvar john = {name: \"John\",gender: \"Male\"};var other = Object.create(john);console.log(other.__proto__);\
  \ // { name: 'John', gender: 'Male' }\n```\n\n## 继承 (ES5 + Object.create)\n\n使用\
  \ ES5 的 `Object.create(srcObject)` 方法可以帮你比 ES3 更容易地模拟类和继承。\n\nes5-inheritance-example1.js\n\
  \n```javascript\n// Class: Animal\nfunction Animal(n, g) {this.name = n;this.gender\
  \ = g;}Animal.prototype.sleep = function()  {console.log(\"Animal sleeping..\");}Animal.prototype.move\
  \ = function()  {console.log(\"Animal moving..\");}// Class: Cat\nfunction Cat(n,\
  \ g, c) {Animal.call(this, n, g); // 重要!!this.color = c;}Cat.prototype = Object.create(Animal.prototype);\
  \ // 重要!!Cat.prototype.cry = function()  {console.log(\"Meo meo\");}// 重写 Animal\
  \ 的 'move' 方法.Cat.prototype.move = function() {console.log(\"Cat moving..\");}var\
  \ tom = new Cat(\"Male\", \"Tom\", \"Black\");// Cat { gender: 'Male', name: 'Tom',\
  \ color: 'Black' }console.log(tom);tom.move(); // Cat moving..tom.sleep(); // Animal\
  \ sleeping..tom.cry(); // Meo meo\n```\n\n# 第 17 章：继承与多态\n\n1. ECMAScript 中的继承\n\
  2. 方法重写\n3. 抽象方法\n4. 运算符 - instanceof, typeof\n5. 函数实现的多态\n\n## 1. ECMAScript 中的继承\n\
  \nECMAScript 允许你创建一个从一个或多个其他类扩展而来的类。这个类被称为派生类或子类。\n\n子类将从父类继承属性、方法和其他成员。它还可以重写来自父类的方法。在\
  \ ECMAScript 中，每个类只有一个构造函数。如果类本身没有定义它自己的构造函数，它将继承父类的构造函数。相反，如果子类定义了构造函数，它将不会继承父类的构造函数。\n\
  \n我们需要几个类来参与示例。\n\n* `Animal`: 模拟动物的类。\n* `Duck`: `Animal` 的子类。\n* `Cat`: `Animal`\
  \ 的子类。\n* `Mouse`: `Animal` 的子类。\n\n![](img/image_rsrc8TE.jpg)\n\n在 ECMAScript 中，类的构造函数用于创建对象（实例），并为属性赋值。子类的构造函数总是会调用父类的构造函数，以初始化父类属性的值，然后为它自己的属性赋值。\n\
  \n示例：\n\n`Cat` 是继承自 `Animal` 类的类，它也有自己的属性。\n\ninherit-example1.js\n\n```javascript\n\
  class Animal {constructor(name)  {this.name = name;}showInfo()  {console.log(\"\
  I'm \" + this.name);}move()  {console.log(\"Moving..\");}}class Cat extends Animal\
  \ {constructor(name, age, height) {super(name);// Cat's 属性:this.age = age;this.height\
  \ = height;}// 重写父类的方法.showInfo()  {console.log(\"My name is \" + this.name);}//\
  \ 其他方法...sleep()  {console.log(\"Sleeping..\");}}// ------------- 测试 --------------------let\
  \ tom = new Cat(\"Tom\", 3, 20);console.log(\"Call move() method\");tom.move();console.log(\"\
  \\n\");console.log(\"Call showInfo() method\");tom.showInfo();\n```\n\n### 输出\n\n\
  ```\nCall move() method\nMoving..\nCall showInfo() method\nMy name is Tom\n```\n\
  \n当你在从构造函数创建对象时发生了什么？它是如何调用父类构造函数的？请看下方的图：\n\n![](img/image_rsrc8TF.jpg)\n\n通过上面的插图你可以看到，父类的构造函数是在子类的构造函数中调用的，父类的构造函数在子类的构造函数中被调用。\n\
  \n## 2 方法重写\n\n默认情况下，子类从父类继承方法，但父类可以重写方法。\n\ninheritance-example2.js\n\n```javascript\n\
  class Animal {constructor(name) {this.name = name;}showInfo()  {console.log(\"I'm\
  \ \" + this.name);}move()  {console.log(\"Moving..\");}}class Mouse extends Animal\
  \ {constructor(name, age, height) {super(name);this.age = age;this.height = height;}//\
  \ 重写父类的方法.showInfo()  {console.log(\"Age: \" + this.age);console.log(\"Height: \"\
  \ + this.height);}// 重写父类的方法.move()  {console.log(\"Mouse..\");}}// -------------\
  \ 测试 --------------------let jerry = new Mouse(\"Jerry\", 3, 5);console.log(\"Call\
  \ move() method\");jerry.move();console.log(\"\\n\");console.log(\"Call showInfo()\
  \ method\");jerry.showInfo();\n```\n\n### 输出\n\n```\nCall move() method\nMouse..\n\
  Call showInfo() method\nAge: 3\nHeight: 5\n```\n\n## 3 抽象方法\n\n抽象方法或抽象类的概念在 Java、C#\
  \ 等语言中是有定义的。但在 ECMAScript 中没有明确定义。不过，我们有一种方法可以定义它。\n\n作为抽象类的类定义了抽象方法，子类如果想使用这些方法必须重写它们。抽象方法总是抛出“未实现错误”异常。\n\
  \nabstract-example.js\n\n```javascript\n// 一个抽象类。\nclass AbstractDocument {constructor(name)\
  \ {this.name = name}// 该方法不能被使用，因为它总是抛出错误。show() {//未实现错误 throw \"Subclass must\
  \ implement abstract method\";}}class PDF extends AbstractDocument {/* 重写父类的方法 show()\
  \ {console.log(\"Show PDF document:\", this.name);}}class Word extends AbstractDocument\
  \ {show() {console.log(\"Show Word document:\", this.name)}}// --------------------\
  \ 测试 -------------------------let doc1 = new PDF(\"Python tutorial\");let doc2 =\
  \ new Word(\"Java IO Tutorial\");let doc3 = new PDF(\"ECMAScript Date & Time Tutorial\"\
  );let documents = [doc1, doc2, doc3];for (let i = 0; i < documents.length; i++)\
  \ {documents[i].show();}let doc4 = new AbstractDocument(\"An Abstract Document\"\
  );doc4.show(); // 抛出错误!!!\n```\n\n## 4 运算符 - instanceof, typeof\n\n`instanceof`\
  \ 运算符可以帮你检查“某物”是否是某个类的实例。\n\ninstanceof-example.js\n\n\n\n\n\n```javascript\nclass\
  \ Person {}// A Child class of Person\nclass AsianPerson extends Person {}class\
  \ Triangle {}\nlet person = new Person();\nlet asianPerson = new AsianPerson();\n\
  let triangle = new Triangle();\nlet isPerson = person instanceof Person;\nconsole.log(\
  \ isPerson ); // true\nconsole.log( asianPerson instanceof Person ); // true\nconsole.log(\
  \ person instanceof AsianPerson ); // false\nconsole.log( triangle instanceof Person\
  \ ); // false\nconsole.log( triangle instanceof AsianPerson ); // false\n```\n\n\
  ### typeof\n\n`typeof` 运算符用于检查“某些东西”的类型。获得的结果是类型的名称。\n\n`typeof-example.js`\n\n\
  ```javascript\n// 一个类:\nclass Person {}\n// 一个对象:\nlet person = new Person();\n\
  console.log( typeof Person ); // function\nconsole.log( typeof person ); // object\n\
  // null:\nconsole.log( typeof null ); // object\n// 一个数字:\nlet intValue = 100;\n\
  console.log( typeof intValue ); // number\n// NaN (不是一个数字)\nconsole.log( typeof\
  \ NaN); // number\n// 一个字符串\nlet strValue = \"Hello\";\nconsole.log( typeof strValue\
  \ ); // string\n// 一个布尔值:\nlet boolValue = true;\nconsole.log( typeof boolValue\
  \ ); // boolean\n// undefined\nconsole.log( typeof undefined ); // undefined\n//\
  \ 一个数组\nlet years = [1980, 2003, 2018];\nconsole.log( typeof years ); // object\n\
  // 一个函数\nlet myFunc = function()  {}\nconsole.log( typeof myFunc ); // function\n\
  // 一个符号\nlet mySymbol =   Symbol();\nconsole.log( typeof mySymbol ); // symbol\n\
  ```\n\n# 是否为子类\n\n假设你有两个类，`A` 和 `B`。下面的示例帮助你检查 `A` 是否是 `B` 的子类。\n\n`let isChild\
  \ = A === B || A.prototype instanceof B;`\n\n`issubclass-example.js`\n\n```javascript\n\
  class Animal {}\nclass Cat extends Animal {}\nclass AsianCat extends Cat {}\n//\
  \ ------------- 测试 --------------------\nconsole.log(\"AsianCat === Animal? \" +\
  \ (AsianCat === Animal)); // false\nlet isSubClass1 = AsianCat === Animal || AsianCat.prototype\
  \ instanceof Animal;\nconsole.log(\"AsianCat is child of Animal? \" + isSubClass1);\
  \ // true\nlet isSubClass2 = AsianCat === Animal || Animal.prototype instanceof\
  \ AsianCat;\nconsole.log(\"Animal is child of AsianCat? \" + isSubClass2); // false\n\
  ```\n\n### 输出\n\n| isinstance('abc', object): True |\n| :--- |\n| isinstance(123,\
  \ object): True |\n| b = B() |\n| a = A() |\n| isinstance(b, A): True |\n| isinstance(b,\
  \ B): True |\n| isinstance(a, B): False |\n| isinstance(B, A): True |\n| isinstance(A,\
  \ B): False |\n\n# 5  函数中的多态\n\n在这里我创建了两个类，例如 `English` 和 `French`。这两个类都拥有 `greeting()`\
  \ 方法。它们创建了不同的问候语。从上述两个类创建两个对应的对象，并在同一个函数（`intro` 函数）中调用这两个对象的动作。\n\n`polymorphism-example.js`\n\
  \n```javascript\nclass English {\n  greeting() {\n    console.log(\"Hello\");\n\
  \  }\n}\nclass French {\n  greeting() {\n    console.log(\"Bonjour\");\n  }\n}\n\
  function intro(language) {\n  language.greeting();\n}\n// -------------- 测试 ----------------------\n\
  let flora = new English();\nlet aalase = new French();\n// 调用函数:intro(flora);\n\
  intro(aalase);\nlet someObject = {};\nintro(someObject); // Error!!!\n```\n\nOK，修正上述示例的代码，添加必要的检查以避免你的应用程序出现风险：\n\
  \n`polymorphism-example2.js`\n\n```javascript\nclass English {\n  greeting() {\n\
  \    console.log(\"Hello\");\n  }\n}\nclass French {\n  greeting() {\n    console.log(\"\
  Bonjour\");\n  }\n}\nfunction intro(language) {\n  // 检查 'language' 对象的类型\n  if(language\
  \ instanceof English || language instanceof French) {\n    language.greeting();\n\
  \  }\n}\n// -------------- 测试 ----------------------\nlet flora = new English();\n\
  let aalase = new French();\n// 调用函数:intro(flora);\nintro(aalase);\nlet someObject\
  \ = {};\nintro(someObject);\n```\n\n应用“类与继承”架构有助于你的应用程序更易管理并避免错误。\n\n`polymorphism-example3.js`\n\
  \n```javascript\n// 一个基类\nclass Language {}\nclass English extends Language {\n\
  \  greeting() {\n    console.log(\"Hello\");\n  }\n}\nclass French extends Language\
  \ {\n  greeting() {\n    console.log(\"Bonjour\");\n  }\n}\nfunction intro(language)\
  \ {\n  // 检查 'language' 对象的类型\n  if(language instanceof Language) {\n    language.greeting();\n\
  \  }\n}\n// -------------- 测试 ----------------------\nlet flora = new English();\n\
  let aalase = new French();\n// 调用函数:intro(flora);\nintro(aalase);\nlet someObject\
  \ = {};\nintro(someObject);\n```\n\n# 第 18 章：JavaScript Set 集合\n\n1. 集合 (Collections)\
  \ - Set\n2. Set 的方法\n3. WeakSet\n\n## 1 Collections - Set\n\nECMAScript 6 引入了两个新的数据结构，如\
  \ `Map` 和 `Set`。它们是 ECMAScript 集合框架的一部分。\n\n**Maps**: 这种数据结构允许你存储“键/值对”。你可以通过键访问值，或为键更新新值。\n\
  \n**Sets**: 这种数据结构存储一个元素列表，不允许重复，且不对元素进行索引。\n\n在这篇文章中，我将向你介绍 `Set`。\n\n### Set\n\
  \n`Set` 是 ECMAScript6 中引入的一种数据结构。以下是 Set 的特性。\n\n* `Set` 是一个不允许迭代的元素列表。\n* `Set`\
  \ 不对元素进行索引。\n* `Set` 是一个有序列表，这意味着先添加的元素会在前面，第二个添加的元素会在后面。\n\n### 构造函数\n\n通过 `Set`\
  \ 的构造函数创建 `Set` 对象：class \n\n```javascript\nnew Set( [iterable] )\n```\n\n### 参数\n\
  \n* `iterable` - 如果将此对象传递给 `Set` 的构造函数，其所有元素都将添加到 `Set` 中。相反，如果你没有指定此参数，或者其值为 `null`，则创建的\
  \ `Set` 对象将是空的。\n\n### 属性\n\n`set-example.js`\n\n```javascript\n// 从数组创建一个 Set\n\
  var fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\nconsole.log(fruits);\
  \ // Set { 'Apple', 'Banana', 'Papaya' }\n```\n\n`set-size-example.js`\n\n```javascript\n\
  // 从数组创建一个 Set\nvar fruits = new Set( ['Apple','Banana','Papaya'] );\nvar size =\
  \ fruits.size;\nconsole.log(size); // 3\n```\n\n### for..of\n\n你可以使用 `for...of`\
  \ 循环来遍历 `Set` 的元素。\n\n`set-for-of-loop-example.js`\n\n```javascript\n// 从数组创建一个\
  \ Set\nvar fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\nfor(let fruit\
  \ of fruits) {\n  console.log(fruit);\n}\n```\n\n### 输出\n\n| Apple |\n| Banana |\n\
  | Papaya |\n\n## 2 Set 的方法\n\n### add(value)\n\n如果此元素不存在于 `Set` 中，则将其添加到 `Set` 的末尾并返回此\
  \ `Set` 对象。\n\n`set-add-example.js`\n\n```javascript\n// 从数组创建一个 Set\nvar fruits\
  \ = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\n// 将一个元素添加到 Set 并返回此 Set。\nvar\
  \ thisFruits = fruits.add(\"Cherry\");\nconsole.log(fruits); // Set { 'Apple', 'Banana',\
  \ 'Papaya', 'Cherry' }\n// 'Set' 不允许重复\nfruits.add(\"Banana\");\nconsole.log(fruits);\
  \ // Set { 'Apple', 'Banana', 'Papaya', 'Cherry' }\n```\n\n### 输出\n\n| Set { 'Apple',\
  \ 'Banana', 'Papaya', 'Cherry' } |\n| Set { 'Apple', 'Banana', 'Papaya', 'Cherry'\
  \ } |\n\n### delete(value)\n\n此方法用于从 `Set` 中移除一个元素。如果找到了要删除的元素，方法返回 `true`，否则返回\
  \ `false`。\n\n`set-delete-example.js`\n\n```javascript\n// 从数组创建一个 Set\nvar fruits\
  \ = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\nconsole.log(fruits); // Set {\
  \ 'Apple', 'Banana', 'Papaya' }\n// 删除一个元素:\nvar deleted = fruits.delete(\"Banana\"\
  );\nconsole.log(\"Deleted? \" + deleted); // true\nconsole.log(fruits); // Set {\
  \ 'Apple', 'Papaya' }\n```\n\n### clear()\n\n移除 `Set` 中的所有元素。\n\n`set-clear-example.js`\n\
  \n```javascript\n// 从数组创建一个 Set\nvar fruits = new Set( [\"Apple\",\"Banana\",\"\
  Papaya\"] );\nconsole.log(fruits); // Set { 'Apple', 'Banana', 'Papaya' }\n// 移除所有元素。\n\
  fruits.clear();\nconsole.log(fruits); // Set { }\nconsole.log(\"Size after clear:\
  \ \" + fruits.size);\n```\n\n### entries()\n\n此方法返回一个新的迭代器对象，其中每个条目包含一个两个元素的数组，如\
  \ `[value, value]`。条目的顺序仍然与 Set 对象中元素的顺序保持不变。（参见下面的插图）\n\n| ![](img/image_rsrc8TG.jpg)\
  \ |\n\n`set-entries-example.js`\n\n\n\n\n\n```javascript\n// 从一个数组创建一个 Set\nvar\
  \ fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\nconsole.log(fruits); //\
  \ Set { 'Apple', 'Banana', 'Papaya' }\n\n// Iterator 器对象:\nvar iteratorEntries =\
  \ fruits.entries();\nvar entry;\nwhile( !(entry = iteratorEntries.next() ).done\
  \ )  {\n  console.log(entry.value); // [ 'Apple', 'Apple' ]\n}\n```\n\n### has(value)\n\
  \n该方法测试参数提供的值是否存在 Set 中。如果存在则返回 true，否则返回 false。\n\n`set-has-example.js`\n\n```javascript\n\
  // 从一个数组创建一个 Set\nvar fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\nvar\
  \ has = fruits.has(\"Banana\");\nconsole.log(has); // true\n```\n\n### forEach(callbackFn[,\
  \ thisArg])\n\n该方法会为 Set 的每个元素调用一次 `callbackFn` 函数。\n\n```javascript\nmySet.forEach(callbackFn\
  \ [, thisArg])\n```\n\n#### 参数:\n\n- `callbackFn` - 该函数会对应 Set 对象的每个元素被调用一次。\n-\
  \ `thisArg` - 执行 `callbackFn` 函数时用作 `this` 的参数。\n\n`set-forEach-example.js`\n\n\
  ```javascript\n// 从一个数组创建一个 Set\nvar fruits = new Set( [\"Apple\",\"Banana\",\"\
  Papaya\"] );\nconsole.log(fruits); // Set { 'Apple', 'Banana', 'Papaya' }\nfunction\
  \ showFruit(fruit, thisSet) {\n  console.log(\"Fruit: \" + fruit);\n}\n// 或者调用：fruits.forEach(showFruit);\n\
  fruits.forEach(showFruit, fruits);\n```\n\n### key() & values()\n\n`key()` & `values()`\
  \ 方法返回一个新的迭代器，其每个元素的形状为 `{value: aValue, done: false}`。\n\n![](img/image_rsrc8TH.jpg)\n\
  \n`set-values-example.js`\n\n```javascript\n// 从一个数组创建一个 Set\nvar fruits = new Set(\
  \ [\"Apple\",\"Banana\",\"Papaya\"] );\nvar fruitIterator = fruits.values();\nvar\
  \ entry;\nwhile ( !(entry = fruitIterator.next()).done)  {\n  console.log(entry);\
  \ // { value: 'Apple', done: false }\n  console.log(entry.value); // Apple\n}\n\
  ```\n\n#### 运行示例:\n\n输出\n\n```\n{ value: 'Apple', done: false }\nApple\n{ value:\
  \ 'Banana', done: false }\nBanana\n{ value: 'Papaya', done: false }\nPapaya\n```\n\
  \n### mySet[Symbol.iterator]\n\n`Symbol.iterator` 是 `Set` 的特殊属性。默认情况下，`mySet[Symbol.iterator]`\
  \ 的值是 `mySet` 的 `values()` 方法。\n\n`set-symbol-iterator-example.js`\n\n```javascript\n\
  // 从一个数组创建一个 Set\nvar fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\n//\
  \ 等同于：fruits.values()\nvar fruitIterator = fruits[Symbol.iterator]();\nvar entry;\n\
  while ( !(entry = fruitIterator.next()).done)  {\n  console.log(entry); // { value:\
  \ 'Apple', done: false }\n  console.log(entry.value); // Apple\n}\n```\n\n## 3 WeakSet\n\
  \n基本上，`WeakSet` 与 `Set` 非常相似，但它有以下区别：\n\n- `WeakSet` 的元素必须是对象，不能是原始类型。\n- `WeakSet`\
  \ 的元素可以在垃圾回收过程中被移除，垃圾回收是一个移除程序中不再使用的对象的独立过程。\n- `WeakSet` 不支持属性：`size`，因此你无法知道它有多少个元素。\n\
  - `Set` 类中可能提供的许多方法，在 `WeakSet` 中没有，例如 `values()`、`keys()`、`clear()` 等。\n\n####\
  \ 创建一个 WeakSet 对象。\n\n```javascript\nnew Set( [iterable] )\n```\n\n#### 参数:\n\n\
  - `iterable` - 如果将此对象传递给 `WeakSet` 构造函数，它的所有元素都将添加到添加到 `Set` 中。相反，如果你没有指定此参数，或者其值为\
  \ `null`，则创建的 `Set` 对象将是空的。\n\n#### 方法:\n\n`WeakSet` 方法的数量少于 `Set` 方法的数量：\n\n- `WeakSet.add(element)`\n\
  - `WeakSet.delete(element)`\n- `WeakSet.has(element)`\n\n`WeakSet` 中的元素必须是对象，不能是原始类型。\n\
  \n```javascript\nlet w = new WeakSet();\nw.add('a'); // TypeError: Invalid value\
  \ used in weak set\nlet s = new Set();\ns.add('a'); // Works\n```\n\n`weakset-example.js`\n\
  \n```javascript\nvar element1 = {}; // 一个对象\nvar element2 = {foo: \"bar\"};\nvar\
  \ element3 = {bar: \"foo\"};\nvar myWeakSet = new WeakSet( [element1, element2]\
  \ );\nmyWeakSet.add(element3);\nconsole.log(myWeakSet.has(element2)); // true\n\
  ```\n\n# 第 19 章：JavaScript Map 集合\n\n1 Collections - Map\n2 Map 方法\n3 WeakMap\n\n\
  ## 1 Collections - Map\n\nECMAScript 6 引入了两个新的数据结构，如 `Map` & `Set`。它们是 `ECMAScript\
  \ Collections Framework`的一部分。\n\n- `Maps` - 这种数据结构允许你存储“键/值”对。你可以通过键访问值，或者更新对应于键的新值。\n\
  - `Sets` - 这种数据结构存储元素列表，不允许重复且不对元素进行索引。\n\n### Map:\n\n一个 `Map` 对象存储“键/值”，其中键和值可以是原始类型或对象。\n\
  \n- 在 `Map` 对象中，键是可迭代的。\n- `Map` 是一个有序的数据类型，这意味着第一个添加的“键/值”对将排在前面，第二个对将排在后面。\n\n\
  ![](img/image_rsrc8TJ.jpg)\n\n通过 `Map` 类的构造函数创建 Map 对象：\n\n```javascript\nnew Map(\
  \ [iteratorObject] )\n```\n\n#### 参数:\n\n- `iteratorObject` - 可迭代的对象。\n\n`map-size-example.js`\n\
  \n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"0100-1111\", \"Tom\"\
  );\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"0100-2222\", \"\
  Donald\");\nconsole.log(myContacts.size); // 3\n```\n\n### for..of\n\n你可以使用 `for..of`\
  \ 循环来遍历 `Map` 的键/值对。\n\n`map-for-of-loop-example.js`\n\n```javascript\n// 创建一个 Map\
  \ 对象。\nvar myContacts = new Map();\nmyContacts.set(\"0100-1111\", \"Tom\");\nmyContacts.set(\"\
  0100-5555\", \"Jerry\");\nmyContacts.set(\"0100-2222\", \"Donald\");\nfor( let arr\
  \ of myContacts)  {\n  console.log(arr);\n  console.log(\" - Phone: \" + arr[0]);\n\
  \  console.log(\" - Name: \" + arr[1]);\n}\n```\n\n#### 运行示例:\n\n输出\n\n```\n[ '0100-1111',\
  \ 'Tom' ]\n- Phone: 0100-1111\n- Name: Tom\n[ '0100-5555', 'Jerry' ]\n- Phone: 0100-5555\n\
  - Name: Jerry\n[ '0100-2222', 'Donald' ]\n- Phone: 0100-2222\n- Name: Donald\n```\n\
  \n## 2 Map 方法\n\n### set(key, value)\n\n`set(key, value)` 方法如果 `Map` 中不存在该键，则会添加键/值对；如果已存在，则会更新该键的新值。\n\
  \n`map-set-example.js`\n\n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"\
  0100-1111\", \"Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"\
  0100-2222\", \"Donald\");\nmyContacts.set(\"0100-1111\", \"Mickey\");\nconsole.log(myContacts.size);\
  \ // 4\n```\n\n#### 运行示例:\n\n输出\n\n```\nMap {'0100-1111' => 'Mickey', '0100-5555'\
  \ => 'Jerry', '0100-2222' => 'Donald'}\n```\n\n### delete(key)\n\n`delete(key)`\
  \ 方法从 `Map` 对象中删除一个键/值对；如果删除了该对则返回 true，如果该键不存在则返回 false。\n\n`map-delete-example.js`\n\
  \n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"0100-1111\", \"Tom\"\
  );\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"0100-2222\", \"\
  Donald\");\nconsole.log(myContacts.delete(\"0100-5555\")); // true\nconsole.log(myContacts.delete(\"\
  0100-9999\")); // false\nconsole.log(myContacts.size); // 2\n```\n\n#### 运行示例:\n\
  \n输出\n\n```\ntrue\nfalse\nMap {'0100-1111' => 'Tom', '0100-2222' => 'Donald'}\n\
  ```\n\n### has(key)\n\n`has(key)` 方法测试键是否存在于 `Map` 中。如果存在则返回 true，否则返回 false。\n\n\
  `map-has-example.js`\n\n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"\
  0100-1111\", \"Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"\
  0100-2222\", \"Donald\");\nconsole.log(myContacts.has(\"0100-1111\")); // true\n\
  console.log(myContacts.has(\"0100-9999\")); // false\n```\n\n#### 运行示例:\n\n输出\n\n\
  ```\ntrue\nfalse\n```\n\n### clear()\n\n`clear()` 方法从 `Map` 对象中移除所有的键/值对。\n\n`map-clear-example.js`\n\
  \n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"0100-1111\", \"Tom\"\
  );\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"0100-2222\", \"\
  Donald\");\nmyContacts.clear();\nconsole.log(myContacts.size); // 0\n```\n\n####\
  \ 运行示例:\n\n输出\n\n```\n0\n```\n\n### size\n\n`size` 属性返回 `Map` 中键/值对的数量。\n\n`map-size-example.js`\n\
  \n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"0100-1111\", \"Tom\"\
  );\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"0100-2222\", \"\
  Donald\");\nconsole.log(myContacts.size); // 3\n```\n\n#### 运行示例:\n\n输出\n\n```\n\
  3\n```\n\n\n\n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"0100-1111\"\
  , \"Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"0100-2222\"\
  , \"Donald\");\nvar entries = myContacts.entries();\nvar entry;\nwhile (!(entry\
  \ = entries.next()).done ) {\n  var array = entry.value;\n  console.log(array);\n\
  }\n```\n\n运行示例：\n\n输出：\n\n| '0100-1111', 'Tom' |\n| '0100-5555', 'Jerry' |\n| '0100-2222',\
  \ 'Donald' |\n\n### keys()\n\n该方法返回一个新的 `Iterator` 对象，帮助你访问 Map 的键。\n\n![](img/image_rsrc8.jpg)\n\
  \nmap-keys-example.js\n\n```javascript\nvar data = [[\"0100-1111\", \"Tom\"], [\"\
  0100-5555\", \"Jerry\"], [\"0100-2222\", \"Donald\"]];\nvar myContacts = new Map(data);\n\
  var iteratorPhones = myContacts.keys();\nvar entry;\nwhile (!(entry = iteratorPhones.next()).done\
  \ ) {\n  var phone = entry.value;\n  console.log(phone);\n}\n```\n\n运行示例：\n\n输出：\n\
  \n| 0100-1111 |\n| 0100-5555 |\n| 0100-2222 |\n\n### values()\n\n该方法返回一个新的 `Iterator`\
  \ 对象，帮助你访问 Map 的值。\n\n![](img/image_rsrc8.jpg)\n\nmap-values-example.js\n\n```javascript\n\
  var data = [[\"0100-1111\", \"Tom\"], [\"0100-5555\", \"Jerry\"], [\"0100-2222\"\
  , \"Donald\"]];\nvar myContacts = new Map(data);\nvar iteratorNames = myContacts.values();\n\
  var entry;\nwhile (!(entry = iteratorNames.next()).done ) {\n  var name = entry.value;\n\
  \  console.log(name);\n}\n```\n\n### forEach(callbackFn [, thisArg])\n\n该方法会为 Map\
  \ 对象的每个“键/值对”调用一次 `callbackFn` 函数。\n\n```javascript\nmyMap.forEach(callback[, thisArg])\n\
  ```\n\n参数：\n\n- `callbackFn` - 该函数会对应 Map 的每个“键/值对”调用一次。\n- `thisArg` - 在执行 `callbackFn`\
  \ 时该参数的用法所示。\n\nmap-forEach-example.js\n\n```javascript\nvar showContact = function(key,\
  \ value, thisMap) {\n  console.log(\"Phone: \" + key + \". Name: \" + value);\n\
  }\nvar data = [[\"0100-1111\", \"Tom\"], [\"0100-5555\", \"Jerry\"], [\"0100-2222\"\
  , \"Donald\"]];\nvar myContacts = new Map(data);\n// 或者调用：myContacts.forEach(showContact)\n\
  myContacts.forEach(showContact, myContacts);\n```\n\n运行示例：\n\n输出：\n\n| Phone: 0100-1111.\
  \ Name: Tom |\n| Phone: 0100-5555. Name: Jerry |\n| Phone: 0100-2222. Name: Donald\
  \ |\n\n## 3 WeakMap\n\n基本上，`WeakMap` 与 `Map` 非常相似，但存在以下差异：\n\n- 它的键必须是对象。\n- `WeakMap`\
  \ 的键可以在垃圾回收过程中被消除，这是一个移除程序中不再使用的对象的独立过程。\n- `WeakMap` 不支持 `size` 属性，因此你无法知道它有多少个元素。\n\
  - `Map` 类中提供的许多方法，但 `WeakMap` 类没有这些方法，例如 `values()`、`keys()`、`entries()`、`clear()`\
  \ 等。\n\n创建一个 `WeakMap` 对象。\n\n```javascript\nvar map2 = new WeakMap( [iteratorObject]\
  \ )\n```\n\n参数：\n\n- `iteratorObject` - 任何可迭代的对象。\n\n方法：\n\n`WeakMap` 的方法数量少于 `Map`\
  \ 的方法：\n\n- `WeakMap.delete(key)`\n- `WeakMap.get(key)`\n- `WeakMap.has(key)`\n\
  - `WeakMap.set(key, value)`\n\n`WeakMap` 中的键必须是对象。不能是原始类型（Primitive）。\n\n```javascript\n\
  let w = new WeakMap();\nw.set('a', 'b'); // Uncaught TypeError: 使用无效的值作为 weak map\
  \ key\nlet m = new Map();\nm.set('a', 'b'); // 正常工作\n```\n\nweakmap-example.js\n\
  \n```javascript\nvar key1 = {}; // 一个对象\nvar key2 = {foo: \"bar\"};\nvar key3 =\
  \ {bar: \"foo\"};\nvar data = [[key1, \"Tom\"], [key2, \"Jerry\"], [key3, \"Donald\"\
  ]];\nvar myWeakMap = new WeakMap(data);\nconsole.log(myWeakMap.get(key1));\n```\n\
  \n## 第 20 章：理解可迭代对象和迭代器\n\n## 1 迭代 (Iteration)\n## 2 迭代器 (Iterator) 概念\n## 3 可迭代对象\
  \ (Iterable) 概念\n\nECMAScript 提供了一种与数据结构交互的新方式。现在我们来澄清。\n\n你需要区分两个概念：\n\n- **迭代器\
  \ (Iterator)**\n- **可迭代对象 (Iterable)**\n\n#### 2 迭代器\n\n在 ECMAScript 中，如果一个对象包含指向下一个元素的指针，则它被称为**迭代器**。迭代器具有一个\
  \ `next()` 方法，该方法返回一个包含 `value` 和 `done` 属性的对象。如果迭代已完成，`done` 为 `true`，否则为 `false`。\n\
  \n![](img/image_rsrc8.jpg)\n\niterator-object-example.js\n\n```javascript\n// 一个对象\n\
  let myObject = {\n  prop1: \"某个值\",\n  [Symbol.iterator] : function() {\n    console.log(\"\
  我是迭代器\");\n    return {\n      next: function() {\n        return {value: \"some\
  \ value\", done: true };\n      }\n    }\n  }\n}\n```\n\n#### 3 可迭代对象\n\n在语言层面，如果一个对象包含一个集合，并提供了一种公开该集合的方法，则它被称为**可迭代对象**。例如，数组就是可迭代对象，因为它包含元素集合。\n\
  \n技术上，在 ECMAScript 中，被称为**可迭代对象**的对象必须有一个 `Symbol.iterator` 键，该键的方法返回一个迭代器对象。\n\n\
  object-with-properties.js\n\n```javascript\n// 一个对象\nlet myObject = {\n  prop1:\
  \ \"某个值 1\",\n  prop2: \"某个值 2\",\n  prop3: \"一百\",\n  [Symbol.iterator] : function()\
  \ {\n    console.log(\"我是迭代器\");\n    return {\n      next: function() {\n     \
  \   return {value: \"某个值\", done: true };\n      }\n    }\n  }\n}\n```\n\n\n\n\n\
  ```html\n<!DOCTYPE html><html><head><title>Some Page</title><meta charset=\"UTF-8\"\
  ></head><body onload=\"alert('menubar.visible? ' + menubar.visible)\"><<h3>Some\
  \ Page</h3><p>1</p><p>1 2</p><p>1 2 3</p></body></html>\n```\n\n# 第 22 章：JavaScript\
  \ JSON\n\n## 1. 什么是 JSON\n## 2. `JSON.parse(..)`\n## 3. `JSON.stringify(..)`\n\n\
  ### 1 什么是 JSON\n\n如你所知，数据始终通过互联网环境从一台计算机传输到另一台计算机，并在发送之前封装成特定的格式。接收者必须理解这种格式才能分析原始数据。\n\
  \n`XML` 是一种非常常用的存储和传输数据的格式。\n\n| ![](img/image_rsrc8TW.jpg) |\n\nJSON 代表 JavaScript\
  \ 对象表示法（JavaScript Object Notation）。它也是一种存储和传输数据的格式。JSON 格式源于 JavaScript 的对象语法，因此它继承了简单性，并且完全基于文本。\n\
  \n| ![](img/image_rsrc8TX.jpg) |\n\n下面是一个在 Javascript 中声明对象的代码片段：\n\n#### Javascript\
  \ 对象\n```javascript\nvar aCompany = {name : \"Amazon\",ceo : \"Jeff Bezos\",employees:\
  \ [{firstName: \"John\", lastName: \"Doe\"},{firstName: \"Anna\", lastName: \"Smith\"\
  },{firstName: \"Peter\", lastName: \"Jones\"}]};\n```\n\n以及以 JSON 格式存储的相同数据：\n\n\
  #### JSON 数据\n```json\n{\"name\" : \"Amazon\",\"ceo\" : \"Jeff Bezos\",\"employees\"\
  :[{\"firstName\":\"John\", \"lastName\":\"Doe\"},{\"firstName\":\"Anna\", \"lastName\"\
  :\"Smith\"},{\"firstName\":\"Peter\", \"lastName\":\"Jones\"}]}\n```\n\n#### JSON\
  \ 的优点：\n\n* JSON 是一种轻量级的数据交换格式。\n* JSON 数据自包含描述，因此每个人都能轻松理解。\n* JSON 是一种独立的语言，也是一种文本。你可以使用任何语言来读取或创建\
  \ JSON 数据。大多数编程语言都有用于读写 JSON 库。\n\n### 示例：\n```javascript\n// JSON 对象:{\"firstName\"\
  :\"John\", \"lastName\":\"Doe\"}\n// JSON 数组:[{\"firstName\":\"John\", \"lastName\"\
  :\"Doe\"},{\"firstName\":\"Anna\", \"lastName\":\"Smith\"},{\"firstName\":\"Peter\"\
  , \"lastName\":\"Jones\"}]\n```\n\n#### Note：：\n\nJSON 纯粹是一种数据格式——它只包含属性，不包含方法。\n\
  \nJSON 要求在字符串和属性名周围使用双引号。单引号是无效的。\n\n即使是一个位置放置错误的逗号或冒号，也可能导致 JSON 文件出错并无法工作。你应该仔细地验证你正尝试使用的任何数据。\n\
  \n### 2 `JSON.parse(..)`\n\n使用 `JSON.parse(text)` 方法可以帮你解析 JSON 数据并将其转换为对象。\n\n\
  `json-parse-example.js`\n```javascript\nvar text = '{ '+ ' \"name\": \"Amazon\"\
  , '+ ' \"ceo\" : \"Jeff Bezos\", '+ ' \"employees\" : ['+ '    { \"firstName\":\"\
  John\" , \"lastName\":\"Doe\" },'+ '    { \"firstName\":\"Anna\" , \"lastName\"\
  :\"Smith\" },'+ '    { \"firstName\":\"Peter\" , \"lastName\":\"Jones\" } '+ ' \
  \ ] '+ '}';\nvar obj = JSON.parse(text);\nconsole.log(obj.employees);\nconsole.log(obj.ceo);\
  \ // Jeff Bezos\nconsole.log(obj.employees[0].firstName); // John\nconsole.log(obj.employees[1].firstName);\
  \ // Anna\nconsole.log(obj.employees[2].firstName); // Peter\n```\n\n| ![](img/image_rsrc8TY.jpg)\
  \ |\n\n`json-parse-example.html`\n```html\n<!DOCTYPE html><html><head><title>JSON.parse</title></head><body><div\
  \ style=\"border:1px solid #ccc;padding:5px;\"><h3 id=\"name\"></h3><i id=\"location\"\
  ></i></div><script>var s = '{\"firstName\" : \"Sammy\", \"lastName\" : \"Shark\"\
  , \"location\" : \"Ocean\"}';var obj = JSON.parse(s);document.getElementById(\"\
  name\").innerHTML = obj.firstName + \" \" + obj.lastName;document.getElementById(\"\
  location\").innerHTML = obj.location;</script></body></html>\n```\n| ![](img/image_rsrc8TZ.jpg)\
  \ |\n\n### 3 `JSON.stringify(..)`\n\n使用 `JSON.stringify(obj)` 方法可以帮你将 Javascript\
  \ 对象转换为 JSON 格式的文本。\n\n`json-stringify-example1.js`\n```javascript\nvar obj = {name\
  \ : \"tran\", age : 39};\nvar text = JSON.stringify(obj);\nconsole.log(text); //\
  \ {\"name\":\"tran\",\"age\":39}\n```\n\n#### `JSON.stringify(obj)`\n\n`JSON.stringify(obj)`\
  \ 方法用于将 `obj` 转换为 `String`。如果 `obj` 对象具有 `toJSON()` 方法，将调用该方法来返回 `String`。相反，它将按照默认规则进行转换：\n\
  \n* 数字、布尔、字符串将转换为原始值。\n* `Infinity`、`NaN` 将转换为 `null`。\n* 如果 `obj` 是 `undefined`、`Function`、`Symbol`，它将转换为\
  \ `undefined`。\n* 如果对象中出现 `undefined`、`Function`、`Symbol`，它们将被跳过。\n* 如果数组中出现 `undefined`、`Function`、`Symbol`，它们将被转换为\
  \ `null`。\n* 所有具有如 `Symbol` 等键的属性将被跳过。\n* `Date` 对象具有 `toJSON()` 方法，返回的是字符串（例如 `date.toISOString()`），因此它被处理为字符串。\n\
  \n`json-stringify-example2.js`\n```javascript\nvar obj = {name : \"tran\",age :\
  \ 39,//对象中的函数会被忽略\nsayHello : function()  {console.log(\"Hello\");},//数组中的 undefined,\
  \ Symbol, function 将转换为 null.\"\"others\": [\"1\", Symbol(), undefined, function(){},\
  \ \"2\"]};\nvar text = JSON.stringify(obj);\nconsole.log(text); // {\"name\":\"\
  tran\",\"age\":39,\"others\":[\"1\",null,null,null,\"2\"]}\n```\n\n### 示例：\n\n`json-stringify-example.js`\n\
  ```javascript\nJSON.stringify({});                   // '{}'\nJSON.stringify(true);\
  \                // 'true'\nJSON.stringify('foo');               // '\"foo\"'\n\
  JSON.stringify([1, 'false', false]);    // '[1,\"false\",false]'\nJSON.stringify([NaN,\
  \ null, Infinity]); // '[null,null,null]'\n```\n\n\n\n\n\n```javascript\nvar obj\
  \ = {name: \"Tom\",gender: \"Male\",company:\"Walt Disney\",friends: [{name:\"Jerry\"\
  , gender:\"Male\"},{name:\"Donald\", gender: \"Male\"}]};\nvar replacer = [\"name\"\
  , \"friends\"];\nvar json = JSON.stringify(obj, replacer);\nconsole.log(json); //\
  \ {\"name\":\"Tom\",\"friends\":[{\"name\":\"Jerry\"},{\"name\":\"Donald\"}]}\n\
  ```\n\n使用函数作为 `replacer` 参数示例：\n\n`json-stringify-replacer-example2.js`\n\n```javascript\n\
  function replacer(key, value) {\n  console.log(typeof key);\n  console.log(key);\n\
  \  // 过滤属性\n  if (typeof value === 'string') {\n    return undefined;\n  }\n  return\
  \ value;\n}\nvar obj = {foundation: 'Mozilla',model: 'box',week: 45,transport: 'car',month:\
  \ 7};\nvar json = JSON.stringify(obj, replacer);\nconsole.log(json); // '{\"week\"\
  :45,\"month\":7}'\n```\n\n# 第 23 章：JavaScript 事件处理\n\n## 1. JavaScript 事件\n\n##\
  \ 2. 事件示例\n\n事件是表示某些事情发生的信号。例如，你点击了一个按钮，或者你关闭了浏览器……所有 DOM 节点都会产生此类信号，但除了 DOM 还有其他事件，例如你关闭浏览器窗口的事件。\n\
  \n以下是最实用的 DOM 事件列表：\n\n### 鼠标事件：\n\n| 事件 | 说明 |\n| :--- | :--- |\n| click | 当用户点击元素时触发的事件\
  \ |\n| contextmenu | 当用户在元素上右键点击以打开上下文菜单时触发事件 |\n| dblclick | 当用户双击元素时触发的事件 |\n\
  | mousedown | 当用户在元素上按下鼠标键时触发事件 |\n| mouseup | 当用户在元素上释放鼠标键时触发事件 |\n| mouseenter\
  \ | 当指针移动到元素上时触发事件 |\n| mouseleave | 当指针移出元素时触发触发事件 |\n| mousemove | 当指针在元素上移动时触发事件\
  \ |\n| mouseout | 当用户将鼠标指针移出元素，或移出其任一子元素时触发事件 |\n| mouseover | 当指针移动到元素或移动到其任一子元素时触发事件\
  \ |\n\n### 表单元素事件：\n\n| 事件 | 说明 |\n| :--- | :--- |\n| submit | 当用户提交 `<form>` 时触发\
  \ |\n| focus | 当用户聚焦某个元素（例如 `<input>`）时触发 |\n| blur | 当用户离开某个元素（例如 `<input>`）时触发\
  \ |\n\n### 键盘事件：\n\n| 事件 | 说明 |\n| :--- | :--- |\n| keydown | 当用户按下键时触发的事件 |\n|\
  \ keyup | 当用户释放键时触发的事件 |\n| keypress | 当用户按下键时触发的事件 |\n\n### 文档事件：\n\n| 事件 | 说明\
  \ |\n| :--- | :--- |\n| DOMContentLoaded | 当 HTML 内容加载并处理完成后触发。DOM 模型已完全创建。 |\n\n\
  ### CSS 事件：\n\n| 事件 | 说明 |\n| :--- | :--- |\n| animationstart | 当 CSS 动画开始时触发的事件\
  \ |\n| animationend | 当 CSS 动画完成时触发的事件 |\n| animationiteration | 当 CSS 动画重复时触发的事件\
  \ |\n\n### 事件处理：\n\n要处理事件，你需要将事件绑定到处理器（handler）上。处理器可以是一个函数。当事件发生时，将调用该处理器进行操作。处理器是运行与用户动作对应的\
  \ JavaScript 代码的一种。\n\n可以在 HTML 中通过 `on{event}` 属性设置处理器。例如，点击事件：\n\n```html\n<input\
  \ value=\"Click me\" onclick=\"alert('Click!')\" type=\"button\">\n<input value=\"\
  Click me\" onclick=\"someFunction()\" type=\"button\">\n```\n\n`this` 对象代表产生事件元素。\n\
  \n```html\n<input value=\"Click me\" onclick=\"someFunction(this)\" type=\"button\"\
  >\n```\n\n当事件发生时，JavaScript 会创建一个 `event` 对象，你可以将其作为参数的值使用。\n\n```html\n<input value=\"\
  Click me\" onclick=\"someFunction(event)\" type=\"button\">\n```\n\n你也可以通过 `event`\
  \ 对象访问产生事件元素。\n\n```javascript\nvar target = event.target;\n```\n\n## 2. 事件示例\n\n\
  简单且经常遇到的事件是用户点击元素的事件。下面是一个简单的示例。用户点击 `=` 按钮来计算两个数字之和。\n\n!![](img/image_rsrc8U0.jpg)\n\
  \n`onclick-example.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Hello\
  \ Javascript</title>\n  <script type=\"text/javascript\">\n    function doCalculate()\
  \ {\n      var a = document.getElementById(\"a\").value; // 一个字符串值\n      var b\
  \ = document.getElementById(\"b\").value; // 一个字符串值\n      var c = Number(a) + Number(b);\n\
  \      document.getElementById(\"c\").value = c;\n    }\n  </script>\n</head>\n\
  <body>\n  <h3>Click Event example</h3>\n  <input id=\"a\" type=\"text\" value=\"\
  100\"/> <br/>\n  + <br/>\n  <input id=\"b\" type=\"text\" value=\"200\"/> <br/>\n\
  \  = <br/>\n  <input id=\"c\" type=\"text\"/>\n  <button onclick=\"doCalculate()\"\
  >Calculate</button>\n</body>\n</html>\n```\n\n`this` 对象代表产生事件元素。\n\n`this-obj-example.html`\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Event Example</title>\n  <script\
  \ type=\"text/javascript\">\n    function changeSize(evt) {\n      var target =\
  \ evt.target;\n      var random = Math.round(Math.random() * 100) + 100;\n     \
  \ target.style.width = random + \"px\";\n      target.style.height = random + \"\
  px\";\n    }\n  </script>\n</head>\n<body>\n  <h3>Access 'target' object via 'event'\
  \ object</h3>\n  <button onclick=\"changeSize(event)\">Click Me to Change Size</button>\n\
  </body>\n</html>\n```\n\n`mouse-events-example.js`\n\n```javascript\nvar enterCount\
  \ = 0;\nvar moveCount = 0;\nvar leaveCount = 0;\n\nfunction mouseleaveHandler(evt)\
  \ {\n  leaveCount += 1;\n  showPosition(evt);\n}\nfunction mouseenterHandler(evt)\
  \ {\n  enterCount += 1;\n  showPosition(evt);\n}\nfunction mousemoveHandler(evt)\
  \ {\n  moveCount += 1;\n  showPosition(evt);\n}\nfunction showPosition(evt) {\n\
  \  var html = \"offsetX: \" + evt.offsetX + \"<br/>\" + \"offsetY: \" + evt.offsetY;\n\
  \  document.getElementById(\"position-div\").innerHTML = html;\n}\nfunction showStatistics()\
  \ {\n  var html = \"enterCount:\" + enterCount + \"<br/>\" + \"moveCount:\" + moveCount\
  \ + \"<br/>\" + \"leaveCount:\" + leaveCount;\n  document.getElementById(\"statistics-div\"\
  ).innerHTML = html;\n}\n```\n\n`mouse-events-example.html`\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n  <title>Javascript Events</title>\n  <style>\n    .my-div\
  \ {\n      width: 100px;\n      height: 100px;\n      background: blue;\n    }\n\
  \  </style>\n</head>\n<body>\n  <h3>Mouse Events (Enter, Move, Leave)</h3>\n  <div\
  \ class=\"my-div\" onmouseenter=\"mouseenterHandler(event)\" onmouseleave=\"mouseleaveHandler(event)\"\
  \ onmousemove=\"mousemoveHandler(event)\">\n    Hover over me\n  </div>\n  <h3>Mouse\
  \ position</h3>\n  <div id=\"position-div\"></div>\n  <h3>Statistics</h3>\n  <div\
  \ id=\"statistics-div\"></div>\n  <script src=\"mouse-events-example.js\"></script>\n\
  </body>\n</html>\n```\n\n`event-obj-example.html`\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n  <title>Event Example</title>\n  <script type=\"text/javascript\"\
  >\n    function changeSize(evt) {\n      var target = evt.target;\n      var random\
  \ = Math.round(Math.random() * 100) + 100;\n      target.style.width = random +\
  \ \"px\";\n      target.style.height = random + \"px\";\n    }\n  </script>\n</head>\n\
  <body>\n  <h3>Access 'target' object via 'event' object</h3>\n  <button onclick=\"\
  changeSize(event)\">Click Me to Change Size</button>\n</body>\n</html>\n```\n\n\
  （由于原文在某些示例中存在部分乱码，我已根据逻辑补全了对应的 HTML 结构以确保翻译清晰：\n*注：原文后半部分存在大量重复和断裂的 HTML 代码，已根据代码逻辑进行了整理翻译。*）\n\
  \n\n\n\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n  <title>事件示例</title>\n  <script\
  \ type=\"text/javascript\">\n    function changeSize(borderColor, target, evt, bgColor)\
  \ {\n      var random = Math.round(Math.random() * 100) + 100;\n      target.style.width\
  \ = random + \"px\";\n      target.style.height = random + \"px\";\n      target.style.borderColor\
  \ = borderColor;\n      target.style.backgroundColor = bgColor;\n    }\n  </script>\n\
  </head>\n<body>\n  <h3>处理器具有多个参数</h3>\n  <a href=\"\">重置</a> <br/><br/>\n  <button\
  \ onclick=\"changeSize('red', this, event, 'green')\">点击我</button>\n</body>\n</html>\n\
  ```\n\n# 第 24 章：Javascript 鼠标事件（MouseEvent）\n\n## 1 鼠标事件\n\n`MouseEvent` 是一个接口，代表用户与指针设备（如鼠标）交互时发生的事件，常见事件包括\
  \ `click`、`dbclick`、`mousedown`、`mouseup` 等。\n\n`MouseEvent` 是 `UIEvent` 的子接口。\n\
  \n![](img/image_rsrc8U3.jpg)\n\n### MouseEvent 的事件类型：\n\n| 事件 | 说明 |\n| :--- | :---\
  \ |\n| `click` | 用户点击元素时触发事件 |\n| `contextmenu` | 用户在元素上点击右键以打开右键菜单时触发事件 |\n| `dblclick`\
  \ | 用户双击元素时触发事件 |\n| `mousedown` | 用户在元素上按下鼠标按钮时触发事件 |\n| `mouseup` | 用户在元素上释放鼠标按钮时触发事件\
  \ |\n| `mouseenter` | 指针移动到元素内部时触发事件 |\n| `mouseleave` | 指针移出元素外部时触发事件 |\n| `mousemove`\
  \ | 当针在元素或其子元素上移动时，持续触发事件。 |\n| `mouseout` | 当用户将鼠标指针移出元素，或移出其子元素之一时触发事件 |\n| `mouseover`\
  \ | 指针移动到元素内部或其某个子元素内部时触发事件 |\n\n### `mousedown`, `mouseup`, `click`\n\n让我们从鼠标事件中最常见的\
  \ `click` 事件开始。它由按下和释放组成。`click` 事件如下所示：\n\n![](img/image_rsrc8U4.jpg)\n\n### `dbclick`\n\
  \n如果你快速点击 2 次，它将创建一个 `dbclick` 事件。\n\n### `mouseover` vs `mouseenter`\n\n`mouseenter`\
  \ 事件在光标进入元素时触发。`mouseover` 事件在光标进入元素或其任一子元素时触发。\n\n![](img/image_rsrc8U5.jpg)\n\n\
  ### `mouseleave` vs `mouseout`\n\n`mouseleave` 事件在光标移出元素时触发。`mouseout` 事件在光标移出元素或其任一子元素时触发。\n\
  \n![](img/image_rsrc8U6.jpg)\n\n以下示例可以帮助你对比 `mouseenter` 与 `mouseover`，`mouseleave`\
  \ 与 `mouseout`：\n\n![](img/image_rsrc8U7.jpg)\n\nenter-vs-over-leave-vs-out.html\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Javascript 鼠标事件</title>\n \
  \ <script src=\"enter-vs-over-leave-vs-out.js\"></script>\n  <style>\n    #target-div\
  \ {width: 320px;height: 150px;background: blue;}\n    #target-div > div {width:\
  \ 50px;height: 80px;margin: 40px 0 0 40px;padding: 5px 0 0 5px;float: left;background:\
  \ yellow;}\n  </style>\n</head>\n<body>\n  <h3>mouseenter vs mouseover</h3>\n  <h3>mouseleave\
  \ vs mouseout</h3>\n  <div id=\"target-div\"onmouseenter=\"mouseenterHandler(event)\"\
  onmouseover=\"mouseoverHandler(event)\"onmouseleave=\"mouseleaveHandler(event)\"\
  onmouseout=\"mouseoutHandler(event)\">\n    <div>子元素</div>\n    <div>子元素</div>\n\
  \    <div>子元素</div>\n  </div>\n  <h3>统计数据：</h3>\n  <div style=\"color:red;\" id=\"\
  statistics-div\"></div>\n</body>\n</html>\n```\n\nenter-vs-over-leave-vs-out.js\n\
  \n```javascript\nvar enterCount = 0;\nvar overCount = 0;\nvar leaveCount = 0;\n\
  var outCount = 0;\nfunction mouseenterHandler(evt) {\n  enterCount += 1;\n  showStatistics();\n\
  }\nfunction mouseoverHandler(evt) {\n  overCount += 1;\n  showStatistics();\n}\n\
  function mouseleaveHandler(evt) {\n  leaveCount += 1;\n  showStatistics();\n}\n\
  function mouseoutHandler(evt) {\n  outCount += 1;\n  showStatistics();\n}\nfunction\
  \ showStatistics() {\n  var html =\"enterCount:\" + enterCount + \"<br/>\" //+\"\
  overCount:\" + overCount  + \"<hr/>\" //+\"leaveCount:\" + leaveCount + \"<br/>\"\
  \ //+\"outCount:\" + outCount ;\n  document.getElementById(\"statistics-div\").innerHTML\
  \ = html;\n}\n```\n\n### `mousemove`\n\n![](img/image_rsrc8U8.jpg)\n\nmousemove-example.html\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Javascript 鼠标事件</title>\n \
  \ <script src=\"mousemove-example.js\"></script>\n  <style>\n    #target-div {width:\
  \ 320px;height: 150px;background: blue;margin-bottom: 50px;}\n    #target-div >\
  \ div {width: 50px;height: 150px;margin: 40px 0 0 40px;padding: 5px 0 0 5px;float:\
  \ left;background: yellow;}\n  </style>\n</head>\n<body>\n  <h3>mousemove 示例</h3>\n\
  \  <div id=\"target-div\" onmousemove=\"mousemoveHandler(event)\">\n    <div>子元素</div>\n\
  \    <div>子元素</div>\n    <div>子元素</div>\n  </div>\n  <h3>统计数据：</h3>\n  <div style=\"\
  color:red;\" id=\"statistics-div\"></div>\n</body>\n</html>\n```\n\nmousemove-example.js\n\
  \n```javascript\nvar moveCount = 0;\nfunction mousemoveHandler(evt) {\n  moveCount\
  \ += 1;\n  showStatistics();\n}\nfunction showStatistics() {\n  var html = \"moveCount:\"\
  \ + moveCount;\n  document.getElementById(\"statistics-div\").innerHTML = html;\n\
  }\n```\n\n## 2 属性与方法\n\n`MouseEvent` 是 `UIEvent` 的子接口，因此它继承了这些属性和方法。\n\n### Key（键）\n\
  \n| 属性 | 说明 |\n| :--- | :--- |\n| `altKey` | 按 ALT 键时触发事件则为 true。 |\n| `ctrlKey`\
  \ | 按 CTRL 键时触发事件则为 true。 |\n| `shiftKey` | 按 SHIFT 键时触发事件则为 true。 |\n| `metaKey`\
  \ | 按 META 键时触发事件则为 true。 |\n\n### `ctrlKey` 属性示例：\n\n![](img/image_rsrc8U9.jpg)\n\
  \nprop-ctrlKey-example.html\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Javascript\
  \ 鼠标事件</title>\n  <style>#target-div {width: 320px;height: 150px;background: blue;margin-bottom:\
  \ 10px;}</style>\n  <script>\n    function clickHandler(evt) {\n      var html =\
  \ \"evt.ctrlKey=\" + evt.ctrlKey;\n      document.getElementById(\"log-div\").innerHTML\
  \ = html;\n    }\n  </script>\n</head>\n<body>\n  <h3>按下 Ctrl 键并点击</h3>\n  <div\
  \ id=\"target-div\" onclick=\"clickHandler(event)\"></div>\n  <div style=\"color:red;\"\
  \ id=\"log-div\"></div>\n</body>\n</html>\n```\n\n### 位置（Position）：\n\n| 属性 | 说明\
  \ |\n| :--- | :--- |\n| `clientX` | 相对于窗口的水平坐标。 |\n| `clientY` | 相对于窗口的垂直坐标。 |\n\
  | `offsetX` | 相对于元素边缘的水平坐标。 |\n| `offsetY` | 相对于元素边缘的垂直坐标。 |\n| `pageX` | 相对于文档的水平坐标。\
  \ |\n| `pageY` | 相对于文档的垂直坐标。 |\n| `screenX` | 相对于屏幕（设备）的水平坐标。 |\n| `screenY` | 相对于屏幕（设备）的垂直坐标。\
  \ |\n| `movementX` | 相对于上一次鼠标移动位置的水平坐标。 |\n| `movementY` | 相对于上一次鼠标移动位置的垂直坐标。 |\n\
  \n![](img/image_rsrc8UA.jpg)\n\n![](img/image_rsrc8UB.jpg)\n\nprop-positions-example.html\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Javascript 鼠标事件</title>\n \
  \ <script src=\"prop-positions-example.js\"></script>\n  <style>#target-div {width:\
  \ 300px;height: 210px;background: #ccc;margin: 0px 0px 10px 20px;padding: 5px;}</style>\n\
  </head>\n<body style=\"height:450px; width:1000px;\">\n  <h3>位置</h3>\n  <div id=\"\
  target-div\" onmousemove=\"mousemoveHandler(event)\"></div>\n</body>\n</html>\n\
  ```\n\nprop-positions-example.js\n\n\n\n\n\n```javascript\nfunction mousemoveHandler(evt)\
  \ {\n  var html = \"offsetX = \" + evt.offsetX + \"<br/>\" + \"offsetY = \" + evt.offsetY\
  \ + \"<br/>\" + \"clientX = \" + evt.clientX + \"<br/>\" + \"clientY = \" + evt.clientY\
  \ + \"<br/>\" + \"pageX = \" + evt.pageX + \"<br/>\" + \"pageY = \" + evt.pageY\
  \ + \"<br/>\" + \"screenX = \" + evt.screenX + \"<br/>\" + \"screenY = \" + evt.screenY\
  \ + \"<br/>\" + \"movementX = \" + evt.movementX + \"<br/>\" + \"movementY = \"\
  \ + evt.movementY;\n  document.getElementById(\"target-div\").innerHTML = html;\n\
  }\n```\n\n### Button\n\n| Property | Description |\n| :--- | :--- |\n| button |\
  \ 返回一个数字，描述在鼠标事件触发时按下了哪个鼠标键 |\n| buttons | 返回一个数字，描述在鼠标事件触发时按下了哪些鼠标键 |\n\n### event.button:\n\
  \n- 0: 主键，通常是左键或未初始化状态\n- 1: 辅助键，通常是滚轮键或中间键（如果存在）\n- 2: 次键，通常是右键\n- 3: 第四键，通常是浏览器的后退按钮\n\
  - 4: 第五键，通常是浏览器的前进按钮\n\n### event.buttons:\n\n- 0 : 无按键按下或未初始化\n- 1 : 主键，通常是左键。\n\
  - 2 : 次键，通常是右键。\n- 4 : 辅助键，通常是鼠标滚轮键或中间键。\n- 8 : 第四键，通常是“浏览器后退”按钮。\n- 16 : 第五键，通常是“浏览器前进”按钮。\n\
  \n`event.buttons` 可能会返回上述值之外的不同值。例如，当你同时按下左鼠标和右鼠标时，`event.buttons` 将返回 `3`。\n\n\
  `prop-button-buttons-example.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  \  <title>MouseEvent Example</title>\n  <script>\n    function mousedownHandler(evt)\
  \ {\n      var logDiv = document.getElementById(\"log-div\");\n      logDiv.innerHTML\
  \ = \"event.button= \" + evt.button + \"<br/>\" + \"event.buttons= \" + evt.buttons;\n\
  \    }\n  </script>\n</head>\n<body>\n  <h3>event.button, event.buttons</h3>\n \
  \ <button onmousedown=\"mousedownHandler(event)\">点击我!</button>\n  <br/><br/>\n\
  \  <div id=\"log-div\" style=\"color:red;\"></div>\n</body>\n</html>\n```\n\n!![](img/image_rsrc8UC.jpg)\n\
  \n# 第 25 章：Javascript WheelEvent\n\n## 1 WheelEvent\n\n`WheelEvent` 是一个接口，表示当用户移动滚轮或类似设备时发生的事件。\n\
  \n`WheelEvent` 意味着 `MouseEvent` 的子接口。它将继承父接口的所有属性和方法。\n\n!![](img/image_rsrc8UD.jpg)\n\
  \n| Event | Description |\n| :--- | :--- |\n| wheel | 当鼠标滚轮在元素上向上或向下滚动时触发的事件 |\n\
  \n### WheelEvent 的属性：\n\n| Property | Description |\n| :--- | :--- |\n| deltaX |\
  \ 返回鼠标滚轮的水平滚动量（x 轴） |\n| deltaY | 返回鼠标滚轮的垂直滚动量（y 轴） |\n| deltaZ | 返回鼠标滚轮在 z 轴上的滚动量\
  \ |\n| deltaMode | 返回一个代表 delta 值测量单位的数字（DOM_DELTA_PIXEL, DOM_DELTA_PIXEL, DOM_DELTA_PAGE）\
  \ |\n\n### 使用 WheelEvent 的示例：\n\n!![](img/image_rsrc8UE.jpg)\n!![](img/image_rsrc8UF.jpg)\n\
  \n`wheelevents-example.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>WheelEvent\
  \ Example</title>\n  <script src=\"wheelevents-example.js\"></script>\n</head>\n\
  <body>\n  <h3>WheelEvent 示例</h3>\n  <div style=\"font-size:12px; padding:5px; border:1px\
  \ solid #ccc;\" onwheel=\"wheelHandler(event)\">大家好！<div></div></div>\n</body>\n\
  </html>\n```\n\n`wheelevents-example.js`\n\n```javascript\nfunction wheelHandler(evt)\
  \ {\n  var fontSize = evt.target.style.fontSize;\n  // 12px, 13px,...\n  var value\
  \ = Number(fontSize.substr(0, fontSize.length-2)); // 12, 13,..\n  // 向上滚动\n  if\
  \ (evt.deltaY < 0) {\n    if (value < 50) {\n      value++;\n    }\n  }\n  // 向下滚动\n\
  \  if (evt.deltaY > 0) {\n    if (value > 5) {\n      value--;\n    }\n  }\n  evt.target.style.fontSize\
  \ = value + \"px\";\n}\n```\n\n!![](img/image_rsrc8UG.jpg)\n\n# 第 26 章：Javascript\
  \ KeyboardEvent\n\n## 1 KeyboardEvent\n## 2 属性与方法\n## 3 表：Key, KeyCode\n\n## 1 KeyboardEvent\n\
  \n`KeyboardEvent` 是一个接口，表示用户与键盘交互时发生的事件，包括 `keydown`, `keypress`, `keyup` 事件。\n\n\
  `KeyboardEvent` 是 `UIEvent` 的子接口。\n\n!![](img/image_rsrc8UH.jpg)\n\n| Order | Event\
  \ |\n| :--- | :--- |\n| 1 | onkeydown |\n| 2 | onkeypress |\n| 3 | onkeyup |\n\n\
  ### keydown\n\n当你按下按键时，会触发 `keydown` 事件。在 Windows OS 中，如果你持续按住按键，它会不断发出 `keydown`\
  \ 和 `keypress` 事件。但在 MacOS 中，如果你持续按住按键，它会不断发出 `keydown` 事件。如下所示。\n\n!![](img/image_rsrc8UJ.jpg)\n\
  \n### keypress\n\n`keypress` 发生在 2 种情况，其中情况 1 如我上面所述的（查看 `keydown` 事件）。情况 2 是你按下按键并释放。\n\
  \n!![](img/image_rsrc8UK.jpg)\n\n### keyup\n\n当你释放按键时，会触发 `keyup` 事件。注意：如果你想检测按键被触发了，可以使用\
  \ `keydown`、`keypress` 或 `keyup` 属性。\n\n`keyevents.html`\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n  <title>KeyEvent Example</title>\n  <script src=\"keyevents.js\"\
  ></script>\n</head>\n<body>\n  <h3>KeyEvent 示例</h3>\n  <input type=\"text\" onkeydown=\"\
  keydownHandler(event)\" onkeyup=\"keyupHandler(event)\" onkeypress=\"keypressHandler(event)\"\
  />\n  <br/><br/>\n  <textarea rows=\"10\"></textarea>\n  <br/>\n  <button onclick=\"\
  clearLog()\">清除</button>\n</body>\n</html>\n```\n\n`keyevents.js`\n\n```javascript\n\
  function keydownHandler(evt) { appendLog(\"keydown!\"); }\nfunction keyupHandler(evt)\
  \ { appendLog(\"keyup!\"); }\nfunction keypressHandler(evt) { appendLog(\"keypress!\"\
  ); }\nfunction appendLog(text) {\n  var oldText = document.getElementById(\"log-div\"\
  ).value;\n  document.getElementById(\"log-div\").value = oldText + \"\\n\" + text;\n\
  }\nfunction clearLog() { document.getElementById(\"log-div\").value = \"\"; }\n\
