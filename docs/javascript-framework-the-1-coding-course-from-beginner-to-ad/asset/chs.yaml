  \ [, endIndex])`: 该方法返回由两个位置（如 `beginIndex` 和 `endIndex`）确定的子字符串。如果 `beginIndex`\
  \ 位置位于右侧而 `endIndex` 位于左侧，则返回的字符串始终为空。\n\n|![](img/image_rsrc8RD.jpg\n\nslice-example.js\n\
