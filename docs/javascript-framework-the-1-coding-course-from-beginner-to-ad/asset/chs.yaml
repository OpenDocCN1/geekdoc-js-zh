  if(name == \"\") {\n  alert(\"Please enter your name\");\n  return false;\n}\nreturn\
  \ true;\n}\nfunction submitByJavascript()  {var valid = validateForm();\nif(!valid)\
  \  {\n  return;\n}\nvar myForm = document.forms[\"myForm\"];\nmyForm.submit();\n\
  }\n</script>\n</head>\n<body>\n<h2>Submit a from with Javascript</h2>\n<div style=\"\
