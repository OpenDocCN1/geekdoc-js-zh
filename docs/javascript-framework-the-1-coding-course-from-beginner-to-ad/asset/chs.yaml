  \ result3 = str.substring(4, 1);\nvar result4 = str.substring(1, 4);\nconsole.log(result3);\
  \ // his\nconsole.log(result4); // his\n```\n\n# 第 9 章：JavaScript if else 语句\n\n\
  1. `if` 语句\n2. `if - else` 语句\n3. `if - else if - else` 语句\n4. 条件表达式涉及的运算符\n\n##\
  \ 1. `if` 语句\n\n`if(condition)` 语句评估条件以决定是否执行其块。\n\n以下是 `if` 语句的结构：\n\n```javascript\n\
  if (condition)  { 在这里操作！ }\n```\n\n`condition` 可以是任何值、类型或表达式。ECMAScript 使用 `Boolean(condition)`\
  \ 函数进行评估。该函数返回 true 或 false。\n\n下图说明如何评估 ECMAScript 的条件：\n\n|![](OEBPS/image_rsrc8RG.jpg\n\
  \nsimple-if-example.js\n\n\n\n\n\n```javascript\nif(true) { // Workconsole.log(\"\
  Test 1\");}if(false) { // Not work!console.log(\"Test 2\");}\n```\n**输出**\n| Test\
  \ 1 |\n\n`if-example.js`\n```javascript\nif(true) { // Workconsole.log(\"if(true)\"\
  );}if(false) { // Not work!console.log(\"if(false)\");}if('true') { // Workconsole.log(\"\
  if('true')\");}if('false') { // Not work!console.log(\"if('false')\")}var obj =\
  \ new Object();if(obj) { // Workconsole.log(\"if(obj)\");}if('') { // Not work!console.log(\"\
  if('')\");}if(undefined) { // Not work!console.log(\"if(undefined)\");}if(0) { //\
  \ Not work!console.log(\"if(0)\");}\n```\n**输出**\n| if(true)if('true')if('false')if(obj)\
  \ |\n\n`if-example2.js`\n```javascript\nvar number0 = 0;if(number0) { // Not work!console.log(\"\
  number 0 (primitive)\");if(false) { // Not work!console.log(\"boolean false (primitive)\"\
  );}// A not null Objectvar myObj = {};if(myObj) { // Work!console.log(\"A not null\
  \ Object\");}// A not null Objectvar numberObject = new Number(0);if(numberObject)\
  \ { // Work!console.log(\"A not null Object (Number)\");}// A not null Objectvar\
  \ booleanObject = new Boolean(false);if(booleanObject) { // Work!console.log(\"\
  A not null Object (Boolean)\");}\n```\n**输出**\n| A not null ObjectA not null Object\
  \ (Number)A not null Object (Boolean) |\n\n`if-example3.js`\n```javascript\n// 声明一个变量，代表你的年龄\
  \ let age = 30;console.log(\"Your age: \" + age);// 要测试的条件是 'age> 20'if (age > 20)\
  \ {console.log(\"Okey!\");console.log(\"Age is greater than 20\");// 'if' 块之后的代码。console.log(\"\
  Done!\");\n```\n**输出**\n| Your age: 30Okey!Age is greater than 20Done! |\n\n## 2\
  \ if - else 语句\n\n`if-else` 命令也用于检查条件。它使用 `Boolean(condition)` 函数来评估条件。如果评估结果为真，则将执行\
  \ `if` 块。相反，将执行 `else` 块。\n\n```javascript\nif( condition ) { //在此处执行某些操作}// Elseelse\
  \ { 在此处执行某些操作}\n```\n\n!![](img/image_rsrc8RH.jpg)\n\n**示例：**\n\n`if-else-example.js`\n\
  ```javascript\n// 声明一个变量，代表你的年龄 let age = 15;console.log(\"Your age: \" + age);//\
  \ 要测试的条件是 'age> 18'if (age >= 18) {console.log(\"Okey!\");console.log(\"You are\
  \ accepted!\");} else {console.log(\"Sorry!\");console.log(\"Age is less than 18\"\
  );// 'if' 块和 'else' 块之后的代码。console.log(\"Done!\");\n```\n**输出**\n| Your age: 15Sorry!Age\
  \ is less than 18Done! |\n\n## 3 if - else if - else 语句\n\n`if - else if - else`\
  \ 语句的结构如下：\n\n```javascript\nif(condition 1) { //在此处执行某些操作} else if(condition 2){//在此处执行某些操作}\
  \ else if(condition 3){//在此处执行某些操作}// Elseelse { 在此处执行某些操作}\n```\n\n!![](img/image_rsrc8RJ.jpg)\n\
  \n`if-elseif-else-example.js`\n```javascript\n// 声明一个变量\n// 代表你的测试分数 let score =\
  \ 70;console.log(\"Your score =\" + score);// 如果分数小于 50if (score < 50) {console.log(\"\
  You are not pass\");}// 如果分数大于或等于 50 且小于 80.else if (score >= 50 && score < 80)\
  \ {console.log(\"You are pass\");}// 剩余情况（即大于或等于 80）else {console.log(\"You are\
  \ pass, good student!\");}\n```\n**输出**\n| Your age: 15Sorry!Age is less than 18Done!\
  \ |\n\n## 4 涉及条件表达式的运算符\n\n这是一列在条件表达式中常用的运算符。\n\n- `>` 大于\n- `<` 小于\n- `>=` 大于等于\n\
  - `<=` 小于等于\n- `&&` 与 (AND)\n- `||` 或 (OR)\n- `==` 等于\n- `!=` 不等于\n- `!` 非\n\n**示例：**\n\
  \n`if-elseif-else-example2.js`\n```javascript\n// 声明一个变量，代表你的年龄 let age = 20;//\
  \ 测试 age 是否小于或等于 17if (age <= 17) {console.log(\"You are 17 or younger\");// 测试\
  \ age 等于 18else if (age == 18) {console.log(\"You are 18 year old\");// 测试 age 是否大于\
  \ 18 且小于 40else if (age > 18 && age < 40) {console.log(\"You are between 19 and\
  \ 39\");// 剩余情况（大于或等于 40）else{//嵌套的 if 语句// 测试 age 不等于 50.if (age != 50) {console.log(\"\
  You are not 50 year old\");//// 否定语句 if (!(age == 50)) {console.log(\"You are not\
  \ 50 year old\");}// 如果 age 等于 60 或 70if (age == 60 || age == 70) {console.log(\"\
  You are 60 or 70 year old\");}}\n```\n**输出**\n| You are between 19 and 39 |\n\n\
  # 第 10 章：JavaScript Switch 语句\n\n## 1 switch 语句的结构\n### 2 `switch` 示例\n### 3 switch\
  \ 中的 `break` 语句\n\n## 1 switch 语句的结构\n\n语法\n\n```javascript\n// variable_to_test:\
  \ 一个待测试的变量 switch ( variable_to_test ) {case value1://在此处执行某些操作 ...break;case value2//在此处执行某些操作\
  \ ...break;default://在此处执行某些操作...}\n```\n\n`switch` 语句的特性：\n\n`switch` 将检查变量的值，并从上到下将变量与每个不同的值进行比较。每个要比较的值被称为\
  \ `case`。当某个 `case` 为真时，将执行该 case 的语句块。\n\n!![](img/image_rsrc8RK.jpg)\n\n如果所有 cases\
  \ 都为假，将执行 `default` 语句块。注意：在 `switch` 语句的结构中，可能也可能没有 `default` 语句块。\n\n!![](img/image_rsrc8RM.jpg)\n\
  \n当找到 true case 时，将执行该 case 的语句块。如果此块中没有满足 `break` 语句，程序将继续执行下方的块，直到遇到 `break` 语句或没有语句块需要执行。\n\
  \n`break` 语句使程序退出 `switch`。（见下图）。\n\n!![](img/image_rsrc8RN.jpg)\n\n注意 `case` 语句是一个特定的值，你不能进行以下操作：\n\
  \n```javascript\n// 这是不允许的 !!case (age < 18) :// case 仅接受特定值，例如:case 18://在此处执行某些操作\
  \ ..break;\n```\n\n### 2 `switch` 示例\n\n`switch-example.js`\n```javascript\n// 声明一个变量\
  \ agelet age = 20;// 检查年龄的值 witch (age) {// Case age = 18case 18:console.log(\"\
  You are 18 year old\");break;// Case age = 20case 20:console.log(\"You are 20 year\
  \ old\");break;// 剩余情况 default:console.log(\"You are not 18, 20 year old\");}\n\
  ```\n**输出**\n| You are 20 year old |\n\n### 3 switch 中的 `break` 语句\n\n`break` 意味着一种出现在\
  \ `case` 块或 `switch` 的 `default` 块中的语句。当遇到 `break` 语句时，程序将退出 `switch`。\n\n!![](img/image_rsrc8RP.jpg)\n\
  \n当程序遇到 `switch` 语句时，它将从上到下检查 cases。当找到 true case 时，将执行该 case 的语句块。\n\n**示例：**\n\
  \n`switch-example2.js`\n```javascript\n// 声明一个变量 agelet age = 30;// 检查年龄的值 witch\
  \ (age) {// Case age = 18case 18:console.log(\"You are 18 year old\");break;// Case\
  \ age = 30case 30:console.log(\"You are 30 year old\");break;// 剩余情况 default:console.log(\"\
  Other age\");}\n```\n**输出**\n| You are 30 year old |\n\n# 第 11 章：JavaScript 错误处理\n\
  \n## 1 什么是错误\n## 2 使用 `try-catch` 处理错误\n### 3 `try-catch-finally`\n### 4 内置错误\n\
  ### 5 抛出错误 (Throw)\n### 6 `Error` 的属性\n### 7 重新抛出错误 (Re-throw)\n### 8 捕捉错误时的异常\n\
  \n## 1 什么是错误\n\n首先，让我们来看一个示例，其中我调用了一个对象的方法，但这个对象实际上没有这个方法，结果发生了错误。\n\n`hello-error-example.js`\n\
  ```javascript\nconsole.log(\"Three\");let myObj = {};console.log(\"Two\");console.log(\"\
  One\");// 对象 myObj 没有 showMe() 方法// 但我们调用了 showMe().// 在此处发生错误。myObj.showMe(); //\
  \ ==> 错误！！ 以及后续代码将不会执行。console.log(\"Let's go!\");\n```\n\n请通过下面的插图查看程序的流程。\n\n\
  !![](img/image_rsrc8RR.jpg)\n\n*   程序在步骤 (1), (2), (3), (4) 中完全正常运行\n\n*   在步骤 (5)\
  \ 中，当你尝试调用对象方法而该对象没有该方法时，发生了错误。\n\n*   步骤 (6) 中的代码将不会执行。\n\n\n\n\n程序运行过程中可能会发生错误。这可能是一个意外之外的错误。使用\
  \ `try-catch` 可以帮助你在错误发生时捕获并处理它们。\n\n回到上面的示例，我们添加 `try-catch` 来捕获并处理错误。\n\n`hello-catch-example.js`\n\
  \n```javascript\nconsole.log(\"Three\");\nlet myObj = {};\nconsole.log(\"Two\");\n\
  console.log(\"One\");\ntry {\n  // 对象 myObj 没有 showMe() 方法。\n  // 但我们调用了 showMe()。\n\
  \  // 这里发生了错误。\n  myObj.showMe(); // ==> Error!\n  // 这段代码将被忽略\n  console.log (\"\
  !!!\");\n} catch (e) {\n  console.log(\"Catched error: \" + e);\n  console.log(\"\
  OK continue...\");\n}\nconsole.log(\"Let's go!\");\n```\n\n运行该示例的结果如下：\n\nOutput\n\
  ThreeTwoOneCatched error: TypeError: myObj.showMe is not a functionOK continue...Let's\
  \ go!\n\n下面的插图解释了程序的流程：\n\n![](img/image_rsrc8RS.jpg)\n\n*   步骤 (1)-(4) 是完全正常的。\n\
  *   在步骤 (5) 发生异常，此时你尝试调用一个对象的方法，而该对象并没有该方法。\n*   程序立即跳转并执行 `catch` 块中的命令。步骤 (6)\
  \ 被忽略了。\n*   步骤 (7)、(8) 将执行。\n*   步骤 (9) 将执行。\n\n### 3. try-catch-finally\n\n我们已经习惯了通过\
  \ `try-catch` 块来捕获错误。`try-catch-finally` 用于完整处理错误。无论 `try` 块中是否发生错误，`finally` 块始终会被执行。\n\
  \n```javascript\ntry {\n  // 在此处做一些操作\n} catch (e ) {\n  // 在此处做一些操作\n} finally\
  \  {\n  // finally 块始终会被执行\n  // 在此处做一些操作\n}\n```\n\n示例：\n\n`try-catch-finally-example.js`\n\
  \n```javascript\nfunction getGreeting(language) {\n  try {\n    console.log(\"Code\
  \ in try block (*)\");\n    // 调用对象 'language' 的 greeting() 方法\n    // 如果此对象没有 greeting()\
  \ 方法，此处可能会抛出异常。\n    let v = language.greeting();\n    console.log(\"Code in try\
  \ block (**)\");\n    return v;\n  } catch (e) {\n    console.log(\"Code in catch\
  \ block. Something Error: \" + e);\n  } finally {\n    // finally 块始终会被执行。\n   \
  \ console.log(\"Code in finally block\");\n  }\n  return \" !! \";\n}\n// -----------------------\
  \ 测试 -------------------------------------\n// 测试 1:\nconsole.log(\"----- Call getGreeting(null)\
  \ -----\");\nlet v1 = getGreeting(null);\nconsole.log(\"Greeting: \" + v1);\n  //\
  \ 测试 2:\nconsole.log(\"------ Call getGreeting(language) ------\");\nlet language\
  \ = new Object();\nlanguage.greeting = function() {\n  return \"Hello Everybody\"\
  \n}\nlet v2 = getGreeting(language);\nconsole.log(\"Greeting: \" + v2);\n```\n\n\
  运行示例：\n\nOutput\n----- Call getGreeting(null) -----Code in try block (*)Code in\
  \ catch block. Something Error: TypeError: Cannot read property 'greeting' of nullCode\
  \ in finally blockGreeting: !!----- Call getGreeting(language) -----Code in try\
  \ block (*)Code in try block (**)Code in finally blockGreeting: Hello Everybody\n\
  \n下面的插图展示了当 `try` 块中发生错误时的程序流程，`finally` 块始终会被执行。\n\n![](img/image_rsrc8RT.jpg)\n\
  \n下面的图显示了当 `try` 块中没有发生错误时的程序流程。在这种情况下，`finally` 块会在 `try` 块的 `return` 命令执行之前立即执行。\n\
  \n![](img/image_rsrc8RU.jpg)\n\n### 4. 内置错误\n\n`ECMAScript` 提供了几个内置类来表示错误。以下是它们的层级结构。\n\
  \n![](img/image_rsrc8RV.jpg)\n\n#### RangeError\n如果你使用了允许范围之外的数字，会抛出 `RangeError`。\n\
  \n`error-RangeError-example.js`\n\n```javascript\nlet num = 1;\ntry {\n  // 数字不能有\
  \ 500 位有效数字\n  num.toPrecision(500); // ==> RangeError!!\n} catch(err) {\n  console.log(err.name);\n\
  \  console.log(err);\n}\n```\n\n#### ReferenceError\n如果你使用了未声明的变量，会抛出 `ReferenceError`：\n\
  \n`error-ReferenceError-example.js`\n\n```javascript\nvar x;\ntry {\n  x = y + 1;\
  \   // 无法引用 y（使用）\n} catch(err) {\n  console.log(\"Error Name: \"+ err.name);\n\
  \  console.log(err);\n}\n```\n\n#### SyntaxError\n如果你尝试评估带有语法错误的代码，会抛出 `SyntaxError`。\n\
  \n`error-SyntaxError-example.js`\n\n```javascript\ntry {\n  let x;\n  eval(\" x\
  \  = 'Hello  \");  // 缺少 ' 会产生错误\n  try {\n    let x;\n    eval(\" x  = 'Hello \
  \ \");  // 缺少 ' 会产生错误\n  } catch(err) {\n    console.log(\"Error Name: \" + err.name);\n\
  \    console.log(err);\n  }\n} catch(err) {\n  console.log(\"Error Name: \" + err.name);\n\
  \  console.log(err);\n}\n```\n\n#### TypeError\n如果你使用了与预期类型不符的值，会抛出 `TypeError`。例如，当你调用一个对象的方法而该对象没有该方法时，就会发生错误。\n\
  \n`error-TypeError-example.js`\n\n```javascript\nvar num = 1;\ntry {\n  num.toUpperCase();\
  \ // 数字没有 toUpperCase 方法\n} catch(err) {\n  console.log(\"Error Name: \" + err.name);\n\
  \  console.log(err);\n}\n```\n\n#### URIError\n如果你在 URI 函数中使用非法字符，会抛出 `URIError`：\n\
  \n`error-URIError-example.js`\n\n```javascript\ntry {\n  decodeURI(\"%%%\");  //\
  \ 你不能对百分号进行 URI 解\n} catch(err) {\n  console.log(\"Error Name: \" + err.name);\n\
  \  console.log(err);\n}\n```\n\n### 5. Throw 出错误\n\n`ECMAScript` 允许你在程序运行期间抛出任何内容。程序将认为错误刚刚发生。\n\
  \n`throw-any-example.js`\n\n```javascript\nconsole.log(\" -------- Test throw any\
  \ object ------------\");\ntry {\n  let myObj = {};\n  throw myObj;\n} catch(e)\
  \  \n  console.log(\"Catch error: \");\n  console.log(e);\n}\nconsole.log(\" --------\
  \ Test throw a Symbol ------------\");\ntry {\n  let mySymbol = Symbol();\n  throw\
  \ mySymbol;\n} catch(e)  \n  console.log(\"Catch error: \");\n  console.log(e);\n\
  }\nconsole.log(\" -------- Test throw a Number ------------\");\ntry {\n  let myNumber\
  \ = 100;\n  throw myNumber;\n} catch(e)  \n  console.log(\"Catch error: \");\n \
  \ console.log(e);\n}\nconsole.log(\" -------- Test throw a String ------------\"\
  );\ntry {\n  let myString = \"Some error\";\n  throw myString;\n} catch(e)  \n \
  \ console.log(\"Catch error: \");\n  console.log(e);\n}\n```\n\n（注：原文代码块中存在多处语法错误如缺少大括号，翻译时已保持逻辑一致并对齐）\n\
  \nOutput\n -------- Test throw any object ------------Catch error: {} -------- Test\
  \ throw a Symbol ------------Catch error: Symbol() -------- Test throw a Number\
  \ ------------Catch error: 100 -------- Test throw a String ------------Catch error:\
  \ Some error\n\n\n\n\n```javascript\nlet err = new Error(\"My Error\");\nlet rangeErr\
  \ = new RangeError();\nlet evalErr = new EvalError(\"My Eval Error\");\n// [0..\
  \ 9] 中的一个随机值\nlet randomValue = Math.floor(Math.random() * 10);\n// [0,1,2,3]\n\
  let random0123 = randomValue % 4;\nconsole.log(\"random0123 = \" + random0123);\n\
  try {\n  if(random0123 == 0) {\n    throw err;\n  } else if(random0123 == 1) {\n\
  \    throw rangeErr;\n  } else if(random0123 == 2) {\n    throw evalErr;\n  } else\
  \ if(random0123 == 3) {\n    throw \"A String Error\";\n  }\n} catch(e) {\n  console.log(\"\
  typeof e = \" + (typeof e));\n  // 'object' 或 'string'\n  if(e instanceof RangeError)\
  \ {\n    console.log(\"--> RangeError!!\");\n  } else if(e instanceof EvalError)\
  \ {\n    console.log(\"--> EvalError!!\");\n  } else if(e instanceof Error) {\n\
  \    console.log(\"--> Error!!\");\n  } else if (typeof e == \"string\") {\n   \
  \ console.log(\"--> String Error!!\");\n  } else {\n    console.log(\"--> Error!!\"\
  );\n  }\n  console.log(e);\n}\n```\n\n# 6 Error 的属性\n\n在 ECMAScript 中，你捕获的错误可能是一个“Error\
  \ 对象”或任何错误类型。如果它是一个“Error 对象”，你将获得重要信息，例如错误的文件名、错误位置、堆栈跟踪（Stack Trace）等。\n\n`Error`\
  \ 类有一些重要的属性：\n\n* `name`: 错误的名称\n* `message`: 错误的内容\n* `stack` (只读）：一个包含帮助信息的字符串，可以帮助你定位错误位置。\n\
  \n`error-properties-example.js`\n\n```javascript\n// 创建一个 Error\nlet myError = new\
  \ Error();\nmyError.name = \"MyError\";\nmyError.message = \"My Error String\";\n\
  try {\n  throw myError;\n} catch(err) {\n  console.log(\"Error Name: \" + err.name);\n\
  \  console.log(\"Error Message: \" + err.message);\n  console.log(\"Type of err.stack:\
  \ \" + (typeof err.stack));\n  console.log(\"--- Stack Trace: ---\");\n  console.log(err.stack);\n\
  }\n```\n\n# 7 重新抛出错误\n\n在处理异常时，你可以捕获该异常并处理它，也可以重新抛出它。\n\n`rethrow-example.js`\n\n\
