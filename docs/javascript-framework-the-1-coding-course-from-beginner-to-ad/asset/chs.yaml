  \n### 1 FocusEvent\n### 2 focusin, focusout\n\n### 1 FocusEvent\n\n`FocusEvent`\
  \ 是一个接口，表示与焦点相关的事件，即 `focus`、`focusin`、`blur`、`focusout` 等 4 个事件。\n\n!![](img/image_rsrc8UP.jpg)\n\
  \n### 属性：\n\n| Property | Description |\n| :--- | :--- |\n| relatedTarget | 返回与触发事件相关的元素\
  \ |\n\n如果你跳转到一个元素然后离开（聚焦到另一个元素），将按顺序发生 4 个事件：\n\n- focus\n- focusin\n- blur\n- focusout\n\
  \n!![](img/image_rsrc8UR.jpg)\n\n\n\n\n\n`focus` 事件发生在 `focusin` 之前。事实上，它们发生的时间非常接近，可以被看作是同时发生的。同样，`blur`\
  \ 事件发生在 `focusout` 之前，事实上，它们发生的时间非常接近，可以被看作是同时发生的。\n\n### focus\n\n当你从其他地方跳转到某个元素时会触发\
  \ `focus` 事件，例如进入 `<input>` 元素准备为该元素输入内容。\n\n### blur\n\n`blur` 事件发生在你跳出一个元素（聚焦到另一个元素）时。\n\
  \n### `focusevent-example.html`\n\n```html\n<!DOCTYPE html><html><head><title>FocusEvent</title><script>function\
  \ focusHandler(evt)  {showLog(\"focus\");}function blurHandler(evt)  {showLog(\"\
  blur\");}function showLog(msg)  {var oldHtml= document.getElementById(\"log-div\"\
  ).innerHTML;document.getElementById(\"log-div\").innerHTML=oldHtml + \" .. \"+ msg;}</script></head><body><h3>Test\
  \ events: focus, blur</h3><input type=\"text\"onfocus=\"focusHandler(event)\"onblur=\"\
  blurHandler(event)\"  /><br><br><div id=\"log-div\" style=\"padding:10px;border:1px\
  \ solid #ccd;\"></div></body></html>\n```\n\n| ![](img/image_rsrc8US.jpg) |\n\n\
  ### 2 focusin, focusout\n\n`focus`、`blur` 事件为“可聚焦”的元素设计，例如 `<input>`、`<textarea>`\
  \ 等。而 `focusin`、`focusout` 事件为可以包含其他元素的元素设计，例如 `<div>`、`<span>`、`<form>` 等。\n\n\
  ### focus vs focusin\n\n| ![](img/image_rsrc8UT.jpg) |\n\n假设有一个有一个 2 个 `<input>`\
  \ 子元素的 `<form>`。当用户进入其中一个 `<input>` 元素时，会触发 `focus` 事件。子元素上的 `focus` 事件会在父元素上创建一个\
  \ `focusin` 事件。因此，这个 `focusin` 事件会在 `<form>` 元素上发生。\n\n注意：虽然 `focusin` 事件发生在父元素上，但\
  \ `event.target` 返回的是子元素（触发 focus 事件的元素）。\n\n### blur vs focusout\n\n| ![](img/image_rsrc8UU.jpg)\
  \ |\n\n假设你有一个 2 个 `<input>` 子元素的 `<form>`。当用户跳出一个 `<input>` 元素时，会触发 `blur` 事件。子元素上的\
  \ `blur` 事件会在父元素上创建一个 `focusout` 事件。因此，这个 `focusout` 事件会在 `<form>` 元素上发生。\n\n注意：虽然\
  \ `focusout` 事件发生在父元素上，但 `event.target` 返回的是子元素（触发 blur 事件的元素）。\n\n### 示例: focusin\
  \ & focusout\n\n### `focusin-focusout-example.html`\n\n```html\n<!DOCTYPE html><html><head><title>FocusEvent</title><meta\
  \ charset=\"utf-8\" /><script src=\"focusin-focusout-example.js\"></script><style>form\
  \ {border: 1px solid #ccc;padding: 10px;display: inline-block;}</style></head><body><h3>Events:\
  \ focusin & focusout</h3><p>Focus to 'input' and Blur to it</p><form onfocusin=\"\
  focusinHandler(event)\" onfocusout=\"focusoutHandler(event)\">User Name<input type=\"\
  text\" name=\"username\" /><br><br> Email<input type=\"text\" name=\"email\" /></form></body></html>\n\
  ```\n\n### `focusin-focusout-example.js`\n\n```javascript\nfunction focusinHandler(evt)\
  \ { // <input>evt.target.style.border=\"1px solid blue\";// <form>evt.target.parentElement.style.border=\"\
  1px solid red\";}function focusoutHandler(evt) { // <input>evt.target.style.border=\"\
  1px solid black\";// <form>evt.target.parentElement.style.border=\"1px solid black\"\
  ;} \n```\n\n| ![](img/image_rsrc8UV.jpg) |\n\n### 你在 onfocusout 上遇到问题了吗（？？？））\n\n\
  对于 `<input>`、`<textarea>` 等元素，你只需要处理 `focus`、`blur` 事件。`onfocusout` 属性在某些浏览器上对这些元素无效（我在\
  \ Firefox 和 Chrome 浏览器上检查过这个问题）。\n\n### `attr-onfocusout-not-working.html`\n\n```html\n\
  <!DOCTYPE html><html><head><title>FocusEvent</title><script>function focusHandler(evt)\
  \  {showLog(\"focus\");}function focusinHandler(evt)  {showLog(\"focusin\");}function\
  \ focusoutHandler(evt)  {showLog(\"focusout\");}function blurHandler(evt)  {showLog(\"\
  blur\");}function showLog(msg)  {var oldHtml= document.getElementById(\"log-div\"\
  ).innerHTML;document.getElementById(\"log-div\").innerHTML=oldHtml + \" .. \"+ msg;}</script></head><body><h3>为什么\
  \ 'onfocusout' 属性在 'input' 上不起？</h3><input type=\"text\"onfocus=\"focusHandler(event)\"\
  onblur=\"blurHandler(event)\"onfocusin=\"focusinHandler(event)\"onforcusout=\"focusoutHandler(event)\"\
  \ />br><br><div id=\"log-div\" style=\"padding:10px;border:1px solid #ccd;\"></div></body></html>\n\
  ```\n\n| ![](img/image_rsrc8UW.jpg) |\n\n虽然 `onfocusout` 属性在某些浏览器上对 `<input>`、`<textarea>`\
  \ 等元素无效。但如果你需要，你仍然可以通过以下方式为它们注册 `focusout` 事件：\n\n```javascript\n// Javascript 代码：\n\
  var myInput = document.getElementById(\"my-input\");\nmyInput.addEventListener(\"\
  focus\", focusHandler);\nmyInput.addEventListener(\"focusin\", focusinHandler);\n\
  myInput.addEventListener(\"focusout\", focusoutHandler);\nmyInput.addEventListener(\"\
  blur\", blurHandler);\n```\n\n查看完整示例：\n\n### `focusevents-addEventListener-example.html`\n\
  \n```html\n<!DOCTYPE html><html><head><title>FocusEvent</title><meta charset=\"\
  utf-8\"/></head><body><h3>Test events: focus, focusin, focusout, blur</h3><input\
  \ id=\"my-input\" type=\"text\" /><br><br><div id=\"log-div\" style=\"padding:10px;border:1px\
  \ solid #ccd;\"></div><script src=\"focusevents-addEventListener-example.js\"></script></body></html>\n\
  ```\n\n### `focusevents-addEventListener-example.js`\n\n```javascript\nfunction\
  \ focusHandler(evt)  {showLog(\"focus\");}function focusinHandler(evt)  {showLog(\"\
  focusin\");}function focusoutHandler(evt)  {showLog(\"focusout\");}function blurHandler(evt)\
  \  {showLog(\"blur\");}function showLog(msg)  {var oldHtml= document.getElementById(\"\
  log-div\").innerHTML;document.getElementById(\"log-div\").innerHTML=oldHtml + \"\
  \ .. \"+ msg;}\n// Javascript 代码：\nvar myInput = document.getElementById(\"my-input\"\
  );\nmyInput.addEventListener(\"focus\", focusHandler);\nmyInput.addEventListener(\"\
  focusin\", focusinHandler);\nmyInput.addEventListener(\"focusout\", focusoutHandler);\n\
  myInput.addEventListener(\"blur\", blurHandler);\n```\n\n| ![](img/image_rsrc8UX.jpg)\
  \ |\n\n# 第 28 章：Javascript InputEvent\n\n### 1 InputEvent\n\n### 1 InputEvent\n\n\
  `InputEvent` 是一种表示用户在可编辑元素（如 `<input>`、`<textarea>` 或具有 `contenteditable=\"true\"\
  ` 属性的元素）上输入数据的接口。\n\n`InputEvent` 是 `UIEvent` 的子接口。\n\n| ![](img/image_rsrc8UY.jpg)\
  \ |\n\n事件：\n\n| 事件 |  |\n| :--- | :--- |\n| input | 当元素获取用户输入时发生 |\n\n支持 input 事件的元素示例：\n\
  \n### `inputevents-elements-example.html`\n\n```html\n<!DOCTYPE html><<html>><head><title>InputEvent\
  \ 示例</title><meta charset=\"UTF-8\"><style>*[contenteditable='true']   {height:30px;padding:5px;border:1px\
  \ solid #ccd;}</style><script>// 注意：event.data 在 Firefox 和 IE 中不支持 function inputHandler(evt)\
  \  {showLog(evt.data);}function showLog(text)  {var logDiv = document.getElementById(\"\
  log-div\");logDiv.innerHTML = logDiv.innerHTML + \" .. \" + text;}</script></head><body><h3>InputEvent\
  \ 示例</h3><p style=\"color:red\">注意：event.data 在 Firefox 和 IE 中不支持</p><h3>input 元素</h3><input\
  \ type=\"text\" oninput =\"inputHandler(event)\"/><<h3>Textarea 元素</h3><textarea\
  \ oninput =\"inputHandler(event)\" rows=\"5\" cols=\"30\"></textarea><h3>具有 contenteditable='true'\
  \ 的元素</h3><div oninput =\"inputHandler(event)\" contenteditable=\"true\"></div><p\
  \ id=\"log-div\"></p></body></html>\n```\n\n| ![](img/image_rsrc8UZ.jpg) |\n\n####\
  \ 事件：input vs change\n\n你也可以考虑使用 `change` 事件，因为它与 `input` 事件非常相似：\n\n*   `change`\
  \ 事件支持 `<select>` 元素。当用户更改 `<select>` 上的选项时发生。\n*   对于 `<input>` (text, number,\
  \ email, password, tel, time, week, month, date, datetime-local, search, url)、`<textarea>`\
  \ 元素：`input` 事件在元素值更改后立即发生。而 `change` 事件在元素值更改且元素失去焦点时发生。\n\n## 2 属性、方法\n\n\n\n\n\
  \n`InputEvent` 是 `UIEvent` 的子接口，因此它继承了 `UIEvent` 的所有方法和属性。此外，它还有自己的方法和属性。\n\n###\
  \ 属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `data` | 返回插入的字符。如果更改没有插入文本（例如删除字符时），则该可能为空字符串。\
  \ |\n| `dataTransfer` | 返回一个 `DataTransfer` 对象，包含关于向可编辑内容添加或移除富文本或纯文本数据的信息。 |\n\
  | `inputType` | 返回可编辑内容的更改类型，例如'inserting'插入、'deleting'删除、'formatting'格式化等等。 |\n\
  | `isComposing` | 返回 true/false，表示事件是否在 `compositionstart` 之后且 `compositionend`\
  \ 之前触发。 |\n\n# 第 29 章：Javascript ChangeEvent\n\n## 1 ChangeChangeEvent\n\n`change`\
  \ 事件在以下情况下触发：\n\n*   用户勾选/取消勾选 `<input type=\"checkbox\">`。\n*   用户对 `<input type=\"\
  radio\">` 进行了更改。\n*   用户更改 `<input>` 的值（文件、颜色、范围）。\n*   用户更改了 `<input>` 的内容（文本、数字、邮箱、密码、电话、时间、周、月、日期、本地日期时间、搜索、url），然后聚焦到其他地方。\n\
  *   用户更改了 `<textarea>` 的内容，然后聚焦到其他地方。\n*   用户更改了 `<select>` 元素的选项。\n\n### 使用 change\
  \ 事件的示例：\n\n`changeevents-elements-example.html`\n\n```html\n<!DOCTYPE html><<html><head><title>ChangeEvent\
  \ Example</title><meta charset=\"UTF-8\"><style>.title {font-weight:bold;}</style><script>function\
  \ changeHandler(evt)  {alert(\"Changed!\");}</script></head><body><h2>ChangeEvent\
  \ example</h2><p class=\"title\">Input (checkbox, radio):</p><input type=\"checkbox\"\
  \  onchange =\"changeHandler(event)\"/><input type=\"radio\" name =\"gender\" value=\"\
  M\" onchange =\"changeHandler(event)\"/><input type=\"radio\" name =\"gender\" value=\"\
  F\" onchange =\"changeHandler(event)\"/><p class=\"title\">Input (range):</p><input\
  \ type=\"range\" min =\"1\" max=\"10\" onchange =\"changeHandler(event)\"/><p class=\"\
  title\">Input (color):</p><input type=\"color\" onchange =\"changeHandler(event)\"\
  /><p class=\"title\">Input (file):</p><input type=\"file\" onchange =\"changeHandler(event)\"\
  /><p class=\"title\">Input (image, hidden, buton, submit, reset):</p>- (Not support\
  \ 'change' event)<p class=\"title\">Input (text, number, email, password, tel, time,\
  \ week, month, date, datetime-local, search, url):</p><input type=\"text\" onchange\
  \ =\"changeHandler(event)\"/><p class=\"title\">Textarea element</p><textarea onchange\
  \ =\"changeHandler(event)\" rows=\"3\" cols=\"30\"></textarea><p class=\"title\"\
  >Select:</p><select onchange =\"changeHandler(event)\"><option value =\"en\">English</option><option\
  \ value =\"de\">German</option><option value =\"vi\">Vietnamese</option></select><p\
  \ id=\"log-div\"></p></body></html>\n```\n\n| ![](img/image_rsrc8V0.jpg) |\n\n###\
  \ 在 <select> 元素上使用 change 事件的示例：\n\n`changeevents-select-example.html`\n\n```html\n\
  <!DOCTYPE html><<html><head><title>ChangeEvent Example</title><meta charset=\"UTF-8\"\
  ><script>function changeHandler(evt)  {alert(\"Language: \" + evt.target.value);}</script></head><body><h2>ChangeEvent\
  \ example</h2><p class=\"title\">Select Language:</p><select onchange =\"changeHandler(event)\"\
  ><option value =\"en\">English</option><option value =\"de\">German</option><option\
  \ value =\"vi\">Vietnamese</option></select></body></html>\n```\n\n| ![](img/image_rsrc8V1.jpg)\
  \ |\n\n# 第 30 章：Javascript DragEvent\n\n## 1 DragEvent\n\n`DragEvent` 是一个接口，代表在对象从一个地方拖放到另一个地方过程中发生的事件。用户通过将指针设备（如鼠标）放在对象表面、按下按键、移动指针设备到另一个地方，然后释放指针设备以将对象放置到新位置，从而启动拖放。\n\
  \n| ![](img/image_rsrc8V2.jpg) |\n\n| ![](img/image_rsrc8V3.jpg) |\n\n`DragEvent`\
  \ 是 `MouseEvent` 的子接口，因此它继承了 `MouseEvent` 的所有属性和方法。\n\n| ![](img/image_rsrc8V4.jpg)\
  \ |\n\n以下是拖放过程中发生的事件类型列表：\n\n| 事件 | 元素类型 | 描述 |\n| :--- | :--- | :--- |\n| `dragstart`\
  \ | 被拖拽元素 | 当用户开始拖动元素时触发事件 |\n| `drag` | 被拖拽元素 | 当元素正在被拖拽时触发事件 |\n| `dragend` |\
  \ 被拖拽元素 | 当用户完成元素拖拽时触发事件 |\n| `dragenter` | 放置目标 | 当被拖拽元素进入放置目标时触发事件 |\n| `dragover`\
  \ | 放置目标 | 当被拖拽元素位于放置目标上方时触发事件 |\n| `drleave` | 放置目标 | 当被拖拽元素离开放置目标时触发事件 |\n| `drop`\
  \ | 放置目标 | 当被拖拽元素放置在放置目标上时触发事件 |\n\n| ![](img/image_rsrc8V5.jpg) |\n\n| 属性 | 描述\
  \ |\n| :--- | :--- |\n| `dataTransfer` | 返回拖拽/放置的数据 |\n\n查看一个简单的示例：\n\n| ![](img/image_rsrc8V6.jpg)\
  \ |\n\n`dragevents-example.html`\n\n```html\n<!DOCTYPE html><<html><head><title>DragEvent\
  \ Example</title><script src=\"dragevents-example.js\"></script><style>.droptarget-div\
  \ {float: left;width: 100px;height: 55px;margin: 25px 25px 5px 5px;padding: 10px;border:\
  \ 1px solid black;}#dragtarget-div {background: #eee;padding: 5px;}</style></head><body><h3>DragEvent\
  \ example</h3><p id=\"log-div\">..</p><!-- Drop Target 1 --><div class=\"droptarget-div\"\
  ondragenter= \"ondragenterHandler(event)\"ondragover=\"dragoverHandler(event)\"\
  ondrop=\"dropHandler(event)\"><p id=\"dragtarget-div\"ondragstart=\"dragstartHandler(event)\"\
  ondrag=\"dragHandler(event)\"draggable=\"true\">Drag me!</p></div><!-- Drop Target\
  \ 2 --><div class=\"droptarget-div\"ondragenter= \"ondragenterHandler(event)\"ondragover=\"\
  dragoverHandler(event)\"ondrop=\"dropHandler(event)\"></div></body></html>\n```\n\
  \n`dragevents-example.js`\n\n```javascript\n// --------- “被拖拽元素”的处理函数 ------------------\n\
  function dragstartHandler(evt) {\n  evt.dataTransfer.setData(\"MyDraggedId\", evt.target.id);\n\
  }\n// 拖拽中 ...\nfunction dragHandler(evt) {\n  showLog(\"The p element is being dragged\"\
  );\n}\n// --------- “放置目标”的处理函数 ------------------\nfunction ondragenterHandler()\
  \  \n  showLog(\"The p element enter drop-target\");\n}\n// 在 'over' 期间，你可以'释放鼠标'来'放置'。\n\
  function dragoverHandler(evt) {\n  evt.preventDefault(); // 重要！！\n}\nfunction dropHandler(evt)\
  \ {\n  evt.preventDefault(); // 重要!!\n  var elementId = evt.dataTransfer.getData(\"\
  MyDraggedId\");\n  evt.target.appendChild(document.getElementById(elementId));\n\
  \  showLog(\"The p element was dropped\");\n}\n// -------------------------------------------------------\n\
  function showLog(text)  \n  document.getElementById(\"log-div\").innerHTML = text;\n\
  }\n```\n\n例如，用户在电脑上拖动文件并将其到 `<div>` 元素中，你可以读取用户放置的文件的基本信息和内容。\n\n当 `drop` 事件发生时，`event.dataTransfer.files`\
  \ 返回一个 `FileList` 对象，其中包含一个 `File` 对象列表。\n\n| ![](img/image_rsrc8V7.jpg) |\n\n#\
  \ 第 31 章：Javascript HashChangeEvent\n\n## 1 HashChangeEvent\n\nHash 是 URL 的“锚点部分”。它告诉浏览器滚动滚动条，以显示与\
  \ Hash 对应的内容区域。\n\n| ![](img/image_rsrc8V8.jpg) |\n\n`hash-example.html`\n\n\n\n\
  \n\n# 第 32 章：Javascript URL 编码\n\n## 1 Javascript URL 编码\n\n在篇文章，我将向你展示如何使用 Javascript\
  \ 对 URL 进行编码和解码。\n\n让我们从这个问题开始：“我们如何用 Javascript 对 URL 进行编码？”\n\n实际上，这取决于你想做什么。Javascript\
  \ 提供了两个函数，即 `encodeURI()` 和 `encodeURIComponent()`。这两个函数之间的区别在于哪些字符会被编码。\n\n- `encodeURI()`\
  \ 函数编码除 `~!@#$&*()=:/;?+` 之外的所有字符。\n- `encodeURIComponent()` 函数编码除 `-_.!~*'()` 之外的所有字符。\n\
  \n因此，如果你想对整个 URL 进行编码，`encodeURI()` 函数将是一个很好的选择，因为 `http://` 不会被编码。否则，如果你打算编码参数的值，可以使用\
  \ `encodeURIComponent()` 函数。\n\n但如果你使用 `encodeURIComponent()` 函数对整个 URL 进行编码，你将得到一个不需要的结果。\n\
  \n# 第 33 章：Javascript FileReader\n\n### 1 FileReader\n\n### 2 FileReader 示例\n\n\
  ### 1 FileReader\n\nJavascript 中的 `FileReader` 接口设计用于读取用户计算机上的数据源。\n\n注意：事实上，只有当用户采取允许的操作时，Javascript\
  \ 才能读取用户计算机上的资源，例如，用户点击 `<input type=\"file\">` 元素选择计算机上的文件，或将文件拖放到浏览器中。\n\n`FileReader`\
  \ 可以读取 `File`、`Blob` 或 `DataTransfer` 对象（该对象在用户将文件拖入浏览器时获得）。\n\n`FileReader` 的 API\
  \ 设计与 `XMLHttpRequest` 具有相同的主要目的，因为它们都有加载外部资源等目标。数据是异步读取的，以避免在执行过程中阻塞浏览器。\n\n###\
  \ 构造函数\n\n```javascript\n// 创建一个 FileReader 对象:var fileReader = new FileReader();\n\
  ```\n\n### 属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `error` | 一个 `DOMException` 对象，描述读取数据源过程中发生的错误。\
  \ |\n| `readyState` | 一个描述 `FileReader` 状态的数字。可能的值为：0, 1, 2。 |\n| `result` | 成功读取后数据源的内容。其格式取决于开始读取时使用的方法。\
  \ |\n\n### 事件\n\n在使用 `FileReader` 加载数据源期间，将触发 `ProgressEvent` 中描述的事件，具体如下：\n\n|\
  \ 事件 | 描述 |\n| :--- | :--- |\n| `loadstart` | 表示加载数据的过程开始。此事件总是第一个触发。 |\n| `progress`\
  \ | 事件在数据加载期间触发多次，提供中间数据的访问权限。 |\n| `error` | 加载失败时触发事件。 |\n| `abort` | 当通过 `abort()`\
  \ 方法取消数据加载时触发事件（该方法在 `XMLHttpRequest` 和 `FileReader` 上可用）。 |\n| `load` | 仅在所有数据都已成功读取时触发事件。\
  \ |\n| `loadend` | 对象完成数据传输时触发事件。在错误、abort 或 load 之后总是触发。 |\n\n### 事件处理器\n\n| 处理器\
  \ | 描述 |\n| :--- | :--- |\n| `onloadstart(progressEvt)` | `loadstart` 事件的处理器。 |\n\
  | `onprogress(progressEvt)` | `progress` 事件的处理器。 |\n| `onerror(progressEvt)` | `error`\
  \ 事件的处理器。 |\n| `onabort(progressEvt)` | `abort` 事件的处理器。 |\n| `onload(progressEvt)`\
  \ | `load` 事件的处理器。 |\n| `onloadend(progressEvt)` | `loadend` 事件的处理器。 |\n\n### 2\
  \ FileReader 示例\n\n在此示例中，用户将文件拖放到一个 `<div>` 元素中。`FileReader` 将用于读取用户投放的文件的基本信息和内容。\n\
  \n**filereader-drop-example.html**\n\n```html\n<!DOCTYPE html><<html><head><title>FileReader\
  \ Example</title><meta charset=\"UTF-8\"><script src=\"filereader-drop-example.js\"\
  ></script><style>#drop-area {border: 1px solid blue;padding: 15px;margin-top:5px;}</style></head><body><h3>FileReader\
  \ example</h3><a href=\"\">Reset</a></a><div id=\"drop-area\" ondragover=\"dragoverHandler(event)\"\
  \ ondrop=\"dropHandler(event)\">Drop one file here</div><output id=\"log-div\"></output></body></html>\n\
  ```\n\n**filereader-drop-example.js**\n\n```javascript\nfunction dropHandler(evt)\
  \ {\nevt.stopPropagation();\nevt.preventDefault();\n// FileList 对象.\nvar files =\
  \ evt.dataTransfer.files;\nif (files.length != 1) {\nresetLog();\nappendLog(\"Please\
  \ drag and drop 1 file!\");\nreturn;\n}\nvar file = files[0];\nvar fileReader =\
  \ new FileReader();\nfileReader.onloadstart = function(progressEvent) {\nresetLog();\n\
  appendLog(\"onloadstart!\");\nvar msg = \"File Name: \" + file.name + \"<br>\" +\"\
  File Size: \" + file.size + \"<br>\" +\"File Type: \" + file.type;\nappendLog(msg);\n\
  }\nfileReader.onload = function(progressEvent) {\nappendLog(\"onload!\");\nvar stringData\
  \ = fileReader.result;\nappendLog(\" ---------------- File Content ----------------:\
  \ \");\nappendLog(stringData);\n}\nfileReader.onloadend = function(progressEvent)\
  \ {\nappendLog(\"onloadend!\");\n// FileReader.EMPTY, FileReader.LOADING, FileReader.DONE\n\
  appendLog(\"readyState = \" + fileReader.readyState);\n}\nfileReader.onerror = function(progressEvent)\
  \ {\nappendLog(\"onerror!\");\nappendLog(\"Has Error!\");\n}\n// 异步读取文件.\nfileReader.readAsText(file,\
  \ \"UTF-8\"); // fileReader.result -> String.\n}\nfunction dragoverHandler(evt)\
  \ {\nevt.stopPropagation();\nevt.preventDefault();\n// 显式显示这是一个副本.\nevt.dataTransfer.dropEffect\
  \ = 'copy';\n}\nfunction resetLog() {\ndocument.getElementById('log-div').innerHTML\
  \ = \"\";\n}\nfunction appendLog(msg) {\ndocument.getElementById('log-div').innerHTML\
  \ += \"<br>\" + msg;\n}\n```\n\n"
