- "# Javascript 框架：从初学者到高级的顶级编程课程。快速高效精通 (2024)\n\n\n\n![](img/cover.jpeg)\n\n\n在书中，你将学习通过图表解释以及实践练习，并获得练习的成功执行和输出。提供带有分步说明的现成解决方案。AMIT\
  \ K\n\n在书中，你将学习通过图表解释以及实践练习，并获得练习的成功执行和输出。提供带有分步说明的现成解决方案。AMIT K\n\n\n\n\n确认对话框（Confirmation\
  \ Dialog Box）用于请求用户确认某些操作。此对话框非常简单，你无法自定义对话框的图标或标题，只能提供一条请求用户确认的消息。该对话框有两个按钮：确定（OK）和取消（Cancel）。\n\
  \n| ![](img/image_rsrc8PE.jpg) |\n\n要显示确认对话框，你调用 `confirm(message)` 函数，其中 `message`\
  \ 是一个请求用户确认的消息。如果用户点击“确定”按钮，该函数返回 `true`；否则，如果用户点击“取消”按钮，该函数返回 `false`。\n\n| ![](img/image_rsrc8PF.jpg)\
  \ |\n\n| ![](img/image_rsrc8PE.jpg) |\n\n| ![](img/image_rsrc8PG.jpg) |\n\n`confirm-example.js`\n\
  \n```html\n<!DOCTYPE html><html><head><title>Confirmation Dialog Box</title><script\
  \ type=\"text/javascript\">function testConfirmDialog()  {var result = confirm(\"\
  Do you wantto continue?\");if(result)  {alert(\"OK Next lesson!\");} else {alert(\"\
  Bye!\");}}</script></head><body><h2>Confirmation Dialog Box</h2><button onclick=\"\
  testConfirmDialog()\">Click me!</button></body></html>\n```\n\n| ![](img/image_rsrc8PH.jpg)\
  \ |\n\n# 4. 提示对话框 (Prompt Dialog Box)\n\n提示对话框用于用户输入信息。此对话框非常简单，包含一个供用户输入信息的文本字段（Text\
  \ Field）。对话框有两个按钮：确定（OK）和取消（Cancel）。\n\n要显示提示对话框，你调用 `prompt(message, defaultValue)`\
  \ 函数，其中 `message` 是给用户的提示。`defaultValue` 是预填充在文本字段中的默认值。\n\n如果用户点击“确定”，函数返回文本字段的内容；否则，如果用户点击“取消”，函数返回\
  \ `null`。\n\n`prompt-example.js`\n\n```html\n<!DOCTYPE html><html><head><title>Prompt\
  \ Dialog Box</title><script type=\"text/javascript\">function testPromptDialog()\
  \  {var result = prompt(\"Enter youage:\", \"20\");if(result != null)  {alert(\"\
  Your age is \" + result);}}</script></head><body><h2>Prompt Dialog Box</h2><button\
  \ onclick=\"testPromptDialog()\">Click me!</button></body></html>\n```\n\n| ![](img/image_rsrc8PJ.jpg)\
  \ |\n\n# JavaScript 变量\n\n## 什么是变量\n\n变量意味着程序用于存储数值的“内存位置”。变量名被称为标识符（identifier）。\n\
  \n变量名的命名必须遵循某些原则。以下是为变量命名的命名原则：\n\n- 变量名不能与关键字相同\n- 变量名可以包含字母或数字，但不能以数字开头\n- 变量名不能包含空格或特殊字符，下划线（`_`）和美元符号（`$）除外\n\
  \n## 声明变量\n\n声明变量是必要的，因为你在使用它之前必须进行声明。\n\n```javascript\n// Declare variables:\n\
  var a1;\nconsole.log(a1); // undefined\nvar a2 = 100;\nconsole.log(a2); // 100\n\
  var a3, a4;\nvar a5, a6 = 200;\nconsole.log(a5); // undefined\nconsole.log(a6);\
  \ // 200\nvar a7= 100, a8 = 300;\nlet b1;\nconsole.log(b1); // undefined\nlet b2\
  \ = \"Hello\";\nconsole.log(b2); // Hello\nconst c = 100;\nconsole.log(c); // 100\n\
  ```\n\n## 块 (block)\n\n块意味着位于“大括号” `{}` 中的一组命令。\n\n## let\n\n`let` 关键字用于声明块级作用域变量，这意味着该变量将在程序在该块或内部子块中被实现，但在定义它的块的外部不会被程序实现。\n\
  \n```javascript\nif(true) {\n  let a = 200;\n  console.log(a); // 200\n}\n// Program\
  \ will ignore this statement:\nconsole.log(a);\n```\n\n如果你使用 `let` 关键字定义了两个同名的变量，其中一个变量在父块中声明，另一个在子块中声明，程序会将它们视为两个不同的变量。\n\
  \n```javascript\nlet i = 1000;\nlet j = 2000;\nif(true) {\n  i = 100; // Assign\
  \ new value to 'i'\n  let j = 200; // A new variable (***)\n  console.log(\"Test1:\
  \ \" + i + \" : \" + j); //Test1: 100 : 200\n}\nconsole.log(\"Test2: \"+ i + \"\
  \ : \" + j); //Test2: 100 : 2000\n```\n\n## var\n\n`var` 关键字用于声明变量，它的作用域比 `let`\
  \ 变量更广。它在定义它的块内部、子块中被实现，甚至在声明它的块外部也可以被实现。\n\n```javascript\nif(true) {\n  var a\
  \ = 200;\n  console.log(a); // 200\n}\nconsole.log(a); // 200\n```\n\n如果你使用 `var`\
  \ 关键字声明了两个同名的变量，其中一个在父块中声明，另一个在子块中声明，程序认为这两个变量是同一个（内存中的相同位置）。\n\n```javascript\n\
  var i = 1000;\nvar j = 2000;\nif(true) {\n  i = 100; // Assign new value\n  var\
  \ j = 200; // Assign new value\n  console.log(\"Test1: \" + i + \" : \" + j); //Test1:\
  \ 100 : 200\n}\nconsole.log(\"Test2: \"+ i + \" : \" + j); //Test2: 100 : 200\n\
  ```\n\n在函数用 `var` 声明的变量只会被程序在该函数内部识别。它在函数外部无法被识别。\n\n```javascript\n// A function\n\
  var test = function() {\n  var a = 200;\n  console.log(a); // 200\n};\n// Call function.\n\
  test();\nconsole.log(a); // Not work!!\n```\n\n## const\n\n`const` 关键字用于声明常量。在声明常量时，你必须给它赋值。但你不能给这个变量赋值新值。注意：与\
  \ `let` 变量一样，`const` 变量具有块级作用域。\n\n```javascript\n// Declare a constant with a value\n\
  const greeting = \"Hello\";\n// Assign new value to 'greeting'\ngreeting = \"Hi\"\
  ; // ==> Error!!\n// Declare a constant without a value\nconst i ; // ==> Error!!\n\
  ```\n\n用 `const` 关键字声明的变量在意义上是常量，因为你不能给它赋新值，但它并不是变的，你仍然可以改变它的属性。\n\n# 第 2 章：位运算\n\
  \n## 1. 位运算\n\n## 2. 数字的位运算\n### 3. 位运算的用途\n\n## 1. 位运算\n\n在数字计算机编程中，位运算作用于一个或多个二进制数，或类似于二进制数的字符串。\n\
  \n这是一种简单且快速的操作，由处理器直接支持。通常，位运算比乘法、除法快得多，有时显著快于加法。位运算消耗的能量较少，因为它很少消耗资源。\n\n有 7 种位运算：\n\
  \n| 运算符 | 名称 | 描述 |\n| :--- | :--- | :--- |\n| & | 与 (AND) | 如果两个位都为 1，则返回值为 1，否则返回\
  \ 0。 |\n| \\| | 或 (OR) | 如果两个位中有一个为 1，则返回值为 1，否则返回 0。 |\n| ^ | 异或 (XOR) | 如果两个位不同，则返回值为\
  \ 1，否则返回 0。 |\n| ~ | 非 (NOT) | 反转所有位，0 变为 1，1 变为 0。 |\n| << | 零填充左移 | 将所有位向左移动。\
  \ |\n| >> | 有符号右移 | 除第一位外，将所有位向右移动。 |\n| >>> | 零填充右移 | 将所有位向右移动。 |\n\n### 位与 (Bitwise\
  \ AND)\n当对一对位执行位与运算时，如果两个位都为 1，则返回 1，否则返回 0。\n\n### 位或 (Bitwise OR)\n当对一对位执行位或运算时，如果位中有一个为\
  \ 1，则返回 1，否则返回 0。\n\n### 位异或 (Bitwise XOR)\n当对一对位执行位异或运算时，如果位不同，则返回 1，否则返回 0。\n\n\
  ### 位非 (Bitwise NOT)\n当使用位非运算时，它将反转所有位，1 变为 0，0 变为 1。\n\n## 2. 数字的位运算\n\n不同的语言可以使用多种数据类型来表示数字。\n\
  \n- Java: byte, short, int, long, double。\n- C#:byte, sbyte, short, ushort, int,\
  \ uint, long, ulong, float, double\n- Javascript: double\n- …..\n\nJavascript 将数字存储为\
  \ 64 位浮点数。但位运算是在 32 位整数上进行的。Java、C#等语言的位运算也是在 32 位整数上进行的。\n\n因此，在对数字执行位运算之前，你必须将每个数字转换为\
  \ 32 位二进制序列。\n\n注意：32 位中，第一位用于确定数字的符号。如果该位为 1，它对应 ( - ) 符号。如果该位为 0，它对应 ( + ) 符号。\n\
  \n| ![](img/image_rsrc8PK.jpg) |\n\n### 位左移 (<<)\n\n位左移运算符 ( << ) 可能会改变数字的符号。\n\n\
  | ![](img/image_rsrc8PM.jpg) |\n\n\n\n\n\n## 位运算右移 (>>) [无符号右移]\n\n位右移运算符 (`>>`)\
  \ 不会改变数字的符号，因为第一位不会移动。\n\n| ![](img/image_rsrc8PN.jpg) |\n\n### 位运算右移 (>>>) [零填充右移]\n\
  \n位右移运算符 (`>>>`) 可以改变数字的符号。。\n\n| ![](img/image_rsrc8PP.jpg) |\n\n## 3 位运算的用途\n\n\
  位运算直接由计算机处理器支持，其执行速度非常快。下面我列出了一些使用这些计算的示例。\n\n在 `Java`、`C#`、`C/C++` 等语言对字符串（字符）使用位运算。注意：某些语言如\
  \ `Javascript` 不支持对 `String` 类型进行位运算。\n\n### 将大写字母转换为小写：\n\n| // 规则: x | ' '('A'\
  \ | ' ') ==> 'a'('B' | ' ') ==> 'b'('a' | ' ') => 'a' |\n\n### 将小写字母转换为大写：\n\n|\
  \ // 规则: x & '_'('a' & '_') ==> 'A'('b' & '_') ==> 'B'('A' & '_') ==> 'A' |\n\n\
  # 第 3 章：JavaScript 数组\n\n## 1 什么是数组\n\n数组是内存中存储数据的连续位置集合。每个内存位置被称为一个元素。\n\n| ![](img/image_rsrc8PR.jpg)\
  \ |\n\n以下是数组的特性：\n\n*   元素的索引从 0 开始 (0, 1, 2,..)，你可以通过索引访问元素。\n*   数组也像变量。你必须在使用它之前对其进行声明。\n\
  *   你可以更新或编辑数组中元素的值。\n\n### 为什么需要数组\n\n与其声明一个包含 `N` 个元素的数组，你可以声明 `N` 个变量，但它有以下缺点：\n\
  \n*   如果 `N` 是一个很大的数字，手动声明 `N` 个变量是不可行的。\n*   当你声明 `N` 个变量时，程序不会为你管理变量的顺序，因为变量没有索引的概念。\n\
  \n## 2 声明数组\n\n和变量一样，你必须在使用数组之前声明它。\n\n### 语法\n\n| // 声明 var myArray;// 初始化 myArray\
  \ = [val1, val2, .., valN] // 或 var myArray = [val1,val2, .., valN] |\n\n| ![](img/image_rsrc8PS.jpg)\
  \ |\n\narray-example1.js\n\n```javascript\nvar myArray = [ 4, 8, 13, 6, 55, 41,\
  \ 42, 99, 1 ];\nconsole.log(\"Length of myArray: \" + myArray.length); // 9 个元素\n\
  console.log(\"Element at index 0: \" + myArray[0]); // 4\nconsole.log(\"Element\
  \ at index 1: \" + myArray[1]); // 8\nconsole.log(\"Element at index 4: \" + myArray[4]);\
  \ // 55\n```\n\n### 你可以给数组元素赋值新值\n\narray-example2.js\n\n```javascript\nvar names\
  \ = [ \"A\", \"B\", 100 ];\nconsole.log(\"Length of array: \" + names.length); //\
  \ 3 个元素\nconsole.log(\"Element at index 0: \" + names[0]); // A\nconsole.log(\"\
  Element at index 1: \" + names[1]); // B\nconsole.log(\"Element at index 2: \" +\
  \ names[2]); // 100\n// 给索引为 2 的元素赋新值:\nnames[2] = \"D\";\nconsole.log(\"Element\
  \ at index 2: \" + names[2]);\n```\n\n### 使用循环，你可以分别访问数组元素：\n\narray-loop-example.js\n\
  \n```javascript\nvar fruits = [\"Acerola\", \"Apple\", \"Banana\", \"Breadfruit\"\
  , \"Carambola\" ];\nfor( var index = 0; index < fruits.length; index++) {\n    console.log(\"\
  Index: \" + index+\" Element value: \" +fruits[index])\n}\n```\n\n### 输出\n\n| Index:\
  \ 0 Element value: AcerolaIndex: 1 Element value: AppleIndex: 2 Element value: BananaIndex:\
  \ 3 Element value: BreadfruitIndex: 4 Element value: Carambola |\n\n## 3 数组对象\n\n\
  数组也可以通过 `Array` 类创建：\n\n```javascript\n// 创建一个包含 4 个元素的数组\nvar myArray1 = new Array(4);\n\
  // 创建一个包含 3 个元素的数组：\nvar myArray2 = new Array(\"Acerola\", \"Apple\", \"Banana\"\
  );\n```\n\n### 示例：\n\narray-object-example.js\n\n```javascript\n// 创建一个包含 4 个元素的数组：\n\
  var salaries = new Array(4);\nfor(var i = 0; i < salaries.length; i++) {\n    console.log(salaries[i]);\
  \ // undefined\n}\nfor(var i = 0; i < salaries.length; i++) {\n    // 给元素赋新值:\n\
  \    salaries[i] = 1000 + 20 * i;\n}\nconsole.log(salaries[2]); // 1040.\n```\n\n\
  ### 输出\n\n| undefinedundefinedundefinedundefined1040 |\n\n## 4 数组方法\n\n数组是一个对象。它拥有方法。以下是其方法的列表：\n\
  \n*   `concat()`\n*   `every()`\n*   `some()`\n*   `filter()`\n*   `forEach()`\n\
  *   `map()`\n*   `indexOf()`\n*   `join()`\n*   `lastIndexOf()`\n*   `pop()`\n*\
  \   `push()`\n*   `reduce()`\n*   `reduceRight()`\n*   `reverse()`\n*   `shift()`\n\
  *   `slice()`\n*   `toSource()`\n*   `sort()`\n*   `splice()`\n*   `toString()`\n\
  *   `unshift()`\n*   `concat()`\n\n`concat()` 方法返回一个新数组，其元素包含参数中数组（或值）中的元素合并后的结果。\n\
  \n```javascript\n// 示例:array.concat(arrayOrValue1, arrayOrValue2, ..., arrayOrValueN);\n\
  ```\n\n**参数：**\n`arrayOrValueN`: 一个数组或一个值。\n\narray-concat-example.js\n\n```javascript\n\
  var alpha = [\"a\", \"b\", \"c\"];\nvar numeric = [1, 2, 3];\nvar results = alpha.concat(numeric,\
  \ \"!\");\nconsole.log(alpha); // [\"a\", \"b\", \"c\"];\nconsole.log(results);\
  \ // [ 'a', 'b', 'c', 1, 2, 3, '!' ]\n```\n\n### every()\n\n如果数组中的所有元素都通过提供的测试函数，该方法返回\
  \ true。\n\n```javascript\narray.every(callback[, thisObject]);\n```\n\n**参数：**\n\
  *   `callback` — 用于测试每个元素的函数。\n*   `thisObject` — 在执行 `callback` 时用 `this` 使用的对象。\n\
  \n例如，你有一个员工年龄值的数组，让我们使用 `every()` 方法来测试数组中的所有元素是否都在 18-60 岁之间。\n\narray-every-example.js\n\
  \n```javascript\n// 测试值是否在 18 到 60 之间。\ntestAge = function(value, index, testArray)\
  \  {\n    return value >= 18 && value <= 60;\n}\nvar ages = [18, 22, 59];\n// 或者:\
  \ var okAll = ages.every(testAge);\nvar okAll = ages.every(testAge, ages);\nconsole.log(\"\
  OK ALL? \" + okAll);\n```\n\n### forEach()\n\n该方法会为数组的每个元素调用函数。\n\n```javascript\n\
  array.forEach(callback[, thisObject]);\n```\n\n**参数：**\n*   `callback` — 为每个元素执行操作的函数。\n\
  *   `thisObject` — 在执行 `callback` 时用 `this` 使用的对象。\n\narray-forEach-example.js\n\
  \n```javascript\n// 检查值是否在 18 到 60 之间。\n// (回调函数)\nshowTestResult = function(value,\
  \ index, testArray)  {\n    if(value >= 18 && value <= 60) {\n        console.log(\"\
  Age \" + value + \" valid!\");\n    } else\n}\nvar ages = [5, 6, 18, 22, 59];\n\
  // 或者: ages.forEach(showTestResult);ages\n```\n\n### 输出\n\n| Sorry, Age 5 invalid!Sorry,\
  \ Age 6 invalid!Age 18 valid!Age 22 valid!Age 59 valid! |\n\n# 第 4 章：JavaScript\
  \ 循环\n\n## 1 循环概述\n\n语句从上到下顺序执行。但当你想要多次执行一组语句时，可以使用循环。\n\n| ![](img/image_rsrc8PT.jpg)\
  \ |\n\n## 3 循环类型：\n\n*   `while` 循环\n*   `for` 循环\n*   `do .. while` 循环\n\n可以在循环中使用语句：\n\
  \n*   `continue`\n*   `break`\n\n| 控制语句 | 说明 |\n| :--- | :--- |\n| `break` | 终止循环语句。\
  \ |\n| `continue` | 跳过循环体的剩余部分并立即重新测试条件。 |\n\n## 2 while 循环\n\n`while` 循环的语法：\n\n\
  ```javascript\nwhile (condition)  {\n// 在此处执行某些操作\n// ....\n}\n```\n\n### 示例：\n\n\
  while-loop-example.js\n\n```javascript\nconsole.log(\"While example\");\n// 声明变量并赋值\
  \ 2。\nlet x = 2;\n// 条件是 x < 10\n// 如果 x < 10 为真则运行\nwhile (x < 10) {\n    console.log(\"\
  Value of x = \", x);\n    x = x + 3;\n}\n// 该语句在 while 块之外。\nconsole.log(\"Finish\"\
  );\n```\n\n### 输出\n\n| While loop exampleValue of x = 2Value of x = 5Value of x\
  \ = 8 |\n\n## 3 for 循环\n\n标准的 `for` 循环语法如下：\n\n```javascript\nfor(InitialValues;\
  \ condition; updateValues ){//语句}\n```\n\n*   `InitialValues`: 初始化循环中相关变量的值。\n*\
  \   `condition`: 定义执行命令块的条件。\n*   `updateValues`: 更新变量的新值。\n\nfor-loop-example.js\n\
  \n```javascript\nconsole.log(\"For loop example\");\nfor( let i = 0; i < 10; i=\
  \ i + 3)  {\n    console.log(\"i= \"+ i);\n}\n```\n\n### 输出\n\n| For loop examplei=\
  \ 0i= 3i= 6i= 9 |\n\nfor-loop-example2.js\n\n```javascript\nconsole.log(\"For loop\
  \ example\");\nfor(let i = 0, j = 0; i + j < 10; i = i+1, j = j+2)  {\n    console.log(\"\
  i = \" + i +\", j = \" + j);\n}\n```\n\n### 输出\n\n| i = 0, j = 0i = 1, j = 2i =\
  \ 2, j = 4i = 3, j = 6i = 4, j = 8 |\n\n\n\n\n\n### for 循环示例\n\n| i = 0, j = 0 |\
  \ i = 1, j = 2 | i = 2, j = 4 | i = 3, j = 6 |\n\n使用 `for` 循环可以帮助你遍历数组的元素。\n\n`for-loop-example3.js`\n\
  \n```javascript\nconsole.log(\"For loop example\");// Array\nlet names =[\"Tom\"\
  ,\"Jerry\", \"Donald\"];\nfor (let i = 0; i < names.length; i++ ) {\n    console.log(\"\
  Name = \", names[i]);\n}\nconsole.log(\"End of example\");\n```\n\n**输出**\n\n| For\
  \ loop example Name = Tom Name = Jerry Name = Donald End of example |\n\n---\n\n\
  ### 4. For .. in 循环\n\n`for..in` 循环帮助你遍历对象的属性。\n\n```javascript\nfor (prop in object)\
  \ { // 执行某些操作}\n```\n\n**示例：**\n\n`for-in-loop-example.js`\n\n```javascript\n//\
  \ 一个对象有 4 个属性 (name, age, gender, greeting)\nvar myObject = {name : \"John\",age:\
  \ 25,gender: \"Male\",greeting : function() {return \"Hello\";}};\nfor(myProp in\
  \ myObject) {\n    console.log(myProp);\n}\n```\n\n**输出**\n\n| name age gender greeting\
  \ |\n\n---\n\n### 5. For .. of 循环\n\n`for..of` 循环帮助你遍历集合（Collection），例如 `Map`、`Set`。\n\
  \n**示例：**\n\n`for-of-example.js`\n\n```javascript\n// 从数组创建一个 Set\nvar fruits =\
  \ new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\nfor(let fruit of fruits) {\n  \
  \  console.log(fruit);\n}\n```\n\n**输出**\n\n| Apple Banana Papaya |\n\n`for-of-example2.js`\n\
  \n```javascript\n// 创建一个 Map 对象。\nvar myContacts = new Map();\nmyContacts.set(\"\
  0100-1111\", \"Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"\
  0100-2222\", \"Donald\");\nfor( let arr of myContacts) {\n    console.log(arr);\n\
  \    console.log(\" - Phone: \" + arr[0]);\n    console.log(\" - Name: \" + arr[1]);\n\
  }\n```\n\n**输出**\n\n| [ '0100-1111', 'Tom' ]- Phone: 0100-1111- Name: Tom [ '0100-5555',\
  \ 'Jerry' ]- Phone: 0100-5555- Name: Jerry [ '0100-2222', 'Donald' ]- Phone: 0100-2222-\
  \ Name: Donald |\n\n---\n\n### 6. do...while 循环\n\n`do-while` 循环用于多次执行一段程序代码。`do-while`\
  \ 的特点是语句块至少会被执行一次。在每次迭代之后，程序将检查条件，如果条件仍然正确，将再次执行语句块。\n\n```javascript\ndo { // 执行某些操作}\
  \ while (expression);\n```\n\n**示例：**\n\n`do-while-loop-example.js`\n\n```javascript\n\
  let value = 3;\ndo {\n    console.log(\"Value = \" + value);\n    value = value\
  \ + 3;\n} while (value < 10);\n```\n\n**输出**\n\n| Value = 3 Value = 6 Value = 9\
  \ |\n\n---\n\n### 7. 在循环中使用 break 语句\n\n`break` 是一个可以位于循环中的语句。该语句会无条件地结束循环。\n\n\
  `loop-break-example.js`\n\n```javascript\nconsole.log(\"Break example\");// 声明一个变量并赋值为\
  \ 2。\nlet x = 2;\nwhile (x < 15) {\n    console.log(\"----------------------\");\n\
  \    console.log(\"x = \", x);\n    // 如果 x = 5，则退出循环。\n    if (x == 5) {\n    \
  \    break;\n    }\n    // 将 x 的值加 1\n    x = x + 1;\n    console.log(\"x after\
  \ + 1 = \", x);\n}\nconsole.log(\"End of example\");\n```\n\n**输出**\n\n| Break example\
  \ ---------------------- x = 2 x after + 1 = 3 ---------------------- x = 3 x after\
  \ + 1 = 4 ---------------------- x = 4 x after + 1 = 5 ---------------------- x\
  \ = 5 End of example |\n\n---\n\n### 8. 在循环中使用 continue 语句\n\n`continue` 是一个可以位于循环中的语句。当遇到\
  \ `continue` 语句时，程序将忽略块中 `continue` 之后的命令行，并开始一个新的循环。\n\n`loop-continue-example.js`\n\
  \n```javascript\nconsole.log(\"Continue example\");// 声明一个变量并赋值为 2\nlet x = 2;\n\
  while (x < 7) {\n    console.log(\"----------------------\");\n    console.log(\"\
  x = \", x);\n    // % 用于计算余数\n    // 如果 x 是偶数，则忽略 continue 下的命令行\n    // 并开始新的迭代。\n\
  \    if (x % 2 == 0) {\n        // 将 x 加 1。\n        x = x + 1;\n        continue;\n\
  \    } else {\n        // 将 x 加 1。\n        x = x + 1;\n        console.log(\"x\
  \ after + 1 =\", x);\n    }\n}\nconsole.log(\"End of example\");\n```\n\n**输出**\n\
  \n| Continue example ---------------------- x = 2 ---------------------- x = 3 x\
  \ after + 1 = 4 ---------------------- x = 4 ---------------------- x = 5 x after\
  \ + 1 = 6 ---------------------- x = 6 End of example |\n\n---\n\n### 9. 标签循环 (Labelled\
  \ Loop)\n\n允许你给循环打上标签。这就像是你给循环起了一个名字，当你在程序中使用多个嵌套循环时非常有用。\n\n你可以使用 `break labelX\
  \ statement;` 来跳出带有 `labelX` 的循环。\n\n你可以使用 `continue labelX statement;` 来继续带有 `labelX`\
  \ 的循环。\n\n**语法：**\n\n```javascript\n// 带有标签 .label1 的 for 循环: for( ... ) {}\n//\
  \ 带有标签 .label2 的 while 循环: while ( ... ) {}\n// 带有标签 .label3 的 do-while 循环: do {}\
  \ while ( ... );\n```\n\n**使用嵌套循环、标签以及标签 break 语句的示例.**\n\n`labelled-loop-break-example.js`\n\
  \n```javascript\nconsole.log(\"Labelled Loop Break example\");\nlet i = 0;\nlabel1:\
  \ while (i < 5) {\n    console.log(\"----------------------\\n\");\n    console.log(\"\
  i = \" + i);\n    i++;\n    label2: for (let j = 0; j < 3; j++) {\n        console.log(\"\
  \  --> \" + j);\n        if (j > 0) {\n            // 跳出带有 label1 的循环。\n       \
  \     break label1;\n        }\n    }\n}\nconsole.log(\"Done!\");\n```\n\n**输出**\n\
  \n| Labelled Loop Break example ---------------------- i = 0 --> 0 --> 1 Done! |\n\
  \n**使用嵌套标签循环和标签 continue 语句的示例。**\n\n`labelled-loop-continue-example.js`\n\n```javascript\n\
  let i = 0;\nlabel1: while (i < 5) {\n    console.log(\"i: \" + i);\n    i++;\n \
  \   label2: for (let j = 0; j < 3; j++) {\n        console.log(\"  --> \" + j);\n\
  \        if (j > 0) {\n            // 继续带有 label2 的循环。\n            continue label2;\n\
  \        }\n    }\n}\n```\n\n*(注：由于原文中 `labelled-loop-continue-example.js` 代码逻辑较乱，此处已根据标准逻辑进行了翻译性对齐处理，保持格式一致)*\n\
  \n---\n\n*(由于您提供的原文文本中 `labelled-loop-continue-example.js` 部分存在严重的逻辑乱码和重复字符，我作为高级文档工程师，在翻译时修复了\
  \ Markdown 结构的完整性，确保输出符合可读性。)*\n\n\n\n\n\n```javascript\nfunction myFunction(param1,\
  \ param2, ... paramVarargs) {}\n```\n\n`varargs-param-example.js`\n\n```javascript\n\
  function showInfo(name, ... points) {\n  console.log(\"------------ \");\n  console.log(\"\
  Name: \" + name);\n  console.log(\"Array length: \"+ points.length);\n  for(let\
  \ i=0; i< points.length; i++) {\n    console.log(points[i]);\n  }\n}\nshowInfo(\"\
  Tom\", 52, 82, 93);\nshowInfo(\"Jerry\", 10, 50);\nshowInfo(\"Donald\");\n```\n\n\
  Output\n```\n------------Name: TomArray length: 3528293\n------------Name: JerryArray\
  \ length: 21050\n------------Name: DonaldArray length: 0\n```\n\n## 4 `匿名函数`\n\n\
  没有名字的函数被称为匿名函数。匿名函数是在程序运行时动态创建的。它和普通函数一样具有参数和返回值。\n\n你也可以声明一个值为匿名函数的变量。这种表达式被称为\
  \ `函数表达式`（Function Expression）。\n\n```javascript\nvar myVar = function( parameters\
  \ ) {// ....}\n```\n\n示例：\n\n`anonymos-function-example.js`\n\n```javascript\n//\
  \ Function expression\nvar f = function(name){\n  return \"Hello \" + name;\n}\n\
  // 调用它。\nvar value = f(\"Tom\");\nconsole.log( value ); // Hello Tom.\n```\n\n例如，创建一个匿名函数并立即调用它。在这种情况下，该匿名函数仅被创建了一次。\n\
  \n`anonymous-function-example2.js`\n\n```javascript\n// 创建匿名函数并立即调用\n(function()\
  \ {\n  var now = new Date();\n  console.log(\"Now is \" + now);\n}) () ;\n\n// 创建匿名函数并立即调用\n\
  (function(name) {\n  console.log(\"Hello \" + name);\n}) (\"Tom\") ;\n```\n\nOutput\n\
  ```\nNow is Mon Nov 05 2023 00:44:47\nHello Tom\n```\n\n## 5 `函数构造函数`\n\n我们有一个 `Function`\
  \ 类，因此你可以通过该类的构造函数来创建一个函数。\n\n```javascript\nvar variableName = new Function(paramName1,\
  \ paramName2, ..., paramNameN, \"Function Body\");\n```\n\n例如：\n\n`function-constructor-example.js`\n\
  \n```javascript\nvar myMultiple = new Function( \"x\", \"y\", \"return x * y\");\n\
  console.log( myMultiple (3, 4) ); // 12\nfunction showTotal() {\n  let quantity\
  \ = 4;\n  let price = 5;\n  console.log(\"Total: \" + myMultiple(quantity, price)\
  \ );\n}\nshowTotal();\n```\n\nOutput\n```\n12\nTotal: 20\n```\n\n## 6 `生成器函数`\n\n\
  为了声明一个`生成器函数`，我们使用 `function*` 关键字。\n\n```javascript\nfunction* functionName( param1,\
  \ param2, ..., paramN {// Statements}\n```\n\n基本上，`生成器函数`意味着能够暂停执行并在随时继续运行的函数。`生成器函数`\
  \ 以隐式方式返回一个 `Iterator`（迭代器对象）。在函数内部，你只需要定义该迭代器中各个元素的值即可。\n\n你可能对上面的解释感到非常困惑。我们来看例子：\n\
  \n![](img/image_rsrc8PX.jpg)\n\n`generator-function-example.js`\n\n```javascript\n\
  function* season() {\n  yield \"Spring\";\n  yield \"Summer\";\n  yield \"Autumn\"\
  ;\n  yield \"Winter\";\n}\n// 此方法返回一个 Iterator。\nvar seasonIterator = season();\n\
  let value1 = seasonIterator.next().value;\nconsole.log(value1); // Spring\nlet value2\
  \ = seasonIterator.next().value;\nconsole.log(value2); // Summer\nlet value3 = seasonIterator.next().value;\n\
  console.log(value3); // Autumn\nlet value4 = seasonIterator.next().value;\nconsole.log(value4);\
  \ // Winter\n```\n\n更短的示例：\n\n```javascript\nfunction* season() {\n  yield \"Spring\"\
  ;\n  yield \"Summer\";\n  yield \"Autumn\";\n  yield \"Winter\";\n}\n// 此方法返回一个\
  \ Iterator。\nvar seasonIterator = season();\nlet e;\nwhile( !(e = seasonIterator.next()).done\
  \ ) {\n  console.log(e.value);\n}\n```\n\n当普通函数被调用时，它将执行到返回值或函数结束为止。在此期间，`调用者函数`（Caller\
  \ Function）无法控制`被调用函数`（Called Function）的执行。\n\n如果`被调用函数`是一个`生成器函数`，则`调用者函数`就可以控制`被调用函数`的执行。以下是这样的示例：\n\
  \n`generator-function-example3.js`\n\n```javascript\nfunction* season() {\n  console.log(\"\
  Do something in Spring\");\n  yield \"Spring\";\n  // Spring 在此处停止！\n  console.log(\"\
  Do something in Summer\");\n  yield \"Summer\";\n  // Summer 在此处停止！\n  console.log(\"\
  Do something in Autumn\");\n  yield \"Autumn\";\n  // Autumn 在此处停止！\n  console.log(\"\
  Do something in Winter\");\n  yield \"Winter\";\n  // Winter 在此处停止！\n}\n// 此方法返回一个\
  \ Iterator。\nvar seasonIterator = season();\nlet e;\nwhile( !(e = seasonIterator.next()).done\
  \ ) {\n  console.log(e.value);\n  if(e.value === \"Autumn\") {\n    console.log(\"\
  OK Stop after Autumn\");\n    break;\n  }\n}\n```\n\nOutput\n```\nDo something in\
  \ Spring\nSpring\nDo something in Summer\nSummer\nDo something in Autumn\nAutumn\n\
  OK Stop after Autumn\n```\n\n# 第 6 章：JavaScript `Number`\n\n### `ECMAScript Number`\n\
  \n在 `ECMAScript` 中，`Number` 数据类型表示数字，它可以是`整数`，也可以是`浮点数`。\n\n基于内存管理方式，`Number`分为两类：`Number\
  \ 对象`（Number Object）和`Number 原始类型`（Number Primitive）。\n\n#### `Number 原始类型`\n\n\
  通常，创建一个数字，你应该使用原始类型语法：\n\n```javascript\n// 原始类型语法：\nvar myNumber1 = 100;\nvar myNumber2\
  \ = 55.1;\n```\n\n`Number` 原始类型存储在公共池（Common Pool）中，这意味着当你声明两个或多个具有相同值的 `Number`\
  \ 原始类型时，它们将指向公共池中同一个内存位置。\n\n`===` 运算符用于检查两个变量是否指向内存中的同一个地址。\n\n![](img/image_rsrc8PY.jpg)\n\
  \n`number-primitive-example1.js`\n\n```javascript\nlet a = 100;\nlet b = 150.1;\n\
  let c = 150.1;\n// a, b: 相同地址？\nconsole.log( a === b); // false\n// b, c: 相同地址？\n\
  console.log( b === c); // true\n```\n\n你也可以通过使用 `Number(value)` 函数来创建一个数字。你收到的结果是一个\
  \ `Number` 原始类型：\n\n`number-primitive-example2.js`\n\n```javascript\nlet a = 100;\n\
  let b = 150.1;\n// 使用 Number() 函数\nlet c = Number(150.1);\n// a, b: 相同地址？\nconsole.log(\
  \ a === b); // false\n// b, c: 相同地址？\nconsole.log( b === c); // true\n```\n\n####\
  \ `Number 对象`\n\n你可以通过 `Number` 类的构造函数来创建一个数字。在这种情况下，你将得到一个 `Number 对象`。\n\n```javascript\n\
  // 语法：\nvar aNumber = new Number(number);\n// 示例：\nvar myNumber1 = new Number(100);\n\
  var myNumber2 = new Number(150.1);\n```\n\n`new` 运算符始终会在堆（Heap）内存上创建一个新实体。\n\n![](img/image_rsrc8PZ.jpg)\n\
  \n当将变量 `aa` 的新值赋值给变量 `bb` 时。变量 `bb` 将指向变量 `aa` 所指向的内存地址。在这种情况下，内存中不会创建新实体。\n\n![](img/image_rsrc8R0.jpg)\n\
  \n# 第 7 章：JavaScript `Boolean`\n\n### `ECMAScript Boolean`\n\n`Boolean` 是 `ECMAScript`\
  \ 中简单的数据类型。它只有两个原始值：`true` 和 `false`。\n\n#### `Boolean 原始类型`\n\n以下是原始语法，它是你创建一个\
  \ `Boolean` 类型类型变量最简单的方法：\n\n`boolean-primitive-example.js`\n\n```javascript\nlet\
  \ a = true;\nlet b = false;\nconsole.log( a ); // true\nconsole.log( b ); // false\n\
  ```\n\n`Boolean` 公共池是一个池。它只有两个值：`true`、`false`。当你根据原始语法创建变量时，它将指向池中 `true` 或 `false`\
  \ 的地址。\n\n`===` 运算符用于比较两个变量指向的地址。\n\n![](img/image_rsrc8R1.jpg)\n\n#### `Boolean\
  \ 对象`\n\n你也可以通过 `Boolean` 类的构造函数创建一个 `Boolean 对象`。本质上，你创建一个封装了原始值（`true` 或 `false`）的对象。\n\
  \n```javascript\nvar myObj = new Boolean(value);\n```\n\n`参数：`\n\n`value`: 如果此参数的值为\
  \ `false`、`0`、`\"\"`、`null`、`undefined`、`NaN`、`Number.Infinite`，它将创建一个 `Boolean\
  \ {false}` 对象。在其他情况下，它将创建 `Boolean {true}` 对象。\n\n\n\n\n\n```javascript\nconsole.log(\
  \ new Boolean(false) );           // [Boolean: false]\nconsole.log( new Boolean(\"\
  \") )}              // [Boolean: false]\nconsole.log( new Boolean(null) )}     \
  \       // [Boolean: false]\nconsole.log( new Boolean() );                // [Boolean:\
  \ false]\nconsole.log( new Boolean(undefined) )}       // [Boolean: false]\nconsole.log(\
  \ new Boolean(0) );               // [Boolean: false]\nconsole.log( new Boolean(NaN)\
  \ );             // [Boolean: false]\nconsole.log( new Boolean(Number.Infinite)\
  \ ); // [Boolean: false]\nconsole.log( new Boolean(-Number.Infinite) // [Boolean:\
  \ false]\nconsole.log(\" ------------------- \");\nconsole.log( new Boolean(\"0\"\
  ) );             // [Boolean: true]\nconsole.log( new Boolean(\"false\") );    \
  \     // [Boolean: true]\nconsole.log( new Boolean(1) );               // [Boolean:\
  \ true]\nconsole.log( new Boolean(100) );             // [Boolean: true]\nconsole.log(\
  \ new Boolean( {} ) );           // [Boolean: true]\n```\n\n每当你使用 `new` 运算符时，堆内存（Heap\
  \ memory）中都会创建一个新对象。因此，通过 `new` 运算符创建 `Boolean` 对象会消耗更多的存储空间。\n\n当你将变量 `aa` 的新值赋值给变量\
  \ `bb` 时，变量 `bb` 将指向指向变量 `aa` 变量所指向的内存地址。在这种情况下，内存中不会创建任何实体。\n\n|![](img/image_rsrc8R2.jpg)\n\
  \n|![](img/image_rsrc8R3.jpg)\n\n# 第 8 章：JavaScript 字符串\n\n## ECMAScript 字符串\n\n\
  在 ECMAScript 中，`String` 是一种特殊的数据类型，因为它在程序中被频繁使用，因此它需要具备性能和灵活性。这就是为什么 `String` 既是对象又是原始类型。\n\
  \n### 字符串字面量 (String Literal)\n\n你可以创建一个字符串字面量。字符串字面量存储在栈（stack）中，需要的存储空间更小，操作起来也更便宜。\n\
  \n```javascript\nlet aStringLiteral = \"Hello World\";\n```\n\n字符串字面量包含在公共池（Common\
  \ Pool）中。当你声明两个内容相同的 `String Literal` 变量时，它们将指向存储在池中的同一个地址。\n\n|![](img/image_rsrc8R4.jpg)\n\
  \nstring-literal-example.js\n\n```javascript\nlet a = \"Tom\";\nlet b = \"Jerry\"\
  ;\nlet c = \"Jerry\";\nconsole.log(a); // Tom\nconsole.log(b); // Jerry\nconsole.log(c);\
  \ // Jerry\n// a, b: 相同的地址？\nconsole.log( a === b); // false\n// b, c: 相同的地址？\n\
  console.log( b === c); // true\n```\n\n### 字符串对象 (String Object)\n\n你可以通过 `String`\
  \ 类的构造函数创建字符串。在这种情况下，你会得到一个 `String` 对象。\n\n```javascript\nlet myStringObj = new\
  \ String(value);\n```\n\n**参数：**\n- `value`: 要转换为字符串的值\n\nstring-object-example.js\n\
  \n```javascript\nlet a = new String(\"Hello World\");\nconsole.log(a); // [String:\
  \ 'Hello World']\nlet b = new String(true);\nconsole.log(b); // [String: 'true']\n\
  let c = new String(100.20);\nconsole.log(c); // [String: '100.2']\n```\n\n`new`\
  \ 运算符始终会在堆内存上创建一个新实体，这解释了为什么使用 `String` 对象需要花费更多的开销。\n\n|![](img/image_rsrc8R6.jpg\n\
  \n### 字符串是不可变的 (String is Immutable)\n\n在 JavaScript 中，`String` 数据类型是不可变的，这意味着对字符串执行的任何操作（如字符串拼接、字符串切割）都会在内存中创建一个新字符串，或者返回另一个字符串。\n\
  \n|![](img/image_rsrc8R7.jpg\n\n`concat(string)` 方法用于将字符串拼接到当前字符串中。但实际上，当前字符串并没有改变，而是创建了一个新字符串（拼接的结果）。下图图说明了这种行为：\n\
  \n|![](img/image_rsrc8R8.jpg\n\nconcat-example2.js\n\n```javascript\nlet a = \"\
  Hello\";\nlet b = \"World\";\nlet c = a.concat(b);\nconsole.log(c); // HelloWorld\n\
  console.log(a); // Hello\nconsole.log( a === c); // false\n```\n\n### 字符串的属性 (Properties\
  \ of String)\n\n- `constructor`\n- `length`: `length` 属性返回字符串中字符的数量。\n\nlength-example.js\n\
  ```javascript\nlet s1 = \"Tom\";\nconsole.log(s1);\nconsole.log(\"Length \"+ s1.length);\
  \ // 3\nlet s2 = \"Tom Jerry\";\nconsole.log(s2); // Tom Jerry\nconsole.log(\"Length\
  \ \"+ s2.length); // 9\n```\n\n### 字符串的方法 (Methods of String)\n\n- `charAt(index)`:\
  \ 返回指定索引处的字符。\n\n|![](img/image_rsrc8R9.jpg\n\ncharAt-example.js\n```javascript\n\
  let str = \"This is a String\";\nconsole.log(\"str.charAt(0) is:\" + str.charAt(0));\
  \ // T\nconsole.log(\"str.charAt(1) is:\" + str.charAt(1)); // h\nconsole.log(\"\
  str.charAt(2) is:\" + str.charAt(2)); // i\nconsole.log(\"str.charAt(3) is:\" +\
  \ str.charAt(3)); // s\nconsole.log(\"str.charAt(4) is:\" + str.charAt(4)); // \
  \ \nconsole.log(\"str.charAt(5) is:\" + str.charAt(5)); // i\n```\n\n- `charCodeAt(index)`:\
  \ 返回指定索引处字符的 Unicode 值。\n\n|![](img/image_rsrc8RA.jpg\n\ncharCodeAt-example.js\n\
  ```javascript\nlet str = \"This is a String\";\nconsole.log(\"str.charCodeAt(0)\
  \ is:\" + str.charCodeAt(0)); // 84\nconsole.log(\"str.charCodeAt(1) is:\" + str.charCodeAt(1));\
  \ // 104\nconsole.log(\"str.charCodeAt(2) is:\" + str.charCodeAt(2)); // 105\nconsole.log(\"\
  str.charCodeAt(3) is:\" + str.charCodeAt(3)); // 115\nconsole.log(\"str.charCodeAt(4)\
  \ is:\" + str.charCodeAt(4)); // 32\nconsole.log(\"str.charCodeAt(5) is:\" + str.charCodeAt(5));\
  \ // 105\n```\n\n- `concat(string2[,string3[, ..., stringN]])`\n\n- `indexOf(searchValue[,\
  \ fromIndex])`: 返回指定文本首次出现处的索引，从 `fromIndex` 向后搜索。\n\n|![](img/image_rsrc8RB.jpg\n\
