  \ onsubmit = \"return validateForm()\">\nYour Name: <input type=\"text\" name =\
  \ \"fullName\" value=\"\"/><br/><br/><\n<button type=\"submit\">Submit</button>\n\
  </form>\n</div>\n<br/><<!-- 表单外的按钮 -->\n表单外的按钮:<button onclick=\"submitByJavascript()\"\
  >Click Me to submit form</button>\n</body>\n</html>\n```\n\n# 5 自动验证\n\n浏览器可以自动验证表单上的几种类型的数据，例如通过向表单字段添加\
  \ `required` 属性来告诉浏览器该字段是必填的。如果用户没有输入该字段，浏览器将自动检查并通知用户。\n\n![](img/image_rsrc8SC.jpg)\n\
