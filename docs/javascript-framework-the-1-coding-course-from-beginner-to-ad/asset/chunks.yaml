    ## 1 switch 语句的结构


    语法


    ```javascript

    // variable_to_test: 一个待测试的变量 switch ( variable_to_test ) {case value1://在此处执行某些操作
    ...break;case value2//在此处执行某些操作 ...break;default://在此处执行某些操作...}

    ```


    `switch` 语句的特性：


    `switch` 将检查变量的值，并从上到下将变量与每个不同的值进行比较。每个要比较的值被称为 `case`。当某个 `case` 为真时，将执行该 case
    的语句块。


    !![](img/image_rsrc8RK.jpg)


    如果所有 cases 都为假，将执行 `default` 语句块。注意：在 `switch` 语句的结构中，可能也可能没有 `default` 语句块。


    !![](img/image_rsrc8RM.jpg)


    当找到 true case 时，将执行该 case 的语句块。如果此块中没有满足 `break` 语句，程序将继续执行下方的块，直到遇到 `break` 语句或没有语句块需要执行。


    `break` 语句使程序退出 `switch`。（见下图）。


    !![](img/image_rsrc8RN.jpg)


    注意 `case` 语句是一个特定的值，你不能进行以下操作：


    ```javascript

    // 这是不允许的 !!case (age < 18) :// case 仅接受特定值，例如:case 18://在此处执行某些操作 ..break;

    ```


    ## 2 `switch` 示例


    `switch-example.js`

    ```javascript

    // 声明一个变量 agelet age = 20;// 检查年龄的值 witch (age) {// Case age = 18case 18:console.log("You
    are 18 year old");break;// Case age = 20case 20:console.log("You are 20 year old");break;//
    剩余情况 default:console.log("You are not 18, 20 year old");}

    ```

    **输出**

    | You are 20 year old |


    ## 3 switch 中的 `break` 语句


    `break` 意味着一种出现在 `case` 块或 `switch` 的 `default` 块中的语句。当遇到 `break` 语句时，程序将退出 `switch`。


    !![](img/image_rsrc8RP.jpg)


    当程序遇到 `switch` 语句时，它将从上到下检查 cases。当找到 true case 时，将执行该 case 的语句块。


    **示例：**


    `switch-example2.js`

    ```javascript

    // 声明一个变量 agelet age = 30;// 检查年龄的值 witch (age) {// Case age = 18case 18:console.log("You
    are 18 year old");break;// Case age = 30case 30:console.log("You are 30 year old");break;//
    剩余情况 default:console.log("Other age");}

    ```

    **输出**

    | You are 30 year old |


