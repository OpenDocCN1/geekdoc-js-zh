    \ |\n\n# 3 位运算的用途\n\n位运算直接由计算机处理器支持，其执行速度非常快。下面我列出了一些使用这些计算的示例。\n\n在 `Java`、`C#`、`C/C++`\
    \ 等语言对字符串（字符）使用位运算。注意：某些语言如 `Javascript` 不支持对 `String` 类型进行位运算。\n\n### 将大写字母转换为小写：\n\
    \n| // 规则: x | ' '('A' | ' ') ==> 'a'('B' | ' ') ==> 'b'('a' | ' ') => 'a' |\n\
    \n### 将小写字母转换为大写：\n\n| // 规则: x & '_'('a' & '_') ==> 'A'('b' & '_') ==> 'B'('A'\
    \ & '_') ==> 'A' |\n\n# 第 3 章：JavaScript 数组\n\n## 1 什么是数组\n\n数组是内存中存储数据的连续位置集合。每个内存位置被称为一个元素。\n\
    \n| ![](img/image_rsrc8PR.jpg) |\n\n以下是数组的特性：\n\n*   元素的索引从 0 开始 (0, 1, 2,..)，你可以通过索引访问元素。\n\
    *   数组也像变量。你必须在使用它之前对其进行声明。\n*   你可以更新或编辑数组中元素的值。\n\n### 为什么需要数组\n\n与其声明一个包含 `N`\
    \ 个元素的数组，你可以声明 `N` 个变量，但它有以下缺点：\n\n*   如果 `N` 是一个很大的数字，手动声明 `N` 个变量是不可行的。\n* \
    \  当你声明 `N` 个变量时，程序不会为你管理变量的顺序，因为变量没有索引的概念。\n\n## 2 声明数组\n\n和变量一样，你必须在使用数组之前声明它。\n\
    \n### 语法\n\n| // 声明 var myArray;// 初始化 myArray = [val1, val2, .., valN] // 或 var\
    \ myArray = [val1,val2, .., valN] |\n\n| ![](img/image_rsrc8PS.jpg) |\n\narray-example1.js\n\
    \n```javascript\nvar myArray = [ 4, 8, 13, 6, 55, 41, 42, 99, 1 ];\nconsole.log(\"\
    Length of myArray: \" + myArray.length); // 9 个元素\nconsole.log(\"Element at index\
    \ 0: \" + myArray[0]); // 4\nconsole.log(\"Element at index 1: \" + myArray[1]);\
    \ // 8\nconsole.log(\"Element at index 4: \" + myArray[4]); // 55\n```\n\n###\
    \ 你可以给数组元素赋值新值\n\narray-example2.js\n\n```javascript\nvar names = [ \"A\", \"\
    B\", 100 ];\nconsole.log(\"Length of array: \" + names.length); // 3 个元素\nconsole.log(\"\
    Element at index 0: \" + names[0]); // A\nconsole.log(\"Element at index 1: \"\
    \ + names[1]); // B\nconsole.log(\"Element at index 2: \" + names[2]); // 100\n\
    // 给索引为 2 的元素赋新值:\nnames[2] = \"D\";\nconsole.log(\"Element at index 2: \" + names[2]);\n\
    ```\n\n### 使用循环，你可以分别访问数组元素：\n\narray-loop-example.js\n\n```javascript\nvar fruits\
    \ = [\"Acerola\", \"Apple\", \"Banana\", \"Breadfruit\", \"Carambola\" ];\nfor(\
    \ var index = 0; index < fruits.length; index++) {\n    console.log(\"Index: \"\
    \ + index+\" Element value: \" +fruits[index])\n}\n```\n\n#### 输出\n\n| Index:\
    \ 0 Element value: AcerolaIndex: 1 Element value: AppleIndex: 2 Element value:\
    \ BananaIndex: 3 Element value: BreadfruitIndex: 4 Element value: Carambola |\n\
    \n## 3 数组对象\n\n数组也可以通过 `Array` 类创建：\n\n```javascript\n// 创建一个包含 4 个元素的数组\nvar\
    \ myArray1 = new Array(4);\n// 创建一个包含 3 个元素的数组：\nvar myArray2 = new Array(\"Acerola\"\
    , \"Apple\", \"Banana\");\n```\n\n### 示例：\n\narray-object-example.js\n\n```javascript\n\
    // 创建一个包含 4 个元素的数组：\nvar salaries = new Array(4);\nfor(var i = 0; i < salaries.length;\
    \ i++) {\n    console.log(salaries[i]); // undefined\n}\nfor(var i = 0; i < salaries.length;\
    \ i++) {\n    // 给元素赋新值:\n    salaries[i] = 1000 + 20 * i;\n}\nconsole.log(salaries[2]);\
    \ // 1040.\n```\n\n#### 输出\n\n| undefinedundefinedundefinedundefined1040 |\n\n\
    ## 4 数组方法\n\n数组是一个对象。它拥有方法。以下是其方法的列表：\n\n*   `concat()`\n*   `every()`\n*   `some()`\n\
    *   `filter()`\n*   `forEach()`\n*   `map()`\n*   `indexOf()`\n*   `join()`\n\
    *   `lastIndexOf()`\n*   `pop()`\n*   `push()`\n*   `reduce()`\n*   `reduceRight()`\n\
    *   `reverse()`\n*   `shift()`\n*   `slice()`\n*   `toSource()`\n*   `sort()`\n\
    *   `splice()`\n*   `toString()`\n*   `unshift()`\n*   `concat()`\n\n`concat()`\
    \ 方法返回一个新数组，其元素包含参数中数组（或值）中的元素合并后的结果。\n\n```javascript\n// 示例:array.concat(arrayOrValue1,\
    \ arrayOrValue2, ..., arrayOrValueN);\n```\n\n**参数：**\n`arrayOrValueN`: 一个数组或一个值。\n\
    \narray-concat-example.js\n\n```javascript\nvar alpha = [\"a\", \"b\", \"c\"];\n\
    var numeric = [1, 2, 3];\nvar results = alpha.concat(numeric, \"!\");\nconsole.log(alpha);\
    \ // [\"a\", \"b\", \"c\"];\nconsole.log(results); // [ 'a', 'b', 'c', 1, 2, 3,\
    \ '!' ]\n```\n\n### every()\n\n如果数组中的所有元素都通过提供的测试函数，该方法返回 true。\n\n```javascript\n\
    array.every(callback[, thisObject]);\n```\n\n**参数：**\n*   `callback` — 用于测试每个元素的函数。\n\
    *   `thisObject` — 在执行 `callback` 时用 `this` 使用的对象。\n\n例如，你有一个员工年龄值的数组，让我们使用 `every()`\
    \ 方法来测试数组中的所有元素是否都在 18-60 岁之间。\n\narray-every-example.js\n\n```javascript\n//\
    \ 测试值是否在 18 到 60 之间。\ntestAge = function(value, index, testArray)  {\n    return\
    \ value >= 18 && value <= 60;\n}\nvar ages = [18, 22, 59];\n// 或者: var okAll =\
    \ ages.every(testAge);\nvar okAll = ages.every(testAge, ages);\nconsole.log(\"\
    OK ALL? \" + okAll);\n```\n\n### forEach()\n\n该方法会为数组的每个元素调用函数。\n\n```javascript\n\
    array.forEach(callback[, thisObject]);\n```\n\n**参数：**\n*   `callback` — 为每个元素执行操作的函数。\n\
    *   `thisObject` — 在执行 `callback` 时用 `this` 使用的对象。\n\narray-forEach-example.js\n\
    \n```javascript\n// 检查值是否在 18 到 60 之间。\n// (回调函数)\nshowTestResult = function(value,\
    \ index, testArray)  {\n    if(value >= 18 && value <= 60) {\n        console.log(\"\
    Age \" + value + \" valid!\");\n    } else\n}\nvar ages = [5, 6, 18, 22, 59];\n\
    // 或者: ages.forEach(showTestResult);ages\n```\n\n#### 输出\n\n| Sorry, Age 5 invalid!Sorry,\
    \ Age 6 invalid!Age 18 valid!Age 22 valid!Age 59 valid! |\n\n# 第 4 章：JavaScript\
    \ 循环\n\n## 1 循环概述\n\n语句从上到下顺序执行。但当你想要多次执行一组语句时，可以使用循环。\n\n| ![](img/image_rsrc8PT.jpg)\
    \ |\n\n## 3 循环类型：\n\n*   `while` 循环\n*   `for` 循环\n*   `do .. while` 循环\n\n可以在循环中使用语句：\n\
    \n*   `continue`\n*   `break`\n\n| 控制语句 | 说明 |\n| :--- | :--- |\n| `break` | 终止循环语句。\
    \ |\n| `continue` | 跳过循环体的剩余部分并立即重新测试条件。 |\n\n## 2 while 循环\n\n`while` 循环的语法：\n\
    \n```javascript\nwhile (condition)  {\n// 在此处执行某些操作\n// ....\n}\n```\n\n### 示例：\n\
    \nwhile-loop-example.js\n\n```javascript\nconsole.log(\"While example\");\n//\
    \ 声明变量并赋值 2。\nlet x = 2;\n// 条件是 x < 10\n// 如果 x < 10 为真则运行\nwhile (x < 10) {\n\
    \    console.log(\"Value of x = \", x);\n    x = x + 3;\n}\n// 该语句在 while 块之外。\n\
    console.log(\"Finish\");\n```\n\n#### 输出\n\n| While loop exampleValue of x = 2Value\
    \ of x = 5Value of x = 8 |\n\n## 3 for 循环\n\n标准的 `for` 循环语法如下：\n\n```javascript\n\
    for(InitialValues; condition; updateValues ){//语句}\n```\n\n*   `InitialValues`:\
    \ 初始化循环中相关变量的值。\n*   `condition`: 定义执行命令块的条件。\n*   `updateValues`: 更新变量的新值。\n\n\
    for-loop-example.js\n\n```javascript\nconsole.log(\"For loop example\");\nfor(\
    \ let i = 0; i < 10; i= i + 3)  {\n    console.log(\"i= \"+ i);\n}\n```\n\n####\
    \ 输出\n\n| For loop examplei= 0i= 3i= 6i= 9 |\n\nfor-loop-example2.js\n\n```javascript\n\
    console.log(\"For loop example\");\nfor(let i = 0, j = 0; i + j < 10; i = i+1,\
    \ j = j+2)  {\n    console.log(\"i = \" + i +\", j = \" + j);\n}\n```\n\n####\
    \ 输出\n\n| i = 0, j = 0i = 1, j = 2i = 2, j = 4i = 3, j = 6i = 4, j = 8 |\n\n"
- fmt: "\n### For loop example\n\n| i = 0, j = 0 | i = 1, j = 2 | i = 2, j = 4 | i\
    \ = 3, j = 6 |\n\nUsing the `for` loop can help you traverse on the elements of\
    \ the array.\n\n`for-loop-example3.js`\n\n```javascript\nconsole.log(\"For loop\
    \ example\");// Array\nlet names =[\"Tom\",\"Jerry\", \"Donald\"];\nfor (let i\
    \ = 0; i < names.length; i++ ) {\n    console.log(\"Name = \", names[i]);\n}\n\
    console.log(\"End of example\");\n```\n\n**Output**\n\n| For loop example Name\
    \ = Tom Name = Jerry Name = Donald End of example |\n\n---\n\n### 4. For .. in\
    \ loop\n\nThe `for..in` loop helps you iterate over the properties of an object.\n\
    \n```javascript\nfor (prop in object) { // Do something}\n```\n\n**Example:**\n\
    \n`for-in-loop-example.js`\n\n```javascript\n// An object has 4 properties (name,\
    \ age, gender,greeting)\nvar myObject = {name : \"John\",age: 25,gender: \"Male\"\
    ,greeting : function() {return \"Hello\";}};\nfor(myProp in myObject) {\n    console.log(myProp);\n\
    }\n```\n\n**Output**\n\n| name age gender greeting |\n\n---\n\n### 5. For .. of\
    \ loop\n\nThe `for..of` loop helps you iterate over a Collection, for example,\
    \ `Map`, `Set`.\n\n**Example:**\n\n`for-of-example.js`\n\n```javascript\n// Create\
    \ a Set from an Array\nvar fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"\
    ] );\nfor(let fruit of fruits) {\n    console.log(fruit);\n}\n```\n\n**Output**\n\
    \n| Apple Banana Papaya |\n\n`for-of-example2.js`\n\n```javascript\n// Create\
    \ a Map object.\nvar myContacts = new Map();\nmyContacts.set(\"0100-1111\", \"\
    Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"0100-2222\"\
    , \"Donald\");\nfor( let arr of myContacts) {\n    console.log(arr);\n    console.log(\"\
    \ - Phone: \" + arr[0]);\n    console.log(\" - Name: \" + arr[1]);\n}\n```\n\n\
    **Output**\n\n| [ '0100-1111', 'Tom' ]- Phone: 0100-1111- Name: Tom [ '0100-5555',\
    \ 'Jerry' ]- Phone: 0100-5555- Name: Jerry [ '0100-2222', 'Donald' ]- Phone: 0100-2222-\
    \ Name: Donald |\n\n---\n\n### 6. do...while loop\n\nThe `do-while` loop is used\
    \ to execute a section of program many times. The characteristics of the `do-while`\
    \ is that the block of statement is always executed at least once. After each\
    \ iteration, the program will check the condition, if the condition is still correct,\
    \ the statement block will be executed again.\n\n```javascript\ndo { // Do something}\
    \ while (expression);\n```\n\n**Example:**\n\n`do-while-loop-example.js`\n\n```javascript\n\
    let value = 3;\ndo {\n    console.log(\"Value = \" + value);\n    value = value\
    \ + 3;\n} while (value < 10);\n```\n\n**Output**\n\n| Value = 3 Value = 6 Value\
    \ = 9 |\n\n---\n\n### 7. Use the break statement in the loop\n\n`break` is a statement\
    \ that may be located in a loop. This statement ends the loop unconditionally.\n\
    \n`loop-break-example.js`\n\n```javascript\nconsole.log(\"Break example\");//\
    \ Declare a variable and assign value of 2.\nlet x = 2;\nwhile (x < 15) {\n  \
    \  console.log(\"----------------------\");\n    console.log(\"x = \", x);\n \
    \   // If x = 5 then exit the loop.\n    if (x == 5) {\n        break;\n    }\n\
    \    // Increase value of x by 1\n    x = x + 1;\n    console.log(\"x after +\
    \ 1 = \", x);\n}\nconsole.log(\"End of example\");\n```\n\n**Output**\n\n| Break\
    \ example ---------------------- x = 2 x after + 1 = 3 ----------------------\
    \ x = 3 x after + 1 = 4 ---------------------- x = 4 x after + 1 = 5 ----------------------\
    \ x = 5 End of example |\n\n---\n\n### 8. Use the continue statement in the loop\n\
    \n`continue` is a statement which may be located in a loop. When caught the `continue`\
    \ statement, the program will ignore the command lines in block, below of `continue`\
    \ and start of a new loop.\n\n`loop-continue-example.js`\n\n```javascript\nconsole.log(\"\
    Continue example\");// Declare a variable and assign value of 2\nlet x = 2;\n\
    while (x < 7) {\n    console.log(\"----------------------\");\n    console.log(\"\
    x = \", x);\n    // % is used for calculating remainder\n    // If x is even,\
    \ then ignore the command line below of continue\n    // and start new iteration.\n\
    \    if (x % 2 == 0) {\n        // Increase x by 1.\n        x = x + 1;\n    \
    \    continue;\n    } else {\n        // Increase x by 1.\n        x = x + 1;\n\
    \        console.log(\"x after + 1 =\", x);\n    }\n}\nconsole.log(\"End of example\"\
    );\n```\n\n**Output**\n\n| Continue example ---------------------- x = 2 ----------------------\
    \ x = 3 x after + 1 = 4 ---------------------- x = 4 ---------------------- x\
    \ = 5 x after + 1 = 6 ---------------------- x = 6 End of example |\n\n---\n\n\
    ### 9. Labelled Loop\n\nAllows you to stick a label to a loop. It is like you\
    \ name a loop, which is useful when you use multiple nested loops in a program.\n\
    \nYou can use `break labelX statement;` to break a loop attached to `labelX`.\n\
    \nYou can use `continue labelX statement;` to continue a loop attached to `labelX`.\n\
    \n**Syntax:**\n\n```javascript\n// for loop with Label.label1: for( ... ) {}\n\
    // while loop with Label.label2: while ( ... ) {}\n// do-while loop with Label.label3:\
    \ do {} while ( ... );\n```\n\n**Example of using nested loops, labelled and labelled\
    \ break statement.**\n\n`labelled-loop-break-example.js`\n\n```javascript\nconsole.log(\"\
    Labelled Loop Break example\");\nlet i = 0;\nlabel1: while (i < 5) {\n    console.log(\"\
    ----------------------\\n\");\n    console.log(\"i = \" + i);\n    i++;\n    label2:\
    \ for (let j = 0; j < 3; j++) {\n        console.log(\"  --> \" + j);\n      \
    \  if (j > 0) {\n            // Exit the loop with label1.\n            break\
    \ label1;\n        }\n    }\n}\nconsole.log(\"Done!\");\n```\n\n**Output**\n\n\
    | Labelled Loop Break example ---------------------- i = 0 --> 0 --> 1 Done! |\n\
    \n**Example of using nested labelled loops and labelled continue statement.**\n\
    \n`labelled-loop-continue-example.js`\n\n```javascript\nlet i = 0;\nlabel1: while\
    \ (i < 5) {\n    console.log(\"outer i= \" + i);\n    i++;\n    label2: for (let\
    \ j = 0; j < 3; j++) {\n        if (j > 0) {\n            continue label2;\n \
    \       }\n        if (i > 1) {\n            continue label1;\n        }\n   \
    \     console.log(\"inner i= \" + i + \", j= \" + j);\n    }\n}\n```\n\n**Output**\n\
    \n| outer i= 0 inner i= 1, j= 0 outer i= 1 outer i= 2 outer i= 3 outer i= 4 |\n\
    \n---\n\n# Chapter 5 : JavaScript Functions\n\n1. What is Function\n2. Function\
    \ with default parameter\n3. Varargs parameter\n4. Anonymous Function\n5. Function\
    \ Constructor\n6. Generator Function\n\n### 1. What is Function\n\nA function\
    \ means a subprogram, which includes commands to perform duty. And when you want\
    \ to do such duty, you only need to call this. The function helps you maintain\
    \ the application and reuse code easily.\n\nBelow is the syntax for defining a\
    \ simple function without parameters:\n\n```javascript\nfunction function_name()\
    \ { function body}\n```\n\n**Example:**\n\n`first-function-example.js`\n\n```javascript\n\
    // Define a function:\nfunction() {\n    console.log(\"Hello World!\");\n}\n//\
    \ Call function.\n```\n\n**Output**\n\n| Hello World! |\n\nA standard function\
    \ is defined by the following syntax:\n\n```javascript\nfunction function_name(parameter1,\
    \ parameter2, .. parameterN) { Function body}\n```\n\nUse the `function` keyword\
    \ to define a function. Functions can have 0 or many parameters. The function\
    \ always returns a value, if this value is not indicated, it will return `undefined`.\
    \ To return a value we use the `return` keyword.\n\n`standard-function-example.js`\n\
    \n```javascript\nfunction calculateTax(salary) {\n    if(salary >= 1000) { //\
    \ The function will end\n        return salary * 20 / 100;\n    }\n    if(salary\
    \ >= 500) { // The function will end\n        return salary * 10 / 100;\n    }\n\
    \    return 0;\n}\nlet tax = calculateTax(2000);\nconsole.log(\"Salary: 2000,\
    \ tax: \" + tax);\ntax = calculateTax(800);\nconsole.log(\"Salary: 800, tax: \"\
    \ + tax);\ntax = calculateTax(300);\nconsole.log(\"Salary: 300, tax: \" + tax);\n\
    ```\n\n**Output**\n\n| Salary: 2000, tax: 400 Salary: 800, tax: 80 Salary: 300,\
    \ tax: 0 |\n\n---\n\n### 2. Function with default parameter\n\nA function allows\
    \ parameters to be initialized with default values. These default values will\
    \ be used if you do not pass values to these parameters (Or pass an `undefined`\
    \ value when calling a function like the following example).\n\n`default-params-example1.js`\n\
    \n```javascript\nfunction add(a, b = 1) {\n    return a+b;\n}\n// Test\nlet value\
    \ = add(2, 3);\nconsole.log(value); // 5\n// Test\nvalue = add(9);\nconsole.log(value);\
    \ // 10\n```\n\n`default-params-example2.js`\n\n```javascript\nfunction calculateTax(salary\
    \ = 1000, rate = 0.2) {\n    return salary * rate;\n}\n// Test\nconsole.log(calculateTax());\
    \ // 1000 * 0.2 = 200\nconsole.log(calculateTax(2000)); // 2000 * 0.2 = 400\n\
    console.log(calculateTax(3000, 0.5)); // 3000 * 0.5 = 1500\nconsole.log(calculateTax(undefined,\
    \ 0.5)); // 1000 * 0.5 = 500\n```\n\n---\n\n### 3. Varargs parameter\n\nVarargs\
    \ parameter (Or also refered to as \"Rest Parameters\") means a special parameter\
    \ of a function. You can pass 0, 1 or more values to the Varargs parameters.\n\
    \n**characteristics of Varargs parameter:**\n\n*   If a function has a Varargs\
    \ parameter, this parameter has to be the last parameter of the function.\n* \
    \  A function has at maximum 1 Varargs parameter.\n\n**Syntax:**\n\n```javascript\n\
    function function_name(parameter1, parameter2, ...varargs) {}\n```\n"
