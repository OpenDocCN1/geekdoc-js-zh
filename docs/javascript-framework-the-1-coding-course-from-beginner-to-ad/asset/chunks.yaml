    \ for one time use purpose. It is called immediately. You will not be able to\
    \ use this function anywhere else in the program because it does not exist after\
    \ being used.\n\n#### used-once-function-example.js\n\n```javascript\n// Defind\
    \ a function, and call it.\n(function sayHello()  {console.log(\"Hello Everyone\"\
    );}) ();\ntry  {\n// This function does not exist.\nsayHello();}\n}catch(e)  {\n\
    console.log(e); // ReferenceError: sayHello is not defined\n} \n```\n\nYou can\
    \ also create a function to use only one time with the `void` keyword. It is called\
    \ immediately, and no longer exists after being called.\n\n#### void-function-example.js\n\
    \n```javascript\n// Defind a function, and call it.\nvoid function sayHello()\
    \  {console.log(\"Hello Everyone\");}();\ntry  {\n// This function does not exist.\n\
    sayHello();}\n}catch(e)  {\nconsole.log(e); // ReferenceError: sayHello is not\
    \ defined\n} \n```\n\n# Chapter 15: Classes and Objects\n\n1. Your First Class\n\
    2. Getter & Setter\n3. Static Field\n4. Static method\n5. Object Comparison operators\n\
    \n## 1 Your First Class\n\nBelow, I have a `Rectangle`, which has 2 important\
    \ properties such as `width` and `height`. We will define a class named `Rectangle`\
    \ to simulate it with the ES6 syntax.\n\n![](OEBPS/image_rsrc8T3.jpg)\n\nCreate\
    \ a resource file `rectangle.js`:\n\n#### rectangle.js\n\n```javascript\n// Define\
    \ a class.\nclass Rectangle  {\n// Contructor with 2 parameters. \n// (Used to\
    \ create instance)\n// this.width refers to the width property of the class\n\
    constructor (width = 5 , height = 10)  {this.width = width;this.height = height;}\n\
    // A method calculates the area of the rectangle.\ngetArea() {var area = this.width\
    \ * this.height\nreturn area}}\n// Create an object of Rectangle via Constructor.\n\
    var rect = new Rectangle(3, 5);\nconsole.log(\"Height \"+ rect.height);\nconsole.log(\"\
    Width \"+ rect.width);\n// Call method\nlet area = rect.getArea();\nconsole.log(\"\
    Area \"+ area );\n```\n\nRunning the example:\n\n**Output**\nHeight 5\nWidth 3\n\
    Area 15\n\nWhat will happen when you create an object from the constructor of\
    \ the class?\n\n![](OEBPS/image_rsrc8T4.jpg)\n\nWhen you call the Constructor\
    \ of class, a new object will be created and the properties of the object will\
    \ be assigned values from parameters.\n\nIn the ECMAScript, each class has at\
    \ most only one constructor. Like a function, the parameters of the constructor\
    \ can also have a default value. So you can create objects in different ways.\n\
    \n```javascript\n// width = 3, height = 5\nlet rect = new Rectangle(3, 5);\n//\
    \ width = 15, height = 10 (Default)\nlet rect2 = new Rectangle(15);\n// width\
    \ = 5 (Default), height = 50\nlet rect3 = new Rectangle(undefined, 50);\n// width\
    \ = 5 (Default), height = 10 (Default)\nlet rect4 = new Rectangle();\n```\n\n\
    ## 2 Getter & Setter\n\nBefore giving the concepts of Getter & Setter, let's analyze\
    \ a situation:\n\nAssume that we have a `Person` class and this class has a property\
    \ which is `name`.\n\n#### Class Person\n\n```javascript\nclass Person  {constructor(name)\
    \ {this.name = name;}}\n```\n\nAnd you can access the properties of the object,\
    \ or assign a new value to it without having any problems.\n\n```javascript\n\
    // Create an object\nlet person = new Person(\"Tom\");\n// Access to property\
    \ name.\nconsole.log( person.name); // Tom\n// Assign new value to property name.\n\
    person.name = \"Jerry\"; // !!!\nconsole.log( person.name ); // Jerry\n```\n\n\
    Accessing freely to a property and changing its value from the outside of the\
    \ class are really dangerous. Sometimes, you want to have a property that it is\
    \ not possible to access, or assign a new value to from the outside of the class.\
    \ Getter/Setter allows you to create such a property.\n\nOkay, we write the `Person`\
    \ class again. `get` keyword put in front of a method without the class parameters\
    \ helps create a property with the name which is the method name. This method\
    \ will be called every time when the program accesses this property.\n\n#### getter-example1.js\n\
    \n```javascript\nclass Person  {\nconstructor (name)  {// property: __name\nthis.__name\
    \ = name;}\n// Getter of property name\nget name()  {console.log(\"Call getter\
    \ of property 'name'!!\");\nreturn this.__name;}}\n// ------------ TEST -----------------\n\
    let person = new Person(\"Tom\");\n// Access to property 'name' ==> Call getter\n\
    console.log( person.name); // Tom\n// Assign new value to property name.\nperson.name\
    \ = \"Jerry\"; // Not Working!!!!\n// Access to property 'name' ==> Call getter\n\
    console.log( person.name); // Tom\n```\n\n`set` keyword put in front of a method\
    \ with one parameter of class helps create a property with the name which is the\
    \ method name. This method will be called every time the program assigns a new\
    \ value to this property.\n\n#### setter-example1.js\n\n```javascript\nclass Person\
    \  {constructor (name)  {// property: __name\nthis.__name = name;}\n// Setter\
    \ of property name\nset name(newName)  {console.log(\"Call setter of property\
    \ 'name'!!\");\nthis.__name = newName;}\n// A method\nshowInfo()  {console.log(\"\
    Person: \" + this.__name);}}\n// ------------ TEST -----------------\nlet person\
    \ = new Person(\"Tom\");\n// Can not access to property 'name'\nconsole.log( person.name);\
    \ // undefined\n// Set new value to property 'name' ==> Call setter\nperson.name\
    \ = \"Jerry\";\nperson.showInfo(); // Person: Tom\n```\n\nExample of a property\
    \ with Getter & Setter:\n\n#### getter-setter-example.js\n\n```javascript\nclass\
    \ Rectangle  {constructor (width = 5 , height = 10)  {this.__width = width;this.height\
    \ = height;}\n// Getter of property 'width'\nget width()  {return this.__width;}\n\
    // Setter of property 'width'\nset width(newWidth)  {if(newWidth > 0) {this.__width\
    \ = newWidth;} else {console.log(\"Invalid width \" + newWidth);}}}\n// ------------\
    \ TEST ------------------\nvar rect = new Rectangle(3, 5);\nconsole.log(\"Height\
    \ \"+ rect.height); // Height: 5\nconsole.log(\"Width \"+ rect.width); // Width:\
    \ 3\nrect.width = -100;\nconsole.log(\"Height \"+ rect.height); // Height: 5\n\
    console.log(\"Width \"+ rect.width); // Width: 3\nrect.width = 100;\nconsole.log(\"\
    Height \"+ rect.height); // Height: 5\nconsole.log(\"Width \"+ rect.width); //\
    \ Width: 100\n```\n\n**Output**\nHeight 5\nWidth 3\nInvalid width -100\nHeight\
    \ 5\nWidth 3\nHeight 5\nWidth 100\n\n#### Private property\n\n```javascript\n\
    class Something {constructor(){this.#someProperty = \"test\";}}\nconst instance\
    \ = new Something();\nconsole.log(instance.#someProperty); // undefined\n```\n\
    \n#### getter-example2.js\n\n```javascript\nclass Person  {constructor (name)\
    \  {// Private property: #name\nthis.#name = name;}\n// Getter of property name\n\
    get name()  {console.log(\"Call getter of property 'name'!!\");\nreturn this.#name;}}\n\
    ```\n\n### 3 Static Field\n\nThe `static` keyword appears in the Getter or Setter\
    \ declarations to help you define a static field. You can access static fields\
    \ through a class name.\n\nstatic fields with fixed value (unchangeable) are called\
    \ constant static fields.\n\nstatic-field-example1.js\n"
