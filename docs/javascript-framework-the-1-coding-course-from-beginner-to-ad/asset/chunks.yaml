    \ 24: Javascript MouseEvent\n\n## 1 MouseEvent\n\n`MouseEvent` is an interface\
    \ that represents for the events occurring when users interact with pointing devices,\
    \ such as mouse, common events such as `click`, `dbclick`, `mousedown`, `mouseup`,...\n\
    \n`MouseEvent` is an sub-interface of `UIEvent`.\n\n![](OEBPS/image_rsrc8U3.jpg)\n\
    \n### Event types of MouseEvent:\n\n| Event | Description |\n| :--- | :--- |\n\
    | `click` | The event occurs when the user clicks on an element |\n| `contextmenu`\
    \ | The event occurs when the user right-clicks on an element to open a context\
    \ menu |\n| `dblclick` | The event occurs when the user double-clicks on an element\
    \ |\n| `mousedown` | The event occurs when the user presses a mouse button over\
    \ an element |\n| `mouseup` | The event occurs when a user releases a mouse button\
    \ over an element |\n| `mouseenter` | The event occurs when the pointer is moved\
    \ onto an element |\n| `mouseleave` | The event occurs when the pointer is moved\
    \ out of an element |\n| `mousemove` | The event occurs when the pointer is moving\
    \ while it is over an element or its children. |\n| `mouseout` | The event occurs\
    \ when a user moves the mouse pointer out of an element, or out of one of its\
    \ children |\n| `mouseover` | The event occurs when the pointer is moved onto\
    \ an element, or onto one of its children |\n\n### `mousedown`, `mouseup`, `click`\n\
    \nLet's start with the most common event out of the mouse events that is `click`.\
    \ It is formed from pressing down and releasing. The `click` event is illustrated\
    \ as below:\n\n![](OEBPS/image_rsrc8U4.jpg)\n\n### `dbclick`\n\nIf you click 2\
    \ times quickly, it will create a `dbclick` event.\n\n### `mouseover` vs `mouseenter`\n\
    \nThe `mouseenter` event occurs when the cursor enters an element. The `mouseover`\
    \ event occurs when the cursor enters an element or one of its child elements.\n\
    \n![](OEBPS/image_rsrc8U5.jpg)\n\n### `mouseleave` vs `mouseout`\n\nThe `mouseleave`\
    \ element occurs when the cursor moves out of an element. The `mouseout` event\
    \ happens when the cursor moves out of an element or one of its child elements.\n\
    \n![](OEBPS/image_rsrc8U6.jpg)\n\nThe following example helps you compare `mouseenter`\
    \ vs `mouseover`, `mouseleave` vs `mouseout`:\n\n![](OEBPS/image_rsrc8U7.jpg)\n\
    \nenter-vs-over-leave-vs-out.html\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>Javascript Mouse Events</title>\n  <script src=\"enter-vs-over-leave-vs-out.js\"\
    ></script>\n  <style>\n    #target-div {width: 320px;height: 150px;background:\
    \ blue;}\n    #target-div > div {width: 50px;height: 80px;margin: 40px 0 0 40px;padding:\
    \ 5px 0 0 5px;float: left;background: yellow;}\n  </style>\n</head>\n<body>\n\
    \  <h3>mouseenter vs mouseover</h3>\n  <h3>mouseleave vs mouseout</h3>\n  <div\
    \ id=\"target-div\"onmouseenter=\"mouseenterHandler(event)\"onmouseover=\"mouseoverHandler(event)\"\
    onmouseleave=\"mouseleaveHandler(event)\"onmouseout=\"mouseoutHandler(event)\"\
    >\n    <div>Child</div>\n    <div>Child</div>\n    <div>Child</div>\n  </div>\n\
    \  <h3>Statistics:</h3>\n  <div style=\"color:red;\" id=\"statistics-div\"></div>\n\
    </body>\n</html>\n```\n\nenter-vs-over-leave-vs-out.js\n\n```javascript\nvar enterCount\
    \ = 0;\nvar overCount = 0;\nvar leaveCount = 0;\nvar outCount = 0;\nfunction mouseenterHandler(evt)\
    \ {\n  enterCount += 1;\n  showStatistics();\n}\nfunction mouseoverHandler(evt)\
    \ {\n  overCount += 1;\n  showStatistics();\n}\nfunction mouseleaveHandler(evt)\
    \ {\n  leaveCount += 1;\n  showStatistics();\n}\nfunction mouseoutHandler(evt)\
    \ {\n  outCount += 1;\n  showStatistics();\n}\nfunction showStatistics() {\n \
    \ var html =\"enterCount:\" + enterCount + \"<br/>\" //+\"overCount:\" + overCount\
    \  + \"<hr/>\" //+\"leaveCount:\" + leaveCount + \"<br/>\" //+\"outCount:\" +\
    \ outCount ;\n  document.getElementById(\"statistics-div\").innerHTML = html;\n\
    }\n```\n\n### `mousemove`\n\n![](OEBPS/image_rsrc8U8.jpg)\n\nmousemove-example.html\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Javascript Mouse Events</title>\n\
    \  <script src=\"mousemove-example.js\"></script>\n  <style>\n    #target-div\
    \ {width: 320px;height: 150px;background: blue;margin-bottom: 50px;}\n    #target-div\
    \ > div {width: 50px;height: 150px;margin: 40px 0 0 40px;padding: 5px 0 0 5px;float:\
    \ left;background: yellow;}\n  </style>\n</head>\n<body>\n  <h3>mousemove example</h3>\n\
    \  <div id=\"target-div\" onmousemove=\"mousemoveHandler(event)\">\n    <div>Child</div>\n\
    \    <div>Child</div>\n    <div>Child</div>\n  </div>\n  <h3>Statistics:</h3>\n\
    \  <div style=\"color:red;\" id=\"statistics-div\"></div>\n</body>\n</html>\n\
    ```\n\nmousemove-example.js\n\n```javascript\nvar moveCount = 0;\nfunction mousemoveHandler(evt)\
    \ {\n  moveCount += 1;\n  showStatistics();\n}\nfunction showStatistics() {\n\
    \  var html = \"moveCount:\" + moveCount;\n  document.getElementById(\"statistics-div\"\
    ).innerHTML = html;\n}\n```\n\n## 2 Properties & Methods\n\n`MouseEvent` is the\
    \ sub- interface of `UIEvent`, therefore, it inherits the properties and methods\
    \ from this interface.\n\n### Key\n\n| Property | Description |\n| :--- | :---\
    \ |\n| `altKey` | Returns true if \"ALT\" key was pressed when the mouse event\
    \ was triggered, otherwise returns false. |\n| `ctrlKey` | Returns true if \"\
    CTRL\" key was pressed when the mouse event was triggered, otherwise returns false.\
    \ |\n| `shiftKey` | Returns true if \"SHIFT\" key was pressed when an event was\
    \ triggered, otherwise returns false. |\n| `metaKey` | Returns true if \"META\"\
    \ key was pressed when an event was triggered, otherwise returns false. |\n\n\
    ### Example with the `ctrlKey` property:\n\n![](OEBPS/image_rsrc8U9.jpg)\n\nprop-ctrlKey-example.html\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Javascript Mouse Events</title>\n\
    \  <style>#target-div {width: 320px;height: 150px;background: blue;margin-bottom:\
    \ 10px;}</style>\n  <script>\n    function clickHandler(evt) {\n      var html\
    \ = \"evt.ctrlKey=\" + evt.ctrlKey;\n      document.getElementById(\"log-div\"\
    ).innerHTML = html;\n    }\n  </script>\n</head>\n<body>\n  <h3>Press Ctrl key\
    \ and Click</h3>\n  <div id=\"target-div\" onclick=\"clickHandler(event)\" ></div>\n\
    \  <div style=\"color:red;\" id=\"log-div\"></div>\n</body>\n</html>\n```\n\n\
    ### Position:\n\n| Property | Description |\n| :--- | :--- |\n| `clientX` | Returns\
    \ the horizontal coordinate of the mouse pointer, relative to the current window.\
    \ |\n| `clientY` | Returns the vertical coordinate of the mouse pointer, relative\
    \ to the current window. |\n| `offsetX` | Returns the horizontal coordinate of\
    \ the mouse pointer relative to the position of the edge of the target element\
    \ |\n| `offsetY` | Returns the vertical coordinate of the mouse pointer relative\
    \ to the position of the edge of the target element |\n| `pageX` | Returns the\
    \ horizontal coordinate of the mouse pointer, relative to the document. |\n| `pageY`\
    \ | Returns the vertical coordinate of the mouse pointer, relative to the document.\
    \ |\n| `screenX` | Returns the horizontal coordinate of the mouse pointer, relative\
    \ to the screen (Computer or device) |\n| `screenY` | Returns the vertical coordinate\
    \ of the mouse pointer, relative to the screen (Computer or device) |\n| `movementX`\
    \ | Returns the horizontal coordinate of the mouse pointer relative to the position\
    \ of the last mousemove event |\n| `movementY` | Returns the vertical coordinate\
    \ of the mouse pointer relative to the position of the last mousemove event |\n\
    \n![](OEBPS/image_rsrc8UA.jpg)\n\n![](OEBPS/image_rsrc8UB.jpg)\n\nprop-positions-example.html\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Javascript Mouse Events</title>\n\
    \  <script src=\"prop-positions-example.js\"></script>\n  <style>#target-div {width:\
    \ 300px;height: 210px;background: #ccc;margin: 0px 0px 10px 20px;padding: 5px;}</style>\n\
    </head>\n<body style=\"height:450px; width:1000px;\">\n  <h3>Positions</h3>\n\
    \  <div id=\"target-div\" onmousemove=\"mousemoveHandler(event)\" ></div>\n</body>\n\
    </html>\n```\n\nprop-positions-example.js\n"
