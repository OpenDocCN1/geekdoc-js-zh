    ![](img/image_rsrc8SA.jpg)\n![](img/image_rsrc8SB.jpg)\n\n# 4 通过 Javascript 提交\n\
    \n在表单内点击 `<button type=\"submit\">` 或 `<input type=\"submit\">` 可以帮助你将表单数据发送到服务器，但你也可以通过\
    \ Javascript 实现。\n\n`javascript-submit-example.html`\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Javascript Submit</title>\n<script type = \"text/javascript\"\
    >\nfunction validateForm() {var name = document.forms[\"myForm\"][\"fullName\"\
    ].value;\nif(name == \"\") {\n  alert(\"Please enter your name\");\n  return false;\n\
    }\nreturn true;\n}\nfunction submitByJavascript()  {var valid = validateForm();\n\
    if(!valid)  {\n  return;\n}\nvar myForm = document.forms[\"myForm\"];\nmyForm.submit();\n\
    }\n</script>\n</head>\n<body>\n<h2>Submit a from with Javascript</h2>\n<div style=\"\
    border:1px solid #ddd; padding: 5px;\">\n<form name=\"myForm\" action=\"process-action.html\"\
    \ onsubmit = \"return validateForm()\">\nYour Name: <input type=\"text\" name\
    \ = \"fullName\" value=\"\"/><br/><br/><\n<button type=\"submit\">Submit</button>\n\
    </form>\n</div>\n<br/><<!-- 表单外的按钮 -->\n表单外的按钮:<button onclick=\"submitByJavascript()\"\
    >Click Me to submit form</button>\n</body>\n</html>\n```\n\n# 5 自动验证\n\n浏览器可以自动验证表单上的几种类型的数据，例如通过向表单字段添加\
    \ `required` 属性来告诉浏览器该字段是必填的。如果用户没有输入该字段，浏览器将自动检查并通知用户。\n\n![](img/image_rsrc8SC.jpg)\n\
    ![](img/image_rsrc8SD.jpg)\n\n`required-example.html`\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Required</title>\n</head>\n<body>\n<h2>Required attribute</h2>\n\
    <div style=\"border:1px solid #ddd; padding: 5px;\">\n<form name=\"myForm\" action=\"\
    process-action.html\" onsubmit = \"return validateForm()\">\nYour Name: <input\
    \ type=\"text\" name = \"fullName\" value=\"\" required/><br/><br/><\n<button\
    \ type=\"submit\">Submit</button>\n</form>\n</div>\n</body>\n</html>\n```\n\n\
    HTML 5 新引入的一些 `<input>` 元素，例如 color、date、datetime-local、email、month、number、range、search、tel、time、url、week。这些元素具有特殊属性，帮助浏览器知道如何自动验证其数据。以下是一些此类属性的列表：\n\
    \n| 属性 |  |\n| :--- | :--- |\n| disabled | 指定 Input 元素禁用 |\n| max | 指定 Input 元素的最大值\
    \ |\n| min | 指定 Input 元素的最小值 |\n| pattern | 指定 Input 元素的数值模式 |\n| required | 指定\
    \ Input 字段需要该元素 |\n| type | 指定 Input 元素的类型 |\n\n示例：带有 `min`、`max` 属性的 `<input\
    \ type=\"number\">`，如果用户输入的数字超出允许的范围，浏览器将通知用户。\n\n`attr-min-max-example.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Min Max Attributes</title>\n\
    </head>\n<body>\n<h2>Attribute min, max</h2>\n<div style=\"border:1px solid #ddd;\
    \ padding: 5px;\">\n<form name=\"myForm\" action=\"process-action.html\">\nEnter\
    \ your score (0-100):<input type=\"number\" name = \"score\" min= \"0\" max =\
    \ \"100\"/><br/><br/><\n<button type=\"submit\">Submit</button>\n</form>\n</div>\n\
    </body>\n</html>\n```\n\n![](img/image_rsrc8SE.jpg)\n![](img/image_rsrc8SF.jpg)\n\
    ![](img/image_rsrc8SG.jpg)\n\n示例：要求用户输入 2 个字符的国家代码。\n\n`attr-pattern-example.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>pattern attribute</title>\n\
    </head>\n<body>\n<h2>Attribute: pattern</h2>\n<div style=\"border:1px solid #ddd;\
    \ padding: 5px;\">\n<form name=\"myForm\" action=\"process-action.html\">\nCountry\
    \ code:<input type=\"text\" name = \"countryCode\" pattern=\"[A-Za-z]{2}\"title=\"\
    Two letter code\"/><br/><br/><\n<button type=\"submit\">Submit</button>\n</form>\n\
    </div>\n</body>\n</html>\n```\n\n![](img/image_rsrc8SH.jpg)\n![](img/image_rsrc8SJ.jpg)\n\
    ![](img/image_rsrc8SK.jpg)\n![](img/image_rsrc8SM.jpg)\n\n示例：要求用户输入至少 8 个字符的密码。\n\
    \n`attr-pattern-example2.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>pattern\
    \ attribute</title>\n</head>\n<body>\n<h2>Attribute: pattern</h2>\n<div style=\"\
    border:1px solid #ddd; padding: 5px;\">\n<form name=\"myForm\" action=\"process-action.html\"\
    >\nPassword:<input type=\"password\" name = \"password\" pattern=\".{8,}\"title=\"\
    8 more characters\"/><br/><br/><\n<button type=\"submit\">Submit</button>\n</form>\n\
    </div>\n</body>\n</html>\n```\n\n![](img/image_rsrc8SN.jpg)\n![](img/image_rsrc8SP.jpg)\n\
    \n示例：要求用户输入包含至少 8 个字符、至少一个大写字母和一个至少和小写字母的强密码。\n\n`attr-pattern-password-example.html`\n\
