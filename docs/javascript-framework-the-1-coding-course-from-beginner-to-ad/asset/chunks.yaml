    ## 1. ECMAScript 中的继承


    ECMAScript 允许你创建一个从一个或多个其他类扩展而来的类。这个类被称为派生类或子类。


    子类将从父类继承属性、方法和其他成员。它还可以重写来自父类的方法。在 ECMAScript 中，每个类只有一个构造函数。如果类本身没有定义它自己的构造函数，它将继承父类的构造函数。相反，如果子类定义了构造函数，它将不会继承父类的构造函数。


    我们需要几个类来参与示例。


    * `Animal`: 模拟动物的类。

    * `Duck`: `Animal` 的子类。

    * `Cat`: `Animal` 的子类。

    * `Mouse`: `Animal` 的子类。


    ![](img/image_rsrc8TE.jpg)


    在 ECMAScript 中，类的构造函数用于创建对象（实例），并为属性赋值。子类的构造函数总是会调用父类的构造函数，以初始化父类属性的值，然后为它自己的属性赋值。


    示例：


    `Cat` 是继承自 `Animal` 类的类，它也有自己的属性。


    inherit-example1.js


    ```javascript

    class Animal {constructor(name)  {this.name = name;}showInfo()  {console.log("I''m
    " + this.name);}move()  {console.log("Moving..");}}class Cat extends Animal {constructor(name,
    age, height) {super(name);// Cat''s 属性:this.age = age;this.height = height;}//
    重写父类的方法.showInfo()  {console.log("My name is " + this.name);}// 其他方法...sleep()  {console.log("Sleeping..");}}//
    ------------- 测试 --------------------let tom = new Cat("Tom", 3, 20);console.log("Call
    move() method");tom.move();console.log("\n");console.log("Call showInfo() method");tom.showInfo();

    ```


    ### 输出


    ```

    Call move() method

    Moving..

    Call showInfo() method

    My name is Tom

    ```


    当你在从构造函数创建对象时发生了什么？它是如何调用父类构造函数的？请看下方的图：


    ![](img/image_rsrc8TF.jpg)


    通过上面的插图你可以看到，父类的构造函数是在子类的构造函数中调用的，父类的构造函数在子类的构造函数中被调用。


    ## 2 方法重写


    默认情况下，子类从父类继承方法，但父类可以重写方法。


    inheritance-example2.js


    ```javascript

    class Animal {constructor(name) {this.name = name;}showInfo()  {console.log("I''m
    " + this.name);}move()  {console.log("Moving..");}}class Mouse extends Animal
    {constructor(name, age, height) {super(name);this.age = age;this.height = height;}//
    重写父类的方法.showInfo()  {console.log("Age: " + this.age);console.log("Height: " +
    this.height);}// 重写父类的方法.move()  {console.log("Mouse..");}}// ------------- 测试
    --------------------let jerry = new Mouse("Jerry", 3, 5);console.log("Call move()
    method");jerry.move();console.log("\n");console.log("Call showInfo() method");jerry.showInfo();

    ```


    ### 输出


    ```

    Call move() method

    Mouse..

    Call showInfo() method

    Age: 3

    Height: 5

    ```


    ## 3 抽象方法


    抽象方法或抽象类的概念在 Java、C# 等语言中是有定义的。但在 ECMAScript 中没有明确定义。不过，我们有一种方法可以定义它。


    作为抽象类的类定义了抽象方法，子类如果想使用这些方法必须重写它们。抽象方法总是抛出“未实现错误”异常。


    abstract-example.js


    ```javascript

    // 一个抽象类。

    class AbstractDocument {constructor(name) {this.name = name}// 该方法不能被使用，因为它总是抛出错误。show()
    {//未实现错误 throw "Subclass must implement abstract method";}}class PDF extends AbstractDocument
    {/* 重写父类的方法 show() {console.log("Show PDF document:", this.name);}}class Word
    extends AbstractDocument {show() {console.log("Show Word document:", this.name)}}//
    -------------------- 测试 -------------------------let doc1 = new PDF("Python tutorial");let
    doc2 = new Word("Java IO Tutorial");let doc3 = new PDF("ECMAScript Date & Time
    Tutorial");let documents = [doc1, doc2, doc3];for (let i = 0; i < documents.length;
    i++) {documents[i].show();}let doc4 = new AbstractDocument("An Abstract Document");doc4.show();
    // 抛出错误!!!

    ```


    ## 4 运算符 - instanceof, typeof


    `instanceof` 运算符可以帮你检查“某物”是否是某个类的实例。


    instanceof-example.js


