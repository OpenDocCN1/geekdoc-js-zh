    ## 1 Inheritance in ECMAScript


    ECMAScript allows you to create a class extended from one or more other classes.
    This class is called a derived class, or a subclass.


    A child class will inherit properties, methods, and other members from a parent
    class. It can also override methods from the parent class. In ECMAScript, each
    class has only one constructor. If a class itself does not define its own constructor,
    it inherits the constructor of the parent class. Contrarily, if the child class
    defines a constructor, it will not inherit the constructor of the parent class.


    We need a few classes to participate in examples.


    * `Animal`: Class simulate an animal.

    * `Duck`: Subclass of `Animal`.

    * `Cat`: Subclass of `Animal`.

    * `Mouse`: Subclass of `Animal`.


    ![](OEBPS/image_rsrc8TE.jpg)


    In ECMAScript, constructor of class used to create an object (instance), and assign
    the value for the properties. Constructor of subclasses always called to a constructor
    of parent class to initialize value for the properties in the parent class, then
    it assign value for its properties.


    Example:


    `Cat` is the class that inherits from the `Animal` class, it also has its properties.


    inherit-example1.js


    ```javascript

    class Animal {constructor(name)  {this.name = name;}showInfo()  {console.log("I''m
    " + this.name);}move()  {console.log("Moving..");}}class Cat extends Animal {constructor(name,
    age, height) {super(name);// Cat''s properties:this.age = age;this.height = height;}//
    Override method of parent class.showInfo()  {console.log("My name is " + this.name);}//
    Other method...sleep()  {console.log("Sleeping..");}}// ------------- TEST --------------------let
    tom = new Cat("Tom", 3, 20);console.log("Call move() method");tom.move();console.log("\n");console.log("Call
    showInfo() method");tom.showInfo();

    ```


    ### Output


    ```

    Call move() method

    Moving..

    Call showInfo() method

    My name is Tom

    ```


    What''s happened when you create an object from constructor . How does it call
    up a constructor of the parent class? Please see the illustration below:


    ![](OEBPS/image_rsrc8TF.jpg)


    With the above illustration you see that, constructor of parent class is called
    in constructor of subclass, constructor of parent class is called in constructor
    of subclass, constructor of parent class is called in constructor of subclass,
    constructor of parent class is called in constructor of subclass, constructor
    of parent class is called in constructor of subclass.


    ## 2 Override method


    By default, child classes inherit methods from the parent class, but parent classes
    can override the method of the parent class.


    inheritance-example2.js


    ```javascript

    class Animal {constructor(name) {this.name = name;}showInfo()  {console.log("I''m
    " + this.name);}move()  {console.log("Moving..");}}class Mouse extends Animal
    {constructor(name, age, height) {super(name);this.age = age;this.height = height;}//
    Override method of parent class.showInfo()  {console.log("Age: " + this.age);console.log("Height:
    " + this.height);}// Override method of parent class.move()  {console.log("Mouse..");}}//
    ------------- TEST --------------------let jerry = new Mouse("Jerry", 3, 5);console.log("Call
    move() method");jerry.move();console.log("\n");console.log("Call showInfo() method");jerry.showInfo();

    ```


    ### Output


    ```

    Call move() method

    Mouse..

    Call showInfo() method

    Age: 3

    Height: 5

    ```


    ## 3 Abstract Method


    The concept of an abstract method or abstract class is defined in languages such
    as Java, C#. But it is not clearly defined in ECMAScript. However, we have a way
    to define it.


    A class called as abstract defines abstract methods and child class must override
    these methods if you want to use them. The abstract methods always throw the exception
    "Not Implemented Error".


    abstract-example.js


    ```javascript

    // An abstract class.

    class AbstractDocument {constructor(name) {this.name = name}// A method can not
    be used, because it always throws an error.show() {// Not Implemented Errorthrow
    "Subclass must implement abstract method";}}class PDF extends AbstractDocument
    {/* Override method of parent classshow() {console.log("Show PDF document:", this.name);}}class
    Word extends AbstractDocument {show() {console.log("Show Word document:", this.name)}}//
    -------------------- TEST -------------------------let doc1 = new PDF("Python
    tutorial");let doc2 = new Word("Java IO Tutorial");let doc3 = new PDF("ECMAScript
    Date & Time Tutorial");let documents = [doc1, doc2, doc3];for (let i = 0; i <
    documents.length; i++) {documents[i].show();}let doc4 = new AbstractDocument("An
    Abstract Document");doc4.show(); // Throw Error!!!

    ```


    ## 4 Operators - instanceof, typeof


    The `instanceof` operator helps you to check whether "something" is an object
    of a certain class or not.


