    1px solid black;}#dragtarget-div {background: #eee;padding: 5px;}</style></head><body><h3>DragEvent
    example</h3><p id="log-div">..</p><!-- Drop Target 1 --><div class="droptarget-div"ondragenter=
    "ondragenterHandler(event)"ondragover="dragoverHandler(event)"ondrop="dropHandler(event)"><p
    id="dragtarget-div"ondragstart="dragstartHandler(event)"ondrag="dragHandler(event)"draggable="true">Drag
    me!</p></div><!-- Drop Target 2 --><div class="droptarget-div"ondragenter= "ondragenterHandler(event)"ondragover="dragoverHandler(event)"ondrop="dropHandler(event)"></div></body></html>
    |


