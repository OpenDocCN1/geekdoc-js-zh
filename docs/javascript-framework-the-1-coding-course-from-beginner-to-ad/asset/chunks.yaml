    \n`object-example1.js`\n\n```javascript\nvar tom = {name: \"Tom\", country: \"\
    USA\" };\n// 访问：\nconsole.log(tom.name); // Tom\nconsole.log(tom.country); //\
    \ USA\nconsole.log(tom[\"name\"]); // Tom\nconsole.log(tom[\"country\"]); // USA\n\
    ```\n\n你可以向现有对象添加新的“键/值”对，或删除它的“键/值”对。\n\n`object-example2.js`\n\n```javascript\n\
    var tom = {name: \"Tom\", country: \"USA\" };\n// 删除属性 - country\ndelete tom[\"\
    country\"]; // 等于: delete tom.country;\n// 添加属性 - gender\ntom[\"gender\"] = \"\
    Male\"; // 等于: tom.gender = \"Male\";\n// 访问：\nconsole.log(tom.name); // Tom\n\
    console.log(tom[\"name\"]); // Tom\nconsole.log(tom[\"country\"]); // undefined\n\
    console.log(tom.country); // undefined\nconsole.log(tom[\"gender\"]); // Male\n\
    ```\n\n首先，看 ES6 引入的现代语法，创建一个带有返回面积的 `getArea()` 方法的 `Rectangle` 类。\n\n![](img/image_rsrc8T7.jpg)\n\
    \n`es6-example.js`\n\n```javascript\n// ECMAScript 6\nclass Rectangle {\n  constructor(width,\
    \ height) {\n    this.width = width;\n    this.height = height;\n  }\n  getArea()\
    \ {\n    return this.width * this.height;\n  }\n}\n// ------------- 测试\nvar rect\
    \ = new Rectangle(10, 5);\nvar area = rect.getArea();\nconsole.log(\"Width: \"\
    \ + rect.width);\nconsole.log(\"Height: \" + rect.height);\nconsole.log(\"Area:\
    \ \" + area);\n```\n\n通过 ES6 创建一个类的子类非常简单：\n\n`es6-inheritance.js`\n\n```javascript\n\
    class Shape {\n  constructor(x, y) {\n    this.x = x;\n    this.y = y;\n  }\n\
    }\n// 子类\nclass Circle extends Shape {\n  constructor(x, y, radius) {\n    super(x,\
    \ y);\n    this.radius = radius;\n  }\n  getArea() {\n    return Math.PI * this.radius\
    \ * this.radius;\n  }\n}\n// 测试\nvar circle = new Circle(0, 0, 5);\nconsole.log(\"\
    x: \" + circle.x);\nconsole.log(\"y: \" + circle.y);\nconsole.log(\"Area: \" +\
    \ circle.getArea());\n```\n\n## 2. ES3 中的类与继承\n\nES3 使用 `function` 关键字来定义“构造函数”。当你使用\
    \ `new` 运算符调用此函数时，会创建一个新的对象：\n\n```javascript\n// ECMAScript 3\nfunction Rectangle(width,\
    \ height) {\n  this.width = width;\n  this.height = height;\n}\n// 创建对象\nvar rect\
    \ = new Rectangle(10, 5);\n```\n\n下面的图说明了 JavaScript 机器的操作：\n\n![](img/image_rsrcT8.jpg)\n\
    \n* `rect` 对象被创建（它只是一个普通对象）\n* 为 `rect` 对象添加 `__proto__` 属性。这是一个隐藏属性。\n* 该变量将指向\
    \ `rect` 对象的地址。\n* 为“rect”对象添加 `width` 属性。\n* 为 `rect` 对象添加 `height` 属性。\n\n原型概念也引入了\
    \ ES3。让我们它的用途：\n\n```javascript\n// ECMAScript 3\nfunction Rectangle(width, height)\
    \ {\n  this.width = width;\n  this.height = height;\n}\nRectangle.prototype.bgColor\
    \ = \"red\";\nRectangle.prototype.borderColor = \"blue\";\n// 创建一个对象\nvar rect\
    \ = new Rectangle(10, 5);\nconsole.log(rect); // Rectangle { width: 10, height:\
    \ 5 }\nconsole.log(rect.__proto__); // Rectangle { bgColor: 'red',borderColor:\
    \ 'blue' }\nconsole.log(rect.__proto__.bgColor); // red\nconsole.log(rect.__proto__.borderColor);\
    \ // blue\n// （阅读解释）\nconsole.log(rect.bgColor); // red\nconsole.log(rect.borderColor);\
    \ // blue\n```\n\n![](img/image_rsrcT9.jpg)\n\n当 JavaScript 运行时遇到 `myObject.myProperty`\
    \ 表达式时发生了什么？\n\n答案是它会检查 `myObject` 对象是否存在 `myProperty` 属性。如果有，它就访问该属性；反之，它访问 `myObject.__proto__.myProperty`。\n\
    \n`es3-proto-example3.js`\n\n```javascript\nvar rect = {\n  __proto__: { bgColor:\
    \ \"red\", borderColor: \"blue\" },\n  width: 10,\n  height: 5\n};\nconsole.log(rect.width);\
    \ // 10\nconsole.log(rect.__proto__.bgColor); // red\nconsole.log(rect.bgColor);\
    \ // red\n```\n\n"
