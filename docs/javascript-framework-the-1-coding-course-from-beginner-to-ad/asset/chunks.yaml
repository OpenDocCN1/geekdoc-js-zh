    \  <div style=\"font-size:12px; padding:5px; border:1px solid #ccc;\" onwheel=\"\
    wheelHandler(event)\">大家好！<div></div></div>\n</body>\n</html>\n```\n\n`wheelevents-example.js`\n\
    \n```javascript\nfunction wheelHandler(evt) {\n  var fontSize = evt.target.style.fontSize;\n\
    \  // 12px, 13px,...\n  var value = Number(fontSize.substr(0, fontSize.length-2));\
    \ // 12, 13,..\n  // 向上滚动\n  if (evt.deltaY < 0) {\n    if (value < 50) {\n  \
    \    value++;\n    }\n  }\n  // 向下滚动\n  if (evt.deltaY > 0) {\n    if (value >\
    \ 5) {\n      value--;\n    }\n  }\n  evt.target.style.fontSize = value + \"px\"\
    ;\n}\n```\n\n!![](img/image_rsrc8UG.jpg)\n\n# 第 26 章：Javascript KeyboardEvent\n\
