  trans: "\n确认对话框（Confirmation Dialog Box）用于请求用户确认某些操作。此对话框非常简单，你无法自定义对话框的图标或标题，只能提供一条请求用户确认的消息。该对话框有两个按钮：确定（OK）和取消（Cancel）。\n\
    \n| ![](img/image_rsrc8PE.jpg) |\n\n要显示确认对话框，你调用 `confirm(message)` 函数，其中 `message`\
    \ 是一个请求用户确认的消息。如果用户点击“确定”按钮，该函数返回 `true`；否则，如果用户点击“取消”按钮，该函数返回 `false`。\n\n| ![](img/image_rsrc8PF.jpg)\
    \ |\n\n| ![](img/image_rsrc8PE.jpg) |\n\n| ![](img/image_rsrc8PG.jpg) |\n\n`confirm-example.js`\n\
    \n```html\n<!DOCTYPE html><html><head><title>Confirmation Dialog Box</title><script\
    \ type=\"text/javascript\">function testConfirmDialog()  {var result = confirm(\"\
    Do you wantto continue?\");if(result)  {alert(\"OK Next lesson!\");} else {alert(\"\
    Bye!\");}}</script></head><body><h2>Confirmation Dialog Box</h2><button onclick=\"\
    testConfirmDialog()\">Click me!</button></body></html>\n```\n\n| ![](img/image_rsrc8PH.jpg)\
    \ |\n\n# 4. 提示对话框 (Prompt Dialog Box)\n\n提示对话框用于用户输入信息。此对话框非常简单，包含一个供用户输入信息的文本字段（Text\
    \ Field）。对话框有两个按钮：确定（OK）和取消（Cancel）。\n\n要显示提示对话框，你调用 `prompt(message, defaultValue)`\
    \ 函数，其中 `message` 是给用户的提示。`defaultValue` 是预填充在文本字段中的默认值。\n\n如果用户点击“确定”，函数返回文本字段的内容；否则，如果用户点击“取消”，函数返回\
    \ `null`。\n\n`prompt-example.js`\n\n```html\n<!DOCTYPE html><html><head><title>Prompt\
    \ Dialog Box</title><script type=\"text/javascript\">function testPromptDialog()\
    \  {var result = prompt(\"Enter youage:\", \"20\");if(result != null)  {alert(\"\
    Your age is \" + result);}}</script></head><body><h2>Prompt Dialog Box</h2><button\
    \ onclick=\"testPromptDialog()\">Click me!</button></body></html>\n```\n\n| ![](img/image_rsrc8PJ.jpg)\
    \ |\n\n# JavaScript 变量\n\n## 什么是变量\n\n变量意味着程序用于存储数值的“内存位置”。变量名被称为标识符（identifier）。\n\
    \n变量名的命名必须遵循某些原则。以下是为变量命名的命名原则：\n\n- 变量名不能与关键字相同\n- 变量名可以包含字母或数字，但不能以数字开头\n- 变量名不能包含空格或特殊字符，下划线（`_`）和美元符号（`$）除外\n\
    \n## 声明变量\n\n声明变量是必要的，因为你在使用它之前必须进行声明。\n\n```javascript\n// Declare variables:\n\
    var a1;\nconsole.log(a1); // undefined\nvar a2 = 100;\nconsole.log(a2); // 100\n\
    var a3, a4;\nvar a5, a6 = 200;\nconsole.log(a5); // undefined\nconsole.log(a6);\
    \ // 200\nvar a7= 100, a8 = 300;\nlet b1;\nconsole.log(b1); // undefined\nlet\
    \ b2 = \"Hello\";\nconsole.log(b2); // Hello\nconst c = 100;\nconsole.log(c);\
    \ // 100\n```\n\n## 块 (block)\n\n块意味着位于“大括号” `{}` 中的一组命令。\n\n## let\n\n`let` 关键字用于声明块级作用域变量，这意味着该变量将在程序在该块或内部子块中被实现，但在定义它的块的外部不会被程序实现。\n\
    \n```javascript\nif(true) {\n  let a = 200;\n  console.log(a); // 200\n}\n// Program\
    \ will ignore this statement:\nconsole.log(a);\n```\n\n如果你使用 `let` 关键字定义了两个同名的变量，其中一个变量在父块中声明，另一个在子块中声明，程序会将它们视为两个不同的变量。\n\
    \n```javascript\nlet i = 1000;\nlet j = 2000;\nif(true) {\n  i = 100; // Assign\
    \ new value to 'i'\n  let j = 200; // A new variable (***)\n  console.log(\"Test1:\
    \ \" + i + \" : \" + j); //Test1: 100 : 200\n}\nconsole.log(\"Test2: \"+ i + \"\
    \ : \" + j); //Test2: 100 : 2000\n```\n\n## var\n\n`var` 关键字用于声明变量，它的作用域比 `let`\
    \ 变量更广。它在定义它的块内部、子块中被实现，甚至在声明它的块外部也可以被实现。\n\n```javascript\nif(true) {\n  var\
    \ a = 200;\n  console.log(a); // 200\n}\nconsole.log(a); // 200\n```\n\n如果你使用\
    \ `var` 关键字声明了两个同名的变量，其中一个在父块中声明，另一个在子块中声明，程序认为这两个变量是同一个（内存中的相同位置）。\n\n```javascript\n\
    var i = 1000;\nvar j = 2000;\nif(true) {\n  i = 100; // Assign new value\n  var\
    \ j = 200; // Assign new value\n  console.log(\"Test1: \" + i + \" : \" + j);\
    \ //Test1: 100 : 200\n}\nconsole.log(\"Test2: \"+ i + \" : \" + j); //Test2: 100\
    \ : 200\n```\n\n在函数用 `var` 声明的变量只会被程序在该函数内部识别。它在函数外部无法被识别。\n\n```javascript\n\
    // A function\nvar test = function() {\n  var a = 200;\n  console.log(a); // 200\n\
    };\n// Call function.\ntest();\nconsole.log(a); // Not work!!\n```\n\n## const\n\
    \n`const` 关键字用于声明常量。在声明常量时，你必须给它赋值。但你不能给这个变量赋值新值。注意：与 `let` 变量一样，`const` 变量具有块级作用域。\n\
    \n```javascript\n// Declare a constant with a value\nconst greeting = \"Hello\"\
    ;\n// Assign new value to 'greeting'\ngreeting = \"Hi\"; // ==> Error!!\n// Declare\
    \ a constant without a value\nconst i ; // ==> Error!!\n```\n\n用 `const` 关键字声明的变量在意义上是常量，因为你不能给它赋新值，但它并不是变的，你仍然可以改变它的属性。\n\
    \n# 第 2 章：位运算\n\n## 1. 位运算\n\n### 2. 数字的位运算\n### 3. 位运算的用途\n\n## 1. 位运算\n\n在数字计算机编程中，位运算作用于一个或多个二进制数，或类似于二进制数的字符串。\n\
    \n这是一种简单且快速的操作，由处理器直接支持。通常，位运算比乘法、除法快得多，有时显著快于加法。位运算消耗的能量较少，因为它很少消耗资源。\n\n有 7\
    \ 种位运算：\n\n| 运算符 | 名称 | 描述 |\n| :--- | :--- | :--- |\n| & | 与 (AND) | 如果两个位都为\
    \ 1，则返回值为 1，否则返回 0。 |\n| \\| | 或 (OR) | 如果两个位中有一个为 1，则返回值为 1，否则返回 0。 |\n| ^ |\
    \ 异或 (XOR) | 如果两个位不同，则返回值为 1，否则返回 0。 |\n| ~ | 非 (NOT) | 反转所有位，0 变为 1，1 变为 0。 |\n\
    | << | 零填充左移 | 将所有位向左移动。 |\n| >> | 有符号右移 | 除第一位外，将所有位向右移动。 |\n| >>> | 零填充右移 |\
    \ 将所有位向右移动。 |\n\n### 位与 (Bitwise AND)\n当对一对位执行位与运算时，如果两个位都为 1，则返回 1，否则返回 0。\n\n\
    ### 位或 (Bitwise OR)\n当对一对位执行位或运算时，如果位中有一个为 1，则返回 1，否则返回 0。\n\n### 位异或 (Bitwise\
    \ XOR)\n当对一对位执行位异或运算时，如果位不同，则返回 1，否则返回 0。\n\n### 位非 (Bitwise NOT)\n当使用位非运算时，它将反转所有位，1\
    \ 变为 0，0 变为 1。\n\n## 2. 数字的位运算\n\n不同的语言可以使用多种数据类型来表示数字。\n\n- Java: byte, short,\
    \ int, long, double。\n- C#:byte, sbyte, short, ushort, int, uint, long, ulong,\
    \ float, double\n- Javascript: double\n- …..\n\nJavascript 将数字存储为 64 位浮点数。但位运算是在\
    \ 32 位整数上进行的。Java、C#等语言的位运算也是在 32 位整数上进行的。\n\n因此，在对数字执行位运算之前，你必须将每个数字转换为 32 位二进制序列。\n\
    \n注意：32 位中，第一位用于确定数字的符号。如果该位为 1，它对应 ( - ) 符号。如果该位为 0，它对应 ( + ) 符号。\n\n| ![](img/image_rsrc8PK.jpg)\
    \ |\n\n### 位左移 (<<)\n\n位左移运算符 ( << ) 可能会改变数字的符号。\n\n| ![](img/image_rsrc8PM.jpg)\
    \ |\n\n"
- fmt: "\n# Bitwise Right Shift (>>) [Unsigned Right Shift]\n\nThe Bitwise Right Shift\
    \ (`>>`) operator doesn't change the sign of number because the first bit is not\
    \ moved.\n\n| ![](OEBPS/image_rsrc8PN.jpg) |\n\n## Bitwise Right Shift (>>>) [Zero\
    \ fill right Shift]\n\nThe Bitwise Right Shift (`>>>`) operator can change the\
    \ number sign.\n\n| ![](OEBPS/image_rsrc8PP.jpg) |\n\n# 3 What is Bitwise used\
    \ for\n\nThe bitwise calculations are directly supported by the computer processor,\
    \ it performs very fast. Below, I list some examples of using these calculations.\n\
    \nUse the bitwise operations on Strings (characters) in the `Java`, `C#`, `C/C++`\
