    \ event was triggered |\n| buttons | Returns a number that describes which mouse\
    \ buttons were pressed when the mouse event was triggered |\n\n### event.button:\n\
    \n- 0: Main button, usually the left button or the un-initialized state\n- 1:\
    \ Auxiliary button, usually the wheel button or the middle button (if present)\n\
    - 2: Secondary button, usually the right button\n- 3: Fourth button, typically\
    \ the Browser Back button\n- 4: Fifth button, typically the Browser Forward button\n\
    \n### event.buttons:\n\n- 0 : No button or un-initialized\n- 1 : Primary button,\
    \ usually the left button.\n- 2 : Secondary button, usually the right button.\n\
    - 4 : Auxilary button, usually the mouse wheel button or middle button.\n- 8 :\
    \ 4th button, typically the \"Browser Back\" button.\n- 16 : 5th button, typically\
    \ the \"Browser Forward\" button.\n\n`event.buttons` may return a different value\
    \ other than the above values. For example, `event.buttons` returns `3` if you\
    \ press both the left mouse and right mouse at the same time.\n\n`prop-button-buttons-example.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>MouseEvent Example</title>\n\
    \  <script>\n    function mousedownHandler(evt) {\n      var logDiv = document.getElementById(\"\
    log-div\");\n      logDiv.innerHTML = \"event.button= \" + evt.button + \"<br/>\"\
    \ + \"event.buttons= \" + evt.buttons;\n    }\n  </script>\n</head>\n<body>\n\
    \  <h3>event.button, event.buttons</h3>\n  <button onmousedown=\"mousedownHandler(event)\"\
    >Click Me!</button>\n  <br/><br/>\n  <div id=\"log-div\" style=\"color:red;\"\
    ></div>\n</body>\n</html>\n```\n\n!![](OEBPS/image_rsrc8UC.jpg)\n\n# Chapter 25\
    \ : Javascript WheelEvent\n\n## 1 WheelEvent\n\n`WheelEvent` is an interface representing\
    \ for the events occurring when an user moves mouse wheel or similar equipment.\
    \ \n\n`WheelEvent` means sub-interface of `MouseEvent`. It will inherit all properties\
    \ and methods of parent interface.\n\n!![](OEBPS/image_rsrc8UD.jpg)\n\n| Event\
    \ | Description |\n| :--- | :--- |\n| wheel | The event occurs when the mouse\
    \ wheel rolls up or down over an element |\n\n### The properties of WheelEvent:\n\
    \n| Property | Description |\n| :--- | :--- |\n| deltaX | Returns the horizontal\
    \ scroll amount of a mouse wheel (x-axis) |\n| deltaY | Returns the vertical scroll\
    \ amount of a mouse wheel (y-axis) |\n| deltaZ | Returns the scroll amount of\
    \ a mouse wheel for the z-axis |\n| deltaMode | Returns a number that represents\
    \ the unit of measurements for delta values (DOM_DELTA_PIXEL, DOM_DELTA_PIXEL,\
    \ DOM_DELTA_PAGE) |\n\n### Example with WheelEvent:\n\n!![](OEBPS/image_rsrc8UE.jpg)\n\
    !![](OEBPS/image_rsrc8UF.jpg)\n\n`wheelevents-example.html`\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>WheelEvent Example</title>\n  <script src=\"\
    wheelevents-example.js\"></script>\n</head>\n<body>\n  <h3>WheelEvent example</h3>\n\
    \  <div style=\"font-size:12px; padding:5px; border:1px solid #ccc;\" onwheel=\"\
    wheelHandler(event)\">Hello Everyone!<div></div>\n</body>\n</html>\n```\n\n`wheelevents-example.js`\n\
    \n```javascript\nfunction wheelHandler(evt) {\n  var fontSize = evt.target.style.fontSize;\n\
    \  // 12px, 13px,...\n  var value = Number(fontSize.substr(0, fontSize.length-2));\
    \ // 12, 13,..\n  // Scrolling up\n  if (evt.deltaY < 0) {\n    if (value < 50)\
    \ {\n      value++;\n    }\n  }\n  // Scrolling down\n  if (evt.deltaY > 0) {\n\
    \    if (value > 5) {\n      value--;\n    }\n  }\n  evt.target.style.fontSize\
    \ = value + \"px\";\n}\n```\n\n!![](OEBPS/image_rsrc8UG.jpg)\n\n# Chapter 26 :\
    \ Javascript KeyboardEvent\n\n## 1 KeyboardEvent\n## 2 Properties & Methods\n\
    ## 3 Table: Key, KeyCode\n\n### 1 KeyboardEvent\n\n`KeyboardEvent` is an interface\
    \ that represents events occurring when users interact with a keyboard, including\
    \ `keydown`, `keypress`, `keyup` events. \n\n`KeyboardEvent` is subinterface of\
    \ `UIEvent`.\n\n!![](OEBPS/image_rsrc8UH.jpg)\n\n| Order | Event |\n| :--- | :---\
    \ |\n| 1 | onkeydown |\n| 2 | onkeypress |\n| 3 | onkeyup |\n\n### keydown\n\n\
    The `keydown` event occurs when you press down a key. In Windows OS, If you continue\
    \ to keep the key pressed, it will constantly emit `keydown` & `keypress` events.\
    \ But in MacOS, If you continue to keep the key pressed, it will constantly emit\
    \ `keydown` events. Like the following illustration.\n\n!![](OEBPS/image_rsrc8UJ.jpg)\n\
    \n### keypress\n\nThere are 2 cases of occurence of the `keypress`, in which case\
    \ 1 is explained above by me (View the `keydown` event). Case 2 is that you press\
    \ down a key and quickly release it, and at this time there will be 2 events such\
    \ as `keypress`, `keyup` emitted in the order.\n\n!![](OEBPS/image_rsrc8UK.jpg)\n\
    \n### keyup\n\nThe `keyup` event occurs when you release a key.\n\nNote: The `keypress`\
    \ event will not be emitted for the keys such as `ALT`, `SHIFT`, `CTRL`, `META-KEY`,\
    \ `ESC`. If you want to detect whether those keys are being pressed, you can use\
    \ the properties such as `altKey`, `shiftKey`, `ctrlKey`, `metaKey` of the `event`\
    \ object.\n\n`keyevents-example.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>KeyEvent Example</title>\n  <script src=\"keyevents-example.js\"></script>\n\
    </head>\n<body>\n  <h3>KeyEvent example</h3>\n  <input type=\"text\" onkeydown=\"\
    keydown(event)\" onkeyup=\"keyup(event)\" onkeypress=\"keypress(event)\"/>\n \
    \ <br/><br/>\n  <textarea rows=\"10\" disabled></textarea>\n  <br/><\n  <button\
    \ onclick=\"clearLog()\">Clear</button>\n</body>\n</html>\n```\n\n`keyevents-example.js`\n\
    \n```javascript\nfunction keydownHandler(evt) { appendLog(\"Keydown!\"); }\nfunction\
    \ keyupHandler(evt) { appendLog(\"Keyup!\"); }\nfunction keypressHandler(evt)\
    \ { appendLog(\"Keypress!\"); }\nfunction appendLog(text) {\n  var oldText = document.getElementById(\"\
    log-div\").value;\n  document.getElementById(\"log-div\").value = oldText + \"\
    \\n\" + text;\n}\nfunction clearLog() { document.getElementById(\"log-div\").value\
    \ = \"\"; }\n```\n\n!![](OEBPS/image_rsrc8UM.jpg)\n\n### 2 Properties & Methods\n\
    \n`KeyEvent` is the sub-interface of `UIEvent`, therefore, it inherits the properties\
    \ and methods from this interface.\n\n| Property | Description |\n| :--- | :---\
    \ |\n| altKey | Returns true if the `ALT` key is being pressed when a key event\
    \ occurs |\n| ctrlKey | Returns true if the `CTRL` key is being pressed when a\
    \ key event occurs |\n| shiftKey | Returns true if the `SHIFT` key is being pressed\
    \ when a key event occurs |\n| metaKey | Returns true if the `META` key is being\
    \ pressed when a key event occurs |\n\nExample: Press the `SHIFT` key and keep\
    \ it unchanged and then press any key.\n\n!![](OEBPS/image_rsrc8UN.jpg)\n\n`prop-shiftKey-example.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>KeyEvent Example</title>\n\
    \  <script src=\"prop-shiftKey-example.js\"></script>\n</head>\n<body>\n  <h3>Hold\
    \ key 'SHIFT' and press any key!</h3>\n  <input type=\"text\" onkeydown=\"keydownHandler(event)\"\
    />\n  <br/><br/>\n  <div id=\"log-div\" style=\"color:red;\"></div>\n</body>\n\
    </html>\n```\n\n`prop-shiftKey-example.js`\n\n```javascript\nfunction keydownHandler(evt)\
    \ {\n  if (evt.shiftKey) {\n    document.getElementById(\"log-div\").innerHTML\
    \ = \"evt.shiftKey = true;\";\n  } else {\n    document.getElementById(\"log-div\"\
    ).innerHTML = \"evt.shiftKey = false\";\n  }\n}\n```\n\n# Chapter 27 : Javascript\
