    As you know, Web browsers and Server communicate each other through HTTP protocol.
    When you use access to a website from the browser, your request will be sent to
    the server and the server returns the content to the browser for displaying.


    | ![](OEBPS/image_rsrc8SR.jpg) |


    Cookie is a technique that helps a website store some information on your computer.
    It will save the information and traces you have ever accessed to that website.


    | ![](OEBPS/image_rsrc8SS.jpg) |


    For simplicity, see the following situation:


    | ![](OEBPS/image_rsrc8ST.jpg) |


    You access to a website that you have not ever visited. Suppose this website supports
    2 languages: English, French. Because you have never visited this website before,
    the default English interface will be displayed. You reset other language such
    as French to display. The server responds to your request, and it also sends the
    browser a Cookie containing your preferred language - French.


    You turn off the computer and visit this website the next day. When the request
    is sent to the server, the Cookies saved on your computer will be sent with the
    request, which will help the server determine your preferred language and return
    the content in such language.


    ## What is Web Cookie


    - Cookie means a small piece of text, generated by the Web Server sent to your
    browser. The Cookie can be stored on memory or as files on a user''s computer.
    Cookies may also be generated by Javascript running on your browser.

    - Cookies stored on the client side will be included with the request every time
    when a user accesses any page of that website.


    The main information of Cookie is a pair of Name/Value; for example:


    ```

    SessionID = AAA22311languagePreference = FRheaderColor = BLUE

    ```


    | ![](OEBPS/image_rsrc8SU.jpg) |


    Cookie used in e-commerce websites. Users buy goods on this website. The commodities
    bought by users are stored on a `Cart`. In the first access, the buyer (Browser)
    will receive a unique `SessionId` (not coinciding with other users).


    Each `SesionId` is attached to a cart managed on Web Server. The `SessionId/Value`
    information piece is a Cookie stored on the user''s computer. Each time a user
    creates a new request, this Cookie is always attached to the request, which helps
    the Web Server distinguish different users.


    ## What does a Cookie include


    A Cookie means a simple data record transmitted from the browser to the Web Server
    and vice versa, it has the structure as follows:


    ```

    SSID=Ap4P…GTEq; Domain=amazon.com; Path=/; Expires=Wed, 13 Jan 2023 22:23:01 GMT;
    Secure;HSID=AYQEVn…DKrdst; Domain=.amazon.com; Path=/; Expires=Wed, 13 Jan 2023
    22:23:01 GMT; HttpOnlyHSID=AYQEVn…DKrdst; Domain=amazon.com; Path=/; Max-Age=300;
    HttpOnly

    ```


    | Attribute | Meaning |

    | :--- | :--- |

    | `Name=Value` | Name of Cookie and its value |

    | `Domain` | Domain Name of website. |

    | `Expires` | Specify date and time when this Cookie expires. If Cookie cannot
    set `Expires` & `Max-Age`, it will expire immediately after the user exits the
    browser. |

    | `Max-Age` | The time is calculated in seconds when this Cookie will exist since
    it is created. If Cookie has both `Expires` & `Max-Age` information then `Max-Age`
    will be given priority. |

    | `Path` | This is the path to a directory or a page that set this Cookie. It
    can be blank if you want to access this Cookie at every directory or every page.
    |

    | `Secure` | If this attribute is available, i.e. only secured servers can access
    this Cookie |

    | `HttpOnly` | If this attribute is available, i.e. this Cookie can be only manipulated
    at the Server side, but it is impossible to manipulate with this Cookie by Javascript
    on the browser. |


    ## 2 Where is Cookie stored


    Cookies can be stored on memory or on files. In this section, I mention only Cookies
    stored in files on the user''s computer.


    ### IE (Internet Explorer)


    With the `IE` browser, Cookies of the samewebsite are stored in the same file.
    and you can find them in the directory like below:


    ```

    C:\Users\{CurrentUser}\AppData\Roaming\Microsoft\Windows\Cookies

    ```


    ## 3 See Cookie on browser


    Seeing the Cookie on the browser is very simple, for example, with the Chrome
    browser:


    | ![](OEBPS/image_rsrc8SV.jpg) |


    ## 4 ECMAScript Cookie


    Basically, there are 2 ways for you to work with Cookies:


    - Manipulate Cookies at the Server.

    - Manipulate Cookies by Javascript running on user''s browser


    In the user''s browser, using Javascript(`ECMAScript`), you can manipulate with
    the Cookies without `HttpOnly` attribute.


    Below is an example handling Cookie using the Javascript.


    ### cookie-example.html


    ```html

    <!DOCTYPE html><<html><head><meta charset="UTF-8"><title>Cookie example</title><script
    type="text/javascript" src="cookie-example.js"></script></head><body onload="readCookie()">Your
    Name: <input type="text" name="fullName" id="fullName" /><br/>Fovorite Color:<select
    name="favoriteColor" id="favoriteColor"><option value="red">Red</option><option
    value="blue">Blue</option><option value="green">Green</option></select><br><button
    onclick="writeCookies()">Write Cookies</button><button onclick="killCookies()">Kill
    Cookies</button><br/><br/><<!--  Read Cookie Results: --><hr />Read Cookie Results:<div
    id="logArea" style="border:1px solid #ccc;padding: 5px;height:150px;"></div><button  value
    = "Get Cookie" onclick = "readCookie()">Read cookies</button></</body></html>

    ```


    ### cookie-example.js


    ```javascript

    // maxAge: Seconds

    function writeCookies(maxAge) {

    let expires = new Date();

    expires.setSeconds(expires.getSeconds() + maxAge);

    let selectedColor = document.getElementById("favoriteColor").value;

    let cookie1 = "favoriteColor=" + selectedColor + ";";

    cookie1 += "Expires=" + expires.toUTCString() + ";";

    cookie1 += "Path=/"; // Path: Required in Chrome!!

    // Write Cookie 1

    document.cookie = cookie1;

    let fullName = document.getElementById("fullName").value;

    let cookie2 = "fullName=" + fullName + ";";

    cookie2 += "Max-Age=" + maxAge + ";"; // Secondsc

    cookie2 += "Path=/"; // Path: Required in Chrome!!

    // Write Cookie 2

    document.cookie = cookie2;

    alert("Write Successful!");

    }

    function killCookies() {

    writeCookies(0);

    }

    function readCookie() {

    var allCookies = document.cookie;

    let logText = "All Cookies : " + allCookies + "<br/>";

    // Get all the cookies pairs in an array

    let cookieArray = allCookies.split('';'');

    // Now take key value pair out of this array

    for (var i = 0; i < cookieArray.length; i++) {

    let kvArray = cookieArray[i].split(''='');

    logText += "Cookie name: " + kvArray[0] + "<br/>";

    logText += "Cookie value: " + kvArray[1] + "<br/>";

    }

    document.getElementById("logArea").innerHTML = logText;

    }

    ```


    You can test this example by running `cookie-example.html` directly on Firefox.
    With Chrome browser, you have to run this file on a HTTP Server.


    ```

    http://localhost:8080/cookies/cookie-example.html

    ```


    | ![](OEBPS/image_rsrc8SW.jpg) |


    Enter a name and select your favorite color on the Form, then press the "Write
    Cookies" button. Cookies will be generated and saved into the user''s computer.


    | ![](OEBPS/image_rsrc8SX.jpg) |


    | ![](OEBPS/image_rsrc8SY.jpg) |


    | ![](OEBPS/image_rsrc8SZ.jpg) |


    ## Chapter 14 : JavaScript void Keyword


    ### 1 Void Keyword


    `void` is an important keyword in ECMAScript. It has the following characteristics:


    - `void` acts as an operator, standing before a single operand with any type.

    - `void` is used to evaluate an expression. It will not return any value, or in
    other words it returns undefined value.


    The `void` operator precedes any expression to get an undefined value.


    ### void-expression-example.js


    ```javascript

    void console.log("Test1");  // Test1

    console.log( void ("Test2") ); // undefined

    console.log( void (2 == "2") );  // undefined

    console.log( void (2) == "2" ); // false

    console.log( void (2) == undefined); // true

    ```


    ### 2 Void and JavaScript URIs


    `<a href ="javascript:URI">.."a>` is common in HTML. Browsers will evaluate the
    URI and take the value returned by the URI to replace the content on the current
    page.


    | ![](OEBPS/image_rsrc8T0.jpg) |


    | ![](OEBPS/image_rsrc8T1.jpg) |


    | ![](OEBPS/image_rsrc8T2.jpg) |

