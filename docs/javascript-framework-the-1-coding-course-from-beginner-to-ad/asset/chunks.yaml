  trans: "\n程序运行过程中可能会发生错误。这可能是一个意外之外的错误。使用 `try-catch` 可以帮助你在错误发生时捕获并处理它们。\n\n回到上面的示例，我们添加\
    \ `try-catch` 来捕获并处理错误。\n\n`hello-catch-example.js`\n\n```javascript\nconsole.log(\"\
    Three\");\nlet myObj = {};\nconsole.log(\"Two\");\nconsole.log(\"One\");\ntry\
    \ {\n  // 对象 myObj 没有 showMe() 方法。\n  // 但我们调用了 showMe()。\n  // 这里发生了错误。\n  myObj.showMe();\
    \ // ==> Error!\n  // 这段代码将被忽略\n  console.log (\"!!!\");\n} catch (e) {\n  console.log(\"\
    Catched error: \" + e);\n  console.log(\"OK continue...\");\n}\nconsole.log(\"\
    Let's go!\");\n```\n\n运行该示例的结果如下：\n\nOutput\nThreeTwoOneCatched error: TypeError:\
    \ myObj.showMe is not a functionOK continue...Let's go!\n\n下面的插图解释了程序的流程：\n\n\
    ![](img/image_rsrc8RS.jpg)\n\n*   步骤 (1)-(4) 是完全正常的。\n*   在步骤 (5) 发生异常，此时你尝试调用一个对象的方法，而该对象并没有该方法。\n\
    *   程序立即跳转并执行 `catch` 块中的命令。步骤 (6) 被忽略了。\n*   步骤 (7)、(8) 将执行。\n*   步骤 (9) 将执行。\n\
    \n### 3. try-catch-finally\n\n我们已经习惯了通过 `try-catch` 块来捕获错误。`try-catch-finally`\
    \ 用于完整处理错误。无论 `try` 块中是否发生错误，`finally` 块始终会被执行。\n\n```javascript\ntry {\n  //\
    \ 在此处做一些操作\n} catch (e ) {\n  // 在此处做一些操作\n} finally  {\n  // finally 块始终会被执行\n\
    \  // 在此处做一些操作\n}\n```\n\n示例：\n\n`try-catch-finally-example.js`\n\n```javascript\n\
    function getGreeting(language) {\n  try {\n    console.log(\"Code in try block\
    \ (*)\");\n    // 调用对象 'language' 的 greeting() 方法\n    // 如果此对象没有 greeting() 方法，此处可能会抛出异常。\n\
    \    let v = language.greeting();\n    console.log(\"Code in try block (**)\"\
    );\n    return v;\n  } catch (e) {\n    console.log(\"Code in catch block. Something\
    \ Error: \" + e);\n  } finally {\n    // finally 块始终会被执行。\n    console.log(\"\
    Code in finally block\");\n  }\n  return \" !! \";\n}\n// -----------------------\
    \ 测试 -------------------------------------\n// 测试 1:\nconsole.log(\"----- Call\
    \ getGreeting(null) -----\");\nlet v1 = getGreeting(null);\nconsole.log(\"Greeting:\
    \ \" + v1);\n  // 测试 2:\nconsole.log(\"------ Call getGreeting(language) ------\"\
    );\nlet language = new Object();\nlanguage.greeting = function() {\n  return \"\
    Hello Everybody\"\n}\nlet v2 = getGreeting(language);\nconsole.log(\"Greeting:\
    \ \" + v2);\n```\n\n运行示例：\n\nOutput\n----- Call getGreeting(null) -----Code in\
    \ try block (*)Code in catch block. Something Error: TypeError: Cannot read property\
    \ 'greeting' of nullCode in finally blockGreeting: !!----- Call getGreeting(language)\
    \ -----Code in try block (*)Code in try block (**)Code in finally blockGreeting:\
    \ Hello Everybody\n\n下面的插图展示了当 `try` 块中发生错误时的程序流程，`finally` 块始终会被执行。\n\n![](img/image_rsrc8RT.jpg)\n\
    \n下面的图显示了当 `try` 块中没有发生错误时的程序流程。在这种情况下，`finally` 块会在 `try` 块的 `return` 命令执行之前立即执行。\n\
    \n![](img/image_rsrc8RU.jpg)\n\n### 4. 内置错误\n\n`ECMAScript` 提供了几个内置类来表示错误。以下是它们的层级结构。\n\
    \n![](img/image_rsrc8RV.jpg)\n\n#### RangeError\n如果你使用了允许范围之外的数字，会抛出 `RangeError`。\n\
    \n`error-RangeError-example.js`\n\n```javascript\nlet num = 1;\ntry {\n  // 数字不能有\
    \ 500 位有效数字\n  num.toPrecision(500); // ==> RangeError!!\n} catch(err) {\n  console.log(err.name);\n\
    \  console.log(err);\n}\n```\n\n#### ReferenceError\n如果你使用了未声明的变量，会抛出 `ReferenceError`：\n\
    \n`error-ReferenceError-example.js`\n\n```javascript\nvar x;\ntry {\n  x = y +\
    \ 1;   // 无法引用 y（使用）\n} catch(err) {\n  console.log(\"Error Name: \"+ err.name);\n\
    \  console.log(err);\n}\n```\n\n#### SyntaxError\n如果你尝试评估带有语法错误的代码，会抛出 `SyntaxError`。\n\
    \n`error-SyntaxError-example.js`\n\n```javascript\ntry {\n  let x;\n  eval(\"\
    \ x  = 'Hello  \");  // 缺少 ' 会产生错误\n  try {\n    let x;\n    eval(\" x  = 'Hello\
    \  \");  // 缺少 ' 会产生错误\n  } catch(err) {\n    console.log(\"Error Name: \" + err.name);\n\
    \    console.log(err);\n  }\n} catch(err) {\n  console.log(\"Error Name: \" +\
    \ err.name);\n  console.log(err);\n}\n```\n\n#### TypeError\n如果你使用了与预期类型不符的值，会抛出\
    \ `TypeError`。例如，当你调用一个对象的方法而该对象没有该方法时，就会发生错误。\n\n`error-TypeError-example.js`\n\
    \n```javascript\nvar num = 1;\ntry {\n  num.toUpperCase(); // 数字没有 toUpperCase\
    \ 方法\n} catch(err) {\n  console.log(\"Error Name: \" + err.name);\n  console.log(err);\n\
    }\n```\n\n#### URIError\n如果你在 URI 函数中使用非法字符，会抛出 `URIError`：\n\n`error-URIError-example.js`\n\
    \n```javascript\ntry {\n  decodeURI(\"%%%\");  // 你不能对百分号进行 URI 解\n} catch(err)\
    \ {\n  console.log(\"Error Name: \" + err.name);\n  console.log(err);\n}\n```\n\
    \n### 5. Throw 出错误\n\n`ECMAScript` 允许你在程序运行期间抛出任何内容。程序将认为错误刚刚发生。\n\n`throw-any-example.js`\n\
    \n```javascript\nconsole.log(\" -------- Test throw any object ------------\"\
    );\ntry {\n  let myObj = {};\n  throw myObj;\n} catch(e)  \n  console.log(\"Catch\
    \ error: \");\n  console.log(e);\n}\nconsole.log(\" -------- Test throw a Symbol\
    \ ------------\");\ntry {\n  let mySymbol = Symbol();\n  throw mySymbol;\n} catch(e)\
    \  \n  console.log(\"Catch error: \");\n  console.log(e);\n}\nconsole.log(\" --------\
    \ Test throw a Number ------------\");\ntry {\n  let myNumber = 100;\n  throw\
    \ myNumber;\n} catch(e)  \n  console.log(\"Catch error: \");\n  console.log(e);\n\
    }\nconsole.log(\" -------- Test throw a String ------------\");\ntry {\n  let\
    \ myString = \"Some error\";\n  throw myString;\n} catch(e)  \n  console.log(\"\
    Catch error: \");\n  console.log(e);\n}\n```\n\n（注：原文代码块中存在多处语法错误如缺少大括号，翻译时已保持逻辑一致并对齐）\n\
    \nOutput\n -------- Test throw any object ------------Catch error: {} --------\
    \ Test throw a Symbol ------------Catch error: Symbol() -------- Test throw a\
    \ Number ------------Catch error: 100 -------- Test throw a String ------------Catch\
    \ error: Some error\n"
- fmt: "\n```javascript\nlet err = new Error(\"My Error\");\nlet rangeErr = new RangeError();\n\
    let evalErr = new EvalError(\"My Eval Error\");\n// A random value in [0.. 9]\n\
    let randomValue = Math.floor(Math.random() * 10);\n// [0,1,2,3]\nlet random0123\
    \ = randomValue % 4;\nconsole.log(\"random0123 = \" + random0123);\ntry {\n  if(random0123\
    \ == 0) {\n    throw err;\n  } else if(random0123 == 1) {\n    throw rangeErr;\n\
    \  } else if(random0123 == 2) {\n    throw evalErr;\n  } else if(random0123 ==\
    \ 3) {\n    throw \"A String Error\";\n  }\n} catch(e) {\n  console.log(\"typeof\
    \ e = \" + (typeof e));\n  // 'object' or 'string'\n  if(e instanceof RangeError)\
    \ {\n    console.log(\"--> RangeError!!\");\n  } else if(e instanceof EvalError)\
    \ {\n    console.log(\"--> EvalError!!\");\n  } else if(e instanceof Error) {\n\
    \    console.log(\"--> Error!!\");\n  } else if (typeof e == \"string\") {\n \
    \   console.log(\"--> String Error!!\");\n  } else {\n    console.log(\"--> Error!!\"\
    );\n  }\n  console.log(e);\n}\n```\n\n# 6 The properties of Error\n\nIn the ECMAScript,\
    \ the error caught by you may be a \"Error object\" or any error type. If it is\
    \ a \"Error object\" you will obtain the important information such as the name\
    \ of file of error, error position, Stack Trace,..\n\nThere are some important\
    \ properties of the `Error` class:\n\n* `name`: Name of error\n* `message`: Content\
    \ of error\n* `stack` (Readonly): a string containing information helping you\
    \ detect the position of error.\n\n`error-properties-example.js`\n\n```javascript\n\
    // Create an Error\nlet myError = new Error();\nmyError.name = \"MyError\";\n\
    myError.message = \"My Error String\";\ntry {\n  throw myError;\n} catch(err)\
    \ {\n  console.log(\"Error Name: \" + err.name);\n  console.log(\"Error Message:\
    \ \" + err.message);\n  console.log(\"Type of err.stack: \" + (typeof err.stack));\n\
    \  console.log(\"--- Stack Trace: ---\");\n  console.log(err.stack);\n}\n```\n\
    \n# 7 Re-throw Error\n\nWhile handling the exception, you can catch that exception\
    \ and handle it or you can re-throw it.\n\n`rethrow-example.js`\n\n```javascript\n\
    function checkScore(score) {\n  if (score < 0 || score > 100) {\n    throw \"\
    Invalid Score \" + score;\n  }\n}\nfunction checkPlayer(name, score) {\n  try\
    \ {\n    checkScore(score)\n  } catch (e) {\n    // Do something with the Exception\n\
    \    console.log(\"Something invalid with player: \" + name + \" >> \" + e);\n\
    \    // Then re-throw this Exception.\n    throw e;\n  }\n  console.log(\"OK Player\
    \ \" + name + \" has score: \" + score );\n}\n// --------------- TEST --------------\n\
    checkPlayer(\"Tom\", 90);\ncheckPlayer(\"Jerry\", -10);\n```\n\nFor example, catch\
    \ an exception and throw an other exception.\n\n`rethrow-example2.js`\n\n```javascript\n\
    function checkScore(score) {\n  if (score < 0 || score > 100) {\n    throw \"\
    Invalid Score \" + score;\n  }\n}\nfunction checkPlayer(name, score) {\n  try\
    \ {\n    checkScore(score)\n  } catch (e) {\n    // Do something with the Exception\n\
    \    console.log(\"Something invalid with player: \" + name + \" >> \" + e);\n\
    \    // Then throw other exception\n    throw (\"Score \" + score +\" invalid\
    \ for player \" + name);\n  }\n  console.log(\"OK Player \" + name + \" has score:\
    \ \" + score );\n}\n// --------------- TEST --------------\ncheckPlayer(\"Tom\"\
    , 90);\ncheckPlayer(\"Jerry\", -10);\n```\n\n# 8 Exceptions when catching errors\n\
    \nIn the ECMAScript there are the situations that you think that a error will\
    \ occur but it doesn't happen. For example, a number divided by 0 will not cause\
    \ an error, the result returns Infinity or -Infinity.\n\n`ex-Infinity-example.js`\n\
    \n```javascript\nconsole.log( typeof Infinity ); // number\nlet a = 1 / 0;\nconsole.log(a);\
    \ // Infinity\nlet b = -1 / 0;\nconsole.log(b); // -Infinity\n```\n\nDivide a\
    \ value other than a number by a number, the result is NaN (Not a Number).\n\n\
    `ex-NaN-example.js`\n\n```javascript\nconsole.log( typeof NaN ); // number\nconsole.log(\
    \ isNaN(1) ); // false\nconsole.log( isNaN( NaN ) ); // true\nlet a = \"A String\"\
    \ / 2;\nconsole.log(a); // NaN\nlet obj = {};\nlet b = obj / 2;\nconsole.log(b);\
    \ // NaN\n```\n\nYou can access an element with any index of an array without\
    \ causing an error.\n\n`ex-array-index-example.js`\n\n```javascript\nlet myArray\
    \ = [1, 100, 20];\nconsole.log( myArray[1]); // 100\nconsole.log( myArray[10]\
    \ ); // undefined\nconsole.log( myArray[-10] ); // undefined\n```\n\n# Chapter\
    \ 12 : JavaScript Error Handling\n\n## 1 Form Validation\n### 2 Simple example\n\
    ### 3 Access the form data\n### 4 Submit through Javascript\n### 5 Validate automatically\n\
    \n## 1 Form Validation (continued)\n\nQuite regularly, you meet a website where\
    \ users enter information into a form before sending it to the server, for example,\
    \ the account registration form. The information that the user enters into the\
