    \ #ddd; padding: 5px;\">\n<form name=\"myForm\" method=\"GET\" action=\"process-action.html\"\
    \ onsubmit = \"return validateForm()\">\nUsername: <input type=\"text\" name=\"\
    username\"/><br><br>\nPassword: <input type=\"password\" name = \"password\"/><br><br>\n\
    <button type=\"submit\">Submit</button>\n</form>\n</div>\n</body>\n</html>\n```\n\
    \n示例：要求用户输入一个 0 到 10 之间的数字。\n\n`validation-number-example.html`\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Validation</title>\n<script type = \"text/javascript\"\
    >\nfunction validateForm()  {var myField = document.getElementById(\"myNumber\"\
