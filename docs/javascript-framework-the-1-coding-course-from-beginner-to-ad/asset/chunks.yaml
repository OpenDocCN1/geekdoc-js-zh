    1  Form Validation


    Quite regularly, you meet a website where users enter information into a form
    before sending it to the server, for example, the account registration form. The
    information that the user enters into the form needs to be validated to ensure
    data rationality.


    | ![](OEBPS/image_rsrc8RW.jpg) |


    Some examples of authentication:


    *   Check to ensure that the data is not empty.


    *   Check email format


    *   Check telephone number format


    *   ..


    There are basically 3 ways for data validation:


    *   form data will be sent to the server, and validation will be done on the server
    side.


    *   form data will be validated on the client side by using Javascript, which
    helps server not have to work too much and increase performance for the application.


    *   Use both above methods to validate form.


    In this lesson, I will discuss using Javascript to validate form. Below is the
    illustration of the program''s behavior when the user clicks the Submit button.


    | ![](OEBPS/image_rsrc8RX.jpg) |


    *   You have to register a function in combination with the onsubmit event of
    form. The duty of this function is to check the data which an user has entered
    in form, and return true if all the information entered by the user is valid and
    vice versa return false.


    *   When the user clicks Submit, the function in combination with the onsubmit
    event will be called.


    *   Ifthe function in combination with the onsubmit event returns true, the data
    of form will be sent to the server and vice versa the Submit action will be cancelled.


    2  Simple example


    OK, this is a simple example helping you understand the operating rules of Form
    before practising more complex examples.


    | ![](OEBPS/image_rsrc8RY.jpg) |


    The action attribute of <form> is used to specify the page to which data will
    be given or in other words, this is the page that will process the data sent from
    the <form> of the current page.


    Note : The pages processing the data sent from form are usually written by Servlet/JSP,
    PHP technology or a technology on the Server side instead of an HTML page. However,
    I do not mention data processing in this lesson.


