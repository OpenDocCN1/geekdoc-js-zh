    var data = [[\"0100-1111\", \"Tom\"],[\"0100-5555\", \"Jerry\"],[\"0100-2222\"\
    , \"Donald\"]];\nvar myContacts = new Map(data);\nvar has = myContacts.has(\"\
    0100-5555\");\nconsole.log(\"Has key 0100-5555? \" + has); // true\n```\n\n###\
