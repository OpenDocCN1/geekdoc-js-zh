    \ type=\"password\" name = \"password\" pattern=\"(?.*\\d)(?=.*[a-z])(?=[A-Z]).{8,}\"\
    title=\"Invalid password!\"/><br/><br/><\n<button type=\"submit\">Submit</button>\n\
