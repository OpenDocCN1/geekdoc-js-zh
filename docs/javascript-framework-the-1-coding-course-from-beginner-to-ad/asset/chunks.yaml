    type="text" name = "fullName" value ="" required/><br/><br/><button type="submit">Submit</button></form></div></body></html>
    |


    Some <input> elements newly introduced in HTML 5, for example color, date, datetime-local,
    email, month, number, range, search, tel, time, url, week,. These elements have
    special attributes to help the browser to know how to validate its data automatically.
    Below is list of some such attributes:


    | Attribute | Description |


    | disabled | Specifies that the Input element should be disabled |


    | max | Specifies the maximum value of an Input element |


    | min | Specifies the minimum value of an Input element |


    | pattern | Specifies the value pattern of an Input element |


    | required | Specifies that the Input field requires an element |


    | type | Specifies the type of an Input element |


