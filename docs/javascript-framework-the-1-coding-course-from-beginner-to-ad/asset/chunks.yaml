    2  focusin, focusout


    The focus, blur events are designed for the elements are "focusable", for example,
    <input>, <textarea>,.. While the focusin, focusout events are designed for the
    elements that can contain other elements for example, <div>, <span>, <form>,..


    focus vs focusin


    | ![](OEBPS/image_rsrc8UT.jpg) |


    Suppose you have a <form> with 2 <input> child elements. When an user jumps into
    one of the <input> elements then the focus event will occur. The focus event at
    the child element will create the focusin event at the parent elements. Thus this
    focusin event will occur at the <form> element.


    Note: Although the focusin event occurs on the parent element, but event.target
    returns the child element (The element that fires the focus event).


    blur vs focusout


    | ![](OEBPS/image_rsrc8UU.jpg) |


    Suppose you have a <form> with 2 <input> child elements. When an user jumps out
    of the <input> element, the blur event will happen.The blur event at the child
    element will create the focusout event at the parent elements. Thus this focusout
    event will occur at the <form> element.


    Note: Although the focusout event occurs on the parent element, but event.target
    returns the child element (The element that fires the blur event).


    Example: focusin & focusout


