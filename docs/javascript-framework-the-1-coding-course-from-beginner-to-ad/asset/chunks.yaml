    A Button outside the form -->Button outside the form:<button onclick="submitByJavascript()">Click
    Me to submit form</button></body></html> |


    5  Validate automatically


    The browser can automatically validate several types of data on the form, such
    as adding a required attribute to a form field to tell the browser that this field
    is mandatory. The browser will automatically check and notify an user if an user
    does not enter that field.


