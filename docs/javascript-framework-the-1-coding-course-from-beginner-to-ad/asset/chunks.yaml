    Chapter 28 :


    Javascript InputEvent


    1  InputEvent


    2  Properties, Methods


    1  InputEvent


    InputEvent is an interface that represents events occurring when a user enters
    data on the editable elements such as <input>, <textarea> or the elements with
    contenteditable="true" attributes.


    InputEvent is a sub-interface of UIEvent.


    | ![](OEBPS/image_rsrc8UY.jpg) |


    Events:


    | Event | Description |


    | input | The event occurs when an element gets user input |


    Example of elements that support the input event:


    inputevents-elements-example.html


    | <!DOCTYPE html><html><head><title>InputEvent Example</title><meta charset="UTF-8"><style>*[contenteditable=''true'']   {height:30px;padding:5px;border:1px
    solid #ccd;}</style><script>// Note: event.data is not supported in Firefox, IEfunction
    inputHandler(evt)  {showLog(evt.data);}function showLog(text)  {var logDiv = document.getElementById("log-div");logDiv.innerHTML
    = logDiv.innerHTML + " .. " + text;}</script></head><body><h3>InputEvent example</h3><p
    style="color:red">Note: event.data is not supported in Firefox, IE</p><h3>Input
    element</h3><input type="text" oninput ="inputHandler(event)"/><h3>Textarea element</h3><textarea
    oninput ="inputHandler(event)" rows="5" cols="30"></textarea><h3>Elements with
    contenteditable=''true''</h3><div oninput ="inputHandler(event)" contenteditable="true"></div><p
    id="log-div"></p></body></html> |


    | ![](OEBPS/image_rsrc8UZ.jpg) |


    Events: input vs change


    You also can consider using the change event because it is quite similar to the
    input event:


    *   The change event supports the <select> element. It occurs when users change
    the option on <select>.


    *   For the <input> (text, number, email, password, tel, time, week, month, date,
    datetime-local, search, url), <textarea> elements: The input event occurs immediately
    after the value of element changes. While the change event occurs when the value
    of element changes and the element loses focus.


