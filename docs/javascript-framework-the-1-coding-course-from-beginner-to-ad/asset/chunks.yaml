    \ is ignored.\n*   Steps (7), (8) will be executed.\n*   Step (9 will be executed.\n\
    \n### 3. try-catch-finally\n\nWe have got accustomed with catching error through\
    \ `try-catch` block. `try-catch-finally` is used to fully handle error. The `finally`\
    \ block is always executed, regardless of whether the error occurs in the `try`\
    \ block or not.\n\n```javascript\ntry {\n  // Do something here.\n} catch (e )\
    \ {\n  // Do something here.\n} finally  {\n  // The finally block is always executed\n\
    \  // Do something here.\n}\n```\n\nExample:\n\n`try-catch-finally-example.js`\n\
    \n```javascript\nfunction getGreeting(language) {\n  try {\n    console.log(\"\
    Code in try block (*)\");\n    // Call greeting() method of object 'language'\n\
    \    // An Exception can throw here if this object has no greeting() method.\n\
    \    let v = language.greeting();\n    console.log(\"Code in try block (**)\"\
    );\n    return v;\n  } catch (e) {\n    console.log(\"Code in catch block. Something\
    \ Error: \" + e);\n  } finally {\n    // The finally block is always executed.\n\
    \    console.log(\"Code in finally block\");\n  }\n  return \" !! \";\n}\n// -----------------------\
