    \ ... points) {\n  console.log(\"------------ \");\n  console.log(\"Name: \" +\
    \ name);\n  console.log(\"Array length: \"+ points.length);\n  for(let i=0; i<\
    \ points.length; i++) {\n    console.log(points[i]);\n  }\n}\nshowInfo(\"Tom\"\
    , 52, 82, 93);\nshowInfo(\"Jerry\", 10, 50);\nshowInfo(\"Donald\");\n```\n\nOutput\n\
    ```\n------------Name: TomArray length: 3528293\n------------Name: JerryArray\
    \ length: 21050\n------------Name: DonaldArray length: 0\n```\n\n## 4 `匿名函数`\n\
    \n没有名字的函数被称为匿名函数。匿名函数是在程序运行时动态创建的。它和普通函数一样具有参数和返回值。\n\n你也可以声明一个值为匿名函数的变量。这种表达式被称为\
    \ `函数表达式`（Function Expression）。\n\n```javascript\nvar myVar = function( parameters\
    \ ) {// ....}\n```\n\n示例：\n\n`anonymos-function-example.js`\n\n```javascript\n\
    // Function expression\nvar f = function(name){\n  return \"Hello \" + name;\n\
    }\n// 调用它。\nvar value = f(\"Tom\");\nconsole.log( value ); // Hello Tom.\n```\n\
    \n例如，创建一个匿名函数并立即调用它。在这种情况下，该匿名函数仅被创建了一次。\n\n`anonymous-function-example2.js`\n\
    \n```javascript\n// 创建匿名函数并立即调用\n(function() {\n  var now = new Date();\n  console.log(\"\
    Now is \" + now);\n}) () ;\n\n// 创建匿名函数并立即调用\n(function(name) {\n  console.log(\"\
    Hello \" + name);\n}) (\"Tom\") ;\n```\n\nOutput\n```\nNow is Mon Nov 05 2023\
    \ 00:44:47\nHello Tom\n```\n\n## 5 `函数构造函数`\n\n我们有一个 `Function` 类，因此你可以通过该类的构造函数来创建一个函数。\n\
    \n```javascript\nvar variableName = new Function(paramName1, paramName2, ...,\
    \ paramNameN, \"Function Body\");\n```\n\n例如：\n\n`function-constructor-example.js`\n\
    \n```javascript\nvar myMultiple = new Function( \"x\", \"y\", \"return x * y\"\
    );\nconsole.log( myMultiple (3, 4) ); // 12\nfunction showTotal() {\n  let quantity\
    \ = 4;\n  let price = 5;\n  console.log(\"Total: \" + myMultiple(quantity, price)\
    \ );\n}\nshowTotal();\n```\n\nOutput\n```\n12\nTotal: 20\n```\n\n## 6 `生成器函数`\n\
    \n为了声明一个`生成器函数`，我们使用 `function*` 关键字。\n\n```javascript\nfunction* functionName(\
    \ param1, param2, ..., paramN {// Statements}\n```\n\n基本上，`生成器函数`意味着能够暂停执行并在随时继续运行的函数。`生成器函数`\
    \ 以隐式方式返回一个 `Iterator`（迭代器对象）。在函数内部，你只需要定义该迭代器中各个元素的值即可。\n\n你可能对上面的解释感到非常困惑。我们来看例子：\n\
    \n![](img/image_rsrc8PX.jpg)\n\n`generator-function-example.js`\n\n```javascript\n\
    function* season() {\n  yield \"Spring\";\n  yield \"Summer\";\n  yield \"Autumn\"\
    ;\n  yield \"Winter\";\n}\n// 此方法返回一个 Iterator。\nvar seasonIterator = season();\n\
    let value1 = seasonIterator.next().value;\nconsole.log(value1); // Spring\nlet\
    \ value2 = seasonIterator.next().value;\nconsole.log(value2); // Summer\nlet value3\
    \ = seasonIterator.next().value;\nconsole.log(value3); // Autumn\nlet value4 =\
    \ seasonIterator.next().value;\nconsole.log(value4); // Winter\n```\n\n更短的示例：\n\
    \n```javascript\nfunction* season() {\n  yield \"Spring\";\n  yield \"Summer\"\
    ;\n  yield \"Autumn\";\n  yield \"Winter\";\n}\n// 此方法返回一个 Iterator。\nvar seasonIterator\
    \ = season();\nlet e;\nwhile( !(e = seasonIterator.next()).done ) {\n  console.log(e.value);\n\
    }\n```\n\n当普通函数被调用时，它将执行到返回值或函数结束为止。在此期间，`调用者函数`（Caller Function）无法控制`被调用函数`（Called\
    \ Function）的执行。\n\n如果`被调用函数`是一个`生成器函数`，则`调用者函数`就可以控制`被调用函数`的执行。以下是这样的示例：\n\n`generator-function-example3.js`\n\
    \n```javascript\nfunction* season() {\n  console.log(\"Do something in Spring\"\
    );\n  yield \"Spring\";\n  // Spring 在此处停止！\n  console.log(\"Do something in Summer\"\
    );\n  yield \"Summer\";\n  // Summer 在此处停止！\n  console.log(\"Do something in Autumn\"\
    );\n  yield \"Autumn\";\n  // Autumn 在此处停止！\n  console.log(\"Do something in Winter\"\
    );\n  yield \"Winter\";\n  // Winter 在此处停止！\n}\n// 此方法返回一个 Iterator。\nvar seasonIterator\
    \ = season();\nlet e;\nwhile( !(e = seasonIterator.next()).done ) {\n  console.log(e.value);\n\
    \  if(e.value === \"Autumn\") {\n    console.log(\"OK Stop after Autumn\");\n\
    \    break;\n  }\n}\n```\n\nOutput\n```\nDo something in Spring\nSpring\nDo something\
    \ in Summer\nSummer\nDo something in Autumn\nAutumn\nOK Stop after Autumn\n```\n\
    \n## 第 6 章：JavaScript `Number`\n\n### `ECMAScript Number`\n\n在 `ECMAScript` 中，`Number`\
    \ 数据类型表示数字，它可以是`整数`，也可以是`浮点数`。\n\n基于内存管理方式，`Number`分为两类：`Number 对象`（Number Object）和`Number\
    \ 原始类型`（Number Primitive）。\n\n#### `Number 原始类型`\n\n通常，创建一个数字，你应该使用原始类型语法：\n\n\
    ```javascript\n// 原始类型语法：\nvar myNumber1 = 100;\nvar myNumber2 = 55.1;\n```\n\n\
    `Number` 原始类型存储在公共池（Common Pool）中，这意味着当你声明两个或多个具有相同值的 `Number` 原始类型时，它们将指向公共池中同一个内存位置。\n\
    \n`===` 运算符用于检查两个变量是否指向内存中的同一个地址。\n\n![](img/image_rsrc8PY.jpg)\n\n`number-primitive-example1.js`\n\
    \n```javascript\nlet a = 100;\nlet b = 150.1;\nlet c = 150.1;\n// a, b: 相同地址？\n\
    console.log( a === b); // false\n// b, c: 相同地址？\nconsole.log( b === c); // true\n\
    ```\n\n你也可以通过使用 `Number(value)` 函数来创建一个数字。你收到的结果是一个 `Number` 原始类型：\n\n`number-primitive-example2.js`\n\
    \n```javascript\nlet a = 100;\nlet b = 150.1;\n// 使用 Number() 函数\nlet c = Number(150.1);\n\
    // a, b: 相同地址？\nconsole.log( a === b); // false\n// b, c: 相同地址？\nconsole.log(\
    \ b === c); // true\n```\n\n#### `Number 对象`\n\n你可以通过 `Number` 类的构造函数来创建一个数字。在这种情况下，你将得到一个\
    \ `Number 对象`。\n\n```javascript\n// 语法：\nvar aNumber = new Number(number);\n//\
    \ 示例：\nvar myNumber1 = new Number(100);\nvar myNumber2 = new Number(150.1);\n\
    ```\n\n`new` 运算符始终会在堆（Heap）内存上创建一个新实体。\n\n![](img/image_rsrc8PZ.jpg)\n\n当将变量 `aa`\
    \ 的新值赋值给变量 `bb` 时。变量 `bb` 将指向变量 `aa` 所指向的内存地址。在这种情况下，内存中不会创建新实体。\n\n![](img/image_rsrc8R0.jpg)\n\
    \n## 第 7 章：JavaScript `Boolean`\n\n### `ECMAScript Boolean`\n\n`Boolean` 是 `ECMAScript`\
    \ 中简单的数据类型。它只有两个原始值：`true` 和 `false`。\n\n#### `Boolean 原始类型`\n\n以下是原始语法，它是你创建一个\
    \ `Boolean` 类型类型变量最简单的方法：\n\n`boolean-primitive-example.js`\n\n```javascript\n\
    let a = true;\nlet b = false;\nconsole.log( a ); // true\nconsole.log( b ); //\
    \ false\n```\n\n`Boolean` 公共池是一个池。它只有两个值：`true`、`false`。当你根据原始语法创建变量时，它将指向池中 `true`\
    \ 或 `false` 的地址。\n\n`===` 运算符用于比较两个变量指向的地址。\n\n![](img/image_rsrc8R1.jpg)\n\n\
    #### `Boolean 对象`\n\n你也可以通过 `Boolean` 类的构造函数创建一个 `Boolean 对象`。本质上，你创建一个封装了原始值（`true`\
    \ 或 `false`）的对象。\n\n```javascript\nvar myObj = new Boolean(value);\n```\n\n`参数：`\n\
    \n`value`: 如果此参数的值为 `false`、`0`、`\"\"`、`null`、`undefined`、`NaN`、`Number.Infinite`，它将创建一个\
    \ `Boolean {false}` 对象。在其他情况下，它将创建 `Boolean {true}` 对象。\n\n"
