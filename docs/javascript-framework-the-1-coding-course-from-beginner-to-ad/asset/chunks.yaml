    \  }\n} catch(err) {\n  console.log(\"Error Name: \" + err.name);\n  console.log(err);\n\
    }\n```\n\n#### TypeError\nA `TypeError` is thrown if you use a value that is not\
    \ of the expected type. For example, an error occurs when you call a method of\
    \ an object, while this object does not have that method.\n\n`error-TypeError-example.js`\n\
    \n```javascript\nvar num = 1;\ntry {\n  num.toUpperCase(); // Number has no method\
