    # Chapter 32 : Javascript URL Encoding


    ## 1 Javascript URL Encoding


    In this article, I will show you how to encode and decode a URL using Javascript.


    Let''s begin with the question, "How do we do to encode a URL with Javascript?".


    Actually, it depends on what you want to do. Javascript provides you with two
    functions which are `encodeURI()` and `encodeURIComponent()`. The difference between
    these two functions is that which characters will be encoded.


    - The `encodeURI()` function encodes all the characters except for the `~!@#$&*()=:/;?+`

    - The `encodeURIComponent()` function encodes all the characters except for the
    `-_.!~*''()`


    Therefore, the `encodeURI()` function will be a good choice if you want to entirely
    encode a URL, because the `http://` will not be encoded. Otherwise, you can use
    the `encodeURIComponent()` function if you intend to encode the value of a parameter.


    But if you use the `encodeURIComponent()` function to entirely encode a URL, you
    will get an unwanted result.


    # Chapter 33 : Javascript FileReader


    ## 1 FileReader


    ## 2 Example with FileReader


    ### 1 FileReader


    Interface `FileReader` in Javascript is designed to read data sources on users''
    computers.


    Note: In fact, Javascript can read only resources on the user''s computer if the
    user has actions to allow, for example, the user clicks the `<input type="file">`
    element to select the file on the computer, or drag and drop the files into the
    browser.


    `FileReader` can read the `File`, `Blob` or `DataTransfer` objects (This object
    is obtained when users drug and drop a file into the browser).


    The API of `FileReader` is designed with the same main purpose as `XMLHttpRequest`
    because both of them have the goal such as loading external resource. Data is
    read asynchronously to avoid blocking browser while the process is being carried
    out.


    ### Constructor


    ```javascript

    // Create a FileReader object:var fileReader = new FileReader();

    ```


    ### Properties


    | Property | Description |

    | :--- | :--- |

    | `error` | A the `DOMException` object that describe errors happening during
    reading data sources. |

    | `readyState` | A number that describes the status of `FileReader`. Values may
    be: 0, 1, 2. |

    | `result` | Content of data source after reading successfully. Its format depends
    on which method is used when starting reading. |


    ### Events


    During loading data source with `FileReader`, the events described in `ProgressEvent`
    will be fired, specifically:


    | Event | Description |

    | :--- | :--- |

    | `loadstart` | Indicates that the process of loading data has begun. This event
    always fires first. |

    | `progress` | Event fires multiple times as data is being loaded, giving access
    to intermediate data. |

    | `error` | Event fires when loading has failed. |

    | `abort` | Event fires when data loading has been canceled by calling `abort()`
    method (Method available on both `XMLHttpRequest` & `FileReader`). |

    | `load` | Event fires only when all data has been successfully read. |

    | `loadend` | Event fires when the object has finished transferring data. Always
    fires after error, abort, or load. |


    ### Event Handlers


    | Handler | Description |

    | :--- | :--- |

    | `onloadstart(progressEvt)` | A handler for the `loadstart` event. |

    | `onprogress(progressEvt)` | A handler for the `progress` event. |

    | `onerror(progressEvt)` | A handler for the `error` event. |

    | `onabort(progressEvt)` | A handler for the `abort` event. |

    | `onload(progressEvt)` | A handler for the `load` event. |

    | `onloadend(progressEvt)` | A handler for the `loadend` event. |


    ### 2 Example with FileReader


    In this example, users drag and drop a file into a `<div>` element. `FileReader`
    will be used to read the basic information and contents of the file dropped by
    the user.


    **filereader-drop-example.html**


    ```html

    <!DOCTYPE html><html><head><title>FileReader Example</title><meta charset="UTF-8"><script
    src="filereader-drop-example.js"></script><style>#drop-area {border: 1px solid
    blue;padding: 15px;margin-top:5px;}</style></head><body><h3>FileReader example</h3><a
    href="">Reset</a></a><div id="drop-area" ondragover="dragoverHandler(event)" ondrop="dropHandler(event)">Drop
    one file here</div><output id="log-div"></output></body></html>

    ```


    **filereader-drop-example.js**


    ```javascript

    function dropHandler(evt) {

    evt.stopPropagation();

    evt.preventDefault();

    // FileList object.

    var files = evt.dataTransfer.files;

    if (files.length != 1) {

    resetLog();

    appendLog("Please drag and drop 1 file!");

    return;

    }

    var file = files[0];

    var fileReader = new FileReader();

    fileReader.onloadstart = function(progressEvent) {

    resetLog();

    appendLog("onloadstart!");

    var msg = "File Name: " + file.name + "<br>" +"File Size: " + file.size + "<br>"
    +"File Type: " + file.type;

    appendLog(msg);

    }

    fileReader.onload = function(progressEvent) {

    appendLog("onload!");

    var stringData = fileReader.result;

    appendLog(" ---------------- File Content ----------------: ");

    appendLog(stringData);

    }

    fileReader.onloadend = function(progressEvent) {

    appendLog("onloadend!");

    // FileReader.EMPTY, FileReader.LOADING, FileReader.DONE

    appendLog("readyState = " + fileReader.readyState);

    }

    fileReader.onerror = function(progressEvent) {

    appendLog("onerror!");

    appendLog("Has Error!");

    }

    // Read file asynchronously.

    fileReader.readAsText(file, "UTF-8"); // fileReader.result -> String.

    }

    function dragoverHandler(evt) {

    evt.stopPropagation();

    evt.preventDefault();

    // Explicitly show this is a copy.

    evt.dataTransfer.dropEffect = ''copy'';

    }

    function resetLog() {

    document.getElementById(''log-div'').innerHTML = "";

    }

    function appendLog(msg) {

    document.getElementById(''log-div'').innerHTML += "<br>" + msg;

    }

    ```

