    6  The properties of Error


    In the ECMAScript, the error caught by you may be a "Error object" or any error
    type. If it is a "Error object" you will obtain the important information such
    as the name of file of error, error position, Stack Trace,..


    There are some important properties of the Error class:


    *   name: Name of error


    *   message: Content of error


    *   stack (Readonly): a string containing information helping you detect the position
    of error.


