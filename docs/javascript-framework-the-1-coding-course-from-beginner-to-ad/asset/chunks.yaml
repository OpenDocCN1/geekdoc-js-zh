    let aalase = new French();\n// 调用函数:intro(flora);\nintro(aalase);\nlet someObject\
    \ = {};\nintro(someObject);\n```\n\n# 第 18 章：JavaScript Set 集合\n\n1. 集合 (Collections)\
    \ - Set\n2. Set 的方法\n3. WeakSet\n\n## 1 Collections - Set\n\nECMAScript 6 引入了两个新的数据结构，如\
    \ `Map` 和 `Set`。它们是 ECMAScript 集合框架的一部分。\n\n**Maps**: 这种数据结构允许你存储“键/值对”。你可以通过键访问值，或为键更新新值。\n\
    \n**Sets**: 这种数据结构存储一个元素列表，不允许重复，且不对元素进行索引。\n\n在这篇文章中，我将向你介绍 `Set`。\n\n### Set\n\
    \n`Set` 是 ECMAScript6 中引入的一种数据结构。以下是 Set 的特性。\n\n* `Set` 是一个不允许迭代的元素列表。\n* `Set`\
    \ 不对元素进行索引。\n* `Set` 是一个有序列表，这意味着先添加的元素会在前面，第二个添加的元素会在后面。\n\n### 构造函数\n\n通过 `Set`\
    \ 的构造函数创建 `Set` 对象：class \n\n```javascript\nnew Set( [iterable] )\n```\n\n###\
    \ 参数\n\n* `iterable` - 如果将此对象传递给 `Set` 的构造函数，其所有元素都将添加到 `Set` 中。相反，如果你没有指定此参数，或者其值为\
    \ `null`，则创建的 `Set` 对象将是空的。\n\n### 属性\n\n`set-example.js`\n\n```javascript\n//\
    \ 从数组创建一个 Set\nvar fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\nconsole.log(fruits);\
    \ // Set { 'Apple', 'Banana', 'Papaya' }\n```\n\n`set-size-example.js`\n\n```javascript\n\
    // 从数组创建一个 Set\nvar fruits = new Set( ['Apple','Banana','Papaya'] );\nvar size\
    \ = fruits.size;\nconsole.log(size); // 3\n```\n\n### for..of\n\n你可以使用 `for...of`\
    \ 循环来遍历 `Set` 的元素。\n\n`set-for-of-loop-example.js`\n\n```javascript\n// 从数组创建一个\
    \ Set\nvar fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\nfor(let fruit\
    \ of fruits) {\n  console.log(fruit);\n}\n```\n\n### 输出\n\n| Apple |\n| Banana\
    \ |\n| Papaya |\n\n## 2 Set 的方法\n\n### add(value)\n\n如果此元素不存在于 `Set` 中，则将其添加到\
    \ `Set` 的末尾并返回此 `Set` 对象。\n\n`set-add-example.js`\n\n```javascript\n// 从数组创建一个\
    \ Set\nvar fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\n// 将一个元素添加到\
    \ Set 并返回此 Set。\nvar thisFruits = fruits.add(\"Cherry\");\nconsole.log(fruits);\
    \ // Set { 'Apple', 'Banana', 'Papaya', 'Cherry' }\n// 'Set' 不允许重复\nfruits.add(\"\
    Banana\");\nconsole.log(fruits); // Set { 'Apple', 'Banana', 'Papaya', 'Cherry'\
    \ }\n```\n\n### 输出\n\n| Set { 'Apple', 'Banana', 'Papaya', 'Cherry' } |\n| Set\
    \ { 'Apple', 'Banana', 'Papaya', 'Cherry' } |\n\n### delete(value)\n\n此方法用于从 `Set`\
    \ 中移除一个元素。如果找到了要删除的元素，方法返回 `true`，否则返回 `false`。\n\n`set-delete-example.js`\n\n\
    ```javascript\n// 从数组创建一个 Set\nvar fruits = new Set( [\"Apple\",\"Banana\",\"\
    Papaya\"] );\nconsole.log(fruits); // Set { 'Apple', 'Banana', 'Papaya' }\n//\
    \ 删除一个元素:\nvar deleted = fruits.delete(\"Banana\");\nconsole.log(\"Deleted? \"\
    \ + deleted); // true\nconsole.log(fruits); // Set { 'Apple', 'Papaya' }\n```\n\
    \n### clear()\n\n移除 `Set` 中的所有元素。\n\n`set-clear-example.js`\n\n```javascript\n\
    // 从数组创建一个 Set\nvar fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\nconsole.log(fruits);\
    \ // Set { 'Apple', 'Banana', 'Papaya' }\n// 移除所有元素。\nfruits.clear();\nconsole.log(fruits);\
    \ // Set { }\nconsole.log(\"Size after clear: \" + fruits.size);\n```\n\n### entries()\n\
    \n此方法返回一个新的迭代器对象，其中每个条目包含一个两个元素的数组，如 `[value, value]`。条目的顺序仍然与 Set 对象中元素的顺序保持不变。（参见下面的插图）\n\
    \n| ![](img/image_rsrc8TG.jpg) |\n\n`set-entries-example.js`\n\n"
