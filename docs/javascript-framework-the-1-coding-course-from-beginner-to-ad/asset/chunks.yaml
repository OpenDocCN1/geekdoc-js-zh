    console.log(myWeakMap.get(key1));\n```\n\n## 第 20 章：理解可迭代对象和迭代器\n\n### 1 迭代 (Iteration)\n\
    ### 2 迭代器 (Iterator) 概念\n### 3 可迭代对象 (Iterable) 概念\n\nECMAScript 提供了一种与数据结构交互的新方式。现在我们来澄清。\n\
    \n你需要区分两个概念：\n\n- **迭代器 (Iterator)**\n- **可迭代对象 (Iterable)**\n\n#### 2 迭代器\n\n\
    在 ECMAScript 中，如果一个对象包含指向下一个元素的指针，则它被称为**迭代器**。迭代器具有一个 `next()` 方法，该方法返回一个包含 `value`\
    \ 和 `done` 属性的对象。如果迭代已完成，`done` 为 `true`，否则为 `false`。\n\n![](img/image_rsrc8.jpg)\n\
    \niterator-object-example.js\n\n```javascript\n// 一个对象\nlet myObject = {\n  prop1:\
    \ \"某个值\",\n  [Symbol.iterator] : function() {\n    console.log(\"我是迭代器\");\n\
    \    return {\n      next: function() {\n        return {value: \"some value\"\
    , done: true };\n      }\n    }\n  }\n}\n```\n\n#### 3 可迭代对象\n\n在语言层面，如果一个对象包含一个集合，并提供了一种公开该集合的方法，则它被称为**可迭代对象**。例如，数组就是可迭代对象，因为它包含元素集合。\n\
    \n技术上，在 ECMAScript 中，被称为**可迭代对象**的对象必须有一个 `Symbol.iterator` 键，该键的方法返回一个迭代器对象。\n\
    \nobject-with-properties.js\n\n```javascript\n// 一个对象\nlet myObject = {\n  prop1:\
    \ \"某个值 1\",\n  prop2: \"某个值 2\",\n  prop3: \"一百\",\n  [Symbol.iterator] : function()\
    \ {\n    console.log(\"我是迭代器\");\n    return {\n      next: function() {\n   \
    \     return {value: \"某个值\", done: true };\n      }\n    }\n  }\n}\n```\n"
