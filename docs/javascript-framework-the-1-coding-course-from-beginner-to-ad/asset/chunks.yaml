    let s = new Set();\ns.add('a'); // Works\n```\n\n`weakset-example.js`\n\n```javascript\n\
    var element1 = {}; // An Object\nvar element2 = {foo: \"bar\"};\nvar element3\
    \ = {bar: \"foo\"};\nvar myWeakSet = new WeakSet( [element1, element2] );\nmyWeakSet.add(element3);\n\
    console.log(myWeakSet.has(element2)); // true\n```\n\n# Chapter 19 : JavaScript\
    \ Map Collection\n\n1 Collections - Map\n2 Map Methods\n3 WeakMap\n\n## 1 Collections\
    \ - Map\n\nECMAScript 6 introduces the 2 new data structures such as `Map` & `Set`.\
    \ They are part of `ECMAScript Collections Framework`.\n\n- `Maps` - This data\
    \ structure allows you to store \"Key/Value\" pairs. And you can access the value\
    \ through the key, or update a new value corresponding to a key.\n- `Sets` - This\
    \ data structure stores a list of elements not allowing duplicate and not indexing\
    \ elements.\n\n### Map:\n\nA `Map` object stores \"Key/Value\", of which the Key\
    \ and the Value can be Primitive types or objects.\n\n- In the `Map` object, keys\
    \ are not iterated.\n- The `Map` is an ordered data type, which means that the\
    \ \"Key/Value\" pair which is added first, will come first. the second fair which\
    \ will come second.\n\n![](OEBPS/image_rsrc8TJ.jpg)\n\nCreate a Map object through\
    \ the constructor of `Map` class:\n\n```javascript\nnew Map( [iteratorObject]\
    \ )\n```\n\n#### Parameters:\n\n- `iteratorObject` - any object which is iterable.\n\
    \n`map-size-example.js`\n\n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"\
    0100-1111\", \"Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"\
    0100-2222\", \"Donald\");\nconsole.log(myContacts.size); // 3\n```\n\n### for..of\n\
    \nYou can use the `for..of` loop to loop through `Map`'s key/value pairs.\n\n\
    `map-for-of-loop-example.js`\n\n```javascript\n// Create a Map object.\nvar myContacts\
    \ = new Map();\nmyContacts.set(\"0100-1111\", \"Tom\");\nmyContacts.set(\"0100-5555\"\
    , \"Jerry\");\nmyContacts.set(\"0100-2222\", \"Donald\");\nfor( let arr of myContacts)\
    \  {\n  console.log(arr);\n  console.log(\" - Phone: \" + arr[0]);\n  console.log(\"\
    \ - Name: \" + arr[1]);\n}\n```\n\n#### Running the example:\n\nOutput\n\n```\n\
    [ '0100-1111', 'Tom' ]\n- Phone: 0100-1111\n- Name: Tom\n[ '0100-5555', 'Jerry'\
    \ ]\n- Phone: 0100-5555\n- Name: Jerry\n[ '0100-2222', 'Donald' ]\n- Phone: 0100-2222\n\
    - Name: Donald\n```\n\n## 2 Map Methods\n\n### set(key, value)\n\nThe `set(key,\
    \ newValue)` method will add a key/newValue` pair to `Map` object if no pair with\
    \ such key exists, on the contrary, it will update a new value for the key/value\
    \ pair found in the `Map`.\n\n`map-set-example.js`\n\n```javascript\nvar data\
    \ = [[\"0100-1111\", \"Tom\"],[\"0100-5555\", \"Jerry\"],[\"0100-2222\", \"Donald\"\
    ]];\nvar myContacts = new Map(data);\nconsole.log(myContacts);\n// Add new Key/Value\
    \ pair to Map\nmyContacts.set(\"0100-9999\", \"Mickey\");\nconsole.log(myContacts);\n\
    // Update\nmyContacts.set(\"0100-5555\", \"Bugs Bunny\");\nconsole.log(myContacts);\n\
    ```\n\n#### Running the example:\n\nOutput\n\n```\nMap {'0100-1111' => 'Tom','0100-5555'\
    \ => 'Jerry','0100-2222' => 'Donald' }\nMap {'0100-1111' => 'Tom','0100-5555'\
    \ => 'Jerry','0100-2222' => 'Donald','0100-9999' => 'Mickey' }\n```\n\n### has(key)\n\
    \nThis method tests whether a key exists in the `Map` or not. It returns `true`\
