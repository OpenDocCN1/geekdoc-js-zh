  trans: "\n\n### href-javascript-example.html\n\n```html\n<!DOCTYPE html><html><head><meta\
    \ charset=\"UTF-8\"><title>Href Javascript</title><script>function getHtmlContentToShow()\
    \  {console.log(\"Do something here...\");alert(\"Do something here...\");// Return\
    \ new HTML content to replace current Page.return \"<h1 style='color:red;'>Other\
    \ HTML Content!</h1>\";}</script></head><body><h1>Href:javascript example</h1><a\
    \ href=\"javascript:getHtmlContentToShow()\">Click me!</a></body></html>\n```\n\
    \n如果 URI 返回 `undefined`，浏览器将不会替换页的内容。\n\n### href-javascript-void-example.html\n\
    \n```html\n<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>Href Javascript\
    \ Void</title><script>function getHtmlContentToShow()  {console.log(\"Do something\
    \ here...\");alert(\"Do something here..\");// Return new HTML content to replace\
    \ current Page.return \"<h1 style='color:red;'>Other HTML Content!</h1>\";}</script></head><body><h1>Href:javascript\
    \ void example</h1><a href=\"javascript:void getHtmlContentToShow()\">Click me!</a></body></html>\n\
    ```\n\n### 3 一次性函数\n\n通常情况下，你需要定义一个函数然后调用它。\n\n#### function-example.js\n\n```javascript\n\
    // 定义一个函数\nfunction sayHello()  {console.log(\"Hello Everyone\");}// 调用函数\nsayHello();\n\
    ```\n\n下面的示例向你展示了如何创建一个仅供一次目的的函数。它会被立即调用。你将无法在程序的任何地方再次使用此函数因为它因为它在用后就不存在了。\n\n\
    #### used-once-function-example.js\n\n```javascript\n// 定义一个函数，并调用它。\n(function\
    \ sayHello()  {console.log(\"Hello Everyone\");}) ();\ntry  {\n// 这个函数不存在。\nsayHello();}\n\
    }catch(e)  {\nconsole.log(e); // ReferenceError: sayHello is not defined\n} \n\
    ```\n\n你也可以使用 `void` 关键字创建一个仅使用一次的函数。它会被立即调用，并且在调用后就不再存在了。\n\n#### void-function-example.js\n\
    \n```javascript\n// 定义一个函数，并调用它。\nvoid function sayHello()  {console.log(\"Hello\
    \ Everyone\");}();\ntry  {\n// 这个函数不存在。\nsayHello();}\n}catch(e)  {\nconsole.log(e);\
    \ // ReferenceError: sayHello is not defined\n} \n```\n\n# 第 15 章：类与对象\n\n1. 你的第一个类\n\
    2. Getter & Setter\n3. 静态属性\n4. 静态方法\n5. 对象比较运算符\n\n## 1 你的第一个类\n\n下面，我有一个 `Rectangle`（矩形），它有两个重要的属性：`width`\
    \ 和 `height`。我们将使用 ES6 语法定义一个名为 `Rectangle` 的类来模拟它。\n\n![](img/image_rsrc8T3.jpg)\n\
    \n创建一个资源文件 `rectangle.js`：\n\n#### rectangle.js\n\n```javascript\n// 定义一个类。\n\
    class Rectangle  {\n// 带有 2 个参数的构造函数。\n// (用于实例化)\n// this.width 指向类的宽度属性\nconstructor\
    \ (width = 5 , height = 10)  {this.width = width;this.height = height;}\n// 一个方法计算矩形的面积。\n\
    getArea() {var area = this.width * this.height\nreturn area}}\n// 通过构造函数创建 Rectangle\
    \ 的对象。\nvar rect = new Rectangle(3, 5);\nconsole.log(\"Height \"+ rect.height);\n\
    console.log(\"Width \"+ rect.width);\n// 调用方法\nlet area = rect.getArea();\nconsole.log(\"\
    Area \"+ area );\n```\n\n运行示例：\n\n**输出**\nHeight 5\nWidth 3\nArea 15\n\n当你从类的构造函数创建一个对象时会发生什么？\n\
    \n![](img/image_rsrc8T4.jpg)\n\n当你调用类的构造函数时，会创建一个新对象，对象的属性将从参数中赋值。\n\n在 ECMAScript\
    \ 中，每个类最多只有一个构造函数。像函数一样，构造函数的参数也可以有默认值。因此你可以以不同的方式创建对象。\n\n```javascript\n// width\
    \ = 3, height = 5\nlet rect = new Rectangle(3, 5);\n// width = 15, height = 10\
    \ (默认值)\nlet rect2 = new Rectangle(15);\n// width = 5 (默认值), height = 50\nlet\
    \ rect3 = new Rectangle(undefined, 50);\n// width = 5 (默认值), height = 10 (默认值)\n\
    let rect4 = new Rectangle();\n```\n\n## 2 Getter & Setter\n\n在给出 Getter & Setter\
    \ 的概念之前，让我们先分析一种情况：\n\n假设我们有一个 `Person` 类，这个类有一个名为 `name` 的属性。\n\n#### Class Person\n\
    \n```javascript\nclass Person  {constructor(name) {this.name = name;}}\n```\n\n\
    你可以访问对象的属性，或者给它赋新值而不会出现任何问题。\n\n```javascript\n// 创建对象\nlet person = new Person(\"\
    Tom\");\n// 访问属性 name。\nconsole.log( person.name); // Tom\n// 给属性 name 赋新值。\n\
    person.name = \"Jerry\"; // !!!\nconsole.log( person.name ); // Jerry\n```\n\n\
    在类外部自由属性并更改其值是非常危险的。有时，你希望某个属性无法被访问，或者无法从类外部对其赋新值。Getter/Setter 允许你创建这样的属性。\n\n\
    好的，我们重新写一遍 `Person` 类。在没有类参数的方法前加上 `get` 关键字，可以创建一个名称与方法名相同的属性。每当程序访问此属性时，该方法就会被调用。\n\
    \n#### getter-example1.js\n\n```javascript\nclass Person  {\nconstructor (name)\
    \  {//属性: __name\nthis.__name = name;}\n// 属性 name 的 getter\nget name()  {console.log(\"\
    Call getter of property 'name'!!\");\nreturn this.__name;}}\n// ------------ 测试\
    \ -----------------\nlet person = new Person(\"Tom\");\n// 访问属性 'name' ==> 调用\
    \ getter\nconsole.log( person.name); // Tom\n// 给属性 name 赋新值。\nperson.name = \"\
    Jerry\"; // 无效!!!!\n// 访问属性 'name' ==> 调用 getter\nconsole.log( person.name); //\
    \ Tom\n```\n\n在带有一个类参数的方法前加上 `set` 关键字，可以创建一个名称与方法名相同的属性。每当程序为此属性赋新值时，该方法就会被调用。\n\
    \n#### setter-example1.js\n\n```javascript\nclass Person  {constructor (name)\
    \  {//属性: __name\nthis.__name = name;}\n// 属性 name 的 setter\nset name(newName)\
    \  {console.log(\"Call setter of property 'name'!!\");\nthis.__name = newName;}\n\
    // 一个方法\nshowInfo()  {console.log(\"Person: \" + this.__name);}}\n// ------------\
    \ 测试 -----------------\nlet person = new Person(\"Tom\");\n// 无法访问属性 'name'\n\
    console.log( person.name); // undefined\n// 为属性 'name' 赋新值 ==> 调用 setter\nperson.name\
    \ = \"Jerry\";\nperson.showInfo(); // Person: Tom\n```\n\n带有 Getter & Setter 的属性示例：\n\
    \n#### getter-setter-example.js\n\n```javascript\nclass Rectangle  {constructor\
    \ (width = 5 , height = 10)  {this.__width = width;this.height = height;}\n//\
    \ 属性 width 的 getter\nget width()  {return this.__width;}\n// 属性 width 的 setter\n\
    set width(newWidth)  {if(newWidth > 0) {this.__width = newWidth;} else{console.log(\"\
    Invalid width \" + newWidth);}}}\n// ------------ 测试 ------------------\nvar rect\
    \ = new Rectangle(3, 5);\nconsole.log(\"Height \"+ rect.height); // Height: 5\n\
    console.log(\"Width \"+ rect.width); // Width: 3\nrect.width = -100;\nconsole.log(\"\
    Height \"+ rect.height); // Height: 5\nconsole.log(\"Width \"+ rect.width); //\
    \ Width: 3\nrect.width = 100;\nconsole.log(\"Height \"+ rect.height); // Height:\
    \ 5\nconsole.log(\"Width \"+ rect.width); // Width: 100\n```\n\n**输出**\nHeight\
    \ 5\nWidth 3\nInvalid width -100\nHeight 5\nWidth 3\nHeight 5\nWidth 100\n\n####\
    \ 私有属性\n\n```javascript\nclass Something {constructor(){this.#someProperty = \"\
    test\";}}\nconst instance = new Something();\nconsole.log(instance.#someProperty);\
    \ // undefined\n```\n\n#### getter-example2.js\n\n```javascript\nclass Person\
    \  {constructor (name)  {// 私有属性: #name\nthis.#name = name;}\n// 属性 name 的 getter\n\
