    JavaScript Variables


    What is Variable


    A variable means a "Memory location" which a program uses to store values. Variable
    name is called an identifier.


    Variable name has to be given by a principle. Below are principles to give a name
    for a variable:


    *   Variable names are not allowed to be the same as keywords


    *   Variable names may contain alphabets or numbers but not start with a number.


    *   Variable names may not contain white spaces or special characters except for
    underscore (_) and dolar character ($).


    Declare variable


    Declaring variable is necessary because you have to do so before using it.


    | // Declare variables:var a1;console.log(a1); // undefinedvar a2 = 100;console.log(a2);
    // 100var a3, a4;var a5, a6 = 200;console.log(a5); // undefinedconsole.log(a6);
    // 200var a7= 100, a8 = 300;let b1;console.log(b1); // undefinedlet b2 = "Hello";console.log(b2);
    // Helloconst c = 100;console.log(c); // 100 |


    block


    A block means a set of commands located in a "curly brackets" {}.


    let


    The let keyword is used to declare a block scope variable, which means that this
    variable will be realized by the program in such block or inside the sub-block,
    but is not realized by the program outside the block defining it.


    | if(true) {let a = 200;console.log(a); // 200}  // Program will ignore this statement:console.log(a);
    |


    If you use the let keyword to define two variables with the same name, one variable
    declared in the parent block, one variable declared in the sub-block, the program
    will treat it as two different variables.


    | let i = 1000;let j = 2000;if(true)  {i = 100; // Assign new value to ''i''let
    j = 200; // A new variable (***)console.log("Test1: " + i + " : " + j); //Test1:
    100 : 200}console.log("Test2: "+ i + " : " + j); //Test2: 100 : 2000 |


    var


    The var keyword is used to declare a variable, which has a broader scope than
    the let variable. It is realized by the program inside the block defining it,
    in sub-blocks, even realized outside the block having declared it.


    | if(true) {var a = 200;console.log(a); // 200}   console.log(a); // 200 |


    If you declare two variables with the same name with the var keyword, a variable
    declared in the parent block, a variable in the sub-block, the program considers
    the two variables to be the same (Same position in memory).


    | var i = 1000;var j = 2000;if(true)  {i = 100; // Assign new valuevar j = 200;
    // Assign new valueconsole.log("Test1: " + i + " : " + j); //Test1: 100 : 200}console.log("Test2:
    "+ i + " : " + j); //Test2: 100 : 200 |


    The variables declared with the var keyword in a function will only be recognized
    by the program in such function. It is not recognized outside the function.


    | // A functionvar test = function()  {var a = 200;console.log(a); // 200}// Call
    function.test();console.log(a); // Not work!! |


    const


    The const keyword is used to declare a constant. When declaring a constant, you
    have to always assign a value to it. But you can not assign a new value to this
    variable. Note: Like the let variable, the const variable has a block scope.


    | // Declare a constant with a valueconst greeting = "Hello";// Assign new value
    to ''greeting''greeting = "Hi"; // ==> Error!!// Declare a constant without a
    valueconst i  ; // ==> Error!! |


    A variable declared with the const keyword, it will be a constant in the sense
    that you can not assign a new value to it, but it is not immutable, you can still
    change its properties.


    Chapter 2 :


    Bitwise Operations


    1  Bitwise


    2  Bitwise operation on numbers


    3  What is Bitwise used for


    1  Bitwise


    In digital computer programming. The bitwise operation works on one or more binary
    numerals, or binary numerals-like strings.


    This is a simple and fast operation, directly supported by processor. Normally,
    bitwise operations are much faster than multiplication, division, sometimes significantly
    faster than addition. bitwise calculations use less energy because it rarely uses
    resources.


    There are 7 bitwise operations :


    | Operator | Name | Description |


    | & | AND | If both bits are 1, the return value is 1, otherwise it returns 0.
    |


    | &#124; | OR | If one of two bits is 1, the return value is 1, otherwise it returns
    0. |


    | ^ | XOR | If 2 bits are different, the return value is 1, otherwise it returns
    0. |


    | ~ | NOT | Inverts all the bits, 0 to 1 and 1 to 0. |


    | << | Zero fill left shift | Shifts all bits to the left. |


    | >> | Signed right shift | Shifts all bits to the right except the first bit.
    |


    | >>> | Zero fill right shift | Shifts all bits to the right. |


    Bitwise AND


    When a bitwise AND is performed on a pair of bits, it returns 1 if both bits are
    1, otherwise returns 0.


    Bitwise OR:


    When a bitwise OR is performed on a pair of bits, it returns 1 if one of the bits
    are 1, otherwise returns 0.


    Bitwise XOR


    When a bitwise XOR is performed on a pair of bits, it returns 1 if the bits are
    different, otherwise returns 0.


    Bitwise NOT


    When a Bitwise NOT is used, it will reverse all bits, 1 to 0, and 0 to 1.


    2  Bitwise operation on numbers


    Different languages can have multiple data types to represent numbers.


    *   Java: byte, short, int, long, double.


    *   C#:byte, sbyte, short, ushort, int, uint, long, ulong, float, double


    *   Javascript: double


    *   .....


    Javascript stores numbers as 64 bits floating point numbers. But bitwise operations
    are performed on 32-bit integers. Other languages such as Java, C#,.. bitwise
    operations are also performed on 32-bit integers.


    Therefore, before carrying out the bitwise operations with numbers, you have to
    convert each number into a sequence of 32 binary numbers.


    Note: Of 32 bits, the first bit is used to determine the sign of number. If this
    bit is 1, it corresponds to the ( - ) sign. If this bit is 0 , it corresponds
    to the ( + ) sign


    | ![](OEBPS/image_rsrc8PK.jpg) |


    Bitwise Left Shift (<<)


    The Bitwise Left Shift ( << ) Operator can change the sign of number.


    | ![](OEBPS/image_rsrc8PM.jpg) |'
