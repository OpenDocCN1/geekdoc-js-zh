- fmt: "\nConfirmation Dialog Box is used to ask the user to confirm something. This\
    \ dialog is very simple, you cannot customize the icon or the title of the dialog\
    \ box, you can only provide a message asking the user to confirm. This dialog\
    \ box has 2 OK and Cancel buttons.\n\n| ![](OEBPS/image_rsrc8PE.jpg) |\n\nTo display\
    \ a Confirmation Dialog Box you call the `confirm(message)` function, in which\
    \ the `message` is one requesting an user to confirm. If the user clicks the OK\
    \ button, this function returns `true`, otherwise if the user clicks the No button,\
    \ this function returns `false`.\n\n| ![](OEBPS/image_rsrc8PF.jpg) |\n\n| ![](OEBPS/image_rsrc8PE.jpg)\
    \ |\n\n| ![](OEBPS/image_rsrc8PG.jpg) |\n\n`confirm-example.js`\n\n```html\n<!DOCTYPE\
    \ html><html><head><title>Confirmation Dialog Box</title><script type=\"text/javascript\"\
    >function testConfirmDialog()  {var result = confirm(\"Do you wantto continue?\"\
    );if(result)  {alert(\"OK Next lesson!\");} else {alert(\"Bye!\");}}</script></head><body><h2>Confirmation\
    \ Dialog Box</h2><button onclick=\"testConfirmDialog()\">Click me!</button></body></html>\n\
    ```\n\n| ![](OEBPS/image_rsrc8PH.jpg) |\n\n# 4. Prompt Dialog Box\n\nThe Prompt\
    \ Dialog Box is used for users to enter an information. This dialog box is very\
    \ simple. It includes a Text Field for users to enter information. The dialog\
    \ box has 2 OK and Cancel buttons.\n\nTo display a Prompt Dialog Box you call\
    \ the `prompt(message, defaultValue)` function in which the `message` is one for\
    \ user. `defaultValue` is default value prefilled in the Text Field.\n\nIf an\
    \ user clicks OK, the function returns contents on Text Field, otherwise, if the\
    \ user clicks Cancel, the function returns `null`.\n\n`prompt-example.js`\n\n\
    ```html\n<!DOCTYPE html><html><head><title>Prompt Dialog Box</title><script type=\"\
    text/javascript\">function testPromptDialog()  {var result = prompt(\"Enter youage:\"\
    , \"20\");if(result != null)  {alert(\"Your age is \" + result);}}</script></head><body><h2>Prompt\
    \ Dialog Box</h2><button onclick=\"testPromptDialog()\">Click me!</button></body></html>\n\
    ```\n\n| ![](OEBPS/image_rsrc8PJ.jpg) |\n\n# JavaScript Variables\n\n## What is\
    \ Variable\n\nA variable means a \"Memory location\" which a program uses to store\
    \ values. Variable name is called an identifier.\n\nVariable name has to be given\
    \ by a principle. Below are principles to give a name for a variable:\n\n- Variable\
    \ names are not allowed to be the same as keywords\n- Variable names may contain\
    \ alphabets or numbers but not start with a number.\n- Variable names may not\
    \ contain white spaces or special characters except for underscore (`_`) and dolar\
    \ character (`$`).\n\n## Declare variable\n\nDeclaring variable is necessary because\
    \ you have to do so before using it.\n\n```javascript\n// Declare variables:\n\
    var a1;\nconsole.log(a1); // undefined\nvar a2 = 100;\nconsole.log(a2); // 100\n\
    var a3, a4;\nvar a5, a6 = 200;\nconsole.log(a5); // undefined\nconsole.log(a6);\
    \ // 200\nvar a7= 100, a8 = 300;\nlet b1;\nconsole.log(b1); // undefined\nlet\
    \ b2 = \"Hello\";\nconsole.log(b2); // Hello\nconst c = 100;\nconsole.log(c);\
    \ // 100\n```\n\n## block\n\nA block means a set of commands located in a \"curly\
    \ brackets\" `{}`.\n\n## let\n\nThe `let` keyword is used to declare a block scope\
    \ variable, which means that this variable will be realized by the program in\
    \ such block or inside the sub-block, but is not realized by the program outside\
    \ the block defining it.\n\n```javascript\nif(true) {\n  let a = 200;\n  console.log(a);\
    \ // 200\n}\n// Program will ignore this statement:\nconsole.log(a);\n```\n\n\
    If you use the `let` keyword to define two variables with the same name, one variable\
    \ declared in the parent block, one variable declared in the sub-block, the program\
    \ will treat it as two different variables.\n\n```javascript\nlet i = 1000;\n\
    let j = 2000;\nif(true) {\n  i = 100; // Assign new value to 'i'\n  let j = 200;\
    \ // A new variable (***)\n  console.log(\"Test1: \" + i + \" : \" + j); //Test1:\
    \ 100 : 200\n}\nconsole.log(\"Test2: \"+ i + \" : \" + j); //Test2: 100 : 2000\n\
    ```\n\n## var\n\nThe `var` keyword is used to declare a variable, which has a\
    \ broader scope than the `let` variable. It is realized by the program inside\
    \ the block defining it, in sub-blocks, even realized outside the block having\
    \ declared it.\n\n```javascript\nif(true) {\n  var a = 200;\n  console.log(a);\
    \ // 200\n}\nconsole.log(a); // 200\n```\n\nIf you declare two variables with\
    \ the same name with the `var` keyword, a variable declared in the parent block,\
    \ a variable in the sub-block, the program considers the two variables to be the\
    \ same (Same position in memory).\n\n```javascript\nvar i = 1000;\nvar j = 2000;\n\
    if(true) {\n  i = 100; // Assign new value\n  var j = 200; // Assign new value\n\
    \  console.log(\"Test1: \" + i + \" : \" + j); //Test1: 100 : 200\n}\nconsole.log(\"\
    Test2: \"+ i + \" : \" + j); //Test2: 100 : 200\n```\n\nThe variables declared\
    \ with the `var` keyword in a function will only be recognized by the program\
    \ in such function. It is not recognized outside the function.\n\n```javascript\n\
    // A function\nvar test = function() {\n  var a = 200;\n  console.log(a); // 200\n\
    };\n// Call function.\ntest();\nconsole.log(a); // Not work!!\n```\n\n## const\n\
    \nThe `const` keyword is used to declare a constant. When declaring a constant,\
    \ you have to always assign a value to it. But you can not assign a new value\
    \ to this variable. Note: Like the let variable, the `const` variable has a block\
    \ scope.\n\n```javascript\n// Declare a constant with a value\nconst greeting\
    \ = \"Hello\";\n// Assign new value to 'greeting'\ngreeting = \"Hi\"; // ==> Error!!\n\
    // Declare a constant without a value\nconst i ; // ==> Error!!\n```\n\nA variable\
    \ declared with the `const` keyword, it will be a constant in the sense that you\
    \ can not assign a new value to it, but it is not immutable, you can still change\
    \ its properties.\n\n# Chapter 2 : Bitwise Operations\n\n## 1. Bitwise\n\n###\
    \ 2. Bitwise operation on numbers\n### 3. What is Bitwise used for\n\n## 1. Bitwise\n\
    \nIn digital computer programming. The bitwise operation works on one or more\
    \ binary numerals, or binary numerals-like strings.\n\nThis is a simple and fast\
    \ operation, directly supported by processor. Normally, bitwise operations are\
    \ much faster than multiplication, division, sometimes significantly faster than\
    \ addition. bitwise calculations use less energy because it rarely uses resources.\n\
    \nThere are 7 bitwise operations:\n\n| Operator | Name | Description |\n| :---\
    \ | :--- | :--- |\n| & | AND | If both bits are 1, the return value is 1, otherwise\
    \ it returns 0. |\n| \\| | OR | If one of two bits is 1, the return value is 1,\
    \ otherwise it returns 0. |\n| ^ | XOR | If 2 bits are different, the return value\
    \ is 1, otherwise it returns 0. |\n| ~ | NOT | Inverts all the bits, 0 to 1 and\
    \ 1 to 0. |\n| << | Zero fill left shift | Shifts all bits to the left. |\n| >>\
    \ | Signed right shift | Shifts all bits to the right except the first bit. |\n\
    | >>> | Zero fill right shift | Shifts all bits to the right. |\n\n### Bitwise\
    \ AND\nWhen a bitwise AND is performed on a pair of bits, it returns 1 if both\
    \ bits are 1, otherwise returns 0.\n\n### Bitwise OR\nWhen a bitwise OR is performed\
    \ on a pair of bits, it returns 1 if one of the bits are 1, otherwise returns\
    \ 0.\n\n### Bitwise XOR\nWhen a bitwise XOR is performed on a pair of bits, it\
    \ returns 1 if the bits are different, otherwise returns 0.\n\n### Bitwise NOT\n\
    When a Bitwise NOT is used, it will reverse all bits, 1 to 0, and 0 to 1.\n\n\
    ## 2. Bitwise operation on numbers\n\nDifferent languages can have multiple data\
    \ types to represent numbers.\n\n- Java: byte, short, int, long, double.\n- C#:byte,\
    \ sbyte, short, ushort, int, uint, long, ulong, float, double\n- Javascript: double\n\
    - …..\n\nJavascript stores numbers as 64 bits floating point numbers. But bitwise\
    \ operations are performed on 32-bit integers. Other languages such as Java, C#,..\
    \ bitwise operations are also performed on 32-bit integers.\n\nTherefore, before\
    \ carrying out the bitwise operations with numbers, you have to convert each number\
    \ into a sequence of 32 binary numbers.\n\nNote: Of 32 bits, the first bit is\
    \ used to determine the sign of number. If this bit is 1, it corresponds to the\
    \ ( - ) sign. If this bit is 0, it corresponds to the ( + ) sign.\n\n| ![](OEBPS/image_rsrc8PK.jpg)\
    \ |\n\n### Bitwise Left Shift (<<)\n\nThe Bitwise Left Shift ( << ) Operator can\
    \ change the sign of number.\n\n| ![](OEBPS/image_rsrc8PM.jpg) |\n"
