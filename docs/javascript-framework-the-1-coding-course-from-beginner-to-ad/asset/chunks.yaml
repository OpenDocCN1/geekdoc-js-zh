    myForm\"];var u = myForm[\"username\"].value;var p = myForm[\"password\"].value;\n\
    ```\n\nWhen a user enters inaccurate data on a form field, you should notify the\
    \ user and focus on that field.\n\n`validation-example1.html`\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Validation</title>\n<script type \"text/javascript\"\
    >\nfunction validateForm()  {  // Get form via form name:var myForm = document.forms[\"\
    myForm\"];var u = myForm[\"username\"].value;var p = myForm[\"password\"].value;\n\
    if(u== \"\") {\n  alert(\"Please enter your Username\");\n  myForm[\"username\"\
    ].focus(); // Focus\n  return false;\n}\nif(p == \"\") {\n  alert(\"Please enter\
    \ you Password\");\n  myForm[\"password\"].focus(); // Focus\n  return false;\n\
    }\nalert(\"All datas are valid!, send it to the server!\")\nreturn true;\n}\n\
    </script>\n</head>\n<body>\n<h2>Enter your Username and Password</h2>\n<div style=\"\
    border:1px solid #ddd; padding: 5px;\">\n<form name=\"myForm\" method=\"GET\"\
    \ action=\"process-action.html\" onsubmit = \"return validateForm()\">\nUsername:\
    \ <input type=\"text\" name=\"username\"/><br><br>\nPassword: <input type=\"password\"\
    \ name = \"password\"/><br><br>\n<button type=\"submit\">Submit</button>\n</form>\n\
    </div>\n</body>\n</html>\n```\n\nExample: Ask an user to enter a number between\
    \ 0 and 10.\n\n`validation-number-example.html`\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Validation</title>\n<script type = \"text/javascript\"\
    >\nfunction validateForm()  {var myField = document.getElementById(\"myNumber\"\
    );\nvar value = myField.value;\nif( value == \"\" || isNaN(value) || value < 0\
    \ || value > 10)  {\n  alert(\"Invalid input!\");\n  myField.focus();\n  return\
    \ false;\n}\nreturn true;\n}\n</script>\n</head>\n<body>\n<h2>Enter a Number between\
    \ 0 and 10</h2>\n<div style=\"border:1px solid #ddd; padding: 5px;\">\n<form name=\"\
    myForm\" action=\"process-action.html\" onsubmit = \"return validateForm()\">\n\
    Number: <input type=\"text\" id= \"myNumber\"/><br/><br/><\n<button type=\"submit\"\
    >Submit</button>\n</form>\n</div>\n</body>\n</html>\n```\n\n![](OEBPS/image_rsrc8S6.jpg)\n\
    ![](OEBPS/image_rsrc8S7.jpg)\n![](OEBPS/image_rsrc8S8.jpg)\n![](OEBPS/image_rsrc8S9.jpg)\n\
    ![](OEBPS/image_rsrc8SA.jpg)\n![](OEBPS/image_rsrc8SB.jpg)\n\n# 4 Submit through\
    \ Javascript\n\nClicking `<button type=\"submit\">` or `<input type=\"submit\"\
    >` inside form helps you to send the data of this form to the server, however,\
    \ you can also do it through Javascript.\n\n`javascript-submit-example.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Javascript Submit</title>\n\
    <script type = \"text/javascript\">\nfunction validateForm() {var name = document.forms[\"\
    myForm\"][\"fullName\"].value;\nif(name == \"\") {\n  alert(\"Please enter your\
    \ name\");\n  return false;\n}\nreturn true;\n}\nfunction submitByJavascript()\
    \  {var valid = validateForm();\nif(!valid)  {\n  return;\n}\nvar myForm = document.forms[\"\
    myForm\"];\nmyForm.submit();\n}\n</script>\n</head>\n<body>\n<h2>Submit a from\
    \ with Javascript</h2>\n<div style=\"border:1px solid #ddd; padding: 5px;\">\n\
    <form name=\"myForm\" action=\"process-action.html\" onsubmit = \"return validateForm()\"\
    >\nYour Name: <input type=\"text\" name = \"fullName\" value=\"\"/><br/><br/><\n\
    <button type=\"submit\">Submit</button>\n</form>\n</div>\n<br/><<!-- A Button\
    \ outside the form -->\nButton outside the form:<button onclick=\"submitByJavascript()\"\
    >Click Me to submit form</button>\n</body>\n</html>\n```\n\n# 5 Validate automatically\n\
    \nThe browser can automatically validate several types of data on the form, such\
    \ as adding a `required` attribute to a form field to tell the browser that this\
    \ field is mandatory. The browser will automatically check and notify an user\
    \ if an user does not enter that field.\n\n![](OEBPS/image_rsrc8SC.jpg)\n![](OEBPS/image_rsrc8SD.jpg)\n\
    \n`required-example.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Required</title>\n\
    </head>\n<body>\n<h2>Required attribute</h2>\n<div style=\"border:1px solid #ddd;\
    \ padding: 5px;\">\n<form name=\"myForm\" action=\"process-action.html\" onsubmit\
    \ = \"return validateForm()\">\nYour Name: <input type=\"text\" name = \"fullName\"\
    \ value=\"\" required/><br/><br/><\n<button type=\"submit\">Submit</button>\n\
    </form>\n</div>\n</body>\n</html>\n```\n\nSome `<input>` elements newly introduced\
    \ in HTML 5, for example color, date, datetime-local, email, month, number, range,\
    \ search, tel, time, url, week,. These elements have special attributes to help\
    \ the browser to know how to validate its data automatically. Below is list of\
    \ some such attributes:\n\n| Attribute | Description |\n| :--- | :--- |\n| disabled\
    \ | Specifies that the Input element should be disabled |\n| max | Specifies the\
    \ maximum value of an Input element |\n| min | Specifies the minimum value of\
    \ an Input element |\n| pattern | Specifies the value pattern of an Input element\
    \ |\n| required | Specifies that the Input field requires an element |\n| type\
    \ | Specifies the type of an Input element |\n\nExample: A `<input type=\"number\"\
    >` with `min`, `max` attributes, the browser will notify an user if he/she enters\
    \ a number beyond the allowed range.\n\n`attr-min-max-example.html`\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>Min Max Attributes</title>\n</head>\n\
