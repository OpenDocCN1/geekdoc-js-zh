    \ ------\");\nlet language = new Object();\nlanguage.greeting = function() {\n\
    \  return \"Hello Everybody\"\n}\nlet v2 = getGreeting(language);\nconsole.log(\"\
    Greeting: \" + v2);\n```\n\nRunning the example:\n\nOutput\n----- Call getGreeting(null)\
    \ -----Code in try block (*)Code in catch block. Something Error: TypeError: Cannot\
    \ read property 'greeting' of nullCode in finally blockGreeting: !!----- Call\
    \ getGreeting(language) -----Code in try block (*)Code in try block (**)Code in\
    \ finally blockGreeting: Hello Everybody\n\nThe following illustration is the\
    \ flow of program if an error occurs in the `try` block, the `finally` block is\
    \ always executed.\n\n![](OEBPS/image_rsrc8RT.jpg)\n\nThe following figure shows\
    \ the flow of the program when no errors occur in the `try` block. In this case\
    \ the `finally` block will be executed immediately before the `return` command\
    \ of the `try` block is executed.\n\n![](OEBPS/image_rsrc8RU.jpg)\n\n### 4. Built-in\
    \ Errors\n\n`ECMAScript` has several available classes to represent an error.\
    \ Below is their hierarchy.\n\n![](OEBPS/image_rsrc8RV.jpg)\n\n#### RangeError\n\
    A `RangeError` is thrown if you use a number outside the allowable range.\n\n\
    `error-RangeError-example.js`\n\n```javascript\nlet num = 1;\ntry {\n  // A number\
