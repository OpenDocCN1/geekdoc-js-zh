  trans: "\n\n```javascript\n// 从一个数组创建一个 Set\nvar fruits = new Set( [\"Apple\",\"\
    Banana\",\"Papaya\"] );\nconsole.log(fruits); // Set { 'Apple', 'Banana', 'Papaya'\
    \ }\n\n// Iterator 器对象:\nvar iteratorEntries = fruits.entries();\nvar entry;\n\
    while( !(entry = iteratorEntries.next() ).done )  {\n  console.log(entry.value);\
    \ // [ 'Apple', 'Apple' ]\n}\n```\n\n### has(value)\n\n该方法测试参数提供的值是否存在 Set 中。如果存在则返回\
    \ true，否则返回 false。\n\n`set-has-example.js`\n\n```javascript\n// 从一个数组创建一个 Set\n\
    var fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\nvar has = fruits.has(\"\
    Banana\");\nconsole.log(has); // true\n```\n\n### forEach(callbackFn[, thisArg])\n\
    \n该方法会为 Set 的每个元素调用一次 `callbackFn` 函数。\n\n```javascript\nmySet.forEach(callbackFn\
    \ [, thisArg])\n```\n\n#### 参数:\n\n- `callbackFn` - 该函数会对应 Set 对象的每个元素被调用一次。\n\
    - `thisArg` - 执行 `callbackFn` 函数时用作 `this` 的参数。\n\n`set-forEach-example.js`\n\n\
    ```javascript\n// 从一个数组创建一个 Set\nvar fruits = new Set( [\"Apple\",\"Banana\",\"\
    Papaya\"] );\nconsole.log(fruits); // Set { 'Apple', 'Banana', 'Papaya' }\nfunction\
    \ showFruit(fruit, thisSet) {\n  console.log(\"Fruit: \" + fruit);\n}\n// 或者调用：fruits.forEach(showFruit);\n\
    fruits.forEach(showFruit, fruits);\n```\n\n### key() & values()\n\n`key()` & `values()`\
    \ 方法返回一个新的迭代器，其每个元素的形状为 `{value: aValue, done: false}`。\n\n![](img/image_rsrc8TH.jpg)\n\
    \n`set-values-example.js`\n\n```javascript\n// 从一个数组创建一个 Set\nvar fruits = new\
    \ Set( [\"Apple\",\"Banana\",\"Papaya\"] );\nvar fruitIterator = fruits.values();\n\
    var entry;\nwhile ( !(entry = fruitIterator.next()).done)  {\n  console.log(entry);\
    \ // { value: 'Apple', done: false }\n  console.log(entry.value); // Apple\n}\n\
    ```\n\n#### 运行示例:\n\n输出\n\n```\n{ value: 'Apple', done: false }\nApple\n{ value:\
    \ 'Banana', done: false }\nBanana\n{ value: 'Papaya', done: false }\nPapaya\n\
    ```\n\n### mySet[Symbol.iterator]\n\n`Symbol.iterator` 是 `Set` 的特殊属性。默认情况下，`mySet[Symbol.iterator]`\
    \ 的值是 `mySet` 的 `values()` 方法。\n\n`set-symbol-iterator-example.js`\n\n```javascript\n\
    // 从一个数组创建一个 Set\nvar fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\n\
    // 等同于：fruits.values()\nvar fruitIterator = fruits[Symbol.iterator]();\nvar entry;\n\
    while ( !(entry = fruitIterator.next()).done)  {\n  console.log(entry); // { value:\
    \ 'Apple', done: false }\n  console.log(entry.value); // Apple\n}\n```\n\n## 3\
    \ WeakSet\n\n基本上，`WeakSet` 与 `Set` 非常相似，但它有以下区别：\n\n- `WeakSet` 的元素必须是对象，不能是原始类型。\n\
    - `WeakSet` 的元素可以在垃圾回收过程中被移除，垃圾回收是一个移除程序中不再使用的对象的独立过程。\n- `WeakSet` 不支持属性：`size`，因此你无法知道它有多少个元素。\n\
    - `Set` 类中可能提供的许多方法，在 `WeakSet` 中没有，例如 `values()`、`keys()`、`clear()` 等。\n\n####\
    \ 创建一个 WeakSet 对象。\n\n```javascript\nnew Set( [iterable] )\n```\n\n#### 参数:\n\n\
    - `iterable` - 如果将此对象传递给 `WeakSet` 构造函数，它的所有元素都将添加到添加到 `Set` 中。相反，如果你没有指定此参数，或者其值为\
    \ `null`，则创建的 `Set` 对象将是空的。\n\n#### 方法:\n\n`WeakSet` 方法的数量少于 `Set` 方法的数量：\n\n\
    - `WeakSet.add(element)`\n- `WeakSet.delete(element)`\n- `WeakSet.has(element)`\n\
    \n`WeakSet` 中的元素必须是对象，不能是原始类型。\n\n```javascript\nlet w = new WeakSet();\nw.add('a');\
    \ // TypeError: Invalid value used in weak set\nlet s = new Set();\ns.add('a');\
    \ // Works\n```\n\n`weakset-example.js`\n\n```javascript\nvar element1 = {}; //\
    \ 一个对象\nvar element2 = {foo: \"bar\"};\nvar element3 = {bar: \"foo\"};\nvar myWeakSet\
    \ = new WeakSet( [element1, element2] );\nmyWeakSet.add(element3);\nconsole.log(myWeakSet.has(element2));\
    \ // true\n```\n\n# 第 19 章：JavaScript Map 集合\n\n1 Collections - Map\n2 Map 方法\n\
    3 WeakMap\n\n## 1 Collections - Map\n\nECMAScript 6 引入了两个新的数据结构，如 `Map` & `Set`。它们是\
    \ `ECMAScript Collections Framework`的一部分。\n\n- `Maps` - 这种数据结构允许你存储“键/值”对。你可以通过键访问值，或者更新对应于键的新值。\n\
    - `Sets` - 这种数据结构存储元素列表，不允许重复且不对元素进行索引。\n\n### Map:\n\n一个 `Map` 对象存储“键/值”，其中键和值可以是原始类型或对象。\n\
    \n- 在 `Map` 对象中，键是可迭代的。\n- `Map` 是一个有序的数据类型，这意味着第一个添加的“键/值”对将排在前面，第二个对将排在后面。\n\
    \n![](img/image_rsrc8TJ.jpg)\n\n通过 `Map` 类的构造函数创建 Map 对象：\n\n```javascript\nnew\
    \ Map( [iteratorObject] )\n```\n\n#### 参数:\n\n- `iteratorObject` - 可迭代的对象。\n\n\
    `map-size-example.js`\n\n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"\
    0100-1111\", \"Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"\
    0100-2222\", \"Donald\");\nconsole.log(myContacts.size); // 3\n```\n\n### for..of\n\
    \n你可以使用 `for..of` 循环来遍历 `Map` 的键/值对。\n\n`map-for-of-loop-example.js`\n\n```javascript\n\
    // 创建一个 Map 对象。\nvar myContacts = new Map();\nmyContacts.set(\"0100-1111\", \"\
    Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"0100-2222\"\
    , \"Donald\");\nfor( let arr of myContacts)  {\n  console.log(arr);\n  console.log(\"\
    \ - Phone: \" + arr[0]);\n  console.log(\" - Name: \" + arr[1]);\n}\n```\n\n####\
    \ 运行示例:\n\n输出\n\n```\n[ '0100-1111', 'Tom' ]\n- Phone: 0100-1111\n- Name: Tom\n\
    [ '0100-5555', 'Jerry' ]\n- Phone: 0100-5555\n- Name: Jerry\n[ '0100-2222', 'Donald'\
    \ ]\n- Phone: 0100-2222\n- Name: Donald\n```\n\n## 2 Map 方法\n\n### set(key, value)\n\
    \n`set(key, value)` 方法如果 `Map` 中不存在该键，则会添加键/值对；如果已存在，则会更新该键的新值。\n\n`map-set-example.js`\n\
    \n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"0100-1111\", \"\
    Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"0100-2222\"\
    , \"Donald\");\nmyContacts.set(\"0100-1111\", \"Mickey\");\nconsole.log(myContacts.size);\
    \ // 4\n```\n\n#### 运行示例:\n\n输出\n\n```\nMap {'0100-1111' => 'Mickey', '0100-5555'\
    \ => 'Jerry', '0100-2222' => 'Donald'}\n```\n\n### delete(key)\n\n`delete(key)`\
    \ 方法从 `Map` 对象中删除一个键/值对；如果删除了该对则返回 true，如果该键不存在则返回 false。\n\n`map-delete-example.js`\n\
    \n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"0100-1111\", \"\
    Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"0100-2222\"\
    , \"Donald\");\nconsole.log(myContacts.delete(\"0100-5555\")); // true\nconsole.log(myContacts.delete(\"\
    0100-9999\")); // false\nconsole.log(myContacts.size); // 2\n```\n\n#### 运行示例:\n\
    \n输出\n\n```\ntrue\nfalse\nMap {'0100-1111' => 'Tom', '0100-2222' => 'Donald'}\n\
    ```\n\n### has(key)\n\n`has(key)` 方法测试键是否存在于 `Map` 中。如果存在则返回 true，否则返回 false。\n\
    \n`map-has-example.js`\n\n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"\
    0100-1111\", \"Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"\
    0100-2222\", \"Donald\");\nconsole.log(myContacts.has(\"0100-1111\")); // true\n\
    console.log(myContacts.has(\"0100-9999\")); // false\n```\n\n#### 运行示例:\n\n输出\n\
    \n```\ntrue\nfalse\n```\n\n### clear()\n\n`clear()` 方法从 `Map` 对象中移除所有的键/值对。\n\n\
    `map-clear-example.js`\n\n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"\
    0100-1111\", \"Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"\
    0100-2222\", \"Donald\");\nmyContacts.clear();\nconsole.log(myContacts.size);\
    \ // 0\n```\n\n#### 运行示例:\n\n输出\n\n```\n0\n```\n\n### size\n\n`size` 属性返回 `Map`\
    \ 中键/值对的数量。\n\n`map-size-example.js`\n\n```javascript\nvar myContacts = new Map();\n\
    myContacts.set(\"0100-1111\", \"Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\"\
    );\nmyContacts.set(\"0100-2222\", \"Donald\");\nconsole.log(myContacts.size);\
    \ // 3\n```\n\n#### 运行示例:\n\n输出\n\n```\n3\n```\n"
- fmt: "\n```javascript\nvar myContacts = new Map();\nmyContacts.set(\"0100-1111\"\
    , \"Tom\");\nmyContacts.set(\"0100-5555\", \"Jerry\");\nmyContacts.set(\"0100-2222\"\
    , \"Donald\");\nvar entries = myContacts.entries();\nvar entry;\nwhile( !(entry\
    \ = entries.next()).done ) {\n  var array = entry.value;\n  console.log(array);\
    \ // [ '0100-1111', 'Tom' ]\n}\n```\n\nRunning the example:\n\nOutput\n\n| [ '0100-1111',\
    \ 'Tom' ] [ '0100-5555', 'Jerry' ] [ '0100-2222', 'Donald' ] |\n\n### keys()\n\
    \nThis method returns a new `Iterator` object helping you access Map keys.\n\n\
