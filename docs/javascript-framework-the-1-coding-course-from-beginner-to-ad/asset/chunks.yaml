    4  Submit through Javascript


    Clicking <button type="submit"> or <input type="submit"> inside form helps you
    to send the data of this form to the server, however, you can also do it through
    Javascript.


    javascript-submit-example.html


    | <!DOCTYPE html><html><head><title>Javascript Submit</title><script type = "text/javascript">function
    validateForm() {var name = document.forms["myForm"]["fullName"].value;if(name
    == "") {alert("Please enter your name");return false;}return true;}function submitByJavascript()  {var
    valid = validateForm();if(!valid)  {return;}var myForm = document.forms["myForm"];myForm.submit();}</script></head><body><h2>Submit
    a from with Javascript</h2><div style="border:1px solid #ddd; padding: 5px;"><form
