    \n### 字符串是不可变的 (String is Immutable)\n\n在 JavaScript 中，`String` 数据类型是不可变的，这意味着对字符串执行的任何操作（如字符串拼接、字符串切割）都会在内存中创建一个新字符串，或者返回另一个字符串。\n\
