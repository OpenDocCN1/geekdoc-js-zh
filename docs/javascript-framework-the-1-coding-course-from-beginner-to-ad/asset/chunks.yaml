- fmt: "\nThe `focus` event occurs before `focusin`. In fact, they happen very close\
    \ to each other, which can be considered as occurring at the same time. Similarly,\
    \ the `blur` event occurs before `focusout`, i fact, they happen very close to\
    \ each other, which can be considered as occurring at the same time.\n\n### focus\n\
    \nThe `focus` event occurs when you are in other place and jumps into an element,\
    \ such as the `<input>` element to prepare to enter content for this element.\n\
    \n### blur\n\nThe `blur` event occurs when you jump out of an element (focus on\
    \ another element).\n\n### `focusevent-example.html`\n\n```html\n<!DOCTYPE html><html><head><title>FocusEvent</title><script>function\
    \ focusHandler(evt)  {showLog(\"focus\");}function blurHandler(evt)  {showLog(\"\
    blur\");}function showLog(msg)  {var oldHtml= document.getElementById(\"log-div\"\
    ).innerHTML;document.getElementById(\"log-div\").innerHTML=oldHtml + \" .. \"\
    + msg;}</script></head><body><h3>Test events: focus, blur</h3><input type=\"text\"\
    onfocus=\"focusHandler(event)\"onblur=\"blurHandler(event)\"  /><br><br><div id=\"\
    log-div\" style=\"padding:10px;border:1px solid #ccd;\"></div></body></html>\n\
    ```\n\n| ![](OEBPS/image_rsrc8US.jpg) |\n\n### 2 focusin, focusout\n\nThe `focus`,\
    \ `blur` events are designed for the elements are \"focusable\", for example,\
    \ `<input>`, `<textarea>`,.. While the `focusin`, `focusout` events are designed\
    \ for the elements that can contain other elements for example, `<div>`, `<span>`,\
    \ `<form>`,..\n\n#### focus vs focusin\n\n| ![](OEBPS/image_rsrc8UT.jpg) |\n\n\
    Suppose you have a `<form>` with 2 `<input>` child elements. When an user jumps\
    \ into one of the `<input>` elements then the `focus` event will occur. The `focus`\
    \ event at the child element will create the `focusin` event at the parent elements.\
    \ Thus this `focusin` event will occur at the `<form>` element.\n\nNote: Although\
    \ the `focusin` event occurs on the parent element, but `event.target` returns\
    \ the child element (The element that fires the focus event).\n\n#### blur vs\
    \ focusout\n\n| ![](OEBPS/image_rsrc8UU.jpg) |\n\nSuppose you have a `<form>`\
    \ with 2 `<input>` child elements. When an user jumps out of the `<input>` element,\
    \ the `blur` event will happen.The `blur` event at the child element will create\
    \ the `focusout` event at the parent elements. Thus this `focusout` event will\
    \ occur at the `<form>` element.\n\nNote: Although the `focusout` event occurs\
    \ on the parent element, but `event.target` returns the child element (The element\
    \ that fires the blur event).\n\n### Example: focusin & focusout\n\n### `focusin-focusout-example.html`\n\
    \n```html\n<!DOCTYPE html><html><head><title>FocusEvent</title><meta charset=\"\
    utf-8\" /><script src=\"focusin-focusout-example.js\"></script><style>form {border:\
    \ 1px solid #ccc;padding: 10px;display: inline-block;}</style></head><body><h3>Events:\
    \ focusin & focusout</h3><p>Focus to 'input' and Blur to it</p><form onfocusin=\"\
    focusinHandler(event)\" onfocusout=\"focusoutHandler(event)\">User Name<input\
    \ type=\"text\" name=\"username\" /><br><br> Email<input type=\"text\" name=\"\
    email\" /></form></body></html>\n```\n\n### `focusin-focusout-example.js`\n\n\
    ```javascript\nfunction focusinHandler(evt) { // <input>evt.target.style.border=\"\
    1px solid blue\";// <form>evt.target.parentElement.style.border=\"1px solid red\"\
    ;}function focusoutHandler(evt) { // <input>evt.target.style.border=\"1px solid\
    \ black\";// <form>evt.target.parentElement.style.border=\"1px solid black\";}\
    \ \n```\n\n| ![](OEBPS/image_rsrc8UV.jpg) |\n\n### Do you have problem with onfocusout\
    \ (???)\n\nFor the `<input>`, `<textarea>`,.. elements, you need only to handle\
    \ the `focus`, `blur` events. The `onfocusout` attribute doesn't work with this\
    \ element on some browsers (I have checked this problem on the Firefox, Chrome\
    \ browsers).\n\n### `attr-onfocusout-not-working.html`\n\n```html\n<!DOCTYPE html><html><head><title>FocusEvent</title><script>function\
    \ focusHandler(evt)  {showLog(\"focus\");}function focusinHandler(evt)  {showLog(\"\
    focusin\");}function focusoutHandler(evt)  {showLog(\"focusout\");}function blurHandler(evt)\
    \  {showLog(\"blur\");}function showLog(msg)  {var oldHtml= document.getElementById(\"\
    log-div\").innerHTML;document.getElementById(\"log-div\").innerHTML=oldHtml +\
    \ \" .. \"+ msg;}</script></head><body><h3>Why does the 'onfocusout' attribute\
    \ not work with 'input'?</h3><input type=\"text\"onfocus=\"focusHandler(event)\"\
    onblur=\"blurHandler(event)\"onfocusin=\"focusinHandler(event)\"onforcusout=\"\
    focusoutHandler(event)\" />br><br><div id=\"log-div\" style=\"padding:10px;border:1px\
    \ solid #ccd;\"></div></body></html>\n```\n\n| ![](OEBPS/image_rsrc8UW.jpg) |\n\
    \nAlthought the `onfocusout` attribute doesn't work with the `<input>`, `<textarea>`,..\
    \ elements on some browsers. But, if desiring, you can still register the `focusout`\
    \ event for them in the following way:\n\n```javascript\n// Javascript Code:\n\
    var myInput = document.getElementById(\"my-input\");\nmyInput.addEventListener(\"\
    focus\", focusHandler);\nmyInput.addEventListener(\"focusin\", focusinHandler);\n\
    myInput.addEventListener(\"focusout\", focusoutHandler);\nmyInput.addEventListener(\"\
    blur\", blurHandler);\n```\n\nSee full example:\n\n### `focusevents-addEventListener-example.html`\n\
    \n```html\n<!DOCTYPE html><html><head><title>FocusEvent</title><meta charset=\"\
    utf-8\"/></head><body><h3>Test events: focus, focusin, focusout, blur</h3><input\
    \ id=\"my-input\" type=\"text\" /><br><br><div id=\"log-div\" style=\"padding:10px;border:1px\
    \ solid #ccd;\"></div><script src=\"focusevents-addEventListener-example.js\"\
    ></script></body></html>\n```\n\n### `focusevents-addEventListener-example.js`\n\
    \n```javascript\nfunction focusHandler(evt)  {showLog(\"focus\");}function focusinHandler(evt)\
    \  {showLog(\"focusin\");}function focusoutHandler(evt)  {showLog(\"focusout\"\
    );}function blurHandler(evt)  {showLog(\"blur\");}function showLog(msg)  {var\
    \ oldHtml= document.getElementById(\"log-div\").innerHTML;document.getElementById(\"\
    log-div\").innerHTML=oldHtml + \" .. \"+ msg;}\n// Javascript Code:\nvar myInput\
    \ = document.getElementById(\"my-input\");\nmyInput.addEventListener(\"focus\"\
    , focusHandler);\nmyInput.addEventListener(\"focusin\", focusinHandler);\nmyInput.addEventListener(\"\
    focusout\", focusoutHandler);\nmyInput.addEventListener(\"blur\", blurHandler);\n\
    ```\n\n| ![](OEBPS/image_rsrc8UX.jpg) |\n\n# Chapter 28 : Javascript InputEvent\n\
    \n## 1 InputEvent\n\n### 1 InputEvent\n\n`InputEvent` is an interface that represents\
    \ events occurring when a user enters data on the editable elements such as `<input>`,\
    \ `<textarea>` or the elements with `contenteditable=\"true\"` attributes.\n\n\
    `InputEvent` is a sub-interface of `UIEvent`.\n\n| ![](OEBPS/image_rsrc8UY.jpg)\
    \ |\n\nEvents:\n\n| Event | Description |\n| :--- | :--- |\n| input | The event\
    \ occurs when an element gets user input |\n\nExample of elements that support\
    \ the input event:\n\n### `inputevents-elements-example.html`\n\n```html\n<!DOCTYPE\
    \ html><html><head><title>InputEvent Example</title><meta charset=\"UTF-8\"><style>*[contenteditable='true']\
    \   {height:30px;padding:5px;border:1px solid #ccd;}</style><script>// Note: event.data\
    \ is not supported in Firefox, IEfunction inputHandler(evt)  {showLog(evt.data);}function\
    \ showLog(text)  {var logDiv = document.getElementById(\"log-div\");logDiv.innerHTML\
    \ = logDiv.innerHTML + \" .. \" + text;}</script></head><body><h3>InputEvent example</h3><p\
    \ style=\"color:red\">Note: event.data is not supported in Firefox, IE</p><h3>Input\
    \ element</h3><input type=\"text\" oninput =\"inputHandler(event)\"/><h3>Textarea\
    \ element</h3><textarea oninput =\"inputHandler(event)\" rows=\"5\" cols=\"30\"\
    ></textarea><h3>Elements with contenteditable='true'</h3><div oninput =\"inputHandler(event)\"\
    \ contenteditable=\"true\"></div><p id=\"log-div\"></p></body></html>\n```\n\n\
    | ![](OEBPS/image_rsrc8UZ.jpg) |\n\n#### Events: input vs change\n\nYou also can\
    \ consider using the `change` event because it is quite similar to the `input`\
    \ event:\n\n*   The `change` event supports the `<select>` element. It occurs\
    \ when users change the option on `<select>`.\n*   For the `<input>` (text, number,\
    \ email, password, tel, time, week, month, date, datetime-local, search, url),\
    \ `<textarea>` elements: The `input` event occurs immediately after the value\
    \ of element changes. While the `change` event occurs when the value of element\
    \ changes and the element loses focus.\n\n## 2 Properties, Methods\n"
