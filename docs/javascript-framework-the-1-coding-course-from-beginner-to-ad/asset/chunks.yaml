    \n# Chapter 8: JavaScript Strings\n\n## ECMAScript String\n\nIn ECMAScript, `String`\
    \ is a special data type, because it is used frequently in a program, therefore,\
    \ it is required to have performance and flexibility. That's reason why the `String`\
    \ is both objective and primitive.\n\n### String Literal\n\nYou can create a string\
    \ literal. The string literal is stored in a stack, requiring less storage space,\
    \ and cheaper to manipulate.\n\n```javascript\nlet aStringLiteral = \"Hello World\"\
    ;\n```\n\nstring literals are contained in a Common Pool. When you declare two\
    \ `String Literal` variables with the same content, they will point to the same\
    \ address stored on the pool.\n\n|![](OEBPS/image_rsrc8R4.jpg)\n\nstring-literal-example.js\n\
    \n```javascript\nlet a = \"Tom\";\nlet b = \"Jerry\";\nlet c = \"Jerry\";\nconsole.log(a);\
    \ // Tom\nconsole.log(b); // Jerry\nconsole.log(c); // Jerry\n// a, b: Same address?\n\
    console.log( a === b); // false\n// b, c: Same address?\nconsole.log( b === c);\
    \ // true\n```\n\n### String Object\n\nYou can create a string through the constructor\
    \ of the `String` class. In this case, you will receive a `String` object.\n\n\
    ```javascript\nlet myStringObj = new String(value);\n```\n\n**Parameters:**\n\
    - `value`: A value to convert to string\n\nstring-object-example.js\n\n```javascript\n\
    let a = new String(\"Hello World\");\nconsole.log(a); // [String: 'Hello World']\n\
    let b = new String(true);\nconsole.log(b); // [String: 'true']\nlet c = new String(100.20);\n\
    console.log(c); // [String: '100.2']\n```\n\nThe `new` operator always creates\
    \ a new entity on the Heap memory, which explains why you have to spend more money\
    \ using `String` Objects.\n\n|![](OEBPS/image_rsrc8R5.jpg\n\nWhen you assign a\
    \ new value that is variable `aa` to variable `bb`. The variable `bb` will point\
    \ to the address on memory to which the variable `aa` is pointing. There will\
    \ not an entity created on memory in this case.\n\n|![](OEBPS/image_rsrc8R6.jpg\n\
    \n### String is Immutable\n\nIn JavaScript, the `String` data type is immutable,\
    \ which means that any action you do on the strings such as string concatenation,\
    \ string cutting, creates a new string on memory, or return another string.\n\n\
    |![](OEBPS/image_rsrc8R7.jpg\n\nThe `concat(string)` method is used to concatenate\
