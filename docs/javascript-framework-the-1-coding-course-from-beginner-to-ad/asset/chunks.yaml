  raw: 'Errors may occur in the runtime of the program. it may be an unexpected error.
    Use try-catch helps you catch and handle errors when they happen.


    Come back to the above example, we add try-catch to catch and handle errors.


    hello-catch-example.js


    | console.log("Three");let myObj = {};console.log("Two");console.log("One");try
    {// Object myObj has no showMe() method.// But we call showMe().// And error occur
    here.myObj.showMe(); // ==> Error!// This code will be ignoredconsole.log ("!!!");}
    catch (e) {console.log("Catched error: " + e);console.log("OK continue...");}console.log("Let''s
    go!"); |


    And the results of running the example:


    Output


    | ThreeTwoOneCatched error: TypeError: myObj.showMe is not a functionOK continue...Let''s
    go! |


    The following illustration explains the flow of the program:


    | ![](OEBPS/image_rsrc8RS.jpg) |


    *   The steps (1)-(4) are completely normal.


    *   An exception occurs in step (5), when you try to call a method of an object,
    while this object does not have this method.


    *   Immediately it jumps in to execute the command in the catch block. Step (6)
    is ignored.


    *   Steps (7), (8) will be executed.


    *   Step (9 will be executed.


    3  try-catch-finally


    We have got accustomed with catching error through try-catch block. try-catch-finally
    is used to fully handle error. The finally block is always executed, regardless
    of whether the error occurs in the try block or not.


    | try {// Do something here.} catch (e ) {// Do something here.} finally  {//
    The finally block is always executed.// Do something here.} |


    Example:


    try-catch-finally-example.js


    | function getGreeting(language) {try {console.log("Code in try block (*)");//
    Call greeting() method of object ''language''// An Exception can throw here if
    this object has no greeting() method.let v = language.greeting();console.log("Code
    in try block (**)");return v;} catch (e) {console.log("Code in catch block. Something
    Error: " + e);} finally {// The finally block is always executed.console.log("Code
    in finally block");}return " !! ";}// ----------------------- TEST ---------------------------------//
    Test 1:console.log("----- Call getGreeting(null) -----");let v1 = getGreeting(null);console.log("Greeting:
    " + v1); // Test 2:console.log("------ Call getGreeting(language) ------");let
    language = new Object();language.greeting = function() {return "Hello Everybody";}let
    v2 = getGreeting(language);console.log("Greeting: " + v2); |


    Running the example:


    Output


    | ----- Call getGreeting(null) -----Code in try block (*)Code in catch block.
    Something Error: TypeError: Cannot read property ''greeting'' of nullCode in finally
    blockGreeting: !!----- Call getGreeting(language) -----Code in try block (*)Code
    in try block (**)Code in finally blockGreeting: Hello Everybody |


    The following illustration is the flow of program if an error occurs in the try
    block, the finally block is always executed.


    | ![](OEBPS/image_rsrc8RT.jpg) |


    The following figure shows the flow of the program when no errors occur in the
    try block. In this case the finally block will be executed immediately before
    the return command of the try block is executed.


    | ![](OEBPS/image_rsrc8RU.jpg) |


    4  Built-in Errors


    ECMAScript has several available classes to represent an error. Below is their
    hierarchy.


    | ![](OEBPS/image_rsrc8RV.jpg) |


    RangeError


    A RangeError is thrown if you use a number outside the allowable range.


    error-RangeError-example.js


    | let num = 1;try {// A number cannot have 500 significant digitsnum.toPrecision(500);
    // ==> RangeError!!}catch(err) {console.log(err.name);console.log(err);} |


    ReferenceError


    A ReferenceError is thrown if you use a variable that has not been declared:


    error-ReferenceError-example.js


    | var x;try {x = y + 1;   // y cannot be referenced (used)}catch(err) {console.log("Error
    Name: "+ err.name);console.log(err);} |


    SyntaxError


    A SyntaxError is thrown if you try to evaluate code with a syntax error.


    error-SyntaxError-example.js


    | try {let x;eval(" x  = ''Hello  ");   // Missing '' will produce an error  try
    {let x;eval(" x  = ''Hello  ");   // Missing '' will produce an error}catch(err)
    {console.log("Error Name: " + err.name);console.log(err);}}catch(err) {console.log("Error
    Name: " + err.name);console.log(err);} |


    TypeError


    A TypeError is thrown if you use a value that is not of the expected type. For
    example, an error occurs when you call a method of an object, while this object
    does not have that method.


    error-TypeError-example.js


    | var num = 1;try {num.toUpperCase(); // Number has no method toUpperCase()}catch(err)
    {console.log("Error Name: " + err.name);console.log(err);} |


    URIError


    A URIError is thrown if you use illegal characters in a URI function:


    error-URIError-example.js


    | try {decodeURI("%%%");   // You cannot URI decode percent signs}catch(err) {console.log("Error
    Name: " + err.name);console.log(err);} |


    5  Throw Error


    ECMAScript allows you to throw anything in the runtime of the program. The program
    will consider an error has just happened.


    throw-any-example.js


    | console.log(" -------- Test throw any object ------------");try {let myObj =
    {};throw myObj;} catch(e)  {console.log("Catch error: ");console.log(e);}console.log("
    -------- Test throw a Symbol ------------");try {let mySymbol = Symbol();throw
    mySymbol;} catch(e)  {console.log("Catch error: ");console.log(e);}console.log("
    -------- Test throw a Number ------------");try {let myNumber = 100;throw myNumber;}
    catch(e)  {console.log("Catch error: ");console.log(e);}console.log(" --------
    Test throw a String ------------");try {let myString = "Some error";throw myString;}
    catch(e)  {console.log("Catched error: ");console.log(e);} |


    Output


    | -------- Test throw any object ------------Catch errorr:{}-------- Test throw
    a Symbol ------------Catch error:Symbol()-------- Test throw a Number ------------Catch
    error:100-------- Test throw a String ------------Catched error:Some error |


    Normally, you will use an Error class to create an error object. Other classes,
    such as SyntaxError, InternalError, RangeError, ReferenceError, SyntaxError, TypeError,
    URIError can also be used in a suitable context.


    An error object is created through the Error class (or its child classes). When
    being thrown, it will contain important information like the file where the error
    occurs, the location of the error, and the information helps you detect errors.


    throw-error-example.js


    | console.log("Three");// Create an Errorlet myError = new Error("Something error!");console.log("Two");//
    Throw it!throw myError;console.log("One"); |


    In the simple case, you can throw any object, not the object of the Error class
    (or its childclasses). However, when catching these types of errors, you will
    not have the information such as the file of the error, the location of the error,
    etc.


    throw-string-error-example.js


    | console.log("Three");try {console.log("Two");// Throw a String!throw "Some error!!";}
    catch(e)  {console.log("typeof e = " + (typeof e));// Log the errorconsole.log(e);
    // Some error!!}console.log("One"); |


    Output


    | ThreeTwotypeof e = stringSome error!!One |


    In the ECMAScript, each try block has a corresponding cache block. But there may
    be many types of errors in the try block, in which case you need to check the
