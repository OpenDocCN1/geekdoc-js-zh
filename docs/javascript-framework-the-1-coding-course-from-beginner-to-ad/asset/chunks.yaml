    # Inheritance


    ![](OEBPS/image_rsrc8TA.jpg)


    For ES3, you can simulate a class that inherits another class in many different
    ways, certainly, it''s not as easy as you do in ES6, and it''s quite confusing
    for many programmers.


    For simplicity, I give an example of inheritance, and analyze the operating rule
    of the Javascript runtime n this this case.


    * The `Animal` class has the 2 `name` & `gender` properties.

    * The `Cat` class inherits from the `Animal` class. It has 1 `color` property.


    ![](OEBPS/image_rsrc8TB.jpg)


    es3-inheritance-example1.js


    ```javascript

    function Animal(n, g) {this.name = n;this.gender = g;}function Cat(n, g, c) {Animal.call(this,
    n, g);this.color = c;}var tom = new Cat("Male", "Tom", "Black");// Cat { gender:
    ''Male'', name: ''Tom'', color: ''Black'' }console.log(tom);

    ```


    ![](OEBPS/image_rsrc8TC.jpg)


    # Inheritance and role of prototype (ES3)


    es3-inheritance-example2.js


    ```javascript

    // Class: Animal

    function Animal(n, g) {this.name = n;this.gender = g;}Animal.prototype.sleep =
    function()  {console.log("Animal sleeping..");}Animal.prototype.move = function()  {console.log("Animal
    moving..");}// Class: Cat

    function Cat(n, g, c) {Animal.call(this, n, g); // IMPORTANT!!this.color = c;}//
    IMPORTANT!!var TempFunc = function() {}; // Temporary class.TempFunc.prototype
    = Animal.prototype;Cat.prototype = new TempFunc();// ------------------Cat.prototype.cry
    = function()  {console.log("Meo meo");}// Override ''move'' method of Animal.Cat.prototype.move
    = function() {console.log("Cat moving..");}var tom = new Cat("Male", "Tom", "Black");//
    Cat { gender: ''Male'', name: ''Tom'', color: ''Black'' }console.log(tom);tom.move();
    // Cat moving..tom.sleep(); // Animal sleeping..tom.cry(); // Meo meo

    ```


    # 3 Class and Inheritance in ES5


    ## Object.create(srcObject)


    The `Object.create(srcObject)` method creates a new `newObject` object, in which
    `newObject.__proto__` is copy of `srcObject`.


    ![](OEBPS/image_rsrc8TD.jpg)


    method-object-create-example.js


    ```javascript

    var john = {name: "John",gender: "Male"};var other = Object.create(john);console.log(other.__proto__);
    // { name: ''John'', gender: ''Male'' }

    ```


    ## Inheritance (ES5 + Object.create)


    Using the `Object.create(srcObject)` method of ES5 helps you simulate class and
    inheritance more easily than ES3.


    es5-inheritance-example1.js


    ```javascript

    // Class: Animal

    function Animal(n, g) {this.name = n;this.gender = g;}Animal.prototype.sleep =
    function()  {console.log("Animal sleeping..");}Animal.prototype.move = function()  {console.log("Animal
    moving..");}// Class: Cat

    function Cat(n, g, c) {Animal.call(this, n, g); // IMPORTANT!!this.color = c;}Cat.prototype
    = Object.create(Animal.prototype); // IMPORTANT!!Cat.prototype.cry = function()  {console.log("Meo
    meo");}// Override ''move'' method of Animal.Cat.prototype.move = function() {console.log("Cat
    moving..");}var tom = new Cat("Male", "Tom", "Black");// Cat { gender: ''Male'',
    name: ''Tom'', color: ''Black'' }console.log(tom);tom.move(); // Cat moving..tom.sleep();
    // Animal sleeping..tom.cry(); // Meo meo

    ```


    # Chapter 17 : Inheritance and polymorphism


    1. Inheritance in ECMAScript

