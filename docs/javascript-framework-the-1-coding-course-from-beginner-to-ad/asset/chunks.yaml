    ## 2 if - else statement


    The `if-else` command is also used to check a condition. Uses the `Boolean(condition)`
    function to evaluate conditions. If the evaluation result is true, the `if` block
    will be executed. On the contrary, the `else` block will be executed.


    ```javascript

    if( condition ) { // Do something here}// Elseelse { Do something here}

    ```


    !![](OEBPS/image_rsrc8RH.jpg)


    **Example:**


    `if-else-example.js`

    ```javascript

    // Declare a variable, representing your agelet age = 15;console.log("Your age:
    " + age);// The condition to test is ''age> 18''if (age >= 18) {console.log("Okey!");console.log("You
    are accepted!");} else {console.log("Sorry!");console.log("Age is less than 18");}//
    The code after the ''if'' block and ''else'' block.console.log("Done!");

    ```

    **Output**

    | Your age: 15Sorry!Age is less than 18Done! |


    ## 3 if - else if - else statement


    The structure of an `if - else if - else` statement is:


    ```javascript

    if(condition 1) { // Do something here} else if(condition 2) {// Do something
    here} else if(condition 3) {// Do something here}// Elseelse { Do something here}

    ```


    !![](OEBPS/image_rsrc8RJ.jpg)


    `if-elseif-else-example.js`

    ```javascript

    // Declaring a varible// Represent your test scores.let score = 70;console.log("Your
    score =" + score);// If the score is less than 50if (score < 50) {console.log("You
    are not pass");}// Else if the score more than or equal to 50 and less than 80.else
    if (score >= 50 && score < 80) {console.log("You are pass");}// Remaining cases
    (that is greater than or equal to 80)else {console.log("You are pass, good student!");}

    ```

    **Output**

    | Your age: 15Sorry!Age is less than 18Done! |


    ## 4 Operators involved in conditional expression


    This is a list of operators, commonly used in conditional expressions.


    - `>` Greater Than

    - `<` Less Than

    - `>=` Greater Than or Equal To

    - `<=` Less Than or Equal To

    - `&&` AND

    - `||` OR

    - `==` HAS A VALUE OF

    - `!=` Not Equal To

    - `!` NOT


    **Example:**


    `if-elseif-else-example2.js`

    ```javascript

    // Declare a variable, represents your age.let age = 20;// Test if age less than
    or equal to 17if (age <= 17) {console.log("You are 17 or younger");// Test age
    equals 18else if (age == 18) {console.log("You are 18 year old");}// Test if age
    greater than 18 and less than 40else if (age > 18 && age < 40) {console.log("You
    are between 19 and 39");}// Remaining cases (Greater than or equal to 40)else
    {// Nested if statements// Test age not equals 50.if (age != 50) {console.log("You
    are not 50 year old");}// Negative statementsif (!(age == 50)) {console.log("You
    are not 50 year old");}// If age is 60 or 70if (age == 60 || age == 70) {console.log("You
    are 60 or 70 year old");}}

    ```

    **Output**

    | You are between 19 and 39 |


    # Chapter 10 : JavaScript Switch Statement


    ### 1 The structure of switch statement

    ### 2 `switch` Example

    ### 3 `break` statement in switch


    ## 1 The structure of switch statement


    Syntax


    ```javascript

    // variable_to_test: A varible to test.switch ( variable_to_test ) {case value1://
    Do something here ...break;case value2// Do something here ...break;default://
    Do something here ...}

    ```


    The characteristics of `switch` statement:


    The `switch` will check the value of a variable and compare that variable with
    each different value from top to bottom. Each value to be compared is called a
    `case`. When a `case` is true, the statement block of that case will be executed.


    !![](OEBPS/image_rsrc8RK.jpg)


    If all cases are false, the `default` statement block will be executed. Note:
    in the structure of the `switch` statement, there is probably or not a `default`
    statement block.


    !![](OEBPS/image_rsrc8RM.jpg)


    When finding a true case, the statement block of such case will be executed. If
    not meeting the `break` statement in this block, the program will continue performing
    the blocks below until it meets the `break` statement or no statement block is
    executed.


    The `break` statement makes the program exit the `switch`. (See the illustration
    below).


    !![](OEBPS/image_rsrc8RN.jpg)


    Note that the `case` statement is a specific value you can not do the following:


    ```javascript

    // This is not allowed !!case (age < 18) :// case only accept a specific value,
    eg:case 18:// Do something here ..break;

    ```


    ## 2 `switch` Example


    `switch-example.js`

    ```javascript

    // Declare a variable agelet age = 20;// Check the value of ageswitch (age) {//
    Case age = 18case 18:console.log("You are 18 year old");break;// Case age = 20case
    20:console.log("You are 20 year old");break;// Remaining casesdefault:console.log("You
    are not 18, 20 year old");}

    ```

    **Output**

    | You are 20 year old |


    ## 3 `break` statement in switch


    `break` means a statement to be able to appear in `case` block, or `default` block
    of `switch`. When meeting the `break` statement, the program will exit the `switch`.


    !![](OEBPS/image_rsrc8RP.jpg)


    When the program meets a `switch` statement, it will check cases from top to bottom.
    When finding a true case, the statement block of such case will be executed.


    **Example:**


    `switch-example2.js`

    ```javascript

    // Declare a variable agelet age = 30;// Check the value of ageswitch (age) {//
    Case age = 18case 18:console.log("You are 18 year old");break;// Case age = 30case
    30:console.log("You are 30 year old");break;// Remaining casesdefault:console.log("Other
    age");}

    ```

    **Output**

    | You are 30 year old |


