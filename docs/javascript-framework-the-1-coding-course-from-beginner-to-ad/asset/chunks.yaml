    ## Introduction


    Learning Javascript step by step. A developer''s resource to learning one of the
    most-used scripting languages. JavaScript Beginners saves you shelf space by offering
    a complete introduction to JavaScript and how it''s used in the real world. This
    book serves up JavaScript coding basics before diving into the libraries, frameworks,
    and runtime environments new and experienced coders need to know. Start by learning
    the basics of JavaScript—anyone can do it, even if you''ve never written code
    before. Then go into the details of today''s hottest frameworks—React.js, Vue.js,
    Svelte, and Node.js. Cozy up and learn some JavaScript!


    * Learn the basics of web and application development with the JavaScript language

    * Work with React, Vue, Svelte, Node.js, and the real-world tools that professionals
    use

    * Gain a highly marketable skill, with one of the most popular coding languages

    * Launch or further your career as a coder with easy-to-follow instruction


    This book will guide for future and current coders who need an all-inclusive guide
    JavaScript.


    ## Chapter 1 : Introduction


    ### Javascript Engine, JScript Engine

    `Javascript Engine` means a program that reads JavaScript code snippets written
    and executed by the programmers. They are also often known as Javascript Interpreter.
    This program is included in the browser like Firefox, Chrome, ... Most browsers
    use Javascript Engine. Only `IE` (Internet Explorer) uses `JScript Engine`.


    ### Javascript

    Javascript is a programming language. Javascript code snippets embedded in HTML
    help the website be able to interact with users.


    #### Write Javascript in HTMLThe

    The Javascript code can be written inside HTML, specifically it is written inside
    the `<script></script>` tag:


    | ![](OEBPS/image_rsrc8P8.jpg) |


    The `<script>` tags can be placed into the `<head>` tag or into the `<body>` tag.
    First of all, let''s look at a simple following example:


    Create a `helloworld.html` file with the content:


    `helloworld.html`

    ```html

    <!DOCTYPE html><html><head><title>Hello Javascript</title><script type = "text/javascript">function
    sayHello()  {alert("Hello Everyone!");}</script></head><body><button onclick="sayHello()">Click
    me!</button></body></html>

    ```


    In the `<script></script>` tag, I create the `sayHello()` function. When the user
    clicks Button, the `sayHello()` function is called, and it displays a dialog with
    "Hello Everyone!" content. Don''t worry if you don''t know what the function is,
    temporarily ignore that.


    | ![](OEBPS/image_rsrc8P9.jpg) |


    #### Write Javascript in a separate fileThe

    Write Javascript code in a separate file, and then HTML will import this file
    to use. This is the way that helps you manage your Javascript code better, and
    Javascript file can be shared for many HTML files. Javascript code is written
    in a file with extension such as `js`. The HTML files will import the aforesaid
    Javascript file to use.


    | ![](OEBPS/image_rsrc8PA.jpg) |


    ### Alert, Confirm, Prompt Dialog Box in Javascript

    1. Javascript Dialog Box

    2. Alert Dialog Box

    3. Confirmation Dialog Box

    4. Prompt Dialog BoxThe


    1. Javascript Dialog Box

    Javascript provides three important Dialog Boxes, which include Alert Dialog Box
    for users, Confirmation Dialog Box, and Prompt Dialog Box.


    2. Alert Dialog Box

    Alert Dialog Box is mainly used to display a notice, warning, or error to users.
    Basically, you cannot customize dialog box icon or title, ... you can only provide
    the message that the dialog box will display. In addition, Alert Dialog Box has
    only one OK button to close a dialog box.


    | ![](OEBPS/image_rsrc8PB.jpg) |

    | ![](OEBPS/image_rsrc8PC.jpg) |


    To display a Alert Dialog Box, you call the `alert(message)` function, in which
    the message is the content that the dialog box will display.


    `alert-example.js`

    ```html

    <!DOCTYPE html><html><head><title>Alert Dialog Box</title><script type="text/javascript">function
    testAlertDialog()  {alert("Something Error!");}</script></head><body><h2>Alert
    Dialog Box</h2><button onclick="testAlertDialog()">Click me!</button></body></html>

    ```


    | ![](OEBPS/image_rsrc8PD.jpg) |


    3. Confirmation Dialog Box

