  trans: "\n\n`focus` 事件发生在 `focusin` 之前。事实上，它们发生的时间非常接近，可以被看作是同时发生的。同样，`blur` 事件发生在\
    \ `focusout` 之前，事实上，它们发生的时间非常接近，可以被看作是同时发生的。\n\n### focus\n\n当你从其他地方跳转到某个元素时会触发\
    \ `focus` 事件，例如进入 `<input>` 元素准备为该元素输入内容。\n\n### blur\n\n`blur` 事件发生在你跳出一个元素（聚焦到另一个元素）时。\n\
    \n### `focusevent-example.html`\n\n```html\n<!DOCTYPE html><html><head><title>FocusEvent</title><script>function\
    \ focusHandler(evt)  {showLog(\"focus\");}function blurHandler(evt)  {showLog(\"\
    blur\");}function showLog(msg)  {var oldHtml= document.getElementById(\"log-div\"\
    ).innerHTML;document.getElementById(\"log-div\").innerHTML=oldHtml + \" .. \"\
    + msg;}</script></head><body><h3>Test events: focus, blur</h3><input type=\"text\"\
    onfocus=\"focusHandler(event)\"onblur=\"blurHandler(event)\"  /><br><br><div id=\"\
    log-div\" style=\"padding:10px;border:1px solid #ccd;\"></div></body></html>\n\
    ```\n\n| ![](img/image_rsrc8US.jpg) |\n\n### 2 focusin, focusout\n\n`focus`、`blur`\
    \ 事件为“可聚焦”的元素设计，例如 `<input>`、`<textarea>` 等。而 `focusin`、`focusout` 事件为可以包含其他元素的元素设计，例如\
    \ `<div>`、`<span>`、`<form>` 等。\n\n#### focus vs focusin\n\n| ![](img/image_rsrc8UT.jpg)\
    \ |\n\n假设有一个有一个 2 个 `<input>` 子元素的 `<form>`。当用户进入其中一个 `<input>` 元素时，会触发 `focus`\
    \ 事件。子元素上的 `focus` 事件会在父元素上创建一个 `focusin` 事件。因此，这个 `focusin` 事件会在 `<form>` 元素上发生。\n\
    \n注意：虽然 `focusin` 事件发生在父元素上，但 `event.target` 返回的是子元素（触发 focus 事件的元素）。\n\n####\
    \ blur vs focusout\n\n| ![](img/image_rsrc8UU.jpg) |\n\n假设你有一个 2 个 `<input>` 子元素的\
    \ `<form>`。当用户跳出一个 `<input>` 元素时，会触发 `blur` 事件。子元素上的 `blur` 事件会在父元素上创建一个 `focusout`\
    \ 事件。因此，这个 `focusout` 事件会在 `<form>` 元素上发生。\n\n注意：虽然 `focusout` 事件发生在父元素上，但 `event.target`\
    \ 返回的是子元素（触发 blur 事件的元素）。\n\n### 示例: focusin & focusout\n\n### `focusin-focusout-example.html`\n\
    \n```html\n<!DOCTYPE html><html><head><title>FocusEvent</title><meta charset=\"\
    utf-8\" /><script src=\"focusin-focusout-example.js\"></script><style>form {border:\
    \ 1px solid #ccc;padding: 10px;display: inline-block;}</style></head><body><h3>Events:\
    \ focusin & focusout</h3><p>Focus to 'input' and Blur to it</p><form onfocusin=\"\
    focusinHandler(event)\" onfocusout=\"focusoutHandler(event)\">User Name<input\
    \ type=\"text\" name=\"username\" /><br><br> Email<input type=\"text\" name=\"\
    email\" /></form></body></html>\n```\n\n### `focusin-focusout-example.js`\n\n\
    ```javascript\nfunction focusinHandler(evt) { // <input>evt.target.style.border=\"\
    1px solid blue\";// <form>evt.target.parentElement.style.border=\"1px solid red\"\
    ;}function focusoutHandler(evt) { // <input>evt.target.style.border=\"1px solid\
    \ black\";// <form>evt.target.parentElement.style.border=\"1px solid black\";}\
    \ \n```\n\n| ![](img/image_rsrc8UV.jpg) |\n\n### 你在 onfocusout 上遇到问题了吗（？？？））\n\
    \n对于 `<input>`、`<textarea>` 等元素，你只需要处理 `focus`、`blur` 事件。`onfocusout` 属性在某些浏览器上对这些元素无效（我在\
    \ Firefox 和 Chrome 浏览器上检查过这个问题）。\n\n### `attr-onfocusout-not-working.html`\n\n\
    ```html\n<!DOCTYPE html><html><head><title>FocusEvent</title><script>function\
    \ focusHandler(evt)  {showLog(\"focus\");}function focusinHandler(evt)  {showLog(\"\
    focusin\");}function focusoutHandler(evt)  {showLog(\"focusout\");}function blurHandler(evt)\
    \  {showLog(\"blur\");}function showLog(msg)  {var oldHtml= document.getElementById(\"\
    log-div\").innerHTML;document.getElementById(\"log-div\").innerHTML=oldHtml +\
    \ \" .. \"+ msg;}</script></head><body><h3>为什么 'onfocusout' 属性在 'input' 上不起？</h3><input\
    \ type=\"text\"onfocus=\"focusHandler(event)\"onblur=\"blurHandler(event)\"onfocusin=\"\
    focusinHandler(event)\"onforcusout=\"focusoutHandler(event)\" />br><br><div id=\"\
    log-div\" style=\"padding:10px;border:1px solid #ccd;\"></div></body></html>\n\
    ```\n\n| ![](img/image_rsrc8UW.jpg) |\n\n虽然 `onfocusout` 属性在某些浏览器上对 `<input>`、`<textarea>`\
    \ 等元素无效。但如果你需要，你仍然可以通过以下方式为它们注册 `focusout` 事件：\n\n```javascript\n// Javascript\
    \ 代码：\nvar myInput = document.getElementById(\"my-input\");\nmyInput.addEventListener(\"\
    focus\", focusHandler);\nmyInput.addEventListener(\"focusin\", focusinHandler);\n\
    myInput.addEventListener(\"focusout\", focusoutHandler);\nmyInput.addEventListener(\"\
    blur\", blurHandler);\n```\n\n查看完整示例：\n\n### `focusevents-addEventListener-example.html`\n\
    \n```html\n<!DOCTYPE html><html><head><title>FocusEvent</title><meta charset=\"\
    utf-8\"/></head><body><h3>Test events: focus, focusin, focusout, blur</h3><input\
    \ id=\"my-input\" type=\"text\" /><br><br><div id=\"log-div\" style=\"padding:10px;border:1px\
    \ solid #ccd;\"></div><script src=\"focusevents-addEventListener-example.js\"\
    ></script></body></html>\n```\n\n### `focusevents-addEventListener-example.js`\n\
    \n```javascript\nfunction focusHandler(evt)  {showLog(\"focus\");}function focusinHandler(evt)\
    \  {showLog(\"focusin\");}function focusoutHandler(evt)  {showLog(\"focusout\"\
    );}function blurHandler(evt)  {showLog(\"blur\");}function showLog(msg)  {var\
    \ oldHtml= document.getElementById(\"log-div\").innerHTML;document.getElementById(\"\
    log-div\").innerHTML=oldHtml + \" .. \"+ msg;}\n// Javascript 代码：\nvar myInput\
    \ = document.getElementById(\"my-input\");\nmyInput.addEventListener(\"focus\"\
    , focusHandler);\nmyInput.addEventListener(\"focusin\", focusinHandler);\nmyInput.addEventListener(\"\
    focusout\", focusoutHandler);\nmyInput.addEventListener(\"blur\", blurHandler);\n\
    ```\n\n| ![](img/image_rsrc8UX.jpg) |\n\n# 第 28 章：Javascript InputEvent\n\n##\
    \ 1 InputEvent\n\n### 1 InputEvent\n\n`InputEvent` 是一种表示用户在可编辑元素（如 `<input>`、`<textarea>`\
    \ 或具有 `contenteditable=\"true\"` 属性的元素）上输入数据的接口。\n\n`InputEvent` 是 `UIEvent` 的子接口。\n\
    \n| ![](img/image_rsrc8UY.jpg) |\n\n事件：\n\n| 事件 |  |\n| :--- | :--- |\n| input\
    \ | 当元素获取用户输入时发生 |\n\n支持 input 事件的元素示例：\n\n### `inputevents-elements-example.html`\n\
    \n```html\n<!DOCTYPE html><<html>><head><title>InputEvent 示例</title><meta charset=\"\
    UTF-8\"><style>*[contenteditable='true']   {height:30px;padding:5px;border:1px\
    \ solid #ccd;}</style><script>// 注意：event.data 在 Firefox 和 IE 中不支持 function inputHandler(evt)\
    \  {showLog(evt.data);}function showLog(text)  {var logDiv = document.getElementById(\"\
    log-div\");logDiv.innerHTML = logDiv.innerHTML + \" .. \" + text;}</script></head><body><h3>InputEvent\
    \ 示例</h3><p style=\"color:red\">注意：event.data 在 Firefox 和 IE 中不支持</p><h3>input\
    \ 元素</h3><input type=\"text\" oninput =\"inputHandler(event)\"/><<h3>Textarea\
    \ 元素</h3><textarea oninput =\"inputHandler(event)\" rows=\"5\" cols=\"30\"></textarea><h3>具有\
    \ contenteditable='true' 的元素</h3><div oninput =\"inputHandler(event)\" contenteditable=\"\
    true\"></div><p id=\"log-div\"></p></body></html>\n```\n\n| ![](img/image_rsrc8UZ.jpg)\
    \ |\n\n#### 事件：input vs change\n\n你也可以考虑使用 `change` 事件，因为它与 `input` 事件非常相似：\n\n\
    *   `change` 事件支持 `<select>` 元素。当用户更改 `<select>` 上的选项时发生。\n*   对于 `<input>` (text,\
    \ number, email, password, tel, time, week, month, date, datetime-local, search,\
    \ url)、`<textarea>` 元素：`input` 事件在元素值更改后立即发生。而 `change` 事件在元素值更改且元素失去焦点时发生。\n\n\
    ## 2 属性、方法\n\n"
- fmt: "\n`InputEvent` is the sub-interface of `UIEvent` so it inherits all methods\
    \ and properties from `UIEvent`. In addition, it has its own methods and properties.\n\
    \n### Properties\n\n| Property | Description |\n| :--- | :--- |\n| `data` | Returns\
    \ the inserted characters. This may be an empty string if the change doesn't insert\
    \ text (such as when deleting characters, for example). |\n| `dataTransfer` |\
    \ Returns a `DataTransfer` object containing information about richtext or plaintext\
    \ data being added to or removed from editable content. |\n| `inputType` | Returns\
    \ the type of change for editable content such as, for example, 'inserting', 'deleting',\
    \ 'formatting', ... |\n| `isComposing` | Returns true/false indicating if the\
    \ event is fired after `compositionstart` and before `compositionend`. |\n\n#\
    \ Chapter 29 : Javascript ChangeEvent\n\n## 1 ChangeChangeEvent\n\nThe `change`\
    \ event fires in the following situations:\n\n* Users check/uncheck on `<input\
    \ type=\"checkbox\">`.\n* Users make changes on `<input type=\"radio\">`.\n* Users\
    \ change the value of `<input>` (file, color, range).\n* Users change the contents\
    \ of `<input>` (text, number, email, password, tel, time, week, month, date, datetime-local,\
    \ search, url), then focus on other place.\n* Users change the contents of `<textarea>`,\
    \ then focus on other place.\n* Users change the option on the `<select>` element.\n\
    \n### Example with the change event:\n\n`changeevents-elements-example.html`\n\
    \n```html\n<!DOCTYPE html><<html><head><title>ChangeEvent Example</title><meta\
    \ charset=\"UTF-8\"><style>.title {font-weight:bold;}</style><script>function\
    \ changeHandler(evt)  {alert(\"Changed!\");}</script></head><body><h2>ChangeEvent\
    \ example</h2><p class=\"title\">Input (checkbox, radio):</p><input type=\"checkbox\"\
    \  onchange =\"changeHandler(event)\"/><input type=\"radio\" name =\"gender\"\
    \ value=\"M\" onchange =\"changeHandler(event)\"/><input type=\"radio\" name =\"\
    gender\" value=\"F\" onchange =\"changeHandler(event)\"/><p class=\"title\">Input\
    \ (range):</p><input type=\"range\" min =\"1\" max=\"10\" onchange =\"changeHandler(event)\"\
    /><p class=\"title\">Input (color):</p><input type=\"color\" onchange =\"changeHandler(event)\"\
    /><p class=\"title\">Input (file):</p><input type=\"file\" onchange =\"changeHandler(event)\"\
    /><p class=\"title\">Input (image, hidden, buton, submit, reset):</p>- (Not support\
    \ 'change' event)<p class=\"title\">Input (text, number, email, password, tel,\
    \ time, week, month, date, datetime-local, search, url):</p><input type=\"text\"\
    \ onchange =\"changeHandler(event)\"/><p class=\"title\">Textarea element</p><textarea\
    \ onchange =\"changeHandler(event)\" rows=\"3\" cols=\"30\"></textarea><p class=\"\
    title\">Select:</p><select onchange =\"changeHandler(event)\"><option value =\"\
    en\">English</option><option value =\"de\">German</option><option value =\"vi\"\
    >Vietnamese</option></select><p id=\"log-div\"></p></body></html>\n```\n\n| ![](OEBPS/image_rsrc8V0.jpg)\
    \ |\n\n### Example with the change event on the <select> element:\n\n`changeevents-select-example.html`\n\
    \n```html\n<!DOCTYPE html><<html><head><title>ChangeEvent Example</title><meta\
    \ charset=\"UTF-8\"><script>function changeHandler(evt)  {alert(\"Language: \"\
    \ + evt.target.value);}</script></head><body><h2>ChangeEvent example</h2><p class=\"\
    title\">Select Language:</p><select onchange =\"changeHandler(event)\"><option\
    \ value =\"en\">English</option><option value =\"de\">German</option><option value\
    \ =\"vi\">Vietnamese</option></select></body></html>\n```\n\n| ![](OEBPS/image_rsrc8V1.jpg)\
    \ |\n\n# Chapter 30 : Javascript DragEvent\n\n## 1 DragEvent\n\n`DragEvent` is\
    \ an interface that represents events occurring during drag & drop of an object\
    \ from one place to another. An user initiates a drag by putting a pointer device\
    \ (such as a mouse) on the surface of an object, press down, and move the pointer\
    \ device to another place, then release the pointer device, to drop the object\
    \ into a new location.\n\n| ![](OEBPS/image_rsrc8V2.jpg) |\n\n| ![](OEBPS/image_rsrc8V3.jpg)\
    \ |\n\n`DragEvent` is a sub-interface of `MouseEvent`, therefore, it inherits\
    \ all the properties and methods of `MouseEvent`.\n\n| ![](OEBPS/image_rsrc8V4.jpg)\
    \ |\n\nBelow is the list of the types of events that will occur during drag and\
    \ drop\n\n| Event | Element Type | Description |\n| :--- | :--- | :--- |\n| `dragstart`\
    \ | Dragged Element | The event occurs when the user starts to drag an element\
    \ |\n| `drag` | Dragged Element | The event occurs when an element is being dragged\
    \ |\n| `dragend` | Dragged Element | The event occurs when the user has finished\
    \ dragging an element |\n| `dragenter` | Drop Target | The event occurs when the\
    \ dragged element enters the drop target |\n| `dragover` | Drop Target | The event\
    \ occurs when the dragged element is over the drop target |\n| `drleave` | Drop\
    \ Target | The event occurs when the dragged element leaves the drop target |\n\
    | `drop` | Drop Target | The event occurs when the dragged element is dropped\
    \ on the drop target |\n\n| ![](OEBPS/image_rsrc8V5.jpg) |\n\n| Property | Description\
    \ |\n| :--- | :--- |\n| `dataTransfer` | Returns the data that is dragged/dropped\
    \ |\n\nSee a simple example:\n\n| ![](OEBPS/image_rsrc8V6.jpg) |\n\n`dragevents-example.html`\n\
    \n```html\n<!DOCTYPE html><<html><head><title>DragEvent Example</title><script\
    \ src=\"dragevents-example.js\"></script><style>.droptarget-div {float: left;width:\
    \ 100px;height: 55px;margin: 25px 25px 5px 5px;padding: 10px;border: 1px solid\
    \ black;}#dragtarget-div {background: #eee;padding: 5px;}</style></head><body><h3>DragEvent\
    \ example</h3><p id=\"log-div\">..</p><!-- Drop Target 1 --><div class=\"droptarget-div\"\
    ondragenter= \"ondragenterHandler(event)\"ondragover=\"dragoverHandler(event)\"\
    ondrop=\"dropHandler(event)\"><p id=\"dragtarget-div\"ondragstart=\"dragstartHandler(event)\"\
    ondrag=\"dragHandler(event)\"draggable=\"true\">Drag me!</p></div><!-- Drop Target\
    \ 2 --><div class=\"droptarget-div\"ondragenter= \"ondragenterHandler(event)\"\
    ondragover=\"dragoverHandler(event)\"ondrop=\"dropHandler(event)\"></div></body></html>\n\
    ```\n\n`dragevents-example.js`\n\n```javascript\n// --------- Handlers for 'Dragged\
    \ Element' ------------------\nfunction dragstartHandler(evt) {\n  evt.dataTransfer.setData(\"\
    MyDraggedId\", evt.target.id);\n}\n// dragging ...\nfunction dragHandler(evt)\
    \ {\n  showLog(\"The p element is being dragged\");\n}\n// --------- Handlers\
    \ for 'Drop Target' ------------------\nfunction ondragenterHandler()  \n  showLog(\"\
    The p element enter drop-target\");\n}\n// When 'over' you can 'release mouse'\
    \ to 'drop'.\nfunction dragoverHandler(evt) {\n  evt.preventDefault(); // Important!!\n\
    }\nfunction dropHandler(evt) {\n  evt.preventDefault(); // Important!!\n  var\
    \ elementId = evt.dataTransfer.getData(\"MyDraggedId\");\n  evt.target.appendChild(document.getElementById(elementId));\n\
    \  showLog(\"The p element was dropped\");\n}\n// -------------------------------------------------------\n\
    function showLog(text)  \n  document.getElementById(\"log-div\").innerHTML = text;\n\
    }\n```\n\nFor example, users drag files on their computer and drop into a `<div>`\
    \ element, you can read the basic information, and the content of the files that\
    \ the user has dropped.\n\nWhen the `drop` event occurs, `event.dataTransfer.files`\
    \ returns a `FileList` object, which contains a list of `File` objects.\n\n| ![](OEBPS/image_rsrc8V7.jpg)\
    \ |\n\n# Chapter 31 : Javascript HashChangeEvent\n\n## 1 HashChangeEvent\n\nHash\
    \ is \"Anchor part\" of an URL. It tells the browser to scroll the browser scrollbar\
    \ to display the content area corresponding to Hash.\n\n| ![](OEBPS/image_rsrc8V8.jpg)\
    \ |\n\n`hash-example.html`\n"
