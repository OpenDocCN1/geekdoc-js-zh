    \ Running the example:\n\nOutput\n\n```\n{ value: 'Apple', done: false }\nApple\n\
    { value: 'Banana', done: false }\nBanana\n{ value: 'Papaya', done: false }\nPapaya\n\
    ```\n\n### mySet[Symbol.iterator]\n\n`Symbol.iterator` is a special property of\
    \ `Set`. By default, the value of `mySet[Symbol.iterator]` is the `values()` method\
    \ of `mySet`.\n\n`set-symbol-iterator-example.js`\n\n```javascript\n// Create\
    \ a Set from an Array\nvar fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"\
    ] );\n// Same as: fruits.values()\nvar fruitIterator = fruits[Symbol.iterator]();\n\
    var entry;\nwhile ( !(entry = fruitIterator.next()).done)  {\n  console.log(entry);\
    \ // { value: 'Apple', done: false }\n  console.log(entry.value); // Apple\n}\n\
    ```\n\n## 3 WeakSet\n\nBasically, the `WeakSet` is quite the same as `Set`, but\
    \ it has the following differences:\n\n- The `WeakSet` elements have to be objects,\
    \ they can not be a primitive type.\n- The `WeakSet` elements can be removed in\
    \ the process of Garbage collection, which is an independent process to remove\
    \ the objects no longer used in the program.\n- `WeakSet` doesn't support property:\
    \ `size`, therefore, you can not know how many elements it has.\n- Many methods\
    \ may be available in `Set` class but have no `WeakSet`, for example, `values()`,\
    \ `keys()`, `clear()`,..\n\n#### Create a WeakSet object.\n\n```javascript\nnew\
    \ Set( [iterable] )\n```\n\n#### Parameters:\n\n- `iterable` - If this object\
    \ is passed to the constructor of the `WeakSet`, all its elements will be added\
    \ to the `Set`. On the contrary, if you don't specify this parameter, or its value\
    \ is `null`, the `Set` object created will be empty.\n\n#### Methods:\n\nThe quantity\
    \ of `WeakSet` methods is less than the quantity of `Set` methods:\n\n- `WeakSet.add(element)`\n\
    - `WeakSet.delete(element)`\n- `WeakSet.has(element)`\n\nThe elements in the `WeakSet`\
    \ have to be objects, they can not be primitive types.\n\n```javascript\nlet w\
