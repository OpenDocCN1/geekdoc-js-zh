    Chapter 21 :


    Javascript Menubar


    1  window.menubar


    The window.menubar property returns a Menubar object representing the menu bar
    on browser. However, you can hardly interact with Menubar through Javascript because
    it has very few APIs for you.


    | window.menubar// Or simple:menubar |


    The tendency of modern browsers is to make the Viewport window as wide as possible,
    therefore, they remove other components like Statusbar, or made Menubar smaller.


    menubar.visible


    The menubar.visible property returns true if menu bar is displayed on browser.
    On the contrary, it returns false.


    Note: For modern browsers, you can set new values for menubar.visible. If you
    do it on purpose, it doesn''t work.


