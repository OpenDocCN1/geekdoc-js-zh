    Chapter 30 :


    Javascript DragEvent


    1  DragEvent


    DragEvent is an interface that represents events occurring during drag & drop
    of an object from one place to another. An user initiates a drag by putting a
    pointer device (such as a mouse) on the surface of an object, press down, and
    move the pointer device to another place, then release the pointer device, to
    drop the object into a new location.


    | ![](OEBPS/image_rsrc8V2.jpg) |


    | ![](OEBPS/image_rsrc8V3.jpg) |


    DragEvent is a sub-interface of MouseEvent, therefore, it inherits all the properties
    and methods of MouseEvent.


    | ![](OEBPS/image_rsrc8V4.jpg) |


    Below is the list of the types of events that will occur during drag and drop


    | Event | Element Type | Description |


    | dragstart | Dragged Element | The event occurs when the user starts to drag
    an element |


    | drag | Dragged Element | The event occurs when an element is being dragged |


    | dragend | Dragged Element | The event occurs when the user has finished dragging
    an element |


    | dragenter | Drop Target | The event occurs when the dragged element enters the
    drop target |


    | dragover | Drop Target | The event occurs when the dragged element is over the
    drop target |


    | dragleave | Drop Target | The event occurs when the dragged element leaves the
    drop target |


    | drop | Drop Target | The event occurs when the dragged element is dropped on
    the drop target |


    | ![](OEBPS/image_rsrc8V5.jpg) |


    | Property | Description |


    | dataTransfer | Returns the data that is dragged/dropped |


    See a simple example:


    | ![](OEBPS/image_rsrc8V6.jpg) |


