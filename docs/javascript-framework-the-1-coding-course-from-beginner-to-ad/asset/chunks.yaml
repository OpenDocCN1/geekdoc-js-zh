    # 第 22 章：JavaScript JSON


    ## 1. 什么是 JSON

    ## 2. `JSON.parse(..)`

    ## 3. `JSON.stringify(..)`


    ### 1 什么是 JSON


    如你所知，数据始终通过互联网环境从一台计算机传输到另一台计算机，并在发送之前封装成特定的格式。接收者必须理解这种格式才能分析原始数据。


    `XML` 是一种非常常用的存储和传输数据的格式。


    | ![](img/image_rsrc8TW.jpg) |


    JSON 代表 JavaScript 对象表示法（JavaScript Object Notation）。它也是一种存储和传输数据的格式。JSON 格式源于
    JavaScript 的对象语法，因此它继承了简单性，并且完全基于文本。


    | ![](img/image_rsrc8TX.jpg) |


    下面是一个在 Javascript 中声明对象的代码片段：


    #### Javascript 对象

    ```javascript

    var aCompany = {name : "Amazon",ceo : "Jeff Bezos",employees: [{firstName: "John",
    lastName: "Doe"},{firstName: "Anna", lastName: "Smith"},{firstName: "Peter", lastName:
    "Jones"}]};

    ```


    以及以 JSON 格式存储的相同数据：


    #### JSON 数据

    ```json

    {"name" : "Amazon","ceo" : "Jeff Bezos","employees":[{"firstName":"John", "lastName":"Doe"},{"firstName":"Anna",
    "lastName":"Smith"},{"firstName":"Peter", "lastName":"Jones"}]}

    ```


    #### JSON 的优点：


    * JSON 是一种轻量级的数据交换格式。

    * JSON 数据自包含描述，因此每个人都能轻松理解。

    * JSON 是一种独立的语言，也是一种文本。你可以使用任何语言来读取或创建 JSON 数据。大多数编程语言都有用于读写 JSON 库。


    #### 示例：

    ```javascript

    // JSON 对象:{"firstName":"John", "lastName":"Doe"}

    // JSON 数组:[{"firstName":"John", "lastName":"Doe"},{"firstName":"Anna", "lastName":"Smith"},{"firstName":"Peter",
    "lastName":"Jones"}]

    ```


    #### Note：：


    JSON 纯粹是一种数据格式——它只包含属性，不包含方法。


    JSON 要求在字符串和属性名周围使用双引号。单引号是无效的。


    即使是一个位置放置错误的逗号或冒号，也可能导致 JSON 文件出错并无法工作。你应该仔细地验证你正尝试使用的任何数据。


    ### 2 `JSON.parse(..)`


    使用 `JSON.parse(text)` 方法可以帮你解析 JSON 数据并将其转换为对象。


    `json-parse-example.js`

    ```javascript

    var text = ''{ ''+ '' "name": "Amazon", ''+ '' "ceo" : "Jeff Bezos", ''+ '' "employees"
    : [''+ ''    { "firstName":"John" , "lastName":"Doe" },''+ ''    { "firstName":"Anna"
    , "lastName":"Smith" },''+ ''    { "firstName":"Peter" , "lastName":"Jones" }
    ''+ ''  ] ''+ ''}'';

    var obj = JSON.parse(text);

    console.log(obj.employees);

    console.log(obj.ceo); // Jeff Bezos

    console.log(obj.employees[0].firstName); // John

    console.log(obj.employees[1].firstName); // Anna

    console.log(obj.employees[2].firstName); // Peter

    ```


    | ![](img/image_rsrc8TY.jpg) |


    `json-parse-example.html`

    ```html

    <!DOCTYPE html><html><head><title>JSON.parse</title></head><body><div style="border:1px
    solid #ccc;padding:5px;"><h3 id="name"></h3><i id="location"></i></div><script>var
    s = ''{"firstName" : "Sammy", "lastName" : "Shark", "location" : "Ocean"}'';var
    obj = JSON.parse(s);document.getElementById("name").innerHTML = obj.firstName
    + " " + obj.lastName;document.getElementById("location").innerHTML = obj.location;</script></body></html>

    ```

    | ![](img/image_rsrc8TZ.jpg) |


    ### 3 `JSON.stringify(..)`


    使用 `JSON.stringify(obj)` 方法可以帮你将 Javascript 对象转换为 JSON 格式的文本。


    `json-stringify-example1.js`

    ```javascript

    var obj = {name : "tran", age : 39};

    var text = JSON.stringify(obj);

    console.log(text); // {"name":"tran","age":39}

    ```


    #### `JSON.stringify(obj)`


    `JSON.stringify(obj)` 方法用于将 `obj` 转换为 `String`。如果 `obj` 对象具有 `toJSON()` 方法，将调用该方法来返回
    `String`。相反，它将按照默认规则进行转换：


    * 数字、布尔、字符串将转换为原始值。

    * `Infinity`、`NaN` 将转换为 `null`。

    * 如果 `obj` 是 `undefined`、`Function`、`Symbol`，它将转换为 `undefined`。

    * 如果对象中出现 `undefined`、`Function`、`Symbol`，它们将被跳过。

    * 如果数组中出现 `undefined`、`Function`、`Symbol`，它们将被转换为 `null`。

    * 所有具有如 `Symbol` 等键的属性将被跳过。

    * `Date` 对象具有 `toJSON()` 方法，返回的是字符串（例如 `date.toISOString()`），因此它被处理为字符串。


    `json-stringify-example2.js`

    ```javascript

    var obj = {name : "tran",age : 39,//对象中的函数会被忽略

    sayHello : function()  {console.log("Hello");},//数组中的 undefined, Symbol, function
    将转换为 null.""others": ["1", Symbol(), undefined, function(){}, "2"]};

    var text = JSON.stringify(obj);

    console.log(text); // {"name":"tran","age":39,"others":["1",null,null,null,"2"]}

    ```


    #### 示例：


    `json-stringify-example.js`

    ```javascript

    JSON.stringify({});                   // ''{}''

    JSON.stringify(true);                // ''true''

    JSON.stringify(''foo'');               // ''"foo"''

    JSON.stringify([1, ''false'', false]);    // ''[1,"false",false]''

    JSON.stringify([NaN, null, Infinity]); // ''[null,null,null]''

    ```


