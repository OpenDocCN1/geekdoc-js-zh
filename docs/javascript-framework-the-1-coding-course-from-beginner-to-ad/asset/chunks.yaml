    \ = [[\"0100-1111\", \"Tom\"],[\"0100-5555\", \"Jerry\"],[\"0100-2222\", \"Donald\"\
    ]];\nvar myContacts = new Map(data);\nvar iteratorPhones= myContacts.keys();\n\
    var entry;\nwhile( !(entry = iteratorPhones.next()).done ) {\n  var phone = entry.value;\n\
    \  console.log(phone); // 0100-1111\n}\n```\n\nRunning the example:\n\nOutput\n\
    \n| 0100-11110100-55550100-2222 |\n\n### values()\n\nThis method returns a new\
    \ `Iterator` object helping you access Map values.\n\n![](OEBPS/image_rsrc8TN.jpg)\n\
    \nmap-values-example.js\n\n```javascript\nvar data = [[\"0100-1111\", \"Tom\"\
    ],[\"0100-5555\", \"Jerry\"],[\"0100-2222\", \"Donald\"]];\nvar myContacts = new\
    \ Map(data);\nvar iteratorNames = myContacts.values();\nvar entry;\nwhile( !(entry\
    \ = iteratorNames.next()).done ) {\n  var name = entry.value;\n  console.log(name);\
    \ // Tom\n}\n```\n\n### forEach(callbackFn [, thisArg])\n\nThis method will call\
    \ the `callbackFn` function one time corresponding to each \"Key/Value\" pair\
    \ of the Map object.\n\n```javascript\nmyMap.forEach(callback[, thisArg])\n```\n\
    \nParameters:\n\n- `callbackFn` - This function will be called one time corresponding\
    \ to each \"Key/Value\" pair of the Map object.\n- `thisArg` - The parameter is\
    \ used like this when executing `callbackFn`.\n\nmap-forEach-example.js\n\n```javascript\n\
    var showContact = function(key, value, thisMap) {\n  console.log(\"Phone: \" +\
    \ key +\". Name: \" + value);\n}\nvar data = [[\"0100-1111\", \"Tom\"],[\"0100-5555\"\
    , \"Jerry\"],[\"0100-2222\", \"Donald\"]];\nvar myContacts = new Map(data);\n\
    // or call: myContacts.forEach(showContact)\nmyContacts.forEach(showContact, myContacts);\n\
    ```\n\nRunning the example:\n\nOutput\n\n| Phone: 0100-1111\\. Name: TomPhone:\
    \ 0100-5555\\. Name: JerryPhone: 0100-2222\\. Name: Donald |\n\n## 3 WeakMap\n\
    \nBasically, the `WeakMap` is quite the same as `Map`, but it has the following\
    \ differences:\n\n- Its keys have to be objects\n- The keys of `WeakMap` can be\
    \ eliminated in the garbage collection process, which is an independent process\
    \ to remove objects that are no longer used in the program.\n- `WeakMap` doesn't\
    \ support property: `size`, therefore, you can not how many elements it has.\n\
    - Many methods may be available in the `Map` class but there is no `WeakMap` class,\
    \ for example, `values()`, `keys()`, `entries()`, `clear()`,..\n\nCreate a `WeakMap`\
    \ object.\n\n```javascript\nvar map2 = new WeakMap( [iteratorObject] )\n```\n\n\
    Parameters:\n\n- `iteratorObject` - any object which is iterable.\n\nMethods:\n\
    \nThe quantity of `WeakMap` methods is less than the quantity of the `Map` methods:\n\
    \n- `WeakMap.delete(key)`\n- `WeakMap.get(key)`\n- `WeakMap.has(key)`\n- `WeakMap.set(key,\
    \ value)`\n\nThe keys in the `WeakMap` have to be an object. It can not be a Primitive\
    \ type.\n\n```javascript\nlet w = new WeakMap();\nw.set('a', 'b'); // Uncaught\
    \ TypeError: Invalid value used as weak map key\nlet m = new Map();\nm.set('a',\
    \ 'b'); // Works\n```\n\nweakmap-example.js\n\n```javascript\nvar key1 = {}; //\
    \ An Object\nvar key2 = {foo: \"bar\"};\nvar key3 = {bar: \"foo\"};\nvar data\
    \ = [[key1, \"Tom\"],[key2, \"Jerry\"],[key3, \"Donald\"]];\nvar myWeakMap = new\
    \ WeakMap(data);\nconsole.log(myWeakMap.get(key1));\n```\n\n## Chapter 20: Understanding\
    \ JavaScript Iterables and Iterators\n\n### 1 Iteration\n### 2 Concept of Iterator\n\
    ### 3 Concept of Iterable\n\n#### 1 Iteration\n\nECMAScript 6 provides you with\
    \ a new way to interact with data structure, which is Iteration. Now, we will\
    \ clarify it.\n\nThere are two concepts that you need to distinguish:\n\n- `Iterator`\n\
    - `Iterable`\n\n#### 2 Concept of Iterator\n\n`Iterator`: An object called `Iterator`\
    \ if it contains a pointer to next element in Iteration.\n\nTechnically, an object\
    \ in ECMAScript is called an `Iterator` if it has a method with the `next()` name,\
    \ and this method returns an object with the form `{value:SomeValue,done:booleanValue}`.\
    \ `done` has true value if the Iteration has been completed, otherwise it has\
    \ false value.\n\n![](OEBPS/image_rsrc8TP.jpg)\n\niterator-object-example.js\n\
    \n```javascript\n// An Iterator Object:\nlet myIterator = {\n  someProp: \"Some\
    \ Prop\",\n  next : function() {\n    return {value: \"Tom\",done: false}\n  }\n\
    }\n// ----------- TEST -------------------\nlet entry = myIterator.next();\nconsole.log(entry);\
    \ // { value: 'Tom', done: false }\nconsole.log(entry.value); // Tom\n```\n\n\
    #### 3 Concept of Iterable\n\n`Iterable` - In terms of language, an object is\
    \ called `Iterable` if it contains a collection of data, and provides a way to\
    \ publicize its data. For example, an array can be called `Iterable` because it\
    \ contains a collection of data.\n\nTechnically, an object in ECMAScript called\
    \ `Iterable` must have a `Symbol.iterator` key, and this method returns an `Iterator`\
    \ object.\n\nobject-with-properties.js\n\n```javascript\n// An Object\nlet myObject\
    \ = {\n  prop1 : \"Some Value 1\", // A property\n  prop2 : \"Some Value 2\",\
    \ // A property\n  prop3 : \"One hundred\", // A property\n  [Symbol.iterator]\
    \ : function() {\n    console.log(\"I'm iterator\");\n    return {\n      next\
    \ : function() {\n        return {value: \"some value\",done: true};\n      }\n\
    \    }\n  }\n}\n```\n\nWait, the provided text for `Iterable` was garbled. Let's\
