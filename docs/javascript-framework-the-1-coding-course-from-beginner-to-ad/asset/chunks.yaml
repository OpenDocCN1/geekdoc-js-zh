  trans: "\n\n`InputEvent` 是 `UIEvent` 的子接口，因此它继承了 `UIEvent` 的所有方法和属性。此外，它还有自己的方法和属性。\n\
    \n### 属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `data` | 返回插入的字符。如果更改没有插入文本（例如删除字符时），则该可能为空字符串。\
    \ |\n| `dataTransfer` | 返回一个 `DataTransfer` 对象，包含关于向可编辑内容添加或移除富文本或纯文本数据的信息。 |\n\
    | `inputType` | 返回可编辑内容的更改类型，例如'inserting'插入、'deleting'删除、'formatting'格式化等等。 |\n\
    | `isComposing` | 返回 true/false，表示事件是否在 `compositionstart` 之后且 `compositionend`\
    \ 之前触发。 |\n\n# 第 29 章：Javascript ChangeEvent\n\n## 1 ChangeChangeEvent\n\n`change`\
    \ 事件在以下情况下触发：\n\n*   用户勾选/取消勾选 `<input type=\"checkbox\">`。\n*   用户对 `<input type=\"\
    radio\">` 进行了更改。\n*   用户更改 `<input>` 的值（文件、颜色、范围）。\n*   用户更改了 `<input>` 的内容（文本、数字、邮箱、密码、电话、时间、周、月、日期、本地日期时间、搜索、url），然后聚焦到其他地方。\n\
    *   用户更改了 `<textarea>` 的内容，然后聚焦到其他地方。\n*   用户更改了 `<select>` 元素的选项。\n\n### 使用 change\
    \ 事件的示例：\n\n`changeevents-elements-example.html`\n\n```html\n<!DOCTYPE html><<html><head><title>ChangeEvent\
    \ Example</title><meta charset=\"UTF-8\"><style>.title {font-weight:bold;}</style><script>function\
    \ changeHandler(evt)  {alert(\"Changed!\");}</script></head><body><h2>ChangeEvent\
    \ example</h2><p class=\"title\">Input (checkbox, radio):</p><input type=\"checkbox\"\
    \  onchange =\"changeHandler(event)\"/><input type=\"radio\" name =\"gender\"\
    \ value=\"M\" onchange =\"changeHandler(event)\"/><input type=\"radio\" name =\"\
    gender\" value=\"F\" onchange =\"changeHandler(event)\"/><p class=\"title\">Input\
    \ (range):</p><input type=\"range\" min =\"1\" max=\"10\" onchange =\"changeHandler(event)\"\
    /><p class=\"title\">Input (color):</p><input type=\"color\" onchange =\"changeHandler(event)\"\
    /><p class=\"title\">Input (file):</p><input type=\"file\" onchange =\"changeHandler(event)\"\
    /><p class=\"title\">Input (image, hidden, buton, submit, reset):</p>- (Not support\
    \ 'change' event)<p class=\"title\">Input (text, number, email, password, tel,\
    \ time, week, month, date, datetime-local, search, url):</p><input type=\"text\"\
    \ onchange =\"changeHandler(event)\"/><p class=\"title\">Textarea element</p><textarea\
    \ onchange =\"changeHandler(event)\" rows=\"3\" cols=\"30\"></textarea><p class=\"\
    title\">Select:</p><select onchange =\"changeHandler(event)\"><option value =\"\
    en\">English</option><option value =\"de\">German</option><option value =\"vi\"\
    >Vietnamese</option></select><p id=\"log-div\"></p></body></html>\n```\n\n| ![](img/image_rsrc8V0.jpg)\
    \ |\n\n### 在 <select> 元素上使用 change 事件的示例：\n\n`changeevents-select-example.html`\n\
    \n```html\n<!DOCTYPE html><<html><head><title>ChangeEvent Example</title><meta\
    \ charset=\"UTF-8\"><script>function changeHandler(evt)  {alert(\"Language: \"\
    \ + evt.target.value);}</script></head><body><h2>ChangeEvent example</h2><p class=\"\
    title\">Select Language:</p><select onchange =\"changeHandler(event)\"><option\
    \ value =\"en\">English</option><option value =\"de\">German</option><option value\
    \ =\"vi\">Vietnamese</option></select></body></html>\n```\n\n| ![](img/image_rsrc8V1.jpg)\
    \ |\n\n# 第 30 章：Javascript DragEvent\n\n## 1 DragEvent\n\n`DragEvent` 是一个接口，代表在对象从一个地方拖放到另一个地方过程中发生的事件。用户通过将指针设备（如鼠标）放在对象表面、按下按键、移动指针设备到另一个地方，然后释放指针设备以将对象放置到新位置，从而启动拖放。\n\
    \n| ![](img/image_rsrc8V2.jpg) |\n\n| ![](img/image_rsrc8V3.jpg) |\n\n`DragEvent`\
    \ 是 `MouseEvent` 的子接口，因此它继承了 `MouseEvent` 的所有属性和方法。\n\n| ![](img/image_rsrc8V4.jpg)\
    \ |\n\n以下是拖放过程中发生的事件类型列表：\n\n| 事件 | 元素类型 | 描述 |\n| :--- | :--- | :--- |\n| `dragstart`\
    \ | 被拖拽元素 | 当用户开始拖动元素时触发事件 |\n| `drag` | 被拖拽元素 | 当元素正在被拖拽时触发事件 |\n| `dragend`\
    \ | 被拖拽元素 | 当用户完成元素拖拽时触发事件 |\n| `dragenter` | 放置目标 | 当被拖拽元素进入放置目标时触发事件 |\n| `dragover`\
    \ | 放置目标 | 当被拖拽元素位于放置目标上方时触发事件 |\n| `drleave` | 放置目标 | 当被拖拽元素离开放置目标时触发事件 |\n|\
    \ `drop` | 放置目标 | 当被拖拽元素放置在放置目标上时触发事件 |\n\n| ![](img/image_rsrc8V5.jpg) |\n\n\
    | 属性 | 描述 |\n| :--- | :--- |\n| `dataTransfer` | 返回拖拽/放置的数据 |\n\n查看一个简单的示例：\n\n\
    | ![](img/image_rsrc8V6.jpg) |\n\n`dragevents-example.html`\n\n```html\n<!DOCTYPE\
    \ html><<html><head><title>DragEvent Example</title><script src=\"dragevents-example.js\"\
    ></script><style>.droptarget-div {float: left;width: 100px;height: 55px;margin:\
    \ 25px 25px 5px 5px;padding: 10px;border: 1px solid black;}#dragtarget-div {background:\
    \ #eee;padding: 5px;}</style></head><body><h3>DragEvent example</h3><p id=\"log-div\"\
    >..</p><!-- Drop Target 1 --><div class=\"droptarget-div\"ondragenter= \"ondragenterHandler(event)\"\
    ondragover=\"dragoverHandler(event)\"ondrop=\"dropHandler(event)\"><p id=\"dragtarget-div\"\
    ondragstart=\"dragstartHandler(event)\"ondrag=\"dragHandler(event)\"draggable=\"\
    true\">Drag me!</p></div><!-- Drop Target 2 --><div class=\"droptarget-div\"ondragenter=\
    \ \"ondragenterHandler(event)\"ondragover=\"dragoverHandler(event)\"ondrop=\"\
    dropHandler(event)\"></div></body></html>\n```\n\n`dragevents-example.js`\n\n\
    ```javascript\n// --------- “被拖拽元素”的处理函数 ------------------\nfunction dragstartHandler(evt)\
    \ {\n  evt.dataTransfer.setData(\"MyDraggedId\", evt.target.id);\n}\n// 拖拽中 ...\n\
    function dragHandler(evt) {\n  showLog(\"The p element is being dragged\");\n\
    }\n// --------- “放置目标”的处理函数 ------------------\nfunction ondragenterHandler()\
    \  \n  showLog(\"The p element enter drop-target\");\n}\n// 在 'over' 期间，你可以'释放鼠标'来'放置'。\n\
    function dragoverHandler(evt) {\n  evt.preventDefault(); // 重要！！\n}\nfunction\
    \ dropHandler(evt) {\n  evt.preventDefault(); // 重要!!\n  var elementId = evt.dataTransfer.getData(\"\
    MyDraggedId\");\n  evt.target.appendChild(document.getElementById(elementId));\n\
    \  showLog(\"The p element was dropped\");\n}\n// -------------------------------------------------------\n\
    function showLog(text)  \n  document.getElementById(\"log-div\").innerHTML = text;\n\
    }\n```\n\n例如，用户在电脑上拖动文件并将其到 `<div>` 元素中，你可以读取用户放置的文件的基本信息和内容。\n\n当 `drop` 事件发生时，`event.dataTransfer.files`\
    \ 返回一个 `FileList` 对象，其中包含一个 `File` 对象列表。\n\n| ![](img/image_rsrc8V7.jpg) |\n\n\
    # 第 31 章：Javascript HashChangeEvent\n\n## 1 HashChangeEvent\n\nHash 是 URL 的“锚点部分”。它告诉浏览器滚动滚动条，以显示与\
    \ Hash 对应的内容区域。\n\n| ![](img/image_rsrc8V8.jpg) |\n\n`hash-example.html`\n\n"
