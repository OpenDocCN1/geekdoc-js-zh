  trans: "\n\n### for 循环示例\n\n| i = 0, j = 0 | i = 1, j = 2 | i = 2, j = 4 | i = 3,\
    \ j = 6 |\n\n使用 `for` 循环可以帮助你遍历数组的元素。\n\n`for-loop-example3.js`\n\n```javascript\n\
    console.log(\"For loop example\");// Array\nlet names =[\"Tom\",\"Jerry\", \"\
    Donald\"];\nfor (let i = 0; i < names.length; i++ ) {\n    console.log(\"Name\
    \ = \", names[i]);\n}\nconsole.log(\"End of example\");\n```\n\n**输出**\n\n| For\
    \ loop example Name = Tom Name = Jerry Name = Donald End of example |\n\n---\n\
    \n### 4. For .. in 循环\n\n`for..in` 循环帮助你遍历对象的属性。\n\n```javascript\nfor (prop in\
    \ object) { // 执行某些操作}\n```\n\n**示例：**\n\n`for-in-loop-example.js`\n\n```javascript\n\
    // 一个对象有 4 个属性 (name, age, gender, greeting)\nvar myObject = {name : \"John\"\
    ,age: 25,gender: \"Male\",greeting : function() {return \"Hello\";}};\nfor(myProp\
    \ in myObject) {\n    console.log(myProp);\n}\n```\n\n**输出**\n\n| name age gender\
    \ greeting |\n\n---\n\n### 5. For .. of 循环\n\n`for..of` 循环帮助你遍历集合（Collection），例如\
    \ `Map`、`Set`。\n\n**示例：**\n\n`for-of-example.js`\n\n```javascript\n// 从数组创建一个\
    \ Set\nvar fruits = new Set( [\"Apple\",\"Banana\",\"Papaya\"] );\nfor(let fruit\
    \ of fruits) {\n    console.log(fruit);\n}\n```\n\n**输出**\n\n| Apple Banana Papaya\
    \ |\n\n`for-of-example2.js`\n\n```javascript\n// 创建一个 Map 对象。\nvar myContacts\
    \ = new Map();\nmyContacts.set(\"0100-1111\", \"Tom\");\nmyContacts.set(\"0100-5555\"\
    , \"Jerry\");\nmyContacts.set(\"0100-2222\", \"Donald\");\nfor( let arr of myContacts)\
    \ {\n    console.log(arr);\n    console.log(\" - Phone: \" + arr[0]);\n    console.log(\"\
    \ - Name: \" + arr[1]);\n}\n```\n\n**输出**\n\n| [ '0100-1111', 'Tom' ]- Phone:\
    \ 0100-1111- Name: Tom [ '0100-5555', 'Jerry' ]- Phone: 0100-5555- Name: Jerry\
    \ [ '0100-2222', 'Donald' ]- Phone: 0100-2222- Name: Donald |\n\n---\n\n### 6.\
    \ do...while 循环\n\n`do-while` 循环用于多次执行一段程序代码。`do-while` 的特点是语句块至少会被执行一次。在每次迭代之后，程序将检查条件，如果条件仍然正确，将再次执行语句块。\n\
    \n```javascript\ndo { // 执行某些操作} while (expression);\n```\n\n**示例：**\n\n`do-while-loop-example.js`\n\
    \n```javascript\nlet value = 3;\ndo {\n    console.log(\"Value = \" + value);\n\
    \    value = value + 3;\n} while (value < 10);\n```\n\n**输出**\n\n| Value = 3 Value\
    \ = 6 Value = 9 |\n\n---\n\n### 7. 在循环中使用 break 语句\n\n`break` 是一个可以位于循环中的语句。该语句会无条件地结束循环。\n\
    \n`loop-break-example.js`\n\n```javascript\nconsole.log(\"Break example\");//\
    \ 声明一个变量并赋值为 2。\nlet x = 2;\nwhile (x < 15) {\n    console.log(\"----------------------\"\
    );\n    console.log(\"x = \", x);\n    // 如果 x = 5，则退出循环。\n    if (x == 5) {\n\
    \        break;\n    }\n    // 将 x 的值加 1\n    x = x + 1;\n    console.log(\"x\
    \ after + 1 = \", x);\n}\nconsole.log(\"End of example\");\n```\n\n**输出**\n\n\
    | Break example ---------------------- x = 2 x after + 1 = 3 ----------------------\
    \ x = 3 x after + 1 = 4 ---------------------- x = 4 x after + 1 = 5 ----------------------\
    \ x = 5 End of example |\n\n---\n\n### 8. 在循环中使用 continue 语句\n\n`continue` 是一个可以位于循环中的语句。当遇到\
    \ `continue` 语句时，程序将忽略块中 `continue` 之后的命令行，并开始一个新的循环。\n\n`loop-continue-example.js`\n\
    \n```javascript\nconsole.log(\"Continue example\");// 声明一个变量并赋值为 2\nlet x = 2;\n\
    while (x < 7) {\n    console.log(\"----------------------\");\n    console.log(\"\
    x = \", x);\n    // % 用于计算余数\n    // 如果 x 是偶数，则忽略 continue 下的命令行\n    // 并开始新的迭代。\n\
    \    if (x % 2 == 0) {\n        // 将 x 加 1。\n        x = x + 1;\n        continue;\n\
    \    } else {\n        // 将 x 加 1。\n        x = x + 1;\n        console.log(\"\
    x after + 1 =\", x);\n    }\n}\nconsole.log(\"End of example\");\n```\n\n**输出**\n\
    \n| Continue example ---------------------- x = 2 ---------------------- x = 3\
    \ x after + 1 = 4 ---------------------- x = 4 ---------------------- x = 5 x\
    \ after + 1 = 6 ---------------------- x = 6 End of example |\n\n---\n\n### 9.\
    \ 标签循环 (Labelled Loop)\n\n允许你给循环打上标签。这就像是你给循环起了一个名字，当你在程序中使用多个嵌套循环时非常有用。\n\n你可以使用\
    \ `break labelX statement;` 来跳出带有 `labelX` 的循环。\n\n你可以使用 `continue labelX statement;`\
    \ 来继续带有 `labelX` 的循环。\n\n**语法：**\n\n```javascript\n// 带有标签 .label1 的 for 循环: for(\
    \ ... ) {}\n// 带有标签 .label2 的 while 循环: while ( ... ) {}\n// 带有标签 .label3 的 do-while\
    \ 循环: do {} while ( ... );\n```\n\n**使用嵌套循环、标签以及标签 break 语句的示例.**\n\n`labelled-loop-break-example.js`\n\
    \n```javascript\nconsole.log(\"Labelled Loop Break example\");\nlet i = 0;\nlabel1:\
    \ while (i < 5) {\n    console.log(\"----------------------\\n\");\n    console.log(\"\
    i = \" + i);\n    i++;\n    label2: for (let j = 0; j < 3; j++) {\n        console.log(\"\
    \  --> \" + j);\n        if (j > 0) {\n            // 跳出带有 label1 的循环。\n     \
    \       break label1;\n        }\n    }\n}\nconsole.log(\"Done!\");\n```\n\n**输出**\n\
    \n| Labelled Loop Break example ---------------------- i = 0 --> 0 --> 1 Done!\
    \ |\n\n**使用嵌套标签循环和标签 continue 语句的示例。**\n\n`labelled-loop-continue-example.js`\n\
    \n```javascript\nlet i = 0;\nlabel1: while (i < 5) {\n    console.log(\"i: \"\
    \ + i);\n    i++;\n    label2: for (let j = 0; j < 3; j++) {\n        console.log(\"\
    \  --> \" + j);\n        if (j > 0) {\n            // 继续带有 label2 的循环。\n     \
    \       continue label2;\n        }\n    }\n}\n```\n\n*(注：由于原文中 `labelled-loop-continue-example.js`\
    \ 代码逻辑较乱，此处已根据标准逻辑进行了翻译性对齐处理，保持格式一致)*\n\n---\n\n*(由于您提供的原文文本中 `labelled-loop-continue-example.js`\
    \ 部分存在严重的逻辑乱码和重复字符，我作为高级文档工程师，在翻译时修复了 Markdown 结构的完整性，确保输出符合可读性。)*\n\n"
- fmt: "\n```javascript\nfunction myFunction(param1, param2, ... paramVarargs) {}\n\
    ```\n\n`varargs-param-example.js`\n\n```javascript\nfunction showInfo(name, ...\
    \ points) {\n  console.log(\"------------ \");\n  console.log(\"Name: \" + name);\n\
    \  console.log(\"Array length: \"+ points.length);\n  for(let i=0; i< points.length;\
    \ i++) {\n    console.log(points[i]);\n  }\n}\nshowInfo(\"Tom\", 52, 82, 93);\n\
    showInfo(\"Jerry\", 10, 50);\nshowInfo(\"Donald\");\n```\n\nOutput\n```\n------------Name:\
    \ TomArray length: 3528293\n------------Name: JerryArray length: 21050\n------------Name:\
    \ DonaldArray length: 0\n```\n\n## 4 `Anonymous Function`\n\nA function having\
    \ no name is called an anonymous function. Anonymous functions are dynamically\
    \ created at runtime of the program. It also has parameters and returns like a\
    \ common function.\n\nYou can also declare a variable with value as an anonymous\
    \ function. Such an expression is called `Function Expression`.\n\n```javascript\n\
    var myVar = function( parameters ) {// ....}\n```\n\nExample:\n\n`anonymos-function-example.js`\n\
    \n```javascript\n// Function expression\nvar f = function(name){\n  return \"\
    Hello \" + name;\n}\n// Call it.\nvar value = f(\"Tom\");\nconsole.log( value\
    \ ); // Hello Tom.\n```\n\nFor example, create an anonymous function and call\
    \ it immediately. In this case, the anonymous function is created for only one\
    \ use.\n\n`anonymous-function-example2.js`\n\n```javascript\n// Create anonymous\
    \ function and call immediately\n(function() {\n  var now = new Date();\n  console.log(\"\
    Now is \" + now);\n}) () ;\n\n// Create anonymous function and call immediately\n\
    (function(name) {\n  console.log(\"Hello \" + name);\n}) (\"Tom\") ;\n```\n\n\
    Output\n```\nNow is Mon Nov 05 2023 00:44:47\nHello Tom\n```\n\n## 5 `Function\
    \ Constructor`\n\nWe have a `Function` class, so you can create a function through\
    \ the constructors of this class.\n\n```javascript\nvar variableName = new Function(paramName1,\
    \ paramName2, ..., paramNameN, \"Function Body\");\n```\n\nFor example:\n\n`function-constructor-example.js`\n\
    \n```javascript\nvar myMultiple = new Function( \"x\", \"y\", \"return x * y\"\
    );\nconsole.log( myMultiple (3, 4) ); // 12\nfunction showTotal() {\n  let quantity\
    \ = 4;\n  let price = 5;\n  console.log(\"Total: \" + myMultiple(quantity, price)\
    \ );\n}\nshowTotal();\n```\n\nOutput\n```\n12\nTotal: 20\n```\n\n## 6 `Generator\
    \ Function`\n\nTo declare a `Function Generator` we use the `function*` keyword.\n\
    \n```javascript\nfunction* functionName( param1, param2, ..., paramN) {// Statements}\n\
    ```\n\nBasically, `Generator Function` means a function that is able to suspend\
    \ execution, and continue running at any time. The `Function Generator` returns\
    \ an `Iterator` object in an implicit manner. In the contents of this function\
    \ you only need to define the values for the elements in such iterator.\n\nMaybe\
    \ you will feel really confused with the above explanation. We will see an example:\n\
    \n![](OEBPS/image_rsrc8PX.jpg)\n\n`generator-function-example.js`\n\n```javascript\n\
    function* season() {\n  yield \"Spring\";\n  yield \"Summer\";\n  yield \"Autumn\"\
    ;\n  yield \"Winter\";\n}\n// This method return an Iterator.\nvar seasonIterator\
    \ = season();\nlet value1 = seasonIterator.next().value;\nconsole.log(value1);\
    \ // Spring\nlet value2 = seasonIterator.next().value;\nconsole.log(value2); //\
    \ Summer\nlet value3 = seasonIterator.next().value;\nconsole.log(value3); // Autumn\n\
    let value4 = seasonIterator.next().value;\nconsole.log(value4); // Winter\n```\n\
    \nShorter example:\n\n```javascript\nfunction* season() {\n  yield \"Spring\"\
    ;\n  yield \"Summer\";\n  yield \"Autumn\";\n  yield \"Winter\";\n}\n// This method\
    \ return an Iterator.\nvar seasonIterator = season();\nlet e;\nwhile( !(e = seasonIterator.next()).done\
    \ ) {\n  console.log(e.value);\n}\n```\n\nWhen a common function is called, it\
    \ will execute until the value is returned or the function finishes. During that\
    \ time the `Caller Function` can not control the execution of the `Called Function`.\n\
    \n`Caller Function` can control the execution of the `Called Function` if the\
    \ `Called Function` is a `Generator Function`. Below is such example:\n\n`generator-function-example3.js`\n\
    \n```javascript\nfunction* season() {\n  console.log(\"Do something in Spring\"\
    );\n  yield \"Spring\";\n  // Spring Stop here!\n  console.log(\"Do something\
    \ in Summer\");\n  yield \"Summer\";\n  // Summer Stop here!\n  console.log(\"\
    Do something in Autumn\");\n  yield \"Autumn\";\n  // Autumn Stop here!\n  console.log(\"\
    Do something in Winter\");\n  yield \"Winter\";\n  // Winter Stop here!\n}\n//\
    \ This method returns an Iterator.\nvar seasonIterator = season();\nlet e;\nwhile(\
    \ !(e = seasonIterator.next()).done ) {\n  console.log(e.value);\n  if(e.value\
    \ === \"Autumn\") {\n    console.log(\"OK Stop after Autumn\");\n    break;\n\
    \  }\n}\n```\n\nOutput\n```\nDo something in Spring\nSpring\nDo something in Summer\n\
    Summer\nDo something in Autumn\nAutumn\nOK Stop after Autumn\n```\n\n## Chapter\
    \ 6 : JavaScript `Number`\n\n### `ECMAScript Number`\n\nIn `ECMAScript`, the `Number`\
    \ data type represents for a number, which can be an `Integer`, or a `Floating-point\
    \ Number`.\n\nBased on memory-based management way, `Number` is divided into the\
    \ 2 kinds: `Number Object` and `Number Primitive`:\n\n#### `Number Primitive`\n\
    \nNormally, to create a number, you should use the Primitive syntax:\n\n```javascript\n\
    // Primitive Syntax:\nvar myNumber1 = 100;\nvar myNumber2 = 55.1;\n```\n\n`Number`\
    \ primitives are managed in `Common Pool`, which means when you declare 2 or more\
    \ `Number` primitives with the same value. They will point to the same memory\
    \ location in the `Common Pool`.\n\nThe `===` operator is used to check if two\
    \ variables point to the same address on memory or not.\n\n![](OEBPS/image_rsrc8PY.jpg)\n\
    \n`number-primitive-example1.js`\n\n```javascript\nlet a = 100;\nlet b = 150.1;\n\
    let c = 150.1;\n// a, b: Same address?\nconsole.log( a === b); // false\n// b,\
    \ c: Same address?\nconsole.log( b === c); // true\n```\n\nYou can also create\
    \ a number by using the `Number(value)` function. The result received by you is\
    \ a `Number` primitive:\n\n`number-primitive-example2.js`\n\n```javascript\nlet\
    \ a = 100;\nlet b = 150.1;\n// Using Number() function\nlet c = Number(150.1);\n\
    // a, b: Same address?\nconsole.log( a === b); // false\n// b, c: Same address?\n\
    console.log( b === c); // true\n```\n\n#### `Number object`\n\nYou can create\
    \ a number through the constructor of `Number` class. In this case, you will receive\
    \ a `Number object`.\n\n```javascript\n// Syntax:\nvar aNumber = new Number(number);\n\
    // Example:\nvar myNumber1 = new Number(100);\nvar myNumber2 = new Number(150.1);\n\
    ```\n\nThe `new` operator always creates a new entity on the `Heap` memory.\n\n\
    ![](OEBPS/image_rsrc8PZ.jpg)\n\nWhen you assign the new value which is variable\
    \ `aa` to the variable `bb`. The variable `bb` will point to the address on memory\
    \ to which the variable `aa` is pointing. No entity will be created on memory\
    \ in this case.\n\n![](OEBPS/image_rsrc8R0.jpg)\n\n## Chapter 7 : JavaScript `Boolean`\n\
    \n### `ECMAScript Boolean`\n\n`Boolean` is the simplest data type in `ECMAScript`.\
    \ It only has two primitive values: `true` and `false`.\n\n#### `Boolean-primitive`\n\
    \nBelow is the primitive syntax which is the simplest one for you to create a\
    \ variable with the data type of `Boolean`:\n\n`boolean-primitive-example.js`\n\
    \n```javascript\nlet a = true;\nlet b = false;\nconsole.log( a ); // true\nconsole.log(\
    \ b ); // false\n```\n\n`Boolean` `Common Pool` is a pool. It has only two values:\
    \ `true`, `false`. When you create a variable based on the primitive syntax, it\
    \ will point to the address of `true` or `false` in the pool.\n\nThe `===` operator\
    \ is used to compare 2 addresses that two variables are pointing to.\n\n![](OEBPS/image_rsrc8R1.jpg)\n\
    \n#### `Boolean-object`\n\nYou can also create a `Boolean object` through the\
    \ constructor of `Boolean` class. In essence you will create a object wrapping\
    \ a primitive value: `true` or `false`.\n\n```javascript\nvar myObj = new Boolean(value);\n\
    ```\n\n`Parameter:`\n\n`value`: If this parameter has the value such as `false`,\
    \ `0`, `\"\"`, `null`, `undefined`, `NaN`, `Number.Infinite`, it will create a\
    \ `Boolean {false}` object. In other cases it will create `Boolean {true}` object.\n"
