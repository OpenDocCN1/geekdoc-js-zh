    \ |\n\n### keydown\n\n当你按下按键时，会触发 `keydown` 事件。在 Windows OS 中，如果你持续按住按键，它会不断发出\
    \ `keydown` 和 `keypress` 事件。但在 MacOS 中，如果你持续按住按键，它会不断发出 `keydown` 事件。如下所示。\n\n\
    !![](img/image_rsrc8UJ.jpg)\n\n### keypress\n\n`keypress` 发生在 2 种情况，其中情况 1 如我上面所述的（查看\
