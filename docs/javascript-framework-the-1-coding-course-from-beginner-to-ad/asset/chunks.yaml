    1  Iteration


    ECMAScript 6 provides you with a new way to interact with data structure, which
    is Iteration. Now, we will clarify it.


    There are two concepts that you need to distinguish:


    *   Iterator


    *   Iterable


    2  Concept of Iterator


    Iterator: An object called Iterator if it contains a pointer to next element in
    Iteration.


    Technically, an object in ECMAScript is called an Iterator if it has a method
    with the next() name, and this method returns an object with the form {value:SomeValue,done:booleanValue}.
    done has true value if the Iteration has been completed, otherwise it has false
    value.


    | ![](OEBPS/image_rsrc8TP.jpg) |


    iterator-object-example.js


    | // An Iterator Object:let myIterator = {someProp: "Some Prop",//next : function()  {return  {value:
    "Tom",done: false}}}// ----------- TEST -------------------let entry = myIterator.next();console.log(entry);
    // { value: ''Tom'', done: false }console.log(entry.value); // Tom |


    3  Concept of Iterable


    Iterable - In terms of language, an object is called Iterable if it contains a
    collection of data, and it provides a way to publicize its data. For example,
    an array can be called Iterable because it contains a collection of data, and
    you can access its elements.


    Technically, in the ECMAScript, an object that is called Iterable must have a
    method with the key of Symbol.iterator and this method returns an Iterator object.


    object-with-properties.js


    | // An Object:let myObject = {// A propertymyProp1 : "Some Value 1",// A property''myProp2''
    : "Some Value 2",// A property100 : "One hundred",// A property (Method)myProp3
    :  function()  {console.log("I''m a method");},// A property (Method)[Symbol.iterator]
    : function() {console.log("I''m a [Symbol.iterator] method");}}// -----------
    TEST --------------console.log( myObject["myProp1"] ); // Some Value 1console.log(
    myObject["myProp2"] ); // Some Value 2console.log( myObject[100] ); // One hundredmyObject["myProp3"]();
    // I''m a methodmyObject[Symbol.iterator]();// I''m a [Symbol.iterator] method
    |


    Running the example:


    Output


    | Some Value 1Some Value 2One hundredI''m a methodI''m a [Symbol.iterator] method
    |


    Iterable


    To sum up, an object is called Iterable if it has a method with a Symbol.iterable
    key, and this method returns an Iterator object.


    iterable-object-example.js


    | // An Iterator Objectlet myIterator = {next : function()  {return  {value: Math.random(),
    done: false};}}// A Iterable object:let myIterable = {myProp : "Some value",//
    A Method returns an Iterator object.[Symbol.iterator] :  function() {return myIterator;}}//
