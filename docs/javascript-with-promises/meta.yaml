    # Summary


    This chapter covered a number of scenarios that are likely to arise when using
    promises. It showed how one async function affects all the functions that come
    before it in the call stack. It also showed how to process an arbitrary number
    of tasks sequentially or in parallel. And how to build processing pipelines by
    chaining promises together.


    All the topics in this chapter were addressed using the standard Promise API.
    This discussion is continued in Chapter 4 using expanded APIs that some promise
    libraries and frameworks provided.'
  - '[PAGE 48]


    # CHAPTER 4


    # Using Libraries and Frameworks


    Before the ES6 Promise API existed, many JavaScript libraries and frameworks implemented
    their own version of Promises. Some libraries were written for the sole purpose
    of providing promises while established libraries like jQuery added them to handle
    their async APIs.


    Promise libraries can act as polyfills in older web browsers and other environments
    where native promises are not provided. They can also supplement the standard
    API with a wide set of functions for managing promises. If your code only uses
    promises that you create you''re in a good position to choose a library and take
    full advantage of its extended API. And if you are handling promises that other
    libraries produced, you can wrap those promises with ones from your chosen library
    to access the additional features.


    This chapter focuses on nonnative promise implementations. The majority of the
    chapter covers Bluebird, a fast and robust promise library. Although Bluebird
    is a compelling choice, there are other good options. For example, the Q promise
    library predates Bluebird and is widely used in applications and frameworks including
    AngularJS. Q and other libraries are not discussed in detail this is not a guide
    to choosing between libraries. It is an introduction to the enhancements that
    third-party libraries offer to demonstrate their value. The Promise implementation
    in jQuery is also discussed because of jQuery''s immense popularity. However,
    this is not a complete walk-through of either Bluebird or jQuery. These open source
    projects evolve rapidly, so refer to the official online documentation for full
    details of the current features.'
