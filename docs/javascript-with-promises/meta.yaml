    \ series of database changes that all require a connection object. If the connection\
    \ is obtained through a promise in the chain it will not be available to other\
    \ steps in the chain by default. You can expose the connection to other steps\
    \ by assigning it to a variable in the enclosing scope, as shown in Example 4-12.\n"
  mdcn: "\n第一个参数是错误对象，随后是任何额外的参数。示例 4-6 显示了这种风格实现的 `LoadImage` 函数。\n\n示例 4-6. Node\
    \ 风格回调\n\n```\nfunction loadImageNodeStyle(url, callback) {\n  var image = new\
    \ Image();\n  image.src = url;\n  image.onload = function () {\n    callback(null,\
    \ image);\n  };\n  image.onerror = function (error) {\n    callback(error);\n\
    \  };\n}\n```\n\n```\nloadImageNodeStyle('labyrinth_puzzle.png', function (err,\
    \ image) {\n  if (err) {\n    console.log('Unable to load image');\n    return;\n\
    \  }\n  console.log('Image loaded');\n}\n```\n\nBluebird 提供了一个名为 `promisify` 的方便函数，它可以将\
    \ Node 风格的函数封装为返回 promise 的函数，示例 4-7 所示。\n\n示例 4-7. 使用 promisify 包装 Node 风格函数\n\
    \n```\nvar loadImageWrapper = Bluebird.promisify(loadImageNodeStyle);\nvar promise\
    \ = loadImageWrapper('computer_problems.png');\n```\n\n```\npromise.then(function\
    \ (image) {\n  console.log('Image loaded');\n}).catch(function (error) {\n  console.log('Unable\
    \ to load image');\n});\n```\n\n`LoadImageWrapper` 函数接受与原始 `loadImageNodeStyle`\
    \ 函数相同的 `url` 参数，但不需要回调函数。使用 `promisify` 会内部调用回调并将其正确写入 promise。如果回调接收到错误，promise\
    \ 将被拒绝。否则，promise 将用传递给回调的任何额外参数被完成。\n\n标准 promise 不能由多个值完成。然而，Node 风格的回调在操作成功时期望多个值。在这种情况下，你可以指示\
    \ `promisify` 使用一个包含所有传递给回调的参数（错误参数外，因为它无关）的数组来完成 promise。\n\n可以使用 Bluebird 的\
    \ `promise.spread()` 方法将数组转换回单独函数参数。示例 4-8 显示了一个 Node 风格函数的示例，该函数提供了关于用户账户的多个信息。\n\
    \n示例 4-8. 使用 `promise.spread()` 将数组转换为单独参数\n\n```\nfunction getAccountStatus(callback)\
    \ {\n  var error = null;\n  var enabled = true;\n  var lastLogin = new Date();\n\
    \n  callback(error, enabled, lastLogin); // 回调成功时有多个值\n}\n\nvar fulfillUsingAnArray\
    \ = true;\nvar wrapperFunc = Bluebird.promisify(getAccountStatus, fulfillUsingAnArray);\n\
    \n// 不使用 spread\nwrapperFunc().then(function (status) {\n  var enabled = status[0];\n\
    \  var lastLogin = status[1];\n  // ...\n});\n\n// 使用 spread\nwrapperFunc().spread(function\
    \ (enabled, lastLogin) {\n  // ...\n});\n```\n\n使用此示例可以清晰地指定 `enabled` 和 `lastLogin`，而无需从数组中提取它们。当\
    \ promise 被一个长度和元素顺序已知的数组完成时，使用 `spread` 可以简化代码。\n\nES6 包含一个名为“解构”（destructuring）的功能，它可以将数组中的值赋值给单个变量。该功能在第\
    \ 65 页的“Destructuring”getget描述。\n\n如果你想指定 Node 风格函数运行时的上下文，可以将上下文作为参数传递给 `promisify`，或者在用\
    \ `promisify` 包装函数后将其绑定上下文，示例 4-9 所示。\n\n示例 4-9. 为包装的函数执行上下文\n\n```\nvar person\
    \ = {\n  name: 'Marie',\n  introNodeStyle: function (callback) {\n    var err\
    \ = null;\n    callback(err, 'My name is ' + this.name);\n  }\n};\n```\n\n```\n\
    var wrapper = Bluebird.promisify(person.introNodeStyle);\nwrapper().then(function\
    \ (greeting) {\n  console.log('promisify without second argument: ' + greeting);\n\
    });\n```\n\n```\nvar wrapperWithPersonArg = Bluebird.promisify(person.introNodeStyle,\
    \ person);\nwrapperWithPersonArg().then(function (greeting) {\n  console.log('promisify\
    \ with a context argument: ' + greeting);\n});\n```\n\n```\nvar wrapperWithBind\
    \ = Bluebird.promisify(person.introNodeStyle.bind(person));\nwrapperWithBind().then(function\
    \ (greeting) {\n  console.log('promisify using function.bind: ' + greeting);\n\
    });\n```\n\n```\n// 控制台输出:\n// promisify without second argument: Hello my name\
    \ is\n// promisify with a context argument: Hello my name is Marie\n// promisify\
    \ using function.bind: Hello my name is Marie\n```\n\n只有使用绑定函数或作为第二个参数提供上下文的包装器会包含名称。所有包装器都会调用\
    \ `person.introNodeStyle()`，它构建了一个包含 `this.name` 的字符串。第一个使用未定义第二个参数创建的包装器在根作用域（Web浏览器中的\
    \ window 对象）中运行，该对象没有 `name` 属性。下一个包装器通过将其作为 `promisify` 的第二个参数来指定上下文。最后一个使用了函数的\
    \ `bind` 方法将上下文设置为对象字面量。\n\n![](img/86b9481a293cab930786a4c67d908e3e_55_0.png)\n\
    \n在包装旨在作为方法运行（即在特定对象的上下文中）的函数时，请小心使用函数的 `bind`。\n\n## 集合操作\n\nBluebird 提供了增强版的\
    \ `map`、`reduce` 和 `filter`，类似于 JavaScript 中可用的版本。示例 4-10 显示了 `filter` 和 `reduce`\
    \ 的工作。这些函数允许你异步处理集合。\n\n同样适用于数组。当调用 `map` 时，它接收一个数组，其第二个元素是一个未解析的 promise。其他元素是立即传递给回调的数字。完成第二个\
    \ promise 后，其值将传递给 `square`。一旦处理所有值，将返回一个与同步 `array.map()` 函数相同的数组。\n\n在本示例中使用\
    \ `array.map()` 或 `Bluebird.map()` 会产生相同的结果，值传递给回调的顺序无关。只要用于 `map` 的回调没有副作用，这就可以工作。promise\
    \ 允许尽可能快。示例 4-11 显示了 `map` 乱序传递值。\n\n示例 4-11. 聚合函数的尽早调用\n\n```\nfunction resolveLater(value)\
    \ {\n  return new Bluebird(function (resolve, reject) {\n    setTimeout(function\
    \ () {\n      resolve(value);\n    });\n  });\n}\n```\n\n```\nvar numbers = Bluebird.resolve([\n\
    \  1,\n  resolveLater(2),\n  3\n]);\n```\n\n```javascript\nconsole.log('Square\
    \ the following numbers...');\nnumbers.map(function(num) {\n  console.log(num);\n\
    \  return num * num;\n}).then(function(result) {\n  console.log('The squares of\
    \ those numbers are...');\n  console.log(result.join(', '));\n});\n```\n\n```\n\
    // 控制台输出:\n// Square the following numbers...\n// 1\n// 3\n// 2\n// The squares\
    \ of those numbers are...\n// 1, 4, 9\n```\n\n## 操作完成值\n\n在链式调用 promise 执行一系列步骤时，上一个步骤的完成值通常提供下一步所需的值。这种进展通常运行良好，但有时后续步骤需要同一个值。在这种情况下，你需要一种方法将完成值暴露给额外的步骤。\n\
    \n想象有一系列数据库更改，所有更改都需要一个连接对象。如果连接是通过链中的 promise 获取的，默认情况下它对链中的其他步骤不可用。你可以通过将其赋值给闭包作用域中的变量将连接暴露给其他步骤，示例\
    \ 4-12 所示。\n\n"
