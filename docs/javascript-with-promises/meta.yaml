    \ image is undefined\n        image.onload = resolve;\n        image.onerror =\
    \ reject;\n    });\n}\n```\n\nRuntime errors occur in both functions because the\
    \ image object is never instantiated. In badfunc only a try/catch block somewhere\
    \ on the stack or a global exception handler will catch the runtime error. In\
    \ goodfunc the runtime error rejects the"
