    \ is called to calculate the next value. Example 6-15 shows the equivalent code\
    \ using a generator.\n\nExample 6-15. Computing a series of values using a generator\n\
    \n```\nfunction fib() {\n  var a = 0;\n  var b = 1;\n  while (true) {\n    yield\
    \ a + b;\n    a = b - a;\n  }\n}\n\nvar i;\nvar result;\nvar iterator = fib();\n\
    for (i = 0; i < 5; i++) {\n  result = iterator.next();\n  console.log(result.value);\n\
    }\n```\n\n```\n// Console output is identical to the previous example\n```\n\n\
    The fib function is now a generator, which is indicated by adding the * at the\
    \ end of the function keyword. When the generator is called, the JavaScript engine\
    \ does not start running the code inside fib as it would with a normal function.\
    \ Instead the call"
