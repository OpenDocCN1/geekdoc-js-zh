    # JavaScript with Promises\n\nAsynchronous JavaScript is everywhere, whether you're\
    \ using Ajax, AngularJS, Node.js, or WebRTC. This practical guide shows intermediate\
    \ to advanced JavaScript developers how Promises can help you manage asynchronous\
    \ code—including the inevitable flow of callbacks as your codebase grows. You\
    \ will learn the workings of Promises and ways to avoid difficulties and misses\
    \ when using them.\n\nThe ability to asynchronously fetch data and load scripts\
    \ in the browser broadens the capabilities of JavaScript applications. But if\
    \ you don't understand how async part works, you'll end up with unpredictable\
    \ code that's difficult to maintain. This book is ideal when you're new to Promises\
    \ or want to expand your knowledge of this technology.\n\n> Daniel Parker begins\
    \ with an insightful introduction to asynchronous programming that any JavaScript\
    \ developer will find useful. With Promises covers both the How and Why, focusing\
    \ on current practical tools.\n\n- Understand how async JavaScript works by delving\
    \ into callbacks, the event loop, and threading\n- Learn how Promises organize\
    \ callbacks into discrete steps that are easier to read and maintain\n- Examine\
    \ scenarios you'll encounter and techniques you can use when writing real-world\
    \ applications\n- Use features in the Bluebird library and jQuery to work with\
    \ Promises\n- Learn how the Promise API handles asynchronous errors\n- Explore\
    \ ECMAScript 6 language features that simplify Promise-related code\n\n- Kris\
