    \ 标准相比具有某些显著的行为差异。\n\n## 第 5 章\n\n## 错误处理\n\n使用 promise 最大的好处之一是它们允许你处理错误。使用回调进行异步错误处理可能会因为每个函数中的样板检查而迅速使代码库变得混乱。幸运的是，promise\
    \ 允许你用一个函数的处理程序替换那些重复的检查。\n\npromise 的错误处理 API 本质上是一个名为 catch 的函数。然而，在使用该函数时有一些额外事项需要注意。例如，它允许你模拟一个异步的\
    \ try/catch/finally 序列。而且，由于忘记在 catch 回调内部重新抛出错误很容易无意中吞掉错误。\n\n本章将引导你练习错误处理，以便编写健壮的代码。它包含了使用标准\
    \ Promise API 的示例以及 Bluebird promise 库提供的选项。\n\n## 拒绝 promise (Rejecting Promises)\n\
    \n第 2 章通过 catch 方法引入了 promise 的基础错误处理。你已经了解被拒绝的 promise 如何调用通过 catch 方法注册的回调（在示例\
