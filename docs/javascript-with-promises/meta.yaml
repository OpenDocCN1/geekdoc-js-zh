    \ for this is included in the WHATWG Streams specification for performing I/O.\
    \ The spec contains sample code for sequentially reading all the data from a stream\
    \ in a series of chunks. Each call to return a chunk of data and a done property\
    \ indicating that the stream is exhausted.\n\nExample 3-14. Conditionally expanding\
    \ a chain based on the outcome of a preceding promise\n\n```javascript\nfunction\
    \ readAllChunks(readableStream) {\n  var reader = readableStream.getReader();\n\
    \  var chunks = [];\n\n  return pump();\n\n  function pump() {\n    reader.read().then(function\
