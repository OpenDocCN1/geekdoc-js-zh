    \    }\n).then(\n    function step3() {\n    console.log('This is also never run');\n\
    \    }\n).catch(function (error) {\n    console.log('Something failed along the\
    \ way. Inspect error for info.');\n    console.log(error); // Error object with\
    \ message: 'bad news'\n});\n// Console output:\n// Something failed along the\
    \ way. Inspect error for info.\n// [Error object] { message: 'bad news' }\n```\n\
    \nThis code begins a chain of promises by creating a rejected promise using Promise.reject().\
    \ Two more promises follow that are created by adding calls to them and finished\
    \ with a call to catch to handle rejections. Notice the code in step2 and step3\
    \ never runs. These functions are only called when the promise they are attached\
