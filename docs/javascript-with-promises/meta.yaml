  md: "# Sending Errors to a Generator\n\nAn iterator can cause an error to be thrown\
    \ when execution resumes inside a generator. Example 6-22 is a contrived scenario\
    \ to demonstrate the functionality. The example prints hello in several of languages\
    \ that a generator provides. An error is thrown when there is no translation available\
    \ for the language. Note the call to `iterator.throw()` at the bottom of the example.\n\
    \n6-22. Throwing errors with the iterator\n\n```\nfunction languages() {\n  try\
    \ {\n    yield 'English';\n    yield 'French';\n    yield 'German';\n    yield\
    \ 'Spanish';\n  } catch (error) {\n    console.log(error.message);\n  }\n}\n```\n\
    \n```\nvar greetings = {\n  English: 'Hello',\n  French: 'Bonjour',\n  Spanish:\
    \ 'Hola'\n};\nvar iterator = languages();\nvar result;\nvar word;\nwhile ((result\
    \ = iterator.next()).done !== true) {\n  word = greetings[result.value];\n  if\
    \ (word) console.log(word);\n  else iterator.throw(Error('Missing translation\
    \ for ' + result.value));\n}\n```\n\n```\n// Console output:\n// Hello\n// Bonjour\n\
    // Missing translation for German\n```\n\nWhen the iterator yields 'German' there\
    \ is no translation for that language so an error is sent to the generator using\
    \ iterator.throw().. The error is thrown inside the generator where the yield\
    \ 'German' expression is evaluated. The yield 'Spanish' statement is skipped,\
    \ as the error immediately falls to the catch block. Sending an error back to\
    \ the generator in this example is not useful, this ability is needed to write\
    \ synchronous-looking code using promises and generators."
  merge: -1
  pgno: 85
- img_proc: true
  md: "# Practical Application\n\nNow let we revisit Example 6-13 from \"Synchronous\
    \ Style\" on page 69 to see how it works. Example 6-23 repeats the code here for\
    \ convenience.\n\nExample 6-23. Using a promise with code that looks synchronous\
    \ (repeated from earlier)\n\n```\nasync(function*) () {\n  try {\n    var img\
    \ = yield loadImage('thesis_defense.png');\n    document.body.appendChild(img);\n\
    \  } catch (err) {\n    console.log('caught in async routine');\n    console.log(err);\n\
    \  }\n}();\n```\n\nThe loadImage function is called in the body of a generator.\
    \ Although loadImage returns a promise, the yield statement inside the generator\
    \ returns the fulfillment value of that promise: an image object in this case.\
    \ How is that possible? Instead of directly creating an iterator from the generator\
    \ and invoking iterator.next(), the generator is passed to async, which returns\
    \ a wrapper function. When the wrapper is invoked it triggers a promise that the\
    \ generator yields and waits for it to settle. Once the promise is fulfilled the\
    \ value is passed into the generator. If the promise is rejected reason is thrown\
    \ inside the generator.\n\nThere are several ways to implement the async function.\
    \ Example 6-24 shows one way based on code written by Forbes Lindesay on promisejs.org.\n\
    \nExample 6-24. Sample async wrapper\n\n```\nfunction async(generator) {\n  return\
    \ function () {\n    var iterator = generator.apply(this, arguments);\n\n    function\
    \ handle(result) {\n      if (result.done) return Promise.resolve(result.value);\n\
    \n      return Promise.resolve(result.value).then(function (res) {\n        return\
    \ handle(iterator.next(res));\n      }, function (err) {\n        return handle(iterator.throw(err));\n\
    \      });\n    }\n\n    try {\n      return handle(iterator.next());\n    } catch\
    \ (ex) {\n      return Promise.reject(ex);\n    }\n  };\n}\n```"
  merge: -1
  pgno: 86
- img_proc: true
  md: "}\n\n};\n\nThe wrapper function returns a promise that the return value of\
    \ the generator fulfills or any unhandled error rejects. This behavior is identical\
    \ to any callback registered with promise.then() or .catch(). If you prefer handling\
    \ errors with promise.catch instead of traditional try/catch blocks, you can attach\
    \ a catch to the promise that the async wrapper returns, as shown in Example 6-25.\n\
    \nExample 6-25. Replacing try/catch with promise.catch()\n\n```\nasync(function()\
    \ {\\n  var img = yield loadImage('thesis_defense.png');\\n  document.body.appendChild(img);\n\
    }).catch(function (err) {\\n  console.log('caught in rejection handler');\\n \
    \ console.log(err);\n});\n```\n\nSome libraries provide a function similar to\
    \ async, such as Q.async() and Bluebird.coroutine(). Using these functions to\
    \ wrap a single call to a promise is probably overkill, but this style is useful\
    \ when dealing with multiple asynchronous steps in a single function because you\
    \ can replace all the promise.then() callbacks with synchronous return values.\n\
    \nThere is a plan to introduce async and await keywords in ECMAScript 7, as shown\
    \ in Example 6-26, that will remove the need for the async(generator) pattern\
    \ described in this section.\n\nExample 6-26. Using async and await as proposed\
    \ in ES7\n\n```\nasync function() {\\n  try {\\n    var img = await loadImage('thesis_defense.png');\\\
    n    document.body.appendChild(img);\n  } catch (err) {\\n    console.log('caught\
    \ in rejection handler');\\n    console.log(err);\n  }\\n};\n```\n\nThe proposed\
    \ syntax allows you to declare an async function instead of a generator. Since\
    \ the function is not a generator, the yield keyword is replaced with await. All\
    \ other parts of the code are identical and this function behaves the same as\
    \ its ES6 counterpart. The purpose is to remove the burden of supplying a boilerplate\
    \ async function."
  merge: -1
  pgno: 87
