  md: "other implementations, including the native version in the V8 Script engine\
    \ used by Node.js and Google Chrome. Bluebird's author Petka Antonov says native\
    \ implementations are more focused on matching behavior specifications than performance\
    \ optimization, which allows finely tuned JavaScript to outperform native code.\n\
    \nBluebird offers many other features including elegant ways of managing execution\
    \ context, wrapping Node.js APIs, working with collections of promises, and manipulating\
    \ fulfilling values.\n\n# Loading Bluebird\n\nWhen Bluebird is included in a web\
    \ page use overwrites the global Promise object by default with its own version\
    \ of Promise. Bluebird can also be loaded in the browser in other ways, such as\
    \ an AMD module using require.js, and it is available as an npm package for use\
    \ in Node.js.\n\nThe Promise object can serve as a drop-in replacement or polyfill\
    \ for the ES6 Promise. When the Bluebird script is loaded in a browser it overwrites\
    \ the global Promise object. However, you can use Promise.conflict() after loading\
    \ Bluebird to restore the global Promise object to its previous reference in order\
    \ to run Bluebird by side with native promises. As explained in the earlier section\
    \ on interoperability and thenables, you can treat other promise implementations\
    \ as Bluebird promises by wrapping them [Bluebird Promise].resolve(promise). In\
    \ Example 4-2, Bluebird wraps a native promise to expose that reveal its state.\n\
    \nExample 4-2. Wrap a native promise with a Bluebird promise\n\n```\n// Assume\
    \ bluebird has been loaded using <script src=\"bluebird.js\"></script>\nvar Bluebird\
    \ = Promise.noConflict(); // Restore previous reference to Promise\nvar nativePromise\
    \ = Promise.resolve(); // Native Promise\nvar b = Bluebird.resolve(nativePromise);\
    \ // Wrap native promise with Bluebird promise\n\n// Force event loop to turn\n\
    setTimeout(function () {\n  console.log('Pending? ' + b.isPending()); // Pending?\
    \ false\n  console.log('Fulfilled? ' + b.isFulfilled()); // Fulfilled? true\n\
    \  console.log('Rejected? ' + b.isRejected()); // Rejected? false\n}, 0);\n```\n\
    \nThe remaining examples in this chapter that relate to Bluebird assume that all\
