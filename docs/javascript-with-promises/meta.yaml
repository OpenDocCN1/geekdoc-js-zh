- md: "\n# Summary\n\nThis chapter covered a number of scenarios that are likely to\
    \ arise when using promises. It showed how one async function affects all the\
    \ functions that come before it in the call stack. It also showed how to process\
    \ an arbitrary number of tasks sequentially or in parallel. And how to build processing\
    \ pipelines by chaining promises together.\n\nAll the topics in this chapter were\
    \ addressed using the standard Promise API. This discussion is continued in Chapter\
    \ 4 using expanded APIs that some promise libraries and frameworks provided.\n\
    \n# CHAPTER 4\n\n## Using Libraries and Frameworks\n\nBefore the ES6 Promise API\
    \ existed, many JavaScript libraries and frameworks implemented their own version\
    \ of Promises. Some libraries were written for the sole purpose of providing promises\
    \ while established libraries like jQuery added them to handle their async APIs.\n\
    \nPromise libraries can act as polyfills in older web browsers and other environments\
    \ where native promises are not provided. They can also supplement the standard\
    \ API with a wide set of functions for managing promises. If your code only uses\
    \ promises that you create, you're in a good position to choose a library and\
    \ take full advantage of its extended API. And if you are handling promises that\
    \ other libraries produced, you can wrap those promises with ones from your chosen\
    \ library to access the additional features.\n\nThis chapter focuses on nonnative\
    \ promise implementations. The majority of the chapter covers Bluebird, a fast\
    \ and robust promise library. Although Bluebird is a compelling choice, there\
    \ are other good options. For example, the Q promise library predates Bluebird\
    \ and is widely used in applications and frameworks including AngularJS. Q and\
    \ other libraries are not discussed in detail; this is not a guide to choosing\
    \ between libraries. It is an introduction to the enhancements that third-party\
    \ libraries offer to demonstrate their value. The Promise implementation in jQuery\
    \ is also discussed because of jQuery's immense popularity. However, this is not\
    \ a complete walk-through of either Bluebird or jQuery. These open source projects\
    \ evolve rapidly, so refer to the official online documentation for full details\
    \ of the current features.\n\n# Promise Interoperability and Thenables\n\nBefore\
    \ diving into the details of specific libraries, let's discuss how promises from\
    \ different libraries can be used with one another. The basis of all interoperability\
    \ between promise implementations is the *thenable* contract. Any object with\
    \ a `then(onFilled, onRejected)` method can be wrapped by any standard promise\
    \ implementation.\n\nAs Kris Kowal wrote when reviewing this chapter, \"...regardless\
    \ of what onfilled and onRejected returns, and in fact regard of whether onfilled\
    \ or onRejected are executed synchronously or asynchronously, [thenable] is sufficient\
    \ for any of these Promise implementations to coerce the thenable into a well-behaved,\
    \ always returning capital-P Promise, promise. This is particularly important\
    \ when consuming promises from unrelated third parties, where unreachable can\
    \ be as innocuous as a backward incompatible version of the same.\n\nExample 4-1:\
    \ an example of a simple thenable object wrapped with a standard promise.\n\n\
    Example 4-1. Wrapping a thenable for interoperability\n\n```javascript\nfunction\
    \ thenable(value) {\n  return {\n    then: function (onfill, reject) {\n     \
    \ onfill(value);\n    }\n  };\n}\n```\n\n```javascript\nvar promise = Promise.resolve(thenable('voila!'));\n\
    promise.then(function(result) {\n  console.log(result);\n});\n```\n\n```javascript\n\
    // Console output:\n// voila!\n```\n\nAlthough it is unlikely you will encounter\
    \ such a thenable in your own code, the same concept applies to wrapping promises\
    \ from other implementations to work as the promise implementation that your code\
    \ prefers.\n\n# The Bluebird Promise Library\n\nBluebird is an open source promise\
    \ library with a rich API and excellent performance. The Bluebird GitHub repo\
    \ includes benchmarks that show it outperforming other implementations, including\
    \ the native version in the V8 Script engine used by Node.js and Google Chrome.\
    \ Bluebird's author Petka Antonov says native implementations are more focused\
    \ on matching behavior specifications than performance optimization, which allows\
    \ finely tuned JavaScript to outperform native code.\n\nBluebird offers many other\
    \ features including elegant ways of managing execution context, wrapping Node.js\
    \ APIs, working with collections of promises, and manipulating fulfilling values.\n\
    \n# Loading Bluebird\n\nWhen Bluebird is included in a web page, it overwrites\
    \ the global Promise object by default with its own version of Promise. Bluebird\
    \ can also be loaded in the browser in other ways, such as an AMD module using\
    \ require.js, and it is available as an npm package for use in Node.js.\n\nThe\
    \ Promise object can serve as a drop-in replacement or polyfill for the ES6 Promise.\
    \ When the Bluebird script is loaded in a browser it overwrites the global Promise\
    \ object. However, you can use `Promise.conflict()` after loading Bluebird to\
    \ restore the global Promise object to its previous reference in order to run\
    \ Bluebird by side with native promises. As explained in the earlier section on\
    \ interoperability and thenables, you can treat other promise implementations\
    \ as Bluebird promises by wrapping them with `BluebirdPromise.resolve(promise)`.\
    \ In Example 4-2, Bluebird wraps a native promise to expose its reveal state.\n\
    \nExample 4-2. Wrap a native promise with a Bluebird promise\n\n```javascript\n\
    // Assume bluebird has been loaded using <script src=\"bluebird.js\"></script>\n\
    var Bluebird = Promise.noConflict(); // Restore previous reference to Promise\n\
    var nativePromise = Promise.resolve(); // Native Promise\nvar b = Bluebird.resolve(nativePromise);\
    \ // Wrap native promise with Bluebird promise\n\n// Force event loop to turn\n\
    setTimeout(function () {\n  console.log('Pending? ' + b.isPending()); // Pending?\
    \ false\n  console.log('Fulfilled? ' + b.isFulfilled()); // Fulfilled? true\n\
    \  console.log('Rejected? ' + b.isRejected()); // Rejected? false\n}, 0);\n```\n\
    \nThe remaining examples in this chapter.\n\n# Managing Execution Context\n\n\
    Callbacks frequently need access to variables in their enclosing scope. Two common\
    \ ways of accessing these variables are shown in Example 4-3.\n\nExample 4-3.\
    \ Using the enclosing scope through `bind()` or aliasing\n\n```javascript\nvar\
    \ printer = {\n  pageSize: 'LETTER',\n\n  connect: function () {\n    console.log('Setting\
    \ page size to ' + this.pageSize);\n  },\n\n  configure: function (pageSize) {\n\
    \    this.pageSize = pageSize;\n    return this.connect().then(function () {\n\
    \      console.log('Printing job using ' + this.pageSize);\n    });\n  },\n\n\
    \  print: function (job) {\n    var me = this;\n    return this.connect().then(function\
    \ () {\n      console.log('Printing job using ' + me.pageSize);\n    });\n  }\n\
    };\n\nprinter.configure('A4').then(function () {\n  printer.print('Test');\n});\n\
    ```\n\n```javascript\n// Console output:\n// Setting page size to A4\n// Printing\
    \ job using A4\n```\n\nThe `configure` method uses `bind(this)` to share its context\
    \ with the callback. The `print` method aliases the outer context to a variable\
    \ named `me` to access it inside the callback.\n\nBluebird offers an alternative\
    \ to exposing the enclosing scope by adding a `.bind()` method that sets the context\
    \ for all subsequent callbacks in a promise chain, as shown in Example 4-4.\n\n\
    # Example 4-4. Setting callback contexts using `promise.bind()`\n\n```javascript\n\
    printer.shutdown = function () {\n  this.connect().bind(this).then(function ()\
    \ {\n    console.log('First callback can use ' + this.pageSize);\n  }).then(function\
    \ () {\n    console.log('Second callback can use ' + this.pageSize);\n  });\n\
    };\n```\n\n```javascript\n// Console output:\n// First callback can use A4\n//\
    \ Second callback can use A4\n```\n\nUsing `bluebirdPromise.bind()` has an advantage\
    \ over the previous two solutions because it removes the call to `bind` for individual\
    \ functions in a long chain and avoids adding a reference to the enclosing scope\
    \ of each callback.\n\n# Wrapping Node.js Functions\n\nNode.js has a standard\
    \ way of using callbacks in async functions. The node-style expects a callback\
    \ as the last argument of a function. The first parameter of the call-\n"
  mdcn: "\n\n# 总结\n\n本章涵盖了在使用 promise 时可能出现的多种场景。它展示了一个异步函数如何影响调用栈中排在它之前的所有函数。它还展示了如何顺序或并行处理任意数量的任务，以及如何通过链式调用\
    \ promise 构建处理流水线。\n\n本章中的所有主题都是使用标准的 Promise API 处理的。第 4 章将继续使用某些 promise 库和框架提供的扩展\
