    # Using the Stack\n\nIt is often helpful to examine the stack when troubleshooting\
    \ code because it answers the question How did I get here? Whenever a function\
    \ is invoked, the line that called the function is added to the stack. When an\
    \ error occurs, the stack contains the trail of calls that shows how the machine\
    \ arrived at that point. A typical view of the stack lists the name of each function\
    \ in the trail and the line number of the code that called the next.\n\nThe JavaScript\
    \ call stack starts with whatever code the runtime inside the current turn of\
    \ the event loop. The stack continues to grow as that code calls another function,\
    \ which in turn calls another function, etc. As each function returns, it is removed\
    \ from the stack until the stack is empty, as which point the event loop turns\
    \ again.\n\nExample 5-11 shows a function that is called whenever clicking the\
    \ mouse or pressing a key along with the associated call stack."
