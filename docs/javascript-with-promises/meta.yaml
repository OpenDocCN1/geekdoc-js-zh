    \  var customScaleTo = scaleToFit.bind(null, 300, 450);\n  var customWatermark\
    \ = watermark.bind(null, 'The Estate Company');\n\n  return Promise.resolve(image)\n\
    \    .then(customScaleTo)\n    .then(customWatermark)\n    .then(grayscale);\n\
    }\n```\n"
