  md: '# CHAPTER 1

    # Asynchronous JavaScript


    The number of asynchronous JavaScript APIs is rapidly growing. Web applications
    asynchronously fetch data and load scripts in the browser. Node.js and its derivatives
    provide a host of APIs for asynchronous I/O. And new web specifications for Streams,
    Service Workers, and Font Loading all include asynchronous calls. These advancements
    broaden the capabilities of JavaScript applications, but using them without understanding
    how the async part works can result in unpredictable code that is difficult to
    maintain. Things work as expected in development or test environments but fail
    when deployed to end users because of variables such as network speed or hardware
    performance.


    This chapter explains how JavaScript works. We''ll cover callbacks, the event
    loop, and threading. Most of the information is not specific to Promises but provides
    the foundation you need to get the most out of Promises and the rest of this book.


    Let''s start with a code snippet that surprises people. The code makes an HTTP
    request using the XMLHttpRequest (XHR) object and uses a while loop runs for three
    seconds. Although it is generally bad practice to implement a delay with the while
    loop, it''s a good way to illustrate how JavaScript runs. Read the code in Example
    1-1 and decide whether the listener callback for the XHR object will ever be triggered.


    Example 1-1. Async XHR


    ```

    // Make an async HTTP request

    var async = true;

    var xhr = new XMLHttpRequest();

    xhr.open(''get'', ''data.json'', async);

    xhr.send();

    ```'
  merge: -1
  pgno: 10
- img_proc: true
  md: "```\n// Create a three second delay (don't do this in real life)\nvar timestamp\
    \ = Date.now() + 3000;\nwhile (Date.now() < timestamp);\n```\n\n// Now that three\
    \ seconds have passed,\n// add a listener to the xhr.load and xhr.error events\n\
    \n```\nfunction listener() {\n  console.log('greetings from listener');\n}\nxr.addEventListener('load',\
    \ listener);\nxr.addEventListener('error', listener);\n```\n\nHere are some common\
    \ opinions on whether listener is called:\n\n+   1. Yes, listener is always called\n\
    2. Not a chance, the addEventListener calls must run before xhr.send()\n3. Sometimes,\
    \ depending on whether the request takes more than three seconds\n\nThe correct\
    \ assessment is that listener is always called. Although the second and third\
    \ answers are common, they are incorrect because of the event loop model and run-to-completion\
    \ semantics in JavaScript. If you thought otherwise or would like a refresher\
    \ on these concepts, this chapter is for you.\n\n# Callbacks\n\nCallbacks are\
    \ the cornerstone of asynchronous JavaScript programming. As a JavaScript developer\
    \ you are probably familiar with callbacks, but just to be sure, Example 1-2 presents\
    \ a quick case of a callback that prints each of the elements in an array.\n\n\
    Example 1-2. example callback\n\n```\nvar cities = ['Tokyo', 'London', 'Boston',\
    \ 'Berlin', 'Chicago', 'New York'];\n\ncities.forEach(Function callback(city)\
    \ {\n  console.log(city);\n});\n```\n\n```\n// Console output:\n// Tokyo\n// London\n\
    // Boston\n// Berlin\n// Chicago\n// New York\n```"
  merge: -1
  pgno: 11
- img_proc: true
  md: "In short, a callback is a function provided to other code for invocation. Example\
    \ 1-2 uses an inline function to define the callback. That is a commonly used\
    \ style in JavaScript applications, but callbacks do not have to be declared inline.\
    \ Example 1-3 shows the equivalent code with the function declared in advance.\n\
    \nExample 1-3. Passing a callback as a predefined function\n\n```\nfunction callback(city)\
    \ {\n  console.log(city);\n}\n```\n\ncities.forEach(callback);\n\nWhether your\
    \ callbacks are inline functions or predefined is a matter of choice. As long\
    \ as you have a reference to a function, you can use it as a callback.\n\n# Asynchronous\
    \ JavaScript\n\nCallbacks can be invoked synchronously or asynchronously (i.e.,\
    \ before or after the function they are passed to). The array.forEach() method\
    \ used in the section invokes its callback receives asynchronously. An example\
    \ of a function that invokes its callback asynchronously is window.requestAnimationFrame().\
    \ Its callback is invoked between browser repaint intervals, as in Example 1-4.\n\
    \nExample 1-4. Callback being invoked asynchronously\n\n```\nfunction repositionElement()\
