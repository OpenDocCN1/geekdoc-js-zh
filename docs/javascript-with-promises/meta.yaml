    \ in the stack when the error occurs.\n\nLosing the stack between each callback\
    \ makes troubleshooting harder. The problem is not unique to promises; it exists\
    \ for any asynchronous callbacks. However, it can be a frequent source of frustration\
    \ when using promises. To address this problem in the debugger, the Chrome team\
    \ added an option to show the stack across turns of the event loop. Now you can\
