  md: "# Promise Interoperability and Thenables\n\nBefore diving into the details\
    \ of specific libraries, let's discuss how promises from different libraries can\
    \ be used with one another. The basis of all interoperability between promise\
    \ implementations is the *thenable* contract. Any object with a then(onFilled,onRejected)\
    \ method can be wrapped by any standard promise implementation.\n\nAs Kris Kowal\
    \ wrote when reviewing this chapter, \"...regardless of what onfilled and onRejected\
    \ returns, and in fact regard of whether onfilled or onRejected are executed synchronously\
    \ or asynchronously, [then] is sufficient for any of these Promise implementations\
    \ to coerce the thenable into a well-behaved, always returning capital-P Promise,\
    \ promise. This is particularly important when consuming promises from unrelated\
    \ third parties, where unreachable can be as innocuous as a backward incompatible\
    \ version of the same.\n\nExample 4-1 an example of a simple thenable object wrapped\
    \ with a standard promise.\n\nExample 4-1. Wrapping a thenable for interoperability\n\
    \n```\nfunction thenable(value) {\n  return {\n    then: function (onfill, reject)\
    \ {\n      onfill(value);\n    }\n  };\n}\n```\n\n```\nvar promise = Promise.resolve(thenable('voila!'));\n\
    promise.then(function(result) {\n  console.log(result);\n});\n```\n\n```\n// Console\
    \ output:\n// voila!\n```\n\nAlthough it is unlikely you will encounter such a\
    \ thenable in your own code, the same concept applies to wrapping promises from\
    \ other implementations to work as the promise implementation that your code prefers.\n\
    \n# The Bluebird Promise Library\n\nBluebird is an open source promise library\
    \ with a rich API and excellent performance. The Bluebird GitHub repo includes\
    \ benchmarks that show it outperforming"
  merge: -1
