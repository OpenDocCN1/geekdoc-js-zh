  - "[PAGE 71]\n\nExample 5-11. Sample call stack\n\n```\nfunction echo(text) {\n\
    \  console.log(text);\n  throw Error('oops');\n\n  // Example of call stack for\
    \ error when triggered by a mouse click:\n  // echo (line:3)\n  // showRandomNumber\
    \ (line:12)\n  // handleClick (line:16)\n}\n\nfunction showRandomNumber() {\n\
    \  echo(Math.random());\n}\n\ndocument.addEventListener('click', function handleClick()\
    \ {\n  showRandomNumber();\n});\n\ndocument.addEventListener('keypress', function\
    \ handleKeyPress() {\n  showRandomNumber();\n});\n```\n\nThe call stack shows\
    \ whether handleClick or handleKeyPress triggered the echo function. In a larger\
    \ project, knowing the execution path can go a long way towards finding the cause\
    \ of a problem.\n\nUnfortunately, the current call stack is generally not as helpful\
    \ as promises involved. In Example 5-12, we have revised Example 5-11 to call\
    \ the echo function using promise.then(). As a result, the call stack inside echo\
    \ no longer includes handleClick or showRandomNumber.\n\nExample 5-12. Promise\
    \ callback brings up the call stack\n\n```\nfunction echo(text) {\n  console.log(text);\n\
    \  throw Error('oops');\n\n  // Example of call stack for error when invoked as\
    \ a callback by a promise\n  // echo (line:3)\n}\n\nfunction showRandomNumber()\
    \ {\n  // Invoking echo as a promise callback\n  var p = Promise.resolve(Math.random());\n\
    \  p.then(echo).catch(function (error) {\n    console.log(error.stack)\n  });\n\
    }\n```"
  - "[PAGE 72]\n\n```\ndocument.addEventListener('click', function handleClick() {\n\
    \  showRandomNumber();\n});\n```\n\n```\ndocument.addEventListener('keypress',\
    \ function handleKeypress() {\n  showRandomNumber();\n});\n```\n\nWhy does using\
    \ a promise callback appear to truncate the stack compared to the earlier example?\
    \ Remember that promise invokes each callback in a separate turn of the event\
    \ loop. The beginning of each turn is empty, so none of the functions called in\
    \ previous turns appear in the stack when the error occurs.\n\nLosing the stack\
    \ between each callback makes troubleshooting harder. The problem is not unique\
    \ to promises; it exists for any asynchronous callbacks. However, it can be a\
    \ frequent source of frustration when using promises. To address this problem\
    \ in the debugger, the Chrome team added an option to show the stack across turns\
    \ of the event loop. Now you can see that stack is stitched together at the points\
    \ where asynchronous calls are. A dedicated panel for debugging promises in the\
    \ Chrome developer tools is also in the works. This is a huge help and other browsers\
    \ may offer a similar feature by the time you read.\n\nYou may also record errors\
    \ occur while people are using your software in the wild. When that happens, you\
    \ don't have the luxury of opening the debugger and looking at the stack. Developers\
    \ have found clever ways to capture the async call stack using multiple Error\
    \ objects. This is problematic because browsers expose the call stack for errors\
    \ in different ways and it can degrade application performance. You can configure\
    \ Bluebird to capture and report the stack trace across turns of the event loop\
    \ by calling Bluebird.longStackTraces(). Keep in mind the impact on performance\
    \ before enabling this option in the production version of your application.\n\
    \n# Summary\n\nHandling errors in asynchronous code cannot be done with traditional\
    \ try/catch blocks. Fortunately, promises have a catch method for handling asynchronous\
    \ errors. Although the method is a powerful tool for handling problems that occur\
    \ deep within your code, you must use it properly to avoid silently swallowing\
    \ errors. In addition to the functionality that the standard Promise API provides,\
    \ libraries such as Bluebird offer extra error handling features. This includes\
    \ the ability to report unhandled rejections and to capture the stack call across\
    \ multiple turns of the event loop."
- md: "\n# CHAPTER 6\n## Combining ECMAScript 6 Features with Promises\n\nECMAScript\
    \ 6 has a number of language features that complement promises. This chapter shows\
    \ how destructuring, arrow functions, iterators, and generators simplify your\
    \ promise-related code. However, this is not a full explanation of these features\
    \ or ES6. It is merely a starting point for taking advantage of ES6 in your code.\n\
    \nThe new syntax that these features requires errors in JavaScript environments\
    \ that do not support them. Unlike the Promise API that is unobtrusively polyfilled,\
    \ code that uses the new syntax must be modified in order to run in older environments.\
    \ You can automate the modification by transpiling the code into something equivalent\
    \ that runs in older environments. However, multiple JavaScript environments such\
    \ as Google Chrome and Mozilla Firefox already support some of these features.\
    \ The ECMAScript compatibility table maintained by Juri Zaytsev (a.k.a. kangax)\
    \ on GitHub is a good place to see which ES6 features are available on your target\
    \ platform.\n\n## Destructuring\n\nDestructuring provides a syntax for extracting\
    \ values from arrays or objects into individual variables. Instead of writing\
    \ individual assignment statements for each variable, destructuring allows you\
    \ to assign to multiple variables in a single statement. Examples 6-1 and 6-2\
    \ present destructuring using an array and an object.\n\nExample 6-1. Array destructuring\n\
    \n```javascript\nvar [n1, n2] = numbers;\nconsole.log(n1);      // 10\nconsole.log(n2);\
    \      // 20\n```\n\nExample 6-2. Object destructuring\n\n```javascript\nvar position\
    \ = {x: 50, y: 100};\nvar {x, y} = position;     // destructuring\nconsole.log(x);\
    \               // 50\nconsole.log(y);               // 100\n```\n\nThe destructuring\
    \ syntax can also be used when declaring function parameters. Chapter 3, an example\
    \ from the WHATWG Streams specification used a promise filled with an object containing\
    \ two properties: value and done. Example 6-3 is a comparison of how the onFulfilled\
    \ callback can be written with destructuring.\n\nExample 6-3. Object destructuring\
    \ with function parameters\n\n```javascript\n// Without destructuring\nreader.read().then(function(result)\
    \ {\n  // Use result.value and result.done\n});\n\n// Using destructuring\nreader.read().then(function\
    \ ({value, done}) {\n  // Use done and value directly\n});\n```\n\nArray destructuring\
    \ also works in function parameters. Example 4-16 mapped values from an array\
    \ to parameters enabled and lastLogin using bluebirdPromise.spread(). Example\
    \ 6-4 shows the equivalent code using destructuring.\n\nExample 6-4. Array destructuring\
    \ with function parameters\n\n```javascript\n// Without destructuring\ngetAccountStatus().then(function\
    \ (status) {\n  var enabled = status[0];\n  var lastLogin = status[1];\n  // ...\n\
    });\n\n// Using destructuring\ngetAccountStatus().then(function ([enabled, lastLogin])\
    \ {\n  // Use enabled and lastLogin directly\n});\n```\n\nArray destructuring\
    \ is also useful for handling the fulfillment value of Promise.all(), as seen\
    \ in Example 6-5.\n\nExample 6-5. Destructuring the fulfillment value from Promise.all()\n\
    \n```javascript\nPromise.all([promise1, promise2]).then(function ([result1, result2])\
    \ {\n  // ...\n});\n```\n\n## Arrow Functions\n\nThe arrow function syntax is\
    \ like shorthand for declaring anonymous functions. In lieu of a full explanation\
    \ of this new syntax, let's create a simple example using an arrow function and\
    \ then apply it to promises.\n\nArrow functions are useful for declaring callbacks\
    \ that you would typically write as inline functions. In \"Parallel Execution\"\
    \ on page 28, an array of bank and credit card accounts was mapped to results\
    \ for their current balance using code similar to Example 6-6.\n\nExample 6-6.\
    \ Using array.map() with an inline callback\n\n```javascript\nvar requests = accounts.map(function\
    \ (account) {\n  return ajax('/balances/' + account);\n});\n```\n\nThe code in\
    \ Example 6-6 can be rewritten as it appears in Example 6-7 using an arrow function.\n\
    \nExample 6-7. Using array.map() with an arrow function\n\n```javascript\nvar\
    \ requests = accounts.map(account => ajax('/balances/' + account));\n```\n\nThe\
    \ new syntax avoids the function keyword. When there is only one parameter, the\
    \ parentheses around the parameter may also be dropped. And when the body of the\
    \ function consists of a single return statement, the enclosing braces can be\
    \ left out as well. The noise created by the traditional syntax is stripped away,\
    \ leaving a concise piece of code.\n\nNow let's use the arrow syntax in a chain\
    \ of promises. The section \"Functional Composition\" on page 36 used the code\
    \ in Example 6-8 to create an image processing pipeline.\n\nExample 6-8. Concise\
    \ pipeline reined from earlier chapter\n\n```javascript\nfunction processImage(image)\
    \ {\n  // Image is last parameter preceded by any configuration parameters\n \
    \ var customScaleToFit = scaleToFit.bind(null, 300, 450);\n  var customWatermark\
    \ = watermark.bind(null, 'The Real Estate Company');\n\n  return Promise.resolve(image)\n\
    \    .then(customScaleToFit)\n    .then(customWatermark)\n    .then(grayscale);\n\
    }\n```\n\n**Example 6-9** shows a version of the pipeline using arrow functions\n\
    \nExample 6-9. Concise pipeline with arrow functions\n\n```javascript\nfunction\
    \ processImage(image) {\n  // Image is last parameter preceded by any configuration\
    \ parameters\n  var customScaleToFit = scaleToFit.bind(null, 300, 450);\n  var\
    \ customWatermark = watermark.bind(null, 'The Real Estate Company');\n\n  return\
    \ Promise.resolve(image)\n    .then(customScaleToFit)\n    .then(customWatermark)\n\
    \    .then(grayscale);\n}\n```\n\nThis version of the pipeline using arrow functions\
    \ allows you to keep the code concise and readable.\n\n## Iterables and Iterators\n\
    \nIterators differ from both because they allow any object to expose a series\
    \ of items. These are known as iterables.. Objects that want to expose items can\
    \ implement the iterable interface by defining a function whose name is Symbol.iterator.\
    \ This function should return an object with the iterator interface.\n\nThe iterator\
    \ interface has one method named next. The method returns an object with two properties\
    \ value and done. The value represents the current item in the iteration and the\
    \ done property is a flag to indicate when the series is exhausted.\n\nArrays\
    \ are iterables so they contain the Symbol.iterator method, as shown in Example\
    \ 6-10.\n\nExample 6-10. Using the iterable interface of an array\n\n```javascript\n\
    var array = [1, 2];\nvar iterator = array[Symbol.iterator]();\n\niterator.next();\
    \ // {value: 1, done: false}\niterator.next(); // {value: 2, done: false}\niterator.next();\
    \ // {value: undefined, done: true}\n```\n\nHow do iterables relate to promises?\
    \ The Promise.all() and Promise.race() functions accept both. Although an array\
    \ is probably the most common type of iterable you would use with these functions,\
    \ other options are available. For instance, the Set datatype ES6 is also an iterable.\
    \ You can pass a set to Promise.all() or you can use a custom iterable by implementing\
    \ the interface on an object.\n\n# Generators\n\nES6 includes a featured generators\
    \ that allows you to write async synchronous code. Generators are not easy to\
    \ explain in a few sentences. Let's begin with the end in mind by showing the\
    \ style of async code that can be written when you combine promises and generators.\
    \ We'll work through the individual concepts required to understand that code.\n\
    \n# Synchronous Style\n\nLet's use the async loadImage function in Example 6-11\
    \ as a starting point for the discussion.\n\nExample 6-11. Managing async loading\
    \ using a promise\n\n```javascript\nloadImage('thesis_defense.png').then(function\
    \ (img) {\n  document.body.appendChild(img);\n}).catch(function (e) {\n  console.log('Error\
    \ occurred while loading image');\n});\n```\n"
  mdcn: "\n\n# 第 6 章\n## 将 ECMAScript 6 特性与 Promises 结合\n\nECMAScript 6 拥有许多补充 Promise\
    \ 的语言特性。本章将展示解构、箭头函数、迭代器和生成器如何简化与 相关的代码。然而，这并不是对这些特性或 ES6 的完整解释。它仅仅是在你的代码中利用 ES6\
    \ 的起点。\n\n这些特性所需的新语法会在不支持这些特性的 JavaScript 环境中报错。与可以无侵入式填充（polyfilled）的 Promise\
    \ API 不同，使用新语法的代码必须修改才能在旧环境中运行。你可以通过将代码编译为可以在旧环境中运行的等效代码来实现自动化修改。然而，Google Chrome\
    \ 和 Mozilla Firefox 等多个 JavaScript 环境已经支持了这些特性中的某些。Juri Zaytsev（又名 kangax）在 GitHub\
    \ 上维护的 ECMAScript 兼容性表是查看你的目标平台支持哪些 ES6 特性的好去处。\n\n## 解构\n\n解构提供了一种从数组或对象中提取值到单个变量的语法。与其为每个变量编写单独的赋值语句，解构允许你在单条语句中为多个变量赋值。示例\
    \ 6-1 和 6-2 展示了使用数组和对象的解构。\n\n示例 6-1. 数组解构\n\n```javascript\nvar [n1, n2] = numbers;\n\
    console.log(n1);      // 10\nconsole.log(n2);      // 20\n```\n\n示例 6-2. 对象解构\n\
    \n```javascript\nvar position = {x: 50, y: 100};\nvar {x, y} = position;     //\
    \ 解构\nconsole.log(x);               // 50\nconsole.log(y);               // 100\n\
    ```\n\n解构语法也可以用于声明函数参数。在第 3 章中，来自 WHATWG Streams 规范的一个示例使用了一个包含两个属性（value 和 done）的对象的填充的\
    \ Promise。示例 6-3 比较了如何使用解构编写 `onFulfilled` 回调。\n\n示例 6-3. 带函数参数的对象解构\n\n```javascript\n\
    // 不使用解构\nreader.read().then(function(result) {\n  // 使用 result.value 和 result.done\n\
    });\n\n// 使用解构\nreader.read().then(function ({value, done}) {\n  // 直接使用 done\
    \ 和 value\n});\n```\n\n数组解构同样适用于函数参数。示例 4-16 使用 `bluebirdPromise.spread()` 将数组中的值映射到参数\
    \ `enabled` 和 `lastLogin`。示例 6-4 展示了使用解构的等效代码。\n\n示例 6-4. 带函数参数的数组解构\n\n```javascript\n\
    // 不使用解构\ngetAccountStatus().then(function (status) {\n  var enabled = status[0];\n\
    \  var lastLogin = status[1];\n  // ...\n});\n\n// 使用解构\ngetAccountStatus().then(function\
    \ ([enabled, lastLogin]) {\n  // 直接使用 enabled 和 lastLogin\n});\n```\n\n数组解构对于处理\
    \ `Promise.all()` 的完成值也非常有用，如示例 6-5所示。\n\n示例 6-5. 解构 Promise.all() 的完成值\n\n```javascript\n\
    Promise.all([promise1, promise2]).then(function ([result1, result2]) {\n  // ...\n\
    });\n```\n\n## 箭头函数\n\n箭头函数的语法类似于声明匿名函数的简写。与其对这种新语法进行完全解释，让我们先创建一个使用箭头函数的简单示例，然后将其应用于\
    \ Promise。\n\n箭头函数用于声明你通常会写成内联函数的调。在第 28 页的“并行执行”中，一个银行和信用卡账户数组通过类似于示例 6-6 的代码映射到它们当前余额的结果上。\n\
    \n示例 6-6. 使用 array.map() 配合内联回调\n\n```javascript\nvar requests = accounts.map(function\
    \ (account) {\n  return ajax('/balances/' + account);\n});\n```\n\n示例 6-6 中的代码可以使用箭头函数重写为如示例\
    \ 6-7 所示的形式。\n\n示例 6-7. 使用箭头函数的 array.map()\n\n```javascript\nvar requests = accounts.map(account\
    \ => ajax('/balances/' + account));\n```\n\n新语法规避了 `function` 关键字。当只有一个参数时，参数周围的括号也可以省略。而且，当函数体由单条返回（`return`）语句组成时，外层的大括号也可以省略。传统语法产生的噪音被去除了，留下了一段简洁的代码。\n\
    \n现在让我们在 Promise 链中使用箭头语法。第 36 页的“函数式组合”部分使用了示例 6-8 中的代码创建一个图像处理流水线。\n\n示例 6-8.\
    \ 从前面的章节精炼的简洁流水线\n\n```javascript\nfunction processImage(image) {\n  // image\
    \ 是最后一个参数，前面跟有任何配置参数\n  var customScaleToFit = scaleToFit.bind(null, 300, 450);\n\
    \  var customWatermark = watermark.bind(null, 'The Real Estate Company');\n\n\
    \  return Promise.resolve(image)\n    .then(customScaleToFit)\n    .then(customWatermark)\n\
    \    .then(grayscale);\n}\n```\n\n**示例 6-9** 展示了使用箭头函数的流水线版本\n\n示例 6-9. 使用箭头函数的简洁流水线\n\
    \n```javascript\nfunction processImage(image) {\n  // image 是最后一个参数，前面跟有任何配置参数\n\
    \  var customScaleToFit = scaleToFit.bind(null, 300, 450);\n  var customWatermark\
    \ = watermark.bind(null, 'The Real Estate Company');\n\n  return Promise.resolve(image)\n\
    \    .then(customScaleToFit)\n    .then(customWatermark)\n    .then(grayscale);\n\
    }\n```\n\n这个使用箭头函数的流水线版本允许你保持代码的简洁易读。\n\n## 可迭代对象和迭代器\n\n迭代器与两者都不同，因为它们允许任何对象暴露一系列项目。这些被称为“可迭代对象”（iterables）。想要暴露项目的对象可以通过定义一个名为\
    \ `Symbol.iterator` 的函数来实现可迭代接口。该函数应该返回一个具有迭代器接口的对象。\n\n迭代器接口有一个名为 `next` 的方法。该方法返回一个具有两个属性\
    \ `value` 和 `done` 的对象。`value` 代表迭代中的当前项目，`done` 属性是一个指示序列何时结束的标志。\n\n数组是迭代对象，因此它们包含\
    \ `Symbol.iterator` 方法，如示例 6-10 所示。\n\n示例 6-10. 使用数组的可迭代接口\n\n```javascript\n\
    var array = [1, 2];\nvar iterator = array[Symbol.iterator]();\n\niterator.next();\
    \ // {value: 1, done: false}\niterator.next(); // {value: 2, done: false}\niterator.next();\
    \ // {value: undefined, done: true}\n```\n\n可迭代对象与 Promise 有什么关系？`Promise.all()`\
    \ 和 `Promise.race()` 函数接受两者。虽然数组可能是你与这些函数最常用的迭代对象类型，但还有其他选择。例如，ES6 的 `Set` 数据类型也是迭代对象。你可以将\
    \ set 传递给 `Promise.all()`，或者通过在对象上实现接口自定义迭代对象。\n\n# 生成器\n\nES6 包含了生成器，允许你编写异步同步代码。生成器很难用几句话来解释。让我们以结果为目标，展示结合\
    \ Promise 和生成器可以编写的异步代码风格。我们将学习理解代码所需的概念。\n\n# 同步样式\n\n让我们以示例 6-11 中的异步 `loadImage`\
    \ 函数作为讨论的起点。\n\n示例 6-11. 使用 promise 管理异步加载\n\n```javascript\nloadImage('thesis_defense.png').then(function\
    \ (img) {\n  document.body.appendChild(img);\n}).catch(function (e) {\n  console.log('Error\
    \ occurred while loading image');\n});\n```\n\n"
