    \ Reactive programming libraries such as RxJS, Bacon.js, and Kefir.js are specifically\
    \ intended for scenarios like this.\n\n# Functional Composition\n\nEarlier in\
    \ the book you saw how promise chains are useful in orchestrating a series of\
    \ async steps. The same pattern is also good for building pipelines of functions.\
    \ This technique of combining several functions into a more powerful composite\
    \ is known as functional composition, and it divides code into discrete units\
    \ that are easier to test and maintain.\n\nLet’s use a website for a large real\
    \ estate agency Example 3-16. Each agent in the company has a web page with her\
    \ picture and contact information. All the photos are displayed in the same size\
    \ in black and white and include the company name. You can create a pipeline that\
