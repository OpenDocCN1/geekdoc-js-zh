    \ promise 回调，每次对 `chain` 的递归调用都位于调用栈的顶端。\n\n虽然使用递归的示例 3-12 与使用循环构建链具有相同的最终结果，但这两种方法之间存在着有趣的区别。使用循环在开始时构建了整个\
    \ promise 链，而无需等待任何 promise 解析。递归方法则在解析前一个 promise 后按需向链中添加内容。按需方法的一个主要优势是，可以根据前一个\
    \ promise 的结果来决定是否继续链式调用。\n\n最后几个示例创建了预先定义步数的链，如示例 3-14 所示。一个极佳的例子位于 WHATWG Streams\
    \ 规范中，用于执行 I/O。该规范包含了示例代码，用于从一系列数据块中从流中顺序读取所有数据。每次调用都会返回一个数据块以及一个表示流已耗尽的 `done`\
    \ 属性。\n\n示例 3-14. 根据前一个 promise 的结果条件扩展链\n\n```javascript\nfunction readAllChunks(readableStream)\
    \ {\n  var reader = readableStream.getReader();\n  var chunks = [];\n\n  return\
    \ pump();\n\n  function pump() {\n    reader.read().then(function (result) {\n\
    \      if (result.done) {\n        return chunks;\n      }\n      chunks.push(result.value);\n\
    \      return pump();\n    });\n  }\n};\n```\n\n`pump` 函数将每个数据块追加到数组中，并递归地调用自己，直到\
    \ `result.done` 信号指示没有可用数据。\n\n> 规范中的代码使用了箭头函数配合对象解构，而这里原本是传统的函数声明。对象解构和箭头函数将在第\
    \ 6 章中讨论。\n\n你可能没有立即构建顺序 promise 链的需求，但这种情况将不可避免地发生。如果你使用库来补充标准 promise，此功能可能被包含在内。库将在第\
    \ 4 章进行详细讨论。\n\n构建长 promise 链可能消耗大量的内存。务必对你的代码进行插桩和测试，以防止意外的性能问题。\n\n![](img/86b9481a293cab930786a4c67d908e3e_44_0.png)\n\
    \n# 管理延迟\n\n当你有一个封装了异步网络请求的 promise 时，你应该等待该 promise 履行多久呢？实际时间取决于你代码无法控制的许多因素。你可以通过强制时间限制来防止应用程序进入长时间或无尽等待的状态。\n\
    \n示例 3-15 中的 `getData` 函数返回一个带有从服务器获取的最新数据的 promise。它会并发从缓存中提取现有数据，以备服务器响应不够快使用。如果缓存和服务器都没有及时响应，`getData`\
    \ 返回的 promise 将被拒绝。每种结果都由一个 promise 表示。使用 `Promise.race()` 来选择第一个可用结果。\n\n示例 3-15.\
    \ 使用 `Promise.race()` 管理响应时间\n\n```javascript\nfunction getData() {\n  var timeAllowed\
    \ = 500; // 毫秒\n  var deadline = Date.now() + timeAllowed;\n\n  var freshData\
    \ = ajax(*url*/);\n\n  var cachedData = fetchFromCache().then(function (data)\
    \ {\n    return new Promise(function (resolve) {\n      var timeRemaining = Math.max(deadline\
    \ - Date.now(), 0);\n      setTimeout(function () {\n        resolve(data);\n\
    \        timeRemaining;\n      });\n    });\n  });\n\n  var failure = new Promise(function\
    \ (resolve, reject) {\n    setTimeout(function () {\n      reject(new Error('Unable\
    \ to fetch data in allotted time'));\n    }, timeAllowed);\n  });\n  return Promise.race([freshData,\
    \ cachedData, failure]);\n}\n```\n\n# 函数组合\n\n在书的前面你看到了 promise 链对于编排步骤非常有用。这种将多个函数组合成离散单元的技术被称为**函数组合**。示例中的图像处理函数都是通用的。它们不了解房地产网站，可以存在于第三方库中。包含管道的\
    \ `processImage` 函数是唯一具有领域知识的部分。它按要求的组合函数并提供必要的参数。\n\n示例 3-16. 详细的管道\n\n```javascript\n\
    // 通用图像处理\nfunction scaleToFit(width, height, image) {\n  console.log('Scaling\
    \ image to ' + width + ' x ' + height);\n  return image;\n}\n```\n\n```javascript\n\
    function watermark(text, image) {\n  console.log('Watermarking image with ' +\
    \ text);\n  return image;\n}\n```\n\n```javascript\nfunction grayscale(image)\
    \ {\n  console.log('Converting image to grayscale');\n  return image;\n}\n```\n\
    \n```javascript\n// 图像管道\nfunction processImage(image) {\n  return Promise.resolve(image).then(function\
    \ (image) {\n    return scaleToFit(300, 450, image);\n  }).then(function (image)\
    \ {\n    return watermark('The Estate Company', image);\n  }).then(function (image)\
    \ {\n    return grayscale(image);\n  });\n}\n\n// processImage() 的控制台输出:\n// Scaling\
    \ image to 300 x 450\n// Watermarking image with The Estate Company\n// Converting\
    \ image to grayscale\n```\n\n`processImage` 函数可以简化，如示例 3-17 所示，通过将传统的 promise\
    \ 链替换为预先配置了宽度、高度和水印文本所需参数的函数链。\n\n示例 3-17. 简洁的管道\n\n```javascript\n// 替换上一个示例中的\
    \ processImage\nfunction processImage(image) {\n  //  是最后一个参数，之前跟随着任何配置参数\n  var\
    \ customScaleTo = scaleToFit.bind(null, 300, 450);\n  var customWatermark = watermark.bind(null,\
    \ 'The Estate Company');\n\n  return Promise.resolve(image)\n    .then(customScaleTo)\n\
    \    .then(customWatermark)\n    .then(grayscale);\n}\n```\n\n"
