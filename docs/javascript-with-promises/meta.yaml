  md: "# Managing Execution Context\n\nCallbacks frequently need access to variables\
    \ in their enclosing scope. Two common ways of accessing those variables are shown\
    \ in the configure and print methods in Example 4-3. Both access the pageSize\
    \ property of a printer object.\n\nExample 4-3. Using the enclosing scope through\
    \ function.bind() or aliasing\n\n```\nvar printer = {\n  pageSize: 'US LETTER',\n\
    \n  connect: function () {\n    // Return a promise that is fulfilled when a connection\n\
    \    // to the printer is established\n  },\n\n  configure: function (pageSize)\
    \ {\n    return this.connect().then(function () {\n      console.log('Setting\
    \ page size to ' + pageSize);\n      this.pageSize = pageSize;\n    }).bind(this));\
    \ // Using bind to set the context\n  },\n\n  print: function (job) {\n    //\
    \ Aliasing the outer context\n    // _, that, and we are some other common alias\
    \ names\n    var me = this;\n\n    return this.connect().then(function () {\n\
    \      console.log('Printing job using page size ' + me.pageSize);\n    });\n\
    \  }\n};\n\nprinter.configure('A4').then(function () {\n  return printer.print('Test\
    \ page');\n});});\n```\n\n```\n// Console output:\n// Setting page size to A4\n\
    // Printing job using page size A4\n```\n\nThe configure method uses bind(this)\
    \ to share its context with the inner callback. The print method aliases the outer\
