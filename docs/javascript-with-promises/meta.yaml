    \n# Managing Latency\n\nWhen you have a promise that wraps an asynchronous network\
    \ request, how long should you wait for the promise to settle? The actual time\
    \ is based on many factors outside the control of your code. You can prevent your\
    \ application from entering a state of prolonged or endless waiting by enforcing\
    \ a time limit.\n\nThe getData function in Example 3-15 returns a promise fulfilled\
    \ with fresh data fetched from a server. It concurrently pulls existing data from\
    \ a cache to use if the server does not respond quickly enough. And if neither\
    \ the cache the cache respond in time, the promise returned by getData is rejected.\
    \ Each of the outcomes is represented by a promise. Promise.race() to select the\
    \ first available outcome.\n\nExample 3-15. Manage response time using Promise.race()\n\
    \n```javascript\nfunction getData() {\n  var timeAllowed = 500; // milliseconds\n\
    \  var deadline = Date.now() + timeAllowed;\n\n  var freshData = ajax(*url*/);\n\
    \n  var cachedData = fetchFromCache().then(function (data) {\n    return new Promise(function\
    \ (resolve) {\n      var timeRemaining = Math.max(deadline - Date.now(), 0);\n\
    \      setTimeout(function () {\n        resolve(data);\n        timeRemaining;\n\
    \      });\n    });\n  });\n\n  var failure = new Promise(function (resolve, reject)\
    \ {\n    setTimeout(function () {\n      reject(new Error('Unable to fetch data\
    \ in allotted time'));\n    }, timeAllowed);\n  });\n  return Promise.race([freshData,\
    \ cachedData, failure]);\n}\n```\n\n# Functional Composition\n\nEarlier in the\
    \ book you saw how promise chains are useful for orchestrating steps. This technique\
    \ of combining several functions into discrete units is known as functional composition.\
    \ The image processing functions in this example are all generic. They have no\
    \ knowledge of the real estate website and could easily exist in a third-party\
    \ library. The processImage function containing the pipeline is the only thing\
    \ with domain-specific knowledge. It composes the functions in the required order\
    \ and provides the necessary parameters.\n\nExample 3-16. Verbose pipeline\n\n\
    ```javascript\n// Generic image processing\nfunction scaleToFit(width, height,\
    \ image) {\n  console.log('Scaling image to ' + width + ' x ' + height);\n  return\
    \ image;\n}\n```\n\n```javascript\nfunction watermark(text, image) {\n  console.log('Watermarking\
    \ image with ' + text);\n  return image;\n}\n```\n\n```javascript\nfunction grayscale(image)\
    \ {\n  console.log('Converting image to grayscale');\n  return image;\n}\n```\n\
    \n```javascript\n// Image pipeline\nfunction processImage(image) {\n  return Promise.resolve(image).then(function\
    \ (image) {\n    return scaleToFit(300, 450, image);\n  }).then(function (image)\
    \ {\n    return watermark('The Estate Company', image);\n  }).then(function (image)\
    \ {\n    return grayscale(image);\n  });\n}\n\n// Console output for processImage():\n\
    // Scaling image to 300 x 450\n// Watermarking image with The Estate Company\n\
    // Converting image to grayscale\n\nThe processImage function can be shortened,\
