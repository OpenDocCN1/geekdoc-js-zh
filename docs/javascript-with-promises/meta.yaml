    # The Promise API


    The Promise API consists of a constructor and six functions, four of which have
    already been demonstrated. However, it''s worth describing each of them so you
    can see the API as a whole and be aware of optional arguments.


    # Promise


    new Promise(function(resolve, reject) { ... }) returns promise


    The Promise global is a constructor function that the new keyword invokes.


    The Promise global creates promise objects that have the two methods then and
    catch for registering callbacks that are invoked once the promise is fulfilled
    or rejected.


    # promise.then


    promise.then([onFulfilled], [onRejected]) returns promise


    The Promise.then() accepts an onFulfilled callback and an onRejected callback.
    People generally register rejected callbacks using promise.catch() instead of
    passing a second argument to then (see the explanation provided in Chapter 5.)
    The function returns a promise that is resolved by the return value of the onFulfilled
    callback. Any error thrown inside the callback rejects the new promise with that
    error.'
- md: "\n## promise.catch\n\npromise.catch(onRejected) returns promise\n\nThe promise.catch()\
    \ method accepts an onRejected callback and returns a promise that the value of\
    \ the callback or any error thrown by the callback resolves and rejects, respectively.\
    \ That means any rejection callback given to catch handles is not propagated further\
    \ unless you explicitly throw inside the callback.\n\n## Promise.resolve\n\nPromise.resolve([value|promise])\
    \ returns promise\n\nThe Promise.resolve() function is a convenience function\
    \ for creating a promise that is already resolved with a given value. If you pass\
    \ a promise as the argument to Promise.resolve(), the new promise is bound to\
    \ the promise you provided and it will be fulfilled or rejected accordingly.\n\
    \n## Promise.reject\n\nPromise.reject([reason]) returns promise\n\nThe Promise.reject()\
    \ function is a convenience function for creating a rejected promise with a given\
    \ reason.\n\n## Promise.all\n\nPromise.all(iterable) function returns promise\n\
    \nThe Promise.all() function maps a series of promises to their fulfillment values.\
    \ The function accepts an iterable object such as an Array, a Set, or a custom\
    \ iterable. It returns a new promise fulfilled by an array containing the values\
    \ in the iterable. Corresponding fulfillment values in the resulting array replace\
    \ any promises contained in the iterable. The new promise that functions is only\
    \ fulfilled after all the promises in the iterable are fulfilled, or it is rejected\
    \ as soon as any of the promises in the iterable are rejected. If the new promise\
    \ contains the rejection reason from the promise in the iterable that triggered\
    \ the rejection. If you are working with a Promise implementation that does not\
    \ understand ES6 iterables, it will likely expect standard instead.\n\n## What\
    \ Is an Iterable?\n\n> An iterable is an object that provides a series of values\
    \ by implementing a predefined interface (also known as a protocol). Iterables\
    \ are specified in ES6 and explained in “Iterables and Iterators” on page 68.\n\
    \n## Promise.race\n\nPromise.race(iterable) returns promise\n\nPromise.race()\
    \ function reduces a series of items to the first available value. It accepts\
    \ an iterable and returns a new promise. The function examines each item in the\
    \ iterable until it finds an item that is not a promise or a promise that has\
    \ settled. The returned promise is then fulfilled or rejected on that item. If\
    \ the iterable contains only unsettled promises, the returned promise is settled\
    \ once one of the promises in the iterable is settled.\n\n## Summary\n\nThis chapter\
    \ introduced all the basic concepts of Promises. Keep these three points in mind:\n\
    \n- A promise is a placeholder for a value that is usually the result of an asynchronous\
    \ operation.\n- A promise has three states: pending, fulfilled, and rejected.\n\
    - After a promise is fulfilled or rejected, its state and value can never be changed.\n\
    \nAt this point you have walked through a number of examples that demonstrate\
    \ the basic ways a promise is used and you are ready to run sequential asynchronous\
    \ steps in your code using promise chains. You should also be comfortable using\
    \ APIs that return promises for asynchronous work.\n\nOne example of promises\
    \ in the wild is in the CSS Font Load Events spec, which provides FontSet.load()\
    \ Function returns a promise for loading fonts into the browser. Consider how\
    \ you could use this function to only display text once a desired font is loaded\
    \ in the browser.\n\nPromises can be combined to orchestrate async tasks and structure\
    \ code in various ways. Although a sequential workflow was provided here, you'll\
    \ soon want to use promises in more advanced ways. The next chapter walks through\
    \ a variety of ways you can use promises in your applications.\n\n## Working with\
    \ Standard Promises\n\nWe've covered the standard Promise API and some basic scenarios,\
    \ but like any technology, that's only part of the story. Now it's time for scenarios\
    \ you'll encounter and techniques you can use while writing real-world applications.\n\
    \n## The Async Ripple Effect\n\nAsync functions and promises are contagious. After\
    \ you start using them naturally spread through your code. When you have one async\
    \ function, any code that calls that function now contains an async step. The\
    \ process of other functions becoming by extension creates a ripple effect that\
    \ continues all the way through the call stack. This is shown in Example 3-1 using\
    \ three functions. Look how the async ajax function forces the other functions\
    \ to also be.\n\nExample 3-1. The async ripple effect\n\n```javascript\nshowPun().then(function\
    \ () {\n  console.log('Maybe I should stick to programming');\n});\n\nfunction\
    \ showPromise() {\n  return getPun().then(function (pun) {\n    console.log(pun);\n\
    \  });\n}\n\nfunction getPun() {\n  // Assume ajax(json) returns a promise that\
    \ is eventually\n  // fulfilled by json {content:'The pet job was ruff!'}\n  return\
    \ ajax(/*someurl*/).then(function (json) {\n    var pun = JSON.parse(json);\n\
    \    return pun.content;\n  }\n}\n// Console output:\n// The pet store job was\
    \ ruff!\n// Maybe I should stick to programming\n```\n\nThe work to retrieve and\
    \ display a pun is divided into three functions: showPun, getPun, and ajax. The\
    \ functions form a chain of promises that starts with ajax and ends with the object\
    \ returned by showPun. The ajax function returns a promise representing the result\
    \ of an async XHR request. If ajax returned the JSON synchronously, getPun and\
    \ showPun would not consume or return promises.\n\nAs a general rule, any function\
    \ that uses a promise should also return a promise. When a promise is not propagated,\
    \ the calling code cannot know when the promise is fulfilled and thus cannot effectively\
    \ work after the fact. It's easy to ignore this rule when writing a function whose\
    \ does not care when the async work is finished, but don't be fooled. It's much\
    \ easier to return a promise that initially goes unused to retrofit promises into\
    \ a series of functions later on.\n\n## Conditional Logic\n\nIt's common to have\
    \ a workflow that contains a conditional step. For instance, some actions may\
    \ require authentication. However, once a user is authenticated, does not need\
    \ to repeat that step every time. There are multiple ways to code this scenario.\
    \ As an example, we'll use an electronic book reader that requires authentication\
    \ before the user can access any features. 3-2 shows a first pass.\n\nExample\
    \ 3-2. Conditional step\n\n```javascript\nvar user = {\n  authenticated: false,\n\
    \  login: function () {\n    // Returns a promise for the login request\n    //\
    \ Set authenticated to true when login succeeds\n  }\n};\n\n// Avoid this style\
    \ of conditional execution\nfunction showMenu() {\n  if (!user.authenticated)\
    \ {\n    user.login().then(showMenu);\n    return;\n  }\n}\n```\n\nIn this implementation\
    \ of showMenu, the menu is displayed immediately if the user is already authenticated.\
    \ If the user is not authenticated, the async login process is performed and showMenu\
    \ is run once the login succeeds.\n\nOne problem is that the menu will silently\
    \ fail to display if the login fails. That's because showMainMenu relies on a\
    \ promise but does not return a promise as described in the preceding section.\n\
    \nA second problem is that showMenu may behave synchronously or asynchronously\
    \ depending on whether the user is already authenticated. As described in Chapter\
    \ 1, this style of code creates multiple execution paths that can be difficult\
    \ to reason about and cause inconsistent behavior.\n\nAs shown in Example 3-3,\
    \ the issues in showMenu can be addressed by substituting a resolved promise if\
    \ the user is already authenticated.\n\nExample 3-3. Substituting a resolved promise\n\
    \n```javascript\nfunction showMenu() {\n  var p = (user.authenticated) ? user.login()\
    \ : Promise.resolve();\n  return p.then(function () {\n    // ... Code to display\
    \ main menu\n  });\n}\n```\n\nNow the menu is always displayed asynchronously\
    \ using either the promise that user.login() returned or a resolved promise substituted\
    \ for the login process.\n\nYou can eliminate the need for a substitute promise\
    \ by calling user.login() every time, as shown in Example 3-4.\n\nExample 3-4.\
    \ Encapsulating conditional logic with a promise\n\n```javascript\nfunction showMenu()\
    \ {\n  return user.login().then(function () {\n    // ... Code to display main\
    \ menu\n  });\n}\n```\n\nThis doesn't mean all the login steps need to be repeated\
    \ every time. The promise that login returned can be cached and reused, as shown\
    \ in Example 3-5.\n"
