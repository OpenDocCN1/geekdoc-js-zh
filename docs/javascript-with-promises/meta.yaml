  md: "Example 4-18. Deferred throws synchronous errors\n\n```\nfunction loadImage(url)\
    \ {\n  var deferred = jQuery.Deferred();\n  // ...\n  return deferred.promise();\n\
    }\n```\n\n```\nfunction loadImageWithoutDeferred(url) {\n  return new Promise(function(resolve,\
    \ reject) {\n    var image = new Image();\n    image.src = url;\n    image.onload\
    \ = function () {\n      resolve(image);\n    };\n    image.onerror = reject;\n\
    \  });\n}\n```\n\nThe main difference between the two functions is that the function\
    \ used inside a deferred could throw a synchronous error while any errors thrown\
    \ inside the function with the Promise constructor are caught and they reject\
    \ the promise. Promises created from jQuery deferreds do not conform to the standard\
    \ ES6 Promise API or behavior. Some method names on jQuery differs from the spec;\
    \ for example, [jQuery Promise].fail() is the counterpart to [standardPromise].catch().\n\
    \nA more important difference is in handling errors in the onFilled and onRejected\
    \ callbacks. Standard promises automatically catch any errors thrown in these\
    \ callbacks and convert them into rejections. In jQuery promises, these errors\
    \ bubble up to the catch as uncaught exceptions.\n\nAlso, jQuery will invoke an\
    \ onFulfilled or onRejected callback synchronously if settling a promise before\
    \ the callback is registered. This creates the problems with multiple execution\
    \ paths described in Chapter 1.\n\nFor more differences between standard promises\
    \ and the ones jQuery provides, refer to a document written by Kris Koval titled\
    \ Coming from jQuery.\n\nSome developers prefer the style of deferred objects\
    \ or find them easier to understand. However, a more significant case for using\
    \ a deferred is in a situation where you cannot resolve the promise in the place\
    \ it is created.\n\nSuppose you are using a web worker to perform long-running\
    \ tasks. You can use promises to represent the outcome of the tasks. The code\
    \ that receives the response from the web worker will resolve the promise so it\
    \ needs access to the appropriate resolve and reject functions.  Example 4-19\
    \ demonstrates this."
