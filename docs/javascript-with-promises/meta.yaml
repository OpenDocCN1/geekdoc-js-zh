- md: "\nthreaded, where are the async tasks and callbacks run? To explain, let's\
    \ start in Example 1-9 with a simple HTTP request in Node.\n\nExample 1-9. HTTP\
    \ request in Node.js\n\n```\nvar http = require('http');\nhttp.get('http://www.google.com',\
    \ function(res) {\n  console.log('got a response');\n});\n```\n\nThe call to get()\
    \ triggers a network request that a separate thread handles. But wait—you were\
    \ just told that JavaScript is single-threaded. The distinction is: the JavaScript\
    \ code you write runs all on a single thread, but the code that implements the\
    \ async tasks (the .get() implementation in Example 1-9) is not part of JavaScript\
    \ and is free to run in a separate thread.\n\nOnce the task completes the results\
    \ need to be provided to the JavaScript thread. After this point the callback\
    \ is placed in a queue. A multithreaded language might interrupt whatever is currently\
    \ executing the results, but in JavaScript these interruptions are forbidden.\
    \ Instead there is a run-to-completion rule, which means your code runs without\
    \ interruption until it passes control back to the host environment returning\
    \ from the host initially called. At that point the callback can be removed from\
    \ the queue and invoked.\n\nAll other threads communicate with your code by placing\
    \ items on the queue. They are not permitted to manipulate any other memory accessible\
    \ to JavaScript. In the previous example the callback accesses the response from\
    \ the async HTTP request.\n\nAfter the callback is added to the queue, there is\
    \ no guarantee how long it will have to wait. How long the current code runs to\
    \ completion and what else is in the queue controls the time. The queue can contain\
    \ things as mouse clicks, keystrokes, and callbacks for other async tasks. The\
    \ JavaScript runtime continues in an endless cycle of pulling an item off the\
    \ queue if one is available, running the code that it triggers, and then checking\
    \ the queue again. This cycle is known as the event loop.\n\nFigure 1-1 shows\
    \ how the queue is populated and Figure 1-2 shows how the event loop processes\
    \ items from the queue. All the JavaScript you write in the box labeled JS Event\
    \ Handler in Figure 1-2. The JavaScript engine performs the rest of the activity\
    \ in both diagrams behind the scenes.\n\n![](img/86b9481a293cab930786a4c67d908e3e_17_0.png)\n\
    Figure 1-1. Filling the queue\n\n![](img/86b9481a293cab930786a4c67d908e3e_17_1.png)\n\
    Figure 1-2. The JavaScript event loop\n\nUsing setTimeout to trigger another function\
    \ after a given amount of time is a simple way to watch the event loop in action,\
    \ as shown in Example 1-10. The setTimeout function accepts two arguments: a function\
    \ to call and the minimum number of milliseconds to wait before calling the function.\n\
    \nExample 1-10. Using setTimeout to demonstrate the event loop\n\n``` evenfunction\
    \ marco() {\n  console.log('polo');\n}\n```\n\nsetTimeout(marco, 0); // zero delay\n\
    \n```\nconsole.log('Ready when you are');\n```\n\n// Console output:\n// Ready\
    \ when you are\n// polo\n\nThe marco function is immediately placed in the queue.\
    \ After the console displays \"Ready when you are,\" the event loop turns and\
    \ marco can be pulled off the queue. Notice the second parameter for setTimeout\
    \ specifies the minimum amount of time that will lapse for the callback to run\
    \ as opposed to the exact amount of time. It is impossible to know exactly when\
    \ the callback will run because other JavaScript could be executing at that time\
    \ and the machine has to let that finish before returning to the queue to invoke\
    \ your callback.\n\nKeeping in mind the run-to-completion and event loop concepts,\
    \ let revisit the XHR example given at the beginning of the chapter, which is\
    \ repeated in Example 1-11 for convenience.\n\nExample 1-11. Async XHR (repeated\
    \ from earlier)\n\n```\n// Make an async HTTP request\nvar async = true;\nvar\
    \ xhr = new XMLHttpRequest();\nxhr.open('get', 'data.json', async);\nxhr.send();\n\
    ```\n\n```\n// create a three second delay (don't do this in real life)\nvar timestamp\
    \ = Date.now() + 3000;\nwhile (Date.now() < timestamp);\n```\n\n```\n// Now three\
    \ seconds have passed,\nadd a listener to the xhr.load and xhr.error events\n\
    function listener() {\n  console.log('greetings from listener');\n}\nxr.addEventListener('load',\
    \ listener);\nxr.addEventListener('error', listener);\n```\n\nThe question was\
    \ whether it plays out similarly to the previous example with setTimeout. The\
    \ listeners are registered after invoking the send function, but this is safe\
    \ to do until the event loop turns because the runtime cannot trigger the load\
    \ or error events before them.\n\nAllowing the event loop to turn before registering\
    \ the event listeners would create a race condition. Example 1-12 demonstrates\
    \ that by using setTimeout.\n\n## Example 1-12. Race condition\n\n```\nvar async\
    \ = true;\nvar xhr = new XMLHttpRequest();\nxhr.open('get', 'data.json', async);\n\
    xhr.send();\n```\n\n```\nsetTimeout(function delayed() { // Creates race!!\n \
    \ function listener() {\n    console.log('greetings from listener');\n  }\n  xhr.addEventListener('load',\
    \ listener);\n  xhr.addEventListener('error', listener);\n}, 3000);\n```\n\nPerforming\
    \ the event listener registration inside a callback given to setTimeout causes\
    \ a delay. The only way the listener function will be called is if the delayed\
    \ function is pulled off the queue and run before the HTTP request completes and\
    \ the load or error event is triggered. Experimenting with different values for\
    \ the delay parameter of setTimeout shows listener being invoked sometimes but\
    \ not always.\n\n## Summary\n\nThis chapter covered the underlying concepts of\
    \ asynchronous programming. Knowing how JavaScript handles callbacks allows you\
    \ to control the order in which your code runs instead of writing things that\
    \ work by coincidence. If the order in which your code is executed surprises you\
    \ or find yourself unsure of what will happen next, refer back to this chapter.\
    \ Not only does it prepare you for using Promises, but it will make you a better\
    \ JavaScript developer overall.\n\n## CHAPTER 2\n\n## Introducing Promises\n\n\
    The biggest challenge with nontrivial amounts of async JavaScript is managing\
    \ execution order through a series of steps and handling any errors that arise.\
    \ Promises address this problem by giving you a way to organize callbacks into\
    \ discrete steps that are easier to read and maintain. And when errors occur they\
    \ can be handled outside the primary application logic without the need for boilerplate\
    \ code in each step.\n\nA promise is an object that serves as a placeholder for\
    \ a value. That is usually the result of an async operation such as an HTTP request\
    \ or reading a file from disk. When an async function is called it can immediately\
    \ return a promise object. Using that object you can register callbacks that will\
    \ run when the operation succeeds or an error occurs. This chapter covers the\
    \ basic ways to use promises. By the end of the chapter you should be comfortable\
    \ working with functions that return promises and to manage a sequence of asynchronous\
    \ steps.\n\nThis book uses the Promise API for the version of JavaScript known\
    \ as ECMAScript 6 (ES6). However, there were a number of popular Promise libraries\
    \ that the development community created before ES6 that may not match the spec.\
    \ These differences are mostly trivial so it is generally easy to work with different\
    \ implementations once you are using standard promises.\n\n### Basic Usage\n\n\
    Let's walk through the basics of Pro-m-ising using a series of examples beginning\
    \ with a traditional callback approach and moving to an implementation using promises.\
    \ Example 2-1 loads an image in a web browser and invokes a success or error callback\
    \ based on the outcome.\n\n### Example 2-1. Using callbacks\n\n```\nloadImage('shadowfacts.png',\n\
    function onsuccess(img) {\n  // Add the image to the current web page\n  document.body.appendChild(img);\n\
    }\nfunction onerror(e) {\n  console.log('Error occurred while loading image');\n\
    \  console.log(e);\n}\n```\n\n```\nfunction loadImage(url, success, error) {\n\
    \  var img = new Image();\n  img.src = url;\n\n  img.onload = function () {\n\
    \    success(img);\n  };\n\n  img.onerror = function (e) {\n    error(e);\n  };\n\
    }\n```\n\nThe loadImage function uses an HTML Image object to load an image by\
    \ setting the src property. The browser asynchronously loads the image based on\
    \ the src and queues the onload or onerror callback after it's done.\n\nSince\
    \ loadImage is asynchronous, it accepts callbacks instead of immediately returning\
    \ the image from the function. However, if loadImage was changed to return a promise\
    \ you would attach the callbacks to the promise instead of passing them arguments\
    \ to the function.\n\n### Example 2-2. Promise and catch\n\n```\n// Assume loadImage\
    \ returns a promise\nvar promise = loadImage('the_general_problem.png');\n\npromise.then(function\
    \ (img) {\n  document.body.appendChild(img);\n});\n\npromise.catch(function (e)\
    \ {\n  console.log('Error occurred while loading image');\n  console.log(e);\n\
    });\n```\n"
  mdcn: "\n在多线程环境中，异步任务和回调在哪里运行呢？为了解释这一点，让我们从示例 1-9 开始，在 Node 中发起一个简单的 HTTP 请求。\n\n\
    示例 1-9. Node.js 中的 HTTP 请求\n\n```\nvar http = require('http');\nhttp.get('http://www.google.com',\
    \ function(res) {\n  console.log('got a response');\n});\n```\n\n对 `get()` 的调用触发了一个由独立线程处理的网络请求。但等一下——你刚刚被告知\
    \ JavaScript 是单线程的区别在于：你编写的 JavaScript 代码运行在单个线程上，但实现异步任务的代码（示例 1-9 中的 `.get()`\
    \ 实现）并不是 JavaScript 的一部分，它可以自由地在单独线程中运行。\n\n一旦任务完成，结果需要提供给 JavaScript 线程。从这里开始，回调被放入队列中。多线程语言可能会中断当前正在执行的结果，但在\
    \ JavaScript 中，这些中断是被禁止的。相反，存在一条“运行到完成”（run-to-completion）规则，这意味着你的代码会在没有中断的情况下运行，直到它将控制交还给最初调用它的宿环境。此时，回调就可以从队列中移除并被调用。\n\
    \n所有其他线程通过向队列中放入项目与你的代码进行通信。它们不被允许操作任何 JavaScript 可访问的其它内存。在上一个示例中，回调访问了异步 HTTP\
    \ 请求的响应。\n\n在回调被添加到队列后，无法保证它需要等待多久。当前代码运行到完成的时间以及队列中还有什么内容决定了时间。队列中可能包含鼠标点击、击键输入和其他异步任务的回调。JavaScript\
    \ 运行时在一个无尽的循环中持续：如果队列中有可用项目，就取出一个项目，运行其触发的代码，然后再次检查队列。这个循环被称为事件循环（event loop）。\n\
