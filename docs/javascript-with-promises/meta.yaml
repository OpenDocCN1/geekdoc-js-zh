    \ a moment and look at how it is used. An array of products is passed along with\
    \ a callback that is invoked for each product in the array. If the callback returns\
    \ a promise, the next callback is not invoked until that promise is fulfilled.\
    \ The console output shows that the requests are run sequentially.\n\nThe sequence\
    \ function encapsulates the details of chaining promises to dynamically sequence\
    \ tasks. It iterates over the array by calling reduce and seeding the previous\
    \ promise with a resolved promise. The chain function given to reduce always returns\
    \ a promise that the return value of the callback passed into sequence resolves.\
    \ The cycle continues for each element until exhausting the array and returning\
    \ the last promise in the chain. The calling code attaches a catch handler to\
    \ promise to conveniently handle any problems.\n\nYou can also construct a sequence\
    \ of tasks using a list by replacing the previous sequence implementation in Example\
    \ 3-12 with the code in Example 3-13.\n\nExample 3-13. Build sequential chain\
    \ using recursion\n\n```\n// Replaces sequence in previous example with a recursive\
    \ implementation\nfunction sequence(array, index) {\n  if (index == array.length)\
    \ return Promise.resolve();\n  return Promise.resolve(callback(array[index])).then(function\
    \ () {\n    return chain(array, index + 1);\n  });\n}\nreturn chain(array, 0);\n\
    ```\n\n// Console output is identical to the previous example\n\nHere the reduce\
    \ function from earlier is replaced by chain, which recursively calls itself for\
    \ each element in the array. A recursive in programming is creating a stack overflow\
    \ by making too many recursive calls in a loop. Fortunately, that does not occur\
    \ because a separate turn of the event loop invokes the promise callbacks, each\
    \ recursive call to chain is at the top of the call stack."
  - "[PAGE 43]\n\nAlthough using recursion Example 3-12 has the same final outcome\
    \ as building the chain with a loop, there is an interesting difference between\
    \ the two approaches. Using a loop builds the entire chain of promises at the\
    \ outset without waiting for any of the promises to be resolved. The recursive\
    \ approach adds to the chain on demand after resolving the preceding promise.\
    \ A major benefit of the on-demand approach is the ability to decide whether to\
    \ continue chaining promises based on the result from the preceding promise.\n\
    \nThe last few examples have made a chain with a predefined number of steps decided\
    \ in advance, as shown in Example 3-14. A great example for this is included in\
    \ the WHATWG Streams specification for performing I/O. The spec contains sample\
    \ code for sequentially reading all the data from a stream in a series of chunks.\
    \ Each call to return a chunk of data and a done property indicating that the\
    \ stream is exhausted.\n\nExample 3-14. Conditionally expanding a chain based\
    \ on the outcome of a preceding promise\n\n```\nfunction readAllChunks(readableStream)\
    \ {\n  var reader = readableStream.getReader();\n  var chunks = [];\n\n  return\
    \ pump();\n\n  function pump() {\n    reader.read().then(function (result) {\n\
    \      if (result.done) {\n        return chunks;\n      }\n      chunks.push(result.value);\n\
    \      return pump();\n    });\n  }\n};\n```\n\nThe pump function appends each\
    \ chunk of data to an array and recursively calls itself until result.done signals\
    \ there is no more data available.\n\n> The code in the spec use object destructuring\
    \ with an arrow function, which has been a traditional function declaration here.\
    \ Destructuring and arrow functions are discussed in Chapter 6."
