  md: "threaded, where are the async tasks and callbacks run? To explain, let's start\
    \ in Example 1-9 with a simple HTTP request in Node.\n\nExample 1-9. HTTP request\
    \ in Node.js\n\n```\nvar http = require('http');\nhttp.get('http://www.google.com',\
    \ function(res) {\n  console.log('got a response');\n});\n```\n\nThe call to get()\
    \ triggers a network request that a separate thread handles. But wait—you were\
    \ just told that JavaScript is single-threaded. The distinction is: the JavaScript\
    \ code you write all on a single thread, but the code that implements the async\
    \ tasks (the .get() implementation in Example 1-9) is not part of JavaScript and\
    \ is free to run in a separate thread.\n\nOnce the task completes the results\
    \ needs to be provided to the JavaScript thread. After this point the callback\
    \ is placed in a queue. A multthreaded language might interrupt whatever is currently\
    \ executing the results, but in JavaScript these interruptions are forbidden.\
    \ Instead there is no run-to-completion rule, which means your code runs without\
    \ interruption until it passes control back to the host environment returning\
    \ from the host initially called. At that point the callback can be removed from\
    \ the queue and invoked.\n\nAll other threads communicate with your code by placing\
    \ items on the queue. They are not permitted to manipulate any other memory accessible\
    \ to JavaScript. In the previous example the callback accesses the response from\
    \ the async HTTP request.\n\nAfter the callback is added to the queue, there is\
    \ no guarantee how long it will have to wait. How long the current code runs to\
    \ completion and what else is in the queue controls the time. The queue can contain\
    \ things as mouse clicks, keystrokes, and callbacks for other async tasks. The\
    \ JavaScript runtime continues in an endless cycle of pulling an item off the\
    \ queue if one is available, running the code that it triggers, and then checking\
    \ the queue again. This cycle is known as the event loop.\n\nFigure 1-1 shows\
    \ how the queue is populated and Figure 1-2 shows how the event loop processes\
    \ items from the queue. All the JavaScript you write in the box labeled JS Event\
    \ Handler in Figure 1-2. The JavaScript engine performs the rest of the activity\
    \ in both diagrams behind the scenes."
