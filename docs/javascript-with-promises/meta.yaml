    });\n\nfunction rejectWith(val) {\n    return new Promise(function(resolve, reject)\
    \ {\n        throw Error(val);\n        resolve('Not used'); // This line is never\
    \ used\n    });\n}\n```\n\n// Console output:\n// Foiled again!\n// [Error object]\
    \ message: 'bad news' ...\n\nBoth examples in this section provided a JavaScript\
    \ Error object when rejecting the promise. Although including undefined can reject\
    \ promises, we recommend using an error object. Creating an error can capture\
