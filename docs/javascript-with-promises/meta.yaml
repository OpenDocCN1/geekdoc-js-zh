    \ {\n  console.log('Error occurred while loading image');\n  console.log(e);\n\
    });\n```"
- md: "\nThe code indicates the following: “Load an image, add it to the document\
    \ or show an error if it can't be loaded.” The promise that loadImage returns\
    \ has a then method for registering a callback to use when the operation succeeds\
    \ and a catch method for handling errors. However, both then and catch return\
    \ objects so callback registration is usually done by chaining these method calls\
    \ together, as shown in Example 2-3.\n\nExample 2-3. Chaining calls using then\
    \ and catch\n\n```\nloadImage('security_holes.png').then(function (img) {\n  document.body.appendChild(img);\n\
    }).catch(function (e) {\n  console.log('Error occurred while loading image');\n\
    \  console.log(e);\n});\n```\n\nAnd Example 2-4 is an implementation for loadImage\
    \ that returns a promise.\n\nExample 2-4. Creating and resolving a promise\n\n\
    ```javascript\nfunction loadImage(url) {\n  var promise = new Promise(\n    function\
    \ resolver(resolve, reject) {\n      var img = new Image();\n      img.onload\
    \ = function () {\n        resolve(img);\n      };\n\n      img.onerror = function\
    \ (e) {\n        reject(e);\n      };\n    }\n  );\n  return promise;\n}\n```\n\
    \nA global function called Promise exposes all the functionality of promises.\
    \ In this example, loadImage creates a new promise and returns it. When Promise\
    \ is used as a constructor it requires a callback known as a resolver function.\
    \ The resolver serves two purposes: it receives the resolve and reject arguments,\
    \ and functions are used to update the promise whose outcome is known, and any\
    \ error thrown from the resolver is implicitly used to reject the promise. All\
    \ the logic that was originally done in loadImage is now done inside the resolver.\
    \ The resolve function is called when the image loads and reject is called if\
    \ the image cannot be loaded.\n\nWhen an operation represented by a promise completes,\
    \ the result is stored and provided to any callbacks the promise invokes. The\
    \ result is passed to the promise as a parameter of the resolve or reject functions.\
    \ In the case of loadImage, the image is passed to resolve, so any callbacks registered\
    \ with the promise.then() will receive the image.\n\n## Multiple Consumers\n\n\
    When multiple pieces of code are interested in the outcome of the same async operation,\
    \ they can use the promise. For example, you can retrieve a user's profile from\
    \ the server and use it to display her name in a navigation bar. That data can\
    \ also be used on an account page that displays her full profile. The code in\
    \ Example 2-5 demonstrates this by using a promise to track whether a user's profile\
    \ has been received. Two independent functions use the same promise to display\
    \ data once it is available.\n\nExample 2-5. One promise with multiple consumers\n\
    \n```javascript\nvar user = {\n  profile: null,\n\n  getProfile: function () {\n\
    \    if (!this.profilePromise) {\n      // Assume ajax() returns a promise that\
    \ is eventually\n      // fulfilled with (name: 'Samantha', subscribedToSpan:\
    \ true)\n      this.profilePromise = ajax(/*someurl*/);\n    }\n    return this.profilePromise;\n\
    \  }\n};\n\nvar navbar = {\n  show: function (user) {\n    user.getProfile().then(function(profile)\
    \ {\n      console.log('**** Navbar ****');\n      console.log('Name: ' + profile.name);\n\
    \    });\n  }\n};\n\nvar account = {\n  show: function (user) {\n    user.getProfile().then(function(profile)\
    \ {\n      console.log('*** Account Info ***');\n      console.log('Name: ' +\
    \ profile.name);\n      console.log('Send lots of email?' + profile.subscribedToSpam);\n\
    \    });\n  }\n};\n\nnavbar.show(user);\naccount.show(user);\n```\n\n```\n// Console\
    \ output:\n// *** Navbar ***\n// Name: Samantha\n// *** Account Info ***\n// Name:\
    \ Samantha\n// Send lots of email? true\n```\n\nHere us an object with a promiseProperty\
    \ and a getProfile method is created. The getProfile method returns a promise\
    \ that is resolved with an object containing the profile information. Then the\
    \ script passes the user to the navbar and account objects, which display information\
    \ from the profile.\n\nRemember that a promise serves as a placeholder for the\
    \ result of an operation. In this case, the user.profilePromise is a placeholder\
    \ used by the navbar.show() and account.show() functions. These functions can\
    \ be safely called anytime or after the profile data is available. The callbacks\
    \ we use to print the data console will only be invoked once the profile is loaded.\
    \ This removes the need for an if statement in either function to check whether\
    \ the data is ready.\n\nIn addition to that simplification, using the promise\
    \ placeholder has another benefit. It removes the need for signaling inside the\
    \ getProfile function to display the username and profile once the data is ready.\
    \ The promise implicitly provides that logic, happily decoupled from the details\
    \ of how or when the data is displayed.\n\n## Promise States\n\nThe state of an\
    \ operation represented by a promise is stored within the promise. At any given\
    \ moment an operation has either begun, is in progress, has run to completion,\
    \ or has stopped and cannot be completed. These conditions are represented by\
    \ three mutually exclusive states:\n\n- Pending: The operation has not begun or\
    \ is in progress.\n- Fulfilled: The operation has completed.\n- Rejected: The\
    \ operation could not be completed.\n\nFigure 2-1 shows the relationship between\
    \ the three states.\n\n![](img/86b9481a293cab930786a4c67d908e3e_25_0.png)\n\n\
    Figure 2-1. Promise states\n\nSince the reject function transitions a promise\
    \ to the rejected state, why does the resolve function transition a promise to\
    \ a state called fulfilled instead of resolved? Resolving a promise is not the\
    \ same as fulfilling it. When the argument to resolve is a value, the promise\
    \ is immediately fulfilled. However, when another promise is passed to resolve,\
    \ such as promise.resolve(otherPromise), the promises are bound together. If the\
    \ promise to resolve is fulfilled, both promises will be fulfilled. If the promise\
    \ to resolve is rejected, both promises will be rejected. In short, the argument\
    \ to resolve dictates the fate of the promise. Figure 2-2 shows this process.\n\
    \nThe resolve and reject functions can be called without an argument, in which\
    \ case the fulfillment value or rejection reason will be the JavaScript undefined.\n\
    \nThe Promise API also provides two convenience methods (see Example 2-7) for\
    \ creating a promise that is immediately resolved or rejected: Promise.resolve()\
    \ and Promise.reject().\n\nExample 2-7. Convenience functions for resolve and\
    \ reject\n\n```javascript\n// Equivalent ways to create a resolved promise\nnew\
    \ Promise(function(resolve, reject) {\n  resolve('the long way')\n});\nPromise.resolve('the\
    \ short way');\n```\n"
