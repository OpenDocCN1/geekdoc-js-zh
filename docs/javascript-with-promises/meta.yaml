  md: "# CHAPTER 5\n\n# Error Handling\n\nOne of the biggest benefits of using promises\
    \ is the way they allow you to handle errors. Async error handling with callbacks\
    \ can quickly muddy a codebase with boiler-plate checks in every function. Fortunately,\
    \ promises allow you to replace those repetitive checks with one handler for a\
    \ series of functions.\n\nThe error handling API for promises is essentially one\
    \ function named catch. However, ever there are some extra things to know when\
    \ using this function. For instance, it allows you to simulate an asynchronous\
    \ try/catch/finally sequence. And it's easy to unintentionally swallow errors\
    \ by forgetting to rethrow them inside a catch callback.\n\nThis chapter guides\
    \ you through error handling in practice so you can write robust code. It includes\
    \ examples using the standard Promise API as well as options the Bluebird promise\
    \ library offers.\n\n# Rejecting Promises\n\nBasic error handling with promises\
    \ was introduced in Chapter 2 using the catch method. Your how a rejected promise\
    \ invokes callbacks registered with catch method (repeated in Example 5-1.)\n\n\
    5-1. Explicitly rejecting a promise\n\n```\nvar rejectedPromise = new Promise(function\
    \ (resolve, reject) {\n  reject(new Error('Arhhhh!')); // Explicit rejection\n\
    });\n```\n\n```\nrejectedPromise.catch(function (err) {\n  console.log('Rejected');\n\
    \  console.log(err);\n});\n```"
