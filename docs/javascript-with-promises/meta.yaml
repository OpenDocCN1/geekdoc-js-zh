- img_proc: true
  md: '# promise.catch


    promise.catch(onRejected) returns promise


    The promise.catch() method accepts an onRejected callback and returns a promise
    that the value of the callback or any error thrown by the callback resolves and
    rejects, respectively. That means any rejection callback given to catch handles
    is not propagated further unless you explicitly throw inside the callback.


    # Promise.resolve


    Promise.resolve([value|promise]) returns promise


    The Promise.resolve() function is a convenience function for creating a promise
    that is already resolved with a given value. If you pass a promise as the argument
    to Promise.resolve(), the new promise is bound to the promise you provided and
    it will be fulfilled or rejected accordingly.


    # Promise.reject


    Promise.reject([reason]) returns promise


    The Promise.reject() function is a convenience function for creating a rejected
    promise with a given reason.


    # Promise.all


    Promise.all(iterable) function returns promise


    The Promise.all() function maps a series of promises to their fulfillment values.
    The function accepts an iterable object such as an Array, a Set, or a custom iterable.
    It returns a new promise fulfilled by an array containing the values in the iterable.
    Corresponding fulfillment values in the resulting array replace any promises contained
    in the iterable. The new promise that functions is only fulfilled after all the
    promises in the iterable are fulfilled, or it is rejected as soon as any of the
    promises in the iterable are rejected. If the new promise contains the rejection
    reason from the promise in the iterable that triggered the rejection. If you are
    working with a Promise implementation that does not understand ES6 iterables,
    it will likely expect standard instead.


    # What Is an Iterable?


    > An iterable is an object that provides a series of values by implementing a
    predefined interface (also known as a protocol). Iterables are specified in ES6
    and explained in “Iterables and Iterators” on page 68.'
