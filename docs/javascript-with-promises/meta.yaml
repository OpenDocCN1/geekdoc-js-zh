    \ from that point on. This behavior is consistent with how operations work in\
    \ real life. A completed operation cannot become incomplete and its result does\
    \ not change. Of course an operation may repeat multiple times. For instance,\
    \ a failed operation may be retrieved and multiple times may return different\
    \ values. In that case, a new promise represents a more descriptive way to think\
