    \ at the top of processImage. This is just another way to accomplish the same\
    \ thing as the previous version of processImage; the implementation style is a\
    \ matter of preference.\n\n# Iterables and Iterators\n\nES6 introduces the ability\
    \ to iterate through multiple items that an object provides. This is similar to\
    \ walking through the items in an array using an index or through the properties\
    \ of an object for...in. Iterators differ from both of these because they allow\
    \ any object to provide an arbitrary series of items as opposed to one that is\
    \ based on the object's keys. For instance, an object called list could provide\
    \ all the items in the list and an object tree could expose all of its nodes.\n\
    \nOne can access the items through a combination of two interfaces (also known\
    \ as protocols), which are predefined sets of functions with specific names and\
    \ behaviors. Objects that expose a series of items are known as iterables. These\
    \ objects provide an iterator that exposes one item at a time and indicates when\
    \ the series is exhausted. Thus the two interfaces are named iterable and iterator.\n\
    \nObjects that want to expose a series of items can implement the iterable interface\
    \ by defining a function whose name is the value of Symbol.iterator, that is,\
    \ object[Symbol.iterator] = function () {}. This function should return an object\
    \ with the iterator interface."
