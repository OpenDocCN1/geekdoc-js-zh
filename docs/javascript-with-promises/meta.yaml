  - "[PAGE 26]\n\n```\n// Console output:\n// The number is 3.141592653589793\n```\n\
    \nThe code in this example demonstrates that the calls to reject(0) and resolve(Math.sqrt(-1))\
    \ have no effect because the promise has already been fulfilled with a value for\
    \ Pi.\n\nThe immutability of a settled promise makes code easier to reason about.\
    \ Allowing the state or value to change after a promise is fulfilled or rejected\
    \ would introduce race conditions. Fortunately, the state transition rules for\
    \ promises prevent that problem.\n\nSince the reject function transitions a promise\
    \ to the rejected state, why does the resolve function transition a promise to\
    \ a state called fulfilled instead of resolved? Resolving a promise is not the\
    \ same as fulfilling it. When the argument to resolve is a value, the promise\
    \ is immediately fulfilled. However, when another promise is passed to resolve,\
    \ such as promise.resolve(otherPromise), the promises are bound together. If the\
    \ promise to resolve is fulfilled, both promises will be fulfilled. If the promise\
    \ to resolve is rejected, both promises will be rejected. In short, the argument\
    \ to resolve dicates the fate of the promise. Figure 2-2 shows this process.\n\
    \n![](img/86b9481a293cab930786a4c67d908e3e_26_0.png)\n\nThe resolve and reject\
    \ functions can be called without an argument, in which case the fulfillment value\
    \ or rejection reason will be the JavaScript undefined.\n\nThe Promise API also\
    \ provides two convenience methods (see Example 2-7) for creating a promise that\
