- md: "\n```\nvar iterator = match(animals, 'legs', 4);\nconsole.log(iterator.next().value.type);\
    \ // value is an animal\nconsole.log(iterator.next().value.type); // value is\
    \ an animal\nconsole.log(iterator.next().value); // value is undefined\n```\n\n\
    ```\n// Console output:\n// cat\n// dog\n// undefined\n```\n\nThe match generator\
    \ accepts an array of objects along with a property name and value to filter the\
    \ objects. Any object with a matching property and value is yielded back to the\
    \ caller. After checking all the objects, the function returns. Any value returned\
    \ by the function is in the final result. And any result objects that next returns\
    \ after that point have their value property set as undefined.\n\nThe result that\
    \ next also exposes a done property to indicate when the iterator finished. The\
    \ property is useful for looping through the results as shown in Example 6-20.\n\
    \n## Example 6-20. Looping through iterations\n\n```\n// Substitute for iterator\
    \ and console.log in previous example\niterator = match(animals, 'legs', 4);\n\
    while ((result = iterator.next()).done != true) {\n  console.log(result.value.type);\n\
    }\n```\n\n```\n// Console output:\n// cat\n// dog\n```\n\nEach turn of the while\
    \ loop assigns the next iteration result to an object and checks the done flag.\
    \ This is a vast improvement over hardcoding for the expected number of results,\
    \ but there is a more elegant way to write this loop. For for...of construct,\
    \ as shown in Example 6-21, allows you to implicitly manage the iterator. For\
    \ for...of you are dealing with a finite number of iterations and do not need\
    \ to pass values back to the generator.\n\n## Example 6-21. Using an implicit\
    \ iterator created by for...of\n\n```\n// Better substitute for iterator and loop\n\
    for (animal of match(animals, 'legs', 4)) {\n  console.log(animal.type);\n}\n\
    ```\n\n## Sending Errors to a Generator\n\nAn iterator can cause an error to be\
    \ thrown when execution resumes inside a generator. Example 6-22 is a contrived\
    \ scenario to demonstrate the functionality. The example prints hello in several\
    \ of languages that a generator provides. An error is thrown when there is no\
    \ translation available for the language. Note the call to `iterator.throw()`\
    \ at the bottom of the example.\n\n### 6-22. Throwing errors with the iterator\n\
    \n```javascript\nfunction languages() {\n  try {\n    yield 'English';\n    yield\
    \ 'French';\n    yield 'German';\n    yield 'Spanish';\n  } catch (error) {\n\
    \    console.log(error.message);\n  }\n}\n```\n\n```\nvar greetings = {\n  English:\
    \ 'Hello',\n  French: 'Bonjour',\n  Spanish: 'Hola'\n};\nvar iterator = languages();\n\
    var result;\nvar word;\nwhile ((result = iterator.next()).done !== true) {\n \
    \ word = greetings[result.value];\n  if (word) console.log(word);\n  else iterator.throw(Error('Missing\
    \ translation for ' + result.value));\n}\n```\n\n```\n// Console output:\n// Hello\n\
    // Bonjour\n// Missing translation for German\n```\n\nWhen the iterator yields\
    \ 'German' there is no translation for that language so an error is sent to the\
    \ generator using iterator.throw(). The error is thrown inside the generator where\
    \ the yield 'German' expression is evaluated. The yield 'Spanish' statement is\
    \ skipped, as the error immediately falls to the catch block. Sending an error\
    \ back to the generator in this example is not useful, this ability is needed\
    \ to write synchronous-looking code using promises and generators.\n\n## Practical\
    \ Application\n\nNow let we revisit Example 6-13 from \"Synchronous Style\" on\
    \ page 69 to see how it works. Example 6-23 repeats the code here for convenience.\n\
    \n### Example 6-23. Using a promise with code that looks synchronous (repeated\
    \ from earlier)\n\n```javascript\nasync(function*) () {\n  try {\n    var img\
    \ = yield loadImage('thesis_defense.png');\n    document.body.appendChild(img);\n\
    \  } catch (err) {\n    console.log('caught in async routine');\n    console.log(err);\n\
    \  }\n}();\n```\n\nThe loadImage function is called in the body of a generator.\
    \ Although loadImage returns a promise, the yield statement inside the generator\
    \ returns the fulfillment value of that promise: an image object in this case.\
    \ How is that possible? Instead of directly creating an iterator from the generator\
    \ and invoking iterator.next(), the generator is passed to async, which returns\
    \ a wrapper function. When the wrapper is invoked it triggers a promise that the\
    \ generator yields and waits for it to settle. Once the promise is fulfilled the\
    \ value is passed into the generator. If the promise is rejected reason is thrown\
    \ inside the generator.\n\nThere are several ways to implement the async function.\
    \ Example 6-24 shows one way based on code written by Forbes Lindesay on promisejs.org.\n\
