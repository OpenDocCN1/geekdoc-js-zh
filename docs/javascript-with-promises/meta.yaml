  - "[PAGE 60]\n\n# Promises in jQuery\n\nIn jQuery, deferred objects represent async\
    \ operations. A deferred object is like a promise whose resolve and reject functions\
    \ are exposed as methods. Example 4-17 shows a loadImage function using a deferred\
    \ object.\n\nExample 4-17. Simple deferred object in jQuery\n\n```\nfunction loadImage(url)\
    \ {\n  var deferred = jQuery.Deferred();\n  var img = new Image();\n  img.src\
    \ = url;\n\n  img.onload = function () {\n    deferred.resolve(img);\n  };\n\n\
    \  img.onerror = function (e) {\n    deferred.reject(e);\n  };\n\n  return deferred;\n\
    }\n```\n\nThe Standard Promise API encapsulates the resolve and reject functions\
    \ inside the promise. For example, if you have a promise p, you cannot call p.resolve()\
    \ or p.reject() because those functions are not attached to p. Any code that receives\
    \ a reference to p can attach callbacks using p.then() or p.catch() but the code\
    \ cannot control whether p gets fulfilled or rejected.\n\nBy encapsulating the\
    \ resolve and reject functions inside the promise you can confidently expose the\
    \ promise to other pieces of code while remaining the code cannot affect the fate\
    \ of the promise. Without this guarantee you would have to consider all code that\
    \ a promise was exposed to anytime a promise was resolved or rejected in an unexpected\
    \ way.\n\nUsing defers does not mean you have to expose the resolve and reject\
    \ methods everywhere. The deferred object also exposes a promise that can be given\
    \ to any code that should not be calling resolve or reject.\n\nCompare the two\
    \ functions in Example 4-18. The first is a revised version of loadImage that\
    \ returns deferred.promise() and the second is the equivalent function implemented\
    \ with a standard promise."
