  md: '# Summary


    This chapter showed how of the new language features in ES6 can be used with promises.
    These features all allow you to write less code to accomplish the same outcome.
    We began with simplifying access to fulfillment values using destructuring, followed
    by concise callback declarations using arrow functions. And we concluded with
    how iterators and generators can be used to treat async functions that return
    promises as synchronous code.


    This chapter also concludes the book. We started with the fundamentals of asynchronous
    programming in JavaScript and worked through the core concepts of Promises and
    how to utilize them in a wide variety of scenarios. At this point you should be
    prepared to confidently manage async tasks with Promises, absorb new promise-based
    APIs such as Service Workers and Streams, and even create your own promise-based
    API.'
  merge: -1
