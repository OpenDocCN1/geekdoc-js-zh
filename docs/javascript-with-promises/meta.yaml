  md: '# Promise.race


    Promise.race(iterable) returns promise


    Promise.race() function reduces a series of items to the first available value.
    It accepts an iterable and returns a new promise. The function examines each item
    in the iterable until it finds an item that is not a promise or a promise that
    has settled. The returned promise is then fulfilled or rejected on that item.
    If the iterable contains only unsettled promises, the returned promise is settled
    once one of the promises in the iterable is settled.


    # Summary


    This chapter introduced all the basic concepts of Promises. Keep these three points
    in mind:


    +   - A promise is a placeholder for a value that is usually the result of an
    asynchronous operation.

    - A promise has three states: pending, fulfilled, and rejected.

    - After a promise is fulfilled or rejected, its state and value can never be changed.


    At this point you have walked through a number of examples that demonstrate the
    basic ways a promise is used and you are ready to run sequential asynchronous
    steps in your code using promise chains. You should also be comfortable using
    APIs that return promises for asynchronous work.


    One example of promises in the wild is in the CSS Font Load Events spec, which
    provides FontSet.load() Function returns a promise for loading fonts into the
    browser. Consider how you could use this function to only display text once a
    desired font is loaded in the browser.


    Promises can be combined to orchestrate async tasks and structure code in various
    ways. Although a sequential workflow was provided here, you''ll soon want to use
    promises in more advanced ways. The next chapter walks through a variety of ways
    you can use promises in your applications.'
