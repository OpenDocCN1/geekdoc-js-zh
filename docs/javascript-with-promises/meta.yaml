  md: "Although using recursion Example 3-12 has the same final outcome as building\
    \ the chain with a loop, there is an interesting difference between the two approaches.\
    \ Using a loop builds the entire chain of promises at the outset without waiting\
    \ for any of the promises to be resolved. The recursive approach adds to the chain\
    \ on demand after resolving the preceding promise. A major benefit of the on-demand\
    \ approach is the ability to decide whether to continue chaining promises based\
    \ on the result from the preceding promise.\n\nThe last few examples have made\
    \ a chain with a predefined number of steps decided in advance, as shown in Example\
    \ 3-14. A great example for this is included in the WHATWG Streams specification\
    \ for performing I/O. The spec contains sample code for sequentially reading all\
    \ the data from a stream in a series of chunks. Each call to return a chunk of\
    \ data and a done property indicating that the stream is exhausted.\n\nExample\
    \ 3-14. Conditionally expanding a chain based on the outcome of a preceding promise\n\
    \n```\nfunction readAllChunks(readableStream) {\n  var reader = readableStream.getReader();\n\
    \  var chunks = [];\n\n  return pump();\n\n  function pump() {\n    reader.read().then(function\
    \ (result) {\n      if (result.done) {\n        return chunks;\n      }\n    \
    \  chunks.push(result.value);\n      return pump();\n    });\n  }\n};\n```\n\n\
    The pump function appends each chunk of data to an array and recursively calls\
    \ itself until result.done signals there is no more data available.\n\n> The code\
    \ in the spec use object destructuring with an arrow function, which has been\
    \ a traditional function declaration here. Destructuring and arrow functions are\
    \ discussed in Chapter 6."
