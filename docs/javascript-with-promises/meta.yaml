    \ square(num) {\n  console.log(num);\n  return num * num;\n}).then(function(result)\
    \ {\n  console.log('The squares of those numbers are...');\n  console.log(result.join(',\
    \ '));\n});\n```\n\n```\n// Console output:\n// Square the following numbers...\n\
    // 1\n// 3\n// 2\n// The squares of those numbers are...\n// 1, 4, 9\n```\n\n\
    When map is invoked it receives an array whose second element is an unresolved\
    \ promise. The other elements are numbers that are immediately passed to the square\
    \ callback. After fulfilling the second promise, its value is passed to square.\
    \ Once processes all the values, an array that is identical to the one that the\
    \ synchronous array.map() function would return resolves the promise returned\
    \ by map.\n\nUsing array.map() or Bluebird.map() in this example produces the\
    \ same result, it doesn't matter order the values are passed to the callbacks.\
    \ That only works as long as the callback used for map does not have any side\
    \ effects. The map function is meant to convert one value to another using a callback.\
    \ Adding side effects to the map callback conflicts with the intended use. The\
    \ same thing applies to the reduce and filter functions. Avoid trouble by keeping\
    \ any callbacks these functions free from side effects.\n\n# Manipulating Fulfillment\n\
    \nWhen chaining promises to execute a series of steps, the fulfillment value of\
    \ one often provides a value needed in the next step. This progression generally\
    \ works well, but sometimes subsequent steps require the same value. In case you\
    \ need a way to expose the fulfillment value to additional steps.\n\nImagine a\
    \ series of database changes that all require a connection object. If the connection\
    \ is obtained through a promise in the chain it will not be available to other\
    \ steps in the chain by default. You can expose the connection to other steps\
    \ by assigning it to a variable in the enclosing scope, as shown in Example 4-12."
- md: "\nExample 4-12. Exposing a fulfillment value using the enclosing scope\n\n\
    ```javascript\nvar connection; // Declare in outer scope for use in multiple functions\n\
    \ngetConnection().then(function (con) {\n  connection = con;\n  return connection.insert('student',\
    \ {name: 'Bobby'});\n}).then(function () {\n  return connection.count('students');\n\
    }).then(function (count) {\n  console.log('Number of students: ' + count);\n \
    \ return connection.close();\n});\n```\n\nThe promise in the chain consists of\
    \ three callbacks. The first callback inserts a student, the second callback fetches\
    \ the number of students, and the third reports the number in the console. For\
    \ all callbacks to use the connection object, the fulfillment value from getConnection\
    \ is assigned to the connection variable in the enclosing scope.\n\nThere are\
    \ ways to expose the connection object to the other callbacks without creating\
    \ a variable in the outer scope. Bluebird promises have a return method that returns\
    \ a new promise that is resolved by the argument it is given. Example 4-13 is\
    \ a revised snippet using promise to pass the connection to the second callback.\n\
    \nExample 4-13. Passing on a value using promise.return()\n\n```javascript\ngetConnection().then(function\
    \ (connection) {\n  return connection\n    .insert('student', {name: 'Bobby'})\n\
    \    .return(connection);\n}).then(function (connection) { ...\n```\n\nFor this\
    \ scenario you could use the tap method of a Bluebird promise to get the connection\
    \ object to the second callback. The tap method allows you to insert a callback\
    \ into the promise chain while passing the fulfillment value it receives to the\
    \ next callback.\n\nExample 4-14. Passing on a value using promise.tap()\n\n```javascript\n\
    getConnection().tap(function (connection) {\n  return connection.insert('student',\
    \ {name: 'Bobby'});\n}).then(function (connection) //...\n```\n\nThink of tap\
    \ as tapping into a line without interfering with the existing flow. Use tap to\
    \ add supplementary functions to a promise chain. A practical use for tap would\
    \ be adding a logging statement to a promise chain, as shown in Example 4-15.\n\
    \nExample 4-15. Supplementing a chain with promise.tap()\n\n```javascript\nfunction\
    \ countStudents() {\n  return getConnection().then(function (connection) {\n \
    \   return connection.count('students');\n  }).tap(function (count) {\n    console.log('Number\
    \ of students: ' + count);\n  });\n}\n\ncountStudents().then(function (count)\
    \ {\n  if (count > 24) console.log('Classroom has too many students');\n});\n\n\
    // Console output:\n// Number of students: 25\n// Classroom has too many students\n\
    ```\n\nThe call to tap in the countStudents function can be added or removed without\
    \ affecting the outcome of the function.\n\nUsing return or tap makes the fulfillment\
    \ value that the callback would otherwise return. That worked in the previous\
    \ examples because the results of connection.insert(or connection.log()) were\
    \ not needed. In situations where they are needed, you can supplement the original\
    \ fulfillment value with additional items in a callback by passing them in an\
    \ array to Promise.all(), as shown in Example 4-16. Then the items in the array\
    \ can be split into separate arguments of a callback using spread.\n\nExample\
    \ 4-16. Packing in multiple values with Promise.all()\n\n```javascript\ngetConnection().then(function\
    \ (connection) {\n  var promiseForCount = connection.count('students');\n  return\
    \ Promise.all([connection, promiseForCount]);\n}).spread(function (connection,\
    \ count) {\n  console.log('Number of students: ' + count);\n  return connection.close();\n\
    });\n```\n\n## Promises in jQuery\n\nIn jQuery, deferred objects represent async\
    \ operations. A deferred object is like a promise whose resolve and reject functions\
    \ are exposed as methods. Example 4-17 shows a loadImage function using a deferred\
    \ object.\n\nExample 4-17. Simple deferred object in jQuery\n\n```javascript\n\
    function loadImage(url) {\n  var deferred = jQuery.Deferred();\n  var img = new\
    \ Image();\n  img.src = url;\n\n  img.onload = function () {\n    deferred.resolve(img);\n\
    \  };\n\n  img.onerror = function (e) {\n    deferred.reject(e);\n  };\n\n  return\
    \ deferred;\n}\n```\n\nThe Standard Promise API encapsulates the resolve and reject\
    \ functions inside the promise. For example, if you have a promise p, you cannot\
    \ call p.resolve() or p.reject() because those functions are not attached to p.\
    \ Any code that receives a reference to p can attach callbacks using p.then()\
    \ or p.catch() but the code cannot control whether p gets fulfilled or rejected.\n\
    \nBy encapsulating the resolve and reject functions inside the promise you can\
    \ confidently expose the promise to other pieces of code while remaining the code\
    \ cannot affect the fate of the promise. Without this guarantee you would have\
    \ to consider all code that a promise was exposed to anytime a promise was resolved\
    \ or rejected in an unexpected way.\n\nUsing defers does not mean you have to\
    \ expose the resolve and reject methods everywhere. The deferred object also exposes\
    \ a promise that can be given to any code that should not be calling resolve or\
    \ reject.\n\nCompare the two functions in Example 4-18. The first is a revised\
    \ version of loadImage that returns deferred.promise() and the second is the equivalent\
    \ function implemented with a standard promise.\n\nExample 4-18. Deferred throws\
    \ synchronous errors\n\n```javascript\nfunction loadImage(url) {\n  var deferred\
    \ = jQuery.Deferred();\n  // ...\n  return deferred.promise();\n}\n```\n\n```javascript\n\
    function loadImageWithoutDeferred(url) {\n  return new Promise(function(resolve,\
    \ reject) {\n    var image = new Image();\n    image.src = url;\n    image.onload\
    \ = function () {\n      resolve(image);\n    };\n    image.onerror = function\
    \ (e) {\n      reject(e);\n    };\n  });\n}\n```\n\nThe main difference between\
    \ the two functions is that the code inside deferred could throw synchronous error\
    \ while standard promises automatically catch errors thrown in the callback. A\
    \ more important difference is in handling errors in the onfilled and rejected\
    \ callbacks. Standard promises, these errors bubble up to the catch.\n\nSome developers\
    \ prefer the style of deferred objects or find them easier to understand. However,\
    \ a more significant case for using a deferred is in a situation where you cannot\
    \ resolve the promise in the place it is created.\n\nSuppose you are using a web\
    \ worker to perform long-running tasks. You can use promises to represent the\
    \ outcome of the tasks. The code that receives the response from the web worker\
    \ will resolve the promise so it needs access to resolve and reject functions.\
    \ Example 4-19 demonstrates this.\n\nExample 4-19. Managing web worker results\
    \ with deferred objects\n\n```javascript\n// Contents of task.js\nonmessage =\
    \ function(event) {\n  postMessage({\n    status: 'completed',\n    id: event.data.id,\n\
    \    result: 'some calculated result'\n  });\n};\n\n// Contents of main.js\nvar\
    \ worker = new Worker('task.js');\nvar deferreds = {};\nvar counter = 0;\n\nworker.onmessage\
