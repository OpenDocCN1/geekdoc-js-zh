- md: "\noccurs outside the background function that creates the promise, a deferred\
    \ object is used to expose a resolve function to the onCompleted callback.\n\n\
    For detailed information on web workers, refer to Web Workers: Multithreaded Programs\
    \ in JavaScript by Ido Green (O'Reilly).\n\n![](img/86b9481a293cab930786a4c67d908e3e_63_0.png)\n\
    \nOne final note for this section: if you wish to use a deferred object without\
    \ jQuery, it is easy to create using the standard Promise API, as shown in Example\
    \ 4-20.\n\nExample 4-20. Creating a deferred object using a standard Promise constructor\n\
    \n```javascript\nfunction Deferred() {\n  var me = this;\n  me.promise = new Promise(function\
    \ (resolve, reject) {\n    me.resolve = resolve;\n    me.reject = reject;\n  });\n\
    }\n\nvar d = new Deferred();\n```\n\n## Summary\n\nLibraries offer an extended\
    \ set of features for working with promises. Many of these are convenience functions\
    \ that save you from mixing the plumbing with your code. This chapter covered\
    \ a number of features that the Bluebird library provides, although Q and other\
    \ libraries offer similar functionality and are also popular among developers.\
    \ It also explained the deferred jQuery uses. These objects expose promises that\
    \ have some significant behavioral differences compared to the ES6 standard.\n\
    \n## CHAPTER 5\n\n## Error Handling\n\nOne of the biggest benefits of using promises\
    \ is the way they allow you to handle errors. Async error handling with callbacks\
    \ can quickly muddy a codebase with boiler-plate checks in every function. Fortunately,\
    \ promises allow you to replace those repetitive checks with one handler for a\
    \ series of functions.\n\nThe error handling API for promises is essentially one\
    \ function named catch. However, there are some extra things to know when using\
    \ this function. For instance, it allows you to simulate an asynchronous try/catch/finally\
    \ sequence. And it's easy to unintentionally swallow errors by forgetting to rethrow\
    \ them inside a catch callback.\n\nThis chapter guides you through error handling\
    \ in practice so you can write robust code. It includes examples using the standard\
    \ Promise API as well as options the Bluebird promise library offers.\n\n## Rejecting\
    \ Promises\n\nBasic error handling with promises was introduced in Chapter 2 using\
    \ the catch method. Your how a rejected promise invokes callbacks registered with\
    \ catch method (repeated in Example 5-1.)\n\n5-1. Explicitly rejecting a promise\n\
    \n```javascript\nvar rejectedPromise = new Promise(function (resolve, reject)\
    \ {\n  reject(new Error('Arhhhh!')); // Explicit rejection\n});\n```\n\n```javascript\n\
    rejectedPromise.catch(function (err) {\n  console.log('Rejected');\n  console.log(err);\n\
    });\n```\n\n```javascript\n// Console output:\n// Rejected\n// [Error object]\
    \ { message: 'Arghhh!' ... }\n```\n\nThe rejectedPromise was explicitly rejected\
    \ inside the callback given to the Promise constructor. As shown in Example 5-2,\
    \ a promise is rejected when an error is thrown inside any of the callbacks invoked\
    \ (i.e., any callback passed to the Promise constructor, then, catch.)\n\n## Example\
    \ 5-2. Unhandled error rejects a promise\n\n```javascript\nvar rejectedPromise\
    \ = new Promise(function (resolve, reject) {\n    throw new Error('Arghhh!');\
    \ // Implicit rejection\n});\n```\n\nAny error that occurs in a function that\
    \ returns a promise should be used to reject the promise instead of being thrown\
    \ back to the caller. This approach allows the caller to deal with any problems\
    \ arising by attaching a handler to the promise instead of surrounding the call\
    \ in a try/catch block. This can be done by wrapping code with a Promise constructor.\
    \ Example 5-3 shows two functions to illustrate the difference between throwing\
    \ a synchronous error and implicitly rejecting a promise.\n\n## Example 5-3. Functions\
    \ that return promises should not throw errors\n\n```javascript\nfunction badfunc(url)\
    \ {\n    var image;\n    image.src = url; // Error: image is undefined\n    return\
    \ new Promise(function (resolve, reject) {\n        image.onload = resolve;\n\
    \        image.onerror = reject;\n    });\n}\n```\n\n```javascript\nfunction goodfunc(url)\
    \ {\n    return new Promise(function (resolve, reject) {\n        var image;\n\
    \        image.src = url; // Error: image is undefined\n        image.onload =\
    \ resolve;\n        image.onerror = reject;\n    });\n}\n```\n\nRuntime errors\
    \ occur in both functions because the image object is never instantiated. In badfunc\
    \ only a try/catch block somewhere on the stack or a global exception handler\
    \ will catch the runtime error. In goodfunc the runtime error rejects the returned\
    \ promise so the calling code can deal with it in the same way as any other problems\
    \ that may arise from the operation the promise represents.\n\nAny error that\
    \ occurs in a function that returns a promise should be used to reject the promise\
    \ instead of being thrown back to the caller.\n\n## Passing Errors\n\nUsing uncaught\
    \ errors to reject promises provides an easy way to pass errors across different\
    \ parts of an application and to handle them at the place of your choosing. As\
    \ you saw in the last section, all the code you write inside promise callbacks\
    \ is wrapped in an implicit try block; you need to provide the catch. When presented\
    \ with a chain of promises, add a catch wherever it is helpful to deal with a\
    \ rejection. Although you could use a catch handler to every promise in a chain,\
    \ it is generally practical to use a single handler at the end of the chain.\n\
    \nWhere does a promise end? It's common for a single function to contain a chain\
    \ of several promises that a series of calls defines. However, the chain may not\
    \ end. Promises are frequently extended across functions as each caller appends\
    \ a promise to the tail.\n\nConsider an async function that operates a connection,\
    \ runs a query, and returns a promise that is fulfilled with the result, as shown\
    \ in Example 5-4. The chain continues the new tail is returned to the calling\
    \ function, as described in “The Async Effect” on page 25.\n\nExample 5-4. Promise\
    \ chains built across functions\n\n```javascript\nvar db = {\n  connect: function\
    \ () {/*...*/},\n  query: function () {/*...*/}\n};\n\nfunction getReportData()\
