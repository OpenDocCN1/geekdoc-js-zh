    \ promise将在可迭代对象中的一个 promise 变为状态后变为状态。\n\n## 总结\n\n本章介绍了 Promises 的所有基本概念。请记住这三点：\n\
    \n- promise 是一个值的占位符，该值通常是异步操作的结果。\n- promise 有三个状态：等待中（pending）、完成（fulfilled）和拒绝（rejected）。\n\
    - 在 promise 被完成或拒绝之后，它的状态和值将永远无法改变。\n\n到此时，你已经通过了许多示例演示了 promise 的基本用法，并已准备好在代码中使用\
    \ promise 链来运行顺序的异步步骤。你还应该习惯于使用返回 promise 以处理异步工作的 API。\n\npromise 在实际应用中的一个例子是\
    \ CSS Font Load Events 规范，它提供了 `FontSet.load()` 函数，该函数返回一个用于将字体加载到浏览器的 promise。考虑你如何使用此函数以便在所需字体在浏览器中加载后才显示文本。\n\
    \nPromises 可以组合以编排异步任务并以各种方式组织代码。虽然这里提供了一个顺序工作流，但你很快就会想要以更高级的方式使用 promises。下一章将介绍你在应用程序中使用\
    \ promises 的多种方法。\n\n## 使用标准 Promises\n\n我们已经涵盖了标准的 Promise API 和一些基础场景，但像任何技术一样，这只是故事的一部分。现在是时候考虑你将遇到的场景以及在编写真实世界应用时可以使用的技巧了。\n\
    \n## 异步涟漪效应\n\n异步函数和 promises 是具有传染性的。一旦你开始使用它们，它们就会自然地扩散到你的代码中。当你有一个异步函数时，任何调用该函数的代码现在都包含了一个异步步骤。其他函数的这种扩展创建了一个涟漪效应，一直持续到调用栈。这在示例\
    \ 3-1 中通过三个函数得到了展示。看异步 ajax 函数是如何强制其他函数也变成异步的。\n\n示例 3-1 异步涟漪效应\n\n```javascript\n\
    showPun().then(function () {\n  console.log('Maybe I should stick to programming');\n\
    });\n\nfunction showPromise() {\n  return getPun().then(function (pun) {\n   \
    \ console.log(pun);\n  });\n}\n\nfunction getPun() {\n  // 假设 ajax(json) 返回一个\
    \ promise，最终\n  // 被 json {content:'The pet job was ruff!'} 完成\n  return ajax(/*someurl*/).then(function\
    \ (json) {\n    var pun = JSON.parse(json);\n    return pun.content;\n  });\n\
    }\n// Console output:\n// The pet store job was ruff!\n// Maybe I should stick\
    \ to programming\n```\n\n获取和显示双关语（pun）的工作被分为三个函数：showPun、getPun 和 ajax。这些函数形成了一个\
    \ promise 链，从 ajax 开始，到由 showPun 返回的对象结束。ajax 函数返回一个代表异步 XHR 请求结果的 promise。如果\
    \ ajax 同步返回 JSON，那么 getPun 和 showPun 将不会消耗或返回 promise。\n\n作为一个通用规则，任何使用 promise\
    \ 的函数也应该返回一个 promise。当 promise 不被传播时，调用代码就不知道 promise 何时完成，因此无法在事后进行有效工作。在编写一个不在乎异步工作何时完成的函数时，忽略这条规则是很容易的，但不要被欺骗了。返回一个最初未被使用的\
    \ promise，以便以后将 promise 适配到一系列函数中，这要容易得多。\n\n## 条件逻辑\n\n一个包含条件步骤的工作流是常见的。例如，某些操作可能需要身份验证。然而，一旦用户通过了身份验证，就不需要每次重复该步骤。有多种方法编写这种场景。作为一个示例，我们将使用一个在用户访问任何功能之前需要身份验证的电子阅读器。3-2\
    \ 显示了第一种。\n\n示例 3-2 条件步骤\n\n```javascript\nvar user = {\n  authenticated: false,\n\
    \  login: function () {\n    // 返回登录请求的 promise\n    // 成功后将 authenticated 设置为\
    \ true\n  }\n};\n\n// 避免这种风格的执行\nfunction showMenu() {\n  if (!user.authenticated)\
    \ {\n    user.login().then(showMenu);\n    return;\n  }\n}\n```\n\n在 showMenu\
    \ 的实现中，如果用户已经通过验证，将立即显示菜单。如果用户没有验证，则执行异步登录过程并在登录成功后运行 showMenu。\n\n一个问题是，如果登录失败，菜单将静默失败。这是因为\
    \ showMenu 依赖于 promise，但如前节所述，它没有返回 promise。\n\n第二个问题是，showMenu 根据用户是否已通过验证可能会同步或异步执行。正如第\
    \ 1 章所述，这种风格的代码创建了难以理解的多个执行路径并导致不一致的行为。\n\n如示例 3-3 所示，通过在用户已通过验证时替换为解析 promise，可以解决\
    \ showMenu 中的问题。\n\n示例 3-3 替换解析 promise\n\n```javascript\nfunction showMenu()\
    \ {\n  var p = (user.authenticated) ? user.login() : Promise.resolve();\n  return\
    \ p.then(function () {\n    // ... 显示主菜单的代码\n  });\n}\n```\n\n现在，菜单始终异步异步显示，使用\
    \ user.login() 返回的 promise 或替换登录过程的解析 promise。\n\n你可以通过每次调用 `user.login()` 来消除对替换\
    \ promise的需求，如示例 3-4 所示。\n\n示例 3-4 使用 promise 封装条件逻辑\n\n```javascript\nfunction\
    \ showMenu() {\n  return user.login().then(function () {\n    // ... 显示主菜单的代码\n\
    \  });\n}\n```\n\n这并不意味着每次都需要重复所有的登录步骤。登录 返回的 promise 可以被缓存并重用，如示例 3-5 所示。\n\n"
