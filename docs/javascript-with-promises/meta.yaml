    \ API 将 `resolve` 和 `reject` 函数封装在 promise 内部。例如如果你有一个 promise `p`，你无法调用 `p.resolve()`\
    \ 或 `p.reject()`，因为这些函数没有附加到 `p` 上。任何接收 `p`self的代码都可以使用 `p.then()` 或 `p.catch()`\
    \ 附加回调，但代码无法控制 `p` 是被解析还是拒绝。\n\n通过将 `resolve` 和 `reject` 函数封装在 promise 内部，你可以放心地将\
    \ promise 暴露给其他代码，同时保持这些代码无法影响 promise 的命运。如果没有这个保证，每当 promise 以意想不到的方式被解析或拒绝时，你就必须考虑所有暴露给它的代码。\n\
    \n使用 `defers` 并不意味着你必须随处暴露 `resolve` 和 `reject` 方法。`deferred` 对象也会暴露一个 promise，可以将其交给任何不应该访问这些方法的代码。\n\
    \n对比示例 4-18 中的两个函数。第一个是返回 promise 的 `deferred` 版本，第二个是使用标准 promise 实现的等效函数。\n\n\
    示例 4-18. Deferred 出错误\n\n```javascript\nfunction loadImage(url) {\n  var deferred\
    \ = jQuery.Deferred();\n  // ...\n  return deferred.promise();\n}\n```\n\n```javascript\n\
    function loadImageWithoutDeferred(url) {\n  return new Promise(function(resolve,\
