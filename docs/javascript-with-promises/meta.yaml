    \ the echo function. In a larger project, knowing the execution path can go a\
    \ long way towards finding the cause of a problem.\n\nUnfortunately, the current\
    \ call stack is generally not as helpful as promises involved. In Example 5-12,\
    \ we have revised Example 5-11 to call the echo function using promise.then().\
