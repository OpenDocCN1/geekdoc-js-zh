  - "[PAGE 54]\n\nThe array can be converted back individual function arguments using\
    \ Bluebird's promise.spread() method. Example 4-8 shows an example of a node-style\
    \ function that provides multiple pieces of information about a user's account.\n\
    \nExample 4-8. Converting arrays into individual arguments using promise.spread()\n\
    \n```\nfunction getAccountStatus(callback) {\n  var error = null;\n  var enabled\
    \ = true;\n  var lastLogin = new Date();\n\n  callback(error, enabled, lastLogin);\
    \ // Callback has multiple values on success\n}\n\nvar fulfillUsingAnArray = true;\n\
    var wrapperFunc = Bluebird.promisify(getAccountStatus, fulfillUsingAnArray);\n\
    \n// Without using spread\nwrapperFunc().then(function (status) {\n  var enabled\
    \ = status[0];\n  var lastLogin = status[1];\n  // ...\n});\n\n// Using spread\n\
    wrapperFunc().spread(function (enabled, lastLogin) {\n  // ...\n});\n```\n\nUsing\
    \ this example allows the enabled and lastLogin to be clearly specified without\
    \ the need to extract them from an array. Use spread to simplify the code when\
    \ a promise is fulfilled with an array whose length and order of elements are\
    \ known.\n\nES6 includes a feature called destructuring that can assign values\
