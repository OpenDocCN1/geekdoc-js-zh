    \ function (err, image) {\n  if (err) {\n    console.log('Unable to load image');\n\
    \    return;\n  }\n  console.log('Image loaded');\n}\n```\n\nBluebird provides\
    \ a convenient function named promisify that wraps node-style functions with that\
    \ return a promise, as shown in Example 4-7.\n\nExample 4-7. Promisify to wrap\
    \ a node-style function\n\n```\nvar loadImageWrapper = Bluebird.promisify(loadImageNodeStyle);\n\
    var promise = loadImageWrapper('computer_problems.png');\n```\n\n```\npromise.then(function\
    \ (image) {\n  console.log('Image loaded');\n}).catch(function (error) {\n  console.log('Unable\
    \ to load image');\n});\n```\n\nThe LoadImageWrapper function accepts the same\
    \ url argument as the original loadImageNodeStyle function but does not require\
    \ a callback. Using promisify calls a callback internally and correctly writes\
