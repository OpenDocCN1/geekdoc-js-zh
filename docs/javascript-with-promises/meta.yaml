    \n## 生成器与迭代器 (Generators and Iterators)\n\n生成器是一种特殊的函数，它可以暂停执行以将值传回给调用者，并从停止的地方继续执行。这种能力对于生成一系列值非常有用。可以以斐波那契数列作为一个例子。如果没有生成器，它可以像示例\
    \ 6-14 那样进行计算。\n\n示例 6-14. 不使用生成器计算一系列值\n\n```javascript\nvar a = 0;\nvar b =\
    \ 1;\n\nfunction fib() {\n  b = a + b;\n  a = b - a;\n  return b;\n}\n\nvar i;\n\
    for (i = 0; i < 5; i++) console.log(fib());\n```\n\n```javascript\n// Console输出:\n\
    // 1\n// 2\n// 3\n// 5\n// 8\n```\n\n`fib` 函数跟踪序列中使用的最后两个值，并在每次被调用时将它们相加以计算下一个值。示例\
    \ 6-15 显示了使用生成器的等效代码。\n\n示例 6-15. 使用生成器计算一系列值\n\n```javascript\nfunction fib()\
    \ {\n  var a = 0;\n  var b = 1;\n  while (true) {\n    yield a + b;\n    a = b\
    \ - a;\n  }\n}\n\nvar i;\nvar result;\nvar iterator = fib();\nfor (i = 0; i <\
    \ 5; i++) {\n  result = iterator.next();\n  console.log(result.value);\n}\n```\n\
    \n```javascript\n// Console输出与上示例相同\n```\n\n`fib` 函数现在是一个生成器，通过在函数关键字后面添加 `*`\
    \ 来指示。当调用生成器时，JavaScript 引擎不会像处理普通函数那样开始运行 `fib` 内部的代码。相反，调用 `fib` 会返回一个迭代器（iterator）。迭代器用于暂停和恢复生成器的执行，并在生成器和调用代码之间传递值。\n\
    \n`fib` 内部的代码在第一次调用 `iterator.next()` 时开始运行。执行一直持续到 `yield` 关键字。在此时，函数暂停，并将 `yield`\
    \ 表达式的结果作为 `iterator.next()` 的返回值传回给调用代码。结果是一个对象，它以适当正确命名的值提供 `yield` 语句的结果。\n\
    \n当再次调用 `iterator.next()` 时，`fib` 内部的代码将从 `yield` 语句之后的一行继续执行。`a` 和 `b` 的值被更新，`while`\
