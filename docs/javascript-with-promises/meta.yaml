    \ Otherwise the promise is fulfilled with any additional arguments passed to the\
    \ callback.\n\nStandard promises cannot be fulfilled by more than one value. However,\
    \ node-style callbacks expect more than one value when an operation succeeds.\
    \ In this case you can instruct promisify to fulfill the promise with an array\
    \ containing all the arguments passed to callback except the error argument, which\
