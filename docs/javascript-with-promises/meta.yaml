  md: '# Preface


    Asynchronous JavaScript is everywhere. AJAX, WebRTC, and Node.js are a few examples
    of where asynchronous APIs are found. Although it is easy to write a quick function
    to handle the result of one HTTP request, it is also easy to get lost in an unpredictable
    sea of callbacks as a codebase grows and more people contribute. That''s where
    a good approach for handling asynchronous code comes in and many developers choosing
    to use Promises in their approach.


    This is the book I needed when originally choosing an asynchronous strategy, and
    it is the result of my experience using promises in JavaScript applications. It
    explains their use and inner workings while exposing difficulties and Promises
    are made up of only a few concepts with a small API. In the same way that JavaScript''s
    small number of simple constructs are used to create elegant and powerful solutions,
    I am surprised and pleased at the number of ways Promises can be used to effectively
    manage asynchronous code.


    # Intended Audience


    This book is for intermediate and advanced JavaScript developers who want to write
    asynchronous code. These developers may be comfortable with JavaScript for traditional
    web APIs but are moving to environments such as Node.js, Google Chrome packaged
    apps, or building desktop applications with JavaScript. Developers who write browser-based
    code and want to use frameworks such as Angular or newer browser technologies
    such as Service Workers or WebRTC will also benefit. Even people who are already
    experienced with Promises may still enjoy reading the code and discovering additional
    ideas for their own work.


    # A Word on Style


    This is not a book about JavaScript syntax dos and don''ts. All the examples are
    intended to be clear and casual; however, this style may conflict with some recom-'
