- md: "\ntwo turns of the loop gives your code time to deal with a rejected promise,\
    \ which reduces the chance of a handled rejection showing up in the console.\n\
    \nExample 5-6. Bluebird reporting an unhandled rejection\n\n```\nBluebird.reject('No\
    \ one listens to turtle');\n\n// Console output:\n// Possibly unhandled Error:\
    \ No one listens to turtle\n// at Function.Promise$Reject\n```\n\nThe developer\
    \ tools in your web browser also report that Chrome and Mozilla Firefox both did\
    \ this but in slightly different ways. Chrome logged unhandled rejections immediately\
    \ whereas Firefox waited until garbage collection occurred. The Firefox approach\
    \ introduces a delay that eliminates false positives (i.e., showing a rejection\
    \ that is eventually handled).\n\n## Implementing try/catch/finally\n\nA try/catch/finally\
    \ allows you to run some code, handle any exceptions the code throws, and then\
    \ run some final code regardless of whether an exception occurred. To see why\
    \ this is useful, first consider the following function in Example 5-7, which\
    \ fetches some data and uses the performance.now() Web API to log the amount of\
    \ time taken.\n\nExample 5-7. A try/catch block\n\n```\nfunction getData() {\n\
    \  var timestamp = performance.now();\n  try {\n    // Fetch data\n    // ...\n\
    \  } catch (err) {\n    // Deal with any errors that arise\n    // ...\n  }\n\
    \  console.log('getData() took ' + (performance.now() - timestamp));\n}\n```\n\
    \nThe log statement runs regardless of whether an error occurs inside the try\
    \ block because catch handles any error. Unfortunately this approach swallows\
    \ the errors, so that the code never knows when an error occurs. In order to inform\
    \ the calling code, the catch block needs to rethrow the error, but that will\
    \ bypass the log statement. That's where the finally block comes in.\n\nExample\
    \ 5-8 is an example of a traditional try/catch/finally block.\n\nExample 5-8.\
    \ A traditional try/catch/finally block\n\n```\nfunction getData() {\n  var timestamp\
    \ = performance.now();\n  try {\n    // Fetch data\n    // ...\n  } catch (err)\
    \ {\n    // Bubble error to code that called this function\n    throw err;\n \
    \ }\n  finally {\n    // Log time taken regardless of whether the preceding code\
    \ throws an error\n    console.log(getData() + ' ' + (performance.now() - timestamp));\n\
    \  }\n}\n\n// Console output:\ngetData() took 0.030000000158906914\n```\n\nYou\
    \ can create an asynchronous try/catch/finally using promises. We've already seen\
    \ any errors within a promise chain are sent to the next callback by using traditional\
    \ try/catch blocks. To implement the finally portion, follow the call to catch\
    \ with and not retrieve the error provided to catch, as shown in Example 5-9.\n\
    \nExample 5-9. Use catch/then to mimic catch/finally\n\n```\nfunction getData()\
    \ {\n  var dataPromise;\n  var timestamp = performance.now();\n  // ...\n  dataPromise\
    \ = new Promise(function (resolve, reject) {\n    // ...\n    throw new Error('Unexpected\
    \ problem');\n  });\n\n  dataPromise.catch(function (err) {\n    // Do not rethink\
    \ error\n  }).then(function () {\n    // Simulates finally block\n    console.log('Data\
    \ fetch took ' + (performance.now() - timestamp));\n  });\n\n  // Return data\
    \ promise instead of catch/then tail to propagate rejection\n  return dataPromise;\n\
    }\n```\n\nThe code in Example 5-9 creates a chain of three promises: the dataPromise,\
    \ the promise returned by catch, and the promise returned by then. The promise\
    \ returned by catch is always fulfilled because no error is thrown inside the\
    \ callback given to catch. That promise executes the callback passed to then,\
    \ which contains the same code that would have been placed in a finally block\n\
    \nSome promise libraries, like Bluebird, implement promise.finally() for convenience.\
    \ This method runs regardless of whether the promise is fulfilled or rejected\
    \ and returns a promise that is settled in the same way. Example 5-10 shows a\
    \ revised version using bluebirdPromise.finally().\n\nExample 5-10. Bluebird's\
    \ promise.finally()\n\n```\nfunction getData() {\n  var timestamp = performance.now();\n\
    \n  return new Bluebird(function(resolve, reject) {\n    //\n    throw new Error('Unexpected\
    \ problem');\n  }).finally(function () {\n    console.log('Data fetch took ' +\
    \ (performance.now() - timestamp));\n  });\n}\n```\n\nThe revised code is simpler;\
    \ bluebirdPromise.finally() can remove the explicit promise variable and catch\
    \ function needed to mimic a finally block using the standard Promise API.\n\n\
    ## Using the Stack\n\nIt is often helpful to examine the stack when troubleshooting\
    \ code because it answers the question How did I get here? Whenever a function\
    \ is invoked, the line that called the function is added to the stack. When an\
    \ error occurs, the stack contains the trail of calls that shows how the machine\
    \ arrived at that point. A typical view of the stack lists the name of each function\
    \ in the trail and the line number of the code that called the next.\n\nThe JavaScript\
    \ call stack starts with whatever code the runtime inside the current turn of\
    \ the event loop. The stack continues to grow as that code calls another function,\
    \ which in turn calls another function, etc. As each function returns, it is removed\
    \ from the stack until the stack is empty, at which point the event loop turns\
    \ again.\n\nExample 5-11 shows a function that is called whenever clicking the\
    \ mouse or pressing a key along with the associated call stack.\n\nExample 5-11.\
    \ Sample call stack\n\n```javascript\nfunction alpha() {\n  beta();\n}\n\nfunction\
    \ beta() {\n  trace();\n}\n\nfunction trace() {\n  console.log('Stack trace:');\n\
    \  console.log(new Error().stack);\n}\n\nalpha();\n```\n"
  mdcn: "\n循环两次可以让你的代码有时间处理被拒绝的 promise（rejected promise），这减少了在控制台中显示已处理拒绝的概率。\n\n\
    示例 5-6. Bluebird 报告未处理的拒绝\n\n```\nBluebird.reject('No one listens to turtle');\n\
    \n// Console output:\n// Possibly unhandled Error: No one listens to turtle\n\
    // at Function.Promise$Reject\n```\n\n你的 Web 浏览器开发者工具也报告了 Chrome 和 Mozilla Firefox\
    \ 都这样做了，但方式略有不同。Chrome 立即记录了未处理的拒绝，而 Firefox 则会等待垃圾回收的发生。Firefox 的方法引入了延迟，从而消除了假误报（即显示一个最终会被处理的拒绝）。\n\
    \n## 实现 try/catch/finally\n\ntry/catch/finally 允许你运行某些代码，处理该代码抛出的任何异常，然后无论是否发生异常都运行某些最终代码。为了理解为什么这很有用，先考虑示例\
    \ 5-7 中的以下函数，它获取某些数据并使用 `performance.now()` Web API 来记录所花费的时间。\n\n示例 5-7. 一个 try/catch\
    \ 块\n\n```\nfunction getData() {\n  var timestamp = performance.now();\n  try\
    \ {\n    // 获取数据\n    // ...\n  } catch (err) {\n    // 处理任何产生的错误\n    // ...\n\
    \  }\n  console.log('getData() took ' + (performance.now() - timestamp));\n}\n\
    ```\n\n无论 `try` 块内部是否发生错误，日志语句都会执行，因为 `catch` 处理了任何错误。遗憾的是，这种方法会吞掉错误，导致代码永远不知道错误何时发生。为了通知调用代码，`catch`\
    \ 块需要重新抛出错误，但这将跳过日志语句。这正是 `finally` 块派上用场。\n\n示例 5-8 是一个传统的 try/catch/finally\
    \ 块的示例。\n\n示例 5-8. 一个传统的 try/catch/finally 块\n\n```\nfunction getData() {\n  var\
    \ timestamp = performance.now();\n  try {\n    // 获取数据\n    // ...\n  } catch\
    \ (err) {\n    // 将错误冒泡给调用此函数的代码\n    throw err;\n  }\n  finally {\n    // 无论前面的代码是否抛出错误，都记录所花费的时间\n\
    \    console.log(getData() + ' ' + (performance.now() - timestamp));\n  }\n}\n\
    \n// Console output:\ngetData() took 0.030000000158906914\n```\n\n你可以使用 promises\
    \ 创建异步的 try/catch/finally。我们已经看到，promise 链中的任何错误都会通过使用传统的 `try/catch` 块发送到下一个回调。要实现\
    \ `finally` 部分，请在 `catch` 调用后跟一个 `then` 不要返回传递给 `catch` 的错误，如示例 5-9 所示。\n\n示例\
    \ 5-9. 使用 catch/then 模拟 catch/finally\n\n```\nfunction getData() {\n  var dataPromise;\n\
    \  var timestamp = performance.now();\n  // ...\n  dataPromise = new Promise(function\
    \ (resolve, reject) {\n    // ...\n    throw new Error('Unexpected problem');\n\
    \  });\n\n  dataPromise.catch(function (err) {\n    // 不要重新思考错误\n  }).then(function\
    \ () {\n    // 模拟 finally 块\n    console.log('Data fetch took ' + (performance.now()\
    \ - timestamp));\n  });\n\n  // 返回数据 promise 而不是 catch/then 尾部以传播拒绝\n  return\
    \ dataPromise;\n}\n```\n\n示例 5-9 中的代码创建了一个包含三个 promise 的链：`dataPromise`、`catch`\
    \ 返回的 promise 以及 `then` 返回的 promise。`catch` 返回的 promise 总是处于完成状态的（fulfilled），因为在传递给\
    \ `catch` 的回调内部没有抛出错误。该 promise 会执行传递给 `then` 的回调，该回调包含了本应放在 `finally` 块中的相同代码。\n\
    \n一些 promise 库（如 Bluebird）为了方便起实现了 `promise.finally()`。该方法无论 promise 是完成还是被拒绝都会执行，并返回一个状态相同的\
    \ promise。示例 5-10 显示了使用 `bluebirdPromise.finally()` 的修订版本。\n\n示例 5-10. Bluebird\
    \ 的 promise.finally()\n\n```\nfunction getData() {\n  var timestamp = performance.now();\n\
    \n  return new Bluebird(function(resolve, reject) {\n    //\n    throw new Error('Unexpected\
    \ problem');\n  }).finally(function () {\n    console.log('Data fetch took ' +\
    \ (performance.now() - timestamp));\n  });\n}\n```\n\n修订后的代码更简单；`bluebirdPromise.finally()`\
    \ 可以移除使用标准 Promise API 模拟 `finally` 块所需的显式变量 变量和 函数。\n\n## 使用堆栈\n\n在调试代码时，检查栈通常很有帮助，因为它回答了“我是如何到达这里的？”这个问题。每当函数被调用时，调用它的行就会被加入栈。当错误发生时，栈包含了调用轨迹，显示了机器是如何到达该点的。典型的栈视图列出了轨迹中每个函数的名称以及调用下一个函数的代码行号。\n\
    \nJavaScript 调用栈始于事件循环当前回合内运行的任何代码。随着该代码调用另一个函数，该函数再次调用另一个函数，栈会继续增长。每个函数返回时，它都会从栈中移除，直到栈为空，此时事件循环再次转换。\n\
    \n示例 5-11 显示了一个在点击鼠标或按下按键时调用的函数，以及相关的调用栈。\n\n示例 5-11. 样例调用栈\n\n```javascript\n\
    function alpha() {\n  beta();\n}\n\nfunction beta() {\n  trace();\n}\n\nfunction\
    \ trace() {\n  console.log('Stack trace:');\n  console.log(new Error().stack);\n\
    }\n\nalpha();\n```\n\n"
