    function getData() {\n  var dataPromise;\n  var timestamp = performance.now();\n\
    \  // ...\n  dataPromise = new Promise(function (resolve, reject) {\n    // ...\n\
    \    throw new Error('Unexpected problem');\n  });\n\n  dataPromise.catch(function\
    \ (err) {\n    // Do not rethink error\n  }).then(function () {\n    // Simulates\
