  - '[PAGE 20]


    # CHAPTER 2


    # Introducing Promises


    The biggest challenge with nontrivial amounts of async JavaScript is managing
    execution order through a series of steps and handling any errors that arise.
    Promises address this problem by giving you a way to organize callbacks into discrete
    steps that are easier to read and maintain. And when errors occur they can be
    handled outside the primary application logic without the need for boilerplate
    code in each step.


    A promise is an object that serves as a placeholder for a value. That is usually
    the result of an async operation such as an HTTP request or reading a file from
    disk. When an async function is called it can immediately return a promise object.
    Using that object, you can register callbacks that will run when the operation
    succeeds or an error occurs.


    This chapter covers the basic ways to use promises. By the end of the chapter
    you should be comfortable working with functions that return promises and to manage
    a sequence of asynchronous steps.


    This book uses the Promise API for the version of JavaScript known as ECMAScript
    6 (ES6). However, there were a number of popular JavaScript Promise libraries
    that the development community created before ES6 that may not match the spec.
    These differences are mostly trivial so it is generally easy to work with different
    implementations once you are using standard promises. We discuss API variations
    and compatibility issues with other libraries in Chapter 4.


    # Basic Usage


    Let''s walk through the basics of Promises using a series of examples beginning
    with a traditional callback approach and moving to an implementation using promises.
    Example 2-1 loads an image in a web browser and invokes a success or error callback
    based on the outcome.'
  - "[PAGE 21]\n\nExample 2-1. Using callbacks\n\n```\nloadImage('shadowfacts.png',\n\
    function onsuccess(img) {\n  // Add the image to the current web page\n  document.body.appendChild(img);\n\
    }\nfunction onerror(e) {\n  console.log('Error occurred while loading image');\n\
    \  console.log(e);\n}\n```\n\n```\nfunction loadImage(url, success, error) {\n\
    \  var img = new Image();\n  img.src = url;\n\n  img.onload = function () {\n\
    \    success(img);\n  };\n\n  img.onerror = function (e) {\n    error(e);\n  };\n\
    }\n```\n\nThe loadImage function uses an HTML Image object to load an image by\
    \ setting the src property. The browser asynchronously loads the image based on\
    \ the src and queues the onload or onerror callback after it's done.\n\nSince\
    \ loadImage is asynchronous, it accepts callbacks instead of immediately returning\
    \ the image from the function. However, if loadImage was changed to return a promise\
    \ you would attach the callbacks to the promise instead of passing them arguments\
