    \ promisify using function.bind: Hello my name is Marie\n```\n\nOnly the wrappers\
    \ using a bound function or where the context was provided as a second argument\
    \ include a name. All the wrappers call person.introNodeStyle(), which builds\
    \ a string containing this.name. The first wrapper created with an undefined second\
