    # Promise States


    The state of an operation represented by a promise is stored within the promise.
    At any given moment an operation has either begun, is in progress, has run to
    completion, or has stopped and cannot be completed. These conditions are represented
    by three mutually exclusive states:


    +   Pending

    The operation has not begun or is in progress.


    +   Fulfilled

    The operation has completed.'
