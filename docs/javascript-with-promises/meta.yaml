    \ badfunc 中，只有栈上的某处的 try/catch 块或全局异常处理器会捕获运行时错误。在 goodfunc 中，运行时错误拒绝了返回的 promise，因此调用代码可以像处理\
    \ promise 所代表的操作可能产生的任何其他问题一样处理它。\n\n在返回 promise 的函数中发生的任何错误都应该用于拒绝该 promise，而不是抛回给调用者。\n\
    \n## 传递错误 (Passing Errors)\n\n使用未捕获的错误来拒绝 promise 提供了一种在应用程序不同部分之间传递错误并在你选择的地方处理它们的简易方法。正如你在上一节中看到的，你在\
