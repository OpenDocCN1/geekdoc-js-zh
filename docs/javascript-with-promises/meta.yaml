  md: "```\nreturn Promise.race([freshData, cachedData, failure]);\n}\n```\n\nSome\
    \ scenarios were omitted from the preceding example so that they would not detract\
    \ from the point. For instance, if the network request fails quickly, the promise\
    \ returned from getData will be rejected immediately. In this case you may still\
    \ use the cache data if it is retrieved within the allotted time. Reactive programming\
    \ libraries such as RxJS, Bacon.js, and Kefir.js are specifically intended for\
    \ scenarios like this.\n\n# Functional Composition\n\nEarlier in the book you\
    \ saw how promise chains are useful in orchestrating a series of async steps.\
    \ The same pattern is also good for building pipelines of functions. This technique\
    \ of combining several functions into a more powerful composite is known as functional\
    \ composition, and it divides code into discrete units that are easier to test\
    \ and maintain.\n\nLet’s use a website for a large real estate agency Example\
    \ 3-16. Each agent in the company has a web page with her picture and contact\
    \ information. All the photos are displayed in the same size in black and white\
    \ and include the company name. You can create a pipeline that processes images\
    \ for the site.\n\nExample 3-16. Verbose pipeline\n\n```\n// Generic image processing\
    \ functions\nfunction scaleToFit(width, height, image) {\n  console.log('Scaling\
    \ image to ' + width + ' x ' + height);\n  return image;\n}\n```\n\n```\nfunction\
    \ watermark(text, image) {\n  console.log('Watermarking image with ' + text);\n\
    \  return image;\n}\n```\n\n```\nfunction grayscale(image) {\n  console.log('Converting\
    \ image to grayscale');\n  return image;\n}\n```\n\n```\n// Image processing pipeline\n\
    function processImage(image) {\n  return Promise.resolve(image).then(function\
    \ (image) {\n    return scaleToFit(300, 450, image);\n  }).then(function (image)\
    \ {\n    return watermark('The Real Estate Company', image);\n  }\n```"
