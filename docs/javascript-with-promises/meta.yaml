    \ has too many students');\n});\n\n// 控制台输出：\n// Number of students: 25\n// Classroom\
    \ has too many students\n```\n\n`countStudents` 函数中对 `tap` 的调用可以添加或删除，而不影响函数的结果。\n\
    \n使用 `return` 或 `tap` 会覆盖回调原本返回的赋值。这在之前的示例中之所以有效，是因为不需要 `connection.insert`（或\
