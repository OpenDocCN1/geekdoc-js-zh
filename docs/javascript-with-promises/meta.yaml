    \ can see the API as a whole and be aware of optional arguments.\n\n### Promise\n\
    \nnew Promise(function(resolve, reject) { ... }) returns promise\n\nThe Promise\
    \ global is a constructor function that the new keyword invokes.\n\nThe Promise\
    \ global creates promise objects that have the two methods then and catch for\
