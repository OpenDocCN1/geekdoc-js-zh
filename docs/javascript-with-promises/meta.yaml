    \ (e) {\n      reject(e);\n    };\n  });\n}\n```\n\n这两个函数之间的主要区别在于，`deferred`\
    \ 内部的代码可以抛出同步错误，而标准 promise 会将这些错误冒泡到 catch 中。更重要的区别在于处理解析和拒绝的回调。标准 promise 处理这些错误。有些开发者更喜欢\
    \ `deferred` 对象的风格，或者认为它们更易理解。然而，使用 `deferred` 的一个重要情况是在无法创建 promise的地方解析 promise。\n\
    \n假设你正在使用 web worker 执行耗时任务。你可以使用 promise 来表示任务的结果。接收 web worker 响应的代码将解析 promise，因此需要\
    \ `resolve` 和 `reject` 函数。示例 4-19 展示了这一点。\n\n示例 4-19. 使用 deferred 对象管理 web worker\
    \ 结果\n\n```javascript\n// task.js 内容\nonmessage = function(event) {\n  postMessage({\n\
