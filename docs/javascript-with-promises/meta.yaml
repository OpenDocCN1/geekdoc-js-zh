    Any error that occurs in a function that returns a promise should be used to reject\
    \ the promise instead of being thrown back to the caller.\n\n# Passing Errors\n\
    \nUsing uncaught errors to reject promises provides an easy way to pass errors\
    \ across different parts of an application and to handle them at the place of\
    \ your choosing. As you saw in the last section, all the code you write inside\
    \ promise callbacks is wrapped in an implicit try block; you need to provide the\
    \ catch. When presented with a chain of promises, add a catch wherever it is helpful\
    \ to deal with a rejection. Although you could use a catch handler to every promise\
    \ in a chain, it is generally practical to use a single handler at the end of\
    \ the chain.\n\nWhere does a promise end? It's common for a single function to\
    \ contain a chain of several promises that a series of calls defines. However,\
    \ the chain may not end. Promises are frequently extended across functions as\
    \ each caller appends a promise to the tail.\n\nConsider an async function that\
    \ operates a database connection, runs a query, and returns a promise that is\
    \ fulfilled with the resulting data. The function returns the last promise in\
    \ the chain but the calling function will add to that so it can do something with\
    \ the results, as shown in Example 5-4. The pattern continues the new tail is\
    \ returned to the next calling function, as described in “The Async Ripple Effect”\
    \ on page 25.\n\nExample 5-4. Promise chains built across functions\n\n```\nvar\
    \ db = {\n  connect: function () {/**...*/},\n  query: function () {/*...*/}\n\
    };\n\nfunction getReportData() {\n  return db.connect().then(function (connection)\
    \ {\n    return db.query(connection, 'select report data');\n  });\n}\n\n```\n\
    \n```\ngetReportData().then(function (data) {\n  data.sort();\n  console.log(data);\n\
    }\n```"
