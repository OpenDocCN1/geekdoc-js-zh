    }).spread(function (connection, count) {\n  console.log('Number of students: '\
    \ + count);\n  return connection.close();\n});\n```\n\n## jQuery 中的 Promises\n\
    \n在 jQuery 中，`deferred` 对象代表异步操作。`deferred` 对象类似于一个 promise，其 `resolve` 和 `reject`\
    \ 函数作为方法暴露出来。示例 4-17 显示了一个使用 `deferred` 对象的 `loadImage` 函数。\n\n示例 4-17. jQuery\
