    \ A dedicated panel for debugging promises in the Chrome developer tools is also\
    \ in the works. This is a huge help and other browsers may offer a similar feature\
    \ by the time you read.\n\nYou may also record errors occur while people are using\
    \ your software in the wild. When that happens, you don't have the luxury of opening\
    \ the debugger and looking at the stack. Developers have found clever ways to\
    \ capture the async call stack using multiple Error objects. This is problematic\
    \ because browsers expose the call stack for errors in different ways and it can\
    \ degrade application performance. You can configure Bluebird to capture and report\
    \ the stack trace across turns of the event loop by calling Bluebird.longStackTraces().\
    \ Keep in mind the impact on performance before enabling this option in the production\
    \ version of your application.\n\n# Summary\n\nHandling errors in asynchronous\
    \ code cannot be done with traditional try/catch blocks. Fortunately, promises\
    \ have a catch method for handling asynchronous errors. Although the method is\
    \ a powerful tool for handling problems that occur deep within your code, you\
    \ must use it properly to avoid silently swallowing errors. In addition to the\
    \ functionality that the standard Promise API provides, libraries such as Bluebird\
    \ offer extra error handling features. This includes the ability to report unhandled\
    \ rejections and to capture the stack call across multiple turns of the event\
