    ```\n\n// Console output is identical to the previous example\n\nHere the reduce\
    \ function from earlier is replaced by chain, which recursively calls itself for\
    \ each element in the array. A recursive in programming is creating a stack overflow\
    \ by making too many recursive calls in a loop. Fortunately, that does not occur\
    \ because a separate turn of the event loop invokes the promise callbacks, each\
    \ recursive call to chain is at the top of the call stack.\n\nAlthough using recursion\
    \ Example 3-12 has the same final outcome as building the chain with a loop, there\
    \ is an interesting difference between the two approaches. Using a loop builds\
    \ the entire chain of promises at the outset without waiting for any of the promises\
    \ to be resolved. The recursive approach adds to the chain on demand after resolving\
    \ the preceding promise. A major benefit of the on-demand approach is the ability\
    \ to decide whether to continue chaining promises based on the result from the\
    \ preceding promise.\n\nThe last few examples have made a chain with a predefined\
