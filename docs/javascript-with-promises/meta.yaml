    \ result'\n  });\n};\n\n// main.js 内容\nvar worker = new Worker('task.js');\nvar\
    \ deferreds = {};\nvar counter = 0;\n\nworker.onmessage = function (msg) {\n \
    \ var d = deferreds[msg.data.id];\n  d.resolve(msg.data.result);\n}\n\nfunction\
    \ background(task) {\n  var id = ++counter;\n  var deferred = $.Deferred();\n\
    \  deferreds[id] = deferred; // 存储 deferred 以备解析\n  console.log('Sending task\
    \ to worker: ' + task);\n  worker.postMessage({\n    id: id,\n    task: task\n\
    \  });\n  return deferred.promise(); // 只向调用代码暴露 promise\n}\n\nbackground('Solve\
    \ for x').then(function (result) {\n  console.log('The outcome is... ' + result);\n\
    }).fail(function(err) {\n  console.log('Unable to complete task');\n  console.log(err);\n\
    });\n\n// 控制台输出：\n// Sending task to worker: Solve for x\n// The outcome is...\
    \ some calculated result\n```\n\nworker 脚本在示例中非常简单。每当它接收消息时，都会返回一个包含原始请求 ID 和硬编码结果的对象。主脚本中的\
    \ `background` 函数在 worker 为该任务发送“completed”消息后返回一个解析的 promise。由于处理消息\n\n"
