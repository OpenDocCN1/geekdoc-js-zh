    \ try/catch 块中。这可以通过用 Promise 构造函数封装代码来实现。示例 5-3 显示了两个函数，以说明抛出同步错误与隐式拒绝 promise\
    \ 之间的区别。\n\n## 示例 5-3. 返回 promise 的函数不应抛出错误\n\n```javascript\nfunction badfunc(url)\
