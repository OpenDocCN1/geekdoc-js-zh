  md: "Example 5-8 is an example of a traditional try/catch/finally block.\n\nExample\
    \ 5-8. A traditional try/catch/finally block\n\n```\nfunction getData() {\n  var\
    \ timestamp = performance.now();\n  try {\n    // Fetch data\n    // ...\n   \
    \ catch (err) {\n      // Bubble error to code that called this function\n   \
    \   throw err;\n    }\n  finally {\n    // Log time taken regardless of whether\
    \ the preceding code throws an error\n    console.log(getData() + ' ' + (performance.now()\
    \ - timestamp));\n  }\n}\n\n// Console output:\ngetData() took 0.030000000158906914\n\
    ```\n\nYou can create an asynchronous try/catch/finally using promises. We've\
    \ already seen any errors within a promise chain are sent to the next callback\
    \ by using traditional try/catch blocks. To implement the finally portion, follow\
