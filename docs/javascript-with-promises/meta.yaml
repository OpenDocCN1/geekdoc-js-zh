    \ is possible.\n\n## Generators and Iterators\n\nA generator is a special type\
    \ of function that can pause its execution to pass values back to its caller and\
    \ resume execution where it left off. This ability is useful for generating a\
    \ series of values. The Fibonacci sequence can be generated as an example. Without\
