  md: '# JavaScript with Promises


    Asynchronous JavaScript is everywhere, whether you''re using Ajax, AngularJS,
    Node.js, or WebRTC. This practical guide shows intermediate to advanced JavaScript
    developers how Promises can help you manage asynchronous code—including the inevitable
    flow of callbacks as your codebase grows. You will learn the workings of Promises
    and ways to avoid difficulties and misses when using them.


    The ability to asynchronously fetch data and load scripts in the browser broadens
    the capabilities of JavaScript applications. But if you don''t understand how
    async part works, you''ll end up with unpredictable code that''s difficult to
    maintain. This book is ideal when you''re new to Promises or want to expand your
    knowledge of this technology.


    > Daniel Parker begins with an insightful introduction to asynchronous programming
    that any JavaScript developer will find with Promises covers both the How and
    Why, focusing on current practical tools.


    +   - Understand how async JavaScript works by delving into callbacks, the event
    loop, and threading

    - Learn how Promises organize callbacks into discrete steps that are easier to
    read and maintain

    - Examine scenarios you''ll encounter and techniques you can use when writing
    real-world applications

    - Use features in the Bluebird library and jQuery to work with Promises

    - Learn how the Promise API handles asynchronous errors

    - Explore ECMAScript 6 language features that simplify Promise-related code


    - Kris Koval Senior Software Engineer, Uber, creator of the Q library and Common
    JS modules


    > A comprehensive look at one of the most important tools of a modern JavaScript
    programmer.


    - Dominic Denolica Software Engineer, Google: Editor, ES2015 Promises specification


    Daniel Parker is a software developer focused on web and mobile applications.
    He writes JavaScript for Evernote in Austin, Texas, and is the organizer of the
    Austin Google Group.


