    \ a series of values without using a generator\n\n```javascript\nvar a = 0;\n\
    var b = 1;\n\nfunction fib() {\n  b = a + b;\n  a = b - a;\n  return b;\n}\n\n\
    var i;\nfor (i = 0; i < 5; i++) console.log(fib());\n```\n\n```javascript\n//\
    \ Console output:\n// 1\n// 2\n// 3\n// 5\n// 8\n```\n\nThe `fib` function tracks\
    \ the last two values used in the sequence and adds them together every time it\
    \ is called to calculate the next value. Example 6-15 shows the equivalent code\
    \ using a generator.\n\nExample 6-15. Computing a series of values using a generator\n\
    \n```javascript\nfunction fib() {\n  var a = 0;\n  var b = 1;\n  while (true)\
    \ {\n    yield a + b;\n    a = b - a;\n  }\n}\n\nvar i;\nvar result;\nvar iterator\
    \ = fib();\nfor (i = 0; i < 5; i++) {\n  result = iterator.next();\n  console.log(result.value);\n\
    }\n```\n\n```javascript\n// Console output is identical to the previous example\n\
    ```\n\nThe `fib` function is now a generator, which is indicated by adding the\
