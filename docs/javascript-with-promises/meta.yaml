    \ 4-16 所示。然后，可以使用扩展运算符（spread）将数组中的项拆分为回调的独立参数。\n\n示例 4-16. 使用 Promise.all() 封装多个值\n\
    \n```javascript\ngetConnection().then(function (connection) {\n  var promiseForCount\
