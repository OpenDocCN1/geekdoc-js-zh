- md: "\n## Example 3-5. Caching promise\n\n```javascript\nvar user = {\n  loginPromise:\
    \ null,\n\n  login: function () {\n    var me = this;\n    if (this.loginPromise\
    \ == null) {\n      this.loginPromise = ajax(/*someurl*/);\n    }\n    // Remove\
    \ cached loginPromise when a failure occurs to allow retry\n    this.loginPromise.catch(function\
    \ () {\n      me.loginPromise = null;\n    });\n    return this.loginPromise;\n\
    \  }\n};\n```\n\nExample 3-5, the loginPromise is created the first time login\
    \ is called. All subcalls return the same promise as long as the login process\
    \ does not fail. In case of failure, the cached promise is removed so the process\
    \ can be retried.\n\n## Parallel Execution\n\nMultiple asynchronous tasks can\
    \ be run in parallel, as shown in Example 3-6. Consider a financial website that\
    \ shows an updated balance for all your bank accounts and credit cards each time\
    \ you log in. The updated balance from each institution can be requested in parallel\
    \ and displayed as soon as it is received.\n\n## Example 3-6. Running asynchronous\
    \ tasks in parallel\n\n```javascript\n// Define each account\nvar accounts = ['Checking\
    \ Account', 'Travel Rewards Card', 'Big Box Retail Card'];\n\nconsole.log('Updating\
    \ balance information...');\naccounts.forEach(function (account) {\n  // ajax\
    \ returns a promise eventually fulfilled by the account balance\n  ajax(/*account*/).then(function\
    \ (balance) {\n    console.log(account + ' Balance: ' + balance);\n  });\n});\n\
    \n// Console output:\n// Updating balance information...\n// Checking Account\
    \ Balance: 384\n// Travel Rewards Card Balance: 509\n// Big Box Retail Card Balance:\
    \ 0\n```\n\nPromises are good for consolidating parallel tasks into a single outcome.\
    \ Suppose a message should be displayed informing the user when all the account\
    \ balances are up-to-date. You can create a consolidated promise using the Promise.all()\
    \ function that maps promises to their outcomes, as explained in Example 3-7.\
    \ A full description of this function is provided in “The Promise API” on page\
    \ 22. In short, Promise.all() returns a new promise that is fulfilled when all\
    \ the promises are fulfilled. If any of the promises get rejected, the new promise\
    \ is also rejected.\n\n## Example 3-7. Consolidating the outcomes of parallel\
    \ tasks with Promise.all()\n\n```javascript\nvar requests = accounts.map(function\
    \ (account) {\n    return ajax('/someurl for account/+');\n});\n\n// Update status\
    \ message all all requests are fulfilled\nPromise.all(requests).then(function\
    \ (balances) {\n    console.log(' ' + balances.length + ' balances are up to date');\n\
    }).catch(function (error) {\n    console.log('An error occurred while retrieving\
    \ balance information');\n    console.log(error);\n});\n\n// Console output:\n\
    // All 3 balances are up to date\n```\n\nInstead of looping through the accounts\
    \ usingforEach, the map function is used to create an array of promises representing\
    \ a balance request for each account. Promise.all() then consolidates the promises\
    \ into a single promise. An array containing all the account balances resolves\
    \ the consolidated promise. In this example the length property of that array\
    \ is used to display the number of balances retrieved.\n\nYou can also wait for\
    \ all the operations represented by some promise regardless of whether they succeeded\
    \ or failed. Example 3-8, let’s revise Example 3-7 to show the number of balances\
    \ that were updated even when some requests failed.\n\n## Example 3-8. Running\
    \ code after multiple operations have finished, regardless of outcome\n\n```javascript\n\
    function settled(promises) {\n    var allAsFulfilled = promises.map(function (p)\
    \ {\n        return p.then(\n            function onFulfilled(value) {\n     \
    \           return { state: 'fulfilled', value: value };\n            },\n   \
    \         function onRejected(reason) {\n                return { state: 'rejected',\
    \ reason: reason };\n            }\n        );\n    });\n    return Promise.all(allAsFulfilled);\n\
    }\n\n// Update status message once all requests finish\nsettled(requests).then(function\
    \ (outcomes) {\n  var count = 0;\n  outcomes.forEach(function (outcome) {\n  \
    \  if (outcome.state == 'fulfilled') count++;\n  });\n  console.log(count + '\
    \ out of ' + outcomes.length + ' balances were updated');\n});\n\n// Console output\
    \ (varia based on requests):\n// 2 out of 3 balances were updated\n```\n\nThe\
    \ settled function consolidates an array of promises into a single promise that\
    \ fulfilled once all the promises in the array are settled. An array of objects\
    \ that indicate the outcome of each promise fulfills the new promise. In this\
    \ example, the outcome of outcomes is reduced to a single value representing the\
    \ number of requests that succeeded.\n\n## Sequential Execution Using Loops or\
    \ Recursion\n\nYou can dynamically build a chain of promises to run tasks in sequential\
    \ order (i.e., each task must wait for the preceding task to finish before it\
    \ begins.) Most of the examples so far have demonstrated sequential chains of\
    \ calls built with a predefined number of steps. It is common to have an array\
    \ where each item requires its async count to get the balance for each one. Those\
    \ balances were retrieved in parallel there are times when you want to run tasks\
    \ sequentially. For instance, if each task requires significant bandwidth or computation,\
    \ you may throttle the amount of work being done.\n\nBefore building a sequential\
    \ chain, let's start with code that runs a set of tasks in parallel, as shown\
    \ in Example 3-9, based on the items in an array similar to Example 3-6.\n\n1.\
    \ It is natural to use outcomes.reduce() in place of outcomes.forEach(this) in\
    \ this example; however, some readers may be unfamiliar with reduce, so it is\
    \ not used until it is explained in the next section (see Example 3-10).\n2. The\
    \ settled function is based on a similar function in the Bluebird library.\n\n\
    ## Example 3-9. Running tasks in parallel using a loop\n\n```javascript\nvar products\
    \ = ['sku-1', 'sku-2', 'sku-3'];\n\nproducts.forEach(function (sku) {\n  getInfo(sku).then(function\
    \ (info) {\n    console.log(info);\n  });\n});\n\nfunction getInfo(sku) {\n  console.log('Requested\
    \ info for ' + sku);\n  return ajax(/*someurl for sku*/);\n}\n\n// console output:\n\
    // Requested info for sku-1\n// Requested info for sku-2\n// Requested info for\
    \ sku-3\n// Info for sku-1\n// Info for sku-2\n// Info for sku-3\n```\n\nThis\
    \ code iterates through an array of products and calls the getInfo function for\
    \ each one. The beginning of each request is logged to the console inside getInfo\
    \ and the outcome of each request is logged inside the loop after completing the\
    \ request. You can see the requests are run in parallel because the code inside\
    \ the foreach does not use promises as previous iterations of the loop are created.\
    \ The order of the console output also demonstrates the parallel nature of the\
    \ code. All three requests are made before the first result is received.\n\nLet's\
    \ move from parallel tasks to sequential chains. The code we'll use to do that\
    \ can be daunting if you are unfamiliar with the array reduce function, which\
    \ distills the elements of an array to a single value. Example 3-10 provides a\
    \ snippet to serve as an introduction/reference to how reduce is used.\n\n## Example\
    \ 3-10. Overview of array.reduce\n\n```javascript\nfinalResult = array.reduce(function(previousValue,\
    \ currentValue) {\n  // Create a result using the previousValue and currentValue\n\
    \  // return the result which will be used as the previousValue in the next loop\n\
    \  return previousValue + currentValue;\n}, initialValue); // Used with first\
    \ element\n```\n\nThe reduce function uses a callback that is invoked for each\
    \ element in the array. It receives the previous value returned from the callback\
    \ and the current element in the array. The previous value in the callback is\
    \ seeded with an initial value the first time the callback is invoked. The return\
    \ value for reduce is whatever the callback returns when it is invoked for the\
    \ last element in the array.\n\n## Example 3-11. Simple array.reduce to sum numbers\n\
    \n```javascript\nvar numbers = [2, 4, 6];\nvar sum = numbers.reduce(function(sum,\
    \ number) {\n  return sum + number;\n});\nconsole.log(sum);\n```\n\n```javascript\n\
    // Console output:\n// 12\n```\n\nYou could write some code with a for loop that\
    \ would accomplish the same thing as reduce but would be clunky by comparison.\
    \ Now let's get back to running tasks using reduce.\n\n**Example 3-12** uses the\
    \ same array and getInfo from earlier code to request and display information.\
    \ However, no request is started until the previous one completes. Although this\
    \ could be done by chaining the reduce function on directly, the logic has been\
    \ abstracted into a function called sequence.\n\n## Example 3-12. Build a sequential\
    \ chain using a loop\n\n```javascript\n// Build a sequential chain of promises\
    \ from the elements in an array\nfunction sequence(array, callback) {\n  array.reduce(function(promise,\
    \ item) {\n    promise.then(function () {\n      return callback(item);\n    });\n\
    \  }, Promise.resolve({}));\n}\n```\n\n```javascript\nvar products = ['sku-1',\
    \ 'sku-2', 'sku-3'];\nsequence(products, function (sku) {\n  getInfo(sku).then(function\
    \ (info) {\n    console.log(info);\n  });\n}).catch(function (reason) {\n  console.log(reason);\n\
    });\n```\n"
