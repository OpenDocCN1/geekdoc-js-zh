  md: "# Working with Standard Promises\n\nWe've covered the standard Promise API\
    \ and some basic scenarios, but like any technology,\nthat's only part of the\
    \ story. Now it's time for scenarios you'll encounter and\ntechniques you can\
    \ use while writing real-world applications.\n\n# The Async Ripple Effect\n\n\
    Async functions and promises are contagious. After you start using them naturally\
    \ spread through your code. When you have one async function, any code that\n\
    calls that function now contains an async step. The process of other functions\
    \ becoming by extension creates a ripple effect that continues all the way through\
    \ the\ncall stack. This is shown in Example 3-1 using three functions. Look how\
    \ the async\najax function forces the other functions to also be.\n\nExample 3-1.\
    \ The async ripple effect\n\n```\nshowPun().then(function () {\n  console.log('Maybe\
    \ I should stick to programming');\n});\n\nfunction showPromise() {\n  return\
    \ getPun().then(function (pun) {\n    console.log(pun);\n  });\n}\n\nfunction\
    \ getPun() {\n  // Assume ajax(json) returns a promise that is eventually\n  //\
    \ fulfilled by json {content:'The pet job was ruff!'}\n  return ajax(/*someurl*/).then(function\
    \ (json) {\n    var pun = JSON.parse(json);\n```"
