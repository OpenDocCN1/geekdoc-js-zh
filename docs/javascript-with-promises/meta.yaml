    \n## 向生成器发送值\n\n值不仅可以从生成器传回给调用代码，也可以从调用代码传递到生成器。`iterator.next()` 接受一个参数，该参数被用作生成器内部\
    \ `yield` 表达式的结果。示例 6-16 展示了向生成器传递值。在这种情况下，函数默认一次计数 1 个，但可以调整为按任何增量进行计数。\n\n示例\
    \ 6-16. 向生成器传递值\n\n```javascript\nfunction counter() {\n  var count = 0;\n  var\
    \ increment = 1;\n  while (true) {\n    count = count + increment;\n    increment\
    \ = (yield count) || increment;\n  }\n}\n```\n\n```javascript\nvar iterator =\
    \ counter();\nconsole.log(iterator.next().value); // 1\nconsole.log(iterator.next().value);\
