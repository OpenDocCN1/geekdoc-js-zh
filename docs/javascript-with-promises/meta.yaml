    \ bind method to set the context to an object literal.\n\n![](img/86b9481a293cab930786a4c67d908e3e_55_0.png)\n\
    \nBe careful when wrapping functions that are intended to run as methods (i.e.,\
    \ in the context of a certain object) Use the function's bind or an equivalent\
    \ wrapper to ensure the method is run in the expected context. Running methods\
    \ in the wrong context may cause runtime errors or unexpected behavior.\n\n# Working\
    \ with Collections of Promises\n\nBluebird provides-enhanced versions of the map,\
    \ reduce, and filter methods similar to the ones available for standard JavaScript\
    \ arrays. Example 4-10 shows the filter and reduce methods at work.\n\nExample\
    \ 4-10 Using a promise-enabled filter and reduce\n\n```\nfunction sumOddNumbers(numbers)\
    \ {\n  return numbers.filter(function removeEvenNumbers(num) {\n    return num\
    \ % 2 == 1;\n```"
  - "[PAGE 56]\n\n```\n))).reduce(function sum(runningTotal, num) {\n  return runningTotal\
    \ + num;\n}\n```\n\n```\n// Use sumOddNumbers as a synchronous function\nvar firstSum\
    \ = sumOddNumbers([1, 2, 3, 4]);\nconsole.log('first sum: ' + firstSum);\n```\n\
    \n```\n// Use sumOddNumbers as an async function\nvar promise = Bluebird.resolve([5,\
    \ 6, 7, 8]);\nsumOddNumbers.then(Function (secondSum) {\n  console.log('second\
    \ sum: ' + secondSum);\n});\n```\n\n```\n// Console output:\n// first sum: 4\n\
    // second sum: 12\n```\n\nThe sumOddNumbers function accepts an array of numbers\
    \ and uses filter to remove any even numbers. Then reduce is used to add the remaining\
    \ values. The function works regardless of whether it is a passed array or a promise\
    \ that array fulfilled. These promise-enabled methods allow you to write async\
    \ code that looks identical to the synchronous equivalent.\n\nAlthough the synchronous\
    \ and async code looks the same and produces the same result, the execution sequence\
    \ may differ. The promise-enabled map, reduce, and filter methods invoke their\
    \ callbacks for each value as soon as possible. The array contains a promise,\
    \ the callback is not invoked for element until the promise is resolved. For map\
    \ and filter means the callbacks can receive values in a different order than\
    \ they appear in the array. Example 4-11 shows a map passing values to the callback\
    \ out of order.\n\nExample 4-11. Eager invocation of aggregate functions\n\n```\n\
    function resolveLater() {\n  return new Bluebird(function (resolve, reject) {\n\
    \    setTimeout(function () {\n      resolve(value);\n    });\n  });\n}\n```\n\
    \n```\nvar numbers = Bluebird.resolve([\n  1,\n  resolveLater(2),\n  3\n]);\n\
    ```"
