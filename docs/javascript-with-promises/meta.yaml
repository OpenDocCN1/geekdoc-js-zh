    \ loaded.\n\nExample 1-8. The jQuery ready function can be synchronous or asynchronous\n\
    \n```\njQuery.ready(function () {\n  // jQuery calls this function after the DOM\
    \ is loaded and ready to use\n  console.log('DOM is ready');\n});\n```\n\n```\n\
    console.log('I am the last line of the script');\n```\n\n// Console output may\
    \ appear in either order depending on when the DOM is ready\n\nFunctions are not\
    \ consistently synchronous or asynchronous create a fork in the execution path.\
    \ The jQuery ready function creates a fork with two paths. If a function containing\
    \ the same style of mixed behavior invoked ready, there would be four possible\
    \ paths. The explosion in execution branches makes explaining and testing this\
    \ approach difficult, and reliable behavior in a production environment more challenging.\
    \ Isaac Schuster writes a popular blog post about this titled \"Designing APIs\
