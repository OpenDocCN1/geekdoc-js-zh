    为新产品以及服务建立可靠的连接和品牌并为增长提供动力是更合适的。在创意、创新以及设计的每一个方面，我们称之为“可靠性连接”（Reliability Connection）。


    ## 在那行字之前


    你现在需要一整军备备的卫生产品才能进入市场。所有的竞争对手都有良好的质量、优质的服务、良好的渠道、优秀的员工、良好的价格、良好的沟通，一切都非常完美……在索尼，有一句说法，所有产品的功能、性能、技术和价格都是完全相同的。将他们的产品与竞争对手区分开来的唯一因素就是设计，因为没有在开发中投入大量的精力来赋予生命。良好的设计。那么呢？


    在上述创意行业中，有很多关于“线上广告”（ATL）和“线下营销”（BTL）传播的讨论。在红这一角——ATL，指的是在杂志、广播、户外电视和录音带中进行的传统广告。在蓝这一角，我们会找到BTL，它关乎公关系（PR）、网页、细节沟通等。如果你问我们，ATL
    在这里败于一筹。但我们将更深入地探讨这个问题，并展示我们自己的 BTL：线下营销。我们的 BTL 就像我热爱蝴蝶，也热爱热爱蜜蜂……


    ## 更快的马


    今天，营销人员的任务是将新产品推向市场，而这（仅仅）是因为他们的工作是了解人们喜欢和想要什么。但他们真的知道人们需要什么吗？这比……更有意思的是，去观察人们做了什么，而不是听他们说什么。看看他们的孩子；他们喜欢你所做的，而不是按照你告诉他们怎么做的。正如亨利·福特一样，我可能在关于城市需求的直接提问中，会用“更快的马”来回答“一辆四轮的汽车”。


    我们认为营销人员的思维往往同样狭隘。对于他们许多人来说，他们不看现有类别之外的东西，而且通常只关注已经可以获得的东西，也许。


    所以，就让创意设计的文化渗透到组织中，并将研发部门的创新香气与营销部门的外出风格统一起来。仅仅通过结合不同的技能和思维方式，就能创造出真正的创新，让你随之改变——这种改变是你在广告战中无法赢得获得的——去追求“可靠性视角”吧！


    离开吧，让产品自己去说话。赋予它们意义、个性以及灵魂！这可能是区分你的产品供应最好的方式。从纯财务的角度来看：产品由于什么原因没有被生产？这种沟通有效吗？


    为什么不把金钱和精力从（广告）转移到（研发）产品生命周期的开始呢？对于生产来说，这个业务可以具有更多创新性，这将让他们从一开始就有在产品中构建沟通特质。当我们把产品以及和服务做得更好时，我的意思是，运气好的话，上述目标群体中的许多人将成为我们的来源。


    例如：当 iPod 在 2001 年推出时，苹果花费了 2.45 亿美元推出这款产品。这是一笔巨款，但可能只是让一个缺乏吸引力的产品获得全球成功成本的十分分之一。良好的设计以及口碑在设计中最重要：设计
    = 经济，正如伟大的瑞典平面设计师恩格·艾克塞尔（Enrique Axel）所描述的那样。这已经追溯到 1964 年。最后：所有的连接都取决于这种情况。设计策略触无处不在。


    我们有信心，公司将能够创造出更可靠的品牌、良好的设计和创新策略，而不仅仅是在最后给产品包上广告。广告资金应该花在那些重要的、并对企业和消费者都有益的创新上。谁不想让人们的生活变得更好、更公平、运气更强，开发更具吸引力且稳定的产品和服务呢？


    有人可以辩称，这一切都会被模仿：产品服务的提供，如果它足够成功，它将会如此。当每个人都有相同的技术时，总会有模仿品。因此，我们必须区分自己并保持明确，你需要更聪明、更积极。前进的好方法是少一些技术官僚，多一些前文化，因为文化价值是业务设计中最困难的部分。将设计策略整合到公司战略中（结合营销、时间、研发、财务等），你会走得非常远。


    我们都知道自 20 世纪 80 年代以来关于品牌的讨论：“是我们最有价值的活动资产”。今天这已是常识，也是一种卫生因素。现在设计策略中是“新的”品牌策略。


    拥有清晰设计策略的成功公司（如苹果）明白，这些设计问题必须在高层管理中进行讨论和决定。


    设计策略必须触及公司战略的每一个角落，所以它是必要的，而且是一个无可比拟的竞争优势。这超越了品牌和平面设计问题；这是你业务中发生的一切。你的客户支持是如何运作的？告诉我你的办公室里有鲜花和水果吗？接待处播放什么好听的音乐？你是如何产品或服务的？你是如何展示它的？一切都被考虑在内，没有重要的，你需要一个全局观并管理过程——设计过程。这是你最重要的过程，因为设计帮助你在沟通中取得成功。通过良好的沟通，你将实现并变得快乐，我希望，成为你客户感知中积极的一部分。


    泛指永恒品牌讨论：品牌以及对设计过程的产出进行评估。


    我们的赢


    今天我们都知道我们需要进化、创新并寻找新的生存方式，无论是出于职业、个人还是环境原因。我们传达出我们承担责任并关注业务困境：为什么？当你能做一些更强大的并且在现实中两者都能积累你的品牌并售出更多时，请宣布。

