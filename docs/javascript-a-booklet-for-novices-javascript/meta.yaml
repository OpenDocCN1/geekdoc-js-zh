    \n# Java Script 以及 Ajax\n\nJava Script 是一种客户端脚本语言。当你打开一个网页时，你的网络浏览器首先从服务器下载所有必要的记录，以便正确显示此页面。这些所需文件是：HTML、CSS、图像、视频等以及\
    \ Java Script 文件。当浏览器下载完成后，会在它的窗口中显示此页面，任何与其相关的脚本将从加载的脚本开始执行。\n\n在 Ajax 技术中，用户输入和其他数据通过\
    \ Java Script 发送到 Web 服务器。Java Script 创建了 XML_HTTP_REQUEST_OBJECT 用于连接服务器，以便发送数据，并用于\
    \ D — 独立从服务器回答。当响应到达时，会触发 Java Script 以及与此事件相关的函数。在 AjaxJavaScript 技术中，JavaScript\
    \ 仅用于在客户端和服务器之间传输数据，而主程序（即数据处理）是在服务器端完成的，使用 PHP 或任何不同的服务器端语言。\n\n由于 Java Script\
    \ 从客户端工作站执行，它的执行时间非常短，几乎是瞬间完成。观众可以在服务器离线运行 Java Script，这是 Ajax 的良好之处，观众必须注意。在这里，执行时间要长得多，取决于你的互联网连接速度、服务器硬件以及客户端和服务器之间传输的字节数。从服务器安全的角度来看，Java\
    \ Script 是完全安全的，因为它不会将客户端的任何用户名输入翻译给服务器。对于 Ajax，你必须特别小心，以防止未授权用户发送恶意数据。\n\n在 java\
