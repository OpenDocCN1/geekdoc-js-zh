    感知 现在和过去，接收者的感知发生了变化。通过互联网和某些领域（从积极角度看），人们今天有机会质疑广告的力量。昨天获取信息可能需要几天或几个月，而现在只需要一秒钟。现在人们更倾向于直接从研究网站、影响性小组或编辑媒体获取他们的价值观、影响和建议。但例如：如果你去纽约旅游并住一家特殊的酒店，会在酒店广告中找到吗？可能不会。


