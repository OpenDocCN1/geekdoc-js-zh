    # JavaScript 简介


    JavaScript 是一种易于解释的编程语言，基于 ECMAScript 标准构建。该语言的定义非常广泛，可以被定义为基于原型、松散类型、过程性的动态语言。


    JavaScript 主要作为客户端编程语言使用。它在 Web 浏览器中的实现为开发者提供了一种增强方式，用于在网页上实现用户界面和动态功能，尽管也有 JavaScript
    的服务端实现（SSJS）。该语言的流行仅凭客户端实现就足够了。JavaScript 也可以在网页程序之外的地方找到，例如，为 PDF 文档以及办公小组件添加交互性。


    JavaScript 的设计采用了类 C 语言的语法，尽管它接受了 Java 编程语言的名称和约定。但是，尽管名称相似，Java 和 JavaScript
    之间并没有关系，它们的语义和目标也不同。


    JavaScript 最初是由 Netscape 的 Brendan Eich 在 Mocha 名称的指导下开发的，后来被更名为 LiveScript，并变为
    JavaScript。这个名字的出现大致重合 Netscape 在 1995 年底为其网页浏览器 Netscape Navigator 2.0B3 添加支持的时间。JavaScript
    这个名字容易误导，给人一种该语言是 Java 扩展的印象，而且这也是 Netscape 为了获得声誉并创新新的 Web 编程语言的一种手段。


    明年，微软在 Internet Explorer 3.0 网页浏览器中实现了类似的客户端编程语言。微软将其客户端语言称为“JScript”以避免品牌问题。“Script”一词听起来与“JavaScript”非常相似，且经常交叉使用，但
    Script 规范并不 100% 兼容那些 ECMA 特性。


    为了避免这些不兼容性，世界维网联盟（W3C）开发了一个标准的文档对象模型（DOM 或 Document Object Model），它被包含在 Internet
    Explorer 6、Netscape Navigator、Opera 7 版、Mozilla Firefox（它是首次支持）以及之后的所有现代浏览器中。


    1997 年，有人提出了提交 JavaScript 标准的建议。欧洲计算机制造商协会 ECMA（尽管名称如此，但代表欧洲国际委员会）成立于日内瓦。1997
    年 6 月，该建议被采用为名为 AcmeScript 的 ECMA 标准。除此之外，JavaScript 转 ISO 标准。得益于互联网的标准化和广泛使用，JavaScript
    已成为全球范围内最使用的编程语言。


    Mark：JavaScript 是 Oracle 公司的注册商标。它被许可用于 Netscape Communications 以及其他实体（如 Mozilla
    基金会）的产品。


    # JavaScript 程序


    JavaScript 是今天更多网页的礼物；你现在正在浏览的这个页面中的机会包含了 JavaScript 代码。尝试这个活动：右键点击网页，然后点击“查看源代码”。你应该能够在编码后的页面代码某处找到
    JavaScript 这个词。


    虽然 HTML 标记语言允许开发者格式化内容，但 JavaScript 允许他们让页面变得动态。例如，HTML 允许你加粗文本、创建文本字段和按钮，而 JavaScript
    允许你通过创建消息来更改页面上的文本，并在文本框中确认文本以验证已填充的字段。JavaScript 通过允许用户与网页交互、点击元素以及更改这些页面，使网页更加动态。


    JavaScript 能为你做什么


    我们总结了 JavaScript 背后的投入以及应得的回报：


    JavaScript 非常易于应用。你需要做的每件事都很简单：你把代码放在 HTML 文档中，并告诉浏览器它是 JavaScript。


    Web 用户计算机上的 JavaScript 数字——无论他们在线还是离线都一样！


    JavaScript 允许你创建高度响应的界面，改善用户体验并提供动态功能，而无需服务器响应以及显示不同的页面。JavaScript 可以在用户需要时将内容加载到文档中，而无需重新加载整个页面；通常被称为
    Ajax。


    JavaScript 可以检查你的浏览器中可以做什么并据此反应——从受限的 JavaScript 开始，有时在旧版本上具有防御性。JavaScript 可以解决浏览器问题或修复浏览器漏洞。支持——例如，针对浏览器的
    CSS 设计问题修复。


    这也是该语言的封装；在不久之前，对于青睐“优秀编程语言”的程序员来说是非常严肃的。JavaScript 复兴的一部分是由于正在构建日益复杂的 Web 应用程序。如今，高交互需要
    Flash（或其他插件）或旧版本。JavaScript 可能是实现此点的最佳方法，因为它是一个 Web 标准，被所有浏览器原生支持。


    通用 JavaScript 程序 JavaScript 的用途随几年发生了变化。起初，JavaScript 与网站的交互主要限于表单，向用户提供反馈。我们使用
    `alert()` 通知用户某些事情（见图 1）。使用 `confirm()` 询问某事是否可行，使用 `prompt()` 或表单字段接收输入。


    图一：结尾使用错误进行叙述，但那是早期人们所能做的一切。没有比这更漂亮的


    我们使用的另一个东西是 `document.write()` 向文档中添加内容。我们还处理过弹出窗口和框架，耗费了大量精力并抓乱头发，试图让它们相互通信。想象一下这些技术中的大部分如何让任何开发者都翻倒倒来并缩成胎儿状，结结巴巴地说“把它们删掉”，所以让我们让这些事情保持运行——存在。这是处理
    JavaScript 更好的礼仪！


    # 编写进阶


    当浏览器能够证明并执行文档对象模型（DOM）以允许我们与网页进行更丰富的交互时，JavaScript 开始变得越来越有趣。


    DOM 是文档的对象的表示。例如，DOM 中的一个段落（使用源代码视图检查你的源码）提到名为 `P` 的元素节点包含三个子节点：


    - 包含“当浏览器开始支持并实现”的文本节点

    - 名为 `a` 的元素节点

    - 另一个内容为“,允许我们与网页进行更多丰富的交互，JavaScript 开始变得更有趣。”的文本节点。


    该子节点还有一个属性节点，以及一个作为文档对象模型（DOM）值的文本节点节点。


    你也可以使用树图可视化地提交该段落。


