    欧洲旅游，不可置信的车辆重量。


    **向上动画**


    使用向上动画为浮动元素实现精美的视觉效果。


    **快速开始：**


    我正在学习：


    `.de-push-up-animation`


    适用于您的任何元素。


    **个性化：**


    此部分可能用于编辑 `sass/base/breakpoints` 中的值。相应的存档并重新编译该项目：


    `$ npm install && sass`


    **行值：**


    此外，此部分可能用于传递给 `scss` 顺序，以获取网格断点的值：


    `$ npm install && sass release --breakpoints=''xs 0px, sm 460px 600px, md 800px,
    lg 1164px, xl 1440px, xxl 1740px''`


    在支持断点的参数中，我将取消预定义的 `sass/base/breakpoints`。它应该是一个由断点分隔的小数组值。然后所有违规项将以 `<name><width>`
    形式结束：


    `<name>` 用于链，并用于识别您的违规项，我将携带这些类。


    `<up>` 用于在名称和长度外部留出空间。


    `<width>` 用于评估为 X（正确的值为：0px, 300px, 500px 等）。


    ## 必须掌握的 20 个核心 CSS 知识


    **绝对定位 (Absolute positioning)**


    如果你想随时检查产品在我们的网站上的位置，绝对定位是实现这一点的关键。如果你将导航器看作一个大的限制框，绝对定位允许你控制项目留在该框内的精确位置。使用 `top`、`right`、`bottom`
    和 `left` 配合像素值来控制元素停留的位置。


    ```css

    position: absolute; top: 20px; right: 20px;

    ```


    上述 CSS 设置元素的位置，使其距离顶部 20px，距离导航器右边界 20px。你可以使用绝对定位来进行分离。


    *   **通符选择器 (* selector)**：这允许你从特殊选择器选择所有元素。例如，如果你使用了 `* p` 并添加了 CSS 样式，它将应用于文档中使用所有
    `<p>` 标签的元素。这使得从全局范围内定位网站部分变得更容易。


    **取消所有样式 (Cancellation all fashion)**


    这必须很少使用，因为如果你对所有元素这样做，长远来看会带来麻烦。但是，如果你为特定元素替换不同的 CSS 样式，请在样式后使用 `!important`。例如，如果你需要特定章节中的
    `H2` 标题采用特定格式（从蓝色变为红色），我会编写以下 CSS：


    ```css

    .chapter h2 { color: red !important; }

    ```


    **居中 (Centre)**


    居中非常复杂，因为这取决于我们要对什么进行居中。我们根据内容让元素在 CSS 中实现居中。


    **文本 (Text)**


    使用 `text-alignment: center;` 实现文本居中。如果你希望任何侧左对齐，使用 `left` 而不是 `center`。


    **内容 (Content)**


    对于分离（没有不同元素的情况下），可以通过添加块元素并使用 `automatic` 字段来实现居中。我会这样写 CSS：


    ```css

    #div1 {

    display: block; margin: auto;

    }

    ```


    **长度 (Length)：** 任何小于 100% 的值。


    对于长度使用“小于100%”是因为如果宽度是 100%，它将是全宽，不需要居中。最佳方案是固定宽度，例如 60% 或 550px 等。


    **垂直对齐 (Vertical alignment) - 针对文本行**


    我保证你会在 CSS 导航菜单中使用它。关键点是菜单的高度和文本行的高度应该是相同的。当我为客户编辑现有网站时，我会考虑技术封装。这里是示例：


    ```css

    .nav {

    line-height: 50px; height: 50px;

    }

    ```


    **悬停效果 (Hover effects)**


    这用于按钮、文本链接、网站的块区域和图标。如果你希望在鼠标悬过时改变某些内容的颜色，在同一 CSS 中添加 `:hover` 并更改样式。这里是示例：


    ```css

    .Entrance h2{font-size: 36px; color:#000; font-weight: 800;}

    .Entrance h2:hover { color:#f00;}

    ```


    当任何人悬停在上面时，这会将你的 `h2` 标签颜色从黑色变为红色。在使用 `:hover` 的精彩之处在于，如果字体大小或粗细没有变化，你不需要再次声明。它只会改变你指定的。


    **过渡 (Transition)**


    对于网站上的菜单或图像等悬停效果，你不需要让颜色切换太快。理想情况下，你希望平滑地变化，这就是 `transition` 属性派上用场的地方。


    ```css

    .Entrance h2:hover { color:#f00;

    transition: all 0.3 seconds;

    }

    ```


    这种变化会在 0.3 秒后到达，而不是立即发生。这种效果视觉上更舒适、更自然。


    **连接条件 (Connection condition)**


    许多设计师忽略了这些样式，但它们确实能营造一种感觉。`.hover` 伪类控制所有链接的样式。比方说我有一个网站，想在每个 `H2` 标签前添加特定的文本。重要的参数是：


    ```css

    H2:before {content: "To read: ";}

    ```

