    # The Creational Pattern


    This pattern is the basis for a number of other patterns in this article and is
    actually quite straightforward to understand. As you might guess, a creational
    pattern deals with creating objects within an application. The most common way
    of doing this in JavaScript is as follows:


    ```

    var newObject = new MyClass();

    ```


    A lot of the time, you won''t have a reason to approach this in another way. You
    just define your class and instantiate it later on when you need it. There are
    however situations where this is neither an advantage nor a desired feature.


    # The Constructor Pattern


    The phrase ''constructor'' is familiar to most developers, however if you''re
    a beginner it can be useful to review what a constructor is before we get into
    talking about a pattern dedicated to it. Constructors are used to create specific
    types of objects. This paradigm can be found in many programming languages, including
    JavaScript. Some of the native constructors you may be familiar with include Object
    and Array.


    You''re also able to define custom constructors that define properties and methods
    for your own types of objects.

    Let''s look at a constructor for a car.'
