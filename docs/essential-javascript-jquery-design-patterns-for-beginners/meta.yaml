    # # What is a Pattern?


    A pattern is a reusable solution that can be applied to commonly occurring problems
    in software design - in our particular case, in writing JavaScript applications.
    Another way of looking at patterns are as templates for how you solve problems
    - ones which can be used in quite a few different situations. To consider how
    useful a pattern may be, let us consider that if you were to write a script where
    you said ''for each item, sound an alert'', if sounding an alert was complex in
    nature, it would always result in more maintainable code doing the above over
    saying ''do this for item 1'', ''do this for item 2'', ''do the same again for
    item 3'', i.e. If the code performing the bulk of the work exists in fewer places
    it becomes significantly easier to maintain.


    You may ask why it''s important to understand patterns and be familiar with them.
    Design patterns have three main benefits.


    +   1. **Patterns are proven solutions:** They provide solid approaches to solving
    issues in software development using proven solutions that reflect the experience
    and insights the developers that helped define and improve them bring to the pattern

    2. **Patterns can be easily re-used:** A pattern usually reflects an out of the
    box solution that can be adapted to suit your own needs. This feature makes them
    quite robust.

    3. **Patterns can be expressive:** When you look at a pattern there''s generally
    a set structure and ''vocabulary'' to the solution presented that can help express
    rather large solutions quite elegantly.


    Patterns are **not** an exact solution. It''s important that we remember the role
    of a pattern is merely to provide us with a solution scheme. Patterns don''t solve
    all design problems nor do they replace good software designers, however, they
    **do** support them. Next we''ll take a look at some of the other advantages patterns
    can offer us.


    +   - **Reusing patterns assists in preventing minor issues that can cause major
    problems in the application development process.** What this means is that when
    your code relies more on proven patterns, you can afford to spend less time worrying
    about your code architecture and more time focusing on the quality of your overall
    solution. This is because patterns can encourage you to code in a more structured
    and organized fashion so the need to refactor it for cleanliness purposes in the
    future can be significantly decreased.

    - **Patterns can provide generalized solutions which are documented in a fashion
    that doesn''t require them to be tied to a specific problem.** This generalized
    approach means that regardless of the application (and in many cases the programming
    language) you are working with, design patterns can be applied to improve the
    structure of your code.'
  - '[PAGE 5]


    +   - **Certain patterns can actually decrease the overall file-size footprint
    of your code by avoiding repetition.** By encouraging developers to look more
    closely at their solutions for areas where instant reductions in repetition can
    be made, e.g. reducing the number of functions performing similar processes in
    favor of a single generalized function, the overall size of your codebase can
    be decreased.

    - **Patterns that are frequently** used can be improved over time by harnessing
    the collective experiences other developers using those patterns contribute back
    to the design pattern community. In some cases this leads to the creation of entirely
    new design patterns whilst in others it can lead to the provision of improved
    guidelines on how specific patterns can be best used. This can ensure that pattern-based
    solutions continue to become more robust than ad-hoc solutions may be.


    # # ''Pattern''-ity Testing, Proto-Patterns & The Rule Of Three


    Remember that not every algorithm, best practice or solution represents what might
    be considered a complete pattern. There may be a few key ingredients here that
    are missing and the pattern community is generally weary of something claiming
    to be one unless it has been heavily vetted. Even if something is presented to
    us which *appears* to meet the criteria for a pattern, it should not be considered
    one until it has undergone suitable periods of scrutiny and testing by others.


    Looking back upon the work by Alexander once more, he claims that a pattern should
    both be a process and a ''thing''. This definition is obtuse on purpose as he
    follows by saying that the process should create the ''thing''. This is a reason
    why patterns generally focus on addressing a visually identifiable structure i.e
    you should be able to visually depict (or draw) a picture representing the structure
    that putting the pattern into practice results in.


    In studying design patterns, you may come across the term ''proto-pattern'' quite
    frequently. What is this? Well, a pattern that has not yet been known to pass
    the ''pattern''-ity tests is usually referred to as a proto-pattern. Proto-patterns
    may result from the work of someone that has established a particular solution
    is worthy of sharing with the community, but may not have yet had the opportunity
    to have been vetted heavily due to it''s very young age.


    Alternatively, the individual(s) sharing the pattern may not have the time or
    interest of going through the ''pattern''-ity process and might release a short
    description of their proto-pattern instead. Brief descriptions of this type of
    pattern are known as patlets.'
- md: 'The work involved in fully documenting a qualified pattern can be quite daunting.
    Looking back at some of the earliest work in the field of design patterns, a pattern
    may be considered ''good'' if it does the following:


    - **Solves a particular problem** - patterns are not supposed to just capture
    principles or strategies. They need to capture solutions. This is one of the most
    essential ingredients for a good pattern.

    - **The solution to this problem cannot be obvious** - you can often find that
    problem-solving techniques attempt to derive from well-known first principles.
    The best design patterns usually provide solutions to problems indirectly - this
    is considered a necessary approach for the most challenging problems related to
    design.

    - **The concept described must have been proven** - design patterns require proof
    that they function as described and without this proof the design cannot be seriously
    considered. If a pattern is highly speculative in nature, only the brave may attempt
    to use it.

    - **It must describe a relationship** - in some cases it may appear that a pattern
    describes a type of module. Although an implementation may appear this way, the
    official description of the pattern must describe much deeper system structures
    and mechanisms that explain its relationship to code.


    You wouldn''t be blamed for thinking that a proto-pattern that doesn''t meet the
    guidelines for a complete pattern isn''t worth investigating, but this is far
    from the truth. Many proto-patterns are actually quite good. I''m not saying that
    all proto-patterns are worth looking at, but there are quite a few useful ones
    in the wild that could assist you with future projects. Use best judgment with
    the above list in mind and you''ll be fine in your selection process.


    One of the additional requirements for a pattern to be valid is that they display
    some recurring phenomenon. This is often something that can be qualified in at
    least three key areas, referred to as the *rule of three*. To show recurrence
    using this rule, one must demonstrate:


    1. **Fitness of purpose** - how is the pattern considered successful?

    2. **Usefulness** - why is the pattern considered successful?

    3. **Applicability** - is the design worthy of being a pattern because it has
    wider applicability? If so, this needs to be explained. When reviewing or defining
    a pattern, it is important to keep the above in mind.


    ## The Structure Of A Design Pattern


    When studying design patterns, you may wonder what teams that create them have
    to put in their design pattern descriptions. Every pattern has to initially be
    formulated in a form of a **rule** that establishes a relationship between a **context**,
    a system of **forces** that arises in that context and a **configuration** that
    allows these forces to resolve themselves in context.


    I find that a lot of the information available out there about the structure of
    a good pattern can be condensed down to something more easily digestible. With
    this in mind, lets now take a look at a summary of the component elements for
    a design pattern below.


    **A design pattern must have a:**


    - **Pattern Name** and a **description**

    - **Context Outline** – the contexts in which the pattern is effective in responding
    to the users needs.

    - **Problem Statement** – a statement of the problem being addressed so we can
    understand the intent of the pattern.

    - **Solution** – a description of how the user''s problem is being solved in an
    understandable list of steps and perceptions.

    - **Design** – a description of the pattern''s design and in particular, the user''s
    behavior in interacting with it

    - **Implementation** – a guide to how the pattern would be implemented

    - **Illustrations** – a visual representation of classes in the pattern (eg. a
    diagram)

    - **Examples** – an implementation of the pattern in a minimal form

    - **Co-requisites** – what other patterns may be needed to support use of the
    pattern being described?

    - **Relations** – what patterns does this pattern resemble? does it closely mimic
    any others?

    - **Known usage** – is the pattern being used in the ''wild''? If so, where and
    how?

    - **Discussions** – the team or author''s thoughts on the exciting benefits of
    the pattern


    Design patterns are quite a powerful approach to getting all of the developers
    in an organization or team on the same page when creating or maintaining solutions.
    If you or your company ever consider working on your own pattern, remember that
    although they may have a heavy initial cost in the planning and write-up phases,
    the value returned from that investment can be quite worth it. Always research
    thoroughly before working on new patterns however, as you may find it more beneficial
    to use or build on top of existing proven patterns than starting afresh.


    ## Writing Design Patterns


    Although this book is aimed at those new to design patterns, a fundamental understanding
    of how a design pattern is written can offer you a number of useful advantages.
    For starters, you can gain a deeper appreciation for the reason behind a pattern
    being needed but can also learn how to tell if a pattern (or proto-pattern) is
    up to scratch when reviewing it for your own needs.


    Writing good patterns is a challenging task. Patterns not only need to provide
    a substantial quantity of reference material for end-users (such as the items
    found in the *structure* section above), but they also need to be able to almost
    tell a ''story'' that describes the experience they are trying to convey. If you''ve
    already read the previous section on ''what'' a pattern is, you may think that
    this in itself should help you identify patterns when you see them in the wild.
    This is actually quite the opposite - you can''t always tell if a piece of code
    you''re inspecting follows a pattern.


    When looking at a body of code that you think may be using a pattern, you might
    write down some of the aspects of the code that you believe falls under a particular
    existing pattern, but it may not be one at all. In many cases of pattern-analysis
    you''ll find that you''re just looking at code that follows good principles and
    design practices that could happen to overlap with the rules for a pattern by
    accident. Remember - solutions in which neither interactions nor defined rules
    appear are not patterns.


    If you''re interested in venturing down the path of writing your own design patterns
    I recommend learning from others who have already been through the process and
    done it well. Spend time absorbing the information from a number of different
    design pattern descriptions and books and take in what''s meaningful to you -
    this will help you accomplish the goals you''ve got of designing the pattern you
    want to achieve. You''ll probably also want to examine the structure and semantics
    of existing patterns - this can be begun by examining the interactions and context
    of the patterns you are interested in so you can identify the principles that
    assist in organizing those patterns together in useful configurations.


    Once you''ve exposed yourself to a wealth of information on pattern literature,
    you may wish to begin your pattern using an *existing* format and see if you can
    brainstorm new ideas for improving it or integrating your ideas in there. An example
    of someone that did this quite recently is JavaScript developer Christian Heilmann,
    who took an existing pattern called the *module* pattern and made some fundamentally
    useful changes to it to create the *revealing module* pattern (this is one of
    the patterns covered later in this book).


    If you would like to try your hand at writing a design pattern (even if just for
    the learning experience of going through the process), the tips I have for doing
    so would be as follows:


    - **Bear in mind practicability**: Ensure that your pattern describes proven solutions
    to recurring problems rather than just speculative solutions which haven''t been
    qualified.

    - **Ensure that you draw upon best practices**: The design decisions you make
    should be based on principles you derive from an understanding of best practices.

    - **Your design patterns should be transparent to the user**: Design patterns
    should be entirely transparent to any type of user-experience. They are primarily
    there to serve the developers using them and should not force changes to behaviour
    in the user-experience that would not be incurred without the use of a pattern.

    - **Remember that originality is *not* key in pattern design**: When writing a
    pattern, you do not need to be the original discoverer of the solutions being
    documented nor do you have to worry about your design overlapping with minor pieces
    of other patterns. If your design is strong enough to have broad useful applicability,
    it has a chance of being recognized as a proper pattern.

    - **Know the differences between patterns and design**: A design pattern generally
    draws from proven best practice and serves as a model for a designer to create
    a solution. *The role of the pattern is to give designers guidance to make the
    best design choices so they can cater to the needs of their users.*

    - **Your pattern needs to have a strong set of examples**: A good pattern description
    needs to be followed by an equally strong set of examples demonstrating the successful
    application of your pattern. To show broad usage, examples that exhibit good design
    principles are ideal.


    Pattern writing is a careful balance between creating a design that is general,
    specific and above all, useful. Try to ensure that if writing a pattern you cover
    the widest possible areas of application and you should be fine. I hope that this
    brief introduction to writing patterns has given you some insights that will assist
    your learning process for the next sections of this book.


    ## Anti-Patterns


    If we consider that a pattern represents a best practice, an anti-pattern represents
    a lesson that has been learned. The term anti-patterns was coined in 1995 by Andrew
    Koenig in the November C++ Report that year. It was inspired by the Gang of Four''s
    book *Design Patterns*, that developed the concept of design patterns in the software
    field. In Koenig''s report, there are two notions of anti-patterns that are presented.
    Anti-Patterns:


    - Describe a *bad* solution to a particular problem which resulted in a bad situation
    occurring

    - Describe *how* to get out of said situation and how to go from there to a good
    solution'
  mdcn: '

    完整记录一个合格模式所涉及的工作可能相当艰巨。回顾设计模式领域最早的一些工作，一个模式如果做到以下几点，就可能被认为是“好的”：


    -   **解决特定问题** - 模式不应仅仅捕捉原则或策略，它们需要捕捉解决方案。这是好模式最基本的要求之一。

    -   **该问题的解决方案不能是显而易见的** - 你通常会发现，问题解决技巧试图从众所周知的基本原理推导出来。最好的设计模式通常间接提供问题的解决方案——这是处理最具挑战性的设计问题时的一种必要方法。

    -   **描述的概念必须经过验证** - 设计模式需要证明其能如所述那样发挥作用，如果没有这个证明，该设计就不能被认真考虑。如果一个模式本质上是高度推测性的，那么可能只有勇敢的人才会尝试使用它。

    -   **必须描述一种关系** - 在某些情况下，一个模式可能看似描述了一种模块类型。尽管实现可能看起来如此，但模式的官方描述必须描述更深层的系统结构和机制，以解释其与代码的关系。


    如果你认为一个不符合完整模式准则的原始模式不值得研究，这无可厚非，但事实远非如此。许多原始模式实际上相当不错。我并不是说所有原始模式都值得一看，但确实存在相当多有用的模式，它们可能在未来项目中对你有所帮助。在选择过程中，请参考上述列表并运用最佳判断力，你将不会出错。


    一个模式要生效，另一个额外要求是它必须展示一些反复出现的现象。这通常可以通过至少三个关键领域来界定，称为*三的法则*。要使用此法则展示重现性，必须证明：


    1.  **目的适用性** - 该模式如何被视为成功？

    2.  **有用性** - 该模式为何被视为成功？

    3.  **可应用性** - 该设计是否因其更广泛的可适用性而值得成为一个模式？如果是，这需要解释。在审查或定义模式时，牢记上述几点很重要。


    ## 设计模式的结构


    在研究设计模式时，你可能想知道创建模式的团队必须在其设计模式描述中包含什么内容。每个模式最初都必须以**规则**的形式制定，该规则在**上下文**、该上下文中出现的**力量**系统以及允许这些力量在上下文中自行解决的**配置**之间建立关系。


    我发现，关于好模式结构的大量现有信息可以浓缩成更易于消化的内容。考虑到这一点，现在让我们看看下面设计模式的组件要素摘要。


    **一个设计模式必须包含：**


    -   **模式名称**和**描述**

    -   **上下文概述** – 模式在响应用户需求时有效的上下文。

    -   **问题陈述** – 陈述所解决的问题，以便我们理解模式的意图。

    -   **解决方案** – 描述如何通过一系列易于理解的步骤和观念来解决用户的问题。

    -   **设计** – 描述模式的设计，特别是用户与其交互的行为。

    -   **实现** – 模式如何实现的指南。

    -   **插图** – 模式中类的视觉表示（例如图表）。

    -   **示例** – 模式的最小形式实现。

    -   **共同要求** – 支持所描述模式的使用可能需要哪些其他模式？

    -   **关系** – 这个模式类似于哪些模式？它是否与任何其他模式非常相似？

    -   **已知用法** – 该模式是否在“野外”使用？如果是，在哪里以及如何使用？

    -   **讨论** – 团队或作者对模式令人兴奋的好处的看法。


    设计模式是一种相当强大的方法，可以在组织或团队创建或维护解决方案时，让所有开发人员保持一致。如果你或你的公司曾考虑开发自己的模式，请记住，尽管在规划和撰写阶段可能有很高的初始成本，但这项投资的回报可能是相当值得的。然而，在开发新模式之前，务必彻底研究，因为你可能会发现，使用或在现有的、经过验证的模式基础上构建，比从头开始更有益。


    ## 撰写设计模式


    尽管本书面向设计模式的新手，但理解设计模式的撰写方式可以为你提供许多有用的优势。首先，你可以更深入地理解模式存在的原因，同时也能在审查模式（或原始模式）是否符合自身需求时学会如何判断。


    撰写好的模式是一项具有挑战性的任务。模式不仅需要为最终用户提供大量的参考资料（例如上面*结构*部分中找到的项目），还需要能够近乎“讲述”一个故事，描述它们试图传达的经验。如果你已经阅读了前面关于模式“是什么”的部分，你可能会认为这本身应该能帮助你识别野外的模式。事实恰恰相反——你并不总是能判断你检查的代码是否遵循模式。


    在查看你认为可能使用了某个模式的代码主体时，你可能会写下你认为属于某个特定现有模式的代码方面，但它可能根本不是模式。在许多模式分析的情况下，你会发现你只是在查看遵循良好原则和设计实践的代码，而这些原则和实践可能只是偶然与模式的规则重叠。请记住——没有出现交互或定义规则的解决方案不是模式。


    如果你有兴趣尝试撰写自己的设计模式，我建议你向那些已经经历过并做得很好的人学习。花时间吸收来自许多不同设计模式描述和书籍的信息，并吸收对你有意义的内容——这将帮助你实现设计想要达到的模式的目标。你可能还希望研究现有模式的结构和语义——这可以通过检查你感兴趣的模式的交互和上下文来开始，以便你可以识别有助于将这些模式组织成有用配置的原则。


    一旦你接触了大量关于模式文献的信息，你可能希望使用*现有的*格式开始你的模式，并看看你是否能为改进它或整合你的想法进行头脑风暴。最近这样做的一个例子是 JavaScript
    开发者 Christian Heilmann，他采用了一个名为*模块*模式的现有模式，并对其进行了根本性的有用更改，创建了*揭示模块*模式（这是本书后面涵盖的模式之一）。


    如果你想尝试撰写设计模式（即使只是为了体验整个过程的学习经验），我有以下建议：


    -   **牢记实用性**：确保你的模式描述的是针对反复出现问题的、经过验证的解决方案，而不仅仅是未经验证的推测性解决方案。

    -   **确保借鉴最佳实践**：你的设计决策应基于你从理解最佳实践中得出的原则。

    -   **你的设计模式应对用户透明**：设计模式应完全对任何类型的用户体验透明。它们主要是为了服务于使用它们的开发人员，不应强加使用模式时不会发生的用户体验行为变化。

    -   **请记住，原创性在模式设计中*并非*关键**：撰写模式时，你不需要是所记录解决方案的原始发现者，也不必担心你的设计与其他模式的小部分重叠。如果你的设计足够强大，具有广泛的有用适用性，它就有机会被认可为一个合适的模式。

    -   **了解模式与设计之间的区别**：设计模式通常借鉴经过验证的最佳实践，并作为设计师创建解决方案的模型。*模式的作用是指导设计师做出最佳设计选择，以便他们能够满足用户的需求。*

    -   **你的模式需要有一组强大的示例**：一个好的模式描述需要伴随同样强大的示例，以展示你的模式成功应用。为了展示广泛的用途，体现良好设计原则的示例是理想的。


    模式撰写是在创建具有普适性、具体性且最重要的是有用的模式之间取得精心平衡。尝试确保在撰写模式时，你涵盖尽可能广泛的应用领域，这样你就会顺利。我希望这个关于撰写模式的简要介绍能给你一些见解，这将帮助你在本书后续章节的学习过程中。


    ## 反模式


    如果我们认为模式代表最佳实践，那么反模式则代表一个吸取的教训。反模式一词由 Andrew Koenig 于 1995 年在当年 11 月的《C++ 报告》中首创。它受到四人组的《设计模式》一书的启发，该书发展了软件领域的设计模式概念。在
    Koenig 的报告中，提出了两种反模式的概念。反模式：


    -   描述了对特定问题的*糟糕*解决方案，导致了糟糕情况的发生。

    -   描述*如何*摆脱上述情况以及如何从那里转向好的解决方案。

    '
