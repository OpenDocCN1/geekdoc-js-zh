  md: '# # The DRY Pattern


    **Disclaimer:** DRY is essentially a way of thinking and many patterns aim to
    achieve a level of DRY-ness with their design. In this section we''ll be covering
    what it means for code to be DRY but also covering the DRY design pattern based
    on these same concepts.


    A challenge that developers writing large applications frequently have is writing
    similar code multiple times. Sometimes this occurs because your script or application
    may have multiple similar ways of performing something.


    Repetitive code writing generally reduces productivity and leaves you open to
    having to re-write code you''ve already written similar times before, thus leaving
    you with less time to add in new functionality.


    DRY (don''t repeat yourself) was created to simplify this - it''s based on the
    idea that each part of your code should ideally only have one representation of
    each piece of knowledge in it that applies to your system.


    The key concept to take away here is that if you have code that performs a specific
    task, you shouldn''t write that code multiple times through your applications
    or scripts.


    When DRY is applied successfully, the modification of any element in the system
    doesn''t change other logically-unrelated elements. Elements in your code that
    are logically related change uniformly and are thus kept in sync.


    As other patterns covered display aspects of DRY-ness with JavaScript, let''s
    take a look at how to write DRY code using jQuery. Note that where jQuery is used,
    you can easily substitute selections using vanilla JavaScript because jQuery is
    just JavaScript at an abstracted level.


    # ## Non-DRY


    ```

    /*Let''s store some default values in an array*/

    var defaultSettings = {};

    defaultSettings[''carModel'']     = ''Mercedes'';

    defaultSettings[''carYear'']      = 2010;

    defaultSettings[''carMiles'']     = 5000;

    defaultSettings[''carTint'']      = ''Metallic Blue'';

    ```'
