- md: "## Introduction\n\nAt the beginning of this book I will be focusing on a discussion\
    \ about the importance and history of design patterns in any programming language.\
    \ If you're already sold or are familiar with this history, feel free to the chapter\
    \ 'What is a Pattern?' to continue reading.\n\nOne of the most important aspects\
    \ of writing maintainable code is being able to notice the recurring themes in\
    \ that code and optimize them. This is an area where knowledge of design patterns\
    \ can prove invaluable.\n\nDesign patterns can be traced back to the early work\
    \ of a civil engineer named Christopher Alexander. He would often write publications\
    \ about his experience in solving design issues and how they related to buildings\
    \ and towns. One day, it occurred to Alexander that when used time and time again,\
    \ certain design constructs lead to a desired optimal effect.\n\nIn collaboration\
    \ with Sarah Ishikawra and Murray Silverstein, Alexander produced a pattern language\
    \ that would help empower anyone wishing to design and build at any scale. This\
    \ was published back in 1977 in a paper titled 'A Pattern Language'.\n\nSome 30\
    \ years ago, software engineers began to incorporate the principles Alexander\
    \ had written about into the first documentation about design patterns, which\
    \ was to be a guide for novice developers looking to improve their coding skills.\
    \ It's important to note that the concepts behind design patterns have actually\
    \ been around in the programming industry more than likely since it's inception,\
    \ albeit in a less formalized form.\n\nOne of the first and arguably most iconic\
    \ formal works published on design patterns in software engineering was a book\
    \ in 1995 called 'Design Patterns: Elements Of Reusable Object-Oriented Software'.\
    \ This was written by Erich Gamma, Richard Helm, Ralph Johnson and John Vlissides\
    \ - a group that became known as the Gang of Four (or GoF for short).\n\nThe GoF's\
    \ publication is considered quite instrumental to pushing the concept of design\
    \ patterns further in our field as it describes a number of development techniques\
    \ and pitfalls as well as providing twenty-three core Object-Oriented design patterns\
    \ frequently used around the world today. We will be covering these patterns in\
    \ more detail in the section 'Categories of Design Patterns'.\n\nIn this book,\
    \ we will take a look at a number of popular JavaScript design patterns and explore\
    \ why certain patterns may be more suitable for your projects than others. Remember\
    \ that patterns can be applied not just to vanilla JavaScript, but also to abstracted\
    \ libraries such as jQuery or Dojo as well. Before we begin, let's look at the\
    \ exact definition of a 'pattern' in software design.\n\n## Contents\n\n- What\
    \ is a Pattern?\n- 'Pattern'-ity Testing, Proto-Patterns & The Rule Of Three\n\
    - The Structure Of A Design Pattern\n- Writing Design Patterns\n- Anti-Patterns\n\
    - Categories Of Design Pattern\n- Design Patterns in jQuery\n  - Lazy Initialization\n\
    \  - Composite Pattern\n  - Wrapper Pattern\n  - Facade Pattern\n  - Observer\
    \ Pattern\n  - Iterator Pattern\n  - Strategy Pattern\n  - Proxy Pattern\n  -\
    \ Builder Pattern\n  - Prototype Pattern\n  - Flyweight Pattern\n- Design Patterns\
    \ in JavaScript\n  - Creational Pattern\n  - Constructor Pattern\n  - Singleton\
    \ Pattern\n  - Module Pattern\n  - Revealing Module Pattern\n  - Prototype Pattern\n\
    \  - DRY Pattern\n  - Facade Pattern\n  - Factory Pattern\n  - Decorator Pattern\n\
    - Conclusions\n- References\n\n## What is a Pattern?\n\nA pattern is a reusable\
    \ solution that can be applied to commonly occurring problems in software design\
    \ - in our particular case, in writing JavaScript applications. Another way of\
    \ looking at patterns are as templates for how you solve problems - ones which\
    \ can be used in quite a few different situations. To consider how useful a pattern\
    \ may be, let us consider that if you were to write a script where you said 'for\
    \ each item, sound an alert', if sounding an alert was complex in nature, it would\
    \ always result in more maintainable code doing the above over saying 'do this\
    \ for item 1', 'do this for item 2', 'do the same again for item 3', i.e. If the\
    \ code performing the bulk of the work exists in fewer places it becomes significantly\
    \ easier to maintain.\n\nYou may ask why it's important to understand patterns\
    \ and be familiar with them. Design patterns have three main benefits.\n\n1. **Patterns\
    \ are proven solutions:** They provide solid approaches to solving issues in software\
    \ development using proven solutions that reflect the experience and insights\
    \ the developers that helped define and improve them bring to the pattern\n2.\
    \ **Patterns can be easily re-used:** A pattern usually reflects an out of the\
    \ box solution that can be adapted to suit your own needs. This feature makes\
    \ them quite robust.\n3. **Patterns can be expressive:** When you look at a pattern\
    \ there's generally a set structure and 'vocabulary' to the solution presented\
    \ that can help express rather large solutions quite elegantly.\n\nPatterns are\
    \ **not** an exact solution. It's important that we remember the role of a pattern\
    \ is merely to provide us with a solution scheme. Patterns don't solve all design\
    \ problems nor do they replace good software designers, however, they **do** support\
    \ them. Next we'll take a look at some of the other advantages patterns can offer\
    \ us.\n\n- **Reusing patterns assists in preventing minor issues that can cause\
    \ major problems in the application development process.** What this means is\
    \ that when your code relies more on proven patterns, you can afford to spend\
    \ less time worrying about your code architecture and more time focusing on the\
    \ quality of your overall solution. This is because patterns can encourage you\
    \ to code in a more structured and organized fashion so the need to refactor it\
    \ for cleanliness purposes in the future can be significantly decreased.\n- **Patterns\
    \ can provide generalized solutions which are documented in a fashion that doesn't\
    \ require them to be tied to a specific problem.** This generalized approach means\
    \ that regardless of the application (and in many cases the programming language)\
    \ you are working with, design patterns can be applied to improve the structure\
    \ of your code.\n- **Certain patterns can actually decrease the overall file-size\
    \ footprint of your code by avoiding repetition.** By encouraging developers to\
    \ look more closely at their solutions for areas where instant reductions in repetition\
    \ can be made, e.g. reducing the number of functions performing similar processes\
    \ in favor of a single generalized function, the overall size of your codebase\
    \ can be decreased.\n- **Patterns that are frequently** used can be improved over\
    \ time by harnessing the collective experiences other developers using those patterns\
    \ contribute back to the design pattern community. In some cases this leads to\
    \ the creation of entirely new design patterns whilst in others it can lead to\
    \ the provision of improved guidelines on how specific patterns can be best used.\
    \ This can ensure that pattern-based solutions continue to become more robust\
    \ than ad-hoc solutions may be.\n\n## 'Pattern'-ity Testing, Proto-Patterns &\
    \ The Rule Of Three\n\nRemember that not every algorithm, best practice or solution\
    \ represents what might be considered a complete pattern. There may be a few key\
    \ ingredients here that are missing and the pattern community is generally weary\
    \ of something claiming to be one unless it has been heavily vetted. Even if something\
    \ is presented to us which *appears* to meet the criteria for a pattern, it should\
    \ not be considered one until it has undergone suitable periods of scrutiny and\
    \ testing by others.\n\nLooking back upon the work by Alexander once more, he\
    \ claims that a pattern should both be a process and a 'thing'. This definition\
    \ is obtuse on purpose as he follows by saying that the process should create\
    \ the 'thing'. This is a reason why patterns generally focus on addressing a visually\
    \ identifiable structure i.e you should be able to visually depict (or draw) a\
    \ picture representing the structure that putting the pattern into practice results\
    \ in.\n\nIn studying design patterns, you may come across the term 'proto-pattern'\
    \ quite frequently. What is this? Well, a pattern that has not yet been known\
    \ to pass the 'pattern'-ity tests is usually referred to as a proto-pattern. Proto-patterns\
    \ may result from the work of someone that has established a particular solution\
    \ is worthy of sharing with the community, but may not have yet had the opportunity\
    \ to have been vetted heavily due to it's very young age.\n\nAlternatively, the\
    \ individual(s) sharing the pattern may not have the time or interest of going\
    \ through the 'pattern'-ity process and might release a short description of their\
    \ proto-pattern instead. Brief descriptions of this type of pattern are known\
    \ as patlets."
  mdcn: "\n## 简介\n\n在本书开篇，我将重点讨论设计模式在任何编程语言中的重要性及其历史。如果你对此已有了解或熟悉这段历史，可以自由跳至“什么是模式？”章节继续阅读。\n\
    \n编写可维护代码最重要的方面之一，是能够识别代码中反复出现的主题并进行优化。在这个领域，掌握设计模式的知识可以证明是极具价值的。\n\n设计模式可以追溯到一位名叫克里斯托弗·亚历山大的土木工程师的早期工作。他经常发表关于自己解决设计问题的经验以及这些经验如何与建筑和城镇相关的出版物。有一天，亚历山大突然意识到，某些设计构造在被反复使用时，能够带来理想的最优效果。\n\
    \n亚历山大与莎拉·石川和默里·西尔弗斯坦合作，创作了一种模式语言，旨在帮助任何希望在任何规模上进行设计和构建的人。这于1977年发表在一篇题为《模式语言》的论文中。\n\
    \n大约30年前，软件工程师开始将亚历山大所写的原则融入第一批关于设计模式的文献中，这旨在为希望提高编码技能的初级开发者提供指南。需要注意的是，设计模式背后的概念实际上可能自编程行业诞生之初就已存在，尽管形式上不那么正式。\n\
    \n在软件工程领域，最早且最具标志性的关于设计模式的正式著作之一，是1995年出版的《设计模式：可复用面向对象软件的基础》。该书由埃里希·伽玛、理查德·赫姆、拉尔夫·约翰逊和约翰·弗利西德斯合著——这个团队后来被称为“四人帮”（简称GoF）。\n\
    \n四人帮的出版物被认为对推动设计模式在我们领域的发展相当重要，因为它描述了大量开发技巧和陷阱，并提供了二十三种当今世界各地常用的核心面向对象设计模式。我们将在“设计模式的类别”部分更详细地介绍这些模式。\n\
    \n在本书中，我们将探讨一些流行的JavaScript设计模式，并探索为什么某些模式可能比其他模式更适合你的项目。请记住，模式不仅适用于原生JavaScript，也适用于jQuery或Dojo等抽象库。在我们开始之前，让我们先看看软件设计中“模式”的准确定义。\n\
    \n## 目录\n\n- 什么是模式？\n- “模式”性测试、原型模式与三法则\n- 设计模式的结构\n- 编写设计模式\n- 反模式\n- 设计模式的类别\n\
    - jQuery中的设计模式\n  - 懒初始化\n  - 组合模式\n  - 包装器模式\n  - 外观模式\n  - 观察者模式\n  - 迭代器模式\n\
    \  - 策略模式\n  - 代理模式\n  - 建造者模式\n  - 原型模式\n  - 享元模式\n- JavaScript中的设计模式\n  - 创建型模式\n\
    \  - 构造函数模式\n  - 单例模式\n  - 模块模式\n  - 揭示模块模式\n  - 原型模式\n  - DRY模式\n  - 外观模式\n \
    \ - 工厂模式\n  - 装饰器模式\n- 结论\n- 参考资料\n\n## 什么是模式？\n\n模式是一种可复用的解决方案，可应用于软件设计中反复出现的问题——在我们特定的情况下，是指编写JavaScript应用程序。看待模式的另一种方式是将其视为你解决问题的模板——这些模板可用于多种不同情境。为了思考一个模式可能有多大用处，让我们设想一下，如果你编写一个脚本，其中写着“对每个项目发出警报”，如果发出警报本身很复杂，那么这样做总比说“为项目1执行此操作”、“为项目2执行此操作”、“对项目3再做一次同样的操作”更能得到可维护的代码，即，如果执行大部分工作的代码存在于更少的地方，维护起来就会显著容易得多。\n\
    \n你可能会问，为什么理解模式并熟悉它们很重要。设计模式主要有三个好处。\n\n1.  **模式是经过验证的解决方案：** 它们为解决软件开发中的问题提供了可靠的方法，这些方案反映了帮助定义和改进它们的开发者的经验和见解。\n\
    2.  **模式可以轻松复用：** 模式通常反映了一个开箱即用的解决方案，可以根据自身需求进行调整。这一特性使其相当稳健。\n3.  **模式具有表现力：**\
    \ 当你观察一个模式时，其呈现的解决方案通常具有一套固定的结构和“词汇”，可以帮助相当优雅地表达非常庞大的解决方案。\n\n模式**并非**精确的解决方案。重要的是要记住，模式的作用仅仅是为我们提供一个解决方案框架。模式并不能解决所有设计问题，也不能取代优秀的软件设计师，然而，它们**确实**能支持设计师。接下来，我们将看看模式能为我们提供的一些其他优势。\n\
    \n-   **复用模式有助于防止可能导致应用程序开发过程中出现重大问题的微小问题。** 这意味着，当你的代码更多地依赖经过验证的模式时，你可以花更少的时间担心代码架构，而花更多的时间专注于整体解决方案的质量。这是因为模式可以鼓励你以更结构化和有组织的方式编码，从而大大减少将来为整洁目的而重构它的需要。\n\
    -   **模式可以提供通用的解决方案，其记录方式使它们不必与特定问题绑定。** 这种通用方法意味着，无论你使用何种应用程序（在许多情况下，甚至是编程语言），设计模式都可以应用于改进代码结构。\n\
    -   **某些模式实际上可以通过避免重复来减少代码的整体文件大小占用。** 通过鼓励开发者更仔细地审视他们的解决方案，寻找可以立即减少重复的领域，例如，减少执行类似过程的函数数量，转而使用单个通用函数，可以减小代码库的整体规模。\n\
    -   **经常使用的**模式可以随着时间的推移，通过利用其他使用这些模式的开发者回馈给设计模式社区的集体经验而得到改进。在某些情况下，这导致全新设计模式的创建，而在其他情况下，它可以导致提供关于如何最好地使用特定模式的改进指南。这可以确保基于模式的解决方案比临时解决方案更健壮。\n\
    \n## “模式”性测试、原型模式与三法则\n\n请记住，并非每个算法、最佳实践或解决方案都代表一个完整的模式。这里可能缺少一些关键要素，而模式社区通常对声称是模式的东西持谨慎态度，除非它经过了严格的审查。即使某些东西*看起来*符合模式的标准，在它经过其他人适当的审查和测试之前，也不应被视为模式。\n\
    \n再次回顾亚历山大的工作，他声称一个模式应该既是一个过程又是一个“事物”。这个定义故意有些晦涩，因为他接着说这个过程应该创造出那个“事物”。这就是为什么模式通常专注于解决一个视觉上可识别的结构的原因，即你应该能够视觉化地描绘（或绘制）一幅代表将模式付诸实践所产生的结构的图画。\n\
    \n在学习设计模式时，你可能会经常遇到“原型模式”这个术语。这是什么？嗯，一个尚未通过“模式”性测试的模式通常被称为原型模式。原型模式可能源于某人的工作，他们确定某个特定的解决方案值得与社区分享，但由于其非常年轻，可能还没有机会经过严格的审查。\n\
    \n或者，分享模式的个人可能没有时间或兴趣去经历“模式”性过程，而是可能发布他们原型模式的简要描述。这种模式的简要描述被称为模式片段。\n"
