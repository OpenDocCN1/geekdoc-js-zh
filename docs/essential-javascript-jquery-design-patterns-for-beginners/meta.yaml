    \ Pattern\n\n## The Creational Pattern\n\nThis pattern is the basis for a number\
    \ of other patterns in this article and is actually quite straightforward to understand.\
    \ As you might guess, a creational pattern deals with creating objects within\
    \ an application. The most common way of doing this in JavaScript is as follows:\n\
    \n```javascript\nvar newObject = new MyClass();\n```\n\nA lot of the time, you\
    \ won't have a reason to approach this in another way. You just define your class\
    \ and instantiate it later on when you need it. There are however situations where\
    \ this is neither an advantage nor a desired feature.\n\n## The Constructor Pattern\n\
    \nThe phrase 'constructor' is familiar to most developers, however if you're a\
    \ beginner it can be useful to review what a constructor is before we get into\
    \ talking about a pattern dedicated to it. Constructors are used to create specific\
    \ types of objects. This paradigm can be found in many programming languages,\
    \ including JavaScript. Some of the native constructors you may be familiar with\
    \ include Object and Array.\n\nYou're also able to define custom constructors\
    \ that define properties and methods for your own types of objects.\nLet's look\
    \ at a constructor for a car.\n\n```javascript\nfunction Car(model, year, miles){\n\
    \    this.model = model;\n    this.year   = year;\n    this.miles  = miles;\n\
    \    this.whatCar = function(){\n        console.log(this.model);\n    };\n}\n\
    ```\n\n```javascript\nvar civic = new Car(\"Honda Civic\", 2009, 20000);\nvar\
    \ mondeo = new Car(\"Ford Mondeo\", 2010, 5000);\n```\n\nSide-note: [Douglas Crockford](https://www.crockford.com/)\
    \ recommends capitalizing your constructor functions so that it is easier to distinguish\
    \ between them and normal functions.\n\n## The Singleton Pattern\n\nAt its core,\
    \ the singleton pattern can be implemented by creating a class with a method that\
    \ creates a new instance of the class if one doesn't exist.\n\nIn the event of\
    \ an instance already existing, it simply returns a reference to that object.\
    \ The singleton pattern is thus known because traditionally, it restricts instantiation\
    \ of a class to a single object.\n\nThe singleton doesn't provide a way for code\
    \ that doesn't know about a previous reference to the singleton to easily retrieve\
    \ it - it is not the object or class that's returned by a singleton, it's a structure.\n\
    \nThink of how closured variables aren't actually closures - the function scope\
    \ that provides the closure is the closure.\n\nSo, where is the singleton pattern\
    \ useful? Well, it's quite useful when exactly one object is needed to coordinate\
    \ patterns across the system. Here's an example of the singleton pattern being\
    \ used:\n\n```javascript\nvar SingletonTester = (function(){\n    //args: an object\
    \ containing arguments for the singleton\n    function Singleton(args) {\n\n \
    \       //set args variable to args passed or empty object if none provided.\n\
    \        var args = args || {};\n        //set the name parameter\n        this.name\
    \ = 'SingletonTester';\n        //set the value of pointX\n        this.pointX\
    \ = args.pointX || 6; //get parameter from arguments or set default\n        //set\
    \ the value of pointY\n        this.pointY = args.pointY || 10;\n\n    }\n\n \
    \   //this is our instance holder\n    var instance;\n\n    //this is an emulation\
    \ of static variables and methods\n    var _static = {\n        name: 'SingletonTester',\n\
    \        //This is a method for getting an instance\n        //It returns a singleton\
    \ instance of a singleton object\n        getInstance: function (args){\n    \
    \        if (instance === undefined) {\n                instance = new Singleton(args);\n\
    \            }\n            return instance;\n        }\n    };\n    return _static;\n\
    })();\n\nvar singletonTest = SingletonTester.getInstance({pointX: 5});\nconsole.log(singletonTest.pointX);\
    \ // outputs 5\n```\n\n## The Module Pattern\n\nLet's now look at the popular\
    \ *module* pattern. The module pattern was defined as a way to provide both private\
    \ and public encapsulation for the idea of JavaScript 'classes'. They work under\
    \ the premise of a 'class' actually being defined as a function (which we'll refer\
    \ to as a class for simplicity's sake).\n\nThe parameters that you decide to use\
    \ for this class are actually the parameters for the constructor. Both the local\
    \ variables and functions defined inside your class become private members. The\
    \ return method for your class (i.e. still a function) returns an object that\
    \ contains your public methods and variables.\n\nA piece of trivia is that the\
    \ module pattern was originally formally defined by Douglas Crockford (famous\
    \ for his book 'JavaScript: The Good Parts', and more), although it is likely\
    \ that variations of this pattern were used long before this. Another piece of\
    \ trivia is that if you've ever played with Yahoo's YUI library, some of its features\
    \ may appear quite familiar and the reason for this is that the module pattern\
    \ was a strong influence for YUI when creating their components.\n\nSo, you've\
    \ seen why the singleton pattern can be useful, but why is the module pattern\
    \ a good choice?\n\nFor starters, it's a lot cleaner for developers coming from\
    \ an object-oriented background than the idea of true encapsulation, at least\
    \ from a JavaScript perspective. Secondly, it supports private data - so, in the\
    \ module pattern, public parts of your code are able to touch the private parts,\
    \ however the outside world is unable to touch the class's private parts (no laughing!\
    \ Oh, and thanks to David Engfer for the joke).\n\nThe disadvantages of the module\
    \ pattern is that as you access both public and private members differently, when\
    \ you wish to change visibility, you actually have to make changes to each place\
    \ the member was used.\n\nYou also can't access private members in methods that\
    \ are added to the object at a later point. That said, in many cases the module\
    \ pattern is still quite useful and when used correctly, certainly has the potential\
    \ to improve the structure of your application.\n\n```javascript\nvar someModule\
    \ = (function(){\n\n    //private attributes\n    var privateVar = 5;\n\n    //private\
    \ methods\n    var privateMethod = function(){\n        return 'Private Test';\n\
    \    };\n\n    return {\n        //public attributes\n        publicVar    : 10,\n\
    \        //public methods\n        publicMethod : function(){\n            return\
    \ ' Followed By Public Test ';\n        },\n\n        //let's access the private\
    \ members\n        getData : function(){\n            return privateMethod() +\
    \ this.publicMethod() + privateVar;\n        }\n    }\n})(); //the parens here\
    \ cause the anonymous function to execute and return\n\nsomeModule.getData();\n\
    ```\n\n## The Revealing Module Pattern\n\nNow you're probably a little more familiar\
    \ with what the Module pattern is. Let's take a look at a slightly improved version\
    \ - Christian Heilmann's Revealing Module pattern, often described as a neat extension\
    \ to a rather robust pattern. The Revealing Module Pattern came about as Heilmann\
    \ (now at Mozilla) was frustrated with the fact that in you had to repeat the\
    \ name of the main object when you wanted to call one public method from another\
    \ or access public variables.\n\nHe also disliked the Module pattern’s requirement\
    \ for having to switch to object literal notation for the things you wished to\
    \ make public. The result of his efforts were an updated pattern where you would\
    \ simply define all of your functions and variables in the private scope and return\
    \ an anonymous object at the end of the module along with pointers to both the\
    \ private variables and functions you wished to reveal as public.\n\nOnce again,\
    \ you’re probably wondering what the benefits of this approach are. The RMP allows\
    \ the syntax of your script to be fairly consistent - it also makes it very clear\
    \ at the end which of your functions and variables may be accessed publicly, something\
    \ that is quite useful. In addition, you are also able to reveal private functions\
    \ with more specific names if you wish.\n\nAn example of how to use the revealing\
    \ module pattern can be found below:\n\n```javascript\n/*\n The idea here is that\
    \ you have private methods\n which you want to expose as public methods.\n\n What\
    \ we are doing below is effectively defining\n a self-executing function and immediately\
    \ returning\n the object.\n */\nvar myRevealingModule = function(){\n\n    var\
    \ name = 'John Smith';\n    var age = 40;\n\n    function updatePerson(){\n  \
    \      name = 'John Smith Updated';\n    }\n    function setPerson () {\n    \
    \    name = 'John Smith Set';\n    }\n    function getPerson () {\n        return\
    \ name;\n    }\n    return{\n        set: setPerson,\n        get: getPerson\n\
    \    }\n}();\n\n// Sample usage:\nmyRevealingModule.get();\n```"
  mdcn: "\n## 我们将探讨的模式\n\n-   创建型模式\n-   构造器模式\n-   单例模式\n-   模块模式\n-   揭示模块模式\n-\
    \   原型模式\n-   DRY 模式\n-   外观模式\n-   工厂模式\n-   装饰器模式\n\n## 创建型模式\n\n这个模式是本文中许多其他模式的基础，实际上理解起来相当直接。正如你可能猜到的，在\
    \ JavaScript 中，创建型模式处理的是在应用程序内创建对象。最常见的做法如下：\n\n```javascript\nvar newObject =\
    \ new MyClass();\n```\n\n很多时候，你没有理由以其他方式来处理这件事。你只需定义你的类，然后在需要时实例化它。然而，有些情况下，这种方式既非优势，也非所需特性。\n\
    \n## 构造器模式\n\n“构造器”这个短语对大多数开发者来说都很熟悉，不过如果你是初学者，在深入探讨专门针对它的模式之前，回顾一下构造器是什么会很有用。构造器用于创建特定类型的对象。这种范式可以在许多编程语言中找到，包括\
    \ JavaScript。你可能熟悉的一些原生构造器包括 `Object` 和 `Array`。\n\n你也可以定义自定义构造器，为你自己的对象类型定义属性和方法。\n\
    让我们来看一个汽车的构造器。\n\n```javascript\nfunction Car(model, year, miles){\n    this.model\
    \ = model;\n    this.year   = year;\n    this.miles  = miles;\n    this.whatCar\
    \ = function(){\n        console.log(this.model);\n    };\n}\n```\n\n```javascript\n\
    var civic = new Car(\"Honda Civic\", 2009, 20000);\nvar mondeo = new Car(\"Ford\
    \ Mondeo\", 2010, 5000);\n```\n\n旁注：[Douglas Crockford](https://www.crockford.com/)\
    \ 建议将你的构造器函数首字母大写，以便更容易区分它们与普通函数。\n\n## 单例模式\n\n从核心上讲，单例模式可以通过创建一个类来实现，该类包含一个方法，如果该类的实例不存在，则创建一个新实例。\n\
    \n如果实例已经存在，它只需返回对该对象的引用。因此，单例模式之所以被称为单例，是因为传统上，它将类的实例化限制为单个对象。\n\n单例并不提供一种方式，让不知道单例先前引用的代码轻松获取它——单例返回的不是对象或类，而是一种结构。\n\
    \n想想闭包变量实际上并非闭包——提供闭包的函数作用域才是闭包。\n\n那么，单例模式在何处有用呢？当系统中恰好需要一个对象来协调模式时，它相当有用。下面是使用单例模式的一个例子：\n\
    \n```javascript\nvar SingletonTester = (function(){\n    //args: an object containing\
    \ arguments for the singleton\n    function Singleton(args) {\n\n        //set\
    \ args variable to args passed or empty object if none provided.\n        var\
    \ args = args || {};\n        //set the name parameter\n        this.name = 'SingletonTester';\n\
    \        //set the value of pointX\n        this.pointX = args.pointX || 6; //get\
    \ parameter from arguments or set default\n        //set the value of pointY\n\
    \        this.pointY = args.pointY || 10;\n\n    }\n\n    //this is our instance\
    \ holder\n    var instance;\n\n    //this is an emulation of static variables\
    \ and methods\n    var _static = {\n        name: 'SingletonTester',\n       \
    \ //This is a method for getting an instance\n        //It returns a singleton\
    \ instance of a singleton object\n        getInstance: function (args){\n    \
    \        if (instance === undefined) {\n                instance = new Singleton(args);\n\
    \            }\n            return instance;\n        }\n    };\n    return _static;\n\
    })();\n\nvar singletonTest = SingletonTester.getInstance({pointX: 5});\nconsole.log(singletonTest.pointX);\
    \ // outputs 5\n```\n\n## 模块模式\n\n现在让我们来看看流行的*模块*模式。模块模式被定义为一种为 JavaScript “类”概念提供私有和公共封装的方式。它们的工作前提是“类”实际上被定义为一个函数（为简单起见，我们称之为类）。\n\
    \n你为这个类决定使用的参数实际上是构造器的参数。在类内部定义的局部变量和函数都成为私有成员。类的返回方法（即仍然是一个函数）返回一个包含你的公共方法和变量的对象。\n\
    \n一个有趣的事实是，模块模式最初是由 Douglas Crockford 正式定义的（他以《JavaScript: The Good Parts》一书等闻名），尽管这种模式的变体很可能在此之前很久就已被使用。另一个有趣的事实是，如果你曾使用过\
    \ Yahoo 的 YUI 库，它的某些功能可能看起来相当熟悉，原因在于模块模式对 YUI 创建其组件时产生了重大影响。\n\n那么，你已经看到了单例模式为何有用，但为什么模块模式是一个好选择呢？\n\
    \n首先，对于有面向对象背景的开发者来说，它比真正的封装概念要清晰得多，至少从 JavaScript 的角度来看是如此。其次，它支持私有数据——因此，在模块模式中，代码的公共部分能够访问私有部分，然而外部世界无法访问类的私有部分（别笑！哦，感谢\
    \ David Engfer 的这个笑话）。\n\n模块模式的缺点在于，由于你以不同方式访问公共和私有成员，当你希望更改可见性时，你实际上必须对每个使用该成员的地方进行更改。\n\
    \n你也不能在稍后添加到对象的方法中访问私有成员。话虽如此，在许多情况下，模块模式仍然非常有用，并且如果使用得当，确实有可能改善应用程序的结构。\n\n```javascript\n\
    var someModule = (function(){\n\n    //private attributes\n    var privateVar\
    \ = 5;\n\n    //private methods\n    var privateMethod = function(){\n       \
    \ return 'Private Test';\n    };\n\n    return {\n        //public attributes\n\
    \        publicVar    : 10,\n        //public methods\n        publicMethod :\
    \ function(){\n            return ' Followed By Public Test ';\n        },\n\n\
    \        //let's access the private members\n        getData : function(){\n \
    \           return privateMethod() + this.publicMethod() + privateVar;\n     \
    \   }\n    }\n})(); //the parens here cause the anonymous function to execute\
    \ and return\n\nsomeModule.getData();\n```\n\n## 揭示模块模式\n\n现在你可能对模块模式是什么更加熟悉了。让我们来看一个稍微改进的版本——Christian\
    \ Heilmann 的揭示模块模式，它通常被描述为一个相当稳健的模式的巧妙扩展。揭示模块模式的出现是因为 Heilmann（现在在 Mozilla）对这样一个事实感到沮丧：当你想从一个公共方法调用另一个公共方法或访问公共变量时，你必须重复主对象的名称。\n\
    \n他也不喜欢模块模式的要求，即必须切换到对象字面量表示法来处理你希望公开的内容。他努力的结果是一个更新的模式，在这个模式中，你只需在私有作用域中定义所有的函数和变量，并在模块末尾返回一个匿名对象以及指向你希望公开的私有变量和函数的指针。\n\
    \n再一次，你可能想知道这种方法的好处是什么。RMP 允许你的脚本语法保持相当一致——它也在末尾非常清楚地指出了你的哪些函数和变量可以被公共访问，这相当有用。此外，如果你愿意，你还可以用更具体的名称来揭示私有函数。\n\
    \n下面是使用揭示模块模式的一个例子：\n\n```javascript\n/*\n The idea here is that you have private\
    \ methods\n which you want to expose as public methods.\n\n What we are doing\
    \ below is effectively defining\n a self-executing function and immediately returning\n\
    \ the object.\n */\nvar myRevealingModule = function(){\n\n    var name = 'John\
    \ Smith';\n    var age = 40;\n\n    function updatePerson(){\n        name = 'John\
    \ Smith Updated';\n    }\n    function setPerson () {\n        name = 'John Smith\
    \ Set';\n    }\n    function getPerson () {\n        return name;\n    }\n   \
    \ return{\n        set: setPerson,\n        get: getPerson\n    }\n}();\n\n//\
    \ Sample usage:\nmyRevealingModule.get();\n```\n"
