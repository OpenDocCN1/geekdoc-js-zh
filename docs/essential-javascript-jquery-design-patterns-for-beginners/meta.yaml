  md: '# The Iterator Pattern


    **The Iterator Pattern** is a design pattern where iterators (objects that allow
    us to traverse through all the elements of a collection) access the elements of
    an aggregate object sequentially without needing to expose it’s underlying form.


    Iterators encapsulate the internal structure of how that particular iteration
    occurs - in the case of jQuery’s .each() iterator, you are actually able to use
    the underlying code behind .each() to iterate through a collection, without needing
    to see or understand the code working behind the scenes that’s providing this
    capability.


    ```

    $.each(function(){});

    $(''.items'').each(function(){});

    ```


    An interesting side-note is that jQuery’s ''each'' method is backwards from the
    ECMA.Script 5 way of doing this but may change at some point in the future.


    # The Strategy Pattern


    **The Strategy Pattern** is a pattern where a script may select a particular algorithm
    at runtime. The purpose of this pattern is that it’s able to provide a way to
    clearly define families of algorithms, encapsulate each as an object and make
    them easily interchangeable.


    You could say that the biggest benefit this pattern offers is that it allows algorithms
    to vary independent of the clients that utilize them. An example of this is where
    jQuery’s toggle() allows you to bind two or more handlers to the matched elements,
    to be executed on alternate clicks.


    The strategy pattern allows for alternative algorithms to be used independent
    of the client internal to the function.


    ```

    $(''#container'').toggle(function(){}, function(){});

    ```


    # The Proxy Pattern


    **The Proxy Pattern** - a proxy is basically a class that functions as an interface
    to something else. The proxy can be an interface to almost anything: a file, a
    resource, an object in memory, something else that is difficult to duplicate etc.
    jQuery''s .proxy() function takes as input a function and returns a new one that
    will always have a particular context.'
