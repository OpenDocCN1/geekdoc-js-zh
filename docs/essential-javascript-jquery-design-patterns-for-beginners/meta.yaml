    # Conclusions


    That’s it for this introduction to the world of design patterns in JavaScript
    & jQuery– I hope you’ve found it useful. The contents of this book are in no way
    an extensive look at the field of patterns, but should give you enough information
    to get started using the patterns covered in your day-to-day projects.


    Design patterns make it easier to reuse successful designs and architectures.
    It’s important for every developer to be aware of design patterns but it’s also
    essential to know how and when to use them. Implementing the right patterns intelligently
    can be worth the effort but the opposite is also true. A badly implementing pattern
    can yield little benefit to a project.


    Also bare in mind that it’s not the number of patterns you implement that’s important
    but how you choose to implement them. For example, don’t choose a pattern just
    for the sake of using ‘one’ but rather try understanding the pros and cons of
    what particular patterns have to offer and make a judgement based on it’s fitness
    for your application.


    If I’ve encouraged your interest in this area further and you would like to learn
    more about design patterns, there are a number of excellent titles on this area
    available for generic software development but also those that cover specific
    languages.


    For JavaScript developers, I recommend checking out two books:


    +   1. ‘Pro JavaScript Design Patterns’ by Ross Harmes and Dustin Diaz.

    2. ''JavaScript Patterns'' by Stoyan Stefanov


    If you’ve managed to absorb most of the information in my mini-book, I think you’ll
    find reading these the next logical step in your learning process (beyond trying
    out some pattern examples for yourself of course) : )


    Thanks for reading *Essential JavaScript & jQuery Design Patterns*. For more free
    learning material on JavaScript, jQuery and User-Interface Design, check out my
    official site over at http://addyosmani.com for my latest educational resources.'
