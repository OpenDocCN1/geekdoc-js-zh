    I recommend learning from others who have already been through the process and
    done it well. Spend time absorbing the information from a number of different
    design pattern descriptions and books and take in what''s meaningful to you -
    this will help you accomplish the goals you''ve got of designing the pattern you
    want to achieve. You''ll probably also want to examine the structure and semantics
    of existing patterns - this can be begun by examining the interactions and context
    of the patterns you are interested in so you can identify the principles that
    assist in organizing those patterns together in useful configurations.


    Once you''ve exposed yourself to a wealth of information on pattern literature,
    you may wish to begin your pattern using an *existing* format and see if you can
    brainstorm new ideas for improving it or integrating your ideas in there. An example
    of someone that did this quite recently is JavaScript developer Christian Heilmann,
    who took an existing pattern called the *module* pattern and made some fundamentally
    useful changes to it to create the *revealing module* pattern (this is one of
    the patterns covered later in this book).


    If you would like to try your hand at writing a design pattern (even if just for
    the learning experience of going through the process), the tips I have for doing
    so would be as follows:'
  - '[PAGE 9]


    +   - **Bare in mind practicability**: Ensure that your pattern describes proven
    solutions to recurring problems rather than just speculative solutions which haven’t
    been qualified.

    - **Ensure that you draw upon best practices**: The design decisions you make
    should be based on principles you derive from an understanding of best practices.

    - **Your design patterns should be transparent to the user**: Design patterns
    should be entirely transparent to any type of user-experience. They are primarily
    there to serve the developers using them and should not force changes to behaviour
    in the user-experience that would not be incurred without the use of a pattern.

    - **Remember that originality is *not* key in pattern design**: When writing a
    pattern, do you not need to be the original discoverer of the solutions being
    documented nor do you have to worry about your design overlapping with minor pieces
    of other patterns. If your design is strong enough to have broad useful applicability,
    it has a chance of being recognized as a proper pattern

    - **Know the differences between patterns and design**: A design pattern generally
    draws from proven best practice and serves as a model for a designer to create
    a solution. *The role of the pattern is to give designers guidance to make the
    best design choices so they can cater to the needs of their users.*

    - **Your pattern needs to have a strong set of examples**: A good pattern description
    needs to be followed by an equally strong set of examples demonstrating the successful
    application of your pattern. To show broad usage, examples that exhibit good design
    principles are ideal.


    Pattern writing is a careful balance between creating a design that is general,
    specific and above all, useful. Try to ensure that if writing a pattern you cover
    the widest possible areas of application and you should be fine. I hope that this
    brief introduction to writing patterns has given you some insights that will assist
    your learning process for the next sections of this book.


    # Anti-Patterns


    If we consider that a pattern represents a best practice, an anti-pattern represents
    a lesson that has been learned. The term anti-patterns was coined in 1995 by Andrew
    Koenig in the November C++ Report that year. It was inspired by the Gang of Four’s
    book *Design Patterns*, that developed the concept of design patterns in the software
    field. In Koenig’s report, there are two notions of anti-patterns that are presented.
    Anti-Patterns:


    +   - Describe a *bad* solution to a particular problem which resulted in a bad
    situation occurring

    - Describe *how* to get out of said situation and how to go from there to a good
    solution'
- md: ' On this topic, Alexander writes about the difficulties in achieving a good
    balance between good design structure and good context:


    > "This notes are about the process of design; the process of inventing physical
    things which display a new physical order, organization, form, in response to
    function....every design problem begins with an effort to achieve fitness between
    two entities: the form in question and its context. The form is the solution to
    the problem; the context defines the problem".


    While it''s quite important to be aware of design patterns, it can be equally
    important to understand anti-patterns. Let us qualify the reason behind this.
    When creating an application, a project''s life-cycle begins with construction
    however once you''ve got the initial release done, it needs to be maintained.
    The quality of a final solution will either be *good or bad*, depending on the
    level of skill and time the team have invested in it. Here *good* and *bad* are
    considered in context - a ''perfect'' design may qualify as an anti-pattern if
    applied in the wrong context.


    The bigger challenges happen after an application has hit production and is ready
    to go into maintenance mode. A developer working on such a system who hasn''t
    worked on the application before may introduce a *bad* design into the project
    by accident. If said *bad* practices are created as anti-patterns, they allow
    developers a means to recognize these in advance so that they can avoid common
    mistakes that can occur - this is parallel to the way in which design patterns
    provide us with a way to recognize common techniques that are *useful*.


    To summarize, an anti-pattern is a bad design that is worthy of documenting. Examples
    of anti-patterns in JavaScript are the following:


    -   - Polluting the namespace by defining a large number of variables in the global
    context

    - Passing strings rather than functions to either setTimeout or setInterval as
    this triggers the use of eval() internally.

    - Prototyping against the Object object (this is a particularly bad anti-pattern)

    - Using JavaScript in an inline form as this is inflexible

    - The use of document.write where native DOM alternatives such as document.createElement学以致用
    are more appropriate. document.write has been grossly misused over the years and
    has quite a few disadvantages including that if it''s executed after the page
    has been loaded it can actually overwrite the page you''re on, whilst document.createElement
    does not. You can see [here](https://example.com) for a live example of this in
    action. It also doesn''t work with XHTML which is another reason opting for more
    DOM-friendly methods such as document.createElement is favorable.


    Knowledge of anti-patterns is critical for success. Once you are able to recognize
    such anti-patterns, you will be able to refactor your code to negate them so that
    the overall quality of your solutions improves instantly.


    ## Categories Of Design Pattern


    A glossary from the well-known design book, *Domain-Driven Terms*, rightly states
    that:


    > "A design pattern names, abstracts, and identifies the key aspects of a common
    design structure that make it useful for creating a reusable object-oriented design.
    The design pattern identifies the participating classes and their instances, their
    roles and collaborations, and the distribution of responsibilities.


    Each design pattern focuses on a particular object-oriented design problem or
    issue. It describes when it applies, whether or not in can be applied in view
    of other design constraints, and the consequences and trade-offs of its use. Since
    we must eventually implement our designs, a design pattern also provides sample
    ... code to illustrate an implementation.


    Although design patterns describe object-oriented designs, they are based on practical
    solutions that have been implemented in mainstream object-oriented programming
    languages ...."


    Design patterns can be broken down into a number of different categories. In this
    section we''ll review three of these categories and briefly mention a few examples
    of the patterns that fall into these categories before exploring specific ones
    in more detail.


    ## Creational Design Patterns


    Creational design patterns focus on handling object creation mechanisms where
    objects are created in a manner suitable for the situation you are working in.
    The basic approach to object creation might otherwise lead to added complexity
    in a project whilst creational patterns aim to solve this problem by *controlling*
    the creation of such objects.


    Some of the patterns that fall under this category are: Factory, Abstract, Prototype,
    Singleton and Builder.


    ## Structural Design Patterns


    Structural patterns focus on the composition of classes and objects. Structural
    ''class'' creation patterns use inheritance to compose interfaces whilst ''object''
    patterns define methods to create objects to obtain new functionality.


    Patterns that fall under this category include: Decorator, Facade, Composite,
    Adapter and Bridge


    ## Behavioral Design Patterns


    The main focus behind this category of patterns is the communication between a
    class''s objects. By specifically targeting this problem, these patterns are able
    to increase the flexibility in carrying out this communication.


    Some behavioral patterns include: Iterator, Mediator, Observer and Visitor.


    ## Summary Table Of Design Pattern Categorization


    In my early experiences of learning about design patterns, I personally found
    the following table a very useful reminder of what a number of patterns has to
    offer - it covers the 23 Design Patterns mentioned by the GoF. The original table
    was summarized by Elyse Nielsen back in 2004 and I''ve modified it where necessary
    to suit our discussion in this section of the book.


    I recommending using this table as reference, but do remember that there are a
    number of additional patterns that are not mentioned on this table but will be
    discussed later in the book. That said, it''s a great starting point for learning.


    | | |

    |---|---|

    | **Creational** | Based on the concept of creating an object. |

    | **Class** | |

    | *Factory Method* | This makes an instance of several derived classes based on
    interfaced data or events. |

    | **Object** | |

    | *Abstract Factory* | Creates an instance of several families of classes without
    detailing concrete classes. |

    | *Builder* | Separates object construction from its representation, always creates
    the same type of object. |

    | *Prototype* | A fully initialized instance used for copying or cloning. |

    | *Singleton* | A class with only a single instance with global access points.
    |


    | | |

    |---|---|

    | **Structural** | Based on the idea of building blocks of objects |

    | **Class** | |

    | *Adapter* | Match interfaces of different classes therefore classes can work
    together despite incompatible interfaces |

    | **Object** | |

    | *Adapter* | Match interfaces of different classes therefore classes can work
    together despite incompatible interfaces |

    | *Bridge* | Separates an object''s interface from its implementation so the two
    can vary independently |

    | *Composite* | A structure of simple and composite objects which makes the total
    object more than just the sum of its parts. |

    | *Decorator* | Dynamically add alternate processing to objects. |

    | *Facade* | A single class that hides the complexity of an entire subsystem.
    |

    | *Flyweight* | A fine-grained instance used for efficient sharing of information
    that is contained elsewhere. |

    | *Proxy* | A place holder object representing the true object |


    | | |

    |---|---|

    | **Behavioral** | Based on the way objects play and work together. |

    | **Class** | |

    | *Interpreter* | A way to include language elements in an application to match
    the grammer of the intended language. |

    | *Template Method* | Creates the shell of an algorithm in a method, then defer
    the exact steps to a subclass. |

    | **Object** | |


    | Pattern | Description |

    | :--- | :--- |

    | **Chain of Responsibility** | A way of passing a request between a chain of
    objects to find the object that can handle the request. |

    | **Command** | Encapsulate a command request as an object to enable, logging
    and/or queuing of requests, and provides error-handling for unhandled requests.
    |

    | **Iterator** | Sequentially access the elements of a collection without knowing
    the inner workings of the collection. |

    | **Mediator** | Defines simplified communication between classes to prevent a
    group of classes from referring explicitly to each other. |

    | **Memento** | Capture an object''s internal state to be able to restore it later.
    |

    | **Observer** | A way of notifying change to a number of classes to ensure consistency
    between the classes. |

    | **State** | Alter an object''s behavior when its state changes |

    | **Strategy** | Encapsulates an algorithm inside a class separating the selection
    from the implementation |

    | **Visitor** | Adds a new operation to a class without changing the class |


    ## Design Patterns In JavaScript


    Next we''re going to take a look at 10 popular design patterns that I''ve personally
    found very useful to apply in JavaScript applications over the years.


    Note that there is no ''ideal'' pattern to use from this selection as developers
    often use best judgment when deciding on the pattern, which is the best ''fit''
    for their needs.


    Each pattern varies in complexity, however I have tried to keep my explanations
    as simple as possible so that both beginners and intermediate developers can benefit
    from the material.'
