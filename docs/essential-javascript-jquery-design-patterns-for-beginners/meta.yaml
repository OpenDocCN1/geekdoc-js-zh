  md: "# # The Prototype Pattern\n\nThe prototype pattern is based on the concept\
    \ of prototypal inheritance where we create objects which act as prototypes for\
    \ other objects. The prototype object itself is effectively used a blueprint for\
    \ each object the constructor creates. If the prototype of the constructor function\
    \ used contains a property called 'name' for example (as per the code sample below),\
    \ then each object created by that same constructor will also have this same property.\n\
    \nLooking at the definitions for the prototype pattern in existing literature\
    \ non-specific to JavaScript, you *may* find references to concepts outside the\
    \ scope of the language such as classes. The reality is that prototypal inheritance\
    \ avoids using classes altogether. There isn't a 'definition' object nor a core\
    \ object in theory. We're simply creating copies of existing functional objects.\n\
    \nOne of the core benefits of using the prototype pattern is that we're working\
    \ with the strengths JavaScript has to offer natively rather than attempting to\
    \ imitate features of other languages (something a few design pattern implementations\
    \ do).\n\nNot only is this an easy way to implement inheritance, but this also\
    \ comes with a performance boost as well. When defining a function in an object,\
    \ they're all created by reference (so all child objects point to the same function)\
    \ instead of creating their own individual copies.\n\nFor those interested, real\
    \ prototypal inheritance, as defined in the ECMAScript 5 standard, requires the\
    \ use of Object.create which is a recent newly native method. Object.create creates\
    \ an object which has a specified prototype and which optionally contains specified\
    \ properties (i.e Object.create(prototype, optionalDescriptorObjects)).\n\nWe\
    \ can also see this being demonstrated in the example below:\n\n```\n// No need\
    \ for capitalization as it's not a constructor\nvar someCar = {\n  drive: function()\
    \ {};\n  name: 'Mazda 3'\n};\n\n// Use Object.create to generate a new car\nvar\
    \ anotherCar = Object.create(someCar);\nanotherCar.name = 'Toyota Camry';\n```"
