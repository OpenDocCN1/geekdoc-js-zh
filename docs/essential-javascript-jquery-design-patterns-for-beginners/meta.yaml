  - "[PAGE 24]\n\n# The Facade Pattern\n\nThis pattern both simplifies the interface\
    \ of a class and it also decouples the class from the code that utilizes it. Facades\
    \ are often considered an essential part of a developer's pattern toolkit - they\
    \ can make library utilities significantly easier to understand by creating convenience\
    \ routines that simplify the use of complex systems.\n\nAn example of where the\
    \ Facade pattern can be found is in the creation of uniform JavaScript APIs which\
    \ often seek to provide consistent experiences across all browsers. Facades provide\
    \ us with an ability to indirectly interact with subsystems in a way that may\
    \ be less prone to error than accessing the subsystem directly.\n\nFacade's advantages\
    \ include ease of use and often a small size-footprint in implementing the pattern.\
    \ It does however have some pitfalls - Facade is inefficient when used consecutively\
    \ and each time it's called a new check must be made to determine the features\
    \ available for attaching event listeners. Let's take a look at the pattern in\
    \ action:\n\nThis is an unoptimized code example but here we utilize Facade to\
    \ simplify an interface for attaching events.\n\nWe do this by creating a common\
    \ method that can be used in one's code which does the task of checking for the\
    \ existence of features so that it can provide a safe and cross-browser compatible\
    \ solution.\n\n```\nvar addMyEvent = function(el,ev,fn){\n\n    if(el.addEventListener){\n\
    \        el.addEventListener(ev,fn, false);\n    }else if(el.attachEvent){\n \
    \       el.attachEvent('on'+ev, fn);\n    } else{\n        el['on' + ev] = fn;\n\
    \    }\n\n};\n```"
  - "[PAGE 25]\n\n# The Factory Pattern\n\nSimilar to other creational patterns, the\
    \ Factory Pattern deals with the problem of creating objects (which we can think\
    \ of as 'factory products') without the need to specify the exact class of object\
    \ being created.\n\nSpecifically, the Factory Pattern suggests defining an interface\
    \ for creating an object where you allow the subclasses to decide which class\
    \ to instantiate. This pattern handles the problem by defining a completely separate\
    \ method for the creation of objects and which sub-classes are able to override\
    \ so they can specify the 'type' of factory product that will be created.\n\n\
    This can come in quite useful, in particular if the creation process involved\
    \ is quite complex. eg. if it strongly depends on the settings in configuration\
    \ files. You can often find factory methods in frameworks where the code for a\
    \ library may need to create objects of particular types which may be subclassed\
    \ by scripts using the frameworks.\n\nIn our example, let's take the code used\
    \ in the original Constructor pattern example and see what this would look like\
    \ were we to optimize it using the Factory Pattern:\n\n```\nvar Car = (function()\
    \ {\n    var Car = function (model, year, miles){\n        this.model = model;\n\
    \        this.year   = year;\n        this.miles = miles;\n    };\n    return\
    \ function (model, year, miles) {\n        return new Car(model, year, miles);\n\
    \    }\n})();\n\nvar civic = new Car(\"Honda Civic\", 2009, 20000);\nvar mondeo\
    \ = new Car(\"Ford Mondeo\", 2010, 5000);\n```\n\n# The Decorator Pattern\n\n\
    Decorator patterns are an alternative to creating subclasses. This pattern can\
    \ be used to wrap objects within another object of the same interface and allows\
    \ you to both add behaviour to methods and also pass the method call to the original\
    \ object (ie the constructor of the decorator)."
- md: "The decorator pattern is used when you need to keep adding new functionality\
    \ to overridden methods. This can be achieved by stacking multiple decorators\
    \ on top of one another.\n\nWhat is the main benefit of using a decorator pattern?\
    \ Well, if we examine our first definition, I mentioned that decorators are an\
    \ alternative to subclassing. When a script is being run, subclassing adds behaviour\
    \ that affects all the instances of the original class, whilst decorating does\
    \ not.\n\nIt instead can add new behaviour for individual objects, which can be\
    \ of benefit depending on the application in question.\n\nLet's take a look at\
    \ some code that implements the decorator pattern:\n\n```\n//The class we're going\
    \ to decorate\nfunction Macbook(){\n\tthis.cost = function(){\n\t\treturn 1000;\n\
    \t};\n}\n\nfunction Memory(macbook){\n\tthis.cost = function(){\n\t\treturn macbook.cost()\
    \ + 75;\n\t};\n}\n\nfunction BlurayDrive(macbook){\n\tthis.cost = function(){\n\
    \t\treturn macbook.cost() + 300;\n\t};\n}\n\nfunction Insurance(macbook){\n\t\
    this.cost = function(){\n\t\treturn macbook.cost() + 250;\n\t};\n}\n\n// Sample\
    \ usage\nvar myMacbook = new Insurance(new BlurayDrive(new Memory(new Macbook())));\n\
    console.log( myMacbook.cost() );\n```\n\n## Design Patterns in jQuery\n\nNow that\
    \ we've taken a look at vanilla-JavaScript implementations of popular design patterns,\
    \ let's switch gears and find out what these design patterns might look like when\
    \ implemented using jQuery. jQuery (as you may know) is currently the most popular\
    \ JavaScript library and provides a layer of 'sugar' on top of regular JavaScript\
    \ with a syntax that can be easier to understand at a glance.\n\nBefore we dive\
    \ into this section, it's important to remember that many vanilla-JavaScript design\
    \ patterns can be intermixed with jQuery when used correctly because jQuery is\
    \ still essentially JavaScript itself.\n\njQuery is an interesting topic to discuss\
    \ in the realm of patterns because the library actually uses a number of design\
    \ patterns itself. What impresses me is just how cleanly all of the patterns it\
    \ uses have been implemented so that they exist in harmony.\n\nLet's take a look\
    \ at what some of these patterns are and how they are used.\n\n## Lazy Initialization\n\
    \n**Lazy Initialization** is a design pattern where you employ a tactic of delaying\
    \ any expensive processes (eg. the creation of objects) until the first instance\
    \ they are needed. An example of this is the .ready() function in jQuery that\
    \ only executes a function once the DOM has fully loaded.\n\n```\n$(document).ready(function(){\n\
    \    $('#content').fadeIn();\n});\n```\n\n## The Composite Pattern\n\n**The Composite\
    \ Pattern** describes a group of objects that can be treated in the same way a\
    \ single instance of an object can. Implementing this pattern allows you to treat\
    \ both individual objects and compositions in a uniform manner. In jQuery, when\
    \ we're accessing or performing actions on a single DOM element or a group of\
    \ DOM elements, we can treat both in a uniform manner. This is demonstrated by\
    \ the code sample below:\n\n```\n$('#someDiv').addClass('active'); // a single\
    \ element\n$('div').addClass('active');       // a collection of elements\n```\n\
    \n## The Wrapper Pattern\n\nThe **Wrapper Pattern** is a pattern which translates\
    \ an *interface* for a class into a compatible interface. Wrappers basically allow\
    \ classes to function together which normally couldn't due to their incompatible\
    \ interfaces. The wrapper translates calls to its interface into calls to the\
    \ original interface and the code required to achieve this is usually quite minimal.\n\
    \n```\n$('.container').css({\n        opacity: .5 //apply opacity in modern browsers\
    \ (eg. Chrome, FireFox) but use filter for IE\n    });\n```\n\n## The Facade Pattern\n\
    \nThe **Facade Pattern** is quite commonly used with OOP (Object-oriented programming)\
    \ where a facade is an object which provides a simpler interface to a larger piece\
    \ of code (eg. a class library). Facades can be frequently found across the jQuery\
    \ library and make methods both easier to use and understand, but also more readable.\
    \ The following are facades for jQuery's $.ajax():\n\n```\n$.get();\n$.post();\n\
    $.getJSON();\n$.getScript();\n```\n\n## The Observer Pattern\n\nThe **Observer\
    \ Pattern** is where a subject (the object), keeps a list of its dependants, which\
    \ are known as observers, and notifies them automatically of any changes in state.\
    \ This is commonly done by calling one of their methods. The Observer pattern\
    \ can be considered a subset of PubSub (publish/subscribe pattern).\n\n```\n//Here\
    \ jQuery makes use of its event system on top of DOM events\n$('.button').click(function(){})\n\
    $('.button').trigger('click', function(){})\n```\n\n## The Iterator Pattern\n\n\
    **The Iterator Pattern** is a design pattern where iterators (objects that allow\
    \ us to traverse through all the elements of a collection) access the elements\
    \ of an aggregate object sequentially without needing to expose its underlying\
    \ form.\n\nIterators encapsulate the internal structure of how that particular\
    \ iteration occurs - in the case of jQuery’s .each() iterator, you are actually\
    \ able to use the underlying code behind .each() to iterate through a collection,\
    \ without needing to see or understand the code working behind the scenes that’s\
    \ providing this capability.\n\n```\n$.each(function(){});\n$('.items').each(function(){});\n\
    ```\n\nAn interesting side-note is that jQuery’s 'each' method is backwards from\
    \ the ECMAScript 5 way of doing this but may change at some point in the future.\n\
    \n## The Strategy Pattern\n\n**The Strategy Pattern** is a pattern where a script\
    \ may select a particular algorithm at runtime. The purpose of this pattern is\
    \ that it’s able to provide a way to clearly define families of algorithms, encapsulate\
    \ each as an object and make them easily interchangeable.\n\nYou could say that\
    \ the biggest benefit this pattern offers is that it allows algorithms to vary\
    \ independent of the clients that utilize them. An example of this is where jQuery’s\
    \ toggle() allows you to bind two or more handlers to the matched elements, to\
    \ be executed on alternate clicks.\n\nThe strategy pattern allows for alternative\
    \ algorithms to be used independent of the client internal to the function.\n\n\
    ```\n$('#container').toggle(function(){}, function(){});\n```\n\n## The Proxy\
    \ Pattern\n\n**The Proxy Pattern** - a proxy is basically a class that functions\
    \ as an interface to something else. The proxy can be an interface to almost anything:\
    \ a file, a resource, an object in memory, something else that is difficult to\
    \ duplicate etc. jQuery's .proxy() function takes as input a function and returns\
    \ a new one that will always have a particular context.\n\nThis is parallel to\
    \ the idea of providing an interface as per the proxy pattern.\n\n```\n$.proxy(function(){},\
    \ obj);\n```\n\n## The Builder Pattern\n\n**The Builder Pattern**'s main concept\
    \ is that it abstracts the steps involved in creating objects so that different\
    \ implementations of these steps have the ability to construct different representations\
    \ of objects.\n\nBelow is an example of how jQuery utilizes this pattern to allow\
    \ an element which you may wish to append to the document body to be constructed\
    \ using a string definition.\n\n```\n$('<div class=\"foo\">bar</div>');\n```\n\
    \n## The Prototype Pattern\n\n*The Prototype Pattern* is used when the objects\
    \ you wish to create are determined by a prototypical instance that is cloned\
    \ to produce the new objects. Essentially this pattern is used to avoid creating\
    \ a new object in a standard manner when this process may be expensive or overly\
    \ complex. In the following code sample which extends the jQuery.fn object for\
    \ a minimal plugin, underlying prototypical code makes this possible:\n\n```\n\
    $.fn.plugin = function(){}\n$('#container').plugin();\n```\n\n## The Flyweight\
    \ Pattern\n\n*The Flyweight Pattern* is a design pattern where an object attempts\
    \ to minimize the amount of memory used by sharing as much information as possible\
    \ with other objects that are similar in nature. It's a way to utilize objects\
    \ in large numbers when a simple repeated representation may use an amount of\
    \ memory deemed unacceptable. There are often aspects of an object's state that\
    \ can be shared and it's commonplace that these be stored in external data-structures\
    \ that are passed to the flyweight objects temporarily when needed.\n\n```\n//\
    \ The userConfig is shared here:\n$.fn.plugin = function(userConfig){\n    userConfig\
    \ = $.extend({\n        content: 'Hello user!'\n    }, userConfig);\n    return\
    \ this.html(userConfig.content);\n});\n```"
  mdcn: "\n装饰器模式用于需要在已重写方法上不断添加新功能时。这可以通过将多个装饰器堆叠在一起来实现。\n\n使用装饰器模式的主要好处是什么？如果我们仔细查看第一个定义，我提到装饰器是子类化的一种替代方案。当脚本运行时，子类化会添加影响原始类所有实例的行为，而装饰则不会。\n\
    \n相反，它可以为单个对象添加新行为，这在特定应用中可能是有益的。\n\n让我们来看一些实现装饰器模式的代码：\n\n```\n//The class we're\
    \ going to decorate\nfunction Macbook(){\n\tthis.cost = function(){\n\t\treturn\
    \ 1000;\n\t};\n}\n\nfunction Memory(macbook){\n\tthis.cost = function(){\n\t\t\
    return macbook Gen Zil macbook.cost() + 75;\n\t};\n}\n\nfunction BlurayDrive(macbook){\n\
    \tthis.cost = function(){\n\t\treturn macbook.cost() + 300;\n\t};\n}\n\nfunction\
    \ Insurance(macbook){\n\tthis.cost = function(){\n\t\treturn macbook.cost() +\
    \ 250;\n\t};\n}\n\n// Sample usage\nvar myMacbook = new Insurance(new BlurayDrive(new\
    \ Memory(new Macbook())));\nconsole.log( myMacbook.cost() );\n```\n\n## jQuery\
    \ 中的设计模式\n\n现在我们已经了解了流行设计模式的普通 JavaScript 实现，让我们转换思路，看看这些设计模式在使用 jQuery 实现时可能是什么样子。jQuery（如你所知）目前是最流行的\
    \ JavaScript 库，它在普通 JavaScript 之上提供了一层\"语法糖\"，其语法可以更容易一眼理解。\n\n在我们深入本节之前，重要的是要记住，许多普通\
    \ JavaScript 设计模式可以与 jQuery 混合使用，因为 jQuery 本质上仍然是 JavaScript。\n\njQuery 是一个在模式领域中很有趣的讨论话题，因为该库本身实际上使用了\
    \ numerous 设计模式。让我印象深刻的是，它所使用的所有模式都实现得非常干净，以至于它们和谐地共存。\n\n让我们来看看其中一些模式是什么，以及它们是如何使用的。\n\
    \n## 延迟初始化\n\n**延迟初始化**是一种设计模式，其策略是延迟任何昂贵的进程（例如对象的创建）直到第一次需要它们时。一个例子是 jQuery 中的\
    \ .ready() 函数，它只在 DOM 完全加载后才执行函数。\n\n```\n$(document).ready(function(){\n    $('#content').fadeIn();\n\
    });\n```\n\n## 组合模式\n\n**组合模式**描述了一组可以以与单个对象实例相同方式处理的对象。实现此模式允许您以统一的方式处理单个对象和组合。在\
    \ jQuery 中，当我们访问或对单个 DOM 元素或一组 DOM 元素执行操作时，我们可以以统一的方式处理两者。这在下面的代码示例中得到证明：\n\n\
    ```\n$('#someDiv').addClass('active'); // a single element\n$('div').addClass('active');\
    \       // a collection of elements\n```\n\n## 包装器模式\n\n**包装器模式**是一种将类的*接口*翻译成兼容接口的模式。包装器基本上允许通常由于其不兼容接口而无法一起工作的类协同运行。包装器将其接口的调用翻译成对原始接口的调用，实现这一目标所需的代码通常非常少。\n\
    \n```\n$('.container').css({\n        opacity: .5 //apply opacity in modern browsers\
    \ (eg. Chrome, FireFox) but use filter for IE\n    });\n```\n\n## 外观模式\n\n**外观模式**在\
    \ OOP（面向对象编程）中非常常用，其中外观是一个对象，它提供对更大段代码（例如类库）的更简化的接口。外观在 jQuery 库中随处可见，使方法更易于使用和理解，也更易读。以下是\
    \ jQuery $.ajax() 的外观：\n\n```\n$.get();\n$.post();\n$.getJSON();\n$.getScript();\n\
    ```\n\n## 观察者模式\n\n**观察者模式**是指主体（对象）维护其依赖项的列表，这些依赖项被称为观察者，并在状态发生任何变化时自动通知它们。这通常通过调用它们的方法之一来完成。观察者模式可以被认为是\
    \ PubSub（发布/订阅模式）的一个子集。\n\n```\n//Here jQuery makes use of its event system on\
    \ top of DOM events\n$('.button').click(function(){})\n$('.button').trigger('click',\
    \ function(){})\n```\n\n## 迭代器模式\n\n**迭代器模式**是一种设计模式，其中迭代器（允许我们遍历集合中所有元素的对象）按顺序访问聚合对象的元素，而无需暴露其底层形式。\n\
    \n迭代器封装了特定迭代发生的内部结构——在 jQuery 的 .each() 迭代器的情况下，您实际上能够使用 .each() 背后的底层代码来遍历集合，而无需看到或理解在幕后提供此功能的代码。\n\
    \n```\n$.each(function(){});\n$('.items').each(function(){});\n```\n\n一个有趣的附带说明是，jQuery\
    \ 的 'each' 方法与 ECMAScript 5 的做法相反，但将来某个时候可能会改变。\n\n## 策略模式\n\n**策略模式**是一种模式，其中脚本可以在运行时选择特定算法。此模式的目的是能够提供一种清晰定义算法族、将每个算法封装为对象并使它们易于互换的方式。\n\
    \n可以说，这种模式提供的最大好处是它允许算法独立于使用它们的客户端而变化。一个例子是 jQuery 的 toggle() 允许您绑定两个或更多处理程序到匹配的元素，以便在交替点击时执行。\n\
    \n策略模式允许在函数内部使用独立于客户端的替代算法。\n\n```\n$('#container').toggle(function(){}, function(){});\n\
    ```\n\n## 代理模式\n\n**代理模式**——代理基本上是一个充当其他东西接口的类。代理可以充当几乎任何东西的接口：文件、资源、内存中的对象、难以复制的其他东西等。jQuery\
    \ 的 .proxy() 函数接受一个函数作为输入，并返回一个新函数，该函数将始终具有特定的上下文。\n\n这与提供接口作为代理模式的概念平行。\n\n```\n\
    $.proxy(function(){}, obj);\n```\n\n## 构建器模式\n\n**构建器模式**的主要概念是抽象创建对象所涉及的步骤，以便这些步骤的不同实现能够构造对象的不同表示。\n\
    \n下面是 jQuery 如何利用此模式允许使用字符串定义构造您可能希望附加到文档主体的元素的示例。\n\n```\n$('<div class=\"foo\"\
    >bar</div>');\n```\n\n## 原型模式\n\n*原型模式*用于您希望创建的对象由原型实例确定，该实例被克隆以产生新对象时。本质上，此模式用于避免以标准方式创建新对象，当此过程可能昂贵或过于复杂时。在以下扩展\
    \ jQuery.fn 对象以创建最小插件的代码示例中，底层原型代码使这成为可能：\n\n```\n$.fn.plugin = function(){}\n\
    $('#container').plugin();\n```\n\n## 享元模式\n\n*享元模式*是一种设计模式，其中一个对象试图通过与其他相似对象尽可能共享信息来最小化使用的内存量。这是一种在大量利用对象时使用简单重复表示可能使用量被视为不可接受的内存的方式。对象的状态通常有可共享的方面，这些方面通常存储在外部数据结构中，在需要时临时传递给享元对象，这是常见的做法。\n\
    \n```\n// The userConfig is shared here:\n$.fn.plugin = function(userConfig){\n\
    \    userConfig = $.extend({\n        content: 'Hello user!'\n    }, userConfig);\n\
    \    return this.html(userConfig.content);\n});\n```\n"
