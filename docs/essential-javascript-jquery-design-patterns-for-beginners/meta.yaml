    \ are needed. An example of this is the .ready() function in jQuery that only\
    \ executes a function once the DOM has fully loaded.\n\n```\n$(document).ready(function(){\n\
    \    $('#content').fadeIn();\n});\n```\n\n# The Composite Pattern\n\n**The Composite\
    \ Pattern** describes a group of objects that can be treated in the same way a\
    \ single instance of an object can. Implementing this pattern allows you to treat\
    \ both individual objects and compositions in a uniform manner. In jQuery, when\
    \ we're accessing or performing actions on a single DOM element or a group of\
    \ DOM elements, we can treat both in a uniform manner. This is demonstrated by\
    \ the code sample below:\n\n```\n$('#someDiv').addClass('active'); // a single\
    \ element\n$('div').addClass('active');       // a collection of elements\n```"
  - "[PAGE 28]\n\n# The Wrapper Pattern\n\nThe **Wrapper Pattern** is a pattern which\
    \ translates an *interface* for a class into a compatible interface. Wrappers\
    \ basically allow classes to function together which normally couldn't due to\
    \ their incompatible interfaces. The wrapper translates calls to it's interface\
    \ into calls to the original interface and the code required to achieve this is\
    \ usually quite minimal.\n\n```\n$('.container').css({\n        opacity: .5 //apply\
    \ opacity in modern browsers (eg. Chrome, FireFox) but use filter for IE\n   \
    \ });\n```\n\n# The Facade Pattern\n\nThe **Facade Pattern** is quite commonly\
    \ used with OOP (Object-oriented programming) where a facade is an object which\
    \ provides a simpler interface to a larger piece of code (eg. a class library).\
    \ Facades can be frequently found across the jQuery library and make methods both\
    \ easier to use and understand, but also more readable. The following are facades\
    \ for jQuery's $.ajax():\n\n```\n$.get();\n$.post();\n$.getJSON();\n$.getScript();\n\
    ```\n\n# The Observer pattern\n\nThe **Observer pattern** is where a subject (the\
    \ object), keeps a list of it's dependants, which are known as observers, and\
    \ notifies them automatically of any changes in state. This is commonly done by\
    \ calling one of their methods. The Observer pattern can be considered a subset\
    \ of PubSub (publish/subscribe pattern).\n\n```\n//Here jQuery makes use of it's\
    \ event system on top of DOM events\n$('.button').click(function(){})\n$('.button').trigger('click',\
    \ function(){})\n```"
  - '[PAGE 29]


    # The Iterator Pattern


    **The Iterator Pattern** is a design pattern where iterators (objects that allow
    us to traverse through all the elements of a collection) access the elements of
    an aggregate object sequentially without needing to expose it’s underlying form.


    Iterators encapsulate the internal structure of how that particular iteration
    occurs - in the case of jQuery’s .each() iterator, you are actually able to use
    the underlying code behind .each() to iterate through a collection, without needing
    to see or understand the code working behind the scenes that’s providing this
    capability.


    ```

    $.each(function(){});

    $(''.items'').each(function(){});

    ```


    An interesting side-note is that jQuery’s ''each'' method is backwards from the
    ECMA.Script 5 way of doing this but may change at some point in the future.


    # The Strategy Pattern


    **The Strategy Pattern** is a pattern where a script may select a particular algorithm
    at runtime. The purpose of this pattern is that it’s able to provide a way to
    clearly define families of algorithms, encapsulate each as an object and make
    them easily interchangeable.


    You could say that the biggest benefit this pattern offers is that it allows algorithms
    to vary independent of the clients that utilize them. An example of this is where
    jQuery’s toggle() allows you to bind two or more handlers to the matched elements,
    to be executed on alternate clicks.


    The strategy pattern allows for alternative algorithms to be used independent
    of the client internal to the function.


    ```

    $(''#container'').toggle(function(){}, function(){});

    ```


    # The Proxy Pattern


    **The Proxy Pattern** - a proxy is basically a class that functions as an interface
    to something else. The proxy can be an interface to almost anything: a file, a
    resource, an object in memory, something else that is difficult to duplicate etc.
    jQuery''s .proxy() function takes as input a function and returns a new one that
    will always have a particular context.'
  - "[PAGE 30]\n\nThis is parallel to the idea of providing an interface as per the\
    \ proxy pattern.\n\n```\n$.proxy(function(){}, obj);\n```\n\n# The Builder Pattern\n\
    \n**The Builder Pattern**'s main concept is that it abstracts the steps involved\
    \ in creating objects so that different implementations of these steps have the\
    \ ability to construct different representations of objects.\n\nBelow is an example\
    \ of how jQuery utilizes this pattern to allow an element which you may wish to\
    \ append to the document body to be constructed using a string definition.\n\n\
    ```\n$('< div class= \"foo\"> bar < /div>');\n```\n\n# The Prototype Pattern\n\
    \n*The Prototype Pattern* is used when the objects you wish to create are determined\
    \ by a prototypical instance that is cloned to produce the new objects. Essentially\
    \ this pattern is used to avoid creating a new object in a standard manner when\
    \ this process may be expensive or overly complex. In the following code sample\
    \ which extends the jQuery.fn object for a minimal plugin, underlying prototypical\
    \ code makes this possible:\n\n```\n$.fn.plugin = function(){}\n$('#container').plugin();\n\
    ```\n\n# The Flyweight Pattern\n\n*The Flyweight Pattern* is a design pattern\
    \ where an object attempts to minimize the amount of memory used by sharing as\
    \ much information as possible with other objects that are similar in nature.\
    \ It's a way to utilize objects in large numbers when a simple repeated representation\
    \ may use an amount of memory deemed unacceptable. There are often aspects of\
    \ an object state that can be shared and it's commonplace that these be stored\
    \ in external data-structures that are passed to the flyweight objects temporarily\
    \ when needed.\n\n```\n// The userConfig is shared here:\n\n$.fn.plugin = function(userConfig){\n\
    \    userConfig = $.extend({\n        content: 'Hello user!'\n    }, userConfig);\n\
    \    return this.html(useConfig.content);\n});\n```"
- md: 'A side-note here is that prototypal inheritance in JavaScript uses differential
    inheritance to only define objects once in a prototype chain until they are overridden.
    This makes it easier to save memory.


    ## Conclusions


    That''s it for this introduction to the world of design patterns in JavaScript
    & jQuery– I hope you''ve found it useful. The contents of this book are in no
    way an extensive look at the field of patterns, but should give you enough information
    to get started using the patterns covered in your day-to-day projects.


    Design patterns make it easier to reuse successful designs and architectures.
    It''s important for every developer to be aware of design patterns but it''s also
    essential to know how and when to use them. Implementing the right patterns intelligently
    can be worth the effort but the opposite is also true. A badly implementing pattern
    can yield little benefit to a project.


    Also bear in mind that it''s not the number of patterns you implement that''s
    important but how you choose to implement them. For example, don''t choose a pattern
    just for the sake of using ''one'' but rather try understanding the pros and cons
    of what particular patterns have to offer and make a judgement based on its fitness
    for your application.


    If I''ve encouraged your interest in this area further and you would like to learn
    more about design patterns, there are a number of excellent titles on this area
    available for generic software development but also those that cover specific
    languages.


    For JavaScript developers, I recommend checking out two books:


    - 1. ''Pro JavaScript Design Patterns'' by Ross Harmes and Dustin Diaz.

    - 2. ''JavaScript Patterns'' by Stoyan Stefanov


    If you''ve managed to absorb most of the information in my mini-book, I think
    you''ll find reading these the next logical step in your learning process (beyond
    trying out some pattern examples for yourself of course) : )


    Thanks for reading *Essential JavaScript & jQuery Design Patterns*. For more free
    learning material on JavaScript, jQuery and User-Interface Design, check out my
    official site over at http://addyosmani.com for my latest educational resources.


