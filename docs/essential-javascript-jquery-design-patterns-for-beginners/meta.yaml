  md: "The decorator pattern is used when you need to keeping adding new functionality\
    \ to overriden methods. This can be achieved by stacking multiple decorators on\
    \ top of one another.\n\nWhat is the main benefit of using a decorator pattern?\
    \ Well, if we examine our first definition, I mentioned that decorators are an\
    \ alternative to subclassing. When a script is being run, subclassing adds behaviour\
    \ that affects all the instances of the original class, whilst decorating does\
    \ not.\n\nIt instead can add new behaviour for individual objects, which can be\
    \ of benefit depending on the application in question.\n\nLet's take a look at\
    \ some code that implements the decorator pattern:\n\n```\n//The class we're going\
    \ to decorate\nfunction Macbook(){\n\tthis.cost = function(){\n\t\treturn 1000;\n\
    \t};\n}\n\nfunction Memory(macbook){\n\tthis.cost = function(){\n\t\treturn macbook.cost()\
    \ + 75;\n\t};\n}\n\nfunction BlurayDrive(macbook){\n\tthis.cost = function(){\n\
    \t\treturn macbook.cost() + 300;\n\t};\n}\n\nfunction Insurance(macbook){\n\t\
    this.cost = function(){\n\t\treturn macbook.cost() + 250;\n\t};\n}\n\n// Sample\
    \ usage\nvar myMacbook = new Insurance(new BlurayDrive(new Memory(new Macbook())));\n\
    console.log( myMacbook.cost() );\n```"
