    \n        //It returns a singleton instance of a singleton object\n        getInstance:\
    \ function (args){\n            if (instance === undefined) {\n              \
    \  instance = new Singleton(args);\n            }\n            return instance;\n\
    \        }\n    };\n    return _static;\n})();\n\nvar singletonTest = SingletonTester.getInstance({pointX:\n\
    5});\nconsole.log(singletonTest.pointX); // outputs 5\n```"
  - '[PAGE 18]


    # # The Module Pattern


    Let''s now look at the popular *module* pattern. The module pattern was defined
    as a way to provide both private and public encapsulation for the idea of JavaScript
    ''classes''. They work under the premise of a ''class'' actually being defined
    as a function (which we''ll refer to as a class for simplicity sakes).


    The parameters that you decide to use for this class are actually the parameters
    for the constructor. Both the local variables and functions defined inside your
    class become private members. The return method for your class (ie. still a function)
    returns an object that contains your public methods and variables.


    A piece of trivia is that the module pattern was originally formally defined by
    Douglas Crockford (famous for his book ''JavaScript: The Good Parts, and more),
    although it is likely that variations of this pattern were used long before this.
    Another piece of trviai is that if you''ve ever played with Yahoo''s YUI library,
    some of it''s features may appear quite familiar and the reason for this is that
    the module pattern was a strong influence for YUI when creating their components.


    So, you''ve seen why the singleton pattern can be useful, but why is the module
    pattern a good choice?.


    For starters, it''s a lot cleaner for developers coming from an object-oriented
    background than the idea of true encapsulation, at least from a JavaScript perspective.
    Secondly, it supports private data - so, in the module pattern, public parts of
    your code are able to touch the private parts, however the outside world is unable
    to touch the class''s private parts (no laughing!. oh, and thanks to David Engfer
    for the joke).


    The disadvantages of the module pattern is that as you access both public and
    private members differently, when you wish to change visibility, you actually
    have to make changes to each place the member was used.


    You also can''t access private members in methods that are added to the object
    at a later point. That said, in many cases the module pattern is still quite useful
    and when used correctly, certainly has the potential to improve the structure
    of your application.'
  - "[PAGE 19]\n\n```\nvar someModule = (function(){\n\n    //private attributes\n\
    \    var privateVar = 5;\n\n    //private methods\n    var privateMethod = function(){\n\
    \        return 'Private Test';\n    };\n\n    return {\n        //public attributes\n\
    \        publicVar    : 10,\n        //public methods\n        publicMethod :\
    \ function(){\n            return ' Followed By Public Test ';\n        },\n\n\
    \        //let's access the private members\n        getData : function(){\n \
    \           return privateMethod() + this.publicMethod() + privateVar;\n     \
    \   }\n    }\n})(); //the parens here cause the anonymous function to execute\
    \ and return\n\nsomeModule.getData();\n```\n\n# The Revealing Module Pattern\n\
    \nNow you're probably a little more familiar with what the Module pattern is.\
    \ Let's take a look at a slightly improved version - Christian Heilmann's Revealing\
    \ Module pattern, often described as a neat extension to a rather robust pattern.\
    \ The Revealing Module Pattern came about as Heilmann (now at Mozilla) was frustrated\
    \ with the fact that in you had to repeat the name of the main object when you\
    \ wanted to call one public method from another or access public variables."
  - "[PAGE 20]\n\nHe also disliked the Module pattern’s requirement for having to\
    \ switch to object literal notation for the things you wished to make public.\
    \ The result of his efforts were an updated pattern where you would simply define\
    \ all of your functions and variables in the private scope and return an anonymous\
    \ object at the end of the module along with pointers to both the private variables\
    \ and functions you wished to reveal as public.\n\nOnce again, you’re probably\
    \ wondering what the benefits of this approach are. The RMP allows the syntax\
    \ of your script to be fairly consistent - it also makes it very clear at the\
    \ end which of your functions and variables may be accessed publicly, something\
    \ that is quite useful. In addition, you are also able to reveal private functions\
    \ with more specific names if you wish.\n\nAn example of how to use the revealing\
    \ module pattern can be found below:\n\n```\n/*\n The idea here is that you have\
    \ private methods\n which you want to expose as public methods.\n\n What are are\
    \ doing below is effectively defining\n a self-executing function and immediately\
    \ returning\n the object.\n */\nvar myRevealingModule = function(){\n\n    var\
    \ name = 'John Smith';\n    var age = 40;\n\n    function updatePerson(){\n  \
    \      name = 'John Smith Updated';\n    }\n    function setPerson () {\n    \
    \    name = 'John Smith Set';\n    }\n    function getPerson () {\n        return\
    \ name;\n    }\n    return{\n        set: setPerson,\n        get: getPerson\n\
    \    }\n}();\n\n// Sample usage:\nmyRevealingModule.get();\n```"
- md: "## The Prototype Pattern\n\nThe prototype pattern is based on the concept of\
    \ prototypal inheritance where we create objects which act as prototypes for other\
    \ objects. The prototype object itself is effectively used a blueprint for each\
    \ object the constructor creates. If the prototype of the constructor function\
    \ used contains a property called 'name' for example (as per the code sample below),\
    \ then each object created by that same constructor will also have this same property.\n\
    \nLooking at the definitions for the prototype pattern in existing literature\
    \ non-specific to JavaScript, you *may* find references to concepts outside the\
    \ scope of the language such as classes. The reality is that prototypal inheritance\
    \ avoids using classes altogether. There isn't a 'definition' object nor a core\
    \ object in theory. We're simply creating copies of existing functional objects.\n\
    \nOne of the core benefits of using the prototype pattern is that we're working\
    \ with the strengths JavaScript has to offer natively rather than attempting to\
    \ imitate features of other languages (something a few design pattern implementations\
    \ do).\n\nNot only is this an easy way to implement inheritance, but this also\
    \ comes with a performance boost as well. When defining a function in an object,\
    \ they're all created by reference (so all child objects point to the same function)\
    \ instead of creating their own individual copies.\n\nFor those interested, real\
    \ prototypal inheritance, as defined in the ECMAScript 5 standard, requires the\
    \ use of Object.create which is a recent newly native method. Object.create creates\
    \ an object which has a specified prototype and which optionally contains specified\
    \ properties (i.e Object.create(prototype, optionalDescriptorObjects)).\n\nWe\
    \ can also see this being demonstrated in the example below:\n\n```\n// No need\
    \ for capitalization as it's not a constructor\nvar someCar = {\n  drive: function()\
    \ {};\n  name: 'Mazda 3'\n};\n\n// Use Object.create to generate a new car\nvar\
    \ anotherCar = Object.create(someCar);\nanotherCar.name = 'Toyota Camry';\n```\n\
    \n## The DRY Pattern\n\n**Disclaimer:** DRY is essentially a way of thinking and\
    \ many patterns aim to achieve a level of DRY-ness with their design. In this\
    \ section we'll be covering what it means for code to be DRY but also covering\
    \ the DRY design pattern based on these same concepts.\n\nA challenge that developers\
    \ writing large applications frequently have is writing similar code multiple\
    \ times. Sometimes this occurs because your script or application may have multiple\
    \ similar ways of performing something.\n\nRepetitive code writing generally reduces\
    \ productivity and leaves you open to having to re-write code you've already written\
    \ similar times before, thus leaving you with less time to add in new functionality.\n\
    \nDRY (don't repeat yourself) was created to simplify this - it's based on the\
    \ idea that each part of your code should ideally only have one representation\
    \ of each piece of knowledge in it that applies to your system.\n\nThe key concept\
    \ to take away here is that if you have code that performs a specific task, you\
    \ shouldn't write that code multiple times through your applications or scripts.\n\
    \nWhen DRY is applied successfully, the modification of any element in the system\
    \ doesn't change other logically-unrelated elements. Elements in your code that\
    \ are logically related change uniformly and are thus kept in sync.\n\nAs other\
    \ patterns covered display aspects of DRY-ness with JavaScript, let's take a look\
    \ at how to write DRY code using jQuery. Note that where jQuery is used, you can\
    \ easily substitute selections using vanilla JavaScript because jQuery is just\
    \ JavaScript at an abstracted level.\n\n### Non-DRY\n\n```\n/*Let's store some\
    \ default values in an array*/\nvar defaultSettings = {};\ndefaultSettings['carModel']\
    \     = 'Mercedes';\ndefaultSettings['carYear']      = 2010;\ndefaultSettings['carMiles']\
    \     = 5000;\ndefaultSettings['carTint']      = 'Metallic Blue';\n```\n\nLet's\
    \ do something with this data if a checkbox is clicked:\n\n```\n$('.someCheckbox').click(function(){\n\
    \n    if (this.checked)\n    {\n            $('#input_carModel').val(activeSettings.carModel);\n\
    \            $('#input_carYear').val(activeSettings.carYear);\n            $('#input_carMiles').val(activeSettings.carMiles);\n\
    \            $('#carTint').val(activeSettings.carTint);\n\n    } else {\n\n  \
    \          $('#input_carModel').val('');\n            $('#input_carYear').val('');\n\
    \            $('#input_carMiles').val('');\n            $('#input_carTint').val('');\n\
    \n    }\n});\n```\n\n### DRY\n\n```\n$('.someCheckbox').click(function(){\n  \
    \  var checked = this.checked;\n    /*\n       What are we repeating?\n      \
    \ 1. input_ precedes each field name\n       2. accessing the same array for settings\n\
    \       3. repeating value resets\n\n       What can we do?\n       1. programmatically\
    \ generate the field names\n       2. access array by key\n       3. merge this\
    \ call using terse coding (ie. if checked,\n              set a value, otherwise\
    \ don't)\n    */\n        $.each(['carModel', 'carYear', 'carMiles', 'carTint'],\
    \ function(i,key){\n                $('#input_' + key).val(checked ? defaultSettings[key]\
    \ : '');\n        });\n});\n```\n\n## The Facade Pattern\n\nThis pattern both\
    \ simplifies the interface of a class and it also decouples the class from the\
    \ code that utilizes it. Facades are often considered an essential part of a developer's\
    \ pattern toolkit - they can make library utilities significantly easier to understand\
    \ by creating convenience routines that simplify the use of complex systems.\n\
    \nAn example of where the Facade pattern can be found is in the creation of uniform\
    \ JavaScript APIs which often seek to provide consistent experiences across all\
    \ browsers. Facades provide us with an ability to indirectly interact with subsystems\
    \ in a way that may be less prone to error than accessing the subsystem directly.\n\
    \nFacade's advantages include ease of use and often a small size-footprint in\
    \ implementing the pattern. It does however have some pitfalls - Facade is inefficient\
    \ when used consecutively and each time it's called a new check must be made to\
    \ determine the features available for attaching event listeners. Let's take a\
    \ look at the pattern in action:\n\nThis is an unoptimized code example but here\
    \ we utilize Facade to simplify an interface for attaching events.\n\nWe do this\
    \ by creating a common method that can be used in one's code which does the task\
    \ of checking for the existence of features so that it can provide a safe and\
    \ cross-browser compatible solution.\n\n```\nvar addMyEvent = function(el,ev,fn){\n\
    \n    if(el.addEventListener){\n        el.addEventListener(ev,fn, false);\n \
    \   }else if(el.attachEvent){\n        el.attachEvent('on'+ev, fn);\n    } else{\n\
    \        el['on' + ev] = fn;\n    }\n\n};\n```\n\n## The Factory Pattern\n\nSimilar\
    \ to other creational patterns, the Factory Pattern deals with the problem of\
    \ creating objects (which we can think of as 'factory products') without the need\
    \ to specify the exact class of object being created.\n\nSpecifically, the Factory\
    \ Pattern suggests defining an interface for creating an object where you allow\
    \ the subclasses to decide which class to instantiate. This pattern handles the\
    \ problem by defining a completely separate method for the creation of objects\
    \ and which sub-classes are able to override so they can specify the 'type' of\
    \ factory product that will be created.\n\nThis can come in quite useful, in particular\
    \ if the creation process involved is quite complex. eg. if it strongly depends\
    \ on the settings in configuration files. You can often find factory methods in\
    \ frameworks where the code for a library may need to create objects of particular\
    \ types which may be subclassed by scripts using the frameworks.\n\nIn our example,\
    \ let's take the code used in the original Constructor pattern example and see\
    \ what this would look like were we to optimize it using the Factory Pattern:\n\
    \n```\nvar Car = (function() {\n    var Car = function (model, year, miles){\n\
    \        this.model = model;\n        this.year   = year;\n        this.miles\
    \ = miles;\n    };\n    return function (model, year, miles) {\n        return\
    \ new Car(model, year, miles);\n    }\n})();\n\nvar civic = new Car(\"Honda Civic\"\
    , 2009, 20000);\nvar mondeo = new Car(\"Ford Mondeo\", 2010, 5000);\n```\n\n##\
    \ The Decorator Pattern\n\nDecorator patterns are an alternative to creating subclasses.\
    \ This pattern can be used to wrap objects within another object of the same interface\
    \ and allows you to both add behaviour to methods and also pass the method call\
    \ to the original object (ie the constructor of the decorator)."
  mdcn: "\n## 原型模式\n\n原型模式基于原型继承的概念，我们创建对象并使其作为其他对象的原型。原型对象本身实际上被用作构造函数创建的每个对象的蓝图。如果使用的构造函数的原型包含一个名为“name”的属性（如下面的代码示例所示），那么由同一构造函数创建的每个对象也将具有相同的属性。\n\
    \n查看现有文献（非JavaScript特定）中关于原型模式的定义，你*可能*会找到一些超出该语言范围的概念引用，例如类。现实是，原型继承完全避免了使用类。理论上，不存在“定义”对象或核心对象。我们只是创建现有功能对象的副本。\n\
    \n使用原型模式的核心优势之一在于，我们利用JavaScript原生提供的优势，而不是试图模仿其他语言的特性（某些设计模式的实现会这样做）。\n\n这不仅是一种实现继承的简便方法，还能带来性能提升。在对象中定义函数时，它们都是通过引用创建的（因此所有子对象指向同一个函数），而不是创建各自的独立副本。\n\
    \n对于感兴趣的人来说，如ECMAScript 5标准中定义的真正原型继承，需要使用`Object.create`，这是一个相对较新的原生方法。`Object.create`创建一个具有指定原型的对象，该对象可包含指定的属性（即`Object.create(prototype,\
    \ optionalDescriptorObjects)`）。\n\n我们也可以在下面的示例中看到这一点：\n\n```\n// 无需大写，因为它不是构造函数\n\
    var someCar = {\n  drive: function() {};\n  name: 'Mazda 3'\n};\n\n// 使用Object.create生成一辆新车\n\
    var anotherCar = Object.create(someCar);\nanotherCar.name = 'Toyota Camry';\n\
    ```\n\n## DRY原则\n\n**免责声明：** DRY本质上是一种思维方式，许多模式旨在通过其设计达到一定程度的DRY。在本节中，我们将探讨代码的DRY含义，同时也将介绍基于相同概念的DRY设计模式。\n\
    \n开发大型应用程序时，开发者经常面临的挑战之一是多次编写相似的代码。有时这发生是因为你的脚本或应用程序可能有多种类似的方式来执行某项操作。\n\n重复编写代码通常会降低生产力，并使你不得不重写之前已经编写过的类似代码，从而减少你添加新功能的时间。\n\
    \nDRY（Don't Repeat Yourself，不要重复自己）的创建正是为了简化这一点——它基于这样一种理念：你的代码的每个部分理想情况下只应包含系统相关知识的每种表示一次。\n\
    \n这里要掌握的关键概念是，如果你有一段执行特定任务的代码，你不应该在你的应用程序或脚本中多次编写该代码。\n\n当DRY成功应用时，修改系统中的任何元素不会改变其他逻辑上不相关的元素。你代码中逻辑相关的元素会统一改变，从而保持同步。\n\
    \n由于前面介绍的其他模式展示了JavaScript中DRY的方面，让我们看看如何使用jQuery编写DRY代码。请注意，在使用jQuery的地方，你可以轻松地使用原生JavaScript替换选择器，因为jQuery在抽象层面上就是JavaScript。\n\
    \n### 非DRY\n\n```\n/*让我们在数组中存储一些默认值*/\nvar defaultSettings = {};\ndefaultSettings['carModel']\
    \     = 'Mercedes';\ndefaultSettings['carYear']      = 2010;\ndefaultSettings['carMiles']\
    \     = 5000;\ndefaultSettings['carTint']      = 'Metallic Blue';\n```\n\n如果一个复选框被点击，我们来处理这些数据：\n\
    \n```\n$('.someCheckbox').click(function(){\n\n    if (this.checked)\n    {\n\
    \            $('#input_carModel').val(activeSettings.carModel);\n            $('#input_carYear').val(activeSettings.carYear);\n\
    \            $('#input_carMiles').val(activeSettings.carMiles);\n            $('#carTint').val(activeSettings.carTint);\n\
    \n    } else {\n\n            $('#input_carModel').val('');\n            $('#input_carYear').val('');\n\
    \            $('#input_carMiles').val('');\n            $('#input_carTint').val('');\n\
    \n    }\n});\n```\n\n### DRY\n\n```\n$('.someCheckbox').click(function(){\n  \
    \  var checked = this.checked;\n    /*\n       我们在重复什么？\n       1. input_ 前缀每个字段名\n\
    \       2. 访问同一个设置数组\n       3. 重复重置值\n\n       我们能做什么？\n       1. 以编程方式生成字段名\n\
    \       2. 通过键访问数组\n       3. 使用简洁的代码合并此调用（即如果checked，\n              设置一个值，否则不设置）\n\
    \    */\n        $.each(['carModel', 'carYear', 'carMiles', 'carTint'], function(i,key){\n\
    \                $('#input_' + key).val(checked ? defaultSettings[key] : '');\n\
    \        });\n});\n```\n\n## 外观模式\n\n此模式既简化了类的接口，也将类与其使用的代码解耦。外观模式通常被认为是开发者模式工具包中的重要组成部分——它们可以通过创建便捷的例程来简化复杂系统的使用，从而使库工具更容易理解。\n\
    \n外观模式的一个例子是在创建统一的JavaScript API中常见，这些API通常旨在所有浏览器中提供一致的体验。外观模式为我们提供了一种间接与子系统交互的能力，这种方式可能比直接访问子系统更不容易出错。\n\
    \n外观模式的优点包括易于使用，并且通常在实现时占用较小的内存空间。然而，它也有一些陷阱——当连续使用外观模式时效率较低，并且每次调用都必须进行新的检查以确定可用于附加事件监听器的功能。让我们来看看该模式的实际应用：\n\
    \n这是一个未经优化的代码示例，但在这里我们利用外观模式来简化附加事件的接口。\n\n我们通过创建一个通用方法来实现这一点，该方法可以在代码中使用，用于检查功能的存在，从而提供安全且跨浏览器兼容的解决方案。\n\
    \n```\nvar addMyEvent = function(el,ev,fn){\n\n    if(el.addEventListener){\n\
    \        el.addEventListener(ev,fn, false);\n    }else if(el.attachEvent){\n \
    \       el.attachEvent('on'+ev, fn);\n    } else{\n        el['on' + ev] = fn;\n\
    \    }\n\n};\n```\n\n## 工厂模式\n\n与其他创建型模式类似，工厂模式处理创建对象（我们可以将其视为“工厂产品”）的问题，而无需指定要创建的对象的确切类。\n\
    \n具体来说，工厂模式建议定义一个创建对象的接口，其中允许子类决定实例化哪个类。此模式通过定义一个完全独立的方法来处理对象的创建，子类可以覆盖该方法，从而指定将要创建的“工厂产品”的“类型”。\n\
    \n这在创建过程相当复杂时尤其有用，例如，它强烈依赖于配置文件中的设置。你经常可以在框架中找到工厂方法，其中库的代码可能需要创建特定类型的对象，这些对象可能由使用框架的脚本进行子类化。\n\
    \n在我们的示例中，让我们使用原始构造函数模式示例中的代码，看看如果使用工厂模式进行优化会是什么样子：\n\n```\nvar Car = (function()\
    \ {\n    var Car = function (model, year, miles){\n        this.model = model;\n\
    \        this.year   = year;\n        this.miles = miles;\n    };\n    return\
    \ function (model, year, miles) {\n        return new Car(model, year, miles);\n\
    \    }\n})();\n\nvar civic = new Car(\"Honda Civic\", 2009, 20000);\nvar mondeo\
    \ = new Car(\"Ford Mondeo\", 2010, 5000);\n```\n\n## 装饰器模式\n\n装饰器模式是创建子类的替代方案。此模式可用于将对象包装在另一个具有相同接口的对象中，允许你既向方法添加行为，又将方法调用传递给原始对象（即装饰器的构造函数）。\n"
