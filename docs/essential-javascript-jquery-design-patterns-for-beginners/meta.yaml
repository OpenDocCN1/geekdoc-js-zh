  md: "He also disliked the Module pattern’s requirement for having to switch to object\
    \ literal notation for the things you wished to make public. The result of his\
    \ efforts were an updated pattern where you would simply define all of your functions\
    \ and variables in the private scope and return an anonymous object at the end\
    \ of the module along with pointers to both the private variables and functions\
    \ you wished to reveal as public.\n\nOnce again, you’re probably wondering what\
    \ the benefits of this approach are. The RMP allows the syntax of your script\
    \ to be fairly consistent - it also makes it very clear at the end which of your\
    \ functions and variables may be accessed publicly, something that is quite useful.\
    \ In addition, you are also able to reveal private functions with more specific\
    \ names if you wish.\n\nAn example of how to use the revealing module pattern\
    \ can be found below:\n\n```\n/*\n The idea here is that you have private methods\n\
    \ which you want to expose as public methods.\n\n What are are doing below is\
    \ effectively defining\n a self-executing function and immediately returning\n\
    \ the object.\n */\nvar myRevealingModule = function(){\n\n    var name = 'John\
    \ Smith';\n    var age = 40;\n\n    function updatePerson(){\n        name = 'John\
    \ Smith Updated';\n    }\n    function setPerson () {\n        name = 'John Smith\
    \ Set';\n    }\n    function getPerson () {\n        return name;\n    }\n   \
    \ return{\n        set: setPerson,\n        get: getPerson\n    }\n}();\n\n//\
    \ Sample usage:\nmyRevealingModule.get();\n```"
