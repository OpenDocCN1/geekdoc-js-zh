  md: "# The Wrapper Pattern\n\nThe **Wrapper Pattern** is a pattern which translates\
    \ an *interface* for a class into a compatible interface. Wrappers basically allow\
    \ classes to function together which normally couldn't due to their incompatible\
    \ interfaces. The wrapper translates calls to it's interface into calls to the\
    \ original interface and the code required to achieve this is usually quite minimal.\n\
    \n```\n$('.container').css({\n        opacity: .5 //apply opacity in modern browsers\
    \ (eg. Chrome, FireFox) but use filter for IE\n    });\n```\n\n# The Facade Pattern\n\
    \nThe **Facade Pattern** is quite commonly used with OOP (Object-oriented programming)\
    \ where a facade is an object which provides a simpler interface to a larger piece\
    \ of code (eg. a class library). Facades can be frequently found across the jQuery\
    \ library and make methods both easier to use and understand, but also more readable.\
    \ The following are facades for jQuery's $.ajax():\n\n```\n$.get();\n$.post();\n\
    $.getJSON();\n$.getScript();\n```\n\n# The Observer pattern\n\nThe **Observer\
    \ pattern** is where a subject (the object), keeps a list of it's dependants,\
    \ which are known as observers, and notifies them automatically of any changes\
    \ in state. This is commonly done by calling one of their methods. The Observer\
    \ pattern can be considered a subset of PubSub (publish/subscribe pattern).\n\n\
    ```\n//Here jQuery makes use of it's event system on top of DOM events\n$('.button').click(function(){})\n\
    $('.button').trigger('click', function(){})\n```"
  merge: -1
  pgno: 28
