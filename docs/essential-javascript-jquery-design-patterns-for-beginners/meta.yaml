  md: "# Design Patterns in jQuery\n\nNow that we've taken a look at vanilla-JavaScript\
    \ implementations of popular design patterns, let's switch gears and find out\
    \ what of these design patterns might look like when implemented using jQuery.\
    \ jQuery (as you may know) is currently the most popular JavaScript library and\
    \ provides a layer of 'sugar' on top of regular JavaScript with a syntax that\
    \ can be easier to understand at a glance.\nBefore we dive into this section,\
    \ it's important to remember that many vanilla-JavaScript design patterns can\
    \ be intermixed with jQuery when used correctly because jQuery is still essentially\
    \ JavaScript itself.\n\njQuery is an interesting topic to discuss in the realm\
    \ of patterns because the library actually uses a number of design patterns itself.\
    \ What impresses me is just how cleanly all of the patterns it uses have been\
    \ implemented so that they exist in harmony.\nLet's take a look at what some of\
    \ these patterns are and how they are used.\n\n# Lazy Initialization\n\n**Lazy\
    \ Initialization** is a design pattern where you employ a tactic of delaying any\
    \ expensive processes (eg. the creation of objects) until the first instance they\
    \ are needed. An example of this is the .ready() function in jQuery that only\
    \ executes a function once the DOM has fully loaded.\n\n```\n$(document).ready(function(){\n\
    \    $('#content').fadeIn();\n});\n```\n\n# The Composite Pattern\n\n**The Composite\
    \ Pattern** describes a group of objects that can be treated in the same way a\
    \ single instance of an object can. Implementing this pattern allows you to treat\
    \ both individual objects and compositions in a uniform manner. In jQuery, when\
    \ we're accessing or performing actions on a single DOM element or a group of\
    \ DOM elements, we can treat both in a uniform manner. This is demonstrated by\
    \ the code sample below:\n\n```\n$('#someDiv').addClass('active'); // a single\
    \ element\n$('div').addClass('active');       // a collection of elements\n```"
  merge: -1
  pgno: 27
