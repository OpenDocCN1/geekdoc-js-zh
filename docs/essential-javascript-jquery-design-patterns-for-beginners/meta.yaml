  md: '# # What is a Pattern?


    A pattern is a reusable solution that can be applied to commonly occurring problems
    in software design - in our particular case, in writing JavaScript applications.
    Another way of looking at patterns are as templates for how you solve problems
    - ones which can be used in quite a few different situations. To consider how
    useful a pattern may be, let us consider that if you were to write a script where
    you said ''for each item, sound an alert'', if sounding an alert was complex in
    nature, it would always result in more maintainable code doing the above over
    saying ''do this for item 1'', ''do this for item 2'', ''do the same again for
    item 3'', i.e. If the code performing the bulk of the work exists in fewer places
    it becomes significantly easier to maintain.


    You may ask why it''s important to understand patterns and be familiar with them.
    Design patterns have three main benefits.


    +   1. **Patterns are proven solutions:** They provide solid approaches to solving
    issues in software development using proven solutions that reflect the experience
    and insights the developers that helped define and improve them bring to the pattern

    2. **Patterns can be easily re-used:** A pattern usually reflects an out of the
    box solution that can be adapted to suit your own needs. This feature makes them
    quite robust.

    3. **Patterns can be expressive:** When you look at a pattern there''s generally
    a set structure and ''vocabulary'' to the solution presented that can help express
    rather large solutions quite elegantly.


    Patterns are **not** an exact solution. It''s important that we remember the role
    of a pattern is merely to provide us with a solution scheme. Patterns don''t solve
    all design problems nor do they replace good software designers, however, they
    **do** support them. Next we''ll take a look at some of the other advantages patterns
    can offer us.


    +   - **Reusing patterns assists in preventing minor issues that can cause major
    problems in the application development process.** What this means is that when
    your code relies more on proven patterns, you can afford to spend less time worrying
    about your code architecture and more time focusing on the quality of your overall
    solution. This is because patterns can encourage you to code in a more structured
    and organized fashion so the need to refactor it for cleanliness purposes in the
    future can be significantly decreased.

    - **Patterns can provide generalized solutions which are documented in a fashion
    that doesn''t require them to be tied to a specific problem.** This generalized
    approach means that regardless of the application (and in many cases the programming
    language) you are working with, design patterns can be applied to improve the
    structure of your code.'
  merge: -1
  pgno: 4
- img_proc: true
  md: '+   - **Certain patterns can actually decrease the overall file-size footprint
    of your code by avoiding repetition.** By encouraging developers to look more
    closely at their solutions for areas where instant reductions in repetition can
    be made, e.g. reducing the number of functions performing similar processes in
    favor of a single generalized function, the overall size of your codebase can
    be decreased.

    - **Patterns that are frequently** used can be improved over time by harnessing
    the collective experiences other developers using those patterns contribute back
    to the design pattern community. In some cases this leads to the creation of entirely
    new design patterns whilst in others it can lead to the provision of improved
    guidelines on how specific patterns can be best used. This can ensure that pattern-based
    solutions continue to become more robust than ad-hoc solutions may be.


    # # ''Pattern''-ity Testing, Proto-Patterns & The Rule Of Three


    Remember that not every algorithm, best practice or solution represents what might
    be considered a complete pattern. There may be a few key ingredients here that
    are missing and the pattern community is generally weary of something claiming
    to be one unless it has been heavily vetted. Even if something is presented to
    us which *appears* to meet the criteria for a pattern, it should not be considered
    one until it has undergone suitable periods of scrutiny and testing by others.


    Looking back upon the work by Alexander once more, he claims that a pattern should
    both be a process and a ''thing''. This definition is obtuse on purpose as he
    follows by saying that the process should create the ''thing''. This is a reason
    why patterns generally focus on addressing a visually identifiable structure i.e
    you should be able to visually depict (or draw) a picture representing the structure
    that putting the pattern into practice results in.


    In studying design patterns, you may come across the term ''proto-pattern'' quite
    frequently. What is this? Well, a pattern that has not yet been known to pass
    the ''pattern''-ity tests is usually referred to as a proto-pattern. Proto-patterns
    may result from the work of someone that has established a particular solution
    is worthy of sharing with the community, but may not have yet had the opportunity
    to have been vetted heavily due to it''s very young age.


    Alternatively, the individual(s) sharing the pattern may not have the time or
    interest of going through the ''pattern''-ity process and might release a short
    description of their proto-pattern instead. Brief descriptions of this type of
    pattern are known as patlets.'
