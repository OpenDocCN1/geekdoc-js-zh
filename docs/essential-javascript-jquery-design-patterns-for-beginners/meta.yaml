    # Design Patterns In JavaScript


    Next we’re going to take a look at 10 popular design patterns that I’ve personally
    found very useful to apply in JavaScript applications over the years.


    Note that there is no ‘ideal’ pattern to use from this selection as developers
    often use best judgment when deciding on the pattern, which is the best ‘fit’
    for their needs.


    Each pattern varies in complexity, however I have tried to keep my explanations
    as simple as possible so that both beginners and intermediate developers can benefit
    from the material.'
