  md: '# # Creational Design Patterns


    Creational design patterns focus on handling object creation mechanisms where
    objects are created in a manner suitable for the situation you are working in.
    The basic approach to object creation might otherwise lead to added complexity
    in a project whilst creational patterns aim to solve this problem by *controlling*
    the creation of such objects.


    Some of the patterns that fall under this category are: Factory, Abstract, Prototype,
    Singleton and Builder.


    # # Structural Design Patterns


    Structural patterns focus on the composition of classes and objects. Structural
    ‘class’ creation patterns use inheritance to compose interfaces whilst ‘object’
    patterns define methods to create objects to obtain new functionality.


    Patterns that fall under this category include: Decorator, Facade, Composite,
    Adapter and Bridge


    # # Behavioral Design Patterns


    The main focus behind this category of patterns is the communication between a
    class’s objects. By specifically targeting this problem, these patterns are able
    to increase the flexibility in carrying out this communication.


    Some behavioral patterns include: Iterator, Mediator, Observer and Visitor.


    # # Summary Table Of Design Pattern Categorization


    In my early experiences of learning about design patterns, I personally found
    the following table a very useful reminder of what a number of patterns has to
    offer - it covers the 23 Design Patterns mentioned by the GoF. The original table
    was summarized by Elyse Nielsen back in 2004 and I’ve modified it where necessary
    to suit our discussion in this section of the book.


    I recommending using this table as reference, but do remember that there are a
    number of additional patterns that are not mentioned on this table but will be
    discussed later in the book. That said, it’s a great starting point for learning.'
