  mdcn: "\n\n## JavaScript 构造函数\n\n# 188: JavaScript 构造函数的作用是什么？\n\n答案：\n\n构造函数初始化新创建的对象，并在该对象在使用之前设置需要设置的属性。你可以通过编写一个向\
    \ `this` 运算符添加属性的函数，来轻松地定义一个构造函数。\n\n示例：\n\n```javascript\n// 定义构造函数\nfunction\
