    Then, explain in a clear and thorough manner how this lesson has translated into
    a usable skill or practice in your position.


    # 21: Tell me about a time when you developed a project idea at work.


    Answer:


    Choose a project idea that you developed that was typical of projects you might
    complete in the new position. Outline where your idea came from, the type of research
    you did to ensure its success and relevancy, steps that were included in the project,
    and the end results. Offer specific before and after statistics, to show its success.


    # 22: Tell me about a time when you took a risk on a project.


    Answer:


    Whether the risk involved something as complex as taking on a major project with
    limited resources or time, or simply volunteering for a task that was outside
    your field of experience, show that you are willing to stretch out of your comfort
    zone and to try new things. Offer specific examples of why something you did was
    risky, and explain what you learned in the process – or how this prepared you
    for a job objective you later faced in your career.


    # 23: What would you tell someone who was looking to get into this field?


    Answer:


    This question allows you to be the expert – and will show the interviewer that
    you have the knowledge and experience to go along with any training and education
    on your resume. Offer your knowledge as advice on unexpected things someone entering
    the field may encounter, and be sure to end with positive advice such as the passion
    or dedication to the work that is required to truly succeed.


    # 24: Why did you choose your college major?


    Answer:


    It''s important to display interest in your work, and if your major is related
    to your current field, it will be simple for you to relate the two. Perhaps you
    even knew while in college that you wanted to do a job similar to this position,
    and so you chose the major so to receive the education and training you needed
    to succeed. If your major doesn''t relate clearly, it''s still important to express
    a sense of passion for your choice, and to specify the importance of pursuing
    something that matters to you – which is how you made the decision to come to
    your current career field.


    # 25: Tell me about your college experience.


    Answer:


    It''s best to keep this answer positive – don''t focus on parties, pizza, or procrastinating.
    Instead, offer a general summary of the benefits you received in college, followed
    by an anecdote of a favorite professor or course that opened up your way of thinking.


    # 26: What is the most unique thing about yourself that you would bring to this
    position?


    Answer:


    This question is often asked as a close to an interview, and it gives you a final
    chance to highlight your best qualities to the employer. Treat the question like
    a sort of review, and explain why your specific mix of education, experience,
    and passions will be the ideal combination. Remain confident but humble, and keep
    your answer about two minutes.


    # 27: How did your last job stand up to your expectations?


    Answer:


    While it''s okay to discuss what you learned if you expected much out of a previous
    job, it''s best to keep this question away from negative statements or portrayals.
    Focus your answer around what your previous job held and how much you enjoyed
    those aspects.


    # 28: How did you become interested in this field?


    Answer:


    This is the chance for you to show your passion for your career – and the interviewer
    will be assured that you are a great candidate if it''s obvious that you enjoy
    your job. You can include a brief anecdote here in order to make your personal
    interest, but be sure that it is brief. Offer specific names of mentors or professors
    who aided in your discovery, and make it clear that you love what you do.


    # 29: What was the greatest thing you learned while in school?


    Answer:


    By offering a lesson you learned outside of the classroom, you can show the interviewer
    your capacity for creativity, learning, and reflection. The practical lessons
    you learned in the classroom are certainly invaluable in their own right and may
    pertain closely to the position, but showing the mastery of a concept that you
    had to learn on your own will highlight your growth potential.


    # 30: Tell me about a time when you had to learn a different skill set for a new
    position.


    Answer:


    Use a specific example to describe what you had to learn and how you set about
    outlining goals and tasks for yourself. It''s important to show that you mastered
    the skill largely from your dedication to learning it, and because of the systematic
    approach you took to developing and honing your individual education. Additionally,
    draw connections between the skill you learned and the new position, and show
    how well prepared you are for the job.

