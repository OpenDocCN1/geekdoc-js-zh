    # 188: What does a JavaScript constructor do?


    Answer:


    The constructor initializes the newly created object and sets any properties that
    need to be set before that object is used. You can easily define a constructor
    function, by writing a function that adds properties to “this” operator.


    Example:


    ```

    // define the constructor

    function circle(r){

    this.radius = r;

    }

    //invoke the constructor to create a circle object:

    var circle1 = new circle(3); // we pass the radius value to the constructor so
    that it will initialize the new object appropriately.

    ```


    # 189: What is the value that the constructor function returns?


    Answer:


    Typically, the constructor does not return any values. They simply initialize
    the object passed as the value of “this” operator and return nothing. Anyway,
    the constructor can return an object value, but in this case the returned object
    becomes the value of the “new” expression and the object that was the value of
    this is simply not taken into account.


    # 190: How many types of common object methods can we find in JavaScript?


    Answer:


    We have three types of object methods: the toString| |() method; the valueOf()
    method and comparison method.


    # 191: How does class hierarchy manifest themselves in JavaScript?


    Answer:


    Java and C++ have an explicit concept of the class hierarchy; so any class can
    be extended or sub-classed so that subclass that results can be inherited. JavaScript
    supports prototype inheritance'
