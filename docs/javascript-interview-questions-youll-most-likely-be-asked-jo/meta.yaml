- md: "\n## JavaScript Constructors\n\n# 188: What does a JavaScript constructor do?\n\
    \nAnswer:\n\nThe constructor initializes the newly created object and sets any\
    \ properties that need to be set before that object is used. You can easily define\
    \ a constructor function, by writing a function that adds properties to “this”\
    \ operator.\n\nExample:\n\n```javascript\n// define the constructor\nfunction\
    \ circle(r){\n  this.radius = r;\n}\n// invoke the constructor to create a circle\
    \ object:\nvar circle1 = new circle(3); // we pass the radius value to the constructor\
    \ so that it will initialize the new object appropriately.\n```\n\n# 189: What\
    \ is the value that the constructor function returns?\n\nAnswer:\n\nTypically,\
    \ the constructor does not return any values. They simply initialize the object\
    \ passed as the value of “this” operator and return nothing. Anyway, the constructor\
    \ can return an object value, but in this case the returned object becomes the\
    \ value of the “new” expression and the object that was the value of this is simply\
    \ not taken into account.\n\n# 190: How many types of common object methods can\
    \ we find in JavaScript?\n\nAnswer:\n\nWe have three types of object methods:\
    \ the toString() method; the valueOf() method and comparison method.\n\n# 191:\
    \ How does class hierarchy manifest themselves in JavaScript?\n\nAnswer:\n\nJava\
    \ and C++ have an explicit concept of the class hierarchy; so any class can be\
    \ extended or sub-classed so that subclass that results can be inherited. JavaScript\
    \ supports prototype inheritance instead of class-based inheritance the Object\
    \ class is the most generic with all other classes as specialized versions of\
    \ it or subclasses.\n\n## JavaScript Interview Questions You'll Most Likely Be\
    \ Asked\n\n# 192: What does “overriding method” mean?\n\nAnswer:\n\nIf a subclass\
    \ defines a method that has the same name as the method in the superclass it is\
    \ called overriding that method. This is a common thing to do when creating subclasses\
    \ of existing classes. For example when toString() method is defined, the toString()\
    \ method of Object is overridden.\n\n# 193: How can you create an XML document\
    \ in Firefox using JavaScript?\n\nAnswer:\n\nWe can create an empty XML Document\
    \ in Firefox and related browsers with document.implementation.createDocument()\
    \ which is a DOM Level 2 method.\n\n# 194: How are images accessed from JavaScript?\n\
    \nAnswer:\n\nImages can be referred using document.images[0] // for the first\
    \ images, document.images[1] and so for the next images. Once the image is accessed,\
    \ you can perform different tasks on them.\n\n# 195: Where is the arguments()\
    \ array placed in JavaScript?\n\nAnswer:\n\nIt is placed and defined only within\
    \ a function body. Within the arguments of a body arguments refers to Arguments\
    \ for the function.\n\n# 196: Which are the properties of the arguments object\
    \ in JavaScript?\n\nAnswer:\n\nThe properties of the arguments object are callee\
    \ and length. All values that are passed as arguments become array elements of\
    \ the arguments object.\n\n# 197: What happens when a function is invoked with\
    \ the arguments object?\n\nAnswer:\n\nArguments object is created for it and the\
    \ local variable arguments are initialized to refer to that arguments object.\n\
    \n## Miscellaneous Arguments, Functions and Methods in JavaScript\n\n# 198: What\
    \ does arguments.callee do in JavaScript?\n\nAnswer:\n\nThe arguments.callee refers\
    \ to the currently running function and it provides a way for an unnamed function\
    \ to refer to itself.\n\n# 199: What does arguments.length do in JavaScript?\n\
    \nAnswer:\n\nThe arguments.length specifies the number of arguments that are passed\
    \ to the current function; it only specifies the number of arguments actually\
    \ passed and not the expected number.\n\n# 200: What other JavaScript method you\
    \ know that is similar with shift() method?\n\nAnswer:\n\nOther method similar\
    \ with shift() is Array.pop(), the only exception is that it operates on the beginning\
    \ of an array rather than the end.\n\n# 201: How can you remove a page from the\
    \ browser history?\n\nAnswer:\n\nIf the programmer wants to remove the current\
    \ page from the browser history, it can simply use location.replace() method.\
    \ Invoking this method causes the browser to request a page through a GET method\
