- img_proc: true
  md: '# 10: How do you terminate statements in JavaScript?


    Answer:


    In JavaScript, statements are terminated by semicolons (;) although they are not
    mandatory they are a good practice to pick up.


    # 11: Why are comments used in JavaScript and how are they inserted?


    Answer:


    Usually comments are added to make the code more readable they can also be used
    to explain the code. They are inserted with // (for single line comments) and
    /* */ for multiple lines comments.


    # 12: What are variables and how are they inserted?


    Answer:


    Variables are storing containers used for holding expressions and values. They
    can have a short letter or a longer name and are inserted with the statement:
    var. Because the variables are loosely typed, they can hold any type of data.


    # 13: What does a variable of y=10; and var catname= "Tomcat"; do?


    Answer:


    With the execution of the above code, we have variables that hold values of 10(for
    y) and Tomcat (for catname). Note that the inclusion of text warrants " " being
    used.


    # 14: How many statements types can we find in JavaScript? Give some examples?


    Answer:


    The statement types found in JavaScript are: Expression statements, compound,
    empty and labeled statements. Example: break, continue, default, for, for, etc.


    # 15: What are conditional statements and how are they implemented in JavaScript?'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# JavaScript Interview Questions You''ll Most Likely Be Asked


    Answer:

    Conditional statements are used to perform and act on different sets of conditions
    declared by the programmer. They are the following: if statement; if...else statement;
    if...else if...else statement and the switch statement.


    # 16: How will you determine a variable type in JavaScript?


    Answer:

    A variable type in JavaScript is determined using Typeof operator. When the object
    is String, Number, Function, undefined and Boolean, the operator returns the same
    type. And when the object is null and array, the operator returns “object”.

    Example:


    ```

    var count=100;

    typeof count; → (returns “number”)

    ```


    # 17: What is the difference in evaluating “8+5+2] and [8+5+“2”]?


    Answer:

    In“8+5+2],”8” is a String. So anything that trail the string will be changed to
    string. Hence the result will be“852”.

    In[8+5+“2”], 8 and 5 are integer, so it gets added up (13).And “2” is treated
    as String. The concatenation takes place and the result will be “132”.


    # 18: Is it possible to assign a string to a floating point variable?


    Answer:

    Yes. Any variable can be assigned to another data type. For example,


    ```

    var a1=10.39;

    document.write(a1); → 10.39

    a1=”hai”;

    document.write(a1); → hai

    ```


    # 19: Will variable redeclaration affect the value of that variable?


    Answer:

    No. The same value will be retained in the variable.'
