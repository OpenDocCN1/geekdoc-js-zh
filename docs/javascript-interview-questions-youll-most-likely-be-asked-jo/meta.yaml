    \ 方法接收一个整数参数，并可以跳过任意数量的页面。\n\n## 94: 什么是“Screen”对象？\n\n回答：\n\n`Window` 对象的 `screen`\
    \ 属性指向 `Screen` 对象，它提供有关用户显示器大小及其可用颜色数量的信息。`width` 和 `height` 属性可用于以像素指定显示尺寸。\n\
    \n## 95: 什么是“Navigator”对象？\n\n回答：\n\n`Window` 对象的 `navigator` 属性指向 `Navigator`\
    \ 对象，它包含了关于网络浏览器的重要信息，例如版本以及它可以显示的数据格式列表。过去，`Navigator` 对象被脚本用于判断它们是运行在 Internet\
    \ Explorer 还是 Netscape 浏览器中。\n\n## 96: JavaScript 中的“onreset”是什么？\n\n回答：\n\n`onreset`\
    \ 是 JavaScript 中表单对象的事件处理程序。当点击表单中的重置按钮时执行该程序，并在接收到真值时重置字段，否则将防止表单元素被重置。\n\n示例：\n\
    \n```html\nonreset=\"alert('AABBCC')\"\n```\n\n## 97: JavaScript 中的 void 0 是什么？\n\
