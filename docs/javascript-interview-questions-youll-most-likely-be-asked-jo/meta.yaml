    # 36: What is an array in JavaScript?


    # Answer:


    An array is a collection of data values which can handle more than one value at
    a time, the difference being that each data in an array has a number or index.


    # 37: From which version forward has JavaScript stopped using ASCII character
    set?


    # Answer:


    From v.3 JavaScript started using Unicode character sets; identifiers can now
    contain letters and digits from the Unicode complete character set.


    # 38: What is the scope of a variable in JavaScript?


    # Answer:


    The scope of a variable is the region in which your program in which it is defined.
    Thus a global variable has a global scope meaning it is defined everywhere in
    your JavaScript code. The local variables have a local scope meaning they are
    defined only in the body section of your code.


    # 39: In the body of the code which variable with the same name has more importance
    over the other: the local or the global variable?


    # Answer:


    In the body of a function a local variable will always take precedence over a
    global variable hiding it all together.


    # 40: How many types of undefined variables can we find in JavaScript?


    # Answer:


    There are two kinds of undefined variables: the first is the one that'
