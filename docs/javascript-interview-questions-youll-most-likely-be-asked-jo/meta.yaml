    ## 31: Tell me about a person who has been a great influence in your career.


    Answer:


    It''s important to make this answer easy to relate to – your story should remind
    the interviewer of the person who was most influential in his or her own career.
    Explain what you learned from this person and why they inspired you, and how you
    hope to model them later in your career with future successes.


    ## 32: What would this person tell me about you?


    Answer:


    Most importantly, if this person is one of your references – they had better know
    who you are. There are too many horror stories of professors or past employers
    being called for a reference, and not being able to recall when they knew you
    or why you were remarkable, which doesn''t send a very positive message to potential
    employers. This person should remember you as being enthusiastic, passionate,
    and motivated to learn and succeed.


    ## 33: What is the most productive time of day for you?


    Answer:


    This is a trick question – you should be equally productive all day! While it''s
    normal to become extra motivated for certain projects, and also true that some
    tasks will require additional work, be sure to emphasize to the interviewer that
    working diligently throughout the entirety of the day comes naturally to you.


    ## 34: What was the most responsibility you were given at your previous job?


    Answer:


    This question provides you with an opportunity to elaborate on responsibilities
    that may or may not be on your resume. For instance, your resume may not have
    allowed room to discuss individual projects you worked on that were really outside
    the scope of your job responsibilities, but you can tell the interviewer here
    about the additional work you did and how it translated into new skills and a
    richer career experience for you.


    ## 35: Do you believe you were compensated fairly at your last job?


    Answer:


    Remember to stay positive, and to avoid making negative comments about your previous
    employer. If you were not compensated fairly, simply state that you believe your
    qualities and experience were outside the compensation limitations of the old
    job, and that you''re looking forward to an opportunity that is more in line with
    the place you''re in your career.


    ## 36: Tell me about a time when you received feedback on your work, and enacted
    it.


    Answer:


    Try to give an example of feedback you received early in your career, and the
    steps you took to incorporate it with your work. The most important part of this
    question is to display the way you learned from the feedback, as well as your
    willingness to accept suggestions from your superiors. Be sure to offer reflection
    and understanding of how the feedback helped your work to improve.


    ## 37: Tell me about a time when you received feedback on your work that you did
    not agree with, or thought was unfair. How did you handle it?


    Answer:


    When explaining that you did not agree with particular feedback or felt it was
    unfair, you''ll need to justify tactfully why the feedback was inaccurate. Then,
    explain how you communicated directly with the person who offered the feedback,
    and most importantly, how you listened to their response, analyzed it, and then
    came to a mutual agreement.


    ## 38: What was your favorite job, and why?


    Answer:


    It''s best if your favorite job relates to the position you''re currently applying
    for, as you can then easily draw connections between why you enjoyed that job
    and why you are interested in the current position. Additionally, it is extremely
    important to explain why you''ve qualified the particular job as your favorite,
    and what aspects of it you would look for in another job, so that the interviewer
    can determine whether or not you are a good fit.


    ## 39: Tell me about an opportunity that your last position did not allow you
    to achieve.


    Answer:


    Stay focused on the positive, and be understanding of the limitations of your
    previous position. Give a specific example of a goal or career objective that
    you were not able to achieve, but rather than expressing disappointment over the
    missed opportunity, discuss the ways you are looking forward to the chance to
    grow in a new position.


    ## 40: Tell me about the worst boss you ever had.


    Answer:


    It''s important to keep this answer brief, and positively focused. While you may
    offer a couple of short, critical assessments of your boss, focus on the things
    you learned from working with such an individual, and remain sympathetic to challenges
    the boss may have faced.


    ## 41: Describe a time when you communicated a difficult or complicated idea to
    a coworker.


    Answer:


    Start by explaining the idea briefly to the interviewer, and then give an overview
    of why it was necessary to break it down further to the coworker. Finally, explain
    the idea in succinct succ, so the interviewer can see your communication abilities
    and skill in simplification.


    ## 42: What situations do you find it difficult to communicate in?


    Answer:


    Even great communicators will often find particular situations that are more difficult
    to communicate effectively in, so don''t be afraid to answer this question honestly.
    Be sure to explain why the particular situation you name is difficult for you,
    and try to choose an uncommon answer as language barrier or in time of hardship,
    rather than a situation as speaking to someone of higher authority.


    ## 43: What are the key components of good communication?


    Answer:


    Some of the components of good communication include an environment that is free
    from distractions, feedback from the listener, and revision or clarification from
    the speaker when necessary. Refer to basic communication models where necessary,
    and offer to go through a role-play sample with the interviewer in order to show
    your skills.


    ## 44: Tell me about a time when you solved a problem through communication?


    Answer:


    Solving problems through communication is key in the business world, so choose
    a specific situation from your previous job in which you navigated a conflict.
    Explain the steps you took and why communicating through the was important to
    its resolution.


    ## 45: Tell me about a time when you had a dispute with another employee. How
    did you resolve the situation?


    Answer:


    Make sure to use a specific instance, and explain step-by-step the scenario, what
    you did, and how it was finally resolved. The middle step, how you handled the
    dispute, is clearly the most definitive – describe the types of communication
    you used, and how you used compromise to reach a decision. Conflict resolution
    is an important skill for any employee to have, and interviewers search for.


