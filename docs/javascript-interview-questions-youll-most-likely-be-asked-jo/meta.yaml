    # 171: What is the importance of the “name” attribute of a <name> tag?


    Answer: When a Form object is created, the name attribute is stored as an element
    in the form[] array of the Document object, and it is also stored in the properties
    of the Document objects. So, after defining a <form name="formName">, it will
    be easy to refer the Form object using document.formName instead of document.form[0].
    This attribute has nothing to do with submitting the form.


    # 172: What are the event handlers of the form element?


    Answer: The following event handlers are supported by form elements: onclick,
    onchange, onclick, onblur.


    # 173: What does “onchange” event handler do?


    Answer: This event handler is triggered when the user enters text or selects an
    option, changing in this way the value represented by the element. Button and
    other related elements do not support this event handler because they don’t have
    a value that can be edited. This event it is triggered when the focus is lost
    and it is moved to another form element.


    # 174: What is a “cookie”?


    Answer: A cookie is a named data stored by the web browser and associated with
    a particular web page or web site. They were originally designed for the server-side
    programming and they are implemented as an extension to the HTTP protocol. The
    cookie data is transmitted between the client and the server and the server-side
    scripts can read and write cookie values that are stored on the client. In JavaScript,
    cookies are manipulated using “cookie” property of the Document object.


