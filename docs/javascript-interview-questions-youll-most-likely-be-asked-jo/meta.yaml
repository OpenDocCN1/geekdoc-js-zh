    ## 101: meta 标签的目的是什么？\n\n回答：\n\n在执行 JavaScript 函数期间，会创建执行上下文。它跟踪与其相关的代码。在执行应用程序时会创建全局执行上下文。\n\
    \n## 102: 你将如何解决问题？\n\n回答：\n\n使用闭包可以修正这个问题。\n\n```javascript\nvar method1=[];\n\
    for(var k=0;k<5;k++){\n  method1[i]=function(n){\n    return function(){\n   \
    \   document.write(\"Iteration:\" + n + \"&nbsp;\");\n    }\n  }}(k);\n```\n输出：\n\
    0 1 2 3 4\n\n## 103: 请给出一个解决该问题的示例。\n\n回答：\n\n```javascript\nvar method1=[];\n\
    for(var k=0;k<5;k++){\n  method1[i]=function() {\n    document.write(\"Iteration:\"\
    \ + k + \"&nbsp;\");\n  }\n}\nfor(var m=0;m<5;m++){\n  method1[j]();\n}\n```\n\
    输出：\n4 4 4 4 4\n\n## 104: 执行上下文何时创建？它的主要组件有哪些？\n\n回答：\n\n在执行 JavaScript 函数期间，会创建执行上下文。它跟踪与其相关的代码。在执行应用程序时会创建全局执行上下文。\n\
    \n- a) LexicalEnvironment：解析标识符\n- b) VariableEnvironment：记录变量绑定\n- c) ThisBinding：与执行上下文相关的\
    \ this 值\n\n## 105: 执行上下文栈何时创建？\n\n回答：\n\n- a) 全局执行上下文：在执行应用程序时创建\n- b) 新执行上下文：在创建新函数时创建\n\
    - c) 执行上下文形成执行上下文栈\n\n## 106: 如何维护作用域环境？\n\n回答：\n\n通过 `LexicalEnvironment` 维护作用域环境。它包含两个组件：\n\
