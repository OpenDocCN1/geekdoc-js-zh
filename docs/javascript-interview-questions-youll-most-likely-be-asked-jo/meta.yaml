    \ `this` 运算符值传递的对象并且不返回任何内容。无论如何，构造函数可以返回一个对象值，但在这种情况下，返回的对象将成为 `new` 表达式的值，而原本作为\
    \ `this` 值的对象将不再被考虑。\n\n# 190: 在 JavaScript 中可以找到多少种类型的常用对象方法？\n\n答案：\n\n我们三种类型的对象方法：`toString()`\
