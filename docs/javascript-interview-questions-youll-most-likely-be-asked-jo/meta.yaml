    document.write(\"Height:\" + screen.availHeight);\n```\n\n## 169: 如何获取链接页的语言代码？\n\
    答案：\n\n使用锚点对象（anchor）的 href 属性可以获取链接页的语言代码。锚点对象创建指向另一个页面或文档的链接。\n示例：\n```javascript\n\
    my_anchor_object1.hreflang;\n```\n\n## 170: 如何输入文件？\n答案：\n\n使用 FileUpload 对象可以输入文件。在\
    \ <input> 标签中，应将 type 指定为 \"file\"。它会创建一个文件上传对象，在点击按钮时打开文件对话框。\n示例：\n\n```html\n\
    <input type=\"file\">\n```\n\n# JavaScript 表单\n\n## 171: <form> 标签的“name” 属性的作用是什么？\n\
    答案：当 Form 对象被创建时，name 属性被存储为 Document 对象中 form[] 数组的一个元素，同时也存储在 Document 对象的属性中。因此，在定义了\
    \ <form name=\"formName\"> 后，可以方便地使用 document.formName 来引用 Form 对象，而不是 document.form[0]。此属性与提交表单没有关系。\n\
    \n## 172: 表单元素有哪些事件处理器？\n答案：表单元素支持以下事件处理器：onclick, onchange, onclick, onblur。\n\
    \n## 173: “onchange” 事件处理器是做什么的？\n答案：当用户输入文本或选择一个选项时，会触发此事件处理器，从而以这种方式改变元素所代表的值。按钮和其他相关元素不支持此事件处理器，因为它们没有可以编辑的值。该事件在焦点丢失并移动到另一个表单元素时被触发。\n\
    \n## 174: 什么是“cookie”？\n答案：cookie 是由网络浏览器存储的与特定网页或网站关联的命名数据。它们最初是为服务器端编程设计的，并作为\
    \ HTTP 协议的扩展来实现。cookie 数据在客户端和服务器之间传输。\n\n## 175: “new” 运算符的作用什么？\n答案：\n\n`new`\
    \ 运算符在 JavaScript 中创建一个对象的新实例。\n\n## 176: <optgroup> 在 JavaScript 中起什么作用？\n答案：\n\
    \noptgroup 标签用于在 select 列表中分组相关的选项。\n示例：\n\n```html\n<select>\n  <optgroup label=\"\
    JAVA\">\n    <option value=\"1\">Hibernate</option>\n    <option value=\"2\">Struts</option>\n\
    \  </optgroup>\n  <optgroup label=\"SOAP\">\n    <option value=\"3\">Soap</option>\n\
    \    <option value=\"4\">XML</option>\n  </optgroup>\n</select>\n```\n\n## 177:\
    \ session（会话）和 state（状态）的比较。\n答案：\n\n| 功能 | State |\n| :--- | :--- |\n| 维护 | View\
    \ |\n| 存储 | Session |\n| 可见性 | Session |\n| 数据 | Page |\n\n## 178: 哪个函数最适合窗口加载？\n\
    答案：\n\n- a) window.onload：它在页面加载完成后执行。\n- b) window.ready：它在 DOM 加载完成后执行。\n\n\
    ## 179: JavaScript 中 \"visibility\" 的目的是什么？\n答案：\n\n- a) visibility=\"visible\"\
    : 使元素可见。\n- b) visibility=\"hidden\": 隐藏元素。\n\n## 180: 让元素显示/隐藏的方法有哪些？\n答案：\n\n\
    - a) 使用 display 属性：display=\"\" 或 display=\"none\"。\n- b) 使用 visibility 属性：visibility=\"\
    visible/hidden\"。\n\n## 181: 如何禁用 HTML 表单字段？\n答案：\n\n使用密码对象的 disabled 属性。\n示例：\n\
    ```javascript\ndocument.getElementById(\"Field_Id\").disabled=true;\n```\n\n##\
    \ 182: 如何选取文本字段的内容？\n答案：\n\n使用密码对象的 select 函数可以选取内容。\n示例：\n```javascript\ndocument.getElementById(\"\
    Field_Id\").select();\n```\n\n## 183: 如何显示表单的 id 和隐藏元素的 name 属性？\n答案：\n\n使用隐藏对象的“form”和\
    \ name 属性可以显示表单的 id 和 name 属性。\n示例：\n\n```javascript\nvar form_id1=document.getElementById(\"\
    my_elt_id\").form.id;\nvar name_id2=document.getElementById(\"my_elt_id\").name;\n\
    ```\n\n## 184: 如何获取表格的最后一行？\n答案：\n\n表格对象的 tFoot 属性可以获取表格的最后一行。表格的最后行可以使用 tfoot\
    \ 元素组合。\n\n## 185: 如何为表格创建和删除标题（caption）？\n答案：\n\n使用表格对象的 createCaption 和 deleteCaption\
    \ 函数。\n示例：\n\n```javascript\nmy_table_objects.createCaption(); // 创建\nmy_table_objects.deleteCaption();\
    \ // 删除\n```\n\n## 186: 如何创建一个文本区域并设为只读？\n答案：\n\n- a) 使用 textarea 对象：\n```html\n\
    <textarea id=\"my_txt\" cols=\"22\">My_txt</textarea>\n```\n- b) 使用 textarea 的\
    \ readOnly 属性：\n```javascript\nmy_table_objects.readOnly=true;\n```\n\n## 187:\
    \ 如何更改表格标题的显示位置？\n答案：\n\n使用样式对象的 captionSide 属性可以更改表格标题的显示位置。\n示例：\n```javascript\n\
    my_obj1.style.captionSide=\"top/bottom\";\n```\n\n"
