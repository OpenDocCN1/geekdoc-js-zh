  md: '# 46: Does JavaScript contain classes?


    Answer:

    Yes. Although they do not define the structure of an object like in Java and C++,
    it does approximate the classes with its constructors and their prototype objects.


    # 47: What is an object in JavaScript?


    Answer:

    An object is an instance of its class. This allows us to have multiple instances
    of any class.


    # 48: How are classes and objects in JavaScript named and why?


    Answer:

    Classes are named with an initial capital letter and an object with lowercase
    letters. This ensures that classes and objects are distinct from each other.


    # 49: What are class properties in JavaScript?


    Answer:

    Class property is associated with a class itself and not instance of a class.
    This ensures that no matter many instances of a class are created only one copy
    of each class property exists.


    # 50: What are class methods in JavaScript?


    Answer:

    Class methods are associated with a class rather than an instance of a class,
    meaning they are invoked by the class itself and not instance of the class.


    # 51: Do class properties and class methods have a global and local range?


    Answer:

    No. They are both only global because they do not operate on a particular object.


    # 52: How do JavaScript equality operators compare objects?'
