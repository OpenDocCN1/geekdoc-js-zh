    # # JavaScript Interview Questions


    Review these typical interview questions and think about how you would answer
    them. Read the answers listed; you will find best possible answers along with
    strategies and suggestions.


    # # Introduction to JavaScript


    # 1: What is JavaScript and what does it do?


    Answer:


    JavaScript is a scripting language that adds interactivity to HTML pages.


    # 2: What kind of language does JavaScript provide?


    Answer:


    JavaScript is an interpreted language that executes scripts without preliminary
    compilation.


    # 3: Is there any connection between Java and JavaScript?


    Answer:


    No. They are different in every way and JavaScript is not as powerful and complex
    as Java.


    # 4: What is the official name of JavaScript and is it supported by all browsers?


    Answer:


    The official name of JavaScript is ECMA (European Computer Manufacturer''s Association)
    and with it, Internet Explorer 4 and Mozilla Firefox 1.5 fully supported.


    # 5: What does JavaScript do?


    Answer:


    JavaScript is meant to be an easy scripting language that helps the non-programmers
    with its simple syntax. JavaScript is smart enough it can put dynamic text into
    HTML pages, it can react to events (like when a page has finished downloading),
    and it can read and write HTML elements, create cookies and so forth.


    # 6: Does prior knowledge of JAVA ease the use of JavaScript?


    Answer:


    Yes. Being modeled after Java, which in turn is modeled after C++, JavaScript
    should be easier to familiarize and work with.


    # 7: Is JavaScript case-sensitive?


    Answer:


    Yes. Unlike HTML, JavaScript has to have all variables and function names (etc.)
    in capital letters.


    # 8: How do you place JavaScript?


    Answer:


    JavaScript may be inserted into code with the following syntax: <script type="text/JavaScript">


    # 9: Where do you place JavaScript?


    Answer:


    JavaScript may be placed in the <head> or the <body> section of HTML code, but
    it is usually a good practice to place it in <head> as to not hinder your code
    later on.


    # # Statements, Comments and Variables


    # 10: How do you terminate statements in JavaScript?


    Answer:


    In JavaScript, statements are terminated by semicolons (;) although they are not
    mandatory they are a good practice to pick up.


    # 11: Why are comments used in JavaScript and how are they inserted?


    Answer:


    Usually comments are added to make the code more readable they can also be used
    to explain the code.


    # 12: What are variables and how are they declared?


    Answer:


    Variables are containers for storing data values. They are declared using `var`,
    `let`, or `const`. Single-line comments start with //, and multi-line comments
    are enclosed in /* ... */.


    # 13: How do you use a variable?


    Answer:


    Variables are used to store values that can be changed later in the program. For
    example, `let x = 5;`.


    # 14: What are the data types in JavaScript?


    Answer:


    JavaScript supports several data types including String, Number, Boolean, Undefined,
    Null, Big, Symbol, and Object.


    # 15: How do operators work in JavaScript?


    Answer:


    Operators are used to perform operations on variables and values. Common operators
    include arithmetic (+, -, *, /), comparison (==, ===, >, <), and logical (&&,
    ||, !).


    # 16: What are conditional statements in JavaScript?


    Answer:


    Conditional statements allow you to execute different code based on different
    conditions. Common statements include `if`, `else if`, `else`, and `switch`.


    # 17: How do loops work in JavaScript?


    Answer:


    Loops used to repeat a block of code multiple times. Common loops are `for`, `while`,
    and `do...while`.


    # 18: What are functions in JavaScript?


    Answer:


    Functions are blocks of code designed to perform a particular task. They are defined
    with the `function` keyword and called by their name.


    # 19: What are objects in JavaScript?


    Answer:


    Objects are collections of properties and methods. They are used to store key-value
    pairs.


    # 20: How are arrays used in JavaScript?


    Answer:


    Arrays are objects used to store multiple values in a single variable. You can
    access elements using an index.

