  md: '# 29: What does the keyword null mean in JavaScript?


    Answer:


    The keyword null is a special value that indicates no value. It is unique from
    other values and also distinct.


    # 30: What does the value undefined mean in JavaScript?


    Answer:


    Undefined is a special value in JavaScript, it means the variable used in the
    code does not exist or is not assigned any value or the property does not exist.


    # 31: Do the null and undefined values have the same conversion in Boolean, numeric
    and string context?


    Answer:


    No. The undefined value changes into Nan in numeric context and undefined in a
    string context. They share the same conversion in Boolean.


    # 32: What are Boolean values?


    Answer:


    Boolean values are datatypes that only have two types of values; true or false;
    a value of a Boolean type only represents the truth: it says if it is true or
    not.


    # 33: Can a Boolean value be converted into numeric context?


    Answer:


    Yes. If it is converted into numeric context the true value becomes 1 and if it
    is a false value it becomes a 0.


    # 34: What happens when a number is dropped where a Boolean value is expected
    to be?


    Answer:


    The number is converted into a true value, but only if it not equal to 0 or NaN
    which in turn is converted into a false value.


    # 35: What are objects in JavaScript?'
