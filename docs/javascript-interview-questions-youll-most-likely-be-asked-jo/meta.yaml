  md: '# 24: Why did you choose your college major?


    Answer:


    It''s important to display interest in your work, and if your major is related
    to your current field, it will be simple for you to relate the two. Perhaps you
    even knew

    while in college that you wanted to do a job similar to this position, and so
    you chose the major so to receive the education and training you needed to succeed.
    If your major doesn''t relate clearly, it''s still important to express a sense
    of passion for your choice, and to specify the importance of pursuing something
    that matters to you – which is how you made the decision to come to your current
    career field.


    # 25: Tell me about your college experience.


    Answer:


    It''s best to keep this answer positive – don''t focus on parties, pizza, or procrastinating.
    Instead, offer a general summary of the benefits you received in college, followed
    by an anecdote of a favorite professor or course that opened up your way of thinking
    about the field you''re in. This is a great opportunity for you to show your passion
    for your career, make sure to answer enthusiastically and confidently.


    # 26: What is the most unique thing about yourself that you would bring to this
    position?


    Answer:


    This question is often asked as a close to an interview, and it gives you a final
    chance to highlight your best qualities to the employer. Treat the question like
    a sort of review, and explain why your specific mix of education, experience,
    and passions will be the ideal combination for the employer. Remain confident
    but humble, and keep your answer to about two minutes.


