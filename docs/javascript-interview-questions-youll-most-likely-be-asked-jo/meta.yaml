- img_proc: true
  md: '# 1: What is JavaScript and what does it do?


    Answer:


    JavaScript is a scripting language that adds interactivity to HTML pages.


    # 2: What kind of language does JavaScript provide?


    Answer:


    JavaScript is an interpreted language that executes scripts without preliminary
    compilation.


    # 3: Is there any connection between Java and JavaScript?


    Answer:


    No. They are different in every way and JavaScript is not as powerful and complex
    as Java.


    # 4: What is the official name of JavaScript and is it supported by all browsers?


    Answer:


    The official name of JavaScript is ECMA (European Computer Manufacturer''s Association)
    and with it, Internet Explorer 4 and Mozilla Firefox 1.5 fully supported.


    # 5: What does JavaScript do?


    Answer:


    JavaScript is meant to be an easy scripting language that helps the non-programmers
    with its simple syntax. JavaScript is smart enough it can put dynamic text into
    HTML pages, it can react to events (like when a page has finished downloading),
    and it can read and write HTML elements, create cookies and so forth.


    # 6: Does prior knowledge of JAVA ease the use of JavaScript?


    Answer:


    Yes. Being modeled after Java, which in turn is modeled after C++, JavaScript
    should be easier to familiarize and work with.


    # 7: Is JavaScript case-sensitive?'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'JavaScript Interview Questions You''ll Most Likely Be Asked


    # Answer:


    Yes. Unlike HTML, JavaScript has to have all variables and function names (etc.)
    in capital letters.


    # 8: How do you place JavaScript?


    # Answer:


    JavaScript may be inserted into code with the following syntax: <script type="text/JavaScript">


    # 9: Where do you place JavaScript?


    # Answer:


    JavaScript may be placed in the <head> or <body> section of HTML code, but it
    is usually a good practice to place it in <head> as to not hinder your code later
    on.'
