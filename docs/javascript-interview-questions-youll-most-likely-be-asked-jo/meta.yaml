    ## 23: Which property is used to match the pattern at the end of the string?


    Answer:


    "$" symbol is used for end position matching.


    Example:


    ```

    var p1="First_Regular_Expression_First";

    var q1="/First/$";

    document.write("Pattern_Match:" + p1.match(q1));

    //Pattern_Match:First ---> Expression_First

    ```


    ## Operators and Functions


    ## 24: What are operators? Which are the most important operators in JavaScript?


    Answer:


    Operators in JavaScript are used to combine values that form expressions. The
    most important are: = and +. The first is used to assign values and the second
    one is used to add values together.


    ## 25: Why comparison and logical operators are used?


    Answer:


    Comparison operators are used to determine if there is a difference between variables,
    and also their equality, and logical operators are used to determine the logic
    of variables.


    ## 26: How many types of pop-up boxes does JavaScript have? What are those?


    Answer:


    JavaScript has three types of pop-up boxes and they are: alert, confirm and prompt.


    ## 27: Does creating an alert box prompt the user to respond with OK or Cancel?


    Answer:


    No. An alert box only gives the user the option of choosing OK to proceed.


    ## 28: What are functions in JavaScript and where are they placed?


    Answer:


    Functions contain code that is executed before an event thus stopping the browser
    from loading a script when the page opens. Functions can be placed both in the
    <head> or <body> section, but it is advised to place them in the <head> section.


    ## Values, Arrays and Operators


    ## 29: What does the keyword null mean in JavaScript?


    Answer:


    The keyword null is a special value that indicates no value. It is unique from
    other values and also distinct.


    ## 30: What does the value undefined mean in JavaScript?


    Answer:


    Undefined is a special value in JavaScript, it means the variable used in the
    code does not exist or is not assigned any value or the property does not exist.


    ## 31: Do the null and undefined values have the same conversion in Boolean, numeric
    and string context?


    Answer:


    No. The undefined value changes into Nan in numeric context and undefined in a
    string context. They share the same conversion in Boolean.


    ## 32: What are Boolean values?


    Answer:


    Boolean values are datatypes that only have two types of values; true or false;
    a value of a Boolean type only represents the truth: it says if it is true or
    not.


    ## 33: Can a Boolean value be converted into numeric context?


    Answer:


    Yes. If it is converted into numeric context the true value becomes 1 and if it
    is a false value it becomes a 0.


    ## 34: What happens when a number is dropped where a Boolean value is expected
    to be?


    Answer:


    The number is converted into a true value, but only if it not equal to 0 or NaN
    which in turn is converted into a false value.


    ## 35: What are objects in JavaScript?


    ## JavaScript Interview Questions You''ll Most Likely Be Asked


    Answer:


    Objects are collections of named values that most of the times are referred to
    as properties of an object.


    ## 36: What is an array in JavaScript?


    Answer:


    An array is a collection of data values which can handle more than one value at
    a time, the difference being that each data in an array has a number or index.


    ## 37: From which version forward has JavaScript stopped using ASCII character
    set?


    Answer:


    From v.3 JavaScript started using Unicode character sets; identifiers can now
    contain letters and digits from the Unicode complete character set.


    ## 38: What is the scope of a variable in JavaScript?


    Answer:


    The scope of a variable is the region in which your program in which it is defined.
    Thus a global variable has a global scope meaning it is defined everywhere in
    your JavaScript code. The local variables have a local scope meaning they are
    defined only in the body section of your code.


    ## 39: In the body of the code which variable with the same name has more importance
    over the other: the local or the global variable?


    Answer:


    In the body of a function a local variable will always take precedence over a
    global variable hiding it all together.


    ## 40: How many types of undefined variables can we find in JavaScript?


    Answer:


    There are two kinds of undefined variables: the first is the one that has never
    been declared and the second is the kind of undefined variable that has been declared
    but has never had a value assigned to it.


    ## 41: What are the (=) (===) and what do they do in JavaScript?


    Answer:


    The first (=) is the equality operator and it checks if its two operands are equal.
    The second (===) is called the identity operator and it checks if two operands
    are identical by using a strict definition.


    ## 42: How many types of operators can we find in JavaScript?


    Answer:


    There are eight types of operators in JavaScript. These are as follows: operator,
    arithmetic, equality, relational, string, logical, bitwise and miscellaneous.


    ## 43: How many types of comparison operators does JavaScript contain?


    Answer:


    There are four types of comparison operators in JavaScript. They are: less than
    (<); greater than (>); less than or equal (<=) and greater than or equal (>=).


    ## 44: What happens when a number is dropped where a Boolean value is expected
    to be?


    Answer:


    The number is converted into a true value, but only if it not equal to 0 or NaN
    which in turn is converted into a false value.


    ## 45: What are logical operators and how are they used?


    Answer:


    Logical operators are used to determine the logic of variables. They are used
    to combine boolean expressions.


    ## 46: Does creating an alert box prompt the user to respond with OK or Cancel?


    Answer:


    No. An alert box only gives the user the option of choosing OK to proceed.


    ## 47: What is an array in JavaScript?


    Answer:


    An array is a collection of data values which can handle more than one value at
    a time, the difference being that each data in an array has a number or index.


