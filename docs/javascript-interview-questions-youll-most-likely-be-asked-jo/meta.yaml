  mdcn: "\n\n## 文档的作用是什么？\n\n回答：\n\n放置在文档 `<body>` 部分的脚本可以执行所有与放置在文档 `<head>` 部分的脚本相同的操作。它们还可以操作出现在该脚本之前的文档元素。\n\
    \n## 88: 浏览器会在何时触发 unload 事件？\n\n回答：\n\n在文档解析完成、所有脚本运行完毕且所有辅助内容加载完成后，浏览器会触发 `unload`\
    \ 事件并运行任何已注册的 JavaScript 代码。简而言之，对于所有主流浏览器（IE 除外），当因点击后退按钮导致页面加载时，JavaScript `unload`\
    \ 事件不会触发——它只会在页面首次加载时触发。\n\n## 89: unload 事件何时触发？它起什么作用？\n\n回答：\n\n`onload` 事件在用户离开网页后触发，为该页面上的代码提供了最后一次运行的机会；`onload`\
    \ 事件允许撤销你在写入页面中的 `onload` 处理程序或脚本产生的影响。\n\n## 90: 关于读取、写文件呢？我们如何在 JavaScript 中实现这一点？\n\
    \n回答：\n\n客户端 JavaScript 不提供任何读取或删除客户端计算机上文件或目录的方法。这也是安全方面的考量——由于没有 `File` 对象且没有文件访问函数，JavaScript\
    \ 程序无法删除用户的数据。\n\n## 91: 什么是“跨站脚本”？\n\n回答：\n\n跨站脚本（Cross Site Scripting, XSS）是一种安全问题，攻击者通过向网站中注入\
    \ HTML 标签或脚本。尽管防御此类攻击是服务端开发人员的工作，但 JavaScript 程序员也必须意识到并防御跨站脚本。\n\n## 92: 什么是\
    \ JavaScript 定器？请给出示例并解释其中之一。\n\n回答：\n\n对于任何编程环境来说，具备在未来某个点调度执行代码的能力是非常关重要的。客户端\
