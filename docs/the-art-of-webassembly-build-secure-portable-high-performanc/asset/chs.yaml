  \n## 列表 9-30: `init_benchmark` 函数\n\n我们定义了 `init_benchmark()` 1 函数，它为我们 WebAssembly\
  \ 模块中的每个函数调用基 模块的 `suite.add` 2。使用 `suite.add` 告诉基准套件测试该函数，并使用作为第二个参数传递的字符串记录结果。`suite.on`\
  \ 函数为基准测试期间发生的不同事件设置事件回调。第一次调用 `suite.on` 3 设置了每个周期（cycle）的回调，它将输出我们测试的函数以及该测试的统计数据。下一次调用\
  \ `suite.on` 4 设置了基准测试完成后的回调，它将使用 `filter` 5 方法来 `log` 6 最快和最慢的函数。然后我们对 `'successful'`\
  \ 进行过滤 7，以获取所有运行成功的函数数组。我们 `sort` 8 该数组，按该周期的 `mean`（平均）运行时间进行排序。这使得周期按照从快到最慢的运行时间排序。然后我们可以循环\
  \ 9 每一个周期，按从快到慢的顺序打印它们。在函数的结束处，我们 `run` 执行 `suite`。\n\n在定义了 `init_benchmark` 函数后，我们在列表\
  \ 9-31 中创建了异步 IIFE 来实例化我们的 WebAssembly 模块并调用 `init_benchmark`。\n\n**benchmark_test.js**\n\
