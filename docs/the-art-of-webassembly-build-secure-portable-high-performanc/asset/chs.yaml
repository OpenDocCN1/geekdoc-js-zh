  \ 示例 9-35 中 V8 生成的代码。\n\n## 总结\n\n在本章中，我们讨论了评估 WAT 代码性能的多种工具，并将其与 JavaScript 进行了比较。然后，我们探索了改进\
  \ WebAssembly 模块的策略。\n\n我们查看了 Chrome 浏览器中的分析器，并讨论了摘要页面和 JS 内存部分，后者提供了内存峰和垃圾回收的信息。我们还查看了帧率（fps）。\n\
  \n我们使用 Firefox 分析器调查了碰撞检测应用。Firefox 分析器提供了几个额外工具，包括调用树（Call Tree）和 JS 火焰图（Flame\
  \ Chart）。我们通过分析器找到了被调用的 WAT 函数。\n\n接下来，我们安装了 *Binaryen.js* 并使用 `wasm-opt` 工具对 WebAssembly\
  \ 模块进行了下载大小或性能的优化。我们还将其反汇编译为 WAT 代码，以便查看优化器所做的更改。\n\n我们讨论了死代码消除（DCE），这是优化器执行以移除模块中未用函数的方法。\n\
  \n# 10 调试 WebAssembly\n\n![](Images/chapterart.png\n\n在本章中，你将学习调试 WAT 代码的多种技术。我们将讨论向控制台打印日志以及使用警告框（alert），以及如何将堆栈跟踪打印到控制台。我们将涵盖如何在\
  \ Firefox 和 Chrome 中使用调试器、它们之间的区别以及每个调试器的局限性。\n\n\n\n\n`source map`（源映射）将在浏览器中运行的代码映射到原始预编译源代码。它允许使用\
  \ TypeScript 等语言或 React 等框架编写代码的开发者逐步执行其原始代码以进行调试。WebAssembly 工具链（如 Emscripten）会将生成的\
  \ WebAssembly 二进制文件映射回原始的 C++ 源代码。在本文写作时，`wat2wasm` 尚不会为转换为 WebAssembly 二进制格式的 `WAT`\
  \ 代码生成源映射。这并不意味着调试 `WAT` 代码变得毫无用，但它确实意味着在将其转换为二进制文件时，局部或全局变量的任何名称都会丢失。因此，你在 `WAT`\
  \ 中编写的代码与你在调试器中看到的并不完全相同。你必须手动将变量指定的特定名称映射到浏览器调试器分配的通用名称。在本章的稍后部分，你将学习如何理解这种映射。一旦你学会了调试\
  \ WebAssembly 代码，你将拥有工具来逐步执行你在网络上找到的任何 WebAssembly 代码，即使你没有源代码。\n\n## 从控制台调试\n\n\
  开始调试 WebAssembly 代码最简单的方法是通过浏览器控制台打印日志语句。正如你之前学到的，WebAssembly 必须依赖 JavaScript 来实现这一点。在本章中，我们将使用一个\
  \ JavaScript 函数来创建调试日志。让我们创建一个简单的 WebAssembly 函数，使用勾股定理计算两点之间的距离。我们将在代码中引入一个错误，并将其作为待调试代码。创建一个名为\
  \ `pythagoras.wat` 的新文件，并添加列表 10-1 中的代码。\n\n**pythagoras.wat**\n\n```\n(module\n\
  \  (import \"js\" \"log_f64\" (func $log_f64(param i32 f64)))\n\n  (func $distance\
  \ (export \"distance\")\n    (param $x1 f64) (param $y1 f64) (param $x2 f64) (param\
  \ $y2 f64)\n    (result f64)\n    (local $x_dist f64)\n    (local $y_dist f64)\n\
  \n    local.get $x1\n    local.get $x2\n    f64.sub             ;; $x1 - $x2\n \
  \   local.tee $x_dist   ;; $x_dist = $x1 - $x2\n    local.get $x_dist\n    f64.mul\
  \             ;; $x_dist * $x_dist on stack\n\n    local.get $y1\n    local.get\
  \ $y2\n  1 f64.add             ;; should be $y1 - $y2\n    local.tee $y_dist   ;;\
  \ $y_dist = $y1 - $y2\n    local.get $y_dist\n    f64.mul             ;; $y_dist\
  \ * $y_dist on stack\n    f64.add             ;; $x_dist * $x_dist + $y_dist * $y_dist\
  \ on stack\n\n    f64.sqrt            ;; take the square root of x squared plus\
  \ y squared\n  )\n)\n```\n\n列表 10-1：使用勾股定理寻找两点之间的距离\n\n要使用勾股定理，我们在两点之间的 x 轴和 y 轴上创建一个直角三角形。x\
  \ 轴上的长度是两个 `x` 值之间的距离。我们可以以同样的方法找到 y 轴上的距离。我们可以通过将这两个值平方、求和，然后开根来找到两点之间的距离（图 10-1）。\n\
  \n![f10001](img/f10001.png)\n\n图 10-1：使用勾股定理计算游戏对象之间的距离\n\n示例中的数学原理并不重要。重要的细节是，我们通过相加\
  \ `$y1` 和 `$y2` 的值而不是相它们来获取两个 y 坐标之间的距离，从而引入了一个 bug。将 `pythagoras.wat` 编译为 `pythagoras.wasm`，并创建一个名为\
  \ `pythagoras.html` 的新文件。然后将列表 10-2 中的代码添加到 `pythagoras.html` 中。\n\n**pythagoras.html**\n\
  \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<<body>\n  1 X1: <input type=\"number\"\
  \ id=\"x1\" value=\"0\">\n  2 Y1: <input type=\"number\" id=\"y1\" value=\"0\">\n\
  \  3 X2: <input type=\"number\" id=\"x2\" value=\"4\">\n  4 Y2: <input type=\"number\"\
  \ id=\"y2\" value=\"3\">\n    <br><br>\n  5 DISTANCE: <span id=\"dist_out\">??</span>\n\
  \    <script>\n      var distance = null;\n      let importObject = {\n        js:\
  \ {\n        6 log_f64: function(message_index, value) {\n            console.log(`message\
  \ #${message_index} value=${value}`);\n          }\n        }\n      };\n\n    \
  \  ( async () => {\n        let obj = await WebAssembly.instantiateStreaming(\n\
  \                            fetch('pythagoras.wasm'), importObject );\n       \
  \ distance = obj.instance.exports.distance;\n      })();\n\n      7 function set_distance()\
  \ {\n        8 let dist = document.getElementById('dist_out');\n        9 let x1\
  \ = parseFloat(document.getElementById('x1').value);\n        10 let y1 = parseFloat(document.getElementById('y1').value);\n\
  \        11 let x2 = parseFloat(document.getElementById('x2').value);\n        12\
  \ let y2 = parseFloat(document.getElementById('y2').value);\n        13 let result\
  \ = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));\n        14 dist.innerHTML\
  \ = result;\n      }\n    </script>\n    <br><br>\n    <button onclick=\"set_distance()\"\
  >Find Distance</button>\n</>\n</html>\n```\n列表 10-2：调用 WebAssembly 的 HTML 文件\n\n\
  \n\n众所周知，在 WAT 中直接处理字符串并不是一项简单的任务。因此，为了逐步执行并调试这段代码，我们使用一个消息 ID 以及一个从 WebAssembly\
  \ 模块传递给 JavaScript 的值。参考列表 10-3，修改 `pythagoras.wat` 文件，在 `$distance` 函数内部调用 `$log_f64`。\n\
  \n**pythagoras.wat**\n\n```\n...\n(func $distance (export \"distance\")\n  (param\
  \ $x1 f64) (param $y1 f64) (param $x2 f64) (param $y2 f64) (result f64)\n  (local\
  \ $x_dist f64)\n  (local $y_dist f64)\n  (local $temp_f64 f64)\n\n  local.get $x1\n\
  \  local.get $x2\n  f64.sub             ;; $x1 - $x2\n\n  local.tee $x_dist   ;;\
  \ $x_dist = $x1 - $x2\n\n1 (call $log_f64 (i32.const 1) (local.get $x_dist))\n\n\
  \  local.get $x_dist\n  f64.mul             ;; $x_dist * $x_dist on stack\n\n2 local.tee\
  \ $temp_f64 ;; used to hold top of the stack without changing it\n3 (call $log_f64\
  \ (i32.const 2) (local.get $temp_f64))\n\n  local.get $y1\n  local.get $y2\n  f64.add\
  \             ;; should be $y1 - $y2\n  local.tee $y_dist   ;; $y_dist = $y1 - $y2\n\
  \n4 (call $log_f64 (i32.const 3) (local.get $y_dist))\n\n  local.get $y_dist\n \
  \ f64.mul             ;; $y_dist * $y_dist on stack\n\n5 local.tee $temp_f64 ;;\
  \ used to hold top of the stack without changing it\n6 (call $log_f64 (i32.const\
  \ 4) (local.get $temp_f64))\n\n  f64.add             ;; $x_dist * $x_dist + $y_dist\
  \ * $y_dist on stack\n\n7 local.tee $temp_f64 ;; used to hold top of the stack without\
  \ changing it\n8 (call $log_f64 (i32.const 5) (local.get $temp_f64))\n\n  f64.sqrt\
  \            ;; take the square root of x squared plus y squared\n\n9 local.tee\
  \ $temp_f64 ;; used to hold top of the stack without changing it\na (call $log_f64\
  \ (i32.const 6) (local.get $temp_f64))\n)\n...\n```\n\n列表 10-3：更新后的 `pythagoras.wat`\
  \ 文件，包含了 JavaScript 函数调用以记录 f64 变量\n\n我们在这里多处添加了对 `$log_f64` 函数的调用 (13468a)。$log_f64`\
  \ 的第一个参数是消息 ID，这是一个整数，我们将作为该消息的唯一 ID。稍后，我们使用此 ID 从 JavaScript 中输出特定的消息。\n\n第二个参数是一个\
  \ 64 位浮点数值，它可以向我们显示距离计算过程中几个不同阶段的值。在许多此类调用中，我们想要记录栈顶的值但*不*将其弹出，因此我们使用 `local.tee`\
  \ (2579) 来设置 `$temp_f64` 的值，这会设置该值但不会将其从栈中移除。然后，我们在调用 `$log_f64` (368a) 时使用 `$temp_f64`\
  \ 中的值。\n\n### 向控制台记录消息\n\n如所述，WebAssembly 模块无法直接向浏览器的控制台记录消息，且 WAT 没有原生的字符串处理库。我们到为止使用的\
  \ `log_f64` 函数是由 WebAssembly 模块从 JavaScript 导入的。因此，在列表 10-4 中，将在 JavaScript 中实现此函数。\n\
  \n**pythagoras.html**\n\n```\nlog_f64: function(message_index, value) {\n  console.log(`message\
  \ #${message_index} value=${value}`);\n}\n```\n\n列表 10-4：由 `pythagoras.wat` 调用的\
  \ JavaScript 函数\n\n这是一个非常直接的版本，记录了消息索引和值，但没有针对任何 `message_index` 值自定义消息。要查看 Chrome\
  \ 中的控制台，我们需要打开开发者工具。进入浏览器菜单并点击**更多工具**（图 10-6）。\n\n![f10006](img/f10006.png)\n\n\
  图 10-6：打开 Chrome 开发者工具\n\n点击**开发者工具**，然后点击**控制台**（Console）选项卡查看控制台，如图 10-7 所示。\n\
  \n![f10007](img/f10007.png)\n\n图 10-7：打开 Chrome 开发者工具\n\n\n\n我们通过调用 JavaScript 的\
  \ `console.trace` 函数来显示堆栈跟踪。Firefox 和 Chrome 目前提供的堆栈跟踪看起来大不相同。在 Firefox 中使用 `console.trace`\
  \ 目前比在 Chrome 浏览器中使用可以获得关于 WAT 文件更有用的信息。Firefox 浏览器会将 WebAssembly 二进制文件转换为 WAT 文件，并提供引用该反汇编后\
  \ WAT 文件行号的堆栈跟踪。相反，Chrome 提供的是对函数索引的引用，如果你不熟悉它，这看起来可能会非常晦懂。\n\n![f10013](img/f10013.png)\n\
  \n图 10-13：堆栈跟踪中函数 1 调用函数 2，函数 2 调用函数 3，函数 3 调用函数 4\n\n创建一个名为 `stack_trace.wat` 的文件并将并将列表\
  \ 10-7](#c10.xhtml_listing10-7) 中的代码添加到其中。\n\n**stack_trace.wat**\n\n```\n(module\n\
  \n1 (import \"js\" \"log_stack_trace\" (func $log_stack_trace (param i32)))\n\n\
  2 (func $call_level_1 (param $level i32)\n    local.get $level\n    call $log_stack_trace\n\
  \  )\n\n3 (func $call_level_2 (param $level i32)\n    local.get $level\n    call\
  \ $call_level_1\n  )\n\n4 (func $call_level_3 (param $level i32)\n    local.get\
  \ $level\n    call $call_level_2\n  )\n\n5 (func $call_stack_trace (export \"call_stack_trace\"\
  )\n  6 (call $log_stack_trace (i32.const 0))\n    (call $call_level_1 (i32.const\
  \ 1))\n    (call $call_level_2 (i32.const 2))\n    (call $call_level_3 (i32.const\
  \ 3)) \n  )\n)\n```\n\n列表 10-7：演示调用堆栈跟踪的 WebAssembly 模块\n\n该 WebAssembly 模块从 JavaScript\
  \ 导入了 `log_stack_trace` 函数 1，它将调用嵌入的 JavaScript 中的 `console.trace`。我们定义了另外四个函数，演示每个浏览器是如何记录\
  \ WebAssembly 调用堆栈的。导入的函数 `$log_stack_trace` 被 `$call_stack_trace` 和 `$call_level_1`\
  \ 2 调用。函数 `$call_level_1` 被 `$call_stack_trace` 和 `$call_level_2` 3 调用。函数 `$call_level_2`\
  \ 被 `$call_stack_trace` 和 `$call_level_3` 4 调用。最后，$call_level_3` 被 `$call_stack_trace`\
  \ 调用。我们嵌套了这些函数调用，以演示从不同函数层级调用时堆栈跟踪的外。\n\n注意 `$call_stack_trace` 5 调用了其他每个函数。首先，它直接调用\
  \ `$log_stack_trace` 并传递了常量 `0`。接下来，它调用了 `$call_level_1`，后者又调用了 `$log_stack_trace`\
  \ 并传递了常量值 `1`。当记录堆栈跟踪时，调用堆栈中应该显示 `$call_level_1`、`$log_stack_trace` 6 和 `$call_stack_trace`。`$call_level_2`\
  \ 和 `$call_level_3` 函数各添加了额外的层，这些层将在堆栈跟踪中显示。\n\n现在创建一个名为 `stack_trace.html` 的新文件并将列表\
  \ 10-8](#c10.xhtml_listing10-8) 中的代码添加到其中。\n\n**stack_trace.html**\n\n```\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<body\n    <h1>Stack Trace</h1>\n    <script>\n   \
  \   let importObject = {\n        js: {\n          1 log_stack_trace: function(\
  \ level ) {\n                console.trace(`level=${level}`);\n          }\n   \
  \     }\n      };\n\n      ( async () => {\n        let obj =\n          await WebAssembly.instantiateStreaming(\
  \ fetch('stack_trace.wasm'),\n                                                 \
  \ importObject );\n       obj.instance.exports.call_stack_trace();\n\n      })();\n\
  \    </script>\n</body>\n</html>\n```\n\n列表 10-8：带有 JavaScript 调用堆栈跟踪的 HTML 文件\n\
  \n这是一个非常基础的 HTML 文件，类似于 `pythagoras.html`。主要代码是在 `importObject` 内部内部的 `log_stack_trace`\
  \ 函数 1，它调用 JavaScript 函数 `console.trace` 并传递一个在堆栈跟踪之前打印到控制台的字符串。保存此 HTML 文件后，在 Firefox\
  \ 浏览器中打开它；你应该能看到与图 10-14](#c10.xhtml_figure10-14)类似的控制台日志。\n\n![f10014](img/f10014.png)\n\
  \n图 10-14：在 Firefox 中显示堆栈跟踪\n\n你可以看到，第一个堆栈跟踪是用 `level=0` 记录的，因为我们直接在 WAT 代码的第一次调用\
  \ `$log_stack_trace` 时传递了值 `0`。这是从 WebAssembly 函数 `$call_stack_trace` 直接调用导入的 JavaScript\
  \ 函数。由于第一次调用是直接对 `$log_stack_trace` 的，因此在这个顺序中 `stack_trace.wasm` 文件只记录了一个堆栈帧。`$call_level_2`\
  \ 和 `$call_level_3` 函数各添加了额外的层，这些层将在堆栈跟踪中显示。\n\n## Firefox 调试器\n\n在本节中，我们将编写一些可以在调试器中单步执行的代码。首先，花点回顾\
  \ `pythagoras.html` 和 `pythagoras.wat` 文件。我们故意引入了一个错误，以便在调试器中跟踪它。我们将通过修改 `pythagoras.wat`\
  \ 来移除对 JavaScript 输出的调用，以便使用调试器对其进行调试。创建一个名为 `debugger.wat` 的文件并将列表 10-9](#c10.xhtml_listing10-9)\
  \ 中的代码添加到其中，或者直接从 `pythagoras.wat` 中删除日志调用并重新保存文件。\n\n\n\n\n```\n(module\n  (func\
  \ $distance (export \"distance\")\n    (param $x1 f64) (param $y1 f64) (param $x2\
  \ f64) (param $y2 f64)\n    (result f64)\n    (local $x_dist f64)\n    (local $y_dist\
  \ f64)\n\n    local.get $x1\n    local.get $x2\n    f64.sub             ;; $x1 -\
  \ $x2\n    local.tee $x_dist   ;; $x_dist = $x1 - $x2    local.get $x_dist\n   \
  \ f64.mul             ;; $x_dist * $x_dist on stack\n    local.get $y1\n    local.get\
  \ $y2\n    f64.add             ;; Should be $y1 - $y2    local.tee $y_dist   ;;\
  \ $y_dist = $y1 - $y2\n    local.get $y_dist\n    f64.mul             ;; $y_dist\
  \ * $y_dist on stack\n    f64.add             ;; $x_dist * $x_dist + $y_dist * $y_dist\
  \ on stack\n    f64.sqrt            ;; take the square root of x squared plus y\
  \ squared\n  )\n)\n```\n\n示例 10-9：我们通过移除日志调用修改了 `pythagoras.wat`。\n\n早些时候，我们引入了一个\
  \ bug，它通过将 `$y1` 加到 `$y2` 而不是相减它们，有时会得到错误的结果。将 `pythagoras.html` 复制到名为 `debugger.html`\
  \ 的新文件中，并将 `<script>` 标签内部的 JavaScript 代码更改为获取 `debugger.wasm`。然后移除 `importObject`，使其看起来像示例\
  \ 10-10 中的代码一样。\n\n**pythagoras.html**\n\n```\n...\n<script>\n  var distance = null;\n\
  \n  ( async () => {\n    let obj = await WebAssembly.instantiateStreaming( fetch('debugger.wasm')\
  \ );\n\n    distance = obj.instance.exports.distance;\n\n  })();\n  function set_distance()\
  \ {\n    let dist_out = document.getElementById('dist_out');\n    let x1 = document.getElementById('x1');\n\
  \    let x2 = document.getElementById('x2');\n    let y1 = document.getElementById('y1');\n\
  \    let y2 = document.getElementById('y2');\n\n    let dist = distance(x1.value,\
  \ y1.value, x2.value, y2.value);\n    dist_out.innerHTML = dist;\n  }\n</script>\n\
  ...\n```\n\n示例 10-10：测试 `debugger.wasm` 的 HTML 文件\n\n将 `debugger.html` 加载到 Firefox\
  \ 并打开控制台；然后点击**调试器 (Debugger)** 选项卡访问 Firefox 调试器。从左侧的**源 (Sources)** 选项卡中选择 `debugger.wasm`\
  \ 以查看你的 WAT 代码的反汇编版本，它看起来应该像图 10-18。\n\n![f10018](img/f10018.png)\n\n图 10-18：Firefox\
  \ 调试器中的 WAT 代码\n\n这段代码是 WebAssembly 二进制的反汇编，因此函数和变量的名称不再可用。此结果类似于对网络上找到的二进制文件进行反汇编时看到的内容。由于\
  \ `wat2wasm` 尚不支持源 map，我们无法在调试器中步执行原始源代码。相反，你需要对原始代码和反汇编代码进行并对比较。示例 10-11 显示了该反汇编代码的样子。\n\
  \n```\n(module\n\n  (type $type0 (func (param f64 f64 f64 f64) (result f64)))\n\
  \  (export \"distance\" (func $func0))\n1 (func $func0\n    (param 2$var0 f64)(param\
  \ 3$var1 f64)(param 4$var2 f64)(param 5$var3 f64)\n    (result f64)\n    (local\
  \ 6$var4 f64) (local 7$var5 f64)\n    local.get $var0\n    local.get $var2\n   \
  \ f64.sub\n    local.tee $var4\n    local.get $var4\n    f64.mul\n    local.get\
  \ $var1\n    local.get $var3\n    f64.add\n    local.tee $var5\n    local.get $var5\n\
  \    f64.mul\n    f64.add\n    f64.sqrt\n  )\n)\n```\n\n示例 10-11：Firefox 反汇编生成的\
  \ WAT 代码\n\n这段代码是从 WebAssembly 二进制文件反汇编出来的，它感知不到我们赋予变量或函数的标签。它也无法感知代码中的任何注释。如果你回看原始\
  \ WAT 代码（示例 10-9），你可以看到函数 `$distance` 变成了 `$func0` 1。参数变量 `$x1`、`$y1`、`$x2` 和 `$y2`\
  \ 分别变成了 `$var0`、`$var1`、`$var2` 和 `$var3`。局部变量 `$x_dist` 和 `$y_dist` 变成了 `$var4`\
  \ 和 `$var5`。\n\n\n\n\n\n```wat\n1 func (param f64 f64 f64 f64) (result f64)\n2 (local\
  \ f64 f64)\n  local.get 0\n  local.get 2\n  f64.sub\n  local.tee 4\n  local.get\
  \ 4\n  f64.mul\n  local.get 1\n  local.get 3\n  f64.add\n  local.tee 5\n  local.get\
  \ 5\n  f64.mul\n  f64.add\n  f64.sqrt\nend\n```\n\n列表 10-12: 调试器中的 Chrome WAT 反汇编\n\
  \n注意 Chrome 使用索引来表示局部变量、参数和函数。函数 `1` 没有关联名称，其任何参数或局部变量 `2` 也是如此。全局变量和类型也是如此。如果我们使用全局变量，将使用\
  \ `global.get` 和 `global.set`，并传入一个与变量定义顺序对应的索引数字。\n\nChrome 调试功能的一个很棒特性是你可以在“作用域”（Scope）窗口中访问堆栈。当你步执行代码时，可以观察值如何推入堆栈和从堆栈中弹出。缺点之一是，“监视”（Watch）窗口没有\
  \ Firefox 中那么好用，因为 Chrome 并没有像 JavaScript 变量那样提供变量。\n\n与 Firefox 一样，Chrome 有“恢复”按钮\
  \ ![i10005](img/i10005.png)、“单步跳”按钮 ![i10006](img/i10006.png)、“单步入”按钮 ![i10007](img/i10007.png)\
  \ 和“单步出”按钮 ![i10008](img/i10008.png)，如图 10-23 所示。\n\n![f10023](img/f10023.png)\n\
  \n图 10-23: 在 Chrome 调试器中查看堆栈\n\n## 总结\n\n在本章中，我们在 Chrome 和 Firefox 中使用了各种技术调试 WAT\
  \ 代码。我们比之前的章节更地查看了控制台日志。然后，我们使用 JavaScript 的 `alert` 函数停止执行并等待用户指令。我们还探索了使用 `console.trace`\
  \ 记录堆栈跟踪，并讨论了 Chrome 和 Firefox 中堆栈跟踪工作方式的差异。最后，我们使用了 Chrome 和 Firefox 内置的调试器。\n\n\
  调试 WebAssembly 有许多可用选项。某些选项（例如使用 Chrome 或 Firefox 调试器）仍在开发中。你决定使用什么种工具取决于代码以及你调试时的目标。在下一章中，我们将使用\
  \ WebAssembly 构建 Node.js 模块。\n\n# 11 AssemblyScript\n\n![](img/chapterart.png)\n\
  \nAssemblyScript 是一种专门设计用于编译为 WebAssembly 或 WAT 的高级语言。AssemblyScript 比 WAT 更具表现力，但可以编译为\
  \ WAT。当你使用 AssemblyScript 时，你会失去一些在 WAT 中拥有的细粒化优化控制，但编写速度要快得多。\n\n我们将从创建一个简单的 `AddInt`\
  \ 函数开始本章，就像我们在第 1 章创建的 `AddInt` 一样。我们将编写一个 AssemblyScript 的 hello 世界程序并将其编译为 WAT，以查看\
  \ AssemblyScript 编译器生成的 WebAssembly。我们将检查 AssemblyScript 对长度前缀字符串的使用，然后安装 AssemblyScript\
  \ 加载器，看看它可以如何方便在 AssemblyScript 和 JavaScript 之间传输字符串。我们将通过编写一个字符串拼接程序将字符串传递给 AssemblyScript。我们还将探索\
  \ AssemblyScript 中的面向对象（OOP）。我们将创建几个类来演示类继承，并讨论防止 AssemblyScript 将属性导出到嵌入环境的 `private`\
  \ 属性。接下来，我们将编写 JavaScript 允许我们直接创建 `public`、`private` 和 `protected` 成员，并使用 AssemblyScript\
  \ 加载器。然后我们将比较直接函数调用和加载器调用的性能。\n\nAssemblyScript 团队将其设计得类似于 TypeScript 和 JavaScript。与\
  \ WAT 不同，AssemblyScript 是一种高级语言，具有类、字符串和数组等特性。除了高级特性外，AssemblyScript 还允许用户使用类似 WAT\
  \ 的低级内存命令进行代码编写。AssemblyScript 有一个`命令行界面 (CLI)`，可以将 AssemblyScript 编译为 WebAssembly\
  \ 模块，供 JavaScript 应用程序内部使用。\n\n对于兴趣使用 WebAssembly 提高 JavaScript 应用性能的 JavaScript\
  \ 开发者来说，AssemblyScript 是一个很棒的工具。遗憾的是，正如 WebAssembly 中的一切，仅仅调整你的 TypeScript 直到它被\
  \ AssemblyScript 编译器编译可能不会带来显著的性能提升。理解 AssemblyScript 在底层做了什么，允许你使用一种看起来像 JavaScript\
  \ 但运行起来像 C++ 的语言编写代码。为了获得这种理解，我们将 AssemblyScript 代码编译为 WAT，以探索 AssemblyScript 编译器的输出。\n\
  \n## AssemblyScript CLI\n\n使用以下命令安装 AssemblyScript：\n\n```\nnpm install assemblyscript\
  \ -g\n```\n\n`npm` 命令全局安装 AssemblyScript，这允许你从命令行使用 AssemblyScript 编译器 `asc` 命令。运行\
  \ `asc -h` 会提供编译器命令示例和选项的列表。\n\n我不会解释所有的命令行参数，但会提到几个有用的。`-O` 选项的优化方式与第 9 章中的 `wasm-opt`\
  \ 相同。你在 `-O` 后面跟一个 0 到 3 的数字、`s` 或 `z`，指示编译器进行优化。`--sourceMap` 标志会创建一个源映射文件（source\
  \ map file）以帮助你调试 AssemblyScript。`-o` 标志后跟文件名告诉编译器输出 WAT。或者，我们可以编译一个 *.wasm* 文件，例如\
  \ *output.wasm*，这将输出一个 WebAssembly 二进制文件。我们首先创建一个简单的 `AddInt` 函数，就像我们在第 1 章创建的 `AddInt`\
  \ 一样。\n\n**addInt.ts**\n\n```typescript\nexport function AddInts(a: i32, b: i32):\
  \ i32 {\n  return a + b;\n}\n```\n\n列表 11-1: 相加两个整数\n\n我们使用 `export` 关键字让 JavaScript\
  \ 使用 `AddInts` 函数。它接受两个 `i32` 参数 `a` 和 `b`，并返回一个 `i32`。使用命令编译 *addInt.ts*：\n\n```\n\
  asc addInt.ts -Oz -o add.wat\n```\n\n列表 11-2: 将 `AddInt` 编译为 WAT\n\n`-Oz` 标志使输出二进制文件的尽可能最小。最后一个标志\
  \ `-o add.wat` 告诉编译器输出 WAT。当我们查看 *add.wat* 文件时，我们看到了列表 11-3 中的 WAT 代码。\n\n```wat\n\
  (module\n  (type $i32_i32_=>_i32 (func (param i32 i32) (result i32)))\n  (memory\
  \ $0 0)\n  (export \"AddInts\" (func $add/AddInts))\n  (export \"memory\" (memory\
  \ $0))\n  (func $add/AddInts (param $0 i32) (param $1 i32) (result i32)\n    local.get\
  \ $0\n    local.get $1\n    i32.add\n  )\n)\n```\n\n列表 11-3: 编译为 WAT 的 AssemblyScript\
  \ `AddInts` 函数\n\n在 AssemblyScript 中编写代码比直接在 WAT 中编写代码容易得多。这段代码产生 `AddInts` 导出一个接受两个\
  \ `i32` 参数并返回一个 `i32` 的函数。输出函数使用 `local.get` 获取第一个和第二个参数，并使用 `i32.add` 相加这两个值。\n\
  \n## Hello AssemblyScript\n\n接下来，我们将为第 2 章的 WAT hello 世界程序构建 AssemblyScript 版本。创建一个名为\
  \ *as_hello.ts* 的新 AssemblyScript 文件，并添加列表 11-4 中的代码。\n\n**as_hello.ts**\n\n```typescript\n\
  declare function console_log( msg: string ):void;\n\nexport function HelloWorld():void\
  \ {\n  console_log(\"hello world!\");\n}\n```\n\n\n\n\n\n## 列表 11-4：一个 hello world\
  \ AssemblyScript 应用\n\nAssemblyScript 中的函数声明必须与传入 WebAssembly 模块的 JavaScript 函数对应。因此，我们需要通过\
  \ `importObject` 传入一个函数，将我们的字符串打印到控制台。`declare` `function` 1 从 JavaScript 导入 `console_log`\
  \ 函数。该函数将字符串从 AssemblyScript 传回给调用的 JavaScript 应用。我们创建了一个名为 `HelloWorld` 2 的 `export`\
  \ `function`，它调用导入的 `console_log` 3 函数，并传入字符串 `\"hello world!\"`。在将其编译为 WebAssembly\
  \ 模块之前，我们将使用 `asc` 编译 WAT 文件，以便查看生成的 WebAssembly（见 列表 11-5 ）。\n\n```\nasc as_hello.ts\
  \ -Oz -o as_hello.wat\n```\n\n列表 11-5：将 AssemblyScript 文件 `as_hello.ts` 编译为 `as_hello.wat`。\n\
  \n然后，我们可以在 列表 11-6 中打开 `as_hello.wat` 以查看 AssemblyScript 生成的 WebAssembly。\n\n```\n\
  ;; 注释由作者添加，并非由 asc 生成 1\n(module\n  (type $none_=>_none (func))\n  (type $i32_=>_none\
  \ (func (param i32)))\n  ;; AssemblyScript 顶部的 declare 命令创建了一个导入\n  ;; 它导入了外部 as_hello\n\
  \  ;; 对象内部的 console_log 函数\n  ;; AssemblyScript 要求在 AssemblyScript 文件中列出导入\n  ;;\
  \ 不包含 .ts 扩展\n  (import \"as_hello\" \"console_log\" (func $as_hello/console_log\
  \ (param i32))) 2\n  ;; 使用字符串会自动创建内存表达式\n  (memory $0) 3\n  ;; 下面的数据行是因为该行太长了\n\
  \  ;; \"hello world!\" 字符串前面有一个头部，并且字符串中的每个字母\n  ;; 都有十六进制字节 00。这是因为 AssemblyScript\
  \ 使用的是\n  ;; UTF-16 字符集，而不是我们在 WAT 中处理\n  ;; 字符串时使用的 ASCII。\n  (data (i32.const\
  \ 16) 4\n    \"\\18\\00\\00\\00\\01\\00\\00\\00\\18\\00\\00\\00\\68\\00\\65\\00\\\
  6c\\00\\6c\\00\\6f\\00\\77\\0072\\00d!\")\n  (export \"memory\" (memory $0))\n \
  \ ;; 模块以我们给 AssemblyScript 的名称导出了我们的函数\n  (export \"HelloWorld\" (func $as_hello/HelloWorld))\
  \ 5\n  ;; 我们给 AssemblyScript 的函数名带有文件名的名前缀\n  ;; 不包含 .ts 扩展\n  (func $as_hello/HelloWorld\
  \ (;) 6\n  ;; 32 是 \"hello world\" 中 'h' 在线性内存中的位置\n  i32.const 32 7\n  ;; 调用 console_log\
  \ 函数，并传入 \"hello world\"\n  ;; 在线性内存中的位置\n  call $as_hello/console_log 8\n  )\n\
  ```\n\n列表 11-6：从 `as_hello.ts` 生成的 `as_hello.wat` 文件\n\n我添加了注释来说明代码 1。此模块导入了封装在\
  \ `as_hello` 对象中的 `console_log` 2，该名称是我们不包含 `.ts` 扩展的 AssemblyScript 文件名。这是 AssemblyScript\
  \ 用于其 `importObject` 使用的命名规范；AssemblyScript 创建了一个 `memory` 3 表达式来存储字符串数据。字符串有一个前缀头部，包含字符串长度，AssemblyScript\
  \ 使用它来处理来自 WebAssembly 的数据。字符串 `data` 4 每个字符使用两个字节，因为 AssemblyScript 使用 UTF-16，所以此示例中的每个字符都由空字节\
  \ `\\00` 隔开。UTF-16 是 Unicode 字符集的 16 位版本，允许许多 ASCII 中不包含的额外字符。在数据表达式之后，WAT 导出了 5\
  \ 我们在 AssemblyScript 中给出的函数名称，该名称带有 `$` 字符前缀且不包含 `.ts` 扩展。`HelloWorld` 6 函数调用 `console_log`\
  \ 8，传入了我们的 `hello world!` 字符串在线性内存中第一个字符的位置，即 `32` 7。\n\n编译好 WAT 文件后，我们可以使用 列表 11-7\
  \ 中的 `asc` 命令来编译我们的 WebAssembly 模块。\n\n```\nasc as_hello.ts -Oz -o as_hello.wasm\n\
  ```\n\n列表 11-7：将我们的 AssemblyScript 编译为 WebAssembly 二进制\n\n接下来，我们编写 JavaScript。\n\
  \n### 用于 World App 的 JavaScript\n\n目前，我们有一个名为 `as_hello.wasm` 的 WebAssembly 模块。接下来，我们将编写一个加载并运行该模块的\
  \ Node.js 应用。在本节中，我们将按照第五章的方法解码字符串数据，以理解 AssemblyScript 如何将字符串传递给 JavaScript。然后我们将使用\
  \ AssemblyScript 加载工具来完成大部分大部分工作。\n\n首先，我们将编写一个函数，使用 WebAssembly 模块传递的索引从线性内存中提取字符串。AssemblyScript\
  \ 将字符串长度放在字符串数据之前的四个字节中。我们可以使用 `Uint32Array` 获取字符串长度，并使用该长度在 JavaScript 中创建字符串。创建一个名为\
  \ `as_hello.js` 的文件，并在 列表 11-8 中添加代码。\n\n**as_hello.js**\n\n```javascript\nconst\
  \ fs = require('fs');\nconst bytes = fs.readFileSync(__dirname + '/as_hello.wasm');\n\
  \n// 内存对象是从 AssemblyScript 导出的\nvar memory = null;\n\nlet importObject = {\n\n//\
  \ 模块的文件名作为外部对象名称\n\n```javascript\nas_hello: {\n    // AssemblyScript 传递一个带有长度前缀的字符串和一个索引\n\
  \  console_log: function (index) {\n      // 防止在内存设置之前调用\n      if (memory == null)\
  \ {\n        console.log('memory buffer is null');\n        return;\n      }\n\n\
  \    const len_index = index - 4;\n\n      // 必须除以 2 将字节转换为 16 位 Unicode 字符\n  \
  \  const len = new Uint32Array(memory.buffer, len_index, 4)[0];\n    const str_bytes\
  \ = new Uint16Array(memory.buffer, index, len);\n\n      // 将 utf-16 字节数组解码为 JS\
  \ 字符串\n    const log_string = new TextDecoder('utf16').decode(str_bytes);\n    \
  \  console.log(log_string);\n    }\n  },\n  env: {\n    abort: () => { } \n  }\n\
  };\n\n(async () => {\n  let obj = await WebAssembly.instantiate(new Uint8Array(bytes),\n\
  \    importObject);\n\n  // 从 AssemblyScript 导出的内存对象\n  memory = obj.instance.exports.memory;\n\
  \  // 调用 HelloWorld 函数\n  obj.instance.exports.HelloWorld();\n})();\n```\n\n列表 11-8：从\
  \ JavaScript 调用 AssemblyScript 的 `HelloWorld`\n\n\n\n\n我们使用 `new Uint16Array` 6\
  \ 从线性内存中检索字符串字节数据，并使用新的 `TextDecoder` 将该字节数组转换为 JavaScript 字符串，其解码用于 `utf-16` 文本数据。代码调用\
  \ `TextDecoder` 7 的 `decode` 函数传入字符串数据，返回一个 JavaScript 字符串，我们随后将其打印到控制台。我们使用一个 IIFE（立即执行函数）来实例化\
  \ AssemblyScript WebAssembly 模块。注意，在调用 `HelloWorld` 9 函数之前，我们必须将 `memory` 8 对象设置为从\
  \ WebAssembly 模块导出的内存对象。`console_log` 函数使用了 `memory` 对象，如果没有设置它，调用 `HelloWorld`\
  \ 将不会任何作用。\n\n幸运的是，有一种更简单的方法可以在 AssemblyScript 和 JavaScript 之间移动字符串数据，那就是使用 AssemblyScript\
  \ 加载器（loader）。这段代码由 AssemblyScript 团队提供。在“加载器与直接调用 WebAssembly 的性能（Performance of\
  \ Loader vs. Direct WebAssembly Calls）”部分，我们将看到是否能通过编写的代码来提高 AssemblyScript 加载器的性能。\n\
  \n### 使用 AssemblyScript 加载器实现 Hello World\n\n### AssemblyScript 加载器是 AssemblyScript\
  \ 团队提供的一组辅助函数，旨在让从 JavaScript 调用 AssemblyScript 变得更容易。我们将之前编写的代码与使用 AssemblyScript\
  \ 加载器编写的代码进行对比。最初，我们将考虑易用性，稍后将研究使用或使用加载器对性能的影响。\n\n我们使用 AssemblyScript 加载器从 AssemblyScript\
  \ 向 JavaScript 发送字符串。加载器辅助函数会将来自 WebAssembly 的索引转换为 JavaScript 字符串。现在，我们将使用 `npm`\
  \ 安装加载器：\n\n```\nnpm install @assemblyscript/loader --save\n```\n\n现在，我们将创建一个 JavaScript\
  \ 文件来加载并运行我们的 WebAssembly 模块。创建一个名为 `as_hello_loader.js` 的文件，并添加 Listing 11-9 所示的代码。\n\
  \n**as_hello_loader.js**\n\n```javascript\n1 const loader = require(\"@assemblyscript/loader\"\
  );\nconst fs = require('fs');\n2 var module;\n\nconst importObject = {\n3 as_hello:\
  \ {\n  4 console_log: (str_index) => {\n    5 console.log(module.exports.__getString(str_index));\n\
  \    }\n  }\n};\n\n(async () => {\n  let wasm = fs.readFileSync('as_hello.wasm');\n\
  6 module = await loader.instantiate(wasm, importObject);\n7 module.exports.HelloWorld();\n\
  })();\n```\n\nListing 11-9: 使用 AssemblyScript 加载器调用 WebAssembly 模块\n\n此 JavaScript\
  \ 函数首先引入了 1 AssemblyScript 加载器。我们使用此加载器对象来加载 `module` 2 对象，我们将其声明为全局。`module` 对象是一个\
  \ AssemblyScript 加载器模块，包含了额外的 AssemblyScript 加载器辅助函数。`importObject` 内部有一个子对象，其名称与我们的\
  \ AssemblyScript 模块 `as_hello` 3 一致。这就是 AssemblyScript 代码预期用于定位已导入函数的地方。在 `as_hello`\
  \ 对象内部是 `console_log` 4，它接受字符串索引 `str_index` 作为唯一参数。该函数使用了加载器创建的 `module` 对象上的 `__getString`\
  \ 5 函数。当给定字符串索引时，`__getString` 函数会从线性内存中检索一个 JavaScript 字符串。该字符串通过 `console.log`\
  \ 打印到控制台。IIFE 函数使用 AssemblyScript `loader` 6 对象加载 AssemblyScript 模块。最后，IIFE 调用了\
  \ `HelloWorld` 7 函数。当你使用 `node` 运行此 JavaScript 文件时，你将在 Listing 11-10 中看到输出。\n\n\
  ```\nhello world!\n```\n\nListing 11-10: AssemblyScript hello world 应用的输出\n\n使用\
  \ AssemblyScript 加载器使 JavaScript 代码变得显著简单。稍后在“加载器与直接调用 WebAssembly 的性能”部分，我们将探索性能的影响。\n\
  \n### AssemblyScript 字符串拼接\n\n现在我们已经知道如何从 AssemblyScript 接收字符串，现在我们将向 AssemblyScript\
  \ 模块发送一个字符串。接下来的这个函数将拼接两个用管道符（`|`）分隔的字符串。我们将使用加载器来让 JavaScript 侧的代码编写更加容易。字符串拼接在\
  \ WAT 中直接实现具有挑战性，但在 AssemblyScript 中非常简单。创建一个名为 `as_concat.ts` 的新文件，并添加 Listing\
  \ 11-11 所示的代码。\n\n**as_concat.ts**\n\n```typescript\n1 export function cat( str1:\
  \ string, str2: string ): string {\n2 return str1 + \"|\" + str2;\n}\n```\n\nListing\
  \ 11-11: 使用 AssemblyScript 拼接字符串\n\n我们导出了 1 `cat`，它接受两个字符串参数并返回一个字符串。该函数拼接 2 用管道符（`|`）分隔的字符串。\n\
  \n现在我们可以使用 Listing 11-12 中的 `asc` 命令编译 `as_concat.ts`。\n\n```bash\nasc as_concat.ts\
  \ --exportRuntime -Oz -o as_concat.wasm\n```\n\nListing 11-12: 使用 `asc` 编译 `as_concat.ts`\
  \ 文件\n\n我们传递了 `--exportRuntime` 标志，这对于将字符串传递到 WebAssembly 模块是必须的。使用 `--exportRuntime`\
  \ 编译会添加允许你调用 WebAssembly 模块的代码。如果我们未能导出运行时，将会发生以下错误：\n\n```\nTypeError: alloc is\
  \ not a function\n```\n\n当你将 `as_concat.ts` 编译为 WAT 时，注意 WAT 文件比我们的 `as_concat.ts`\
  \ 大得多。现在我们可以编写 JavaScript 应用。Listing 11-13 中的代码在线性内存中创建字符串并调用 AssemblyScript 函数。\n\
  \n**as_concat.js**\n\n```javascript\nconst fs = require('fs');\nconst loader = require(\"\
  @assemblyscript/loader\");\n\n(async () => {\n  let module = await loader.instantiate(fs.readFileSync('as_concat.wasm'));\n\
  \n  //__newString, __getString functions require\n//compile with exportRuntime\n\
  1 let first_str_index = module.exports.__newString(\"first string\");\n2 let second_str_index\
  \ = module.exports.__newString(\"second string\");\n3 let cat_str_index = module.exports.cat(first_str_index,second_str_index);\n\
  4 let cat_string = module.exports.__getString(cat_str_index);\n5 console.log(cat_string);\n\
  })();\n```\n\nListing 11-13: JavaScript 使用 AssemblyScript 加载器调用 `cat` 函数\n\n我们在\
  \ WebAssembly 模块中定义的 `cat` 函数不直接接受字符串作为参数，因此它需要一个线性内存索引。`module.exports.__newString`\
  \ 加载器辅助函数接收 JavaScript 字符串，将其复制到线性内存，并返回一个索引传递给 `module.cat`。我们调用两次 `module.exports.__newString`，分别传入\
  \ `\"first string\"` 1 和 `\"second string\"` 2。这些调用返回返回索引，我们将其存储在 `first_str_index`\
  \ 和 `second_str_index` 中。接下来，我们调用 `module.exports.cat` 并传入这些索引，从中接收一个 JavaScript\
  \ 字符串索引，并存储在 `cat_str_index` 中。然后我们调用 `module.exports.__getString` 4 传入 `cat_str_index`，并将字符串存储在\
  \ `cat_string` 5 中，将其打印到控制台。\n\n\n\n\nAssemblyScript 还有很多可以探索的内容。正如你所见，在 AssemblyScript\
  \ 中编写处理字符串的代码比在 WAT 中要简单得多。这并不意味着你何时应该在 WebAssembly 中处理字符串数据，但它将其作为一个选项暴露了出来。AssemblyScript\
  \ 与同广义的 WebAssembly 一样，是一个快速发展的项目。花时间从 [assemblyscript.org](http://assemblyscript.org)\
  \ 项目主页学习更多关于它的知识是值得的。\n\n## AssemblyScript 中的面向对象编程\n\n在 WAT 格式中几乎无法使用 OOP，但因为 AssemblyScript\
  \ 基于 TypeScript 建模的，它为 OOP 提供了更多的选项。在本节中，我们将介绍 AssemblyScript 中 OOP 的基础知识，以及一些局限性，这些局限性在未来的版本中可能不再适用。\n\
  \n让我们创建一个名为 `vector.ts` 的新 AssemblyScript 文件。目前，AssemblyScript 借用了 TypeScript 的文件格式，这在大多数情况下都是有效的。\n\
  \nSaule Cabrera 为 VS Code 创建了一个 AssemblyScript 语言服务器插件，地址为 [`marketplace.visualstudio.com/items?itemName=saulecabrera.asls.`](https://marketplace.visualstudio.com/items?itemName=saulecabrera.asls.)。接下来，我们将编写一个\
  \ AssemblyScript `Vector2D` 类，用于存储碰撞体对象的坐标，这与我们在第 8 章为碰撞检测应用编写的代码类似。我们将代码编译为 WAT，以便我们可以探索\
  \ AssemblyScript 编译器的输出。在优化 WebAssembly 代码时，更好地理解编译器及其输出非常有有利。在你的文件中添加 Listing 11-14\
  \ 来创建 `Vector2D` 类。\n\n**vector.ts**\n\n```\n1 export class Vector2D {\n2 x: f32;\n\
  3 y: f32;\n\n4 constructor(x: f32, y: f32) {\n    this.x = x;\n    this.y = y;\n\
  \  }\n\n5 Magnitude(): f32 {\n    return Mathf.sqrt(this.x * this.x + this.y * this.y);\n\
  \  }\n}\n```\n\nListing 11-14：在 AssemblyScript 中创建向量类\n\n我们导出一个名为 `Vector2D` 的类\
  \ 1，它有两个属性 `x` 2 和 `y` 3。它还有一个 `constructor` 4，可以根据 `x` 和 `y` 参数创建一个新的 `Vector2D`\
  \ 对象。`Magnitude` 5 方法通过相加 `x` 和 `y` 的平方并对该和取平方根来计算向量的模。\n\n如果你熟悉 TypeScript，你会发现这段代码看起来和\
  \ TypeScript 中的 `class` 结构完全一样。然而，我们没有使用 TypeScript 的 `number` 类型，而是使用 `f32` 类型来表示\
  \ 32 位浮点数。如果你在 AssemblyScript 中使用 `number` 类型，它等同于使用 `f64` 64 位浮点数，在大多数情况下这是 WebAssembly\
  \ 类型中性能最差的。\n\n以下命令使用 `asc` 将 `vector.ts` 编译为 WAT 文件：\n\n```\nasc vector.ts -o vector.wat\n\
  ```\n\n这创建了一个可以在 VS Code 中检查的 WAT 文件。向 `asc` 传递 AssemblyScript 文件的名称，然后传递 `-o` 标志以及输出文件的文件名\
  \ `vector.wat`。扩展名决定了输出是 WAT 还是 WebAssembly 二进制文件。打开 `vector.wat` 并向下滚动，直到看到 Listing\
  \ 11-15 中所示导出。\n\n**vector.wat**\n\n```\n...\n  (export \"memory\" (memory $0))\n\
  \  (export \"Vector2D\" (global $vector/Vector2D))\n1 (export \"Vector2D#get:x\"\
  \ (func $vector/Vector2D#get:x))\n2 (export \"Vector2D#set:x\" (func $vector/Vector2D#set:x))\n\
  3 (export \"Vector2D#get:y\" (func $vector/Vector2D#get:y))\n  (export \"Vector2D#set:y\"\
  \ (func $vector/Vector2D#set:y))\n4 (export \"Vector2D#constructor\" (func $vector/Vector2D#constructor))\n\
  5 (export \"Vector2D#Magnitude\" (func $vector/Vector2D#Magnitude))\n...\n```\n\n\
  Listing 11-15：我们 WAT 文件中的导出函数\n\n注意编译器如何为属性 `x` 2 和 `y` 3 生成了 `get` 1 和 `set` 2\
  \ 访问函数，并导出了它们以便你可以从嵌入环境访问它们。这表明当用户使用加载器设置对象属性时，它会调用 WebAssembly 模块中的函数。其一个影响是，如果你同时设置多个属性，出于性能考虑，你可能想要创建一个函数一次性完成所有操作。这样，你就不需要对\
  \ WebAssembly 模块进行多次函数调用。你还可以看到 WebAssembly 模块导出了 `constructor` 4 和 `Magnitude`\
  \ 5 函数。\n\n如果你想从 JavaScript 调用 WebAssembly 模块中的函数，理解命名约定至关重要。所有方法都以类名名前缀……（此处省略了重复的命名约定描述）。\n\
  \n\n\n\n创建 `vector.js` 文件并添加 Listing 11-18 中的代码。\n\n`vector.js`\n\n```\n1 const\
  \ fs = require('fs');\n\n2 (async () => {\n3 let wasm = fs.readFileSync('vector.wasm');\n\
  4 let obj = await WebAssembly.instantiate(wasm,{env:{abort:()=>{}}});\n\n5 let Vector2D\
  \ = {\n  6 init: function (x, y) {\n      return obj.instance.exports\"Vector2D#constructor\"\
  \n    },\n  7 Magnitude: obj.instance.exports[\"Vector2D#Magnitude\"],\n}\n\n8 let\
  \ vec1_id = Vector2D.init(3, 4);\n  let vec2_id = Vector2D.init(4, 5);\n\n  console.log(`\n\
  \  9 vec1.magnitude=${Vector2D.Magnitude(vec1_id)}\n    vec2.magnitude=${Vector2D.Magnitude(vec2_id)}\n\
  \    `);\n})();\n```\n\nListing 11-18: 在 `Vector2D` AssemblyScript 类上调用函数\n\n我们使用\
  \ Node.js 模块 `fs` 在一个异步 IIFE 2 中从文件中加载 3 二进制 WebAssembly 数据。一旦我们有了二进制数据，将其传递给 `WebAssembly.instantiate`\
  \ 4，它会返回一个 WebAssembly 模块对象。然后我们创建 JavaScript 对象 `Vector2D` 5，它镜像了 WebAssembly 模块内部的函数。\n\
  \n我们创建了一个 `init` 6 函数，它调用 WebAssembly 模块的 `Vector2D` `constructor`，并将 `0` 作为第一个参数传递。将此值传递给\
  \ `constructor` 函数允许在线性内存中对对象的位置进行一定程度的选择。我们传递了 `0`，这使得构造函数在下一个可用内存位置创建一个新对象。该函数将返回在线性内存中创建该对象的位置。`Vector2D`\
  \ 中的 `Magnitude` 7 属性从 `obj.instance.exports[\"Vector2D#Magnitude\"]` 获取值，这是我们 WebAssembly\
  \ 模块中的一个函数。\n\n在定义了 JavaScript `Vector2D` 对象后，我们调用两次 `Vector2D.init` 8，在线性内存中创建两个\
  \ `Vector2D` WebAssembly 对象，并返回这些对象的线性内存地址，我们将其用于方法调用。然后我们在一个 `console.log` 模板字符串内部调用两次\
  \ `Vector2D.Magnitude`。我们传递了在 Listing 11-18 中保存的向量 ID（`vec1_id` 和 `vec2_id`），它们告诉\
  \ WebAssembly 模块它正在使用哪个对象。`Magnitude` 9 函数返回给定向量的模，应用程序将其打印到控制台。使用 `node` 运行此应用：\n\
  \n```\nnode vector.js\n```\n\n结果如下：\n\n```\nvec1.magnitude=5\nvec2.magnitude=6.4031243324279785\n\
  ```\n\n这两个值分别是我们的第一个向量（`x = 3` 和 `y = 4`）的模，以及第二个向量（`x = 4` 和 `y = 5`）的模。\n\n现在我们已经知道如何直接调用我们的\
  \ AssemblyScript 应用，让我们看看如何使用 AssemblyScript 加载器让 JavaScript 编码变得简单一点。\n\n### AssemblyScript\
  \ Loader\n\n现在我们将修改我们的 AssemblyScript 代码以使用 AssemblyScript 加载器库。这将允许我们从易用性和性能方面比较与\
  \ AssemblyScript 模块进行交互的方法。正如之前提到的，了解何时可以提高应用程序性能以及这需要多大的努力是非常重要的。这些信息帮助你做出关于开发时间与应用程序性能之间权衡的决策。\n\
  \n打开 `vector_loader.ts` 并添加 Listing 11-19 中的代码以使用 AssemblyScript 加载器。\n\n`vector_loader.ts`\n\
  \n```\nexport class Vector2D {\n1 x: f32;\n2 y: f32;\n\n  constructor(x: f32, y:\
  \ f32) {\n    this.x = x;\n    this.y = y;\n  }\n\n  Magnitude(): f32 {\n    return\
  \ Mathf.sqrt(this.x * this.x + this.y * this.y);\n  }\n3 add(vec2: Vector2D): Vector2D\
  \ {\n    this.x += vec2.x;\n    this.y += vec2.y;\n    return this;\n  }\n}\n```\n\
  \nListing 11-19: 从 `x` 和 `y` 属性中移除私有修饰符\n\n对 `vector.ts` 有两个更改我们将添加到 `vector_loader.ts`\
  \ 中。首先，我们从 `x` 1 和 `y` 2 属性中移除 `private` 修饰符，以便我们可以从 JavaScript 访问 `x` 和 `y`。其次，我们创建了一个\
  \ `add` 3 函数来添加第二个向量。此函数允许我们将两个向量相加。在 Listing 11-20 中，我们使用 `asc` 编译 `vector_loader.ts`。\n\
  \n```\nasc vector_loader.ts -o vector_loader.wasm\n```\n\nListing 11-20: 编译 `vector.ts`\n\
  \n接下来，我们将创建一个新的 JavaScript 文件 `vector_loader.js`。将 11-21 中的代码添加到 *vector_loader.js*。\n\
  \n\n\n\n\nOOP（面向对象编程）允许开发者通过向基类添加额外的属性或功能来扩展类。AssemblyScript 中扩展类的语法与 TypeScript\
  \ 相同。在列表 11-22 中，我们将用 `Vector3D` 类来扩展 `Vector2D` 类，该类将添加一个额外的属性 `z`，它将代表我们向量的第三个维度。\n\
  \n打开 `vector_loader.ts` 文件，并在 `Vector2D` 定义之后添加列表 11-22 中的代码。\n\n**vector_loader.ts**\n\
  \n```\n...\n1 export class Vector3D extends Vector2D {\n2 z: f32;\n\n  constructor(x:\
  \ f32, y: f32, z: f32) {\n  3 super(x, y);\n    this.z = z;\n  }\n\n4 Magnitude():\
  \ f32 {\n    return Mathf.sqrt(this.x * this.x + this.y * this.y + this.z * this.z);\n\
  \  }\n\n  add(vec3: Vector3D): Vector3D {\n  5 super.add(vec3);\n  6 this.z += vec3.z;\n\
  \    return this;\n  }\n}\n```\n\n列表 11-22：使用 `Vector3D` 类扩展 `Vector2D` 类\n\n新的\
  \ `Vector3D` 类保留了原始的 `x` 和 `y` 属性，并添加了用于第三维度的 `z` 属性。它的构造函数调用了 `super`，运行来自 `Vector2D`\
  \ 类的构造函数。然后它将 `this.z` 的值设置为传入构造函数的 `z` 参数。我们重写了 `Vector2D` 的 `Magnitude` 方法，使其在计算向量幅大时考虑第三维度。然后\
  \ `add` 函数通过 `super.add` 调用 `Vector2D` 类的 `add` 函数，并使用 `vec3` 参数的 `z` 属性值增加 `this.z`\
  \ 的值。\n\n现在我们可以使用 `asc` 重新编译我们的 WebAssembly 模块：\n\n```\nasc vector_loader.ts -o\
  \ vector_loader.wasm\n```\n\n接下来，在列表 11-23 中，我们修改 `vector_loader.js` 文件以引入 `Vector3D`\
  \ 类。\n\n**vector_loader.js**\n\n```\n const fs = require('fs');\n  const loader\
  \ = require(\"@assemblyscript/loader\");\n\n  (async () => {\n    let wasm = fs.readFileSync('vector_loader.wasm');\n\
  \    let module = await loader.instantiate(wasm);\n\n  1 let { Vector2D, Vector3D\
  \ } = await loader.demangle(module).exports;\n\n    let vector1 = Vector2D(3, 4);\n\
  \    let vector2 = Vector2D(4, 5);\n  2 let vector3 = Vector3D(5, 6, 7);\n\n   \
  \ vector2.y += 10;\n    vector2.add(vector1);\n  3 vector3.z++;\n\n    console.log(`\n\
  \    vector1=(${vector1.x}, ${vector1.y})\n    vector2=(${vector2.x}, ${vector2.y})\n\
  \  4 vector3=(${vector3.x}, ${vector3.y}, ${vector3.z})\n\n    vector1.magnitude=${vector1.Magnitude()}\n\
  \    vector2.magnitude=${vector2.Magnitude()}\n  5 vector3.magnitude=${vector3.Magnitude()}\n\
  \    `);\n  })();\n```\n\n列表 11-23：使用 AssemblyScript 加载器 JavaScript 加载 `Vector2D`\
  \ 和 `Vector3D` 类\n\n我们修改了从 `demangle` 调用中获取 `Vector2D` 函数的行，并将其更改为解构结果，创建了 `Vector2D`\
  \ 和 `Vector3D` 函数变量。我们使用函数 `Vector3D` 创建了一个对象 `vector3` 对象，并向其传递了 `x`、`y` 和 `z`\
  \ 值。我们增加了 `vector3.z`，这并无特别的理由，只是为了展示我们可以这样做。在传递给 `console.log` 的模板字符串内部，我们添加了一行来显示\
  \ `vector3` 中的 `x`、`y` 和 `z` 值以及 `vector3` 的幅大。\n\n当你使用 `node` 从命令行运行此 JavaScript\
  \ 时，你将获得列表 11-24 中的输出。\n\n```\n vector1=(3, 4)\n  vector2=(7, 19)\n  vector3=(5,\
  \ 6, 8)\n\n  vector1.magnitude=5\n  vector2.magnitude=20.248456954956055\n  vector3.magnitude=11.180339813232422\n\
  ```\n\n列表 11-24：`vector_loader.js` 的输出\n\n现在让我们看看加载器的性能与直接调用 WebAssembly 模块相比如何。\n\
  \n### 加载器与直接调用 WebAssembly 的性能\n\nAssemblyScript 加载器为 AssemblyScript 模块与我们 JavaScript\
  \ 之间的交互提供了更直观的结构。本章最后一部分比较了加载器与直接调用 WebAssembly 模块。运行此测试，我们不需要编写任何额外的 AssemblyScript。\n\
  \n\n\n\n\n初始化向量后，我们循环了一百万次 4，对这些对象进行调用。我们没有测试每一个函数，因此这不是一个完美的性能测试。目标仅仅是获取一些数字并查看它们之间的对比。只要我们对直接版本和加载器版本进行相同的调用，我们就能得到一个合理的比较。然后，我们使用\
  \ `console.log` 5 记录初始化向量和运行循环所需的时间。这第一个循环测试了不使用 AssemblyScript 加载器的情况下直接调用 WebAssembly\
  \ 模块的性能。接下来，代码测试了带有加载器的模块性能。\n\n我们使用 `loader.demangle` 6 函数来创建 `Vector2D` 和 `Vector3D`\
  \ 工厂函数。然后，我们将 `start_time_loader` 7 初始化为当前时间，并调用 `Vector2D` 8 和 `Vector3D` 函数来创建三个对象，这镜像了第一个循环\
  \ 4 中测试直接初始化调用的代码。我们循环了一百万次 9，执行与之前相同的函数，但是通过加载器执行的。最后，我们 `log` 了使用加载器执行代码所需的时间。\n\
  \n使用 `node` 从命令行运行 `vector_perform.js`：\n\n```\nnode vector_perform.js\n```\n\n\
  这是我执行文件时收到的输出：\n\n```\ndirect time=74\nloader time=153\n```\n\n如你所见，使用加载器的版本执行时间大约是两倍。当我们把初始化包含包含循环中，差异更加明显。如果你打算使用\
  \ AssemblyScript 加载器，最好组织你的代码，使 JavaScript 和 AssemblyScript 之间的调用尽可能少。\n\n## 总结\n\
  \n在本章中，你学习了 AssemblyScript 高级语言、AssemblyScript CLI 以及你可以用于编译 AssemblyScript 应用程序的\
  \ `asc` 命令。\n\n我们创建了一个 `AddInts` 函数和一个 hello world 应用程序，展示了在 AssemblyScript 中编写应用程序与在\
  \ WAT 中编写相同应用程序的对比。我们将其编译为 WAT 格式，查阅了 AssemblyScript 编译器生成的代码，并编写了一个直接运行 hello world\
  \ 应用程序的 JavaScript 应用程序。在此过程中，你学习了如何使用 WAT 来理解由 AssemblyScript 编译器创建的 WebAssembly\
  \ 在底层究竟做什么。\n\n然后，我们安装了 AssemblyScript 加载器，并使用了 AssemblyScript 团队编写的 JavaScript\
  \ 函数来帮助我们编写 JavaScript 代码。\n\n我们讨论了在 AssemblyScript 中使用字符串，编写了一个字符串拼接应用程序，并查看了在使用\
  \ `asc` 编译器时必须使用额外的标志，以便 `asc` 在编译时包含额外的 WebAssembly 库。\n\n在章节的后半部分，我们探索了 AssemblyScript\
  \ 中的 OOP。我们创建了一个类并查看了生成的 WAT 文件的导出。我们查看了 `private` 属性以及它们如何防止 AssemblyScript 导出这些属性，使其无法被嵌入环境使用。我们编写了允许直接创建胶类的\
  \ JavaScript，然后使用 AssemblyScript 加载器为我们创建胶代码。我们比较了直接方法和加载方法的性能。最后，我们用 `Vector3D`\
  \ 类扩展了 `Vector2D` 类，并讨论了 AssemblyScript 和 TypeScript 中类继承的区别。\n\n# 结语\n\n感谢阅读我的书！我希望现在你已经理解\
  \ WebAssembly 在底层是如何工作的，并准备好将其用于高级和低级 Web 开发。WebAssembly 是一项年轻的技术，但它已经出现在每个主流浏览器中。使用\
  \ Node.js，你还可以作为 WebAssembly 模块开发高性能服务器代码。用于开发 WebAssembly 应用程序的语言不断增加。新功能和平台也在不断添加。未来是一个通过\
  \ WebAssembly 实现安全、可靠且快速的 Web 世界。\n\n有关书中的代码更新以及更多 WebAssembly 教程，请访问 [`wasmbook.com`](https://wasmbook.com)。\n\
