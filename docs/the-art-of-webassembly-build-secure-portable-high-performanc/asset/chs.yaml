  \n列表 6-18：WebAssembly 运行后代码遍历内存\n\n### 碰撞检测函数\n\n在其他章节中，我们在 JavaScript 之前定义了 WAT\
  \ 代码。在本节中，JavaScript 初始化了圆的值。因此，我们将先编写 JavaScript。当你对两个圆进行碰撞检测时，你使用勾股定理来确定圆心距离是否大于圆半径之和。本节中的\
  \ WAT 代码遍历我们在 WebAssembly 内存中定义的每个圆，并与其他每个圆进行比较以查看它们是否碰撞。碰撞检测的细节并不是本节的重点，因此我们不会深入探讨。它仅仅是为了演示你如何将数据分离为结构，并使用这些数据通过你的\
  \ WAT 代码进行计算。\n\nWAT 代码的第一部分定义了从 JavaScript 的导入。列表 6-19 显示了 WAT 模块的开头。\n\n**data_structures.wat\
  \ (第 1/6 部分)**\n\n\n\n\n\n```\n(module\n  (import \"env\" \"mem\" (memory 1))  \
  \         \n1 (global $obj_base_addr  (import \"env\" \"obj_base_addr\") i32)\n\
  2 (global $obj_count    (import \"env\" \"obj_count\") i32)\n3 (global $obj_stride\
  \   (import \"env\" \"obj_stride\") i32)\n\n  ;; 属性偏移位置\n4 (global $x_offset   \
  \  (import \"env\" \"x_offset\") i32)\n5 (global $y_offset     (import \"env\" \"\
  y_offset\") i32)\n6 (global $radius_offset  (import \"env\" \"radius_offset\") i32)\n\
  7 (global $collision_offset (import \"env\" \"collision_offset\") i32)\n...\n```\n\
  \n### 列表 6-19：导入定义数据结构的全局变量\n\n传入 WebAssembly 模块的全局变量定义了线性内存的布局以及其中包含的数据结构。全局变量\
  \ `$obj_base_addr` 1 是内存中定义圆形结构的位置。全局变量 `$obj_count` 2 是线性内存中定义的圆的数量。全局变量 `$obj_stride`\
  \ 3 是每个圆形定义之间的字节数。然后，我们导入每个属性属性的值。`$x_offset` 4、`$y_offset` 5、`$radius_offset` 6\
  \ 和 `$collision_offset` 7 是从对象的 `x`、`y`、半径和碰撞标志值的起始位置之间的字节数。这些值必须在该模块内部设置。\n\n接下来，我们将定义\
  \ `$collision_check` 函数。该函数如何运作的细节只有在你对圆形碰撞检测的工作原理感兴趣时才有价值。但作为一个概述，它使用毕股拉斯定理来判断两个圆之间的距离是否小于两个圆半径之和。简而言之，让我们将第一个圆的半径标记为\
  \ R[1]，第二个圆的半径标记为 R[2]，并将两个圆之间的距离标记为 D，如图 6-6 所示。如果 R[1] + R[2] 小于 D，则不会发生碰撞。\n\n\
  ![f06007](img/f06007.png)\n\n图 6-6：如果 R[1] + R[2] 小于两个圆之间的距离，则没有碰撞。\n\n如果距离小于 R[1]\
  \ + R[2]，则发生了碰撞，如图 6-7 所示。\n\n![f06008](img/f06008.png)\n\n图 6-7：R[1] + R[2] 大于两个圆之间的距离。\n\
  \n列表 6-20 显示了 `$collision_check` 函数的代码。\n\n### data_structures.wat（第 6 部分 2）\n\n\
  ```\n...\n1 (func $collision_check\n    (param $x1 i32) (param $y1 i32) (param $r1\
  \ i32)\n    (param $x2 i32) (param $y2 i32) (param $r2 i32)\n    (result i32)\n\n\
  \    (local $x_diff_sq i32)\n    (local $y_diff_sq i32)\n    (local $r_sum_sq i32)\n\
  \n    local.get $x1\n    local.get $x2\n    i32.sub\n    local.tee $x_diff_sq\n\
  \    local.get $x_diff_sq\n    i32.mul\n      2 local.set $x_diff_sq  ;; ($x1 -\
  \ $x2) * ($x1 - $x2)\n\n    local.get $y1\n    local.get $y2\n    i32.sub\n    local.tee\
  \ $y_diff_sq\n    local.get $y_diff_sq\n    i32.mul\n      3 local.set $y_diff_sq\
  \  ;; ($y1 - $y2) * ($y1 - $y2)\n\n    local.get $r1\n    local.get $r2\n    i32.add\n\
  \    local.tee $r_sum_sq\n    local.get $r_sum_sq\n    i32.mul\n      4 local.tee\
  \ $r_sum_sq   ;; ($r1 + $r2) * ($r1 + $r2)\n\n    local.get $x_diff_sq\n    local.get\
  \ $y_diff_sq\n      5 i32.add  ;; 勾股定理 A 平方 + B 平方 = C 平方\n\n      6 i32.gt_u ;;\
  \ 如果距离小于半径之和则返回 true\n)\n...\n```\n\n列表 6-20：一个 WebAssembly 碰撞检测函数\n\n该函数接收两个圆 1\
  \ 的 `x`、`y` 和半径属性，然后如果它们重叠则返回 `1`，如果不重叠则返回 `0`。它首先通过从 `$x1` 减去 `$x2` 来找到两个圆之间的 `x`\
  \ 距离。然后，它将该值平方并存储在 `$x_diff_sq` 2 中；接着它找到两个圆之间的 `y` 距离。我们正在构建的是勾股定理 A² + B² = C²。这两个值的和是\
  \ C²，它与半径之和进行比较。如果半径² 大于 C²，则圆形重叠，函数返回 `1`；否则，函数返回 `0`。这是通过 `i32.gt_u` 6 决定的。在 `$collision_check`\
  \ 函数之后，我们需要一些辅助函数。`get_attr` 函数接收一个对象基和一个属性偏移，并返回该地址的值。列表 6-21 显示了该函数。\n\n### data_structures.wat（第\
  \ 6 部分 3）\n\n```\n...\n1 (func $get_attr (param $obj_base i32) (param $attr_offset\
  \ i32)\n    (result i32)\n    local.get $obj_base\n    local.get $attr_offset\n\
  \  2 i32.add         ;; 基地址加上属性偏移\n  3 i32.load        ;; 加载并返回该值\n  )\n...\n```\n\
  \n从线性内存获取对象属性\n\n在函数定义 1 中，`obj_base` 参数是对象的基地址，`attr_offset` 是我们要检索的属性偏移。函数将这两个值相加\
  \ 2。然后从该地址加载值 3。\n\n下一个辅助函数是 `$set_collision`，它将两个圆形的碰撞标志设置为真。列表 6-22 显示了该函数。\n\n\
  ### data_structures.wat（第 6 部分 4）\n\n```\n...\n1 (func $set_collision\n    (param\
  \ $obj_base_1 i32) (param $obj_base_2 i32)\n    local.get $obj_base_1\n    global.get\
  \ $collision_offset\n  2 i32.add   ;; 地址 = $obj_base_1 + $collision_offset\n   \
  \ i32.const 1\n  3 i32.store ;; 在对象的碰撞属性中存储 1\n\n    local.get $obj_base_2\n   \
  \ global.get $collision_offset\n  4 i32.add   ;; 地址 = $obj_base_2 + $collision_offset\n\
  \    i32.const 1\n  5 i32.store ;; 在对象的碰撞属性中存储 1\n  )\n...\n```\n\n列表 6-22：为给定对象设置碰撞属性\n\
  \n该函数接收两个对象基参数 1，用于设置内存中这些对象的碰撞标志。它通过将 `$obj_base_1` 加上 `$collision_offset` 2，然后将线性内存中该位置的值设置为\
  \ `1` 3。然后它将 `$obj_base_2` 加上 `$collision_offset` 4，并将该位置的值设置为 `1` 5。\n\n现在我们已经定义了其他函数，我们可以在\
  \ WAT 代码中添加 `$init` 函数，如列表 6-23 所示。\n\n**data_structures.wat（第 6 部分 5）**\n\n\n\n\
  \n\n```\n...\n(func $init\n1 (local $i i32)     ;; 外循环计数器\n  (local $i_obj i32)\
  \ ;; 第 i 个对象的地址\n  (local $xi i32)(local $yi i32)(local $ri i32) ;; 对象 i 的 x,y,r\n\
  \n2 (local $j i32)     ;; 内循环计数器\n  (local $j_obj i32) ;; 第 j 个对象的地址\n  (local $xj\
  \ i32)(local $yj i32)(local $rj i32) ;; 对象 j 的 x,y,r\n\n  (loop $outer_loop\n  (local.set\
  \ $j (i32.const 0))  ;; $j = 0\n\n  (loop $inner_loop\n    (block $inner_continue\n\
  \    ;; 如果 $i == $j 继续\n  3 (br_if $inner_continue (i32.eq (local.get $i) (local.get\
  \ $j) ) )\n\n    ;; $i_obj = $obj_base_addr + $i * $obj_stride\n    (i32.add (global.get\
  \ $obj_base_addr)\n           4 (i32.mul (local.get $i) (global.get $obj_stride)\
  \ ) )\n\n    ;; 加载 $i_obj + $x_offset 并存储到 $xi\n  5 (call $get_attr (local.tee $i_obj)\
  \ (global.get $x_offset) )\n    local.set $xi    \n\n    ;; 加载 $i_obj + $y_offset\
  \ 并存储到 $yi\n    (call $get_attr (local.get $i_obj) (global.get $y_offset) )\n  \
  \  local.set $yi    \n\n    ;; 加载 $i_obj + $radius_offset 并存储到 $ri\n    (call $get_attr\
  \ (local.get $i_obj) (global.get $radius_offset) )\n    local.set $ri    \n\n  \
  \  ;; $j_obj = $obj_base_addr + $j * $obj_stride\n  6 (i32.add (global.get $obj_base_addr)\n\
  \             (i32.mul (local.get $j)(global.get $obj_stride)))\n\n    ;; 加载 $j_obj\
  \ + $x_offset 并存储到 $xj\n    (call $get_attr (local.tee $j_obj) (global.get $x_offset)\
  \ )\n    local.set $xj    \n\n    ;; 加载 $j_obj + $y_offset 并存储到 $yj\n    (call $get_attr\
  \ (local.get $j_obj) (global.get $y_offset) )\n    local.set $yj    \n\n    ;; 加载\
  \ $j_obj + $radius_offset 并存储到 $rj\n    (call $get_attr (local.get $j_obj) (global.get\
  \ $radius_offset) )\n    local.set $rj    \n\n    ;; 检查第 i 个和第 j 个对象之间的碰撞\n  7 (call\
  \ $collision_check\n      (local.get $xi)(local.get $yi)(local.get $ri)\n      (local.get\
  \ $xj)(local.get $yj)(local.get $rj))\n\n    if ;; 如果发生碰撞\n    8 (call $set_collision\
  \ (local.get $i_obj) (local.get $j_obj))\n    end\n  )\n\n  9 (i32.add (local.get\
  \ $j) (i32.const 1)) ;; $j++\n\n    ;; 如果 $j < $obj_count 则循环\n    (br_if $inner_loop\n\
  \      (i32.lt_u (local.tee $j) (global.get $obj_count)))\n  )\n\n  a (i32.add (local.get\
  \ $i) (i32.const 1)) ;; $i++\n\n  ;; 如果 $i < $obj_count 则循环\n  (br_if $outer_loop\n\
  \    (i32.lt_u (local.tee $i) (global.get $obj_count) ) )\n )\n)\n...\n```\n\n列表\
  \ 6-23：一个在线性内存中检查每个对象之间碰撞碰撞的双重循环\n\n该函数以两组局部变量开始。一组包含一个计数器、对象地址以及用于外循环的 `x`、`y`\
  \ 和 `r` 局部变量 1。第二批局部变量用于内层 `loop` 2。该函数的核心是一个双重循环，它将线性内存中的每个圆与其他每个圆进行比较，寻找相互碰撞的圆。内层循环的开头检查\
  \ `$i` 是否与 `$j` 相同 3。如果相同，代码将跳过对这个特定 `$j` 对象的检查，否则每个圆都会与自身发生碰撞。\n\n下一行代码计算第 `i`\
  \ 个对象的线性内存地址 4，公式为 `$obj_base_addr` + `$i` * `$obj_stride`。然后，它在下一行的 `(call $get_attr)`\
  \ 5 表达式中使用 `local.tee` 表达式设置 `$i_obj` 的值。此对 `$get_attr` 的调用 5 从第 i 个对象中获取 `x` 的值，然后设置\
  \ `$xi`。\n\n接下来的四行以相同的方式加载值到 `$yi` 和 `$ri` 中。然后，通过调用函数设置 `$xj`、`yj` 和 `$rj` 6。\n\
  \n随后检查第 i 个和第 j 个对象之间的碰撞 7 会调用 `$collision_check`。如果发生碰撞，则 8 会调用 `$set_collision`\
  \ 处理 `$i_obj` 和 `$j_obj`。\n\n9 将 `$j` 增加 1（$j++`）。\n\n如果 `$j < $obj_count` 则循环。\n\
  \na 将 `$i` 增加 1（$i++`）。\n\n如果 `$i < $obj_count` 则循环。\n\n\n\n\n\n到此时，你应该已经了如何在 WAT\
  \ 和 JavaScript 内部操作和设置线性内存。你还应该能够在你的应用程序内部使用线性内存来创建数据结构，并在 WebAssembly 中处理大量数据，然后使用\
  \ JavaScript 显示这些数据。在下一章中，我们将介绍如何从 WebAssembly 操作文档对象模型 (DOM)。\n\n# 第 7 章 Web 应用程序\n\
  \n![](img/chapterart.png)\n\n本章将帮助你理解 WebAssembly 如何通过 JavaScript 与 DOM 交互。尽管这看起来可能繁琐，但为了理解\
  \ WebAssembly 及其优缺点，这是必不可少的。如果你正在使用 WebAssembly 工具链，你需要知道该工具链将生成多少额外的 JavaScript\
  \ 代码作为胶水代码（glue code）。从现在开始，大多数示例将在网页中运行，而不是在命令行中使用 `node`。\n\n我们将首先使用 Node.js 创建一个简单的静态\
  \ Web 服务器。WebAssembly Web 应用程序无法直接从浏览器中的文件系统中加载；相反，它们需要你运行一个 Web 服务器。Node.js 提供了创建\
  \ Web 服务器所需的所有工具。然后我们将编写第一个 WebAssembly Web 应用程序。\n\n我们将编写第二个 Web 应用程序将重用在第 5 章中编写的函数，从\
  \ HTML 中的输入元素获取数字并传递给 WebAssembly，由 WebAssembly 将该数字转换为十进制、十六进制和二进制字符串。\n\n到本章结束，你将理解编写\
  \ Web 应用程序的基础，即加载并实例化 WebAssembly 模块，然后调用该模块内部的函数。应用程序还将将这些模块中的数据写入 DOM 元素。本章中的示例并不代表你通常使用\
  \ WebAssembly 编写的应用程序类型。它们仅演示了网页如何加载、实例化并与 WebAssembly 模块交互。\n\n## DOM\n\n现代基于 Web\
  \ 的应用程序如此复杂，以至于人们很容易忘记 HTML 页面的核心是一个简单的文档。Web 的设计初衷是作为共享文档和信息的手段，但很快人们发现我们需要一种标准方法，使用\
  \ JavaScript 或 Java 等语言动态更新这些文档。DOM 被设计为一种与语言无关的接口，用于操作 HTML 和 XML 文档。因为 HTML 文档是树形结构，DOM\
  \ 将文档表示为逻辑树。DOM 是 JavaScript 和其他语言修改 Web 应用程序中 HTML 的方式。\n\nWebAssembly 1.0 版本没有直接操作\
  \ DOM 的方法，因此 JavaScript 必须对 HTML 文档进行所有修改。如果你使用工具链（如 Rust 或 Emscripten），DOM 的操作通常通过\
  \ JavaScript 胶水代码完成。作为一个一般规则，Web 应用程序的 WebAssembly 部分应专注于处理数值数据，但对于 DOM，大部分数据处理可能可能是字符串操作。在\
  \ WebAssembly 内部进行字符串操作的性能完全取决于你用于该任务的库。因此，DOM 密集型工作最好保留在应用程序的 JavaScript 部分。\n\n\
  ## 设置简单的 Node 服务器\n\n要使用 Node.js 设置静态 Web 服务器，请为项目创建一个文件夹并在 VS Code 或你选择的 IDE 中打开它。我们需要使用\
  \ `npm` 安装两个包。使用列表 7-1 中的命令安装第一个包 `connect`。\n\n```\nnpm install connect --save-dev\n\
  ```\n\n列表 7-1：使用 `npm` 安装 `connect` 包。\n\n使用列表 7-2 中的命令安装第二个包 `serve-static`。\n\n\
  ```\nnpm install serve-static --save-dev\n```\n\n列表 7-2：使用 `npm` 安装 `serve-static`。\n\
  \n安装好包后，创建一个名为 `server.js` 的文件，并输入列表 7-3 中的代码来定义静态 Web 服务器。\n\n**server.js**\n\n\
  ```\nvar connect = require('connect');\nvar serveStatic = require('serve-static');\n\
  connect().use(serveStatic(__dirname + \"/\")).listen(8080, function(){\n  console.log('localhost:8080');\n\
  });\n```\n\n列表 7-3：Node.js http 服务器代码\n\n我们已经创建了一个从当前目录提供服务的静态服务器，但我们还没有任何要提供的文件。使用\
  \ VS Code 创建一个名为 `index.html` 的文件并输入一些 HTML，类似于列表 7-4 中的代码。\n\n**index.html**\n\n\
  ```html\n<<html>\n  <head></head>\n  <body>\n    <h1>我们的服务器工作了！</h1>\n  </body>\n\
  </html>\n```\n\n列表 7-4：一个简单的网页\n\n现在，你可以使用使用以下命令运行你的 Node.js Web 服务器了：\n\n```\n\
  node server.js\n```\n\nWeb 服务器将在端口 8080 上开始运行。通过在浏览器中输入 `localhost:8080` 来测试；你应该能看到类似图\
  \ 7-1 的内容。\n\n![f07001](img/f07001.png)\n\n图 7-1：测试我们的简单静态服务器\n\n现在我们有了一个工作的 Node.js\
  \ Web 服务器，让我们创建第一个 WebAssembly Web 应用程序。\n\n## 我们的第一个 WebAssembly Web 应用程序\n\n我们将从一个简单的\
  \ Web 应用开始，它接收两个数字输入，它们相加并显示这些值。该程序的最终版本可以在 [`wasmbook.com/add_message.html`](https://wasmbook.com/add_message.html)。\n\
  \n此应用程序演示了 WebAssembly 如何与 DOM 交互。你会发现 WebAssembly 部分保持为空。要创建一个 Web 应用，我们必须运行一个\
  \ Web 服务器、带有 JavaScript 的 HTML 页面和一个 WebAssembly 模块。列表 7-5 显示了具有加法功能的 WAT 模块。创建文件\
  \ *add_message.wat* 并添加列表 7-5 中的代码。\n\n**add_message.wat**\n\n```wat\n(module\n\
  1 (import \"env\" \"log_add_message\"\n    (func $log_add_message (param i32 i32\
  \ i32)))\n\n2 (func (export \"add_message\")\n    3 (param $a i32) (param $b i32)\n\
  \      (local $sum i32)\n\n      local.get $a\n      local.get $b\n    4 i32.add\n\
  \      local.set $sum\n\n    5 (call $log_add_message\n      6 (local.get $a) (local.get\
  \ $b) (local.get $sum))\n  )\n)\n```\n\n列表 7-5：`add_message.wat` 文件将两个数字相加并调用 JavaScript\
  \ 日函数。\n\n\n\n\n\n## 定义 HTML 头部\n\n现在我们将创建 HTML 页面。当我们之前使用 Node.js 作为嵌入环境时，可以使用纯\
  \ JavaScript 进行工作，但对于静态网站，你需要一个 HTML 页面。网页浏览器不会像 Node.js 那样直接执行 JavaScript。浏览器加载\
  \ HTML 页面，并在 `<script>` 标签中嵌入 JavaScript。我假设你对 HTML 基础已经有些熟悉，但如果不熟悉，这个示例也应该很好理解。创建一个新文件\
  \ `add_message.html` 并添加 列表 7-6 中的代码。\n\n**add_message.html (共 3 部分的第一部分)**\n\n\
  ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
  >\n  <meta name=\"viewport\"\n        content=\"width=device-width, initial-scale=1.0\"\
  >\n  <title>Add Message</title>\n...\n```\n\n列表 7-6：`add_message` 应用的 HTML 头部大部分是\
  \ HTML 样板代码。\n\n这是 HTML 起始标签和头部信息。它只是设置了一些字体配置，并将应用名称 `Add Message` 显示为标题。\n\n##\
  \ JavaScript\n\n在结束 `head` 元素之前，我们包含了一个用于 JavaScript 的 `script` 标签。与使用 Node.js 时类似，需要\
  \ JavaScript 代码来实例化并执行 WebAssembly 模块中的函数。HTML 页面使用 `script` 标签来包含这些 JavaScript，如\
  \ 列表 7-7 所示。\n\n**add_message.html (共 3 部分的第二部分)**\n\n```javascript\n...\n  <script>\n\
  \  1 //const sleep = m => new Promise(r => setTimeout(r, m));\n    var output =\
  \ null;\n    var add_message_function;\n\n  2 var log_add_message = (a, b, sum)\
  \ => {\n      if (output == null) {\n        console.log(\"page load not complete:\
  \ log_add_message\");\n        return;\n      }\n    3 output.innerHTML += `${a}\
  \ + ${b} = ${sum}<br>`;\n    };\n\n    let importObject = {\n      env: {\n    \
  \  4 log_add_message: log_add_message,\n      }\n    };\n\n    (async () => {\n\
  \    5 // await sleep(5000);\n      let obj = await\n    6 WebAssembly.instantiateStreaming(fetch('add_message.wasm'),\n\
  \                                        importObject);\n      add_message_function\
  \ = obj.instance.exports.add_message;\n    7 let btn = document.getElementById(\"\
  add_message_button\");\n      btn.style.display = \"block\";\n    })();\n\n  8 function\
  \ onPageLoad() {\n      //(async () => {\n    9 //await sleep(5000);\n    a output\
  \ = document.getElementById(\"output\");\n      //})();\n    }\n  </script>\n...\n\
  ```\n\n列表 7-7：加载 WebAssembly 模块的 JavaScript 位于 `script` 标签内。\n\n在构建网页时，我们需要意识到所有网页元素完成加载的时机，以及流式传输并实例化\
  \ WebAssembly 模块所需的时间。\n\n此应用程序将消息写入段落标签 `output` 中。当 JavaScript 执行时，输出段落尚未加载，因为它位于\
  \ HTML 页面的下方。WebAssembly 模块将以异步方式流式传输和加载，因此你无法确定 WebAssembly 模块是在页面加载完成之前还是之后实例化的。\n\
  \n为了测试此函数无论这些事件发生的顺序如何都能工作，我们在开头创建了一个 `sleep`1 函数来强制 JavaScript 等待。该函数在这里被注释掉了。要测试加载顺序，请取消此处\
  \ `sleep` 以及以及 IIFE 内部或 `onPageLoad` 函数内部的注释。\n\n我们创建了 `add_message_function` 变量作为占位符，一旦模块实例化，它将更改指向\
  \ WebAssembly 模块内部的 `add_message` 函数。\n\n接下来，我们定义了 `log_add_message` 2，它包含一个箭头函数，用于检查\
  \ `output` 是否被设置为 `null` 以外的值。`output` 的默认值为 `null`，但一旦页面加载，`output` 就会被设置为 `id`\
  \ 为 `output` 的段落元素；因此，如果函数在页面加载完成之前运行，该函数将记录一条消息。`log_add_message` 4 函数由 WebAssembly\
  \ 模块导入并调用，模块向 `log_add_message` 传递两个用于相加的参数以及这些参数之和。该函数随后将这些值写入 列表 7-8 中的 `output`\
  \ 3 HTML 段落标签。\n\n在 IIFE 中，`sleep` 5 函数被注释掉了，但你可以为了测试而恢复它。然而，当从网页加载 WebAssembly\
  \ 模块时，你使用 `WebAssembly.instantiateStreaming` 6 结合 `fetch` 调用来检索模块。一旦模块实例化，就会从 DOM\
  \ 中获取 `add_message_button` 7 元素，并通过设置其 `style.display` 属性为 `block` 使其可见。用户现在可以点击此按钮来运行\
  \ WebAssembly 函数。\n\n此外，我们定义了 `onPageLoad` 8 函数，它会在 HTML `body` 加载完成时执行。该函数设置了在\
  \ [列表 7-7] 顶部定义的变量 `output`。\n\n# HTML Body \n\n`body` 标签包含了将要显示的 DOM 元素。\n\n**add_message.html\
  \ (共 3 部分的第三部分)**\n\n```html\n...\n</head>\n1 <body onload=\"onPageLoad()\" style=\"\
  font-family: 'Courier New', Courier, monospace;\">\n2 <input type=\"number\" id=\"\
  a_val\" value=\"0\"><br><br>\n3 <input type=\"number\" id=\"b_val\" value=\"0\"\
  ><br><br>\n4 <button id=\"add_message_button\" style=\"display:none\"\n5 onclick=\"\
  add_message_function(document.getElementById('a_val').value, document.getElementById('b_val').value\
  \ )\">Add Values</button><br>\n6 <p id=\"output\" style=\"float:left; width:200px;\
  \ min-height:300px;\"></p>\n</body>\n</html>\n```\n\n列表 7-8：`body` 标签中的 DOM 元素\n\
  \n`body` 1 标签包含一个调用 `onPageLoad` 的 `onload` 属性。这确保了 JavaScript 中的 `output` 变量直到其存在才被设置。\n\
  \n我们有两个 `id` 为 `a_val` 2 和 `b_val` 3 的 `input` 元素。当点击 `button` 4 元素时，这些输入框值会被传递给\
  \ WebAssembly。按钮属性 `onclick` 5 被设置为调用 `add_message_function`，一旦模块实例化，它将调用 WebAssembly\
  \ 模块中的 `add_message` 函数。此外，我们还有一个 `id` 为 `output` 6 的段落标签，我们将用 WebAssembly 模块的值填充它。\n\
  \n## 我们完整的 Web 应用\n\n我们现在应该可以运行 Web 应用了。如之前提到的，我们必须从 Web 服务器提供网页，因此请先确保 列表 7-3 中的\
  \ Web 服务器正在运行，可以使用 列表 7-9 中的命令。\n\n```bash\nnode server.js\n```\n\n列表 7-9：运行简单的\
  \ Web 服务器。\n\n如果你收到 列表 7-10 中的错误，说明该端口上已有一个 Web 服务器。\n\n```text\nError: listen EADDRINUSE:\
  \ address already in use :::8080\n```\n\n列表 7-10：端口已被占用时的 Web 服务器错误\n\n得到此错误可能意味着你从另一个命令行运行了\
  \ *server.js*。在 Web 服务器运行时，在浏览器中打开以下 URL：[`localhost:8080/add_message.html`](http://localhost:8080/add_message.html)。\n\
  \n\n\n\n你应该能看到类似图 7-2 所示的屏幕。\n\n![f07002](img/f07002.png)\n\n图 7-2：`add_message.html`\
  \ 应用程序\n\n在两个数字字段中赋值，并点击 `Add Values` 以查看加法结果（图 7-3）。\n\n![f07003](img/f07003.png)\n\
  \n图 7-3：使用应用添加的两个加法消息\n\n注意，WebAssembly 模块调用了 JavaScript 函数，就像在其他章节中那样。在本章中，你不需要学习\
  \ `WAT` 中的任何新命令。因为在 `Wasm 1.0` 中无法直接操作 DOM，因此我们在 JavaScript 内部对 DOM 进行了所有修改。尽管我们第一次使用\
  \ HTML 页面，但这并没有影响 WebAssembly 的功能。WebAssembly 1.0 的功能相当有限，最适用于提高计算密集型应用的性能。随着后续\
  \ WebAssembly 的发布和更多功能的加入，这一特性将会发生变化。但目前，在决定哪些应用最适合这项新技术时，你需要记住这些局限性。\n\n## 十进制和二进制字符串\n\
  \n我们将继续创建第二个应用程序，它使用第 5 章中的函数将数值数据转换为十进制、十六进制和二进制字符串，并将它们显示在网页上。访问 [`wasmbook.com/hex_and_binary.html`](https://wasmbook.com/hex_and_binary.html)\
  \ 查看最终的应用程序。\n\n### HTML\n\nHTML 与列表 7-6 几乎相同，但 `title` 内容不同。创建一个名为 `hex_and_binary.html`\
  \ 的文件，并添加列表 7-11 中的代码。\n\n**hex_and_binary.html (第 1/3 部分)**\n\n```\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\"\
  \n        content=\"width=device-width, initial-scale=1.0\">\n  <title> 1 Hex and\
  \ Binary</title>\n...\n```\n\n列表 7-11：`hex_and_binary.html` 开头的样板代码\n\n这里的 `title`\
  \ 标签包含了 `Hex` 和 `Binary`。接下来，在列表 7-12 中，我们添加了 `script` 标签以及用于实例化和调用 WebAssembly\
  \ 模块的 JavaScript 代码。\n\n**hex_and_binary.html (第 2/3 部分)**\n\n```\n...\n  <script>\n\
  \    // 分配一个 64K 的内存块\n    const memory = new WebAssembly.Memory({ initial: 1 });\n\
  \    var output = null;\n\n    // 当 WebAssembly 模块实例化时，该函数将会改变\n  1 var setOutput\
  \ = (number) => {\n      // 如果在 WebAssembly 模块实例化之前运行该函数，\n      // 将显示此消息。\n  \
  \  2 console.log(\"function not available\");\n      return 0;\n    };\n\n    //\
  \ 此函数将通过点击按钮调用，并运行\n    // WebAssembly 模块中的 setOutput 函数。\n  3 function setNumbers(number)\
  \ {\n    4 if (output == null) {\n        // 如果页面未完全加载，则返回\n        return;\n  \
  \    }\n\n      // 调用 WebAssembly setOutput 函数生成 HTML\n      // 字符串并将其放入线性内存，返回其长度\n\
  \    5 let len = setOutput(number);\n\n      // 我们知道 HTML 字符串在线性内存中的位置和长度，\n   \
  \   // 因此我们可以从内存缓冲区中提取它\n    6 let bytes = new Uint8Array(memory.buffer, 1024, len);\n\
  \n      // 将从线性内存提取的字节转换为 JavaScript\n      // 字符串并并它来设置 output 中的 HTML\n    7 output.innerHTML\
  \ = new TextDecoder('utf8').decode(bytes);\n    }\n\n  8 function onPageLoad() {\n\
  \      // 当页面加载完成后，将输出变量\n      // 设置为 id 为 \"output\" 的元素\n    9 output = document.getElementById(\"\
  output\");\n      var message_num = 0;\n    }\n\n    let importObject = {\n    \
  \  env: {\n        buffer: memory\n      }\n    };\n\n    (async () => {\n     \
  \ // 使用 WebAssembly.instantiateStreaming 结合\n      // fetch 代替 WebAssembly.instantiate\
  \ 和 fs.readFileSync\n      let obj = await WebAssembly.instantiateStreaming(\n \
  \                       fetch('hex_and_binary.wasm'),\n                        importObject);\n\
  \      // 将 setOutput 变量重置为 WASM 模块\n      // 中的 setOutput 函数\n    a setOutput =\
  \ obj.instance.exports.setOutput;\n         let btn = document.getElementById(\"\
  set_numbers_button\");\n         btn.style.display = \"block\";\n    })();\n\n \
  \ </script>\n</head>\n...\n```\n\n列表 7-12：`hex_and_binary.html` 文件的 JavaScript\n\
  \n`script` 标签首先创建变量 `setOutput` 1 并将其设置为箭头函数，该函数向控制台打印 `\"function not available\"\
  ` 2。如果用户在 WebAssembly 模块加载完成点击 `Set Numbers` 按钮，将显示此消息。\n\n接下来，用户点击 `Set Numbers`\
  \ 按钮。此时 `output` 仍为 `null` 3。`setOutput` 函数 4 调用 WebAssembly 模块并返回字符串长度。我们使用 `setOutput`\
  \ 5 生成 HTML。我们从线性内存提取 `bytes` 6。我们使用 `TextDecoder` 7 解码字节。\n\n`onPageLoad` 函数 8\
  \ 设置 `output` 变量。`output` 标签 9 包含了输出。\n\n**hex_and_binary.html (第 3/3 部分)**\n\n\
  ```\n...\n<!-- body 标签在加载完成后调用 onPageLoad -->\n1 <body onload=\"onPageLoad()\"\n\
