  \  </button>\n</body>\n</html>\n```\n\n列表 7-13：HTML 页面的 UI 元素\n\n`onload` 1 属性在\
  \ body 加载完成后执行 `onPageLoad`。标签 2 `<div id=\"output\">` 是显示 WebAssembly 模块输出的地方。数字\
  \ `input` 标签 3 `<input type=\"number\" id=\"val\" value=\"0\">` 是用户输入要转换为十六进制和二进制的数字的地方。`button`\
  \ 4 在点击时通过 `onclick` 5 属性调用 WebAssembly 模块。\n\n### WAT\n\n此应用程序有很多 WAT 代码，因此我们将其分为四个部分。此外，你还需要复制第\
  \ 5 章的几个函数。创建一个名为 `hex_and_binary.wat` 的文件，并添加列表 7-14 中的代码。\n\n**hex_and_binary.wat\
  \ (第 1/4 部分)**\n\n\n\n\n\n```\n(module\n  (import \"env\" \"buffer\" (memory 1))\n\
  \n  ;; 十进制数字\n1 (global $digit_ptr i32 (i32.const 128))\n  (data (i32.const 128)\
  \ \"0123456789ABCDEF\")\n  ;; 十进制字符串指针、长度和数据段\n2 (global $dec_string_ptr  i32 (i32.const\
  \ 256))\n(global $dec_string_len  i32 (i32.const 16))\n  (data (i32.const 256) \"\
  \               0\")\n\n  ;; 十六进制字符串指针、长度和数据段\n3 (global $hex_string_ptr  i32 (i32.const\
  \ 384))\n(global $hex_string_len  i32 (i32.const 16))\n(data (i32.const 384) \"\
  \             0x0\")\n\n  ;; 二进制字符串指针、长度和数据段\n4 (global $bin_string_ptr  i32 (i32.const\
  \ 512))\n(global $bin_string_len  i32 (i32.const 40))\n(data (i32.const 512) \"\
  \ 0000 0000 0000 0000 0000 0000 0000 0000\")\n\n  ;; h1 开启标签字符串指针、长度和数据段\n5 (global\
  \ $h1_open_ptr i32  (i32.const 640))\n(global $h1_open_len i32  (i32.const 4))\n\
  (data (i32.const 640) \"<H1>\")\n\n  ;; h1 结束标签字符串指针、长度和数据段\n6 (global $h1_close_ptr\
  \ i32  (i32.const 656))\n(global $h1_close_len i32  (i32.const 5))\n(data (i32.const\
  \ 656) \"</H1>\")\n\n  ;; h4 开启标签字符串指针、长度和数据段\n7 (global $h4_open_ptr i32  (i32.const\
  \ 672))\n(global $h4_open_len i32  (i32.const 4))\n(data (i32.const 672) \"<H4>\"\
  )\n\n  ;; h4 结束标签字符串指针、长度和数据段\n8 (global $h4_close_ptr i32  (i32.const 688))\n(global\
  \ $h4_close_len i32  (i32.const 5))\n(data (i32.const 688) \"</H4>\")\n\n  ;; 输出字符串长度和数据段\n\
  9 (global $out_str_ptr i32 (i32.const 1024))\n(global $out_str_len (mut i32) (i32.const\
  \ 0))\n\n...\n```\n列表 7-14：模块开头的字符串数据定义\n\n我们定义了一系列数据段、指针和数据长度，将用于从整数数据组装十进制、十六进制和二进制字符串。全局变量\
  \ `$digit_ptr` 1 指向数据段，该段包含了线性内存位置 `128` 处定义的 16 个十六进制数字 0 到 F。这些数据用于从整数到字符串的所有三种转换。我们还了长度和指针全局变量，以及用于我们的十进制\
  \ 2、十六进制 3 和二进制 4 字符串的数据段。我们将用的大部分代码取自第 5 章的章节。\n\n接下来，我们有几个表示 HTML 标签的字符串。包括开启\
  \ 5 和结束 6 的 `H1` 标签指针、长度和数据段，以及用于 `H4` 标签的开启 7 和结束 8 的数据。这些字符串将用于组装我们的 HTML 输出字符串，该字符串将存储在线性内存位置\
  \ `1024` 9 处，我选择这个位置是因为它是未使用的。\n\n当我们将字符串数据复制到输出字符串时，我们需要跟踪该字符串的新长度并将该值传递给 JavaScript；因此，我们使用全局变量\
  \ `$out_str_len` 来跟踪输出字符串的长度。我没有包含第 5 章原始函数的代码，而是包含了一个省略号（……）和一个注释，指示要复制的函数代码所在的列表编号。请从列表\
  \ 7-15 中的原始列表中复制并粘贴所有六个函数的代码。\n\n### hex_and_binary.wat (4 部分中的第 2 部分)\n\n```\n\
  ...\n1 (func $set_bin_string (param $num i32) (param $string_len i32)\n  ;; $set_bin_string\
  \ 定义在列表 5-35 中\n...\n)\n\n2 (func $set_hex_string (param $num i32) (param $string_len\
  \ i32)\n  ;; $set_hex_string 定义在列表 5-30 中\n...\n) ;; end $set_hex_string\n\n3 (func\
  \ $set_dec_string (param $num i32) (param $string_len i32)\n  ;; $set_dec_string\
  \ 定义在列表 5-24 中\n...\n)\n\n4 (func $byte_copy (param $source i32) (param $dest i32)\
  \ (param $len i32)\n  ;; $byte_copy 定义在列表 5-17 中\n...\n)\n\n5 (func $byte_copy_64\
  \ (param $source i32) (param $dest i32) (param $len i32)\n  ;; $byte_copy_64 定义在列表\
  \ 5-18 中\n...\n)\n\n6 (func $string_copy (param $source i32) (param $dest i32) (param\
  \ $len i32)\n  ;; $string_copy 定义在列表 5-19 中\n...\n```\n\n列表 7-15：重自第 5 章的函数\n\n\
  首先是数字转字符串的函数。`$set_bin_string` 1 将数字转换为二进制字符串。它接收的参数是要转换为二进制字符串的 `i32 $num` 和字符串的长度\
  \ `$string_len`（列表 5-35）。接下来是 `$set_hex_string` 2 将数字转换为十六进制字符串（列表 5-30）。然后 `$set_dec_string`\
  \ 3 将数字转换为十进制字符串（列表 5-24）。\n\n接下来是三种用于复制的函数：`$byte_copy` 4 逐字节复制数据（列表 5-17）。`$byte_copy_64`\
  \ 5 每次复制 8 个字节（列表 5-18）。`$string_copy` 6 使用 `$byte_copy_64` 逐字节复制，直到剩余不足 8 个字节，然后使用\
  \ `$byte_copy` 复制剩余字节（列表 5-19）。\n\n在[列表 7-15] 中缺少一个最后的复制命令。这是 `$append_out` 函数，它通过将给定的字符串追加到输出字符串的末尾来实现。\n\
  \n### hex_and_binary.wat (4 部分中的第 3 部分)\n\n```\n...\n  ;; 将字符串追加到输出字符串\n1 (func\
  \ $append_out (param $source i32) (param $len i32)\n  2 (call $string_copy\n   (local.get\
  \ $source)\n     (i32.add\n      (global.get $out_str_ptr)\n      (global.get $out_str_len)\n\
  \    )\n   (local.get $len)\n  )\n\n  ;; 将长度添加到输出字符串长度\n  global.get $out_str_len\n\
  \  local.get $len\n  i32.add\n  3 global.set $out_str_len\n)\n...\n```\n列表 7-16：$append_out\
  \ 函数追加到输出字符串\n\n`$append_out` 1 函数通过使用 `$string_copy` 2 将字符串追加到输出字符串的末尾，并将刚刚追加的字符串长度添加到\
  \ `$out_str_len` 3，后者表示输出字符串的长度。\n\n此模块中的最后一个函数是 `setOutput`，它创建用于设置 `output` `div`\
  \ 标签的字符串。它是导出的，因此可以从 JavaScript 调用。将列表 7-17 中的代码添加到 WAT 文件的末。\n\n**hex_and_binary.wat\
  \ (4 部分中的第 4 部分)**\n\n\n\n\n\n```\n(func (export \"setOutput\") (param $num i32)\
  \ (result i32)\n  ;; 根据 $num 值创建一个十进制字符串\n1 (call $set_dec_string\n    (local.get\
  \ $num) (global.get $dec_string_len))    \n  ;; 根据 $num 值创建一个十六进制字符串\n2 (call $set_hex_string\n\
  \    (local.get $num) (global.get $hex_string_len))    \n  ;; 根据 $num 值创建一个二进制字符串\n\
  3 (call $set_bin_string\n    (local.get $num) (global.get $bin_string_len))    \n\
  \n    i32.const 0\n  4 global.set $out_str_len ;; 将 $out_str_len 设置为 0\n\n    ;;\
  \ 向输出字符串中追加 <h1>${decimal_string}</h1>\n  5 (call $append_out\n      (global.get\
  \ $h1_open_ptr) (global.get $h1_open_len))\n    (call $append_out\n      (global.get\
  \ $dec_string_ptr) (global.get $dec_string_len))\n    (call $append_out\n      (global.get\
  \ $h1_close_ptr) (global.get $h1_close_len))\n\n    ;; 向输出字符串中追加 <h4>${hexadecimal_string}</h4>\n\
  \  6 (call $append_out\n      (global.get $h4_open_ptr) (global.get $h4_open_len))\n\
  \    (call $append_out\n      (global.get $hex_string_ptr) (global.get $hex_string_len))\n\
  \    (call $append_out\n      (global.get $h4_close_ptr) (global.get $h4_close_len))\n\
  \n    ;; 向输出字符串中追加 <h4>${binary_string}</h4>\n  7 (call $append_out\n      (global.get\
  \ $h4_open_ptr) (global.get $h4_open_len))\n    (call $append_out\n      (global.get\
  \ $bin_string_ptr) (global.get $bin_string_len))\n    (call $append_out\n      (global.get\
  \ $h4_close_ptr) (global.get $h4_close_len))\n\n    ;; 返回输出字符串长度\n  8 global.get\
  \ $out_str_len\n  )\n)\n```\n\n列表 7-17：导出供 JavaScript 调用的 `setOutput` 函数\n\n`set_output`\
  \ 函数在列表 7-17 中进行的前三次调用别是调用 `$set_dec_string` 1、`$set_hex_string` 2 和 `$set_bin_string`\
  \ 3。这些函数接收传递给 `setOutput` 的数字，并将其转换为线性内存中的十进制字符串、十六进制字符串和二进制字符串。一旦这些字符串设置完毕，全局变量\
  \ `$out_str_len` 4 就会设置为 `0`，这会重置输出字符串，使得向输出字符串的追加操作将覆盖内存中当前的字符串。在我们重置值之后，我们就可以开始向输出字符串追加内容了。\n\
  \n接下来是九次对 `$append_out` 的调用，分为三个块。前三次调用追加了一个带有十进制 5 字符串的起始和结束 `H1` 标签。这创建了用于网页中显示十进制数值的\
  \ HTML 字符串。下一组三次调用将十六进制 6 字符串追加到 `H4`元素中，然后将二进制 7 字符串追加到 `H4`元素中。最后，通过调用 `global.get`\
  \ `$out_str_len` 8 将输出字符串的长度加载到栈上，将其返回给调用的 JavaScript。\n\n### 编译并运行\n\nWAT 模块已完成，因此使用\
  \ `wat2wasm` 编译你的 `hex_and_binary.wasm` 文件，如列表 7-18 所示。\n\n```\nwat2wasm hex_and_binary.wat\n\
  ```\n\n列表 7-18：使用 `wat2wasm` 编译 `hex_and_binary.wat`\n\n验证你是否正在运行 `server.js`，并在浏览器中使用地址\
  \ `http://localhost:8080/hex_and_binary.html` 打开 `hex_and_binary.html`。\n\n图 7-4\
  \ 显示了屏幕上应该看到的类似内容。\n\n![f07004](img/f07004.png)\n\n图 7-4：十进制转换为十六进制和二进制\n\n输入一个数字并尝试一下。例如，在图\
  \ 7-5 中，我输入了数字 1025 并点击了“Set Numbers”。\n\n![f07005](img/f07005.png)\n\n图 7-5：将 1025\
  \ 转换为十六进制和二进制\n\n此应用程序使用了我们在第 5 章创建的几个 WebAssembly 函数将十进制数字转换为十六进制和二进制字符串。我们添加了一些额外功能，在\
  \ WebAssembly 模块中创建 HTML 标签，以便我们将 HTML 传递给 JavaScript 并在网页上显示。正如你所看到的，在 WAT 中处理字符串和操作\
  \ DOM 是相当繁琐的。如果你在使用工具链，大部分工作将由工具为你完成。这些功能中的某些可能会编译为 JavaScript。\n\n## 总结\n\nWebAssembly\
  \ 1.0 不直接与用户界面交互。它的擅长领域是计算密集型应用程序。在基于 WebAssembly 的 Web 应用程序中操作 DOM 主要是 JavaScript\
  \ 的工作。在 WebAssembly 处理字符串完全取决于实现。WebAssembly 仍然是许多 Web 应用程序的极佳选择，特别是图形应用程序。但在目前，它并不是为直接操作\
  \ DOM 设计的。\n\n在本章初，我们创建一个使用 Node.js 运行的简单 JavaScript 服务器。你无法从文件加载 WebAssembly Web\
  \ 应用，而是必须使用 Web 服务器提供你的页面。我们编写了第一个 WebAssembly Web 应用，它将两个数字相加并将结果输出到 DOM 中的段落中。\n\
  \n# 8\n\n与 Canvas 工作\n\n![](img/chapterart.png)\n\n在本章中，你将学习如何将 WebAssembly 与 HTML\
  \ canvas 元素结合，在 Web 应用程序中创建高效的动画。将在 WebAssembly 线性内存中操作像素数据，然后将线性内存中的像素数据直接传输到 HTML\
  \ canvas。我们将继续之前的随机碰撞对象示例（列表 6-16），在 JavaScript 线性内存中生成对象，然后使用 WebAssembly 移动这些对象、检测碰撞并渲染它们。由于可能的碰撞数量随对象数量而呈指数级增长，这种图形碰撞检测是\
  \ WebAssembly 能力的极佳测试。在本章结束时，我们将拥有一个能够每秒检测几十次数千个不同碰撞体碰撞的应用程序。在这种情况下，我们的对象在没有碰撞时显示为绿色，发生碰撞时显示为红色。\n\
  \n\n\n\n正如之前讨论的，Web 浏览器最初是为了显示简单的在线文档设计的，这意味着文档任何元素位置的任何更改都会经常导致整个页面重新渲染。对于任何需要高帧率图形效果（如游戏）的应用程序来说，这都是性能上的噩梦。从那以后，浏览器已经演变为复杂的应用程序托管环境，这使得需要开发一种更复杂的渲染模型：`canvas`。`canvas`\
  \ 元素由 Apple 在 2004 年为其 Safari Web 浏览器引入，并于 2006 年作为 HTML 标准的一部分被采用。在 `canvas` 元素的范围内，Web\
  \ 开发者可以渲染 2D 图像和动画，其性能远优于以前通过操作 DOM 实现的方法。结合 WebAssembly 使用 `canvas` 可以帮助我们以极快的速度向浏览器渲染动画。\n\
  \n## 渲染到 Canvas\n\n关于 HTML canvas API 的书籍已经写满一整本书了，因此我们只触及此 WebAssembly 演示所需的几个功能。与\
  \ DOM 一样，WebAssembly 无法直接与 `canvas` 交互。相反，我们必须将像素数据直接从线性内存渲染到 `canvas` 元素上。这允许我们使用最少的\
  \ JavaScript 代码编写 canvas 应用程序。在编写 WebAssembly 代码之前，我们将先编写 HTML 和 JavaScript 部分。要查看完成后的应用是什么样，请访问\
  \ [`wasmbook.com/collide.html`](https://wasmbook.com/collide.html)。\n\n### 在 HTML\
  \ 中定义 Canvas\n\n按照惯例，我们将 HTML 文件分为几个部分，并逐一检查。第一部分定义了 `canvas`，它是 页面中渲染动画的区域。创建一个名为\
  \ `collide.html` 的文件，并将列表 8-1 中的代码添加到其中。\n\n**collide.html (5 部分第 1 部分)**\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta\
  \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Collision\
  \ detection</title>\n</head>\n<body>\n1 <canvas id=\"cnvs\" width=\"512\" height=\"\
  512\"></canvas>\n...\n```\n\n列表 8-1：定义 canvas 的 HTML\n\n这里你需要关注的元素是 `canvas` 1 元素。我们给\
  \ `canvas` 元素分配了一个 `id` 为 `cnvs`，以便稍后可以使用 `document.getElementById` 调用来获取 canvas\
  \ 元素。我们将 `width` 和 `height` 设置为 `512`，选择它是因为 512 是 2⁹，即十六进制的 `0x200`。这个选择使得使用二进制逻辑处理宽度和高度变得容易，如果我们的代码设计得当，这有助于提高应用程序的性能。\n\
  \n### 在 HTML 中定义 JavaScript 常量\n\n在 JavaScript 的开头，我们将添加一些常量值，用于配置 WebAssembly 模块中的一些顶层设置。这些值将在\
  \ JavaScript 和 WebAssembly 之间共享。在 JavaScript 中定义这些值使得更新配置更加简单。我们在代码开头了一些与 canvas\
  \ 相关的常量，用于设置 WebAssembly 和 HTML `canvas` 元素之间交互的参数。我们还有一组与线性内存数据组织相关的常量，它们定义了我们要渲染对象的基地址、步长（stride）和偏移（offset）。此外，我们必须定义一个新的\
  \ `ImageData` 对象，在线性内存缓冲区中留出一个区域，作为应用程序可以直接绘制到 canvas 的对象。将列表 8-2 中的代码添加到你的 HTML\
  \ 文件中。\n\ncollide.html (5 部分第 2 部分)\n\n```javascript\n...\n<script>\n1 const cnvs_size\
  \ = 512;  // 宽度和高度均为 512 的正方形画布\n\n2 const no_hit_color = 0xff_00_ff_00; // 未命中颜色（绿色）\n\
  \  const hit_color = 0xff_00_00_ff;    // 命中颜色（红色）\n\n  // 像素数量为 canvas_size x canvas_size，因为是正方形画布\n\
  3 const pixel_count = cnvs_size * cnvs_size; \n\n4 const canvas = document.getElementById(\"\
  cnvs\");\n5 const ctx = canvas.getContext(\"2d\");\n  ctx.clearRect(0, 0, 512, 512);\n\
  \n // 数据数据所需的字节数是像素数 * 4\n6 const obj_start = pixel_count * 4; // 每个像素 4 字节。\n \
  \ const obj_start_32 = pixel_count;  // 到起始对象的 32 位偏移\n  const obj_size = 4;   \
  \    // 正方形对象占多少个像素\n  const obj_cnt = 3000;     // 3000 个对象\n  const stride_bytes\
  \ = 16;  // 每个步长有 16 字节\n\n  const x_offset  = 0;      // x 属性是 0-3 字节\n  const\
  \ y_offset  = 4;      // y 属性是 4-7 字节\n  const xv_offset = 8;      // x 速度属性是 8-11\
  \ 字节\n  const yv_offset = 12;     // y 速度属性是 12-15 字节\n\n7 const memory = new WebAssembly.Memory({initial:\
  \ 80});\n  const mem_8 = new Uint8Array(memory.buffer); // 8 位视图\n  const mem_32\
  \ = new Uint32Array(memory.buffer); // 32 位视图\n\n8 const importObject = {\n  env:\
  \ {\n    memory: memory,\n    cnvs_size: cnvs_size,\n    no_hit_color: no_hit_color,\n\
  \    hit_color: hit_color,\n    obj_start: obj_start,\n    obj_cnt: obj_cnt,\n \
  \   obj_size: obj_size,\n    x_offset: x_offset,\n    y_offset: y_offset,\n    xv_offset:\
  \ xv_offset,\n    yv_offset: yv_offset\n  }\n };\n\n  // ImageData 对象可以被绘制到画布\n\
  \  const image_data = 9 ImageData(new Uint8ClampedArray(memory.buffer, 0, obj_start),\
  \ cnvs_size, cnvs_size);\n...\n```\n\n列表 8-2：在 JavaScript 中配置数据\n\n我们有一个 `cnvs_size`\
  \ 1 常量，存储了 canvas 的高度和宽度，因为它们是相同的。我们还定义了两个十六进制常量。第一个 `no_hit_color` 2 定义了对象未命中另一个对象时的颜色。第二个\
  \ `hit_color` 定义了命中另一个对象时的颜色。这些十六进制数的含义在第 162 页的“位图数据”中有更详细的介绍。然后我们定义了 `pixel_count`\
  \ 3，它是通过 canvas_size 的平方得到的。\n\n\n\n最后，我们创建一个新的 `ImageData` 对象，这是一个 JavaScript 接口，我们可以用它来访问画布元素中的底层像素数据。我们在\
  \ Listing 8-2 中创建的 `Memory` 对象有一个名为 `buffer` 的属性，它是一个包含线性内存中数据的类型数组。`buffer` 属性是一个可以代表画布上显示的像素数据的数据缓冲区。要创建一个新的\
  \ `ImageData` 对象，必须将 `memory.buffer` 对象作为 `Uint8ClampedArray` 传递给 `ImageData` 对象，并带有画布的宽度和高度。\n\
  \n### 创建随机对象\n\n接下来，我们将创建随机对象，就像我们之前在书中做的那样。我们继续使用随机数据，因为这让我们能够关注 WebAssembly 而不是数据。然而，WebAssembly\
  \ 并没有提供随机数函数，因此在 JavaScript 中创建随机对象要简单得多。这些对象有四个属性：x 和 y 坐标（位置），以及 x 和 y 速度（运动）。我们使用\
  \ 32 位整数来表示这些属性中每个的值。Listing 8-3 显示了循环创建数据的代码，这些数据由我们之前定义的 `object_cnt` 常数表示的多个对象组成。\n\
  \n**collide.html (部分/5)**\n\n```\n...\n1 const stride_i32 = stride_bytes/4;\n2 for(\
  \ let i = 0; i < obj_cnt * stride_i32; i += stride_i32 ) {\n\n    // 小于 canvas_size\
  \ 的值\n  3 let temp = Math.floor(Math.random() * cnvs_size);\n\n    // 将对象的 x 属性设置为随机值\n\
  \  4 mem_i32[obj_start_32 + i] = temp; \n\n    // 小于 canvas_size 的随机值\n  5 temp\
  \ = Math.floor(Math.random()*cnvs_size);\n\n    // 将对象的 y 属性设置为随机值\n  6 mem_i32[obj_start_32\
  \ + i + 1] = temp; \n\n    // -2 到 2 之间的随机值\n  7 temp = (Math.round(Math.random()\
  \ * 4) - 2); \n\n    // 将 x 速度设置为随机值\n  8 mem_i32[obj_start_32 + i + 2] = temp;\
  \ \n\n    // -2 到 2 之间的随机值\n  9 temp = (Math.round(Math.random() * 4) - 2);  \n\n\
  \    // 将 y 速度设置为随机值\n  a mem_i32[obj_start_32 + i + 3] = temp; \n}\n...\n```\n\n\
  Listing 8-3: 设置线性内存数据\n\n此循环中的代码通过 `mem_i32` 中的 32 位整数视图访问线性内存中的数据。由于循环处理的是 32 位数字，我们创建了\
  \ `stride_bytes` 的 32 位版本，我们称之为 `stride_i32` 1。我们将将其设置为值 `stride_bytes / 4`，因为每个\
  \ `i32` 占用四个字节。`for` 循环一直运行，直到索引 `i` 等于 `obj_count` 中设置的对象数量乘以我们在由 `stride_i32`\
  \ 定义的步长中 32 位整数的数量 2。这在线性内存中创建了圆形数据结构。\n\n在循环内部，我们将四个 32 位整数设置为随机数，这些数字将代表每个对象的位置和速度。首先，我们设置位置属性。我们在存储在\
  \ `cnvs_size` 中的 0 到画布宽度 3 之间获取一个随机数，并存储在线性内存中 `x` 位置属性 4 的位置。接下来，生成一个 0 到画布高度 5\
  \ 之间的随机数，并将其存储在线性内存中的 `y` 属性 6 处。然后，我们通过生成一个 –2 到 2 之间的数字 7 来设置速度属性，将其存储在 `x` 速度\
  \ 8 属性的位置，并对 `y` 速度 a 属性执行相同的操作。\n\n### 位图图像数据\n\n我们可以使用 `putImageData` 函数将位图图像数据直接渲染到\
  \ HTML `canvas` 元素中，传入我们之前定义的 `ImageData` 对象。HTML 画布是一个像素网格；每个像素都可以由三个字节表示，每个字节专门用于三\
  \ 颜色之一：红、绿、蓝。在位图格式中，一个像素用单个 32 位整数表示，该整数的每个字节代表其中一种颜色。整数的第四个字节表示 `alpha 值`，用于像素不透明度。当\
  \ alpha 字节为 0 时，像素完全透明；当它为 255 时，它完全不透明。在 WebAssembly 线性内存中，我们将创建一个 32 位整数数组来表示像素数据数组。这种类型的数组使得\
  \ WebAssembly 成为处理要渲染到 HTML 画布的数据非常方便的工具。\n\n在 `script` 标签中，我们将生成此位图数据的 WebAssembly\
  \ 模块存储在变量 `animation_wasm` 中。我们还需要一个 JavaScript 函数来调用该 WebAssembly 函数。然后我们调用 `ctx.putImageData`\
  \ 将该图像数据渲染到 `canvas` 元素中。Listing 8-4 包含了你需要的下一段 JavaScript 代码。\n\n**collide.html\
  \ (部分/5)**\n\n```\n...\n1 var animation_wasm; // 将调用的 webassembly 函数\n\n2 function\
  \ animate() {\n  3 animation_wasm(); // 下一帧\n  4 ctx.putImageData(image_data, 0,\
  \ 0); // 渲染像素数据\n  5 requestAnimationFrame(animate);\n  }\n...\n```\n\nListing 8-4:\
  \ JavaScript `animate` 函数\n\n### requestAnimationFrame 函数\n\n动画是一种幻觉：快速显示的一系列静态图像欺骗了眼睛，使其相信存在运动。你看过的每一个电视屏幕、电脑显示器和电影都是这样工作的。JavaScript\
  \ 提供了方便的 `requestAnimationFrame` 函数：当你调用 `requestAnimationFrame` 时，传递的函数将在下次帧渲染时被调用。调用\
  \ `requestAnimationFrame` 时，我们传入计算机准备好渲染下一帧时想要调用的函数。\n\n我们在 JavaScript 的末尾调用此函数，传入我们在\
  \ Listing 8-4 中定义的 `animate` 函数。我们在 `animate` 函数结束再次调用 `requestAnimationFrame`，将该函数注册为后续帧渲染的回调。必须进行第二次调用是因为\
  \ `requestAnimationFrame` 函数不会在每次帧渲染时注册函数；它只注册于下次帧渲染。`animate` 函数需要调用 WebAssembly\
  \ 模块，执行碰撞检测和对象移动计算。WebAssembly 计算放置在画布上的图像数据。然而，它无法直接将该数据渲染到画布。这就是为什么我们必须在 JavaScript\
  \ 动画函数中调用 `putImageData` 将像素数据渲染到画布。对 `putImageData` 的调用是将我们留出的表示像素数据的线性内存块移动到 `canvas`\
  \ 元素。\n\n我们第一次调用 `requestAnimationFrame` 是在代码最后一行实例化 WebAssembly 模块之后。Listing 8-5\
  \ 显示了 HTML 代码的最后部分。\n\n```javascript\n...\n(async () => {\n  let obj = await\n \
  \ 1 WebAssembly.instantiateStreaming( fetch('collide.wasm'),\n                 \
  \                    importObject );\n  2 animation_wasm = obj.instance.exports.main;\n\
  \  3 requestAnimationFrame(4animate);\n})();\n</script>\n</body>\n</html>\n```\n\
  \nListing 8-5: 实例化 WebAssembly 模块并调用 `requestAnimationFrame`。\n\n\n\n\n\n在异步立即执行函数（IIFE）中，我们首先调用\
  \ `instantiateStreaming` 1 函数。我们将我们在 Listing 8-4 中定义的 `animation_wasm` 2 变量设置为 WebAssembly\
  \ 模块中名为 `main` 的导出函数。回想一下，我们是从 `animate` 函数调用 `animation_wasm` 函数的。最后，调用 `requestAnimationFrame`\
  \ 3 并传入早先定义的 `animate` 4 函数。由于 `animate` 也会对自身调用 `requestAnimationFrame`，浏览器会在每次刷新时都调用\
  \ `animate`。\n\n# WAT 模块\n\n现在我们已经定义了 HTML，接下来需要用 WAT 编写 WebAssembly 模块，该模块将管理对象的移动、碰撞检测和位图图像数据。创建一个名为\
  \ `collide.wat` 的文件。我们将尽可能直接地编写碰撞代码和画布渲染代码。为了实现这一点，我们将编写许多函数，其中某些函数的性能可能不尽理想。在下一章中，我们将重新查看这段代码并尝试对其优化。但在本章中，我们将关注清晰度和简单，而不是高性能。该模块将定义从\
  \ JavaScript 导入值的全局变量。我们需要定义一系列函数，用于清除画布、计算整数的绝对值、设置单个像素以及绘制碰撞对象。然后，我们需要定义 `main`\
  \ 函数，它将使用双重循环来移动每个碰撞对象，并测试它是否与另一个对象碰撞。\n\n## 导入的值\n\n模块的开头如 Listing 8-6 所示，导入了通过我们在\
  \ JavaScript 中定义的 `importObject` 传递模块的常量。这些值包括我们的内存缓冲区、画布大小、对象颜色，以及我们可以用于访问线性内存中对象的基值、偏移量和步长值。\n\
  \n**collide.wat (第 1/12 部分)**\n\n```\n(module\n1 (global $cnvs_size    (import \"\
  env\" \"cnvs_size\")    i32)\n\n2 (global $no_hit_color (import \"env\" \"no_hit_color\"\
  ) i32)\n  (global $hit_color    (import \"env\" \"hit_color\")    i32)\n3 (global\
  \ $obj_start    (import \"env\" \"obj_start\")    i32)\n4 (global $obj_size    \
  \ (import \"env\" \"obj_size\")     i32)\n5 (global $obj_cnt      (import \"env\"\
  \ \"obj_cnt\")      i32)\n\n6 (global $x_offset     (import \"env\" \"x_offset\"\
  )     i32)  ;; 字节 00-03\n  (global $y_offset     (import \"env\" \"y_offset\") \
  \    i32)  ;; 字节 04-07\n7 (global $xv_offset    (import \"env\" \"xv_offset\") \
  \   i32)  ;; 字节 08-11\n  (global $yv_offset    (import \"env\" \"yv_offset\")  \
  \  i32)  ;; 字节 12-15\n\n8 (import \"env\" \"buffer\" (memory 80))              \
  \         ;; 画布缓冲区\n...\n```\n\nListing 8-6: 导入全局变量和内存缓冲区\n\n我们首先导入全局变量 `$cnvs_size`\
  \ 1，它在 JavaScript 中定义为 `512`，代表画布的宽度和高度。接下来是两个颜色值：`$no_hit_color` 2，代表未碰撞对象的 32\
  \ 位颜色；以及 `$hit_color`，代表碰撞对象的颜色。记住我们将它们定义为绿色和红色的十六进制值。\n\n然后我们有一个 `$obj_start` 3\
  \ 变量，它包含对象数据的起始位置。`$obj_size` 4 变量是对象以像素为单位的宽度和高度，它们是正方形的。`obj_cnt` 5 变量包含应用程序渲染并检测碰撞的对象数量。接下来是两个坐标的偏移量\
  \ `$x_offset` 6 和 `$y_offset`，以及两个速度值的两个属性 7, `$xv_offset` 和 `$yv_offset`。此代码块中的最后一个\
  \ `import` 8 导入了我们在 JavaScript 中定义的 `memory` `buffer`。\n\n## 清除画布\n\n接下来，我们将定义一个清除整个位图图像缓冲区的函数。如果不是在每帧渲染时都清除画布，每个对象的旧留迹将留在内存中，导致对象在屏幕上涂抹。`$clear_canvas`\
  \ 函数将每个颜色值设置为 `0xff_00_00_00`，代表全不透明的黑色。Listing 8-7 显示了 `$clear_canvas` 函数的代码。\n\
  \n**collide.wat (第 2/12 部分)**\n\n```\n...\n;; 清除整个画布\n(func $clear_canvas \n  (local\
  \ $i       i32)\n  (local $pixel_bytes  i32)\n\n  global.get $cnvs_size\n  global.get\
  \ $cnvs_size\n  i32.mul                  ;; 乘以 $width 和 $height\n\n  i32.const 4\n\
  \  i32.mul                  ;; 每个像素 4 字节\n\n1 local.set $pixel_bytes   ;; $pixel_bytes\
  \ = $width * $height * 4\n\n2 (loop $pixel_loop\n  3 (i32.store (local.get $i) (i32.const\
  \ 0xff_00_00_00)) ;; 全不透明的黑色\n\n    (i32.add (local.get $i) (i32.const 4)) ;; $i\
  \ += 4\n  4.if (i32.lt_u (local.get $i) (global.get $pixel_bytes)) ;; 如果 $i < $pixel_bytes\n\
  \    5 br $pixel_loop ;; 循环直到像素\n  )\n)\n...\n```\n\nListing 8-7: `$clear_canvas`\
  \ 函数定义\n\n我们首先导入全局变量 `$cnvs_size` 1，它在 JavaScript 中定义为 `512`，代表画布的宽度和高度。接下来通过将画布尺寸并乘以\
  \ `4`（因为每个像素使用 4 字节），并将该值（即像素字节数）存储在局部变量 `$pixel_bytes` 中。该函数循环 2 遍历每个像素，存储十六进制值\
  \ `0xff_00_00_00`。\n\n绝对值函数\n\n在该应用程序中，我们将使用矩形检测策略，而不是之前使用的圆形检测策略，因为我们的对象是正方形的。我们需要切换到矩形检测，这需要代码找到整数的绝对值。\n\
  \n设置像素颜色\n\n## 设置像素颜色\n\n为了将对象绘制到画布上，我们需要能够根据给定的 X 和 Y 坐标以及颜色值，在线性内存中设置像素的颜色。该函数需要边界检查，因为我们正在写入预留用于代表画布区域的线性内存。如果没有此检查，当我们尝试向并非画布上的内存位置写入时，函数将写入我们可能正用于其他用途的线性内存区域。\n\
  \n\n\n\n画布是一个具有行和列的二维表面。图 8-1 显示了一个高四像素、宽四像素的简易画布。\n\n![f08001](img/f08001.png)\n\
  \n图 8-1：一个 4 × 4 画布\n\n画布中的每一行涂有不同的纹理，原因很快就会变得清晰。画布有 x 坐标和 y 坐标，其中第一列的 x 坐标为 0 并从左到右增加；y\
  \ 坐标也从 0 开始并从上到下增加。图 8-2 展示了带有 x 和 y 坐标的 4 × 4 画布。\n\n![f08002](img/f08002.png)\n\
  \n图 8-2：x 和 y 坐标下的 4 × 4 画布\n\n这是画布在计算机显示器上的排列方式，但计算机内存并不是按行和列排列的。内存是一维的，每个地址代表一个像素。因此，我们的像素数据在内存中的排列方式如图图\
  \ 8-3 所示。\n\n![f08003](img/f08003.png)\n\n图 8-3：线性内存中画布的 16 个像素\n\n行被连续排列在一个 16\
  \ 像素的数据数组中。如果你从 x 和 y 坐标的角度看线性内存是如何排列像素的，它看起来像图 8-4。\n\n![f08004](img/f08004.png)\n\
  \n图 8-4：线性内存中的 x 和 y 坐标\n\n我们的 `$set_pixel` 函数已经有了 x 和 y 坐标，需要找到内存地址。我们使用方程 `$y\
  \ * 4 + $x` 来实现，它给出了图 8-5 中的线性内存值。\n\n![f08005](img/f08005.png)\n\n图 8-5：从 x、y 坐标转换到线性内存的公式\n\
  \n一旦我们有了内存位置，就可以使用 `i32.store` 更新线性内存，将该地址的值设置为参数 `$c` 中的颜色值。代码列表 8-9 显示了源代码。\n\n\
  **collide.wat (12 部分中的第 4 部分)**\n\n```\n...\n;;此函数将坐标 $x, $y 处的像素设置为颜色 $c\n(func\
  \ $set_pixel\n  (param $x       i32)    ;; x 坐标\n  (param $y       i32)    ;; y\
  \ 坐标\n  (param $c       i32)    ;; 颜色值\n\n    ;; 是否 $x > $cnvs_size\n  1 (i32.ge_u\
  \ (local.get $x) (global.get $cnvs_size)) \n  if    ;; $x 在画布边界之外\n    return\n\
  \  end\n\n2 (i32.ge_u (local.get $y) (global.get $cnvs_size))  ;; 是否 $y > $cnvs_size\n\
  \  if    ;; $y 在画布边界之外\n    return\n  end\n\n  local.get $y\n  global.get $cnvs_size\n\
  3 i32.mul\n\n  local.get $x\n4 i32.add       ;; $x + $y * $cnvs_size (将像素获取线性内存)\n\
  \n  i32.const 4\n5 i32.mul       ;; 乘以 4，因为每个像素是 4 字节\n\n  local.get $c  ;; 加载颜色值\n\
  \n6 i32.store     ;; 将颜色存储在内存位置\n)\n...\n```\n\n代码列表 8-9：将单个像素设置为给定颜色的函数\n\n该函数首先进行边界检查，以便用户无法尝试设置不在画布上的像素颜色。为了验证\
  \ x 坐标是否在画布边界内，我们检查 `$x` 是否大于 `$cnvs_size` 1，如果是，则返回函数而不更新内存。我们对 y 坐标执行相同的操作 2。\n\
  \n在完成边界检查之后，我们需要获取目标像素的整数形式的位置。我们通过将 `$y` 乘以 `$cnvs_size` 3 来获取内存中该像素之前的行中的像素数，并在该值上加上\
  \ 4 `$x`。因为位置值是 32 位整数（每个像素 4 字节），我们需要将该数字乘以 `4` 5 以得到像素在线性内存中的字节位置。该内存位置就是我们通过\
  \ `i32.store` 6 语句存储 `$c` 的地方。\n\n### 绘制对象\n\n碰撞对象如果没有与另一个对象碰撞则是绿色正方形，如果碰撞则为红色。我们在\
  \ JavaScript 代码的常量部分将这些正方形的大小设置为 `4`，因此每个正方形宽四像素、高四像素。我们使用循环来绘制这些像素，循环增加 `x` 值直到它达到对象位置加上宽度。这样做绘制了第一行像素。\n\
  \n\n\n\n```wasm\n...\n;; 使用对象编号、属性偏移量和用于设置属性的值，\n;; 在线性内存中设置对象的属性（attribute）\n(func\
  \ $set_obj_attr\n  (param $obj_number  i32)\n  (param $attr_offset i32)\n  (param\
  \ $value       i32)\n\n  local.get $obj_number\n\n  i32.const 16\n1 i32.mul    \
  \             ;;  16 字节步长乘以对象编号 \n\n  global.get $obj_start   ;;  加上对象的起始字节（基地址）\n\
  2 i32.add                 ;;  ($obj_number*16) + $obj_start\n\n  local.get $attr_offset\
  \  ;; 将属性偏移量加上地址\n3 i32.add                 ;; ($obj_number*16) + $obj_start + $attr_offset\n\
  \n  local.get $value\n\n  ;; 将 $value 存储在位置 ($obj_number*16)+$obj_start+$attr_offset\n\
  4 i32.store  \n)\n...\n```\n\n列表 8-11：基于 16 的步长值在内存中设置对象\n\n该函数的大部分代码计算了线性内存中存储特定对象属性的地址。回顾第\
  \ 6 章，我们使用基地址（此函数中的 `$obj_start`）、`16` 的步长、对象编号（`$obj_number`）和属性偏移量（`$attr_offset`）计算属性的内存位置。此函数使用公式\
  \ `$obj_number`*`16` 1 + `$obj_start` 2 + `$attr_offset` 3 来确定我们要修改的属性的内存位置。然后它调用\
  \ `i32.store` 4 语句将该值存储在内存中。\n\n接下来，我们将创建相应的 `$get_obj_attr`，它计算属性值的地址。你可能熟悉软件开发原则“不要重复自己（Don’t\
  \ Repeat Yourself, DRY）”。DRY 代码是编写可维护且易于其他开发者阅读和更新的代码的极佳方式。遗憾的是，有时 DRY 代码会降低性能。在这个示例中，我们将重新执行在上一个函数中进行过的某些计算。当我们进入性能优化章节时，我们将使代码比本章中的更不\
  \ DRY（有时被称为 `wet code`）。某些产生 DRY 代码的技术可能会添加需要额外计算周期的抽象层。例如，函数调用需要额外的周期来将值推送到栈中并跳转到代码中的新位置。优化编译器可以经常缓解代码中所用抽象的影响，但理解它们是如何做到这一点，以及为什么\
  \ DRY 代码在执行期间并不总是最高效的将会有帮助。\n\n在其他汇编语言中，宏是在保持代码相对 DRY 的同时保持性能的一种极方法。遗憾的是，`wat2wasm`\
  \ 目前不支持宏。列表 8-12 显示了 `$get_obj_attr` 函数的代码。\n\n### collide.wat (第 12 部分第 7 部分)\n\
  \n```wasm\n...\n;; 使用对象编号和属性偏移量，\n;; 获取线性内存中对象的属性\n(func $get_obj_attr\n  (param\
  \ $obj_number  i32)\n  (param $attr_offset i32)\n  (result i32)\n\n  local.get $obj_number\n\
  \  i32.const 16\n1 i32.mul                  ;; $obj_number * 16\n\n  global.get\
  \ $obj_start\n2 i32.add                  ;; ($obj_number*16) + $obj_start\n\n  local.get\
  \ $attr_offset\n3 i32.add                  ;; ($obj_number*16) + $obj_start + $attr_offset\n\
  \n4 i32.load                 ;; 加载上述指针\n  ;; 返回属性\n)\n...\n```\n\n列表 8-12：基于 16\
  \ 的步长值在内存中获取对象\n\n为了获取对象的偏移字节，我们首先将 `$obj_number` 乘以 `16` 的步长值 1。然后我们加上 2 基地址，该地址存储在全局变量\
  \ `$obj_start` 中。接下来是加上存储在 `$attr_offset` 中的偏移量 3。此时，栈顶存储了我们要获取的属性在内存中的位置，因此调用表达式\
  \ `i32.load` 4 就会将该值推到栈上。\n\n### $main 函数\n\n`$main` 函数会在每帧渲染时从 JavaScript 代码调用一次。它的任务是根据每个对象的速度移动每个对象，检测对象之间的碰撞，如果它与另一个对象发生碰撞则将其渲染为红色，如果没有碰撞则渲染为绿色。`$main`\
  \ 函数非常长，我们将将其拆分为几部分。\n\n### 定义局部变量\n\n`$main` 函数的第一部分如列表 8-13\n\n```wasm\n...\n\
  ;; 移动并检测应用中所有对象之间的碰撞\n(func $main (export \"main\")\n1 (local $i           i32)\
  \  ;; 外层循环索引\n  (local $j           i32)  ;; 内层循环索引\n2 (local $outer_ptr   i32)\
  \  ;; 外部对象指针\n  (local $inner_ptr   i32)  ;; 内部对象指针\n\n3 (local $x1          i32)\
  \  ;; 外层循环 x 坐标\n  (local $x2          i32)  ;; 内层循环 x 坐标\n  (local $y1        \
  \  i32)  ;; 外层循环 y 坐标\n  (local $y2          i32)  ;; 内层循环 y 坐标\n\n4 (local $xdist\
  \       i32)  ;; x 轴距离\n  (local $ydist       i32)  ;; y 轴距离\n\n5 (local $i_hit\
  \       i32)  ;; i 碰撞标记\n6 (local $xv          i32)  ;; x 速度\n  (local $yv     \
  \     i32)  ;; y 速度\n\n7 (call $clear_canvas)      ;; 清除画布\n...\n```\n\n列表 8-13：`$main`\
  \ 函数的开头声明了局部变量并清除了画布。\n\n### $move_loop\n\n`$main` 函数的下一部分定义了一个循环，每帧移动线性内存中的每个对象。该函数的部分将获取\
  \ `$i` 对象的 `$x`、 `$y`、 `$xv` 和 `$yv` 属性。`$xv` 和 `$yv` 变量是 `x` 和 `y` 速度变量，它们通过改变\
  \ `$x` 和 `$y` 坐标值来移动对象。代码还强制 `x` 和 `y` 值保持在画布边界内。在移动循环之后，`$i` 变量被重置为 `0`。请将列表 8-14\
  \ 中的代码添加到 WAT 模块中。\n\n\n\n\n\n```\n...\n1 (loop $move_loop\n    ;; get x attribute\n\
  \    (call $get_obj_attr (local.get $i) (global.get $x_offset))\n    local.set $x1\n\
  \n    ;; get y attribute\n    (call $get_obj_attr (local.get $i) (global.get $y_offset))\
  \ \n    local.set $y1\n\n    ;; get x velocity attribute\n    (call $get_obj_attr\
  \ (local.get $i) (global.get $xv_offset)) \n    local.set $xv\n\n    ;; get y velocity\
  \ attribute\n    (call $get_obj_attr (local.get $i) (global.get $yv_offset)) \n\
  \    local.set $yv\n\n    ;; add velocity to x and force it to stay in the canvas\
  \ bounds\n  2 (i32.add (local.get $xv) (local.get $x1))\n    i32.const 0x1ff  ;;\
  \ 511 in decimal\n  3 i32.and          ;; clear high-order 23 bits\n    local.set\
  \ $x1\n\n    ;; add velocity to y and force it to stay in the canvas bounds\n  \
  \  (i32.add (local.get $yv) (local.get $y1))\n    i32.const 0x1ff  ;; 511 in decimal\n\
  \    i32.and          ;; clear high-order 23 bits\n  4 local.set $y1\n\n    ;; set\
  \ the x attribute in linear memory\n  5 (call $set_obj_attr \n    (local.get $i)\
  \ \n    (global.get $x_offset)\n    (local.get $x1)\n  )\n\n    ;; set the y attribute\
  \ in linear memory\n    (call $set_obj_attr \n    (local.get $i) \n    (global.get\
  \ $y_offset)\n    (local.get $y1)\n  )\n\n  local.get $i\n  i32.const 1\n6 i32.add\n\
  7 local.tee $i        ;; increment $i\n\n  global.get $obj_cnt\n  i32.lt_u     \
  \       ;; $i < $obj_cnt\n\n8 if  ;; if $i < $obj_count branch back to top of $move_loop\n\
  \    br $move_loop\n  end\n\n )\n\n  i32.const 0\n9 local.set $i\n...\n```\n\n**列表\
  \ 8-14: 移动每个对象的循环**\n\n列表 8-14 中的代码循环遍历所有的对象，根据 `x` 和 `y` 速度更改 x 坐标和 y 坐标。循环的前几行\
  \ `1` 调用 `$get_obj_attr` 来获取 `x` 位置、`y` 位置、`x` 速度和 `y` 速度属性，并传入循环索引和要设置的属性的偏移量。此操作会将属性值推入栈中。然后使用\
  \ `local.set` 表达式来设置我们将在 `loop` 中使用的局部变量。\n\n`loop` 通过调用 `i32.add` `2` 将速度变量（`$xv`\
  \ 和 `$yv`）加到位置变量（`$x1` 和 `$y1`）上。在将 `$x1` 设置为新位置之前，使用 `i32.and` `3` 掩码 `x` 位置的最后九位。这使得\
  \ x 坐标的值保持在 0 到 511 之间，如果超过 511，则将值绕回 0。随后对 `$y1` `4` 执行相同的操作以设置 `y` 位置。一旦设置了 `$x1`\
  \ 和 `$y1` 的新值，就会调用 `$set_obj_attr` `5` 函数将这些值设置到线性内存中。通过调用 `i32.add` 和 `local.tee`\
  \ `7` 增加循环计数器 `$i` `6` 的值。如果 `$i` 值小于对象计数（`$obj_count` `8`），代码将分支回 `loop` 的顶部。否则，调用\
  \ `local.set` `9` 将 `$i` 设置为 0。\n\n列表 8-14 中的正方形会在画布上环绕移动，因此当一个物体从右侧移出屏幕时，它会绕回并出现在屏幕左侧，就像老式街机游戏一样。像\
  \ Atari 的 *Asteroids* 和 Namco 的 *Pac-Man* 这样的游戏不需要额外的代码就能实现这种效果；相反，它们的屏幕宽度为 256\
  \ 像素，并使用 8 位数来存储 x 坐标。因此，如果游戏对象的 x 坐标为 255 并向右移动一个像素，单字节值将回置为 0，游戏对象将重新出现在屏幕左侧，如图图\
  \ 8-6 所示。\n\n![f08006](img/f08006.png)\n\n图 8-6：玩家角色从右侧移出屏幕并出现在左侧。\n\n我们可以使用 `i32.and`\
  \ 掩码除底部九位以外的所有位来实现这种效果。代码调用 `$get_obj_attr` 获取 `$x1`、`$y1`、`$xv` 和 `$yv` 属性。代码使用\
  \ `i32.add` 计算新位置，并使用 `i32.and` 确保坐标保持在画布边界。一旦计算出值，就会使用 `$set_obj_attr` 更新线性内存中的值。增加循环计数器\
  \ `$i` 并与 `$obj_count` 进行比较。如果 `$i` 小于 `$obj_count`，则继续循环；否则，将 `$i` 重置为 0。\n\n\n\
  \n\n\n```\n...\n1 (loop $inner_loop (block $inner_break\n      local.get $i\n  \
  \    local.get $j\n      i32.eq\n    2 if              ;; if $i == $j increment\
  \ $j\n        local.get $j\n        i32.const 1\n        i32.add\n        local.set\
  \ $j\n      end\n\n      local.get $j\n      global.get $obj_cnt\n      i32.ge_u\n\
  \    3 if              ;; if $j >= $obj_count break from inner loop\n        br\
  \ $inner_break\n      end\n\n       ;; get x attribute\n    4 (call $get_obj_attr\
  \ (local.get $j)(global.get $x_offset)) \n      local.set $x2  ;; set the x attribute\
  \ for inner loop object\n\n       ;; distance between $x1 and $x2\n      (i32.sub\
  \ (local.get $x1) (local.get $x2))\n\n      call $abs  ;; distance is not negative\
  \ so get the absolute value\n    5 local.tee $xdist  ;; $xdist = the absolute value\
  \ of ($x1 - $x2)\n\n      global.get $obj_size\n      i32.ge_u \n\n    6 if  ;;\
  \ if $xdist >= $obj_size object does not collide\n        local.get $j\n       \
  \ i32.const 1\n        i32.add\n        local.set $j\n\n        br $inner_loop \
  \ ;; increment $j and jump to beginning of inner loop\n      end\n\n       ;; get\
  \ y attribute\n      (call $get_obj_attr (local.get $j)(global.get $y_offset))\n\
  \      local.set $y2\n\n      (i32.sub (local.get $y1) (local.get $y2))\n      call\
  \ $abs\n    7 local.tee $ydist\n\n      global.get $obj_size\n      i32.ge_u \n\n\
  \    8 if\n        local.get $j\n        i32.const 1\n        i32.add\n        local.set\
  \ $j\n\n        br $inner_loop\n      end\n\n      i32.const 1\n    9 local.set\
  \ $i_hit\n      ;; exit the loop if there is a collision\n    )) ;; end of inner\
  \ loop\n...\n```\n\n列表 8-16: 碰撞检测双重循环的内部循环\n\n内部 `loop` 1 将外层循环的当前对象与尚未与其检查过的其他对象进行比较。首先，它需要确保不是在将对象与自身进行比较。对象总是与自身完全碰撞，因此如果\
  \ `$i` 等于 `$j` 2，我们忽略它并需要增加 `$j`。然后，我们将 `$j` 与 `$obj_cnt` 比较 3，查看代码是否已经测试了所有对象。如果是，代码将退出内部\
  \ `loop`。\n\n如果代码还没有测试所有对象，则通过调用 `$get_obj_attr` 4 将 `x` 属性加载到变量 `$x2` 中。然后，我们通过从\
  \ `$x1` 减去 `$x2` 来获取 `$x1` 和 `$x2` 之间的距离，取绝对值并设置 `$xdist` 变量 5。我们将两个对象之间的 `x` 距离与对象大小进行比较，以查看两个对象在\
  \ x 轴上是否重叠。如果因为 `$xdist` 大于 `$obj_size` 6 而没有重叠，代码增加 `$j` 并跳回 `loop` 顶部。\n\n同样地，计算\
  \ `y` 距离并将其存储在变量 `$ydist` 7 中，代码检查 `$ydist` 变量是否大于 `$obj_size` 8。如果是，则这些对象没有碰撞，因此我们增加\
  \ `$j` 并跳回 `loop` 顶部。如果在此处我们没有跳转到循环顶部，则说明对象的 x 轴和 y 轴重叠了，发生了碰撞，因此我们将 `$i_hit` 设置为\
  \ 1 9 并退出。\n\n### 重绘对象\n\n当代码退出内部循环时，要么发现了碰撞，要么没有。代码检查命中变量（`$i_hit`），如果没有碰撞，则调用\
  \ `$draw_obj` 函数并传入无碰撞颜色（绿色）；如果发生了碰撞，则传入 `$hit_color`（红色）。然后 `$i` 增加 1，如果 `$i` 小于对象数量，代码将跳回外层循环的顶部。列表\
  \ 8-17 显示了要添加到 WAT 文件中的最后部分代码。\n\n**collide.wat (part 12 of 12)**\n\n```\n...\n\
  \    local.get $i_hit\n    i32.const 0\n    i32.eq\n  1 if      ;; $i_hit == 0 (no\
  \ hit)\n      (call $draw_obj\n        (local.get $x1) (local.get $y1)  (global.get\
  \ $no_hit_color))\n  2 else    ;; $i_hit == 1 (hit)\n      (call $draw_obj\n   \
  \     (local.get $x1) (local.get $y1) (global.get $hit_color))\n    end\n\n    local.get\
  \ $i\n    i32.const 1\n    i32.add\n  3 local.tee $i\n```\n\n\n\n\n\n本章专门针对那些追求极速应用并愿意花时间实现这一目标的开发者。我们首先将讨论性能分析器工具（profiler\
  \ tools），以评估 WebAssembly 模块的性能，并研究如何比较 WebAssembly 与类似的 JavaScript 代码的性能。我们将花一些时间研究改进\
  \ WebAssembly 性能的策略，包括函数内联、用位移代替乘法和除法、合并常量以及使用死代码消除（DCE）移除未使用代码。\n\n我们还将深入研究其他确定模块性能的方法：我们将使用\
  \ `console.log` 和 `Date.now` 来测量应用程序的性能，并使用测试套件 `benchmark.js` 为应用程序收集详细的性能数据。然后，为了好玩，我们将打印\
  \ Chrome JavaScript V8 引擎针对 JavaScript 函数的中间表示（IR）字节码。JavaScript IR 字节码可以让你了解 JavaScript\
  \ 函数的工作原理，这有助于判断应该在 WebAssembly 还是 JavaScript 中编写该函数。\n\n## 使用性能分析器\n\n`Profilers`（分析器）是分析应用程序性能不同层面的工具，包括应用的内存使用和执行时间。这可以帮助你决定在哪里进行优化以及针对什么进行优化。你通常需要在不同类型的优化之间进行权衡。例如，你需要决定是专注于改进交互响应时间（TTI）以便用户能尽快开始使用你的应用程序，还是专注于应用程序运行后的峰值性能。如果你正在编写一个游戏，那么较长的加载时间是值得的，以确保游戏在下载完成后运行得更顺畅。然而，在线商店可能更倾向于确保用户尽快与网站进行交互。在大多数情况下，你需要在两者之间取得平衡，使用性能分析器可以提供帮助。\n\
  \n分析器也能高效地发现代码中的瓶颈，让你将精力和精力集中在这些位置。我们将查看 Chrome 和 Firefox 的分析器，因为它们目前对 WebAssembly\
  \ 有最好的支持。我们将对第 8 章中的碰撞检测应用进行性能分析。\n\n### Chrome Profiler\n\n你可能希望在使用 Chrome 分析器时开启无痕窗口。无痕窗口不会加载网站缓存、Cookie\
  \ 或 Chrome 插件，这些插件在性能分析时会产生问题，因为它们会运行额外的 JavaScript 代码并影响你想分析的站点性能。缓存和 Cookie 通常问题不不大，但可能会用与要分析代码无关的数据污染环境。你可以通过点击网络浏览器右上角菜单中的\
  \ `New incognito window`（新建无痕窗口）来打开无痕窗口，如图 9-1 所示。\n\n![f09001](img/f09001.png)\n\
  \n图 9-1：在 Chrome 中打开无痕窗口。\n\n打开无痕浏览器窗口后，确保你正在使用命令行命令 `node server.js` 运行 Web 服务器，并在浏览器中输入\
  \ `localhost:8080/collide.html`。点击右上角菜单中的 `More Tools`（更多工具）▶`Developer tools`（开发者工具），如图\
  \ 9-2\n\n图 9-2：在 Chrome 中打开开发者工具。\n\n你应该能在开发者工具的顶部看到几个标签页。要查看分析器，点击 `Performance`（性能），如图\
  \ 9-3\n\n图 9-3：在 Chrome 中打开 Performance 标签页。\n\nPerformance 标签页在首次打开时提供两个选项：Record（录制）和\
  \ Reload（重新加载）。`Record` 按钮不在重新加载应用程序的情况下开始录制分析。当你不太关心应用程序的启动时间而更关注峰值性能时，这种分析最为重要。在我们分析之前，请确保\
  \ `Performance` 标签页顶部的 `Memory`（内存）复选框已勾选。如果没有勾选，内存堆将被分析。如果你想从初始化开始分析应用程序，可以点击 `Reload`\
  \ 按钮。点击 `Record` 继续。录制大约五秒后，点击如图 9-4 所示的 `Stop`。\n\n![f09004](img/f09004.png)\n\n\
  图 9-4：在 Chrome 中录制分析\n\n录制停止后，分析器将打开并显示应用程序渲染的每一帧记录。下半部分的 `Summary`（摘要）标签显示，该应用程序大部分执行时间都消耗在\
  \ Scripting（脚本执行）上（图 9-5），这包含了 JavaScript 和 WebAssembly 的时间。\n\n![f09005](img/f09005.png)\n\
  \n图 9-5：录制分析后的 Chrome Performance 标签页\n\n在主 Performance 页面上，饼图显示了在 Scripting、Rendering、Painting、System\
  \ 和 Idle 上花费的处理器时间。饼图上方是一系列标签，包括 Summary、Bottom-Up、Call Tree 和 Event Log，我们将在本章中探索所有内容。标签上方的区域显示了分配的\
  \ JS 堆内存，再上方是渲染帧、CPU 和 FPS 信息。让我们在下一节中快速查看 JavaScript 堆内存。\n\n### JavaScript 堆内存\n\
  \n在图 9-5 中的分析显示内存出现了增长。我们将花一点时间研究为什么会发生这种情况。首先，我们将检查在进行垃圾回收之前分配了多少内存。有些开发者认为，因为\
  \ JavaScript 是一门垃圾回收语言，所以他们不需要担心内存。遗憾的是，事实并非如此；你的代码创建对象的速度可能比垃圾回收的速度快。\n\n经过一些分析，我们可以看到堆增长到了\
  \ 2.2MB，在垃圾回收器运行后，堆回落到 1MB。垃圾回收器运行前可能需要几分钟，所以请耐心。图 9-6 显示了垃圾回收期间的 JS 堆分析。如你所见，在图右侧，堆的大小突然下降了\
  \ 1MB。\n\n![f09006](img/f09006.png)\n\n图 9-6：垃圾回收期间的内存下降\n\n最好是精确确定这种内存分配发生的地点，因为如果我们能减慢堆的增长，就可能会减轻垃圾回收器的负担。\n\
  \n### 追踪内存分配\n\n由于堆的增长是持续的，我们可以推断内存分配可能发生在每一帧渲染中。该应用程序执行的大部分工作都在 WebAssembly 模块中，因此我们首先注释掉\
  \ WebAssembly 调用，查看内存是否继续显示相同的 JS 增长情况。打开 *collide.html* 并注释掉 `animate` 函数内部对 `animation_wasm()`\
  \ 的调用，如代码 9-1 所示。\n\n**collide.html**\n\n```javascript\n...\n    function animate()\
  \ {\n    //      animation_wasm();\n      ctx.putImageData(image_data, 0, 0); //渲染像素数据\n\
  \      requestAnimationFrame(animate);\n    }\n...\n```\n\n代码 9-1：注释掉 `animation_wasm`\
  \ 函数调用\n\n现在刷新页面并录制新的分析。图 9-7 显示了没有 `animation_wasm` 函数调用的新 JS 堆分析图。\n\n![f09007](img/f09007.png)\n\
  \n图 9-7：移除 `animation_wasm` 函数后的堆内存分配图\n\n\n\n\n\n如果没有对 WebAssembly 模块的调用，应用程序将无法正常运行。然而，你仍然能看到相同的\
  \ JS 堆增长分析，因此内存增长似乎并非来自 WebAssembly 模块。让我们取消对 WebAssembly 模块的注释；然后注释掉对 `ctx.putImageData`\
  \ 的调用并创建另一个分析，如列表 9-2 所示。\n\n`collide.html`\n\n```\n function animate() {\n    \
  \  animation_wasm();\n  //   ctx.putImageData(image_data, 0, 0); // render pixel\
  \ data\n      requestAnimationFrame(animate);\n    }\n```\n\n列表 9-2：`animation_wasm`\
  \ 函数已恢复；`putImageData` 被移除。\n\n通过注释掉 `ctx.putImageData` 的调用，我们现在可以创建一个新的分析来检查内存增长（图\
  \ 9-8）。\n\n![f09008](img/f09008.png)\n\n图 9-8：移除 `putImageData` 调用后，内存增长变慢。\n\n\
  在没有没有 `ctx.putImageData` 用的情况下，内存增长大幅减缓。增长仍然发生，但它呈现出较慢的阶梯式增长模式，而不是几乎垂直直线的上升。看起来\
  \ `ctx.putImageData` 的调用在内部创建了大型对象，垃圾回收器最终需要移除这些对象。现在我们知道这些内存是如何分配的。由于 `ctx.putImageData`\
  \ 是内置函数，我们无法对其进行优化。如果内存分配是问题所在，我们需要寻找替代方法来渲染到画布。\n\n### 帧 (Frames)\n\n在分析器（Profiler）窗口中，堆内存上方有一个区域提供了更多性能信息，包括渲染的每帧数（fps）。它还显示了一个显示\
  \ CPU 使用率的图表。此外每个渲染帧的小缩略图。当你将鼠标移动到这些帧上时，可以观察应用程序是如何渲染动画的（图 9-9），如果你的应用程序运行不符合预期，这将非常有帮助。\n\
  \n![f09009](img/f09009.png)\n\n图 9-9：在分析器中查看单个帧渲染\n\n你可以将鼠标悬停在绿色的 `Frames` 框上，以查看分析中任何点的\
  \ fps（图 9-10）。\n\n![f09010](img/f09010.png)\n\n图 9-10：在分析器中查看 fps\n\n如你所见，应用程序执行到此点的帧速率为\
  \ 18 fps。当我们滑过这些帧时，该数字在 17 到 20 之间波动。每秒帧数是碰撞检测应用性能的主要衡量指标，因此我们需要记住显示大约 18 fps 的分析，以便与稍后的结果进行比较。请记住，运行分析器似乎会损害应用程序的性能，因此尽管这些结果之间具有参考价值，但对于应用程序在真实环境中的运行情况可能并不完全准确。\n\
  \n### 自底向上 (Bottom-Up)\n\nBottom-Up 选项卡显示了应用程序内调用的函数、它们运行的总时间以及自执行时间（Self Time），自执行时间是指排除其调用的函数消耗的时间后的函数运行时间。自执行时间非常有用，因为调用其他运行耗时长的函数的函数总是显示出更长的总时间，如图\
  \ 9-11 所示。\n\n![f09011](img/f09011.png)\n\n图 9-11：Chrome 的 Bottom-Up 标签窗口\n\n`<wasm-unnamed>`\
  \ 的自执行时间目前是最长的。几个函数的总时间更长，例如 `animate`，因为 `animate` 函数调用了 WebAssembly 模块。遗憾的是，Chrome\
  \ 没有指明它在 WebAssembly 模块内部调用了哪个函数，但我们可以一眼看出，应用程序将超过 90% 的处理时间花在了执行 WebAssembly 上。\n\
  \n### Firefox 分析器 (Firefox Profiler)\n\n使用 Firefox 分析器是收集应用程序性能数据的另一种极佳方法。我建议在运行\
  \ Firefox 分析器时打开无痕窗口。通过打开浏览器右上角的菜单并点击`新建无痕窗口`（图 9-12）来实现。\n\n![f09012](img/f09012.png)\n\
  \n图 9-12：在 Firefox 中打开新建无痕窗口。\n\n点击 `Web 开发者`▶`性能` 打开分析器（图 9-13）。\n\n![f09013](img/f09013.png)\n\
  \n图 9-13：在 Firefox 菜单中点击 `Web 开发者`▶`性能`。\n\n在“性能”菜单中，点击`开始记录性能`按钮以记录性能数据。几秒后，停止记录。图\
  \ 9-14 显示了你在“性能”选项卡中看到的类似内容。瀑布图（Waterfall）选项卡（记录后的默认视图）显示了顶层函数调用以及它们执行所需的时间。\n\n\
  ![f09014](img/f09014.png)\n\n图 9-14：Firefox 性能窗口瀑布图选项卡\n\n向下滚动查看垃圾回收发生在何时以及运行需要多长时间。此报告对于我们的应用程序来说有点枯燥，因为它主要执行\
  \ `requestAnimationFrame`。窗口顶部的三个选项卡提供了更多信息。瀑布图选项卡让你大致了解哪些任务运行时间较长。我们不会详细介绍瀑布图选项卡，因为它更像是一个*运行时一览*摘要。相反，我们将查看调用树（Call\
  \ Tree）和 JS 火焰图（JS Flame Chart）选项卡。\n\n### 调用树 (Call Tree)\n\nCall Tree 选项卡显示了应用程序花费时间最多的函数调用。该界面允许你深入查看每个函数并查看它们发出的调用。图\
  \ 9-15 显示了调用树选项卡的截图。\n\n![f09015](img/f09015.png)\n\n图 9-15：Firefox 调用树选项卡\n\n一个非常用的功能是，你可以点击你的\
  \ WebAssembly 文件的名称，链接将带你进入 WebAssembly 代码中相应的函数。虽然函数名丢失了，但后面跟着一个显示函数编号的索引。这使得更容易确定函数调用的内容。\n\
  \n### JS 火焰图 (JS Flame Chart)\n\nJS Flame Chart 选项卡的信息与 Call Tree 选项卡看到的基本相同，但它是按照时间线组织的，而不是摘要形式。你可以缩放图表的特定部分，以查看分析中该点运行了哪些函数（图\
  \ 9-16）。\n\n![f09016](img/f09016.png)\n\n图 9-16：Firefox 火焰图\n\n这里是 JavaScript `animate`\
  \ 函数的调用。`animate` 函数大部分时间花在运行 `wasm-function[6]` 上，这是我们 WAT 代码中的第七个函数，名为 `$main`。`$main`\
  \ 函数调用了 `wasm-function[5]`（即 `$get_obj_attr`）和 `wasm-function[1]`（即 `$abs`）。\n\n\
  这些选项卡中的每一个都在左侧显示最小和最大 fps，右侧显示平均 fps。分析器的左侧看起来像图 9-17。\n\n![f09017](img/f09017.png)\n\
  \n图 9-17：Firefox 最大 fps\n\n如你所见，最大 fps 略大于 22，最小 fps 小于 5。正如之前提到的，运行分析器可能会影响 fps。平均\
  \ fps 在分析器的右侧（图 9-18）。\n\n![f09018](img/f09018.png)\n\n图 9-18：Firefox 平均 fps\n\n\
  此分析的平均 fps 大约为 14 fps。在下一节中，我们将查看如何使用 `wasm-opt` 提高应用程序的性能。\n\n\n\n\n我们使用 `wasm-opt`\
  \ 命令行工具对 WebAssembly 文件运行性能优化。它带有 `wat-wasm` 和 `Binaryen.js`。如果你已经安装了用于 `wat2wasm`\
  \ 工具的 `wat-wasm`，那么你应该已经拥有了该版本，可以跳过下一节。如果没有安装，请安装 `Binaryen.js`，它是 Binaryen WebAssembly\
  \ 工具的 JavaScript 版本，用于将中间表示 (IR) 转换为 WebAssembly 代码。它包含了一些优化 WebAssembly 代码的有用选项。\n\
  \n### 安装 Binaryen\n\n安装 Binaryen 有几种可选方法。我推荐使用 `Binaryen.js`，你可以通过 `npm` 运行以下命令进行安装：\n\
  \n```\nnpm install binaryen -g\n```\n\n对于那些感兴趣从源码编译的用户，可以在 GitHub 上找到：[`github.com/WebAssembly/binaryen`](https://github.com/WebAssembly/binaryen)。此外还有一个名为\
  \ `wasm-opt` 的 `npm` 程序包，它会安装 `Binaryen` 的特定于平台的二进制文件，但我建议使用 `npm` 安装 `wat-wasm`\
  \ 或 `binaryen.js`。\n\n### 运行 wasm-opt\n\n`wasm-opt` 工具具有许多标志，可以用来减小下载大小并优化你的 WebAssembly\
  \ 模块的执行。你使用这些标志来告诉优化器是侧重于性能还是下载大小。如果可以在不影响性能的情况下减小文件大小，那么在任何一种情况下都会进行该更改。如果可以在不影响下载大小的情况下提高性能，情况也是如此。这些标志告诉编译器在需要考虑权衡时优先选择哪种优化。\n\
  \n我们将针对 `collide.wasm` 文件运行两种类型标志的 `wasm-opt`，首先以大小优化为偏好开始，然后以性能优化为偏好重新编译它。这些标志在任何使用\
  \ Binaryen 的工具链（如 Emscripten 或 AssemblyScript）中都是相同的。我们将查看的前两个标志将针对大小优化 WAT 文件。\n\
  \n#### 针对下载大小进行优化 \n\n`wasm-opt` 命令有两个用于优化 WebAssembly 文件下载大小的标志：`-Oz` 和 `-Os`。这里的\
  \ O 是大字母 O，而不是数字零。`-Oz` 标志会创建一个更小的 WebAssembly 文件，但缩小文件大小所需的时间更长。`-Os` 创建的 WebAssembly\
  \ 文件略大，但执行时间更短。我们的应用程序很小，因此运行任何优化所需的时间也微乎其微。如果你正在创建一个编译时间很长的大型 Emscripten 项目，你可能会使用\
  \ `-Os`。对于我们的目的，我们不需要使用 `-Os`。列表 9-3 显示了如何使用 `-Oz` 标志优化我们的 `collide.wasm` 文件以减小其大小。\n\
  \n```\nwasm-opt collide.wasm -Oz -o collide-z.wasm\n```\n\n列表 9-3：运行 `wasm-opt`\
  \ 以优化 `collide.wasm` 下载大小\n\n当你运行此优化时，WebAssembly 文件的尺寸从 709 字节缩小到 666 字节。这仅减少了约\
  \ 6%，但我们不需要付出任何努力就达到了目标。通常，当配合工具链使用此标志时，你会获得更好的减小效果。\n\n### 针对执行时间进行优化\n\n当你编写游戏时，你对提高\
  \ fps 的兴趣会大于下载时间。有三个优化标志：`-O1`、`-O2` 和 `-O3`。再次，O 是字母 o，而不是数字零。`-O3` 标志提供了最高级别的优化，但执行时间最长。`-O1`\
  \ 标志执行时间最短，但提供的优化最少。`-O2` 标志处于两者之间。由于我们的应用非常小，运行 `-O1` 和 `-O3` 所需的时间没有显著差异。在列表 9-4\
  \ 中，我们使用 `-O3` 标志来充分利用对 `collide.wasm` 文件的优化。\n\n```\nwasm-opt collide.wasm -O3\
  \ -o collide-3.wasm\n```\n\n列表 9-4：使用 `wasm-opt` 优化 `collide.wasm` 文件的性能\n\n一旦有了新版本的\
  \ `collide.wasm` 文件，修改 `collide.html` 文件以运行优化版本。现在当我们通过性能分析器运行它，就可以了解性能改进的情况。在 Chrome\
  \ 中进行性能分析显示，应用程序现在以 35 fps 运行 (图 9-19)。\n\n![f09019](img/f09019.png)\n\n图 9-19：优化后的\
  \ `collide-3.wasm` 文件在 Chrome 中的新 fps\n\n图 9-10 显示原始帧速率为 18 fps。仅运行 `wasm_opt` 就可以让你的应用程序在\
  \ Chrome 中的帧率翻倍。让我们看看在 Firefox 中运行性能分析器会发生什么 (图 9-20)。\n\n![f09020](img/f09020.png)\n\
  \n图 9-20：优化后的 `collide-3.wasm` 文件在 Firefox 中的新 fps\n\n回看图 9-18，我们之前的速度只有 14 fps，仅仅运行\
  \ `wasm-opt` 就能让应用程序在 Firefox 中的帧率翻了一倍。在下一节中，我们将查看反汇编代码。\n\n### 查看代码\n\n你应该安装了 VS\
  \ Code 的 WebAssembly 扩展。在 Visual Studio 中，你可以右键点击 WebAssembly 文件并选择 `Show WebAssembly`。在列表\
  \ 9-5 中，我们在命令行中使用 `wasm2wat` 将 `collide-3.wasm` 转换。\n\n```\nwasm2wat collide-3.wasm\
  \ -f -o collide-3.wat\n```\n\n列表 9-5：使用 `wasm2wat` 反汇编 *collide-3.wasm* 为 WAT\n\n\
  ### 内联函数\n\n\n\n\n调用函数会有极小的开销。除非函数每秒被调用数千或百万次，否则这种开销通常不是大问题。内联（Inlining）是将函数调用替换为相同代码的内联副本的过程。这样做消除了函数调用所需的额外处理开销，但会增加\
  \ WebAssembly 模块的大小，因为代码会在调用函数的每个地方都重复出现。当我们对 `collide.wasm` 模块运行优化器时，它内联了七个函数中的四个。让我们来看一个函数内联的简单示例。下面的\
  \ WAT 代码并不是应用程序的一部分，只是是一个演示。在列表 9-6 中，我们创建了一个将三个数字相加的函数，然后创建另一个函数多次调用 `$add_three`。\n\
  \n```\n (func $add_three ;; 函数将三个数字相加\n    (param $a i32)\n    (param $b i32)\n\
  \    (param $c i32)\n    (result i32)\n    local.get $a\n    local.get $b\n    local.get\
  \ $c\n    i32.add\n    i32.add\n  )\n  (func (export \"inline_test\")  ;; 我将在 inline_test\
  \ 中内联函数\n    (param $p1 i32)\n    (param $p2 i32)\n    (param $p3 i32)\n    (result\
  \ i32)\n    (call $add_three (local.get $p1) (i32.const 2) (local.get $p2))\n  \
  \  (call $add_three (local.get $p3) (local.get $p1) (i32.const 13))\n    ;; 将结果相加并返回\n\
  \    i32.add\n )\n```\n\n列表 9-6：内联的演示代码\n\n本节我们将专注于内联作为优化手段。为了内联这些函数，我们在每个调用它们的地方都剪切并粘贴函数的内容。在列表\
  \ 9-7 中，灰色代码是原始的函数调用，随后的代码是内联后的函数。\n\n```\n (func (export \"inline_test\");; 我将在\
  \ inline_test 中内联函数\n    (param $p1 i32)\n    (param $p2 i32)\n    (param $p3 i32)\n\
  \    (result i32)\n;;  (call $add_three (local.get $p1) (i32.const 2) (local.get\
  \ $p2))\n;;  上面的函数被内联到下面的代码中\n    local.get $p1\n    i32.const 2\n    local.get\
  \ $p2\n    i32.add\n    i32.add\n;;  (call $add_three (local.get $p3) (local.get\
  \ $p1) (i32.const 13))\n;;  上面的函数被内联到下面的代码中\n    local.get $p3\n    local.get $p1\n\
  \    i32.const 13\n    i32.add\n    i32.add\n\n    i32.add\n )\n```\n\n列表 9-7：手动内联代码的示例\n\
  \n内联函数调用可能会暴露其他优化机会。例如，你可以看到我们正在添加 `2`，随后又添加了 `13`。由于这两个值都是常数，如果我们直接加上 `15`，代码性能会更好。\n\
  \n让我们写一个可能被内联的小模块，对其进行编译和优化，然后查看 `wasm-opt` 生成的代码。我们将创建一个包含三个函数的模块：`$add_three`、`$square`\
  \ 和 `$inline_test`。创建一个名为 `inline.wat` 的 WAT 文件，并在列表 9-8 中添加代码。\n\n**inline.wat**\n\
  \n```\n(module\n  (func $add_three\n    (param $a i32)\n    (param $b i32)\n   \
  \ (param $c i32)\n    (result i32)\n    local.get $a\n    local.get $b\n    local.get\
  \ $c\n    i32.add\n    i32.add\n  )\n  (func $square\n    (param $a i32)\n    (result\
  \ i32)\n    local.get $a\n    local.get $a\n    i32.mul\n  )\n  (func $inline_test\
  \ (export \"inline_test\")\n    (param $p1 i32)\n    (param $p2 i32)\n    (param\
  \ $p3 i32)\n    (result i32)\n    (call $add_three (local.get $p1) (i32.const 2)\
  \ (local.get $p2))\n    (call $add_three (local.get $p3) (local.get $p1) (i32.const\
  \ 13))\n    call $square\n  )\n)\n```\n\n列表 9-8：我们将使用 `wasm-opt` 内联这段代码`$add_three`\
  \ 函数是我们在列表 9-7 中手动内联的同一个函数。`$square` 函数乘以栈顶的值，而 `$inline_test` 函数是调用者函数。让我们使用 `wat2wasm`\
  \ 编译 `$inline_test` 函数：\n\n```\nwat2wasm inline.wat\n```\n\n现在我们可以使用 `wasm-opt`\
  \ 优化它：\n\n```\nwasm-opt inline.wasm -O3 -o inline-opt.wasm\n```\n\n最后，使用 `wasm2wat`\
  \ 将其转换 WAT：\n\n```\nwasm2wat inline-opt.wasm\n```\n\n现在我们可以打开 `inline-opt.wat` 查看我们优化后的代码（列表\
  \ 9-9）。\n\n**inline-opt.wat**\n\n```\n(module\n  (type (;0;) (func (param i32 i32\
  \ i32) (result i32)))\n  (func (;0;) (type 0) (param i32 i32 i32)\n    (result i32)\
  \ ;; inline_test 函数\n    local.get 0\n    local.get 1\n    i32.const 2  \n    i32.add\n\
  \    i32.add\n    local.get 2\n    local.get 0\n    i32.const 13\n    i32.add\n\
  \    i32.add\n    local.tee 0\n    local.get 0\n    i32.mul\n    i32.add\n    local.tee\
  \ 0\n    local.get 0\n    i32.mul)\n  (export \"inline_test\" (func 0)))\n```\n\n\
  列表 9-9：`inline.wat` 和 `inline-opt.wat` 的优化版本。优化器删除了 `$add_three` 和 `$square` 两个函数并将代码内联到了\
  \ `inline_test` 函数中。\n\n### 相乘、除法与移位\n\n第 8 章展示了如何通过右移位来快速乘以 2 的幂。例如，左移 3 位相当于乘以\
  \ 2³。同样，右右整数相当于除以该幂。例如，右移 4 位相当于除以 2⁴。让我们 `wasm-opt` 如何处理 2 的幂乘法和除法。创建一个名为 `pow2_mul.wat`\
  \ 的新 WAT 文件并在列表 9-10 中添加代码，它创建一个乘和除以 2 的幂的模块。\n\n**pow2_mul.wat**\n\n```\n(module\n\
  \  (func (export \"pow2_mul\")\n    (param $p1 i32)\n    (param $p2 i32)\n    (result\
  \ i32)\n    local.get $p1\n    i32.const 16\n    i32.mul ;; 乘以 16，即 2⁴\n    local.get\
  \ $p2\n    i32.const 8\n    i32.div_u ;; 除以 8，即 2³\n    i32.add\n  )\n)\n```\n\n\
  列表 9-10：乘和除以 2 的幂的函数使用 `wat2wasm` 编译此代码，使用 `wasm-opt` 优化 WebAssembly 文件，然后使用 `wasm2wat`\
  \ 将 WebAssembly 文件反汇编回 WAT 文件。然后在 VS Code 中打开 `pow2_mul.wat` 的优化版本，如列表 9-11 所示。\n\
  \n**pow2_mul_optimized.wat**\n\n```\n(module\n  (type (;0;) (func (param i32 i32)\
  \ (result i32)))\n  (func (;0;) (type 0) (param i32 i32) (result i32)\n    local.get\
  \ 1\n    i32.const 8\n    i32.div_u\n    local.get 0\n    i32.const 4\n    i32.shl\n\
  \    i32.add)\n  (export \"pow2_mul\" (func 0)))\n```\n\n列表 9-1：列表 9-10 的优化版本。注意，优化后的代码在对第一个参数执行乘法之前先对第二个参数执行除法。当你乘以\
  \ 2 的幂常量时，`wasm-opt` 将转换为左移。然而，它并不总是将 2 的幂除法替换为右移。在本章稍后的部分，我们将花时间通过 *benchmark.js*\
  \ 运行不同版本的代码以查看它们的性能\n\n### 合并常量\n\n优化通常会合并常量以提高性能。例如，假设你有两个相加的常数偏移量。你的原始代码是 *x*\
  \ = 3 + 8，但如果你在开始处设置 *x* = 11，代码性能会更好。这种情况对肉眼来说并不总是明显的，但 `wasm-opt` 擅长为你寻找这些情况。作为一个示例，创建一个名为\
  \ `combine_constants.wat` 的 WAT 文件并在列表 9-12 中添加代码，它仅合并了三个常量。\n\n**combine_constants.wat**\n\
  \n```\n(module\n  (func $combine_constants (export \"combine_constants\")\n    (result\
  \ i32)\n    i32.const 10\n    i32.const 20\n    i32.add\n    i32.const 55\n    i32.add\n\
  \  )\n)\n```\n\n\n\n\n## 列表 9-12: 将三个常数相加的函数\n\n注意，$combine_constants 返回的值将始终是 85。`wasm-opt`\
  \ 工具足够智能，能够识别出这一点。当你通过 `wat2wasm`、`wasm-opt` 然后 `wasm2wat` 运行该代码时，你将在列表 9-13 中看到代码。\n\
  \n**combine_constants_optimized.wat**\n\n```wat\n(module\n  (type (;0;) (func (result\
  \ i32)))\n  (func (;0;) (type 0) (result i32)\n1 i32.const 85)\n  (export \"combine_constants\"\
  \ (func 0)))\n```\n\n# 列表 9-13: 三个常数的相被合并为一个常数。\n\n### 三个常数的相加合并为一个常数。\n\n在列表 9-13\
  \ 中的函数返回 `85`，并且没有去执行那两次加法。\n\n## DCE\n\n死代码消除（DCE）是一种优化技术，用于移除模块中未被调用或导出的代码。这是一种直接的优化，不会提高执行时间，但会减小下载体积。无论你使用哪种优化标记，DCE\
  \ 都会发生。让我们来看一个简单的示例。打开名为 `dce_test.wat` 的新文件，并添加列表 9-14 中的代码，该代码创建一个包含两个从未使用的函数的模块。\n\
  \n**dce_test.wat**\n\n```wat\n(module\n1 (func $dead_code_1\n    (param $a i32)\n\
  \    (param $b i32)\n    (param $c i32)\n    (result i32)\n    local.get $a\n  \
  \  local.get $b\n    local.get $c\n    i32.add\n    i32.add\n  )\n2 (func $dead_code_2\n\
  \    (param $a i32)\n    (result i32)\n    local.get $a\n    local.get $a\n    i32.mul\n\
  \  )\n  (func $dce_test (export \"dce_test\")\n    (param $p1 i32)\n    (param $p2\
  \ i32)\n    (result i32)\n    local.get $p1\n    local.get $p2\n    i32.add\n  )\n\
  )\n```\n\n## 列表 9-14: 该模块有两个未使用的函数。\n\n前两个函数 `$dead_code_1` 和 `$dead_code_2` 未被调用也没有导出。我们运行的任何优化都会移除这些函数。运行\
  \ `wat2wasm` 生成代码，使用带有 `-O3` 标记的 `wasm-opt` 进行优化，然后使用 `wasm2wat` 将其转换回 WAT 文件。打开新文件查看运行优化后的代码，如列表\
  \ 9-15 所示。\n\n**dce_test_optimized.wat**\n\n```wat\n(module\n  (type (;0;) (func\
  \ (param i32 i32) (result i32)))\n  (func (;0;) (type 0) (param i32 i32) (result\
  \ i32)\n    local.get 0\n    local.get 1\n    i32.add)\n  (export \"dce_test\" (func\
  \ 0)))\n```\n\n## 列表 9-15: 两个函数被 DCE 移除。\n\n### 两个函数被 DCE 移除。\n\n剩余的函数是 `\"dce_test\"\
  `。使用 DCE 将模块的大小从 79 字节减少到 46 字节。\n\n## 与 JavaScript 比较碰撞检测应用\n\n我们已经看到了我们的 WebAssembly\
  \ 碰撞检测应用的性能。让我们用 JavaScript 快速地编写该代码，并将其性能与 WebAssembly 版本进行比较。创建一个名为 `collidejs.html`\
  \ 的网页。首先在 `collide.html` 页面中添加头部和 `canvas` 元素，并将其重新保存为 `collidejs.html`，如列表 9-16\
  \ 所示。\n\n**collidejs.html (第 1 部分，共 2 部分)**\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1.0\">\n    <title>Collide JS</title>\n</head>\n\
  <body\n    <canvas id=\"canvas\" width=\"1024\" height=\"1024\"></canvas>\n...\n\
  ```\n\n# 列表 9-16: collidejs.html 中的 HTML 头部和 canvas 元素\n\n### collidejs.html 中的\
  \ HTML 头部和 canvas 元素。\n\n这段代码与应用的 WebAssembly 版本相似。主要的区别在于 `script` 标签，如列表 9-17\
  \ 所示。在 `script` 标签中添加以下 JavaScript。\n\n**collidejs.html (第 2 部分，共 2 部分)**\n\n```javascript\n\
  ...\n    <script type=\"text/javascript\">\n        // javascript version\n    \
  \    var animate_callback;\n        const out_tag = document.getElementById('out');\n\
  \        const out_size = 1024;\n\n        const canvas = document.getElementById(\"\
  canvas\");\n        const ctx = canvas.getContext(\"2d\");\n\n        class Collider\
  \ {\n            constructor() {\n                this.x = Math.random() * out_size;\n\
  \                this.y = Math.random() * out_size;\n                this.xv = (Math.random()\
  \ - 0.5) * 5;\n                this.vy = (Math.random() - 0.5) * 5;\n          \
  \      this.color = \"green\";\n            }\n\n            move() {\n        \
  \        this.x += this.xv;\n                this.y += this.vy;\n\n            \
  \    if (this.x < 0 || this.x > out_size) {\n                    this.xv = -this.xv;\n\
  \                }\n                if (this.y < 0 || this.y > out_size) {\n   \
  \                 this.vy = -this.vy;\n                }\n            }\n\n    \
  \        draw() {\n                ctx.beginPath();\n                ctx.arc(this.x,\
  \ this.y, 2, 0, Math.PI * 2);\n                ctx.fillStyle = this.color;\n   \
  \             ctx.fill();\n            }\n\n            hitTest(c2) {\n        \
  \        let x_dist = this.x - c2.x;\n                let y_dist = this.y - c2.y;\n\
  \n                if (Math.abs(x_dist) < 5 && Math.abs(y_dist) < 5) {\n        \
  \            this.color = \"red\";\n                    return true;\n         \
  \       } else {\n                    this.color = \"green\";\n                }\n\
  \                return false;\n            }\n        }\n\n        let collider_array\
  \ = [];\n        for (let i = 0; i < 50; i++) {\n            collider_array.push(new\
  \ Collider());\n        }\n\n        function animate() {\n            // clear\n\
  \            ctx.clearRect(0, 0, canvas.width, canvas.height);\n            for\
  \ (let i = 0; i < collider_array.length; i++) {\n                collider_array[i].move();\n\
  \            }\n\n            // loop and render\n            for (let i = 0; i\
  \ < collider_array.length; i++) {\n                for (let j = 0; j < collider_array.length;\
  \ j++) {\n                    if (i === j) {\n                        continue;\n\
  \                    }\n                    if (collider_array[i].hitTest(collider_array[j]))\
  \ {\n                        break;\n                    }\n                }\n\
  \                collider_array[i].draw();\n            }\n            requestAnimationFrame(animate);\n\
  \        }\n        requestAnimationFrame(animate);\n    </script>\n</body>\n</html>\n\
  ```\n\n## 列表 9-17: 碰撞碰撞检测应用的 JavaScript 版本\n\n### 碰撞检测应用的 JavaScript 版本。\n\n我不会详细介绍列表\
  \ 9-17 中的代码，因为它的目的只是为了与第 8 章中的 WebAssembly 代码进行对比。\n\n\n\n\n\n在本节中，你学习了如何使用 Firefox\
  \ 和 Chrome 的性能分析器将你的 WebAssembly 代码与类似的 JavaScript 代码进行比较。你现在应该能够利用这些知识在不同浏览器上比较应用程序的不同版本，以感受哪些代码最适合在\
  \ WebAssembly 中执行，哪些最适合使用 JavaScript。\n\n## 手动优化 WAT\n\n我花了一些时间手动对我的 WebAssembly\
  \ 碰撞检测应用进行优化，并提高了帧率（fps）。变化比比书中描述的要多。然而，我想指出如果你愿意花时间手动优化，可能会获得的性能提升。在 Chrome 性能分析器中，我让碰撞检测应用达到了高达\
  \ 36 fps（图 9-24）。\n\n![f09024](img/f09024.png)\n\n图 9-24：在 Chrome 中运行的手动优化碰撞检测应用\n\
  \nFirefox 的帧率更高，达到了 52 fps（图 9-25）。\n\n![f09025](img/f09025.png)\n\n图 9-25：在 Firefox\
  \ 中运行的手动优化碰撞检测应用\n\n你可以在 [`wasmbook.com/collide.html`](https://wasmbook.com/collide.html)\
  \ 查看我手动优化的成果，并在 [`wasmbook.com/collide.wat`](https://wasmbook.com/collide.wat) 查看\
  \ WAT 代码。我对我精调过的代码运行了 `Binaryen` 优化器，它实际上让代码变慢了几个 fps。Binaryen 会不断改进其优化输出。当你读到这里时，结果可能会有所不同。\n\
  \n## 记录性能\n\n记录 JavaScript 应用性能的最简单方法之一是使用 `Date` 类和 `console.log` 函数。WebAssembly\
  \ 在不使用 JavaScript 的无法写入控制台。因此，我们需要使用 JavaScript 将 WebAssembly 和 JavaScript 代码的性能记录到控制台。\n\
  \n让我们看看从 JavaScript 频繁调用 WebAssembly 模块时产生的开销。我们将创建一个包含几个小函数的 WebAssembly 模块，并从\
  \ JavaScript 重复调用它们。创建一个名为 `mod_and.wat` 的文件，并添加列表 9-18 中的代码。\n\n**mod_and.wat**\n\
  \n```\n(module\n  (func $mod (export \"mod\")\n    (param $p0 i32)\n    (result\
  \ i32)\n    local.get $p0\n    i32.const 1000\n    i32.rem_u\n  )\n\n  (func $and\
  \ (export \"and\")\n    (param $p0 i32)\n    (result i32)\n    local.get $p0\n \
  \   i32.const 0x3ff\n    i32.and\n  )\n)\n```\n\n列表 9-18：取模运算与位与运算的性能比较\n\n该模块中有两个函数：寻找除以\
  \ `1000` 后余数的 `$mod` 函数，以及一个使用位与掩码的 `$and` 函数。使用 `wat2wasm` 编译 `mod_and.wat` 文件，并使用\
  \ `wasm-opt` 进行优化。\n\n接下来，我们需要创建一个 JavaScript 函数来运行此 WAT 模块，并与等效 JavaScript 代码进行测试。创建一个名为\
  \ `mod_and.js` 的新文件，并添加列表 9-19 中的代码。\n\n**mod_and.js**\n\n```javascript\nconst fs\
  \ = require('fs');\nconst bytes = fs.readFileSync('./mod_and.wasm');\n\n(async ()\
  \ => {\n  const obj =\n    await WebAssembly.instantiate(new Uint8Array(bytes));\n\
  \  let mod = obj.instance.exports.mod;\n  let and = obj.instance.exports.and;\n\n\
  \  let start_time = Date.now(); // reset start_time\n  // The '| 0' syntax 是给 JavaScript\
  \ 引擎的提示，告诉它\n  // 使用整数而不是浮点数，这在某些情况下\n  // 可以提高性能\n  for (let i = 0 | 0; i < 4_000_000;\
  \ i++) {\n    mod(i);  // call the mod function 4 million times\n  }\n// calculate\
  \ the time it took to run 4 million mod calls\n  console.log(`mod: ${Date.now()\
  \ - start_time}`);\n  start_time = Date.now(); // reset start_time\n\n  for (let\
  \ i = 0 | 0; i < 4_000_000; i++) {\n    and(i); // call the and function 4 million\
  \ times\n  }\n// calculate the time it took to run 4 million and calls\n  console.log(`and:\
  \ ${Date.now() - start_time}`);\n  start_time = Date.now(); // reset start_time\n\
  \  for (let i = 0 | 0; i < 4_000_000; i++) {\n    Math.floor(i % 1000);\n  }\n//\
  \ calculate the time it took to run 4 million modulo calls\n  console.log(`js mod:\
  \ ${Date.now() - start_time}`);\n})();\n```\n\n列表 9-19：使用 `Date.now` 记录运行时间\n\n\n\
  \n\n我们定义了 `mod_loop` 和 `and_loop` 函数，并记录每个循环执行所需的时间。接下来，我们运行循环，执行 10 亿次取模运算，并记录耗了多久。如果我们编译并优化我们的\
  \ WebAssembly 模块，然后使用 `node` 运行 `mod_and_loop.js`，我们应该看到类似 Listing 9-23 中输出的内容。\n\
  \n```\nand_loop: 31\nmod_loop: 32\njs mod: 52\n```\n\nListing 9-23：`mod_and_loop.js`\
  \ 的输出\n\n现在 WebAssembly 的速度比相同的 JavaScript 代码快了 67%。令人有些失望的是，位与与运算的性能并没有比取模运算好多少，正如我所希望的那样有提升。不过，我们现在已经知道了如何结合\
  \ `console.log` 和 `Date.now()` 进行最简单的性能测试。\n\n## 使用 benchmark.js 进行更高级的测试\n\n如果你想让测试比仅仅使用日志和\
  \ `Date.now()` 更高级一些，可以安装一个性能测试模块，例如 `benchmark.js`。在之前的 Listing 9-10 中，我们创建了一个\
  \ WebAssembly 函数，乘以 16 然后除以 8，并通过 `wasm-opt` 运行它，以查看 Binaryen 如何为我们优化代码。优化器将乘法操作替换为位移，但没有将除法替换为位移。它还重新排列了除法乘法的顺序。\n\
  \n让我们测试这个 WebAssembly 模块的多个版本，包括原始版本和优化器生成的版本，看看是否可以通过一些努力超越优化器。我们将使用 `benchmark.js`\
  \ 来测试这些函数的性能。创建一个名为 `pow2_test.wat` 的新 WAT 文件，并在 Listing 9-24 中添加代码。\n\n**pow2_test.wat\
  \ (第 1/5 部分)**\n\n```\n(module\n  ;; 这是我们编写的 原始函数\n  (func (export \"pow2\")\n \
  \   (param $p1 i32)\n    (param $p2 i32)\n    (result i32)\n    local.get $p1\n\
  \    i32.const 16\n    i32.mul\n    local.get $p2\n    i32.const 8\n    i32.div_u\n\
  \    i32.add\n  )\n...\n```\n\nListing 9-24：带有原始函数的模块开头\n\nListing 9-24 显示了我们 2\
  \ 的幂测试的原始版本，其中我们乘以 16 并除以 8。\n\n下一个函数在 Listing 9-25 中在乘法之前执行除法。我想测试一下这个，因为 `wasm-opt`\
  \ 交换了乘法和除法函数，我好奇这是否对函数的性能产生了积极影响。\n\n**pow2_test.wat (第 2/5 部分)**\n\n```\n...\n\
  \  ;; wasm-opt 将 div 放在 mul 之前，让我们看看这是否有帮助\n  (func (export \"pow2_reverse\")\n\
  \    (param $p1 i32)\n    (param $p2 i32)\n    (result i32)\n    local.get $p2\n\
  \    i32.const 8\n    i32.div_u\n    local.get $p1\n    i32.const 16\n    i32.mul\n\
  \    i32.add\n  )\n...\n```\n\nListing 9-25：交换除法和乘法\n\n下一个函数在 Listing 9-26 中对 2\
  \ 的幂乘法和除法都使用了位移。我们还使用了优化器插入的顺序，即除法发生在乘法之前。\n\n**pow2_test.wat (第 3/5 部分)**\n\n```\n\
  ...\n  ;; 将乘法和除法更改为位移\n  (func (export \"pow2_mul_div_shift\")\n    (param $p1 i32)\n\
  \    (param $p2 i32)\n    (result i32)\n    local.get $p2\n    i32.const 3\n   \
  \ i32.shr_u\n    local.get $p1\n    i32.const 4\n    i32.shl\n    i32.add\n  )\n\
  ...\n```\n\nListing 9-26：将乘法和除法表达式改为二进制位移\n\n接下来，在 Listing 9-27 中，我们对除法和乘法都使用了位移，但这次我们没有改变原始代码中除法和乘法的顺序。\n\
  \n**pow2_test.wat (第 4/5 部分)**\n\n```\n...\n  ;; 回到乘和除法的原始顺序\n  (func (export \"\
  pow2_mul_div_nor\")\n    (param $p1 i32)\n    (param $p2 i32)\n    (result i32)\n\
  \    local.get $p1\n    i32.const 4\n    local.get $p2\n    i32.const 3\n    i32.shr_u\n\
  \    local.get $p1\n    i32.const 4\n    i32.shl\n    i32.add\n  )\n)\n```\n\nListing\
  \ 9-27：乘法除法的原始顺序\n\n下一个函数在 Listing 9-28 中是由带有 `-O3` 标志的 `wasm-opt` 生成的。\n\n**pow2_test.wat\
  \ (第 5/5 部分)**\n\n```\n...\n  ;; 由 wasm-opt 生成\n  (func (export \"pow2_opt\")\n\
  \    (param $p1 i32)\n    (param $p2 i32)\n    (result i32)\n    local.get $p2\n\
  \    i32.const 8\n    i32.div_u\n    local.get $p1\n    i32.const 16\n    i32.mul\n\
  \    i32.add\n  )\n)\n```\n\nListing 9-28：函数的 `wasm-opt` 优化版本\n\n现在我们可以用 `wat2wasm`\
  \ 编译此模块，但我们*不应该*优化它，因为我们正在尝试测试原生的 WAT。接下来，我们需要创建我们的 *benchmark.js* 代码。首先，我们需要使用\
  \ `npm` 安装 *benchmark.js* 模块：\n\n```\nnpm i --save-dev benchmark\n```\n\n现在我们可以编写一个\
  \ JavaScript 程序来使用 *benchmark.js* 测试 WebAssembly 函数。让我们将此程序分成几部分并逐一分析。将 Listing\
  \ 9-29 中的代码添加到 *benchmark_test.js*。\n\n**benchmark_test.js**\n\n```javascript\n\
