  \ 程序。](img/httpatomoreillycomsourcemspimages748566.png.jpg)\n\n图 2-6。由 ASP.NET 开发服务器提供的运行的\
  \ JavaScript 程序。\n\n### 注意\n\n你可以通过其他方式声明脚本为 JavaScript，但你在这里看到的方法是支持最广泛的。\n\n接下来，脚本声明了一个函数\
  \ `yetAnotherAlert`，它接受一个参数 `textToAlert`，如下所示：\n\n```\nfunction yetAnotherAlert(textToAlert)\
  \ {\n```\n\n该函数有一个任务：在浏览器窗口中弹出一个警告框，显示作为函数参数所提供的任何文本，下一行代码实现了这一点：\n\n```\nalert(textToAlert);\n\
  ```\n\n函数的结束由右大括号 (`}`) 界定。脚本的下一行使用带引号的字符串参数调用了你刚刚声明的函数：\n\n```javascript\nyetAnotherAlert(\"\
  This is Chapter 2\");\n```\n\n有了这个脚本，你就准备好在 Visual Studio 2010 中开发 JavaScript 了。但在你庆祝之前，请考虑跟我一起，学习如何使用外部文件来存储你的\
  \ JavaScript 代码。\n\n## 在 Visual Studio 2010 中使用外部 JavaScript 文件\n\nJavaScript 不需要完全包含在网站网站的\
  \ HTML 文件中。相反，你可以利用 `<script>` 标签的 `src` 属性。标签内的属性有助于进一步定义元素或为元素提供更具体的信息。例如，`<form>`\
  \ 元素可能有一个 `action` 属性，定义了提交表单时应该发生什么操作。通过使用 `<script>` 标签的 `src` 属性，你可以定义外部 JavaScript\
  \ 文件的位置。Web 浏览器在加载网页时会读取指定文件中包含的 JavaScript。使用外部 JavaScript 文件意味着你可以在地方维护公共 JavaScript\
  \ 代码，而不是在每个单独页面中维护——这将为你节省大量工作。\n\n到为止，你应该有一个可以运行的网页（使用 Visual Studio 构建），得益于一些巧妙的\
  \ JavaScript，它会显示一个警告。你在上一节中开发的网页在页面的 `<head>` 部分包含了 JavaScript 代码。在本节中，我将向你展示如何将\
  \ JavaScript 放入外部文件，然后从 HTML 页面内部引用该代码。\n\n### 使用 Visual Studio 2010 为 JavaScript\
  \ 创建外部文件\n\n1.  如果 `myfirstpage.htm` 文件未打开，请进入 Visual Studio 并从 `File` 菜单选择 `Open\
  \ Project` 来打开它。选择你保存 `myfirstpage.htm` 文件的项目。\n\n2.  从 `File` 菜单中选择 `New File`\
  \ 创建持有 JavaScript 代码的新文件。`Add New Item` 对话框将打开，如下屏所示。在列表中选择 `HTML Page`，将名称更改为 `myfirstpage.htm`，然后点击\
  \ `Add`。注意，你的列表可能取决于 Visual Studio 的安装。你可以在示例代码中找到名为 `myscript.js` 的源文件。\n\n   \
  \ ![在 Visual Studio 2010 中使用 JavaScript 创建外部文件](img/httpatomoreillycomsourcemspimages748568.png.jpg)\n\
  \n3.  一个新的空的 JScript 文件将打开并添加到你的 Web 项目。你会看到 `myscript.js` 的标签页和另一个 `myfirstpage.htm`\
  \ 的标签页，如下所示。如果 `myfirstpage.htm` 文件未在标签页中打开，请通过双击 `Solution Explorer` 中的它。\n\n \
  \   ![在 Visual Studio 2010 中使用 JavaScript 创建外部文件](img/httpatomoreillycomsourcemspimages748570.png.jpg)\n\
  \n    ### 注意\n\n    JavaScript 和 JScript 的常用扩展名是 `.js`，但你并不强制使用它。我在前面的步骤中选择 JScript\
  \ 文件类型是因为这种类型类型选择正确的扩展名。你也可以很容易地在 `Add New Item` 对话框中选择 `Text Document`，然后以 `.js`\
  \ 扩展命名文件。\n\n4.  点击 `myfirstpage.htm` 标签页使其变为活动，并突出显示 JavaScript 代码。确保实际的 JavaScript\
  \ 标签 `<script>` 和 `</script>` ，不要突出它们。（你现在不需要这些标签，但稍后我们会回到这个主题。）你也可以在示例代码中找到名为 `myfirstpage.htm`\
  \ 的页面。\n\n5.  从 `Edit` 菜单中选择 `Copy` 将突出代码复制到剪贴板。\n\n6.  点击 `myscript.js` 标签页，将光标移动到第一行下方，并从\
  \ `Edit` 菜单选择 `Paste`。复制的代码粘贴在光标处。更改 `yetAnotherAlert` 函数调用参数的文本，使其变为：“This is the\
  \ Second Example。”代码所示：\n\n```javascript\nfunction yetAnotherAlert(textToAlert)\
  \ {\n    alert(textToAlert);\n}\nyetAnotherAlert(\"This is the Second Example.\"\
  );\n```\n\n7.  从 `File` 菜单中选择 `Save` 保存 `myscript.js` 文件。该文件应该像这样：\n\n    ![在 Visual\
  \ Studio 2010 中使用 JavaScript 创建外部文件](img/httpatomoreillycomsourcemspimages748572.png.jpg)\n\
  \n\n\n\n8. 配合包含在名为 `myscript.js` 文件中的 JavaScript 代码（你已经保存了该文件吧？），你只需要从 `myfirstpage.htm`\
  \ 文件中删除代码，只保留脚本标签，如下所示：\n\n```\n<script type=\"text/javascript\">\n</script>\n```\n\
  \n9. 现在在起始的 `<script>` 标签上添加 `src` 属性：\n\n```\n<script type=\"text/javascript\"\
  \ src=\"myscript.js\">\n```\n\n10. 如果需要，可以通过删除多余的回车符并将代码放在同一行来让代码看起来更整洁，如下：\n\n\
  ```html\n<script type=\"text/javascript\" src=\"myscript.js\"></script>\n```\n\n\
  `myfirstpage.htm` 的全部内容现在应该是这样的：\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.0 Transitional//EN\" \"http://www.w3.org/TR/\nxhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" >\n<head>\n    <title>My First Page</title>\n\
  \    <script type=\"text/javascript\" src=\"myscript.js\"></script>\n</head>\n<body>\n\
  \n</body>\n</html>\n```\n\n11. 保存 `myfirstpage.htm`。\n\n12. 从调试（Debug）菜单中选择“不带调试启动”（Start\
  \ Without Debugging），在网络浏览器中查看页面。该页面将通过 Web 服务器提供，如果你的浏览器尚未打开，它将打开并该页面。结果应该是一个带有文本“This\
  \ is the Second Example.”的警框。示例所示：\n\n![使用 Visual Studio 2010 为 JavaScript 创建外部文件](img/httpatomoreillycomsourcemspimages748574.png.jpg)\n\
  \n13. 点击确定关闭警框对话框。现在查看源代码以查看差异。在你的网络浏览器中，从视图（View）菜单中选择源代码（Source）。注意，`<script>`\
  \ 标签现在包含了对外部 JavaScript 文件的引用。\n\n你已经使用 Visual Studio 2010 开发了 JavaScript。从这里开始，你可以跳到调试章节，或者继续阅读学习如何使用其他工具进行\
  \ JavaScript 开发。\n\n# 使用 Eclipse 编写 JavaScript\n\nWeb 开发人员（以及使用其他语言的开发者）中另一种流行的\
  \ IDE 是 Eclipse。使用 Eclipse 的开发者可以安装不同的框架来协助完成特定的开发任务。例如，Web 开发人员可以使用 Web 工具平台（Web\
  \ Tools Platform）或 PHP（PHP 超文本预处理器）开发工具来创建一个能够简化他们许多常见任务的环境。关于许多潜在的 Eclipse 项目的讨论超出了本书的范畴，但我将讨论如何使用基础\
  \ Eclipse 安装来开发 JavaScript。\n\n如果你想用 Eclipse 开发 JavaScript，请花点时间下载软件，如果必要，请下载 Java\
  \ 运行时环境。详细信息和下载位置可以在 Eclipse 网站（[`www.eclipse.org`](http://www.eclipse.org)）获取。在本书的这一部分，我假设你从未用过\
  \ Eclipse 并且是第一次学习它。然而，本部分不包含安装 Eclipse 的教程。我建议你阅读 Eclipse 自带的以及 Eclipse 网站上提供的文档，以获取最新信息。\n\
  \n## 使用 Eclipse 建立你的第一个 Web（以及 JavaScript）项目\n\n现在是时候使用 Eclipse 创建一个带有 JavaScript\
  \ 的网页了。如果你没有使用 Eclipse，这一部分不适合你，你可以跳过。在章节的后面，我将向你展示如何在不使用任何 IDE 的情况下开发，以及一些调试 JavaScript\
  \ 的技巧。\n\n### 注意\n\n本节回顾了如何为 JavaScript Web 开发人员使用 Eclipse IDE。你的 Eclipse 环境可能与本节包含的截图略有不同。第一次打开\
  \ Eclipse 时，系统要求你选择一个工作空间（workspace）。选择默认即可。\n\n### 在 Eclipse 中创建 JavaScript 的 Web\
  \ 项目\n\n1. 从文件（File）菜单中选择新建（New），然后选择 JavaScript，创建一个新项目。出现“新建 JavaScript 项目”对话框。在项目名称框中输入\
  \ `Chapter2` 并点击完成（Finish）。\n\n![在 Eclipse 中创建带有 JavaScript 的 Web 项目](img/httpatomoreillycomsourcemspimages748577.png)\n\
  \n2. `Chapter2` 文件夹在项目资源管理器（Project Explorer）中打开，没有列出文件，所示：\n\n![在 Eclipse 中创建带有\
  \ JavaScript 的 Web 项目](img/httpatomoreillycomsourcemspimages748579.png.jpg)\n\n\
  3. 右键点击 `Chapter2` 文件夹，点击新建（New），然后点击文件（File）。打开“新建文件”对话框。在文件名文本框中输入 `myfirstpage.htm`，如下一个屏幕所示，并点击完成（Finish）。你可以在第\
  \ 2 章示例代码中找到名为 `eclipse_myfirstpage.htm` 的文件。如果你想使用此文件，请在后续练习中将其重命名为 `myfirstpage.htm`。\n\
  \n![在 Eclipse 中创建带有 JavaScript 的 Web 项目](img/httpatomoreillycomsourcemspimages748581.png)\n\
  \n4. 在点击完成（Finish）后，Eclipse 在其自己的 浏览器中打开该页面。然而，你想编辑页面而不是查看它，因此在项目资源管理器中右键点击 `myfirstpage.htm`\
  \ 并点击打开（Open）。页面将在 Eclipse 内部的编辑器中打开，所示：\n\n![在 Eclipse 中创建带有 JavaScript 的 Web 项目](img/httpatomoreillycomsourcemspimages748583.png.jpg)\n\
  \n5. 终于是时候写代码了！在编辑器中，输入以下代码：\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.0 Transitional//EN\" \"http://www.w3.org/TR/\nxhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" >\n<head>\n    <title>My First Page</title>\n\
  \    <script type=\"text/javascript\">\n\nfunction yetAnotherAlert(textToAlert)\
  \ {\n    alert(textToAlert);\n}\nyetAnotherAlert(\"This is Chapter 2\");\n\n</script>\n\
  </head>\n<body>\n\n</body>\n</html>\n```\n\n### 注意\n\n出于本示例的目的，如果你不想输入 DOCTYPE 声明，可以跳过它，直接从顶部的\
  \ `<html>` 标签开始。对于本书范围之外的真实世界开发，你绝对希望声明一个 DOCTYPE。请参见 第 1 章 了解更多关于为什么这重要的信息。\n\n\
  6. 从文件（File）菜单中选择保存（Save）。完成后的脚本和页面应该类似于所示：\n\n![在 Eclipse 中创建带有 JavaScript 的 Web\
  \ 项目](img/httpatomoreillycomsourcemspimages748585.png.jpg)\n\n要查看页面，在项目资源管理器中右键点击文件，选择“打开方式”（Open\
  \ With），然后点击“网络浏览器”（Web Browser）。你将在 Eclipse 浏览器中本地查看文件，你应该会收到一个带有警框的页面，类似于图 2-7\
  \ 所示。\n\n或者，你也可以通过计算机上不同的网络浏览器查看文件，例如系统的默认网络浏览器。要执行操作，浏览到该文件（例如，我的文件副本位于 `C:\\Users\\\
  Steve\\workspace\\Chapter2\\folder`），然后双击该文件。\n\n### 注意\n\n如果你使用 Windows Internet\
  \ Explorer，取决于你为浏览器设置的安全级别，你可能会收到关于查看受阻止内容的警框。[`windows.microsoft.com/en-US/windows7/Internet-Explorer-Information-bar-frequently-asked-questions`](http://windows.microsoft.com/en-US/windows7/Internet-Explorer-Information-bar-frequently-asked-questions)\
  \ 上的文章提供了有关此功能的更多信息以及如何禁用它。\n\n![查看在 Eclipse 中开发的文件。](img/httpatomoreillycomsourcemspimages748587.png.jpg)\n\
  \n图 2-7. 查看在 Eclipse 中开发的文件。\n\n在这个示例中，你创建了一个带有嵌入 JavaScript 的基础网页。页面的 JavaScript\
  \ 部分仅包含几个元素。首先，脚本标签被打开并声明为 JavaScript，如代码所示：\n\n```html\n<script type=\"text/javascript\"\
  >\n```\n\n### 注意\n\n你可以通过其他方式声明你的脚本是 JavaScript，但在这里看到的方法是最广泛支持的。\n\n\n\n\n\n接下来，脚本声明了一个函数\
  \ `yetAnotherAlert`，它接受一个参数 `textToAlert`：\n\n```\nfunction yetAnotherAlert(textToAlert)\
  \ {\n```\n\n该函数有一个任务：在浏览器窗口中弹出一个警框，显示作为函数参数提供的任何文本，接下来的行代码实现了这一点：\n\n```\nalert(textToAlert);\n\
  ```\n\n该函数通过一个右大括号结束：\n\n```\n}\n```\n\n然后，脚本使用带引号的字符串参数调用了你刚刚定义的函数，如下：\n\n```\n\
  yetAnotherAlert(\"This is Chapter 2\");\n```\n\n在这个简短的示例中，你了解了如何使用 Eclipse 编写 JavaScript\
  \ 代码。下一节将展示如何将 JavaScript 放置在外部文件中，这是使用 JavaScript 的常用方法。\n\n# 使用 Eclipse 使用外部 JavaScript\
  \ 文件\n\n当你读到这里时，你应该已经有一个可以运行的网页（通过 Eclipse 创建），该网页会显示一个警框。你在上一节中开发的网页在页面的 `<head>`\
  \ 标签部分包含了 JavaScript 代码。在本节中，我将描述如何将 JavaScript 放入外部文件，然后在你的 HTML 页面内部引用该代码。\n\n\
  ### 使用 Eclipse 为 JavaScript 创建外部文件\n\n1. 如果 `myfirstpage.htm` 代码尚未在 Eclipse 中打开，请打开它。（你可以在配套内容中找到此文件。）选择你保存\
  \ `myfirstpage.htm` 文件的项目，通过右键点击该文件、选择 `Open With`，然后点击 `Text Editor` 来在编辑器中打开文件本身。\n\
  \n2. 通过从 File 菜单选择 `New` 然后选择 `File` 来创建一个新文件存放 JavaScript 代码。会打开 New File 对话框。在\
  \ File Name 文本框中输入 `myscript.js`（如下所示），并点击 `Finish`。\n\n![使用 Eclipse 为 JavaScript\
  \ 创建外部文件](img/httpatomoreillycomsourcemspimages748590.png)\n\n3. Eclipse 为你的项目添加了一个新的空白\
  \ JavaScript 文件。如果该文件没有自动打开，请在 Project Explorer 中右键点击 `myscript.js` 文件，选择 `Open\
  \ With`，然后点击 `Text Editor`。现在你应该能同时看到新的 `myscript.js` 文件和 `myfirstpage.htm` 文件的标签。你可能还会看到\
  \ My First Page 网页。\n\n    #### 注意\n\n    虽然你不强制使用 JavaScript 的常用扩展名 `.js`，但这样做可能帮助你日后更容易地识别文件。\n\
  \n4. 点击 `myfirstpage.htm` 标签使其变为活动状态，并高亮你之前编写的 JavaScript 代码。确保实际的 JavaScript 标签\
  \ `<script>` 和 `</script>` 保持完整且不要高亮它们。（你现在不需要它们，但稍后你会再次回到这个主题。）\n\n5. 通过从 Edit\
  \ 菜单选择 `Copy` 将高亮的代码复制到剪贴板。\n\n6. 点击 `myscript.js` 标签，并通过从 Edit 菜单选择 `Paste` 粘贴代码。将函数调用的文本更改为“This\
  \ is the Second Example.”代码看起来如下：\n\n```\nfunction yetAnotherAlert(textToAlert)\
  \ {\n    alert(textToAlert);\n}\nyetAnotherAlert(\"This is the Second Example.\"\
  );\n```\n\n7. 通过从 File 菜单选择 `Save` 保存 `myscript.js` 文件。该文件看起来应该与此处显示的屏幕类似：\n\n![使用\
  \ Eclipse 为 JavaScript 创建外部文件](img/httpatomoreillycomsourcemspimages748592.png.jpg)\n\
  \n8. 既然 JavaScript 代码已包含在名为 `myscript.js` 的独立文件中（你保存了，对吧？），你可以安全地删除 `myfirstpage.htm`\
  \ 文件中的代码。只需删除代码，保留脚本标签，如下：\n\n```\n<script type=\"text/javascript\">\n</script>\n\
  ```\n\n9. 在起始 `<script>` 标签中添加 `src` 属性：\n\n```\n<script type=\"text/javascript\"\
  \ src=\"myscript.js\">\n```\n\n10. 如果需要，为了让代码看起来更整洁，删除多余的换行符将代码放在一行，如下所示：\n\n```\n\
  <script type=\"text/javascript\" src=\"myscript.js\"></script>\n```\n\n现在 `myfirstpage.htm`\
  \ 的全部内容应该是：\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \ \"http://www.w3.org/TR/\nxhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" >\n<head>\n    <title>My First Page</title>\n   \
  \ <script type=\"text/javascript\" src=\"myscript.js\"></script>\n</head>\n<body>\n\
  \n</body>\n</html>\n```\n\n11. 保存 `myfirstpage.htm`。\n\n12. 通过在 Project Explorer\
  \ 中右键点击 `myfirstpage.htm`，指向 `Open With`，然后点击 `Web Browser` 在网络浏览器中查看页面。页面是在本地服务的，浏览器窗口将打开并显示页面。结果应该是一个带有文本“This\
  \ is the Second Example.”的警框。它看起来如下：\n\n![使用 Eclipse 为 JavaScript 创建外部文件](img/httpatomoreillycomsourcemspimages748594.png.jpg)\n\
  \n关于使用 Eclipse 进行 JavaScript 开发的入门教程到此结束。不过，其中还有很多内容，我建议访问 Eclipse 网站获取更多关于使用 Eclipse\
  \ 平台开发的信息。\n\n# 不使用 IDE 编写 JavaScript\n\n你同样很容易放弃 IDE，转而采用更简单的方法开发 JavaScript。任何像\
  \ Notepad 或 Vim 这样的编辑器都可以用于 JavaScript 开发。不过，我不建议使用 Microsoft Office Word 等文字处理器进行\
  \ JavaScript 开发，因为它们会在生成的文件中留下痕迹，从而破坏网站。\n\n## 使用 Notepad 创建你的第一个网页（和 JavaScript）项目\n\
  \n本节展示使用 Notepad 进行 JavaScript 开发的示例。\n\n### 使用 Notepad 创建网页\n\n1. 在 Windows 7（以及\
  \ Windows XP 和 Vista）中，你可以通过点击开始按钮，点击所有程序，然后点击 Notepad 来打开它。在文档中输入以下代码：\n\n```\n\
  <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n    <title>My First Page</title>\n    <script type=\"text/javascript\"\
  >\n\nfunction yetAnotherAlert(textToAlert) {\n    alert(textToAlert);\n}\nyetAnotherAlert(\"\
  This is Chapter 2\");\n\n</script>\n\n</head>\n<body>\n\n</body>\n</html>\n```\n\
  \n    #### 注意\n\n    出于示例目的，如果你不想输入，可以跳过 DOCTYPE 声明，直接从 `<html>`标签开始。对于本书之外的现实开发，你绝对需要声明\
  \ DOCTYPE。请参考第一节 获取更多关于为什么这很重要的信息。\n\n2. 从 File 菜单选择 Save。你会看到一个另存为对话框。不幸的是，除非使用双引号，否则\
  \ Notepad 默认会文件名添加 `.txt` 扩展名。因此，请务必为文件名加上双引号——例如，“`myfirstpage.htm`”。如果你省略了引号，Notepad\
  \ 将添加 `.txt` 扩展并将文件保存为“myfirstpage.htm.txt”。以下图像显示了在文件名周围使用双引号的示例。请记住你保存此文档的位置。\n\
  \n![使用 Notepad 创建网页](img/httpatomoreillycomsourcemspimages748596.png.jpg)\n\n3.\
  \ 要查看页面，请使用你喜欢的浏览器浏览到保存文件的位置。（如果像上一步屏幕所示，你将文件保存到了桌面，请浏览那里。）下一张图片显示了在 Firefox 中渲染的文件。\n\
  \n\n\n\n\n如果你正在使用 Internet Explorer，根据你浏览器设置的安全级别，你可能会收到关于查看受阻止内容的警告。`[`windows.microsoft.com/en-US/windows7/Internet-Explorer-Information-bar-frequently-asked-questions`](http://windows.microsoft.com/en-US/windows7/Internet-Explorer-Information-bar-frequently-asked-questions)`上的支持文章提供了有关此功能以及如何禁用它的更多信息。\n\
  \n![在记事本中用 JavaScript 创建网页](img/httpatomoreillycomsourcemspimages748598.png.jpg)\n\
  \n到此为止，在这个示例中，你创建了一个带有嵌入 JavaScript 的基本网页。页面的 JavaScript 部分包含几个元素。首先，打开 `script`\
  \ 标签并声明为 JavaScript，如下代码所示：\n\n```\n<script type=\"text/javascript\">\n```\n\n###\
  \ 注意\n你可以通过其他方式声明你的脚本是 JavaScript，但在这里看到的方法支持得最广泛。\n\n接下来，脚本声明了一个函数 `yetAnotherAlert`，它接受一个参数\
  \ `textToAlert`：\n\n```\nfunction yetAnotherAlert(textToAlert) {\n```\n\n该函数有一个任务：在浏览器窗口中弹出警报框，显示作为函数参数提供的任何文本，接下来的行代码实现了这一点：\n\
  \n```\nalert(textToAlert);\n```\n\n函数由一个右括号（`}`）结束。然后脚本使用带引号的字符串参数调用了你刚刚声明的函数：\n\
  \n```\nyetAnotherAlert(\"This is Chapter 2\");\n```\n\n在这个简短的示例中，你已经了解了如何在没有 IDE\
  \ 的情况下编写 JavaScript。下一节将展示如何将 JavaScript 放在外部文件中，这是 JavaScript 使用的一种非常常见的方法。\n\n\
  ## 在没有 IDE 的使用外部 JavaScript 文件\n\n当你读到这里时，你应该已经有一个可以运行的网页（在记事本中创建），它可以显示一个 `alert()`\
  \ 对话框。你在上一节中开发的网页在页面 `<head>` 标签部分包含了 JavaScript 代码。本节展示了如何将 JavaScript 放入外部文件，然后从\
  \ HTML 页面内部引用该代码。\n\n### 使用记事本为 JavaScript 创建外部文件\n\n1. 如果 `myfirstpage.htm` 代码没有打开，请打开它。如果你使用的是记事本，你可能需要右键点击该文件并选择“打开方式”，然后选择记事本。\n\
  \n2. 选中 JavaScript 代码。确保保留实际的 JavaScript 标签 `<script>` 和 `</script>` 完整，不要选中它们。通过高亮显示并从“编辑”菜单中选择“复制”将代码复制到剪贴板。\n\
  \n3. 通过选择“文件”菜单中的“新建”创建一个新文件来存放 JavaScript 代码。打开新文件。通过从“编辑”菜单中选择“粘贴”将 JavaScript\
  \ 代码粘贴到文件中。将参数文本更改函数调用，使其读取为“This is the Second Example.”此代码所示：\n\n```\nfunction\
  \ yetAnotherAlert(textToAlert) {\n    alert(textToAlert);\n}\nyetAnotherAlert(\"\
  This is the Second Example.\");\n```\n\n4. 通过选择“文件”菜单中的“保存”保存文件。在“文件名”文本框中输入 `myscript.js`，并确保加上双引号，因为扩展名需要是\
  \ `.js` 而不是 `.txt`。\n\n### 注意\nJavaScript 文件的常用扩展名是 `.js`，但你不必使用它。然而，这样做可能有助于你以后更容易地识别文件。\n\
  \n5. 既然 JavaScript 代码已包含在名为 `myscript.js` 的独立文件中（你保存了对吧？），你可以安全地删除 `myfirstpage.htm`\
  \ 文件中的代码。再次在记事本中打开 `myfirstpage.htm`。在 `myfirstpage.htm` 中，只需删除之前粘贴的 JavaScript\
  \ 代码，保留脚本标签：\n\n```\n<script type=\"text/javascript\">\n</script>\n```\n\n### 提示\n\
  当尝试打开没有 `.txt` 扩展的文件（例如你刚刚创建的 `.htm` 或 `.js` 文件）时，确保你查看的是“所有文件”而不仅仅是“文本”。要这样做，请在打开对话框的“文件类型”下拉列表中选择“所有文件”。\n\
  \n6. 在起始 `<script>` 标签中添加 `src` 属性，如下：\n\n```\n<script type=\"text/javascript\"\
  \ src=\"myscript.js\">\n```\n\n7. 如果需要，可以通过删除多余的回车符并将代码放在同一行让代码看起来更整洁，如下：\n\n```\n\
  <script type=\"text/javascript\" src=\"myscript.js\"></script>\n```\n\n`myfirstpage.htm`\
  \ 的全部内容现在如下：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<<html>\n<head>\n    <title>My First Page</title>\n    <script type=\"text/javascript\"\
  \ src=\"myscript.js\"></script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\n8.\
  \ 保存 `myfirstpage.htm`。\n\n9. 在网络浏览器中查看该页面。结果（如接下来的屏幕所示）应该是一个带有文本“This is the Second\
  \ Example.”的警报。\n\n![在记事本中用 JavaScript 创建外部文件](img/httpatomoreillycomsourcemspimages748600.png.jpg)\n\
  \n关于在没有 IDE 的情况下开发 JavaScript 的入门结束。虽然这个示例使用了记事本，但其他几个编辑器可能更适合基础开发，包括上述的 `Vim` 以及来自\
  \ Helio Software Solutions 的 `Textpad`两者都比记事本强大。\n\n# 调试 JavaScript\n\n调试 JavaScript\
  \ 可能会是一种令人不安的体验，特别是在更复杂的应用程序中。某些工具，如 `Venkman`（`[`www.mozilla.org/projects/venkman/`](http://www.mozilla.org/projects/venkman/)`），可以协助\
  \ JavaScript 调试，但调试 JavaScript 的主要工具是网络浏览器。主流浏览器包含了一些 JavaScript 调试功能。你应该考虑使用的程序中包括\
  \ `Firebug`，它是 Firefox 的一个显著插件。Firebug 可 `[`www.getfirebug.com/`](http://www.getfirebug.com/)`\
  \ 获取。\n\n我发现 Firebug 对于 Web 开发几乎不可或缺，特别是使用 JavaScript 和 AJAX 进行 Web 开发。此软件允许你检查网页的所有元素，并实时查看\
  \ AJAX 调用的结果以及 CSS 的结果，这使得调试变得容易得多。插图 2-8 显示了 Firebug 在我网站主页运行的示例。\n\n![Firebug\
  \ 是 Web 开发者工具箱中的重要工具。](img/httpatomoreillycomsourcemspimages748602.png.jpg)\n\n\
  图 2-8。Firebug 是 Web 开发者工具箱中的重要工具。\n\n我推荐使用 Firebug 来开发和调试 JavaScript。在调试 JavaScript\
  \ 时，我发现 `alert()` 函数非常有用。几个放置恰当的 `alert()` 函数可以向你显示变量包含的值以及你的脚本当前正在做什么。当然，由于 `alert()`\
  \ 会导致对话框打开，如果你在循环中放置了 `alert()`，然后错误地导致该循环无限重复而不退出，你将发现你需要不正常地退出浏览器，可能需要使用任务管理器。\n\
  \n# 练习题\n\n| 1. | 创建新网页并将其命名为 `mysecondpage.htm`。在页面的 `<body>` 部分创建一个 JavaScript\
  \ 脚本，并让脚本显示一个带有你名字的 `alert()` 对话框。在至少两个不同的浏览器中尝试此脚本。 |\n| 2. | 编辑你在练习 1 中创建的网页，在页面的\
  \ `<head>` 部分创建一个函数，并将你目前在 `<body>` 脚本中的 `alert()` 对话框移动到新函数中。从现有的 `<body>` 脚本调用该新函数。\
  \ |\n| 3. | 将练习 2 中创建的函数移动到外部 JavaScript 文件中，并在网页内部链接或调用此文件。 |\n\n# 第 3 章.JavaScript\
  \ 语法和语句\n\n**读完本章后，你将能够：**\n\n\n\n\n\n*   理解使用 JavaScript 编程语言的基本规则。\n*   将 JavaScript\
  \ 正确地放置在网页中。\n*   识别 JavaScript 语句。\n*   识别 JavaScript 中的保留字。\n\n## 一些基础说明\n\n本书的其余部分将更深入地探讨\
  \ JavaScript 的特定方面以及它们如何与特定任务相关。然而，你必须先走后才能跑，因此在深入研究 JavaScript 之前，你应该学习它的 `lexical\
  \ structure`（词法结构）——即语言的规则，也称为 `syntax rules`。\n\n## 大写敏感\n\nJavaScript 是大小写敏感。在命名变量和使用语言关键字时，你必须意识到这一点。名为\
  \ `remote` 的变量与名为 `Remote` 或 `REMOTE` 的变量是不相同的。同样，循环控制关键字 `while` 是完全有效的，但将其命名为\
  \ `WHILE` 或 `While` 将导致错误。\n\n关键字是小写的，但变量可以是任何你喜好的大小写组合。只要你保持大小写一致，你就可以创建任何想要的组合。例如，以下所有示例在\
  \ JavaScript 中都是完全合法的变量名：\n\n```\nbuttonOne\ntxt1\na\nC\n```\n\n### 提示\n\n你通常会看到\
  \ JavaScript 代码是用小写写的，除非必要时——例如函数调用如 `isNaN()`，它用于判断一个值是否为非数字（函数名中的 `NaN`）。你将在第\
  \ 4 章中学习到这些。\n\n第 4 章提供了关于变量及其命名规范的更多信息。目前，请记住，在 JavaScript 中编写变量名时必须注意大小写。\n\n\
  ## 空格\n\n在大多数情况下，JavaScript 会忽略 `white space`（空白），即 JavaScript 语句之间的空格。你可以使用空格、缩进或你喜欢的任何编码标准来提高\
  \ JavaScript 的可读性。然而，这条规则也有例外。某些关键字（如 `return`）当它们单独占一行时，JavaScript 解释器可能会误解。你将在本章稍后的部分看到这个问题的示例。\n\
  \n提高程序的可读性是包含空白字符的充分理由。考虑以下代码示例。它包含了最少的空格和缩进。\n\n```\nfunction cubeme(incomingNum)\
  \ {\nif (incomingNum == 1) {\nreturn \"What are you doing?\";\n} else {\nreturn\
  \ Math.pow(incomingNum,3);\n}\n}\nvar theNum = 2;\nvar finalNum = cubeme(theNum);\n\
  if (isNaN(finalNum)) {\nalert(\"You should know that 1 to any power is 1.\");\n\
  } else {\nalert(\"When cubed, \" + theNum + \" is \" + finalNum);\n}\n```\n\n现在考虑带有缩进的相同代码。（你可以在配套内容的第\
  \ 3 章示例代码中找到这段名为 `example1.txt` 的代码。）\n\n```\nfunction cubeme(incomingNum) {\n \
  \   if (incomingNum == 1) {\n        return \"What are you doing?\";\n    } else\
  \ {\n        return Math.pow(incomingNum,3);\n    }\n}\n\nvar theNum = 2;\nvar finalNum\
  \ = cubeme(theNum);\n\nif (isNaN(finalNum)) {\n    alert(\"You should know that\
  \ 1 to any power is 1.\");\n} else {\n    alert(\"When cubed, \" + theNum + \" is\
  \ \" + finalNum);\n}\n```\n\n第二个代码示例的执行结果与第一个一样，但更容易阅读和理解——至少在我看来是这样！我发现，编写代码实际上只需要很短的时间，但维护它却需要几年。当我一年后再次访问代码时，如果我已经让代码变得更易读、更容易理解，我会感到高兴得多。\n\
  \n## 注释\n\n说到创建更可读的代码并长期维护这些代码，注释是你的朋友。现在看起来显而易见的代码，下次看时可能就不那么明显了，尤其是当你写下它之后已经过了很久。注释可以通过两种方式放入\
  \ JavaScript 代码中：多行注释和单行。\n\n如果你编写过 C 语言程序，JavaScript 的多行注释会让你感到熟悉。`multiline` 注释分别以\
  \ `/*` 和 `*/` 开始和结束，如下代码示例所示：\n\n```\n/*  这是 JavaScript 中的多行注释\n它与 C 风格的注释相似，因为它可以在关闭之前\n\
  跨越多行。  */\n```\n\n`single-line` 注释以两个斜杠（`//`）开头，并且没有结束要求，因为它只跨越一行。示例如下：\n\n```\n\
  // 这是一个单行注释。\n```\n\n使用多个单行注释是完全有效的，我用它们处理短的注释块，而不是使用之前所示的多行注释样式。例如，看这段代码块：\n\n\
  ```\n// 这是另一个注释块。\n// 这一块使用了多行。\n// 每一行前面必须有两个斜杠。\n```\n\n### 提示\n\n对于跨越一行或几行的短注释，你可能会发现使用双斜杠方法更快。对于较大的注释，例如程序或脚本开头的注释，多行注释样式是更好的选择，因为它使得添加或删除信息更加方便。\n\
  \n## 分号\n\n分号在 JavaScript 中用于分隔表达式。从技术上说，大多数语句和表达式不需要分号。然而，在使用分号时可能遇到的微妙问题会增加不必要的错误，从而增加不必要的调试时间。在某些情况下，JavaScript\
  \ 解释器会插入你可能并不需要的分号。例如，考虑这条语句：\n\n```\nreturn\n(varName);\n```\n\n很有可能你想要写的是：\n\n\
  ```\nreturn(varName);\n```\n\n但 JavaScript 按照自身的逻辑，在 `return` 语句后插入一个分号，导致代码在 JavaScript\
  \ 解释器看起来像这样：\n\n```\nreturn;\n(varName);\n```\n\n这段代码将无法工作；解释器会误解你的意图。如果你在函数代码代码，它将向调用者返回\
  \ `undefined`，这可能不是你想要的。这是一个不允许随意使用空白字符的例子——你不能成功地使用换行（在下一节中解释）来将 `return` 关键字与其应该返回的值分开。\n\
  \n如果你将使用分号作为规则，你会发现 JavaScript 编程要简单得多，而不是尝试记住在何时可能不需要使用它们。\n\n但在一种情况下你绝对不应该使用分号：即使用循环和条件语句时。考虑这段代码：\n\
  \n```\nif (a == 4)\n{\n    // 代码写在这里\n}\n```\n\n在这种情况下，你不会在 `if` 语句的末尾使用分号。原因是紧跟在条件判断后的大括号中的语句或语句块是条件语句的一部分，在本例中是\
  \ `if` 语句。分号标记了 `if` 语句的结束，如果放置不当，就会将 `if` 语句的第一部分与其余部分分离。例如，以下代码是错误的（括号内的代码无论 `a`\
  \ 是否等于 4 都会执行）：\n\n```\nif (a == 4);\n{\n    // 代码写在这里\n}\n```\n\n### 提示\n\n在开启循环或函数时，跳过分号。\n\
  \n## 换行符\n\n与 JavaScript 中的空白甚至分号密切相关的是换行符，有时称为 `carriage returns`（回车）。这些字符在官方 ECMA-262\
  \ 标准中被称为“行终止符”（Line Terminators），它们将一行代码与下一行隔开。和分号一样，换行符的位置非常重要。正如你在上一节的示例中看到的，在错误的位置放置换行可能会导致意想不到的行为或错误。\n\
  \n\n\n\n\n不出意外，换行符最常用的用途是将单行代码分开以提高可读性。你也可以通过换行符将特别长的代码行分开来提高可读性。然而，在这样做时，请注意像前面提到的\
  \ `return` 语句所示的问题，其中额外的换行符可能会对代码的含义产生意外的影响。\n\n## 正确放置 JavaScript\n\nJavaScript\
  \ 可以放置在超文本标记语言（HTML）页面的几个位置：`<head> </head>` 部分内，或者在 `<body>` 和 `</body>` 标签之间。传统上，JavaScript\
  \ 最常见的位置是页面顶部的 `<head>` 和 `</head>` 标签之间。然而，将`<script>` 块放置在 `<body>` 部分正变得越来越常见。请务必声明你正在使用的脚本类型。虽然可以使用其他脚本类型，但由于这是一本\
  \ JavaScript 书，我将在起始 `<script>` 标签中声明如下：\n\n```\n<script type=\"text/javascript\"\
  >\n```\n\n使用 JavaScript 时需要注意的一个重要问题与声明为可扩展文本标记语言（XHTML）的页面有关。在此类页面中，`<script>`\
  \ 标签必须声明在 CDATA 区域内；否则，XHTML 会尝试将 `<script>` 标签视为另一个 XML 标签，区域内的代码可能无法按照你预期的方式工作。因此，在严格\
  \ XHTML 中使用的 JavaScript 应该声明如下：\n\n```\n<script type=\"text/javascript\">\n<![CDATA[\n\
  \n    //JavaScript goes here\n\n]]>\n</script>\n```\n\n旧版本的浏览器可能无法正确解析 CDATA 区域。这个问题可以通过将\
  \ CDATA 的起始和结束行放在 JavaScript 注释中来解决，如下：\n\n```\n<script type=\"text/javascript\"\
  >\n//<![CDATA[\n\n    //JavaScript goes here\n\n//]]>\n</script>\n```\n\n当你将实际的\
  \ JavaScript 代码放在单独的文件时（正如你在第 2 章 中学习到的），你完全不需要使用这个难看的 CDATA 区域。你可能会发现，对于除了最小脚本之外的内容，将\
  \ JavaScript 定义在单独的文件（通常带有 `.js` 后缀）并在页面中链接到这些脚本是理想的。第 2 章 详细展示了这一点，但这里提醒一下如何使用\
  \ `<script>` 标签的 `src` 属性链接到文件：\n\n```\n<script type=\"text/javascript\" src=\"\
  myscript.js\">\n```\n\n将 JavaScript 放在外部文件中有几个优点，包括：\n\n*   **代码与标记的分离**。将 JavaScript\
  \ 代码保持在单独的文件中使 HTML 的维护更容易，并且保留了 HTML 的结构，而无需为 XHTML 使用 CDATA 区域。\n*   **更易维护**。将\
  \ JavaScript 作为单独的文件，你可以修改该文件而不触碰网站上的其他文件。\n*   **缓存**。使用单独的 JavaScript 文件允许 浏览器缓存该文件，从而加快用户的网页加载速度。\n\
  \n# JavaScript 语句\n\n与其他语言编写的程序一样，JavaScript 程序由组合在一起的语句组成，这些语句导致 JavaScript 解释器执行一个或多个操作。与其他语言语句一样，JavaScript\
  \ 语句可以是简单或复合的。本节简要检查了 JavaScript 语句的形式，假设你已经从之前的章节中看到了几个示例，并将在整书中看到其他示例。\n\n## 语句中包含什么？\n\
  \n正如第 1 章 中涵盖的，JavaScript 语句或表达式是标记、运算符和标识符的集合，它们组合在一起创建一个让 JavaScript 解释器具有意义的内容。语句通常以分号结束，特殊情况除外，例如\
  \ `if`、`while` 和 `for` 等循环构造函数，这些在第 5 章 中会有介绍。\n\n以下是 JavaScript 中基本语句的一些示例：\n\n\
  ```\nvar x = 4;\nvar y = x * 4;\nalert(\"Hello\");\n```\n\n## JavaScript 语句的两种类型\n\
  \nJavaScript 语句有两种基本形式：简单语句和复合。我不会花很多时间讨论语句，因为你并不需要深入了解它们。但是，你应该知道简单语句和复合语句之间的区别。`简单语句`正如你预期的那样——它是是的，如下所示：\n\
  \n```\nx = 4;\n```\n\n`复合语句`结合了多个层级的逻辑。这里给出的 `if`/`then`/`else` 决策提供了一个很好的例子：\n\n\
  ```\nif (something == 1) {\n    // some code here\n} else {\n    // some other code\
  \ here\n}\n```\n\n# JavaScript 中的保留字\n\nJavaScript 中的某些单词是**保留的**（reserved），这意味着你不能在程序中将它们用作变量、标识符或常量名，因为这样做会导致代码产生意外的结果，例如错误。例如，你已经在之前的示例中看到了保留字\
  \ `var`。使用 `var` 单词执行声明变量以外的任何操作都可能导致错误或其他意外行为，具体取决于浏览器。考虑这条语句：\n\n```javascript\n\
  // Don't do this!\n\nvar var = 4;\n```\n\n此代码示例不会向浏览器产生直接错误，但它也不会按照你的预期方式工作，当变量的值不符合你的预期时可能会导致混惑。\n\
  \n以下列表包含了目前 ECMA-262 规范中保留的单词：\n\n| break | delete | if | this | while |\n| case\
  \ | do | in | throw | with |\n| catch | else | instanceof | try | with |\n| continue\
  \ | finally | new | typeof | |\n| debugger | for | return | var | |\n| default |\
  \ function | switch | void | |\n\n其他几个单词（显示在以下列表中）已为以后使用而保留，因此不应在你的程序中使用：\n\n| class\
  \ | enum | extends | super | |\n| const | export | import | | |\n\n以下单词列表在严格模式下为未来保留的字：\n\
  \n| implements | let | private | public | yield |\n| interface | package | protected\
  \ | static | |\n\n# 函数快速概览\n\n你已经在之前的章节中看到了函数的示例。JavaScript 有几个**内置函数**或其他函数。可用哪些内置函数取决于你使用的语言版本。某些函数仅在\
  \ JavaScript 的较后版本中可用，这些版本可能不受所有浏览器支持。检测浏览器可用的函数（以及对象）是判断访问者浏览器是否能够为你网页创建的 JavaScript\
  \ 的重要方法。此主题在第 11 章 中涵盖。\n\n### 提示\n\n你可以在 QuirksMode 网站找到关于兼容性的优秀资源：([`www.quirksmode.org/compatibility.html`](http://www.quirksmode.org/compatibility.html))。\n\
  \nJavaScript 与其他编程语言类似，允许自定义函数。在本章之前的示例中定义了一个名为 `cubeme()` 的函数，它可以计算给定数字的立方次方。该代码提供了一个在网页的\
  \ `<head>` 和 `<body>` 部分使用 JavaScript 的良好机会。\n\n## 使用自定义函数放置 JavaScript\n\n1.  使用\
  \ Microsoft Visual Studio、Eclipse 或其他编辑器编辑第 3 章示例代码中的 example1.htm 文件。\n\n2.  在网页中添加粗体类型的代码，替换\
  \ TODO 注释：\n\n\n\n\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n<script type=\"text/javascript\"\
  >\nfunction cubeme(incomingNum) {\n    if (incomingNum == 1) {\n        return \"\
  What are you doing?\";\n    } else {\n        return Math.pow(incomingNum,3);\n\
  \    }\n}\n</script>\n    <title>第 3 章示例</title>\n</head>\n\n<body>\n<script type=\"\
  text/javascript\">\nvar theNum = 2;\nvar finalNum = cubeme(theNum);\n\nif (isNaN(finalNum))\
  \ {\n    alert(\"You should know that 1 的任何次方都是 1.\");\n} else {\n    alert(\"立方立方后,\
  \ \" + theNum + \" 是 \" + finalNum);\n}\n</script>\n\n</body>\n</html>\n```\n\n\
  3. 保存页面，然后运行代码或在浏览器中查看该网页。你将收到类似这样的警报框：\n\n![使用用户定义函数放置 JavaScript](img/Platomoreillycomsourcemspimages748605.png.jpg)\n\
  \n此示例中的代码将之前的示例代码整合到了完整的 HTML 页面中，包含一个 `DOCTYPE` 声明。代码在文档的 `<head>` 中声明了一个函数 `cubeme()`，如下所示：\n\
  \n```\nfunction cubeme(incomingNum) {\n    if (incomingNum == 1) {\n        return\
  \ \"What are you doing?\";\n    } else {\n        return Math.pow(incomingNum,3);\n\
  \    }\n}\n```\n\n此代码在函数内部接受一个名为 `incomingNum` 的参数。`if`/`then` 决策语句是该函数的核心。当传入的数字等于\
  \ `1` 时，函数返回字符串“What are you doing?”。另一方面，当传入的数字不等于 1，则调用 `Math.pow` 方法，并将变量 `incomingNum`\
  \ 和整数 `3` 作为参数传递。。对 `Math.pow` 的调用会将传入的数字进行 3 次方，然后将此值返回给调用它的函数。该调用再次出现在第 4 章中。\n\
  \n之前所有的代码都放置在文档的 `<head>` 中，以便被其他代码调用，这正是我们要做做的。浏览器随后渲染文档的 `<body>`，其中包含了另一段 JavaScript\
  \ 代码。接下来这段代码将变量 `theNum` 设置为整数 2：\n\n```\nvar theNum = 2;\n```\n\n然后，代码使用 `theNum`\
  \ 变量作为参数调用之前定义的 `cubeme()` 函数。你会发现变量 `finalNum` 被设置为接收 `cubeme()` 函数调用的输出，如下：\n\n\
  ```\nvar finalNum = cubeme(theNum);\n```\n\n页面上的最后一段 JavaScript 代码是另一个 `if`/`then`\
  \ 决策集。这段代码检查并确定返回的值（现在存储在 `finalNum` 变量中）是否为数字。它通过使用 `isNaN()` 函数来实现这一点。如果该值不是数字，将显示一个警报，反映出使用\
  \ `1` 作为参数的事实。（当然，可能还有其他原因导致它不是数字，但请在这里耐心并按照我的示例操作。）如果返回值确实是数字，则显示该数字，正如你在上一步步骤\
  \ 3 中看到的 `alert()` 对话框所示。\n\n# JavaScript 的新严格模式\n\nECMA-262 版本 5 引入了一种严格变体，通常称为\
  \ `strict mode`（严格模式），它增强了错误检查和安全性。例如，为了帮助防止拼写错误的变量名，变量声明需要使用 `var` 关键字。此外，对 `eval()`\
  \ 函数和其他区域的更改有助于 JavaScript 程序员改进代码。\n\n使用以下语法启用严格模式，这与 Perl 中使用的语法非常相似：\n\n```\n\
  \"use strict\";\n```\n\n严格模式是局部作用域的，这意味着可以通过在脚本开头放置 `use strict` 行来全局启用；或者也可以仅在函数内部启用，只需将该行放在函数内部，如下所示：\n\
  \n```javascript\nfunction doSomething() {\n\n    \"use strict\";\n\n    // 函数代码放在这里。\n\
  \n}\n```\n\n严格模式的一个有助于捕获拼写错误的增强是防止未声明的变量。在严格模式下，所有变量在使用之前都需要进行实例化。例如，考虑这段代码：\n\n\
  ```\n\"use strict\";\n\nx = 4;  // 产生语法错误\n```\n\n这段代码将创建一个错误条件，因为变量 `x` 还没有使用 `var`\
  \ 关键字进行声明，如下所示：\n\n```\n\"use strict\";\n\nvar x = 4;  // 这种语法是好的\n```\n\n严格模式提供的显著安全增强之一是对处理\
  \ `eval()` 函数方式的更改。在严格模式下，`eval()` 不能实例化在 `eval()` 语句之外使用的新变量或函数。例如：\n\n```\n\"\
  use strict\";\n\neval(\"var testVar = 2;\");\n\nalert(testVar);  // 产生语法错误。\n```\n\
  \n在代码示例中，将产生语法错误，因为启用了严格模式，且 `testVar` 变量在 `eval()` 语句之外使用。\n\n# 练习\n\n| 1. | 以下哪些语句是有效的\
  \ JavaScript 语句？（选择所有项） 1. `if (var == 4) { do something }` 2. `testVar = 10;` 3.\
  \ `if (a == b) { do something }` 4. `testVar = 10;` 5. `var case = “Yes”;` |\n|\
  \ 2. | 正确或错误：每个 语句都需要分号结束。 |\n| 3. | 检查这段 JavaScript。结果可能是？（假设声明已经执行，且该代码位于 `<head>`\
  \ 部分） ```javascript\nvar orderTotal = 0;\nfunction collectOrder(numOrdered) {\n\
  \    if (numOrdered > 0) {\n        alert(\"You ordered \" + orderTotal);\n    \
  \    orderTotal = numOrdered * 5;\n    }\nreturn orderTotal;\n}\n```\n\n\n\n\n\n\
  JavaScript 中的数字正如你预期的那样：它们就是数字。然而，对于熟悉 C 等其他语言数据类型的程序员来说，可能会让他们感到惊讶的是，整数和浮点数并没有特殊或单独的类型。这些在\
  \ JavaScript 中都是完全有效的数字：\n\n```\n4\n51.50\n-14\n0xd\n```\n\n最后一个示例 `0xd` 是一个十六进制数。十六进制和八进制数在\
  \ JavaScript 中都是有效的，你会发现 JavaScript 允许使用这些数字格式进行数学运算，这并不意外。请尝试以下练习。\n\n### 在 JavaScript\
  \ 中执行十六进制数学运算\n\n1. 使用 Microsoft Visual Studio、Eclipse 或编辑器，编辑配套内容中第 04 章示例文件文件夹下的\
  \ `example1.htm` 文件。\n\n2. 在网页中，将 `TODO` 注释替换为此处所示的粗体代码（新代码可以在配套代码的 `example1.txt`\
  \ 文件中找到）：\n\n   ```\n   <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n  \
  \ \"http://www.w3.org/TR/html4/strict.dtd\">\n   <html>\n   <head>\n   <title>Hexadecimal\
  \ Numbers</title>\n   <script type=\"text/javascript\">\n   var h = 0xe;\n   var\
  \ i = 0x2;\n   var j = h * i;\n   alert(j);\n   </script>\n   </head>\n   <body>\n\
  \   </body>\n   </html>\n   ```\n\n3. 在浏览器中查看该网页。你应该能看到类似下面的对话框：\n\n   ![在 JavaScript\
  \ 中执行十六进制数学运算](img/httpatomoreillycomsourcemspimages748607.png.jpg)\n\n此脚本定义了两个变量（你将在本章稍后部分学习如何定义变量），并将它们分别设置为两个十六进制数：`0xe`（十进制表示法为\
  \ 14）和 `0x2`：\n\n```\nvar h = 0xe;\nvar i = 0x2;\n```\n\n然后创建一个新变量，并设置为前两个变量的乘积，如下所示：\n\
  \n```\nvar j = h * i;\n```\n\n随后将得到的变量传递给 `alert()` 函数，该函数会显示上述步骤 3 中的对话框。有趣的是，尽管你乘以了两个十六进制数，但\
  \ alert 对话框中的输出是十进制格式。\n\n### 数字函数\n\nJavaScript 具有一些内置函数（以及一些对象，你很快就会学到）用于处理数值。欧洲电子计算机制造商协会（ECMA）标准定义了其中若干个。另一个常用的数字函数是\
  \ `isNaN()` 函数。我所说的*常用*，是指 `isNaN()` 是我在 JavaScript 编程中频繁使用的函数。你的用法可能会有所不同，但下面仍有相关说明。\n\
  \n`NaN` 是 *Not a Number*（不是数字）的缩写，代表一个非法的数字。你使用 `isNaN()` 函数来判断一个数字根据 ECMA-262 规范是否合法或有效。例如，一个数字除以零在\
  \ JavaScript 中将是非法数字。字符串值“This is not a number”显然也不是数字。虽然人们对什么是数字、什么数字数字有不同的解释，但对于\
  \ `isNaN()` 函数来说，字符串“four”不是数字，而字符串“4”是。`isNaN()` 函数有时需要进行一些“心理瑜伽”，因为它试图证明一个否定命题——即变量中的值*不是*数字。这里有几个示例，你可以尝试测试一个数字是否是非法的。\n\
  \n#### 测试 `isNaN()` 函数\n\n1. 打开你的网络浏览器，如 Windows Internet Explorer 或 Firefox。\n\n\
  2. 在地址栏中，输入以下内容（配套内容中也有名为 `isnan.txt` 的文件）：\n\n   ```\n   javascript:alert(isNaN(\"\
  4\"));\n   ```\n\n你会收到一个带有 False 单词的警报，所示：\n\n   ![测试 isNaN() 函数](img/httpatomoreillycomsourcemspimages748609.png.jpg)\n\
  \n`isNaN()` 函数从此表达式返回 `false`，因为整数值 4 *确实*是一个数字。记住这个函数的含义：“4 不是数字吗？”嗯，4 *确实是*一个数字，所以结果是\
  \ `false`。\n\n现在考虑这个示例：\n\n1. 打开你的网络浏览器，如 Internet Explorer 或 Firefox。\n\n2. 在地址栏中，输入：\n\
  \n   ```\n   javascript:alert(isNaN(\"four\"));\n   ```\n\n你会收到一个带有 true 单词的警报，如下：\n\
  \n   ![测试 isNaN() 函数](img/httpatomoreillycomsourcemspimages748611.png.jpg)\n\n在这种情况下，由于数字\
  \ 4 被表示为非数字字符字符串 *four*，该函数返回 *true*：字符串 *four* 不是一个数字。我特意在每个代码示例中使用了双引号（即“4”和“four”），以说明引号对于此函数并不重要。因为\
  \ JavaScript 足够智能，能够意识到“4”是一个数字，JavaScript 会自动为你完成类型转换。然而，这种转换有时可能会成为劣势，例如当你依赖某个变量或值应为特定类型时。\n\
  \n在验证输入时，经常会使用 `isNaN()` 函数，以确定某些内容（可能是表单变量）是作为数字还是作为文本输入的。\n\n### 数字常量\n\nJavaScript\
  \ 中还有其他数字常量，其中一些在表 4-1 中进行了描述。这些常量在你的 JavaScript 编程中可能有用也可能无用，但如果你需要，它们确实存在。\n\n\
  表 4-1 选定的数字常量\n\n| 常量 | 描述 |\n| --- | --- |\n| `Infinity` | 表示正无穷大 |\n| `Number.MAX_VALUE`\
  \ | JavaScript 中能够表示的最大数字 |\n| `Number.MIN_VALUE` | JavaScript 中能够表示的最小数字 |\n| `Number.NEGATIVE_INFINITY`\
  \ | 表示负无穷大的值 |\n| `Number.POSITIVE_INFINITY` | 表示正无穷大的值 |\n\n### Math 对象\n\n`Math`\
  \ 对象是一个特殊的内置对象，用于在 JavaScript 中处理数字，它有若干个对 JavaScript 程序员有帮助的属性，包括返回 pi 值、数字平方根、伪随机数和绝对值的属性。某些属性是值属性，意味着它们返回一个值，而另一些则像函数一样，根据传入的参数返回值。考虑这个关于\
  \ `Math.PI` 值属性的示例：\n\n```javascriptjavascript:alert(Math.PI);\n```\n\n结果所示图 4-1。\n\
  \n![查看 Math 属性的值](img/httpatomoreillycomsourcemspimages748613.jpg)\n\n图 4-1 查看 *Math.PI\
  \ 属性的值*\n\n### 点符号\n\n点符号之所以这样命名，是因为使用单个点（即 period）来访问对象的成员。单个点在元素之间创建了易于识别的分隔。例如，为了访问你可能称为“变量*room\
  \ 的长度”，你需要编写 `room.length`。点运算符在许多编程语言中用法类似。\n\n`Math` 对象的其他若干属性对你的程序可能有帮助。其中某些作为对象的函数或方法，其若干列在表\
  \ 4-2 中。你可以在 ECMA-262 规范中获取 *Math* 对象的完整属性列表*[`www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf`](http://www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf)*。\n\
  \n表 4-2 选定的 Math 对象属性\n\n| 属性 | 定义 |\n| --- | --- |\n| `Math.random()` | 返回一个伪随机数\
  \ |\n| `Math.abs(x)` | 返回 *x* 的绝对值 |\n| `Math.pow(x,y)` | 返回 x 的 *y* 次方 |\n| `Math.round(x)`\
  \ | 将 x 四舍五入到最近的整数值 |\n\n\n\n\n字符串是 JavaScript 中提供的另一种基本数据类型。它们由引号包围的一个或多个字符组成。以下示例都是字符串：\n\
  \n*   “Hello world”\n*   “B”\n*   “This is ‘another string’”\n\n上一个列表中的最后一个示例需要一些解释。字符串被单引号或双引号包围。被单引号包含的字符串可以包含双引号。同样，被双引号包含的字符串（如你在上一个示例中看到的）可以包含单引号。所以，基本上，如果字符串被一种类型的引号包围，你就可以在内部使用另一种类型。这里是更多示例：\n\
  \n*   ‘The cow says “moo”.’\n*   ‘The talking clock says the time is “Twelve Noon”.’\n\
  *   “‘Everyone had a good time’ was the official slogan.”\n\n### ### ### 转义引号\n\n\
  如果你在字符串内部和包围字符串时使用了相同风格的引号，则必须对引号进行`escaped（转义）`，这样它们才不会被 JavaScript 引擎解析。一个反斜符字符（`\\\
  `）可以转义引号，例如这些示例：\n\n*   ‘I\\'m using single quotation marks both outside and within\
  \ this example. They\\'re neat.’\n*   “This is a \\\"great\\\" example of using\
  \ \\\"double quotes\\\" within a string that’s enclosed with \\\"double quotes\\\
  \" too.”\n\n### ### ### 其他转义字符\n\nJavaScript 允许使用特定的转义序列来表示其他字符，这些序列可以出现在字符串中。 4-3\
  \ 显示了这些转义序列。\n\n表 4-3. JavaScript 中的转义序列\n\n| 转义字符 | 序列值 |\n| --- | --- |\n| `\\\
  b` | 退格 |\n| `\\t` | 制表符 |\n| `\\n` | 换行 |\n| `\\v` | 垂直制表符 |\n| `\\f` | 换页 |\n\
  | `\\r` | 回车 |\n| `\\\\` | 字面量反斜杠 |\n\n这里是一些转义序列运行的示例。（请让我第一个对继续使用 `alert()` 函数表示道歉。我承诺很快就会采用更复杂的输出方式。）\n\
  \n#### #### #### 使用转义序列\n\n1.  打开你的浏览器，例如 Internet Explorer 或 Firefox。\n2.  在地址栏中输入以下内容（在辅助内容中的\
  \ escapesequences.txt 文件中也可以找到）：\n    ```\n    javascript:alert(\"hello\\t\\thello\\\
  ngoodbye\");\n    ```\n    出现以下对话框。（如果它没有出现，请关闭并重新打开浏览器。）注意，在某些浏览器（如 Chrome）中，此示例中制表符的使用方式不会生效。\n\
  \n![使用转义序列](img/httpatomoreillycomsourcemspimages748615.png.jpg)\n\n这个相当显刻意的示例展示了转义序列的运行情况。在代码中，`alert`\
  \ 显示了被两个制表符包围的单词“hello”，它们由其转义序列 `\\t` 表示，随后是一个由其转义序列 `\\n` 表示的换行符，最后是单词“goodbye”。\n\
  \n### ### 字符串方法和属性\n\nJavaScript 定义了几个用于处理字符串的属性和方法。这些属性和方法使用点符号（`.`）进行访问，这在本章早些部分已解释过，许多程序员对此都很熟悉。\n\
  \n### ### 注意\n\n正如我在书中只描述了 JavaScript 的某些元素一样，我只涵盖了 ECMA-262 规范中的部分字符串属性和方法。更多信息请参考\
  \ ECMA 规范。\n\n`string` 对象上的 `length` 属性给出字符串的长度，不包括包围的引号。`length` 属性可以直接直接在字符串字面量上调用，如下示例所示：\n\
  \n```\nalert(\"This is a string.\".length);\n```\n\n然而，在变量上调用 `length` 属性要常见得多，如下：\n\
  \n```javascript\nvar x = \"This is a string.\";\nalert(x.length);\n```\n\n两个示例给出了相同的结果，你可以通过下一个示例看到这一点。\n\
  \n#### #### 获取字符串的长度\n\n1.  打开你的浏览器，例如 Internet Explorer 或 Firefox。\n2.  在地址栏中输入以下内容（在辅助内容中的\
  \ stringlength.txt 文件中也可以找到）：\n    ```\n    javascript:alert(\"This is a string.\"\
  .length);\n    ```\n    结果是一个显示 17 的对话框，如下：\n    ![获取字符串的长度](img/httpatomoreillycomsourcemspimages748618.png.jpg)\n\
  3.  现在尝试在地址栏中输入这段代码：\n    ```javascript\n    javascript:var x = \"This is a string.\"\
  ; alert(x.length);\n    ```\n    结果是一个显示 17 的对话框，与之前的示例相同。\n\n`substring` 方法返回从第一个参数开始到不包含第二个参数的字符，如下一个示例所示：\n\
  \n```\nalert(x.substring(0,3));\n```\n\n接下来的代码将返回字符串 `x` 的第一个到第五个字符。例如：\n\n```javascript\n\
  var x = \"Steve Suehring\";\nalert(x.substring(0,5));\n```\n\n结果是一个显示字符串“Steve”的消息框。\n\
  \n### 奇特的索引方式\n\n用于 `substring` 方法的索引有点奇怪——至少我是这么认为的。第一个字符由整数 0 表示。这没问题，因为 0 是一个有效的数字。\n\
  \n（注：此处原文似乎存在逻辑重复或断位，已根据要求翻译并保持原文逻辑）\n\n*纠正：原文中在 Odd Indexing 之后的内容似乎为：*\n“接下来的代码将返回字符串\
  \ `x` 的第一个到第五个字符。例如：\n```javascript\nvar x = \"Steve Suehring\";\nalert(x.substring(0,5));\n\
  ```\n结果是一个显示字符串“Steve”的消息框。”\n\n（注：由于提供的原文文本在 Odd Indexing 之后似乎出现了内容重复或逻辑混乱，译文已严格按照提供的文本进行翻译。）\n\
  \n\n\n正如我之前提到的，存在许多字符串属性和方法。本书的其余部分将介绍其他的字符串属性和方法，你始终可以在 ECMA 规范中找到完整的列表：[`www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf`](http://www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf)。\n\
  \n## 布尔值 (Booleans)\n\n布尔值是 JavaScript 中一种隐藏或被动的数据类型。我所说的“隐藏”或“被动”，是指你处理布尔值的方式与处理字符串和数字不同；你可以定义并使用布尔变量，但通常你只是使用一个求值为布尔值的表达式。布尔值只有两个值：`true`\
  \ 和 `false`，在实践中，你很少将变量设置为这种值。相反，你会在 `if`/`then`/`else` 语句等测试中使用布尔表达式。\n\n考虑这条语句：\n\
  \n```\nIf (myNumber > 18) {\n    //do something\n}\n```\n\n布尔表达式用在 `if` 语句的条件中，以确定括号内的代码是否会被执行。如果变量\
  \ `myNumber` 的内容大于整数 `18`，则布尔表达式求值为 `true`；否则，布尔求值为 `false`。\n\n## 空值 (Null)\n\n\
  `Null` 是 JavaScript 中的另一种特殊数据类型（就像在大多数语言中一样）。`Null` 来说就是“无”。它代表并求值为 `false`。当一个值为\
  \ `null` 时，它什么都没有，也不包含任何内容。然而，不要将这种“无”与“空”混淆。一个空值或变量仍然充满了“空”。“空”不同于 `null`，后者只是纯粹的无。例如，定义一个变量并将其值设置为空字符串如下所示：\n\
  \n```\nvar myVariable = '';\n```\n\n变量 `myVariable` 是空的，但它不是 `null`。\n\n## 未定义 (Undefined)\n\
  \n`Undefined` 是一种状态，有时被当作值使用，表示一个尚未包含值的变量。这种状态不同于 `null`，尽管 `null` 和 `undefined`\
  \ 都可以以相同的方式求值。你将在第 5 章中学习如何区分空值和未定义值。\n\n## 对象 (Objects)\n\n和函数一样，对象足够特殊，拥有它们自己的章节（准确来说，是第\
  \ 8 章）。但我在这里仍然简要讨论了对象。JavaScript 是一种基于对象的语言，而不是完全的面向对象语言。JavaScript 实现了一些类似于面向对象的功能，对于\
  \ JavaScript 的大多数基本用法，你不会察觉这种差异。\n\nJavaScript 中的对象是属性的集合，每个属性包含一个原始值。这些属性——将它们想象成\
  \ `keys`（键）允许访问值。存储在属性中的每个值可以是一个值、另一个对象，甚至是一个函数。你可以用 JavaScript 定义自己的对象，也可以使用几个内置对象。\n\
  \n对象是使用大括号创建的，因此以下代码创建了一个名为 `myObject` 的空对象：\n\n```\nvar myObject = {};\n```\n\n\
  这是一个具有多个属性的对象：\n\n```\nvar dvdCatalog = {\n    \"identifier\": \"1\",\n    \"name\"\
  : \"Coho Vineyard \"\n};\n```\n\n先前的代码示例创建了一个名为 `dvdCatalog` 的对象，它包含两个属性：一个称为 `identifier`，另一个称为\
  \ `name`。每个属性中包含的值分别为 `1` 和 “Coho Vineyard”。你可以像这样访问 `dvdCatalog` 对象的 `name` 属性：\n\
  \n```\nalert(dvdCatalog.name);\n```\n\n这里有一个更完整的对象示例，你也可以在 `object.txt` 文件的示例代码中找到它：\n\
  \n```\n// 使用大括号创建一个新对象\nvar star = {};\n// 为四颗星中的每一颗创建一个命名对象。\nstar[\"Polaris\"\
  ] = new Object;\nstar[\"Deneb\"] = new Object;\nstar[\"Vega\"] = new Object;\nstar[\"\
  Altair\"] = new Object;\n```\n\n书中后面的示例展示了如何向这些对象添加属性，以及如何访问属性。关于对象还有很多内容，第 8 章\
  \ 提供了额外的细节。\n\n## 数组 (Arrays)\n\n你在上一个示例中已经看到如何创建一个带命名的对象。你也可以使用通过数字索引值访问的未命名对象。这些是传统的数组，许多语言的程序员都熟悉它们。你刚刚看到了几个对象，每个对象都用星命名。以下代码创建了一个包含相同对象的数组。这段代码也可以在名为\
  \ `stararray.txt` 的示例代码中找到。\n\n```\nvar star = new Array();\nstar[0] = \"Polaris\"\
  ;\nstar[1] = \"Deneb\";\nstar[2] = \"Vega\";\nstar[3] = \"Altair\";\n```\n\n同样的代码也可以像这样写，使用方括号表示的隐式数组构造函数：\n\
  \n```\nvar star = [\"Polaris\", \"Deneb\", \"Vega\", \"Altair\"];\n```\n\n数组可以包含嵌套的值，就像这个示例将星名与它所所在的星座结合在一起：\n\
  \n```\nvar star = [[\"Polaris\", \"Ursa Minor\"],[\"Deneb\",\"Cygnus\"],[\"Vega\"\
  ,\"Lyra\"],\n[\"Altair\",\"Aquila\"]];\n```\n\n最后，虽然不常见，但你可以带参数调用 `Array()` 构造函数：\n\
  \n```\nvar star = Array(\"Polaris\", \"Deneb\", \"Vega\", \"Altair\");\n```\n\n\
  ### 注意\n\n带数字参数调用 `Array()` 构造函数设置的是数组的长度，而不是第一个元素的值。\n\nECMA-262 版本增加了一些遍历和处理数组的新方法。数组的遍历和处理方法在第\
  \ 8 章 中有更详细的介绍。\n\n# 定义和使用变量\n\n变量对于任何语言的程序员来说都是熟悉的。变量存储程序执行过程中可能会改变的数据。你在书之前的章节中已经见过多个声明变量的示例。本节规范了\
  \ JavaScript 中变量的使用。\n\n## 声明变量\n\nJavaScript 中使用 `var` 关键字声明变量。你可以在本书的相关文件 `variablenaming.txt`\
  \ 中找到示例。以下都是有效的变量声明：\n\n```\nvar x;\nvar myVar;\nvar counter1;\n```\n\n变量名可以包含大写和小写字母以及数字，但不能以数字开头。变量名不能包含空格或其他标点符号，下划线（`_`）除外。（尽管在实践中，我很少看到\
  \ JavaScript 变量中使用划线。）以下变量名是无效的：\n\n```\nvar 1stCounter;\nvar new variable;\nvar\
  \ new.variable;\nvar var;\n```\n\n看看先前的示例。其他三个变量名之所以，是因为使用了完全无效的字符（或者在那个位置无效，如第一个示例所示），而最后一个变量名\
  \ `var` 无效是因为它使用了关键字。关于 JavaScript 关键字或保留字的更多信息，请参考第 2 章。\n\n你可以在同一行代码中声明多个变量，如下：\n\
  \n```\nvar x, y, zeta;\n```\n\n也可以在同一行进行初始化：\n\n```\nvar x = 1, y = \"hello\", zeta\
  \ = 14;\n```\n\n## 变量类型\n\nJavaScript 中的变量不是强类型的。没有必要预先声明变量将持有整数、浮点数还是字符串。你也可以通过重新赋值来更改变量所持的数据类型。考虑这个示例，变量\
  \ `x` 首先持有整数，然后通过另一次赋值，它变为持有字符串：\n\n```\nvar x = 4;\nvar x = \"Now it's a string.\"\
  ;\n```\n\n## 变量作用域\n\n\n\n\n\n变量的`scope`（作用域）指的是访问其值的位置。当变量在函数外部时，它们是`globally scoped`（全局作用域的）。全局变量可以在整个\
  \ JavaScript 程序中被访问。在网页（或者你可以将其理解为文档）中，你可以在范围内访问并使用全局变量。\n\n在函数内部定义的变量仅作用于该函数。这意味着这些变量的值无法在函数外部访问。函数参数的作用域也局限于该函数。\n\
  \n以下是一些关于作用域的实际示例，你也可以在 `scope1.txt` 文件的配套代码中找到它们：\n\n```\n<script type=\"text/javascript\"\
  >\nvar aNewVariable = \"I'm Global.\";\nfunction doSomething(incomingBits) {\n \
  \   alert(aNewVariable);\n    alert(incomingBits);\n}\ndoSomething(\"An argument\"\
  );\n</script>\n```\n\n代码定义了两个变量：一个名为 `aNewVariable` 的全局变量，以及名为 `incomingBits` 的变量，后者是\
  \ `doSomething()` 函数的局部变量。这两个变量都被传递给 `doSomething()` 函数内部相应的 `alert()` 函数。当调用 `doSomething()`\
  \ 函数时，两个变量的内容都被成功发送并显示在屏幕上，如图图 4-2 和图 4-3 所示。\n\n![变量 aNewVariable 是全局作用域的。](img/httpatomoreillycomsourcemspimages748620.png.jpg)\n\
  \n图 4-2。变量 `aNewVariable` 是全局作用域的。\n\n![变量 incomingBits 局域于函数。](img/httpatomoreillycomsourcemspimages748622.png.jpg)\n\
  \n图 4-3。变量 `incomingBits` 局域于函数。\n\n这里有一个更复杂的示例供你尝试。\n\n### 检查变量作用域\n\n1. 使用 Visual\
  \ Studio、Eclipse 或编辑器，编辑 Chapter04 示例文件文件夹中的 `scoping.htm` 文件。\n2. 在页面中，将 TODO 注释替换为此处显示的**粗体代码**（新代码可以在配套内容的\
  \ `scoping.txt` 文件中找到）：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n    <title>Scoping\
  \ Example</title>\n    <script type=\"text/javascript\">\n    var aNewVariable =\
  \ \"is global.\";\n    function doSomething(incomingBits) {\n        alert(\"Global\
  \ variable within the function: \" + aNewVariable);\n        alert(\"Local variable\
  \ within the function: \" + incomingBits);\n    }\n    </script>\n</head>\n<body>\n\
  \    <script type=\"text/javascript\">\n        doSomething(\"is a local variable\"\
  );\n        alert(\"Global var outside the function: \" + aNewVariable);\n     \
  \   alert(\"Local var outside the function: \" + incomingBits);\n\n    </script>\n\
  </body>\n</html>\n```\n\n结果是屏幕上出现了三个警告框。\n\n第一个警告框是：\n![检查变量作用域](img/httpatomoreillycomsourcemspimages748624.png)\n\
  \n第二个警告框是：\n![检查变量作用域](img/httpatomoreillycomsourcemspimages748626.png)\n\n第三个警告框看起来是：\n\
  ![检查变量作用域](img/httpatomoreillycomsourcemspimages748629.png)\n\n但等一下——检查代码。你看到了多少次对\
  \ `alert()` 函数的调用？提示：两个在 `<head>` 部分，另外两个在 `<body>` 部分，总共四次对 `alert()` 函数的调用。那么，为什么在脚本中调用了四次\
  \ `alert()` 函数，屏幕上却只显示三个警告框呢？\n\n因为这是一个关于变量作用域的章节（我已经解释了答案），你可能已经想出来了。但这个例子很好地演示了当结果不符合预期时如何排查\
  \ JavaScript 问题。\n\n接下来的步骤需要使用 Mozilla Firefox 浏览器的 Firebug 插件。作为一名 Web 开发者，我假设你已经安装了\
  \ Firefox（关于你应该安装它的原因请参见第 1 章）。如果你还没有 Firefox，请从 `[`www.mozilla.com/firefox/`](http://www.mozilla.com/firefox/)`\
  \ 下载。\n\n### 安装 Firebug\n\n第一个步骤将引导你如何在 Firefox 中安装 Firebug。尽管 Internet Explorer\
  \ 有脚本调试器，你也可以使用 Microsoft 脚本调试器，但 Firebug 要强大且灵活得多。\n\n1. 在安装了 Firefox 的情况下，是时候获取\
  \ Firebug 插件了。访问 `[`www.getfirebug.com/`](http://www.getfirebug.com/)` 完成任务。进入网站后，点击安装链接。（如果你是第一次安装\
  \ Firebug，可能会收到警告，提示 Firefox 已阻止该网站安装软件。较新版本的 Firefox 不显示此警告。）\n2. 点击安装链接后，会弹出软件安装对话框，如图所示。点击立即安装。\n\
  ![安装 Firebug](img/httpatomoreillycomsourcemspimages748631.png)\n3. 扩展程序对话框打开（如图所示），Firebug\
  \ 插件开始下载。下载完成后需要重启 Firefox，因此点击重启 Firefox。\n![安装 Firebug](img/httpatomoreillycomsourcemspimages748633.png)\n\
  4. Firefox 关闭并重新打开，显示已安装的插件。如果打开了扩展对话框，请将其关闭。恭喜！Firebug 已安装。注意 Firefox 浏览器窗口右下角有一个图标。点击此图标打开\
  \ Firebug 台：\n![安装 Firebug](img/httpatomoreillycomsourcemspimages748635.jpg)\n5.\
  \ Firebug 处于禁用状态，但别担心——下一个步骤将引导你启用并使用它。你可以通过针对该网站或所有网站来实验 Firebug。\n\n安装 Firebug\
  \ 后，你可以排查之前在作用域示例中遇到的只显示了四个预期警告之一的问题。\n\n### 使用 Firebug 排查\n\n1. 打开 Firefox 并选择本章之前创建的\
  \ `scoping.htm` 示例。JavaScript 代码再次像之前一样执行，显示三个警告。关闭所有三个警告。你在 Firefox 中加载了一个空白页面。\n\
  2. 点击 Firefox 浏览器窗口右下角的 Firebug 图标以打开 Firebug。\n![使用 Firebug 排查](img/httpatomoreillycomsourcemspimages748637.png.jpg)\n\
  3. 点击 Script 标签打开 Script 面板，并注意它是禁用的。你希望启用 Console 面板以便获取错误。Script 面板在 Console 面板激活时会被激活，因此启用\
  \ Console 面板。点击 Console 标签，点击 Console 旁边的箭头/三角形，然后点击开启。你可以看到 JavaScript 调试器也已激活：\n\
  ![使用 Firebug 排查](img/httpatomoreillycomsourcemspimages748640.png.jpg)\n4. 在开启 Console\
  \ 和 Script 面板的情况下，点击 Firefox 主工具栏上的重新加载按钮或从查看菜单中选择重新加载。页面重新加载，JavaScript 再次执行。三个警告框再次显示，但现在注意\
  \ Firebug 发现了一个错误，如状态栏右下角的红色 X 和 1 个错误指示所示，正如图所示：\n![使用 Firebug 排查](img/httpatomoreillycomsourcemspimages748642.png.jpg)\n\
  \n\n\n5. 如果控制台（Console）面板未打开，点击窗口中 Firebug 部分的 Console 选项卡以显示错误，该错误是变量 `incomingBits`\
  \ 未定义。此窗口还显示了发生问题的行号。但请注意，由于文档解析方式，你原始源代码中的行号并不总是准确的。尽管如此，你仍然可以看到 `incomingBits`\
  \ 在网页的 `<body>` 内部没有定义，因为它的作用域限于 `doSomething()` 函数。\n\n此过程不仅演示了 Firebug 的用法，还演示了变量局部作用域与全局作用域的影响。Firebug\
  \ 是 JavaScript（以及网页）调试不可缺的一部分。我邀请你花些时间在任何网站上使用 Firebug，看看 JavaScript、CSS 和 HTML\
  \ 是如何相互作用的。\n\n在此过程中，修复方法是定义变量 `incomingBits`，使其在函数调用之外实例化。（这行新代码紧随其后，位于辅助内容中 `Chapter04`\
  \ 文件夹下的 `scoping-fixed.htm` 文件。）由于该变量仅作为函数定义的一部分定义的，因此该变量在函数作用域之外不存在。\n\n```\n<!DOCTYPE\
  \ HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html\n<head>\n    <title>Scoping Example</title>\n    <script type=\"text/javascript\"\
  >\n    var aNewVariable = \"is global.\";\n    function doSomething(incomingBits)\
  \ {\n        alert(\"Global variable within the function: \" + aNewVariable);\n\
  \        alert(\"Local variable within the function: \" + incomingBits);\n    }\n\
  \n    </script>\n\n</head>\n<body\n<script type=\"text/javascript\">\n    var incomingBits\
  \ = \" must be defined if necessary.\";\n    doSomething(\"is a local variable\"\
  );\n    alert(\"Global var outside the function: \" + aNewVariable);\n    alert(\"\
  Local var outside the function: \" + incomingBits);\n\n</script>\n</body>\n\n</html>\n\
  ```\n\n你可以在第 7 章 中找到更多关于函数的信息。\n\n## Date 对象\n\n`Date` 对象包含了许多在 JavaScript 中处理日期时非常有用的方法——事实上，方法多到在像这样的初级书籍中无法进行深入研究——但我向你展示了一些你可能会整合到项目中的示例。\n\
  \nJavaScript 中 `Date` 对象的一个不幸之处是，其方法的实现很大程度上取决于浏览器和操作系统系统。例如，考虑以下代码，它可以返回当前时间的日期，并根据本地时区进行调整，同时通过\
  \ `toLocaleDateString()` 方法自动格式化：\n\n```\nvar myDate = new Date();\nalert(myDate.toLocaleDateString());\n\
  ```\n\n在运行 Windows 7 的计算机上的 Internet Explorer 8 中运行时，代码生成的日期如图 4-4 方法。\")所示。\n\n\
  ![Internet Explorer 8 中 Date 对象的 toLocaleString() 方法。](img/httpatomoreillycomsourcemspimages748644.png)\n\
  \n图 4-4。Internet Explorer 8 中 Date 对象的 `toLocaleString()` 方法。\n\n图 4-5 方法在 Linux\
  \ 版 Firefox 上显示不同的消息。\") 显示了当相同代码在 Linux 上的 Firefox 3.6 中执行时发生的情况。\n\n![Linux 版\
  \ Firefox 上 Date 对象的 toLocateString() 方法显示不同的消息。](img/httpatomoreillycomsourcemspimages748646.png.jpg)\n\
  \n图 4-5。Linux 版 Firefox 上 Date 对象的 `toLocateString()` 方法显示不同的消息。\n\n这两个对话框之间的差异可能看起来是微不足道的，但如果你期望在代码中使用星期（示例中的周一），你将会大吃一惊。而且，不要被误导，认为这些实现问题仅仅是跨操作系统的问题。`Date`\
  \ 对象及其方法的实现差异在运行微软 Windows 产品的浏览器中也存在。\n\n`Date` 对象的 `getYear()` 方法提供了 JavaScript\
  \ 实现存在不一的另一个例子，这次是运行相同版本 Windows 7 的两台计算机之间的差异。考虑这段代码：\n\n```\nvar myDate = new\
  \ Date();\nalert(myDate.getYear());\n```\n\n在 Internet Explorer 8 中调用时，此代码产生的输出如图\
  \ 4-6 方法的输出显示完整年份。\")所示。\n\n![Internet Explorer 8 中 getYear() 方法的输出显示完整年份。](img/httpatomoreillycomsourcemspimages748648.png.jpg)\n\
  \n图 4-6。Internet Explorer 8 中 `getYear()` 方法的输出显示完整年份。\n\n在运行 Windows 的计算机上的 Firefox\
  \ 3.6 中调用时，代码产生的输出如图 4-7 方法的输出显示为完整年份。\")所示。\n\n![Firefox 中 getYear() 方法的输出显示为完整年份。](img/httpatomoreillycomsourcemspimages74865.png.jpg)\n\
  \n图 4-7。Firefox 中 `getYear()` 方法的输出显示为完整年份。\n\n幸运的是，这种实现差异有一个简单的解决方法。ECMA-262 规范提供了\
  \ `getFullYear()` 方法，它返回完整年份——示例中为 2010。\n\n解决应用程序中这些或其他差异的唯一方法是进行跨浏览器跨平台的测试。这样做会增加开发周期，但在开发过程中发现问题的成本比用户发现问题要低得多。\n\
  \n## 什么日期？\n\n注意图 4-4 方法。\")和图 4-5 方法在 Linux 版 Firefox 上显示不同的消息。\")中的日期：2001 年 6\
  \ 月 16 日，星期六。你可能会怀疑这本书是否是在 2001 年写的。并不是。但使用之前的年份说明了 JavaScript 和日期之间的问题。任何 JavaScript\
  \ 函数返回的日期反映了执行 JavaScript 的计算机上的日期。\n\n我恰好将我的计算机日期更改为了 2001 年 6 月 16 日以说明这一点。（顺便提一下，2001\
  \ 年 6 月 16 日是我的结婚日，现在如果我忘记了，我有一个方便的地方可以作为参考。当然，我永远不会忘记……）\n\n`Date` 对象可以接收从零个到七个不等的参数。当\
  \ `Date` 对象构造函数传递单个字符串参数时，该字符串被假设包含日期。当传递数字类型参数时，该参数被假设是自 1970 年 1 月 1 日以来的毫秒数，当传递七个参数时，它们被假设为：\n\
  \n```\nnew Date(year, month, day, hours, minutes, seconds, milliseconds)\n```\n\n\
  ### 注意\n\n只有 `year` 和 `month` 是必需参数；其他是可选的。\n\n在使用 `Date` 对象的任何方法时，请记住以下几点：\n\n\n\
  \n\n- 年份应用四位数表示，除非你想指定 1900 年到 2000 年之间的年份，在这种情况下，你只需要发送 0 到 99 之间的两位年份，它会被加上 1900。因此，2008\
  \ 等于 2008 年，而 98 则会被转换为 1998 年。\n- 月份由 0 到 11 之间的整数表示，0 代表 1 月，11 代表 12 月。\n- 日期是\
  \ 1 到 31 之间的整数。\n- 小时由 0 到 23 表示，其中 23 代表晚上 11 点。\n- 分钟和秒都是 0 到 59 之间的整数。\n- 毫秒是\
  \ 0 到 999 之间的整数。\n\n虽然下面的步骤使用了一些在后续章节才会介绍的内容，但你现在正在查看 `Date` 对象，所以现在是学习如何将日期和时间写入网页的好时——这是一项常用的操作。\n\
  \n### 将日期和时间写入网页\n\n1. 使用 Visual Studio、Eclipse 或或其他编辑器，编辑配套内容第 04 章示例文件文件夹中的 `writingthedate.htm`\
  \ 文件。\n2. 在页面中，添加此处所示的粗体代码：\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html\n<head>\n    <title>the date</title>\n\
  </head>\n<body\n    <p id=\"dateField\">&nbsp;</p>\n    <script type=\"text/javascript\"\
  >\n\n    var myDate = new Date();\n    var dateString = myDate.toLocaleDateString()\
  \ + \" \" + myDate.toLocaleTimeString();\n    var dateLoc = document.getElementById(\"\
  dateField\");\n    dateLoc.innerHTML = \"Hello - Page Rendered on \" + dateString;\n\
  \    </script>\n\n</body>\n</html>\n```\n3. 保存并在网页浏览器中查看，你应该得到这样的页面（尽管你看到的日期与此处显示的不同）：\n\
  ![将日期和时间写入网页](img/httpatomoreillycomsourcemspimages748652.png.jpg)\n\n上步骤中相关的 JavaScript\
  \ 代码在此重复出现：\n```javascript\nvar myDate = new Date();\nvar dateString = myDate.toLocaleDateString()\
  \ + \" \" + myDate.toLocaleTimeString();\nvar dateLoc = document.getElementById(\"\
  dateField\");\ndateLoc.innerHTML = \"Hello - Page Rendered on \" + dateString;\n\
  ```\n\n与 `Date` 对象相关的 JavaScript 非常简单。它利用了你已经见过的 `toLocaleDateString()` 方法以及它的同类方法\
  \ `toLocaleTimeString()`，后者返回本地时间。这两个方法通过一个空格连接在一起，并放入 `dateString` 变量中，如下：\n```javascript\n\
  var dateString = myDate.toLocaleDateString() + \" \" + myDate.toLocaleTimeString();\n\
  ```\n代码其余部分是将 `dateString` 变量的内容写入网页。关于 JavaScript 这一方面的更多信息请参阅 第 10 章。\n\n### 为未来的某个特定日期倒计时\n\
  \n1. 使用 Visual Studio、Eclipse 或或其他编辑器，编辑配套内容第 04 章示例文件文件夹中的 `countdown.htm` 文件。\n\
  2. 在页面中添加此处所示的粗体代码：\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html\n<head>\n     <title>the date</title>\n\
  </head>\n<body\n    <p id=\"dateField\">&nbsp;</p>\n    <script type=\"text/javascript\"\
  >\n    var today = new Date();\n    var then = new Date();\n    // 2012 年 1 月 1\
  \ 日\n    then.setFullYear(2012,0,1);\n    var diff = then.getTime() - today.getTime();\n\
  \    diff = Math.floor(diff / (1000 * 60 * 60 * 24));\n    var dateLoc = document.getElementById(\"\
  dateField\");\n    dateLoc.innerHTML = \"There are \" + diff + \" days until 1/1/2012\"\
  ;\n    </script>\n\n</body>\n</html>\n```\n3. 保存页面并在网页浏览器中查看。根据你计算机上的日期，表示的天数将有所不同，但页面的大致外观应该是这样的：\n\
  ![为未来的某个日期倒计时](img/httpatomoreillycomsourcemspimages748654.png.jpg)\n\n### 提示\n\n\
  在使用 JavaScript 日期进行显示以外的任何用途时要加小心。因为日期取决于访问者的时间，所以在在准确时间可能重要的地方，不要依赖它们，例如在订单处理流程中。\n\
  \n你刚刚完成的练习使用了 `Math` 和 `Date` 对象的某些额外函数，即 `floor()` 和 `getTime()`。虽然这本书涵盖了大量内容，但它并不是完整的\
  \ JavaScript 语言参考书。要获取这及更多信息，请参阅 ECMA-262 标准：`[`www.ecma-international.org/publications/standards/Ecma-262.htm`](http://www.ecma-international.org/publications/standards/Ecma-262.htm)`。\n\
  \n下一个步骤将展示如何计算（或者更好的粗略估计）网页在人员浏览器中加载所需的时间。\n\n### 注意\n\n下一个步骤是不准确的，因为它没有考虑加载和渲染图像（或其他多媒体项目）所需的时间，这些是外部于网页文本的。在脚本运行结束后，还有一些位会加载。我在几个网站上见过用于计算日期的组件，你可能会发现它有用。\n\
  \n### 计算渲染时间\n\n1. 使用 Visual Studio、Eclipse 或或其他编辑器，编辑配套内容第 04 章示例文件文件夹中的 `render.htm`\
  \ 文件。\n2. 在页面中添加此处所示的粗体代码：\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0\
  \ Transitional//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html\n<head>\n    <title>the date</title>\n    <script type=\"text/javascript\"\
  >\n    var started = new Date();\n    var now = started.getTime();\n    </script>\n\
  </head>\n<body\n    <p id=\"dateField\">&nbsp;</p>\n    <script type=\"text/javascript\"\
  >\n    var bottom = new Date();\n    var diff = (bottom.getTime() - now)/1000;\n\
  \    var finaltime = diff.toPrecision(5);\n    var dateLoc = document.getElementById(\"\
  dateField\");\n    dateLoc.innerHTML = \"Page rendered in \" + finaltime + \" seconds.\"\
  ;\n    </script>\n\n</body>\n</html>\n```\n3. 保存页面并在网页浏览器中查看。根据你的计算机、Web 服务器和网络连接的速度，你可能会得到一个指示加载时间为\
  \ 0 秒的页面，如下：\n![计算渲染时间](img/httpatomoreillycomsourcemspimages748656.png.jpg)\n4.\
  \ 如果你的页面耗时 0.0000 秒（像我的一样），你可以在页面中引入延迟以便进行测试。（不过，我不建议在实线网站上这样做，因为我想不出任何你想减慢页面渲染速度的原因！但引入延迟对于测试目的可能很有用。）使用\
  \ `for` 循环是减慢 JavaScript 执行的一种简单且方便的方法：\n```javascript\nfor (var i = 0; i < 1000000;\
  \ i++) {\n   //delay\n}\n```\n我选择的数值 1000000 是随意的。你可能需要选择更大或更小的数字来产生所需的延迟。最终代码看起来如下：\n\
  \n\n\n\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n<head>\n    <title>the date</title>\n    <script type=\"text/javascript\">\n\
  \    var started = new Date();\n    var now = started.getTime();\n    for (var i\
  \ = 0; i < 1000000; i++) {\n       //delay\n    }\n    </script>\n</head>\n<body>\n\
  \    <p id=\"dateField\">&nbsp;</p>\n    <script type=\"text/javascript\">\n   \
  \ var bottom = new Date();\n    var diff = (bottom.getTime() - now)/1000;\n    var\
  \ finaltime = diff.toPrecision(5);\n    var dateLoc = document.getElementById(\"\
  dateField\");\n    dateLoc.innerHTML = \"Page rendered in \" + finaltime + \" seconds.\"\
  ;\n    </script>\n</body>\n</html>\n```\n\n5. 保存页面并在 Web 浏览器中再次查看。你应该能看到页面加载时存在一些延迟，这导致结果为一个正数：\n\
  \n![计算渲染时间](img/httpatomoreillycomsourcemspimages748658.png.jpg)\n\n在使用此函数或类似函数确定页面加载时间时，为了计算出最准确的值，请将初始变量放在页面或脚本的顶部，然后在页面底部放置另一个变量。\n\
  \n需要注意的是，`Date()` 对象的 `now()` 方法也可以作为 `getTime()` 的替代方案。\n\n你刚刚学习了 `Date` 对象的 40\
  \ 多种方法中的几种。其中许多方法都有对应的 UTC（协调世界时）方法，这意味着它们可以以 UTC 格式获取或设置日期和时间，而不是本地时间。表 4-4 列出了返回日期的方法。除了\
  \ `getTime()` 和 `getTimezoneOffset()` 之外，所有这些方法都有对应的 UTC 方法，并使用 `getUTCDate()`、`getUTCDay()`\
  \ 等格式进行调用。\n\n表 4-4. Date 对象的 *get* 方法\n\n| 方法 | 说明 |\n| --- | --- |\n| `getDate()`\
  \ | 返回月份中的某一天 |\n| `getDay()` | 返回星期几 |\n| `getFullYear()` | 返回四位数的年份，在大多数情况下建议优于\
  \ `getYear()` 方法 |\n| `getHours()` | 返回日期的小时 |\n| `getMilliseconds()` | 返回日期的毫秒数\
  \ |\n| `getMinutes()` | 返回日期的分钟 |\n| `getMonth()` | 返回日期的月份 |\n| `getSeconds()`\
  \ | 返回日期的秒 |\n| `getTime()` | 返回自 1970 年 1 月 1 日以来的毫秒数 |\n| `getTimezoneOffset()`\
  \ | 返回 UTC 与本地时间差计算出的分钟数 |\n\n许多 `get...()` 方法都有以 `set` 为前缀的兄弟方法，如表 4-5 所示。和它们的\
  \ `get` 兄弟一样，大多数 `set...()` 方法都有对应的 UTC 方法，但 `setTime()` 除外。\n\n表 4-5. Date 对象的\
  \ *set* 方法\n\n| 方法 | 说明 |\n| --- | --- |\n| `setDate()` | 设置日期的月份中的某一天 |\n| `setFullYear()`\
  \ | 设置日期的四位数年份。也接受月份和日期的整数 |\n| `setHours()` | 设置日期的小时 |\n| `setMilliseconds()`\
  \ | 设置日期的毫秒数 |\n| `setMinutes()` | 设置日期的分钟 |\n| `setMonth()` | 设置日期的月份整数 |\n| `setSeconds()`\
  \ | 设置日期的秒 |\n| `setTime()` | 使用自 1970 年 1 月 1 日以来的毫秒数设置时间 |\n\n`Date` 对象还具有几种方法可以将日期转换为不同格式的字符串。你已经复习了其中一些方法，例如\
  \ `toLocaleDateString()`。其他类似的方法包括 `toLocaleString()`、`toGMTString()`、`toLocaleTimeString()`、`toString()`、`toISOString()`、`toDateString()`、`toUTCString()`\
  \ 和 `toTimeString()`。你可以随意尝试这些方法，请注意 `toISOString()` 是 ECMA-262 版本 5 规范中的新方法，所有浏览器可能都不支持它（它在大多数版本的\
  \ Internet Explorer 中明显缺失了）。下面的简单代码示例将帮助你开始尝试。尝试在浏览器的地址栏中输入它们：\n\n```javascript\n\
  javascript:var myDate = new Date(); alert(myDate.toLocaleDateString());\n\njavascript:var\
  \ myDate = new Date(); alert(myDate.toLocaleString());\n\njavascript:var myDate\
  \ = new Date(); alert(myDate.toGMTString());\n\njavascript:var myDate = new Date();\
  \ alert(myDate.toLocaleTimeString());\n\njavascript:var myDate = new Date(); alert(myDate.toString());\n\
  \njavascript:var myDate = new Date(); alert(myDate.toISOString());\n\njavascript:var\
  \ myDate = new Date(); alert(myDate.toDateString());\n\njavascript:var myDate =\
  \ new Date(); alert(myDate.toUTCString());\n\njavascript:var myDate = new Date();\
  \ alert(myDate.toTimeString());\n```\n\n你也可以在不创建 `myDate` 变量的情况下编写这些代码样本，如下：\n\n\
  ```javascript\njavascript: alert(new Date().toUTCString());\n```\n\n# 使用 RegExp\
  \ 对象\n\n*正则表达式* 是你用于匹配和操作字符串的语法。如果你在 Microsoft Windows 的命令提示符或 Linux/Unix 的 shell\
  \ 中工作过，你可能尝试通过使用星号（`*`）字符匹配所有文件来查找文件，例如：\n\n```bash\ndir *.*\n```\n\n或：\n\n```bash\n\
  dir *.txt\n```\n\n如果你使用过星号等通配符，你已经使用了类似于正则表达式的元素。事实上，星号也是正则表达式中使用的字符。\n\n正则表达式通过\
  \ JavaScript 中的 `RegExp` 对象和正则表达式字面量，提供了一种处理文本或字母字符串的强大方式。ECMA-262 的正则表达式实现很大程度上借鉴了\
  \ Perl 5 正则表达式解析器。这里有一个匹配 JavaScript 单词的正则表达式：\n\n```javascript\nvar myRegex = /JavaScript/;\n\
  ```\n\n所示的正则表达式将匹配出现在另一个字符串任何位置的 JavaScript 字符串。例如，该正则表达式将匹配句子“This is a book about\
  \ JavaScript”，也会匹配字符串“ThisIsAJavaScriptBook”，但不会匹配“This is a book about javascript”，因为正则表达式是区分大小大小的。（你可以更改这一点，稍将在本章后面部分看到。）\n\
  \n## 正则表达式的语法\n\n由于字符串解析的原因，正则表达式具有简洁（某些人认为是晦涩的）的语法。但不要让简洁的语法将你远离正则表达式，因为力量正存在这种语法之中。例如，以下正则表达式查找数字，然后执行替换以通过分组重新格式化整个互联网协议（IP）地址块（格式为\
  \ 192.168.0/24）。这个示例所做的与我们的讨论并不无关，只是为了展示一个更复杂的表达式示例。（如果你非要知道的话，它是在防火墙上解析亚太网络信息中心（APNIC）网络列表的\
  \ Perl 脚本的一部分。）\n\n```perl\ns/([0-9]+)\\.([0-9]+)(\\/[0-9]+)/$1\\.$2\\.0$3/;\n```\n\
  \n相同的正则表达式可以使用 `String` 对象的 `replace` 方法在 JavaScript 中编写，如下所示：\n\n```javascript\n\
  var theIP = \"192.168.0/28\";\nalert(theIP.replace(/([0-9]+)\\.([0-9]+)(\\/[0-9]+,\"\
  $1\\.$2\\.0$3\"));\n```\n\n正则表达式的语法包含了几个具有特殊含义的字符，包括将匹配锚用于字符串开头或结尾的字符、通配符和分组字符等。表\
  \ 4-6 显示了几个特殊字符\n\n表 4-6. JavaScript 正则表达式中的常见特殊字符\n\n| 字符 | 说明 |\n| --- | --- |\n\
  | ^ | 将锚点设置到输入的开头 |\n\n\n\n\n\n| $ | 将锚点设置在输入的末尾。 |\n| . | 匹配任意 `character`。 |\n\
  | * | 匹配上一个字符零或多次。将其视为一个通配符。 |\n| + | 匹配上一个字符一次或多次。 |\n| ? | 匹配上一个字符零次或一次。 |\n|\
  \ ( ) | 将括号内的匹配项放入组中，供以后使用。 |\n| {n, } | 匹配上一个字符至少 n 次。 |\n| {n,m} | 匹配上一个字符至少 n\
  \ 次但不超过 m 次。 |\n| [ ] | 定义一个字符类，以匹配括号内包含的任何字符。该字符可以使用如 0–9 这样的范围来匹配任何数字，或使用 a–z\
  \ 来匹配任何字母。 |\n| [^ ] | 在字符类内部使用脱字符符号（^）会反转该字符类，意味着该类中的字符不能出现在匹配中。 |\n| \\ | 通常用作转义字符，意味着反斜杠后的任何内容都被视为普通字符，而不是具有其特殊含义。也可用于定义特殊字符集，如\
  \ 表 4-7 所示。 |\n\n除了特殊字符外，还存在一些序列用于匹配字符组或非字母数字字符。其中一些序列显示在 表 4-7 中。\n\n### 表 4-7.\
  \ JavaScript 正则表达式常用字符序列\n\n| 字符 | 匹配 |\n| --- | --- |\n| \\b | 单词边界。 |\n| \\B |\
  \ 非单词边界。 |\n| \\c | 与另一个字符结合使用时的控制字符。例如，`\\cA` 是 `Control-A` 的转义序列。 |\n| \\d | 数字。\
  \ |\n| \\D | 非数字。 |\n| \\n | 换行。 |\n| \\r | 回车。 |\n| \\s | 单个空白字符，如空格或制表符。 |\n|\
  \ \\S | 单个非空白字符。 |\n| \\t | 制表符。 |\n| \\w | 任意字母数字字符，无论是数字还是字母。 |\n| \\W | 任意非字母数字字符。\
  \ |\n\n除了表 4-7 中的字符外，你还可以两个修饰符 `i` 和 `g` 来指定正则表达式以忽略大小写的方式解析，并使正则表达式匹配在第一次匹配后继续，这有时被称为*全局的*或*贪婪*（因此使用\
  \ `g`）。\n\n`RegExp` 对象有自己的方法，包括 `exec` 和 `test`，后者用于对字符串测试正则表达式，并根据正则表达式是否匹配该字符串返回\
  \ `true` 或 `false`。然而，在处理正则表达式时，使用 `String` 类型的原生方法（如 `match`、`search`、`replace`\
  \ 等）同样常见。\n\n`RegExp` 对象的 `exec()` 方法用于对字符串解析正则表达式并返回结果。例如，解析一个简单的 URL 并提取域名可能如下所示：\n\
  \n```\nvar myString = \"http://www.braingia.org\";\nvar myRegex = /http:\\/\\/\\\
  w+\\.(.*)/;\nvar results = myRegex.exec(myString);\nalert(results[1]);\n```\n\n\
  此代码的输出是一个显示地址中域名部分的警框，如 图 4-8 所示。\n\n![Parsing a typical web URL using a regular\
  \ expression.](img/httpatomoreillycomsourcemspimages748660.png.jpg)\n\n图 4-8. 使用正则表达式解析典型的\
  \ web URL。\n\n对这段代码进行拆解会有帮助。首先是字符串声明：\n\n```\nvar myString = \"http://www.braingia.org\"\
  ;\n```\n\n接下来是正则表达式的声明，然后是调用 `exec()` 方法，该方法对 `myString` 中找到的字符串解析正则表达式，并将结果放入名为\
  \ `results` 的变量中。\n\n```\nvar myRegex = /http:\\/\\/\\w+\\.(.*)/;\nvar results =\
  \ myRegex.exec(myString);\n```\n\n正则表达式包含几个重要元素。它首先查找字面字符串 `http:`。后面紧跟两个正斜杠，但由于正斜杠（`/`）是正则表达式中的特殊字符，你必须使用反斜杠（`\\\
  `）对其进行转义，使得正则表达式变为 `http:\\/\\/*`。\n\n正则表达式的下一部分 `\\w` 查找任意单个字母数字字符。网络地址通常是 `www`，所以不要误认为该表达式正在寻找三个字面上的\
  \ w——在这个示例中，主机名可以被称为 `web`、`host1`、`myhost` 或 `www`，如你正在查看的代码所示。因为 `\\w` 匹配任意单个字符，而网络主机通常匹配任意单个字符，因此示例中的主机是灵活的。\n\
  \n\n\n\n如果没有找到匹配项，`search` 方法将返回 `-1`。\n\n`replace` 方法的作用正如其名称所示——当找到匹配项时，它会将一个字符串替换为另一个字符串。假设在电子邮件地址的示例中，我想将任何\
  \ .com 邮箱地址更改为 .net 邮箱地址。你可以通过 `replace` 方法来实现这一点，如下所示：\n\n```\nvar emailAddr =\
  \ \"suehring@braingia.com\";\nvar myRegex = /\\.com$/;\nvar replaceWith = \".net\"\
  ;\nvar result = emailAddr.replace(myRegex,replaceWith);\nalert(result); //返回 suehring@braingia.net\n\
  ```\n\n如果模式不匹配，则将原始字符串赋给 `result` 变量中；如果匹配，则返回新值。\n\n### 注意事项\n你可以使用几个特殊字符来帮助进行替换。有关这些方法的更多信息，请参阅\
  \ ECMA-262 规范。\n\n后续章节将展示更多与正则表达式相关的 `string` 方法的示例。你可以随时将本章作为正则表达式中所用特殊字符的参考。\n\
  \n## 引用与垃圾收集\n\n某些类型的变量或它们包含的值是原始类型，而另一些是引用类型。这种影响初看之下可能对你没有意义——你可能甚至不会认为自己会关心这个。但当你第一次遇到刚复制的变量出现奇异行为时，你会改变主意的。\n\
  \n首先，是一些解释：对象、数组和函数作为`引用类型`工作，而数字、`Booleans`、`null` 和 `undefined` 被称为`原始类型`。根据 ECMA-262\
  \ 规范，其他其他原始类型，如 `Numbers` 和 `Strings`，但 `Strings` 与此讨论不相关。\n\n当数字被复制时，其行为正如你预期的：原始值和副本都获得相同的值。然而，如果你更改了原始值，副本将不受影响。这里有一个示例：\n\
  \n```\n// 将 myNum 的值设置为 20。\nvar myNum = 20;\n// 创建一个新变量 anotherNum，并将 myNum 的内容复制到它。\n\
  // 现在 anotherNum 和 myNum 都是 20。\nvar anotherNum = myNum;\n// 将 myNum 的值设置为 1000。\n\
  myNum = 1000;\n// 显示两个变量的内容。\n// 注意，anotherNum 的内容没有变化。\nalert(myNum);\nalert(anotherNum);\n\
  ```\n\nalert 分别显示 `1000` 和 `20`。一旦变量 `anotherNum` 获得了 `myNum` 内容的副本，无论之后变量 `myNum`\
  \ 发生了什么，它都会保留该内容。变量这样做是因为数字在 JavaScript 中是原始类型。\n\n将该示例与引用类型的变量类型进行对比，如下例：\n\n```\n\
  // 在名为 myNumbers 的变量中创建一个包含三个数字的数组。\nvar myNumbers = [20, 21, 22];\n// 在新建的变量 copyNumbers\
  \ 中创建 myNumbers 的副本。\nvar copyNumbers = myNumbers;\n// 将 myNumbers 的第一个索引值改为整数 1000。\n\
  myNumbers[0] = 1000;\n// 两个。\nalert(myNumbers);\nalert(copyNumbers);\n```\n\n在这种情况下，由于数组是引用类型，两个\
  \ alert 都显示了 `1000,21,22`，尽管代码中只修改了 `myNumbers`。这个故事的道理是，要意识到对象、数组和函数变量类型是引用类型，因此对原始值的任何更改都会影响所有副本。\n\
  \n与这个关于原始类型和引用类型差异的讨论松散相关的是垃圾收集主题。`垃圾收集`指的是 JavaScript 解释器销毁未使用的变量以节省内存。当变量在程序中不再被使用时，解释器会释放内存供重用。如果你使用\
  \ Java 虚拟机或 .NET 通用运行时，它也会为你执行此操作。\n\nJavaScript 中这种自动释放内存与 C++ 等其他语言处理未使用变量的方式不同。在那些语言中，程序员必须手动执行垃圾收集任务。这就是你关于垃圾收集真正需要知道的全部内容。\n\
  \n# 学习类型转换\n\n在结束对数据类型和变量的讨论之前，你应该了解一些`类型转换`，或者说在数据类型之间转换。JavaScript 通常会为你执行隐式类型转换，但在许多情况下，你可以显式地强制转换，或将变量从一种类型转换为另一种类型。\n\
  \n## 数字转换\n\n你已经在本章早前的 JavaScript 中的数据类型 节讨论的示例中，看到了两种数字格式（十六进制到 10 进制）之间的转换。然而，你也可以将数字转换为字符串。当数字在字符串上下文中使用时，JavaScript\
  \ 会隐式将数字转换为字符串。\n\n要显式地将数字转换为字符串，可以将数字强制转换为字符串，如下例所示：\n\n```\n// 将 myNumString 转换为值为\
  \ 100 的字符串\nString(100)\n```\n\n## 字符串转换\n\n正如你看到的两种数字格式之间的转换，你也可以将字符串转换为数字。通过将字符串强制转换为数字来实现。（这些示例可以在配套文件中找到。）\n\
  \n```\nvar myNumString = \"100\";\nNumber(myNumString);\n```\n\n### 提示\nJavaScript\
  \ 在数值上下文中会自动将这些字符串转换为数字。然而，在实践中，我通常将其转换为数字，比让其具有不确定性要好。\n\n## 布尔值转换\n\n布尔值在数值上下文中会自动转换为数字。`true`\
  \ 变为 `1`，`false` 变为 `0`。在字符串上下文中，`true` 变为“true”，`false` 变为“false”。如果你需要显式地将数字或字符串转换为布尔值，可以使用\
  \ `Boolean()` 函数。\n\n# 练习\n\n| 1. | 声明三个变量——一个数字和两个字符串。数字应该是 `120`，字符串应该是“5150”和“Two\
  \ Thirty”。 |\n| 2. | 创建包含三个数字和两个字符串或单词的数组。 |\n| 3. | 使用 `alert()` 函数显示以下字符串，注意转义：Steve’s\
  \ response was “Cool!”. |\n| 4. | 使用 Firebug 检查你喜欢的三个网站。仔细观察 Firebug 报告的错误。额外：使用\
  \ Internet Explorer 查看这三个网站并使用 Internet Explorer 工具调试错误。 |\n\n# 第 5 章 使用运算符和表达式\n\
  \n**阅读本章后，你将能够：**\n\n* 理解 JavaScript 可用的运算符。\n* 使用 JavaScript 运算符进行数学运算、等性测试、关系测试和赋值。\n\
  * 使用 `void` 运算符通过链接打开新窗口。\n\n## 运算符\n\nECMA-262 规范定义了各种形式的运算符。这些包括：\n\n* 加运算符\n\
  * 乘运算符\n* 位运算符\n* 等等运算符\n* 关系运算符\n* 一元运算符\n* 赋值运算符\n\n运算符既可以用于字面量（例如用于数字 10），也可以用于\
  \ JavaScript 中的变量和其他对象。\n\n## 加运算符\n\n`加运算符` 术语包括加法运算符，这听起来真的像是个误名。但正如我五年级的数学老师提醒我的那样，减法只是带负数的加法。正如你可能猜的那样，加法和减法的运算符分别是\
  \ `+` 和 `–`。以下是它们用法的一些示例。\n\n\n\n\n```\n4 + 5;  // 结果为 9。\nx + y;  // 将 x 和 y 相加。\n\
  5 - 1;  // 结果为 4。\n```\n\n加法运算符的操作方式取决于相加值的类型。当相加两个字符串时，加法运算符会将左侧和右侧的参数连接在一起。当相加的类型不同时，你可能会得到奇怪的结果，因为\
  \ JavaScript 在执行加法（或任何数学运算）之前必须转换其中一种类型。例如，当你认为你有一个数字变量，但 JavaScript 解释器认为你有一个字符串时，你将无法得到预期的结果。以下是一些具体的示例：\n\
  \n```\nvar aNum = 947;\nvar aStr= \"Rush\";\nvar anotherNum = 53;\nvar aStrNum =\
  \ \"43\";\nvar result1 = aNum + aStr;  // result1 将是字符串 \"947Rush\";\nvar result2\
  \ = aNum + anotherNum;  // result2 将是数字 1000;\nvar result3 = aNum + aStrNum;  //\
  \ result3 将是 94743;\n```\n\n正如第 4 章 中过的，在很多情况下，你可以在 JavaScript 中显式地将一种类型更改转换为另一种。看看上一个示例中的变量\
  \ `result3`。你可能希望 `result3` 存储数学表达式 `947+43` 的结果。但由于由 `aStrNum` 表示第二个值是字符串，该表达式会连接这两个值，而不是作为数字相加。然而，使用\
  \ `ToNumber()` 函数可以将 `aStrNum` 转换为数字，这样你就可以在数学表达式（如加法）中按预期使用它。以下是相关的代码，已修正为你可能想要的功能：\n\
  \n```\nvar aNum = 947;\nvar aStrNum = ToNumber(\"43\");\nvar result3 = aNum + aStrNum;\
  \  // result3 将是 990;\n```\n\n# 乘法运算符\n\n与加法运算符一样，乘法运算符的行为正如你预期那样；它们执行乘法和除法。乘法运算符（`*`）将两个数字相乘，而除法运算符（`/`）则将数字相除。这里有一个乘法示例及其输出：\n\
  \n```javascript\njavascript:alert(2 * 2);\n```\n\n![乘法运算符](img/httpatomoreillycomsourcemspimages748662.png.jpg)\n\
  \n乘法运算符包括模运算符，它由百分号（`%`）表示。模运算符产生两个数字除法的余数。例如，4 除以 3 的模是 1，如下段代码所示。\n\n### 注意\n\n\
  这些示例可以在配套内容的文件的 `multiplicativeops.txt` 文件中找到。\n\n```\njavascript:alert(4 % 3);\n\
  ```\n\n结果显示在这里：\n\n![乘法运算符](img/httpatomoreillycomsourcemspimages748664.png.jpg)\n\
  \n# 位运算符\n\n位运算符包括**逻辑与 (AND)**、**逻辑或 (OR)**、**异异 (XOR)**、**非 (NOT)**、**左移 (Shift\
  \ Left)**、**符号右移 (Shift Right With Sign)** 和**零填充右移 (Shift Right With Zero Fill)**。每个运算符由一个或多个字符表示，如表\
  \ 5-1 所示。\n\n表 5-1. 位运算符\n\n| 运算符 | 含义 |\n\n| --- | --- |\n\n| & | AND |\n| &#124;\
  \ | OR |\n| ^ | XOR |\n| ~ | NOT |\n| << | 左移 |\n| >> | 符号右移 |\n| >>> | 零填充右移 |\n\
  \n位运算符的深度涵盖出了本书的范围，尽管我在后面的章节中提到了它们。你可以在 ECMA-262 规范中找到更多关于位运算符的信息。\n\n# 等价运算符\n\n\
  你使用等价运算符来测试两个表达式是否相同。这些运算符始终返回布尔类型：`true` 或 `false`。表 5-2 列出了 JavaScript 的等价运算符。\n\
  \n表 5-2. 等价运算符\n\n| 运算符 | 含义 |\n\n| --- | --- |\n\n| == | 等于 |\n| != | 不等于 |\n|\
  \ === | 使用更严格的方法相等 |\n| !== | 使用更严格的方法不等于 |\n\n如你从表 5-2 所示，你可以通过两种不同的方式来测试等价和不相等。这些方法在严格性上有所不同——即它们在判断两个值是否真正相等时所要求的等价程度不同。两者中更严格的（用三连等号（`===`）表示）不仅要求给定表达式的值相等，还要求类型完全相同。严格测试将确定值为“42”的字符串不等于值为\
  \ `42` 的数字，而较不严格的等价测试则会发现它们是相等的。接下来的示例有助于理解这一点。\n\n## 测试等价运算符\n\n1.  使用 Microsoft\
  \ Visual Studio、Eclipse 或编辑器，编辑配套内容中 Chapter05 示例文件夹中的 `equality.htm` 文件。\n\n2.\
  \  在网页中，将 TO DO 注释替换为此处显示的粗体代码。（在网页中，代码如下所示）\n\n    ```html\n    <!DOCTYPE html>\n\
  \    <html>\n    <head>\n        <title>Equality</title>\n        <script>\n   \
  \         var x = 42;\n            var y = \"42\";\n            if (x == y) {\n\
  \                alert(\"x is equal to y\");\n            } else {\n           \
  \     alert(\"x is not equal to y\");\n            }\n        </script>\n    </head>\n\
  \    <body>\n    </body>\n    </html>\n    ```\n    *(注：此处原文描述与代码块逻辑有出入，翻译已根据逻辑对齐)*\n\
