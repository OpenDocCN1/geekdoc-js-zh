  \ newDiv.attachEvent(\"onmouseout\",function(e) {\n                        e.srcElement.style.background\
  \ = \"#aaabba\"; });\n                } else {\n                    newDiv.addEventListener(\"\
  click\",function () {\n                        document.forms[\"nameform\"].textname.value\
  \ =\n                            this.firstChild.nodeValue; },false);\n        \
  \            newDiv.addEventListener(\"mouseover\",function() {\n              \
  \          this.style.background = \"#FFFFFF\"; },false);\n                    newDiv.addEventListener(\"\
  mouseout\",function() {\n                        this.style.background = \"#aaabba\"\
  ; },false);\n                }\n                newDiv.setAttribute(\"id\",nameList[i]);\n\
  \                newDiv.style.background = \"#aaabba\";\n                newDiv.style.color\
  \ = \"#000000\";\n                newDiv.style.border = \"solid 1px\";\n       \
  \         newDiv.style.display = \"block\";\n                newDiv.style.width\
  \ = \"175px\";\n                newDiv.appendChild(document.createTextNode(nameList[i]));\n\
  \                displayDiv.appendChild(newDiv);\n            }\n        }\n   \
  \ }\n}\n\nvar requestObj = readyAJAX();\nvar url = \"http://YOUR SERVER HERE/statelist.php\"\
  ;\nrequestObj.open(\"GET\",url,true);\nrequestObj.send();\nvar AJAXresponse;\nrequestObj.onreadystatechange\
  \ = function() {\n    if (requestObj.readyState == 4) {\n        if (requestObj.status\
  \ == 200) {\n            AJAXresponse = requestObj.responseText;\n        } else\
  \ {\n            alert(requestObj.statusText);\n        }\n    }\n}\n\nvar textEl\
  \ = document.getElementById(\"textname\");\nEHandler.add(textEl,\"keyup\", function()\
  \ { textSearch(); } );\n\n</script>\n</body>\n</html>\n```\n\n你已经在本书的其他地方看到过示例 20-1.\
  \ 一个搜索应用.）中的大部分代码，但我在这里会再次简要地解释一下。\n\n该代码通过调用外部服务器端文件 `statelist.php` 来获取状态列表。该文件返回一个简单的逗号分隔状态列表，如下所示：\n\
  \n*Alabama,Alaska,Arizona,California,Colorado,Delaware,Florida,Georgia,*...\n\n\
  该文件根据逗号分隔符分割此状态列表，并将名称放入一个名为 `nameList` 的数组中，如下：\n\n```\nvar nameList = AJAXresponse.split(\"\
  ,\");\n```\n\n代码中对你在最后两个章节中看到的应用程序进行了一些扩展，用于创建小型可点击且带有 CSS 样式的下拉框。这些代码位于你在第 19 章.\
  \ AJAX 的魅力 中看到的 `listName()` 函数中。代码在 `listName` 函数中对这些 HTML `DIV` 元素应用了事件监听器和 CSS\
  \ 样式，此处加粗了额外的代码：\n\n```javascript\nfunction listName(text) {\n    var nameList =\
  \ AJAXresponse.split(\",\");\n    var pattern = \"^\" + text;\n    var nameRegexp\
  \ = new RegExp(pattern, \"i\");\n    for (var i = 0; i < nameList.length; i++) {\n\
  \        var existDiv = document.getElementById(nameList[i]);\n        if (! existDiv)\
  \ {\n            if (nameList[i].match(nameRegexp)) {\n                var displayDiv\
  \ = document.getElementById(\"data\");\n                var newDiv = document.createElement(\"\
  div\");\n                if (window.attachEvent) {\n                    newDiv.attachEvent(\"\
  onclick\",function(e) {\n                        document.forms[\"nameform\"].textname.value\
  \ =\n                            e.srcElement.firstChild.nodeValue;});\n       \
  \             newDiv.attachEvent(\"onmouseover\",function(e) {\n               \
  \         e.srcElement.style.background = \"#FFFFFF\"; });\n                   \
  \ newDiv.attachEvent(\"onmouseout\",function(e) {\n                        e.srcElement.style.background\
  \ = \"#aaabba\"; });\n                } else {\n                    newDiv.addEventListener(\"\
  click\",function () {\n                        document.forms[\"nameform\"].textname.value\
  \ =\n                            this.firstChild.nodeValue; },false);\n        \
  \            newDiv.addEventListener(\"mouseover\",function() {\n              \
  \          this.style.background = \"#FFFFFF\"; },false);\n                    newDiv.addEventListener(\"\
  mouseout\",function() {\n                        this.style.background = \"#aaabba\"\
  ; },false);\n                }\n                newDiv.setAttribute(\"id\",nameList[i]);\n\
  \                newDiv.style.background = \"#aaabba\";\n                newDiv.style.color\
  \ = \"#000000\";\n                newDiv.style.border = \"solid 1px\";\n       \
  \         newDiv.style.display = \"block\";\n                newDiv.style.width\
  \ = \"175px\";\n                newDiv.appendChild(document.createTextNode(nameList[i]));\n\
  \                displayDiv.appendChild(newDiv);\n            }\n        }\n   \
  \ }\n}\n```\n\n# 接收用户输入与 AJAX\n\n开发 AJAX 应用的下一个逻辑步骤是接受用户输入并对这些输入进行处理。构建 AJAX 应用的核心在于根据用户操作提供高度交互的应用程序。遗憾的是，为了彻底介绍这个主题，我需要深入探讨处理这些输入的服务器端应用程序创建，而这超出了本初级书籍的范围（本书主要关注\
  \ JavaScript）。如果运气的话，我会写另一本关于中级 JavaScript 或构建 JavaScript 应用的书中，以展示 AJAX 的 JavaScript\
  \ 部分和服务器部分。\n\n但我希望，即使涵盖有限，我仍然能够传达：构建 AJAX 应用本质上只是为访问者提供友好的交互式使用应用程序的方式，而任务的很大一部分涉及\
  \ JavaScript 的设计，而不仅仅是 `XMLHttpRequest`。`XMLHttpRequest` 对象仅仅是将数据引入程序的载体或交付机制。`XMLHttpRequest`\
  \ 运行的层远低于构建页面的表现层。因此，用户永远看不到后台运行的 `XMLHttpRequest` 处理；他们看到的只有你在前端创建的设计。\n\n\n\n\
  本书剩下的两个章节将基于你目前为止所学的一切内容，但它们将在 `jQuery` JavaScript 库的帮助下完成。\n\n# 练习\n\n| 1. | 为本章所示的状态示例创建一个\
  \ `submit` 事件处理器，使得当用户提交表单时，提交的状态会显示给用户看。 |\n| 2. | 创建一个使用 `XMLHttpRequest` 返回名称列表的应用程序（例如员工目录）。你可以使用纯文本或\
  \ XML 作为源数据。 |\n\n# 第五部分.jQuery\n\n# 第 21 节.JavaScript 库和框架简介\n\n**读完本章后，你将能够：**\n\
  \n*   理解 JavaScript 编程库和框架的作用。\n*   理解如何定义你自己的库。\n*   理解第三方 JavaScript 库和框架的作用，以及如何查找有关它们的更多信息。\n\
  \n## 了解编程库\n\n在编程术语中，`library`（库）是提供常见或额外功能的代码分组。通常情况下，库由一个或多个暴露对象和函数的文件组成。在程序中，开发者包含或调用该库以使用这些额外的对象和函数。通过这种方式，JavaScript\
  \ 库和框架是有用的，因为它们分担了额外及增强功能的维护和开发工作。它们帮助让常见的编程任务变得更容易，还可以帮助平滑跨浏览器开发中的差异和细微差别。\n\n\
  本章将探索 JavaScript 中的库，包括定义你自己的库的过程，并查看一些现有的较流行的 JavaScript 库和框架。\n\n# 定义你自己的 JavaScript\
  \ 库\n\n在任何语言中工作的开发者都会发现，自己在许多编码任务中反复执行常见函数，因此创建一个个人库（或常见函数分组），并在未来的项目中使用这些函数，是很有帮助的。\n\
  \n在 第 11 章 中 开发的事件处理器脚本 `ehandler.js` 显示了如何通过为其创建一个命名空间来创建一个库：\n\n```\nvar EHandler\
  \ = {};\n```\n\n在该命名空间内，`EHandler` 库添加了两个函数。这是第一个：\n\n```\nEHandler.add = ...\n\
  ```\n\n这是第二个：\n\n```\nEHandler.remove = ...\n```\n\n尽管 `EHandler` 很短，但它是一个真正的库。正如你所见，库并不一定很大才用。你在本书的早些部分已经看到了许多使用\
  \ `EHandler` 的示例。考虑到 `EHandler` 库的概念，在接下来的示例中，你将创建你自己的库。\n\n## 创建库\n\n1.  使用 Microsoft\
  \ Visual Studio、Eclipse 或你选择的编辑器打开 `library.js` 文件，你可以在本书的配套内容的第 21 文件夹中找到该文件。\n\
  2.  在 `library.js` 中，添加以下代码（替换 TODO 注释）来创建一个命名空间，然后添加一个函数：\n\n    ```\n    var MyLibrary\
  \ = {};\n\n    MyLibrary.sendAlert = function(mesg, elm) {\n            alert(mesg);\n\
  \    };\n    ```\n\n3.  保存并关闭文件。\n4.  打开文件 `librarypage.htm`。在 `librarypage.htm`\
  \ 中，添加此处显示的加粗代码（替换 TODO 注释）：\n\n    ```html\n    <!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01//EN\" \"http://www.w.org/TR/html4/strict.\n    dtd\">\n    <html>\n\
  \    <head>\n    <title>A Basic Example</title>\n    <script type=\"text/javascript\"\
  \ src=\"library.js\"></script>\n    </head>\n    <body>\n    <script type=\"text/javascript\"\
  >\n    MyLibrary.sendAlert(\"hello, this is the message\");\n    </script>\n   \
  \ </body>\n    </</html>\n    ```\n\n5.  在网络浏览器中加载页面 `librarypage.htm`。你应该收到一个像这样的这样的提示框：\n\
  \n    ![创建库](img/httpsatomoreillycomsourcemspimages748953.png.jpg)\n\n### 故障排除\n\
  \n如果你没有收到像刚才那样的提示，请确保你正确指定了 `library.js` 文件的路径。前面的 `librarypage.htm` 代码假设 JavaScript\
  \ 文件 `library.js` 与 HTML 文件在同一目录中。\n\n在定义和使用你自己的库时要小心，避免与现有函数以及 ECMA-262 规范中的保留字重叠或冲突。此外，如果你使用外部库或框架（如\
  \ `jQuery` 或 `YUI`），你需要确保你的库不会与这些库使用的命名约定冲突。\n\n# 查看流行的 JavaScript 库和框架\n\n有许多公开的\
  \ JavaScript 库和框架。它们的目标是将困难的任务变得对开发以 JavaScript 为中心的 Web 应用程序的程序员更容易。\n\nWeb 开发者花费大量时间尝试让页面在不同浏览器中看起来和运行相同。使用许多\
  \ JavaScript 库或框架的一个显著优势是它们消除了跨浏览器兼容性的烦恼。所有流行的 JavaScript 库和框架都包含了代码，使其各自的功能能够在它们支持的所有浏览器中正常工作。\n\
  \n## jQuery\n\njQuery 提供了丰富的特性集、强大的选项、扩展性和卓越的社区支持。使用包含在单个 JavaScript 文件中的 `jQuery`，你可以为网页添加效果、增强可用性，并让使用\
  \ AJAX 处理数据变得更简单。此外，微软随 Visual Studio 2010 配带了 `jQuery`。第 22 章和第 23 章更详细地介绍了 `jQuery`。你可以在\
  \ http://jquery.com 找到有关 `jQuery` 的更多信息。\n\n## Yahoo! Interface\n\nYahoo! Interface\
  \ (`YUI`) 同时提供 JavaScript 和层样式表 (`CSS`)，这简化了 Web 应用程序的开发。像 `jQuery` 一样，`YUI` 包含了增强可用性和改进\
  \ Web 应用程序的功能。作为一个额外奖励，`YUI` 的文档非常出色。你可以在 http://developer.yahoo.com/yui/ 找到有关 `YUI`\
  \ 的更多信息。\n\n## MooTools\n\nMooTools 是一个非常小且优化的 JavaScript 库。MooTools 与 `YUI` 和 `jQuery`\
  \ 的区别在于它专注于优化 JavaScript，而 `YUI` 和 `jQuery` 专注于效果和直接的用户体验交互。这并不是说 `MooTools` 没有效果——MooTools\
  \ 也提供了许多你在 `YUI` 和 `jQuery` 中发现的相同效果（例如手风琴和滑块）。建议中高级 JavaScript 程序员使用 MooTools，并可以在\
  \ http://mootools.net/ 获取。\n\n## 其他库\n\n有许多其他的 JavaScript 库和框架——多到无法在书中全部提及。作为起点，可以访问\
  \ http://en.wikipedia.org/wiki/Comparison_of_JavaScript_frameworks 了解更多关于 JavaScript\
  \ 框架的信息。\n\n# 练习\n\n| 1. | 检查本章所示的每个库和框架。你认为哪个对新手 JavaScript 程序员来说容易学习？为什么？ |\n\
  | 2. | 使用外部 JavaScript 文件创建你自己的 JavaScript 库。将该文件引入 HTML 页面并调用它。 |\n\n# 第 22 节.jQuery\
  \ 简介\n\n**读完本章后，你将能够：**\n\n*   理解如何在 HTML 中引入 jQuery。\n*   理解重要的 jQuery 概念和语法。\n\
  *   使用 jQuery 开发你的网页。\n\n# jQuery 入门\n\njQuery 是一个流行且简单的 JavaScript 框架。jQuery 让困难的\
  \ JavaScript 任务变得简单，通常通过消除跨浏览器 JavaScript 的痛苦来实现。\n\n\n\n\n整个 jQuery 库仅包含一个 JavaScript\
  \ 文件，这使得在 JavaScript 中引入它变得非常简单。jQuery 语法也很容易学习；它使用了简单的命名空间和一致的功能。结合 jQuery 用户界面\
  \ (UI) 插件（在第 23 章 中介绍）一起使用，你可以创建强大且高度交互的 Web 应用程序。\n\n本章将介绍 jQuery，包括如何下载以及如何在 JavaScript\
  \ 中使用它。\n\n## 使用 jQuery\n\n你可以从 [`www.jquery.com/`](http://www.jquery.com/) 获取 jQuery。在本节中，你将看到如何下载\
  \ jQuery 并将其集成到网页中。\n\n## 两种 jQuery 下载方式\n\n在 jQuery 首页上，有两种下载版本：生产版本和开发版本。除非你计划开发\
  \ jQuery 插件，或者需要查看 jQuery 的内部实现，否则你应该下载并使用压缩后的生产版本。\n\n作为另一个可行的方案（特别是在学习本章内容时），你可以使用内容分发网络（CDN）访问托管版本的\
  \ jQuery。Google 通过其 API 网站托管 jQuery 以及其他库。这意味着你可以在你的网页和 JavaScript 程序中包含 jQuery，而无需在自己的服务器上本地托管该文件。更多信息请参见\
  \ [`code.google.com/apis/libraries/devguide.html`](http://code.google.com/apis/libraries/devguide.html)。\n\
  \n### 注意事项\n\n对于你使用 jQuery 的几乎所有场景，我都建议下载并在本地托管 jQuery 文件。使用本地版本可以比使用 CDN 版本更快、更可靠。例如，如果你使用\
  \ CDN 托管的版本，而 CDN 服务器宕机了，那么你网站上任何使用该库的内容都将无法工作！然而，对于本章中的开发任务，使用 CDN 托管的文件是完全可以的。\n\
  \n完成本章的练习并跟随步骤需要你已经将 jQuery 下载到本地开发计算机上，或者通过 CDN 连接到它。\n\n## 引入 jQuery\n\n你在网页中引入\
  \ jQuery 的方式与任何其他外部 JavaScript 文件相同——使用一个指向源文件的 `<script>` 标签。请参考示例 22-1 中的代码。\n\
  \n示例 22-1. 在网页中引入 jQuery。\n\n```\n<!DOCTYPE HTML PUBLIC  \"-//W3C//DTD HTML 4.01//EN\"\
  \  \"http://www.w3.org/TR/html4/\nstrict.dtd\">\n<html\n<head>\n<title>Adding jQuery</title>\n\
  <script type=\"text/javascript\" src=\"jquery-1.4.3.min.js\"></script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n现在，你已经下载了 jQuery 或从 CDN 站点引用了它，并且查看了上一个关于如何在文件中引入\
  \ jQuery 的示例，现在是时候学习 jQuery 语法了。\n\n### 重要提示\n\n截至本书编写，版本 1.4.3 是最新版本。然而，当你读到这里时，该版本几乎肯定已经不同，因此你需要根据下载的\
  \ jQuery 脚本版本适当更改 `src` 属性。\n\n## jQuery 语法\n\n当你在页面中引入 jQuery 库时，jQuery 会添加一个名为\
  \ `jquery()` 的函数。你可能认为你会通过这个 `jquery()` 函数接口调用所有 jQuery 函数，但对 `jquery()` 函数有一个快捷方式：`$()`。与其其每次都输入\
  \ `jquery`，你不如使用美元符号加括号来访问 jQuery 库，如表 22-1 所示。\n\n表 22-1. 几个 jQuery 选择器\n\n| 语法\
  \ | 描述 |\n| --- | --- |\n| `$(\"a\")` | 文档中所有的 `<a>` 元素。 |\n| `$(document)` | 整个文档，经常用于访问本章后面所示的\
  \ `ready()` 函数。 |\n| `$((\"#elementID\")` | ID 为 `elementID` 的元素。 |\n| `$((\".className\"\
  )` | 具有 `className` 类的元素或多个元素。 |\n\n你将在本章后面看到更多选择器和相关函数。\n\n与 JavaScript 代码一样，jQuery\
  \ 语句应该以分号结束。值得注意的是，你可以在 jQuery 中使用单引号或双引号作为选择器。例如，以下两个语句都是同样有效的：\n\n```\n$(\"a\"\
  )\n\n$('a')\n```\n\n当你在现实世界中看到 jQuery 使用示例时（并不是说这本书不在现实世界中），单引号和双引号都会被使用。本章中的示例混合使用了这两种，以便让你熟悉这两种情况；然而，在你的实际编程中，最好选择一种风格并坚持下去。\n\
  \n## 将 jQuery 连接到加载事件\n\n使用 jQuery 的最常见方法之一是在页面的 `load`（或 `onload`）事件期间连接元素。（本章稍后会更详细地讨论事件和函数。）在\
  \ jQuery 中，你通过元素的 `.ready()` 实用函数来实现。\n\n回想上一节所示的简短示例，jQuery 使用 `$()` 语法访问元素。记住这一点，你可以像这样访问文档元素：\n\
  \n```\n$(document)\n```\n\n然后你可以像这样访问 `ready()` 函数：\n\n```\n$(document).ready()\n\
  ```\n\n接下来的练习要求你要么已经将 jQuery 下载到本地开发计算机上，或者你使用 CDN。示例显示的是 1.4.3 版本的 jQuery，但当你执行练习时，该版本号可能会不同。\n\
  \n### 使用 Document Ready\n\n1.  使用 Microsoft Visual Studio、Eclipse 或其他编辑器，编辑 Chapter22\
  \ 示例文件夹（在配套内容中）中的 `docready.html` 文件。\n\n2.  在该文件中，用加粗显示的以下代码替换 TODO 注释：\n\n   \
  \ ```\n    <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n    \"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n    <html>\n    <head>\n    <title>Document Ready</title>\n    <script type=\"\
  text/javascript\" src=\"jquery-1.4.3.min.js\"></script>\n    </head>\n    <body>\n\
  \    <script type=\"text/javascript\">\n    $(document).ready(alert('hi'));\n  \
  \  </script>\n    </body>\n    </html>\n    ```\n\n3.  保存文件并在网页浏览器中查看该页面。你将看到一个像所示的警报框：\n\
  \n    ![Using Document Ready](img/httpatomoreillycomsourcemspimages748955.png.jpg)\n\
  \n这个步进式练习中的代码通过 `$(document).ready()` 函数结合了 jQuery，同时也结合了普通的、原始的 JavaScript（在本示例中由\
  \ `alert()` 函数表示）。这种 jQuery 和 JavaScript 的混合是一个重要的理解概念：你使用 jQuery 来补充普通的 JavaScript。jQuery\
  \ 让许多困难且有时单调的任务变得简单——事实上，简单到以至于你可以花时间构建功能，而不是担心跨浏览器兼容的细微差别。\n\n`$(document).ready()`\
  \ 函数消除了你使用浏览器的 `load` 事件或在 `load` 事件中插入函数调用的需求。通过 `$(document).ready()`，所有的文档对象模型\
  \ (DOM) 元素在 `.ready()` 函数执行之前都是可用的。\n\n### 提示\n\n`$(document).ready()` 函数是你使用 jQuery\
  \ 进行的许多编程的核心。\n\n# 使用选择器\n\n选择器是操作 jQuery 和 DOM 的关键。你使用选择器来识别和分组执行 jQuery 函数的元素。如表\
  \ 22-1 所示，你使用选择器来收集所有特定标签、特定 ID 或具有特定类别的元素。你也可以以更强大的方式使用选择器，例如选择指定数量的元素；或者只选择具有特定祖先关系的元素，例如只选择跟在\
  \ `<div>` 标签之后的 `<p>` 标签。本节将更详细地介绍选择器。\n\n### 提示\n\n\n\n\n\n`Selectors` 及其在 jQuery\
  \ 中的工作原理基于 CSS 选择器。如果你已经习惯了在 CSS 中使用它们（在第 15 章 中讨论过），那么你会觉得这个模型非常熟悉。\n\n## 通过 ID\
  \ 选择元素\n\n表 22-1 中的示例显示了通过 ID 属性选择元素的通用语法：\n\n```\n$(\"#elementID\")\n```\n\n例如，考虑这段\
  \ HTML 代码：\n\n```\n<a href=\"#\" id=\"linkOne\">Link</a>\n```\n\n使用普通的 JavaScript，你如下所示访问该元素：\n\
  \n```\ngetElementById(\"linkOne\")\n```\n\n使用 jQuery，你通过以下代码访问该元素：\n\n```\n$(\"\
  #linkOne\")\n```\n\n## 通过 Class 选择元素\n\n你通过在类名前前加上点（`.`）来按类选择元素。语法如下：\n\n```\n$(\"\
  .className\")\n```\n\n例如，这里有一个应用了类的 div：\n\n```\n<div class=\"specialClass\">\n\
  ```\n\n你通过 jQuery 这样访问该元素：\n\n```\n$(\".specialClass\")\n```\n\n请记住，你访问的可能不是单个元素；类选择器会访问*所有*应用了指定类的元素。也就是说，如果页面上有多个元素应用了“specialClass”类，jQuery\
  \ 将使用 `$((\".special-Class\")` 选择器访问所有它们。稍后在处理通过此类选择器获取的每个元素的函数时，你会看到更多内容。\n\n##\
  \ 通过类型选择元素\n\n你也可以使用选择器按类型访问元素，例如所有的 `<div>` 元素、所有的 `<a>` 元素等。例如，你可以如下访问文档中所有的 `<div>`\
  \ 元素：\n\n```\n$('div')\n```\n\n同样，要访问所有的 `<a>` 元素，你会写：\n\n```\n$('a')\n```\n\n使用类型选择器可以访问页面上指定类型的所有元素。与类选择器一样，类型选择器可以返回多个元素。\n\
  \n## 通过层级选择元素\n\n如前，你可以根据元素相对于页面上其他元素的位置来选择元素。例如，要选择所有 `<div>` 元素内的 `<a>` 元素，你使用以下语法：\n\
  \n```\n$(\"div a\")\n```\n\n你也可以做得更具体。例如，如果你想获取所有跟在特定 div 之后的锚点，可以将类型选择器与 ID 选择器语法结合。考虑这段\
  \ HTML：\n\n```\n<div id=\"leftNav\">\n<a href=\"link1.html\">Link 1</a>\n<a href=\"\
  link2.html\">Link 2</a>\n</div>\n```\n\n以下是获取 `leftNav` div 内部两个锚点元素的 jQuery 选择器语法：\n\
  \n```\n$(\"#leftNav a\")\n```\n\n更通用的做法是，如果你只需要元素的直接后代，请使用大于号：\n\n```\n$(\"div >\
  \ p\")\n```\n\n此语法会产生所有作为 `div` 的直接后代的 `<p>` 元素，但不包含任何在选定 `<p>` 元素内部的 `<p>` 元素。\n\
  \n你还可以使用 `*:nth-child()` 选择器选择集合中的第 *n* 个元素。此示例选择了第三个子元素：\n\n```\n$(\"p:nth-child(3)\"\
  )\n```\n\n还存在其他层级选择器。你可以在 jQuery 选择器参考文档中找到更多内容：[`api.jquery.com/category/selectors/`](http://api.jquery.com/category/selectors/)。\n\
  \n## 通过位置选择元素\n\n正如你看到的，jQuery 中的选择器是贪婪的。例如，`$('a')` 语法选择了所有锚标签。jQuery 提供了几种方法来选择组内更特定的元素。其中一种方法是使用\
  \ `first` 和 `last` 选择器。以下代码选择了页面中的第一个 `<p>`：\n\n```\n$(\"p:first\")\n```\n\n同样，选择最后一个元素的方法如下：\n\
  \n```\n$(\"p:last\")\n```\n\n你也可以通过元素的直接位置选择元素。作为另一个例子，考虑这段 HTML：\n\n```\n<p>First\
  \ P</p>\n<p>Second P</p>\n<p>Third P</p>\n```\n\n要选择第二个 `<p>` 元素，你使用这种语法：\n\n```\n\
  $(\"p\")[1]\n```\n\n注意，对于这种类型的选择器，数组索引从 0 开始，因此第一个元素的索引为 0，第二个为索引 1，以此类推。使用这种语法有一有点危险，因为它依赖于元素在层级结构中的严格位置。如果有人在你尝试选择的元素之前在页面上添加了另一个\
  \ `<p>` 标签，添加的操作会导致数组索引发生，从而使选择器选择错误的元素。可能的情况下，使用 ID 选择器选择单个或特定元素比依赖于元素的位置更好。\n\n\
  通过索引选择的另一种替代方法是使用 `*:eq` 语法。例如，要选择第三段落，你可以写：\n\n```\n$(\"p:eq(3)\")\n```\n\n最后，另一组有时很有用的位置选择器是\
  \ `even` 和 `odd`，它们选择集合中的每隔元素：\n\n```\n$(\"p:even\")\n```\n\n在处理表格数据以交替行颜色时，`even`\
  \ 和 `odd` 选择器非常有用。示例 22-2 了一个了一个示例，该示例使用 `odd` 选择器来区分表格中交替行的背景颜色。\n\n### 注意\n\n\
  示例 22-2 中的代码使用了两个尚未正式介绍的项目：用户自定义函数和 `.css()` 函数。现在不用担心这些。你将在本章稍后部分更详细地检查这些项目。\n\n\
  示例 22-2. 表格数据和 jQuery。\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \  \"http://www.w3.org/TR/html4/strict.\ndtd\">\n<html>\n<head>\n<title>Table Test</title>\n\
  <script type=\"text/javascript\" src=\"jquery-1.4.2.min.js\"></script>\n</head>\n\
  <body>\n<table>\n  <tr>\n    <td>Row 1 Column 1 of the table</td>\n    <td>Row 1\
  \ Column 2 of the table</td>\n  </tr>\n  <tr>\n    <td>Row 2 Column 1 of the table</td>\n\
  \    <td>Row 2 Column 2 of the table</td>\n  </tr>\n  <tr>\n    <td>Row 3 Column\
  \ 1 of the table</td>\n    <td>Row 3 Column 2 of the table</td>\n  </tr>\n  <tr>\n\
  \    <td>Row 4 Column 1 of the table</td>\n    <td>Row 4 Column 2 of the table</td>\n\
  \  </tr>\n  <tr>\n    <td>Row 5 Column 1 of the table</td>\n    <td>Row 5 Column\
  \ 2 of the table</td>\n  </tr>\n  <tr>\n    <td>Row 6 Column 1 of the table</td>\n\
  \    <td>Row 6 Column 2 of the table</td>\n  </tr>\n</table>\n<script type=\"text/javascript\"\
  >\n$(document).ready(function() {\n    $('tr:odd').css(\"background-color\", \"\
  #abacab\");\n});\n</script>\n\n</body>\n</html>\n```\n\n此代码的主要部分位于 HTML 体内的 JavaScript\
  \ 部分：\n\n```javascript\n$(document).ready(function() {\n    $('tr:odd').css(\"background-color\"\
  , \"#abacab\");\n});\n```\n\n该代码使用 `$(document).ready()` 函数结合 `*:odd` 选择器将背景颜色设置为十六进制\
  \ `#abacab` ——一种浅灰色。图 22-1 展示了输出的示例。\n\n![A table colorized with the help of jQuery.](img/httpatomoreillycomsourcemspimages748957.png.jpg)\n\
  \n图 22-1. 在 jQuery 帮助下着色的表格。\n\n*你已经看到了一些最常见的位置选择器，但还有更多位置选择器可用。更多信息请参阅 [`api.jquery.com/category/selectors/`](http://api.jquery.com/category/selectors/)。*\n\
  \n## 通过属性选择元素\n\n正如你从已经过的类选择器所料的那样，jQuery 允许你选择包含某些属性的元素，或者包含特定属性值的元素。例如，要选择所有具有\
  \ `alt` 属性的图像，你写道：\n\n```\n$(\"img[alt]\")\n```\n\n选择仅 `alt` 属性设置为特定值的图像如下所示：\n\n\
  ```\n$(\"img[alt='alternate text']\")\n```\n\n\n\n\n前面的代码仅当 `alt` 文本为单词 `alternate\
  \ text` 时才选择图像。请注意在本示例中交替使用了单引号和双引号。该选择器被包裹在双引号中，而内部的 `alt` 属性选择器被包裹在单引号中，但示例也可以同样容易地反过来写，即在\
  \ `img` 选择器上使用单引号，在 `alt` 属性选择器上使用双引号：\n\n```\n$('img[alt=\"alternate text\"]')\n\
  ```\n\n你也可以对两者都使用相同的引号方案，但如果你这样做这样做，你就需要对内部的引号进行转义，如下所示：\n\n```\n$(\"img[alt=\\\"\
  alternate text\\\"]\")\n```\n\n需要注意的是，这种类型的选择器期望精确匹配。在这个示例中，`alt` 属性必须是字符串 `“alternate\
  \ text”`。它的任何变体，例如 `“alternate text 2”` 或 `“alternate text”`，都无法匹配。\n\njQuery 包含了通配符选择器，它们不需要对属性进行精确匹配。请参考表\
  \ 22-2 中的示例。\n\n表 22-2. 属性选择器匹配\n\n| 语法 | 描述 |\n| --- | --- |\n| `attribute*=value`\
  \ | 选择包含该属性的元素，该属性的值包含指定的值作为子字符串。 |\n| `attribute~=value` | 选择包含该属性的元素，该属性的值包含指定的值作为一个完整的单词。\
  \ |\n| `attribute!=value` | 选择不包含该属性的元素，或者属性值不匹配指定值的元素。 |\n| `attribute$=value`\
  \ | 选择包含指定属性的元素，该属性的值以指定的字符串结尾。 |\n| `attribute^=value` | 选择包含该属性的元素，该属性的值以指定的字符串开头。\
  \ |\n\n## 选择表单元素\n\njQuery 包含了与 Web 表单相关的原生选择器。表 22-3 列出了其中一些选择器，其中一些选择器将在本章的剩余部分中使用。\n\
  \n表 22-3. 与表单相关的选择器\n\n| 选择器 | 描述 |\n| --- | --- |\n| `*:checkbox` | 选择所有复选框 |\n\
  | `*:checked` | 选择所有已选中的元素，例如复选框 |\n| `*:input` | 选择页面上所有的 input 元素 |\n| `*:password`\
  \ | 选择所有密码输入框 |\n| `*:radio` | 选择所有单选按钮输入 |\n| `*:reset` | 选择所有重置类型的输入框 |\n| `*:selected`\
  \ | 选择所有当前被选中的元素 |\n| `*:submit` | 选择所有提交类型的输入框 |\n| `*:text` | 选择所有文本类型的输入框 |\n\
  \n## 更多选择器\n\njQuery 中还有许多其他选择器，例如选择所有隐藏元素 `(:hidden)` 或所有可见元素 `(:visible)` 的选择器，以及启用元素、禁用元素等。请参阅\
  \ [`api.jquery.com/category/selectors/`](http://api.jquery.com/category/selectors/)\
  \ 以获取 jQuery 完整且最新的选择器列表。\n\n### 提示\n\n与其设计一种复杂且脆弱的选择器语法来获取特定元素，不如参考 jQuery 选择器参考\
  \ [`api.jquery.com/category/selectors/`](http://api.jquery.com/category/selectors/)\
  \ 看看是否已经有人解决了该选择器问题。\n\n# 函数\n\n到为止，你已经看到了许多使用 jQuery 选择元素的示例，但只有少数示例展示了在选择元素后可以对它们进行什么。jQuery\
  \ 使用函数对选定的元素执行操作。函数可以是 jQuery 内置的，也可以是用户定义的。你几乎总是同时使用两者。\n\n## 遍历 DOM\n\n使用 JavaScript\
  \ 以及现在使用 jQuery 进行 Web 编程的本质通常需要循环或迭代多个元素——例如，`each()` 函数接收选定的元素列表并遍历每一个元素，在循环列表时对每个元素执行操作（或什么都不做）。jQuery\
  \ 包含了许多用于循环和迭代的函数。这个过程在 jQuery 术语中被称为 `traversing`遍历。你可以在 [`api.jquery.com/category/traversing/`](http://api.jquery.com/category/traversing/)\
  \ 找到更多关于遍历相关函数的信息。\n\n在使用遍历函数时，你几乎总是配合用户定义的包装函数以及 `$(this)` 选择器完成的。就像面向对象编程中的 `this`\
  \ 关键字一样，`$(this)` 选择器指的是当前对象——在这种情况下，就是当前正在被遍历的项。\n\n这里有一个示例可能很有用。以下 HTML 构建了一个虚拟排球联赛的积分榜页面：\n\
  \n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"  \"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>Iteration Test</title>\n<script type=\"text/javascript\"\
  \ src=\"jquery-1.4.2.min.js\"></script>\n</head>\n<body>\n<table>\n  <th>团队名称</th>\n\
  \  <th>胜负战绩</th>\n  <th>胜率</th>\n  <tr>\n    <td>团队 1</td>\n    <td>12-8</td>\n\
  \    <td>60%</td>\n  </tr>\n  <tr>\n    <td>团队 5</td>\n    <td>11-9</td>\n    <td>55%</td>\n\
  \  </tr>\n  <tr>\n    <td>团队 4</td>\n    <td>10-10</td>\n    <td>50%</td>\n  </tr>\n\
  \  <tr>\n    <td>团队 2</td>\n    <td>9-11</td>\n    <td>45%</td>\n  </tr>\n  <tr>\n\
  \    <td>团队 6</td>\n    <td>6-14</td>\n    <td>30%</td>\n  </tr>\n  <tr>\n    <td>团队\
  \ 3</td>\n    <td>2-18</td>\n    <td>10%</td>\n  </tr>\n</table>\n<script type=\"\
  text/javascript\">\n$(document).ready(function() {\n    $('tr:odd').css(\"background-color\"\
  , \"#abacab\");\n});\n</script>\n\n</body>\n</html>\n```\n\n在浏览器中查看时，该页面类似于图 22-2。\n\
  \n![虚拟排球联赛的积分榜。](img/httpatomoreillycomsourspimages748959.png.jpg)\n\n图 22-2. 虚拟排球联赛的积分榜。\n\
  \n此示例遍历了所有包含 `percentage` 类属性的元素——该 `class` 应用于胜率列的单元格中。对于任何胜率在或超过 .500（意味着他们至少赢得了一场比赛）的团队，此示例会对其字段应用粗体字体。你可以通过以下\
  \ jQuery 代码来实现，将其添加到页面中已有的其他 jQuery 代码下方：\n\n```\n$('.percentage').each(function()\
  \ {\n    if ($(this).text() >= .5) {\n        $(this).css('font-weight', 'bold');\n\
  \    }\n});\n```\n\n\n\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \  \"http://www.w3.org/TR/html4/strict.\ndtd\">\n<html>\n<head>\n<title>迭代测试</title>\n\
  <script type=\"text/javascript\" src=\"jquery-1.4.2.min.js\"></script>\n</head>\n\
  <body>\n<table>\n  <th>团队名称</th>\n  <th>胜-负记录</th>\n  <th>胜率</th>\n  <tr>\n    <td>团队\
  \ 1</td>\n    <td>12-8</td>\n    <td class=\"percentage\">.600</td>\n  </tr>\n \
  \ <tr>\n    <td>团队 5</td>\n    <td>11-9</td>\n    <td class=\"percentage\">.550</td>\n\
  \  </tr>\n  <tr>\n    <td>团队 4</td>\n    <td>10-10</td>\n    <td class=\"percentage\"\
  >.500</td>\n  </tr>\n  <tr>\n    <td>团队 2</td>\n    <td>9-11</td>\n    <td class=\"\
  percentage\">.450</td>\n  </tr>\n  <tr>\n    <td>团队 6</td>\n    <td>6-14</td>\n\
  \    <td class=\"percentage\">.300</td>\n  </tr>\n  <tr>\n    <td>团队 3</td>\n  \
  \  <td>2-18</td>\n    <td class=\"percentage\">.100</td>\n  </tr>\n</table>\n<script\
  \ type=\"text/javascript\">\n$(document).ready(function() {\n    $('tr:odd').css(\"\
  background-color\", \"#abacab\");\n    $('.percentage').each(function() {\n    \
  \    if ($(this).text() >= .5) {\n            $(this).css('font-weight', 'bold');\n\
  \        }\n    });\n});\n</script>\n\n</body>\n</html>\n```\n\n当你在浏览器中查看此页面时，你会发现对于那些赢了至少一半比赛的团队，“胜率”列现在已**加粗**，如图\
  \ 22-3 所示。\n\n![在 jQuery 的帮助下，胜率列已加粗。](img/httpatomoreillycomsourcemspimages748961.png.jpg)\n\
  \n图 22-3. 在 jQuery 的帮助下，胜率列已加粗。\n\n查看图 22-3 的输出，你会发现如果能将加粗字体权重应用于整个表格行，而不仅仅是应用到“胜率”列，效果会更好。这样做似乎很困难，因为从逻辑上讲，在应用测试以查找胜率时，代码已经跳过了该\
  \ HTML 表格行。幸运的是，jQuery 有一个函数可以提供帮助：`parent()` 函数。（实际上，有几种方法可以实现这一点。`parent()` 函数只是其中一种方法。）\n\
  \n应用 `parent()` 函数本质上是向上 DOM 树移动，找到封装此特定 `<td>` 元素的 `<tr>` 标签。通过对 `<tr>` 元素应用 CSS\
  \ 样式更改，可以让整行加粗。新代码如下，更改部分已用粗体标出：\n\n```javascript\n$('.percentage').each(function()\
  \ {\n    if ($(this).text() >= .5) {\n        $(this).parent().css('font-weight',\
  \ 'bold');\n    }\n});\n```\n\n当将其添加到来自示例 22-3 的代码中，输出将与图 22-4 所示类似。\n\n![在表格行级应用\
  \ CSS 样式。](img/httpatomoreillycomsourcemspimages748963.png.jpg)\n\n图 22-4. 在表格行级应用\
  \ CSS 样式。\n\n### 注意\n\n此修订后的代码可见配套内容中的 `listing22-4.html` 文件。\n\n使用 `parent()` 函数引入了一个名为“链式调用”（chaining）的新概念。*链式调用*是\
  \ jQuery 中一种强大的结构，因为它允许额外的层级选择以及多级函数应用。在这个示例中，`$(this)` 选择器被链到 `parent()` 函数上，该函数进一步选择了\
  \ `$(this)` 的父元素。只有这样，代码才会执行 `css()` 函数。\n\n链式调用的强大性也带来了一点危险。你可能会通过链式调用编写出难以阅读和维护的代码。此外，当链式选择器中的元素发生变化时，链式调用可能会创建脆弱的代码。链式调用是强大的——但也需要谨慎。\n\
  \n\n\n\n有时，你需要在另一个函数或函数的一部分完成后运行一个函数，这种结构被称为`回调函数`（callback function）。回调函数会在其父函数完成后执行。jQuery\
  \ 大量使用回调函数，特别是在 AJAX 中。在你在使用 `each()` 函数进行迭代时，你已经看到过回调函数的示例了。\n\n有关关于回调函数的更多信息，请参阅\
  \ [`docs.jquery.com/Tutorials:How_jQuery_Works`](http://docs.jquery.com/Tutorials:How_jQuery_Works)。\n\
  \n在本章的剩余内容中，你将看到更多回调函数的示例。对于初学者或中级 JavaScript 程序员来说，重要的是不要 `over`（过度）思考回调函数。它们仅仅是在另一个函数内部被调用的代码组。\n\
  \n## 事件\n\n你现在已经看到了几个选择器的示例，并浅略接触了 jQuery 中的函数。你对 jQuery 初步了解的最后一部分涉及到了事件。就像你之前在\
  \ JavaScript 中看到过的事件处理一样，jQuery 允许你的程序响应鼠标点击、表单提交、按键等等。与 JavaScript 不同的是，jQuery\
  \ 中的跨浏览器事件处理非常简单。jQuery 在跨浏览器环境中表现出色。这在事件处理中尤为如此，它省去了你尝试弄每个浏览器如何响应某些函数的麻烦。\n\n##\
  \ 绑定与解绑\n\n`bind()` 函数将事件处理程序连接到事件上，例如鼠标点击：\n\n```\n.bind(event, data, handler)\n\
  ```\n\n在此实例中，`event` 是你想要响应的事件，`data` 是包含传递到事件处理程序的额外数据的可选对象，`handler` 是你想要响应此事件时运行的函数。\n\
  \n例如：\n\n```\n<a href=\"/link1.html\" id=\"myLink\">A link</a>\n$(\"#myLink\").bind(\"\
  click\", function() {\nalert(\"clicked the link\");\n});\n```\n\n这段代码的结果是，在捕获锚标签的\
  \ `click` 事件后，页面会显示警框。注意，这个示例在调用 `bind()` 时没有使用可选的 `data` 参数。\n\n你可以使用 `bind()`\
  \ 函数绑定以下事件：\n\n*   beforeunload\n*   blur\n*   change\n*   click\n*   dblclick\n\
  *   error\n*   focus\n*   focusin\n*   focusout\n*   hover\n*   keydown\n*   keypress\n\
  *   keyup\n*   load\n*   mousedown\n*   mouseenter\n*   mouseleave\n*   mousemove\n\
  *   mouseout\n*   mouseover\n*   mouseup\n*   resize\n*   scroll\n*   select\n*\
  \   submit\n*   toggle\n*   unload\n\n在之前的章节中，你使用第 11 章开发的 `ehandler.js` 脚本捕获事件。`ehandler.js`\
  \ 脚本提供了一个具有跨浏览器能力的通用事件处理器。这基本上就是 jQuery `bind()` 函数的作用。区别在于，jQuery 的 `bind()` 函数在跨浏览器事件处理方面优秀得多，并且比\
  \ `ehandler.js` 脚本强大得多。\n\n虽然你可以使用 `bind()` 进行事件处理，但 jQuery 还提供了工作方式与 `bind()` 相同的快捷函数。与其编写\
  \ `bind(\"click\", function())...`，你只需简单地编写 `click(function()...`。例如，你可以重写之前的 `bind()`\
  \ 示例：\n\n```\n$(\"#myLink\").click(function() {\nalert(\"clicked the link\");\n\
  });\n```\n\n你不仅可以响应点击链接等事件，还可以触发事件。例如，考虑示例 22-4`中的代码：\n\n示例 22-4. 响应事件。\n\n```\n\
  <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html\n<head>\n<title>Trigger Test</title>\n<script type=\"text/javascript\"\
  \ src=\"jquery-1.4.2.min.js\"></script>\n</head>\n<body\n<div id=\"myDiv\">\nHere\
  \ is some text.<br>\nIt goes inside this div<br>\n</div>\n<p>\n<a id=\"braingiaLink\"\
  \ href=\"http://www.braingia.org\">Steve Suehring</a>\n</p>\n<script type=\"text/javascript\"\
  >\n$(document).ready(function() {\n\n$('#braingiaLink').click(function() {\n   \
  \ alert(\"hello\");\n    return true;\n});\n\n$('#myDiv').click(function() {\n \
  \   $('#braingiaLink').click();\n});\n\n});\n</script>\n\n</body>\n</html\n```\n\
  \n当此页面加载到网页浏览器时，点击 `div` 内的任何地方都会触发锚标签的点击事件，就像你点击锚标签本身一样。\n\n要停止响应事件，你可以使用 `unbind()`\
  \ 函数解绑它们，它接受两个参数：\n\n```\n.unbind(event, function)\n```\n\n`event` 参数是你想要停止响应的事件，而\
  \ `function` 参数是当前绑定到该事件的函数。\n\n### 注意\n\n你可以通过多次对该事件调用 `bind()` 来为同一个事件绑定多个事件处理程序。\n\
  \n## 鼠标事件与悬停\n\n你现在已经看到了几个选择器的示例，并浅略接触了 jQuery 中的函数。你对 jQuery 初步了解的最后一部分涉及到了事件。就像你之前在\
  \ JavaScript 中看到过的事件处理一样，jQuery  允许你的程序响应鼠标点击、表单提交、按键等等。与 JavaScript 不同的是，jQuery\
  \ 中的跨浏览器事件处理非常简单。jQuery 在跨浏览器环境中表现出色。这在事件处理中尤为如此，它省去了你尝试弄每个浏览器如何响应某些函数的麻烦。\n\n##\
  \ 鼠标事件与悬停\n\n这段代码的关键是 `mouseover()` 和 `mouseout()` 事件，这两个事件反使用了两个额外的 jQuery 函数：`hide()`\
  \ 和 `show()`。`mouseover()` 和 `mouseout()` 事件连接到 ID 为 `wrapperP` 的段落。当鼠标进入此段落时，由\
  \ `braingiaLink` 标识的锚标签会消失，只有当鼠标离开段落区域时才会重新出现。值得注意的是，可以使用键盘导航仍然激活链接。请始终记住，访问网页的方法不止一种。\n\
  \njQuery 还有一个 `hover()` 函数，其工作方式与 `mouseover()` 和 `mouseout()` 事件非常相似。关于 `hover()`\
  \ 函数的更多信息，请参阅 [`api.jquery.com/hover/`](http://api.jquery.com/hover/)。\n\n## 更多事件处理器\n\
  \n正如前面的列表所示，jQuery 中还有许多其他事件处理器——多到在一个 jQuery 介绍性章节中无法全部涵盖。我推荐查看 [`api.jquery.com/category/events/`](http://api.jquery.com/category/events/)\
  \ 上提供的关于 jQuery 事件的优秀文档。\n\n# AJAX 与 jQuery\n\n前两个章节展示了如何编写和使用 AJAX。正如你在阅读本章之前的章节后所预期的那样，jQuery\
  \ 拥有处理 AJAX 自己的方法。正如许多其他 JavaScript 相关任务一样，jQuery 也让使用 AJAX 变得更容易。本节展示了如何结合 jQuery\
  \ 使用 AJAX。\n\n\n\njQuery 提供了几个函数用于从服务器获取数据以及向服务器发送数据。其中包括 `load()` 函数、`post()` 函数和\
  \ `get()` 函数。jQuery 还包含一个特定的 AJAX 函数，命名非常贴切 `ajax()`。\n\n使用 `ajax()` 函数，你可以设置多个参数，包括调用应使用的\
  \ HTTP 方法（`GET` 或 `POST`）、超时时间，以及当发生错误时要执行的操作（当然也包括代码执行成功时的操作）。\n\n## 更多信息\n\n请参阅\
  \ [`api.jquery.com/jQuery.ajax/`](http://api.jquery.com/jQuery.ajax/) 获取用于 `ajax()`\
  \ 函数的可用参数的完整列表。\n\n`ajax()` 函数的基本语法如下：\n\n```javascript\n$.ajax({\n    parameter:\
  \ value\n});\n```\n\n你可以向 `ajax()` 函数传递多个 `parameter: value` 对，但你通常会指定方法、URL 和回调函数。指定要返回的数据类型、是否缓存响应、传递给服务器的数据以及发生错误时要执行的操作也是常见的。\n\
  \n### 注意事项\n\n`ajaxSetup()` 函数允许你为 AJAX 相关的参数设置默认值，例如缓存、方法和错误处理等。\n\n这里是 `ajax()`\
  \ 函数在实际应用中的示例：\n\n```javascript\n$.ajax({\n    url:  \"testajax.aspx\",\n    success:\
  \  function(data) {\n        alert(\"Successful load\");\n    }\n});\n```\n\njQuery\
  \ 还包含一个名为 `getJSON()` 的函数，它执行与其他 AJAX 相关函数相同的本质功能，但它专门处理来自服务器的 JSON 编码格式的数据。`getJSON()`\
  \ 函数等同于调用 `ajax()` 函数并带有额外参数 `dataType: ‘json’`。\n\n例如，考虑这个包含几个州的 JSON 编码列表：\n\n\
  ```json\n[\"Wisconsin\",\"California\",\"Colorado\",\"Illinois\",\"Minnesota\",\"\
  Oregon\",\"Washington\",\"New\nYork\",\"New Jersey\",\"Nevada\",\"Alabama\",\"Tennessee\"\
  ,\"Iowa\",\"Michigan\"]\n```\n\n对于此例中，假设当调用本地服务器上的文件 `json.php` 时，返回了 JSON 编码的数据。以下\
  \ `ajax()` 函数的使用将检索数据并在成功时调用名为 `showStates` 的函数：\n\n```javascript\n$.ajax({\n  \
  \  type: \"GET\",\n    url: \"json.php\",\n    dataType: \"json\",\n    success:\
  \ showStates\n});\n```\n\n函数 `showStates` 创建一个列表并将其添加到表单的 `<select>` 下拉框中。\n\n##\
  \ 使用 jQuery 使用 AJAX\n\n为了完成这个分步练习，你需要在与本次练习中使用的文件相同的目录下准备一个名为 `json.php` 的文件（书的配套内容包含一个\
  \ `json.php` 文件）。与之前章节关于 AJAX 的示例一样，`json.php` 文件必须与发起 AJAX 请求的文件位于同一域中。\n\n1. 使用你选择的编辑器编辑\
  \ `ajax.html` 文件（也包含在本书的配套内容中）。\n2. 在文件中，放置加粗显示的代码（在配套内容中的 `ajax.txt` 中所示），并替换 TODO\
  \ 注释：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN  \"http://www.w3.org/TR/html4/strict.\n\
  dtd\">\n<html>\n<head>\n<title>AJAX Test</title>\n<script type=\"text/javascript\"\
  \ src=\"jquery-1.4.2.min.js\"></script>\n</head>\n<body>\n<div id=\"states\">\n\
  </div>\n<script type=\"text/javascript\">\n$(document).ready(function() {\n\n  \
  \  $.ajax({\n        type: \"GET\",\n        url: \"json.php\",\n        dataType:\
  \ \"json\",\n        success: showStates\n    });\n\n    function showStates(data,status)\
  \ {\n        $.each(data, function(item) {;\n            $(\"#states\").append(\"\
  <div>\" + data[item] + \"</div>\");\n        });\n    }\n\n    });\n</script>\n\
  </body>\n</html>\n```\n\n3. 保存文件并在网页浏览器中查看。你将看到一个州列表，如下所示：\n\n![使用 jQuery 使用 AJAX](img/httpatomoreillycomsourcemspimages748965.png.jpg)\n\
  \n## AJAX 错误与超时\n\n`ajax()` 函数允许你优雅地处理错误和超时。除了成功处理程序外，你还可以通过 `error` 参数指定错误处理程序。`error`\
  \ 参数的值通常是一个回调函数。这里有一个示例，其中新添加的错误参数已加粗：\n\n```javascript\n$.ajax({\n    type: \"\
  GET\",\n    url: \"json.php\",\n    dataType: \"json\",\n    success: successFunction,\n\
  \    error:  errorFunction\n});\n```\n\n用于错误处理的回调函数（上一个代码示例中的 `errorFunction`）接收三个参数：`XMLHTTPRequest`\
  \ 对象；代表所遇错误的字符串；以及（如果发生异常）一个异常对象。因此，错误处理程序函数应该接受这三个参数，然后对结果进行某些操作。此示例显示了一个警告：\n\n\
  ```javascript\nfunction errorFunction(xhr, statusMessage, exceptionObj) {\n    alert(\"\
  An error was encountered \" + statusMessage);\n}\n```\n\n你可能发现有必要为 AJAX 请求设置超时。你可以通过\
  \ `timeout` 参数设置超时，例如：\n\n```javascript\n$.ajax({\n    type: \"GET\",\n    url:\
  \ \"json.php\",\n    dataType: \"json\",\n    success: successFunction,\n    error:\
  \ errorFunction,\n    timeout: 5000\n});\n```\n\n请注意，超时时间的单位是毫秒。\n\n## 向服务器发送数据\n\
  \n你不仅需要从服务器接收数据，还需要向服务器发送数据。你通过 `data` 参数到 `ajax()` 函数实现这一点，使用 `GET` 或 `POST` 发送数据。\n\
  \n你可以将数据格式化为连接符分隔的 `key=value` 对（`key1=value1&key2=value2`）或映射对 `{key1: value1,\
  \ key2: value2}`。此示例调用名为 `statefull.php` 的服务器程序，它根据州缩写返回州名。\n\n```javascript\n$.ajax({\n\
  \    type: \"POST\",\n    url: \"statefull.php\",\n    dataType: \"json\",\n   \
  \ success: successFunction,\n    data: \"state=WI\"\n});\n```\n\n## 其他重要选项\n\n`ajax()`\
  \ 函数有很多选项。你已经学会了如何使用许多，但我想突出两个：\n\n*   `async`\n*   `cache`\n\n`async` 默认设置为 `true`，它告知脚本在发送、接收和处理\
  \ AJAX 事务时应该等待（并阻塞）。当设置为 `true` 时，AJAX 事务异步异步执行。\n\n`cache` 设置在大多数情况下为 `true`，控制\
  \ jQuery 是否会缓存 AJAX 事务。当接收的数据不经常变化时这非常有用，因为缓存可以加快事务，但当你的应用程序使用服务器上已更改的旧缓存数据时，缓存可能会导致问题。我发现将此选项设置为\
  \ `false` 很有帮助，特别是在遇到数据似乎没有刷新的问题时。\n\n## 更多 jQuery\n\n你看到的只是 jQuery 功能的一小部分。随着你学习更多关于\
  \ JavaScript 以及它如何帮助你的网站，考虑使用 jQuery 或其他 JavaScript 库来帮助完成这些开发工作。\n\n*   有关更多 jQuery\
  \ 的学习和参考资料，请参阅 [`www.jquery.com`](http://www.jquery.com) 资源。\n\n# 练习\n\n| 1. | 以\
  \ `ajax.html` 中的代码（来自名为 使用 jQuery 使用 AJAX 的练习）为基础，添加一种 CSS 样式，当鼠标悬停在列表中的某个州上时，该州的单个\
  \ `<<div>>` 的背景颜色变为蓝色。提示：有多种方法可以实现。 |\n\n\n\n\n| 2. | 创建一个服务器端程序，当使用 `$.ajax()`\
  \ 函数传递参数时返回数据。以某种方式处理这些数据，例如使用 `alert` 或将其写入页面。例如，你可以实现一个服务器端程序来返回两个数字之和，或者像示例所示，如果程序接收到状态的缩写，则返回完整的状态名称。\
  \ |\n\n# 第 23 章 jQuery 效果与插件\n\n**读完本章后，你将能够：**\n\n- 理解并使用原生的 jQuery 效果。\n- 理解 jQuery\
  \ UI。\n- 使用 jQuery UI。\n\n## 增强可用性的核心功能\n\n借助 jQuery 的帮助，实现效果和可用性增强功能（如拖放、元素的淡入淡出以及元素的滑动）是非常简单的。如果这些功能还不足以让你爱上这个产品，jQuery\
  \ 还是可扩展的，并且有一个健康的社区提供支持。\n\njQuery 社区贡献的功能之一就是插件。jQuery 插件提供了 jQuery 核心包未包含的额外功能。你可以在\
  \ jQuery 插件网站上获取有关插件的更多信息以及当前可用插件列表：*[`plugins.jquery.com/`](http://plugins.jquery.com/)*。\n\
  \n本章概述了 jQuery 核心产品以及 jQuery UI 中包含的一些效果。\n\n## 原生效果\n\n如本章引言所述，jQuery 包含了几个可以增强\
  \ Web 应用程序可用性的函数，例如显示和隐藏元素，以及元素的淡入淡出。本节检查了 jQuery 包含的几个原生效果。值得注意的是，在编写本文时，jQuery\
  \ 和 jQuery UI 正在更新以支持 Windows Internet Explorer 9，因此本章中显示的某些示例在当前的 Internet Explorer\
  \ 9 测试版中无法运行。不过，极有可能在你读到本章时，jQuery 和 jQuery UI 已经更新，Internet Explorer 9 也已经发布。\n\
  \n### 显示、隐藏和切换\n\n`show()` 和 `hide()` 函数分别显示和隐藏页面上的元素。这些函数设置了级联样式表（CSS）的 `display`\
  \ 属性。要隐藏一个元素，将 `display` 属性设置为 `none`。请注意，将 `display` 设置为 `none` 并不会将元素从 DOM 中移除，因此你仍然可以使用\
  \ `show()` 函数显示该元素。示例 23-1 提供了 `hide()` 函数的示例。\n\n示例 23-1. 隐藏元素。\n\n```\n<!DOCTYPE\
  \ HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>Hide</title>\n<script type=\"text/javascript\" src=\"\
  jquery-1.4.2.min.js\"></script>\n<style type=\"text/css\">\n.removeBtn {\n    color:\
  \ #0000CC;\n}\n</style>\n</head>\n<body>\n<ul>\n<li id=\"option1\">Option 1 <span\
  \ class=\"removeBtn\" id=\"remove1\">(x)</span></li>\n<li id=\"option2\">Option\
  \ 2 <span class=\"removeBtn\" id=\"remove2\">(x)</span></li>\n<li id=\"option3\"\
  >Option 3 <span class=\"removeBtn\" id=\"remove3\">(x)</span></li>\n<li id=\"option4\"\
  >Option 4 <span class=\"removeBtn\" id=\"remove4\">(x)</span></li>\n</ul>\n<script\
  \ type=\"text/javascript\">\n$(document).ready(function() {\n\n$('#option1').click(function()\
  \ {\n    $('#option1').hide();\n});\n$('#option2').click(function() {\n    $('#option2').hide();\n\
  });\n$('#option3').click(function() {\n    $('#option3').hide();\n});\n$('#option4').click(function()\
  \ {\n    $('#option4').hide();\n});\n\n</script>\n</body>\n</html>\n```\n\n遗憾，示例\
  \ 23-1 中的示例优化得很差，因为它需要为每个元素添加处理。示例 23-2 显示了使用 jQuery 实现相同功能的更好方式。\n\n```\n<!DOCTYPE\
  \ HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>Hide</title>\n<script type=\"text/javascript\" src=\"\
  jquery-1.4.2.min.js\"></script>\n<style type=\"text/css\">\n.removeBtn {\n    color:\
  \ #0000CC;\n}\n</style>\n</head>\n<body>\n<ul>\n<li id=\"option1\">Option 1 <span\
  \ class=\"removeBtn\" id=\"remove1\">(x)</span></li>\n<li id=\"option2\">Option\
  \ 2 <span class=\"removeBtn\" id=\"remove2\">(x)</span></li>\n<li id=\"option3\"\
  >Option 3 <span class=\"removeBtn\" id=\"remove3\">(x)</span></li>\n<li id=\"option4\"\
  >Option 4 <span class=\"removeBtn\" id=\"remove4\">(x)</span></li>\n</ul>\n<script\
  \ type=\"text/javascript\">\n$(document).ready(function() {\n\n$('.removeBtn').each(function()\
  \ {\n    $(this).click(function() {\n        $(this).parent().hide();\n    });\n\
  });\n\n</script>\n</body>\n</html>\n```\n\n在示例 23-2 代码中的唯一变化是 JavaScript 部分：\n\n\
  ```javascript\n$('.removeBtn').each(function() {\n    $(this).click(function() {\n\
  \        $(this).parent().hide();\n    });\n});\n```\n\n此 JavaScript 为具有 `removeBtn`\
  \ 类的元素应用了函数，在该元素上设置了点击事件器。它调用了 `hide()` 函数，但当事件触发时 `$(this)` 指向 `removeBtn` 元素（在本例中为\
  \ <span> 元素），你需要向上层级找到父节点，在本例中是 `<li>`。\n\n`toggle()` 函数根据元素的当前状态显示或隐藏元素。例如，当元素目前显示时，调用\
  \ `toggle()` 会隐藏它。同样，当元素被隐藏时，调用 `toggle()` 元素会变为可见。\n\n所有三个函数 `show()`、`hide()`\
  \ 和 `toggle()` 都接受两个参数：持续时间和回调函数。注意在示例 23-1 和示例 23-2 的代码中，当元素被隐藏时，它是立即消失的。为 `hide()`\
  \ 函数添加持续时间会导致元素按照指定的速率消失。与 jQuery 中的其他函数一样，你用毫秒指定持续时间。或者，你可以使用字符串“fast”和“slow”，分别代表\
  \ 200 毫秒和 600 毫秒。\n\n回调函数在显示或隐藏元素后执行操作。回调的一种可能用途是在隐藏元素后显示“撤销”按钮，使用户户显示他们刚刚隐藏的元素。\n\
  \n### 添加持续时间\n\n1. 使用 Microsoft Visual Studio、Eclipse 或文本编辑器打开 `duration.html` 文件，你可以在此书配套内容的\
  \ Chapter23 文件夹中找到它。\n2. 在文件中添加以下粗体所示的代码：\n\n\n\n\n\n```\n<!DOCTYPE HTML PUBLIC\
  \ \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html\n\
  <head>\n<title>隐藏</title>\n<script type=\"text/javascript\" src=\"jquery-1.4.2.min.js\"\
  ></script>\n<style type=\"text/css\">\n.removeBtn {\n    color: #0000CC;\n}\n</style>\n\
  </head>\n<body>\n<ul>\n<li id=\"option1\">选项 1 <span class=\"removeBtn\" id=\"remove1\"\
  >(x)</span></li>\n<li id=\"option2\">选项 2 <span class=\"removeBtn\" id=\"remove2\"\
  >(x)</span></li>\n<li id=\"option3\">选项 3 <span class=\"removeBtn\" id=\"remove3\"\
  >(x)</span></li>\n<li id=\"option4\">选项 4 <span class=\"removeBtn\" id=\"remove4\"\
  >(x)</span></li>\n</ul>\n<script type=\"text/javascript\">\n$(document).ready(function()\
  \ {\n\n$('.removeBtn').each(function(elm) {\n    $(this).click(function() {\n  \
  \      $(this).parent().hide(500);\n    });\n});\n\n});\n</script>\n\n</body>\n\
  </html>\n```\n\n3. 保存文件并在网络浏览器中查看该页面。你将看到一个类似这样的页面：\n\n![添加时长](img/httpatomoreillycomsourcemspimages748967.png.jpg)\n\
  \n4. 现在点击任何元素旁边的 `(x)`。该元素会从页面上消失，你将看到类似这样的页面：\n\n![添加时长](img/httpatomoreillycomsourcemspimages748969.png.jpg)\n\
  \n5. 如果你正在使用带有调试器的浏览器（例如带有 Firebug 的 Firefox），可以右键点击其他选项之一并选择“检查元素”（Inspect Element），你会发现隐藏元素的\
  \ `display` 属性已设置为 `none`。\n\n### 渐入与渐淡出\n\n在 `show()`、`hide()` 和 `toggle()` 函数中添加时长会改变它们的透明度，直到它们可见或隐藏。通过\
  \ `fadeIn()` 和 `fadeOut()` 函数也可以实现类似的功能。有关这些函数以及 `fadeTo()` 函数的更多信息，请参考 [[`api.jquery.com/category/effects/fading/`](http://api.jquery.com/category/effects/fading/)]。\n\
  \n### 滑动\n\n设置 `display` 属性为 `none` 的另一种方法是通过 `slideUp()` 和 `slideDown()` 函数实现的。这些函数创建了一个滑动效果，使元素看起来在消失之前移动，或者在出现之前移动。使用\
  \ `slideUp()` 函数让元素消失，使用 `slideDown()` 让其重新出现。\n\n将你在本章较早看到的基础代码更改为使用 `slideUp()`\
  \ 替 `hide`，如下所示：\n\n```javascript\n$('.removeBtn').each(function(elm) {\n    $(this).click(function()\
  \ {\n        $(this).parent().slideUp();\n    });\n});\n```\n\n### 注意\n\n不要被函数名称误导，认为你可以自由选择元素滑动的方向（向上或向下）。`slideUp()`\
  \ 函数始终让元素消失，而 `slideDown()` 始终让它们出现。\n\n# jQuery UI\n\njQuery UI 构建在 jQuery 核心库之上，提供了与用户界面相关的扩展功能。jQuery\
  \ UI 中的几个组件提供了特定的小部件或操作，包括日期选择器、手风琴功能和自动补全。本节将介绍一些 jQuery UI 小部件。\n\n## 更多信息\n\n\
  请访问 [`jqueryui.com/`](http://jqueryui.com/) 了解更多关于 jQuery UI 中所有可用小部件的信息。\n\n##\
  \ 使用 jQuery UI\n\njQuery UI 要求你在代码中包含一个单独的 JavaScript 文件。你可以从 [`jqueryui.com/`](http://jqueryui.com/)\
  \ 获取该文件，在其中你可以下载完整稳定版，或者构建仅包含网站所需组件的自定义下载。本章使用了 jQuery UI 的完整版本，但对于大多数网站，我建议你根据个人需求自定义\
  \ jQuery UI 下载，仅包含实现网站特效所需的那些特定组件。\n\njQuery UI 的下载包是一个 zip 文件，包含了 jQuery 核心库、jQuery\
  \ UI 代码以及与 jQuery UI 相关的 CSS 文件。你需要将此文件解压到 Web 服务器可以访问的位置，例如 `httpdocs` 或 `public_html`\
  \ 目录。本质上，这些文件需要与你整本书中一直使用的其他 JavaScript 和 HTML 文件位于同一个地方。\n\n### 注意\n\n使用 jQuery\
  \ UI 函数可能会对无障碍性产生影响，除非你提供了执行相同功能的替代方案。\n\n## 拖放\n\njQuery UI 包含了通过拖放移动元素的函数，分别称为\
  \ `draggable()` 和 `droppable()`。调用 `draggable()` 允许用户可以使用鼠标在页面上移动元素。请考虑 示例 23-3\
  \ 函数的用法。\") 中的代码。\n\n示例 23-3. `draggable()` 函数的用法。\n\n```html\n<!DOCTYPE HTML PUBLIC\
  \ \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n\
  <head>\n<title>拖动</title>\n<script type=\"text/javascript\" src=\"jquery-1.4.2.min.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"js/jquery-ui-1.8.4.custom.min.js\"\
  ></script>\n<style type=\"text/css\">\n#container span {\n    border: solid 1px\
  \ black;\n    padding: 3px;\n}\n</style>\n</head>\n<body>\n<div id=\"container\"\
  >\n<span>拖动我到处去</span>\n</div>\n<script type=\"text/javascript\">\n$(document).ready(function()\
  \ {\n\n$('#container > span').draggable();\n\n});\n</script>\n\n</body>\n</html>\n\
  ```\n\n这段代码建立了一个 `<p>` 元素，该元素通过调用 `draggable()` 函数后可以被拖动：\n\n```javascript\n$('#container\
  \ > span').draggable();\n```\n\n### 注意\n\n示例 23-3 函数的用法。\") 中的代码假设你已经下载了 jQuery，并且\
  \ jQuery UI 文件已下载到你的当前工作目录——即与 示例 23-3 函数的用法。\") 的 HTML 文件相同的目录中。jQuery UI 代码随后从\
  \ `js/` 子目录加载。\n\n尝试在浏览器中运行 示例 23-3 函数的用法。\") 中的代码。你会发现点击并拖动元素是可能的。\n\n你可以将 `droppable()`\
  \ 函数与 `draggable()` 结合使用，为拖拽元素创建一个目标，使用户可以使用拖放操作在屏幕上视觉化处理项目。示例 23-4 函数的用法。\") 扩展了\
  \ `draggable()` 示例示例 23-3](#ch23s02.html_dotdraggableleft_parenthesisright_parent\
  \ \"示例 23-3. .draggable() 函数的用法。\")，提供了一个 `<div>` 作为投放目标：\n\n示例 23-4. `droppable()`\
  \ 函数的用法。\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>投放</title>\n<script type=\"text/javascript\" src=\"jquery-1.4.2.min.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"js/jquery-ui-1.8.4.custom.min.js\"\
  ></script>\n<style type=\"text/css\">\n#container span {\n    border: solid 1px\
  \ black;\n    padding: 3px;\n}\n#targetContainer {\n    height: 200px;\n    width:\
  \ 200px;\n    border: solid 1px black;\n    background-color: #abacab;\n    margin:\
  \ 50px;\n}\n</style>\n</head>\n<body>\n<div id=\"container\">\n<span>拖动我并投放我</span>\n\
  </div>\n<div id=\"targetContainer\">\n</div>\n<script type=\"text/javascript\">\n\
  $(document).ready(function() {\n\n$('#container > span').draggable();\n$('#targetContainer').droppable({\n\
  \    drop: function(event,ui) {\n        alert(\"投放的元素: \" + ui.draggable.text());\n\
  \    }\n});\n\n});\n</script>\n\n</body>\n</html>\n```\n\n这段代码的关键在于为 `id=\"targetContainer\"\
  ` 的 `<div>` 提供一个投放目标。\n\n\n\n\n\n```javascript\n$('#targetContainer').droppable({\n\
  \    drop: function(event,ui) {\n        alert(\"Dropped Element: \" + ui.draggable.text());\n\
  \    }\n});\n```\n\n`.droppable()` 函数处理多个事件，允许你在以下情况发生做出响应：项目被拖到可放置元素上方（`over`）、移出可放置元素（`out`）、元素被掉入其中（`drop`，如示例所示），以及一个有效的\
  \ `draggable` 元素被拾起或松开时（`activate` 和 `deactivate`）。关于这些事件的示例，请参见 `[`jqueryui.com/demos/droppable/`](http://jqueryui.com/demos/droppable/)`。\n\
  \n## 手风琴 (Accordion)\n\n使用 jQuery UI 可以创建手风琴效果，即选项看起来是在相互滚动折叠和展开。让手风琴正常工作的关键是使用格式良好的\
  \ HTML 以及适用于手风琴布局的布局。手风琴的良好候选对象是一组相似的项目或选项。\n\n示例 23-5 展示了创建简单手风琴的 HTML 和 JavaScript。\n\
  \n示例 23-5. 一个 jQuery 手风琴。\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html\n<head>\n<title>Accordion</title>\n\
  <script type=\"text/javascript\" src=\"jquery-1.4.2.min.js\"></script>\n<script\
  \ type=\"text/javascript\" src=\"js/jquery-ui-1.8.4.custom.min.js\"></script>\n\
  <style type=\"text/css\">\n#container {\n    border: solid 1px black;\n    padding:\
  \ 3px;\n}\n.optionHead {\n    border: solid 1px black;\n    background-color: #abacab;\n\
  }\n.optionDiv {\n    border-bottom: dotted 1px black;\n}\n</style>\n</head>\n<<body>\n\
  <div id=\"container\">\n<h3 class=\"optionHead\">Option 1</h3>\n<div class=\"optionDiv\"\
  \ id=\"option1\">\n<p>Text of option 1</p>\n</div>\n<h3 class=\"optionHead\">Option\
  \ 2</h3>\n<div class=\"optionDiv\" id=\"option2\">\n<p>Text of option 2</p>\n</div>\n\
  <h3 class=\"optionHead\">Option 3</h3>\n<div class=\"optionDiv\" id=\"option3\"\
  >\n<p>Text of option 2</p>\n</div>\n</div>\n<script type=\"text/javascript\">\n\
  $(document).ready(function() {\n\n$('#container').accordion();\n\n});\n</script>\n\
  \n</body>\n</html>\n```\n\n将示例 23-5 中的代码加载到 浏览器中，将得到一个与图 23-1 所示类似的页面。\n\n![一个基础的\
  \ jQuery 手风琴。](img/httpatomoreillycomsourcemspimages748971.png.jpg)\n\n图 23-1. 一个基础的\
  \ jQuery 手风琴。\n\n当使用 jQuery 手风琴时，你会注意到页面加载时第一个选项总是展开的。根据布局的需要和手风琴的使用方式，你可能会发现你需要在页面加载时展开不同的选项，或者在加载时折叠所有选项。`.accordion()`\
  \ 函数包含了几个控制其行为的选项。当 `active` 选项与 `collapsible` 设置为 `true` 配合使用时，手风琴将以折叠状态或选中某个选项的状态启动。\n\
  \n在接下来的分步练习中，你将在网页中使用手风琴并为手风琴设置默认状态。\n\n### 为手风琴设置默认状态\n\n1. 使用 Microsoft Visual\
  \ Studio 或 Eclipse 等编辑器打开 `accordion.html` 文件。（你可以在配套内容中找到此文件。）\n\n2. 在 `accordion.html`\
  \ 中，添加以下**粗体**所示的代码：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html\n<head>\n<title>Accordion</title>\n\
  <script type=\"text/javascript\" src=\"jquery-1.4.2.min.js\"></script>\n<script\
  \ type=\"text/javascript\" src=\"js/jquery-ui-1.8.4.custom.min.js\"></script>\n\
  <style type=\"text/css\">\n#container {\n    border: solid 1px black;\n    padding:\
  \ 3px;\n}\n.optionHead {\n    border: solid 1px black;\n    background-color: #abacab;\n\
  }\n.optionDiv {\n    border-bottom: dotted 1px black;\n}\n</style>\n</head>\n<<body>\n\
  <div id=\"container\">\n<h3 class=\"optionHead\">Option 1</h3>\n<div class=\"optionDiv\"\
  \ id=\"option1\">\n<p>Text of option 1</p>\n</div>\n<h3 class=\"optionHead\">Option\
  \ 2</h3>\n<div class=\"optionDiv\" id=\"option2\">\n<p>Text of option 2</p>\n</div>\n\
  <h3 class=\"optionHead\">Option 3</h3>\n<div class=\"optionDiv\" id=\"option3\"\
  >\n<p>Text of option 2</p>\n</div>\n</div>\n<script type=\"text/javascript\">\n\
  $(document).ready(function() {\n\n$('#container').accordion({\n    collapsible:\
  \ true,\n    active: false\n});\n\n});\n</script>\n\n</body>\n</html>\n```\n\n3.\
  \ 保存文件并在浏览器中查看页面。注意手风琴是以折叠形式启动的，如下所示：\n\n![为手风琴设置默认状态](img/httpatomoreillycomsourcemspimages748973.png.jpg)\n\
  \n4. 将 `active` 选项改为 `2` 而不是 `false`。代码应该像这样：\n\n```javascript\n$('#container').accordion({\n\
  \    collapsible: true,\n    active: 2\n});\n```\n\n5. 在浏览器中重新加载页面。注意屏幕上的第三个选项显示为展开。这是因为索引从\
  \ `0` 开始，因此第一个选项（屏幕上显示为 Option 1）实际上是索引 `0`。\n\n关于手风琴组件可用选项和事件的更多信息，请参见 `[`jqueryui.com/demos/accordion/`](http://jqueryui.com/demos/accordion/)`。\n\
  \n# 更多 jQuery UI\n\njQuery UI 的内容远多于一书中一个章节所涵盖的范围，例如复杂的 CSS 主题功能，允许你为整个 jQuery UI\
  \ 中使用的效果和组件选择配色方案。关于 jQuery UI 已经写了整整本书的书。关于 CSS 主题和 jQuery UI，请参见 `[`jqueryui.com/themeroller/`](http://jqueryui.com/themeroller/)`。此外，请访问\
  \ `[`jqueryui.com`](http://jqueryui.com)` 获取更多关于 jQuery UI 的信息和教程。\n\n# 练习题\n\n\
