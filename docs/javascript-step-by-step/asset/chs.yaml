  \n此练习结合了最后两个章节的代码，展示了如何使用与 AJAX 关联的 `xmlHttpRequest` 对象来获取和显示 XML 数据。尽管 第 18 节 中所示的原始\
  \ XML 应用已转换为使用 `xmlHttp Request`，但它显示的表格仍然相当丑陋。这正是 CSS 样式派上用场的地方。\n\n# 使用 CSS 为表格设置样式\n\
  \n在上一个练习中显示表格的主函数是 `displayData()` 函数。在该函数内部，你可以应用 CSS 样式使表格看起来更像在现代 Web 应用中看到的样式。\n\
  \n### 注意事项\n\n本章处理样式的方法直接是在 JavaScript 中对样式进行修改，但你应该理解，这种方法仅用于教学目的；在真实世界的代码中并不推荐，因为它可能导致排查为何某个样式属性被应用到特定元素变得困难，因为信息可以在\
  \ CSS 和 JavaScript 代码中同时发生。另一种处理 CSS 的方法（第 22 节 中所示）通过更改应用于 HTML 元素的 CSS 样式来应用样式更改。这是\
  \ JavaScript 中处理 CSS 的推荐方法，因为它保持了显示（CSS）与行为（JavaScript 代码）之间的分离。\n\n## 使用 JavaScript\
  \ 修改样式属性\n\n要完成的首要任务之一是通过删除 `displayData()` 函数附近的以下行来移除边框：\n\n```\ntable.border\
  \ = \"1\";\n```\n\n`displayData()` 函数中有两个主循环：一个用于显示列标题，另一个用于显示数据本身。第一个循环显示列标题，如下所示：\n\
  \n```\nfor (colHead = 0; colHead < xmlEl[0].childNodes.length; colHead++) {\n  \
  \  if (xmlEl[0].childNodes[colHead].nodeType != 1) {\n        continue;\n    }\n\
  \    var tableHead = document.createElement(\"th\");\n    var colName = document.createTextNode(xmlEl[0].childNodes[colHead].nodeName);\n\
  \    tableHead.appendChild(colName);\n    row.appendChild(tableHead);\n}\ntbody.appendChild(row);\n\
  ```\n\n第二个显示实际数据的循环如下所示：\n\n```\nfor (i = 0; i < xmlEl.length; i++) {\n    var row\
  \ = document.createElement(\"tr\");\n    // 创建行/td 元素\n    for (j = 0; j < xmlEl[i].childNodes.length;\
  \ j++) {\n        // 如果类型不是 1，则跳过\n        if (xmlEl[i].childNodes[j].nodeType !=\
  \ 1) {\n            continue;\n        }\n\n        // 从 XML 文档中插入实际文本/数据。\n   \
  \     var td = document.createElement(\"td\");\n        var xmlData = document.createTextNode(xmlEl[i].childNodes[j].firstChild.nodeValue);\n\
  \        td.appendChild(xmlData);\n        row.appendChild(td);\n    }\n    tbody.appendChild(row);\n\
  }\n```\n\n对表格显示的大多数更改将在这些循环中完成。我在更改更改时高亮了它们。\n\n你可能想要更改的另一个项目是字体。（我一直偏爱 Arial 字体。）你使用\
  \ JavaScript 中的 `fontFamily` 样式属性来实现此。此更改必须在每个循环中进行，以便为表格中的所有文本设置样式。添加代码后，循环现在如下所示（注意加粗的两行）：\n\
  \n```\nfor (colHead = 0; colHead < xmlEl[0].childNodes.length; colHead++) {\n  \
  \  if (xmlEl[0].childNodes[colHead].nodeType != 1) {\n        continue;\n    }\n\
  \    var tableHead = document.createElement(\"th\");\n    var colName = document.createTextNode(xmlEl[0].childNodes[colHead].nodeName);\n\
  \    tableHead.style.fontFamily = \"Arial\";\n    tableHead.appendChild(colName);\n\
  \    row.appendChild(tableHead);\n}\ntbody.appendChild(row);\n\nfor (i = 0; i <\
  \ xmlEl.length; i++) {\n    var row = document.createElement(\"tr\");\n    // 创建行/td\
  \ 元素\n    for (j = 0; j < xmlEl[i].childNodes.length; j++) {\n        // 如果类型不是\
  \ 1，则跳过\n        if (xmlEl[i].childNodes[j].nodeType != 1) {\n            continue;\n\
  \        }\n\n        // 从 XML 文档中插入实际文本/数据。\n        var td = document.createElement(\"\
  td\");\n        var xmlData = document.createTextNode(xmlEl[i].childNodes[j].firstChild.nodeValue);\n\
  \        td.style.fontFamily = \"Arial\";\n        td.appendChild(xmlData);\n  \
