  \ Second Page</p>\n</body>\n</html>\n```\n\n# 第 3 章\n\n1. 有效语句有 `a`、`b`、`c` 和 `d`。唯一的无效语句是\
  \ `e`，因为它使用了保留字 `case` 作为变量名。\n\n2. 错误。并不是所有的 JavaScript 语句末尾都需要分号。事实上，分号通常是可选的。\n\
  \n3. `orderTotal` 变量在访问者被告知每种物品的订单数量后、但在函数返回该值之前被更改了。这里的教训是，你必须小心不要意外地更改变量的值或内容。访问者预期订单某个数量，但代码在告诉访问者他们订了多少之后，清楚地改变了那个数量！\n\
  \n# 第 4 章\n\n1. 变量声明：\n\n```javascript\nvar first = 120;\nvar second = \"5150\"\
  ;\nvar third = \"Two Hundred Thirty\";\n```\n\n2. 数组（你的值可能会不同，但数据类型和语法是重点）：\n\n\
  ```javascript\nvar newArray = new Array(10, 20, 30, \"first string\", \"second string\"\
  );\n```\n\n3. 转义字符串：\n\n```javascript\nalert(\"Steve's response was \\\"Cool!\\\\\
  \"\");\n```\n\n4. 这个练习供读者练习。没有对错之分。\n\n# 第 5 章\n\n1. 警框（你的值可能会不同，但数据类型和语法是重点）：\n\
  \n```javascript\nvar num1 = 1;\nvar num2 = 1;\nvar num3 = 19;\nvar fourthvar = \"\
  84\";\nvar name1 = \"Jakob\";\nvar name2 = \"Edward\";\nalert(num1 + num2);\nalert(num3\
  \ + fourthvar);\nalert(name1 + name2);\n```\n\n2. 后置：\n\n```javascript\nvar theNum\
  \ = 1;\nalert(theNum);\nalert(theNum++);\nalert(theNum);\n```\n\n前置：\n\n```javascript\n\
  var theNum = 1;\nalert(theNum);\nalert(++theNum);\nalert(theNum);\n```\n\n3. 代码：\n\
  \n```javascript\nvar num1 = 1;\nvar num2 = 1;\nvar num3 = 19;\nvar fourthvar = \"\
  84\";\nvar name1 = \"Jakob\";\nvar name2 = \"Edward\";\nalert(typeof num1);\nalert(typeof\
  \ num2);\nalert(typeof num3);\nalert(typeof fourthvar);\nalert(typeof name1);\n\
  alert(typeof name2);\n```\n\n这应该产生三个带有 `number` 字样的警框，后面跟着三个带有 `string` 字样的警框。\n\
  \n4. 错误。一元运算符在 JavaScript 中经常出现，特别是在使用 `++` 后置运算符增加变量的 `for` 循环中。\n\n5. 错误。虽然节省几个字节是有帮助的，特别是对于\
  \ Web 应用程序，但几乎总是优先花费这几个字节来提高代码的可读性和可维护性。不过，这很大程度上取决于你的风格和编码标准。在随后的章节中，你将接触 jQuery。该库典型的“压缩”版本是一个将节省字节推向极端的例子。\n\
  \n# 第 6 章\n\n1. 将以下代码中的 `YOUR NAME` 替换为适当的内容：\n\n```javascript\nvar inputName =\
  \ prompt(\"Please enter your name:\");\nswitch(inputName) {\n    case \"YOUR NAME\"\
  :\n        alert(\"Welcome \" + inputName);\n        break;\n    case \"Steve\"\
  :\n        alert(\"Go Away\");\n        break;\n    default:\n        alert(\"Please\
  \ Come Back Later \" + inputName);\n}\n```\n\n2. 这里是代码：\n\n```javascript\nvar temp\
  \ = prompt(\"Please enter the current temperature\");\nif (temp > 100) {\n    alert(\"\
  Please cool down\");\n} else if (temp < 20) {\n    alert(\"Better warm up\");\n\
  }\n```\n\n注意，提供一个默认情况（default case）也是一个好主意。\n\n3. 这个练习实际上无法完成。因为三元运算符期望单个条件，而练习\
  \ 2 要求两个条件，因此无法按照指定使用三元运算符。以下代码创建了一个警框，当温度高于 100 时告诉访问者降温，当低于 20 时告诉加暖：\n\n```javascript\n\
  temp > 100 ? alert(\"Please cool down\") : alert(\"Better warm up\");\n```\n\n4.\
  \ 这里是代码：\n\n```javascript\nfor (var i = 1; i < 101; i++) {\n    if (i == 99) {\n\
  \        alert(\"The number is \" + i);\n    }\n}\n```\n\n注意，因为变量 `i` 从 1 开始计数（如练习中所要求的），计数器需要达到\
