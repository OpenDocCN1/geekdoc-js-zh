  \ `-1`，然后再次点击提交查询。你看到了这个页面：\n\n![在 Web 表单中使用 try/catch](img/httpatomoreillycomsourcemspimages748909.png.jpg)\n\
  \n14. 在表单中输入一段文本短语，再次点击提交查询。你看到了如下的页面：\n\n![在 Web 表单中使用 try/catch](img/httpatomoreillycomsourcemspimages748911.png.jpg)\n\
  \n15. 在表单中输入 1 到 100 之间的有效数字（例如 `50`），并点击提交查询。表单无错误提交。\n\n此练习使用了前面章节中解释的一些方法来创建一个新元素并将其放入文档中提供反馈。练习的第一部分转换了第\
  \ 15 章 中的 Web 表单，使其使用了 `try/catch` 样式和新内容。第 15 章 中的表单要求用户输入城市名称，而这个表单要求输入特定范围的数字；\n\
  \n\n\n\n\n```javascript\nfunction checkValid(eventObj) {\n    try {\n        var\
  \ numField = document.forms[0][\"num\"];\n        if (isNaN(numField.value)) {\n\
  \            var err = new Array(\"It's not a number\",numField);\n            throw\
  \ err;\n        }\n        else if (numField.value > 100) {\n            var err\
  \ = new Array(\"It's greater than 100\",numField);\n            throw err;\n   \
  \     }\n        else if (numField.value < 1) {\n            var err = new Array(\"\
  It's less than 1\",numField);\n            throw err;\n        }\n        return\
  \ true;\n    }\n    catch(errorObject) {\n        var errorText = document.createTextNode(errorObject[0]);\n\
  \        var feedback = document.getElementById(\"feedback\");\n        var newspan\
  \ = document.createElement(\"span\");\n        newspan.appendChild(errorText);\n\
  \        newspan.style.color = \"#FF0000\";\n        newspan.style.fontWeight =\
  \ \"bold\";\n        newspan.setAttribute(\"id\",\"feedback\");\n        var parent\
  \ = feedback.parentNode;\n        var newChild = parent.replaceChild(newspan,feedback);\n\
  \        errorObject[1].style.background = \"#FF0000\";\n        if (eventObj.preventDefault)\
  \ {\n            eventObj.preventDefault();\n        } else {\n            window.event.returnValue\
  \ = false;\n        }\n        return false;\n    }\n    finally {\n        alert(\"\
  This is called on both success and failure.\");\n    }\n}\n```\n\n# 使用 `onerror`\
  \ 事件\n\n你可能会在程序中使用 `onerror` 事件来处理错误事件和条件，但现在程序员使用它的频率已经大大降低，因为他们可以用不那么侵入性的方式处理错误。`onerror`\
  \ 事件可以绑定到 `window` 和 `image` 对象上。\n\n## 将 `onerror` 绑定到 `window` 对象\n\n要使用 `onerror`\
  \ 事件，你需要为其分配一个函数，该函数每当发生 JavaScript 错误时就会被调用。`onerror` 事件在开发过程中很有帮助，尽管像 Firebug\
  \ 这样的工具的使用减少了对它的需求。\n\n你可以这样将 `onerror` 事件绑定到 `window` 对象：\n\n```javascript\nwindow.onerror\
  \ = myErrorHandler;\n```\n\n`myErrorHandler` 变量指向一个自定义函数，用于处理错误条件。JavaScript 解释器会自动向错误处理程序传递三个参数：\n\
  \n*   错误的文本描述\n*   发生错误的统一资源定位符 (URL)\n*   发生错误所在的行号\n\n当错误处理函数返回 `true` 时，JavaScript\
  \ 将不会自行处理该错误；它假设错误已经由错误处理程序处理。\n\n示例 16-3（位于列表 16-3.htm 文件的辅助内容）展示了一个 JavaScript\
  \ 和用户自定义处理程序的示例。\n\n示例 16-3。`window` 对象中 `onerror` 的示例。\n\n```html\n<!DOCTYPE HTML\
  \ PUBLIC \"-//W3C//DTD HTML 4.01//EN\" \"http://www.w3.org/TR/html4/strict.\ndtd\"\
  >\n<html\n<head>\n<title>onerror</title>\n</head>\n<body>\n<div id=\"mydiv\">Hi</div>\n\
  <script type=\"text/javascript\">\nfunction init() {\n    doSomething();\n}\nfunction\
  \ errorHandler() {\n    alert(arguments[0] + \" on line \" + arguments[2]);\n  \
  \  return true;\n}\n\nwindow.onload = init;\nwindow.onerror = errorHandler;\n</script>\n\
  </body>\n</html>\n```\n\n当你将示例 16-3 中的代码加载到网页浏览器时，你会看到一个类似于图 16-1 中的 `alert()` 对话框。\n\
  \n![使用 window 对象 onerror 事件的错误处理程序。](img/httpatomoreillycomsourcemspimages748913.png.jpg)\n\
  \n图 16-1。使用 `window` 对象 `onerror` 事件的错误处理程序。\n\n示例 16-3 在窗口加载时于 `init()` 函数中包含一个故意未定义的函数。JavaScript\
  \ 解释器在发现未定义函数时会抛出错误，由于将名为 `errorHandler` 的自定义函数赋值给了 `onerror` 事件，该自定义函数会被调用。`errorHandler`\
  \ 函数显示 `alert()` 对话框并返回 `true`，这样就不会发生进一步的错误处理。`alert()` 对话框显示 `arguments` 数组的第一个和第三个索引（`arguments[0]`\
  \ 和 `arguments[2]`）。`arguments` 数组包含了发送给错误处理程序的三个参数：错误消息、URL 和错误行号。\n\n## 避免侵入式地处理事件\n\
  \n示例 16-3 中的示例以一种相当侵入的方式处理了 JavaScript 错误：通过使用 `alert()` 对话框。尽可能在后台处理错误比使用 `alert`\
  \ 对话框是更好的做法。如果页面有很多错误，频繁使用 `alert` 对话框会让访问者迅速感到极其厌烦，因为他们必须点击每一个。\n\n当你预判可能会发生错误时，可以针对该错误编写代码并处理它，以使脚本优雅地降级——例如，通过替换不同的函数或显示友好的错误消息。\n\
  \n## 忽略错误\n\n与其用额外的错误处理代码来处理错误，你可以选择完全忽略它们。你只需要从错误处理程序返回 `true` 即可实现。每当错误处理函数返回\
  \ `true` 时，浏览的行为就像错误已被处理一样。因此，通过返回 `true`，你本质上是在告诉解释器忽略该错误。\n\n看看示例 16-4 中的代码。它与示例\
  \ 16-3 中的代码相似，然而在示例 16-4 中，`errorHandler` 函数返回 `true`（如加粗字体所示）。这意味着当未定义的 `doSomething()`\
  \ 函数引起错误时，该错误被静地忽略了。示例 16-4 的代码可以在辅助内容 listing16-4.htm 文件中找到。\n\n示例 16-4。忽略错误的示例。\n\
  \n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\" \"http://www.w3.org/TR/html4/strict.\n\
  dtd\">\n<html\n<head>\n<title>onerror</title>\n</head>\n<body>\n<div id=\"mydiv\"\
  >Hi</div>\n<script type=\"text/javascript\">\nfunction init() {\n    doSomething();\n\
  }\nfunction errorHandler() {\n    return true;\n}\n\nwindow.onload = init;\nwindow.onerror\
  \ = errorHandler;\n</script>\n</body>\n</html>\n```\n\n你可以使用安装了 Firebug 的 Firefox\
  \ 观察这种行为。首先，原样加载示例 16-4 中的代码。你不会看到任何记录的错误。然后，注释掉 `errorHandler` 函数内部的 `return true;`\
  \ 语句，使其如下：\n\n```javascript\nfunction errorHandler() {\n//    return true;\n}\n\
  ```\n\n当你重新加载页面时，你会在 Firebug 错误台中注意到一个错误，如图 16-2 所示。\n\n![注释掉错误处理程序的返回值会导致 JavaScript\
  \ 错误，可以使用 Firebug 查看。](img/httpatomoreillycomsourcemspimages748915.png.jpg)\n\n\n\
  \n\n图 16-2。注释掉错误处理程序中的返回值会导致 JavaScript 错误，可以使用 Firebug 查看该错误。\n\n## 在 `image` 对象上附加\
  \ `onerror`\n\n你也可以为 `image` 对象附加一个 `onerror` 事件。当它内联在 `<img>` 标签中时，你可以使用这些事件处理程序来未找到的图片。例如，图\
  \ 16-3](#ch16s03.html_missing_image_that_can_be_avoided_using \"Figure 16-3. 一个可以使用\
  \ JavaScript 避免的缺失图片。\") 显示了一个缺少图片的页面。\n\n![一个可以使用 JavaScript 避免的缺失图片。](img/httpatomoreillycomsourcemspimages748917.png.jpg)\n\
  \n图 16-3. 一个可以使用 JavaScript 避免的缺失图片。\n\n该页面的代码可见示例 16-5（并位于配套内容的 `listing16-5.htm`\
  \ 文件中）。\n\n示例 16-5. 一个缺少图片的页面。\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML\
  \ 4.01//EN\" \"http://www.w3.org/TR/html4/\nstrict.dtd\">\n<html\n<head>\n<title>onerror</title>\n\
  </head>\n<body>\n<div id=\"mydiv\">Hi</div>\n<img src=\"notfound.png\">\n</body>\n\
  </html>\n```\n\n现在，请考虑带有内联 `onerror` 处理器的代码。`onerror` 处理程序将 `<img>` 元素重定向到一个确实存在的图片。在这种情况下，图片的内容并不重要；要点是，通过这种使用\
  \ `onerror` 处理程序可以帮助防止网页中出现常见的“图片未找到”图标。示例 16-6 处理程序。\")（位于配套内容的 `listing16-6.htm`\
  \ 文件中）显示了新代码。\n\n示例 16-6. 为图片添加一个 `onerror()` 处理程序。\n\n```\n<!DOCTYPE HTML PUBLIC\
  \ \"-//W3C//DTD HTML 4.01//EN\" \"http://www.w3.org/TR/html4/\nstrict.dtd\">\n<html\n\
  <head>\n<title>onerror</title>\n</head>\n<body>\n<div id=\"mydiv\">Hi</div>\n<img\
  \ src=\"notfound.png\" onerror=\"this.src='logo.png'; return true;\">\n</body>\n\
  </html>\n```\n\n当将此页面加载到网页浏览器时，页面将找不到 `notfound.png` 图片；然而，作为替代，浏览器将获取并显示一个名为 `logo.png`\
  \ 的图片，如图 16-4](#ch16s03.html_missing_image_has_been_replaced_comma_tha \"Figure\
  \ 16-4. 多亏于 onerror 事件处理器，缺失图片已被替换。\")所示。\n\n![由于 onerror 事件处理器的作用，缺失图片已被替换。](img/httpatomoreillycomsourcemspimages748919.png.jpg)\n\
  \n图 16-4. 多亏于 `onerror` 事件处理器，缺失图片已被替换。\n\n# 练习\n\n| 1. | 使用附加到 `window` 对象上的 `onerror`\
  \ 事件处理器来处理函数未定义时的错误。注意，你可以使用示例 16-3 中的代码作为新代码的基础，但错误处理程序应该以比使用 `alert()` 更友好的方式呈现错误。\
  \ |\n| 2. | 构建一个 Web 表单并使用 `try/catch` 块捕获文本框中输入的城市不是“`Stockholm`”的情况。提供城市错误的视觉反馈。\
  \ |\n| 3. | 构建一个 Web 表单并使用 `try/catch/finally` 块捕获数字大于 100 的情况。确保访问者无论输入什么（有效值或无效值），每次使用表单时都会收到感谢。\
  \ |\n\n# 第四部分. AJAX 与服务器端集成\n\n# 第 17 章 JavaScript 与 XML\n\n**阅读完本章后，你将能够：**\n\n\
  * 使用 JavaScript 查看打开可扩展标记语言 (XML) 文档的函数。\n* 将 XML 文档显示为超文本标记语言 (HTML) 表。\n* 使用 JavaScript\
  \ 查看 Microsoft Office Excel 2007 XML 电子表格。\n\n## 使用 JavaScript 使用 XML\n\nXML 是一种几乎完全由用户定义的标签组成的语言。因为用户定义的标签使得\
  \ XML 极具定制性，所以 XML 经常被用作交换数据的格式。对于 JavaScript 程序员来说，重要的考虑是 AJAX（异步 JavaScript 和\
  \ XML）缩写中的 `X`。AJAX 已成为创建交互式 Web 应用的一种非常流行的方法。你将在接下来两个章节学习更多关于 AJAX 的知识：第 19 章 和\
  \ 第 20 章。\n\nXML 是由世界网联盟 (W3C) 定义的开放标准，目前是第四版。本节简要介绍与 JavaScript 相关的 XML。你可以在 XML\
  \ 工作组网站 `[http://www.w3.org/XML/Core/]` 上找到更多关于 XML 的信息，也可以在微软网站 `[http://msdn.microsoft.com/xml/]`\
  \ 上找到。\n\n### 查看示例 XML 文档\n\nXML 文档由文档结构内的元素组成。这些元素有自己的语法规则，包括它们需要起始标签和结束标签。对于 Web\
  \ 程序员来说，文档的外观（定义在标签之间的文本）可能是熟悉的。这是一个示例 XML 文档，也位于配套内容第 17 文件夹下的 `books.xml` 文件中：\n\
  \n```\n<books>\n<book>\n    <title>MySQL Bible</title>\n    <author>Steve Suehring</author>\n\
  \    <isbn>9780764549328</isbn>\n    <publisher>Wiley Publishing Inc.</publisher>\n\
  </book>\n<book>\n    <title>JavaScript Step by Step</title>\n    <author>Steve Suehring</author>\n\
  \    <isbn>9780735624498</isbn>\n    <publisher>Microsoft Press</publisher>\n</book>\n\
  </books>\n```\n\n文档的整体结构需要符合某些标准才能被称为良好的文档（well-formed document）。正如示例所示，每个元素都有自己的起始标签，随后跟一个对应的结束标签。元素还可以相互嵌套。许多这些规则与\
  \ HTML 规则相似。\n\nXML 文档也可以包含属性，因此以下内容也是有效的：\n\n```\n<?xml version=\"1.0\"?>\n<book\
  \ title=\"JavaScript Step by Step\" author=\"Steve Suehring\" isbn=\"9780735624498\"\
  \npublisher=\"Microsoft Press\" />\n```\n\n## 使用 JavaScript 加载 XML 文档\n\n你可以使用 JavaScript\
  \ 加载和操作 XML 文档。本节介绍了这种操作。\n\n#### 导入文档\n\n取决于你支持的浏览器，可以使用两种方法导入 XML 文档。以下代码以跨浏览器的方式加载\
  \ `books.xml` 文档：\n\n```\nif (window.XMLHttpRequest) {\n    var httpObj = new XMLHttpRequest();\n\
  } else {\n    var httpObj = new ActiveXObject(\"Microsoft.XMLHTTP\");\n}\nhttpObj.open(\"\
  GET\",\"books.xml\",false);\nhttpObj.send();\nvar xmlDocument = httpObj.responseXML;\n\
  ```\n\n#### 显示文档\n\n通常，XML 数据通过表格或电子表格格式可视化效果最好。图 17-1 显示了 Excel 2007 中的 books.xml\
  \ 文件。\n\n![在电子表格中表示的 XML 文件。](img/httpatomoreillycomsourcemspimages748921.png.jpg)\n\
  \n图 17-1. 在电子表格中表示的 XML 文件。\n\nHTML 表格有助于在浏览器中表示图 17-1](#ch17.html_xml_file_represented_in_a_spreadsheet\
  \ \"Figure 17-1. 在电子表格中表示的 XML 文件。\")所示的数据。在很大程度上，使用 JavaScript 显示 XML 数据需要一些文档对象模型\
  \ (DOM) 的知识，但除了加载文档本身所需的函数外，不需要其他特殊函数或方法。\n\n下一个示例创建一个名为 `displayData()` 的函数，以表格方式显示信息。\n\
  \n`readyState` 属性\n\n\n\n\n\n本书的早期版本使用 `readyState` 属性来确定 XML 文档何时加载。`readyState`\
  \ 属性是一个整数，包含五个值之一，表示正在处理的文档请求的当前状态。表 17-1 显示了 `readyState` 的取值及相应的描述。\n\n### 表 17-1.\
  \ `readyState` 属性\n\n| 值 | 描述 |\n| --- | --- |\n| `0` | 未初始化。已打开但尚未被调用。 |\n| `1`\
  \ | 已打开。已初始化但尚未发送。 |\n| `2` | 已发送。请求已发送。 |\n| `3` | 接收中。正在积极接收响应。 |\n| `4` | 已加载。已完全接收响应。\
  \ |\n\n你可以在第 18 章中更多关于 `readyState` 属性和 `onreadystatechange` 事件。\n\n显示 XML 文档中的节点和子节点需要遍历文档的层级并构建输出文档。接下来显示的函数通过遍历分级\
  \ XML 文档，将该文档的数据显示在 HTML 表格中。此代码继续了已显示的示例，其中创建了一个名为 `xmlDocument` 的变量并加载了名为 `books.xml`\
  \ 的 XML 文档：\n\n```javascript\nfunction displayData(xmlDocument) {\n    var xmlEl\
  \ = xmlDocument.getElementsByTagName(\"book\");\n    var table = document.createElement(\"\
  table\");\n    table.border = \"1\";\n    var tbody = document.createElement(\"\
  tbody\");\n\n    // 将主体添加到到表格\n    table.appendChild(tbody);\n\n    // 为新行创建表格单元\n\
  \    for (i = 0; i < xmlEl.length; i++) {\n        var row = document.createElement(\"\
  tr\");\n        // 创建行/td 元素\n        for (j = 0; j < xmlEl[i].childNodes.length;\
  \ j++) {\n            // 如果类型不是 1，则跳过\n            if (xmlEl[i].childNodes[j].nodeType\
  \ != 1) {\n                continue;\n            }\n\n            // 插入来自 XML 文档的实际文本/数据。\n\
  \            var td = document.createElement(\"td\");\n            var xmlData =\n\
  \                document.createTextNode(xmlEl[i].childNodes[j].firstChild.nodeValue);\n\
  \            td.appendChild(xmlData);\n            row.appendChild(td);\n      \
  \  }\n        tbody.appendChild(row);\n    }\n    document.getElementById(\"xmldata\"\
  ).appendChild(table);\n}\n```\n\n要将所有代码整合到网页中，你将向一个事件绑定加载和显示 XML 文件的函数。示例 17-1 {\n\
  \    var xmlEl = xmlDocument.getElementsByTagName(\"book\");\n    var table = document.createElement(\"\
  table\");\n    table.border = \"1\";\n    var tbody = document.createElement(\"\
  tbody\");\n\n    // 将主体添加到到表格\n    table.appendChild(tbody);\n\n    // 创建表格行\n \
  \   for (i = 0; i < xmlEl.length; i++) {\n        var row = document.createElement(\"\
  tr\");\n        // 创建行/td 元素\n        for (j = 0; j < xmlEl[i].childNodes.length;\
  \ j++) {\n            // 如果类型不是 1，则跳过\n            if (xmlEl[i].childNodes[j].nodeType\
  \ != 1) {\n                continue;\n            }\n\n            // 插入来自 XML 文档的实际文本/数据。\n\
  \            var td = document.createElement(\"td\");\n            var xmlData =\n\
  \                document.createTextNode(xmlEl[i].childNodes[j].firstChild.nodeValue);\n\
  \            td.appendChild(xmlData);\n            row.appendChild(td);\n      \
  \  }\n        tbody.appendChild(row);\n    }\n    document.getElementById(\"xmldata\"\
  ).appendChild(table);\n}\n\nfunction getXML() {\n    if (window.XMLHttpRequest)\
  \ {\n        var httpObj = new XMLHttpRequest();\n    } else {\n        var httpObj\
  \ = new ActiveXObject(\"Microsoft.XMLHTTP\");\n    }\n    httpObj.open(\"GET\",\"\
  books.xml\",false);\n    httpObj.send();\n    var xmlDocument = httpObj.responseXML;\n\
  \    displayData(xmlDocument);\n}\n\nvar mainBody = document.getElementById(\"mainBody\"\
  );\nEHandler.add(mainBody, \"load\", function() { getXML(); });\n\n</script>\n</body>\n\
  </html>\n```\n\n当通过网络浏览器查看时，表格显示数据的方式就像电子表格一样，所示图 17-2。![Representing books.xml\
  \ in an HTML table.](img/httpatomoreillycomsourcemspimages748923.png.jpg)\n\n###\
  \ 图 17-2. 在 HTML 表格中表示 books.xml。\n\n检查示例 17-1 中的代码可以发现一个巨大的 `for` 循环，它遍历 XML 层级结构，并在过程中构建表格行。需要注意的一点是，循环通过这段代码只查找\
  \ XML 文档中的 `Element` 节点：\n\n```javascript\n// 如果类型不是 1，则跳过\nif (xmlEl[i].childNodes[j].nodeType\
  \ != 1) {\n    continue;\n}\n```\n\n`nodeType` 为 `1` 代表一个 `XML Element` 节点。如果循环中正在检查的节点类型不是元素，代码将移动到文档的下部分。\n\
  \n你可能会在图 17-2](#ch17.html_representing_booksdotxml_in_an_html_tabl \"图 17-2. 在 HTML\
  \ 表格中表示 books.xml。\") 显示中的一个问题是不存在列标题。添加列标题需要添加一些代码。接下来的步骤将向你如何操作。\n\n#### 从 XML\
  \ 文档添加列标题\n\n1. 使用 Microsoft Visual Studio、Eclipse 或编辑器，编辑第 17 章示例文件文件夹中的 `books.htm`\
  \ 文件，你可以在配套内容中找到它。（在此步骤中，通过网络浏览器查看，books.htm 应该类似于图 17-2。）\n\n2. 在 `books.htm` 中，在\
  \ `displayData()` 方法中添加以下**粗体**所示代码（位于配套内容的 books.txt 中），替换 TODO 注释：\n\n\n\n\n\n\
  ```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\" \"http://www.w3.org/TR/html4/\n\
  strict.dtd\">\n<html>\n<head>\n<title>Books</title>\n<script type=\"text/javascript\"\
  \ src=\"ehandler.js\"></script>\n</head>\n<body id=\"mainBody\">\n<div id=\"xmldata\"\
  ></div>\n<script type=\"text/javascript\">\n\nfunction displayData(xmlDocument)\
  \ {\n    var xmlEl = xmlDocument.getElementsByTagName(\"book\");\n    var table\
  \ = document.createElement(\"table\");\n    table.border = \"1\";\n    var tbody\
  \ = document.createElement(\"tbody\");\n\n    // Append the body to the table\n\
  \    table.appendChild(tbody);\n    var row = document.createElement(\"tr\");\n\n\
  \    for (colHead = 0; colHead < xmlEl[0].childNodes.length; colHead++) {\n    \
  \    if (xmlEl[0].childNodes[colHead].nodeType != 1) {\n            continue;\n\
  \        }\n        var tableHead = document.createElement(\"th\");\n        var\
  \ colName = document.createTextNode(xmlEl[0].childNodes[colHead].nodeName);\n  \
  \      tableHead.appendChild(colName);\n        row.appendChild(tableHead);\n  \
  \  }\n\n    // Append the row to the body\n    tbody.appendChild(row);\n\n    //\
  \ Create table row\n    for (i = 0; i < xmlEl.length; i++) {\n        var row =\
  \ document.createElement(\"tr\");\n        // Create the row/td elements\n     \
  \   for (j = 0; j < xmlEl[i].childNodes.length; j++) {\n            // Skip it if\
  \ the type is not 1\n            if (xmlEl[i].childNodes[j].nodeType != 1) {\n \
  \               continue;\n            }\n\n            // Insert the actual text/data\
  \ from the XML document.\n            var td = document.createElement(\"td\");\n\
  \            var xmlData =\n                document.createTextNode(xmlEl[i].childNodes[j].firstChild.nodeValue);\n\
  \            td.appendChild(xmlData);\n            row.appendChild(td);\n      \
  \  }\n        tbody.appendChild(row);\n    }\n    document.getElementById(\"xmldata\"\
  ).appendChild(table);\n}\nfunction getXML() {\n\n    if (window.XMLHttpRequest)\
  \ {\n        var httpObj = new XMLHttpRequest();\n    } else {\n        var httpObj\
  \ = new ActiveXObject(\"Microsoft.XMLHTTP\");\n    }\n    httpObj.open(\"GET\",\"\
  books.xml\",false);\n    httpObj.send();\n    var xmlDocument = httpObj.responseXML;\n\
  \    displayData(xmlDocument);\n}\n\nvar mainBody = document.getElementById(\"mainBody\"\
  );\nEHandler.add(mainBody, \"load\", function() { getXML(); });\n\n</script>\n</body>\n\
  </html>\n```\n\n3. 在网络浏览器中查看页面。它看起来应该像这样：\n\n![从 XML 文档添加列标题](img/httpatomoreillycomsourcemspimages748925.png.jpg)\n\
  \n# 使用 Excel 2007 处理 XML 数据\n\nExcel 2007 具有许多功能，可以使得处理 XML 数据变得非常容易。Excel 可以同时导入和导出\
  \ XML 数据。事实上，当从 Excel 导出数据时，Excel 不会向 XML 文档中添加任何专有内容。以下是从 Excel 2007 导出的 `books.xml`\
  \ 文件的内容（包含在配套内容的 newbooks.xml 中）：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  \ standalone=\"yes\"?>\n<books xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  >\n        <book>\n                <title>MySQL Bible</title>\n                <author>Steve\
  \ Suehring</author>\n                <isbn>9780764549328</isbn>\n              \
  \  <publisher>Wiley Publishing Inc.</publisher>\n        </book>\n        <book>\n\
  \                <title>JavaScript Step by Step</title>\n                <author>Steve\
  \ Suehring</author>\n                <isbn>9780735624498</isbn>\n              \
  \  <publisher>Microsoft Press</publisher>\n        </book>\n</books>\n```\n\n由于\
