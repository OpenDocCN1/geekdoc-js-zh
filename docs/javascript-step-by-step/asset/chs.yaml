  \n## 最低系统要求\n\n代码可以在许多平台上运行，包括 Microsoft Windows、Linux 和 Mac。\n\n*   **处理器**。奔腾\
  \ 133 赫兹 (MHz) 或更高。（任何能够运行支持 JavaScript 浏览器的计算机。）\n*   **内存**。64 兆字节 (MB) RAM 或任何足以能够运行支持\
  \ JavaScript 浏览器的计算机内存。\n*   **硬盘**。2 MB 空闲硬盘空间。\n*   **操作系统**。Windows 98SE 或更高版本，大多数\
  \ Linux 发行版，以及 Mac OS X 版本。\n*   **显示器**。具有 640×480 或更高的分辨率和 16 位或更高的色深。\n*   **软件**。任何能够运行\
  \ JavaScript 的 Web 浏览器。Internet Explorer 6 或更高版本、Mozilla Firefox 2.0 或更高版本、Safari\
  \ 2 或更高版本、Opera 9 以及推荐 Konqueror 3.5。\n\n## 获取帮助\n\n我们尽力确保本书和随附内容的准确性。如果你遇到问题，请联系后续章节列出的相应来源寻求帮助。\n\
  \n## 获取本书和随附内容的帮助\n\n如果你对本书或其随附内容有疑问或疑虑，请先在 Microsoft 知识库中搜索有关书中已知错误或修正的支持信息，网址如下：\n\
  \n*   *[www.microsoft.com/mspress/support/search.asp](http://www.microsoft.com/mspress/support/search.asp)*\n\
  \n如果你在在线知识库中没有找到答案，请向微软学习技术支持发送你的评论或问题：\n\n*   *mspinput@microsoft.com*\n\n# 第一部分.\
  \ JavaWhat? JavaScript 的在哪里、为什么和如何\n\n# 第 1 章 JavaScript 比你想象的要多得多\n\n**阅读本章后，你将能够\n\
  \n*   理解 JavaScript 的历史。\n*   识别 JavaScript 程序的组成部分。\n*   使用 `javascript` 伪协议。\n\
  *   理解 JavaScript 在网页中的。\n*   理解 JavaScript 可以做什么和不能做什么。\n*   理解与 JavaScript 最新标准的一些更改。\n\
  \n## JavaScript 简史\n\nJavaScript 不是 Java。好了！有了这个澄清，你就可以继续学习更大、更重要的内容，例如如何制作酷的下拉菜单。正经地说，JavaScript\
  \ 是一个名为 `ECMAScript` 的规范的一种实现。你将在本章晚些部分学习更多关于 `ECMAScript` 的知识。\n\n\n\n\n\n`JavaScript`\
  \ 来自哪里？你可能并不了解 `JavaScript` 丰富且充满传奇色彩的历史——而且你可能并不那么在乎它。如果是这样的话，你可能想直接跳到下一章开始编写 `JavaScript`\
  \ 代码。当然，这样做将是一个错误——你将会错过本章后面跟随的所有精彩信息。而且，了解一些 `JavaScript` 的历史，对于理解这种语言在如今的各种环境中是如何实现的至关重要。\n\
  \n`JavaScript` 最初由 Brendan Eich 在 1995 年至 1996 年间于 `Netscape` 开发。那时，这种语言被称为 `LiveScript`。对于一个新语言来说，这是一个很棒的名字——故事本可以到此结束了。然而，由于一个遗憾的决定，营销人员采纳了意见，该语言被重命名为\
  \ `JavaScript`。混乱随之而来的。你会发现，`Java` 是当时令人兴奋的新语言，有人决定尝试通过利用 `Java` 的热度来借此获利。结果，`JavaScript`\
  \ 发现自己与 `Java` 语言联系在一起。这对 `JavaScript` 来说是一个劣势，因为 `Java` 虽然在频繁使用的方面很受欢迎，但因其名声相当糟糕而不受欢迎——开发者在网站中使用\
  \ `Java` 来展示数据或添加无用的增强功能（例如恼人的滚动文字）。用户体验受到了损害，因为 `Java` 需要一个插件才能加载到网页浏览器中，这减慢了浏览过程，并给访问者带来了困扰以及导致了无障碍问题。直到最近几年，`JavaScript`\
  \ 才开始从这种负面的 `Java` 关联中脱离。\n\n`JavaScript` 不是一种编译型语言，这使其看起来和感觉起来像一种缺乏力量的语言。但新接触 `JavaScript`\
  \ 的程序员很快就意识到它在万维网上模拟和创建交互性方面的优势和用处。在意识到这一点之前，程序员仅使用简单的超文本标记语言（`HTML`）和图形开发许多网站，而这些图形通常缺乏视觉吸引力，也缺乏与网站内容交互的能力。\n\
  \n早期的 `JavaScript` 侧重于客户端表单验证以及处理网页上的图像，以向访问者提供原始但有帮助的交互和反馈。当网站访问者填写表单时，`JavaScript`\
  \ 会立即验证网页表单的内容，而不是向服务器进行往返请求。特别是在宽带尚未普及之前的日子里，防止与服务器往返是帮助应用程序看起来更快、更响应的极佳方法——而且现在依然如此。\n\
  \n### 进入 Internet Explorer 3.0\n\n随着 1996 年 `Microsoft Internet Explorer 3.0` 的发布，`Microsoft`\
  \ 包含了对核心 `JavaScript` 支持（在 `Internet Explorer` 中被称为 `JScript`），以及对另一种脚本语言 `Microsoft\
  \ Visual Basic, Scripting Edition`（简称 `VBScript`）的支持。尽管 `JavaScript` 和 `JScript`\
  \ 相似，但它们的实现并不完全相同。因此，人们开发了方法来检测网站访问者在使用哪种浏览器，并响应相应的脚本。这一过程被称为`浏览器检测`，并在第 11 章 中进行了讨论。浏览器检测仍然在使用，尽管对于大多数应用来说被认为是不理想的。\n\
  \n### 接着是 ECMAScript\n\n1997 年中旬，`Microsoft` 和 `Netscape` 与欧洲计算机制造商协会（`ECMA`）合作发布了第一版本名为\
  \ `ECMAScript` 的语言规范，更正式的名称是 `ECMA-262`。从那时起，来自 `Microsoft` 的所有浏览器都实现了 `ECMAScript`\
  \ 标准的不同版本。其他流行的浏览器，如 `Firefox`、`Safari` 和 `Opera` 也实现了 `ECMAScript` 标准。\n\n`ECMA-262`\
  \ 版本 3 于 1999 年发布。好消息是，像 `Microsoft Internet Explorer 4.0` 和 `Netscape 4.5` 等浏览器支持版本\
  \ 3 标准，而且从那以后，每个主流浏览器都支持在 `ECMA-262` 版本 3 标准中正式化的 `JavaScript` 版本。坏消息是，每个浏览器应用该标准略有不同，因此不兼容性仍然困扰着使用\
  \ `JavaScript` 的开发者。\n\n最新版本的 `ECMAScript`（在名为 `ECMA-262` 的标准中正式发布）于 2009 年底发布，被称为\
  \ `ECMA-262` 版本 5。由于各种原因，规范的版本 4 被跳过了，以避免标准竞争提案之间的混乱。在本文写作时，`ECMA-262` 版本 5 正获得越来越广泛的支持，并且当你读到这本书时，它可能出现在\
  \ `Internet Explorer`、`Firefox`、`Opera` 和 `Safari` 等流行浏览器的版本中。\n\n要注意，作为一个将 `JavaScript`\
  \ 整合到 Web 中的开发者，你需要考虑到 `ECMA-262` 不同版本之间的差异，以及对 `JavaScript` 的许多解释。考虑到这些差异可能意味着以略微不同的方式实现脚本，并在各种浏览器和各种平台上反复测试、测试再测试。在今天的互联网上，用户对只在一个浏览器中运行的设计糟糕的应用几乎没有容忍度。\n\
  \n### 重要提示\n\n你必须在多个浏览器中测试你的网站——包括你认为不会在 `Internet Explorer` 浏览器使用的应用程序。即使你确定你的应用程序只会在\
  \ `Internet Explorer` 中使用，或者这是你官方支持的所有内容，你也应该在其他浏览器中测试。这不仅对于安全很重要，而且显示了你是一个理解当今互联网技术的严谨开发者。\n\
  \n### 这么多标准……\n\n如果你认为 `JavaScript` 编程标准的定义很松散，你是对的。每个浏览器对 `JavaScript` 的支持略有不同，这使得你的工作——以及我的工作——变得更加困难。尝试编写所有这些细微差别比编写由单一特定实体实现的语言（如特定版本的\
  \ `Microsoft Visual Basic` 或 `Perl`）更具挑战性。你的工作（我的工作）是跟踪这些差异并在必要时考虑到它们，并尽可能在它们之间寻找共同点。\n\
  \n### DOM\n\n另一个与 JavaScript 程序员相关的演进标准是由世界万维网联盟会（`W3C`）开发的`文档对象模型 (DOM)` 标准。`W3C`\
  \ 将 `DOM` 定义为“一种与平台和语言无关的接口，允许程序和脚本动态地访问和更新文档的内容、结构和样式”。对你来说，这意味着你可以根据 Web 浏览器遵循的规范以动态方式开发网页。`DOM`\
  \ 为 `HTML` 和可扩展标记语言（`XML`）文档创建树形结构，并允许对对象进行脚本化。`JavaScript` 在许多重要功能上与 `DOM` 深度交互。\n\
  \n与 `JavaScript` 类似，每个浏览器对 `DOM` 的解释都不同，这让 JavaScript 程序员的生活更有趣。`Internet Explorer\
  \ 4.0` 和之前的 `Netscape` 版本包含了对早期 `DOM`（被称为 `Level 0`）的支持。如果你使用 `Level 0 DOM`，你可以相当确定会在这些浏览器以及随后的所有浏览器中找到对\
  \ `DOM` 的支持。\n\n`Microsoft Internet Explorer 5.0` 和 `5.5` 包含了对 `Level 1 DOM` 的某些支持，而\
  \ `Windows Internet Explorer 6.0` 及更高版本包含了对 `Level 2 DOM` 的某些支持。最新的 `Firefox`、`Safari`\
  \ 和 `Opera` 支持 `Level 2 DOM`。`Safari` 提供了 `Webkit` 渲染引擎的表示。`Webkit` 渲染引擎被用作 `iPhone`\
  \ 和 `iPad` 等设备以及基于 `Android` 设备上浏览器的基础。\n\n\n\n\n\n在学习 JavaScript 标准和相关的 DOM 标准时，你应该汲到的唯一教训是：你需要特别注意你所编写的代码（这并不意外）以及用于实现这些代码的语法。如果你不这样做，JavaScript\
  \ 可能会惨遭失败，并阻止你的页面在特定浏览器中渲染。第 10 章 将将更详细地介绍 DOM。\n\n### 提示\n\nW3C 有一个应用程序可以测试你的 浏览器对各种\
  \ DOM 级别的支持情况。你可以在 *[`www.w3.org/2003/02/06-dom-support.html`](http://www.w3.org/2003/02/06-dom-support.html)*\
  \ 找到该程序。\n\n# JavaScript 程序包含什么？\n\n一个 JavaScript 程序由 `tokens`（标记）、`operators`（运算符）和\
  \ `identifiers`（标识符）组成的 `statements`（语句）组成，它们按照 JavaScript 解释器（包含在大多数浏览器中）能够理解的顺序排列。这句话听起来很绕口，但对于用过几乎任何其他语言编程的人来说，这些语句实际上并不那么复杂。一个语句可能是：\n\
  \n```\nvar smallNumber = 4;\n```\n\n在该语句中，一个标记或保留字——`var`——后面跟着其他标记，例如一个标识符（`smallNumber`）、一个运算符（`=`）和一个字面量（`4`）。（你将在书的其余部分学习更多关于这些元素的知识。）该语句的作用是将名为\
  \ `smallNumber` 的变量设置为整数 `4`。\n\n与任何编程语言一样，语句按照某种顺序组合，以使程序执行一个或多个功能。JavaScript 以它自己的方式定义函数，你将在\
  \ 第 7 章 中读到更多相关内容。JavaScript 定义了几个你可以在程序中使用的内置函数。\n\n## 使用 `javascript` 伪协议和函数\n\
  \n1.  打开如 Internet Explorer 或 Firefox 等网络浏览器。\n2.  在地址栏中输入以下代码并按回车键：\n\n    ```\n\
  \    javascript:alert(\"Hello World\");\n    ```\n\n    在你按下回车键后，你会看到一个类似下面的对话框：\n\
  \n    ![Using the javascript pseudo-protocol and a function](img/httpatomoreillycomsourcemspimages748544.png.jpg)\n\
  \n    恭喜！你刚刚编写了你的第一个（尽管并不好用）JavaScript 代码。然而，仅仅通过这小段代码，就包含了两个你在 JavaScript 编程过程中可能会使用的重要项目：浏览器中的\
  \ `javascript` 伪协议标识符，以及更重要的 `alert` 函数。你将在后面的章节中更详细地检查这些项目；目前，你学到了未来会用到的东西就足够了！\n\
  \nJavaScript 还是 `event-driven`（事件驱动）的，这意味着它可以响应某些事件或“发生的事情”，例如鼠标点击或表单字段内的文本更改。将\
  \ JavaScript 连接到事件是 JavaScript 许多常见用途的核心。在 第 11 章 中，你将看到如何使用 JavaScript 响应事件。\n\n\
  # JavaScript 在网页上的放置\n\n如果你是 HTML 新手，你目前只需要知道的是，它使用一对括在方括号内的匹配标签来界定网页中的元素。结束标签以斜杠字符（`/`）开头。元素可以相互嵌套。JavaScript\
  \ 位于网页的 `<head> </head>` 和/或 `<body></body>` 标签内部的 `<script>` 标签内，例如所示：\n\n```\n\
  <html\n<head>\n<title>A Web Page Title</title>\n<script type=\"text/javascript\"\
  >\n// JavaScript 写在这里这里\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
  >\n// JavaScript 也可以放在这里\n</script>\n</body>\n</html>\n```\n\n放置在 `<body>` 标签内的\
  \ JavaScript 会会在浏览器遇到它时执行，这在你需要使用 JavaScript 函数向文档写入时非常有帮助，如下（函数调用用粗体显示）：\n\n```\n\
  <head>\n<title>A Web Page Title</title>\n<script type=\"text/javascript\">\n// JavaScript\
  \ 写在这里这里\n</script>\n</head>\n<body>\n<script type=\"text/javascript\">\ndocument.write(\"\
  hello\");\ndocument.write(\" world\");\n</script>\n</body>\n</html>\n```\n\n由于浏览器加载\
  \ JavaScript 的方式，目前在 HTML 中放置 JavaScript 的最佳实践是将 `<script>` 标签放置在 `<body>` 元素的末尾，而不是\
  \ `<head>` 元素中。这样做有助于确保当浏览器在加载 JavaScript 文件阻塞输入时，页面内容能够加载。\n\n当你在可扩展超文本标记语言（XHTML）页面上使用\
  \ JavaScript 时，小于号（`<`）和符号（`&`）会被解释为 XML，这可能会给 JavaScript 带来问题。为了解决这个问题，请在 XHTML\
  \ 页面中使用以下语法：\n\n```\n<script type=\"text/javascript\">\n<![CDATA[\n    // JavaScript\
  \ 写在这里这里\n]]>\n</script>\n```\n\n不符合 XHTML 标准的浏览器不会正确解释 CDATA 。你可以通过将 CDATA 放置在\
  \ JavaScript 注释中来解决这个问题——即以两个正斜杠（`//`）开头的一行或多行，如下所示：\n\n```\n<script type=\"text/javascript\"\
  >\n//<![CDATA[\n    // JavaScript 写在这里这里\n//]]>\n</script>\n```\n\n是的，代码确实很丑。不过，这有一个简单的解决办法：使用外部\
  \ JavaScript 文件。在 第 2 章 中，你将具体学习如何完成这个简单的任务。\n\n### 文档类型\n\n如果你已经在 Web 领域编程了一段时间，你可能已经熟悉文档类型声明（Document\
  \ Type declarations），或者常说的 DOCTYPE 声明。在设计网页时，你可以完成的最任务之一是在页面顶部包含一个准确且符合语法的 DOCTYPE\
  \ 声明部分。DOCTYPE 声明（缩写为 DTD）让浏览器（或其他解析程序）知道在解析文档元素时将遵循的规则。\n\nHTML 4.01 的 DOCTYPE\
  \ 声明示例如下：\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n   \"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n```\n\n如果你使用 Microsoft Visual Studio 2005 或更高版本创建 Web 项目，每个页面会自动获得一个针对 XHTML\
  \ 1.0 标准的 DOCTYPE 声明，如下：\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \ \"http://www.w3.org/TR\n/xhtml1/DTD/xhtml1-transitional.dtd\">\n```\n\nHTML 版本\
  \ 5 使用了更简单的 DOCTYPE：\n\n```\n<!DOCTYPE html>\n```\n\n如果你没有声明 DOCTYPE，浏览器将使用名为 `Quirks\
  \ Mode`（怪异模式）的模式来解释页面。退回到怪异模式意味着文档的最终外观可能与你的意图不同，特别是当通过多个浏览器查看时。\n\n如果你确实声明了 DOCTYPE，确保生成的\
  \ HTML、级联样式表（也称为 CSS）和 JavaScript 也符合 Web 标准是非常重要的，这样文档就可以被最广泛的受众按预期方式查看，无论使用何种界面或浏览器。HTML\
  \ 和 CSS 验证将在本书的 第 15 章 中进行讨论。W3C 在 *[`validator.w3.org/`](http://validator/w3.org/)*\
  \ 提供了一个在线验证器，你可以用它来验证任何公开的网页。\n\n### 提示\n\n在习惯按照标准编码之前，请定期使用标记验证器，并在向公众发布 Web 项目之前务必检查有效性。\n\
  \n# JavaScript 能做什么\n\nJavaScript 很大程度上是一种补充性语言，这意味着很少有整个应用程序在没有 HTML 等其他语言辅助且没有在\
  \ 浏览器中呈现的情况下仅用 JavaScript 编写。某些 Adobe 产品支持 JavaScript，但 JavaScript 主要用于 Web 相关的编程。\n\
  \n\n\n\nJavaScript 也是 AJAX（异步 JavaScript 和 XML）缩写中的 J，它是 Web 2.0 现象的宠儿。尽管如此，JavaScript\
  \ 是一门日常用语言，提供了当今网页访问者所期望、甚至可能要求的交互性。\n\nJavaScript 可以在应用程序的客户端执行许多任务。例如，它可以通过创建下拉菜单、转换页面上的文本、向页面添加动态元素以及帮助表单填写，为网站添加必要的交互性。\n\
  \n在学习 JavaScript 能做什么（这本书的关注点）之前，你需要了解 JavaScript 不能不能做什么，但请注意，这两个部分的讨论都不是尽的。\n\n\
  # JavaScript 不能做什么\n\nJavaScript 无法执行的许多操作是由于 JavaScript 的使用在某种程度上限于网页浏览器环境。本节将探讨\
  \ JavaScript 无法执行的一些任务，以及一些 JavaScript 不应该执行的任务。\n\n## JavaScript 无法被强制施于客户端\n\n\
  JavaScript 的功能依赖于另一个接口或宿主程序。该主机程序通常是客户端的浏览器，也称为 `user agent`（用户代理）。由于 JavaScript\
  \ 是一种客户端语言，它只能执行客户端允许它做的事情。\n\n一些人仍在使用完全不支持 JavaScript 的旧浏览器。另一些人由于辅助程序、文本读器以及其他辅助浏览体验的插件软件，无法支持\
  \ JavaScript 的许多高级功能。还有人可能仅仅因为可以这样做而选择禁用 JavaScript，可能是出于安全考虑（无论是感知的还是真实的），或者是因为由于弹窗广告等某些困扰导致\
  \ JavaScript JavaScript 声誉不佳。\n\n无论出于什么原因，你都需要进行一些额外工作，以确保你设计的网站对那些没有 JavaScript\
  \ 的个人可用。我已经能听到你的抗议了：“但这个功能真的很[在此处插入你自己的最高级词：酷、棒、必不可少、漂亮、极了]。” 无论你的功能有多出色，你都有可能从更好的互操作性和更多的网站访问者中获益。在本文章后后的使用\
  \ JavaScript 的技巧 部分中，我提供了一些你可以遵循的提示，以便在你的网站上恰当地使用 JavaScript。\n\n从另一个角度来考虑这个问题可能会有所帮助。当你构建一个从\
  \ Microsoft Internet Information Services (IIS) 6.0 服务的 Web 应用时，你可以假设该程序在任何地方从 IIS\
  \ 6.0 服务器提供时通常都能正常工作。同样，当你为 Apache 2 构建应用程序时，你可以相当确定它会在其他 Apache 2 安装上运行。然而，对于 JavaScript\
  \ 则不能做出同样的假设。当你编写一个在桌面电脑上运行良好的应用程序时，你无法保证它在其他人的电脑上也能运行。你无法控制你的程序在发送到客户端后将如何运行。\n\
  \n## JavaScript 无法保证数据安全\n\n由于 JavaScript 完全运行在客户端，因此开发者必须学会“放手”。正如你预期的那样，放弃对程序的控制会产生严重影响。一旦程序位于客户端的计算机上，客户端可以在将数据发回服务器之前对数据做许多恶劣的事情。与其他任何\
  \ Web 编程一样，你永远不要信任从客户端返回的任何数据。即使你已经使用 JavaScript 函数来验证表单内容，当它到达服务器时，你仍然必须再次验证这些输入。禁用了\
  \ JavaScript 的客户端可能会通过 Web 表单传回垃圾数据。如果你天真地认为你的客户端 JavaScript 函数已经检查了数据以确保其有效性，你可能会发现无效数据回到了服务器，导致不可预见且可能危险的后果。\n\
  \n### 重要\n\n记住，JavaScript 在访问者的计算机上是可以被禁用的。你不能依靠小花招来成功，例如使用 JavaScript 禁用右键点击或防止访问者查看源代码，而且你不应该将它们作为安全措施。\n\
  \n## JavaScript 无法跨域\n\nJavaScript 开发者还必须意识到 `同源策略`（Same-Origin Policy），该策略规定运行在一个域名内的脚本没有权限访问另一个\
  \ Internet 域的属性，无法影响来自另一个域的脚本和数据。例如，JavaScript 可以用于打开一个新的浏览器窗口，但该窗口的内容在某种程度上受到调用脚本的限制。当我的网站（`braingia.org`）的页面包含\
  \ JavaScript 时，该页面无法访问从不同域（如 `microsoft.com`）执行的任何 JavaScript。这就是同源策略的精髓：JavaScript\
  \ 必须在相同位置执行或源自相同位置。\n\n在框架（frames）和 AJAX 的 `XMLHttpRequest` 对象范围内，同源策略经常需要应对的限制，可能会向不同的\
  \ Web 服务器发送多个 JavaScript 请求。随着 Windows Internet Explorer 8 的推出，微软引入了对 `XDomainRequest`\
  \ 对象的支持，允许对其他域的数据进行有限访问。我在第 19 章 中讨论了跨域请求的一些变通方法和更完整的方法。目前，请意识到 JavaScript 限于在你自己的浏览器窗口中执行任务。\n\
  \n## JavaScript 不负责服务器\n\n在开发服务器端代码（如 Visual Basic .NET 或 PHP（PHP 是一个递归缩写，代表 `PHP:\
  \ Hypertext Preprocessor`））时，你可以相当确定服务器将实现某些功能，例如与数据库通信或提供 Web 应用程序所需模块的访问。JavaScript\
  \ 无法访问服务器端变量。例如，JavaScript 无法访问位于服务器上的数据库。JavaScript 代码限于脚本运行的平台内部可以进行的操作，该平台通常是浏览器。\n\
  \n如果你熟悉服务器端编程，你需要在思维上做的另一个转变是：对于 JavaScript，你必须在许多不同的客户端上测试代码，以了解特定客户端的能力。当你编写服务器端代码时，如果服务器没有实现给定的功能，你会立即知道，因为服务器端脚本在测试时会失败。除了坏心的管理员之外，后端服务器代码实现不会随心所欲地改变，因此你更容易知道自己写和不能写什么。但你无法预测旨在客户端运行的\
  \ JavaScript 代码。\n\n\n\n\n网站的设计绝不是、也永远不会是一个完全客观的过程。一个网站的目标可能是提供信息，这决定了某种设计方法；而另一个网站的目标可能是连接到某个应用程序，因此需要专门的设计和功能。尽管如此，许多流行且看似设计良好的网站在某些方面上具有共同点。我尝试在这里对这些共同点进行分解，尽管请记住，我并没有列出一份详尽的列表，这些项目反映的是一个人的观点。\n\
  \n一个设计良好的网站会做到以下几：\n\n*   **功能重于形式**。当用户访问网站时，他或她通常想要获取信息或执行任务。你的网站越难浏览，用户就越可能跳转到另一个浏览体验更好的网站。\n\
  \n    动画和闪烁的元素层来去去，但留下的仍然以专业、易于获取的方式呈现基本信息的网站。使用最酷炫的动画软件或 Web 技术会让我想起使用 `HTML` `<blink>`\
  \ 标签的时代。对于那些从未见过它实际运行效果的人来说，`<blink>` 标签会导致其中的文本在屏幕上消失并重新出现。几乎所有的 Web 开发者似乎都讨厌 `<blink>`\
  \ 标签以及它对网页的影响。这些开发者应当明智地记住，今天网页上令人兴奋的功能或特殊特效将是明天的 `<blink>`。成功的网站坚持基础，并且仅在内容需要时才使用这些类型的元素。\n\
  \n    使用站点地图（site map）、备用标签（alt tags）和简单的导航工具等元素，不要要求使用特殊的软件或插件来查看网站的主要内容。我经常访问一个网站，却因为需要某个插件或这个或那个播放器的最新版本（而我并没有）而无法浏览。\n\
  \n    尽管站点地图、备用标签和简单导航看起来可能有些过时，但它们对于无障碍访问（accessibility）来说是不可或缺的。文本阅读器和其他让残障人士能够朗读或浏览网站的技术会使用这些辅助功能，并且经常在处理复杂的\
  \ `JavaScript` 时遇到问题。\n\n*   **遵循标准**。Web 标准的存在是为了被遵循的，忽视它们将自负其后果。使用正确的 `DOCTYPE`\
  \ 声明和格式良好的 `HTML` 有助于确保你的网站在访问者面前显示正常。强烈建议使用 `W3C` 的标记验证工具进行验证。如果你的网站坏了，请修复它！\n\n\
  *   **在多个浏览器中正确渲染**。即使在 Internet Explorer 拥有 90% 市场份额时，程序员忽略其他浏览器也不是一个好主意。这样做通常意味着无障碍访问也被忽视了，因此使用文本阅读器或其他插件的人无法使用该网站。使用\
  \ Microsoft Windows 其他操作系统的用户访问这些网站也可能无好运。\n\n    尽管 Internet Explorer 仍然是 Web 访问者的主流，但很有可能每\
  \ 10 个访问者中至少有 3 或 4 人在使用不同的浏览器。当然，这种差异很大程度上取决于主题。受众的技术性越高，你就越需要适应 Internet Explorer\
  \ 以外的浏览器。因此，如果你的网站吸引技术受众，你可能需要网站在 `Firefox`、`Safari` 甚至 `Lynx` 中运行。\n\n    无论网站的主题是什么，你都不希望因为用户的浏览器选择而拒绝他们。想象一下一个因为客人的鞋子就拒绝了\
  \ 10 个潜在客户中 3 个的店主。这家店经营不了多久——或者至少它不会那么成功。\n\n    如果你努力遵循 Web 标准，可能你已经做了支持多个浏览器所需的大部分工作。避免为你的网站使用专有插件是确保网站正确渲染的另一种方法。你只需看向\
  \ Apple iPad 就能看到一个流行但因为不支持原生 `Flash` 或 `Java` 而导致使用受限的设备。由于这个原因，创建遵循标准并避免专有插件的网站可以确保你的网站被最广泛的观众看到。\n\
  \n*   **在适当的时间使用适当的技术**。提到插件，一个设计良好的网站不会过度或误用技术。在视频网站上，播放视频是恰当。同样，在音乐网站上，播放背景音乐是恰当。在其他网站上，这些功能可能就不那么恰当。如果你觉得你的网站需要播放背景音乐，请回到起点检查你起初为什么要建立网站！每想起我访问过的一个律师网站，我仍然感到发抖。该网站在没有我干预的情况下开始播放律所吉祥曲。朋友不要让朋友在自己的网站上使用背景音乐，除非你的朋友是\
  \ Rush 乐队的成员而你正在制作该乐队的网站。\n\n## JavaScript 的位置\n\n今天的 Web 仍在进化。过去一年中流行的运动之一被称为*非侵入脚本*（unobtrusive\
  \ scripting）。非侵入脚本范式是更大运动——行为分离（behavioral separation）的一部分。行为分离要求结构与样式分离，并将这两者都与行为分离。在这种模型中，`HTML`\
  \ 或 `XHTML` 提供结构，而 `CSS` 提供样式，`JavaScript` 提供行为。`JavaScript` 是非侵入的；它不会产生干扰。如果浏览器不支持\
  \ `JavaScript`，网站仍然可以工作，因为访问者可以使用其他方式使用网站。\n\n    适当应用，非侵入脚本意味着不假设 `JavaScript`\
  \ 是可用的，并且 `JavaScript` 的失败将以优雅的方式进行。优雅降级（Graceful degradation）帮助页面在没有 `JavaScript`\
  \ 的情况下保持功能，或者使用适当的方法在网站需要时使 `JavaScript` 可用。其中一种方法在第 11 章 中介绍。\n\n    我是非侵入脚本的支持者，因为这意味着遵循了标准，并且生成的网站遵循我在上一节中分享的四项建议。遗憾的是，情况并不总是如此。你可以分离\
  \ `HTML`、`CSS` 和 `JavaScript` 却仍然使用专有标签，但当你以非侵入的方式编程时，你倾向于更关注细节，并更在意最终结果符合标准。\n\n\
  在整本书中，我努力不仅向你展示 `JavaScript` 的基础知识，还有如何有效且尽可能非侵入地使用 `JavaScript` 的最佳方法。\n\n### 关于\
  \ JScript、JavaScript 以及本书的说明\n\n本书涵盖了由 `ECMA` 标准定义的 `JavaScript`，版本从早期一直直到最新的版本\
  \ 5。在某些章节中，我强调了与 `JScript` 和 `JScript .NET` 相关的信息。关于仅限 `JScript` 的额外参考，我推荐以下网站：\n\
  \n*   `JScript (Windows Script Technologies) [`msdn.microsoft.com/en-us/library/hbxc2t98.aspx`](http://msdn.microsoft.com/en-us/library/hbxc2t98.aspx)`\n\
  \n## 网站应该支持哪些浏览器？\n\n向下兼容长期以来一直是 Web 开发者的一个问题。选择支持哪些浏览器版本是在新浏览器中提供的最新功能与旧浏览器所需的兼容功能之间进行权衡。对于网站应该支持哪些浏览器，没有硬性规定，所以答案是：取决于情况。\n\
  \n\n\n\n你的决定取决于你想对网站做什么处理，以及你是否更看重使用旧硬件和软件的人的访问，还是更看重后期浏览器版本提供的额外功能。某些浏览器因为太旧而无法支持，因为它们无法正确渲染\
  \ CSS，更不用说 JavaScript 了。支持多个浏览器版本的关键是在它们内部进行测试。\n\n从微软获取 MSDN 账户将让你访问旧版产品，包括旧版本的\
  \ Internet Explorer，这样你就可以看到你的网站对 Internet Explorer 4.0 访问的反应。额外的资源是应用程序兼容性虚拟电脑镜像（Application\
  \ Compatibility Virtual PC Images），可以从微软免费获取。这些镜像允许你使用包含 Internet Explorer 6.0 和\
  \ Windows Internet Explorer 7 等浏览器的限版 Microsoft Windows。更多信息请参见：[`www.microsoft.com/downloads/details.aspx?FamilyId=21EABB90-958F-4B64-B5F1-73D0A413C8EF&displaylang=en`](http://www.microsoft.com/downloads/details.aspx?FamilyId=21EABB90-958F-4B64-B5F1-73D0A413C8EF&displaylang=en)。\n\
  \n许多网页设计和 JavaScript 函数不需要新版本的网络浏览器。然而，正如解释过的，验证你的网站在各种浏览器中正确渲染始终是一个好主意。请访问 [`browsers.evolt.org/`](http://browsers.evolt.org/)\
  \ 查看许多历史版本浏览器的存档链接。即使你无法在多个浏览器中进行广泛测试，你也可以设计网站使其以优雅的方式失败。你希望网站无论使用何种浏览器都能适当渲染。\n\
  \n# ECMAScript 第 5 版有什么新？\n\n当第 5 版在 2009 年引入时，ECMAScript 262 标准进行了若干增强。本节将介绍其中的一些增强和变化。这些更改大部分与旧版本的网络浏览器不向下兼容。然而，随着新版本浏览器的发布，ECMAScript\
  \ 262 版本 5 引入的更改将开始出现并在跨浏览器 Web 应用中使用。\n\n## 新的数组方法\n\nECMA-262 版本 5 为数组引入了几个新方法。这些包括一个用于遍历数组元素的\
  \ `foreach` 方法，以及一个 `map` 方法、一个 `filter` 方法以及其他用于确定索引和缩小数组尺寸的方法。第 8 章 检查了数组并对这些新方法进行了一些讨论。\n\
  \n## 对象属性的新控制\n\n在第 8 章 中讨论的对象属性具有更高的灵活性。ECMA-262 版本 5 引入了 `get` 和 `set` 函数，它们分别在检索属性或为属性赋值时被调用。你可以通过\
  \ `writable`、`configurable` 和 `enumerable` 属性控制对属性的访问。例如，属性可能有一个值，你可以将其配置为非枚举，这意味着该属性在对象迭代时不会被返回。考虑这段代码：\n\
  \n```\n{\n   value: \"testvalue\",\n   enumerable: false\n}\n```\n\n如果通过 `for` 循环，该值将不会被返回。如果这种语法还不完全理解，请不要气馁。随后的章节将详细检查对象的创建和迭代。\n\
  \n## 新的 JSON 对象\n\nJavaScript 对象表示法 (JSON) 是一种数据交换的方法，通常用于运行 JavaScript 的客户端应用程序（如\
  \ 浏览器）与服务器之间。JSON 数据交换比 XML 简单得多，尤其是在 JavaScript 应用程序中，因此经常用作 AJAX 应用的替代数据格式。\n\n\
  ECMA-262 版本 5 在语言规范中添加了原生的 `JSON` 对象。本书主要在第四部分 中讨论 JSON。\n\n## 日期对象的更改\n\nECMA-262\
  \ 版本 5 为 `Date` 对象增加了新方法，用于解析和生成 ISO 格式的日期。`toISOString()` 方法生成 ISO-8601 格式的输出，如下：\n\
  \n* 2011-03-12T18:51:50.000Z\n\n## 严格模式\n\nECMA-262 版本 5 引入了一种新的代码执行模式，称为 `strict\
  \ mode`。在严格模式下，JavaScript 引擎使用一组更严格的语法检查，有助于发现代码中的问题，例如编码错误或未声明的变量。\n\n## 浏览器支持\n\
  \nECMA-262 版本 5 引入了许多更改和增强，影响了开发者如何使用 JavaScript 编程。遗憾的是，这些更改在旧版浏览器中将不受支持，并且短期内\
  \ Internet Explorer 的支持有限。你可以在 [`kangax.github.com/es5-compat-table/`](http://kangax.github.com/es5-compat-table/)\
  \ 找到包含许多流行浏览器及其 ECMA-262 版本 5 某些功能支持情况的性表。\n\n为了解决旧版浏览器缺乏 ECMA-262 版本 5 支持的问题，你需要编写考虑这些因素的代码，或者使用\
  \ jQuery 等 JavaScript 库。本书在第 21 章 中涵盖了各种 JavaScript 库。\n\n# 练习\n\n| 1. | 正或错：JavaScript\
  \ 由标准机构定义并受所有网络浏览器支持。 |\n| 2. | 正或错：当机器禁用了 JavaScript 的访客访问你的网站时，你应该阻止其对网站的访问，因为没有正理由禁用\
  \ JavaScript。 |\n| 3. | 创建一个 JavaScript 定义块，该块通常出现在 HTML 页面的 `<head>` 或 `<body>`\
  \ 块中。 |\n| 4. | 正或错：在 `DOCTYPE` 定义块中声明正在使用的 JavaScript 版本是非常重要的。 |\n| 5. | 正或错：JavaScript\
  \ 既可以出现在 HTML 页面的 `<head>` 块中，也可以出现在 `<body>` 文本。 |\n\n# 第 2 章 使用 JavaScript 开发\n\
  \n**阅读本章后，你将能够：**\n\n*   理解使用 JavaScript 开发的可用选项。\n*   为 JavaScript 开发配置你的计算机。\n\
  *   使用 Microsoft Visual Studio 2010 创建并部署 JavaScript 应用程序。\n*   使用 Eclipse 创建并部署\
  \ JavaScript 应用程序。\n*   使用记事本（或其他编辑器）创建 JavaScript 应用程序。\n*   理解调试 JavaScript 的选项。\n\
  \n## JavaScript 开发选项\n\n由于 JavaScript 不是编译语言，你不需要任何特殊的工具或开发环境来编写和部署 JavaScript 应用程序。同样，你不需要特殊的服务器软件来运行这些应用程序。因此，创建\
  \ JavaScript 程序的选项几乎是无限的。\n\n你可以在任何文本编辑器中编写 JavaScript 代码；在你任何用于编写超文本标记语言 (HTML)\
  \ 和级联样式表 (CSS) 文件的程序中编写；或者在如 Visual Studio 等强大的集成开发环境 (IDE) 中编写。你甚至可能同时使用所有三种方法。你最初用\
  \ Visual Studio 开发 Web 应用，但随后发现使用记事本等简单文本编辑器来微调一些 JavaScript 非常方便。最终，使用你最熟悉的工具即可。\n\
  \n本书主要讨论如何使用 Visual Studio 使用 JavaScript 开发，但有时我可能会推荐（并演示）使用如记事本或 Vim（你可以在这里获取：[`www.vim.org`](http://www.vim.org)）等编辑器。在其他时候，你可以通过使用\
  \ `:` 伪协议标识符在浏览器的地址栏中输入 JavaScript 代码，正如你在第 1 章 中看到的那样。\n\n\n\n\n\n当你开发 JavaScript\
  \ 一段时间后，你会发现你自己在每个网页上都会做一些相同的事情。在这种情况下，你只需要简单地将重复的代码复制并粘贴到你正在开发的网页中。更好的是，你可以创建一个包含常用函数的外部文件，然后在你开发的整个网站中中使用这些函数。第\
  \ 10 章 提供了更多关于函数的信息，尽管你在前 10 章中会随处看到函数的用法。\n\n## 配置你的环境\n\n本节将介绍使用几种不同的工具进行 JavaScript\
  \ 开发。你应该能够使用任何你觉得最顺手的工具来进行 JavaScript 和网站开发，因此不要将此列表视为详尽的或带有偏见的工具列表。\n\n一个实用的 JavaScript\
  \ 开发工具是 Visual Studio 2010。安装 Visual Studio 2010 时附带了一个简单的 Web 服务器——ASP.NET 开发服务器，这使得部署和测试本书中的应用程序变得稍微简单。然而，这并不意味着你应该为了\
  \ JavaScript 开发而专门去购买 Visual Studio 2010。如果你选择使用 Eclipse（本章讨论的第二个工具），你仍然可以测试你编写的\
  \ JavaScript 代码。同样，即使你完全不用 IDE，也可以测试 JavaScript 代码。\n\nWeb 开发另一个选项是 Microsoft Visual\
  \ Web Developer 2010 Express。该工具可以在 *[`www.microsoft.com/express/Web/`](http://www.microsoft.com/express/Web/)*\
  \ 获取，它提供了 Visual Studio 界面，以及专为 Web 开发设计的免费包，其中包含几个工具和插件。\n\n对于大多数 JavaScript 开发，你绝对不需要\
  \ Web 服务器。显著的例外是你使用异步 JavaScript 和 XML (AJAX) 进行开发时。AJAX 无法使用 `file://` 协议，除了 第\
  \ 1 章 中涵盖的同源策略之外，如果没有 Web 服务器 AJAX 将无法工作。结论是：如果你的未来涉及 AJAX 开发，你需要一个 Web 服务器。\n\n\
  尽管有 AJAX，但如果你手头有一个 Web 服务器，开发确实会变得简单一点。任何 Web 服务器都可以，因为你真正想做的只是提供 HTML 和 JavaScript，可能为了好玩再提供一点\
  \ CSS。我在 Apache 方面非常顺利，它可以在 *[`httpd.apache.org`](http://httpd.apache.org)* 获取。Apache\
  \ 运行在许多平台上，包括 Microsoft Windows 平台，并且一直是互联网上最流行的 Web 服务器。\n\n配置 Apache 或任何 Web 服务器超出了本书的范围，再次，不需要\
  \ Web 服务器。Apache 网站有一些关于在 Windows 上安装 Apache 的良好教程，如果你使用几乎任何版本的 Linux，Apache 可能已经安装好了，或者很容易安装。书书中使用的许多示例无论你是使用\
  \ Web 服务器还是仅在本地查看示例都可以运行。然而，要利用使用 AJAX 的示例，Web 服务器是必须的。\n\n## 使用 Visual Studio 2010\
