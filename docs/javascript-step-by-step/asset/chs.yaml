  \ (SSL) 才在 HTTP 方法之上提供一层安全性。需要注意的是，使用 `POST` 方法并隐藏输入数据，且在使用 SSL 时应使用 `POST` 方法，因为\
  \ `GET` 方法会将参数直接放在 URL 上，无论是否使用 SSL 都会被看到。\n\n2. 使用标准 HTML 的响应通过 `responseText`\
  \ 方法检索，并可以包含通过 HTTP 获取的任何内容。可扩展标记语言 (XML) 响应必须通过 `responseXML` 方法获取，并且必须由服务器作为 XML\
  \ 内容类型提供。JavaScript 对象表示法 (JSON) 响应是 JavaScript 响应；因此，它们比其他方法具有某些性能优势。\n\n3. 此解决方案在章中已讨论过，但这里是异步调用（请根据你的环境适当替换\
  \ `YOUR SERVER`）：\n\n\n\n\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html\n<head>\n<title>Async</title>\n\
  </head>\n<body>\n<div id=\"xmldata\"></</div>\n<script type=\"text/javascript\"\
  >\nfunction readyAJAX() {\n    try {\n        return new XMLHttpRequest();\n   \
  \ } catch(e) {\n        try {\n            return new ActiveXObject('Msxml2.XMLHTTP');\n\
  \        } catch(e) {\n            try {\n                return new ActiveXObject('Microsoft.XMLHTTP');\n\
  \            } catch(e) {\n                return \"A newer browser is needed.\"\
  ;\n            }\n        }\n    }\n}\nvar requestObj = readyAJAX();\nvar url =\"\
  http://YOUR SERVER/sum.php?num1=2&num2=2\";\nrequestObj.open(\"GET\",url,true);\n\
  requestObj.send();\nrequestObj.onreadystatechange = function() {\n    if (requestObj.readyState\
  \ == 4) {\n        if (requestObj.status == 200) {\n            alert(requestObj.responseText);\n\
  \        } else {\n            alert(requestObj.statusText);\n        }\n    }\n\
  }\n</script>\n</body>\n</html>\n```\n\n`sum.php` 文件是一个非常简陋且安全措施不足的 PHP 服务端程序，其内容如下：\n\
