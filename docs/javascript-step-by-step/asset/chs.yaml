  \ propt in star) {\n    alert(propt);\n}\n```\n\n你的任务是修改此代码，在一个单一对话框中显示所有星星名称，而不是每个星星显示一个对话框。\
  \ |\n\n\n\n\n*   获取有关访问者屏幕的信息，包括可用的高度和宽度。\n*   使用 JavaScript 检测浏览器是否启用了 Java。\n\
  *   解析浏览器发送的查询字符串。\n\n# 介绍浏览器\n\n在本书的这一章节之前，你主要是在抽象层面复习 JavaScript。本章将开始介绍你如何在现实世界中应用\
  \ JavaScript。\n\n写这些话让我觉得有点傻傻的，但由于这很重要，所以我还是得说出来：*浏览器是 JavaScript 编程的核心*。像 Rhino\
  \ *([`www.mozilla.org/rhino/`](http://www.mozilla.org/rhino/))* 这样的项目想要改变这一点，但理解浏览器提供的环境，对于编写能够在多个平台、多个浏览器上良好运行的优质\
  \ JavaScript 代码至关重要。本节将向你介绍浏览器对象模型（Browser Object Model）。\n\n## 浏览器层次结构\n\n浏览器对象模型创建了一个树形层次结构的对象集合，其中许多对象为\
  \ JavaScript 程序员提供了属性和方法。浏览器本身由一个名为 `window` 的对象表示。`window` 对象是几个子对象的父对象：\n\n* \
  \  `document`\n*   `frames`\n*   `history`\n*   `location`\n*   `navigator`\n* \
  \  `screen`\n*   `self/window/parent`\n\n`window` 对象的子对象 `document` 是特殊的，因为它有多个子对象甚至孙子对象。`window`\
  \ 对象、它的子对象以及在浏览器层次结构中的位置在图 9-1 中所示。\n\n![The window object and its children.](img/httpsatomoreillycomsourcemspimages748769.png.jpg)\n\
  \n图 9-1. `window` 对象及其子对象。\n\n我将在专门的章节讨论 `document` 对象——第 10 章。在本章的剩余部分，你将学习 `window`\
  \ 对象的其他儿子。\n\n## 事件\n\n第 1 章 简要介绍了事件。你在 JavaScript 编程的许多领域都会使用事件，在处理 Web 表单时更是频繁使用。当动作发生时就会触发事件。动作可以由用户引发，例如他们点击按钮或链接，或者将鼠标移入或移区域；也可以由程序事件引发，例如页面加载时。第\
  \ 11 章 详细介绍了与 `window` 对象相关的事件；第 14 章 提供了更多关于 Web 表单的信息。\n\n# 自我意识\n\n`window` 对象是一个全局对象，代表浏览器中当前打开的窗口。`window`\
  \ 对象具有多个属性、方法和子对象。你已经用过其中一些方法，例如 `alert()` 和 `prompt()`。由于 `window` 对象是全局对象，所以你不需要在它的属性和方法前面加上\
  \ `window` 前缀。相反，你可以直接调用它们，正如你在调用 `alert()` 方法的示例中所看到的那样。\n\n`window` 对象的直接后代不需要\
  \ `window` 前缀，但当你处理 `window` 对象直接后代以外的对象时，需要在它们前面加上 `window` 对象名。例如，`document` 对象是\
  \ `window` 对象的直接后代，因此不需要 `window` 前缀，但 `document` 对象的后代需要它，如下例所示：\n\n```\nalert(\"\
  something\");  // 注意没有 window. 前缀。\ndocument.forms[0]  // 注意有 document. 前缀但仍没有 window.\
  \ 前缀\n```\n\n`window` 对象也有属性和方法。在它的属性中有一个 `self` 属性，它指向 `window` 对象（这给了我本节标题的灵感）。表\
  \ 9-1 列出了 `window` 对象的一些常用属性。你将在本书的后续示例中检查其中许多属性。\n\n表 9-1. `window` 对象的选定属性\n\n\
  | 属性 | 描述 |\n| --- | --- |\n| `closed` | 当窗口关闭时设置为 `true` |\n| `defaultStatus` |\
  \ 用于设置浏览器状态栏中默认显示的文本 |\n| `name` | 窗口首次打开时设置的窗口名称 |\n| `opener` | 创建该窗口的窗口的引用 |\n\
  | `parent` | 经常与框架一起使用，指向特定窗口的窗口或框架上一级的窗口 |\n| `status` | 经常用于在访问者悬停在链接等元素上时设置状态栏中的文本\
  \ |\n| `top` | 指向最高或顶部的父窗口 |\n\n表 9-2 和表 9-3 描述了 `window` 对象的一些方法。你将在本书的剩余部分看到使用其中许多方法的示例。\n\
  \n表 9-2. `window` 对象的选定方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `addEventListener()`\
  \ | 跨浏览器（Windows Internet Explorer 除外）事件处理器方法。更多信息请参见第 11 章。 |\n| `attachEvent()`\
  \ | Internet Explorer 中 `addEventListener()` 的版本。更多信息请参见第 11 章。 |\n| `blur()` |\
  \ 将键盘输入的焦点移离浏览器窗口。 |\n| `focus()` | 将键盘输入的焦点改为浏览器窗口。 |\n| `close()` | 关闭浏览器窗口。 |\n\
  | `detachEvent()` | Internet Explorer 中 `removeEventListener()` 的版本。 |\n| `removeEventListener()`\
  \ | 跨浏览器（Windows Internet Explorer 除外）事件处理器移除方法。 |\n| `open()` | 打开窗口。 |\n| `print()`\
  \ | 调用浏览器的打印函数；就像有人在浏览器中点击了打印一样。 |\n\n`window` 对象的某些方法涉及移动和调整窗口大小，并在表 9-3 中进行了描述。\n\
  \n表 9-3. 用于移动和调整大小的 `window` 对象的选定方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `moveBy()`\
  \ | 将窗口移动到相对位置 |\n| `moveTo()` | 将窗口移动到特定位置 |\n| `resizeBy()` | 按相对量更改窗口大小 |\n|\
  \ `resizeTo()` | 将窗口大小调整为特定大小 |\n\n（计时器方法在表格中省略）\n\n本章的其余部分将更详细地查看 `window` 对象的某些直接子对象。\n\
  \n## 获取屏幕信息\n\n`screen` 对象提供了一种获取访问者屏幕信息的方法。你可能需要这些信息来决定显示哪些图像或页面可以多大。无论是否使用 `screen`\
  \ 对象，你都需要创建一个良好的基于 CSS 设计（CSS 代表层叠样式表），以优雅地处理所有尺寸的屏幕。\n\n### 注意\n\n你经常看到 `window`\
  \ 对象的子对象被称为 `window` 对象的属性——例如，`screen` 属性而不是 `screen` 对象。\n\n`screen` 对象的可用属性如下：\n\
  \n*   `availHeight`\n\n\n\n\n\n*   `availWidth`\n*   `colorDepth`\n*   `height`\n\
  *   `width`\n\n你可能在好奇 `availHeight` 和 `availWidth` 属性与 `height` 以及 `width` 属性之间的区别。`availHeight`\
  \ 和 `availWidth` 属性返回的是屏幕可用的高度和宽度（没开玩笑！）减去其他控件占用的空间（例如 Microsoft Windows 中的任务栏）。`height`\
  \ 和 `width` 属性返回的是总高度和宽度。通过例子来说可能会更容易理解。\n\n## 确定访问者的屏幕高度和宽度\n\n1.  使用 Microsoft\
  \ Visual Studio、Eclipse 或其他编辑器，编辑配套内容中第 09 章示例文件文件夹中的 `screen.htm` 文件。\n2.  在页面中，添加此处所示的粗体代码（你可以在配套内容的\
  \ `screen.txt` 文件中找到它）：\n\n    ```\n    <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML\
  \ 4.01//EN\"\n    \"http://www.w3.org/TR/html4/strict.dtd\">\n    <html>\n    <head>\n\
  \        <title>Screen</title>\n    </head>\n    <body>\n       <script type=\"\
  text/javascript\">\n            alert(\"Available Height: \" + screen.availHeight);\n\
  \            alert(\"Total Height: \" + screen.height);\n            alert(\"Available\
  \ Width: \" + screen.availWidth);\n            alert(\"Total Width: \" + screen.width);\n\
  \        </script>\n    </body>\n    </html>\n    ```\n\n3.  保存并在网页浏览器中查看页面。你会收到四个\
  \ `alert()` 对话框，每个对应一个调用的属性。此处显示的示例截图反映了一个 1024 × 768 像素的显示。\n\n    ![确定访问者的屏幕高度和宽度](img/httpatomoreillycomsourcemspimages748771.png.jpg)![确定访问者的屏幕高度和宽度](img/httpatomoreillycomsourcemspimages748773.png.jpg)![确定访问者的屏幕高度和宽度](img/httpatomoreillycomsourcemspimages748775.png.jpg)![确定访问者的屏幕高度和宽度](img/httpatomoreillycomsourcemspimages748777.png.jpg)\n\
  \n    从这些截图中可以看到，总宽度和总高度分别为 1184 像素和 771 像素。注意，可用宽度保持为 1184，而可用高度由于任务栏的存在从 771 减少到了\
  \ 731。\n\n## 使用 `navigator` 对象\n\n`navigator` 对象提供了几个属性，有助于检测访问者浏览器和环境的各种元素。JavaScript\
  \ 可以执行的最流行的操作之一是检测访问者使用的是哪种浏览器。（嗯，本节不是关于这个的——但本可以讨论。更多信息请参阅侧边栏的浏览器检测问题。）\n\n###\
  \ 浏览器检测问题\n\n长期以来，网站使用 `navigator` 对象来检测访问者正在使用哪种浏览器。（在互联网世界里，这已经很长时间了——取决于你所谈论的技术，可能是几年，也可能短至几个月。）使用浏览器检测是为了执行特定浏览器的\
  \ JavaScript 代码。虽然简单的浏览器检测有其用处，但某些设计不当的网站利用这种技术来限制使用特定浏览器的访问者。\n\n他们并不知道，浏览器发送的信息可以被轻易欺骗。Firefox\
  \ 的 User Agent Switcher 插件就是更改此类信息的方法之一，从而使得使用 `navigator` 对象进行浏览器检测变得毫无用处。\n\n\
  ### 提示\n\n我在书中之前说过过，现在现在再说一遍（可能以后可能还会重复一遍）：永远不要依赖从访问者浏览器发送到你网站的任何信息。务必进行验证。仅仅因为浏览器自称是\
  \ Internet Explorer 就认为它是它是不够的。第 11 章` 展示了检测浏览器是否能够处理你网站上的 JavaScript 的更好方法。\n\n\
  当你使用 `navigator` 对象检测访问者的浏览器时，你会遇到另一个问题，因为市上有这么多浏览器。Web 开发者可能会花费太多时间来跟踪哪些浏览器可能支持哪些功能，并尝试在代码中考虑所有浏览器。不过，`navigator`\
  \ 对象并非一无是——它仍然很有用，正如你很快就会看到的。\n\n在本次练习中，你将熟悉 `navigator` 对象的属性及其值。\n\n## 查看 `navigator`\
  \ 对象\n\n1.  使用 Visual Studio、Eclipse 或其他编辑器，编辑配套内容中第 09 章示例文件文件夹中的 `naviprops.htm`\
  \ 文件。\n2.  在页面中，将 TODO 注释替换为此处所示的粗体代码（此代码位于配套内容的 `naviprops.txt` 文件中）：\n\n    ```\n\
  \    <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n    \"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n    <html>\n    <head>\n        <title>The navigator Object</title>\n    </head>\n\
  \    <body>\n        <script type=\"text/javascript\">\n                var body\
  \ = document.getElementsByTagName(\"body\")[0];\n                for (var prop in\
  \ navigator) {\n                    var elem = document.createElement(\"p\");\n\
  \                    var text = document.createTextNode(prop + \": \" + navigator[prop]);\n\
  \                    elem.appendChild(text);\n                    body.appendChild(elem);\n\
  \                }\n        </script>\n    </body>\n    </html>\n    ```\n\n3. \
  \ 保存并在你选择的浏览器中查看页面。如果你选择了 Firefox，你会看到类似这样的页面：\n\n    ![查看 navigator 对象](img/httpatomoreillycomsourcemspimages748779.png.jpg)\n\
  \n4.  如果你选择了 Internet Explorer，页面将看起来类似这样；然而，注意可用属性的差异：\n\n    ![查看 navigator 对象](img/httpatomoreillycomsourcemspimages748781.png.jpg)\n\
  \n    我实在无法为了这个练习又用用一个 `alert()` 对话框了，所以我不得不使用一些我尚未介绍的函数。不过不要担心——示例中的元素将在第 10 章和第\
  \ 11 章中介绍。\n\n本次练习的代码使用一个利用 `Document` 对象模型（DOM）在网页内创建超文本标记语言（HTML）元素的函数。使用 `for`\
  \ 循环来遍历 `navigator` 对象呈现的每一个属性：\n\n```javascript\nfunction showProps() {\n    var\
  \ body = document.getElementsByTagName(\"body\")[0];\n    for (var prop in navigator)\
  \ {\n        var elem = document.createElement(\"p\");\n        var text = document.createTextNode(prop\
  \ + \": \" + navigator[prop]);\n        elem.appendChild(text);\n        body.appendChild(elem);\n\
  \    }\n}\n```\n\n如果你使用的 JavaScript 在某些版本的浏览器上不起作用，你可以通过实现基于 `navigator` 对象的变通方案来检测浏览器，但要理解这种策略并不可靠，你真的应该将其作为标准做法。但有时，你确实需要使用它。\n\
  \n如果你的网站使用 Java，你可以使用 `navigator` 对象来检查 Java 是否启用。方法如下：\n\n## 使用 `navigator` 对象检测\
  \ Java\n\n1.  使用 Visual Studio、Eclipse 或其他编辑器，编辑第 09 章示例文件文件夹中的 `javatest.htm`。\n\
  2.  在页面中，将 TODO 注释替换为此处所示的粗体代码（位于配套内容的 `javatest.txt` 文件中）：\n\n    ```html\n   \
  \ <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n    \"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n    <html>\n    <head>\n        <title>Java Test</title>\n        <script type=\"\
  text/javascript\">\n            if (navigator.javaEnabled()) {\n               \
  \ alert(\"Java is enabled\");\n            } else {\n                alert(\"Java\
  \ is not enabled\");\n            }\n        </script>\n    </head>\n    <body>\n\
  \    </body>\n    </html>\n    ```\n\n\n\n\n\n3. 保存页面并在 Internet Explorer 中查看它（如果你安装了它的话）。默认情况下，Java\
  \ 在 Internet Explorer 中是启用，因此你应该看到类似这样的对话框：\n\n![Using the navigator object to detect\
  \ Java](img/httpatomoreillycomsourcemspimages748783.png.jpg)\n\n4. 如果你有 Firefox，请切换到\
  \ Firefox 并禁用 Java（在 Windows 版本的 Firefox 中，你可以通过从“工具”菜单选择“附加项”，点击“插件”，然后点击“禁用 Java\
  \ 插件”来执行此操作）。当你禁用 Java 并刷新页面时，你会看到类似这样的对话框：\n\n![Using the navigator object to detect\
  \ Java](img/httpatomoreillycomsourcemspimages748785.png.jpg)\n\n# location 对象\n\n\
  `location` 对象允许你访问当前加载的统一资源标识符 (URI)，包括关于查询字符串的任何信息、正在使用的协议以及其他相关组件。例如，一个 URI 可能是：\n\
  \n* *[`www.braingia.org/location.html`](http://www.braingia.org/location.html)*\n\
  \n如果该 URI 对应的网页包含解析下一个示例中所示 URI 的 JavaScript 代码，则输出结果将像图 9-2 所示。\n\n![The location\
  \ object being used to display the various properties.](img/httpatomoreillycomsourcemspimages748787.png.jpg)\n\
  \n图 9-2. `location` 对象用于显示各种属性。\n\n在这种情况下，协议是 `http:`，主机是 `www.braingia.org`（主机名也是如此），路径名是\
  \ `location.html`。查询字符串中没有输入任何内容，因此搜索值为空。端口是 HTTP 流量的标准端口 `tcp/80`，因此它也是空的。\n\n\
  这里有一个检查查询字符串的练习题。\n\n## 查看 location 对象\n\n1. 使用 Visual Studio、Eclipse 或编辑器，编辑配套内容中\
  \ `Chapter09` 示例文件夹下的 `location1.htm` 文件。\n\n2. 这部分 HTML 和 JavaScript 代码创建了你在图 9-2\
  \ 中看到的页面（实际上，它借用了早之前一个使用 `navigator` 对象的练习代码，但对 `location` 对象进行了细微修改）。我们在该代码的基础上进行此练习，因此向\
  \ `location1.htm` 页面中添加此处显示的粗体代码：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n\
  \    <title>Location, Location, Location</title>\n</head>\n<body>\n    <script type=\"\
  text/javascript\">\n            var body = document.getElementsByTagName(\"body\"\
  )[0];\n            for (var prop in location) {\n                    var elem =\
  \ document.createElement(\"p\");\n                    var text = document.createTextNode(prop\
  \ + \": \" + location[prop]);\n                    elem.appendChild(text);\n   \
  \                 body.appendChild(elem);\n            }\n    </script>\n</body>\n\
  </html>\n```\n\n3. 在网络浏览器中查看该页面。你的结果将有所不同，取决于你如何设置 Web 服务器。此示例显示了一个运行在本地 IP 地址上的\
  \ Apache Web 服务器：`192.168.1.14`。\n\n![Looking at the location object](img/httpatomoreillycomsourcemspimages748789.png.jpg)\n\
  \n4. 通过添加一些查询字符串参数/值对来修改你调用页面的 URI。例如，我本地环境使用的 URI 是 `http://192.168.1.14/jsbs/c9/location1.htm`。（你的环境和你提供文件的位置可能与此不同）。我将修改\
  \ URL 并添加两个参数：`name=Steve` 和 `country=US`。你可以随时将 `name` 参数的值更改为你的名字，并将 `country`\
  \ 值更改为你的居住国家（如果你不是美国人的话）。在这里，你选择的值并不重要——重要的是你使用了多于一个参数/值对。这是我最终的 URI：`http://localhost:1627/Chapter9/location1.htm?name=Steve&country=US`。\n\
  \n5. 当你带有添加的参数加载页面时，`search` 属性有一个值，如下所示：\n\n![Looking at the location object](img/httpatomoreillycomsourcemspimages748791.png.jpg)\n\
  \n6. 再次打开 `location1.htm` 文件并将其保存为 `location2.htm`。\n\n7. 修改 `location2.htm` 中的代码，使其检查\
  \ `search` 属性，如下（更改以粗体显示，并在配套内容中的 `location2.txt` 文件中）：\n\n```html\n<!DOCTYPE HTML\
  \ PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n    <title>Location, Location, Location</title>\n</head>\n<body>\n\
  \    <script type=\"text/javascript\">\n            var body = document.getElementsByTagName(\"\
  body\")[0];\n            for (var prop in location) {\n                var elem\
  \ = document.createElement(\"p\");\n                var text = document.createTextNode(prop\
  \ + \": \" + location[prop]);\n                elem.appendChild(text);\n       \
  \         body.appendChild(elem);\n            }\n            if (location.search)\
  \ {\n                var querystring = location.search;\n                var splits\
  \ = querystring.split('&');\n                for (var i = 0; i < splits.length;\
  \ i++) {\n                    var splitpair = splits[i].split('=');\n          \
  \          var elem = document.createElement(\"p\");\n                    var text\
  \ = document.createTextNode(splitpair[0] + \": \" +\nsplitpair[1]);\n          \
  \          elem.appendChild(text);\n                    body.appendChild(elem);\n\
  \                }\n            }\n    </script>\n</body>\n</html>\n```\n\n8. 将浏览器指向\
  \ `location2.htm?name=Steve&country=US` 来执行此代码（根据情况修改名字和国家，除非你的名字是 Steve 且居住在美国）。你现在得到了一个列出你之前看到的普通属性的页面，但页面底部附近还列出了从查询字符串解析出的参数/值对，如下：\n\
  \n![Looking at the location object](img/httpatomoreillycomsourcemspimages748793.png.jpg)\n\
  \n9. 然而注意，第一个参数 `name` 包含了查询字符串中的问号（`?`），这并不是你想要的。你可以通过多种方法解决这个问题。最简单的方法之一是使用 `substring()`\
  \ 方法。将 `querystring` 变量定义行更改为：\n\n```javascript\nvar querystring = location.search.substring(1);\n\
  ```\n\n`substring()` 方法从指定点开始返回字符串。在这种情况下，`location.search` 的第一个字符（索引为 `0` 处）是问号；因此，使用从索引\
  \ 1 开始的 `substring()` 来解决这个问题。最终代码（更改以粗体显示）如下。（你可以在配套内容中的 `location3.txt` 文件中找到它。）\n\
  \n\n\n\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\" \"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<head>\n    <title>Location, Location</title>\n</head>\n<body>\n    <script type=\"\
  text/javascript\">\n        var body = document.getElementsByTagName(\"body\")[0];\n\
  \            for (var prop in location) {\n                var elem = document.createElement(\"\
  p\");\n                var text = document.createTextNode(prop + \": \" + location[prop]);\n\
  \                elem.appendChild(text);\n            }\n            if (location.search)\
  \ {\n                var querystring = location.search.substring(1);\n         \
  \       var splits = querystring.split('&');\n                for (var i = 0; i\
  \ < splits.length; i++) {\n                    var splitpair = splits[i].split('=');\n\
  \                    var elem = document.createElement(\"p\");\n               \
  \     var text = document.createTextNode(splitpair[0] + \": \" + splitpair[1]);\n\
  \                    elem.appendChild(text);\n                    body.appendChild(elem);\n\
  \                }\n            }\n    </script>\n</body>\n```\n\n10. 将此代码保存为 `location.htm`\
  \ 并再次运行。你会发现它解决了问号的问题：\n\n![查看 location 对象](http://atomoreilly.com/images/74895.jpg)\n\
  \nlocation 也可以通过 JavaScript 和 `location` 对象进行设置。通常使用 `location` 对象的 `assign()` 方法来实现。例如，为了重定向到我的网站（这是一个好主意），我可以使用这段代码：\n\
  \n```\nlocation.assign(\"http://www.example.org\");\n```\n\n调用 `assign()` 方法与设置\
  \ `href` 属性本质上是相同的：\n\n```\nlocation.href = \"http://www.example.org\";\n```\n\n\
  你还可以更改 location 的其他属性，例如端口、查询字符串或路径。例如，将路径设置为 `blog`，可以这样做：\n\n```javascript\nlocation.pathname\
  \ = \"blog\";\n```\n\n将查询字符串设置为 `?name=Steve`，这样做：\n\n```javascript\nlocation.search\
  \ = \"?name=Steve\";\n```\n\n你可以通过调用 `reload()` 方法来刷新页面：\n\n```javascript\nlocation.reload();\n\
  ```\n\n当你调用 `location.reload()` 时，浏览器可能会从缓存加载页面，而不是从服务器请求页面；然而，如果你向该方法传递布尔值 `true`，浏览器将直接从服务器重新加载：\n\
  \n```\nlocation.reload(true);\n```\n\n### 注意\n\n谨慎使用 `reload()` 方法。在脚本内部刷新页面而不是通过事件触发函数进行调用，可能会导致循环。\n\
  \n## history 对象\n\n`history` 对象提供了在浏览历史中向前向后移动的方法。（然而，出于安全考虑，JavaScript 无法访问访问过的\
  \ URI。）具体来说，你可以使用 `back()`、`forward()` 和 `go()` 方法。不言而喻，`back()` 和 `forward()` 分别向后向前一页。`go()`\
  \ 方法移动到作为参数指定的索引值。\n\n### 注意\n\n如果应用程序没有到地址栏中不同的页面或位置，则该程序将不会浏览器历史的一部分，因此无法通过这些函数访问。\n\
  \n这里是一些用于后后移动的示例代码，可以根据需要进行调整。后续章节中的示例将详细介绍这种代码如何在现实世界中中使用。\n\n```html\n<!DOCTYPE\
  \ HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\" \"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n    <title>History</title>\n    <script type=\"text/javascript\"\
  >\n        function moveBack() {\n            history.back();\n        }\n     \
  \   function moveForward() {\n            history.forward();\n        }\n    </script>\n\
  </head>\n<body>\n<p><a href=\"#\" onclick=\"moveBack()\">点击返回</a></p>\n<p><a href=\"\
  #\" onclick=\"moveForward()\">点击前进</a></p>\n</body>\n</html>\n```\n\n### 注意\n\n\
  此代码使用了内联事件处理器（`onclick`），不建议在非侵入式 JavaScript 中使用，因为事件处理器会在页面标记中插入行为。此处使用 `onclick`\
  \ 仅用于说明目的，以避免引入事件处理器的概念，该概念有专门的章节——第 11 章。\n\n注册处理器\n\nHTML 5.0 引入了 对象的两个新方法：`registerContentHandler()`\
  \ 和 `registerProtocolHandler()`。通过这些方法，网站可以注册用于处理某些类型信息的 URI，例如 RSS 馈。然而，这些方法尚未被广泛支持，因此本书未涵盖。\n\
  \n# 练习题\n\n| 1. | 使用 `availHeight` 和 `availWidth` 方法确定屏幕是否至少有 768 像素高和 1024 像素宽。如果不是，显示一个\
  \ `alert()` 对话框说明可用屏幕的大小。 |\n| 2. | 修改使用 `location` 对象的逐步练习题，根据查询字符串显示 `alert()`\
  \ 对话框。具体来说，如果国家是巴西，显示单词“Obrigado”；如果是英国，显示“Thank you”。 |\n| 3. | 在 Firefox 中安装 User\
  \ Agent Switcher 插件或在 Internet Explorer 中安装类似的插件。然后使用本章早期“查看 navigator”练习中的代码，对你发现的不同值进行实验。这个练习有助于说明为什么不建议将\
  \ `navigator` 对象作为确定兼容性的唯一手段。加分：定义你自己的用户代理。 |\n\n\n\n\n本章中的示例使用了内联事件处理程序，例如直接附加到\
  \ `<body>` 标签上的 `onload` 事件，以及附加到各种 HTML 标签上的 `onclick` 事件处理程序。使用内联事件处理并非最佳实践，此处仅用于说明目的。第\
  \ 11 章 介绍了向 HTML 绑定事件的更好方法。DOM Level 0 也被称为遗留 DOM。\n\n## DOM Level 0：遗留 DOM\n\n\
  DOM Level 0 是在 DOM 的其他正式规范之前实现的。在 DOM Level 1 规范之后，之前与文档脚本相关的技术被规范化（尽管并非由任何标准机构以任何正式方式制定）为遗留的\
  \ DOM Level 0。今天，每个主流浏览器都支持 DOM Level 0 组件以实现向下兼容。你可希望你在 1998 年编写的所有脚本都崩溃！\n\nDOM\
  \ Level 0 主要集中在提供对表单元素的访问，但它也包含了对链接和图像的访问。第 14 章 涵盖了表单以及你如何通过 DOM 访问它们。与其在 DOM Level\
  \ 0 的示例上花费时间，我将关注 DOM Level 1 和 Level 2，你以后用 JavaScript 编程时更有可能使用它们。\n\n## DOM Level\
  \ 1 和 2\n\nW3C 于 1998 年将 DOM Level 1 作为规范发布。与遗留 DOM 类似，Level 1 被所有主流浏览器以各种形式支持。DOM\
  \ Level 2 于 2000 年正式发布。浏览器对 Level 2 DOM 的支持差异更为广泛。坦率地说，对所有 DOM 级别的支持随浏览器和版本的不同而异。\n\
  \n版本 9 之前的 Windows Internet Explorer 版本声称支持 DOM，但它们的实现方式与其他浏览器不同。因此，你需要意识到你在 JavaScript\
  \ 代码中正在使用或尝试使用的 DOM 特性或功能可能在 Internet Explorer 中无法工作，或者仅在 Internet Explorer 中有效而在其他地方都不行（不，这是不可接受的）。Windows\
  \ Internet Explorer 版本 9 是向正确方向的一步，但你仍然需要考虑浏览器之间的兼容性问题。在适用的情况下，我会指出浏览器不同实现 DOM 的地方以及此类事件的一些变通方案。\n\
  \n## 树状 DOM\n\nDOM 以树状结构——或者准确地说，是倒置的树状结构——表示 HTML 文档，因为树的根在顶部。例如，考虑 示例 10-1 所示的简单\
  \ HTML 文档。\n\n示例 10-1. 一个简单的 HTML 文档。\n\n```html\n<html>\n<head>\n<title>Hello World</title>\n\
  </head>\n<body>\n<p>Here's some text.</p>\n<p>Here's more text.</p>\n<p>Link to\
  \ the <a href=\"http://www.w3.org\">W3</a></a></a>></p>\n</body>\n</html>\n```\n\
  \n图 10-1 显示了在 DOM 的树形结构视图中，示例 10-1 中的 HTML。\n\n![以树形结构表示的简单文档。](img/httpatomoreillycomsourcemspimages748797.png.jpg)\n\
  \n图 10-1. 以树形结构表示的简单文档。\n\n许多 HTML 元素可以拥有属性，例如示例 10-1](#ch10.html_simple_html_document\
  \ \"示例 10-1. 一个简单的 HTML 文档.\")所示的 <a> 元素的 `href` 属性。你可以使用 DOM 获取并设置这些属性，正如你将在本章后面看到的那样。\n\
  \n在处理 DOM 时，你应该意识到获取元素、设置元素与元素相关的项，以及移除或删除元素之间的区别。处理 DOM 元素的方法反映了这种区别。\n\n## 处理节点\n\
  \n处理 DOM 元素的方法反映了这种区别。在处理 DOM 时，你应该意识到获取元素、设置元素与元素相关的项，以及移除或删除元素之间的区别。处理 DOM 元素的方法反映了这种区别。\n\
  \n\n\n\n# 关于 innerHTML 属性的说明\n\n更改元素文本的方法之一是使用 `innerHTML` 属性。`innerHTML` 属性允许快速地访问诸如\
  \ `p` 元素等元素的文本。该属性通常运行良好——事实上，效果非常好，以至于尽管在一段时间内在很多 Web 编程圈中并不受欢迎，但我发现在这书中很难完全跳过它。因此，我不会跳过它。\n\
  \n`innerHTML` 的问题在于它没有被 W3C 正式定义为标准，因此它并不像其他 DOM 指定的对象那样在所有浏览器中都能得到支持。然而，`innerHTML`\
  \ 将成为 HTML 5.0 规范的一部分，而且考虑到实际 DOM 规范实现有时具有不可性，`innerHTML` 仍然很有价值。主流浏览器都支持 `innerHTML`——而且它们支持得相当一致。\n\
  \n看下面这个示例，你可以在配套代码的 `innerhtml.htm` 文件中找到它：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<<html>\n<head>\n\
  \    <title>Get By Id</title>\n    <script type=\"text/javascript\">\n    function\
  \ changetext() {\n        var p1 = document.getElementById(\"sometext\");\n    \
  \    alert(p1.innerHTML);\n        p1.innerHTML = \"Changed Text\";\n    }\n   \
  \ </script>\n</head>\n<body onload=\"changetext()\">\n<p id=\"sometext\">Here's\
  \ some text.</p>\n<p id=\"moretext\">Here's more text.</p>\n<p id=\"linkp\">Link\
  \ to the <a id=\"w3link\" href=\"http://www.w3.org\">W3</a></p>\n</body>\n<//>\n\
  ```\n\n`changetext()` 函数通过以下代码获取 ID 为 `sometext` 的元素，并将其引用放在变量 `p1` 中：\n\n```\n\
  var p1 = document.getElementById(\"sometext\");\n```\n\n接下来，它调用了 `innerHTML` 属性，并将结果发送到\
  \ `alert()` 对话框中。\n\n![关于 innerHTML 属性的说明](img/httpatomoreillycomsourcemspimages748801.png.jpg)\n\
  \n请不仅注意 `alert()` 对话框，还要注意背景窗口第一行的文本：当用户点击 OK 时，`alert()` 对话框消失，执行下一行 JavaScript\
  \ 代码，使用 `innerHTML` 属性将第一个 `p` 元素的文本更改为“Changed Text”。结果所示：\n\n![关于 innerHTML 属性的说明](img/httpatomoreillycomsourcemspimages748803.png.jpg)\n\
  \n## 通过标签名检索\n\n当你只需要获取一个或少数几个元素时，`getElementById()` 方法运行良好；但当你需要一次获取多个元素时，你可能会发现\
  \ `getElementsByTagName()` 方法更合适。\n\n`getElementsByTagName()` 方法以数组或列表的形式返回所有指定标签类型的元素。例如，要获取文档中所有的图像（`img`\
  \ 标签），你需要编写以下代码：\n\n```\nvar images = document.getElementsByTagName(\"img\");\n\
  ```\n\n然后你可以通过遍历这些元素来检查存储在 `images` 变量中的 `img` 元素的属性。\n\n这是一个修改表格的示例。当用户点击“Click\
  \ to Change Colors”链接时，此代码会更改表格内每个 `td` 元素的背景颜色。你可以在配套内容的 `getbytagname.htm` 文件中找到此代码：\n\
  \n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<<html>\n<head>\n    <title>Tag Name</title>\n    <script type=\"text/javascript\"\
  >\n    function changecolors() {\n        var a1 = document.getElementsByTagName(\"\
  td\");\n\n        var a1Length = a1.length;\n        for (var i = 0; i < a1Length;\
  \ i++) {\n            a1[i].style.background = \"#aaabba\";\n        }\n   }\n\n\
  \    </script>\n</head>\n<body><body>\n<table id=\"mytable\" border=\"1\">\n<tr><td\
  \ id=\"lefttd0\">Left column</td><td id=\"righttd0\">Right column</td></tr>\n<tr><td\
  \ id=\"lefttd1\">Left column</td><td id=\"righttd1\">Right column</td></tr>\n<tr><td\
  \ id=\"lefttd2\">Left column</td><td id=\"righttd2\">Right column</td></tr>\n<//table>\n\
  <a href=\"#\" onclick=\"return changecolors();\">Click to Change Colors</a></a>\n\
  </body>\n<//>\n```\n\n图 10-3 格式化表格元素。\") 显示了该页面在 Web 浏览器中查看时的外观。\n\n![使用 getElementsByTagName()\
  \ 格式化表格元素](img/httpatomoreillycomsourcemspimages748805.png.jpg)\n\n图 10-3. 使用 `getElementsByTagName()`\
  \ 格式化表格元素。\n\n\n\n\n正如父节点可以拥有一个或多个子节点，每个子节点都有一个父节点，你可以通过其 `parentNode` 属性获取它。你可以使用\
  \ `nextSibling` 和 `previousSibling` 属性遍历子节点。如果没有更多的兄弟节点，该属性将返回 `null`。例如，在第一个子节点上使用\
  \ `previousSibling` 属性会返回 `null`，而在最后一个子节点上使用 `nextSibling` 属性会返回 `null`。\n\n最后，firstChild`\
  \ 和 `lastChild` 属性分别包含给定元素的第一个和最后一个节点。当元素不包含任何子节点时，这些属性均为 `null`。\n\n# 操作属性\n\n\
  元素的属性可以通过 JavaScript 获取和设置。本节将介绍这两项任务。\n\n## 查看属性\n\n有时，特别是当你第一次用 JavaScript 编程时，你可能不知道给定元素具有哪些属性。但你不需要担心这个问题，因为可以使用调用\
  \ `getAttribute()` 方法的循环。这里有一个显示给定元素所有属性的通用函数：\n\n```\nfunction showattribs(e) {\n\
  \    var e = document.getElementById(\"braingialink\");\n    var elemList = \"\"\
  ;\n    for (var element in e) {\n        var attrib = e.getAttribute(element);\n\
  \        elemList = elemList + element + \": \" + attrib + \"\\n\";\n    }\n   \
  \ alert(elemList);\n}\n```\n\n正如你在练习所示，只需要带有 `getElementById()` 方法的少量 JavaScript\
  \ 即可调用此函数。\n\n### 获取元素属性\n\n1. 使用 Microsoft Visual Studio、Eclipse 或编辑器编辑第 10 章示例文件文件夹中的\
  \ `showattribs.htm` 文件。\n2. 在页面中，将 TODO 注释替换为显示的加粗字体代码。（该代码位于配套材料的 `showattribs.txt`\
  \ 文件中。）\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n    <title>Show Attribs</title>\n    <script type=\"text/javascript\"\
  >\n        function showattribs(e) {\n            var e = document.getElementById(\"\
  braingialink\");\n            var elemList = \"\";\n            for (var element\
  \ in e) {\n                var attrib = e.getAttribute(element);\n             \
  \   elemList = elemList + element + \": \" + attrib + \"\\n\";\n            }\n\
  \            alert(elemList);\n        }\n        </script>\n</head>\n<body\n<a\
  \ onclick=\"return showattribs();\" href=\"http://www.braingia.org\"\nid=\"braingialink\"\
  >Steve Suehring's\nWeb Site</a>\n<script type=\"text/javascript\">\n\n</script>\n\
  </body>\n</</html>\n```\n\n3. 保存代码并在 浏览器中查看。你会看到一个像这样的页面：\n\n![获取元素属性](img/httpatomoreillycomsourcemspimages748809.png.jpg)\n\
  4. 点击链接。JavaScript 函数执行。该函数获取 `a` 元素的属性并遍历它们，将它们附加到变量中。最后，该变量显示在 `alert()` 对话框中，如此处显示的局部所示：\n\
  \n![获取元素属性](img/httpatomoreillycomsourcemspimages748811.png)\n\n## 设置属性\n\n你已经看到\
  \ `getAttribute()` 方法如何获取属性中的值。你也可以使用 `setAttribute()` 方法设置属性。\n\n`setAttribute()`\
  \ 方法接受两个参数：你想要更改的属性以及该属性的预期值。这里是一个更改 `href` 属性值的示例，你也可以在配套代码的 `setattrib.htm` 文件中找到它：\n\
  \n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n    <title>Set Attrib</title>\n\n</head>\n<body\n<a href=\"http://www.braingia.org\"\
  \ id=\"braingialink\">Steve Suehring's Web Site</a>\n<script type=\"text/javascript\"\
  >\n    var a1 = document.getElementById(\"braingialink\");\n    alert(a1.getAttribute(\"\
  href\"));\n    a1.setAttribute(\"href\",\"http://www.microsoft.com\");\n    alert(a1.getAttribute(\"\
  href\"));\n</script>\n</body>\n</</html>\n```\n\n当浏览器中查看此页面时，你会看到一个 `alert()` 对话框，显示\
  \ `href` 属性的当前值，如 图 10-5 所示。\n\n![href 属性的初始值。](img/httpatomoreillycomsourcemspimages748813.png.jpg)\n\
  \n图 10-5. href 属性的初始值。\n\n当对话框关闭时，`setAttribute()` 方法执行，`href` 属性发生变化，如 图 10-6 所示。\n\
  \n![href 属性的新值。](img/httpatomoreillycomsourcemspimages748815.png)\n\n图 10-6. href\
  \ 属性的新值。\n\n## 创建元素\n\n你不局限于与页面上已元素交互。你可以使用 DOM 向文档添加元素。本节将检查某些操作方法。\n\n## 添加文本\n\
  \n在最基本的形式下，`document` 对象的 `createElement()` 方法创建或添加元素。这里有一个示例：\n\n```\nvar newelement\
  \ = document.createElement(\"p\");\n```\n\n变量 `newelement` 现在有了新元素的引用。为了让元素可见，你需要将其附加到文档中——尽管是在添加文本之后。你使用\
  \ `appendChild()` 方法将元素添加到文档，如下：\n\n```\ndocument.body.appendChild(newelement);\n\
  ```\n\n但如果一个 `p` 元素没有文本，它有什么用呢？`appendChild()` 元素也可以提供帮助，结合 `createTextNode()` 方法使用，如下：\n\
  \n```\nnewelement.appendChild(document.createTextNode(\"Hello World\"));\n```\n\n\
  你可以在文档主体声明后的任何时候使用你目前看到的这三行代码。这里是网页上下文中的代码：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n\
  \    <title>Create</title>\n\n</head>\n<body>\n    <script type=\"text/javascript\"\
  >\n    var newelement = document.createElement(\"p\");\n    document.body.appendChild(newelement);\n\
  \    newelement.appendChild(document.createTextNode(\"Hello World\"));\n    </script>\n\
  </body>\n</html>\n```\n\n在浏览器中查看时，结果是一个包含 Hello World 文本的简单 `p` 元素，如 图 10-7 \"Figure\
  \ 10-7. 使用 createElement, createTextNode 和 appendChild() 创建元素.\") 所示。\n\n![使用 createElement,\
  \ createTextNode 和 appendChild() 创建元素](img/httpatomoreillycomsourcemspimages748817.png.jpg)\n\
  \n图 10-7. 使用 *createElement*,createTextNode*,appendChild()* 创建元素。\n\n## 添加元素并设置\
  \ ID\n\n之前的示例显示了如何添加元素。通常你还想设置某些属性，例如元素的 *ID*。此代码扩展了之前的示例以添加 *id* 属性（你可以在配套代码的 `createid.htm`\
  \ 文件中找到此代码）：\n\n\n\n\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n    <title>Create</title>\n\
  </head>\n<body>\n    <script type=\"text/javascript\">\n    var newelement = document.createElement(\"\
  p\");\n    newelement.setAttribute(\"id\",\"newelement\");\n    document.body.appendChild(newelement);\n\
  \    newelement.appendChild(document.createTextNode(\"Hello World\"));\n    </script>\n\
  </body>\n</html>\n```\n\n## 删除元素\n\n你可以使用 `removeChild()` 方法从文档中删除节点。回想一下上一节中添加元素的代码。通过添加几个\
  \ `p` 元素来扩展该代码，可以简化你的工作：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n    <title>Create</title>\n\
  </head>\n<body>\n    <script type=\"text/javascript\">\n    for (var i = 0; i <\
  \ 3; i++) {\n        var element = document.createElement(\"p\");\n        element.setAttribute(\"\
  id\",\"element\" + i);\n        document.body.appendChild(element);\n        element.appendChild(document.createTextNode(\"\
  Hello World, I'm Element \" + i + \".\"));\n    }\n    </script>\n</body>\n</html>\n\
  ```\n\n当在网络浏览器中查看时，该文档创建的页面与图 10-8 所示所示。\n\n![使用 for 循环和 DOM 创建并添加三个元素](img/httpatomoreillycomsourcemspimages748819.png.jpg)\n\
  \n图 10-8。使用 `for` 循环和 DOM 创建并添加三个元素。\n\n你可以添加几行代码来删除新创建的元素之一。使用 `removeChild()`\
  \ 可以从你的文档中删除任何元素，而不仅仅是你创建的元素。新添加的两行代码是：\n\n```\nvar removeel = document.getElementById(\"\
  element1\");\ndocument.body.removeChild(removeel);\n```\n\n对于此示例，将这些代码行添加在创建元素的代码之后。在实践中，你可以将\
  \ `removeChild()` 的调用放在任何地方，只要该元素已经创建。以下是带有粗体显示的新行的最终代码。你可以在配套代码的 `removeel.htm`\
  \ 中找到它：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n    <title>Create</title>\n</head>\n<body>\n    <script type=\"\
  text/javascript\">\n    for (var i = 0; i < 3; i++) {\n        var element = document.createElement(\"\
  p\");\n        element.setAttribute(\"id\",\"element\" + i);\n        document.body.appendChild(element);\n\
  \        element.appendChild(document.createTextNode(\"Hello World, I'm Element\
  \ \" + i + \".\"));\n    }\n    var removeel = document.getElementById(\"element1\"\
  );\n    document.body.removeChild(removeel);\n    </script>\n</body>\n</html>\n\
  ```\n\n图 10-9 显示了结果。`for` 循环仍然创建了三个元素，但上述粗体代码删除了中间的一个。\n\n![使用 removeChild() 从文档中删除元素](img/httpatomoreillycomsourcemspimages748821.jpg)\n\
  \n图 10-9。使用 `removeChild()` 从文档中删除元素。\n\n# 练习\n\n1. 创建一个包含段落文本的文档，该文本是你使用 DOM 创建并追加的。在这一段落之后立即使用\
  \ DOM 创建一个链接，链接到你选择的网站，同样使用 DOM。确保所有元素都具有 `id` 属性。\n2. 创建一个包含你喜欢的任何元素的文档，或者使用一个在其元素中包含\
  \ `id` 属性的现有 HTML 文档。获取其中两个元素，对它们进行修改，并将它们放回文档中。你所做的更改类型取决于你选择的元素。\n3. 使用 DOM 创建一个包含至少两列和两行表格的文档。在表格单元格中添加一些文本。\n\
  \n# JavaScript 事件与浏览器\n\n在读完本章后，你将能够：\n\n* 理解更早的事件模型。\n* 理解 W3C 事件模型。\n* 使用 JavaScript\
  \ 为网页添加事件处理程序。\n* 使用 JavaScript 打开新窗口。\n* 在网络浏览器中打开新标签页。\n* 使用 JavaScript 创建定时器。\n\
  \n## 理解窗口事件\n\n在前面的章节中，你已经看到过几次事件处理的使用，用于响应用户操作或文档事件。回顾一下，`Window` 对象的事件包括 `mouseover()`、`mouseout()`\
  \ 和 `click()`。这些事件在所有浏览器中都是相当标准的，但其他事件和事件处理并不那么容易实现。本节将探索事件以及如何在 JavaScript 中使用它们。\n\
  \n## 事件模型\n\n理解事件的首要挑战是理解两种不同的模型：Internet Explorer 9 之前的版本使用的模型，以及由世界维网联盟（W3C）定义的模型。一个较旧的模型——文档对象模型\
  \ 0（DOM 0）——包含了你在前面的章节中看到的事件。你在第 1 章 中了解了一些 DOM 0。DOM 0 是最具跨浏览器兼容性的模型，并被所有支持 JavaScript\
  \ 的浏览器支持。在本文讨论中，我将提供 DOM 0 事件模型的简要概述，然后探索竞争性的 W3C 和 Internet Explorer 模型。\n\n###\
  \ 使用 DOM 0 模型\n\nDOM 0 事件模型是目前最易使用的模型（正如你在前面的章节中学到的那样），它是在 JavaScript 中进行事件处理时兼容性最好的模型（如之前提到的，受所有主要的网络浏览器支持）。为什么不在任何地方都使用\
  \ DOM 0 事件模型呢？原因很简单：它缺乏复杂事件处理所需的灵活性。例如，DOM 0 模型无法处理同一个元素上的多个事件操作。尽管如此，如书中所示，将它用于简单脚本并没有问题。\n\
  \nDOM 0 事件模型包含了多个超文本标记语言（HTML）标签响应各种用户操作或状态变化而引发的事件。表 11-1 描述了每个事件。\n\n表 11-1. DOM\
  \ 0 事件\n\n| 事件名称 | 描述 |\n| --- | --- |\n| `onblur()` | 元素失去焦点（即它未被用户选择）。 |\n| `onchange()`\
  \ | 元素发生了变化（例如，用户在文本字段中输入）或失去焦点。 |\n| `onclick()` | 鼠标点击元素。 |\n| `ondblclick()`\
  \ | 鼠标双击元素。 |\n| `onfocus()` | 元素获得了焦点。 |\n| `onkeydown()` | 当元素获得焦点时按下键盘键（而不是释放）。\
  \ |\n| `onkeypress()` | 当元素获得焦点时按下键盘键。 |\n| `onkeyup()` | 当元素获得焦点时释放键盘键。 |\n| `onload()`\
  \ | 元素已加载（文档、帧集或图像）。 |\n| `onmousedown()` | 按下鼠标按钮。 |\n| `onmousemove()` | 鼠标在移动。\
  \ |\n| `onmouseout()` | 鼠标移出或离开元素。 |\n| `onmouseover()` | 鼠标悬停在元素上。 |\n| `onmouseup()`\
  \ | 释放鼠标按钮。 |\n| `onreset()` | 表单元素被重置，例如用户点击表单重置按钮时。 |\n| `onresize()` | 窗口大小改变。\
  \ |\n| `onselect()` | 表单元素的文本被选中。 |\n| `onsubmit()` | 表单被提交。 |\n| `onunload()` |\
  \ 文档或帧集被卸载。 |\n\n\n\n\nW3C 规范化了一种允许强大事件处理的模型，几乎所有主流浏览器的后续版本都支持该模型，但版本 9 之前的 Internet\
  \ Explorer 除外，它使用的是不同的模型。由于标准的 W3C 事件模型与早期的 Internet Explorer 事件模型不同，在任何使用这两种事件处理方式之一的\
  \ JavaScript 代码中，你必须考虑这两者，而不能仅使用 DOM 0 事件模型提供的方法。\n\n从概念上讲，W3C 模型和 Internet Explorer\
  \ 模型的事件处理过程是相似的。在两种模型中，你都先注册事件，将函数与事件关联。\n\n当注册的事件被触发时，就会调用该事件的函数。然而，事件发生的位置是它们的一个重要区别。\n\
  \n为了理解这种差异，请想象一个包含 `<body>` 元素和其内部另一个元素（例如 `<img>`）的文档。如果访问者将鼠标移动到图像上，`onmouseover()`\
  \ 事件应该先在 `<img>` 内部处理，还是在 `<body>` 内部处理？这两个模型在确定应该在哪里处理事件上存在分歧。\n\nW3C 模型支持两种定位处理位置的形式：`事件捕获（Event\
  \ Capture）` 和 `事件冒泡（Event Bubbling）`。使用`事件捕获`时，处理程序的搜索从顶层（文档级别）开始，向下通过 DOM 树到达更具体的元素。如果你在上一段的示例中使用`事件捕获`，事件将首先由\
  \ `<body>` 元素处理，然后由 `<img>` 元素处理。而`事件冒泡` 的处理顺序恰恰相反：首先在发生事件的元素中搜索处理程序，然后从该处向上进行。\n\
  \n如前所述，W3C 模型——以及因此所有遵循该模型的浏览器（换句话说，除了旧版本的 Internet Explorer 外的所有浏览器）可以使用两种事件处理形式（你很快就会学到这些），而旧版本的\
  \ Internet Explorer 仅使用`事件冒泡`。在 W3C 模型中，你使用 `addEventListener()` 方法注册事件。在早期的 Internet\
  \ Explorer 模型中，你使用 `attachEvent()` 实现相同的目的。在实践中，这意味着在你编写的每个处理事件的脚本中都需要使用这两种方法，并在运行时选择适用于脚本运行浏览器的方法。`addEventListener()`\
  \ 方法的基本结构如下：\n\n```\naddEventListener(event,function,capture/bubble);\n```\n\n`capture/bubble`\
  \ 参数是一个布尔值，其中 `true` 表示事件应该使用自顶向捕获，`false` 表示事件应该使用冒泡。以下是对提交（Submit）按钮的一个典型 `addEventListener()`\
  \ 调用。该调用注册了 `submit` 事件，指定了一个名为 `myFunction()` 的函数（该函数将在代码的其他地方定义），并使用了自顶向事件捕获：\n\
  \n```javascript\nwindow.addEventListener(\"submit\",myFunction(),true);\n```\n\n\
  要使用冒泡注册相同的事件，你需要这样写：\n\n```javascript\nwindow.addEventListener(\"submit\",myFunction(),false);\n\
  ```\n\n早期 Internet Explorer 模型中使用的 `attachEvent()` 方法不需要第三个参数，因为你不需要决定是使用捕获还是冒泡；早期的\
  \ Internet Explorer 模型仅提供冒泡。\n\n以下是在旧版本 Internet Explorer 中注册 `submit` 事件的示例，通过调用\
  \ `attachEvent()` 将其与 `myFunction()` 关联：\n\n```javascript\nwindow.attachEvent(\"\
  onsubmit\",myFunction());\n```\n\n你可能已经注意到添加事件处理程序的事件名称存在细微差异——`submit`，相对于 DOM\
  \ Level 0 模型中的 `onsubmit`。DOM Level 2 中的许多事件都更改了名称。表 11-2 显示了几个 DOM Level 0 事件的名称及其\
  \ W3C DOM Level 2 对应项。注意，DOM 2 事件简单地从事件名称中删除了“on”单词。（早期的 Internet Explorer 模型使用的是\
  \ DOM 0 名称。）\n\n### 表 11-2. DOM 0 和 DOM Level 2 事件\n\n| DOM 0 事件 | DOM 2 事件 |\n\
  | --- | --- |\n| `onblur()` | `blur` |\n| `onfocus()` | `focus` |\n| `onchange()`\
  \ | `change` |\n| `onmouseover()` | `mouseover` |\n| `onmouseout()` | `mouseout`\
  \ |\n| `onmousemove()` | `mousemove` |\n| `onmousedown()` | `mousedown` |\n| `onmouseup()`\
  \ | `mouseup` |\n| `onclick()` | `click` |\n| `ondblclick()` | `dblclick` |\n| `onkeydown()`\
  \ | `keydown` |\n| `onkeyup()` | `keyup` |\n| `onkeypress()` | `keypress` |\n| `onsubmit()`\
  \ | `submit` |\n| `onload()` | `load` |\n| `onunload()` | `unload` |\n\nW3C 和早期的\
  \ Internet Explorer 模型都包含了移除事件监听器的方法。在 W3C 模型中，该方法称为 `removeEventListener()`，并带有与\
  \ `addEventListener()` 相同的三个参数：\n\n```\nremoveEventListener(event,function,capture/bubble)\n\
  ```\n\n早期的 Internet Explorer 模型使用 `detachEvent()` 实现相同的目的：\n\n```\ndetachEvent(event,function);\n\
  ```\n\n你可能会发现，在执行初始事件处理器后，有必要停止事件处理向上或向下传播。W3C 模型使用 `stopPropagation()` 方法来实现此目的，而早期的\
  \ Internet Explorer 模型使用 `cancelBubble` 属性。我在本章后半部分的打开、关闭和调整窗口大小 中提供了这种行为的示例。\n\n\
  ## 通用事件处理器\n\n为每个需要处理的事件快速添加事件监听器可能会变得非常繁琐。相反，为此目的请使用通用事件处理器，以便你可以抽象跨浏览器的不兼容性。示例\
  \ 11-1 显示了一个通用事件处理器。你可以在配套内容的第 11 文件夹下的 `ehandler.js` 文件中找到这段代码。\n\n### 示例 11-1.\
  \ 通用事件处理器。\n\n```javascript\nvar EHandler = {};\nif (document.addEventListener)\
  \ {\n    EHandler.add = function(element, eType, eFunc) {\n        if (eType ==\
  \ \"load\") {\n            if (typeof window.onload == \"function\") {\n       \
  \         var existingOnload = window.onload;\n                window.onload = function()\
  \ {\n                    existingOnload();\n                    eFunc();\n     \
  \           } //结束现有的 onload 处理器\n            } else {\n                window.onload\
  \ = eFunc;\n            }\n        } else {\n            element.addEventListener(eType,\
  \ eFunc, false);\n        }\n    };\n\n    EHandler.remove = function(element, eType,\
  \ eFunc) {\n        element.removeEventListener(eType, eFunc, false);\n    }\n}\n\
  else if (document.attachEvent) {\n    EHandler.add = function(element, eType, eFunc)\
  \ {\n        if (eType == \"load\") {\n            if (typeof window.onload == \"\
  function\") {\n                var existingOnload = window.onload;\n           \
  \     window.onload = function() {\n                    existingOnload();\n    \
  \                eFunc();\n                } //结束现有的 处理器\n            } else {\n\
  \                window.onload = eFunc;\n            }\n        } else {\n     \
  \       element.attachEvent(\"on\" + eType, eFunc);\n        }\n    };\n    EHandler.remove\
  \ = function(element, eType, eFunc) {\n        element.detachEvent(\"on\" + eType,\
  \ eFunc);\n    };\n}\n```\n\n\n\n\n这种通用事件处理器会创建一个名为 `EHandler`（代表 event handler，即事件处理器）的对象，然后向其添加两个方法：`add()`\
  \ 和 `remove()`，这两个方法在 W3C 和早期的 Internet Explorer 模型中都是可用的。每种模型中的 `add` 方法都会判断事件类型是否为加载事件（load\
  \ event），这意味着该函数需要在页面加载时执行。如果需要执行，则 `add` 处理器需要判断是否已经定义了现有的 `onload` 函数。如果存在，处理器必须将\
  \ `onload` 函数设置为与新定义的函数一起运行。\n\n为了本章及本书的剩余部分，我希望你将此文件保存为名为 `ehandler.js` 的外部 JavaScript\
  \ 文件，并将其添加到任何需要事件处理器的 JavaScript 文件中。提醒你一下，你可以这样添加一个外部 JavaScript 文件：\n\n```\n<script\
  \ type=\"text/javascript\" src=\"ehandler.js\"></script>\n```\n\n幸运的是，Windows Internet\
  \ Explorer 9 使用的是 W3C 兼容模型；随着这个新版本的浏览器在市场上变得越来越流行，`attachEvent` 将逐渐被取代。然而，支持早期浏览器的网站在未来几年内仍需要使用旧的微软模型。\n\
  \n你可以改进此事件处理器脚本，使其更适合你在构建更强大的 JavaScript 应用时可能遇到的情况。（你可以在 John Resig 的网站上找到关于此主题的更多信息：`[`ejohn.org/blog/flexible-javascript-events/`](http://ejohn.org/blog/flexible-javascript-events/)`。）但更好的解决方案是使用\
  \ JavaScript 框架或库（例如 jQuery）来进一步抽象事件模型。\n\n## 更多信息\n\n我将从第 19 章 开始，更深入地讨论 jQuery\
  \ 和其他 JavaScript 框架。目前，本节提供的简单事件处理器脚本作为本书的示例已经足够。对于使用事件的更高级 JavaScript 编程，我建议你使用如\
  \ jQuery 等库，而不是这里显示的简单事件处理器。\n\n本章的剩余部分将应用你从第 9 章中学到的关于事件的知识，从第 10 章中学到的文档对象模型知识，以及从第一部分中学到的语法。\n\
  \n# 检测访问者信息\n\nJavaScript 编程通常需要`浏览器检测`——即检测网站访问者使用的是哪种浏览器。多年年来，浏览器检测很大程度上是通过使用\
  \ `navigator` 对象的 `userAgent` 属性实现的。`userAgent` 属性可以通过 `navigator` 对象获取，并显示有关用户浏览器的信息。然而，不再建议依赖\
  \ `userAgent` 属性，因为访问者可以轻易伪造它。此外，为每个器的器的版本维护准确的 `userAgent` 信息是非常困难的。\n\n我个人使用五个不同版本的浏览器。仅仅为我这几个浏览器维护一份哪些浏览器支持哪些功能的最新列表就已经太繁琐了。想象一下，试图维护一套考虑到*每一个*浏览器和该浏览器*每一个*版本的\
  \ JavaScript 代码会什么样！这几乎是不可能的。而且这甚至还没有考虑到伪造的（出于恶意或其他目的）`userAgent` 字符串！\n\n因此，我简要讨论了\
  \ `userAgent` 属性，然后转向更新（且好得多）的方法来判断你正在使用的 JavaScript 是否能在访问者的浏览器中运行。本节还检查了 `navigator`\
  \ 对象的其他有用属性，尽管它们并非 100% 可靠。\n\n## 概述 `userAgent` 属性\n\n如所述，`userAgent` 字符串是 `navigator`\
  \ 对象的一个属性。它包含了有关用户浏览器的信息。要显示 `userAgent` 信息，只需在浏览器中输入以下内容：\n\n```\njavascript:alert(navigator.userAgent);\n\
  ```\n\n如果你正在使用 Windows Internet Explorer 7，你可能会看到类似图 11-1 的警框。\n\n![navigator 对象的\
  \ userAgent 属性。](img/httpillycomsourcemspimages748823.png)\n\n图 11-1. navigator\
  \ 对象的 `userAgent` 属性。\n\n其他浏览器报告不同的信息。例如，一个版本的 Firefox 报告如下：\n\n```\nMozilla/5.0\
  \ (Windows; U; Windows NT 6.1; en-US; rv:1.9.2.3) Gecko/20100401 Firefox/3.6.3\n\
  ```\n\n此字符串通常随着每个浏览器新版本的发布而变化。如果你尝试跟踪每个浏览器的每个版本，然后尝试跟踪每个浏览器的版本支持 JavaScript 的每种功能，你将花费大量时间（可能还有你雇主或客户的时间）来维护该列表。\n\
  \n跟踪访问者浏览器支持和不支持内容的更好方法是种被称为“特性测试”（feature testing）的技术，将在下一节讨论。\n\n## 特性测试\n\n使用`特性测试`有时也称为`对象检测`），JavaScript\
  \ 程序尝试检测浏览器是否支持给定的特性。幸运的是，你不需要测试访问者浏览器是否支持你想使用的*每一个*函数和方法。DOM Level 0 模型和 JavaScript\
  \ 的早期函数支持得非常广泛，它们的跨浏览器实现也非常接近，因此没有必要对特定特性进行测试。然而，你仍然必须测试 JavaScript 是否可用，因为并不是所有浏览器都支持\
  \ JavaScript。\n\n`typeof` 运算符是实现特性测试的主要机制。通常，你这样使用它：\n\n```\nif (typeof featureName\
  \ != \"undefined\") {\n    // 对该功能做一些有趣的操作\n}\n```\n\n尝试一个示例。要测试 `getElementById()`\
  \ 方法是否存在（这表示浏览器支持更高级的 DOM 接口），你可以使用此代码：\n\n```\nif (typeof document.getElementById\
  \ != \"undefined\") {\n    alert(\"getelementid is supported\");\n} else {\n   \
  \ alert(\"no getelementid support\");\n}\n```\n\n你可能会忍不住跳过在测试中使用 `typeof`，你可能会在网上看到特性测试看起来像这样的示例：\n\
  \n```\nif (document.getElementById) { ... }\n```\n\n遗憾的是，这种特性测试方法没有 `typeof` 测试那样可靠。问题在于这种简短的语法会执行该方法。当你省略\
  \ `typeof` 时，被测试的方法或属性可能会默认返回 *0* 或 *false*，导致测试失败；换句话说，看起来浏览器不支持该方法或属性——但实际上它是支持的。因此，使用\
  \ `typeof` 进行测试更安全、更可靠。\n\n完成此任务的另一种看起来更整洁的方法是使用*三元*运算符在代码早期设置一个标记。之后运行的脚本可以使用标准的\
  \ `if` 条件来检查该标记，如下所示：\n\n```\n// 测试 getElmementById，将结果赋值给 getElem\nvar getElem\
  \ = (typeof document.getElementById == \"function\") ? true : false;\n\n// 现在你可以测试\
  \ getElem\nif (getElem) {\n    // 我们知道支持 getElementById，\n    // 所以让我们使用它。\n}\n\
  ```\n\n## 让 JavaScript 隔绝在旧浏览器之外\n\n\n\n\n作为一名 Web 程序员，你面临的最令人沮丧的问题之一就是处理旧版浏览器的存在。编写既具有现代视觉效果，又能在旧版浏览器中良好显示的网页，正变得越来越困难。什么定义了“旧版浏览器”？去问三个不同的网页设计师，你可能会得到三个不同的答案。对我来说，旧版浏览器是指发布时间超过三年的浏览器，尽管我更倾向于说是两年而不是三年。\n\
  \n根据这个定义，`Firefox 1.0` 是一个旧版浏览器，尽管大多数网页上显示正常，而且你编写的几乎所有的 JavaScript 代码在那个版本的 `Firefox`\
  \ 中可能都能完美运行。一个更通用的规则是，`Internet Explorer` 或 `Netscape` 的 5 版本之前的任何版本往往都有许多许多网页设计师必须考虑的怪异行为（quirks）。\n\
  \n鉴于“即使是比 `Microsoft Internet Explorer 5.0` 更旧的浏览器有时仍在使用”这一令人沮丧的事实，接受你的代码可能在这些浏览器中失败是一个明智的举措。你可以尝试让你的代码优雅地失败；然而，即使这样做也并不总是可能的。我最近安装了一个\
  \ `Netscape 3` 的副本（如果我没记错，它是 1997 年发布的）。该浏览器在处理大多数 JavaScript 时存在困难，在基础网站上显示 HTML\
  \ 和 CSS（级联样式表）也存在问题。这是意料之中的，因为那个版本的 `Netscape` 在今天使用的许多标准制定很久很久发布了。重点是，无论你如何努力，你的网站在非常旧版本的浏览器中可能永远无法优雅失败。我建议你选择一个最低支持的浏览器级别——并针对该目标进行设计，同时记住最低级别越高，你排除的访问者就越多。目标是在成为一个受欢迎的网站和一个尖端的网站之间取得平衡。\n\
  \n有两种防止 JavaScript 影响旧版浏览器的主要技术：在 JavaScript 中插入 HTML 风格的注释，以及使用 `<noscript>` `</noscript>`\
  \ 标签。\n\n要在 JavaScript 中使用 HTML 注释，你需要将它们封装在 `<!--` 和 `-->` 标记之间，例所示：\n\n```\n<script\
  \ type=\"text/javascript\">\n<!-- //Begin Comment\nvar helloelem = document.getElementById(\"\
  hello\");\nalert(helloelem.innerHTML);\n// End Comment-->\n</script>\n```\n\n不幸的是，并不是每个浏览器都遵守这些\
  \ HTML 注释，所以你有时仍然会错误。这种注释（或保护）风格正变得越来越常见。随着旧版浏览器逐渐被淘汰，这种变通方法已不再真正需要。\n\n位于 `<noscript>`\
  \ `</noscript>` 标签对之间的任何内容只有在页面检测到浏览器不支持 JavaScript 时才会显示。这里有一个 `<noscript>` 的示例：\n\
  \n```\n<noscript>\n<p>This Web Page Requires JavaScript</p>\n</noscript>\n```\n\n\
  当浏览器不接受 JavaScript 的访问者访问网页时，他们会看到 `<noscript>` `</noscript>` 标签对之间的内容。在这个示例中，他们将看到文字“This\
  \ Web Page Requires JavaScript”。请注意，使用 `<noscript>` 不会停止文档其余部分的执行或解析，因此页面内的其他 HTML\
  \ 仍显示，但使用它确实为你提供了一个优雅失败的好机会，通过提供纯文本页面或网站地图链接。\n\n我建议尽量减少对 `<noscript>` 的使用，并仅在那些\
  \ JavaScript 对功能而言是绝对必需的应用程序中使用它，而不是在 JavaScript 仅提供行为方面（如鼠标悬停效果）的应用程序中使用它。你可以很容易地过度使用\
  \ JavaScript 或错误地使用它，从而阻碍而非增强用户体验。最糟糕的过于让访问者来到你的网站，却因为某些不必要的 JavaScript 组件导致他们的浏览器崩溃、死锁或无无响应。\n\
  \n### 提示\n\n记住，访问者可能不具备 JavaScript 能力有几个合理的理由，其中最重要的一点是他们可能正在使用无障碍/辅助浏览器或文本阅读器。你应该努力让你的网站支持文本功能，并提供网站地图以提高易用性。\n\
  \n## 其他 `navigator` 属性和方法\n\n尽管 `userAgent` 字符串已不再流行，但 `navigator` 对象确实提供了一些 JavaScript\
  \ 程序员可以获取的有用信息。第 9 章详细探讨了 `navigator` 对象，展示了 `navigator` 对象的所有属性，以及如何确定浏览器中是否启用了\
  \ Java。\n\n### 注意事项\n\n谨慎使用 `navigator` 对象。有时结果可能并不完全准确。更糟糕的是，当访问者的浏览器不支持 JavaScript\
  \ 时，`navigator` 对象可能是不可用的。例如，依赖 `navigator` 对象的属性来实现页面的功能绝对是一个问题！\n\n# 打开、关闭和调整窗口大小\n\
  \nJavaScript 最受诟病的用途之一是它打开、关闭和调整浏览器窗口大小的能力。响应 `onload` 事件或作为其一部分来打开浏览器窗口的行为，是互联网广告商采用的最频繁且最人烦的操作之一（且现在仍在使用）。Mozilla\
  \ Firefox、Opera 以及其他浏览器允许用户默认阻止所有这些骚扰，而不会牺牲易用性。带有 Service Pack 2 及更高版本的 Windows\
  \ Internet Explorer 6.0 也具有该能力。\n\n我还没有见过任何一个可以在不侵入性的情况下增强网站易用性的自动弹出窗口。如果你认为你的网站需要一个打开新窗口的组件，我建议在创建该组件之前重新考虑导航。不仅你的访问者会感谢你（因为你的网站简化了导航且更加直观），而且你的网站运行得会更好，因为它不再依赖可能被禁用的\
  \ JavaScript。\n\n尽管有这些恼人的窗口，你的访问者有时可能想响应鼠标点击等事件打开新窗口。例如，点击链接可能会打开一个较小的侧边窗口，允许访问者从菜单中选择选项，或者显示有关各种选项的帮助文本。\n\
  \n`window` 对象包含了几个有助于打开、关闭和调整浏览器窗口大小的方法。正如你可能猜到的那样，`open` 方法用于打开新的浏览器窗口。`open()`\
  \ 方法的基本语法如下：\n\n```\nwindow.open(url, name, features)\n```\n\n`url` 参数是一个表示要加载的统一资源定位符\
  \ (URL) 的字符串。如果此参数为空，浏览器将打开默认的 `about:blank` 页面。`name` 参数是一个表示要打开窗口名称的字符串。如果已打开同名的窗口，URL\
  \ 将在该命名窗口中打开；否则将打开新窗口。\n\n`features` 参数是一个逗号分隔的选项字符串，代表你希望新窗口拥有的各种功能，例如窗口的高度和宽度以及滚动条。表\
  \ 11-3 列出了可用的一些功能。此列表并不完整，因为不同的浏览器支持不同的功能和名称。有关 Internet Explorer 的信息请见 *[`msdn2.microsoft.com/en-us/library/ms53661.aspx`](http://msdn2.microsoft.com/en-us/library/ms53661.aspx)*，有关\
  \ Firefox 和 Mozilla 家族的信息请见 *[`developer.mozilla.org/en/DOM/window.open`](https://developer.mozilla.org/en/DOM/window.open)*。\n\
  \n\n\n\n\n| `directories` | 决定新窗口中是否显示个人工具栏或书签工具栏。在 Firefox 中可以由用户配置。 |\n| `height`\
  \ | 新窗口的高度（单位：像素）。 |\n| `left` | 新窗口放置距离屏幕左边缘的距离（单位：像素）。 |\n| `location` | 决定是否显示地址栏。在\
  \ Internet Explorer 7 及更高版本中，此栏始终显示，在 Firefox 中可以更改为始终显示，因此此选项正逐渐过时。 |\n| `menubar`\
  \ | 决定新窗口中是否出现菜单栏。 |\n| `resizable` | 决定访问者是否可以调整窗口大小。Firefox 始终允许调整窗口以满足可访问性（同时也为了通用的用户体验）。\
  \ |\n| `scrollbars` | 决定是否显示滚动条。 |\n| `status` | 决定新窗口中是否显示状态栏。在 Firefox 中可以由用户配置。\
  \ |\n| `toolbar` | 决定新窗口中是否出现工具栏。 |\n| `top` | 新窗口放置距离屏幕顶边缘的距离（单位：像素）。 |\n| `width`\
  \ | 新窗口的宽度（单位：像素）。 |\n\n某些浏览器允许用户控制表 11-3 中的选项是否生效。例如，尝试在新窗口中隐藏地址栏在 Internet Explorer\
  \ 或 Firefox 中是无效的（取决于用户如何配置 Firefox）。\n\n`window` 对象的 `close()` 方法没有参数。要使用 `close()`，只需像这样调用它：\n\
  \n```\nwindow.close()\n```\n\n此方法并不总是能可靠地起作用，因此你永远不要假设窗口已实际关闭。在理想情况下，你只能希望它已经关闭了。\n\
  \n## 窗口打开的最佳实践\n\n尽管你可以仅使用窗口框架来打开新窗口（如图 11-2 所示），但我建议除非特殊情况，否则不要这样做。\n\n![一个没有菜单栏或用户在浏览器窗口中期待许多其他功能的窗口。](img/httpatomoreillycomsourcemspimages748825.png.jpg)\n\
  \n图 11-2。一个没有菜单栏或用户在浏览器窗口中期待许多其他功能的窗口。\n\n相反，在任何新打开的窗口中包含菜单、导航元素和地址栏。Firefox 以及日益发展的\
  \ Internet Explorer 不允许 JavaScript 禁用调整大小等功能以及状态栏等界面组件。这些元素对于让访问者根据自己的需求而非开发者的需求来使用网站和应用程序非常重要。包含这些选项，并设计你的页面和网站使用访问者不受这些界面元素的影响，是最佳方法。\n\
  \n你会发现 `window.open()` 变得越来越没。随着标签页浏览的出现，`window.open()` 已接近其寿命终点。下一节将超出 JavaScript\
  \ 书的范围，展示如何在不使用任何 JavaScript 的情况下打开新标签。\n\n## 打开标签：需要 JavaScript 吗？\n\n实际上，你不需要任何\
  \ JavaScript 就可以打开新标签，而这正是大多数开发者真正想要的。相反，你可以使用锚点元素（`<a>`）的 `target` 属性来打开新标签。使用\
  \ `target` 属性是更好的，因为它不会在 Firefox 和 Internet Explorer 7 或更高版本等后期浏览器中干扰访问者的体验。\n\n\
  以下是 `target` 属性的使用示例：\n\n```\n<a target=\"Microsoft\" href=\"http://www.microsoft.com\"\
  \ id=\"mslink\">Go To Microsoft</a>\n```\n\n另一个在未命名的新标签中打开的示例：\n\n```\n<a target=\"\
  _blank\" href=\"http://www.microsoft.com\" id=\"mslink\">Go To Microsoft</a>\n```\n\
  \n## 调整大小和移动窗口\n\nJavaScript 也支持调整浏览器窗口。然而，像 Firefox 等浏览器包含一个防止 JavaScript 调整窗口大小的选项。因此，我强烈建议不要使用\
  \ JavaScript 调整窗口大小，本书仅简要介绍了执行此操作的方法和属性。关于调整或移动浏览器窗口的更多信息，请参考 `http://support.microsoft.com/kb/287171`。\n\
  \n第 9 章包含一个名为“获取屏幕信息”的章节，展示了窗口 `screen` 对象的属性，包括 `availHeight` 和 `availWidth`。这些属性有时用于辅助更改浏览器窗口的大小。`window`\
  \ 对象中与其他调整大小和移动窗口相关的有用属性和方法列于表 11-4。\n\n表 11-4. 与移动和调整窗口相关的选属性和方法\n\n| 属性/方法 | 说明\
  \ |\n| --- | --- |\n| `moveBy(x,y)` | 按 `x` 和 `y` 像素量移动窗口。 |\n| `moveTo(x,y)` |\
  \ 将窗口移动到由 `x` 和 `y` 指定的坐标。 |\n| `resizeBy(x,y)` | 按 `x` 和 `y` 像素量调整窗口大小。 |\n| `resizeTo(x,y)`\
  \ | 将窗口调整为由 `x` 和 `y` 指定的大小。 |\n\n# 定时器\n\nJavaScript 包含了名为 `timers`（计时器）的函数，正如你所猜，它们会对事件计时或按指定的间隔延迟执行代码。\n\
  \nJavaScript 定时器涉及四个全局函数：\n\n* `setTimeout()`\n* `clearTimeout()`\n* `setInterval()`\n\
  * `clearInterval()`\n\n在最基础的情况下，设置计时器的两个相关函数——`setTimeout()` 和 `setInterval()` 期望两个参数：要调用或执行的函数以及间隔。使用\
  \ `setTimeout()` 时，指定的函数会在计时器过期时被调用。使用 `setInterval()` 时，指定的函数会在每次计时间隔结束后被调用。这些函数返回一个标识符，你可以使用它配合相应的的\
  \ `clearTimeout()` 和 `clearInterval()` 函数来清除或停止计时器。\n\n计时器相关函数以毫秒而非秒运行。在使用这些函数时记住这一点。没有比这更糟糕了：设置一个间隔为\
  \ 1，期望它每秒执行一次，结果发现它尝试每秒执行 1,000 次。\n\n### 提示\n\n一秒钟是 1,000 毫秒。\n\n示例 11-2（在配套内容的\
  \ listing11-2.htm 文件中）展示了 `setTimeout()` 函数的示例，设置为 3 秒后显示警报框。\n\n示例 11-2。`setTimeout()`\
  \ 的示例。\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>timer</title>\n<script type=\"text/javascript\" src=\"\
  ehandler.js\"></script>\n</head>\n<body id=\"mainBody\">\n<p>Hello</p>\n<script\
  \ type=\"text/javascript\">\nfunction sendAlert() {\n    alert(\"Hello\");\n}\n\
  function startTimer() {\n    var timerID = window.setTimeout(sendAlert,3000);\n\
  }\nvar mainBody = document.getElementById(\"mainBody\");\nEHandler.add(mainBody,\
  \ \"load\", function() { startTimer(); });\n</script>\n</body>\n</html>\n```\n\n\
  \n\n\n\n示例 11-2 的示例\") 中的示例包含了两个函数：`sendAlert()` 和 `startTimer()`。页面的 `onload` 事件调用了\
  \ `startTimer()` 函数，该函数有一行调用了 `setTimeout()` 函数。在这种情况下，`setTimeout()` 函数会在 3 秒（3000\
  \ 毫秒）后调用另一个名为 `sendAlert()` 的函数。\n\n`timerID`变量包含一个指向 `setTimeout()` 函数调用的内部资源。你可以使用此\
  \ `timerID` 变量来取消定时，如下：\n\n```\ncancelTimeout(timerID);\n```\n\n`setTimeout()` 函数可以接受原始\
  \ JavaScript 代码而不是函数调用；但使用函数调用是推荐的方法。选择包含原始 JavaScript 代码而不是函数调用可能会某些浏览器中导致 JavaScript\
  \ 错误。\n\n# 练习\n\n| 1. | 创建一个网页，包含一个使用 DOM 0 内联事件连接到链接的 `onclick` 事件处理器。该事件处理器应该显示一个“你点击了这里”的警框。\
  \ |\n| 2. | 将练习 1 中创建的网页改为使用 `ehandler.js`（在配套内容中）所示的新样式事件处理，并连接相同的 `click`/`onclick`\
  \ 事件以显示练习 1 中创建的警框。 |\n| 3. | 创建一个带有 *[`www.microsoft.com`](http://www.microsoft.com)*\
  \ 链接的网页。该链接在新标签页中打开。 |\n\n# 第 12 章 创建和使用 Cookie\n\n**阅读本章后，你将能够：**\n\n* 理解 HTTP\
  \ cookie。\n* 使用 JavaScript 创建 cookie 并将其发送到浏览器。\n* 理解如何让 cookie 在将来过期。\n* 理解如何为\
  \ cookie 设置路径和域。\n* 从浏览器中读取 cookie 并解析其内容。\n\n## 理解 Cookie\n\n超文本传输协议（HTTP）cookie\
  \ 是客户端（通常是浏览器）和服务器之间往回传输的数据。它们被用于跟踪一切信息，从应用程序的状态（例如你在应用程序中的位置）到会话信息，再到关于你访问的信息（例如你的用户\
  \ ID，尽管有很多理由说明你不应该在 cookie 中存储用户 ID 或任何其他个人信息）。\n\n`RFC 2965` 详细描述了 HTTP cookie——可能比你现在想知道的更多。你可以在此处查看\
  \ RFC [`www.rfc-editor.org/cgi-bin/rfcdoctype.pl?loc=RFC&letsgo=2965&type=ftp&file_format=txt`](http://www.rfc-editor.org/cgi-bin/rfcdoctype.pl?loc=RFC&letsgo=2965&type=ftp&file_format=txt)。\n\
  \n## Cookie 与隐私\n\n尽管有些人可能将某些隐私问题归咎于 cookie，但 cookie 本身是无害的。最好的情况下，它们仅在访问者保持浏览器打开期间留在随机内存（RAM）中；最坏的情况下，它们以文本文件的形式位于访问者的硬盘上。\n\
  \n除了存储在其中的信息外，cookie 不会引发隐私问题。是的，确实没有任何阻止网站运营者在 cookie 中存储不应该存在的数据，但网站运营者也可以通过与其他\
  \ cookie 无关的不安全方式存储这些数据。Cookie 不是问题——问题在于那些滥用它们存储私有数据的人。你存储在 cookie 中的任何内容，其安全性取决于存储它的计算机。因此，我建议你永远不要在\
  \ cookie 中存储个人身份信息。保护你访问者的数据安全。\n\ncookie 通常只是一个文本文件——这是理解它最简单、最方便的方法。cookie 可以包含几个不同的元素，但本质上是一组\
  \ `name/value` 对，其中许多由站点运营者或开发者设置，并且是可选的。\n\n当访问者来到我的网站 *[`www.braingia.org/`](http://www.braingia.org/)*\
  \ 并点击博客链接时，他们的计算机上可能会产生一个 cookie。cookie 的内容可能如下：\n\n```\nName: cookie4blog\nContent:\
  \ sess_id02934235\nDomain: www.braingia.org\nPath: /\nSend For: Any type of connection\n\
  Expires: Never\n```\n\n浏览器会将 cookie 存储在访问者的计算机上，直到 cookie 过期（在这种情况下永不过）。当重复访问者返回站点时，访问者的浏览器会将\
  \ cookie 发送到服务器。服务器就可以知道该访问者之前来过这里，服务器可以使用 cookie 中的某些个性化设置来定制访问者的体验。\n\ncookie\
  \ 的特性之一是它们只发送到设置它们的域的服务器。因此，上述代码中显示的 cookie 只有当浏览器尝试访问的域名与 *[www.braingia.org](http://www.braingia.org)*\
  \ 匹配时才会由浏览器发送到服务器。此外，cookie 可以设置 `secure` 标记（示例中的没有）。如果设置了 `secure` 标记，cookie 只能通过启用安全套层（SSL）的会话发送，例如通过安全超文本传输协议（HTTPS）连接。\n\
  \n### 注意\n\n第三方 cookie 以及某些人绕过域限制的微妙方法超出了本书的范围。\n\nJavaScript 既可以创建也可以读取 cookie。本章的剩余部分将介绍这两个功能。\n\
  \n## 使用 JavaScript 创建 Cookie\n\n你可以使用 `document.cookie` 属性使用 JavaScript 创建 cookie。本节讨论了如何创建\
  \ cookie 并将其发送到站点访问者的浏览器。\n\n### 提示\n\n在处理 cookie 时，使用简单的字符串值很重要。避免空格、标点和其他非字母数字字符，因为它们是不允许的。你可以在\
  \ cookie 中使用这些非法字符，但不能以原始形式——你必须对它们进行转义，否则可能会给 cookie、页面和浏览器带来问题。与其他 JavaScript\
  \ 和通用 Web 编程中的问题一样，这些问题可能是微妙的，且通常难以排错。如有疑问，请坚持使用字母数字字符。\n\n## 查看一个简单的 Cookie\n\n\
  cookie 需要一个名称。这段 JavaScript 代码创建了一个 cookie 并将其发送到浏览器：\n\n```\nvar cookName = \"\
  testcookie\";\nvar cookVal = \"testvalue\";\nvar myCookie = cookName + \"=\" + cookVal;\n\
  document.cookie = myCookie;\n```\n\n当你访问带有上述 JavaScript 代码的页面时，代码会在你的浏览器中设置一个名为\
  \ `testcookie` 的 cookie。假设你允许该 cookie，浏览器将存储 cookie 的数据（`testvalue`）以及关于 cookie\
  \ 的其他信息供以后使用。\n\n当你通过 JavaScript 设置 cookie 时，cookie 会附加到任何现有 cookie 的末尾。当你开始读取 cookie\
  \ 时，这个过程将更有意义。你还应该理解，要在特定 cookie 中指定属性，必须在构建 cookie 时将属性的 `name/value` 对连接到 cookie\
  \ 上。接下来的示例将帮助你直观地理解处理 cookie 的这一方面。\n\n# 设置 Cookie 的过期日期\n\n之前显示的示例通过构建 `name/value`\
  \ 对创建了 cookie，如下：\n\n```\nvar myCookie = cookName + \"=\" + cookVal;\n```\n\n本质上，代码看起来如下（此\
  \ cookie 仅设置了 cookie 名称和 cookie 数据）：\n\n```\ntestcookie=testvalue;\n```\n\n要添加过期日期，你需要添加一个\
  \ `expires` 属性，因此 cookie 变为：\n\n```\ntestcookie=testvalue; expires=Sat, 12 Mar 2011\
  \ 17aad:51:50 GMT;\n```\n\n添加过期日期只是将过期日期连接到要发送的 cookie 末尾的问题。过期日期的格式非常重要。为了为 cookie\
  \ 正确格式化日期，你需要几个不同的 JavaScript 函数。在下面的练习中，你将练习创建一个带有过期日期的 cookie。\n\n\n\n\n\n在开始练习之前，最好在浏览器中启用\
  \ cookie 提示。这样做会使调试变得容易得多，因为每当服务器或某些 JavaScript 代码向你的浏览器发送 cookie 时，你都会收到提示。\n\n\
  遗憾的是，在 Windows Internet Explorer 中启用提示并不不可靠，因此你需要使用 Firefox 完成此练习。在 Windows 版本的\
  \ Firefox 中，点击 `Tools`（工具）然后点击 `Options`（选项）（在 Linux  Firefox 中，点击 `Edit` 编辑然后点击\
  \ `Preferences` 偏好设置）。在 `Options` 对话框中，点击 `Privacy`（隐私）图标，然后从下拉列表中选择 `Use Custom\
  \ Settings For History`（使用自定义设置历史）。现在从 `Keep Until` 下拉列表中选择 `Ask Me Every Time`（每次询问），如图图\
  \ 12-1 所示。\n\n![在 Firefox 中更改 cookie 设置。](img/httpatomoreillycomsourcemspimages748827.png)\n\
  \n图 12-1. 在 Firefox 中更改 cookie 设置。\n\n### 提示\n\n在测试完 cookie 相关问题后，不要忘记将这些设置改回正常设置。由于大多数网站都设置了大量的\
  \ cookie，持续的提示可能会非常烦人。\n\n### 为 cookie 添加过期日期\n\n1. 使用 Microsoft Visual Studio、Eclipse\
  \ 或编辑器，编辑配套内容中 `Chapter12` 示例文件夹下的 `cookie-expire.htm` 文件。\n\n2. 在网页中，添加此处所示的**粗体**代码（代码位于配套内容的\
  \ `cookie-expire.txt` 中，完成版本位于 `cookie.htm` 中——两者都在配套内容中）：\n\n```\n<!DOCTYPE HTML\
  \ PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>Hello Cookie</title>\n<script type=\"text/javascript\"\
  >\nvar cookName = \"testcookie\";\nvar cookVal = \"testvalue\";\nvar myCookie =\
  \ cookName + \"=\" + cookVal;\ndocument.cookie = myCookie;\n</script>\n</head>\n\
  <body>\n<p>Hello</p>\n</body>\n</html>\n```\n\n3. 将此页面部署到服务器并在网页浏览器中查看。你应该收到如下所示的提示：\n\
  \n![为 cookie 添加过期日期](img/httpatomoreillycomsourcemspimages748829.png)\n\n在 Firefox\
  \ 中点击 `Deny`（拒绝）以确保此 cookie 不被浏览器保存。如果你不接受了 cookie，请关闭浏览器并重新打开。因为这是一个会话 cookie（session\
  \ cookie），它会在关闭浏览器时关闭。恭喜你——你已经使用 JavaScript 代码向浏览器发送了 cookie！\n\n4. 修改代码以添加日期的行。这些代码应该出现在\
  \ `myCookie` 变量声明之前，如下：\n\n```\nvar date = new Date();\ndate.setTime(date.getTime()+604800000)\n\
  var expireDate = date.toGMTString();\n```\n\n5. 修改 `myCookie` 变量声明以包含新的过期元素：\n\n\
  ```javascript\nvar myCookie = cookName + \"=\" + cookVal + \";expires=\" + expireDate;\n\
  ```\n\n6. 现在整个代码应该看起来如下所示（添加的行以**粗体**显示）：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n\
  <title>Hello Cookie</title>\n<script type=\"text/javascript\">\nvar cookName = \"\
  testcookie\";\nvar cookVal = \"testvalue\";\nvar date = new Date();\ndate.setTime(date.getTime()+604800000)\n\
  var expireDate = date.toGMTString();\nvar myCookie = cookName + \"=\" + cookVal\
  \ + \";expires=\" + expireDate;\ndocument.cookie = myCookie;\n</script>\n</head>\n\
  <body>\n<p>Hello</p>\n</body>\n</html>\n```\n\n7. 在网页浏览器中查看时，页面上的 JavaScript 代码向浏览器发送一个\
  \ cookie，其过期日期正好是为你访问后的一整周。你看到的对话框如下截图所示。如有必要，点击 `Show Details`（显示详细）按钮展开对话框，使其看起来像这样：\n\
  \n![为 cookie 添加过期日期](img/httpatomoreillycomsourcemspimages748831.png)\n\n在此练习中，添加或修改了四行代码以允许\
  \ cookie 过期过期，而不是仅在活动浏览器窗口生命周期内存在。前三行设置了日期。第一行创建一个新日期并将其放入 `date` 变量中。接下来，代码使用 `setTime()`\
  \ 方法设置日期。`setTime()` 方法的参数是一个包含 `getTime()` 调用的表达式。`getTime()` 方法获取自 1970 年 1 月\
  \ 1 日以来的当前毫秒数日期。`getTime()` 返回的值代表当前日期，因此为了让 cookie 在未来的某个时间过期（在本例中为一周后），你计算出一周的秒数（准确来说是\
  \ 604,800 秒），然后乘以 1,000 将时间转换为毫秒。将所得数字（604,800,000）加到 `getTime()` 返回的值上。然后，你可以借助\
  \ `date` 对象的 `toGMTString()` 方法将此数字转换为格林尼治标准时间（GMT）字符串。\n\n最后，代码向 cookie 附加了 `expires`\
  \ 属性。最终结果如下：\n\n```\ntestcookie=testvalue;expires=Mon, 12 Jul 2010 23:22:22 GMT\n\
  ```\n\n### 设置 Cookie 路径\n\n在目前为止的示例中，在我的测试机器上，当 HTTP 请求的路径匹配 `*/jsbs/c12/*` 时，浏览器会将\
  \ cookie 发送到服务器，因为服务器是我为我的环境提供页面的地方。此路径在其他情况下可能会不同，例如在你的环境中或你的测试机器上。你可以通过在设置 cookie\
  \ 时添加另一个选项来更改此路径。更常见的场景只是将路径设置为正斜杠（`/`），这样 cookie 就可以适用于源域名的所有请求。\n\n与 `expires`\
  \ 选项一样，设置路径涉及向 cookie 附加 `name/value` 键值对。\n\n这是一个像本章之前所示的示例网页，它包含了之前添加的过期代码以及新的路径选项（以**粗体**显示，并在配套内容中的\
  \ `cookie-path.htm` 文件中）：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n<title>Hello Cookie</title>\n\
  <script type=\"text/javascript\">\nvar cookName = \"testcookie\";\nvar cookVal =\
  \ \"testvalue\";\nvar date = new Date();\ndate.setTime(date.getTime()+604800000)\n\
  var expireDate = date.toGMTString();\nvar path = \";path=/\";\nvar myCookie = cookName\
  \ + \"=\" + cookVal + \";expires=\" + expireDate + path;\ndocument.cookie = myCookie;\n\
  </script>\n</head>\n<body>\n<p>Hello</p>\n</body>\n</html>\n```\n\n前面的代码添加了一行路径功能并更改了\
  \ `myCookie` 变量定义。有了这段新代码，生成的 cookie 现在看起来如下：\n\n```\ntestcookie=testvalue;expires=Mon,\
  \ 12 Jul 2010 23:22:22 GMT;path=/\n```\n\n查看此 cookie 的页面，你会看到一个类似于图 12-2 的 cookie\
  \ 对话框。\n\n![在 cookie 中设置路径。](img/httpatomoreillycomsourcemspimages748833.png)\n\n\
  图 12-2. 在 cookie 中设置路径。\n\n### 设置 Cookie 域\n\n到为止的示例尚未设置 `domain` 属性；`domain` 默认设置为向浏览器发送\
  \ cookie 的服务器主机和域名（或负责提供 cookie 的 JavaScript 代码的服务器）。在这些示例中，域名一直是 `www.braingia.org`。然而，许多网站（包括\
  \ `braingia.org`）有多个提供 HTTP 内容的主机。例如，可能有一台完全独立的服务器，也许称为 `images.braingia.org`，它专门提供\
  \ `braingia.org` 页面上的图像。如果你能简单地将域设置为 `braingia.org`，以便相同的 cookie 就能在整个域内共享，这将非常方便。\n\
  \n\n\n\n\n如果你认为设置 cookie 的域（domain）就像设置路径（path）一样，那么你是正确的。在 cookie 中添加 `domain`\
  \ 选项会将域设置为特定的值。这里是一个集成了路径、过期日期以及现在域的示例网页。指定域并向 `myCookie` 变量添加 `domain` 属性的新代码已用**粗体**显示（并位于配套内容中的\
  \ `cookie-domain.htm` 文件）：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML\
  \ 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html\n<head>\n<title>Hello\
  \ Cookie</title>\n<script type=\"text/javascript\">\nvar cookName = \"testcookie\"\
  ;\nvar cookVal = \"testvalue\";\nvar date = new Date();\ndate.setTime(date.getTime()+604800000)\n\
  var expireDate = date.toGMTString();\nvar path = \";path=/\";\nvar domain = \";domain=braingia.org\"\
  ;\nvar myCookie = cookName + \"=\" + cookVal + \";expires=\" + expireDate + path\
  \ + domain;\ndocument.cookie = myCookie;\n</script>\n</head>\n<body>\n<p>Hello</p>\n\
  </body>\n</html>\n```\n\n当你在浏览器中查看此页面时，会弹出诸如图 12-3 所示的对话框。\n\n![设置 cookie 的域，使其能够从\
  \ braingia.org 域的任何地方读取。](img/httpatomoreillycomsourcemspimages748835.png)\n\n图\
  \ 12-3. 设置 cookie 的域，使其能够从 `braingia.org` 域的任何地方读取。\n\n### 提示\n\n就像你可以让域变得不那么具体（如本例所示），你也可以让它变得更具体，这允许你创建可能仅被\
  \ `images.braingia.org` 或 `someotherspecificcomputer.braingia.org` 读取的 cookie。然而，你不能设置一个超出内容所在域范围的域。例如，你不能将从\
  \ `braingia.org` 服务的 cookie 的域值改为 `microsoft.com`。浏览器将直接忽略它。\n\n## 使用安全 Cookie\n\
  \n在 cookie 中设置 `secure` 标志表示该 cookie 只有在连接使用 SSL（例如 HTTPS 连接）时才会被发送。\n\n你在本章中使用的向\
  \ `myCookie` 变量添加 `secure` 标志的代码如下：\n\n```javascript\nvar myCookie = cookName +\
  \ \"=\" + cookVal + \";expires=\" + expireDate + path + domain +\n\";secure\";\n\
  ```\n\n当你在浏览器中查看此页面时，即使是经过未加密的 HTTP 连接，JavaScript 代码也会创建该 cookie，如图 12-4 所示的对话框所示。注意，“Send\
  \ For”（发送方式）选项的值现在是“仅限加密连接”，而在本章之前的所有截图中，该值被设置为“任何类型的连接”。\n\n![设置 cookie 的 secure\
  \ 标志。](img/httpatomoreillycomsourcemspimages748837.png)\n\n图 12-4. 设置 cookie 的 `secure`\
  \ 标志。\n\n此时，你已经掌握了使用 JavaScript 设置 cookie 的所有知识。现在是时候学习如何使用 JavaScript 读取 cookie\
  \ 了。\n\n## 使用 JavaScript 读取 Cookie\n\n到目前为止，你已经查看了在访问网页时向浏览器发送 cookie 的代码。当浏览器随后访问一个其域和路径与客户端计算机上存储的\
  \ cookie 匹配的页面时，浏览器会将任何匹配的 cookie 与同网页请求一起发送到服务器。当页面交付给浏览器时，页面中的 JavaScript 代码可以使用该\
  \ cookie。\n\n使用 JavaScript 读取 cookie 涉及从 `document.cookie` 对象获取 cookie，然后将其拆分为易于处理的部分。调用\
  \ `document.cookie` 的 `split` 方法就可以处理此操作，因为 cookie 是用分号分隔的，类似于 cookie 属性的分隔方式（如本章上一节所述）。这里有一个示例：\n\
  \n```javascript\nvar incCookies = document.cookie.split(\";\");\n```\n\n通过这段 JavaScript\
  \ 代码，所有的 cookie 都将被拆分并等待访问。在 `for` 循环的帮助下，你可以遍历该域可用的所有 cookie，以找到每个 cookie 的名称和数据，如下所示。（注意此代码没有检查\
  \ cookie 名称和 cookie 数据以外的每个 cookie 属性。）\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html\n<head>\n<title>Reading\
  \ Cookie</title>\n<script type=\"text/javascript\">\nvar incCookies = document.cookie.split(\"\
  ;\");\nvar cookLength = incCookies.length;\nfor (var c = 0; c < cookLength; c++)\
  \ {\nalert(incCookies[c]);\n}\n</script>\n</head>\n<body>\n<p>Hello</p>\n</body>\n\
  </html>\n```\n\n这段代码（`readcookie.htm`）将该域可用的 cookie 读取到变量 `incCookies` 中。cookie\
  \ 在分号处被拆分。例如，我通过前面的代码为 `braingia.org` 设置了几个 cookie。查看图 12-5 和图 12-6 以查看输出示例。\n\n\
  ![循环读取的第一个 cookie。](img/httpatomoreillycomsourcemspimages748839.png)\n\n图 12-5.\
  \ 循环读取的第一个 cookie。\n\n![循环读取的第二个 cookie。](img/httpatomoreillycomsourcemspimages748841.png)\n\
  \n图 12-6. 循环读取的第二个 cookie。\n\n使用 `for` 循环，你可以沿等号（`=`）拆分 cookie，从而进一步区分 cookie 名称和\
  \ cookie 数据，如下所示：\n\n```javascript\nvar incCookies = document.cookie.split(\";\"\
  );\nvar cookLength = incCookies.length;\nfor (var c = 0; c < cookLength; c++) {\n\
  \    var pairs = incCookies[c].split(\"=\");\n    var cookieName = pairs[0];\n \
  \   var cookieValue = pairs[1];\n    alert(\"Name: \" + cookieName + \" - Value:\
  \ \" + cookieValue);\n}\n```\n\n在此代码中，每个 `incCookies[c]` 会在等号（`=`）处拆分并放入变量 `pairs`。`pairs`\
  \ 的第一个索引是 cookie 的名称；第二个索引是其数据。查看图 12-7 以查看输出示例。\n\n![拆分键值对以分离 cookie 名称和数据。](img/httpatomoreillycomsourcemspimages748843.png)\n\
  \n图 12-7. 拆分 `name/value` 对以分离 cookie 名称和数据。\n\n## 删除 Cookie\n\n没有内置方法可以通过 JavaScript\
  \ 或任何其他删除删除 cookie。删除 cookie，只需清除其值并将其过期日期设置为过去的某个时间。\n\n之前的示例使用此代码创建并设置 cookie：\n\
  \n```javascript\nvar cookName = \"testcookie\";\nvar cookVal = \"testvalue\";\n\
  var date = new Date();\ndate.setTime(date.getTime()+604800000)\nvar expireDate =\
  \ date.toGMTString();\nvar path = \";path=/\";\nvar domain = \";domain=braingia.org\"\
  ;\nvar myCookie = cookName + \"=\" + cookVal + \";expires=\" + expireDate + path\
  \ + domain;\ndocument.cookie = myCookie;\n```\n\n你可以通过将过期日期设置为过去的某个时间来删除此 cookie。注意，组件（如*名称、路径和域*）必须匹配，才能重置\
  \ cookie。实际上，你想用一个在过去过期的新 cookie 来覆盖现有的 cookie，如下：\n\n\n\n\n\n```\nvar cookName\
  \ = \"testcookie\";\nvar cookVal = \"\";\nvar date = new Date();\ndate.setTime(date.getTime()-60)\n\
  var expireDate = date.toGMTString();\nvar path = \";path=/\";\nvar domain = \";domain=braingia.org\"\
  ;\nvar myCookie = cookName + \"=\" + cookVal + \";expires=\" + expireDate + path\
  \ + domain;\ndocument.cookie = myCookie;\n```\n\n这段代码（位于辅助内容中的 `cookie-delete.htm`\
  \ 文件中）会将 `testcookie` 数据设置为空值，并将过期日期设置为过去。\n\n### 注意事项\n\n当执行此 JavaScript 代码时，Firefox\
  \ 会删除删除 cookie；但其他浏览器可能会保留该 cookie 直到浏览器关闭。\n\n# 练习题\n\n1. 创建一个向浏览器发送 cookie 的网页。将过期日期设置为提前一天。通过查看\
  \ cookie 被设置时或存储在计算机上的状态，来验证 JavaScript 代码是否已将 cookie 发送到浏览器。你可以通过使用 JavaScript\
  \ 或查看计算机上的 cookie 来完成此练习的第二部分。\n2. 创建一个向浏览器发送 cookie 的网页，将 cookie 的过期日期设置为提前一周，并设置\
  \ `secure` 标志。此页面可以是你为练习 1 创建的同一个页面，但确保给 cookie 分配不同的名称，以便你创建了两个独立的 cookie，每个练习一个。此外，确保在此练习中为\
  \ cookie 启用 `secure` 标志，而不是练习 1 中的 cookie。\n3. 创建一个尝试读取设置了 `secure` 标志的 cookie 的网页。你收到\
  \ cookie 了吗？如果没有，你需要做什么才能接收它？\n4. 创建一个读取你在练习 1 中创建的 cookie 的网页。使用 `for` 循环和 `if`\
  \ 条件，在循环中找到正确名称的 cookie 时显示 `alert()` 对话框。不要为任何其他 cookie 显示 `alert()` 对话框。\n\n#\
  \ 第 13 章 在 JavaScript 中处理图像\n\n读完本章后，你将能够：\n\n* 理解 JavaScript 创建滚停图像（rollover images）的新旧方法。\n\
  * 使用 JavaScript 预加载图像。\n* 创建图像幻灯片。\n* 使用 JavaScript 增强图像映射。\n\n# 处理图像滚停\n\n`image\
  \ rollover` 术语是指用户将鼠标移动到图像上时更改图像，以提供关于鼠标在屏幕上位置的视觉反馈。尽管这种技术已很大程度上被基于层叠样式表（CSS）的解决方案取代，但由于这是一本\
  \ JavaScript 书，我向你展示创建滚停的 JavaScript 方法。即使你使用 CSS 来创建它们，你仍然从学习基于 JavaScript 的滚停的工作原理中受益。\n\
  \n滚停利用了与计算机鼠标移动相关的事件，主要是 `mouseover` 和 `mouseout`。\n\n## 简单的滚停\n\n在 `img` 标签内放置\
  \ `mouseover` 和 `mouseout` 事件处理器可以创建滚停效果。这些处理器显示的图像之间只有细微差别。以下 HTML 使用旧的 DOM 事件处理模型创建了滚停效果：\n\
  \n```\n<img id=\"home\" name=\"img_home\" src=\"box1.png\" alt=\"Home\"\nmouseover=\"\
  window.document.img_home.src='box2.png'\"\nmouseout=\"window.document.img_home.src='box1.png'\"\
  >\n```\n\n此 `img` 标签的重要部分是它的名称（`img_home`）；`mouseover` 和 `mouseout` 事件；以及当这些事件触发运行时的代码。标签的名称允许你通过\
  \ `window.document` 对象调用轻松访问图像，而 `mouseover` 和 `mouseout` 事件使动作发生。在网络浏览器中查看时，前面的代码加载名为\
  \ `box1.png` 的图像，如图 13-1 所示。\n\n![通过网页加载 box1.png 图像的初始加载。](img/httpatomoreillycomsourcemspimages748845.png.jpg)\n\
  \n图 13-1。通过网页加载 box1.png 图像的初始加载。\n\n当你将鼠标移动到图像上时，`mouseover` 事件触发，后续代码将图像源更改为 `box2.png`：\n\
  \n```\nwindow.document.img_home.src='box2.png'\n```\n\n当鼠标停在图像上时，图像将变为图 13-2 所示的图像，其中渐变的方向发生了反转。\n\
  \n![鼠标移动到图像上时图像发生变化。](img/httpatomoreillycomsourcemspimages748847.png.jpg)\n\n图\
  \ 13-2。鼠标移动到图像上时图像发生变化。\n\n当鼠标移开图像时，得益于 `mouseout` 事件，图像将变回 `box1.png`，该事件调用了这段\
  \ JavaScript：\n\n```\nwindow.document.img_home.src='box1.png'\n```\n\n## 现代滚停\n\n\
  使用 JavaScript 创建滚停的较新方法是使用文档对象模型（DOM）和 `window` 对象的 `onload` 事件。（`window` 对象的 `onload`\
  \ 事件已在第 11 章 中介绍过。）使用 DOM 时，当页面调用 `onload` 事件时，`onload` 处理器会调用一个 JavaScript 函数，为文档中的所有图像填充\
  \ `mouseover` 和 `mouseout` 事件。\n\n### 使用现代滚停\n\n尽管我将使用 DOM 配合 `onload` 称为现代滚停,它确实实现了非侵入式脚本的目标，但可能有些繁琐。在各种浏览器和平台之间使用时，兼容性也略低。\n\
  \n我体内的实用主义者想说使用刚刚展示的示例是可以接受的，特别是如果你的网页只有几张图形，但我觉得如果你告诉你使用它，就像在教一种坏习惯。因此，我由你来选择哪种方法适合你。如果你有许多需要滚停效果的图像，你会发现这种使用通用函数处理滚停事件的更现代的方法更容易维护。\n\
  \n此页的工作与上一节的示例完全相同，但使用了不同的代码，如示例 13-1 所示（参见示例代码中的 listing13-1.txt）。\n\n示例 13-1。滚停的另一种方法。\n\
  \n```javascript\nfunction rollover() {\n    var images = document.getElementsByTagName(\"\
  img\");\n    var imgLength = images.length;\n    for (var i = 0; i < imgLength;\
  \ i++) {\n        images[i].mouseover = mouseOver;\n        images[i].mouseout =\
  \ mouseOut;\n    }\n}\nfunction mouseOver() {\n    this.src = \"box2.png\";\n}\n\
  \nfunction mouseOut() {\n    this.src = \"box1.png\";\n}\n```\n\n这段代码配合 `onload`\
  \ 事件处理器创建了一个简单的鼠标悬停效果。通过使用第 11 章中创建的代码（ehandler.js）中的 `EHandler` 事件创建对象，你可以将 `onload`\
  \ 事件添加到 `<body>` 标签中。首先，包含 ehandler.js 脚本：\n\n```html\n<script=\"text/javascript\"\
  \ src=\"ehandler.js\"></script>\n```\n\n接下来，响应 `onload` 事件调用 `rollover` 函数。再次，你使用\
  \ `EHandler` 对象的 `add` 方法设置此项。在 HTML 的末尾添加以下代码：\n\n```javascript\n<script type=\"\
  text/javascript\">\nvar bodyEl = document.getElementsByTagName('body')[0];\nEHandler.add(bodyEl,\"\
  load\",function() { rollover(); });\n</script>\n```\n\n尽管功能与前面的示例相同，但示例 13-1 中的代码并不具有移植性。（你很快就会做工作来改进这一点。）以下是对示例\
  \ 13-1 代码的解释。\n\n\n\n\n\n该函数使用 `document` 对象的 `getElementsByTagName()` 方法获取所有 `img`\
  \ 元素，并将它们放入一个名为 `images` 的变量中。接下来，代码通过 `length` 属性获取 `images` 变量中包含的元素数量，并将结果存储在\
  \ `imgLength` 变量中。代码使用 `imgLength` 中的值遍历所有的 `images`。在循环内部，它将 `mouseover` 和 `mouseout`\
  \ 事件设置为它们对应的函数，在这段代码中分别称为 `mouseOver()` 和 `mouseOut()`。\n\n到目前，这段代码具有非常好的可移植性，尽管它并没有反映最佳实践。在\
  \ `mouseOver` 和 `mouseOut` 事件处理程序中，代码变得稍微糟糕了一些，因为 `src` 属性被硬编码为文件名 `box1.png` 和\
  \ `box2.png`。如果你只有一张图片及其配套的鼠标悬停效果（如本例所示），这没问题。但是，如果你有一个满是图像的页面（这在现实世界中更为常见），这段代码就会失效。此外，当\
  \ `this` 关键字从另一个与事件处理相关的函数调用时，它的行为非常怪异。因此，该脚本需要改进。\n\n这个示例代码展示了实现鼠标悬停效果（rollovers）的基本理论：遍历图像（或通过\
  \ ID 获取它们），并将它们的 `mouseover` 和 `mouseout` 事件设置为特定的函数，这些函数反过来应该将 `src` 属性设置为该事件要使用的图像名称。现在轮到你来让该函数更具可移植性，以便你将来可以使用它。\n\
  \n此练习使用了六张图片（三张图形，每张图形都有一个默认图像和一个鼠标悬停图像），但代码被编写为支持任意数量的图像。我将练习中使用的图片随本书的可下载代码一并提供了，所以你不需要为了让这个练习运行而重新造轮子。\n\
  \n### 创建可移植的鼠标悬停效果\n\n1. 使用 Microsoft Visual Studio、Eclipse 或编辑器，编辑配套内容中 `Chapter13\\\
  rollover sample files` 文件夹下的 `rollover.htm` 文件。该文件夹包含六张图片：`home_default.png`、`home_over.png`、`about_default.png`、`about_over.png`、`blog_default.png`\
  \ 和 `blog_over.png`。包含 `*_default` 的文件名是初始显示的图像；包含 `*_over` 的文件名是鼠标悬停图像。\n\n2. 在网页中，将此处所示**粗体**代码添加到\
  \ `rollover.txt` 中（以替换 TODO 注释）：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html\n<head>\n<title>Rollover</title>\n\
  <script type=\"text/javascript\" src=\"ehandler.js\"></script>\n<script type=\"\
  text/javascript\">\nfunction rollover() {\n    var images = document.getElementsByTagName(\"\
  img\");\n    var imgLength = images.length;\n    for (var i = 0; i < imgLength;\
  \ i++) {\n        EHandler.add(images[i],\"mouseover\", function(i) {\n        \
  \    return function() {\n                images[i].src = images[i].id + \"_over.png\"\
  ;\n            };\n        }(i));\n        EHandler.add(images[i],\"mouseout\",\
  \ function(i) {\n            return function() {\n                images[i].src\
  \ = images[i].id + \"_default.png\";\n            };\n        }(i));\n     }\n}\n\
  </script>\n</head>\n<body>\n<p><img id=\"home\" name=\"img_home\" src=\"home_default.png\"\
  \ alt=\"Home\"></p>\n<p><img id=\"blog\" name=\"img_blog\" src=\"blog_default.png\"\
  \ alt=\"Blog\"></p>\n<p><img id=\"about\" name=\"img_about\" src=\"about_default.png\"\
  \ alt=\"About\"></p>\n<script type=\"text/javascript\">\nvar bodyEl = document.getElementsByTagName(\"\
  body\")[0];\nEHandler.add(bodyEl,\"load\", function() { rollover(); });\n</script>\n\
  </body>\n</html>\n```\n\n3. 在浏览器中查看该页面。你应该看到一个与此截图类似的页面。如果你遇到问题，请确保每张图片都位于当前目录，因为\
  \ `img` 标签就是在那里寻找它们的。\n\n![创建可移植的鼠标悬停效果](img/httpatomoreillycomsourcemspimages748849.png.jpg)\n\
  \n4. 逐一鼠标悬停按钮。每张图像都应该变为对应的鼠标悬停图像。当鼠标悬停在 Blog 图形上时，屏幕显示如下：\n\n![创建可移植的鼠标悬停效果](img/httpatomoreillycomsourcemspimages748851.png.jpg)\n\
  \n这个示例展示了更好的鼠标悬停实现。与上一个示例一样，这段代码创建了一个函数并使用 `window.onload` 事件调用它。同样，上一个示例，这段代码将所有图像收集到名为\
  \ `images` 的变量中，然后遍历每一个图像，为每个图像添加 `mouseover` 和 `mouseout` 事件处理程序，如下：\n\n```javascript\n\
  function rollover() {\n    var images = document.getElementsByTagName(\"img\");\n\
  \    var imgLength = images.length;\n    for (var i = 0; i < imgLength; i++) {\n\
  \        EHandler.add(images[i],\"mouseover\", function(i) {\n            return\
  \ function() {\n                images[i].src = images[i].id + \"_over.png\";\n\
  \            };\n        }(i));\n        EHandler.add(images[i],\"mouseout\", function(i)\
  \ {\n            return function() {\n                images[i].src = images[i].id\
  \ + \"_default.png\";\n            };\n        }(i));\n    }\n}\n```\n\n\n\n\n```html\n\
  <p><img id=\"rollover_about\" name=\"img_about\" src=\"rollover_about_default.png\"\
  \ alt=\"About\"></p>\n```\n\n新的代码迭代通过 `match()` 方法使用正则表达式来检查 `id` 属性是否包含 `rollover`\
  \ 单词。如果包含，代码将继续悬停（rollover）动作；否则，它直接返回。图 13-3 显示了一个包含四张图片的示例页面，其中三张图片具有悬停行为。\n\n\
  ![只有某些图像具有悬停效果的示例。](img/httpatomoreillycomsourcemspimages748853.png.jpg)\n\n图 13-3。只有某些图像具有悬停效果的示例。\n\
  \n当你将鼠标移动到页面上方的三个图片的任何一个上时，悬停图像就会加载。然而，由于最后一张图片的 `ID` 不包含 `rollover` 单词，因此它没有获得\
  \ `mouseover` 或 `mouseout` 事件处理程序。这里是完整的代码（但注意，脚本在完成之前还需要稍微改进）。请注意图像文件的新名称。（此代码包含在\
  \ `rolloverregexp` 文件夹的配套示例文件中。）\n\n```javascript\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n\
  <title>Rollover</title>\n<script type=\"text/javascript\" src=\"ehandler.js\"></script>\n\
  <script type=\"text/javascript\">\nfunction rollover() {\n    var images = document.getElementsByTagName(\"\
  img\");\n    var imgLength = images.length;\n    for (var i = 0; i < imgLength;\
  \ i++) {\n        if (images[i].id.match(/rollover/)) {\n            EHandler.add(images[i],\"\
  mouseover\", function(i) {\n                return function() {\n              \
  \      images[i].src = images[i].id + \"_over.png\";\n                };\n     \
  \       }(i));\n            EHandler.add(images[i],\"mouseout\", function(i) {\n\
  \                return function() {\n                    images[i].src = images[i].id\
  \ + \"_default.png\";\n                };\n            }(i));\n        }\n    }\n\
  }\n</script>\n</head>\n<<body>\n<p><img id=\"rollover_home\" name=\"img_home\" src=\"\
  rollover_home_default.png\"\nalt=\"Home\"></p>\n<p><img id=\"rollover_blog\" name=\"\
  img_blog\" src=\"rollover_blog_default.png\"\nalt=\"Blog\"></p>\n<p><img id=\"rollover_about\"\
  \ name=\"img_about\" src=\"rollover_about_default.png\"\nalt=\"About\"></p>\n<p><img\
  \ id=\"logo\" name=\"img_logo\" src=\"logo.png\" alt=\"Braingia Logo\"></p>\n<script\
  \ type=\"text/javascript\">\nvar bodyEl = document.getElementsByTagName(\"body\"\
  )[0];\nEHandler.add(bodyEl,\"load\", function() { rollover(); });\n</script>\n</body>\n\
  </html>\n```\n\n此代码与早早代码之间的区别非常微小，存在于 `rollover()` 函数和 HTML 中的 `img` 元素中。在 `rollover()`\
  \ 函数中，直接在 `match()` 方法中构建了一个正则表达式，用于在图片的 `id` 属性中查找 `rollover` 字符串。如果在 ID 中出现了 `rollover`\
  \ 字符串，则设置悬停动作，就像之前的示例中一样。如果没有找到该字符串，`for` 循环将继续执行。\n\n# 预加载图像\n\n你可能在初次开始处理上一节中的悬停示例时注意到一个问题。当首次加载悬停图像时，可能需要几秒钟来渲染。这种延迟是因为图像在浏览器中显示之前，必须通过网络服务器和网络进行加载。\n\
  \n这不是一个巨大的问题；在超高速网络连接上使用应用程序时，更多是一种干扰。但在现实世界的 Web 应用中，这种延迟是明显的，特别是对于可能在慢拨号连接上的用户。幸运的是，你可以使用一些\
  \ JavaScript 来预加载图像。在浏览器中缓存图像，这样当访问者将鼠标移动到图像上时，几乎几乎可以使用。\n\n预加载图像的基本原理是创建一个 `image`\
  \ 对象，然后对该对象调用 `src()` 方法，指向你想要预加载的图像。你在调用 `src()` 方法后对该对象进行的操作并不重要。JavaScript 会异步调用加载图像，因此在图像后台加载时，脚本的其余部分继续执行。\n\
  \n预加载的异步性质当你处理多个图像时确实具有重要意义：你必须为需要预加载的每张图像创建一个新的 `image` 对象。如果你有一组悬停图像（这通常如此），每张图片都需要它自己的对象和\
  \ `src()` 方法调用。\n\n悬停代码的最终版本包含了预加载。示例 13-2 显示了悬停脚本以及 HTML 元素。\n\n```javascript\n\
  <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>Rollover</title>\n<script type=\"text/javascript\" src=\"\
  ehandler.js\"></script>\n<script type=\"text/javascript\">\nfunction rollover()\
  \ {\n    var images = document.getElementsByTagName(\"img\");\n    var imgLength\
  \ = images.length;\n    var preLoad = [];\n    for (var i = 0; i < imgLength; i++)\
  \ {\n        if (images[i].id.match(/rollover/)) {\n            preLoad[i] = new\
  \ Image();\n            preLoad[i].src = images[i].id + \"_over.png\";\n       \
  \     EHandler.add(images[i],\"mouseover\", function(i) {\n                return\
  \ function() {\n                    images[i].src = images[i].id + \"_over.png\"\
  ;\n                };\n            }(i));\n            EHandler.add(images[i],\"\
  mouseout\", function(i) {\n                return function() {\n               \
  \     images[i].src = images[i].id + \"_default.png\";\n                };\n   \
  \         }(i));\n        }\n    }\n}\n</script>\n</head>\n<body>\n<p><img id=\"\
  rollover_home\" name=\"img_home\" src=\"rollover_home_default.png\"\nalt=\"Home\"\
  ></p>\n<p><img id=\"rollover_about\" name=\"img_about\" src=\"rollover_about_default.png\"\
  \nalt=\"About\"></p>\n<p><img id=\"rollover_blog\" name=\"img_blog\" src=\"rollover_blog_default.png\"\
  \nalt=\"Blog\"></p>\n<p><img id=\"logo\" name=\"img_logo\" src=\"logo.png\" alt=\"\
  Braingia Logo\"></p>\n<script type=\"text/javascript\">\nvar bodyEl = document.getElementsByTagName(\"\
  body\")[0];\nEHandler.add(bodyEl,\"load\", function() { rollover(); });\n</script>\n\
  </body>\n</html>\n```\n\n回顾一下，该代码使用了图像标签命名约定来构建图像名称，因此在本章稍之前讨论的所有关于同步 `id` 属性与 JavaScript\
  \ 的警告均适用。\n\n# 使用幻灯片\n\n你可以使用 JavaScript 创建一种“幻灯片”效果，在浏览器窗口中将一张图像替换为另一张。在本章中，你构建的是一个访问者控制的幻灯片——即访问者通过点击按钮在图像中向前向后移动来控制图像变化，而不是定时幻灯片（即应用程序在一定间隔后自动切换图像）。\n\
  \n## 创建幻灯片\n\n你可以通过多种方式实现幻灯片功能。一种方法可能是使用 `for` 循环遍历图像，但本节将展示另一种更为简单直观的幻灯片变体。\n\n\
  \n\n\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>幻灯片</title>\n<script type=\"text/javascript\" src=\"ehandler.js\"\
  ></script>\n<script type=\"text/javascript\">\nvar images = ['home_default.png','about_default.png','blog_default.png','logo.png'];\n\
  function nextImage() {\n    var img = document.getElementById(\"slideimage\");\n\
  \    var imgname = img.name.split(\"_\");\n    var index = imgname[1];\n    if (index\
  \ == images.length - 1) {\n        index = 0;\n    } else {\n        index++;\n\
  \    }\n    img.src = images[index];\n    img.name = \"image_\" + index;\n}\n</script>\n\
  </head>\n<body>\n<p><img id=\"slideimage\" name=\"image_0\" src=\"home_default.png\"\
  \ alt=\"Home\"></p>\n<form name=\"slideform\">\n<input type=\"button\" id=\"nextbtn\"\
  \ value=\"Next\">\n</form>\n<script type=\"text/javascript\">\nvar nextBtn = document.getElementById(\"\
  nextbtn\");\nEHandler.add(nextBtn,\"click\",function() { nextImage(); });\n</script>\n\
  </body>\n</html>\n```\n\n我或许可以讨论一下这段代码的 HTML 部分，因为它很短。内容如下：\n\n```html\n<p><img\
  \ id=\"slideimage\" name=\"image_0\" src=\"home_default.png\" alt=\"Home\"></p>\n\
  <form name=\"slideform\">\n<input type=\"button\" id=\"nextbtn\" value=\"Next\"\
  >\n</form>\n```\n\n这段 HTML 代码显示一张图片，并将其 `ID` 和 `name` 设置为特定值，这些值稍后将被 JavaScript\
  \ 使用。接下来，它创建了一个值为 `Next` 的表单按钮。就是这些了。\n\n代码的 JavaScript 部分首先链接到在第 11 章中中开发的 `EHandler`\
  \ 对象脚本：\n\n```html\n<script type=\"text/javascript\" src=\"ehandler.js\"></script>\n\
  ```\n\n用于在幻灯片中移动的核心代码如下：\n\n```javascript\nvar images = ['home_default.png','about_default.png','blog_default.png','logo.png'];\n\
  function nextImage() {\n    var img = document.getElementById(\"slideimage\");\n\
  \    var imgname = img.name.split(\"_\");\n    var index = imgname[1];\n    if (index\
  \ == images.length - 1) {\n        index = 0;\n    } else {\n        index++;\n\
  \    }\n    img.src = images[index];\n    img.name = \"image_\" + index;\n}\n```\n\
  \nJavaScript 创建了一个图片数组。\n\n### 注意\n\n在脚本中创建的此图片数组只包含文件名，因此图片文件必须与正在执行的 JavaScript\
  \ 位于同一目录。否则，此数组中的图片文件名也需要包含适当的路径。\n\n接下来，文档主体中的脚本使用 `EHandler.add()` 方法将 `nextImage()`\
  \ 函数连接到 Next 按钮的 `click` 事件：\n\n```javascript\n<script type=\"text/javascript\"\
  >\nvar nextBtn = document.getElementById(\"nextbtn\");\nEHandler.add(nextBtn,\"\
  click\",function() { nextImage(); });\n</script>\n```\n\n此时，当用户点击 Next 按钮时，脚本将调用\
  \ `nextImage()` 函数。`nextImage()` 函数使用 `getElementById()` 函数从 `<<img>>` HTML 标签中获取图片对象。接着，它在下划线字符处该图片的\
  \ `name` 属性进行分割，这样函数就可以从 `name` 属性的末尾字符中获取数字。它将该数字存储在 `index` 变量中。\n\n代码的下部分执行条件测试，检查\
  \ `index` 值是否等于 `images` 数组的长度减 1。如果此条件为真，说明用户已到达幻灯片的末尾，因此脚本将 `index` 值置回 `0` 以重新开始。如果幻灯片尚未到达可用图片的末尾，代码将\
  \ `index` 值加 1。\n\nJavaScript 的最后两行代码将 `src` 属性设置为新图片，并恰当地设置其名称，以便在代码下一次执行该函数时可以确定当前的索引。\n\
  \n## 向后移动\n\n你可能会认为，添加一个按钮来实现幻灯片的向后遍历，只需要复制并粘贴你创建的代码，并稍作修改以实现 Previous（上一个）按钮的功能。在大多数情况下，你是正确的。然而，请考虑从第一张图片向后移动的特殊情况。处理这种情况会让使用\
  \ Previous 按钮变得稍微具有挑战性。\n\n接下来的练习复用了你已经在本章之前的练习和示例中见过的一些图形。它们可能会让幻灯片变得相当无聊，请随时将它们替换为手头的任何其他图片。我没有出于任何特殊原因为此示例选择四张图片，所以欢迎你使用更多。但是，请确保至少使用三张图片，以便能够充分测试\
  \ JavaScript 的向后和向前功能。\n\n### 创建 Previous 按钮\n\n1. 使用 Visual Studio、Eclipse 或编辑器编辑\
  \ `Chapter13\\slideshow folder` 中的 `slideshow.htm` 文件，你可以在配套内容中找到它。\n\n2. 在页面中，将\
  \ `slideshow.txt` 中的 TODO 注释替换为此处显示的粗体代码：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n\
  <title>Slideshow</title>\n<script type=\"text/javascript\" src=\"ehandler.js\"></script>\n\
  <script type=\"text/javascript\">\nvar images = ['home_default.png','about_default.png','blog_default.png','logo.png'];\n\
  function nextImage() {\n    var img = document.getElementById(\"slideimage\");\n\
  \    var imgname = img.name.split(\"_\");\n    var index = imgname[1];\n    if (index\
  \ == images.length - 1) {\n        index = 0;\n    } else {\n        index++;\n\
  \    }\n    img.src = images[index];\n    img.name = \"image_\" + index;\n}\n</script>\n\
  </head>\n<body>\n<p><img id=\"slideimage\" name=\"image_0\" src=\"home_default.png\"\
  \ alt=\"Home\"></p>\n<form name=\"slideform\">\n<input type=\"button\" id=\"nextbtn\"\
  \ value=\"Next\">\n</form>\n<script type=\"text/javascript\">\nvar nextBtn = document.getElementById(\"\
  nextbtn\");\nEHandler.add(nextBtn,\"click\",function() { nextImage(); });\n</script>\n\
  </body>\n</html>\n```\n\n3. 在网络浏览器中查看页面。你应该能看到像这样的页面：\n\n![Creating a Previous button](img/httpatomoreillycomsourcemspimages748855.png.jpg)\n\
  \n4. 点击 Next 滚动所有图片。注意，当幻灯片到达末尾时，它会回到第一张图片。\n\n5. 现在修改代码以添加一个 Previous 按钮（新代码所示）：\n\
  \n\n\n\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html\n<head>\n<title>Slideshow</title>\n<script type=\"text/javascript\" src=\"\
  ehandler.js\"></script>\n<script type=\"text/javascript\">\nvar images = ['home_default.png','about_default.png','blog_default.png','logo.png'];\n\
  function nextImage() {\n    var img = document.getElementById(\"slideimage\");\n\
  \    var imgname = img.name.split(\"_\");\n    var index = imgname[1];\n    if (index\
  \ == images.length - 1) {\n        index = 0;\n    } else {\n        index++;\n\
  \    }\n    img.src = images[index];\n    img.name = \"image_\" + index;\n}\n\n\
  function prevImage() {\n    var img = document.getElementById(\"slideimage\");\n\
  \    var imgname = img.name.split(\"_\");\n    var index = imgname[1];\n    if (index\
  \ == 0) {\n        index = images.length - 1;\n    } else {\n        index--;\n\
  \    }\n    img.src = images[index];\n    img.name = \"image_\" + index;\n}\n\n\
  </script>\n</head>\n<body>\n<p><img id=\"slideimage\" name=\"image_0\" src=\"home_default.png\"\
  \ alt=\"Home\"></p>\n<form name=\"slideform\">\n<input type=\"button\" id=\"prevbtn\"\
  \ value=\"Previous\">\n<input type=\"button\" id=\"nextbtn\" value=\"Next\">\n</form>\n\
  <script type=\"text/javascript\">\nvar nextBtn = document.getElementById(\"nextbtn\"\
  );\nvar prevBtn = document.getElementById(\"prevbtn\");\nEHandler.add(nextBtn,\"\
  click\",function() { nextImage(); });\nEHandler.add(prevBtn,\"click\",function()\
  \ { prevImage(); });\n</script>\n</body>\n</html>\n```\n\n6. 再次在浏览器中查看该页面。你会发现现在了一个“上一个”（Previous）按钮。\n\
  \n![创建一个上一个按钮](img/httpatomoreillycomsourcemspimages748857.png.jpg)\n\n7. 通过任意组合使用这两个按钮，在幻灯片中向前向后移动，以测试页面的功能。\n\
  \n本次练习的代码在 HTML 中添加了一个用于“上一个”功能的新按钮：\n\n```html\n<input type=\"button\" id=\"prevbtn\"\
  \ value=\"Previous\">\n```\n\n此外，JavaScript 添加了一个名为 `prevImage()` 的新函数，用于向后循环图片：\n\
  \n```javascript\nfunction prevImage() {\n    var img = document.getElementById(\"\
  slideimage\");\n    var imgname = img.name.split(\"_\");\n    var index = imgname[1];\n\
  \    if (index == 0) {\n        index = images.length - 1;\n    } else {\n     \
  \   index--;\n    }\n    img.src = images[index];\n    img.name = \"image_\" + index;\n\
  }\n```\n\n这段代码与 `nextImage()` 函数非常相似，不同之处在于条件判断。如果索引为 `0`，说明幻灯片正处于第一张图片，因此该函数需要循环回到最后一张图片。否则，代码将向后移动一个索引，显示上一张图片。\n\
  \n# 使用图像映射（Image Maps）\n\n图像映射是定义了特定区域以按特定方式运行的图像，例如链接到另一个文档。图像映射经常用于地图，以选出访问者所在的国家或地区。它们也被用于菜单中，尽管随着层叠样式表（CSS）的出现，这种用法有所减少。\n\
  \n遗憾的是，我的画技远不足以画一张世界地图。相反，我创建了一个完全不成比例的表示，展示了北纬 44.52 度、西经 -89.58 度处在夏季月份面向北的一小片夜空。该图形包含在本章的示例代码中（在配套内容中），名为\
  \ `nightsky_map_default.gif`。\n\n在图 13-4 所示的插图中包含四个星座：小熊座、仙王座、天龙座和织女座。\n\n![从威斯康星州斯蒂文斯波特看到的夜空局部](img/httpatomoreillycomsourcemspimages748859.png.jpg)\n\
  \n图 13-4。从威斯康星州斯蒂文斯波特看到的夜空局部。\n\n我将此图形制作成图像映射，这样当访问者点击任何一个星座时，他们将跳转到该星座的 Wikipedia\
  \ 页面。该图像映射的代码在示例 13-4 中所示（并包含在配套内容第 13 章的 nightsky 文件夹的示例文件中）。\n\n示例 13-4。夜空图形的图像映射。\n\
  \n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>Night Sky</title>\n<script type=\"text/javascript\">\n\
  </script>\n</head>\n<body>\n<p><img id=\"nightsky\" name=\"nightsky\" src=\"nightsky_map_default.gif\"\
  \ isMap\nuseMap=\"#sky\" alt=\"The Night Sky\"></p>\n<p><map name=\"sky\">\n<area\
  \ coords=\"119,180,264,228\" alt=\"Ursa Minor\" shape=\"RECT\"\n href=\"http://en.wikipedia.org/wiki/Ursa_Minor\"\
  >\n<area coords=\"66,68,193,170\" alt=\"Draco\" shape=\"RECT\"\n href=\"http://en.wikipedia.org/wiki/Draco\"\
  >\n<area coords=\"36,170,115,246\" alt=\"Draco\" shape=\"RECT\"\n href=\"http://en.wikipedia.org/wiki/Draco\"\
  >\n<area coords=\"118,249,174,328\" alt=\"Draco\" shape=\"RECT\"\n href=\"http://en.wikipedia.org/wiki/Draco\"\
  >\n<area coords=\"201,47,298,175\" alt=\"Draco\" shape=\"RECT\"\n href=\"http://en.wikipedia.org/wiki/Cepheus_(constellation)\"\
  >\n<area coords=\"334,95,389,204\" alt=\"Cassiopeia\" shape=\"RECT\"\n href=\"http://en.wikipedia.org/wiki/Cassiopeia_(constellation)\"\
  >\n</map></p>\n</body>\n</html>\n```\n\n这段代码使用像素坐标创建了一个简单的图像映射，这些坐标代表每个星座的小矩形形状，并使用三个矩形来考虑天龙座的形状和尾部。这段代码本身就可以功能并能创建一个工作的图像映射，但可以使用\
  \ JavaScript 对其进行增强。\n\n图像映射的 `<area>` 标签支持 `mouseover` 和 `mouseout` 事件。通过这些事件和一些\
  \ JavaScript，你可以提高图像映射的可用性。例如，当访问者将鼠标移动到映射区域之一时，你可以加载一张新图像来高亮该星座。以下代码演示了如何这样使用 `mouseover`\
  \ 和 `mouseout` 事件。示例 13-5 显示代码（也包含在配套内容第 13 章的 nightsky 文件夹的示例文件中）。\n\n示例 13-5。带有\
  \ JavaScript 功能的图像映射。\n\n\n\n\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html\n<head>\n<title>Night Sky</title>\n\
  <script type=\"text/javascript\" src=\"ehandler.js\"></script>\n<script type=\"\
  text/javascript\">\nfunction loadConst() {\n    var areas = document.getElementsByTagName(\"\
  area\");\n    var areaLength = areas.length;\n    for (var i = 0; i < areaLength;\
  \ i++) {\n        EHandler.add(areas[i],\"mouseover\", function(i) {\n         \
  \               return function() {\n                           document.getElementById(\"\
  nightsky\").src = \"nightsky_map_\" +\n                               areas[i].id\
  \ + \".gif\";\n                        };\n                    }(i));\n        EHandler.add(areas[i],\"\
  mouseout\", function(i) {\n                        return function() {\n       \
  \                     document.getElementById(\"nightsky\").src =\n            \
  \                  \"nightsky_map_default.gif\";\n                        };\n \
  \                   }(i));\n    }  //end for loop\n}  // end function loadConst\n\
  </script>\n</head>\n<body>\n<p><img id=\"nightsky\" name=\"nightsky\" src=\"nightsky_map_default.gif\"\
  \ isMap\nuseMap=\"#sky\"\nalt=\"The Night Sky\"></p>\n<p><map name=\"sky\">\n<area\
  \ id=\"ursaminor\" coords=\"119,180,264,228\" alt=\"Ursa Minor\" shape=\"RECT\"\n\
  \ href=\"http://en.wikipedia.org/wiki/Ursa_Minor\">\n<area id=\"draco\" coords=\"\
  66,68,193,170\" alt=\"Draco\" shape=\"RECT\"\n href=\"http://en.wikipedia.org/wiki/Draco\"\
  >\n<area id=\"draco\" coords=\"36,170,115,246\" alt=\"Draco\" shape=\"RECT\"\n href=\"\
  http://en.wikipedia.org/wiki/Draco\">\n<area id=\"draco\" coords=\"118,249,174,328\"\
  \ alt=\"Draco\" shape=\"RECT\"\n href=\"http://en.wikipedia.org/wiki/Draco\">\n\
  <area id=\"cepheus\" coords=\"201,47,298,175\" alt=\"Draco\" shape=\"RECT\"\n href=\"\
  http://en.wikipedia.org/wiki/Cepheus_(constellation)\">\n<area id=\"cassie\" coords=\"\
  334,95,389,204\" alt=\"Cassiopeia\" shape=\"RECT\"\n href=\"http://en.wikipedia.org/wiki/Cassiopeia_(constellation)\"\
  >\n</map></p>\n<script type=\"text/javascript\">\nvar bodyEl = document.getElementsByTagName(\"\
  body\")[0];\nEHandler.add(bodyEl,\"load\", function() { loadConst(); });\n</script>\n\
  </body>\n</html>\n```\n\n当你在 浏览器中查看此页面时，当鼠标移动到每个星座上，星座的轮廓就会出现，如图 13-5 所示。增强图像映射的\
  \ JavaScript 实际上只是你在本章稍早看到的悬停代码的变体，尽管它获取的是 `<area>` 元素而不是 `<img>` 元素：\n\n```\nvar\
  \ areas = document.getElementsByTagName(\"area\");\n```\n\n![Adding JavaScript to\
  \ the image map to implement a rollover.](img/httpatomoreillycomsourcemspimages748861.png.jpg)\n\
  \n图 13-5. 在图像映射上添加 JavaScript 以实现悬停效果。\n\n对此脚本而易见的改进是预加载图像映射中的所有悬停图像。（你将在稍后的章节的一个练习中完成此。）\n\
  \n### 注意\n\n此示例中使用的 HTML 并不完全符合 HTML 4.01 标准，因为天龙座（aco）的所有 `<area>` 标签都使用了相同的 `id`\
  \ 值。为了使此 HTML 规范，每个标签都需要它自己的 `id` 值。然而，这会使 JavaScript 复杂化，因为每个 ID 都需要被拆分或解析以确保加载天龙座的轮廓；否则，你将加载三张不同的图像或寻找其他变通方法。\n\
  \n# 练习\n\n| 1. | 创建一个预加载的悬停图像，确保 JavaScript 函数与 HTML 分离。 |\n| 2. | 使用本章的图像映射示例（或者如果你愿意使用自己的图像映射），预加载图像映射中使用的所有图像，这样当访问者移动移动到地图的不同区域时，就不需要下载它们。\
  \ |\n\n# 第 14 章. 在 Web 表单中使用 JavaScript\n\n**读完本章后，你将能够：**\n\n*   理解如何使用 JavaScript\
  \ 验证 Web 表单的输入。\n*   处理单选按钮、选择框和复选框，包括获取它们的值和设置它们的状态。\n*   通过 `alert()` 对话框和文档内内联提供基于验证的反馈。\n\
  *   理解 JavaScript 表单验证的局限性，并看到一个验证错误的示例。\n\n## JavaScript 与 Web 表单\n\nJavaScript\
  \ 用于 Web 表单已经很长时间了——通常是为了在将表单发送到服务器之前，快速验证用户是否正确填写了表单字段，这被称为*客户端验证*。在 JavaScript\
  \ 之前，浏览器必须将表单及其所有内容发送到服务器以确保填写正确，这被称为*服务器端验证*。\n\n### 重要\n\n在使用 JavaScript 时，必须执行服务器端验证，以防用户禁用了\
  \ JavaScript。\n\n还记得早期章节中使用的 `alert()` 函数吗？现代技术使用文档对象模型 (DOM) 提供更友好的反馈。\n\n一个基础表单可能如图\
  \ 14-1 所示。\n\n![A basic form](img/httpatomoreillycomsourcemspimages748863.png)\n\
  \n图 14-1. 基础表单\n\n如果用户没有在文本框中输入任何数据，脚本将显示 `alert()` 对话框指示该字段为必填。填写正确后，例如输入“Steve”，页面将显示名称，如图\
  \ 14-2 所示。\n\n![When the form is filled out correctly.](img/httpatomoreillycomsourcemspimages748865.png)\n\
  \n图 14-2. 填写正确后\n\n![The form displays an alert when the text box is empty.](img/httpatomoreillycomsourcemspimages748867.png)\n\
  \n图 14-3. 当文本框为空时显示显示警告\n\n执行所有操作的代码如下。你可以在配套内容的 `formvalid.htm` 文件中找到它。该文件包含了这里的超文本标记语言\
  \ (HTML)：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>A Basic Example</title>\n<script type=\"text/javascript\"\
  \ src=\"ehandler.js\"></script>\n<script type=\"text/javascript\">\nfunction formValid(eventObj)\
  \ {\n        if (document.forms[0].textname.value.length == 0) {\n            alert(\"\
  Name is required.\");\n            if (eventObj.preventDefault) {\n            \
  \    eventObj.preventDefault();\n            } else {\n                window.event.returnValue\
  \ = false;\n            }\n            return false;\n        } else {\n       \
  \     alert(\"Hello \" + document.forms[0].textname.value);\n            return\
  \ true;\n        }\n}\n</script>\n</head>\n<body>\n<p>A Basic Form Example</p>\n\
  <form action=\"#\">\n<p>Name (Required): <input id=\"textbox1\" name=\"textname\"\
  \ type=\"text\" /></p>\n<p><input id=\"submitbutton1\" type=\"submit\" /></p>\n\
  <script type=\"text/javascript\">\nvar formEl = document.getElementsByTagName(\"\
  form\")[0];\nEHandler.add(formEl,\"submit\", function(eventObj) { formValid(eventObj);\
  \ } );\n</script>\n</form>\n</body>\n</html>\n```\n\n\n\n\n\n`<head>` 元素中的 JavaScript\
  \ 首先链接到事件处理脚本 `ehandler.js`，该脚本是在第 11 章中开发的。接下来，它定义了一个名为 `formValid()` 的函数来处理来自简单表单的输入，代码如下：\n\
  \n```function formValid(eventObj) {\n        if (document.forms[0].textname.value.length\
  \ == 0) {\n            alert(\"Name is required.\");\n            if (eventObj.preventDefault)\
  \ {\n                eventObj.preventDefault();\n            } else {\n        \
  \        window.event.returnValue = false;\n            }\n            return false;\n\
  \        } else {\n            alert(\"Hello \" + document.forms[0].textname.value);\n\
  \            return true;\n        }\n}\n```\n\n在 `formValid()` 函数内部，一个 `if` 条件测试使用了\
  \ `document.forms[]` 数组。通过检查该数组的第一个索引值（`0`），该代码找到了此网页上唯一的表单。条件测试检查表单上 `textname.value`\
  \ 属性的长度是否为 `0`。如果是，脚本将使用 `alert()` 对框指示错误。如果不是，它将显示 `textname.value` 属性中的任何内容。\n\
  \n返回值是非常重要的。当 `submit` 或 `click` 事件处理程序被调用并返回 `false` 时，浏览器会停止表单提交过程。这就是为什么在验证失败时返回\
  \ `false` 至关重要。如果不返回 `false`，默认操作是继续并提交表单。在大多数浏览器中，你可以通过调用 `preventDefault()` 方法停止默认操作。然而，在版本\
  \ 9 之前的 Windows Internet Explorer 中无法使用 `preventDefault()`，因此脚本执行一个条件测试，先检查 `preventDefault()`\
  \ 方法是否可用。如果可用，脚本调用 `preventDefault()`；否则，脚本将 `window.event` 对象的 `returnValue` 属性设置为\
  \ `false` 以兼容 Internet Explorer。\n\n下一部分 JavaScript 出现在 `<body>` HTML 元素中，它通过使用\
  \ `EHandler` 事件处理脚本为表单添加 `submit` 事件：\n\n```javascriptvar formEl = document.getElementsByTagName(\"\
  form\")[0];\nEHandler.add(formEl,\"submit\", function(eventObj) { formValid(eventObj);\
  \ } );\n```\n\n注意，为了获取表单，`formValid()` 函数使用了 `document.forms[]` 列表的索引值，而 `var formEl`\
  \ 定义使用了 `getElementsByTagName` 方法。当页面上只有一个表单时，这两种方法都能正常工作。你还会经常看到通过其名称访问表单的脚本，如下节所示。\n\
  \n# 获取表单数据\n\n在根据表单数据提供反馈之前，你必须获取它的权限。上一个示例展示了如何使用 `document.forms[]` 数组和 `getElementsByTagName`\
  \ 函数访问表单数据。本节展示了执行相同操作的不同方法——使用表单的 `name` 属性而不是它的索引。\n\n像 HTML 页面的其他元素一样，你可以为 `form`\
  \ 元素设置 `id` 属性。这里是带有 `id` 属性的上一个示例：\n\n```html\n<form action=\"#\" name=\"testform\"\
  >\n<p>Name <em>(Required)</em>: <input id=\"textbox1\" name=\"textname\" type=\"\
  text\" /></p>\n<p><input id=\"submitbutton1\" type=\"submit\" /></p>\n</form>\n\
  ```\n\n然后你可以按照如下方式通过其 `name` 而非索引访问表单：\n\n```javascriptdocument.forms[\"testform\"\
  ]\n```\n\n使用 `name` 是很有用的，因为在某些情况下，你可能不知道想要访问的表单的索引值，这种情况在服务器端或客户端代码动态创建表单时经常发生，你必须在文档中计算出（糟糕的是猜测）所需的特定表单的索引值。确保能够获取索引值引用的最一致方法是设置表单的\
  \ `id`，然后通过该 `id` 访问它。你也可以通过非标准方式通过 `document` 对象直接访问表单，但我并不建议这样做：\n\n```javascriptdocument.testform\n\
  ```\n\n这种直接的方法的方法在不同浏览器之间工作得并不一致，而且正确输入它本身并不多费多少精力，如下：\n\n```javascriptdocument.forms[\"\
  testform\"]\n```\n\n# 处理表单信息\n\n你可以通过 DOM 访问 Web 表单的所有单个元素。访问每个元素的具体方法取决于元素的类型。对于文本框和选择框（也称为\
  \ `drop-downs`），`value` 属性持有访问输入或选择的文本。不过，在确定单选按钮和复选框的状态时，你使用的将与 `value` 有些不同的方法，本节将解释这一点。\n\
  \n## 处理选择框\n\n选择框包含一组选项。这里是用于创建选择框的 HTML 示例（你可以在配套内容的 `selectbox.txt` 文件中找到它）。\n\
  \n```html\n<form id=\"starform\" action=\"\">\nSelect A Constellation:\n<select\
  \ name=\"startype\" id=\"starselect\">\n<option selected=\"selected\"> </option>\n\
  <option value=\"Aquila\">Aquila</option>\n<option value=\"Centaurus\">Centaurus</option>\n\
  <option value=\"Canis Major\">Canis Major</option>\n<option value=\"Canis Minor\"\
  >Canis Minor</option>\n<option value=\"Corona Borealis\">Corona Borealis</option>\n\
  <option value=\"Crux\">Crux</option>\n<option value=\"Cygnus\">Cygnus</option>\n\
  <option value=\"Gemini\">Gemini</option>\n<option value=\"Lyra\">Lyra</option>\n\
  <option value=\"Orion\">Orion</option>\n<option value=\"Taurus\">Taurus</option>\n\
  <option value=\"Ursa Major\">Ursa Major</option>\n<option value=\"Ursa Minor\">Ursa\
  \ Minor</option>\n</select>\n</form>\n```\n\n此代码生成了一个类似于图 14-4 所示的选择框。\n\n![基于 HTML\
  \ 的选择框。](http://atomoreillycomimages74869.jpg)\n\n图 14-4. 基于 HTML 的选择框。\n\n当用户选择一个选项时，选择框的\
  \ `value` 属性设置为该选项的值。对于此示例，名为 `startype` 的选择框在其 `value` 属性中持有访问者选择的任何内容。你可以如下所示访问它：\n\
  \n```javascriptdocument.forms[\"starform\"].startype.value\n```\n\n对于这个特定示例，你需要将事件处理程序连接到选择框的\
  \ `change` 事件，你可以借助在第 11 章中开发的 `EventHandler` 事件处理脚本来实现。每当选择框中的选择变化时（例如用户使用下拉菜单选择选项时），`change`\
  \ 事件就会触发一个函数。页面通过示例 14-1 中的代码将 `change` 事件附加到 `<select>` 框，该代码添加在网页的 `<body>` 部分。\n\
  \n### 注意\n\n不要忘记在 `<head>` 元素中添加指向 `EHandler` 脚本的链接。更多信息请参阅第 11 章。\n\n示例 14-1. 使用第\
  \ 11 章的 `EventHandler` 脚本为 `<select>` 元素附加 `change` 事件。\n\n```javascript<script\
  \ type=\"text/javascript\">\nvar selEl = document.getElementById(\"starselect\"\
  );\nEHandler.add(selEl,\"change\", function() { displayValue();  } );\n</script>\n\
  ```\n\n此代码使用 `EventHandler.add()` 方法为 `<select>` 元素的 `change` 事件添加一个函数，代码通过 `<select>`\
  \ 元素的 ID `starselect` 获取该元素。在这种情况下，添加到 `change` 事件中的函数是一个名为 `displayValue()` 的用户定义函数，如示例\
  \ 14-2 所示。\n\n\n\n\n\n示例 14-2。当表单的 `change` 事件触发时调用的函数。\n\n```javascript\nfunction\
  \ displayValue(){\n    var selected = document.forms[\"starform\"].startype.value;\n\
  \    alert(\"You selected \" + selected);\n}\n```\n\n这段 JavaScript 代码简单地显示从下拉菜单中选择的值。例如，从下拉菜单中选择“小熊座”（Ursa\
  \ Minor）会显示图 14-5 对话框。\") 中的 `alert()` 对话框。\n\n![通过表单选择星座并发送 alert() 对话框](img/httpatomoreillycomsourcemspimages748871.png.jpg)\n\
  \n图 14-5。通过表单选择星座并发送 `alert()` 对话框。\n\n### 注意\n\n此示例的完成代码位于 `sel.htm` 文件，该文件包含在第\
  \ 14 章配套代码中。\n\n选择框的 HTML 包含一个名为 `selected` 的属性，该属性指示显示哪个选项。该示例选择了一个空选项，使得选择框的初始值为空：\n\
  \n```html\n<option selected=\"selected\"> </option>\n```\n\n也可以使用 JavaScript 和 DOM\
  \ 选择选项。在具有多个输入框的表单中，通过程序化选择选项是常见的，其中一个选择会导致其他选项自动选中。\n\n在接下来的练习中，你将构建一个披萨公司可能用于订餐的\
  \ Web 表单。该公司只制作几种特殊披萨：一种蔬菜的；一种多种肉类的；以及一种带火腿和菠萝的夏威夷风格。公司希望有一个带有三个按钮的网页，帮助他们的披萨制作师跟踪订单的披萨类型。这些按钮将预选披萨上的主要配料。\n\
  \n### 使用 JavaScript 选择选项\n\n1. 使用 Microsoft Visual Studio、Eclipse 或编辑器，编辑 Chapter14\
  \ 示例文件夹（位于配套内容）中的 `pizza.htm` 文件。\n2. 在页面中，添加此处所示的粗体代码（这位于配套内容中的 `pizza.txt` 中）：\n\
  \n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html\n<head>\n    <title>Pizza</title>\n    <script type=\"text/javascript\"\
  \ src=\"ehandler.js\"></script>\n    <script type=\"text/javascript\">\n       \
  \ function flip(pizzatype) {\n            if (pizzatype.value == \"Veggie Special\"\
  ) {\n                document.forms[\"pizzaform\"].topping.value = \"veggies\";\n\
  \            } else if (pizzatype.value == \"Meat Special\") {\n               \
  \ document.forms[\"pizzaform\"].topping.value = \"meat\";\n            } else if\
  \ (pizzatype.value == \"Hawaiian\") {\n                document.forms[\"pizzaform\"\
  ].topping.value = \"hampineapple\";\n            }\n        }\n    </script>\n</head>\n\
  <<body>\n<form id=\"pizzaform\" action=\"#\">\n<p>\n<input id=\"vegbutton\" type=\"\
  button\" name=\"veggiespecial\" value=\"Veggie Special\">\n<input id=\"meatbutton\"\
  \ type=\"button\" name=\"meatspecial\" value=\"Meat Special\">\n<input id=\"hawbutton\"\
  \ type=\"button\" name=\"hawaiian\" value=\"Hawaiian\">\n</p>\nMain Topping: <select\
  \ name=\"topping\">\n<option value=\"cheese\" selected=\"selected\">Cheese</option>\n\
  <option value=\"veggies\">Veggies</option>\n<option value=\"meat\">Meat</option>\n\
  <option value=\"hampineapple\">Ham & Pineapples</option>\n</select>\n</form>\n<script\
  \ type=\"text/javascript\">\nvar vegEl = document.getElementById(\"vegbutton\");\n\
  var meatEl = document.getElementById(\"meatbutton\");\nvar hawEl = document.getElementById(\"\
  hawbutton\");\nEHandler.add(vegEl,\"click\",function() { flip(vegEl); });\nEHandler.add(meatEl,\"\
  click\",function() { flip(meatEl); });\nEHandler.add(hawEl,\"click\",function()\
  \ { flip(hawEl); });\n</script>\n</body>\n</html>\n```\n\n3. 在浏览器浏览器查看页面。你将看到一个像这样的页面：\n\
  ![使用 JavaScript 选择选项](img/httpatomoreillycomsourcemspimages748873.png.jpg)\n4. 选择其中一个按钮。（注意，“主配料”选择框会随之变化。）\n\
  \n该示例的核心是 `flip()` 函数：\n\n```javascript\nfunction flip(pizzatype) {\n    if (pizzatype.value\
  \ == \"Veggie Special\") {\n        document.forms[\"pizzaform\"].topping.value\
  \ = \"veggies\";\n    } else if (pizzatype.value == \"Meat Special\") {\n      \
  \  document.forms[\"pizzaform\"].topping.value = \"meat\";\n    } else if (pizzatype.value\
  \ == \"Hawaiian\") {\n        document.forms[\"pizzaform\"].topping.value = \"hampineapple\"\
  ;\n    }\n}\n```\n\n该函数检查传递给函数的 `pizzatype` 变量的值，然后使用条件判断相应更改名为 `topping` 的选择框的值。\n\
  \n再次，页面 `<head>` 部分的脚本链接到 EHandler 事件处理器脚本，并使用其 `EHandler.add` 方法将 `click` 事件绑定到按钮上，这与你在本章及之前的三个章节中看到的代码方式相同。\n\
  \n```javascript\nvar vegEl = document.getElementById(\"vegbutton\");\nvar meatEl\
  \ = document.getElementById(\"meatbutton\");\nvar hawEl = document.getElementById(\"\
  hawbutton\");\nEHandler.add(vegEl,\"click\",function() { flip(vegEl); });\nEHandler.add(meatEl,\"\
  click\",function() { flip(meatEl); });\nEHandler.add(hawEl,\"click\",function()\
  \ { flip(hawEl); });\n```\n\n此示例展示了如何从表单获取信息以及如何在表单内设置信息。虽然表单看起来很简单，而且披萨公司目前还没有制作很多披萨，但因为其披萨受欢迎，它正在增长。本章未来的示例将扩展此表单。\n\
  \n## 使用复选框\n\n上一个示例展示了选择框，你在本章早些时候也看到了文本框。另一种类型的框——复选框——允许用户选择多个项目。上一节介绍的披萨订购场景是说明复选框的良好示例。\n\
  \n回想在最初的披萨订购系统中，当订单员选择三种披萨类型之一时，“主配料”选择框会发生变化以反映披萨的主要成分。然而，允许更大的灵活性（例如更多的披萨类型）会更好。\n\
  \n图 14-6 显示了一个新的披萨准备表单。订单员现在可以从各种配料中进行任意组合。\n\n![修改订单准备表单以包含复选框](img/httpatomoreillycomsourcemspimages748875.png.jpg)\n\
  \n图 14-6。修改订单准备表单以包含复选框。\n\n选择各种配料并点击“准备披萨”按钮将在屏幕上显示选中的披萨配料，如图 14-7\n\n![通过新表单订购披萨并通过\
  \ DOM 添加元素](img/httpatomoreillycomsourcemspimages748877.png.jpg)\n\n图 14-7。通过新表单订购披萨并通过\
  \ DOM 添加元素。\n\n此功能的代码显示[示例 14-3](#ch14s03.html_using_check_boxes_with_the_order_form\
  \ \"示例 14-3. 在订单表单中使用复选框。”（配套内容中的 `listing14-3.htm`）。\n\n\n\n\n\n```\n<!DOCTYPE\
  \ HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html\n<head>\n    <title>Pizza</title>\n    <script type=\"text/javascript\"\
  \ src=\"ehandler.js\"></script>\n    <script type=\"text/javascript\">\n    function\
  \ prepza() {\n        var checkboxes = document.forms[\"pizzaform\"].toppingcheck.length;\n\
  \        var newelement = document.createElement(\"p\");\n        newelement.setAttribute(\"\
  id\",\"orderheading\");\n        document.body.appendChild(newelement);\n      \
  \  newelement.appendChild(document.createTextNode(\"This pizza will have:\"));\n\
  \n        for (var i = 0; i < checkboxes; i++) {\n            if (document.forms[\"\
  pizzaform\"].toppingcheck[i].checked) {\n                  var newelement = document.createElement(\"\
  p\");\n                  newelement.setAttribute(\"id\",\"newelement\" + i);\n \
  \                 document.body.appendChild(newelement);\n                  newelement.appendChild(document.createTextNode(\n\
  \                          document.forms[\"pizzaform\"].toppingcheck[i].value));\n\
  \            }\n        }\n    }\n    </script>\n</head>\n<body>\n<form id=\"pizzaform\"\
  \ action=\"#\">\n<p>Toppings:</p>\n<input type=\"checkbox\" id=\"topping1\" value=\"\
  Sausage\"\n    name=\"toppingcheck\">Sausage<br>\n<input type=\"checkbox\" id=\"\
  topping2\" value=\"Pepperoni\"\n    name=\"toppingcheck\">Pepperoni<br>\n<input\
  \ type=\"checkbox\" id=\"topping3\" value=\"Ham\"\n    name=\"toppingcheck\">Ham<br>\n\
  <input type=\"checkbox\" id=\"topping4\" value=\"Green Peppers\"\n    name=\"toppingcheck\"\
  >Green Peppers<br>\n<input type=\"checkbox\" id=\"topping5\" value=\"Mushrooms\"\
  \n    name=\"toppingcheck\">Mushrooms<br>\n<input type=\"checkbox\" id=\"topping6\"\
  \ value=\"Onions\"\n    name=\"toppingcheck\">Onions<br>\n<input type=\"checkbox\"\
  \ id=\"topping7\" value=\"Pineapple\"\n    name=\"toppingcheck\">Pineapple<br>\n\
  \n<p><input type=\"button\" id=\"prepBtn\" name=\"prepBtn\" value=\"Prep Pizza\"\
  ></p>\n</form>\n<script type=\"text/javascript\">\nvar prepBtn = document.getElementById(\"\
  prepBtn\");\nEHandler.add(prepBtn,\"click\",function() { prepza(); });\n</script>\n\
  </body>\n</html>\n```\n\n该页面的核心是 `prepza()` 函数，它首先收集表单 `pizzaform` 中包含的复选框数量。这些框通过\
  \ `name` 属性 `toppingcheck` 分组，如下：\n\n```javascript\nvar checkboxes = document.forms[\"\
  pizzaform\"].toppingcheck.length;\n```\n\n在设置带有标题的 `<p>` 元素后，脚本使用 `for` 循环遍历复选框。每个复选框都会被检查其\
  \ `checked` 属性是否已设置：\n\n```javascript\nif (document.forms[\"pizzaform\"].toppingcheck[i].checked)\
  \ {\n```\n\n如果复选框的 `checked` 属性确实已设置，脚本将创建一个新的 `<p>` 元素并将其放入文档。结果就是你之前在图 14-7 中看到的页面。（你已经见过在第\
  \ 10 章 中创建和添加元素的示例）。\n\n请记住这个示例，因为章节末尾的练习之一要求你将其与功能相结合，即当用户按下按钮时自动选择配料，就像你之前看到的选择框示例那样。\n\
  \n“制作披萨”按钮使用来自第 11 章的 `EHandler.add()` 方法附加了点击事件。\n\n## 使用单选按钮操作\n\n单选按钮也会创建一组选项，但与复选框不同，组内任何时间只能选择一个单选按钮。在披萨店示例中，访问者可以使用单选按钮来选择披萨的饼底类型——薄底、深盘或普通。由于披萨只能有一种饼底，因此使用单选按钮进行此类选择是合理的。添加单选按钮来选择饼底类型后，页面将类似于图\
  \ 14-8 所示。\n\n![用于选择饼底类型的单选按钮。](img/httpatomoreillycomsourcemspimages748879.png.jpg)\n\
  \n图 14-8. 用于选择饼底类型的单选按钮。\n\n添加这些单选按钮以及用于存放简单表格的 HTML 代码如下（同样位于配套内容的文件 `radiobuttonhtml.txt`\
  \ 中）：\n\n```html\n<table>\n<tr><td>Toppings</td><td>Crust</td></tr>\n<tr>\n  <td><input\
  \ type=\"checkbox\" id=\"topping1\" value=\"Sausage\"\n    name=\"toppingcheck\"\
  >Sausage</td>\n  <td><input type=\"radio\" name=\"crust\" value=\"Regular\"\n  \
  \  checked=\"checked\" id=\"radio1\">Regular</td>\n</tr>\n<tr>\n  <td><input type=\"\
  checkbox\" id=\"topping2\" value=\"Pepperoni\"\n    name=\"toppingcheck\">Pepperoni</td>\n\
  \  <td><input type=\"radio\" name=\"crust\" value=\"Deep Dish\"\n    checked=\"\
  checked\" id=\"radio2\">Deep Dish</td>\n</tr>\n<tr>\n  <td><input type=\"checkbox\"\
  \ id=\"topping3\" value=\"Ham\"\n    name=\"toppingcheck\">Ham</td>\n  <td><input\
  \ type=\"radio\" name=\"crust\" value=\"Thin\"\n    checked=\"checked\" id=\"radio3\"\
  >Thin</td>\n</tr>\n<tr>\n  <td><input type=\"checkbox\" id=\"topping4\" value=\"\
  Green Peppers\"\n    name=\"toppingcheck\">Green Peppers</td>\n  <td></td>\n</tr>\n\
  <tr>\n  <td><input type=\"checkbox\" id=\"topping5\" value=\"Mushrooms\"\n    name=\"\
  toppingcheck\">Mushrooms</td>\n  <td></td>\n</tr>\n<tr>\n  <td><input type=\"checkbox\"\
  \ id=\"topping6\" value=\"Onions\"\n    name=\"toppingcheck\">Onions</td>\n  <td></td>\n\
  </tr>\n<tr>\n  <td><input type=\"checkbox\" id=\"topping7\" value=\"Pineapple\"\n\
  \    name=\"toppingcheck\">Pineapple</td>\n  <td></td>\n</tr>\n</table>\n```\n\n\
  处理单选按钮的代码与你看到的处理复选框的代码相似。主要区别在于所有单选按钮共享相同的名称和逻辑分组，这意味着它们被分在一起且只能选中一个。处理单选按钮的代码被添加到\
  \ `prepza()` 函数中，如下（在 `radiobuttonjs.txt` 中）：\n\n```javascript\nvar crusttype =\
  \ document.forms[\"pizzaform\"].crust;\nvar crustlength = crusttype.length;\nfor\
  \ (var c = 0; c < crustlength; c++) {\n    if (crusttype[c].checked) {\n       \
  \   var newelement = document.createElement(\"p\");\n          newelement.setAttribute(\"\
  id\",\"crustelement\" + i);\n          document.body.appendChild(newelement);\n\
  \          newelement.appendChild(document.createTextNode(crusttype[c].value + \"\
  \ Crust\"));\n    }\n}\n```\n\n## 预验证表单数据\n\nJavaScript 常用于验证给定的表单字段是否填写正确。你在本章早些时候看到过这种行为的示例，当时表单要求你填写姓名。如果你没有在字段中输入任何内容，就会出现错误提示。JavaScript\
  \ 擅长预验证数据，以确保其符合有效输入。然而，JavaScript 在实际上验证到达服务器的数据方面却很糟糕。\n\n你永远不应该在任何时候假设到达服务器的数据是有效的。我无法数清有多少\
  \ Web 开发者说过：“我们对数据有 JavaScript 验证，所以不需要在服务器上进行检查。”人们可以并且确实已经在浏览器中禁用了 JavaScript；人们也可以将\
  \ POST 格式和 GET 格式的数据发送到服务器端程序，而无需遵循浏览器界面指示的导航。底线是，你可以也应该使用 JavaScript 进行预验证。预验证是一种简单的合理性检查，当你的代码发现输入有明显错误时，为用户提供快速反馈非常有帮助。但你*必须*在用户完全提交输入后，在服务器端对所有输入进行实际验证。\n\
  \n\n\n\n本节将介绍一些使用 JavaScript 进行预验证的方法，但为了设定讨论的背景，我将首先阐述仅使用 JavaScript 作为网站唯一验证器的危险性。\n\
  \n## 破解 JavaScript 验证\n\n本节使用服务器端程序创建一个目录订单系统，该系统包含三个简单元素：产品、数量和价格。售卖物品是我草坪上的草叶。我住的地区经历了一个极其干旱的夏天，所以现在没有多少草坪了——有很多杂草和沙子，但没有我所说的真正的草坪。因为我草坪上的草叶非常稀缺，每个家庭限限购三根，而且价格很高。我通过一些\
  \ JavaScript 代码来限制订购数量。\n\n我创建了一个销售草叶的页面。在浏览器中查看时，该页面如图 14-9”所示。\n\n![小型目录订单表。](img/httpatomoreillycomsourcemspimages748881.png.jpg)\n\
  \n图 14-9。小型目录订单表。\n\n以下是生成该页面的 HTML 和 JavaScript（也存在于内容中的 `validate.htm` 示例文件中）。注意使用\
  \ `document.forms`（以粗体显示）来访问表单内填写的数量。同样注意，你将无法提交表单，因为表单动作 `catalog.php` 实际上并不。表单的\
  \ action 对此示例并不重要。\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\
  \"http://www.w3.org/TR/html4/strict.dtd\">\n<html\n<head>\n<title>Catalog Example</title>\n\
  <script type=\"text/javascript\" src=\"ehandler.js\"></script>\n<script type=\"\
  text/javascript\">\n    function formValid(eventObj) {\n        if (document.forms[\"\
  catalogform\"][\"quantity\"].value > 3) {\n           alert(\"Limit 3 per Household.\"\
