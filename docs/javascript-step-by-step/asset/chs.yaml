  \ <body> 中，使用 prompt 从访问者处获取恒星名称，然后使用该输入调用函数。不要忘记包含未找到恒星时执行的代码。在屏幕上显示结果。 |\n\n#\
  \ Chapter 8. Objects in JavaScript\n\n**阅读本章后，你将能够：**\n\n* 理解 JavaScript 中的对象，包括对象属性、对象方法和类。\n\
  * 创建对象。\n* 为对象定义属性和方法。\n* 理解 JavaScript 中的数组。\n* 使用几种数组方法。\n\n## Object-Oriented\
  \ Development\n\n对于面向对象编程概念的新手或可能需要复习的人来说，请继续向下阅读。如果你已经熟悉面向对象编程，请跳到名为 Creating Objects\
  \ 的部分。\n\n编程范式描述了一种解决你遇到的问题的方法。存在超过 25 种不同的编程范式，其中某些在实际程序中可能很难找到使用。你可能听过其他的范式，甚至在不知的情况下用过它们。这些范式包括函数式编程、事件驱动编程、面向组件编程和结构化编程。\n\
  \n编程范式随时更替。然而，面向对象编程已经存在多年，而且在短期内似乎不会消失。这一部分只能给你提供该主题的概述，但你需要熟悉面向对象的技术和术语，以便你能够胜\
  \ JavaScript 程序员通常使用的子集。\n\n## Objects\n\n对象是实体。在现实世界中——与计算机编程的虚拟且有时超现实的世界相比——球、桌子和汽车都是对象。对象是具有可描述特征、你可以影响并且并以特定方式运行的事物。面向对象编程范式中的对象是代码和数据的组合，以类似的方式表现出特征和行为。\n\
  \n## Properties\n\n对象拥有属性——定义为它们的特征。再次回到现实世界，球有一个颜色属性——可能是红色、白色或多颜色的。它还有一个尺寸属性——可能像棒球一样小，或者像篮球一样大，或者像其他东西。这些属性可以如下所示：\n\
  \n```\nball.color\nball.size\n```\n\n## Methods\n\n就像对象可以拥有属性一样，它们也可以拥有方法。方法定义了对象的行为。球可能有一个\
  \ `roll` 方法，计算球将滚多远。在理论上，并不是所有对象都有方法，也不是所有对象都有属性，但在实践中，大多数对象至少有一个方法或一个属性。\n\n记住\
  \ Chapter 7，方法只是属于对象的函数。一个使用函数字面量定义 `roll` 方法的方法定义可能如下所示：\n\n```\nball.roll = function()\
  \ {\n    var distance = this.size * this.forceApplied;\n}\n```\n\n### What’s $this$?\n\
  \n`ball.roll` 示例使用了新东西——关键字 `this`，它指向当前函数或属性所所属的对象。在对象的上下文中，关键字 `this` 指向调用对象。关键字\
  \ `this` 可以在函数调用中设置对象的属性。\n\n`this` 关键字对于想要验证 Web 表单的 JavaScript 开发者来说是一个福音，你将在第\
  \ 14 章](#ch14.html \"Using JavaScript with Web Forms\") 中学习它。\n\n\n\n\n\n在面向对象编程中，`classes`（类）定义了具有相同属性和方法的对象集合。类简化了同类型多个对象的创建。然而，`ECMA-262`\
  \ 在其对象接口中并没有类的概念。因此，为了利用类编程的优点，你必须使用一种模式来创建伪类。考虑一下我在前面的章节中使用的恒星示例。示例 8-1（位于配套资源中的\
  \ `Listing8-1.txt` 文件中）展示了创建一个包含 14 颗重要恒星信息的完整网页所需的内容。\n\n### 示例 8-1. 组装一个 `star`\
  \ 对象。\n\n```javascript\nvar star = {};\n\nstar[\"Polaris\"] = new Object;\nstar[\"\
  Mizar\"] = new Object;\nstar[\"Aldebaran\"] = new Object;\nstar[\"Rigel\"] = new\
  \ Object;\nstar[\"Castor\"] = new Object;\nstar[\"Albireo\"] = new Object;\nstar[\"\
