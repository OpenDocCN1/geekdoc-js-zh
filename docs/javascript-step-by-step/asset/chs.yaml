  \        row.appendChild(td);\n    }\n    tbody.appendChild(row);\n}\n```\n\n这段代码使用取模运算符（`%`）为表格数据中的每隔行涂上浅灰色背景。此表格中只有两个数据行，因此只有第二行获得了灰色阴影。图\
  \ 20-3 显示了添加颜色后的结果。你可以在本书第 20 章示例代码的 `CompletedCode` 目录下找到此页面的完成版本。\n\n![使用 CSS\
  \ 为表格添加颜色。](img/httpatomoreillycomsourcemspimages748945.png.jpg)\n\n图 20-3. 使用 CSS\
  \ 为表格添加颜色。\n\n# 创建动态下拉框\n\n你可以使用 第 19 章 中所示书签应用的变体，为任何类型的文本列表数据创建一个动态下拉框。这种有时被称为\
  \ `suggest-as-you-type`（边输入边提示）下拉框，因为随着用户的输入，用户界面会在文本框下方的下拉框中显示常用的输入值，使用户更容易完成输入。Google\
  \ Suggest 就是此类应用之一。\n\n该原理的另一种实现方式是在访客输入时时显示常见项目（如美国州）的下拉框。这种变体的关键在于，可以检索以快速填充动态下拉框的数据子集是可控的。例如，当访客在文本框中输入查询时，可以从\
  \ 50 个美国州的列表中检索出一个子集。相比之下，如果你正在处理 1,000,000 条数据库记录，可能无法在让终端用户认为响应迅速的时间内检索出子集。作为另一个例子，你可能在业务中使用此类应用程序来检索公司目录的员工列表。\n\
  \n这里是该应用的演示。使用 `xmlHttpRequest` 对象，应用程序检索了 50 个州的列表。当用户输入字母 `w` 时，应用程序检索所有以该字母开头的州，如图图\
  \ 20-4 所示。\n\n![获取以字母 w 开头的州列表。](img/httpatomoreillycomsourcemspimages748947.png.jpg)\n\
  \n图 20-4. 获取以字母 `w` 开头的州列表。\n\n将鼠标悬停在不同的州上会改变这些州的背景颜色，如图图 20-5 所示，我将鼠标悬停在了威斯康星州上（此截图中不可见鼠标指针）。\n\
  \n![将鼠标悬停在州上会改变它们的背景颜色。](img/httpatomoreillycomsourcemspimages748949.png.jpg)\n\n\
  图 20-5. 将鼠标悬停在州上会改变它们的背景颜色。\n\n最后，点击一个州名会将该名称复制到文本框中。此操作的结果如图图 20-6 所示。从这里，可能会提交表单，根据输入执行应用程序适当的操作。\n\
  \n![将州移动到文本框中。](img/httpatomoreillycomsourcemspimages748951.png.jpg)\n\n图 20-6.\
  \ 将州移动到文本框中。\n\n这段代码的工作原理与 第 19 章 中的书签应用程序代码相同，访客可以继续输入以缩小或将搜索聚焦到特定的选择。考虑访客输入字母\
  \ `n` 的情况。这将显示八个以字母 `n` 开头的州。输入更多内容——例如输入单词 `new`——将该搜索缩小到四个州，而输入更多字母将进一步缩小结果范围。\n\
  \n该应用程序的代码如示例 20-1 所示。\n\n示例 20-1. 搜索应用程序。\n\n\n\n\n```html\n<!DOCTYPE HTML PUBLIC\
