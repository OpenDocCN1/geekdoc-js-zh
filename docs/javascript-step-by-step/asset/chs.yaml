  http\");\n            if (! xmlEl[i].childNodes[j].firstChild.nodeValue.match(url))\
  \ {\n                var pattern = \"^\" + text;\n                var title = xmlEl[i].childNodes[j].firstChild.nodeValue;\n\
  \                var nameRegexp = new RegExp(pattern, \"i\");\n                var\
  \ existDiv = document.getElementById(title);\n                if (! existDiv) {\n\
  \                    if (title.match(nameRegexp)) {\n                        var\
  \ anchor = document.createElement(\"a\");\n                        var xmlData =\n\
  \                        document.createTextNode(xmlEl[i].childNodes[j].firstChild.nodeValue);\n\
  \                        var urls = AJAXresponse.getElementsByTagName(\"url\");\n\
  \                        anchor.setAttribute(\"href\", urls[i].firstChild.nodeValue);\n\
  \                        anchor.appendChild(xmlData);\n                        div.appendChild(anchor);\n\
  \                    }\n                }\n            }\n        }\n        document.getElementById(\"\
  data\").appendChild(div);\n    }\n}\n```\n\n# 练习题\n\n| 1. | 本章涵盖的哪些 HTTP 请求方法最安全？为什么？\
  \ |\n| 2. | 描述使用 HTML、XML 和 JSON 进行 `XMLHttpRequest` 请求/响应之间的差异。 |\n| 3. | 编写一个服务器端程序，返回该程序接收到的参数的两个数字之和。使用异步\
  \ `XMLHttpRequest` 对象调用该程序。 |\n\n# 第 20 节 深入学习 AJAX\n\n**读完本章后，你将能够：**\n\n- 理解异步\
  \ JavaScript 和 XML (AJAX) 与层叠样式表 (CSS) 如何结合使用。\n- 进一步了解文档对象模型 (DOM)、AJAX 和 CSS 之间的关系。\n\
  - 使用 AJAX 和 CSS 创建并样式带有扩展标记语言 (XML) 数据的文本标记语言 (HTML) 表格。\n- 使用 CSS 创建基于 AJAX 的下拉文本框。\n\
  \n在上一章中，你学习了如何使用 `XMLHttpRequest` 对象来发送、接收和处理请求，并学会了如何创建一个 AJAX 。在本章中，你将看到如何使用 CSS\
  \ 显示通过 AJAX 获取的数据。\n\nJavaScript 与 CSS 之间的关系在第 15 章 中介绍过。在这一章中，你学习了可以使用 JavaScript\
  \ 编写更改文档样式。在第 17 章 中，你学习了如何将 XML 数据显示为 HTML 表格。在第 19 章 中，你看到了如何使用一些 CSS 和大量的 DOM\
  \ 创建一个实时的、可搜索的书签网页。本章展示了你如何使用 CSS 为第 17 章 中的表格设置样式，并在 CSS 和 JavaScript 的帮助下，对第 19\
  \ 章 中的书签应用程序进行扩展和改进。\n\n在此过程中，我希望传达 AJAX 实际上非常容易使用。使用 `XMLHttpRequest` 获取和解析信息只是简单部分——关键在于你如何处理这些数据。这就是为什么\
  \ CSS 和 DOM 关重要的原因！AJAX 是将你在书中中学的所有 JavaScript 整合在一起以创建更大应用程序的地方。\n\n## 使用 XML 和\
  \ CSS 创建 HTML 表格\n\n第 17 章 提供了一个示例，获取了 XML 并将其数据作为 HTML 表格的一部分，如图 20-1 所示。创建该表格的代码在第\
  \ 17 章 中开发，并经过扩展，不仅显示了数据，还显示了列标题。第 17 章 结尾代码的结果如下：\n\n![在 HTML 表格中显示 XML 数据。(httpatomoreillycomsourcemspimages748939.png.jpg)\n\
  \n图 20-1. 在 HTML 表格中显示 XML 数据。\n\n第 17 章 中的代码使用 XML 方法直接获取数据。下一个练习将代码转换为使用 `XMLHttpRequest`\
  \ 获取 XML。与第 19 章 中的练习一样，以下练习要求 XML 文件存储在 Web 服务器上。\n\n## 使用 XMLHttpRequest 获取并显示\
