  \ AJAX 动态创建选项的手风琴。 |\n\n# 附录 A. 练习答案\n\n附录显示了书中练习题的答案和解释。在许多情况下，解决问题有多种方法。因此，除非题目指定了特定的解决方法，否则任何有效的实现都是可以接受的。同样，你的函数名称与附录中的不同也是预期的。\n\
