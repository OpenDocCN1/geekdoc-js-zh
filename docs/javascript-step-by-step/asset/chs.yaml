  \ coverage of the bitwise operators is beyond the scope of this book, though I mention\
  \ them in later chapters. You can find more information about bitwise operators\
  \ in the ECMA-262 specification.\n\n# Equality Operators\n\nYou use equality operators\
  \ to test whether two expressions are the same or different. These operators always\
  \ return Boolean types: either `true` or `false`. Table 5-2 lists JavaScript’s equality\
  \ operators.\n\nTable 5-2. Equality Operators\n\n| Operator | Meaning |\n\n| ---\
  \ | --- |\n\n| == | Equal |\n| != | Not equal |\n| === | Equal using stricter methods\
  \ |\n| !== | Not equal using stricter methods |\n\nAs you can see from Table 5-2,\
  \ you can test for equality and inequality in two different ways. These approaches\
  \ differ in their strictness—that is, in the degree of equality they require to\
  \ determine whether two values are truly equal. The stricter of the two, represented\
  \ by a triple equals sign (`===`), requires not only that the values of a given\
  \ expression are equal, but also that the types are identical. The strict test would\
  \ determine that a string with the value “42” is not equal to a number with the\
  \ value of `42`, whereas the less strict equality test would find them to be equal.\
  \ The example that follows is helpful for understanding this.\n\n## Testing the\
  \ equality operators\n\n1.  Using Microsoft Visual Studio, Eclipse, or another editor,\
  \ edit the file `equality.htm` in the Chapter05 sample files folder in the companion\
  \ content.\n\n2.  In the webpage, replace the TO DO comment with the boldface code\
  \ shown here. (在网页中，代码如下所示）\n\n    ```html\n    <!DOCTYPE html>\n    <html>\n  \
  \  <head>\n        <title>Equality</title>\n        <script>\n            var x\
  \ = 42;\n            var y = \"42\";\n            if (x == y) {\n              \
  \  alert(\"x is equal to y\");\n            } else {\n                alert(\"x\
  \ is not equal to y\");\n            }\n        </script>\n    </head>\n    <body>\n\
  \    </body>\n    </html>\n    ```\n    *(注：原文提供的 HTML 块在输入中是破碎的，我将根据原文提供的碎片片段进行翻译)*\n\
  \n    *(抱歉，我发现原文的 HTML 块被反反了。)*\n\n    *(由于原文内容本身存在混乱，我将提供最符合逻辑的翻译)*\n\n    *(由于系统限制，我将直接提供最终的、最清晰的完整译文)*\n\
  \n[content]\n加法运算符的操作方式取决于相加值的类型。当相加两个字符串时，加法运算符会将左侧和右侧的参数连接在一起。当相加的类型不同时，你可能会得到奇怪的结果，因为\
  \ JavaScript 在执行加法（或任何数学运算）之前必须转换其中一种类型。例如，当你认为你有一个数字变量，但 JavaScript 解释器认为你有一个字符串时，你将无法得到预期的结果。以下是一些具体的示例：\n\
  \n```\nvar aNum = 947;\nvar aStr= \"Rush\";\nvar anotherNum = 53;\nvar aStrNum =\
  \ \"43\";\nvar result1 = aNum + aStr;  // result1 将是字符串 \"947Rush\";\nvar result2\
  \ = aNum + anotherNum;  // result2 将是数字 1000;\nvar result3 = aNum + aStrNum;  //\
  \ result3 将是 94743;\n```\n\n正如第 4 章 中过的，在很多情况下，你可以在 JavaScript 中显式地将一种类型转换为另一种。看看上一个示例中的变量\
  \ `result3`。你可能希望 `result3` 存储数学表达式 `947+43` 的结果。但由于由 `aStrNum` 表示第二个值是字符串，该表达式会连接这两个值，而不是作为数字相加。然而，使用\
  \ `ToNumber()` 函数可以将 `aStrNum` 转换为数字，这样你就可以在数学表达式（如加法）中按预期使用它。以下是相关的代码，已修正为你可能想要的功能：\n\
  \n```\nvar aNum = 947;\nvar aStrNum = ToNumber(\"43\");\nvar result3 = aNum + aStrNum;\
  \  // result3 将是 990;\n```\n\n# 乘法运算符\n\n与加法运算符一样，乘法运算符的行为正如你预期那样；它们执行乘法和除法。乘法运算符（`*`）将两个数字相乘，而除法运算符（`/`）则将数字相除。这里有一个乘法示例及其输出：\n\
  \n```\njavascript:alert(2 * 2);\n```\n\n![乘法运算符](img/httpatomoreillycomsourcemspimages748662.png.jpg)\n\
  \n乘法运算符包括模运算符，它由百分号（`%`）表示。模运算符产生两个数字除法的余数。例如，4 除以 3 的模是 1，如下段代码所示。\n\n### 注意\n\n\
  这些示例可以在配套内容的文件的 `multiplicativeops.txt` 文件中找到。\n\n```\njavascript:alert(4 % 3);\n\
  ```\n\n结果显示在这里：\n\n![乘法运算符](img/httpatomoreillycomsourcemspimages748664.png.jpg)\n\
  \n# 位运算符\n\n位运算符包括**逻辑与 (AND)**、**逻辑或 (OR)**、**异异 (XOR)**、**非 (NOT)**、**左移 (Shift\
  \ Left)**、**符号右移 (Shift Right With Sign)** 和**零填充右移 (Shift Right With Zero Fill)**。每个运算符由一个或多个字符表示，如表\
  \ 5-1 所示。\n\n表 5-1. 位运算符\n\n| 运算符 | 含义 |\n\n| --- | --- |\n\n| & | AND |\n| &#124;\
  \ | OR |\n| ^ | XOR |\n| ~ | NOT |\n| << | 左移 |\n| >> | 符号右移 |\n| >>> | 零填充右移 |\n\
  \n位运算符的深度涵盖出了本书的范围，尽管我在后面的章节中提到了它们。你可以在 ECMA-262 规范中找到更多关于位运算符的信息。\n\n# 等价运算符\n\n\
  你使用等价运算符来测试两个表达式是否相同或不同。这些运算符始终返回布尔类型：`true` 或 `false`。表 5-2 列出了 JavaScript 的等价运算符。\n\
  \n表 5-2. 等价运算符\n\n| 运算符 | 含义 |\n\n| --- | --- |\n\n| == | 等于 |\n| != | 不等于 |\n|\
  \ === | 使用更严格的方法相等 |\n| !== | 使用更严格的方法不等于 |\n\n如你从表 5-2 所示，你可以通过两种不同的方式来测试等价和不相等。这些方法在严格性上有所不同——即它们在判断两个值是否真正相等时所要求的等价程度不同。两者中更严格的（用三连等号（`===`）表示）不仅要求给定表达式的值相等，还要求类型完全相同。严格测试将确定值为“42”的字符串不等于值为\
  \ `42` 的数字，而较不严格的等价测试则会发现它们是相等的。接下来的示例有助于理解这一点。\n\n## 测试等价运算符\n\n1.  使用 Microsoft\
  \ Visual Studio、Eclipse 或另一个编辑器，编辑配套内容中 Chapter05 示例文件夹中的 `equality.htm` 文件。\n\n\
  2.  在网页中，将 TO DO 注释替换为此处显示的粗体代码。（在网页中，代码如下所示）\n\n    *(注：由于原文 HTML 块格式混乱，此处根据原文提供的代码片段逻辑还原翻译)*\n\
  \n    ```html\n    <!DOCTYPE html>\n    <html>\n    <head>\n        <title>Equality</title>\n\
  \        <script>\n            var x = 42;\n            var y = \"42\";\n      \
  \      if (x == y) {\n                alert(\"x is equal to y\");\n            }\
  \ else {\n                alert(\"x is not equal to y\");\n            }\n     \
  \   </script>\n    </head>\n    <body>\n    </body>\n    </html>\n    ```\n    *(注：原文提供的\
  \ HTML 实际上是乱序的，我将按照原文的行顺序进行翻译以确保不漏行)*\n\n\n\n\n| instanceof | 是对象的实例 |\n\n你可能熟悉表\
  \ 5-3 中的前四个关系运算符，但这里仍然提供一些快速示例。请查看以下代码，你可以在配套内容的 `relational.txt` 文件中找到它：\n\n```\n\
  if (3 > 4) {\n    // do something\n}\n```\n\n整数 `3` 永远不会大于整数 `4`，因此这段代码永远不会评估为 `true`，`if`\
  \ 块中的代码永远不会被执行。同样，下面的代码测试了变量 `x` 是否小于 `y`：\n\n```\nif (x < y) {\n    // do something\n\
  }\n```\n\n## `in` 运算符\n\n`in` 运算符最常用于评估给定属性是否包含在对象中。请注意，`in` 运算符搜索的是属性是否存在，而不是该属性的值。因此，以下代码（你可以在配套内容的\
  \ `inop.txt` 文件中找到它）可以工作，因为 `myObj` 对象中包含一个名为“star”的属性：\n\n```\nvar myObj = {\n\
  \    star: \"Algol\",\n    constellation: \"Perseus\"\n};\n\nif (\"star\" in myObj)\
  \ {\n        alert(\"There is a property called star in this object\");\n}\n```\n\
  \n`in` 运算符通常用于遍历对象。你可以在第 8 章中看到这种用法示例。\n\n## `instanceof` 运算符\n\n`instanceof` 运算符测试给定表达式（通常是变量）是否为语句中包含对象的实例。是的，这听起来很别扭。与其继续费力解释它，我将直接跳到示例，，之后一切都会迎刃而解：\n\
  \n```\nvar myDate = new Date();\nif (myDate instanceof Date) {\n        //do something\n\
  }\n```\n\n由于变量 `myDate` 是内置 `Date` 对象的实例，`instanceof` 评估返回 `true`。如上一个示例所示，`instanceof`\
  \ 运算符不仅影响用户定义对象，也影响内置对象。\n\n# 一元运算符\n\n在 JavaScript 中，一元运算符具有单个操作数，或者与单个表达式工作。表\
  \ 5-4 列出了 JavaScript 一元运算符。\n\n表 5-4. 一元运算符\n\n| 运算符 | 含义 |\n| --- | --- |\n| delete\
  \ | 删除属性 |\n| void | 返回 undefined |\n| typeof | 返回表示数据类型的字符串 |\n| ++ | 数字递增 |\n\
  | -- | 数字递减 |\n| + | 将操作数转换为数字 |\n| - | 取反操作数 |\n| ~ | 按位非 |\n| ! | 逻辑非 |\n\n由于使用一元运算符的方法并不直观，我在本章对它们进行了更详细的解释。\n\
  \n## 递增与递减\n\n如下代码所示，你使用 `++` 和 `--` 运算符分别对数字进行递增和递减（你可以在配套代码的 `incrementing.txt`\
  \ 文件中找到此代码）：\n\n```\nvar aNum = 4;\naNum++;\n++aNum;\n```\n\n运算符相对于操作数的位置决定了代码返回的值。当附加在变量之后时（称为*后置*），如上一个示例代码的第二行所示，运算符返回递增（或递减，取决于情况）*之前*的值。当前置时，如上一个示例代码的最后一行所示，运算符返回递增（或递减）*之后*的值。\n\
  \n这里有几个展示代码中前置和后置区别的示例。第一个示例是后置的：\n\n```\nvar aNum = 4;\nvar y = aNum++;  // y 现在的值是\
  \ 4，但 aNum 随后后变为 5\n```\n\n第二个示例是前置的：\n\n```\nvar aNum = 4;\nvar y = ++aNum;  //\
  \ y 现在的值是 5，aNum 也是\n```\n\n在实践中，你使用后置递增运算符的频率高于前置递增运算符或递减运算符，因为它是循环结构中方便的计数器。你将在第\
  \ 6 章中学习 JavaScript 中的循环。\n\n## 使用加号转换为数字\n\n加号 `+` 应该用于将值转换为数字。但在实践中，我发现它有些不可靠——或者至少不足以用于生产代码。当我需要将某些内容转换为数字时，我会显式地使用\
  \ `ToNumber()` 函数。不过，你可以将加号作为一元运算符尝试转换，如下所示（配套代码的 `converting.txt` 文件中也有显示）：\n\n\
  ```\nvar x = +\"43\";\n```\n\n这段代码导致 JavaScript 将字符串“43”转换为数字，并将数值 43 存储在变量 `x`\
  \ 中。\n\n## 使用减号创建负数\n\n当你在数字前面使用减号 `-` 时，数字会变为负数，这可能并不意外，如下代码所示（在 `creating.txt`\
  \ 中）：\n\n```\nvar y = \"754\";\nvar negat = -y;\n```\n```\n\n## 使用按位非和逻辑非取反\n\n\
  波浪号 `~` 是按位非，感叹号 `!` 是逻辑非。这些运算符会取反它们对应的对象。对于表达式的情况下，逻辑非在 JavaScript 编程中非常常用。如果表达式为\
  \ `true`，逻辑非会将其变为 `false`。关于按位操作的更多信息，请参见[`en.wikipedia.org/wiki/Bitwise_operation`](https://en.wikipedia.org/wiki/Bitwise_operation)。\n\
  \n## 使用 `delete` 运算符\n\n`delete` 运算符接收对象的属性或数组的索引并将其删除，或者使其变为 `undefined`。这里有一个简单的数组示例：\n\
  \n```\nvar myArray = (\"The RCMP\", \"The Police\", \"State Patrol\");\ndelete myArray[0];\
  \ // myArray 现在包含 \"The Police\" 和 \"State Patrol\"\n```\n\n前面的代码创建了数组 `myArray`，然后删除了第一个索引。如例所示，`delete`\
  \ 运算符也适用于对象。\n\n### 使用对象使用 delete\n\n1. 使用 Visual Studio、Eclipse 或编辑器编辑 Chapter05\
  \ 文件夹下的 `deleteop.htm` 文件。\n2. 创建一个后续使用 `delete` 运算符的基础页面。在页面中，将 TODO 注释替换为下面的粗体代码（代码也可以在配套内容的\
  \ `deleteop.txt` 文件中找到）。\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n\n<html>\n<head>\n    <title>The Delete\
  \ Operator</title>\n    <script type=\"text/javascript\">\n\n        var star =\
  \ {};\n\n        star[\"Polaris\"] = new Object;\n        star[\"Mizar\"] = new\
  \ Object;\n        star[\"Aldebaran\"] = new Object;\n        star[\"Rigel\"] =\
  \ new Object;\n\n        star[\"Polaris\"].constellation = \"Ursa Minor\";\n   \
  \     star[\"Mizar\"].constellation = \"Ursa Major\";\n        star[\"Aldebaran\"\
  ].constellation = \"Taurus\";\n        star[\"Rigel\"].constellation = \"Orion\"\
  ;\n\n    </script>\n</head>\n<body id=\"mainbody\">\n    <script type=\"text/javascript\"\
  >\n\n        for (starName in star) {\n            var para = document.createElement('p');\n\
  \            para.id = starName;\n            para.appendChild(document.createTextNode(starName\
  \ +\n                \": \" + star[starName].constellation));\n            document.getElementsByTagName(\"\
  body\")[0].appendChild(para);\n        }\n\n    </script>\n</body>\n</html>\n```\n\
  \n\n\n\n\n在代码的`<head>`部分，你创建了一个空的 `star` 对象以及几个额外的 `star` 对象，每个对象的命名方式为`star[\"\
  “starname”]`。然后，你为这些对象赋予了一个 `constellation` 属性，其值为该恒星所属的星座。在代码的`<body>`部分，执行了一个\
  \ `for` 循环来遍历 `star` 对象中的每一颗恒星。这段代码使用了文档对象模型（DOM），该内容在第 10 章中有所介绍。现在，不必过于担心 `for`\
  \ 循环内部代码的具体作用。\n\n3.  保存文件并在网页浏览器中查看。输出所示：\n\n![在对象上使用 delete 操作符](img/httpatomoreillycomsourcemspimages748670.png.jpg)\n\
  \n4.  在代码中的 `for` 循环上方添加 `delete` 操作符，以移除北极星（Polaris）的星座。代码（可在配套内容的 `deleteop2.txt`\
  \ 文件中）所示：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n\n<html\n<head>\n    <title>The Delete Operator</title>\n    <script type=\"\
  text/javascript\">\n\n        var star = {};\n        star[\"Polaris\"] = new Object;\n\
  \        star[\"Mizar\"] = new Object;\n        star[\"Aldebaran\"] = new Object;\n\
  \        star[\"Rigel\"] = new Object;\n\n        star[\"Polaris\"].constellation\
  \ = \"Ursa Minor\";\n        star[\"Mizar\"].constellation = \"Ursa Major\";\n \
  \       star[\"Aldebaran\"].constellation = \"Taurus\";\n        star[\"Rigel\"\
  ].constellation = \"Orion\";\n\n        </script>\n</head>\n<body id=\"mainbody\"\
  >\n<script type=\"text/javascript\">\n\n        delete(star[\"Polaris\"].constellation);\n\
  \n        for (starName in star) {\n            var para = document.createElement('p');\n\
  \            para.id = starName;\n            para.appendChild(document.createTextNode(starName\
  \ +\n                \": \" + star[starName].constellation));\n            document.getElementsByTagName(\"\
  body\")[0].appendChild(para);\n        }\n\n    </script>\n\n</body>\n</html>\n\
  ```\n\n注意文档主体中 `<script>` 标签内添加的 `delete` 操作符（此处以**粗体**字体显示）。\n\n5.  保存文件并在网页浏览器中查看。输出所示：\n\
  \n![在对象上使用 delete 操作符](img/httpatomoreillycomsourcemspimages748672.png.jpg)\n\n\
  使用 `delete` 操作符会导致北极星的星座变为 `undefined`（未定义）。你也可以像这样删除整个北极星对象：\n\n```\ndelete(star[\"\
  Polaris\"]);\n```\n\n## 使用 `typeof` 操作符返回变量类型\n\n正如你所预期的，`typeof` 操作符返回所给操作数的变量类型。通过\
  \ `typeof`，你可以确定例如，一个给定的变量是否被创建并正在作为字符串、数字或布尔值使用；或者该变量是否是特定类型的对象或函数。考虑这段代码：\n\n\
  ```\nvar star= {};\nif (typeof(star) == \"object\") {\n        alert(\"star is an\
  \ object\");\n}\n```\n\n当评估数字时，`typeof` 操作符返回“number”；当评估字符串类型时返回“string”；并且（正如你在示例中看到的），当评估对象时返回“object”。当你使用属性时，JavaScript\
  \ 会智能地假设你想知道该属性所属变量的类型，而不是对象的类型，因此它会返回该属性的 `value` 类型。这里有一个借用了本章稍早代码的示例。\n\n###\
  \ 使用 `typeof` 操作符\n\n1.  使用 Visual Studio、Eclipse 或编辑器，编辑配套内容中 Chapter05 示例文件夹下的\
  \ `typeof.htm` 文件。\n\n2.  在网页中，添加此处**粗体**所示的代码（可在配套内容的 `typeof.txt` 文件中找到）：\n\n\
  ```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html\n<head>\n    <title>The Typeof Example</title>\n\n    <script type=\"text/javascript\"\
  >\n        var star = {};\n\n        star[\"Polaris\"] = new Object;\n        star[\"\
  Polaris\"].constellation = \"Ursa Minor\";\n\n        alert(typeof star[\"Polaris\"\
  ].constellation);\n        </script>\n\n</head>\n<body>\n\n</body>\n</html>\n```\n\
  \n3.  `<script>` 标签内的代码为恒星北极星创建了一个新对象，并将其 `constellation` 属性设置为字符串“Ursa Minor”。然后它使用\
  \ `typeof` 操作符调用 `alert` 对话框，显示 `star[\"“Polaris”].constellation` 属性类型为字符串。\n\n\
  4.  保存文件并在网页浏览器中查看。你会得到如下所示提示框：\n\n![使用 typeof 操作符](img/httpatomoreillycomsourcemspimages748674.png.jpg)\n\
  \n使用 `typeof` 操作符，你还可以看到 `null` 和 `undefined` 之间的区别。\n\n## `void` 操作符\n\n如果你检查过任何\
  \ JavaScript 源代码，很可能见过 `void` 操作符。`void` 操作符在评估其参数后返回 `undefined`。`void` 操作符的一个常见用法是打开新窗口，如下所示：\n\
  \n```\nvoid(window.open());\n```\n\n更常见的是，你会将 `void` 操作符放在链接的 `href` 中来打开新窗口：\n\n\
  ```\n<a href=\"javascript:void(window.open())\">点击此处打开新窗口</a>\n```\n\n### 注意\n\n\
  通常不建议在 `href` 中使用 `javascript:`。\n\n# 赋值操作符\n\n你已经在本章复习了赋值，并在书中随可见它们。主要的（或最常用的）赋值运算符是等号（`=`）。这种运算符被称为*简单赋值*。JavaScript\
  \ 有许多赋值运算符，包括表 5-5](#ch05s08.html_compound_assignment) 中所示的。\n\n表 5-5 复合赋值运算符\n\n\
  | 运算符 | 含义 |\n| --- | --- |\n| *= | 左操作数乘以右操作数 |\n| /= | 左操作数除以右操作数 |\n| %= | 提供左操作数对右操作数的余数（模）\
  \ |\n| += | 将右操作数加上左操作数 |\n| -= | 从左操作数中减去右操作数 |\n| <<= | 位左移 |\n| >>= | 位右移 |\n\
  | >>>= | 无符号位右移 |\n| &= | 位*与* |\n| ^= | 位*异或* |\n| \\|= | 位*或* |\n\n*复合赋值运算符*提供了节省击键次数和字节的快捷方法。例如，你可以使用\
  \ `+=` 和 `-=` 对数字进行加减，如例例所示：\n\n```\nvar myNum = 10;\nalert(myNum);\nmyNum += 30;\n\
  alert(myNum);\n```\n\n在变量定义并赋值为 10 之后的第一个提示所示：\n\n![复合赋值运算符](img/httpatomoreillycomsourcemspimages748677.png.jpg)\n\
  \n在使用复合加法赋值后，下一个提示所示：\n\n![复合赋值运算符](img/httpatomoreillycomsourcemspimages748679.png.jpg)\n\
  \n\n\n\n字节数越少，意味着用户下载的脚本越小。要量化你可以节省多少字节，或者这对你有多大帮助是非常困难的。一些程序员可能会认为这种影响微乎其微——对于较小的脚本来说这可能是事实，尤其是因为用户越来越多地拥有了宽带或更快的连接。但对于较大的脚本，智能的快捷方式能带来的积极影响是非常真实的，特别是当这些脚本必须通过拨号或其他慢速类型连接进行下载时。\n\
  \n在下载过程中节省字节数的一种常用方法是 JavaScript 的**混淆**（minification）。`Minification`指的是从运行或生产环境网站的\
  \ JavaScript 文件中移除所有非必要的元素。非必要的元素不仅包括注释，还包括空格和换行。生成的混淆文件除非你重新引入一些空格和换行符，否则是相当不可读的。\n\
  \n## 逗号运算符\n\n逗号运算符（`,``）用于分隔表达式并按顺序执行它们。通常，逗号（`,``）用于分隔变量声明，这允许在一行内声明多个变量：\n\n\
  ```\nvar num1, num2, num3;\n```\n\n或者，也可以设置值：\n\n```\nvar num1=3, num2=7, num3=10;\n\
  ```\n\n# 练习\n\n| 1. | 使用加运算符（`+`））向屏幕发送三个 `alert()` 对话框（你可以使用三个独立的程序）。第一个 alert\
  \ 应该加两个数字。第二个应该加一个数字和一个字符串。第三个应该加两个字符串。所有内容都由变量表示。 |\n| 2. | 使用后置自增运算符（`++`））增加变量中存储的数字。在递增之前、期间和之后显示变量的值。使用前置自增运算符增加数字，并使用\
  \ `alert` 在递增之前、期间和之后显示其结果。 |\n| 3. | 使用 `typeof` 运算符检查你在练习 1 中创建的变量的类型。 |\n| 4.\
  \ | 正确或错误：一元运算符在 JavaScript 中并不经常出现。 |\n| 5. | 正确或错误：节省字节（尽可能使用 JavaScript 快捷方式）总是比使用返回和缩进好，后者会减慢页面加载。\
  \ |\n\n# 第二部分. 应用 JavaScript\n\n# 第 6 章. 使用条件和循环控制流程\n\n读完本章后，你将能够：\n\n* 理解 JavaScript\
  \ 中不同类型的条件语句。\n* 使用 `if else` 条件语句控制代码的执行。\n* 使用 `switch` 语句。\n* 理解 JavaScript 中不同类型的循环控制结构。\n\
  * 使用 `while` 循环和 `do...while` 循环重复执行代码。\n* 使用不同类型的 `for` 循环来迭代值范围。\n\n## 如果（以及如何）\n\
  \n`if` 语句评估一个表达式，并根据结果决定程序中执行哪些代码。更复杂的 `if` 语句可以根据多个条件控制执行哪些代码。如果你在互联网上预订了机票，你就知道如何做决策了。例如，你可能想去进行一次快速短的周末游，因此在给票定价时，你会说：“如果票价低于\
  \ 350 美元，我就订机票，否则我会找另一个度假地。”假设我想倒垃圾。我应该今晚把垃圾带到路边，还是等等到明天早上？如果天气预报说昨晚有风，垃圾可能会被吹到邻居的草坪上，但如果我等到明天早上，我可能会错过垃圾车。（第三种选择是告诉我的妻子轮到她倒垃圾了，但过去这从未起过作用。）\n\
  \n虽然 JavaScript 不会帮助你做出这些生活中的决策，但它可以通过做出这类决策来提供极大帮助——也就是说，它可以根据变量是否包含特定值或表单字段是否正确填写来控制程序的行为。本节回顾了\
  \ JavaScript 中 `if` 语句的语法。\n\n## if 语句的语法\n\n如果你用过其他语言（包括 Perl 或 PHP），那么 `if` 语句的语法对你可能很熟悉。`if`\
  \ 语句的基本结构如下：\n\n```\nif (some condition) {\n    //在此执行某些操作\n}\n```\n\n### 注意\n\n\
  `if` 语句有时被称为 `if` 条件（if conditional）。在本章及其他章节中，我交替使用这些术语，以便你熟悉这两个词。但不要混淆 `if` 条件（整个\
  \ `if` 语句）与 `if` 条件（if condition），后者是 `if` 语句评估的布尔表达式。\n\n`if` 语句检查条件的有效性或真假性，以决定是否执行条件内（大括号内部）的代码。条件是一个布尔表达式，当它评估为\
  \ `true` 时，会导致 `if` 语句执行条件中的代码。（你可以对条件中的表达式进行取反，以便在表达式评估为 `false` 时运行代码。）回想第 5 章中布尔运算符和一元运算符的使用。这里有一个例子：\n\
  \n```\nif (! some condition) {\n    //在此执行某些操作\n}\n```\n\n在这种情况下，条件以取反运算符（`!`）开头，这意味着条件需要评估为\
  \ `false`，条件内的代码才会执行。\n\n本章前面提到的真实的航空公司成本示例在伪代码中可能如下：\n\n```\nif (flightCost < 350)\
  \ {\n    bookFlight();\n}\n```\n\n如果机票价格低于 350 美元，条件内的代码将执行。垃圾的示例可能如下：\n\n```\n\
  if (forecast != \"windy\") {\n   takeGarbage();\n}\n```\n\n在本章稍后的部分，我将向你展示如何使用 `else`\
  \ 语句在条件为 `true` 时执行其他代码。\n\n你可以在 `if` 语句中使用你在第 5 章中学的运算符，特别是测试一个值是否大于或小于另一个值的关系运算符，以及测试两个值是否相等的相等运算符。请看这些示例：\n\
  \n```\nvar x = 4;\nvar y = 3;\n// 相等测试\nif (x == y) {\n    //执行某些操作\n}\n```\n\n\
  因为变量 `x` 的值 (4) 不等于变量 `y` 的值 (3)，`if` 条件（括号内）的代码不会执行。这里有一个使用关系运算符的例子：\n\n```\nvar\
  \ x = 4;\nvar y = 3;\n// 关系测试\nif (x > y) {\n    //执行某些操作\n}\n```\n\n在这种情况下，由于变量\
  \ `x` 的值 (4) 大于变量 `y` 的值 (3)，括号内的代码执行。\n\n下一节将展示一个你可以执行的示例。此示例利用 `prompt()` 函数通过简单的接口获取访问者的输入。\n\
  \n## Internet Explorer 中的 prompt 函数\n\n随着 Windows Internet Explorer 7 的引入，`prompt()`\
  \ 函数不再默认启用。如果你在 Internet Explorer 中尝试使用 `prompt()` 函数，你会收到一个像图 6-1 所示的安全警告，或者可能看到一个带有\
  \ `null` 字样的页面，如图 6-2 所示的警告。\n\n\n\n\n\n![当使用 javascript: 伪协议配合 prompt() 函数时，你有时会收到一个带有\
  \ null 字的页面。](img/httpatomoreillycomsourcemspimages748683.png.jpg)\n\n图 6-2。当使用\
  \ `javascript:` 伪协议配合 `prompt()` 函数时，你有时会收到一个带有 `null` 字的页面。\n\n你可以通过点击信息栏（显示在图\
  \ 6-1` 函数引起的安全警告。\")）并选择允许脚本的选项，或者通过更改安全设置来可靠地绕过此功能。你可以在 Internet Explorer 中更改安全设置，例如，从`工具`\
  \ 菜单选择`Internet 选项`，点击`安全` 选项卡，点击`自定义级别`，并在`脚本` 部分中启用`允许网站通过脚本窗口向用户提问以信息` 选项。\n\n\
  然而，你不能指望你的访问者对他们的 Internet Explorer 设置进行同样的操作。因此，`prompt()` 函数不再像 Internet Explorer\
  \ 7 引入之前那样有用了。一些程序员可能会认为 `prompt()` 函数很烦人（我同意它有时会产生问题），但它确实有其优势，禁用它对增强安全的作用很小。但在某些情况下它对测试很有用，例如下面的练习中。\n\
  \n### 使用 `if` 对程序流做出决策\n\n1. 使用 `Microsoft Visual Studio`、`Eclipse` 或或其他编辑器编辑 `Chapter06`\
  \ 示例文件文件夹中的 `ifexample.htm` 文件，你可以在配套内容中找到该文件。\n\n2. 在页面中，将 `TO DO` 注释替换为以下加粗字体所示的代码（此代码也位于配套内容中的\
  \ `ifexample.txt` 文件中）：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n    <title>An If Example</title>\n\
  </head>\n<body>\n\n<script type=\"text/javascript\">\nvar inputNum = prompt(\"Please\
  \ enter a number below 100:\");\n\nif (inputNum > 99) {\n    alert(\"That number,\
  \ \" + inputNum + \", is not below 100.\");\n}\n\n</script>\n\n<p>This is an example\
  \ from Chapter 6.</p>\n\n</body>\n</html>\n```\n\n3. 保存页面并在 Web 浏览器中查看。如果你尝试在 `Internet\
  \ Explorer` 中查看页面并收到安全警告，则需要像之前的那样更改你的安全设置。你也可以使用 `Firefox` 或另一个浏览器。\n\n4. 当你查看页面时，你会看到一个提示要求输入一个小于\
  \ 100 的数字。`Internet Explorer` 通常会在对话框的文本框中填入 `undefined`。输入一个数字并点击 `OK`。正如这里看到的这样输入的：\n\
  \n![使用 if 对程序流做出决策](img/httpatomoreillycomsourcemspimages748685.png.jpg)\n\n5. 点击\
  \ `OK`。你会看到一个类似这里的页面：\n\n![使用 if 对程序流做出决策](img/httpatomoreillycomsourcemspimages748687.png.jpg)\n\
  \n6. 在浏览器中重新加载页面，这次在提示时，输入一个大于 100 的数字。你会收到一个像这样的警报：\n\n![使用 if 对程序流做出决策](img/httpatomoreillycomsourcemspimages748689.png)\n\
  \n除了你在之前的示例中看到的超文本标记语言 (HTML) 和打开脚本标签外，该代码的工作原理如下：\n\n`body` 内部 `<script>` 标签内的第一行建立了一个变量\
  \ `inputNum`，然后将其赋值为 `prompt()` 函数的结果：\n\n```\nvar inputNum = prompt(\"Please enter\
  \ a number below 100:\");\n```\n\n接几行代码使用 `if` 语句检查 `inputNum` 变量中的值。如果该值大于 99，则会显示警报：\n\
  \n```\nif (inputNum > 99) {\n    alert(\"That number, \" + inputNum + \", is not\
  \ below 100.\");\n}\n```\n\n这个示例在许多方面都需要改进，随后的示例将展示如何改进代码，利用你已经学到的知识并使用你在本章后面学到的一些新技术。\n\
  \n### 复合条件\n\n很多时候，你需要在同一个 `if` 语句中测试多个一个条件。考虑之前的示例。假设你想让访问者输入一个 51 到 99 之间的数字（包含边界）。你可以将这些测试组合在一个\
  \ `if` 语句中，如下：\n\n```\nif ((inputNum < 51 ) || (inputNum > 99)) {\n    alert(\"\
  That number, \" + inputNum + \", is not between 50 and 100.\");\n}\n```\n\n字体 注意\n\
  \n你也可以编写该 `if` 语句而不在在第一行的每个评估周围添加额外的括号；然而，我发现添加括号可以提高可读性。\n\n你可以在之前的示例中查看完整代码，其中加粗字体显示的复合\
  \ `if` 语句位于示例 6-1。（你可以在配套内容中找到该代码，文件名为 `listing6-1.htm`）。\n\n```\n<!DOCTYPE HTML\
  \ PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n    <title>An If Example</title>\n</head>\n<body>\n\n<script\
  \ type=\"text/javascript\">\nvar inputNum = prompt(\"Please enter a number below\
  \ 100:\");\n\nif (inputNum > 99) {\n    alert(\"That number, \" + inputNum + \"\
  , is not below 100.\");\n}\n\n</script>\n\n<p>This is an example from Chapter 6.</p>\n\
  \n</body>\n</html>\n```\n\n该语句在示例 6-1 中使用逻辑 `OR` 运算符并读取：“如果 `inputNum` 大于 99 或小于\
  \ 51，执行此。”\n\n再次考虑我们使用了本章内容的示例。如果你输入一个大于 99 或小于 51 的数字，你会收到警报。但如果输入的不是数字呢？如果你输入了单词\
  \ `boo` 呢？因此，代码应该检查 `inputNum` 是否为数字。你可以通过 `isNaN()` 函数并像下面这样嵌套决策来实现这一点：\n\n```\n\
  if (isNaN(inputNum) || ((inputNum > 99) || (inputNum < 51))) {\n    alert(\"That\
  \ number, \" + inputNum + \", is not between 50 and 100.\");\n}\n```\n\n条件现在首先检查\
  \ `inputNum` 是否为数字。如果这个初始检查为真（用户没有输入数字），则不进行后续处理，防止语句的其他部分被评估。如果用户输入了数字，`isNaN`\
  \ 失败，`if` 语句执行范围检查，这些检查嵌套在括号中，创建了它们自己的条件集。输入值为 `boo` 的结果在图 6-3 函数进行嵌套示例\")中所示。\n\
  \n![使用 isNaN() 函数进行嵌套](img/httpatomoreillycomsourcemspimages748691.png.jpg)\n\n\
  图 6-3。使用 `isNaN()` 函数进行嵌套示例。\n\n完整代码可以在示例 6-2 中查看，其中加粗字体显示的嵌套 `if` 语句位于（在配套内容中的\
  \ `listing6-2.htm` 文件中）。嵌套条件显示为粗。\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML\
  \ 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n    <title>An\
  \ If Example</title>\n</head>\n<body>\n\n<script type=\"text/javascript\">\nvar\
  \ inputNum = prompt(\"Please enter a number between 50 and 100:\");\n\nif (isNaN(inputNum)\
  \ || ((inputNum > 99) || (inputNum < 51))) {\n    alert(\"That number, \" + inputNum\
  \ + \", is not between 50 and 100.\");\n}\n\n</script>\n\n<p>This is an example.</p>\n\
  \n</body>\n</html>\n```\n\n\n\n\n\n## 使用 `else if` 和 `else` 语句\n\n到目前为止代码示例的下一个问题是，图\
  \ 6-3 函数运行示例\") 中的警报对话框文本始终显示输入了一个数字。这显然并不总是——我输入了单词 `boo`。你真正需要的是执行多个独立条件检查的方法。如何做到这一点？这就是\
  \ `else if` 和 `else` 派上用场的地方。\n\n## `Else if`\n\n大多数现代编程语言都有 `if/else if/else` 条件构造结构，但它们在使用这些结构的方式上有所不同，特别是拼写或构建\
  \ `else if` 语句的方式。某些语言将其定义为 `elsif`，一个单词（且拼写错误）。另一些语言将其定义为 `elseif`——也是一个单词，但拼写正确。记住这些不同的结构是一项挑战，而且这里的讨论还没有考虑语言使用括号来定义要执行代码的不同方式。在\
  \ JavaScript 编程中，你使用 `else if`——两个单词，且拼写正确。\n\n使用 `else if` 和 `else`，你可以创建多层条件，每个条件都会轮流测试。第一个匹配的条件中的代码将被执行。如果没有匹配项，则执行\
  \ `else` 条件中的代码（如果存在的话）。示例 6-3（配套内容中的 listing6-3.htm）显示了代码，该代码首先检查 `inputNum` 变量是否包含数字。如果该值确实是数字，`else\
  \ if` 语句将执行检查以确保输入值在适当范围内。代码根据匹配条件调用相应的 `alert()` 函数。如果你输入了一个数字，那么 `else` 条件就会触发并显示显示该数字的警报。\n\
  \n示例 6-3. 使用 `else if` 和 `else` 条件。\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n\
  \    <title>An If Example</title>\n\n</head>\n<body\n\n<script type=\"text/javascript\"\
  >\nvar inputNum = prompt(\"Please enter a number between 50 and 100:\");\n\nif (isNaN(inputNum))\
  \ {\n    alert(inputNum + \" doesn't appear to be a number.\");\n}\nelse if ((inputNum\
  \ > 99) || (inputNum < 51)) {\n    alert(\"That number, \" + inputNum + \", is not\
  \ between 50 and 100.\");\n}\nelse {\n    alert(\"You entered a number: \" + inputNum);\n\
  }\n\n</script>\n\n<p>This is an example from Chapter 6.</p>\n\n</body>\n</html>\n\
  ```\n\n同样，你可以使用 `else if` 和 `else` 来测试几个条件，你也可以（有时甚至必须）使用多层条件。例如，你可以测试某个特定条件，并在成功后执行额外的条件。这里有一个利用\
  \ `match()` 函数和正则表达式的示例。关于正则表达式的更多信息，请参阅第 4 章。\n\n## 使用多层条件和正则表达式\n\n1.  打开编辑器并——如果你遵循了本章之前的操作步骤——打开你更新过的的文件\
  \ `ifexample.htm`（在配套内容中）。\n\n    该文件应该包含以下代码。（如果你没有按照之前的示例操作，只需创建一个空文件，粘贴以下代码，然后继续下一步即可。）\n\
  \n    ```\n    <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n    \"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n    <html>\n    <head>\n        <title>An If Example</title>\n    </head>\n \
  \   <body>\n\n    <script type=\"text/javascript\">\n    var inputNum = prompt(\"\
  Please enter a number below 100:\");\n\n    if (inputNum > 99) {\n        alert(\"\
  That number, \" + inputNum + \", is not below 100.\");\n    }\n\n    </script>\n\
  \n    <p>This is an example from Chapter 6.</p>\n\n    </body>\n    </html>\n  \
  \  ```\n\n2.  使用不同的文件名保存该文件。\n\n3.  在新保存的文件中，输入下文粗所示的代码。注意，我将之前示例中的更改也加粗包含在了：\n\n\
  \    ```\n    <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n    \"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n    <html>\n    <head>\n        <title>A Multi-Level Example</title>\n\n    </head>\n\
  \    <body>\n    <script type=\"text/javascript\">\n    var inputNum = prompt(\"\
  Please enter a number between 50 and 100:\");\n\n    if (isNaN(inputNum)) {\n  \
  \      if (inputNum.match(/one|two|three|four|five|six|seven|eight|nine|ten/)) {\n\
  \            alert(\"While this is a number, it's not really a number to me.\");\n\
  \        } else {\n            alert(inputNum + \" doesn't appear to be a number.\"\
  );\n        }\n    }\n    else if ((inputNum > 99) || (inputNum < 51)) {\n     \
  \   alert(\"That number, \" + inputNum + \", is not between 50 and 100.\");\n  \
  \  }\n\n    </script>\n\n    <p>This is an example from Chapter 6.</p>\n\n    </body>\n\
  \    </html>\n    ```\n\n4.  测试所有这些条件。首先在网络浏览器中访问该页面。系统提示你输入一个数字。对于第一次测试，按如下所示输入单词：\n\
  \n    ![使用多层条件和正则表达式](img/httpatomoreillycomsourcemspimages748693.png)\n\n5.  点击\
  \ OK。第一个 `if` 条件匹配，然后嵌套的 `if` 检查输入。输入与字符串“four”匹配，导致此对话框：\n\n    ![使用多层条件和正则表达式](img/httpatomoreillycomsourcemspimages748695.png)\n\
  \n6.  点击 OK 关闭对话框。重新加载页面。现在输入该短语：\n\n    ![使用多层条件和正则表达式](img/httpatomoreillycomsourcemspimages748697.png)\n\
  \n7.  点击 OK。与之前加载页面一样，第一个条件 (`isNaN()`) 匹配。然而，由于内部的 `if` 测试没有匹配短语 `pizza`，嵌套 `if`\
  \ 的 `else` 条件将匹配，导致此对话框：\n\n    ![使用多层条件和正则表达式](img/httpatomoreillycomsourcemspimages748699.png)\n\
  \n8.  点击 OK 关闭对话框，再次加载页面。这次，在文本框中输入数字 `4`，如下所示：\n\n    ![使用多层条件和正则表达式](img/httpatomoreillycomsourcemspimages748701.png)\n\
  \n9.  点击 OK。现在第一个 `if` 条件失败了，因为数字 4 确实是一个数字。因此，评估了 `else if` 条件。因为数字 4 小于 51 且不大于\
  \ 99，`else if` 条件匹配并显示了此警报：\n\n    ![使用多层条件和正则表达式](img/httpatomoreillycomsourcemspimages748703.png)\n\
  \n10. 良好的测试实践要求你还要测试一个 99 以上的数字。你可以这样做。准备就绪后，点击 OK 关闭对话框并再次加载页面。这次，输入数字 `64`：\n\n\
  \    ![使用多层条件和正则表达式](img/httpatomoreillycomsourcemspimages748705.png)\n\n11. 点击\
  \ OK 后，你不会收到任何警报，因为数字 64 处于 50 到 100 之间，因此不匹配任何测试条件。\n\n我解释了在本过程以及之前的过程中你正在审查的代码，但没有解释嵌套\
  \ `if` 中的的正则表达式。该语句是：\n\n```javascript\nif (inputNum.match(/one|two|three|four|five|six|seven|eight|nine|ten/))\
  \ {\n```\n\n\n\n\n该表达式用两个正斜杠 (`/`) 界定，两端各一个。之后，正则表达式会查找字符串 `one`、`two`、`three`、`four`、`five`、`six`、`seven`、`eight`、`nine`\
  \ 或 `ten` 中的任意一个。字符串之间的管道字符 (`|`) 表示逻辑与，这意味着正则表达式匹配这些字符串中的任意一个，但不会匹配多个。\n\n有趣的是，尽管这个正则表达式非常简单，但它也有很大的缺陷。为了让这个正则表达式更好，它需要标记（或锚定）匹配字符串的位置。按照目前的写法，字符串\
  \ `sixty` 将像现在的单词 `six` 一样被匹配。\n\n我在这里的意图并不是展示一个完美的正则表达式，而是让你接触到它，以便当你以后需要使用它们时，不会尖叫着要逃跑！\n\
  \n# 使用三元运算符\n\n另一种条件构造样式被称为“三元条件”（`ternary conditional`）。这种条件使用问号 (`?`) 运算符来创建一个紧凑的\
  \ `if/else` 结构。三元条件表达式的基本结构非常简单\n\n```\n(name == \"steve\") ? \"Hello Steve\" :\
  \ \"Hello Unknown Person\";\n```\n\n该语句可以读为：“如果 `name` 是 steve，那么执行‘Hello Steve’，否则执行‘Hello\
  \ Unknown Person’。”\n\n你可以在像下面的语句中使用三元表达式（此代码位于配套内容中的 `ternary.txt` 文件）：\n\n```\n\
  var greeting = (name == \"steve\") ? \"Hello Steve\" : \"Hello Unknown Person\"\
  ;\nalert(greeting);\n```\n\n这段代码将变量 `greeting` 设置为三元测试结果的值。如果变量 `name` 的值是“steve”，则\
  \ `greeting` 变量获得字符串值“Hello Steve”；否则，`greeting` 变量将获得字符串值“Hello Unknown Person”。这里是使用传统\
  \ `if/else` 形式的相同代码：\n\n```\nif (name == \"steve\") {\n    var greeting = \"Hello\
  \ Steve\";\n}\nelse {\n    var greeting = \"Hello Unknown Person\";\n}\n\nalert(greeting);\n\
  ```\n\n如果你以前没见过这种写法，三元构造有时会让人感到困惑。如果你认为坚持传统的 `if/else` 语法有助于提高未来程序的可读性——那么坚持使用并不可耻，尤其是当阅读代码的人不知道三元构造时！\n\
  \n# 使用 *switch* 进行测试\n\n`switch` 语句是一种简单高效的方法，用于测试变量的多个值，并根据匹配的 case 执行代码。虽然你可以通过\
  \ `if/else if` 语句来完成任务，但这样做可能会很麻烦；在这种情况下 `switch` 语句更有用。\n\n考虑这样一个网站，它需要根据用户选择的语言执行某些代码。在此练习中，假设访问者已通过表单选择了他们的语言。（第\
  \ 11 章 探讨了检测访问者浏览器默认语言的方法。）\n\n如果该网站需要为几种语言执行代码，我们可以使用一组巨大的 `if/else if/else` 条件。假设有一个名为\
  \ `languageChoice` 的变量，值为所选语言，代码可能如下：\n\n```\nif (languageChoice == \"en\") {\n\
  \    // 语言是英语，执行英语代码。\n}\nelse if (languageChoice == \"de\") {\n    // 语言是德语，执行德语代码。\n\
  }\nelse if (languageChoice == \"pt\") {\n    // 语言是葡萄牙语，执行葡萄牙语代码。\n}\nelse {\n \
  \   // 未选择语言，使用瑞典语。\n}\n```\n\n这段代码在只选择少数语言时运行良好，但请想象一下选择了 20 种或更多语言的情况。然后为每个条件添加更多要执行的代码，它很快就会变成一个迷宫。这里是\
  \ `switch` 内的相同代码（你可以在配套内容中的 `switches.txt` 文件中找到代码）：\n\n```\nswitch(languageChoice)\
  \ {\n    case \"en\":\n        // 语言是英语，执行英语代码。\n        break;\n    case \"de\"\
  :\n        // 语言是德语，执行德语代码。\n        break;\n    case \"pt\":\n        // 语言是葡萄牙语，执行葡萄牙语代码。\n\
  \        break;\n    default:\n        // 未选择语言，使用瑞典语。\n}\n// 回到 switch 语句之外的代码\n\
  ```\n\n`switch` 语句查找每个语言 case，然后执行该 case 的代码。`break` 语句表示找到匹配 case 时执行代码的结束。`break`\
  \ 语句会导致代码执行完全跳出 `switch` 语句，并在 `switch` 语句结束大括号之后继续执行。\n\n例如，如果变量 `languageChoice`\
  \ 值为 `de` 且缺少 `break` 语句，将执行德语代码，但 `switch` 语句将继续测试其他语言的代码，直到遇到 `break` 语句或到达 `switch`\
  \ 语句结束。\n\n你几乎总会在 `switch` 语句的每个 case 中使用 `break` 语句。然而，当你有多个*应该*执行相同代码的 case 时，`switch`\
  \ 语句的优雅之处就会体现出来。考虑一个访问者选择其所属国家或地区的例子。在这样的网站上，来自美国、澳大利亚和英国的访问者可能希望他们的页面以英语显示，尽管这三个国家的人拼写单词的方式不同。以下是相应的\
  \ `switch` 语句示例（在配套内容的 `switches.txt` 文件中）：\n\n```\nswitch(countryChoice) {\n  \
  \  case \"US\":\n    case \"Australia\":\n    case \"Great Britain\":\n        //\
  \ 语言是英语，执行英语代码\n        break;\n    case \"Germany\":\n        // 语言是德语，执行德语代码。\n\
  \        break;\n    case \"Portugal\":\n        // 语言是葡萄牙语，执行葡萄牙语代码。\n        break;\n\
  \    default:\n        // 未选择语言，使用瑞典语。\n}\n// 回到循环之外的代码\n```\n\n### 注意\n\n正如我蒙特利尔的朋友指出的正如我建议的，任何国家的访问者都应该能够选择网站支持的另一种语言，如法语。在此示例中忽略该功能，但在设计网站时要考虑到。\n\
  \n如果访问者选择澳大利亚作为其国家，将匹配澳大利亚 case，从而执行英语代码。由于 `break` 语句，JavaScript 然后跳出 `switch`\
  \ 语句并执行 `switch` 语句之后的第一行代码。\n\n## 使用 while 循环\n\n`while` 语句创建一个只要条件为真就会执行的循环。本节介绍\
  \ `while` 语句和相关的 `do...while` 语句。\n\n## *while* 语句\n\n`while` 循环在条件满足之前执行其大括号内的代码。这里有一个示例（此代码位于配套内容中的\
  \ `while.txt` 文件）：\n\n```\nvar count = 0;\nwhile (count < 10) {\n    // 在这里做一些事情。\n\
  \    // 多行也是可以的。\n    // 不要忘记增加计数器：\n    count++;\n}\n```\n\n始终记住 *while* 循环的两个重要方面，在此列出并逐一讨论：\n\
  \n*   取决于所测试的变量或条件的初始值，`while` 语句中包含的代码可能永远不会执行。\n*   `while` 语句测试的条件必须在循环内部发生变化。\n\
  \n### 确保代码至少执行一次\n\n\n\n\n在前面的代码示例中，变量 `count` 最初被设置为数字 `0`。随后 `while` 语句的运行方式如下：`while`\
  \ 语句的求值会检查 `count` 变量的值，判断它是否小于 `10`。由于它满足该条件，大括号内的代码就会执行。（然而，如果 `count` 变量的值不小于\
  \ `10`，`while` 语句大括号内的代码将永远不会执行——一次也不会执行。）\n\n在 JavaScript 中，`do...while` 循环无论初始条件如何，都会执行一次代码。`do...while`\
  \ 循环将在本章稍后部分讨论。\n\n### 更改条件\n\n如前所述，示例中 `while` 语句的求值检查该变量以判断其是否小于 `10`。如果 `count`\
  \ 小于 `10`，则执行 `while` 循环内的代码。\n\n`while` 循环内部的某行代码使用 `++` 一元运算符递增 `count` 变量，如下所示：\n\
  \n```\ncount++;\n```\n\n当 `while` 语句中的代码执行完毕后，将重复求值。如果没有递增 `count` 变量的代码，`count`\
  \ 将始终小于 10，导致你陷入一个死循环——这并不是你想要的。\n\n### 提示\n\n当你使用通用计数器变量时（如我在示例中所做），在哪里递增该变量并不重要，只要你在\
  \ `while` 语句的大括号内或 `while` 语句测试中执行即可。这是一个示例：`while (i++ < 10)`。关于后缀运算符的更多信息，请参阅\
  \ 第 5 章。\n\n这个故事的道理是，确保你对在 `while` 语句中求值的任何条件都进行递增或更改。\n\n## `do...while` 语句\n\n\
  与 `while` 语句不同，`do...while` 语句至少执行一次其大括号中包含的代码。`while` 语句读起来像：“只要条件满足，就运行这段代码。”另一方面，`do...while`\
  \ 语句读起来可能像：“执行（或运行）这段代码，直到条件满足。”考虑这段代码（位于辅助内容中的 `dowhile.htm` 文件中）：\n\n```\n<!DOCTYPE\
  \ HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n    <title>Do While</title>\n</head>\n<body>\n<script type=\"\
  text/javascript\">\nvar count = 0;\ndo {\n    alert(\"Count is \" + count);\n  \
  \  count++;\n}\nwhile (count < 3);\n\n</script>\n</body>\n</html>\n```\n\n当这段代码执行时，会出现三个对话框。在第一次运行期间，`count`\
  \ 变量持有值 `0`，因为该变量仍被设置为初始值，且对话框指示了这一点，如 图 6-4 所示]。\n\n![第一次执行时计数为 0。](img/httpatomoreillycomsourcemspimages748707.png.jpg)\n\
  \n图 6-4.第一次执行时计数为 0。\n\n运行一次后，`count` 变量被递增。当求值 `while` 语句时，`count` 仍然小于 3，因此代码再次执行，导致如\
  \ 图 6-5 所示的对话框。\n\n![运行时，代码递增计数器并显示下一次执行的结果。](img/httpatomoreillycomsourcemspimages748709.png.jpg)\n\
  \n图 6-5.运行时，代码递增计数器并显示下一次执行的结果。\n\n同样再次发生。`count` 变量递增，求值 `while` 条件。`count` 的值仍然小于\
  \ 3，因此大括号内的代码再次运行，显示另一个类似于 图 6-6 的对话框。\n\n![另一次运行后的计数变量。](img/httpatomoreillycomsourcemspimages748711.png.jpg)\n\
  \n图 6-6.另一次运行后的计数变量。\n\n反复尝试 `while` 和 `do...while` 语句，直到你熟悉它们之间的差异。\n\n# 使用 `for`\
  \ 循环\n\n`for` 循环的使用方式与 `while` 循环相似，即执行特定次数的代码。`for` 循环在 JavaScript 中有两个“兄弟”：`for...in`\
  \ 循环和 `for each...in` 循环。本节将检查这两种循环类型。\n\n## `for` 循环\n\n你使用 `for` 循环创建一个循环，其中条件以紧凑的形式进行初始化、求值和更改。这是一个示例：\n\
  \n```\nfor (var count = 0; count < 10; count++) {\n    // 在此处执行代码\n}\n```\n\n一个\
  \ `for` 语句在括号内有三个部分。第一个部分设置初始化表达式，如前面的示例所示：\n\n```\nvar count = 0;\n```\n\n`for`\
  \ 语句的下一个部分指定测试表达式，如示例所示：\n\n```\ncount < 10;\n```\n\n`for` 语句的最后一个部分通常用于递增计数器。在示例中，该表达式为：\n\
  \n```\ncount++\n```\n\n### 注意事项\n\n`for` 结构中的最后一个表达式不需要分号。\n\n这是一个你可以尝试的示例。它使用 `for`\
  \ 循环遍历数组。\n\n## 使用 `for` 循环处理数组\n\n1.  使用 Visual Studio、Eclipse 或其他编辑器编辑 Chapter6\
  \ 文件夹中的 `forloop.htm` 文件。\n\n2.  在页面中，将 TODO 注释替换为以下加粗代码（你可以在辅助内容的 `forloop.txt`\
  \ 文件中找到）：\n\n    ```\n    <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\
  \    \"http://www.w3.org/TR/html4/strict.dtd\">\n    <html>\n    <head>\n      \
  \  <title>For Loop Example</title>\n    </head>\n    <body>\n    <script type=\"\
  text/javascript\">\n\n    var myArray = [\"Vega\",\"Deneb\",\"Altair\"];\n    var\
  \ arrayLength = myArray.length;\n    for (var count = 0; count < arrayLength; count++\
  \ ) {\n        alert(myArray[count]);\n    }\n\n    </script>\n    </body>\n   \
  \ </html>\n    ```\n\n3.  保存页面并在浏览器中查看。你会收到三个连续的 `alert()` 对话框：\n\n    ![使用 for\
  \ 循环处理数组](img/httpatomoreillycomsourcemspimages748713.png.jpg)![使用 for 循环处理数组](img/httpatomoreillycomsourcemspimages748715.png.jpg)![使用\
  \ for 循环处理数组](img/httpatomoreillycomsourcemspimages748717.png.jpg)\n\n从对话框可以看出，代码遍历了\
  \ `myArray` 数组中的每个值。我想强调此示例中的某些代码。回顾 第 4 章，在该章学习了如何创建数组，JavaScript 中的数组通过从 0 开始的整数值进行索引。（这些知识稍后会很有用。）这是前面代码示例中的相关行：\n\
  \n```\nvar myArray = [\"Vega\",\"Deneb\",\"Altair\"];\n```\n\n代码创建了一个名为 `arrayLength`\
  \ 的变量并将其设置为数组的长度。获取 `myArray` 数组的长度说明了数组对象属性 *length* 的用法。（我将在第 8 章](#ch08.html\
  \ \"第 8 章 JavaScript 中的对象\") 中更深入解释对象）。在单独变量（如本例所示的 `arrayLength`）中获取长度而不是在 `for`\
  \ 循环中使用 *length* 属性可以提高性能。\n\n```\nvar arrayLength = myArray.length;\n```\n\n\n\n\
  \n`for` 循环首先创建并初始化 `count` 变量，接着检查 `count` 变量是否小于 `arrayLength` 变量设置的 `myArray`\
  \ 数组的长度。最后，它递增 `count` 变量的值。`for` 循环体内的代码显示一个警框（alert），使用 `count` 变量的值遍历 `myArray`\
  \ 数组的索引。代码如下：\n\n```\nfor (var count = 0; count < arrayLength; count++ ) {\n   \
  \ alert(myArray[count]);\n}\n```\n\n## `for...in` 循环\n\n`for...in` 循环遍历对象的属性，并返回属性名称本身。以下是一个示例：\n\
  \n```\nfor (var myProp in myObject) {\n     alert(myProp + \" = \" + myObject[myProp]);\n\
  }\n```\n\n在这段代码中，每次执行循环时，`myProp` 变量都会被设置为 `myObject` 的新属性。这是一个你可以尝试的更完整的示例。\n\n\
  ### 使用 `for...in` 循环\n\n1. 使用 Visual Studio、Eclipse 或其他编辑器，编辑第 06 章示例文件文件夹中的 `forinloop.htm`\
  \ 文件（你可以在附带内容中找到它）。\n2. 在页面中，将 TO DO 注释替换为下方加粗所示的代码（代码位于附带内容中的 `forinloop.txt` 文件中）：\n\
  \n    ```\n    <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n    \"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n    <html\n    <head>\n        <title>For In Loop Example</title>\n    </head>\n\
  \    <body>    <script type=\"text/javascript\">\n        var star = new Object;\n\
  \n        star.name = \"Polaris\";\n        star.type = \"Double/Cepheid\";\n  \
  \      star.constellation = \"Ursa Minor\";\n\n        for (var starProp in star)\
  \ {\n            alert(starProp + \" = \" + star[starProp]);\n        }\n    </script>\n\
  \n    </body>\n    </html>\n    ```\n\n3. 保存文件并在浏览器中查看。你会收到三个对话框：\n\n![Using a for...in\
  \ loop](img/httpatomoreillycomsourcemspimages748719.png.jpg)![Using a for...in loop](img/httpatomoreillycomsourcemspimages748721.png.jpg)![Using\
  \ a for...in loop](img/httpatomoreillycomsourcemspimages748723.png.jpg)\n\n从示例代码中可以看出，变量\
  \ `starProp` 接收的是属性的名称，而将 `starProp` 作为 `star` 对象的索引则会得到该属性的值。\n\n### 提示\n\n你有时会看到\
  \ `for...in` 循环用于遍历数组，这与你在上一节中看到的使用方式非常相似。然而，使用 `for...in` 遍历数组可能会产生参差不齐的结果。这种方法较明显的问题之一是，`for...in`\
  \ 循环不会按特定顺序返回属性。这种行为可能会带来麻烦，尤其是当你想要用 JavaScript 向网页写入文本时！这里的关键点是，当你想要遍历一个简单数组时，请使用\
  \ `for` 循环而不是 `for...in` 循环。\n\n## `for each...in` 循环\n\nJavaScript 中一个较新的结构是 `for\
  \ each...in` 循环。因为它是新的，这种结构尚未被所有浏览器支持——特别是，它不支持 Internet Explorer 8 及更早版本。不过，它在\
  \ Firefox 2.0 及更高版本中是被支持。\n\n`for...in` 结构返回属性的名称，而 `for each...in` 循环返回属性的值。语法上基本相同，但增加了\
  \ `each` 单词：\n\n```\nfor each (var myValue in myObject) {\n    alert(myValue \"\
  \ is in the object.\");\n}\n```\n\n将较早示例中的 `for...in` 循环替换为 `for each...in` 循环将得到以下代码。新代码已加粗显示。（更新后的文件位于附带内容中的\
  \ `foreach.htm` 文件。）\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \ \"http://www.w3.org/TR/html4/strict.dtd\">\n<html\n<head>\n    <title>For Each\
  \ In Loop Example</title>\n</head>\n<<body>\n<script type=\"text/javascript\">\n\
  \n    var star = new Object;\n\n    star.name = \"Polaris\";\n    star.type = \"\
  Double/Cepheid\";\n    star.constellation = \"Ursa Minor\";\n\n    for each (var\
  \ starValue in star) {\n        alert(starValue + \" is in the star object.\");\n\
  \    }\n</script>\n\n</body>\n</html>\n```\n\n当你在 Internet Explorer 中查看页面时，你会看到错误屏幕（可能只是一个空白屏幕）。然而，在\
  \ Firefox 3.0 中查看页面会显示出正确的行为。图 6-7 显示了三个对话框之一。\n\n![Figure 6-7. Iterating through\
  \ an object using the for each...in loop.](img/httpatomoreillycomsourcemspimages748725.png)\n\
  \n`for each...in` 循环\n\n你有时看到 `for...in` 循环用于遍历数组，这与你在上一节中看到的使用方式非常相似。然而，使用 `for...in`\
  \ 遍历数组可能会产生参差不齐的结果。这种方法较明显的问题之一是，`for...in` 循环不会按特定顺序返回属性。这种行为可能会带来麻烦，尤其是当你想要用 JavaScript\
  \ 向网页写入文本时！这里的关键点是，当你想要遍历一个简单数组时，请使用 `for` 循环而不是 `for...in` 循环。\n\n`for each...in`\
  \ 循环\n\nJavaScript 中一个较新的结构是 `for each...in` 循环。因为它是新的，这种结构尚未被所有浏览器支持——特别是，它不支持\
  \ Internet Explorer 8 及更早版本。不过，它在 Firefox 2.0 及更高版本中是被支持。\n\n`for...in` 结构返回属性的名称，而\
  \ `for each...in` 循环返回属性的值。语法上基本相同，但增加了 `each` 单词：\n\n```\nfor each (var myValue\
  \ in myObject) {\n    alert(myValue \" is in the object.\");\n}\n```\n\n将较早示例中的\
  \ `for...in` 循环替换为 `for each...in` 循环将得到以下代码。新代码已加粗显示。（更新后的文件位于附带内容中的 `foreach.htm`\
  \ 文件。）\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\" \"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html\n<head>\n    <title>For Each In Loop Example</title>\n</head>\n<<body>\n\
  <script type=\"text/javascript\">\n\n    var star = new Object;\n\n    star.name\
  \ = \"Polaris\";\n    star.type = \"Double/Cepheid\";\n    star.constellation =\
  \ \"Ursa Minor\";\n\n    for each (var starValue in star) {\n        alert(starValue\
  \ + \" is in the star object.\");\n    }\n</script>\n\n</body>\n</html>\n```\n\n\
  当你在 Internet Explorer 中查看页面时，你会看到错误屏幕（可能只是一个空白屏幕）。然而，在 Firefox 3.0 中查看页面会显示出正确的行为。图\
  \ 6-7 显示了三个对话框之一。\n\n![Figure 6-7. Iterating through an object using the for each...in\
  \ loop.](img/httpatomoreillycomsourcemspimages748725.png)\n\n\n\n\n你创建了一个基础网络表单，使用\
  \ JavaScript 访问该表单，并使用条件语句根据用户输入执行操作。如果这个示例中使用的所有内容尚未完全理解，请担心。该示例的主要目标只是为你在本章中学习的条件语句提供一些背景。\n\
  \n第 7 章探讨了在 JavaScript 中使用函数。第 14 章中的第一个示例展示了如何编写 JavaScript 验证代码，以确保必填字段已填写。\n\n\
  # 练习题\n\n| 1. | 使用 `prompt()` 函数收集人的姓名。使用 `switch` 语句执行一个对话框：如果输入的姓名是你的，则显示短语“欢迎\
  \ *<输入的名字>*”；如果输入的姓名是 `Steve`，则显示“请离开”；对于所有其他情况，显示“请稍后再来 *<输入的名字>*”。 |\n| 2. | 使用\
  \ `prompt()` 函数收集访问者输入的当前温度作为输入。如果输入的温度高于 `100`，告诉访问者降温。如果温度低于 `20`，告诉访问者保暖。 |\n\
  | 3. | 使用三元运算符完成与练习 2 相同的任务。 |\n| 4. | 使用 `for` 循环从 `1` 计数到 `100`。当数字为 `99` 时，显示一个警告对话框。\
  \ |\n| 5. | 使用 `while` 循环完成练习 4 中描述的任务。 |\n\n# 第 7 章.函数操作\n\n**读完本章后，你将能够：**\n\n\
  * 理解 JavaScript 中函数的用途。\n* 定义你自己的函数。\n* 调用函数并从它们接收返回的数据。\n* 理解 JavaScript 中的一些内置函数。\n\
  \n# 函数中包含什么？\n\nJavaScript 函数是语句的集合，可以是命名的，也可以是未命名的（匿名的），可以在 JavaScript 程序的其他地方调用。函数可以接受参数，即传递给函数的输入值。在函数内部，这些传递给函数的参数可以被处理，并将结果通过\
  \ `return` 值返回给函数的调用者。\n\n当你有某些需要在程序中多次执行的操作时，函数是完美的选择。与其多次定义相同的代码，你可以使用一个函数（这实际上就像程序内部的一个微程序）来执行该操作。即使你在程序各处拥有非常相似但并不完全相同的代码片段，你可能可以将它们抽象成单个函数。\n\
  \n抽象相似代码的一个很好的例子是使用函数来验证必填表单字段已填写。你可以编写 JavaScript 代码来验证表单中的每个单独命名字段，也可以使用函数。第 14\
  \ 章展示了构建特定函数并对其进行抽象的示例。\n\n你已经通过前面几章中的示例看到函数的运行方式了。函数用关键字 `function` 定义，后面通常跟随着函数名，然后是包含可选参数或参数的圆括号。使用大括号包围要作为函数一部分执行的语句：\n\
  \n```\nfunction functionName() {\n    // 语句写在这里；\n}\n```\n\n### 提示\n\n需要注意的是，当定义一个函数时（你可以在前面的基础函数定义中看到这一点），在函数被调用之前，该代码并不会实际执行。你将在本章稍后的部分看到如何调用函数。\n\
  \n## 函数参数\n\n将传递给函数的参数放在函数定义的括号内。这里有一个使用函数参数的简要示例：\n\n```\nfunction myFunction(argument1,\
  \ argument2, ..., argumentN) {\n\n}\n```\n\n这是一个带有两个参数的示例：\n\n``````\nfunction myFunction(argument1,\
  \ argument2) {\n    // 执行某些操作\n\n}\n```\n\n调用（或触发）函数非常简单：\n\n```\nmyFunction(val1,val2);\n\
  ```\n\nJavaScript（ECMA-262 规范）与其他语言的区别在于，在 JavaScript 中，你不需要指定传递给函数的参数数量，传递的参数数量也不需要与函数定义中定义的数量匹配。当调用时，函数会被赋予一个名为\
  \ `arguments` 的对象（作用类似于数组）。`Arguments` 存储了发送到参数，当你不知道发送的参数数量时，这非常有帮助。以下是其工作原理的示例（你可以在配套内容的\
  \ `functionbasics.txt` 节中找到这段代码）：\n\n```\nfunction myFunction() {\n    var firstArg\
  \ = arguments[0];\n    var secondArg = arguments[1];\n}\n```\n\n更好的是，你可以获取 `arguments`\
  \ 对象的长度并遍历每个参数，如下所示（同样在配套内容的 `functionbasics.txt` 文件中）：\n\n```function\nfunction\
  \ myFunction() {\n\n    var argLength = arguments.length;\n    for (var i = 0; i\
  \ < argLength; i++) {\n    // 对每个参数 (i) 执行某些操作\n    }\n}\n```\n\n这是一个更完整的示例，显示了简单使用\
  \ `arguments` 对象的结果（在 `functionexample.htm` 文件中）：\n\n```html\n<!DOCTYPE HTML PUBLIC\
  \ \"-//W3C//DTD HTML 4.01//EN\" \"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n\
  <head>\n    <title>Arguments Array</title>\n</head>\n<body>\n<script type=\"text/javascript\"\
  >\nfunction myFunction() {\n    var firstArg = arguments[0];\n    var secondArg\
  \ = arguments[1];\n    alert(\"firstArg is: \" + firstArg);\n    alert(\"secondArg\
  \ is: \" + secondArg);\n}\nmyFunction(\"hello\",\"world\");\n</script>\n</body>\n\
  </html>\n```\n\n当代码执行时，它会显示两个警报框，如图图 7-1 和图 7-2 所示。\n\n![Using the arguments object\
  \ within a function to access the first argument.](img/httpatomoreillycomsourcemspimages748735.png.jpg)\n\
  \n图 7-1. 在函数内部使用 `arguments` 对象来访问第一个参数。\n\n![Using the arguments object within\
  \ a function to access the second argument.](img/httpatomoreillycomsourcemspimages748737.png.jpg)\n\
  \n\n\n图 7-2. 在函数内部使用 `arguments` 对象来访问第二个参数。\n\n通过这样使用 `arguments` 对象，你可以推适用于任意数量的参数，而不只是此示例所示的两个。\n\
  \n## 重温变量作用域\n\n函数参数通常是变量名，不应该与调用函数时使用的变量同名。我故意使用“不应该”而不是“不要”，因为你*可以*在函数中的变量和函数调用的变量中使用相同的名称，但正如你将学到的那样，这样做可能会产生一些混淆的代码和混乱的作用域。\n\
  \n第 4 章包含一个关于变量作用域的章节，其中一个处理函数内部和外部作用域的练习。来自第 4 章中变量作用域示例之一的相关代码（在配套内容的 `scoping\
  \ revisit.txt` 文件中重复）如下：\n\n\n\n\n\n```html\n<head>\n    <title>Scoping Example</title>\n\
  \    <script type=\"text/javascript\">\n    var aNewVariable = \"is global.\";\n\
  \    function doSomething(incomingBits) {\n        alert(\"Global variable within\
  \ the function: \" + aNewVariable);\n        alert(\"Local variable within the function:\
  \ \" + incomingBits);\n    }\n\n    </script>\n\n</head>\n<body><script type=\"\
  text/javascript\">\n\n    doSomething(\"is a local variable\");\n    alert(\"Global\
  \ var outside the function: \" + aNewVariable);\n    alert(\"Local var outside the\
  \ function: \" + incomingBits);\n\n</script>\n</body>\n</html>\n```\n\n这个这个示例展示了你如何在函数内部和外部全局或局部地声明和作用域变量。然而，该示例在逻辑上保持了变量的独立，因为它没有使用相同的变量名，然后又改变变量的值。这里是一个示例，使用相同的变量名可能会引起混淆。我发现多年前编写的代码即使不引入奇怪的作用域问题，已经足够让人困惑了，因此请尽量避免此类代码：\n\
  \n```\nfunction addNumbers() {\n    firstNum = 4;\n    secondNum = 8;\n    result\
  \ = firstNum + secondNum;\n    return result;\n}\nresult = 0;\nsum = addNumbers();\n\
  ```\n\n你可能已经发现了这段代码的问题。到处都缺少了 `var` 关键字。尽管在函数外部显式地初始化 `result` 变量为 `0`，但该变量通过调用\
  \ `addNumbers()` 函数被修改了。这反过来将 `result` 变量修改为 `12`，即函数内部 `4` 和 `8` 相加的结果。\n\n如果你在\
  \ `result` 变量初始化之后添加一个 `alert` 来显示它，警报将显示 `0`。如果你在调用 `addNumbers()` 函数后添加另一个 `alert`\
  \ 来显示 `result` 变量，结果将显示 `12`。我将在稍后的练习中让你自己在正确的位置添加这些警报。\n\n底是，当你对函数内部外部的变量使用不同的名称，并始终使用\
  \ `var` 关键字初始化变量时，你的生活会变得更容易。取决于函数中包含的代码，函数可能也可能没有返回值。正如你在下一节中看到的，那个 `return` 值会被传回给调用者。\n\
  \n## 返回值\n\n当函数执行完其代码时，它可以使用 `return` 关键字向调用者返回一个值。查看 示例 7-1（在配套内容的 `listing7-1.txt`\
  \ 文件中）。\n\n示例 7-1. 一个简单的返回值示例。\n\n```\nfunction multiplyNums(x) {\n    return x\
  \ * 2;\n}\nvar theNumber = 10;\nvar result = multiplyNums(theNumber);\nalert(result);\n\
  ```\n\n示例 7-1 创建了一个名为 `multiplyNums` 的函数，并有一个预期的输入值，该值将被赋值给变量 `x`。该函数执行一个任务：返回其参数乘以\
  \ `2` 的结果，如下：\n\n```\nfunction multiplyNums(x) {\n    return x * 2;\n}\n```\n\n\
  然后，代码创建了一个名为 `theNumber` 的变量，如下：\n\n```\nvar theNumber = 10;\n```\n\n接下来，代码创建了另一个变量\
  \ `result`。该变量持有调用 `multiplyNums` 函数产生的结果。`multiplyNums` 函数使用变量 `theNumber` 作为参数：\n\
  \n```\nvar result = multiplyNums(theNumber);\n```\n\n运行时，该代码会弹出一个对话框，如 图 7-3 所示。\n\
  \n![此警报显示了函数调用的返回值。](img/httpatomoreillycomsourcemspimages748739.png.jpg)\n\n图 7-3.\
  \ 此警报显示了函数调用的返回值。\n\n你可以将返回值放在函数内的任何位置，而不是末尾。在条件语句或循环之后使用 `return` 是常见的，如下所示（你可以在配套内容的\
  \ `morereturnexamples.txt` 文件中找到它）：\n\n```\nfunction myFunction(x) {\n    if (x\
  \ == 1) {\n        return true;\n    } else {\n        return false;\n    }\n}\n\
  ```\n\n不过，请小心放置 `return` 语句的位置，因为当函数执行到 `return` 语句时，函数会立即返回，不会执行之后的任何代码。例如，像这样的代码（你可以在配套内容的\
  \ `morereturnexamples.txt` 文件中找到它）可能不会按照你的意图执行：\n\n```\nfunction myFunction() {\n\
  \    var count = 0;\n    var firstNum = 48;\n    return;\n    var secondNum = 109;\n\
  }\n```\n\n这段代码永远到达变量 `secondNum` 的初始化。\n\n## 关于调用函数\n\n你几乎总是带有某些参数调用函数，或者带有空括号，如下所示：\n\
  \n```\nvar result = orderFruit();\n```\n\n如果该函数需要参数，它可能看起来像这样：\n\n```\nvar result\
  \ = orderFruit(quantity);\n```\n\n省略调用函数时的括号会导致返回函数名，而不是函数本应返回的任何内容。这里有一个示例——你可以在配套内容的\
  \ `listing7-2.htm` 文件中找到它——展示了一些基础 JavaScript 代码：\n\n```html\n<!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" >\n<head>\n    <title>点水果</title>\n\
  \    <script type=\"text/javascript\">\n    function orderFruit() {\n        var\
  \ total = 0;\n        // 调用另一个函数来下单\n        return total;\n    }\n    </script>\n\
  </head>\n<body>\n<script type=\"text/javascript\">\n    var result = orderFruit();\n\
  \    alert(\"总额是 \" + result);\n</script>\n</body>\n</html>\n```\n\n执行时，这段代码调用了\
  \ `orderFruit()` 函数。`orderFruit()` 函数调用另一个函数（未显示）来下单。随后，总额被计算并传回给调用者。像这样编写，代码运行正常并弹出一个对话框，如\
  \ 图 7-4 所示。\n\n![调用 orderFruit() 函数带括号会得到预期的结果。(httpatomoreillycomsourcemspimages748741.png.jpg)\n\
  \n图 7-4. 调用 `orderFruit()` 函数带括号会得到预期的结果。\n\n对代码进行微调——具体来说，去掉函数调用时的括号——会改变整个结果：\n\
  \n```\nvar result = orderFruit;\n```\n\n结果如 图 7-5 所示。\n\n调用 orderfruit 不带括号可能不符合你的预期。(httpatomoreillycomsourcemspimages748743.png)\n\
  \n图 7-5. 调用 *orderFruit* 不带括号可能不符合你的预期。\n\n## 匿名/未命名函数（函数字面量）\n\n你到为止看到的函数都是正式定义的。然而，JavaScript\
  \ 并不要求以这种方式正式定义函数。例如，使用函数字面量——也称为未命名或匿名函数——函数被定义并绑定到一个变量，如下：\n\n```\nvar divNums\
  \ = function(firstNum,secondNum) { return firstNum / secondNum; };\n```\n\n\n\n\n\
  \n你可以使用 `javascript:` 伪协议轻松地测试此功能。在浏览器的地址栏中输入以下代码：\n\n```\njavascript:var divNums\
  \ = function(firstNum,secondNum) { return firstNum / secondNum; };\nalert(divNums(8,2));\n\
  ```\n\n匿名函数在面向对象的 JavaScript 中被频繁使用，并作为事件的处理程序。你可以在第 8 章以及后续章节中看到这种用法的示例。\n\n##\
  \ 闭包\n\n在 JavaScript 中，嵌套函数可以访问外部函数的变量。`Closures`（闭包）指的是函数正常执行上下文之外的变量的存在。闭包通常意外创建，如果处理不当，可能会在\
  \ Windows Internet Explorer 中导致内存泄漏问题。然而，闭包是 JavaScript 强大（且高级）的领域之一。\n\n这是一个闭包的示例：\n\
  \n```\nfunction myFunction() {\n    var myNum = 10;\n    function showNum() {\n\
  \        alert(myNum);\n    }\n    return showNum();\n}\nvar callFunc = myFunction();\n\
  myFunction();\n```\n\n在这个示例中，函数 `showNum` 可以访问在外部函数（`myFunction`）中创建的变量 `myNum`。变量\
  \ `callFunc` 在全局范围内创建，包含对 `showNum` 函数的引用。当变量 `callFunc` 被创建时，它立即就可以访问 `myNum` 变量。\n\
  \n闭包可以用于模拟对象内部的私有方法，或其他用途，例如在事件处理程序中使用。闭包是 JavaScript 中强大且高级的概念之一，因此不适合在入门书中详述。你可以在\
  \ `[`msdn.microsoft.com/en-us/scriptjunkie/ff696765.aspx`](http://msdn.microsoft.com/en-us/scriptjunkie/ff696765.aspx)`\
  \ 以及互联网的其他地方找到更多关于闭包的信息。\n\n## 方法\n\n理解方法的简单方式是：它们是作为对象的一部分定义的函数。这虽然过于简化，但目前足够了。你通过使用点运算符（`.`）访问对象的方法。内置对象（例如\
  \ `Math`、`Date` 和 `String` 对象）都拥有你在书中见过（或很快就会看到）的方法。诸如 `alert()` 函数这样的函数实际上只是 `window`\
  \ 对象的方法，可以写成 `window.alert()` 而非仅仅是 `alert()`。第 8 章 详细地介绍了对象和方法。\n\n### 注意\n\n在书的大部分内容，我交替使用\
  \ `method`（方法）和 `function`（函数）这两个词。我会继续这样做，以便你更好地理解，对于大多数用途，两者之间的界限是模糊的。当以面向对象的方式使用时，使用\
  \ `method` 一词通常更清晰。当不直接以面向对象使用时——例如你使用 `alert()` 函数的方式——使用 `function` 一词是可以接受的。\n\
  \n## 定义自己的函数 vs 使用内置函数\n\n正如你在整书中看到的，JavaScript 拥有许多内置函数或方法。除了使用这些内置函数外，你经常发现自己在定义自己的函数。除了简单的脚本外，你编写的大多数脚本都会涉及你自己的函数。\n\
  \n但在某些情况下，你可能定义了一个函数，然后以后发现 JavaScript 已经有一个用途相同且同样优秀的内置函数。如果你发现某个 JavaScript 内置函数执行的任务与你自己的函数相同，那么使用\
  \ JavaScript 函数通常是更好的主意。\n\n# 查看对话框函数\n\n到目前，你已经熟悉了 JavaScript 中的 `alert()` 函数，因为你在之前的章节中已经看到了它的许多示例。你还学习了\
  \ `alert()` 函数只是 `window` 对象的一个方法。本节将介绍 JavaScript 中 `alert()` 函数的日常用法，以及 `window`\
  \ 对象的两个相关函数。\n\n## 更多信息\n\n`window` 对象足够重要，可以在第 9 章 中额外关注。该章节讨论了 `window` 对象的许多其他方法。\n\
  \n尽管 `window` 对象有几个方法，但现在我想强调这三个（我称之为函数）：`alert()`、`confirm()` 和 `prompt()`。因为你已经在书中看到了太多的\
  \ `alert()` 对话框，我在这里不会再包含一个（以后再感谢我）。第 6 章讨论了 `prompt()` 函数的使用，以及 Internet Explorer\
  \ 7 如何作为安全措施默认阻止它。不过，`confirm()` 函数在 Internet Explorer 中仍然可用。\n\n`confirm()` 函数显示一个带有两个按钮（确定和取消）的模态对话框，类似于图\
  \ 7-6 JavaScript 函数提供一个确认用户操作的对话框。\")所示。（模态对话框会在访问者关闭对话框之前阻止浏览器中的其他活动或点击——在这种情况下，通过点击确定或取消。）\n\
  \n![confirm() JavaScript 函数提供一个确认用户操作的对话框。](img/httpatomoreillycomsourspimages74875.png.jpg)\
  \ 图 7-6. `confirm()` JavaScript 函数提供一个确认用户操作的对话框。\n\n当你点击确定时，`confirm()` 函数返回 `true`。正如你猜的样，当你点击取消时，`confirm()`\
  \ 函数返回 `false`。\n\n像 `alert()` 和 `prompt()`一样，`confirm()` 函数在大多数平台上创建一个模态对话框。如果这些函数被过度使用或在错误的地方使用，可能会令人讨厌。但如果使用得当，提供重要的反馈，这些函数会非常有用。\n\
  \n### 提示\n\n不要使用 `confirm()` 函数代替 Web 表单来获取输入。Web 表单对于导航来说好得多，并且会让访问者更开心。\n\n下一个练习将引导你如何使用\
  \ `confirm()` 函数获取输入并据此做出决策。\n\n## 使用 `confirm()` 获取输入\n\n1.  使用 Visual Studio、Eclipse\
  \ 或编辑器，编辑配套内容中 `Chapter07` 示例文件夹中的 `confirm.htm` 文件。\n2.  在页面中，将 `TO DO` 注释替换为下所示的粗体代码（你可以在配套内容中的\
  \ `confirm.txt` 中找到这些代码）：\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\
  \n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n    <head>\n        <title>Confirming\
  \ Something</title>\n\n        <script type=\"text/javascript\">\n\n        function\
  \ processConfirm(answer) {\n            var result = \"\";\n            if (answer)\
  \ {\n                result = \"Excellent.  We'll play a nice game of chess.\";\n\
  \            } else {\n                result = \"Maybe later then.\";\n       \
  \     }\n            return result;\n        }\n        </script>\n    </head>\n\
  \    <body>\n    <script type=\"text/javascript\">\n\n    var confirmAnswer = confirm(\"\
  Shall we play a game?\");\n    var theAnswer = processConfirm(confirmAnswer);\n\
  \    alert(theAnswer);\n    </script>\n    </body>\n</html>\n```\n\n3.  保存页面并在网页浏览器中查看。你将看到一个像这样的对话框：\n\
  \n    ![Obtaining input with confirm()](img/httpatomoreillycomsourspimages74877.png.jpg)\n\
  \n4.  点击确定。你看到一个 `alert()` 对话框：\n\n    ![Obtaining input with confirm()](img/httpatomoreillycomsourspimages74879.png.jpg)\n\
  \n5.  点击确定，然后刷新页面。\n\n6.  你再次看到来自 `confirm()` 函数的原始对话框，询问你是否想玩游戏。这次点击取消。你看到的是一个不同的\
  \ `alert()` 对话框：\n\n    ![Obtaining input with confirm()](img/httpatomoreillycomsourspimages748751.png.jpg)\n\
  \n\n\n\n7. 点击“确定”关闭对话框。\n\n代码有两个主要的待检查区域，一个在 `<head>` 部分，另一个在 `<body>` 部分。函数 `processConfirm(answer)`\
  \ 创建在页面的 `<head>` 部分：\n\n```\nfunction processConfirm(answer) {\n    var result\
  \ = \"\";\n    if (answer) {\n        result = \"Excellent.  We'll play a nice game\
  \ of chess\";\n    } else {\n        result = \"Maybe later then.\";\n    }\n  \
  \  return result;\n}\n```\n\n该函数评估了存储在变量 `answer` get 参数中 get 包含的值。如果 `answer` 变量中的值评估为\
  \ `true`（当访问者点击“确定”时），函数将创建变量 `result` 并为 `result` 赋值字符串值“Excellent. We’ll play\
  \ a nice game of chess.”。但如果 `answer` 变量中的值评估为 `false`（当访问者点击“取消”时），函数仍然会创建 `result`\
  \ 变量，但现在将其赋值为“Maybe later then.”无论 `answer` 变量中持有什么内容，`processConfirm` 都会通过函数内部的\
  \ `return` 语句将 `result` 变量返回给调用者。你可以更简洁地编写此函数：\n\n```\nfunction processConfirm(answer)\
  \ {\n    if (answer) {\n        return \"Excellent.  We'll play a nice game of chess.\"\
  ;\n    } else {\n        return \"Maybe later then.\";\n    }\n}\n```\n\n甚至更简洁的写法：\n\
  \n```\nfunction processConfirm(answer) {\n    var result;\n    (answer) ? result\
  \ = \"Excellent.  We'll play a nice game of chess.\" : result = \"Maybe\nlater then.\"\
  ;\n    return result;\n}\n```\n\n### Note\n\n很大情况下，我会使用最后一个函数示例来执行此任务。然而，我发现许多程序员并不习惯最后一个示例中的三元逻辑。因此为了可读性，我会选择两者中更显式的一个：\n\
  \n```\nfunction processConfirm(answer) {\n    if (answer) {\n        return \"Excellent.\
  \  We'll play a nice game of chess.\";\n    } else {\n        return \"Maybe later\
  \ then.\";\n    }\n}\n```\n\n代码中 `<body>` 部分的 JavaScript 创建了确认对话框，调用了 `processConfirm()`\
  \ 函数并显示结果：\n\n```\nvar confirmAnswer = confirm(\"Shall we play a game?\");\nvar\
  \ theAnswer = processConfirm(confirmAnswer);\nalert(theAnswer);\n```\n\n与 `alert()`\
  \ 函数一样，`confirm()` 函数接受单个参数，即要在对话框中显示的消息。虽然对于 `alert()` 函数不是必须，但对于 `confirm()` 函数，将你的提示以问题形式或其他提供访问者选择的陈述形式是最好的。如果用户真的没有选择，请使用\
  \ `alert()` 函数。更简洁的版本将所有三行合并，如下：\n\n```\nalert(processConfirm(confirm(\"Shall we\
  \ play a game?\")));\n```\n\n# Exercises\n\n| 1. 定义一个接受一个数值参数的函数，增加该参数，然后返回给调用者。在页面的\
  \ <body> 中调用该函数并在屏幕上显示结果。 |\n\n| 2. 定义一个接受两个数值参数的函数。如果第一个参数的值大于第二个参数，向访问者显示 alert。如果第一个参数的值小于或等于第二个参数，返回两个参数的和。\
  \ |\n\n| 3. 在以下代码中添加适当的 `alert()` 函数，以便你在函数调用前后看到 `result` 变量中的值。代码如下： |\n\n```\n\
  function addNumbers() {\n    firstNum = 4;\n    secondNum = 8;\n    result = firstNum\
  \ + secondNum;\n    return result;\n}\nresult = 0;\nresult = addNumbers();\n```\
