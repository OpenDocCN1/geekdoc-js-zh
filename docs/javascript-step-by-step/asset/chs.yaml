  \ `alert()` 对话框。\n\n# 练习题\n\n| 1. | 创建一个 Web 表单，根据选择框输入类型显示 `alert()` 对话框。 |\n|\
  \ 2. | 在本章之前看到的披萨表单练习中添加一组单选按钮，以接受三种披萨尺寸：小、中、大。将结果与披萨订单的结果一一起显示。 |\n| 3. | 重新设计披萨订单系统，添加原始披萨示例中的按钮，允许接单员选择蔬菜特餐、肉类特餐或夏威夷披萨类型。这些按钮随后应为制作的特定类型披萨选择正确的配料复选框。对于蔬菜特餐披萨，选择绿椒、蘑菇和洋葱。对于肉类特餐，选择香肠、意大利肠和火腿；对于夏威夷披萨，选择菠萝和火腿。\
  \ |\n\n# 第 15 章. JavaScript 和 CSS\n\n**阅读本章后，你将能够：**\n\n* 理解级联样式表 (CSS) 的基础。\n*\
  \ 理解 JavaScript 和 CSS 之间的关系。\n* 使用 JavaScript 更改单个元素的样式。\n* 使用 JavaScript 更改一组元素的样式。\n\
  * 使用 JavaScript 使用 CSS 为 Web 表单提供视觉反馈。\n\n## 什么是 CSS？\n\n使用 CSS，你可以指定网页的外观和感受：你可以对页面的元素应用颜色、字体和布局。\n\
  \n图 15-1 显示了一个基础网页。它看起来相当无聊——至少布局是这样。\n\n![一个未应用样式的基础网页。](img/httpatomoreillycomsourcemspimages748891.png.jpg)\n\
  \n图 15-1。一个未应用样式的基础网页。\n\n通过使用 CSS，你可以在不更改页面内容的情况下改进图 15-1 中的页面外观，例如，更改标题的字体并使用某些粗体文本标记强调页面的特定部分，如图\
  \ 15-2 所示。\n\n![应用了 CSS 样式的相同网页。](img/httpatomoreillycomsourcemspimages748893.png.jpg)\n\
  \n图 15-2. 对图 15-1 中的相同网页应用了 CSS 样式。\n\n## 使用属性和选择器\n\nCSS 的基本结构是列出 CSS 属性名称后跟冒号，然后是该属性的值，例如：\n\
  \n```\nproperty: value\n```\n\n`style` 属性是可以设置的许多不同属性之一。在图 15-2 中，例如，将 `font-weight`\
  \ 属性将第二行改为粗体。你可以在万网联盟 (W3C) 网站上找到属性及其接受值的完整列表：*[`www.w3.org/TR/CSS21/propidx.html`](http://www.w3.org/TR/CSS21/propidx.html)*。\n\
  \n你可以根据元素类型（`<p>`、`<h1>`、`<a>` 等对一组元素应用 CSS，或者通过指定元素的 `class` 或 `id` 属性对单个元素应用 CSS。这些分组统称为\
  \ `选择器`。\n\n选择器告诉 CSS 指定的属性和值适用于哪些元素。带有选择器的 CSS 语句的基本结构如下：\n\n```\nselector { property:\
  \ value; }\n```\n\n例如，对 `<h1>` 元素应用 Arial 字体的代码（参见配套文件 ex1.css）：\n\n```\nh1 { font-family:\
  \ arial; }\n```\n\n\n\n\n你可以通过 `id` 属性获得更细粒度的控制，它允许你根据特定的 ID 选择某个特定元素并对其应用样式，正如图\
  \ 15-2 示例所示的那样。文本 *“JavaScript Step by Step 是由 Steve Suehring 编写的书，由 Microsoft Press\
  \ 出版”*  own 文本 *“该书强调了基于标准的 JavaScript，它可以通过不同的浏览器在多个平台上运行”* 这两段文本都被包含在 `<p>` 元素中。然而，第一句被赋予了\
  \ `tagline` 的 ID，这允许它通过 CSS 设为粗体字体。\n\n以下是超文本标记语言 (HTML)：\n\n```\n<p id=\"tagline\"\
  >JavaScript Step by Step is a book by Steve Suehring, published by Microsoft\nPress.</p>\n\
  ```\n\n以及 CSS（在随性内容的 `ex2.css` 文件中）：\n\n```css\n#tagline { font-weight: bold; }\n\
  ```\n\n注意，单独 ID 选择器以哈号 (#) 开头。\n\n## 应用 CSS\n\n有多种方法可以使用 CSS 为文档应用样式。你可以：\n\n* \
  \  直接在 HTML 元素内部对其应用样式。\n*   在文档的 `<head>` 部分包含一个 `<style>` 元素。\n*   链接到外部文件中的 CSS，这与你在外部文件中链接\
  \ JavaScript 的方式非常相似。\n\n到目前为止，最好的方法是使用外部 CSS 文件——就像 JavaScript 的最佳实践是使用外部 JavaScript\
  \ 文件一样。使用 CSS 提高了可重用性并极大简化了网站的持续维护。假设你管理着一个拥有数百个页面的网站，你的老板打电话告诉你，公司的新设计要求更改页面标题的字体。如果网站使用公共外部\
  \ CSS 文件，更改将是快速且简单的，你只需要修改单个文件即可完成更改。如果 CSS 包含在每个文档中，这种更改可能会非常耗时。\n\nCSS 的主题包含的内容比一本\
  \ JavaScript 书实际能涵盖的要得多。如果你对 CSS 不熟悉并想了解更多信息，可以在微软网站上的“CSS 概览与教程”页面（[`msdn.microsoft.com/en-us/library/ms531212.aspx`](http://msdn.microsoft.com/en-us/library/ms531212.aspx)）找到更多信息。\n\
  \n## JavaScript 与 CSS 的关系\n\n你可以使用 JavaScript 通过文档对象模型 (DOM) 2 动态操作许多文档样式（你早些在 第\
  \ 11 章 中遇到过）。通过 DOM，你可以根据标签名或 ID 获取元素，然后设置该元素的 `style` 属性。\n\n例如，图 15-1` 所示的标题文本包含在\
  \ `<h1>` 元素中。如果你给该 `<h1>` 元素指定一个描述性的 ID，例如 `heading`，你就可以使用 JavaScript 的 `getElementById()`\
  \ 方法来获取它。然后你使用元素的 `style` 属性来获取一个 `style` 对象，这是 JavaScript 更改元素样式的方式。这是一个更改样式以使用不同字体的示例：\n\
  \n```javascript\nvar heading = document.getElementById(\"heading\");\nheading.style.fontFamily\
  \ = \"arial\";\n```\n\n## 通过 ID 设置元素样式\n\n正如你所看到的，使用 `getElementById()` 和 `style`\
  \ 对象为元素设置样式是更改样式的一种简单且有效的方法。你使用它们的 JavaScript 样式名称单独设置样式，该名称通常与相应的 CSS 属性相似，但不总是相同。在\
  \ JavaScript 中，当属性是单个单词时（如 `margin`），样式属性名通常与官方 CSS 样式名相同；但当 CSS 属性是带连字符的单词时（如 `text-align`），属性名变为\
  \ `textAlign`。注意连字符被删除了，并使用大写字母分隔名称中的主词和从词。这种拼写属性名的方式被称为驼峰命名法 (`camelCase`).\n\n\
  表 15-1` 显示了选定的 CSS 属性及其 JavaScript 对应项。\n\n表 15-1. CSS 和 JavaScript 属性对比\n\n| CSS\
  \ 属性 | JavaScript 属性 |\n| --- | --- |\n| `background` | `background` |\n| `background-attachment`\
  \ | `backgroundAttachment` |\n| `background-color` | `backgroundColor` |\n| `background-image`\
  \ | `backgroundImage` |\n| `background-repeat` | `backgroundRepeat` |\n| `border`\
  \ | `border` |\n| `border-color` | `borderColor` |\n| `color` | `color` |\n| `font-family`\
  \ | `fontFamily` |\n| `font-size` | `fontSize` |\n| `font-weight` | `fontWeight`\
  \ |\n| `height` | `height` |\n| `left` | `left` |\n| `list-style` | `listStyle`\
  \ |\n| `list-style-image` | `listStyleImage` |\n| `margin` | `margin` |\n| `margin-bottom`\
  \ | `marginBottom` |\n| `margin-left` | `marginLeft` |\n| `margin-right` | `marginRight`\
  \ |\n| `margin-top` | `marginTop` |\n| `padding` | `padding` |\n| `padding-bottom`\
  \ | `paddingBottom` |\n| `padding-left` | `paddingLeft` |\n| `padding-right` | `paddingRight`\
  \ |\n| `padding-top` | `paddingTop` |\n| `position` | `position` |\n| `float` |\
  \ `float` |\n| `text-align` | `textAlign` |\n| `top` | `top` |\n| `visibility` |\
  \ `visibility` |\n| `width` | `width` |\n\nJavaScript 的一种用途是验证表单输入。使用 CSS 和 JavaScript\
  \ 可以帮助你避免 `alert()` 对话框，而是直接在页面上提供视觉反馈。下一个练习将展示如何实现这种功能。\n\n### 使用 CSS 和 JavaScript\
  \ 进行表单验证\n\n1. 使用 Visual Studio、Eclipse 或其他编辑器编辑 1 性 文件夹中的 `form.html` 文件。\n2. 在该页面中，将\
  \ TODO 注释替换为此处所示粗体 HTML（你可以在随性内容的 `form.txt` 文件中找到代码）：\n\n```html\n<!DOCTYPE HTML\
  \ PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>表单验证</title>\n</head>\n<body>\n<form name=\"formexample\"\
  \ id=\"formexample\" action=\"#\">\n<div id=\"citydiv\">City: <input id=\"city\"\
  \ name=\"city\"></div>\n<div><input id=\"submit\" type=\"submit\"></div>\n</form>\n\
  </body>\n</html>\n```\n3. 在网络浏览器中查看页面。页面看起来应该是这样的：\n   ![使用 CSS 和 JavaScript 进行表单验证](img/httpatomoreillycomsourcemspimages748895.png.jpg)\n\
  4. 在保存 form.html 文件的文件夹中 JavaScript 源文件。将此新 JavaScript 文件命名为 `form.js`。\n5. 在 `form.js`\
  \ 中放置以下代码。如果你喜欢，可以将验证 `cityField` 的值改为 Stevens Point 以外的城市（我的家乡）。保存文件。\n\n```javascript\n\
  function checkValid(eventObj) {\n    var cityField = document.forms[0][\"city\"\
  ];\n    if (cityField.value != \"Stevens Point\") {\n        var cityDiv = document.getElementById(\"\
  citydiv\");\n        cityDiv.style.fontWeight = \"bold\";\n        cityDiv.style.border\
  \ = \"1px solid black\";\n        if (eventObj.preventDefault) {\n            eventObj.preventDefault();\n\
  \        } else {\n            window.event.returnValue = false;\n        }\n  \
  \      return false;\n    } else {\n        return true;\n    }\n}\n```\n6. 重新打开\
  \ `form.html` 并对其修改以添加对外部 JavaScript 文件的引用，并为文档添加 `submit` 事件。form.html 文件应所示（我用粗体高亮了更改）：\n\
  \n\n\n\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>Form Validation</title>\n<script type=\"text/javascript\"\
  \ src=\"ehandler.js\"></script>\n<script type=\"text/javascript\" src=\"form.js\"\
  ></script>\n</head>\n<body>\n<form name=\"formexample\" id=\"formexample\" action=\"\
  #\">\n<div id=\"citydiv\">City: <input id=\"city\" name=\"city\"></div\n<div><input\
  \ id=\"submit\" type=\"submit\"></div>\n</form>\n<script type=\"text/javascript\"\
  >\nvar formEl = document.getElementsByTagName(\"form\")[0];\nEHandler.add(formEl,\"\
  submit\", function(eventObj) { checkValid(eventObj); } );\n</script>\n</body>\n\
  </html>\n```\n\n7. 在你的浏览器中重新加载 `form.html`。在 `City` 文本字段中输入单词 `test` 并点击 `Submit\
  \ Query`。你应该会立即看到标签 `City` 变为粗体，并且 `div` 周围添加了边框。\n\n8. 将 `City` 文本字段的输入改为 `Stevens\
  \ Point`（或你在步骤 5 中使用的任何值）并点击 `Submit Query`。背景发生了变化，且字段变为空。这是因为表单继续沿其提交路径运行（在这种情况下表单没有执行任何操作）。\n\
  \n此示例使用的代码仅仅是书中之前使用的代码的变体，增加了一个外部 JavaScript 文件来执行验证并通过 CSS 提供反馈。外部 JavaScript 文件内部是验证代码，它首先从表单中获取\
  \ `text field`（文本字段）对象。接着，检查该字段以其值是否匹配 `Stevens Point`。如果值不是 `Stevens Point`，代码会将文本字段的\
  \ `font-weight` 样式属性更改为粗体，并添加 `border` 属性。\n\n这种方法的问题在于，元素的 CSS 样式现在被设置在 JavaScript\
  \ 代码中。当将标记、样式和行为分离时，维护起来要容易得多。你可以通过使用元素类型选择器设置样式来改进此示例，或者通过在 CSS 中创建一个通用的错误类，然后使用\
  \ JavaScript 代码应用该错误类。接下来的章节将逐一检查这些方法。\n\n## 按类型设置元素样式\n\n虽然通过 ID 设置元素样式是 JavaScript\
  \ 中更改样式的常用方法，但你可能也会发现必要对特定类型的所有元素设置属性。\n\n回想本章早些显示的截图，特别是图 15-2。示例 15-1` 显示了该页的\
  \ HTML。\n\n示例 15-1。图 15-2 的 HTML。\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML\
  \ 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n<title>JavaScript\
  \ Step by Step</title>\n<style type=\"text/css\">\nh1 { font-family: arial; }\n\
  #tagline { font-weight: bold; }\n</style>\n</head>\n<body>\n<h1 id=\"heading\">JavaScript\
  \ Step by Step</h1>\n<p id=\"tagline\">JavaScript Step by Step is a book by Steve\
  \ Suehring,\npublished by Microsoft Press.</p>\n<p>该书强调基于标准的 JavaScript，它可以通过不同的浏览器运行在多个平台上。</p>\n\
  </body>\n</html>\n```\n\n注意示例 15-1` 中的两个 `<p>` 元素。第一个 `<p>` 元素被应用了样式 `font-weight:\
  \ bold`。你可以使用 JavaScript 为所有 `<p>` 元素应用额外的样式。考虑示例 15-2 中的代码，它添加了一些 JavaScript 代码（以粗体类型显示）来更改\
  \ `<p>` 元素的字体族。\n\n示例 15-2。使用 JavaScript 加 HTML 更改元素样式。\n\n```\n<!DOCTYPE HTML PUBLIC\
  \ \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n\
  <head>\n<title>JavaScript Step by Step</title>\n<style type=\"text/css\">\nh1 {\
  \ font-family: arial; }\n#tagline { font-weight: bold; }\n</style>\n</head>\n<body>\n\
  <h1 id=\"heading\">JavaScript Step by Step</h1>\n<p id=\"tagline\">JavaScript Step\
  \ by Step is a book by Steve Suehring, published by\nMicrosoft Press.</p>\n<p>该书强调基于标准的\
  \ JavaScript，它可以通过不同的浏览器运行在多个平台上。</p>\n<script type=\"text/javascript\">\nvar pElements\
  \ = document.getElementsByTagName(\"p\");\nfor (var i = 0; i < pElements.length;\
  \ i++) {\n    pElements[i].style.fontFamily = \"arial\";\n}\n</script>\n</body>\n\
  </html>\n```\n\n在 Web 浏览器中查看时，页面显示两个 `<p>` 元素都是 Arial 字体，如图 15-3 所示。\n\n此示例使用的 JavaScript\
  \ 相当简单，因为它使用了你在整本书中见过的函数。首先，它使用 DOM 的 `getElementsByTagName()` 方法获取 `<p>` 元素并将其存储在名为\
  \ `pElements` 的变量中。然后，它使用 `for` 循环遍历 `pElements` 列表，将每个元素的 `style.fontFamily` 属性更改为\
  \ Arial。\n\n## 使用 JavaScript 设置 CSS 类\n\n为了将内容和标记与样式（CSS）以及行为（JavaScript）分离的开发指南，更改元素样式的更好的解决方案是在\
  \ CSS 中创建一个类，并在必要时使用 JavaScript 应用该类，而不是使用 JavaScript 更改 `font-weight` 和 `size`\
  \ 等特定属性。本节展示了如何向元素添加和移除 CSS 类。\n\n回想如下创建一个 CSS 类：\n\n```\n.errorClass {\n    font-weight:\
  \ bold;\n    border: 1px solid black;\n}\n```\n\n你可以通过 `className` 属性使用 JavaScript\
  \ 应用该类：\n\n```javascript\nvar tagLineElement = document.getElementById(\"tagline\"\
  );\ntagLineElement.className += \"errorClass\";\n```\n\n注意此代码中使用 `+=` 运算符。该运算符会将类**添加**到元素可能已经拥有的任何类中，而不是**覆盖**已经应用的类\n\
  \n从元素中移除类涉及 `replace()` 方法和正则表达式。你像之前一样获取元素，然后通过 `className` 属性获取元素所属的类列表。最后，使用正则表达式替换你想要移除的类名：\n\
  \n```javascript\nvar tagLineElement = document.getElementById(\"tagline\");\ntagLineElement.className\
  \ = tagLineElement.className.replace(/\\berrorClass\\b/,\"\");\n```\n\n此示例通过正则表达式的帮助从\
  \ `tagLineElement` 的 `className` 属性中移除 `errorClass` 类名。\n\n\n\n\n应用到给定元素的现有样式也可以通过\
  \ JavaScript 访问；然而，Internet Explorer 与浏览器之间检索样式的方法有所不同。对于符合 W3C 标准的浏览器，你使用 `getComputedStyle()`\
  \ 方法检索样式；对于 Internet Explorer，你使用 `currentStyle` 数组属性。检索到的样式是最终应用的样式，因为它是从所有可能的\
  \ CSS 位置计算出的复合样式，包括外部样式表文件和在文档内应用的所有 CSS 样式。\n\n示例 15-3 显示了获取 ID 为 `heading` 的元素的计算后的\
  \ CSS `color` 属性的示例。在这个示例中，该标题是一个 `<h1>` 元素：\n\n```\n<h1 style=\"font-family: arial;\
  \ color: #0000FF;\" id=\"heading\">JavaScript Step by Step</h1>\n```\n\n在示例 15-3\
  \ 中，一个 `alert()` 对话框显示了结果。\n\n示例 15-3. 使用 JavaScript 获取 CSS `color` 属性。\n\n```\n\
  var heading = document.getElementById(\"heading\");\nif (typeof heading.currentStyle\
  \ != \"undefined\") {\n    var curStyle = heading.currentStyle.color;\nelse if (typeof\
  \ window.getComputedStyle != \"undefined\") {\n    var curStyle =\n        document.defaultView.getComputedStyle(heading,null).getPropertyValue(\"\
  color\");\n}\nalert(curStyle);\n```\n\n当你通过 浏览器查看时，你会看到一个 `alert()` 对话框，如图 15-4\
  \ 所示所示 getComputedStyle()` 方法接受两个参数：要检索的元素和一个伪元素。在大多数情况下，你只使用元素本身，因此你可以通过将第二个参数设置为\
  \ `null` 来忽略它，如示例所示。\n\n![元素当前应用的样式。](img/httpatomoreillycomsourcemspimages748899.png.jpg)\n\
  \n图 15-4. 元素当前应用的样式。\n\n### 注意\n\nFirefox 对于相同的代码返回 `rgb(0, 0, 255)` 来表示 `color`\
  \ 值。\n\n## 使用 JavaScript 修改样式表\n\n本章到目前为止的示例展示了如何通过 `style` 对象处理单个样式元素。然而，你可能会发现你想要更改应用于某个元素或多个元素的整个样式——也就是说，更改样式表当它应用于某个元素或元素类时时的样式。遗憾的是，这样做并不像之前展示的操纵文档样式的方法那么简单。\n\
  \n第一个障碍是确定访问者的浏览器是否支持检索现有样式。你通过检查 `document.styleSheets` 属性来实现这一点，如下所示：\n\n```\n\
  if (typeof document.styleSheets != \"undefined\") {\n    // 浏览器支持检索样式表。\n}\n```\n\
  \n`document.styleSheets` 数组包含了应用于文档的样式，并按照应用的顺序列出。这意味着文档中链接的外部样式表是按照它们在文档中出现的顺序设置的，从索引\
  \ `0` 开始。考虑这段代码：\n\n```\n<link rel=\"stylesheet\" href=\"ex1.css\" type=\"text/css\"\
  \ />\n<link rel=\"stylesheet\" href=\"ex2.css\" type=\"text/css\" />\n```\n\n这些样式表分别索引为\
  \ `document.styleSheets[0]` 和 `document.styleSheets[1]`。因此，如果你想检索应用于文档内给定元素的样式，那么知道样式表在文档中出现的顺序是重要的。\n\
  \n在你确定了浏览器是否支持检索现有样式之后，你还需要克服 Internet Explorer 与符合 W3C 标准的浏览器之间的差异。\n\nInternet\
  \ Explorer 使用 `rules` 数组检索由给定样式表应用的规则，而符合 W3C 标准的浏览器使用 `cssRules` 数组检索规则。就像你在事件模型中必须针对浏览器之间的差异编写代码一样，在处理样式表检索时，你也必须针对这些浏览器之间的差异编写代码。假设你有一个这样一个样式规则：\n\
  \n```\nh1 { font-family: arial; }\n```\n\n示例 15-4\n\n示例 15-4. 使用 JavaScript 获取样式表。\n\
  \n```\nif (typeof document.styleSheets != \"undefined\") {\n    var stylerules;\n\
  \    if (typeof document.styleSheets[0].rules != \"undefined\") {\n        stylerules\
  \ = document.styleSheets[0].rules;\n    } else {\n        stylerules = document.styleSheets[0].cssRules;\n\
  \    }\n}\n```\n\n以下代码结合示例 15-4，将该 CSS 中每个指定元素的字体更改为不同的字体：\n\n```\nstylerules[0].style.fontFamily\
  \ = \"courier\";\n```\n\n将样式表中的*所有*选择器更改为一个设置并不常见。遍历样式表以寻找特定的选择器通常更有用，如示例 15-5 所示。示例\
  \ 15-5. 遍历样式表以查找 `<h1>` 选择器。\n\n```\nfor (var i = 0; i < stylerules.length; i++)\
  \ {\n    if (stylerules[i].selectorText.toLowerCase() == \"h1\") {\n        stylerules[i].style.fontFamily\
  \ = \"courier\";\n    }\n}\n```\n\n这是一个关于该功能的更完整的示例。假设在这个示例中你有一个简单的外部 CSS 样式 `ex1.css`：\n\
  \n```\nh1 { font-family: arial; }\n```\n\n示例 15-6 显示了使用 `ex1.css` 样式表和另一个名为 `ex2.css`\
  \ 的 HTML 页面。\n\n示例 15-6. 通过 `styleSheets` 数组更改元素样式。\n\n```\n<!DOCTYPE HTML PUBLIC\
  \ \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n\
  <head>\n<title>JavaScript Step by Step</title>\n<link rel=\"stylesheet\" href=\"\
  ex1.css\" type=\"text/css\" />\n<link rel=\"stylesheet\" href=\"ex2.css\" type=\"\
  text/css\" />\n<script type=\"text/javascript\">\nif (typeof document.styleSheets\
  \ != \"undefined\") {\n    var stylerules;\n    if (typeof document.styleSheets[0].rules\
  \ != \"undefined\") {\n        stylerules = document.styleSheets[0].rules;\n   \
  \ } else {\n        stylerules = document.styleSheets[0].cssRules;\n    }\n\n  \
  \  for (var i = 0; i < stylerules.length; i++) {\n        if (stylerules[i].selectorText.toLowerCase()\
  \ == \"h1\") {\n            stylerules[i].style.fontFamily = \"courier\";\n    \
  \    }\n    }\n}\n</script>\n</head>\n<body>\n<h1 id=\"heading\">JavaScript Step\
  \ by Step</h1>\n<p id=\"tagline\">JavaScript Step by Step 是 Steve Suehring 的书，由\
  \ Microsoft Press 出版。</p>\n<p>该书强调了可以在不同浏览器的多个运行的标准的 JavaScript。</p>\n</body>\n\
  </html>\n```\n\n通过 浏览器查看时，页面显示了一个使用 Courier 字体样式的标题。此文本是使用示例 15-6 中 `for` 循环内的 JavaScript\
  \ 更改的。\n\n# 练习\n\n\n\n\n\n1. 创建一个基础 HTML 文档，使用样式表（既可以是文档内部的，也可以通过外部文件引入）。确保页面至少有两个\
  \ `<p>` 元素和一个 `<h1>` 元素。为每个元素分配 ID 属性。\n2. 使用 JavaScript 修改一个 `<p>` 元素的样式，将它的 `color`\
  \ 属性改为蓝色。\n3. 使用 JavaScript 修改所有 `<p>` 元素的样式，将它们的可见性设置为隐藏（hidden）。关于可见性属性，请参阅表 15-1\
  \ 以获取帮助。\n4. 使用 JavaScript 获取 `<p>` 元素可见性的当前样式，并使用 `alert()` 对话框显示当前的可见性设置。\n\n\
  # 第 16 章. JavaScript 错误处理\n\n读完本章后，你将能够：\n\n* 理解使用 JavaScript 方法进行错误处理：`try/catch`\
  \ 和 `onerror`。\n* 使用 `try/catch` 语句处理错误。\n* 使用 `try/catch/finally` 语句。\n* 处理针对窗口和图像对象的\
  \ `onerror` 事件。\n\n## 介绍两种处理错误的方法\n\n本章将介绍 JavaScript 中处理错误状况的两种内置方式：`try/catch`\
  \ 和 `onerror`。许多其他语言（包括 Microsoft Visual Basic .NET 和 Microsoft Visual C#）也包含了 `try/catch`，以帮助你捕获并处理错误状况。`onerror`\
  \ 事件允许你在遇到错误时执行某项操作。\n\n## 使用 try/catch\n\n`try/catch` 语句组中的 `try` 部分封装了一个 JavaScript\
  \ 代码块。当脚本执行时，`try` 块中抛出的任何异常都会被 `catch` 语句捕获。然后你可以在放置在 `catch` 块中的 JavaScript 中处理该错误。执行此操作的代码格式如下：\n\
  \n```\ntry {\n    // 执行某些代码\n}\ncatch(errorObject) {\n    // 在此处编写错误处理代码\n}\n```\n\
  \n当执行 `try` 子句中的代码时，遇到的任何错误都会导致处理程序立即移交给 `catch` 子句。示例 16-1（位于配套内容的 `listing16-1.txt`\
  \ 文件中）显示了一个简单的示例。\n\n示例 16-1. 一个基础的 try/catch 示例。\n\n```\ntry {\n    var numField\
  \ = document.forms[0][\"num\"];\n    if (isNaN(numField.value)) {\n        throw\
  \ \"it's not a number\";\n    }\n}\ncatch(errorObject) {\n    alert(errorObject);\n\
  }\n```\n\n当 `numField.value` 的值不是数字时，`throw` 语句抛出一个由程序员生成的异常：文本“it’s not a number”。随后执行\
  \ `catch` 子句，在这种情况下显示一个 `alert()` 对话框。请注意程序员生成的异常（`throw`）与 JavaScript 运行时引擎生成的异常（如语法错误）之间的区别。`try/catch`\
  \ 块不会捕获语法错误，因此它不对这些错误提供保护。\n\n在使用 `catch` 子句时，通常会执行多个任务，例如调用另一个函数来记录错误，或者使用通用（泛型）方法处理某种条件。在代码的问题区域或代码性质可能导致错误的区域（例如处理用户输入的代码中），使用\
  \ `catch` 特别有用。\n\n在接下来的练习中，你将构建一个与你在第 15 章中构建的表单单。这次，除了在表单字段中提供视觉反馈外，你还提供了一些文本反馈。\n\
  \n## 在 Web 表单中使用 try/catch\n\n1. 使用 Microsoft Visual Studio、Eclipse 或编辑器，编辑配套内容第\
  \ 16 章示例文件文件夹中的 `number.htm` 文件。\n2. 在网页中，将 `TODO` 语句替换为以下加粗字体所示的代码（你可以在配套内容的 `number.txt`\
  \ 文件中找到这些代码）：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\" \"http://www.w3.org/TR/html4/\n\
  strict.dtd\">\n<html>\n<head>\n<title>Try/Catch</title>\n<script type=\"text/javascript\"\
  \ src=\"ehandler.js\"></script>\n<script type=\"text/javascript\" src=\"number.js\"\
  ></script>\n</head>\n<body>\n<form name=\"formexample\" id=\"formexample\" action=\"\
  #\">\n<div id=\"citydiv\">Enter a Number Between 1 and 100: <input id=\"num\" name=\"\
  num\"> <span\nid=\"feedback\"> </span></</div>\n<div><input id=\"submit\" type=\"\
  submit\"></</div>\n</form>\n<script type=\"text/javascript\">\nvar formEl = document.getElementsByTagName(\"\
  form\")[0];\nEHandler.add(formEl,\"submit\", function(eventObj) { checkValid(eventObj);\
  \ } );\n</script>\n</body>\n</html>\n```\n\n3. 创建一个名为 `number.js` 的 JavaScript 源文件。（此文件位于配套内容中。）\n\
  4. 将第 15 章中的错误处理代码转换为 `try/catch` 风格，并匹配此表单的内容。第 15 章的代码并不真正需要 `try/catch` 语句，但使用\
  \ `try/catch` 重新重构可以说明如何使用该语句。在 `number.js` 文件中输入以下代码。（尽管这些代码的大部分可以压缩为单个 `if` 语句，但我在这里写了几个\
  \ `if` 语句，因为你将在后的练习中扩展这些代码。）\n\n```javascript\nfunction checkValid(eventObj) {\n\
  \    try {\n            var numField = document.forms[0][\"num\"];\n           \
