  \ 图 20-2 所示的表格。\n\n![开始为表格设置样式。](img/httpatomoreillycomsourcemspimages748943.png.jpg)\n\
  \n图 20-2. 开始使用 CSS 为表格设置样式。\n\n\n\n\n使用一些颜色无疑有助于提高表格的可读性，特别是当显示几行甚至几百行更多数据时。交替使用颜色，使得每隔行的深浅略有不同，并将表格头更改为完全不同的颜色，也可能有助于提高可读性。以下是添加了一些\
  \ `backgroundColor` 样式属性后两个循环的样子。再次，更改之处是**粗体**的。\n\n```\nfor (colHead = 0; colHead\
  \ < xmlEl[0].childNodes.length; colHead++) {\n    if (xmlEl[0].childNodes[colHead].nodeType\
