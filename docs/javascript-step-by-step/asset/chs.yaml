  \n# 展望\n\n尽管 XML 确实是 AJAX 缩写中的 X，但 AJAX 的意义远不止 JavaScript 和 XML。AJAX 可以与 XML 以外的数据类型一起工作，在第\
  \ 19 章 中，你将在本章介绍的简要基础基础上学习使用 AJAX。\n\n在第 20 章 中，你将研究 JavaScript、AJAX 和级联样式表 (CSS)\
  \ 的集成，这允许你展示通过 JavaScript 获取的数据。\n\n# 练习题\n\n| 1. | 使用本章书籍显示练习中的代码，实现在点击链接后显示表格，而不是在页面加载时显示。\
  \ |\n| 2. | 使用本章书籍显示练习中的代码来显示表格，但要使用 DOM 交替改变每行的颜色，使得每隔一行就有灰色背景。提示：`#aaabba` 是这种灰色的十六进制表示。\
  \ |\n\n# 第 18 章. JavaScript 应用\n\n**读完本章后，你将能够：**\n\n* 理解构成基于 JavaScript 应用程序的组件。\n\
  \n# JavaScript 应用程序的组件\n\n构建具有桌面应用程序高级外观和体验的浏览器应用程序，通常涉及使用 JavaScript。此类应用程序具有桌面应用程序的一些相同功能和响应能力，就像它运行在本地计算机上，而不是通过网络浏览器运行一样。\n\
  \n本简章概述了构成基于 JavaScript 应用程序的组件。目标是帮助你理解底层架构以及在企业级创建此类应用所需的某些复杂性。\n\n## 三大要素：显示、行为、数据\n\
  \n网络应用程序存在三个主要组件：\n\n* **显示 (Display)**。页面的外观和感受。\n* **行为 (Behavior)**。应用程序界面的功能，即当用户点击页面上的元素时会发生什么。\n\
  * **数据 (Data)**。包含数据并执行操作的服务器组件，操作结果显示在页面上。\n\nJavaScript 代码通常处理列表的前两个组件——显示和行为——以影响界面或在用户执行操作时做出反应。JavaScript\
  \ 也会与服务器返回的数据一起工作，但通常是为了以某种方式更改显示。例如，调用返回当前温度或天气状况的 Web 服务可能会使用 JavaScript 在晴朗时更改图标。接下来的章节将更详细地检查这三个元素中的每一个。\n\
  \n### 显示：页面布局\n\n网页显示涵盖页面布局以及任何与页面和网站外观及感受相关的内容，包括颜色方案、图像、菜单样式（它们是圆角还是直角等）、按钮和内容的放置、字体颜色以及图像的使用。JavaScript\
  \ 可以影响所有这些项目，正如你在之前的章节关于级联样式表 (CSS) 和表单验证的章节中所看到的那样。这些元素是网页设计的关注重点，并受到用户最多的关注，在确定你的网站需求时，你应该考虑这些元素。\n\
  \n### 行为：控制发生的情况\n\n决定用户体验的最重要因素之一，也是网络应用程序设计中最经常被忽略的元素之一：应用程序界面的行为，它控制当用户与特定元素交互时会发生什么。考虑以下两个简单的场景：\n\
  \n* 当访问点击 Web 表单上的提交按钮时，该提交按钮是保持激活还是变为禁用？\n* 当输入框获得焦点时，它应该改变颜色还是高亮显示？\n\n\n\n\n\
  即使是这些微小的行为，如果设计合理，也能极大提升用户体验。然而，在设计网站时，这些行为经常被遗忘、忽视或忽略，人们往往更关注网站的外观、视觉感受或原始设计。\n\
  \n### 数据：消费、显示与验证\n\n至少就本书涉及的内容而言，JavaScript 并不直接与数据库或服务器交互。显然，JavaScript 通过异步 JavaScript\
  \ 和 XML（AJAX）以及 Web 服务来实现这种交互，但这些过程需要服务器端代码将数据返回给调用的 JavaScript。\n\n就像网站的显示部分一样，在设计\
  \ Web 应用程序时，后端服务器端数据组件也应该获得足够的关注。从数据库设计到业务逻辑编程，这些后端编码都需要细心的处理。\n\n# JavaScript 与\
  \ Web 接口\n\n程序员使用 JavaScript 创建提供优质用户体验的前端。微软 Bing 地图（以前称为 Live Search Maps）就是一个极度依赖\
  \ JavaScript 的 Web 应用程序示例。图 18-1 展示了微软 Bing 地图示例，你可以在 `[`www.bing.com/maps/`](http://www.bing.com/maps/)`\
  \ 找到它。\n\n![Bing Maps 界面使用 JavaScript 提供良好的交互性。](img/httpatomoreillycomsourcemspimages748927.png.jpg)\n\
  \n图 18-1。Bing Maps 界面使用 JavaScript 提供良好的交互性。\n\n用户可以像操作桌面应用程序一样，拖动地图显示。地图由各种分辨率的瓦片组成。当用户拖动地图时，浏览器会向\
  \ Virtual Earth 服务器发送多个 HTTP 请求，请求额外的瓦片，然后迅速显示这些瓦片。\n\nBing 搜索引擎还使用了类似于 Google 等其他搜索引擎的预测搜索（type-ahead\
  \ search）。如果你在 `[`www.bing.com`](http://www.bing.com)` 的主文本框中输入，浏览器会立即向服务器发送 HTTP\
  \ 请求以查找相似搜索，如图 18-2 所示。\n\n![预测搜索功能使用 JavaScript 从服务器获取匹配的搜索列表。](img/httpatomoreillycomsourcemspimages748929.png.jpg)\n\
  \n图 18-2。预测搜索功能使用 JavaScript 从服务器获取匹配的搜索列表。\n\nBing 搜索引擎的所有这些元素都使用了 JavaScript。无数其他\
  \ Web 接口也依赖 JavaScript 控制页面行为层来增强用户体验。本书的剩余部分将带你进入使用 JavaScript 构建此类应用程序的道路。第 19\
  \ 章，和 第 20 章，展示了如何使用 JavaScript 构建简单的应用程序。\n\n# 第 19 章：初探 AJAX\n\n读完本章后，你将能够：\n\n\
  *   理解异步 JavaScript 和 XML (AJAX) 的基础。\n*   理解同步调用和异步调用之间的区别。\n*   使用 AJAX 来…… 第\
  \ 20 章，展示了如何使用 JavaScript 构建简单的应用程序。\n\n# 第 20 章：深入了解 AJAX\n\n如果你使用微软技术创建服务器端应用程序，开发者网络提供了丰富的教程资源。如果你在创建服务器端时需要额外帮助，可以从多个来源获取支持。\n\
  \n如果你使用其他技术（如 LAMP 栈：Linux、Apache、MySQL、Python）开发服务器端应用程序，在网上搜索教程可能是最快的方法。《Learning\
  \ Perl》（O'Reilly, 2005）是学习 Perl 语言基础的优秀资源。\n\n### 注意\n\n如果你喜欢我的写作风格，我写了《Beginning\
  \ Perl Web Development》（Apress, 2005），书中侧重于使用 Perl 处理 Web 应用程序。PHP 的主网站 `[`www.php.net`](http://www.php.net)`\
  \ 是获取信息的好地方，对于 Python，可以查看 Python 网站 `[`www.python.org`](http://www.python.org)`。\n\
  \n# *XMLHttpRequest* 对象\n\n*XMLHttpRequest* 对象是构建 AJAX 应用程序的核心。尽管 JavaScript 的实现有所不同，但\
  \ ECMAScript 和万网联盟（W3C）已对其许多方面进行了标准化，但 `XMLHttpRequest` 对象尚未经历过标准化过程。尽管如此，自 Windows\
  \ Internet Explorer 7 发布以来，你在所有主流浏览器中以相同的方式使用 `XMLHttpRequest` 对象。\n\n欲了解更多信息，请参考\
  \ [`msdn.microsoft.com/en-us/magazine/cc16333.aspx`](http://msdn.microsoft.com/en-us/magazine/cc16333.aspx))。微软出版社还出版了多本关于构建\
  \ Web 应用的优秀书籍，其中之一是《Microsoft ASP.NET 3.5 By Step》（Microsoft Press, 2008）。其他书籍请访问\
  \ `[`www.microsoft.com/mspress`](http://www.microsoft.com/mspress)`。\n\n\n\n微软首次在\
  \ Internet Explorer 5.0 中实现了 `XMLHttpRequest` 对象。如果访问者使用的是早于该版本的浏览器，那么使用 `XMLHttpRequest`\
  \ 的应用程序将无法工作。在版本 7 之前的 Internet Explorer 版本中，`XMLHttpRequest` 对象被实例化为 `ActiveXObject`\
  \ 对象，而其他浏览器则将 `XMLHttpRequest` 对象实现为浏览器内置的 JavaScript 对象。这意味着，如果你的应用程序需要在早于版本 7\
  \ 的 Internet Explorer 版本上运行，你需要以不同的方式为这些早期的 Internet Explorer 实例化 `XMLHttpRequest`\
  \ 对象，正如我在本章节后面向你展示的那样。下一节“实例化 `XMLHttpRequest` 对象”将展示如何测试 `XMLHttpRequest` 是否存在，以及如何在所有版本的\
  \ Internet Explorer 中实例化它。\n\n## 实例化 `XMLHttpRequest` 对象\n\nInternet Explorer 7\
  \ 及更高版本，以及所有支持 `XMLHttpRequest` 的其他主流浏览器都以相同的方式实例化 `XMLHttpRequest` 对象：\n\n```\n\
  var req = new XMLHttpRequest();\n```\n\n对于早于版本 7 的 Internet Explorer 版本，你必须实例化一个\
  \ `ActiveXObject`。然而，具体的实现方法取决于客户端安装的 XMLHTTP 库的版本。因此，你需要进行一些代码调整，以便在这些早期的 Internet\
  \ Explorer 版本中实例化 `XMLHttpRequest` 对象。\n\n示例 19-1 中的代码是一个跨浏览器函数，可以在多个浏览器中实例化 `XMLHttpRequest`\
  \ 对象。\n\n示例 19-1. 跨浏览器实例化 `XMLHttpRequest` 对象。\n\n```\nfunction readyAJAX() {\n\
  \    try {\n        return new XMLHttpRequest();\n    } catch(e) {\n        try\
  \ {\n            return new ActiveXObject(\"Msxml2.XMLHTTP\");\n        } catch(e)\
  \ {\n            try {\n                return new ActiveXObject(\"Microsoft.XMLHTTP\"\
  );\n            } catch(e) {\n                return \"A newer browser is needed.\"\
  ;\n            }\n        }\n    }\n}\n```\n\n示例 19-1 中的函数使用了多层 `try/catch` 块来实例化\
  \ `XMLHttpRequest`，无论访问者使用的是 Internet Explorer 还是其他浏览器。如果对 `XMLHttpRequest` 的原生调用失败，则意味着访问者使用的是早于版本\
  \ 7 的 Internet Explorer 浏览器。在这种情况下，错误会被捕获，并尝试一种基于 `ActiveXObject` 的实例化 `XMLHttpRequest`\
  \ 方法。如果这些方法均未成功，可能的原因是浏览器太旧，不支持 `XMLHttpRequest`。\n\nMSDN 上的“关于原生 XMLHTTP”（About\
  \ Native XMLHTTP）文章描述了 Internet Explorer 中 `XMLHttpRequest` 对象的某些版本历史和安全细微差别。可以通过\
  \ [`msdn2.microsoft.com/en-us/library/ms537505.aspx`](http://msdn2.microsoft.com/en-us/library/ms537505.aspx)\
  \ 找到这篇文章。\n\n你可以如下调用示例 19-1 中所示的 `readyAJAX()` 函数：\n\n```\nvar requestObj = readyAJAX();\n\
  ```\n\n变量 `requestObj` 现在包含了函数返回的 `XMLHttpRequest` 对象；或者，如果函数无法创建对象，`requestObj`\
  \ 变量将包含字符串“A newer browser is needed.”\n\n## 发送 AJAX 请求\n\n在拥有新创建 `XMLHttpRequest`\
  \ 对象后，你可以向 Web 服务器发送请求。通过 `XMLHttpRequest` 对象，你可以向 Web 服务器发送请求并获取响应。要发送请求，你使用 `open()`\
  \ 和 `send()` 方法。\n\n有两种本质不同的发送请求方式：同步和异步。在同步情况下，请求代码会等待响应；而在异步情况下，请求代码不会阻塞。在同步情况下，请求代码会阻塞直到服务器响应。在异步情况下，请求代码可以继续执行。你可以了解异步请求的更多信息。\n\
  \n在发送请求之前，你使用 `open()` 方法，它有三个参数：请求方法（`GET`、`POST` 或 `HEAD`）、要请求的统一资源标识符（URL），以及指示是同步还是异步的布尔值（`true`\
  \ 或 `false`）。假设 `XMLHttpRequest` 对象已赋值给变量 `requestObj`，异步调用看起来如下：\n\n```javascript\n\
  requestObj.open(\"GET\", url, true);\n```\n\n同步调用看起来如下：\n\n```javascript\nrequestObj.open(\"\
  GET\", url, false);\n```\n\n然后你使用 `send()` 方法发送请求：\n\n```javascript\nrequestObj.send();\n\
  ```\n\n### 注意\n\n如果发送的请求包含任何特殊字符（例如空格或其他保留字符），你必须使用 `%` 符号对它们进行转义。这在 RFC 3986 中有讨论。\n\
  \n\n\n\n请求的文档遵循响应标头。第一个也是最重要的标头指示响应的状态。在示例中，响应为 `200`，这与 OK 同义。其他常见的响应包括 `404`（表示未找到请求的文档）、`302`（重定向）和\
  \ `500`（表示发生了服务器错误）。\n\n理解这些 HTTP 基础知识对于理解如何构建 AJAX 请求以及在出现问题时如何排查这些请求非常重要。你可以在\
  \ RFC 2616 中找到关于 HTTP 的更多信息，包括各种响应码，位于 *ftp://ftp.rfc-editor.org/in-notes/rfc2616.txt*。\n\
  \n## 处理 AJAX 响应\n\n当请求同步发送时，处理响应会更容易，因为脚本在等待响应时执行会停止。`requestObj` 变量提供了处理响应的有用方法，包括访问从服务器发送的状态码和文本。无论请求是同步的还是异步的，你都应该评估状态码以确保响应成功（通常由状态码\
  \ `200` 表示）。\n\n`responseText` 方法包含从 Web 服务器接收到的响应文本。\n\n例如，假设服务器应用程序返回两个数字之和。调用该应用程序相加数字\
  \ 2 和 56 如下：\n\n```\nhttp://www.braingia.org/addtwo.php?num1=2&num2=56\n```\n\n\
  以下是同步调用和获取响应的：\n\n```\nrequestObj.open(\"GET\", \"http://www.braingia.org/addtwo.php?num1=2&num2=56\"\
  , false);\nrequestObj.send();\nif (requestObj.status == 200) {\n    alert(requestObj.responseText);\n\
  } else {\n    alert(requestObj.statusText);\n}\n```\n\n在此示例中，假设 `requestObj` 是使用之前看到的\
  \ `readyAJAX()` 函数创建的。随后的代码使用 `GET` 请求调用 `open` 方法访问指定的 URL (`[`www.braingia.org/addtwo.php?num1=2&num2=56`](http://www.braingia.org/addtwo.php?num1=2&num2=56)`)。请求是同步发送的，因为\
  \ `open` 方法的最后一个参数是 `false`。接下来，代码调用 `send` 方法，它实际上将请求发送到 Web 服务器。\n\n当客户端接收到 Web\
  \ 服务器的响应时，它调用 `status` 方法检查状态值。如果响应码为 `200`（表示成功），代码将显示 `responseText`，它包含了服务器的响应。如果响应状态码是\
  \ `200` 的其他值，代码将显示状态文本。\n\n处理异步响应要复杂一些。当请求异步发送时，脚本执行会继续。因此，脚本何时被通知已收到响应是不可预测的。要了解响应状态，你可以使用\
  \ `onreadystatechange` 事件来触发代码，检查事件的 `readyState` 属性以确定请求/响应循环的状态。回想 第 17 章，`readyState`\
  \ 属性有五种状态，如 表 19-1 所示。\n\n表 19-1. `readyState` 属性的值\n\n| 值 | 描述 |\n| --- | --- |\n\
  | `0` | 未初始化。已打开但尚未调用。 |\n| `1` | 已打开。已初始化但尚未发送。 |\n| `2` | 已发送。请求已发送。 |\n| `3`\
  \ | 接收中。正在积极接收响应。 |\n| `4` | 已加载。已完全接收响应。 |\n\n出于实际目的，对 JavaScript 和 AJAX 程序员来说，唯一重要的状态是状态\
  \ `4`——已加载（Loaded）。尝试处理 `readyState` 值不为 `4` 的响应会导致错误。\n\n你通常使用匿名函数来处理异步 AJAX 的\
  \ `onreadystatechange` 事件。该函数检查 `readyState` 属性是否已达到 `4`，然后检查确保状态为 200（表示成功）。代码遵循此格式：\n\
  \n```\nrequestObj.onreadystatechange = function() {\n    if (requestObj.readyState\
  \ == 4) {\n        if (requestObj.status == 200) {\n            alert(requestObj.responseText);\n\
  \        } else {\n            alert(requestObj.statusText);\n        }\n    }\n\
  }\n```\n\n在接下来的练习中，你创建一个 `XMLHttpRequest` 对象并向 Web 服务器发送请求，以根据 ISBN 获取书名。你需要一个 Web\
  \ 服务器和服务器代码来打印响应，因为使用 `XMLHttpRequest` 发送的请求受到 JavaScript 同源策略的限制。\n\n同源策略（same-origin\
  \ policy`）要求请求只能发送到加载调用脚本的相同域内的服务器。换句话说，因为我在此练习中直接从 `[`www.braingia.org`](http://www.braingia.org)`\
  \ 的 Web 服务器执行脚本，因此我的脚本能够调用该服务器并获取响应。然而，如果你尝试调用另一个 Web 服务器上的 URL，同源策略将阻止脚本获取响应。\n\
  \n### 注意\n\n绕过同源安全功能的一种方法是使用 HTTP 代理，或编写服务器端程序以便其代表调用程序发送请求；但是，学习如何操作超出了本书的范围。\n\
  \n对于接下来的练习，运行在服务器上的脚本或程序在接收带有以下值的名称/值参数的 `GET` 请求时，需要返回短语 `“JavaScript Step by Step”`：\n\
  \n```\nisbn=9780735624498\n```\n\n例如，在最基础的情况下，如果现在基于 VBScript 的 Active Server Pages\
  \ (ASP) 页面实现，服务器端程序可能如下：\n\n```\n<%\ndim isbn\nisbn=Request.QueryString(\"isbn\"\
  )\nIf isbn<>\"\" Then\n    If isbn==\"9780735624498\" Then\n       Response.Write(\"\
  JavaScript Step by Step\")\n    End If\nEnd If\n%>\n```\n\n如果用 PHP 编写，功能类似的程序如下：\n\
  \n```php\n<?php\n\n$isbn = $_GET['isbn'];\n\nif (! $isbn) {\n    print \"That request\
  \ was not understood.\";\n} else if ($isbn == \"9780735624498\") {\n    print \"\
  JavaScript Step by Step\";\n}\n\n?>\n```\n\n在后续练习中，发送请求的 URL 是预定义的，但你必须将该 URL 替换为你的服务器端程序所在的\
  \ URL。由于同源策略，服务器端程序需要与调用它的页面位于同一域。\n\n## 使用 XMLHttpRequest 发送和接收\n\n1. 创建你的服务器端程序，当它接收到前面所示的\
  \ `isbn` 参数时返回书名。你可以使用选择的语言完成此操作。（如果需要，请查看之前显示的两个示例。）\n\n2. 使用 Microsoft Visual\
  \ Studio、Eclipse 或或其他编辑器，编辑第 19 章示例文件文件夹（在配套内容中）中的 `isbn.htm` 文件。\n\n3. 在网页中，将 `TODO`\
  \ 注释替换为此处所示的粗体代码（位于配套内容中的 `isbn.txt` 文件中）。务必将 `url` 变量替换为你服务器端程序的相应 URL。\n\n\n\n\
  \n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>ISBN</title>\n</head>\n<body>\n<div id=\"data\"></div>\n\
  <script type=\"text/javascript\">\nfunction readyAJAX() {\n    try {\n        return\
  \ new XMLHttpRequest();\n    } catch(e) {\n        try {\n            return new\
  \ ActiveXObject(\"Msxml2.XMLHTTP\");\n        } catch(e) {\n            try {\n\
  \                return new ActiveXObject(\"Microsoft.XMLHTTP\");\n            }\
  \ catch(e) {\n                return \"A newer browser is needed.\";\n         \
  \   }\n        }\n    }\n}\nvar requestObj = readyAJAX();\nvar url = \"http://www.braingia.org/isbn.php?isbn=9780735624498\"\
  ;\nrequestObj.open(\"GET\",url,true);\nrequestObj.send();\nrequestObj.onreadystatechange\
  \ = function() {\n    if (requestObj.readyState == 4) {\n        if (requestObj.status\
  \ == 200) {\n            alert(requestObj.responseText);\n        } else {\n   \
  \         alert(requestObj.statusText);\n        }\n    }\n}\n</script>\n</body>\n\
  </html>\n```\n\n4. 保存并在网页浏览器中查看该页面。你应该会收到一个如所示的警框：\n\n![使用 XMLHttpRequest 发送和接收](img/httpatomoreillycomsourcemspimages748931.png.jpg)\n\
  \n恭喜！你现在已经处理了第一个 `XMLHttpRequest`。\n\n## 处理 XML 响应\n\n到目前为止你看到的 AJAX 示例都使用了来自 Web\
  \ 服务器的纯超文本标记语言（HTML）和文本响应，因此你可以使用 `XMLHttpRequest` 对象的 `responseText` 方法来获取它们。然而，服务器应用程序也可以返回\
  \ XML 响应，你可以使用 `responseXML` 方法对其进行原生处理。\n\n在本章较早之前，标题为“用 500 字或更少描述 Web 工作原理”的侧边栏讨论了一个服务器响应示例。该服务器响应包含此\
  \ `Content-Type` 头部：\n\n```\nContent-Type: text/html; charset=iso-8859-1\n```\n\n\
  要使用 `responseXML` 方法获取响应，Web 服务器需要发送类似 `text/xml` 或 `application/xml` 的 `Content-Type`：\n\
  \n```\nContent-Type: application/xml\n```\n\n当 `XMLHttpRequest` 对象接收原生 XML 作为响应时，你可以使用文档对象模型（DOM）方法来处理响应。\n\
  \n`responseXML` 方法在历史上一直有些诡异，取决于浏览器和操作系统，使用它可能会导致意之外的行为。此外，`responseXML` 的支持程度不如其他\
  \ JavaScript 方法那样广泛。使用 `responseXML` 意味着将在本章中看到的 `XMLHttpRequest` 技术与 第 17 章 中描述的\
  \ XML 解析技术结合起来。例如，考虑以下 XML 文档（称之为 `book.xml`）：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"ISO-8859-1\"?>\n<book>\n  <title>JavaScript Step by Step</title>\n\
  \  <isbn>9780735624498</isbn>\n</book>\n```\n\n结合 `XMLHttpRequest` 对象和 XML 解析将产生以下代码，该代码获取并显示\
  \ `book.xml` 文档中的 ISBN：\n\n```\nvar requestObj = readyAJAX();\nvar url = \"http://www.braingia.org/book.xml\"\
  ;\nrequestObj.open(\"GET\",url,false);\nrequestObj.send();\nif (requestObj.status\
  \ == 200) {\n    var xmldocument = requestObj.responseXML;\n    alert(xmldocument.getElementsByTagName(\"\
  isbn\")[0].childNodes[0].nodeValue);\n} else {\n    alert(requestObj.statusText);\n\
  }\n```\n\n当请求成功完成后，`requestObj.responseXML` 包含请求的 XML 文档（`book.xml`）。`xmldocument.getElementsByTagName(\"\
  isbn\")` 代码获取文档中 `<isbn>` 标签的数组。该文档中只有一个此类标签；`[0]` 表示第一个。代码的 `.childNodes[0]` 部分从该\
  \ `<isbn>` 标签获取第一个子节点。在这种情况下，它是文本节点，包含了 ISBN 码。最后，代码的 `.nodeValue` 部分获取该文本节点的值，即\
  \ ISBN 本身，前面的代码通过 `alert` 调用显示该值。\n\n## 使用 JSON\n\nJavaScript 对象表示法（JSON）是一种以以原生\
  \ JavaScript 对象和数组的形式传递数据的方法，而不是在 XML（或 HTML）响应中对数据进行编码。JSON 是从服务器到客户端传递数据的更有效的方法。使用\
  \ DOM 解析 XML 要复杂得多，因此也较慢，而解析 JSON 编码的数据是直接在 JavaScript 中完成的。\n\n回想本章较早示例中的 `book.xml`\
  \ 文档。同样的数据在 JSON 中中看起来如下所示：\n\n```\n{\n\"book\":\n    {\n    \"title\": \"JavaScript\
  \ Step by Step\",\n    \"isbn\": \"9780735624498\"\n    }\n}\n```\n\n与 XML 相比，使用\
  \ JSON 获取单个元素稍微容易。你使用 JavaScript 的 `eval()` 函数来解析 JSON 格式的响应。例如，这里是获取并显示书籍标题的代码：\n\
  \n```\nvar requestObj = readyAJAX();\nvar url = \"http://www.braingia.org/json.php\"\
  ;\nrequestObj.open(\"GET\",url,false);\nif (requestObj.status == 200) {\n    var\
  \ xmldocument = eval('(' + requestObj.responseText + ')');\n    alert(xmldocument.book.title);\n\
  } else {\n    alert(requestObj.statusText);\n}\n```\n\n使用 JSON 带有内在风险，因为它使用了 `eval()`\
  \ 函数来解析。`eval()` 函数本质上执行接收到的代码，如果该代码是恶意的，它将在运行的环境中执行。确保你的应用程序使用的 JSON 数据是干净的且没有在使用\
  \ `eval()` 时产生问题的恶意代码。\n\n使用 jQuery 等 JavaScript 框架可以缓解这种担忧，原生 JSON 的引入也是如此。你可以在\
  \ 第 22 章 中学习如何使用 jQuery 以及如何使用它处理 JSON。\n\n## 处理头部\n\nHTTP HEAD 方法只返回响应头部，而不是像 GET\
  \ 方法那样同时返回头部和正文。HEAD 方法有时时对于判断给定资源是否已更新或更改有所帮助。\n\n经常发送的 HTTP 头部是 `Expires`，它指示客户端何时请求刷新副本，而不是从客户端读取。如果服务器发送了\
  \ `Expires` 头部，HEAD 方法是查看和解析 `Expires` 头部的有效方法，因为 HEAD 方法只检索响应头部而不是请求资源的整个正文。\n\n\
  要请求响应头部，无论是使用 HEAD 请求还是其他类型的请求（如 GET 或 POST），都使用 `XMLHttpRequest` 对象的 `getAllResponseHeaders()`\
  \ 方法，如下：\n\n```\nrequestObj.getAllResponseHeaders();\n```\n\n例如，示例 19-2 显示了如何从我们网站的默认页面获取响应头部。\n\
  \n\n\n\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>Response Headers</title>\n</head>\n<body>\n<div id=\"\
  data\"></div>\n<script type=\"text/javascript\">\nfunction readyAJAX() {\n    try\
  \ {\n        return new XMLHttpRequest();\n    } catch(e) {\n        try {\n   \
  \         return new ActiveXObject(\"Msxml2.XMLHTTP\");\n        } catch(e) {\n\
  \            try {\n                return new ActiveXObject(\"Microsoft.XMLHTTP\"\
  );\n            } catch(e) {\n                return \"A newer browser is needed.\"\
  ;\n            }\n        }\n    }\n}\nvar requestObj = readyAJAX();\nvar url =\
  \ \"http://www.braingia.org/\";\nrequestObj.open(\"HEAD\",url,true);\nrequestObj.send();\n\
  requestObj.onreadystatechange = function() {\n    if (requestObj.readyState == 4)\
  \ {\n        if (requestObj.status == 200) {\n            alert(requestObj.getAllResponseHeaders());\n\
  \        } else {\n            alert(requestObj.statusText);\n        }\n    }\n\
  }\n</script>\n</body>\n</html>\n```\n\n### 故障排除\n\n你在本章稍后的练习中遇到的**同源策略**同样适用于示例\
  \ 19-2 句中的 `HEAD` 方法。在编写示例 19-2 时，我忘记了同源策略，最初将 `url` 变量设置为 `[`www.microsoft.com/`](http://www.microsoft.com/)`，认为可以获取该网站的默认页面。然而，在收到错误后，我意识到了问题，并将\
  \ `url` 变量更改为脚本运行所在的域名（我的站点）。你可能会遇到相同的问题。记住，在尝试运行示例 19-2 中的代码时，将 `url` 变量更改为源服务器。\n\
  \n## 使用 `POST` 方法\n\n到目前为止，你看到的示例都使用 `GET` 和 `HEAD` 方法从服务器检索数据。要通过 HTTP 提交查询，通常会使用\
  \ `POST` 方法。使用 `XMLHttpRequest` 的 `POST` 方法比使用 `GET` 或 `HEAD` 方法稍微复杂一点。然而，`POST`\
  \ 方法相比 `GET` 方法有两个特定优势。首先，你通过 `POST` 请求发送的参数包含在请求体中，而不是像 `GET` 方法那样包含在 URL 中，因此不太可能被试图寻找你应用程序途径的偶然观察者看到。其次，`POST`\
  \ 方法支持更大的请求。某些服务器会将 `GET` 请求的数量或大小限制在特定的字符数量，尽管这些服务器可能也会限制 `POST` 请求的大小，但 `POST`\
  \ 请求的限制几乎总是大得多。\n\nHTTP `POST` 方法要求在请求内部设置一个额外的头部。你通过 `setRequestHeader()` 方法设置该额外的头部：\n\
  \n```javascript\nrequestObj.setRequestHeader(header, value);\n```\n\n例如，为了为 Web\
  \ 表单设置 `Content-Type` 头部（就像执行 `POST` 请求时那样），你可以这样写：\n\n```javascript\nrequestObj.setRequestHeader(\"\
  Content-type\", \"application/x-www-form-urlencoded\");\n```\n\n当你看到之前使用 `GET` 方法发送的\
  \ AJAX 请求时，URL 包含了应用程序的参数或 `name/value` 对，如下：\n\n```http\nhttp://www.braingia.org/books/javascriptsbs/isbn.php?isbn=9780735624498\n\
  ```\n\n在上一个示例中，`isbn` 参数的值为 `9780735624498`。然而，在处理 `POST` 请求时，URL 只包含请求的文档或资源——它不包含任何参数。因此，你必须将参数作为\
  \ `send()` 方法的一部分发送。\n\n示例 19-3 展示了一个使用 `POST` 方法的 AJAX 请求，如加粗体字体所示。它使用了两个参数——看看你是否能发现它们。\n\
  \n示例 19-3. 构建一个 `POST` 请求。\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML\
  \ 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html\n<head>\n<title>Post</title>\n\
  </head>\n<body>\n<div id=\"xmldata\"></div>\n<script type=\"text/javascript\">\n\
  function readyAJAX() {\n    try {\n        return new XMLHttpRequest();\n    } catch(e)\
  \ {\n        try {\n            return new ActiveXObject(\"Msxml2.XMLHTTP\");\n\
  \        } catch(e) {\n            try {\n                return new ActiveXObject(\"\
  Microsoft.XMLHTTP\");\n            } catch(e) {\n                return \"A newer\
  \ browser is needed.\";\n            }\n        }\n    }\n}\nvar requestObj = readyAJAX();\n\
  var url = \"http://www.braingia.org/books/javascriptsbs/post.php\";\nvar params\
  \ = \"num1=2&num2=2\";\nrequestObj.open(\"POST\",url,true);\nrequestObj.setRequestHeader(\"\
  Content-type\", \"application/x-www-form-urlencoded\");\nrequestObj.send(params);\n\
  requestObj.onreadystatechange = function() {\n    if (requestObj.readyState == 4)\
  \ {\n        if (requestObj.status == 200) {\n            alert(requestObj.responseText);\n\
  \        } else {\n            alert(requestObj.statusText);\n        }\n    }\n\
  }\n</script>\n</body>\n</html>\n```\n\n示例 19-3 创建了两个放入名为 `params` 变量中的参数：\n\n```javascript\n\
  var params = \"num1=2&num2=2\";\n```\n\n在构建请求对象 (`requestObj`) 后，参数作为参数传递给 `send()`\
  \ 方法：\n\n```javascript\nrequestObj.send(params);\n```\n\n# 案例研究：实时搜索与更新\n\n有很多使用\
  \ JavaScript 的自动完成或预测性搜索的示例，例如第 18 章 中所示的。其中一个示例是搜索通过垃圾邮件过滤器白名单或黑名单电子邮件地址的表单。\n\n\
  白名单/黑名单搜索使用 AJAX 导入 XML 文件，并根据管理员的输入提供结果。你可以轻松地调整此应用程序以提供实时搜索结果或实时书签。第 20 章 使用了第\
  \ 18 章 中该应用程序的一部分创建一个实时搜索表单，下一节介绍了如何调整该应用程序以使用 XML 创建实时搜索源。\n\n我经常发现需要从多台计算机访问网络浏览器书签。考虑到这一点，这里有一个提供书签页面的\
  \ AJAX 应用程序。页面使用位于中央位置的 XML 文件管理书签。代码检索文件并构建网页，提取书签并提供搜索界面。\n\n书签应用程序如图 19-1。诚然，它只显示了\
  \ 3 个书签，但该应用程序处理 3 个或 300 个书签的效果是一样的，而且提供几个会让演示书签变得更容易。\n\n![实时书签应用程序视图。](img/httpatomoreillycomsourcemspimages748933.png.jpg)\n\
  \n图 19-1. 实时书签应用程序视图。\n\n搜索框的工作原理是在用户向文本框中输入文本时缩小已查看书签列表。例如，在文本框中输入字母 `m` 会立即更改页面，使其只显示以字母\
  \ *m* 开头的书签，如图 19-2 所示。\n\n![输入字母 m 缩小了以 m 开头的显示书签。](img/httpatomoreillycomsourcemspimages748935.png.jpg)\n\
  \n图 19-2. 输入字母 m 缩小了以 *m* 开头的显示书签。\n\n\n\n\n继续输入字符——例如，输入 `i` 以匹配字符 `mi`——将继续缩小可选书签范围，如图\
  \ 19-3 所示。\n\n![通过添加额外的字符来进一步缩小范围](img/httpatomoreillycomsourcemspimages748937.png.jpg)\n\
  \n图 19-3. 通过添加额外的字符来进一步缩小范围。\n\n当用户从文本框中删除文本时，书签页面将恢复到默认状态（如图 19-1 所示）。\n\n以下是应用程序的\
  \ XML 代码（请参考配套内容中的 `bookmark.xml` 文件）：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\" standalone=\"yes\"?>\n<bookmarks xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  >\n        <bookmark>\n                <title>Steve Suehring's Home Page</title>\n\
  \                <url>http://www.braingia.org/</url>\n        </bookmark>\n    \
  \    <bookmark>\n                <title>MSDN</title>\n                <url>http://msdn.microsoft.com/</url>\n\
  \        </bookmark>\n        <bookmark>\n                <title>Microsoft Press</title>\n\
  \                <url>http://www.microsoft.com/mspress</url>\n        </bookmark>\n\
  </bookmarks>\n```\n\n该应用程序及其网页在此处以及 `bookmark.htm` 文件（位于配套内容中）中所示：\n\n```html\n\
  <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html\n<head>\n<title>Search</title>\n</head>\n<body>\n<form name=\"nameform\"\
  \ id=\"nameform\" action=\"\" method=\"post\">\nBookmark Search: <input id=\"textname\"\
  \ name=\"textname\" type=\"text\">\n</form>\n<div id=\"data\"></div>\n<script type=\"\
  text/javascript\" src=\"ehandler.js\"></script>\n<script type=\"text/javascript\"\
  >\n\nfunction textSearch() {\n    var textName = document.getElementById(\"textname\"\
  );\n    var dataNode = document.getElementById(\"data\");\n    while (dataNode.hasChildNodes())\
  \ {\n        dataNode.removeChild(dataNode.firstChild);\n    }\n    listName(textName.value);\n\
  }\n\nfunction readyAJAX() {\n    try {\n        return new XMLHttpRequest();\n \
  \   } catch(e) {\n        try {\n            return new ActiveXObject(\"Msxml2.XMLHTTP\"\
  );\n        } catch(e) {\n            try {\n                return new ActiveXObject(\"\
  Microsoft.XMLHTTP\");\n            } catch(e) {\n                return \"A newer\
  \ browser is needed.\";\n            }\n        }\n    }\n}\nfunction listName(text)\
  \ {\n    var xmlEl = AJAXresponse.getElementsByTagName(\"bookmark\");\n    elLength\
  \ = xmlEl.length;\n    for (i = 0; i < elLength; i++) {\n        var div = document.createElement(\"\
  div\");\n        // Create the row elements\n        for (j = 0; j < xmlEl[i].childNodes.length;\
  \ j++) {\n            // Skip it if the type is not 1\n            if (xmlEl[i].childNodes[j].nodeType\
  \ != 1) {\n                continue;\n            }\n            var url = new RegExp(\"\
  http\");\n            if (! xmlEl[i].childNodes[j].firstChild.nodeValue.match(url))\
  \ {\n                var pattern = \"^\" + text;\n                var title = xmlEl[i].childNodes[j].firstChild.nodeValue;\n\
  \                var nameRegexp = new RegExp(pattern, \"i\");\n                var\
  \ existDiv = document.getElementById(title);\n                if (! existDiv) {\n\
  \                    if (title.match(nameRegexp)) {\n                        var\
  \ anchor = document.createElement(\"a\");\n                        var xmlData =\n\
  \                        document.createTextNode(xmlEl[i].childNodes[j].firstChild.nodeValue);\n\
  \n                        var urls = AJAXresponse.getElementsByTagName(\"url\");\n\
  \                        anchor.setAttribute(\"href\", urls[i].firstChild.nodeValue);\n\
  \                        anchor.appendChild(xmlData);\n                        div.appendChild(anchor);\n\
  \                    }\n                }\n            }\n        }\n        document.getElementById(\"\
  data\").appendChild(div);\n    }\n}\n\nvar requestObj = readyAJAX();\nvar url =\
  \ \"http://www.braingia.org/books/javascriptsbs/bookmark.xml\";\nrequestObj.open(\"\
  GET\",url,true);\nrequestObj.send();\nvar AJAXresponse;\nrequestObj.onreadystatechange\
  \ = function() {\n    if (requestObj.readyState == 4) {\n        if (requestObj.status\
  \ == 200) {\n            AJAXresponse = requestObj.responseXML;\n            listName(\"\
  \");\n        } else {\n            alert(requestObj.statusText);\n        }\n \
  \   }\n}\nvar textEl = document.getElementById(\"textname\");\nEHandler.add(textEl,\"\
  keyup\", function() { textSearch(); } );\n\n</script>\n</body>\n</html>\n```\n\n\
  JavaScript 代码分为几个函数，我稍后将对其进行讨论。首先，代码引入了事件处理器脚本 `ehandler.js`，这是你在第 11 章 中遇到的：\n\n\
  ```html\n<script type=\"text/javascript\" src=\"ehandler.js\"></script>\n```\n\n\
  该页面的 HTML 仅包含几行。以下是 Web 表单：\n\n```html\n<form name=\"nameform\" id=\"nameform\"\
  \ action=\"\" method=\"post\">\nBookmark Search: <input id=\"textname\" name=\"\
  textname\" type=\"text\">\n</form>\n```\n\n这是用于存放书签的 `div`：\n\n```html\n<div id=\"\
  data\"></div>\n```\n\nJavaScript 部分声明了几个函数，并在主块中执行了以下代码。这段代码与你在本章中看到的代码大部分相同：它使用了\
  \ `readyAJAX()` 函数并向服务器发送了书签 XML 文件的 AJAX 请求。当收到响应时，代码调用 `listName()` 函数。\n\n除了\
  \ AJAX 代码外，Web 表单的文本框上还绑定了一个事件处理器。要处理的事件是 `keyup`，它用于检测在文本框内按下并释放按键的情况。代码如下：\n\n\
  ```javascript\nvar requestObj = readyAJAX();\nvar url = \"http://www.braingia.org/books/javascriptsbs/bookmark.xml\"\
  ;\nrequestObj.open(\"GET\",url,true);\nrequestObj.send();\nvar AJAXresponse;\nrequestObj.onreadystatechange\
  \ = function() {\n    if (requestObj.readyState == 4) {\n        if (requestObj.status\
  \ == 200) {\n            AJAXresponse = requestObj.responseXML;\n            listName(\"\
  \");\n        } else {\n            alert(requestObj.statusText);\n        }\n \
  \   }\n}\n\nvar textEl = document.getElementById(\"textname\");\nEHandler.add(textEl,\"\
  keyup\", function() { textSearch(); } );\n```\n\n处理搜索表单按键键的事件处理器存在两个函数中：`textSearch`\
  \ 和 `listName`。`textSearch` 函数负责从列表中移除书签。它调用了 `listName()` 函数。\n\n```javascript\n\
  function textSearch() {\n    var textName = document.getElementById(\"textname\"\
  );\n    var dataNode = document.getElementById(\"data\");\n    while (dataNode.hasChildNodes())\
  \ {\n        dataNode.removeChild(dataNode.firstChild);\n    }\n    listName(textName.value);\n\
  }\n```\n\n最后，`listName()` 函数包含显示代码，用于显示那些与文本框中输入的文本至少部分匹配的书签。如果文本框中没有文本，它将显示所有书签。\n\
  \n\n\n\n\n```javascript\nfunction listName(text) {\n    var xmlEl = AJAXresponse.getElementsByTagName(\"\
  bookmark\");\n    elLength = xmlEl.length;\n    for (i = 0; i < elLength; i++) {\n\
  \        var div = document.createElement(\"div\");\n        // Create the row elements\n\
