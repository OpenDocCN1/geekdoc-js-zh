  10. 修改 `number.js` 文件以添加一些文本反馈。最终的 `number.js` 文件应该如下所示：\n\n\n\n\n\n```javascript\n\
  function checkValid(eventObj) {\n    try {\n        var numField = document.forms[0][\"\
  num\"];\n        if (isNaN(numField.value)) {\n            var err = new Array(\"\
  It's not a number\",numField);\n            throw err;\n        }\n        else\
  \ if (numField.value > 100) {\n            var err = new Array(\"It's greater than\
