  \ \"#FF0000\";\n        newspan.style.fontWeight = \"bold\";\n        newspan.setAttribute(\"\
  id\",\"feedback\");\n        var parent = feedback.parentNode;\n        var newChild\
  \ = parent.replaceChild(newspan,feedback);\n        errorObject[1].style.background\
  \ = \"#FF0000\";\n        if (eventObj.preventDefault) {\n            eventObj.preventDefault();\n\
