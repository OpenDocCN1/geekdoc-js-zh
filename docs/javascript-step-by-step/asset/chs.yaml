  \            }\n            else if (numField.value < 1) {\n                throw\
  \ numField;\n            }\n            return true;\n        }\n        catch(errorObject)\
  \ {\n            errorObject.style.background = \"#FF0000\";\n            if (eventObj.preventDefault)\
  \ {\n                eventObj.preventDefault();\n            } else {\n        \
