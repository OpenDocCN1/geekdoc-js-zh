  \ `mag` 表示）。\n\n考虑 示例 8-2）中的代码（位于配套资源中的 `Listing8-2.txt` 文件）。它实现了与 示例 8-1 代码相同的结果，但是借助了一个构造模式来创建了伪类。\n\
  \n### 示例 8-2. 使用伪类组装一个 `star` 对象。\n\n```javascript\nvar star = {};\n\nfunction Star(constell,type,specclass,magnitude)\
  \ {\n    this.constellation = constell;\n    this.type = type;\n    this.spectralClass\
  \ = specclass;\n    this.mag  = magnitude;\n}\n\nstar[\"Polaris\"] = new Star(\"\
  Ursa Minor\",\"Double/Cepheid\",\"F7\",2.0);\nstar[\"Mizar\"] = new Star(\"Ursa\
  \ Major\",\"Spectroscopic Binary\",\"A1 V\",2.3);\nstar[\"Aldebaran\"] = new Star(\"\
  Taurus\",\"Irregular Variable\",\"K5 III\",0.85);\nstar[\"Rigel\"] = new Star(\"\
  Orion\",\"Supergiant with Companion\",\"B8 Ia\",0.12);\nstar[\"Castor\"] = new Star(\"\
  Gemini\",\"Multiple/Spectroscopic\",\"A1 V\",1.58);\nstar[\"Albireo\"] = new Star(\"\
  Cygnus\",\"Double\",\"K3 II\",3.1);\nstar[\"Acrux\"] = new Star(\"Crux\",\"Double\"\
  ,\"B1 IV\",0.8);\nstar[\"Gemma\"] = new Star(\"Corona Borealis\",\"Eclipsing Binary\"\
  ,\"A0 V\",2.23);\nstar[\"Procyon\"] = new Star(\"Canis Minor\",\"Double\",\"F5 IV\"\
  ,0.38);\nstar[\"Sirius\"] = new Star(\"Canis Major\",\"Double\",\"A1 V\",-1.46);\n\
  star[\"Rigil Kentaurus\"] = new Star(\"Centaurus\",\"Double\",\"G2 V\",-0.01);\n\
  star[\"Deneb\"] = new Star(\"Cygnus\",\"Supergiant\",\"A2 Ia\",1.25);\nstar[\"Vega\"\
  ] = new Star(\"Lyra\",\"White Dwarf\",\"A0 V\",0.03);\nstar[\"Altair\"] = new Star(\"\
  Aquila\",\"White Dwarf\",\"A7 V\",0.77);\n```\n\n在 示例 8-2 中用加粗显示的 `Star` 函数创建了一个用于快速构建\
  \ `star` 对象的接口。\n\n当调用该函数时，它会返回一个新的 `star` 对象：\n\n```javascript\nstar[\"Polaris\"\
  ] = new Star(\"Ursa Minor\",\"Double/Cepheid\",\"F7\",2.0);\n```\n\n尽管 示例 8-1 和\
  \ 示例 8-2 在功能上是等价的，但 [示例 8-2] 中的代码要短得多且易于理解。\n\n## 创建对象\n\n你可以在 JavaScript 中通过两种方式创建对象：\n\
  \n*   使用 `new` 关键字，如下所示：\n\n    ```javascript\n    var star = new Object;\n    ```\n\
  \n*   使用大括号，如下所示：\n\n    ```javascript\n    var star = {};\n    ```\n\n你使用哪种版本很大程度上取决于个人偏好；它们都能完成相同的任务。\n\
  \n## 为对象添加属性\n\n创建对象后，你就可以开始为其分配属性和方法。如果你只有一个 `star` 对象，你可以直接为它分配属性，如下：\n\n```javascript\n\
  star.name = \"Polaris\";\nstar.constellation = \"Ursa Minor\";\n```\n\n当你需要创建多个相关的对象时，可以按照上一节所示的示例高效地分配属性。\n\
  \n### 显示对象属性\n\n使用 `for...in` 循环，你可以遍历对象中的每个属性。尝试一下。\n\n#### 遍历对象属性\n\n1.  使用 Microsoft\
  \ Visual Studio、Eclipse 或其他编辑器编辑 `proploop.htm` 文件，该文件可以在配套资源的 Chapter08 示例文件文件夹中找到。\n\
  \n2.  在页面中，将 TO DO 注释替换为此处用加粗显示的 `for` 循环（你可以在配套资源中的 `proploop.txt` 文件中找到此代码）：\n\
  \n\n\n\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\"\
  >\n<html>\n<head>\n<title>Properties</title>\n\n<script type=\"text/javascript\"\
  >\n    var star = {};\n\n    function Star(constell,type,specclass,magnitude) {\n\
  \        this.constellation = constell;\n        this.type = type;\n        this.spectralClass\
  \ = specclass;\n        this.mag  = magnitude;\n    }\n\n    star[\"Polaris\"] =\
  \ new Star(\"Ursa Minor\",\"Double/Cepheid\",\"F7\",2.0);\n    star[\"Mizar\"] =\
  \ new Star(\"Ursa Major\",\"Spectroscopic Binary\",\"A1 V\",2.3);\n    star[\"Aldebaran\"\
  ] = new Star(\"Taurus\",\"Irregular Variable\",\"K5 III\",0.85);\n    star[\"Rigel\"\
  ] = new Star(\"Orion\",\"Supergiant with Companion\",\"B8 Ia\",0.12);\n    star[\"\
  Castor\"] = new Star(\"Gemini\",\"Multiple/Spectroscopic\",\"A1 V\",1.58);\n   \
  \ star[\"Albireo\"] = new Star(\"Cygnus\",\"Double\",\"K3 II\",3.1);\n    star[\"\
  Acrux\"] = new Star(\"Crux\",\"Double\",\"B1 IV\",0.8);\n    star[\"Gemma\"] = new\
  \ Star(\"Corona Borealis\",\"Eclipsing Binary\",\"A0 V\",2.23);\n    star[\"Procyon\"\
  ] = new Star(\"Canis Minor\",\"Double\",\"F5 IV\",0.38);\n    star[\"Sirius\"] =\
  \ new Star(\"Canis Major\",\"Double\",\"A1 V\",-1.46);\n    star[\"Rigil Kentaurus\"\
  ] = new Star(\"Centaurus\",\"Double\",\"G2 V\",-0.01);\n    star[\"Deneb\"] = new\
  \ Star(\"Cygnus\",\"Supergiant\",\"A2 Ia\",1.25);\n    star[\"Vega\"] = new Star(\"\
  Lyra\",\"White Dwarf\",\"A0 V\",0.03);\n    star[\"Altair\"] = new Star(\"Aquila\"\
  ,\"White Dwarf\",\"A7 V\",0.77);\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
  >\n\n    for (var propt in star) {\n        alert(propt);\n    }\n\n</script>\n\
  </body>\n</html>\n```\n\n3. 在网络浏览器中查看此页面。对于 `star` 对象中的每颗恒星，你都会看到一个 `alert()` 对话框，总共\
  \ 14 个。（是的，这需要点击很多次。很抱歉。）以下是你会看到的对话框类型示例：\n\n![遍历对象属性](img/httpatomoreillycomsourcemspimages748753.png.jpg)\n\
  \n这个循序渐进的练习基于之前使用伪类来定义对象属性的示例。在本例中，通过以下代码创建了一个 `star` 对象：\n\n```\nvar star = {};\n\
  ```\n\n然后，通过调用创建新的 `Star` 对象（使用伪类），为该对象赋予了几个作为单个恒星名称的属性：\n\n```\nstar[\"Polaris\"\
  ] = new Star(\"Ursa Minor\",\"Double/Cepheid\",\"F7\",2.0);\n```\n\n随后，原始 `star`\
  \ 对象的每个属性（在本例中是每颗恒星的名称）都在代码的 `<body>` 中通过 `for...in` 循环进行了列举：\n\n```\nfor (var propt\
  \ in star) {\n    alert(propt);\n}\n```\n\n你可能想知道如何获取恒星的实际属性，例如星座、亮度、类型和光谱分类。第 14\
  \ 章 向你展示了如何列举这些每一个项。\n\n### 查找属性\n\n有时你不想或不需要遍历每个属性。有时你只需要知道给定属性是否已存在于对象。你可以使用 `in`\
  \ 运算符来测试属性，如下伪代码所示：\n\n```\nif (property in object) {\n    // 在此处执行某些操作\n}\n```\n\
  \n示例 8-3 显示了一个更完整的示例（可以在伴随代码中的 Listing8-3.txt 文件中找到）。它检查 `star` 对象中是否存在恒星名称“Polaris”，如果找到了，则向其添加一个新属性。\n\
  \n示例 8-3. 查找属性。\n\n```\nvar star = {};\n\nfunction Star(constell,type,specclass,magnitude)\
  \ {\n    this.constellation = constell;\n    this.type = type;\n    this.spectralClass\
  \ = specclass;\n    this.mag  = magnitude;\n}\n\nstar[\"Polaris\"] = new Star(\"\
  Ursa Minor\",\"Double/Cepheid\",\"F7\",2.0);\nstar[\"Mizar\"] = new Star(\"Ursa\
  \ Major\",\"Spectroscopic Binary\",\"A1 V\",2.3);\nstar[\"Aldebaran\"] = new Star(\"\
  Taurus\",\"Irregular Variable\",\"K5 III\",0.85);\nstar[\"Rigel\"] = new Star(\"\
  Orion\",\"Supergiant with Companion\",\"B8 Ia\",0.12);\nstar[\"Castor\"] = new Star(\"\
  Gemini\",\"Multiple/Spectroscopic\",\"A1 V\",1.58);\nstar[\"Albireo\"] = new Star(\"\
  Cygnus\",\"Double\",\"K3 II\",3.1);\nstar[\"Acrux\"] = new Star(\"Crux\",\"Double\"\
  ,\"B1 IV\",0.8);\nstar[\"Gemma\"] = new Star(\"Corona Borealis\",\"Eclipsing Binary\"\
  ,\"A0 V\",2.23);\nstar[\"Procyon\"] = new Star(\"Canis Minor\",\"Double\",\"F5 IV\"\
  ,0.38);\nstar[\"Sirius\"] = new Star(\"Canis Major\",\"Double\",\"A1 V\",-1.46);\n\
  star[\"Rigil Kentaurus\"] = new Star(\"Centaurus\",\"Double\",\"G2 V\",-0.01);\n\
  star[\"Deneb\"] = new Star(\"Cygnus\",\"Supergiant\",\"A2 Ia\",1.25);\nstar[\"Vega\"\
  ] = new Star(\"Lyra\",\"White Dwarf\",\"A0 V\",0.03);\nstar[\"Altair\"] = new Star(\"\
  Aquila\",\"White Dwarf\",\"A7 V\",0.77);\n\nif (\"Polaris\" in star) {\n    star[\"\
  Polaris\"].aka = \"The North Star\";\n    alert(\"找到 Polaris 且也被称为 \" + star[\"\
  Polaris\"].aka);\n}\n```\n\n### 注意事项\n\n还有其他检查属性存在性的方法，本书未涵盖，例如 `!==` 运算符。\n\n##\
  \ 为对象添加方法\n\n正如你可以为对象添加属性一样，你也可以为其添加方法。例如，假设你想扩展 `Star` 类以包含一个 `show()` 方法，显示一个\
  \ `alert()` 对话框。查看以下代码（来自伴随代码中的 addingmethods.txt）：\n\n```\nfunction Star(constell,type,specclass,magnitude)\
  \ {\n    this.constellation = constell;\n    this.type = type;\n    this.spectralClass\
  \ = specclass;\n    this.mag  = magnitude;\n    this.show = function() {\n     \
  \   alert(\"hello, this is a method.\");\n    }\n}\n```\n\n调用方法，你可以这样写：\n\n```\n\
  star[\"Polaris\"].show();\n```\n\nJavaScript 的面向对象编程并不仅于此。继承、原型等高级功能在 JavaScript\
  \ 中都是可能的，但它们超出了本书的范围。MSDN 杂志发表了一篇关于这些概念的文章，你可以在 [`msdn.microsoft.com/en-us/magazine/cc13419.aspx`](http://msdn.microsoft.com/en-us/magazine/cc13419.aspx)\
  \ 找到该文章。\n\n# 更多关于数组\n\n第 4 章 介绍了数组并提供了定义它们的示例。通过数组，你可以将一组值分组到对象中，然后通过索引访问这些值。例如，你可以使用显式的\
  \ `new Array()` 构造函数（可以在伴随代码中的 morearrays.txt 中找到）：\n\n```\nvar star = new Array();\n\
  star[0] = \"Polaris\";\nstar[1] = \"Deneb\";\nstar[2] = \"Vega\";\nstar[3] = \"\
  Altair\";\n```\n\n你也可以使用隐式数组构造函数（用方括号表示）执行相同，如下：\n\n```\nvar star = [\"Polaris\"\
  , \"Deneb\", \"Vega\", \"Altair\"];\n```\n\n## *length* 属性\n\n数组的 `length` 属性返回数组元素的数量。数组包含的元素与已定义的元素之间有一个重要的区别。这里有一个简单的示例。考虑之前讨论的隐式星数组。你可以数出四个恒星名称：Polaris、Deneb、Vega\
  \ 和 Altair。`length` 属性返回相同的结果：\n\n```\nvar numStars = star.length; // star.length\
  \ 为 4.\n```\n\n`length` 属性也可以计算尚未定义或初始化的元素。这里有一个创建一个元素数量多于分配数组的示例：\n\n```\nvar myArray\
  \ = new Array(5);\n```\n\n## 数组方法\n\n\n\n\n\n本节将向你介绍 `array` 对象的一些方法。你可以在 ECMA-262\
  \ 规范中找到更多信息，参考*[`www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf`](http://www.ecma-international.org/publications/files/ECMA-ST/Ecma-262.pdf)*。\n\
  \n### 添加和删除元素\n\n你可以使用几种不同的方法向数组添加元素，可以通过将它们插入到数组开头或追加到数组末尾。\n\n使用 `concat()` 添加元素。`concat()`\
  \ 方法将元素附加到调用它的数组的末尾。要使用它，你只需为 `concat()` 方法提供包含要添加项的参数。该方法返回一个新数组，如下（此代码位于配套内容中的\
  \ `morearray.txt` 文件）：\n\n```\nvar myArray = new Array();\nmyArray[0] = \"first\"\
  ;\nmyArray[1] = \"second\";\nvar newArray = myArray.concat(\"third\");\n// newArray\
  \ is now [first,second,third]\n```\n\n你也可以将一个数组连接到另一个数组，如下所示：\n\n```\nvar myFirstArray\
  \ = [51,67];\nvar mySecondArray = [18,\"hello\",125];\nvar newArray = myFirstArray.concat(mySecondArray)\n\
  // newArray is [51,67,18,\"hello\",125]\n```\n\n#### 使用 `concat()` 添加元素\n\n1. 使用\
  \ Visual Studio、Eclipse 或其他编辑器，编辑配套内容中 Chapter08 示例文件文件夹下的 `concat.htm` 文件。\n\n\
  2. 在页面中，添加粗体字体代码（`concat.txt` 文件的第一部分）：\n\n    ```\n    <!DOCTYPE HTML PUBLIC \"\
  -//W3C//DTD HTML 4.01//EN\"\n    \"http://www.w3.org/TR/html4/strict.dtd\">\n  \
  \  <html>\n    <head>\n        <title>Concat</title>\n        <script type=\"text/javascript\"\
  >\n\n        var star = [\"Polaris\", \"Deneb\", \"Vega\", \"Altair\"];\n\n    \
  \    for (var i = 0; i < star.length; i++) {\n            alert(star[i]);\n    \
  \    }\n\n        </script>\n    </head>\n    <body>\n\n    </body>\n    </</html>\n\
  \    ```\n\n3. 保存页面并在网页浏览器中查看。对于 `star` 数组中定义的四个恒星名称中的每一个，你都会收到一个 `alert()` 对话框（所示）：\n\
  \n    ![Adding elements with concat()](img/httpatomoreillycomsourcemspimages748755.png.jpg)\n\
  \n4. 修改代码将一些额外的恒星连接到 `star` 数组上。（是的，我知道你可以直接将它们添加到 `star` 数组中，但那样太作弊了。）以下是代码（更改部分以粗体显示，位于\
  \ `concat.txt` 文件的第二部分）：\n\n    ```\n    <!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML\
  \ 4.01//EN\"\n    \"http://www.w3.org/TR/html4/strict.dtd\">\n    <html>\n    <head>\n\
  \        <title>Concat</title>\n        <script type=\"text/javascript\">\n\n  \
  \      var star = [\"Polaris\", \"Deneb\", \"Vega\", \"Altair\"];\n\n        var\
  \ newstars = [\"Aldebaran\", \"Rigel\"];\n        var morestars = star.concat(newstars);\n\
  \        var mStarLength = morestars.length;\n        for (var i = 0; i < mStarLength;\
  \ i++) {\n            alert(morestars[i]);\n        }\n\n        </script>\n   \
  \ </head>\n    <body>\n\n    </body>\n    </</html>\n    ```\n\n5. 保存并在网页浏览器中查看页面。你会收到六个\
  \ `alert()` 对话框（抱歉！），每个恒星对应一个，就像这个针对 Aldebaran 的一样：\n\n    ![Adding elements with\
  \ concat()](img/httpatomoreillycomsourcemspimages748757.png.jpg)\n\n#### 使用 `join`\
  \ 进行连接和合并\n\n`join()` 方法将数组的所有元素转换为一个连接后的字符串。该方法与 `concat()` 方法不同，后者只进行连接，而不执行任何类型转换。以下是代码：\n\
  \n```\nvar star = [\"Polaris\", \"Deneb\", \"Vega\", \"Altair\"];\nvar starString\
  \ = star.join();\n```\n\n`starString` 变量包含 Polaris,Deneb,Vega,Altair，如图 8-1 连接数组.\"\
  ) 所示。\n\n![Using join() to join an array.](img/httpatomoreillycomsourcemspimages748759.png.jpg)\n\
  \n图 8-1. 使用 `join()` 连接数组。\n\n`join()` 方法还允许你指定连接的分隔符。你可能不仅想使用逗号，还还想使用星号，如下所示：\n\
  \n```\nvar star = [\"Polaris\", \"Deneb\", \"Vega\", \"Altair\"];\nvar starString\
  \ = star.join(\"*\");\n```\n\n结果将是 Polaris*Deneb*Vega*Altair，如图 8-2 连接数组.\") 所示。\n\
  \n![Adding elements with concat()](img/httpatomoreillycomsourcemspimages748758.png.jpg)\n\
  \n图 8-2. 使用 `join()` 连接数组。\n\n\n\n\n你可能期望 `sortedNums` 变量包含 11,22,111,543，但实际上它是按字母顺序对值进行排序，如图\
  \ 8-4 对数字进行排序无效——至少如果你希望它们按数值顺序排序的话。\")所示。\n\n![尝试使用 sort() 对数字进行排序无效——至少如果你希望它们按数值顺序排序的话。](img/httpatomoreillycomsourcemspimages748765.png.jpg)\n\
  \n图 8-4 尝试使用 `sort()` 对数字进行排序无效——至少如果你希望它们按数值顺序排序的话。\n\n**遍历数组**。在 JavaScript 中，遍历数组元素主要有两种方法。在编写本文时，执行此项操作的主要跨浏览器方法是\
  \ `for()` 方法，你在目前为止读过的全书中已经见过它了。这里有一个关于其语法的快速回顾：\n\n```\nvar candies = [\"chocolate\"\
  ,\"licorice\",\"mints\"];\nfor (var i = 0; i < candies.length; i++) {\n    alert(candies[i]);\n\
  }\n```\n\n`forEach()` 方法随 ECMA-262 版本 5 引入，并被 Windows Internet Explorer 8 及更早版本以外的所有浏览器支持，它也可以遍历数组元素。`forEach()`\
  \ 的语法与 `for` 循环相似：\n\n```\nvar candies = [\"chocolate\",\"licorice\",\"mints\"];\n\
  candies.forEach(function(candy) {\n    alert(candy);\n}\n```\n\n### Note\n\n请谨慎使用\
  \ `forEach()` 方法（以及其他新方法），因为它们尚未被广泛支持。\n\n数组对象还有其他你应该了解的方法。其中你可能会遇到的一些方法列在表 8-1\
  \ 中，但你应该参考 `[`www.ecma-international.org/publications/files/ECMA-ST/ECMA-262.pdf`](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-262.pdf)`\
  \ 上的 ECMA-262get 来获取完整列表。ECMA-262 版本 5 标准中的新方法已标记。\n\n表 8-1 数组对象的选择方法\n\n| 方法 |\
  \ 说明 | ECMA-262 第 5 版新增 |\n| --- | --- | --- |\n| `reverse()` | 反转元素的顺序。 | 否 |\n\
  | `map()` | 在每个数组项上执行函数并返回一个数组。 | 是 |\n| `indexOf()` | 返回参数首次位置的索引。 | 是 |\n| `lastIndexOf()`\
  \ | 返回参数在数组中的最后一次索引。 | 是 |\n| `every()` | 在每个数组项上执行函数，只要函数持续返回 `true`。 | 是 |\n|\
  \ `filter()` | 在每个数组项上执行函数并返回一个仅包含函数返回 `true` 的项的数组。 | 是 |\n| `some()` | 在每个数组项上执行函数，直到函数返回\
  \ `false`。 | 是 |\n| `splice()` | 从数组中插入或删除元素。返回一个包含被删除元素的数组。 | 否 |\n\n# 利用内置对象\n\
  \nJavaScript 语言提供了几个实用的对象，用于协助完成 JavaScript 程序中常见的任务。你已经见过其中一些，例如 `Date`、`Number`\
  \ 和 `Math` 对象，它们在第 4 章 中介绍过。\n\n## 全局对象\n\nJavaScript 有一个全局对象，包含了已经讨论的一些方法，例如 `isNaN()`。另一个常用的全局对象方法是\
  \ `encodeURI()`、`encodeURIComponent()` 和 `eval()`，它们将在本节中讨论。\n\n### 使 URI 安全\n\n\
  `encodeURI()` 方法接收一个统一资源标识符（URI），该 URI 包含在给定 URI 方案中不允许的字符，并对其进行编码，以便根据标准使用。例如，RFC（请求评议）2396\
  \ 定义了 URI 的通用语法。`encodeURI()` 方法可用于修正以下 URI：\n\n```\nhttp://www.braingia.org/a uri\
  \ with spaces.htm\n```\n\n前述 URI 包含空格——这在 HTTP URI 中是不允许的，因此 URI 需要被编码：\n\n```\n\
  alert(encodeURI(\"http://www.braingia.org/a uri with spaces.htm\"));\n```\n\n图 8-5\
  \ 方法在 JavaScript 中正确编码 URI。\")显示了结果。\n\n![使用 encodeURI() 方法在 JavaScript 中正确编码 URI。](img/httpatomoreillycomsourcemspimages748767.png)\n\
  \n图 8-5 使用 `encodeURI()` 方法在 JavaScript 中正确编码 URI。\n\n虽然 `encodeURI()` 方法作用于整个 URI（如图\
  \ 8-5 方法在 JavaScript 中正确编码 URI.\")所示），但 `encodeURIComponent()` 方法仅作用于 URI 的部分，例如示例中的\
  \ `/a uri with spaces.htm` 部分。\n\n`encodeURI()` 和 `encodeURIComponent()` 方法都有对应的解码方法，分别为\
  \ `decodeURI()` 和 `decodeURIComponent()`。\n\n### 使用 `eval()` 方法\n\n`eval()` 方法是\
  \ JavaScript 中可以使用的最强大且最危险的方法之一。`eval()` 方法接收单个参数，由 JavaScript 引擎进行解释和执行，例如：\n\n\
  ```\neval(\"alert('hello world')\");\n```\n\n`eval()` 方法会执行 `alert` 代码，就像直接执行该代码一样。通常，你会在异步\
  \ JavaScript 和 XML（AJAX）调用中使用 `eval()` 方法，但这样做会带来安全问题，因为从 AJAX 调用返回的代码执行方式与普通代码相同，而该代码可能是恶意的。\n\
