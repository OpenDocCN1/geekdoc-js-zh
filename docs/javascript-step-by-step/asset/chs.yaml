- "# JavaScript 逐步入门指南\n\n\n\n![](img/![](httpatomoreillycomsourcemspimages748542.jpg)\n\
  \n\n\n## 编辑\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n* * *\n\n| | 致 Chris | |\n| | --Steve\
  \ Suehring | |\n\n# 关于补充文件的说明\n\n本书的补充文件和示例可以在 [`examples.oreilly.com/0790145302243-files/`](http://examples.oreilly.com/0790145302243-files/)\
  \ 找到。请使用标准的桌面网络浏览器访问这些文件，因为它们可能无法在所有的电子阅读器设备上进行访问。\n\n书中引用的所有代码文件或示例都可以在线获取。对于附带光盘的纸质书，在可能的情况下，我们发布了所有\
  \ CD/DVD 内容。请注意，尽管我们通过免费下载提供了尽可能媒体内容，但我们有时受许可限制的限制。请将任何问题或疑虑发送至 booktech@oreilly.com。\n\
  \n# 致谢\n\n每当我写一本书时，都会陷入一种徒劳的尝试中，试图感谢每一个帮助这本书成为可能的人。我最初认为我应该感谢每个人及其各自的家人，以防我再也不写书了。但现在我已经写了几本书，其中有些还写了两次，感谢每个人的紧迫感似乎减轻了。并不是人们需要更少的感谢，或者我这一切都是自己完成的——远非如此。但我不可避免地总是忘记感谢某人，尽管他们可能不会生气（谁在乎呢，这只是一本技术书），我仍然觉得很过意。\n\
  \n尽管坐在这里写这些致谢时，我仍然想感谢一些人。像既往一样，这没有特定的顺序，列表是不完整的。显然，感谢 Rebecca、Jakob 和我的家人，他们支持我在短时间内完成书籍所需的每天\
  \ 16 到 20 小工作。感谢 O’Reilly 的 Russell Jones 在整个过程中的编辑和鼓励，感谢 Studio B 的 Neil Salkind。感谢\
  \ Chris Tuescher、John Hein、Jeremy Guthrie、Jim Leu、Andy Berkvam、Dan Noah、Justin Hoerter\
  \ 和 Mark Little。所有这些人都告诉我，当我在书中感谢他们时，他们觉得有义务买一本。（如果对每个人都有效，我就去买电话簿了。）当我在寻找要感谢的人时，我也应该感谢\
  \ Jason、Kelly、John 和 Jeff 以及网页团队和我所有的同事。\n\n感谢兄弟 Bob 帮助我选择写作时的音乐。感谢 Jim Oliva 和\
  \ John Eckendorf。多个周六早晨是在边听广播边写作的，这让周六上午的工作没那么痛苦。感谢 Partners 的 Tim 和 Rob，Pat Dunn\
  \ 和 Dave Marie。感谢 Jeff Currier 为我的办公室装了一扇门。\n\n感谢向第一版发送反馈的读者。这有助于形成某些领域。\n\n在重读这些致谢后，我意识到我本应该用名字感谢每个人。那样可以提供一种合理的否认性：“是的，当我感谢\
  \ John 时，我真的指的是你，而不是另一个。”我想我还有另一个承诺过要感谢的人，但我不记得是谁了，但也同样感谢你。\n\n# 介绍 JavaScript 循序渐进，第二版\n\
  \n自 2007 年编写第一版《JavaScript 循序渐进》以来，发生了许多变化。底层 JavaScript 规范接受了重大更新；微软发布了 Windows\
  \ Internet Explorer 8——现在是 9（在我写这些文字时它即将发布）；JavaScript 开发框架已经成熟并现在无处不在；除了 Internet\
  \ Explorer 和 Firefox 之外的浏览器，如 Safari、Chrome 和移动浏览器变得更加流行。\n\n这第二版《JavaScript 循序渐进》建立在第一版的基础之上。JavaScript\
  \ 语言的底层架构很大程度上是相同的，但它的使用已变得普及，在过去的三年里巨大增长。考虑到这一点，本书的布局和涵盖范围也很大程度上保持相同，但有两个显著的例外：此版更加强调\
  \ JavaScript 事件处理，并包含了一个涵盖 JavaScript 库的全新章节。具体来说，本书重点关注 `jQuery`，它可以帮助简化 JavaScript\
  \ 开发，特别是在大型项目中。\n\n在整书中，你将发现针对最新版本 JavaScript 新功能的亮点和补充。此外，书中使用的示例在多个浏览器中经过了更严格的审查，以反映今天网络格局的现实。来自第一版的读者反馈反映在内容中，这也是添加\
  \ jQuery 和强调事件处理的动力。\n\n第一版的引言仍然具有相关性和适用性，因此我将其包含在这里。\n\nJavaScript 是 Web 应用开发不可或缺的语言，无论你是为网页添加交互性还是创建一个整个应用程序。没有\
  \ JavaScript，今天的网络将是另一个样子。\n\nJavaScript 是一种基于标准的语言，具有正式的规范；然而，正如任何 Web 开发者告诉你的的一样，几乎每个网络浏览器对该规范的解释都不同，这使得\
  \ Web 开发者的工作变得更加困难。幸运的是，大多数浏览器在对 JavaScript 核心功能的支持和解释上趋于一致。\n\n\n\n\n本书提供了 JavaScript\
  \ 的入门介绍，包括其的一些核心函数以及较新的特性和范式，例如异步 JavaScript 和 XML（AJAX）。当今的 Web 用户依赖于许多不同的平台和浏览器来查看网页内容。这一事实贯穿于书中各个部分的开发，因此你将看到多个浏览器的截图，并看到书中侧重于基于标准而非专有的\
  \ JavaScript 开发。\n\n书的第一部分探讨了 JavaScript，并帮助你开始开发 JavaScript 应用程序。你不需要任何特定的工具就可以进行\
  \ JavaScript 开发，因此你将看到如何在 `Microsoft Visual Studio`、`Eclipse` 中，甚至在 `Notepad`（或任何文本编辑器）中创建\
  \ JavaScript 文件。接下来的，书籍将探讨 JavaScript 的核心语言和函数，随后探索 JavaScript 与 Web 浏览器之间的关系。最后，你将看到\
  \ AJAX 的演示，并学习如何构建动态搜索表单。\n\n书的最后一部分重点介绍了 JavaScript 框架和库，特别关注了 `jQuery` 和 `jQuery\
  \ UI`。\n\n# 谁应该读这本书？\n\n本书面向初级 JavaScript 程序员————即那些对学习现代 JavaScript 编程基础感兴趣的人：语言语法、它在浏览器中如何工作、常见的跨浏览器问题是什么，以及如何利用\
  \ AJAX 和如 `jQuery` 等第三方库为你的网页添加交互性。\n\n# 本书的特点和约定\n\n本书将一步步带你完成学习 JavaScript 编程语言的过程。从书的开始开始遵循每个示例和练习，将获得最大的收益，帮助你获取关于\
  \ JavaScript 编程语言的知识。\n\n如果你已经对 JavaScript 有了一定的了解，可能会想跳过本书的第一章。然而，第 1 章 详细介绍了 JavaScript\
  \ 的一些背景历史以及本书的一些底层假设，这两者都可能有助于为后续内容的讨论建立框架。第 2 章 向你展示了如何开始使用 JavaScript 编程。如果你已经熟悉\
  \ Web 开发，你可能已经有了一个 Web 开发程序，因此你可能也想跳过 第 2 章。尽管如此，你应该熟悉在 [第 2 章] 中创建 JavaScript 程序的模式。\n\
  \n书中包含目录，可以帮助你快速定位特定章节。每个章节都包含其所涵盖材料的详细列表。\n\n此外，你还可以下载书中显示的许多示例的源代码。\n\n| 约定 |\
  \ 含义 |\n| --- | --- |\n| 列表 | 逐步练习由从 1 开始步骤的程序化列表表示。 |\n| 另请参考 | 这些段落引导你查看特定主题的其他信息源。\
  \ |\n| 提示/备注/重要 | 提示和备注包含了对特定主题可能有帮助的额外信息。 |\n| `内联代码` | 内联代码——即出现在段落中的代码——用*斜体*字体显示。\
  \ |\n| `代码块` | 代码块使用不同的字体显示以突出代码。 |\n\n# 随附内容包含什么\n\n书中附带的可下载随附内容包含了书中显示的所有示例和练习的重要源代码。下载内容包含按章节划分的项目和文件——每个章节一个目录。每个章节目录都包含该章节中使用的逐步练习。\n\
  \n由于 JavaScript 通常依赖于周围的网页，因此逐步练习的源代码已经在目录进行了拆分。这使得你能够复制粘贴大部分重复的 HTML，并将精力集中在输入示例中的\
  \ JavaScript。\n\n每个章节目录还包含一个 `CompletedCode` 子目录，其中包含整个示例。你可以打开 `CompletedCode`\
  \ 文件夹中的文件，查看章节中布局的示例。\n\n## 下载随附内容\n\n书中的大多数章节都包含练习，让你交互式地尝试正文中学习的新材料。所有示例项目和文件都可以从\
