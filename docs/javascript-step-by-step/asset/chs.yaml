  \ 站点”。这将打开“新建 Web 站点”对话框。\n\n\n\n\n2. 选择 ASP.NET Web Site（语言选择——Visual Basic 或 Visual\
  \ C#——并不重要），如图所示。将名称更改为 `Chapter2`，并设置适用于你配置的路径。信息无误后，点击 OK。Visual Studio 将创建一个新项目。\n\
