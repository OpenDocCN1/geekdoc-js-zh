  function cToF(celsius)\n{\n  var cTemp = celsius;\n  var cToFahr = cTemp * 9 / 5\
  \ + 32;\n  var message = cTemp+'\\xB0C is ' + cToFahr + ' \\xB0F.';\n  console.log(message);\n\
  }\n\nfunction fToC(fahrenheit)\n{\n  var fTemp = fahrenheit;\n  var fToCel = (fTemp\
  \ - 32) * 5 / 9;\n  var message = fTemp+'\\xB0F is ' + fToCel + '\\xB0C.';\n  console.log(message);\n\
