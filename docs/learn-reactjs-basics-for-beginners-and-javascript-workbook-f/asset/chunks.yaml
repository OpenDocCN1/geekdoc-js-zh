  trans: "\n这是第一个 React 组件，作为应用的入口点。它将渲染 Hello World。\n\n在你的 `App.js` 文件中，粘贴以下代码。\n\
    \n`App.js`\n\n```javascript\nimport React, {Component} from 'react';\n\nclass\
    \ App extends Component {\n  render() {\n    return (\n      <div>\n        <h1>HelloWorld</h1>\n\
    \      </div>\n    );\n  }\n}\n\nexport default App;\n```\n\n![Image 8.jpg](img/Image00004.jpg)\n\
    \n现在我们必须导入并渲染此组件到根 `App` 元素中，以便在浏览器中看到它。\n\n`main.js`\n\n```javascript\nimport\
    \ React from 'react';\nimport ReactDOM from 'react-dom';\nimport App from './App.js';\n\
    \nReactDOM.render(<App/>, document.getElementById('app'));\n```\n\n### 创建 `.babelrc`\
    \ 文件\n\n向你的 `.babelrc` 文件添加以下代码。\n\n`.babelrc`\n```json\n{\n  \"presets\": [\n\
    \    \"@babel/preset-env\",\n    \"@babel/preset-react\"\n  ]\n}\n```\n\n现在是时候启动服务器了。要启动服务器，在命令行提示符中输入以下命令，确保它与\
    \ React 文件在同一文件夹中。\n\n`npm start`\n\n此命令将显示端口号，你需要打开浏览器窗口。打开后，你将看到以下内容：\n\n![Image\
    \ 9.jpg](img/Image00005.jpg)\n![](img/Image00006.jpg)\n![Image 10.jpg](img/Image00007.jpg)\n\
    \nReact 应用的根目录包含许多文件和目录。以下是一些示例：\n\n1. `node_modules`: 它包含了 React 库以及任何可能需要的其他第三方库。\n\
    2. `public`: 它包含应用的公共资源。它包含 `index.html` 文件，React 默认会将应用程序挂载到 `<div id=\"root\"\
    >` 元素上。\n3. `src`: 此文件夹中有多个文件，包括 `App.css`、`App.js`、`App.test.js`、`index.css`、`index.js`\
    \ 和 `serviceWorker.js`。`App.js` 文件将负责始终显示 React 输出屏幕。\n4. `package-lock.json`:\
    \ 每当 `npm` 包更改 `package.json` 或 `node_modules` 树时，它会自动生成。它是无法发布的。如果发现它位于顶层包以外的位置，它将被忽略。\n\
    5. `package.json`: 它包含了项目元数据信息。它为 `npm` 提供了允许其识别项目依赖关系以及项目本身的信息。\n6. `README.md`:\
    \ 它还包含了 React 主题的文档。\n\n## React JSX\n\n众所周知，所有的 React 组件都有一个 `render` 函数。\n\n\
    React 组件的 HTML 输出由 `render` 函数指定。\n\nJavaScript 扩展 `JSX` 允许你编写看起来像 HTML 的 JavaScript\
    \ 代码。`JSX` 是一种 React 特有的 HTML 类语法，它扩展了 ECMAScript，允许 HTML 类语法与 JavaScript/React\
    \ 编程共存。\n\n预处理器（如像 `Babel` 的转译器）使用这种语法将 HTML 类语法转换为 JavaScript 引擎可以理解的标准 JavaScript\
    \ 对象。\n\n它允许你将 HTML/XML 类结构（例如 DOM 类树形结构）放置在与 JavaScript 代码相同的文件中，然后预处理器将这些表达式转换为实际的\
    \ JavaScript 代码。就像 XML/HTML 标签一样，`JSX` 标签也有标签名、属性和子。\n\n### 为什么使用 JSX？\n\n- 它比\
    \ JavaScript 更快，因为它在翻译成 JavaScript 之前对代码进行了优化。\n- React 并不是通过将 HTML 和逻辑放在不同的文件中来分离技术，而是使用同时包含两者的组件。\n\
    - 它是类型安全的，因为大多数问题在编译期间就会被发现。\n- 它简化了创建模板的过程。\n\n### JSX 中的嵌套元素\n\n如果你想使用多个元素，必须将它们封装在一个容器元素中。这里\
    \ `div` 元素被用作三个嵌套项的容器元素。\n\n`App.JSX`\n\n```javascript\nimport React, { Component\
    \ } from 'react';\n\nclass App extends Component {\n  render() {\n    return (\n\
    \      <div>\n        <h1>Hello World !!</h1>\n        <h2>This is TutorialandExample</h2>\n\
    \        <p>Website with the best tutorials.</p>\n      </div>\n    );\n  }\n\
    }\n\nexport default App;\n```\n\n### JSX 属性\n\n`JSX` 中 HTML 元素的特性与普通 HTML 相同。在\
    \ `JSX` 中，属性使用驼峰命名，而不是 HTML 的传统命名模式，例如 HTML 中的 `class` 在 JSX 中变更为 `className`。这是因为在\
    \ JavaScript 中，`class` 关键字是一个保留关键字。在 `JSX` 中也可以使用自定义属性。对于自定义属性，我们必须使用 `data-prefix`。\n\
    \n自定义属性 `data-customAttr` 用于下面示例中 `<p>` 标签的属性。\n\n例如：\n\n```javascript\nimport\
    \ React, { Component } from 'react';\n\nclass App extends Component {\n  render()\
    \ {\n    return (\n      <div>\n        <h1>Hello World !!</h1>\n        <h2>This\
    \ is TutorialandExample</h2>\n        <p data-customAttr=\"hello\">Website with\
    \ the best tutorials.</p>\n      </div>\n    );\n  }\n}\n\nexport default App;\n\
    ```\n\n### JavaScript 表达式\n\nJavaScript 表达式可以使用 `JSX` 内部。我们需要用大括号 `{}` 将其包裹。\n\
    \n下一个示例更清楚地展示了这一点。\n\n示例：\n\n```javascript\nimport React, { Component } from 'react';\n\
    \nclass App extends Component {\n  render() {\n    return (\n      <div>\n   \
    \     <h1>{1 + 2}</h1>\n        <h1>Hello World</h1>\n        <h2>This is TutorialandExample</h2>\n\
    \        <p data-customAttr=\"hello\">Website with the best tutorials.</p>\n \
    \     </div>\n    );\n  }\n}\n```\n\n（注：由于原文中后续大量关于“JSX 属性”、“嵌套元素”、“JavaScript\
    \ 表达式”的章节内容完全重复，已按指令要求不再重复输出。）\n"
- fmt: "\nThe following are the two types of components in ReactJS:\n\n1. `Functional\
    \ Components` (Stateless Components).\n2. `Class Components` (Stateful component).\n\
    \n## Functional Components\n\nBecause they do not hold or maintain state, functional\
    \ components are sometimes known as stateless components.\n\nFunctional components\
    \ are a means of writing components that only have a `render` method and no state.\
    \ They are simple JavaScript functions that may or may not accept data as parameters.\n\
    \nWe can also write a function that takes `props` (properties) as input and returns\
    \ the displayed result.\n\nThe following is an example of stateless components:\n\
    \n### Example\n\n```javascript\nimport React, { Component } from 'react'; \n\n\
    class App extends React.Component { \n    render() { \n      return ( \n     \
    \     <div> \n            <First/> \n            <Second/> \n          </div>\
    \    \n      ); \n    } \n} \n\nclass First extends React.Component { \n    render()\
    \ { \n      return ( \n          <div>   \n            <h1>Stateless Components</h1>\
    \ \n          </div> \n      ); \n    } \n} \n\nclass Second extends React.Component\
    \ { \n    render() {   \n      return ( \n          <div> \n            <h2>www.tutorialandexample.com</h2>\
    \ \n            <p>This website has several tutorials.</p> \n          </div>\
    \ \n      );    \n    } \n}   \n\nexport default App;\n```\n\n## Class Components\n\
    \nBecause they retain or manage local state, class components are sometimes known\
    \ as Stateful Components. These components are more complicated than those that\
    \ are stateless.\n\nIt necessitates extending `React`. A class that extends the\
    \ component and has a `render` function can be defined to build the Class.\n\n\
    The following is an example of a class component:\n\n### Example\n\nIn this example,\
    \ we'll create a list of unordered components in which we'll dynamically append\
    \ `Name` for each object in the `data` array. EcmaScript6 arrow syntax (`=>`)\
    \ is used here, which is significantly cleaner than the old JavaScript syntax.\
    \ It aids us in writing less lines of code for our elements. It comes in handy\
    \ when we need to create a large number of item lists.\n\n```javascript\nimport\
    \ React, { Component } from 'react'; \n\nclass App extends React.Component { \n\
    \  constructor() { \n    super(); \n    this.state = { \n      data:  \n     \
    \   [ \n          {              \n            \"name\":\"Arun\" \n          },\
    \ \n          {              \n            \"name\":\"Anup\"            \n   \
    \       }, \n          {   \n            \"name\":\"Anil\"           \n      \
    \    } \n        ] \n    } \n  } \n  render() { \n    return ( \n        <div>\
    \ \n          <Name/> \n          <ul>          \n            {this.state.data.map((item)\
    \ => <List data ={item} />)}      \n          </ul>      \n        </div>  \n\
    \    ); \n  }\n}\n\nclass Name extends React.Component { \n  render() {  \n  \
    \  return ( \n      <div> \n        <h1>Student</h1> \n      </div> \n    ); \n\
    \  }\n}\n\nclass List extends React.Component { \n  render() { \n    return (\
    \ \n      <ul>      \n        <li>{this.props.data.name}</li> \n      </ul> \n\
    \    ); \n  }\n}\n\nexport default App;\n```\n\n## Pros and Cons of ReactJS\n\n\
    The following are some benefits and drawbacks of ReactJS:\n\n### Benefits of ReactJS\n\
    \n1. **Easy to Learn and Use**: ReactJS is a simple to use and learn framework.\
    \ It comes with a lot of documentation, training materials, and tutorials. It\
    \ is simple to comprehend for a developer with JavaScript experience who can immediately\
    \ begin developing web applications in days. It is one of the JavaScript frameworks\
    \ and is the view portion in MVC (Model-View-Controller) model. We can't say ReactJS\
    \ is feature-rich, but it does have the benefit of an open-source user interface\
    \ (UI) library which aids in task execution.\n2. **Creating Dynamic applications\
    \ becomes easier**: Creating dynamic apps using HTML was difficult due to the\
    \ complicated coding, but ReactJS has overcome this problem and made it simple.\
    \ It needs less coding and offers more features. It makes use of the `JSX` extension,\
    \ which is a syntax that allows HTML tags to render certain components. Machine-readable\
    \ codes are also supported.\n3. **Reusable Components**: The ReactJS web application\
    \ is made up of several components, each with its own logic and controls. These\
    \ are in charge of producing short, reusable HTML code that can be reused. This\
    \ reusable code makes it easier to design and maintain applications. ReactJS uses\
    \ a virtual DOM-based technique to fill the HTML with data. Because it simply\
    \ alters elements of particular DOMs rather than reloading it every time, the\
    \ virtual DOM is quick.\n4. **Performance Enhancement**: Because of Virtual DOM,\
    \ ReactJS' speed has increased. ReactJS is extremely fast. ReactJS becomes significantly\
    \ better than other frameworks as a result of this functionality. There is a concept\
    \ of managing virtual DOM behind this rationale. The Document Object Model (DOM)\
    \ is a cross-platform programming API for HTML, XML, and XHTML. The DOM is exclusively\
    \ contained within memory. As a result, anytime we build a component we don't\
    \ write it to the DOM directly; instead we write virtual components that transform\
    \ into the DOM, resulting in smoother and faster performance.\n5. **Handy Tools\
    \ Support**: ReactJS is also popular due to the availability of a useful collection\
    \ of tools. These technologies improve readability and make the developer's job\
    \ easier. These tools are Chrome and Firefox dev extensions that allow you to\
    \ investigate the hierarchies of react components in the virtual DOM.\n6. **Known\
    \ to be SEO friendly**: When it comes to SEO, there is a problem with standard\
    \ frameworks. Search engines have a hard time reading massive JavaScript apps\
    \ in general. ReactJS solves this problem, making it easier for developers to\
    \ navigate across numerous search engines. That's why React.js apps may run on\
    \ the server with virtual DOM rendering and returning a standard page to the browser.\
    \ own7. **The benefit of having JavaScript library**: ReactJS provides a rich\
    \ range of JavaScript libraries, which is why it is so popular among web developers.\
    \ The JavaScript library gives web developers more freedom to do things their\
    \ own.\n8. **Scope for Code Testing**: ReactJS applications are simple to start\
    \ up. It gives developers the ability to swiftly test and debug their programmes\
    \ using native tools.\n\n### Disadvantages of ReactJS\n\n1. **High Pace development**:\
    \ It serves as both a benefit and a detriment. It's a disadvantage since the environment\
    \ changes so quickly that most developers want to have to relearn new ways of\
    \ doing things on a frequent basis. It might be difficult to keep up with all\
    \ of these changes and constant updates. They have to keep their abilities up\
    \ to date and learn new ways of doing things on a regular basis.\n2. **Poor Documentation**:\
    \ Another common drawback of continuously changing technologies is this. Due to\
    \ the rapid updating of react technologies, there is a lack of good documentation.\n\
    3. **View Part**: Only the app's UI layers are handled by ReactJS. As a result,\
    \ other technologies must be chosen in order to provide a complete set of tooling\
    \ for the project's development.\n4. **JSX as a barrier**: ReactJS makes use of\
    \ `JSX`, a syntax extension that allows HTML and JavaScript to be mixed together.\
    \ This strategy is advantageous, but some members of the development community,\
    \ particularly new developers, regard `JSX` as a barrier. Developers disagree\
    \ about how difficult `JSX` is to learn.\n\n## Features of ReactJS\n\nReactJS\
    \ is currently gaining popularity among developers as the greatest JavaScript\
    \ framework. It's critical for the front-end ecosystem's success. The following\
    \ are some of the most important aspects of ReactJS:\n\n* `JSX`\n* `Components`\n\
    * One-way data binding\n* `Virtual DOM`\n"
  raw: 'The following are the two types of components in ReactJS:


    1.  Functional Components (Stateless Components).


    2.  Class Components (Stateful component).


    Functional Components


    Because they do not hold or maintain state, functional components are sometimes
    known as stateless components.


    Functional components are a means of writing components that only have a render
    method and no state.


    They are simple JavaScript functions that may or may not accept data as parameters.


    We can also write a function that takes props (properties) as input and returns
    the displayed result.


    The following is an example of stateless components:


    Example


    import React, { Component } from ''react''; 


    class App extends React.Component { 


        render() { 


           return ( 


              <div> 


                 <First/> 


                 <Second/> 


              </div>   


           ); 


        } 


    } 


    class First extends React.Component { 


        render() { 


           return ( 


              <div>   


                 <h1>Stateless Components</h1> 


              </div> 


           ); 


        } 


    } 


    class Second extends React.Component { 


        render() {   


           return ( 


              <div> 


                 <h2>www.tutorialandexample.com</h2> 


                 <p>This website has several tutorials.</p> 


              </div> 


           );   


        } 


    }   


    export default App;


    Class Components


    Because they retain or manage local state, class components are sometimes known
    as Stateful Components.


    These components are more complicated than those that are stateless.


    It necessitates extending React.


    A class that extends the component and has a render function can be defined to
    build the Class.


    The following is an example of a class component:.


    Example:


    In this example, we''ll create a list of unordered components in which we''ll
    dynamically append Name for each object in the data array. EcmaScript6 arrow syntax
    (=>) is used here, which is significantly cleaner than the old JavaScript syntax.
    It aids us in writing less lines of code for our elements. It comes in handy when
    we need to create a large number of item lists.


    import React, { Component } from ''react''; 


    class App extends React.Component { 


      constructor() { 


           super(); 


           this.state = { 


              data:  


              [ 


                 {            


                    "name":"Arun" 


                 }, 


                 {           


                    "name":"Anup"            


                 }, 


                 {   


                    "name":"Anil"         


                 } 


              ] 


           } 


        } 


        render() { 


           return ( 


              <div> 


                 <Name/> 


                 <ul>           


                     {this.state.data.map((item) => <List data = {item} />)}          


                 </ul>   


              </div> 


           ); 


        } 


    } 


    class Name extends React.Component { 


        render() {   


           return ( 


              <div> 


                 <h1>Student Names</h1> 


              </div> 


           ); 


        } 


    }   


    class List extends React.Component { 


        render() { 


           return ( 


              <ul>           


                 <li>{this.props.data.name}</li>  


              </ul> 


           );   


        } 


    } 


    export default App;


    Pros and Cons of ReactJS


    The following are some of the benefits and drawbacks of ReactJS:


    Benefits of ReactJS


    1.  Easy to - Learn and Use:


    ReactJS is a simple to use and learn framework. It comes with a lot of documentation,
    training materials, and tutorials.


    It is simple to comprehend for a developer with a JavaScript experience who can
    immediately begin developing web applications in a matter of days.


    It is one of the JavaScript frameworks and is the V (view portion) in the MVC
    (Model-View-Controller) model.


    We can''t say ReactJS is feature-rich, but it does have the benefit of an open-source
    JavaScript user interface (UI) library, which aids in task execution.


    2.  Creating Dynamic web - applications becomes easier:


    Creating dynamic web apps using HTML strings was difficult due to the complicated
    coding necessary, but ReactJS has overcome this problem and made it simple.


    It needs less coding and offers more features.


    It makes use of the JSX (JavaScript) extension, which is a syntax that allows
    HTML quotes and HTML tag syntax to render certain subcomponents.


    Machine-readable codes are also supported.


    3.  Reusable Components:


    The ReactJS web application is made up of several components, each with its own
    logic and controls.


    These are in charge of producing a short, reusable HTML code that can be reused.


    This reusable code makes it easier to design and maintain applications.


    ReactJS uses a virtual DOM-based technique to fill the HTML DOM with data.


    Because it simply alters the elements of particular DOMs rather than reloading
    it every time, the virtual DOM is quick.


    4.  Performance Enhancement:


    Because of Virtual DOM, ReactJS'' speed has increased.


    ReactJS is extremely fast.


    ReactJS becomes significantly better than other frameworks as a result of this
    functionality.


    There is a concept of managing virtual DOM behind this rationale.


    The Document Object Model (DOM) is a cross-platform computer programming API for
    HTML, XML, and XHTML.


    The DOM is exclusively contained within memory.


    As a result, anytime we build a component, we don''t write it to the DOM directly;
    instead, we write virtual components that transform into the DOM, resulting in
    smoother and faster performance.


    5.  Handy Tools Support


    ReactJS is also popular due to the availability of a useful collection of tools.


    These technologies improve readability and make the developer''s job easier.


    These tools are Chrome and Firefox dev extensions that allow you to investigate
    the hierarchies of react components in the virtual DOM.


    6.  Known to be - SEO friendly:


    When it comes to SEO, there is a problem with standard frameworks.


    Search engines have a hard time reading massive JavaScript apps in general. ReactJS
    solves this problem, making it easier for developers to navigate across numerous
    search engines.


    That''s why React.js apps may run on the server, with the virtual DOM rendering
    and returning a standard page to the browser.


    7.  The benefit - of having - JavaScript library:


    ReactJS provides a rich range of JavaScript libraries, which is why it is so popular
    among web developers.


    The JavaScript library gives web developers more freedom to do things their own.


    8.  Scope for - Code Testing


    ReactJS applications are simple to start up.


    It gives developers with the ability to swiftly test and debug their programmes
    using native tools.


    Disadvantages of ReactJS


    1.  High Pace development


    It serves as both a benefit and a detriment.


    It''s a disadvantage since the environment changes so quickly that most developers
    don''t want to have to relearn new ways of doing things on a frequent basis.


    It might be difficult to keep up with all of these changes and constant updates.


    They had to keep their abilities up to date and learn new ways of doing things
    on a regular basis.


    2.  Poor Documentation


    Another common drawback of continuously changing technologies is this.


    Due to the rapid updating of react technologies, there is a lack of good documentation.


    3.  View Part


    Only the app''s UI layers are handled by ReactJS.


    As a result, other technologies must be chosen in order to provide a complete
    set of tooling for the project''s development.


    4.  JSX - as a barrier


    ReactJS makes use of JSX, a syntax extension that allows HTML and JavaScript to
    be mixed together.


    This strategy is advantageous, but some members of the development community,
    particularly new developers, regard JSX as a barrier.


    Developers disagree about how difficult JSX is to learn.


    Features of ReactJS


    ReactJS is currently gaining popularity among developers as the greatest JavaScript
    framework. It''s critical to the front-end ecosystem''s success.


    The following are some of the most important aspects of ReactJS:


    *   JSX


    *   Components


    *   One-way data binding


    *   Virtual DOM'
