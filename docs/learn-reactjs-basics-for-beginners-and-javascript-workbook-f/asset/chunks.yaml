- fmt: "\nDifference - ReactJS - React Native\n\n![](Image00013.jpg)\n\n![](Image00014.jpg)\n\
    \n# React State\n\nThe state is a changeable structure that holds data or information\
    \ about the component.\n\nA component's status can be altered over time. The status\
    \ changes over time as a result of user interaction or system events.\n\nStateful\
    \ components are components that have a state. It's an important part of the React\
    \ component because it determines how it behaves and renders. They're also in\
    \ charge of making a component lively and engaging.\n\nThe goal of a state is\
    \ to keep things as simple as possible.\n\nThe `setState()` method can be used\
    \ to change the status, and calling it will cause the UI to update.\n\nThe local\
    \ state or information is represented by a state. It can be directly updated or\
    \ accessed by the component or from within the component.\n\nWe must utilise the\
    \ `getInitialState()` method to set an initial state before any interaction takes\
    \ place.\n\nFor example, if we have five components that all require data or information\
    \ from the state, we'll need to develop a container component to hold the state\
    \ for them all.\n\n## Defining the State\n\nWe must first specify a default state\
    \ of values for defining the component's initial state before we can define a\
    \ state.\n\nAdd a class function `Object() { [native code] }` that uses `this.state`\
    \ to assign an initial state. The `render()` method can render the `this.state`\
    \ attribute.\n\n### Example:\n\nThe following example demonstrates how to create\
    \ a Stateful component using ES6 syntax:\n\n```javascript\nimport React, { Component\
    \ } from 'react'; \n\nclass App extends React.Component { \n  constructor() {\n\
    \    super()\n    this.state = { displayBio: true }\n  }\n\n  render() {\n   \
    \ const bio = this.state.displayBio ? ( \n      <div>\n        <p><h3>This is\
    \ tutorialexample website which provides you lot of tutorials.</h3></p>\n    \
    \  </div>\n    ) : null;\n    return (\n      <div>\n        <h1> Hello World\
    \ !!!!!!</h1>\n        { bio }\n      </div>\n    )\n  }\n}\n\nexport default\
    \ App;\n```\n\nIt is necessary to execute the `super()` method in the function\
    \ `Object() { [native code] }` to set the state. This is due to the fact that\
    \ `this.state` is uninitialized before the `super()` method is called.\n\n## Changing\
    \ the State\n\nThe component's state can be updated by calling `setState()` and\
    \ supplying a new state object as an argument. Now, in the aforementioned example,\
    \ build a new method `toggleDisplayBio()` and bind this keyword to it; otherwise,\
    \ it will not be accessible inside the `toggleDisplayBio()` method.\n\n```javascript\n\
    this.toggleDisplayBio=this.toggleDisplayBio.bind(this)\n```\n\n### Example:\n\n\
    We're going to add a button to the `render()` method in the example below. The\
    \ `toggleDisplayBio()` method is called when the button is pressed, and it displays\
    \ the specified output.\n\n```javascript\nimport React, { Component } from 'react';\
    \ \n\nclass App extends React.Component {\n  constructor() {\n    super()\n  \
    \  this.state = { displayBio: false }\n    console.log('Component this', this)\n\
    \    this.toggleDisplayBio = this.toggleDisplayBio.bind(this)\n  }\n\n  toggleDisplayBio(){\n\
    \    this.setState({displayBio: !this.state.displayBio});\n  }\n\n  render() {\n\
    \    return (\n      <div>\n        <h1>!! Hello World !!</h1>\n        {\n  \
    \        this.state.displayBio ? (\n            <div>\n              <p><h4>This\
    \ is tutoriaexample website that has a lot of tutorials. This website provides\
    \ you a better source of learning.</h4></p>\n              <button onClick={this.toggleDisplayBio}>\
    \ Show Less </button>\n            </div> \n          ) : (\n            <div>\n\
    \              <button onClick={this.toggleDisplayBio}> Read More </button>\n\
    \            </div>\n          )\n        }\n      </div>\n    )\n  }\n}\n\nexport\
    \ default App\n```\n\n# React Props\n\nThe term \"properties\" is abbreviated\
    \ as \"prop.\" Because props are immutable, state and props are fundamentally\
    \ different. Props are components that can only be read. It's the object that\
    \ keeps track of a tag's attribute value, and it works similarly to HTML elements.\
    \ It facilitates the transfer of data from one component to another. Props are\
    \ comparable to function arguments in that they are supplied to the component\
    \ in the same way that function arguments are passed to the function.\n\nThe `props`\
    \ inside the component can't be changed. Within the components, we may add props,\
    \ which are attributes. These properties are exposed as `this.props` in the component\
    \ and are used to render dynamic data in our `render` method.\n\nWhen you need\
    \ immutable data in a component, add the `reactDom.render()` method to the ReactJS\
    \ project's `main.js` file and utilise that file inside the component you need\
    \ it in.\n\n### Example:\n\n**App.js**\n```javascript\nimport React, { Component\
    \ } from 'react';\nclass App extends React.Component {\n  render() {\n    return\
    \ (\n      <div>\n        <h1> Hello { this.props.name } </h1>\n        <p> <h4>\
    \ This is tutorialexample website which provides you lot of tutorials </h4></p>\n\
    \      </div>\n    );\n  }\n}\nexport default App;\n```\n\n**Main.js**\n```javascript\n\
    import React from 'react';\nimport ReactDOM from 'react-dom';\nimport App from\
    \ './App.js';\nReactDOM.render(<App name = \"World\" />, document.getElementById('app'));\n\
    ```\n\n## Default Props\n\nIt is not required to include props in the `reactDom.render()`\
    \ element at all times. Default props can also be set directly on the component\
    \ function `Object() { [native code] }`. In the following example, it is well\
    \ explained:\n\n### Example:\n\n```javascript\nimport React, { Component } from\
    \ 'react';\nclass App extends React.Component {\n  render() {\n    return (\n\
    \      <div>\n        <h1>Hello</h1>\n        <h2>Default Props</h2>\n       \
    \ <h3>Welcome to {this.props.name}</h3>\n        <p>tutorialexample provides you\
    \ lot of tutorials.</p>\n      </div>\n    );\n  }\n}\nApp.defaultProps = {\n\
    \  name: \"tutorialexample\"\n}\nexport default App;\n```\n\n**Main.js**\n```javascript\n\
    import React from 'react';\nimport ReactDOM from 'react-dom';\nimport App from\
    \ './App.js';\nReactDOM.render(<App/>, document.getElementById('app'));\n```\n\
    \n# State and Props\n\nIn the app, both state and props can be merged. Props can\
    \ be used to set the state in the parent component and then provide it to the\
    \ child component.\n\n### Example:\n\n**App.js**\n```javascript\nimport React,\
    \ { Component } from 'react';\nclass App extends React.Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = {\n      name: \"tutorialexample\",\n\
    \    }\n  }\n\n  render() {\n    return (\n      <div>\n        <Tutorial tutorialProp={this.state.name}/>\n\
    \      </div>\n    );\n  }\n}\n\nclass Tutorial extends React.Component {\n  render()\
    \ {\n    return (\n      <div>\n        <h1>State & Props</h1>\n        <h1>Welcome\
    \ to {this.props.tutorialProp}</h1>\n        <p>tutorialexample provides you lot\
    \ of tutorials.</p>\n      </div>\n    );\n  }\n}\nexport default App;\n```\n\n\
    **Main.js**\n```javascript\nimport React from 'react';\nimport ReactDOM from 'react-dom';\n\
    import App from './App.js';\nReactDOM.render(<App/>, document.getElementById('app'));\n\
    ```\n\n# React Props Validation\n\nProps are a good way to pass read-only attributes\
    \ to react components, as we all know. Proper use of the props is necessary in\
    \ the component. If it is not utilised correctly, the component's behaviour may\
    \ not be expected. As a result, props validation is critical for enhancing react\
    \ components. Props validation is a tool that aids developers in avoiding faults\
    \ and problems in the future. It improves the readability of the code.\n\nPropTypes\
    \ is a specific property used in React components that aids in bug detection by\
    \ checking data types of values supplied by props, however it is not required\
    \ to define components with PropTypes.\n\n## Validating Props\n\nThe react component's\
    \ props are validated using `App.propTypes`. When an invalid type passes any of\
    \ the props, the JavaScript console will display warnings. You'll configure the\
    \ `App.defaultProps` after you've explained the validation rules.\n\n### Syntax:\n\
    \n```javascript\nclass App extends React.Component {\n  render() {}\n}\nComponent.propTypes\
    \ = { /*Definition */};\n```\n\n### Example:\n\nThere is an App component in this\
    \ example that provides all of the props that we need. `App.propTypes` is used\
    \ to validate the props in this case. You must include the line `import PropTypes\
    \ from ‘prop-types'` in the App.js file to validate the props.\n\n**App.js**\n\
    ```javascript\nimport React, { Component } from 'react';\nimport PropTypes from\
    \ 'prop-types';\n\nclass App extends React.Component {\n  render() {\n    return\
    \ (\n      <div>\n        <h1>ReactJS Props validation example</h1>\n        <table>\n\
    \          <tr>\n            <th>Type</th>\n            <th>Value</th>\n     \
    \       <th>Validity</th>\n          </tr>\n          <tr>\n            <td>Boolean</td>\n\
    \          </tr>\n        </table>\n      </div>\n    );\n  }\n}\n```\n"
