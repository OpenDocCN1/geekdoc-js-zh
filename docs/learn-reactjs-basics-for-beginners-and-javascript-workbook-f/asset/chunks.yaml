    React JSX


    All React components, as we know, have a render function.


    A React component''s HTML output is specified by the Render function.


    The JavaScript extension JSX allows you to write JavaScript code that appears
    like HTML. JSX is a react-specific HTML-like syntax that extends ECMAScript to
    allow HTML-like syntax to coexist alongside JavaScript/React programming.


    Preprocessors (transpilers like Babel) employ this syntax to convert HTML-like
    syntax into standard JavaScript objects that a JavaScript engine can comprehend.


    It allows you to put HTML/XML-like structures (e.g., DOM-like tree structures)
    in the same file as your JavaScript code, and then the preprocessor converts these
    expressions to actual JavaScript code. Like XML/HTML tags, JSX tags have a tag
    name, attributes, and children.


    Why use JSX?


    • It is faster than JavaScript because it optimises the code before it is translated
    to JavaScript.


    • Rather than separating technologies by putting HTML and logic in different files,
    React uses components that include both.


    • It is type-safe since most problems are discovered during compilation.


    • It simplifies the process of creating templates.


    Nested Elements in - JSX


    If you want to use multiple elements, you must enclose them in a container element.
    The div is being utilised as a container element for three nested items.


    App.JSX


    import React, { Component } from ''react'';


    class App extends Component{


    render(){


    return(


    <div>


    <h1>Hello World !!</h1>


    <h2>This is TutorialandExample</h2>


    <p>Website with the best tutorials.</p>


    </div>


    )


    }


    }


    export default App;


    JSX Attributes


    The characteristics of HTML elements in JSX are the same as in ordinary HTML.
    In JSX, attributes are named in camelcase rather than the conventional naming
    pattern of HTML, such as class in HTML becoming className in JSX. This is due
    to the fact that in JavaScript, the class keyword is a reserved keyword. In JSX,
    custom attributes can also be used. For custom attributes, we must use data-prefix.


    The custom attribute data-customAttr is used as an attribute for the p> tag in
    the example below.


    For example:


    import React, { Component } from ''react'';


    class App extends Component{


    render(){


    return(


    <div>


    <h1>Hello World !!</h1>


    <h2>This is TutorialandExample</h2>


    <p data-customAttr = "hello">Website with the best tutorials.</p>  


    </div>


    );


    }


    }


    export default App;


    JavaScript Expressions


    JavaScript expressions can be used inside of JSX. We''ll need to wrap it with
    curly brackets {}.


    The next example demonstrates this point more clearly.


    Example:


    import React, { Component } from ''react'';


    class App extends Component{


    render(){


    return(


    <div>


    <h1>{12+28}</h1>


    <h1>Hello World !!</h1>


    <h2>This is TutorialandExample</h2>


    <p data-customAttr = {"hello"}>Website with the best tutorials.</p>


    </div>


    );


    }


    }


    export default App;


    We can''t utilise if else statements in JSX; instead, we must use conditional
    (ternary) expressions. In the following example, the value of variable x equals
    1, therefore the browser returns true; however, if we change this value to something
    other, the browser returns false.


    For Example


    import React, { Component } from ''react'';


    class App extends Component{


    render(){


    var x=1;


    return(


    <div>


    <h1>{x == 1 ? ''True!'' : ''False''}</h1>


    <h2>This is TutorialandExample</h2>


    <p data-customAttr = {"hello"}>Website with the best tutorials.</p>


    </div>


    );


    }


    }


    export default App; 


    JSX styling


    Inline styles are recommended by React. CamelCase syntax is required to set inline
    styles. On particular items, React automatically appends px after the numeric
    value.


    The styling in JSX is demonstrated in the following example:


    For example:


    import React, { Component } from ''react'';


    class App extends Component{


    render(){


    var newStyle = {


    fontSize: 90,


    fontFamily: ''Times New Roman'',


    color: ''#789067''


    }


    return(  


    <div>


    <h1 style = {newStyle}>www.google.com</h1>


    <h2>This is TutorialandExample</h2>


    <p data-customAttr = {"hello"}>Website with the best tutorials.</p>


    </div>


    );


    }


    }


    export default App;


    JSX Comments


    Curly braces must be used while composing comments. In JSX, comments start with
    /* and end with */, just like in JSX expressions. The example below demonstrates
    how to use comments in JSX.


    For example:


    import React, { Component } from ''react'';


    class App extends Component{


    render(){


    var newStyle = {fontSize: 90,


    fontFamily: ''Times New Roman'',


    color: ''#789067''


    }  


    return(


    <div>


    <h1 style = {newStyle}>www.google.com</h1>


    <h2>This is TutorialandExample</h2>


    <p data-customAttr = {"hello"}>Website with the best tutorials.</p>


    {/* this is a comment of JSX*/


    </div>


    );


    }


    }


    export default App;


    React Components


    To create a single-page application in the past, developers had to write thousands
    of lines of code.


    It was quite difficult to make any changes to these applications because they
    follow the structure of traditional DOM.


    If a mistake is discovered, it must be manually searched across the application
    and updated. To overcome this problem, a component-based strategy is used.


    The entire application is separated into discrete logical groups of code, known
    as components, using this approach.


    Components are the fundamental building blocks of a React application.


    It simplifies the process of creating user interfaces.


    Every component shares the same physical area but operates independently of one
    another, eventually merging into a parent component that will serve as the application''s
    final user interface.


    React components have their own structure, functions, and APIs.


    They can be re-used depending on the situation.'
