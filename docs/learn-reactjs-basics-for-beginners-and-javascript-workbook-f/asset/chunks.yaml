    ## 性能

    `ReactJS` 的性能非常出色。与其他框架相比，`ReactJS` 很大程度上受益于这一功能。这一逻辑背后有一个管理虚拟 DOM 的概念。`Document
    Object Model`（`DOM`）是一种用于 `HTML`、`XML` 和 `XHTML` 的跨平台计算机编程 API。`DOM` 仅包含在内存中。因此，每当我们构建一个组件时，我们不会直接将其写入
    `DOM`；而是编写转换成 `DOM` 的虚拟组件，从而实现了更平滑、更快的性能。


    ## AngularJS 与 ReactJS 的对比

    ![](img/Image00011.jpg)

    ![](img/Image00012.jpg)


    ## React Native vs ReactJS

    ### React Native 与 ReactJS 之间的区别


    ### React Native

    React Native 是一个开源 JavaScript 框架，可用于为 iOS、Android 和 Windows 创建移动应用。它使用 `JavaScript`
    来创建跨平台移动应用。`React Native` 与 `react` 类似，但它不是使用 Web 组件作为构建块，而是使用原生组件。因此，它不是用于浏览器，而是用于移动设备。2013
    年，它由 Facebook 为其著名的内部项目 `Hackathon` 开发。Facebook 在 2015 年 3 月宣布 `React Native`
    是开源的并可以在 `GitHub` 上。


    ### React Native 的优势

    以下是使用 `React Native` 的一些优势：

    1. **原生组件**：如果我们需要原生功能，我们就需要开发尚未设计的特定平台代码。

    2. **类性能**：`React Native` 的代码被编译为原生代码，使其能够在两个操作系统上运行并执行相同的功能。

    3. **跨平台使用**：它同时兼容 `Android` 和 `iOS` 设备。

    4. **JavaScript**：它用于原生移动应用的开发。

    5. **随时间改进**：社区不断开发最佳实践。

    6. **社区**：它拥有一个庞大的社区，帮助人们获得他们需要的答案。

    7. **不确定性的存在**：由于该框架是由 Facebook 创建的，其存在性未知，因为公司保留了随时终止项目的权利。随着 `React Native`
    流行度的提高，这种情况不太可能发生。


    ### React Native 的缺点

    1. **学习困难**：对于应用开发领域的新手来说，学习非常困难。

    2. **初始化耗时更多**：即使对于高科技设备，启动也需要很长时间。

    3. **React Native 仍然很新 - 不成熟**：`React Native` 仍处于测试阶段，且仅适用于 `Android` 和 `iOS`，这对移动应用有不利影响。

    4. **缺乏安全性稳健性**：`React Native` 创建了安全漏洞。专家建议不要使用 `React Native` 开发对机密性要求高的银行金融应用。


    ## ReactJS

    `ReactJS` 是一个用于开发单页应用界面的开源 JavaScript 库。根据 MVC，`React` 是“V”，代表 View（视图）。有许多组件构成了
    `ReactJS` 应用；这些组件构成了所有 React 应用的核心。当这些组件与其他部分结合时，它们允许创建复杂的应用程序。它是由名为 `Jordan Walke`
    的 Facebook 软件工程师创建的关键前端库。Facebook 最初创建并维护它，后来它被整合到 `Whatsapp` 和 `Instagram` 等主要产品中。2011
    年，Facebook 首次引入 `React`，但直到 2013 年 5 月才向公众开放。


    ### ReactJS 的益处

    1. **易于学习和使用**：`ReactJS` 是一个简单易用易学习的框架。它带有大量的文档、培训材料和教程。对于具有 `JavaScript` 经验的开发者来说，它很容易理解，可以在几天内立即开始开发
    Web 应用。它是 JavaScript 框架之一，是 `MVC`（模型-视图-控制器）模型中的 V（视图部分）。我们不能说 `ReactJS` 功能丰富，但它确实具有开源
    JavaScript 用户界面（`UI`）库的优势，有助于任务执行。

    2. **创建动态 Web 应用变得更简单**：使用 `HTML` 字符串创建动态 Web 应用由于需要复杂的编码非常困难，但 `ReactJS` 解决了这个问题并使其简单。它需要更少的代码并提供更多的功能。它利用
    `JSX`（`JavaScript`）扩展，这是一种允许 `HTML` 和 `HTML` 标签语法渲染某些子组件的语法。还支持机器读代码。

    3. **可重用组件**：`ReactJS` Web 应用由多个组件组成，每个组件都有自己的逻辑和控制。这些组件负责生成短的、可重用的 `HTML` 代码。这种可重用的代码使得应用的设计和维护变得更加容易。`ReactJS`
    使用基于虚拟 DOM 的技术向 `HTML DOM` 填充数据。因为它只是更改特定 DOM 的元素而不是每次都重新加载，所以虚拟 DOM 非常快。

    4. **性能增强**：由于虚拟 DOM，`ReactJS` 的速度有所提高。`ReactJS` 非常快。由于这一功能，`ReactJS` 明显优于其他框架。这一逻辑背后有一个管理虚拟
    DOM 的概念。`Document Object Model`（`DOM`）是一种用于 `HTML`、`XML` 和 `XHTML` 的跨平台计算机编程 API。`DOM`
    仅包含在内存中。因此，每当我们构建一个组件时，我们不会直接将其写入 `DOM`；而是编写转换成 `DOM` 的虚拟组件，从而实现了更平滑、更快的性能。

    5. **工具支持**：`ReactJS` 还因其可用工具集而受欢迎。这些技术提高了可读性并让开发者的工作更容易。这些工具是 `Chrome` 和 `Firefox`
    扩展，允许研究 react 组件的层次结构。

    6. **已知 SEO 友好**：在 SEO 方面，标准框架存在问题。搜索引擎难以读取大型 JavaScript 应用。`ReactJS` 解决了这个问题，让开发者更容易跨多个搜索引擎。这就是为什么
    `React.js` 应用可以在服务器上运行，通过虚拟 DOM 渲染标准页面。

    7. **JavaScript 库的优势**：`ReactJS` 提供了丰富的 JavaScript 库，这就是它如此受欢迎的原因。JavaScript 库给了
    Web 开发者更多的自由。

    8. **代码测试范围**：`ReactJS` 应用启动简单。它允许开发者使用原生工具轻松测试和调试代码。


    ### ReactJS 的缺点

    1. **开发节奏快**：这既是优势也是劣势。由于环境变化太快，大多数开发者不希望频繁重新学习新方法。跟上所有变化和持续更新可能是困难的。他们必须定期更新技能并获取新方法。

    2. **文档匮乏**：这是不断变化的技术的另一个共同缺点。由于 react 技术的快速更新，缺乏良好的文档。

    3. **视图部分**：`ReactJS` 只处理应用的 UI 层。因此，必须选择其他技术来为项目开发提供完整的工具集。

    4. **JSX 作为障碍**：`ReactJS` 使用 `JSX`，这是一种允许 `HTML` 和 `JavaScript` 混合的语法扩展。这种策略是有利的，但开发社区的某些成员（特别是新开发者）将
    `JSX` 视为障碍。开发者对于学习 `JSX` 有多困难存在分歧。


