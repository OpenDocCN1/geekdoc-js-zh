    ReactJS Introduction


    ReactJS Tutorial teaches you the fundamentals as well as some advanced ideas.


    It is now the most important front-end library built by a Facebook software engineer
    named Jordan Walke.


    It is built on a solid foundation and has a sizable community.


    Facebook was the first to build and maintain it, and it has since been included
    into major products like as WhatsApp and Instagram.


    In 2011, Facebook was the first to introduce React, but it wasn''t until May 2013
    that it was made public.


    MVC (Model View Controller) architecture is now used by a large number of websites.
    The ‘V'' in MVC stands for View, and React is the ‘V'' in MVC.


    There are various components that go into making a ReactJS application; these
    components are at the heart of all React apps.


    When these components are combined with other parts, they allow for the creation
    of complex applications.


    It fills the HTML DOM with data using virtual DOM. Because only the components
    of the DOM need to be changed rather than the entire DOM, virtual DOM is quick.


    We''ll need React components to build React applications, and these components
    will be organised inside the higher-level elements that determine the app''s structure.


    Let''s look at an example of a form with buttons, labels, and input fields to
    see how it works.


    Each element of the form is a React component, and the form itself is a higher-level
    component that defines the structure of the form.


    After the updating of Virtual DOM, React determines the amendment that requires
    in the actual browser’s DOM.


    Because of this, we have to write virtual components that React will turn into
    the real DOM instead of writing a React component directly into the DOM.


    React Environment Setup Step by Step


    React Environment Setup


    This section will teach you how to set up an environment for developing ReactJS
    applications successfully:


    Pre-Requisite for ReactJS


    1.  NodeJS and NPM


    2.  React and React DOM


    3.  Webpack


    4.  Babel


    There are two ways - installing the ReactJS:


    1.  Using npm command


    2.  By using create-react-app


    By using npm command


    Step 1:  Install NodeJS. Go to https://nodejs.org


    Step 2:  Click on downloads.


    ![Image 1.jpg](Image00000.jpg)


    Step 3:  Install This Node.js


    Step 4:  Use the following command to determine the version.


    ![Check the version by using commands](Image00001.jpg)


    Step 5:  Now, in your preferred directory, create a root folder with the name
    you want.


    ![create a root folder in your desired directory](Image00002.jpg)


    Step 6: Make a file called package.json. This file is necessary for module generation.
    Use the following command to make this file:


    npm init –y


    Step 7:  Using the npm command, instal React and associated DOM Packages:


    npm install react react-dom –save  


    Step 8:  Install Webpack


    Webpack is primarily used for module packing, development, and automation of the
    production pipeline.


    We must use the following command to instal Webpack.:


    npm install webpack webpack-dev-server webpack-cli –save  


    Webpack-dev-server is used during development, webpack is used to make production
    builds, and webpack-cli provides a set of instructions in the above command.


    Step 9:  Install Babel.


    Babel is a JavaScript compiler that allows you to convert one source code into
    another. Use the following command to instal Babel:


    npm install babel-core babel-loader babel-preset-env babel-preset-react babel-webpack-plugin –save-dev  


    Step 10:  Make a file. We need to add a few files to the project folder to finish
    the installation. The following are the files:


    *   index.html


    *   App.js


    *   main.js


    *   webpack.config.js


    *   .babelrc


    These files can be manually created or created using the command prompt. Use the
    command prompt to create files and type the following command:


    type nul >  filename


    Step 11:  Now,  Set Compiler, loader, and server for React Application


    1.  Configure Webpack


    To configure Webpack, add the following code to webpack.config.json. It changes
    the development server''s port to 8080\. It is in charge of specifying the loaders
    for processing the file formats that your programme utilises, as well as installing
    any plugins that are required during development.


    webpack.config.json


    constpath=require(''path'');


    constHtmlWebpackPlugin=require(''html-webpack-plugin'');


    module.exports={


    entry:''./main.js'',


    output:{


    path:path.join(__dirname,''/bundle''),


    filename:''index_bundle.js''


    },


    devServer:{


    inline:true,


    port:8080


    },


    module:{


    rules:[


    {


    test:/\.jsx?$/,


    exclude:/node_modules/,


    use:{


    loader:"babel-loader",


    }


    }


    ]


    },


    plugins:[


    newHtmlWebpackPlugin({


    template:''./index.html''


    })


    ]


    }


    Now edit the package.json file and remove the lines “test” “echo ” Error: no test
    specified” && exit 1′′ from the “scripts” object, and replace them with the instructions
    start and build.


    ![Image 6.jpg](Image00003.jpg)


    Remove the above-mentioned item and replace it with the following two:


    1.  “start”: “webpack-dev-server –mode development –open –hot”,  


    2.  “build”: “webpack –mode production”  


    It is depicted in the figure below:


    *   HTML webpack template for index.html


    Using the HtmlWeb-packPlugin plugin, we need to create a custom template to generate
    index.html. It allows us to use a viewport tag to facilitate our app''s mobile
    scaling.


    In your index.html file, paste the following code.


    index.html


    <!DOCTYPEhtml>


    <htmllang="en">


    <head>


    <metacharset="UTF-8">


    <title>ReactApp</title>


    </head>


    <body>


    <divid="app"></div>


    <scriptsrc=''index_bundle.js''></script>


    </body>


    </html>


    *   App.jsx  and  main.js'
