    \ and division](#text00037.html__Toc81216815)\n- [Convert temperatures](#text00038.html__Toc81216816)\n\
    - [OUR OTHER PUBLISHING](#text00039.html__Toc81216817)\n\n## ReactJS Introduction\n\
    \nReactJS Tutorial teaches you the fundamentals as well as some advanced ideas.\
    \ It is now the most important front-end library built by a Facebook software\
    \ engineer named Jordan Walke. It is built on a solid foundation and has a sizable\
    \ community. Facebook was the first to build and maintain it, and it has since\
    \ been included into major products like as WhatsApp and Instagram. In 2011, Facebook\
    \ was the first to introduce React, but it wasn't until May 2013 that it was made\
    \ public.\n\nMVC (Model View Controller) architecture is now used by a large number\
    \ of websites. The ‘V’ in MVC stands for View, and React is the ‘V’ in MVC. There\
    \ are various components that go into making a ReactJS application; these components\
    \ are at the heart of all React apps. When these components are combined with\
    \ other parts, they allow for the creation of complex applications.\n\nThese components\
    \ fill the HTML DOM using virtual DOM. Because only components of the DOM need\
    \ to be changed rather than the entire DOM, virtual DOM is quick. We'll need React\
    \ components to build applications, and these components will be organised inside\
    \ the higher-level elements that determine the app's structure. Let's look at\
    \ an example of form with buttons, and input fields to see how it works. Each\
    \ element of the form is a React component, and the form itself is a higher-level\
    \ component that defines the structure. After the updating of Virtual DOM, React\
    \ determines that amendment requires in the actual browser instead of writing\
    \ React component directly into the DOM.\n\n## React Environment Setup Step by\
    \ Step\n\nThis section will teach you how to set up an environment for developing\
    \ ReactJS applications:\n\n### Pre-Requisite for ReactJS\n1. `NodeJS` and `NPM`\n\
    2. `React` and `DOM`\n3. `Webpack`\n4. `Babel`\n\n### Two ways - installing ReactJS:\n\
    1. Using `npm` command\n2. By using `create-react-app`\n\n#### Using npm command\n\
    \n**Step 1: Install NodeJS.** Go to `https://nodejs.org`.\n![Image0000.jpg]\n\n\
    **Step 2: Install Node.js**\n**Step 3:** Use the following command to determine\
    \ the version.\n![Image0001.jpg]\n\n**Step 4: Now, in your preferred directory,\
    \ create root folder with the name you want.**\n![Image0002.jpg]\n\n**Step 5:\
    \ Make a file called `package.json`. This file is necessary for module generation.\
    \ Use the following command:**\n```bash\nnpm init -y\n```\n\n**Step 6: Using the\
    \ npm command, instal React and associated DOM:**\n```bash\nnpm install react-dom\
    \ --save\n```\n\n**Step 7: Install Webpack**\nWebpack is primarily used for module\
    \ packing, development, and automation of the production pipeline. We must use\
    \ the following command to instal Webpack.:\n```bash\nnpm install webpack-dev-server\
    \ webpack-cli --save\n```\n`webpack-dev-server` is used during development, `webpack`\
    \ is used to make production builds, and `webpack-cli` provides a set of instructions\
    \ in the above command.\n\n**Step 8: Install Babel.**\nBabel is a JavaScript compiler\
    \ that allows you to convert source code into another. Use the following command\
    \ to instal Babel:\n```bash\nnpm install babel-core babel-loader babel-preset-env\
    \ babel-preset-react babel-webpack-plugin --save-dev\n```\n\n**Step 9: Make a\
    \ file.** We need to add a few files to the project folder to finish the installation.\
    \ The following are the files:\n- `index.html`\n- `App.js`\n- `main.js`\n- `webpack.config.js`\n\
    - `.babelrc`\n\nThese files can be manually created or created using the command\
    \ prompt. Use the command prompt to create files and type the following command:\n\
    ```bash\ntype nul > filename\n```\n\n#### Step 10: Set Compiler, loader, and server\
    \ for React Application\n\n Configure Webpack\nTo configure webpack, add the following\
    \ code to `webpack.config.json`. It changes the development server's port to `8080`.\
    \ It is in charge of specifying the loaders for processing the file formats that\
    \ your programme utilises, as well as installing any plugins that are required\
    \ during development.\n\n```javascript\nconst path = require('path');\nconst HtmlWebpackPlugin\
    \ = require('html-webpack-plugin');\nmodule.exports={\n  entry: './main.js',\n\
    \  output:{\n    path: path.join(__dirname, '/bundle'),\n    filename: 'index_bundle.js'\n\
    \  },\n  devServer:{\n    inline: true,\n    port: 8080\n  },\n  module:{\n  \
    \  rules:[\n      {\n        test: /\\.jsx?$/,\n        exclude: /node_modules/,\n\
    \        use:{\n          loader: \"babel-loader\",\n        }\n      }\n    ]\n\
    \  },\n  plugins:[\n    new HtmlWebpackPlugin({\n      template: './index.html'\n\
    \    })\n  ]\n}\n```\n\nNow edit the `package.json` file and remove the lines\
    \ `\"test\": \"echo Error: no test specified && exit 1\"` from the `\"scripts\"\
    ` object, and replace them with the instructions `start` and `build`.\n![Image0003.jpg]\n\
    \nRemove the above-mentioned item and replace it with the following two:\n1. `\"\
    start\": \"webpack-dev-server --mode development --open --hot\"`\n2. `\"build\"\
    : \"webpack --mode production\"`\n\nIt is depicted in the figure below:\n\n###\
    \ HTML webpack template for index.html\nUsing the `HtmlWebpackPlugin` plugin,\
    \ we need to create a custom template to generate `index.html`. It allows us to\
    \ use a viewport tag to facilitate our app's mobile scaling. In your `index.html`\
    \ file, paste the following code.\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n<head>\n  <meta charset=\"UTF-8\">\n  <title>ReactApp</title>\n</head>\n<body>\n\
    \  <div id=\"app\"></div>\n  <script src='index_bundle.js'></script>\n</body>\n\
    </html>\n```\n\n- `App.jsx` and `main.js`\n"
