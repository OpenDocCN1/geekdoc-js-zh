    ## Performance

    The performance of `ReactJS` is superb. When compared to other frameworks, `ReactJS`
    benefits greatly from this functionality. There is a concept of managing virtual
    DOM behind this rationale. The `Document Object Model` (`DOM`) is a cross-platform
    computer programming API for `HTML`, `XML`, and `XHTML`. The `DOM` is exclusively
    contained within memory. As a result, anytime we build a component, we don''t
    write it to the `DOM` directly; instead, we write virtual components that transform
    into the `DOM`, resulting in smoother and faster performance.


    ## Comparison Between AngularJS v/s ReactJS

    ![](Image00011.jpg)

    ![](Image00012.jpg)


    ## React Native vs ReactJS

    ### Difference between React Native - and ReactJS


    ### React Native

    React Native is an open-source JavaScript framework that may be used to create
    mobile apps for iOS, Android, and Windows. It uses `JavaScript` to make a cross-platform
    mobile application. `React Native` is similar to `react`, but instead of using
    web components as building blocks, it employs native components. As a result,
    rather than using the browser, it is employed for mobile devices. In 2013, it
    was also developed by Facebook for its well-known internal project `Hackathon`.
    Facebook stated in March 2015 that `React Native` is open source and available
    on `GitHub`.


    ### Advantages of React Native

    The following are some of the advantages of using `React Native`:

    1. **Native Components**: If we need native functionality, we''ll need to develop
    platform-specific code that hasn''t been designed yet.

    2. **Class Performance**: `React Native`''s code is compiled into Native code,
    allowing it to run on both operating systems and perform the same functions.

    3. **Cross-platform Usage**: It is compatible with both `Android` and `iOS` devices.

    4. **JavaScript**: It is employed in the development of native mobile applications.

    5. **Improving with time**: The best practises are always being developed by the
    community.

    6. **Community**: It has a vast community that helps people get the answers they
    need.

    7. **Uncertain Existence**: Because this framework was created by Facebook, its
    presence is unknown, as the company retains the rights to terminate the project
    at any time. It is unlikely to happen as the popularity of `React Native` grows.


    ### Disadvantages React Native

    1. **Hard to learn**: For a newcomer to the app development field, learning is
    difficult.

    2. **Takes more time - in initialization**: Even for high-tech gadgets and devices,
    startup takes a long time.

    3. **React Native - still new - immature**: `React Native` is still in beta and
    is only available for `Android` and `iOS`, which has a detrimental influence on
    mobile apps.

    4. **Lacks the security robustness**: `React Native` creates a security vulnerability.
    Experts advise against using `React Native` for developing banking and financial
    apps that demand a high level of confidentiality.


    ## ReactJS

    `ReactJS` is an open-source JavaScript library for developing a single-page application''s
    user interface. `React` is the ‘V,’ which stands for View, according to MVC. There
    are various components that go into making a `ReactJS` app; these components comprise
    the heart of all React apps. When these components are combined with other parts,
    they allow for the creation of complex applications. It is a critical front-end
    library created by a Facebook software engineer named `Jordan Walke`. Facebook
    was the first to create and maintain it, and it was later integrated into major
    products like `Whatsapp` and `Instagram`. In 2011, Facebook was the first to introduce
    `React`, but it wasn''t until May 2013 that it was made public.


    ### Benefits of ReactJS

    1. **Easy to Learn and Use**: `ReactJS` is a simple to use and learn framework.
    It comes with a lot of documentation, training materials, and tutorials. It is
    simple to comprehend for a developer with a `JavaScript` experience who can immediately
    begin developing web applications in a matter of days. It is one of the JavaScript
    frameworks and is the V (view portion) in the `MVC` (Model-View-Controller) model.
    We can''t say `ReactJS` is feature-rich, but it does have the benefit of an open-source
    JavaScript user interface (`UI`) library, which aids in task execution.

    2. **Creating dynamic web applications becomes easier**: Creating dynamic web
    apps using `HTML` strings was difficult due to the complicated coding necessary,
    but `ReactJS` has overcome this problem and made it simple. It needs less coding
    and offers more features. It makes use of the `JSX` (`JavaScript`) extension,
    which is a syntax that allows `HTML` quotes and `HTML` tag syntax to render certain
    subcomponents. Machine-readable codes are also supported.

    3. **Reusable Components**: The `ReactJS` web application is made up of several
    components, each with its own logic and controls. These are in charge of producing
    a short, reusable `HTML` code that can be reused. This reusable code makes it
    easier to design and maintain applications. `ReactJS` uses a virtual DOM-based
    technique to fill the `HTML DOM` with data. Because it simply alters the elements
    of particular DOMs rather than reloading it every time, the virtual DOM is quick.

    4. **Performance Enhancement**: Because of Virtual DOM, `ReactJS`''s speed has
    increased. `ReactJS` is extremely fast. `ReactJS` becomes significantly better
    than other frameworks as a result of this functionality. There is a concept of
    managing virtual DOM behind this rationale. The `Document Object Model` (`DOM`)
    is a cross-platform computer programming API for `HTML`, `XML`, and `XHTML`. The
    `DOM` is exclusively contained within memory. As a result, anytime we build a
    component, we don''t write it to the `DOM` directly; instead, we write virtual
    components that transform into the `DOM`, resulting in smoother and faster performance.

    5. **Handy Tools Support**: `ReactJS` is also popular due to the availability
    of a useful collection of tools. These technologies improve readability and make
    the developer''s job easier. These tools are `Chrome` and `Firefox` dev extensions
    that allow you to investigate the hierarchies of react components in the virtual
    DOM.

    6. **Known to be SEO friendly**: When it comes to `SEO`, there is a problem with
    standard frameworks. Search engines have a hard time reading massive JavaScript
    apps in general. `ReactJS` solves this problem, making it easier for developers
    to navigate across numerous search engines. That''s why `React.js` apps may run
    on the server, with the virtual DOM rendering and returning a standard page to
    the browser.

    7. **The benefit JavaScript library**: `ReactJS` provides a rich range of JavaScript
    libraries, which is why it is so popular among web developers. The JavaScript
    library gives web developers more freedom to do things their own.

    8. **Scope Code Testing**: `ReactJS` applications are simple to start up. It gives
    the developer the ability to easily test and debug their code using native tools.


    ### Disadvantages of ReactJS own1. **High Pace development**: It serves as both
    a benefit and a detriment. It''s a disadvantage since the environment changes
    so quickly that most developers don''t want to have to relearn new ways of doing
    things on a frequent basis. It might be difficult to keep up with all of these
    changes and constant updates. They must keep their abilities up to date and acquire
    new ways of doing things on a regular basis.

    2. **Poor Documentation**: Another common drawback of continuously changing technologies
    is this. Due to the rapid updating of react technologies, there is a lack of good
    documentation.

    3. **View Part**: Only the app''s UI layers are handled by `ReactJS`. As a result,
    other technologies must be chosen in order to provide a complete set of tooling
    for the project''s development.

    4. **JSX as barrier**: `ReactJS` makes use of `JSX`, a syntax extension that allows
    `HTML` and `JavaScript` to be mixed together. This strategy is advantageous, but
    some members of the development community, particularly new developers, regard
    `JSX` as a barrier. Developers disagree about how difficult `JSX` is to learn.

