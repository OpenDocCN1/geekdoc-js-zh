    React Component API


    It''s a really high-level API. It gives the application''s code reusability while
    also making it absolutely unique. It can be used in a variety of ways to:


    *   Creating Elements.


    *   Transforming Elements.


    *   Fragments.


    We''ll now go over the three most significant methods accessible in the React
    component API:


    *   findDOMNode()


    *   setState()


    *   forceUpdate()


    findDOMNode()


    You must use ReactDOM to manipulate the DOM. The method findDOMNode() is used
    to locate DOM nodes. This approach assists us in locating or gaining access to
    the underlying DOM node.


    Syntax:


    ReactDOM.findDOMNode(component);


    Example:


    App.js


    import React, { Component } from ''react'';


    import ReactDOM from ''react-dom'';


    class App extends React.Component {


    constructor() {


    super()


    this.findDomNodeHandler1 = this.findDomNodeHandler1.bind(this);


    this.findDomNodeHandler2 = this.findDomNodeHandler2.bind(this);


    };


    findDomNodeHandler1() {


    var div1 = document.getElementById(''One'');


    ReactDOM.findDOMNode(div1).style.color = ''red'';


    }


    findDomNodeHandler2() {


    var div2 = document.getElementById(''Two'');


    ReactDOM.findDOMNode(div2).style.color = ''blue'';


    }


    render() {


    :return (


    <div>


    <center>


    <h1>ReactJS Find DOM Node Example</h1>


    <button onClick = {this.findDomNodeHandler1}>Button1</button>


    <button onClick = {this.findDomNodeHandler2}>Button2</button>


    <h3 id = "One">Red Color</h3>


    <h3 id = "Two">Blue Color</h3>


    </center>


    </div>


    )


    }


    }


    export default App;


    setState()


    This method is used to update the component''s state. Rather than altering the
    state instantaneously, it just modifies the existing state. It''s the main technique
    for modifying the user interface (UI) in response to event handlers and server
    responses.


    Syntax:


    this.stateState(object newState[, function callback]);


    Example:


    App.js


    import React, { Component } from ''react'';


    import PropTypes from ''prop-types'';


    class App extends React.Component {


    constructor() {


    super();


    this.state = {


    data: "!!!! Hello World !!!!"


    }


    this.updateSetState = this.updateSetState.bind(this);


    }


    updateSetState() {


    this.setState({


    data:"Welcome to tutorialexample"


    });


    }


    render() {


    return (


    <div>


    <center>


    <h1>{this.state.data}</h1> <button onClick = {this.updateSetState}>SET STATE</button>


    </center>


    </div>  


    )


    }


    }  


    export default App


    Main.js


    import React from ''react'';


    import ReactDOM from ''react-dom'';


    import App from ''./App.js'';


    ReactDOM.render(<App/>, document.getElementById(''app''));


    forceUpdate()


    This method allows the manually updating of the components.


    Syntax:


    Component.forceUpdate(callback);


    Example:


    App.js


    import React, { Component } from ''react'';


    class App extends React.Component {


    constructor() {


    super()


    this.forceUpdateState = this.forceUpdateState.bind(this);


    }


    forceUpdateState() {


    this.forceUpdate();


    };


    render() {


    return (


    <div>


    <center>


    <h1>Example of Force Update method</h1>


    <h2>Example to Generate Random Number</h2>


    <h3>Random number: {Math.random()}</h3>


    <button onClick = {this.forceUpdateState}>ForceUpdate</button>


    </center>


    </div>


    );


    }


    }


    export default App;


    React Component Life-Cycle


    Each component''s construction process in ReactJS has multiple lifecycle functions.
    These methods are referred to as the component''s lifespan. The component''s life
    cycle is divided into four phases:


    *   Initial Phase


    *   Mounting Phase


    *   Updating Phase


    *   Unmounting Phase


    Every stage of the lifecycle has its own set of methods. Let''s go over each of
    these stages one by one:


    Initial Phase


    The birth step of a ReactJS component''s lifecycle is referred to as this. The
    component''s initial state and default props are included in this phase. These
    default properties are set in the function Object() { [native code] } of the component.
    This is a one-time step that involves the following methods:


    *   getDefaultProps()


    It''s where you set the default value for this.props. It is called before the
    component is created.


    *   getInitialState()


    This.state''s default value is specified with this.state.default.


    Mounting Phase


    In this phase, an instance of a component is created and added into the DOM. It
    entails the following procedures:


    *   componentWillMount()


    It is called just before a component is rendered into the DOM. If you call setState()
    within this method, the component will not be re-rendered.


    *   componentDidMount()


    It is called immediately after a component has been rendered and placed on the
    DOM. You can now query the DOM in any way you want.


    *   render()


    Every component has a definition for it. It''s in charge of returning only one
    root HTML node element. You can produce a null or false value if you don''t want
    to render anything.


    Updating Phase


    It''s the next step in the lifecycle of a React component. We obtain fresh Props
    and change the State here. This phase also allows you to handle user interaction
    and provide communication with the component hierarchy. The primary goal of this
    phase is to ensure that the component is showing the most recent version.


    This phase, unlike the Birth or Death phases, repeats itself over and over. It
    entails the following procedures:


    *   componentWillReceiveProps()


    When a component receives new props, this method is called. You must compare this
    if you expect the state to be updated in response to prop changes. next and props
    Props for using this to make the state transition. The setState() method is used
    to change the state of the system.


    *   shouldComponentUpdate()


    It is called anytime a component decides to make a DOM change or update. It allows
    you to control the component''s behaviour as well as change it. When this function
    returns true, the component will be updated. The component will not update if
    this is not done.


    *   componentWillUpdate()


    It is called right before a component update occurs. By invoking this, you are
    not able to change the state of the component. The setState() method is used to
    change the state of the system. If the method shouldComponentUpdate() returns
    false, it will not be called.


    *   render()


    This.props and this.state are examined, and types such as React Elements, Arrays,
    and Fragments, Booleans or null, String, and Number are returned. If the function
    shouldComponentUpdate() returns false, the render() code will be run again to
    ensure that the component shows correctly.


    *   componentDidUpdate()


    It is called immediately after the component has been updated. This function allows
    you to put whatever code inside it that you wish to run when an update occurs.
    The initial render is not called with this method.


    Unmounting Phase'
