  trans: "\n\n区别 - ReactJS - React Native\n\n![](img/Image00013.jpg)\n\n![](img/Image00014.jpg)\n\
    \n# React State (状态)\n\n状态（State）是一个存储有关组件数据或信息的可变结构。\n\n组件的状态随时间推移而改变。状态的变化通常源于用户交互或系统事件。\n\
    \n有状态组件（Stateful components）是指拥有状态的组件。它是 React 组件的重要部分，因为它决定了组件的行为和渲染方式。它们还负责让组件变得生动且吸引人。\n\
    \n状态的目标是尽可能保持简单。\n\n可以使用 `setState()` 方法来更改状态，调用它会导致 UI 更新。\n\n本地状态或信息由状态表示。它可以由组件直接或从组件内部对其进行更新或访问。\n\
    \n我们必须在任何交互发生之前，利用 `getInitialState()` 方法来设置初始状态。\n\n例如，如果我们有五个组件都需要来自状态的数据或信息，那么我们需要开发一个容器组件来为它们持有所有的状态。\n\
    \n## 定义状态 (Defining the State)\n\n在定义状态之前，我们必须先为定义组件的初始状态指定一组默认值。\n\n添加一个类函数 `Object()\
    \ { [native code] }`，使用 `this.state` 来分配初始状态。`render()` 方法可以渲染 `this.state` 属性。\n\
    \n### 示例：\n\n以下示例演示了如何使用 ES6 语法创建一个有状态组件：\n\n```javascript\nimport React, { Component\
    \ } from 'react'; \n\nclass App extends React.Component { \n  constructor() {\n\
    \    super()\n    this.state = { displayBio: true }\n  }\n\n  render() {\n   \
    \ const bio = this.state.displayBio ? ( \n      <div>\n        <p><h3>This is\
    \ tutorialexample website which provides you lot of tutorials.</h3></p>\n    \
    \  </div>\n    ) : null;\n    return (\n      <div>\n        <h1> Hello World\
    \ !!!!!!</h1>\n        { bio }\n      </div>\n    )\n  }\n}\n\nexport default\
    \ App;\n```\n\n在函数 `Object() { [native code] }` 中，执行 `super()` 方法来设置状态是必不可的。这是因为在\
    \ `super()` 方法被调用之前，`this.state` 是未初始化的。\n\n## 更改状态 (Changing the State)\n\n可以通过调用\
    \ `setState()` 并传入一个新的状态对象作为参数来更新组件的状态。现在，在上述示例中，构建一个新方法 `toggleDisplayBio()`\
    \ 并 `this` 关键字绑定到它；否则在 `toggleDisplayBio()` 方法内部将无法访问。\n\n```javascript\nthis.toggleDisplayBio=this.toggleDisplayBio.bind(this)\n\
    ```\n\n### 示例：\n\n我们将在下面的示例的 `render()` 方法中添加一个按钮。当按下按钮时会调用 `toggleDisplayBio()`\
    \ 方法并显示指定的输出。\n\n```javascript\nimport React, { Component } from 'react'; \n\n\
    class App extends React.Component {\n  constructor() {\n    super()\n    this.state\
    \ = { displayBio: false }\n    console.log('Component this', this)\n    this.toggleDisplayBio\
    \ = this.toggleDisplayBio.bind(this)\n  }\n\n  toggleDisplayBio(){\n    this.setState({displayBio:\
    \ !this.state.displayBio});\n  }\n\n  render() {\n    return (\n      <div>\n\
    \        <h1>!! Hello World !!</h1>\n        {\n          this.state.displayBio\
    \ ? (\n            <div>\n              <p><h4>This is tutoriaexample website\
    \ that has a lot of tutorials. This website provides you a better source of learning.</h4></p>\n\
    \              <button onClick={this.toggleDisplayBio}> Show Less </button>\n\
    \            </div> \n          ) : (\n            <div>\n              <button\
    \ onClick={this.toggleDisplayBio}> Read More </button>\n            </div>\n \
    \         )\n        }\n      </div>\n    )\n  }\n}\n\nexport default App\n```\n\
    \n# React Props (属性)\n\n“properties”（属性）一词缩写为 \"prop\"。因为 props 是不可变的，所以 state\
    \ 和 props 在本质上是不同的。Props 是只能读取的组件属性。它是跟踪标签属性值的对象，其工作方式与 HTML 元素类似。它促进了数据从一个组件到另一个组件的传输。Props\
    \ 类似于函数参数，因为它们提供给组件的方式与参数传递给函数的方式相同。\n\n组件内部的 `props` 不能被更改。在组件内部，我们可以添加 props，即属性。这些属性在组件中通过\
    \ `this.props` 暴露，并用于在我们的 `render` 方法中渲染动态数据。\n\n当你在组件中需要不可变数据时，向 ReactJS 项目的\
    \ `main.js` 文件添加 `reactDom.render()` 方法，并在需要的组件内部该文件。\n\n### 示例：\n\n**App.js**\n\
    ```javascript\nimport React, { Component } from 'react';\nclass App extends React.Component\
    \ {\n  render() {\n    return (\n      <div>\n        <h1> Hello { this.props.name\
