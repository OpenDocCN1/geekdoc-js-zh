  trans: '


    * 简单性

    * 性能

    * 让我们详细阐述这些特性：


    ## JSX

    JavaScript XML 缩写为 `JSX`。它是经过扩展的 JavaScript 语法。它的语法与 XML 或 HTML 相似。


    这种语法会被转换为 React 框架 JavaScript 调用。它改进了 `ES6`，允许类 HTML 文本与 JavaScript React 代码共存。在
    `ReactJS` 中并不强制要求使用 `JSX`，但建议使用它。


    ## 单向数据绑定

    ReactJS 的设计目标是遵循单向数据流，通常被称为单向数据绑定。单向数据绑定是有益的，因为它允许对整个应用程序进行更多的控制。当数据向反方向流动时，就需要额外的特性。出现这种情况是因为系统假设组件是不可变的，且它们内部包含的数据是不可更改的。`Flux`
    是一种有助于数据单向性的模式。它为应用程序提供了额外的灵活性，从而提高了效率。


    ## 虚拟 DOM

    虚拟 DOM 仅仅是真实 DOM 的副本。它与单向数据绑定类似。每当 Web 应用发生修改时，整个 UI 都会在虚拟 DOM 表示中重新渲染。然后会检查新
    DOM（重新渲染的）与先前的 DOM 表示之间的差异。完成后，真实 DOM 会修改发生变化的项目。这减少了内存占用并加快了运行速度。


    ## 简单性

    众所周知，ReactJS 使用了 `JSX`，这使得应用程序更符合用户习惯，代码更易于理解。ReactJS 采用基于组件的方法，允许代码复用。它易于学习和利用。


    ## 组件

    ReactJS 由组件组成，每个组件都有自己的逻辑和控制。组件是可重用的，这在开发大型项目时使得代码维护更加容易。


    ## 性能

    ReactJS 非常快。与其他框架相比，ReactJS 受益于这一功能。这一逻辑背后有一个管理虚拟 DOM 的概念。文档对象模型 (`DOM`）是一种用于
    HTML、XML 和 XHTML 的跨平台计算机编程 API。`DOM` 仅包含在内存中。因此，当我们构建任何组件时，不会直接将其写入 `DOM`；而是写入转换为
    `DOM` 的虚拟组件，从而实现了更流畅、更快的性能。


    ## React 与 Vue 的比较

    React 和 Vue 都是著名的 JavaScript 库，如今用于构建数百万个网站。React 和 Vue 都提供了极其强大的框架，各自都有优缺点。你选择哪一个取决于你的业务需求和用例。React
    和 Vue 有许多共同点，例如基于组件的设计、虚拟 DOM 的使用、props 的使用、使用 Chrome 开发工具进行调试等。它们在以下方面相互不同：


    ![](img/Image00008.jpg)

    ![](img/Image00009.jpg)

    ![](img/Image00010.jpg)


    ## ReactJS vs AngularJS

    ReactJS 与 AngularJS 之间的区别


    ### AngularJS

    AngularJS 是一个开源 JavaScript 框架，用于创建动态 Web 应用程序。它由 Misko Hovery 和 Adam Abrons 于
    2009 年创建，目前由 Google 维护。2019 年 3 月 11 日，AngularJS 更新到了 `1.7.8`。它主要用于创建单页应用，并利用
    HTML 和 JavaScript 属性。使用 `<script>` 标签将其整合到 HTML 页面中。它使用表达式将数据绑定到 HTML，并通过使用指令添加内置属性来扩展
    HTML。


    #### AngularJS 的特性

    以下是 AngularJS 的一些特性：

    1. **数据绑定**：AngularJS 支持双向数据绑定。模型和显示组件之间的数据同步是自动发生的。

    2. **POJO 模型**：AngularJS 使用的“纯旧 JavaScript 模型”缩写为 `POJO`。它提供了自发和计划良好的对象。它使得 AngularJS
    是自包含的且易于利用。

    3. **MVC 框架（模型-视图-控制器）**：`MVC` 是一种用于创建 Web 应用的软件架构范式。AngularJS 的功能模型主要构建在 `MVC`
    概念之上。AngularJS 中的 `MVC` 具有动态、舒适且多架构。

    4. **服务**：AngularJS 带有许多内置服务，例如用于创建 `XMLHttpRequest` 的 `$http`。

    5. **用于用户界面的 HTML**：AngularJS 使用 HTML 创建用户界面。AngularJS 是一种声明式语言，使用更短、更易理解的标签。它提供了良好的界面。

    6. **依赖注入**：AngularJS 具有依赖注入子系统，简化了开发者设计、理解和测试应用程序的过程。

    7. **Google 的活跃社区**：众所周知，Google 维护 AngularJS，因此在出现维护问题时，有很多论坛可以回答问题。

    8. **路由**：路由是允许你从一个视图移动到另一个视图的系统。对于所有内容都包含在页面上的单页应用来说至关重要。开发者不希望用户每次点击菜单项时都将其引导到新页面。开发者要求在
    URL 更改时在同一页面加载内容。


    ### ReactJS

    它是一个由 Facebook 软件工程师 Jordan Walke 创建的关键前端库。Facebook 是第一个创建并维护它的，后来被整合到 Whatsapp
    和 Instagram 等主要产品中。2011 年，Facebook 首次引入了 React，但直到 2013 年才向公众开放。


    ReactJS 是一个用于开发单页应用界面的开源 JavaScript 库。根据 `MVC`，React 是“V”，即 View（视图）。许多组件构成了 ReactJS；这些组件是所有
    React 应用的核心。


    #### ReactJS 的特性

    * **JSX**：JavaScript XML 缩写为 `JSX`。它是经过扩展的 JavaScript 语法。它的语法与 XML 或 HTML 相似。这种语法会被转换为
    React 框架 JavaScript 调用。它改进了 `ES6`，允许类 HTML 文本与 JavaScript 代码共存。在 `ReactJS` 中并不强制要求使用
    `JSX`，但建议使用它。

    * **单向数据绑定**：ReactJS 的设计目标是遵循单向数据流，通常被称为单向数据绑定。单向数据绑定是有益的，因为它允许对整个应用程序进行更多的控制。当数据向反方向流动时，就需要额外的特性。出现这种情况是因为系统假设组件是不可变的，且它们内部包含的数据是不可更改的。`Flux`
    是一种有助于数据单向性的模式。它为应用程序提供了额外的灵活性，从而提高了效率。

    * **虚拟 DOM**：虚拟 DOM 仅仅是真实 DOM 的副本。它与单向数据绑定类似。每当 Web 应用发生修改时，整个 UI 都会在虚拟 DOM 表示中重新渲染。然后会检查新
    DOM（重新渲染的）与先前的 DOM 表示之间的差异。完成后，真实 DOM 会修改发生变化的项目。这减少了内存占用并加快了运行速度。

    * **简单**：众所周知，ReactJS 使用了 `JSX`，这使得应用程序更符合用户习惯，代码更易于理解。ReactJS 采用基于组件的方法，允许代码复用。它易于学习和利用。

    * **组件**：ReactJS 由组件组成，每个组件都有自己的逻辑和控制。组件是可重用的，这在开发大型项目时使得代码维护更加容易。


