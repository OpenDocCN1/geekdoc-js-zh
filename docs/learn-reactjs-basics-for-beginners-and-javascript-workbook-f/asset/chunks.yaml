  trans: "\n\n![](img/Image00039.jpg)\n\n# 学习 ReactJS 基础：初学者及考试与面试 JavaScript 工作手册\n\
    学习编程基础的快速简单方法\nJP TAM\n\n## 目录\n- ReactJS 简介\n- React 环境搭建分步指南\n- React JSX\n\
    - React 组件\n- ReactJS 的优缺点\n- ReactJS 的特性\n- React 与 Vue 的比较\n- ReactJS 对比 AngularJS\n\
    - React Native 对比 ReactJS\n- React State (状态)\n- React Props (属性)\n- React Props\
    \ 验证\n- React 组件 API\n- React 组件生命周期\n- React 构造函数\n- JavaScript 工作手册\n- 首字母大写\n\
    - 小时与分钟\n- 数元音个数\n- 创建一个新字符串\n- 拼接两个字符串\n- 第一个非重复字符\n- 寻找最长单词\n- 统计元音个数\n- 检查数字是否为质数\n\
    - JavaScript: 获取数据类型\n- 寻找次小和次大值\n- 两个数字相加\n- 闰年检查\n- 检查给定的正数\n- 字符串是否以 'Java'\
    \ 开头 - 检查\n- 两个给定的整数值 - 检查\n- 寻找接近 100 的值\n- 正数 - 检查\n- 字符串是否以 'Java' 开头 - 检查\n\
    - 乘法与除法\n- 温度转换\n- 我们的其他出版\n\n## ReactJS 简介\n\nReactJS 教程将教你基础知识以及一些高级思想。它是目前由一位名为\
    \ Jordan Walke 的 Facebook 软件工程师构建最重要的前端库。它建立在坚实的基础上，拥有庞大的社区。Facebook 是第一个构建并维护它的，从以后已被包含在\
    \ WhatsApp 和 Instagram 等主要产品。2011 年，Facebook 首次引入 React，但直到 2013 年 5 月才向公众开放。\n\
    \nMVC（模型-视图-控制器）架构现在被许多网站使用。MVC 中的“V”代表视图（View），而 React 就是 MVC 中的“V”。构建一个 ReactJS\
    \ 应用需要各种组件；这些组件是所有 React 应用的核心。当这些组件与其他部分结合时，它们允许创建复杂的应用程序。\n\n这些组件通过虚拟 DOM (virtual\
    \ DOM) 填充 HTML DOM。因为只需要更改 DOM 的组件而不是整个 DOM，所以虚拟 DOM 是快速的。我们需要 React 组件来构建应用程序，这些组件将组织在决定应用结构的高级元素内部。让我们来看一个带有按钮和输入字段的表单示例，看看它是如何工作的。表单的每个元素都是\
    \ React 组件，而表单本身是一个定义结构的高级组件。在更新虚拟 DOM 后，React 确定修改需要在实际浏览器中进行，而不是直接将 React 组件写入\
    \ DOM。\n\n## React 环境搭建分步指南\n\n本节将教你如何为开发 ReactJS 应用搭建开发环境：\n\n### ReactJS 准备工作\n\
    1. `NodeJS` 和 `NPM`\n2. `React` 和 `DOM`\n3. `Webpack`\n4. `Babel`\n\n#### 两种方式\
    \ - 安装 ReactJS:\n1. 使用 `npm` 命令\n2. 使用 `create-react-app`\n\n#### 使用 `npm` 命令\n\
    \n**第 1 步：安装 NodeJS** 访问 https://nodejs.org。\n**第 2 步：安装 npm** ![Image0000]\n\
    **第 3 步：检查版本** 使用以下命令检查版本![Image0001]\n**第 4 步：创建 package.json 文件** 在你的目录中![Image0002]\n\
    **第 5 步：初始化** 使用以下命令初始化：\n```bash\nnpm init -y\n```\n**第 6 步：安装 React 和 DOM**\n\
    ```bash\nnpm install react react-dom\n```\n**第 7 步：安装 Webpack** Webpack 主要用于打包，开发期间需要它：\n\
    ```bash\nnpm install webpack webpack-cli webpack-dev-server\n```\n**第 8 步：安装 Babel**\
    \ Babel 是一个用于转换源代码的编译器。使用以下命令安装 Babel![Image0003]\n```bash\nnpm install --save-dev\
    \ babel-\n```\n**第 9 步：创建文件** 我们需要创建以下文件以完成安装：\n- `index.html`\n- `App.js`\n-\
    \ `main.js`\n- `webpack.config.js`\n- `.babelrc`\n这些文件可以手动创建或使用以下命令创建：\n```bash\n\
    type nul > filename\n```\n\n#### 第 10 步：配置编译器、加载器和 React 服务器\n\n要配置 webpack，请在\
    \ `webpack.config.js` 中添加以下代码。它负责指定开发期间使用的文件格式，以及安装任何所需的插件。\n\n```javascript\n\
    const path = require('path');\nconst HtmlWebpackPlugin = require('html-webpack-plugin');\n\
    module.exports={\n  entry: './main.js',\n  output:{\n    path: path.join(__dirname,\
    \ '/bundle'),\n    filename: 'index_bundle.js'\n  },\n  devServer:{\n    inline:\
    \ true,\n    port: 8080\n  },\n  module:{\n    rules:[\n      {\n        test:\
    \ /\\.jsx$/,\n        exclude: /node_modules/,\n        use:{\n          loader:\
    \ \"babel-loader\",\n        }\n      }\n    ]\n  },\n  plugins:[\n    new HtmlWebpackPlugin({\n\
    \      template: './index.html'\n    })\n  ]\n}\n```\n\n现在编辑 `package.json` 文件，从\
    \ `\"scripts\"` 对象中删除 `\"test\": \"echo Error: no test specified && exit 1\"`，并将其替换为\
    \ `start` 和 `build` 指令。\n\n删除上述项目并替换为以下两个：\n1. `\"start\": \"webpack-dev-server\
    \ --mode development --open --hot\"`\n2. `\"build\": \"webpack --mode production\"\
    `\n\n如下所示：\n\n### index.html 的 HTML webpack 模板\n使用 `HtmlWebpackPlugin` 插件，我们需要创建一个自定义模板来生成\
    \ `index.html`。它允许我们使用 viewport 标签来方便移动端缩放。在你的 `index.html` 文件中粘贴以下代码：\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>ReactApp</title>\n\
    </head>\n<body>\n  <div id=\"app\"></div>\n  <script src='index_bundle.js'></script>\n\
    </body>\n</html>\n```\n\n"
- fmt: "\nThis is the first react component and serves as the app's entrance point.\
    \ Hello World will be rendered.\n\nIn your `App.js` file, paste the following\
    \ code.\n\n`App.js`\n\n```javascript\nimport React, {Component} from 'react';\n\
    \nclass App extends Component {\n  render() {\n    return (\n      <div>\n   \
    \     <h1>HelloWorld</h1>\n      </div>\n    );\n  }\n}\n\nexport default App;\n\
