  </body>\n</html>\n```\n\n# JavaScript Number\n\n`Number` 对象是一个包装器对象，允许你操作数值值。`Number()`\
  \ 构造函数用于构建数字对象。它可以是整数，也可以是浮点数。\n\n### 语法\n\n```javascript\nvar n=new Number(value);\n\
  ```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n    var x=100;//整数值\n\
  \    var y=100.7;//浮点值\n    var z=12e5;//指数值，输出: 1200000\n    var n=new Number(20);//通过数字对象生成的整数值\n\
  \    document.write(x+\" \"+y+\" \"+z+\" \"+n) ;\n</script>\n</body>\n</html>\n\
  ```\n\n### 输出\n100 100.7 1200000 20\n\n\n\n\n\n本书的设计旨在使我们能够以一种简单高效的方式在 `TensorFlow`\
