  \ tensor_const\nvar_init_2 = tf.get_variable(\"var_init_2\", dtype=tf.int23, initializer=tensor_const)\n\
  print(var_init_2.shape)\n```\nOutput:\n(2, 2)\n\n## 占位符\n\n为了初始化数据并在张量内进行，使用了占位符。我们必须使用\
  \ feed dict 来包含占位符。占位符只会在 session 中填充一次。在下一个示例中，使用 `tf.placeholder` 方法构建占位符。我们将在\
  \ session 中学习如何用真实数据填充占位符。\n\n语法如下：\n```python\ntf.placeholder(dtype, shape=None,\
  \ name=None)\n```\n**参数：**\n- `dtype`: 数据类型\n- `shape`: 占位符的维度。可选。默认是数据的形状。\n- `name`:\
  \ 占位符的名称。可选\n\n```python\ndata_placeholder_a = tf.placeholder(tf.float32, name=\"\
  data_placeholder_a\")\nprint(data_placeholder_a)\n```\nOutput:\nTensor(\"data_placeholder_a:0\"\
  , dtype=float32)\n\n### TensorFlow 通过 3 个组件工作：\n\n- 图 (Graph)\n- 张量 (Tensor)\n-\
  \ 会话 (Session)\n\n| 组件 |  |\n| :--- | :--- |\n| Graph | 在 TensorFlow 中，图至关重要。在图中，执行所有的数学操作\
  \ (ops)。图可以被视为一个项目，其中每个过程几乎完成。这些操作由节点表示，节点可以生成或产生张量。 |\n| Tensor | 张量是从一个操作到下一个操作的数据表示。我们已经看到如何设置张量。可以改变的变量初始值是常量和变量之间的区别。\
  \ |\n| Session | 图上的程序将由 session 执行。我们需要打开一个 session 将图通信到值。为了生成输出，我们必须在 session\
  \ 中运行算子。 |\n\n### Session\n\n图和 session 是独立的实体。我们可以运行一个 session 并保存结果以供以后计算使用。在下面的示例中，我们将：\n\
  \n- 创建两个张量\n- 创建一个操作\n- 打开一个 session\n- 打印结果\n\n步骤-1) 我们创建两个张量 x 和 y\n**运行并评估一个\
  \ session**\n```python\nx = tf.constant([2])\ny = tf.constant([2])\n```\n步骤-2) 我们通过乘以\
  \ x 和 y 创建算子\n**创建算子**\n```python\nmultiply = tf.multiply(x,y)\n```\n步骤-3) 我们开始一个会议。两个计算将在\
  \ session 期间进行。完成后，我们需要结束 session。\n**创建一个 session 来运行给定代码**\n```python\nsess =\
  \ tf.Session()\nresult_1 = sess.run(multiply)\nprint(result_1)\nsess.close()\n```\n\
