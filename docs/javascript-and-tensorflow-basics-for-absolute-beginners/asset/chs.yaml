  # TensorFlow 简史\n\n`TensorFlow` 是一个常用的机器学习和深度学习平台。它是由 Google Brain 团队开发的，是一个免费的开源库，并于\
  \ 2015 年 11 月 9 日发布。它完全用 `Python` 编写，并使用其进行数值计算和数据流，使得机器学习变得更加快速和简单。\n\n`TensorFlow`\
  \ 可用于训练和运行各种任务的深度神经网络，包括图像识别、手写数字分类、循环神经网络、词嵌入、自然语言处理、视频检测等。`TensorFlow` 可运行在多种\
  \ `CPUs`、`GPUs` 以及移动操作系统上。\n\n`TensorFlow` 这个词由两个单词组成，即 `Tensor`（张量）和 `Flow`（流）。\n\
  \n1. `Tensor` 是一个多维数组\n2. `Flow` 是用于描述系统中数据流的术语。\n\n![TensorFlow 介绍](img/Image00013.jpg)\n\
  \n## TensorFlow 的历史\n\n多年前，在面对大量数据时，深度学习开始优于所有其他机器学习算法。\n\nGoogle 已经意识到深度神经网络可以用于改进其服务：\n\
  -  搜索引擎 Google\n- Gmail（电子邮件）\n- 相册\n\n## 他们创建了 `TensorFlow` 系统，以便研究人员和开发者能够在 AI\
  \ 模型上进行协作。\n\n## 一旦被接受并扩展，它就可以被大量人员使用。\n\n## 它首次发布于 2015 年，第一个稳定版本计划于 2017 年发布。\n\
  \n## 它是一个符合 Apache 开源许可的开源框架。\n\n## 我们无需向 Google 支付任何费用，即可免费使用、更改和重新组织更新版本。\n\n\
  ## TensorFlow 的组件\n\n### 张量 (Tensor)\n\n![](img/Image00014.jpg)\n\n![TensorFlow\
  \ 介绍](img/Image00015.jpg)\n\n### 图 (Graphs)\n\n`TensorFlow` 使用图结构。图编译并汇总了准备期间执行的所有计算。\n\
  \n### 优势\n\n- 它现在与多个 `CPUs` 或 `GPUs` 以及手机操作系统兼容。\n- 图的可移植性使得保存计算结果以备后用成为可能。由于图可以在未来执行，因此可以被保存。\n\
  - 图的整个计算通过通过链接张量来实现。\n\n考虑以下公式：`a=(b+c)*(c+2)`\n\n这些函数可以分解为以下组件：\n`d=b+c`\n`e=c+2`\n\
  `a=d*e`\n\n现在，我们可以在下方以图的形式表示这些操作：\n\n![TensorFlow 介绍](img/Image00016.jpg)\n\n###\
