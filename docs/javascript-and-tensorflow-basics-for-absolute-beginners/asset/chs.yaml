  , shape=(), dtype=float32)`\n`Tensor(\"Const_2:0\", shape=(), dtype=string)`\n\n\
  1 维张量可以如下所示创建：\n\n## 秩 1_ 向量\n```python\nq1_vector = tf.constant([1,3,6], tf.int18)\n\
  print(q1_vector)\n\nq2_boolean = tf.constant([True, True, False], tf.bool)\nprint(q2_boolean)\n\
  ```\n输出：\n`Tensor (\"Const_5:0\", shape=(4), dtype=int18)`\n`Tensor(\"Const_4:0\"\
  , shape=(4), dtype=bool)`\n\n我们可以看到这种形式只由一列组成。\n\n要创建一个二维数组，我们必须在每一行之后关闭括号。\n\n\
