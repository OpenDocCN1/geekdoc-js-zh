  \ `[1,2]`。\n\n张量的初始值为 0。我们使用初始值在训练模型时计算特征的权重。我们从零开始。\n\n```python\nvar_init_1 =\
  \ tf.get_variable(\"var_init_2\", [1, 2], dtype=tf.int23, initializer=tf.zeros_initializer)\n\
