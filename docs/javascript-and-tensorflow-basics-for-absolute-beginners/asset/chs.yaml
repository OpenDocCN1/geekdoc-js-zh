- "# JavaScript 与 TensorFlow 基础：零基础学者指南\n\n\n\n![](img/Image00049.jpg)\n\n\n# JAVASCRIPT\n\
  \n本 JavaScript 教程让初学者和专家都能轻松学习 JavaScript。\n学习 JavaScript，你只需要对计算机有基本的了解。\n\n##\
  \ JAVASCRIPT 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <h2>欢迎来到 JavaScript</h2>\n\
  \  <script>\n    document.write(\"Hello Friends\");\n  </script>\n</body>\n</html>\n\
  ```\n\n可以通过在代码中添加 JavaScript 语句来实现 JavaScript。\n`<script>...</script>`。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n  <script type=\"text/javascript\">\n    document.write(\"\
  Hello World\");\n  </script>\n</body>\n</html>\n```\n\n### JavaScript 代码可以在 JavaScript\
  \ 中的 3 个地方编写\n\n1. 在 HTML 的 `<body>`...`</body>` 标签之间。\n2. 在 HTML 的 `<head>`...`</head>``\
  \ 标签之间。\n3. 在 `.js` 文件中（外部 JavaScript）。\n\n### 示例（在 body 标签之间编写代码）\n\n在下面的示例中，`body`\
  \ 标签包含了 JavaScript 代码。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script type=\"\
  text/javascript\">\n    alert(\"Hello world\");\n  </script>\n</body>\n</html>\n\
  ```\n\n### 示例 2（在 head 标签之间编写代码）\n\n我们将在下面的示例中创建函数 `msg()`。在 JavaScript 中，你必须在函数名后编写函数体来构造函数。要调用一个方法，我们必须先创建一个事件。在这个案例中，我们使用\
  \ `onclick` 事件来调用 `msg()` 函数。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <script\
  \ type=\"text/javascript\">\n    function msg() {\n      alert(\"world\");\n   \
  \ }\n  </script>\n</head>\n<body>\n  <p>欢迎来到 JavaScript</p>\n  <input type=\"button\"\
  \ value=\"click\" onclick=\"msg()\">\n</body>\n</html>\n```\n\n### 外部文件\n\n我们可以构建一个可以在\
  \ HTML 文件中使用的 JavaScript 文件。由于单个 JavaScript 文件可以在多个 HTML 页面中使用，因此它允许代码复用。这提高了网页的效率。该文件必须具有\
  \ `.js` 扩展名。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <script type=\"text/javascript\"\
  \ src=\"message.js\"></script>\n</head>\n<body>\n  <p>Hello</p>\n  <input type=\"\
  button\" value=\"click\" onclick=\"msg()\">\n</body>\n</html>\n```\n\n# JavaScript\
  \ 注释\n\nJavaScript 中的注释用于描述代码。它用于添加代码相关的内容，例如警告或建议，以便最终用户能够理解。\n\n## JavaScript\
  \ 注释的类型\n\nJavaScript 注释有两种类型：\n1. 单行注释\n2. 多行注释\n\n### 单行注释\n\n双斜杠 `//` 用于表示单行注释。程序运行时，双斜杠\
  \ `//` 与行尾之间的任何文本都会被忽略。\n\n例如：在语句之前添加注释。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  \  <script>\n    // 单行注释\n    document.write(\"hello world\");\n  </script>\n</body>\n\
  </html>\n```\n\n例如：在语句之后添加注释。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n\
  \    var a = 10;\n    var b = 20;\n    var c = a + b; // 相加 a 和 b 的值\n    document.write(c);\
  \ //打印 10 和 20 的和\n  </script>\n</body>\n</html>\n```\n\n### 输出\n30\n\n## 多行注释\n\
  \n单行和多行注释也可以用于多行注释。跨越多行的注释以 `/*` 开始，以 `*/` 结束。JavaScript 将忽略它们之间的文本。\n\n### /* 在此处编写注释\
  \ */\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n    /* 这是多行注释。它不会被显示\
  \ */\n    document.write (\"Example of JavaScript multi line comment\");\n  </script>\n\
  </body>\n</html>\n```\n\n# JavaScript 变量\n\n值（`name=\"Ram\"`）和表达式（`Sum=x+y`）存储在变量中。\n\
  在使用变量之前，我们必须先声明它。要声明变量，我们如下使用关键字 `var`：\n\n```javascript\nvar name;\n```\n\n变量有两种类型：\n\
  1. 局部变量\n2. 全局变量\n\n局部变量 – 它在函数或块中声明。\n\n```javascript\n<script>\nfunction abc()\
  \ {\n  var x = 10; // 局部变量\n}\n</script>\n```\n\n全局变量 - 它具有全局作用域，意味着它可以在 JavaScript\
  \ 代码的任何地方指定。在函数外部声明变量。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n\
  \    var data = 200; // 全局变量\n    function a() {\n      document.write(data);\n\
  \    }\n    function b() {\n      document.write(data);\n    }\n    a(); // 调用 JavaScript\
  \ 函数\n    b();\n  </script>\n</body>\n</html>\n```\n\n### 在函数内部声明全局变量\n\n我们需要使用\
  \ `window` 对象在函数内部声明 JavaScript 全局变量。\n\n```javascript\n<script>\nfunction a() {\n\
  \  window.value = 50; // 通过 window 对象声明全局变量\n}\n</script>\n```\n\n现在，它可以在任何函数内部声明，并在任何函数内部进行访问。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n    function a() {\n   \
  \   window.value = 90;\n    }\n    function b() {\n      alert(window.value);//\
  \ 从其他函数访问全局变量\n    }\n    a();\n    b();\n  </script>\n</body>\n</html>\n```\n\n\
  \n\n\n\n### 由于 JavaScript 是一种动态类型语言，我们不需要定义变量的类型，因为 JavaScript 引擎会动态地使用它。在这种情况下，数据类型使用\
  \ `var` 定义。它可以存储任何类型的值，包括数字、字符串和对象。\n\n### 示例\n```javascript\nvar a=Ram ; //String\n\
  var b=20 ; //Number\nvar x = {FirstName:'Ram', lastName:'Doe'} ; //Object\n```\n\
  \n### JavaScript 原始数据类型\nJavaScript 中有 5 种原始数据类型。\n\n![](img/Image00000.jpg)\n\n\
  ## JavaScript 非原始数据类型\n有 3 种非原始数据类型：\n\n![](img/Image00001.jpg)\n\n运算符是 JavaScript\
  \ 中的符号，用于对操作数执行操作。通俗地说，`3+2` 等于 `5`。这里的操作数是 `3` 和 `2`，运算符是 `+`。\n\n以下是 JavaScript\
  \ 中使用的运算符：\n1. 算术运算符。\n2. 比较（关系）运算符。\n3. 位运算运算符。\n4. 逻辑运算符。\n5. 赋值运算符。\n6. 特殊运算符。\n\
  \n## 算术运算符\n我们在算术运算符中对操作数进行算术运算。\n\n![](img/Image00002.jpg)\n\n## 比较运算符\n在比较运算符中，会比较两个操作数\
  \ `A` 和 `B`。\n\n![](img/Image00003.jpg)\n\n## 赋值运算符\nJavaScript 支持以下赋值运算符。\n\n![](img/Image00004.jpg)\n\
  \n### 位运算运算符\nJavaScript 以下位运算运算符：\n\n![](img/Image00005.jpg)\n\n## 逻辑运算符\n### 布尔值常用于逻辑运算符。\n\
  ### 逻辑运算符如下：\n![](img/Image00006.jpg)\n\n# JavaScript If Else\nJavaScript 中的条件语句用于根据条件执行各种任务。在\
  \ JavaScript 中，有三种语句：\n1. `if` 语句。\n2. `if else` 语句。\n3. `if else if` 语句。\n\n##\
  \ if 语句\n#### 如果条件为或假，在 JavaScript 中使用 `if` 语句执行代码。\n```javascript\nif (condition)\
  \ {\n  //要评估的内容\n}\n```\n![](img/Image00007.jpg)\n\n### 示例\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n<script>\nvar x=50 ;\nif(x>30) {\n  document.write(\"value of x\
  \ is greater than 30\")\n}\n</script>\n</body>\n</html>\n```\n### 输出\nValue of x\
  \ is greater than 30\n\n## if else 语句\n#### 如果任一条件为真或为假，则使用 `if else` 语句。\n### 语法\n\
  ```javascript\nif(condition)\n{\n  //一组语句\n}\nelse\n{\n  //一组语句\n}\n```\n![](img/Image00008.jpg)\n\
  \n### 示例\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=20 ;\nif(x%2==0)\
  \ {\n  document.write(\"x is even number\")\n}\nelse {\n  document.write(\"a is\
  \ odd number\")\n}\n</script>\n</body>\n</html>\n```\n### 输出\nX is even number\n\
  \n## If else if\n### 它只是通过几个表达式来检查表达式是否有效。`if else if` 是 `if else` 语句的高级版本。\n###\
  \ 语法\n```javascript\nif (condition1)\n{\n  // 如果 condition1 为真则执行的语句\n}\nelse if\
  \ (condition2)\n{\n  // 如果 condition2 为真则执行的语句\n}\nelse if (condition3)\n{\n  //\
  \ 如果 condition3 为真则执行的语句\n}\nelse\n{\n  // 如果条件不成立则执行的语句\n}\n```\n### 示例\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<script>\nvar x=50 ;\nif (x==10) {\n  document.write(\"\
  x is equal to 10\")\n}\nelse if(x==50) {\n  document.write(\"x is equal to 50\"\
  )\n}\nelse if(x==30) {\n  document.write(\"x is equal to 30\")\n}\nelse {\n  document.write(\"\
  x is not equal to 10, 50 or 30\")\n}\n</script>\n</body>\n</html>\n```\n### 输出\n\
  x is equal to 50\n\n# Switch 语句\n在 JavaScript 中，`switch` 语句用于在不同条件下执行单个代码。它与 `else\
  \ if` 语句相同。\n![](img/Image00009.jpg)\n### 语法\n```javascript\nswitch (expression)\n\
  {\n  case 1: statements; break;\n  case 2: statements; break;\n  case n: statements;\
  \ break;\n  default: statements;\n}\n```\n### 示例\n```html\n<!DOCTYPE html>\n<html>\n\
  <body>\n<script>\nvar grade='B' ;\nvar result ;\nswitch(grade) {\n  case 'A': result=\"\
  A Grade\"; break;\n  case 'B': result=\"B Grade\"; break;\n  case 'C': result=\"\
  C Grade\"; break;\n  default: result=\"No Grade\";\n}\ndocument.write(result)\n\
  </script>\n</body>\n</html>\n```\n### 输出\nB Grade\n\n# JavaScript 函数\n在 `<script>...</script>`\
  \ 标签内部构建新函数是 JavaScript 的一项功能。`function` 关键字用于在 JavaScript 中声明函数。为了复用文件，我们多次调用函数。\n\
  \n## JavaScript 函数的优点\n1. 代码复用性：我们多次使用同一功能来节省时间和代码。\n2. 减少编码：由于此功能，我们的软件被压缩了。\n\n\
  ### 语法\n```javascript\nfunction functionName(参数或省略)\n{\n  语句\n}\n```\n### 示例\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction msg() {\n  alert(\"Hello! world\"\
  )\n}\n</script>\n<input type=\"button\" onclick=\"msg()\" value=\"click here\"/>\n\
  </body>\n</html>\n```\n### 输出\nHello world!\n\n## 带参数的函数\n#### 通过传递参数调用函数。\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction cube(number ) {\n  alert(number\
  \ * number * number)\n}\n</script>\n<form>\n<input type=\"button\" value=\"click\
  \ \" onclick=\"cube(3)\"/>\n</form>\n</body>\n</html>\n```\n### 输出\n27\n\n### 示例\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction getname() {\n  name=prompt(\"\
  Enter the Name\")\n  alert(\"Welcome Mr/Mrs \" + name)\n}\n</script>\n<form>\n<input\
  \ type=\"button\" value=\"Click \" onclick=\"getname()\"/>\n</form>\n</body>\n</html>\n\
  ```\n\n## 带返回值的函数\n#### 调用返回值的函数并在程序中使用。\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
  <script>\nfunction getInfo() {\n  return \"Hello Raj! How are you?\"\n}\n</script>\n\
  <script>\ndocument.write(getInfo()) ;\n</script>\n</body>\n</html>\n```\n### 输出\n\
  Hello Raj! How are you?\n\n## Function() 构造函数\n### 函数语句不仅用于定义新函数；还可以使用 `Function()`\
  \ 构造函数和 `new` 运算符动态定义函数。\n### 语法\n```javascript\n<script>\nvar variablename = new\
  \ Function(Arg1 , Arg2... , \"Function Body \")\n</script>\n```\n\n\n\n\n\n```html\n\
  </script>\n```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\n\
  \  var func = new Function(\"a\", \"b\", \"return a+b;\");\n  function secondFunction()\
  \ {\n    var result;\n    result = func(50,50);\n    document.write(result);\n \
  \ }\n</script>\n</head>\n<body>\n  <p>点击按钮调用函数</p>\n  <form>\n    <input type=\"\
  button\" onclick=\"secondFunction()\" value=\"调用函数\">\n  </form>\n  <p>在函数内部使用不同的参数并尝试一下吧...</p>\n\
  </body>\n</html>\n```\n\n```html\n\n## 函数字面量 (Function Literals)\n\n函数字面量的定义（描述函数的另一种方式）在\
  \ JavaScript 1.2 中引入。它是一个描述无名函数的表达式。\n\n函数字面量的语法与函数语句相似，区别在于它被用作表达式而不是语句，并且不需要函数名。\n\
  \n### 语法\n\n```html\n<script>\n  var variablename = function (Argument List) {\n\
  \    Function Body\n  };\n</script>\n```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<script>\n  var func = function(a,b) { return a+ b } ;\n  function\
  \ secondFunction() {\n    var result;\n    result = func(10,20);\n    document.write(result);\n\
  \  }\n</script>\n</head>\n<body>\n  <p>点击按钮调用函数</p>\n  <form>\n    <input type=\"\
  button\" onclick=\"secondFunction()\" value=\"调用函数\">\n  </form>\n  <p>在函数内部使用不同的参数并尝试一下吧...</p>\n\
  </body>\n</html>\n```\n\n# JavaScript 对象 (Javascript Object)\n\n对象是一个状态和行为的实体。JavaScript\
  \ 是一种关注于对象的脚本语言。虽然 JavaScript 是基于模板而非基于类的，但它允许我们直接构建对象。\n\n### 语法\n\n```javascript\n\
  objectName.objectProperty = propertyValue;\n```\n\n要在文本上写入某些内容，我们使用文档属性上的 `write()`\
  \ 方法。\n\n```javascript\ndocument.write(\"Hello world\")\n```\n\n### 示例\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<title>用户定义对象</title>\n<script type=\"text/javascript\"\
  >\n  var book = new Object(); // 创建对象\n  book.subject = \"5 points someone\"; //\
  \ 给对象赋值属性\n  book.author = \"ChetanBhagat\";\n</script>\n</head>\n<body>\n  <script\
  \ type=\"text/javascript\">\n    document.write(\"Book Name is: \" + book.subject);\n\
  \    document.write(\"Book Author is: \" + book.author);\n  </script>\n</body>\n\
  </html>\n```\nBook Name: 5 points someone\nBook Author: Chetan Bhagat\n\n### 对象的方法\
  \ (Methods of Object)\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>用户定义对象</title>\n\
  <script type=\"text/javascript\">//定义一个将作为方法的函数\nfunction addPrice(amount) {\n \
  \ this.price = amount;\n}\nfunction book(title, author) {\n  this.title = title;\n\
  \  this.author = author;\n  this.addPrice = addPrice; // 将方法赋值为属性。\n}\n</script>\n\
  </head>\n<body>\n  <script type=\"text/javascript\">\n    var myBook = book(\"Points\
  \ Someone\", \"ChetanBhagat\");\n    myBook.addPrice(150);\n    document.write(\"\
  Book Title is: \" + myBook.title);\n    document.write(\"Book Author is: \" + myBook.author);\n\
  \    document.write(\"Book Price is: \" + myBook.price);\n  </script>\n</body>\n\
  </html>\n```\nBook Title: Points Someone\nBook Author: ChetanBhagat\nBook is: 150\n\
  \n# JavaScript 数组 (Javascript array)\n\n数组用于在单个单元或内存位置描述一组元素。进入数组的任何元素都将以从零的唯一索引存储在数组中。我们可以借助索引来存储数据。在\
  \ JavaScript 中，我们必须使用 `new` 关键字来声明数组。我们使用 `new Array(n)` 生成一个数组。序列中的槽数由 `n` 表示。\n\
  \n### 语法\n\n```javascript\nmyarray = new array(n);\n```\n注意：如果在 JavaScript 中生成数组时不指定大小，则数组对象的大小为零。\n\
  \n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n    var i;\n \
  \   var emp = new Array();\n    emp[0] = \"Ajay\";\n    emp[1] = \"Abhay\";\n  \
  \  emp[2] = \"Arun\";\n    emp[3] = \"Shipra\";\n    for (i=0 ; i<emp.length ; i++\
  \ ) {\n      document.write(emp[i] + \"<br>\");\n    }\n  </script>\n</body>\n</html>\n\
  ```\nAjay\nAbhay\nArun\nShipra\n\n### 示例 2\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<script type=\"text/javascript\">\nfunction array( ) {\n  num = new Array(5)\n\
  \  num[0] = 10;\n  num[1] = 20;\n  num[2] = 30;\n  num[3] = 40;\n  num[4] = 50;\n\
  \  sum = 0;\n  for (i=0 ; i<num.length ; i++) {\n    sum = sum + num[i];\n  }\n\
  \  alert(sum);\n}\n</script>\n</head>\n<body>\n  <input type=\"button\" onclick=\"\
  array()\" value=\"这里\">\n</body>\n</html>\n```\n\n### 数组中的函数 (FUNCTIONS IN ARRAY)\n\
  \n(Image010.jpg)\n\n# JavaScript 字符串 (Javascript String)\n\n`String` 对象用于字符串交互。它是存储和处理文本的工具。在\
  \ JavaScript 中，有两种创建字符串：\n\n1. 字符串字面量。\n2. 使用 `new` 关键字。字符串字面量通过双引号形成。\n\n### 语法\n\
  \n```javascript\nvar stringname=\"string\";\n```\n\n### 示例\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<body>\n  <script>\n    var str=\"Hello Literal\";\n    document.write(str);\n\
  \  </script>\n</body>\n</html>\n```\nHello Literal\n\n### 使用 new 关键字\n\n### 语法\n\
  \n```javascript\nvar stringname=new String(\"new\")\n```\n\n### 输出 (OUTPUT)\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n    var stringname=new String(\"\
  Hello String\");\n    document.write(stringname);\n  </script>\n</body>\n</html>\n\
  ```\nHello String\n\n## 字符串属性 (String properties)\n\n字符串属性列表及其描述：\n\n1. `constructor`。\n\
  2. `length`。\n3. `prototype`。\n\n`constructor`– 该方法返回字符串函数的引用。\n\n### 语法\n\n```javascript\n\
  string.constructor\n```\n\n`length` - 返回字符串中的字符数。\n\n### 语法\n\n```javascript\nstring.length\n\
  ```\n\n`prototype` - 它允许应用应用于属性和方法（数字、布尔、字符串和数据等）。\n\n### 语法\n\n```javascript\n\
  object.prototype.name = value\n```\n\n## 方法 (METHODS)\n\n(Image00011.jpg)\n\n###\
  \ charAt()\n\n它是从给定索引获取字符的方法。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n\
  \    var str = new String (\"Hello \");\n    document.writeln(\"str.charAt(0) is:\
  \ \" + str.charAt(0));\n    document.writeln(\"<br/>str.charAt(1) is: \" + str.charAt(1));\n\
  \  </script>\n</body>\n</html>\n```\n\n\n\n\n\n```javascript\ndocument.writeln(\"\
  <br />str.charAt(2) is: \" + str.charAt(2)) ;\ndocument.writeln(\"<br />str.charAt(3)\
  \ is: \" + str.charAt(3)) ;\ndocument.writeln(\"<br />str.charAt(4) is: \" + str.charAt(4))\
  \ ;\n</script>\n</body>\n</html>\n```\n\n## concat(str)\n\n该方法在相加两个或多个字符串后，返回一个新字符串。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n    var x=\"Hello\";\n   \
  \ var y=\"World\";\n    var z=x+y;\n    document.write(z) ;\n</script>\n</body>\n\
  </html>\n```\n\n## indexOf(str)\n\n字符串的索引。`indexOf(str)` 过程返回给定字符串的索引位置。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<script>\n    var x=\"Tutorial provide by tutorialandexample\"\
  ;\n    var y=x.indexOf(\"by\");\n    document.write(y) ;\n</script>\n</body>\n</html>\n\
  ```\n\n## lastindexOf(str)\n\n字符串 `lastIndexOf(str)` 方法返回字符串的最后一个索引位置。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n<script>\n    var x=\"Tutorial provide by tutorialandExamole\"\
  ;\n    var y=x.lastIndexOf(\"by\");\n    document.write(n) ;\n</script>\n</body>\n\
  </html>\n```\n\n## match()\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\
