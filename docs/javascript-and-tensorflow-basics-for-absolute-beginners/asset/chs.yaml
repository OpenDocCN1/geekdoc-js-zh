  \    print\n    \"Epoch:\", '%04d' % (epoch + 1), \"cost=\", \"{:.9f}\".format(avg_cost)\n\
  avg_set.append(avg_cost)\nepoch_set.append(epoch + 1)\nprint\n    \"Training phase\
