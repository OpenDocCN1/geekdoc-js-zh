  \ ( )) ;\n</script>\n</body>\n</html>\n```\n\n# JavaScript Date\n\nDate 对象是 JavaScript\
  \ 语言中内置的一种数据类型。新的 `Date` 对象用于构建数据对象 ()。时间中的单个时刻由 JavaScript Date 实例表示。创建 JavaScript\
  \ 日对象的唯一方法是使用 JavaScript 作为构造函数。\n\n### 语法\n\n`Date()` 构造函数可以使用以下语法生成 `Date` 对象。\n\
  \n```javascript\nnew Date();\nnew Date(value);\nnew Date(dateString);\nnew Date(year,\
  \ month, day, hours, minutes, seconds, milliseconds);\n```\n\n### 注意：括号中的参数始终是可选的。\n\
  \n### 描述\n\n#### year\n年份由整数表示。对于 2000 年到 2099 年，值范围从 0 到 99 的映射。\n\n#### Month\n\
  从 0（一月）开始到 11 结束，此整数值表示月份。\n\n#### Date\n这是一个可选参数。月份的天数由整数值表示。\n\n#### Hours\n这是一个可选参数。一天的小时由整数值表示。\n\
  \n#### Minutes\n这是一个可选参数。时间的分钟部分由整数值表示。\n\n#### Seconds\n这是一个可选参数。秒由整数值表示。\n\n####\
  \ Milliseconds\n这是一个可选参数。时间的毫秒段由整数值表示。\n\n### Date 示例\n```html\n<!DOCTYPE html>\n\
  <html>\n<body>\n<script>\n    var date=new Date();\n    var day=date.getDate();\n\
  \    var month=date.getMonth()+1;\n    var year=date.getFullYear();\n    document.write(\"\
  <br>\"+day+\"/\"+month+\"/\"+year) ;\n</script>\n</body>\n</html>\n```\n\n#### 当前时间\
