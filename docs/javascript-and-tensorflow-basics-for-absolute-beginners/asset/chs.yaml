  \    var h=today.getHours();\n    var m=today.getMinutes();\n    var s=today.getSeconds();\n\
  \    document.getElementById('txt').innerHTML=h+\":\"+m+\":\"+s ;\n</script>\n</body>\n\
  </html>\n```\n\n# JavaScript Math\n\n`Math` 是一个内置对象，具有用于数学函数和常量的属性和方法。它允许你对数字执行数学运算。\n\
  \n### 语法\n\n1. `var pi_val=Math.PI;`\n2. `var sin_val=Math.sin ( 3 );`\n\n### 示例\n\
