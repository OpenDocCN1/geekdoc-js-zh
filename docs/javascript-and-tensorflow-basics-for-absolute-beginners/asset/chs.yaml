  实际权重是蓝色，负权重是橙色。\n\n根据输入，输出层的点被染成橙或蓝色。\n\n### 用例\n为什么可以增加隐藏层神经元的数量？\n\n在隐藏层中，我们可以从单个神经元开始（浅层神经网络）。让我们使用\
  \ `X1` 和 `X2` 的 `Circle` 数据集、`0.03` 学习率和 `ReLU`。\n\n点击 `run` 按钮等待数百个 Epoch 完成，然后按下\
  \ `pause` 按钮。\n\n100 个 Epoch 后，我们将使用 `add` 按钮向隐藏层添加四个神经元并再次运行。\n\n背景描绘了一个位置。\n\n\
  ### 为什么在分类问题中使用非线性激活函数？\n由于我们的输出标签介于 0 和 1 之间，而线性激活函数可以提供从 - 到 + 之间的任何数字，因此我们在神经网络中使用非线性激活函数。\n\
  \n结果是，模型将在未来的某点收敛。\n\n# TensorFlow 基础\nGoogle Brain 团队创建了 TensorFlow，一个机器学习系统。它的名字来源于\
  \ Tensor（张量）结构。张量用于 TensorFlow 中的任何计算。\n\n张量是表示不同类型数据的 n 维向量或矩阵。TensorFlow 的值描述了具有已知形状的数据。\n\
  \n矩阵或数组的维度是数据的形状。\n\n### 张量的表示\nTensorFlow 中的张量是 n 维特征向量集（类似于数组）。例如，如果我们有一个从 1 到\
  \ 6 的 2x3 矩阵，我们可以写道：\n\n![TensorFlow Basics](img/Image00028.jpg)\n\nTensorFlow 将此矩阵表示为：\n\
  ```\n[[1, 3, 5],\n[2, 4, 6]]\n```\n\n如果我们创建一个从 1 到 8 的三维矩阵，我们将得到：\n\n![TensorFlow\
  \ Basics](img/Image00029.jpg)\n\nTensorFlow 将此矩阵表示为：\n```\n[[[1, 2], [3, 4]], [[5,\
  \ 6], [7, 8]]]\n```\n\n\n\n\n\n3. `[[5, 6]]`\n4. `[[7, 8]]`\n\n注意：张量可以由标量或超过三个维度的形式定义。只是很难预测如此大的尺寸。\n\
  \n# 张量的类型\n\n在 TensorFlow 中，所有的计算都通过一个或多个张量（Tensors）进行。张量是一个具有以下三个属性的实体：\n\n* 唯一的标签（名称）\n\
  * 维度（形状）\n* 数据类型（dtype）\n\n每个 TensorFlow 操作都需要对张量进行操作。我们可以创建四种类型的张量：\n\n* `tf.Variable`\n\
  * `tf.constant`\n* `tf.placeholder`\n* `tf.SparseTensor`\n\n我们将在本书书中学习如何创建 `tf.variable`\
  \ 和 `tf.constant`。\n\n确保在 TensorFlow 中激活了 `conda` 环境。`hello-tf` 是我们给这个环境的名字。\n\n\
  对于 Windows 用户：\n\n```bash\nactivate hello-tf\n```\n\n对于 macOS 用户：\n\n```bash\nsource\
  \ activate hello-tf\n```\n\n完成这些操作后，我们就可以导入 tensorflow 了。\n\n```python\n# 导入 tf\n\
  import tensorflow as tf\n```\n\n# 创建 n 维张量\n\n我们首先开始创建一个标量，它是一个一维张量。\n\n我们可以使用 `tf.constant`\
  \ 来创建一个张量 `()`。\n\n```python\ntf.constant(value, dtype, name = \"\")\n```\n\n参数\n\
  \n* `Value`：用于定义张量的 n 维 `Value`。它是可选的。\n* `dtype`：定义数据类型：\n    * `tf.string`: 字符串变量\n\
  \    * `tf.float32`: 浮点数变量\n    * `tf.int16`: 整数变量\n* `\"name\"`：张量的名称。可选。默认值为 `Const_1:0`。\n\
  \n要创建一个 0 维的张量，请运行以下代码。\n\n## rank 0\n默认名称\n```python\nr1=tf.constant (1, tf.int18)\n\
  print (r1)\n```\n输出：\n`Tensor (\"Const: 0\", shape= (), dtype=int18`\n\n## 命名为 my_scalar\n\
  ```python\nr2 = tf.constant(1, tf.int18, name = \"my_scalar\")\nprint(r2)\n```\n\
  输出：\n`Tensor (\"my_scalar:0\", shape=( ), dtype=int18`\n\n每个张量都会显示其名称。每个张量对象都是使用唯一的标签（名称）、维度（形状）和数据类型（dtype）创建的。\n\
  \n要更改数据类型，我们可以用小数值或字符串定义张量。\n\n## 小数数据\n```python\nq1_decimal = tf.constant(1.12345,\
