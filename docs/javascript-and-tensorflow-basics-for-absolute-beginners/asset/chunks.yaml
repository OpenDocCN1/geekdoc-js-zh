    We use the variable class to deal with data that often has different values. It\
    \ will represent a node with a changing value.\n\nWe use the `tf.get_variable()`\
    \ method to generate a value.\n\n```python\ntf.get_variable(name = \"\", values,\
    \ dtype, initializer)\n```\n\n**argument**\n- `name = \"\"`: Name of the variable\n\
    - `values`: Dimension of the tensor\n- `dtype`: Type of data. Optional\n- `initializer`:\
    \ How to initialize the tensor. Optional\n\nIf `initializer` is specified, then\
    \ here is no need to include the `\"values\"` as the shape of `\"initializer\"\
    ` is used.\n\nThe code, for example, generates a two-dimensional variable with\
    \ two randomly generated values. TensorFlow returns a random value by chance.\
    \ The variable is called \"var.\"\n\n# Create a Variable\n\n### Create 2 Randomized\
    \ values\n\n```python\nvar = tf.get_variable(\"var\", [1, 2])\nprint(var.shape)\n\
    ```\nOutput:\n(1, 2)\n\nWe can construct a variable with one row and two columns\
    \ in the second example. To make the variable's dimension, we'll need to use `[1,2]`.\n\
    \nThe tensor's initial values are zero. We use initial values to compute the weight\
    \ of features when training a model. We started with a value of zero.\n\n```python\n\
    var_init_1 = tf.get_variable(\"var_init_2\", [1, 2], dtype=tf.int23, initializer=tf.zeros_initializer)\n\
    print(var_init_1.shape)\n```\nOutput:\n(2, 1)\n\nA constant tensor's value can\
    \ be passed into the vector. The formula `tf.constant` is used to construct a\
    \ constant tensor. This tensor is used to set up the variable.\n\nThe variable's\
    \ first values are 10, 20, 30, 40, and 50. The latest tensors have a 2x2 form.\n\
    \n### Create any 2x2 matrix\n\n```python\ntensor_const = tf.constant([[10, 30],\
    \ [20, 40]])\n# Initialize the first value of the tensor equal to tensor_const\n\
    var_init_2 = tf.get_variable(\"var_init_2\", dtype=tf.int23, initializer=tensor_const)\n\
    print(var_init_2.shape)\n```\nOutput:\n(2, 2)\n\n## Placeholder\n\nTo initialize\
    \ the data and proceed within the tensor, a placeholder is used. We must use the\
    \ feed dict to include a placeholder. The placeholder will only be fed once session.\
    \ The method `tf.placeholder` is used to build a placeholder in the next example.\
    \ You'll learn how to fill a placeholder with real data in our session.\n\nThe\
    \ syntax is as follows:\n```python\ntf.placeholder(dtype, shape=None, name=None)\n\
    ```\n**arguments:**\n- `dtype`: Type of data\n- `shape`: the dimension of the\
    \ placeholder. Optional. By default, the shape of the data.\n- `name`: Name of\
    \ the placeholder. Optional\n\n```python\ndata_placeholder_a = tf.placeholder(tf.float32,\
    \ name=\"data_placeholder_a\")\nprint(data_placeholder_a)\n```\nOutput:\nTensor(\"\
    data_placeholder_a:0\", dtype=float32)\n\n### TensorFlow works in 3 components:\n\
    \n- Graph\n- Tensor\n- Session\n\n| Components | Description |\n| :--- | :---\
    \ |\n| Graph | In TensorFlow, the graph is crucial. Inside the graph, all mathematical\
    \ operations (ops) are carried out. A graph can be viewed as a project in which\
    \ each process is nearly completed. These operations are represented by nodes,\
    \ which can generate or generate tensors. |\n| Tensor | A tensor is a representation\
    \ of data that moves from one operation to the next. We've already seen how to\
    \ set up the tensor. The initial values of a variable, which can shift, are the\
    \ difference between a constant and a variable. |\n| Session | The procedure on\
    \ the graph will be performed by a session. We need to open a session to communicate\
    \ the graph to the values. To generate an output, we must run an operator within\
    \ a session. |\n\n### Session\n\nGraphs and sessions are separate entities. We\
    \ can run a session and save the results for later use in calculations. In the\
    \ example below, we will:\n\n- Create two tensors\n- Create an operation\n- Open\
    \ a session\n- Print the result\n\nStep-1) we create two tensors x and y\n**Create\
    \ run and evaluate a session**\n```python\nx = tf.constant([2])\ny = tf.constant([2])\n\
    ```\nStep-2) we create the operator by multiplying x and y\n**Create operator**\n\
    ```python\nmultiply = tf.multiply(x,y)\n```\nStep-3) We start a meeting. Both\
    \ computations will take place during the session. When we're done, well need\
    \ to end the session.\n**Create a session to run the given code**\n```python\n\
    sess = tf.Session()\nresult_1 = sess.run(multiply)\nprint(result_1)\nsess.close()\n\
    ```\nOutput:\n[8]\n\n## Explanation of Code\n\n![](Image0031.jpg)\n\nThe multiplication\
    \ of `x` and `y` yields the result \"8.\" Another option is to build a session\
    \ within a block. The benefit is that it ends the session.\n\n```python\nwith\
    \ tf.Session() as sess:\n    result_2 = multiply.eval()\n    print(result_2)\n\
    ```\nOutput:\n[8]\n\nTo perform the procedure in the sense of the session, we\
    \ may use the `eval()` process. It's the same as the `run()` function. It improves\
    \ the code's dependability. We can start a session and look at the values in the\
    \ tensors you've already developed.\n\n### Check the tensors created before\n\n\
    ```python\nsess = tf.Session()\nprint(sess.run(r1))\nprint(sess.run(r2_matrix))\n\
    print(sess.run(r3_matrix))\n```\nOutput:\n1\n[[1 2]\n [3 4]]\n[[[1 2]\n [3 4]\n\
    \ [5 6]]]\n\nEven after we construct a tensor, variables are empty by design.\
    \ This is because we need to use `tf.global_variables_initializer()` to initialize\
    \ them. This is the difference between a constant and a variable.\n"
