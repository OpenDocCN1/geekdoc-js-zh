    \ \"float\"))\nprint(\"Model accuracy:\", accuracy.eval({x: mnist.test.images,\
    \ y: mnist.test.labels}))\n```\n\n# TensorFlow - 多层感知机\n\n最复杂的人工网络架构是多层感知机。它主要由几层感知机组成。TensorFlow\
    \ 是一个常用的深度学习系统，本笔记本将向你展示如何使用它创建一个神经网络。我们必须使用 `Numpy` 从头构建一个多层感知机，以完全理解什么是多层感知机。\n\
    \n以下是多层感知机学习的可视化表示：\n![Image 3.jpg](img/Image0037.jpg)\n\n*   对于监督学习使用了 MLP 网络。反向传播算法是\
    \ MLP 网络的流行学习算法。\n*   称为多层感知机 (MLP) 的前馈人工神经网络从一组输入产生一组输出。\n*   MLP 由几层输入节点描述，这些节点在输入层和输出层之间以有向图的形式连接。\n\
    *   MLP 使用反向传播（Backpropagation）来训练网络。\n*   MLP 是深度学习的形式。\n*   现在我们正专注于使用 MLP 来解决图像分类问题。\n\
    \n```python\n# Import MNIST data\nfrom tensorflow.examples.Books.mnist import\
    \ input_data\nmnist = input_data.read_data_sets(\"/tmp/data/\", one_hot=True)\n\
    import tensorflow as tf\nimport matplotlib.pyplot as plt\n\n# Parameters\nlearning_rate\
