    # TensorFlow Installation through conda


    We learned how to build TensorFlow using `pip` in the previous Book of TensorFlow.
    We will learn how to build TensorFlow using `Conda` in this book. To set up the
    platform, we''ll need `anaconda Navigator`.


    These are the steps to take, which are mentioned below:


    To begin, go to Anaconda''s official website and download Anaconda from the link
    below: [https://www.anaconda.com/distribution/]


    Then we need to get Anaconda from the Python 2.7 update.


    It will be downloaded successfully into our system. Then we need to set up Anaconda
    on our machine.


    Then, to set up TensorFlow and libraries, we must run the provided order.


    1. `Conda create -n tensorflow pip python` is the first step.

    2. We are now downloading and installing the required components for TensorFlow
    to work.

    3. Next, we must determine if TensorFlow is operational in our framework.


    # TensorFlow Architecture


    The TensorFlow runtime is a library that runs on any platform. The device architecture
    that allows for this scale combination to be versatile.


    TensorFlow programming principles such as the computation graph, operations, and
    sessions are common to us.


    To comprehend TensorFlow architecture, some words must first be comprehended.


    `TensorFlow Servable`, `servable Streams`, `TensorFlow Models`, `Loaders`, `Sources`,
    `Manager`, and `Core` are some of the terminology used.


    The term and its role in TensorFlow''s architecture are defined below.


    To read and adjust the core TensorFlow code, the TensorFlow architecture is sufficient.


    ## 1. TensorFlow Servable


    In TensorFlow, these are the central unfinished units.


    The artifacts that the clients use to perform the calculation are known as servables.


    The size of a servable can vary. A single servable may be anything from a lookup
    table to a single interface model in a tuple of models.


    Any sort and interface should be servable, allowing for versatility and potential
    enhancements such as:


    * Streaming results

    * Asynchronous modes of operation.

    * Experimental APIs


    ## 2. Servable Versions


    Over the lifetime of a single server case, a TensorFlow server can handle one
    or more versions of the servables.


    It allows for the loading of new algorithm configurations, weights, and other
    data over time.


    They can also charge several versions of a servable at the same time.


    They often allow several versions of a servable to be loaded at the same time,
    allowing for incremental roll-out and experimentation.


    ## 3. Servable Streams


    Any servable''s versions are sorted by increasing version numbers in this sequence.


    ## 4. TensorFlow Models


    In one or more servables, a serving represents a model. One or more algorithms
    are used to look up the embedding tables in a machine-learned model.


    A servable can also be used to represent a fraction of a model; for example, a
    broad lookup table can be represented by several instances.


    ## 5. TensorFlow Loaders


    The life cycle of a servable is controlled by loaders. The loader API allows for
    a popular infrastructure that is independent of the learning algorithm, data,
    or product use-cases.


    ## 6. Sources in TensorFlow Architecture


    Sources, to put it simply, are modules that look for and provide servable.


    At any given time, each reference provides zero or more servable streams.


    A source only provides one loader instance per servable stream for each servable.


    Each source also has one or more streams that can be served.


    A source only provides one loader instance for each servable stream and makes
    it available to be loaded.


    ## 7. TensorFlow Managers


    TensorFlow managers are in control of a Servable''s entire lifecycle, including:


    * Loading Servables

    * Serving Servables

    * Unloading Servables


    The manager keeps an eye on the sources and keeps track of all versions.


    The Manager makes every effort to satisfy causes, but it has the ability to refuse
    to load an Aspired version.


    An "unload" can also be postponed by managers. For example, based on a policy
    to ensure that at least one version is loaded at all times, a manager may wait
    to unload until a newer version finishes loading.


    `GetServableHandle()`, for example, allows clients to access the loaded servable
    instances.


    ## 8. TensorFlow Core


    This is responsible for the following elements of servables:


    * Lifecycle

    * Metrics

    * TensorFlow uses opaque artifacts to serve core satisfaction servables and loaders.


    ## 9. Life of a Servable


    TensorFlow Technical Architecture:


    * Sources build loaders for Servable Versions, which are then submitted to the
    Manager as Aspired versions, where they will be loaded and served to client requests.

    * The Loader holds metadata and is responsible for loading servable.

    * To convey the Manager of Aspired version, the source uses a callback.

    * The Manager uses the current version strategy to decide the next course of action.

    * If the Manager decides that the Loader can load a new version, clients request
    the servable from the Manager, either directly specifying version or requesting
    the current version.

    * For servable, the Manager returns a handle.


    ## 10. TensorFlow Loaders


    One such algorithm backend is TensorFlow.


    For example, to load, provide access to, and unload an instance of a new form
    of servable of the machine learning model, we will introduce a new loader.


    ## 11. Batcher in TensorFlow Architecture


    In the presence of hardware accelerators and GPUs, batching TensorFlow requests
    into a single application will greatly reduce the cost of performing inference.


    A claim batching system in TensorFlow serving allows clients to batch their type-specific
    assumptions beyond request into batch easily.


    Also, suggest that algorithm systems be able to process data more quickly.


    # TensorFlow Advantage and Disadvantage


    Google created and developed TensorFlow, an open-source machine learning concept.


    It organizes low-level numerical programming in a very high-level and abstract
    manner.


    As well as supporting libraries that enable our software to run on a standard
    CPU without modification.


    Linux, macOS, Windows, and Android are among the supported platforms.


    The Google Cloud Machine Learning Engine can also run TensorFlow models without
    the use of a conventional computing platform.


    The more advanced technology is, the more useful it can be, but everything, including
    this machine learning library, has its drawbacks.


    When comparing TensorFlow to other libraries such as Torch, SciKit, Theano, and
    Neon, there are a few features that the library does not enable us to exploit
    that are lacking.


    It goes without saying that this library was developed and modified by Google,
    and it has come a long way since its initial release.


    ## Advantages of TensorFlow


    ## 1) Graphs: TensorFlow''s numerical graph visualizations are superior. As opposed
    to other libraries like Torch and Theano, which are intrinsic.


    ## 2) Library management: It has Google''s support. It also has the advantages
    of smooth performance, fast updates, and regular new feature launches.


    ## 3) Debugging: It allows us to execute subparts of a graph, giving it an advantage
    since discrete data can be introduced and retrieved.

