    \ + num[i];\n  }\n  alert(sum);\n}\n</script>\n</head>\n<body>\n  <input type=\"\
    button\" onclick=\"array()\" value=\"这里\">\n</body>\n</html>\n```\n\n### 数组中的函数\
    \ (FUNCTIONS IN ARRAY)\n\n(Image010.jpg)\n\n# JavaScript 字符串 (Javascript String)\n\
    \n`String` 对象用于字符串交互。它是存储和处理文本的工具。在 JavaScript 中，有两种创建字符串：\n\n1. 字符串字面量。\n2. 使用\
    \ `new` 关键字。字符串字面量通过双引号形成。\n\n### 语法\n\n```javascript\nvar stringname=\"string\"\
    ;\n```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n   \
    \ var str=\"Hello Literal\";\n    document.write(str);\n  </script>\n</body>\n\
    </html>\n```\nHello Literal\n\n### 使用 new 关键字\n\n### 语法\n\n```javascript\nvar\
    \ stringname=new String(\"new\")\n```\n\n### 输出 (OUTPUT)\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <script>\n    var stringname=new String(\"Hello String\"\
    );\n    document.write(stringname);\n  </script>\n</body>\n</html>\n```\nHello\
    \ String\n\n## 字符串属性 (String properties)\n\n字符串属性列表及其描述：\n\n1. `constructor`。\n\
    2. `length`。\n3. `prototype`。\n\n`constructor`– 该方法返回字符串函数的引用。\n\n### 语法\n\n```javascript\n\
    string.constructor\n```\n\n`length` - 返回字符串中的字符数。\n\n### 语法\n\n```javascript\n\
    string.length\n```\n\n`prototype` - 它允许应用应用于属性和方法（数字、布尔、字符串和数据等）。\n\n### 语法\n\n\
