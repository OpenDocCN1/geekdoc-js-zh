    In the preparation of our ANN, we use five different algorithms.


    *   Gradient Descent


    *   Newton''s Method


    *   Conjugate Gradient


    *   Quasi Newton''s


    *   Levenberg Marquardt


    ### Gradient Descent


    The steepest descent algorithm is another name for the gradient descent algorithm.
    It is the simplest algorithm that relies on information from the gradient vector.
    A first-order approach is the GD algorithm.


    ![](Image00043.jpg)


    w (i+1)  =  w (i)  -  g (i) n (i) .


    ### Newton''s Method


    A second-order algorithm is Newton''s process. It employs the Hessian matrix.
    Its main goal is to use the second derivatives of the loss function to find better
    training directions.


    The iteration of Newton''s method is as follows.


    w (i+1)  =  w (i)  -  H (i)-1 . g (i) For i = 0, 1.....


    Here, H (i)-1 .g (i)  is known as Newton''s step. The shift in parameters may
    be moving toward a limit instead of a minimum.


    The training of a neural network using Newton''s method is depicted in the diagram
    below.


    The parameter can be improved by determining the training path and a reasonable
    training pace.


    ### Conjugate gradient


    Between gradient descent and Newton''s process, conjugate gradient is used.


    Conjugate gradient avoids the knowledge requirements of Newton''s process, such
    as evaluation, inversion of the Hessian matrix, and storage.


    The CG algorithm searches in a conjugate direction rather than a gradient descent
    direction, which results in faster convergence.


    In terms of the Hessian matrix, the training is performed in a conjugate direction.


    The parameter is improved by calculating the conjugate training path and then
    selecting an acceptable training rate in that direction.


    ### Quasi-Newton Method


    In terms of computation, Newton''s approach is time-consuming. Many operations
    are needed to evaluate the Hessian matrix.


    The Quasi-Newton Method was created to address this flaw. Variable matric process
    is another name for it.


    Rather than computing the inverse hessian directly, an algorithm builds up an
    approximation to it at each iteration.


    Approximation is computed using information from the loss function''s first derivative.


    ### Levenberg Marquardt


    A damped least-squares system is also known as Levenberg Marquardt. This algorithm
    was created with the loss function in mind. The Hessian matrix is not computed
    by this algorithm. The Jacobian matrix and the gradient vector are used.


    The first step in Levenberg Marquardt is to determine the loss, gradient, and
    Hessian approximation, after which the dumpling parameter is modified.


