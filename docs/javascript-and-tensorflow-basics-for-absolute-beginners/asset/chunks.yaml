    \n### 语法\n\n```javascript\nmyarray = new array(n);\n```\n注意：如果在 JavaScript 中生成数组时不指定大小，则数组对象的大小为零。\n\
    \n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n    var i;\n\
    \    var emp = new Array();\n    emp[0] = \"Ajay\";\n    emp[1] = \"Abhay\";\n\
    \    emp[2] = \"Arun\";\n    emp[3] = \"Shipra\";\n    for (i=0 ; i<emp.length\
    \ ; i++ ) {\n      document.write(emp[i] + \"<br>\");\n    }\n  </script>\n</body>\n\
    </html>\n```\nAjay\nAbhay\nArun\nShipra\n\n### 示例 2\n\n```html\n<!DOCTYPE html>\n\
