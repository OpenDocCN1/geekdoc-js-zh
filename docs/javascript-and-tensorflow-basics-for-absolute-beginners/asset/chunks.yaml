- fmt: "\nThe sum of the input vector multiplied by the corresponding element of the\
    \ vector is used to measure the single vector perceptron, with each weight increasing\
    \ the amount of the corresponding part of the vector.\n\nThe value shown in the\
    \ output is the activation function's input.\n\nLet's look at how to use TensorFlow\
    \ to implement a single-layer perceptron for an image classification query. The\
    \ representation of \"logistic regression\" is the best example of drawing a single-layer\
    \ perceptron.\n\nNow we must complete the following training logistic regression\
    \ steps:\n\n* At the start of each training, the weights are initialized with\
    \ random values.\n* The error is determined for each aspect of the training set\
    \ using the difference between the expected and actual performance. The weight\
    \ is adjusted based on the measured error.\n* The process is repeated until the\
    \ total number of iterations is less than the specified limit and the fault on\
    \ the entire training set is less than the specified limit.\n\n### Single layer\
    \ perceptron code in its entirety\n\n```python\n# Import the MINST dataset\nfrom\
    \ tensorflow.examples.Books.mnist import input_data\nmnist = input_data.read_data_(\"\
    /tmp/data/\", one_hot=True)\nimport tensorflow as tf\nimport matplotlib.pyplot\
    \ as plt\n\n# Parameters\nlearning_rate = 0.01\ntraining_epochs = 25\nbatch_size\
    \ = 100\ndisplay_step = 1\n\n# tf Graph Input\nx = tf.placeholder(\"float\", [none,\
    \ 784]) # MNIST data image of shape 28*28 = 784\ny = tf.placeholder(\"float\"\
    , [none, 10]) # 0-9 digits recognition => 10 classes\n\n# Create model\n# Set\
    \ model weights\nW = tf.Variable(tf.zeros([784, 10]))\nb = tf.Variable(tf.zeros([10]))\n\
    # Constructing the model\nactivation=tf.nn.softmax(tf.matmul(x, W)+b) # Softmax\
    \ function\n\n# Minimizing error using cross entropy\ncross_entropy = y*tf.log(activation)\n\
    cost = tf.reduce_mean(-tf.reduce_sum(cross_entropy, reduction_indice=1))\noptimizer\
    \ = tf.train.GradientDescentOptimizer(learning_rate).minimize(cost)\n\n#Plot settings\n\
    avg_set = []\nepoch_set = []\n# Initializing the variables where init = tf.initialize_all_variables()\n\
    # Launching the graph\nwith tf.Session() as sess:\n    sess.run(init)\n    # Training\
    \ of the cycle in the dataset\n    for epoch in range(training_epochs):\n    \
    \    avg_cost = 0.\n        total_batch = int(mnist.train.num_example/batch_size)\n\
    \        # Creating loops at all the batches in the code\n        for i in range(total_batch):\n\
    \            batch_xs, batch_ys = mnist.train.next_batch(batch_size)\n       \
    \     # Fitting the training by the batch data\n            sess.run(optimizer,\
    \ feed_dict={x: batch_xs, y: batch_ys})\n            # Compute all the average\
    \ of loss\n            avg_cost += sess.run(cost, feed_dict={x: batch_xs, y: batch_ys})\
    \ # total\n        # Display the logs at each epoch steps\n        if epoch %\
    \ display_step == 0:\n            print(\"Epoch:\", '%0d' % (epoch+1), \"cost=\"\
    , \"{:.9f}\".format(avg_cost))\n            avg_set.append(avg_cost)\n       \
    \ epoch_set.append(epoch+1)\n    print(\"Training finished\")\n    plt.plot(epoch_set,\
    \ avg_set, 'o', label='Logistics Training')\n    plt.ylabel('cost')\n    plt.xlabel('epoch')\n\
    \    plt.legend()\n    plt.show()\n\n# Test the model\ncorrect_prediction = tf.equal(tf.argmax(activation,\
    \ 1), tf.argmax(y, 1))\n# Calculating the accuracy of dataset\naccuracy = tf.reduce_mean(tf.cast(correct_prediction,\
    \ \"float\"))\nprint(\"Model accuracy:\", accuracy.eval({x: mnist.test.images,\
    \ y: mnist.test.labels}))\n```\n\n# TensorFlow - Multi-layer Perceptron\n\nThe\
    \ most complex artificial network architecture is the multi-layer perceptron.\
    \ It is primarily made up of several layers of perceptron. TensorFlow is a common\
    \ deep learning system, and this notebook will show you how to use it to create\
    \ a neural network. We must build a multi-layer perceptron from scratch using\
    \ `Numpy` to fully comprehend what a multi-layer perceptron is.\n\nThe following\
    \ is a visual representation of multi-layer perceptron learning:\n![Image 3.jpg](Image0037.jpg)\n\
    \n* For supervised learning, MLP networks are used. Back propagation's algorithm\
    \ is a popular learning algorithm for MLP networks.\n* A feed forward artificial\
    \ neural network called a multilayer perceptron (MLP) produces a collection of\
    \ outputs from a set of inputs.\n* An MLP is described by several layers of input\
    \ nodes that are connected as a directed graph between the input and output layers.\n\
    * Backpropagation is used by MLP to train the network.\n* MLP is a form of deep\
    \ learning.\n* Now we're concentrating on using MLP to solve an image classification\
    \ problem.\n\n```python\n# Import MNIST data\nfrom tensorflow.examples.Books.mnist\
    \ import input_data\nmnist = input_data.read_data_sets(\"/tmp/data/\", one_hot=True)\n\
    import tensorflow as tf\nimport matplotlib.pyplot as plt\n\n# Parameters\nlearning_rate\
    \ = 0.001\ntraining_epochs = 20\nbatch_size = 100\ndisplay_step = 1\n\n# Network\
    \ Parameters\nn_hidden_1 = 256 # 1st layer num features\nn_hidden_2 = 256 # 2nd\
    \ layer num features\nn_input = 784 # MNIST data input (img shape: 28*28)\nn_classes\
    \ = 10 # MNIST total classes (0-9 digits)\n\n# tf Graph input\nx = tf.placeholder(\"\
    float\", [None, n_input])\ny = tf.placeholder(\"float\", [None, n_classes])\n\n\
    # weights layer 1\nh = tf.Variable(tf.random_normal([n_input, n_hidden_1])) #\
    \ bias layer 1\nbias_layer_1 = tf.Variable(tf.random_normal([n_hidden_1]))\n#\
    \ layer 1\nlayer_1 = tf.nn.sigmoid(tf.add(tf.matmul(x, h), bias_layer_1))\n# weights\
    \ layer 2\nw = tf.Variable(tf.random_normal([n_hidden_1, n_hidden_2])) # bias\
    \ layer 2\nbias_layer_2 = tf.Variable(tf.random_normal([n_hidden_2]))\n# layer\
    \ 2\nlayer_2 = tf.nn.sigmoid(tf.add(tf.matmul(layer_1, w), bias_layer_2))\n# weights\
    \ output layer\noutput = tf.Variable(tf.random_normal([n_hidden_2, n_classes]))\
    \ # bias output layer\nbias_output = tf.Variable(tf.random_normal([n_classes]))\n\
    # output layer\noutput_layer = tf.matmul(layer_2, output) + bias_output\n\n# cost\
    \ function\ncost = tf.reduce_mean(tf.nn.sigmoid_cross_entropy_with_logits(logits=output_layer,\
    \ labels=y))\n# optimizer\noptimizer = tf.train.AdamOptimizer(learning_rate=learning_rate).minimize(cost)\n\
    \n# Plot settings\navg_set = []\nepoch_set = []\n# Initializing the variables\n\
    init = tf.global_variables_initializer()\n\n# Launch the graph\nwith tf.Session()\
    \ as sess:\n    sess.run(init)\n    # Training cycle\n    for epoch in range(training_epochs):\n\
    \        avg_cost = 0.\n        total_batch = int(mnist.train.num_examples/batch_size)\n\
    \        # Loop over all batches\n        for i in range(total_batch):\n     \
    \       batch_xs, batch_ys = mnist.train.next_batch(batch_size)\n            #\
    \ Fit training using batch data\n            sess.run(optimizer, feed_dict={x:\
    \ batch_xs, y: batch_ys})\n            # Compute average loss\n```\n"
