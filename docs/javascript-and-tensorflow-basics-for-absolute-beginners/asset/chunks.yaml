  trans: "\n\n![](img/Image00049.jpg)\n\n# JAVASCRIPT 与 TENSORFLOW 基础：零基础教程\n作者 TAM\
    \ SEL\n\n# JAVASCRIPT\n\n本 JavaScript 教程让初学者和专家都能轻松学习 JavaScript。\n学习 JavaScript，你只需要对计算机有基本的了解。\n\
    \n# JAVASCRIPT 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <h2>欢迎来到 JavaScript</h2>\n\
    \  <script>\n    document.write(\"Hello Friends\");\n  </script>\n</body>\n</html>\n\
    ```\n\n可以通过在代码中添加 JavaScript 语句来实现 JavaScript。\n`<script>...</script>`。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <script type=\"text/javascript\">\n    document.write(\"\
    Hello World\");\n  </script>\n</body>\n</html>\n```\n\n### JavaScript 代码可以在 JavaScript\
    \ 中的 3 个地方编写\n\n1. 在 HTML 的 `<body>`...`</body>` 标签之间。\n2. 在 HTML 的 `<head>`...`</head>``\
    \ 标签之间。\n3. 在 `.js` 文件中（外部 JavaScript）。\n\n### 示例（在 body 标签之间编写代码）\n\n在下面的示例中，`body`\
    \ 标签包含了 JavaScript 代码。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script\
    \ type=\"text/javascript\">\n    alert(\"Hello world\");\n  </script>\n</body>\n\
    </html>\n```\n\n### 示例 2（在 head 标签之间编写代码）\n\n我们将在下面的示例中创建函数 `msg()`。在 JavaScript\
    \ 中，你必须在函数名后编写函数体来构造函数。要调用一个方法，我们必须先创建一个事件。在这个案例中，我们使用 `onclick` 事件来调用 `msg()`\
    \ 函数。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <script type=\"text/javascript\"\
    >\n    function msg() {\n      alert(\"world\");\n    }\n  </script>\n</head>\n\
    <body>\n  <p>欢迎来到 JavaScript</p>\n  <input type=\"button\" value=\"click\" onclick=\"\
    msg()\">\n</body>\n</html>\n```\n\n### 外部文件\n\n我们可以构建一个可以在 HTML 文件中使用的 JavaScript\
    \ 文件。由于单个 JavaScript 文件可以在多个 HTML 页面中使用，因此它允许代码复用。这提高了网页的效率。该文件必须具有 `.js` 扩展名。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <script type=\"text/javascript\"\
    \ src=\"message.js\"></script>\n</head>\n<body>\n  <p>Hello</p>\n  <input type=\"\
    button\" value=\"click\" onclick=\"msg()\">\n</body>\n</html>\n```\n\n# JavaScript\
    \ 注释\n\nJavaScript 中的注释用于描述代码。它用于添加代码相关的内容，例如警告或建议，以便最终用户能够理解。\n\n## JavaScript\
    \ 注释的类型\n\nJavaScript 注释有两种类型：\n1. 单行注释\n2. 多行注释\n\n### 单行注释\n\n双斜杠 `//` 用于表示单行注释。程序运行时，双斜杠\
    \ `//` 与行尾之间的任何文本都会被忽略。\n\n例如：在语句之前添加注释。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <script>\n    // 单行注释\n    document.write(\"hello world\");\n  </script>\n\
    </body>\n</html>\n```\n\n例如：在语句之后添加注释。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    \  <script>\n    var a = 10;\n    var b = 20;\n    var c = a + b; // 相加 a 和 b\
    \ 的值\n    document.write(c); //打印 10 和 20 的和\n  </script>\n</body>\n</html>\n\
    ```\n\n#### 输出\n30\n\n## 多行注释\n\n单行和多行注释也可以用于多行注释。跨越多行的注释以 `/*` 开始，以 `*/` 结束。JavaScript\
    \ 将忽略它们之间的文本。\n\n### /* 在此处编写注释 */\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    \  <script>\n    /* 这是多行注释。它不会被显示 */\n    document.write (\"Example of JavaScript\
    \ multi line comment\");\n  </script>\n</body>\n</html>\n```\n\n# JavaScript 变量\n\
    \n值（`name=\"Ram\"`）和表达式（`Sum=x+y`）存储在变量中。\n在使用变量之前，我们必须先声明它。要声明变量，我们如下使用关键字 `var`：\n\
    \n```javascript\nvar name;\n```\n\n变量有两种类型：\n1. 局部变量\n2. 全局变量\n\n局部变量 – 它在函数或块中声明。\n\
    \n```javascript\n<script>\nfunction abc() {\n  var x = 10; // 局部变量\n}\n</script>\n\
    ```\n\n全局变量 - 它具有全局作用域，意味着它可以在 JavaScript 代码的任何地方指定。在函数外部声明变量。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <script>\n    var data = 200; // 全局变量\n    function\
    \ a() {\n      document.write(data);\n    }\n    function b() {\n      document.write(data);\n\
    \    }\n    a(); // 调用 JavaScript 函数\n    b();\n  </script>\n</body>\n</html>\n\
    ```\n\n### 在函数内部声明全局变量\n\n我们需要使用 `window` 对象在函数内部声明 JavaScript 全局变量。\n\n```javascript\n\
    <script>\nfunction a() {\n  window.value = 50; // 通过 window 对象声明全局变量\n}\n</script>\n\
    ```\n\n现在，它可以在任何函数内部声明，并在任何函数内部进行访问。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    \  <script>\n    function a() {\n      window.value = 90;\n    }\n    function\
    \ b() {\n      alert(window.value);// 从其他函数访问全局变量\n    }\n    a();\n    b();\n\
    \  </script>\n</body>\n</html>\n```\n\n"
- fmt: "\n### Since JavaScript is a dynamic style language, we don't need to define\
    \ the type of variable because the JavaScript engine uses it dynamically. The\
    \ data type is defined using `var` in this case. It can store any sort of value,\
    \ including numbers, strings, and objects.\n\n### Example\n```javascript\nvar\
    \ a=Ram ; //String\nvar b=20 ; //Number\nvar x = {FirstName:'Ram', lastName:'Doe'}\
    \ ; //Object\n```\n\n### JavaScript primitive data types\nThere are 5 types of\
    \ primitive data types in JavaScript.\n\n![](Image00000.jpg)\n\n## JavaScript\
    \ non-primitive data types\nThere is 3 non-primitive data types are as follows:\n\
    \n![](Image00001.jpg)\n\nOperators are symbols in JavaScript that are used to\
    \ execute operations on operands. `3+2` equals `5` in plain terms. The operands\
    \ here are `3` and `2`, and the operator is `+`.\n\nFollowing are the operators\
    \ used in JavaScript:\n1. Arithmetic Operators.\n2. Comparison (relational) Operators.\n\
    3. Bitwise Operators.\n4. Logical Operators.\n5. Assignment Operators.\n6. Special\
    \ Operators.\n\n## Arithmetic Operators\nWe use arithmetic operations on the operands\
    \ in arithmetic operators.\n\n![](Image00002.jpg)\n\n## Comparison Operators\n\
