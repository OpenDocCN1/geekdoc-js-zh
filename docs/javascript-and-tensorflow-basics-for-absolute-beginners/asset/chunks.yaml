    var_init_2\", dtype=tf.int32,initializer=[ [1, 2], [3, 4] ]) |\n\nOpen a session\n\
    \n| session | Object |\n\n| Create a session | tf.Session() |\n\n| Run a session\
    \ | tf.Session.run() |\n\n| Evaluate a tensor | variable_name.eval() |\n\n| Close\
    \ a session | sess.close() |\n\n| Session | with tf.Session() as sess: |\n\n#\
    \ TensorFlow - Single Layer Perceptron\n\nAny neural network's perceptron is a\
    \ single processing unit. The perceptron is a supervised learning algorithm that\
    \ uses a linear classifier. It aids in the organization of the input data.\n\n\
    A perceptron is a unit of a neural network that performs specific computations\
    \ to detect features in input data. The perceptron is primarily used to divide\
    \ data into two sections.\n\nAs a result, it's often called a Linear Binary Classifier.\n\
    \nThe phase function is used by Perceptron, which returns +1 if the weighted sum\
    \ of its inputs is 0 and -1.\n\nThe activation function is used to map an input\
    \ value between a required value such as (0, 1) or another value (-1, 1).\n\n\
    The following is an example of a normal neural network:\n\n![Image 1.jpg](Image00035.jpg)\n\
    \nThe perceptron consists of 4 parts.\n\n*   Input value or One input layer:  The\
    \ perceptron's input layer is made up of artificial input neurons that feed data\
    \ into the system for further processing.\n\n*   Weights and Bias:\n\n    Weight:\
    \  It denotes the size or tensile strength of a unit-to-unit relation. If the\
    \ weight from node 1 to node 2 is greater, neuron 1 has a greater effect on the\
    \ neuron.\n\n    Bias:  It's the same thing as adding the intercept to a linear\
    \ equation. It's an extra parameter whose job is to change the output as well\
    \ as the weighted number of the other neuron's input.\n\n*   Net sum:  It computes\
    \ the total amount.\n\n*   Activation Function:  An activation mechanism determines\
    \ whether a neuron is active or not. To get the result, the activation function\
    \ calculates a weighted number and then adds bias to it.\n\n#### How does it work?\n\
    \nThe perceptron operates using the following basic steps:\n\n1.  All of the inputs\
    \ x are multiplied by their weights w in the first step.\n\n![Image 2.jpg](Image00036.jpg)\n\
    \nb.  Put all of the increased values together in this step and call it the Weighted\
    \ sum.\n\nc . Apply the weighted amount to a proper Activation Function in the\
    \ final step.\n\nThere are two styles of architecture: traditional and modern.\
    \ These types concentrate on the following aspects of artificial neural networks:\n\
    \n*   Single Layer Perceptron\n\n*   Multi-Layer Perceptron\n\n### Single Layer\
    \ Perceptron\n\nFrank Rosenbluth proposed the single-layer perceptron as the first\
    \ neural network model in 1958.\n\nIt is one of the earliest learning models.\n\
    \nThe weight vector w and the bias parameter b are used to calculate a linear\
    \ decision function.\n\nUnderstanding artificial neural networks is needed to\
    \ comprehend the perceptron layer (ANNs).\n\nThe artificial neural network (ANN)\
    \ is a data processing device whose mechanism is based on biological neural circuit\
    \ functionality.\n\nAn artificial neural network is made up of many interconnected\
    \ processing units.\n\nWhen the neural model is developed, this is the first proposal.\n\
    \nA vector of weight is stored in the local memory of the neuron."
