    ##### [[0 0]]


    ##### [[10 20]


    ##### [30 40]] 


    ##### We can use the placeholder we made and fill it in with the real value. The
    data must be passed to the feed dict process.


    ##### Take the power of two of placeholder data placeholder a, for example.


    ##### import  numpy as np  


    ##### power_a = tf.pow(data_placeholder_a, 3)  


    ##### with tf.Session() as sess:    


    ##### data = np.random.rand(1, 11)  


    ##### print(sess.run(power_a, feed_dist={data_placeholder_a:data}))   


    ## Explanation of Code


    *   import numpy as np:


    *   Import numpy library to create data


    *   tf.pow(data_placeholder_a, 3): Create the ops


    *   np.random.rand(1, 10): Create any random array in data


    *   feed_dict={data_placeholder_a: data}: Provide the placeholder into data.


    Output:


    ##### [[0.05478135 0.27213147 0.8803037 0.0398424 0.21172127 0.01445725 0.02584014
    0.3763949  0.66122706 0.7565559]


    ## Graph


    A node and an edge are seen in the graph. The node is the image of an operation,
    or the computational unit.


    The tensor is the boundary, which can either create a new tensor or absorb the
    input data. It is determined by the interdependencies of individual operations.


    To make the process, Tensor Flow relies on a brilliant approach.


    A dataflow schema is used to represent all computations. To see the data dependencies
    between individual operations, the dataflow graph was created. Any continuous
    operations make up a mathematical formula or algorithm. A graph is a useful tool
    for visualizing the coordinated computations.


    The graph''s structure binds the operations (i.e., the nodes) and the way they''re
    fed.'
