    ```\n\n```\nz = tf.get_variable(\"z\", dtype=tf.int32, initializer=tf.constant([6]))\n\
    ```\n\n```\nc = tf.constant([5], name =\"constant\")\nsquare = tf.constant([2],\
    \ name =\"square\")\n```\n\n```\nf = tf.multiply(x, y) + tf.pow(x, square) + y\
    \ + c\n```\n\n## Explanation of Code\n\n![](Image00034.jpg)\n\nWe choose the value\
    \ of the variable `fixed` in this case. We also construct `C`, a constant tensor\
    \ that is a constant parameter in the function `f`.\n\nIt has a constant value\
    \ of `5`.\n\nThis parameter in the tensor called `constant` can be seen in the\
    \ graph.\n\nIn the operator `tf.pow`, we can also create a constant tensor for\
    \ the strength `( )`.\n\nIt isn't needed. We did this so that we could see the\
    \ tensor's name in the graph. It's a `square`, which is a circle.\n\nWe can see\
    \ what happens with the tensors and how it returns a value of `66` from the graph.\n\
    \nThe code below evaluates the session's feature.\n\n```\ninit = tf.global_variables_initializer()\n\
    with tf.Session() as sess:\n    init.run() #Initialization of x and y\n    function_result\
    \ = f.eval()\n    print (function_result)\n```\n\nOutput:\n\n`[66]`\n\n## Steps\
    \ of Creating TensorFlow pipeline\n\nWe manually add two values for `X1` and `X2`\
    \ in the example. Now we'll look at how to get the data into TensorFlow.\n\n###\
    \ Step 1) Create the data\n\nLet's start by generating two `ra` values with the\
    \ `numpy` library.\n\n```\nimport numpy as np\nx_input = np.random.sample((1,2))\n\
    print(x_input)\n```\n\nOutput:\n\n`[[0.8835775 0.23766977]]`\n\n### Step 2: Create\
    \ the placeholder\n\nWe come up with the name `X` as a placeholder. The tensor's\
    \ form must be defined specifically. If only two values are loaded into an array.\
    \ The form is written as `[1,2]`.\n\n```python\n# Using a placeholder\nx = tf.placeholder(tf.float23,\
    \ shape=[1,2], name = 'X')\n```\n\n### Step 3: Define the dataset.\n\nFollowing\
    \ that, we specify the dataset in which the value of the placeholder `x` will\
    \ be populated. We must employ the process.\n\n`tf.data.Dataset.from_tensor_slices`\n\
    \n```python\ndataset = tf.data.Dataset.from_tensor_slices(x)\n```\n\n### Step\
    \ 4: Create a pipeline\n\nIn phase four, we'll load the pipeline from which the\
    \ data will flow. Create an iterator called `make_initializable_iterator`.\n\n\
    It's referred to as an iterator.\n\nThen, using `get_next`, we must call the iterator\
    \ to feed the next batch of data. This move is called `get_next`.\n\nThere is\
    \ only one batch of data with two values in our case.\n\n```python\niterator =\
    \ dataset.make_initializable_iterator()\nget_next = iteraror.get_next()\n```\n\
    \n### Step 5: Execute the operation\n\nThe final step is identical to the preceding\
    \ example. We create a session and run the iterator process.\n\nThe value provided\
    \ by `numpy` is fed into the `feed_dict`. These two values will be included in\
    \ the `x` placeholder. Then, to print a response, we run `get_next`.\n\n```python\n\
    with tf.Session() as sess:\n    # Feed the placeholder into data.\n    sess.run(iterator.initializer,\
    \ feed_dict={ x: x_input })\n    print(sess.run(get_next))\n```\n"
