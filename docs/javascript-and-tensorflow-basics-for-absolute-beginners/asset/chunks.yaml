    Hello world\");\n    document.write(str.valueOf ( )) ;\n</script>\n</body>\n</html>\n\
    ```\n\n# JavaScript Date\n\nDate 对象是 JavaScript 语言中内置的一种数据类型。新的 `Date` 对象用于构建数据对象\
    \ ()。时间中的单个时刻由 JavaScript Date 实例表示。创建 JavaScript 日对象的唯一方法是使用 JavaScript 作为构造函数。\n\
    \n### 语法\n\n`Date()` 构造函数可以使用以下语法生成 `Date` 对象。\n\n```javascript\nnew Date();\n\
    new Date(value);\nnew Date(dateString);\nnew Date(year, month, day, hours, minutes,\
    \ seconds, milliseconds);\n```\n\n### 注意：括号中的参数始终是可选的。\n\n### 描述\n\n#### year\n\
    年份由整数表示。对于 2000 年到 2099 年，值范围从 0 到 99 的映射。\n\n#### Month\n从 0（一月）开始到 11 结束，此整数值表示月份。\n\
    \n#### Date\n这是一个可选参数。月份的天数由整数值表示。\n\n#### Hours\n这是一个可选参数。一天的小时由整数值表示。\n\n####\
    \ Minutes\n这是一个可选参数。时间的分钟部分由整数值表示。\n\n#### Seconds\n这是一个可选参数。秒由整数值表示。\n\n####\
    \ Milliseconds\n这是一个可选参数。时间的毫秒段由整数值表示。\n\n#### Date 示例\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<script>\n    var date=new Date();\n    var day=date.getDate();\n\
    \    var month=date.getMonth()+1;\n    var year=date.getFullYear();\n    document.write(\"\
    <br>\"+day+\"/\"+month+\"/\"+year) ;\n</script>\n</body>\n</html>\n```\n\n####\
    \ 当前时间 - 示例\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n    var today=new\
    \ Date();\n    var h=today.getHours();\n    var m=today.getMinutes();\n    var\
    \ s=today.getSeconds();\n    document.getElementById('txt').innerHTML=h+\":\"\
    +m+\":\"+s ;\n</script>\n</body>\n</html>\n```\n\n# JavaScript Math\n\n`Math`\
    \ 是一个内置对象，具有用于数学函数和常量的属性和方法。它允许你对数字执行数学运算。\n\n### 语法\n\n1. `var pi_val=Math.PI;`\n\
    2. `var sin_val=Math.sin ( 3 );`\n\n### 示例\n\n#### Math.pow()\n`Math.pow(x,y)`\
    \ 返回 `x` 的 `y` 次方：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h2>Math.pow()</h2>\n\
    <p>Math.pow(x,y ) 返回 `x` 的 `y` 次方的值：</p>\n<p id=\"demo\"></p>\n<script>\n    document.getElementById(\"\
    demo\").innerHTML=Math.pow(6,2) ;\n</script>\n</body>\n</html>\n```\n\n#### Math.sqrt()\n\
    `Math.sqrt(x)` 返回 `x` 的平方根：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h2>Math.sqrt()</h2>\n\
    <p>Math.sqrt(x ) 返回 `x` 的平方根：</p>\n<p id=\"demo\"></p>\n<script>\n    document.getElementById(\"\
    demo\").innerHTML=Math.sqrt(81) ;\n</script>\n</body>\n</html>\n```\n\n#### Math.ceil()\n\
    `Math.ceil(x)` 返回 `x` 向上取整到最近整数的值：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <h2>Math.ceil()</h2>\n<p>Math.ceil( ) 将数字向上取整到其最近的整数：</p>\n<p id=\"demo\"></p>\n\
    <script>\n    document.getElementById(\"demo\").innerHTML=Math.ceil(6.8) ;\n</script>\n\
    </body>\n</html>\n```\n\n# JavaScript Number\n\n`Number` 对象是一个包装器对象，允许你操作数值值。`Number()`\
    \ 构造函数用于构建数字对象。它可以是整数，也可以是浮点数。\n\n### 语法\n\n```javascript\nvar n=new Number(value);\n\
    ```\n\n### 示例\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n    var x=100;//整数值\n\
    \    var y=100.7;//浮点值\n    var z=12e5;//指数值，输出: 1200000\n    var n=new Number(20);//通过数字对象生成的整数值\n\
    \    document.write(x+\" \"+y+\" \"+z+\" \"+n) ;\n</script>\n</body>\n</html>\n\
    ```\n\n#### 输出\n100 100.7 1200000 20\n\n"
