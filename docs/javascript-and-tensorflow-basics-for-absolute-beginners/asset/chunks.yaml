    ## Neural Network Model/ Perceptron


    A neural network model, also known as a Perceptron, is a network of simple components
    known as neurons that receive feedback and alter their internal state in response
    to the information.


    And, depending on the data and activation, generate performance (0 and 1). In
    the most open neural network, the shallow neural network, we only have one input
    and output, and at best, one hidden layer.


    ### All colors mean in the Playground

    When it comes to visualization, orange and blue are used in visualization.


    Orange and blue are used in various ways, in fact, orange represents negative
    values and blue represents positive values.


    The weights of the neurons stain the hidden layers.


