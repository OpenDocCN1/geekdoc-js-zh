    ##### print(data_placeholder_a)   


    Output:


    ##### Tensor("data_placeholder_a:0", dtype=float32)


    ### TensorFlow works in 3 main components:


    *   Graph


    *   Tensor


    *   Session


    | Components | Description |


    | Graph | In TensorFlow, the graph is crucial. Inside the graph, all mathematical
    operations (ops) are carried out. A graph can be viewed as a project in which
    each process is nearly completed. These operations are represented by nodes, which
    can remove or generate new tensors. |


    | Tensor | A tensor is a representation of data that moves from one operation
    to the next. We''ve already seen how to set up the tensor. The initial values
    of a variable, which can shift, are the difference between a constant and a variable.
    |


    | Session | The procedure on the graph will be performed by a session. We need
    to open a session to communicate the graph to the tensor values. To generate an
    output, we must run an operator within a session. |


    ### Session


    Graphs and sessions are separate entities. We can run a session and save the results
    for later use in calculations.


    In the example below, we will:


    *   Create two tensors


    *   Create an operation


    *   Open a session


    *   Print the result


    Step-1)  we create two tensors x and y


    ##### ## Create run and evaluate a session  


    ##### X= tf.constant([2])  


    ##### X= tf.constant([2])  


    Step-2)  we create the operator by multiplying x and y


    ##### ## Create operator  


    ##### multiply = tf.multiply(x,y)  


    Step-3)  We start a meeting. Both computations will take place during the session.
    When we''re done, we''ll need to end the session.


    ##### ## Create a session to run the given code  


    ##### Sess= tf.Session()result_1=sess.run(multiply)  


    ##### print(result_1)  


    ##### sess.close()  


    Output:


    ##### [8]


    ## Explanation of Code


    ![](Image00031.jpg)


    ##### The multiplication of var x and y yields the result "8."


    ##### Another option is to build a session within a block. The benefit is that
    it ends the session.


    ##### With tf.Session() as sess:  


    ##### result_2 = multiply.eval()  


    ##### print(result_2)    


    Output:


    ##### [8]


    ##### To perform the procedure in the sense of the session, we may use the eval()
    process.


    ##### It''s the same as the run() function.


    ##### It improves the code''s dependability.


    ##### We can start a session and look at the values in the tensors you''ve already
    developed.


    ##### ## Check the tensors created before  


    ##### sess = tf.Session()  


    ##### print(sess.run(r1))  


    ##### print(sess.run(r2_matrix))  


    ##### print(sess.run(r3_matrix))   


    Output:


    ##### 1


    ##### [[1 2]


    ##### [3 4]]


    ##### [[[1 2] 


    #####   [3 4] 


    #####   [5 6]]]


    ##### Even after we construct a tensor, variables are empty by design. If we want
    to use the variable, we must first initialize it.


    ##### To set the values of a variable, use the object tf.global variables initializer().


    ##### This object will set all of the variables to their default values.


    ##### This is beneficial prior to training a model.


    ##### The values of the variables we created earlier can be checked. It''s worth
    noting that we''ll have to use run to test the tensor.


    ##### sess.run(tf.global_variables_initializer())  


    ##### print(sess.run(var))  


