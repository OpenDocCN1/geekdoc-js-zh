    \n作为人类，我们有很多短板，例如无法手动访问海量数据，这使得使用计算机系统变得必要。\n\n而机器学习可以为此提供帮助。\n\n得益于它的用例，机器学习可以很容易被理解。\n\
    \n机器学习目前用于自动驾驶汽车、网络欺诈检测、人脸识别和 Facebook 朋友推荐。\n\n世界上最著名的企业（如亚马逊和 Netflix）已经开发了机器学习模型，这些模型根据大量数据评估用户兴趣并正确地建议产品。\n\
    \n## 机器学习的类型\n世界上最著名的企业（如亚马逊和 Netflix）已经开发了机器学习模型，这些模型根据大量数据评估用户兴趣并正确地建议产品。\n\n\
    ### 监督学习\n在监督学习中，模型由导师引导。它有两种类型：\n\n* 分类：监督学习是一种对对象分类的方法。\n* 回归：监督学习是一种预测输出的方法。\n\
    \n### 无监督学习\n在无监督学习中，数据既没有被分类也没有标记。它有两种类型：\n\n* 聚类：无监督学习是一种识别相似性的技术。\n* 关联：无监督学习是一种发现关联的工具。\n\
    \n### 半监督学习\n半监督学习位于监督和无监督学习之间。它使用少量的标记数据和大量的未标记数据。\n\n### 强化学习\n智能体（agent）与环境通信并确定最佳结果的能力被称为强化学习。它基于试错过程。\n\
    \n#### 强化学习的组件\n* 决策/智能体学习\n* 环境 - 智能体交互的对象\n* 动作 - 智能体执行\n\n## 深度学习\n在人工智能中，深度学习是机器学习的一个分支。学习有三种类型：监督、半监督和无监督。\n\
    \n深度学习是机器学习的一种形式，它训练计算机完成人类自然完成的事情。\n\n"
- fmt: '

    A `perceptron` is a neural network with just one layer. It''s a supervised learning
    system with a binary classifier. The `perceptron` is a basic model of a biological
    neuron in an artificial neural network.


    Input and output are also present in the artificial neuron.


    ## Representation of perceptron model mathematically.


    ![Artificial Neural Network in TensorFlow](Image00041.jpg)


    Neurons in the brain transfer information between each other, and nodes in a neural
    network do the same. The mathematical functions are represented by nodes.


    The structure and role of biological neural networks was used to create neural
    networks.


    The input and output of a neural network cause it to alter or understand.


    Because of its learning and developing properties, the artificial neural network''s
    structure is affected by the information flowing through the system.


    Multiple perceptrons can be used to create a neural network. There are three layers
    where there are three layers-


    - `Input layer`: The real value of the data is represented by input layers.

    - `Hidden layer`: Between the input and output layers are hidden layers, and three
    or more layers make up a deep network.

    - `Output layer`: It is the output''s final estimation.


    ## Types of Artificial Neural Network


    The neural network operates in the same way as the human nervous system does.
    Neural networks come in a variety of shapes and sizes. The implementation of these
    networks is based on a set of parameters and mathematical operations that must
    be used to determine the performance.


    ### Feedforward Neural Network (Artificial Neuron)


    The purest type of ANN is the `FNN`, which only allows data and input to flow
    in one direction. The Feedforward Neural Network is named after the fact that
    data flows only in one direction: forward. Data enters the system through input
    nodes and exits through output nodes. The nodes are not connected in a cyclical
    manner. There is no need for a secret layer. There is no need for multiple layers
    in `FNN`. It may even have a single sheet.


    It has a front propagate wave generated with a classifying activation feature.
    `Backpropagation` is used for all other forms of neural networks, but not by `FNN`.
    The product''s input and weight are added together in `FNN`, and the result is
    fed to the output. Face recognition and computer vision are among the technologies
    used by `FNN`.


    ### Redial basis function Neural Network


    `RBFNN` calculates the distance between two points and considers it to be in good
    working order. The RBF Neural Network is made up of two layers. The features are
    combined with the radial base function in the inner layer. Features produce a
    production that is taken into account. In addition to Euclidean measures, other
    methods may be used.


    #### Redial Basis Function


    - A receptor `t` is described.

    - The receptor is surrounded by confronted charts.

    - Gaussian functions are often used in `RBF`. As a result, the radial distance
    can be described. `r=||X-t||`.


    `Redial Function=Φ(r) = exp (- r 2 /2σ 2 )`, where `σ > 0`


    In a power restoration method, this Neural Network is used. Power systems have
    grown in size and complexity in recent years.


    All of these factors raise the likelihood of significant power outages. After
    a blackout, power must be restored as soon and as safely as possible.


    ### Multilayer Perceptron


    Three or more layers make up a Multilayer Perceptron. This network is used to
    categorize data that cannot be isolated linearly.


    This network is a completely linked network, which means that each node is connected
    to all other nodes in the layer above it. In Multilayer Perceptron, a `Nonlinear
    Activation Function` is used.


    It has nodes in both the input and output layers that are linked in a directed
    graph.


    It is a deep learning approach that employs `backpropagation` to train the network.


    It''s used in a lot of speech recognition and machine translation software.


    ## Convolutional Neural Network


    A Convolutional Neural Network plays a crucial role in image classification and
    recognition, or we might suggest it is the key category for those.


    `CNNs` are commonly used in areas such as face recognition, object detection,
    and so on. In neurons, learnable weights and biases are visible, similar to `FNN`.


    `CNN` takes an image as input and classifies and processes it into one of many
    categories, such as dog, cat, lion, tiger, and so on.


    As we all know, a computer interprets an image as pixels, which is dependent on
    the image''s resolution.


    It will see `h * w * d`, where `h = height`, `w = width`, and `d = dimension`,
    based on image resolution.


    An RGB image, for example, is a `6 * 6 * 3` matrix array, while a grayscale image
    is a `4 * 4 * 3` pattern array.


    Each input image in `CNN` will go through a series of convolution layers, as well
    as pooling, completely linked layers, and filters (Also known as kernels).


    To identify an object with probabilistic values between 0 and 1, use the `Soft-max`
    function.


    ### Recurrent Neural Network


    The Recurrent Neural Network is a prediction-based system.


    The output of a specific layer is saved and fed back to the input in this neural
    network.


    It will aid in the prediction of the layer''s outcome.


    The first layer of a Recurrent Neural Network is created in the same way that
    the first layer of a `FNN` is created, and the recurrent neural network phase
    starts in the subsequent layer.


    All inputs and outputs are independent of one another, but in some situations,
    the next word of the sentence must be predicted.


    Then it will be determined by the sentence''s previous name.


    The `Hidden State` function of `RNN` is its most well-known and critical feature.
    The knowledge about a series is remembered by `Hidden State`.


    ### Modular Neural Network


    Several separate networks are functionally autonomous in a Modular Neural Network.


    The role in `MNN` is divided into sub-tasks and carried out by multiple systems.


    Networks do not interact directly with each other during the computation process.


    All of the interfaces work together to achieve the desired result.


    Flat and open networks are less efficient than combined networks. Intermediary
    takes each system''s output and processes it to create the final output.


    ### Sequence to Sequence Network


    Two recurrent neural networks make up this system. The input is processed by the
    `encoder`, and the output is processed by the `decoder`. For the same or different
    parameters, the `encoder` and `decoder` may be used.


    Chatbots, machine translation, and query answering systems all use sequence-to-sequence
    models.


    ## Components of an Artificial Neural Network


    ### Neurons


    Neurons are similar to biological neurons. The activation mechanism is what neurons
    are all about. When performing the classification task, artificial neurons or
    the Activation mechanism has a "turn on" characteristic. If the input exceeds
    a certain threshold, the output should change state, for example, from 0 to 1,
    -1 to 1, and so on. In Artificial Neural Networks, the `sigmoid` function is a
    typical activation function.


    ```

    F (Z) = 1/1+EXP (-Z)

    ```


    ### Nodes


    The output of certain neurons becomes the input of others in a hierarchical network
    of biological neurons. A linked layer of nodes is used to describe these networks.
    Each node receives multiple weighted inputs and applies the sum of these inputs
    to the neuron to produce an output.


    ![Artificial Neural Network in TensorFlow](Image0042.jpg)


    ### Bias


    We predict the output `(y)` using a neural network based on the given data `(x)`.
    We construct a model, `(mx + c)`, to assist us in predicting the outcome. As we
    train the model, it automatically determines the required values for the constants
    `m` and `c`.


    The bias is represented by the constant `c`. Bias aids a model in fitting it to
    the given data in the best possible possible. We may argue that prejudice allows
    us to perform at our best.


    ### Algorithm

    '
