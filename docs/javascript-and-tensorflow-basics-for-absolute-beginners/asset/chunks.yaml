    让我们看看如何使用 TensorFlow 实现一个用于图像分类查询的单层感知机。“逻辑回归”的表示是描绘单层感知机的最佳示例。\n\n现在，我们必须完成以下逻辑回归的训练步骤：\n\
    \n*   在每次训练开始时，权重被用随机值初始化。\n*   通过预期性能与实际性能之间的差异，确定训练集每个方面的误差。根据测得的误差调整权重。\n*\
    \   重复此过程，直到总迭代次数小于指定的限制，且整个训练训练集的故障率小于指定的限制。\n\n### 单层感知机完整代码\n\n```python\n\
    # Import the MINST dataset\nfrom tensorflow.examples.Books.mnist import input_data\n\
    mnist = input_data.read_data_(\"/tmp/data/\", one_hot=True)\nimport tensorflow\
    \ as tf\nimport matplotlib.pyplot as plt\n\n# Parameters\nlearning_rate = 0.01\n\
    training_epochs = 25\nbatch_size = 100\ndisplay_step = 1\n\n# tf Graph Input\n\
    x = tf.placeholder(\"float\", [none, 784]) # MNIST data image of shape 28*28 =\
    \ 784\ny = tf.placeholder(\"float\", [none, 10]) # 0-9 digits recognition => 10\
    \ classes\n\n# Create model\n# Set model weights\nW = tf.Variable(tf.zeros([784,\
    \ 10]))\nb = tf.Variable(tf.zeros([10]))\n# Constructing the model\nactivation=tf.nn.softmax(tf.matmul(x,\
    \ W)+b) # Softmax function\n\n# Minimizing error using cross entropy\ncross_entropy\
    \ = y*tf.log(activation)\ncost = tf.reduce_mean(-tf.reduce_sum(cross_entropy,\
    \ reduction_indice=1))\noptimizer = tf.train.GradientDescentOptimizer(learning_rate).minimize(cost)\n\
    \n#Plot settings\navg_set = []\nepoch_set = []\n# Initializing the variables where\
    \ init = tf.initialize_all_variables()\n# Launching the graph\nwith tf.Session()\
    \ as sess:\n    sess.run(init)\n    # Training of the cycle in the dataset\n \
    \   for epoch in range(training_epochs):\n        avg_cost = 0.\n        total_batch\
    \ = int(mnist.train.num_example/batch_size)\n        # Creating loops at all the\
    \ batches in the code\n        for i in range(total_batch):\n            batch_xs,\
    \ batch_ys = mnist.train.next_batch(batch_size)\n            # Fitting the training\
    \ by the batch data\n            sess.run(optimizer, feed_dict={x: batch_xs, y:\
    \ batch_ys})\n            # Compute all the average of loss\n            avg_cost\
    \ += sess.run(cost, feed_dict={x: batch_xs, y: batch_ys}) # total\n        # Display\
    \ the logs at each epoch steps\n        if epoch % display_step == 0:\n      \
    \      print(\"Epoch:\", '%0d' % (epoch+1), \"cost=\", \"{:.9f}\".format(avg_cost))\n\
    \            avg_set.append(avg_cost)\n        epoch_set.append(epoch+1)\n   \
    \ print(\"Training finished\")\n    plt.plot(epoch_set, avg_set, 'o', label='Logistics\
