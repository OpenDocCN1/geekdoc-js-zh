- fmt: "\n![](Image00049.jpg)\n\n# JAVASCRIPT AND TENSORFLOW BASICS: FOR ABSOLUTE\
    \ BEGINNERS\nBY TAM SEL\n\n# JAVASCRIPT\n\nThis JavaScript tutorial makes it easy\
    \ for both beginners and experts to learn JavaScript.\nTo learn JavaScript, you\
    \ only need a basic understanding of computers.\n\n# JAVASCRIPT EXAMPLE\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <h2>Welcome to JavaScript</h2>\n  <script>\n\
    \    document.write(\"Hello Friends\");\n  </script>\n</body>\n</html>\n```\n\n\
    JavaScript can be implemented by adding JavaScript statements in the code.\n`<script>...</script>`.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script type=\"text/javascript\"\
    >\n    document.write(\"Hello World\");\n  </script>\n</body>\n</html>\n```\n\n\
    ### JavaScript code can be written in 3 places in JavaScript\n\n1. Between the\
    \ `<body>`...`</body>` tag of HTML.\n2. Between the `<head>`...`</head>` tag of\
    \ HTML.\n3. In `.js` file (external JavaScript).\n\n### Example (code between\
    \ the body tags)\n\nIn the example below, the `body` tag contains JavaScript code.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script type=\"text/javascript\"\
    >\n    alert(\"Hello world\");\n  </script>\n</body>\n</html>\n```\n\n### Example2\
    \ (code between the head tag)\n\nWe'll create the function `msg()` in the example\
    \ below. In JavaScript, you must write function in function name to construct\
    \ a function. To call a method, we must first create a case. We're using the `onclick`\
    \ event to call the `msg()` function in this case.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <script type=\"text/javascript\">\n    function msg() {\n  \
    \    alert(\"world\");\n    }\n  </script>\n</head>\n<body>\n  <p>Welcome to JavaScript</p>\n\
    \  <input type=\"button\" value=\"click\" onclick=\"msg()\">\n</body>\n</html>\n\
    ```\n\n### External file\n\nWe can build a JavaScript file that we can use in\
    \ HTML files. Since a single JavaScript file can be used in several HTML pages,\
    \ it allows for code reuse. It improves the web page's efficiency. The file must\
    \ have a `.js` extension.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <script\
    \ type=\"text/javascript\" src=\"message.js\"></script>\n</head>\n<body>\n  <p>Hello</p>\n\
    \  <input type=\"button\" value=\"click\" onclick=\"msg()\">\n</body>\n</html>\n\
    ```\n\n# Javascript comment\n\nComments in JavaScript are used to describe the\
    \ code. It's used to add code-related content, such as warnings or recommendations,\
    \ so that end users can understand it.\n\n## Types of JavaScript comments\n\n\
    There are two kinds of JavaScript comments:\n1. Single-line Comment\n2. Multi-line\
    \ Comment\n\n### Single-line Comment\n\nDouble slashes `//` are used to represent\
    \ single-line comments. While the program is running, any text between the double\
    \ slashes `//` and the end of the line will be ignored.\n\neg. Comment added before\
    \ the statement.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n   \
    \ // single-line comment\n    document.write(\"hello world\");\n  </script>\n\
    </body>\n</html>\n```\n\neg. Comment added after the statement.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <script>\n    var a = 10;\n    var b = 20;\n    var\
    \ c = a + b; //It add values of a and b\n    document.write(c); //print sum of\
    \ 10 and 20\n  </script>\n</body>\n</html>\n```\n\n#### Output\n30\n\n## Multi-line\
    \ comment\n\nSingle and multi-line comments can also be made for multi-line comments.\
    \ Comments that span multi lines begin with `/*` and end with `*/`. JavaScript\
    \ will ignore the text in between them.\n\n### /* Write comment here */\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <script>\n    /* It is multi-line comment.\
    \ It will not be displayed */\n    document.write (\"Example of JavaScript multi\
    \ line comment\");\n  </script>\n</body>\n</html>\n```\n\n# Javascript Variable\n\
    \nValues (`name=\"Ram\"`) and expressions (`Sum=x+y`) are stored in variables.\n\
    We must first declare a variable before using it. To declare a variable, we use\
    \ the keyword `var` as follows:\n\n```javascript\nvar name;\n```\n\nThere are\
    \ two types of variables:\n1. Local Variable\n2. Global Variable\n\nLocal Variable\
    \ – It's declared within a function or a block.\n\n```javascript\n<script>\nfunction\
    \ abc() {\n  var x = 10; //local variable\n}\n</script>\n```\n\nGlobal Variable\
    \ - It has a global scope, meaning that it can be specified anywhere in JavaScript\
    \ code. Outside of the function, a variable is declared.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <script>\n    var data = 200; //global variable\n \
    \   function a() {\n      document.write(data);\n    }\n    function b() {\n \
    \     document.write(data);\n    }\n    a(); //calling javascript function\n \
    \   b();\n  </script>\n</body>\n</html>\n```\n\n### Declaring global variable\
    \ within function\n\nWe need to use the `window` object to declare a JavaScript\
    \ global variable within a function.\n\n```javascript\n<script>\nfunction a()\
    \ {\n  window.value = 50; //declare global variable by use of window object\n\
    }\n</script>\n```\n\nIt can now be declared within any function and accessed from\
    \ within any function.\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <script>\n\
    \    function a() {\n      window.value = 90;\n    }\n    function b() {\n   \
    \   alert(window.value);//access global variable from other function\n    }\n\
    \    a();\n    b();\n  </script>\n</body>\n</html>\n```\n"
