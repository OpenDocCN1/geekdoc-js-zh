    # Machine Learning and Deep Learning


    ## What is Machine Learning?


    Machine learning is a branch of artificial intelligence (AI) that gives computers
    the ability to learn and develop on their own.


    Arthur Samuel was the first to launch it in 1959.


    The primary goal is for the machine to learn on its own, without the need for
    human intervention, and to change its behavior accordingly.


    Many problems have historically been simple for humans but difficult for networks.


    Machine learning (in particular deep learning) is actually our best approach for
    many of these problems.


    Medical diagnosis, image processing, estimation, classification, and regression
    are only a few examples.


    ## Features of Machine Learning


    ## Machine learning makes use of data to find patterns in any dataset.


    ## It is a technology that is based on data.


    ## It automatically enhances past data by learning about it.


    ## Machine learning and data mining are similar in that they both work with large
    amounts of data.


    ## Need of Machine Learning


    Machine learning is in high demand, and it''s only getting higher.


    As humans, we have many shortcomings, such as the inability to access vast amounts
    of data manually, necessitating the use of computer systems.


    And there''s machine learning to help us out.


    Machine learning can be easily understood thanks to its use cases.


    Machine learning is currently used in self-driving vehicles, cyber fraud detection,
    facial recognition, and Facebook friend recommendation.


    Some of the world''s most well-known businesses, such as Amazon and Netflix, have
    developed machine learning models that evaluate user interest and correctly suggest
    products based on a large amount of data.


    It can also be used to uncover a secret pattern and extract useful data.


    ## Types of Machine Learning


    ![](Image00038.jpg)


    ## Supervised Learning:


    Supervised Learning is a form of machine learning in which the learning is guided
    by an instructor.


    The dataset we have will serve as an instructor for the model and machines, and
    will be used to train them. When new data is provided to the model after it has
    been educated, it begins to make predictions or decisions.


    ![Image 4.jpg](Image00039.jpg)


    It can be grouped into two types:


    *   Classification


    *   Regression


    ### Classification


    ### It''s a method for recreating class assignments. It generates the answer value
    and divides the data into "classes."


    ### Recognition of a type of car in a photograph, for example.


    ### Regression


    Regression is a method for calculating the output value. We should make use of
    it.


    Use as an example to forecast the cost of a different product.


    ## Unsupervised Learning:


    When the train data is neither classified nor labeled, the unsupervised machine
    learning algorithm is used.


    When the model is given a dataset, it automatically creates clusters in the dataset
    to find patterns and relationships.


    If we give the model images of apples, bananas, and mangoes, it will generate
    clusters and divide the dataset into clusters based on some trends and relationships.


    If the model receives new data, it now adds it to one of the generated groups.


    It also has two types:


    *   Clustering


    *   Association


    Clustering:


    Clustering is a technique for identifying similarities and differences between
    objects. It brings together items that are similar.


    This algorithm will assist us in overcoming a variety of challenges.


    Example:  Create groups of tweets with similar material, find a group of images
    with similar cars, or recognise different types of news.


    Association:


    After clustering, association rules mining is a key unsupervised data mining tool
    for finding interesting associations (relationships, dependencies) in a wide range
    of data objects.


    ## Semi-Supervised Learning:


    It''s in the middle of controlled and unsupervised learning. As a result, they
    train for both labelled and unlabelled data, with a small amount of labelled data
    and a large amount of unlabelled data.


    Semi-supervised learning is often used where the acquired marked data necessitates
    the use of qualified and substantial resources to train.


    ## Reinforcement Learning:


    The ability of an agent to communicate with the environment and determine the
    best outcome is known as reinforcement learning.


    It is based on the hit-and-trial process. For a correct or incorrect answer, the
    agent is rewarded or punished with a point, and the model train is rewarded or
    punished based on the positive reward points earned.


    It then learned to predict the new data that was presented to it.


    The agent''s target is to earn the most reward points while also improving its
    results.


    ### Components of Reinforcement Learning


    *   Decision making/ Agent learning


    *   Environment - What agents interact with


    *   Actions - What the agent do!


    ## Deep Learning


    In artificial intelligence, deep learning is a branch of machine learning. There
    are three types of learning: supervised, semi-supervised, and unsupervised.


    Deep learning is a form of machine learning that trains computers to do things
    that humans do naturally. Deep learning is a key component of self-driving vehicles,
    allowing them to identify a stop sign.


    Working of Deep Learning


    ![Image 5.jpg](Image00040.jpg)


    Deep learning has gotten a lot of press recently, and with good reason. In deep
    learning, a computer model learns to perform classification tasks directly from
    images, text, and sound.


    The number of hidden layers in a neural network is generally referred to as "deep."
    Deep neural networks may have 150 hidden layers, while conventional neural networks
    only have 2-3.


    # TensorFlow Artificial Neural Network


    The neural network, also known as an artificial neural network (ANN), is modeled
    after the human brain. The human brain has a mind that allows it to think about
    and interpret any role in any situation.


    But how does a computer think in such a way? A neural network was created as an
    artificial brain for this purpose. Many perceptrons make up the neural network.'
