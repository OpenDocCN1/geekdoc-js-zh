    \ batch_xs, y: batch_ys})\n        # Display the logs at each epoch step\n   \
    \     if epoch % display_step == 0:\n            print(\"Epoch:\", '%0d' % (epoch+1),\
    \ \"cost=\", \"{:.9f}\".format(avg_cost))\n```\n"
