    ## 4) Scalability

    The libraries are mounted on a hardware unit, which is a complicated cellular
    system connected to the computer.


    ## 5) Pipelining

    TensorFlow is designed to work with a variety of backend applications (GPUs, ASICs,
    and so on) and to be highly parallel.


    ## 6)

    It uses a novel approach that helps us to track many metrics as well as control
    our models'' training progress.


    ## 7)

    TensorFlow has a strong community behind it.


    ## 8)

    Its efficiency is excellent, and it is on par with the best in the industry.


    ## Disadvantages of TensorFlow


    ### 1) Missing Symbolic loops

    When it comes to variable-length sequences, the function is even more important.
    Unfortunately, TensorFlow lacks functionality; however, finite folding is the
    best option.


    ### 2) No supports for windows

    There are many users who prefer to work in a windowed environment rather than
    on Linux, and TensorFlow does not meet their needs. However, if you are a Windows
    user, you can also install it using `conda` or the Python Package Library (`pip`).


    ### 3) Benchmark tests

    As compared to its rivals, TensorFlow falls short on both speed and usability.


    ### 4) No GPU support for Nvidia and only language support

    Currently, NVIDIA is the only GPU supported, and Python is the only complete language
    supported, which is a disadvantage since there are a growing number of other deep
    learning languages, as well as the Lau.


    ### 5) Computation Speed

    While TF is lagging in this area, since we focus on the production environment
    rather than results, it is still the best option.


    ### 6) OpenCL isn''t supported.


    ### 7) It necessitates a solid foundation in advanced calculus and linear algebra,
    as well as a thorough understanding of machine learning.


    ### 8) TensorFlow has a distinct layout, making it difficult to locate and debug
    errors.


    ### 9) There is no requirement for ultra-low-level matter.


    ### 10) It''s an entry-level course with a steep learning curve.


    # TensorFlow Playground


    The TensorFlow Playground is a software application written in the `d3.js` programming
    language (JavaScript).


    It''s also the best app for learning about Neural Networks (NN) without having
    to do any math.


    We can build a NN (Neural Network) in our web browser and see the results right
    away.


    It''s licensed under the Apache 2.0 license, which was issued in January 2004.
    ([http://www.apache.org/licenses/](http://www.apache.org/licenses/)).


    It was created by Daniel Smilkov and Shan Carter and is a continuation of several
    previous works.


    Fernanda Viegas and Martin Wattenberg, as well as the Big Picture and Google Brain
    teams, provided input and guidance.


    TensorFlow Playground is a web application that allows users to evaluate AI algorithms
    using the TensorFlow machine learning library.


    TensorFlow Playground isn''t familiar with high-level math or coding neural networks
    for deep learning and other machine learning applications.


    In the Playground, neural network operations are interactive and portrayed.


    The open-source library was created with educational needs in mind.


    Now go to [http://playground.tensorflow.org](http://playground.tensorflow.org/).


    Epoch, Learning rate, Activation, Regularization rate, and Problem form are all
    listed at the top of the website and are defined in detail below.


    The Epoch number increases each time training for the training set is performed,
    as shown below.


    ![Image 1.jpg](Image00025.jpg)


    Since the learning rate defines the speed at which we learn, we must choose the
    appropriate learning rate.


    The output of a node, or a collection of data, is defined by its activation function.


    Depending on its input, a typical computer chip circuit may be a digital network
    of activation functions that can be "ON" (1) or "OFF" (0).


    ### Soft Output Activation Function

    ![](Image00026.jpg)


    Overfitting is avoided by using regularization.


    Regularization is implemented in two ways in TensorFlow: L1 and L2.


    Regularization can sharpen pattern classification by increasing or decreasing
    the weight of a strong or weak link.


    ### L1 Regularization

    * L1 is useful in sparse feature spaces where only a few features must be chosen
    from a large number.

    * L1 can make selections and assign large weight values to the selected items,
    thus making the non-selected items'' weights low (or zero)


    ### L2 Regularization

    * With correlated inputs, L2 is capable

    * The weight values will be regulated by L2 at the same level as the correlation
    level.


    Dropout is a regularization technique as well.


    A higher regularization rate would restrict the weight''s range.


