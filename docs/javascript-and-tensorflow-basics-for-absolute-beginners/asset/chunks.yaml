  trans: "\n\n注意：这两个对象必须具有相同的形状。两个张量的相法是可能的。\n\n# 乘法\n\n```python\ntensor_multiply=tf.multiply(tensor_x,\
    \ tensor_y)\nprint(tensor_multiply)\n```\nOutput:\nTensor(\"Mul:0\", shape=(3,4),\
    \ dtype=int23)\n\n## 变量\n\n目前仅开发了常量张量。\n\n我们使用变量类来处理通常具有不同值的数据。它代表一个具有变化值的节点。\n\
    \n我们使用 `tf.get_variable()` 方法来生成值。\n\n```python\ntf.get_variable(name = \"\",\
    \ values, dtype, initializer)\n```\n\n**参数**\n- `name = \"\"`: 变量名称\n- `values`:\
    \ 张量的维度\n- `dtype`: 数据类型。可选\n- `initializer`: 如何初始化张量。可选\n\n如果指定了 `initializer`，则没有需要包含\
    \ `\"values\"`，因为 `\"initializer\"` 的形状会被使用。\n\n例如，该代码生成了一个包含两个随机生成值的二维变量。TensorFlow\
    \ 可能会返回一个随机值。该变量被称为 \"var\"。\n\n# 创建变量\n\n### 创建 2 个随机值\n\n```python\nvar = tf.get_variable(\"\
    var\", [1, 2])\nprint(var.shape)\n```\nOutput:\n(1, 2)\n\n在第二个示例中，我们可以构造一个有一行两列的变量。为了确定变量的维度，我们需要使用\
    \ `[1,2]`。\n\n张量的初始值为 0。我们使用初始值在训练模型时计算特征的权重。我们从零开始。\n\n```python\nvar_init_1\
    \ = tf.get_variable(\"var_init_2\", [1, 2], dtype=tf.int23, initializer=tf.zeros_initializer)\n\
    print(var_init_1.shape)\n```\nOutput:\n(2, 1)\n\n常量张量的值可以传递给向量。使用 `tf.constant`\
    \ 公式来构建常量张量。该张量用于设置变量。\n\n变量的前几个值是 10, 20, 30, 40 和 50。最新的张量具有 2x2 的形式。\n\n###\
    \ 创建任意 2x2 矩阵\n\n```python\ntensor_const = tf.constant([[10, 30], [20, 40]])\n\
    # 初始化张量的第一个值等于 tensor_const\nvar_init_2 = tf.get_variable(\"var_init_2\", dtype=tf.int23,\
    \ initializer=tensor_const)\nprint(var_init_2.shape)\n```\nOutput:\n(2, 2)\n\n\
    ## 占位符\n\n为了初始化数据并在张量内进行，使用了占位符。我们必须使用 feed dict 来包含占位符。占位符只会在 session 中填充一次。在下一个示例中，使用\
    \ `tf.placeholder` 方法构建占位符。我们将在 session 中学习如何用真实数据填充占位符。\n\n语法如下：\n```python\n\
    tf.placeholder(dtype, shape=None, name=None)\n```\n**参数：**\n- `dtype`: 数据类型\n\
    - `shape`: 占位符的维度。可选。默认是数据的形状。\n- `name`: 占位符的名称。可选\n\n```python\ndata_placeholder_a\
    \ = tf.placeholder(tf.float32, name=\"data_placeholder_a\")\nprint(data_placeholder_a)\n\
    ```\nOutput:\nTensor(\"data_placeholder_a:0\", dtype=float32)\n\n### TensorFlow\
    \ 通过 3 个组件工作：\n\n- 图 (Graph)\n- 张量 (Tensor)\n- 会话 (Session)\n\n| 组件 |  |\n| :---\
    \ | :--- |\n| Graph | 在 TensorFlow 中，图至关重要。在图中，执行所有的数学操作 (ops)。图可以被视为一个项目，其中每个过程几乎完成。这些操作由节点表示，节点可以生成或产生张量。\
    \ |\n| Tensor | 张量是从一个操作到下一个操作的数据表示。我们已经看到如何设置张量。可以改变的变量初始值是常量和变量之间的区别。 |\n| Session\
    \ | 图上的程序将由 session 执行。我们需要打开一个 session 将图通信到值。为了生成输出，我们必须在 session 中运行算子。 |\n\
    \n### Session\n\n图和 session 是独立的实体。我们可以运行一个 session 并保存结果以供以后计算使用。在下面的示例中，我们将：\n\
    \n- 创建两个张量\n- 创建一个操作\n- 打开一个 session\n- 打印结果\n\n步骤-1) 我们创建两个张量 x 和 y\n**运行并评估一个\
    \ session**\n```python\nx = tf.constant([2])\ny = tf.constant([2])\n```\n步骤-2)\
    \ 我们通过乘以 x 和 y 创建算子\n**创建算子**\n```python\nmultiply = tf.multiply(x,y)\n```\n步骤-3)\
    \ 我们开始一个会议。两个计算将在 session 期间进行。完成后，我们需要结束 session。\n**创建一个 session 来运行给定代码**\n\
    ```python\nsess = tf.Session()\nresult_1 = sess.run(multiply)\nprint(result_1)\n\
    sess.close()\n```\nOutput:\n[8]\n\n## 代码解释\n\n![](img/Image0031.jpg)\n\n`x` 和\
    \ `y` 的乘积产生结果 \"8\"。另一个是在块内构建 session。这样做的好处是它可以结束 session。\n\n```python\nwith\
    \ tf.Session() as sess:\n    result_2 = multiply.eval()\n    print(result_2)\n\
    ```\nOutput:\n[8]\n\n为了在 session 的范围内执行过程，我们可以使用 `eval()` 过程。它与 `run()` 函数相同。它提高了代码的可靠性。我们可以启动一个\
    \ session 并查看你已经开发的张量中的值。\n\n### 检查之前创建的张量\n\n```python\nsess = tf.Session()\n\
    print(sess.run(r1))\nprint(sess.run(r2_matrix))\nprint(sess.run(r3_matrix))\n\
    ```\nOutput:\n1\n[[1 2]\n [3 4]]\n[[[1 2]\n [3 4]\n [5 6]]]\n\n即使我们构建了张量，变量设计上也是空的。这是因为我们需要使用\
    \ `tf.global_variables_initializer()` 来初始化它们。这是常量和变量之间的区别。\n\n"
