  trans: '


    一个 `perceptron`（感知器）是一个只有一层的神经网络。它是一个带有二分类器的监督学习系统。`perceptron` 是人工神经网络中生物神经元的一种基础模型。


    人工神经元中也存在输入和输出。


    ## 感知器模型的数学表示


    ![TensorFlow 中的人工神经网络](img/Image00041.jpg)


    大脑中的神经元之间相互传递信息，神经网络中的节点也进行同样的操作。数学函数由节点表示。


    生物神经元的结构和作用被用于创建神经网络。


    神经网络的输入和输出使其产生改变或理解。


    由于其学习和发展的特性，人工神经网络的结构会受到流过系统信息的影响。


    可以使用多个感知器来创建一个神经网络。它有三层，即这三层：


    - `Input layer`：输入层表示数据的真实值。

    - `Hidden layer`：输入层和输出层之间是隐藏层，三或更多层构成了深度网络。

    - `Output layer`：它是输出的最终估计。


    ## 人工神经网络的类型


    神经网络的工作方式与人类神经系统相同。神经网络有各种形状和大小。这些网络的实现基于一组必须用于确定性能的参数和数学运算。


    ### 前馈神经网络（人工神经元）


    最纯类型的 ANN 是 `FNN`，它只允许数据和输入向一个方向流动。前馈神经网络的命名是因为数据只向一个方向流动：前向。数据通过输入节点进入系统，并通过输出节点退出。节点之间不是以循环方式连接的。不需要隐藏层。`FNN`
    无需多个层。它甚至可能只有单层。


    它具有一个由分类激活特征生成的前传播波。`Backpropagation`（反向传播）用于所有其他形式的神经网络，但不用于 `FNN`。在 `FNN` 中，产品的输入和权重相加，结果反馈给输出。人脸识别和计算机视觉是
    `FNN` 使用的技术之一。


    ### 径基函数神经网络


    `RBFNN` 计算两点之间的距离并认为其处于良好状态。RBF 神经网络由两层组成。特征在内部层中与径基函数结合。特征产生一个被考虑的输出。除了欧几里距离量外，还可能使用其他方法。


    #### 径基函数


    - 描述了一个接收器 `t`。

    - 接收器被对角图表包围。

    - `RBF` 中经常使用高斯函数。因此，可以描述径向距离。`r=||X-t||`。


    `Redial Function=Φ(r) = exp (- r 2 /2σ 2 )`，其中 `σ > 0`


    这种神经网络被用于电力恢复方法中。近年来，电力系统的规模和复杂性不断增加。


    所有这些因素增加了大规模停电的可能性。在停电后，必须尽快、安全地恢复电力。


    ### 多层感知器


    三层或更多层构成了多层感知器。这种网络用于分类无法线性分离的数据。


    该网络是一个全连接网络，这意味着每个节点都连接到其上方层的所有其他节点。在多层感知器中使用了 `Nonlinear Activation Function`（非线性激活函数）。


    输入层和输出层都有在定向图中链接的节点。


    这是一种采用 `backpropagation`（反向传播）训练网络的深度学习方法。


    它被用于许多语音识别和机器翻译软件。


    ## 卷积神经网络


    卷积神经网络在图像分类和识别中起着至关重要的作用，或者我们可以认为它是这些领域的关键。


    `CNNs` 通常用于人脸识别、目标检测等领域。在神经元中，可见可学习的权重和偏置，类似于 `FNN`。


    `CNN` 将图像作为输入，并将其分类和处理为许多类别之一，例如狗、猫、狮子、老虎等。


    众所周知，计算机将图像解释为像素，这取决于图像的分辨率。


    根据图像分辨率，它将看到 `h * w * d`，其中 `h = 高`，`w = 宽`，`d = 维度`。


    例如，一张 RGB 图像是一个 `6 * 6 * 3` 矩阵数组，而灰度图像是一个 `4 * 4 * 3` 模式数组。


    `CNN` 中的每个输入图像都将经过一系列卷积层、池化层、全连接层和过滤器（也称为内核）。


    要识别具有 0 到 1 之间概率值的对象，请使用 `Soft-max` 函数。


    ### 循环神经网络


    循环神经网络神经网络是一个基于预测的系统。


    在这种神经网络中，特定层的输出被保存并反馈到输入中。


    它有助于预测该层的结果。


    循环神经网络的第一层创建方式与 `FNN` 的第一层相同，而循环神经网络阶段从随后的层开始。


    所有输入和输出之间都是相互独立的，但在某些情况下，必须预测句子的下一个单词。


    然后将由句子之前的名称决定。


    `RNN` 的 `Hidden State`（隐藏状态）函数是它最为人知且关键的特征。关于序列的知识由 `Hidden State` 记忆。


    ### 模块神经网络


    模块神经网络中的多个网络是功能独立的。


    `MNN` 中的作用被分为多个任务并由多个系统执行。


    网络在计算过程中不相互交互。


    所有接口共同工作以实现所需的结果。


    平面和开放网络的效率低于组合网络。中间提取每个系统的输出并进行处理以创建最终输出。


    ### 序列序列网络


    两个循环神经网络组成该系统。输入由 `encoder` 处理，输出由 `decoder` 处理。对于相同或不同的参数，可以使用 `encoder` 和 `decoder`。


    聊天机器人、机器翻译和问答系统都使用序列序列模型。


    '
- fmt: "\nIn a neural network, algorithms are needed. Biological neurons have self-awareness\
    \ and the ability to function, but how can an artificial neuron function in the\
    \ same way? This necessitates the training of our artificial neuron network. There\
    \ are several algorithms that are used for this purpose. Each algorithm operates\
    \ in a unique way.\n\nIn the preparation of our ANN, we use five different algorithms.\n\
    \n- Gradient Descent\n- Newton's Method\n- Conjugate Gradient\n- Quasi Newton's\n\
    - Levenberg Marquardt\n\n### Gradient Descent\nThe steepest descent algorithm\
    \ is another name for the gradient descent algorithm. It is the simplest algorithm\
    \ that relies on information from the gradient vector. A first-order approach\
    \ is the GD algorithm.\n\n![](Image00043.jpg)\n\n```\nw (i+1) = w (i) - g (i)\
    \ n (i)\n```\n\n### Newton's Method\nA second-order algorithm is Newton's process.\
    \ It employs the Hessian matrix. Its main goal is to use the second derivatives\
    \ of the loss function to find better training directions.\n\nThe iteration of\
    \ Newton's method is as follows.\n\n```\nw (i+1) = w (i) - H (i)-1 . g (i) For\
    \ i = 0, 1.....\n```\n\nHere, `H (i)-1 .g (i)` is known as Newton's step. The\
    \ shift in parameters may be moving toward a limit instead of a minimum.\n\nThe\
    \ training of a neural network using Newton's method is depicted in the diagram\
    \ below. The parameter can be improved by determining the training path and a\
    \ reasonable training pace.\n\n### Conjugate gradient\nBetween gradient descent\
    \ and Newton's process, conjugate gradient is used.\n\nConjugate gradient avoids\
    \ the knowledge requirements of Newton's process, such as evaluation, inversion\
    \ of the Hessian matrix, and storage.\n\nThe CG algorithm searches in a conjugate\
    \ direction rather than a gradient descent direction, which results in faster\
    \ convergence. In terms of the Hessian matrix, the training is performed in a\
    \ conjugate direction. The parameter is improved by calculating the conjugate\
    \ training path and then selecting an acceptable training rate in that direction.\n\
    \n### Quasi-Newton Method\nIn terms of computation, Newton's approach is time-consuming.\
