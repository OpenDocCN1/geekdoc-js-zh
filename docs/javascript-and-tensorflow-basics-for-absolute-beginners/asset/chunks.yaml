    This book is built in such a way that we can easily implement deep learning projects
    on `TensorFlow` in a simple and efficient way.


    It is a free and open source software library written in the `Python` programming
    language.


    `TensorFlow` is a `Python`-based framework. As a result, a basic understanding
    of `Python` is needed.


    We can easily understand `TensorFlow` if we have a good understanding of basic
    mathematics and artificial intelligence concepts.


    # TensorFlow Brief History


    `TensorFlow` is a common machine learning and deep learning platform. It is a
    Google Brain Team-developed free and open-source library that was released on
    November 9, 2015. It is entirely written in `Python` and uses it for numerical
    computation and data flow, making machine learning much quicker and easier.


    `TensorFlow` can be used to train and run deep neural networks for a variety of
    tasks, including image recognition, handwritten digit classification, recurrent
    neural networks, word embedding, natural language processing, video detection,
    and more. `TensorFlow` runs on a variety of `CPUs` and `GPUs`, as well as mobile
    operating systems.


    The word `TensorFlow` is made by two words, i.e., `Tensor` and `Flow`


    1. `Tensor` is a multidimensional array

    2. `Flow` is a term used to describe the flow of data in a system.


    ![TensorFlow Introduction](Image00013.jpg)


    ## History of TensorFlow


    When given large amounts of data, deep learning began to outperform all other
    machine learning algorithms many years ago.


    Google has realized that deep neural networks could be used to improve its services:

    - Search engine Google

    - Gmail (email)

    - Photograph


    ## They created the `TensorFlow` system to enable researchers and developers to
    collaborate on AI models.


    ## It can be used by a large number of people once it has been accepted and scaled.


    ## It was first released in 2015, and the first stable version was scheduled for
    release in 2017.


    ## It is an Apache Open Source License-compliant open-source framework.


    ## Without paying anything to Google, we can use, change, and reorganize the updated
    version for free.


    ## Components of TensorFlow


    ### Tensor


    ![](Image00014.jpg)


    ![TensorFlow Introduction](Image00015.jpg)


    ### Graphs


    A graph structure is used by `TensorFlow`. The graph compiles and summarizes all
    of the computations performed during the preparation.


    ### Advantages


    - It''s now compatible with several `CPUs` or `GPUs`, as well as smartphone operating
    systems.

    - The graph''s portability makes it possible to save computations for later use.
    Since the graph can be executed in the future, it can be saved.

    - The graph''s entire computation is achieved by linking tensors.


    Consider the following formula: `a=(b+c)*(c+2)`


    The functions can be broken down into the following components:

    `d=b+c`

    `e=c+2`

    `a=d*e`


    Now, we can represent these operations graphically below:


    ![TensorFlow Introduction](Image00016.jpg)


    ### Session


    The procedure from the graph can be executed by a session. We need to open a session
    in order to feed the graph with the value of a tensor.


    To generate an output, we must run an operator within a session.


    ## Why is TensorFlow popular?


    ### ![](Image00017.jpg)


    ### Use Cases/Applications of TensorFlow


    ### ![](Image00018.jpg)


    ### 1. Voice/Sound Recognition

    ![](Image00019.jpg)


    ### 2. Image Recognition

    ![](Image00020.jpg)


    ### 3. Time Series

    ![](Image00021.jpg)


    ### 4. Video Detection

    ![](Image00022.jpg)


    ### 5. Text-Based Applications

    ![](Image00023.jpg)


    ## Features of TensorFlow


    ### ![](Image00024.jpg)


    ### 1. Responsive Construct

    We can see each section of the graph, which is not possible with `Numpy` or `SciKit`.
    To build a deep learning application, you''ll need two or three things: a programming
    language, and two or three components.


    ### 2. Flexible

    According to its operability, it is one of the most important `TensorFlow` Features.
    It''s modular, and there are parts of it that we''d like to make stand-alone.


    ### 3. Easily Trainable

    It is simple to train on both the `CPU` and `GPU` in distributed computing.


    ### 4. Parallel Neural Network Training

    TensorFlow adds value to the pipeline by allowing us to train multiple neural
    networks and `GPUs` simultaneously, making the models very powerful on large-scale
    systems.


    ### 5. Large Community

    It was created by Google, and there is already a large team of software engineers
    working on continuous stability improvements.


    ### 6. Open Source

    The best part about the machine learning library is that it is open source, which
    means that anybody with internet access can use it. As a result, people can exploit
    the library to create a wide range of useful items. It has also evolved into another
    DIY culture with a large platform for people who are just getting started with
    it as well as those who are having difficulty using it.


    ### 7. Feature Columns

    Feature columns in `TensorFlow` can be thought of as intermediates between raw
    data and estimators, bridging input data with our model. The feature column is
    implemented as described in the feature column below.


    ### 8. Availability of Statistical Distributions

    This library includes distribution functions such as `Bernoulli`, `Beta`, `Chi2`,
    `Uniform`, and `Gamma`, which are crucial when using probabilistic methods including
    Bayesian models.


    ### 9. Layered Components

    `TensorFlow` generates layered weight and bias operations using functions like
    `tf.contrib.layers`, as well as batch normalization, convolution layer, and dropout
    layer. As a result, `tf.contrib.layers`. Optimizers like `Adagrad`, `SGD`, and
    `Momentum` are often used to solve optimization problems in numerical analysis.


    ### 10. Visualizer (With TensorBoard)

    With the aid of `TensorBoard`, we can inspect a different representation of a
    model and make the required changes while debugging it.


    ### 11. Event Logger (With TensorBoard)

    It''s similar to how we track the performance of tasks at the `cmd` on `UNIX`
    with `tail - f`. It tests the graph and output with the `TensorBoard`, recording
    events and summaries.


    # TensorFlow Installation Through pip


    We can download `TensorFlow` in our system in 2 ways:

    1. Through `pip` (Python package library)

    2. Through `Anaconda Navigator` (`conda`)


    ## 1. Through pip


    So, first and foremost, we must install and configure `Anaconda` in our system
    using `pip`.


    `TensorFlow` must meet the following requirements in order to run on our computer.

    - On `Windows`, `TensorFlow` only supports 64-bit `Python 3.5.x` or `Python 3.6.x`.

    - The `pip3` package manager is included when we download the `Python 3.5.x` version.
    (Which is the software that our users need to install `TensorFlow` on `Windows`.)


    Step 1: `Python` can be downloaded from the link below.

    [https://www.python.org/downloads/release/python-352/](https://www.python.org/downloads/release/python-352/)


    After that,


    Step 2: We''ll be taken to a new page where we''ll have to choose between the
    `x86-64` and `amd64` installers to install `Python`. The executable installer
    for `Windows x86-64` is used here.


    ## What is pip?


    `pip` is a package management system that is used to install and manage software
    packages written in `Python` or other programming languages. `Pip` is a `Python`
    package manager that allows you to download, browse, install, uninstall, and manage
    third-party `Python` packages. (`pip3` is the most recent edition, which comes
    with `Python 3.5.x`, which we had just downloaded)


    ## Installing our TensorFlow


    We can now finish up by downloading `TensorFlow` after we''ve downloaded the most
    recent version of `Python`.


    Step 1: Start the terminal to install `TensorFlow`. Ascertain that the `cmd` is
    run as an administrator.

    Open the Start menu, type `cmd` into the search box, and then right-click it and
    select Run as administrator.


    Step 2: After that, we type the command in the command prompt to complete the
    installation of `Tensorflow` in `Windows`.


    Enter this command:


    ```

    C:\pip3 install -upgrade tensorflow

    ```

    '
