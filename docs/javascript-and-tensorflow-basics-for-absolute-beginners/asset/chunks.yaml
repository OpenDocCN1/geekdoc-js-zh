    ## Placeholder


    ##### To initialize the data and proceed within the tensor, a placeholder is used.
    We must use the feed dict method to include a placeholder. The placeholder will
    only be fed once per session.


    ##### The method tf.placeholder is used to build a placeholder in the next example.
    You''ll learn how to fill a placeholder with real data in our next session.


    ##### The syntax is as follows:


    ##### tf.placeholder(dtype,shape=None,name=None )  


    ##### arguments:  


    ##### - `dtype`: Type of data  


    ##### - `shape`: the dimension of the placeholder. Optional. By  default , the shape of the data.  


    ##### - "Name"- Name of the placeholder. Optional     


