    ```


    # Output


    When we execute the above HTML program, the following will be the output.


    ![](img/64de8c62f77548c4dca6c5e5001f0a6b_21_0.png)


    # Statements in JavaScript


    Statements in JavaScript programming language are composed of the following.


    +   - Values

    - Operators

    - Expressions

    - Keywords, and

    - Comments.


    # Values in JavaScript


    The following are the two types of values in JavaScript.


    +   - Fixed values, and

    - Variable values.


    Literals are the fixed values and the variable values are known as variables.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Literals in JavaScript


    The following are the rules for writing literals or fixed values in JavaScript.


    +   - Numbers are defined with or without decimals.


    +   - Strings are the text that are written within single or double quotes.


    # Variables in JavaScript


    The following are the rules for writing variable values which are used to store
    data values in JavaScript.


    JavaScript language uses the var keyword to declare the variables.


    The value to a variable is assigned by an equal sign.


    # Operators in JavaScript


    The following are the operators used in JavaScript language.


    **Assignment operator (=)** is used to assign values to a variable.


    **Arithmetic operators (+-*/)** are used for arithmetic operations such as addition,
    subtraction, multiplication, and division.


    # Expressions in JavaScript


    Any expression in JavaScript language is a combination of values, variables, and
    operators. These together do computation. The computation is called an evaluation.


    An expressions may also contain variable values such as numbers and strings. E.g.,
    “Java” + “Script” will concatenate to “JavaScript”.


    Let’s understand this help with the help of the following example.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="ISO-8859-1">

    ```'
