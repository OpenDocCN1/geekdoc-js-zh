  md: '# Keywords in JavaScript


    Keywords in JavaScript language are used to identify the actions which are required
    to be performed. The var keyword directs the browser to create a new variable
    as JavaScript Identifiers. In JavaScript language, the identifiers are used to
    name variables (and keywords, and functions, and labels).


    In JavaScript language, the first character must be a letter, an underscore (_),
    or a dollar sign ($) always. The subsequent characters may be letters, digits,
    underscores, or dollar signs.


    # Camel Case and JavaScript


    There are the following three ways of joining multiple words into one variable
    name.


    +   - Hyphens — E.g., first-address, second-address, visa-passport, city-name,
    etc.

    - Underscore — E.g., first_address, second_address, visa_passport, city_name,
    etc.


    +   - Camel Case — E.g., FirstAddress, SecondAddress, VisaPassport, InterName,
    etc. In JavaScript programming languages, the camel case starts with a lowercase
    letter e.g., firstAddress, visaPassport, cityName, etc.


    # Character Set in JavaScript


    JavaScript language uses the Unicode character set and it covers all the characters,
    punctuations, and symbols.'
