  md: 'while loop type, repeats a statement or group of statements while a given condition
    is true. It tests the condition each time it executes the loop body and exits
    the loop when condition becomes false.


    for loop type executes a sequence of statements multiple times and abbreviates
    the code that manages the loop variable.


    It is a loop within a loop. In JavaScript, we can use a loop in another while
    or for loop or for loop in another while or for for loop.


    while loop


