    \ 语句中的条件为真，因此它会在 HTML 页面上写入指定的文本。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_57_0.png)\n\
    \nif...else 语句 – ‘if...else’ 语句是控制语句的另一种形式，允许 JavaScript 代码以控制的方式执行语句。以下是语法和示例。\n\
    \n## 语法与示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>If Else 语句</title>\n</head>\n```\n\n```html\n<script type=\"text/javascript\"\
