  mdcn: "\n\n通常，所有的 JavaScript 语句都以分号结束。当每个 JavaScript 语句都单独放在一行上时，这些分号是可选的。在每个 JavaScript\
    \ 语句末尾使用分号被认为是一种良好的编程习惯。\n\n## 大写敏感\n\nJavaScript 语言是一种大小写敏感的语言。这意味着关键字、变量、函数名、标识符等在使用时保持字母的大小写一致。例如，从\
    \ JavaScript 语言的角度来看，标识符 `learn` 和 `LEARN` 是不同的。\n\n## JavaScript 中的注释\n\n以下是\
    \ JavaScript 语言支持的注释样式。\n\n- 单行注释声明为 `//`（双斜杠）。\n- 多行注释声明为 `/* 多行上的 JavaScript\
    \ 语句 */`。它也适用于单行注释。\n- 它还能识别 HTML 注释（起始序列）`<!--`。JavaScript 像处理 `//` 注释一样将其视为单行注释。\n\
    - HTML 的结束序列 `-->` 不被 JavaScript 识别，因此它应该写成 `//->`。\n\n以下是一个涵盖各种 JavaScript 注释的示例。\n\
    \n```html\n<!DOCTYPE html>\n<html\n<head>\n  <meta charset=\"ISO-8859-1\">\n \
    \ <title>JavaScript Comments</title>\n</head>\n<body>\n  <script type=\"text/javascript\"\
    >\n  <!-- 起始序列单行注释。\n  HTML 注释结束序列--*/\n\n  // 这是一个单行注释。\n\n  /*\n  * 这是 JavaScript\
    \ 中的多行注释\n  */\n  </script>\n</body>\n</html>\n```\n\n## 输出\n\n当我们执行上述 HTML 程序时，输出将是以下内容（空白），因为\
    \ JavaScript 解释器忽略了所有注释。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_19_0.png)\n\
    \n## JavaScript 语法\n\n与任何其他编程语言一样，JavaScript 语法有一套特定的规则来构建它们。\n\n## JavaScript\
    \ 程序\n\nJavaScript 程序是一系列由浏览器程序解析并执行的指令。这些系列程序指令被称为语句。\n\nJavaScript 是一种基于对象的编程语言。\n\
    \nJavaScript 语句之间通常用分号隔开，但在语句末尾放置分号是可选的。\n\n```html\n<!DOCTYPE html>\n<html\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>JavaScript Syntax</title>\n<script\
    \ type=\"text/javascript\">\n  var a = 101;\n  var b = 300;\n  var sum = a + b;\n\
    </script>\n</head>\n<body>\n<script type=\"text/javascript\">\n  document.write(\"\
    sum of a + b = \"+sum);\n</script>\n</body>\n</html>\n```\n\n## 输出\n\n当我们执行上述\
    \ HTML 程序时，输出将是以下内容。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_21_0.png)\n\n\
    ## JavaScript 中的语句\n\nJavaScript 编程语言中的语句由以下组成：\n\n- 值\n- 运算符\n- 表达式\n- 关键字，以及\n\
    - 注释。\n\n## JavaScript 中的值\n\n以下是 JavaScript 中的两种值。\n\n- 固定值，以及\n- 变量值。\n\n字面量是固定值，变量值被称为变量。\n\
    \n## JavaScript 中的字面量\n\n以下是在 JavaScript 中编写字面量或固定值的规则。\n\n- 数字可以带或不带小数定义。\n-\
    \ 字符串是写在单引号或双引号内的文本。\n\n## JavaScript 中的变量\n\n以下是用于在 JavaScript 中存储数据值的变量值编写规则。\n\
    \nJavaScript 语言使用 `var` 关键字来声明变量。\n\n变量的值通过等号赋值。\n\n## JavaScript 中的运算符\n\n以下是\
    \ JavaScript 语言中使用的运算符。\n\n**赋值运算符 (=)** 用于给变量赋值值。\n\n**算术运算符 (+-*/*)** 用于算术运算，如加法、减法、乘法和除法。\n\
    \n## JavaScript 中的表达式\n\nJavaScript 语言中的任何表达式都是值、变量和运算符的组合。它们共同进行计算。这种计算被称为求值。\n\
    \n表达式可能还包含变量值，如数字和字符串。例如，“Java” + “Script”将拼接为“JavaScript”。\n\n让我们通过以下示例来理解这一点。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n```\n\
    \n## JS 表达式\n\n```html\n<script type=\"text/javascript\">\n  var a = 101; //变量、赋值运算符和数字字面量。\n\
    \  var b = 300;\n  var addition = a + b;\n  var str1 = \"Java\"; //变量、赋值运算符和字符串字面量。\n\
    \  var str2 = \"Script\";\n  var str3 = str1 + str2;\n</script>\n</head>\n<body>\n\
    <script type=\"text/javascript\">\n  document.write(\"Addition of b = \"+addition);\n\
    \  document.write(\"<br>Concat of str1 + str2 = \"+str3);\n</script>\n</body>\n\
    </html>\n```\n\n## 输出\n\n当我们执行上述 HTML 程序时，输出将是以下内容。输出显示了加法结果\n\n## JavaScript\
    \ 中的关键字\n\nJavaScript 中的关键字用于标识需要执行的操作和标签。\n\n## 驼峰命名法与 JavaScript\n\n将多个单词合并为一个有以下三种方式：\n\
    \n- 连字符：例如 first-address、second-address、visa-passport。\n- 下划线：例如 first_address、second_address、visa_passport。\n\
    - 驼峰命名法：例如 FirstAddress、SecondAddress、VisaPassport。在 JavaScript 中，驼峰命名法通常以小字母开头。\n\
    \n## JavaScript 中的字符集\n\nJavaScript 语言使用 Unicode 字符集，它涵盖所有字符、标点和符号。\n\n## 启用与禁用\n\
    \n如 Internet Explorer、Mozilla Firefox、Google Chrome 等浏览器内置了 JavaScript 支持。我们可以手动启用或禁用。在本章中我们将讨论在这些浏览器中启用禁用\
    \ JavaScript 的过程。\n\n### 在 Internet Explorer 中启用 JavaScript\n\n以下是在 Internet Explorer\
    \ 中启用 JavaScript 的步骤：\n\n- 从菜单导航到 Internetset。\n- 在对话框中，选择安全选项卡。\n- 点击自定义级别按钮。\n\
    -向下滚动菜单并找到脚本选项。\n- 在活动（Active）下选择启用单选按钮。\n- 最后，点击确定按钮启用 JavaScript 支持。\n\n###\
    \ 在 Internet Explorer 中禁用 JavaScript\n\n要关闭或禁用 Internet Explorer 中的 JavaScript\
    \ 支持，请按照上述步骤操作并在活动下选择禁用单选按钮。\n\n### 在 Mozilla Firefox 中启用 JavaScript\n\n以下是在 Mozilla\
    \ Firefox 中启用 JavaScript 的步骤：\n\n- 打开新标签页并在地址栏中输入 *about:config*。\n\n在那里我们将看到警告对话框，选择并点击“I’ll\
    \ be careful, I promise!”按钮，如下所示。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_27_0.png)\n\
    \n在这里我们将观察浏览器的配置选项列表。在搜索框中，输入 `javascript.enabled`如下所示。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_27_1.png)\n\
    \n在这里，我们可以通过右键点击开关的值找到启用或禁用 JavaScript 的选项。\n\n点击开关后，如果 javascript.enabled 为 true，它将转换为\
    \ false。这将禁用 Mozilla Firefox 浏览器的 JavaScript 支持。\n\n### 在 Mozilla Firefox 中禁用\
    \ JavaScript\n\n以下是关闭或禁用 Mozilla Firefox 中 JavaScript 支持的步骤。如果 JavaScript 已禁用，可以按照之前的类似步骤点击开关来启用。\n\
    \n### 在 Google Chrome 中启用或禁用 JavaScript 支持\n\n以下是在 Google Chrome 中启用或禁用 JavaScript\
    \ 支持的步骤：\n\n点击 Chrome 右上角的 Chrome 菜单\n\n"
