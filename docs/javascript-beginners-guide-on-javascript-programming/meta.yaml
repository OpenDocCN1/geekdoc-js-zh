- md: "\n## Chapter 10\n## JavaScript Loops\n\nWhen any program is executed, it runs\
    \ sequentially. The statement which appears first in the sequence is executed\
    \ first then the next statement and so on till the last statement of the program.\
    \ Many times there is a requirement to run same block of code in a program multiple\
    \ times then there arises a need of a control structure known as loops.\n\nA loop\
    \ makes a statement or group of statements in a block of code to execute multiple\
    \ times if the condition is true and exits the loop when the condition becomes\
    \ false. Such loop is illustrated in the below diagram.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_64_0.png)\n\
    \nLike any other programming language, the JavaScript support looping and the\
    \ following types of loops and the loop control statements.\n\n- While loop\n\
    - Do...while loop\n- For loop\n- for...in loop\n\n### Loop control statements\n\
