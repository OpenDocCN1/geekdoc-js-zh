    \ HTML 页面上写入 5 次，因为它保持了条件为真。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_70_0.png)\n\
    \n### 循环总结\n\n| 循环类型 | 描述 |\n| :--- | :--- |\n| While 循环 | While 循环是 JavaScript\
    \ 语言中最基础的循环。这种循环只要表达式保持为真，它就会重复执行一个语句或代码块。一旦表达式为假，循环就会终止。 |\n| Do...while 循环 |\
    \ do...while 循环与 while 循环相似，区别在于 do...while 循环中的条件检查发生在循环的结束处。这意味着循环内部的代码块将始终至少执行一次，即使条件为假。\
    \ |\n| For 循环 | ‘for’循环是 JavaScript 编程中非常重要且常用的循环语句。该命令包含以下三个重要部分：循环初始化、测试语句和迭代语句。\
    \ |\n| for...in 循环 | for...in 循环仅用于需要遍历对象属性的特殊情况。 |\n\n### 循环控制语句\n\n| 控制语句 |\
