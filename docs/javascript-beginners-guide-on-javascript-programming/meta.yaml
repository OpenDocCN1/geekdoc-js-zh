  mdcn: "\n\n## 第 10 章\n## JavaScript 循环\n\n当任何程序执行时，它都是按顺序执行的。序列中第一个出现的语句首先执行，然后是下一条，依此类推，直到程序的最后一条语句。很多时候，程序中需要多次运行同一块代码，这时就产生了被称为“循环”的控制结构的需求。\n\
    \n循环使代码块中的一个语句或一组语句在条件为真时执行多次，并在条件变为为假时退出循环。下面的图展示了这种循环。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_64_0.png)\n\
