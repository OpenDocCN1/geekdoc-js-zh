  md: '# Confirmation Dialog Box


    In JavaScript language, a confirmation dialog box is used when we need to take
    user’s opinion on any option. It displays a dialog box that has two buttons: OK
    button and Cancel button.


    When the user clicks on the OK button, then the window method “confirm()” will
    return a true value. Otherwise, if the user clicks on the Cancel button, then
    “confirm()” method will return a false value. The following is an example on the
    confirmation dialogue box.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="ISO-8859-1">

    <title>Confirm Box</title>

    <script type="text/javascript">

    function showAlert({


    confirm("This is an confirm dialogue box

    example!");

    }

    </script>

    </head>

    <body>

    <p>Confirm box demo example.</p>

    <input type="button" onclick="showAlert();" value="Call JavaScript">

    </body>

    </html>

    ```'
