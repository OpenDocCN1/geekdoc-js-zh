    # Defining Methods for an Object in JavaScript


    In the last example, we have demonstrated how to use the constructor that creates
    the object and assigns properties. In the following example, we are going to demonstrate
    an example to define methods for an an object in JavaScript.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="ISO-8859-1">

    <title>Object Methods</title>

    <script type="text/javascript">

    function student(name, course) {

    this.name = name;

    this.course = course;

    }

    ```'
