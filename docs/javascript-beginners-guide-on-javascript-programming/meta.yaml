    \ var str1 = \"Java\"; //variable, assignment operator and literal as String.\n\
    \  var str2 = \"Script\";\n  var str3 = str1 + str2;\n</script>\n</head>\n<body>\n\
    <script type=\"text/javascript\">\n  document.write(\"Addition of b = \"+addition);\n\
    \  document.write(\"<br>Concat of str1 + str2 = \"+str3);\n</script>\n</body>\n\
    </html>\n```\n\n## Output\n\nWhen we execute the above HTML program, the following\
    \ will be the output. The output shows the addition of\n\n## Keywords in JavaScript\n\
    \nKeywords in JavaScript are used to identify the actions which are required to\
