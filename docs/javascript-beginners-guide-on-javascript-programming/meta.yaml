    \ 运算符，但位 1 除外) 为 1。左侧移入位始终为零。 |\n\n## 第 9 章\n\n## JavaScript 决策\n\n在编写程序时，我们大多数时候面临必须做决策的情况。决策是对程序执行过程中可能出现的情况进行预判，并需要根据这些条件指定某些操作。\n\
