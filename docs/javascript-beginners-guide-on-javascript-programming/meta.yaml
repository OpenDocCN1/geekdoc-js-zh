    # # Chapter 7


    # ## JavaScript Variables


    # ### Datatypes in JavaScript


    It is the characteristic of every programming language to support operations on
    the set of data types. These are the actual values which are defined and manipulated
    in any programming language. Like any other programming language, the JavaScript
    language allows us to work with the following three primitive data types.


    +   - Numbers, e.g. 1, 23, 10.50, 23.8990 etc.


    +   - Strings or text data, e.g. “JavaScript”, “This is my language”, etc.


    +   - Boolean, as it could be either true or false.


    Apart from these three primitive datatypes, JavaScript language also defines the
    following two data types. Each of which defines only a single value.


    +   Null.


    +   Undefined.


    Also, JavaScript language supports a composite data type known as object. JavaScript
    objects will be covered in detail later in this tutorial.


    This is to be noted that the JavaScript language does not make a distinction between
    integer values and floating-point values. JavaScript considers all numbers as
    the floating-point values. JavaScript represents numbers by using the 64-bit floating-point
    format which is defined by the IEEE 754 standard.


    # ### Variables in JavaScript


    As discussed earlier, the JavaScript language has variables as data containers
    whereas we can place data into these containers and then refer this data by simply
    naming the container. We declare JavaScript variable with the var keyword as shown
    below.


    ![](img/64de8c62f77548c4dca6c5e5001f0a6b_40_0.png)'
- md: "\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n\
    <title>JavaScript Variables</title>\n<script type=\"text/javascript\">\n  var\
    \ name = \"Appy\";\n  var age = 21;\n  var salary = 10000, expenses = 12000;\n\
    \  alert (\"Name: \"+name+\" Age: \"+age+\"\\nSalary: \"+salary+\" Expenses: \"\
    +expenses+\");\n</script>\n</head>\n<body>\nn\n</script>\n</body>\n</html>\n```\n\
    \n# Explanation of the JavaScript code\n\nStoring of a value in a variable is\
    \ known as variable initialization. We can do variable initialization at any point\
    \ of time during the variable creation or the time when we need that variable.\n\
    \nFor instance, we have created four variables in the above code and assigned\
    \ value to each of these variables. E.g. name = \"Appy\", salary = 10000, etc.\n\
    \n# Output\n\nWhen we execute the above HTML program, the following will be the\
    \ output. In the output, we are displaying the values that was assigned to the\
    \ data container through an alert.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_42_0.png)\n\
    \nThis is to be noted that the var keyword is used only for declaration or initialization,\
    \ once for the life of any variable name in a HTML document. We should not re-declare\
    \ same variable more than once. In JavaScript, the variable can hold any value\
    \ of data type as it is an untyped language. Unlike other typed languages (e.g.,\
    \ C++, JAVA, etc.), we don't need to tell JavaScript compiler during variable\
    \ declaration that what type of value of the variable will hold. Also, the value\
    \ type of a variable can change during the execution of a program which the JavaScript\
    \ parser takes care of it automatically.\n\n# Variable Scope in JavaScript\n\n\
    The scope of a variable is defined as the region of the program in which it is\
    \ defined. The JavaScript variables can have the following two scopes.\n\n- Global\
    \ Variables scope – is a global scope which means it can be defined anywhere in\
    \ the JavaScript code and visible everywhere in the current HTML document.\n\n\
    - Local Variables scope – is a local variable which will be visible only within\
    \ a function where it is defined. The function parameters are always local to\
    \ the function.\n\nThis is to be noted that, within the body of a function, if\
    \ both local and global variables are defined with the same name then local variable\
    \ takes precedence over global variable always. Let’s understand this concept\
    \ in the best way with the help of the following example.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Variable Scope</title>\n\
    </head>\n<script type=\"text/javascript\"> // A global variable\nvar demoVar =\
    \ \"global scope\"; \nfunction checkVariableScope() {\nvar demoVar = \"local scope\"\
    ; // A local variable\ndocument.write(demoVar);\n}\n</script>\n<body onload =\
    \ checkVariableScope();\n\n</body>\n</html>\n```\n\n# Output\n\nWhen we execute\
    \ the above HTML program, the following will be the output. In the output, we\
    \ can observe the values as “local scope” as a local variable takes precedence\
    \ over a global variable, if both are defined with the same name.\n\n# Variable\
    \ Names in JavaScript\n\nThe rules should be obeyed while naming the variables\
    \ in JavaScript language.\n\n- No of the variable name which are reserved keywords.\
    \ These keywords are mentioned in the last section of this chapter. E.g. finally,\
