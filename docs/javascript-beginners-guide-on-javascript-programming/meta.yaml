    \ it allows the system to interact with the user. The user is required to enter\
    \ the required data into the field and then click on the OK button.\n\nSuch a\
    \ dialog box is displayed by using a method known as “prompt()”. It accepts the\
    \ following two parameters.\n\n- A label that we want to display in the text box.\n\
    - A default string which is display in the text box.\n\nThe prompt dialog box\
    \ has the following two buttons.\n\n- The OK button.\n- The Cancel button.\n\n\
    When the user clicks on the OK button, the window method “prompt()” will return\
    \ the value which was entered by the user in the text box. Otherwise, if the user\
    \ clicks on the Cancel button, then the window method “prompt()” will return a\
    \ null value.\n\nThe following is an example on the prompt dialogue box.\n\n```html\n\
    <!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Prompt Box</title>\n\
    <script type=\"text/javascript\">\nfunction showAlert() {\n  prompt(\"This is\
    \ an prompt dialogue box example!\");\n}\n</script>\n</head>\n<body>\n<p>Prompt\
    \ dialogue box demo example.</p>\n<input type=\"button\" onclick=\"showAlert();\"\
    \ value=\"Call JavaScript\"/>\n</body>\n</html>\n```\n\n## Output\n\nWhen we execute\
    \ the above HTML program, the following will be the output. Here, we see a prompt\
    \ dialogue box.\n\nPrompt dialogue box demo example.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_99_0.png)\n\
    \n## Chapter 14\n\n## JavaScript Void Keyword\n\nIn JavaScript language, the void\
    \ keyword can be used as a unary operator which is appeared before its single\
    \ operand, and may be of any type. This unary operator specifies an expression\
    \ which is required to be evaluated without any return value.\n\nThe following\
    \ is the syntax and an example of the void keyword.\n\n```html\n<!DOCTYPE html>\n\
    <html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Void Keyword Example 1</title>\n\
    </head>\n<body>\n<p>Click here to invoke an alert!</p>\n<a href=\"javascript:void(alert('Here\
    \ is the Void Keyword demo'))\">Click Here!</a>\n</body>\n</html>\n```\n\n## Output\n\
    \nWhen we execute the above HTML program, the following will be the output. Here,\
    \ we see an alert dialogue box that popped out on the click of the responsive\
    \ hyperlink (\"Click Here!\"). On the other hand, if void argument is empty then\
    \ there is no response in the case of the second hyperlink (\"No response link!\"\
    ) as the expression “0\" has no effect in JavaScript. When “0\" is evaluated,\
    \ it does not load back into the current document.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_102.png)\n\
    \nAlternatively, the void keyword in JavaScript is also used to generate the following.\n\
    \n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Void\
    \ Example 2</title>\n<script type=\"text/javascript\">\nfunction voidDemo() {\n\
    \  var x,y,z;\n  document.write('x = ' + x + ' y = ' + y + ' z = ' + z);\n}\n\
    </script>\n</head>\n<body>\n<p>Click to get...</p>\n<input type=\"button\" value=\"\
    Result\" onclick=\"voidDemo()\"/>\n</body>\n```\n\n## Output\n\nWhen we execute\
    \ the above HTML program, the following will be the output. Here we see the value\
    \ of the object is as ‘50’ and ‘700’ respectively.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_103.png)\n\
    \n## Chapter 15\n\n## JavaScript Objects\n\nJavaScript language is an Object Oriented\
    \ Programming (OOP) based language which provides the following capabilities:\n\
    \n- Encapsulation – is the concept which includes data and methods, together.\n\
    - Aggregation – is the concept to store one object inside another.\n- Inheritance\
    \ – is the concept to re-use a class.\n- Polymorphism – is the concept that enables\
    \ the same name in different ways. Also known as method overloading.\n\nObjects\
    \ — are composed of attributes.\n\n## Object Properties in JavaScript\n\nObject\
    \ properties in JavaScript can be any of the primitive data types (Number, String\
    \ and Boolean), or any of abstract data types (such as an object). They are variables\
    \ which are used globally throughout the page. The following is the syntax and\
    \ example.\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>Objects Example</title>\n<script type=\"text/javascript\">\nobjectName.objectProperty\
    \ = propertyValue;\nvar str = document.title;\n</script>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\nHere we are assigning the ‘pValue’ variable value to the object\
    \ property ‘objectProperty’. The object is referred with the name ‘objectName’.\
    \ In the next statement of the above example, we are storing the value of the\
    \ document title using the “title” property of the document into “str” variable.\n\
    \n## Object Methods in JavaScript\n\nObjects Methods are the functions with which\
    \ the object do manipulation or required executions. In JavaScript, the function\
    \ differs from the method in the following way: A function is a standalone unit\
    \ of statements whereas a method is attached to an object that can be referenced\
    \ by the “this” keyword.\n\nMethods can be used to display the object contents\
    \ on the HTML page. They can perform a complex mathematical operations on objects\
    \ properties and the input parameters passed to the object method. E.g., during\
    \ this tutorial, we have used the “write” method of the document object where\
    \ we pass the string or text as a parameter to be written on the HTML page.\n\n\
    ```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Object\
    \ Method Example</title>\n<script type=\"text/javascript\">\ndocument.write(\"\
    Welcome to JavaScript Programming!\");\n</script>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n## User-Defined Objects in JavaScript\n\nIn JavaScript language,\
    \ all the user-defined objects as well as the built-in objects extends to an object\
    \ know as Object (similar to the JAVA language).\n\n## The new Operator in JavaScript\n\
    \nThe \"new\" operator is used for the creation of an object instance. In order\
    \ to create an object in JavaScript, the statement has the *new* operator which\
    \ is followed by the constructor method as shown below. Here, the constructor\
    \ methods are \"Object()\", \"Array()\", and \"Date()\". These constructors are\
    \ the built-in JavaScript functions.\n"
  mdcn: "\n\n## 确认对话框 (Confirmation Dialog Box)\n\n在 JavaScript 语言中，当我们需要对任何选项获取用户的意见时，就会确认对话框。它会显示一个包含两个按钮的对话框：OK\
    \ 按钮和取消按钮。\n\n当用户点击 OK 按钮时，窗口方法 `confirm()` 将返回一个 `true` 值。相反，如果用户点击取消按钮，则 `confirm()`\
    \ 方法将返回一个 `false` 值。以下是一个关于确认对话框的示例。\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>Confirm Box</title>\n<script type=\"text/javascript\"\
    >\nfunction showAlert() {\n  confirm(\"This is an confirm dialogue box example!\"\
    );\n}\n</script>\n</head>\n<body>\n<p>Confirm box demo example.</p>\n<input type=\"\
    button\" onclick=\"showAlert();\" value=\"Call JavaScript\">\n</body>\n</html>\n\
    ```\n\n## 输出\n\n当我们执行上述 HTML 程序时，输出将如如下所示。在这里，我们看到了一个确认对话框。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_97_0.png)\n\
    \n## 提示脚本语言（PromptScript），当我们想要弹出一个文本框时，会使用提示对话框\n\n在 JavaScript 中，提示对话框接受用户输入。因此，它允许系统与用户进行交互。用户被要求在字段中输入所需的数据，然后点击\
    \ OK 按钮。\n\n此类对话框通过使用名为 `prompt()` 的方法显示。它接受以下两个参数：\n\n- 我们想要在文本框中显示的标签（label）。\n\
    - 显示在文本框中的默认字符串。\n\n提示对话框有两个两个按钮：\n\n- OK 按钮。\n- 取消按钮。\n\n当用户点击 OK 按钮时，窗口方法 `prompt()`\
    \ 将返回用户在文本框中输入的值。相反，如果用户点击取消按钮，则窗口方法 `prompt()` 将返回一个 `null` 值。\n\n以下是一个关于提示对话框的示例。\n\
    \n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Prompt\
    \ Box</title>\n<script type=\"text/javascript\">\nfunction showAlert() {\n  prompt(\"\
    This is an prompt dialogue box example!\");\n}\n</script>\n</head>\n<body>\n<p>Prompt\
    \ dialogue box demo example.</p>\n<input type=\"button\" onclick=\"showAlert();\"\
    \ value=\"Call JavaScript\"/>\n</body>\n</html>\n```\n\n## 输出\n\n当我们执行上述 HTML\
    \ 程序时，输出将如如下所示。在这里，我们看到了一个提示对话框。\n\nPrompt dialogue box demo example.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_99_0.png)\n\
    \n## 第14 章\n\n## JavaScript void 关键字\n\n在 JavaScript 语言中，`void` 关键字可以用作一元运算符，出现在其单个操作数之前，且该操作数可以是任何类型。这个一元运算符指定了一个需要求值但不返回任何值的表达式。\n\
    \n以下是 `void` 关键字的语法和示例。\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>Void Keyword Example 1</title>\n</head>\n<body>\n<p>Click\
    \ here to invoke an alert!</p>\n<a href=\"javascript:void(alert('Here is the Void\
    \ Keyword demo'))\">Click Here!</a>\n</body>\n</html>\n```\n\n## 输出\n\n当我们执行上述\
    \ HTML 程序时，输出将如如下所示。在这里，我们看到了点击响应式超链接（“Click Here!”）时弹出的警告对话框。另一方面，如果 `void` 参数为空，则第二个超链接（“No\
    \ response link!”）将没有响应，因为表达式 “0\" 在 JavaScript 中没有效果。当 “0\" 被求值时，它不会加载回当前文档中。\n\
    \n![](img/64de8c62f77548c4dca6c5e5001f0a6b_102.png)\n\n此外，JavaScript 中的 `void`\
    \ 关键字也用于生成以下内容：\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>Void Example 2</title>\n<script type=\"text/javascript\">\nfunction\
    \ voidDemo() {\n  var x,y,z;\n  document.write('x = ' + x + ' y = ' + y + ' z\
    \ = ' + z);\n}\n</script>\n</head>\n<body>\n<p>Click to get...</p>\n<input type=\"\
    button\" value=\"Result\" onclick=\"voidDemo()\"/>\n</body>\n</html>\n```\n\n\
    ## 输出\n\n当我们执行上述 HTML 程序时，输出将如如下所示。在这里我们看到对象的值分别为 ‘50’ 和 ‘700’。\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_103.png)\n\
    \n## 第15 章\n\n## JavaScript 对象 (Objects)\n\nJavaScript 语言是一种基于面向对象编程 (OOP) 的语言，提供了以下能力：\n\
    \n- 封装（Encapsulation）——将数据和方法结合的概念。\n- 聚合（Aggregation）——将一个对象存储另一个对象内部的概念。\n-\
    \ 继承（Inheritance）——复用类的概念。\n- 多态（Polymorphism）——以后方式启用相同名称的概念，也称为方法重载。\n\n对象由属性组成。\n\
    \n## JavaScript 对象属性 (Object Properties)\n\nJavaScript 对象属性可以是任何原始数据类型（Number、String\
    \ 和 Boolean），或任何抽象数据类型（如对象）。它们是贯穿页面的变量。以下是语法和示例。\n\n```html\n<!DOCTYPE html>\n\
    <html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Objects Example</title>\n\
    <script type=\"text/javascript\">\nobjectName.objectProperty = propertyValue;\n\
    var str = document.title;\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\
    \n在这里我们将变量 `pValue` 赋值给对象属性 `objectProperty`。该对象名为 `objectName`。在上述示例的下一个语句中，我们使用\
    \ document 的 “title” 属性将标题存储到变量 `str` 中。\n\n## JavaScript 对象方法 (Object Methods)\n\
    \n对象方法是对象进行操作或执行所需的函数。在 JavaScript 中，函数与方法的区别在于：函数是一个独立的语句单元，而方法附加于对象，并通过 `this`\
    \ 关键字引用。\n\n方法可以用于在 HTML 页面上显示对象内容。它们可以对对象属性和传递给方法的输入参数执行复杂的数学运算。例如，在教程中，我们使用了\
    \ document 对象的 “write” 方法，我们将字符串或文本作为参数传递到 HTML 页面上。\n\n```html\n<!DOCTYPE html>\n\
    <html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Object Method Example</title>\n\
    <script type=\"text/javascript\">\ndocument.write(\"Welcome to JavaScript Programming!\"\
    );\n</script>\n</head>\n<body>\n</body>\n</html>\n```\n\n## JavaScript 自定义对象 (User-Defined\
    \ Objects)\n\n在 JavaScript 语言中，所有的自定义对象以及内置对象都扩展自名为 Object 的对象（类似于 Java 语言）。\n\
    \n## JavaScript 中的 new 运算符\n\n`new` 运算符用于创建对象的实例。为了在 JavaScript 中创建对象，语句包含 `new`\
    \ 运算符，后面紧跟着构造方法，如下所示。在这里，构造方法是 `Object()`、“Array()` 和 `Date()`。这些构造函数是内置的 JavaScript\
    \ 函数。\n\n"
