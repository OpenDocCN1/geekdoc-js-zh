  md: 'When we have to do something very important by using the JavaScript, then we
    can show a warning message to the user using the<noscript> tags. We can add a
    noscript block immediately after the script block as shown below.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="ISO-8859-1">

    <title>No Script tag</title>

    </head>

    <body>

    <script type="text/javascript">

    document.write("JavaScript Support is enabled on your browser!");

    </script>

    <noscript>

    nPlease enable JavaScript support on your browser.

    </noscript>

    </body>

    </html>

    ```


    If any of the above browser does not support JavaScript or JavaScript support
    is disabled, then the message between the <noscript></noscript> tags will be shown
    on the screen.'
