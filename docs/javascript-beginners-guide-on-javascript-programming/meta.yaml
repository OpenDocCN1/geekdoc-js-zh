- md: "\nUsually, all JavaScript statements are ended with a semi-colon. These semi-colons\
    \ are optional when each of JavaScript statements are placed on a separate line.\
    \ Using the semi-colons at the end of each JavaScript statement is considered\
    \ as a good programming practice.\n\n## Case Sensitivity\n\nJavaScript language\
    \ is a case sensitive language. It means, the keywords, variables, function names,\
    \ identifiers, etc. should be used with a consistent capitalization of letters.\
    \ E.g. the identifier learn and LEARN are different from the point of view of\
    \ the JavaScript language.\n\n## Comments in JavaScript\n\nThe following are the\
    \ comment styles which are supported in the JavaScript language.\n\n- Single line\
    \ comment is declared as // (double slash).\n- Multiple line comments is declared\
    \ as /* JavaScript Statements on the multiple line */. It works for single line\
    \ comment as well.\n- It also recognized the HTML comment (opening sequence) <!--.\
    \ JavaScript treats this as a single-line comment as it does with the // comment.\n\
    - The closing sequence --> of HTML is not recognized by JavaScript, Therefore,\
    \ it should be written as //->.\n\nThe following is an example that covers various\
    \ JavaScript Comments.\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n  <meta charset=\"\
    ISO-8859-1\">\n  <title>JavaScript Comments</title>\n</head>\n<body>\n  <script\
    \ type=\"text/javascript\">\n  <!-- The opening sequence single line comment.\n\
    \  The closing sequence HTML comment--*/\n\n  // This is a single line comment.\n\
    \n  /*\n  * This is a multiple line comment in JavaScript\n  */\n  </script>\n\
    </body>\n</html>\n```\n\n## Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output (blank) since JavaScript interpreter has ignored\
    \ all the comments.\n\n![](img/64de8c62f77548c4dca6c5e5001f0a6b_19_0.png)\n\n\
    ## JavaScript Syntax\n\nLike any other programming language, JavaScript syntax\
    \ has certain set of rules in which they are constructed.\n\n## Programs in JavaScript\n\
    \nA JavaScript program is a sequence of instructions which are parsed and executed\
    \ by the browser program. These sequence of program instructions are known as\
    \ statements.\n\nJavaScript is an object oriented based programming language.\n\
    \nJavaScript statements are usually separated by semicolons, however placing a\
    \ semicolon at the end statement is optional.\n\n```html\n<!DOCTYPE html>\n<html>\n\
