  md: '# Test Interactions • 73


    design diagram. Let''s pick the locate function next that will help us explore
    a technique we''ve not seen so far in this book—testing interactions.


    The tests we''ve written so far are all empirical tests. You call a method and
    assert that it returned a desired result—synchronously or asynchronously. When
    working with dependencies, it''s hard to predict the results. For example, if
    code depends on a service that returns the current temperature in Chicago, it''s
    hard to write an empirical test for that code. Interaction tests are better for
    code with dependencies.


    A test for a function is focused on that function''s behavior, not the correctness
    of the dependencies. You want to know how the code behaves when its dependency
    succeeds. You also want to know how it handles gracefully the failures of its
    dependency. For these, code really not have access to the real dependency during
    testing. Checking to make sure the code is interacting with the dependency in
    the right way is sufficient to verify the behavior of the code under test.


    # Choose Between Empirical vs. Interaction Tests


    > If the result is deterministic, predictable, and easy to figure out, then use
    empirical tests.

    If code has intricate dependencies and if that makes the code nondeterministic,
    hard to predict, brittle, or slow, then use interaction-tests.


    ![](img/6f7b86a11e592b1c82741d22837e0b38_90_0.png)


    Let''s see why interaction testing is better than empirical testing for the locate
    function. Our program needs to call the getCurrentPosition function of the geolocation
    API. The spiking effort brought to light that this function is an asynchronous
    function that takes to respond. Furthermore, the response depends on where in
    the world we are while running the code and the accuracy of the service that responds
    with the current location. In short, we can''t predict the result we eventually
    get from the getCurrentPosition function. Since we can''t rely on the result,
    there''s no point taking the empirical test route.


    In our desire to modularize we figured that the locate function can call getCurrentPosition
    and register two other functions—onSuccess and onError—as callbacks. Our goal
    is not to verify if getCurrentPosition is returning the correct location—we''re
    not testing after all. Our focus here is to test the behavior of the locate function.
    The responsibility of this function is to call getCurrentPosition and register
    the two callbacks—that''s all we need to test, that interaction of locate with
    getCurrentPosition.


