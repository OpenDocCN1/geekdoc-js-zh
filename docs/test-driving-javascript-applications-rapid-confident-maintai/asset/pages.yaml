  md: '> Each test should us from a delta of working code to the next delta of working
    code with a small additional capability.


    With some practice you will soon find a comfortable test-code rhythm—create a
    good test and write or change the minimum code to make it and other existing tests
    pass.


    Now that you have an idea of the types of tests to write, let''s practice test-driving
    the design of a server-side code.


    # Design Server-Side Code


    To practice the concepts of test-driving the design, we''ll drive the design of
    server-side code that checks if a string is a palindrome. That''s a fairly simple
    problem, keeping it simple will help you ease into test-driven design without
    getting dragged too quickly into complexities. Once you get comfortable with the
    basics, you''ll be prepared to handle gruesome complexities in later chapters.


    JavaScript on the server side has gained prominence in recent years and Node.js
    has become the de facto runtime environment. It''s not only a great platform to
    deploy, but it''s also charming from the testability point of view. Let''s explore
    JavaScript running in Node.js with an example.


    We''ll design a function to check if given input is a palindrome. That''s a simple
    problem that most programmers know how to code right away, but as an exercise,
    let''s create it test first.


    # Start with a Test List


    Before touching the keyboard, scribble on a piece of paper short phrases for some
    positive, negative, and exception tests that come to mind. This test list will
    evolve quite a bit as you begin to write code—new tests will come to while you''re
    in the middle of coding, and this list is a perfect place to quickly jot them
    down.


    Take a few minutes to jot down short phrases for some tests. Don''t to think about
    the tests for too long—avoid any analysis paralysis. The list doesn''t have to
    be perfect. Once we break the inertia and get moving, things will fall into place.'
