    at the start of the test run and seed the database with test data. These steps
    facilitate smooth automation of tests without the need to manually set up and
    clean up between runs.


    The automated tests in this chapter filled the gaps between the tests at the other
    levels of the example application. In the next chapter we will revisit the levels
