  md: "Let's Get Started • 17\n\nThe beforeEach function, if present in a test suite,\
    \ is automatically run by Mocha before each test in that suite is executed. Likewise,\
    \ if we add an after function to perform any cleanup operations, that function\
    \ will be executed after each of the tests in the suite. beforeEach and afterEach\
    \ are sandwich functions—they're executed around each of the tests in the suite.\n\
    \nIn the beforeEach function we assign to the variable an instance of the Util\
    \ class. As an effect of this, each test will get a fresh instance of Util created\
    \ in time before its run.\n\nLet's write the test to verify the aforementioned\
    \ behavior of the f2c function—this will go right below the beforeEach function\
    \ in the test/util_test.js file:\n\n```\nit('should pass if f2c returns 0C for\
    \ 32F', function() {\n  var fahrenheit = 32;\n\n  var celsius = util.f2c(fahrenheit);\n\
    \  expect(celsius).to.equal(0);\n});\n```\n\nWhen compared to the test canary,\
    \ this test has a few lines. In general, tests follow an Arrange-Act-Assert (3-As)\
    \ pattern. It's a good practice to separate the three parts with a blank line\
    \ for clarity. The arrange part sets what's needed for the code test. The act\
    \ part exercises the code under test. The assert part finally verifies that the\
    \ code fulfills the expectations.\n\nEven though there are three parts in each\
    \ test, remember to keep tests really short. If tests run on several lines, it's\
    \ a sign of poor design of the tests and the ensuing code.\n\n# Use the 3-As Pattern\n\
    \n| Except in very simple cases, structure tests to follow the Arrange-Act-Assert\
    \ pattern, with each part clearly separated by a blank line |\n\nIn the test,\
    \ we arranged the fahrenheit variable to have a value of 32. Then we performed\
    \ an action of calling the function under test. Finally, we asserted that the\
    \ result of the action is the expected value.\n\nLet's run the test and let it\
    \ fail—red, green, refactor is a mantra in TDD. We write a failing test; then\
    \ we write the minimum code to make it pass; then we refactor the code to make\
    \ it better.\n\n+   4. http://c2.com/cgi/wiki?ArrangeActAssert\n\n* report erratum\
