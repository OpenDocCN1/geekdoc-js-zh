    # # Design Angular Apps with Tests


    Let''s test-drive an Angular version of the front end for the TO-DO app we created
    in Chapter 6, Test-Drive Express Apps, on page 121.


    Most programmers are new to Angular and it''s hard to write tests for a piece
    of code when the implementation is not clear in our minds. When unsure, you can
    refer back to the spike we just created. It gives you a fairly good idea of the
    shape and structure of any Angular application. Any time you''re not sure about
    what to test next, glance at the spike to think through a possible implementation.


    The client we''ll create will look the same as the previous versions we created
    using jQuery and AngularJS 1.x. The sketch is shown here again for your convenience:


