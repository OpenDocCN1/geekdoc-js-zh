    controller.updateError = function(error, status) {\n  controller.message = error\
    \ + ' (status: ' + status + ')';\n};\n```\n\nThat was short and simple. Let's\
    \ take a look at the test list:\n\n+   * updateTasks updates tasks\n* updateError\
    \ updates message\n* getTasks sorts tasks\n* Call getTasks on document ready\n\
    * ...\n\nWe're done with the functions necessary to talk to the service and update\
    \ the appropriate models. The next item is on the calls for sorting the data.\n\
    \n# Separate Concerns, Reduce Mocking\n\nWe want the list of tasks to appear in\
