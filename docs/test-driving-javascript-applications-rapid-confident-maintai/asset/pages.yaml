  md: "In the non-jQuery version, at the end of the client-side file tasks.js, the\
    \ call\n\n```\nwindow.onload = initpage;\n```\n\nregistered the initpage function\
    \ to the window onload event. This results in the getTasks function running automatically\
    \ when the view is loaded into a browser. In jQuery, you'd use a ready function—which\
    \ is much better—like so:\n\n```\n$(document).ready(jInitpage);\n```\n\nThe jQuery\
    \ version has a few benefits. It can fire the event as soon as the DOM is ready\
    \ while the onload waits for other things like images to complete loading. Also,\
    \ the jQuery version gracefully deals with browser differences and falls back\
    \ to alternate implementations depending on the browser. Overall, ready is much\
    \ better than the raw onload. But how do we test for that? How do we verify that\
    \ the code actually register a handler with the document event?\n\nIn the non-jQuery\
    \ version we simply checked the window's onload property to see if it had been\
    \ set to the handler function—that was perfectly straightforward. jQuery does\
    \ not provide a way to pass the handler to ready—no way to query if the function\
    \ was ever called. Sorry, it seems like that one-line call can't be tested—darn\
    \ it.\n\nThat's not a satisfying answer; you didn't pick this up for us to give\
    \ so easily—that inner voice is saying“there's gotta be a way.” Well, of course,\
    \ but it involves a little trick.\n\nLet's take another quick look at the file\
    \ karma.config.js:\n\n```\ntestdomjquery/todo/karma.conf.js\nframeworks: ['mocha',\
    \ 'chai', 'sinon', 'sinon-chai'],\n// list files / patterns to load in the browser\n\
    files: [\n  `public/javascripts/jquery-2.1.4.js',\n  `./test/client/**/*.js',\n\
    \  `./public/javascripts/**/*.js`\n]\n```\n\nThere's a reason for that sequence—why\
    \ jquery is, the tests are next, and the files being tested come in last. Before\
    \ the files with the source code tested load up, we'll step in and spy the jquery\
    \ ready function—that's wicked...cool.\n\nIn the top of the test file, create\
    \ a spy to the ready function."
