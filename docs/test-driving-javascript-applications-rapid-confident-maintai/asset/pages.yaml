    # Promote Sustainable Agile Development Practices


    Most organizations now have adopted or are in the process of embracing agile development.
    Let''s recall a few principles³ that are behind the Agile Manifesto:


    +   * Welcome changing requirements, even late in development.

    * Provide an environment and the support team needs to succeed.

    * Process should promote sustainable development.

    * Continuous attention to technical excellence and good design enhances agility.


    # Agile Calls for Sustainable Pace


    ![](img/6f7b86a11e592b1c82741d22837e0b38_339_0.png)


    Managers and organizational leaders in charge of agile adoption have the power
    to make or break the ability of their organization, and the teams within, to succeed
    on their software projects. It''s part of their responsibility to manage schedules
    and expectations, and provide an environment for teams to create relevant, maintainable,
    working software at a reasonable, sustainable pace.


    Many organizations put their focus on the short term, the looming deadlines for
    the current release. In the process, they''re not mindful of the technical debt
    that the team incur, often due to the perception or the consequences of the pressures
    and deadlines. This results in short-term gain and a much larger long-term loss—with
    the “penny wise, pound foolish” outcome.


    # Gracefully Deal with Legacy Applications


    In this book we largely focused on a good test-code rhythm—writing a test that
    fails before writing the minimum code to pass it. In reality, projects often deal
    with legacy applications with little or no tests. Issuing an edict that all existing
    code be verified using automated tests is rather detrimental. Writing test for
