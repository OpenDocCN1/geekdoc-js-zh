  md: 'Protractor has special functions for you to gain access to different AngularJS
    directives. While non-AngularJS applications can use and benefit from Protractor,
    projects using AngularJS can gain more from this tool.


    Since Protractor runs within Node.js, you have the full power of a runtime on
    your hands when running the tests. The best way to appreciate the power of the
    tool is to use it. Let''s set it up and move on to writing some tests.


    # # Install Protractor


    We''ll use theusingprotractor workspace under tdja/usingprotractor for this exercise.
    The project has been set up with the Protractor dependency. Change to the workspace
    directory and run npm install to get Protractor installed for this project. Protractor
    is installed along with a webdriver-manager, but you have to update the necessary
    browser drivers. For that, run the command


    ```

    npm run-script update-driver

    ```


    which will execute webdriver-manager update to update the drivers.


    We''ll use the direct connect feature of Protractor to connect with Chrome. That
    also works for Firefox. However, if you''d like to use some other browser, Protractor
    can interact with it through the WebDriver.


    # # Test with Protractor


    In this exercise, to help familiarize with Protractor, we''ll write tests to verify
    the Google search page is functioning well.


    We''ll write the following tests:


    +   * Verify that http://www.google.co.uk has the “I''m Feeling Lucky” button

    * Submit a search for a text and confirm the result has expected value


    Protractor can either take command-line arguments for various parameters or read
    from a configuration file. It''s easier to use the configuration file; then you
    don''t have to mess around with command-line arguments each time to run the tool.
    When starting Protractor, you may specify a configuration file name. If you don''t
    give one, it looks for a file named protractor.conf.js. The workspace already
    contains this file with the necessary configuration for your convenience. Let''s
    take a minute to examine this file and understand its contents:'
