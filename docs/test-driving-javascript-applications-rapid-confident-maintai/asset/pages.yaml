  md: "Chapter 2. Test-Drive Your Design • 20\n\nWe introduced a parameter to the\
    \ function and modified the body of the function as well. After saving this change,\
    \ run the test and verify that it passes.\n\nThat test prompted us to move from\
    \ the fake implementation to the real formula. That also raises a few question.\
    \ Does the function work properly for negative temperatures? The results that\
