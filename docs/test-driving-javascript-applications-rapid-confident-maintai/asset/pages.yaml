    \ returns text if not json()', function() {\n  var fakeBody = 'somebody';\n  var\
    \ response = {status: 200, text: function() { return fakeBody; };\n  expect(tasksService.extractData(response)).to.be.eq(fakeBody);\n\
    });\n```\n\nThe response object passed to the extractData function in this test\
    \ does not have a json() function. Instead it has a text() function. The previous\
    \ test for extractData had the json() function. We will modify the extractData\
