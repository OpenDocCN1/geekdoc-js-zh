    # ## Test with jQuery


    We have a working client for the TO-DO application. But the client-side code we
    wrote is manipulating the DOM and accessing the web service directly using the
    functions available in browsers. Manipulating the DOM with the built-in functions
    can get tiring and the code can turn noisy. The jQuery library provides a number
    of convenience functions to select DOM elements, navigate the DOM, and update
    the DOM. Code using jQuery is far less noisy than code that directly interacts
    with the DOM. That''s one of the reasons for the popularity of this library. It''s
    likely that you may prefer to use jQuery to program the client side. To get a
    good feel for how to automate the tests for code that use jQuery, we''ll reimplement
    the client-side code, with tests, using jQuery.


    Instead of walking through each step-by-step, we will discuss the main differences
    between testing code that uses jQuery and the code that directly interacts with
    the DOM. After going through the differences, you may want to reimplement the
    client-side code, with the tests, using jQuery. When done, you can compare your
    solution to the one given in this book.


    # ## Get Ready to Test with jQuery


    We need to verify that a few things are in place before we write the test. First,
    we need the jQuery library. The uncompressed development version of the library
    file has already been downloaded² to the directory todo/public/javascript


    +   - https://jquery.com/download'
