  md: '# Chapter 1. Automation Shall Set You Free • 6


    We''ll follow spirit in this book, to write tests at the right levels—more unit
    tests, then functional tests, and a few end-to-end UI-level.


    # Automated Verification Is Not Optional


    > Developing any nontrivial application without automated tests at the right level
    is an economic disaster.


    If automation at the right level is critical, then why not more developers do
    it? Let''s discuss some reasons now.


    # Why Is It Hard to Verify?


    It''s easier to say the code should be testable than to actually make it testable.
    Programmers often find it really hard to automate the test because of one or both
    of the following:


    +   - The code is poorly designed.

    - The programmer has no clue how the code works.


    Those words may seem harsh, but they''re not intended to offend anyone. Instead,
    my hope is for you to understand the core reasons and find ways to remove the
    impediments.


    It''s incredibly hard to write automated tests on legacy code. Legacy code often
    is not modular, lacks cohesion, and has high coupling—telltale signs of poor design.
    Even though we have the best intentions, writing tests after the fact rarely seems
    to work.


    For code to be testable, it has to be highly cohesive and loosely coupled. If
    the code does a lot of things—that is, it has low cohesion—it would need a lot
    more tests, to the extent it would be impossible to write. Also, if the code is
    directly wired to a service—that is, it has tight coupling—is tough to write deterministic
    automated tests. Automated testability is a design issue_.


    Furthermore, if we don''t have a clue of how a piece of code works, it''s hard
    to write automated tests for it. We start with tutorials that show how to use
    a library or a framework. We quickly get some code up and running, but we may
    not have the time to really understand how different parts come together. While
    it''s easy to write more code to produce results, programmers are often baffled
    when asked to write automated tests for that code. The lack of knowledge, especially
    one level below the level of abstraction they depend on, is often the culprit.


    report erratum • discuss'
