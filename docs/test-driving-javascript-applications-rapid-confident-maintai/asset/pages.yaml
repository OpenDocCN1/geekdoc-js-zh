    # Continue the Design


    The initial test list identified one task for adding a task and one for deleting
    a task.


    +   • addTask sends the data to the service

    • deleteTask sends a delete request to the service


    Let''s now focus on the addTask function.


    # Design addTask


    When we analyzed the getTasks function, a single test for that function transformed
    into multiple tests in the test list. We can expect a similar result for the addTask
    function as well. Let''s analyze the addTask function.


    First, we need the data for the new task. A new model newTask within the controller
    can store this data. We need to initialize this model to have a name property
    and a data property. We also need to convert the newTask to the JSON format exported
    by the server.


    addTask should call the service, register a callback—let''s call it updateMessage—to
    handle the response, and register updateError to handle any errors. The updateMessage
    can display the message received. Also, after the response arrives, the task list
    has to be refreshed to catch the change. For this, updateMessage can reuse the
    getTasks function we have already.


    In addition, we should disable the create button if the user-entered task is not
    valid. However, we already have a function, validateTask, to validate a task.
    The function to disable the list can simply reuse that function.


    Let''s jot those ideas in the test list:


    +   • addTask sends the data to the service

    • Verify newTask has empty name and date on create

    • Convert newTask with no data to JSON format'
