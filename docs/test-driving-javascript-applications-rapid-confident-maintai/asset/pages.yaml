  md: '# Create the Test List


    Looking at the sketch and based on our previous efforts to create the different
    versions of the front end for the TO-DO app, we have a fairly good idea of things
    that we need to create for the Angular front end.


    Let''s jot down some of the tests that come to mind; we can refine these later
    as we proceed. Let''s focus on the component-related tests first for the feature
    that lists the tasks.


    +   * The component should set the selector attribute

    * The component should set the templateUrl attribute

    * The constructor should initialize tasks to an empty array

    * The constructor should initialize message to an empty string

    * getTasks should register handlers for service

    * updateTasks should update tasks

    * updateError should update message

    * Tasks displayed should be in sorted order

    * getTasks should be called on init


    These tests are just for designing the component. We can look at the service and
    the rest of the details after we get through this pile. Let''s get started with
    the component design.


    # Test-Drive the Component


    The component glues together the view and the model that holds data obtained from
    the service. As a first step, we need to get a few necessary annotation attributes
    created in the component. The first two tests we have listed exactly there. Let''s
    start with the first test.


    # Verify That Component Attributes Are Set


    To define the component we will use the ng.core.Component function call and set
    the annotation property selector in it. If it''s not clear how this will look
    for our new component, take a quick look at the LangComponent in the spike.


    Writing the component is easy. We have seen an example of that already in the
    spike. The hard question is, how do we test for it? In other words, we want to
    write a failing test before we write the selector attribute.'
