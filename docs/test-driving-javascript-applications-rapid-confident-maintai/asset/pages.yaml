  md: "# Write the First Test\n\nOpen the pre-created empty test file/client/tasks-controller-test.js.\
    \ Write a canary test to verify that Karma is able to load all the necessary files,\
    \ including angular-mocks.js:\n\n```\nangularjs/do/test/client/tasks-controller-test.jsndescribe('tasks\
    \ controller tests', function() {\n  // write canary test only if this is the\
    \ first test\n  // for the front-end in this project\n  it('should pass this canary\
    \ test', function() {\n    expect(true).to.be.true;\n  });\n});\n```\n\nTo run\
    \ the test and confirm all is well, execute the following command:\n\npm run-script\
    \ test-client\n\nThis will instruct Karma to load up all the necessary files and\
    \ execute the tests it finds under the test/client directory.\n\nThe canary test\
    \ should pass. Let's turn our attention to writing tests for listing tasks.\n\n\
    # Design the Controller\n\nThe initial list we jutted down five tests. The first\
    \ three relate to getting the task list from the service and displaying it on\
    \ the view. Let's analyze the first test, 'getTasks should populate the tasks\
    \ model with data from the service,' in the context of AngularJS.\n\nIn the controller,\
    \ create a model, say tasks, which is a array of JSON objects that will hold the\
    \ list of tasks that comes from the back end. On start, while we wait for data\
    \ from the service, we initialize our tasks. The getTasks function should focus\
    \ on a single responsibility and not take on things that can be delegated to other\
    \ functions—modular. As a good design, getTasks will only call the service and\
    \ register handlers for success and error cases. Let's call these handlers updateTasks\
    \ and updateError.\n\nThe first function, when called after a response, should\
    \ update the tasks model. The second function should update a message model with\
    \ error details. We better initialize this model with an empty string in the beginning.\
    \ That's a lot of detail already; we can think about other actions like sorting\
    \ later. Let's update the test list with these fine-grained details."
