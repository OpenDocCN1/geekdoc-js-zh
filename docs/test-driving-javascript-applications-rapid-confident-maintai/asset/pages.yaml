  md: '# Avoid Features That Make Testing Hard


    > > Avoid using features of libraries or frameworks that make testing hard. Find
    alternative ways that favor automated verification.


    The controller is a better place for sorting. Also, testing the behavior of sort
    at this level is easier and faster as well.


    In the controller, getTasks is responsible for getting the data from the back
    end. We could change getTasks to perform a sort on the list that''s received,
    but that would lead to a few problems. First, getTasks is cohesive and focused
    on a single responsibility right now. We don''t want to affect that good design.
    Second, adding more responsibility on this function would require more tests on
    it. More tests on getTasks will require more mocking, but it''s better to minimize
    the use of mocks and use them only when unavoidable. All issues tell us that we
    need to separate the concern of sorting away from getTasks.


    getTasks is nicely dealing the response handling: a good place for sorting may
    be within the handler updateTasks. Let''s think of the testing effort again. If
    updateTasks took that responsibility, then each test to verify the sort operation
    would have to pass a list and then verify if controller.tasks is set to correctly
    sorted data. That''s not as bad as having to write tests to verify the sorting
    on tasks, but we can do a bit better by separating the concern.


    We could create a separate function sortTasks, which would take a list of tasks
    and return a sorted list. Since the sorting is based on various precedes, we would
    have to write a few tests on sortTasks that should be straightforward. Finally
    we would need just one test to ensure that the sortTasks function is called at
    the right place.


    # Combine Empirical and Interaction Tests


    Let''s add the design idea that just emerged to the test list.


    +   * getTasks sorts-tasks

    * sortTasks sorts based on year

    * sortTasks sorts on year, then month

    * sortTasks sorts on year, month, then day

    * sortTasks sorts on month, month, day, then name

    * updateTasks calls sortTasks'
