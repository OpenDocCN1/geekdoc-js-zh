  md: "We have one more function, fairly critical, on our hands for the loading of\
    \ tasks feature. Let's take care of that next.\n\n# Call the Service\n\nTasks\
    \ has a fairly specific expectation on the interface and behavior of the callService\
    \ function—it should take two parameters: the first includes the method and the\
    \ URL, whereas the second specifies the callback. The function should invoke the\
    \ back-end service using the method and the URL given. Let's write a test to verify\
    \ that small step.\n\nBut, before we, let's think through the workflow for callService.\
    \ The function will create an XMLHttpRequest object, set the method and the URL\
    \ using the object, and finally call the send function—that’s the normal Ajax\
    \ sequence when using XMLHttpRequest. We don't have the back-end server running\
    \ at this time and we certainly don't want to start now. Making calls to the actual\
    \ service during runs will make the tests nondeterministic and brittle. We need\
    \ to mock the XMLHttpRequest for testing purposes.\n\n# Verify the Client in Isolation\n\
    \n> Running automated tests for the client-side code should not require the server\
    \ to be up and running. The needing will make the tests brittle, nondeterministic,\
    \ and hard to run.\n\nSinon has a powerful way to mock out XMLHttpRequest in place—FakeXMLHttpRequest.\
    \ We'll make use of this facility here. Let's change the beforeEach and afterEach\
    \ functions to bring in the XMLHttpRequest mocking facility:\n\n```\ntestdomjquery/todo/test/client/tasks-test.js\n\
    //...\nvar xhr;\nbeforeEach(function() {\n  sinon = sinon.useFakeXMLHttpRequest();\n\
    \  xhr.requests = [];\n  xhr.onCreate = function(req) { xhr.requests.push(req);\
    \ }\n});\nafterEach(function() {\n  sandbox.restore();\n  xhr.restore();\n});\n\
    ```\n\nIn beforeEach we called sinon.useFakeXMLHttpRequest—don't call this function\
    \ on sandbox, which doesn't actually mock XMLHttpRequest—and instructed the onCreate\
    \ function to gather the requests received into a local array. Any reference to"
  merge: -1
  pgno: 186
- img_proc: true
  md: "XMLHttpRequest in code now will use this constructor function referenced by\
    \ xhr instead of the original.afterEach restores the original XMLHttpRequest at\
    \ the end, which in effect removes the interception by the mock.\n\nNow, let's\
    \ write the test to verify that callService makes a request to the service and\
    \ sets the method and URL as expected.\n\n```\ntestdomquery/todo/test/client/tasks-test.js\n\
    it('callService should make call to service', function() {\n  callService({method:\
    \ 'GET', url: '/tasks'}, sandbox.spy());\n  expect(xhr.requests[0].method).to.be('GET');\n\
    \  expect(xhr.requests[0].url).to.be('/tasks');\n  expect(xhr.requests[0].sendFlag).to.be.true;\n\
    });\n```\n\nThe test calls callService and sets the xhr.request, array we populated\
    \ in the onCreate function, for the expected values of method and url. In the\
    \ code, these values will be set upon call, but the actual request should be a\
    \ call to—this is verified with a check for sendFlag to be true. Now, we implement\
    \ the callService function, with enough code to make this test pass:\n\n```\n\
    testdomquery/todo/public/javascripts/src/tasks.js\nvar callService = function(options,\
    \ callback) {\n  var xhr = new XMLHttpRequest();\n  xhr.open(options.method, options.url);\n\
    \  xhr.send();\n}\n```\n\nThis code is near complete, but we won't write more\
    \ than the current tests demand. Once Karma reports the testing is, move on to\
    \ the next test: when callService receives a response from the server, it should\
    \ send the status and response to its callback. Here's a test to verify that:\n\
    \n```\ntestdomquery/todo/test/tasks-test.js\nit('callService should send xhr status\
    \ code to callback', function() {\n  var callback = sandbox.mock().withArgs(200).atLeast(1);\n\
    \n  callService({method: 'GET', url: '/tasks'}, callback);\n  xhr.requests[0].respond(200);\n\
    \  callback.verify();\n});\n```\n\nThe callback mock passed to callService verifies\
    \ that callService sends it a proper status code. The call function, however,\
    \ will simply pass through the status code it returns from the web service. During\
    \ the test, we're not talking to the back end. Sinon solves this elegantly—you\
    \ can instruct the mock to send a responsive mock which like a real web service\
    \ would. That's the purpose of the call to respond in the test."
  merge: -1
