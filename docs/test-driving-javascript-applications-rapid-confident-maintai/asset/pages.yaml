  md: 'Code that uses promises may form a chain of and catch calls. Either the top
    path or the bottom path in the chain is taken, depending on whether a promise
    is resolved or rejected. If the Promise is resolved, then the resolved part of
    the function will transform the rejected value and pass it on, as a Promise, to
    the next receiver in the chain. On the other hand, if the Promise is rejected,
    a series of catch functions transform the rejected reason through the call chain.
    This chain may also optionally include the rejected part of the then function.


    # Types of Asynchronous Tests for Promises


    Let''s turn our attention to testing functions that return promises. Even though
    a function returns a Promise, the intended task of the function may not have completed
    yet—well, it is asynchronous. A test on that function will have to wait for the
    promise to be resolved or rejected.


    Some tools like Mocha provide special capabilities for testing functions that
    return promises. Mocha''s asynchronous tests come in two flavors:


    +   1. The tests may take a done parameter, which can be used to signal test completion.

    2. The tests themselves may return a Promise to signal the eventual test completion.


    The first flavor may be used for functions with callbacks and functions with promises.
    The second option, obviously, is intended for functions with promises.


    > We are focused on testing functions with promises. Any JavaScript testing tool
    can be used to test such functions. However, some tools also provide the capability
    to return promises from tests.


    Let''s explore, with an example, the different ways to write tests for promises
    and discuss the pros and cons of each.


    # A Promise Returning Function


    We''ll practice testing with promises using a modified version of the linesCount
    we saw earlier. Let''s switch to a new promises project by changing to the tdsa/async/promises
    directory in your workspace. In this project, we will use the familiar Mocha and
    Chai along with a new package, chai-as-promise, which we''ll discuss shortly.
    Let''s take a minute to install these packages by running the npm install command.'
