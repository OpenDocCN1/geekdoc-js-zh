  md: "It also needs to gracefully deal with errors. We'll split these actions into\
    \ a few modular functions.\n\nFirst, let's write a function that sends out an\
    \ HTTP GET request. Let's add a get function to the service class. Define this\
    \ function using a properly named get. Place this right after the ending of the\
    \ definition of the constructor property in src/app/langs/langs.service.js:\n\n\
    ```\nangularspike/src/app/langs/langs.service.js\nget: function({\n  return this.http.get('/languages')\n\
    \    .map(this.extractData)\n    .catch(this.returnError);\n});\n```\n\nThe function\
    \ uses the new Angular HTTP module. This module's HTTP-related functions like\
    \ get, post, and delete return an RxObservable from the RxJS reactive extensions\
    \ library. An Observable is like a collection, except rather than a bounded list,\
    \ it is an asynchronous stream of data flowing from the service to a subscriber.\n\
    \nThe map function is quite useful to transform the Observable<Response> to Observable<Data>,\
    \ where Data is whatever data we would like to return. It would be the content\
    \ from the response, either as JSON data or a plain text. Instead of dealing with\
    \ that detail here, we will delegate responsibility to a separate extractData\
    \ function. If something goes wrong, the catch function will transform the error\
    \ details into an Observable object. We will design it so that the catch function\
    \ delegates responsibility to a returnError function.\n\nThe get function returns\
    \ an instance of RxObservable to the caller. The caller may subscribe to it and\
    \ asynchronously receive the data sent by the back end or error details if the\
    \ request fails.\n\nLet's implement the extractData function: place this right\
    \ below the function in the service:\n\n```\nangularspike/src/app/langs/langs.service.js\n\
    extractData:function(response) {\n  if(response.status === 200)\n    throw new\
    \ Error(\"error getting data, \" + response.status);\n  return response.text();\n\
    };\n```\n\nIf the response has a status code other than 200, then the function\
    \ throws an exception. Since this function is called from the map function in\
    \ the Observable call chain, the RxJS library will catch the exception and automatically"
  merge: -1
  pgno: 249
- img_proc: true
  md: "route the error details to the failure handler of the subscriber. We'll discuss\
    \ this further when we write the component where we'll subscribe to the Observable\
    \ returned by the get function. If the status code is 200, then the function extracts\
    \ and returns the body of the response, using the text() function.\n\nNext, let's\
    \ write the returnError function:\n\n```\nangularspike/src/app/langs/langs.service.js\n\
    returnError: function(error) {\n  return Rx.Observable.throw(\n    error.message\
    \ || \"error, status: \" + error.status);\n}\n```\n\nThis function will be called\
    \ if something goes wrong with the HTTP request. In this function we invoke the\
    \ throw function of Observable so that the error details will be propagated through\
    \ the chain, asynchronously, through the Observable call subscriber.\n\nWe've\
    \ completed the implementation of the service class. Let's step back and take\
    \ a look at the complete code for the service:\n\n```\nangularspike/src/app/langs/langs.service.js\n\
    (function (app) {\n  app.LangService = ng.core;\n  .Class({\n    constructor:\
    \ [ng.Http.Http, function(_http) {\n      this.http = _http;\n    }],n\n    get:\
    \ function() {\n      return this.http.get('/languages')\n        .map(this.extractData)\n\
    \        .catch(this.returnError);\n    },\n\n    extractData:function(response)\
    \ {\n      if(response.status != 200) {\n        throw new Error(\"error getting\
    \ data, status: \" + response.status);\n      return response.text();\n    },\n\
    \n    returnError: function(error) {\n      return Rx.Observable.throw(\n    \
    \    error.message || \"error, status: \" + error.status);\n    }\n  });\n})(window.app\
    \ || (window.app = {}));\n```\n\nWe have the pipe and the service in place. We\
