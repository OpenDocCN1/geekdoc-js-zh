  md: "During normal execution AngularJS does all the wiring when it sees the declarations\
    \ for the dependencies. As you know, bringing in those real dependencies into\
    \ the controllers and services during testing will make automated verification\
    \ hard. AngularJS elegantly solves this issue using angular-mocks, a powerful\
    \ library that works in parallel with the AngularJS dependency injection mechanism.\
    \ This library provides factory functions to create doubles and inject those objects\
    \ in place of real dependencies. Thus, during test runs, instead of relying on\
    \ the auto wiring that AngularJS provides, we will explicitly specify what dependency\
    \ we want to pass to the code under.\n\nLet's get a feel for how the tests will\
    \ perform explicit dependency injection. The declarative forms in HTML, such as\n\
    \n```\n<html ng-app=\"sample\">\n...\n<div ng-controller=\"SampleController as\
    \ controller\">\n```\n\n```\nwill turn into an injection request in the test suite,\
    \ like so:\nnbeforeEach(module('sample'));\nbeforeEach(inject(function($controller)\
    \ {\n  controller = $controller('SampleController');\n}));\n```\n\nA call to module('sample')\
    \ during the test run is the event of the declaration ng-app='sample' during normal\
    \ execution. Likewise, the call to inject returns an injector that is passed to\
    \ the beforeEach setup function. The injector then provides a controller factory\
    \ function that can be used to instantiate a controller instance. This controller\
    \ instance can then be used in each test.\n\nThat approach will take care of directives\
    \ on the HTML page, but what about the dependencies in the controllers, a call\
    \ to web services? angular-mocks is the answer. By including this library, we\
    \ can automatically replace the normal runtime environment with mocks. For example,\
    \ we can make an Ajax call to a service. In short, AngularJS and angular-mocks\
    \ provide an elegant way to test. Let's explore this further by building an AngularJS\
    \ front for the TO-DO application.\n\n# Start with an Initial Design\n\nWe sketched\
    \ a design for the UI in the previous chapter, shown in the figure on page 199\
    \ again for your convenience. We'll implement the same look and feel for the AngularJS\
    \ version as well."
