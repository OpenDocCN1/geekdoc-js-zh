    # The Fruits of Our Efforts


    Code is written once but changed several times over the lifetime of any nontrivial
    application. The membership package, in popular video-on-demand system, went into
    production last year. But the company now wants the package to manage multi-month
    subscriptions and automated renewals. That royalty payment package at the record
    company needs upgrading to integrate with a new third-party electronic payment
    system. That tax filing software better handle correctly the last-minute changes
    to the tax laws. The list goes on.


    Relevant and useful applications change constantly. That’s one reason “Embrace
    Change” is a key principle behind eExtreme Programming (XP). That’s also the reason
    “Responding to Change” is a core value in the Agile Manifesto.\¹


    Sadly, a lot of applications are hard to change. The telltale reasons, the cor-responding
    design smells, and the consequences that we often see:


