  md: '![](img/6f7b86a11e592b1c82741d22837e0b38_214_0.png)


    In addition, the task list in this version will appear in sorted order of the
    properties year, month, day, and name.


    The HTML page will link to a tasks-controller.js file that will contain the AngularJS
    controller. This controller will contain the code for client-side computing and
    will interact with a service class in tasks-service.js file. The service will
    act as a glue between the viewer in the browser and the data from the server.
    The HTML file will also declare an instance of the controller and refer to a couple
    of models.


    We''ll use two models: tasks to hold the transient state of the tasks fetched
    from the server and newTask to temporarily hold a task created by the user on
    the front end. To list tasks we''ll use an ng-repeat directive to loop through
    each item in the collection. To handle a button click by the user, we''ll use
    the ng-click directive.


    We need three functions in the controller. getTasks will fetch the tasks through
    the service and sort it in the desired order. addTask will post a new task through
    the service. deleteTask will request the service to remove a task with a given
    id from the server.


    We don''t need the HTML file at this time. We are going to design the code using
    tests, and then we''ll take it for a drive with the help of an HTML file. Let''s
    get started with tests.


    Let''s think through some initial tests for the front end. We don''t have to be
    perfect or complete—jot down what comes to mind. Here''s an initial test list:


    +   - getTasks should populate the tasks model with data from the service

    - getTasks sorts tasks

    - call getTasks on document ready

    - addTask sends the data to the service

    - deleteTask sends a delete request to the service'
