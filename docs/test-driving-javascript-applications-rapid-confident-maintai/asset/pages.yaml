  md: '# Joe asks:

    When We Should Use Sinon Test Double vs. a Handmade Test Double?


    Later in this book, you''ll see examples that use Sinon to create test doubles,
    but a few examples will simply use handmade test doubles. Here are some guidelines
    for when to choose Sinon:


    +   * When creating a test double by hand becomes arduous

    * When the design and code structure seems to turn overly complex to the use of
    a test double

    * Where using Sinon may reduce the test size


    In short, use Sinon when it brings true value. Don''t hesitate to write your own
    test doubles for simple cases.


    test doubles. In addition, the Sinon-Chai module makes the already fluent Chai
    library more expressive to verify calls on test doubles.


    To use Sinon, we need four packages: sinon, sinon-chai karma-sinon, and karma-sinon.
    When you did npm install, these packages were already installed since the package.json
    in the project you''re working with included in the devdependencies section.


    In addition to installing these packages, we need to tell Karma to make use of
    them. Once again, the karma.conf.js file in the current project has been set up
    with the necessary change. Open the karma.conf.js file and notice the following
    frameworks: [''mocha'', ''chai'', ''sinon'', ''sinon-chai''],


    # Dip Into Sinon


    Sinon makes creating test doubles concise and fluent. Also, if we choose to replace
    any of the existing functions with test doubles, Sinon sandbox stream-lines the
    process of restoring the original functions.


    With a series of code exerpts, let''s quickly get a grasp of creating test doubles
    in Sinon.


    While test doubles can directly be created using the sinon object, it''s much
    better to use the sandbox gives us the peace of mind that any changes to existing
    objects are restored—it''s a great way to guarantee that tests don''t affect other
    tests, that they stay isolated.'
