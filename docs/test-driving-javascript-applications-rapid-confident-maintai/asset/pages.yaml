    \ on to the tests for the add function.\n\n# ### Address the add Function\n\n\
    Unlike the prior functions, the add function will rely on user-entered data. When\
    \ user input is involved, we need more error checking. The add function should\
    \ take a task and add it to the database if valid. Otherwise, it should return\
    \ an error. Since a task has multiple parameters, multiple things could go wrong.\
    \ We need to check that each of the parameters is valid, but there's a catch.\n\
    \nWhere possible, it would be better to perform the checks on the client side.\
    \ This will be faster and require fewer round-trips to the server. However, a\
    \ check is still needed on the server side; it's possible that the data is sent\
    \ to the server, bypassing the client-side checks. But duplicating code is an\
    \ act of criminal negligence. We need to share the validation code between the\
    \ two sides to honor good design.\n\n# ### Keep Data Validation Code DRY\n\n>\
    \ Avoid duplicating any validation code between the client side and the server\
    \ side. Duplication increases the cost of maintaining code and fixing errors.\n\
    \nHere's how we'll approach the validation. If a check can be performed only on\
    \ the server side, we'll do it right within the add function. If a check may be\
    \ performed on either sides, then we'll do it in a validateTask function, which\
    \ will be common and shared by both sides. We'll focus on the validateTask function\
    \ after we complete the tests for the model functions. For now, all we need to\
    \ verify that add calls validateTask properly."
