    To implement this UI using Angular, we will need a component, a service, a pipe,
    bootstrap code, and two HTML files. We''ll test-drive the design of all the classes
    and functions for this application.


    We will build the application in increments. First, we''ll test-drive the feature
    to get the list of tasks. Once that''s complete, we''ll then take on the feature
    to add a new task. Finally, we''ll work on deleting a task.'
