    \  });\n});\n\nrouter = require('../../routes/tasks');\n});\n\nafterEach(function()\
    \ {\n  sandbox.restore();\n});\n}\n```\n\nThe beforeEach function replaces the\
    \ Router function of express with a stub that returns a JSON object with three\
    \ properties: get, post, and delete. Each of these three properties, in turn,\
    \ returns to a spy function—an empty function that will simply record the parameters\
