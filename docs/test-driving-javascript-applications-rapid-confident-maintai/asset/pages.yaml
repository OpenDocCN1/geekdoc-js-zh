  md: '# Test-Drive Your Design


    It''s incredibly hard to write effective tests after coding is done—the code often
    is not in a form for tests to easily fall in place after the fact. It''s better
    to start early with tests.


    Writing tests before creating a piece of code naturally makes the code testable.
    Good tests shape the code, making it modular, more cohesive, and loosely coupled.
    This, in turn, can make the design lightweight, easier to change, and less expensive
    to maintain. In addition, the quick feedback we get from the tests improves our
    confidence that things will continue to work when we change the code.


    But creating tests before writing a piece of code can also be challenging.


    In this chapter you will learn how to write tests just-in-time and influence the
    design of code using these tests. You will see how the first tests nudge us to
    focus on the interface of a function while the remaining tests lead us through
    the guts of the function.


    You''ll create tests for both server-side and client-side JavaScript. For the
    server side we will run the code within Node.js. The client-side code will run
    within different browsers. Regardless of where the code runs, we will write automated
    tests for it. You can exercise these tests quickly to get feedback that the code
    is working as expected, through each step of the design of the code.


    In addition to the techniques to write the tests, you will learn to use a few
    tools: Karma, Mocha, Chai, and Istanbul. By the end of this chapter you will be
    ready to apply the techniques and tools to create better-quality design that will
    make change easier and less expensive.'
