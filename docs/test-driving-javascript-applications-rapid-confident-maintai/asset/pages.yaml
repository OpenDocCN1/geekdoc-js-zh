- img_proc: true
  md: "In addition to the previous change, instead of merely calling verify on the\
    \ mock, we use atLeast(1); this is because the event handler may be called multiple\
    \ times during an XOR processing cycle. We'll write a test soon to limit the number\
    \ of times the handler is called, but at this time multiple calls should be permissible.\n\
    \nLet's change the callService function to satisfy this test, like this:\n\n```\n\
    testdomquery/to/public/javascripts/src/tasks.js\nvar callService = function(options,\
    \ callback) {\n  var xhr = new XMLHttpRequest();\n  xhr.open(options.method, options.url);\n\
    \n  xhr.onreadystatechange = function() {\n    callback(xhr.status);\n  }\n\n\
    \  xhr.send();\n}\n```\n\nWe know that callService sends back status, but we also\
    \ need the response. Here's a test to verify that:\n\n```\ntestdomquery/to/test/client/tasks-test.js\n\
    it('callService should respond to callback', function() {\n  var callback = sandbox.mock().withArgs(200,\
    \ '..res..').atLeast(1);\n  callService({method: 'GET', url: '/tasks'}, callback);\n\
    \  xhr.requests[0].respond(200, {}, '..res..');\n  callback.verify();\n});\n```\n\
    \nThis test will result in a very small change to the code:\n\n```\ntestdomquery/to/public/javascripts/src/tasks.js\n\
    var callService = function(options, callback) {\n  var xhr = new XMLHttpRequest();\n\
    \  xhr.open(options.method, options.url);\n\n  xhr.onreadystatechange = function()\
    \ {\n    callback(xhr.status, xhr.response);\n  }\n\n  xhr.send();\n}\n```\n\n\
    Both the previous tests checked for status code 200. But what if something went\
    \ wrong—say, if the status was 404? Let's write a test to verify the code handles\
    \ error situations properly as well."
