  md: "That’s one simple interaction test. It verifies that the controller’s getTasks\
    \ calls the service’s get function with the proper callback. Before we can run\
    \ this test, we need to take a few steps. First, we need to create the mock for\
    \ the service. Second, we need to somehow connect the service to the controller.\
    \ Third, and finally, we have to implement the getTasks function.\n\nLet’s take\
    \ care of the first step and part of the second step, here in the test. Modify\
    \ the setup code we wrote earlier in the test file tasks-controller-test.js as\
    \ follows:\n\n```\nvar controller;\nvar tasksServiceMock;\nbeforeEach(module('todoapp'));\n\
    beforeEach(inject(function($controller) {\n  tasksServiceMock = {};\n  controller\
    \ = $controller('TasksController', {\n    TasksService: tasksServiceMock\n  }));}));\n\
    ```\n\nWe introduced a new variable tasksServiceMock and initialized it to an\
    \ empty JSON object. Then, in the second beforeEach we modified the call to the\
    \ factory function that created the controller. We’re now passing the mock as\
    \ a reference TasksService to the factory function. Let’s understand how this\
    \ is going to help.\n\nWhen AngularJS bootstraps, we will need the necessary dependencies\
    \ between various components—controllers, services, directives, etc. Since we’re\
    \ in the test mode, we need to add this just a bit. In the setup part, within\
    \ beforeEach we tell AngularJS to wire the mock service as the service that the\
    \ controller will use.\n\nWe need to modify the controller code so it can expect\
    \ and accept a service. Let’s change the bottom of the tasks-controller.js file\
    \ as follows:\n\n```\nangular.module('todoapp')\n  .controller('TasksController',\
    \ ['TasksService', TasksController]);\n```\n\nWe tell AngularJS to wire a TasksService\
    \ into the controller during its creation. We also need to change the controller’s\
    \ constructor function to now accept the service:\n\n```\nvar TasksController\
    \ = function(tasksService) {\n```"
