  md: "we're running tests on a third-party site in this example, we've placed the\
    \ configuration file in the workspace's top-level directory usingprotractor.\n\
    \nIt's for time to roll out our UI-level test. Let's prepare the test file and\
    \ make a GET request.\n\n# Prepare for UI-Level Tests\n\nWe'll place the tests\
    \ cuja in the file test/integration/google-search-test.js under the current workspace\
    \ tdjs/usingprotractor. Let's open this pre-created file and add the setup code\
    \ for the test suite:\n\n```\nusingprotractor/test/integration/google-search-test.js\n\
    var expect = require('chai'), expect;\nrequire('chai').use(require('chai-as-promised'));\n\
    describe('Google search page tests', function() {\n  beforeEach(function() {\n\
    \    browser.ignoreSynchronization = true;\n    browser.get('/');\n  });\n  afterEach(function()\
    \ {\n    browser.ignoreSynchronization = false;\n  });\n});\n```\n\nProtractor's\
    \ functions constantly have to evaluate the DOM, send request to services, and\
    \ analyze results from web services. This will take some time, certainly more\
    \ than fractions of a second. In JavaScript, any function that takes time is designed\
    \ to be asynchronous. So, it's no surprise that most of the functions in Protractor\
    \ are asynchronous—return promises.\n\nWhen writing Protractor tests, make use\
    \ of the asynchronous testing techniques we learned earlier in the book. In the\
    \ test file, once Chai is loaded, convenience functions from chai-as-promised\
    \ are also loaded using the use function.\n\nIn the test suite, the beforeEach\
    \ function accesses a global browser object. Much like how browsers provide a\
    \ global object, Protractor provides a few globals: browser, element, by and so\
    \ on. The availability of these globals make Protractor tests quite concise. The\
    \ first line beforeEach is rather unclear, but it's a way to tell Protractor not\
    \ to wait for Angular to complete processing—using this setting for testing non-Angular\
    \ sites. The beforeEach is a good place to reset this flag.\n\nThe beforeEach\
    \ function sends a request to the URL http://www.google.co.uk/—that URL is obtained\
    \ by prefixing the baseUrl parameter's value, from the file we saw earlier, with\
    \ the argument given to the get function."
