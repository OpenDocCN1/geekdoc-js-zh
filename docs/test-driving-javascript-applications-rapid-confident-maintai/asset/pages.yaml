    \ all the errors.\n\n# Avoid Placing Multiple Independent Asserts in Test\n\n\
    ![](img/6f7b86a11e592b1c82741d22837e0b38_45_0.png)\n\nThis is not to say that\
    \ a test should never have multiple asserts. For example, if the effect of a function\
    \ is to change the first and last name of a person, then by all means check to\
