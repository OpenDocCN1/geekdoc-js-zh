  md: "```\nusingprotractor/protractor.conf.js\nexports.config = {\n  directConnect:\
    \ true,\n  baseUrl: 'https://www.google.co.uk',\n/*\n  capabilities: {\n    browserName:\
    \ ['firefox'] //default chrome\n  },\n  framework: 'mocha',\n  mochaOpts: {\n\
    \    reporter: 'dot',\n    timeout: 10000,\n  },\n  specs: ['test/integration/**/*.js'],\n\
    };\n```\n\nThe directConnect parameter tells Protractor to directly interact with\
    \ the browser without going through the WebDriver proxy. Keep this parameter to\
    \ run the tests in Chrome or Firefox. To run the tests in other browsers, simply\
    \ drop or comment out this line. Protractor will then launch an instance of the\
    \ Selenium WebDriver and interact with the browser through that instance.\n\n\
    The baseUrl parameter is the URL of the application under test. Having this parameter\
    \ in the configuration file removes the need to give the full path for each request\
    \ in the tests. It reduces the noise in the tests. Furthermore, it also makes\
    \ easy to run the same tests on different endpoints. This latter benefit can be\
    \ very useful to test different versions or installations of an application.\n\
    \nThe capabilities parameter is shown commented out. It's optional and by default\
    \ Protractor uses the Chrome browser. To use other browsers, include this parameter\
    \ with the appropriate browser name. Instead of capabilities, you can also provide\
    \ a multiCapabilities parameter if you'd like to run the tests in two or more\
    \ browsers at the same time.\n\nThe default testing tool that Protractor supports\
    \ is Jasmine. However, using Mocha is real simple—provide the framework parameter.\
    \ To specify runtime options for Mocha, use the mochaOpts parameter.\n\nFinally,\
    \ the file includes for the location of the tests. You may list just one file\
    \ or, comma-separated list of files, or use a wildcard like we did.\n\nThe configuration\
    \ file should be in the directory from which Protractor will be run. Generally,\
    \ a good place is the top-level directory of projects. Since"
