  md: "When you run the test, the console will report starting the driver and the\
    \ progress of the tests. At the same time, you can notice the browser dancing\
    \ around the commands from the test. The tests mimic user interactions, except\
    \ at machine speed instead of human pace. That is both good news and bad news.\
    \ The speed of execution, compared to manually navigating pages to verify, is\
    \ a big plus. The downside is that the interaction may be too fast and that may\
    \ make some tests fail intermittently. Keep an eye on it and if needed adjust\
    \ the speed of execution with a wait request, as appropriate; we'll encounter\
    \ this situation soon.\n\nThe test first obtained the element using the xpath\
    \ query. Protractor provides functions to get elements using different methods,\
    \ like by.id, byTagName, by.xpath, by.linkText, and the list on go. See the Protractor\
    \ API documentation¹ for a full listing.\n\n# Test for Posting Data\n\nThe search\
    \ page has an input text field and two submit buttons. Let's write a test to verify\
    \ that Google's search engine has gone on a break.\n\nThe test should first obtain\
    \ a reference to the input text field and then enter data into it. To get the\
    \ field, we need to know something about it—for example, its id or its CSS class.\
    \ Open http://www.google.co.uk and use your browser's facilities to inspect the\
    \ elements in the document to figure out the id of the field. Then you can use\
    \ the Protractor API to programmatically access to it.\n\nLet's add a test to\
    \ verify Google search. Add this test to the test suite in integration/google-search-test.js:\n\
    \n```\nusingprotractor/test/integration/google-search-test.js\nit('search brings\
    \ back an expected result', function() {\n  var inputField = element(by.id('lst-ib'));\n\
    \n  inputField.sendKeys('agilelearner.com');\n  inputField.sendKeys(protractor.Key.ENTER);\n\
    \n  var link =\n  element(by.xpath(\"//a[href='https://www.agilelearner.com/']\"\
    ));\n\n  browser.wait(function() {\n    return link.isPresent();\n  });\n\n  expect(link.isEnabled()).to.eventually.eq(true);\n\
    });\n```\n\nThe test has a few quirks. Let's go over them thoroughly.\n\n+   1.\
    \ https://angular.github.io/protractor/#api"
