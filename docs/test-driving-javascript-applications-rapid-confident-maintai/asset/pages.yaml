  md: "validateTask is a synchronous function and its implementation was pretty\n\
    straightforward. The code is passing all the tests written so far. It's now time\n\
    to design the routes functions.\n\n# Design the Routes\n\nA routes function is\
    \ a callback registered with Express. It's registered for a\nURI path and an HTTP\
    \ method. The callback functions typically take three\nparameters: HTTP request\
    \ (req), HTTP response (res), and a next routes handler\n(next). Unlike the model\
    \ functions that we typically call from a routes function,\nwe never directly\
    \ call any of the routes functions in the application code.\nInstead, Express\
    \ calls them with an HTTP request. In response, a handler\ntypically renders data\
    \ to the HTTP response object. This can leave us confused—in the world we can\
    \ test a function that's never called directly\n from application code?\n\nWell,\
    \ our test pretend to be Express and make the calls to verify the\nfunctions'\
    \ behavior—it's that simple. JavaScript makes it incredibly easy to\nsubstitute\
    \ JSON objects in place of real objects, so we can pass a JSON object\ninstead\
    \ of req, res, and next, with the canned behavior needed to make the tests\npass.\n\
    \nRely on Test Doubles when Testing Routes\n\n> When testing routes, by relying\
    \ on test doubles, we can avoid\nhaving the server or the database up and running.\n\
    \n# Let's Revisit Routes\n\nBefore coding the first test for a routes callback\
    \ function, let's refresh our\nmemory of what goes on in a routes file. We'll\
    \ start on familiar ground—take\na look at the index.js file, under the routes\
    \ directory, in the todo project, that was\ncreated by the Express generator.\n\
    \n```\nexpress/todo/routes/index.js\nvar express = require('express');\nvar router\
    \ = express.router();\n/* get home page. */\nrouter.get('/', function(req, res,\
    \ next) {\n  res.render('index', { title: 'Express' });\n});\nmodule.exports =\
    \ router;\n```\n\nLet's study the content of the file so we can understand the\
    \ effect of each line."
  merge: -1
  pgno: 160
