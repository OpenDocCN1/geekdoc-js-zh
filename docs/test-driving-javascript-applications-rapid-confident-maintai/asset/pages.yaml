  md: "send keys, or clicks, is abstracted using properties or functions in the page\n\
    object. Lets create a page object named TasksPage for the tasksj.html page.\n\n\
    ```\ntestendotend/todo/test/integration/tasksj-page.js\nvar fetchById = function(id)\
    \ {\n  return element(id.id());\n}\nvar sendKey = function(element, text) {\n\
    \  element.sendKeys(text);\n}\nvar TasksPage = function() {\n  browser.get('/tasksj.html');\n\
    }\n```\n\nTasksPage.prototype = function () {\n  getTasksCount() { return fetchById('taskscount').getText();\
    \ };\n  getAsText() { return fetchById('tasks').getText(); };\n  getMessage()\
    \ { return fetchById('message').getText(); };\n  deleteAt: function(index) {\n\
    \    return element.all(by.linkText('delete')).get(index);\n  },\n\n  setName(text)\
    \ { sendKey(fetchById('name'), text); };\n  setDate(text) { sendKey(fetchById('date'),\
    \ text); };\n  submit: function() { fetchById('submit').click(); }\n}\nmodule.exports\
    \ = TasksPage;\n\nThe fetchById and sendKey are helper functions. The first gets\
    \ an element\nment given an id, and the second emulates keystrokes in a given\
    \ text\nfield. The constructor for the page object TasksPage fetches the page\
    \ using the\nget function of the browser. The prototype holds a number of properties,\n\
    which are defined using getters or setters, and functions. Since the page has\n\
    accessible elements that hold tasks, the tasks, a new task, and so on,\nth manifest\
    \ as properties or functions in the page object.\n\nWe aim for more fluency and\
    \ less noise beyond what's possible with the\nuse of page objects. We can also\
    \ reduce the noise of using expect...eventually in the tests with a concurrency\
    \ function. Edit the file testendotend/todo/test/integration-eventually.js like\
    \ so:\n\n```\ntestendotend/todo/test/integration/eventually.js\nvar expect = require('chai').expect;\n\
    require('chai-as-promised');\n\nmodule.exports = function(object) {\n  return\
    \ expect(object).to.be.eventually;\n}\n```"
