  md: '# CHAPTER 3


    # # Test Asynchrony


    JavaScript libraries are filled with async functions. For example, to read a file,
    give the filename to the fs library and it''ll get back later with data or an
    error. Likewise, talking to services involves async functions—we can''t escape
    asynchrony. Let''s embrace asynchrony with automated tests.


    Writing and executing automated tests for asynchronous functions poses some challenges.
    However, a call to a synchronous function blocks and waits for the result. A call
    to an asynchronous function is nonblocking and the result or error will arrive
    later through callbacks or promises. To write automated verifications for async
    functions, you need to go beyond the techniques learned in the previous chapter.


    Let''s focus on testing asynchronous functions and temporarily set aside our desires
    for test-first design. Doing so will help us to more easily explore the nitty-gritty
    details of writing tests for asynchronous functions. We will write tests that
    run within Node.js and tests that run within browsers. To meet this goal, we''ll
    start with pre-created asynchronous functions. The techniques you learn here will
    help you in the later chapters when we take on the test-first approach.


    To verify async functions, you have to deal with two issues. Results may not arrive
    immediately after you make the calls, you will have to make the tests wait for
    the results to show up in the callbacks or through promises. Also, you have to
    decide how long to wait for the results—the timeout. Set the timeout low, tests
    fail prematurely. We need it too long, and you will wait longer than necessary
    if a function were to become unresponsive. These efforts may seem overwhelming,
    but tools and techniques are available to effectively deal with these challenges.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'We''ll first explore testing functions that use callbacks; then we''ll dig
    into promises. Let''s get started.


    # Server-Side Callbacks


    A caller of a synchronous function blocks until it gets the result or the intended
    action is completed. But calls to asynchronous functions are non-blocking. A caller
    of such functions typically sends one or more callbacks as extra parameters and
    moves on. Asynchronous functions that use callbacks eventually invoke one or more
    callbacks when the processing is completed. It''s through these callbacks that
    they indirectly send a response back to the caller. The difference in the nature
    of the functions poses some challenges from the point of view of testing.


    Due to the nature of the caller, a test for a synchronous function automatically
    waits for to arrive. The test for an asynchronous function needs to induce a wait
    since the caller is nonblocking. Introducing a sleep or delay in execution will
    not suffice. For one, it will make tests run slower. Furthermore, there is no
    guarantee the asynchronous function has responded within the duration of delay.
    Rather, we need a reliable mechanism to test these functions. Let''s explore this
    with an example.


    The function we''ll test reads a file and returns the number of lines in it. It
    currently has no tests—we''ll write the tests for it.


    We''ll first write a test naively for the asynchronous function, like we did for
    the synchronous functions. You''ll learn from experience the reasons why asynchronous
    testing needs to be different. Then we''ll write a proper asynchronous test and
    make it pass. Finally we''ll write a negative test for the asynchronous function
    as well. Let''s get started.


    # A Naive Attempt to Test


    Let''s first approach testing an asynchronous function like we approached tests
    of synchronous functions. This exercise will get you familiar with the code to
    be tested and also help you see why a different testing approach is necessary.


    Switch to a new files project by changing to the tdjs/async/files directory in
    your workspace. The tools we''ll use in this project are Mocha and Chai. Let''s
    get them installed by running the npm install command in the project directory—this
    will be our routine each time we step into a project directory and see a package.json
    file in the directory.'
