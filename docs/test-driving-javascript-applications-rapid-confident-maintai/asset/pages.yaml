  md: '# Working with the DOM and jQuery


    JavaScript on the client side is not new. But the demand for rich user interactions
    and improved computing power on the client side have spearheaded extensive and
    intense front-end development with the language. That has led to a greater need
    for automated verification of code running in browsers.


    Verifying the behavior of client-side code poses some extra challenges. Coding
    on the client side is predominantly manipulating the DOM and interacting with
    services. This translates to a lot of moving parts. In turn increases the chances
    for errors. If we take on manual verification, it will soon get tiring—we have
    to constantly type stuff into a browser to check if the code developed is working
    as expected.


    We can greatly reduce the pain of verifying client-side code by adopting a few
    techniques. By applying the techniques you''ll learn in this chapter, you can
    continuously verify code while writing it. You also won''t have to crash HTML
    files, or manually fix browsers, or even spin up the web server. All this translates
    into greater productivity during development and peace of mind when you change
    code.


    In this chapter, we will create a client side to accompany the server side of
    the TO-DO program from the previous chapter. The server accepts JSON and provides
    a handful of routes to manipulate tasks. First we will look at automated testing
    of code that uses functions readily in browsers, to manipulate the DOM and interact
    with the back end. After that, we will see how the tests change when we use jQuery
    to perform those operations.


    # Create a Strategic Design


    We''ll incrementally built a front end to the TO-DO service. The main features
    the UI will provide are list tasks, add a task, and delete a task.'
