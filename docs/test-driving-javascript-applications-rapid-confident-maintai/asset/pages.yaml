  md: "Chapter 7. Working with the DOM and jQuery · 178\n\nThe test list should reflect\
    \ the new understanding and the details of the design\nthat’s emerging from this\
    \ analysis.\n\n+   * ...\n* addTask updates message\n* addTask calls getTasks\n\
    * register add task click event on window load\n* addTask calls callService\n\
    * callService sends data to the service\n* callService has default content type\n\
    * callService sets content type if present\n* addTask callback updates message\n\
    * addTask callback calls getTasks\n* initpage registers add task click event\n\
    * addTask return false\n* addTask for invalid task should skip callServiceMock,\
    \ call updateMessage\n\nMost of the work will be to evolve the callService function—which\
    \ is good, since\nit’s better to extend duplicate. Changing a key function is\
    \ often a risky\nbusiness, but we have tests to cover our backs, no worries. Let’s\
