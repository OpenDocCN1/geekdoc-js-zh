  md: "# Chapter 7. Working with the DOM and jQuery · 188\n\nThe stub for getElementById\
    \ initialized an empty JSON object if the element did not exist. JavaScript has\
    \ no issues setting a value for a nonexistent property. However, it can't survive\
    \ calls to nonexistent functions. As for the jQuery version, we have to set up\
    \ the stub with a few more details for the functions that will be invoked—example:\n\
    \n```\nvar domElements;\nbeforeEach(function() {\n  sandbox = sinon.sandbox.create();\n\
    \  domElements = {};\n  sandbox.stub(window, '$', function(selector) {\n    return\
    \ {\n      html: function (value) { domElements[selector] = value; },\n      click:\
    \ function(value) { domElements[selector] = value; },\n      val: function() {\n\
    \        if(selector === '#name') return 'a new task';\n        return '12/11/2016';\n\
    \      }\n    };\n  });\n});\n```\n\nThe stub for the $ function takes a selector\
    \ and returns a JSON object with various stubs for functions like html, click,\
    \ and—specifically the functions that will be used in the code.\n\nNow to verify\
    \ the behavior of the code and ensure it sets the proper DOM element, we'll change\
    \ from\n\n```\nexpect(domElements.message.innerHTML).to.beql('..err. (status:\
    \ 404)');\nto\nexpect(domElements['message']).to.beql('..err. (status: 404)');\n\
    ```\n\nNext, let's see how to test the call to the back-end service.\n\n# Verifying\
    \ Calls Using $.ajax\n\nSinon's FakeXMLHTTPRequest was very helpful to verify\
    \ the behavior of code that used the rudimentary XMLHttpRequest. With jQuery,\
    \ you'd use $.ajax or one of its variations instead of XMLHttpRequest. That fundamental\
    \ change in the API, but surprisingly it doesn't make difference in the tests.\n\
    \nThe function $.ajax is a wrapper around XMLHttpRequest, so the technique to\
    \ intercept XMLHttpRequest using FakeXMLHTTPRequest works really well for code\
    \ that\n\nreport erratum · discuss"
