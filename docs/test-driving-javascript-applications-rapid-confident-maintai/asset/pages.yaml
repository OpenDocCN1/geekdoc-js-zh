  md: '# CHAPTER 4


    # # Tactfully Tackle Dependencies


    Dependencies arise almost everywhere: when code talks to remote services,

    read from or write to a file, update the DOM, get the user''s location...the list

    goes on. Dependencies are like taxes—they provide value but can turn into

    nburden. Keep them to a minimum. From the automated testing of point

    view, dependencies are irksome. They can make tests nondeterministic, brittle,

    slow, and cumbersome—we saw the tip of that iceberg in the previous chapter.


    Good design is critical to tackling dependencies. You can use some nice tricks\and
    techniques to decouple and replace the dependencies so that the tests

    are automated and deterministic, and run fast. In this chapter, you''ll first

    learn how to remove dependencies when possible. Then, in cases where the

    ddependencies are intrinsic, you will explore ways to replace them with test

    doubles like fakes, stubs, mocks, or spies.


    Although test doubles are helpful, use them sparingly. If you''re not careful,

    it''s easy to get into a mocking hell. With these cautionary words in mind, let

    explore some decoupling techniques. Let''s dive into writing automated tests

    for a problem with intricate dependencies.


