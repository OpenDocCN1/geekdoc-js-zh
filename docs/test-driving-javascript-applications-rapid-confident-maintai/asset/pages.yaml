  md: 'practical. You will learn the role of test doubles using the getLocation function
    as an example.


    The getLocation function is a simple one. It takes a URL for Google Maps and sets
    that into the location property of the window object, instructing the browser
    to display the map with the user''s current location. It''s easy to write but
    may appear hard to test.


    We don''t want to load an HTML page in a browser, then call the getLocation function
    to see if the browser navigates to the page at the given URL—that would be manual,
    not automated. We could write a UI-level test, up at the top of the test pyramid.
    By we discussed that if a test can be written at a lower level then we should.


    The issue is that we''re setting the location property of the window object that''s
    provided by the browser, and when set, it will respond by making a request to
    that page. How we test for that, automated and at a lower level, is the real concern.


    It turns out we don''t have to really test for that. Our goal is not to test if
    the browser responds to a set of the location. We need to verify that the getLocation
    function properly sets the location property of a window object—that''s, "a" window
    and not "the" window. Let''s discuss further what that means. We can break the
    testing for the overall behavior of page navigation into three parts:


    +   1. If location is set, the browser will navigate to the set URL. We can separately
    write tests to confirm this if we''re doubtful—say for a new browser or version
    of the browser.


    +   2. If a window object is given to getLocation we can test that the function
    set a location property on the given window object. JavaScript does not care what
    object you give it—it''s happy to set whatever properties you ask to be set. So,
    this can be tested without needing the real window object.


    +   3. We can separately test that "the" correct window object is passed to the
    getLocation function from where it''s called.


    We''ll skip test 1; we trust the browsers have been well tested. We''ll write
    test 2 shortly and address test 3 when designing the onSuccess function.


    To write the test for getLocation we need a window object, but it does not have
    to be the real window object—in fact, it shouldn''t be. The location property
    of the window object is implemented in such a special way that it''s practically
    impossible to write non-UI-level automated tests. To avoid that issue, we''ll
    use a test double.'
