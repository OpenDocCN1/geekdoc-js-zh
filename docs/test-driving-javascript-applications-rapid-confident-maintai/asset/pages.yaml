  md: 'still have two major features on our hands: to add a task and delete a task.
    Both of these features need to communicate with the server. Unlike getTasks these
    will need to send some data to the server in addition to getting a response. Let''s
    work on adding a task first and then look at the delete operation after that.


    # Design addTask


    Let''s start by looking at the current test list:


    +   - ...

    * register onun handler with document

    * initpage calls getTasks

    * addTask updates message

    * addTask calls getTasks

    * register add click event on window load


    We can expect the tests for the addTask function to evolve much like the tests
    for getTasks did. Let''s explore addTask further.


    # Analyze addTask


    addTask needs to call the server—for that, we can use callService. But callService
    currently does not send any data—the call passes no arguments. We need to evolve
    callService so it meets the needs of getTasks plus the additional needs of addTask.
    Thankfully, as we change callService the existing tests will give quick feedback
    that what worked before still.


    After addTask gets the response from the server, it needs to update the message
    DOM element with the response. Finally, it should update the list of tasks by
    calling getTasks to reflect the newly added task.


    When a user clicks the submit button, we need to call the addTask function. The
    initpage function we wrote earlier is a great place to register this event. Finally,
    addTask should return false—this is needed to prevent the browser from submitting
    the form. Otherwise, the browser, after executing the click event, will post a
    request to the server, which would be redundant since we''ve already handled that
    in code.


    Oh, one final thing—there''s no point in sending a request to the server if the
    task is not valid. For example, if the month is a string instead of a number,
    it is better to let the user know without making a round-trip to the server. Thankfully,
    we already created a reusable function, validateTask, for that in the previous
    chapter. Instead of duplicating the efforts here, addTask can simply call that
    function. We will add a test to verify that behavior.'
