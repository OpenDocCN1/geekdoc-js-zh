  md: "# Chapter 9. Test-Drive Angular 2 • 266\n\nTo make the test pass, again change\
    \ the transform function. Here’s the code that passes all the tests written so\
    \ far:\n\n```\ntransform: function(tasks) {\n  var compareTwoTasks = function(task1,\
    \ task2) {\n    return task1.year - task2.year ||\n    task1.month - task2.month\
    \ ||\n    task1.day - task2.day ||\n    task1.name.localeCompare(task2.name);\n\
    \  };\n\n  return tasks.sort(compareTwoTasks);\n}\n```\n\nAll the tests we planned\
    \ out are implemented and passing. However, there’s one thing that’s really ugly\
    \ in our implementation, something that our elders will not approve of: *mutability*.\
    \ We should prefer immutability whenever possible—fewer state changes make code\
    \ easier to reason and easier to test, and also minimize the chances of errors.\n\
    \nOur current implementation is mutating the array as input: * own*, let’s fix\
    \ that before anyone sees it—after writing the test first, of course.\n\nHere’s\
    \ the test to verify that the transform is a good citizen and does not change\
    \ the input:\n\n```\nangular2/todo/test/client/app/tasks/tasks-sort-pipe-test.js\n\
    it('should not mutate the given input', function() {\n  var task1 = { name: 'task\
    \ a', month: 1, day: 1, year: 2017 };\n  var task2 = { name: 'task b', month:\
    \ 1, day: 14, year: 2017 };\n\n  var input = [task2, task1];\n\n  sortPipe.transform(input);\n\
    \  expect(input[0]).to.equal(task2);\n});\n```\n\nAs soon we save the file, the\
    \ test will fail since the given argument has been modified by the function. Change\
    \ the last line in the transform function to sort a copy of the given array. Here’s\
    \ one possible way to achieve that:\n\n```\nreturn tasks.slice().sort(compareTwoTasks);\n\
    ```\n\nLet’s step back and take a look at the entire pipe class that was created\
    \ using the series of tests:\n\nreport erratum • discuss"
