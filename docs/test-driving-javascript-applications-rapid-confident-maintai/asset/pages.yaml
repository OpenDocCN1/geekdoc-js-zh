  md: '# Design the Routes 145


    First, it brings in a reference to the express module. Then the Router function
    on the express object is called to get a router instance. It''s this instance
    that is returned from this module at the end of this file. The file creates a
    callback, an anonymous function that is the second argument to the router.get
    call. In essence, the file registers the callback as a routes handler for a GET
    request on the URI / suffix.


    The tasks.js file we will create for the tasks is going to look very similar.
    The net effect of all the routes—like index.js—is the following:


    +   * For each method, like GET, POST, and DELETE, register a callback handler
    by passing two arguments: a path suffix and a callback.

    * Each registered callback handler will optionally read some parameters from the
    req object, interact with the model functions, and make some calls on the res
    object. They may also call functions on next.


    Now we''ve refreshed what goes on in a routes file, let''s think about behavior
    of the code in these files.


    The tests for the routes functions should focus on two things:


    +   1. Verify that a handler for an expected HTTP method, like GET, is registered.

    2. Verify that the registered handlers interact with the request, response, and
    model functions properly.


    To verify the registration, we can mock out the functions like get on the router
    instance and verify the interactions of the code in the routes file with functions.


    To verify the behavior of the handlers, we can stub or mock out the req, res,
    and optionally the next instance. That while the stubs can return data, the mocks
    can confirm proper interaction of the code with its dependencies like HTTP response.


    Using these approaches we can fully verify that the necessary callbacks have been
    registered for the HTTP methods and the handlers are performing the necessary
    actions. That shouldn''t be hard; let''s give it a shot.


    For the program we will need to register the following paths and methods:


    +   * /GET—GET: used to get all the tasks

    * /id—GET: used to get task for the given id

    * /POST: used to create a new task

    * /id—DELETE: used to delete a task with the given id


    Let''s get started with the tests.'
