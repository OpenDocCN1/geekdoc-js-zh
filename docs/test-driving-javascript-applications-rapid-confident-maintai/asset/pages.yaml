  md: '# Sort the Task List


    The test in our test list related sorting says “tasks displayed should be in sorted
    order.” How and where should we do the sorting is the next question we need to
    tackle.


    Let''s revisit how we did the sorting in the spiking exercise. We added the pipes
    annotation to the component, but let we view the do transformation using the declarative
    style expression let of langs | sort in the HTML file. This has exactly the same
    bad smell that order AngularJS 1.x—Find the Right Place, on page 207.


    # It’s Not Good if it’s Hard to Test


    ![](img/6f7b86a11e592b1c82741d22837e0b38_269_0.png)


    Instead of placing the pipe in the HTML file, we''ll do the sorting in code, within
    the component. We know that we can easily test and verify that sorting is done
    properly when we do this at the code level. But we don''t want to put the entire
    code for sorting within our component.


    We''ll write the sorting operation as a pipe instead of implementing within the
    component. That, if the sorting is needed elsewhere later on we have it available
    as a reusable class. By writing it as a pipe we can also use it from HTML prototyping
    exercises. By naming it as a pipe, the intention becomes clear as well. In other
    words, we will write it as a pipe but will use it like a service.


    Since we plan to use the pipe from the component instead of using the pipes annotation
    attribute, we''ll place it in providers. But we''re jumping ahead; let''s get
    to those details later on. Let''s bring our focus back to sorting the tasks.


    We''re in the middle of implementing the component. We''ve just made a design
    decision that the sorting transformation will happen in a pipe. Right now, all
    we need to verify that updateTasks delegates the concern of sorting to a separate-object''s
    function. So, the test we identified earlier for the sorting function changes
    as follows:


    +   - tasks displayed should be in sorted order

    - updateTasks calls the transform function of pipe'
