  md: "# Joe asks:\nWhere's $scope?\n\nYou may wonder about the $scope variable, or\
    \ the absence of it, in our code so far. AngularJS tutorials misuse a variable\
    \ with that name. This variable gives an implicit scope and removes the need to\
    \ explicitly name the controller in HTML pages. Unfortunately, it pollutes the\
    \ design—the code lacks clarity and it's easy to introduce errors.\n\nDefine a\
    \ controller object and use it with an explicit name for a cleaner design. With\
    \ this approach, the scope of variables and state is crystal clear. Designing\
    \ and calling functions on the controller is also a lot cleaner, not to mention\
    \ the ease of testing.\n\n# Design Service Interaction\n\nThe details of interaction\
    \ with the back end—the GET, POST, and DELETE requests—will be put away in a separate\
    \ service object. The controller's getTasks function need not worry about them.\
    \ It only has to call to the service and pass one callback for success and another\
    \ for the error situation. These callbacks will be responsible for appropriately\
    \ updating the models in the controllers.\n\nFrom the design point of view\n\n\
    We'll design the getTasks function to call a get function of the service and pass\
    \ two callbacks. All need to verify that the two callbacks are passed to the get\
    \ function by getTasks. Initially we thought of two separate tasks for getTasks,\
    \ but we can cover both of them with one test. Here's the test, in tasks-controller-test.js:\n\
    \n```\nangularjs/todo/test/tasks-controller-test.js\nit('getTasks should interact\
    \ with the service', function(done) {\n  controller.updateTasks = function() {};\n\
    \  controller.updateError = function() {};\n\n  tasksServiceMock.get = function(success,\
    \ error) {\n    expect(success).to.beql(controller.updateTasks);\n    expect(error).to.beql(controller.updateError);\n\
    \    done();\n  };\n\n  controller.getTasks();\n});\n```"
  merge: -1
