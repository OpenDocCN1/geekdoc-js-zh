  md: '# Wrapping Up


    The client-side JavaScript for fully functional front-end views were driven in
    this chapter. The knowledge from previous chapters on how to cope with dependencies
    played a vital role time and again throughout the exercise.


    The chapter started with a sketch for the front-end views, followed by an initial
