  md: '# Let''s Get Started


    You should get comfortable writing and running tests before we dive into designing
    tests. That''s what we''ll do first: get a project set up and get a few tests
    running.


    We''ll use a very simple function that converts Fahrenheit to Celsius as vehicle
    to learn about the test writing fundamentals. As a first step we''ll check the
    installation of Node.js and npm on your system. Then we''ll get an example project
    set up and install the tools necessary for writing the tests. Next, we''ll warm
    up and confirm that everything gets installed by writing an introductory test.
    Along the way you''ll learn about test suites and the organization of test and
    code files. Finally, we''ll write a test to verify the behavior of your example
    code under test.


    # Check npm and Node.js Installations


    We need Node.js for two reasons. First, we need it for running the server-side
    code and tests. Second, it comes bundled with npm the JavaScript package manager,
    which has become the go-to tool for installing JavaScript modules. We''ll use
    npm to install tools for both the server-side and the client-side testing.


    If you don''t already have the latest version of Node.js'' on your system, get
    that installed and verify it''s on the system path by running the following command:


    ```

    node --version

    ```


    Also ensure that npm is on your system path by running this command:


    ```

    npm --version

    ```


    Using npm is a convenient way to download the different modules we''ll need. Now
    that you''ve confirmed that these two tools are installed and updated on your
    system, let''s get started with writing some tests and running them.


    # Set Up a Sample Project


    We''ll start with a simple problem—writing tests for a function that converts
    from Fahrenheit to Celsius. We''ll keep this example extremely rudimentary so
    you can get comfortable with the project setup process and writing tests.


    +   1. https://nodejs.org'
