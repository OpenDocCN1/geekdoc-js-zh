  md: '# Negative Influences Design Smells Consequences


    | Negative | Design | Consequences |

    |---|---||

    | Long functions | Low cohesion, high coupling | Hard to understand, expensive
    to change, hard to verify/test |

    | A piece of code does many things | Lacks single responsibility | Code is unstable,
    hard to reuse, hard to verify/test |

    | Code depends on many things | High coupling | Code is brittle, breaks too often
    |

    | Code directly depends on third-party code | Tight coupling | Not extensible
    |

    | Code is duplicated | Needless repetition | More time and effort to fix errors
    |

    | Code has unnecessary complexity | Violates You Aren''t Gonna Need It (YAGNI)
    principle | Hard to change, may contain unused code |


    Coincidentally, each of these reasons also makes automated testing really hard.
    For example, the number of tests to verify a function''s behavior grows exponentially
    with the length and complexity of functions. Past a certain limit, it becomes
    impractical to write automated tests for poorly designed functions.


