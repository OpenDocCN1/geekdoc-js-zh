    \ addTask function should do a few things. It should create a new task JSON\n\
    object from the data in the HTML input fields. When we pass data, as a\nstring,\
    \ from callService with a POST method, and also set a contentType property.\n\
    We don’t have to change the callService function yet—we can mock it to test\n\
    addTask—but we also have to create a stub for the necessary document elements\n\
    ews. Let’s get done first. Change the beforeEach function in the test suite,\n\
    like so:\n\n```\ndomjquery/todo/test/client/tasks-test.js\nbeforeEach(function()\
    \ {\n  //\n  domElements = {\n    name: {value: 'a new task'},\n    date: {value:\
    \ '12/11/2016'},\n  };\n  //\n});\n```\n\nWe added stubs for the DOM elements\
    \ name and date. The test should verify\nthat addTask passes the necessary details\
    \ to callService. Let’s write that.\n\nreport erratum · discuss"
