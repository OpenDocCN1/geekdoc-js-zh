    # Async JavaScript


    With the advent of HTML5, front-end MVC, and Node.js, JavaScript is ubiquitous—and
    still messy. This book will give you a solid foundation for managing async tasks
    without losing your sanity in a fate of callbacks. It''s a fast-paced guide to
    the most essential techniques for dealing with async behavior, including PubSub,
