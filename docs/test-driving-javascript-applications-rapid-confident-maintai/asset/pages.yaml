  md: '# Part II


    # Real-World Automated Testing


    In this part, we''ll pull together all the different pieces that we covered in
    Part 1 by building practical examples. You will test-drive fully functional applications
    that use Node.js, Express, jQuery, and AngularJS. For the most part, you won''t
    have to spin up web servers or browsers—that means fast and deterministic feedback
    loops.


    You''ll explore testing the models that talk to databases, the routes that handle
    URL paths, the code that manipulates the DOM, and functions that serve as AngularJS
    controllers. You''ll also write and exercise end-to-end integration tests, from
    the UI, through the controllers, routes, and models, all the way to the database.


    Finally, this part ends with a discussion on testing the design and the levels
    of testing at different application layers.'
