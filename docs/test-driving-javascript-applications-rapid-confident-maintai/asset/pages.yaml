- img_proc: true
  md: 'The first line gets the element using the locator obtained from the id for
    the input text field. The sendKeys function emulates the user''s keystrokes. The
    first call to the function enters a search text and the second call enters the
    return key. In response to the user hitting the return key, the Google search
    page will perform the search and get back the results page. There''s a gotcha
    here, however.


    Google Search usually appears instantaneous for users on fast networks. However,
    logically it takes a non-zero amount of time for the response to return from a
    remote server. That time most likely will be greater than the time for your test
    to execute the line after the call to sendKeys. We need to account for that time
    delay. This is an unfortunate burden and may make tests brittle.


    When you perform a get or a refresh, Protractor knows to wait for that call to
    complete running the next line of code. However, when you perform a click or a
    key press to post a request to the server, Protractor is not aware of what happened.
    You need to instruct Protractor to wait for the response in these cases.


    In the test, after sending the request to the search page, we look for an A tag
    with a particular href using the xpath function. We then ask Protractor for the
    element to be available using the wait function. This function returns a Promise.
    Promise internally waits for the expected response. Once this Promise is resolved,
    Protractor moves to execute the next line, which checks if the link is displayed.


    If the page takes well beyond the timeout to respond or if the page comes back
    not like that, then the test will time out and fail.


    Even though the test was relatively short, it exposed some unpleasant aspects
    of UI-level testing. We have to know which elements to access. If the id or other
    locators used to access the elements are changed, the related tests will be dead
    in the water. Second, we may have to put in a lot of effort to get the locators.
    For example, if you miss the trailing / in the XPath, the A tag will not be located.
    Third, if you forget to put the wait, the test will fail even though the page
    has the content you''re looking for.


    Writing Protractor tests on Google Search was useful in a couple of ways. First,
    it gave you a chance to see tests in action and learn to use Protractor. The fact
    that you were able to do it without having to spin your own server kept your focus
    on learning the essentials. Second, the tests cautioned you on where things can
    get out of hand. The tests serve as a good reminder'
