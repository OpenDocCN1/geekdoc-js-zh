  md: "The getTasks and the related functions to implement the tasks listing are done,\
    \ but nothing has to call getTasks. That's the next step in our design.\n\n# Register\
    \ window onload Event\n\nWhen a user visits the page, we want the list of tasks\
    \ to appear right without requiring any clicks or commands. In other words, getTasks\
    \ should be run automatically. We may be able to achieve this by calling getTasks\
    \ at the bottom of the script file public/javascript/src/tasks.js. But where the\
    \ script file referenced in the HTML file will affect the correctness of the execution\
    \ sequence. Instead of relying on that, we can implement the initialization using\
    \ window onload event—besides, it's not really hard. Let's write a couple of tests\
    \ for this.\n\nIn the first test, we verify that the inpage function is assigned\
    \ to the onload property.\n\n```\ntestdomquery/todo/test/client/tasks-test.js\n\
    it('should register initpage handler with window onload', function() {\n  expect(window.onload).to.be.eq(inpage);\n\
    });\n```\n\nFor this test to pass, we just need to make a simple code change.\
    \ In public/javascript/src/tasks.js we need to define an empty inpage and assign\
    \ it to window.onload. Let's write the second test, to verify that inpage calls\
    \ getTasks.\n\n```\ntestdomquery/todo/test/client/tasks-test.js\nit('inpage should\
    \ call getTasks', function(done) {\n  sandbox.stub(window, 'getTasks', done);\n\
    \n  inpage();\n});\n```\n\nThe test verifies, with the help of a stub, that the\
    \ inpage function calls getTasks. Since getTasks is stubbed out with the reference\
    \ to the done function, if inpage does not call getTasks, this test will time\
    \ out and fail. Let's take a look at the code in tasks.js that makes these tests\
    \ pass.\n\n```\ntestdomquery/todo/public/javascript/src/tasks.js\nvar inpage =\
    \ function() {\n  getTasks();\n}\n\nwindow.onload = inpage;\n```\n\nThat completes\
    \ the code needed for listing tasks, all test driven. Take a look at the command\
    \ window Karma is running and you'll see that all the tests written so far are\
    \ passing. But we can't really call this part until we see the code in real action—that's\
    \ next."
