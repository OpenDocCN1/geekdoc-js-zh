  md: '# Introduction


    The passion to code was seeded in me early. Decades later, though I''m still addicted
    to coding, the economics of software development equally intrigues me. The cost
    of change and the speed at which we can respond to change matters a lot. We work
    in an industry that''s still developing and maturing. We get paid to write code,
    and if we do a poor job, we get paid to go back and fix the mess. That can become
    a vicious cycle. As professionals we have to raise that bar—a lot higher.


    JavaScript is truly a black swan—who would''ve thought it would grow into one
    of the most ubiquitous languages? It''s powerful, highly flexible, and quite dangerous,
    all at the same time. I actually like JavaScript—quite a lot—for the power and
    flexibility it offers.


    Shunning powerful and flexible solutions, just because they are risky, will set
    us back. Instead we de embrace them with better engineering practices. Using automated
    testing and continuous integration are part of better engineering practices. We
    can rely on automated testing and short loops to alleviate the pain that comes
    from the dangerous side of JavaScript.


    There''s been explosive growth in the JavaScript ecosystem in recent years. There''s
    also been tremendous development of automated testing tools. Thanks to these tools,
    as well as short feedback loops, continuous integration, and so on, good engineering
    discipline is not a theory—it''s what every programmer using JavaScript can apply
    today. I''ve written this book to motivate and inspire you, and guide you along
    so you can share your share to raise that bar, to elevate our field to higher
    standards. Thank you for reading this book.


    +   1. https://en.wikipedia.org/wiki/Black_swan_theory'
  merge: -1
