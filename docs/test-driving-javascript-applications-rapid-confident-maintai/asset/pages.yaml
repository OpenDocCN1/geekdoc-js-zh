  md: 'The top part of the next figure illustrates the view of the page before the
    dialog is closed. The bottom part shows the view after the OK button is clicked.


    ![](img/6f7b86a11e592b1c82741d22837e0b38_212_0.png)


    In the top part of the figure you caught AngularJS in the middle of processing.

    The raw expression appears on the page since AngularJS is not done with its walk-through
    the DOM. If a failure happens midway, the users will be left tonview a butchered
    view like this. A popular airline once showed such a spectacle on their reservation
    system—all the more to automated testing to avoid such embarrassment.


    Let''s think about how approaching testing the code we put into controllers. We
    did not call any functions to load AngularJS or to create the controller instance—it
    just not configure or pass a $filter, yet we used it in the controller to apply
    the lowercase function. AngularJS did so much auto-wiring when the browser loaded
    the HTML page.


    During automated testing of the AngularJS code, we would not create or load any
    HTML files. That''s because our focus is on verifying the code''s behavior and
    we should not be forced to create an HTML file for that. But without one, how
    on earth will we create a controller, deal with the filter, and start testing?
    Dependency injection and mocking the answers.


    > Automated Testing Is a First-Class Citizen in AngularJS

    AngularJS was designed to make automated testing highly approachable. Dependency
    injection is used extensively for that reason.'
