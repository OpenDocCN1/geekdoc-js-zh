  md: 'Different names are thrown around for test doubles that replace dependencies
    during testing: fakes, stubs, mocks, spies. Let''s take a few minutes to learn
    about these and how they differ from each other.


    All four types of test doubles stand in dependencies, and the code will interact
    with one of them, during testing, instead of talking to their actual dependency.


    ![](img/6f7b86a11e592b1c82741d22837e0b38_87_0.png)


    Each of these test doubles has a fairly clear purpose as discussed by Martin Fowler
    in the blog titled "Mocks Aren''t Stubs":


    +   - **Fakes**: These are implementations suitable for testing, but not for production.
    For example, interacting with a real production credit card service is not practical
    during testing—no one wants to incur charges each time tests are run. By replacing
    the production service with a fake during testing, you can get quick feedback
    that the code handles successes and failures of interacting with the service properly.
    Credit card processing services offer two services, one for production and a fake
    for use testing.


    +   - **Stubs**: These are not real implementations but may readily return canned
    response when called. These are useful to verify code''s behavior in response
    to (pre-set) results from its (stub) dependency. Stubs are also useful to verify
    that the code being tested updates the state of their dependencies. It''s not
    a good idea to create one stub for a dependency. Instead create small stubs in
    each test, where needed, tailored specifically to help that test pass.


    +   - **Mocks**: These are like stubs in that they may return canned values. However,
    they keep track of interactions, how many times and in what order calls were made.
    Mocks talkative about interactions and help verify communication between the code
    being tested and its dependencies.


    2. http://martinfowler.com/articles/mocksArentStubs.html'
