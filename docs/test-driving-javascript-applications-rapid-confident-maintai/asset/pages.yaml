  md: 'why you need them, but at the same time, you will have to keep these kinds
    of tests to a minimum.


    Having tried out the example, you''re likely eager to create full-to-end Protractor
    tests for your own application. Writing tests for the TO-DO app will give you
    a fairly good idea of how to approach that. In the previous chapters we created
    the server side and different versions of the client side of the TO-DO application.
    We''re now ready to write integration tests for your application. We''ll first
    write the integration tests through the jQuery-based view for the application
    and then through the view built using AngularJS.


    # Start the Server and Configure the Database


    The TO-DO application server side was written using Express. There are three versions
    of the client: one that manipulates the DOM directly, one that uses jQuery instead,
    and a third that uses AngularJS. Each part of the application was tested separately,
    and now we''re poised to do the end-to-end testing.


    We must cross two hurdles before writing any integration tests for the app.


    First, for the integration test to succeed we need the application''s server running.
    To run the tests we wrote in previous chapters, we did not have to start the server
    to execute the server-side automated tests. However, to get a glimpse of the server
    in action, for a few moments we ran the server manually using npm start. While
    that step is an option during integration tests, it would be so much better if
    the server comes to life automatically when we start Protractor tests. That will
    remove the need for any extra manual step before running the tests. That would
    also make it easy to run tests tests on continuous integration server. We''d still
    need the database server running, but that can be turned on as a daemon.


    Second, the application interacts with a MongoDB database. At the beginning there''s
    no data in the database. To verify that the page is showing a list of tasks, we''d
    need some sample data. We could populate some data manually, but soon the tests
    for add and delete tasks will miss us up. To keep our sanity, we have to get a
    couple of things right:


    +   - We need to use a database to test the application. This has to be separate
    from a database used for development and certainly the one that will be used in
    production. The reason for this is inarguable—it''s no overwriting test data during
    development, and vice versa. The application has to smoothly pick up the right
    database depending on the development run versus the test run.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '+   • We need an automated way to seed the database with sample data and clean
    it up at the end of the tests. This will keep the tests FAIR—Design with Positive,
    Negative, and Exception Tests, on page 21.


    All that sounds complicated and has the potential to get overwhelming. Frankly,
    since Protractor runs on Node.js, we can fire up the server easily, locally and
    in an automated fashion. Also, seeding the MongoDB database with sample data is
    not a big deal. Let''s take care of those two steps quickly after installing Protractor
    for this application.


    # Install Protractor for the TO-DO App


    The workspace at tdja/testendto/todo has a project set up for your use. It has
    all the test and code for the TO-DO application from the previous chapters carried
    over. The package.json file in this workspace has been updated with the Protractor
    dependency.


    Change to the tdja/testendto/todo directory and run the npm install command to
    download and install Protractor for this project. Then run the command npm run-script-update-driver
    to update the WebDriver that will be used in this project.


    An empty protractor.conf.js file along with many files under tdja/testend-to/todo/test/integration
    have also been pre-created for you to edit easily as you follow along the example.
    Let''s move on to write the integration tests for the TO-DO app.


    # Start the Server in the before Setup


    When Protractor starts up, more precisely, before any Mocha runs, we want the
    Express server to be started. That way the server will be ready to serve the requests
    that come from the integration tests, starting with the very first test. Any nontrivial
    project would have multiple integration test files. Writing the code to start
    up the server within any of the tests won''t cut it. At least it would lead to
    duplication of the setup code.


    Mocha permits global before and after. These can go into any file that''s included
    in the test run outside of any test suite. Let''s set that up first.


    Both client-side and server-side tests already exist for the TO-DO application.
    We will add the integration tests to the project. Under the test directory the
    two subdirectories, server and client, house the tests from previous chapters.
    The new third subdirectory, named integration, will hold all the integration or
    end-to-end tests that touch both the client side and the server side.'
