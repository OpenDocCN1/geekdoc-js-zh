  md: 'These examples have helped you learn to write tests for asynchronous functions.
    Realistically, however, the code has to be structured differently to get the most
    out of automated testing. You''ll learn how to do that and appropriately deal
    with dependencies in the next chapter.


    Asynchronous functions have traditionally used callbacks, but promises are gaining
    traction in JavaScript. Let''s look at writing tests for them next.


    # # Test Your Promises


    Now let''s explore testing for promises in code running within Node.js. The same
    techniques work for client-side code that use promises as well. We''ll start with
    a short introduction to promises and then dive into testing code that uses promises.


    # # A Short Introduction to Promises


    Before digging into testing promises, let''s review how promises works—I promise
    to keep it short.


    Traditionally asynchronous functions have used callbacks. But callbacks have a
    few drawbacks. Callbacks have to be registered before the asynchronous functions
    generate any response. For example, when using an instance of XMLHttpRequest,
    calling the send function before registering a callback with the onreadystatechange
    property may result in some events being missed. Also, it''s hard to compose callbacks—the
    code become overly verbose and cumbersome when a callback in turn has to invoke
    other asynchronous functions and register other callbacks.


    Promises do not have those issues and that''s one of the reasons they''re gaining
    in popularity. Functions that use promises immediately return a Promise object
    in response to calls. They respond to the caller through the Promise object.


    Promises more clearly express the intent of asynchrony than callbacks do. Here''s
    a figure that shows the propagation of promises through a series of function calls.


    ![](img/6f7b86a11e592b1c82741d22837e0b38_71_0.png)'
