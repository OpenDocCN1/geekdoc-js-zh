    \ we want to selectively target only the integration points not touched by other\
    \ tests. There's no need to redundantly verify things taken care by other tests.\n\
    \n> Write Minimum and Targeted Integration Tests\nKeep integration tests to a\
    \ minimum. Only write tests to verify things that are not already covered by tests\
    \ in other layers.\n\nLet's step back and visualize the different parts of the\
    \ application and identify parts that have been tested those that have been left\
    \ out from tests.\nEach box shown in the figure on page 300 represents code in\
    \ each of the layers. The code within each layer, is hidden inside the boxes,\
    \ has all been thoroughly tested using tests in those layers. What's left are\
    \ the interactions between the layers."
