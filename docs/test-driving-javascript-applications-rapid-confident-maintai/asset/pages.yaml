  md: "Then, to check that the function under test actually interacted with the\n\
    dependency for which the mock stands in, write\nMock.verify();\n\nIf the interaction\
    \ did not happen, the verify call will fail and blow up the test.\n\nWe merely\
    \ scratched the surface of what Sinon provides—you’ll see examples\nof its usage\
    \ throughout the rest of this book. For a comprehensive document-\ntation of different\
    \ functions available, refer to the Sinon documentation³ and\nSinon-Chai documentation.⁴\n\
    \n# Use Sinon Mocks to Test Interactions\n\nNow that you've learned about Sinon\
    \ and how to use it, let's make use of\nSinon for testing the locate function.\
    \ First we need to create Sinon's sandbox\nbefore the test is called. Also, we\
    \ have to restore any functions mocked or\nstubbed to their original state right\
    \ after the test completes. A good place for\nthese two operations will be in\
    \ the beforeEach and the afterEach func-\tions. Since more than one test may have\
    \ a need for these functions,\ninstead of placing these functions in one particular\
    \ test suite, we'll write them\nin a separate file outside of any test suite.\
    \ Then they become available for all\ntest suites in the current project.\n\n\
    We'll put the Sinon setup and teardown operations in a separate file named\nsinin-setup.js.\
    \ Let's open that pre-created empty file in the locate project and\nadding the\
    \ following Sinon-related code:\n\n```\ntackle/locateme/test/sinon-setup.js\n\
    var sandbox;\nbeforeEach(function() {\n  sandbox = sinon.sandbox.create();\n});nafterEach(function()\
    \ {\n  sandbox.restore();\n});\n```\n\nThe sandbox variable will have a reference\
    \ to the Sinon sandbox object that will\nbe the gateway to stubs, mocks, and spies\
    \ in the tests. The beforeEach\nfunction will promptly create and have ready a\
    \ sandbox before each test. The\nafterEach will undo any effect of stubs and mocks\
    \ on any objects—dependencies\ncities—created, through the sandbox, in the tests.\n\
    \n+   3. http://sinon.org/docs/\n4. https://github.com/domenic/sinon-chai -"
