  md: '# Set Up the Project


    In your workspace, change to the tdjsa/angularspike directory. Take a quick look
    at the package.json file. It includes the dependencies for Angular and other necessary
    modules. The start script launches the lightweight HTTP server that serves files.
    Using this server removes the need to create any server-side code to serve files.
    Run `npm install` to get the dependencies downloaded and installed on your system.


    The client side of this sample program will display names of languages obtained
    from the server. We need a list of languages for this purpose.


    Edit the file languages and add a few languages of your choice, like so:


    +   - angularspike/languages

    - JavaScript

    - TypeScript

    - Haskell

    - Java

    - C#

    - F#

    - Clojure

    - Scala

    - Ruby

    - Elixir


    When we visit the page index.html, the application should display the language
    names served from the languages file, but in sorted order. For this we need a
    pipe, a service, a component, and a couple of HTML files. Let''s get started by
    creating them, in order.


    # Create a Pipe


    We want the language names to appear in sorted order. In AngularJS 1.x we may
    use the orderBy filter for this purpose. Angular does not have any built-in function
    for sorting. Furthermore, filters have been replaced by pipes in Angular.


    Pipes follow the idea of Unix pipe transformations. For example, in the Unix command-sequence
    `ls | grep | wc -l`, the standard output from one command flows into the standard
    input of the following command. In the example, the output of `ls` flows into
    the input of `grep`. The output of `grep`, in turn, flows into the input of the
    `wc` command. Angular pipes are similar. For example, `name | lowercase` will
    transform the name variable to uppercase and then the result of that is further
    transformed to lowercase. That example is not a very useful series of transformations
    but it illustrates the point.'
