  md: '# CHAPTER 10


    # Integrate and Test End-to-End


    If automated testing were a meal, integration testing would be the salt in it—highly
    essential, but it should be limited.


    Integration or end-to-end testing is done with all parts of the application up
    and running. While these tests provide great value, they may also take longer
    to run and may be fragile.


    Integration tests serve multiple purposes. First, they verify that the UI is wired
    properly. They confirm that other parts are connected correctly as well. For example,
    it is imperative to check that the client is talking to the correct URLs on the
    server side. Likewise, it is critical to verify that the server is tied properly
    to the database. Furthermore, we want to verify all things are correct in the
    future when we make changes to the database, the URL routes, or just about anything
    else.


    To gain true confidence from automated tests, the efforts have to culminate with
    a focused but small set of end-to-end tests. That we''re not only sure that individual
    parts work well but that the whole application in the integrated form is in good
    shape as well.


    We must take care that end-to-end testing doesn''t get complex and out of hand.
    With a proper plan, design, structure, and limited use, it can serve us quite
    well.


    In this chapter you''ll first learn to set up the end-to-end testing tool Protractor.
    You''ll quickly learn how to write and run tests using Protractor for a third-party
    website. With those bases under your belt, you''ll then explore ways to launch
    the TO-DO application on a web server for integrated testing, seed the database
    with test data, and interact with the application through a browser, all from
    automated tests. You''ll also see what Protractor offers specifically for testing
    apps that use AngularJS.'
