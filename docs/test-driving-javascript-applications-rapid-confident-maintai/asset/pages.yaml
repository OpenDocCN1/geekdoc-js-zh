  md: "As a first step to using Sinon, create a sandbox, like so:\n\n```\nvar sandbox;\n\
    forEach(function() {\n  sandbox = sinon.sandbox.create();\n});\n```\n\nRight away,\
    \ implement the function to restore the original objects, to undo any test of\
    \ doubles, with the afterEach function.\n\n```\nafterEach(function() {\n  sandbox.restore();\n\
    });\n```\n\nNow that we have a sandbox environment created for Sinon, let's explore\
    \ creating and using spies, stubs, and mocks.\n\nCreate a spy for an existing\
    \ function with a call to the spy function:\n\n```\nvar aSpy = sandbox.spy(existingFunction);\n\
    ```\n\nThen to verify if the function was called, use\n\n```\nexpect(aSpy.called).to.be.true;\n\
    ```\n\nThat's an easy way to test if existingFunction was actually used by the\
    \ code test. But the syntax can be a lot more fluent, thanks to the magic of the\
    \ Sinon-Chai module:\n\n```\nexpect(aSpy.called);\n```\n\nTo check if the function\
    \ was called with an argument—let's say “magic”—express that expectation as\n\n\
    ```\nexpress(aSpy).to.have.calledWith('magic');\n```\n\nLet's move on to stubs.\
    \ For a stub to stand in for a call using util.alias('Robert'), write\n\n```\n\
    var aStub = sandbox.stub(util, 'alias')\n  .withArgs('Robert')\n  .returns('Bob');\n\
    ```\n\nThis will create a stub for that function that will stand in only when\
    \ the mentioned argument is passed and will return to the caller value passed\
    \ to the function.\n\nFinally, to create a mock for the same function, write\n\
    \n```\nvar aMock = sandbox.mock(util)\n  .expects('alias')\n  .withArgs('Robert');\n\
    ```"
