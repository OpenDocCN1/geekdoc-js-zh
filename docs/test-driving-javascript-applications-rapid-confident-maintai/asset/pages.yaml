  md: "# Test Angular 2 UI\n\nWhile the tests run, you'll see Chrome simulate the\
    \ user interactions for different actions, albeit at a far greater speed than\
    \ capable even by highly caffeinated users. Overall a total of fourteen tests\
    \ passed. That includes integration tests through the taska.html view.\n\nNow\
    \ that you know how to test AngularJS 1.x UI, let's explore how to use Protractor\
