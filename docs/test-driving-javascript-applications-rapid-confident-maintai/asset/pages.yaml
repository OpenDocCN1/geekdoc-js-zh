    # Wrapping Up


    This chapter walked you through the steps to fully automate the design and implementation
    of the server side of an Express application. We started with a strategic design
    and saw the implementation unfold with each test. You learned how to configure
    the database and design the model functions for automated verification. We also
    explored how to fully test the Express routes functions with the help of stubs,
    spies, and mocks. Along the way we created a validation function that will be
    shared with the client side. The code has a 100 percent test coverage and the
    automated verification was achieved without actually starting the web server.


