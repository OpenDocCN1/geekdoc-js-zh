  md: '# Chapter 2. Test-Drive Your Design • 22


    easier to write the tests. Start with a fairly simple test; don''t worry about
    making it perfect just yet. However, instead of identifying trivial functions
    that get or set, focus on an interesting behavior to start with. Think of a function,
    a unit of code, that is useful, interesting, but not too complex to start with—make
    that your first function to write tests.


    # Focus on Behavior Rather than State


    > Avoid the common antipattern of writing tests for getting and setting state.
    Start, by testing interesting and useful behavior. Let any necessary state fall
    in place along the way.


    When you start the design of a function, visualize the types of tests you''d write
    to verify the behavior of the function. A good way to incrementally develop code
    is through a series of positive, negative, and exception tests. Let''s discuss
    these three types of tests:


    +   **Positive tests** exercise and verify that the code does what''s expected
    when its preconditions are met.

    * **Negative tests** verify that the code gracefully behaves when things don''t
    go as expected—that is, when its preconditions or input are not valid.

    * **Exception tests** verify that if code is supposed to throw an exception, it
    does in fact.


    We''ll explore each of these throughout the book. When thinking of tests, think
    of keeping them FAIR: *fast, automated, isolated, and repeatable.


    +   * Fast tests give feedback loops. If tests are slow, you''ll be tempted to
    run them less often.

    * A major benefit of tests is verification—we''ve discussed why these should be
    automated and not manual.

    * Isolated tests can be run in any order, and you can also run a select few of
    them as you desire or all. No test should require that any other test be run before—such
    tests are brittle and turn into time sinks.

    * Finally, tests should be repeatable; you should be able to run any number of
    times without needing manual or time-consuming setup or cleanup operations.


    As we evolve the design using tests, we should keep everything working at all
    times, so that we''re never more than one step away from functioning code.'
