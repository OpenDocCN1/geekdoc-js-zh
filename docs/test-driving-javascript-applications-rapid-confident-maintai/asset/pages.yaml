  md: "# Create a Component\n\nA component in Angular is the glue between one or more\
    \ services, pipes, and views. In our example, the component has to receive the\
    \ data from the service and render it on a view, with the language names sorted.\
    \ Angular expects several pieces of information from our component:\n\n+   - Which\
    \ tag in the view should it replace the content of the component? The selector\
    \ annotation attribute will convey that.\n\n+   - Which HTML page should it render?\
    \ The templateUrl annotation attribute will detail. Angular also allows a template\
    \ attribute instead of templateUrl. The template will directly refer to the HTML\
    \ templateUrl refers to a file with the HTML content. We will not use template\
    \ since placing HTML in JavaScript is rarely unwise, error prone, and the easiest\
    \ way to turn amiable colleagues into arches enmity.\n\n+   - What services should\
    \ be injected into the component or be available for the parts the components\
    \ depend on? The providers annotation attribute is used for this purpose.\n\n\
    +   - What transformation pipes does the component need? As you may guess, the\
    \ pipes annotation attribute is used for that.\n\nLet's open the src/app/langs/langs.component.js\
    \ file and create the component with the attributes we discussed.\n\n```\nangularspike/src/app/langs/langs.component.js\n\
    (function(app) {\n  app.Component({\n    selector: 'lang-names',\n    templateUrl:\
    \ 'langs.component.html',\n    providers: [ng.http.HTTP_PROVIDERS, app.LangsService],\n\
    \    pipes: [SortPipe]\n  });\n})(window.app || (window.app = {}));\n```\n\nThe\
    \ component is defined using the ng.core.Function function. In the definition,\
    \ we have placed the four annotation attributes we discussed. The selector is\
    \ referring to a lang-names, which will be a tag in an HTML file that will be\
    \ replaced by the view rendered by this component. Speaking of the view, the template\
    \ refers to the file that will be rendered by this component. The providers attribute\
    \ lists the dependencies to be injected. The ng.http.HTTP_PROVIDERS refers to\
    \ the providers that will create the appropriate HTTP object that will be used\
    \ by the service class to talk to the back end. The second value given to the\
    \ providers"
  merge: -1
  pgno: 251
- img_proc: true
  md: "# Spike to Learn Angular • 237\n\nattribute is the constructor or class of\
    \ the service we created earlier. Finally, the pipes attribute refers to the pipe,\
    \ the first class we created for this spike.\n\nThe component class will house\
    \ the model or data that it fetches from the service that the view can display.\
    \ It also needs to hold on the injected service so the functions of the component\
    \ can access them. For this, we'll write the constructor for our component class.\
    \ Place the following code right at the end of the Component section in the src/app/langs/langs.component.js\
    \ file:\n\n```\nangularspike/src/app/langs/langs.component.js\n.Class{\n  constructor:\
    \ [ app.LangsService, function(_langsService) {\n    this.langsService = _langsService;\n\
    \    this.langs = [];\n    this.message = '';\n  }},\n});\n```\n\nThe .Class chain\
    \ calls right at the end of the _Component() function call. The constructor attribute\
    \ takes an array. The first value refers to the service class or constructor that\
    \ will be injected into the constructor function. The second value refers to the\
    \ constructor function. The constructor saves the service into into field named\
    \ langsService. In addition, it initializes two fields—langs and message—to an\
    \ empty array and an empty string, respectively. These fields of the components\
    \ are viewed as models by Angular.\n\nThe HTML file that the component renders—langs.component.html\
    \ in this example—will have bindings to the fields of the components initialized\
    \ in the constructor. We'll see this part when we put all the things together,\
    \ once we complete the implementation of the component.\n\nWe have a need for\
    \ a function, getLangs, which will fetch the data from the service and set the\
    \ appropriate models. If all goes well we need to update the message. If the service\
    \ falters, we need to update the message. But that is too much work for the getLangs\
    \ to do. We'll modularize. Here's the getLangs function; write it in the Class({})\
    \ but after the constructor([...]) code:\n\n```\nangularspike/src/app/langs/langs.component.js\n\
    getLangs: function() {\n  this.langsService.subscribe(\n    this.updateLangs.bind(this),\n\
    \    this.updateError.bind(this);\n  });\n}\n```"
  merge: -1
  pgno: 252
- img_proc: true
  md: "The getLangs function calls the get function of the service that was injected\
    \ into the component. Recall that the get returns an Observable. The Observable\
    \ may send us the data or an error, as we discussed during the implementation\
    \ of the service.\n\nIn the getLangs function, we subscribe to the response from\
    \ the Observable using the subscribe function. This function may take up three\
    \ arguments:\n\n+   - A function that's invoked when the Observable sends a piece\
    \ of data\n- A function that's invoked when the Observable wants to provide an\
    \ error message\n- A function that the Observable may call to tell us it has completed\
    \ and there will be no further data or error\n\nWe provide only the first two\
    \ arguments and ignore the completed message. If data arrives, we pass that to\
    \ an updateLangs function. If an error arrives instead, we pass it to an updateError\
    \ message.\n\nLet's now implement the updateLangs function in the component, right\
    \ after the getLangs function:\n\n```\nangularspike:src/app/langs/langs.component.js\n\
    updateLangs: function(langs) {\n  this.message = '';\n  this.langs = langs.split('\\\
    \\n');\n}\n```\n\nThe function clears any values in the message field: splits\
    \ the given data into an array, with each language name as a separate value; and\
    \ assigns the array to the langs field.\n\nLet's move to the next function. The\
    \ updateError function is quite simple to:\n\n```\nangularspike:src/app/langs/langs.component.js\n\
    updateError: function(error) {\n  this.message = error;\n  this.langs = [];\n\
    }\n```\n\nThis function clears the langs field and sets error details in the message\
    \ field.\n\nThere's one final step we need. Right after the component is ready,\
    \ we want the getLangs function to be exercised automatically without any interaction.\
    \ To perform such actions, Angular provides a special ngOnInit function. If this\
    \ function is present on a component, it's invoked once the document is loaded\
    \ and the DOM is ready. This is much like the traditional onLoad function. Let's\
    \ implement the ngOnInit function next, right after the updateError function:"
