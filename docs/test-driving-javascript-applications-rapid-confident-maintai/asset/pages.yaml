  md: 'For we have to do some research and learn how Angular deals with annotations
    and attributes. Annotations and the related attributes are metadata. They are
    not kept within the class or its instances, but reside separately in a meta-class
    that stores these details. The Reflect¹ class, included through the script tag
    for Reflect.js file, is a gateway to create and obtain metadata. That''s what
    we will use to verify that our component has the necessary annotation attributes.


    The getMetadataKeys function of Reflect will give us a list of keys available
    for a class. We can then use the getMetadata function to get specific attributes
    from any of the keys.


    To understand the metadata better, let''s play again for a moment with the spike
    to explore the metadata for the app.LangComponent. With the spike program running,
    opening the browser to the URL http://localhost:8080. In the console window of
    the browser, enter the commands shown in the following figure and see the response:


    ![](img/6f7b86a11e592b1c82741d22837e0b38_261_0.png)


    We see that for the Reflect.getMetadataKeys(app.LangComponent) the response("parameters",
    "annotations"). This tells us we have two-keys available. We''ll make use of those
    during testing. Then, with the command Reflect.getMetadata("annotations", app.LangComponent)[0].selector,
    we were able to get the attribute''s value of lang-names. This gives us a good
    idea of how we can test for the existence and the value of attributes in our components.


