    ![](img/6f7b86a11e592b1c82741d22837e0b38_298_0.png)


    # # Wrapping Up


    Angular 2.0 is a brand-new rewrite of the AngularJS framework. In this chapter
    we covered a lot of ground with this new tool. You first learned to program in
    Angular using old old JavaScript–ECMAScript 5. Then we dug into the metadata to
    discover the annotations and properties that are needed to configure pipes, services,
    and components in Angular. Along the way we figured out how to use lightweight
    test doubles for the HTTP module and the Rx.Observable. These classes play a vital
    role in communicating with the back-end server. Finally we ran the code coverage
    tool to confirm that our effort was in fact test driven and that no code was written
    without a failing test that prompted its design.


    The automated tests we wrote so far all test code, but in isolation. These tests
    are quite valuable, fast running, deterministic, and rapid feedback. However,
    we can’t get too comfortable and overly confident that all is well. We need to
    ensure the different pieces of code also work when integrated with each other.
    We also want to verify that the events and the models in the HTML files are wired
    appropriately with the components. And we want to use automated tests to confirm
    that as well. We''ll get to that in the next chapter.


