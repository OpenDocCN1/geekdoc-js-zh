  md: '# Create Exception Tests


    JavaScript is dynamic and flexible, which means more power to us, but it''s also
    error prone. For instance, what if isPalindrome is called without any arguments?
    Would the code handle that? Will JavaScript quietly misbehave, or simply blow
    up? We have to think through scenarios like this and program defensively to get
    the most of the language.


    If the parameter is absent we could return false, throw an exception, say music...
    Whatever you decide, express that behavior as a test. If you''d like to design
    the code to throw an exception, express your intention using an exception test.


    An exception test should pass if and only the code fails in the way expected;
    otherwise the test should fail. For the palindrome problem, let''s decide to throw
    an invalid exception if no argument is passed. Let''s write the test first, again
    in palindrome.js file.


    ```

    it(''should throw exception if argument is missing'', function() {

    var call = function() { return isPalindrome(); };

    expect(call()).to.throw(Error, ''Invalid argument'');

    });

    ```


    We wrapped the call to isPalindrome within a function assigned to the call variable.
    In the previous tests we called the code under directly and verified the result.
    We can''t do that here since the test would blow up due to the exception being
    thrown by the code under test. Thankfully the exception is not limited to returning
    only values; you may also pass a function as an argument. If a value is passed,
    expect checks to see if the value matches the expectations specified. On the other
    hand, if a function is provided, then expect defensively calls that function and
    examines any exception that may be thrown. If the function throws the exception
    specified in the throw clause that follows, expect quietly moves on; otherwise
    it reports a failure.


    In the test assert that the function under test is throwing an Error with the
    message "Invalid argument—the first argument to throw is the exception type and
    the second argument is a string or a regular expression for the expected message.
    Use a string, if you like, to match the exact string that is contained in the
    error message. Use a regular expression, if you like, to look for patterns of
    the error message.


    For the exception test to pass, the isPalindrome function has to change. Let''s
    edit the palindrome.js file:'
