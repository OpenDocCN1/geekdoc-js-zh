  md: 'and has no duplicated code to access the elements. Page objects are an invaluable
    part of integration tests. Make good use of them.


    So far you''ve seen how to use Protractor to run tests for both the Google page
    and for the TO-DO app through the jQuery-based UI. Protractor has some special
    things in store for Angular apps, and we''ll explore that next.


    # # AngularJS UI


    Protractor has special features for AngularJS. You saw calls element(by.id(...))
    to get elements on a page. Pages that use AngularJS often use directives like
    ng-model and ng-repeat. Protractor provides convenience functions to access those.
    When you interact with the web pages, Protractor waits for AngularJS to complete
    its processing and updating of the DOM elements and bindings.


    In the TO-DO app, the page tasks.html is AngularJS specific and makes use of the
    TasksController in the taskscontroller.js file. One difference between the files
    tasks and tasks is the former uses ids where the latter has no ids at all. It
    uses a few AngularJS models, bindings, and a repeater. As a result, there''s no
    way to get the elements in the test using the by.id function. That''s where AngularJS-specific
    Protractor functions come in.


    Let''s explore some convenience functions to get locators for different directives:


    | AngularJS Directives | Example | Call to Get the Locator |

    |---|---|---|n| ng-model | ng-model=''...'' | by.model(''...'') |

    | bindings | {{ controller.message }} | by.binding(''controller.message'') |

    | ng-click | ng-click=''...'' | by.css(''[ng-click="..."]'') |

    | ng-repeat | ng-repeat=''task in...'' | by.repeater(''task in...'') |

    | ng-repeat—a row | ng-repeat=''task in...'' | by.repeater(''task in...'').row(index)
    |

    | ng-repeat—columns | ng-repeat=''...'' | by.repeater(''task in...'').column(''task.name'')
    |


    To obtain an element that holds an ng-model, use the by.model function. To get
    to the elements that hold an expression, use the by.binding function. Getting
    an element with ng-click is tricky. For this, get access using the bycss function
    by providing the full ng-click attribute along with its value. The row and column
    functions can get either a single child of the expanded ng-repeat element or a
    particular expression used within the repeater.


    Before we write tests to verify interactions through the tasks.html file, let''s
    write a page object that abstracts the HTML page''s contents for access'
