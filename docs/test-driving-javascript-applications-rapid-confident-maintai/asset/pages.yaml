  md: '# What’s in This Book?


    This book focuses on automated testing and related practices necessary to sustain
    a rigorous development pace. From this book, you''ll learn to apply tools and
    techniques to automatically verify both client-side (including jQuery and Angular)
    and server-side (Node.js and Express) JavaScript applications.


    You''ll learn to effectively use the following tools in this book:


    +   * Karma

    * Mocha

    * Chai

    * Istanbul

    * Sinon

    * Protractor


    While exploring these tools, you''ll also learn and use quite a few design principles
    that lead to lightweight and maintainable code. If you''re already using other
    tools, like Jasmine or Nodeunit, for example, you can readily use the testing
    techniques presented in this book with those tools.


    The book is organized into two parts. Part I covers the fundamentals of automated
    testing. Here, you''ll learn how to write tests, for synchronous and asynchronous
    functions. You''ll also learn how to approach testing when the code introduces
    intricate dependencies. In Part II you''ll apply what you learned in Part I to
    write automated tests for both client side and server side, by test-driving a
    practical example.


    The chapters are organized as follows:


    [Chapter 1, Automation Shall Set You Free, on page 1] brings out the reasons why
    automated verification is critical for sustainable development.


    [Chapter 2, Test-Drive Your Design, on page 11] walks you through the steps to
    create automated tests for both server-side and client-side code with a small
    example. You''ll learn to create a list and develop code incrementally, implementing
    the minimum code for one test at a time.


    Some asynchronous functions take in callbacks while some return a Promise. [Chapter
    3, Test Asynchronous, on page 65] presents the challenges as asynchronous functions
    pose and different ways to test them.


    Dependencies are pervasive in both client and server side. They can make testing
    really hard, brittle, nondeterministic, and slow. [Chapter 4, Tactfully Tackle
    Dependencies, on page 61] demonstrates how to remove dependencies'
