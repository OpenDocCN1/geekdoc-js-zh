    \    console.log(\"unable to connect to the database\");\n    throw(err);\n  }\n\
    });\n```\n\nSince Express by default runs in the \"development\" environments,\
    \ it will use the development database name. Since Protractor runs in the \"test\"\
    \ environment, when it starts the server in the before setup in global-setup.js,\
    \ the test database name referred to in the config.json file will be used instead\
    \ of the development database.\n\n# Seed Data in the beforeEach Setup\n\nGood\
    \ tests don't step on each other's toes. They stay isolated from one another.\
    \ The benefit is that tests can be run in any order, and adding or removing tests\
    \ will not affect existing tests. Databases jeopardize goal if we are not careful.\
    \ An add operation may run into database uniqueness errors if the data already\
    \ exists. Likewise, a delete operation may fail if the data is not present. Other\
    \ operations may also fail when actions performed in one test violate assumptions\
    \ of other tests.\n\nIn order to keep the tests isolated, we should keep the test\
    \ database local to the machine where the tests are run. Sharing a database with\
    \ other developers for testing is like sending an invitation to trouble. The config.json\
    \ file specifies which database to use and that the database is local to your\
    \ system.\n\nBefore each test runs the test database should be wiped out and a\
    \ fresh set of test data be created. That way, each test gets a stable view of\
    \ the world it relies upon and performs its action without fear of being affected\
    \ by other tests.\n\nIf you like to keep different seed data per test suite, put\
    \ the setup code in that suite's beforeEach function. If you like to share the\
    \ seed data across multiple test suites, place it in the beforeEach outside of\
    \ any any code. A good place for this scenario is the global-setup.js function\
    \ that has the before function."
