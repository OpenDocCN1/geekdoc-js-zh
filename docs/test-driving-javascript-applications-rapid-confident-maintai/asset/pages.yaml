  md: '# Leap Into Tactical—Test First—Design


    From the initial design we''ll move on to the tactical design, the act of making
    fine-grained design decisions and implementing code. We''ll use the strategic
    design as a starting point and pick a few functions to begin the design with tests.
    We''ll write positive, negative, and exception tests and along the way we detail
    detailed design decisions. As we transition from one function to next, you will
    see the design and the code for the program take shape, one piece at a time.


    Let''s start by jotting down a series of tests.


    # Create an Initial Test List


    Jot down the tests that come to mind, on a piece of paper—don''t worry right or
    wrong at this time:


    +   - read invokes processTickers if the file is valid

    - read invokes an error handler if the file is invalid

    - processTickers calls getPrice for each ticker symbol

    - getPrice calls the web service

    - For valid response, getPrice updates the prices collection

    - For failed response, getPrice updates the errors collection

    - getPrice calls printReport in the end

    - printReport prints the results in sorted order


    These are some initial tests that come to mind. They will change once the detailed
    design and implementation starts. As we write code, new tests will emerge and
    we will add them to this list. As new ideas for the design emerge—and they will—those
    ideas should readily go in the list as new tests. When a test is implemented,
    we''ll check it off the list.


    Start with a test list, but don''t spend too much time on the list. Once you down
    what comes to mind, break the inertia and get started with the first test. You
    don''t have to follow the sequence in the list. Pick any test you''re comfortable
    with, but favor something interesting and useful to start with.


