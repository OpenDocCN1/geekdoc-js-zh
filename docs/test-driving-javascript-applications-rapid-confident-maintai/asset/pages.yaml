  md: "# Spike to Learn Angular · 233\n\nThe constructor is merely an empty function\
    \ in the pipe. In the transform function we make a copy of the given languages\
    \ array, sort, and return the sorted list of names.\n\nWe gave the name for our\
    \ pipe. That's the name users of our pipe will use, much like the name uppercase\
    \ used to refer to Angular's built-in pipe class UpperCasePipe.\n\nOur pipe is\
    \ ready to transform a collection of names. Let's fetch the collection of names\
    \ from the server. We need a service class for that.\n\n# Create a Service\n\n\
    Much like AngularJS 1.x, a service class takes on the responsibility of Angular\
    \ talking to the back-end services. The service will know and encapsulate URL\
    \ it needs to talk on the back end, what type of request to send, and how to process\
    \ the response received.\n\nThe service will need an HTTP object to make Ajax\
    \ calls. Directly depending on an HTTP object will make testing rather hard. Dependency\
    \ injection is the way of life in Angular and the HTTP object will be injected\
    \ into the service. During normal execution, it will be a real instance of the\
    \ ng.http.Object. During test runs, as we'll see later, a mock for the object\
    \ will be used.\n\nA service is a class in Angular with a constructor annotated\
    \ to inject the necessary dependencies. Let's first define the service class LangService\
    \ with the necessary constructor. Open and edit the src/app/langs/service.js file\
    \ in the current workspace and enter the following code:\n\n```\nangularjs/src/app/langs/service.js\n\
    (function)(app) {\n  app.LangService = ng.core.Class({\n    constructor: [ng.http.Http,\
