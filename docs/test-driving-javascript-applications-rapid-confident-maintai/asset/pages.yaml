    # Verify Dependency Injection


    You learned from the spiking exercise the syntax necessary to perform dependency
    injection. We need two things: we have to set a new providers attribute and change
    the constructor attribute to specify the classes/constructors that will be used
    for injection. Let''s take care of the first one.


    > It''s easy to lose sight of why we write some boilerplate code when working
    with frameworks. Program—express your intentions through tests and then write
    the minimum code to fulfill those expectations.


    Let''s add the following test to the component test suite:


    ```

    angular2/todo/test/client/app/tasks/tasks.component-test.js

    it(''should register necessary providers'', function() {

    var componentAnnotations = {

    Reflect.getMetadata(''annotations'', app.AppComponent)[0];

    var expectedProviders = [

    [ng.HTTP.PROVIDERS, app.TasksService, app.TasksSortPipe];to.be(expectedProviders)]

    };

    expect(componentAnnotations.providers).toEqual(expectedProviders);

    });

    ```


    The test fetches the providers annotation using the Reflect class''s getMetadata
    function—much like how we got the selector attribute earlier. It verifies that
    the value set for the attribute is the expected series of values.'
