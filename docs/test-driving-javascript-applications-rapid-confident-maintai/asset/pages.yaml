  md: "# Chapter 10. Integrate and Test End-to-End • 302\n\nThat's quite an accomplishment\
    \ for just one test at the highest level. But there are a few more things that\
    \ need to be verified. For example, the tasks should also show up in the task\
    \ list. Let's write a test for that, in the testendtoendo/test/integration/tasksj-test.js\
    \ file:\n\n```\ntestendtoendo/test/integration/tasksj-test.js\nit('should display\
    \ tasks on the page', function() {\n  expect(element(by.id('tasks')).getText()\n\
    \    .to.eventually.contain('Test Models');\n  expect(element(by.id('tasks')).getText()\n\
    \    .to.eventually.contain('Test UI');\n});\n```\n\nThis test was not much different\
    \ from the previous test in the terms of the effort. It checks that the div element\
    \ has the test for at least two of the four tasks in the task list. You might\
    \ be tempted to add more tests to verify that the dates are showing up, but that's\
    \ unnecessary at this level. That was easily verified with lower-level tests.\
    \ Likewise, in the integration test, there's no need to verify that the task list\
    \ is sorted order of year, month, day, and name. That's also taken care by the\
    \ lower-level tests.\n\nThe two tests were so far verified that some information\
    \ appears expected on the page when it is loaded. The next test to verify the\
    \ add task operation needs to do more. Once the page is loaded, the user could\
    \ enter data for a new task and click the submit button. The test has emulate.\
    \ The sendKeys and click functions of Protractor API that we use in the example\
    \ will come in handy for Protractor. Let's use those functions in the test.\n\n\
    ```\ntestendtoendo/todo/test/integration/tasksj-test.js\nit('should successfully\
    \ add a task', function() {\n  element(by.id('name')).sendKeys('Create Quality\
    \ Code');\n  element(by.id('date')).sendKeys('12/15/2016');\n  element(by.id('submit')).click();\n\
    \n  expect(element(by.id('message')).getText()\n    .to.eventually.contain('task\
    \ added');\n  expect(element(by.id('tasks')).getText()\n    .to.eventually.contain('Create\
    \ Quality Code');\n});\n```\n\nThis test is not an innocent one- or two-liner.\
    \ The first two lines set the test into the respective input text fields and then\
    \ emulates the click of the button. In the assertion phase the test verifies that\
    \ the message has updated and the task list has the new task. There's no need\
    \ to verify the tasks count since lower-level tests verify that. The success of\
    \ this test will confirm the proper wiring of the HTML page and the client-side\
