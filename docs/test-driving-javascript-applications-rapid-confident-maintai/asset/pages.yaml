  md: "# Chapter 10. Integrate and Test End-to-End • 304\n\n+   4. **Tight coupling\
    \ on the API:** Each of the tests directly depends on the Protractor API. If we\
    \ decide to use a different API or if Protractor changes the API in a future version,\
    \ we are out of luck.\n\nThese problems can become severe with growing tests,\
    \ but they're quite easy to fix if addressed early on. We'll use a *page* object\
    \ for that.\n\nA page object abstracts the contents of a page. The tests, instead\
    \ of directly interacting with the browser object and the functions to access\
    \ the parts of an HTML page, can use a page object. This object in turn will perform\
    \ the interactions with the browser. The benefits are reduced noise, less duplication,\
    \ and loose coupling.\n\nLet's get a feel for using a page object before we create\
    \ one.\n\nA test:\n\n```\ntestdentoedo/todo/test/integration/taskjs-test.js\n\
    it('should successfully add a task', function() {\n  element(by.id('name')).sendKeys('Create\
    \ Quality Code');\n  element(by.id('date')).sendKeys('12/15/2016');\n  element(by.id('submit')).click();\n\
    \n  expect(element(by.id('message'))).getText()\n    .eventually.contain('task\
    \ added');\n  expect(element(by.id('tasks'))).getText()\n    .eventually.contain('Create\
    \ Quality Code');\n});\n```\n\nwill change to like the following, with the use\
    \ of a page object, to become concise, expressive, and easier to maintain:\n\n\
    ```\ntestdentoedo/todo/test/integration/taskjs-usage-test.js\nit('should successfully\
    \ add a task', function() {\n  page.name = 'Create Quality Code';\n  page.date\
    \ = '12/15/2016';\n  page.submit();\n\n  eventually(page.message).contain('task\
    \ added');\n  eventually(page.tasksAsText).contain('Create Quality Code');\n});\n\
    ```\n\nThere's so much clarity and less clutter in the modified version compared\
    \ to the one that directly uses the Protractor API.\n\nNow that we know the benefit\
    \ of page objects, let's create one. We need two files: a page class and a convenience\
    \ function.\n\nEach page in the application that is used in any of the tests will\
    \ have a page object. Any part of the page that's accessed from a test, be it\
    \ a simple read,\n\nreport erratum • discuss"
