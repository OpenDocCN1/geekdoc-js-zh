  md: '# CHAPTER 9


    # Test-Drive Angular 2


    Angular 2—we refer to it here on as Angular—is a total rewrite of the AngularJS
    framework. The complete revamp was based on feedback and learnings from the extensive
    use of AngularJS 1.x in the industry. Angular is written using TypeScript. It
    was created with speed and performance improvements in mind. This chapter uses
    Angular 2 release candidate 4 (rc-4).


    Creating Angular applications is quite different from creating AngularJS 1.x applications.
    So, testing Angular applications is also different. Angular applications are built
    using components, services, and pipes, and all these are configured using annotations.
    Furthermore, the dependencies for components and services are injected more explicitly
    in Angular than in AngularJS 1.x. This makes automated testing of Angular simpler
    and easier than testing AngularJS 1.x code.


    Angular applications may be developed using TypeScript, Dart, or JavaScript. This
    book is focused on test-driving JavaScript applications, so we will not focus
    on TypeScript or Dart. To develop with JavaScript, you may use either ECMAScript
    5—the old JavaScript—or ECMAScript 2015. Currently the commonly used browsers
    support ECMAScript 5. To use ECMAScript 2015 you''ve have to invest significant
    time to configure tools that polyfill features.


    Since we''re on learning about test-driving applications, we''ll keep the distractions
    low by using ECMAScript 5 in this chapter. That will help keep our focus on learning
    about test automation, and we won''t be dragged into the myriad of tools we''d
    need to use ECMAScript 2015. If you decide to transition from ECMAScript 5 to
    ECMAScript 2015, it will be relatively easy since you will already know how to
    write tests and the code in ECMAScript 5.'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'In this chapter you will learn how to test-drive Angular applications by creating
    an Angular version of the client side for the TO-DO application. But first, since
    it''s impossible to test-drive code when it''s not clear how to implement it,
    we will start with a short spike and create a fully working program in Angular.
    Then, we will apply knowledge to test-drive an Angular front end for the TO-DO
    application we created in the earlier chapters.


    # Spike to Learn Angular


    Your end goal is to learn about test-driving Angular applications so you can reap
    the benefits of automated verification on Angular projects. You will use the TO-DO
    app as a vehicle to learn, but first you need to get comfortable with writing
    Angular code. To achieve that, let''s create a spike that has the parts that any
    typical Angular application will have.


    The spike we create will fetch a list of language names from the server and display
    them in sorted order. We want to keep our focus on Angular and don''t want to
    get dragged into any server-side code when creating this spike. In that mind,
    we will keep the language names list in a plain-text file and fetch it using an
    Ajax call from Angular code.


    # Pipes, Services, and Components


    Angular separates the various concerns we have to deal with into separate classes.
    Let''s take a minute to get familiar with the major parts of an Angular application.


    +   - Pipes: These are transformation functions. They take in a piece or a collection
    of data and return a transformed result. For example, given a sentence, we may
    want to replace any foul word with asterisks but keep the good words as is. A
    custom WordFilterPipe would serve that purpose.


    +   - Service: These are the classes that will talk to the back-end services.
    They make HTTP calls and know how to extract the data from the services. They
    also gracefully deal with any error communicating with the services.


    +   - Components: These are the glue between the data that we obtain from the
    services and the view of the data. They work with services to get or send data
    and use pipes to transform the data. They also tell us where or how the data will
    be rendered.


    We will create each of these types of Angular classes in our spike. Let''s get
    a project ready so we can write some code.'
  merge: -1
