    The reason to test-drive the design and code is not to attain perfection, but
    to arrive at a better design and enable fast and reliable regression. The approach
    does not, however, guarantee zero bugs. When you find a bug or one is reported,
    write tests that fail due to the presence of the bug. Then fix the code and ensure
    all tests pass. This small step will prevent the bug from reentering the code
    at a future date.


