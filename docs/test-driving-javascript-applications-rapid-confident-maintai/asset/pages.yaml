    # Who Is This Book For?


    If you program in JavaScript, this book is for you. Programmers, hands-on

    architects, team leads, technical project managers, and anyone who wants

    to create maintainable JavaScript applications at a sustainable pace

    will benefit from this book.


    The book assumes readers are familiar with JavaScript—it does not

    teach any of the language features. Different parts of the book also assume

    ofamiliarity with technologies used to create examples in that part. Integrate

    Chapter 8, Using AngularJS, on page 195 and parts of Chapter 10, Integrate\and
    Test End-to-End, on page 285 ensures that the readers know AngularJS 1.x,

    but the rest of the book does not depend on that knowledge.


    Every page in this book has something for programmers to directly apply on

    t projects, be unit testing, integration testing, code coverage, or simply

    learning about reasons to practice the techniques. Architects and technical

    leads can use this book to guide their teams toward better technical practices

    that have an impact on a sustainable pace of development. Technical project

    managers can learn the lessons to test-drive JavaScript applications, under-

    stand the levels and size of testing, and decide how their team can approach

    automated testing. They can also use the book to motivate their teams to create

    applications with rapid feedback loops.


    If you''re already familiar with these techniques, you could use this book to

    influence and train other developers.


    This book is written for software practitioners who extensively use JavaScript

    and care about their craft.


    # Online Resources


    You can download all the example source code for the book from the Pragmatic

    Bookshelf website for this book. You can also provide feedback by submitting

    errata entries or posting your comments and questions in the forum.


    If you''re reading the book in PDF form, you can click on the link above a a code

    listing to view or download the specific examples.


