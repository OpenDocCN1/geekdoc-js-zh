  md: "Chapter 9. Test-Drive Angular 2 • 268\n\n```\ntestangular2/todo/test/client/main-test.js\n\
    describe('main tests', function() {\n  var handler;\n\n  document.addEventListener\
    \ = function(event, handler) {\n  if(event === 'DOMContentLoaded') {\n    handler\
    \ = handler;\n  }\n};\n\n  it('main registers TasksComponent with bootstrap',\
    \ function (done) {\n    ng.platformBrowser.bootstrap(function (component) {\n\
    \      expect(component).toBe(app.TasksComponent);\n      done();\n    });\n \
    \   handler();\n  });\n});\n```\n\nRight within the test suite we stub out the\
    \ addEventListener function. In the stub we verify that the parameter is passed\
    \ the expected event name. If it is, we saved the provided event handler in the\
    \ handler variable. Then with the test, we stub the bootstrap function and in\
    \ it we verify that the passed-in argument is the component we. Finally, we invoke\
    \ the saved handler function, which refers to the registered event handler. When\
    \ the event handler calls the bootstrap function, which is supposed to, to the\
    \ verification will succeed and the test will pass.\n\nImplement the necessary\
    \ code in the public/src/main.js file:\n\n```\ntestangular2/todo/public/src/main.js\n\
    (function (app) {\n  document.addEventListener('DOMContentLoaded', function()\
