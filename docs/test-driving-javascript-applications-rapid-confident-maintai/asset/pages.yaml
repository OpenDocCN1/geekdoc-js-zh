    to the server was modularized and reused among the different functions that needed
    to interact with the server. Also, the task validation code created in the previous
    chapter was reused on the client side.


    In this chapter you learned how to approach testing the client side. We tested
    code that manipulated the DOM and also code that interacted with the server side.
    We tested both code that used built-in functions and code that relied on the jQuery
    library. You''re all set to readily apply these techniques for the client side
    of your applications.


    While jQuery has been popular for years, AngularJS is gaining traction. It provides
    greater convenience for programming the client side, due to its ability to synthesize
    code to manipulate the DOM. In the next chapter we''ll explore test-driving code
    that uses AngularJS.'
