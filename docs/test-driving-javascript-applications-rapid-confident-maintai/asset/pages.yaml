  md: "+   * Spies: Unlike the other three, spies stand as proxies in front of the\
    \ actual dependency. They interact with the real service while stabbing or mocking\
    \ some parts. These are useful when interaction with the actual service during\
    \ testing is not an issue but we still want to verify the interactions or mock\
    \ out select parts.\n\nDepending on the particular dependency you run into, you'll\
    \ reach for one of these tools. You'd use stubs to verify state you'd use mocks\
    \ to verify behavior. In other words, if you're interested in checking if the\
    \ code under test sets an appropriate state into dependency, you'd use a stub.\
    \ On the other hand, if your interest is to verify that the code under test calls\
    \ the right methods in order, you'll use a mock.\n\nIn the rest of this book,\
    \ you'll use stubs, mocks, and occasionally spies to come the rescue when tackling\
    \ dependencies. Now that we know how they can help, let's put them to use to write\
    \ the automated tests for the setLocation function.\n\n# Inject the Dependencies\n\
    \nDependency injection is a popular and common technique to replace a dependency\
    \ with a test double. Rather than the code under asking for its dependency, the\
    \ dependency is injected—our industry likes fancy words—that is, passed in as\
    \ an argument at the time of call. Let's learn about this technique using the\
    \ setLocation function as an example.\n\nWe discussed the setLocation function\
    \ should set the location property on a window object. What would otherwise be\
    \ a very complex test to write out becomes a simple test if we pass—ahem, inject—a\
