- img_proc: true
  md: 'Sometimes, we may be tempted to assume that it''s impossible to write automated-tests.
    Let''s not confuse our lack of knowledge or skill with impossibility. Impossibility
    is dire, but lack of knowledge or skill is curable. We may not know how to do,
    but we can learn from others and collaborate to achieve the goals. Automated testing
    is a skill; it''s easier to learn and implement when we are motivated.


    # How to Approach Automated Testing


    Programmers rarely have writing code, but they find it extremely hard to write
    tests before writing code.


    One reason for that is programming is really a series of small experiments carried
    in sequence, every single day—it''s an act of continuous discoveries. We write
    some code, see it fail, read up a bit, give it another shot, try out a few paths,
    through small trials and errors we get the code to work—that''s natural, that''s
    how we write code.


    When we don''t have a clear picture of the code, how can we write tests first?
    It seems counterintuitive, but there are ways to work that in.


    +   Take small steps

    Divide and conquer

    Spike to learn


    First, *take small steps*. If a test appears too hard to implement, the chances
    we''re taking on way more than we should. In order to implement a function using
    test-first coding, we''d have to work through a series of tests: three, five,
    or maybe fifteen tests. Think of each test as a step in a stairway—each one is
    small, spaced comfortably and moves us with each step we take.


    Second, *divide and conquer*. If a test is hard to write for a function, maybe
    that function we''re designing is not as cohesive as it should be or it may more
    coupling than desirable. It''s a sign that we may have to break the function we
    have in mind into smaller functions and drive each of them through tests.


    Third, *spike to learn*. If the function you''re designing is similar to what
    you''ve done several times before, then write one test at a time and the minimum
    code to make each test pass. On the other hand, if you are pretty new to the implementation
    of a function—it''s complex, asynchronous, or very elusive—don''t try to write
    a test for it right away. Instead, create isolated spikes to learn. Let''s explore
    how to spike a bit further.'
