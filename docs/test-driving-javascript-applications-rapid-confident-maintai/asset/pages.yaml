- img_proc: true
  md: "this example, uppercase and lowercase are pipes—in fact, they're among the\
    \ few built-in pipes in Angular.\n\nThere are currently only few built-in pipes\
    \ in Angular; more may be provided later by the authors of the framework and by\
    \ third parties. To create our own pipe in Angular, we have to decorate a class\
    \ with a Pipe attribute and provide a name and a transform function. A pipe's\
    \ transform function is called automatically when the data flows through a pipe\
    \ sequence in which the pipe is involved.\n\nWe're ready to create our first Angular\
    \ client-side code. We will follow the Angular convention where filenames will\
    \ include the words pipe, component, or service depending on what they contain.\n\
    \nLet's create a pipe to sort a collection of names, using the good old JavaScript\
    \ syntax. Edit the empty file src/app/langs/sort.pipe.js in the current workspace\
    \ and enter the following code:\n\n```\nangularspike/src/app/langs/sort.pipe.js\n\
    (function (app) {\n  app.SortPipe = ng.core\n    .Pipe({\n      name: 'sort',\n\
    \      constructor: function() {\n        transform: function (languages) {\n\
    \          return languages.slice().sort();\n        }\n      }\n    });\n})(window.app\
    \ || (window.app = {}));\n```\n\nLet's first read the last line of this. We're\
    \ calling the function created in this file with window as an argument, if variable\
    \ exists. If it does not exist, we create the window.app variable, initialize\
    \ it to an empty JSON object, and pass it as the argument. The purpose of window.app\
    \ is that all of our stuff—pipes, services, and components—will be created as\
    \ members of this JSON object. We do not pollute a global namespace and accidentally\
    \ collide or replace any existing classes or functions.\n\nWithin the function,\
    \ we define the pipe class SortPipe. It's Angular convention to suffix pipe with\
    \ the word Pipe, services with the word Service, and components with the word\
    \ Component. We use the builder pattern to create and annotate classes in Angular,\
    \ using a chain of function calls. We first annotate the class with the Pipe annotation,\
    \ using the ng.core.Pipe function. It takes an attribute name, which is set to\
    \ the value sort in this example. Then we define the details of the class, using\
    \ the ng.core.Class function, and provide it with the constructor and the necessary\
    \ transform function."
