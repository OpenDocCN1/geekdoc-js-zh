  md: '# Test-Drive Express Apps


    Express is lightweight and makes writing Node.js web apps a breeze. With Express
    you don''t have to write any code to read and render HTML files. You don''t need
    to parse the query strings or manually map the URL paths or routes to handler
    functions. Simply configure the necessary details and the framework takes care
    of the rest for you.


    It''s great that Express does so much, but it may not always be clear how to automate
    the tests for code written in Express. That''s because, when a request arrives,
    Express invokes the appropriate routes function and pushes the response to the
    client after the function completes. The code we write to handle the requests
    is not called directly from an application''s code. Instead, it''s invoked by
    Express when requests arrive. It''s for such code we want to write automated tests
    that run fast and can be repeated easily.


    Furthermore, the routes functions invoke model functions that interact with the
    database. When that happens, we want to verify that the model properly perform
    their logic and correctly interact with the database.


    In this chapter you''ll learn to set up and test the database connection for MongoDB.
    You will then learn to design the model functions to interact with the database
    in a way that it can be stubbed out easily during testing. Once you mastered testing
    of the models, you''ll learn with these techniques under your belt, you''ll soon
    be on your way to fully automating and verifying your own Express apps.


