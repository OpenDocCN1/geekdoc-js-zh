  md: "design issue. By carefully structuring code, we can perform fully automated\
    \ testing of Express apps. Let's see an example.\n\n# Maintenance Cost Is Part\
    \ of Development Cost\n\nFrameworks like Express reduce the time and cost of creating\
    \ code. Automated verification has the same benefit when changing code. To lower\
    \ the overall development cost, we want to reduce both the coding cost and the\
    \ maintenance cost.\n\nWe're going to test-drive a TO-DO Express app. It's intentionally\
    \ small so we can keep the focus on learning automation. The program will maintain\
    \ a persistent list of task names with the expected date of their completion.\
    \ The application will respond to a /tasks URL route with one of the following\
    \ HTTP methods:\n\n+   * GET: return a list of all tasks in the database\n * GET:\
    \ given an id, return the task for that id\n * POST: add a task to the database\n\
    \ * DELETE: remove a task with a given id from the database\n\nLet's create a\
    \ high-level design first.\n\n# Create the Strategic Design\n\nWe'll need one\
    \ file, task.js, to register the routes and one model file, task.js, with functions\
    \ to interact with the database. We'll use MongoDB for persistence, with one collection\
    \ that contains tasks with the following format:\n{ 'name': string, 'month': number,\
    \ 'day': number, 'year': number }\n\nOnly the model will depend on the database;\
    \ the routes should have no knowledge about persistence. This is a good idea,\
    \ but we have to go a step further. It's better to avoid tight coupling the model\
    \ to the database as well. That's, if the model were to directly depend on the\
    \ database connection, it would be really hard to automate the tests of the model\
    \ functions. To avoid this problem, we use dependency injection to decouple the\
    \ model from the actual database connection. Then, the application can inject\
    \ a connection to the production database, while the tests inject a connection\
    \ to the test database. When put that way sounds complicated, but thankfully it's\
    \ really easy to code.\n\nThe figure on page 123 shows the big picture of the\
    \ strategic design."
