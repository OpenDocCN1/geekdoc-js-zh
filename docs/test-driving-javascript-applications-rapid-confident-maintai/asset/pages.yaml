    \ and longitude', function() {\n  var createURLSpy = sandbox.spy(window, 'createURL');\n\
    \  var position = { coords: { latitude: 40.41, longitude: -105.55 } };\n  onSuccess(position);\n\
    \  expect(createURLSpy).to.have.been.calledWith(40.41, -105.55));\n});\n});\n\
    ```\n\nIn the test, we first created a spy for the createURL function. The spy\
    \ will merely intercept—spy is probably a better way to think—and record the parameters\
