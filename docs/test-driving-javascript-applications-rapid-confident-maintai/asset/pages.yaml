    \ verify that the most basic test works, confirming that the test environment\
    \ is OK.\n\nsupports there style of assertions: *assert*, *expect*, and *should*.\
    \ Which style to use is purely a matter of personal choice. The *expect* style\
    \ is quite fluent, expressive, and pleasant to read, so that's the style we'll\
    \ use in this book.\n\n# Verifying a Function's Behavior\n\nThe first test gives\
    \ us feedback about the setup and got us moving. Let's continue momentum by writing\
    \ the second test. In this warm-up exercise, we're writing tests to verify the\
    \ behavior of an f2 function that converts inputs from one unit of measure to\
    \ another. In the next test, let's verify that the function properly converts\
