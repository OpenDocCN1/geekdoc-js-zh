  md: '# Get to Know Protractor


    Protractor is one of many testing tools that automate browser-based interactions.
    It can be used to script data entry into web forms, perform button clicks, and
    verify the details returned by a website. Selenium is the most popular among the
    tools. Protractor makes use of Selenium, runs on Node.js, and provides a fluent
    JavaScript API to interact with different parts of an HTML page. For programmers
    using JavaScript, the fluency and convenience of Protractor gives a far better
    automation experience than using Selenium.


    To test the TO-DO application created in the previous chapters, we need to get
    a few things set up. While it''s not much code to write, there''s a lot of details
    to consider. Trying to figure out those before giving Protractor a try can get
    overwhelming and frustrating. Instead, first write a few Protractor tests to access
    the Google search page. Since this is ubiquitous and already running, it will
    give you a direct exposure to the capabilities of Protractor with the least effort.
    After learning how to use Protractor, you can take on the task of testing the
    TO-DO app by setting the server, seeding the database with sample data, and running
    the integration tests.


    Let''s first discuss why Protractor is a great tool for integrated end-to-end
    testing. Then we''ll get the tool installed and run some tests with it.


    # Reasons to Use Protractor


    Among the UI-level testing tools, Selenium arguably being the most popular, Protractor
    has a few benefits:


    +   - It runs in Node.js. That means you can write UI-level tests much like the
    other tests you''ve written so far—using Mocha.


    +   - Protractor can act as a proxy and a wrapper around the Selenium WebDriver.
    You get all the power of Selenium, plus some extensions, but with a more fluent
    and expressive API. Tests written to use Protractor are a lot more concise compared
    to tests that directly use the WebDriver.


    +   - A direct connect feature of Protractor can bypass Selenium and interact
    directly with Chrome and Firefox. As a result, your direct connect tests run faster
    than the ones running through the WebDriver. Also, with this feature, you''ll
    have to deal with fewer moving parts. That, in turn, makes the test runs less
    brittle.'
