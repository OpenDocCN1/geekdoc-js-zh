  md: "The final test to delete a task needs a click of a delete link next to a task\
    \ in the tasks table. Since there are multiple delete links, we should select\
    \ one in the test. Let's choose the second link, index 1, so that the second task\
    \ will be deleted. To get a locator using the text of the link, we use byLinkText\
    \ of the Protractor API. Then to get all the elements that match locator, we use\
    \ the element function. Finally the function returns the element at the given\
    \ index.\n\n```\ntestendodont/to/test/integration/tasksj.test.js\nit(`should successfully\
    \ delete a task`, function() {nn  element.all(by.linkText('delete')).get(1).click();\n\
    \  expect(element(by.id('message'))).getText()\n    .to.eventually.contain('task\
    \ deleted');\n  expect(element(by.id('tasks'))).getText()\n    .to.eventually.not.contain('Test\
    \ Routes');\n});\n```\n\nSave and make sure all the four tests pass. That completes\
    \ the integration tests needed for the application through the jQuery implementation.\n\
    \nThe content of tasks.html, which is linked to the scripts that manage the DOM\
    \ using built-functions, is very similar to the taskj.html file. You may practice\
    \ writing integration tests through that file. We still need to verify that the\
    \ AngularJS implementation is integrated well with the tasksa.html file, but before\
    \ we'll make an effort to reduce the noise, coupling, and duplication in the integration\
    \ tests.\n\n# Let’s Use a Page Object\n\nThe integration tests were not really\
    \ that complicated, but if we're not careful they can get cumbersome. There are\
    \ four major problems in the integration tests we wrote:\n\n+   1. **Noisy**:\
    \ The code to access the elements and to verify the contents is noisy. Less noise\
    \ would result in easier-to-maintain tests.\n2. **Duplication**: The code to get\
    \ an element, like tasks or message, for example, is duplicated throughout the\
    \ tests. Less duplication would mean fewer errors and make it easier to deal with\
    \ the pages.\n3. **Tight coupling on page implementation**: Suppose, for whatever\
    \ reason, the span element that displays the tasks count is to have a class instead\
    \ of an id. All the tests that use this element will have to change—this is a\
    \ direct consequence of both tight coupling and duplication. The same issue exists\
    \ for each one of the DOM elements accessed from the tests."
