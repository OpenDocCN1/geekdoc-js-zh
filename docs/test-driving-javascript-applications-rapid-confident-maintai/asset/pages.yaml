- img_proc: true
  md: "# testdomjquery/todo/test/client/tasks-test.js\n\n```\nit('callService should\
    \ send error response to callback', function() {\n  var callback = sandbox.mock().withArgs(404,\
    \ '.err..').atLeast(1);\n\n  callService(method: 'GET', url: '/tasks'}, callback);\n\
    \  xhr.requests[0].respond(404, '..err..');\n\n  callback.verify();\n});\n```\n\
    \nThe test passes jQuery, and the code handles this situation. When we look at\
    \ using XMLHttpRequest, we'll need some extra code for this test—stay tuned.\n\
    \nThere's one glitch—XMLHttpRequest is a chatty API. It may trigger the onreadychange\
    \ multiple times, let us know the connection was established, the request was\
    \ received, the request is being processed, and finally the request finished and\
    \ the response is ready. Very rarely do we care about these events; only the last\
    \ one—which has a readyState of 4—is of interest. Let's write a test to verify\
    \ that the callback is called only when the final response is ready.\n\n# testdomjquery/todo/test/client/tasks-test.js\n\
    \n```\nit('callService should send only when final response received', function()\
    \ {\n  var callback = sandbox.spy();\n  callService(method: 'GET', url: '/tasks'),\
    \ callback);\n  expect(callback.count()).to.equal(0);\n});\n```\n\nThe test will\
    \ fail right now the callback to callService is called when any of the events\
    \ are raised by xhr—at least one will be raised when the code calls send. Let's\
    \ change the implementation of callService to trigger the callback only if the\
    \ readyState is 4 and the test pass.\n\nHere's the current implementation of callService\
    \ to call the back end, created fully driven, without the actual server running.\
    \ Pretty right, eh?\n\n# testdomjquery/todo/public/javascript/src/tasks.js\n\n\
    ```\nvar callService = function (options, callback) {\n  var xhr = new XMLHttpRequest();\n\
    \n  xhr.open(options.method, options.url);\n\n  xhr.onreadychange = function()\
    \ {\n    if(xhr.readyState === 4) {\n      callback(xhr.status, xhr.response);\n\
    \    }\n  }\n  xhr.send();\n};\n```"
  merge: -1
  pgno: 189
