    \ function. We need to mock out the subscribe function and verify that the parameters\
    \ passed to it are the functions returned by the 'bind' functions we stubbed out.\
    \ That's going to take some effort—we'll use Sinon to create the stubs and the\
    \ mocks.\n\nBy changing the test suite to add a few new variables, change the\
    \ beforeEach function, and then add the afterEach function. In the suite, client/app/tasks/tasks.component-test.js,\
    \ we currently have this setup code:\n\n```\nvar tasksComponent;\nbeforeEach(function()\
    \ {\n  tasksComponent = new app.TasksComponent();\n});\n```\n\nChange it to the\
    \ following:\n\n```\nvar sandbox;\nvar tasksComponent;\nvar tasksService;\nvar\
    \ observable = { subscribe: function() {} };\nvar updateTasksBindStub = function()\
    \ {};\nvar updateErrorBindStub = function() {};\nbeforeEach(function() {\n  tasksService\
    \ = {\n    get: function() {},\n    add: function() {},\n    delete: function()\
