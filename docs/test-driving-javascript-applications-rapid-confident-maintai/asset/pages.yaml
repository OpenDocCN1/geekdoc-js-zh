- img_proc: true
  md: '• It’s slow. These tests need the entire application to be up and running:
    the client side, the server side, the database, and connections to any external
    services that may be needed. Running thousands of tests with full integration
    is often much slower than running isolated tests.


    • It’s hard to write. One of my clients struggled for over six months to write
    a UI-level test for a simple interaction. We eventually discovered the problem
    by the timing of the tests compared to the running of the client-side JavaScripts
    that produced the results.


    • It does not isolate the problem area. When a UI-level test fails, we only know
    something is amiss—can’t tell really where or at what level.


    • It does not prevent logic in the UI. We all know putting logic in UI is bad,
    yet we’ve all seen it permeate and duplicate at this level. UI-level tests do
    nothing to mitigate this.


    • It does not influence a better design. UI-level tests don’t discourage the so-called
    “big ball of mud”—the opposite of modular code.


    Mike Cohn suggests in Succeeding with Agile: Software Development Scrum [Coh09]
    the idea of a test pyramid—more tests at the lower levels and fewer end-to-end
    tests at the higher levels.


    ![](img/6f7b86a11e592b1c82741d22837e0b38_23_0.png)


    We should follow the test pyramid rather than falling into the traps of the ice-cream
    cone antipattern. Writing more tests at the lower levels has many benefits. The
    tests at the lower level run faster, they’re easier to write, and provide shorter
    feedback loops. They also lead to better modular design, and as a result, it gets
    easier to isolate and identify problems when they happen.'
