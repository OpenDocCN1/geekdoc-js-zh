- img_proc: true
  md: '# CHAPTER 5


    # # Test-Drive Node.js Apps


    In part 1, we covered various techniques for writing automated tests, verifying
    the behavior of asynchronous functions, and tackling dependencies. We''re now
    ready to put them all together as test-drive the design and implementation of
    an entire Node.js application, from start to finish.


    Node.js has emerged as a popular JavaScript runtime for the server side. It''s
    a powerful environment and a lot of fun to code. But how do you tell if the code
    actually works, for various inputs, the different edge cases, through network
    failures, and when some files go missing? Running the application manually and
    trying out different scenarios is not an option you come here for. This chapter
    will walk you through, step by step, how to create a fully functional Node.js
    application using tests to drive the design.


    We''ll create an application that will report the prices of various ticker symbols.
    We''ll build the app in two stages: as a standalone program, and then extended
    to provide a web interface. The application will read a list of tickers from file,
    get the stock prices from Yahoo Finance, and print the latest prices for each
    symbol in sorted order. The program will also gracefully handle errors from file
    operations and network access.


    With the skills gained to drive a full-fledged application, you''ll be ready to
    apply these techniques to your everyday programming projects.


    # ## Start with a Strategic—Just Enough—Design


    In the yesteryears of waterfall development, we did big up-front design and tried
    to figure out a lot of the details before coding start, but that didn''t go well.
    The world is agile, but does that means no design? Sadly that''s how it turned
    out for some developers, but it''s not helping. Both extremes—big up-front versus
    little design—are dangerous and counterproductive.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# Chapter 5. Test-Drive.Node.js Apps • 92


    It''s better to start with a strategic design—a high-level design that will help
    us assess the overall problem at hand and get a big picture, with just enough
    details. The details that emerge are not set in stone. The strategic design will
    give us an idea of the complexity, help us identify important areas for the detailed
    design, and set us on a direction to start coding.


    Following a short strategic step, we will move forward to a more detailed, tactical
    design—this is the design that lives in code and involves both thinking and typing.
    This is where we spend most of our time and effort; tests will guide us through
    the fine-grained details of design as the code emerges and evolves.


    Let''s create a strategic design for the stock application. First conceptualize
    the overall logic or flow of the program: read tickets.txt; collect the price
    for each symbol; and finally print the result. Along the way the program should
    gracefully handle errors. Let''s sketch those details in a diagram.


    ![](img/6f7b86a11e592b1c82741d22837e0b38_108_0.png)


    In the figure, the solid lines represent function calls and the dotted lines indicate
    the operation of updating a variable. Most of the operations for this program
    are asynchronous and the overall flow nicely falls into a function pipeline or
    chain. The read function reads the tickets.txt file and reports any errors to
    the reportError function. The reportError function will print the error details
    for the user to see and exit the program. On the other hand, if the read went
    well, the read function will send a list of ticker symbols to the processTickets
    function. This function iterates over the list of symbols and calls a getPrice
    function for each ticker. getPrice gets the data from the web service and stores
    the price values in a prices collection. If it runs into an error, it stores the
    error details in an errors collection. The function also notifies a printReport
    function, which waits for all symbols to be processed. Once all the data is ready,
    the printReport function will print the prices and errors.


    With the strategic design in front of us, it''s time to think of the next step.
    It should get coding since that''s when we get valuable feedback—from automated
    tests and from exercising the application. At this level of design we have five
    functions. Let''s jot down high-level tests for these functions.


    # report erratum • discuss'
