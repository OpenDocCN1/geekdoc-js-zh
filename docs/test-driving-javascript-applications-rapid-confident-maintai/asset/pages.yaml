    # Wrapping Up


    End-to-end testing is a critical part of automated testing. We need to use integration
    tests to gain confidence that the entire application continues to work well when
    integrated. Since these tests are often more complex to and slower to run, and
    tend to be brittle, we have to keep them to a minimum. Also, we should avoid writing
    tests at this level that could be written at a lower level.


    In this chapter you learned how to use Protractor to write end-to-end integration
    tests. The tool is a nice wrapper around the Selenium WebDriver and brings fluency
    to tests that verify application behavior through the web UI. Protractor also
    provides special functions to work with AngularJS directives and bindings.


