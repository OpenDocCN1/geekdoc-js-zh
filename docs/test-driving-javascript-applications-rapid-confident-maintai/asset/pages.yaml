  md: 'tests, while not being effective, give a false sense of confidence. There are
    a few ways to deal with legacy code instead:


    +   - The team should earnestly drive-test any new code they write for the legacy
    application. Since new code comes in increments, they can take the time to restructure
    the part of code related to the change. That way they are focusing on a small
    area, they won''t get overwhelmed with the efforts and can create tests with better
    quality.


    +   - They could write tests before they fix a bug or right after they fix a bug.
    It''s easier to write more meaningful tests when the context of code is fresh
    in mind.


    +   - If a part of the code is considered highly business critical or is going
    through frequent change, then for that part of the application schedule time for
    the team to investigate the effort to write automated tests. They may have to
    refactor or restructure the code before they can write automated tests. They have
    evaluate the benefit of writing these tests versus the risk of modifying critical
    code when there are no current tests.


    When dealing with legacy applications, encourage the team to set up scripts that
    will fail the build if test coverage goes below the current level. A client that
    was suffering from high maintenance cost found that one of their legacy applications
    had only 26% coverage. They set up the build to fail if the coverage dropped below
    the value from the previous build. Within six months their coverage number was
    way above minimum value and they started enjoying the benefits from a greater
    number of automated tests.


    # Put an End to New Legacy Applications


    Today''s new project can turn into tomorrow''s legacy. Rather than letting projects
    run amok, managers and organizational leaders can take several steps to foster
    an environment that''s conducive to create maintainable software. Let''s discuss
    a few of them:


    +   - Learn from current experiences. Measure the time, effort, and cost to fix
    bugs. Include the time and money it takes to find and fix problems in your development
    time and costs. This can help us move away from the “let’s lower development time”
    local optimization mind-set. It will help us to move toward the more effective
    “let’s reduce the overall cost to the organization” global optimization mind-set.'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'Visibly post test metrics and coverage. When that TV or the monitor in the
    office break room cycles through the continuous integration dashboards, it conveys
    that the team is serious about writing test and maintaining high coverage. For
    projects with a low number of tests or coverage, displaying a trend over time
    can show that the team is improving and can motivate them to work harder. If the
    numbers don''t look good and there are errors or maintenance issues, it can serve
    as a reminder minute anyone walks into the office. As the screen cycles through
    projects, teams can quickly see projects that are doing better and approach them
    for advice or guidance.


    Keep an eye out for mixed messages. Teams often complain that they’re asked to
    write automated test but are not given the time, training, or resources to implement.
    We know that, if a team is new to a technology, they need time to get comfortable
    and productive with it. Likewise, if a team is new to automation testing, they
    need time to get productive with it. We don''t expect a person with no driving
    experience to drive just because they were given some keys. Likewise, a person
    with no access to testing tools. They need time to learn and improve their skills.
    Assess the current skills of the team and devise a plan to get them from where
    they are to where they will be productive. To get the desired results from the
    team, invest time and effort for them to learn and build the necessary test-driving
    skills.


    Give the team the coaching they need. Companies often hire agile coaches to transition
    their teams to adopt agile development. Successful teams also hire technical coaches
    to help their programmers and testers properly adopt technical practices. Find
    out if your teams can benefit from mentoring by a technical coach. Another approach
    that can help is to designate a champion or an automated verification czar. This
    person, who has adequate technical knowledge, can help to assess and to adopt
    automated testing.


    Change the definition of done so it’s not about delivering code, but also about
    delivering valuable features with useful automated tests. When developers are
    asked to deliver features and at the same time “expected” to create automated
    tests, these expectations often seem to go by the wayside. Inside automated testing
    into the definition of done to change the ways teams think and operate. They will
    begin to rethink how they estimate and how much they commit to deliver in each
    sprint or iteration. In other words, when automated verification is important,'
