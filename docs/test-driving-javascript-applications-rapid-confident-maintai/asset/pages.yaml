  md: 'Design the Model · 129


    # Design for Testability from the Ground Up


    Deliberately design with automated verification in mind. Structure code so the
    tests can be FAIR—fast, automated, isolated, and repeatable.


    # Design the Model


    The model-related functions are the only functions that will interact with the
    database. We need four functions: an function to get all the tasks from the database,
    a get to fetch a task with an id, an add to insert a task, and a delete to remove
    a task. We identified a few tests related to these functions in the test list.
    Before we can write them, we have to set up a connection to the database in a
    new task-test.js file.


    Since the model functions update database, we''ll run into an issue repeating
    the tests if we''re not careful. Suppose we perform an add task on an empty database.
    Now we can verify that the number of persistent records is 1. If we run the test
    again, the test would fail since the count is no longer 1. Likewise, repeating
    a test that deletes a persistent task would fail since the data was removed from
    the first test. To solve this problem, we''ll use features—the beforeEach and
    after methods are great places to set up and clean these data for each test. Also,
    we don''t need to initialize the connection in the before function, which is run
    once before the first test in the suite.


    # Take a Pragmatic Approach


    In a puristic view, models don''t talk to the database testing. In this book,
    we take a pragmatic approach—we care about writing deterministic and fast-running
    tests. If that goal can be achieved with a dependency in place, then that''s fine.
    If, on the other hand, the dependency prevents us from realizing goal, only then
    will we isolate it.


    # Set Up Connection and Test Fixture


    Let''s get the test setup code in place before looking at the first model test.


    An empty directory named models is provided in the testexpr/todo directory with
    an empty file named task.js. Also, an empty test file named task-test.js is provided
    under the test/server/models directory.


    Let''s edit the task-test.js file to add the setup functions:'
