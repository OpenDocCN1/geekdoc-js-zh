- img_proc: true
  md: 'Leaving the current project in place, scoot over to a small spike project and
    wildly experiment. Don''t care about code quality or tests at this moment. Get
    something to work, to produce the result you''re looking for. Once you have that
    little piece of code working, summon your courage and the discipline to discard
    it. Switch back to your active project, start with the test first, and drive the
    design of the code. You will notice that it''s not as intimidating to write tests
    first as it appeared. Also, you will notice that the design of the code that evolves
    is often quite different from what you cranked out spiking.


    # # Wrapping Up


    There''s value in both manual testing and automated verification. Testing can
    give us a great deal of insight. Without automated verification, it''s impossible
    to sustain the pace of development. Any nontrivial application requires automated
    tests at the right level. It takes time, effort, and discipline to automate tests,
    but it''s a skill that we should invest in. Write tests before writing code. If
    that proves to be difficult, learn from active spiking.


    As you''ve seen in this chapter, automated testing is very crucial. In the next
    part we''ll delve into some fundamental techniques for automated testing of both
    client-side and server-side code.'
