    We''ll use the stockfetch project under the djsa/testnode directory in your workspace.
    Change to the djsa/testnode/stockfetch directory and take a look at the package.json
    file to see the modules that we need. We''ll use Mocha, Chai, Istanbul, and Sinon
    in this project. Run npm install to get these installed for the current project.'
