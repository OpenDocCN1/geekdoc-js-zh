  md: '# Test-Drive class needs the Service


    The service class needs provide a get function. This function will talk to the
    back end, fetch the data, extract the JSON response, and return an Observable
    to the caller. Let''s design this function, test first.


    As the first step, let''s list the tests we need to implement the get function.
    Here again you can learn from the service you created during the spiking exercise.


    +   - get should MAKE GET request to /tasks

    - extractData should return result from json()

    - extractData should throw exception for invalid status

    - returnError should return the error Observable


    The first test is going to be an interaction test. The methods of HTTP return
    Rx.Observable. We will be calling the mock and catch functions on the returned
    Observable. Since we do not want to talk to the back-end service, we''ll have
    to mock out Observable.


    Open the test/client/app/tasks/tasks.service-test.js file, create a new suite
    for testing the service, and create a few variables that we''need:


    ```

    describe(`tasks service tests`, function() {

    var sandbox;

    var http;

    var observable;

    var tasksService;

    });

    ```


    In the new test we''ve created a few variables. The purpose of sandbox. http will
    have a reference to a stub for HTTP to emulate calls to the back end. observable
    will be a reference to a stub for the Rx.Observable that will be returned by the
    functions on HTTP. Finally,tasksService will be a reference to the service unit.


    Next put these variables in the setup function of the test suite. First, create
    a lightweight stub to stand for HTTP and pass it as constructor argument to the
    instance we create. Then a stub for Observable. We will then lay out a chain of
    stubs for the following sequence: The stub for HTTP''s get will return the stub
    for the Observable if the passed in argument is the correct URL,/tasks. The stub
    for the Observable''s map function will return the Observable if the given argument
    is the proper handler function. Likewise, the stub for the Observable''s catch
    function will return the Observable if the argument is the proper handler function
    that should be passed to.'
