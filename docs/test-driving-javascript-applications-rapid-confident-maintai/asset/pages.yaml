- img_proc: true
  md: '# CHAPTER 8


    # Using AngularJS


    If manipulating the DOM is like driving a stick shift, then using jQuery is like
    driving an automatic. That would make using AngularJS like taking a cab—it''s
    declarative: you tell it what to do and the framework synthesizes code to manipulate
    the DOM. The benefit is you write a lot less code to interact with the users and
    call services. But that doesn''t diminish the need for automated testing. You
    still want to verify that your code does what''s intended.


    AngularJS is an opinionated framework—good automated testing is one of its opinions.
    Unlike tools that suggest testing is good, AngularJS goes the extra mile to make
    code easily testable. This is largely achieved by how AngularJS weaves different
    parts of the application together—with dependency injection. Almost anything your
    needs is given to it as a parameter; as a result, you can easily stub or mock
    the dependencies for testing purposes.


    In this chapter we''ll test-drive an AngularJS implementation of the front end
    created in the previous chapter. We will add a requirement to sort the task list
    in this implementation. This chapter uses AngularJS 1.5.8, which is the stable
    release of as writing.


    With the techniques you learn from this chapter, you''ll be on your way to fully
    automate and verify the behavior of your AngularJS applications.


    # Testing the AngularJS Way


    Our approach to testing AngularJS code is different than the approach used when
    testing jQuery code. The main reason is that AngularJS is a framework whereas
    jQuery is a library. Your code typically calls into a library, which, in turn,
    does things for you. On the other hand, a framework'
  merge: -1
  pgno: 210
- img_proc: true
  md: "# Chapter 8. Using AngularJS • 196\n\naround your file, to take control, and\
    \ do things automagically without explicit calls; that needs some extra effort\
    \ and changes how you test.\n\nAn example will help refresh AngularJS and put\
    \ things in context we are starting tests. Here's a controller that merely sets\
    \ a variable's value after converting a string to lowercase.\n\n```\nangularsample/controller.js\n\
    var SampleController = function($filter) {\n  var controller = this;\n\n  alert('processing');\n\
    \  controller.greet = $filter(lowercase)('HELLO');\n};\n```\n\nangular.module('sample',\
    \ [])\n  .controller('SampleController', SampleController);\n\nHere's an HTML\
    \ file that refers to angular.min.js and the controller file.\n\n```\nangularsample/sample.html\n\
    <!DOCTYPE html>\n<html data-ng-app=\"sample\">\n<head>\n  <title>Greet//</title>\n\
    </head>\n<body>\n  <div data-ng-controller=\"SampleController as controller\"\
    >\n    <span>{{ controller.greet }}</span>\n  </div>\n  <script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.5.0-rc.0/angular.min.js\"\
    ></script>\n  <script src=\"controller.js\"></script>\n</body>\n</html>\n```\n\
    \nThe ng-app directive is where the magic begins; it signals AngularJS to process\
    \ the DOM. Once the DOM is ready, the functions in angular.min.js trigger a systematic\
    \ walk through the DOM, examining various attributes and expressions. When AngularJS\
    \ comes the ng-controller directive, it creates an instance of the given controller.\
    \ AngularJS visits the children elements to process any directives and expressions.\n\
    \nTo try this, you don't need any web servers. Just open the sample.html file\
    \ in your favorite browser and watch AngularJS perform its show. While AngularJS\
    \ creates an instance of the controller, it will stop for you to respond to the\
    \ alert we placed in the constructor. Once you click OK, AngularJS will continue\
    \ its processing and replace the expression on the page with the value."
