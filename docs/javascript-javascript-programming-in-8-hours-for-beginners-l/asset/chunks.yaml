    \ \"de\";  document.write ( str ); // output abcde\n```\n\n### Logical Operators\n\
    \n| Operators | Equivalent |\n| :--- | :--- |\n| `&&` | and |\n| `||` | or |\n\
    | `!` | not |\n\nAfter using logical operators, the result will be true or false.\n\
    \n### Example 2.2\n\n```javascript\nvar x=true; var y=false;\nvar a=x && y;  document.write\
    \ ( a ); // output: false\nvar b=x || y;  document.write ( b ); // output: true\n\
