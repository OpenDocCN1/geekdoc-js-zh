  trans: "\n\n# 示例 5.3\n\n| <html><script>var mystring = \"JavaScript is easy\";var\
    \ charac = mystring.charAt ( 2 );�// search a character at index 2document.write\
    \ ( charac );</script></html> |\n\n输出: `v`\n\n解释:\n\n`\"mystring.charAt( 2 )\"\
    ` 找到 `mystring` 中索引为 2 的字符，并返回结果 `\"v\"`。\n\n注意字符串的索引从 0 开始。\n\n## 转换字符大小写\n\n\
    |  |\n\n##### `string.toUpperCase( )`\n\n##### `string.toLowerCase( )`\n\n |\n\
    \n`\"toUpperCase( )\"` 和 `\"toLowerCase( )\"` 可以进行大小写转换。\n\n# 示例 5.4\n\n| <script>var\
    \ mystring = \"Hello World!\";var big = mystring.toUpperCase( );var small = mystring.toLowerCase(\
    \ );document.write ( \"Uppercase is \" + big + \"<br>\" );�document.write ( \"\
    Lowercase is \" + small);</script> |\n\n输出:\n\nUppercase is HELLO WORLD!\n\nLowercase\
    \ is hello world!\n\n解释:\n\n`\"mystring.toUpperCase( )\"` 和 `str.toLowerCase(\
    \ )` 转换了 `mystring` 的大小写。\n\n## 分割字符串\n\n`\"split(\" \" )\"` 可以根据字符串中的空格将其拆分为多个子字符串。\n\
    \n`\"split()\"` 也用于将字符串转换为数组。\n\n|  |\n\n##### `string.split( \" \" );`\n\n |\n\
    \n`(\" \")` 意味着根据字符串中的空格分割字符串，但分隔符是逗号 `\",\"`。\n\n# 示例 5.5\n\n| <html><head><title>JavaScript\
    \ 代码</title></head><body><script>var mystring = \"JavaScript for Beginners\";var\
    \ substr = mystring.split( \" \" ); /* 根据 mystring 的空格将 mystring 分分为子字符串 */document.write\
    \ ( substr ); // 显示子字符串 document.write ( \"<br>\" + substr[0]);document.write\
    \ ( \"<br>\" + substr[1]);document.write ( \"<br>\" + substr[2]);</script></body></html>\
    \ |\n\n输出:\n\nJavaScript, for, Beginners\n\nJavaScript\n\nfor\n\nBeginners\n\n\
    解释:\n\n`\"mystring.split( \" \" )\"` 根据 `mystring` 的空格将字符串分离为多个子字符串，使用逗号分割 `mystring`。\n\
    \n`\"document.write ( substr );\"` 显示了多个子字符串。\n\n`\"substr[0]\"` 显示第一个子字符串。\n\n\
    `\"substr[1]\"` 显示第二个子字符串。\n\n`\"substr[2]\"` 显示第三个子字符串。\n\n## 提取子字符串\n\n|  |\n\
    \n##### `string.substr( start, length );`\n\n |\n\n`\"substr( start, length )\"\
    ` 可以从字符串中提取子字符串。\n\n`\"start\"` 参数指定提取的起始位置。\n\n`\"length\"` 参数指定子字符串的长度。\n\n\
    # 示例 5.6\n\n| <script>var mystring = \"JavaScript is easy.\";var sub = mystring.substr(\
    \ 4, 6 ); /* 从索引 4 开始提取长度为 6 的子字符串 */document.write ( sub );</script> |\n\n输出:\
    \ \n\nScript\n\n解释:\n\n`\"mystring.substr( 4, 6 )\"` 从 `mystring` 中提取一个子字符串。\n\
    \n`\"( 4, 6 )\"` 指定子字符串的起始位置为 4，长度为 6。\n\n注意字符串索引从 0 开始。\n\n## 将数字转换为字符串\n\n|\
    \  |\n\n##### `number.toString( );`\n\n |\n\n为了满足 JS 编程的需求，有时需要将数字转换为字符串数据类型。\n\
    \n`\"number.toString( )\"` 可以将数字转换为字符串。\n\n# 示例 5.7\n\n| <script>var num1 = 12;\
    \ var num2 = 68;var str1 = num1.toString( ); // 转换为字符串 var str2 = num2.toString(\
    \ ); // 转换为字符串 var sum = str1 + str2; // 是连接而非相加 document.write ( sum );</script>\
    \ |\n\n输出: 1268\n\n解释:\n\n`\"num1.toString( )\"` 和 `\"num2.toString( )\"` 将两个数字转换为字符串类型。因此，`str1`\
    \ 加上 `str2` 的结果是 1268，而不是 80。\n\n## 将字符串转换为数字\n\n|  |\n\n##### `parseInt(string);`\n\
    \n##### `parseFloat( string);`\n\n |\n\n`\"parseInt(string)\"` 和 `parseFloat(string)`\
    \ 可以将字符串转换为整数或浮点数。\n\n# 示例 5.8\n\n| <script>var str1 = \"12\"; var str2 = \"68\"\
    ;var num1 = parseInt( str1 ); // 转换为 Intvar num2 = parseFloat( str2 ); // 转换为\
    \ Intvar addition = num1 + num2; // 是相加而非连接 document.write ( addition );</script>\
    \ |\n\n输出: 80\n\n解释:\n\n`\"parseInt( str1)\"` 和 `\"parseFloat( str2 )\"` 将两个字符串转换为数字类型。因此，`num1`\
    \ 加上 `num2` 的结果是 80，而不是 1268。\n\n## 搜索特定单词 (1)\n\n|  |\n\n##### `indexOf( )`\n\
    \n |\n\n`\"indexOf( )\"` 可以找到指定单词在字符串中第一次出现的位置。\n\n# 示例 5.9\n\n| <script>var mystring\
    \ = \"Please do what you decide to do!\";var index = mystring.indexOf(\"do\");\
    \ // 返回索引 document.write ( index );</script> |\n\n输出:\n\n7\n\n解释:\n\n`\"mystring.indexOf(\"\
    do\")\"` 返回 `\"do\"` 第一次出现的位置。\n\n## 搜索特定单词 (2)\n\n|  |\n\n##### `lastIndexOf(\
    \ )`\n\n |\n\n`\"lastIndexOf( )\"` 可以找到指定单词在字符串中最后一次出现的位置。\n\n# 示例 5.10\n\n| <script>var\
    \ mystring = \"Please do what you decide to do!\";var index = mystring.lastIndexOf(\"\
    do\");document.write ( index );</script> |\n\n输出:\n\n27\n\n解释:\n\n`\"mystring.lastIndexOf(\"\
    do\")\"` 返回 `\"do\"` 最后一次出现的位置。\n\n## Unicode\n\n|  |\n\n##### `strObject.charCodeAt(index)`\n\
    \n |\n\n`\"strObject.charCodeAt(index)\"` 返回指定位置的 Unicode。\n\n# 示例 5.11\n\n| <script>var\
    \ myString = \"Hello world!\";var u = myString.charCodeAt(4);document.write (\
    \ u );</script> |\n\n输出: 111\n\n解释:\n\n`\"myString.charCodeAt(4)` 返回索引 4 的 Unicode。\n\
    \n## 给文本添加链接\n\n|  |\n\n##### `string.link( String )`\n\n |\n\n`\"string.link(\
    \ String )\"` 为字符串添加超链接。\n\n# 示例 5.12\n\n| <script>var str = \"Please me!\";var\
    \ L = str.link(\"https://www.com/author/yao\");document.write (\"Welcome to our\
    \ website: \" + L);</script> |\n\n输出:\n\nWelcome to our website: https://www.com/author/yao\n\
    \n解释:\n\n`str.link(\"https://www.com/author/yao\")` 为字符串添加链接。\n\n## 动手项目：大小写\n\
    \n字符串操作：打开记事本，输入 JavaScript 代码：\n\n| <html><script>var oldText=\"Java in 8 Hours\"\
    var newText= oldText.toUpperCase();document.write (\"Original: \"+oldText+\"<br>\"\
    );document.write (\"Uppercase: \"+newText);</script></html> |\n\n请将文件保存为 \"ToUppercase.html\"\
    。\n\n注意：使用 \".html\" 扩展名并运行。\n\n输出:\n\nOriginal: Java in 8 Hours\n\nUppercase:\
    \ JAVA 8 HOURS\n\n解释:\n\n`.toUpperCase()` 将字符串转换为大写。\n\n# 第 6 章 对象\n\n### 对象声明\n\
    \nJavaScript 对象是一个拥有属性和方法的实体。对象指的是具体的某个。例如：汽车、书、狗、房屋等。\n\n|  |\n\n##### `obj =\
    \ new Object( ); // 创建对象`\n\n##### `obj.property;`\n\n`obj.method()` |\n\n`obj\
    \ = new Object( )` 创建名为 `obj` 的新对象。\n\n`obj.property` 意味着对象的属性。\n\n`obj.method()`\
    \ 意味着对象的方法。\n\n# 示例 6.1\n\n| <html><head><title>JavaScript 代码</title></head><body><script>house\
    \ = new Object ( ); // 创建对象 \"house\"house.color = \"white\"; // 对象引用变量 house.size\
    \ = \"big\"; // 对象引用变量 document.write ( \"House color: \" + house.color + \"<br>\"\
    );document.write ( \"House size: \" + house.size + \"<br>\" );</script></body></html>html>\
    \ |\n\n输出:\n\nHouse color: white\n\nHouse size: big\n\n解释:\n\n`house=new Object(\
    \ )` 创建了名为 `house` 的对象。\n\n`house.color` 意味着房屋的颜色。\n\n`house.size` 意味着房屋的尺寸。\n\
    \n## 页面导航\n\n|  |\n\n##### `windows.history.back( );`\n\n##### `windows.history.forward(\
    \ );`\n\n |\n\n`\"history.back( )\"` 返回到上一个页面。\n\n`\"history.forward( )\"` 前到下一个页面。\n\
    \n# 示例 6.2\n\n"
- fmt: "\n| <html><body><button onclick=\"history.back()\">Go Back</button><button\
    \ onclick=\"history.forward()\">Go forward</button></body></html> |\n\n## Explanation:\n\
    \n`<button onclick=\"history.back()\">`\"goes back to the previous page when the\
    \ button is clicked.\n\n`<button onclick=\"history.forward()\">`\"goes forward\
    \ to the next page when the button is clicked.\n\n### Go to Specified Page\n\n\
    | |\n##### `window.history.go( number )` | |\n\n\"`window.history.go( number)`\"\
    \ can turn to the specified web page.\n\n#### Example 6.3\n\n| <html><body><button\
    \ onclick=\"history.history.go(-1)\">Go Back</button><button onclick=\"history.history.go(1)\"\
    >Go Forward</button><button onclick=\"history.history.go(0)\">Reload</button></body></html>\
    \ |\n\n**Explanation:**\n\n`<button onclick=\"history. go(-1)\">`\"goes back to\
    \ the previous page when the button is clicked.\n\n`<button onclick=\"history.\
    \ go(1)\">`\"goes forward to the next page when the button is clicked.\n\n`<button\
    \ onclick=\"history. go(0)\">`\"reloads the current page when the button is clicked.\n\
    \n### Open Customized Window\n\nThe syntax to open a customized window is:\n\n\
    | |\n##### `window.open( url, name, width, height, status, menubar )` | |\n\n\"\
    `window.open`\"can open a new customized window.\n\n`url` argument means new window\
    \ url.\n\n`name` argument means new window name.\n\n`width` argument means the\
    \ new window's width.\n\n`height` argument means the new window's height.\n\n\
    `status` argument defines window's status bar.\n\n`menubar` argument defines window's\
    \ menu bar.\n\n`toolbar` argument defines the window's toolbar.\n\n#### Example\
    \ 6.4\n\n| <html><script>function openWindow(){windowObj = window.open(\" \",\"\
    MyWindow\",   \"  height=200, width=350, toolbar=yes, menubar=yes, status=no,\
    \ top=200, left=200\"); // open a customized window & create an objectwindowObj.document.write\
    \ (\"This is a new window.\");}</script><form><center><input type=\"button\" onClick=\"\
    openWindow()\" value=\"Open Window\"></center></form></html> |\n\n**Output:**\n\
    \nThis is a new window.\n\n**Explanation:**\n\n`window.open(…)`\"opens a customized\
    \ window.\n\n`MyWindow` is a new window name.\n\n`height=200,width=350`specify\
    \ the size of the new window.\n\n`toolbar=yes`means there is a toolbar.\n\n`memubar=yes`means\
    \ there is a menu bar.\n\n`status= no`means there is no status bar.\n\n`top=200,left=200`\
    \ specifies the location of the new window.\n\n`onClick=\"openWindow()\"`opens\
    \ the customized window when the button is clicked.\n\n### Close Current Window\n\
    \n| |\n##### `window.close( )` | |\n\n\"`window.close( );`\"can close the current\
    \ window.\n\n#### Example 6.5\n\n| <script>function shut(){alert(\"The window\
    \ will be closed!\")window.close( ); // close the current window  }</script><form><p><input\
    \ type = \"button\" onclick = \"shut()\"  value = \"Close\">  </form> |\n\n**Output:**\
    \ The window will be closed!\n\n**Explanation:**\n\n`window.close( )`is used to\
    \ close the current window.\n\n### Confirmation\n\nThe syntax of confirm dialog\
    \ box is:\n\n| |\n##### `window.confirm( )` | |\n\n\"`window.confirm( )`\"requires\
    \ user to confirm. Confirm dialog box looks like this:\n\n![](Images/image00314.jpeg)\n\
    \nWhen clicking \"OK\", it returns `true` in scripting.\n\nWhen clicking \"Cancel\"\
    , it returns `false` in scripting.\n\n#### Example 6.6\n\n| <html><head><title>JavaScript\
    \ Codes</title></head><body><script>var ask = window.confirm(\"Are you sure?\"\
    );  // confirm() will return true or false  if ( ask == true ){ document.write\
    \ ( \"All Right!\" ); }else{  document.write (\"Cancel!\"); }</script></</body>></html>\
    \ |\n\n**Output:**\n\nAll Right! \n\nCancel!\n\n**Explanation:**\n\nWhen clicking\
    \ \"OK\" button, it outputs \"All Right!\".\n\nWhen clicking \"Cancel\" button,\
    \ it outputs \"Cancel!\".\n\n### Prompt to Input\n\n| |\n##### `window.prompt(\
    \ )` | |\n\n\"`window.prompt( )`\"prompt user to input something to prompt dialog\
    \ box, which looks like this:\n\n![](Images/image00315.jpeg)\n\nThe user should\
    \ type some words into the prompt dialog box, for example, enter \"Yes, I like\
    \ it.\", and then click the \"OK\" or \"Cancel\" button.\n\n#### Example 6.7\n\
    \n| <html><head><title>JavaScript Codes</title></head><body><script>var data =\
    \ window.prompt (\"Do you like JavaScript?\");// prompt() stores the inputted\
    \ contents to the \"data\"document.write ( data );</script></body>></html> |\n\
    \n**Output:**\n\n![](Images/image00316.jpeg)\n\n**Explanation:**\n\nThe user enters\
    \ a sentence \"Yes, I like it!\", and then click \"OK\" button, the value is assigned\
    \ to `data`.\n\n`document.write ( data )`displays the contents that is inputted\
    \ by the user.\n\n### Address Element by ID\n\nWe can access an element according\
    \ to its id.\n\n| |\n##### `document.getElementById( ).innerHTML` | |\n\n\"`getElementById`\"\
    accesses an element by its id.\n\n`innerHTML`displays the contents.\n\n#### Example\
    \ 6.8\n\n| <html><div id=\"position\"></div><script>document.getElementById(\"\
    position\").innerHTML= \"OK\";// show the id</script></html> |\n\n**Output:**\
    \ OK\n\n**Explanation:**\n\n`id = position`specify the id.\n\n`getElementById(\"\
    position\")`shows the value.\n\n### Get Elements by Tag Name\n\nWe can access\
    \ an element by its tag name.\n\n| |\n##### `document.getElementsByTagName( ).innerHTML`\
    \ | |\n\n\"`getElementsByTagName`\"accesses elements by tag name.\n\n`innerHTML`shows\
    \ the value.\n\n#### Example 6.9\n\n| <html><ol><li>Red</li><li>Yellow</li><li>Green</li></ol><button\
    \ onclick=\"myFunction()\">Click</button><p id=\"S\"></p><script>function myFunction(){var\
    \ col = document.getElementsByTagName(\"li\");document.getElementById(\"S\").innerHTML\
    \ = col[2];}</script></html> |\n\n**Output:** ![](Images/image00317.jpeg\n\n**Explanation:**\n\
    \n`getElementsByTagName(\"li\")`accesses the tag.\n\n`document.getElementById(\"\
    S\")`innerHTMLshows the value.\n\n### Connect two Strings\n\n| |\n##### `string1.concat(string2)`\
    \ | |\n\n\"`string1.concat(string2)`\"can connect two strings.\n\n#### Example\
    \ 6.10\n\n| <script>var txt1 = \"Hello!\";var txt2 = \" friend.\";var result =\
    \ txt1.concat(txt2 );document.write ( result );</script> |\n\n**Output:** Hello!\
    \ My friend.\n\n**Explanation:**\n\n`txt1.concat( txt2 )`connect two strings.\n\
    \n### Convert Number to String\n\n| |\n##### `Number.toFixed(decimalPlace)` |\
    \ |\n\n\"`Number.toFixed(decimalPlace)`\"converts a number into a string with\
    \ the decimal place.\n\n#### Example 6.11\n\n| <script>var num = 10.28;var str\
    \ = num.toFixed(1); // 1 is decimal placedocument.write (str);</script> |\n\n\
    **Output:** 10.3\n\n**Explanation:**\n\n`num.toFixed(1)`converts the number with\
    \ 1 decimal place.\n\n### From Jan, 1, 1970\n\n| |\n##### `Date.parse(dateValue)`\
    \ | |\n\n\"`Date.parse(dateValue)`\"returns the number of milliseconds between\
    \ January 1, 1970 and specified date.\n\n#### Example 6.12\n\n| <script>var d\
    \ = new Date (2010, 10, 1); // create a datevar result = Date.parse(d); // get\
    \ the milliseconds from January 1, 1970 to specified datedocument.write ( result\
    \ );</script> |\n\n**Output:** 1288587600000\n\n**Explanation:**\n\n`Date.parse(d)`returns\
    \ the number of milliseconds from January 1, 1970 to specified date.\n\n### Absolute\
    \ Value\n\n| |\n##### `Math.abs( )` returns an absolute value of a number. | |\n\
    \n`Math.abs( )`returns an absolute value of a number.\n\n#### Example 6.13\n\n\
    | <script>var num1 = Math.abs(100);document.write ( num1 + \"<br>\");var num2\
    \ = Math.abs( -100 );document.write ( num2 + \"<br>\");</script> |\n\n**Output:**\n\
    \n100 \n\n100\n\n**Explanation:**\n\n`Math.abs( )`returns an absolute value of\
    \ a number.\n\n### Print Current Window\n\n| |\n##### `window.print( )` // print\
    \ the contents of the current window. | |\n\n#### Example 6.14\n\n| <script>function\
    \ printWindow( ){this.print( ); // \"this\" represents the current window}</script><form><input\
    \ type=\"button\" onclick=\"printWindow( )\" value=\"Print\"></form> |\n"
