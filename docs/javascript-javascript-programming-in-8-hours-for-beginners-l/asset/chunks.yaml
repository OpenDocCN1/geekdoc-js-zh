    ; m+=n;  document.write ( m );\n```\n\nExplanation:\n\n`x+=y` // `x+y` outputs\
    \ 300\n`x/=y` // `x/y` outputs 2\n`x-=y` // `x-y` outputs 100\n`m+=n` // `m+n`\
    \ outputs abcde\n\n### Comparison Operators\n\n| Operators | Running |\n| :---\
    \ | :--- |\n| `>` | greater than |\n| `<` | less than |\n| `>=` | greater than\
    \ or equal |\n| `<=` | less than or equal |\n| `==` | equal |\n| `!=` | not equal\
    \ |\n\nAfter using comparison operators, the result will be true or false.\n\n\
    ### Example 2.4\n\n```javascript\nvar a=100; var b=200;\nvar result = (a>b); document.write\
    \ ( result );\nvar result = (a==b); document.write ( result );\nvar result = (a!=b);\
    \ document.write ( result );\n```\n\nExplanation:\n\n`result = (a>b)` // `100>200`\
    \ outputs false.\n`result = (a==b)` // `100==200` outputs false.\n`result = (a!=b)`\
    \ // `100!=200` outputs true.\n\n### Conditional Operator\n\n`(test-expression)\
    \ ? (if-true-do-this) : (if-false-do-this);`\n\n`(test-expression)` looks like\
