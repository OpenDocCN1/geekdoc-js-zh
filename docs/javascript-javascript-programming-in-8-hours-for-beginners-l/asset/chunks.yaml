    ```javascript

    var arr = new Array( "a", "b", "c", "d", "e", "f" );var sli = arr.slice( 2, 5
    ); /*  从索引 2 到索引 5-1 提取某些元素  */document.write ( sli );

    ```

    输出: c, d, e


    解释:

    `arr.slice ( 2, 5 )` 从 `arr` 数组索引 2 到 5-1 提取元素。注意 5-1 索引表示的是 `"e"`，而不是 `"f"`。


    ### 对元素排序


    #### `array.sort( )`


    `array.sort( )` 可以按顺序对数组元素排序。


    示例 3.7


    ```javascript

    var arr = new Array( 2, 5, 3, 1, 4, 6 );arr.sort ( ); // 按顺序排序所有元素 var sor = arr.join(",");
    // 用 "," 连接所有元素 document.write ( sor );

    ```

    输出: 1,2,3,4,5,6


    解释:

    `arr.sort ( )` 按顺序对 `arr` 的元素进行排序。

    `var sor = arr.join(",")` 用逗号连接 `arr` 的元素；并将值赋值给 `sor`。


    ### 将元素转换为字符串


    #### `array.toString();`


    `array.toString()` 将 JavaScript 数组转换为字符串。


    示例 3.8


    ```javascript

    var myarray = new Array( );myarray[0] ="Mon";myarray[1] ="Tue";myarray[2] ="Wed";var
    days = myarray.toString( ); // 转换为字符串 document.write ( days );

    ```

    输出:

    Mon, Tue, Wed


    解释:

    `myarray.toString( )` 将 JavaScript 数组转换为字符串。`"Mon, Tue, Wed"` 的值是字符串类型。


    ### 查找特定元素 (1)


    #### `indexOf( )`


    `indexOf( )` 可以找到指定元素在数组中首次的位置。


    示例 3.9


    ```javascript

    var myarray = new Array( );myarray[0] ="Mon";myarray[1] ="Tue";myarray[2] ="Wed";myarray[3]
    ="Tue";var index = myarray.indexOf ("Tue"); // 获取 "Tue" 的索引 document.write (index);

    ```

    输出: 1


    解释:

    `myarray.indexOf ( "Tue" )` 返回 `"Tue"` 在 `myarray` 中首次出现的位置。`"Tue"` 的索引为 1。

    如果在数组中未找到元素，`indexOf( )` 返回 -1。


    ### 查找特定元素 (2)


    #### `lastIndexOf( )`


    `lastIndexOf( )` 可以找到指定元素在数组中最后一次的位置。


    示例 3.10


    ```javascript

    var myarray = new Array( );myarray[0] ="Mon";myarray[1] ="Tue";myarray[2] ="Wed";myarray[3]
    ="Tue";var index=myarray.lastIndexOf ( "Tue" ); // 获取 "Tue" 的索引 document.write
    (index);

    ```

    输出: 3


    解释:

    `myarray.lastIndexOf ( "Tue" )` 返回 `"Tue"` 在 `myarray` 中最后一次出现的位置。`"Tue"` 的索引为
    3。

    如果在数组中未找到元素，`lastIndexOf( )` 返回 -1。


    ### 在开头添加元素


    #### `unshift( )`


    在数组的开头添加一个或多个元素。


    示例 3.11


    ```javascript

    var arr = [4,5,6];arr.unshift(1,2,3);  // 将 1,2,3 添加到 "arr" 的开头 document.write
    (arr);

    ```

    输出: 1,2,3,4,5,6


    解释:

    `unshift()` 在数组的开头添加一个或多个元素。

    `arr.unshift(1,2,3);` 将元素 1,2,3 添加到 `arr` 的开头。


    ### 移除第一个元素


    #### `shift( )`


    移除数组的第一个元素。


    示例 3.12


    ```javascript

    var arr = [4,5,6];arr.shift( ); // 移除数组的第一个元素 document.write (arr);

    ```

    输出:

    5, 6


    解释:

    `shift()` 移除数组的第一个元素。

    `arr.shift( );` 移除数组 `arr` 的第一个元素。


    ### 在末尾添加元素


    #### `push( )`


    在数组的末尾添加一个或多个元素。


    示例 3.13


    ```javascript

    var arr = [1,2,3];arr.push( 4, 5, 6 ); // 将 4,5,6 添加到 "arr" 的末尾 document.write
    (arr);

    ```

    输出: 1,2,3,4,5,6


    解释:

    `push()` 在数组的末尾添加一个或多个元素。

    `arr.push(4,5,6);` 将 4,5,6 添加到 `arr` 的末尾。


    ### 移除最后一个元素


    #### `pop( )`


    移除数组的最后一个元素。


    示例 3.14


    ```javascript

    var arr = [1,2,3,4,5,6];arr.pop( ); // 移除 arr 的最后一个元素 document.write (arr);

    ```

    输出: 1,2,3,4,5


    解释:

    `pop()` 移除数组的最后一个元素。

    `arr.pop( );` 移除 `arr` 的最后一个元素。


    ### 数组反转


    #### `array.reverse( )`


    `array.reverse( )` 可以反转数组元素的顺序。


    示例 3.15


    ```javascript

    var arr = new Array( 1, 2, 3, 4, 5, 6 );arr.reverse ( ); // 反转所有元素 var sor = arr.join(",");
    // 用 "," 连接所有元素 document.write ( sor );

    ```

    输出: 6,5,4,3,2,1


    解释:

    `arr.reverse ( )` 反转 `arr` 的元素顺序。

    `var sor = arr.join(",")` 用逗号连接 `arr` 的元素；并将值赋值给 `sor`。


    ### 合并数组


    #### `array.concat( )`


    `array.concat( )` 可以合并两个或多个数组。


    示例 3.16


    ```javascript

    var arr1 = new Array( 1, 2, 3 );var arr2 = new Array( 4, 5, 6 );var arr = arr1.concat(
    arr2 ); // 合并 arr1 和 arr2document.write ( arr );

    ```

    输出: 1,2,3,4,5,6


    解释:

    `arr1.concat( arr2 )` 合并 `arr1` 和 `arr2` 并返回新数组。


    ### 复制数组


    #### `array.slice( )`


    `array.slice( )` 可以用来创建一个数组的浅拷贝。


    示例 3.17


    ```javascript

    var arr = new Array( 1, 2, 3 );var copy = arr.slice( ); // 复制数组 document.write
    ( copy );

    ```

    输出: 1,2,3


    解释:

    `arr.slice( )` 创建了 `arr` 的一个浅拷贝。


    ### 填充数组


    #### `array.fill( )`


    `array.fill( )` 可以填充数组中的所有元素为指定的值。


    示例 3.18


    ```javascript

    var arr = new Array( 5 );arr.fill( 0 ); // 将所有元素填充为 0document.write ( arr );

    ```

    输出: 0,0,0,0,0


    解释:

    `arr.fill( 0 )` 将数组中的所有元素填充为 0。


    ### 查找数组中的最大值


    #### `Math.max( )`


    `Math.max( )` 可以找到数组中的最大值。


    示例 3.19


    ```javascript

    var arr = new Array( 1, 6, 2, 8, 5, 7 );var max = Math.max(...arr); // 获取数组中的最大值
    document.write (max);

    ```

    输出: 8


    解释:

    `Math.max( ...arr )` 使用扩展运算符获取 `arr` 元素中的最大值。


    ### 查找数组中的最小值


    #### `Math.min( )`


    `Math.min( )` 可以找到数组中的最小值。


    示例 3.20


    ```javascript

    var arr = new Array( 1, 6, 2, 8, 5, 7 );var min = Math.min(...arr); // 获取数组中的最小值
    document.write (min);

    ```

    输出: 1


    解释:

    `Math.min( ...arr )` 使用扩展运算符获取 `arr` 元素中的最小值。


    ### 随机数


    #### `Math.random( )`


    `Math.random()` 返回一个 0（包含）到 1（不包含）之间的随机数。


    示例 3.21


    ```javascript

    var rand = Math.random(); // 生成随机数 document.write (rand);

    ```

    输出: 0.123456...


    解释:

    `Math.random()` 生成一个 0 到 1 之间的随机浮点数。


    ### 舍入


    #### `Math.floor( )`


    `Math.floor( )` 将数字向下取整到最近的整数。


    示例 3.22


    ```javascript

    var num = Math.floor( 4.7 ); // 向下取整 document.write (num);

    ```

    输出: 4


    解释:

    `Math.floor( 4.7 )` 将 4.7 向下取整为 4。


    ### 向上


    #### `Math.ceil( )`


    `Math.ceil( )` 将数字向上取整到最近的整数。


    示例 3.23


    ```javascript

    var num = Math.ceil( 4.2 ); // 向上取整 document.write (num);

    ```

    输出: 5


    解释:

    `Math.ceil( 4.2 )` 将 4.2 向上取整为 5。


    ### 四舍入


    #### `Math.round( )`


    `Math.round( )` 将数字四舍五入到最近的整数。


    示例 3.24


    ```javascript

    var num = Math.round( 4.6 ); // 四舍五入 document.write (num);

    ```

    输出: 5


    解释:

    `Math.round( 4.6 )` 将 4.6 四舍五入为 5。


    ### 绝对值


    #### `Math.abs( )`


    `Math.abs( )` 返回数字的绝对值。


    示例 3.25


    ```javascript

    var num = Math.abs( -10 ); // 获取绝对值 document.write (num);

    ```

    输出: 10


    解释:

    `Math.abs( -10 )` 返回 -10 的绝对值 10。


    ### 幂


    #### `Math.pow( )`


    `Math.pow( x, y )` 返回 `x` 的 `y` 次幂。


    示例 3.26


    ```javascript

    var num = Math.pow( 2, 3 ); // 2 的 3 次幂 document.write (num);

    ```

    输出: 8


    解释:

    `Math.pow( 2, 3 )` 计算 $2³$ 的结果为 8。


    ### 平方根


    #### `Math.sqrt( )`


    `Math.sqrt( )` 返回数字的平方根。


    示例 3.27


    ```javascript

    var num = Math.sqrt( 16 ); // 获取平方根 document.write (num);

    ```

    输出: 4


    解释:

    `Math.sqrt( 16 )` 返回 16 的平方根 4。


