    \ be omitted.\n\n## For Loop\n\n```javascript\nfor( init, test-expression, increment)\
    \ { // some code; }\n```\n\n`for loop` runs a block of code repeatedly by the\
    \ specified number of times.\n\n### Example 2.9\n\n```html\n<html><script>\nfor\
    \ (var x = 0; x <= 5; x++) { // loop 5 times\ndocument.write ( x );}</script></html>\n\
    ```\n\n**Output:** \n012345\n\n**Explanation:**\n`var x = 0` is an initializer,\
    \ initializing variable `x` as 0.\n`x <= 5` is `test-expression`, the code will\
    \ run at most 5 times.\n`x++` means that `x` will increase 1 each loop.\nAfter\
    \ 5 times loop, the code will output 012345.\n\n## While Loop\n\n```javascript\n\
    while ( test-expression ) { // some js code in here; }\n```\n\n`while loop` loops\
    \ through a block of code if the specified condition is true.\n\n### Example 2.10\n\
    \n```javascript\n<script>\nvar counter=0;\nwhile (counter < 8){ // loop 8 times\n\
    document.write ( \"&\" );\ncounter++; // increase 1 every loop}</script>\n```\n\
    \n**Output:**\n&&&&&&&&\n\n**Explanation:**\n`\"counter< 8\"` is a `test expression`,\
    \ if the condition is true, the code will loop less than 8 times, until the `counter`\
