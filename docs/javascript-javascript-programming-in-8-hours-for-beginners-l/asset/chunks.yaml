    \ ( )\">`\n\n当表单中的“select”值发生变化时，会触发 `onChange` 事件并立即运行 `function ( )`。\n\n示例\
    \ 8.10\n\n```html\n<html><head><script language=\"javascript\">function myfun(color){alert\
    \ (\"The flower is  \"+ color);}</script></head><body><form id=\"myForm\"><select\
    \ name=\"flower\" onChange=\"myfun(this.value)\">      <!-- 选择一个选项时运行函数 \"myfun()\"\
    \ --><option value=\"Red\">Red</option><option value=\"Yellow\">Yellow</option><option\
    \ value=\"Green\">Green</option></select></body></html>\n```\n\n输出：花朵是绿色的。\n\n\
    解释：\n\n`this.value` 代表选项的值。\n\n`<select name=\"flower\" onChange=\"myfun(this.value)\"\
