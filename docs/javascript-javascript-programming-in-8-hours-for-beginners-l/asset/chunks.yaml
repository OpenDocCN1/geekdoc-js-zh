    \ indexes are 0, 1, and 2. Its values are red, blue, and green.\n\nNote that index\
    \ begins with zero.\n\n### Show array element values\n\nTo show array element\
    \ values, use syntax as following:\n\n|  \n\n##### document.write ( array-name[index]\
    \ );\n\n |\n\nExample 3.2\n\n| <html><body><script>color = new Array(\"yellow\"\
    , \"purple\", \"orange\"); document.write ( color[1] ); // show array value</script></body></html>\
    \ |\n\nOutput:   purple\n\nExplanation:\n\nThe value of color[0] is yellow.\n\n\
    The value of color[1] is purple.\n\nThe value of color[2] is orange.\n\nNote that\
    \ the indexes begin counting from zero.\n\n### Get the Size of Array\n\nThe syntax\
    \ to get the length of an array is:\n\n|  \n\n##### array.length\n\n |\n\nExample\
    \ 3.3\n\n| <html><script>var color = new Array(\"yellow\", \"purple\", \"orange\"\
    );var size = color.length; // get the size of an arraydocument.write ( size ); </script></html>\
    \ |\n\nOutput:  \n\n3\n\nExplanation:\n\n\"var size=color.length\" can return\
    \ the size of the array \"color\", and assigns the size of the array to \"size\"\
    .\n\nnew Array(\"yellow\", \"purple\", \"orange\") has three elements, so its\
    \ size is 3.\n\n### Join Array Elements\n\n|  \n\n##### array.join(    );\n\n\
    ##### array.join(\"  \");\n\n##### array.join(\" , \");\n\n |\n\narray.join(  \
    \ ) can join all array elements without spaces.\n\narray.join(\" \") can join\
    \ all array elements by spaces.\n\narray.join(\",\") can join all array elements\
    \ by commas.\n\nExample 3.4\n\n| <html><head><title>JavaScript Codes</title></head><body><script>var\
    \ arr = new Array( );arr[0] = \"I\";arr[1] = \"Love\";arr[2] = \"JavaScript!\"\
    ;document.write ( arr.join(\"  \") ); // join elements by spaces</script></body></html>\
    \ |\n\nOutput:\n\nI Love JavaScript!\n\nExplanation:\n\narr.join(\"  \") can join\
    \ all elements of the \"arr\" together with spaces. Of course you can try arr.join(\"\
    ,\") to join elements by commas.\n\n### Reverse Element Order\n\n|  \n\n#####\
    \ array.reverse( );\n\n |\n\n\"array.reverse( )\" can reverse the element order\
    \ of an array.\n\nExample 3.5\n\n| <html><script>var arr = new Array( \"A\", \"\
    B\", \"C\" );arr.reverse( ); // reverse the element ordervar rev = arr.join(\"\
    ,\"); // join all elements by \",\"document.write ( rev );</script></html> |\n\
    \nOutput:  \n\nC, B, A\n\nExplanation:\n\n\"arr.reverse( )\" reverses the element\
    \ order of \"arr\" array.\n\n\"rev=arr.join(\",\")\" joins all elements of \"\
    arr\" array together and assign the value with new element order to \"rev\".\n\
    \n### Slice Elements\n\n|  \n\n##### array.slice( start, last-1)\n\n |\n\n\"array.slice(\
    \ start, last-1 )\" can slice array elements into pieces, extracts some elements\
    \ from start to last-1 index.\n\n\"start\" means the first element.\n\n\"last-1\"\
    \ means the last-1 element.\n\nExample 3.6"
