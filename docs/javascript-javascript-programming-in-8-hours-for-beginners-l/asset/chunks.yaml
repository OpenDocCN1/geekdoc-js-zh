    ```javascript

    var arr = new Array( "a", "b", "c", "d", "e", "f" );var sli = arr.slice( 2, 5
    ); /*  extract some elements from index 2 to index 5-1  */document.write ( sli
    );

    ```

    Output: c, d, e


    Explanation:

    `arr.slice ( 2, 5 )` extracts elements from `arr` array from 2 to 5-1 index. Note
    that 5-1 index signifies `"e"`, instead of `"f"`.


    ### Sort Elements in Order


    #### `array.sort( )`


    `array.sort( )` can sort array elements orderly.


    Example 3.7


    ```javascript

    var arr = new Array( 2, 5, 3, 1, 4, 6 );arr.sort ( ); // sort all elements in
    ordervar sor = arr.join(","); // join all elements by ","document.write ( sor
    );

    ```

    Output: 1,2,3,4,5,6


    Explanation:

    `arr.sort ( )` sort the elements of `arr` sequentially.

    `var sor = arr.join(",")` joins the elements of `arr` by commas; and assign the
    value to `sor`.


    ### Convert Elements to String


    #### `array.toString();`


    `array.toString()` converts a JavaScript array into a string.


    Example 3.8


    ```javascript

    var myarray = new Array( );myarray[0] ="Mon";myarray[1] ="Tue";myarray[2] ="Wed";var
    days = myarray.toString( ); // convert to stringdocument.write ( days );

    ```

    Output:

    Mon, Tue, Wed


    Explanation:

    `myarray.toString( )` converts a JavaScript array into a string. The value of
    `"Mon, Tue, Wed"` is a string type.


    ### Search Specific Element (1)


    #### `indexOf( )`


    `indexOf( )` can find out the first location where a specified element occurs
    in an array.


    Example 3.9


    ```javascript

    var myarray = new Array( );myarray[0] ="Mon";myarray[1] ="Tue";myarray[2] ="Wed";myarray[3]
    ="Tue";var index = myarray.indexOf ("Tue"); // get index of "Tue"document.write
    (index);

    ```

    Output: 1


    Explanation:

    `myarray.indexOf ( "Tue" )` returns the first location where the `"Tue"` occurs
    in `myarray`. The index of the `"Tue"` is 1.

    If the element is not found in array, `indexOf( )` returns -1.


    ### Search Specific Element (2)


    #### `lastIndexOf( )`


    `lastIndexOf( )` can find out the last location where a specified element occurs
    in an array.


    Example 3.10


    ```javascript

    var myarray = new Array( );myarray[0] ="Mon";myarray[1] ="Tue";myarray[2] ="Wed";myarray[3]
    ="Tue";var index=myarray.lastIndexOf ( "Tue" ); // get index of "Tue"document.write
    (index);

    ```

    Output: 3


    Explanation:

    `myarray.lastIndexOf ( "Tue" )` returns the last location where the `"Tue"` occurs
    in `myarray`. The index of the `"Tue"` is 3.

    If the element is not found in array, `lastIndexOf( )` returns -1.


    ### Add Element to Beginning


    #### `unshift( )`


    Add one or more elements in the beginning of an array.


    Example 3.11


    ```javascript

    var arr = [4,5,6];arr.unshift(1,2,3);  // add 1,2,3 to the beginning of "arr"document.write
    (arr);

    ```

    Output: 1,2,3,4,5,6


    Explanation:

    `unshift()` adds one or more elements into the beginning of an array.

    `arr.unshift(1,2,3);` adds elements 1,2,3 to the beginning of `arr`.


    ### Remove First Element


    #### `shift( )`


    Remove the first element of an array.


    Example 3.12


    ```javascript

    var arr = [4,5,6];arr.shift( ); // remove the first element of the arraydocument.write
    (arr);

    ```

    Output:

    5, 6


    Explanation:

    `shift()` removes the first element of an array.

    `arr.shift( );` removes the first element of the array `arr`.


    ### Add Element to End


    #### `push( )`


    Add one or more elements to the end of an array.


    Example 3.13


    ```javascript

    var arr = [1,2,3];arr.push( 4, 5, 6 ); // add 4,5,6 to the end of "arr"document.write
    (arr);

    ```

    Output: 1,2,3,4,5,6


    Explanation:

    `push()` adds one or more elements to the end of an array.

    `arr.push(4,5,6);` adds 4,5,6 to the end of `arr`.


    ### Remove Last Element


    #### `pop( )`


    Remove the last element of an array.


    Example 3.14


    ```javascript

    var arr = [1,2,3,4,5,6];arr.pop( ); // remove the last element of arrdocument.write
    (arr);

    ```

    Output: 1,2,3,4,5


    Explanation:

    `pop()` removes the last element of an array.

    `arr.pop( );` removes the last element of `arr`.


    ### Hands-on Project: Reverse Array


    Open Notepad, input JavaScript codes:


    ```javascript

    var oldArray = new Array(0,1,2,3,4,5);document.write ("Original array is: "+oldArray.join());
    // join valuesvar newArray=oldArray.reverse(); // reverse orderdocument.write
    ("Reversed array is: "+newArray.join());

    ```

    Please save the file with name `"Array.html"` and run it.

    Output:

    Original array is: 0,1,2,3,4,5

    Reversed array is: 5,4,3,2,1,0


    Explanation:

    `array.join()` connects all elements together.

    `array.reverse()` reverses the order of all elements.


    ## Math Methods


    | Method | Returns |

    | :--- | :--- |

    | `abs()` | a number''s absolute value |

    | `ceil()` | an integer greater than or equal its argument |

    | `cos()` | an angle''s trigonometric cosine |

    | `exp()` | a number''s `E` to the power |

    | `floor()` | an integer less than or equal its argument |

    | `log()` | a number''s natural logarithm |

    | `random()` | a random positive value 0 to 1 |

    | `max()` | a greater between two numbers |

    | `min()` | a smaller between two numbers |

    | `pow()` | the first argument to the power of the second |

    | `round()` | an integer |

    | `sin()` | an angle''s trigonometric sine |

    | `sqrt()` | a number''s square root |

    | `tan()` | an angle''s trigonometric tangent |


    ### Greater & Less


    #### `Math.ceil()`, `Math.floor();`


    `Math.ceil()` returns a closest integer that is greater than or equal to its argument.

    `Math.floor()` returns a closest integer that is less than or equal to its argument.


    Example 4.2


    ```javascript

    var num = 9.5;document.write ("Ceiling number is "+Math.ceil( num )+"<br>" );document.write
    ("Flooring number is "+Math.floor( num )+"<br>" );

    ```

    Output:

    Ceiling number is 10

    Flooring number is 9


    Explanation:

    `Math.ceil( num )` returns a closest integer that is greater than or equal 9.5,
    the result is 10.

    `Math.floor( num );` returns a closest integer that is less than or equal 9.5,
    the result is 9.


    ### Maximum & Minimum


    #### `Math.max()`, `Math.min();`


    `Math.max()` returns the greater one between two numbers.

    `Math.min()` returns the less one between two numbers.


    Example 4.3


    ```javascript

    var x = 100;var y = 200;document.write ("Greater number is "+Math.max(x, y)+"<br>");document.write
    ("Less number is "+Math.min(x, y)+"<br>");

    ```

    Output:

    Greater number is 200

    Less number is 100


    Explanation:

    `Math.max(x, y)` returns the greater number between 100 and 200, the result is
    200.

    `Math.min(x, y)` returns the less number between 100 and 200, the result is 100.


    ### Power Value


    #### `pow()`


    `pow()` returns the value of `x` to the power of `y`. ($x^y$)


    Example 4.4


    ```javascript

    var num1 = Math.pow(6, 2);document.write ( num1 + "<br>");var num2 = Math.pow(2,
    3);document.write ( num2 + "<br>" );

    ```

    Output:

    36

    8


    Explanation:

    `Math.pow(6,2)` equals $6^2$.

    `Math.pow(2,3)` equals $2^3$.


    ### Square Root


    #### `sqrt()`


    `sqrt()` returns the square root of a number.


    Example 4.5


    ```javascript

    var num1 = Math.sqrt(4);document.write ( num1 + "<br>" );var num2 = Math.sqrt(25);document.write
    ( num2 + "<br>" );

    ```

    Output:

    2

    5


    Explanation:

    `Math.sqrt(4)` returns the square root of the number 4.

    `Math.sqrt(25)` returns the square root of the number 25.

