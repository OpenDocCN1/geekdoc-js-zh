    \n解释：\n\n`onClick=\"myfun()\"` 在点击提交按钮时立即执行 `myfun()`。\n\n`getElementById(\"myform\"\
    )` 通过其 id 访问 `myform`。\n\n`submit( )` 将 `myform` 数据提交到服务器。\n\n### “选择”选择 (Select\
