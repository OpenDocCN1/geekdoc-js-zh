    \n[Answers](#part0133.xhtml__Toc104493790)\n\n## Chapter 1\n\n### What is JavaScript?\n\
    \nJavaScript is a web programming language. It is a dynamically typed, prototype-based\
    \ language. JavaScript is part of the browser and is widely used on the client\
    \ side as a scripting language. It is used to add dynamic and interactive functionality\
    \ to web pages. JavaScript abbreviated as JS.\n\nJavaScript was first developed\
    \ by Netscape's Brendan Eich on the Netscape Navigator browser in 1995. Netscape\
    \ management wanted it to look like Java, so it was named JavaScript. In fact,\
    \ JavaScript is completely different from JAVA.\n\nJavaScript is a relatively\
    \ secure client-side scripting language based on object and event. It can respond\
    \ the requests from users, and create a series of dynamical effects.\n\nJavaScript\
    \ language main features:\n\nRun with any browser, easy to use.\n\nEmbedded its\
    \ code in the HTML page.\n\nIs an interpreted language, doesn't need to compile.\n\
    \nCan make static web page into a dynamic web page.\n\nProvide form processing\
    \ and validation confirmation.\n\nRespond the requests from user any time.\n\n\
    Provides an event trigger mechanism.\n\n### JavaScript Syntax\n\nJavaScript is\
    \ a dynamic computer programming language used to make web pages interactive.\n\
    \nThe syntax of JavaScript looks like this:\n\n|  \n\n##### <script type = \"\
    text/javascript\">\n\n##### ……\n\n##### </script>\n\n |\n\nExample 1.1\n\n| <!DOCTYPE\
    \ html><html><head><title>Hello World</title></head><body><script language=\"\
    javascript\">document.write (\"Hello World!\");</script></body></html> |\n\nOutput:"
