  trans: "\n\n| <html><body><button onclick=\"history.back()\">后退</button><button\
    \ onclick=\"history.forward()\">前进</button></body></html> |\n\n## 解释：\n\n`<button\
    \ onclick=\"history.back()\">`\"点击此按钮时返回上一个页面。\"\n\n`<button onclick=\"history.forward()\"\
    >`\"点击此按钮时跳转到下一个页面。\"\n\n### 跳转到指定页面\n\n| |\n##### `window.history.go( number\
    \ )` | |\n\n\"`window.history.go( number)`\"\"可以跳转到指定的网页。\"\n\n#### 示例 6.3\n\n\
    | <html><body><button onclick=\"history.history.go(-1)\">后退</button><button onclick=\"\
    history.history.go(1)\">前进</button><button onclick=\"history.history.go(0)\">刷新</button></body></html>\
    \ |\n\n**解释：**\n\n`<button onclick=\"history. go(-1)\">`\"点击此按钮时返回上一个页面。\"\n\n\
    `<button onclick=\"history. go(1)\">`\"点击此按钮时跳转到下一个页面。\"\n\n`<button onclick=\"\
    history. go(0)\">`\"点击此按钮时刷新当前页面。\"\n\n### 打开自定义窗口\n\n打开自定义窗口的语法为：\n\n| |\n#####\
    \ `window.open( url, name, width, height, status, menubar )` | |\n\n\"`window.open`\"\
    \"可以打开一个新的自定义窗口。\"\n\n`url` 参数意味着新窗口的 url。\n\n`name` 参数意味着新窗口的名称。\n\n`width` 参数意味着新窗口的宽度。\n\
    \n`height` 参数意味着新窗口的高度。\n\n`status` 参数定义窗口的状态栏。\n\n`menubar` 参数定义窗口的菜单栏。\n\n`toolbar`\
    \ 参数定义窗口的工具栏。\n\n#### 示例 6.4\n\n| <html><script>function openWindow(){windowObj\
    \ = window.open(\" \",\"MyWindow\",   \"  height=200, width=350, toolbar=yes,\
    \ menubar=yes, status=no, top=200, left=200\"); // 打开一个自定义窗口并创建一个对象 windowObj.document.write\
    \ (\"This is a new window.\");}</script><form><center><input type=\"button\" onClick=\"\
    openWindow()\" value=\"打开窗口\"></center></form></html> |\n\n**输出：**\n\nThis is\
    \ a new window.\n\n**解释：**\n\n`window.open(…)`\"打开一个自定义窗口。\"\n\n`MyWindow` 是新窗口的名称。\n\
    \n`height=200,width=350`指定了新窗口的大小。\n\n`toolbar=yes`意味着有一个工具栏。\n\n`memubar=yes`意味着有一个菜单栏。\n\
    \n`status= no`意味着没有状态栏。\n\n`top=200,left=200`指定了新窗口的位置。\n\n`onClick=\"openWindow()\"\
    `\"在点击按钮时打开自定义窗口。\"\n\n### 关闭当前窗口\n\n| |\n##### `window.close( )` | |\n\n\"`window.close(\
    \ );`\"可以关闭当前窗口。\"\n\n#### 示例 6.5\n\n| <script>function shut(){alert(\"The window\
    \ will be closed!\")window.close( ); // 关闭当前窗口  }</script><form><p><input type\
    \ = \"button\" onclick = \"shut()\"  value = \"关闭\">  </form> |\n\n**输出：** The\
    \ window will be closed!\n\n**解释：**\n\n`window.close( )`用于关闭当前窗口。\n\n### 确认\n\n\
    确认对话框的语法为：\n\n| |\n##### `window.confirm( )` | |\n\n\"`window.confirm( )`\"\"\
    需要用户确认。确认对话框看起来如下：\"\n\n![](img/image00314.jpeg)\n\n当点击“OK”时，它在脚本中返回 `true`。\n\
    \n当点击“Cancel”时，它在脚本中返回 `false`。\n\n#### 示例 6.6\n\n| <html><head><title>JavaScript\
    \ 代码</title></head><body><script>var ask = window.confirm(\"Are you sure?\");\
    \  // confirm() 将返回 true 或 false  if ( ask == true ){ document.write ( \"All Right!\"\
    \ ); }else{  document.write (\"Cancel!\"); }</script></body></body>></html> |\n\
    \n**输出：**\n\nAll Right! \n\nCancel!\n\n**解释：**\n\n点击“OK”按钮时，输出 \"All Right!\"\
    。\n\n点击“Cancel”按钮时，输出 \"Cancel!\"。\n\n### 输入提示\n\n| |\n##### `window.prompt( )`\
    \ | |\n\n\"`window.prompt( )`\"\"弹出一个提示对话框让用户输入内容，对话框看起来如下：\"\n\n![](img/image00315.jpeg)\n\
    \n用户应该在提示对话框中输入一些文字，例如输入“Yes, I like it.”，然后点击“OK”或“Cancel”按钮。\n\n#### 示例 6.7\n\
    \n| <html><head><title>JavaScript 代码</title></head><body><script>var data = window.prompt\
    \ (\"Do you like JavaScript?\");// prompt() 将输入的内容存储在 \"data\"变量中 document.write\
    \ ( data );</script></body></body>html> |\n\n**输出：**\n\n![](img/image00316.jpeg)\n\
