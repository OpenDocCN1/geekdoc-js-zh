    \nExplanation:\n\nThe value of Math.PI is 3.141592653589793.\n\nMath.random( )\
    \ generates a random number between 0.0 to 1.0, in here the result is 0.6315033452119678\n\
    \n### Date & Time\n\nJavaScript often uses date and time to design the web page.\
    \ When using date and time, you must create an object of date first.\n\n|  \n\n\
    ##### var DateObject = new Date(  ) // create a date object\n\n |\n\nExample 4.7\n\
    \n| <script>var DateObject = new Date( );   // create a date objectdocument.write\
    \ ( DateObject );</script> |\n\nOutput:\n\nThu Nov 05 2015 21:39:28 GMT-0500 (Eastern\
    \ Standard Time)\n\nExplanation:\n\n\"var DateObject = new Date( )\" creates an\
    \ object of date.\n\n\"document.write ( DateObject )\" shows the current date\
    \ and time.\n\n### Date, Month, Year, Day\n\nThe Date Object has the following\
    \ method:\n\n|  \n\n##### getDate( )\n\n |  \n\n##### get the date\n\n |\n\n|\
    \  \n\n##### getMonth( )\n\n |  \n\n##### get the month (need to add 1)\n\n |\n\
    \n|  \n\n##### getYear( )\n\n |  \n\n##### get the year (need to add 1900)\n\n\
    \ |\n\n|  \n\n##### getDay( )\n\n |  \n\n##### get the day\n\n |\n\n|  \n\n#####\
    \ getFullYear()\n\n |  \n\n##### get the full year\n\n |\n\nNote:\n\n\"getDay(\
    \ )\" returns from 0 (Sunday) to 6 (Saturday).\n\n\"getMonth( )\" returns from\
    \ 0 (January) to 11 (December).\n\n\"getYear( )\" returns a year, but need to\
    \ add 1900.\n\n\"getFullYear()\" returns a year with the correct format.\n\nExample\
    \ 4.8\n\n| <html><body><script>var now = new Date ( ); // create a date objectvar\
    \ m = now.getMonth( ) + 1; // note it need add 1var d = now.getDate( );var y =\
    \ now.getYear( ) + 1900; // note it need add 1900var fy = now.getFullYear();document.write\
    \ (  m + \" - \" + d + \" - \" + y + \"<br>\"   + \"This year is  \" + fy);</script></body></html>\
    \ |\n\nOutput:\n\n11- 6 - 2015\n\nThis year is 2015\n\nExplanation:\n\n\"now.getMonth(\
    \ )\" returns a month, but need to add 1.\n\n\"now.getDate( )\" returns a current\
    \ date.\n\n\"now.getYear( )\" returns a year, but need to add 1900.\n\n\"getFullYear()\"\
    \ returns a year with the correct format.\n\n### Hours, Minutes, Seconds\n\nThe\
    \ Date Object has the following methods:\n\n|  \n\n##### Methods\n\n |  \n\n#####\
    \ To do\n\n |\n\n|  \n\n##### getHours( )\n\n |  \n\n##### get the hours\n\n |\n\
    \n|  \n\n##### getMinutes( )\n\n |  \n\n##### get the minutes\n\n |\n\n|  \n\n\
    ##### getSeconds( )\n\n |  \n\n##### get the seconds\n\n |\n\n|  \n\n##### getTime(\
    \ )\n\n |  \n\n##### get the time\n\n |\n\nNote that getTime( ) returns a number\
    \ from January 1,1970 to current time.\n\nExample 4.9\n\n| <html><head><title>JavaScript\
    \ Codes</title></head><body><script>var now = new Date( ); // create a date objectvar\
    \ h = now.getHours( );var m = now.getMinutes( );var s = now.getSeconds( );document.write\
    \ ( \"The current time is: <br>\");document.write ( h + \":\" + m + \":\" + s\
    \ );</script></body></html> |\n\n Output:\n\nThe current time is:\n\n19:30:28\n\
    \nExplanation:\n\n\"getHours\" returns the current hours.\n\n\"getMinutes\" returns\
    \ the current minutes.\n\n\"getSeconds\" returns the current seconds.\n\n### Different\
    \ Time\n\n|  \n\n##### getUTCHours( )\n\n##### getTimezoneOffset( )\n\n |\n\n\"\
    getUTCHours( )\" returns the Greenwich Mean Time. (UTC)\n\n\"getTimezoneOffset(\
    \ )\" returns the time difference between UTC time and local time. For example,\
    \ if your time zone is GMT+2, -120 will be returned.\n\nExample 4.10\n\n| <html><head><title>JavaScript\
    \ Codes</title></head><body><script>var now = new Date( ); // create a date objectvar\
    \ utc = now.getUTCHours( ); // get Greenwich Mean Timevar timezone = now.getTimezoneOffset(\
    \ ); // get time zonedocument.write ( utc + \"<br>\" )document.write ( timezone\
    \ + \"<br>\" );</script></body></html> |\n\nOutput:\n\n13\n\n300\n\nExplanation:\n\
    \n\"getUTCHours( )\" returns the UTC hour.\n\n\"13\" means Greenwich Mean Time\
    \ currently.\n\n\"getTimezoneOffeset\" returns a number. For instance,\n\n300\
    \ means Eastern Time. 360 means Central Time. 420 means Mountain Time. 480 means\
    \ Pacific Time.\n\n### Set Date & Time\n\nThe Date Object has the following methods:\n\
    \n|  \n\n##### Methods\n\n |  \n\n##### To do\n\n |\n\n|  \n\n##### setFullYear(\
    \ )\n\n |  \n\n##### set the year\n\n |\n\n|  \n\n##### setMonth( )\n\n |  \n\n\
    ##### set the month\n\n |\n\n|  \n\n##### setDate( )\n\n |  \n\n##### set  the\
    \ date\n\n |\n\n|  \n\n##### setHours( )\n\n |  \n\n##### set the hours\n\n |\n\
    \n|  \n\n##### setMinutes( )\n\n |  \n\n##### set the minutes\n\n |\n\n|  \n\n\
    ##### setSeconds( )\n\n |  \n\n##### set the seconds\n\n |\n\nNote: Please use\
    \ setFullYear( ) instead of setYear( ).\n\nExample 4.11\n\n| <html><head><title>JavaScript\
    \ Codes</title></head><body><script>var now = new Date(); // create a date objectnow.setMonth(0);now.setDate(18);now.setFullYear(2016);var\
    \ today = now;document.write (today);</script></body></html> |\n\nOutput:\n\n\
    Mon Jan 18 2016 09:38:41 GMT-0500 (Eastern Standard Time)\n\nExplanation:\n\n\"\
    setMonth(0), setDate(18) and setFullYear(2016) set the month, date and year as\
    \ Jan 18 2016.\n\n\"0\" represents January in the setMonth(0).\n\n### Timer Function\n\
    \nThe syntax to set an interval time is:\n\n|  \n\n##### window.setTimeout( function(),\
    \ interval_time )\n\n |\n\n\"window.setTimeout( )\" can set the interval time\
    \ to call the function() repeatedly.\n\nExample 4.12\n\n| <html><head><title>JavaScript\
    \ Codes</title></head><body onload=\"autoTimer()\"><script>var count=0;function\
    \ autoTimer( ) { // user-defined functioncount++;if (count <= 9) {document.write\
    \ ( count ); // show the increasing numberswindow.setTimeout( \"autoTimer()\"\
    \ , 1000 );// call autoTime() every other 1 seconds}}</script></body></html> |\n\
    \nOutput:\n\n123456789\n\nExplanation:\n\n\"window.setTimeout( )\" can set the\
    \ interval time to perform an action repeatedly.\n\n \"autoTimer( );\" calls the\
    \ function \"autotimer( ){ }\" every other 1000 milliseconds.\n\n\"1000\" represents\
    \ 1000 milliseconds, which specifies every 1000 milliseconds for autoTimer( )\
    \ to call the function.\n\nThe increasing number appears every other 1 seconds.\n\
    \n### Hands-on Project: This Month…\n\nShow Current Month\n\nOpen Notepad, input\
    \ JavaScript codes:\n\n| <html><body><script>var dateObj = new Date(); // create\
    \ a date objectdocument.write ( \"The current month is: \" + ( dateObj.getMonth()\
    \  + 1));</script></body></html> |\n\nPlease save the file with name \"ShowMonth.html\"\
    .\n\nNote: make sure to use \".html\" extension name.\n\nDouble click \"ShowMonth.html\"\
    \ file, the \"ShowMonth.html\" will be run in a browser, and see the output.\n\
    \nOutput:  \n\nThe current month is: 11\n\nExplanation:\n\nNote: the index of\
    \ month starts with 0.\n\n\"0\" represents January. \"1\" represents February……\n\
    \n\"var dateObj=new Date();\" creates a Date Object.\n\nDate Object has many methods\
    \ that are used to set or get the date information.\n\n\"getMonth( )\" returns\
    \ a number from 0 (January) to 11 (December).\n\n## Chapter 5\n\n### String length\n\
    \n|  \n\n##### string. length\n\n |\n\n\"string.length\" can calculate the string\
    \ length, including spaces.\n\nExample 5.1\n\n| <html><body><script>var mystring\
    \ = \"I love JavaScript\";var stringsize = mystring.length; // get the string\
    \ lengthdocument.write ( \"String length is \" + stringsize );</script></body></html>\
    \ |\n\nOutput:\n\nString length is 17\n\nExplanation:\n\n\"mystring.length\" returns\
    \ the length of mystring, including spaces.\n\n### Connect Strings\n\n|  \n\n\
    ##### string1 + string2 + string3 + string4 + string5……\n\n |\n\nThe \"+\" operator\
    \ is used to join strings together.\n\nExample 5.2\n\n| <html><body><script>var\
    \ string1 = \"JavaScript \";var string2 = \"is \";var string3 = \"very easy! \"\
    ;document.write ( string1 + string2 + string3 ); // join strings</script></body></html>\
    \ |\n\nOutput:     JavaScript is very easy!\n\nExplanation:\n\n\"string1 + string2\
    \ + string3\" uses \"+\" connects strings together.\n\n### Search a Character\n\
    \n|  \n\n##### string.charAt( number )\n\n |\n\n\"string.charAt( number )\" is\
    \ used to find a character in a string.\n\nArgument \"number\" is an index of\
    \ the string, beginning with 0."
