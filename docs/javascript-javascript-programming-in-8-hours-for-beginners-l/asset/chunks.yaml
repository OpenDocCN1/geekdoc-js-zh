  trans: "\n\n## Switch 语句\n\n```javascript\n{\ncase 1: 如果等于此情况，执行此操作； break;\ncase\
    \ 2: 如果等于此情况，执行此操作； break;\ncase 3: 如果等于此情况，执行此操作； break;\ndefault : 如果不等于任何情况，运行默认代码；\
    \ break;\n}\n```\n\n变量的值将首先与每个 case 进行比较，如果等于其中一个 `case` 值，它将执行该 `case` 代码。\n\n\
    `break;` 结束当前语句。\n\n### 示例 2.8\n\n```html\n<html><head><title>JavaScript Test</title></head><body><script>\n\
    var number=20;\nswitch ( number ) { // number value compares each case\ncase 10\
    \ : document.write ( \"Running case 10\" ); break ;\ncase 20 : document.write\
    \ ( \"Running case 20\" ); break;\ncase 30 : document.write ( \"Running case 30\"\
    \ ); break;\ndefault : document.write ( \"Running default code\" ); break; }}\n\
    </script></body></html>\n```\n\n**输出：**\nRunning case 20\n\n**解释：**\n`number`\
    \ 的值为 20；它匹配 `case 20`，因此它运行 `case 20` 中的代码。\n`break;` 结束了该语句，不能省略。\n\n## For\
    \ 循环\n\n```javascript\nfor( 初始化, 测试-表达式, 增量) { //某些代码; }\n```\n\n`for loop` 通过指定的次数重复运行一个代码块。\n\
    \n### 示例 2.9\n\n```html\n<html><script>\nfor (var x = 0; x <= 5; x++) { // 循环\
    \ 5 次\ndocument.write ( x );}</script></html>\n```\n\n**输出：** \n012345\n\n**解释：**\n\
    `var x = 0` 是初始化器，将变量 `x` 初始化为 0。\n`x <= 5` 是 `test-expression`，代码最多运行 5 次。\n\
    `x++` 意味着 `x` 在每次循环中增加 1。\n循环 5 次后，代码将输出 012345。\n\n## While 循环\n\n```javascript\n\
    while ( 测试-表达式 ) { // 在此处某些 js 代码; }\n```\n\n`while loop` 如果指定的条件为真，则循环遍历一个代码块。\n\
    \n### 示例 2.10\n\n```javascript\n<script>\nvar counter=0;\nwhile (counter < 8){\
    \ // 循环 8 次\ndocument.write ( \"&\" );\ncounter++; // 每次循环增加 1}</script>\n```\n\
    \n**输出：**\n&&&&&&&&\n\n**解释：**\n`\"counter< 8\"` 是一个 `test expression`，如果条件为真，代码将循环少于\
    \ 8 次，直到 `counter` 达到 8 为止，此时条件为假，代码将停止运行。\n\n## Do-While 循环\n\n```javascript\n\
    do{ // 在此处某些 js 代码 } while ( 测试-表达式);\n```\n\n`do...while` 先循环一次代码块，然后如果指定的条件为真，则重复循环。\n\
    \n### 示例 2.11\n\n```javascript\n<script>\nvar counter=0;\ndo {\n  document.write\
    \ ( \"@\" );\n  counter++; // 每次循环增加 1\n} while (counter<8); // 循环 8 次</script>\n\
    ```\n\n**输出：**\n@@@@@@@@\n\n**解释：**\n`\"counter< 8\"` 是一个 `test expression`，如果条件为真，代码将循环少于\
    \ 8 次，直到 `counter` 达到 8 为止，此时条件为假，代码将停止运行。\n\n## Break 语句\n\n`break` 关键字用于根据条件停止运行循环。\n\
    \n```javascript\nbreak;\n```\n\n### 示例 2.12\n\n```javascript\n<script>\nvar num=0;\n\
    while (num<10){\n  if (num==5) break; // 如果 num 为 5，则退出\"while loop\"\n  num++;\n\
    }\ndocument.write ( num );</script>\n```\n\n**输出：** 5\n\n**解释：**\n`\"if (num==5)\
    \ break;\"` 是一个 `break statement`。如果 `num` 为 5，程序将运行 `break` 命令，`break statement`\
    \ 将退出循环，然后运行 `document.write (num)`。\n\n## Continue 语句\n\n`continue` 关键字用于停止当前迭代，忽略后续代码，然后继续下一次循环。\n\
    \n```javascript\ncontinue;\n```\n\n### 示例 2.13\n\n```html\n<html><body><script>\n\
    var num=0;\nwhile (num<10){\n  num++;\n  if (num==5) continue; // 进入下一次\"while\
    \ loop\"\n  document.write ( num ); // 如果 num 为 5 则跳过此\n}</script></body></html>\n\
    ```\n\n**输出：**\n1234678910\n\n**解释：**\n注意输出中没有 5。\n`\"if (num==5) continue;\"\
    ` 意味着：当 `num` 为 5 时，程序将运行 `continue` 命令，跳过下一个命令 `document.write ( num )`，然后继续下一次\
    \ while 循环。所以看不到 5。\n\n## 动手项目：数字一\n\n### For 循环示例\n\n打开记事本，输入 JavaScript 代码：\n\
    \n```html\n<html><head><title>Number One</title></head>body><script language=\"\
    javascript\">\nfor ( n = 1; n <= 6; n++ ){ // 循环 6 次\n  document.write ( \"<h\"\
    +n+\">Number \"+n+\"</h\"+n+\">\");\n} // 输出\n</script></body>\n</html>\n```\n\
    \n**解释：**\n`for( init, test-expression, increment) { //某些代码; }` 通过指定的次数重复运行一个代码块。\n\
    `var x = 0` 是初始化器，将变量 `x` 初始化为 0。\n`x <= 5` 是 `test-expression`，代码最多运行 5 次。\n\
    `x++` 意味着 `x` 在每次循环中增加 1。\n循环 5 次后，代码将输出 012345。\n\n"
