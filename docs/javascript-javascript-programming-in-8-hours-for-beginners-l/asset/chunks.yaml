- fmt: "\n# PI & Random Value\n\n### Math.PI\n`Math.PI` is a constant that stores\
    \ the value of pi.\n\n### Math.random()\n`Math.random()` generates a number between\
    \ 0.0 to 1.0.\n\n#### Example 4.6\n```html\n<script>\nvar pi = Math.PI;\nvar ran\
    \ = Math.random();\ndocument.write (\"The PI value is \" + pi + \"<br>\");\ndocument.write\
    \ (\"The random number is \" + ran);\n</script>\n```\n**Output:**\nThe PI value\
    \ is 3.141592653589793\nThe random number is 0.6315033452119678\n\n**Explanation:**\n\
    The value of `Math.PI` is 3.141592653589793.\n`Math.random()` generates a random\
    \ number between 0.0 to 1.0, in here the result is 0.6315033452119678.\n\n# Date\
    \ & Time\n\nJavaScript often uses date and time to design the web page. When using\
    \ date and time, you must create an object of date first.\n\n### `var DateObject\
    \ = new Date()` // create a date object\n\n#### Example 4.7\n```html\n<script>\n\
    var DateObject = new Date(); // create a date object\ndocument.write ( DateObject\
    \ );\n</script>\n```\n**Output:**\nThu Nov 05 2015 21:39:28 GMT-0500 (Eastern\
    \ Standard Time)\n\n**Explanation:**\n`var DateObject = new Date()` ` creates\
    \ an object of date.\n`document.write ( DateObject )` shows the current date and\
    \ time.\n\n# Date, Month, Year, Day\n\nThe Date Object has the following method:\n\
    \n- `getDate()`: get the date\n- `getMonth()`: get the month (need to add 1)\n\
    - `getYear()`: get the year (need to add 1900)\n- `getDay()`: get the day\n- `getFullYear()`:\
    \ get the full year\n\n**Note:**\n- `getDay()` returns from 0 (Sunday) to 6 (Saturday).\n\
    - `getMonth()` returns from 0 (January) to 11 (December).\n- `getYear()` returns\
    \ a year, but need to add 1900.\n- `getFullYear()` returns a year with the correct\
    \ format.\n\n#### Example 4.8\n```html\n<html><body><script>\nvar now = new Date\
    \ (); // create a date object\nvar m = now.getMonth() + 1; // note it need add\
    \ 1\nvar d = now.getDate();\nvar y = now.getYear() + 1900; // note it need add\
    \ 1900\nvar fy = now.getFullYear();\ndocument.write ( m + \" - \" + d + \" - \"\
    \ + y + \"<br>\" + \"This year is \" + fy);\n</script></body></html>\n```\n**Output:**\n\
    11- 6 - 2015\nThis year is 2015\n\n**Explanation:**\n`now.getMonth()` returns\
    \ a month, but need to add 1.\n`now.getDate()` returns a current date.\n`now.getYear()`\
    \ returns a year, but need to add 1900.\n`getFullYear()` returns a year with the\
    \ correct format.\n\n# Hours, Minutes, Seconds\n\nThe Date Object has the following\
    \ methods:\n\n- `getHours()`: get the hours\n- `getMinutes()`: get the minutes\n\
    - `getSeconds()`: get the seconds\n- `getTime()`: get the time\n\nNote that `getTime()`\
    \ returns a number from January 1, 1970 to current time.\n\n#### Example 4.9\n\
    ```html\n<html><head><title>JavaScript Codes</title></head><body><script>\nvar\
    \ now = new Date(); // create a date object\nvar h = now.getHours();\nvar m =\
    \ now.getMinutes();\nvar s = now.getSeconds();\ndocument.write ( \"The current\
    \ time is: <br>\");\ndocument.write ( h + \":\" + m + \":\" + s );\n</script></body></html>\n\
    ```\n**Output:**\nThe current time is:\n19:30:28\n\n**Explanation:**\n`getHours`\
    \ returns the current hours.\n`getMinutes` returns the current minutes.\n`getSeconds`\
    \ returns the current seconds.\n\n# Different Time\n\n- `getUTCHours()`: returns\
    \ the Greenwich Mean Time. (UTC)\n- `getTimezoneOffset()`: returns the time difference\
    \ between UTC time and local time. For example, if your time zone is GMT+2, -120\
    \ will be returned.\n\n#### Example 4.10\n```html\n<html><head><title>JavaScript\
    \ Codes</title></head><body><script>\nvar now = new Date(); // create a date object\n\
    var utc = now.getUTCHours(); // get Greenwich Mean Time\nvar timezone = now.getTimezoneOffset();\
    \ // get time\ndocument.write ( utc + \"<br>\" )\ndocument.write ( timezone +\
    \ \"<br>\" );\n</script></body></html>\n```\n**Output:**\n13\n300\n\n**Explanation:**\n\
    `getUTCHours()` returns the UTC hour. \"13\" means Greenwich Time currently.\n\
    `getTimezoneOffset()` returns a number. For instance, \"300\" means Eastern Time,\
    \ \"360\" means Central Time, \"420\" means Pacific Time.\n\n# Set Date & Time\n\
    \nThe Date Object has the following methods:\n\n- `setFullYear()`: set the year\n\
    - `setMonth()`: set the month\n- `setDate()`: set the date\n- `setHours()`: set\
    \ the hours\n- `setMinutes()`: set the minutes\n- `setSeconds()`: set the seconds\n\
    \n**Note:** Please use `setFullYear()` instead of `setYear()`.\n\n#### Example\
    \ 4.11\n```html\n<html><head><title>JavaScript Codes</title></head><body><script>\n\
    var now = new Date(); // create date object\nnow.setMonth(0);\nnow.setDate(18);\n\
    now.setFullYear(2016);\nvar today = now;\ndocument.write (today);\n</script></body></html>\n\
    ```\n**Output:**\nMon Jan 18 2016 ... (Eastern Standard Time)\n\n**Explanation:**\n\
    `setMonth(0)`, `setDate(18)` and `setFullYear(2016)` set the month, date and year\
    \ as Jan 18 2016. \"0\" represents January.\n\n# Timer Function\n\nThe syntax\
    \ to set an interval time is: `window.setTimeout( function(), interval_time )`\n\
    `window.setTimeout()` can set the interval time to call the `function()` repeatedly.\n\
    \n#### Example 4.12\n```html\n<html><head><title>JavaScript Codes</title></head><body\
    \ onload=\"autoTimer()\"><script>\nvar count=0;\nfunction autoTimer() { // user-defined\
    \ function\n    count++;\n    if (count <= 9) {\n        document.write ( count\
    \ ); // show the increasing numbers\n        window.setTimeout( \"autoTimer()\"\
    \ , 1000 );\n    }\n}\n</script></body></</html>\n```\n**Output:**\n123456789\n\
    \n**Explanation:**\n`window.setTimeout()` can set the interval time to perform\
    \ an action. `autoTimer()` calls the function every 1000 milliseconds. \"1000\"\
    \ represents 1000 milliseconds, which specifies the interval for `autoTimer()`\
    \ to call the function. The increasing number appears every 1 seconds.\n\n# Hands-on\
    \ Project: This Month\n\n### Show Current Month\nOpen Notepad, input JavaScript\
    \ codes:\n```html\n<html><body><script>\nvar dateObj = new Date(); // create a\
    \ date object\ndocument.write ( \"The current month is: \" + (dateObj.getMonth()\
    \ + 1));\n</script></body></html>\n```\nSave the file with name `ShowMonth.html`.\n\
    **Note:** make sure to use `.html` extension name. Double click `ShowMonth.html`\
    \ file to run it in a browser and see the output.\n\n**Output:**\nThe current\
    \ month is: 1\n\n**Explanation:**\nNote: the index of month starts with 0. \"\
    0\" represents January. \"1\" represents February...\n`var dateObj=new Date()`\
    \ creates a Date Object. Date Object has many methods that are used to set or\
    \ get date information. `getMonth()` returns a number from 0 (January) to 11 (December).\n\
    \n# Chapter 5\n\n### String length\n\n`string.length` can calculate the string\
    \ length, including spaces.\n\n#### Example 5.1\n```html\n<html><body><script>\n\
    var mystring = \"I love JavaScript\";\nvar stringsize = mystring.length; // get\
    \ the string length\ndocument.write ( \"String length is \" + stringsize );\n\
    </script></body></html>\n```\n**Output:**\nString length is 17\n\n**Explanation:**\n\
    `mystring.length` returns the length of `mystring`, including spaces.\n\n### Connect\
    \ Strings\n\n`string1 + string2 + string3 + string4 + string5……`\nThe `+` operator\
    \ is used to join strings together.\n\n#### Example 5.2\n```html\n<html><body><script>\n\
    var string1 = \"JavaScript \";\nvar string2 = \"is \";\nvar string3 = \"very easy!\
    \ \";\ndocument.write ( string1 + string2 + string3 ); // join strings\n</script></body></html>\n\
    ```\n**Output:**\nJavaScript is very easy!\n\n**Explanation:**\n`string1 + string2\
    \ + string3` uses `+` to connect strings together.\n\n### Search a Character\n\
    \n`string.charAt( number )` is used to find a character in a string. Argument\
    \ `number` is an index of the string, beginning with 0.\n"
  raw: "### PI & Random Value \n\n|  \n\n##### Math.PI\n\n##### Math.random( )\n\n\
    \ |\n\nMath.PI is a constant that stores the value of pi.\n\nMath.random( ) generates\
