    ## About This Book:

    "JavaScript Programming & Exercises" is a textbook for high school, college and
    university students; it covers all essential JavaScript language knowledge. You
    can learn complete primary skills of JavaScript programming fast and easily.


    ## Disclaimer:

    This textbook is only suitable for the JavaScript programming beginners, high
    school, college and university students; it is not for the experienced JavaScript
    programmers.


