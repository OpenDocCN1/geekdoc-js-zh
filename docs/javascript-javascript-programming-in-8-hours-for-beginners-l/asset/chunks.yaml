    \n`break` keyword is used to stop running the loop according to the condition.\n\
    \n```javascript\nbreak;\n```\n\n### Example 2.12\n\n```javascript\n<script>\n\
    var num=0;\nwhile (num<10){\n  if (num==5) break; // exit the \"while loop\" if\
