    ### 动手项目：最大值与最小值


    #### Math 对象


    打开记事本，输入 JavaScript 代码：


    ```html

    <html><head><script>

    var number1 = 20;

    var number2 = 50;

    var number3 = 80;

    document.write ("The maximum number among 20, 50, 80 is:  "+Math.max(number1,number2,number3)+"<br><br>");

    // 返回三个数字中的最大值

    document.write ("The minimum number among 20, 50, 80 is:  "+Math.min(number1,number2,number3)+"<br><br>");

    // 返回三个数字中的最小值

    </script></head></html>

    ```


    请将文件保存为 `MathObject.html`。


    注意：请确保使用 `.html` 扩展名。


    双击 `MathObject.html` 文件，`MathObject.html` 将在浏览器中运行并查看输出。


    输出：

    20, 50, 80 中的最大值是：80

    20, 50, 80 中的最小值是：20


    解释说明：

    `Math.max( )` 获取最大值。

    `Math.min( )` 获取最小值。


    ## 第 7 章


    ### HTML 基础


    当我们检查网页的源代码时，会发现一些 HTML 元素或标签，它们看起来像这样：


    示例 7.1


    ```html

    <html>

    <head>

    <title>...</title>

    </head>

    <body>

    <form>...</form>

    ...

    </body>

    </html>

    ```


    解释说明：

    `<html>...</html>` 定义网页的文档。

    `<head>...</head>` 定义网页的头部（head）。

    `<title>...</title>` 定义网页的标题。

    `<body>...</body>` 定义网页的正文内容（body）。

    `<form>...</form>` 定义一个表单，用于接收来自用户的请求或输入。


    ### 点击事件


    `onClick = function( );`


    `"onClick = function( );"` 意味着当元素被点击时，函数会立即运行。触发点击事件。


    示例 7.2


    ```html

    <form><input type="button" value="Previous" onClick="history.back( )">   <!--
    点击事件 --></form>

    ```


    返回：

    上一个页面


    解释说明：

    `<form>` 和 `</form>` 是 HTML 标签，用于定义网页。

    `form` 用于接收用户的请求。

    `<input type="button" value="Previous"…>` 定义了表单中的一个按钮，按钮上有“Previous”文字。

    `"onClick="history.back( )"` 意味着当点击按钮时，`history.back( )` 立即运行，然后返回上一个网页。


    ### 加载事件


    `onLoad = "function( )"`


    `onLoad="function( )"` 在网页加载完成后执行该函数。


    示例 7.3


    ```html

    <html><body onLoad = "test( )">  <!-- 加载事件 --><script>function test(){document.write
    ("Welcome to my website!");}</script></body></html>

    ```


    输出：

    欢迎来到我的网站！


    解释说明：

    `<html>` 和 `</html>` 是 HTML 标签，用于定义网页。

    `<body>` 和 `</body>` 定义网页的正文。

    `onLoad= "test( )"` 在网页加载后立即执行 `test()`。


    ### 键按下事件


    `onKeyPress = function( );`


    `"onKeyPress=function( )"` 在按下按键时执行该函数。


    示例 7.4


    ```html

    <html><script>function myFunction(msg) { document.write (msg);}</script><body
    onKeyPress = "myFunction(''Hello! My Friend.'')">请按一个键。      <!-- 键按下事件 --></body></html>

    ```


    输出：

    Hello! My Friend.


    解释说明：

    `onKeyPress=function( )` 执行了该函数。


    ### 鼠标悬停事件


    `"onKeyPress=function( )"`（注：根据上下文）

    `onOver = function( );`


    `"onOver = function( )"` 在鼠标悬停在元素上时执行该函数。


    示例 7.5


    ```html

    <html><head><script>function myFunction() {document.write ("Mouseover!");}</script></head><body
    onmouseover="myfunction()">悬在这里</body></html>

    ```


    输出：

    Mouseover!


    解释说明：

    `onmouseover="myfunction()` 在鼠标悬停时执行函数。


    ### 鼠标移出事件


    `onOut = function( );`


    `"onOut = function( )"` 在鼠标指针移出元素时执行该函数。


    示例 7.6


    ```html

    <html><head><script>function myFunction() {document.write ("Mouseout!");}</script></head><body
    onmouseout="myfunction()">移这里</body></html>

    ```


    输出：

    Mouseout!


    解释说明：

    `onmouseout="myfunction()` 在鼠标移出时执行函数。


    ### 键释放事件


    `onKeyUp = function( );`


    `"onKeyUp=function( )"` 在释放按键时执行该函数。


    示例 7.7


    ```html

    <html><script>function myFunction(msg) { document.write (msg);}</script><body
    onkeyup="myFunction(''KeyUp event!'')">请释放一个键。      <!-- 键释放事件 --></body></html>

    ```


    输出：

    KeyUp event!


    解释说明：

    `onkeyup=function( )` 在释放按键时执行函数。


    ### 聚焦事件


    `onFocus = function( );`


    `"onFocus = function( )"` 在用户点击输入框时执行该函数。


    示例 7.8


    ```html

    <html><head><script>function myFunction() {document.write ("Focus event!");}</script></head><body><input
    type="text" onfocus="myfunction()"></body></html>

    ```


    输出：

    Focus event!


    解释说明：

    `onfocus="myfunction()` 在点击字段时执行函数。


    ### 失去焦点事件


    `onBlur = function( );`


    `"onBlur = function( )"` 在用户点击离开输入框时执行该函数。


    示例 7.9


    ```html

    <html><head><script>function myFunction() {document.write ("Blur event!");}</script></head><body><input
    type="text" onblur="myfunction()"></body></html>

    ```


    输出：

    Blur event!


    解释说明：

    `onblur="myfunction()` 在点击离开字段时执行函数。


    ### 重置事件


    `onReset = "function( )"`


    `onReset="function( )"` 在表单重置时执行该函数。


    示例 7.10


    ```html

    <html><form onreset="alert(''The form has been reset!'')"><input type="text" id="txt"><input
    type="reset" value="Reset" ><><!-- 重置事件 --></form></html>

    ```


    输出：

    表单已重置。


    解释说明：

    `onreset="alert()` 在点击重置按钮时运行 alert( )。


    ### 提交事件


    `onSubmit = "function( )"`


    `onSubmit="function( )"` 在表单提交时执行该函数。


    示例 7.11


    ```html

    <html><form onSubmit="alert(''The form has been submitted!'')"><input type="text"
    id="txt"><input type="submit" value="Submit" ><><!-- 提交事件 --></form></html>

    ```


