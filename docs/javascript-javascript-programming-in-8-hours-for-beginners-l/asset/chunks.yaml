  trans: "\n\n# PI 与 随机值\n\n### Math.PI\n`Math.PI` 是一个存储圆周率 值的常量。\n\n### Math.random()\n\
    `Math.random()` 生成一个 0.0 到 1.0 之间的随机数。\n\n#### 示例 4.6\n```html\n<script>\nvar\
    \ pi = Math.PI;\nvar ran = Math.random();\ndocument.write (\"The PI value is \"\
    \ + pi + \"<br>\");\ndocument.write (\"The random number is \" + ran);\n</script>\n\
    ```\n**输出：**\nThe PI value is 3.141592653589793\nThe random number is 0.6315033452119678\n\
    \n**解释：**\n`Math.PI` 的值为 3.141592653589793。\n`Math.random()` 生成一个 0.0 到 1.0 之间的随机数，在这里的结果是\
    \ 0.6315033452119678。\n\n# 日期与 时间\n\nJavaScript 经常使用日期和时间来设计网页。在使用日期时间之前，必须先创建一个日期对象。\n\
    \n### `var DateObject = new Date()` // 创建日期对象\n\n#### 示例 4.7\n```html\n<script>\n\
    var DateObject = new Date(); // create a date object\ndocument.write ( DateObject\
    \ );\n</script>\n```\n**输出：**\nThu Nov 05 2015 21:39:28 GMT-0500 (Eastern Standard\
    \ Time)\n\n**解释：**\n`var DateObject = new Date()` 创建了一个日期对象。\n`document.write\
    \ ( DateObject )` 显示当前的日期和时间。\n\n# 日期、月、年、日\n\nDate 对象具有以下方法：\n\n- `getDate()`：获取日期\n\
    - `getMonth()`：获取月份（需要加 1）\n- `getYear()`：获取年份（需要加 1900）\n- `getDay()`：获取星期\n\
    - `getFullYear()`：获取完整的年份\n\n**注意：**\n- `getDay()` 返回从 0（星期日）到 6（星期六）。\n- `getMonth()`\
    \ 返回从 0（一月）到 11（十二月）。\n- `getYear()` 返回年份，但需要加 1900。\n- `getFullYear()` 返回格式正确的年份。\n\
    \n#### 示例 4.8\n```html\n<html><body><script>\nvar now = new Date (); // create\
    \ a date object\nvar m = now.getMonth() + 1; // 注意这里需要加 1\nvar d = now.getDate();\n\
    var y = now.getYear() + 1900; // 注意这里需要加 1900\nvar fy = now.getFullYear();\ndocument.write\
    \ ( m + \" - \" + d + \" - \" + y + \"<br>\" + \"This year is \" + fy);\n</script></body></html>\n\
    ```\n**输出：**\n11- 6 - 2015\nThis year is 2015\n\n**解释：**\n`now.getMonth()` 返回月份索引，但需要加\
    \ 1。\n`now.getDate()` 返回当前日期。\n`now.getYear()` 返回年份，但需要加 1900。\n`getFullYear()`\
    \ 返回格式正确的年份。\n\n# 小时、分、秒\n\nDate 对象具有以下方法：\n\n- `getHours()`：获取小时\n- `getMinutes()`：获取分钟\n\
    - `getSeconds()`：获取秒\n- `getTime()`：获取时间\n\n注意 `getTime()` 返回的是从 1970 年 1 月 1\
    \ 日到当前时间的数字。\n\n#### 示例 4.9\n```html\n<html><head><title>JavaScript Codes</title></head><body><script>\n\
    var now = new Date(); // create a date object\nvar h = now.getHours();\nvar m\
    \ = now.getMinutes();\nvar s = now.getSeconds();\ndocument.write ( \"The current\
    \ time is: <br>\");\ndocument.write ( h + \":\" + m + \":\" + s );\n</script></body></html>\n\
    ```\n**输出：**\nThe current time is:\n19:30:28\n\n**解释：**\n`getHours` 返回当前小时。\n\
    `getMinutes` 返回当前分钟。\n`getSeconds` 返回当前秒。\n\n# 不同的时间\n\n- `getUTCHours()`：返回格林威治标准时间\
    \ (UTC)。\n- `getTimezoneOffset()`：返回 UTC 时间与本地时间之间的差。例如，如果你的时区是 GMT+2，则将返回 -120。\n\
    \n#### 示例 4.10\n```html\n<html><head><title>JavaScript Codes</title></head><body><script>\n\
    var now = new Date(); // create a date object\nvar utc = now.getUTCHours(); //\
    \ 获取格林威治标准时间\nvar timezone = now.getTimezoneOffset(); // 获取时区\ndocument.write\
    \ ( utc + \"<br>\" )\ndocument.write ( timezone + \"<br>\" );\n</script></body></html>\n\
    ```\n**输出：**\n13\n300\n\n**解释：**\n`getUTCHours()` 返回 UTC 小时。“13”意味着当前的格林威治时间。\n\
    `getTimezoneOffset()` 返回一个数字。例如，“300”表示东部时间，“360”表示中部时间，“420”表示太平洋时间。\n\n# 设置日期与时间\n\
    \nDate 对象具有以下设置方法：\n\n- `setDate()`：设置日期\n- `setMonth()`：设置月份\n- `setFullYear()`：设置年份\n\
    - `setHours()`：设置小时\n- `setMinutes()`：设置分钟\n- `setSeconds()`：设置秒\n- `setTime()`：设置时间\n\
    \n**注意：**\n- `setDate()` 接受的值是 1 到 31。\n- `setMonth()` 接受的值是 0 到 11。\n- `setFullYear()`\
    \ 接受四位年份。\n\n#### 示例 4.11\n```javascript\nvar now = new Date(); // 创建日期对象\nnow.setDate(15);\
    \ // 设置日期为 15 号\nnow.setMonth(5); // 设置月份为 6 月\nnow.setFullYear(2025); // 设置年份为\
    \ 2025 年\ndocument.write(now);\n```\n**输出：**\nSun Jun 15 2025 ...\n\n#### 示例 4.12\n\
    ```html\n<html><head><title>JavaScript Codes</title></head><body><script>\nvar\
    \ now = new Date(); // 创建一个日期对象\nnow.setHours(10, 30, 0); // 设置小时、分、秒\ndocument.write(now);\n\
    </script></body></html>\n```\n**输出：**\n... 10:30:00 ...\n\n# 计时器\n\nJavaScript\
    \ 使用 `setTimeout` 和 `setInterval` 来执行定时任务。\n\n- `setTimeout(function, milliseconds)`：在指定的毫秒数后执行一次函数。\n\
    - `setInterval(function, milliseconds)`：每隔指定的毫秒数执行一次函数。\n\n#### 示例 4.13\n```javascript\n\
    var count = 0;\nfunction timer() {\n    count++;\n    console.log(\"Count is:\
    \ \" + count);\n}\nsetInterval(timer, 1000); // 每 1 秒执行一次 timer\n```\n\n#### 示例\
    \ 4.14\n```javascript\nvar count = 0;\nvar timer = setInterval(function() {\n\
    \    count++;\n    console.log(\"Count is: \" + count);\n    if (count == 5) {\n\
    \        clearInterval(timer); // 5 次后停止计时器\n    }\n}, 1000);\n```\n\n"
- fmt: "\n# Example 5.3\n\n| <html><script>var mystring = \"JavaScript is easy\";var\
    \ charac = mystring.charAt ( 2 );�// search a character at index 2document.write\
    \ ( charac );</script></html> |\n\nOutput: `v`\n\nExplanation:\n\n`\"mystring.charAt(\
    \ 2 )\"` finds a character in `mystring` at index 2, and returns the result `\"\
    v\"`.\n\nNote that index of the string begins with zero.\n\n## Convert Character\
    \ Case\n\n|  |\n\n##### `string.toUpperCase( )`\n\n##### `string.toLowerCase(\
    \ )`\n\n |\n\n`\"toUpperCase( )\"` and `\"toLowerCase( )\"` can convert case.\n\
    \n# Example 5.4\n\n| <script>var mystring = \"Hello World!\";var big = mystring.toUpperCase(\
    \ );var small = mystring.toLowerCase( );document.write ( \"Uppercase is \" + big\
    \ + \"<br>\" );�document.write ( \"Lowercase is \" + small);</script> |\n\nOutput:\n\
    \nUppercase is HELLO WORLD!\n\nLowercase is hello world!\n\nExplanation:\n\n`\"\
    mystring.toUpperCase( )\"` and `str.toLowerCase( )` converts the case of `mystring`.\n\
    \n## Split a String\n\n`\"split(\" \" )\"` can split a string into multiple substrings\
    \ according to the spaces in the string.\n\n`\"split()\"` is also used to convert\
    \ a string into an array.\n\n|  |\n\n##### `string.split( \" \" );`\n\n |\n\n\
    The `(\" \")` means that the string is split according to the spaces in the string,\
    \ but the separators are commas `\",\"`.\n\n# Example 5.5\n\n| <html><head><title>JavaScript\
    \ Codes</title></head><body><script>var mystring = \"JavaScript for Beginners\"\
    ;var substr = mystring.split( \" \" ); /* split mystring into substrings according\
    \ to the spaces of mystring */document.write ( substr ); // shows substringsdocument.write\
    \ ( \"<br>\" + substr[0]);document.write ( \"<br>\" + substr[1]);document.write\
    \ ( \"<br>\" + substr[2]);</script></body></html> |\n\nOutput:\n\nJavaScript,\
    \ for, Beginners\n\nJavaScript\n\nfor\n\nBeginners\n\nExplanation:\n\n`\"mystring.split(\
    \ \" \" )\"` separates the string into multiple substrings according to the spaces\
    \ of `mystring`, using the comma to split `mystring`.\n\n`\"document.write ( substr\
    \ );\"` shows the multiple substrings.\n\n`\"substr[0]\"` shows the first substring.\n\
    \n`\"substr[1]\"` shows the second substring.\n\n`\"substr[2]\"` shows the third\
    \ substring.\n\n## Extract Substring\n\n|  |\n\n##### `string.substr( start, length\
    \ );`\n\n |\n\n`\"substr( start, length )\"` can extract a substring from a string.\n\
    \n`\"start\"` argument specifies the starting position to extract.\n\n`\"length\"\
    ` argument specifies the substring length.\n\n# Example 5.6\n\n| <script>var mystring\
    \ = \"JavaScript is easy.\";var sub = mystring.substr( 4, 6 ); /* extract a sub-string\
    \ from index 4, and length 6. */document.write ( sub );</script> |\n\nOutput:\
    \ \n\nScript\n\nExplanation:\n\n`\"mystring.substr( 4, 6 )\"` extracts a substring\
    \ from `mystring`.\n\n`\"( 4, 6 )\"` specifies substring's starting position is\
    \ 4, length is 6.\n\nNote that string index begins with zero.\n\n## Convert a\
    \ Number to String\n\n|  |\n\n##### `number.toString( );`\n\n |\n\nTo meet the\
    \ requirement of JS programming, sometimes a number needs to convert to a string\
    \ data type.\n\n`\"number.toString( )\"` can change a number to a string.\n\n\
    # Example 5.7\n\n| <script>var num1 = 12; var num2 = 68;var str1 = num1.toString(\
    \ ); // convert to stringvar str2 = num2.toString( ); // convert to stringvar\
    \ sum = str1 + str2; // connecting instead of addingdocument.write ( sum );</script>\
    \ |\n\nOutput: 1268\n\nExplanation:\n\n`\"num1.toString( )\"` and `\"num2.toString(\
    \ )\"` converts two numbers to string type. Therefore, the result of `str1` adding\
    \ `str2` is 1268, instead of 80.\n\n## Convert a String to a Number\n\n|  |\n\n\
    ##### `parseInt(string);`\n\n##### `parseFloat( string);`\n\n |\n\n`\"parseInt(string)\"\
    ` and `parseFloat(string)` can change a string to integer or floating point number.\n\
    \n# Example 5.8\n\n| <script>var str1 = \"12\"; var str2 = \"68\";var num1 = parseInt(\
    \ str1 ); // convert to Intvar num2 = parseFloat( str2 ); // convert to Intvar\
    \ addition = num1 + num2; // add instead of joindocument.write ( addition );</script>\
    \ |\n\nOutput: 80\n\nExplanation:\n\n`\"parseInt( str1)\"` and `\"parseFloat(\
    \ str2 )\"` convert two strings to number type. Therefore, the result of `num1`adding\
    \ `num2` is 80, instead of 1268.\n\n## Search Specific Word (1)\n\n|  |\n\n#####\
    \ `indexOf( )`\n\n |\n\n`\"indexOf( )\"` can find the first location where the\
    \ specified word occurs in a string.\n\n# Example 5.9\n\n| <script>var mystring\
    \ = \"Please do what you decide to do!\";var index = mystring.indexOf(\"do\");\
    \ // return indexdocument.write ( index );</script> |\n\nOutput: \n\n7\n\nExplanation:\n\
    \n`\"mystring.indexOf ( \"do\" )\"` returns the first location where `\"do\"`\
    \ occurs in `mystring`. The output is 7.\n\n## Search Specific Word (2)\n\n| \
    \ |\n\n##### `lastIndexOf( )`\n\n |\n\n`\"lastIndexOf( )\"` can find the last\
