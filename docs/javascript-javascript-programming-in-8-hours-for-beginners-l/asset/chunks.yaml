    <script>\nvar myarray = new Array( );\nmyarray[0] =\"Mon\";\nmyarray[1] =\"Tue\"\
    ;\nmyarray[2] =\"Wed\";\nmyarray[3] =\"Tue\";\nvar num = myarray.fill in here(\"\
    Tue\"); // 获取 \"Tue\" 的索引\ndocument.write (num);\n</script>\n</body></html>\n\
    ```\n\nA. `indexOf` B. `getIndex` C. `index` D. `key`\n\n(24)\n\n```html\n<html><script>\n\
    var now = new Date( );    // 创建日期对象\nvar utc = now.fill in here( ); // 获取格林尼治时间\n\
    var timezone = now.getTimezoneOffset( );  // 获取时区\ndocument.write ( utc )\ndocument.write\
    \ ( timezone );\n</script></html>\n```\n\nA. `UTC` B. `getUTC` C. `getHours` D.\
    \ `getUTCHours`\n\n(25)\n\n```html\n<html><body>\n<script>\nvar myString = \"\
    Please click me!\";\nvar result = myString.fill in here(\"http://www.xxxxxx.xxx\"\
    );\n// 为字符串添加超链接  \ndocument.write (\"Welcome to our website:   + result );\n\
    </script>\n</body></html>\n```\n\nA. `hyperlink` B. `link` C. `href` D. `url`\n\
    \n(26)\n\n```html\n<html><body>\n<script>\nvar txt1 = \"Hello! \"\nvar txt2 =\
    \ \"My friend.\";\nvar result = txt1.fill in here( txt2 ); // 连接两个字符串\ndocument.write\
    \ ( result );\n</script>\n</body></html>\n```\n\nA. `connect` B. `join` C. `concat`\
    \ D. `&`\n\n(27)\n\n```html\n<html><head>\n<script type=\"text/JavaScript\">\n\
    function myFunction(msg) {\n  document.write (msg);\n}\n</script>\n</head> <!--\
    \ 按键事件 -->\n<body fill in here =\"myFunction('Hello! My Friend.')\">\n请按下任意键。\n\
    </body></html>\n```\n\nA. `keypress` B. `onkeypress` C. `keyEvent` D. `pressKey`\n\
    \n(28)\n\n```html\n<html><body>\n<form>\n<input type=\"text\" name=\"myText\"\
    \ id=\"myText\" />\n<!-- - \"<input type=\"text\">\" 接受数据输入- -->\n</form>\n<script\
    \ type=\"text/javascript\">\ndocument.getElementById(\"myText\").onchange = function(){\n\
    // 改变事件\ndocument.write (\"You have entered: \" + fill in here.value);   \n//\
    \ 一个对象代表 myText\n}\n</script>\n</body></html>\n```\n\nA. `this` B. `object` C.\
    \ `input` D. `text`\n\n(29)\n\n```html\n<html><body>\n<script>\nvar myString =\
    \ \"Hello world!\";\nvar result = myString.fill in here(4); // 返回 unicode\ndocument.write\
    \ (\"The Unicode of the 5th character is \" + result );\n</script>\n</body></html>\n\
    ```\n\nA. `getUnicode` B. `Unicode` C. `charCode` D. `charCodeAt`\n\n(30)\n\n\
    ```html\n<html><body>\n<script>\nvar num = 10.28;\nvar str = num.fill in here(1);\
    \ /* 将数字转换为保留 1 位小数的字符串 */\ndocument.write (str);\n</script>\n</body></html>\n\
    ```\n\nA. `toString` B. `toFixed` C. `toStr` D. `toCharacter`\n\n(31)\n\n```html\n\
    <html><body>\n<!-- 提交事件 -->\n<form fill in here = \"document.write ('The form\
    \ has been submitted!')\">\n<input type = \"text\" id = \"txt\">\n<input type\
    \ = \"submit\" value = \"submit\" >\n</form>\n</body></html>\n```\n\nA. `submit`\
    \ B. `submitEvent` C. `onsubmit` D. `clicksubmit`\n\n(32)\n\n```html\n<html><body>\n\
