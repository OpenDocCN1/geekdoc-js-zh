  trans: "\n\n# Hello World!\n\n## 解释：\n\n`<!DOCTYPE html>` 是一个 HTML 5 标签，意味着当前文件是一个\
    \ HTML 5 文件。\n\n`<script type = \"text/javascript\">` 是 JavaScript 标签。JavaScript\
    \ 代码包含在其中。\n\n`document.write (\"Hello World!\")` 显示或打印 `\"Hello World!\"`。\n\n\
    每个 JavaScript 命令都以分号（`;`）结束。\n\nJavaScript 代码块可以嵌入到 HTML 文件的任何位置，并由浏览器运行。\n\n\
    `<!-- -->` 是 HTML 注释符号。\n\n## 注释\n\n注释用于解释代码。\n\n##### `//` 这是一个单行注释\n\n#####\
    \ `/*`\n\n##### 这是一个多行注释；JavaScript 解释器将忽略单行注释和多行注释。\n\n##### `*/`\n\n### 示例 1.2\n\
    \n```html\n<script type = \"text/javascript\">document.write (\"Hello World\"\
    ); // show \"Hello World\"./* \"document.write()\" shows the content \"Hello World\"\
    . \"document.write ( )\" is usually used to display the specified contents to\
    \ users */</script>\n```\n\n#### 解释：\n\n`// \"document.write () \"` 显示一条消息是一个单行注释。\n\
    \n`/* \"document.write () \" shows a message \"Hello World\". …… */` 是多行注释。\n\n\
    ## 运行第一个程序\n\n### 示例 1.3\n\n打开记事本，输入如下 JavaScript 代码：（图 1.1）\n\nJavaScript 代码被嵌入在\
    \ HTML 文件中。\n\n```html\n<!DOCTYPE html><html><head><title>第一个 JavaScript 程序</title></head><body><script\
    \ language=\"javascript\"> // start javascriptdocument.write (\"<h2>Hello World!\
    \ </h2>\") // output</script></body></html>\n```\n\n（图 1.1 在记事本中输入 JavaScript\
    \ 代码）\n\n请将文件保存为 `\"FirstJavaScript.html\"`。\n\n**注意：** 确保使用 `.html` 扩展名。\n\n\
    双击 `\"FirstJavaScript.html\"` 文件，该文件将在浏览器中运行并看到输出。（图 1.2）\n\n#### 输出： \n\nHello\
    \ World!（图 1.2）\n\n#### 解释：\n\n`document.write (\"<h2>Hello World! </h2>\")` 输出\
    \ `\"Hello World!\"`\n\n如果你想编辑代码，右键点击 `\"FirstJavaScript.html\"` > 打开方式 > 记事本。\n\
    \n## 关键字\n\n关键字属于 JavaScript 身。在为变量、函数、数组、属性选择标识符名称时不能使用这些关键字。以下是 JavaScript 关键字：\n\
    \n| `break` |\n| `case` |\n| `continue` |\n| `default` |\n| `delete` |\n| `do`\
    \ |\n| `else` |\n| `export` |\n| `false` |\n| `for` |\n| `function` |\n| `if`\
    \ |\n| `import` |\n| `in` |\n| `new` |\n| `null` |\n| `return` |\n| `switch` |\n\
    | `this` |\n| `true` |\n| `typeof` |\n| `var` |\n| `void` |\n| `while` |\n| `with`\
    \ |\n| `Array` |\n| `Date` |\n| `Math` |\n| `Object` |\n| `window` |\n| `location`\
    \ |\n| `history` |\n| `navigator` |\n| `document` |\n| `images` |\n| `links` |\n\
    | `forms` |\n| `elements` |\n| `getElementById` |\n| `innerHTML` |\n\n### 示例 1.4\n\
    \n```javascript\nbreak // 这是一个 JavaScript 关键字\nreturn // 这是一个 JavaScript 关键字\n\
    ```\n\n## 变量\n\n变量是与值关联的符号名称。使用 `var` 定义变量。定义变量的语法为：\n\n`var variable_name = value;`\n\
    \n### 示例 1.5\n\n```javascript\n<script type = \"text/javascript\">var abcde=100;\
    \ // 定义一个变量 \"abcde\"var abc888=\"Hello World\"; // 定义一个变量 \"abc888\"var my_variable=true;\
    \ // 定义一个变量 \"my_variable\"</script>\n```\n\n#### 解释：\n\n`var variable_name =\
    \ value;` 可以定义变量。\n\n**注意：**\n\n变量命名不能以数字开头，不能包含空格。例如`\"23var\"`、`\"abc de\"`\
    \ 是无效的变量名。\n\n但 `\"var23\"`、`\"abc_de\"` 是有效的变量名。\n\n## 数据类型\n\n- `string` – 字符或字符字符串\n\
    - `number` – 整数或浮点数\n- `boolean` – 布真或布值的值\n- `function` – 用户定义的方法\n- `object`\
    \ – 内置或用户定义的对象\n\n### 示例 1.6\n\n```javascript\nvar mystring = \"I am a string\"\
    ;\nvar myinteger = 168;\nvar myfloat = 12.88;\nvar mybool = true;\n```\n\n####\
    \ 解释：\n\n`var mystring=\"I am a string\";` // `mystring` 数据类型是 `string`。\n\n`var\
    \ myinteger=168;` // `myinteger` 数据类型是 `number`。\n\n`var myfloat=12.88;` // `myfloat`\
    \ 数据类型是 `number`。\n\n`var mybool=true;` // `mybool` 数据类型是 `boolean`。\n\n**注意：**\
    \ 字符串总是被括的。\n\n## 转义序列\n\n反斜杠字符可以用于转义。\n\n`\\n` 换行。\n\n`\\r` 回车。\n\n`\\t` 制表。\n\
    \n`\\'` 单引号。\n\n`\\\"` 双引号。\n\n### 示例 1.7\n\n```html\n<html><body><script language=\"\
    javascript\">document.write (\"Hello World\");</script></body>\n</html>\n```\n\
    \n## 函数\n\n函数是可以多次重复的代码块。\n\n定义函数使用 `function-name() { ... }`\n\n调用函数使用 `function-name()`。\n\
    \n### 示例 1.8\n\n```html\n<html><body><script language=\"javascript\">function\
    \ test(){document.write (\"function!\");}</script></body></html>\n```\n\n####\
    \ 解释：\n\n`function test(){ }` 是 `test` 的声明。\n\n`onload=\"test()\"` 在网页加载后调用 `test()`。\n\
    \n`test()` 是调用 `test(){ }` 的命令。\n\n运行 `test()` 时，`test(){ }` 将输出 `\"function!\"\
    `。\n\n## 带参数的函数\n\n函数括号内可以有一个或多个参数。参数用于将数据传递给函数。\n\n`function function_name(arg)\
    \ { ... }`\n\n### 示例 1.9\n\n```html\n<html><head><title>JavaScript 测试</title></head><body><script\
    \ type=\"text/javascript\">function test(msg){document.write (msg); // 输出 msg}</script><body\
    \ onload=\"test('带参数')\"></body>\n</html>\n```\n\n#### 解释：\n\n`onload=\"test('带参数')\"\
    ` 在网页加载后调用 `test(msg)`。\n\n当 `test(\"带参数\")` 调用 `test(msg){}` 时，它将 `\"带参数\"` 传递给\
    \ `var msg`。\n\n`document.write ( msg )` 将使用数据，然后输出 `\"带参数\"`。\n\n## 返回值\n\n`return`\
    \ 可以将值返回给函数调用者。\n\n`function function_name(arg) { return value; }`\n\n### 示例 1.10\n\
    \n```html\n<html><head><title>JavaScript 测试</title></head><body><script language=\"\
    javascript\">function add(num1,num2){return num1+num2; // 将结果传递给函数调用者}document.write\
    \ (\"3 + 5 = \" + add( 3, 5 )); // 函数调用者</script></body>\n</html>\n```\n\n####\
    \ 解释：\n\n`add( 3, 5 )` 意味着它调用函数 `add (num1,num2){ }`，并将参数 `\"3,5\"` 传递给 `var num1`\
    \ 和 `num2`。\n\n`return num1+num2` 将结果返回给 `add(3,5)`，你可以认为 `add(3,5) = return num1+num2`，将值赋值给\
    \ `add(3,5)`。即 `add (3,5) = 8`。\n\n`document.write (\"3 + 5 = \" + add( 3, 5 ))`\
    \ 将显示结果。\n\n## 变量作用域\n\n全局变量定义在函数外部，可以在任何地方使用；\n\n局部变量定义在函数内部，它只在当前函数内部使用。\n\n"
- fmt: "\nLet's define two same name variables in the following example, one is a\
    \ global variable, another is a local variable.\n\n### Example 1.11\n\n| <html><head><title>Variable\
    \ Scope</title><script type=\"text/JavaScript\">var  msg=200; // This num is a\
    \ global variablefunction test(){ // define a functionvar  msg=100; // This num\
    \ is a local variable} document.write (msg);</script></head><body onLoad =\"test()\"\
    ></body></html> |\n\nOutput:\n\n200\n\nExplanation:\n\n`onload=\"test(\"…\")\"\
    ` calls function `test()` after the web has loaded.\n\n`document.write (msg)`\
    \ outputs `200`, which means variable `msg` stores a value of global variable.\n\
    \nLocal variables are only visible within the function block where they are declared.\n\
    \n### Pop up Message\n\n|  |\n\n##### `alert( )`\n\n|  |\n\n`alert( )` pops up\
    \ a message and show the specified contents\n\n### Example 1.12\n\n| <html><body><script\
    \ language=\"javascript\">alert(\"Hello World Again!\"); // pop up a message</script></body></html>\
    \ |\n\nOutput:\n\nHello World Again!\n\nExplanation:\n\n`alert ( )` pops up a\
    \ dialog box showing a message.\n\n### Undefined Variable\n\nWhen an undefined\
    \ variable is used, JavaScript will return an \"undefined\" value.\n\n### Example\
    \ 1.13\n\n| <html><head><script>var abcd; // without initializingdocument.write\
