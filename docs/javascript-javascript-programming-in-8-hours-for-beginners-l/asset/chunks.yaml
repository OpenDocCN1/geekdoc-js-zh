    \ when clicking the button.\n\n## Chapter 2\n\n### Arithmetical Operators\n\n\
    | Operators | Running |\n| :--- | :--- |\n| `+` | add or connect strings |\n|\
    \ `-` | subtract |\n| `*` | multiply |\n| `/` | divide |\n| `%` | get modulus\
