    \ x=100; var y=200;var result = (x < y) ? \"apple\" : \"banana\"; document.write\
    \ ( result );</script></body></html>\n```\n\nOutput: apple\n\nExplanation: The\
    \ conditional operator uses `(x<y)` to test the `\"x\"` and `\"y\"`, because `\"\
    x\"` is less than `\"y\"`, it is true. Therefore, the output is `\"apple\"`.\n\
    \n### If Statement\n\n`if ( test-expression ) { ... }`\n\n executes codes inside\
