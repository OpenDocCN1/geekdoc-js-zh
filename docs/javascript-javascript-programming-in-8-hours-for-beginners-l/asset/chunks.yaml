    ## Chapter 8


    ### Form Basic


    A "form" in html is a very important element, which is used to accept the requests
    or inputs from the user.


    #### Example 8.1

    ```html

    <form name="myForm" method="get" action="f.php"><input name="txt" type="text"><input
    name="pwd" type="password"><input name="rd" type="radio" value="val2"><input name="chkb"
    type="checkbox" value="val3"><input name="sbmt" type="submit" value="Submit"><input
    name="rst" type="reset" value="Cancel"></form>

    ```


    #### Explanation:

    `"name"` means a name of the element.

    `method="get/post"` means the data send by `get` or `post`.

    `get` method sends data openly, small quantity.

    `post` method sends data secretly, more quantity.

    `action=f.php` means that the data will be processed by `f.php`

    `type` specify the type of element.


    ### Type of Form Element


    ```javascript

    document.formName.elementName.type    // return the element type, such as text,
    radio, checkbox…

    ```


    #### Example 8.2 (check the type of form elements)

    ```html

    <html><body><form name="myForm">    1.<input type="text" name="txt" /><br>    2.<input
    type="radio" name="rd" /><br>    3.<input type="checkBox" name="chkb" /><br>    4.<input
    type="password" name="pwd" /><br>    5.<select name="select"></select><br>    6.<textarea
    name="area"></textarea><br>    7.<input type="submit" name="submit" /><br></form><script
    type="text/javascript">document.write ("The 1st element is:  " +document.myForm.txt.type+"<br>");            document.write
    ("The 2nd element is:  " +document.myForm.rd.type+"<br>");             document.write
    ("The 3rd element is:  " +document.myForm.chkb.type+"<br>");document.write ("The
    4th element is:  " +document.myForm.pwd.type+"<br>");             document.write
    ("The 5th element is:  " +document.myForm.elements["select"].type+"<br>");document.write
    ("The 6th element is:  " +document.myForm.elements["area"].type+"<br>");document.write
    ("The 7th element is:  " +document.myForm.elements["submit"].type+"<br>");</script></body>

    </html>

    ```


    #### Output:

    The 1st element is: text.

    The 2nd element is: radio.

    The 3rd element is: checkbox.

    The 4th element is: password.

    The 5th element is: select-one.

    The 6th element is: textarea.

    The 7th element is: submit.


    #### Explanation:

    `"document.myForm.txt.type"` returns the type of form element.


    ### Form''s Name


    #### `document.formName.name`

    #### `document.forms[Index].name`


    `"document.formName.name"` can get the form''s name.

    `"document.forms[Index].name"` returns the form''s name.


    #### Example 8.3

    ```html

    <html><head><title>JavaScript Code</title><script type="text/javascript"></script></head><body><form
    name="form0"></form><form name="form1"></form><script type="text/javascript">document.write
    (document.form0.name + "<br>");document.write (document.form1.name + "<br>");document.write
    (document.forms[0].name + "<br>");// forms[0] means the form0document.write (document.forms[1].name
    + "<br>");// forms[1] means the form1</script></body>

    </html>

    ```


    #### Output:

    form0

    form1

    form0

    form1


    #### Explanation:

    `"document.form0.name"` returns `form0`''s name.

    `"document.forms[0].name"` returns `form[0]`''s name.

    `"document.form1.name"` returns `form1`''s name.

    `"document.forms[1].name"` returns `form[1]`''s name.


    ### Set & Get Form ID


    The syntax to set an ID of a form is:


    ```html

    <form id="xxx"> // `id="xxx"` sets an ID of the form

    document.getElementById("myForm") // get form id

    ```


    #### Example 8.4

    ```html

    <form id="myForm" action=""> <!-- set id as "myForm" -->Username: <input type="text"
    /><br>Password: <input type="password"></form><script>document.write ("Note: The
    ID of the Form is "+ document.getElementById("myForm").id);</script>

    ```


    #### Output:

    Note: The ID of the Form is: myForm


    #### Explanation:

    `<form id="myForm">` sets as `myForm`.

    `document.getElementById("myForm")` gets the ID.


    ### Show the Value of an Element


    The syntax to show the value of an element is:


    ```javascript

    document.write (object.value);

    alert (object.value);

    ```


    `document.write(object.value);` and `alert(object.value);` can show the value.


    #### Example 8.5

    ```html

    <html><body><br><br><center><form><button id="myButton" value="1234568">Button</button><!--
    set the value of myButton as 1234568 --></form></center><script type="text/javascript">var
    button = document.getElementById(''myButton'');button.onclick = function(){document.write
    ( button.value ); // show button valuealert ( button.value ); // show button}</script></body></html>

    ```


    #### Output:

    1234568


    #### Explanation:

    `button id="myButton" value="1234568"` sets the value of the button as `1234568`.

    `document.write(button.value);` and `alert(button.value);` show the button''s
    value.


    ### Input Data to Form


    The syntax of text form is:


    ```html

    <input type="text" name="myText" id="myText" />

    ```


    `<input type="text">` accepts the data inputted by user.


    #### Example 8.6

    ```html

    <html><body><center><br><br><br>Please input data, and Enter.<br><br><form><input
    type="text" name="myText" id="myText" /><--input type="text"> accepts the data
    input --the inputted value will be stored to myText --></form></center><script
    type="text/javascript">document.getElementById("myText").onchange = function(){//
    this is an "onchange event"alert ("You have inputted: " + this.value); // "this.value"
    represents "myText.value"}</script></body></html>

    ```


    #### Output:

    You have inputted: Hello, friends!


    #### Explanation:

    `<input type="text">` accepts the data inputted by the user.

    `document.getElementById("myText")` accesses an element `myText` in the current
    document.

    `this.value` means `myText.value`.

    `onchange = function()` executes the function when the value of the element is
    changed.


    ### Show What Inputted


    The syntax to show what user inputted is:


    ```javascript

    document.formName.elementName.value

    ```


    `document.formname.elementName.value` can get or set a value for the specified
    element.


    #### Example 8.7

    ```html

    <html><body><form name="myForm"><input type="text" name="myText" value="" /><input
    type="submit" onClick="show()"> <!--onClick event--></form><script type="text/javascript">function
    show(){alert(document.myForm.myText.value ); // gets the value of data which the
    user has inputted }</script></body></html>

    ```


    #### Output:

    Hello, friends!


    #### Explanation:

    `document.myForm.myText.value` gets the value of the text field, to which user
    has inputted data.


    ### Reset Method


    The syntax to reset the input date is:


    ```javascript

    reset()

    ```


    `reset()` is used to clear the form data.


    #### Example 8.8

    ```html

    <html><body><br><br><center><form id="myform" ><textarea></textarea><br><br><input
    type="button" onClick="myfunction()" value="Clear" ></form></center><script type="text/javascript">function
    myfunction() {document.getElementById("myform").reset();// "reset( ) clears "myform"
    data}</script></body></html>

    ```


    #### Output:

    (The form data are completely cleared.)


