    ## Chapter 7


    ### HTML Basic


    When we check the source code of a web page, we will find some HTML elements or
    tags, which look like this:


    Example 7.1


    ```html

    <html>

    <head>

    <title>...</title>

    </head>

    <body>

    <form>...</form>

    ...

    </body>

    </html>

    ```


    Explanation:

    `<html>...</html>` defines the document of a web page.

    `<head>...</head>` defines the head of a web page.

    `<title>...</title>` defines the title of a web page.

    `<body>...</body>` defines the body of a web page.

    `<form>...</form>` defines a form, which accepts the requests or input from a
    user.


    ### Click Event


    `onClick = function( );`


    `"onClick = function( );"` means when an element is clicked, a function immediately
    runs. The click event occurs.


    Example 7.2


    ```html

    <form><input type="button" value="Previous" onClick="history.back( )">   <!--
    click event --></form>

    ```


    Return:

    A previous page


    Explanation:

    `<form>` and `</form>` is HTML tags, which defines a web page.

    `form` is used to accept the request from users.

    `<input type="button" value="Previous"…>` defines a button in the form, the button
    has "Previous" text on it.

    `"onClick="history.back( )"` means when the button is clicked, the `history.back(
    )` runs at once, and then go back to the previous web page.


    ### Load Event


    `onLoad = "function( )"`


    `onLoad="function( )"` executes the function when a web page has been loaded.


    Example 7.3


    ```html

    <html><body onLoad = "test( )">  <!-- load event --><script>function test(){document.write
    ("Welcome to my website!");}</script></body></html>

    ```


    Output:

    Welcome to my website!


    Explanation:

    `<html>` and `</html>` is html tags, which defines a web page.

    `<body>` and `</body>` define a web page body.

    `onLoad= "test( )"` executes `test()` immediately when web page has been loaded.


    ### KeyPress Event


    `onKeyPress = function( );`


    `"onKeyPress=function( )"` executes the function  when a key is pressed.


    Example 7.4


    ```html

    <html><script>function myFunction(msg) { document.write (msg);}</script><body
    onKeyPress = "myFunction(''Hello! My Friend.'')">Please press a key.      <!--
    keypress event --></</body></html>

    ```


    Output:

    Hello! My Friend.


    Explanation:

    `onKeyPress=function( )` executes the function.


    ### Mouseover Event


    `"onKeyPress=function( )"` (Note: based on context)

    `onOver = function( );`


    `"onOver = function( )"` executes the function when the mouse moves over an element.


    Example 7.5


    ```html

    <html><head><script>function myFunction() {document.write ("Mouseover!");}</script></head><body
    onmouseover="myfunction()">Hover over me</body></html>

    ```


    Output:

    Mouseover!


    Explanation:

    `onmouseover="myfunction()` executes the function when the mouse moves over.


    ### Mouseout Event


    `onOut = function( );`


    `"onOut = function( )"` executes the function when the mouse pointer moves out
    of an element.


    Example 7.6


    ```html

    <html><head><script>function myFunction() {document.write ("Mouseout!");}</script></head><body
    onmouseout="myfunction()">Move out here</body></html>

    ```


    Output:

    Mouseout!


    Explanation:

    `onmouseout="myfunction()` executes the function when the mouse moves out of the
    element.


    ### Keyup Event


    `onKeyUp = function( );`


    `"onKeyUp=function( )"` executes the function when a key is released.


    Example 7.7


    ```html

    <html><script>function myFunction(msg) { document.write (msg);}</script><body
    onkeyup="myFunction(''KeyUp event!'')">Please release a key.      <!-- keyup event
    --></</body></html>

    ```


    Output:

    KeyUp event!


    Explanation:

    `onkeyup=function( )` executes the function when a key is released.


    ### Focus Event


    `onFocus = function( );`


    `"onFocus = function( )"` executes the function when the user clicks into an input
    field.


    Example 7.8


    ```html

    <html><head><script>function myFunction() {document.write ("Focus event!");}</script></head><body><input
    type="text" onfocus="myfunction()"></body></html>

    ```


    Output:

    Focus event!


    Explanation:

    `onfocus="myfunction()` executes the function when the user clicks the field.


    ### Blur Event


    `onBlur = function( );`


    `"onBlur = function( )"` executes the function when the user clicks out of an
    input field.


    Example 7.9


    ```html

    <html><head><script>function myFunction() {document.write ("Blur event!");}</script></head><body><input
    type="text" onblur="myfunction()"></body></html>

    ```


    Output:

    Blur event!


    Explanation:

    `onblur="myfunction()` executes the function when the user clicks out of the field.


    ### Reset Event


    `onReset = "function( )"`


    `onReset="function( )"` executes the function when the form is reset.


    Example 7.10


    ```html

    <html><form onreset="alert(''The form has been reset!'')"><input type="text" id="txt"><input
    type="reset" value="Reset" ><><!-- reset event --></form></html>

    ```


    Output:

    The form has been reset!


    Explanation:

    `onReset="alert()` runs the alert( ) when the Reset button is clicked.


    ### Submit Event


    `onSubmit = "function( )"`


    `onSubmit="function( )"` executes the function when the form is submitted.


    Example 7.11


    ```html

    <html><form onSubmit="alert(''The form has been submitted!'')"><input type="text"
    id="txt"><input type="submit" value="Submit" ><><!-- submit event --></form></html>

    ```

