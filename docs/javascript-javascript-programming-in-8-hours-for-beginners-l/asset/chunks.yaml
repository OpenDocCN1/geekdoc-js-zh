- fmt: '

    `onClick="myfunction()"` executes the `myfunction()` immediately when the button
    is clicked.


    `getElementById("myform")` access the `myform` by its id.


    `reset(()` clears `myform` data.


    ### Submit Method


    The syntax to submit form data is:


    ##### `submit(()`


    `submit( )` is used to submit the form data to the server.


    Example 8.9


    ```html

    <html><body><form id="myform"><textarea></textarea><br><br><input type="button"
    onClick="myfun()" value="submit" ></form><script type="text/javascript">function
    myfun() {document.getElementById("myform").submit();// "submit( )" submits "myform"
    data to the server.alert ("All data have been submitted successfully!");}</script></body></html>

    ```


    Output:


    All data have been submitted successfully!


    Explanation:


    `onClick="myfun()"` executes the `myfun()` immediately when the submit button
    is clicked.


    `getElementById("myform")` access the `myform` by its id.


    `submit( )` submits `myform` data to the server.


    ### "Select" Selection


    The syntax of the "Select" menu is:


    ##### `<select id="myID " onchange="function ( )">`


    When a "select" value in the form is changed, `onChange` event occurs and runs
    the `function ( )` at once.


    Example 8.10


    ```html

    <html><head><script language="javascript">function myfun(color){alert ("The flower
    is  "+ color);}</script></head><body><form id="myForm"><select name="flower" onChange="myfun(this.value)">      <!--
    runs function "myfun()" when an option is selected--><option value="Red">Red</option><option
    value="Yellow">Yellow</option><option value="Green">Green</option></select></body></html>

    ```


    Output: The flower is Green.


    Explanation:


    `this.value` means the option value.


    `<select name="flower" onChange="myfun(this.value)">` runs the function `myfun()`
    when an option is selected, and passes the parameter `this value` to `alert()`.


    ### "Radio" Selection


    The syntax of "Radio" is:


    ##### `<input type="radio" name= "same" value= "myValue">`


    A group of radio buttons allows one circle to be checked at any time and submit
    the selected value to handle.


    Example 8.11 ( Radio Button: ○ Red ○ Yellow ○ Green )


    ```html

    <html><body><form name="myform"><input type= "radio"  name="color" value= "Red"
    onClick= "myfun(this.value )"/> Red<input type= "radio"  name="color" value= "Yellow"
    onClick= "myfun(this.value )"/> Yellow<input type= "radio"  name="color" value=
    "Green" onClick= "myfun(this.value )"/> Green<!-- runs function "myfun()" when
    a radio is selected--></form><script>function myfun( v) {alert ( "You select:  "
    + v );}</script></body></html>

    ```


    Output: You select: Red


    Explanation:


    `<input type= "radio" name="color" value= "Red" />` defines a radio button''s
    value as Red. Three radios use the same name.


    `onClick=" myfun(this.value )"` runs `myfun()` when the button is clicked.


    `this.value` means one radio''s value.


    ### "CheckBox" Selection


    The syntax of the "Checkbox" is:


    ##### `<input type="checkbox" id= "ID value= "myValue">`


    A group of checkboxes allows multiple boxes to be checked at any time and submit
    the selected value to handle.


    Example 8.12 ( CheckBox: □ red □ blue □ pink )


    ```html

    <html><body><form name="myform"><input type= "checkbox"  id="color" value= "Red"
    onClick= "myfun(this.value )"/> Red<input type= "checkbox"  id="color" value=
    "Yellow" onClick= "myfun(this.value )"/> Yellow<input type= "checkbox"  id="color"
    value= "Green" onClick= "myfun(this.value )"/> Green<!-- runs function "myfun()"
    when a checkbox is checked--></form><script>function myfun( v) {alert ( "You select:  "
    + v );}</script></body></html>

    ```


    Output: You select: Red


    Explanation:


    `<input type= "checkbox" id="color" value= "Red" >` defines a checkbox''s value
    as Red.


    `onClick=" myfun(this.value )"` runs `myfun()` when a checkbox is clicked.


    `this.value` means one checkbox''s value.


    ### Submit the Form


    The syntax of the "Submit" is:


    `"<input type="submit">` to the server


    Example 8.13


    ```html

    <html><script language="javascript">function myfun(answer){alert("Are you sure
    to submit?")}</script><body><form name="myForm"><textarea name="message" rows="30"></input
    type="submit"><!-- send() when the button is clicked --></form></</body>>

    ```


    Output:


    Submit:


    Explanation:


    `<input type="submit">` sends the form data to the server.


    ### CreateElement


    The syntax of the "Submit" is:


    `"input type="submit">` the form


    Example 8.14


    ```html

    <html><body><script>varLine = document.createElement("hr");document.body.appendChild(myLine);</script></body></html>

    ```


    Output:


    Explanation:


    `document.createElement("hr")` creates an element.


    `document.body.appendChild(myLine)` appends an element.


    ### CreateTextNode


    The syntax of the "Submit" is:


    `"input type="submit">` the form


    Example 8.15


    ```html

    <html><body><center><script>var myText = document.createTextNode("Hello Dom!");document.body.appendChild(myText);</script></center></body></html>

    ```


    Output:


    Explanation:


    `document.createTextNode("Hello Dom!")` creates a node.


    `document.body.appendChild(myText)` appends a node.


    ### set/getAttribute


    The syntax of the "Submit" is:


    `"input type="submit">` the form


    Example 8.16


    ```html

    <html><body><p>Hello Dom!</p><br><script>var text = document.getElementsByTagName("p")[0];text.setAttribute("align",
    "center"); // set attribute and valuevar value = text.getAttribute( "align" );
    // get attributeocument.write( "The ''Hello Dom!'' is in the " + value);</script></body></html>

    ```


    Output:


    Hello Dom!


    The ''Hello Dom!'' is in the center


    Explanation:


    `getElementsByTagName("p")[0]` means the first `p` tag.


    `text.setAttribute("align", "center")` sets the attribute and value of `text`.
    The text refers to "Hello Dom!".


    `align` is an attribute name, `center` is an attribute value.


    `text.getAttribute( "align" )` returns the value `center` of the attribute `align`.


    ### hasChildNodes( )


    The syntax to check the child node is:


    ##### `hasChildNodes()`


    `hasChildNodes()`` returns true if the specified node has any child nodes, otherwise
    returns false.


    Example 8.17


    ```html

    <html><head><title>Dom</title></head><body><br><br>There are three colors:<ul
    id="color">      <li>Green</li>      <li>Yellow</li>      <li>Red</li></ul><script>var
    sub;sub = document.getElementById("color") .hasChildNodes(); // check if the "color"
    id has any child nodesdocument.write ("Color has some child nodes?  " + sub );</script></body></html>

    ```


    Output:


    Color has some child nodes?  true

