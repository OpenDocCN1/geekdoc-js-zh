- fmt: "\n# Hello World!\n\n## Explanation:\n\n`<!DOCTYPE html>` is a Html 5 tag,\
    \ which means the current file is a Html 5 file.\n\n`<script type = \"text/javascript\"\
    >` is a tag for JavaScript. The JavaScript codes are included within it.\n\n`document.write\
    \ (\"Hello World!\")` shows or prints `\"Hello World!\"`.\n\nEach JavaScript command\
    \ ends with semicolon (`;`).\n\nJavaScript block code can be embedded anywhere\
    \ in the HTML file, and run by a browser.\n\n`<!-- -->` is an html comment symbol.\n\
    \n## Comment\n\nThe comment is used to explain the code.\n\n##### `//` This is\
    \ a single line comment\n\n##### `/*`\n\n##### This is a multi line comment; JavaScript\
    \ interpreter will ignore both single line comment and multi line comment.\n\n\
    ##### `*/`\n\n### Example 1.2\n\n```html\n<script type = \"text/javascript\">document.write\
    \ (\"Hello World\"); // show \"Hello World\"./* \"document.write()\" shows the\
    \ content \"Hello World\". \"document.write ( )\" is usually used to display the\
    \ specified contents to users */</script>\n```\n\n#### Explanation:\n\n`// \"\
    document.write () \"` shows a message is a single line comment.\n\n`/* \"document.write\
    \ () \" shows a message \"Hello World\". …… */` is a multi line comment.\n\n##\
    \ Run First Program\n\n### Example 1.3\n\nOpen Notepad, input JavaScript codes\
    \ as follows: (Figure 1.1)\n\nJavaScript code is embedded in Html file.\n\n```html\n\
    <!DOCTYPE html><html><head><title>The first JavaScript Program</title></head><body><script\
    \ language=\"javascript\"> // start javascriptdocument.write (\"<h2>Hello World!\
    \ </h2>\") // output</script></body></html>\n```\n\n(Figure 1.1 Input JavaScript\
    \ codes to Notepad)\n\nPlease save the file with name `\"FirstJavaScript.html\"\
    `.\n\n**Note:** make sure to use `.html` extension name.\n\nDouble click `\"FirstJavaScript.html\"\
    ` file, the `\"FirstJavaScript.html\"` will be run in a browser, and see the output.\
    \ (Figure 1.2)\n\n#### Output: \n\nHello World! (Figure 1.2)\n\n#### Explanation:\n\
    \n`document.write (\"<h2>Hello World! </h2>\")` outputs `\"Hello World!\"`\n\n\
    If you want to edit the codes, right click the `\"FirstJavaScript.html\"` > open\
    \ with > Notepad.\n\n## Keywords\n\nKeywords belong to JavaScript itself. These\
    \ may not be used when choosing identifier names for variables, functions, array,\
    \ properties. The following are JavaScript keywords:\n\n| `break` |\n| `case`\
    \ |\n| `continue` |\n| `default` |\n| `delete` |\n| `do` |\n| `else` |\n| `export`\
    \ |\n| `false` |\n| `for` |\n| `function` |\n| `if` |\n| `import` |\n| `in` |\n\
    | `new` |\n| `null` |\n| `return` |\n| `switch` |\n| `this` |\n| `true` |\n| `typeof`\
    \ |\n| `var` |\n| `void` |\n| `while` |\n| `with` |\n| `Array` |\n| `Date` |\n\
    | `Math` |\n| `Object` |\n| `window` |\n| `location` |\n| `history` |\n| `navigator`\
    \ |\n| `document` |\n| `images` |\n| `links` |\n| `forms` |\n| `elements` |\n\
    | `getElementById` |\n| `innerHTML` |\n\n### Example 1.4\n\n```javascript\nbreak\
    \ // this is a JavaScript keyword\nreturn // this is a JavaScript keyword\n```\n\
    \n## Variables\n\nA variable is a symbolic name associated with a value. Variable\
    \ uses `var` to define. The syntax to define a variable is:\n\n`var variable_name\
    \ = value;`\n\n### Example 1.5\n\n```javascript\n<script type = \"text/javascript\"\
    >var abcde=100; // define a variable \"abcde\"var abc888=\"Hello World\"; // define\
    \ a variable \"abc888\"var my_variable=true; // define a variable \"my_variable\"\
    </script>\n```\n\n#### Explanation:\n\n`var variable_name = value;` can define\
    \ a variable.\n\n**Note:**\n\nThe variable naming cannot start with number, cannot\
    \ have spaces. e.g. `\"23var\"`, `\"abc de\"` are invalid variable names.\n\n\
    But `\"var23\"`, `\"abc_de\"` are valid variable names.\n\n## Data Types\n\n-\
    \ `string` – a character or a string of characters\n- `number` – an integer or\
    \ floating point number\n- `boolean` – a value with true or false.\n- `function`\
    \ – a user-defined method\n- `object` – a built-in or user-defined object\n\n\
    ### Example 1.6\n\n```javascript\nvar mystring = \"I am a string\";\nvar myinteger\
    \ = 168;\nvar myfloat = 12.88;\nvar mybool = true;\n```\n\n#### Explanation:\n\
    \n`var mystring=\"I am a string\";` // `mystring` data type is a `string`.\n\n\
    `var myinteger=168;` // `myinteger` data type is a `number`.\n\n`var myfloat=12.88;`\
    \ // `myfloat` data type is a `number`.\n\n`var mybool=true;` // `mybool` data\
    \ type is `boolean`.\n\n**Note:** String is always enclosed.\n\n## Escape Sequences\n\
    \nThe backslash character can be used to escape.\n\n`\\n` outputs new line.\n\n\
    `\\r` makes return.\n\n`\\t` makes tab.\n\n`\\'` makes a single quote.\n\n`\\\"\
    ` makes double quote.\n\n### Example 1.7\n\n```html\n<html><body><script language=\"\
    javascript\">document.write (\"Hello World\");</script></body></html>\n```\n\n\
    ## Functions\n\nA function is a code block that can repeat many times.\n\nTo define\
    \ a function, use `function-name() { ... }`.\n\nTo call a function, use `function-name()`.\n\
    \n### Example 1.8\n\n```html\n<html><body><script language=\"javascript\">function\
    \ test(){document.write (\"function!\");}</script></body></html>\n```\n\n####\
    \ Explanation:\n\n`function test(){ }` is a declaration of `test`.\n\n`onload=\"\
    test()\"` calls `test()` after the web has loaded.\n\n`test()` is a command to\
    \ call `test(){ }`.\n\nWhen running `test()`, `test(){ }` will pass the output\
    \ `\"function!\"`.\n\n## Function with Arguments\n\nA function can have one or\
    \ more arguments inside the bracket. Arguments are used to pass data to function.\n\
    \n`function function_name(arg) { ... }`\n\n### Example 1.9\n\n```html\n<html><head><title>JavaScript\
    \ Test</title></head><body><script type=\"text/javascript\">function test(msg){document.write\
    \ (msg); // output msg}</script></head><body onload=\"test('Function with arguments')\"\
    ></body></html>\n```\n\n#### Explanation:\n\n`onload=\"test('Function with arguments')\"\
    ` calls `test(msg)` after the web has loaded.\n\nWhen `test(\"Function with arguments\"\
    )` calls `test(msg){}`, it will pass the `\"Function with arguments\"` to `var\
    \ msg`.\n\n`document.write ( msg )` will use the data, and then outputs `\"Function\
    \ with arguments\"`.\n\n## Return Values\n\n`return` can return a value to the\
    \ function caller.\n\n`function function_name(arg) { return value; }`\n\n### Example\
    \ 1.10\n\n```html\n<html><head><title>JavaScript Test</title></head><body><script\
    \ language=\"javascript\">function add(num1,num2){return num1+num2; // pass the\
    \ result to the function caller}document.write (\"3 + 5 = \" + add( 3, 5 )); //\
    \ function caller</script></body></html>\n```\n\n#### Explanation:\n\n`add( 3,\
    \ 5 )` means that it calls the function `add (num1,num2){ }`, and pass the argument\
    \ `\"3,5\"` to `var num1` and `num2`.\n\n`return num1+num2` returns the result\
    \ to `add(3,5)`, you can treat it as `add(3,5) = return num1+num2`, assigning\
    \ the value to `add(3,5)`. Namely `add (3,5) = 8`.\n\n`document.write (\"3 + 5\
    \ = \" + add( 3, 5 ))` will show the result.\n\n## Variable Scope\n\nA global\
    \ variable is declared outside the function, it can be used in everywhere;\n\n\
    A local variable is declared inside the function, it is only used inside the current\
    \ function.\n"
