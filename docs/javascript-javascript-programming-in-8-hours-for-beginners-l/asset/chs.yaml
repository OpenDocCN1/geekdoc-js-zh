  \ |\n\n## 关于此书：\n《JavaScript 编程与练习》是一本为高中、学院和大学生编写的教材；它涵盖了所有核心 JavaScript 语言知识。你可以快速轻松地学习\
  \ JavaScript 编程的完整技能。\n\n## 免责声明：\n本教材仅适用于 JavaScript 编程初学者、高中、学院和大学生；不适用于经验丰富的\
  \ JavaScript 程序员。\n\n# 第 2 章\n## 算术运算符\n## 逻辑运算符\n## 赋值运算符\n## 比较运算符\n## 条件运算符\n\
  ## if 语句\n## if-else 语句\n## switch 语句\n## for 循环\n## while 循环\n## do-while 循环\n\
  ## break 语句\n## continue 语句\n## 动手项目：数字一号\n\n# 第 3 章\n## 创建数组\n## 显示数组元素值\n## 获取数组大小\n\
  ## 合并数组元素\n## 反转元素顺序\n## 切片元素\n## 排序元素\n## 将元素转换为字符串\n## 搜索特定元素 (1)\n## 搜索特定元素 (2)\n\
  ## 在开头添加元素\n## 删除第一个元素\n## 在末尾添加元素\n## 删除最后一个元素\n## 动手项目：反转排序\n\n# 第 4 章\n## 数学方法\n\
  ## 大于与小于\n## 最大值与最小值\n## 幂值\n## 平根\n## PI 与随机数\n## 日期与时间\n## 年、月、日\n## 小、分、秒\n##\
  \ 不同的时间\n## 设置日期与时间\n## 定时函数\n## 动手项目：本月\n\n# 第 5 章\n## 字符串长度\n## 连接字符串\n## 搜索字符\n\
  ## 转换大小\n## 分割字符串\n## 提取子字符串\n## 将数字转换为字符串\n## 将字符串转换为数字\n## 搜索特定单词 (1)\n## 搜索特定单词\
  \ (2)\n## Unicode\n## 为文本添加链接\n## 动手项目：大写\n\n# 第 6 章\n## 对象声明\n## 网页导航\n## 跳转指定页面\n\
  ## 打开自定义窗口\n## 关闭当前窗口\n## 确认\n## 输入\n## 通过 ID 元素\n## 通过标签名获取元素\n## 连接两个字符串\n## 将数字转换为字符串\n\
  ## 自 1970 年 1 月 1 日\n## 绝对值\n## 打印当前窗口\n## 检查 Java 是否启用\n## 屏幕宽度与高度\n## 动手项目：最大与最小\n\
  \n# 第 7 章\n## HTML 基础\n## 点击事件\n## 加载事件\n## 按键事件\n## 鼠标移入事件\n## 鼠标移出事件\n## 按键事件\n\
  ## Focus 事件\n## 模糊事件\n## 重置事件\n## 动手项目：鼠标移出\n\n# 第 8 章\n## 表单基础\n## 表单类型\n## 表单名称\n\
  ## 设置/获取元素\n## 显示元素值\n## 向表单输入数据\n## 显示输入内容\n## 提交方法\n## 选择\n## 单选框\n## 复选框选择\n\
  ## 提交表单\n## 创建元素\n## 创建文本节点\n## 设置/获取属性\n## 是否有节点\n## 动手项目：清除所有内容\n\n\n\n\n\n# Hello\
  \ World!\n\n## 解释：\n\n`<!DOCTYPE html>` 是一个 HTML 5 标签，意味着当前文件是一个 HTML 5 文件。\n\n\
  `<script type = \"text/javascript\">` 是 JavaScript 标签。JavaScript 代码包含在其中。\n\n`document.write\
  \ (\"Hello World!\")` 显示或打印 `\"Hello World!\"`。\n\n每个 JavaScript 命令都以分号（`;`）结束。\n\
  \nJavaScript 代码块可以嵌入到 HTML 文件的任何位置，并由浏览器运行。\n\n`<!-- -->` 是 HTML 注释符号。\n\n## 注释\n\
  \n注释用于解释代码。\n\n### `//` 这是一个单行注释\n\n### `/*`\n\n### 这是一个多行注释；JavaScript 解释器将忽略单行注释和多行注释。\n\
  \n### `*/`\n\n### 示例 1.2\n\n```html\n<script type = \"text/javascript\">document.write\
  \ (\"Hello World\"); // show \"Hello World\"./* \"document.write()\" shows the content\
  \ \"Hello World\". \"document.write ( )\" is usually used to display the specified\
  \ contents to users */</script>\n```\n\n## 解释：\n\n`// \"document.write () \"` 显示一条消息是一个单行注释。\n\
  \n`/* \"document.write () \" shows a message \"Hello World\". …… */` 是多行注释。\n\n\
  ## 运行第一个程序\n\n### 示例 1.3\n\n打开记事本，输入如下 JavaScript 代码：（图 1.1）\n\nJavaScript 代码被嵌入在\
  \ HTML 文件中。\n\n```html\n<!DOCTYPE html><html><head><title>第一个 JavaScript 程序</title></head><body><script\
  \ language=\"javascript\"> // start javascriptdocument.write (\"<h2>Hello World!\
  \ </h2>\") // output</script></body></html>\n```\n\n（图 1.1 在记事本中输入 JavaScript 代码）\n\
  \n请将文件保存为 `\"FirstJavaScript.html\"`。\n\n**注意：** 确保使用 `.html` 扩展名。\n\n双击 `\"FirstJavaScript.html\"\
  ` 文件，该文件将在浏览器中运行并看到输出。（图 1.2）\n\n### 输出： \n\nHello World!（图 1.2）\n\n## 解释：\n\n`document.write\
  \ (\"<h2>Hello World! </h2>\")` 输出 `\"Hello World!\"`\n\n如果你想编辑代码，右键点击 `\"FirstJavaScript.html\"\
  ` > 打开方式 > 记事本。\n\n## 关键字\n\n关键字属于 JavaScript 身。在为变量、函数、数组、属性选择标识符名称时不能使用这些关键字。以下是\
  \ JavaScript 关键字：\n\n| `break` |\n| `case` |\n| `continue` |\n| `default` |\n| `delete`\
  \ |\n| `do` |\n| `else` |\n| `export` |\n| `false` |\n| `for` |\n| `function` |\n\
  | `if` |\n| `import` |\n| `in` |\n| `new` |\n| `null` |\n| `return` |\n| `switch`\
  \ |\n| `this` |\n| `true` |\n| `typeof` |\n| `var` |\n| `void` |\n| `while` |\n\
  | `with` |\n| `Array` |\n| `Date` |\n| `Math` |\n| `Object` |\n| `window` |\n| `location`\
  \ |\n| `history` |\n| `navigator` |\n| `document` |\n| `images` |\n| `links` |\n\
  | `forms` |\n| `elements` |\n| `getElementById` |\n| `innerHTML` |\n\n### 示例 1.4\n\
  \n```javascript\nbreak // 这是一个 JavaScript 关键字\nreturn // 这是一个 JavaScript 关键字\n```\n\
  \n## 变量\n\n变量是与值关联的符号名称。使用 `var` 定义变量。定义变量的语法为：\n\n`var variable_name = value;`\n\
  \n### 示例 1.5\n\n```javascript\n<script type = \"text/javascript\">var abcde=100;\
  \ // 定义一个变量 \"abcde\"var abc888=\"Hello World\"; // 定义一个变量 \"abc888\"var my_variable=true;\
  \ // 定义一个变量 \"my_variable\"</script>\n```\n\n## 解释：\n\n`var variable_name = value;`\
  \ 可以定义变量。\n\n**注意：**\n\n变量命名不能以数字开头，不能包含空格。例如`\"23var\"`、`\"abc de\"` 是无效的变量名。\n\
  \n但 `\"var23\"`、`\"abc_de\"` 是有效的变量名。\n\n## 数据类型\n\n- `string` – 字符或字符字符串\n- `number`\
  \ – 整数或浮点数\n- `boolean` – 布真或布值的值\n- `function` – 用户定义的方法\n- `object` – 内置或用户定义的对象\n\
  \n### 示例 1.6\n\n```javascript\nvar mystring = \"I am a string\";\nvar myinteger\
  \ = 168;\nvar myfloat = 12.88;\nvar mybool = true;\n```\n\n## 解释：\n\n`var mystring=\"\
  I am a string\";` // `mystring` 数据类型是 `string`。\n\n`var myinteger=168;` // `myinteger`\
  \ 数据类型是 `number`。\n\n`var myfloat=12.88;` // `myfloat` 数据类型是 `number`。\n\n`var mybool=true;`\
  \ // `mybool` 数据类型是 `boolean`。\n\n**注意：** 字符串总是被括的。\n\n## 转义序列\n\n反斜杠字符可以用于转义。\n\
  \n`\\n` 换行。\n\n`\\r` 回车。\n\n`\\t` 制表。\n\n`\\'` 单引号。\n\n`\\\"` 双引号。\n\n### 示例 1.7\n\
  \n```html\n<html><body><script language=\"javascript\">document.write (\"Hello World\"\
  );</script></body>\n</html>\n```\n\n## 函数\n\n函数是可以多次重复的代码块。\n\n定义函数使用 `function-name()\
  \ { ... }`\n\n调用函数使用 `function-name()`。\n\n### 示例 1.8\n\n```html\n<html><body><script\
  \ language=\"javascript\">function test(){document.write (\"function!\");}</script></body></html>\n\
  ```\n\n## 解释：\n\n`function test(){ }` 是 `test` 的声明。\n\n`onload=\"test()\"` 在网页加载后调用\
  \ `test()`。\n\n`test()` 是调用 `test(){ }` 的命令。\n\n运行 `test()` 时，`test(){ }` 将输出 `\"\
  function!\"`。\n\n## 带参数的函数\n\n函数括号内可以有一个或多个参数。参数用于将数据传递给函数。\n\n`function function_name(arg)\
  \ { ... }`\n\n### 示例 1.9\n\n```html\n<html><head><title>JavaScript 测试</title></head><body><script\
  \ type=\"text/javascript\">function test(msg){document.write (msg); // 输出 msg}</script><body\
  \ onload=\"test('带参数')\"></body>\n</html>\n```\n\n## 解释：\n\n`onload=\"test('带参数')\"\
  ` 在网页加载后调用 `test(msg)`。\n\n当 `test(\"带参数\")` 调用 `test(msg){}` 时，它将 `\"带参数\"` 传递给\
  \ `var msg`。\n\n`document.write ( msg )` 将使用数据，然后输出 `\"带参数\"`。\n\n## 返回值\n\n`return`\
  \ 可以将值返回给函数调用者。\n\n`function function_name(arg) { return value; }`\n\n### 示例 1.10\n\
  \n```html\n<html><head><title>JavaScript 测试</title></head><body><script language=\"\
  javascript\">function add(num1,num2){return num1+num2; // 将结果传递给函数调用者}document.write\
  \ (\"3 + 5 = \" + add( 3, 5 )); // 函数调用者</script></body>\n</html>\n```\n\n## 解释：\n\
  \n`add( 3, 5 )` 意味着它调用函数 `add (num1,num2){ }`，并将参数 `\"3,5\"` 传递给 `var num1` 和 `num2`。\n\
  \n`return num1+num2` 将结果返回给 `add(3,5)`，你可以认为 `add(3,5) = return num1+num2`，将值赋值给\
  \ `add(3,5)`。即 `add (3,5) = 8`。\n\n`document.write (\"3 + 5 = \" + add( 3, 5 ))`\
  \ 将显示结果。\n\n## 变量作用域\n\n全局变量定义在函数外部，可以在任何地方使用；\n\n局部变量定义在函数内部，它只在当前函数内部使用。\n\n\n\
  \n\n\n在下面的示例中，我们定义两个同名的变量，其中一个是全局变量，另一个是局部变量。\n\n### 示例 1.11\n\n| <html><head><title>变量范围</title><script\
  \ type=\"text/JavaScript\">var  msg=200; // 这个数字是一个全局变量 function test(){ // 定义一个函数\
  \ var  msg=100; // 这个数字是一个局部变量} document.write (msg);</script></head><body onLoad\
  \ =\"test()\"></body></html> |\n\n输出：\n\n200\n\n解释：\n\n`onload=\"test(\"…\")\"`\
  \ 在网页加载后调用函数 `test()`。\n\n`document.write (msg)` 输出 `200`，这意味着变量 `msg` 存储的是全局变量的值。\n\
  \n局部变量仅在声明它们所在的函数块内可见。\n\n## 弹窗消息\n\n|  |\n\n### `alert( )`\n\n|  |\n\n`alert( )`\
  \ 弹出一个消息并显示指定的内容\n\n### 示例 1.12\n\n| <html><body><script language=\"javascript\"\
  >alert(\"Hello World Again!\"); // 弹出一个消息</script></body></html> |\n\n输出：\n\nHello\
  \ World Again!\n\n解释：\n\n`alert ( )` 弹出一个显示消息的对话框。\n\n## 未定义的变量\n\n当使用未定义的变量时，JavaScript\
  \ 将返回一个 \"undefined\" 值。\n\n### 示例 1.13\n\n| <html><head><script>var abcd; // 未初始化\
  \ document.write ( abcd ); // abcd 是未定义的变量</script></head></html> |\n\n输出： \n\n\
  undefined \n\n解释：\n\n`document.write ( abcd );` 使用了一个未定义的变量 `\"abcd\"`。因此，输出是 `\"\
  undefined\"`。\n\n## 变量命名规则\n\n- 第一个字母必须是 ASCII 字母或下划线。\n- 首字母不能是数字。\n- 后续的字母可以是字母、数字或下划线。\n\
  - 变量名不能使用 JavaScript 关键字。\n- 变量不能包含空格或特殊符号。\n\n### 示例 1.14\n\n以下是有效的变量：\n\n| `_goodExcellent100Five_Star`\
  \ |\n\n### 示例 1.15\n\n以下是无效的变量名：\n\n| `200Guys` // 不能以数字开头`Andy&Bob` // 不能在变量名中使用\
  \ \"&\" 符号`case` // 不能使用 JavaScript 关键字作为变量 |\n\n## 动手项目：一个简单的调用\n\n### 调用函数\n\n\
  打开记事本，输入 JavaScript 代码：\n\n```html\n<html>  <head>     <title>调用函数</title>  </head>\
  \  <body><body>    <script  language=\"javascript\"> function  myFunction( ) { //\
  \ 声明一个函数      document.write (\"Hello! A function has been called!\")    }    </script>\
  \    <form>      <br>      <input name=\"button\" type=\"button\" onclick=\"myFunction(\
  \ )\" value=\"Call Function\">          </form>          <!-- 调用函数 --></</body>></html\n\
  ```\n\n请将文件另存为 `\"CallFunction.html\"`。\n\n注意：请确保使用 `\".html\"` 扩展名。\n\n双击 `\"CallFunction.html\"\
  ` 文件，将在浏览器中运行 `\"CallFunction.html\"`，请点击 `\"Call Function\"` 按钮并查看输出。\n\n输出：  \n\
  \n![](img/image00312.jpeg)\n\nHello! A function has been called!\n\n解释：\n\n`function\
  \  myFunction( ){ }` 定义了一个名为 `\"myfunction\"` 的函数。\n\n`onclick=\"myFunction( )\"\
  ` 在点击按钮时调用 `myFunction( )`。\n\n# 第 2 章\n\n## 算术运算符\n\n| 运算符 |  |\n| :--- | :---\
  \ |\n| `+` | 加法或连接字符串 |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 取模 |\n\
  | `++` 或 `--` | 加 1 或 减 1 |\n\n`%` `modulus` 运算符将第一个操作数除以第二个操作数，返回余数。例如 `4%2`，余数为\
  \ `0`。\n\n### 示例 2.1\n\n```javascript\nvar add =  100 + 200;  document.write (add);\
  \ // 输出 300\nvar div = 800 / 2;  document.write ( div ); // 输出 400\nvar mod = 10%\
  \ 3;  document.write ( mod ); // 输出 1\nvar inc = 10;  document.write ( ++inc );\
  \ // 输出 11\nvar str= \"abc\" + \"de\";  document.write ( str ); // 输出 abcde\n```\n\
  \n## 逻辑运算符\n\n| 运算符 | 等于 |\n| :--- | :--- |\n| `&&` | 与 |\n| `||` | 或 |\n| `!` |\
  \ 非 |\n\n在使用逻辑运算符后，结果将为 true 或 false。\n\n### 示例 2.2\n\n```javascript\nvar x=true;\
  \ var y=false;\nvar a=x && y;  document.write ( a ); // 输出: false\nvar b=x || y;\
  \  document.write ( b ); // 输出: true\nvar c=!x;  document.write ( c ); // 输出: false\n\
  ```\n\n解释：\n\n`true && true` 返回 true;\n`true && false` 返回 false;\n`false && false`\
  \ 返回 false;\n`true || true` 返回 true;\n`true || false` 返回 true;\n`false || false`\
  \ 返回 false;\n`! true` 返回 false;\n\n## 赋值运算符\n\n| 运算符 | 示例: |\n| :--- | :--- |\n\
  | `+=` | `x+=` |\n| `-=` | `x-=` |\n| `*=` | `x*=` |\n| `/=` | `x/=` |\n| `%=` |\
  \ `x%=` |\n\n### 示例 2.3\n\n```javascript\nvar x=200; y=100;\nx+=y;  document.write\
  \ ( x );\nx-=y;  document.write ( x );\nx*=y;  document.write ( x );\nx/=y;  document.write\
  \ ( x );\nx%=y;  document.write ( x );\n```\n\n## 比较运算符\n\n| 运算符 | 运行 |\n| :---\
  \ | :--- |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` 小于等于 |\n| `==` |\
  \ 等于 |\n| `!=` | 不等于 |\n\n使用比较运算符后，结果将为 true 或 false。\n\n### 示例 2.4\n\n```javascript\n\
  var a=100; var b=200;\nvar result = (a>b); document.write ( result );\nresult =\
  \ (a==b); document.write ( result );\nresult = (a!=b); document.write ( result );\n\
  ```\n\n解释：\n\n`100>200` 返回 false;\n`100==200` 返回 false;\n`100!=200` 返回 true;\n\n\
  ## 条件运算符\n\n`(test-expression) ? (if-true-do-this) : (if-false-do-this);`\n\n`(test-expression)`\
  \ 类似于 `a<b`, `x!=y` 等。\n\n### 示例 2.5\n\n```html\n<<html><body><script>var x=100;\
  \ var y=200;var result = (x < y) ? \"apple\" : \"banana\"; document.write ( result\
  \ );</script></body></html>\n```\n\n输出：apple\n\n解释：条件运算符使用 `(x<y)` 来测试 `\"x\"` 和\
  \ `\"y\"`，因为 `\"x\"` 小于 `\"y\"`，它是 true。因此，输出是 `\"apple\"`。\n\n## If 语句\n\n`if (\
  \ test-expression ) { ... }`\n\n只有当指定的条件为真时执行 `{ ... }` 中的代码，如果条件为假，则不执行 `{…}` 中的任何代码。\n\
  \n### 示例 2.6\n\n```javascript\nvar x=200;var y=100;\nif ( x > y ) { // 如果真，执行此操作\
  \ document.write ( \"x is greater than y\" );}\n```\n\n输出：x is greater than y\n\n\
  解释：\n\n`(x>y)` 是测试表达式，即 `(200>100)`，返回 true，则将执行 `{ }` 中的代码；返回 false，则不执行 `{ }`\
  \ 中的代码。\n\n## If-else 语句\n\n`if ( test-expression) { ... } else { ... }`\n\n`\"\
  if...else 语句\"` 在条件为真时运行某些代码，在条件为假时运行其他代码。\n\n### 示例 2.7\n\n```html\n<html><script>var\
  \ x=100; var y=200;if (x>y) {document.write (\"x is greater than y.\")} // 如果真，执行此操作\
  \ else {document.write ( \"x is less than y\" );} // 如果假，执行此操作</script></</html>\n\
  ```\n\n输出：x is less than y\n\n解释：`(x>y)` 是测试表达式，即 `(100>200)`，返回 true，则将输出 `\"x\
  \ is greater than y.\"`；返回 false，则将输出 `\"x is less than y\"`。\n\n## Switch 语句\n\n\
  `switch ( var variable )`\n\n\n\n\n\n## Switch 语句\n\n```javascript\n{\ncase 1: 如果等于此情况，执行此操作；\
  \ break;\ncase 2: 如果等于此情况，执行此操作； break;\ncase 3: 如果等于此情况，执行此操作； break;\ndefault\
  \ : 如果不等于任何情况，运行默认代码； break;\n}\n```\n\n变量的值将首先与每个 case 进行比较，如果等于其中一个 `case` 值，它将执行该\
  \ `case` 代码。\n\n`break;` 结束当前语句。\n\n### 示例 2.8\n\n```html\n<html><head><title>JavaScript\
  \ Test</title></head><body><script>\nvar number=20;\nswitch ( number ) { // number\
  \ value compares each case\ncase 10 : document.write ( \"Running case 10\" ); break\
  \ ;\ncase 20 : document.write ( \"Running case 20\" ); break;\ncase 30 : document.write\
  \ ( \"Running case 30\" ); break;\ndefault : document.write ( \"Running default\
  \ code\" ); break; }}\n</script></body></html>\n```\n\n**输出：**\nRunning case 20\n\
  \n**解释：**\n`number` 的值为 20；它匹配 `case 20`，因此它运行 `case 20` 中的代码。\n`break;` 结束了该语句，不能省略。\n\
  \n## For 循环\n\n```javascript\nfor( 初始化, 测试-表达式, 增量) { //某些代码; }\n```\n\n`for loop`\
  \ 通过指定的次数重复运行一个代码块。\n\n### 示例 2.9\n\n```html\n<html><script>\nfor (var x = 0; x\
  \ <= 5; x++) { // 循环 5 次\ndocument.write ( x );}</script></html>\n```\n\n**输出：**\
  \ \n012345\n\n**解释：**\n`var x = 0` 是初始化器，将变量 `x` 初始化为 0。\n`x <= 5` 是 `test-expression`，代码最多运行\
  \ 5 次。\n`x++` 意味着 `x` 在每次循环中增加 1。\n循环 5 次后，代码将输出 012345。\n\n## While 循环\n\n```javascript\n\
  while ( 测试-表达式 ) { // 在此处某些 js 代码; }\n```\n\n`while loop` 如果指定的条件为真，则循环遍历一个代码块。\n\
  \n### 示例 2.10\n\n```javascript\n<script>\nvar counter=0;\nwhile (counter < 8){ //\
  \ 循环 8 次\ndocument.write ( \"&\" );\ncounter++; // 每次循环增加 1}</script>\n```\n\n**输出：**\n\
  &&&&&&&&\n\n**解释：**\n`\"counter< 8\"` 是一个 `test expression`，如果条件为真，代码将循环少于 8 次，直到\
  \ `counter` 达到 8 为止，此时条件为假，代码将停止运行。\n\n## Do-While 循环\n\n```javascript\ndo{ // 在此处某些\
  \ js 代码 } while ( 测试-表达式);\n```\n\n`do...while` 先循环一次代码块，然后如果指定的条件为真，则重复循环。\n\n\
  ### 示例 2.11\n\n```javascript\n<script>\nvar counter=0;\ndo {\n  document.write (\
  \ \"@\" );\n  counter++; // 每次循环增加 1\n} while (counter<8); // 循环 8 次</script>\n\
  ```\n\n**输出：**\n@@@@@@@@\n\n**解释：**\n`\"counter< 8\"` 是一个 `test expression`，如果条件为真，代码将循环少于\
  \ 8 次，直到 `counter` 达到 8 为止，此时条件为假，代码将停止运行。\n\n## Break 语句\n\n`break` 关键字用于根据条件停止运行循环。\n\
  \n```javascript\nbreak;\n```\n\n### 示例 2.12\n\n```javascript\n<script>\nvar num=0;\n\
  while (num<10){\n  if (num==5) break; // 如果 num 为 5，则退出\"while loop\"\n  num++;\n\
  }\ndocument.write ( num );</script>\n```\n\n**输出：** 5\n\n**解释：**\n`\"if (num==5)\
  \ break;\"` 是一个 `break statement`。如果 `num` 为 5，程序将运行 `break` 命令，`break statement`\
  \ 将退出循环，然后运行 `document.write (num)`。\n\n## Continue 语句\n\n`continue` 关键字用于停止当前迭代，忽略后续代码，然后继续下一次循环。\n\
  \n```javascript\ncontinue;\n```\n\n### 示例 2.13\n\n```html\n<html><body><script>\n\
  var num=0;\nwhile (num<10){\n  num++;\n  if (num==5) continue; // 进入下一次\"while loop\"\
  \n  document.write ( num ); // 如果 num 为 5 则跳过此\n}</script></body></html>\n```\n\n\
  **输出：**\n1234678910\n\n**解释：**\n注意输出中没有 5。\n`\"if (num==5) continue;\"` 意味着：当 `num`\
  \ 为 5 时，程序将运行 `continue` 命令，跳过下一个命令 `document.write ( num )`，然后继续下一次 while 循环。所以看不到\
  \ 5。\n\n## 动手项目：数字一\n\n### For 循环示例\n\n打开记事本，输入 JavaScript 代码：\n\n```html\n<html><head><title>Number\
  \ One</title></head>body><script language=\"javascript\">\nfor ( n = 1; n <= 6;\
  \ n++ ){ // 循环 6 次\n  document.write ( \"<h\"+n+\">Number \"+n+\"</h\"+n+\">\");\n\
  } // 输出\n</script></body>\n</html>\n```\n\n**解释：**\n`for( init, test-expression,\
  \ increment) { //某些代码; }` 通过指定的次数重复运行一个代码块。\n`var x = 0` 是初始化器，将变量 `x` 初始化为 0。\n\
  `x <= 5` 是 `test-expression`，代码最多运行 5 次。\n`x++` 意味着 `x` 在每次循环中增加 1。\n循环 5 次后，代码将输出\
  \ 012345。\n\n\n\n\n\n```javascript\nvar arr = new Array( \"a\", \"b\", \"c\", \"\
  d\", \"e\", \"f\" );var sli = arr.slice( 2, 5 ); /*  从索引 2 到索引 5-1 提取某些元素  */document.write\
  \ ( sli );\n```\n输出: c, d, e\n\n解释:\n`arr.slice ( 2, 5 )` 从 `arr` 数组索引 2 到 5-1 提取元素。注意\
  \ 5-1 索引表示的是 `\"e\"`，而不是 `\"f\"`。\n\n### 对元素排序\n\n### `array.sort( )`\n\n`array.sort(\
  \ )` 可以按顺序对数组元素排序。\n\n示例 3.7\n\n```javascript\nvar arr = new Array( 2, 5, 3, 1,\
  \ 4, 6 );arr.sort ( ); // 按顺序排序所有元素 var sor = arr.join(\",\"); // 用 \",\" 连接所有元素\
  \ document.write ( sor );\n```\n输出: 1,2,3,4,5,6\n\n解释:\n`arr.sort ( )` 按顺序对 `arr`\
  \ 的元素进行排序。\n`var sor = arr.join(\",\")` 用逗号连接 `arr` 的元素；并将值赋值给 `sor`。\n\n## 将元素转换为字符串\n\
  \n### `array.toString();`\n\n`array.toString()` 将 JavaScript 数组转换为字符串。\n\n示例 3.8\n\
  \n```javascript\nvar myarray = new Array( );myarray[0] =\"Mon\";myarray[1] =\"Tue\"\
  ;myarray[2] =\"Wed\";var days = myarray.toString( ); // 转换为字符串 document.write (\
  \ days );\n```\n输出:\nMon, Tue, Wed\n\n解释:\n`myarray.toString( )` 将 JavaScript 数组转换为字符串。`\"\
  Mon, Tue, Wed\"` 的值是字符串类型。\n\n## 查找特定元素 (1)\n\n### `indexOf( )`\n\n`indexOf( )`\
  \ 可以找到指定元素在数组中首次的位置。\n\n示例 3.9\n\n```javascript\nvar myarray = new Array( );myarray[0]\
  \ =\"Mon\";myarray[1] =\"Tue\";myarray[2] =\"Wed\";myarray[3] =\"Tue\";var index\
  \ = myarray.indexOf (\"Tue\"); // 获取 \"Tue\" 的索引 document.write (index);\n```\n\
  输出: 1\n\n解释:\n`myarray.indexOf ( \"Tue\" )` 返回 `\"Tue\"` 在 `myarray` 中首次出现的位置。`\"\
  Tue\"` 的索引为 1。\n如果在数组中未找到元素，`indexOf( )` 返回 -1。\n\n## 查找特定元素 (2)\n\n### `lastIndexOf(\
  \ )`\n\n`lastIndexOf( )` 可以找到指定元素在数组中最后一次的位置。\n\n示例 3.10\n\n```javascript\nvar myarray\
  \ = new Array( );myarray[0] =\"Mon\";myarray[1] =\"Tue\";myarray[2] =\"Wed\";myarray[3]\
  \ =\"Tue\";var index=myarray.lastIndexOf ( \"Tue\" ); // 获取 \"Tue\" 的索引 document.write\
  \ (index);\n```\n输出: 3\n\n解释:\n`myarray.lastIndexOf ( \"Tue\" )` 返回 `\"Tue\"` 在\
  \ `myarray` 中最后一次出现的位置。`\"Tue\"` 的索引为 3。\n如果在数组中未找到元素，`lastIndexOf( )` 返回 -1。\n\n\
  ## 在开头添加元素\n\n#### `unshift( )`\n\n在数组的开头添加一个或多个元素。\n\n示例 3.11\n\n```javascript\n\
  var arr = [4,5,6];arr.unshift(1,2,3);  // 将 1,2,3 添加到 \"arr\" 的开头 document.write\
  \ (arr);\n```\n输出: 1,2,3,4,5,6\n\n解释:\n`unshift()` 在数组的开头添加一个或多个元素。\n`arr.unshift(1,2,3);`\
  \ 将元素 1,2,3 添加到 `arr` 的开头。\n\n## 移除第一个元素\n\n### `shift( )`\n\n移除数组的第一个元素。\n\n示例\
  \ 3.12\n\n```javascript\nvar arr = [4,5,6];arr.shift( ); // 移除数组的第一个元素 document.write\
  \ (arr);\n```\n输出:\n5, 6\n\n解释:\n`shift()` 移除数组的第一个元素。\n`arr.shift( );` 移除数组 `arr`\
  \ 的第一个元素。\n\n## 在末尾添加元素\n\n### `push( )`\n\n在数组的末尾添加一个或多个元素。\n\n示例 3.13\n\n```javascript\n\
  var arr = [1,2,3];arr.push( 4, 5, 6 ); // 将 4,5,6 添加到 \"arr\" 的末尾 document.write\
  \ (arr);\n```\n输出: 1,2,3,4,5,6\n\n解释:\n`push()` 在数组的末尾添加一个或多个元素。\n`arr.push(4,5,6);`\
  \ 将 4,5,6 添加到 `arr` 的末尾。\n\n### 移除最后一个元素\n\n### `pop( )`\n\n移除数组的最后一个元素。\n\n示例 3.14\n\
  \n```javascript\nvar arr = [1,2,3,4,5,6];arr.pop( ); // 移除 arr 的最后一个元素 document.write\
  \ (arr);\n```\n输出: 1,2,3,4,5\n\n解释:\n`pop()` 移除数组的最后一个元素。\n`arr.pop( );` 移除 `arr`\
  \ 的最后一个元素。\n\n## 数组反转\n\n### `array.reverse( )`\n\n`array.reverse( )` 可以反转数组元素的顺序。\n\
  \n示例 3.15\n\n```javascript\nvar arr = new Array( 1, 2, 3, 4, 5, 6 );arr.reverse\
  \ ( ); // 反转所有元素 var sor = arr.join(\",\"); // 用 \",\" 连接所有元素 document.write ( sor\
  \ );\n```\n输出: 6,5,4,3,2,1\n\n解释:\n`arr.reverse ( )` 反转 `arr` 的元素顺序。\n`var sor =\
  \ arr.join(\",\")` 用逗号连接 `arr` 的元素；并将值赋值给 `sor`。\n\n## 合并数组\n\n### `array.concat(\
  \ )`\n\n`array.concat( )` 可以合并两个或多个数组。\n\n示例 3.16\n\n```javascript\nvar arr1 = new\
  \ Array( 1, 2, 3 );var arr2 = new Array( 4, 5, 6 );var arr = arr1.concat( arr2 );\
  \ // 合并 arr1 和 arr2document.write ( arr );\n```\n输出: 1,2,3,4,5,6\n\n解释:\n`arr1.concat(\
  \ arr2 )` 合并 `arr1` 和 `arr2` 并返回新数组。\n\n### 复制数组\n\n#### `array.slice( )`\n\n`array.slice(\
  \ )` 可以用来创建一个数组的浅拷贝。\n\n示例 3.17\n\n```javascript\nvar arr = new Array( 1, 2, 3 );var\
  \ copy = arr.slice( ); // 复制数组 document.write ( copy );\n```\n输出: 1,2,3\n\n解释:\n\
  `arr.slice( )` 创建了 `arr` 的一个浅拷贝。\n\n## 填充数组\n\n### `array.fill( )`\n\n`array.fill(\
  \ )` 可以填充数组中的所有元素为指定的值。\n\n示例 3.18\n\n```javascript\nvar arr = new Array( 5 );arr.fill(\
  \ 0 ); // 将所有元素填充为 0document.write ( arr );\n```\n输出: 0,0,0,0,0\n\n解释:\n`arr.fill(\
  \ 0 )` 将数组中的所有元素填充为 0。\n\n## 查找数组中的最大值\n\n### `Math.max( )`\n\n`Math.max( )` 可以找到数组中的最大值。\n\
  \n示例 3.19\n\n```javascript\nvar arr = new Array( 1, 6, 2, 8, 5, 7 );var max = Math.max(...arr);\
  \ // 获取数组中的最大值 document.write (max);\n```\n输出: 8\n\n解释:\n`Math.max( ...arr )` 使用扩展运算符获取\
  \ `arr` 元素中的最大值。\n\n## 查找数组中的最小值\n\n### `Math.min( )`\n\n`Math.min( )` 可以找到数组中的最小值。\n\
  \n示例 3.20\n\n```javascript\nvar arr = new Array( 1, 6, 2, 8, 5, 7 );var min = Math.min(...arr);\
  \ // 获取数组中的最小值 document.write (min);\n```\n输出: 1\n\n解释:\n`Math.min( ...arr )` 使用扩展运算符获取\
  \ `arr` 元素中的最小值。\n\n## 随机数\n\n### `Math.random( )`\n\n`Math.random()` 返回一个 0（包含）到\
  \ 1（不包含）之间的随机数。\n\n示例 3.21\n\n```javascript\nvar rand = Math.random(); // 生成随机数\
  \ document.write (rand);\n```\n输出: 0.123456...\n\n解释:\n`Math.random()` 生成一个 0 到\
  \ 1 之间的随机浮点数。\n\n## 舍入\n\n### `Math.floor( )`\n\n`Math.floor( )` 将数字向下取整到最近的整数。\n\
  \n示例 3.22\n\n```javascript\nvar num = Math.floor( 4.7 ); // 向下取整 document.write\
  \ (num);\n```\n输出: 4\n\n解释:\n`Math.floor( 4.7 )` 将 4.7 向下取整为 4。\n\n## 向上\n\n###\
  \ `Math.ceil( )`\n\n`Math.ceil( )` 将数字向上取整到最近的整数。\n\n示例 3.23\n\n```javascript\n\
  var num = Math.ceil( 4.2 ); // 向上取整 document.write (num);\n```\n输出: 5\n\n解释:\n`Math.ceil(\
  \ 4.2 )` 将 4.2 向上取整为 5。\n\n## 四舍入\n\n### `Math.round( )`\n\n`Math.round( )` 将数字四舍五入到最近的整数。\n\
  \n示例 3.24\n\n```javascript\nvar num = Math.round( 4.6 ); // 四舍五入 document.write\
  \ (num);\n```\n输出: 5\n\n解释:\n`Math.round( 4.6 )` 将 4.6 四舍五入为 5。\n\n## 绝对值\n\n###\
  \ `Math.abs( )`\n\n`Math.abs( )` 返回数字的绝对值。\n\n示例 3.25\n\n```javascript\nvar num\
  \ = Math.abs( -10 ); // 获取绝对值 document.write (num);\n```\n输出: 10\n\n解释:\n`Math.abs(\
  \ -10 )` 返回 -10 的绝对值 10。\n\n## 幂\n\n### `Math.pow( )`\n\n`Math.pow( x, y )` 返回 `x`\
  \ 的 `y` 次幂。\n\n示例 3.26\n\n```javascript\nvar num = Math.pow( 2, 3 ); // 2 的 3 次幂\
  \ document.write (num);\n```\n输出: 8\n\n解释:\n`Math.pow( 2, 3 )` 计算 $2³$ 的结果为 8。\n\
  \n## 平方根\n\n### `Math.sqrt( )`\n\n`Math.sqrt( )` 返回数字的平方根。\n\n示例 3.27\n\n```javascript\n\
  var num = Math.sqrt( 16 ); // 获取平方根 document.write (num);\n```\n输出: 4\n\n解释:\n`Math.sqrt(\
  \ 16 )` 返回 16 的平方根 4。\n\n\n\n\n\n# PI 与 随机值\n\n### Math.PI\n`Math.PI` 是一个存储圆周率 值的常量。\n\
  \n### Math.random()\n`Math.random()` 生成一个 0.0 到 1.0 之间的随机数。\n\n### 示例 4.6\n```html\n\
  <script>\nvar pi = Math.PI;\nvar ran = Math.random();\ndocument.write (\"The PI\
  \ value is \" + pi + \"<br>\");\ndocument.write (\"The random number is \" + ran);\n\
  </script>\n```\n**输出：**\nThe PI value is 3.141592653589793\nThe random number is\
  \ 0.6315033452119678\n\n**解释：**\n`Math.PI` 的值为 3.141592653589793。\n`Math.random()`\
  \ 生成一个 0.0 到 1.0 之间的随机数，在这里的结果是 0.6315033452119678。\n\n# 日期与 时间\n\nJavaScript 经常使用日期和时间来设计网页。在使用日期时间之前，必须先创建一个日期对象。\n\
  \n### `var DateObject = new Date()` // 创建日期对象\n\n### 示例 4.7\n```html\n<script>\n\
  var DateObject = new Date(); // create a date object\ndocument.write ( DateObject\
  \ );\n</script>\n```\n**输出：**\nThu Nov 05 2015 21:39:28 GMT-0500 (Eastern Standard\
  \ Time)\n\n**解释：**\n`var DateObject = new Date()` 创建了一个日期对象。\n`document.write (\
  \ DateObject )` 显示当前的日期和时间。\n\n# 日期、月、年、日\n\nDate 对象具有以下方法：\n\n- `getDate()`：获取日期\n\
  - `getMonth()`：获取月份（需要加 1）\n- `getYear()`：获取年份（需要加 1900）\n- `getDay()`：获取星期\n- `getFullYear()`：获取完整的年份\n\
  \n**注意：**\n- `getDay()` 返回从 0（星期日）到 6（星期六）。\n- `getMonth()` 返回从 0（一月）到 11（十二月）。\n\
  - `getYear()` 返回年份，但需要加 1900。\n- `getFullYear()` 返回格式正确的年份。\n\n### 示例 4.8\n```html\n\
  <html><body><script>\nvar now = new Date (); // create a date object\nvar m = now.getMonth()\
  \ + 1; // 注意这里需要加 1\nvar d = now.getDate();\nvar y = now.getYear() + 1900; // 注意这里需要加\
  \ 1900\nvar fy = now.getFullYear();\ndocument.write ( m + \" - \" + d + \" - \"\
  \ + y + \"<br>\" + \"This year is \" + fy);\n</script></body></html>\n```\n**输出：**\n\
  11- 6 - 2015\nThis year is 2015\n\n**解释：**\n`now.getMonth()` 返回月份索引，但需要加 1。\n`now.getDate()`\
  \ 返回当前日期。\n`now.getYear()` 返回年份，但需要加 1900。\n`getFullYear()` 返回格式正确的年份。\n\n# 小时、分、秒\n\
  \nDate 对象具有以下方法：\n\n- `getHours()`：获取小时\n- `getMinutes()`：获取分钟\n- `getSeconds()`：获取秒\n\
  - `getTime()`：获取时间\n\n注意 `getTime()` 返回的是从 1970 年 1 月 1 日到当前时间的数字。\n\n### 示例 4.9\n\
  ```html\n<html><head><title>JavaScript Codes</title></head><body><script>\nvar now\
  \ = new Date(); // create a date object\nvar h = now.getHours();\nvar m = now.getMinutes();\n\
  var s = now.getSeconds();\ndocument.write ( \"The current time is: <br>\");\ndocument.write\
  \ ( h + \":\" + m + \":\" + s );\n</script></body></html>\n```\n**输出：**\nThe current\
  \ time is:\n19:30:28\n\n**解释：**\n`getHours` 返回当前小时。\n`getMinutes` 返回当前分钟。\n`getSeconds`\
  \ 返回当前秒。\n\n## 不同的时间\n\n- `getUTCHours()`：返回格林威治标准时间 (UTC)。\n- `getTimezoneOffset()`：返回\
  \ UTC 时间与本地时间之间的差。例如，如果你的时区是 GMT+2，则将返回 -120。\n\n### 示例 4.10\n```html\n<html><head><title>JavaScript\
  \ Codes</title></head><body><script>\nvar now = new Date(); // create a date object\n\
  var utc = now.getUTCHours(); // 获取格林威治标准时间\nvar timezone = now.getTimezoneOffset();\
  \ // 获取时区\ndocument.write ( utc + \"<br>\" )\ndocument.write ( timezone + \"<br>\"\
  \ );\n</script></body></html>\n```\n**输出：**\n13\n300\n\n**解释：**\n`getUTCHours()`\
  \ 返回 UTC 小时。“13”意味着当前的格林威治时间。\n`getTimezoneOffset()` 返回一个数字。例如，“300”表示东部时间，“360”表示中部时间，“420”表示太平洋时间。\n\
  \n## 设置日期与时间\n\nDate 对象具有以下设置方法：\n\n- `setDate()`：设置日期\n- `setMonth()`：设置月份\n- `setFullYear()`：设置年份\n\
  - `setHours()`：设置小时\n- `setMinutes()`：设置分钟\n- `setSeconds()`：设置秒\n- `setTime()`：设置时间\n\
  \n**注意：**\n- `setDate()` 接受的值是 1 到 31。\n- `setMonth()` 接受的值是 0 到 11。\n- `setFullYear()`\
  \ 接受四位年份。\n\n### 示例 4.11\n```javascript\nvar now = new Date(); // 创建日期对象\nnow.setDate(15);\
  \ // 设置日期为 15 号\nnow.setMonth(5); // 设置月份为 6 月\nnow.setFullYear(2025); // 设置年份为\
  \ 2025 年\ndocument.write(now);\n```\n**输出：**\nSun Jun 15 2025 ...\n\n### 示例 4.12\n\
  ```html\n<html><head><title>JavaScript Codes</title></head><body><script>\nvar now\
  \ = new Date(); // 创建一个日期对象\nnow.setHours(10, 30, 0); // 设置小时、分、秒\ndocument.write(now);\n\
  </script></body></html>\n```\n**输出：**\n... 10:30:00 ...\n\n## 计时器\n\nJavaScript\
  \ 使用 `setTimeout` 和 `setInterval` 来执行定时任务。\n\n- `setTimeout(function, milliseconds)`：在指定的毫秒数后执行一次函数。\n\
  - `setInterval(function, milliseconds)`：每隔指定的毫秒数执行一次函数。\n\n### 示例 4.13\n```javascript\n\
  var count = 0;\nfunction timer() {\n    count++;\n    console.log(\"Count is: \"\
  \ + count);\n}\nsetInterval(timer, 1000); // 每 1 秒执行一次 timer\n```\n\n#### 示例 4.14\n\
  ```javascript\nvar count = 0;\nvar timer = setInterval(function() {\n    count++;\n\
  \    console.log(\"Count is: \" + count);\n    if (count == 5) {\n        clearInterval(timer);\
  \ // 5 次后停止计时器\n    }\n}, 1000);\n```\n\n\n\n\n\n### 示例 5.3\n\n| <html><script>var\
  \ mystring = \"JavaScript is easy\";var charac = mystring.charAt ( 2 );�// search\
  \ a character at index 2document.write ( charac );</script></html> |\n\n输出: `v`\n\
  \n解释:\n\n`\"mystring.charAt( 2 )\"` 找到 `mystring` 中索引为 2 的字符，并返回结果 `\"v\"`。\n\n\
  注意字符串的索引从 0 开始。\n\n## 转换字符大小写\n\n|  |\n\n### `string.toUpperCase( )`\n\n### `string.toLowerCase(\
  \ )`\n\n |\n\n`\"toUpperCase( )\"` 和 `\"toLowerCase( )\"` 可以进行大小写转换。\n\n### 示例 5.4\n\
  \n| <script>var mystring = \"Hello World!\";var big = mystring.toUpperCase( );var\
  \ small = mystring.toLowerCase( );document.write ( \"Uppercase is \" + big + \"\
  <br>\" );�document.write ( \"Lowercase is \" + small);</script> |\n\n输出:\n\nUppercase\
  \ is HELLO WORLD!\n\nLowercase is hello world!\n\n解释:\n\n`\"mystring.toUpperCase(\
  \ )\"` 和 `str.toLowerCase( )` 转换了 `mystring` 的大小写。\n\n## 分割字符串\n\n`\"split(\" \"\
  \ )\"` 可以根据字符串中的空格将其拆分为多个子字符串。\n\n`\"split()\"` 也用于将字符串转换为数组。\n\n|  |\n\n### `string.split(\
  \ \" \" );`\n\n |\n\n`(\" \")` 意味着根据字符串中的空格分割字符串，但分隔符是逗号 `\",\"`。\n\n### 示例 5.5\n\
  \n| <html><head><title>JavaScript 代码</title></head><body><script>var mystring =\
  \ \"JavaScript for Beginners\";var substr = mystring.split( \" \" ); /* 根据 mystring\
  \ 的空格将 mystring 分分为子字符串 */document.write ( substr ); // 显示子字符串 document.write (\
  \ \"<br>\" + substr[0]);document.write ( \"<br>\" + substr[1]);document.write (\
  \ \"<br>\" + substr[2]);</script></body></html> |\n\n输出:\n\nJavaScript, for, Beginners\n\
  \nJavaScript\n\nfor\n\nBeginners\n\n解释:\n\n`\"mystring.split( \" \" )\"` 根据 `mystring`\
  \ 的空格将字符串分离为多个子字符串，使用逗号分割 `mystring`。\n\n`\"document.write ( substr );\"` 显示了多个子字符串。\n\
  \n`\"substr[0]\"` 显示第一个子字符串。\n\n`\"substr[1]\"` 显示第二个子字符串。\n\n`\"substr[2]\"` 显示第三个子字符串。\n\
  \n## 提取子字符串\n\n|  |\n\n### `string.substr( start, length );`\n\n |\n\n`\"substr(\
  \ start, length )\"` 可以从字符串中提取子字符串。\n\n`\"start\"` 参数指定提取的起始位置。\n\n`\"length\"`\
  \ 参数指定子字符串的长度。\n\n### 示例 5.6\n\n| <script>var mystring = \"JavaScript is easy.\"\
  ;var sub = mystring.substr( 4, 6 ); /* 从索引 4 开始提取长度为 6 的子字符串 */document.write (\
  \ sub );</script> |\n\n输出: \n\nScript\n\n解释:\n\n`\"mystring.substr( 4, 6 )\"` 从\
  \ `mystring` 中提取一个子字符串。\n\n`\"( 4, 6 )\"` 指定子字符串的起始位置为 4，长度为 6。\n\n注意字符串索引从 0 开始。\n\
  \n## 将数字转换为字符串\n\n|  |\n\n##### `number.toString( );`\n\n |\n\n为了满足 JS 编程的需求，有时需要将数字转换为字符串数据类型。\n\
  \n`\"number.toString( )\"` 可以将数字转换为字符串。\n\n### 示例 5.7\n\n| <script>var num1 = 12;\
  \ var num2 = 68;var str1 = num1.toString( ); // 转换为字符串 var str2 = num2.toString(\
  \ ); // 转换为字符串 var sum = str1 + str2; // 是连接而非相加 document.write ( sum );</script>\
  \ |\n\n输出: 1268\n\n解释:\n\n`\"num1.toString( )\"` 和 `\"num2.toString( )\"` 将两个数字转换为字符串类型。因此，`str1`\
  \ 加上 `str2` 的结果是 1268，而不是 80。\n\n## 将字符串转换为数字\n\n|  |\n\n### `parseInt(string);`\n\
  \n##### `parseFloat( string);`\n\n |\n\n`\"parseInt(string)\"` 和 `parseFloat(string)`\
  \ 可以将字符串转换为整数或浮点数。\n\n### 示例 5.8\n\n| <script>var str1 = \"12\"; var str2 = \"68\"\
  ;var num1 = parseInt( str1 ); // 转换为 Intvar num2 = parseFloat( str2 ); // 转换为 Intvar\
  \ addition = num1 + num2; // 是相加而非连接 document.write ( addition );</script> |\n\n\
  输出: 80\n\n解释:\n\n`\"parseInt( str1)\"` 和 `\"parseFloat( str2 )\"` 将两个字符串转换为数字类型。因此，`num1`\
  \ 加上 `num2` 的结果是 80，而不是 1268。\n\n## 搜索特定单词 (1)\n\n|  |\n\n### `indexOf( )`\n\n |\n\
  \n`\"indexOf( )\"` 可以找到指定单词在字符串中第一次出现的位置。\n\n### 示例 5.9\n\n| <script>var mystring\
  \ = \"Please do what you decide to do!\";var index = mystring.indexOf(\"do\"); //\
  \ 返回索引 document.write ( index );</script> |\n\n输出:\n\n7\n\n解释:\n\n`\"mystring.indexOf(\"\
  do\")\"` 返回 `\"do\"` 第一次出现的位置。\n\n## 搜索特定单词 (2)\n\n|  |\n\n### `lastIndexOf( )`\n\
  \n |\n\n`\"lastIndexOf( )\"` 可以找到指定单词在字符串中最后一次出现的位置。\n\n### 示例 5.10\n\n| <script>var\
  \ mystring = \"Please do what you decide to do!\";var index = mystring.lastIndexOf(\"\
  do\");document.write ( index );</script> |\n\n输出:\n\n27\n\n解释:\n\n`\"mystring.lastIndexOf(\"\
  do\")\"` 返回 `\"do\"` 最后一次出现的位置。\n\n## Unicode\n\n|  |\n\n### `strObject.charCodeAt(index)`\n\
  \n |\n\n`\"strObject.charCodeAt(index)\"` 返回指定位置的 Unicode。\n\n### 示例 5.11\n\n| <script>var\
  \ myString = \"Hello world!\";var u = myString.charCodeAt(4);document.write ( u\
  \ );</script> |\n\n输出: 111\n\n解释:\n\n`\"myString.charCodeAt(4)` 返回索引 4 的 Unicode。\n\
  \n## 给文本添加链接\n\n|  |\n\n### `string.link( String )`\n\n |\n\n`\"string.link( String\
  \ )\"` 为字符串添加超链接。\n\n# 示例 5.12\n\n| <script>var str = \"Please me!\";var L = str.link(\"\
  https://www.com/author/yao\");document.write (\"Welcome to our website: \" + L);</script>\
  \ |\n\n输出:\n\nWelcome to our website: https://www.com/author/yao\n\n解释:\n\n`str.link(\"\
  https://www.com/author/yao\")` 为字符串添加链接。\n\n## 动手项目：大小写\n\n字符串操作：打开记事本，输入 JavaScript\
  \ 代码：\n\n| <html><script>var oldText=\"Java in 8 Hours\"var newText= oldText.toUpperCase();document.write\
  \ (\"Original: \"+oldText+\"<br>\");document.write (\"Uppercase: \"+newText);</script></html>\
  \ |\n\n请将文件保存为 \"ToUppercase.html\"。\n\n注意：使用 \".html\" 扩展名并运行。\n\n输出:\n\nOriginal:\
