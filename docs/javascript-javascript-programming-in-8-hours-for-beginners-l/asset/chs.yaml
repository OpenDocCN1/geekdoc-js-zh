  \n# 第 6 章 对象\n\n## 对象声明\n\nJavaScript 对象是一个拥有属性和方法的实体。对象指的是具体的某个。例如：汽车、书、狗、房屋等。\n\
  \n|  |\n\n##### `obj = new Object( ); // 创建对象`\n\n### `obj.property;`\n\n`obj.method()`\
  \ |\n\n`obj = new Object( )` 创建名为 `obj` 的新对象。\n\n`obj.property` 意味着对象的属性。\n\n`obj.method()`\
  \ 意味着对象的方法。\n\n### 示例 6.1\n\n| <html><head><title>JavaScript 代码</title></head><body><script>house\
  \ = new Object ( ); // 创建对象 \"house\"house.color = \"white\"; // 对象引用变量 house.size\
  \ = \"big\"; // 对象引用变量 document.write ( \"House color: \" + house.color + \"<br>\"\
  );document.write ( \"House size: \" + house.size + \"<br>\" );</script></body></html>html>\
  \ |\n\n输出:\n\nHouse color: white\n\nHouse size: big\n\n解释:\n\n`house=new Object(\
  \ )` 创建了名为 `house` 的对象。\n\n`house.color` 意味着房屋的颜色。\n\n`house.size` 意味着房屋的尺寸。\n\n\
  ## 页面导航\n\n|  |\n\n### `windows.history.back( );`\n\n### `windows.history.forward(\
  \ );`\n\n |\n\n`\"history.back( )\"` 返回到上一个页面。\n\n`\"history.forward( )\"` 前到下一个页面。\n\
  \n### 示例 6.2\n\n\n\n\n\n| <html><body><button onclick=\"history.back()\">后退</button><button\
  \ onclick=\"history.forward()\">前进</button></body></html> |\n\n## 解释：\n\n`<button\
  \ onclick=\"history.back()\">`\"点击此按钮时返回上一个页面。\"\n\n`<button onclick=\"history.forward()\"\
  >`\"点击此按钮时跳转到下一个页面。\"\n\n## 跳转到指定页面\n\n| |\n##### `window.history.go( number )`\
  \ | |\n\n\"`window.history.go( number)`\"\"可以跳转到指定的网页。\"\n\n### 示例 6.3\n\n| <html><body><button\
  \ onclick=\"history.history.go(-1)\">后退</button><button onclick=\"history.history.go(1)\"\
  >前进</button><button onclick=\"history.history.go(0)\">刷新</button></body></html>\
  \ |\n\n**解释：**\n\n`<button onclick=\"history. go(-1)\">`\"点击此按钮时返回上一个页面。\"\n\n`<button\
  \ onclick=\"history. go(1)\">`\"点击此按钮时跳转到下一个页面。\"\n\n`<button onclick=\"history.\
  \ go(0)\">`\"点击此按钮时刷新当前页面。\"\n\n## 打开自定义窗口\n\n打开自定义窗口的语法为：\n\n| |\n##### `window.open(\
  \ url, name, width, height, status, menubar )` | |\n\n\"`window.open`\"\"可以打开一个新的自定义窗口。\"\
  \n\n`url` 参数意味着新窗口的 url。\n\n`name` 参数意味着新窗口的名称。\n\n`width` 参数意味着新窗口的宽度。\n\n`height`\
  \ 参数意味着新窗口的高度。\n\n`status` 参数定义窗口的状态栏。\n\n`menubar` 参数定义窗口的菜单栏。\n\n`toolbar` 参数定义窗口的工具栏。\n\
  \n### 示例 6.4\n\n| <html><script>function openWindow(){windowObj = window.open(\"\
  \ \",\"MyWindow\",   \"  height=200, width=350, toolbar=yes, menubar=yes, status=no,\
  \ top=200, left=200\"); // 打开一个自定义窗口并创建一个对象 windowObj.document.write (\"This is\
  \ a new window.\");}</script><form><center><input type=\"button\" onClick=\"openWindow()\"\
  \ value=\"打开窗口\"></center></form></html> |\n\n**输出：**\n\nThis is a new window.\n\
  \n**解释：**\n\n`window.open(…)`\"打开一个自定义窗口。\"\n\n`MyWindow` 是新窗口的名称。\n\n`height=200,width=350`指定了新窗口的大小。\n\
  \n`toolbar=yes`意味着有一个工具栏。\n\n`memubar=yes`意味着有一个菜单栏。\n\n`status= no`意味着没有状态栏。\n\n\
  `top=200,left=200`指定了新窗口的位置。\n\n`onClick=\"openWindow()\"`\"在点击按钮时打开自定义窗口。\"\n\n\
  ## 关闭当前窗口\n\n| |\n##### `window.close( )` | |\n\n\"`window.close( );`\"可以关闭当前窗口。\"\
  \n\n### 示例 6.5\n\n| <script>function shut(){alert(\"The window will be closed!\"\
  )window.close( ); // 关闭当前窗口  }</script><form><p><input type = \"button\" onclick\
  \ = \"shut()\"  value = \"关闭\">  </form> |\n\n**输出：** The window will be closed!\n\
  \n**解释：**\n\n`window.close( )`用于关闭当前窗口。\n\n## 确认\n\n确认对话框的语法为：\n\n| |\n##### `window.confirm(\
  \ )` | |\n\n\"`window.confirm( )`\"\"需要用户确认。确认对话框看起来如下：\"\n\n![](img/image00314.jpeg)\n\
  \n当点击“OK”时，它在脚本中返回 `true`。\n\n当点击“Cancel”时，它在脚本中返回 `false`。\n\n### 示例 6.6\n\n| <html><head><title>JavaScript\
  \ 代码</title></head><body><script>var ask = window.confirm(\"Are you sure?\");  //\
  \ confirm() 将返回 true 或 false  if ( ask == true ){ document.write ( \"All Right!\"\
  \ ); }else{  document.write (\"Cancel!\"); }</script></body></body>></html> |\n\n\
  **输出：**\n\nAll Right! \n\nCancel!\n\n**解释：**\n\n点击“OK”按钮时，输出 \"All Right!\"。\n\n\
  点击“Cancel”按钮时，输出 \"Cancel!\"。\n\n## 输入提示\n\n| |\n##### `window.prompt( )` | |\n\n\
  \"`window.prompt( )`\"\"弹出一个提示对话框让用户输入内容，对话框看起来如下：\"\n\n![](img/image00315.jpeg)\n\
  \n用户应该在提示对话框中输入一些文字，例如输入“Yes, I like it.”，然后点击“OK”或“Cancel”按钮。\n\n### 示例 6.7\n\n\
  | <html><head><title>JavaScript 代码</title></head><body><script>var data = window.prompt\
  \ (\"Do you like JavaScript?\");// prompt() 将输入的内容存储在 \"data\"变量中 document.write\
  \ ( data );</script></body></body>html> |\n\n**输出：**\n\n![](img/image00316.jpeg)\n\
  \n**解释：**\n\n用户输入了一个句子“Yes, I like it!”，然后点击“OK”按钮，该值被赋值给 `data`。\n\n`document.write\
  \ ( data )`显示用户输入的内容。\n\n## 通过 ID 获取元素\n\n我们可以根据 id 访问元素。\n\n| |\n##### `document.getElementById(\
  \ ).innerHTML` | |\n\n\"`getElementById`\"\"通过其 id 访问元素。\"\n\n`innerHTML`显示内容。\n\
  \n### 示例 6.8\n\n| <html><div id=\"position\"></div><script>document.getElementById(\"\
  position\").innerHTML= \"OK\";//显示 id</script></html> |\n\n**输出：** OK\n\n**解释：**\n\
  \n`id = position`指定了 id。\n\n`getElementById(\"position\")`显示了值。\n\n## 通过标签名获取元素\n\
  \n我们可以根据标签名访问元素。\n\n| |\n##### `document.getElementsByTagName( ).innerHTML` | |\n\
  \n\"`getElementsByTagName`\"\"通过标签名访问元素。\"\n\n`innerHTML`显示值。\n\n### 示例 6.9\n\n\
  | <html><ol><li>Red</li><li>Yellow</li><li>Green</li></ol><button onclick=\"myFunction()\"\
  >Click</button><p id=\"S\"></p><script>function myFunction(){var col = document.getElementsByTagName(\"\
  li\");document.getElementById(\"S\").innerHTML = col[2];}</script></html> |\n\n\
  **输出：** ![](img/image00317.jpeg\n\n**解释：**\n\n`getElementsByTagName(\"li\")`访问标签。\n\
  \n`document.getElementById(\"S\")`显示值。\n\n\n\n\n\n`window.print( )` 打印当前窗口的内容。\n\
  \n`\"onclick=\"printWindow( )\"` 在点击按钮时调用函数 `printWin( )`。\n\n## 检查 Java 是否启用\n\n\
  `navigator.javaEnabled( )`\n\n检查浏览器是否支持 Java。\n\n示例 6.15\n\n```html\n<script>if\
  \ ( navigator.javaEnabled( ) == true )// 浏览器是否支持 Java\ndocument.write (\"The browser\
  \ supports the Java.\");\nelse\ndocument.write (\"The browser doesn't support the\
  \ Java.\");\n</script>\n```\n\n输出：\n浏览器支持 Java。或者：\n浏览器不支持 Java。\n\n解释说明：\n`navigator.javaEnabled(\
  \ )` 检查浏览器是否支持 Java。\n\n## 屏幕宽度与高度\n\n`screen.width` // 返回屏幕宽度。\n`screen.height`\
  \ // 返回屏幕高度。\n\n示例 6.16\n\n```html\n<script>var w = screen.width;\ndocument.write\
  \ (w + \"<br>\");\nvar h = screen.height;\ndocument.write (h + \"<br>\");\n</script>\n\
  ```\n\n输出：\n1024\n768\n\n解释说明：\n`Screen.width` 返回屏幕的宽度。\n`Screen.height` 返回屏幕的高度。\n\
  \n### 动手项目：最大值与最小值\n\n### Math 对象\n\n打开记事本，输入 JavaScript 代码：\n\n```html\n<html><head><script>\n\
  var number1 = 20;\nvar number2 = 50;\nvar number3 = 80;\ndocument.write (\"The maximum\
  \ number among 20, 50, 80 is:  \"+Math.max(number1,number2,number3)+\"<br><br>\"\
  );\n// 返回三个数字中的最大值\ndocument.write (\"The minimum number among 20, 50, 80 is:  \"\
  +Math.min(number1,number2,number3)+\"<br><br>\");\n// 返回三个数字中的最小值\n</script></head></html>\n\
  ```\n\n请将文件保存为 `MathObject.html`。\n\n注意：请确保使用 `.html` 扩展名。\n\n双击 `MathObject.html`\
  \ 文件，`MathObject.html` 将在浏览器中运行并查看输出。\n\n输出：\n20, 50, 80 中的最大值是：80\n20, 50, 80 中的最小值是：20\n\
  \n解释说明：\n`Math.max( )` 获取最大值。\n`Math.min( )` 获取最小值。\n\n# 第 7 章\n\n## HTML 基础\n\n\
  当我们检查网页的源代码时，会发现一些 HTML 元素或标签，它们看起来像这样：\n\n示例 7.1\n\n```html\n<html>\n<head>\n<title>...</title>\n\
  </head>\n<body>\n<form>...</form>\n...\n</body>\n</html>\n```\n\n解释说明：\n`<html>...</html>`\
  \ 定义网页的文档。\n`<head>...</head>` 定义网页的头部（head）。\n`<title>...</title>` 定义网页的标题。\n`<body>...</body>`\
  \ 定义网页的正文内容（body）。\n`<form>...</form>` 定义一个表单，用于接收来自用户的请求或输入。\n\n## 点击事件\n\n`onClick\
  \ = function( );`\n\n`\"onClick = function( );\"` 意味着当元素被点击时，函数会立即运行。触发点击事件。\n\n\
  示例 7.2\n\n```html\n<form><input type=\"button\" value=\"Previous\" onClick=\"history.back(\
  \ )\">   <!-- 点击事件 --></form>\n```\n\n返回：\n上一个页面\n\n解释说明：\n`<form>` 和 `</form>`\
  \ 是 HTML 标签，用于定义网页。\n`form` 用于接收用户的请求。\n`<input type=\"button\" value=\"Previous\"\
  …>` 定义了表单中的一个按钮，按钮上有“Previous”文字。\n`\"onClick=\"history.back( )\"` 意味着当点击按钮时，`history.back(\
  \ )` 立即运行，然后返回上一个网页。\n\n## 加载事件\n\n`onLoad = \"function( )\"`\n\n`onLoad=\"function(\
  \ )\"` 在网页加载完成后执行该函数。\n\n示例 7.3\n\n```html\n<html><body onLoad = \"test( )\">  <!--\
  \ 加载事件 --><script>function test(){document.write (\"Welcome to my website!\");}</script></body></html>\n\
  ```\n\n输出：\n欢迎来到我的网站！\n\n解释说明：\n`<html>` 和 `</html>` 是 HTML 标签，用于定义网页。\n`<body>`\
  \ 和 `</body>` 定义网页的正文。\n`onLoad= \"test( )\"` 在网页加载后立即执行 `test()`。\n\n## 键按下事件\n\
  \n`onKeyPress = function( );`\n\n`\"onKeyPress=function( )\"` 在按下按键时执行该函数。\n\n示例\
  \ 7.4\n\n```html\n<html><script>function myFunction(msg) { document.write (msg);}</script><body\
  \ onKeyPress = \"myFunction('Hello! My Friend.')\">请按一个键。      <!-- 键按下事件 --></body></html>\n\
  ```\n\n输出：\nHello! My Friend.\n\n解释说明：\n`onKeyPress=function( )` 执行了该函数。\n\n## 鼠标悬停事件\n\
  \n`\"onKeyPress=function( )\"`（注：根据上下文）\n`onOver = function( );`\n\n`\"onOver =\
  \ function( )\"` 在鼠标悬停在元素上时执行该函数。\n\n示例 7.5\n\n```html\n<html><head><script>function\
  \ myFunction() {document.write (\"Mouseover!\");}</script></head><body onmouseover=\"\
  myfunction()\">悬在这里</body></html>\n```\n\n输出：\nMouseover!\n\n解释说明：\n`onmouseover=\"\
  myfunction()` 在鼠标悬停时执行函数。\n\n## 鼠标移出事件\n\n`onOut = function( );`\n\n`\"onOut = function(\
  \ )\"` 在鼠标指针移出元素时执行该函数。\n\n示例 7.6\n\n```html\n<html><head><script>function myFunction()\
  \ {document.write (\"Mouseout!\");}</script></head><body onmouseout=\"myfunction()\"\
  >移这里</body></html>\n```\n\n输出：\nMouseout!\n\n解释说明：\n`onmouseout=\"myfunction()`\
  \ 在鼠标移出时执行函数。\n\n## 键释放事件\n\n`onKeyUp = function( );`\n\n`\"onKeyUp=function( )\"\
  ` 在释放按键时执行该函数。\n\n示例 7.7\n\n```html\n<html><script>function myFunction(msg) { document.write\
  \ (msg);}</script><body onkeyup=\"myFunction('KeyUp event!')\">请释放一个键。      <!--\
  \ 键释放事件 --></body></html>\n```\n\n输出：\nKeyUp event!\n\n解释说明：\n`onkeyup=function(\
  \ )` 在释放按键时执行函数。\n\n## 聚焦事件\n\n`onFocus = function( );`\n\n`\"onFocus = function(\
  \ )\"` 在用户点击输入框时执行该函数。\n\n示例 7.8\n\n```html\n<html><head><script>function myFunction()\
  \ {document.write (\"Focus event!\");}</script></head><body><input type=\"text\"\
  \ onfocus=\"myfunction()\"></body></html>\n```\n\n输出：\nFocus event!\n\n解释说明：\n`onfocus=\"\
  myfunction()` 在点击字段时执行函数。\n\n## 失去焦点事件\n\n`onBlur = function( );`\n\n`\"onBlur =\
  \ function( )\"` 在用户点击离开输入框时执行该函数。\n\n示例 7.9\n\n```html\n<html><head><script>function\
  \ myFunction() {document.write (\"Blur event!\");}</script></head><body><input type=\"\
  text\" onblur=\"myfunction()\"></body></html>\n```\n\n输出：\nBlur event!\n\n解释说明：\n\
  `onblur=\"myfunction()` 在点击离开字段时执行函数。\n\n## 重置事件\n\n`onReset = \"function( )\"`\n\
  \n`onReset=\"function( )\"` 在表单重置时执行该函数。\n\n示例 7.10\n\n```html\n<html><form onreset=\"\
  alert('The form has been reset!')\"><input type=\"text\" id=\"txt\"><input type=\"\
  reset\" value=\"Reset\" ><><!-- 重置事件 --></form></html>\n```\n\n输出：\n表单已重置。\n\n解释说明：\n\
  `onreset=\"alert()` 在点击重置按钮时运行 alert( )。\n\n## 提交事件\n\n`onSubmit = \"function( )\"\
  `\n\n`onSubmit=\"function( )\"` 在表单提交时执行该函数。\n\n示例 7.11\n\n```html\n<html><form\
  \ onSubmit=\"alert('The form has been submitted!')\"><input type=\"text\" id=\"\
  txt\"><input type=\"submit\" value=\"Submit\" ><><!-- 提交事件 --></form></html>\n```\n\
  \n\n\n\n\n表单已提交！\n\n### 解析：\n`onSubmit = \"alert( )\"` 在点击提交按钮时运行 `alert( )`。\n\n\
  ## 动手实践项目：鼠标移出（Mouse Out）\n\n### 事件示例\n\n打开记事本，输入 JavaScript 代码：\n\n```html\n<html><head><script>function\
  \ show1(){    alert(\"Welcome!\");}function show2(){    alert(\"Good Bye!\");}</script></head>body<br><br><center>\
  \      <!-- mouseover & mouseout event --><input type=\"text\" value=\"Put the mouse\
  \ on me!\"onMouseOver = \"show1()\"onMouseOut = \"show2()\"/></center></body></html>\n\
  ```\n\n请将文件保存为 \"EventDemo.html\"。\n\n注意：确保使用 \".html\" 扩展名。\n\n双击 \"EventDemo.html\"\
  \ 文件，将鼠标移入或移出文本框，查看输出结果。\n\n### 输出：\nWelcome!\nGood Bye!\n\n### 解析：\n`\"onMouseOver=\"\
  \ show1()\"` 当鼠标移动到文本框上时，执行函数 `show1()`。\n`\"onMouseOut=\" show2()\"` 当鼠标移出文本框时，执行函数\
  \ `show2()`。\n\n# 第 8 章\n\n## 表单基础\n\nHTML 中的 \"form\"表单）是一个非常重要的元素，用于接收用户的请求或输入。\n\
  \n### 示例 8.1\n```html\n<form name=\"myForm\" method=\"get\" action=\"f.php\"><input\
  \ name=\"txt\" type=\"text\"><input name=\"pwd\" type=\"password\"><input name=\"\
  rd\" type=\"radio\" value=\"val2\"><input name=\"chkb\" type=\"checkbox\" value=\"\
  val3\"><input name=\"sbmt\" type=\"submit\" value=\"Submit\"><input name=\"rst\"\
  \ type=\"reset\" value=\"Cancel\"></form>\n```\n\n### 解析：\n`\"name\"` 表示元素的名称。\n\
  `method=\"get/post\"` 表示通过 `get` 或 `post` 发数据。\n`get` 方法公开发送数据，量较小。\n`post` 方法秘密发送数据，数据量较大。\n\
  `action=f.php` 意味着数据将由 `f.php` 处理。\n`type` 指定元素的类型。\n\n## 表单元素类型\n\n```javascript\n\
  document.formName.elementName.type    // 返回元素类型，例如 text, radio, checkbox…\n```\n\
  \n### 示例 8.2（检查表单元素类型）\n```html\n<html><body><form name=\"myForm\">    1.<input\
  \ type=\"text\" name=\"txt\" /><br>    2.<input type=\"radio\" name=\"rd\" /><br>\
  \    3.<input type=\"checkBox\" name=\"chkb\" /><br>    4.<input type=\"password\"\
  \ name=\"pwd\" /><br>    5.<select name=\"select\"></select><br>    6.<textarea\
  \ name=\"area\"></textarea><br>    7.<input type=\"submit\" name=\"submit\" /><br></form><script\
  \ type=\"text/javascript\">document.write (\"The 1st element is:  \" +document.myForm.txt.type+\"\
  <br>\");            document.write (\"The 2nd element is:  \" +document.myForm.rd.type+\"\
  <br>\");             document.write (\"The 3rd element is:  \" +document.myForm.chkb.type+\"\
  <br>\");document.write (\"The 4th element is:  \" +document.myForm.pwd.type+\"<br>\"\
  );             document.write (\"The 5th element is:  \" +document.myForm.elements[\"\
  select\"].type+\"<br>\");document.write (\"The 6th element is:  \" +document.myForm.elements[\"\
  area\"].type+\"<br>\");document.write (\"The 7th element is:  \" +document.myForm.elements[\"\
  submit\"].type+\"<br>\");</script></body>\n</html>\n```\n\n### 输出：\nThe 1st element\
  \ is: text.\nThe 2nd element is: radio.\nThe 3rd element is: checkbox.\nThe 4th\
  \ element is: password.\nThe 5th element is: select-one.\nThe 6th element is: textarea.\n\
  The 7th element is: submit.\n\n### 解析：\n`\"document.myForm.txt.type\"` 返回表单元素的类型。\n\
  \n## 表单名称\n\n### `document.formName.name`\n### `document.forms[Index].name`\n\n\
  `\"document.formName.name\"` 可以获取表单名称。\n`\"document.forms[Index].name\"` 返回表单名称。\n\
  \n### 示例 8.3\n```html\n<html><head><title>JavaScript Code</title><script type=\"\
  text/javascript\"></script></head><body><form name=\"form0\"></form><form name=\"\
  form1\"></form><script type=\"text/javascript\">document.write (document.form0.name\
  \ + \"<br>\");document.write (document.form1.name + \"<br>\");document.write (document.forms[0].name\
  \ + \"<br>\");// forms[0] means the form0document.write (document.forms[1].name\
  \ + \"<br>\");// forms[1] means the form1</script></body>\n</html\n```\n\n### 输出：\n\
  form0\nform1\nform0\nform1\n\n### 解析：\n`\"document.form0.name\"` 返回 `form0` 的名称。\n\
  `\"document.forms[0].name\"` 返回 `form[0]` 的名称。\n`\"document.form1.name\"` 返回 `form1`\
  \ 的名称。\n`\"document.forms[1].name\"` 返回 `form[1]` 的名称。\n\n## 获取表单 ID\n\n`document.formName.name`\
  \ 获取表单的 ID。设置表单 ID 的语法是：\n\n```html\n<input type=\"text\" id=\"xxx\">\n```\n\n###\
  \ 示例 8.4\n```html\n<form name=\"myForm\"><input type=\"text\" name=\"txt\" /><input\
  \ type=\"password\" name=\"pwd\" /></form>\n```\n\n### 输出：\n（无直接输出）\n\n### 解析：\n\
  `document.formName.name` 获取表单的 ID。\n\n## 显示元素的值\n\n显示元素值的语法是：\n\n```javascript\n\
  document.getElementById(\"id\").value\n```\n\n`document.getElementById(\"id\").value`\
  \ 获取元素的元素值。\n\n### 示例 8.5\n```html\n<button id=\"myButton\"> value=\"\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n```\n\n### 输出：\n（无直接输出）\n\n### 解析：\n`document.getElementById(\"\
  id\").value` 获取元素的值。\n\n## 表单输入数据\n\n向表单输入数据的语法是：\n\n```html\n<input type=\"text\"\
  \ name=\"myText\" id=\"myText\" />\n```\n\n`<input type=\"text\">` 接收用户输入的数据。\n\n\
  ### 示例 8.6\n```html\n<html><body><center><br><br>Please input data, Enter.<br><br><form><input\
  \ type=\"text\" name=\"myText\" id=\"myText\" /><the inputted value will be stored\
  \ to myText ?></form></center><script type=\"text/javascript\">document.getElementById(\"\
  myText\").onchange = function(){alert (\"You inputted: \" + this.value); // \"this.value\"\
  \ represents \"myText.value\"}</script></body></html>\n```\n\n### 输出：\nYou have\
  \ inputted: Hello, friends!\n\n### 解析：\n`<input type=\"text\">` 接收用户输入的数据。\n\n##\
  \ 显示用户输入的内容\n\n显示用户输入内容的语法是：\n\n```javascript\ndocument.formName.elementName.value\n\
  ```\n\n`document.formName.elementName.value` 可以获取或设置指定元素的值。\n\n### 示例 8.7\n```html\n\
  <html><body><form name=\"myForm\"><input type=\"text\" name=\"myText\" value=\"\"\
  \ /><input type=\"submit\" onClick=\"show()\"> <!--onClick event--></form><script\
  \ type=\"text/javascript\">function show(){alert(document.myForm.myText.value );\
  \ // gets the value of data which the user has inputted }</script></body></html>\n\
  ```\n\n### 输出：\nHello, friends!\n\n### 解析：\n`document.myForm.myText.value` 获取用户输入的数据的值。\n\
  \n## 重置方法\n\n重置输入日期的语法是：\n\n```javascript\nreset()\n```\n\n`reset()` 用于清除表单数据。\n\
  \n### 示例 8.8\n```html\n<html><body><br><br><center><form id=\"myform\" ><textarea></textarea><br><br><input\
  \ type=\"button\" onClick=\"myfunction()\" value=\"Clear\" ></form></center><script\
  \ type=\"text/javascript\">function myfunction() {document.getElementById(\"myform\"\
  ).reset();// \"reset( ) clears \"myform\" data}</script></body></html>\n```\n\n\
  ### 输出：\n（表单数据已完全清除。）\n\n\n\n\n\n`onClick=\"myfunction()\"` 在点击按钮时立即执行 `myfunction()`。\n\
  \n`getElementById(\"myform\")` 通过其 id 访问 `myform`。\n\n`reset(()` 清空 `myform` 数据。\n\
  \n## 提交方法 (Submit Method)\n\n提交表单数据的语法为：\n\n### `submit(()`\n\n`submit( )` 用于将表单数据提交到服务器。\n\
  \n示例 8.9\n\n```html\n<html><body><form id=\"myform\"><textarea></textarea><br><br><input\
  \ type=\"button\" onClick=\"myfun()\" value=\"submit\" ></form><script type=\"text/javascript\"\
  >function myfun() {document.getElementById(\"myform\").submit();// \"submit( )\"\
  \ submits \"myform\" data to the server.alert (\"All data have been submitted successfully!\"\
  );}</script></body></html>\n```\n\n输出：\n\n所有数据已提交！\n\n解释：\n\n`onClick=\"myfun()\"\
  ` 在点击提交按钮时立即执行 `myfun()`。\n\n`getElementById(\"myform\")` 通过其 id 访问 `myform`。\n\n\
  `submit( )` 将 `myform` 数据提交到服务器。\n\n## “选择”选择 (Select Selection)\n\n“Select”菜单的语法为：\n\
  \n### `<select id=\"myID \" onchange=\"function ( )\">`\n\n当表单中的“select”值发生变化时，会触发\
  \ `onChange` 事件并立即运行 `function ( )`。\n\n示例 8.10\n\n```html\n<html><head><script\
  \ language=\"javascript\">function myfun(color){alert (\"The flower is  \"+ color);}</script></head><body><form\
  \ id=\"myForm\"><select name=\"flower\" onChange=\"myfun(this.value)\">      <!--\
  \ 选择一个选项时运行函数 \"myfun()\" --><option value=\"Red\">Red</option><option value=\"\
  Yellow\">Yellow</option><option value=\"Green\">Green</option></select></body></html>\n\
  ```\n\n输出：花朵是绿色的。\n\n解释：\n\n`this.value` 代表选项的值。\n\n`<select name=\"flower\" onChange=\"\
  myfun(this.value)\">` 在选择一个选项时运行函数 `myfun()`并将并将 `this value` 传递给 `alert()`。\n\n\
  ## “单选框”选择 (Radio Selection)\n\n“Radio”的语法为：\n\n### `<input type=\"radio\" name=\
  \ \"same\" value= \"myValue\">`\n\n一组单选框按钮允许在任何时间选中一个圆圈并将选中的值提交进行处理。\n\n示例 8.11\
  \ ( 单选框：○ 红 ○ 黄 ○ 绿 )\n\n```html\n<html><body><form name=\"myform\"><input type=\
  \ \"radio\"  name=\"color\" value= \"Red\" onClick= \"myfun(this.value )\"/> Red<input\
  \ type= \"radio\"  name=\"color\" value= \"Yellow\" onClick= \"myfun(this.value\
  \ )\"/> Yellow<input type= \"radio\"  name=\"color\" value= \"Green\" onClick= \"\
  myfun(this.value )\"/> Green<!-- 选择单选时运行时函数 \"myfun()\" --></form><script>function\
  \ myfun( v) {alert ( \"You select:  \" + v );}</script></body></html>\n```\n\n输出：你选择了：红\n\
  \n解释：\n\n`<input type= \"radio\" name=\"color\" value= \"Red\" />` 定义单选框的值为红。三个单选框使用相同的\
  \ name。\n\n`onClick=\" myfun(this.value )\"` 在点击按钮时运行 `myfun()`。\n\n`this.value`\
  \ 代表一个单选框的值。\n\n## “复选框”选择 (CheckBox Selection)\n\n“Checkbox”的语法为：\n\n### `<input\
  \ type=\"checkbox\" id= \"ID value= \"myValue\">`\n\n一组复选框允许在任何时间勾选多个框并将选中的值提交进行处理。\n\
  \n示例 8.12 ( 复选框：□ 红 □ 蓝 □ 粉 )\n\n```html\n<html><body><form name=\"myform\"><input\
  \ type= \"checkbox\"  id=\"color\" value= \"Red\" onClick= \"myfun(this.value )\"\
  /> Red<input type= \"checkbox\"  id=\"color\" value= \"Yellow\" onClick= \"myfun(this.value\
  \ )\"/> Yellow<input type= \"checkbox\"  id=\"color\" value= \"Green\" onClick=\
  \ \"myfun(this.value )\"/> Green<!-- 勾选复选框时运行时函数 \"myfun()\" --></form><script>function\
  \ myfun( v) {alert ( \"You select:  \" + v );}</script></body></html>\n```\n\n输出：你选择了：红\n\
  \n解释：\n\n`<input type= \"checkbox\" id=\"color\" value= \"Red\" >` 定义复选框的值为红。\n\n\
  `onClick=\" myfun(this.value )\"` 在点击复选框时运行 `myfun()`。\n\n`this.value` 代表一个复选框的值。\n\
  \n## 提交表单 (Submit the Form)\n\n“Submit”的语法为：\n\n`\"<input type=\"submit\">` 提交到服务器\n\
  \n示例 8.13\n\n```html\n<html><script language=\"javascript\">function myfun(answer){alert(\"\
  Are you sure to submit?\")}</script><body><form name=\"myForm\"><textarea name=\"\
  message\" rows=\"30\"></input type=\"submit\"><!-- 点击按钮时发送 send() --></form></</body>>\n\
  ```\n\n输出：\n\n提交：\n\n解释：\n\n`<input type=\"submit\">` 将表单数据发送到服务器。\n\n## 创建元素 (CreateElement)\n\
  \n“Submit”的语法为：\n\n`\"input type=\"submit\">` 表单\n\n示例 8.14\n\n```html\n<html><body><script>varLine\
  \ = document.createElement(\"hr\");document.body.appendChild(myLine);</script></body></html>\n\
  ```\n\n输出：\n\n解释：\n\n`document.createElement(\"hr\")` 创建一个元素。\n\n`document.body.appendChild(myLine)`\
  \ 添加元素。\n\n## 创建文本节点 (CreateTextNode)\n\n“Submit”的语法为：\n\n`\"input type=\"submit\"\
  >` 表单\n\n示例 8.15\n\n```html\n<html><body><center><script>var myText = document.createTextNode(\"\
  Hello Dom!\");document.body.appendChild(myText);</script></center></body></html>\n\
  ```\n\n输出：\n\n解释：\n\n`document.createTextNode(\"Hello Dom!\")` 创建一个节点。\n\n`document.body.appendChild(myText)`\
  \ 添加节点。\n\n 设置/获取属性 (set/getAttribute)\n\n“Submit”的语法为：\n\n`\"input type=\"submit\"\
  >` 表单\n\n示例 8.16\n\n```html\n<html><<body><p>Hello Dom!</p><br><script>var text\
  \ = document.getElementsByTagName(\"p\")[0];text.setAttribute(\"align\", \"center\"\
  ); // 设置属性和值 var value = text.getAttribute( \"align\" ); // 获取属性 document.write(\
  \ \"The 'Hello Dom!' is in the \" + value);</script></body>\n</html>\n```\n\n输出：\n\
  \nHello Dom!\n\n'Hello Dom!' 位于中心\n\n解释：\n\n`getElementsByTagName(\"p\")[0]` 代表第一个\
  \ `p` 标签。\n\n`text.setAttribute(\"align\", \"center\")` 设置 `text` 的属性和值。`text` 指向\
  \ \"Hello Dom!\"。\n\n`align` 是属性名，`center` 是属性值。\n\n`text.getAttribute( \"align\"\
  \ )` 返回属性 `align` 的值 `center`。\n\n## 子节点 (hasChildNodes)\n\n检查子节点的语法为：\n\n### `hasChildNodes()`\n\
  \n`hasChildNodes()` 如果指定的节点任何子节点则返回 true，否则返回 false。\n\n示例 8.17\n\n```html\n<html><head><title>Dom</title></head><body><br><br>There\
  \ are three colors:<ul id=\"color\">      <li>Green</li>      <li>Yellow</li>  \
  \    <li>Red</li></ul><script>var sub;sub = document.getElementById(\"color\") .hasChildNodes();\
  \ // 检查 id \"color\" 是否有任何子节点 document.write (\"Color has some child nodes?  \"\
  \ + sub );</script></body>\n</html>\n```\n\n输出：\n\n颜色是否有子节点？  true\n\n\n\n\n\n`hasChildNodes()`\
  \ 检查 id 为 `color` 是否包含任何子节点。因为 `color` 包含三个子节点 \"Green\"、Yellow\" 和 \"Red\"，因此它返回\
  \ `true`。\n\n## 动手项目：清空任何内容\n\n### 表单重置\n\n打开记事本，输入 JavaScript 代码：\n\n```html\n\
