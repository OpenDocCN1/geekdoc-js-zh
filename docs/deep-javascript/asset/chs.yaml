  [](#cb30-21)  } else if ('__NumberData__' in O) {\n[](#cb30-22)    builtinTag =\
  \ 'Number';\n[](#cb30-23)  } else if ('__StringData__' in O) {\n[](#cb30-24)   \
  \ builtinTag = 'String';\n[](#cb30-25)  } else if ('__DateValue__' in O) {\n[](#cb30-26)\
