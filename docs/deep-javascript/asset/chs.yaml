  \n## 1.7 符号与约定\n\n### 1.7.1 什么是类型签名？为什么我在本书中看到静态类型？\n\n例如，您可能会看到：\n\n```\n[](#cb1-1)Number.isFinite(num:\
  \ number): boolean\n```\n\n\n\n\n这被称为 `Number.isFinite()` 的*类型签名*。这种表示法，特别是 `num`\
  \ 的静态类型 `number` 和结果的 `boolean`，并不是真正的 JavaScript。这种表示法借用于编译到 JavaScript 的语言 TypeScript（它基本上就是\
  \ JavaScript 加上静态类型）。\n\n为什么要使用这种表示法？它有助于让你快速了解函数的工作方式。这种表示法在 [一篇 2ality 博客文章](https://2ality.com/2018/04/type-notation-typescript.html)\
  \ 中有详细解释，但通常相对直观。\n\n### 1.7.2 带图标的注释是什么意思？\n\n![](img/file0.svg)  **阅读说明**\n\n\
