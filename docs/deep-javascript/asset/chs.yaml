  '/^abc$/'\n> Object.prototype.toString.call(/^abc$/)\n'[object RegExp]'\n```\n\n\
  ### 2.4.3 `ToPropertyKey()`\n\n`ToPropertyKey()` 被方括号运算符等使用。它的工作方式如下：\n\n```\n[](#cb35-1)function\
