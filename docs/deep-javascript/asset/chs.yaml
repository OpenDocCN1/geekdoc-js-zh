  *   2.6 术语表：与类型转换相关的术语\n\n* * *\n\n在本章中，我们将探讨 JavaScript 中*类型强制转换*的作用。我们将相对深入地研究这个主题，例如，了解\
  \ ECMAScript 规范如何处理强制转换。\n\n## 2.1 什么是类型强制转换？\n\n每个操作（函数、运算符等）都期望其参数具有特定类型。如果某个值的参数类型不正确，例如函数通常有三种常见选择：\n\
  \n1.  函数可以抛出异常：\n\n```\nfunction multiply(x, y) {\n  if (typeof x !== 'number' ||\
  \ typeof y !== 'number') {\n    throw new TypeError();\n  }\n  // ···\n}\n```\n\n\
  2.  函数可以返回错误值：\n\n```\nfunction multiply(x, y) {\n  if (typeof x !== 'number' ||\
  \ typeof y !== 'number') {\n    return NaN;\n  }\n  // ···\n}\n```\n\n3.  函数可以将其参数转换为有用的值：\n\
  \n```\nfunction multiply(x, y) {\n  if (typeof x !== 'number') {\n    x = Number(x);\n\
  \  }\n  if (typeof y !== 'number') {\n    y = Number(y);\n  }\n  // ···\n}\n```\n\
  \n在 (3) 中，操作执行了隐式类型转换。这被称为*类型强制转换*。\n\nJavaScript 最初没有异常，这就是为什么它的大多数操作都使用强制转换和错误值：\n\
  \n```\n// 强制转换\nassert.equal(3 * true, 3);\n\n// 错误值\nassert.equal(1 / 0, Infinity);\n\
  assert.equal(Number('xyz'), NaN);\n```\n\n然而，也存在一些情况（尤其是涉及新特性时），如果参数类型不正确，它会抛出异常：\n\
  \n*   访问 `null` 或 `undefined` 的属性：\n\n    ```\n    > undefined.prop\n    TypeError:\
  \ Cannot read property 'prop' of undefined\n    > null.prop\n    TypeError: Cannot\
  \ read property 'prop' of null\n    > 'prop' in null\n    TypeError: Cannot use\
  \ 'in' operator to search for 'prop' in null\n    ```\n\n*   使用符号：\n\n    ```\n\
  \    > 6 / Symbol()\n    TypeError: Cannot convert a Symbol value to a number\n\
  \    ```\n\n*   混合 bigint 和 number：\n\n    ```\n    > 6 / 3n\n    TypeError: Cannot\
  \ mix BigInt and other types\n    ```\n\n*   对不支持该操作的值进行 new 调用或函数调用：\n\n    ```\n\
  \    > 123()\n    TypeError: 123 is not a function\n    > (class {})()\n    TypeError:\
  \ Class constructor  cannot be invoked without 'new'\n\n    > new 123\n    TypeError:\
  \ 123 is not a constructor\n    > new (() => {})\n    TypeError: (intermediate value)\
  \ is not a constructor\n    ```\n\n*   更改只读属性（仅在严格模式下抛出）：\n\n    ```\n    > 'abc'.length\
  \ = 1\n    TypeError: Cannot assign to read only property 'length'\n    > Object.freeze({prop:3}).prop\
  \ = 1\n    TypeError: Cannot assign to read only property 'prop'\n    ```\n\n###\
  \ 2.1.1 处理类型强制转换\n\n处理强制转换的两种常见方式是：\n\n*   调用者可以显式转换值，使其具有正确的类型。例如，在以下交互中，我们想要将两个编码为字符串的数字相乘：\n\
  \n    ```\n    let x = '3';\n    let y = '2';\n    assert.equal(Number(x) * Number(y),\
  \ 6);\n    ```\n\n*   调用者可以让操作自行进行转换：\n\n    ```\n    let x = '3';\n    let y =\
  \ '2';\n    assert.equal(x * y, 6);\n    ```\n\n我通常更喜欢前者，因为它明确了我的意图：我期望 `x` 和 `y`\
  \ 不是数字，但想要将两个数字相乘。\n\n## 2.2 ECMAScript 规范中帮助实现强制转换的操作\n\n以下各节描述了 ECMAScript 规范用于将实际参数转换为预期类型的最重要的内部函数。\n\
  \n例如，在 TypeScript 中，我们会这样写：\n\n```\nfunction isNaN(number: number) {\n  // ···\n\
  }\n```\n\n在规范中，这看起来[如下所示](https://tc39.es/ecma262/#sec-multiplicative-operators-runtime-semantics-evaluation)（翻译成\
  \ JavaScript，以便更容易理解）：\n\n```\nfunction isNaN(number) {\n  let num = ToNumber(number);\n\
  \  // ···\n}\n```\n\n### 2.2.1 转换为原始类型和对象\n\n每当期望原始类型或对象时，会使用以下转换函数：\n\n*   `ToBoolean()`\n\
  \n*   `ToNumber()`\n\n*   `ToBigInt()`\n\n*   `ToString()`\n\n*   `ToObject()`\n\
  \n这些内部函数在 JavaScript 中有非常相似的对应物：\n\n```\n> Boolean(0)\nfalse\n> Boolean(1)\ntrue\n\
  \n> Number('123')\n123\n```\n\n\n\n\n在引入 bigint（与 number 并存）之后，规范中之前使用 `ToNumber()`\
  \ 的地方现在经常使用 `ToNumeric()`。请继续阅读以了解更多信息。\n\n### 2.2.2 转换为数值类型\n\n目前，JavaScript 有[两种内置数值类型](https://tc39.es/ecma262/#sec-numeric-types)：number\
  \ 和 bigint。\n\n*   `ToNumeric()` 返回一个数值 `num`。它的调用者通常调用 `num` 的规范类型的方法 `mthd`：\n\
  \n    ```\n    Type(num)::mthd(···)\n    ```\n\n    以下操作使用了 `ToNumeric`：\n\n   \
  \ *   前缀和后缀 `++` 运算符\n    *   `*` 运算符\n\n*   `ToInteger(x)` 用于需要不带小数的数字时。结果的范围之后通常会进一步限制。\n\
  \n    *   它调用 `ToNumber(x)` 并移除小数部分（类似于 `Math.trunc()`）。\n    *   使用 `ToInteger()`\
  \ 的操作：\n\n        *   `Number.prototype.toString(radix?)`\n        *   `String.prototype.codePointAt(pos)`\n\
  \        *   `Array.prototype.slice(start, end)`\n        *   等等。\n\n*   `ToInt32()`、`ToUint32()`\
  \ 将数字强制转换为 32 位整数，并由位运算符使用（见表 1）。\n\n    *   `ToInt32()`：有符号，范围 [−2³¹, 2³¹−1]（包含边界）\n\
  \    *   `ToUint32()`：无符号（因此有 `U`），范围 [0, 2³²−1]（包含边界）\n\n表 1：位数值运算符操作数的强制转换（`BigInt`\
  \ 运算符不限制位数）。\n\n| 运算符 | 左操作数 | 右操作数 | 结果类型 |\n| --- | --- | --- | --- |\n| `<<`\
  \ | `ToInt32()` | `ToUint32()` | `Int32` |\n| 有符号 `>>` | `ToInt32()` | `ToUint32()`\
  \ | `Int32` |\n| 无符号 `>>>` | `ToInt32()` | `ToUint32()` | `Uint32` |\n| `&`、`^`、`&#124;`\
  \ | `ToInt32()` | `ToUint32()` | `Int32` |\n| `~` | — | `ToInt32()` | `Int32` |\n\
  \n### 2.2.3 转换为属性键\n\n`ToPropertyKey()` 返回一个字符串或符号，并由以下操作使用：\n\n*   方括号运算符 `[]`\n\
  *   对象字面量中的计算属性键\n*   `in` 运算符的左侧\n*   `Object.defineProperty(_, P, _)`\n*   `Object.fromEntries()`\n\
  *   `Object.getOwnPropertyDescriptor()`\n*   `Object.prototype.hasOwnProperty()`\n\
  *   `Object.prototype.propertyIsEnumerable()`\n*   `Reflect` 的若干方法\n\n### 2.2.4 转换为数组索引\n\
  \n*   `ToLength()`（直接）主要用于字符串索引。\n\n    *   `ToIndex()` 的辅助函数\n    *   结果 `l` 的范围：0\
  \ ≤ `l` ≤ 2⁵³−1\n\n*   `ToIndex()` 用于类型化数组索引。\n\n    *   与 `ToLength()` 的主要区别：如果参数超出范围则抛出异常。\n\
  \    *   结果 `i` 的范围：0 ≤ `i` ≤ 2⁵³−1\n\n*   `ToUint32()` 用于数组索引。\n\n    *   结果 `i`\
  \ 的范围：0 ≤ `i` < 2³²−1（上限不包含，以便为 `.length` 留出空间）\n\n### 2.2.5 转换为类型化数组元素\n\n当我们设置类型化数组元素的值时，会使用以下转换函数之一：\n\
  \n*   `ToInt8()`\n*   `ToUint8()`\n*   `ToUint8Clamp()`\n*   `ToInt16()`\n*   `ToUint16()`\n\
  *   `ToInt32()`\n*   `ToUint32()`\n*   `ToBigInt64()`\n*   `ToBigUint64()`\n\n##\
  \ 2.3 插曲：用 JavaScript 表达规范算法\n\n在本章的剩余部分，我们将遇到几个规范算法，但“实现”为 JavaScript。以下列表展示了一些常用模式如何从规范翻译为\
  \ JavaScript：\n\n*   规范：如果 `Type(value)` 是 String\n\n    JavaScript：`if (TypeOf(value)\
  \ === 'string')`\n\n    （非常宽松的翻译；`TypeOf()` 定义如下）\n\n*   规范：如果 `IsCallable(method)`\
  \ 为 true\n\n    JavaScript：`if (IsCallable(method))`\n\n    （`IsCallable()` 定义如下）\n\
  \n*   规范：令 `numValue` 为 `ToNumber(value)`\n\n    JavaScript：`let numValue = Number(value)`\n\
  \n*   规范：令 `isArray` 为 `IsArray(O)`\n\n    JavaScript：`let isArray = Array.isArray(O)`\n\
  \n*   规范：如果 O 有一个 `[[NumberData]]` 内部槽\n\n    JavaScript：`if ('__NumberData__' in\
  \ O)`\n\n*   规范：令 `tag` 为 `Get(O, @@toStringTag)`\n\n    JavaScript：`let tag = O[Symbol.toStringTag]`\n\
  \n*   规范：返回字符串拼接 \"[object \", tag, 和 \"]\"\n\n    JavaScript：`return '[object '\
  \ + tag + ']';`\n\n使用 `let`（而不是 `const`）以匹配规范的语言。\n\n某些内容被省略了——例如，[ReturnIfAbrupt\
  \ 简写](https://tc39.es/ecma262/#sec-returnifabrupt-shorthands) `?` 和 `!`。\n\n```\n\
  [](#cb17-1)/**\n[](#cb17-2) * typeof 的改进版本\n[](#cb17-3) */\n[](#cb17-4)function\
  \ TypeOf(value) {\n[](#cb17-5)  const result = typeof value;\n[](#cb17-6)  switch\
  \ (result) {\n[](#cb17-7)    case 'function':\n[](#cb17-8)      return 'object';\n\
  [](#cb17-9)    case 'object':\n[](#cb17-10)      if (value === null) {\n[](#cb17-11)\
  \        return 'null';\n[](#cb17-12)      } else {\n[](#cb17-13)        return\
  \ 'object';\n[](#cb17-14)      }\n[](#cb17-15)    default:\n[](#cb17-16)      return\
  \ result;\n[](#cb17-17)  }\n[](#cb17-18)}\n[](#cb17-19)\n[](#cb17-20)function IsCallable(x)\
  \ {\n[](#cb17-21)  return typeof x === 'function';\n[](#cb17-22)}\n```\n\n## 2.4 示例强制转换算法\n\
  \n### 2.4.1 `ToPrimitive()`\n\n[操作 `ToPrimitive()`](https://tc39.es/ecma262/#sec-toprimitive)\
  \ 是许多强制转换算法的中间步骤（我们将在本章后面看到其中一些）。它将任意值转换为原始值。\n\n`ToPrimitive()` 在规范中经常使用，因为大多数运算符只能处理原始值。例如，我们可以使用加法运算符（`+`）来加数字和拼接字符串，但不能用它来拼接数组。\n\
  \n以下是 `ToPrimitive()` 的 JavaScript 版本：\n\n```\n[](#cb18-1)/**\n[](#cb18-2) * @param\
  \  hint 结果的首选类型：\n[](#cb18-3) *             string、number 或不关心？\n[](#cb18-4) */\n\
  [](#cb18-5)function ToPrimitive(input: any,\n[](#cb18-6)  hint: 'string'|'number'|'default'\
  \ = 'default') {\n[](#cb18-7)    if (TypeOf(input) === 'object') {\n[](#cb18-8)\
  \      let exoticToPrim = input[Symbol.toPrimitive]; // (A)\n[](#cb18-9)      if\
  \ (exoticToPrim !== undefined) {\n[](#cb18-10)        let result = exoticToPrim.call(input,\
  \ hint);\n[](#cb18-11)        if (TypeOf(result) !== 'object') {\n[](#cb18-12) \
  \         return result;\n[](#cb18-13)        }\n[](#cb18-14)        throw new TypeError();\n\
  [](#cb18-15)      }\n[](#cb18-16)      if (hint === 'default') {\n[](#cb18-17) \
  \       hint = 'number';\n[](#cb18-18)      }\n[](#cb18-19)      return OrdinaryToPrimitive(input,\
  \ hint);\n[](#cb18-20)    } else {\n[](#cb18-21)      // input 已经是原始值\n[](#cb18-22)\
  \      return input;\n[](#cb18-23)    }\n[](#cb18-24)  }\n```\n\n`ToPrimitive()`\
  \ 允许对象通过 `Symbol.toPrimitive`（第 A 行）覆盖到原始值的转换。如果对象没有这样做，则将其传递给 `OrdinaryToPrimitive()`：\n\
  \n```\n[](#cb19-1)function OrdinaryToPrimitive(O: object, hint: 'string' | 'number')\
  \ {\n[](#cb19-2)  let methodNames;\n[](#cb19-3)  if (hint === 'string') {\n[](#cb19-4)\
  \    methodNames = ['toString', 'valueOf'];\n[](#cb19-5)  } else {\n[](#cb19-6)\
  \    methodNames = ['valueOf', 'toString'];\n[](#cb19-7)  }\n[](#cb19-8)  for (let\
  \ name of methodNames) {\n[](#cb19-9)    let method = O[name];\n[](#cb19-10)   \
  \ if (IsCallable(method)) {\n[](#cb19-11)      let result = method.call(O);\n[](#cb19-12)\
  \      if (TypeOf(result) !== 'object') {\n[](#cb19-13)        return result;\n\
  [](#cb19-14)      }\n[](#cb19-15)    }\n[](#cb19-16)  }\n[](#cb19-17)  throw new\
  \ TypeError();\n[](#cb19-18)}\n```\n\n#### 2.4.1.1 `ToPrimitive()` 的调用者使用哪些提示？\n\
  \n参数 `hint` 可以取三个值之一：\n\n*   `'number'` 表示：如果可能，`input` 应转换为数字。\n*   `'string'`\
  \ 表示：如果可能，`input` 应转换为字符串。\n*   `'default'` 表示：对数字或字符串没有偏好。\n\n以下是一些示例，展示各种操作如何使用\
  \ `ToPrimitive()`：\n\n\n\n\n\n*   `hint === 'number'`。以下操作优先使用数字：\n    *   `ToNumeric()`\n\
  \    *   `ToNumber()`\n    *   `ToBigInt()`、`BigInt()`\n    *   抽象关系比较（`<`）\n* \
  \  `hint === 'string'`。以下操作优先使用字符串：\n    *   `ToString()`\n    *   `ToPropertyKey()`\n\
  *   `hint === 'default'`。以下操作对返回的原始值类型保持中立：\n    *   抽象相等比较（`==`）\n    *   加法运算符（`+`）\n\
  \    *   `new Date(value)`（`value` 可以是数字或字符串）\n\n如我们所见，默认行为是将 `'default'` 当作 `'number'`\
  \ 处理。只有 `Symbol` 和 `Date` 的实例会覆盖此行为（稍后展示）。\n\n#### 2.4.1.2 将对象转换为原始值时调用哪些方法？\n\n\
  如果通过 `Symbol.toPrimitive` 未覆盖转换为原始值的行为，则 `OrdinaryToPrimitive()` 会调用以下两个方法中的一个或两个：\n\
  \n*   如果 `hint` 表示我们希望原始值为字符串，则首先调用 `'toString'`。\n*   如果 `hint` 表示我们希望原始值为数字，则首先调用\
  \ `'valueOf'`。\n\n以下代码演示了其工作原理：\n\n```\nconst obj = {\n  toString() { return 'a'\
  \ },\n  valueOf() { return 1 },\n};\n\n// String() 优先使用字符串：\nassert.equal(String(obj),\
  \ 'a');\n\n// Number() 优先使用数字：\nassert.equal(Number(obj), 1);\n```\n\n属性键为 `Symbol.toPrimitive`\
  \ 的方法会覆盖正常的转换为原始值的过程。在标准库中，这种情况只出现了两次：\n\n*   `Symbol.prototypeSymbol.toPrimitive`\n\
  \    *   如果接收者是 `Symbol` 的实例，此方法始终返回包装后的符号。\n    *   其原理是：`Symbol` 的实例有一个返回字符串的\
  \ `.toString()` 方法。但即使 `hint` 是 `'string'`，也不应调用 `.toString()`，以免意外将 `Symbol` 实例转换为字符串（字符串是完全不同种类的属性键）。\n\
  *   `Date.prototypeSymbol.toPrimitive`\n    *   接下来将详细解释。\n\n#### 2.4.1.3 `Date.prototype[Symbol.toPrimitive]()`\n\
  \n以下是 Date 处理转换为原始值的方式：\n\n```\nDate.prototype[Symbol.toPrimitive] = function (\n\
  \  hint: 'default' | 'string' | 'number') {\n    let O = this;\n    if (TypeOf(O)\
  \ !== 'object') {\n      throw new TypeError();\n    }\n    let tryFirst;\n    if\
  \ (hint === 'string' || hint === 'default') {\n      tryFirst = 'string';\n    }\
  \ else if (hint === 'number') {\n      tryFirst = 'number';\n    } else {\n    \
  \  throw new TypeError();\n    }\n    return OrdinaryToPrimitive(O, tryFirst);\n\
  \  };\n```\n\n与默认算法的唯一区别在于，`'default'` 被当作 `'string'`（而不是 `'number'`）。如果我们使用将 `hint`\
  \ 设置为 `'default'` 的操作，可以观察到这一点：\n\n*    `==` 运算符 在另一个操作数是除 `undefined`、`null` 和\
  \ `boolean` 之外的原始值时，会将对象强制转换为原始值（使用默认 hint）。在以下交互中，我们可以看到强制转换日期对象的结果是一个字符串：\n\n\
  \    ```\n    const d = new Date('2222-03-27');\n    assert.equal(\n      d == 'Wed\
  \ Mar 27 2222 01:00:00 GMT+0100'\n           + ' (Central European Standard Time)',\n\
  \      true);\n    ```\n\n*    `+` 运算符 将两个操作数都强制转换为原始值（使用默认 hint）。如果其中一个结果是字符串，则执行字符串拼接（否则执行数字加法）。在以下交互中，我们可以看到强制转换日期对象的结果是一个字符串，因为运算符返回了字符串。\n\
  \n    ```\n    const d = new Date('2222-03-27');\n    assert.equal(\n      123 +\
  \ d,\n      '123Wed Mar 27 2222 01:00:00 GMT+0100'\n        + ' (Central European\
  \ Standard Time)');\n    ```\n\n### 2.4.2 `ToString()` 及相关操作\n\n这是 `ToString()`\
  \ 的 JavaScript 版本：\n\n```\nfunction ToString(argument) {\n  if (argument === undefined)\
  \ {\n    return 'undefined';\n  } else if (argument === null) {\n    return 'null';\n\
  \  } else if (argument === true) {\n    return 'true';\n  } else if (argument ===\
  \ false) {\n    return 'false';\n  } else if (TypeOf(argument) === 'number') {\n\
  \    return Number.toString(argument);\n  } else if (TypeOf(argument) === 'string')\
  \ {\n    return argument;\n  } else if (TypeOf(argument) === 'symbol') {\n    throw\
  \ new TypeError();\n  } else if (TypeOf(argument) === 'bigint') {\n    return BigInt.toString(argument);\n\
  \  } else {\n    // argument 是一个对象\n    let primValue = ToPrimitive(argument, 'string');\
  \ // (A)\n    return ToString(primValue);\n  }\n}\n```\n\n注意，该函数对于对象，在将原始结果转换为字符串之前，会使用\
  \ `ToPrimitive()` 作为中间步骤（第 A 行）。\n\n`ToString()` 与 `String()` 的工作方式有一个有趣的差异：如果 `argument`\
  \ 是一个符号，前者会抛出 `TypeError`，而后者不会。这是为什么？符号的默认行为是，将其转换为字符串会抛出异常：\n\n```\n> const sym\
  \ = Symbol('sym');\n\n> ''+sym\nTypeError: Cannot convert a Symbol value to a string\n\
  > `${sym}`\nTypeError: Cannot convert a Symbol value to a string\n```\n\n在 `String()`\
  \ 和 `Symbol.prototype.toString()` 中覆盖了该默认行为（两者将在下一小节中描述）：\n\n```\n> String(sym)\n\
  'Symbol(sym)'\n> sym.toString()\n'Symbol(sym)'\n```\n\n#### 2.4.2.1 `String()`\n\
  \n```\nfunction String(value) {\n  let s;\n  if (value === undefined) {\n    s =\
  \ '';\n  } else {\n    if (new.target === undefined && TypeOf(value) === 'symbol')\
  \ {\n      // 此函数被作为函数调用，且 value 是一个符号\n      return SymbolDescriptiveString(value);\n\
  \    }\n    s = ToString(value);\n  }\n  if (new.target === undefined) {\n    //\
  \ 此函数被作为函数调用\n    return s;\n  }\n  // 此函数被通过 new 调用\n  return StringCreate(s, new.target.prototype);\
  \ // 简化版！\n}\n```\n\n`String()` 的工作方式取决于它是通过函数调用还是通过 `new` 调用的。它使用 [`new.target`](https://exploringjs.com/es6/ch_classes.html#sec_allocating-and-initializing-instances)\
  \ 来区分这两种情况。\n\n以下是辅助函数 `StringCreate()` 和 `SymbolDescriptiveString()`：\n\n```\n\
  /** \n * 创建一个包装了 `value` 的 String 实例，\n * 并具有给定的原型。\n */\nfunction StringCreate(value,\
  \ prototype) {\n  // ···\n}\n\nfunction SymbolDescriptiveString(sym) {\n  assert.equal(TypeOf(sym),\
  \ 'symbol');\n  let desc = sym.description;\n  if (desc === undefined) {\n    desc\
  \ = '';\n  }\n  assert.equal(TypeOf(desc), 'string');\n  return 'Symbol('+desc+')';\n\
  }\n```\n\n#### 2.4.2.2 `Symbol.prototype.toString()`\n\n除了 `String()`，我们还可以使用方法\
  \ `.toString()` 将符号转换为字符串。其规范如下所示。\n\n\n\n\n\n```\n[](#cb29-1)Symbol.prototype.toString\
  \ = function () {\n[](#cb29-2)  let sym = thisSymbolValue(this);\n[](#cb29-3)  return\
  \ SymbolDescriptiveString(sym);\n[](#cb29-4)};\n[](#cb29-5)function thisSymbolValue(value)\
  \ {\n[](#cb29-6)  if (TypeOf(value) === 'symbol') {\n[](#cb29-7)    return value;\n\
  [](#cb29-8)  }\n[](#cb29-9)  if (TypeOf(value) === 'object' && '__SymbolData__'\
  \ in value) {\n[](#cb29-10)    let s = value.__SymbolData__;\n[](#cb29-11)    assert.equal(TypeOf(s),\
  \ 'symbol');\n[](#cb29-12)    return s;\n[](#cb29-13)  }\n[](#cb29-14)}\n```\n\n\
  #### 2.4.2.3 `Object.prototype.toString`\n\n`.toString()` 的默认规范如下：\n\n```\n[](#cb30-1)Object.prototype.toString\
