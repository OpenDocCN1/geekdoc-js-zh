    \ {name: 'Jane', work: {employer: 'Acme'}});\n```\n\n# 8 共享可变状态的问题及如何避免\n\n* *\
    \ *\n\n*   8.1 什么是共享可变状态，为什么它有问题？\n\n*   8.2 通过复制数据避免共享\n\n    *   8.2.1 复制如何帮助解决共享可变状态？\n\
    \n*   8.3 通过非破坏性更新避免修改\n\n    *   8.3.1 非破坏性更新如何帮助解决共享可变状态？\n\n*   8.4 通过使数据不可变来防止修改\n\
    \n    *   8.4.1 不可变性如何帮助解决共享可变状态？\n\n*   8.5 用于避免共享可变状态的库\n\n    *   8.5.1 Immutable.js\n\
    \n    *   8.5.2 Immer\n\n* * *\n\n本章回答以下问题：\n\n*   什么是共享可变状态？\n\n*   为什么它有问题？\n\
    \n*   如何避免其问题？\n\n## 8.1 什么是共享可变状态，为什么它有问题？\n\n共享可变状态的工作原理如下：\n\n*   如果两个或多个参与者可以更改相同的数据（变量、对象等）。\n\
    \n*   并且它们的生命周期重叠。\n\n*   那么一个参与者的修改可能会阻止其他参与者正常工作。\n\n请注意，这个定义适用于函数调用、协作式多任务（例如\
    \ JavaScript 中的异步函数）等。每种情况下的风险类似。\n\n以下代码是一个示例。该示例并不真实，但它展示了风险且易于理解：\n\n```\n\
    [](#cb143-1)function logElements(arr) {\n[](#cb143-2)  while (arr.length > 0)\
    \ {\n[](#cb143-3)    console.log(arr.shift());\n[](#cb143-4)  }\n[](#cb143-5)}\n\
    [](#cb143-6)\n[](#cb143-7)function main() {\n[](#cb143-8)  const arr = ['banana',\
    \ 'orange', 'apple'];\n[](#cb143-9)\n[](#cb143-10)  console.log('Before sorting:');\n\
    [](#cb143-11)  logElements(arr);\n[](#cb143-12)\n[](#cb143-13)  arr.sort(); //\
    \ changes arr\n[](#cb143-14)\n[](#cb143-15)  console.log('After sorting:');\n\
    [](#cb143-16)  logElements(arr); // (A)\n[](#cb143-17)}\n[](#cb143-18)main();\n\
    [](#cb143-19)\n[](#cb143-20)// Output:\n[](#cb143-21)// 'Before sorting:'\n[](#cb143-22)//\
    \ 'banana'\n[](#cb143-23)// 'orange'\n[](#cb143-24)// 'apple'\n[](#cb143-25)//\
    \ 'After sorting:'\n```\n\n在这个例子中，有两个独立的参与者：\n\n*   函数 `main()` 希望在排序前后记录一个数组。\n\
    \n*   函数 `logElements()` 记录其参数 `arr` 的元素，但在记录时将其移除。\n\n`logElements()` 破坏了 `main()`，导致它在第\
    \ A 行记录了一个空数组。\n\n在本章的剩余部分，我们将探讨三种避免共享可变状态问题的方法：\n\n*   通过复制数据避免共享\n\n*   通过非破坏性更新避免修改\n\
    \n*   通过使数据不可变来防止修改\n\n特别是，我们将回到刚刚看到的示例并修复它。\n\n## 8.2 通过复制数据避免共享\n\n复制数据是避免共享的一种方式。\n\
    \n![](img/file0.svg)  **背景**\n\n关于在 JavaScript 中复制数据的背景知识，请参阅本书的以下两章：\n\n*   §6\
    \ “复制对象和数组”\n\n*   §14 “复制类的实例：`.clone()` 与复制构造函数”\n\n### 8.2.1 复制如何帮助解决共享可变状态？\n\
    \n只要我们只*读取*共享状态，就不会有任何问题。在*修改*它之前，我们需要通过复制（根据需要尽可能深）来“取消共享”。\n\n*防御性复制*是一种在可能出现问题的地方始终进行复制的技术。其目标是保护当前实体（函数、类等）的安全：\n\
    \n*   输入：复制传递给我们的（可能）共享数据，使我们能够使用这些数据而不受外部实体的干扰。\n\n*   输出：在将内部数据暴露给外部方之前复制它，意味着该方无法破坏我们的内部活动。\n\
    \n请注意，这些措施保护我们免受其他方的侵害，同时也保护其他方免受我们的侵害。\n\n接下来的部分将说明两种防御性复制。\n\n#### 8.2.1.1 复制共享输入\n\
    \n回想一下本章开头的激励示例，我们遇到麻烦是因为 `logElements()` 修改了其参数 `arr`：\n\n```\n[](#cb144-1)function\
    \ logElements(arr) {\n[](#cb144-2)  while (arr.length > 0) {\n[](#cb144-3)   \
    \ console.log(arr.shift());\n[](#cb144-4)  }\n[](#cb144-5)}\n```\n\n让我们向这个函数添加防御性复制：\n\
    \n```\n[](#cb145-1)function logElements(arr) {\n[](#cb145-2)  arr = [...arr];\
    \ // defensive copy\n[](#cb145-3)  while (arr.length > 0) {\n[](#cb145-4)    console.log(arr.shift());\n\
    [](#cb145-5)  }\n[](#cb145-6)}\n```\n\n现在，如果在 `main()` 内部调用 `logElements()`，它不会再引起问题：\n\
    \n```\n[](#cb146-1)function main() {\n[](#cb146-2)  const arr = ['banana', 'orange',\
    \ 'apple'];\n[](#cb146-3)\n[](#cb146-4)  console.log('Before sorting:');\n[](#cb146-5)\
    \  logElements(arr);\n[](#cb146-6)\n[](#cb146-7)  arr.sort(); // changes arr\n\
    [](#cb146-8)\n[](#cb146-9)  console.log('After sorting:');\n[](#cb146-10)  logElements(arr);\
    \ // (A)\n[](#cb146-11)}\n[](#cb146-12)main();\n[](#cb146-13)\n[](#cb146-14)//\
    \ Output:\n[](#cb146-15)// 'Before sorting:'\n[](#cb146-16)// 'banana'\n[](#cb146-17)//\
    \ 'orange'\n[](#cb146-18)// 'apple'\n[](#cb146-19)// 'After sorting:'\n[](#cb146-20)//\
    \ 'apple'\n[](#cb146-21)// 'banana'\n[](#cb146-22)// 'orange'\n```\n\n#### 8.2.1.2 复制暴露的内部数据\n\
    \n让我们从一个类 `StringBuilder` 开始，它没有复制暴露的内部数据（第 A 行）：\n\n"
- fmt: "\n```java\nclass StringBuilder {\n  _data = [];\n  add(str) {\n    this._data.push(str);\n\
    \  }\n  getParts() {\n    // We expose internals without copying them:\n    return\
    \ this._data; // (A)\n  }\n  toString() {\n    return this._data.join('');\n \
    \ }\n}\n```\n\nAs long as `.getParts()` isn’t used, everything works well:\n\n\
    ```java\nconst sb1 = new StringBuilder();\nsb1.add('Hello');\nsb1.add(' world!');\n\
    assert.equal(sb1.toString(), 'Hello world!');\n```\n\nIf, however, the result\
    \ of `.getParts()` is changed (line A), then the `StringBuilder` ceases to work\
    \ correctly:\n\n```java\nconst sb2 = new StringBuilder();\nsb2.add('Hello');\n\
    sb2.add(' world!');\nsb2.getParts().length = 0; // (A)\nassert.equal(sb2.toString(),\
    \ ''); // not OK\n```\n\nThe solution is to copy the internal `._data` defensively\
    \ before it is exposed (line A):\n\n```java\nclass StringBuilder {\n  this._data\
    \ = [];\n  add(str) {\n    this._data.push(str);\n  }\n  getParts() {\n    //\
    \ Copy defensively\n    return [...this._data]; // (A)\n  }\n  toString() {\n\
    \    return this._data.join('');\n  }\n}\n```\n\nNow changing the result of `.getParts()`\
    \ doesn’t interfere with the operation of `sb` anymore:\n\n```java\nconst sb =\
    \ new StringBuilder();\nsb.add('Hello');\nsb.add(' world!');\nsb.getParts().length\
    \ = 0;\nassert.equal(sb.toString(), 'Hello world!'); // OK\n```\n\n## 8.3 Avoiding\
    \ mutations by updating non-destructively\n\nWe can avoid mutations if we only\
    \ update data non-destructively.\n\n![](media/file0.svg)  **Background**\n\nFor\
    \ more information on updating data, see [§7 “Updating data destructively and\
    \ non-destructively”](#ch008.xhtml_ch_updating-destructively-and-nondestructively).\n\
    \n### 8.3.1 How does non-destructive updating help with shared mutable state?\n\
    \nWith non-destructive updating, sharing data becomes unproblematic, because we\
    \ never mutate the shared data. (This only works if everyone that accesses the\
    \ data does that!)\n\nIntriguingly, copying data becomes trivially simple:\n\n\
    ```java\nconst original = {city: 'Berlin', country: 'Germany'};\nconst copy =\
    \ original;\n```\n\nThis works, because we are only making non-destructive changes\
    \ and are therefore copying the data on demand.\n\n## 8.4 Preventing mutations\
    \ by making data immutable\n\nWe can prevent mutations of shared data by making\
    \ that data immutable.\n\n![](media/file0.svg)  **Background**\n\nFor background\
    \ on how to make data immutable in JavaScript, please refer to the following two\
    \ chapters in this book:\n\n*   [§10 “Protecting objects from being changed”](#ch011.xhtml_ch_protecting-objects)\n\
    *   [§15 “Immutable wrappers for collections”](#ch016.xhtml_ch_immutable-collection-wrappers)\n\
    \n### 8.4.1 How does immutability help with shared mutable state?\n\nIf data is\
    \ immutable, it can be shared without any risks. In particular, there is no need\
    \ to copy defensively.\n\n![](media/file2.svg)  **Non-destructive updating is\
    \ an important complement to immutable data**\n\nIf we combine the two, immutable\
    \ data becomes virtually as versatile as mutable data but without the associated\
    \ risks.\n\n## 8.5 Libraries for avoiding shared mutable state\n\nThere are several\
    \ libraries available for JavaScript that support immutable data with non-destructive\
    \ updating. Two popular ones are:\n\n*   [Immutable.js](https://github.com/immutable-js/immutable-js)\
    \ provides immutable data structures for lists, stacks, sets, maps, etc.\n*  \
    \ [Immer](https://immerjs.github.io/immer/) also supports immutability and non-destructive\
    \ updating but for plain objects, Arrays, Sets, and Maps. That is, no new data\
    \ structures are needed.\n\nThese libraries are described in more detail in the\
    \ next two sections.\n\n### 8.5.1 Immutable.js\n\nIn its repository, [the library\
    \ Immutable.js](https://github.com/immutable-js/immutable-js) is described as:\n\
    \n> Immutable persistent data collections for JavaScript which increase efficiency\
    \ and simplicity.\n\nImmutable.js provides immutable data structures such as:\n\
    \n*   `List`\n*   `Stack`\n*   `Set` (which is different from JavaScript’s built-in\
    \ `Set`)\n*   `Map` (which is different from JavaScript’s built-in `Map`)\n* \
    \  Etc.\n\nIn the following example, we use an immutable `Map`:\n\n```java\nimport\
    \ {Map} from 'immutable/dist/immutable.es.js';\nconst map0 = Map([\n  [false,\
    \ 'no'],\n  [true, 'yes'],\n]);\n\n// We create a modified version of map0:\n\
    const map1 = map0.set(true, 'maybe');\n\n// The modified version is different\
    \ from the original:\nassert.ok(map1 !== map0);\nassert.equal(map1.equals(map0),\
    \ false); // (A)\n\n// We undo the change we just made:\nconst map2 = map1.set(true,\
    \ 'yes');\n\n// map2 is a different object than map0,\n// but it has the same\
    \ content\nassert.ok(map2 !== map0);\nassert.equal(map2.equals(map0), true); //\
    \ (B)\n```\n\nNotes:\n\n*   Instead of modifying the receiver, “destructive” operations\
    \ such as `.set()` return modified copies.\n*   To check if two data structures\
    \ have the same content, we use the built-in `.equals()` method (line A and line\
    \ B).\n\n### 8.5.2 Immer\n\nIn its repository, [the library Immer](https://immerjs.github.io/immer/)\
    \ is described as:\n\n> Create the next immutable state by mutating the current\
    \ one.\n\nImmer helps with non-destructively updating (potentially nested) plain\
    \ objects, Arrays, Sets, and Maps. That is, there are no custom data structures\
    \ involved.\n\nThis is what using Immer looks like:\n\n```java\nimport {produce}\
    \ from 'immer/dist/immer.module.js';\n\nconst people = [\n  {name: 'Jane', work:\
    \ {employer: 'Acme'}},\n];\n\nconst modifiedPeople = produce(people, (draft) =>\
    \ {\n  draft[0].work.employer = 'Cyberdyne';\n  draft.push({name: 'John', work:\
    \ {employer: 'Spectre'}});\n});\n\nassert.deepEqual(modifiedPeople, [\n  {name:\
    \ 'Jane', work: {employer: 'Cyberdyne'}},\n  {name: 'John', work: {employer: 'Spectre'}},\n\
    ]);\nassert.deepEqual(people, [\n  {name: 'Jane', work: {employer: 'Acme'}},\n\
    ]);\n```\n\nThe original data is stored in `people`. `produce()` provides us with\
    \ a variable `draft`. We pretend that this variable is `people` and use operations\
    \ with which we would normally make destructive changes. Immer intercepts these\
    \ operations. Instead of mutating `draft`, it non-destructively changes `people`.\
    \ The result is referenced by `modifiedPeople`. As a bonus, it is deeply immutable.\n\
    \n`assert.deepEqual()` works because Immer returns plain objects and Arrays.\n\
