    \n* * *\n\nIn this chapter, we look at the names of functions:\n\n*   All functions\
    \ have the property `.name`\n*   This property is useful for debugging (its value\
    \ shows up in stack traces) and some metaprogramming tasks (picking a function\
    \ by name etc.).\n\n## 19.1 Names of functions\n\nThe property `.name` of a function\
    \ contains the function’s name:\n\n```\nfunction myBeautifulFunction() {}\nassert.equal(myBeautifulFunction.name,\
    \ 'myBeautifulFunction');\n```\n\nPrior to ECMAScript 6, this property was already\
    \ supported by most engines. With ES6, it became part of the language standard.\n\
    \nThe language has become surprisingly good at finding names for functions, even\
    \ when they are initially anonymous (e.g., arrow functions).\n\n### 19.1.1 Function\
    \ names are used in stack traces\n\nOne benefit of function names is that they\
    \ show up in stack traces. In the following example, the argument of `callFunc()`\
    \ doesn’t get a name, which is why there is no function name in the second line\
    \ of the stack trace.\n\n```\nfunction callFunc(func) {\n  return func();\n}\n\
    \nfunction func1() {\n  throw new Error('Problem');\n}\n\nfunction func2() {\n\
    \  // The following arrow function doesn’t have a name\n  callFunc(() => func1());\n\
    }\n\nfunction func3() {\n  func2();\n}\n\ntry {\n  func3();\n} catch (err) {\n\
    assert.equal(err.stack, `\nError: Problem\n at func1 (ch_function-names.mjs:6:9)\n\
    \ at ch_function-names.mjs:11:18\n at callFunc (ch_function-names.mjs:2:10)\n\
    \ at func2 (ch_function-names.mjs:11:3)\n at func3 (ch_function-names.mjs:15:3)\n\
    \ at ch_function-names.mjs:19:3\n`.trim());\n\n}\n```\n\n## 19.2 Constructs that\
    \ provide names for functions\n\nThe following sections describe how `.name` is\
    \ set up automatically by various programming constructs.\n\n### 19.2.1 Function\
    \ declarations\n\nFunction declarations have had a `.name` for a long time – for\
    \ example:\n\n```\nfunction funcDecl() {}\nassert.equal(funcDecl.name, 'funcDecl');\n\
    ```\n\n### 19.2.2 Variable declarations and anonymous functions\n\nA function\
    \ created by an anonymous function expression picks up a name if it is the initialization\
    \ value of a variable declaration:\n\n```\nlet letFunc = function () {};\nassert.equal(letFunc.name,\
    \ 'letFunc');\n\nconst constFunc = function () {};\nassert.equal(constFunc.name,\
    \ 'constFunc');\n\nvar varFunc = function () {};\nassert.equal(varFunc.name, 'varFunc');\n\
    ```\n\n![](media/file0.svg)  **Arrow functions also get names**\n\nWith regard\
    \ to names, arrow functions are like anonymous function expressions:\n\n```\n\
    const arrowFunc = () => {};\nassert.equal(arrowFunc.name, 'arrowFunc');\n```\n\
    \nFrom now on, whenever you see an anonymous function expression, you can assume\
    \ that an arrow function works the same way.\n\n### 19.2.3 Assignments and anonymous\
    \ functions\n\nEven with a normal assignment, `.name` is set up properly:\n\n\
    ```\nlet assignedFunc;\nassignedFunc = function () {};\nassert.equal(assignedFunc.name,\
    \ 'assignedFunc');\n```\n\n### 19.2.4 Default values and anonymous functions\n\
    \nIf a function is a default value, it gets its name from its variable or parameter:\n\
    \n```\nconst [arrayDestructured = function () {}] = [];\nassert.equal(arrayDestructured.name,\
    \ 'arrayDestructured');\n\nconst {prop: objectDestructured = function () {}} =\
    \ {};\nassert.equal(objectDestructured.name, 'objectDestructured');\n\nfunction\
    \ createParamDefault(paramDefault = function () {}) {\n  return paramDefault;\n\
    }\nassert.equal(createParamDefault().name, 'paramDefault');\n```\n\n### 19.2.5 Named\
    \ function expressions\n\nThe name of a named function expression is used to set\
    \ up the `.name` property:\n\n```\nconst varName = function funcName() {};\nassert.equal(varName.name,\
    \ 'funcName');\n```\n\nBecause it comes first, the function expression’s name\
    \ `funcName` takes precedence over other names (in this case, the name `varName`\
    \ of the variable). However, the name of a function expression is still only a\
    \ variable inside the function expression:\n\n```\nconst varName = function funcName()\
    \ {\n  assert.equal(funcName.name, 'funcName');\n};\nvarName();\nassert.throws(\n\
    \  () => funcName,\n  /^ReferenceError: funcName is not defined$/\n);\n```\n\n\
    ### 19.2.6 Methods in object literals\n\nIf a function is the value of a property,\
    \ it gets its name from that property. It doesn’t matter if that happens via a\
    \ method definition (line A), a traditional property definition (line B), a property\
    \ definition with a computed property key (line C) or a property value shorthand\
    \ (line D).\n"
