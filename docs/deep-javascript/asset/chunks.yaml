    \    *   12.3.4 [Hiding own properties from `JSON.stringify()`](#ch013.xhtml_hiding-own-properties-from-json.stringify)\n\
    *   12.4 [Conclusion](#ch013.xhtml_conclusion)\n\n* * *\n\nEnumerability is an\
    \ *attribute* of object properties. In this chapter, we take a closer look at\
    \ how it is used and how it influences operations such as `Object.keys()` and\
    \ `Object.assign()`.\n\n![](media/file0.svg) **Required knowledge: property attributes**\n\
    \nFor this chapter, you should be familiar with property attributes. If you aren’t,\
    \ check out [§9 “Property attributes: an introduction”](#ch010.xhtml_ch_property-attributes-intro).\n\
    \n## 12.1 How enumerability affects property-iterating constructs\n\nTo demonstrate\
    \ how various operations are affected by enumerability, we use the following object\
    \ `obj` whose prototype is `proto`.\n\n```\nconst protoEnumSymbolKey = Symbol('protoEnumSymbolKey');\n\
    const protoNonEnumSymbolKey = Symbol('protoNonEnumSymbolKey');\nconst proto =\
    \ Object.defineProperties({}, {\n  protoEnumStringKey: {\n    value: 'protoEnumStringKeyValue',\n\
    \    enumerable: true,\n  },\n  [protoEnumSymbolKey]: {\n    value: 'protoEnumSymbolKeyValue',\n\
    \    enumerable: true,\n  },\n  protoNonEnumStringKey: {\n    value: 'protoNonEnumStringKeyValue',\n\
    \    enumerable: false,\n  },\n  [protoNonEnumSymbolKey]: {\n    value: 'protoNonEnumSymbolKeyValue',\n\
    \    enumerable: false,\n  },\n});\n\nconst objEnumSymbolKey = Symbol('objEnumSymbolKey');\n\
    const objNonEnumSymbolKey = Symbol('objNonEnumSymbolKey');\nconst obj = Object.create(proto,\
    \ {\n  objEnumStringKey: {\n    value: 'objEnumStringKeyValue',\n    enumerable:\
    \ true,\n  },\n  [objEnumSymbolKey]: {\n    value: 'objEnumSymbolKeyValue',\n\
    \    enumerable: true,\n  },\n  objNonEnumStringKey: {\n    value: 'objNonEnumStringKeyValue',\n\
    \    enumerable: false,\n  },\n  [objNonEnumSymbolKey]: {\n    value: 'objNonEnumSymbolKeyValue',\n\
    \    enumerable: false,\n  },\n});\n```\n\n### 12.1.1 Operations that only consider\
    \ enumerable properties\n\nTable 2: Operations that ignore non-enumerable properties.\n\
    \n| Operation |  | String keys | Symbol keys | Inherited |\n| --- | --- | ---\
    \ | --- | --- |\n| `Object.keys()` | ES5 | `✔` | `✘` | `✘` |\n| `Object.values()`\
    \ | ES2017 | `✔` | `✘` | `✘` |\n| `Object.entries()` | ES2017 | `✔` | `✘` | `✘`\
    \ |\n| Spreading `{...x}` | ES2018 | `✔` | `✔` | `✘` |\n| `Object.assign()` |\
    \ ES6 | `✔` | `✔` | `✘` |\n| `JSON.stringify()` | ES5 | `✔` | `✘` | `✘` |\n| `for-in`\
    \ | ES1 | `✔` | `✘` | `✔` |\n\nThe following operations (summarized in tbl. [2](#ch013.xhtml_tbl:operations-ignoring-non-enumerable-properties))\
    \ only consider enumerable properties:\n\n*   `Object.keys()` ^([ES5]) returns\
    \ the keys of enumerable own string-keyed properties.\n\n    ```\n    > Object.keys(obj)\n\
    \    [ 'objEnumStringKey' ]\n    ```\n\n*   `Object.values()` ^([ES2017]) returns\
    \ the values of enumerable own string-keyed properties.\n\n    ```\n    > Object.values(obj)\n\
    \    [ 'objEnumStringKeyValue' ]\n    ```\n\n*   `Object.entries()` ^([ES2017])\
    \ returns key-value pairs for enumerable own string-keyed properties. (Note that\
    \ `Object.fromEntries()` does accept symbols as keys, but only creates enumerable\
    \ properties.)\n\n    ```\n    > Object.entries(obj)\n    [ [ 'objEnumStringKey',\
    \ 'objEnumStringKeyValue' ] ]\n    ```\n\n*   Spreading into object literals ^([ES2018])\
    \ only considers own enumerable properties (with string keys or symbol keys).\n\
    \n    ```\n    > const copy = {...obj};\n    > Reflect.ownKeys(copy)\n    [ 'objEnumStringKey',\
    \ objEnumSymbolKey ]\n    ```\n\n*   `Object.assign()` ^([ES6]) only copies enumerable\
    \ own properties (with either string keys or symbol keys).\n\n    ```\n    > const\
    \ copy = Object.assign({}, obj);\n    > Reflect.ownKeys(copy)\n    [ 'objEnumStringKey',\
    \ objEnumSymbolKey ]\n    ```\n\n*   `JSON.stringify()` ^([ES5]) only stringifies\
    \ enumerable own properties with string keys.\n\n    ```\n    > JSON.stringify(obj)\n\
    \    '{\"objEnumStringKey\":\"objEnumStringKeyValue\"}'\n    ```\n\n*   `for-in`\
    \ loop ^([ES1]) traverses the keys of own and inherited enumerable string-keyed\
    \ properties.\n\n    ```\n    const propKeys = [];\n    for (const propKey in\
    \ obj) {\n      propKeys.push(propKey);\n    }\n    assert.deepEqual(\n      propKeys,\
    \ ['objEnumStringKey', 'protoEnumStringKey']);\n    ```\n\n`for-in` is the only\
    \ built-in operation where enumerability matters for inherited properties. All\
    \ other operations only work with own properties.\n\n### 12.1.2 Operations that\
    \ consider both enumerable and non-enumerable properties\n\nTable 3: Operations\
    \ that consider both enumerable and non-enumerable properties.\n\n| Operation\
    \ |  | Str. keys | Sym. keys | Inherited |\n| --- | --- | --- | --- | --- |\n\
    | `Object.getOwnPropertyNames()` | ES5 | `✔` | `✘` | `✘` |\n| `Object.getOwnPropertySymbols()`\
    \ | ES6 | `✘` | `✔` | `✘` |\n| `Reflect.ownKeys()` | ES6 | `✔` | `✔` | `✘` |\n\
    | `Object.getOwnPropertyDescriptors()` | ES2017 | `✔` | `✔` | `✘` |\n\nThe following\
    \ operations (summarized in tbl. [3](#ch013.xhtml_tbl:operations-considering-enumerable-and-nonenumerable-properties))\
    \ consider both enumerable and non-enumerable properties:\n\n*   `Object.getOwnPropertyNames()`\
    \ ^([ES5]) lists the keys of all own string-keyed properties.\n\n    ```\n   \
    \ > Object.getOwnPropertyNames(obj)\n    [ 'objEnumStringKey', 'objNonEnumStringKey'\
    \ ]\n    ```\n\n*   `Object.getOwnPropertySymbols()` ^([ES6]) lists the keys of\
    \ all own symbol-keyed properties.\n\n    ```\n    > Object.getOwnPropertySymbols(obj)\n\
    \    [ objEnumSymbolKey, objNonEnumSymbolKey ]\n    ```\n\n*   `Reflect.ownKeys()`\
    \ ^([ES6]) lists the keys of all own properties.\n\n    ```\n    > Reflect.ownKeys(obj)\n\
    \    [\n      'objEnumStringKey',\n      'objNonEnumStringKey',\n      objEnumSymbolKey,\n\
    \      objNonEnumSymbolKey\n    ]\n    ```\n\n*   `Object.getOwnPropertyDescriptors()`\
    \ ^([ES2017]) lists the property descriptors of all own properties.\n\n    ```\n\
    \    > Object.getOwnPropertyDescriptors(obj)\n    {\n      objEnumStringKey: {\n\
    \        value: 'objEnumStringKeyValue',\n        writable: false,\n        enumerable:\
    \ true,\n        configurable: false\n      },\n      objNonEnumStringKey: {\n\
    \        value: 'objNonEnumStringKeyValue',\n        writable: false,\n      \
    \  enumerable: false,\n        configurable: false\n      },\n      [objEnumSymbolKey]:\
    \ {\n        value: 'objEnumSymbolKeyValue',\n        writable: false,\n     \
    \   enumerable: true,\n        configurable: false\n      },\n      [objNonEnumSymbolKey]:\
    \ {\n        value: 'objNonEnumSymbolKeyValue',\n        writable: false,\n  \
    \      enumerable: false,\n        configurable: false\n      }\n    }\n    ```\n\
    \n### 12.1.3 Naming rules for introspective operations\n\n*Introspection* enables\
    \ a program to examine the structure of values at runtime. It is *metaprogramming*:\
    \ Normal programming is about writing programs; metaprogramming is about examining\
    \ and/or changing programs.\n"
