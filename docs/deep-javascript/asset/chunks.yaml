  trans: "\n\n以下容器类旨在异步接收其属性 `.data` 的内容。这是我们的首次尝试：\n\n```\nclass DataContainer {\n\
    \  #data; // (A)\n  constructor() {\n    Promise.resolve('downloaded')\n     \
    \ .then(data => this.#data = data); // (B)\n  }\n  getData() {\n    return 'DATA:\
    \ '+this.#data; // (C)\n  }\n}\n```\n\n这段代码的关键问题：属性 `.data` 初始为 `undefined`。\n\
    \n```\nconst dc = new DataContainer();\nassert.equal(dc.getData(), 'DATA: undefined');\n\
    setTimeout(() => assert.equal(\n  dc.getData(), 'DATA: downloaded'), 0);\n```\n\
    \n在第 A 行，我们声明了[私有字段](https://2ality.com/2019/07/private-class-fields.html) `.#data`，并在第\
    \ B 行和第 C 行中使用它。\n\n`DataContainer` 构造函数内部的 `Promise` 是异步完成的，这就是为什么我们只能通过 `setTimeout()`\
    \ 完成当前任务并启动新任务后才能看到 `.data` 的最终值。换句话说，当我们首次看到 `DataContainer` 的实例时，它尚未完全初始化。\n\
    \n## 13.2 解决方案：基于 Promise 的构造函数\n\n如果我们延迟对 `DataContainer` 实例的访问，直到它完全初始化，会怎样？我们可以通过从构造函数返回一个\
    \ `Promise` 来实现这一点。默认情况下，构造函数返回该类的一个新实例。如果我们显式返回一个对象，则可以覆盖该行为：\n\n```\nclass DataContainer\
    \ {\n  #data;\n  constructor() {\n    return Promise.resolve('downloaded')\n \
    \     .then(data => {\n        this.#data = data;\n        return this; // (A)\n\
    \      });\n  }\n  getData() {\n    return 'DATA: '+this.#data;\n  }\n}\nnew DataContainer()\n\
    \  .then(dc => assert.equal( // (B)\n    dc.getData(), 'DATA: downloaded'));\n\
    ```\n\n现在我们必须等待才能访问我们的实例（第 B 行）。它在数据“下载”完成后传递给我们（第 A 行）。这段代码中有两个可能的错误来源：\n\n*\
    \   下载可能失败并产生拒绝。\n*   第一个 `.then()` 回调的主体中可能抛出异常。\n\n无论哪种情况，错误都会成为从构造函数返回的 `Promise`\
    \ 的拒绝。\n\n优点和缺点：\n\n*   这种方法的一个好处是，我们只能在实例完全初始化后才能访问它。并且没有其他方法可以创建 `DataContainer`\
    \ 的实例。\n*   一个缺点是，构造函数返回 `Promise` 而不是实例可能会令人惊讶。\n\n### 13.2.1 使用立即调用的异步箭头函数\n\
    \n我们可以使用[立即调用的异步箭头函数](https://exploringjs.com/impatient-js/ch_async-functions.html#immediately-invoked-async-arrow-functions)，而不是直接使用\
    \ `Promise` API 来创建从构造函数返回的 `Promise`：\n\n```\nconstructor() {\n  return (async\
    \ () => {\n    this.#data = await Promise.resolve('downloaded');\n    return this;\n\
    \  })();\n}\n```\n\n## 13.3 解决方案：静态工厂方法\n\n类的*静态工厂方法* `C` 创建 `C` 的实例，是使用 `new\
    \ C()` 的替代方案。JavaScript 中静态工厂方法的常见名称：\n\n*   `.create()`：创建一个新实例。示例：`Object.create()`\n\
    *   `.from()`：基于不同的对象创建新实例，通过复制和/或转换。示例：`Array.from()`\n*   `.of()`：通过组合参数指定的值来创建新实例。示例：`Array.of()`\n\
    \n在以下示例中，`DataContainer.create()` 是一个静态工厂方法。它返回 `DataContainer` 实例的 `Promise`：\n\
    \n```\nclass DataContainer {\n  #data;\n  static async create() {\n    const data\
    \ = await Promise.resolve('downloaded');\n    return new this(data);\n  }\n  constructor(data)\
    \ {\n    this.#data = data;\n  }\n  getData() {\n    return 'DATA: '+this.#data;\n\
    \  }\n}\nDataContainer.create()\n  .then(dc => assert.equal(\n    dc.getData(),\
    \ 'DATA: downloaded'));\n```\n\n这次，所有异步功能都包含在 `.create()` 中，这使得类的其余部分完全同步，因此更简单。\n\
    \n优点和缺点：\n\n*   这种方法的一个好处是构造函数变得简单。\n*   一个缺点是现在可以通过 `new DataContainer()` 创建设置不正确的实例。\n\
    \n### 13.3.1 改进：通过秘密令牌实现私有构造函数\n\n如果我们希望确保实例始终正确设置，我们必须确保只有 `DataContainer.create()`\
    \ 可以调用 `DataContainer` 的构造函数。我们可以通过秘密令牌来实现这一点：\n\n```\nconst secretToken = Symbol('secretToken');\n\
    class DataContainer {\n  #data;\n  static async create() {\n    const data = await\
    \ Promise.resolve('downloaded');\n    return new this(secretToken, data);\n  }\n\
    \  constructor(token, data) {\n    if (token !== secretToken) {\n      throw new\
    \ Error('Constructor is private');\n    }\n    this.#data = data;\n  }\n  getData()\
    \ {\n    return 'DATA: '+this.#data;\n  }\n}\nDataContainer.create()\n  .then(dc\
    \ => assert.equal(\n    dc.getData(), 'DATA: downloaded'));\n```\n\n如果 `secretToken`\
    \ 和 `DataContainer` 位于同一模块中，并且只导出后者，那么外部方无法访问 `secretToken`，因此无法创建 `DataContainer`\
    \ 的实例。\n\n优点和缺点：\n\n*   优点：安全且直接。\n*   缺点：略显冗长。\n\n### 13.3.2 改进：构造函数抛出异常，工厂方法借用类原型\n\
    \n我们解决方案的以下变体禁用了 `DataContainer` 的构造函数，并使用技巧以另一种方式创建其实例（第 A 行）：\n\n```\nclass\
    \ DataContainer {\n  static async create() {\n    const data = await Promise.resolve('downloaded');\n\
    \    return Object.create(this.prototype)._init(data); // (A)\n  }\n  constructor()\
    \ {\n    throw new Error('Constructor is private');\n  }\n  _init(data) {\n  \
    \  this._data = data;\n    return this;\n  }\n  getData() {\n    return 'DATA:\
    \ '+this._data;\n  }\n}\nDataContainer.create()\n  .then(dc => {\n    assert.equal(dc\
    \ instanceof DataContainer, true); // (B)\n    assert.equal(\n      dc.getData(),\
    \ 'DATA: downloaded');\n  });\n```\n\n在内部，`DataContainer` 的实例是其原型为 `DataContainer.prototype`\
    \ 的任何对象。这就是为什么我们可以通过 `Object.create()`（第 A 行）创建实例，以及为什么 `instanceof` 在第 B 行有效。\n\
    \n优点和缺点：\n\n*   优点：优雅；`instanceof` 有效。\n*   缺点：\n    *   并不能完全阻止创建实例。不过公平地说，通过\
    \ `Object.create()` 的变通方法也可以用于我们之前的解决方案。\n    *   我们不能在 `DataContainer` 中使用[私有字段](https://2ality.com/2019/07/private-class-fields.html)和[私有方法](https://2ality.com/2019/07/private-methods-accessors-in-classes.html)，因为这些仅对通过构造函数创建的实例正确设置。\n\
    \n"
- fmt: "\n### 13.3.3 Improvement: instances are inactive by default, activated by\
    \ factory method\n\nAnother, more verbose variant is that, by default, instances\
    \ are switched off via the flag `.#active`. The initialization method `.#init()`\
    \ that switches them on cannot be accessed externally, but `Data.container()`\
    \ can invoke it:\n\n```\nclass DataContainer {\n  #data;\n  static async create()\
    \ {\n    const data = await Promise.resolve('downloaded');\n    return new this().#init(data);\n\
    \  }\n\n  #active = false;\n  constructor() {\n  }\n  #init(data) {\n    this.#active\
    \ = true;\n    this.#data = data;\n    return this;\n  }\n  getData() {\n    this.#check();\n\
    \    return 'DATA: '+this.#data;\n  }\n  #check() {\n    if (!this.#active) {\n\
    \      throw new Error('Not created by factory');\n    }\n  }\n}\nDataContainer.create()\n\
    \  .then(dc => assert.equal(\n    dc.getData(), 'DATA: downloaded'));\n```\n\n\
    The flag `.#active` is enforced via the private method `.#check()` which must\
    \ be invoked at the beginning of every method.\n\nThe major downside of this solution\
    \ is its verbosity. There is also a risk of forgetting to invoke `.#check()` in\
    \ each method.\n\n### 13.3.4 Variant: separate factory function\n\nFor completeness\
    \ sake, I’ll show another variant: Instead of using a static method as a factory\
    \ you can also use a separate stand-alone function.\n\n```\nconst secretToken\
    \ = Symbol('secretToken');\nclass DataContainer {\n  #data;\n  constructor(token,\
    \ data) {\n    if (token !== secretToken) {\n      throw new Error('Constructor\
    \ is private');\n    }\n    this.#data = data;\n  }\n  getData() {\n    return\
    \ 'DATA: '+this.#data;\n  }\n}\n\nasync function createDataContainer() {\n  const\
    \ data = await Promise.resolve('downloaded');\n  return new DataContainer(secretToken,\
    \ data);\n}\n\ncreateDataContainer()\n  .then(dc => assert.equal(\n    dc.getData(),\
    \ 'DATA: downloaded'));\n```\n\nStand-alone functions as factories are occasionally\
    \ useful, but in this case, I prefer a static method:\n\n*   The stand-alone function\
    \ can’t access private members of `DataContainer`.\n\n*   I prefer the way `DataContainer.create()`\
    \ looks.\n\n## 13.4 Subclassing a Promise-based constructor (optional)\n\nIn general,\
    \ subclassing is something to use sparingly.\n\nWith a separate factory function,\
    \ it is relatively easy to extend `DataContainer`.\n\nAlas, extending the class\
    \ with the Promise-based constructor leads to severe limitations. In the following\
    \ example, we subclass `DataContainer`. The subclass `SubDataContainer` has its\
    \ own private field `.#moreData` that it initializes asynchronously by hooking\
    \ into the Promise returned by the constructor of its superclass.\n\n```\nclass\
    \ DataContainer {\n  #data;\n  constructor() {\n    return Promise.resolve('downloaded')\n\
    \      .then(data => {\n        this.#data = data;\n        return this; // (A)\n\
    \      });\n  }\n  getData() {\n    return 'DATA: '+this.#data;\n  }\n}\n\nclass\
    \ SubDataContainer extends DataContainer {\n  #moreData;\n  constructor() {\n\
    \    super();\n    const promise = this;\n    return promise\n      .then(_this\
    \ => {\n        return Promise.resolve('more')\n          .then(moreData => {\n\
    \            _this.#moreData = moreData;\n            return _this;\n        \
    \  });\n      });\n  }\n  getData() {\n    return super.getData() + ', ' + this.#moreData;\n\
    \  }\n}\n```\n\nAlas, we can’t instantiate this class:\n\n```\nassert.rejects(\n\
    \  () => new SubDataContainer(),\n  {\n    name: 'TypeError',\n    message: 'Cannot\
    \ write private member #moreData ' +\n      'to an object whose class did not\
    \ declare it',\n  }\n);\n```\n\nWhy the failure? A constructor always adds its\
    \ private fields to its `this`. However, here, `this` in the subconstructor is\
    \ the Promise returned by the superconstructor (and not the instance of `SubDataContainer`\
    \ delivered via the Promise).\n\nHowever, this approach still works if `SubDataContainer`\
    \ does not have any private fields.\n\n## 13.5 Conclusion\n\nFor the scenario\
    \ examined in this chapter, I prefer either a Promise-based constructor or a static\
    \ factory method plus a private constructor via a secret token.\n\nHowever, the\
    \ other techniques presented here can still be useful in other scenarios.\n\n\
    ## 13.6 Further reading\n\n*   Asynchronous programming:\n\n    *   [Chapter “Promises\
    \ for asynchronous programming”](https://exploringjs.com/impatient-js/ch_promises.html)\
    \ in “JavaScript for impatient programmers”\n\n    *   [Chapter “Async functions”](https://exploringjs.com/impatient-js/ch_async-functions.html)\
    \ in “JavaScript for impatient programmers”\n\n    *   [Section “Immediately invoked\
    \ async arrow functions”](https://exploringjs.com/impatient-js/ch_async-functions.html#immediately-invoked-async-arrow-functions)\
    \ in “JavaScript for impatient programmers”\n\n*   OOP:\n\n    *   [Chapter “Prototype\
    \ chains and classes”](https://exploringjs.com/impatient-js/ch_proto-chains-classes.html)\
    \ in “JavaScript for impatient programmers”\n\n    *   [Blog post “ES proposal:\
    \ private class fields”](https://2ality.com/2019/07/private-class-fields.html)\n\
    \n    *   [Blog post “ES proposal: private methods and accessors in JavaScript\
    \ classes”](https://2ality.com/2019/07/private-methods-accessors-in-classes.html)\n\
    \n# 14 Copying instances of classes: `.clone()` vs. copy constructors\n\n* * *\n\
    \n*   14.1 [`.clone()` methods](#ch015.xhtml_clone-methods)\n\n*   14.2 [Static\
    \ factory methods](#ch015.xhtml_static-factory-methods)\n\n*   14.3 [Acknowledgements](#ch015.xhtml_acknowledgements)\n\
    \n* * *\n\nIn this chapter, we look at two techniques for implementing copying\
    \ for class instances:\n\n*   `.clone()` methods\n\n*   So-called *copy constructors*,\
    \ constructors that receive another instance of the current class and use it to\
    \ initialize the current instance.\n\n## 14.1 `.clone()` methods\n\nThis technique\
    \ introduces one method `.clone()` per class whose instances are to be copied.\
    \ It returns a deep copy of `this`. The following example shows three classes\
    \ that can be cloned.\n\n```\nclass Point {\n  constructor(x, y) {\n    this.x\
    \ = x;\n    this.y = y;\n  }\n  clone() {\n    return new Point(this.x, this.y);\n\
    \  }\n}\nclass Color {\n  constructor(name) {\n    this.name = name;\n  }\n  clone()\
    \ {\n    return new Color(this.name);\n  }\n}\nclass ColorPoint extends Point\
    \ {\n  constructor(x, y, color) {\n    super(x, y);\n    this.color = color;\n\
    \  }\n  clone() {\n    return new ColorPoint(\n      this.x, this.y, this.color.clone());\
    \ // (A)\n  }\n}\n```\n\nLine A demonstrates an important aspect of this technique:\
    \ compound instance property values must also be cloned, recursively.\n\n## 14.2 Static\
    \ factory methods\n"
