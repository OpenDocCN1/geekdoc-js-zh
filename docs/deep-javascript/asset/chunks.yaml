    [](#cb268-3)\n[](#cb268-4)// Non-destructive operations are allowed:\n[](#cb268-5)assert.deepEqual(\n\
    [](#cb268-6)  wrapped.slice(1), ['b', 'c']);\n[](#cb268-7)assert.equal(\n[](#cb268-8)\
    \  wrapped[1], 'b');\n[](#cb268-9)\n[](#cb268-10)// Destructive operations are\
    \ not allowed:\n[](#cb268-11)assert.throws(\n[](#cb268-12)  () => wrapped[1] =\
    \ 'x',\n[](#cb268-13)  /^TypeError: Setting is not allowed$/);\n[](#cb268-14)assert.throws(\n\
    [](#cb268-15)  () => wrapped.shift(),\n[](#cb268-16)  /^TypeError: Property \"\
    shift\" can’t be accessed$/);\n```\n\n# 16 Regular expressions: lookaround assertions\
    \ by example\n\n* * *\n\n*   16.1 [Cheat sheet: lookaround assertions](#ch017.xhtml_cheat-sheet-lookaround-assertions)\n\
    \n*   16.2 [Warnings for this chapter](#ch017.xhtml_warnings-for-this-chapter)\n\
    \n*   16.3 [Example: Specifying what comes before or after a match (positive lookaround)](#ch017.xhtml_example-specifying-what-comes-before-or-after-a-match-positive-lookaround)\n\
    \n*   16.4 [Example: Specifying what does not come before or after a match (negative\
    \ lookaround)](#ch017.xhtml_example-specifying-what-does-not-come-before-or-after-a-match-negative-lookaround)\n\
    \n    *   16.4.1 [There are no simple alternatives to negative lookaround assertions](#ch017.xhtml_there-are-no-simple-alternatives-to-negative-lookaround-assertions)\n\
    \n*   16.5 [Interlude: pointing lookaround assertions inward](#ch017.xhtml_interlude-pointing-lookaround-assertions-inward)\n\
    \n*   16.6 [Example: match strings not starting with `'abc'`](#ch017.xhtml_example-match-strings-not-starting-with-abc)\n\
    \n*   16.7 [Example: match substrings that do not contain `'.mjs'`](#ch017.xhtml_example-match-substrings-that-do-not-contain-.mjs)\n\
    \n*   16.8 [Example: skipping lines with comments](#ch017.xhtml_example-skipping-lines-with-comments)\n\
    \n*   16.9 [Example: smart quotes](#ch017.xhtml_example-smart-quotes)\n\n    *\
    \   16.9.1 [Supporting escaping via backslashes](#ch017.xhtml_supporting-escaping-via-backslashes)\n\
    \n*   16.10 [Acknowledgements](#ch017.xhtml_acknowledgements-1)\n\n*   16.11 [Further\
    \ reading](#ch017.xhtml_further-reading-4)\n\n* * *\n\nIn this chapter we use\
    \ examples to explore lookaround assertions in regular expressions. A lookaround\
    \ assertion is non-capturing and must match (or not match) what comes before (or\
    \ after) the current location in the input string.\n\n## 16.1 Cheat sheet: lookaround\
    \ assertions\n\nTable 4: Overview of available lookaround assertions.\n\n| Pattern\
    \ | Name |  |\n\n| --- | --- | --- |\n\n| `(?=«pattern»)` | Positive lookahead\
    \ | ES3 |\n\n| `(?!«pattern»)` | Negative lookahead | ES3 |\n\n| `(?<=«pattern»)`\
    \ | Positive lookbehind | ES2018 |\n\n| `(?<!«pattern»)` | Negative lookbehind\
    \ | ES2018 |\n\nThere are four lookaround assertions (tbl. [4](#ch017.xhtml_tbl:lookaround-assertions-overview))\n\
    \n*   Lookahead assertions (ECMAScript 3):\n\n    *   Positive lookahead: `(?=«pattern»)`\
    \ matches if `pattern` matches what comes after the current location in the input\
    \ string.\n\n    *   Negative lookahead: `(?!«pattern»)` matches if `pattern`\
    \ does not match what comes after the current location in the input string.\n\n\
    *   Lookbehind assertions (ECMAScript 2018):\n\n    *   Positive lookbehind: `(?<=«pattern»)`\
    \ matches if `pattern` matches what comes before the current location in the input\
    \ string.\n\n    *   Negative lookbehind: `(?<!«pattern»)` matches if `pattern`\
    \ does not match what comes before the current location in the input string.\n\
    \n## 16.2 Warnings for this chapter\n\n*   The examples show what can be achieved\
    \ via lookaround assertions. However, regular expression aren’t always the best\
    \ solution. Another technique, such as proper parsing, may be a better choice.\n\
    \n*   Lookbehind assertions are a relatively new feature that may not be supported\
    \ by all JavaScript engines you are targeting.\n\n*   Lookaround assertions may\
    \ affect performance negatively, especially if their patterns match long strings.\n\
    \n## 16.3 Example: Specifying what comes before or after a match (positive lookaround)\n\
    \nIn the following interaction, we extract quoted words:\n\n```\n> 'how \"are\"\
    \ \"you\" doing'.match(/(?<=\")[a-z]+(?=\")/g)\n[ 'are', 'you' ]\n```\n\nTwo lookaround\
    \ assertions help us here:\n\n*   `(?<=\")` “must be preceded by a quote”\n\n\
    *   `(?=\")` “must be followed by a quote”\n\nLookaround assertions are especially\
    \ convenient for `.match()` in `/g` mode, which returns whole matches (capture\
    \ group 0). Whatever the pattern of a lookaround assertion matches is not captured.\
    \ Without lookaround assertions, the quotes show up in the result:\n\n```\n> 'how\
    \ \"are\" \"you\" doing'.match(/\"([a-z]+)\"/g)\n[ '\"are\"', '\"you\"' ]\n```\n\
    \n## 16.4 Example: Specifying what does not come before or after a match (negative\
    \ lookaround)\n\nHow can we achieve the opposite of what we did in the previous\
    \ section and extract all unquoted words from a string?\n\n*   Input: `'how \"\
    are\" \"you\" doing'`\n\n*   Output: `['how', 'doing']`\n\nOur first attempt is\
    \ to simply convert positive lookaround assertions to negative lookaround assertions.\
    \ Alas, that fails:\n\n```\n> 'how \"are\" \"you\" doing'.match(/(?<!\")[a-z]+(?!\"\
    )/g)\n[ 'how', 'r', 'o', 'doing' ]\n```\n\nThe problem is that we extract sequences\
    \ of characters that are not bracketed by quotes. That means that in the string\
    \ `'\"are\"'`, the “r” in the middle is considered unquoted, because it is preceded\
    \ by an “a” and followed by an “e”.\n\nWe can fix this by stating that prefix\
    \ and suffix must be neither quote nor letter:\n\n```\n> 'how \"are\" \"you\"\
    \ doing'.match(/(?<![\"a-z])[a-z]+(?![\"a-z])/g)\n[ 'how', 'doing' ]\n```\n\n\
    Another solution is to demand via `\\b` that the sequence of characters `[a-z]+`\
    \ start and end at word boundaries:\n\n```\n> 'how \"are\" \"you\" doing'.match(/(?<!\"\
    )\\b[a-z]+\\b(?!\")/g)\n[ 'how', 'doing' ]\n```\n\nOne thing that is nice about\
    \ negative lookbehind and negative lookahead is that they also work at the beginning\
    \ or end, respectively, of a string – as demonstrated in the example.\n\n### 16.4.1 There\
    \ are no simple alternatives to negative lookaround assertions\n\nNegative lookaround\
    \ assertions are a powerful tool and usually impossible to emulate via other regular\
    \ expression means.\n\nIf we don’t want to use them, we normally have to take\
    \ a completely different approach. For example, in this case, we could split the\
    \ string into (quoted and unquoted) words and then filter those:\n\n```\n[](#cb274-1)const\
    \ str = 'how \"are\" \"you\" doing';\n[](#cb274-2)\n[](#cb274-3)const allWords\
    \ = str.match(/\"?[a-z]+\"?/g);\n[](#cb274-4)const unquotedWords = allWords.filter(\n\
    [](#cb274-5)  w => !w.startsWith('\"') || !w.endsWith('\"'));\n[](#cb274-6)assert.deepEqual(unquotedWords,\
    \ ['how', 'doing']);\n```\n\nBenefits of this approach:\n\n*   It works on older\
    \ engines.\n\n*   It is easy to understand.\n\n## 16.5 Interlude: pointing lookaround\
    \ assertions inward"
