  trans: "\n到目前为止，我们看到的例子都有一个共同点：环视断言规定了匹配之前或之后必须出现什么，但不会将这些字符包含在匹配结果中。\n\n本章剩余部分展示的正则表达式则不同：它们的环视断言指向内部，并限制匹配内容中的部分。\n\
    \n## 16.6 示例：匹配不以 `'abc'` 开头的字符串\n\n假设我们要匹配所有不以 `'abc'` 开头的字符串。我们的第一次尝试可能是正则表达式\
    \ `/^(?!abc)/`。\n\n这对于 `.test()` 来说效果很好：\n\n```\n> /^(?!abc)/.test('xyz')\ntrue\n\
    ```\n\n然而，`.exec()` 返回了一个空字符串：\n\n```\n> /^(?!abc)/.exec('xyz')\n{ 0: '', index:\
    \ 0, input: 'xyz', groups: undefined }\n```\n\n问题在于，像环视这样的断言不会扩展匹配的文本。也就是说，它们不会捕获输入字符，它们只对输入中的当前位置提出要求。\n\
    \n因此，解决方案是添加一个能够捕获输入字符的模式：\n\n```\n> /^(?!abc).*$/.exec('xyz')\n{ 0: 'xyz', index:\
    \ 0, input: 'xyz', groups: undefined }\n```\n\n正如所期望的，这个新的正则表达式拒绝了以 `'abc'` 开头的字符串：\n\
    \n```\n> /^(?!abc).*$/.exec('abc')\nnull\n> /^(?!abc).*$/.exec('abcd')\nnull\n\
    ```\n\n并且它接受了没有完整前缀的字符串：\n\n```\n> /^(?!abc).*$/.exec('ab')\n{ 0: 'ab', index:\
    \ 0, input: 'ab', groups: undefined }\n```\n\n## 16.7 示例：匹配不包含 `'.mjs'` 的子字符串\n\
    \n在下面的例子中，我们想要找到\n\n```\nimport ··· from '«模块标识符»';\n```\n\n其中 `模块标识符` 不以 `'.mjs'`\
    \ 结尾。\n\n```\n[](#cb281-1)const code = `\n[](#cb281-2)import {transform} from\
    \ './util';\n[](#cb281-3)import {Person} from './person.mjs';\n[](#cb281-4)import\
    \ {zip} from 'lodash';\n[](#cb281-5)`.trim();\n[](#cb281-6)assert.deepEqual(\n\
    [](#cb281-7)  code.match(/^import .*? from '[^']+(?<!\\.mjs)';$/umg),\n[](#cb281-8)\
    \  \n[    \"import {transform} from './util';\",\n[](#cb281-10)    \"import {zip}\
    \ from 'lodash';\",\n[](#cb281-11)  ]);\n```\n\n这里，后顾断言 `(?<!\\.mjs)` 充当了一个*守卫*，阻止正则表达式匹配在该位置包含\
    \ `'.mjs'` 的字符串。\n\n## 16.8 示例：跳过注释行\n\n场景：我们想要解析带有设置的行，同时跳过注释。例如：\n\n```\n[](#cb282-1)const\
    \ RE_SETTING = /^(?!#)([^:]*):(.*)$/\n[](#cb282-2)\n[](#cb282-3)const lines =\
    \ \n[  'indent: 2', // 设置\n[](#cb282-5)  '# Trim trailing whitespace:', // 注释\n\
    [](#cb282-6)  'whitespace: trim', // 设置\n[](#cb282-7)];\n[](#cb282-8)for (const\
    \ line of lines) {\n[](#cb282-9)  const match = RE_SETTING.exec(line);\n[](#cb282-10)\
    \  if (match) {\n[](#cb282-11)    const key = JSON.stringify(match[1]);\n[](#cb282-12)\
    \    const value = JSON.stringify(match[2]);\n[](#cb282-13)    console.log(`KEY:\
    \ ${key} VALUE: ${value}`);\n[](#cb282-14)  }\n[](#cb282-15)}\n[](#cb282-16)\n\
    [](#cb282-17)// 输出：\n[](#cb282-18)// 'KEY: \"indent\" VALUE: \" 2\"'\n[](#cb282-19)//\
    \ 'KEY: \"whitespace\" VALUE: \" trim\"'\n```\n\n我们是如何得到正则表达式 `RE_SETTING` 的呢？\n\
    \n我们从以下用于设置的正则表达式开始：\n\n```\n[](#cb283-1)/^([^:]*):(.*)$/\n```\n\n直观上，它由以下部分组成：\n\
    \n*   行首\n*   非冒号字符（零个或多个）\n*   一个冒号\n*   任意字符（零个或多个）\n*   行尾\n\n这个正则表达式确实拒绝了*一些*注释：\n\
    \n```\n> /^([^:]*):(.*)$/.test('# Comment')\nfalse\n```\n\n但它接受了其他注释（那些包含冒号的）：\n\
    \n```\n> /^([^:]*):(.*)$/.test('# Comment:')\ntrue\n```\n\n我们可以通过在前面加上 `(?!#)`\
    \ 作为守卫来解决这个问题。直观上，它的意思是：“输入字符串中的当前位置后面不能跟着字符 `#`。”\n\n新的正则表达式按预期工作：\n\n```\n>\
    \ /^(?!#)([^:]*):(.*)$/.test('# Comment:')\nfalse\n```\n\n## 16.9 示例：智能引号\n\n\
    假设我们想要将成对的直双引号转换为弯引号：\n\n*   输入：`` `\"yes\" and \"no\"` ``\n*   输出：`` `“yes” and\
    \ “no”` ``\n\n这是我们的第一次尝试：\n\n```\n> `The words \"must\" and \"should\".`.replace(/\"\
    (.*)\"/g, '“$1”')\n'The words “must\" and \"should”.'\n```\n\n只有第一个引号和最后一个引号变成了弯引号。这里的问题是\
    \ `*` 量词是*贪婪*匹配（尽可能多）。\n\n如果在 `*` 后面加上问号，它就会变成*懒惰*匹配：\n\n```\n> `The words \"\
    must\" and \"should\".`.replace(/\"(.*?)\"/g, '“$1”')\n'The words “must” and “should”.'\n\
    ```\n\n### 16.9.1 支持通过反斜杠转义\n\n如果我们想要允许通过反斜杠转义引号呢？我们可以通过在引号前使用守卫 `(?<!\\\\)` 来实现：\n\
    \n```\n> const regExp = /(?<!\\\\)\"(.*?)(?<!\\\\)\"/g;\n> String.raw`\\\"straight\\\
    \" and \"curly\"`.replace(regExp, '“$1”')\n'\\\\\"straight\\\\\" and “curly”'\n\
    ```\n\n作为后处理步骤，我们仍然需要执行：\n\n```\n[](#cb290-1).replace(/\\\\\"/g, `\"`)\n```\n\n\
    然而，这个正则表达式在遇到反斜杠转义的反斜杠时可能会失败：\n\n```\n> String.raw`Backslash: \"\\\\\"`.replace(/(?<!\\\
    \\)\"(.*?)(?<!\\\\)\"/g, '“$1”')\n'Backslash: \"\\\\\\\\\"'\n```\n\n第二个反斜杠阻止了引号变成弯引号。\n\
    \n如果我们让守卫更复杂一些，就可以解决这个问题（`?:` 使分组变为非捕获）：\n\n```\n[](#cb292-1)(?<=^\\\\*)\n```\n\
    \n新的守卫允许在引号前出现成对的反斜杠：\n\n```\n> const regExp = /(?<=^\\\\*)\"(.*?)(?<=^\\\\*)\"\
    /g;\n> String.raw`Backslash: \"\\\\\"`.replace(regExp, '“$1”')\n'Backslash: “\\\
    \\\\\\”'\n```\n\n还有一个问题。如果第一个引号出现在字符串的开头，这个守卫会阻止它被匹配：\n\n```\n> const regExp =\
    \ /(?<=^\\\\*)\"(.*?)(?<=^\\\\*)\"/g;\n> `\"abc\"`.replace(regExp, '“$1”')\n'\"\
    abc\"'\n```\n\n我们可以通过将第一个守卫改为 `(?<=^\\\\*|^)` 来解决这个问题：\n\n```\n> const regExp\
    \ = /(?<=^\\\\*|^)\"(.*?)(?<=^\\\\*)\"/g;\n> `\"abc\"`.replace(regExp, '“$1”')\n\
    '“abc”'\n```\n\n## 16.10 致谢\n\n*   第一个处理引号前转义反斜杠的正则表达式[由 `@jonasraoni` 在 Twitter\
    \ 上提出](https://twitter.com/jonasraoni/status/992506010454683650)。\n\n## 16.11 延伸阅读\n\
    \n*   [《JavaScript 快速入门》中的“正则表达式（`RegExp`）”章节](https://exploringjs.com/impatient-js/ch_regexps.html)\n\
