    \n### 3.1.2 基于声明式规则求值表达式\n\n完整算法通过一系列声明式规则来指定。假设我们要求值以下匹配表达式：\n\n```\n{first:\
    \ f, last: l} ← obj\n```\n\n要应用一系列规则，我们从上到下遍历它们，并执行第一个可应用的规则。如果该规则的主体中存在匹配表达式，则再次应用这些规则。依此类推。\n\
    \n有时头部包含一个条件，该条件也决定规则是否可应用——例如：\n\n*   (3a) `[«elements»] ← non_iterable`\n\n\
    \    `if (!isIterable(non_iterable))`\n\n    ```\n    [](#cb46-1)throw new TypeError();\n\
    \    ```\n\n## 3.2 模式匹配算法\n\n### 3.2.1 模式\n\n模式可以是：\n\n*   变量：`x`\n\n*   对象模式：`{«properties»}`\n\
    \n*   数组模式：`[«elements»]`\n\n接下来的三节将指定在匹配表达式中处理这三种情况的规则。\n\n### 3.2.2 变量的规则\n\n\
    *   1.  `x ← value`（包括 `undefined` 和 `null`）\n\n    ```\n    [](#cb47-1)x = value\n\
    \    ```\n\n### 3.2.3 对象模式的规则\n\n*   (2a) `{«properties»} ← undefined`（非法值）\n\n\
    \    ```\n    [](#cb48-1)throw new TypeError();\n    ```\n\n*   (2b) `{«properties»}\
    \ ← null`（非法值）\n\n    ```\n    [](#cb49-1)throw new TypeError();\n    ```\n\n\
    *   (2c) `{key: «pattern», «properties»} ← obj`\n\n    ```\n    [](#cb50-1)«pattern»\
    \ ← obj.key\n    [](#cb50-2){«properties»} ← obj\n    ```\n\n*   (2d) `{key: «pattern»\
    \ = default_value, «properties»} ← obj`\n\n    ```\n    [](#cb51-1)const tmp =\
    \ obj.key;\n    [](#cb51-2)if (tmp !== undefined) {\n    [](#cb51-3)  «pattern»\
