    \ often uses `ToNumeric()` where it previously used `ToNumber()`. Read on for\
    \ more information.\n\n### 2.2.2 Converting to numeric types\n\nAt the moment,\
    \ JavaScript has [two built-in numeric types](https://tc39.es/ecma262/#sec-numeric-types):\
    \ number and bigint.\n\n*   `ToNumeric()` returns a numeric value `num`. Its callers\
    \ usually invoke a method `mthd` of the specification type of `num`:\n\n    ```\n\
    \    Type(num)::mthd(···)\n    ```\n\n    Among others, the following operations\
    \ use `ToNumeric`:\n\n    *   Prefix and postfix `++` operator\n    *   `*` operator\n\
    \n*   `ToInteger(x)` is used whenever a number without a fraction is expected.\
    \ The range of the result is often restricted further afterwards.\n\n    *   It\
    \ calls `ToNumber(x)` and removes the fraction (similar to `Math.trunc()`).\n\
    \    *   Operations that use `ToInteger()`:\n\n        *   `Number.prototype.toString(radix?)`\n\
    \        *   `String.prototype.codePointAt(pos)`\n        *   `Array.prototype.slice(start,\
    \ end)`\n        *   Etc.\n\n*   `ToInt32()`, `ToUint32()` coerce numbers to 32-bit\
    \ integers and are used by bitwise operators (see tbl. [1](#ch003.xhtml_tbl:bitwise-number-operator-coercion)).\n\
    \n    *   `ToInt32()`: signed, range [−2^(31), 2^(31)−1] (limits are included)\n\
    \    *   `ToUint32()`: unsigned (hence the `U`), range [0, 2^(32)−1] (limits are\
    \ included)\n\nTable 1: Coercion of the operands of bitwise number operators (`BigInt`\
    \ operators don’t limit the number of bits).\n\n| Operator | Left operand | Right\
    \ operand | result type |\n| --- | --- | --- | --- |\n| `<<` | `ToInt32()` | `ToUint32()`\
    \ | `Int32` |\n| signed `>>` | `ToInt32()` | `ToUint32()` | `Int32` |\n| unsigned\
    \ `>>>` | `ToInt32()` | `ToUint32()` | `Uint32` |\n| `&`, `^`, `&#124;` | `ToInt32()`\
    \ | `ToUint32()` | `Int32` |\n| `~` | — | `ToInt32()` | `Int32` |\n\n### 2.2.3 Converting\
    \ to property keys\n\n`ToPropertyKey()` returns a string or a symbol and is used\
    \ by:\n\n*   The bracket operator `[]`\n*   Computed property keys in object literals\n\
    *   The left-hand side of the `in` operator\n*   `Object.defineProperty(_, P,\
    \ _)`\n*   `Object.fromEntries()`\n*   `Object.getOwnPropertyDescriptor()`\n*\
    \   `Object.prototype.hasOwnProperty()`\n*   `Object.prototype.propertyIsEnumerable()`\n\
    *   Several methods of `Reflect`\n\n### 2.2.4 Converting to Array indices\n\n\
    *   `ToLength()` is used (directly) mainly for string indices.\n\n    *   Helper\
    \ function for `ToIndex()`\n    *   Range of result `l`: 0 ≤ `l` ≤ 2^(53)−1\n\n\
    *   `ToIndex()` is used for Typed Array indices.\n\n    *   Main difference with\
    \ `ToLength()`: throws an exception if argument is out of range.\n    *   Range\
    \ of result `i`: 0 ≤ `i` ≤ 2^(53)−1\n\n*   `ToUint32()` is used for Array indices.\n\
    \n    *   Range of result `i`: 0 ≤ `i` < 2^(32)−1 (the upper limit is excluded,\
    \ to leave room for the `.length`)\n\n### 2.2.5 Converting to Typed Array elements\n\
    \nWhen we set the value of a Typed Array element, one of the following conversion\
    \ functions is used:\n\n*   `ToInt8()`\n*   `ToUint8()`\n*   `ToUint8Clamp()`\n\
    *   `ToInt16()`\n*   `ToUint16()`\n*   `ToInt32()`\n*   `ToUint32()`\n*   `ToBigInt64()`\n\
    *   `ToBigUint64()`\n\n## 2.3 Intermission: expressing specification algorithms\
    \ in JavaScript\n\nIn the remainder of this chapter, we’ll encounter several specification\
    \ algorithms, but “implemented” as JavaScript. The following list shows how some\
    \ frequently used patterns are translated from specification to JavaScript:\n\n\
    *   Spec: If `Type(value)` is String\n\n    JavaScript: `if (TypeOf(value) ===\
    \ 'string')`\n\n    (very loose translation; `TypeOf()` is defined below)\n\n\
    *   Spec: If `IsCallable(method)` is true\n\n    JavaScript: `if (IsCallable(method))`\n\
