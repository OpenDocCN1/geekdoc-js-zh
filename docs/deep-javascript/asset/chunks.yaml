    [](#cb178-2)assert.deepEqual(\n[](#cb178-3)  Object.getOwnPropertyDescriptors(dc),\n\
    [](#cb178-4)  {\n[](#cb178-5)    accessCount: {\n[](#cb178-6)      value: 0,\n\
    [](#cb178-7)      writable: true,\n[](#cb178-8)      enumerable: true,\n[](#cb178-9)\
    \      configurable: true,\n[](#cb178-10)    },\n[](#cb178-11)    data: {\n[](#cb178-12)\
    \      value: 'abc',\n[](#cb178-13)      writable: true,\n[](#cb178-14)      enumerable:\
    \ true,\n[](#cb178-15)      configurable: true,\n[](#cb178-16)    }\n[](#cb178-17)\
    \  });\n```\n\n## 9.9 API: property descriptors\n\nThe following tool methods\
    \ use property descriptors:\n\n*   `Object.defineProperty(obj: object, key: string|symbol,\
    \ propDesc: PropertyDescriptor): object` ^([ES5])\n\n    Creates or changes a\
    \ property on `obj` whose key is `key` and whose attributes are specified via\
    \ `propDesc`. Returns the modified object.\n\n    ```\n    [](#cb179-1)const obj\
    \ = {};\n    [](#cb179-2)const result = Object.defineProperty(\n    [](#cb179-3)\
    \  obj, 'happy', {\n    [](#cb179-4)    value: 'yes',\n    [](#cb179-5)    writable:\
    \ true,\n    [](#cb179-6)    enumerable: true,\n    [](#cb179-7)    configurable:\
    \ true,\n    [](#cb179-8)  });\n    [](#cb179-9)\n    [](#cb179-10)// obj was\
    \ returned and modified:\n    [](#cb179-11)assert.equal(result, obj);\n    [](#cb179-12)assert.deepEqual(obj,\
    \ {\n    [](#cb179-13)  happy: 'yes',\n    [](#cb179-14)});\n    ```\n\n*   `Object.defineProperties(obj:\
    \ object, properties: {[k: string|symbol]: PropertyDescriptor}): object` ^([ES5])\n\
    \n    The batch version of `Object.defineProperty()`. Each property `p` of the\
    \ object `properties` specifies one property that is to be added to `obj`: The\
    \ key of `p` specifies the key of the property, the value of `p` is a descriptor\
    \ that specifies the attributes of the property.\n\n    ```\n    [](#cb180-1)const\
    \ address1 = Object.defineProperties({}, {\n    [](#cb180-2)  street: { value:\
    \ 'Evergreen Terrace', enumerable: true },\n    [](#cb180-3)  number: { value:\
    \ 742, enumerable: true },\n    [](#cb180-4)});\n    ```\n\n*   `Object.create(proto:\
    \ null|object, properties?: {[k: string|symbol]: PropertyDescriptor}): object`\
    \ ^([ES5])\n\n    First, creates an object whose prototype is `proto`. Then, if\
    \ the optional parameter `properties` has been provided, adds properties to it\
    \ – in the same manner as `Object.defineProperties()`. Finally, returns the result.\
    \ For example, the following code snippet produces the same result as the previous\
    \ snippet:\n\n    ```\n    [](#cb181-1)const address2 = Object.create(Object.prototype,\
    \ {\n    [](#cb181-2)  street: { value: 'Evergreen Terrace', enumerable: true\
    \ },\n    [](#cb181-3)  number: { value: 742, enumerable: true },\n    [](#cb181-4)});\n\
    \    [](#cb181-5)assert.deepEqual(address1, address2);\n    ```\n\n*   `Object.getOwnPropertyDescriptor(obj:\
    \ object, key: string|symbol): undefined|PropertyDescriptor` ^([ES5])\n\n    Returns\
    \ the descriptor of the own (non-inherited) property of `obj` whose key is `key`.\
    \ If there is no such property, `undefined` is returned.\n\n    ```\n    [](#cb182-1)assert.deepEqual(\n\
    \    [](#cb182-2)  Object.getOwnPropertyDescriptor(Object.prototype, 'toString'),\n\
    \    [](#cb182-3)  {\n    [](#cb182-4)    value: {}.toString,\n    [](#cb182-5)\
    \    writable: true,\n    [](#cb182-6)    enumerable: false,\n    [](#cb182-7)\
    \    configurable: true,\n    [](#cb182-8)  });\n    [](#cb182-9)assert.equal(\n\
    \    [](#cb182-10)  Object.getOwnPropertyDescriptor({}, 'toString'),\n    [](#cb182-11)\
    \  undefined);\n    ```\n\n*   `Object.getOwnPropertyDescriptors(obj: object):\
    \ {[k: string|symbol]: PropertyDescriptor}` ^([ES2017])\n\n    Returns an object\
    \ where each property key `'k'` of `obj` is mapped to the property descriptor\
    \ for `obj.k`. The result can be used as input for `Object.defineProperties()`\
    \ and `Object.create()`.\n\n    ```\n    [](#cb183-1)const propertyKey = Symbol('propertyKey');\n\
    \    [](#cb183-2)const obj = {\n    [](#cb183-3)  [propertyKey]: 'abc',\n    [](#cb183-4)\
    \  get count() { return 123 },\n    [](#cb183-5)};\n    [](#cb183-6)\n    [](#cb183-7)const\
    \ desc = Object.getOwnPropertyDescriptor.bind(Object);\n    [](#cb183-8)assert.deepEqual(\n\
    \    [](#cb183-9)  Object.getOwnPropertyDescriptors(obj),\n    [](#cb183-10) \
    \ {\n    [](#cb183-11)    [propertyKey]: {\n    [](#cb183-12)      value: 'abc',\n\
    \    [](#cb183-13)      writable: true,\n    [](#cb183-14)      enumerable: true,\n\
    \    [](#cb183-15)      configurable: true\n    [](#cb183-16)    },\n    [](#cb183-17)\
    \    count: {\n    [](#cb183-18)      get: desc(obj, 'count').get, // (A)\n  \
    \  [](#cb183-19)      set: undefined,\n    [](#cb183-20)      enumerable: true,\n\
    \    [](#cb183-21)      configurable: true\n    [](#cb183-22)    }\n    [](#cb183-23)\
    \  });\n    ```\n\n    Using `desc()` in line A is a work-around so that `.deepEqual()`\
    \ works.\n\n## 9.10 Further reading\n\nThe next three chapters provide more details\
    \ on property attributes:\n\n*   [§10 “Protecting objects from being changed”](#ch011.xhtml_ch_protecting-objects)\n\
    \n*   [§11 “Properties: assignment vs. definition”](#ch012.xhtml_ch_property-assignment-vs-definition)\n\
    \n*   [§12 “Enumerability of properties”](#ch013.xhtml_ch_enumerability)\n\n#\
    \ 10 Protecting objects from being changed\n\n* * *\n\n*   10.1 [Levels of protection:\
    \ preventing extensions, sealing, freezing](#ch011.xhtml_levels-of-protection-preventing-extensions-sealing-freezing)\n\
    \n*   10.2 [Preventing extensions](#ch011.xhtml_preventing-extensions)\n\n   \
    \ *   10.2.1 [Checking whether an object is extensible](#ch011.xhtml_checking-whether-an-object-is-extensible)\n\
    \n*   10.3 [Sealing](#ch011.xhtml_sealing)\n\n    *   10.3.1 [Checking whether\
    \ an object is sealed](#ch011.xhtml_checking-whether-an-object-is-sealed)\n\n\
    *   10.4 [Freezing](#ch011.xhtml_freezing)\n\n    *   10.4.1 [Checking whether\
    \ an object is frozen](#ch011.xhtml_checking-whether-an-object-is-frozen)\n\n\
    \    *   10.4.2 [Freezing is shallow](#ch011.xhtml_freezing-is-shallow)\n\n  \
    \  *   10.4.3 [Implementing deep freezing](#ch011.xhtml_implementing-deep-freezing)\n\
    \n*   10.5 [Further reading](#ch011.xhtml_further-reading-2)\n\n* * *\n\nIn this\
    \ chapter, we’ll look at how objects can be protected from being changed. Examples\
    \ include: Preventing properties being added and preventing properties being changed.\n\
    \n![](media/file0.svg)  **Required knowledge: property attributes**\n\nFor this\
    \ chapter, you should be familiar with property attributes. If you aren’t, check\
    \ out [§9 “Property attributes: an introduction”](#ch010.xhtml_ch_property-attributes-intro)."
