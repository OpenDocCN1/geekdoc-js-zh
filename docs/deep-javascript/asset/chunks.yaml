  trans: "\n\n- 9.3.2 `Object.getOwnPropertyDescriptors()`：获取对象所有属性的描述符\n- 9.4 通过描述符定义属性\n\
    \    - 9.4.1 `Object.defineProperty()`：通过描述符定义单个属性\n    - 9.4.2 `Object.defineProperties()`：通过描述符定义多个属性\n\
    - 9.5 `Object.create()`：通过描述符创建对象\n- 9.6 `Object.getOwnPropertyDescriptors()`\
    \ 的使用场景\n    - 9.6.1 使用场景：将属性复制到对象中\n    - 9.6.2 `Object.getOwnPropertyDescriptors()`\
    \ 的使用场景：克隆对象\n- 9.7 省略描述符属性\n    - 9.7.1 创建属性时省略描述符属性\n    - 9.7.2 修改属性时省略描述符属性\n\
    - 9.8 内置构造使用了哪些属性特性？\n    - 9.8.1 通过赋值创建的自身属性\n    - 9.8.2 通过对象字面量创建的自身属性\n  \
    \  - 9.8.3 数组的自身属性 `.length`\n    - 9.8.4 内置类的原型属性\n    - 9.8.5 用户定义类的原型属性和实例属性\n\
    - 9.9 API：属性描述符\n- 9.10 延伸阅读\n\n---\n\n在本章中，我们将更深入地了解 ECMAScript 规范如何看待 JavaScript\
    \ 对象。特别地，在规范中，属性并非原子性的，而是由多个*特性*（可以理解为记录中的字段）组成。即使是数据属性的值，也存储在一个特性中！\n\n## 9.1 对象的结构\n\
    \n[在 ECMAScript 规范中](https://tc39.es/ecma262/#sec-object-type)，一个对象由以下部分组成：\n\n\
    *   *内部槽*，这些是 JavaScript 无法访问的存储位置，只能由规范中的操作访问。\n*   一个*属性*集合。每个属性将一个*键*与*特性*（可以理解为记录中的字段）关联起来。\n\
    \n### 9.1.1 内部槽\n\n[规范](https://tc39.es/ecma262/#sec-object-internal-methods-and-internal-slots)对内部槽的描述如下。我添加了项目符号并强调了其中一部分：\n\
    \n*   内部槽对应于与对象关联的内部状态，并被各种 ECMAScript 规范算法使用。\n*   内部槽不是对象属性，也不会被继承。\n*   根据具体的内部槽规范，这种状态可能由以下内容组成：\n\
    \    *   任何 ECMAScript 语言类型的值，或\n    *   特定的 ECMAScript 规范类型值。\n*   除非另有明确说明，内部槽是在创建对象的过程中分配的，并且不能动态添加到对象中。\n\
    *   除非另有说明，内部槽的初始值为 `undefined`。\n*   本规范中的各种算法会创建具有内部槽的对象。然而，**ECMAScript 语言没有提供将内部槽与对象关联的直接方法**。\n\
    *   内部方法和内部槽在本规范中使用双中括号 `[[ ]]` 括起来的名称进行标识。\n\n内部槽有两种：\n\n*   用于操作对象（获取属性、设置属性等）的方法槽。\n\
    *   用于存储值的数据槽。\n\n普通对象具有以下数据槽：\n\n*   `.[[Prototype]]: null | object`\n    * \
    \  存储对象的原型。\n    *   可以通过 `Object.getPrototypeOf()` 和 `Object.setPrototypeOf()`\
    \ 间接访问。\n*   `.[[Extensible]]: boolean`\n    *   指示是否可以向对象添加属性。\n    *   可以通过\
    \ `Object.preventExtensions()` 设置为 `false`。\n*   `.[[PrivateFieldValues]]: EntryList`\n\
    \    *   用于管理[私有类字段](https://2ality.com/2019/07/private-class-fields.html)。\n\n\
    ### 9.1.2 属性键\n\n属性的键可以是：\n\n*   字符串\n*   符号（Symbol）\n\n### 9.1.3 属性特性\n\n有两种属性，它们通过各自的特性来区分：\n\
    \n*   *数据属性*存储数据。其特性 `value` 保存任何 JavaScript 值。\n*   *访问器属性*由一个 getter 函数和/或一个\
    \ setter 函数组成。前者存储在特性 `get` 中，后者存储在特性 `set` 中。\n\n此外，两种属性都共有一些特性。下表列出了所有特性及其默认值。\n\
    \n| 属性类型 | 特性的名称和类型 | 默认值 |\n| --- | --- | --- |\n| 数据属性 | `value: any` | `undefined`\
    \ |\n|  | `writable: boolean` | `false` |\n| 访问器属性 | `get: (this: any) => any`\
    \ | `undefined` |\n|  | `set: (this: any, v: any) => void` | `undefined` |\n|\
    \ 所有属性 | `configurable: boolean` | `false` |\n|  | `enumerable: boolean` | `false`\
    \ |\n\n我们已经遇到过特性 `value`、`get` 和 `set`。其他特性的作用如下：\n\n*   `writable` 决定数据属性的值是否可以被更改。\n\
    *   `configurable` 决定属性的特性是否可以被更改。如果它为 `false`，则：\n    *   我们不能删除该属性。\n    * \
    \  我们不能将数据属性更改为访问器属性，反之亦然。\n    *   我们不能更改除 `value` 之外的任何特性。\n    *   然而，允许更改一个额外的特性：我们可以将\
    \ `writable` 从 `true` 改为 `false`。这一异常背后的原因是[历史原因](https://stackoverflow.com/questions/9829817/why-can-i-set-enumerability-and-writability-of-unconfigurable-property-descrip/9843191#9843191)：数组的\
    \ `.length` 属性一直是可写且不可配置的。允许更改其 `writable` 特性使我们能够冻结数组。\n*   `enumerable` 影响某些操作（例如\
    \ `Object.keys()`）。如果它为 `false`，则这些操作会忽略该属性。大多数属性都是可枚举的（例如通过赋值或对象字面量创建的属性），这就是为什么你在实践中很少注意到这个特性的原因。如果你仍然对其工作原理感兴趣，请参阅\
    \ §12 “属性的可枚举性”。\n\n#### 9.1.3.1 陷阱：继承的不可写属性阻止通过赋值创建自身属性\n\n如果继承的属性是不可写的，我们就不能通过赋值来创建具有相同键的自身属性：\n\
    \n```\n[](#cb155-1)const proto = {\n[](#cb155-2)  prop: 1,\n[](#cb155-3)};\n[](#cb155-4)//\
    \ 使 proto.prop 不可写：\n[](#cb155-5)Object.defineProperty(\n[](#cb155-6)  proto,\
    \ 'prop', {writable: false});\n[](#cb155-7)\n[](#cb155-8)const obj = Object.create(proto);\n\
    [](#cb155-9)\n[](#cb155-10)assert.throws(\n[](#cb155-11)  () => obj.prop = 2,\n\
    [](#cb155-12)  /^TypeError: Cannot assign to read only property 'prop'/);\n```\n\
    \n"
- fmt: "\nFor more information, see [§11.3.4 “Inherited read-only properties prevent\
    \ creating own properties via assignment”](#ch012.xhtml_inherited-properties-prevent-assignment).\n\
    \n## 9.2 Property descriptors\n\nA *property descriptor* encodes the attributes\
    \ of a property as a JavaScript object. Their TypeScript interfaces look as follows.\n\
    \n```\ninterface DataPropertyDescriptor {\n  value?: any;\n  writable?: boolean;\n\
    \  configurable?: boolean;\n  enumerable?: boolean;\n}\ninterface AccessorPropertyDescriptor\
    \ {\n  get?: (this: any) => any;\n  set?: (this: any, v: any) => void;\n  configurable?:\
    \ boolean;\n  enumerable?: boolean;\n}\ntype PropertyDescriptor = DataPropertyDescriptor\
    \ | AccessorPropertyDescriptor;\n```\n\nThe question marks indicate that all properties\
    \ are optional. [§9.7 “Omitting descriptor properties”](#ch010.xhtml_omitting-descriptor-properties)\
    \ describes what happens if they are omitted.\n\n## 9.3 Retrieving descriptors\
    \ for properties\n\n### 9.3.1 `Object.getOwnPropertyDescriptor()`: retrieving\
    \ a descriptor for a single property\n\nConsider the following object:\n\n```\n\
    const legoBrick = {\n  kind: 'Plate 1x3',\n  color: 'yellow',\n  get description()\
    \ {\n    return `${this.kind} (${this.color})`;\n  },\n};\n```\n\nLet’s first\
    \ get a descriptor for the data property `.color`:\n\n```\nassert.deepEqual(\n\
    \  Object.getOwnPropertyDescriptor(legoBrick, 'color'),\n  {\n    value: 'yellow',\n\
    \    writable: true,\n    enumerable: true,\n    configurable: true,\n  });\n\
    ```\n\nThis is what the descriptor for the accessor property `.description` looks\
    \ like:\n\n```\nconst desc = Object.getOwnPropertyDescriptor.bind(Object);\nassert.deepEqual(\n\
    \  Object.getOwnPropertyDescriptor(legoBrick, 'description'),\n  {\n    get: desc(legoBrick,\
    \ 'description').get, // (A)\n    set: undefined,\n    enumerable: true,\n   \
    \ configurable: true\n  });\n```\n\nUsing the utility function `desc()` in line\
    \ A ensures that `.deepEqual()` works.\n\n### 9.3.2 `Object.getOwnPropertyDescriptors()`:\
    \ retrieving descriptors for all properties of an object\n\n```\nconst legoBrick\
    \ = {\n  kind: 'Plate 1x3',\n  color: 'yellow',\n  get description() {\n    return\
    \ `${this.kind} (${this.color})`;\n  },\n};\n\nconst desc = Object.getOwnPropertyDescriptor.bind(Object);\n\
    assert.deepEqual(\n  Object.getOwnPropertyDescriptors(legoBrick),\n  {\n    kind:\
    \ {\n      value: 'Plate 1x3',\n      writable: true,\n      enumerable: true,\n\
    \      configurable: true,\n    },\n    color: {\n      value: 'yellow',\n   \
    \   writable: true,\n      enumerable: true,\n      configurable: true,\n    },\n\
    \    description: {\n      get: desc(legoBrick, 'description').get, // (A)\n \
    \     set: undefined,\n      enumerable: true,\n      configurable: true,\n  \
    \  },\n  });\n```\n\nUsing the helper function `desc()` in line A ensures that\
    \ `.deepEqual()` works.\n\n## 9.4 Defining properties via descriptors\n\nIf we\
    \ define a property with the key `k` via a property descriptor `propDesc`, then\
    \ what happens depends:\n\n*   If there is no property with key `k`, a new own\
    \ property is created that has the attributes specified by `propDesc`.\n*   If\
    \ there is a property with key `k`, defining changes the property’s attributes\
    \ so that they match `propDesc`.\n\n### 9.4.1 `Object.defineProperty()`: defining\
    \ single properties via descriptors\n\nFirst, let us create a new property via\
    \ a descriptor:\n\n```\nconst car = {};\n\nObject.defineProperty(car, 'color',\
    \ {\n  value: 'blue',\n  writable: true,\n  enumerable: true,\n  configurable:\
    \ true,\n});\n\nassert.deepEqual(\n  car,\n  {\n    color: 'blue',\n  });\n```\n\
    \nNext, we change the kind of a property via a descriptor; we turn a data property\
    \ into a getter:\n\n```\nconst car = {\n  color: 'blue',\n};\n\nlet readCount\
    \ = 0;\nObject.defineProperty(car, 'color', {\n  get() {\n    readCount++;\n \
    \   return 'red';\n  },\n});\n\nassert.equal(car.color, 'red');\nassert.equal(readCount,\
    \ 1);\n```\n\nLastly, we change the value of a data property via a descriptor:\n\
    \n```\nconst car = {\n  color: 'blue',\n};\n\n// Use the same attributes as assignment:\n\
    Object.defineProperty(\n  car, 'color', {\n    value: 'green',\n    writable:\
    \ true,\n    enumerable: true,\n    configurable: true,\n  });\n\nassert.deepEqual(\n\
    \  car,\n  {\n    color: 'green',\n  });\n```\n\nWe have used the same property\
    \ attributes as assignment.\n\n### 9.4.2 `Object.defineProperties()`: defining\
    \ multiple properties via descriptors\n\n`Object.defineProperties()` is the multi-property\
    \ version of `Object.defineProperty()`:\n\n```\nconst legoBrick1 = {};\nObject.defineProperties(\n\
    \  legoBrick1,\n  {\n    kind: {\n      value: 'Plate 1x3',\n      writable: true,\n\
    \      enumerable: true,\n      configurable: true,\n    },\n    color: {\n  \
    \    value: 'yellow',\n      writable: true,\n      enumerable: true,\n      configurable:\
    \ true,\n    },\n    description: {\n      get: function () {\n        return\
    \ `${this.kind} (${this.color})`;\n      },\n      enumerable: true,\n      configurable:\
    \ true,\n    },\n  });\n\nassert.deepEqual(\n  legoBrick1,\n  {\n    kind: 'Plate\
    \ 1x3',\n    color: 'yellow',\n    get description() {\n      return `${this.kind}\
    \ (${this.color})`;\n    },\n  });\n```\n\n## 9.5 `Object.create()`: Creating\
    \ objects via descriptors\n\n`Object.create()` creates a new object. Its first\
    \ argument specifies the prototype of that object. Its optional second argument\
    \ specifies descriptors for the properties of that object. In the next example,\
    \ we create the same object as in the previous example.\n"
