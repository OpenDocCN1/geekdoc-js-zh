    ```\n\nTherefore, if we want to specify arbitrary attributes, we must use definition.\n\
    \nAnd while we can create getters and setters inside object literals, we can’t\
    \ add them later via assignment. Here, too, we need definition.\n\n### 11.3.2 The\
    \ assignment operator does not change properties in prototypes\n\nLet us consider\
    \ the following setup, where `obj` inherits the property `prop` from `proto`.\n\
    \n```\n[](#cb208-1)const proto = { prop: 'a' };\n[](#cb208-2)const obj = Object.create(proto);\n\
    ```\n\nWe can’t (destructively) change `proto.prop` by assigning to `obj.prop`.\
    \ Doing so creates a new own property:\n\n```\n[](#cb209-1)assert.deepEqual(\n\
    [](#cb209-2)  Object.keys(obj), []);\n[](#cb209-3)\n[](#cb209-4)obj.prop = 'b';\n\
    [](#cb209-5)\n[](#cb209-6)// The assignment worked:\n[](#cb209-7)assert.equal(obj.prop,\
    \ 'b');\n[](#cb209-8)\n[](#cb209-9)// But we created an own property and overrode\
    \ proto.prop,\n[](#cb209-10)// we did not change it:\n[](#cb209-11)assert.deepEqual(\n\
    [](#cb209-12)  Object.keys(obj), ['prop']);\n[](#cb209-13)assert.equal(proto.prop,\
    \ 'a');\n```\n\nThe rationale for this behavior is as follows: Prototypes can\
    \ have properties whose values are shared by all of their descendants. If we want\
    \ to change such a property in only one descendant, we must do so non-destructively,\
    \ via overriding. Then the change does not affect the other descendants.\n\n###\
    \ 11.3.3 Assignment calls setters, definition doesn’t\n"
