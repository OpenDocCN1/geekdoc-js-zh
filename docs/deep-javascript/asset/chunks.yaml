  trans: "\n\n`.length` 是一个特殊的数据属性，因为它会受到其他自有属性（特别是索引属性）的影响，同时也会影响这些属性。\n\n### 9.8.4 内置类的原型属性\n\
    \n```\nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(Array.prototype, 'map'),\n\
    \  {\n    value: Array.prototype.map,\n    writable: true,\n    enumerable: false,\n\
    \    configurable: true\n  });\n```\n\n### 9.8.5 用户自定义类的原型属性和实例属性\n\n```\nclass\
    \ DataContainer {\n  accessCount = 0;\n  constructor(data) {\n    this.data =\
    \ data;\n  }\n  getData() {\n    this.accessCount++;\n    return this.data;\n\
    \  }\n}\nassert.deepEqual(\n  Object.getOwnPropertyDescriptors(DataContainer.prototype),\n\
    \  {\n    constructor: {\n      value: DataContainer,\n      writable: true,\n\
    \      enumerable: false,\n      configurable: true,\n    },\n    getData: {\n\
    \      value: DataContainer.prototype.getData,\n      writable: true,\n      enumerable:\
    \ false,\n      configurable: true,\n    }\n  });\n```\n\n请注意，`DataContainer`\
    \ 实例的所有自有属性都是可写、可枚举和可配置的：\n\n```\nconst dc = new DataContainer('abc')\nassert.deepEqual(\n\
    \  Object.getOwnPropertyDescriptors(dc),\n  {\n    accessCount: {\n      value:\
    \ 0,\n      writable: true,\n      enumerable: true,\n      configurable: true,\n\
    \    },\n    data: {\n      value: 'abc',\n      writable: true,\n      enumerable:\
    \ true,\n      configurable: true,\n    }\n  });\n```\n\n## 9.9 API：属性描述符\n\n\
    以下工具方法使用了属性描述符：\n\n*   `Object.defineProperty(obj: object, key: string|symbol,\
    \ propDesc: PropertyDescriptor): object` ^([ES5])\n\n    在 `obj` 上创建或修改一个属性，其键为\
    \ `key`，属性特性通过 `propDesc` 指定。返回修改后的对象。\n\n    ```\n    const obj = {};\n    const\
    \ result = Object.defineProperty(\n      obj, 'happy', {\n        value: 'yes',\n\
    \        writable: true,\n        enumerable: true,\n        configurable: true,\n\
    \      });\n    \n    // obj 被返回并修改：\n    assert.equal(result, obj);\n    assert.deepEqual(obj,\
    \ {\n      happy: 'yes',\n    });\n    ```\n\n*   `Object.defineProperties(obj:\
    \ object, properties: {[k: string|symbol]: PropertyDescriptor}): object` ^([ES5])\n\
    \n    `Object.defineProperty()` 的批量版本。对象 `properties` 的每个属性 `p` 指定一个要添加到 `obj`\
    \ 的属性：`p` 的键指定属性的键，`p` 的值是一个描述符，指定该属性的特性。\n\n    ```\n    const address1 = Object.defineProperties({},\
    \ {\n      street: { value: 'Evergreen Terrace', enumerable: true },\n      number:\
    \ { value: 742, enumerable: true },\n    });\n    ```\n\n*   `Object.create(proto:\
    \ null|object, properties?: {[k: string|symbol]: PropertyDescriptor}): object`\
    \ ^([ES5])\n\n    首先，创建一个原型为 `proto` 的对象。然后，如果提供了可选参数 `properties`，则按照与 `Object.defineProperties()`\
    \ 相同的方式向该对象添加属性。最后，返回结果。例如，以下代码片段产生与前一个片段相同的结果：\n\n    ```\n    const address2\
    \ = Object.create(Object.prototype, {\n      street: { value: 'Evergreen Terrace',\
    \ enumerable: true },\n      number: { value: 742, enumerable: true },\n    });\n\
    \    assert.deepEqual(address1, address2);\n    ```\n\n*   `Object.getOwnPropertyDescriptor(obj:\
    \ object, key: string|symbol): undefined|PropertyDescriptor` ^([ES5])\n\n    返回\
    \ `obj` 中键为 `key` 的自有（非继承）属性的描述符。如果不存在这样的属性，则返回 `undefined`。\n\n    ```\n    assert.deepEqual(\n\
    \      Object.getOwnPropertyDescriptor(Object.prototype, 'toString'),\n      {\n\
    \        value: {}.toString,\n        writable: true,\n        enumerable: false,\n\
    \        configurable: true,\n      });\n    assert.equal(\n      Object.getOwnPropertyDescriptor({},\
    \ 'toString'),\n      undefined);\n    ```\n\n*   `Object.getOwnPropertyDescriptors(obj:\
    \ object): {[k: string|symbol]: PropertyDescriptor}` ^([ES2017])\n\n    返回一个对象，其中\
    \ `obj` 的每个属性键 `'k'` 都映射到 `obj.k` 的属性描述符。结果可用作 `Object.defineProperties()` 和 `Object.create()`\
    \ 的输入。\n\n    ```\n    const propertyKey = Symbol('propertyKey');\n    const obj\
    \ = {\n      [propertyKey]: 'abc',\n      get count() { return 123 },\n    };\n\
    \    \n    const desc = Object.getOwnPropertyDescriptor.bind(Object);\n    assert.deepEqual(\n\
    \      Object.getOwnPropertyDescriptors(obj),\n      {\n        [propertyKey]:\
    \ {\n          value: 'abc',\n          writable: true,\n          enumerable:\
    \ true,\n          configurable: true\n        },\n        count: {\n        \
    \  get: desc(obj, 'count').get, // (A)\n          set: undefined,\n          enumerable:\
    \ true,\n          configurable: true\n        }\n      });\n    ```\n\n    在第\
    \ A 行使用 `desc()` 是一种变通方法，以便 `.deepEqual()` 能够正常工作。\n\n## 9.10 延伸阅读\n\n接下来的三章提供了关于属性特性的更多细节：\n\
    \n*   §10 “保护对象不被修改”\n\n*   §11 “属性：赋值 vs. 定义”\n\n*   §12 “属性的可枚举性”\n\n# 10 保护对象不被修改\n\
    \n* * *\n\n*   10.1 保护级别：禁止扩展、密封、冻结\n\n*   10.2 禁止扩展\n\n    *   10.2.1 检查对象是否可扩展\n\
    \n*   10.3 密封\n\n    *   10.3.1 检查对象是否被密封\n\n*   10.4 冻结\n\n    *   10.4.1 检查对象是否被冻结\n\
    \n    *   10.4.2 冻结是浅层的\n\n    *   10.4.3 实现深度冻结\n\n*   10.5 延伸阅读\n\n* * *\n\n\
    在本章中，我们将探讨如何保护对象不被修改。示例包括：禁止添加属性和禁止修改属性。\n\n![](img/file0.svg)  **必备知识：属性特性**\n\
    \n阅读本章前，你应该熟悉属性特性。如果不熟悉，请查看 §9 “属性特性：入门”。\n\n"
- fmt: "\n## 10.1 Levels of protection: preventing extensions, sealing, freezing\n\
    \nJavaScript has three levels of protecting objects:\n\n*   *Preventing extensions*\
    \ makes it impossible to add new properties to an object. We can still delete\
    \ and change properties, though.\n\n    *   Method: `Object.preventExtensions(obj)`\n\
    \n*   *Sealing* prevents extensions and makes all properties *unconfigurable*\
    \ (roughly: we can’t change how a property works anymore).\n\n    *   Method:\
    \ `Object.seal(obj)`\n\n*   *Freezing* seals an object after making all of its\
    \ properties non-writable. That is, the object is not extensible, all properties\
    \ are read-only and there is no way to change that.\n\n    *   Method: `Object.freeze(obj)`\n\
    \n## 10.2 Preventing extensions\n\n```\n[](#cb184-1)Object.preventExtensions<T>(obj:\
    \ T): T\n```\n\nThis method works as follows:\n\n*   If `obj` is not an object,\
    \ it returns it.\n\n*   Otherwise, it changes `obj` so that we can’t add properties\
    \ anymore and returns it.\n\n*   The type parameter `<T>` expresses that the result\
    \ has the same type as the parameter.\n\nLet’s use `Object.preventExtensions()`\
    \ in an example:\n\n```\n[](#cb185-1)const obj = { first: 'Jane' };\n[](#cb185-2)Object.preventExtensions(obj);\n\
    [](#cb185-3)assert.throws(\n[](#cb185-4)  () => obj.last = 'Doe',\n[](#cb185-5)\
    \  /^TypeError: Cannot add property last, object is not extensible$/);\n```\n\n\
    We can still delete properties, though:\n\n```\n[](#cb186-1)assert.deepEquals(\n\
    [](#cb186-2)  Object.keys(obj), ['first']);\n[](#cb186-3)delete obj.first;\n[](#cb186-4)assert.deepEquals(\n\
    [](#cb186-5)  Object.keys(obj), []);\n```\n\n### 10.2.1 Checking whether an object\
    \ is extensible\n\n```\n[](#cb187-1)Object.isExtensible(obj: any): boolean\n```\n\
    \nChecks whether `obj` is extensible – for example:\n\n```\n> const obj = {};\n\
    > Object.isExtensible(obj)\ntrue\n> Object.preventExtensions(obj)\n{}\n> Object.isExtensible(obj)\n\
    false\n```\n\n## 10.3 Sealing\n\n```\n[](#cb189-1)Object.seal<T>(obj: T): T\n\
    ```\n\nDescription of this method:\n\n*   If `obj` isn’t an object, it returns\
    \ it.\n\n*   Otherwise, it prevents extensions of `obj`, makes all of its properties\
    \ *unconfigurable*, and returns it. The properties being unconfigurable means\
    \ that they can’t be changed, anymore (except for their values): Read-only properties\
    \ stay read-only, enumerable properties stay enumerable, etc.\n\nThe following\
    \ example demonstrates that sealing makes the object non-extensible and its properties\
    \ unconfigurable.\n\n```\n[](#cb190-1)const obj = {\n[](#cb190-2)  first: 'Jane',\n\
    [](#cb190-3)  last: 'Doe',\n[](#cb190-4)};\n[](#cb190-5)\n[](#cb190-6)// Before\
    \ sealing\n[](#cb190-7)assert.equal(Object.isExtensible(obj), true);\n[](#cb190-8)assert.deepEqual(\n\
    [](#cb190-9)  Object.getOwnPropertyDescriptors(obj),\n[](#cb190-10)  {\n[](#cb190-11)\
    \    first: {\n[](#cb190-12)      value: 'Jane',\n[](#cb190-13)      writable:\
    \ true,\n[](#cb190-14)      enumerable: true,\n[](#cb190-15)      configurable:\
    \ true\n[](#cb190-16)    },\n[](#cb190-17)    last: {\n[](#cb190-18)      value:\
    \ 'Doe',\n[](#cb190-19)      writable: true,\n[](#cb190-20)      enumerable: true,\n\
    [](#cb190-21)      configurable: true\n[](#cb190-22)    }\n[](#cb190-23)  });\n\
    [](#cb190-24)\n[](#cb190-25)Object.seal(obj);\n[](#cb190-26)\n[](#cb190-27)//\
    \ After sealing\n[](#cb190-28)assert.equal(Object.isExtensible(obj), false);\n\
    [](#cb190-29)assert.deepEqual(\n[](#cb190-30)  Object.getOwnPropertyDescriptors(obj),\n\
    [](#cb190-31)  {\n[](#cb190-32)    first: {\n[](#cb190-33)      value: 'Jane',\n\
    [](#cb190-34)      writable: true,\n[](#cb190-35)      enumerable: true,\n[](#cb190-36)\
    \      configurable: false\n[](#cb190-37)    },\n[](#cb190-38)    last: {\n[](#cb190-39)\
    \      value: 'Doe',\n[](#cb190-40)      writable: true,\n[](#cb190-41)      enumerable:\
    \ true,\n[](#cb190-42)      configurable: false\n[](#cb190-43)    }\n[](#cb190-44)\
    \  });\n```\n\nWe can still change the value of property `.first`:\n\n```\n[](#cb191-1)obj.first\
    \ = 'John';\n[](#cb191-2)assert.deepEqual(\n[](#cb191-3)  obj, {first: 'John',\
    \ last: 'Doe'});\n```\n\nBut we can’t change its attributes:\n\n```\n[](#cb192-1)assert.throws(\n\
    [](#cb192-2)  () => Object.defineProperty(obj, 'first', { enumerable: false }),\n\
    [](#cb192-3)  /^TypeError: Cannot redefine property: first$/);\n```\n\n### 10.3.1 Checking\
    \ whether an object is sealed\n\n```\n[](#cb193-1)Object.isSealed(obj: any): boolean\n\
    ```\n\nChecks whether `obj` is sealed – for example:\n\n```\n> const obj = {};\n\
    > Object.isSealed(obj)\nfalse\n> Object.seal(obj)\n{}\n> Object.isSealed(obj)\n\
    true\n```\n\n## 10.4 Freezing\n\n```\n[](#cb195-1)Object.freeze<T>(obj: T): T;\n\
    ```\n\n*   This method immediately returns `obj` if it isn’t an object.\n\n* \
    \  Otherwise, it makes all properties non-writable, seals `obj`, and returns it.\
    \ That is, `obj` is not extensible, all properties are read-only and there is\
    \ no way to change that.\n\n```\n[](#cb196-1)const point = { x: 17, y: -5 };\n\
    [](#cb196-2)Object.freeze(point);\n[](#cb196-3)\n[](#cb196-4)assert.throws(\n\
    [](#cb196-5)  () => point.x = 2,\n[](#cb196-6)  /^TypeError: Cannot assign to\
    \ read only property 'x'/);\n[](#cb196-7)\n[](#cb196-8)assert.throws(\n[](#cb196-9)\
    \  () => Object.defineProperty(point, 'x', {enumerable: false}),\n[](#cb196-10)\
    \  /^TypeError: Cannot redefine property: x$/);\n[](#cb196-11)\n[](#cb196-12)assert.throws(\n\
    [](#cb196-13)  () => point.z = 4,\n[](#cb196-14)  /^TypeError: Cannot add property\
    \ z, object is not extensible$/);\n```\n\n### 10.4.1 Checking whether an object\
    \ is frozen\n\n```\n[](#cb197-1)Object.isFrozen(obj: any): boolean\n```\n\nChecks\
    \ whether `obj` is frozen – for example:\n\n```\n> const point = { x: 17, y: -5\
    \ };\n> Object.isFrozen(point)\nfalse\n> Object.freeze(point)\n{ x: 17, y: -5\
    \ }\n> Object.isFrozen(point)\ntrue\n```\n\n### 10.4.2 Freezing is shallow\n\n\
    `Object.freeze(obj)` only freezes `obj` and its properties. It does not freeze\
    \ the values of those properties – for example:\n\n```\n[](#cb199-1)const teacher\
    \ = {\n[](#cb199-2)  name: 'Edna Krabappel',\n[](#cb199-3)  students: ['Bart'],\n\
    [](#cb199-4)};\n[](#cb199-5)Object.freeze(teacher);\n[](#cb199-6)\n[](#cb199-7)//\
    \ We can’t change own properties:\n[](#cb199-8)assert.throws(\n[](#cb199-9)  ()\
    \ => teacher.name = 'Elizabeth Hoover',\n[](#cb199-10)  /^TypeError: Cannot assign\
    \ to read only property 'name'/);\n[](#cb199-11)\n[](#cb199-12)// Alas, we can\
    \ still change values of own properties:\n[](#cb199-13)teacher.students.push('Lisa');\n\
    [](#cb199-14)assert.deepEqual(\n[](#cb199-15)  teacher, {\n[](#cb199-16)    name:\
    \ 'Edna Krabappel',\n[](#cb199-17)    students: ['Bart', 'Lisa'],\n[](#cb199-18)\
    \  });\n```\n\n### 10.4.3 Implementing deep freezing\n\nIf we want deep freezing,\
    \ we need to implement it ourselves:\n\n```\n[](#cb200-1)function deepFreeze(value)\
    \ {\n[](#cb200-2)  if (Array.isArray(value)) {\n[](#cb200-3)    for (const element\
    \ of value) {\n[](#cb200-4)      deepFreeze(element);\n[](#cb200-5)    }\n[](#cb200-6)\
    \    Object.freeze(value);\n[](#cb200-7)  } else if (typeof value === 'object'\
    \ && value !== null) {\n[](#cb200-8)    for (const v of Object.values(value))\
    \ {\n[](#cb200-9)      deepFreeze(v);\n[](#cb200-10)    }\n[](#cb200-11)    Object.freeze(value);\n\
    [](#cb200-12)  } else {\n[](#cb200-13)    // Nothing to do: primitive values are\
    \ already immutable\n[](#cb200-14)  } \n[](#cb200-15)  return value;\n[](#cb200-16)}\n\
    ```\n\nRevisiting the example from the previous section, we can check if `deepFreeze()`\
    \ really freezes deeply:\n\n```\n[](#cb201-1)const teacher = {\n[](#cb201-2) \
    \ name: 'Edna Krabappel',\n[](#cb201-3)  students: ['Bart'],\n[](#cb201-4)};\n\
    [](#cb201-5)deepFreeze(teacher);\n[](#cb201-6)\n[](#cb201-7)assert.throws(\n[](#cb201-8)\
    \  () => teacher.students.push('Lisa'),\n[](#cb201-9)  /^TypeError: Cannot add\
    \ property 1, object is not extensible$/);\n```\n\n## 10.5 Further reading\n\n\
    *   More information on patterns for preventing data structures from being changed:\
    \ [§15 “Immutable wrappers for collections”](#ch016.xhtml_ch_immutable-collection-wrappers)\n\
    \n# 11 Properties: assignment vs. definition\n\n* * *\n\n*   11.1 [Assignment\
    \ vs. definition](#ch012.xhtml_assignment-vs.-definition)\n\n    *   11.1.1 [Assignment](#ch012.xhtml_assignment)\n\
    \n    *   11.1.2 [Definition](#ch012.xhtml_definition)\n"
  raw: "## 10.1 Levels of protection: preventing extensions, sealing, freezing\n\n\
    JavaScript has three levels of protecting objects:\n\n*   *Preventing extensions*\
    \ makes it impossible to add new properties to an object. We can still delete\
    \ and change properties, though.\n\n    *   Method: `Object.preventExtensions(obj)`\n\
    \n*   *Sealing* prevents extensions and makes all properties *unconfigurable*\
    \ (roughly: we can’t change how a property works anymore).\n\n    *   Method:\
    \ `Object.seal(obj)`\n\n*   *Freezing* seals an object after making all of its\
    \ properties non-writable. That is, the object is not extensible, all properties\
    \ are read-only and there is no way to change that.\n\n    *   Method: `Object.freeze(obj)`\n\
    \n## 10.2 Preventing extensions\n\n```\n[](#cb184-1)Object.preventExtensions<T>(obj:\
    \ T): T\n```\n\nThis method works as follows:\n\n*   If `obj` is not an object,\
    \ it returns it.\n\n*   Otherwise, it changes `obj` so that we can’t add properties\
    \ anymore and returns it.\n\n*   The type parameter `<T>` expresses that the result\
    \ has the same type as the parameter.\n\nLet’s use `Object.preventExtensions()`\
    \ in an example:\n\n```\n[](#cb185-1)const obj = { first: 'Jane' };\n[](#cb185-2)Object.preventExtensions(obj);\n\
    [](#cb185-3)assert.throws(\n[](#cb185-4)  () => obj.last = 'Doe',\n[](#cb185-5)\
    \  /^TypeError: Cannot add property last, object is not extensible$/);\n```\n\n\
    We can still delete properties, though:\n\n```\n[](#cb186-1)assert.deepEquals(\n\
    [](#cb186-2)  Object.keys(obj), ['first']);\n[](#cb186-3)delete obj.first;\n[](#cb186-4)assert.deepEquals(\n\
    [](#cb186-5)  Object.keys(obj), []);\n```\n\n### 10.2.1 Checking whether an object\
    \ is extensible\n\n```\n[](#cb187-1)Object.isExtensible(obj: any): boolean\n```\n\
    \nChecks whether `obj` is extensible – for example:\n\n```\n> const obj = {};\n\
    > Object.isExtensible(obj)\ntrue\n> Object.preventExtensions(obj)\n{}\n> Object.isExtensible(obj)\n\
    false\n```\n\n## 10.3 Sealing\n\n```\n[](#cb189-1)Object.seal<T>(obj: T): T\n\
    ```\n\nDescription of this method:\n\n*   If `obj` isn’t an object, it returns\
    \ it.\n\n*   Otherwise, it prevents extensions of `obj`, makes all of its properties\
    \ *unconfigurable*, and returns it. The properties being unconfigurable means\
    \ that they can’t be changed, anymore (except for their values): Read-only properties\
    \ stay read-only, enumerable properties stay enumerable, etc.\n\nThe following\
    \ example demonstrates that sealing makes the object non-extensible and its properties\
    \ unconfigurable.\n\n```\n[](#cb190-1)const obj = {\n[](#cb190-2)  first: 'Jane',\n\
    [](#cb190-3)  last: 'Doe',\n[](#cb190-4)};\n[](#cb190-5)\n[](#cb190-6)// Before\
    \ sealing\n[](#cb190-7)assert.equal(Object.isExtensible(obj), true);\n[](#cb190-8)assert.deepEqual(\n\
    [](#cb190-9)  Object.getOwnPropertyDescriptors(obj),\n[](#cb190-10)  {\n[](#cb190-11)\
    \    first: {\n[](#cb190-12)      value: 'Jane',\n[](#cb190-13)      writable:\
    \ true,\n[](#cb190-14)      enumerable: true,\n[](#cb190-15)      configurable:\
    \ true\n[](#cb190-16)    },\n[](#cb190-17)    last: {\n[](#cb190-18)      value:\
    \ 'Doe',\n[](#cb190-19)      writable: true,\n[](#cb190-20)      enumerable: true,\n\
    [](#cb190-21)      configurable: true\n[](#cb190-22)    }\n[](#cb190-23)  });\n\
    [](#cb190-24)\n[](#cb190-25)Object.seal(obj);\n[](#cb190-26)\n[](#cb190-27)//\
    \ After sealing\n[](#cb190-28)assert.equal(Object.isExtensible(obj), false);\n\
    [](#cb190-29)assert.deepEqual(\n[](#cb190-30)  Object.getOwnPropertyDescriptors(obj),\n\
    [](#cb190-31)  {\n[](#cb190-32)    first: {\n[](#cb190-33)      value: 'Jane',\n\
    [](#cb190-34)      writable: true,\n[](#cb190-35)      enumerable: true,\n[](#cb190-36)\
    \      configurable: false\n[](#cb190-37)    },\n[](#cb190-38)    last: {\n[](#cb190-39)\
    \      value: 'Doe',\n[](#cb190-40)      writable: true,\n[](#cb190-41)      enumerable:\
    \ true,\n[](#cb190-42)      configurable: false\n[](#cb190-43)    }\n[](#cb190-44)\
    \  });\n```\n\nWe can still change the the value of property `.first`:\n\n```\n\
    [](#cb191-1)obj.first = 'John';\n[](#cb191-2)assert.deepEqual(\n[](#cb191-3) \
    \ obj, {first: 'John', last: 'Doe'});\n```\n\nBut we can’t change its attributes:\n\
    \n```\n[](#cb192-1)assert.throws(\n[](#cb192-2)  () => Object.defineProperty(obj,\
    \ 'first', { enumerable: false }),\n[](#cb192-3)  /^TypeError: Cannot redefine\
    \ property: first$/);\n```\n\n### 10.3.1 Checking whether an object is sealed\n\
    \n```\n[](#cb193-1)Object.isSealed(obj: any): boolean\n```\n\nChecks whether `obj`\
    \ is sealed – for example:\n\n```\n> const obj = {};\n> Object.isSealed(obj)\n\
    false\n> Object.seal(obj)\n{}\n> Object.isSealed(obj)\ntrue\n```\n\n## 10.4 Freezing\n\
    \n```\n[](#cb195-1)Object.freeze<T>(obj: T): T;\n```\n\n*   This method immediately\
    \ returns `obj` if it isn’t an object.\n\n*   Otherwise, it makes all properties\
    \ non-writable, seals `obj`, and returns it. That is, `obj` is not extensible,\
    \ all properties are read-only and there is no way to change that.\n\n```\n[](#cb196-1)const\
    \ point = { x: 17, y: -5 };\n[](#cb196-2)Object.freeze(point);\n[](#cb196-3)\n\
    [](#cb196-4)assert.throws(\n[](#cb196-5)  () => point.x = 2,\n[](#cb196-6)  /^TypeError:\
    \ Cannot assign to read only property 'x'/);\n[](#cb196-7)\n[](#cb196-8)assert.throws(\n\
    [](#cb196-9)  () => Object.defineProperty(point, 'x', {enumerable: false}),\n\
    [](#cb196-10)  /^TypeError: Cannot redefine property: x$/);\n[](#cb196-11)\n[](#cb196-12)assert.throws(\n\
    [](#cb196-13)  () => point.z = 4,\n[](#cb196-14)  /^TypeError: Cannot add property\
    \ z, object is not extensible$/);\n```\n\n### 10.4.1 Checking whether an object\
    \ is frozen\n\n```\n[](#cb197-1)Object.isFrozen(obj: any): boolean\n```\n\nChecks\
    \ whether `obj` is frozen – for example:\n\n```\n> const point = { x: 17, y: -5\
    \ };\n> Object.isFrozen(point)\nfalse\n> Object.freeze(point)\n{ x: 17, y: -5\
    \ }\n> Object.isFrozen(point)\ntrue\n```\n\n### 10.4.2 Freezing is shallow\n\n\
    `Object.freeze(obj)` only freezes `obj` and its properties. It does not freeze\
    \ the values of those properties – for example:\n\n```\n[](#cb199-1)const teacher\
    \ = {\n[](#cb199-2)  name: 'Edna Krabappel',\n[](#cb199-3)  students: ['Bart'],\n\
    [](#cb199-4)};\n[](#cb199-5)Object.freeze(teacher);\n[](#cb199-6)\n[](#cb199-7)//\
    \ We can’t change own properties:\n[](#cb199-8)assert.throws(\n[](#cb199-9)  ()\
    \ => teacher.name = 'Elizabeth Hoover',\n[](#cb199-10)  /^TypeError: Cannot assign\
    \ to read only property 'name'/);\n[](#cb199-11)\n[](#cb199-12)// Alas, we can\
    \ still change values of own properties:\n[](#cb199-13)teacher.students.push('Lisa');\n\
    [](#cb199-14)assert.deepEqual(\n[](#cb199-15)  teacher, {\n[](#cb199-16)    name:\
    \ 'Edna Krabappel',\n[](#cb199-17)    students: ['Bart', 'Lisa'],\n[](#cb199-18)\
    \  });\n```\n\n### 10.4.3 Implementing deep freezing\n\nIf we want deep freezing,\
    \ we need to implement it ourselves:\n\n```\n[](#cb200-1)function deepFreeze(value)\
    \ {\n[](#cb200-2)  if (Array.isArray(value)) {\n[](#cb200-3)    for (const element\
    \ of value) {\n[](#cb200-4)      deepFreeze(element);\n[](#cb200-5)    }\n[](#cb200-6)\
    \    Object.freeze(value);\n[](#cb200-7)  } else if (typeof value === 'object'\
    \ && value !== null) {\n[](#cb200-8)    for (const v of Object.values(value))\
    \ {\n[](#cb200-9)      deepFreeze(v);\n[](#cb200-10)    }\n[](#cb200-11)    Object.freeze(value);\n\
    [](#cb200-12)  } else {\n[](#cb200-13)    // Nothing to do: primitive values are\
    \ already immutable\n[](#cb200-14)  } \n[](#cb200-15)  return value;\n[](#cb200-16)}\n\
    ```\n\nRevisiting the example from the previous section, we can check if `deepFreeze()`\
    \ really freezes deeply:\n\n```\n[](#cb201-1)const teacher = {\n[](#cb201-2) \
    \ name: 'Edna Krabappel',\n[](#cb201-3)  students: ['Bart'],\n[](#cb201-4)};\n\
    [](#cb201-5)deepFreeze(teacher);\n[](#cb201-6)\n[](#cb201-7)assert.throws(\n[](#cb201-8)\
    \  () => teacher.students.push('Lisa'),\n[](#cb201-9)  /^TypeError: Cannot add\
    \ property 1, object is not extensible$/);\n```\n\n## 10.5 Further reading\n\n\
    *   More information on patterns for preventing data structures from being changed:\
    \ [§15 “Immutable wrappers for collections”](#ch016.xhtml_ch_immutable-collection-wrappers)\n\
    \n# 11 Properties: assignment vs. definition\n\n* * *\n\n*   11.1 [Assignment\
    \ vs. definition](#ch012.xhtml_assignment-vs.-definition)\n\n    *   11.1.1 [Assignment](#ch012.xhtml_assignment)\n\
    \n    *   11.1.2 [Definition](#ch012.xhtml_definition)"
