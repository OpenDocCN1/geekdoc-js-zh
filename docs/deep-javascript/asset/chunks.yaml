    \n## 2.6 术语表：与类型转换相关的术语\n\n现在我们已经更深入地了解了 JavaScript 的类型强制转换是如何工作的，让我们用一个与类型转换相关的简短术语表来总结一下：\n\
    \n*   在*类型转换*中，我们希望输出值具有给定的类型。如果输入值已经具有该类型，则直接返回不变。否则，将其转换为具有所需类型的值。\n*   *显式类型转换*意味着程序员使用某个操作（函数、运算符等）来触发类型转换。显式转换可以是：\n\
    \    *   *受检的*：如果无法转换值，则抛出异常。\n    *   *非受检的*：如果无法转换值，则返回错误值。\n*   *类型转换*（type\
    \ casting）的含义取决于编程语言。例如，在 Java 中，它是显式的受检类型转换。\n*   *类型强制转换*是隐式类型转换：操作自动将其参数转换为所需的类型。可以是受检的、非受检的或介于两者之间的。\n\
    \n[来源：[维基百科](https://en.wikipedia.org/wiki/Type_conversion)]\n\n# 3 解构算法\n\n*\
    \ * *\n\n*   3.1 为模式匹配算法做准备\n    *   3.1.1 使用声明式规则指定匹配算法\n    *   3.1.2 基于声明式规则求值表达式\n\
    *   3.2 模式匹配算法\n    *   3.2.1 模式\n    *   3.2.2 变量的规则\n    *   3.2.3 对象模式的规则\n\
    \    *   3.2.4 数组模式的规则\n*   3.3 空对象模式和数组模式\n*   3.4 应用算法\n    *   3.4.1 背景：通过匹配传递参数\n\
    \    *   3.4.2 使用 `move2()`\n    *   3.4.3 使用 `move1()`\n    *   3.4.4 结论：默认值是模式部分的一个特性\n\
    \n* * *\n\n在本章中，我们将从另一个角度看待解构：作为一种递归的模式匹配算法。\n\n该算法将让我们更好地理解默认值。这在最后会很有用，我们将尝试弄清楚以下两个函数有何不同：\n\
    \n```\n[](#cb40-1)function move({x=0, y=0} = {})         { ··· }\n[](#cb40-2)function\
    \ move({x, y} = { x: 0, y: 0 }) { ··· }\n```\n\n## 3.1 为模式匹配算法做准备\n\n解构赋值看起来像这样：\n\
    \n```\n[](#cb41-1)«pattern» = «value»\n```\n\n我们想使用`pattern`从`value`中提取数据。\n\n\
    现在我们将研究一种执行这种赋值的算法。该算法在函数式编程中被称为*模式匹配*（简称：*匹配*）。它指定了运算符`←`（“匹配于”），该运算符将`pattern`与`value`进行匹配，并在此过程中为变量赋值：\n\
    \n```\n[](#cb42-1)«pattern» ← «value»\n```\n\n我们将只探讨解构赋值，但解构变量声明和解构参数定义的工作方式类似。我们也不会深入探讨高级特性：计算属性键、属性值简写，以及将对象属性和数组元素作为赋值目标，这些都不在本章的讨论范围内。\n\
    \n匹配运算符的规范由声明式规则组成，这些规则深入到两个操作数的结构中。声明式表示法可能需要一些时间来适应，但它使规范更加简洁。\n\n### 3.1.1 使用声明式规则指定匹配算法\n\
    \n本章使用的声明式规则对输入进行操作，并通过副作用产生算法的结果。以下是这样一个规则（我们稍后会再次看到）：\n\n*   (2c) `{key: «pattern»,\
    \ «properties»} ← obj`\n\n    ```\n    [](#cb43-1)«pattern» ← obj.key\n    [](#cb43-2){«properties»}\
    \ ← obj\n    ```\n\n该规则包含以下部分：\n\n*   (2c) 是规则的*编号*。该编号用于引用规则。\n*   *头部*（第一行）描述了输入必须满足的条件，以便应用此规则。\n\
    *   *主体*（其余行）描述了应用规则时发生的情况。\n\n"
- fmt: "\nIn rule (2c), the head means that this rule can be applied if there is an\
    \ object pattern with at least one property (whose key is `key`) and zero or more\
    \ remaining properties. The effect of this rule is that execution continues with\
    \ the property value pattern being matched against `obj.key` and the remaining\
    \ properties being matched against `obj`.\n\nLet’s consider one more rule from\
    \ this chapter:\n\n*   (2e) `{} ← obj` (no properties left)\n\n    ```\n    [](#cb44-1)//\
    \ We are finished\n    ```\n\nIn rule (2e), the head means that this rule is executed\
    \ if the empty object pattern `{}` is matched against a value `obj`. The body\
    \ means that, in this case, we are done.\n\nTogether, rule (2c) and rule (2e)\
    \ form a declarative loop that iterates over the properties of the pattern on\
    \ the left-hand side of the arrow.\n\n### 3.1.2 Evaluating expressions based on\
    \ the declarative rules\n\nThe complete algorithm is specified via a sequence\
    \ of declarative rules. Let’s assume we want to evaluate the following matching\
    \ expression:\n\n```\n{first: f, last: l} ← obj\n```\n\nTo apply a sequence of\
    \ rules, we go over them from top to bottom and execute the first applicable rule.\
    \ If there is a matching expression in the body of that rule, the rules are applied\
    \ again. And so on.\n\nSometimes the head includes a condition that also determines\
    \ if a rule is applicable – for example:\n\n*   (3a) `[«elements»] ← non_iterable`\n\
    \n    `if (!isIterable(non_iterable))`\n\n    ```\n    [](#cb46-1)throw new TypeError();\n\
    \    ```\n\n## 3.2 The pattern matching algorithm\n\n### 3.2.1 Patterns\n\nA pattern\
    \ is either:\n\n*   A variable: `x`\n\n*   An object pattern: `{«properties»}`\n\
    \n*   An Array pattern: `[«elements»]`\n\nThe next three sections specify rules\
    \ for handling these three cases in matching expressions.\n\n### 3.2.2 Rules for\
    \ variable\n\n*   1.  `x ← value` (including `undefined` and `null`)\n\n    ```\n\
    \    [](#cb47-1)x = value\n    ```\n\n### 3.2.3 Rules for object patterns\n\n\
    *   (2a) `{«properties»} ← undefined` (illegal value)\n\n    ```\n    [](#cb48-1)throw\
    \ new TypeError();\n    ```\n\n*   (2b) `{«properties»} ← null` (illegal value)\n\
    \n    ```\n    [](#cb49-1)throw new TypeError();\n    ```\n\n*   (2c) `{key: «pattern»,\
    \ «properties»} ← obj`\n\n    ```\n    [](#cb50-1)«pattern» ← obj.key\n    [](#cb50-2){«properties»}\
    \ ← obj\n    ```\n\n*   (2d) `{key: «pattern» = default_value, «properties»} ←\
    \ obj`\n\n    ```\n    [](#cb51-1)const tmp = obj.key;\n    [](#cb51-2)if (tmp\
    \ !== undefined) {\n    [](#cb51-3)  «pattern» ← tmp\n    [](#cb51-4)} else {\n\
    \    [](#cb51-5)  «pattern» ← default_value\n    [](#cb51-6)}\n    [](#cb51-7){«properties»}\
    \ ← obj\n    ```\n\n*   (2e) `{} ← obj` (no properties left)\n\n    ```\n    [](#cb52-1)//\
    \ We are finished\n    ```\n\nRules 2a and 2b deal with illegal values. Rules\
    \ 2c–2e loop over the properties of the pattern. In rule 2d, we can see that a\
    \ default value provides an alternative to match against if there is no matching\
    \ property in `obj`.\n\n### 3.2.4 Rules for Array patterns\n\n**Array pattern\
    \ and iterable.** The algorithm for Array destructuring starts with an Array pattern\
    \ and an iterable:\n\n*   (3a) `[«elements»] ← non_iterable` (illegal value)\n\
    \n    `if (!isIterable(non_iterable))`\n\n    ```\n    [](#cb53-1)throw new TypeError();\n\
    \    ```\n\n*   (3b) `[«elements»] ← iterable`\n\n    `if (isIterable(iterable))`\n\
    \n    ```\n    [](#cb54-1)const iterator = iterable[Symbol.iterator]();\n    [](#cb54-2)«elements»\
    \ ← iterator\n    ```\n\nHelper function:\n\n```\n[](#cb55-1)function isIterable(value)\
    \ {\n[](#cb55-2)  return (value !== null\n[](#cb55-3)    && typeof value === 'object'\n\
    [](#cb55-4)    && typeof value[Symbol.iterator] === 'function');\n[](#cb55-5)}\n\
    ```\n\n**Array elements and iterator.** The algorithm continues with:\n\n*   The\
    \ elements of the pattern (left-hand side of the arrow)\n\n*   The iterator that\
    \ was obtained from the iterable (right-hand side of the arrow)\n\nThese are the\
    \ rules:\n\n*   (3c) `«pattern», «elements» ← iterator`\n\n    ```\n    [](#cb56-1)«pattern»\
    \ ← getNext(iterator) // undefined after last item\n    [](#cb56-2)«elements»\
    \ ← iterator\n    ```\n\n*   (3d) `«pattern» = default_value, «elements» ← iterator`\n\
    \n    ```\n    [](#cb57-1)const tmp = getNext(iterator);  // undefined after last\
    \ item\n    [](#cb57-2)if (tmp !== undefined) {\n    [](#cb57-3)  «pattern» ←\
