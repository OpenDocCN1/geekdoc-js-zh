    [](#cb123-5)  Object.keys(copy1), [''__proto__'']);

    [](#cb123-6)

    [](#cb123-7)const copy2 = Object.assign({}, original);

    [](#cb123-8)// copy2 has the prototype null

    [](#cb123-9)assert.equal(Object.getPrototypeOf(copy2), null);

    ```


