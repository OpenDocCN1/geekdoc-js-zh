    \ : value);\n[](#cb61-4)}\n```\n\n迭代器完成类似于对象中缺少属性。\n\n## 3.3 空对象模式和空数组模式\n\n算法规则的一个有趣结果：我们可以使用空对象模式和空数组模式进行解构。\n\
    \n给定一个空对象模式 `{}`：如果要解构的值既不是 `undefined` 也不是 `null`，则什么也不会发生。否则，会抛出 `TypeError`。\n\
