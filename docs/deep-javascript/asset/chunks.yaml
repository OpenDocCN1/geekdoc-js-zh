  trans: "\n\n#### 12.3.2.2 历史上的复制操作：jQuery 的 `$.extend()`\n\n[jQuery 的 `$.extend(target,\
    \ source1, source2, ···)`](https://api.jquery.com/jquery.extend/) 与 `Object.extend()`\
    \ 的工作方式类似：\n\n*   它将 `source1` 的所有可枚举自有属性和继承属性复制为 `target` 的自有属性。\n*   然后对 `source2`\
    \ 执行相同操作。\n*   以此类推。\n\n#### 12.3.2.3 基于可枚举性进行复制的缺点\n\n基于可枚举性进行复制存在几个缺点：\n\n*\
    \   虽然可枚举性对于隐藏继承属性很有用，但之所以主要采用这种方式，是因为我们通常只想将自有属性复制为自有属性。通过忽略继承属性可以更好地实现同样的效果。\n\
    *   要复制哪些属性通常取决于当前任务；很少有一个单一标志能适用于所有用例。更好的做法是提供一个带有*谓词*（返回布尔值的回调函数）的复制操作，由它决定何时忽略属性。\n\
    *   可枚举性在复制时方便地隐藏了数组的自有属性 `.length`。但这是一种极其罕见的特殊情况：一个既影响兄弟属性又受兄弟影响的魔法属性。如果我们自己实现这种魔法，我们会使用（继承的）getter\
    \ 和/或 setter，而不是（自有的）数据属性。\n\n#### 12.3.2.4 `Object.assign()` ^([ES5])\n\n在 ES6\
    \ 中，[`Object.assign(target, source_1, source_2, ···)`](https://exploringjs.com/impatient-js/ch_single-objects.html#object.assign)\
    \ 可用于将源对象合并到目标对象。所有源对象的自有可枚举属性（无论是字符串键还是符号键）都会被考虑。`Object.assign()` 使用“get”操作从源对象读取值，使用“set”操作向目标对象写入值。\n\
    \n关于可枚举性，`Object.assign()` 延续了 `Object.extend()` 和 `$.extend()` 的传统。[引用 Yehuda\
    \ Katz 的话](https://mail.mozilla.org/pipermail/es-discuss/2012-October/025934.html)：\n\
    \n> `Object.assign` 将铺平所有已流通的 `extend()` API 的牛道。我们认为，在这些情况下不复制可枚举方法的先例足以让 `Object.assign`\
    \ 采用这种行为。\n\n换句话说：`Object.assign()` 的创建考虑到了从 `$.extend()`（及类似方法）的升级路径。它的方法比 `$.extend`\
    \ 更清晰，因为它忽略了继承属性。\n\n#### 12.3.2.5 一个罕见的例子：复制时非可枚举性有用的情况\n\n非可枚举性有帮助的情况很少。一个罕见的例子是[库\
    \ `fs-extra` 最近遇到的一个问题](https://github.com/jprichardson/node-fs-extra/issues/577)：\n\
    \n*   内置的 Node.js 模块 `fs` 有一个属性 `.promises`，它包含一个对象，该对象提供了基于 Promise 的 `fs` API\
    \ 版本。在该问题出现时，读取 `.promise` 会导致以下警告被记录到控制台：\n\n    ```\n    ExperimentalWarning:\
    \ The fs.promises API is experimental\n    ```\n\n*   除了提供自身功能外，`fs-extra` 还重新导出了\
    \ `fs` 中的所有内容。对于 CommonJS 模块，这意味着将 `fs` 的所有属性复制到 `fs-extra` 的 `module.exports`\
    \ 中（[通过 `Object.assign()`](https://github.com/jprichardson/node-fs-extra/blob/master/lib/index.js)）。当\
    \ `fs-extra` 这样做时，就会触发该警告。这令人困惑，因为每次加载 `fs-extra` 时都会发生。\n\n*   [一个快速修复](https://github.com/nodejs/node/pull/20504)是将属性\
    \ `fs.promises` 设为不可枚举。之后，`fs-extra` 就忽略了它。\n\n### 12.3.3 将属性标记为私有\n\n如果我们将属性设为不可枚举，那么\
    \ `Object.keys()`、`for-in` 循环等就无法再看到它。对于这些机制而言，该属性是私有的。\n\n然而，这种方法存在几个问题：\n\n\
    *   复制对象时，我们通常希望复制私有属性。这与将不应复制的属性设为不可枚举相冲突（参见上一节）。\n*   该属性并非真正私有。获取、设置以及其他几种机制并不区分可枚举和不可枚举属性。\n\
    *   无论是查看源代码还是交互式操作，我们无法立即看出一个属性是否可枚举。命名约定（例如在属性名前加下划线）更容易被发现。\n*   我们无法使用可枚举性来区分公共方法和私有方法，因为原型中的方法默认是不可枚举的。\n\
    \n### 12.3.4 从 `JSON.stringify()` 中隐藏自有属性\n\n`JSON.stringify()` 不会在其输出中包含不可枚举的属性。因此，我们可以利用可枚举性来决定哪些自有属性应导出为\
    \ JSON。这个用例与上一个（将属性标记为私有）类似，但也有不同之处，因为它更侧重于导出，并且需要考虑一些细微差别。例如：能否从 JSON 完全重建对象？\n\
    \n作为可枚举性的替代方案，对象可以实现 `.toJSON()` 方法，`JSON.stringify()` 会将该方法返回的内容序列化为字符串，而不是对象本身。下一个示例演示了其工作原理。\n\
    \n```\n[](#cb247-1)class Point {\n[](#cb247-2)  static fromJSON(json) {\n[](#cb247-3)\
    \    return new Point(json[0], json[1]);\n[](#cb247-4)  }\n[](#cb247-5)  constructor(x,\
    \ y) {\n[](#cb247-6)    this.x = x;\n[](#cb247-7)    this.y = y;\n[](#cb247-8)\
    \  }\n[](#cb247-9)  toJSON() {\n[](#cb247-10)    return [this.x, this.y];\n[](#cb247-11)\
    \  }\n[](#cb247-12)}\n[](#cb247-13)assert.equal(\n[](#cb247-14)  JSON.stringify(new\
    \ Point(8, -3)),\n[](#cb247-15)  '[8,-3]'\n[](#cb247-16));\n```\n\n我认为 `toJSON()`\
    \ 比可枚举性更清晰。它还让我们在存储格式方面拥有更多自由。\n\n## 12.4 结论\n\n我们已经看到，几乎所有非可枚举性的应用都是变通方法，而现在已经有了其他更好的解决方案。\n\
    \n对于我们自己的代码，我们通常可以假装可枚举性不存在：\n\n*   通过对象字面量和赋值创建属性时，总是创建可枚举属性。\n*   通过类创建的原型属性总是不可枚举的。\n\
    \n也就是说，我们自动遵循了最佳实践。\n\n# 13 实例化类的技术\n\n* * *\n\n*   13.1 问题：异步初始化属性\n*   13.2 解决方案：基于\
    \ Promise 的构造函数\n    *   13.2.1 使用立即调用的异步箭头函数\n*   13.3 解决方案：静态工厂方法\n    *   13.3.1 改进：通过秘密令牌实现私有构造函数\n\
    \    *   13.3.2 改进：构造函数抛出异常，工厂方法借用类原型\n    *   13.3.3 改进：实例默认处于非活动状态，由工厂方法激活\n\
    \    *   13.3.4 变体：独立的工厂函数\n*   13.4 子类化基于 Promise 的构造函数（可选）\n*   13.5 结论\n* \
    \  13.6 延伸阅读\n\n* * *\n\n在本章中，我们将通过多次解决一个具体问题来探讨创建类实例的几种方法：构造函数、工厂函数等。本章的重点是类，因此忽略了类的替代方案。\n\
    \n## 13.1 问题：异步初始化属性\n\n"
- fmt: "\nThe following container class is supposed to receive the contents of its\
    \ property `.data` asynchronously. This is our first attempt:\n\n```\nclass DataContainer\
    \ {\n  #data; // (A)\n  constructor() {\n    Promise.resolve('downloaded')\n \
    \     .then(data => this.#data = data); // (B)\n  }\n  getData() {\n    return\
    \ 'DATA: '+this.#data; // (C)\n  }\n}\n```\n\nKey issue of this code: Property\
    \ `.data` is initially `undefined`.\n\n```\nconst dc = new DataContainer();\n\
    assert.equal(dc.getData(), 'DATA: undefined');\nsetTimeout(() => assert.equal(\n\
    \  dc.getData(), 'DATA: downloaded'), 0);\n```\n\nIn line A, we declare the [private\
    \ field](https://2ality.com/2019/07/private-class-fields.html) `.#data` that we\
    \ use in line B and line C.\n\nThe `Promise` inside the constructor of `DataContainer`\
    \ is settled asynchronously, which is why we can only see the final value of `.data`\
    \ if we finish the current task and start a new one, via `setTimeout()`. In other\
    \ words, the instance of `DataContainer` is not completely initialized, yet, when\
    \ we first see it.\n\n## 13.2 Solution: Promise-based constructor\n\nWhat if we\
    \ delay access to the instance of `DataContainer` until it is fully initialized?\
    \ We can achieve that by returning a `Promise` from the constructor. By default,\
    \ a constructor returns a new instance of the class that it is part of. We can\
    \ override that if we explicitly return an object:\n\n```\nclass DataContainer\
    \ {\n  #data;\n  constructor() {\n    return Promise.resolve('downloaded')\n \
    \     .then(data => {\n        this.#data = data;\n        return this; // (A)\n\
    \      });\n  }\n  getData() {\n    return 'DATA: '+this.#data;\n  }\n}\nnew DataContainer()\n\
    \  .then(dc => assert.equal( // (B)\n    dc.getData(), 'DATA: downloaded'));\n\
    ```\n\nNow we have to wait until we can access our instance (line B). It is passed\
    \ on to us after the data is “downloaded” (line A). There are two possible sources\
    \ of errors in this code:\n\n*   The download may fail and produce a rejection.\n\
    \n*   An exception may be thrown in the body of the first `.then()` callback.\n\
    \nIn either case, the errors become rejections of the `Promise` that is returned\
    \ from the constructor.\n\nPros and cons:\n\n*   A benefit of this approach is\
    \ that we can only access the instance once it is fully initialized. And there\
    \ is no other way of creating instances of `DataContainer`.\n\n*   A disadvantage\
    \ is that it may be surprising to have a constructor return a `Promise` instead\
    \ of an instance.\n\n### 13.2.1 Using an immediately-invoked asynchronous arrow\
    \ function\n\nInstead of using the `Promise` API directly to create the `Promise`\
    \ that is returned from the constructor, we can also use an asynchronous arrow\
    \ function that [we invoke immediately](https://exploringjs.com/impatient-js/ch_async-functions.html#immediately-invoked-async-arrow-functions):\n\
    \n```\nconstructor() {\n  return (async () => {\n    this.#data = await Promise.resolve('downloaded');\n\
    \    return this;\n  })();\n}\n```\n\n## 13.3 Solution: static factory method\n\
    \nA *static factory method* of a class `C` creates instances of `C` and is an\
    \ alternative to using `new C()`. Common names for static factory methods in JavaScript:\n\
    \n*   `.create()`: Creates a new instance. Example: `Object.create()`\n\n*   `.from()`:\
    \ Creates a new instance based on a different object, by copying and/or converting\
    \ it. Example: `Array.from()`\n\n*   `.of()`: Creates a new instance by assembling\
    \ values specified via arguments. Example: `Array.of()`\n\nIn the following example,\
    \ `DataContainer.create()` is a static factory method. It returns `Promise`s for\
    \ instances of `DataContainer`:\n\n```\nclass DataContainer {\n  #data;\n  static\
    \ async create() {\n    const data = await Promise.resolve('downloaded');\n  \
    \  return new this(data);\n  }\n  constructor(data) {\n    this.#data = data;\n\
    \  }\n  getData() {\n    return 'DATA: '+this.#data;\n  }\n}\nDataContainer.create()\n\
    \  .then(dc => assert.equal(\n    dc.getData(), 'DATA: downloaded'));\n```\n\n\
    This time, all asynchronous functionality is contained in `.create()`, which enables\
    \ the rest of the class to be completely synchronous and therefore simpler.\n\n\
    Pros and cons:\n\n*   A benefit of this approach is that the constructor becomes\
    \ simple.\n\n*   A disadvantage of this approach is that it’s now possible to\
    \ create instances that are incorrectly set up, via `new DataContainer()`.\n\n\
    ### 13.3.1 Improvement: private constructor via secret token\n\nIf we want to\
    \ ensure that instances are always correctly set up, we must ensure that only\
    \ `DataContainer.create()` can invoke the constructor of `DataContainer`. We can\
    \ achieve that via a secret token:\n\n```\nconst secretToken = Symbol('secretToken');\n\
    class DataContainer {\n  #data;\n  static async create() {\n    const data = await\
    \ Promise.resolve('downloaded');\n    return new this(secretToken, data);\n  }\n\
    \  constructor(token, data) {\n    if (token !== secretToken) {\n      throw new\
    \ Error('Constructor is private');\n    }\n    this.#data = data;\n  }\n  getData()\
    \ {\n    return 'DATA: '+this.#data;\n  }\n}\nDataContainer.create()\n  .then(dc\
    \ => assert.equal(\n    dc.getData(), 'DATA: downloaded'));\n```\n\nIf `secretToken`\
    \ and `DataContainer` reside in the same module and only the latter is exported,\
    \ then outside parties don’t have access to `secretToken` and therefore can’t\
    \ create instances of `DataContainer`.\n\nPros and cons:\n\n*   Benefit: safe\
    \ and straightforward.\n\n*   Disadvantage: slightly verbose.\n\n### 13.3.2 Improvement:\
    \ constructor throws, factory method borrows the class prototype\n\nThe following\
    \ variant of our solution disables the constructor of `DataContainer` and uses\
    \ a trick to create instances of it another way (line A):\n\n```\nclass DataContainer\
    \ {\n  static async create() {\n    const data = await Promise.resolve('downloaded');\n\
    \    return Object.create(this.prototype)._init(data); // (A)\n  }\n  constructor()\
    \ {\n    throw new Error('Constructor is private');\n  }\n  _init(data) {\n  \
    \  this._data = data;\n    return this;\n  }\n  getData() {\n    return 'DATA:\
    \ '+this._data;\n  }\n}\nDataContainer.create()\n  .then(dc => {\n    assert.equal(dc\
    \ instanceof DataContainer, true); // (B)\n    assert.equal(\n      dc.getData(),\
    \ 'DATA: downloaded');\n  });\n```\n\nInternally, an instance of `DataContainer`\
    \ is any object whose prototype is `DataContainer.prototype`. That’s why we can\
    \ create instances via `Object.create()` (line A) and that’s why `instanceof`\
    \ works in line B.\n\nPros and cons:\n\n*   Benefit: elegant; `instanceof` works.\n\
    \n*   Disadvantages:\n\n    *   Creating instances is not completely prevented.\
    \ To be fair, though, the work-around via `Object.create()` can also be used for\
    \ our previous solutions.\n\n    *   We can’t use [private fields](https://2ality.com/2019/07/private-class-fields.html)\
    \ and [private methods](https://2ality.com/2019/07/private-methods-accessors-in-classes.html)\
    \ in `DataContainer`, because those are only set up correctly for instances that\
    \ were created via the constructor.\n"
