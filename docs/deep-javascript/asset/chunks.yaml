    *   The names of named function expressions are set up via `SetFunctionName()`.
    That operation is not invoked when [creating anonymous function expressions](https://tc39.es/ecma262/#sec-function-definitions-runtime-semantics-evaluation).

    *   The names of function declarations are set up [elsewhere](https://tc39.es/ecma262/#sec-function-definitions-runtime-semantics-instantiatefunctionobject),
    when entering a scope (early activation).

    *   Additionally, the spec [explicitly states](https://tc39.es/ecma262/#sec-function-instances-name):
    “Anonymous functions objects that do not have a contextual name associated with
    them by this specification do not have a `"name"` own property but inherit the
    `"name"` property of `%Function.prototype%`.”


    *   [When an arrow function is created](https://tc39.es/ecma262/#sec-arrow-function-definitions-runtime-semantics-evaluation),
    no name is set up, either (`SetFunctionName()` is not invoked).


    Most JavaScript engines diverge from the spec and do create own properties `.name`
    for anonymous functions:


    ```

    > Reflect.ownKeys(() => {})

    [ ''length'', ''name'' ]

    ```

