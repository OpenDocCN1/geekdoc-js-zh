    \n* * *\n\nThis chapter answers the following questions:\n\n*   What is shared\
    \ mutable state?\n\n*   Why is it problematic?\n\n*   How can its problems be\
    \ avoided?\n\n## 8.1 What is shared mutable state and why is it problematic?\n\
    \nShared mutable state works as follows:\n\n*   If two or more parties can change\
    \ the same data (variables, objects, etc.).\n\n*   And if their lifetimes overlap.\n\
    \n*   Then there is a risk of one party’s modifications preventing other parties\
    \ from working correctly.\n\nNote that this definition applies to function calls,\
    \ cooperative multitasking (e.g., async functions in JavaScript), etc. The risks\
    \ are similar in each case.\n\nThe following code is an example. The example is\
    \ not realistic, but it demonstrates the risks and is easy to understand:\n\n\
    ```\n[](#cb143-1)function logElements(arr) {\n[](#cb143-2)  while (arr.length\
    \ > 0) {\n[](#cb143-3)    console.log(arr.shift());\n[](#cb143-4)  }\n[](#cb143-5)}\n\
    [](#cb143-6)\n[](#cb143-7)function main() {\n[](#cb143-8)  const arr = ['banana',\
    \ 'orange', 'apple'];\n[](#cb143-9)\n[](#cb143-10)  console.log('Before sorting:');\n\
    [](#cb143-11)  logElements(arr);\n[](#cb143-12)\n[](#cb143-13)  arr.sort(); //\
    \ changes arr\n[](#cb143-14)\n[](#cb143-15)  console.log('After sorting:');\n\
    [](#cb143-16)  logElements(arr); // (A)\n[](#cb143-17)}\n[](#cb143-18)main();\n\
    [](#cb143-19)\n[](#cb143-20)// Output:\n[](#cb143-21)// 'Before sorting:'\n[](#cb143-22)//\
    \ 'banana'\n[](#cb143-23)// 'orange'\n[](#cb143-24)// 'apple'\n[](#cb143-25)//\
    \ 'After sorting:'\n```\n\nIn this case, there are two independent parties:\n\n\
    *   Function `main()` wants to log an Array before and after sorting it.\n\n*\
    \   Function `logElements()` logs the elements of its parameter `arr`, but removes\
    \ them while doing so.\n\n`logElements()` breaks `main()` and causes it to log\
    \ an empty Array in line A.\n\nIn the remainder of this chapter, we look at three\
    \ ways of avoiding the problems of shared mutable state:\n\n*   Avoiding sharing\
    \ by copying data\n\n*   Avoiding mutations by updating non-destructively\n\n\
    *   Preventing mutations by making data immutable\n\nIn particular, we will come\
    \ back to the example that we’ve just seen and fix it.\n\n## 8.2 Avoiding sharing\
    \ by copying data\n\nCopying data is one way of avoiding sharing it.\n\n![](media/file0.svg) \
    \ **Background**\n\nFor background on copying data in JavaScript, please refer\
    \ to the following two chapters in this book:\n\n*   [§6 “Copying objects and\
    \ Arrays”](#ch007.xhtml_ch_copying-objects-and-arrays)\n\n*   [§14 “Copying instances\
    \ of classes: `.clone()` vs. copy constructors”](#ch015.xhtml_ch_copying-class-instances)\n\
    \n### 8.2.1 How does copying help with shared mutable state?\n\nAs long as we\
    \ only *read* from shared state, we don’t have any problems. Before *modifying*\
    \ it, we need to “un-share” it, by copying it (as deeply as necessary).\n\n*Defensive\
    \ copying* is a technique to always copy when issues *might* arise. Its objective\
    \ is to keep the current entity (function, class, etc.) safe:\n\n*   Input: Copying\
    \ (potentially) shared data passed to us, lets us use that data without being\
    \ disturbed by an external entity.\n\n*   Output: Copying internal data before\
    \ exposing it to an outside party, means that that party can’t disrupt our internal\
    \ activity.\n\nNote that these measures protect us from other parties, but they\
    \ also protect other parties from us.\n\nThe next sections illustrate both kinds\
    \ of defensive copying.\n\n#### 8.2.1.1 Copying shared input\n\nRemember that\
    \ in the motivating example at the beginning of this chapter, we got into trouble\
    \ because `logElements()` modified its parameter `arr`:\n\n```\n[](#cb144-1)function\
    \ logElements(arr) {\n[](#cb144-2)  while (arr.length > 0) {\n[](#cb144-3)   \
    \ console.log(arr.shift());\n[](#cb144-4)  }\n[](#cb144-5)}\n```\n\nLet’s add\
    \ defensive copying to this function:\n\n```\n[](#cb145-1)function logElements(arr)\
    \ {\n[](#cb145-2)  arr = [...arr]; // defensive copy\n[](#cb145-3)  while (arr.length\
    \ > 0) {\n[](#cb145-4)    console.log(arr.shift());\n[](#cb145-5)  }\n[](#cb145-6)}\n\
    ```\n\nNow `logElements()` doesn’t cause problems anymore, if it is called inside\
    \ `main()`:\n\n```\n[](#cb146-1)function main() {\n[](#cb146-2)  const arr = ['banana',\
    \ 'orange', 'apple'];\n[](#cb146-3)\n[](#cb146-4)  console.log('Before sorting:');\n\
    [](#cb146-5)  logElements(arr);\n[](#cb146-6)\n[](#cb146-7)  arr.sort(); // changes\
    \ arr\n[](#cb146-8)\n[](#cb146-9)  console.log('After sorting:');\n[](#cb146-10)\
    \  logElements(arr); // (A)\n[](#cb146-11)}\n[](#cb146-12)main();\n[](#cb146-13)\n\
    [](#cb146-14)// Output:\n[](#cb146-15)// 'Before sorting:'\n[](#cb146-16)// 'banana'\n\
    [](#cb146-17)// 'orange'\n[](#cb146-18)// 'apple'\n[](#cb146-19)// 'After sorting:'\n\
    [](#cb146-20)// 'apple'\n[](#cb146-21)// 'banana'\n[](#cb146-22)// 'orange'\n\
    ```\n\n#### 8.2.1.2 Copying exposed internal data\n\nLet’s start with a class\
    \ `StringBuilder` that doesn’t copy internal data it exposes (line A):\n"
