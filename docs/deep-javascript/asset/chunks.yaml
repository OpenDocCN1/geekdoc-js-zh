    \    *   9.1.3 [Property attributes](#ch010.xhtml_property-attributes)\n*   9.2 [Property\
    \ descriptors](#ch010.xhtml_property-descriptors)\n*   9.3 [Retrieving descriptors\
    \ for properties](#ch010.xhtml_retrieving-descriptors-for-properties)\n    * \
