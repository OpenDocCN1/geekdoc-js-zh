    \n当前价格为优惠价。随着内容增加，价格将会上涨。\n\n## 1.4 如何预览内容？\n\n[在本书的主页上](https://exploringjs.com/deep-js/#previews)，有本书所有版本的广泛预览。\n\
    \n## 1.5 如何报告错误？\n\n*   本书的 HTML 版本在每个章节末尾都有指向评论的链接。\n*   它们会跳转到 GitHub 问题，[您也可以直接访问](https://github.com/rauschma/deep-js/issues)。\n\
