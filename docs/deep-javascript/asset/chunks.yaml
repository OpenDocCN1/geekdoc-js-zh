    *   12.2 [The enumerability of pre-defined and created properties](#ch013.xhtml_the-enumerability-of-pre-defined-and-created-properties)\n\
    *   12.3 [Use cases for enumerability](#ch013.xhtml_use-cases-for-enumerability)\n\
    \    *   12.3.1 [Use case: Hiding properties from the `for-in` loop](#ch013.xhtml_for-in-loop)\n\
