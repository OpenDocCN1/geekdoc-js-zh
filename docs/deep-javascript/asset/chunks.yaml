  trans: "\n`copy constructor`（复制构造函数）是一种构造函数，它使用当前类的另一个实例来初始化当前实例。复制构造函数在 C++ 和 Java\
    \ 等静态语言中很常见，在这些语言中，你可以通过`static overloading`（静态重载）提供多个版本的构造函数。这里的`static`意味着在编译时决定使用哪个版本。\n\
    \n在 JavaScript 中，我们必须在运行时做出这个决定，这会导致代码不够优雅：\n\n```\n[](#cb260-1)class Point {\n\
    [](#cb260-2)  constructor(...args) {\n[](#cb260-3)    if (args[0] instanceof Point)\
    \ {\n[](#cb260-4)      // 复制构造函数\n[](#cb260-5)      const [other] = args;\n[](#cb260-6)\
    \      this.x = other.x;\n[](#cb260-7)      this.y = other.y;\n[](#cb260-8)  \
    \  } else {\n[](#cb260-9)      const [x, y] = args;\n[](#cb260-10)      this.x\
    \ = x;\n[](#cb260-11)      this.y = y;\n[](#cb260-12)    }\n[](#cb260-13)  }\n\
    [](#cb260-14)}\n```\n\n以下是使用这个类的方式：\n\n```\n[](#cb261-1)const original = new Point(-1,\
    \ 4);\n[](#cb261-2)const copy = new Point(original);\n[](#cb261-3)assert.deepEqual(copy,\
    \ original);\n```\n\n`Static factory methods`（静态工厂方法）是构造函数的替代方案，在这种情况下效果更好，因为我们可以直接调用所需的功能。（这里的`static`意味着这些工厂方法是类方法。）\n\
    \n在下面的例子中，三个类`Point`、`Color`和`ColorPoint`各自都有一个静态工厂方法`.from()`：\n\n```\n[](#cb262-1)class\
    \ Point {\n[](#cb262-2)  constructor(x, y) {\n[](#cb262-3)    this.x = x;\n[](#cb262-4)\
    \    this.y = y;\n[](#cb262-5)  }\n[](#cb262-6)  static from(other) {\n[](#cb262-7)\
    \    return new Point(other.x, other.y);\n[](#cb262-8)  }\n[](#cb262-9)}\n[](#cb262-10)class\
    \ Color {\n[](#cb262-11)  constructor(name) {\n[](#cb262-12)    this.name = name;\n\
    [](#cb262-13)  }\n[](#cb262-14)  static from(other) {\n[](#cb262-15)    return\
    \ new Color(other.name);\n[](#cb262-16)  }\n[](#cb262-17)}\n[](#cb262-18)class\
    \ ColorPoint extends Point {\n[](#cb262-19)  constructor(x, y, color) {\n[](#cb262-20)\
    \    super(x, y);\n[](#cb262-21)    this.color = color;\n[](#cb262-22)  }\n[](#cb262-23)\
    \  static from(other) {\n[](#cb262-24)    return new ColorPoint(\n[](#cb262-25)\
    \      other.x, other.y, Color.from(other.color)); // (A)\n[](#cb262-26)  }\n\
    [](#cb262-27)}\n```\n\n在第 A 行，我们再次递归地进行复制。\n\n以下是`ColorPoint.from()`的工作方式：\n\n\
    ```\n[](#cb263-1)const original = new ColorPoint(-1, 4, new Color('red'));\n[](#cb263-2)const\
    \ copy = ColorPoint.from(original);\n[](#cb263-3)assert.deepEqual(copy, original);\n\
    ```\n\n## 14.3 致谢\n\n*   [Ron Korvig](https://github.com/ronkorving) 提醒我在 JavaScript\
    \ 中应使用静态工厂方法而非重载构造函数来进行深拷贝。\n\n# 15 集合的不可变包装器\n\n* * *\n\n*   15.1 包装对象\n\n  \
    \  *   15.1.1 通过包装使集合不可变\n\n*   15.2 Map 的不可变包装器\n\n*   15.3 Array 的不可变包装器\n\n\
    * * *\n\n集合的不可变包装器通过将集合包装在一个新对象中，使其变得不可变。在本章中，我们将探讨其工作原理以及为什么它很有用。\n\n## 15.1 包装对象\n\
    \n如果有一个对象，我们希望减少其接口，可以采取以下方法：\n\n*   创建一个新对象，将原始对象存储在私有字段中。这个新对象被称为“包装”了原始对象。新对象称为`wrapper`（包装器），原始对象称为`wrapped\
    \ object`（被包装对象）。\n\n*   包装器只将接收到的部分方法调用转发给被包装对象。\n\n这就是包装的样子：\n\n```\n[](#cb264-1)class\
    \ Wrapper {\n[](#cb264-2)  #wrapped;\n[](#cb264-3)  constructor(wrapped) {\n[](#cb264-4)\
    \    this.#wrapped = wrapped;\n[](#cb264-5)  }\n[](#cb264-6)  allowedMethod1(...args)\
    \ {\n[](#cb264-7)    return this.#wrapped.allowedMethod1(...args);\n[](#cb264-8)\
    \  }\n[](#cb264-9)  allowedMethod2(...args) {\n[](#cb264-10)    return this.#wrapped.allowedMethod2(...args);\n\
    [](#cb264-11)  }\n[](#cb264-12)}\n```\n\n相关的软件设计模式：\n\n*   包装与[四人组设计模式`Facade`（外观模式）](https://en.wikipedia.org/wiki/Facade_pattern)相关。\n\
    \n*   我们使用[`forwarding`（转发）](https://en.wikipedia.org/wiki/Forwarding_(object-oriented_programming))来实现[`delegation`（委托）](https://en.wikipedia.org/wiki/Delegation_pattern)。委托意味着一个对象让另一个对象（`delegate`，委托对象）处理其部分工作。它是继承的一种替代方案，用于共享代码。\n\
    \n### 15.1.1 通过包装使集合不可变\n\n要使集合不可变，我们可以使用包装，并从其接口中移除所有破坏性操作。\n\n这种技术的一个重要用例是：一个对象拥有内部可变数据结构，希望在不复制的情况下安全地导出它。导出是“实时的”也可能是一个目标。该对象可以通过包装内部数据结构并使其不可变来实现其目标。\n\
    \n接下来的两节展示了 Map 和 Array 的不可变包装器。它们都有以下限制：\n\n*   它们是草图。需要更多工作才能使其适用于实际使用：更好的检查、支持更多方法等。\n\
    \n*   它们只进行浅层操作：每个包装器使被包装对象不可变，但不会使其返回的数据不可变。这可以通过包装方法返回的部分结果来修复。\n\n## 15.2 Map\
    \ 的不可变包装器\n\n类`ImmutableMapWrapper`为 Map 生成包装器：\n\n```\n[](#cb265-1)class ImmutableMapWrapper\
    \ {\n[](#cb265-2)  static _setUpPrototype() {\n[](#cb265-3)    // 只将非破坏性方法转发给被包装的\
    \ Map：\n[](#cb265-4)    for (const methodName of ['get', 'has', 'keys', 'size'])\
    \ {\n[](#cb265-5)      ImmutableMapWrapper.prototype[methodName] = function (...args)\
    \ {\n[](#cb265-6)        return this.#wrappedMapmethodName;\n[](#cb265-7)    \
    \  }\n[](#cb265-8)    }\n[](#cb265-9)  }\n[](#cb265-10)\n[](#cb265-11)  #wrappedMap;\n\
    [](#cb265-12)  constructor(wrappedMap) {\n[](#cb265-13)    this.#wrappedMap =\
    \ wrappedMap;\n[](#cb265-14)  }\n[](#cb265-15)}\n[](#cb265-16)ImmutableMapWrapper._setUpPrototype();\n\
    ```\n\n原型的设置必须通过静态方法执行，因为我们只能从类内部访问私有字段`.#wrappedMap`。\n\n以下是`ImmutableMapWrapper`的实际使用：\n\
    \n```\n[](#cb266-1)const map = new Map([[false, 'no'], [true, 'yes']]);\n[](#cb266-2)const\
    \ wrapped = new ImmutableMapWrapper(map);\n[](#cb266-3)\n[](#cb266-4)// 非破坏性操作正常工作：\n\
    [](#cb266-5)assert.equal(\n[](#cb266-6)  wrapped.get(true), 'yes');\n[](#cb266-7)assert.equal(\n\
    [](#cb266-8)  wrapped.has(false), true);\n[](#cb266-9)assert.deepEqual(\n[](#cb266-10)\
    \  [...wrapped.keys()], [false, true]);\n[](#cb266-11)\n[](#cb266-12)// 破坏性操作不可用：\n\
    [](#cb266-13)assert.throws(\n[](#cb266-14)  () => wrapped.set(false, 'never!'),\n\
    [](#cb266-15)  /^TypeError: wrapped.set is not a function$/);\n[](#cb266-16)assert.throws(\n\
    [](#cb266-17)  () => wrapped.clear(),\n[](#cb266-18)  /^TypeError: wrapped.clear\
    \ is not a function$/);\n```\n\n## 15.3 Array 的不可变包装器\n\n对于数组`arr`，普通的包装是不够的，因为我们不仅需要拦截方法调用，还需要拦截属性访问，例如`arr[1]\
    \ = true`。[JavaScript 代理](https://exploringjs.com/es6/ch_proxies.html)使我们能够做到这一点：\n\
    \n"
- fmt: "\n```\nconst RE_INDEX_PROP_KEY = /^[0-9]+$/;\nconst ALLOWED_PROPERTIES = new\
    \ Set([\n  'length', 'constructor', 'slice', 'concat']);\n\nfunction wrapArrayImmutably(arr)\
    \ {\n  const handler = {\n    get(target, propKey, receiver) {\n      // We assume\
    \ that propKey is a string (not a symbol)\n      if (RE_INDEX_PROP_KEY.test(propKey)\
    \ // simplified check!\n        || ALLOWED_PROPERTIES.has(propKey)) {\n      \
    \    return Reflect.get(target, propKey, receiver);\n      }\n      throw new\
    \ TypeError(`Property \"${propKey}\" can’t be accessed`);\n    },\n    set(target,\
    \ propKey, value, receiver) {\n      throw new TypeError('Setting is not allowed');\n\
    \    },\n    deleteProperty(target, propKey) {\n      throw new TypeError('Deleting\
    \ is not allowed');\n    },\n  };\n  return new Proxy(arr, handler);\n}\n```\n\
    \nLet’s wrap an Array:\n\n```\nconst arr = ['a', 'b', 'c'];\nconst wrapped = wrapArrayImmutably(arr);\n\
    \n// Non-destructive operations are allowed:\nassert.deepEqual(\n  wrapped.slice(1),\
    \ ['b', 'c']);\nassert.equal(\n  wrapped[1], 'b');\n\n// Destructive operations\
    \ are not allowed:\nassert.throws(\n  () => wrapped[1] = 'x',\n  /^TypeError:\
    \ Setting is not allowed$/);\nassert.throws(\n  () => wrapped.shift(),\n  /^TypeError:\
    \ Property \"shift\" can’t be accessed$/);\n```\n\n# 16 Regular expressions: lookaround\
    \ assertions by example\n\n* * *\n\n*   16.1 [Cheat sheet: lookaround assertions](#ch017.xhtml_cheat-sheet-lookaround-assertions)\n\
    *   16.2 [Warnings for this chapter](#ch017.xhtml_warnings-for-this-chapter)\n\
    *   16.3 [Example: Specifying what comes before or after a match (positive lookaround)](#ch017.xhtml_example-specifying-what-comes-before-or-after-a-match-positive-lookaround)\n\
    *   16.4 [Example: Specifying what does not come before or after a match (negative\
    \ lookaround)](#ch017.xhtml_example-specifying-what-does-not-come-before-or-after-a-match-negative-lookaround)\n\
    \    *   16.4.1 [There are no simple alternatives to negative lookaround assertions](#ch017.xhtml_there-are-no-simple-alternatives-to-negative-lookaround-assertions)\n\
    *   16.5 [Interlude: pointing lookaround assertions inward](#ch017.xhtml_interlude-pointing-lookaround-assertions-inward)\n\
    *   16.6 [Example: match strings not starting with `'abc'`](#ch017.xhtml_example-match-strings-not-starting-with-abc)\n\
    *   16.7 [Example: match substrings that do not contain `'.mjs'`](#ch017.xhtml_example-match-substrings-that-do-not-contain-.mjs)\n\
    *   16.8 [Example: skipping lines with comments](#ch017.xhtml_example-skipping-lines-with-comments)\n\
    *   16.9 [Example: smart quotes](#ch017.xhtml_example-smart-quotes)\n    *   16.9.1 [Supporting\
    \ escaping via backslashes](#ch017.xhtml_supporting-escaping-via-backslashes)\n\
    *   16.10 [Acknowledgements](#ch017.xhtml_acknowledgements-1)\n*   16.11 [Further\
    \ reading](#ch017.xhtml_further-reading-4)\n\n* * *\n\nIn this chapter we use\
    \ examples to explore lookaround assertions in regular expressions. A lookaround\
    \ assertion is non-capturing and must match (or not match) what comes before (or\
    \ after) the current location in the input string.\n\n## 16.1 Cheat sheet: lookaround\
    \ assertions\n\nTable 4: Overview of available lookaround assertions.\n\n| Pattern\
    \ | Name |  |\n| --- | --- | --- |\n| `(?=«pattern»)` | Positive lookahead | ES3\
    \ |\n| `(?!«pattern»)` | Negative lookahead | ES3 |\n| `(?<=«pattern»)` | Positive\
    \ lookbehind | ES2018 |\n| `(?<!«pattern»)` | Negative lookbehind | ES2018 |\n\
    \nThere are four lookaround assertions (tbl. [4](#ch017.xhtml_tbl:lookaround-assertions-overview))\n\
    \n*   Lookahead assertions (ECMAScript 3):\n    *   Positive lookahead: `(?=«pattern»)`\
    \ matches if `pattern` matches what comes after the current location in the input\
    \ string.\n    *   Negative lookahead: `(?!«pattern»)` matches if `pattern` does\
    \ not match what comes after the current location in the input string.\n*   Lookbehind\
    \ assertions (ECMAScript 2018):\n    *   Positive lookbehind: `(?<=«pattern»)`\
    \ matches if `pattern` matches what comes before the current location in the input\
    \ string.\n    *   Negative lookbehind: `(?<!«pattern»)` matches if `pattern`\
    \ does not match what comes before the current location in the input string.\n\
    \n## 16.2 Warnings for this chapter\n\n*   The examples show what can be achieved\
    \ via lookaround assertions. However, regular expression aren’t always the best\
    \ solution. Another technique, such as proper parsing, may be a better choice.\n\
    *   Lookbehind assertions are a relatively new feature that may not be supported\
    \ by all JavaScript engines you are targeting.\n*   Lookaround assertions may\
    \ affect performance negatively, especially if their patterns match long strings.\n\
    \n## 16.3 Example: Specifying what comes before or after a match (positive lookaround)\n\
    \nIn the following interaction, we extract quoted words:\n\n```\n> 'how \"are\"\
    \ \"you\" doing'.match(/(?<=\")[a-z]+(?=\")/g)\n[ 'are', 'you' ]\n```\n\nTwo lookaround\
    \ assertions help us here:\n\n*   `(?<=\")` “must be preceded by a quote”\n* \
    \  `(?=\")` “must be followed by a quote”\n\nLookaround assertions are especially\
    \ convenient for `.match()` in `/g` mode, which returns whole matches (capture\
    \ group 0). Whatever the pattern of a lookaround assertion matches is not captured.\
    \ Without lookaround assertions, the quotes show up in the result:\n\n```\n> 'how\
    \ \"are\" \"you\" doing'.match(/\"([a-z]+)\"/g)\n[ '\"are\"', '\"you\"' ]\n```\n\
    \n## 16.4 Example: Specifying what does not come before or after a match (negative\
    \ lookaround)\n\nHow can we achieve the opposite of what we did in the previous\
    \ section and extract all unquoted words from a string?\n\n*   Input: `'how \"\
    are\" \"you\" doing'`\n*   Output: `['how', 'doing']`\n\nOur first attempt is\
    \ to simply convert positive lookaround assertions to negative lookaround assertions.\
    \ Alas, that fails:\n\n```\n> 'how \"are\" \"you\" doing'.match(/(?<!\")[a-z]+(?!\"\
    )/g)\n[ 'how', 'r', 'o', 'doing' ]\n```\n\nThe problem is that we extract sequences\
    \ of characters that are not bracketed by quotes. That means that in the string\
    \ `'\"are\"'`, the “r” in the middle is considered unquoted, because it is preceded\
    \ by an “a” and followed by an “e”.\n\nWe can fix this by stating that prefix\
    \ and suffix must be neither quote nor letter:\n\n```\n> 'how \"are\" \"you\"\
    \ doing'.match(/(?<![\"a-z])[a-z]+(?![\"a-z])/g)\n[ 'how', 'doing' ]\n```\n\n\
    Another solution is to demand via `\\b` that the sequence of characters `[a-z]+`\
    \ start and end at word boundaries:\n\n```\n> 'how \"are\" \"you\" doing'.match(/(?<!\"\
    )\\b[a-z]+\\b(?!\")/g)\n[ 'how', 'doing' ]\n```\n\nOne thing that is nice about\
    \ negative lookbehind and negative lookahead is that they also work at the beginning\
    \ or end, respectively, of a string – as demonstrated in the example.\n\n### 16.4.1 There\
    \ are no simple alternatives to negative lookaround assertions\n\nNegative lookaround\
    \ assertions are a powerful tool and usually impossible to emulate via other regular\
    \ expression means.\n\nIf we don’t want to use them, we normally have to take\
    \ a completely different approach. For example, in this case, we could split the\
    \ string into (quoted and unquoted) words and then filter those:\n\n```\nconst\
    \ str = 'how \"are\" \"you\" doing';\n\nconst allWords = str.match(/\"?[a-z]+\"\
    ?/g);\nconst unquotedWords = allWords.filter(\n  w => !w.startsWith('\"') || !w.endsWith('\"\
    '));\nassert.deepEqual(unquotedWords, ['how', 'doing']);\n```\n\nBenefits of this\
    \ approach:\n\n*   It works on older engines.\n*   It is easy to understand.\n\
    \n## 16.5 Interlude: pointing lookaround assertions inward\n"
