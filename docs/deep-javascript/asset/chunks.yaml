    \ 初始为待定。如果兑现它，则变为已兑现。如果拒绝它，则变为已拒绝。\n\n我们从 Promise 状态如何工作的简化版本开始（图 2）：\n\n*   Promise\
    \ 初始为 *待定*（pending）。\n*   如果 Promise 被 *兑现*（resolved）为一个值 `v`，则变为 *已兑现*（fulfilled）（稍后我们会看到兑现也可能导致拒绝）。`v`\
    \ 现在是 Promise 的 *兑现值*。\n*   如果 Promise 被 *拒绝*（rejected）为一个错误 `e`，则变为 *已拒绝*（rejected）。`e`\
    \ 现在是 Promise 的 *拒绝值*。\n\n## 18.2 版本 1：独立 Promise\n\n我们的第一个实现是一个功能最简的独立 Promise：\n\
    \n*   我们可以创建一个 Promise。\n*   我们可以兑现或拒绝一个 Promise，并且只能执行一次。\n*   我们可以通过 `.then()`\
    \ 注册 *反应*（回调）。无论 Promise 是否已被敲定，注册都必须正确工作。\n*   `.then()` 目前不支持链式调用——它不返回任何内容。\n\
    \n`ToyPromise1` 是一个具有三个原型方法的类：\n\n*   `ToyPromise1.prototype.resolve(value)`\n\
    *   `ToyPromise1.prototype.reject(reason)`\n*   `ToyPromise1.prototype.then(onFulfilled,\
    \ onRejected)`\n\n也就是说，`resolve` 和 `reject` 是方法（而不是传递给构造函数回调参数的函数）。\n\n以下是第一个实现的使用方式：\n\
    \n```\n[](#cb306-1)// .resolve() 在 .then() 之前\n[](#cb306-2)const tp1 = new ToyPromise1();\n\
    [](#cb306-3)tp1.resolve('abc');\n[](#cb306-4)tp1.then((value) => {\n[](#cb306-5)\
    \  assert.equal(value, 'abc');\n[](#cb306-6)});\n```\n\n```\n[](#cb307-1)// .then()\
    \ 在 .resolve() 之前\n[](#cb307-2)const tp2 = new ToyPromise1();\n[](#cb307-3)tp2.then((value)\
    \ => {\n[](#cb307-4)  assert.equal(value, 'def');\n[](#cb307-5)});\n[](#cb307-6)tp2.resolve('def');\n\
    ```\n\n图 3 说明了我们的第一个 `ToyPromise` 是如何工作的。\n\n![](img/file0.svg)  **Promise 数据流图是可选的**\n\
    \n这些图的目的是提供一种可视化解释来说明 Promise 的工作原理。但它们是可选的。如果你觉得它们令人困惑，可以忽略它们，专注于代码。\n\n![](img/file10.svg)\n\
    \n图 3：`ToyPromise1`：如果 Promise 被兑现，提供的值会传递给 *兑现反应*（`.then()` 的第一个参数）。如果 Promise\
    \ 被拒绝，提供的值会传递给 *拒绝反应*（`.then()` 的第二个参数）。\n\n### 18.2.1 方法 `.then()`\n\n我们先来看 `.then()`。它需要处理两种情况：\n\
    \n*   如果 Promise 仍处于待定状态，它会将 `onFulfilled` 和 `onRejected` 的调用排队。这些调用将在 Promise\
    \ 被敲定后使用。\n*   如果 Promise 已经已兑现或已拒绝，则可以立即调用 `onFulfilled` 或 `onRejected`。\n\n"
