  trans: "\n\n```html\n<iframe src=\"iframe.html?first\"></iframe>\n<script>\n  const\
    \ iframe = document.querySelector('iframe');\n  const icw = iframe.contentWindow;\
    \ // iframe 的 `globalThis`\n\n  iframe.onload = () => {\n    // 访问 iframe 全局对象的属性\n\
    \    const firstGlobalThis = icw.globalThis;\n    const firstArray = icw.Array;\n\
    \    console.log(icw.iframeName); // 'first'\n\n    iframe.onload = () => {\n\
    \      const secondGlobalThis = icw.globalThis;\n      const secondArray = icw.Array;\n\
    \n      // 全局对象不同\n      console.log(icw.iframeName); // 'second'\n      console.log(secondArray\
    \ === firstArray); // false\n\n      // 但 globalThis 仍然相同\n      console.log(firstGlobalThis\
    \ === secondGlobalThis); // true\n    };\n    iframe.src = 'iframe.html?second';\n\
    \  };\n</script>\n```\n\n文件 `iframe.html`:\n\n```html\n<script>\n  globalThis.iframeName\
    \ = location.search.slice(1);\n</script>\n```\n\n浏览器如何确保在这种场景下 `globalThis` 不会改变？它们在内部区分了两个对象：\n\
    \n*   [`Window`](https://html.spec.whatwg.org/multipage/window-object.html#the-window-object)\
    \ 是全局对象。每当位置发生变化时，它就会改变。\n\n*   [`WindowProxy`](https://html.spec.whatwg.org/multipage/window-object.html#the-windowproxy-exotic-object)\
    \ 是一个将所有访问转发到当前 `Window` 的对象。这个对象永远不会改变。\n\n在浏览器中，`globalThis` 指向 `WindowProxy`；在其他地方，它直接指向全局对象。\n\
    \n## 4.5 全局环境\n\n全局作用域是“最外层”的作用域——它没有外层作用域。它的环境是*全局环境*。每个环境都通过由外层环境引用链接的环境链与全局环境相连。全局环境的外层环境引用是\
    \ `null`。\n\n全局环境记录使用两个环境记录来管理其变量：\n\n*   *对象环境记录* 具有与普通环境记录相同的接口，但将其绑定保存在一个 JavaScript\
    \ 对象中。在这种情况下，该对象就是全局对象。\n\n*   一个普通的（*声明式*）环境记录，它有自己的存储空间来保存绑定。\n\n这两个记录何时被使用，将在稍后解释。\n\
    \n### 4.5.1 脚本作用域和模块作用域\n\n在 JavaScript 中，我们只有在脚本的顶层才处于全局作用域。相比之下，每个模块都有自己的作用域，该作用域是脚本作用域的子作用域。\n\
    \n如果我们忽略变量绑定如何添加到全局环境中的相对复杂的规则，那么全局作用域和模块作用域的工作方式就像它们是嵌套的代码块一样：\n\n```javascript\n\
    { // 全局作用域（所有*脚本*的作用域）\n\n  // （全局变量）\n\n  { // 模块 1 的作用域\n    ···\n  }\n  { //\
    \ 模块 2 的作用域\n    ···\n  }\n  // （更多模块作用域）\n}\n```\n\n### 4.5.2 创建变量：声明式记录 vs.\
    \ 对象记录\n\n为了创建一个真正全局的变量，我们必须处于全局作用域中——这只有在脚本的顶层才成立：\n\n*   顶层的 `const`、`let` 和\
    \ `class` 在声明式环境记录中创建绑定。\n\n*   顶层的 `var` 和函数声明在对象环境记录中创建绑定。\n\n```html\n<script>\n\
    \  const one = 1;\n  var two = 2;\n</script>\n<script>\n  // 所有脚本共享同一个顶层作用域：\n\
    \  console.log(one); // 1\n  console.log(two); // 2\n\n  // 并非所有声明都会创建全局对象的属性：\n\
    \  console.log(globalThis.one); // undefined\n  console.log(globalThis.two); //\
    \ 2\n</script>\n```\n\n### 4.5.3 获取或设置变量\n\n当我们获取或设置一个变量，并且两个环境记录都有该变量的绑定时，声明式记录获胜：\n\
    \n```html\n<script>\n  let myGlobalVariable = 1; // 声明式环境记录\n  globalThis.myGlobalVariable\
    \ = 2; // 对象环境记录\n\n  console.log(myGlobalVariable); // 1（声明式记录获胜）\n  console.log(globalThis.myGlobalVariable);\
    \ // 2\n</script>\n```\n\n### 4.5.4 全局 ECMAScript 变量和全局宿主变量\n\n除了通过 `var` 和函数声明创建的变量之外，全局对象还包含以下属性：\n\
    \n*   所有 ECMAScript 的内置全局变量\n\n*   所有宿主平台（浏览器、Node.js 等）的内置全局变量\n\n使用 `const`\
    \ 或 `let` 可以保证全局变量声明不会影响（或受制于）ECMAScript 和宿主平台的内置全局变量。\n\n例如，浏览器有[全局变量 `.location`](https://developer.mozilla.org/en-US/docs/Web/API/Window/location)：\n\
    \n```javascript\n// 更改当前文档的位置：\nvar location = 'https://example.com';\n\n// 遮蔽\
    \ window.location，但不更改它：\nlet location = 'https://example.com';\n```\n\n如果变量已经存在（例如本例中的\
    \ `location`），那么带有初始化器的 `var` 声明行为类似于赋值。这就是为什么在这个例子中我们会遇到麻烦。\n\n请注意，这仅在全局作用域中是一个问题。在模块中，我们永远不会处于全局作用域（除非我们使用\
    \ `eval()` 或类似方法）。\n\n图 1 总结了我们在本节中学到的所有内容。\n\n![](img/file8.svg)\n\n图 1：全局作用域的环境通过一个*全局环境记录*来管理其绑定，而该记录又基于两个环境记录：一个*对象环境记录*（其绑定存储在全局对象中）和一个*声明式环境记录*（使用内部存储来保存其绑定）。因此，可以通过向全局对象添加属性或通过各种声明来创建全局变量。全局对象使用\
    \ ECMAScript 和宿主平台的内置全局变量进行初始化。每个 ECMAScript 模块都有自己的环境，其外层环境是全局环境。\n\n## 4.6 结论：为什么\
    \ JavaScript 既有普通的全局变量又有全局对象？\n\n全局对象通常被认为是一个错误。因此，较新的构造（如 `const`、`let` 和类）会创建普通的全局变量（当处于脚本作用域时）。\n\
    \n值得庆幸的是，现代 JavaScript 编写的大部分代码都存在于 [ECMAScript 模块和 CommonJS 模块](https://exploringjs.com/impatient-js/ch_modules.html)中。每个模块都有自己的作用域，因此管理全局变量的规则很少对基于模块的代码产生影响。\n\
    \n## 4.7 本章的进一步阅读和来源\n\nECMAScript 规范中的环境和全局对象：\n\n*   [“词法环境”一节](https://tc39.es/ecma262/#sec-lexical-environments)提供了环境的总体概述。\n\
    \n*   [“全局环境记录”一节](https://tc39.es/ecma262/#sec-global-environment-records)涵盖了全局环境。\n\
    \n*   [“ECMAScript 标准内置对象”一节](https://tc39.es/ecma262/#sec-ecmascript-standard-built-in-objects)描述了\
    \ ECMAScript 如何管理其内置对象（其中包括全局对象）。\n\n`globalThis`：\n\n*   2ality 文章 [“ES 特性：`globalThis`”](https://2ality.com/2019/08/global-this.html)\n\
    \n"
