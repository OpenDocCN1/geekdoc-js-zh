  trans: "\n\n`function shortHand() {}`\n`const obj = {`\n`  methodDef() {}, // (A)`\n\
    `  propDef: function () {}, // (B)`\n`  ['computed' + 'Key']: function () {},\
    \ // (C)`\n`  shortHand, // (D)`\n`};`\n`assert.equal(obj.methodDef.name, 'methodDef');`\n\
    `assert.equal(obj.propDef.name, 'propDef');`\n`assert.equal(obj.computedKey.name,\
    \ 'computedKey');`\n`assert.equal(obj.shortHand.name, 'shortHand');`\n\ngetter\
    \ 的名称以 `'get'` 为前缀，setter 的名称以 `'set'` 为前缀：\n\n```\nconst obj = {\n  get myGetter()\
    \ {},\n  set mySetter(value) {},\n};\nconst getter = Object.getOwnPropertyDescriptor(obj,\
    \ 'myGetter').get;\nassert.equal(getter.name, 'get myGetter');\n\nconst setter\
    \ = Object.getOwnPropertyDescriptor(obj, 'mySetter').set;\nassert.equal(setter.name,\
    \ 'set mySetter');\n```\n\n### 19.2.7 类定义中的方法\n\n类定义中方法的命名与对象字面量类似。例如，下面是一个类声明（命名在类表达式中同样适用）：\n\
    \n```\nclass ClassDecl {\n  methodDef() {}\n  ['computed' + 'Key']() {} // 计算属性键\n\
    \n  static staticMethod() {}\n}\nassert.equal(ClassDecl.prototype.methodDef.name,\
    \ 'methodDef');\nassert.equal(new ClassDecl().methodDef.name, 'methodDef');\n\n\
    assert.equal(ClassDecl.prototype.computedKey.name, 'computedKey');\n\nassert.equal(ClassDecl.staticMethod.name,\
    \ 'staticMethod');\n```\n\ngetter 和 setter 同样分别带有名称前缀 `'get'` 和 `'set'`：\n\n```\n\
    class ClassDecl {\n  get myGetter() {}\n  set mySetter(value) {}\n}\nconst getter\
    \ = Object.getOwnPropertyDescriptor(\n  ClassDecl.prototype, 'myGetter').get;\n\
    assert.equal(getter.name, 'get myGetter');\n\nconst setter = Object.getOwnPropertyDescriptor(\n\
    \  ClassDecl.prototype, 'mySetter').set;\nassert.equal(setter.name, 'set mySetter');\n\
    ```\n\n#### 19.2.7.1 键为符号的方法\n\n方法的键可以是符号。此类方法的 `.name` 属性仍然是字符串：\n\n*   如果符号有描述，则方法名是方括号中的描述。\n\
    *   否则，方法名是空字符串（`''`）。\n\n```\nconst keyWithDesc = Symbol('keyWithDesc');\nconst\
    \ keyWithoutDesc = Symbol();\n\nconst obj = {\n  [keyWithDesc]() {},\n  [keyWithoutDesc]()\
    \ {},\n};\nassert.equal(obj[keyWithDesc].name, '[keyWithDesc]');\nassert.equal(obj[keyWithoutDesc].name,\
    \ '');\n```\n\n### 19.2.8 类的名称\n\n在底层，类就是函数。此类函数的 `.name` 属性也会被正确设置：\n\n```\n\
    class ClassDecl {}\nassert.equal(ClassDecl.name, 'ClassDecl');\n\nconst AnonClassExpr\
    \ = class {};\nassert.equal(AnonClassExpr.name, 'AnonClassExpr');\n\nconst NamedClassExpr\
    \ = class ClassName {};\nassert.equal(NamedClassExpr.name, 'ClassName');\n```\n\
    \n### 19.2.9 默认导出与匿名构造\n\n以下所有语句都将 `.name` 设置为 `'default'`：\n\n```\n// 匿名函数表达式\n\
    export default function () {}\nexport default (function () {});\n\n// 匿名类表达式\n\
    export default class {}\nexport default (class {});\n\n// 箭头函数\nexport default\
    \ () => {};\n```\n\n### 19.2.10 其他编程构造\n\n*   生成器函数和生成器方法的命名方式与普通函数和方法相同。它们的名称中不包含星号：\n\
    \n    ```\n    function* genFuncDecl() {}\n    assert.equal(genFuncDecl.name,\
    \ 'genFuncDecl');\n    ```\n\n*   `new Function()` 生成的函数，其 `.name` 为 `'anonymous'`。[一个\
    \ WebKit 错误](https://bugs.webkit.org/show_bug.cgi?id=7726) 描述了为什么这在 Web 上是必要的。\n\
    \n    ```\n    assert.equal(new Function().name, 'anonymous');\n    ```\n\n* \
    \  `func.bind()` 生成的函数，其 `.name` 为 `'bound '+func.name`：\n\n    ```\n    function\
    \ func(x) {\n      return x\n    }\n    const bound = func.bind(undefined, 123);\n\
    \    assert.equal(bound.name, 'bound func');\n    ```\n\n## 19.3 函数名称需要注意的事项\n\
    \n### 19.3.1 函数的名称总是在创建时赋值\n\n只有在创建函数时使用了前面提到的模式之一，函数才会获得名称。之后使用这些模式不会改变任何内容——例如：\n\
    \n```\nfunction functionFactory() {\n  return function () {}; // (A)\n}\nconst\
    \ func = functionFactory(); // (B)\nassert.equal(func.name, ''); // 匿名\n```\n\n\
    函数 `func` 在第 A 行创建，同时它获得了非名称，即空字符串 `''`。在第 B 行使用赋值不会更新初始名称。缺失的函数名称理论上可以在之后更新，但这样做会对性能产生负面影响。\n\
    \n### 19.3.2 警告：代码压缩\n\n函数名称会受到代码压缩的影响，这意味着在压缩后的代码中它们通常会发生变化。根据我们的需求，我们可能需要通过字符串（不会被压缩）来管理函数名称，或者告诉压缩器哪些名称不要压缩。\n\
    \n## 19.4 更改函数的名称\n\n![](img/file0.svg)  **关于属性特性的更多信息**\n\n`Object.getOwnPropertyDescriptor()`\
    \ 和 `Object.defineProperty()` 用于处理属性特性。有关这些特性的更多信息，请参见 §9 “属性特性：入门”。\n\n以下是属性\
    \ `.name` 的特性：\n\n```\nconst func = function () {};\nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(func,\
    \ 'name'),\n  {\n    value: 'func',\n    writable: false,\n    enumerable: false,\n\
    \    configurable: true,\n  });\n```\n\n该属性不可写，意味着我们无法通过赋值来更改其值：\n\n```\nassert.throws(\n\
    \  () => func.name = 'differentName',\n  /^TypeError: Cannot assign to read only\
    \ property 'name'/\n);\n```\n\n然而，该属性是可配置的，这意味着我们可以通过重新定义来更改它：\n\n```\nObject.defineProperty(\n\
    \  func, 'name', {\n    value: 'differentName',\n  });\nassert.equal(func.name,\
    \ 'differentName');\n```\n\n## 19.5 ECMAScript 规范中的函数属性 `.name`\n\n*   规范操作 [`SetFunctionName()`](https://tc39.es/ecma262/#sec-setfunctionname)\
    \ 用于设置属性 `.name`。在规范中搜索该名称，可以找到它发生的位置。第三个参数指定了名称前缀：\n\n    *   [getter 和 setter](https://tc39.es/ecma262/#sec-method-definitions-runtime-semantics-propertydefinitionevaluation)\
    \ 的前缀为 `'get'` 和 `'set'`。\n    *   [`Function.prototype.bind()`](https://tc39.es/ecma262/#sec-function.prototype.bind)\
    \ 的前缀为 `'bound'`。\n\n*   匿名函数表达式最初没有 `.name` 属性，这一点可以通过查看规范中函数的创建方式来了解。\n\n"
