    \ {\n  return [\n    ...arr.slice(0, index), value, ...arr.slice(index+1)];\n\
    }\n```\n\nBoth versions of `setElementNonDestructively()` update *shallowly*:\
    \ They only change the top level of an Array.\n\n## 7.3 Manual deep updating\n\
