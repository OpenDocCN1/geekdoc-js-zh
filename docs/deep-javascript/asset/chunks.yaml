    ```\n\n我们将在本章后面讨论深拷贝。\n\n### 6.2.2 通过 `Object.assign()` 进行浅拷贝（可选）\n\n`Object.assign()`\
    \ 的工作方式与展开到对象中大致相同。也就是说，以下两种复制方式基本等价：\n\n```\nconst copy1 = {...original};\nconst\
    \ copy2 = Object.assign({}, original);\n```\n\n使用方法而非语法的好处是，可以通过库在较旧的 JavaScript\
    \ 引擎上进行 polyfill。\n\n不过，`Object.assign()` 并不完全等同于展开。它在一个相对微妙的点上有所不同：创建属性的方式不同。\n\
    \n*   `Object.assign()` 使用*赋值*来创建副本的属性。\n*   展开在副本中*定义*新属性。\n\n其中，赋值会调用自有和继承的\
    \ setter，而定义则不会（关于赋值与定义的更多信息）。这种差异很少被注意到。以下代码是一个例子，但有些刻意：\n\n```\nconst original\
    \ = {['__proto__']: null}; // (A)\nconst copy1 = {...original};\n// copy1 拥有自有属性\
    \ '__proto__'\nassert.deepEqual(\n  Object.keys(copy1), ['__proto__']);\n\nconst\
    \ copy2 = Object.assign({}, original);\n// copy2 的原型为 null\nassert.equal(Object.getPrototypeOf(copy2),\
    \ null);\n```\n\n通过在 A 行使用计算属性键，我们将 `.__proto__` 创建为自有属性，并且没有调用继承的 setter。然而，当\
    \ `Object.assign()` 复制该属性时，它会调用 setter。（关于 `.__proto__` 的更多信息，请参见 [《JavaScript\
    \ 面向不耐烦程序员》](https://exploringjs.com/impatient-js/ch_proto-chains-classes.html#proto)）\n\
    \n### 6.2.3 通过 `Object.getOwnPropertyDescriptors()` 和 `Object.defineProperties()`\
    \ 进行浅拷贝（可选）\n\nJavaScript 允许我们通过*属性描述符*（用于指定属性特性的对象）来创建属性。例如，通过 `Object.defineProperties()`，我们之前已经见过它的用法。如果将该方法与\
    \ `Object.getOwnPropertyDescriptors()` 结合使用，我们可以更忠实地进行复制：\n\n```\nfunction copyAllOwnProperties(original)\
    \ {\n  return Object.defineProperties(\n    {}, Object.getOwnPropertyDescriptors(original));\n\
    }\n```\n\n这消除了通过展开复制对象的两个问题。\n\n首先，所有自有属性的特性都被正确复制。因此，我们现在可以复制自有 getter 和自有 setter：\n\
    \n```\nconst original = {\n  get myGetter() { return 123 },\n  set mySetter(x)\
    \ {},\n};\nassert.deepEqual(copyAllOwnProperties(original), original);\n```\n\n\
    其次，得益于 `Object.getOwnPropertyDescriptors()`，不可枚举的属性也会被复制：\n\n```\nconst arr =\
    \ ['a', 'b'];\nassert.equal(arr.length, 2);\nassert.equal({}.hasOwnProperty.call(arr,\
    \ 'length'), true);\n\nconst copy = copyAllOwnProperties(arr);\nassert.equal({}.hasOwnProperty.call(copy,\
    \ 'length'), true);\n```\n\n## 6.3 JavaScript 中的深拷贝\n\n现在是时候解决深拷贝问题了。首先，我们将手动进行深拷贝，然后探讨通用方法。\n\
    \n### 6.3.1 通过嵌套展开进行手动深拷贝\n\n如果嵌套使用展开，我们可以得到深拷贝：\n\n```\nconst original = {name:\
    \ 'Jane', work: {employer: 'Acme'}};\nconst copy = {name: original.name, work:\
    \ {...original.work}};\n\n// 复制成功：\nassert.deepEqual(original, copy);\n// 拷贝是深层的：\n\
    assert.ok(original.work !== copy.work);\n```\n\n### 6.3.2 技巧：通过 JSON 进行通用深拷贝\n\
    \n这是一种技巧，但在紧急情况下能提供快速解决方案：为了深拷贝对象 `original`，我们首先将其转换为 JSON 字符串，然后解析该 JSON 字符串：\n\
    \n```\nfunction jsonDeepCopy(original) {\n  return JSON.parse(JSON.stringify(original));\n\
    }\nconst original = {name: 'Jane', work: {employer: 'Acme'}};\nconst copy = jsonDeepCopy(original);\n\
    assert.deepEqual(original, copy);\n```\n\n这种方法的一个显著缺点是，我们只能复制键和值受 JSON 支持的属性。\n\
    \n一些不支持的键和值会被直接忽略：\n\n```\nassert.deepEqual(\n  jsonDeepCopy({\n    // 符号不支持作为键\n\
    \    [Symbol('a')]: 'abc',\n    // 不支持的值\n    b: function () {},\n    // 不支持的值\n\
    \    c: undefined,\n  }),\n  {} // 空对象\n);\n```\n\n其他情况则会引发异常：\n\n```\nassert.throws(\n\
    \  () => jsonDeepCopy({a: 123n}),\n  /^TypeError: Do not know how to serialize\
    \ a BigInt$/);\n```\n\n### 6.3.3 实现通用深拷贝\n\n以下函数可以通用地深拷贝一个值 `original`：\n\n```\n\
    function deepCopy(original) {\n  if (Array.isArray(original)) {\n    const copy\
    \ = [];\n    for (const [index, value] of original.entries()) {\n      copy[index]\
    \ = deepCopy(value);\n    }\n    return copy;\n  } else if (typeof original ===\
    \ 'object' && original !== null) {\n    const copy = {};\n    for (const [key,\
    \ value] of Object.entries(original)) {\n      copy[key] = deepCopy(value);\n\
    \    }\n    return copy;\n  } else {\n    // 原始值：原子性，无需复制\n    return original;\n\
    \  }\n}\n```\n\n该函数处理三种情况：\n\n*   如果 `original` 是数组，我们创建一个新数组，并将 `original` 的元素深拷贝进去。\n\
    *   如果 `original` 是对象，我们采用类似的方法。\n*   如果 `original` 是原始值，我们无需做任何操作。\n\n让我们试试 `deepCopy()`：\n\
