    \ properly:\n\n```\n[](#cb300-1)assert.equal(re`/-${'.'}-/u`.source, '-\\\\.-');\n\
    ```\n\nFlag-less mode:\n\n```\n[](#cb301-1)const regexp = re`abc`;\n[](#cb301-2)assert.ok(regexp\
    \ instanceof RegExp);\n[](#cb301-3)assert.equal(regexp.source, 'abc');\n[](#cb301-4)assert.equal(regexp.flags,\
    \ '');\n```\n\n### 17.2.2 Details and advanced features\n\nYou can use the backslash\
    \ as you would inside regular expression literals:\n\n```\n[](#cb302-1)assert.equal(re`/\\\
    ./u`.source, '\\\\.');\n```\n\nRegular expression flags (such as `/u` in the previous\
    \ example) can also be computed:\n\n```\n[](#cb303-1)const regexp = re`/abc/${'g'+'u'}`;\n\
    [](#cb303-2)assert.ok(regexp instanceof RegExp);\n[](#cb303-3)assert.equal(regexp.source,\
    \ 'abc');\n[](#cb303-4)assert.equal(regexp.flags, 'gu');\n```\n\n## 17.3 Why is\
    \ this useful?\n\n*   You can compose regular expressions from fragments and document\
    \ the fragments via comments. That makes regular expressions easier to understand.\n\
    *   You can define constants for regular expression fragments and reuse them.\n\
    *   You can define plain text constants via strings and insert them into regular\
    \ expressions and they are escaped as necessary.\n\n## 17.4 `re` and named capture\
    \ groups\n\n`re` profits from [named capture groups](https://exploringjs.com/impatient-js/ch_regexps.html#named-capture-groups)\
    \ because they make the fragments more independent.\n\nWithout named groups:\n\
    \n```\n[](#cb304-1)const RE_YEAR = /([0-9]{4})/;\n[](#cb304-2)const RE_MONTH =\
    \ /([0-9]{2})/;\n[](#cb304-3)const RE_DAY = /([0-9]{2})/;\n[](#cb304-4)const RE_DATE\
    \ = re`/^${RE_YEAR}-${RE_MONTH}-${RE_DAY}$/u`;\n[](#cb304-5)\n[](#cb304-6)const\
    \ match = RE_DATE.exec('2017-01-27');\n[](#cb304-7)assert.equal(match[1], '2017');\n\
    ```\n\nWith named groups:\n\n```\n[](#cb305-1)const RE_YEAR = re`(?<year>[0-9]{4})`;\n\
    [](#cb305-2)const RE_MONTH = re`(?<month>[0-9]{2})`;\n[](#cb305-3)const RE_DAY\
    \ = re`(?<day>[0-9]{2})`;\n[](#cb305-4)const RE_DATE = re`/${RE_YEAR}-${RE_MONTH}-${RE_DAY}/u`;\n\
    [](#cb305-5)\n[](#cb305-6)const match = RE_DATE.exec('2017-01-27');\n[](#cb305-7)assert.equal(match.groups.year,\
    \ '2017');\n```\n\n# 18 Exploring Promises by implementing them\n\n* * *\n\n*\
