    \ keys.slice(1), value)]; // (C)\n[](#cb141-18)          } else {\n[](#cb141-19)\
    \            return keyValuePair; // (D)\n[](#cb141-20)          }\n[](#cb141-21)\
    \        }));\n[](#cb141-22)  } else {\n[](#cb141-23)    // 原始值\n[](#cb141-24)\
    \    return original;\n[](#cb141-25)  }\n[](#cb141-26)}\n```\n\n如果我们将 `value`\
