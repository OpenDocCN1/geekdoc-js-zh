  trans: "\n\n```javascript\nconst legoBrick2 = Object.create(\n  Object.prototype,\n\
    \  {\n    kind: {\n      value: 'Plate 1x3',\n      writable: true,\n      enumerable:\
    \ true,\n      configurable: true,\n    },\n    color: {\n      value: 'yellow',\n\
    \      writable: true,\n      enumerable: true,\n      configurable: true,\n \
    \   },\n    description: {\n      get: function () {\n        return `${this.kind}\
    \ (${this.color})`;\n      },\n      enumerable: true,\n      configurable: true,\n\
    \    },\n  });\n\n// 我们真的创建了相同的对象吗？\nassert.deepEqual(legoBrick1, legoBrick2);\
    \ // 是的！\n```\n\n## 9.6 `Object.getOwnPropertyDescriptors()` 的用例\n\n`Object.getOwnPropertyDescriptors()`\
    \ 在与 `Object.defineProperties()` 或 `Object.create()` 结合使用时，能帮助我们解决两个用例。\n\n###\
    \ 9.6.1 用例：将属性复制到对象中\n\n自 ES6 起，JavaScript 已经有一个用于复制属性的工具方法：`Object.assign()`。然而，该方法使用简单的\
    \ get 和 set 操作来复制键为 `key` 的属性：\n\n```\ntarget[key] = source[key];\n```\n\n这意味着它只有在以下情况下才能忠实地复制属性：\n\
    \n*   属性的 `writable` 属性为 `true`，且 `enumerable` 属性为 `true`（因为赋值操作就是这样创建属性的）。\n\n\
    *   它是一个数据属性。\n\n以下示例说明了这一限制。对象 `source` 有一个键为 `data` 的 setter。\n\n```\nconst\
    \ source = {\n  set data(value) {\n    this._data = value;\n  }\n};\n\n// 因为只有\
    \ setter，属性 `data` 存在，\n// 但值为 `undefined`。\nassert.equal('data' in source, true);\n\
    assert.equal(source.data, undefined);\n```\n\n如果我们使用 `Object.assign()` 复制属性 `data`，那么访问器属性\
    \ `data` 会被转换为数据属性：\n\n```\nconst target1 = {};\nObject.assign(target1, source);\n\
    \nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(target1, 'data'),\n  {\n\
    \    value: undefined,\n    writable: true,\n    enumerable: true,\n    configurable:\
    \ true,\n  });\n\n// 作为对比，原始属性：\nconst desc = Object.getOwnPropertyDescriptor.bind(Object);\n\
    assert.deepEqual(\n  Object.getOwnPropertyDescriptor(source, 'data'),\n  {\n \
    \   get: undefined,\n    set: desc(source, 'data').set,\n    enumerable: true,\n\
    \    configurable: true,\n  });\n```\n\n幸运的是，使用 `Object.getOwnPropertyDescriptors()`\
    \ 配合 `Object.defineProperties()` 可以忠实地复制属性 `data`：\n\n```\nconst target2 = {};\n\
    Object.defineProperties(\n  target2, Object.getOwnPropertyDescriptors(source));\n\
    \nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(target2, 'data'),\n  {\n\
    \    get: undefined,\n    set: desc(source, 'data').set,\n    enumerable: true,\n\
    \    configurable: true,\n  });\n```\n\n#### 9.6.1.1 陷阱：复制使用 `super` 的方法\n\n使用\
    \ `super` 的方法与其所在的*宿主对象*（存储该方法的对象）紧密绑定。目前还没有办法将这样的方法复制或移动到另一个对象。\n\n### 9.6.2 `Object.getOwnPropertyDescriptors()`\
    \ 的用例：克隆对象\n\n浅克隆与复制属性类似，因此 `Object.getOwnPropertyDescriptors()` 在这里也是一个不错的选择。\n\
    \n要创建克隆，我们使用 `Object.create()`：\n\n```\nconst original = {\n  set data(value)\
    \ {\n    this._data = value;\n  }\n};\n\nconst clone = Object.create(\n  Object.getPrototypeOf(original),\n\
    \  Object.getOwnPropertyDescriptors(original));\n\nassert.deepEqual(original,\
    \ clone);\n```\n\n有关此主题的更多信息，请参见第 6 章“复制对象和数组”。\n\n## 9.7 省略描述符属性\n\n描述符的所有属性都是可选的。省略某个属性时会发生什么取决于操作。\n\
    \n### 9.7.1 创建属性时省略描述符属性\n\n当我们通过描述符创建新属性时，省略属性意味着使用它们的默认值：\n\n```\nconst car\
    \ = {};\nObject.defineProperty(\n  car, 'color', {\n    value: 'red',\n  });\n\
    assert.deepEqual(\n  Object.getOwnPropertyDescriptor(car, 'color'),\n  {\n   \
    \ value: 'red',\n    writable: false,\n    enumerable: false,\n    configurable:\
    \ false,\n  });\n```\n\n### 9.7.2 修改属性时省略描述符属性\n\n相反，如果我们修改一个现有属性，省略描述符属性意味着相应的属性不会被触及：\n\
    \n```\nconst car = {\n  color: 'yellow',\n};\nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(car,\
    \ 'color'),\n  {\n    value: 'yellow',\n    writable: true,\n    enumerable: true,\n\
    \    configurable: true,\n  });\nObject.defineProperty(\n  car, 'color', {\n \
    \   value: 'pink',\n  });\nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(car,\
    \ 'color'),\n  {\n    value: 'pink',\n    writable: true,\n    enumerable: true,\n\
    \    configurable: true,\n  });\n```\n\n## 9.8 内置构造使用了哪些属性特性？\n\n关于属性特性的一般规则（少数例外情况除外）是：\n\
    \n*   原型链起始处的对象属性通常是 `writable`、`enumerable` 和 `configurable` 的。\n\n*   如可枚举性章节所述，大多数继承的属性是不可枚举的，以便将它们隐藏起来，避免被\
    \ `for-in` 循环等旧式构造访问。继承的属性通常是 `writable` 和 `configurable` 的。\n\n### 9.8.1 通过赋值创建的自身属性\n\
    \n```\nconst obj = {};\nobj.prop = 3;\n\nassert.deepEqual(\n  Object.getOwnPropertyDescriptors(obj),\n\
    \  {\n    prop: {\n      value: 3,\n      writable: true,\n      enumerable: true,\n\
    \      configurable: true,\n    }\n  });\n```\n\n### 9.8.2 通过对象字面量创建的自身属性\n\n\
    ```\nconst obj = { prop: 'yes' };\n\nassert.deepEqual(\n  Object.getOwnPropertyDescriptors(obj),\n\
    \  {\n    prop: {\n      value: 'yes',\n      writable: true,\n      enumerable:\
    \ true,\n      configurable: true\n    }\n  });\n```\n\n### 9.8.3 数组的自身属性 `.length`\n\
    \n数组的自身属性 `.length` 是不可枚举的，这样它就不会被 `Object.assign()`、展开操作等复制。它也是不可配置的：\n\n```\n\
    > Object.getOwnPropertyDescriptor([], 'length')\n{ value: 0, writable: true, enumerable:\
    \ false, configurable: false }\n> Object.getOwnPropertyDescriptor('abc', 'length')\n\
    { value: 3, writable: false, enumerable: false, configurable: false }\n```\n\n"
