    \n*   9.10 [Further reading](#ch010.xhtml_further-reading-1)\n\n* * *\n\nIn this\
    \ chapter, we take a closer look at how the ECMAScript specification sees JavaScript\
    \ objects. In particular, properties are not atomic in the spec, but composed\
    \ of multiple *attributes* (think fields in a record). Even the value of a data\
    \ property is stored in an attribute!\n\n## 9.1 The structure of objects\n\n[In\
    \ the ECMAScript specification](https://tc39.es/ecma262/#sec-object-type), an\
    \ object consists of:\n\n*   *Internal slots*, which are storage locations that\
    \ are not accessible from JavaScript, only from operations in the specification.\n\
    \n*   A collection of *properties*. Each property associates a *key* with *attributes*\
    \ (think fields in a record).\n\n### 9.1.1 Internal slots\n\n[The specification](https://tc39.es/ecma262/#sec-object-internal-methods-and-internal-slots)\
    \ describes internal slots as follows. I added bullet points and emphasized one\
    \ part:\n\n*   Internal slots correspond to internal state that is associated\
    \ with objects and used by various ECMAScript specification algorithms.\n\n* \
    \  Internal slots are not object properties and they are not inherited.\n\n* \
    \  Depending upon the specific internal slot specification, such state may consist\
    \ of:\n\n    *   values of any ECMAScript language type or\n\n    *   of specific\
    \ ECMAScript specification type values.\n\n*   Unless explicitly specified otherwise,\
    \ internal slots are allocated as part of the process of creating an object and\
    \ may not be dynamically added to an object.\n\n*   Unless specified otherwise,\
    \ the initial value of an internal slot is the value `undefined`.\n\n*   Various\
    \ algorithms within this specification create objects that have internal slots.\
    \ However, **the ECMAScript language provides no direct way to associate internal\
    \ slots with an object**.\n\n*   Internal methods and internal slots are identified\
    \ within this specification using names enclosed in double square brackets `[[\
    \ ]]`.\n\nThere are two kinds of internal slots:\n\n*   Method slots for manipulating\
    \ objects (getting properties, setting properties, etc.)\n\n*   Data slots that\
    \ store values.\n\nOrdinary objects have the following data slots:\n\n*   `.[[Prototype]]:\
    \ null | object`\n\n    *   Stores the prototype of an object.\n\n    *   Can\
    \ be accessed indirectly via `Object.getPrototypeOf()` and `Object.setPrototypeOf()`.\n\
    \n*   `.[[Extensible]]: boolean`\n\n    *   Indicates if it is possible to add\
    \ properties to an object.\n\n    *   Can be set to `false` via `Object.preventExtensions()`.\n\
    \n*   `.[[PrivateFieldValues]]: EntryList`\n\n    *   Is used to manage [private\
    \ class fields](https://2ality.com/2019/07/private-class-fields.html).\n\n###\
    \ 9.1.2 Property keys\n\nThe key of a property is either:\n\n*   A string\n\n\
    *   A symbol\n\n### 9.1.3 Property attributes\n\nThere are two kinds of properties\
    \ and they are characterized by their attributes:\n\n*   A *data property* stores\
    \ data. Its attribute `value` holds any JavaScript value.\n\n*   An *accessor\
    \ property* consists of a getter function and/or a setter function. The former\
    \ is stored in the attribute `get`, the latter in the attribute `set`.\n\nAdditionally,\
    \ there are attributes that both kinds of properties have. The following table\
    \ lists all attributes and their default values.\n\n| Kind of property | Name\
    \ and type of attribute | Default value |\n\n| --- | --- | --- |\n\n| Data property\
    \ | `value: any` | `undefined` |\n\n|  | `writable: boolean` | `false` |\n\n|\
    \ Accessor property | `get: (this: any) => any` | `undefined` |\n\n|  | `set:\
    \ (this: any, v: any) => void` | `undefined` |\n\n| All properties | `configurable:\
    \ boolean` | `false` |\n\n|  | `enumerable: boolean` | `false` |\n\nWe have already\
    \ encountered the attributes `value`, `get`, and `set`. The other attributes work\
    \ as follows:\n\n*   `writable` determines if the value of a data property can\
    \ be changed.\n\n*   `configurable` determines if the attributes of a property\
    \ can be changed. If it is `false`, then:\n\n    *   We cannot delete the property.\n\
    \n    *   We cannot change a property from a data property to an accessor property\
    \ or vice versa.\n\n    *   We cannot change any attribute other than `value`.\n\
    \n    *   However, one more attribute change is allowed: We can change `writable`\
    \ from `true` to `false`. The rationale behind this anomaly is [historical](https://stackoverflow.com/questions/9829817/why-can-i-set-enumerability-and-writability-of-unconfigurable-property-descrip/9843191#9843191):\
    \ Property `.length` of Arrays has always been writable and non-configurable.\
    \ Allowing its `writable` attribute to be changed enables us to freeze Arrays.\n\
    \n*   `enumerable` influences some operations (such as `Object.keys()`). If it\
    \ is `false`, then those operations ignore the property. Most properties are enumerable\
    \ (e.g. those created via assignment or object literals), which is why you’ll\
    \ rarely notice this attribute in practice. If you are still interested in how\
    \ it works, see [§12 “Enumerability of properties”](#ch013.xhtml_ch_enumerability).\n\
    \n#### 9.1.3.1 Pitfall: Inherited non-writable properties prevent creating own\
    \ properties via assignment\n\nIf an inherited property is non-writable, we can’t\
    \ use assignment to create an own property with the same key:\n\n```\n[](#cb155-1)const\
    \ proto = {\n[](#cb155-2)  prop: 1,\n[](#cb155-3)};\n[](#cb155-4)// Make proto.prop\
    \ non-writable:\n[](#cb155-5)Object.defineProperty(\n[](#cb155-6)  proto, 'prop',\
    \ {writable: false});\n[](#cb155-7)\n[](#cb155-8)const obj = Object.create(proto);\n\
    [](#cb155-9)\n[](#cb155-10)assert.throws(\n[](#cb155-11)  () => obj.prop = 2,\n\
    [](#cb155-12)  /^TypeError: Cannot assign to read only property 'prop'/);\n```"
