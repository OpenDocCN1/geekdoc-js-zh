    \    *   11.4.1 [The properties of an object literal are added via definition](#ch012.xhtml_the-properties-of-an-object-literal-are-added-via-definition)\n\
    \    *   11.4.2 [The assignment operator `=` always uses assignment](#ch012.xhtml_the-assignment-operator-always-uses-assignment)\n\
    \    *   11.4.3 [Public class fields are added via definition](#ch012.xhtml_public-class-fields-are-added-via-definition)\n\
    *   11.5 [Further reading and sources of this chapter](#ch012.xhtml_further-reading-and-sources-of-this-chapter-2)\n\
    \n* * *\n\nThere are two ways of creating or changing a property `prop` of an\
    \ object `obj`:\n\n*   *Assigning*: `obj.prop = true`\n*   *Defining*: `Object.defineProperty(obj,\
    \ '', {value: true})`\n\nThis chapter explains how they work.\n\n![](media/file0.svg) \
    \ **Required knowledge: property attributes and property descriptors**\n\nFor\
    \ this chapter, you should be familiar with property attributes and property descriptors.\
    \ If you aren’t, check out [§9 “Property attributes: an introduction”](#ch010.xhtml_ch_property-attributes-intro).\n\
    \n## 11.1 Assignment vs. definition\n\n### 11.1.1 Assignment\n\nWe use the assignment\
    \ operator `=` to assign a value `value` to a property `.prop` of an object `obj`:\n\
    \n```\n[](#cb202-1)obj.prop = value\n```\n\nThis operator works differently depending\
    \ on what `.prop` looks like:\n\n*   Changing properties: If there is an own data\
    \ property `.prop`, assignment changes its value to `value`.\n*   Invoking setters:\
    \ If there is an own or inherited setter for `.prop`, assignment invokes that\
    \ setter.\n*   Creating properties: If there is no own data property `.prop` and\
    \ no own or inherited setter for it, assignment creates a new own data property.\n\
    \nThat is, the main purpose of assignment is making changes. That’s why it supports\
    \ setters.\n\n### 11.1.2 Definition\n\nTo define a property with the key `propKey`\
    \ of an object `obj`, we use an operation such as the following method:\n\n```\n\
    [](#cb203-1)Object.defineProperty(obj, propKey, propDesc)\n```\n\nThis method\
    \ works differently depending on what the property looks like:\n\n*   Changing\
    \ properties: If an own property with key `propKey` exists, defining changes its\
    \ property attributes as specified by the property descriptor `propDesc` (if possible).\n\
    *   Creating properties: Otherwise, defining creates an own property with the\
    \ attributes specified by `propDesc` (if possible).\n\nThat is, the main purpose\
    \ of definition is to create an own property (even if there is an inherited setter,\
    \ which it ignores) and to change property attributes.\n\n## 11.2 Assignment and\
    \ definition in theory (optional)\n\n![](media/file2.svg)  **Property descriptors\
    \ in the ECMAScript specification**\n\nIn specification operations, property descriptors\
    \ are not JavaScript objects but [*Records*](https://tc39.es/ecma262/#sec-list-and-record-specification-type),\
    \ a spec-internal data structure that has *fields*. The keys of fields are written\
    \ in double brackets. For example, `Desc.[[Configurable]]` accesses the field\
    \ `.[[Configurable]]` of `Desc`. These records are translated to and from JavaScript\
    \ objects when interacting with the outside world.\n\n### 11.2.1 Assigning to\
    \ a property\n\nThe actual work of assigning to a property is handled via [the\
    \ following operation](https://tc39.es/ecma262/#sec-ordinarysetwithowndescriptor)\
    \ in the ECMAScript specification:\n\n```\nOrdinarySetWithOwnDescriptor(O, P,\
    \ V, Receiver, ownDesc)\n```\n\nThese are the parameters:\n\n*   `O` is the object\
    \ that is currently being visited.\n*   `P` is the key of the property that we\
    \ are assigning to.\n*   `V` is the value we are assigning.\n*   `Receiver` is\
    \ the object where the assignment started.\n*   `ownDesc` is the descriptor of\
    \ `O[P]` or `null` if that property doesn’t exist.\n\nThe return value is a boolean\
    \ that indicates whether or not the operation succeeded. As explained [later in\
    \ this chapter](#ch012.xhtml_control-flow-of-assignment), strict-mode assignment\
    \ throws a `TypeError` if `OrdinarySetWithOwnDescriptor()` fails.\n\nThis is a\
    \ high-level summary of the algorithm:\n\n*   It traverses the prototype chain\
    \ of `Receiver` until it finds a property whose key is `P`. The traversal is done\
    \ by calling `OrdinarySetWithOwnDescriptor()` recursively. During recursion, `O`\
    \ changes and points to the object that is currently being visited, but `Receiver`\
    \ stays the same.\n*   Depending on what the traversal finds, an own property\
    \ is created in `Receiver` (where recursion started) or something else happens.\n\
    \nIn more detail, this algorithm works as follows:\n\n*   If `ownDesc` is `undefined`,\
    \ then we haven’t yet found a property with key `P`:\n    *   If `O` has a prototype\
    \ `parent`, then we return `parent.[[Set]](P, V, Receiver)`. This continues our\
    \ search. The method call usually ends up invoking `OrdinarySetWithOwnDescriptor()`\
    \ recursively.\n    *   Otherwise, our search for `P` has failed and we set `ownDesc`\
    \ as follows:\n        ```\n        {\n          [[Value]]: undefined, [[Writable]]:\
    \ true,\n          [[Enumerable]]: true, [[Configurable]]: true\n        }\n \
    \       ```\n        With this `ownDesc`, the next `if` statement will create\
    \ an own property in `Receiver`.\n\n*   If `ownDesc` specifies a data property,\
    \ then we have found a property:\n    *   If `ownDesc.[[Writable]]` is `false`,\
    \ return `false`. This means that any non-writable property `P` (own or inherited!)\
    \ prevents assignment.\n    *   Let `existingDescriptor` be `Receiver.[[GetOwnProperty]](P)`.\
    \ That is, retrieve the descriptor of the property where the assignment started.\
    \ We now have:\n        *   The current object `O` and the current property descriptor\
    \ `ownDesc` on one hand.\n        *   The original object `Receiver` and the original\
    \ property descriptor `existingDescriptor` on the other hand.\n    *   If `existingDescriptor`\
    \ is not `undefined`:\n        *   (If we get here, then we are still at the beginning\
    \ of the prototype chain – we only recurse if `Receiver` does not have a property\
    \ `P`.)\n        *   The following two `if` conditions should never be `true`\
    \ because `ownDesc` and `existingDesc` should be equal:\n            *   If `existingDescriptor`\
    \ specifies an accessor, return `false`.\n            *   If `existingDescriptor.[[Writable]]`\
    \ is `false`, return `false`.\n        *   Return `Receiver.[[DefineOwnProperty]](P,\
    \ { [[Value]]: V })`. This internal method performs definition, which we use to\
    \ change the value of property `Receiver[P]`. The definition algorithm is described\
    \ in the next subsection.\n    *   Else:\n        *   (If we get here, then `Receiver`\
    \ does not have an own property with key `P`.)\n        *   Return `CreateDataProperty(Receiver,\
    \ P, V)`. ([This operation](https://tc39.es/ecma262/#sec-createdataproperty) creates\
    \ an own data property in its first argument.)\n\n*   (If we get here, then `ownDesc`\
    \ describes an accessor property that is own or inherited.)\n*   Let `setter`\
    \ be `ownDesc.[[Set]]`.\n"
