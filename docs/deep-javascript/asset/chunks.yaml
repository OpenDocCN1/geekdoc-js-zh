    \n#### 6.2.1.6 复制是浅层的\n\n复制会为 `original` 中的每个键值对创建新版本，但 `original` 的值本身不会被复制。例如：\n\
    \n```\nconst original = {name: 'Jane', work: {employer: 'Acme'}};\nconst copy\
