    \  if (keys.length === 0) {\n[](#cb141-3)    return value;\n[](#cb141-4)  }\n\
    [](#cb141-5)  const currentKey = keys[0];\n[](#cb141-6)  if (Array.isArray(original))\
    \ {\n[](#cb141-7)    return original.map(\n[](#cb141-8)      (v, index) => index\
    \ === currentKey\n[](#cb141-9)        ? deepUpdate(v, keys.slice(1), value) //\
