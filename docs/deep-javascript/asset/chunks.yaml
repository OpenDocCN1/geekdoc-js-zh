    \ x === 'function';\n[](#cb17-22)}\n```\n\n## 2.4 Example coercion algorithms\n\
    \n### 2.4.1 `ToPrimitive()`\n\n[The operation `ToPrimitive()`](https://tc39.es/ecma262/#sec-toprimitive)\
    \ is an intermediate step for many coercion algorithms (some of which we’ll see\
    \ later in this chapter). It converts an arbitrary values to primitive values.\n\
    \n`ToPrimitive()` is used often in the spec because most operators can only work\
    \ with primitive values. For example, we can use the addition operator (`+`) to\
    \ add numbers and to concatenate strings, but we can’t use it to concatenate Arrays.\n\
    \nThis is what the JavaScript version of `ToPrimitive()` looks like:\n\n```\n\
    [](#cb18-1)/**\n[](#cb18-2) * @param  hint Which type is preferred for the result:\n\
    [](#cb18-3) *             string, number, or don’t care?\n[](#cb18-4) */\n[](#cb18-5)function\
    \ ToPrimitive(input: any,\n[](#cb18-6)  hint: 'string'|'number'|'default' = 'default')\
    \ {\n[](#cb18-7)    if (TypeOf(input) === 'object') {\n[](#cb18-8)      let exoticToPrim\
    \ = input[Symbol.toPrimitive]; // (A)\n[](#cb18-9)      if (exoticToPrim !== undefined)\
    \ {\n[](#cb18-10)        let result = exoticToPrim.call(input, hint);\n[](#cb18-11)\
    \        if (TypeOf(result) !== 'object') {\n[](#cb18-12)          return result;\n\
    [](#cb18-13)        }\n[](#cb18-14)        throw new TypeError();\n[](#cb18-15)\
    \      }\n[](#cb18-16)      if (hint === 'default') {\n[](#cb18-17)        hint\
    \ = 'number';\n[](#cb18-18)      }\n[](#cb18-19)      return OrdinaryToPrimitive(input,\
    \ hint);\n[](#cb18-20)    } else {\n[](#cb18-21)      // input is already primitive\n\
    [](#cb18-22)      return input;\n[](#cb18-23)    }\n[](#cb18-24)  }\n```\n\n`ToPrimitive()`\
    \ lets objects override the conversion to primitive via `Symbol.toPrimitive` (line\
    \ A). If an object doesn’t do that, it is passed on to `OrdinaryToPrimitive()`:\n\
    \n```\n[](#cb19-1)function OrdinaryToPrimitive(O: object, hint: 'string' | 'number')\
    \ {\n[](#cb19-2)  let methodNames;\n[](#cb19-3)  if (hint === 'string') {\n[](#cb19-4)\
    \    methodNames = ['toString', 'valueOf'];\n[](#cb19-5)  } else {\n[](#cb19-6)\
    \    methodNames = ['valueOf', 'toString'];\n[](#cb19-7)  }\n[](#cb19-8)  for\
    \ (let name of methodNames) {\n[](#cb19-9)    let method = O[name];\n[](#cb19-10)\
    \    if (IsCallable(method)) {\n[](#cb19-11)      let result = method.call(O);\n\
    [](#cb19-12)      if (TypeOf(result) !== 'object') {\n[](#cb19-13)        return\
    \ result;\n[](#cb19-14)      }\n[](#cb19-15)    }\n[](#cb19-16)  }\n[](#cb19-17)\
    \  throw new TypeError();\n[](#cb19-18)}\n```\n\n#### 2.4.1.1 Which hints do callers\
    \ of `ToPrimitive()` use?\n\nThe parameter `hint` can have one of three values:\n\
    \n*   `'number'` means: if possible, `input` should be converted to a number.\n\
    *   `'string'` means: if possible, `input` should be converted to a string.\n\
    *   `'default'` means: there is no preference for either numbers or strings.\n\
    \nThese are a few examples of how various operations use `ToPrimitive()`:\n"
