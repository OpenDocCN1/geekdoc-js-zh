  trans: "\n\n在引入 bigint（与 number 并存）之后，规范中之前使用 `ToNumber()` 的地方现在经常使用 `ToNumeric()`。请继续阅读以了解更多信息。\n\
    \n### 2.2.2 转换为数值类型\n\n目前，JavaScript 有[两种内置数值类型](https://tc39.es/ecma262/#sec-numeric-types)：number\
    \ 和 bigint。\n\n*   `ToNumeric()` 返回一个数值 `num`。它的调用者通常调用 `num` 的规范类型的方法 `mthd`：\n\
    \n    ```\n    Type(num)::mthd(···)\n    ```\n\n    以下操作使用了 `ToNumeric`：\n\n \
    \   *   前缀和后缀 `++` 运算符\n    *   `*` 运算符\n\n*   `ToInteger(x)` 用于需要不带小数的数字时。结果的范围之后通常会进一步限制。\n\
    \n    *   它调用 `ToNumber(x)` 并移除小数部分（类似于 `Math.trunc()`）。\n    *   使用 `ToInteger()`\
    \ 的操作：\n\n        *   `Number.prototype.toString(radix?)`\n        *   `String.prototype.codePointAt(pos)`\n\
    \        *   `Array.prototype.slice(start, end)`\n        *   等等。\n\n*   `ToInt32()`、`ToUint32()`\
    \ 将数字强制转换为 32 位整数，并由位运算符使用（见表 1）。\n\n    *   `ToInt32()`：有符号，范围 [−2³¹, 2³¹−1]（包含边界）\n\
    \    *   `ToUint32()`：无符号（因此有 `U`），范围 [0, 2³²−1]（包含边界）\n\n表 1：位数值运算符操作数的强制转换（`BigInt`\
    \ 运算符不限制位数）。\n\n| 运算符 | 左操作数 | 右操作数 | 结果类型 |\n| --- | --- | --- | --- |\n| `<<`\
    \ | `ToInt32()` | `ToUint32()` | `Int32` |\n| 有符号 `>>` | `ToInt32()` | `ToUint32()`\
    \ | `Int32` |\n| 无符号 `>>>` | `ToInt32()` | `ToUint32()` | `Uint32` |\n| `&`、`^`、`&#124;`\
    \ | `ToInt32()` | `ToUint32()` | `Int32` |\n| `~` | — | `ToInt32()` | `Int32`\
    \ |\n\n### 2.2.3 转换为属性键\n\n`ToPropertyKey()` 返回一个字符串或符号，并由以下操作使用：\n\n*   方括号运算符\
    \ `[]`\n*   对象字面量中的计算属性键\n*   `in` 运算符的左侧\n*   `Object.defineProperty(_, P, _)`\n\
    *   `Object.fromEntries()`\n*   `Object.getOwnPropertyDescriptor()`\n*   `Object.prototype.hasOwnProperty()`\n\
    *   `Object.prototype.propertyIsEnumerable()`\n*   `Reflect` 的若干方法\n\n### 2.2.4 转换为数组索引\n\
    \n*   `ToLength()`（直接）主要用于字符串索引。\n\n    *   `ToIndex()` 的辅助函数\n    *   结果 `l`\
    \ 的范围：0 ≤ `l` ≤ 2⁵³−1\n\n*   `ToIndex()` 用于类型化数组索引。\n\n    *   与 `ToLength()`\
    \ 的主要区别：如果参数超出范围则抛出异常。\n    *   结果 `i` 的范围：0 ≤ `i` ≤ 2⁵³−1\n\n*   `ToUint32()`\
    \ 用于数组索引。\n\n    *   结果 `i` 的范围：0 ≤ `i` < 2³²−1（上限不包含，以便为 `.length` 留出空间）\n\n\
    ### 2.2.5 转换为类型化数组元素\n\n当我们设置类型化数组元素的值时，会使用以下转换函数之一：\n\n*   `ToInt8()`\n*   `ToUint8()`\n\
    *   `ToUint8Clamp()`\n*   `ToInt16()`\n*   `ToUint16()`\n*   `ToInt32()`\n*  \
    \ `ToUint32()`\n*   `ToBigInt64()`\n*   `ToBigUint64()`\n\n## 2.3 插曲：用 JavaScript\
    \ 表达规范算法\n\n在本章的剩余部分，我们将遇到几个规范算法，但“实现”为 JavaScript。以下列表展示了一些常用模式如何从规范翻译为 JavaScript：\n\
    \n*   规范：如果 `Type(value)` 是 String\n\n    JavaScript：`if (TypeOf(value) === 'string')`\n\
    \n    （非常宽松的翻译；`TypeOf()` 定义如下）\n\n*   规范：如果 `IsCallable(method)` 为 true\n\n \
    \   JavaScript：`if (IsCallable(method))`\n\n    （`IsCallable()` 定义如下）\n\n*   规范：令\
    \ `numValue` 为 `ToNumber(value)`\n\n    JavaScript：`let numValue = Number(value)`\n\
    \n*   规范：令 `isArray` 为 `IsArray(O)`\n\n    JavaScript：`let isArray = Array.isArray(O)`\n\
    \n*   规范：如果 O 有一个 `[[NumberData]]` 内部槽\n\n    JavaScript：`if ('__NumberData__'\
    \ in O)`\n\n*   规范：令 `tag` 为 `Get(O, @@toStringTag)`\n\n    JavaScript：`let tag\
    \ = O[Symbol.toStringTag]`\n\n*   规范：返回字符串拼接 \"[object \", tag, 和 \"]\"\n\n  \
    \  JavaScript：`return '[object ' + tag + ']';`\n\n使用 `let`（而不是 `const`）以匹配规范的语言。\n\
    \n某些内容被省略了——例如，[ReturnIfAbrupt 简写](https://tc39.es/ecma262/#sec-returnifabrupt-shorthands)\
    \ `?` 和 `!`。\n\n```\n[](#cb17-1)/**\n[](#cb17-2) * typeof 的改进版本\n[](#cb17-3) */\n\
    [](#cb17-4)function TypeOf(value) {\n[](#cb17-5)  const result = typeof value;\n\
    [](#cb17-6)  switch (result) {\n[](#cb17-7)    case 'function':\n[](#cb17-8) \
    \     return 'object';\n[](#cb17-9)    case 'object':\n[](#cb17-10)      if (value\
    \ === null) {\n[](#cb17-11)        return 'null';\n[](#cb17-12)      } else {\n\
    [](#cb17-13)        return 'object';\n[](#cb17-14)      }\n[](#cb17-15)    default:\n\
    [](#cb17-16)      return result;\n[](#cb17-17)  }\n[](#cb17-18)}\n[](#cb17-19)\n\
    [](#cb17-20)function IsCallable(x) {\n[](#cb17-21)  return typeof x === 'function';\n\
    [](#cb17-22)}\n```\n\n## 2.4 示例强制转换算法\n\n### 2.4.1 `ToPrimitive()`\n\n[操作 `ToPrimitive()`](https://tc39.es/ecma262/#sec-toprimitive)\
    \ 是许多强制转换算法的中间步骤（我们将在本章后面看到其中一些）。它将任意值转换为原始值。\n\n`ToPrimitive()` 在规范中经常使用，因为大多数运算符只能处理原始值。例如，我们可以使用加法运算符（`+`）来加数字和拼接字符串，但不能用它来拼接数组。\n\
    \n以下是 `ToPrimitive()` 的 JavaScript 版本：\n\n```\n[](#cb18-1)/**\n[](#cb18-2) * @param\
    \  hint 结果的首选类型：\n[](#cb18-3) *             string、number 或不关心？\n[](#cb18-4) */\n\
    [](#cb18-5)function ToPrimitive(input: any,\n[](#cb18-6)  hint: 'string'|'number'|'default'\
    \ = 'default') {\n[](#cb18-7)    if (TypeOf(input) === 'object') {\n[](#cb18-8)\
    \      let exoticToPrim = input[Symbol.toPrimitive]; // (A)\n[](#cb18-9)     \
    \ if (exoticToPrim !== undefined) {\n[](#cb18-10)        let result = exoticToPrim.call(input,\
    \ hint);\n[](#cb18-11)        if (TypeOf(result) !== 'object') {\n[](#cb18-12)\
    \          return result;\n[](#cb18-13)        }\n[](#cb18-14)        throw new\
    \ TypeError();\n[](#cb18-15)      }\n[](#cb18-16)      if (hint === 'default')\
    \ {\n[](#cb18-17)        hint = 'number';\n[](#cb18-18)      }\n[](#cb18-19) \
    \     return OrdinaryToPrimitive(input, hint);\n[](#cb18-20)    } else {\n[](#cb18-21)\
    \      // input 已经是原始值\n[](#cb18-22)      return input;\n[](#cb18-23)    }\n[](#cb18-24)\
    \  }\n```\n\n`ToPrimitive()` 允许对象通过 `Symbol.toPrimitive`（第 A 行）覆盖到原始值的转换。如果对象没有这样做，则将其传递给\
    \ `OrdinaryToPrimitive()`：\n\n```\n[](#cb19-1)function OrdinaryToPrimitive(O:\
    \ object, hint: 'string' | 'number') {\n[](#cb19-2)  let methodNames;\n[](#cb19-3)\
    \  if (hint === 'string') {\n[](#cb19-4)    methodNames = ['toString', 'valueOf'];\n\
    [](#cb19-5)  } else {\n[](#cb19-6)    methodNames = ['valueOf', 'toString'];\n\
    [](#cb19-7)  }\n[](#cb19-8)  for (let name of methodNames) {\n[](#cb19-9)    let\
    \ method = O[name];\n[](#cb19-10)    if (IsCallable(method)) {\n[](#cb19-11) \
    \     let result = method.call(O);\n[](#cb19-12)      if (TypeOf(result) !== 'object')\
    \ {\n[](#cb19-13)        return result;\n[](#cb19-14)      }\n[](#cb19-15)   \
    \ }\n[](#cb19-16)  }\n[](#cb19-17)  throw new TypeError();\n[](#cb19-18)}\n```\n\
    \n#### 2.4.1.1 `ToPrimitive()` 的调用者使用哪些提示？\n\n参数 `hint` 可以取三个值之一：\n\n*   `'number'`\
    \ 表示：如果可能，`input` 应转换为数字。\n*   `'string'` 表示：如果可能，`input` 应转换为字符串。\n*   `'default'`\
    \ 表示：对数字或字符串没有偏好。\n\n以下是一些示例，展示各种操作如何使用 `ToPrimitive()`：\n\n"
- fmt: "\n*   `hint === 'number'`. The following operations prefer numbers:\n\n  \
    \  *   `ToNumeric()`\n\n    *   `ToNumber()`\n\n    *   `ToBigInt()`, `BigInt()`\n\
    \n    *   Abstract Relational Comparison (`<`)\n\n*   `hint === 'string'`. The\
    \ following operations prefer strings:\n\n    *   `ToString()`\n\n    *   `ToPropertyKey()`\n\
    \n*   `hint === 'default'`. The following operations are neutral w.r.t. the type\
    \ of the returned primitive value:\n\n    *   Abstract Equality Comparison (`==`)\n\
    \n    *   Addition Operator (`+`)\n\n    *   `new Date(value)` (`value` can be\
    \ either a number or a string)\n\nAs we have seen, the default behavior is for\
    \ `'default'` being handled as if it were `'number'`. Only instances of `Symbol`\
    \ and `Date` override this behavior (shown later).\n\n#### 2.4.1.2 Which methods\
    \ are called to convert objects to Primitives?\n\nIf the conversion to primitive\
    \ isn’t overridden via `Symbol.toPrimitive`, `OrdinaryToPrimitive()` calls either\
    \ or both of the following two methods:\n\n*   `'toString'` is called first if\
    \ `hint` indicates that we’d like the primitive value to be a string.\n\n*   `'valueOf'`\
    \ is called first if `hint` indicates that we’d like the primitive value to be\
    \ a number.\n\nThe following code demonstrates how that works:\n\n```\nconst obj\
    \ = {\n  toString() { return 'a' },\n  valueOf() { return 1 },\n};\n\n// String()\
    \ prefers strings:\nassert.equal(String(obj), 'a');\n\n// Number() prefers numbers:\n\
    assert.equal(Number(obj), 1);\n```\n\nA method with the property key `Symbol.toPrimitive`\
    \ overrides the normal conversion to primitive. That is only done twice in the\
    \ standard library:\n\n*   `Symbol.prototype[Symbol.toPrimitive](hint)`\n\n  \
    \  *   If the receiver is an instance of `Symbol`, this method always returns\
    \ the wrapped symbol.\n\n    *   The rationale is that instances of `Symbol` have\
    \ a `.toString()` method that returns strings. But even if `hint` is `'string'`,\
    \ `.toString()` should not be called so that we don’t accidentally convert instances\
    \ of `Symbol` to strings (which are a completely different kind of property key).\n\
    \n*   `Date.prototype[Symbol.toPrimitive](hint)`\n\n    *   Explained in more\
    \ detail next.\n\n#### 2.4.1.3 `Date.prototype[Symbol.toPrimitive]()`\n\nThis\
    \ is how Dates handle being converted to primitive values:\n\n```\nDate.prototype[Symbol.toPrimitive]\
    \ = function (\n  hint: 'default' | 'string' | 'number') {\n    let O = this;\n\
    \    if (TypeOf(O) !== 'object') {\n      throw new TypeError();\n    }\n    let\
    \ tryFirst;\n    if (hint === 'string' || hint === 'default') {\n      tryFirst\
    \ = 'string';\n    } else if (hint === 'number') {\n      tryFirst = 'number';\n\
    \    } else {\n      throw new TypeError();\n    }\n    return OrdinaryToPrimitive(O,\
    \ tryFirst);\n  };\n```\n\nThe only difference with the default algorithm is that\
    \ `'default'` becomes `'string'` (and not `'number'`). This can be observed if\
    \ we use operations that set `hint` to `'default'`:\n\n*   [The `==` operator](#ch003.xhtml_abstract-equality-comparison)\
    \ coerces objects to primitives (with a default hint) if the other operand is\
    \ a primitive value other than `undefined`, `null`, and `boolean`. In the following\
    \ interaction, we can see that the result of coercing the date is a string:\n\n\
    \    ```\n    const d = new Date('2222-03-27');\n    assert.equal(\n      d ==\
    \ 'Wed Mar 27 2222 01:00:00 GMT+0100'\n           + ' (Central European Standard\
    \ Time)',\n      true);\n    ```\n\n*   [The `+` operator](#ch003.xhtml_addition-operator)\
    \ coerces both operands to primitives (with a default hint). If one of the results\
    \ is a string, it performs string concatenation (otherwise it performs numeric\
    \ addition). In the following interaction, we can see that the result of coercing\
    \ the date is a string because the operator returns a string.\n\n    ```\n   \
    \ const d = new Date('2222-03-27');\n    assert.equal(\n      123 + d,\n     \
    \ '123Wed Mar 27 2222 01:00:00 GMT+0100'\n        + ' (Central European Standard\
    \ Time)');\n    ```\n\n### 2.4.2 `ToString()` and related operations\n\nThis is\
    \ the JavaScript version of `ToString()`:\n\n```\nfunction ToString(argument)\
    \ {\n  if (argument === undefined) {\n    return 'undefined';\n  } else if (argument\
    \ === null) {\n    return 'null';\n  } else if (argument === true) {\n    return\
    \ 'true';\n  } else if (argument === false) {\n    return 'false';\n  } else if\
    \ (TypeOf(argument) === 'number') {\n    return Number.toString(argument);\n \
    \ } else if (TypeOf(argument) === 'string') {\n    return argument;\n  } else\
    \ if (TypeOf(argument) === 'symbol') {\n    throw new TypeError();\n  } else if\
    \ (TypeOf(argument) === 'bigint') {\n    return BigInt.toString(argument);\n \
    \ } else {\n    // argument is an object\n    let primValue = ToPrimitive(argument,\
    \ 'string'); // (A)\n    return ToString(primValue);\n  }\n}\n```\n\nNote how\
    \ this function uses `ToPrimitive()` as an intermediate step for objects, before\
    \ converting the primitive result to a string (line A).\n\n`ToString()` deviates\
    \ in an interesting way from how `String()` works: If `argument` is a symbol,\
    \ the former throws a `TypeError` while the latter doesn’t. Why is that? The default\
    \ for symbols is that converting them to strings throws exceptions:\n\n```\n>\
    \ const sym = Symbol('sym');\n\n> ''+sym\nTypeError: Cannot convert a Symbol value\
    \ to a string\n> `${sym}`\nTypeError: Cannot convert a Symbol value to a string\n\
    ```\n\nThat default is overridden in `String()` and `Symbol.prototype.toString()`\
    \ (both are described in the next subsections):\n\n```\n> String(sym)\n'Symbol(sym)'\n\
    > sym.toString()\n'Symbol(sym)'\n```\n\n#### 2.4.2.1 `String()`\n\n```\nfunction\
    \ String(value) {\n  let s;\n  if (value === undefined) {\n    s = '';\n  } else\
    \ {\n    if (new.target === undefined && TypeOf(value) === 'symbol') {\n     \
    \ // This function was function-called and value is a symbol\n      return SymbolDescriptiveString(value);\n\
    \    }\n    s = ToString(value);\n  }\n  if (new.target === undefined) {\n   \
    \ // This function was function-called\n    return s;\n  }\n  // This function\
    \ was new-called\n  return StringCreate(s, new.target.prototype); // simplified!\n\
    }\n```\n\n`String()` works differently, depending on whether it is invoked via\
    \ a function call or via `new`. It uses [`new.target`](https://exploringjs.com/es6/ch_classes.html#sec_allocating-and-initializing-instances)\
    \ to distinguish the two.\n\nThese are the helper functions `StringCreate()` and\
    \ `SymbolDescriptiveString()`:\n\n```\n/** \n * Creates a String instance that\
    \ wraps `value`\n * and has the given protoype.\n */\nfunction StringCreate(value,\
    \ prototype) {\n  // ···\n}\n\nfunction SymbolDescriptiveString(sym) {\n  assert.equal(TypeOf(sym),\
    \ 'symbol');\n  let desc = sym.description;\n  if (desc === undefined) {\n   \
    \ desc = '';\n  }\n  assert.equal(TypeOf(desc), 'string');\n  return 'Symbol('+desc+')';\n\
    }\n```\n\n#### 2.4.2.2 `Symbol.prototype.toString()`\n\nIn addition to `String()`,\
    \ we can also use method `.toString()` to convert a symbol to a string. Its specification\
    \ looks as follows.\n"
