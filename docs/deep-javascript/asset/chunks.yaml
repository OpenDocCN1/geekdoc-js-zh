    \n# Deep JavaScript\n\n# 1 About this book\n\n* * *\n\n*   1.1 [Where is the homepage\
    \ of this book?](#ch002.xhtml_where-is-the-homepage-of-this-book)\n*   1.2 [What\
    \ is in this book?](#ch002.xhtml_what-is-in-this-book)\n*   1.3 [What do I get\
    \ for my money?](#ch002.xhtml_what-do-i-get-for-my-money)\n*   1.4 [How can I\
    \ preview the content?](#ch002.xhtml_how-can-i-preview-the-content)\n*   1.5 [How\
    \ do I report errors?](#ch002.xhtml_how-do-i-report-errors)\n*   1.6 [Tips for\
    \ reading](#ch002.xhtml_tips-for-reading)\n*   1.7 [Notations and conventions](#ch002.xhtml_notations-and-conventions)\n\
    \    *   1.7.1 [What is a type signature? Why am I seeing static types in this\
    \ book?](#ch002.xhtml_what-is-a-type-signature-why-am-i-seeing-static-types-in-this-book)\n\
    \    *   1.7.2 [What do the notes with icons mean?](#ch002.xhtml_what-do-the-notes-with-icons-mean)\n\
    *   1.8 [Acknowledgement](#ch002.xhtml_acknowledgement)\n\n* * *\n\n## 1.1 Where\
    \ is the homepage of this book?\n\nThe homepage of “Deep JavaScript” is [`exploringjs.com/deep-js/`](https://exploringjs.com/deep-js/)\n\
    \n## 1.2 What is in this book?\n\nThis book dives deeply into JavaScript:\n\n\
    *   It teaches practical techniques for using the language better.\n*   It teaches\
    \ how the language works and why. What it teaches is firmly grounded in the ECMAScript\
    \ specification (which the book explains and refers to).\n*   It covers only the\
    \ language (ignoring platform-specific features such as browser APIs) but not\
    \ exhaustively. Instead, it focuses on a selection of important topics.\n\n##\
    \ 1.3 What do I get for my money?\n\nIf you buy this book, you get:\n\n*   The\
    \ current content in four DRM-free versions:\n    *   PDF file\n    *   ZIP archive\
    \ with ad-free HTML\n    *   EPUB file\n    *   MOBI file\n*   Any future content\
    \ that is added to this edition. How much I can add depends on the sales of this\
    \ book.\n\nThe current price is introductory. It will increase as more content\
    \ is added.\n\n## 1.4 How can I preview the content?\n\n[On the homepage of this\
    \ book](https://exploringjs.com/deep-js/#previews), there are extensive previews\
    \ for all versions of this book.\n\n## 1.5 How do I report errors?\n\n*   The\
    \ HTML version of this book has links to comments at the end of each chapter.\n\
    *   They jump to GitHub issues, which [you can also access directly](https://github.com/rauschma/deep-js/issues).\n\
    \n## 1.6 Tips for reading\n\n*   You can read the chapters in any order. Each\
    \ one is self-contained but occasionally, there are references to other chapters\
    \ with further information.\n*   The headings of some sections are marked with\
    \ “(optional)” meaning that they are non-essential. You will still understand\
    \ the remainders of their chapters if you skip them.\n\n## 1.7 Notations and conventions\n\
    \n### 1.7.1 What is a type signature? Why am I seeing static types in this book?\n\
    \nFor example, you may see:\n\n```\n[](#cb1-1)Number.isFinite(num: number): boolean\n\
    ```\n"
