  trans: "\n让我们来看看 `move2()` 的解构是如何工作的。\n\n**示例 1.** 函数调用 `move2()` 会导致以下解构：\n\n```\n\
    [{x, y} = { x: 0, y: 0 }] ← []\n```\n\n左侧的单个数组元素在右侧没有匹配项，因此 `{x,y}` 与默认值匹配，而不是与右侧的数据匹配（规则\
    \ 3b、3d）：\n\n```\n{x, y} ← { x: 0, y: 0 }\n```\n\n左侧包含*属性值简写*。它是以下内容的缩写：\n\n```\n\
    {x: x, y: y} ← { x: 0, y: 0 }\n```\n\n这个解构会导致以下两个赋值（规则 2c、1）：\n\n```\nx = 0;\n\
    y = 0;\n```\n\n这正是我们想要的。然而，在下一个示例中，我们就没有这么幸运了。\n\n**示例 2.** 让我们来看看函数调用 `move2({z:\
    \ 3})`，它会导致以下解构：\n\n```\n[{x, y} = { x: 0, y: 0 }] ← [{z: 3}]\n```\n\n右侧索引 0 处有一个数组元素。因此，默认值被忽略，下一步是（规则\
    \ 3d）：\n\n```\n{x, y} ← { z: 3 }\n```\n\n这导致 `x` 和 `y` 都被设置为 `undefined`，这不是我们想要的。问题在于\
    \ `{x,y}` 不再与默认值匹配，而是与 `{z:3}` 匹配。\n\n### 3.4.3 使用 `move1()`\n\n让我们试试 `move1()`。\n\
    \n**示例 1:** `move1()`\n\n```\n[{x=0, y=0} = {}] ← []\n```\n\n右侧索引 0 处没有数组元素，因此我们使用默认值（规则\
    \ 3d）：\n\n```\n{x=0, y=0} ← {}\n```\n\n左侧包含属性值简写，这意味着这个解构等价于：\n\n```\n{x: x=0,\
    \ y: y=0} ← {}\n```\n\n右侧没有匹配 `x` 或 `y` 属性。因此，使用默认值，接下来执行以下解构（规则 2d）：\n\n```\n\
    x ← 0\ny ← 0\n```\n\n这导致以下赋值（规则 1）：\n\n```\nx = 0\ny = 0\n```\n\n这里我们得到了想要的结果。让我们看看下一个示例是否还能保持好运。\n\
    \n**示例 2:** `move1({z: 3})`\n\n```\n[{x=0, y=0} = {}] ← [{z: 3}]\n```\n\n数组模式的第一个元素在右侧有匹配项，并且该匹配项用于继续解构（规则\
    \ 3d）：\n\n```\n{x=0, y=0} ← {z: 3}\n```\n\n与示例 1 一样，右侧没有 `x` 和 `y` 属性，因此使用默认值：\n\
    \n```\nx = 0\ny = 0\n```\n\n它按预期工作！这次，`x` 和 `y` 的模式与 `{z:3}` 匹配并不是问题，因为它们有自己的局部默认值。\n\
    \n### 3.4.4 结论：默认值是模式部分的特性\n\n这些示例表明，默认值是模式部分（对象属性或数组元素）的特性。如果某个部分没有匹配项或与 `undefined`\
    \ 匹配，则使用默认值。也就是说，模式会与默认值进行匹配。\n\n# 4 全局变量的详细探讨\n\n* * *\n\n*   4.1 作用域\n*   4.2 词法环境\n\
    *   4.3 全局对象\n*   4.4 在浏览器中，`globalThis` 并不直接指向全局对象\n*   4.5 全局环境\n    *   4.5.1 脚本作用域和模块作用域\n\
    \    *   4.5.2 创建变量：声明式记录与对象记录\n    *   4.5.3 获取或设置变量\n    *   4.5.4 全局 ECMAScript\
    \ 变量与全局宿主变量\n*   4.6 结论：为什么 JavaScript 同时拥有普通全局变量和全局对象？\n*   4.7 本章的进一步阅读和资料来源\n\
    \n* * *\n\n在本章中，我们将详细探讨 JavaScript 的全局变量是如何工作的。其中涉及几个有趣的现象：脚本的作用域、所谓的*全局对象*等等。\n\
    \n## 4.1 作用域\n\n变量的*词法作用域*（简称：*作用域*）是程序中可以访问该变量的区域。JavaScript 的作用域是*静态的*（它们在运行时不会改变），并且可以嵌套——例如：\n\
    \n```\nfunction func() { // (A)\n  const aVariable = 1;\n  if (true) { // (B)\n\
    \    const anotherVariable = 2;\n  }\n}\n```\n\n由 `if` 语句（第 B 行）引入的作用域嵌套在函数 `func()`（第\
    \ A 行）的作用域内部。\n\n作用域 S 的最内层外围作用域称为 S 的*外部作用域*。在示例中，`func` 是 `if` 的外部作用域。\n\n##\
    \ 4.2 词法环境\n\n在 JavaScript 语言规范中，作用域是通过*词法环境*“实现”的。它们由两个组件组成：\n\n*   一个*环境记录*，将变量名映射到变量值（类似于字典）。这是作用域中变量的实际存储空间。记录中的名称-值条目称为*绑定*。\n\
    *   一个指向*外部环境*的引用——即外部作用域的环境。\n\n嵌套作用域的树因此由通过外部环境引用链接的环境树来表示。\n\n## 4.3 全局对象\n\
    \n全局对象是一个其属性成为全局变量的对象。（我们很快就会研究它如何精确地融入环境树。）它可以通过以下全局变量访问：\n\n*   所有平台都可用：[`globalThis`](https://exploringjs.com/impatient-js/ch_variables-assignment.html#globalThis)。这个名称基于这样一个事实：它在全局作用域中与\
    \ `this` 具有相同的值。\n*   其他用于全局对象的变量并非在所有平台上都可用：\n    *   `window` 是引用全局对象的经典方式。它在普通浏览器代码中有效，但在\
    \ *Web Workers*（与普通浏览器进程并发运行的进程）和 Node.js 上无效。\n    *   `self` 在浏览器中随处可用（包括 Web\
    \ Workers）。但 Node.js 不支持它。\n    *   `global` 仅在 Node.js 上可用。\n\n## 4.4 在浏览器中，`globalThis`\
    \ 并不直接指向全局对象\n\n在浏览器中，`globalThis` 并不直接指向全局对象，而是存在一个间接层。例如，考虑网页上的一个 iframe：\n\n\
    *   每当 iframe 的 `src` 发生变化时，它都会获得一个新的全局对象。\n*   然而，`globalThis` 始终具有相同的值。可以从 iframe\
    \ 外部检查该值，如下所示（灵感来自 [`globalThis` 提案中的一个示例](https://github.com/tc39/proposal-global#html-and-the-windowproxy)）。\n\
    \n文件 `parent.html`：\n\n"
- fmt: "\n```html\n<iframe src=\"iframe.html?first\"></iframe>\n<script>\n  const\
    \ iframe = document.querySelector('iframe');\n  const icw = iframe.contentWindow;\
    \ // `globalThis` of iframe\n\n  iframe.onload = () => {\n    // Access properties\
    \ of global object of iframe\n    const firstGlobalThis = icw.globalThis;\n  \
    \  const firstArray = icw.Array;\n    console.log(icw.iframeName); // 'first'\n\
    \n    iframe.onload = () => {\n      const secondGlobalThis = icw.globalThis;\n\
    \      const secondArray = icw.Array;\n\n      // The global object is different\n\
    \      console.log(icw.iframeName); // 'second'\n      console.log(secondArray\
    \ === firstArray); // false\n\n      // But globalThis is still the same\n   \
    \   console.log(firstGlobalThis === secondGlobalThis); // true\n    };\n    iframe.src\
    \ = 'iframe.html?second';\n  };\n</script>\n```\n\nFile `iframe.html`:\n\n```html\n\
    <script>\n  globalThis.iframeName = location.search.slice(1);\n</script>\n```\n\
    \nHow do browsers ensure that `globalThis` doesn’t change in this scenario? They\
    \ internally distinguish two objects:\n\n*   [`Window`](https://html.spec.whatwg.org/multipage/window-object.html#the-window-object)\
    \ is the global object. It changes whenever the location changes.\n\n*   [`WindowProxy`](https://html.spec.whatwg.org/multipage/window-object.html#the-windowproxy-exotic-object)\
    \ is an object that forwards all accesses to the current `Window`. This object\
    \ never changes.\n\nIn browsers, `globalThis` refers to the `WindowProxy`; everywhere\
    \ else, it directly refers to the global object.\n\n## 4.5 The global environment\n\
    \nThe global scope is the “outermost” scope – it has no outer scope. Its environment\
    \ is the *global environment*. Every environment is connected with the global\
    \ environment via a chain of environments that are linked by outer environment\
    \ references. The outer environment reference of the global environment is `null`.\n\
    \nThe global environment record uses two environment records to manage its variables:\n\
    \n*   An *object environment record* has the same interface as a normal environment\
    \ record, but keeps its bindings in a JavaScript object. In this case, the object\
    \ is the global object.\n\n*   A normal (*declarative*) environment record that\
    \ has its own storage for its bindings.\n\nWhich of these two records is used\
    \ when will be explained soon.\n\n### 4.5.1 Script scope and module scopes\n\n\
    In JavaScript, we are only in global scope at the top levels of scripts. In contrast,\
    \ each module has its own scope that is a subscope of the script scope.\n\nIf\
    \ we ignore the relatively complicated rules for how variable bindings are added\
    \ to the global environment, then global scope and module scopes work as if they\
    \ were nested code blocks:\n\n```javascript\n{ // Global scope (scope of *all*\
    \ scripts)\n\n  // (Global variables)\n\n  { // Scope of module 1\n    ···\n \
    \ }\n  { // Scope of module 2\n    ···\n  }\n  // (More module scopes)\n}\n```\n\
    \n### 4.5.2 Creating variables: declarative record vs. object record\n\nIn order\
    \ to create a variable that is truly global, we must be in global scope – which\
    \ is only the case at the top level of scripts:\n\n*   Top-level `const`, `let`,\
    \ and `class` create bindings in the declarative environment record.\n\n*   Top-level\
    \ `var` and function declarations create bindings in the object environment record.\n\
    \n```html\n<script>\n  const one = 1;\n  var two = 2;\n</script>\n<script>\n \
    \ // All scripts share the same top-level scope:\n  console.log(one); // 1\n \
    \ console.log(two); // 2\n\n  // Not all declarations create properties of the\
    \ global object:\n  console.log(globalThis.one); // undefined\n  console.log(globalThis.two);\
    \ // 2\n</script>\n```\n\n### 4.5.3 Getting or setting variables\n\nWhen we get\
    \ or set a variable and both environment records have a binding for that variable,\
    \ then the declarative record wins:\n\n```html\n<script>\n  let myGlobalVariable\
    \ = 1; // declarative environment record\n  globalThis.myGlobalVariable = 2; //\
    \ object environment record\n\n  console.log(myGlobalVariable); // 1 (declarative\
    \ record wins)\n  console.log(globalThis.myGlobalVariable); // 2\n</script>\n\
    ```\n\n### 4.5.4 Global ECMAScript variables and global host variables\n\nIn addition\
    \ to variables created via `var` and function declarations, the global object\
    \ contains the following properties:\n\n*   All built-in global variables of ECMAScript\n\
    \n*   All built-in global variables of the host platform (browser, Node.js, etc.)\n\
    \nUsing `const` or `let` guarantees that global variable declarations aren’t influencing\
    \ (or influenced by) the built-in global variables of ECMAScript and host platform.\n\
    \nFor example, browsers have [the global variable `.location`](https://developer.mozilla.org/en-US/docs/Web/API/Window/location):\n\
    \n```javascript\n// Changes the location of the current document:\nvar location\
    \ = 'https://example.com';\n\n// Shadows window.location, doesn’t change it:\n\
    let location = 'https://example.com';\n```\n\nIf a variable already exists (such\
    \ as `location` in this case), then a `var` declaration with an initializer behaves\
    \ like an assignment. That’s why we get into trouble in this example.\n\nNote\
    \ that this is only an issue in global scope. In modules, we are never in global\
    \ scope (unless we use `eval()` or similar).\n\nFig. [1](#ch005.xhtml_fig:global-scope)\
    \ summarizes everything we have learned in this section.\n\n![](media/file8.svg)\n\
    \nFigure 1: The environment for the global scope manages its bindings via a *global\
    \ environment record* which in turn is based on two environment records: an *object\
    \ environment record* whose bindings are stored in the global object and a *declarative\
    \ environment record* that uses internal storage for its bindings. Therefore,\
    \ global variables can be created by adding properties to the global object or\
    \ via various declarations. The global object is initialized with the built-in\
    \ global variables of ECMAScript and the host platform. Each ECMAScript module\
    \ has its own environment whose outer environment is the global environment.\n\
    \n## 4.6 Conclusion: Why does JavaScript have both normal global variables and\
    \ the global object?\n\nThe global object is generally considered to be a mistake.\
    \ For that reason, newer constructs such as `const`, `let`, and classes create\
    \ normal global variables (when in script scope).\n\nThankfully, most of the code\
    \ written in modern JavaScript, lives in [ECMAScript modules and CommonJS modules](https://exploringjs.com/impatient-js/ch_modules.html).\
    \ Each module has its own scope, which is why the rules governing global variables\
    \ rarely matter for module-based code.\n\n## 4.7 Further reading and sources of\
    \ this chapter\n\nEnvironments and the global object in the ECMAScript specification:\n\
    \n*   [Section “Lexical Environments”](https://tc39.es/ecma262/#sec-lexical-environments)\
    \ provides a general overview over environments.\n\n*   [Section “Global Environment\
    \ Records”](https://tc39.es/ecma262/#sec-global-environment-records) covers the\
    \ global environment.\n\n*   [Section “ECMAScript Standard Built-in Objects”](https://tc39.es/ecma262/#sec-ecmascript-standard-built-in-objects)\
    \ describes how ECMAScript manages its built-in objects (which include the global\
    \ object).\n\n`globalThis`:\n\n*   2ality post [“ES feature: `globalThis`”](https://2ality.com/2019/08/global-this.html)\n"
