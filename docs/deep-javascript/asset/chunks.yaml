    \n    JavaScript: `let numValue = Number(value)`\n\n*   Spec: Let `isArray` be\
    \ `IsArray(O)`\n\n    JavaScript: `let isArray = Array.isArray(O)`\n\n*   Spec:\
    \ If O has a `[[NumberData]]` internal slot\n\n    JavaScript: `if ('__NumberData__'\
    \ in O)`\n\n*   Spec: Let `tag` be `Get(O, @@toStringTag)`\n\n    JavaScript:\
    \ `let tag = O[Symbol.toStringTag]`\n\n*   Spec: Return the string-concatenation\
    \ of \"[object \", tag, and \"]\".\n\n    JavaScript: `return '[object ' + tag\
    \ + ']';`\n\n`let` (and not `const`) is used to match the language of the specification.\n\
    \nSome things are omitted – for example, the [ReturnIfAbrupt shorthands](https://tc39.es/ecma262/#sec-returnifabrupt-shorthands)\
    \ `?` and `!`.\n\n```\n[](#cb17-1)/**\n[](#cb17-2) * An improved version of typeof\n\
