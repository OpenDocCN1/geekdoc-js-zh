    \ other own properties (specifically, index properties).\n\n### 9.8.4 Prototype\
    \ properties of built-in classes\n\n```\nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(Array.prototype,\
    \ 'map'),\n  {\n    value: Array.prototype.map,\n    writable: true,\n    enumerable:\
    \ false,\n    configurable: true\n  });\n```\n\n### 9.8.5 Prototype properties\
    \ and instance properties of user-defined classes\n\n```\nclass DataContainer\
    \ {\n  accessCount = 0;\n  constructor(data) {\n    this.data = data;\n  }\n \
    \ getData() {\n    this.accessCount++;\n    return this.data;\n  }\n}\nassert.deepEqual(\n\
    \  Object.getOwnPropertyDescriptors(DataContainer.prototype),\n  {\n    constructor:\
    \ {\n      value: DataContainer,\n      writable: true,\n      enumerable: false,\n\
    \      configurable: true,\n    },\n    getData: {\n      value: DataContainer.prototype.getData,\n\
    \      writable: true,\n      enumerable: false,\n      configurable: true,\n\
    \    }\n  });\n```\n\nNote that all own properties of instances of `DataContainer`\
    \ are writable, enumerable, and configurable:\n\n```\nconst dc = new DataContainer('abc')\n\
    assert.deepEqual(\n  Object.getOwnPropertyDescriptors(dc),\n  {\n    accessCount:\
    \ {\n      value: 0,\n      writable: true,\n      enumerable: true,\n      configurable:\
    \ true,\n    },\n    data: {\n      value: 'abc',\n      writable: true,\n   \
    \   enumerable: true,\n      configurable: true,\n    }\n  });\n```\n\n## 9.9 API:\
    \ property descriptors\n\nThe following tool methods use property descriptors:\n\
    \n*   `Object.defineProperty(obj: object, key: string|symbol, propDesc: PropertyDescriptor):\
    \ object` ^([ES5])\n\n    Creates or changes a property on `obj` whose key is\
    \ `key` and whose attributes are specified via `propDesc`. Returns the modified\
    \ object.\n\n    ```\n    const obj = {};\n    const result = Object.defineProperty(\n\
    \      obj, 'happy', {\n        value: 'yes',\n        writable: true,\n     \
    \   enumerable: true,\n        configurable: true,\n      });\n    \n    // obj\
    \ was returned and modified:\n    assert.equal(result, obj);\n    assert.deepEqual(obj,\
    \ {\n      happy: 'yes',\n    });\n    ```\n\n*   `Object.defineProperties(obj:\
    \ object, properties: {[k: string|symbol]: PropertyDescriptor}): object` ^([ES5])\n\
    \n    The batch version of `Object.defineProperty()`. Each property `p` of the\
    \ object `properties` specifies one property that is to be added to `obj`: The\
    \ key of `p` specifies the key of the property, the value of `p` is a descriptor\
    \ that specifies the attributes of the property.\n\n    ```\n    const address1\
    \ = Object.defineProperties({}, {\n      street: { value: 'Evergreen Terrace',\
    \ enumerable: true },\n      number: { value: 742, enumerable: true },\n    });\n\
    \    ```\n\n*   `Object.create(proto: null|object, properties?: {[k: string|symbol]:\
    \ PropertyDescriptor}): object` ^([ES5])\n\n    First, creates an object whose\
    \ prototype is `proto`. Then, if the optional parameter `properties` has been\
    \ provided, adds properties to it – in the same manner as `Object.defineProperties()`.\
    \ Finally, returns the result. For example, the following code snippet produces\
    \ the same result as the previous snippet:\n\n    ```\n    const address2 = Object.create(Object.prototype,\
    \ {\n      street: { value: 'Evergreen Terrace', enumerable: true },\n      number:\
    \ { value: 742, enumerable: true },\n    });\n    assert.deepEqual(address1, address2);\n\
    \    ```\n\n*   `Object.getOwnPropertyDescriptor(obj: object, key: string|symbol):\
    \ undefined|PropertyDescriptor` ^([ES5])\n\n    Returns the descriptor of the\
    \ own (non-inherited) property of `obj` whose key is `key`. If there is no such\
    \ property, `undefined` is returned.\n\n    ```\n    assert.deepEqual(\n     \
    \ Object.getOwnPropertyDescriptor(Object.prototype, 'toString'),\n      {\n  \
    \      value: {}.toString,\n        writable: true,\n        enumerable: false,\n\
    \        configurable: true,\n      });\n    assert.equal(\n      Object.getOwnPropertyDescriptor({},\
    \ 'toString'),\n      undefined);\n    ```\n\n*   `Object.getOwnPropertyDescriptors(obj:\
    \ object): {[k: string|symbol]: PropertyDescriptor}` ^([ES2017])\n\n    Returns\
    \ an object where each property key `'k'` of `obj` is mapped to the property descriptor\
    \ for `obj.k`. The result can be used as input for `Object.defineProperties()`\
    \ and `Object.create()`.\n\n    ```\n    const propertyKey = Symbol('propertyKey');\n\
    \    const obj = {\n      [propertyKey]: 'abc',\n      get count() { return 123\
    \ },\n    };\n    \n    const desc = Object.getOwnPropertyDescriptor.bind(Object);\n\
    \    assert.deepEqual(\n      Object.getOwnPropertyDescriptors(obj),\n      {\n\
    \        [propertyKey]: {\n          value: 'abc',\n          writable: true,\n\
    \          enumerable: true,\n          configurable: true\n        },\n     \
    \   count: {\n          get: desc(obj, 'count').get, // (A)\n          set: undefined,\n\
    \          enumerable: true,\n          configurable: true\n        }\n      });\n\
    \    ```\n\n    Using `desc()` in line A is a work-around so that `.deepEqual()`\
    \ works.\n\n## 9.10 Further reading\n\nThe next three chapters provide more details\
    \ on property attributes:\n\n*   [§10 “Protecting objects from being changed”](#ch011.xhtml_ch_protecting-objects)\n\
    \n*   [§11 “Properties: assignment vs. definition”](#ch012.xhtml_ch_property-assignment-vs-definition)\n\
    \n*   [§12 “Enumerability of properties”](#ch013.xhtml_ch_enumerability)\n\n#\
    \ 10 Protecting objects from being changed\n\n* * *\n\n*   10.1 [Levels of protection:\
    \ preventing extensions, sealing, freezing](#ch011.xhtml_levels-of-protection-preventing-extensions-sealing-freezing)\n\
    \n*   10.2 [Preventing extensions](#ch011.xhtml_preventing-extensions)\n\n   \
    \ *   10.2.1 [Checking whether an object is extensible](#ch011.xhtml_checking-whether-an-object-is-extensible)\n\
    \n*   10.3 [Sealing](#ch011.xhtml_sealing)\n\n    *   10.3.1 [Checking whether\
    \ an object is sealed](#ch011.xhtml_checking-whether-an-object-is-sealed)\n\n\
    *   10.4 [Freezing](#ch011.xhtml_freezing)\n\n    *   10.4.1 [Checking whether\
    \ an object is frozen](#ch011.xhtml_checking-whether-an-object-is-frozen)\n\n\
    \    *   10.4.2 [Freezing is shallow](#ch011.xhtml_freezing-is-shallow)\n\n  \
    \  *   10.4.3 [Implementing deep freezing](#ch011.xhtml_implementing-deep-freezing)\n\
    \n*   10.5 [Further reading](#ch011.xhtml_further-reading-2)\n\n* * *\n\nIn this\
    \ chapter, we’ll look at how objects can be protected from being changed. Examples\
    \ include: Preventing properties being added and preventing properties being changed.\n\
