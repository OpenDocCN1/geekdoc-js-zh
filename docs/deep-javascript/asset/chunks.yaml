    \n    ```\n    [](#cb54-1)const iterator = iterable[Symbol.iterator]();\n    [](#cb54-2)«elements»\
    \ ← iterator\n    ```\n\n辅助函数：\n\n```\n[](#cb55-1)function isIterable(value) {\n\
