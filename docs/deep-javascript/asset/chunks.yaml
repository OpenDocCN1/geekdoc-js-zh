  trans: "\n\n## 10.1 保护级别：阻止扩展、密封、冻结\n\nJavaScript 提供了三种对象保护级别：\n\n*   *阻止扩展*：禁止向对象添加新属性，但仍可删除和修改现有属性。\n\
    \n    *   方法：`Object.preventExtensions(obj)`\n\n*   *密封*：阻止扩展，并使所有属性变为*不可配置*（大致意思是：无法再更改属性的工作方式）。\n\
    \n    *   方法：`Object.seal(obj)`\n\n*   *冻结*：在将所有属性设置为不可写后密封对象。也就是说，对象不可扩展，所有属性均为只读，且无法改变这一状态。\n\
    \n    *   方法：`Object.freeze(obj)`\n\n## 10.2 阻止扩展\n\n```\n[](#cb184-1)Object.preventExtensions<T>(obj:\
    \ T): T\n```\n\n该方法的工作方式如下：\n\n*   如果 `obj` 不是对象，则直接返回它。\n*   否则，修改 `obj` 使其无法再添加新属性，然后返回它。\n\
    *   类型参数 `<T>` 表示返回结果与参数类型相同。\n\n下面通过示例演示 `Object.preventExtensions()` 的用法：\n\n\
    ```\n[](#cb185-1)const obj = { first: 'Jane' };\n[](#cb185-2)Object.preventExtensions(obj);\n\
    [](#cb185-3)assert.throws(\n[](#cb185-4)  () => obj.last = 'Doe',\n[](#cb185-5)\
    \  /^TypeError: Cannot add property last, object is not extensible$/);\n```\n\n\
    但我们仍然可以删除属性：\n\n```\n[](#cb186-1)assert.deepEquals(\n[](#cb186-2)  Object.keys(obj),\
    \ ['first']);\n[](#cb186-3)delete obj.first;\n[](#cb186-4)assert.deepEquals(\n\
    [](#cb186-5)  Object.keys(obj), []);\n```\n\n### 10.2.1 检查对象是否可扩展\n\n```\n[](#cb187-1)Object.isExtensible(obj:\
    \ any): boolean\n```\n\n检查 `obj` 是否可扩展——例如：\n\n```\n> const obj = {};\n> Object.isExtensible(obj)\n\
    true\n> Object.preventExtensions(obj)\n{}\n> Object.isExtensible(obj)\nfalse\n\
    ```\n\n## 10.3 密封\n\n```\n[](#cb189-1)Object.seal<T>(obj: T): T\n```\n\n该方法说明：\n\
    \n*   如果 `obj` 不是对象，则直接返回它。\n*   否则，阻止 `obj` 扩展，使其所有属性变为*不可配置*，然后返回它。属性不可配置意味着无法再更改它们（除了值）：只读属性保持只读，可枚举属性保持可枚举，等等。\n\
    \n以下示例演示了密封会使对象不可扩展，且其属性变为不可配置。\n\n```\n[](#cb190-1)const obj = {\n[](#cb190-2)\
    \  first: 'Jane',\n[](#cb190-3)  last: 'Doe',\n[](#cb190-4)};\n[](#cb190-5)\n\
    [](#cb190-6)// 密封前\n[](#cb190-7)assert.equal(Object.isExtensible(obj), true);\n\
    [](#cb190-8)assert.deepEqual(\n[](#cb190-9)  Object.getOwnPropertyDescriptors(obj),\n\
    [](#cb190-10)  {\n[](#cb190-11)    first: {\n[](#cb190-12)      value: 'Jane',\n\
    [](#cb190-13)      writable: true,\n[](#cb190-14)      enumerable: true,\n[](#cb190-15)\
    \      configurable: true\n[](#cb190-16)    },\n[](#cb190-17)    last: {\n[](#cb190-18)\
    \      value: 'Doe',\n[](#cb190-19)      writable: true,\n[](#cb190-20)      enumerable:\
    \ true,\n[](#cb190-21)      configurable: true\n[](#cb190-22)    }\n[](#cb190-23)\
    \  });\n[](#cb190-24)\n[](#cb190-25)Object.seal(obj);\n[](#cb190-26)\n[](#cb190-27)//\
    \ 密封后\n[](#cb190-28)assert.equal(Object.isExtensible(obj), false);\n[](#cb190-29)assert.deepEqual(\n\
    [](#cb190-30)  Object.getOwnPropertyDescriptors(obj),\n[](#cb190-31)  {\n[](#cb190-32)\
    \    first: {\n[](#cb190-33)      value: 'Jane',\n[](#cb190-34)      writable:\
    \ true,\n[](#cb190-35)      enumerable: true,\n[](#cb190-36)      configurable:\
    \ false\n[](#cb190-37)    },\n[](#cb190-38)    last: {\n[](#cb190-39)      value:\
    \ 'Doe',\n[](#cb190-40)      writable: true,\n[](#cb190-41)      enumerable: true,\n\
    [](#cb190-42)      configurable: false\n[](#cb190-43)    }\n[](#cb190-44)  });\n\
    ```\n\n我们仍然可以修改属性 `.first` 的值：\n\n```\n[](#cb191-1)obj.first = 'John';\n[](#cb191-2)assert.deepEqual(\n\
    [](#cb191-3)  obj, {first: 'John', last: 'Doe'});\n```\n\n但无法更改其属性描述符：\n\n```\n\
    [](#cb192-1)assert.throws(\n[](#cb192-2)  () => Object.defineProperty(obj, 'first',\
    \ { enumerable: false }),\n[](#cb192-3)  /^TypeError: Cannot redefine property:\
    \ first$/);\n```\n\n### 10.3.1 检查对象是否已密封\n\n```\n[](#cb193-1)Object.isSealed(obj:\
    \ any): boolean\n```\n\n检查 `obj` 是否已密封——例如：\n\n```\n> const obj = {};\n> Object.isSealed(obj)\n\
    false\n> Object.seal(obj)\n{}\n> Object.isSealed(obj)\ntrue\n```\n\n## 10.4 冻结\n\
    \n```\n[](#cb195-1)Object.freeze<T>(obj: T): T;\n```\n\n*   如果 `obj` 不是对象，则立即返回\
    \ `obj`。\n*   否则，将所有属性设置为不可写，密封 `obj`，然后返回它。也就是说，`obj` 不可扩展，所有属性均为只读，且无法改变这一状态。\n\
    \n```\n[](#cb196-1)const point = { x: 17, y: -5 };\n[](#cb196-2)Object.freeze(point);\n\
    [](#cb196-3)\n[](#cb196-4)assert.throws(\n[](#cb196-5)  () => point.x = 2,\n[](#cb196-6)\
    \  /^TypeError: Cannot assign to read only property 'x'/);\n[](#cb196-7)\n[](#cb196-8)assert.throws(\n\
    [](#cb196-9)  () => Object.defineProperty(point, 'x', {enumerable: false}),\n\
    [](#cb196-10)  /^TypeError: Cannot redefine property: x$/);\n[](#cb196-11)\n[](#cb196-12)assert.throws(\n\
    [](#cb196-13)  () => point.z = 4,\n[](#cb196-14)  /^TypeError: Cannot add property\
    \ z, object is not extensible$/);\n```\n\n### 10.4.1 检查对象是否已冻结\n\n```\n[](#cb197-1)Object.isFrozen(obj:\
    \ any): boolean\n```\n\n检查 `obj` 是否已冻结——例如：\n\n```\n> const point = { x: 17, y:\
    \ -5 };\n> Object.isFrozen(point)\nfalse\n> Object.freeze(point)\n{ x: 17, y:\
    \ -5 }\n> Object.isFrozen(point)\ntrue\n```\n\n### 10.4.2 冻结是浅层的\n\n`Object.freeze(obj)`\
    \ 仅冻结 `obj` 及其属性，不会冻结这些属性的值——例如：\n\n```\n[](#cb199-1)const teacher = {\n[](#cb199-2)\
    \  name: 'Edna Krabappel',\n[](#cb199-3)  students: ['Bart'],\n[](#cb199-4)};\n\
    [](#cb199-5)Object.freeze(teacher);\n[](#cb199-6)\n[](#cb199-7)// 无法修改自有属性：\n\
    [](#cb199-8)assert.throws(\n[](#cb199-9)  () => teacher.name = 'Elizabeth Hoover',\n\
    [](#cb199-10)  /^TypeError: Cannot assign to read only property 'name'/);\n[](#cb199-11)\n\
    [](#cb199-12)// 但遗憾的是，我们仍然可以修改自有属性的值：\n[](#cb199-13)teacher.students.push('Lisa');\n\
    [](#cb199-14)assert.deepEqual(\n[](#cb199-15)  teacher, {\n[](#cb199-16)    name:\
    \ 'Edna Krabappel',\n[](#cb199-17)    students: ['Bart', 'Lisa'],\n[](#cb199-18)\
    \  });\n```\n\n### 10.4.3 实现深度冻结\n\n如果需要深度冻结，我们需要自己实现：\n\n```\n[](#cb200-1)function\
    \ deepFreeze(value) {\n[](#cb200-2)  if (Array.isArray(value)) {\n[](#cb200-3)\
    \    for (const element of value) {\n[](#cb200-4)      deepFreeze(element);\n\
    [](#cb200-5)    }\n[](#cb200-6)    Object.freeze(value);\n[](#cb200-7)  } else\
    \ if (typeof value === 'object' && value !== null) {\n[](#cb200-8)    for (const\
    \ v of Object.values(value)) {\n[](#cb200-9)      deepFreeze(v);\n[](#cb200-10)\
    \    }\n[](#cb200-11)    Object.freeze(value);\n[](#cb200-12)  } else {\n[](#cb200-13)\
    \    // 无需操作：原始值已经是不可变的\n[](#cb200-14)  } \n[](#cb200-15)  return value;\n[](#cb200-16)}\n\
    ```\n\n重新审视上一节的示例，检查 `deepFreeze()` 是否真正实现了深度冻结：\n\n```\n[](#cb201-1)const teacher\
    \ = {\n[](#cb201-2)  name: 'Edna Krabappel',\n[](#cb201-3)  students: ['Bart'],\n\
    [](#cb201-4)};\n[](#cb201-5)deepFreeze(teacher);\n[](#cb201-6)\n[](#cb201-7)assert.throws(\n\
    [](#cb201-8)  () => teacher.students.push('Lisa'),\n[](#cb201-9)  /^TypeError:\
    \ Cannot add property 1, object is not extensible$/);\n```\n\n## 10.5 延伸阅读\n\n\
    *   关于防止数据结构被更改的更多模式：参见 §15 “集合的不可变包装器”\n\n# 11 属性：赋值 vs. 定义\n\n* * *\n\n*   11.1 赋值\
    \ vs. 定义\n\n    *   11.1.1 赋值\n\n    *   11.1.2 定义\n\n"
