    If, however, the result of `.getParts()` is changed (line A), then the `StringBuilder`\
    \ ceases to work correctly:\n\n```\n[](#cb149-1)const sb2 = new StringBuilder();\n\
    [](#cb149-2)sb2.add('Hello');\n[](#cb149-3)sb2.add(' world!');\n[](#cb149-4)sb2.getParts().length\
    \ = 0; // (A)\n[](#cb149-5)assert.equal(sb2.toString(), ''); // not OK\n```\n\n\
    The solution is to copy the internal `._data` defensively before it is exposed\
    \ (line A):\n\n```\n[](#cb150-1)class StringBuilder {\n[](#cb150-2)  this._data\
    \ = [];\n[](#cb150-3)  add(str) {\n[](#cb150-4)    this._data.push(str);\n[](#cb150-5)\
    \  }\n[](#cb150-6)  getParts() {\n[](#cb150-7)    // Copy defensively\n[](#cb150-8)\
    \    return [...this._data]; // (A)\n[](#cb150-9)  }\n[](#cb150-10)  toString()\
    \ {\n[](#cb150-11)    return this._data.join('');\n[](#cb150-12)  }\n[](#cb150-13)}\n\
    ```\n\nNow changing the result of `.getParts()` doesn’t interfere with the operation\
    \ of `sb` anymore:\n\n```\n[](#cb151-1)const sb = new StringBuilder();\n[](#cb151-2)sb.add('Hello');\n\
    [](#cb151-3)sb.add(' world!');\n[](#cb151-4)sb.getParts().length = 0;\n[](#cb151-5)assert.equal(sb.toString(),\
    \ 'Hello world!'); // OK\n```\n\n## 8.3 Avoiding mutations by updating non-destructively\n\
    \nWe can avoid mutations if we only update data non-destructively.\n\n![](media/file0.svg) \
    \ **Background**\n\nFor more information on updating data, see [§7 “Updating data\
    \ destructively and non-destructively”](#ch008.xhtml_ch_updating-destructively-and-nondestructively).\n\
    \n### 8.3.1 How does non-destructive updating help with shared mutable state?\n\
    \nWith non-destructive updating, sharing data becomes unproblematic, because we\
    \ never mutate the shared data. (This only works if everyone that accesses the\
    \ data does that!)\n\nIntriguingly, copying data becomes trivially simple:\n\n\
    ```\n[](#cb152-1)const original = {city: 'Berlin', country: 'Germany'};\n[](#cb152-2)const\
    \ copy = original;\n```\n\nThis works, because we are only making non-destructive\
    \ changes and are therefore copying the data on demand.\n\n## 8.4 Preventing mutations\
    \ by making data immutable\n\nWe can prevent mutations of shared data by making\
    \ that data immutable.\n\n![](media/file0.svg)  **Background**\n\nFor background\
    \ on how to make data immutable in JavaScript, please refer to the following two\
    \ chapters in this book:\n\n*   [§10 “Protecting objects from being changed”](#ch011.xhtml_ch_protecting-objects)\n\
    \n*   [§15 “Immutable wrappers for collections”](#ch016.xhtml_ch_immutable-collection-wrappers)\n\
    \n### 8.4.1 How does immutability help with shared mutable state?\n\nIf data is\
    \ immutable, it can be shared without any risks. In particular, there is no need\
    \ to copy defensively.\n\n![](media/file2.svg)  **Non-destructive updating is\
    \ an important complement to immutable data**\n\nIf we combine the two, immutable\
    \ data becomes virtually as versatile as mutable data but without the associated\
    \ risks.\n\n## 8.5 Libraries for avoiding shared mutable state\n\nThere are several\
    \ libraries available for JavaScript that support immutable data with non-destructive\
    \ updating. Two popular ones are:\n\n*   [Immutable.js](https://github.com/immutable-js/immutable-js)\
    \ provides immutable data structures for lists, stacks, sets, maps, etc.\n\n*\
    \   [Immer](https://immerjs.github.io/immer/) also supports immutability and non-destructive\
    \ updating but for plain objects, Arrays, Sets, and Maps. That is, no new data\
    \ structures are needed.\n\nThese libraries are described in more detail in the\
    \ next two sections.\n\n### 8.5.1 Immutable.js\n\nIn its repository, [the library\
    \ Immutable.js](https://github.com/immutable-js/immutable-js) is described as:\n\
    \n> Immutable persistent data collections for JavaScript which increase efficiency\
    \ and simplicity.\n\nImmutable.js provides immutable data structures such as:\n\
    \n*   `List`\n\n*   `Stack`\n\n*   `Set` (which is different from JavaScript’s\
    \ built-in `Set`)\n\n*   `Map` (which is different from JavaScript’s built-in\
    \ `Map`)\n\n*   Etc.\n\nIn the following example, we use an immutable `Map`:\n\
    \n```\n[](#cb153-1)import {Map} from 'immutable/dist/immutable.es.js';\n[](#cb153-2)const\
    \ map0 = Map([\n[](#cb153-3)  [false, 'no'],\n[](#cb153-4)  [true, 'yes'],\n[](#cb153-5)]);\n\
    [](#cb153-6)\n[](#cb153-7)// We create a modified version of map0:\n[](#cb153-8)const\
    \ map1 = map0.set(true, 'maybe');\n[](#cb153-9)\n[](#cb153-10)// The modified\
    \ version is different from the original:\n[](#cb153-11)assert.ok(map1 !== map0);\n\
    [](#cb153-12)assert.equal(map1.equals(map0), false); // (A)\n[](#cb153-13)\n[](#cb153-14)//\
    \ We undo the change we just made:\n[](#cb153-15)const map2 = map1.set(true, 'yes');\n\
    [](#cb153-16)\n[](#cb153-17)// map2 is a different object than map0,\n[](#cb153-18)//\
    \ but it has the same content\n[](#cb153-19)assert.ok(map2 !== map0);\n[](#cb153-20)assert.equal(map2.equals(map0),\
    \ true); // (B)\n```\n\nNotes:\n\n*   Instead of modifying the receiver, “destructive”\
    \ operations such as `.set()` return modified copies.\n\n*   To check if two data\
    \ structures have the same content, we use the built-in `.equals()` method (line\
    \ A and line B).\n\n### 8.5.2 Immer\n\nIn its repository, [the library Immer](https://immerjs.github.io/immer/)\
    \ is described as:\n\n> Create the next immutable state by mutating the current\
    \ one.\n\nImmer helps with non-destructively updating (potentially nested) plain\
    \ objects, Arrays, Sets, and Maps. That is, there are no custom data structures\
    \ involved.\n\nThis is what using Immer looks like:\n\n```\n[](#cb154-1)import\
    \ {produce} from 'immer/dist/immer.module.js';\n[](#cb154-2)\n[](#cb154-3)const\
    \ people = [\n[](#cb154-4)  {name: 'Jane', work: {employer: 'Acme'}},\n[](#cb154-5)];\n\
    [](#cb154-6)\n[](#cb154-7)const modifiedPeople = produce(people, (draft) => {\n\
    [](#cb154-8)  draft[0].work.employer = 'Cyberdyne';\n[](#cb154-9)  draft.push({name:\
    \ 'John', work: {employer: 'Spectre'}});\n[](#cb154-10)});\n[](#cb154-11)\n[](#cb154-12)assert.deepEqual(modifiedPeople,\
    \ [\n[](#cb154-13)  {name: 'Jane', work: {employer: 'Cyberdyne'}},\n[](#cb154-14)\
    \  {name: 'John', work: {employer: 'Spectre'}},\n[](#cb154-15)]);\n[](#cb154-16)assert.deepEqual(people,\
    \ [\n[](#cb154-17)  {name: 'Jane', work: {employer: 'Acme'}},\n[](#cb154-18)]);\n\
    ```\n\nThe original data is stored in `people`. `produce()` provides us with a\
    \ variable `draft`. We pretend that this variable is `people` and use operations\
    \ with which we would normally make destructive changes. Immer intercepts these\
    \ operations. Instead of mutating `draft`, it non-destructively changes `people`.\
    \ The result is referenced by `modifiedPeople`. As a bonus, it is deeply immutable.\n\
    \n`assert.deepEqual()` works because Immer returns plain objects and Arrays.\n\
    \n# 9 Property attributes: an introduction\n\n* * *\n\n*   9.1 [The structure\
    \ of objects](#ch010.xhtml_the-structure-of-objects)\n\n    *   9.1.1 [Internal\
    \ slots](#ch010.xhtml_internal-slots)\n\n    *   9.1.2 [Property keys](#ch010.xhtml_property-keys)\n\
    \n    *   9.1.3 [Property attributes](#ch010.xhtml_property-attributes)\n\n* \
    \  9.2 [Property descriptors](#ch010.xhtml_property-descriptors)\n\n*   9.3 [Retrieving\
    \ descriptors for properties](#ch010.xhtml_retrieving-descriptors-for-properties)\n\
    \n    *   9.3.1 [`Object.getOwnPropertyDescriptor()`: retrieving a descriptor\
    \ for a single property](#ch010.xhtml_object.getownpropertydescriptor-retrieving-a-descriptor-for-a-single-property)"
