  trans: "\n\n### 13.3.3 改进：实例默认不激活，通过工厂方法激活\n\n另一种更冗长的变体是，默认情况下，实例通过标志 `.#active`\
    \ 关闭。用于激活实例的初始化方法 `.#init()` 无法从外部访问，但 `Data.container()` 可以调用它：\n\n```\nclass\
    \ DataContainer {\n  #data;\n  static async create() {\n    const data = await\
    \ Promise.resolve('downloaded');\n    return new this().#init(data);\n  }\n\n\
    \  #active = false;\n  constructor() {\n  }\n  #init(data) {\n    this.#active\
    \ = true;\n    this.#data = data;\n    return this;\n  }\n  getData() {\n    this.#check();\n\
    \    return 'DATA: '+this.#data;\n  }\n  #check() {\n    if (!this.#active) {\n\
    \      throw new Error('Not created by factory');\n    }\n  }\n}\nDataContainer.create()\n\
    \  .then(dc => assert.equal(\n    dc.getData(), 'DATA: downloaded'));\n```\n\n\
    标志 `.#active` 通过私有方法 `.#check()` 强制执行，该方法必须在每个方法的开头调用。\n\n此解决方案的主要缺点是冗长。此外，还存在在每个方法中忘记调用\
    \ `.#check()` 的风险。\n\n### 13.3.4 变体：独立的工厂函数\n\n为了完整性，我将展示另一种变体：除了使用静态方法作为工厂，你还可以使用一个独立的函数。\n\
    \n```\nconst secretToken = Symbol('secretToken');\nclass DataContainer {\n  #data;\n\
    \  constructor(token, data) {\n    if (token !== secretToken) {\n      throw new\
    \ Error('Constructor is private');\n    }\n    this.#data = data;\n  }\n  getData()\
    \ {\n    return 'DATA: '+this.#data;\n  }\n}\n\nasync function createDataContainer()\
    \ {\n  const data = await Promise.resolve('downloaded');\n  return new DataContainer(secretToken,\
    \ data);\n}\n\ncreateDataContainer()\n  .then(dc => assert.equal(\n    dc.getData(),\
    \ 'DATA: downloaded'));\n```\n\n作为工厂的独立函数偶尔有用，但在这种情况下，我更喜欢静态方法：\n\n*   独立函数无法访问\
    \ `DataContainer` 的私有成员。\n\n*   我更喜欢 `DataContainer.create()` 的写法。\n\n## 13.4 继承基于\
    \ Promise 的构造函数（可选）\n\n一般来说，继承应谨慎使用。\n\n使用独立的工厂函数，扩展 `DataContainer` 相对容易。\n\n\
    然而，继承基于 Promise 的构造函数会导致严重的限制。在下面的示例中，我们继承了 `DataContainer`。子类 `SubDataContainer`\
    \ 拥有自己的私有字段 `.#moreData`，它通过挂钩到其超类构造函数返回的 Promise 来异步初始化该字段。\n\n```\nclass DataContainer\
    \ {\n  #data;\n  constructor() {\n    return Promise.resolve('downloaded')\n \
    \     .then(data => {\n        this.#data = data;\n        return this; // (A)\n\
    \      });\n  }\n  getData() {\n    return 'DATA: '+this.#data;\n  }\n}\n\nclass\
    \ SubDataContainer extends DataContainer {\n  #moreData;\n  constructor() {\n\
    \    super();\n    const promise = this;\n    return promise\n      .then(_this\
    \ => {\n        return Promise.resolve('more')\n          .then(moreData => {\n\
    \            _this.#moreData = moreData;\n            return _this;\n        \
    \  });\n      });\n  }\n  getData() {\n    return super.getData() + ', ' + this.#moreData;\n\
    \  }\n}\n```\n\n遗憾的是，我们无法实例化这个类：\n\n```\nassert.rejects(\n  () => new SubDataContainer(),\n\
    \  {\n    name: 'TypeError',\n    message: 'Cannot write private member #moreData\
    \ ' +\n      'to an object whose class did not declare it',\n  }\n);\n```\n\n\
    为什么会失败？构造函数总是将其私有字段添加到其 `this` 上。然而，在这里，子构造函数中的 `this` 是超构造函数返回的 Promise（而不是通过\
    \ Promise 传递的 `SubDataContainer` 实例）。\n\n但是，如果 `SubDataContainer` 没有任何私有字段，这种方法仍然有效。\n\
    \n## 13.5 结论\n\n对于本章讨论的场景，我更喜欢基于 Promise 的构造函数，或者使用秘密令牌的静态工厂方法加私有构造函数。\n\n然而，这里介绍的其他技术在其他场景中仍然有用。\n\
    \n## 13.6 延伸阅读\n\n*   异步编程：\n\n    *   [《JavaScript 面向急躁的程序员》中的“用于异步编程的 Promise”一章](https://exploringjs.com/impatient-js/ch_promises.html)\n\
    \n    *   [《JavaScript 面向急躁的程序员》中的“异步函数”一章](https://exploringjs.com/impatient-js/ch_async-functions.html)\n\
    \n    *   [《JavaScript 面向急躁的程序员》中的“立即调用的异步箭头函数”一节](https://exploringjs.com/impatient-js/ch_async-functions.html#immediately-invoked-async-arrow-functions)\n\
    \n*   面向对象编程：\n\n    *   [《JavaScript 面向急躁的程序员》中的“原型链和类”一章](https://exploringjs.com/impatient-js/ch_proto-chains-classes.html)\n\
    \n    *   [博客文章“ES 提案：私有类字段”](https://2ality.com/2019/07/private-class-fields.html)\n\
    \n    *   [博客文章“ES 提案：JavaScript 类中的私有方法和访问器”](https://2ality.com/2019/07/private-methods-accessors-in-classes.html)\n\
    \n# 14 复制类的实例：`.clone()` 与复制构造函数\n\n* * *\n\n*   14.1 `.clone()` 方法\n*   14.2 静态工厂方法\n\
    *   14.3 致谢\n\n* * *\n\n在本章中，我们探讨两种实现类实例复制的方法：\n\n*   `.clone()` 方法\n*   所谓的*复制构造函数*，即接收当前类的另一个实例并用其初始化当前实例的构造函数。\n\
    \n## 14.1 `.clone()` 方法\n\n这种技术为每个需要复制实例的类引入一个 `.clone()` 方法。它返回 `this` 的深拷贝。以下示例展示了三个可克隆的类。\n\
    \n```\nclass Point {\n  constructor(x, y) {\n    this.x = x;\n    this.y = y;\n\
    \  }\n  clone() {\n    return new Point(this.x, this.y);\n  }\n}\nclass Color\
    \ {\n  constructor(name) {\n    this.name = name;\n  }\n  clone() {\n    return\
    \ new Color(this.name);\n  }\n}\nclass ColorPoint extends Point {\n  constructor(x,\
    \ y, color) {\n    super(x, y);\n    this.color = color;\n  }\n  clone() {\n \
    \   return new ColorPoint(\n      this.x, this.y, this.color.clone()); // (A)\n\
    \  }\n}\n```\n\n第 A 行展示了这种技术的一个重要方面：复合实例属性值也必须递归地克隆。\n\n## 14.2 静态工厂方法\n\n"
- fmt: "\nA `copy constructor` is a constructor that uses another instance of the\
    \ current class to set up the current instance. Copy constructors are popular\
    \ in static languages such as C++ and Java, where you can provide multiple versions\
    \ of a constructor via `static overloading`. Here, `static` means that the choice\
    \ which version to use, is made at compile time.\n\nIn JavaScript, we must make\
    \ that decision at runtime and that leads to inelegant code:\n\n```\n[](#cb260-1)class\
    \ Point {\n[](#cb260-2)  constructor(...args) {\n[](#cb260-3)    if (args[0] instanceof\
    \ Point) {\n[](#cb260-4)      // Copy constructor\n[](#cb260-5)      const [other]\
    \ = args;\n[](#cb260-6)      this.x = other.x;\n[](#cb260-7)      this.y = other.y;\n\
    [](#cb260-8)    } else {\n[](#cb260-9)      const [x, y] = args;\n[](#cb260-10)\
    \      this.x = x;\n[](#cb260-11)      this.y = y;\n[](#cb260-12)    }\n[](#cb260-13)\
    \  }\n[](#cb260-14)}\n```\n\nThis is how you’d use this class:\n\n```\n[](#cb261-1)const\
    \ original = new Point(-1, 4);\n[](#cb261-2)const copy = new Point(original);\n\
    [](#cb261-3)assert.deepEqual(copy, original);\n```\n\n`Static factory methods`\
    \ are an alternative to constructors and work better in this case because we can\
    \ directly invoke the desired functionality. (Here, `static` means that these\
    \ factory methods are class methods.)\n\nIn the following example, the three classes\
    \ `Point`, `Color` and `ColorPoint` each have a static factory method `.from()`:\n\
    \n```\n[](#cb262-1)class Point {\n[](#cb262-2)  constructor(x, y) {\n[](#cb262-3)\
    \    this.x = x;\n[](#cb262-4)    this.y = y;\n[](#cb262-5)  }\n[](#cb262-6) \
    \ static from(other) {\n[](#cb262-7)    return new Point(other.x, other.y);\n\
    [](#cb262-8)  }\n[](#cb262-9)}\n[](#cb262-10)class Color {\n[](#cb262-11)  constructor(name)\
    \ {\n[](#cb262-12)    this.name = name;\n[](#cb262-13)  }\n[](#cb262-14)  static\
    \ from(other) {\n[](#cb262-15)    return new Color(other.name);\n[](#cb262-16)\
    \  }\n[](#cb262-17)}\n[](#cb262-18)class ColorPoint extends Point {\n[](#cb262-19)\
    \  constructor(x, y, color) {\n[](#cb262-20)    super(x, y);\n[](#cb262-21)  \
    \  this.color = color;\n[](#cb262-22)  }\n[](#cb262-23)  static from(other) {\n\
    [](#cb262-24)    return new ColorPoint(\n[](#cb262-25)      other.x, other.y,\
    \ Color.from(other.color)); // (A)\n[](#cb262-26)  }\n[](#cb262-27)}\n```\n\n\
    In line A, we once again copy recursively.\n\nThis is how `ColorPoint.from()`\
    \ works:\n\n```\n[](#cb263-1)const original = new ColorPoint(-1, 4, new Color('red'));\n\
    [](#cb263-2)const copy = ColorPoint.from(original);\n[](#cb263-3)assert.deepEqual(copy,\
    \ original);\n```\n\n## 14.3 Acknowledgements\n\n*   [Ron Korvig](https://github.com/ronkorving)\
    \ reminded me to use static factory methods and not overloaded constructors for\
    \ deep-copying in JavaScript.\n\n# 15 Immutable wrappers for collections\n\n*\
    \ * *\n\n*   15.1 [Wrapping objects](#ch016.xhtml_wrapping-objects)\n\n    * \
    \  15.1.1 [Making collections immutable via wrapping](#ch016.xhtml_making-collections-immutable-via-wrapping)\n\
    \n*   15.2 [An immutable wrapper for Maps](#ch016.xhtml_an-immutable-wrapper-for-maps)\n\
    \n*   15.3 [An immutable wrapper for Arrays](#ch016.xhtml_an-immutable-wrapper-for-arrays)\n\
    \n* * *\n\nAn immutable wrapper for a collection makes that collection immutable\
    \ by wrapping it in a new object. In this chapter, we examine how that works and\
    \ why it is useful.\n\n## 15.1 Wrapping objects\n\nIf there is an object whose\
    \ interface we’d like to reduce, we can take the following approach:\n\n*   Create\
    \ a new object that stores the original in a private field. The new object is\
    \ said to `wrap` the original object. The new object is called `wrapper`, the\
    \ original object `wrapped object`.\n\n*   The wrapper only forwards some of the\
    \ method calls it receives to the wrapped object.\n\nThis is what wrapping looks\
    \ like:\n\n```\n[](#cb264-1)class Wrapper {\n[](#cb264-2)  #wrapped;\n[](#cb264-3)\
    \  constructor(wrapped) {\n[](#cb264-4)    this.#wrapped = wrapped;\n[](#cb264-5)\
    \  }\n[](#cb264-6)  allowedMethod1(...args) {\n[](#cb264-7)    return this.#wrapped.allowedMethod1(...args);\n\
    [](#cb264-8)  }\n[](#cb264-9)  allowedMethod2(...args) {\n[](#cb264-10)    return\
    \ this.#wrapped.allowedMethod2(...args);\n[](#cb264-11)  }\n[](#cb264-12)}\n```\n\
    \nRelated software design patterns:\n\n*   Wrapping is related to [the Gang of\
    \ Four design pattern `Facade`](https://en.wikipedia.org/wiki/Facade_pattern).\n\
    \n*   We used [`forwarding`](https://en.wikipedia.org/wiki/Forwarding_(object-oriented_programming))\
    \ to implement [`delegation`](https://en.wikipedia.org/wiki/Delegation_pattern).\
    \ Delegation means that one object lets another object (the `delegate`) handle\
    \ some of its work. It is an alternative to inheritance for sharing code.\n\n\
    ### 15.1.1 Making collections immutable via wrapping\n\nTo make a collection immutable,\
    \ we can use wrapping and remove all destructive operations from its interface.\n\
    \nOne important use case for this technique is an object that has an internal\
    \ mutable data structure that it wants to export safely without copying it. The\
    \ export being “live” may also be a goal. The object can achieve its goals by\
    \ wrapping the internal data structure and making it immutable.\n\nThe next two\
    \ sections showcase immutable wrappers for Maps and Arrays. They both have the\
    \ following limitations:\n\n*   They are sketches. More work is needed to make\
    \ them suitable for practical use: Better checks, support for more methods, etc.\n\
    \n*   They work shallowly: Each one makes the wrapped object immutable, but not\
    \ the data it returns. This could be fixed by wrapping some of the results that\
    \ are returned by methods.\n\n## 15.2 An immutable wrapper for Maps\n\nClass `ImmutableMapWrapper`\
    \ produces wrappers for Maps:\n\n```\n[](#cb265-1)class ImmutableMapWrapper {\n\
    [](#cb265-2)  static _setUpPrototype() {\n[](#cb265-3)    // Only forward non-destructive\
    \ methods to the wrapped Map:\n[](#cb265-4)    for (const methodName of ['get',\
    \ 'has', 'keys', 'size']) {\n[](#cb265-5)      ImmutableMapWrapper.prototype[methodName]\
    \ = function (...args) {\n[](#cb265-6)        return this.#wrappedMap[methodName](...args);\n\
    [](#cb265-7)      }\n[](#cb265-8)    }\n[](#cb265-9)  }\n[](#cb265-10)\n[](#cb265-11)\
    \  #wrappedMap;\n[](#cb265-12)  constructor(wrappedMap) {\n[](#cb265-13)    this.#wrappedMap\
    \ = wrappedMap;\n[](#cb265-14)  }\n[](#cb265-15)}\n[](#cb265-16)ImmutableMapWrapper._setUpPrototype();\n\
    ```\n\nThe setup of the prototype has to be performed by a static method, because\
    \ we only have access to the private field `.#wrappedMap` from inside the class.\n\
    \nThis is `ImmutableMapWrapper` in action:\n\n```\n[](#cb266-1)const map = new\
    \ Map([[false, 'no'], [true, 'yes']]);\n[](#cb266-2)const wrapped = new ImmutableMapWrapper(map);\n\
    [](#cb266-3)\n[](#cb266-4)// Non-destructive operations work as usual:\n[](#cb266-5)assert.equal(\n\
    [](#cb266-6)  wrapped.get(true), 'yes');\n[](#cb266-7)assert.equal(\n[](#cb266-8)\
    \  wrapped.has(false), true);\n[](#cb266-9)assert.deepEqual(\n[](#cb266-10)  [...wrapped.keys()],\
    \ [false, true]);\n[](#cb266-11)\n[](#cb266-12)// Destructive operations are not\
    \ available:\n[](#cb266-13)assert.throws(\n[](#cb266-14)  () => wrapped.set(false,\
    \ 'never!'),\n[](#cb266-15)  /^TypeError: wrapped.set is not a function$/);\n\
    [](#cb266-16)assert.throws(\n[](#cb266-17)  () => wrapped.clear(),\n[](#cb266-18)\
    \  /^TypeError: wrapped.clear is not a function$/);\n```\n\n## 15.3 An immutable\
    \ wrapper for Arrays\n\nFor an Array `arr`, normal wrapping is not enough because\
    \ we need to intercept not just method calls, but also property accesses such\
    \ as `arr[1] = true`. [JavaScript proxies](https://exploringjs.com/es6/ch_proxies.html)\
    \ enable us to do this:\n"
