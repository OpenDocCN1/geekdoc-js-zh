  trans: "\nECMAScript 规范多次使用模运算——例如：\n\n*   将[`>>>` 运算符](https://tc39.es/ecma262/#sec-unsigned-right-shift-operator)的操作数转换为无符号\
    \ 32 位整数（`x mod 2**32`）：\n\n    ```\n    > 2**32 >>> 0\n    0\n    > (2**32)+1\
    \ >>> 0\n    1\n    > (-1 >>> 0) === (2**32)-1\n    true\n    ```\n\n*   将任意数字转换为适合\
    \ Typed Arrays 的形式。例如，`x mod 2**8` 用于将数字转换为无符号 8 位整数（先将其转换为整数）：\n\n    ```\n \
    \   [](#cb111-1)const tarr = new Uint8Array(1);\n    [](#cb111-2)\n    [](#cb111-3)tarr[0]\
    \ = 256;\n    [](#cb111-4)assert.equal(tarr[0], 0);\n    [](#cb111-5)\n    [](#cb111-6)tarr[0]\
    \ = 257;\n    [](#cb111-7)assert.equal(tarr[0], 1);\n    ```\n\n## 5.7 本章的进一步阅读和资料来源\n\
    \n*   [关于“模运算”的维基百科页面](https://en.wikipedia.org/wiki/Modulo_operation)包含大量信息。\n\
    \n*   ECMAScript 规范[提到](https://tc39.es/ecma262/#sec-applying-the-mod-operator)\
    \ `%` 是通过“截断除法”计算的。\n\n*   《JavaScript 快速入门》中的[“四舍五入”一节](https://exploringjs.com/impatient-js/ch_math.html#math-rounding)描述了\
    \ JavaScript 中几种四舍五入的方法。\n\n# 6 复制对象和数组\n\n* * *\n\n*   6.1 浅拷贝与深拷贝\n\n*   6.2 JavaScript\
    \ 中的浅拷贝\n\n    *   6.2.1 通过展开复制普通对象和数组\n\n    *   6.2.2 通过 `Object.assign()` 进行浅拷贝（可选）\n\
    \n    *   6.2.3 通过 `Object.getOwnPropertyDescriptors()` 和 `Object.defineProperties()`\
    \ 进行浅拷贝（可选）\n\n*   6.3 JavaScript 中的深拷贝\n\n    *   6.3.1 通过嵌套展开手动深拷贝\n\n    *\
    \   6.3.2 技巧：通过 JSON 进行通用深拷贝\n\n    *   6.3.3 实现通用深拷贝\n\n*   6.4 进一步阅读\n\n* *\
    \ *\n\n在本章中，我们将学习如何在 JavaScript 中复制对象和数组。\n\n## 6.1 浅拷贝与深拷贝\n\n数据复制有两种“深度”：\n\n\
    *   *浅拷贝*只复制对象和数组的顶层条目。条目值在原始和副本中仍然相同。\n\n*   *深拷贝*还会复制条目值的条目等。也就是说，它遍历以要复制的值为根的完整树，并复制所有节点。\n\
    \n接下来的章节将介绍这两种复制。不幸的是，JavaScript 只内置支持浅拷贝。如果我们需要深拷贝，则需要自己实现。\n\n## 6.2 JavaScript\
    \ 中的浅拷贝\n\n让我们看看浅拷贝数据的几种方法。\n\n### 6.2.1 通过展开复制普通对象和数组\n\n我们可以通过展开[到对象字面量](https://exploringjs.com/impatient-js/ch_single-objects.html#spreading-into-object-literals)和[到数组字面量](https://exploringjs.com/impatient-js/ch_arrays.html#spreading-into-array-literals)来制作副本：\n\
    \n```\n[](#cb112-1)const copyOfObject = {...originalObject};\n[](#cb112-2)const\
    \ copyOfArray = [...originalArray];\n```\n\n唉，展开有几个问题。这些将在接下来的小节中介绍。其中，有些是真正的限制，有些只是特性。\n\
    \n#### 6.2.1.1 原型不会被复制\n\n例如：\n\n```\n[](#cb113-1)class MyClass {}\n[](#cb113-2)\n\
    [](#cb113-3)const original = new MyClass();\n[](#cb113-4)assert.equal(original\
    \ instanceof MyClass, true);\n[](#cb113-5)\n[](#cb113-6)const copy = {...original};\n\
    [](#cb113-7)assert.equal(copy instanceof MyClass, false);\n```\n\n注意以下两个表达式是等价的：\n\
    \n```\n[](#cb114-1)obj instanceof SomeClass\n[](#cb114-2)SomeClass.prototype.isPrototypeOf(obj)\n\
    ```\n\n因此，我们可以通过给副本赋予与原始相同的原型来修复这个问题：\n\n```\n[](#cb115-1)class MyClass {}\n[](#cb115-2)\n\
    [](#cb115-3)const original = new MyClass();\n[](#cb115-4)\n[](#cb115-5)const copy\
    \ = {\n[](#cb115-6)  __proto__: Object.getPrototypeOf(original),\n[](#cb115-7)\
    \  ...original,\n[](#cb115-8)};\n[](#cb115-9)assert.equal(copy instanceof MyClass,\
    \ true);\n```\n\n或者，我们可以在创建副本后通过 `Object.setPrototypeOf()` 设置其原型。\n\n#### 6.2.1.2 许多内置对象具有特殊的“内部插槽”，这些插槽不会被复制\n\
    \n此类内置对象的示例包括正则表达式和日期。如果我们复制它们，就会丢失其中存储的大部分数据。\n\n#### 6.2.1.3 只复制自有（非继承）属性\n\n\
    鉴于[原型链](https://exploringjs.com/impatient-js/ch_proto-chains-classes.html#prototype-chains)的工作方式，这通常是正确的方法。但我们仍然需要意识到这一点。在以下示例中，`original`\
    \ 的继承属性 `.inheritedProp` 在 `copy` 中不可用，因为我们只复制了自有属性，而没有保留原型。\n\n```\n[](#cb116-1)const\
    \ proto = { inheritedProp: 'a' };\n[](#cb116-2)const original = {__proto__: proto,\
    \ ownProp: 'b' };\n[](#cb116-3)assert.equal(original.inheritedProp, 'a');\n[](#cb116-4)assert.equal(original.ownProp,\
    \ 'b');\n[](#cb116-5)\n[](#cb116-6)const copy = {...original};\n[](#cb116-7)assert.equal(copy.inheritedProp,\
    \ undefined);\n[](#cb116-8)assert.equal(copy.ownProp, 'b');\n```\n\n#### 6.2.1.4 只复制可枚举属性\n\
    \n例如，数组实例的自有属性 `.length` 是不可枚举的，因此不会被复制：\n\n```\n[](#cb117-1)const arr = ['a',\
    \ 'b'];\n[](#cb117-2)assert.equal(arr.length, 2);\n[](#cb117-3)assert.equal({}.hasOwnProperty.call(arr,\
    \ 'length'), true);\n[](#cb117-4)\n[](#cb117-5)const copy = {...arr};\n[](#cb117-6)assert.equal({}.hasOwnProperty.call(copy,\
    \ 'length'), false);\n```\n\n这也很少成为限制，因为大多数属性都是可枚举的。如果需要复制不可枚举属性，可以使用 `Object.getOwnPropertyDescriptors()`\
    \ 和 `Object.defineProperties()` 来复制对象（如何操作将在后面解释）：\n\n*   它们考虑所有属性（不仅仅是 `value`），因此能正确复制\
    \ getter、setter、只读属性等。\n\n*   `Object.getOwnPropertyDescriptors()` 检索可枚举和不可枚举属性。\n\
    \n有关可枚举性的更多信息，请参见 §12 “属性的可枚举性”。\n\n#### 6.2.1.5 属性描述符并不总是被忠实地复制\n\n无论属性的*描述符*如何，其副本始终是一个可写且可配置的数据属性。\n\
    \n例如，这里我们创建了属性 `original.prop`，其描述符 `writable` 和 `configurable` 均为 `false`：\n\n\
    ```\n[](#cb118-1)const original = Object.defineProperties(\n[](#cb118-2)  {},\
    \ {\n[](#cb118-3)    prop: {\n[](#cb118-4)      value: 1,\n[](#cb118-5)      writable:\
    \ false,\n[](#cb118-6)      configurable: false,\n[](#cb118-7)      enumerable:\
    \ true,\n[](#cb118-8)    },\n[](#cb118-9)  });\n[](#cb118-10)assert.deepEqual(original,\
    \ {prop: 1});\n```\n\n如果我们复制 `.prop`，那么 `writable` 和 `configurable` 都变为 `true`：\n\
    \n```\n[](#cb119-1)const copy = {...original};\n[](#cb119-2)// Attributes `writable`\
    \ and `configurable` of copy are different:\n[](#cb119-3)assert.deepEqual(\n[](#cb119-4)\
    \  Object.getOwnPropertyDescriptors(copy),\n[](#cb119-5)  {\n[](#cb119-6)    prop:\
    \ {\n[](#cb119-7)      value: 1,\n[](#cb119-8)      writable: true,\n[](#cb119-9)\
    \      configurable: true,\n[](#cb119-10)      enumerable: true,\n[](#cb119-11)\
    \    },\n[](#cb119-12)  });\n```\n"
- fmt: "\nAs a consequence, getters and setters are not copied faithfully, either:\n\
    \n```\nconst original = {\n  get myGetter() { return 123 },\n  set mySetter(x)\
    \ {},\n};\nassert.deepEqual({...original}, {\n  myGetter: 123, // not a getter\
    \ anymore!\n  mySetter: undefined,\n});\n```\n\nThe aforementioned `Object.getOwnPropertyDescriptors()`\
    \ and `Object.defineProperties()` always transfer own properties with all attributes\
    \ intact ([as shown later](#ch007.xhtml_copying-via-property-descriptors)).\n\n\
    #### 6.2.1.6 Copying is shallow\n\nThe copy has fresh versions of each key-value\
    \ entry in the `original`, but the values of the `original` are not copied themselves.\
    \ For example:\n\n```\nconst original = {name: 'Jane', work: {employer: 'Acme'}};\n\
    const copy = {...original};\n\n// Property .name is a copy: changing the copy\n\
    // does not affect the original\ncopy.name = 'John';\nassert.deepEqual(original,\n\
    \  {name: 'Jane', work: {employer: 'Acme'}});\nassert.deepEqual(copy,\n  {name:\
    \ 'John', work: {employer: 'Acme'}});\n\n// The value of .work is shared: changing\
    \ the copy\n// affects the original\ncopy.work.employer = 'Spectre';\nassert.deepEqual(\n\
    \  original, {name: 'Jane', work: {employer: 'Spectre'}});\nassert.deepEqual(\n\
    \  copy, {name: 'John', work: {employer: 'Spectre'}});\n```\n\nWe’ll look at deep\
    \ copying later in this chapter.\n\n### 6.2.2 Shallow copying via `Object.assign()`\
    \ (optional)\n\n`Object.assign()` works mostly like spreading into objects. That\
    \ is, the following two ways of copying are mostly equivalent:\n\n```\nconst copy1\
    \ = {...original};\nconst copy2 = Object.assign({}, original);\n```\n\nUsing a\
    \ method instead of syntax has the benefit that it can be polyfilled on older\
    \ JavaScript engines via a library.\n\n`Object.assign()` is not completely like\
    \ spreading, though. It differs in one, relatively subtle point: it creates properties\
    \ differently.\n\n*   `Object.assign()` uses *assignment* to create the properties\
    \ of the copy.\n*   Spreading *defines* new properties in the copy.\n\nAmong other\
    \ things, assignment invokes own and inherited setters, while definition doesn’t\
    \ ([more information on assignment vs. definition](#ch012.xhtml_ch_property-assignment-vs-definition)).\
    \ This difference is rarely noticeable. The following code is an example, but\
    \ it’s contrived:\n\n```\nconst original = {['__proto__']: null}; // (A)\nconst\
    \ copy1 = {...original};\n// copy1 has the own property '__proto__'\nassert.deepEqual(\n\
    \  Object.keys(copy1), ['__proto__']);\n\nconst copy2 = Object.assign({}, original);\n\
    // copy2 has the prototype null\nassert.equal(Object.getPrototypeOf(copy2), null);\n\
    ```\n\nBy using a computed property key in line A, we create `.__proto__` as an\
    \ own property and don’t invoke the inherited setter. However, when `Object.assign()`\
    \ copies that property, it does invoke the setter. (For more information on `.__proto__`,\
    \ see [“JavaScript for impatient programmers”](https://exploringjs.com/impatient-js/ch_proto-chains-classes.html#proto).)\n\
    \n### 6.2.3 Shallow copying via `Object.getOwnPropertyDescriptors()` and `Object.defineProperties()`\
    \ (optional)\n\nJavaScript lets us create properties via [*property descriptors*](#ch010.xhtml_property-descriptors),\
    \ objects that specify property attributes. For example, via the `Object.defineProperties()`,\
    \ which we have already seen in action. If we combine that method with `Object.getOwnPropertyDescriptors()`,\
    \ we can copy more faithfully:\n\n```\nfunction copyAllOwnProperties(original)\
    \ {\n  return Object.defineProperties(\n    {}, Object.getOwnPropertyDescriptors(original));\n\
    }\n```\n\nThat eliminates two issues of copying objects via spreading.\n\nFirst,\
    \ all attributes of own properties are copied correctly. Therefore, we can now\
    \ copy own getters and own setters:\n\n```\nconst original = {\n  get myGetter()\
    \ { return 123 },\n  set mySetter(x) {},\n};\nassert.deepEqual(copyAllOwnProperties(original),\
    \ original);\n```\n\nSecond, thanks to `Object.getOwnPropertyDescriptors()`, non-enumerable\
    \ properties are copied, too:\n\n```\nconst arr = ['a', 'b'];\nassert.equal(arr.length,\
    \ 2);\nassert.equal({}.hasOwnProperty.call(arr, 'length'), true);\n\nconst copy\
    \ = copyAllOwnProperties(arr);\nassert.equal({}.hasOwnProperty.call(copy, 'length'),\
    \ true);\n```\n\n## 6.3 Deep copying in JavaScript\n\nNow it is time to tackle\
    \ deep copying. First, we will deep-copy manually, then we’ll examine generic\
    \ approaches.\n\n### 6.3.1 Manual deep copying via nested spreading\n\nIf we nest\
    \ spreading, we get deep copies:\n\n```\nconst original = {name: 'Jane', work:\
    \ {employer: 'Acme'}};\nconst copy = {name: original.name, work: {...original.work}};\n\
    \n// We copied successfully:\nassert.deepEqual(original, copy);\n// The copy is\
    \ deep:\nassert.ok(original.work !== copy.work);\n```\n\n### 6.3.2 Hack: generic\
    \ deep copying via JSON\n\nThis is a hack, but, in a pinch, it provides a quick\
    \ solution: In order to deep-copy an object `original`, we first convert it to\
    \ a JSON string and parse that JSON string:\n\n```\nfunction jsonDeepCopy(original)\
    \ {\n  return JSON.parse(JSON.stringify(original));\n}\nconst original = {name:\
    \ 'Jane', work: {employer: 'Acme'}};\nconst copy = jsonDeepCopy(original);\nassert.deepEqual(original,\
    \ copy);\n```\n\nThe significant downside of this approach is that we can only\
    \ copy properties with keys and values that are supported by JSON.\n\nSome unsupported\
    \ keys and values are simply ignored:\n\n```\nassert.deepEqual(\n  jsonDeepCopy({\n\
    \    // Symbols are not supported as keys\n    [Symbol('a')]: 'abc',\n    // Unsupported\
    \ value\n    b: function () {},\n    // Unsupported value\n    c: undefined,\n\
    \  }),\n  {} // empty object\n);\n```\n\nOthers cause exceptions:\n\n```\nassert.throws(\n\
    \  () => jsonDeepCopy({a: 123n}),\n  /^TypeError: Do not know how to serialize\
    \ a BigInt$/);\n```\n\n### 6.3.3 Implementing generic deep copying\n\nThe following\
    \ function generically deep-copies a value `original`:\n\n```\nfunction deepCopy(original)\
    \ {\n  if (Array.isArray(original)) {\n    const copy = [];\n    for (const [index,\
    \ value] of original.entries()) {\n      copy[index] = deepCopy(value);\n    }\n\
    \    return copy;\n  } else if (typeof original === 'object' && original !== null)\
    \ {\n    const copy = {};\n    for (const [key, value] of Object.entries(original))\
    \ {\n      copy[key] = deepCopy(value);\n    }\n    return copy;\n  } else {\n\
    \    // Primitive value: atomic, no need to copy\n    return original;\n  }\n\
    }\n```\n\nThe function handles three cases:\n\n*   If `original` is an Array we\
    \ create a new Array and deep-copy the elements of `original` into it.\n*   If\
    \ `original` is an object, we use a similar approach.\n*   If `original` is a\
    \ primitive value, we don’t have to do anything.\n\nLet’s try out `deepCopy()`:\n"
