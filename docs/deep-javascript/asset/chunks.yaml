    \ `ToNumber()`\n    *   `ToBigInt()`、`BigInt()`\n    *   抽象关系比较（`<`）\n*   `hint\
    \ === 'string'`。以下操作优先使用字符串：\n    *   `ToString()`\n    *   `ToPropertyKey()`\n\
    *   `hint === 'default'`。以下操作对返回的原始值类型保持中立：\n    *   抽象相等比较（`==`）\n    *   加法运算符（`+`）\n\
    \    *   `new Date(value)`（`value` 可以是数字或字符串）\n\n如我们所见，默认行为是将 `'default'` 当作 `'number'`\
    \ 处理。只有 `Symbol` 和 `Date` 的实例会覆盖此行为（稍后展示）。\n\n#### 2.4.1.2 将对象转换为原始值时调用哪些方法？\n\
    \n如果通过 `Symbol.toPrimitive` 未覆盖转换为原始值的行为，则 `OrdinaryToPrimitive()` 会调用以下两个方法中的一个或两个：\n\
    \n*   如果 `hint` 表示我们希望原始值为字符串，则首先调用 `'toString'`。\n*   如果 `hint` 表示我们希望原始值为数字，则首先调用\
    \ `'valueOf'`。\n\n以下代码演示了其工作原理：\n\n```\nconst obj = {\n  toString() { return 'a'\
    \ },\n  valueOf() { return 1 },\n};\n\n// String() 优先使用字符串：\nassert.equal(String(obj),\
    \ 'a');\n\n// Number() 优先使用数字：\nassert.equal(Number(obj), 1);\n```\n\n属性键为 `Symbol.toPrimitive`\
    \ 的方法会覆盖正常的转换为原始值的过程。在标准库中，这种情况只出现了两次：\n\n*   `Symbol.prototypeSymbol.toPrimitive`\n\
    \    *   如果接收者是 `Symbol` 的实例，此方法始终返回包装后的符号。\n    *   其原理是：`Symbol` 的实例有一个返回字符串的\
    \ `.toString()` 方法。但即使 `hint` 是 `'string'`，也不应调用 `.toString()`，以免意外将 `Symbol`\
    \ 实例转换为字符串（字符串是完全不同种类的属性键）。\n*   `Date.prototypeSymbol.toPrimitive`\n    *   接下来将详细解释。\n\
    \n#### 2.4.1.3 `Date.prototype[Symbol.toPrimitive]()`\n\n以下是 Date 处理转换为原始值的方式：\n\
    \n```\nDate.prototype[Symbol.toPrimitive] = function (\n  hint: 'default' | 'string'\
    \ | 'number') {\n    let O = this;\n    if (TypeOf(O) !== 'object') {\n      throw\
    \ new TypeError();\n    }\n    let tryFirst;\n    if (hint === 'string' || hint\
    \ === 'default') {\n      tryFirst = 'string';\n    } else if (hint === 'number')\
    \ {\n      tryFirst = 'number';\n    } else {\n      throw new TypeError();\n\
    \    }\n    return OrdinaryToPrimitive(O, tryFirst);\n  };\n```\n\n与默认算法的唯一区别在于，`'default'`\
    \ 被当作 `'string'`（而不是 `'number'`）。如果我们使用将 `hint` 设置为 `'default'` 的操作，可以观察到这一点：\n\
    \n*    `==` 运算符 在另一个操作数是除 `undefined`、`null` 和 `boolean` 之外的原始值时，会将对象强制转换为原始值（使用默认\
    \ hint）。在以下交互中，我们可以看到强制转换日期对象的结果是一个字符串：\n\n    ```\n    const d = new Date('2222-03-27');\n\
    \    assert.equal(\n      d == 'Wed Mar 27 2222 01:00:00 GMT+0100'\n         \
    \  + ' (Central European Standard Time)',\n      true);\n    ```\n\n*    `+` 运算符\
    \ 将两个操作数都强制转换为原始值（使用默认 hint）。如果其中一个结果是字符串，则执行字符串拼接（否则执行数字加法）。在以下交互中，我们可以看到强制转换日期对象的结果是一个字符串，因为运算符返回了字符串。\n\
    \n    ```\n    const d = new Date('2222-03-27');\n    assert.equal(\n      123\
    \ + d,\n      '123Wed Mar 27 2222 01:00:00 GMT+0100'\n        + ' (Central European\
    \ Standard Time)');\n    ```\n\n### 2.4.2 `ToString()` 及相关操作\n\n这是 `ToString()`\
    \ 的 JavaScript 版本：\n\n```\nfunction ToString(argument) {\n  if (argument === undefined)\
    \ {\n    return 'undefined';\n  } else if (argument === null) {\n    return 'null';\n\
    \  } else if (argument === true) {\n    return 'true';\n  } else if (argument\
    \ === false) {\n    return 'false';\n  } else if (TypeOf(argument) === 'number')\
    \ {\n    return Number.toString(argument);\n  } else if (TypeOf(argument) ===\
    \ 'string') {\n    return argument;\n  } else if (TypeOf(argument) === 'symbol')\
    \ {\n    throw new TypeError();\n  } else if (TypeOf(argument) === 'bigint') {\n\
    \    return BigInt.toString(argument);\n  } else {\n    // argument 是一个对象\n  \
    \  let primValue = ToPrimitive(argument, 'string'); // (A)\n    return ToString(primValue);\n\
    \  }\n}\n```\n\n注意，该函数对于对象，在将原始结果转换为字符串之前，会使用 `ToPrimitive()` 作为中间步骤（第 A 行）。\n\
    \n`ToString()` 与 `String()` 的工作方式有一个有趣的差异：如果 `argument` 是一个符号，前者会抛出 `TypeError`，而后者不会。这是为什么？符号的默认行为是，将其转换为字符串会抛出异常：\n\
    \n```\n> const sym = Symbol('sym');\n\n> ''+sym\nTypeError: Cannot convert a Symbol\
    \ value to a string\n> `${sym}`\nTypeError: Cannot convert a Symbol value to a\
    \ string\n```\n\n在 `String()` 和 `Symbol.prototype.toString()` 中覆盖了该默认行为（两者将在下一小节中描述）：\n\
    \n```\n> String(sym)\n'Symbol(sym)'\n> sym.toString()\n'Symbol(sym)'\n```\n\n\
    #### 2.4.2.1 `String()`\n\n```\nfunction String(value) {\n  let s;\n  if (value\
    \ === undefined) {\n    s = '';\n  } else {\n    if (new.target === undefined\
    \ && TypeOf(value) === 'symbol') {\n      // 此函数被作为函数调用，且 value 是一个符号\n      return\
    \ SymbolDescriptiveString(value);\n    }\n    s = ToString(value);\n  }\n  if\
    \ (new.target === undefined) {\n    // 此函数被作为函数调用\n    return s;\n  }\n  // 此函数被通过\
    \ new 调用\n  return StringCreate(s, new.target.prototype); // 简化版！\n}\n```\n\n\
    `String()` 的工作方式取决于它是通过函数调用还是通过 `new` 调用的。它使用 [`new.target`](https://exploringjs.com/es6/ch_classes.html#sec_allocating-and-initializing-instances)\
    \ 来区分这两种情况。\n\n以下是辅助函数 `StringCreate()` 和 `SymbolDescriptiveString()`：\n\n```\n\
    /** \n * 创建一个包装了 `value` 的 String 实例，\n * 并具有给定的原型。\n */\nfunction StringCreate(value,\
    \ prototype) {\n  // ···\n}\n\nfunction SymbolDescriptiveString(sym) {\n  assert.equal(TypeOf(sym),\
    \ 'symbol');\n  let desc = sym.description;\n  if (desc === undefined) {\n   \
    \ desc = '';\n  }\n  assert.equal(TypeOf(desc), 'string');\n  return 'Symbol('+desc+')';\n\
    }\n```\n\n#### 2.4.2.2 `Symbol.prototype.toString()`\n\n除了 `String()`，我们还可以使用方法\
    \ `.toString()` 将符号转换为字符串。其规范如下所示。\n\n"
