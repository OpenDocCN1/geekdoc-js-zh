    \    }\n  };\n  const rejectionTask = () => {\n    if (typeof onRejected === 'function')\
    \ {\n      onRejected(this._promiseResult);\n    }\n  };\n  switch (this._promiseState)\
    \ {\n    case 'pending':\n      this._fulfillmentTasks.push(fulfillmentTask);\n\
    \      this._rejectionTasks.push(rejectionTask);\n      break;\n    case 'fulfilled':\n\
    \      addToTaskQueue(fulfillmentTask);\n      break;\n    case 'rejected':\n\
    \      addToTaskQueue(rejectionTask);\n      break;\n    default:\n      throw\
    \ new Error();\n  }\n}\n```\n\n前面的代码片段使用了以下辅助函数：\n\n```\nfunction addToTaskQueue(task)\
    \ {\n  setTimeout(task, 0);\n}\n```\n\nPromise 必须始终异步地解决。这就是为什么我们不直接执行任务，而是将它们添加到事件循环（浏览器、Node.js\
    \ 等）的任务队列中。请注意，真正的 Promise API 并不使用普通任务（如 `setTimeout()`），而是使用 [*微任务*](https://jakearchibald.com/2015/tasks-microtasks-queues-and-schedules/)，它们与当前普通任务紧密耦合，并始终在其之后立即执行。\n\
    \n### 18.2.2 方法 `.resolve()`\n\n`.resolve()` 的工作方式如下：如果 Promise 已经解决，则不做任何操作（确保\
    \ Promise 只能被解决一次）。否则，Promise 的状态变为 `'fulfilled'`，并将结果缓存到 `this.promiseResult`\
    \ 中。接着，所有已入队的完成反应都会被调用。\n\n```\nresolve(value) {\n  if (this._promiseState !==\
    \ 'pending') return this;\n  this._promiseState = 'fulfilled';\n  this._promiseResult\
    \ = value;\n  this._clearAndEnqueueTasks(this._fulfillmentTasks);\n  return this;\
    \ // enable chaining\n}\n```\n\n```\n_clearAndEnqueueTasks(tasks) {\n  this._fulfillmentTasks\
    \ = undefined;\n  this._rejectionTasks = undefined;\n  tasks.map(addToTaskQueue);\n\
    }\n```\n\n`reject()` 与 `resolve()` 类似。\n\n## 18.3 版本 2：链式调用 `.then()`\n\n![](img/file11.svg)\n\
    \n图 4：`ToyPromise2` 链式调用 `.then()`：`.then()` 现在返回一个 Promise，该 Promise 由完成反应或拒绝反应返回的任何值来解析。\n\
    \n我们接下来实现的功能是链式调用（图 4）：从完成反应或拒绝反应返回的值可以被后续 `.then()` 调用中的完成反应处理。（在下一个版本中，由于对返回\
    \ Promise 的特殊支持，链式调用将变得更加有用。）\n\n在以下示例中：\n\n*   第一个 `.then()`：我们在完成反应中返回一个值。\n\
    *   第二个 `.then()`：我们通过完成反应接收该值。\n\n```\nnew ToyPromise2()\n  .resolve('result1')\n\
    \  .then(x => {\n    assert.equal(x, 'result1');\n    return 'result2';\n  })\n\
    \  .then(x => {\n    assert.equal(x, 'result2');\n  });\n```\n\n在以下示例中：\n\n* \
    \  第一个 `.then()`：我们在拒绝反应中返回一个值。\n*   第二个 `.then()`：我们通过完成反应接收该值。\n\n```\nnew ToyPromise2()\n\
    \  .reject('error1')\n  .then(null,\n    x => {\n      assert.equal(x, 'error1');\n\
    \      return 'result2';\n    })\n  .then(x => {\n    assert.equal(x, 'result2');\n\
    \  });\n```\n\n## 18.4 便捷方法 `.catch()`\n\n新版本引入了一个便捷方法 `.catch()`，使得仅提供拒绝反应更加容易。注意，仅提供完成反应已经很容易——我们只需省略\
    \ `.then()` 的第二个参数（参见前面的示例）。\n\n如果使用它（第 A 行），前面的示例看起来更简洁：\n\n```\nnew ToyPromise2()\n\
    \  .reject('error1')\n  .catch(x => { // (A)\n    assert.equal(x, 'error1');\n\
    \    return 'result2';\n  })\n  .then(x => {\n    assert.equal(x, 'result2');\n\
    \  });\n```\n\n以下两个方法调用是等价的：\n\n```\n.catch(rejectionReaction)\n.then(null, rejectionReaction)\n\
    ```\n\n这是 `.catch()` 的实现方式：\n\n```\ncatch(onRejected) { // [new]\n  return this.then(null,\
    \ onRejected);\n}\n```\n\n## 18.5 省略反应\n\n新版本还支持：如果我们省略完成反应，则传递完成；如果我们省略拒绝反应，则传递拒绝。为什么这很有用？\n\
    \n以下示例演示了传递拒绝：\n\n```\nsomeAsyncFunction()\n  .then(fulfillmentReaction1)\n  .then(fulfillmentReaction2)\n\
    \  .catch(rejectionReaction);\n```\n\n现在 `rejectionReaction` 可以处理 `someAsyncFunction()`、`fulfillmentReaction1`\
    \ 和 `fulfillmentReaction2` 的拒绝。\n\n以下示例演示了传递完成：\n\n```\nsomeAsyncFunction()\n\
    \  .catch(rejectionReaction)\n  .then(fulfillmentReaction);\n```\n\n如果 `someAsyncFunction()`\
    \ 拒绝了它的 Promise，`rejectionReaction` 可以修复任何问题并返回一个完成值，然后由 `fulfillmentReaction`\
    \ 处理。\n\n如果 `someAsyncFunction()` 完成了它的 Promise，`fulfillmentReaction` 也可以处理它，因为\
    \ `.catch()` 被跳过了。\n\n## 18.6 实现\n\n这一切在底层是如何处理的？\n\n*   `.then()` 返回一个 Promise，该\
    \ Promise 由 `onFulfilled` 或 `onRejected` 返回的值来解析。\n*   如果缺少 `onFulfilled` 或 `onRejected`，则它们本应接收的值会被传递给\
    \ `.then()` 返回的 Promise。\n\n只有 `.then()` 发生了变化：\n\n```\nthen(onFulfilled, onRejected)\
    \ {\n  const resultPromise = new ToyPromise2(); // [new]\n\n  const fulfillmentTask\
    \ = () => {\n    if (typeof onFulfilled === 'function') {\n      const returned\
    \ = onFulfilled(this._promiseResult);\n      resultPromise.resolve(returned);\
    \ // [new]\n    } else { // [new]\n      // `onFulfilled` is missing\n      //\
    \ => we must pass on the fulfillment value\n      resultPromise.resolve(this._promiseResult);\n\
    \    } \n  };\n\n  const rejectionTask = () => {\n    if (typeof onRejected ===\
    \ 'function') {\n      const returned = onRejected(this._promiseResult);\n   \
    \   resultPromise.resolve(returned); // [new]\n    } else { // [new]\n      //\
    \ `onRejected` is missing\n      // => we must pass on the rejection value\n \
    \     resultPromise.reject(this._promiseResult);\n    }\n  };\n\n  ···\n\n  return\
    \ resultPromise; // [new]\n}\n```\n\n`.then()` 创建并返回一个新的 Promise（方法的第一行和最后一行）。此外：\n\
    \n*   `fulfillmentTask` 的工作方式不同。完成之后现在发生的情况如下：\n    *   如果提供了 `onFulfilled`，则调用它，并使用其结果来解析\
    \ `resultPromise`。\n    *   如果缺少 `onFulfilled`，则使用当前 Promise 的完成值来解析 `resultPromise`。\n\
    \n"
- fmt: "\n*   `rejectionTask` works differently. This is what now happens after rejection:\n\
    \    *   If `onRejected` was provided, it is called and its result is used to\
    \ *resolve* `resultPromise`. Note that `resultPromise` is not rejected: We are\
    \ assuming that `onRejected()` fixed whatever problem there was.\n    *   If `onRejected`\
    \ is missing, we use the rejection value of the current Promise to reject `resultPromise`.\n\
    \n## 18.7 Version 3: Flattening Promises returned from `.then()` callbacks\n\n\
    ### 18.7.1 Returning Promises from a callback of `.then()`\n\nPromise-flattening\
    \ is mostly about making chaining more convenient: If we want to pass on a value\
    \ from one `.then()` callback to the next one, we return it in the former. After\
    \ that, `.then()` puts it into the Promise that it has already returned.\n\nThis\
    \ approach becomes inconvenient if we return a Promise from a `.then()` callback.\
    \ For example, the result of a Promise-based function (line A):\n\n```\nasyncFunc1()\n\
    .then((result1) => {\n  assert.equal(result1, 'Result of asyncFunc1()');\n  return\
    \ asyncFunc2(); // (A)\n})\n.then((result2Promise) => {\n  result2Promise\n  .then((result2)\
    \ => { // (B)\n    assert.equal(\n      result2, 'Result of asyncFunc2()');\n\
    \  });\n});\n```\n\nThis time, putting the value returned in line A into the Promise\
    \ returned by `.then()` forces us to unwrap that Promise in line B. It would be\
    \ nice if instead, the Promise returned in line A replaced the Promise returned\
    \ by `.then()`. How exactly that could be done is not immediately clear, but if\
    \ it worked, it would let us write our code like this:\n\n```\nasyncFunc1()\n\
    .then((result1) => {\n  assert.equal(result1, 'Result of asyncFunc1()');\n  return\
    \ asyncFunc2(); // (A)\n})\n.then((result2) => {\n  // result2 is the fulfillment\
    \ value, not the Promise\n  assert.equal(\n    result2, 'Result of asyncFunc2()');\n\
    });\n```\n\nIn line A, we returned a Promise. Thanks to Promise-flattening, `result2`\
    \ is the fulfillment value of that Promise, not the Promise itself.\n\n### 18.7.2 Flattening\
    \ makes Promise states more complicated\n\n![](media/file5.svg)  **Flattening\
    \ Promises in the ECMAScript specification**\n\nIn the ECMAScript specification,\
    \ the details of flattening Promises are described in [section “Promise Objects”](https://tc39.es/ecma262/#sec-promise-objects).\n\
    \nHow does the Promise API handle flattening?\n\nIf a Promise P is resolved with\
    \ a Promise Q, then P does not wrap Q, P “becomes” Q: State and settlement value\
    \ of P are now always the same as Q’s. That helps us with `.then()` because `.then()`\
    \ resolves the Promise it returns with the value returned by one of its callbacks.\n\
    \nHow does P become Q? By *locking in* on Q: P becomes externally unresolvable\
    \ and a settlement of Q triggers a settlement of P. Lock-in is an additional invisible\
    \ Promise state that makes states more complicated.\n\nThe Promise API has one\
    \ additional feature: Q doesn’t have to be a Promise, only a so-called *thenable*.\
    \ A thenable is an object with a method `.then()`. The reason for this added flexibility\
    \ is to enable different Promise implementations to work together (which mattered\
    \ when Promises were first added to the language).\n\nFig. [5](#ch019.xhtml_fig:promise-states-all)\
    \ visualizes the new states.\n\n![](media/file12.svg)\n\nFigure 5: All states\
    \ of a Promise: Promise-flattening introduces the invisible pseudo-state “locked-in”.\
    \ That state is reached if a Promise P is resolved with a thenable Q. Afterwards,\
    \ state and settlement value of P is always the same as those of Q.\n\nNote that\
    \ the concept of *resolving* has also become more complicated. Resolving a Promise\
    \ now only means that it can’t be settled directly, anymore:\n\n*   Resolving\
    \ may reject a Promise: We can resolve a Promise with a rejected Promise.\n* \
    \  Resolving may not even settle a Promise: We can resolve a Promise with another\
    \ one that is always pending.\n\nThe ECMAScript specification puts it this way:\
    \ “An unresolved Promise is always in the pending state. A resolved Promise may\
    \ be pending, fulfilled, or rejected.”\n\n### 18.7.3 Implementing Promise-flattening\n\
    \nFig. [6](#ch019.xhtml_fig:promise-impl3-flattening) shows how `ToyPromise3`\
    \ handles flattening.\n\n![](media/file13.svg)\n\nFigure 6: `ToyPromise3` flattens\
    \ resolved Promises: If the first Promise is resolved with a thenable `x1`, it\
    \ locks in on `x1` and is settled with the settlement value of `x1`. If the first\
    \ Promise is resolved with a non-thenable value, everything works as it did before.\n\
    \nWe detect thenables via this function:\n\n```\nfunction isThenable(value) {\
    \ // [new]\n  return typeof value === 'object' && value !== null\n    && typeof\
    \ value.then === 'function';\n}\n```\n\nTo implement lock-in, we introduce a new\
    \ boolean flag `._alreadyResolved`. Setting it to `true` deactivates `.resolve()`\
    \ and `.reject()` – for example:\n\n```\nresolve(value) { // [new]\n  if (this._alreadyResolved)\
    \ return this;\n  this._alreadyResolved = true;\n\n  if (isThenable(value)) {\n\
    \    // Forward fulfillments and rejections from `value` to `this`.\n    // The\
    \ callbacks are always executed asynchronously\n    value.then(\n      (result)\
    \ => this._doFulfill(result),\n      (error) => this._doReject(error));\n  } else\
    \ {\n    this._doFulfill(value);\n  }\n\n  return this; // enable chaining\n}\n\
    ```\n\nIf `value` is a thenable then we lock the current Promise in on it:\n\n\
    *   If `value` is fulfilled with a result, the current Promise is also fulfilled\
    \ with that result.\n*   If `value` is rejected with an error, the current Promise\
    \ is also rejected with that error.\n\nThe settling is performed via the private\
    \ methods `._doFulfill()` and `._doReject()`, to get around the protection via\
    \ `._alreadyResolved`.\n\n`._doFulfill()` is relatively simple:\n\n```\n_doFulfill(value)\
    \ { // [new]\n  assert.ok(!isThenable(value));\n  this._promiseState = 'fulfilled';\n\
    \  this._promiseResult = value;\n  this._clearAndEnqueueTasks(this._fulfillmentTasks);\n\
    }\n```\n\n`.reject()` is not shown here. Its only new functionality is that it\
    \ now also obeys `._alreadyResolved`.\n\n## 18.8 Version 4: Exceptions thrown\
    \ in reaction callbacks\n\n![](media/file14.svg)\n\nFigure 7: `ToyPromise4` converts\
    \ exceptions in Promise reactions to rejections of the Promise returned by `.then()`.\n\
    \nAs our final feature, we’d like our Promises to handle exceptions in user code\
    \ as rejections (fig. [7](#ch019.xhtml_fig:promise-impl4-exceptions)). In this\
    \ chapter, “user code” means the two callback parameters of `.then()`.\n\n```\n\
    new ToyPromise4()\n  .resolve('a')\n  .then((value) => {\n    assert.equal(value,\
    \ 'a');\n    throw 'b'; // triggers a rejection\n  })\n  .catch((error) => {\n\
    \    assert.equal(error, 'b');\n  })\n```\n\n`.then()` now runs the Promise reactions\
    \ `onFulfilled` and `onRejected` safely, via the helper method `._runReactionSafely()`\
    \ – for example:\n\n```\nconst fulfillmentTask = () => {\n  if (typeof onFulfilled\
    \ === 'function') {\n    this._runReactionSafely(resultPromise, onFulfilled);\
    \ // [new]\n  } else {\n    // `onFulfilled` is missing\n    // => we must pass\
    \ on the fulfillment value\n    resultPromise.resolve(this._promiseResult);\n\
    \  } \n};\n```\n\n`._runReactionSafely()` is implemented as follows:\n"
