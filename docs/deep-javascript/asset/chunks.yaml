    ### 2.4.3 `ToPropertyKey()`


    `ToPropertyKey()` is used by, among others, the bracket operator. This is how
    it works:


    ```

    [](#cb35-1)function ToPropertyKey(argument) {

    [](#cb35-2)  let key = ToPrimitive(argument, ''string''); // (A)

