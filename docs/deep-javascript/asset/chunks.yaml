    \    [](#cb51-6)}\n    [](#cb51-7){«properties»} ← obj\n    ```\n\n*   (2e) `{}\
    \ ← obj`（没有剩余属性）\n\n    ```\n    [](#cb52-1)// 我们完成了\n    ```\n\n规则 2a 和 2b 处理非法值。规则\
