  trans: "\n\n```\nconst RE_INDEX_PROP_KEY = /^[0-9]+$/;\nconst ALLOWED_PROPERTIES\
    \ = new Set([\n  'length', 'constructor', 'slice', 'concat']);\n\nfunction wrapArrayImmutably(arr)\
    \ {\n  const handler = {\n    get(target, propKey, receiver) {\n      // We assume\
    \ that propKey is a string (not a symbol)\n      if (RE_INDEX_PROP_KEY.test(propKey)\
    \ // simplified check!\n        || ALLOWED_PROPERTIES.has(propKey)) {\n      \
    \    return Reflect.get(target, propKey, receiver);\n      }\n      throw new\
    \ TypeError(`Property \"${propKey}\" can’t be accessed`);\n    },\n    set(target,\
    \ propKey, value, receiver) {\n      throw new TypeError('Setting is not allowed');\n\
    \    },\n    deleteProperty(target, propKey) {\n      throw new TypeError('Deleting\
    \ is not allowed');\n    },\n  };\n  return new Proxy(arr, handler);\n}\n```\n\
    \n让我们包装一个数组：\n\n```\nconst arr = ['a', 'b', 'c'];\nconst wrapped = wrapArrayImmutably(arr);\n\
    \n// 非破坏性操作是允许的：\nassert.deepEqual(\n  wrapped.slice(1), ['b', 'c']);\nassert.equal(\n\
    \  wrapped[1], 'b');\n\n// 破坏性操作是不允许的：\nassert.throws(\n  () => wrapped[1] = 'x',\n\
    \  /^TypeError: Setting is not allowed$/);\nassert.throws(\n  () => wrapped.shift(),\n\
    \  /^TypeError: Property \"shift\" can’t be accessed$/);\n```\n\n# 16 正则表达式：通过示例理解环视断言\n\
    \n* * *\n\n*   16.1 速查表：环视断言\n*   16.2 本章注意事项\n*   16.3 示例：指定匹配前后内容（正向环视）\n* \
    \  16.4 示例：指定匹配前后不应出现的内容（负向环视）\n    *   16.4.1 负向环视断言没有简单的替代方案\n*   16.5 插曲：将环视断言指向内部\n\
    *   16.6 示例：匹配不以 `'abc'` 开头的字符串\n*   16.7 示例：匹配不包含 `'.mjs'` 的子串\n*   16.8 示例：跳过带注释的行\n\
    *   16.9 示例：智能引号\n    *   16.9.1 支持通过反斜杠转义\n*   16.10 致谢\n*   16.11 延伸阅读\n\n*\
    \ * *\n\n在本章中，我们通过示例来探索正则表达式中的环视断言。环视断言是非捕获性的，它必须匹配（或不匹配）输入字符串中当前位置之前（或之后）的内容。\n\
    \n## 16.1 速查表：环视断言\n\n表 4：可用的环视断言概览。\n\n| 模式 | 名称 |  |\n| --- | --- | --- |\n\
    | `(?=«模式»)` | 正向先行断言 | ES3 |\n| `(?!«模式»)` | 负向先行断言 | ES3 |\n| `(?<=«模式»)` |\
    \ 正向后行断言 | ES2018 |\n| `(?<!«模式»)` | 负向后行断言 | ES2018 |\n\n共有四种环视断言（表 4）：\n\n*\
    \   先行断言（ECMAScript 3）：\n    *   正向先行断言：`(?=«模式»)` 如果 `模式` 匹配输入字符串中当前位置之后的内容，则匹配成功。\n\
    \    *   负向先行断言：`(?!«模式»)` 如果 `模式` 不匹配输入字符串中当前位置之后的内容，则匹配成功。\n*   后行断言（ECMAScript\
    \ 2018）：\n    *   正向后行断言：`(?<=«模式»)` 如果 `模式` 匹配输入字符串中当前位置之前的内容，则匹配成功。\n    * \
    \  负向后行断言：`(?<!«模式»)` 如果 `模式` 不匹配输入字符串中当前位置之前的内容，则匹配成功。\n\n## 16.2 本章注意事项\n\n\
    *   示例展示了通过环视断言可以实现的功能。然而，正则表达式并非总是最佳解决方案。其他技术（如适当的解析）可能是更好的选择。\n*   后行断言是一个相对较新的特性，可能并非所有目标\
    \ JavaScript 引擎都支持。\n*   环视断言可能会对性能产生负面影响，尤其是当它们的模式匹配较长的字符串时。\n\n## 16.3 示例：指定匹配前后内容（正向环视）\n\
    \n在以下交互中，我们提取被引号括起来的单词：\n\n```\n> 'how \"are\" \"you\" doing'.match(/(?<=\")[a-z]+(?=\"\
    )/g)\n[ 'are', 'you' ]\n```\n\n这里使用了两个环视断言：\n\n*   `(?<=\")` “前面必须有一个引号”\n*  \
    \ `(?=\")` “后面必须有一个引号”\n\n环视断言在 `/g` 模式下的 `.match()` 中特别方便，该方法返回整个匹配（捕获组 0）。环视断言模式匹配的内容不会被捕获。如果没有环视断言，引号会出现在结果中：\n\
    \n```\n> 'how \"are\" \"you\" doing'.match(/\"([a-z]+)\"/g)\n[ '\"are\"', '\"\
    you\"' ]\n```\n\n## 16.4 示例：指定匹配前后不应出现的内容（负向环视）\n\n如何实现与上一节相反的效果，从字符串中提取所有未被引号括起来的单词？\n\
    \n*   输入：`'how \"are\" \"you\" doing'`\n*   输出：`['how', 'doing']`\n\n我们的第一次尝试是简单地将正向环视断言转换为负向环视断言。可惜，这失败了：\n\
    \n```\n> 'how \"are\" \"you\" doing'.match(/(?<!\")[a-z]+(?!\")/g)\n[ 'how', 'r',\
    \ 'o', 'doing' ]\n```\n\n问题在于我们提取的是不被引号括起来的字符序列。这意味着在字符串 `'\"are\"'` 中，中间的 “r”\
    \ 被视为未加引号，因为它前面是 “a”，后面是 “e”。\n\n我们可以通过规定前缀和后缀既不能是引号也不能是字母来解决这个问题：\n\n```\n> 'how\
    \ \"are\" \"you\" doing'.match(/(?<![\"a-z])[a-z]+(?![\"a-z])/g)\n[ 'how', 'doing'\
    \ ]\n```\n\n另一种解决方案是通过 `\\b` 要求字符序列 `[a-z]+` 在单词边界处开始和结束：\n\n```\n> 'how \"are\"\
    \ \"you\" doing'.match(/(?<!\")\\b[a-z]+\\b(?!\")/g)\n[ 'how', 'doing' ]\n```\n\
    \n负向后行断言和负向先行断言的一个优点是它们也能在字符串的开头或结尾处工作——如示例所示。\n\n### 16.4.1 负向环视断言没有简单的替代方案\n\
    \n负向环视断言是一个强大的工具，通常无法通过其他正则表达式手段来模拟。\n\n如果我们不想使用它们，通常必须采用完全不同的方法。例如，在这种情况下，我们可以将字符串拆分为（带引号和不带引号的）单词，然后过滤它们：\n\
    \n```\nconst str = 'how \"are\" \"you\" doing';\n\nconst allWords = str.match(/\"\
    ?[a-z]+\"?/g);\nconst unquotedWords = allWords.filter(\n  w => !w.startsWith('\"\
    ') || !w.endsWith('\"'));\nassert.deepEqual(unquotedWords, ['how', 'doing']);\n\
    ```\n\n这种方法的好处：\n\n*   在较旧的引擎上也能工作。\n*   易于理解。\n\n## 16.5 插曲：将环视断言指向内部\n\n"
- fmt: "\nAll of the examples we have seen so far have in common that the lookaround\
    \ assertions dictate what must come before or after the match but without including\
    \ those characters in the match.\n\nThe regular expressions shown in the remainder\
    \ of this chapter are different: Their lookaround assertions point inward and\
    \ restrict what’s inside the match.\n\n## 16.6 Example: match strings not starting\
    \ with `'abc'`\n\nLet‘s assume we want to match all strings that do not start\
    \ with `'abc'`. Our first attempt could be the regular expression `/^(?!abc)/`.\n\
    \nThat works well for `.test()`:\n\n```\n> /^(?!abc)/.test('xyz')\ntrue\n```\n\
    \nHowever, `.exec()` gives us an empty string:\n\n```\n> /^(?!abc)/.exec('xyz')\n\
    { 0: '', index: 0, input: 'xyz', groups: undefined }\n```\n\nThe problem is that\
    \ assertions such as lookaround assertions don’t expand the matched text. That\
    \ is, they don’t capture input characters, they only make demands about the current\
    \ location in the input.\n\nTherefore, the solution is to add a pattern that does\
    \ capture input characters:\n\n```\n> /^(?!abc).*$/.exec('xyz')\n{ 0: 'xyz', index:\
    \ 0, input: 'xyz', groups: undefined }\n```\n\nAs desired, this new regular expression\
    \ rejects strings that are prefixed with `'abc'`:\n\n```\n> /^(?!abc).*$/.exec('abc')\n\
    null\n> /^(?!abc).*$/.exec('abcd')\nnull\n```\n\nAnd it accepts strings that don’t\
    \ have the full prefix:\n\n```\n> /^(?!abc).*$/.exec('ab')\n{ 0: 'ab', index:\
    \ 0, input: 'ab', groups: undefined }\n```\n\n## 16.7 Example: match substrings\
    \ that do not contain `'.mjs'`\n\nIn the following example, we want to find\n\n\
    ```\nimport ··· from '«module-specifier»';\n```\n\nwhere `module-specifier` does\
    \ not end with `'.mjs'`.\n\n```\n[](#cb281-1)const code = `\n[](#cb281-2)import\
    \ {transform} from './util';\n[](#cb281-3)import {Person} from './person.mjs';\n\
    [](#cb281-4)import {zip} from 'lodash';\n[](#cb281-5)`.trim();\n[](#cb281-6)assert.deepEqual(\n\
    [](#cb281-7)  code.match(/^import .*? from '[^']+(?<!\\.mjs)';$/umg),\n[](#cb281-8)\
    \  [\n[](#cb281-9)    \"import {transform} from './util';\",\n[](#cb281-10)  \
    \  \"import {zip} from 'lodash';\",\n[](#cb281-11)  ]);\n```\n\nHere, the lookbehind\
    \ assertion `(?<!\\.mjs)` acts as a *guard* and prevents that the regular expression\
    \ matches strings that contain `'.mjs`’ at this location.\n\n## 16.8 Example:\
    \ skipping lines with comments\n\nScenario: We want to parse lines with settings,\
    \ while skipping comments. For example:\n\n```\n[](#cb282-1)const RE_SETTING =\
    \ /^(?!#)([^:]*):(.*)$/\n[](#cb282-2)\n[](#cb282-3)const lines = [\n[](#cb282-4)\
    \  'indent: 2', // setting\n[](#cb282-5)  '# Trim trailing whitespace:', // comment\n\
    [](#cb282-6)  'whitespace: trim', // setting\n[](#cb282-7)];\n[](#cb282-8)for\
    \ (const line of lines) {\n[](#cb282-9)  const match = RE_SETTING.exec(line);\n\
    [](#cb282-10)  if (match) {\n[](#cb282-11)    const key = JSON.stringify(match[1]);\n\
    [](#cb282-12)    const value = JSON.stringify(match[2]);\n[](#cb282-13)    console.log(`KEY:\
    \ ${key} VALUE: ${value}`);\n[](#cb282-14)  }\n[](#cb282-15)}\n[](#cb282-16)\n\
    [](#cb282-17)// Output:\n[](#cb282-18)// 'KEY: \"indent\" VALUE: \" 2\"'\n[](#cb282-19)//\
    \ 'KEY: \"whitespace\" VALUE: \" trim\"'\n```\n\nHow did we arrive at the regular\
    \ expression `RE_SETTING`?\n\nWe started with the following regular expression\
    \ for settings:\n\n```\n[](#cb283-1)/^([^:]*):(.*)$/\n```\n\nIntuitively, it is\
    \ a sequence of the following parts:\n\n*   Start of the line\n*   Non-colons\
    \ (zero or more)\n*   A single colon\n*   Any characters (zero or more)\n*   The\
    \ end of line\n\nThis regular expression does reject *some* comments:\n\n```\n\
    > /^([^:]*):(.*)$/.test('# Comment')\nfalse\n```\n\nBut it accepts others (that\
    \ have colons in them):\n\n```\n> /^([^:]*):(.*)$/.test('# Comment:')\ntrue\n\
    ```\n\nWe can fix that by prefixing `(?!#)` as a guard. Intuitively, it means:\
    \ ”The current location in the input string must not be followed by the character\
    \ `#`.”\n\nThe new regular expression works as desired:\n\n```\n> /^(?!#)([^:]*):(.*)$/.test('#\
    \ Comment:')\nfalse\n```\n\n## 16.9 Example: smart quotes\n\nLet’s assume we want\
    \ to convert pairs of straight double quotes to curly quotes:\n\n*   Input: ``\
    \ `\"yes\" and \"no\"` ``\n*   Output: `` `“yes” and “no”` ``\n\nThis is our first\
    \ attempt:\n\n```\n> `The words \"must\" and \"should\".`.replace(/\"(.*)\"/g,\
    \ '“$1”')\n'The words “must\" and \"should”.'\n```\n\nOnly the first quote and\
    \ the last quote is curly. The problem here is that the `*` quantifier matches\
    \ [*greedily*](https://exploringjs.com/impatient-js/ch_regexps.html#quantifiers)\
    \ (as much as possible).\n\nIf we put a question mark after the `*`, it matches\
    \ *reluctantly*:\n\n```\n> `The words \"must\" and \"should\".`.replace(/\"(.*?)\"\
    /g, '“$1”')\n'The words “must” and “should”.'\n```\n\n### 16.9.1 Supporting escaping\
    \ via backslashes\n\nWhat if we want to allow the escaping of quotes via backslashes?\
    \ We can do that by using the guard `(?<!\\\\)` before the quotes:\n\n```\n> const\
    \ regExp = /(?<!\\\\)\"(.*?)(?<!\\\\)\"/g;\n> String.raw`\\\"straight\\\" and\
    \ \"curly\"`.replace(regExp, '“$1”')\n'\\\\\"straight\\\\\" and “curly”'\n```\n\
    \nAs a post-processing step, we would still need to do:\n\n```\n[](#cb290-1).replace(/\\\
    \\\"/g, `\"`)\n```\n\nHowever, this regular expression can fail when there is\
    \ a backslash-escaped backslash:\n\n```\n> String.raw`Backslash: \"\\\\\"`.replace(/(?<!\\\
    \\)\"(.*?)(?<!\\\\)\"/g, '“$1”')\n'Backslash: \"\\\\\\\\\"'\n```\n\nThe second\
    \ backslash prevented the quotes from becoming curly.\n\nWe can fix that if we\
    \ make our guard more sophisticated (`?:` makes the group non-capturing):\n\n\
    ```\n[](#cb292-1)(?<=[^\\\\](?:\\\\\\\\)*)\n```\n\nThe new guard allows pairs\
    \ of backslashes before quotes:\n\n```\n> const regExp = /(?<=[^\\\\](?:\\\\\\\
    \\)*)\"(.*?)(?<=[^\\\\](?:\\\\\\\\)*)\"/g;\n> String.raw`Backslash: \"\\\\\"`.replace(regExp,\
    \ '“$1”')\n'Backslash: “\\\\\\\\”'\n```\n\nOne issue remains. This guard prevents\
    \ the first quote from being matched if it appears at the beginning of a string:\n\
    \n```\n> const regExp = /(?<=[^\\\\](?:\\\\\\\\)*)\"(.*?)(?<=[^\\\\](?:\\\\\\\\\
    )*)\"/g;\n> `\"abc\"`.replace(regExp, '“$1”')\n'\"abc\"'\n```\n\nWe can fix that\
    \ by changing the first guard to: `(?<=[^\\\\](?:\\\\\\\\)*|^)`\n\n```\n> const\
    \ regExp = /(?<=[^\\\\](?:\\\\\\\\)*|^)\"(.*?)(?<=[^\\\\](?:\\\\\\\\)*)\"/g;\n\
    > `\"abc\"`.replace(regExp, '“$1”')\n'“abc”'\n```\n\n## 16.10 Acknowledgements\n\
