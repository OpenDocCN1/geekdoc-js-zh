    \ 规范（本书会解释并引用该规范）。\n*   仅涵盖语言本身（忽略平台特定特性，如浏览器 API），但并非详尽无遗，而是聚焦于一系列重要主题。\n\n##\
    \ 1.3 付费后我能得到什么？\n\n购买本书后，您将获得：\n\n*   当前内容的四种无 DRM 版本：\n    *   PDF 文件\n    *\
