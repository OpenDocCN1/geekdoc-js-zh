    \ to `secretToken` and therefore can’t create instances of `DataContainer`.\n\n\
    Pros and cons:\n\n*   Benefit: safe and straightforward.\n\n*   Disadvantage:\
    \ slightly verbose.\n\n### 13.3.2 Improvement: constructor throws, factory method\
    \ borrows the class prototype\n\nThe following variant of our solution disables\
    \ the constructor of `DataContainer` and uses a trick to create instances of it\
    \ another way (line A):\n\n```\n[](#cb254-1)class DataContainer {\n[](#cb254-2)\
    \  static async create() {\n[](#cb254-3)    const data = await Promise.resolve('downloaded');\n\
    [](#cb254-4)    return Object.create(this.prototype)._init(data); // (A)\n[](#cb254-5)\
    \  }\n[](#cb254-6)  constructor() {\n[](#cb254-7)    throw new Error('Constructor\
    \ is private');\n[](#cb254-8)  }\n[](#cb254-9)  _init(data) {\n[](#cb254-10) \
    \   this._data = data;\n[](#cb254-11)    return this;\n[](#cb254-12)  }\n[](#cb254-13)\
    \  getData() {\n[](#cb254-14)    return 'DATA: '+this._data;\n[](#cb254-15)  }\n\
    [](#cb254-16)}\n[](#cb254-17)DataContainer.create()\n[](#cb254-18)  .then(dc =>\
    \ {\n[](#cb254-19)    assert.equal(dc instanceof DataContainer, true); // (B)\n\
    [](#cb254-20)    assert.equal(\n[](#cb254-21)      dc.getData(), 'DATA: downloaded');\n\
    [](#cb254-22)  });\n```\n\nInternally, an instance of `DataContainer` is any object\
    \ whose prototype is `DataContainer.prototype`. That’s why we can create instances\
    \ via `Object.create()` (line A) and that’s why `instanceof` works in line B.\n\
    \nPros and cons:\n\n*   Benefit: elegant; `instanceof` works.\n\n*   Disadvantages:\n\
    \n    *   Creating instances is not completely prevented. To be fair, though,\
    \ the work-around via `Object.create()` can also be used for our previous solutions.\n\
    \n    *   We can’t use [private fields](https://2ality.com/2019/07/private-class-fields.html)\
    \ and [private methods](https://2ality.com/2019/07/private-methods-accessors-in-classes.html)\
    \ in `DataContainer`, because those are only set up correctly for instances that\
    \ were created via the constructor."
