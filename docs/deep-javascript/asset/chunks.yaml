  trans: "\n定义 `obj` 的属性 `.prop` 与对其赋值有什么区别？\n\n如果进行定义，那么我们的意图是创建或更改 `obj` 的自身（非继承）属性。因此，定义会忽略继承的\
    \ `.prop` 设置器，如下例所示：\n\n```\nlet setterWasCalled = false;\nconst proto = {\n \
    \ get prop() {\n    return 'protoGetter';\n  },\n  set prop(x) {\n    setterWasCalled\
    \ = true;\n  },\n};\nconst obj = Object.create(proto);\n\nassert.equal(obj.prop,\
    \ 'protoGetter');\n\n// 定义 obj.prop：\nObject.defineProperty(\n  obj, 'prop', {\
    \ value: 'objData' });\nassert.equal(setterWasCalled, false);\n\n// 我们已经覆盖了获取器：\n\
    assert.equal(obj.prop, 'objData');\n```\n\n相反，如果对 `.prop` 进行赋值，那么我们的意图通常是更改已经存在的内容，并且该更改应由设置器处理：\n\
    \n```\nlet setterWasCalled = false;\nconst proto = {\n  get prop() {\n    return\
    \ 'protoGetter';\n  },\n  set prop(x) {\n    setterWasCalled = true;\n  },\n};\n\
    const obj = Object.create(proto);\n\nassert.equal(obj.prop, 'protoGetter');\n\n\
    // 对 obj.prop 赋值：\nobj.prop = 'objData';\nassert.equal(setterWasCalled, true);\n\
    \n// 获取器仍然有效：\nassert.equal(obj.prop, 'protoGetter');\n```\n\n### 11.3.4 继承的只读属性阻止通过赋值创建自身属性\n\
    \n如果原型中的 `.prop` 是只读的，会发生什么？\n\n```\nconst proto = Object.defineProperty(\n  {},\
    \ 'prop', {\n    value: 'protoValue',\n    writable: false,\n  });\n```\n\n在任何从\
    \ `proto` 继承只读 `.prop` 的对象中，我们无法使用赋值来创建具有相同键的自身属性——例如：\n\n```\nconst obj = Object.create(proto);\n\
    assert.throws(\n  () => obj.prop = 'objValue',\n  /^TypeError: Cannot assign to\
    \ read only property 'prop'/);\n```\n\n为什么不能赋值？其理由是：通过创建自身属性来覆盖继承属性可以被视为非破坏性地更改继承属性。可以说，如果属性不可写，我们就不应该能够这样做。\n\
    \n然而，定义 `.prop` 仍然有效，并允许我们覆盖：\n\n```\nObject.defineProperty(\n  obj, 'prop', {\
    \ value: 'objValue' });\nassert.equal(obj.prop, 'objValue');\n```\n\n没有设置器的访问器属性也被视为只读：\n\
    \n```\nconst proto = {\n  get prop() {\n    return 'protoValue';\n  }\n};\nconst\
    \ obj = Object.create(proto);\nassert.throws(\n  () => obj.prop = 'objValue',\n\
    \  /^TypeError: Cannot set property prop of #<Object> which has only a getter$/);\n\
    ```\n\n![](img/file5.svg)  **“覆盖错误”：利弊**\n\n*   该特性在 ECMAScript 5.1 中引入。\n\n*\
    \   一方面，这种行为与原型继承和设置器的工作方式一致。（因此，可以说它*不是*一个错误。）\n\n*   另一方面，这种行为会导致深度冻结全局对象时产生不必要的副作用。\n\
    \n*   曾有人试图改变这种行为，但破坏了 Lodash 库，因此被放弃（[GitHub 上的拉取请求](https://github.com/tc39/ecma262/pull/1320#issuecomment-443485524)）。\n\
    \n*   背景知识：\n\n    *   [GitHub 上的拉取请求](https://github.com/tc39/ecma262/pull/1307)\n\
    \n    *   [ECMAScript.org 上的 Wiki 页面](http://wiki.ecmascript.org/doku.php?id=strawman:fixing_override_mistake)（[存档](https://web.archive.org/web/20141230041441/http://wiki.ecmascript.org/doku.php?id=strawman:fixing_override_mistake)）\n\
    \n## 11.4 哪些语言结构使用定义，哪些使用赋值？\n\n在本节中，我们将考察语言在哪些地方使用定义，在哪些地方使用赋值。我们通过跟踪是否调用了继承的设置器来检测使用了哪种操作。更多信息请参见\
    \ §11.3.3 “赋值调用设置器，定义不调用”。\n\n### 11.4.1 对象字面量的属性通过定义添加\n\n当我们通过对象字面量创建属性时，JavaScript\
    \ 始终使用定义（因此从不调用继承的设置器）：\n\n```\nlet lastSetterArgument;\nconst proto = {\n  set\
    \ prop(x) {\n    lastSetterArgument = x;\n  },\n};\nconst obj = {\n  __proto__:\
    \ proto,\n  prop: 'abc',\n};\nassert.equal(lastSetterArgument, undefined);\n```\n\
    \n### 11.4.2 赋值运算符 `=` 始终使用赋值\n\n赋值运算符 `=` 始终使用赋值来创建或更改属性。\n\n```\nlet lastSetterArgument;\n\
    const proto = {\n  set prop(x) {\n    lastSetterArgument = x;\n  },\n};\nconst\
    \ obj = Object.create(proto);\n\n// 普通赋值：\nobj.prop = 'abc';\nassert.equal(lastSetterArgument,\
    \ 'abc');\n\n// 通过解构赋值：\n[obj.prop] = ['def'];\nassert.equal(lastSetterArgument,\
    \ 'def');\n```\n\n### 11.4.3 公共类字段通过定义添加\n\n遗憾的是，尽管公共类字段的语法与赋值相同，但它们*不*使用赋值来创建属性，而是使用定义（就像对象字面量中的属性一样）：\n\
    \n```\nlet lastSetterArgument1;\nlet lastSetterArgument2;\nclass A {\n  set prop1(x)\
    \ {\n    lastSetterArgument1 = x;\n  }\n  set prop2(x) {\n    lastSetterArgument2\
    \ = x;\n  }\n}\nclass B extends A {\n  prop1 = 'one';\n  constructor() {\n   \
    \ super();\n    this.prop2 = 'two';\n  }\n}\nnew B();\n\n// 公共类字段使用定义：\nassert.equal(lastSetterArgument1,\
    \ undefined);\n// 在构造函数内部，我们触发了赋值：\nassert.equal(lastSetterArgument2, 'two');\n\
    ```\n\n## 11.5 本章的进一步阅读和资料来源\n\n*   [“原型链”章节](https://exploringjs.com/impatient-js/ch_proto-chains-classes.html#prototype-chains)（来自《JavaScript\
    \ 快速入门》）\n\n*   [Allen Wirfs-Brock 发送给 es-discuss 邮件列表的邮件](https://mail.mozilla.org/pipermail/es-discuss/2012-July/024227.html)：“赋值与定义之间的区别……在\
    \ ES 只有数据属性且 ES 代码无法操作属性特性时并不重要。”[这种情况在 ECMAScript 5 中发生了变化。]\n\n# 12 属性的可枚举性\n\
    \n* * *\n\n*   12.1 可枚举性如何影响属性迭代结构\n\n    *   12.1.1 仅考虑可枚举属性的操作\n\n    *   12.1.2 同时考虑可枚举和不可枚举属性的操作\n\
    \n"
