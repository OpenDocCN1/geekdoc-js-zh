    \n* * *\n\nIn this chapter, we examine the role of *type coercion* in JavaScript.\
    \ We will go relatively deeply into this subject and, e.g., look into how the\
    \ ECMAScript specification handles coercion.\n\n## 2.1 What is type coercion?\n\
    \nEach operation (function, operator, etc.) expects its parameters to have certain\
    \ types. If a value doesn’t have the right type for a parameter, three common\
    \ options for, e.g., a function are:\n\n1.  The function can throw an exception:\n\
    \n```\nfunction multiply(x, y) {\n  if (typeof x !== 'number' || typeof y !==\
    \ 'number') {\n    throw new TypeError();\n  }\n  // ···\n}\n```\n\n2.  The function\
    \ can return an error value:\n\n```\nfunction multiply(x, y) {\n  if (typeof x\
    \ !== 'number' || typeof y !== 'number') {\n    return NaN;\n  }\n  // ···\n}\n\
    ```\n\n3.  The function can convert its arguments to useful values:\n\n```\nfunction\
    \ multiply(x, y) {\n  if (typeof x !== 'number') {\n    x = Number(x);\n  }\n\
    \  if (typeof y !== 'number') {\n    y = Number(y);\n  }\n  // ···\n}\n```\n\n\
    In (3), the operation performs an implicit type conversion. That is called *type\
    \ coercion*.\n\nJavaScript initially didn’t have exceptions, which is why it uses\
    \ coercion and error values for most of its operations:\n\n```\n// Coercion\n\
    assert.equal(3 * true, 3);\n\n// Error values\nassert.equal(1 / 0, Infinity);\n\
    assert.equal(Number('xyz'), NaN);\n```\n\nHowever, there are also cases (especially\
    \ when it comes to newer features) where it throws exceptions if an argument doesn’t\
    \ have the right type:\n\n*   Accessing properties of `null` or `undefined`:\n\
    \n    ```\n    > undefined.prop\n    TypeError: Cannot read property 'prop' of\
    \ undefined\n    > null.prop\n    TypeError: Cannot read property 'prop' of null\n\
    \    > 'prop' in null\n    TypeError: Cannot use 'in' operator to search for 'prop'\
    \ in null\n    ```\n\n*   Using symbols:\n\n    ```\n    > 6 / Symbol()\n    TypeError:\
    \ Cannot convert a Symbol value to a number\n    ```\n\n*   Mixing bigints and\
    \ numbers:\n\n    ```\n    > 6 / 3n\n    TypeError: Cannot mix BigInt and other\
    \ types\n    ```\n\n*   New-calling or function-calling values that don’t support\
    \ that operation:\n\n    ```\n    > 123()\n    TypeError: 123 is not a function\n\
    \    > (class {})()\n    TypeError: Class constructor  cannot be invoked without\
    \ 'new'\n\n    > new 123\n    TypeError: 123 is not a constructor\n    > new (()\
    \ => {})\n    TypeError: (intermediate value) is not a constructor\n    ```\n\n\
    *   Changing read-only properties (only throws in strict mode):\n\n    ```\n \
    \   > 'abc'.length = 1\n    TypeError: Cannot assign to read only property 'length'\n\
    \    > Object.freeze({prop:3}).prop = 1\n    TypeError: Cannot assign to read\
    \ only property 'prop'\n    ```\n\n### 2.1.1 Dealing with type coercion\n\nTwo\
    \ common ways of dealing with coercion are:\n\n*   A caller can explicitly convert\
    \ values so that they have the right types. For example, in the following interaction,\
    \ we want to multiply two numbers encoded as strings:\n\n    ```\n    let x =\
    \ '3';\n    let y = '2';\n    assert.equal(Number(x) * Number(y), 6);\n    ```\n\
    \n*   A caller can let the operation make the conversion for them:\n\n    ```\n\
    \    let x = '3';\n    let y = '2';\n    assert.equal(x * y, 6);\n    ```\n\n\
    I usually prefer the former, because it clarifies my intention: I expect `x` and\
    \ `y` not to be numbers, but want to multiply two numbers.\n\n## 2.2 Operations\
    \ that help implement coercion in the ECMAScript specification\n\nThe following\
    \ sections describe the most important internal functions used by the ECMAScript\
    \ specification to convert actual parameters to expected types.\n\nFor example,\
    \ in TypeScript, we would write:\n\n```\nfunction isNaN(number: number) {\n  //\
    \ ···\n}\n```\n\nIn the specification, this looks [as follows](https://tc39.es/ecma262/#sec-multiplicative-operators-runtime-semantics-evaluation)\
    \ (translated to JavaScript, so that it is easier to understand):\n\n```\nfunction\
    \ isNaN(number) {\n  let num = ToNumber(number);\n  // ···\n}\n```\n\n### 2.2.1 Converting\
    \ to primitive types and objects\n\nWhenever primitive types or objects are expected,\
    \ the following conversion functions are used:\n\n*   `ToBoolean()`\n\n*   `ToNumber()`\n\
    \n*   `ToBigInt()`\n\n*   `ToString()`\n\n*   `ToObject()`\n\nThese internal functions\
    \ have analogs in JavaScript that are very similar:\n\n```\n> Boolean(0)\nfalse\n\
    > Boolean(1)\ntrue\n\n> Number('123')\n123\n```\n"
