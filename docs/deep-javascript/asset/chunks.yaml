  trans: "\n\n更多信息，请参见§11.3.4 “继承的只读属性阻止通过赋值创建自有属性”。\n\n## 9.2 属性描述符\n\n*属性描述符*将属性的特性编码为一个\
    \ JavaScript 对象。它们的 TypeScript 接口如下所示。\n\n```\ninterface DataPropertyDescriptor\
    \ {\n  value?: any;\n  writable?: boolean;\n  configurable?: boolean;\n  enumerable?:\
    \ boolean;\n}\ninterface AccessorPropertyDescriptor {\n  get?: (this: any) =>\
    \ any;\n  set?: (this: any, v: any) => void;\n  configurable?: boolean;\n  enumerable?:\
    \ boolean;\n}\ntype PropertyDescriptor = DataPropertyDescriptor | AccessorPropertyDescriptor;\n\
    ```\n\n问号表示所有属性都是可选的。§9.7 “省略描述符属性”描述了省略它们时会发生什么。\n\n## 9.3 检索属性的描述符\n\n### 9.3.1 `Object.getOwnPropertyDescriptor()`：检索单个属性的描述符\n\
    \n考虑以下对象：\n\n```\nconst legoBrick = {\n  kind: 'Plate 1x3',\n  color: 'yellow',\n\
    \  get description() {\n    return `${this.kind} (${this.color})`;\n  },\n};\n\
    ```\n\n首先，获取数据属性 `.color` 的描述符：\n\n```\nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(legoBrick,\
    \ 'color'),\n  {\n    value: 'yellow',\n    writable: true,\n    enumerable: true,\n\
    \    configurable: true,\n  });\n```\n\n这是访问器属性 `.description` 的描述符：\n\n```\n\
    const desc = Object.getOwnPropertyDescriptor.bind(Object);\nassert.deepEqual(\n\
    \  Object.getOwnPropertyDescriptor(legoBrick, 'description'),\n  {\n    get: desc(legoBrick,\
    \ 'description').get, // (A)\n    set: undefined,\n    enumerable: true,\n   \
    \ configurable: true\n  });\n```\n\n在 A 行使用工具函数 `desc()` 确保 `.deepEqual()` 正常工作。\n\
    \n### 9.3.2 `Object.getOwnPropertyDescriptors()`：检索对象所有属性的描述符\n\n```\nconst legoBrick\
    \ = {\n  kind: 'Plate 1x3',\n  color: 'yellow',\n  get description() {\n    return\
    \ `${this.kind} (${this.color})`;\n  },\n};\n\nconst desc = Object.getOwnPropertyDescriptor.bind(Object);\n\
    assert.deepEqual(\n  Object.getOwnPropertyDescriptors(legoBrick),\n  {\n    kind:\
    \ {\n      value: 'Plate 1x3',\n      writable: true,\n      enumerable: true,\n\
    \      configurable: true,\n    },\n    color: {\n      value: 'yellow',\n   \
    \   writable: true,\n      enumerable: true,\n      configurable: true,\n    },\n\
    \    description: {\n      get: desc(legoBrick, 'description').get, // (A)\n \
    \     set: undefined,\n      enumerable: true,\n      configurable: true,\n  \
    \  },\n  });\n```\n\n在 A 行使用辅助函数 `desc()` 确保 `.deepEqual()` 正常工作。\n\n## 9.4 通过描述符定义属性\n\
    \n如果我们通过属性描述符 `propDesc` 定义键为 `k` 的属性，则会发生以下情况：\n\n*   如果不存在键为 `k` 的属性，则会创建一个新的自有属性，该属性具有\
    \ `propDesc` 指定的特性。\n*   如果存在键为 `k` 的属性，则定义会更改该属性的特性，使其与 `propDesc` 匹配。\n\n###\
    \ 9.4.1 `Object.defineProperty()`：通过描述符定义单个属性\n\n首先，通过描述符创建一个新属性：\n\n```\nconst\
    \ car = {};\n\nObject.defineProperty(car, 'color', {\n  value: 'blue',\n  writable:\
    \ true,\n  enumerable: true,\n  configurable: true,\n});\n\nassert.deepEqual(\n\
    \  car,\n  {\n    color: 'blue',\n  });\n```\n\n接下来，通过描述符更改属性的种类；我们将一个数据属性转换为\
    \ getter：\n\n```\nconst car = {\n  color: 'blue',\n};\n\nlet readCount = 0;\n\
    Object.defineProperty(car, 'color', {\n  get() {\n    readCount++;\n    return\
    \ 'red';\n  },\n});\n\nassert.equal(car.color, 'red');\nassert.equal(readCount,\
    \ 1);\n```\n\n最后，通过描述符更改数据属性的值：\n\n```\nconst car = {\n  color: 'blue',\n};\n\n\
    // 使用与赋值相同的属性：\nObject.defineProperty(\n  car, 'color', {\n    value: 'green',\n\
    \    writable: true,\n    enumerable: true,\n    configurable: true,\n  });\n\n\
    assert.deepEqual(\n  car,\n  {\n    color: 'green',\n  });\n```\n\n我们使用了与赋值相同的属性特性。\n\
    \n### 9.4.2 `Object.defineProperties()`：通过描述符定义多个属性\n\n`Object.defineProperties()`\
    \ 是 `Object.defineProperty()` 的多属性版本：\n\n```\nconst legoBrick1 = {};\nObject.defineProperties(\n\
    \  legoBrick1,\n  {\n    kind: {\n      value: 'Plate 1x3',\n      writable: true,\n\
    \      enumerable: true,\n      configurable: true,\n    },\n    color: {\n  \
    \    value: 'yellow',\n      writable: true,\n      enumerable: true,\n      configurable:\
    \ true,\n    },\n    description: {\n      get: function () {\n        return\
    \ `${this.kind} (${this.color})`;\n      },\n      enumerable: true,\n      configurable:\
    \ true,\n    },\n  });\n\nassert.deepEqual(\n  legoBrick1,\n  {\n    kind: 'Plate\
    \ 1x3',\n    color: 'yellow',\n    get description() {\n      return `${this.kind}\
    \ (${this.color})`;\n    },\n  });\n```\n\n## 9.5 `Object.create()`：通过描述符创建对象\n\
    \n`Object.create()` 创建一个新对象。它的第一个参数指定该对象的原型。可选的第二个参数指定该对象属性的描述符。在下一个示例中，我们创建与上一个示例相同的对象。\n\
    \n"
- fmt: "\n```javascript\nconst legoBrick2 = Object.create(\n  Object.prototype,\n\
    \  {\n    kind: {\n      value: 'Plate 1x3',\n      writable: true,\n      enumerable:\
    \ true,\n      configurable: true,\n    },\n    color: {\n      value: 'yellow',\n\
    \      writable: true,\n      enumerable: true,\n      configurable: true,\n \
    \   },\n    description: {\n      get: function () {\n        return `${this.kind}\
    \ (${this.color})`;\n      },\n      enumerable: true,\n      configurable: true,\n\
    \    },\n  });\n\n// Did we really create the same object?\nassert.deepEqual(legoBrick1,\
    \ legoBrick2); // Yes!\n```\n\n## 9.6 Use cases for `Object.getOwnPropertyDescriptors()`\n\
    \n`Object.getOwnPropertyDescriptors()` helps us with two use cases, if we combine\
    \ it with `Object.defineProperties()` or `Object.create()`.\n\n### 9.6.1 Use case:\
    \ copying properties into an object\n\nSince ES6, JavaScript already has had a\
    \ tool method for copying properties: `Object.assign()`. However, this method\
    \ uses simple get and set operations to copy a property whose key is `key`:\n\n\
    ```\ntarget[key] = source[key];\n```\n\nThat means that it only creates a faithful\
    \ copy of a property if:\n\n*   Its attribute `writable` is `true` and its attribute\
    \ `enumerable` is `true` (because that’s how assignment creates properties).\n\
    \n*   It is a data property.\n\nThe following example illustrates this limitation.\
    \ Object `source` has a setter whose key is `data`.\n\n```\nconst source = {\n\
    \  set data(value) {\n    this._data = value;\n  }\n};\n\n// Because there is\
    \ only a setter, property `data` exists,\n// but has the value `undefined`.\n\
    assert.equal('data' in source, true);\nassert.equal(source.data, undefined);\n\
    ```\n\nIf we use `Object.assign()` to copy property `data`, then the accessor\
    \ property `data` is converted to a data property:\n\n```\nconst target1 = {};\n\
    Object.assign(target1, source);\n\nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(target1,\
    \ 'data'),\n  {\n    value: undefined,\n    writable: true,\n    enumerable: true,\n\
    \    configurable: true,\n  });\n\n// For comparison, the original:\nconst desc\
    \ = Object.getOwnPropertyDescriptor.bind(Object);\nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(source,\
    \ 'data'),\n  {\n    get: undefined,\n    set: desc(source, 'data').set,\n   \
    \ enumerable: true,\n    configurable: true,\n  });\n```\n\nFortunately, using\
    \ `Object.getOwnPropertyDescriptors()` together with `Object.defineProperties()`\
    \ does faithfully copy the property `data`:\n\n```\nconst target2 = {};\nObject.defineProperties(\n\
    \  target2, Object.getOwnPropertyDescriptors(source));\n\nassert.deepEqual(\n\
    \  Object.getOwnPropertyDescriptor(target2, 'data'),\n  {\n    get: undefined,\n\
    \    set: desc(source, 'data').set,\n    enumerable: true,\n    configurable:\
    \ true,\n  });\n```\n\n#### 9.6.1.1 Pitfall: copying methods that use `super`\n\
    \nA method that uses `super` is firmly connected with its *home object* (the object\
    \ it is stored in). There is currently no way to copy or move such a method to\
    \ a different object.\n\n### 9.6.2 Use case for `Object.getOwnPropertyDescriptors()`:\
    \ cloning objects\n\nShallow cloning is similar to copying properties, which is\
    \ why `Object.getOwnPropertyDescriptors()` is a good choice here, too.\n\nTo create\
    \ the clone, we use `Object.create()`:\n\n```\nconst original = {\n  set data(value)\
    \ {\n    this._data = value;\n  }\n};\n\nconst clone = Object.create(\n  Object.getPrototypeOf(original),\n\
    \  Object.getOwnPropertyDescriptors(original));\n\nassert.deepEqual(original,\
    \ clone);\n```\n\nFor more information on this topic, see [§6 “Copying objects\
    \ and Arrays”](#ch007.xhtml_ch_copying-objects-and-arrays).\n\n## 9.7 Omitting\
    \ descriptor properties\n\nAll properties of descriptors are optional. What happens\
    \ when you omit a property depends on the operation.\n\n### 9.7.1 Omitting descriptor\
    \ properties when creating properties\n\nWhen we create a new property via a descriptor,\
    \ then omitting attributes means that their default values are used:\n\n```\n\
    const car = {};\nObject.defineProperty(\n  car, 'color', {\n    value: 'red',\n\
    \  });\nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(car, 'color'),\n\
    \  {\n    value: 'red',\n    writable: false,\n    enumerable: false,\n    configurable:\
    \ false,\n  });\n```\n\n### 9.7.2 Omitting descriptor properties when changing\
    \ properties\n\nIf instead, we change an existing property, then omitting descriptor\
    \ properties means that the corresponding attributes are not touched:\n\n```\n\
    const car = {\n  color: 'yellow',\n};\nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(car,\
    \ 'color'),\n  {\n    value: 'yellow',\n    writable: true,\n    enumerable: true,\n\
    \    configurable: true,\n  });\nObject.defineProperty(\n  car, 'color', {\n \
    \   value: 'pink',\n  });\nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(car,\
    \ 'color'),\n  {\n    value: 'pink',\n    writable: true,\n    enumerable: true,\n\
    \    configurable: true,\n  });\n```\n\n## 9.8 What property attributes do built-in\
    \ constructs use?\n\nThe general rule (with few exceptions) for property attributes\
    \ is:\n\n*   Properties of objects at the beginning of a prototype chain are usually\
    \ `writable`, `enumerable`, and `configurable`.\n\n*   As described in [the chapter\
    \ on enumerability](#ch013.xhtml_ch_enumerability), most inherited properties\
    \ are non-enumerable, to hide them from legacy constructs such as `for-in` loops.\
    \ Inherited properties are usually `writable` and `configurable`.\n\n### 9.8.1 Own\
    \ properties created via assignment\n\n```\nconst obj = {};\nobj.prop = 3;\n\n\
    assert.deepEqual(\n  Object.getOwnPropertyDescriptors(obj),\n  {\n    prop: {\n\
    \      value: 3,\n      writable: true,\n      enumerable: true,\n      configurable:\
    \ true,\n    }\n  });\n```\n\n### 9.8.2 Own properties created via object literals\n\
    \n```\nconst obj = { prop: 'yes' };\n\nassert.deepEqual(\n  Object.getOwnPropertyDescriptors(obj),\n\
    \  {\n    prop: {\n      value: 'yes',\n      writable: true,\n      enumerable:\
    \ true,\n      configurable: true\n    }\n  });\n```\n\n### 9.8.3 The own property\
    \ `.length` of Arrays\n\nThe own property `.length` of Arrays is non-enumerable,\
    \ so that it isn’t copied by `Object.assign()`, spreading, and similar operations.\
    \ It is also non-configurable:\n\n```\n> Object.getOwnPropertyDescriptor([], 'length')\n\
    { value: 0, writable: true, enumerable: false, configurable: false }\n> Object.getOwnPropertyDescriptor('abc',\
    \ 'length')\n{ value: 3, writable: false, enumerable: false, configurable: false\
    \ }\n```\n"
