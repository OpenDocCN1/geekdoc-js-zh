    \  .then(x => {\n    assert.equal(x, 'result2');\n  });\n```\n\nIn the following\
    \ example:\n\n*   First `.then()`: We return a value in a rejection reaction.\n\
    \n*   Second `.then()`: We receive that value via a fulfillment reaction.\n\n\
    ```\nnew ToyPromise2()\n  .reject('error1')\n  .then(null,\n    x => {\n     \
    \ assert.equal(x, 'error1');\n      return 'result2';\n    })\n  .then(x => {\n\
    \    assert.equal(x, 'result2');\n  });\n```\n\n## 18.4 Convenience method `.catch()`\n\
    \nThe new version introduces a convenience method `.catch()` that makes it easier\
    \ to only provide a rejection reaction. Note that only providing a fulfillment\
    \ reaction is already easy – we simply omit the second parameter of `.then()`\
    \ (see previous example).\n\nThe previous example looks nicer if we use it (line\
    \ A):\n\n```\nnew ToyPromise2()\n  .reject('error1')\n  .catch(x => { // (A)\n\
    \    assert.equal(x, 'error1');\n    return 'result2';\n  })\n  .then(x => {\n\
    \    assert.equal(x, 'result2');\n  });\n```\n\nThe following two method invocations\
    \ are equivalent:\n\n```\n.catch(rejectionReaction)\n.then(null, rejectionReaction)\n\
    ```\n\nThis is how `.catch()` is implemented:\n\n```\ncatch(onRejected) { // [new]\n\
    \  return this.then(null, onRejected);\n}\n```\n\n## 18.5 Omitting reactions\n\
    \nThe new version also forwards fulfillments if we omit a fulfillment reaction\
    \ and it forwards rejections if we omit a rejection reaction. Why is that useful?\n\
    \nThe following example demonstrates passing on rejections:\n\n```\nsomeAsyncFunction()\n\
    \  .then(fulfillmentReaction1)\n  .then(fulfillmentReaction2)\n  .catch(rejectionReaction);\n\
    ```\n\n`rejectionReaction` can now handle the rejections of `someAsyncFunction()`,\
    \ `fulfillmentReaction1`, and `fulfillmentReaction2`.\n\nThe following example\
