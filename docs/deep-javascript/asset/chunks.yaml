    \n## 2.6 Glossary: terms related to type conversion\n\nNow that we have taken\
    \ a closer look at how JavaScript’s type coercion works, let’s conclude with a\
    \ brief glossary of terms related to type conversion:\n\n*   In *type conversion*,\
    \ we want the output value to have a given type. If the input value already has\
    \ that type, it is simply returned unchanged. Otherwise, it is converted to a\
    \ value that has the desired type.\n\n*   *Explicit type conversion* means that\
    \ the programmer uses an operation (a function, an operator, etc.) to trigger\
    \ a type conversion. Explicit conversions can be:\n\n    *   *Checked*: If a value\
    \ can’t be converted, an exception is thrown.\n\n    *   *Unchecked*: If a value\
    \ can’t be converted, an error value is returned.\n\n*   What *type casting* is,\
    \ depends on the programming language. For example, in Java, it is explicit checked\
    \ type conversion.\n\n*   *Type coercion* is implicit type conversion: An operation\
    \ automatically converts its arguments to the types it needs. Can be checked or\
    \ unchecked or something in-between.\n\n[Source: [Wikipedia](https://en.wikipedia.org/wiki/Type_conversion)]\n\
    \n# 3 The destructuring algorithm\n\n* * *\n\n*   3.1 [Preparing for the pattern\
    \ matching algorithm](#ch004.xhtml_preparing-for-the-pattern-matching-algorithm)\n\
    \n    *   3.1.1 [Using declarative rules for specifying the matching algorithm](#ch004.xhtml_using-declarative-rules-for-specifying-the-matching-algorithm)\n\
    \n    *   3.1.2 [Evaluating expressions based on the declarative rules](#ch004.xhtml_evaluating-expressions-based-on-the-declarative-rules)\n\
    \n*   3.2 [The pattern matching algorithm](#ch004.xhtml_the-pattern-matching-algorithm)\n\
    \n    *   3.2.1 [Patterns](#ch004.xhtml_patterns)\n\n    *   3.2.2 [Rules for\
    \ variable](#ch004.xhtml_rules-for-variable)\n\n    *   3.2.3 [Rules for object\
    \ patterns](#ch004.xhtml_rules-for-object-patterns)\n\n    *   3.2.4 [Rules for\
    \ Array patterns](#ch004.xhtml_rules-for-array-patterns)\n\n*   3.3 [Empty object\
    \ patterns and Array patterns](#ch004.xhtml_empty-object-patterns-and-array-patterns)\n\
    \n*   3.4 [Applying the algorithm](#ch004.xhtml_applying-the-algorithm)\n\n  \
    \  *   3.4.1 [Background: passing parameters via matching](#ch004.xhtml_background-passing-parameters-via-matching)\n\
    \n    *   3.4.2 [Using `move2()`](#ch004.xhtml_using-move2)\n\n    *   3.4.3 [Using\
    \ `move1()`](#ch004.xhtml_using-move1)\n\n    *   3.4.4 [Conclusion: Default values\
    \ are a feature of pattern parts](#ch004.xhtml_conclusion-default-values-are-a-feature-of-pattern-parts)\n\
    \n* * *\n\nIn this chapter, we look at destructuring from a different angle: as\
    \ a recursive pattern matching algorithm.\n\nThe algorithm will give us a better\
    \ understanding of default values. That will be useful at the end, where we’ll\
    \ try to figure out how the following two functions differ:\n\n```\n[](#cb40-1)function\
    \ move({x=0, y=0} = {})         { ··· }\n[](#cb40-2)function move({x, y} = { x:\
    \ 0, y: 0 }) { ··· }\n```\n\n## 3.1 Preparing for the pattern matching algorithm\n\
    \nA destructuring assignment looks like this:\n\n```\n[](#cb41-1)«pattern» = «value»\n\
    ```\n\nWe want to use `pattern` to extract data from `value`.\n\nWe will now look\
    \ at an algorithm for performing this kind of assignment. This algorithm is known\
    \ in functional programming as *pattern matching* (short: *matching*). It specifies\
    \ the operator `←` (“match against”) that matches a `pattern` against a `value`\
    \ and assigns to variables while doing so:\n\n```\n[](#cb42-1)«pattern» ← «value»\n\
    ```\n\nWe will only explore destructuring assignment, but destructuring variable\
    \ declarations and destructuring parameter definitions work similarly. We won’t\
    \ go into advanced features, either: Computed property keys, property value shorthands,\
    \ and object properties and array elements as assignment targets, are beyond the\
    \ scope of this chapter.\n\nThe specification for the match operator consists\
    \ of declarative rules that descend into the structures of both operands. The\
    \ declarative notation may take some getting used to, but it makes the specification\
    \ more concise.\n\n### 3.1.1 Using declarative rules for specifying the matching\
    \ algorithm\n\nThe declarative rules used in this chapter operate on input and\
    \ produce the result of the algorithm via side effects. This is one such rule\
    \ (which we’ll see again later):\n\n*   (2c) `{key: «pattern», «properties»} ←\
    \ obj`\n\n    ```\n    [](#cb43-1)«pattern» ← obj.key\n    [](#cb43-2){«properties»}\
    \ ← obj\n    ```\n\nThis rule has the following parts:\n\n*   (2c) is the *number*\
    \ of the rule. The number is used to refer to the rule.\n\n*   The *head* (first\
    \ line) describes what the input must look like so that this rule can be applied.\n\
    \n*   The *body* (remaining lines) describes what happens if the rule is applied."
