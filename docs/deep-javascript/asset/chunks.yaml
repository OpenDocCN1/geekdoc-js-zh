    \ coerces objects to primitives (with a default hint) if the other operand is\
    \ a primitive value other than `undefined`, `null`, and `boolean`. In the following\
    \ interaction, we can see that the result of coercing the date is a string:\n\n\
    \    ```\n    [](#cb22-1)const d = new Date('2222-03-27');\n    [](#cb22-2)assert.equal(\n\
    \    [](#cb22-3)  d == 'Wed Mar 27 2222 01:00:00 GMT+0100'\n    [](#cb22-4)  \
    \     + ' (Central European Standard Time)',\n    [](#cb22-5)  true);\n    ```\n\
    \n*   [The `+` operator](#ch003.xhtml_addition-operator) coerces both operands\
    \ to primitives (with a default hint). If one of the results is a string, it performs\
    \ string concatenation (otherwise it performs numeric addition). In the following\
    \ interaction, we can see that the result of coercing the date is a string because\
    \ the operator returns a string.\n\n    ```\n    [](#cb23-1)const d = new Date('2222-03-27');\n\
    \    [](#cb23-2)assert.equal(\n    [](#cb23-3)  123 + d,\n    [](#cb23-4)  '123Wed\
    \ Mar 27 2222 01:00:00 GMT+0100'\n    [](#cb23-5)    + ' (Central European Standard\
    \ Time)');\n    ```\n\n### 2.4.2 `ToString()` and related operations\n\nThis is\
    \ the JavaScript version of `ToString()`:\n\n```\n[](#cb24-1)function ToString(argument)\
    \ {\n[](#cb24-2)  if (argument === undefined) {\n[](#cb24-3)    return 'undefined';\n\
    [](#cb24-4)  } else if (argument === null) {\n[](#cb24-5)    return 'null';\n\
    [](#cb24-6)  } else if (argument === true) {\n[](#cb24-7)    return 'true';\n\
    [](#cb24-8)  } else if (argument === false) {\n[](#cb24-9)    return 'false';\n\
    [](#cb24-10)  } else if (TypeOf(argument) === 'number') {\n[](#cb24-11)    return\
    \ Number.toString(argument);\n[](#cb24-12)  } else if (TypeOf(argument) === 'string')\
    \ {\n[](#cb24-13)    return argument;\n[](#cb24-14)  } else if (TypeOf(argument)\
    \ === 'symbol') {\n[](#cb24-15)    throw new TypeError();\n[](#cb24-16)  } else\
    \ if (TypeOf(argument) === 'bigint') {\n[](#cb24-17)    return BigInt.toString(argument);\n\
    [](#cb24-18)  } else {\n[](#cb24-19)    // argument is an object\n[](#cb24-20)\
    \    let primValue = ToPrimitive(argument, 'string'); // (A)\n[](#cb24-21)   \
    \ return ToString(primValue);\n[](#cb24-22)  }\n[](#cb24-23)}\n```\n\nNote how\
    \ this function uses `ToPrimitive()` as an intermediate step for objects, before\
    \ converting the primitive result to a string (line A).\n\n`ToString()` deviates\
    \ in an interesting way from how `String()` works: If `argument` is a symbol,\
    \ the former throws a `TypeError` while the latter doesn’t. Why is that? The default\
    \ for symbols is that converting them to strings throws exceptions:\n\n```\n>\
    \ const sym = Symbol('sym');\n\n> ''+sym\nTypeError: Cannot convert a Symbol value\
    \ to a string\n> `${sym}`\nTypeError: Cannot convert a Symbol value to a string\n\
    ```\n\nThat default is overridden in `String()` and `Symbol.prototype.toString()`\
    \ (both are described in the next subsections):\n\n```\n> String(sym)\n'Symbol(sym)'\n\
    > sym.toString()\n'Symbol(sym)'\n```\n\n#### 2.4.2.1 `String()`\n\n```\n[](#cb27-1)function\
    \ String(value) {\n[](#cb27-2)  let s;\n[](#cb27-3)  if (value === undefined)\
    \ {\n[](#cb27-4)    s = '';\n[](#cb27-5)  } else {\n[](#cb27-6)    if (new.target\
    \ === undefined && TypeOf(value) === 'symbol') {\n[](#cb27-7)      // This function\
    \ was function-called and value is a symbol\n[](#cb27-8)      return SymbolDescriptiveString(value);\n\
    [](#cb27-9)    }\n[](#cb27-10)    s = ToString(value);\n[](#cb27-11)  }\n[](#cb27-12)\
    \  if (new.target === undefined) {\n[](#cb27-13)    // This function was function-called\n\
    [](#cb27-14)    return s;\n[](#cb27-15)  }\n[](#cb27-16)  // This function was\
    \ new-called\n[](#cb27-17)  return StringCreate(s, new.target.prototype); // simplified!\n\
    [](#cb27-18)}\n```\n\n`String()` works differently, depending on whether it is\
    \ invoked via a function call or via `new`. It uses [`new.target`](https://exploringjs.com/es6/ch_classes.html#sec_allocating-and-initializing-instances)\
    \ to distinguish the two.\n\nThese are the helper functions `StringCreate()` and\
    \ `SymbolDescriptiveString()`:\n\n```\n[](#cb28-1)/** \n[](#cb28-2) * Creates\
    \ a String instance that wraps `value`\n[](#cb28-3) * and has the given protoype.\n\
    [](#cb28-4) */\n[](#cb28-5)function StringCreate(value, prototype) {\n[](#cb28-6)\
    \  // ···\n[](#cb28-7)}\n[](#cb28-8)\n[](#cb28-9)function SymbolDescriptiveString(sym)\
    \ {\n[](#cb28-10)  assert.equal(TypeOf(sym), 'symbol');\n[](#cb28-11)  let desc\
    \ = sym.description;\n[](#cb28-12)  if (desc === undefined) {\n[](#cb28-13)  \
    \  desc = '';\n[](#cb28-14)  }\n[](#cb28-15)  assert.equal(TypeOf(desc), 'string');\n\
    [](#cb28-16)  return 'Symbol('+desc+')';\n[](#cb28-17)}\n```\n\n#### 2.4.2.2 `Symbol.prototype.toString()`\n\
    \nIn addition to `String()`, we can also use method `.toString()` to convert a\
    \ symbol to a string. Its specification looks as follows."
