    以下是规则：\n\n*   (3c) `«pattern», «elements» ← iterator`\n\n    ```\n    [](#cb56-1)«pattern»\
    \ ← getNext(iterator) // 最后一项之后为 undefined\n    [](#cb56-2)«elements» ← iterator\n\
    \    ```\n\n*   (3d) `«pattern» = default_value, «elements» ← iterator`\n\n  \
    \  ```\n    [](#cb57-1)const tmp = getNext(iterator);  // 最后一项之后为 undefined\n\
    \    [](#cb57-2)if (tmp !== undefined) {\n    [](#cb57-3)  «pattern» ← tmp\n \
    \   [](#cb57-4)} else {\n    [](#cb57-5)  «pattern» ← default_value\n    [](#cb57-6)}\n\
    \    [](#cb57-7)«elements» ← iterator\n    ```\n\n*   (3e) `, «elements» ← iterator`（空洞，省略）\n\
    \n    ```\n    [](#cb58-1)getNext(iterator); // 跳过\n    [](#cb58-2)«elements»\
    \ ← iterator\n    ```\n\n*   (3f) `...«pattern» ← iterator`（始终是最后一部分！）\n\n   \
