    \ original = {__proto__: proto, ownProp: 'b' };\n[](#cb116-3)assert.equal(original.inheritedProp,\
    \ 'a');\n[](#cb116-4)assert.equal(original.ownProp, 'b');\n[](#cb116-5)\n[](#cb116-6)const\
    \ copy = {...original};\n[](#cb116-7)assert.equal(copy.inheritedProp, undefined);\n\
    [](#cb116-8)assert.equal(copy.ownProp, 'b');\n```\n\n#### 6.2.1.4 Only enumerable\
    \ properties are copied\n\nFor example, the own property `.length` of Array instances\
    \ is not enumerable and not copied:\n\n```\n[](#cb117-1)const arr = ['a', 'b'];\n\
    [](#cb117-2)assert.equal(arr.length, 2);\n[](#cb117-3)assert.equal({}.hasOwnProperty.call(arr,\
    \ 'length'), true);\n[](#cb117-4)\n[](#cb117-5)const copy = {...arr};\n[](#cb117-6)assert.equal({}.hasOwnProperty.call(copy,\
    \ 'length'), false);\n```\n\nThis is also rarely a limitation because most properties\
    \ are enumerable. If we need to copy non-enumerable properties, we can use `Object.getOwnPropertyDescriptors()`\
    \ and `Object.defineProperties()` to copy objects ([how to do that is explained\
    \ later](#ch007.xhtml_copying-via-property-descriptors)):\n\n*   They consider\
    \ all attributes (not just `value`) and therefore correctly copy getters, setters,\
    \ read-only properties, etc.\n\n*   `Object.getOwnPropertyDescriptors()` retrieves\
    \ both enumerable and non-enumerable properties.\n\nFor more information on enumerability,\
    \ see [§12 “Enumerability of properties”](#ch013.xhtml_ch_enumerability).\n\n\
    #### 6.2.1.5 Property attributes aren’t always copied faithfully\n\nIndependently\
    \ of [the *attributes* of a property](#ch010.xhtml_ch_property-attributes-intro),\
    \ its copy will always be a data property that is writable and configurable.\n\
    \nFor example, here we create the property `original.prop` whose attributes `writable`\
    \ and `configurable` are `false`:\n\n```\n[](#cb118-1)const original = Object.defineProperties(\n\
    [](#cb118-2)  {}, {\n[](#cb118-3)    prop: {\n[](#cb118-4)      value: 1,\n[](#cb118-5)\
    \      writable: false,\n[](#cb118-6)      configurable: false,\n[](#cb118-7)\
    \      enumerable: true,\n[](#cb118-8)    },\n[](#cb118-9)  });\n[](#cb118-10)assert.deepEqual(original,\
    \ {prop: 1});\n```\n\nIf we copy `.prop`, then `writable` and `configurable` are\
    \ both `true`:\n\n```\n[](#cb119-1)const copy = {...original};\n[](#cb119-2)//\
    \ Attributes `writable` and `configurable` of copy are different:\n[](#cb119-3)assert.deepEqual(\n\
    [](#cb119-4)  Object.getOwnPropertyDescriptors(copy),\n[](#cb119-5)  {\n[](#cb119-6)\
    \    prop: {\n[](#cb119-7)      value: 1,\n[](#cb119-8)      writable: true,\n\
    [](#cb119-9)      configurable: true,\n[](#cb119-10)      enumerable: true,\n\
    [](#cb119-11)    },\n[](#cb119-12)  });\n```"
