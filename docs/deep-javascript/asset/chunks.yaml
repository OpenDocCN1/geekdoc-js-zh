    \ `[]`：如果要解构的值是可迭代的，则什么也不会发生。否则，会抛出 `TypeError`。\n\n```\n[](#cb63-1)const [] =\
    \ 'abc'; // OK，可迭代\n[](#cb63-2)assert.throws(\n[](#cb63-3)  () => {\n[](#cb63-4)\
    \    const [] = 123; // 不可迭代\n[](#cb63-5)  },\n[](#cb63-6)  /^TypeError: 123 is\
    \ not iterable$/)\n```\n\n换句话说：空的解构模式强制值具有某些特征，但没有其他效果。\n\n## 3.4 应用算法\n\n在 JavaScript\
    \ 中，命名参数通过对象来模拟：调用者使用对象字面量，被调用者使用解构。这种模拟在 [“JavaScript for impatient programmers”](https://exploringjs.com/impatient-js/ch_callables.html#named-parameters)\
    \ 中有详细解释。以下代码展示了一个示例：函数 `move1()` 有两个命名参数 `x` 和 `y`：\n\n```\n[](#cb64-1)function\
    \ move1({x=0, y=0} = {}) { // (A)\n[](#cb64-2)  return [x, y];\n[](#cb64-3)}\n\
    [](#cb64-4)assert.deepEqual(\n[](#cb64-5)  move1({x: 3, y: 8}), [3, 8]);\n[](#cb64-6)assert.deepEqual(\n\
    [](#cb64-7)  move1({x: 3}), [3, 0]);\n[](#cb64-8)assert.deepEqual(\n[](#cb64-9)\
    \  move1({}), [0, 0]);\n[](#cb64-10)assert.deepEqual(\n[](#cb64-11)  move1(),\
    \ [0, 0]);\n```\n\n在 A 行中有三个默认值：\n\n*   前两个默认值允许我们省略 `x` 和 `y`。\n\n*   第三个默认值允许我们在没有参数的情况下调用\
    \ `move1()`（如最后一行所示）。\n\n但为什么我们要像前面的代码片段那样定义参数呢？为什么不如下所示？\n\n```\n[](#cb65-1)function\
    \ move2({x, y} = { x: 0, y: 0 }) {\n[](#cb65-2)  return [x, y];\n[](#cb65-3)}\n\
    ```\n\n为了理解为什么 `move1()` 是正确的，我们将在两个示例中使用这两个函数。在此之前，让我们看看如何通过匹配来解释参数的传递。\n\n###\
    \ 3.4.1 背景：通过匹配传递参数\n\n对于函数调用，*形式参数*（在函数定义内部）与*实际参数*（在函数调用内部）进行匹配。例如，以下函数定义和函数调用：\n\
    \n```\n[](#cb66-1)function func(a=0, b=0) { ··· }\n[](#cb66-2)func(1, 2);\n```\n\
    \n参数 `a` 和 `b` 的设置方式类似于以下解构：\n\n```\n[](#cb67-1)[a=0, b=0] ← [1, 2]\n```\n\n###\
    \ 3.4.2 使用 `move2()`\n\n"
- fmt: "\nLet’s examine how destructuring works for `move2()`.\n\n**Example 1.** The\
    \ function call `move2()` leads to this destructuring:\n\n```\n[{x, y} = { x:\
    \ 0, y: 0 }] ← []\n```\n\nThe single Array element on the left-hand side does\
    \ not have a match on the right-hand side, which is why `{x,y}` is matched against\
    \ the default value and not against data from the right-hand side (rules 3b, 3d):\n\
    \n```\n{x, y} ← { x: 0, y: 0 }\n```\n\nThe left-hand side contains *property value\
    \ shorthands*. It is an abbreviation for:\n\n```\n{x: x, y: y} ← { x: 0, y: 0\
    \ }\n```\n\nThis destructuring leads to the following two assignments (rules 2c,\
    \ 1):\n\n```\nx = 0;\ny = 0;\n```\n\nThis is what we wanted. However, in the next\
    \ example, we are not as lucky.\n\n**Example 2.** Let’s examine the function call\
    \ `move2({z: 3})` which leads to the following destructuring:\n\n```\n[{x, y}\
    \ = { x: 0, y: 0 }] ← [{z: 3}]\n```\n\nThere is an Array element at index 0 on\
    \ the right-hand side. Therefore, the default value is ignored and the next step\
    \ is (rule 3d):\n\n```\n{x, y} ← { z: 3 }\n```\n\nThat leads to both `x` and `y`\
    \ being set to `undefined`, which is not what we want. The problem is that `{x,y}`\
    \ is not matched against the default value, anymore, but against `{z:3}`.\n\n\
    ### 3.4.3 Using `move1()`\n\nLet’s try `move1()`.\n\n**Example 1:** `move1()`\n\
    \n```\n[{x=0, y=0} = {}] ← []\n```\n\nWe don’t have an Array element at index\
    \ 0 on the right-hand side and use the default value (rule 3d):\n\n```\n{x=0,\
    \ y=0} ← {}\n```\n\nThe left-hand side contains property value shorthands, which\
    \ means that this destructuring is equivalent to:\n\n```\n{x: x=0, y: y=0} ← {}\n\
    ```\n\nNeither property `x` nor property `y` have a match on the right-hand side.\
    \ Therefore, the default values are used and the following destructurings are\
    \ performed next (rule 2d):\n\n```\nx ← 0\ny ← 0\n```\n\nThat leads to the following\
    \ assignments (rule 1):\n\n```\nx = 0\ny = 0\n```\n\nHere, we get what we want.\
    \ Let’s see if our luck holds with the next example.\n\n**Example 2:** `move1({z:\
    \ 3})`\n\n```\n[{x=0, y=0} = {}] ← [{z: 3}]\n```\n\nThe first element of the Array\
    \ pattern has a match on the right-hand side and that match is used to continue\
    \ destructuring (rule 3d):\n\n```\n{x=0, y=0} ← {z: 3}\n```\n\nLike in example\
    \ 1, there are no properties `x` and `y` on the right-hand side and the default\
    \ values are used:\n\n```\nx = 0\ny = 0\n```\n\nIt works as desired! This time,\
    \ the pattern with `x` and `y` being matched against `{z:3}` is not a problem,\
    \ because they have their own local default values.\n\n### 3.4.4 Conclusion: Default\
    \ values are a feature of pattern parts\n\nThe examples demonstrate that default\
    \ values are a feature of pattern parts (object properties or Array elements).\
    \ If a part has no match or is matched against `undefined` then the default value\
    \ is used. That is, the pattern is matched against the default value, instead.\n\
    \n# 4 A detailed look at global variables\n\n* * *\n\n*   4.1 [Scopes](#ch005.xhtml_scopes)\n\
    *   4.2 [Lexical environments](#ch005.xhtml_lexical-environments)\n*   4.3 [The\
    \ global object](#ch005.xhtml_the-global-object)\n*   4.4 [In browsers, `globalThis`\
    \ does not point directly to the global object](#ch005.xhtml_window-proxy)\n*\
    \   4.5 [The global environment](#ch005.xhtml_the-global-environment)\n    * \
    \  4.5.1 [Script scope and module scopes](#ch005.xhtml_script-scope-and-module-scopes)\n\
    \    *   4.5.2 [Creating variables: declarative record vs. object record](#ch005.xhtml_creating-variables-declarative-record-vs.-object-record)\n\
    \    *   4.5.3 [Getting or setting variables](#ch005.xhtml_getting-or-setting-variables)\n\
    \    *   4.5.4 [Global ECMAScript variables and global host variables](#ch005.xhtml_global-ecmascript-variables-and-global-host-variables)\n\
    *   4.6 [Conclusion: Why does JavaScript have both normal global variables and\
    \ the global object?](#ch005.xhtml_conclusion-why-does-javascript-have-both-normal-global-variables-and-the-global-object)\n\
    *   4.7 [Further reading and sources of this chapter](#ch005.xhtml_further-reading-and-sources-of-this-chapter)\n\
    \n* * *\n\nIn this chapter, we take a detailed look at how JavaScript’s global\
    \ variables work. Several interesting phenomena play a role: the scope of scripts,\
    \ the so-called *global object*, and more.\n\n## 4.1 Scopes\n\nThe *lexical scope*\
    \ (short: *scope*) of a variable is the region of a program where it can be accessed.\
    \ JavaScript’s scopes are *static* (they don’t change at runtime) and they can\
    \ be nested – for example:\n\n```\nfunction func() { // (A)\n  const aVariable\
    \ = 1;\n  if (true) { // (B)\n    const anotherVariable = 2;\n  }\n}\n```\n\n\
    The scope introduced by the `if` statement (line B) is nested inside the scope\
    \ of function `func()` (line A).\n\nThe innermost surrounding scope of a scope\
    \ S is called the *outer scope* of S. In the example, `func` is the outer scope\
    \ of `if`.\n\n## 4.2 Lexical environments\n\nIn the JavaScript language specification,\
    \ scopes are “implemented” via *lexical environments*. They consist of two components:\n\
    \n*   An *environment record* that maps variable names to variable values (think\
    \ dictionary). This is the actual storage space for the variables of the scope.\
    \ The name-value entries in the record are called *bindings*.\n*   A reference\
    \ to the *outer environment* – the environment for the outer scope.\n\nThe tree\
    \ of nested scopes is therefore represented by a tree of environments linked by\
    \ outer environment references.\n\n## 4.3 The global object\n\nThe global object\
    \ is an object whose properties become global variables. (We’ll examine soon how\
    \ exactly it fits into the tree of environments.) It can be accessed via the following\
    \ global variables:\n\n*   Available on all platforms: [`globalThis`](https://exploringjs.com/impatient-js/ch_variables-assignment.html#globalThis).\
    \ The name is based on the fact that it has the same value as `this` in global\
    \ scope.\n*   Other variables for the global object are not available on all platforms:\n\
    \    *   `window` is the classic way of referring to the global object. It works\
    \ in normal browser code, but not in *Web Workers* (processes running concurrently\
    \ to the normal browser process) and not on Node.js.\n    *   `self` is available\
    \ everywhere in browsers (including in Web Workers). But it isn’t supported by\
    \ Node.js.\n    *   `global` is only available on Node.js.\n\n## 4.4 In browsers,\
    \ `globalThis` does not point directly to the global object\n\nIn browsers, `globalThis`\
    \ does not point directly to the global, there is an indirection. As an example,\
    \ consider an iframe on a web page:\n\n*   Whenever the `src` of the iframe changes,\
    \ it gets a new global object.\n*   However, `globalThis` always has the same\
    \ value. That value can be checked from outside the iframe, as demonstrated below\
    \ (inspired by [an example in the `globalThis` proposal](https://github.com/tc39/proposal-global#html-and-the-windowproxy)).\n\
    \nFile `parent.html`:\n"
