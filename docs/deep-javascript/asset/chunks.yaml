  trans: "\n\n*   12.1.3 内省操作的命名规则\n*   12.2 预定义属性和创建属性的可枚举性\n*   12.3 可枚举性的使用场景\n\
    \    *   12.3.1 使用场景：从 `for-in` 循环中隐藏属性\n    *   12.3.2 使用场景：标记属性为不可复制\n    *\
    \   12.3.3 将属性标记为私有\n    *   12.3.4 从 `JSON.stringify()` 中隐藏自有属性\n*   12.4 总结\n\
    \n* * *\n\n可枚举性是对象属性的一个*属性*。在本章中，我们将深入探讨它的使用方式以及它如何影响诸如 `Object.keys()` 和 `Object.assign()`\
    \ 等操作。\n\n![](img/file0.svg) **必备知识：属性特性**\n\n阅读本章前，你需要熟悉属性特性。如果不熟悉，请查阅 §9 “属性特性：简介”。\n\
    \n## 12.1 可枚举性如何影响属性遍历结构\n\n为了演示各种操作如何受可枚举性影响，我们使用以下对象 `obj`，其原型为 `proto`。\n\n\
    ```\nconst protoEnumSymbolKey = Symbol('protoEnumSymbolKey');\nconst protoNonEnumSymbolKey\
    \ = Symbol('protoNonEnumSymbolKey');\nconst proto = Object.defineProperties({},\
    \ {\n  protoEnumStringKey: {\n    value: 'protoEnumStringKeyValue',\n    enumerable:\
    \ true,\n  },\n  [protoEnumSymbolKey]: {\n    value: 'protoEnumSymbolKeyValue',\n\
    \    enumerable: true,\n  },\n  protoNonEnumStringKey: {\n    value: 'protoNonEnumStringKeyValue',\n\
    \    enumerable: false,\n  },\n  [protoNonEnumSymbolKey]: {\n    value: 'protoNonEnumSymbolKeyValue',\n\
    \    enumerable: false,\n  },\n});\n\nconst objEnumSymbolKey = Symbol('objEnumSymbolKey');\n\
    const objNonEnumSymbolKey = Symbol('objNonEnumSymbolKey');\nconst obj = Object.create(proto,\
    \ {\n  objEnumStringKey: {\n    value: 'objEnumStringKeyValue',\n    enumerable:\
    \ true,\n  },\n  [objEnumSymbolKey]: {\n    value: 'objEnumSymbolKeyValue',\n\
    \    enumerable: true,\n  },\n  objNonEnumStringKey: {\n    value: 'objNonEnumStringKeyValue',\n\
    \    enumerable: false,\n  },\n  [objNonEnumSymbolKey]: {\n    value: 'objNonEnumSymbolKeyValue',\n\
    \    enumerable: false,\n  },\n});\n```\n\n### 12.1.1 仅考虑可枚举属性的操作\n\n表 2：忽略不可枚举属性的操作。\n\
    \n| 操作 |  | 字符串键 | Symbol 键 | 继承属性 |\n| --- | --- | --- | --- | --- |\n| `Object.keys()`\
    \ | ES5 | `✔` | `✘` | `✘` |\n| `Object.values()` | ES2017 | `✔` | `✘` | `✘` |\n\
    | `Object.entries()` | ES2017 | `✔` | `✘` | `✘` |\n| 展开 `{...x}` | ES2018 | `✔`\
    \ | `✔` | `✘` |\n| `Object.assign()` | ES6 | `✔` | `✔` | `✘` |\n| `JSON.stringify()`\
    \ | ES5 | `✔` | `✘` | `✘` |\n| `for-in` | ES1 | `✔` | `✘` | `✔` |\n\n以下操作（总结于表\
    \ 2）仅考虑可枚举属性：\n\n*   `Object.keys()` ^([ES5]) 返回可枚举自有字符串键属性的键。\n\n    ```\n  \
    \  > Object.keys(obj)\n    [ 'objEnumStringKey' ]\n    ```\n\n*   `Object.values()`\
    \ ^([ES2017]) 返回可枚举自有字符串键属性的值。\n\n    ```\n    > Object.values(obj)\n    [ 'objEnumStringKeyValue'\
    \ ]\n    ```\n\n*   `Object.entries()` ^([ES2017]) 返回可枚举自有字符串键属性的键值对。（注意：`Object.fromEntries()`\
    \ 确实接受 Symbol 作为键，但只创建可枚举属性。）\n\n    ```\n    > Object.entries(obj)\n    [ [ 'objEnumStringKey',\
    \ 'objEnumStringKeyValue' ] ]\n    ```\n\n*   展开到对象字面量 ^([ES2018]) 仅考虑自有可枚举属性（字符串键或\
    \ Symbol 键）。\n\n    ```\n    > const copy = {...obj};\n    > Reflect.ownKeys(copy)\n\
    \    [ 'objEnumStringKey', objEnumSymbolKey ]\n    ```\n\n*   `Object.assign()`\
    \ ^([ES6]) 仅复制可枚举的自有属性（字符串键或 Symbol 键）。\n\n    ```\n    > const copy = Object.assign({},\
    \ obj);\n    > Reflect.ownKeys(copy)\n    [ 'objEnumStringKey', objEnumSymbolKey\
    \ ]\n    ```\n\n*   `JSON.stringify()` ^([ES5]) 仅序列化可枚举的自有字符串键属性。\n\n    ```\n\
    \    > JSON.stringify(obj)\n    '{\"objEnumStringKey\":\"objEnumStringKeyValue\"\
    }'\n    ```\n\n*   `for-in` 循环 ^([ES1]) 遍历自身和继承的可枚举字符串键属性的键。\n\n    ```\n    const\
    \ propKeys = [];\n    for (const propKey in obj) {\n      propKeys.push(propKey);\n\
    \    }\n    assert.deepEqual(\n      propKeys, ['objEnumStringKey', 'protoEnumStringKey']);\n\
    \    ```\n\n`for-in` 是唯一一个可枚举性影响继承属性的内置操作。所有其他操作仅处理自有属性。\n\n### 12.1.2 同时考虑可枚举和不可枚举属性的操作\n\
    \n表 3：同时考虑可枚举和不可枚举属性的操作。\n\n| 操作 |  | 字符串键 | Symbol 键 | 继承属性 |\n| --- | --- |\
    \ --- | --- | --- |\n| `Object.getOwnPropertyNames()` | ES5 | `✔` | `✘` | `✘`\
    \ |\n| `Object.getOwnPropertySymbols()` | ES6 | `✘` | `✔` | `✘` |\n| `Reflect.ownKeys()`\
    \ | ES6 | `✔` | `✔` | `✘` |\n| `Object.getOwnPropertyDescriptors()` | ES2017 |\
    \ `✔` | `✔` | `✘` |\n\n以下操作（总结于表 3）同时考虑可枚举和不可枚举属性：\n\n*   `Object.getOwnPropertyNames()`\
    \ ^([ES5]) 列出所有自有字符串键属性的键。\n\n    ```\n    > Object.getOwnPropertyNames(obj)\n\
    \    [ 'objEnumStringKey', 'objNonEnumStringKey' ]\n    ```\n\n*   `Object.getOwnPropertySymbols()`\
    \ ^([ES6]) 列出所有自有 Symbol 键属性的键。\n\n    ```\n    > Object.getOwnPropertySymbols(obj)\n\
    \    [ objEnumSymbolKey, objNonEnumSymbolKey ]\n    ```\n\n*   `Reflect.ownKeys()`\
    \ ^([ES6]) 列出所有自有属性的键。\n\n    ```\n    > Reflect.ownKeys(obj)\n    [\n      'objEnumStringKey',\n\
    \      'objNonEnumStringKey',\n      objEnumSymbolKey,\n      objNonEnumSymbolKey\n\
    \    ]\n    ```\n\n*   `Object.getOwnPropertyDescriptors()` ^([ES2017]) 列出所有自有属性的属性描述符。\n\
    \n    ```\n    > Object.getOwnPropertyDescriptors(obj)\n    {\n      objEnumStringKey:\
    \ {\n        value: 'objEnumStringKeyValue',\n        writable: false,\n     \
    \   enumerable: true,\n        configurable: false\n      },\n      objNonEnumStringKey:\
    \ {\n        value: 'objNonEnumStringKeyValue',\n        writable: false,\n  \
    \      enumerable: false,\n        configurable: false\n      },\n      [objEnumSymbolKey]:\
    \ {\n        value: 'objEnumSymbolKeyValue',\n        writable: false,\n     \
    \   enumerable: true,\n        configurable: false\n      },\n      [objNonEnumSymbolKey]:\
    \ {\n        value: 'objNonEnumSymbolKeyValue',\n        writable: false,\n  \
    \      enumerable: false,\n        configurable: false\n      }\n    }\n    ```\n\
    \n### 12.1.3 内省操作的命名规则\n\n*内省*使程序能够在运行时检查值的结构。这是一种*元编程*：普通编程是关于编写程序；元编程是关于检查和/或修改程序。\n\
    \n"
- fmt: "\nIn JavaScript, common introspective operations have short names, while rarely\
    \ used operations have long names. Ignoring non-enumerable properties is the norm,\
    \ which is why operations that do that have short names and operations that don’t,\
    \ long names:\n\n*   `Object.keys()` ignores non-enumerable properties.\n\n* \
    \  `Object.getOwnPropertyNames()` lists the string keys of all own properties.\n\
    \nHowever, `Reflect` methods (such as `Reflect.ownKeys()`) deviate from this rule\
    \ because `Reflect` provides operations that are more “meta” and related to Proxies.\n\
    \nAdditionally, the following distinction is made (since ES6, which introduced\
    \ symbols):\n\n*   *Property keys* are either strings or symbols.\n\n*   *Property\
    \ names* are property keys that are strings.\n\n*   *Property symbols* are property\
    \ keys that are symbols.\n\nTherefore, a better name for `Object.keys()` would\
    \ now be `Object.names()`.\n\n## 12.2 The enumerability of pre-defined and created\
    \ properties\n\nIn this section, we’ll abbreviate `Object.getOwnPropertyDescriptor()`\
    \ like this:\n\n```\nconst desc = Object.getOwnPropertyDescriptor.bind(Object);\n\
    ```\n\nMost data properties are created with the following attributes:\n\n```\n\
    {\n  writable: true,\n  enumerable: false,\n  configurable: true,\n}\n```\n\n\
    That includes:\n\n*   Assignment\n\n*   Object literals\n\n*   Public class fields\n\
    \n*   `Object.fromEntries()`\n\nThe most important non-enumerable properties are:\n\
    \n*   Prototype properties of built-in classes\n\n    ```\n    > desc(Object.prototype,\
    \ 'toString').enumerable\n    false\n    ```\n\n*   Prototype properties created\
    \ via user-defined classes\n\n    ```\n    > desc(class {foo() {}}.prototype,\
    \ 'foo').enumerable\n    false\n    ```\n\n*   Property `.length` of Arrays:\n\
    \n    ```\n    > Object.getOwnPropertyDescriptor([], 'length')\n    { value: 0,\
    \ writable: true, enumerable: false, configurable: false }\n    ```\n\n*   Property\
    \ `.length` of strings (note that all properties of primitive values are read-only):\n\
    \n    ```\n    > Object.getOwnPropertyDescriptor('', 'length')\n    { value: 0,\
    \ writable: false, enumerable: false, configurable: false }\n    ```\n\nWe’ll\
    \ look at the use cases for enumerability next, which will tell us why some properties\
    \ are enumerable and others aren’t.\n\n## 12.3 Use cases for enumerability\n\n\
    Enumerability is an inconsistent feature. It does have use cases, but there is\
    \ always some kind of caveat. In this section, we look at the use cases and the\
    \ caveats.\n\n### 12.3.1 Use case: Hiding properties from the `for-in` loop\n\n\
    The `for-in` loop traverses *all* enumerable string-keyed properties of an object,\
    \ own and inherited ones. Therefore, the attribute `enumerable` is used to hide\
    \ properties that should not be traversed. That was the reason for introducing\
    \ enumerability in ECMAScript 1.\n\nIn general, it is best to avoid `for-in`.\
    \ The next two subsections explain why. The following function will help us demonstrate\
    \ how `for-in` works.\n\n```\nfunction listPropertiesViaForIn(obj) {\n  const\
    \ result = [];\n  for (const key in obj) {\n    result.push(key);\n  }\n  return\
    \ result;\n}\n```\n\n#### 12.3.1.1 The caveats of using `for-in` for objects\n\
    \n`for-in` iterates over all properties, including inherited ones:\n\n```\nconst\
    \ proto = {enumerableProtoProp: 1};\nconst obj = {\n  __proto__: proto,\n  enumerableObjProp:\
    \ 2,\n};\nassert.deepEqual(\n  listPropertiesViaForIn(obj),\n  ['enumerableObjProp',\
    \ 'enumerableProtoProp']);\n```\n\nWith normal plain objects, `for-in` doesn’t\
    \ see inherited methods such as `Object.prototype.toString()` because they are\
    \ all non-enumerable:\n\n```\nconst obj = {};\nassert.deepEqual(\n  listPropertiesViaForIn(obj),\n\
    \  []);\n```\n\nIn user-defined classes, all inherited properties are also non-enumerable\
    \ and therefore ignored:\n\n```\nclass Person {\n  constructor(first, last) {\n\
    \    this.first = first;\n    this.last = last;\n  }\n  getName() {\n    return\
    \ this.first + ' ' + this.last;\n  }\n}\nconst jane = new Person('Jane', 'Doe');\n\
    assert.deepEqual(\n  listPropertiesViaForIn(jane),\n  ['first', 'last']);\n```\n\
    \n**Conclusion:** In objects, `for-in` considers inherited properties and we usually\
    \ want to ignore those. Then it is better to combine a `for-of` loop with `Object.keys()`,\
    \ `Object.entries()`, etc.\n\n#### 12.3.1.2 The caveats of using `for-in` for\
    \ Arrays\n\nThe own property `.length` is non-enumerable in Arrays and strings\
    \ and therefore ignored by `for-in`:\n\n```\n> listPropertiesViaForIn(['a', 'b'])\n\
    [ '0', '1' ]\n> listPropertiesViaForIn('ab')\n[ '0', '1' ]\n```\n\nHowever, it\
    \ is generally not safe to use `for-in` to iterate over the indices of an Array\
    \ because it considers both inherited and own properties that are not indices.\
    \ The following example demonstrate what happens if an Array has an own non-index\
    \ property:\n\n```\nconst arr1 = ['a', 'b'];\nassert.deepEqual(\n  listPropertiesViaForIn(arr1),\n\
    \  ['0', '1']);\n\nconst arr2 = ['a', 'b'];\narr2.nonIndexProp = 'yes';\nassert.deepEqual(\n\
    \  listPropertiesViaForIn(arr2),\n  ['0', '1', 'nonIndexProp']);\n```\n\n**Conclusion:**\
    \ `for-in` should not be used for iterating over the indices of an Array because\
    \ it considers both index properties and non-index properties:\n\n*   If you are\
    \ interested in the keys of an Array, use the Array method `.keys()`:\n\n    ```\n\
    \    > [...['a', 'b', 'c'].keys()]\n    [ 0, 1, 2 ]\n    ```\n\n*   If you want\
    \ to iterate over the elements of an Array, use a `for-of` loop, which has the\
    \ added benefit of also working with other iterable data structures.\n\n### 12.3.2 Use\
    \ case: Marking properties as not to be copied\n\nBy making properties non-enumerable,\
    \ we can hide them from some copying operations. Let us first examine two historical\
    \ copying operations before moving on to more modern copying operations.\n\n####\
    \ 12.3.2.1 Historical copying operation: Prototype’s `Object.extend()`\n\n[Prototype](https://en.wikipedia.org/wiki/Prototype_JavaScript_Framework)\
    \ is a JavaScript framework that was created by Sam Stephenson in February 2005\
    \ as part of the foundation for Ajax support in Ruby on Rails.\n\n[Prototype’s\
    \ `Object.extend(destination, source)`](http://api.prototypejs.org/language/Object/extend/)\
    \ copies all enumerable own and inherited properties of `source` into own properties\
    \ of `destination`. [It is implemented](https://github.com/prototypejs/prototype/blob/5fddd3e/src/prototype/lang/object.js#L88)\
    \ as follows:\n\n```\nfunction extend(destination, source) {\n  for (var property\
    \ in source)\n    destination[property] = source[property];\n  return destination;\n\
    }\n```\n\nIf we use `Object.extend()` with an object, we can see that it copies\
    \ inherited properties into own properties and ignores non-enumerable properties\
    \ (it also ignores symbol-keyed properties). All of this is due to how `for-in`\
    \ works.\n\n```\nconst proto = Object.defineProperties({}, {\n  enumProtoProp:\
    \ {\n    value: 1,\n    enumerable: true,\n  },\n  nonEnumProtoProp: {\n    value:\
    \ 2,\n    enumerable: false,\n  },\n});\nconst obj = Object.create(proto, {\n\
    \  enumObjProp: {\n    value: 3,\n    enumerable: true,\n  },\n  nonEnumObjProp:\
    \ {\n    value: 4,\n    enumerable: false,\n  },\n});\n\nassert.deepEqual(\n \
    \ extend({}, obj),\n  {enumObjProp: 3, enumProtoProp: 1});\n```\n"
