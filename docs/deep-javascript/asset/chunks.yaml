    \    *   11.4.1 对象字面量的属性通过定义添加\n    *   11.4.2 赋值运算符 `=` 始终使用赋值\n    *   11.4.3 公共类字段通过定义添加\n\
    *   11.5 本章的进一步阅读和资料来源\n\n* * *\n\n创建或更改对象 `obj` 的属性 `prop` 有两种方式：\n\n*   *赋值*：`obj.prop\
    \ = true`\n*   *定义*：`Object.defineProperty(obj, '', {value: true})`\n\n本章将解释它们的工作原理。\n\
    \n![](img/file0.svg)  **所需知识：属性特性和属性描述符**\n\n阅读本章前，你应该熟悉属性特性和属性描述符。如果不熟悉，请查看 §9\
    \ “属性特性：简介”。\n\n## 11.1 赋值 vs. 定义\n\n### 11.1.1 赋值\n\n我们使用赋值运算符 `=` 将值 `value`\
    \ 赋给对象 `obj` 的属性 `.prop`：\n\n```\n[](#cb202-1)obj.prop = value\n```\n\n该运算符的工作方式取决于\
    \ `.prop` 的外观：\n\n*   **更改属性**：如果存在自有数据属性 `.prop`，赋值会将其值更改为 `value`。\n*   **调用\
    \ setter**：如果 `.prop` 存在自有或继承的 setter，赋值会调用该 setter。\n*   **创建属性**：如果 `.prop`\
    \ 没有自有数据属性，也没有自有或继承的 setter，赋值会创建一个新的自有数据属性。\n\n也就是说，赋值的主要目的是进行更改。这就是它支持 setter\
    \ 的原因。\n\n### 11.1.2 定义\n\n要定义对象 `obj` 的键为 `propKey` 的属性，我们使用如下方法：\n\n```\n[](#cb203-1)Object.defineProperty(obj,\
    \ propKey, propDesc)\n```\n\n该方法的工作方式取决于属性的外观：\n\n*   **更改属性**：如果存在键为 `propKey`\
    \ 的自有属性，定义会（如果可能）按照属性描述符 `propDesc` 指定的方式更改其属性特性。\n*   **创建属性**：否则，定义会（如果可能）创建一个具有\
    \ `propDesc` 指定特性的自有属性。\n\n也就是说，定义的主要目的是创建自有属性（即使存在继承的 setter，它也会忽略）以及更改属性特性。\n\
    \n## 11.2 理论中的赋值与定义（可选）\n\n![](img/file2.svg)  **ECMAScript 规范中的属性描述符**\n\n在规范操作中，属性描述符不是\
    \ JavaScript 对象，而是 [*记录*](https://tc39.es/ecma262/#sec-list-and-record-specification-type)，这是一种规范内部的数据结构，包含*字段*。字段的键用双括号表示。例如，`Desc.[[Configurable]]`\
    \ 访问 `Desc` 的字段 `.[[Configurable]]`。在与外部世界交互时，这些记录会与 JavaScript 对象相互转换。\n\n###\
    \ 11.2.1 为属性赋值\n\n为属性赋值的实际工作由 ECMAScript 规范中的 [以下操作](https://tc39.es/ecma262/#sec-ordinarysetwithowndescriptor)\
    \ 处理：\n\n```\nOrdinarySetWithOwnDescriptor(O, P, V, Receiver, ownDesc)\n```\n\n\
    参数如下：\n\n*   `O` 是当前正在访问的对象。\n*   `P` 是我们正在赋值的属性的键。\n*   `V` 是我们赋值的值。\n*   `Receiver`\
    \ 是赋值开始的对象。\n*   `ownDesc` 是 `O[P]` 的描述符，如果该属性不存在则为 `null`。\n\n返回值是一个布尔值，指示操作是否成功。如\
    \ 本章后面 所述，严格模式下的赋值会在 `OrdinarySetWithOwnDescriptor()` 失败时抛出 `TypeError`。\n\n以下是该算法的高级摘要：\n\
    \n*   它遍历 `Receiver` 的原型链，直到找到键为 `P` 的属性。遍历通过递归调用 `OrdinarySetWithOwnDescriptor()`\
    \ 完成。在递归过程中，`O` 会改变并指向当前正在访问的对象，但 `Receiver` 保持不变。\n*   根据遍历结果，会在 `Receiver`（递归开始的地方）中创建一个自有属性，或者发生其他情况。\n\
    \n更详细地说，该算法的工作方式如下：\n\n*   如果 `ownDesc` 是 `undefined`，则我们尚未找到键为 `P` 的属性：\n   \
    \ *   如果 `O` 有原型 `parent`，则返回 `parent.[[Set]](P, V, Receiver)`。这将继续我们的搜索。该方法调用通常最终会递归调用\
    \ `OrdinarySetWithOwnDescriptor()`。\n    *   否则，我们对 `P` 的搜索失败，并按如下方式设置 `ownDesc`：\n\
    \        ```\n        {\n          [[Value]]: undefined, [[Writable]]: true,\n\
    \          [[Enumerable]]: true, [[Configurable]]: true\n        }\n        ```\n\
    \        使用这个 `ownDesc`，下一个 `if` 语句将在 `Receiver` 中创建一个自有属性。\n\n*   如果 `ownDesc`\
    \ 指定了一个数据属性，则我们找到了一个属性：\n    *   如果 `ownDesc.[[Writable]]` 为 `false`，则返回 `false`。这意味着任何不可写的属性\
    \ `P`（自有或继承的！）都会阻止赋值。\n    *   令 `existingDescriptor` 为 `Receiver.[[GetOwnProperty]](P)`。即，检索赋值开始处的属性描述符。现在我们有了：\n\
    \        *   当前对象 `O` 和当前属性描述符 `ownDesc`。\n        *   原始对象 `Receiver` 和原始属性描述符\
    \ `existingDescriptor`。\n    *   如果 `existingDescriptor` 不是 `undefined`：\n   \
    \     *   （如果执行到这里，说明我们仍处于原型链的开头——我们仅在 `Receiver` 没有属性 `P` 时才递归。）\n        * \
    \  以下两个 `if` 条件不应为 `true`，因为 `ownDesc` 和 `existingDesc` 应该相等：\n            * \
    \  如果 `existingDescriptor` 指定了一个访问器，则返回 `false`。\n            *   如果 `existingDescriptor.[[Writable]]`\
    \ 为 `false`，则返回 `false`。\n        *   返回 `Receiver.[[DefineOwnProperty]](P, {\
    \ [[Value]]: V })`。这个内部方法执行定义，我们用它来更改属性 `Receiver[P]` 的值。定义算法将在下一小节中描述。\n    *\
    \   否则：\n        *   （如果执行到这里，说明 `Receiver` 没有键为 `P` 的自有属性。）\n        *   返回 `CreateDataProperty(Receiver,\
    \ P, V)`。（[此操作](https://tc39.es/ecma262/#sec-createdataproperty) 在其第一个参数中创建一个自有数据属性。）\n\
    \n*   （如果执行到这里，说明 `ownDesc` 描述了一个自有或继承的访问器属性。）\n*   令 `setter` 为 `ownDesc.[[Set]]`。\n\
    \n"
- fmt: "\n*   If `setter` is `undefined`, return `false`.\n\n*   Perform `Call(setter,\
    \ Receiver, «V»)`. [`Call()`](https://tc39.es/ecma262/#sec-call) invokes the function\
    \ object `setter` with `this` set to `Receiver` and the single parameter `V` (French\
    \ quotes `«»` are used for lists in the specification).\n\n*   Return `true`.\n\
    \n#### 11.2.1.1 How do we get from an assignment to `OrdinarySetWithOwnDescriptor()`?\n\
    \nEvaluating an assignment without destructuring involves the following steps:\n\
    \n*   In the spec, evaluation starts in [the section on the runtime semantics\
    \ of `AssignmentExpression`](https://tc39.es/ecma262/#sec-assignment-operators-runtime-semantics-evaluation).\
    \ This section handles providing names for anonymous functions, destructuring,\
    \ and more.\n\n*   If there is no destructuring pattern, then [`PutValue()`](https://tc39.es/ecma262/#sec-putvalue)\
    \ is used to make the assignment.\n\n*   For property assignments, `PutValue()`\
    \ invokes the internal method `.[[Set]]()`.\n\n*   For ordinary objects, [`.[[Set]]()`](https://tc39.es/ecma262/#sec-ordinary-object-internal-methods-and-internal-slots-set-p-v-receiver)\
    \ calls `OrdinarySet()` (which calls `OrdinarySetWithOwnDescriptor()`) and returns\
    \ the result.\n\nNotably, `PutValue()` throws a `TypeError` in strict mode if\
    \ the result of `.[[Set]]()` is `false`.\n\n### 11.2.2 Defining a property\n\n\
    The actual work of defining a property is handled via [the following operation](https://tc39.es/ecma262/#sec-validateandapplypropertydescriptor)\
    \ in the ECMAScript specification:\n\n```\nValidateAndApplyPropertyDescriptor(O,\
    \ P, extensible, Desc, current)\n```\n\nThe parameters are:\n\n*   The object\
    \ `O` where we want to define a property. There is a special validation-only mode\
    \ where `O` is `undefined`. We are ignoring this mode here.\n\n*   The property\
    \ key `P` of the property we want to define.\n\n*   `extensible` indicates if\
    \ `O` is extensible.\n\n*   `Desc` is a property descriptor specifying the attributes\
    \ we want the property to have.\n\n*   `current` contains the property descriptor\
    \ of an own property `O[P]` if it exists. Otherwise, `current` is `undefined`.\n\
    \nThe result of the operation is a boolean that indicates if it succeeded. Failure\
    \ can have different consequences. Some callers ignore the result. Others, such\
    \ as `Object.defineProperty()`, throw an exception if the result is `false`.\n\
    \nThis is a summary of the algorithm:\n\n*   If `current` is `undefined`, then\
    \ property `P` does not currently exist and must be created.\n\n    *   If `extensible`\
    \ is `false`, return `false` indicating that the property could not be added.\n\
    \n    *   Otherwise, check `Desc` and create either a data property or an accessor\
    \ property.\n\n    *   Return `true`.\n\n*   If `Desc` doesn’t have any fields,\
    \ return `true` indicating that the operation succeeded (because no changes had\
    \ to be made).\n\n*   If `current.[[Configurable]]` is `false`:\n\n    *   (`Desc`\
    \ is not allowed to change attributes other than `value`.)\n\n    *   If `Desc.[[Configurable]]`\
    \ exists, it must have the same value as `current.[[Configurable]]`. If not, return\
    \ `false`.\n\n    *   Same check: `Desc.[[Enumerable]]`\n\n*   Next, we *validate*\
    \ the property descriptor `Desc`: Can the attributes described by `current` be\
    \ changed to the values specified by `Desc`? If not, return `false`. If yes, go\
    \ on.\n\n    *   If the descriptor is *generic* (with no attributes specific to\
    \ data properties or accessor properties), then validation is successful and we\
    \ can move on.\n\n    *   Else if one descriptor specifies a data property and\
    \ the other an accessor property:\n\n        *   The current property must be\
    \ configurable (otherwise its attributes can’t be changed as necessary). If not,\
    \ `false` is returned.\n\n        *   Change the current property from a data\
    \ property to an accessor property or vice versa. When doing so, the values of\
    \ `.[[Configurable]]` and `.[[Enumerable]]` are preserved, all other attributes\
    \ get [default values](#ch010.xhtml_property-attributes) (`undefined` for object-valued\
    \ attributes, `false` for boolean-valued attributes).\n\n    *   Else if both\
    \ descriptors specify data properties:\n\n        *   If both `current.[[Configurable]]`\
    \ and `current.[[Writable]]` are `false`, then no changes are allowed and `Desc`\
    \ and `current` must specify the same attributes:\n\n            *   (Due to `current.[[Configurable]]`\
    \ being `false`, `Desc.[[Configurable]]` and `Desc.[[Enumerable]]` were already\
    \ checked previously and have the correct values.)\n\n            *   If `Desc.[[Writable]]`\
    \ exists and is `true`, then return `false`.\n\n            *   If `Desc.[[Value]]`\
    \ exists and does not have the same value as `current.[[Value]]`, then return\
    \ `false`.\n\n            *   There is nothing more to do. Return `true` indicating\
    \ that the algorithm succeeded.\n\n            *   (Note that normally, we can’t\
    \ change any attributes of a non-configurable property other than its value. The\
    \ one exception to this rule is that we can always go from writable to non-writable.\
    \ This algorithm handles this exception correctly.)\n\n    *   Else (both descriptors\
    \ specify accessor properties):\n\n        *   If `current.[[Configurable]]` is\
    \ `false`, then no changes are allowed and `Desc` and `current` must specify the\
    \ same attributes:\n\n            *   (Due to `current.[[Configurable]]` being\
    \ `false`, `Desc.[[Configurable]]` and `Desc.[[Enumerable]]` were already checked\
    \ previously and have the correct values.)\n\n            *   If `Desc.[[Set]]`\
    \ exists, it must have the same value as `current.[[Set]]`. If not, return `false`.\n\
    \n            *   Same check: `Desc.[[Get]]`\n\n            *   There is nothing\
    \ more to do. Return `true` indicating that the algorithm succeeded.\n\n*   Set\
    \ the attributes of the property with key `P` to the values specified by `Desc`.\
    \ Due to validation, we can be sure that all of the changes are allowed.\n\n*\
    \   Return `true`.\n\n## 11.3 Definition and assignment in practice\n\nThis section\
    \ describes some consequences of how property definition and assignment work.\n\
    \n### 11.3.1 Only definition allows us to create a property with arbitrary attributes\n\
    \nIf we create an own property via assignment, it always creates properties whose\
    \ attributes `writable`, `enumerable`, and `configurable` are all `true`.\n\n\
    ```\n[](#cb207-1)const obj = {};\n[](#cb207-2)obj.dataProp = 'abc';\n[](#cb207-3)assert.deepEqual(\n\
