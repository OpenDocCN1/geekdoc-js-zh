  trans: "\n\n```\nconst original = {a: 1, b: {c: 2, d: {e: 3}}};\nconst copy = deepCopy(original);\n\
    \n// Are copy and original deeply equal?\nassert.deepEqual(copy, original);\n\n\
    // Did we really copy all levels\n// (equal content, but different objects)?\n\
    assert.ok(copy     !== original);\nassert.ok(copy.b   !== original.b);\nassert.ok(copy.b.d\
    \ !== original.b.d);\n```\n\n请注意，`deepCopy()` 只解决了展开操作的一个问题：浅拷贝。其他问题依然存在：原型不会被拷贝，特殊对象只能部分拷贝，不可枚举属性被忽略，大多数属性特性被忽略。\n\
    \n完全通用地实现拷贝通常是不可能的：并非所有数据都是树形结构，有时我们不想拷贝所有属性等。\n\n#### 6.3.3.1 更简洁的 `deepCopy()`\
    \ 版本\n\n如果我们使用 `.map()` 和 `Object.fromEntries()`，可以使之前的 `deepCopy()` 实现更加简洁：\n\
    \n```\nfunction deepCopy(original) {\n  if (Array.isArray(original)) {\n    return\
    \ original.map(elem => deepCopy(elem));\n  } else if (typeof original === 'object'\
    \ && original !== null) {\n    return Object.fromEntries(\n      Object.entries(original)\n\
    \        .map(([k, v]) => [k, deepCopy(v)]));\n  } else {\n    // 原始值：原子性，无需拷贝\n\
    \    return original;\n  }\n}\n```\n\n## 6.4 延伸阅读\n\n*   §14 “拷贝类实例：`.clone()`\
    \ 与拷贝构造函数” 解释了基于类的拷贝模式。\n\n*   [“展开到对象字面量”章节](https://exploringjs.com/impatient-js/ch_single-objects.html#spreading-into-object-literals)\
    \ 出自《JavaScript 快速入门》\n\n*   [“展开到数组字面量”章节](https://exploringjs.com/impatient-js/ch_arrays.html#spreading-into-array-literals)\
    \ 出自《JavaScript 快速入门》\n\n*   [“原型链”章节](https://exploringjs.com/impatient-js/ch_proto-chains-classes.html#prototype-chains)\
    \ 出自《JavaScript 快速入门》\n\n# 7 破坏性更新与非破坏性更新数据\n\n* * *\n\n*   7.1 示例：破坏性更新与非破坏性更新对象\n\
    \n*   7.2 示例：破坏性更新与非破坏性更新数组\n\n*   7.3 手动深度更新\n\n*   7.4 实现通用深度更新\n\n* * *\n\n\
    在本章中，我们将学习两种不同的数据更新方式：\n\n*   **破坏性更新**会改变数据本身，使其达到所需形式。\n*   **非破坏性更新**会创建数据的副本，并使副本达到所需形式。\n\
    \n后一种方式类似于先复制再破坏性修改，但它是同时进行的。\n\n## 7.1 示例：破坏性更新与非破坏性更新对象\n\n以下代码展示了一个破坏性更新对象属性的函数，并在一个对象上使用它。\n\
    \n```\nfunction setPropertyDestructively(obj, key, value) {\n  obj[key] = value;\n\
    \  return obj;\n}\n\nconst obj = {city: 'Berlin', country: 'Germany'};\nsetPropertyDestructively(obj,\
    \ 'city', 'Munich');\nassert.deepEqual(obj, {city: 'Munich', country: 'Germany'});\n\
    ```\n\n以下代码演示了对象的非破坏性更新：\n\n```\nfunction setPropertyNonDestructively(obj, key,\
    \ value) {\n  const updatedObj = {};\n  for (const [k, v] of Object.entries(obj))\
    \ {\n    updatedObj[k] = (k === key ? value : v);\n  }\n  return updatedObj;\n\
    }\n\nconst obj = {city: 'Berlin', country: 'Germany'};\nconst updatedObj = setPropertyNonDestructively(obj,\
    \ 'city', 'Munich');\n\n// 我们创建了一个更新后的对象：\nassert.deepEqual(updatedObj, {city:\
    \ 'Munich', country: 'Germany'});\n\n// 但原始对象并未改变：\nassert.deepEqual(obj, {city:\
    \ 'Berlin', country: 'Germany'});\n```\n\n使用展开操作可以使 `setPropertyNonDestructively()`\
    \ 更加简洁：\n\n```\nfunction setPropertyNonDestructively(obj, key, value) {\n  return\
    \ {...obj, [key]: value};\n}\n```\n\n`setPropertyNonDestructively()` 的两个版本都是**浅层更新**：它们只改变对象的顶层。\n\
    \n## 7.2 示例：破坏性更新与非破坏性更新数组\n\n以下代码展示了一个破坏性更新数组元素的函数，并在一个数组上使用它。\n\n```\nfunction\
    \ setElementDestructively(arr, index, value) {\n  arr[index] = value;\n}\n\nconst\
    \ arr = ['a', 'b', 'c', 'd', 'e'];\nsetElementDestructively(arr, 2, 'x');\nassert.deepEqual(arr,\
    \ ['a', 'b', 'x', 'd', 'e']);\n```\n\n以下代码演示了数组的非破坏性更新：\n\n```\nfunction setElementNonDestructively(arr,\
    \ index, value) {\n  const updatedArr = [];\n  for (const [i, v] of arr.entries())\
    \ {\n    updatedArr.push(i === index ? value : v);\n  }\n  return updatedArr;\n\
    }\n\nconst arr = ['a', 'b', 'c', 'd', 'e'];\nconst updatedArr = setElementNonDestructively(arr,\
    \ 2, 'x');\nassert.deepEqual(updatedArr, ['a', 'b', 'x', 'd', 'e']);\nassert.deepEqual(arr,\
    \ ['a', 'b', 'c', 'd', 'e']);\n```\n\n使用 `.slice()` 和展开操作可以使 `setElementNonDestructively()`\
    \ 更加简洁：\n\n```\nfunction setElementNonDestructively(arr, index, value) {\n  return\
    \ [\n    ...arr.slice(0, index), value, ...arr.slice(index+1)];\n}\n```\n\n`setElementNonDestructively()`\
    \ 的两个版本都是**浅层更新**：它们只改变数组的顶层。\n\n## 7.3 手动深度更新\n\n到目前为止，我们只进行了浅层数据更新。现在来应对深度更新。以下代码展示了如何手动进行深度更新。我们正在更改姓名和雇主。\n\
    \n```\nconst original = {name: 'Jane', work: {employer: 'Acme'}};\nconst updatedOriginal\
    \ = {\n  ...original,\n  name: 'John',\n  work: {\n    ...original.work,\n   \
    \ employer: 'Spectre'\n  },\n};\n\nassert.deepEqual(\n  original, {name: 'Jane',\
    \ work: {employer: 'Acme'}});\nassert.deepEqual(\n  updatedOriginal, {name: 'John',\
    \ work: {employer: 'Spectre'}});\n```\n\n## 7.4 实现通用深度更新\n\n以下函数实现了通用的深度更新。\n\n"
