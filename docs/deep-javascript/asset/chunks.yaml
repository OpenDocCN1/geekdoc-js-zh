  trans: "\n在 JavaScript 中，常用的内省操作名称较短，而不常用的操作名称较长。忽略不可枚举属性是常态，因此执行该操作的操作名称较短，而不执行该操作的操作名称较长：\n\
    \n*   `Object.keys()` 忽略不可枚举属性。\n*   `Object.getOwnPropertyNames()` 列出所有自身属性的字符串键。\n\
    \n然而，`Reflect` 方法（例如 `Reflect.ownKeys()`）偏离了这一规则，因为 `Reflect` 提供了更“元”且与代理相关的操作。\n\
    \n此外，还做出了以下区分（自引入符号的 ES6 起）：\n\n*   *属性键* 是字符串或符号。\n*   *属性名* 是字符串类型的属性键。\n* \
    \  *属性符号* 是符号类型的属性键。\n\n因此，`Object.keys()` 现在更好的名称应该是 `Object.names()`。\n\n##\
    \ 12.2 预定义属性和创建属性的可枚举性\n\n在本节中，我们将 `Object.getOwnPropertyDescriptor()` 缩写如下：\n\
    \n```\nconst desc = Object.getOwnPropertyDescriptor.bind(Object);\n```\n\n大多数数据属性创建时具有以下属性描述符：\n\
    \n```\n{\n  writable: true,\n  enumerable: false,\n  configurable: true,\n}\n\
    ```\n\n这包括：\n\n*   赋值\n*   对象字面量\n*   公共类字段\n*   `Object.fromEntries()`\n\n最重要的不可枚举属性是：\n\
    \n*   内置类的原型属性\n\n    ```\n    > desc(Object.prototype, 'toString').enumerable\n\
    \    false\n    ```\n\n*   通过用户定义类创建的原型属性\n\n    ```\n    > desc(class {foo()\
    \ {}}.prototype, 'foo').enumerable\n    false\n    ```\n\n*   数组的 `.length` 属性：\n\
    \n    ```\n    > Object.getOwnPropertyDescriptor([], 'length')\n    { value: 0,\
    \ writable: true, enumerable: false, configurable: false }\n    ```\n\n*   字符串的\
    \ `.length` 属性（注意，原始值的所有属性都是只读的）：\n\n    ```\n    > Object.getOwnPropertyDescriptor('',\
    \ 'length')\n    { value: 0, writable: false, enumerable: false, configurable:\
    \ false }\n    ```\n\n接下来我们将探讨可枚举性的使用场景，这将告诉我们为什么某些属性是可枚举的，而其他属性则不是。\n\n## 12.3 可枚举性的使用场景\n\
    \n可枚举性是一个不一致的特性。它确实有使用场景，但总是存在某种注意事项。在本节中，我们将介绍这些使用场景及其注意事项。\n\n### 12.3.1 使用场景：从\
    \ `for-in` 循环中隐藏属性\n\n`for-in` 循环遍历对象的所有可枚举字符串键属性，包括自身属性和继承属性。因此，属性 `enumerable`\
    \ 用于隐藏不应被遍历的属性。这就是在 ECMAScript 1 中引入可枚举性的原因。\n\n一般来说，最好避免使用 `for-in`。接下来的两个小节将解释原因。以下函数将帮助我们演示\
    \ `for-in` 的工作原理。\n\n```\nfunction listPropertiesViaForIn(obj) {\n  const result\
    \ = [];\n  for (const key in obj) {\n    result.push(key);\n  }\n  return result;\n\
    }\n```\n\n#### 12.3.1.1 对对象使用 `for-in` 的注意事项\n\n`for-in` 遍历所有属性，包括继承的属性：\n\n```\n\
    const proto = {enumerableProtoProp: 1};\nconst obj = {\n  __proto__: proto,\n\
    \  enumerableObjProp: 2,\n};\nassert.deepEqual(\n  listPropertiesViaForIn(obj),\n\
    \  ['enumerableObjProp', 'enumerableProtoProp']);\n```\n\n对于普通对象，`for-in` 不会看到继承的方法（如\
    \ `Object.prototype.toString()`），因为它们都是不可枚举的：\n\n```\nconst obj = {};\nassert.deepEqual(\n\
    \  listPropertiesViaForIn(obj),\n  []);\n```\n\n在用户定义的类中，所有继承的属性也是不可枚举的，因此被忽略：\n\
    \n```\nclass Person {\n  constructor(first, last) {\n    this.first = first;\n\
    \    this.last = last;\n  }\n  getName() {\n    return this.first + ' ' + this.last;\n\
    \  }\n}\nconst jane = new Person('Jane', 'Doe');\nassert.deepEqual(\n  listPropertiesViaForIn(jane),\n\
    \  ['first', 'last']);\n```\n\n**结论：** 在对象中，`for-in` 会考虑继承属性，而我们通常希望忽略这些属性。此时，最好将\
    \ `for-of` 循环与 `Object.keys()`、`Object.entries()` 等结合使用。\n\n#### 12.3.1.2 对数组使用\
    \ `for-in` 的注意事项\n\n数组和字符串的自身属性 `.length` 是不可枚举的，因此 `for-in` 会忽略它：\n\n```\n> listPropertiesViaForIn(['a',\
    \ 'b'])\n[ '0', '1' ]\n> listPropertiesViaForIn('ab')\n[ '0', '1' ]\n```\n\n然而，通常使用\
    \ `for-in` 遍历数组索引是不安全的，因为它会考虑所有继承属性和非索引的自身属性。以下示例演示了当数组具有非索引自身属性时会发生什么：\n\n```\n\
    const arr1 = ['a', 'b'];\nassert.deepEqual(\n  listPropertiesViaForIn(arr1),\n\
    \  ['0', '1']);\n\nconst arr2 = ['a', 'b'];\narr2.nonIndexProp = 'yes';\nassert.deepEqual(\n\
    \  listPropertiesViaForIn(arr2),\n  ['0', '1', 'nonIndexProp']);\n```\n\n**结论：**\
    \ 不应使用 `for-in` 遍历数组的索引，因为它会同时考虑索引属性和非索引属性：\n\n*   如果你对数组的键感兴趣，请使用数组方法 `.keys()`：\n\
    \n    ```\n    > [...['a', 'b', 'c'].keys()]\n    [ 0, 1, 2 ]\n    ```\n\n*  \
    \ 如果你想遍历数组的元素，请使用 `for-of` 循环，它还有一个额外的好处，即也适用于其他可迭代数据结构。\n\n### 12.3.2 使用场景：标记属性为不可复制\n\
    \n通过将属性设置为不可枚举，我们可以将它们隐藏在某些复制操作之外。让我们先检查两个历史复制操作，然后再转向更现代的复制操作。\n\n#### 12.3.2.1 历史复制操作：Prototype\
    \ 的 `Object.extend()`\n\n[Prototype](https://en.wikipedia.org/wiki/Prototype_JavaScript_Framework)\
    \ 是一个 JavaScript 框架，由 Sam Stephenson 于 2005 年 2 月创建，作为 Ruby on Rails 中 Ajax 支持的基础部分。\n\
    \n[Prototype 的 `Object.extend(destination, source)`](http://api.prototypejs.org/language/Object/extend/)\
    \ 将 `source` 的所有可枚举自身属性和继承属性复制为 `destination` 的自身属性。[它的实现](https://github.com/prototypejs/prototype/blob/5fddd3e/src/prototype/lang/object.js#L88)如下：\n\
    \n```\nfunction extend(destination, source) {\n  for (var property in source)\n\
    \    destination[property] = source[property];\n  return destination;\n}\n```\n\
    \n如果我们对对象使用 `Object.extend()`，可以看到它将继承属性复制为自身属性，并忽略不可枚举属性（它也忽略符号键属性）。所有这些都源于 `for-in`\
    \ 的工作方式。\n\n```\nconst proto = Object.defineProperties({}, {\n  enumProtoProp:\
    \ {\n    value: 1,\n    enumerable: true,\n  },\n  nonEnumProtoProp: {\n    value:\
    \ 2,\n    enumerable: false,\n  },\n});\nconst obj = Object.create(proto, {\n\
    \  enumObjProp: {\n    value: 3,\n    enumerable: true,\n  },\n  nonEnumObjProp:\
    \ {\n    value: 4,\n    enumerable: false,\n  },\n});\n\nassert.deepEqual(\n \
    \ extend({}, obj),\n  {enumObjProp: 3, enumProtoProp: 1});\n```\n"
- fmt: "\n#### 12.3.2.2 Historical copying operation: jQuery’s `$.extend()`\n\n[jQuery’s\
    \ `$.extend(target, source1, source2, ···)`](https://api.jquery.com/jquery.extend/)\
    \ works similar to `Object.extend()`:\n\n*   It copies all enumerable own and\
    \ inherited properties of `source1` into own properties of `target`.\n*   Then\
    \ it does the same with `source2`.\n*   Etc.\n\n#### 12.3.2.3 The downsides of\
    \ enumerability-driven copying\n\nBasing copying on enumerability has several\
    \ downsides:\n\n*   While enumerability is useful for hiding inherited properties,\
    \ it is mainly used in this manner because we usually only want to copy own properties\
    \ into own properties. The same effect can be better achieved by ignoring inherited\
    \ properties.\n*   Which properties to copy often depends on the task at hand;\
    \ it rarely makes sense to have a single flag for all use cases. A better choice\
    \ is to provide a copying operation with a *predicate* (a callback that returns\
    \ a boolean) that tells it when to ignore properties.\n*   Enumerability conveniently\
    \ hides the own property `.length` of Arrays when copying. But that is an incredibly\
    \ rare exceptional case: a magic property that both influences sibling properties\
    \ and is influenced by them. If we implement this kind of magic ourselves, we\
    \ will use (inherited) getters and/or setters, not (own) data properties.\n\n\
    #### 12.3.2.4 `Object.assign()` ^([ES5])\n\nIn ES6, [`Object.assign(target, source_1,\
    \ source_2, ···)`](https://exploringjs.com/impatient-js/ch_single-objects.html#object.assign)\
    \ can be used to merge the sources into the target. All own enumerable properties\
    \ of the sources are considered (with either string keys or symbol keys). `Object.assign()`\
    \ uses a “get” operation to read a value from a source and a “set” operation to\
    \ write a value to the target.\n\nWith regard to enumerability, `Object.assign()`\
    \ continues the tradition of `Object.extend()` and `$.extend()`. [Quoting Yehuda\
    \ Katz](https://mail.mozilla.org/pipermail/es-discuss/2012-October/025934.html):\n\
    \n> `Object.assign` would pave the cowpath of all of the `extend()` APIs already\
    \ in circulation. We thought the precedent of not copying enumerable methods in\
    \ those cases was enough reason for `Object.assign` to have this behavior.\n\n\
    In other words: `Object.assign()` was created with an upgrade path from `$.extend()`\
    \ (and similar) in mind. Its approach is cleaner than `$.extend`’s because it\
    \ ignores inherited properties.\n\n#### 12.3.2.5 A rare example of non-enumerability\
    \ being useful when copying\n\nCases where non-enumerability helps are few. One\
    \ rare example is [a recent issue that the liberary `fs-extra` had](https://github.com/jprichardson/node-fs-extra/issues/577):\n\
    \n*   The built-in Node.js module `fs` has a property `.promises` that contains\
    \ an object with a Promise-based version of the `fs` API. At the time of the issue,\
    \ reading `.promise` led to the following warning being logged to the console:\n\
    \n    ```\n    ExperimentalWarning: The fs.promises API is experimental\n    ```\n\
    \n*   In addition to providing its own functionality, `fs-extra` also re-exports\
    \ everything that’s in `fs`. For CommonJS modules, that means copying all properties\
    \ of `fs` into the `module.exports` of `fs-extra` ([via `Object.assign()`](https://github.com/jprichardson/node-fs-extra/blob/master/lib/index.js)).\
    \ And when `fs-extra` did that, it triggered the warning. That was confusing because\
    \ it happened every time `fs-extra` was loaded.\n\n*   [A quick fix](https://github.com/nodejs/node/pull/20504)\
    \ was to make property `fs.promises` non-enumerable. Afterwards, `fs-extra` ignored\
    \ it.\n\n### 12.3.3 Marking properties as private\n\nIf we make a property non-enumerable,\
    \ it can’t by seen by `Object.keys()`, the `for-in` loop, etc., anymore. With\
    \ regard to those mechanisms, the property is private.\n\nHowever, there are several\
    \ problems with this approach:\n\n*   When copying an object, we normally want\
    \ to copy private properties. That clashes with making properties non-enumerable\
    \ that shouldn’t be copied (see previous section).\n*   The property isn’t really\
    \ private. Getting, setting and several other mechanisms make no distinction between\
    \ enumerable and non-enumerable properties.\n*   When working with code either\
    \ as source or interactively, we can’t immediately see whether a property is enumerable\
    \ or not. A naming convention (such as prefixing property names with an underscore)\
    \ is easier to discover.\n*   We can’t use enumerability to distinguish between\
    \ public and private methods because methods in prototypes are non-enumerable\
    \ by default.\n\n### 12.3.4 Hiding own properties from `JSON.stringify()`\n\n\
    `JSON.stringify()` does not include properties in its output that are non-enumerable.\
    \ We can therefore use enumerability to determine which own properties should\
    \ be exported to JSON. This use case is similar to the previous one, marking properties\
    \ as private. But it is also different because this is more about exporting and\
    \ slightly different considerations apply. For example: Can an object be completely\
    \ reconstructed from JSON?\n\nAs an alternative to enumerability, an object can\
    \ implement the method `.toJSON()` and `JSON.stringify()` stringifies whatever\
    \ that method returns, instead of the object itself. The next example demonstrates\
    \ how that works.\n\n```\n[](#cb247-1)class Point {\n[](#cb247-2)  static fromJSON(json)\
    \ {\n[](#cb247-3)    return new Point(json[0], json[1]);\n[](#cb247-4)  }\n[](#cb247-5)\
    \  constructor(x, y) {\n[](#cb247-6)    this.x = x;\n[](#cb247-7)    this.y =\
    \ y;\n[](#cb247-8)  }\n[](#cb247-9)  toJSON() {\n[](#cb247-10)    return [this.x,\
    \ this.y];\n[](#cb247-11)  }\n[](#cb247-12)}\n[](#cb247-13)assert.equal(\n[](#cb247-14)\
    \  JSON.stringify(new Point(8, -3)),\n[](#cb247-15)  '[8,-3]'\n[](#cb247-16));\n\
    ```\n\nI find `toJSON()` cleaner than enumerability. It also gives us more freedom\
    \ w.r.t. what the storage format should look like.\n\n## 12.4 Conclusion\n\nWe\
    \ have seen that almost all applications for non-enumerability are work-arounds\
    \ that now have other and better solutions.\n\nFor our own code, we can usually\
    \ pretend that enumerability doesn’t exist:\n\n*   Creating properties via object\
    \ literals and assignment always creates enumerable properties.\n*   Prototype\
    \ properties created via classes are always non-enumerable.\n\nThat is, we automatically\
    \ follow best practices.\n\n# 13 Techniques for instantiating classes\n\n* * *\n\
    \n*   13.1 [The problem: initializing a property asynchronously](#ch014.xhtml_the-problem-initializing-a-property-asynchronously)\n\
    *   13.2 [Solution: Promise-based constructor](#ch014.xhtml_solution-promise-based-constructor)\n\
    \    *   13.2.1 [Using an immediately-invoked asynchronous arrow function](#ch014.xhtml_using-an-immediately-invoked-asynchronous-arrow-function)\n\
    *   13.3 [Solution: static factory method](#ch014.xhtml_solution-static-factory-method)\n\
    \    *   13.3.1 [Improvement: private constructor via secret token](#ch014.xhtml_improvement-private-constructor-via-secret-token)\n\
    \    *   13.3.2 [Improvement: constructor throws, factory method borrows the class\
    \ prototype](#ch014.xhtml_improvement-constructor-throws-factory-method-borrows-the-class-prototype)\n\
    \    *   13.3.3 [Improvement: instances are inactive by default, activated by\
    \ factory method](#ch014.xhtml_improvement-instances-are-inactive-by-default-activated-by-factory-method)\n\
    \    *   13.3.4 [Variant: separate factory function](#ch014.xhtml_variant-separate-factory-function)\n\
    *   13.4 [Subclassing a Promise-based constructor (optional)](#ch014.xhtml_subclassing-a-promise-based-constructor-optional)\n\
    *   13.5 [Conclusion](#ch014.xhtml_conclusion-1)\n*   13.6 [Further reading](#ch014.xhtml_further-reading-3)\n\
    \n* * *\n\nIn this chapter, we examine several approaches for creating instances\
    \ of classes: Constructors, factory functions, etc. We do so by solving one concrete\
    \ problem several times. The focus of this chapter is on classes, which is why\
    \ alternatives to classes are ignored.\n\n## 13.1 The problem: initializing a\
    \ property asynchronously\n"
