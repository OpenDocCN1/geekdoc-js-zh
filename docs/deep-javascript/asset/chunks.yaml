    \ new Error();\n  }\n}\n```\n\nThe previous code snippet uses the following helper\
    \ function:\n\n```\nfunction addToTaskQueue(task) {\n  setTimeout(task, 0);\n\
    }\n```\n\nPromises must always settle asynchronously. That’s why we don’t directly\
