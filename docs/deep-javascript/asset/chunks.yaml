    \    if (typeof onFulfilled === 'function') {\n      onFulfilled(this._promiseResult);\n\
    \    }\n  };\n  const rejectionTask = () => {\n    if (typeof onRejected === 'function')\
    \ {\n      onRejected(this._promiseResult);\n    }\n  };\n  switch (this._promiseState)\
    \ {\n    case 'pending':\n      this._fulfillmentTasks.push(fulfillmentTask);\n\
