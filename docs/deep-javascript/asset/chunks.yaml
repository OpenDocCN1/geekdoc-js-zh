    \   *   2.4.2 `ToString()` 及相关操作\n\n    *   2.4.3 `ToPropertyKey()`\n\n    * \
    \  2.4.4 `ToNumeric()` 及相关操作\n\n*   2.5 执行强制转换的操作\n\n    *   2.5.1 加法运算符（`+`）\n\
    \n    *   2.5.2 抽象相等比较（`==`）\n\n*   2.6 术语表：与类型转换相关的术语\n\n* * *\n\n在本章中，我们将探讨\
    \ JavaScript 中*类型强制转换*的作用。我们将相对深入地研究这个主题，例如，了解 ECMAScript 规范如何处理强制转换。\n\n## 2.1 什么是类型强制转换？\n\
    \n每个操作（函数、运算符等）都期望其参数具有特定类型。如果某个值的参数类型不正确，例如函数通常有三种常见选择：\n\n1.  函数可以抛出异常：\n\n\
    ```\nfunction multiply(x, y) {\n  if (typeof x !== 'number' || typeof y !== 'number')\
    \ {\n    throw new TypeError();\n  }\n  // ···\n}\n```\n\n2.  函数可以返回错误值：\n\n```\n\
    function multiply(x, y) {\n  if (typeof x !== 'number' || typeof y !== 'number')\
    \ {\n    return NaN;\n  }\n  // ···\n}\n```\n\n3.  函数可以将其参数转换为有用的值：\n\n```\nfunction\
    \ multiply(x, y) {\n  if (typeof x !== 'number') {\n    x = Number(x);\n  }\n\
    \  if (typeof y !== 'number') {\n    y = Number(y);\n  }\n  // ···\n}\n```\n\n\
    在 (3) 中，操作执行了隐式类型转换。这被称为*类型强制转换*。\n\nJavaScript 最初没有异常，这就是为什么它的大多数操作都使用强制转换和错误值：\n\
    \n```\n// 强制转换\nassert.equal(3 * true, 3);\n\n// 错误值\nassert.equal(1 / 0, Infinity);\n\
    assert.equal(Number('xyz'), NaN);\n```\n\n然而，也存在一些情况（尤其是涉及新特性时），如果参数类型不正确，它会抛出异常：\n\
    \n*   访问 `null` 或 `undefined` 的属性：\n\n    ```\n    > undefined.prop\n    TypeError:\
    \ Cannot read property 'prop' of undefined\n    > null.prop\n    TypeError: Cannot\
    \ read property 'prop' of null\n    > 'prop' in null\n    TypeError: Cannot use\
    \ 'in' operator to search for 'prop' in null\n    ```\n\n*   使用符号：\n\n    ```\n\
    \    > 6 / Symbol()\n    TypeError: Cannot convert a Symbol value to a number\n\
    \    ```\n\n*   混合 bigint 和 number：\n\n    ```\n    > 6 / 3n\n    TypeError: Cannot\
    \ mix BigInt and other types\n    ```\n\n*   对不支持该操作的值进行 new 调用或函数调用：\n\n    ```\n\
    \    > 123()\n    TypeError: 123 is not a function\n    > (class {})()\n    TypeError:\
    \ Class constructor  cannot be invoked without 'new'\n\n    > new 123\n    TypeError:\
    \ 123 is not a constructor\n    > new (() => {})\n    TypeError: (intermediate\
    \ value) is not a constructor\n    ```\n\n*   更改只读属性（仅在严格模式下抛出）：\n\n    ```\n\
    \    > 'abc'.length = 1\n    TypeError: Cannot assign to read only property 'length'\n\
    \    > Object.freeze({prop:3}).prop = 1\n    TypeError: Cannot assign to read\
    \ only property 'prop'\n    ```\n\n### 2.1.1 处理类型强制转换\n\n处理强制转换的两种常见方式是：\n\n*\
    \   调用者可以显式转换值，使其具有正确的类型。例如，在以下交互中，我们想要将两个编码为字符串的数字相乘：\n\n    ```\n    let x =\
    \ '3';\n    let y = '2';\n    assert.equal(Number(x) * Number(y), 6);\n    ```\n\
    \n*   调用者可以让操作自行进行转换：\n\n    ```\n    let x = '3';\n    let y = '2';\n    assert.equal(x\
    \ * y, 6);\n    ```\n\n我通常更喜欢前者，因为它明确了我的意图：我期望 `x` 和 `y` 不是数字，但想要将两个数字相乘。\n\n\
    ## 2.2 ECMAScript 规范中帮助实现强制转换的操作\n\n以下各节描述了 ECMAScript 规范用于将实际参数转换为预期类型的最重要的内部函数。\n\
    \n例如，在 TypeScript 中，我们会这样写：\n\n```\nfunction isNaN(number: number) {\n  // ···\n\
    }\n```\n\n在规范中，这看起来[如下所示](https://tc39.es/ecma262/#sec-multiplicative-operators-runtime-semantics-evaluation)（翻译成\
    \ JavaScript，以便更容易理解）：\n\n```\nfunction isNaN(number) {\n  let num = ToNumber(number);\n\
    \  // ···\n}\n```\n\n### 2.2.1 转换为原始类型和对象\n\n每当期望原始类型或对象时，会使用以下转换函数：\n\n*   `ToBoolean()`\n\
    \n*   `ToNumber()`\n\n*   `ToBigInt()`\n\n*   `ToString()`\n\n*   `ToObject()`\n\
    \n这些内部函数在 JavaScript 中有非常相似的对应物：\n\n```\n> Boolean(0)\nfalse\n> Boolean(1)\ntrue\n\
    \n> Number('123')\n123\n```\n"
