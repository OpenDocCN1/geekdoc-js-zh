  trans: "\n\n*   `rejectionTask` 的工作方式不同。以下是拒绝发生后现在的情况：\n    *   如果提供了 `onRejected`，则会调用它，并使用其结果来\
    \ *解决* `resultPromise`。请注意，`resultPromise` 不会被拒绝：我们假设 `onRejected()` 修复了存在的任何问题。\n\
    \    *   如果缺少 `onRejected`，则使用当前 Promise 的拒绝值来拒绝 `resultPromise`。\n\n## 18.7 版本\
    \ 3：扁平化从 `.then()` 回调返回的 Promise\n\n### 18.7.1 从 `.then()` 的回调中返回 Promise\n\n\
    Promise 扁平化主要是为了让链式调用更方便：如果我们想将一个值从一个 `.then()` 回调传递到下一个，我们就在前一个回调中返回它。之后，`.then()`\
    \ 会将其放入它已经返回的 Promise 中。\n\n如果从 `.then()` 回调中返回一个 Promise，这种方法就会变得不方便。例如，基于 Promise\
    \ 的函数的结果（第 A 行）：\n\n```\nasyncFunc1()\n.then((result1) => {\n  assert.equal(result1,\
    \ 'Result of asyncFunc1()');\n  return asyncFunc2(); // (A)\n})\n.then((result2Promise)\
    \ => {\n  result2Promise\n  .then((result2) => { // (B)\n    assert.equal(\n \
    \     result2, 'Result of asyncFunc2()');\n  });\n});\n```\n\n这次，将第 A 行返回的值放入\
    \ `.then()` 返回的 Promise 中，迫使我们在第 B 行解包该 Promise。如果第 A 行返回的 Promise 能够替换 `.then()`\
    \ 返回的 Promise，那就更好了。具体如何实现尚不明确，但如果可行，我们就可以这样编写代码：\n\n```\nasyncFunc1()\n.then((result1)\
    \ => {\n  assert.equal(result1, 'Result of asyncFunc1()');\n  return asyncFunc2();\
    \ // (A)\n})\n.then((result2) => {\n  // result2 是兑现值，而不是 Promise\n  assert.equal(\n\
    \    result2, 'Result of asyncFunc2()');\n});\n```\n\n在第 A 行，我们返回了一个 Promise。得益于\
    \ Promise 扁平化，`result2` 是该 Promise 的兑现值，而不是 Promise 本身。\n\n### 18.7.2 扁平化使 Promise\
    \ 状态更复杂\n\n![](img/file5.svg)  **ECMAScript 规范中的 Promise 扁平化**\n\n在 ECMAScript\
    \ 规范中，Promise 扁平化的细节在[“Promise 对象”部分](https://tc39.es/ecma262/#sec-promise-objects)中描述。\n\
    \nPromise API 如何处理扁平化？\n\n如果一个 Promise P 被一个 Promise Q 解决，那么 P 不会包装 Q，而是 P “变成”\
    \ Q：P 的状态和解决值现在始终与 Q 相同。这对 `.then()` 有帮助，因为 `.then()` 用其某个回调返回的值来解决它返回的 Promise。\n\
    \nP 如何变成 Q？通过 *锁定* Q：P 变得外部不可解决，并且 Q 的解决会触发 P 的解决。锁定是一种额外的不可见 Promise 状态，使状态更加复杂。\n\
    \nPromise API 还有一个额外特性：Q 不必是一个 Promise，只需是一个所谓的 *thenable*。thenable 是一个具有 `.then()`\
    \ 方法的对象。这种额外灵活性的目的是让不同的 Promise 实现能够协同工作（这在 Promise 首次添加到语言中时很重要）。\n\n图 5 可视化了新状态。\n\
    \n![](img/file12.svg)\n\n图 5：Promise 的所有状态：Promise 扁平化引入了不可见的伪状态“locked-in”。如果\
    \ Promise P 被一个 thenable Q 解决，则达到该状态。之后，P 的状态和解决值始终与 Q 相同。\n\n请注意，*解决* 的概念也变得更加复杂。现在，解决一个\
    \ Promise 仅意味着它不能再被直接解决：\n\n*   解决可能会拒绝一个 Promise：我们可以用一个被拒绝的 Promise 来解决一个 Promise。\n\
    *   解决甚至可能不会解决一个 Promise：我们可以用一个始终处于待定状态的 Promise 来解决一个 Promise。\n\nECMAScript\
    \ 规范是这样表述的：“未解决的 Promise 始终处于待定状态。已解决的 Promise 可能处于待定、兑现或拒绝状态。”\n\n### 18.7.3 实现\
    \ Promise 扁平化\n\n图 6 展示了 `ToyPromise3` 如何处理扁平化。\n\n![](img/file13.svg)\n\n图 6：`ToyPromise3`\
    \ 扁平化已解决的 Promise：如果第一个 Promise 被一个 thenable `x1` 解决，它会锁定 `x1`，并用 `x1` 的解决值来结算。如果第一个\
    \ Promise 被一个非 thenable 的值解决，则一切照旧。\n\n我们通过以下函数检测 thenable：\n\n```\nfunction isThenable(value)\
    \ { // [new]\n  return typeof value === 'object' && value !== null\n    && typeof\
    \ value.then === 'function';\n}\n```\n\n为了实现锁定，我们引入了一个新的布尔标志 `._alreadyResolved`。将其设置为\
    \ `true` 会停用 `.resolve()` 和 `.reject()`——例如：\n\n```\nresolve(value) { // [new]\n\
    \  if (this._alreadyResolved) return this;\n  this._alreadyResolved = true;\n\n\
    \  if (isThenable(value)) {\n    // 将 `value` 的兑现和拒绝转发给 `this`。\n    // 回调始终异步执行\n\
    \    value.then(\n      (result) => this._doFulfill(result),\n      (error) =>\
    \ this._doReject(error));\n  } else {\n    this._doFulfill(value);\n  }\n\n  return\
    \ this; // 启用链式调用\n}\n```\n\n如果 `value` 是一个 thenable，那么我们将当前 Promise 锁定在它上面：\n\
    \n*   如果 `value` 被一个结果兑现，当前 Promise 也会被该结果兑现。\n*   如果 `value` 被一个错误拒绝，当前 Promise\
    \ 也会被该错误拒绝。\n\n结算通过私有方法 `._doFulfill()` 和 `._doReject()` 执行，以绕过 `._alreadyResolved`\
    \ 的保护。\n\n`._doFulfill()` 相对简单：\n\n```\n_doFulfill(value) { // [new]\n  assert.ok(!isThenable(value));\n\
    \  this._promiseState = 'fulfilled';\n  this._promiseResult = value;\n  this._clearAndEnqueueTasks(this._fulfillmentTasks);\n\
    }\n```\n\n此处未展示 `.reject()`。它唯一的新功能是现在也遵守 `._alreadyResolved`。\n\n## 18.8 版本 4：反应回调中抛出的异常\n\
    \n![](img/file14.svg)\n\n图 7：`ToyPromise4` 将 Promise 反应中的异常转换为 `.then()` 返回的 Promise\
    \ 的拒绝。\n\n作为我们的最后一个特性，我们希望 Promise 能够将用户代码中的异常作为拒绝处理（图 7）。在本章中，“用户代码”指的是 `.then()`\
    \ 的两个回调参数。\n\n```\nnew ToyPromise4()\n  .resolve('a')\n  .then((value) => {\n\
