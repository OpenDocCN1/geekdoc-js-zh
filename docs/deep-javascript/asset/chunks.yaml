    \ 的 Promise 不是通过方法来解决或拒绝的，而是通过传递给 *executor*（构造函数的回调参数）的函数来完成的。\n\n```\nconst\
    \ promise = new Promise(\n  (resolve, reject) => { // executor\n    // ···\n \
    \ });\n```\n\n如果 executor 抛出异常，则 `promise` 被拒绝。\n\n# 19 函数的 `.name` 属性\n\n* *\
    \ *\n\n*   19.1 函数的名称\n    *   19.1.1 函数名称用于堆栈跟踪\n*   19.2 为函数提供名称的构造\n    * \
    \  19.2.1 函数声明\n    *   19.2.2 变量声明与匿名函数\n    *   19.2.3 赋值与匿名函数\n    *   19.2.4 默认值与匿名函数\n\
    \    *   19.2.5 具名函数表达式\n    *   19.2.6 对象字面量中的方法\n    *   19.2.7 类定义中的方法\n  \
    \  *   19.2.8 类的名称\n    *   19.2.9 默认导出与匿名构造\n    *   19.2.10 其他编程构造\n*   19.3 函数名称的注意事项\n\
    \    *   19.3.1 函数名称总是在创建时赋值\n    *   19.3.2 警告：代码压缩\n*   19.4 修改函数名称\n*   19.5 ECMAScript\
    \ 规范中的函数属性 `.name`\n\n* * *\n\n在本章中，我们将探讨函数的名称：\n\n*   所有函数都有 `.name` 属性\n*  \
    \ 该属性对调试（其值会出现在堆栈跟踪中）以及某些元编程任务（按名称选取函数等）很有用。\n\n## 19.1 函数的名称\n\n函数的 `.name` 属性包含函数的名称：\n\
    \n```\nfunction myBeautifulFunction() {}\nassert.equal(myBeautifulFunction.name,\
    \ 'myBeautifulFunction');\n```\n\n在 ECMAScript 6 之前，大多数引擎已经支持该属性。随着 ES6 的发布，它成为了语言标准的一部分。\n\
    \n语言在给函数命名方面变得出奇地擅长，即使它们最初是匿名的（例如箭头函数）。\n\n### 19.1.1 函数名称用于堆栈跟踪\n\n函数名称的一个好处是它们会出现在堆栈跟踪中。在下面的示例中，`callFunc()`\
    \ 的参数没有名称，因此堆栈跟踪的第二行没有函数名称。\n\n```\nfunction callFunc(func) {\n  return func();\n\
    }\n\nfunction func1() {\n  throw new Error('Problem');\n}\n\nfunction func2()\
    \ {\n  // 下面的箭头函数没有名称\n  callFunc(() => func1());\n}\n\nfunction func3() {\n \
    \ func2();\n}\n\ntry {\n  func3();\n} catch (err) {\nassert.equal(err.stack, `\n\
    Error: Problem\n at func1 (ch_function-names.mjs:6:9)\n at ch_function-names.mjs:11:18\n\
    \ at callFunc (ch_function-names.mjs:2:10)\n at func2 (ch_function-names.mjs:11:3)\n\
    \ at func3 (ch_function-names.mjs:15:3)\n at ch_function-names.mjs:19:3\n`.trim());\n\
    \n}\n```\n\n## 19.2 为函数提供名称的构造\n\n以下各节描述了各种编程构造如何自动设置 `.name`。\n\n### 19.2.1 函数声明\n\
    \n函数声明长期以来一直拥有 `.name`——例如：\n\n```\nfunction funcDecl() {}\nassert.equal(funcDecl.name,\
    \ 'funcDecl');\n```\n\n### 19.2.2 变量声明与匿名函数\n\n由匿名函数表达式创建的函数，如果它是变量声明的初始化值，则会获得一个名称：\n\
    \n```\nlet letFunc = function () {};\nassert.equal(letFunc.name, 'letFunc');\n\
    \nconst constFunc = function () {};\nassert.equal(constFunc.name, 'constFunc');\n\
    \nvar varFunc = function () {};\nassert.equal(varFunc.name, 'varFunc');\n```\n\
    \n![](img/file0.svg)  **箭头函数也会获得名称**\n\n在名称方面，箭头函数与匿名函数表达式类似：\n\n```\nconst arrowFunc\
    \ = () => {};\nassert.equal(arrowFunc.name, 'arrowFunc');\n```\n\n从现在开始，每当你看到匿名函数表达式时，可以假设箭头函数的工作方式相同。\n\
    \n### 19.2.3 赋值与匿名函数\n\n即使是普通的赋值，`.name` 也会被正确设置：\n\n```\nlet assignedFunc;\n\
    assignedFunc = function () {};\nassert.equal(assignedFunc.name, 'assignedFunc');\n\
    ```\n\n### 19.2.4 默认值与匿名函数\n\n如果函数是默认值，它会从其变量或参数中获取名称：\n\n```\nconst [arrayDestructured\
    \ = function () {}] = [];\nassert.equal(arrayDestructured.name, 'arrayDestructured');\n\
    \nconst {prop: objectDestructured = function () {}} = {};\nassert.equal(objectDestructured.name,\
    \ 'objectDestructured');\n\nfunction createParamDefault(paramDefault = function\
    \ () {}) {\n  return paramDefault;\n}\nassert.equal(createParamDefault().name,\
    \ 'paramDefault');\n```\n\n### 19.2.5 具名函数表达式\n\n具名函数表达式的名称用于设置 `.name` 属性：\n\n\
    ```\nconst varName = function funcName() {};\nassert.equal(varName.name, 'funcName');\n\
    ```\n\n因为函数表达式的名称 `funcName` 优先于其他名称（本例中为变量名 `varName`）。然而，函数表达式的名称仍然只是函数表达式内部的变量：\n\
    \n```\nconst varName = function funcName() {\n  assert.equal(funcName.name, 'funcName');\n\
    };\nvarName();\nassert.throws(\n  () => funcName,\n  /^ReferenceError: funcName\
    \ is not defined$/\n);\n```\n\n### 19.2.6 对象字面量中的方法\n\n如果函数是属性的值，它会从该属性获取名称。无论这是通过方法定义（第\
    \ A 行）、传统属性定义（第 B 行）、带计算属性键的属性定义（第 C 行）还是属性值简写（第 D 行）实现的，都没有关系。\n\n"
- fmt: "\n`function shortHand() {}`\n`const obj = {`\n`  methodDef() {}, // (A)`\n\
    `  propDef: function () {}, // (B)`\n`  ['computed' + 'Key']: function () {},\
    \ // (C)`\n`  shortHand, // (D)`\n`};`\n`assert.equal(obj.methodDef.name, 'methodDef');`\n\
    `assert.equal(obj.propDef.name, 'propDef');`\n`assert.equal(obj.computedKey.name,\
    \ 'computedKey');`\n`assert.equal(obj.shortHand.name, 'shortHand');`\n\nThe names\
    \ of getters are prefixed with `'get'`, the names of setters are prefixed with\
    \ `'set'`:\n\n```\nconst obj = {\n  get myGetter() {},\n  set mySetter(value)\
    \ {},\n};\nconst getter = Object.getOwnPropertyDescriptor(obj, 'myGetter').get;\n\
    assert.equal(getter.name, 'get myGetter');\n\nconst setter = Object.getOwnPropertyDescriptor(obj,\
    \ 'mySetter').set;\nassert.equal(setter.name, 'set mySetter');\n```\n\n### 19.2.7 Methods\
    \ in class definitions\n\nThe naming of methods in class definitions is similar\
    \ to object literals. For example, here is a class declaration (naming works the\
    \ same in class expressions):\n\n```\nclass ClassDecl {\n  methodDef() {}\n  ['computed'\
    \ + 'Key']() {} // computed property key\n\n  static staticMethod() {}\n}\nassert.equal(ClassDecl.prototype.methodDef.name,\
    \ 'methodDef');\nassert.equal(new ClassDecl().methodDef.name, 'methodDef');\n\n\
    assert.equal(ClassDecl.prototype.computedKey.name, 'computedKey');\n\nassert.equal(ClassDecl.staticMethod.name,\
    \ 'staticMethod');\n```\n\nGetters and setters again have the name prefixes `'get'`\
    \ and `'set'`, respectively:\n\n```\nclass ClassDecl {\n  get myGetter() {}\n\
    \  set mySetter(value) {}\n}\nconst getter = Object.getOwnPropertyDescriptor(\n\
    \  ClassDecl.prototype, 'myGetter').get;\nassert.equal(getter.name, 'get myGetter');\n\
    \nconst setter = Object.getOwnPropertyDescriptor(\n  ClassDecl.prototype, 'mySetter').set;\n\
    assert.equal(setter.name, 'set mySetter');\n```\n\n#### 19.2.7.1 Methods whose\
    \ keys are symbols\n\nThe key of a method can be a symbol. The `.name` property\
    \ of such a method is still a string:\n\n*   If the symbol has a description,\
    \ the method’s name is the description in square brackets.\n*   Otherwise, the\
    \ method’s name is the empty string (`''`).\n\n```\nconst keyWithDesc = Symbol('keyWithDesc');\n\
    const keyWithoutDesc = Symbol();\n\nconst obj = {\n  [keyWithDesc]() {},\n  [keyWithoutDesc]()\
    \ {},\n};\nassert.equal(obj[keyWithDesc].name, '[keyWithDesc]');\nassert.equal(obj[keyWithoutDesc].name,\
    \ '');\n```\n\n### 19.2.8 Names of classes\n\nUnder the hood, classes are functions.\
    \ Property `.name` of such functions is also set up correctly:\n\n```\nclass ClassDecl\
    \ {}\nassert.equal(ClassDecl.name, 'ClassDecl');\n\nconst AnonClassExpr = class\
    \ {};\nassert.equal(AnonClassExpr.name, 'AnonClassExpr');\n\nconst NamedClassExpr\
    \ = class ClassName {};\nassert.equal(NamedClassExpr.name, 'ClassName');\n```\n\
    \n### 19.2.9 Default exports and anonymous constructs\n\nAll of the following\
    \ statements set `.name` to `'default'`:\n\n```\n// Anonymous function expressions\n\
    export default function () {}\nexport default (function () {});\n\n// Anonymous\
    \ class expressions\nexport default class {}\nexport default (class {});\n\n//\
    \ Arrow functions\nexport default () => {};\n```\n\n### 19.2.10 Other programming\
    \ constructs\n\n*   Generator functions and generator methods get their names\
    \ the same way that normal functions and methods do. There are no asterisks in\
    \ their names:\n\n    ```\n    function* genFuncDecl() {}\n    assert.equal(genFuncDecl.name,\
    \ 'genFuncDecl');\n    ```\n\n*   `new Function()` produces functions whose `.name`\
    \ is `'anonymous'`. [A webkit bug](https://bugs.webkit.org/show_bug.cgi?id=7726)\
    \ describes why that is necessary on the web.\n\n    ```\n    assert.equal(new\
    \ Function().name, 'anonymous');\n    ```\n\n*   `func.bind()` produces a function\
    \ whose `.name` is `'bound '+func.name`:\n\n    ```\n    function func(x) {\n\
    \      return x\n    }\n    const bound = func.bind(undefined, 123);\n    assert.equal(bound.name,\
    \ 'bound func');\n    ```\n\n## 19.3 Things to look out for with names of functions\n\
    \n### 19.3.1 The name of a function is always assigned at creation\n\nA function\
    \ only gets a name if one of the previously mentioned patterns is used during\
    \ its creation. Using one of the patterns later doesn’t change anything – for\
    \ example:\n\n```\nfunction functionFactory() {\n  return function () {}; // (A)\n\
    }\nconst func = functionFactory(); // (B)\nassert.equal(func.name, ''); // anonymous\n\
    ```\n\nFunction `func` is created in line A, where it also receives its non-name,\
    \ the empty string `''`. Using an assignment in line B doesn’t update the initial\
    \ name. Missing function names could conceivably be updated later, but doing so\
    \ would impact performance negatively.\n\n### 19.3.2 Caveat: minification\n\n\
    Function names are subject to minification, which means that they will usually\
    \ change in minified code. Depending on what we want to do, we may have to manage\
    \ function names via strings (which are not minified) or we may have to tell our\
    \ minifier what names not to minify.\n\n## 19.4 Changing the names of functions\n\
    \n![](media/file0.svg)  **More information on property attributes**\n\n`Object.getOwnPropertyDescriptor()`\
    \ and `Object.defineProperty()` work with property attributes. For more information\
    \ on those, see [§9 “Property attributes: an introduction”](#ch010.xhtml_ch_property-attributes-intro).\n\
    \nThese are the attributes of property `.name`:\n\n```\nconst func = function\
    \ () {};\nassert.deepEqual(\n  Object.getOwnPropertyDescriptor(func, 'name'),\n\
    \  {\n    value: 'func',\n    writable: false,\n    enumerable: false,\n    configurable:\
    \ true,\n  });\n```\n\nThe property not being writable means that we can’t change\
    \ its value via assignment:\n\n```\nassert.throws(\n  () => func.name = 'differentName',\n\
    \  /^TypeError: Cannot assign to read only property 'name'/\n);\n```\n\nThe property\
    \ is, however, configurable, which means that we can change it by re-defining\
    \ it:\n\n```\nObject.defineProperty(\n  func, 'name', {\n    value: 'differentName',\n\
    \  });\nassert.equal(func.name, 'differentName');\n```\n\n## 19.5 The function\
    \ property `.name` in the ECMAScript specification\n\n*   The spec operation [`SetFunctionName()`](https://tc39.es/ecma262/#sec-setfunctionname)\
    \ sets up the property `.name`. Search for its name in the spec to find out where\
    \ that happens. The third parameter specifies a name prefix:\n\n    *   [Getters\
    \ and setters](https://tc39.es/ecma262/#sec-method-definitions-runtime-semantics-propertydefinitionevaluation)\
    \ prefix `'get'` and `'set'`.\n    *   [`Function.prototype.bind()`](https://tc39.es/ecma262/#sec-function.prototype.bind)\
    \ prefixes `'bound'`.\n\n*   Anonymous function expressions initially not having\
    \ a property `.name` can be seen by looking at how functions are created in the\
    \ spec.\n"
