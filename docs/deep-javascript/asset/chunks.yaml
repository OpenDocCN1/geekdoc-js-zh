    - 9.6 [Use cases for `Object.getOwnPropertyDescriptors()`](#ch010.xhtml_use-cases-for-object.getownpropertydescriptors)\n\
    \    - 9.6.1 [Use case: copying properties into an object](#ch010.xhtml_use-case-copying-properties-into-an-object)\n\
    \    - 9.6.2 [Use case for `Object.getOwnPropertyDescriptors()`: cloning objects](#ch010.xhtml_use-case-for-object.getownpropertydescriptors-cloning-objects)\n\
