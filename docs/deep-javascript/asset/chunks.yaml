  trans: "\n\n```java\nclass StringBuilder {\n  _data = [];\n  add(str) {\n    this._data.push(str);\n\
    \  }\n  getParts() {\n    // We expose internals without copying them:\n    return\
    \ this._data; // (A)\n  }\n  toString() {\n    return this._data.join('');\n \
    \ }\n}\n```\n\n只要不使用 `.getParts()`，一切正常：\n\n```java\nconst sb1 = new StringBuilder();\n\
    sb1.add('Hello');\nsb1.add(' world!');\nassert.equal(sb1.toString(), 'Hello world!');\n\
    ```\n\n然而，如果 `.getParts()` 的结果被修改（第 A 行），那么 `StringBuilder` 将无法正常工作：\n\n```java\n\
    const sb2 = new StringBuilder();\nsb2.add('Hello');\nsb2.add(' world!');\nsb2.getParts().length\
    \ = 0; // (A)\nassert.equal(sb2.toString(), ''); // 不正常\n```\n\n解决方案是在暴露内部 `._data`\
    \ 之前进行防御性复制（第 A 行）：\n\n```java\nclass StringBuilder {\n  this._data = [];\n  add(str)\
    \ {\n    this._data.push(str);\n  }\n  getParts() {\n    // 防御性复制\n    return\
    \ [...this._data]; // (A)\n  }\n  toString() {\n    return this._data.join('');\n\
    \  }\n}\n```\n\n现在修改 `.getParts()` 的结果不会再干扰 `sb` 的操作：\n\n```java\nconst sb = new\
    \ StringBuilder();\nsb.add('Hello');\nsb.add(' world!');\nsb.getParts().length\
    \ = 0;\nassert.equal(sb.toString(), 'Hello world!'); // 正常\n```\n\n## 8.3 通过非破坏性更新避免变更\n\
    \n如果我们只进行非破坏性数据更新，就可以避免变更。\n\n![](img/file0.svg)  **背景**\n\n关于数据更新的更多信息，请参见§7\
    \ “破坏性与非破坏性数据更新”。\n\n### 8.3.1 非破坏性更新如何帮助处理共享可变状态？\n\n通过非破坏性更新，共享数据变得毫无问题，因为我们从不修改共享数据。（这只有在所有访问数据的人都这样做时才有效！）\n\
    \n有趣的是，复制数据变得非常简单：\n\n```java\nconst original = {city: 'Berlin', country: 'Germany'};\n\
    const copy = original;\n```\n\n这之所以可行，是因为我们只进行非破坏性更改，因此按需复制数据。\n\n## 8.4 通过使数据不可变来防止变更\n\
    \n我们可以通过使共享数据不可变来防止对其的修改。\n\n![](img/file0.svg)  **背景**\n\n关于如何在 JavaScript 中使数据不可变的背景知识，请参考本书的以下两章：\n\
    \n*   §10 “保护对象不被更改”\n*   §15 “集合的不可变包装器”\n\n### 8.4.1 不可变性如何帮助处理共享可变状态？\n\n如果数据是不可变的，那么共享它就没有任何风险。特别是，不需要进行防御性复制。\n\
    \n![](img/file2.svg)  **非破坏性更新是不可变数据的重要补充**\n\n如果我们将两者结合，不可变数据实际上可以像可变数据一样灵活，但没有相关风险。\n\
    \n## 8.5 避免共享可变状态的库\n\nJavaScript 中有几个库支持不可变数据和非破坏性更新。两个流行的库是：\n\n*   [Immutable.js](https://github.com/immutable-js/immutable-js)\
    \ 提供了列表、栈、集合、映射等不可变数据结构。\n*   [Immer](https://immerjs.github.io/immer/) 也支持不可变性和非破坏性更新，但针对普通对象、数组、集合和映射。也就是说，不需要新的数据结构。\n\
    \n这些库将在接下来的两节中详细介绍。\n\n### 8.5.1 Immutable.js\n\n在其仓库中，[Immutable.js 库](https://github.com/immutable-js/immutable-js)\
    \ 被描述为：\n\n> 用于 JavaScript 的不可变持久数据集合，可提高效率和简洁性。\n\nImmutable.js 提供了诸如以下不可变数据结构：\n\
    \n*   `List`\n*   `Stack`\n*   `Set`（与 JavaScript 内置的 `Set` 不同）\n*   `Map`（与 JavaScript\
    \ 内置的 `Map` 不同）\n*   等等。\n\n在以下示例中，我们使用了一个不可变的 `Map`：\n\n```java\nimport {Map}\
    \ from 'immutable/dist/immutable.es.js';\nconst map0 = Map([\n  [false, 'no'],\n\
    \  [true, 'yes'],\n]);\n\n// 我们创建 map0 的一个修改版本：\nconst map1 = map0.set(true, 'maybe');\n\
    \n// 修改后的版本与原版本不同：\nassert.ok(map1 !== map0);\nassert.equal(map1.equals(map0),\
    \ false); // (A)\n\n// 我们撤销刚才所做的更改：\nconst map2 = map1.set(true, 'yes');\n\n//\
    \ map2 是与 map0 不同的对象，\n// 但内容相同\nassert.ok(map2 !== map0);\nassert.equal(map2.equals(map0),\
    \ true); // (B)\n```\n\n注意：\n\n*   “破坏性”操作（如 `.set()`）不会修改接收者，而是返回修改后的副本。\n* \
    \  要检查两个数据结构是否具有相同的内容，我们使用内置的 `.equals()` 方法（第 A 行和第 B 行）。\n\n### 8.5.2 Immer\n\
    \n在其仓库中，[Immer 库](https://immerjs.github.io/immer/) 被描述为：\n\n> 通过修改当前状态来创建下一个不可变状态。\n\
    \nImmer 帮助非破坏性地更新（可能嵌套的）普通对象、数组、集合和映射。也就是说，不涉及自定义数据结构。\n\n以下是使用 Immer 的样子：\n\n\
    ```java\nimport {produce} from 'immer/dist/immer.module.js';\n\nconst people =\
    \ [\n  {name: 'Jane', work: {employer: 'Acme'}},\n];\n\nconst modifiedPeople =\
    \ produce(people, (draft) => {\n  draft[0].work.employer = 'Cyberdyne';\n  draft.push({name:\
    \ 'John', work: {employer: 'Spectre'}});\n});\n\nassert.deepEqual(modifiedPeople,\
    \ [\n  {name: 'Jane', work: {employer: 'Cyberdyne'}},\n  {name: 'John', work:\
    \ {employer: 'Spectre'}},\n]);\nassert.deepEqual(people, [\n  {name: 'Jane', work:\
    \ {employer: 'Acme'}},\n]);\n```\n\n原始数据存储在 `people` 中。`produce()` 为我们提供了一个变量\
    \ `draft`。我们假装这个变量就是 `people`，并使用通常用于破坏性更改的操作。Immer 会拦截这些操作。它不会修改 `draft`，而是非破坏性地更改\
    \ `people`。结果由 `modifiedPeople` 引用。作为额外的好处，它是深度不可变的。\n\n`assert.deepEqual()` 之所以有效，是因为\
    \ Immer 返回普通对象和数组。\n\n# 9 属性特性：简介\n\n* * *\n\n*   9.1 对象的结构\n    *   9.1.1 内部槽位\n\
    \    *   9.1.2 属性键\n    *   9.1.3 属性特性\n*   9.2 属性描述符\n*   9.3 检索属性的描述符\n    *\
    \   9.3.1 `Object.getOwnPropertyDescriptor()`：检索单个属性的描述符\n\n"
