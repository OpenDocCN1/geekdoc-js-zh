    \n* * *\n\n![](media/file1.svg)  **Required knowledge: Promises**\n\nFor this\
    \ chapter, you should be roughly familiar with Promises, but much relevant knowledge\
    \ is also reviewed here. If necessary, you can read [the chapter on Promises in\
    \ “JavaScript for impatient programmers”](https://exploringjs.com/impatient-js/ch_promises.html).\n\
    \nIn this chapter, we will approach Promises from a different angle: Instead of\
    \ using this API, we will create a simple implementation of it. This different\
    \ angle once helped me greatly with making sense of Promises.\n\nThe Promise implementation\
    \ is the class `ToyPromise`. In order to be easier to understand, it doesn’t completely\
    \ match the API. But it is close enough to still give us much insight into how\
    \ Promises work.\n\n![](media/file1.svg)  **Repository with code**\n\n`ToyPromise`\
    \ is available on GitHub, in the repository [`toy-promise`](https://github.com/rauschma/toy-promise).\n\
    \n## 18.1 Refresher: states of Promises\n\n![](media/file9.svg)\n\nFigure 2: The\
    \ states of a Promise (simplified version): A Promise is initially pending. If\
    \ we resolve it, it becomes fulfilled. If we reject it, it becomes rejected.\n\
    \nWe start with a simplified version of how Promise states work (fig. [2](#ch019.xhtml_fig:promise-states-simple)):\n\
    \n*   A Promise is initially *pending*.\n*   If a Promise is *resolved* with a\
    \ value `v`, it becomes *fulfilled* (later, we’ll see that resolving can also\
    \ reject). `v` is now the *fulfillment value* of the Promise.\n*   If a Promise\
    \ is *rejected* with an error `e`, it becomes *rejected*. `e` is now the *rejection\
    \ value* of the Promise.\n\n## 18.2 Version 1: Stand-alone Promise\n\nOur first\
    \ implementation is a stand-alone Promise with minimal functionality:\n\n*   We\
    \ can create a Promise.\n*   We can resolve or reject a Promise and we can only\
    \ do it once.\n*   We can register *reactions* (callbacks) via `.then()`. Registering\
    \ must do the right thing independently of whether the Promise has already been\
    \ settled or not.\n*   `.then()` does not support chaining, yet – it does not\
    \ return anything.\n\n`ToyPromise1` is a class with three prototype methods:\n\
    \n*   `ToyPromise1.prototype.resolve(value)`\n*   `ToyPromise1.prototype.reject(reason)`\n\
    *   `ToyPromise1.prototype.then(onFulfilled, onRejected)`\n\nThat is, `resolve`\
    \ and `reject` are methods (and not functions handed to a callback parameter of\
    \ the constructor).\n\nThis is how this first implementation is used:\n\n```\n\
    [](#cb306-1)// .resolve() before .then()\n[](#cb306-2)const tp1 = new ToyPromise1();\n\
    [](#cb306-3)tp1.resolve('abc');\n[](#cb306-4)tp1.then((value) => {\n[](#cb306-5)\
    \  assert.equal(value, 'abc');\n[](#cb306-6)});\n```\n\n```\n[](#cb307-1)// .then()\
    \ before .resolve()\n[](#cb307-2)const tp2 = new ToyPromise1();\n[](#cb307-3)tp2.then((value)\
    \ => {\n[](#cb307-4)  assert.equal(value, 'def');\n[](#cb307-5)});\n[](#cb307-6)tp2.resolve('def');\n\
    ```\n\nFig. [3](#ch019.xhtml_fig:promise-impl1-simple) illustrates how our first\
    \ `ToyPromise` works.\n\n![](media/file0.svg)  **The diagrams of the data flow\
    \ in Promises are optional**\n\nThe motivation for the diagrams is to have a visual\
    \ explanation for how Promises work. But they are optional. If you find them confusing,\
    \ you can ignore them and focus on the code.\n\n![](media/file10.svg)\n\nFigure\
    \ 3: `ToyPromise1`: If a Promise is resolved, the provided value is passed on\
    \ to the *fulfillment reactions* (first arguments of `.then()`). If a Promise\
    \ is rejected, the provided value is passed on to the *rejection reactions* (second\
    \ arguments of `.then()`).\n\n### 18.2.1 Method `.then()`\n\nLet’s examine `.then()`\
    \ first. It has to handle two cases:\n\n*   If the Promise is still pending, it\
    \ queues invocations of `onFulfilled` and `onRejected`. They are to be used later,\
    \ when the Promise is settled.\n*   If the Promise is already fulfilled or rejected,\
    \ `onFulfilled` or `onRejected` can be invoked right away.\n"
