    \ = typeof value;\n[](#cb17-6)  switch (result) {\n[](#cb17-7)    case 'function':\n\
    [](#cb17-8)      return 'object';\n[](#cb17-9)    case 'object':\n[](#cb17-10)\
    \      if (value === null) {\n[](#cb17-11)        return 'null';\n[](#cb17-12)\
