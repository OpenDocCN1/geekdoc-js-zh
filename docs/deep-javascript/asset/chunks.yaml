    * * *\n\nIn this chapter, we learn about two different ways of updating data:\n\
    \n*   A *destructive update* of data mutates the data so that it has the desired\
    \ form.\n\n*   A *non-destructive update* of data creates a copy of the data that\
    \ has the desired form.\n\nThe latter way is similar to first making a copy and\
    \ then changing it destructively, but it does both at the same time.\n\n## 7.1 Examples:\
    \ updating an object destructively and non-destructively\n\nThe following code\
    \ shows a function that updates object properties destructively and uses it on\
    \ an object.\n\n```\nfunction setPropertyDestructively(obj, key, value) {\n  obj[key]\
    \ = value;\n  return obj;\n}\n\nconst obj = {city: 'Berlin', country: 'Germany'};\n\
    setPropertyDestructively(obj, 'city', 'Munich');\nassert.deepEqual(obj, {city:\
    \ 'Munich', country: 'Germany'});\n```\n\nThe following code demonstrates non-destructive\
    \ updating of an object:\n\n```\nfunction setPropertyNonDestructively(obj, key,\
    \ value) {\n  const updatedObj = {};\n  for (const [k, v] of Object.entries(obj))\
    \ {\n    updatedObj[k] = (k === key ? value : v);\n  }\n  return updatedObj;\n\
    }\n\nconst obj = {city: 'Berlin', country: 'Germany'};\nconst updatedObj = setPropertyNonDestructively(obj,\
    \ 'city', 'Munich');\n\n// We have created an updated object:\nassert.deepEqual(updatedObj,\
    \ {city: 'Munich', country: 'Germany'});\n\n// But we didn’t change the original:\n\
    assert.deepEqual(obj, {city: 'Berlin', country: 'Germany'});\n```\n\nSpreading\
    \ makes `setPropertyNonDestructively()` more concise:\n\n```\nfunction setPropertyNonDestructively(obj,\
    \ key, value) {\n  return {...obj, [key]: value};\n}\n```\n\nBoth versions of\
    \ `setPropertyNonDestructively()` update *shallowly*: They only change the top\
    \ level of an object.\n\n## 7.2 Examples: updating an Array destructively and\
    \ non-destructively\n\nThe following code shows a function that updates Array\
    \ elements destructively and uses it on an Array.\n\n```\nfunction setElementDestructively(arr,\
    \ index, value) {\n  arr[index] = value;\n}\n\nconst arr = ['a', 'b', 'c', 'd',\
    \ 'e'];\nsetElementDestructively(arr, 2, 'x');\nassert.deepEqual(arr, ['a', 'b',\
    \ 'x', 'd', 'e']);\n```\n\nThe following code demonstrates non-destructive updating\
    \ of an Array:\n\n```\nfunction setElementNonDestructively(arr, index, value)\
    \ {\n  const updatedArr = [];\n  for (const [i, v] of arr.entries()) {\n    updatedArr.push(i\
    \ === index ? value : v);\n  }\n  return updatedArr;\n}\n\nconst arr = ['a', 'b',\
    \ 'c', 'd', 'e'];\nconst updatedArr = setElementNonDestructively(arr, 2, 'x');\n\
