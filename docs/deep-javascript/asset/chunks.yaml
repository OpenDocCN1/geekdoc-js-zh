  trans: "\n*   如果 `setter` 是 `undefined`，则返回 `false`。\n\n*   执行 `Call(setter, Receiver,\
    \ «V»)`. [`Call()`](https://tc39.es/ecma262/#sec-call) 会调用函数对象 `setter`，并将 `this`\
    \ 设置为 `Receiver`，同时传入单个参数 `V`（规范中列表使用法式引号 `«»` 表示）。\n\n*   返回 `true`。\n\n####\
    \ 11.2.1.1 如何从赋值操作到达 `OrdinarySetWithOwnDescriptor()`？\n\n对非解构赋值进行求值涉及以下步骤：\n\n\
    *   在规范中，求值从 [关于 `AssignmentExpression` 运行时语义的章节](https://tc39.es/ecma262/#sec-assignment-operators-runtime-semantics-evaluation)\
    \ 开始。该章节处理匿名函数的命名、解构等操作。\n\n*   如果没有解构模式，则使用 [`PutValue()`](https://tc39.es/ecma262/#sec-putvalue)\
    \ 执行赋值。\n\n*   对于属性赋值，`PutValue()` 会调用内部方法 `.[[Set]]()`。\n\n*   对于普通对象，[`.[[Set]]()`](https://tc39.es/ecma262/#sec-ordinary-object-internal-methods-and-internal-slots-set-p-v-receiver)\
    \ 会调用 `OrdinarySet()`（进而调用 `OrdinarySetWithOwnDescriptor()`）并返回结果。\n\n值得注意的是，在严格模式下，如果\
    \ `.[[Set]]()` 的结果为 `false`，`PutValue()` 会抛出 `TypeError`。\n\n### 11.2.2 定义属性\n\
    \n定义属性的实际工作由 ECMAScript 规范中的 [以下操作](https://tc39.es/ecma262/#sec-validateandapplypropertydescriptor)\
    \ 处理：\n\n```\nValidateAndApplyPropertyDescriptor(O, P, extensible, Desc, current)\n\
    ```\n\n参数如下：\n\n*   对象 `O`，我们想要在其上定义属性。存在一种特殊的仅验证模式，其中 `O` 为 `undefined`。此处我们忽略该模式。\n\
    \n*   要定义的属性的键 `P`。\n\n*   `extensible` 指示 `O` 是否可扩展。\n\n*   `Desc` 是一个属性描述符，指定我们希望属性具有的特性。\n\
    \n*   `current` 包含自有属性 `O[P]` 的属性描述符（如果存在）。否则，`current` 为 `undefined`。\n\n操作的结果是一个布尔值，指示是否成功。失败可能产生不同的后果。某些调用者忽略该结果。其他调用者（如\
    \ `Object.defineProperty()`）在结果为 `false` 时会抛出异常。\n\n以下是该算法的总结：\n\n*   如果 `current`\
    \ 为 `undefined`，则属性 `P` 当前不存在，必须创建。\n\n    *   如果 `extensible` 为 `false`，则返回 `false`，表示无法添加该属性。\n\
    \n    *   否则，检查 `Desc` 并创建数据属性或访问器属性。\n\n    *   返回 `true`。\n\n*   如果 `Desc` 没有任何字段，则返回\
    \ `true`，表示操作成功（因为无需进行任何更改）。\n\n*   如果 `current.[[Configurable]]` 为 `false`：\n\
    \n    *   （`Desc` 不允许更改除 `value` 以外的特性。）\n\n    *   如果 `Desc.[[Configurable]]`\
    \ 存在，则其值必须与 `current.[[Configurable]]` 相同。否则返回 `false`。\n\n    *   同样的检查：`Desc.[[Enumerable]]`\n\
    \n*   接下来，我们*验证*属性描述符 `Desc`：`current` 描述的特性能否更改为 `Desc` 指定的值？如果不能，返回 `false`。如果可以，继续。\n\
    \n    *   如果描述符是*通用*的（没有数据属性或访问器属性特有的特性），则验证成功，可以继续。\n\n    *   否则，如果一个描述符指定了数据属性，另一个指定了访问器属性：\n\
    \n        *   当前属性必须是可配置的（否则无法按需更改其特性）。如果不是，则返回 `false`。\n\n        *   将当前属性从数据属性更改为访问器属性，或反之。在此过程中，保留\
    \ `.[[Configurable]]` 和 `.[[Enumerable]]` 的值，所有其他特性获得 默认值（对象值特性为 `undefined`，布尔值特性为\
    \ `false`）。\n\n    *   否则，如果两个描述符都指定了数据属性：\n\n        *   如果 `current.[[Configurable]]`\
    \ 和 `current.[[Writable]]` 均为 `false`，则不允许任何更改，`Desc` 和 `current` 必须指定相同的特性：\n\
    \n            *   （由于 `current.[[Configurable]]` 为 `false`，`Desc.[[Configurable]]`\
    \ 和 `Desc.[[Enumerable]]` 已在之前检查过，且值正确。）\n\n            *   如果 `Desc.[[Writable]]`\
    \ 存在且为 `true`，则返回 `false`。\n\n            *   如果 `Desc.[[Value]]` 存在且与 `current.[[Value]]`\
    \ 的值不同，则返回 `false`。\n\n            *   无需进一步操作。返回 `true`，表示算法成功。\n\n         \
    \   *   （注意，通常情况下，我们无法更改不可配置属性的任何特性，除了其值。此规则的一个例外是，我们始终可以从可写变为不可写。该算法正确处理了这一例外。）\n\
    \n    *   否则（两个描述符都指定了访问器属性）：\n\n        *   如果 `current.[[Configurable]]` 为 `false`，则不允许任何更改，`Desc`\
    \ 和 `current` 必须指定相同的特性：\n\n            *   （由于 `current.[[Configurable]]` 为 `false`，`Desc.[[Configurable]]`\
    \ 和 `Desc.[[Enumerable]]` 已在之前检查过，且值正确。）\n\n            *   如果 `Desc.[[Set]]`\
    \ 存在，则其值必须与 `current.[[Set]]` 相同。否则返回 `false`。\n\n            *   同样的检查：`Desc.[[Get]]`\n\
    \n            *   无需进一步操作。返回 `true`，表示算法成功。\n\n*   将键为 `P` 的属性的特性设置为 `Desc` 指定的值。由于已经过验证，我们可以确信所有更改都是允许的。\n\
    \n*   返回 `true`。\n\n## 11.3 定义与赋值的实际应用\n\n本节介绍属性定义和赋值工作方式的一些后果。\n\n### 11.3.1 只有定义才能创建具有任意特性的属性\n\
    \n如果通过赋值创建自有属性，它总是创建 `writable`、`enumerable` 和 `configurable` 均为 `true` 的属性。\n\
    \n```\n[](#cb207-1)const obj = {};\n[](#cb207-2)obj.dataProp = 'abc';\n[](#cb207-3)assert.deepEqual(\n\
    [](#cb207-4)  Object.getOwnPropertyDescriptor(obj, 'dataProp'),\n[](#cb207-5)\
    \  {\n[](#cb207-6)    value: 'abc',\n[](#cb207-7)    writable: true,\n[](#cb207-8)\
    \    enumerable: true,\n[](#cb207-9)    configurable: true,\n[](#cb207-10)  });\n\
    ```\n\n因此，如果我们想指定任意特性，必须使用定义。\n\n虽然我们可以在对象字面量中创建 getter 和 setter，但之后无法通过赋值添加它们。同样，我们需要定义。\n\
    \n### 11.3.2 赋值运算符不会更改原型中的属性\n\n考虑以下设置，其中 `obj` 从 `proto` 继承了属性 `prop`。\n\n```\n\
    [](#cb208-1)const proto = { prop: 'a' };\n[](#cb208-2)const obj = Object.create(proto);\n\
    ```\n\n我们无法通过赋值给 `obj.prop` 来（破坏性地）更改 `proto.prop`。这样做会创建一个新的自有属性：\n\n```\n[](#cb209-1)assert.deepEqual(\n\
    [](#cb209-2)  Object.keys(obj), []);\n[](#cb209-3)\n[](#cb209-4)obj.prop = 'b';\n\
    [](#cb209-5)\n[](#cb209-6)// 赋值生效了：\n[](#cb209-7)assert.equal(obj.prop, 'b');\n\
    [](#cb209-8)\n[](#cb209-9)// 但我们创建了一个自有属性并覆盖了 proto.prop，\n[](#cb209-10)// 并没有更改它：\n\
    [](#cb209-11)assert.deepEqual(\n[](#cb209-12)  Object.keys(obj), ['prop']);\n\
    [](#cb209-13)assert.equal(proto.prop, 'a');\n```\n\n这种行为的基本原理如下：原型可以拥有其所有后代共享的属性。如果我们只想更改某个后代的此类属性，必须通过覆盖以非破坏性方式进行。这样更改就不会影响其他后代。\n\
    \n### 11.3.3 赋值会调用 setter，定义不会\n\n"
- fmt: "\nWhat is the difference between defining the property `.prop` of `obj` versus\
    \ assigning to it?\n\nIf we define, then our intention is to either create or\
    \ change an own (non-inherited) property of `obj`. Therefore, definition ignores\
    \ the inherited setter for `.prop` in the following example:\n\n```\nlet setterWasCalled\
    \ = false;\nconst proto = {\n  get prop() {\n    return 'protoGetter';\n  },\n\
    \  set prop(x) {\n    setterWasCalled = true;\n  },\n};\nconst obj = Object.create(proto);\n\
    \nassert.equal(obj.prop, 'protoGetter');\n\n// Defining obj.prop:\nObject.defineProperty(\n\
    \  obj, 'prop', { value: 'objData' });\nassert.equal(setterWasCalled, false);\n\
    \n// We have overridden the getter:\nassert.equal(obj.prop, 'objData');\n```\n\
    \nIf, instead, we assign to `.prop`, then our intention is often to change something\
    \ that already exists and that change should be handled by the setter:\n\n```\n\
    let setterWasCalled = false;\nconst proto = {\n  get prop() {\n    return 'protoGetter';\n\
    \  },\n  set prop(x) {\n    setterWasCalled = true;\n  },\n};\nconst obj = Object.create(proto);\n\
    \nassert.equal(obj.prop, 'protoGetter');\n\n// Assigning to obj.prop:\nobj.prop\
    \ = 'objData';\nassert.equal(setterWasCalled, true);\n\n// The getter still active:\n\
    assert.equal(obj.prop, 'protoGetter');\n```\n\n### 11.3.4 Inherited read-only\
    \ properties prevent creating own properties via assignment\n\nWhat happens if\
    \ `.prop` is read-only in a prototype?\n\n```\nconst proto = Object.defineProperty(\n\
    \  {}, 'prop', {\n    value: 'protoValue',\n    writable: false,\n  });\n```\n\
    \nIn any object that inherits the read-only `.prop` from `proto`, we can’t use\
    \ assignment to create an own property with the same key – for example:\n\n```\n\
    const obj = Object.create(proto);\nassert.throws(\n  () => obj.prop = 'objValue',\n\
    \  /^TypeError: Cannot assign to read only property 'prop'/);\n```\n\nWhy can’t\
    \ we assign? The rationale is that overriding an inherited property by creating\
    \ an own property can be seen as [non-destructively changing](#ch008.xhtml_ch_updating-destructively-and-nondestructively)\
    \ the inherited property. Arguably, if a property is non-writable, we shouldn’t\
    \ be able to do that.\n\nHowever, defining `.prop` still works and lets us override:\n\
    \n```\nObject.defineProperty(\n  obj, 'prop', { value: 'objValue' });\nassert.equal(obj.prop,\
    \ 'objValue');\n```\n\nAccessor properties that don’t have a setter are also considered\
    \ to be read-only:\n\n```\nconst proto = {\n  get prop() {\n    return 'protoValue';\n\
    \  }\n};\nconst obj = Object.create(proto);\nassert.throws(\n  () => obj.prop\
    \ = 'objValue',\n  /^TypeError: Cannot set property prop of #<Object> which has\
    \ only a getter$/);\n```\n\n![](media/file5.svg)  **The “override mistake”: pros\
    \ and cons**\n\n*   It was introduced in ECMAScript 5.1.\n\n*   On one hand, this\
    \ behavior is consistent with how prototypal inheritance and setters work. (So,\
    \ arguably, it is *not* a mistake.)\n\n*   On the other hand, with the behavior,\
    \ deep-freezing the global object causes unwanted side-effects.\n\n*   There was\
    \ an attempt to change the behavior, but that broke the library Lodash and was\
    \ abandoned ([pull request on GitHub](https://github.com/tc39/ecma262/pull/1320#issuecomment-443485524)).\n\
    \n*   Background knowledge:\n\n    *   [Pull request on GitHub](https://github.com/tc39/ecma262/pull/1307)\n\
    \n    *   [Wiki page on ECMAScript.org](http://wiki.ecmascript.org/doku.php?id=strawman:fixing_override_mistake)\
    \ ([archived](https://web.archive.org/web/20141230041441/http://wiki.ecmascript.org/doku.php?id=strawman:fixing_override_mistake))\n\
    \n## 11.4 Which language constructs use definition, which assignment?\n\nIn this\
    \ section, we examine where the language uses definition and where it uses assignment.\
    \ We detect which operation is used by tracking whether or not inherited setters\
    \ are called. See [§11.3.3 “Assignment calls setters, definition doesn’t”](#ch012.xhtml_setters-and-assignment-vs-definition)\
    \ for more information.\n\n### 11.4.1 The properties of an object literal are\
    \ added via definition\n\nWhen we create properties via an object literal, JavaScript\
    \ always uses definition (and therefore never calls inherited setters):\n\n```\n\
    let lastSetterArgument;\nconst proto = {\n  set prop(x) {\n    lastSetterArgument\
    \ = x;\n  },\n};\nconst obj = {\n  __proto__: proto,\n  prop: 'abc',\n};\nassert.equal(lastSetterArgument,\
    \ undefined);\n```\n\n### 11.4.2 The assignment operator `=` always uses assignment\n\
    \nThe assignment operator `=` always uses assignment to create or change properties.\n\
    \n```\nlet lastSetterArgument;\nconst proto = {\n  set prop(x) {\n    lastSetterArgument\
    \ = x;\n  },\n};\nconst obj = Object.create(proto);\n\n// Normal assignment:\n\
    obj.prop = 'abc';\nassert.equal(lastSetterArgument, 'abc');\n\n// Assigning via\
    \ destructuring:\n[obj.prop] = ['def'];\nassert.equal(lastSetterArgument, 'def');\n\
    ```\n\n### 11.4.3 Public class fields are added via definition\n\nAlas, even though\
    \ public class fields have the same syntax as assignment, they do *not* use assignment\
    \ to create properties, they use definition (like properties in object literals):\n\
    \n```\nlet lastSetterArgument1;\nlet lastSetterArgument2;\nclass A {\n  set prop1(x)\
    \ {\n    lastSetterArgument1 = x;\n  }\n  set prop2(x) {\n    lastSetterArgument2\
    \ = x;\n  }\n}\nclass B extends A {\n  prop1 = 'one';\n  constructor() {\n   \
    \ super();\n    this.prop2 = 'two';\n  }\n}\nnew B();\n\n// The public class field\
    \ uses definition:\nassert.equal(lastSetterArgument1, undefined);\n// Inside the\
    \ constructor, we trigger assignment:\nassert.equal(lastSetterArgument2, 'two');\n\
    ```\n\n## 11.5 Further reading and sources of this chapter\n\n*   [Section “Prototype\
    \ chains”](https://exploringjs.com/impatient-js/ch_proto-chains-classes.html#prototype-chains)\
    \ in “JavaScript for impatient programmers”\n\n*   [Email by Allen Wirfs-Brock\
    \ to the es-discuss mailing list](https://mail.mozilla.org/pipermail/es-discuss/2012-July/024227.html):\
    \ “The distinction between assignment and definition […] was not very important\
    \ when all ES had was data properties and there was no way for ES code to manipulate\
    \ property attributes.” [That changed with ECMAScript 5.]\n\n# 12 Enumerability\
    \ of properties\n\n* * *\n\n*   12.1 [How enumerability affects property-iterating\
    \ constructs](#ch013.xhtml_how-enumerability-affects-property-iterating-constructs)\n\
    \n    *   12.1.1 [Operations that only consider enumerable properties](#ch013.xhtml_operations-that-only-consider-enumerable-properties)\n\
    \n    *   12.1.2 [Operations that consider both enumerable and non-enumerable\
    \ properties](#ch013.xhtml_operations-that-consider-both-enumerable-and-non-enumerable-properties)\n"
