  md: '# Perl Web Site Workshop


    u+x means user execute is a symbolic way of saying that the user is allowed to
    execute the program. Similarly, a+x means anyone execute and means, literally,
    that anyone execute the program.


    Setting modes symbolically is easier for most beginners than dealing with octal
    numbers. For the form of the symbolic mode is [user][+][ [permission]. For an
    example, a symbolic set would be typed chmod u+x (see Figure 3.2). This allows
    the owner to execute the file; chmod a+x filename allows anyone to write the file;
    chmod g-w filename takes permission away from the owning group.


    We''ll use the symbolic process in this book, but if you''d like to use the numeric
    approach, feel free to do so—just be certain you''re setting up files with appropriate
    permissions!


