    \ Only scalar values (strings or numbers) can be used as DBM keys and records.\
    \ FreezeThaw translates complex Perl data types into strings, and then back again,\
    \ so it makes it easy to use the data format we want, without worrying about the\
    \ minutiae of storing it in string format and reading back again."
