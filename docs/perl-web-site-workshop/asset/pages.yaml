  md: '# Files You Need


    We''re going to start by installing MySQL. It''s interesting to note that MySQL
    (pronounced "My S, Q, L" not "My Sequel\ although freely available, is a database
    server with profoundly powerful features. It can be used for simple applications,
    as well as very complex, large-scale operations. As mentioned, one of its greatest
    features is its speed.


    To install MySQL:


    +   1. MySQL is available on the CD-ROM accompanying this book. Or, for the most
    recent version, visit http://mysql.com and find a mirror site close to where you
    can download it.


    +   2. Download the recent, recommended MySQL version for your Web server.


    +   3. Install to your server according to the instructions. Make sure to set
    a root password.


    Now you''ll need to download and install the DBl,module from CPAN, if you haven''t
    already done so. You''ll also need to download a specialty module called Msq-MySQL-BDD
    from CPAN.


    To download these files:


    +   1. Visit http://www.perl.com/cpan/ and find the DBl,module, then download
    it to your computer.


    +   2. Download and install Msq-MySQL-BDD module from CPAN (and the modules it
    depends on) on your server, making sure to select MySQL as the database you want
    to use.


