  md: '# Chapter 11 Getting Ready to Learn Perl


    The -w and -d switches are best used for command-line debugging.

    -w prints helpful warnings to the console when you run your script—for example,
    it can catch common errors such as typos in variable names and using = when you
    mean ==, and it will tell you exactly where in your script it sees a problem.
    There''s no reason not to use -w in every Perl script you write.


    The -d invokes a full debugger, that will allow you to step through your code
    line by line, to catch those really intractable bugs.


    Carp and CGI::Carp make runtime bugs much easier, especially in case of CGI::Carp,
    runtime bugs in CGI scripts. No CGI author would even think of starting a new
    script without these modules at hand.


    The strict module''s usefulness is a lot less obvious, but if anything, it is
    even more powerful than the Carp. Strict forces you to use good programming practices:
    declaring all variables before using them, not using named references or bare
    words, among others. It can catch a lot of bugs that don''t look like bugs to
    the naked eye, and prevent a lot of bugs before they happen. You should make it
    a practice to include strict in every script you write. It may seem like a chore,
    but it will save you more work in the end.


    # Get Help


    What do you do when your script isn''t working, the debugging tools aren''t helping,
    everything looks fine, but it just doesn''t work? Who do you call when you''ve
    read all the documentation, you can''t figure out what the heck it''s talking
    about? These are important questions because Perl, as an open source product,
    does not come bundled with a 1-800 support hotline. So where can you turn for
    answers?


    As the astute reader has already guessed, the same Perl community that works together
    to maintain CPAN and Perl itself, is the best place to go for answers to your
    Perl questions. If you have a question that you think is probably common, look
    for the FAQ first. A helpful list is provided for you in the upcoming section,
    “Resources You Want, Stuff You Need.”'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Perl Web Site Workshop


    # Resources You Want, Stuff You Need


    If you have a question that you want to post to a newsgroup, post the code and
    question in the message, and be as specific as possible about what''s wrong, the
    platform and Perl version you''re using, and any other information that might
    be pertinent, wait patiently for an answer. Remember that people who answer your
    question do it out of the goodness of their hearts, and are under no obligation
    to help you, and certainly won''t if you act anything respectful.


    We''ve compiled a list of what we think are the best ways to get us using and
    learning Perl. We''ve included books, Web sites, Newsgroups, and FAQs. As mentioned
    several times in this book, the Perl community is an extremely tight one—and it''s
    there for you.


    # Books


    There are several books that we keep on our desktops and use regularly. They include:


    +   - Sams Teach Yourself Perl in 24 Hours by Clifford Pierce. This is the book
    you want in a Nutshell if you''re serious about learning Perl. It will start with
    the true basics; history, concepts, and the "Hello, World" program. From there,
    you''ll learn how to work with the concepts mentioned at the beginning of this
    chapter, as well as variety of other Perl programming methods. The book contains
    examples so you can practice. The end of the approach CGI programming as a set
    of small building-blocks that you can construct larger programs like those presented
    here.


    +   - Programming Perl by Larry Wall, Tom Christiansen, and Jon Orwant. Also referred
    to as the "Camel", book, once you''ve worked your way through the basics, this
    book is akin to jumping into the deep end of the pond. Larry, the principle architect
    of Perl, explains his motives and wishes for the language as provides a thorough
    reference. You''ll learn to see, and use, Perl like a programmer does. Programming
    Perl provides a lot of detail, and includes an excellent glossary of terms.


    +   - Perl 5: Desktop Reference by Johan Vromans. This palm-size reference includes
    syntax, modules, and debugging information that you''ll find invaluable when working
    with Perl.


    Another, non-Perl-specific book that we use


    +   - Unix in a Nutshell by Daniel Gilly. This desktop reference is a very comprehensive
    and handy book to have around when trying to work with complex Unix commands.
    Molly''s copy was never far from her fingertips while working through Jason''s
    scripts.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Web Sites


    These days, Web sites provide the detailed support that is necessary for any budding
    programmer, and certainly for Web designers. Here''s a selection of our favorites
    for both general and specific development information.


    O''Reilly''s Perl is a good stop for information on new Perl books and products,
    modules, as well as upcoming conventions and conferences, http://www.perl.com/.


    The Perl community is a very active and motivated group, and their official Web
    site is http://www.perl.org. You''ll find job listings, pointers to help and mailing
    lists, and information on local community groups called Perl Monkers.


    Several efforts by the Perl community at educating newcomers are noteworthy. Among
    them, http://learn.perl.org has the best quality moderated mailing traffic for
    answering questions.


    For general design information and resources these great sites:


    +   - Builder.Com. This site from CNET is a terrific resource for Web developers.
    It offers regular features and columns as well as a variety of newsgroups, http://www.builder.com/

    - Ziff-Davis'' DevHead. A favorite of Molly''s, this site offers scripts galore.
    There''s a nice, pointy section for Perl fans, http://www.devhead.com/

    - WebView. This site specializes in thoughtful articles and resources for Web
    developers, http://www.webview.com/

    - Developer.Com. A large technology-oriented site, Developer.Com offers news,
    discussion, and training with a good section on Perl. They also have an "Ask the
    Experts" section that can be quite helpful, http://www.developer.com.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Perl Web Site Workshop


    # Newsgroups


    Perl newsgroups are abundant. The following are widely available via most Internet
    Usenet news services:


    +   - Comp.lang.perl.announce—Perl authors use this group to announce new modules
    or scripts that have become available.

    - Comp.lang.perl.misc—The most active of Perl newsgroups within the “comp” hierarchy,
    this newsgroup offers you the opportunity to ask any Perl question and discuss
    general Perl topics. The topics generally are mid-to-high level and very varied
    in scope.

    - Comp.lang.perl.moderated—This newsgroup offers moderation in order to focus
    on relevant Perl questions from novice and high-level programmers. Posters must
    be registered—if you post to the newsgroup, you''ll be automatically sent details
    on how to do that. All posts are reviewed, so this is a good place to go if you
    have very specific questions.

    - Comp.lang.perl.modules—If you''re looking specifically for Perl or module solutions,
    you can use this newsgroup.

    - Comp.infosystems.authoring.cgi—If you have questions specific to CGI programming,
    but aren''t necessarily about the Perl language this is the place to ask.


    Web discussion groups for Perl abound. One such is PerlMonks (http://perlmonks.org)
    that specializes in teaching Perl development skills through interaction among
    its users. There''s a large amount of working code and discussion on the site—a
    great deal of which concerns CGI programming.


    Use proper newsgroup etiquette when participating in any newsgroup. If you have
    questions about etiquette, check out http://unix1.sncc.lsu.edu/internet/usenet/usenet-etiquette.html


    # Helpful FAQs


    Use the following FAQ offering for Perl references.


    The Perl FAQ—For a comprehensive list of Perl FAQs, begin at http://www.perl.com/CPAN/doc/manual/html/pod/perlfaq.html.
    A copy of the FAQ is shipped with every installation of Perl. To get the FAQ,
    type perldoc perlfaq at a command prompt.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# All We Want to Do Have Some Fun


    Writing a program can be a bit like doing a crossword puzzle. If you know the
    language it''s written in, and have a couple of clues to work with, it can be
    fun, challenging, and downright rewarding to get it right.


    On the other hand, if you don''t know the language, and the clues don''t make
    any sense, it''s just an exercise in frustration and futility. Any American who''s
    tried a British crossword can tell you what that''s all about.


    The key to learning a new programming language, and learning how to program in
    general, is to stick with the fun and challenging puzzles as much as possible.
    You''ll find, in time, that the puzzles at at first seemed frustrating and intractable
    will become much clearer as you solve some ones.


    If you start out with stuff that doesn''t make a lick of sense to you, you''ll
    have a hard time getting anywhere. But wherever you begin, the point is to enjoy
    yourself. The process will be more exciting and the results of your labors will
    be much more gratifying as a result.'
  merge: -1
