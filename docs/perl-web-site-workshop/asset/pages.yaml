  md: '# Chapter 2 Getting Ready to Design with Perl


    # Web Browser


    Everyone has a favorite Web browser. In fact, Jason prefers Galeon, a Mozilla-based
    browser for the GNOME desktop, while Molly tends to work with Microsoft''s Internet
    Explorer more frequently.


    Any Web designer worth his or her salt knows that no matter the favored browser,
    staying current with browsers as well as having several types on to test which
    your designs look, feel, and function is not a frivolity—it''s a necessity.


    You''ll be using Web browsers to run the many scripts provided in this book. So,
    if you don''t have the most recent version of your favorite Web browser, we encourage
    you to have access to other browsers and versions of those you can test your work
    under a variety of circumstances.


    # Keep Your Browser Up to Date!


    Be sure to keep your Web browser current. Here''s where to find the browsers you''ll
    need:


    +   - Galeon: http://galeon.sourceforge.net


    +   - Netscape (all available platforms):

    http://home.netscape.com/computing/download/


    +   - Microsoft Internet Explorer (all available platforms):

    http://www.microsoft.com/ie/


    # Serving It Up


    Your skills are in place. You''ve downloaded your tools. You''re confident and
    ready to take the next step. What do you need?


    Access to a server that supports CGI and Perl.


    To help you make sure your ISP is CGI and Perl enabled and ready to accommodate
    the scripts you''ll be using from this book, we''ve provided the following list
    of questions to ask your ISP.


    +   - What Web server and operating system does your ISP have?

    The scripts contained within this book have been tested on a Unix-based system
    running Apache, and a Windows NT-based system running Microsoft''s IIS.


    > Your current ISP isn''t able to provide access to CGI and Perl for you, you''re
    going to have to look for an ISP who will. The scripts in this book require CGI
    and Perl in order to work.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Perl Web Site Workshop


    +   - Will you be allowed to run your own CGI programs and Perl scripts from your
    Web account? This is a critical concern. Some ISPs offer CGI, but they only allow
    you to access scripts that they have made available. You must be able to add your
    own Perl scripts in order to accomplish the features and functions provided in
    Perl Web Site Workshop.


    The general rule of thumb for your ISP is to not accept user-run scripts, is there
    a way that you can submit scripts for approval? Some ISPs will be flexible on
    the issue if you ask them specifically to approve a script. This is not the ideal
    scenario because you will to run each change and new script by your ISP, which
    can become frustrating! We feel the better choice is to find a more accommodating
    ISP.


    +   - Is Perl installed on this system, and if what version of Perl is it? At
    the time of writing, the current version of Perl is 5.6.1.


    +   - Where is Perl located on your system? Specifically, you want the path to
    where Perl resides. A path will look very much like this: /usr/bin/perl. Specific
    path information will be needed for all the scripts in this book.


    +   - Are any additional Perl modules installed on this system, and if so, what
    are they and what is the path where they are located? Perl modules are a collection
    of functions (mini-programs).


    +   - Where will your CGI programs reside, and do they require a specific extension?
    In general, most ISPs create a specific directory for CGI programs such as /cgi-bin
    or /htbin. However, some ISPs allow you to place them wherever you want. The standard
    extension for CGI is .cgi, and for Perl, .pl. Depending upon how your server is
    set up, you also need to name your CGI programs with a specific extension.


    We''ve prepared a helpful form that you can use to identify what your ISP has
    to offer. This form will also help you as you work your way through this book.'
  merge: -1
