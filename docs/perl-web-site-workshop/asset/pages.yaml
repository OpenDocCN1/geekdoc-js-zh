    variable to calculate the real line number where the error occurred, and

    substitutes that for the line number in the error message.


    The second line in the pair is a fallback, making sure that whatever is

    between at and line in the error message is the name that we want our\users to
    see. One pitfall to beware: the special == operator. If you write


    ```

    $holiday_card -= s/Easter/Passover/g;

    ```


    then you''ll replace all instances of Easter in $holiday_card with

    Passover. But if you write


    ```

    $holiday_card = s/Easter/Passover/g;

    ```


    $holiday_card will now contain the number of times Easter was

    replaced by Passover in the special variable $_


    We also use a regular expression in the following function:


    ```

    $ok_chars = ''[^\ws]''; die "Illegal character(s) in input\n($Val)" unless ($Val
    =~ /^($ok_chars+)$/);

    ```


    we use the // operator: we not just matching, substituting

    more readable: the value of the variable will be interpolated into the

    pattern, just like it would be into a string.


    The ^ and & characters at the beginning and end of the pattern mean that

    the expression must match from the beginning to the end of the script.


    The + after $ok_chars means we want to match at least one\character, with no maximum
    number to match.


    Finally, but most importantly in this case, by putting our pattern in parentheses,
    we use the special variable $1 to whatever matched our pattern.

    We return that match, instead of the original input to the function:

