  md: '# Perl Web Site Workshop


    Working on a script that provides immediate output helps a lot, so try to make
    your first scripts ones that do something–the famous “hello world” is a good start.
    After you''ve begun with a simple script like that, or the ones in our chapter
    on CGI forms, and gotten that working, you can expand it. Then, you can work on
    its features one by one, and build up to something much cooler.


    # Don''t Let the Syntax Scare You


    The first time you see something like this


    ```

    @hits = get { /\/\ & && -d S_ } readdir PWD;

    die "Nothing found" unless @hits;

    ```


    it''s likely to have seeing halo effects and feel the onslaught of a vicious migraine
    approach. Perl is a language that has cultivated more than planned, and as a result
    it doesn''t have the cleanest-looking syntax around. After after you get used
    to a few of Perl''s idiosyncrasies, things begin make a less sense.


    Here are a couple of the most important syntax concerns to keep in mind:


    +   Variable names always start with a variety of characters: $ for scalars (things
    with only one value), @ for arrays, % for hashes, & for functions, and * for typeglobs
    (which are a kind of superreference)


    +   When you''re accessing a member of an array or a hash, you''re really asking
    for a scalar value, and that''s why you write $a[1] and $h{''this''} instead of
    @a[1] or %h{''this''}


    +   You don''t have to use forward slashes (/) in s// or m// state-ments. You
    can use any character you want as the separator-a convenient thing to remember
    when the pattern''re searching for a directory path, or a closing html </tag>.


    Which is easy to read:


    ```

    s|http://\/www.perl.com\/stuff\/things\.html|http://\/

    www.perl.com\/things\/stuff\.html|

    or

    s|http://www.perl.com/stuff/things\.html|http://www.perl.com/things/stuff\.html
    | ?

    ```'
