    } else {\n\n  # something has gone wrong - probably bad input\ndie \"No game id\
    \ submitted. Please start a new game.\"\n}\n```\n\nRestoring a game is fairly\
    \ straightforward. The game state is stored as a record in a DBM file, which makes\
