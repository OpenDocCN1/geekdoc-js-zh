  md: "# Chapter 4 Working with Forms\n\nguestbook.cgi (continued)\n\n```\n# out :\n\
    # description: flock() is a handle, for concurrency-safe access\n# This won't\
    \ work on operating systems (like MacOS) that don't\n# support flock().\nsub lock_filehandle\
    \ {\n    my $fh = shift;\n    my $lock = shift;\n    use Fcntl qw(:flock);\n\n\
    my $lock_code;\n\n    if ($lock =~ /r/i) {\n        $lock_code = LOCK_SH;\n  \
    \  } elseif ($lock =~ /w/i) {\n        $lock_code = LOCK_EX;\n    } else {\n \
    \       $lock_code = LOCK_UN;\n    }\n}\n\n```\n\ngive it two tries\nunless (flock($fh,\
