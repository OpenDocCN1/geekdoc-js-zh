  md: '# Chapter 7 Fun and Games


    # Hit Counter


    Everyone is familiar with the ubiquitous hit counter. Hit counters say to the
    world "Look at my page! I''ve had this many visitors."

    nAppropriate for home pages, hit counters are a lot of fun, especially for HTML
    newcomers. This counter is a bit more sophisticated than many of those out on
    the Web. Automatically figures which page it''s on, using the HTTP_REFERER environment
    variable.


    # Global Variables Used in counter.cgi


    +   This script includes some global variables we''d like to introduce you to
    at point. These variables are used in any scripts that require them.

    * referring pages must come from one of these hosts @HOSTS_ALLOW = (''localhost'');
    This variable is an array of hostnames that you want to allow the CGI script to
    reside on. It works with @DIRS_ALLOW to make sure the counter is only incremented
    when it''s actually used on a page, not just when someone use the URLs or include
    your counter on a page in your server.

    * referring pages must be under one of these dirs # DO not begin with pairs /DIRS_ALLOW
    = (''perlbook/chap_pages''); This code works with the HOSTS_ALLOW variable to
    ensure the increment described above.

    * $FIGURES = 6; This variable sets how many numbers you want the counter to be.
    For example, if the variable is set to 6, your results would look like this: 000026.
    If you set this variable to 4, your results would be: 0026.

    * $FONT = gdiantFont; This variable is specific to GD, and the font counter that
    will display the numbers.

    * $STATS = ''stats''; @BG = (0, 0, 0); @FG=(50, 200, 255); This is the name of
    the DBM database that will store your page statistics. @BG is the background color
    of the counter (red, green, and blue) and @FG is the foreground color.


    This script uses Perl''s built in SDBM to store the hits for each page. SDBM is
    a simple database that comes with Perl and most Unix and related operating systems.
    SDBM allows you to store and retrieve items by key->value pairs. For example,
    if you had a database of cartoon character name, the key would be "Fred" and the
    corresponding value would be "Flintstone". For performance, use GDBM_DB_File modules
    from CPAN. If you decide to use one of those, you''ll have to update the tie statements
    in the script to use the module you choose, according to your perldoc documentation.


    # How to Use


    +   1. Copy the counter.cgi code into your text editor.

    2. Set the path to the library where GD resides.'
