    # chown


    This is “change ownership,” or chown. You''ll use this command to change ownership
    of a file. For the most part, you will probably not have to use permissions. This
    command—but it''s good to know.


    The basic command is chown owner filename.


    If you need to do more complex operations, consult the manual (type man chown)
    for instructions (see Figure 3.3).


    # SUID Scripts


    Sometimes in the course of human events you may need to allow a user to execute
    a script with more permissions than he normally has. One example would be to allow
    an individual to write a file to a directory that the public does not have access
    to.'
