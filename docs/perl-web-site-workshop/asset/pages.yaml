  md: "4. If you put Taintcheck.pm into a private library folder, you will have to\
    \ include the line use /path/to/library; (replacing /path/to/library with the\
    \ actual path to your library folder) in each script you use Taintcheck.pm.\n\n\
    # Taintcheck\n\n```\npackage Taintcheck;\n\nuse Exporter;\n\n$ENV{'PATH'} = '/bin:/usr/bin:/usr/local/bin';\n\
    $ENV{'SHELL'} = '/bin/sh';\n$ENV{'IFS'} = '';\n\n@ISA = qw(Exporter);\n@EXPORT\
    \ = qw(untaint_params untaint);\n\nuse CGI;\nuse strict;\n\n# untaint_params\n\
    # in: CGI object\n# out: untrusted params, or dies if suspicious input seen\n\
    # This version of untaint_params supports multi-valued parameters.\n# It calls\
    \ untaint() on each of the values.\nsub untaint_params {\n    my $sq = shift;\n\
    \    my (@k, $sk, @tmp, $t, @safe) = @\n    @k = $sq->keywords;\n\n    foreach\
    \ $k(@k) {\n        @tmp = ();\n        push @tmp, $sq->param($k);\n\n       \
    \ foreach $t(@tmp) {\n            push @safe, untaint($t);\n        }\n      \
    \  $sq->param($k, @safe);\n    }\n}\n\nuntaint\n# in: untrusted scalar\n```"
