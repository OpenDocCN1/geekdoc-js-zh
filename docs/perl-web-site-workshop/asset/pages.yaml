  md: "# Perl Web Site Workshop\n\nNext, we'll try to actually send the message. We\
    \ create a new Net::SMTP object, which initiates a connection with the server\
    \ set in the $SMTP_SERVER variable. We go step-by-step through the process of\
    \ sending a message, making sure that the mail server will accept the sender,\
    \ the addres, and the message data.\n\nAll our dealings with the mail server are\
    \ enclosed in an eval{} block, so that we can easily end our attempt at time by\
    \ dying with an error message. We want to be able to send a custom failure page,\
    \ so we don't want to die all the way out to the main eval{} block, and catch\
    \ any mail server errors right. If something has gone wrong, we save the error\
    \ message in CGI parameter, and return a false value. Otherwise, we return true.\n\
    \n```\n# send_message\n# in: reference to message hash, CGI object\n# out: success\
    \ or failure\n# description:\n# tries to send the message. If it fails, it\n sets\
    \ a CGI param('err_str') and returns FALSE\nsub send_message {\nmy $m_ref = shift;\n\
    my $0 = shift;\nmy $smtp;\n```\n\n```\n# catch any errors here, so that the user's\
    \ failure page\n# will be displayed, instead of the default error message,\n#\
    \ if anything goes wrong.\neval {\n$smtp = Net::SMTP->new($SMTP_SERVER);\n```\n\
    \n```\n# make sure we connected\ndie \"SMTP server not responding\" unless $smtp;\n\
    # tell the server we're sending from\n$smtp->mail($m_ref->{'from'}) ||\ndie \"\
    Server did not accept sender's address\"; }\n```\n\n```\n# ... and who were sending\
    \ to\n$smtp->to($m_ref->{'to'}) ||\ndie \"Server did not accept recipient address\"\
    ; }\n```\n\n```\n# and finally send the message itself\nunless ($smtp->data(\"\
    To: \" . $m_ref->{'to'} . \"\\n\"\n\"Subject: \" . $m_ref->{'subject'} . \"\\\
    n\"\n\"\\n\"\n$m_ref->{'body'}\\)) {\n\n$smtp->quit;\n```"
