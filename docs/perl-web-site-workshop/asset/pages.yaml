  md: "# Detecting and Routing Browsers\n\nThe script in this section will detect\
    \ browsers by determining the identification of that browser. Then, the script\
    \ returns information to the server. At that point, the information is tied with\
    \ the upcoming script. Once the browser is effectively detected, you can then\
    \ route it to pages appropriate for the browser type and version.\n\n# How to\
    \ Use\n\n+   1. Copy the code into your text editor.\n\n+   2. Save the code as\
    \ browser_detect.cgi.\n\n+   3. Place the form in your cgi-bin directory on your\
