  md: '# Perl Web Site Workshop


    Figure 1.3


    This form is processed using Perl.


    ![](img/d26997dc0c0571017b4729525ba1a4ac_18_0.png)


    Is Perl the only language that can be used with CGI? The answer is no. Other languages,
    such as C, are also used at the end of the CGI pipe. However, Perl remains the
    most flexible, easy to use, and common language utilized for this purpose.


    # What''s in Store


    Forms might be the most familiar way Perl is used on the Web, but Perl can do
    a lot more than just manage forms. Let''s take a look at the various things you''ll
    learn from this book in terms of making Perl work for you.


    # Features and Functions


    Check out Chapter 4, "Working with Forms," for how to use Perl to set up a variety
    of functional and attractive forms for your Web pages.


    To help you manage your scripts, and your Web site more effectively, we''ve provided
    you with some very helpful tools. You''ll find scripts that help you manage other
    scripts on your site, utilities to rename files behind the scenes, check links,
    squash bugs, and validate code.'
  merge: -1
