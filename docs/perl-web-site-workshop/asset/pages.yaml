    # Cookies


    Want a cookie? We prefer chocolate Milanos, and we can assure you that numerous
    cookies were eaten during the writing of this book!


    Cookies, in Web development terms, are small scripts that save information to
    visitor''s hard drive. This can help the designer customize the way a site behaves
    during future visits. For example, with cookies, you can create a site that welcomes
    visitors back by name, tracks purchases, or saves the visitor''s place from where
    they were during during the last visit (see Figure 6.2).


    For a Perl programmer using CGIp, using Netscape''s "magic cookies" to keep a
    bit of information on a user''s computer is very easy. Hard-coding your HTTP headers
    to produce cookies that work can be very difficult, CGlm takes all of the heavy
    lifting for you. The same is true for reading cookies. A script to read a cookie
    from the user''s browser can be short and simple as this:


    ```

    #!/usr/bin/perl


    use CGI;


    my $q = CGI->new;


    my $cookie = $q->cookie(''dwp_test_cookie'')

    // Cookie has not been set;


    print $q->start_html("Cookie Reader");

    print $q->p("Cookie: " . $cookie . "");

    print $q->end_html();

    ```


    Cookies have gotten a bad rap. Unshooled individuals think that cookies can steal
    personal information from them, and then this information can be used for marketing
    or other purposes by the host site. This isn''t entirely true. Cookies retrieve
    information, but they save it to the visitor''s computer, not the other. This
    is why they are generally safe to use.


    However, advertisers at several Web sites can use cookies to track your progress
    from one site to another.


    Actually, of that script is dedicated to printing out the Web page that shows
    the cookie value, not reading the cookie itself.'
