- img_proc: true
  md: 'Now that you''ve relaxed with some fun games, it''s time to dig deep into the
    power of Perl in the context of Web publishing. In this chapter, we''re going
    to show you how to begin making your Web site do updates and changes without you!
    You only need to set things up, add fuel from time to time, and let the publishing
    system you''re going to create here do all the hard work.


    Let''s say you currently publish, or want to publish, a Web site that has a standard
    design and layout in place. For a site of that nature, it makes sense to use this
    publishing system instead of hand-coding the various components. It saves time
    and can actually reduce error because the Perl code does the thinking for you.


    It''s important to understand that you''re working with some essential pieces
    that work together to create the system. These components include:


    +   - Raw text, formatted in a standard way

    - HTML templates that call fields from the text files

    - Perl modules—you''ve already worked with these and know that they are essentially
    scripts that call other scripts

    - Perl scripts that pull together the aforementioned components and assemble the
    resulting page


    Think of the publishing module as a group of individual stories that can be modified
    in a variety of ways. Even though the basic structure of the system will require
    careful and appropriate setup, you can get as creative as you want with the system.'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'Ultimately, the type of site that we create from the site that you create is
    going to be very different in appearance and content, but the way it works will
    be very similar.


    # Setting Up Dictionaries


    Before we get into the nitty-gritty of scripts, we want to make sure you''re able
    to set up your system appropriately. Begin first by creating a directory hierarchy
    on your system. Figure 8.1 shows a chart that demonstrates the way the directory
    is set up.


    With a clear idea in mind as to the geography of the system, here''s a step-by-step
    to help you in getting the structure in place.


    +   1. FTP to your root directory, using your FTP client.

    2. Create a new directory within the root directory and call it images. This will
    be where all of your site images pulled from the templates will go.

    3. Create another directory, and name it Publisher.

    4. The third directory you should make be called stories.

    5. A directory called “Story” should now be created. Inside this directory, create
    *another* directory and name it Text.

    6. Finally, create a directory tmpl. Your templates will go in this directory.


    When this is set up, you''ll want to begin thinking about the content of your
    site and how it is arranged. This is handled by the creation and placement of
    raw text and HTML templates into the system.'
