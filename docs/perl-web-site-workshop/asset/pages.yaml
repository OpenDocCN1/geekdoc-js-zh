  md: '# # Chapter 1 Perl on the Web


    # ## Customizing Sites


    Perl can help the Web designer add a range of customized features

    the pages that site visitors see.


    Perl enables you to create time and date stamps. This is helpful in

    greeting visitors, and giving your pages the appearance of being

    lively and fresh.


    It''s very likely you''ve seen comments on Web pages as "page

    last updated on . . . This, too, can be done with a Perl script, and

    also serves to keep audiences aware of a site''s timeliness.


    You can find scripts for Web

    site management tools in

    Chapter 5, "Features and

    Functions."


    Cookies play an enormous role in helping a user track activity

    in his browser. We will introduce you to a simple cookie and

    show you how to use it to make a customized guestbook.


    Much of customization relies

    on browser detection and

    routing, which we teach you

    how to do with CGI and Perl

    in Chapter 6, "Customizing

    Pages."


    Would you like to offer a different graphic selected at random from

    a list each an individual visits your Web page? With time-

    based functions, this will give the appearance of custom material.

    Moreover, this effect can be used with great creativity, offering

    playful or intriguing effects for your site visitors. Randomization

    can be achieved using server-side includes. We''ve added all of these

    techniques and related issues to Chapter 6.


    # ## Fun Stuff


    Certainly, the Web has been and will probably always be a tool. We

    use it for many reasons, but honestly, if the Web weren''t fun, we

    really be here? The appeal of the Web is not just about shopping

    and information convenience. We have a good time!


    If you''re looking to create a little rest and relaxation for your site

    visitors, we''ll show you how to add fun stuff such as polls and inter-

    active stories to your pages. Just drop by Chapter 7, "Fun and

    Games," for the necessary scripts and modifications.'
  merge: -1
