    # Hang That Man!


    Our dearest script in this chapter is the classic Hangman game (see

    Figure 7.4). This script illustrates a very important technique in CGI

    programming: saving state. The saving state concept is very important to learn
    and understand in general, and it''s easy to envision it

    through the demonstration of this game.


    A cool way to use the poll is

    in an SSI include—that way

    You include the ballot, or

    the results, inside of another

    page very easily. See Chapter

    6,"Customizing Pages," for

    more information on SSIs.'
