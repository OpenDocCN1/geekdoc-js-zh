  md: "# Perl Web Site Workshop\n\nHere's a life-lesson for the budding programmers\
    \ out there: The end, from the user's perspective, is often just the beginning\
    \ of the work for you. In this case, there are a few functions left, functions\
    \ that do important work behind the scenes.\n\n```\n$q->start_html('Form submitted');\n\
    $q->h3('Your information has been submitted successfully');\n$q->dump;\n$q->end_html();\n\
    \n} else {\n    if There was a 'fail_url' field, send the user there.\n    # Otherwise,\
    \ send the default failure page\n    if ($q->param('_fail_url')) {\n        print\
    \ $q->redirect($q->param('_fail_url'));\n    } else {\n        # The default failure\
    \ page: the main error page\n        error_page($q->param('err_str'));\n    }\n\
    }\n```\n\nWe've taken the standard error page output from our previous scripts,\
    \ and encapsulated it into a function of its own. This enables us to output the\
    \ error page at any time, from any place in the script, without repeating a lot\
    \ of code.\n\n```\nerror_page {\n# in: error message\n# out:\n# description: outputs\
    \ error message to browser in simple HTML page\nsub error_page {\n    my $msg\
    \ = shift;\n    chomp($msg);\n}\n\nuse $START to determine the real line where\
    \ the error occurred\n$msg = s/\\(eval\\) line (\\d+)/\\$(CGI . \" . line . \"\
    \ . (\\$ START-\\$1)/e;\n$msg = s/( at ) . ( line )/\\$(CGI\\$2)/;\n\nprint <<ERR;\n\
    Content-type: text/html\n\n<html>\n<head><title>Error</title></head>\n<body>\n\
    <h1>Error</h1>\n<code>$msg</code>\n</body>\n</html>\n```"
