  md: '# CHAPTER Scripting Basics

    3


    Before we dig into working with Perl scripts, there are some basic concepts you''ll
    need to know. First, it''s a good idea to find out whether Perl is installed on
    the server with which you''ll be working— and if it is, version of Perl is installed.


    There are a number of file types you''ll be using throughout this book. Some of
    these file types may be familiar; others will be new to you. We''ll cover what
    these file types are, how they''re named, and any custom or convention regarding
    the file types you''ll need in order to use them properly.


    Once you''re certain that Perl is set up properly, and to understand the various
    file types you''ll be using, it''s important to set up file directories. If you''re
    not already accustomed to doing this— particularly in the non-graphical terrain
    known as Unix—we encourage you to get some practice with this. Set up files, delete
    them, set them up again until you got the hang of it.


    File permissions play a critical role in the various scripts in this book. If
    you set file permissions improperly, you may end up with scripts that function
    incorrectly, or not work at all. We''ll help you understand how to set up file
    permissions and use them appropriately.


    The Comprehensive Perl Archive Network (CPAN) is an online resource that will
    be invaluable to you as you work through this book—and as you make your way on
    your with Perl. We''ll discuss what its role is, where you can find it, and some
    of the features that make it such an essential part of any Perl user''s toolbox.


    Finally, because Perl is so often connected with Unix, we''re going to provide
    a number of Unix resources and Web site addresses that will help you understand
    more about Unix, what it is, and how to use it effectively.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Checking for Perl on Your Server


    Let''s begin by finding out whether Perl is resident on your server, and if so,
    what version is running. To do this, log on to your server or your ISP account
    using a Telnet connection and type

    perl -v


    from the command prompt. The version of Perl that is resident on your server will
    appear (see Figure 3.1).


    ![](img/d26997dc0c0571017b4729525ba1a4ac_35_0.png)


    ```

    molly@envy:~/usr/home/molly$ -v

    This is perl, version 5.005_0 built for i386-freebsd

    Copyright 1997-1998, Larry Wall

    Perl may be copied only under the terms of either the Artistic License or the
    GNU General Public License, which may be found in the Perl 5.0 source kit.

    Complete documentation for Perl, including FAQ lists, should be found on

    this site using ''man perl'' or ''perldoc perl''. If you have access to the

    Internet, point your browser at http://www.perl.com/, the Perl Home Page.

    molly@envy:~/usr/home/molly$

    ```


    The most recent Perl version, as of this writing, is 5.6.1. Perl 5.005 is perfectly
    acceptable in cases, but if you find that you have an earlier version on your
    server, you should consider upgrading, or asking your server administrator to
    do that for you.


    If you want to get the most recent, stable version, visit http://www.perl.com
    and follow the instructions there for upgrading the Perl software on your server.


    # Understanding File Types


    There are many file types that you can encounter in your development travels.
    In this section, we''ll hone in on those you''ll be using specifically with this
    book. We''ll let you know the general'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Perl Web Site Workshop


    permissions recommended for the file type, and give you an idea where certain
    files reside already, or should be placed in order for the scripts in this book
    to run properly.


    # .pl


    This is the file extension for a Perl script. Perl files are run from the command
    line or called from other operations such as CGI (see the next section). Perl
    files must be executable by the owner–we show you how to do this in the upcoming
    section of this chapter titled “Setting File Permissions.” You can also have Perl
    files be executable by others, but Perl files should be writable by only the owner.
    Perl files must also be readable.


    # .cgi


    These are Common Gateway Interface (CGI) script files. Visitors to your Web site
    can access these directly using their Web browsers, or from the context of an
    HTML page.


    These should be readable and executable for all users, but writable for only the
    owner.


    # .pm


    Perl modules are libraries of code that you can include in .cgi or .pl scripts
    to add functions to those scripts. Modules can also define classes for use in
    object-oriented programming. Modules that come with Perl are generally found already
    in residence in the /usr/lib/perl directory on your server. Modules that you install
    will go in either /usr/lib/perl/site_perl, or into a Perl library directory that
    you create yourself.


    Unlike Perl files, Perl module files are not executable scripts, and don''t need
    any special permissions beyond being readable for all users, and writable for
    only the owner.


    # .html, .htm


    These are HTML files and are in most cases publicly accessible. Typically, HTML
    files reside in the root directory and any appropriate subdirectories on your
    server.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Chapter 3 Scripting Basics


    Note that the .html extension is the one that we use. The .htm extension came
    about as a result of Microsoft''s early limitations on file suffixes. Although
    you can use either depending upon your server configurations, we recommend sticking
    to the .html convention unless your systems administrator requires you to do otherwise.


    # Creating File Directories


    File directories are the locations where files are stored on a server. The “root”
    directory is the first directory in the tree, and subdirectories are created beneath
    it.


    At a minimum, you''ll need two directories to run the scripts in this book—one
    in which to keep your CGI scripts, and another in which to keep command-line scripts.
    If you do not root access—sometimes occurs when you''re one of many members on
    a large service provider''s server—you''ll need to create a third directory for
    modules and other library files.


    > Many ISPs give you access to their cgi-bin directory, the directory where CGI
    scripts go. If you have access to this, you won''t need to create one of your
    own. You will need to record the correct path and add that to your scripts wherever
    necessary.


    # About the CGI Directory


    The cgi-bin directory is where you''ll place the majority of your CGI scripts.
    This directory, the others, should not be placed in your regular HTML documents.
    One common setup is to keep your regular HTML documents under /home/htdocs/html,
    and your CGI scripts in /home/htdocs/cgi-bin.


    You''ll have to follow the configuration directories for your Web server to set
    up the cgi-bin directory to allow execution of scripts.


    If you use Apache, make the following appears in your main server configuration
    file. This file is named httpd.conf and is generated by Apache upon installation
    to the conf directory under the Apache installation prefix.


    ```

    ScriptAlias /home/htdocs/cgi-bin /cgi-bin

    <Directory /home/htdocs/cgi-bin>

    options +ExecCGI

    </Directory>

    ```'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Perl Web Site Workshop


    If you want to keep some CGI scripts in directories other than cgi-bin, you''ll
    have to configure your Web server to recognize all files that end in .cgi scripts.


    If you''re using Apache, you can do this by making these lines appear in your
    httpd.conf:


    ```

    (1)AddHandler cgi-script .cgi

    ```


    # Setting Up a Perl Script Directory


    Do not put command line Perl scripts in your cgi-bin directory. If you do, you
    open up your server to dangerous hacker activity. Think security!


    CGI scripts are only half the story of Perl on the Web. Perl is also tremendously
    useful on the back end, and in this book there are several utility scripts that
    you''ll run from the command line on the server.


    A good choice for a utility script is the bin directory in your home directory.
    If you have root access, you could choose instead to put scripts in /usr/local/bin.
    Because a lot of other software installs it there, wading through a bunch of other
    programs to find yours may be confusing. Therefore, we recommend using the subdirectory
    ~ beneath your home, or root, directory.


    # Making a Perl Module Library


    If you have root access, put all your modules in the pre-existing /usr/lib/perl/site_perl.


    The Perl library is where you''ll keep the modules you create yourself following
    our examples, and any outside modules you install.


    If you don''t have root access, or you don''t want to put your modules in site_perl,
    you''ll need to create a Perl library directory.


    If your Web document root is /home/htdocs/www, a good choice for this would be
    /home/htdocs/lib/perl.


    # Setting File Permissions


    You need to learn a few commands and concepts that will help keep your site secure,
    and make it possible for you to allow site visitors to do exactly (and *only*
    exactly) what you want them to be able to do when they access your site.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Chapter 3 Scripting Basics


    If you''re unfamiliar with Unix, the information in this section may seem confusing
    at first. But bear with us—we show you how to do step-by-step as we take you through
    the scripts, so you''ll get the hang of it. But we still feel that some background
    is of great importance here.


    For more help with Unix, see the resource list at the end of this chapter.


    Unix is a multi-user operating system, and as such, it has the concept of the
    “owner” of a file built into it. Generally, the owner is the creator of the file.


    Because Unix was designed to allow multiple users (who might not know or trust
    each other) to work together on the same computer, also includes the concept of
    file “permissions,” which allow you to determine who can do with your files.


    # chmod


    Change mode, or chmod is the command you use to change the permissions (or mode)
    of a file. You can only use it on files that you own, unless you have root permissions.


    From the command line, you use chmod mode filename, where mode is either numeric
    or symbolic setting for the permissions you want to give, and the filename is
    the name of the file for which you are setting the permissions.


    The numeric modes are three- or four-digit octal (base 8) numbers, like 0640 or
    755. The first digit from the left (if present) sets special bits, making the
    file execution SID or SGID (Set User ID and Group ID). The second sets permissions
    for the owner of the file, the third for the owning group, and the last for all
    other users. The numbers are a combination of three bits, with values of 4, 2,
    and 1. If a number has a 4 in it, you can read the file. If it has a 2, he can
    write to (and delete) the file. If it has a 1, she can execute that as a program.


    For example, chmod 777 file.pi gives all users permissions for the file. chmod
    744 filename means the owner can read, write, and execute, but everybody else
    can only read. chmod 755 filename means (the mode you''ll use for CGI scripts)
    means that the owner can do anything, and all other users can only read and execute
    the file.'
