- img_proc: true
  md: 'Many Web designers are finding out that to add solid functionality to their
    sites, they need to learn to integrate design goals with server solutions. Perl
    is an extremely powerful and flexible way to help designers achieve their goals.


    In this book, we''ve created a Web site workshop that provides all the scripts
    and programming you need to put Perl into action right away. Whether you are a
    designer, or anyone interested in adding functionality to a site using Perl, this
    book takes a very practical approach.


    Instead of starting out by learning the language, the book is divided into chapters
    that focus on different applications that a Web developer might want to include
    on his or her site: forms, games, and more advanced techniques. These scripts
    are ready to go, and the reader need only follow step-by-step instructions to
    help install and modify them to individual tastes.


    Along with the book comes a CD, choked full of Perl, Perl modules, and the book''s
    scripts.


    The book works as a practical device to empower readers with the ability to add
    multiple levels of functionality, doing so while keeping cross-browser and platform
    concerns in mind. But, ideally, the workshop will serve also to inspire the reader
    to want to learn more about Perl so as to empower him or her to grow in skill
    and understanding of the role of Perl in Web design.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# CHAPTER Perl on the Web


    Web designers are naturally focused on client-side design and technology. Often,
    they are wary of the complexity they perceive involved with server technologies.
    Compounding their concern is that many books and articles geared towards the Web
    designer gloss over the details regarding server technologies, preferring to recommend
    a visit to the systems administrator or Internet service provider (ISP) instead
    of providing straightforward details.


    The plain truth is that designers can use Perl to create fantastic interactivity
    for site designs. Granted, you might not become the next Perl programming guru
    (well, if you want to), but certainly you can use Perl to work enhancing your
    designs. We''ve written Perl Web Site Workshop to help you accomplish just that.
    Our goal is to give designers access to one of the best, most powerful, and widely
    available scripting languages on the Web.


    Perl is responsible for strengthening many of the behind-the-scenes features of
    the Web. Most of today''s cutting-edge Web sites, such as Yahoo! and Amazon, use
    Perl in some way or to maintain sites, connect to databases, process forms, or
    allow for customization of pages.


    Perl is extremely accessible and powerful. As you''ll learn in upcoming chapters,
    you don''t have to be a Perl programmer to make Perl work. You just have to understand
    some basics, which we''re going to provide to you, step-by-step.


    Furthermore, Perl scripts are fairly easy to modify (we''ll show you how to do
    that). And, if you should become inspired to actually learn Perl, it''s a fun
    language to be involved-endorsed by passionate supporters and contributors who
    have made and continue to keep Perl available to all who are interested.


    If you''re concerned that Perl is out of your grasp because you''re not a computer
    programmer, don''t worry! We''ve designed this book with the non-programmer in
    mind. We''ll walk you through all you need to know to get the scripts in this
    book working on your Web sites quickly and with ease.


    To help you understand why Perl is the language of choice for many Web programmers,
    we''re going to provide in this chapter:'
  merge: -1
  pgno: 12
- img_proc: true
  md: '+   - A basic description of Perl

    - A discussion of the main differences between browser technology and server-side
    technology

    - An explanation of Perl''s critical partner in Web adventures: the Common Gateway
    Interface (CGI)


    We''ll also take a look at which servers support Perl, and give you a taste of
    what this book has to offer in terms of Perl on the Web.


    # # About Perl


    Perl''s accessibility is in large part due to the altruism of its father, Larry
    Wall. Its technical origins are varied, and include the programming language known
    as C, and a Unix scripting application called awk. Larry Wall was challenged by
    the limitations found in the Unix tool environment, so he began creating Perl.


    Wall then thrust his newborn language into the wild frontier of the Usenet Internet
    newsgroups, where he met with countless bits of commentary and feedback—much of
    which has since been incorporated into the language, currently in its fifth version.
    At writing, the stable version is 5.6.1 and the experimental developer version
    is 5.7. This development version is not recommended for standard production environments.


    You can install Perl right off the CD included with this book—we''ve included
    latest versions for Microsoft Windows, Macintosh, and Unix. Or you can download
    the absolute latest version of Perl


    Supporters of Perl have a tight-knit community and an entire culture that has
    grown up around it. It''s kind of hard to believe that computer technology is
    responsible for inspiring such devotion. It happens, though—look at the enthusiasm
    of Macintosh users!


    ```

    www.perl.com/pub/language/software.html

    ```


    Perl is another great example of such enthusiasm. There are many free books on
    Perl, Web resources and free script repositories abound, and extremely active
    newsgroups are available to help others get involved and use Perl to its fullest.
    The best of'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Perl Web Site Workshop


    place to begin is at http://www.perl.com. You''ll also want to visit http://www.perl.com/CPAN/
    get Perl, Perl documentation, and plenty of FAQs.


    Perl, to the delight of all, is free. It''s a very democratic language, really.
    It''s supported by its users, and its modules and documentation (not to mention
    aspects of the language itself) have all been written by volunteer enthusiasts.
    It conforms, to anything, to the concepts and beliefs of open source.


    # About Open Source


    Open source is a term used to describe software that is developed to be freely
    shared, partially improved, and redistributed by others. Open source software
    has been around for some time, but it has recently gained an increase in awareness,
    particularly through recent industry recognition of Linux.


    Perl was created with Unix in mind. However, the language has been ported to just
    every popular platform, including Windows, Macintosh, VMS, MS-DOS, and even Amiga.


    # Server Versus Browser


    Two of the important premises of the open source movement are that open source
    software must be redistributed without restriction, and that any source code changes
    to the software itself must be made available to the community. Perl adheres to
    these principles.


    To understand how Perl works on the Web, it''s important to understand the difference
    between server-side programming and browser--, or client-side programming, as
    well as the general relationship between Web servers and Web browsers.


    Web designers who have been around for a few years will remember server-side imagemaps.
    Maps required the server to process the map''s coordinates to enable them to work--this
    is a familiar example of server-side programming.


    A bit later JavaScript, which opened up scripting on the client, or browser, these
    days we can choose a variety of methods to achieve an end goal, but the fact remains
    that Web servers and Web browsers rely on one another in an increasingly complex
    and integrated relationship.


    Web servers and Web browsers work hand-in-hand to deliver the information that
    ultimately ends up on a Web page visitor''s screen.


    When a Web site visitor makes a request by typing in a URL address or clicking
    on a link, the browser sends the requested document to the server. In the simplest
    and most common of situations, the server sends this request to the browser, which
    interprets and displays it on the visitor''s screen. Requests are usually for
    HTML documents or graphic files.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Chapter 1 Perl on the Web


    ![](img/d26997dc0c0571017b4729525ba1a4ac_15_0.png)


    To extend and enhance the capabilities of the Web, server-side programming and
    browser-side programming were added to this method of exchange.


    When a browser makes a request to a server, the request can be for a document,
    or it can trigger a server-side program as a Perl script to run on the server.
    If a program is triggered on the server side, the browser maintains a connection
    with the server while the program runs. Once the program is complete, the results
    are sent to the browser, all ready to go.


    In the case of browser-side programming, such as JavaScript, the browser sends
    and receives a request from the server as usual. The requested document contains
    a browser-side program, this program is executed within the browser.


    So, a server-side program runs on the server, whereas a browser-side program runs
    within the browser.


    At one time, server-side programming wasn''t a preference, it was the only choice.
    Browsers weren''t sophisticated enough to manage complex tasks on their own. Their
    job was merely to provide a window with which to view a Web-based document.


    The past few years have seen enormous changes in browser technologies. Ferocious
    competition and a hungry public have caused browser developers to expand the browser’s
    power. Now, developers and designers have a growing range of choices to make about
    where and how to run applications.


    There’s ongoing debate as to which is better. When browser-based technologies
    came on the scene with some force, as was the case with JavaScript, professional
    opinion swayed by the browser side advantage.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Perl Web Site Workshop


    However, the use of browser technologies such as JavaScript means that each time
    upgrades to the language occur, upgrades to the interpreter—which resides in the
    browser—must occur as well.


    Server technology doesn''t have this problem; when a new version of a language
    becomes available server side, browsers can still deal with the output the technology
    isn''t relying on the browser''s intelligence.


    So which is better, and which do you want to use? The answer depends on your needs.
    Each method has pros and cons, and you may even need to use both to achieve your
    particular goal. Because this book is about Perl and specific to programs that
    run on the server, we will fill almost exclusively on server-side programming.


    # Advantages of Server-Side Programs


    +   * Unlike client-side programs, server-side programs will always run. Older
    browsers do not support many browser-based programs such as JavaScript, and newer
    browsers allow you to disable browser-based programs. This is not a concern when
    using server-side programs, because they run on the server and are independent
    of the browser.

    * Server-side programs allow you to read and write to databases, or local files
    on the server. With server-side programs, you can save information about visits,
    query databases, and create custom pages among other activities. Browser-side
    programs do not allow for these applications.


    Perhaps significantly, browser-based technologies rely on specific browsers and
    specific browser versions to perform well—if the browser supports those technologies
    at all.


    This creates the greatest challenge faced by designers today: how to make sites
    interesting but consistent ways between platforms, browsers, and browser versions.
    As a result, many professionals are looking back to the server to provide the
    stability necessary to accommodate the needs of today''s best sites.


    # Perl and CGI


    Most of the scripts in this book are designed to run as CGI programs (or just
    "CGI") for server. CGI stands for Common Gateway Interface, is not a language
    like Perl; it is a protocol for how a Web server interacts with applications or
    scripts. CGI is the oldest, and most broadly compatible, with of adding interactivity
    to a site, and can be used with programs or scripts written in any language, and
    is "spoken" by almost every Web server. There are other ways of running applications
    that offer higher performance—some of those, like Apache/mod_perl, can be used
    with the scripts in this book; others such as PHP or JSP, require languages other
    than Perl, and will not work with your scripts.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Chapter 1 Perl on the Web


    The technical details of how CGI passes information to and from your scripts are
    not important to delve into here. The point to keep in mind is that a CGI, unlike
    a static HTML page or image, is a program that runs on the server each time it
    is requested by a user. It receives, from the Web server, all the form input and
    cookies that the user enters (or her browser sends), and the output of the program
    is sent back to the Web server, just as the contents of an HTML page are sent.
    Unlike that static page, what is sent back may differ for each user, or each time
    the CGI is requested.


    ![](img/d26997dc0c0571017b4729525ba1a4ac_17_0.png)


    # CGI Resources


    Use these selected CGI sites if you''d like to learn more about CGI.


    The Common Gateway Interface Overview:


    +   - http://hoohoo.ncsa.uiuc.edu/cgi/intro.html (introduction)

    - http://hoohoo.ncsa.uiuc.edu/cgi/primer.html (primer)


    CGI City


