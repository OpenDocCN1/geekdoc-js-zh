    # What''s Up Next


    We hope you had fun learning to work with graphics, polls, and a classic Perl
    game. Now it''s time to get very serious and look into how to design pages with
    templates.


    Using templates enables you, as the designer, to automate many portions of your
    Web site. In Chapter 8, "Designing with Templates," you''ll learn to create Web
    templates, and, using the intelligence of Perl, you''re only required to add text
    to automatically update pages.'
