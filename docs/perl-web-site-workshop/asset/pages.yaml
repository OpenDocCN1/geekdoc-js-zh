    # # Last Modification of Page


    A more useful date and time, for your Web site users, than the the current time,
    is often the last modification time of the page they’re browsing. Luckily, the
    Web server sets an environment variable with just that information.


    last_mod.cgi


    ```

    #!/usr/bin/perl

    print "Content-type: text/html\n", $ENV{LAST_MODIFIED}";

    ```


    The native formatting of the modification date might not be the format you want
    your users to see. So, to get a different format you could either get the stats
    on the file yourself and use the date_string() function, or you could use the
    Date::Manip module from CPAN, which can interpret and output all kinds of date
    and time formatting, to rewrite the environment variable into a format you like.'
