  md: '# Perl Web Site Workshop


    It is critical that you are, very careful about what you put in this list. Any
    file in any directory in this list can be overwritten at any time by anyone smart
    enough to spoof an e-mail address, so we urge you to be careful.


    This is compared to the last Received From: line in the mail header, if you use
    POP mail from client machines, you''ll need to add the IPs of all the client machines,
    not the IP of the mail server. For $AUTHORIZED_SENDER, add the full e-mail addresses
    from which you will accept messages. For $AUTHORIZED_DIR, a list of those directories
    under which you allow files to be created.


    Now, set the $PASS to some obscure (but relevant to you) phrase. This is the final
    line of defense—each submitted story must contain the $PASS, in brackets {}, somewhere
    in the TEXT field (it''ll be stripped during processing).


    Finally, set the $NOTIFY to the e-mail address of the Webmaster, or other person
    who should be notified of changes to the site. This address will be informed of
    all successful, and all failed, submissions to epub.pl.


    If you''ve done everything right, you should have a safe, powerful method of updating
    your site directly using e-mail.


    # Publishing a Full Directory


    The publish_dir.pl script is another useful script for managing updates. This
    script will publish an entire directory of stories to a target directory, as well
    as publishing a separate table of contents page. This page includes the title
    and author of each individual story, offers a summary of the story, and automates
    a link from the contents to each story.


    # How to Use


    +   1. Copy the script into your text editor.

    2. Save the script as publish_dir.pl

    3. Place the script in the root directory on your server.

    4. Make the script executable by user:


    ```

    Chmod u+x publish_dir.pl

    ```'
