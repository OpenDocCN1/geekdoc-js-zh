    # Bug Checking


    This script demonstrates how to employ the useful CGI module from CPAN to check
    your scripts for errors. The information that Carp provides you is much more user-friendly,
    particularly for the non-programmer. If you don''t have it in your scripts, you
    will have to search for the displayed error (see Figure 5.3) on your server''s
    documentation. In many cases, this information isn''t available to you. Rather,
    your ISP''s system administrator has it, and may not be able to get the information
    to you.


    Adding bug checking will give you real information, right into the server. This
    script is a revisit of the first_oo.cgi form you worked with in Chapter 4. However,
    we''ve stuck an error in there to walk through the experience of debugging your
    scripts.


