  md: "# Chapter 9 Creating Your Own Portal\n\nBecause we're dealing with more than\
    \ one set of stories, building the page is more complex than it was in Publisher::Index.\
    \ We have to step through the story_sets hash, building for each template object\
    \ constructed (formatted as item_tmpl). Each must contain the full formatting\
    \ of the HTML block from set_tmpl.\n\nThen we assign those HTML blocks to variables\
    \ in the main page template, using the name of the set as the variable name. It's\
    \ a mouthful to explain, but we promise it's easy to use. Simply put, the name\
    \ of a story in your index page template, and the set's links will appear at that\
    \ spot in the final page.\n\n```\nsub build_page {\nmy $self = shift;\nmy $page_tmpl\
    \ = shift;\nmy $set_tmpl = shift;\nmy $item_tmpl = shift;\n\nmy $tpl = $self->tpl;\n\
    my ($set_html, $p);\n```\n\n```\n# build each story set\nforeach my $st(keys %($self->story_sets))\
    \ ($st,\n    unless ($set_html = $self->build_story_set($st,\n        $set_tmpl))\
    \ {\n        $self->error(\"Publisher::Index::Multi: *\\n    *failed to build\
    \ story set $st*\");\n    }\nreturn;\n```\n\n```\n# Assign the result to a template\
