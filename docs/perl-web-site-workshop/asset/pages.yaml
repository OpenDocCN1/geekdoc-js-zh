    # Playing with Random Images


    Everything we''ve done so far in Perl has dealt with reading and writing text;
    but Perl isn''t limited to working with text. Here''s an example of how to work
    with images. We used JPEGs in this example, but you can use other Web graphics
    such as GIFs for your random process.


    You can use this script by setting the source (src) attribute of an image tag,
    like this:


    ```

    <img src="path/to/random_img.cgi">

    ```


    This is a simple example; it picks a random image from a pre-defined directory.
    But you could easily extend it to see rotating banner ads, or, as we''ll see later
    on, to draw the images itself, instead of reading pre-built images from disk.


    ![](img/d26997dc0c0571017b4729525ba1a4ac_118_0.png)


    ```

    #!usr/bin/perl


    # print the http header -- for an image in this case

    print "Content-type: image/jpeg\n\n"

    $IMAGE_DIR = "images"; # the directory where our images are, often

