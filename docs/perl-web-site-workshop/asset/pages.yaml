  md: '# Perl Web Site Workshop


    # Setting Up Apache to Enable SSIs


    Here''s what you need in your Apache httpd.conf to enable SSI. First, in each
    <Directory> section in which you''d like SSI to be active, make sure the Options
    line includes +Includes. To use SSI across your site, you can edit your main root
    <Directory> section like this:


    ```

    <Directory "/path/to/site/root">  Options Indexes

    FollowSymlinks ExecCGI +Includes

    ```


    Then you''ll have to tell the server which files to process through the SSI systems:


    ```

    AddType text/html .html

    AddHandler server-parsed .html

    ```


    # Including Time and Date


    Many sites want to include the current date and time on a page. Using SSI, this
    is very easy. First, you''ll create the echo_date.cgi script, upload it, and set
    the appropriate permissions on the file, just as any other CGI file.


    echo_date.cgi


    ```

    #!/usr/bin/perl -w


    lib ''/path/to/library'';

    use Timefuncs;

    print "Content-type: text/html\n\n",&date_string(time);

    ```


    The backward single quotes around /usr/games/fortune are called "backticks," they''re
    a shorthand way of running another program on the system and reading the output
    from that program. You can do this with just about anything, from games like fortune,
    to system utilities netstat and ps. Ain''t Unix great?


    To include SSI in a page, you''d add this to your HTML:

    <!-- include virtual="/path/to/echo_date.cgi" -->


    Now, rename the page with an .shtml extension. When a visitor pulls up this page,
    it will echo the date and date.


