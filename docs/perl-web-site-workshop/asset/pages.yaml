    # A Better Form Script


    This script is similar to the first two, but it advances on their concepts by
    adding error checking and security using Perl''s taint mechanism.


    Perl''s taint mechanism marks any information that comes from outside of the actual
    script as being tainted data. The mechanism won''t let that data be used in any
    sensitive operation. For example, you can''t use tainted data as the name of a
    file to open. This adds the ability for you to control errors and ensure that
    scripts are secure as possible.


    Can you untaint data? You can indeed, by using Perl''s regular expression matching.
    Doing this allows script author to pass anything that doesn''t look suspicious
    processing if the input seems weird, contains shell characters, pathnames, or
    commands that weren''t expected.


    The Better Form script includes this security and error checking. We''ll point
    out where this is occurring in the script by bolding the relevant code and explanatory
    comments.


