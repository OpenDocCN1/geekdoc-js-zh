    Next comes main, which is primarily a dispatcher function. This helps us figure
    out whether a user attempting to work with the Siteman interface to publish stories
    is authorized. With this function, we also determine if or she is coming from,
    and what function to handle the input from that screen.


    In this version of main, we''ve avoided the usual huge if .. elsif construction
    using references to functions. Just as you can take a reference to a hash, array,
    or scalar value (See Chapter 11, "Getting Ready to Learn Perl!"), you can take
    a reference to a function, pass that around just as you would any other variable,
    and then use it to call the function it points to. This is very convenient for
    a case like this, what input we get determines how we want to process that input.


    The first thing we do is set up a hash, keyed on the parameter "screen" (which
    is present in each HTML page that makes up the Siteman interface), with the record
    value being a reference to the function that handles input from that screen. Then,
    after making the user is authorized to use the system, all we have to do is figure
    out what screen we''re coming from, and then hand off to the function associated
    with that screen, and we''re done.'
