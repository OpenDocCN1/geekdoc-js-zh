    # Using Perl with SSI


    Up to this point, we''ve covered CGIs that produce whole HTML pages. But this
    isn''t the only thing CGI can do. Although the output of a CGI must comprise a
    complete HTTP conversation—so you can''t, for the most part, stick a CGI in the
    middle of an otherwise static page—you can play some "stupid Web server tricks"
    to get dynamic content into another static page.


    A easy way to do this is to enable server-side includes (SSIs) in your Apache
    setup. Usually, this is set up by your system administrator. Check with your ISP
    to see if you can use server-side includes. We''ve included some simple information
    to help you set up an Apache server to handle SSIs.


    Apache isn''t the only server that can handle SSIs. You''ll need to check with
    your server documentation or your systems administrator for more information if
    you are working with a server other than Apache and would like to use SSIs.


    SSI is often used to include pieces of static HTML within other static HTML pages—for
    example, to put a standard navigation bar on all the pages of a site, without
    having to code that on each individual page.


    You can also use SSI to run CGI scripts. This section will teach you how to set
    up Apache to enable SSI, and a selection of short examples of what SSI will let
    you do.


    * Neith'
