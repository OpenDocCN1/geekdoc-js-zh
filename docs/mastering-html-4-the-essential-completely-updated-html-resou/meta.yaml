- img_proc: false
  md: '# TABLE 7.2: BASIC TABLE TAGS


    | Tag | Use |

    | --- | --- |

    | <TABLE> | Marks a table within an HTML document. |

    | <TR> | Marks a row within a table. The closing tag is optional. |

    | <TD> | Marks a cell (table) data within a row. The closing tag is optional.
    |

    | <TH> | Marks a heading cell within a row. The closing tag is optional. |


    > TIP Although closing tags </TR>, </TD>, and </TH> are optional, including them
    can help you see where one tag ends and another begins. Also, including these
    closing tags might increase compatibility with older table-capable browsers.


    The following steps show how to build a table and enter information into it. The
    following sample table represents a product summary on a corporate Web site:


    | Product | Purpose |

    | --- | --- |

    | Binder 1.0 | Join multiple objects |

    | Splatter 3.2 | Divide single object into multiple smaller objects |

    | Organizer 2.2 | Join multiple objects for easy access and changing |


    +   1. Start with a functional HTML document that contains the appropriate structure
    tags and any additional information you want to include.

    2. Add the <TABLE> tags where you want the table boundaries to appear.

    3. Add <TR> tags between the boundaries noted above for each row. The sample table
    contains four <TR> tags, one for each row.


    ```

    <TABLE>

    <TR>

    </TR>

    <TR>

    ```'
