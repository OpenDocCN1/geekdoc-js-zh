  md: '> TIP We recommend setting all Web page colors at one time—way you can see
    how background, text, and link colors appear as a unit.


    To change text and link colors, follow these steps:


    +   1. Within the <BODY> tag, add the TEXT= attribute to set the color for text
    within the document. This example makes the text black.


    > NOTE When setting text colors, using a "safe" color is less important for text
    than for backgrounds. Dithering is less apparent in small areas, such as text.


    ```

    <TEXT="#000000">

    ```


    +   2. Add the LINK= attribute to set the link color. This example uses blue (#0000FF)
    for the links.


    ```

    <TEXT="#000000" LINK="#0000FF">

    ```


    +   3. Add the VLINK= attribute to set the color for visited links. If you set
    the VLINK= to the same as the link, links will not change colors even after visitors
    follow them. This could be confusing, but also serves to make it look like there
    is always new material available. This example sets the visited link to a different
    shade of blue.


    ```

    <TEXT="#000000" LINK="#0000FF" VLINK="#000099">

    ```


    +   4. Finally, set the ALINK= or active link color. This is the color of a link
    while visitors are clicking on it and will not necessarily be visible in Internet
    Explorer 4, depending on visitor settings. This example sets ALINK= to red.


    ```

    <TEXT="#000000" LINK="#0000FF" VLINK="#000099" ALINK="#FF0000">

    ```


