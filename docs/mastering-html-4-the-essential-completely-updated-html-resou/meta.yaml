  md: '# 26 CHAPTER 2 • CREATING YOUR FIRST HTML DOCUMENT


    # Minimal Compliance for Structure Tags


    As shown in the previous sections, the HTML 4 specification does not require all
    structure tags. In fact, only two: the <!DOCTYPE> tag and the <TITLE> tag. If
    you choose to use only these two tags, the code would look like this:


    ```

    <!DOCTYPE HTML *-//W3C//DTD HTML 4.0 Transitional//EN>

    <TITLE>The name of a minimal name and content free</TITLE>

    ```


    Of course, there''s no purpose in creating a document with nothing but the minimal
    tags—document doesn''t say anything and doesn''t present any information. If you
    use these two tags as a starting point, however, you can create a standard compliant
    document and save yourself a few keystrokes on each new document you create.


    # Applying Common Tags and Attributes


    After you include the structure tags, you''re ready to start placing basic content
    in the document body. The following sections show you how to include headings,
