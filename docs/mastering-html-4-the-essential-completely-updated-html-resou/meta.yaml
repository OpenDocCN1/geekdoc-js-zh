    In addition, become familiar with ways to specify measurements and values, which
    are discussed in the next two sections.


    # Specifying Measurements


    When specifying locations of elements, you might also want to specify their size.
    For example, when specifying the first line of paragraphs indent, you can also
    specify the size of the indentation. In general, provide measurements in the units
    shown in Table 4.6. You can also express most measurements as a percentage of
    the browser window.


    Your measurement might look like this:


    ```

    P { text-indent: 2px }

    ```


    or like this:


    ```

    P { text-indent: 1em }

    ```


    | TABLE 4.6: UNITS OF MEASURE IN STYLE SHEETS |

    | Unit | What It Is | Description |

    | em | Em space | The width of a capital M in the typeface being used. |

    | ex | X-height | The height of a lowercase letter x in the typeface being used.
    |'
