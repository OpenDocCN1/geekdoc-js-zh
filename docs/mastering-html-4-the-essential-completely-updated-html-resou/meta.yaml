    the HTML code. To use the <HTML> tag, enter it in your document below the <DOCTYPE...>
    tag, like this:


    ```

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">

    <HTML>

    </HTML>

    ```


    # The <HEAD> Tag


    The <HEAD> tag contains information about the document, including its title, scripts
    used, style definitions, and document descriptions. Not all browsers require this
    tag, but most browsers expect to find any additional information about the document
    within the <HEAD> tag. Additionally, the <HEAD> tag can contain other tags that
    have information for search engines and indexing programs. To add the <HEAD> tag,
    enter it between the <HTML> tags, like this:


    ```

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">

    <HTML>

    <HEAD>

    </HEAD>

