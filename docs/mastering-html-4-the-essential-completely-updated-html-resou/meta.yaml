  md: '# INTRODUCTION


    Welcome to Mastering HTML 4, Premium Edition—your one-stop comprehensive guide
    to HyperText Markup Language! In it, you''ll find:


    +   * Comprehensive information about the latest and greatest HTML 4 specification—what
    it includes and how to use it

    * Advice and Ideas about developing Web pages multiple browsers

    * Easy-to-follow instructions that help you build HTML documents one step at a
    time

    * Examples of how you can enhance your Web pages with various technologies, including
    JavaScript

    * Design guidelines to help you use HTML effectively

    * Thorough coverage of XML uses, applications, and structure (only in the Premium
    Edition!)

    * Instructions on how and when to use XHTML, which is the next generation of HTML
    (only in the Premium Edition!)

    * Thorough coverage of advanced HTML topics, such as generating HTML from a database
    and creating searchable HTML (only in the Premium Edition!)

    * Useful information and advice about choosing tools that meet your needs (only
    in the Premium Edition!)

    * A comprehensive reference on HTML, Style Sheets, JavaScript, special characters,
    browser-safe colors, and the XML specification (only in the Premium Edition!)

    * Sample files and software, located on the Companion CD (only in the Premium
    Edition!)


    We developed this book so that any HTML author—whether you''re a newbie or seasoned
    professional—can learn and effectively use HTML. For example, if you''re new to
    HTML, you can start at the beginning and work your way forward as you advance
    your'
  merge: -1
  pgno: 26
- img_proc: false
  md: '# What''s in This Book?


    skills. You''ll find the step-by-step instructions and examples easy to follow
    and understand. Or, if you''ve already created a few (several!) HTML documents,
    thumb through later chapters and pick up new skills, or use the Master''s Reference
    to find the information you want. Or, jump straight to the sections on XML and
    XHTML to see where the future lies in. So, if you''re involved in any way with
    creating documents for the Web, you''ll find this book an invaluable complete
    reference.


    This book contains seven parts, plus the Master''s Reference. Here''s what to
    expect.


    # Part One: Getting Started


    In this part, you''ll learn about HTML code, develop your first HTML page—including
    all the common page elements and even a few relatively advanced features such
    as links, fancy formatting, and Style Sheets—and learn to publish your pages for
    all to see.


    # Part Two: Advancing Your Skills


    In this part, you''ll move on to some of the more fun and impressive HTML effects
    such as including images, tables, forms, and frames. These effects can really
    perk your pages and give them the “up-with-technology” look and feel.


    # Part Three: Moving Beyond Pure HTML


    In this part, you''ll learn how to include multimedia effects and JavaScript.
    These technologies infuse your HTML pages with great power and pizzazz when wielded
    properly.


    # Part Four: Developing Web Sites


    In this part, you''ll learn the ins and outs of developing functional Web sites
    that your visitors will want to visit over and over again. Here, you''ll learn
    about the HTML development process, as well find tips and tricks for developing
    specific types of Web sites—public, personal, and intranet. These chapters show
    you how to develop and design your pages and sites according to what they''ll
    be used for and who will be viewing them.'
  merge: -1
  pgno: 27
- img_proc: false
  md: '# Part Five: Applying HTML to Advanced Applications


    In this part, you''ll learn about some sophisticated HTML applications. First,
    you''ll see what HTML-based help systems involve and a starting point for implementing
    your own. Then, you''ll discover how publishing HTML directly from a database
    can ease your workload and help you keep your site up-to-date. After that, a chapter
    on searchable HTML will give you the tools you need to let people search your
    Web site easily and efficiently. Finally, you''ll see how to apply you''ve already
    learned about Style Sheets and JavaScript to make your own dynamic HTML (DHTML)
    pages.


    # Part Six: Understanding XML: The Next Generation


    In this part, you''ll delve into XML and see how this technology overcomes many
    of HTML''s limitations. For starters, you''ll learn about XML uses and document
    structure. Then you''ll learn about DTDs (the rules for XML documents), and how
    to make your own XML documents, and about connecting XML documents to Style Sheets
    so that you can publish them. Finally, you''ll learn about XHTML, which is a new
    incarnation of HTML written to comply with XML standards. It''s the next generation
    of HTML and worth a look.


    # Part Seven: Using Development Tools


    In this part, you''ll briefly visit the ever-changing world of HTML development
    tools. You''ll see some of the capabilities that high-end authoring tools offer
    you, as well as explore the ways that validation services and document conversion
    tools can aid HTML document development and maintenance.


    # Master''s Reference


    The Master''s Reference includes six sections:


    +   **HTML** A comprehensive list of HTML tags and attributes, shows which HTML
    standard they belong to (HTML 4, 3.2, and so on) and gives examples of how to
    apply them.


    +   **Style Sheets** A comprehensive list of Style Sheet tags and attributes and
    examples of how to apply them.


    +   **JavaScript** A comprehensive list of JavaScript objects, properties, methods,
    and functions and examples of how to use them.


    +   **Special Characters** A list of special characters, such as copyright symbols
    and characters with umlauts, and instructions on how to include them in your documents.'
  merge: -1
  pgno: 28
- img_proc: false
  md: '# INTRODUCTION


    **Browser-Safe Colors** A list of color descriptions and the appropriate RGB number
