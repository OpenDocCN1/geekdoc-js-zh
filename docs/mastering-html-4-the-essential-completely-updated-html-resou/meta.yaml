    # What Other Resources Can Help?


    In addition to this book, you can find information, resources, and specifications
    on the Web. In particular, the World Wide Web Consortium site, as well as several
    product-specific sites will help you learn, use, and keep with changes in HTML.


    # Visit the W3C


    The World Wide Web Consortium (W3C) was founded in 1994 at the Massachusetts Institute
    of Technology (MIT) to oversee the development of Web standards, including the
    HTML standard. This consortium defines and publishes HTML standards, the tags
    and attributes within HTML documents. So, an excellent way to monitor HTML changes
    is to visit the W3C site:


    www.w3.org/


    Here, you will find new releases of HTML standards, proposed standards, and other
    developments in Web-related specifications, such as the Cascading Style Sheets
    (CSS) and eXtensible Markup Language (XML) specifications.'
