  md: '# Understanding Tags


    HTML tags actually serve two purposes. First, they identify logical document parts—that
    is, the structural components in documents such as headings (<H1>, for example),
    numbered lists (<OL>, for Ordered List), and paragraphs (that is, <P>). So, for
    example, if you want to include a heading, a paragraph, and a list in your document,
    you type the text and apply the appropriate tags to it (we''ll show you how in
    the next sections). And that''s it.


    Second, tags in HTML documents also reference other elements—that is, tags can
    include pointers and links to other documents, image files, video files, media-applications,
    animations, applets, and so on. For example, if you want to include an image of
    your company''s product in your HTML document, rather than pasting in an image
    (as you might in a word processing document), you can include a tag that points
    to the image filename, as shown here:


    ```

    <IMG SRC="logo.gif">

    ```


    In this example, <img> (image) tag points to a logo file (logo.gif) that the browser
    will display. So, here again, browsers rely on the information contained within
    an HTML document to tell it what to display and how to display.


    # Understanding Tag Components


    As you can see from these examples, HTML tags are fairly intuitive. Although tags
    are occasionally cryptic, you can usually get an idea of a tag''s function just
    from its name. Let''s take a look at tag components, which should help you learn
    and apply tags to your HTML documents.


    First, all tags are composed of elements that are contained within angle brackets
    (<). The angle brackets simply tell browsers that the text between them is an
    HTML command. Some tags look like these:


    +   * <H2> (for heading level 2)

    * <BODY> (for document body)

    * <B> (for bold)


    Second, most tags are paired, with an opening tag (for example, <H1>) and a closing
    tag (</H1>). Both tags look alike, the closing tag also includes a forward slash
    (/). To apply tags to your document, place the opening tag before the information,
    and place the closing tag after the information, like this:


    ```

    <H1>information that the tags apply to</H1>

    ```'
  merge: -1
  pgno: 37
- img_proc: false
  md: 'Enter both the opening and closing tag at the same time so that you don''t
    forget the closing tag. If you happen to forget it, most paired tags will run
    on and until the the browser finds a matching closing tag.


    **NOTE** Less commonly, you''ll use unpaired tags, which do not include the closing
    tag. We''ll point those out throughout this book and show you how to use them
    appropriately.


    Apply more than one tag to a chunk of information, you nest the tags. **Nesting**
    means placing one set of tags inside another set. For example, to apply italic
    to a heading, you nest the tags, like this:


    ```

    <H1><I>information that the tags apply to</I></H1>

    or like this:

    ```


    ```

    <I><H1>information that the tags apply to</H1></I>

    ```


    When you nest tags, the first tag is also the last tag, and the second tag is
    also the sec-ond to last, and so on.


    # Typing Tags Correctly


    When typing tags, be particularly careful not to include extra spaces. If you
    do, a browser may not recognize the tag and will not display the information correctly.
    Or, the browser might display the tag itself.


    For example, a title should look like this:


    ```

    <TITLE>Correct Title</TITLE>

    ```


    Do not include spaces within the tags, like this:


    ```

    < < TITLE >Incorrectly Formed Title</TITLE >

    ```


    # Improving Readability


    You''ll find it easier to read and use tags if you follow a few conventions. In
    particular, we suggest that you type tags using all caps and that you use hard
    returns to create shorter lines. These conventions do not affect how browsers
    display code—they just make it easier for you to read.


