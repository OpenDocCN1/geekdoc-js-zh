    2. Type FTP to start the FTP application.

    3. At the FTP> prompt, type open and the address of the FTP server, for example:
    `open ftp.xession.com`

    4. When prompted, enter your userid and then your password. Remember that the
    userid and password are case-sensitive.

    5. Change to the folder where you want to store your files. If you''re uploading
    files to an ISP, your folder name will probably be public_html or www or something
    similar.

    `cd public_html`n6. To upload HTML documents, first set the file type to ASCII.
