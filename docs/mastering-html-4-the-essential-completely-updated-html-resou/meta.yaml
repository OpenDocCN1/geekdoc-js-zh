  md: '# Setting Classification Properties


    You use classification properties to change specific elements elements from inline
    (as I or B) to block elements with line breaks before and after (such as P and
    H1), as well as control the display of lists. Table 4.11 lists some classification
    properties and their values.


    | Property | Value |

    | --- | --- |

    | display | inline, block, list-item |

    | line-height | measurement or % |

    | list-style-type | disc, circle, square, decimal, lower-roman, upper-roman, lower-alpha,
    upper-alpha, none |

    | list-style-image | url(http://someourl.com/image.gif) |


    To specify that an unordered list uses square bullets, follow these steps:


    +   1. Within the style block, add a UL selector followed immediately by an LI
    selector on the same line. By combining these, the style rule will only apply
    to an <LI> within a <UL>. Setting a rule for <LI> affects all numbered and bulleted
    lists.


    ```

    <STYLE>

    <!---

    UL LI

    -->

    </STYLE>

    ```


    +   2. Add brackets.


    ```

    <STYLE>

    <!---

    UL LI {}

    -->

    </STYLE>

    ```


    +   3. Add a list-style-type property with the value of square.


    ```

    <STYLE>

    <!---

    UL LI { list-style-type : square }

    -->

    </STYLE>

    ```'
