- img_proc: false
  md: '> TIP If your visitors might be using particularly old browsers, consider using
    both client-

    side and server-side image maps. If browsers use a client-side image map, they''ll
    use it. If they

    don''t recognize the client-side image map, they''ll revert to the server-side
    map. The only

    disadvantage to this approach is that you have to do twice as much work.


    # Making Appropriate Image Maps


    Poorly constructed or carelessly selected image maps can be much worse than no

    image map at all. The inherent disadvantages of images (for example, their download

    time and their inaccessibility for text-only browsers) appear in spades to image
    maps.

    When determining whether an image map is appropriate for your needs, ask the-

    lowing questions:


    Is the image map linking to a stable navigational structure? If the links will
    be

    changing or if the overall site navigation structure isn''t completely worked
    out, it''s

    time for an image map. Revising image maps is possible, but generally a real has-

    lo''s easier to redo an image map to update it.


    Is the image final? If the image hasn''t passed all levels of review and isn''t-

    pol, you''re not ready to make an image map. Changes as trivial as cropping the
    image

    s slightly rescaling the image by a few percentage points can completely

    break your map.


    Is the image function appropriate to an image map? Flashy images on a home

    page are good candidates for image maps, particularly if the design reflects the
    corpo-

    rate image. In cases, an intricate design must be a single image map-brows-

    ot always accurately assemble individual images to the arrangement the designer

    intends. Pages buried within an intranet site or that have a technical and

    practical focus are less likely to benefit from an image map.


    Is the image content appropriate to an image map? Artificial or gratuitous

    of image maps can be a real drawback to otherwise fine Web pages. Is clicking
    certain

    spots in an image map really the best way for your visitors to link to the information
    they

    need? For example, in a site about automobile repair and diagnosis for the

    layperson, a picture of a car and the instructions to click where the funny sound

    ems to originate is completely appropriate. In a site directed at experienced

    mechanics, however, a list of parts (hood, trunk, dashboard, tire) would be much

    faster and more appropriate.'
  merge: -1
  pgno: 196
- img_proc: false
  md: 'Does the function or content merit an image map? If both do, that’s great.
    If one does, you can probably proceed with an image map. If, however, the links
    on a page don’t need to be flashy and the content is not substantially clarified
    with an image map, omit the image map entirely.


    Can the image map be completely reused? If you are planning to use an image map
    on several pages (you will use exactly the same image and code), its value increases.
    In this case, it’s more likely to be worth the download time than if it’s a one-time
    use.


    If you answered no to one or more of these questions, consider using traditional,
    individual images or navigation aids. For example, if you can easily break the
    content or image into multiple smaller images with no significant problems, consider
    doing so. Remember that image maps are time-consuming to develop and may not be
    available to all your visitors, so be sure an map is right for your needs before
    developing one.


    # Selecting an Image


    When you choose a suitable image to use as an image map, follow the same guidelines
    as you would for choosing other images:


    +   - Be sure that the image supports the content.

    - Be sure that the physical size is as small as possible, but large enough to
    convey the content.

    - Be sure that the file size is as small as possible.


    For example, if you are creating an auto-repair image map for lay persons, use
    a simple drawing or schematic. At the other extreme, however, is the ASR Outfilters
    image map, which is primarily a visual attraction with only a tangential function.
    The image map shown in Figure 6.10, earlier in this chapter, is part of a localized
    weather page. Visitors can click an area to get the weather for region.


    # Setting Alternate Navigation


    Unless you know beyond a doubt that all your visitors have graphical browsers
    and will choose to view images, you must provide alternate navigation options.
    Those who don’t see the images—whatever reason—won’t be able to link to the information
    via your image , so provide text-based alternatives. An easy solution is to create
    a list of links. For example, alternate navigation for the image shown in Figure
    6.10, earlier in this chapter, might look like the following code:


    ```

    <BR>

    <A HREF="uvi.html">UV Index</A> |

    ```'
