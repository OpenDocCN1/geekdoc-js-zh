  md: '# Linking to a Specific Location in a Document


    In addition to linking to a document, you can also link to a specific place within
    a document. For example, rather than linking to the Management Overview document,
    you can link to a subheading called Proposals. By doing so, you can let your visitors
    move directly to the information they seek, rather than having them reach a document
    and scroll to the tidbit of information.


    You link to specific places within documents with the help of a name anchor, which
    marks the targeted location. In this example, you''d put the name anchor for the
    Proposals subheading and then link directly to that subheading from another document.
    Very cool...and efficient for your visitors.


    # ing Name Anchors


    Name anchors are made up of three parts:


    +   - An anchor tag, `<a>`, which marks the text or the location within a document
    as a target

    - An attribute, NAME=, which identifies the anchor as a name anchor

    - A name, enclosed in quotes, which identifies the specific location


    Put these together, and a basic name anchor looks like this:


    ```

    <A NAME="location">A location here</A>

    ```


    The text between the opening and closing name anchor tags (“A location here”)
    is visible in your document, but unlike link, it is not highlighted nor is any
    other specific visual indicator associated with it. You can use the name anchor
    tag in combination with other tags in your document. Here''s the process for creating
    a name anchor:


    +   1. Start with a subheading.

    2. Add the anchor tag.

    3. Add the name attribute (use something specific that you''ll be able to remember).


    ```

    <H2>Proposals</H2>

    <H2><a>Proposals</A></H2>

    <H2><A NAME="proposals">Proposals</A></H2>

    ```'
  merge: -1
  pgno: 98
- img_proc: false
  md: 'That''s all there is to it. You will see nothing different in your document
    when you view it with your browser, but you have just provided the tools necessary
    to link directly to a subsection of your document, as described in the next section.


    # Linking to Name Anchors


    After you create a name anchor, you can link to it. To continue with our example,
    the Proposals section is in a document that has the filename services.html, which
    is in the information folder where the document looks like this:


    A link to that document looks like:


    ```

    <A HREF="http://www.xmission.com/information/services.html>Link</A>

    ```


    A link to the Proposals section, using an absolute URL, looks like this:


    ```

    <A HREF="http://www.xmission.com/information/services.html#proposals>

    Link</A>

    ```


    Notice the #proposals addition in the targeted link, which is what tells the browser
    to link to that heading. How much information you include in a targeted link depends
    on where the linked document is located, as shown in Table 3.2.


    > TIP You can''t link to NAME= anchors that do not exist, and you can''t add them
    to other documents on the Web. To ensure that visitors can link to specific places
    within your document, include NAME=anchors in places likely to be visited.


    TABLE 3.2: URLS FOR VARIOUS DOCUMENT LOCATIONS

    | From Within | Link Looks Like |

    |---|---|n| The same document | <A HREF="#proposals"> |

    | The same folder, different document | <A HREF="services.html#proposals"> |

    | The same server (different folder and document, server-relative URL) | <A HREF="/information/services.html#proposals">
    |

    | A different server | <A HREF="http://www.xmission.com/information/services.html#proposals">Link</A>
    |'
  merge: -1
  pgno: 99
- img_proc: false
  md: '# Inserting E-Mail Links


    Finally, another handy link you can use is an e-mail link, which takes your visitors
    from the Web page to an already-addressed blank e-mail message in their e-mail
    program. By including e-mail links in your Web pages, for example, you can let
    visitors easily contact you.


    To create an e-mail link, simply add an anchor link with the mailto: protocol
    and the e-mail address. For example, you might include a link to send the authors
    of this book with an e-mail link with this:


    ```

    <A HREF="mailto:info@raycomm.com">Send Feedback</A>

    ```


    > TIP As we mentioned in Table 3.1, the mailto: protocol is not an HTML standard,
    but it is widely used and recognized.


    # HTML 4 Opportunity


    The HTML 4 specification lets you add link descriptions that pop up over the screen
    when visitors move their mouse over the link, as shown here:


    ![](bbox=[0.378, 0.595, 0.626, 0.658])


    To add pop-up descriptions to your links, simply include the TITLE= attribute
    in the anchor tag, like this:


    ```

    <A HREF="http://www.raycomm.com" TITLE="*The RayComm Web Site">More Information</A>

    ```'
  merge: -1
