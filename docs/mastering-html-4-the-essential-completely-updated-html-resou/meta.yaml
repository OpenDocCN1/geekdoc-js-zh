    # Publishing through a Corporate Server


    Another place you might publish your HTML documents is a corporate server—at your
    place of employment, most likely. If you work for a large company or an educational
    institution or if you work with an organization or group that handles system administration
    tasks, you''ll probably have little to do when it comes to accessing a Web server.
    All the necessary pieces—access, administration, security—are likely to be in
    place,


