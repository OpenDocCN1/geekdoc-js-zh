    # Developing a Style Sheet


    In the previous sections, you learned how to associate a Style Sheet with an HTML
    document. Your goal now is to develop the Style Sheet—that is, to specify the
    style definitions you want to include. A *style definition* specifies formatting
    characteristics.

    You can choose from any combination of the eight categories of style properties.


    +   - Font properties specify character-level (inline) formatting as the type
    of text.

    - Text properties specify display characteristics for text, such as alignment
    or letter-spacing.

    - Box properties specify characteristics for sections of text, at the paragraph
    (or block) level.

    - Color and Background properties specify color and background images at the paragraph
    (or block) level.

    - Classification properties specify display characteristics of lists and elements
    (such as P or H1) as inline or block level.

    - Aural Style Sheet properties control the aural presentation of HTML documents.
    (CSS2 only).

    - Printed Style Sheet properties add features to specifically control printed
    output of HTML documents (CSS2 only).

    - Positioning properties add features to precisely control the placement of elements
    on the display (CSS2 only).


    When developing a Style Sheet, simplicity is key. You can easily get carried away
    with formatting options, but keep things simple. Take a glance through the Style
    Sheet section in the Master’s Reference to get an idea of the vast number of options.
    And, as you might guess, using even some of these options can quickly get complex.'
