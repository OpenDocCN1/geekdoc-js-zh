    | --- | --- |

    | font-family | Times New Roman, Arial, serif, sans-serif, monospace |

    | font-style | Normal, italic, oblique |

    | font-variant | Normal small-caps |

    | font-weight | Normal, bold, lighter, 100, 200, 300, 400, 500, 600, 700, 800,
    900 |

    | font-size | xx-small, x-small, medium, large, x-large, xx-large, or size measurement
    |

    | font | Any or all of the above properties


