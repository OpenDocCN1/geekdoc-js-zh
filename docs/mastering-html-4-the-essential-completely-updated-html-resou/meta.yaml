  md: '# CHAPTER 4 • USING STYLE SHEETS


    To link a Style Sheet to an HTML document, follow these steps:


    +   1. Start with a complete HTML <HEAD> section, such as the following code:

    ```html

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.0 Transitional//EN">

    n<HTML>

    <HEAD>

    <TITLE>ASR Outfitters</TITLE>

    </HEAD>

    ```


    +   2. Add the <LINK> tag.

    ```html

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.0 Transitional//EN">

    <HTML>

    <HEAD>

    <TITLE>ASR Outfitters</TITLE>

    <LINK>

    </HEAD>

    ```


    +   3. Specify the REL and TYPE values of Style Sheet and text/css to link to
    a standard Style Sheet.

    ```html

    <LINK REL="stylesheet" TYPE="text/css">

    ```


    +   4. Specify the address of the Style Sheet with the HREF= attribute. Specify
    either a relative URL, in the sample code, or an absolute URL.

    ```html

    <LINK REL="stylesheet" HREF="blue.css" TYPE="text/css">

    ```


    There you go! To link your HTML document to more than one Style Sheet, simply
    include <LINK> tags, complete with each of the Style Sheets to which you link.
    For example, you might link an HTML document to a generic Style Sheet that contains
    basic style definitions and then link it to a more specific Style Sheet that contains
    definitions suitable to a particular style of document—instructions, marketing,
    and so on. If you link to multiple Style Sheets, if you define the same element
    in multiple sheets, the later links override the previous ones.


    The HTML specification indicates that you can also link your HTML documents to
    optional Style Sheets using the REL="Alternate Style Sheet" attribute so that
    visitors can choose which styles to use. Theoretically, you can provide optional
    Style Sheets that let visitors choose a low-bandwidth style for viewing over a
    modem connection or a high-bandwidth style for high-speed connection. Or, you
    can present choices for high-resolution and high color depth monitors and provide
    alternatives for standard monitors at lower color depth. At the time of writing,
    however neither Internet Explorer nor Netscape Navigator supports optional Style
    Sheets.'
