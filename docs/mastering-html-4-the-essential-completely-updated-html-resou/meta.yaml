    # # Using Background Images


    Most browsers support background images, the patterns or images behind the text
    in HTML documents. As a rule, background images are tiled throughout the available
    space, meaning that they are multiple copies of one image placed side by side
    to fill the screen.


    Tiling offers two main advantages. First, you can produce a seamless background,
    meaning that the casual viewer cannot see where individual images start and stop.
    Figure 6.13 shows a seamless background.


    Second, you can develop more visually interesting backgrounds by ensuring that
    background images tile either horizontally or vertically. For example, an image
    that is only 10 pixels high and 1280 pixels wide is as wide or wider than any
    browser window is likely to be. Therefore, the image will repeat vertically, but
    not horizontally. This can produce a vertical band, as shown in Figure 6.14.


    > > TIP The magic number 1280 ensures that no browser can be wider than the image.
    If you use a narrower image, you might have an attractive image when viewed at
    800 × 600 resolution, but with two vertical bands (on the left and near the right)
    at 1024 × 768 resolution, for example.'
