    # Setting Aura Style Sheet Properties


    One of the most recent additions to Style Sheet capabilities are aural properties,
    which allow you to set properties for documents that will be read aloud (as opposed
    to read onscreen). Visually impaired visitors could use these, or you might use
    these as a supplement to a visual presentation or in situations in which reading
    is not possible, for example, in the car. Aura Style Sheet properties let you
    specify that documents be read aloud, specify sound characteristics, and specify
    other auditory options.


    Table 4.12 lists some a Style Sheet properties and their values. Visit Part 2
    of the Master''s Reference for additional properties and values.


    | Property | Values |

    |---|---|

    | volume | value, percentage, silent, x-soft, soft, medium, loud, x-loud |

    | pause | value, percentage |

    | speech-rate | value, extra slow, medium, medium, fast, extra fast, faster, slower
    |

    | pitch-range | value |'
