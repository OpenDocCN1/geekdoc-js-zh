  md: '# Creating Headings


    Headings break up large areas of text, announce topics to follow, and arrange
    information according to a logical hierarchy. HTML provides six levels of headings;
    <H1> is the largest of the headings, and <H6> is the smallest:


    ```

    <H1> ... </H1>

    <H2> ... </H2>

    <H3> ... </H3>

    <H4> ... </H4>

    <H5> ... </H5>

    <H6> ... </H6>

    ```


    > TIP For most documents, limit yourself to two or three heading levels. After
    three headings, many visitors begin to lose track of their hierarchy. If you find
    that you''re using several heading levels, consider reorganizing your document—too
    many heading levels often indicate a larger organizational problem.


    To use heading tags, enter them before the heading text, like this:


    ```

    <!DOCTYPE HTML "-//W3C//DTD HTML 4.0 Transitional//EN">

    <HTML>

    <HEAD>

    <TITLE>Sample Headings</TITLE>

    </HEAD>

    <BODY>

    <H1>First Level Heading</H1>

    <H2>Second Level Heading</H2>

    <H3>Third Level Heading</H3>

    </BODY>

    </HTML>

    ```


    Figure 2.4 shows how Netscape Navigator displays a few heading levels. In general,
    you use heading tags only for document headings—that is, don''t use heading tags
    for figure captions or to emphasize information within text. Why? First, you don''t
    always know how browsers display the heading. It might not create the visual effect
    you intend. Second, some indexing and editing programs use headings to generate
    tables of contents and other information about your document. These programs won
    exclude headings from the table of contents or other information just because
    you used them as say, figure captions.'
