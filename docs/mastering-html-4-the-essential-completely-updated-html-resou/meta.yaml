    | pc | Pica |


    # Specifying Colors in Style Rules


    Using Style Sheets, you can specify colors in the standard HTML ways (as a #rrggbb
    value and a color name), as well as in two other ways, which use a slightly different
    approach to specify proportions of red, green, and blue. The following four lines
    show how to specify red in each method.


    ```

    P { color : #FF0000 }

    P { color : red }

    P { color : rgb(255,0,0) }

    P { color : rgb(100%,0%,0%) }

    ```


    > TIP Although each of these is easy to use, we recommend using the #rrggbb option
    because it''s likely to be more familiar, as it matches HTML color statements.


