  md: '# Creating the Image Map


    When you create an image map, you include tags and attributes that tell a browser
    what to do when a visitor clicks the defined map areas. You can include this information
    within the HTML document that contains the image map, or you can include it in
    a separate document. The first is more common, but if you''ll be using the image
    map (as as a navigation aid) in several documents, considering it in a separate
    file and referencing it from each of the documents.


    You can place the map definition block anywhere within the body of your HTML document,
    but it is easier to update and maintain if you place it immediately after the
    opening <body> tag or immediately before the closing </body> tag. Table 6.5 explains
    image-map tags and attributes.


    # TABLE 6.5: IMAGE-MAP TAGS AND ATTRIBUTES


    | Tag/Attribute | Use |

    | --- | --- |

    | USEMAP="..." | Names the client-side map definition to use. Attribute of <img>
    tag. |

    | ISMAP | Specifies that the image uses a server-side image map. Attribute of
    <img> tag. |

    | <MAP> NAME="..." | Marks the map definition block within the HTML document.
    Provides a name for the map definition block. |

    | <AREA> SHAPE="..." | Defines an area within the map. Identifies the shape of
    an area as RECT, CIRCLE, or POLY. Specifies a target for an area. |

    | HREF="..." COORDS="x,y,x1,x2,y2" | Specifies that a click in this area will
    not link anywhere. Identifies the shape of an area. Provides alternate text (or
    pop-up text) describing each link. |


    To include a client-side image map, follow these steps (we''ll use the ASA Outfitters
    in this example):


    +   1. In your HTML document, add opening and closing <MAP> tags.

    2. Give the map a clear, descriptive name with a NAME= attribute. This is common
    comparable to the internal anchor of the <A> tag. It provides an anchor that you
    can link to either the same document or from other documents.

    `<MAP NAME="weather_zones">`'
  merge: -1
  pgno: 201
- img_proc: false
  md: '3. Add an <AREA> tag for one of the shapes.


    <MAP NAME="weather_zones">

    <AREA>


    4. Add a SHAPE attribute to the <AREA> tag. In CIRCLELE represents the UVI area
    in the ASR example map.


    <AREA SHAPE=CIRCLE>


    5. Add the COOR attribute with the x,y coordinates of the center of the circle
    and with the radius of the circle.


    <AREA SHAPE=CIRCLE COOR="82,43,30">


    6. Add an HREF attribute pointing to the target file. You can use relative or
    absolute URLs in client-side image maps, but with other links, using relative
    URLs is a good idea. In this case, a file named uvi.html in the same folder.


    <AREA SHAPE=CIRCLE COORDS="82,43,30" HREF="uvi.html">


    7. Add the ALT attribute describing the link for use in pop-ups.


    <AREA SHAPE=CIRCLE COORDS="82,43,30" HREF="uvi.html" ALT="UV Index">


    > NOTE As you add areas, some may overlap others. The first area defined overrides
    overlapping areas.


    ![](bbox=[0.193, 0.577, 0.4, 0.703])


    8. Add additional <AREA> tags, one at a time. In this example, the next <AREA>
    tag is for the Valley area, so it is a RECT (or RECTANGLE). The coordinates for
    the left and lower are required to link to valley.html.


    <AREA SHAPE=CIRCLE COORDS="82,43,30" HREF="uvi.html" ALT="UV Index">

    <AREA SHAPE=RECT COORDS="1,209,516,320" HREF="valley.html" ALT="Valley Weather">


    9. For the Mid-Peaks area, a triangle will suffice to define the area; so the
    shape is a POLYGON with three pairs of coordinates. This links to midpeaks.html.


    <AREA SHAPE=CIRCLE COORDS="82,43,30" HREF="uvi.html" ALT="UV Index">

    <AREA SHAPE=RECT COORDS="1,209,516,320" HREF="valley.html" ALT="Valley Weather">

    <AREA SHAPE=POLY COORDS="199,207,513,205,541,71" HREF="midpeaks.html"

    ALT="Mid-Peaks Weather">'
