  md: 'his chapter introduces HTML tables, which are grids made up of rows and columns.
    These rows and columns create individual cells that can contain either text or
    images. Tables serve two functions. First, they help present complex data in a
    readable format. Traditionally, you use tables when information can more effectively
    be portrayed visually as described in paragraph form, as shown in Figure 7.1.


    Second, you can use tables to incorporate more sophisticated design elements into
    Web pages. For example, HTML does not support columns, side headings, column widths,
    and precisely juxtaposed text and graphics. Using tables, you can create all these
    elements and more—with little concern about how this might affect your visitor''s
    computer or browser settings. Figure 7.2 shows an example of formatting using
    tables—in this case, we used tables to create sideheads, headings that appear
    to the side of paragraphs rather than above them.


    > **TIP** You can also use frames to achieve some of these design effects. For
    information, visit Chapter 9, specifically the sidebar, "Are Tables or Frames
    Better for Your Design Needs?


    > **TIP** If your visitors are not all using browsers that support HTML tags,
    tables for formatting is a good way to go to; however, as you''ll see in many
    places throughout this chapter, the HTML 4 specification moves away from using
    this formatting technique in favor of Style Sheets. Find out how to develop Style
    Sheets in Chapter 4, and find a complete Style Sheet reference in the Master''s
    Reference.


    Not all browsers support tables, but most versions of Netscape Navigator, Explorer,
    and many other browsers do. Furthermore, all browsers that support tables all
    table features. For example, Netscape supports tables, but does not support extended
    features such as the table footers from the "Using HTML 4 Features" section later
    in this chapter. Table 7.1 lists browsers that support tables and extended table
    features.'
  merge: -1
