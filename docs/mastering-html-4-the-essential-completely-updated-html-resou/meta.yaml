    # What Can You Do with HTML?


    You''re likely most familiar with HTML as it''s used to create Web pages; however,
    HTML has expanded to include many other uses:


    +   **Developing intranet or extranet sites** HTML is commonly used to develop
    intranet and extranet sites, which are company-wide Web sites that are accessed
    by people within the company from one or more locations.


    +   **Developing help files** HTML is also used to develop online help files,
    allowing developers to inexpensively produce documentation that is accessible
    on any platform.


    +   **Developing network applications** HTML is particularly suitable for creating
    applications, such as training programs, interactive chats, or data-bases that
    are available through Web pages.


    +   **Developing kiosk applications** Finally, HTML can also be used to create
    kiosk applications—those stand-alone computers with the neat touch-screen capabilities.


