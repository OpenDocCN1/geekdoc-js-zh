    # MASTERING PRODUCTIVITY


    # Style Sheet Tips


    As you''re building a Style Sheet, the process will be easier if you follow these
    guidelines:


    +   To include multiple selectors, place them on separate lines, like this:

    <STYLE>

    <-

    P (color: red)

    H1 (color: blue)

    BLOCKQUOTE (color: green)

    -->

    </STYLE>


    +   To provide multiple declarations for a single selector, group the declarations
    within the brackets, separated by a semicolon. For example, to define P as red
    with a yellow-background, use the following code:

    <STYLE>

    <-

    P (color: red ; background: yellow)

    -->

    </STYLE>'
