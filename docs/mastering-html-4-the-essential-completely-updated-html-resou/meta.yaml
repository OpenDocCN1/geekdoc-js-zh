- img_proc: false
  md: '# About These Images


    First, the image shown in Figures 6.1 and 6.2 is about 600 pixels wide, and it
    is almost overwhelming when viewed in a browser at common resolutions.


    Second, the background of the image is pure white, and the visible area within
    the oval is almost, but not quite, we had to change the background color to make
    transparency on the printed page. When you create transparent images, you might
    find it useful to set the transparent color to an unusual color, making it easier
    to see at a glance what is supposed to be transparent.


    GIF supports animation. Some image-editing programs and specialized programs can
    combine several GIFs into a single file, which then displays each image or panel
    in turn. The effect is rather like that in cartoon flip books—you flip the pages
    and see an illusion of motion.


    Not all browsers display animated GIFs, although most commonly used browsers support
    them. Using animated GIFs is a simple way to provide animation without resorting
    to Java applets or to more sophisticated plug-ins. You''ll find more information
    about animated GIFs in Chapter 11.


    > TIP Animated GIFs are much larger than nonanimated GIFs, containing the equivalent
    of an additional image for each panel of animation.


    GIF supports progressive rendering. Progressive rendering is also known as interlacing,
    which refers to how an image comes up on the screen. A browser displays a non
    interlaced image line by line, as it is received over the network or loaded off
    a disk. The complete image is not visible until all have loaded. A browser displays
    interlaced images in passes, filling in every eighth line until the entire image
    is displayed.


    The effects of interlacing vary from browser to browser. Some browsers display
    it as downloading image as slowly coming into focus. Other browsers display it
    as venetian blinds slowly being opened until the entire image is displayed. Either
    way, interlaced images begin to appear on the screen faster than noninterlaced
    images and allow visitors to who are familiar with the image to get the gist before
    the whole image appears.'
  merge: -1
  pgno: 175
- img_proc: false
  md: 'GIF supports lossless compression. Lossless compression is an efficient way
    to save files without losing image details. They are saved, when GIFs are compressed
    to take less space on the disk and less time to download. With lossless compression,
    the compression algorithm notices broad expanses of single colors, and, instead
    of recording the color for each individual pixel, it indicates the color and the
    number of times to repeat the color. The image is not changed; it is simply saved
    more efficiently. Because GIF compression is lossless, GIF images are best for
    line art, icons, and drawings.


    NOTE GIFs do have one disadvantage—they can only include 256 colors, which is
    not sufficient for true photographic quality. Although for many purposes 256 colors
    are adequate, you may want to use the JPG file format for images requiring higher
    quality.


    # Understanding JPG/JPEG


    JPG, which is pronounced jay-peg, is an acronym formed from Joint Photographic
    Experts Group. This format (often written as JPEG) is the second most popular
    format on the Web. As a whole, JPG images are less flexible than GIF images, and
    most significantly, they do not support the variety of rendering options that
    GIF supports.


    TIP Although JPG supports progressive rendering, the most common browsers do not
    take advantage of this feature.


    The most significant advantage of JPG is that it supports millions of colors,
    thereby providing much more realistic photographic reproduction. Additionally,
    because JPG images use a more effective—but lossy—compression algorithm, they
    are much smaller and faster faster. Lossy compression discards some of the image
    to decrease the file size. JPG images are best for photographs because the loss
    of detail is less noticeable with photographs than with line art; plus, the compression
    ratio and resulting quality are better with photographs.


    Setting JPG options in your image-editing program helps control the eventual file
    size and the quality. In many image-editing programs, you can set the number of
    dots per inch (DPI) and the level of JPG compression. If the images are only for
    Web use—they won''t be used for print publications—a DPI of 100 is more than adequate.
    Depending on the image, the application, and the eventual purpose of the image,
    you can often increase the compression substantially without losing much detail.'
  merge: -1
  pgno: 176
- img_proc: false
  md: '# Understanding PNG


    PNG, pronounced *ping*, stands for Portable Network Graphics. This new image format
    is only supported by the most recent browser versions (Microsoft Internet Explorer
    4 or later and Netscape Navigator 4.04 or later); however, PNG images combine
    most of the advantages of GIF, including transparency and interlacing, plus the
    ability to accommodate millions of colors and a tight, lossless compression technique.


    # Which Image Format Is Right for You?


    Which image format you choose depends on the features you want to include. Table
    6.1 compares the features of the three graphic formats examined.


    | Features | GIF | JPG | PNG |

    | --- | --- | --- | --- |

    | Transparency | Yes | No | Yes |

    | Interlacing/progressive rendering | Yes | Qualified Yes | Yes |

    | Millions of colors | No | Yes | Yes |

    | Lossless compression | Yes | No | Yes |

    | Good for line art | Yes | No | Yes |

    | Good for photographs | No | Yes | Yes |

    | Accepted on most browsers | Yes | Yes | No |


    As you can see, GIF and JPG have complementary advantages and disadvantages. As
    more browsers support PNG, however, it will probably become the first choice.


    # Adding Images


    In this section, we''re going to create Web pages for ASR Outfitters, a mountaineering
    and hiking supply company that is a mythical, minivers of REI, the recreation
    retailer. In the process, you''ll learn how to include images in an HTML document.
    Although this may seem like putting the cart before the horse, knowing how to
    include images makes learning to develop them easier.


    Table 6.2 shows the main image tags and attributes used to insert images in Web
    pages.'
  merge: -1
  pgno: 177
- img_proc: false
  md: '# TABLE 6.2: IMAGE TAGS AND ATTRIBUTES


    | Tag | Use |

    |---|---|

    | <IMG> | Marks an image within an HTML document |

    | ALT="..." | Specifies alternative text to display if an image is not displayed
    |

    | SRC="..." | Points to an image file (URL) to include |

    | HEIGHT=n | Specifies the final height of an image in pixels |

    | WIDTH=n | Specifies the final width of an image in pixels |

    | BORDER=n | Specifies the width of a border around an image, pixels |

    | ALIGN="..." | Specifies image alignment as TOP, MIDDLE, BOTTOM, LEFT, or RIGHT
    |


    # # Adding an Image


    Adding an image is similar to adding the tags and attributes you''ve already used.
    You use the `<IMG>` tag, which specifies an image, plus the SRC=attribute to specify
    the filename or URL. For example, if you''re including an image that''s located
    within the same folder as your document, your code might look like this:


    ```

    <IMG SRC="logo.gif">

    ```


    Or, if you''re including an image located on the Web, you would include an absolute
    URL, like this:


    ```

    <IMG SRC="http://www.asroutfitters.com/gifs/as.gif">

    ```


    A URL used in the SRC attribute is called a remote reference. Referencing logos
    and images remotely has certain advantages and significant drawbacks. One advantage
    is that remote references to images ensure you''re always using the current logo.
    For example, if ASR Outfitters hires a graphic design company to change its corporate
    image, a franchisee''s site that uses remote references to the main site will
    reflect the changes as soon as the main site changes. Additionally, remote references
    lighten the load on your server that you must manage and manipulate.


    On the down side, changes that are out of your control can easily break links
    from your site. If the ASR Outfitters Webmaster decides to move images from a
    GIFs subdirectory to an images subdirectory, the franchisee''s site will no longer
    work, because the SRC= attribute points to the subdirectory that no longer contains
    the image files. From the visitor''s perspective, the franchisee simply has a
    nonfunctional site—the visitor doesn''t know or care about the reason.


    Additionally, network glitches or server problems can also render your images
    inoperative if you link to them remotely. If the load on your own site is significant'
