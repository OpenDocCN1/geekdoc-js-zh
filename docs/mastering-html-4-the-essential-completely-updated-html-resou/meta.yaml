    ALT="High Peaks Weather">

    <SHAPE=DEFAULT NOHREF>

    </MAP>

    ```


    After converting it, you end up with a CERN map file of the:

    default/asweather-imap.html


    circle (82,43) 30 /weather/uvi.html

