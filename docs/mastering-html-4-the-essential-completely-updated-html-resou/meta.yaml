  md: '# HTML Editors


    In general, HTML editors fall into two categories:


    +   - Text- or code-based, which allow you to see the HTML code as you''re creating
    documents

    - WYSIWYG (What You See Is What You Get), which show the results of code, similar
    to the way it will appear in a browser, as you''re formatting your document


    Although dozens of excellent WYSIWYG editors are available, you should learn to
    code HTML using a standard text editor. Text editors force you to hand-code HTML,
    meaning that you use enter tags and attributes. Hand-coding helps you learn HTML
    tags and structure and lets you see where you''ve made mistakes. Also, with hand-coding,
    you can easily include the newest HTML enhancements in your documents. Notepad
    for all Windows versions, or pico for Unix, and TextEditor or SimpleText for Macintosh
    are good choices.


    > TIP Learning to hand-code is essential for using the latest-and greatest HTML
    effects—whether it''s the current HTML 4 or a future version. Most new HTML versions
    are not immediately supported by WYSIWYG editors, so you will need to hand-code
    those tags and attributes in your documents.


    > WARNING Using a word-processing program such as Word, WordPerfect, or even WordPad
    to create HTML documents can often introduce extra formatting and control characters,
    which will cause problems. HTML requires plain text with no formatting at all,
    so either make special effort to save all documents as plain text, or just use
    a text editor.


    Simple WYSIWYG editors, such as Netscape Composer and Microsoft FrontPage Express
    (included with Internet Explorer 4 and 5), are good for quickly generating HTML
