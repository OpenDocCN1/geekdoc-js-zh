- img_proc: false
  md: "# TABLE 7.11; ADVANCED TABLE TAGS\n\n| Tag | Use |\n|---|---|\n| <HEAD> | Labels\
    \ the header area of a table. |\n| <BODY> | Labels the body area of a table. |\n\
    | <TFOOT> | Labels the footer area of a table. |\n| <COLGROUP> | Identifies column\
    \ groups within a table. |\n\n# Identifying Row Groups\n\nRow groups include parts\
    \ such as the header, body, and footer—the table parts that contain table rows.\
    \ To identify row groups, start with the standard table tags and include the HTML\
    \ 4 table tags around them. Take a look at the following code, which nests the\
    \ standard table tags within the table header tags (<HEAD> ... </HEAD>):\n\n```\n\
    <HEAD>\n<TR>\n  <TH COLSPAN=2>Merchandise</TH>\n  <TH COLSPAN=2>Descriptive Information</TH>\n\
    </TR>\n<TR>\n  <TH>Type</TH>\n  <TH>Product</TH>\n  <TH>Purpose</TH>\n  <TH>Industry\
    \ standard term</TH>\n</TR>\n</HEAD>\n```\n\nYou can also identify table body\
    \ parts by using the <BODY> tags, like this:\n\n```\n<BODY>\n<TR>\n  <TD ROWSPAN=3>Joining\
    \ Tools</TD>\n  <TD>Binder 1.0</TD>\n  <TD>Join multiple objects.</TD>\n  <TD>Stapler.</TD>\n\
    </TR>\n<TR>\n  <TD>Organizer 2.2</TD>\n  <TD>Join multiple objects for easy access\
    \ and changing.</TD>\n</TR>\n```"
  merge: -1
  pgno: 254
- img_proc: false
  md: '```

    <TD>Ring binder.</TD>

    </TR>

    <TR>

    <TD>Combiner 0.9</TD>

    <TD>Join multiple objects at the edges.</TD>

    <TD>Tape.</TD>

    </TR>

    <TD>Dividing Tools</TD>

    <TD>Splitter 3.2</TD>

    <TD>Divide single object into multiple smaller objects.</TD>

    <TD>Scissors.</TD>

    </TR>

    <TBODY>

    ```


    Finally, you can identify a table footer by using the <TFOOT> tags in the same
    way. The <TFOOT> tags must follow the <HEAD> and precede the <TBODY> tag.


    ```

    <TFOOT>

    <TR>

    <TD>Tool Combo</TD>

    <TD>A11</TD>

    <TD>Use for all office needs.</TD>

    <TD>N/A</TD>

    </TR>

    <TFOOT>

    </TABLE>

    ```


    At this point, the advanced table won''t look any different from the standard
    table. After you''ve tagged your table with these additional table tags, you can
    identify column groups or format the tagged parts with the advanced formatting
    tags.


    # Identifying Column Groups


    In addition to identifying table headers, body, and footers, you can identify
    column groups. The <COLGROUP> tags, which are used in conjunction with the SPAN
    attribute, are located at the beginning of the table and announce the columns
    to which you apply.


    The table shown in Figure 7.22, earlier in this chapter, can contain distinct
    groups of columns, with two columns in each. Therefore, there will be two <COLGROUP>
    tags with SPAN=2 attributes in each, and in the following example:


    ```

    <CAPTION ALIGN=TOP>8>Office Product Merchandise and Category

    ```'
