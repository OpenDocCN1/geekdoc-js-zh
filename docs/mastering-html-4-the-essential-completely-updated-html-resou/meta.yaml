    |---|---|---|n| Netscape Navigator | Yes | No |

    | Internet Explorer | Yes | Yes (in 4 and later versions) |

    | Lynx | No | No |


    Before including tables in an HTML document, be sure your visitors use a browser
    that supports tables. If they don''t, the table will not appear properly, if at
    all.


    > TIP Table features commonly not supported are noted throughout this chapter.


    # Creating Basic Tables


    Creating tables is a two-step process:


    +   1. Create the table structure—that is, enter the <TABLE> tags, specify rows
    and columns, and specify column headings.

    2. Enter the data in table cells.


    By creating the table structure and then entering the data, you can avoid layout
    errors. Most commonly, Web authors forget the closing </TABLE> tag or omit an
    entire paired tag. These errors result in an odd-looking table or no table at
    all. Ensuring that the table structure is in place before you start adding text
    can help you troubleshoot problems. Table 7.2 describes the basic tags.


    > TIP Table tags become complex quickly! Be sure that you open and close tags
    as needed and that you do not omit tags. Debugging problems in a table can be
    tedious and frustrating.'
