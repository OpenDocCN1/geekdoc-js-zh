  md: '# Specifying Fonts and Font Sizes


    If your visitors will be using fairly new browsers, you can use the <FONT> tag
    to specify font characteristics for your document, including color, size, and
    typeface. Table 2.10 describes the tag and attributes you''ll use to set font
    characteristics.


    | TABLE 2.10: FONT CHARACTERISTICS |

    | Tag/Attribute | Description |

    |---|---|

    | <FONT> | Sets font characteristics for text. |

    | SIZE="..." | Specifies relative font size on a scale of 1 through 7. Three (3)
    is the default or normal size. You can also specify the relative size by using
    + or -, +2. |

    | COLOR="..." | Specifies font color in #RRGBGB numbers or color names. This color
    applies only to the text surrounded by the <FONT> tags. |

    | FACE="..." | Specifies type faces as a list of possible type faces, in order
    of preference, separated by commas—for example, "Verdana, Arial, Helvetica". |

    | <BASEFONT> | Sets the text characteristics for the document. |


    As you are determining which font face to use, keep in mind that the font must
    be available on your visitors'' computers to view the fonts you specify. For example,
    if you specify Technical as the font to use and your visitors do not have Technical,
    their computers will substitute a font, which might not be a font you''d consider
    acceptable. As a partial way of overcoming this problem, you can list multiple
    faces in order of preference; the machine displays the first available. For example,
    a list of "Comic Sans MS, Technical, Tekton, Times, Arial" will display Comic
    Sans MS if available, then try Technical, Tekton, and so forth.


    So, which fonts should you choose? Table 2.11 lists fonts that are commonly available
    on PC, Mac, and Unix platforms.


    | TABLE 2.11: FONTS COMMONLY AVAILABLE ON PC, MAC, AND UNIX |

    | Windows | Macintosh | Unix |

    |---|---|---|

    | Arial | Helvetica | Helvetica |

    | Times New Roman | Times | Times |

    | Courier New | Courier | Courier |'
