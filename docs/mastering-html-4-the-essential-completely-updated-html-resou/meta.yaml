  md: 'sing Style Sheets—formally known as the World Wide Web Consortium Cascading
    Style Sheets recommendation, level 1 (CSS1)—is potentially one of the best ways
    to format HTML documents easily and consistently. Adopted by the W3 Consortium
    in December 1996, Style Sheets take a step toward separating presentation from
    content, returning HTML to its function-oriented roots yet allowing almost total
    control over page presentation. CSS2, adopted in May 1999, gives even more control,
    plus support for aural Style Sheets for screen-reading software.


    Are Style Sheets here to stay? In fact, the HTML 4 specification deprecates many
    tags and attributes (such as <FONT> and ALIGN=) in favor of Style Sheets.


    In this chapter, you will see how Style Sheets enhances the effectiveness of HTML
    and how you can benefit from them. You''ll learn how to apply Style Sheets to
    your HTML documents and how to develop the Style Sheet. We include some examples
    that illustrate how to implement Style Sheets, but you''ll want to take a look
    at the Cascading Style Sheets section of the Master''s Reference to get all the
    specifics. You find that Style Sheets gives you an enormous reference of formatting
    options (several of) which are actually supported by browsers.


    Before you decide to use Style Sheets, keep in mind that the newest browsers support
    them and the existing support is sketchy. Both Microsoft Internet Explorer 3 (and)
    and Net Navigator 4 (and) browsers offer some Style Sheet support; however, many
    Style Sheet features do not work consistently or at all even in these supporting
    browsers. In this chapter, we''ll discuss the advantages and limitations of Style
    Sheets to help you decide whether they''re right for your needs. And, of course,
    let''s take a look.


    # # How Do Style Sheets Works?


    As we mentioned in Chapter 1, HTML is a markup language that you use to identify
    structural elements in a document. For example, you can specify that this element
    is a first-level heading, one is a bullet point, this is a block quotation, and
    so on by manually inserting formatting tags and attributes. The browser (with
    input from the visitor) controls formatting and layout.


    Manually inserting all formatting tags can quickly become a tedious process. With
    Style Sheets, however, you specify formatting only once, and it is applied throughout
    the document. If youve used styles in a word processor, you''re familiar with
    this concept.'
  merge: -1
  pgno: 103
- img_proc: false
  md: 'Style Sheets promise to give you nearly the layout and format control you may
    be accustomed to in programs such as PageMaker or Quark. You can control how page
    elements look, where they appear, their color and size, the font they use, and
    so on. Now, you—rather than browsers and visitors—can determine page appearance.


    # Browsers, Visitors, and Style Sheets


    Unfortunately, Style Sheets are available only to visitors using Internet Explorer
    3 (or later) and Netscape Navigator 4 (or later). Visitors using earlier versions
    of these browsers or other browsers will see a plain HTML document that includes
    little more than the logical formatting elements—headings, paragraphs, tables,
    and lists, with no colors.


    In addition, because Style Sheet technology is new, browsers don''t provide stable
    or consistent support. Pages that use Style Sheets will appear differently in
    different browsers.


    Also, your visitors will have some control over the document appearance, regardless
    of the formatting you supply in the Style Sheet. They can disable Style Sheets
    or override them with their personal preferences for colors and fonts.


    # Some Advantages of Using Style Sheets


    In addition to giving you more control over how your documents appear to visitors,
    Style Sheets let you manage HTML documents more easily than if they were filled
    with formatting tags. When you place formatting commands in the Style Sheet, your
    document is less cluttered.


    Style Sheets reduce the time spent developing and maintaining HTML documents.
    Rather than manually formatting paragraphs of text, you simply change the style
    definition in one place—the Style Sheet—and the Style Sheet applies the definition
    to all occurrences in the HTML document. No muss, no fuss.


    Finally, Style Sheets give you flexibility from document to document within a
    Web site. Even if you use a Style Sheet that applies to all pages in the site,
    you can set up individual Style Sheets to apply to individual HTML documents.
    The individual Style Sheet overrides the global one. And, you can further tweak
    individual Style Sheets to accommodate special text formatting, such as a document
    in which certain paragraphs should appear in a different color.'
  merge: -1
  pgno: 104
- img_proc: false
  md: '# Implementing Style Sheets


    As you''re perusing the rest of this chapter, remember that your HTML documents
    and the associated Style Sheets work as a team. HTML documents carry the content,
    and the Style Sheets carry the formatting information. As you''ll see, developing
    Style Sheets is a two-part process:


    +   - You connect (or associate) the Style Sheet to the HTML document.

    - Then you develop the actual Style Sheet, complete with all the formatting options.


    # Associating Style Sheets with HTML Documents


    You can associate Style Sheets with your HTML documents in four ways:


    +   - You can embed the Style Sheet in the HTML document by defining it between
    the opening and closing `<HEAD>` tags.

    - You can store the Style Sheet in a separate document and link or import the
    Style Sheet to associate it with the HTML document.

    - You can apply style definitions to specified parts of an HTML document.

    - You can use inline style definitions.


    # Embedding the Style Sheet in the HTML Document


    Embedding the Style Sheet, which is the easiest of the four methods, means inserting
    the `<STYLE>` tags, along with style information, between the `<HEAD>` tags. Figure
    4.1 shows how to do this.


    Embedding Style Sheets makes maintaining or updating styles easy because you don''t
    have to work with two or more documents (the Style Sheet document and the HTML
    document)—you simply open the HTML document and adjust the Style Sheet code. If
    you are working with multiple documents or documents that you''ll update frequently,
    however, you''ll probably want to use another method. If you embed the Style Sheet
    in every document, you''ll have to adjust it in every document.


    To embed a Style Sheet in an HTML document, apply the tags and attributes shown
    in Table 4.1 between the `<HEAD>` tags.'
  merge: -1
