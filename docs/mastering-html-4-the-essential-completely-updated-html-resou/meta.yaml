    +   - Move the cursor horizontally to the edge of the circle, and note the coordinates.


    +   - Subtract the first x coordinate from the second x coordinate to get the
    radius of the circle.


    +   - Make a note of these coordinates.


    **Rectangles** To define a rectangle, follow these steps:


    +   - Identify the upper left corner and the lower right corner. Point your mouse
    at the upper left corner of the rectangle and record the coordinates; then point
    at the lower right and record the coordinates.


    +   - Make a note of these coordinates.


    **Polygons** To define a polygon, follow these steps:


    +   - Identify each point on the shape, moving in order around the shape. You
    can start at any point on the perimeter and proceed clockwise or counterclockwise,
    as long as you don''t skip points. For example, in the ASR Outfitters map, the
    Mid-Peaks area can be defined with three points—making a right triangle with the
