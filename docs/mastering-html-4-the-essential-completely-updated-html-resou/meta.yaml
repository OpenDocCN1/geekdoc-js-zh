- img_proc: false
  md: '# FIGURE 7.19


    Combine cell size and column span attributes to customize your tables.


    ![](bbox=[0.237, 0.116, 0.812, 0.465])


    # Specifying No Text Wraps


    If you reset the width of certain cells, you may want to ensure that the contents
    do not wrap to multiple lines. Add the NOWRAP attribute, as in the following example,
    to encourage the browser not to break the line.


    ```

    <TH COLSPAN=2 WIDTH=30% NOWRAP>Descriptive Information</TH>

    ```


    > NOTE HTML 4 deprecates the NOWRAP attribute. You guessed it—if your visitors
    have browsers that recognize Style Sheets, use them to format tables.


    To set a minimum size for a cell, smaller than which it cannot be displayed, use
    a transparent GIF image 1 pixel × 1 pixel in size with HEIGHT and WIDTH attributes
    set to the size necessary. (See Chapter 6 for more on using transparent GIF images
    for size control.)'
  merge: -1
  pgno: 248
- img_proc: false
  md: '# Adding Cell Spacing and Padding


    Cell spacing and padding refer to how much white space appears in a table. In
    particular, cell spacing refers to the spacing between cells, and cell padding
    refers to spacing between cell contents and cell borders.


    For many tables, open space around cell content makes the table much easier to
    read and more aesthetically pleasing. For example, the contents in Figure 7.20
    are somewhat difficult to read.


    Table 7.9 describes cell spacing and padding attributes.


    | TABLE 7.9: CELL SPACING AND PADDING ATTRIBUTES |

    | Attribute | Use |

    | --- | --- |

    | CELLSPACING=n | Specifies, in pixels, the amount of space between cells. |

    | CELLPADDING=n | Specifies, in pixels, the amount of space between cell contents
    and cell borders. |


    > TIP If the table has a border, the CELLSPACING= attribute enlarges the rule
    between cells. If there is no border, the space between adjacent cells will simply
    be somewhat larger.


    To add cell spacing and padding, include the attributes in the <TABLE> tag, like
    this:

    <TABLE CELLSPACING=5 CELLPADDING=5 ORDER=3>

    The resulting table will look like this:


    | Table Sample |

    | Office Product Merchandise and Category Information |

    | Merchandise | Product | Purpose | Industry standard term |

    | Type | --- | --- | --- |

    | Joining Tools | Render 1.0 | Join multiple objects | Stapler |

    | | Organizer 2.0 | Join multiple objects for easy access and changing | Rang
    border |

    | | Consumer 0.9 | Join multiple objects at the edges. | Tape |

    | Devolving Tools | Spatter 3.2 | Deonde single object into multiple smaller objects
    | Sensors |'
  merge: -1
  pgno: 249
- img_proc: false
  md: '# FIGURE 7.20


    Adding more space within and between cells would help improve readability and
    appearance.


    ![](bbox=[0.248, 0.095, 0.812, 0.452])


    # Specifying Table Alignment, Width, and Text Wrap


    Up to now in this chapter, most of the tags and attributes have specified the
    relationship of the table contents to each other or to other table components.
    Table width, alignment, and wrap settings, however, specify how the table fits
    into the HTML document as a whole.


    These settings are important for two reasons:


    +   - Browser and computer settings vary significantly from computer to computer.
    By using width, alignment, and wrap attributes, you help ensure that your visitors
    can easily view your tables.


    +   - By default, text that surrounds tables does not wrap—it stops above the
    table and starts below the table. The table itself takes the full browser width.
    These attributes narrow the space that the table uses and allow the text to wrap
    around the table.'
  merge: -1
  pgno: 250
