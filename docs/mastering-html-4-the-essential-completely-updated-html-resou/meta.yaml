  md: '# CHAPTER 4 • STYLE SHEETS


    To import a Style Sheet, follow these steps:


    +   1. Start with a complete style block, such as the following code:


    ```

    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0//EN">

    <HTML>

    <HEAD>

    <TITLE>ASR Outfitters</TITLE>

    <STYLE>

    ---


    -->

    </STYLE>

    </HEAD>

    ```


    +   2. Within a style block or Style Sheet, add a line similar to the following:


    ```

    <STYLE>

    ---

    @import url(''red.css'');

    -->

    </STYLE>

    ```


    A complete style block that does nothing but import two Style Sheets would look
    like the following:


    ```

    <STYLE>

    ---

    @import url(''red.css'');

    @import url(''redder.css'');

    -->

    </STYLE>

    ```


    **Linking.** This method has a distinct advantage over the other methods: For
    example, you can link one choice of Style Sheets to use for a specific page. For
    example, a page that visitors will read online and link a different Style Sheet
    to a page that visitors will print, as shown in Figure 4.4. Theoretically, you
    could develop a Style Sheet (as browsers implement this functionality) optimized
    for astral presentation. Although you could import a Style Sheet, linking the
    Style Sheet is a better-term choice because future browser versions should offer
    more flexibility in handling Style Sheets, including the option to select from
    among multiple Style Sheets. Importing offers no choices—it just loads the Style
    Sheet. Table 4.3 explains the tags and attributes you use to link Style Sheets
    to HTML documents.'
