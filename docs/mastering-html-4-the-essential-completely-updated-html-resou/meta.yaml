  md: "# CHAPTER 7 • DEVELOPING TABLES\n\n![](bbox=[0.193, 0.098, 0.235, 0.139])\n\
    \nNOTE You can still control the border width with the BORDERn attribute, covered\
    \ earlier in this chapter. For example, to set the outside border to 3 pixels\
    \ wide, the opening <TABLE> tag would look like this:<TABLE FRAME=BOX BORDER=3>.\
    \ The BORDER= attribute in the <TABLE> tag affects only the width of the outside\
    \ border, not the width of the internal rules.\n\n+   2. Add inside borders (called\
    \ rules) by adding the RULES= attribute to the <TABLE> tag, like this:\n\n```\n\
    \ <TABLE FRAME=HSIDES RULES=NONE BORDER=3>\n```\n\nIf you look carefully, you'll\
