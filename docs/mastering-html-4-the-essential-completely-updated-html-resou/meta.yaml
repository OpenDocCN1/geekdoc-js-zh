    </CAPTION>


    2. Add caption text, like this:


    <CAPTION>

    Office Product Merchandise and Category Information

    </CAPTION>


    3. Specify whether the caption should appear above or below the table by using
    the ALIGN=TOP or ALIGN=BOTTOM attribute, like this:


    <CAPTION ALIGN=TOP>

    Office Product Merchandise and Category Information

    </CAPTION>


    4. Optionally, add character-level formatting tags to the caption. The caption,
    without boldface or italics, often gets buried in the table.


    <CAPTION ALIGN=TOP><b>Office Product Merchandise and Category Information</b></CAPTION>


    The resulting caption looks like that shown in Figure 7.9.


    > NOTE See Chapter 2 for a review of character-level formatting tags.


    > TIP Remember that the ALIGN= attribute controls where the caption appears. Where
    you insert the ALIGN= attribute within the <TABLE> tags has no effect on where
    the caption appears.'
