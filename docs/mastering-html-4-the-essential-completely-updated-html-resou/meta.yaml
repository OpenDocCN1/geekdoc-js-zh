    # Understanding Image Map Types


    The two types of image maps are:


    +   - Server-side

    - Client-side


    The feature distinguishing the two types is where, the processing takes place
    (where a visitor’s mouse-click is translated into a link to one to another document).
    The processing'
  merge: -1
  pgno: 194
- img_proc: false
  md: '# CHAPTER 6 • INCLUDING IMAGES


    can occur either on the server (hence, server-side image map) or on the visitor''s
    computer (hence, client-side image map).


    # Server-Side Image Maps


    In a server-side image map, the coordinates of the click are transmitted to the
    server computer, which determines the instructions that apply to that click. The
    server then sends that information back to the client, which then sends a request
    for the appropriate document. The server computer does the calculating and tells
    the client what to do.


    The advantages of using server-side image maps are that they have been around
    longer than client-side maps and that they are widely supported. The disadvantages
    of using server-side image maps include the following:


    +   - Because a server-side image map requires input from the server, it generally
    responds slower than a client-side image map, depending on network traffic.

    - The server may need supplemental software to process the image map.

    - The server administrator may have to specify how the image map is processed.


    # Client-Side Image Maps


    Generally, you''ll want to use client-side image maps for several reasons. To
    start with, they''re faster (because there''s no need for back and forth communication
    between client and server to process the map) and more reliable, for those browsers
    that support client-side maps (and most do). For example, if a document with a
    client-side image map comes from Server A and points to a document on Server B,
    the client can do the calculations and request the document from Server B.


    Client-side image maps are more user-friendly than server-side image maps. When
    a visitor moves the cursor over an image-map link within the status bar generally
    displays the URL of the link. Newer browsers, including the latest versions of
    Netscape Navigator and Internet Explorer, also show information about the link
    in a small pop-up window. In contrast, when a visitor places the cursor over a
    server-side image-map link, the status bar displays only the coordinates of the
    cursor.


    Finally, client-side image maps are better for you, the Web author, because you
    can use and test them before you put the image map on the server. In the latest
    versions, server-side maps do not work until they have been installed on the server,
    making testing more difficult.'
