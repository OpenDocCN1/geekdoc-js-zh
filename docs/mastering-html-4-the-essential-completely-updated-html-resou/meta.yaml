  md: '> NOTE Ask your server administrator which image-map format you''ll need to
    use for a server-side image map. Additionally, check on what the URL is using
    for a server-side image map.


    The only real issue with converting your client-side image map to a server-side
    map is that you must know more (be sure of) the URLs. For example, everything
    in the ASR example was located initially in one folder. To properly set up a server-side
    map, we need to determine the full path to the information. Because of limitations
    in the NCSA image map implementation, the map should be contained in a subdirectory,
    not in the server root. ASR will put the image-map document, the map file, and
    the associated (linked) files together in the weather subdirectory of www.asroufitters.com.
    Therefore, the complete URL to the main file is:


    ```

    http://www.asroufitters.com/weather/asweather-map.html

    ```


    > NOTE You must use server-relative URLs or absolute URLs to ensure that everything
    works properly. See Chapter 3 for more about URLs.


    # Creating an NCSA Image Map


    In general, the NCSA image map format is


    ```

    method URL coordinates

    ```


    The code for the sample client-side image map looks like this:


    ```

    <MAP NAME="weather_zones">

    <AREA SHAPE=CIRCLE COORDS=82,43,30 HREF="uvi.html" ALT="UV Index">

    <AREA SHAPE=RECT COORDS=1,209,516,320 HREF="valley.html" ALT="Valley Weather">

    <AREA SHAPE=POLY COORDS=199,207,513,205,514,717 HREF="midpeaks.html" ALT="Mid-Peaks
    Weather">

    <AREA SHAPE=POLY COORDS=63,123,251,98,365,134,198,204,731,121 HREF="highpeaks.html"
    ALT="High Peaks Weather">

    <AREA SHAPE=default NOHREF>

    </MAP>

    ```


    Use an NCSA server-side map file like this:


    ```

    default /weather/asweather-map.html

    ```'
