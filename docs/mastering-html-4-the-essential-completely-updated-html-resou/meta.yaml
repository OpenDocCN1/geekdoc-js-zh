- img_proc: false
  md: '# FIGURE 7.21


    Text wrapping some-times causes unusual effects.


    ![](bbox=[0.248, 0.098, 0.813, 0.452])


    # Using HTML 4 Table Features


    HTML 4 table features give you added control over formatting tables. Instead of
    for-formatting the table as the whole, you can format specific table parts, such
    as the table head, body, footer, and column groups.


    At the time of writing, only Internet Explorer supports these tags; however, because
    they are part of the current specification, it''s likely that other browsers will
    eventually support them.


    You can use HTML 4 tables to format portions of the table separately—as sections,
    rather than as individual cells. For example, you can do the following:


    +   - Group similar areas of tables and add borders around the areas.


    +   - Add lines or text formatting to table headings.


    +   - Include a table footer, which is handy if a table has totals at the bottom
    of the columns.


    +   - Use these additional tags as hooks for Style Sheets to get into more sophisticated
    formatting. All style tags can be used with these tags.'
  merge: -1
  pgno: 252
- img_proc: false
  md: ''
  merge: -1
