  md: "our next step toward becoming an HTML pro is including images, which can add\
    \ pizzazz to your Web pages, help provide information, or just add a splash of\
    \ color. The key to including images is to do so wisely—that is, choose graphics\
    \ that have a purpose, use appropriate formats, and employ graphics that by taking\
    \ the time to use images wisely, you can maximize their effectiveness for your\
    \ visitors.\n\nIn this chapter, we'll show you how to choose appropriate images,\
    \ choose file formats, use images for different purposes, and develop image maps\
    \ (those clickable images with multiple links). With that, let's take a look.\n\
    \n# Developing Images\n\nImages add life to your Web pages, they can become a\
    \ liability if not developed properly. For example, images can take F-O-R-E-V-E-R\
    \ to load, becoming an obstacle for your visitors. Likewise, images can unnecessarily\
    \ help obscuring important content. So, your goal in using images is to develop\
    \ them properly by considering three things:\n\n+   * File size\n* Physical dimensions\n\
    * File type\n\n# Determining File Size\n\nThink of image files as being three-dimensional,\
    \ having height and width as well as a number of colors. For example, a 16-color\
    \ image not only has height and width, which you can see on the screen, but it\
    \ also has 16 layers, for each color. Therefore, the image's basic file size equals\
    \ width × height × color depth.\n\nYou can reduce file size and, therefore, make\
    \ your images as efficient as possible, with the following techniques:\n\n+  \
    \ * Reduce the number of colors. For example, you can reduce the color depth of\
    \ an image that has millions of colors to only 256 colors with surprisingly little\
    \ degradation in quality.\n Reduce the physical image size. For example, you can\
    \ reduce an image from 600 × 400 pixels to 300 × 200 pixels. The resulting smaller\
    \ image includes the details and clarity of the larger size, yet it occupies significantly\
    \ less disk space. (You’ll find guidelines for sizing images in the following\
    \ section, “Dealing with Physical Size.\")"
