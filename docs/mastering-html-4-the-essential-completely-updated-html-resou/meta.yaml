    To create an RGB number from the values in this table, simply select one number
    from each column. For example, choose FF from the Red column, 00 from the Green
    column, and 00 from the Blue column to create the RGB number FF0000, which has
    the largest possible red component but no blue and green, therefore appearing
    as a pure, bright red. You will find a complete list of appropriate RGB numbers
    and corresponding descriptions in the Master''s Reference.


    # Setting Background Colors


    Using a background color, which is simply a color that fills the entire browser
    window, is a great way to add color to your Web pages. By default, browsers display
    a white or gray background color, which may be adequate if you''re developing
    pages for an intranet site where flashy elements aren''t essential. If you''re
    developing pages for a personal or private site, however you''ll probably want
    to make your site more interesting and visually appealing. For example, if you''re
    developing a public corporate Web site, you might want to use your company''s
    standard colors—ones that appear on letterhead, logos, or marketing materials.
    Or, you might want to use your favorite color if you''re developing a personal
    site. In either case, using a background color can improve the overall page appearance
    and help define a theme among pages.


    > Check out Chapters 13 and 14 for tips and information about developing coherent
    Web sites and for specific tips about public, personal, and intranet sites.


    As you''ll see in the next section, pay careful attention to how text contrasts
    with the background color. If you specify a dark background color, use a light
    text color. Likewise, if you specify a light background color, use a dark text
    color. Contrast is key for ensuring that visitors can read information on your
    pages.'
