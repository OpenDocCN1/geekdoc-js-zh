    # Creating Table Borders


    You specify table borders using an attribute and a number, measured in pixels,
    that tell browsers the width of the border. As shown in Figure 7.10, most browsers
    display borders as lines with a 3-D effect. Table 7.5 lists border attributes
    that newer versions of Netscape Navigator and Internet Explorer support.


    # TABLE 7.5: BORDER ATTRIBUTES


    | Attribute | Use |

    | --- | --- |

    BORDER=n | Specifies a table border width, which is measured in pixels. The larger
    the number, the wider the border. BORDER=0 removes borders (generally also the
    default setting |

    BORDER=#rrggbb | Specifies a color for the table border as #rrggbb number or name;
    supported by newer versions of Netscape Navigator and Internet Explorer. |


    To create a table border and specify its color, follow these steps:


    +   1. Add the BORDER= attribute to the opening table tag.


    ```

    <TABLE BORDER=2>

    ```'
