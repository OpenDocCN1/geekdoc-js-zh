    # Understanding Attributes


    Some tags work with attributes, which provide additional information about an
    element, such as how elements align, what other files should be accessed, or what
    color of an element. For example, an attribute might indicate that a heading should
    appear centered in the browser window, that the browser should load an image file
    from the Web, or that the page background should appear sky blue.


    So, suppose you want to center a heading in the browser window. You start with
    your heading and tags, like like this:


    ```

    <H1>A heading goes here</H1>

    ```


    and then add the ALIGN attribute to the opening tag, like this:


    ```

    <H1 ALIGN="center"> centered heading goes here</H1>

    ```


    All attributes go in the opening tag and are separated from other attributes and
    the tag by itself a space. Some attributes require quotes; some don''t. As a general
    rule, most attributes—those that include only letters, digits, hyphens, or periods—fine
    without quotes. For example, you can type ALIGN=CENTER or ALIGN="CENTER"; all
    browsers display these in the same way.


    Attributes that have other characters, such as spaces, % signs, or # signs, however,
    always require quotes. For example, if you use the WIDTH attribute to indicate
    a percentage of the document window, type WIDTH="75%".


    +   TIP When in doubt, use quotes with attributes. Although they aren''t always
    necessary, they never hurt. Throughout this book, we''ve included the quotes—for
    good practice and good example.


