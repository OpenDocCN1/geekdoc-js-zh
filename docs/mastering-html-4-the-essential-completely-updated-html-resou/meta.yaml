    built with HTML 4 tags and attributes. Knowing how to develop tables, you can
    effectively present complex data and create interesting page layouts. From here,
    check out these chapters:


    +   * Check out Chapter 2 for general formatting and design topics.

    * See Chapter 4 and the Master’s Reference for complete information about creating
    and applying Style Sheets.

    * Look at Chapter 6 to see how to include images and use colors wisely.

    * See Chapter 9 to see how to create HTML frames.

    * See the Master’s Reference for more table options.'
