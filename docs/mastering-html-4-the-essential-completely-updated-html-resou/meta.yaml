  md: 'Additionally, as a step toward speeding the perceived download and redraw time,
    you can specify the number of columns in the table. Doing so has no effect on
    the visual appearance of the table, but allows the browser to lay out the table
    quickly. Add the COLS= attribute to the <TABLE> tag, like this:


    ```

    <TABLE COLS=4>

    ```


    > TIP Because tables are laid out as soon as the whole table is downloaded to
    the browser (rather than line by line with regular text), using multiple, smaller
    tables will improve the perceived download time.


    # Design Workshop: Creating Newspaper-Style Headings


    Here''s a handy formatting trick. Use tables to set up a heading with several
    columns of text below it–like a newspaper:


    | For Sale: 1993 Jeep Wrangler, black, 4 door Like new. Newly totaled. Call 555-LSHEW
