  md: 'Before we dive into developing a Style Sheet, let''s take a look at some Style
    code:


    ```

    <STYLE>

    <--

    Selectors

    nP (color:green)

    P B (Color:magenta)

    Pred (color:red)

    -->

    </STYLE>

    ```


    Here''s what each part does:


    +   - The style block includes style and comment tags, plus style definitions
    (or rules).

    - Selectors are HTML elements. In this example, the P—as in a paragraph tag—is
    a selector.

    - Declarations are the properties of the HTML elements, such as color, background,
    alignment, and font. In this example color:red is the definition. The style block
    is enclosed within brackets, [].

    - Classes specify an additional style definition associated with specific occurrences
    of the HTML element. For example, paragraphs tagged with <P CLASS=red> would use
    this class.

    - Each style definition can define the formatting associated with a specific HTML
    tag, with a specific CLASS, or with a specific ID. The formatting associated with
    HTML tags appears in the document without any special action on your part. Style
    definitions for Classes or IDs also require that you add the CLASS= ID= to the
    appropriate HTML document section before the formatting can appear in the HTML
    document.


    To add these elements, follow these steps:


    +   1. Be sure the style block is in place, like this:


    ```

    <STYLE>

    <--

    -->

    </STYLE>

    ```


    +   2. Add a selector and brackets, as shown here:


    ```

    <STYLE>

    ```'
