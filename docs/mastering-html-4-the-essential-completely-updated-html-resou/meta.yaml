- img_proc: false
  md: '> **TIP** Specifying all cell widths decreases perceived download time by allowing
    some browsers to lay out the table as it arrives, rather than waiting for the
    whole table to download. The table still takes the same time to download; however,
    it appears to load faster because it arrives gradually, rather than in one big
    chunk.


    You can specify cell size in two ways:


    +   - As a percentage of the table width

    - As a specific size, measured in pixels


    Although most browsers support alignment attributes, how they display attributes
    depends on the table size and other table cell settings. For example, a cell size
    that is 50 percent of the table will be wider or narrower, depending on the screen
    resolution and on the size of the browser window. Likewise, if you set cell width
    to 100 pixels, it will be exactly in browsers that support cell width tags, regardless
    of what that does to the overall page layout.


    > **TIP** If you can avoid setting cell widths in your tables, do so. The more
    restrictively you set the table formatting, the less leeway the browser has to
    reformat the table to fit and the more unpredictable results.


    Use the attributes in Table 7.8 in either <TH> or <TD> tags to control the table
    width and text wrap.


    | TABLE 7.8: TABLE WIDTH AND TEXT WRAP ATTRIBUTES |

    | Attribute | Use |

    | WIDTH="n" | Specifies the width of a cell in either pixels or as a percentage
    of table width.

    | NOWRAP | Prohibits text wrapping within the cell, requiring all text to appear
    on one line. |'
  merge: -1
  pgno: 246
- img_proc: false
