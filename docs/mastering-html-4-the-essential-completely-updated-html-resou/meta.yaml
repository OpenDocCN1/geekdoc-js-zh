  md: '# Consider Visitors’ Computer Settings


    Your visitors'' computer settings will also affect how images appear onscreen.
    An image that''s 600 × 400 pixels will take up practically the entire screen on
    a resolution of 640 × 480. But that image will take up much less space on a computer
    set to 1280 × 1040. A good rule of thumb is to limit image size to no more than
    600 × 400 pixels. An image of this size will fit completely within the browser
    window on Windows computers using the lowest (and, unfortunately, quite common)
    screen resolution of 640 × 480 pixels. And, of course, if you can make images
    smaller, so to help speed loading time.


    +   TIP To convey content adequately, few images need to be larger than 600 ×
    400. Some thing in the 300 × 200 pixels range is usually a good size for photographs,
    and buttons are generally 50 × 50 pixels or smaller.


    # Understanding Image Formats


    When developing images, you should also consider your format options. Basically,
    you can use GIF, JPG, or PNG formats, depending on what you want to do.


    # Understanding GIFs


    The most common image format is GIF (pronounced like jiffy), which is an acronym
    formed from Graphics Interchange Format, developed by CompuServe for online use.
    If you''re browsing in your image-editing software''s Save As options, you''ll
    notice that the GIF file format has two versions: 87a and 89a. You''ll want to
    choose version 89a, which includes the following features.


    GIF supports transparency. Transparency sets an image''s background color to the
    browser''s background color, thereby making the image appear as if it has no background.
    For example, the ASR Outfitters logo is a transparent image—the corner areas are
    a different color and set to be transparent. Figure 6.1 shows this image as it
    appears in an image-editing program (Paint Shop Pro); even if you set the background
    as transparent, you can still see it. Figure 6.2 shows this image as it appears
    in a browser (Internet Explorer).'
