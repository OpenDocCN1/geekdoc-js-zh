  md: 'inks are the "hyper" part of hypertext—that is, the part that you use to jump
    from one document to another. Links differentiate HTML documents from other electronic
    documents. They connect your HTML documents to create a unified Web site as well
    as connect them to other information on the Internet.


    In this chapter, we''ll show you how to include various kinds of links in your
    HTML documents. Through the examples and instructions, you''ll see that links
    are made up of nothing more than a Web address and a few HTML tags, which are
    easy to include in your Web pages. Specifically, you''ll learn to link to your
    site, to other sites, and to specific places within pages. In addition, you''ll
    learn how to include e-mail links.


    Links (also anchors) mark text or elements as point to other HTML documents, images,
    applets, multimedia effects, or specific places within an HTML document. Links
    are made up of three parts:


    +   - An anchor tag, <<a>, which marks the text or image as a link.

    - An attribute, HREF="...", which is located within the opening anchor tag, as
    in <A HREF="...\</a>.

    - An address (called a URL), which tells browsers the file to link to. URLs identify
    file locations (addresses) on the Web or on your local hard drive. These addresses
    can be HTML documents or elements referenced by documents, such images, applets,
    scripts, and other files. The URL is always enclosed in quotes, for example, "address.html".


    Put these together, and a basic link looks like this:


    | Attribute | Address | Closing anchor tag |

    |--- |--- |--- |

    | <A HREF="http://www.xmission.com/~ejray/index.html"> | Our Site |</A> |


    The "link text" part of this example actually appears in the document. Text links
    usually display as blue and underlined text, but this depends on your visitor''s
    computer and browser settings. Image links generally appear in a border. Figure
    3.1 shows text and images used as links.'
  merge: -1
