  md: '# URL Anatomy


    URL (pronounced U-R-ell) stands for Uniform Resource Locator, which is an address
    of a document on the Web or, more accurately, on the Internet. Although a URL
    can look complex and long, it is generally made up of four basic parts—protocols,
    hostname, folder name, and filename—each of which has a specific function.


    ![](bbox=[0.388, 0.246, 0.815, 0.383])


    # Protocol


    The protocol specifies the computer language used to transfer information. Specifically,
    a protocol tells the browser where the information is located (for example, on
    a Web server, an FTP [File Transfer Protocol] server, a local hard drive, and
    so on) and tells the browser what to expect from the document retrieval process
    (for example, whether a logon is required, what information about the document
    will be provided by the server, and so on).


    The protocol you use in your links depends on where the destination file is. One
    of the most common protocols you use in links is HTTP, or hypertext transfer protocol,
    which indicates that information is located somewhere on the World Wide Web. Like-wise,
    if you are linking to an HTML document in a specific location on your local computer,
    you''d use file:/// as the protocol indicator to specify that a browser should
    look for the file on its local computer. Or, if you want to link to information
    located on an FTP server, you''d use ftp:// as the protocol indicator.


    Table 3.1 lists some of the more common protocols you can use in links within
    your HTML documents.'
  merge: -1
  pgno: 87
- img_proc: false
  md: '# TABLE 3.1: COMMON PROTOCOLS


    | Protocol Indicator | Use |

    | --- | --- |

    | http:// | For documents on the Web, including HTML documents and associated
    files. |

    | file:/// | For documents on the local hard drive. The third slash replaces the
    hostname, so you can simply type the folder and filename. |

    | ftp:// | For documents on an FTP server. |

    | gopher:// | For documents on a Gopher server. |

    | telnet:// | To open a Telnet connection to a specific host. Good for connecting
    to library catalogs. This protocol indicator is chancy, however, because you don''t
    know that Telnet applications are installed or configured on the visitor''s. |

    | wais:// | To connect to a WAIS (Wide Area Information Service) database. This
    is used because forms and CGI scripts offer a better way to process searches and
    because few WAIS clients installed and properly configured. |

    | mailto: | To open a mail message window in which visitors can send an e-mail
    message to the specified address. Most browsers support mailto; although it is
    not a standard or an officially accepted protocol. This indicator does not include
    //. |

    | news: | To connect to a newsgroup or a specific article in a group. This is
    guaranteed, though, because you don''t know which newsgroups your visitors might
    have access to. Also, before using the news: protocol, consider that articles
    periodically expire and disappear from the server. This indicator does not include
    //. |


    # # Homepage


    The hostname is the name of the server that holds HTML documents and related files.
    Each server has a specific address, and all documents stored on the server share
    the same hostname. For example, if your Internet Service Provider''s server name
    is xmission, your hostname would be something like www.xmission.com.


    # # Folder Name


    Folder names are the next chunk of information in a URL, indicating the folder
    in which files are located. You might think of folders as containers for the HTML
    documents you'
  merge: -1
  pgno: 88
- img_proc: false
  md: 'create. Just as you might use a manila folder to organize paper documents in
    your file drawer, you also use folders to contain HTML and related documents.


    > TIP The terms folder and directory are interchangeable. Folders are more commonly
    used in the context of desktop computers; directories are more common for older
    versions of Windows and for Unix.


    # Filename


    Filenames are the names of specific HTML documents and consist of two pieces of
    information:


    +   * A name, which identifies the file to display

    * A file extension, which specifies the file type—an HTML document, an image,
    a text file, and so on


    If you''re creating links to other documents and other locations on the Internet,
    you might use a wide range of filenames. Some will be short and cryptic—frntmeter.htm,
    newwhmp.htm—as a result of either the developer using Windows 3.x or (far less
    likely) as a result of the server using Windows 3.x. You might, however, also
    see much longer filenames if both the server and the developer use Windows 95,
    98, or NT, Macintosh, Unix, or some combination.


    When you''re including links in your HTML documents, you might not include a filename
    at all. For example, if you''re pointing to a Web site, you might include the
    URL http://www.yahoo.com/


    which includes only the protocol and the hostname. The specific filename (and
    name, in this case) is not necessary because they''re set by default. Visitors
    click that link, and the Yahoo server displays the home page by default because
    of the specific server settings.


    > TIP When using URLs in your links, enter them exactly as they''re given to you.'
  merge: -1
  pgno: 89
- img_proc: false
  md: '# Types of URLs


    URLs vary depending on the location of the document to which you''re linking.
    For example, a URL will be longer and include more information if the file is
    on the World Web. A URL will be shorter and include less information if the file
    is on your local computer or server. Basically, URLs fall into two categories:


    +   - Absolute

    - Relative


    An absolute URL contains all the information necessary to identify files on the
    Internet. A relative URL points to files in the same folder or on the same server.
    In other words, the file linked to is relative to the originating document. Figure
    3.2 illustrates absolute and relative URLs.


    # FIGURE 3.2: Relative URLs point to documents near the originating document,
    and absolute URLs point to documents on the Web.


    ![](bbox=[0.185, 0.403, 0.663, 0.893])'
  merge: -1
  pgno: 90
- img_proc: false
  md: '# Absolute URLs


    You might think of absolute URLs as being similar to U.S. Postal Service addresses,
    which include a name, street address, apartment number (if applicable), city,
    state, and zip code. All this information is necessary for your letter to Aunt
    Vera to arrive at her house, and if any piece of information is missing (such
    as the street or apartment number), the letter might arrive late, arrive at someone''s
    house, or not arrive at all.


    Likewise, an absolute URL contains the protocol, hostname, folder name, and file-name,
    which are all essential for linking to Web sites. To link to another Web site,
    you have to provide all these tididits of information so that the right server,
    folder, and document can be found.


    Here are some sample absolute URLs:


    ```

    http://www.xmission.com/services/index.html

    http://www.altavista.com/

    ftp://raycomm.com/download/readme.txt

    ```


    # Relative URLs


    A relative URL usually contains only the folder name and filename or even just
    the file name. You can use these partial URLs when you''re pointing to a file
    that''s located in the same folder or on the same server as the originating file.
    In these cases, a browser doesn''t need the server name or protocol indicator
    because it assumes the files are in a folder or on a server''s relative to the
    originating document.


    Using a relative URL is similar to instructing someone to "next door” for a piece
    of information. In this case, next door is relative to where you are; it''s accurate
    and complete only if you originate the request from a path that has a next-neighbor
    with the correct information.


    You can use relative URLs to refer to documents in relation to the originating
    document (called a document-relative URL) or to the server on which the originating
    document resides (called a server-relative URL). Figure 3.3 illustrates how relative
    folders and files relate.


    # Document-Relative URLs


    You''ll use a document-relative URL when you''re developing or testing a set of
    HTML documents. As we developed examples for this book, we used document-relative
    URLs and put all the files in a single folder. In fact, in most cases, we included
    only the filename. For example, when linking from our index.html document, we
    use these document-relative URLs:


    ```

    services/consulting.html

    services/other/tips.html

    ```'
  merge: -1
  pgno: 91
- img_proc: false
  md: '# FIGURE 3.3


    You can indicate each of these locations with a relative URL when linking from
    other nearby documents.


    ![](bbox=[0.318, 0.131, 0.755, 0.483])


    Notice that URLs include only the folder name and filename. The protocol and hostname
    are not necessary because both documents are relative to the originating index.html
    document. When linking between these two documents, though, you have to include
    the folder name, because these documents are in different folders. In this case,
    when linking from consulting.html to other.html, you have to make the two files
    relative to each other by specifying the folder name, like this:


    other/tips.html


    If you''re familiar with the Unix and DOS convention of using ".." to move up
    a directory in the hierarchy, you can use that as well to link to documents in
    other folders. For example, to link from consulting.html to names.html (see Figure
    3.3), you could use a link like this:


    ```

    <A HREF="../contacts/names.html">link text</A>

    ```


    The address indicates moving up a level (the .. part), then into the folder, and
    then into the names.html document. Likewise, a link within tips.html to the names.html
    file would look like this:


    ```

    <A HREF="../contacts/names.html">link text</A>

    ```


    Nested folders that lie deep within the server hierarchy or sets of folders that
    might be used and moved as a unit can benefit from these links. These relative
    URLs can link'
  merge: -1
  pgno: 92
- img_proc: false
  md: 'all the documents within the unit (say, everything within the drawing), and
    then you move the unit to other servers or even to other locations within the
    specific server hierarchy. All the links among the documents will continue to
    work.


    # Server-Relative URLs


    A server-relative URL is relative to the server root—that is, relative to the
    hostname part of the URL. Figure 3.4 illustrates how documents and folders relate
    to servers.


    FIGURE 3.4

    The same set of files as in Figure 3.3, positioned in relation to the server


    ![](bbox=[0.266, 0.287, 0.933, 0.778])


    Server-relative URLs have a forward slash (/) at the beginning of the filename,
    which indicates that you interpret the path of the document from the top of the
    current server (the server root), rather than from the current document location.
    For example, from anywhere in our site, we could use a server-relative URL to
    display our home page'
  merge: -1
  pgno: 93
- img_proc: false
  md: 'with a link to /index.html, which would display the index.html file right under
    the top of the server. Some server-relative URLs include:


    /index.html

    /contacts/names.html


    Likewise, you can link to folders and filenames with a server-relative URL. From
    the tips document, you can link to the URL like the preceding example.

    Server-relative URLs are useful when you are linking to a specific location on
    the server (such as contact information) that isn''t likely to change and isn''t
    clearly relative to the current document. For example, you might use a server-relative
    URL if you''re working on a document that does not have a specific home on the
    server but still links to specific pages (such as the home page). If you don''t
    use a server-relative URL, you''d have to code the server name into the URL, and
    then if you had to change servers or move the documents to a different server,
    the links would not work.


    > TIP Use URLs whenever possible because relative URLs let you move documents
    around without breaking too many links. If you link all your documents with absolute
    URLs, you''ll break all those links each time you move the documents around on
    or move them to a different server.


    # MASTERING PRODUCTIVITY


    # Setting the Base Location for a Document


    A lot of times, you''ll develop HTML documents and put them in one folder, only
    to move some of the documents to a different folder. When you move documents folders,
    the document-relative links will be broken. Rather than changing all the relative
    URLs, you can use the BASE HREF attribute in the <HEAD> tag to specify what the
    relative URLs are relative to.


    For example, suppose you want to move a document called ray.comm.com/test/long.html
    out of the "test" folder into the server root. Rather than editing all the links,
    you can just add <BASE HREF="http://www.raycomm.com/test/long.htm"> within the
    <HEAD> tag, like:


    ```

    <HEAD><TITLE>Document Title</TITLE>

    <BASE HREF="http://www.raycomm.com/test/long.htm">

    </HEAD>

    ```'
  merge: -1
  pgno: 94
- img_proc: false
  md: '# CHAPTER 3 • LINKING YOUR DOCUMENTS


    # MASTERING PRODUCTIVITY CONTINUED


    Including the BASE HREF= in the <HEAD> tag resets all relative links in the document
    so that all relative URLs point correctly into the test folder to the real locations
    of the documents. Without the BASE HREF= tag, all relative URLs from the 1long.html
    document would point to (nonexistent) documents within the server root.


    # Constructing Link Anchors


    Link anchors are the glue that holds the Web together. Fortunately, they are simple
    to construct—they require only a single tag and careful use of the URL. In this
    section, we''ll look at how to link to documents in the same folder, in different
    folders, and on different servers.


    # Linking to Documents in the Same Folder


    The basic link connects one document to another file in the same folder. Figure
    3.5 shows two documents within the same folder.


    FIGURE 3.5

    DocumentA.html and DocumentB.html both reside in a folder called FatFolder.


    ![](bbox=[0.433, 0.606, 0.735, 0.928])'
  merge: -1
  pgno: 95
- img_proc: false
  md: '# CONSTRUCTING LINK ANCHORS


    To create a link from DocumentA.html to DocumentB.html, you include the anchor
    tag (<A>), the HREF=attribute, and a URL that points to the filename of DocumentB.
    In this case, the link from the originating document (DocumentA) might look like
    this:


    ```

    <A HREF="DocumentB.html">link text goes</A>

    ```


    When linking to documents within the same folder, you will need only the filename.
    Without additional information, browsers will look in the same folder as the originating
    document. In this sense, both the locations of DocumentA and DocumentB are indicated
    relative to the folder in which they reside.


    # Linking to Documents in a Different Folder


    Commonly, you''ll link two documents that reside in different folders, as Figure
    3.6 shows. To create a link from aboutus.html to consulting.html, you include
    the folder and filenames, as in:


    ```

    <A HREF="services/consulting.html">link text</A>

    ```


    The folder (services) and filename (consulting.html) are separated by a forward
    slash (/), which indicates the end of the folder name and the beginning of the
    filename.


    ![](bbox=[0.01, 0.467, 0.903, 0.874])'
