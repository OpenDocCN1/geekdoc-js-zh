  md: "# Applying Style Sheets to Parts of Documents\n\nSo far, you've seen how to\
    \ apply Style Sheets to entire HTML documents. You can also apply styles included\
    \ in a Style Sheet to specific parts of HTML documents, as shown in Figure 4.5.\
    \ This is called applying style classes, which you define in your Style Sheet.\
    \ For example, you would specify in a Style Sheet that the first line of paragraphs\
    \ is indented. You might find that paragraphs after a bulleted list should not\
    \ be indented because they continue the information from the paragraph above it.\
    \ To address this issue, you can manually format the paragraph, which might be\
    \ appropriate for a one-time occurrence. A better solution, however, is to set\
    \ up a new class of paragraph tag within your style definition, say, continue.\
    \ You can use this new paragraph class whenever the first line of a paragraph\
    \ should not be indented. Table 4.4 describes the tags and attributes you use\
    \ to apply classes.\n\n![](bbox=[0.008, 0.368, 0.882, 0.545])\n\n TABLE 4.4: TAGS\
    \ AND ATTRIBUTES FOR APPLYING CLASSES\n\n| Tag/Attribute | Description |\n|---\
    \ | --- |\n| `<span>` | Holds style attributes and applies them to the HTML code\
    \ between the opening and closing tags. Surround letters and words with these\
    \ tags. |\n| `<div>` | Holds style attributes and applies them to the HTML code\
    \ between the opening and closing tags. Surround paragraphs or other block-level\
    \ elements with these. |\n| `class=\"*.*\"` | References a style class to apply\
    \ to a specified part of an HTML document. |\n| `id=\"unique\"` | Specifies a\
    \ unique name associated with a specific style definition. You can use this only\
    \ once within a Style Sheet. |"
  merge: -1
  pgno: 114
- img_proc: false
  md: "You can apply a class to an existing HTML tag, or you can use the <DIV> and\
    \ <span> tags to specify that the class apply to other elements—such as specific\
    \ letters or words—not individually specified by an HTML tag.\n\n# Applying Classes\
    \ to an HTML Tag Apply a class to an existing HTML tag—such as <P>, <h1>, <ul>,\
