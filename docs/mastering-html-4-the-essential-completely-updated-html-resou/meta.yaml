  md: 'Can you use new tags and attributes as they become available? For the most
    part, yes. By the time many popular tags and attributes become part of the standard,
    they already have browsers'' support. Some tags and attributes, however, including
    some that were introduced with HTML 4, did not have wide or stable browser support
    when the specification was released and do not to this day have nearly the breadth
    of support that other tags do. We''ll point these out throughout this book and
    show you how they differ from the previous versions of HTML.


    # # Monitor Netscape and Microsoft Sites


    Each time Netscape and Microsoft release a new browser version, look for new HTML
    extensions, which are browser-specific tags and attributes. Some of these extensions
    are useful, and so less, but as with any nonstandard tags introduced into HTML
    cause problems for both Web developers and visitors. Fortunately, fewer extensions
    seem to be introduced with each new release, but you should still be aware of
    what''s added with each release.


    If you''re using extensions in your HTML documents, keep in mind that they''re
    not standard HTML. That is, the extension is specific to a particular browser
    (say, Netscape) and will likely not work in other browsers (say, Internet Explorer
    or Opera or others). For this reason, we generally recommend that you don''t use
    extensions and, instead, use only HTML tags and attributes so that all your visitors
    can access the information you provide.


    > TIP At the time of this writing, about 50 percent of Net users used Netscape
    Navigator, about 40 percent used Internet Explorer, and the remaining 10 percent
    used a variety of other browsers. Realistically, about 80 to 90 percent of all
    Web users can access the major-of sites incorporating the latest HTML tags and
    recent enhancements.


    You can find Netscape''s extensions at:

    develop.netscape.com/index.html


    And you will find Microsoft''s extensions at:

    www.microsoft.com/windows/ie/'
