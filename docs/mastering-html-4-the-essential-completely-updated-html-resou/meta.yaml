  md: 'o far in this book, you''ve learned what HTML documents are, what they look
    like, and why you''d use them. And, if you''ve been following along with the examples,
    you''ve also created a few documents of your own. To this point, you''ve been
    developing and viewing the HTML documents on your local computer; however, at
    any time, you can go ahead and publish your HTML documents, making them available
    for other people to use and enjoy.


    In this chapter, we''ll show you options for publishing your documents, and we''ll
    walk you through the publishing process.


    # Places to Publish


    Basically, when you publish your HTML documents, all you''re doing is putting
    a copy of the documents on a server. The server stores your HTML documents and
    makes them available to Web site visitors (or, actually, the computers) that request
    them. Visitors visit the server what to get (by accessing a Web site), and the
    server requests pages.


    In general, you can publish your HTML documents in three ways:


    +   * Your ISP

    * Your corporate IS department

    * Your own server


    # Publishing through Your ISP


    One of the most common places to publish HTML documents is on Web space provided
    by an Internet Service Provider (ISP). ISPs usually provide a slew of Internet-related
    services, including Web space and help with your Web development needs. You can
    find out about ISPs in your area by researching the following:


    **The Web** For a comprehensive list of ISPs, along with contact information and
    services, visit www.yahoo.com/Business_and_Economy/Companies/Internet_Access_Providers/Directories/
    or the list.internet.com/.


    **Your local paper** Often, you''ll find ads for local ISPs in the Technology
    or Business section of your daily newspaper.


    **Other people** Ask friends, neighbors, business associates, or folks at your
    local computer store about the services they use and their experiences. The quality,
    reliability, and service of both ISPs and Web-hosting services vary, so get all
    the advice and input you can before you commit.'
  merge: -1
  pgno: 151
- img_proc: false
  md: '# Finding a Web-Hosting Service


    Another option—one that''s not quite an ISP, but similar—is a Web-hosting service.
    Web-hosting service does not provide dial-up internet access but simply provides
    a home from which you can serve your sites.


    Generally, you use Web-hosting services in conjunction with an ISP, thus combining
    the best Web-hosting deal with reliable dial-up access. Although it''s possible
    that a single company could meet all your needs, shopping for these services separately
    is use-ful. For a fairly comprehensive list of Web-hosting services, check out:


    www.yahoo.com/Business_and_Economy/Companies/Internet_Services/Web_Services/Hosting/


    ISPs provide a range of services, and you''ll need to do some research to find
    out about them, as well as start-up and monthly costs. In general, though, ISPs
    offer individual or business accounts.


    # About ISP Individual Accounts


    Generally, ISPs provide individual subscribers—as opposed to business subscribers—with
    access to the Internet, to e-mail, and to a relatively small amount of space on
    a Web server. Many ISPs also provide other services like sending the results of
    form via email. Exactly which depends on what you want to do with your HTML pages.
    For example, if you plan to create and publish simple HTML documents, you may
    only need a bit of Web space. On the other hand, if you plan to create an enormous
    Web site or one loaded with multimedia and downloadable files, you may need additional
    Web space. Or, if you plan to include forms or use-specific capabilities, you
    may need some server access or specific programs available on the server. So,
    in choosing an ISP account, first figure out what you want to do, and then find
    an ISP that can meet your needs.'
  merge: -1
  pgno: 152
- img_proc: false
  md: 'In addition to finding out what general services an ISP provides, you may also
    want to ask these questions, depending on your needs:


    What kind of server is it, and what platform does the server run on? If you know
    the server and the platform, you can find the documentation on the Web, which
    should tell you which scripts you can easily add. For example, if an Apache server
    is running on a Sun Sparc (a likely ISP scenario), you may request that your server
    administrator install specific Perl scripts. If you''re on an intranet with a
    Windows NT-based Netscape server and you hear of a cool enhancement to the WebStar
    on a Macintosh, you can save yourself some embarrassment and just not ask for
    it.


    Can I restrict access to my pages? When testing pages on the server, you don''t
    want the whole world to see them—setting a password-restricted access to the whole
    site helps with this. Additionally, if you have some pages that you want to make
    available to only a few people (or to everyone except a few people), you need
    to be able to set passwords and ideally that with little hassle and wasting time.


    > WARNING Be careful about publishing pages on the Internet. If you don''t provide
    links to a page or publish a page''s URL, people may still come across it. Additionally,
    search engines can also index such pages, making the pages available.


    Can I install and run my scripts? If you can, you''ll have a lot more flexibility
    and capabilities than you would otherwise. If you''re limited to what your ISP
    has already installed for your use, you are likely to have access to certain special
    capabilities, such as chat rooms, but not the flexibility to get what you really
    want.


    Do you maintain access logs? How can I find out how many hits my site gets? If
    you''re selling services, promoting your company, or doing anything else that
    involves a significant number of people seeing your message, you''ll need to be
    sure that accesses are logged, and you''ll need to learn how to get to those.


    > TIP Ask your server administrator what kinds of tools are available to view
    and sort access logs—the "raw" (unprocessed) logs are an ugly mess, but lots of
    neat programs exist to parse the logs into something useful. Although your server
    administrator might have some of these programs installed, the access instructions
    might not be publicized.'
  merge: -1
  pgno: 153
- img_proc: false
  md: '# PLACES TO PUBLISH


    Who do I call if the server fails to respond at 2 PM? How about 2 AM?

    Do you make backups, or do I need to back up my own site personally? Under what
    circumstances will you restore backup files—only if the server crashes or if I
    make a mistake and delete my files?


    > > TIP You might also ask these questions if you''re thinking about an ISP business
    account or publishing on a corporate server.


    # ISP Business Accounts


    If you are running a business and using the Internet (or if you''re moving in
    that direction), consider getting a business account with an ISP. Business accounts,
    although somewhat more expensive than individual accounts, usually include more
    Web space, better access to server-side programs, and more comprehensive services,
    with guaranteed uptime, backups, and more attention to individual needs.


    Many ISPs require a business account to have its own domain name, which replaces
    the ISP''s name in the URL. For example, instead of your business''s URL being:

    `www.xmission.com/ejray/index.html`n(which includes the ISP name and a folder
    designated for us), it simply reads:

    `www.raycomm.com`


    Having your own domain name enhances your professional appearance and can make
    your business appear bigger than it really is.


    Having your own domain name also offers a few advantages. First, you can keep
    a consistent address even if you move or change ISPs. Visitors (who may be your
    customers or potential customers) will always be able to find you because your
    address remains constant.


    Second, you can easily expand your Web site as your needs grow. If you start by
    having your service provider host your domain (called a virtual domain), you can
    easily expand your capacity or add services, without changing your address or
    revising your advertising materials.'
