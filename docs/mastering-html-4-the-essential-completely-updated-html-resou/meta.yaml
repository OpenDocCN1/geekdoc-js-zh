  md: '# Including Horizontal Rules


    Horizontal rules are lines that break up long sections of text, indicate a shift
    in information, or help improve the overall document design. To use a horizontal
    rule, include the <HR> tag where you want the rule to appear, like this:


    <P>Passages of text often be broken into sections with headings and, optionally,
    horizontal rules.</P>

    <HR>

    <h3>A Heading Also Breaks Up Text</h3>

    <P>A new long passage can continue here.</P>


    By default, horizontal rules appear shaded, the width of the browser window, and
    are a few pixels high. You can change a rule''s shading, width, height, and alignment
    by including the appropriate attributes. Table 2.7 shows horizontal rule attributes.


    > NOTE Pixels are the little dots on your screen that, taken together, produce
    an image. Pixel is actually an abbreviation for Picture Element. If your display
    is set to 800 × 600, you have 800 pixels horizontally and 600 pixels vertically.


    | Rule Attribute | Effect |

    | :--- | :--- |

    | SIZE=n | Specifies rule height; measured in pixels. |

    | WIDTH=n | Specifies rule width (length); measured in pixels. |

    | WIDTH="%n%" | Specifies rule width (length); measured as a percentage of the
    document width. |

    | ALIGN=LEFT | Specifies left alignment. |

    | ALIGN=CENTER | Specifies center alignment. |

    | ALIGN=RIGHT | Specifies right alignment. |

    | NOSHADE | Specifies that the rule has no shading. |


    Use any of these attributes, include them in the <HR> tag, like this:

    <HR WIDTH="80%" SIZE=8>

    <HR WIDTH="50%">

    <HR WIDTH=400 ALIGN=RIGHT>

    <HR NOSHADE ALIGN=CENTER WIDTH=200>'
