  md: '# CHAPTER 7 • DEVELOPING TABLES


    To ensure that your table background color(s) are effective, follow these guidelines:


    +   - Choose a light background color if your text color(s) are dark; choose a
    dark background color if your text color(s) are light.

    - Choose colors that are aesthetically pleasing and suit the purpose of your document.
    if your topic is fast-paced, choose bright colors; if your topic is slower-paced,
    choose paler colors.

    - View your HTML documents in a few different browsers.

    - Choose from one of the 216 nondithering colors.


    > TIP As we mentioned in Chapter 6, nondithering colors appear solid (not blotchy
    or spotted) in browsers. See Chapter 6 for more information.


    The table background color attribute BGCOLOR="#rrggbb", and it is used in the
    opening <TABLE> tag.

    Use a color through the background of the table, also BGCOLOR= followed by the
    RGB number or color name, in the following:


    ```

    <TABLE BGCOLOR="#FFFFFF">

    ```


