  md: '# Setting a Table Background Image


    Only the newer versions of Netscape Navigator and Internet Explorer support table
    background images. Other browsers display the browser''s default background color
    instead of the background image.


    > TIP To accommodate visitors who are using browsers that do not support background
    images and visitors who have image options turned off, use background images and
    background colors. Visitors can then view a table enhanced with color, rather
    than one that uses the browser''s default background color.


    Table background images are tiled—that is, they are repeated on the screen until
    the available background space is filled. Not all browsers tile images in the
    same way. For example, Figures 7.15 and 7.16 show how Netscape Navigator and Internet
    Explorer display a table that uses a small pair of scissors as the background
    image.


    # FIGURE 7.15


    A background image viewed in Netscape Navigator


    ![](bbox=[0.248, 0.463, 0.814, 0.796])'
  merge: -1
  pgno: 242
- img_proc: false
  md: '# FIGURE 7.16


    A table background image viewed in Internet Explorer


    ![](bbox=[0.295, 0.107, 0.905, 0.452])


    Although the image is inappropriately dark and the text is unreachable, the overall
    effect is quite different in each browser. In Figure 7.15, the tiling starts at
    the upper-left corner of each cell, and the caption is not part of the table for
    the purpose of background. In Figure 7.16, the image is rendered slightly larger
    and is tiled throughout the table without consideration for individual cells.


    > NOTE To ensure that the whole image is visible in a table cell (and only once),
    include the <IMG> tag in the table cell, not as a background image.


    Also, as Figures 7.15 and 7.16 show, background images can easily overpower table
    content if you use too many shapes, patterns, or colors. The resulting text becomes
    virtually unreadable.


    To ensure that you choose a suitable background image, follow these guidelines:


    +   * Choose small, subtle images that are not essential for conveying information.

    * Choose simple background images—ones with few shapes, patterns, or colors.

    * Choose background images that enhance the purpose of the document.

    * View your HTML documents in as many browsers as possible.'
  merge: -1
