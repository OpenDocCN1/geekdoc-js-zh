- img_proc: false
  md: 'PLACES TO PUBLISH


    127


    # A Great Example of a Local Test Server


    Any figures you see in this book that have a URL of hobbes.raycomm.com/ were developed
    on a server running on our local network, which is isolated from the Internet.
    The server software running on hobbes—at various times—includes the Netscape FastTrack
    Server, Windows NT built-in Internet Information Server, OmniHTTPD, Microsoft''s
    Personal Web Server, and under a different operating system, Apache for Linux.
    The hobbes server is a Pentium 100 computer with 32MB of RAM. The performance
    isn''t great, but it''s more than adequate for testing purposes. The client and
    server software were both on the local machine during testing.


    Although we could have loaded all the files onto our real Web site, that would
    have a lot of very under-development garbage out on the Internet under our URL.
    By testing locally, we keep the stuff that doesn''t work right yet to ourselves.


    Although we could have opened the files directly from the hard drive, that would
    have let us test server-side programs and server-relative URLs or give us the
    sense of working on a real server.


    Considering that it only took about 10 minutes to install the server software
    packages (on an existing network), it''s worth it.


    Particularly in a corporate or educational environment, where a network infrastructure
    exists, installing and running a server is straightforward. To run a public server,
    whether at home or at work, you''ll need a dedicated network connection—anything
    from a full-speed ISDN line from your ISP to a direct connection will work. If
    you''re setting up a local server for your own testing purposes, you can even
    run the server on a stand-alone machine.


    If you''re running your own server, here are some issues to consider:


    Security Web servers present a security risk, although not a huge one. Letting
    other people access files on your computer, by any means, is inherently a little
    iffy. If you''re paranoid about security, you don''t want to run a server on your
    desktop machine. On an intranet, assuming you don''t have highly confidential
    material on the server machine, you should be fine.'
