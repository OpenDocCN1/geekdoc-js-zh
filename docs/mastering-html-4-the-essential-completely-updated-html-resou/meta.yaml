  md: '# <!DOCTYPE ...> Tag


    <!DOCTYPE> tag tells browsers (and validation services) the HTML version with
    which the document complies. The HTML 3.2 and 4 specifications require this- unpaired
    tag, and therefore, you should use it in all your documents. Enter it at the top
    of your document, like this:


    ```

    <!DOCTYPE HTML PUBLIC-//W3C//DTD HTML 3.2 Final//">

    ```


    or, like this:


    ```

    <!DOCTYPE HTML PUBLIC-//W3C//DTD HTML 4.0 Transitional//">

    ```


    The key part of the <!DOCTYPE> tag is the DTD (Document Type Definition), which
    tells browsers that the document complies with a particular HTML version— the
    first example complies with HTML 3.2, and the second, with the HTML 4 Transi-
    tional (most flexible) specification. A DTD specifies the organization that the
    specification (W3C, in these cases) and the exact version of the specification.


    New HTML standards evolve, you can expect this tag to change to indicate new versions.
    In a year or so, the <!DOCTYPE> might look like this:


    ```

    <!DOCTYPE HTML PUBLIC-//W3C//DTD HTML 5.2 Final//">

    ```


    Even after new standards appear, you don''t need to revise the <!DOCTYPE> tag
    in existing documents. If your document conforms to the HTML 3.2 standard, it''ll
    con- form to that standard, regardless of more recent HTML versions.


    # Which HTML 4 DTD Should I Use?


    The HTML 4 specification comes in three varieties: strict, transitional (loose),
    and frame- set. The strict version prohibits everything except "pure" HTML, and
    you''re unlikely to use it unless you''re writing HTML documents that use no formatting
    tags and are rel- ing on Style Sheets to make them look good. To indicate that
    your document complies with the strict specification, use:


    ```

    <!DOCTYPE HTML PUBLIC-//W3C//DTD HTML 4.0//">

    ```


    The transitional version is the most flexible for accommodating deprecated but
    still use- ful tags and attributes, including nearly all formatting tags. To indicate
    that your docu- ment complies with the transitional specification, use:


    ```

    <!DOCTYPE HTML PUBLIC-//W3C//DTD HTML 4.0 Transitional//">

    ```


    Continued'
