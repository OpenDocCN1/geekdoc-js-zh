    # Speeding Perceived Image-Loading Time with Netscape


    A Netscape-specific tag, LOWSRC= works in conjunction with the SRC= attribute;
    it tells the browser to load a smaller version of the image first and then load
    the full image.


    The idea is to use a small image (in terms of file size) for the LOWSRC= image.
    For example, use a JPG image that is compressed much as possible but retains the
    dimensions of the original image. This image appears quickly, and if the visitor
    stays on the page long enough, the full image loads.


    This attribute, although not universally recognized, causes no adverse effects
    in browsers that don''t support it—they ignore it.


    # Specifying Height and Width


    You can speed the loading time of images by specifying an image''s height and
    width. As the browser loads the page, it notes the height and width attributes
    and leaves that much much space for the image. Next, it lays out the remaining
    text, and then it goes back and fills in the image. If you do not include these
    attributes, the browser has to load enough of image to get the dimensions before
    it can lay out the rest of the text, slowing the display of other page elements.


    To specify image height and width, add the HEIGHT= and WIDTH= attributes in the
    <IMG> tag, like this:


    ```

    <IMG SRC=asrlgo.gif ALT="Outfitters Logo" HEIGHT=192" WIDTH=604>

    ```


    As a rule, use the actual height and width of the image. To get the dimensions,
    open the image in an image-editing program, and look at the status bar. You will
    see something like 604 x 192 x 256, which indicates, in this example, that the
    asrlgo.gif image is 604 pixels wide, 192 pixels high, and 256 colors deep. With
    this information, you can then add the width (604) and height (192) attributes
    to the <IMG> tag.'
