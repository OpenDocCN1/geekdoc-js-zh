  md: 'To embed a minimal Style Sheet (that, in this example, colors paragraphs red)
    in an existing document, follow these steps:


    +   1. Start with a functional document header.


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.0 Transitional//EN">

    <HTML>

    <HEAD>

    <TITLE>ASR Outfitters</TITLE>

    </HEAD>

    ```


    NOTE In practice, style definitions also work within the document body, but the
    HTML 3.2 and 4 specifications require that the style definition block goes between
    the document <HEAD> tags.


    ![](bbox=[0.173, 0.319, 0.215, 0.355])


    +   2. Add opening and closing <STYLE> tags.


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.0 Transitional//EN">

    <HTML>

    <HEAD>

    <TITLE>ASR Outfitters</TITLE>

    <STYLE>

    </STYLE>

    </HEAD>

    ```


    +   3. Add the comment (<!-- ... -->) tag to hide the contents from non-style-capable
    browsers.


    ```

    <!DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.0 Transitional//EN">

    <HTML>

    <HEAD>

    <TITLE>ASR Outfitters</TITLE>

    <STYLE>

    <!--

    -->

    </STYLE>

    </HEAD>

    ```


    Browsers that do not support Style Sheets ignore the tags but display the text
    that appears between them. Adding comment tags within the <STYLE> tags ensures
    that the styles will not appear as content in older or less-capable browsers.'
