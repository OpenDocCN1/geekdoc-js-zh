    Defining Circles To define a circle, follow these steps:


    +   1. Identify the circle and the radius. Use the pointer tool to point at the
    center of the circle, and note the coordinates in the status bar of your paint
    program. For example, in Paint Shop Pro, the pointer tool looks like a magnifying
