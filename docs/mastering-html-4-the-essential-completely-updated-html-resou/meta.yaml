    Use the <span>tag to apply classes to characters or words. For example, to apply
    the first class (that you define elsewhere) to a word, follow these steps:


    +   1. Start with an existing HTML document and text.

    <P>Many people buy ASR products despite the higher cost.</P>

    2. Add the <span>opening and closing tags.

    <P>Many people buy <span>ASR products</span> despite the higher cost.</P>

    3. Add the appropriate CLASS= attribute.

    <P>Many people buy <span class="first">ASR products</span> despite the higher
    cost.</P>


    > TIP You might use classes in conjunction with HTML 4 tables (covered in Chapter
    7). Table tags accept CLASS= attributes to apply formatting to the table sections
    you specify rather than to individual cells, rows, and columns or to the table
    as a whole.


    # Applying Inline Style Definitions


    Applying inline style definitions throughout an HTML document is similar to adding
    formatting extensions. For example, just as you can apply an alignment attribute
    to a paragraph, you can apply a style definition within the <p> tag, as Figure
    4.6 shows. Of course, with Style Sheets you have far more formatting possibilities
    than simple HTML formatting commands.


    Although you wouldn''t use this method to apply styles through an HTML document—it''s
    time-consuming—you might use it to make exceptions to an existing Style Sheet.
    For example, your Style Sheet might specify that paragraphs appear in blue text.
    You can apply an inline style to specify that one specific paragraph appears in
    red. Table 4.5 lists the tags and attributes you use to apply inline styles.'
