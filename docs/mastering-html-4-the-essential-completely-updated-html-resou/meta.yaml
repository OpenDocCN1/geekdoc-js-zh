- img_proc: false
  md: '# CHAPTER 5 • PUBLISHING YOUR HTML DOCUMENTS


    and you''ll simply step in and start using the server. This situation can be either
    ideal or the worst possible case, depending on the group that actually runs the
    Web server.

    What access and control you have at the corporate level varies from company to
    company. In the ideal situation, someone else takes care of running the server,
    but lets you do anything you want, within reason. You get help up and running
    server-side programs and can essentially do anything you need for information.
    At the other extreme, you must adhere to a rigid process to submit information
    to the intranet. You''ll submit HTML documents and then have control over where
    they''re placed or how they''re linked.

    In all likelihood, your company will be somewhere in the middle, with an established
    procedure for accessing the corporate intranet but a substantial amount of freedom
    to what you need to do. If not, or if the process of providing content is tightly
    controlled, you may want to see running your own server. In any event, you''ll
    need to find out how to contact the server administrators, get emergency contact
    numbers, find out the corporate intranet policies, and go from there.


    # Publishing Through Your Own Server


    Finally, you might choose to publish your HTML documents on your own server. If
    you have the technical savvy and existing infrastructure, running your own server
    affords you the most flexibility and best range of resources. One reason to run
    your own server is that it''s a more authentic environment for developing and
    testing pages. For example, if you have server-relative URLs in them, they will
    work properly if you''re loading the files from a server, but not if you''re loading
    the same file locally. (See Chapter 3 for more about links and server-relative
    URLs.)


    > If you have a relatively new (or at least non-antique) desktop machine, you
    can certainly use it as a Web server. A 486 computer with 16MB of RAM can run
    an adequate Windows or Windows NT (if you have at least 32MB of RAM) server for
    testing purposes (as long as it''s not trying to do much else at the same time).
    It also run a rather speedy and spiffy Linux (freeware Unix) Web server.'
