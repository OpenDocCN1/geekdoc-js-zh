  md: '# Linking to Documents on the Web


    When you link from one document to another document on the Web, the documents
    likely reside on different servers. Figure 3.7 shows an originating document with
    a link to a document on the Web. Remember that linking to documents on the Web
    requires an absolute URL so that the right host, folder, and file can be found.
    So, to link to the futile.html file in the attempts folder of the www.coyote.org
    Web site, you need to include an absolute URL, like this one:


    ```

    http://www.coyote.org/attempts/futile.html

    ```


    The full link, then, would look like:

    <A HREF="http://www.coyote.org/attempts/futile.html">Last Try</A>


    FIGURE 3.7

    The acme-info.html file resides on a server called www.acme.com; futile.html resides
