    # Including Fancier Formatting


    Now that you have a firm grip on using the basic HTML formatting options, you
    can dive into some of the fancier formatting effects. In the following sections,
    we''ll show you how to add colors and specify fonts and sizes. Although most newer
    browsers support these, not all browsers do; your fancier effects might not reach
    all visitors. Also, the HTML 4 specification deprecates many of these effects
    in favor of Style Sheets. If your visitors use Style Sheet-capable browsers, you
    might consider using Style Sheets instead of the tags and attributes mentioned
    here.


    # Adding Colors


    One of the easiest ways to jazz up your documents is to add colors to the background
    or text. You can enliven an otherwise dull Web page with a splash of color or
    an entire color scheme. For example, add a background color and change the colors
    to coordinate with the background. Or highlight a word or two and make the words
    leap off the page. Or, if you''re developing a corporate site, adhere to the company''s
    color scheme to ensure a consistent look.


    > TIP As you will see in Chapter 13, developing a color scheme is a great way
    to help your pages into a cohesive Web site.


    The drawback to setting colors is that you really don''t have control over what
    your visitors see. Visitors might set their browsers to display colors they like,
    or they might be using a text-only browser, which generally displays only black,
    white, and gray. Specify colors using hexadecimal numbers, which combine proportions
    of Red, Green, and Blue—called RGB numbers. RGB numbers use six digits, for each
    proportion of red, green, and blue. As you''re choosing colors, remember that
    not all numbers display well in browsers; some dither meaning that they appear
    spoty or blotchy. We recommend that you select RGB values that are appropriate
    for Web page use, as listed in Table 2.8. Although you''ll never go wrong with
    these "safe" colors, it''s most important to use these colors in page backgrounds
    or in places with large patches of color, where dithering will occur if you don''t
    use these number combinations.'
