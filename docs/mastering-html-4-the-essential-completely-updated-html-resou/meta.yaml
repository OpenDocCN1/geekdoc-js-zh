  md: 'To specify a background image, add the BACKGROUND= attribute to your opening

    <BODY> tag.


    <BODY BACKGROUND="asback.jpg">


    You can use Style Sheets to include background images behind individual page elements,
    rather than placing a background image behind the entire page.


    When you develop background images, you will find that creating a seamless image
    is difficult. Although some programs, such as Paint Shop Pro, offer a menu option
    to create a seamless image, you still see a vague repeating pattern.

