    # The Publishing Process


    Before you get started, you''ll need the following information:


    **The address of the HTTP server** (for example, www.raycomm.com, hobbes.raycomm.com)
    Depending on your situation, you may need to know the folder name from which your
    files will be accessed. For example, the URL was necessary to access files at
    your site: www.xmission.com/~ejray/


    **The address of the FTP server, if required** (for example, ftp://ftp-xmission.com/)
    Depending on how you get your files onto the server, you may have to use FTP (File
    Transfer Protocol). Of course, it''s also possible, particularly in a corporate
    or educational environment, that you would simply copy the files to a specific
    folder on a network drive, and that would be that.


    **Password and access restrictions** You probably (almost certainly) need a userid
    and password to upload files to the server.


    Table 5.2 summarizes this information and provides space for you to include your
    specific information.'
