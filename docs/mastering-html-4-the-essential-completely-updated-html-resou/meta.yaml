  md: 'hyperText Markup Language, or HTML, is a system of codes that you use to create
    interactive, online pages. You''re probably familiar with the most common HTML
    application—World Wide Web pages. Visitors can jump from topic to topic, fill
    out forms, submit information, and search-data-among other things, rather than
    slogging through information linearly. Though, is not what you see offscreen as
    a Web page. Instead, HTML is the behind-scenes code that tells browsers what to
    display.


    +   NOTE Throughout this book, we use the term visitors to describe the people
    who use the HTML documents you develop.


    In this chapter, we''ll introduce you to HTML—what it looks like, what you use
    it to accomplish, and what tools you need to get started—and give you a foundation
    for learning to use HTML throughout the rest of this book.


    # # What Is HTML?


    HTML is a system of codes that identify parts and characteristics of documents.
    As Figure 1.1 shows, HTML documents are plain text files. They contain no images,
    no sounds, no videos, and no animations; however, they can include “pointers,”
    or links, to these file types, which is how Web pages end up looking as if they
    contain nontext elements.


    As you can see, HTML documents look nothing like the Web pages you have likely
    seen before. Instead, HTML is made up of tags and attributes that work together
    to identify document parts and tell browsers how to display them. Figure 1.2 shows
    how the tags and attributes of Figure 1.1 work together to create a Web page.'
  merge: -1
  pgno: 35
