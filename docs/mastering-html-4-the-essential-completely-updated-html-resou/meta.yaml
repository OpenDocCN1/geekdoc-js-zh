  md: '# Mastering


    # PRAISE FROM OUR READERS


    # Mastering HTML 4


    **This is THE boOK!!** If you can''t find what you are looking for or learn HTML
    from this book, then there is no hope. This is the most comprehensive HTML book
    I have ever seen! Well worth the money and time to read it!

    Martha Rich, Arkansas


    **Fantastic, Comprehensive, Easy-to-Read!** I''ve thumbed through, and read thoroughly,
    many HTML books, but this one just grabs your brain, rattles out your neurons
    and implants the goodies you need to slam-dunk a Web site. The authors provide
    an easy-to-read format with just the right amount of examples and details that
    won''t leave you asking more questions or be with too many arcane devices"

    Sabrina Hanley, North Carolina


    # Mastering FrontPage 98


    **Best of the 9 FrontPage 98 books I own. Sybex does it again!** I have been reading
    computer books for the last 10 years and Sybex has been a great publisher—putting
    out excellent books. After reading 3/4 of the book so far, I know that the publisher
    and the authors take pride in their product. It''s a wonderful book!

    Mike Perry, New Jersey


    **This is THE book for mastering FrontPage 98!** I skimmed through 4 other books
    before deciding to buy this. Every other book seemed like a larger version of
    the weak documentation that comes with the software. This book provided the insight
    on adjacent subjects necessary for administering a web. A must for FrontPage users.

    Richard Hartzell, Utah


    # Mastering Corel 8


    **I''m a computer graphics (college level) and the ''Mastering'' books have long
    been on my Highly Recommended list for students.** For as Rick Altman, I''ve been
    using his Corel books for the last four versions. This is a reference book, and
    a beautifully complete one. This is for the artist who needs to understand an
    effect or feature and get back to work. It''s all readable. Students can work
    through chapters, even the entire book, and they certainly won''t get bored. I
    love following an Altman book from start to finish.

    Christine C. Frey, Maryland


    ![](bbox=[0.435, 0.903, 0.565, 0.978])'
