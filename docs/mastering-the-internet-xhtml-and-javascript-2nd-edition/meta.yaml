  md: '# Chapter 6 • Security and Privacy


    From the Internet and send it to the requesting source. The net effect is that
    the outside remote computing hosting the information comes into contact with any
    of the computers behind the firewall. The Stateful-inspection method does not
    inspect the contents of any TCP packet; instead, it compares keys of the packet
    with a database of trusted information. For example, some firewalls do not allow
    the receipt of e-mail from outsiders the outsiders have received prior e-mail
    messages from addresses inside the firewall.


    Firewalls are customizable. A firewall can be set up to block traffic to or from
    a given IP address or domain name, to assign one or two computers to accept a
    specific protocol (only HTTP, for example), to block a certain port number, or
    to block access to websites that contain phrase and words.


    A firewall protects against many breaches, including unauthorized remote login,
    exploitation of application holes and operating-system bugs by crackers, and the
    sending of spam and viruses. The highest level of security a firewall offers is
    to block everything, which defeats the purpose of an Internet connection. A good
    system administrator should use a firewall effectively.


    # 6.5 P3P


    Web users and applications have been increasing steadily, at both the professional
    and personal levels. As a result, large amounts of sensitive and personal information
    are exchanged via the Internet. This condition has prompted a surge of interest
    in privacy protection and means assuring people that their personal information
    will be collected and used according to their permission and will. The W3C organization
    has taken the initiative to develop privacy-disclosure policies with respect to
    data collected from the Internet. The result of this initiative is P3P.


    P3P (Platform for Privacy Preferences) is a protocol created by the W3C to provide
    a simple, automated way for users to control the use of their personal information
    on websites that they visit. P3P is establishing privacy disclosure technology.
    For Web developers, P3P provides a standard to articulate their privacy policies
    to their visitors. For Web surfers, P3P provides a set of multiple-choice questions
    covering the major aspects of a website''s privacy policies. The answer provides
    to these questions specify if he or her desired level of privacy. Essentially,
    P3P provides a clear representation of how a website handles personal and private
    information about its users. P3P-enabled websites make this information available
    in a machine-readable format. P3P-enabled browsers can automatically retrieve
    and easily interpret this information and compare it with the user''s set of privacy
    preferences he or she specified through the browsers.


    P3P allows users to automate the acceptance or the rejection of a website''s requests
    for information (using the use of cookies), based on the privacy preferences they
    set in their browsers. Users are assured that privacy is protected without having
    to read each website''s privacy policy. P3P does not get users more privacy; it
    only allows them to exercise personal data preferences. It makes users better
    informed about what data are collected and why.


    There are commercially available P3P policy editors, with visual development tools
    and interfaces, to create a website''s privacy policy in the P3P protocol. These
    produce'
  merge: -1
  pgno: 221
- img_proc: false
  md: '# P3P 197


    XML-formatted (machine readable by Web browsers) files that describe a privacy
    practices, including the information collected (e.g., names, addresses, bank accounts,
    and credit card numbers), how it is used, and who has access to it.


    Major browsers are P3P enabled and compliant. Four browsers we covered in Chapter
    2 (IE, Netscape, Opera, and Crazy Browser) all support P3P protocol. Examples
    of P3P-enabled websites include the websites of AT&T (http://www.att.com), IBM
    (http://www.ibm.com), Lycos (http://www.lycos.com), Microsoft (http://www.microsoft.com),
    MSN (http://www.msn.com), MSNBC (http://www.truste.org), the U.S. Department of
    Commerce (http://www.commerce.gov), and W3C (http://www.w3c.com).


    Cookies are viewed as a precursor to P3P. Before cookies were implemented, the
    HTTP protocol was "stateless"; that is, a request for a Web was not linked to
    any future requests. With cookies, websites can store the browsing history of
    their visitors; a website can tell when a user accessed the site or how many times
    the user visited the site. Websites set (drop) cookies on the user''s computer.
    Third parties can also set cookies. For example, third-party advertisers can set
    cookies through the websites that they use (a process known as third-party cookies).
    Cookies are used as a tracking mechanism. P3P is designed to change by allowing
    the user to set cookies'' acceptance options via browsers.


    The current P3P specification is 1.0. The P3P0 defines the syntax and semantics
    (rules) of P3P policies and describes how to associate them with Web resources.
    P3P.. expresses policies as statements that use P3P vocabulary. P3P has two goals.
    First, it enables websites (the server side) to present their data-collections
    in a standardized, machine-readable format using XML to represent P3P statements.
    Second, it enables users (the client side) to view and understand what data will
    be collected by the websites they visit, how the data will be used, and more importantly,
    it gives the users the choice of accepting or rejecting the data collection in
    the first place.


    P3P1 requires the definition of privacy policies and policy reference files. **P3P
    policy files** represent the practices of a website. Different pages (Web pages)
    of the website may require different privacy policies. The **P3P policy reference
    file** indicates which policies apply to parts of the website. The file is an
    XML document that browsers can read to find out which policies and cookies apply
    to the website''s parts. A P3P-enabled website must have at least one policy reference
    file.


    The implementation of P3P.0 must be done on both the server and client sides.
    Websites can implement P3P.0 by translating their human-readable privacy policies
    into P3P syntax and storing them in one or more files. The website must also develop
    a policy reference file. The client-side implementation of P3P.0 is included in
    the Web browsers. They include a set of choices that users can set when they specify
    the browser preferences.


    P3P.0 is designed to support existing security and privacy efforts, not to replace
    them. As such, it supports all of the existing encryption techniques covered in
    Chapter 2. It also supports digital signatures and allows their incorporation,
    in P3P statements.'
