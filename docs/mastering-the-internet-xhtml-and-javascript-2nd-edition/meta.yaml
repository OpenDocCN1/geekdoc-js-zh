- img_proc: false
  md: '# Firewalls 195


    Firewalls are used to prevent crackers from accessing the computers behind them.
    However, if there is a hole open for a Web server that the public can access,
    crackers will find it and attack the computers. Having a firewall is not an excuse
    to leave the machines behind insecure.


    Web servers are one of the most dangerous services that a network can offer. A
    Web server gives the entire world access to the inner workings of its file system.
    Web administrators are not experienced enough to handle complex security issues.
    Moreover, many PC users do not have the knowledge or the time to deal with security
    issues. This situation has created a haven for crackers.


    While system administrators work to ensure system security, crackers wait for
    any slipup they can find. An administrator''s job should be to create a cracker-resistant
    system, not a crackerproof one, as the latter is a very challenging and costly
    task. In a cracker-resistant environment, the administrator renders the system
    as secure as possible, making provisions such that future crashes cause as little
    damage as possible. An example of is backing up data on a regular basis, so that
    if the data are attacked and corrupted, a near-latest version can be restored
    from the backup version. Once a cracker has access to a system, he can erase data
    files, sell them to competitors, modify them, or use the system''s identity as
    their own in order to attack other systems.


    # 6.4 Firewalls


    We discussed firewalls in Section 1.13. Firewalls are used for security purposes.
    Firewall software inspects incoming TCP packets before they are transmitted to
    their final destination. A firewall implements security rules such as dictating
    which computers can receive files from outside the company. Such computers would
    not have any valuable data files on, in case crackers break through the firewall.
    Figure 6.1 shows a computer system with a firewall. The firewall keeps the general
    public from accessing the computers behind it.


    Firewalls use at least one of methods to control traffic flow in and out of networks.
    The packet-filtering method analyzes TCP packets against a set of filters, passing
    only those that pass the filtering criteria. The proxy-service method enables
    the firewall to receive information coming


    ![](bbox=[0.058, 0.755, 0.866, 0.915])


    Figure 6.1 Secure system with a firewall.'
