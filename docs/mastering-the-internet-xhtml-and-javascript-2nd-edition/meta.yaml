    # 7.1 Introduction


    The Internet is an endless repository of information. Search engines, such as
    Google, are the primary searching tool that we use to search the Internet. Internet
    searches can be time consuming. This chapter shows how to formulate a search strategy
    in order to improve the search results. In order to compose such a search strategy,
    we must know what to search for and how to search for it. Without these elements,
    a search will be difficult to conduct and to bring to a successful conclusion.
    The result of a search is a list of Web pages. The relevance of these Web pages
    depends largely on the aforementioned search elements; the more specific they
    are, the better the results will be.


    Before we discuss search techniques and methodologies, we need to be aware of
    the available search tools and the limitation of each. The two main tools are
    directories and search engines. A directory is a subject guide, typically organized
    by major topics and subtopics. The best-known directory is the one on Yahoo!(http://www.yahoo.com).
    A search engine is a piece of software that searches the Internet according to
    one or more keywords that the user has provided. Each type of tool has a database
    that users can search for what they want. The difference between the two lies
    in how the database is created: A directory''s database is compiled by humans,
    while search''s database is generated automatically by the engine''s software.


    # 7.2 Directories


    A directory organizes information in a hierarchical tree by subject. The subjects
    are very general at the top of the tree (root) and become very specialized at
    its bottom (the leaves). We can search a directory in two ways. First we can search
    it manually, by browsing its subjects hierarchically. Consider the Yahoo! directory;
    it lists sets of subjects at top. If we are interested in music, we click the
    Music link under the Entertainment subject (see the forthcoming screen capture),
    and continue from there. The second way of searching a directory is to use its
    search tool, which acts like a search engine. The Yahoo! directory supports this
    feature. It provides a search field where you type the search words, as shown
    in the following screen capture.'
