    # FAQs


    # Introduction (Section 6.1)


    +   Q:How secure are Web servers and operating systems?

    A:If two servers are configured correctly, a typical Unix system is more secure
    than a typical Windows system.


    +   Q:How secure are Web-server software programs?

    A:As a rule of thumb, the more features a server offers, the more likely it is
    to contain security holes.


    +   Q:What should a Web administrator do to ensure better Web security?

    A:Write a security policy and implement it. The guidelines of the policy should
    include who can use the system, when the system can be used, what is allowed to
    be done, how to grant access (authentication), what constitutes acceptable use
    of the system, remote and local login method-ods, and system-monitoring procedures.


    +   Q:Why do IP addresses pose a security threat?

    A:A computer connected to the Internet is identified by its IP address. Hackers
    can use this address to access the computer from anywhere in the world. A fixed
    (static, or unchanging) IP address is a larger security risk than a dynamic (changing)
    address. A dial-up modem con-nection gets a new IP address every time a connection
    is established between the computer and the Internet. On the other hand, a cable
    or DSL connection has a static IP address.


    # Firewalls (Section 6.4)


    +   Q:What can a firewall protect? What can it not protect?

    A:A firewall can protect e-mail traffic and unauthorized remote logins. It cannot
    protect very well against attacks, peers before the firewall, and viruses.


    +   Q:What is a DMZ, and why do we need one?

    A:DMZ stands for demilitarized zone. In the context of firewalls, it means a part
    of the network that is neither the Internet nor the local network. For example,
    one can install a com-puter firewall to connect to the Internet. Any software
    that users need download is put on that computer. The use of a DMZ enhances the
    security protection offered by firewalls.


    # P3P (Section 6.5)


    +   Q:What is APPEL?

    A:APPEL (A P3P Preference Exchange Language) is a language designed to encode
    user pref-ferences (received through a Web browser) over privacy. It also permits
    sharing of a single user preference document across several P3P documents.'
