  md: '# Websites and Web Pages


    Web pages linked together. How can a Web author organize the structure and hierarchy
    of Web pages? Web authors can devise elegant, sophisticated, well-planned structures,
    but the most natural one is the web structure. A web structure suggests that a
    Web author begins with a page that includes hyperlinks to other Web pages, which
    in turn include other hyperlinks. Some of the hyperlinks may even point back the
    home page, if needed. Thus, all the Web pages form a web that begins at the home
    page. The web structure is not at all restrictive. Web authors can, in the future,
    add hyperlinks to new pages in their existing ones as the need occurs, increasing
    the size of their webs.


    In designing web structures, Web authors may first draw the design on a piece
    of paper, as shown in Figure 9.1. Each arrow connecting two Web pages represents
    a hyperlink. The Web page that is at the arrow''s tail has the hyperlink in it,
    while the arrow''s head points to the page that is loaded if the hyperlink is
    clicked by a Web surfer. The home (index) page of a website is the first Web page
    that is loaded when a surfer visits the site. The file name of the page is usually
    index.html.


    As Figure 9.1 suggests, it is quite natural and easy to edit and change the web
    structure. If a Web page becomes obsolete, the corresponding links to it are deleted
    from all other Web pages that point to it. If a new Web page is added to the web,
    links are added in the same way. Web authors can add (or delete) hyperlinks in
    Web pages by editing the corresponding HTML files, using an editor. Moreover,
    if the website grows out of control, changing its structure could be as simple
    as shuffling and restructuring its Web pages. For example, Web authors may merge
    Web pages together and consolidate their content.


    ![](bbox=[0.065, 0.5785, 0.755, 0.9115])


    **Figure 9.1** The structure of a website.'
