  md: '# 8.3 FTP


    We have covered different issues related to FTP (File Transfer Protocol) throughout
    the book thus far. Section 1.2 discussed file downloading and uploading as an
    Internet activity. Section 1.11 covered FTP as a file protocol. Section 1.12 discussed
    the need to compress, or zip, files before transferring them in order to reduce
    their size and consequently increase the transfer speed and reduce the transfer
    time. Section 2.3 covered file downloading as one of the essential tasks of browsers.


    We extend the previous background about FTP. FTP enables electronic file transfer
    across networks. FTP lets you (upload) a copy of a file from (to) to a remote
    host (from) your local computer. FTP can transfer two types of files: ASCII files
    and binary files. ASCII files are text files that you can read in a text editor
    after transferring them. Binary files cannot be opened in a text editor. They
    must be read by the programs that created them or by other, compatible programs.
    All executable files are binary files.


    FTP is a client/server application. It has two parts: a client and a server part.
    The client runs on your computer. The server runs as a daemon program on a remote
    server. The FTP daemon acknowledges FTP requests and allows users to send or receive
    files from the server. FTP servers are set up differently from Web servers.


    There are four ways to connect to FTP sites or servers: Accessing via OS, via
    a browser, via a stand-alone FTP program, and via other applications. Accessing
    FTP sites at the OS level is popularly mainly among Unix users. Unix provides
    us with a line of commands to connect to an FTP site, download files, and log
    out. For example, the sequence of actions to access an FTP site may look like
    this:


    ```

    ftp xxx.yyy.zz (connect to host or server xxx.yyy.zz to start an FTP session)

    type username and password to log in

    cd sss (go to subdirectory sss)

    ls or dir (list the files in sss)

    get myfile1 (download or copy myfile1 to your local drive)

    put myfile2 (send myfile2 to host or server xxx.yyy.zz)

    quit (or exit the FTP session)

    ```


    The former terms indicate FTP commands. There are a lot of FTP commands. You can
    enter help or ? at the ftp> command prompt. (When ftp> prompt.) This command will
    show you a list of all the available FTP commands. You then ask for help on a
