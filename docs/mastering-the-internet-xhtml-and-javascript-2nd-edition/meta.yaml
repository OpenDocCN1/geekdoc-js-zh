    # 2.1 Introduction


    To access the Web, you need an Internet connection and a browser. A Web browser
    is a computer program that displays the content of Web pages. We use browsers
    to view Web pages. A Web page is a document (file) that typically is richly formatted
    with fonts, graphics, colors, audio, video, or animation. Browsers locate and
    retrieve Web pages from servers every time you click hyperlinks, or links for
    short. A hyperlink is a word or collection of words that allows a user to proceed
    to, and view the content of, another Web page upon clicking the link. A hyperlink
    in a Web page, thus acts as a pointer to another Web page. Hyperlinks are based
    on the hypertext concept. Unlike traditional text, hypertext is dynamic; it allows
    a reader of a Web page to jump from one page to another, during reading, by clicking
    on its link.


    A Web-page file stores the code (rules) that defines the presentation format of
    the page. A Web browser uses this code to render and display the page. If the
    rendered page is too long to fit in a browser window, the user must scroll it
    up and down in order to view all of its content.'
  merge: -1
  pgno: 61
- img_proc: false
  md: '# Browser Tasks


    A browser window is like the window of any other computer application. The user
    can size it up or down, minimize it, activate it to (i.e., bring it to the foreground
    on the desktop), deactivate it (i.e., send it to the background of the desktop),
    or close it (i.e., kill, or stop running, the browser application).


    ![](bbox=[0.198, 0.215, 0.735, 0.396])


    Many Web browsers exist. We cover four of them in-this chapter: Internet Explorer
    Netscape, Opera, and Crazy Browser.


    # 2.2 Finding a Web Page


    The browser fulfills your request of a Web page as follows (Figure 2.1 illustrates
    this process):


    +   1. The browser receives the request from you when you type the page''s URL
    in its window.

    2. The browser sends the URL to the domain name system (DNS) server, which replies
    with the IP address of the Web-server computer you wish to contact.

    3. The TCP/IP packets make their way to the server by passing through some routers.

    4. When the Web server receives the packets, it locates the requested file and
    sends it along with your IP address, as outbound packets to your browser.


    # 2.3 Browser Tasks


    The common tasks are viewing, navigating, downloading files, and printing. Many
    browsers have built-in e-mail tools. Viewing and navigation of Web pages are the
    bedrock of a browser.


    The growing popularity of the Web has greatly increased the feasibility of downloading
    files. After a user finds a particular file on the Web, clicking its associated
    link will cause it to be downloaded.


    Printing is a simple, but useful, task. The user can print a Web page displayed
    by the browser via the browser''s Print button.'
