    employees how to use the program. For individual and personal use, there are many
    choices. Users can set up their favorite e-mail programs at home on their PCs.


    # 3.2 Communication


    E-mail client/server communication requires e-mail servers and e-mail clients.
    To understand e-mail communication, let us compare it to the post office mail
    system. The mailman delivers your mail to your mailbox. When you want to send
    a letter, you can drop it off at a post office. Thus, in the traditional mail
    system, you have two types of mail (incoming and outgoing) and two mail handlers
    for your mail (one for incoming, and one for outgoing). In the e-mail system,
    e-mail messages are the letters, and e-mail servers and clients are the mail handlers.
    E-mail servers communicate with the Internet, while e-mail clients communicate
    with the e-mail servers. These servers send, receive, and store e-mail messages
    until clients access and read.


    An e-mail system usually has two e-mail servers, as well as an e-mail client to
    send and receive messages, as shown in Figure 3.1. One server handles incoming
    mail, and the other handles the outgoing mail. Jones, on client computer 1, uses
    his e-mail client to send a message to Smith, who is on client computer 2. Jones''s
    outgoing mail server receives


