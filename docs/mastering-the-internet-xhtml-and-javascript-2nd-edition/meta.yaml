    # Instant Messaging


    # Goal


    Understand and master the use of synchronous communication, such as chatting and
    instant messaging. Applications include fun (e.g., chatting with family and friends),
    online meetings, and collaboration among professionals.


    # Objectives


    +   - Types of synchronous communication

    - Types of Web chatting

    - BBSs, chat rooms, and IRC channels

