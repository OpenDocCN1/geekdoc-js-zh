    # 3.1 Introduction


    E-mail (electronic mail) is one method of communication over the Internet Other
    methods include instant messaging and newsgroups. E-mail is the exchange of computer
    messages via the Internet. E-mail is widely used by individuals and businesses.
    It is simple, intuitive, and fast. Different people have different habits of dealing
    with e-mail messages. Some, such as salespeople, read and respond to them instantly;
    they even set up e-mail programs to make an alert sound (such as a beep) when
    they receive a new message. Others may read and respond to e-mail less frequently.


    E-mail use based on the client/server model we discussed in Chapter 1. A user
    must have an e-mail account on an e-mail server, an e-mail address, an e-mail
    program to manage messages, and an Internet connection in order to be able to
    send and receive e-mail messages. A server administrator issues accounts and addresses
    only to valid users. ISPs also issue their customers and addresses. In some cases,
    the user is able to choose the e-mail programs or would like to use, while in
    other cases the user has no choice. For example, IT (information technology) departments
    in businesses and other organizations select, install (on an Intranet), and maintain
    a particular e-mail program, leaving no choice to employees. They also train'
  merge: -1
  pgno: 115
