    # Chapter 6 • Security and Privacy


    There are some good tips on how to fight Web stalking. The best way to track a
    stalker is to employ team effort, working with different friends and family members.
    A study of the trail of e-mail messages and IM sessions (a process known as social
    engineering) may shed some light on the stalker''s psychology. Patience is a good
    weapon to use against stalkers. Ignore them, and do not respond to their messages.
    Consider changing ISPs, e-mail addresses, and IM screen names. Avoiding strangers
    online in newsgroups, chat rooms, gaming services, and the like. Last, visit http://www.cybercrime.gov/reporting.htm
    to report the stalking problem.


    # 6.8 Censorship


    The Internet is considered one of the best mediums for freedom of speech. All
    of the synchronous and asynchronous communication methods covered in Chapters
    3, 4, and 5 serve as excellent ways of expressing opinions and speaking out freely.
    The Internet is believed to be empowering and democratizing. Information can be
    spread very quickly, without facing the barriers of importing and exporting rules
    and regulations. No smuggling of books and magazines is needed in order to spread
    sensitive information.


    The attempt to ban or regulate access to information is called censorship. Internet
    censorship is a common practice in authoritarian regimes, which crack down on
    Internet usage and freedom of expression in the name of national security. These
    regimes rely on many clever controls to prevent the spread of information over
    the Internet. They arrest dissidents who speak out against them. They introduce
    Internet regulations and laws prohibiting "politically unacceptable" content as
    discussion of democracy. Moreover, they block websites considered to be politically
    or morally objectionable and Close Internet cafes (public places that provide
    Internet access) in order to limit access. Some regimes set up their Internet
    infrastructure so they have the capability to monitor e-mail and Web browsing.
    Other regimes depend on the high cost of Internet access as a method of maintaining
    control over online information.


    Some governments have developed the ability to censor material coming from abroad
    through the Internet. They force all foreign information to run through government
    servers that filter and block foreign websites that the government deems potentially
    dangerous. Some governments lift the ban on foreign websites temporarily when
    foreign delegates are visiting their countries, as a courtesy to them.


    One way to fight censorship is for people from such countries to go into exile
    and publish their views and criticisms on websites that they build. This practice
    is referred to as "virtually in exile." This approach is not very effective in
    the exiled'' home countries, as websites are blocked, but it is very effective
    for educating others about what is happening in oppressive regimes. Another problem
    with this approach is the declining relevance of the information provided by an
    exile over time, unless the dissident has reliable underground correspondents
    who can get information out of the country.'
