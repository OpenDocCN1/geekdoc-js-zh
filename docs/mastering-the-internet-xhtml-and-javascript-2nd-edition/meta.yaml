    # 1.8 IP Addresses and URLs


    The IP protocol uses a logical address scheme to guarantee that a host or a node
    in any network has a unique address. An IP address is a 32-bit integer composed
    of 4-bit numbers written in base 10 and separated by periods. A bit is a computer
    storage space that holds a binary value of 0 or 1. A byte is each of the four
    numbers of an IP address holds a value between 0 and 255, ($2^8 = 256$ values).
    An example of an IP address is 155.33.227.141. Like a house address, an IP address
    is assigned to one and only one host.


    While names are used for machines and computers, they are not for humans. Therefore,
    we use names to refer to IP addresses. The DNS (domain name system) is a software
    application that converts names to IP addresses, and vice versa, using a technique
    called reverse lookup. Both Windows and Unix provide the command `nslookup`, which
    converts a host name to an IP address. Linux OS uses the `dig` and host commands.
    The `nslookup` command and its equivalents can also reverse name lookup to find
    the name for an IP address. DNS servers maintain the lookup table of names and
    addresses. For example, the name `www.edu` corresponds to an IP address of 155.33.227.141.
    If a client requests to be connected to `www.edu`, the DNS server converts this
    into an IP address, locates the site, and connects the client to it. This conversion
    is known as DNS resolution. If the site is down or the given address is incorrect,
    no communication takes place between the client and the site, and a communication
    error is reported.


    The name version of an IP address is a part of what is commonly known as a uniform
    resource locator, or URL. A URL is an address of an accessible file, a Web page,
    on the Internet. An example of a valid URL is `http://www.neu.edu`. A URL lists
    the protocol name, the host of the server (`www.neu.edu`), and the file name,
    including its directory (none for `www.neu.edu`). When no file is specified in
    the URL, a default file in a default directory is used. The webmaster (the administrator
    in charge of the Web server''s operations) sets up the default file name, as `index.html`
    or `index.htm.


    The entire system of assigning and managing IP addresses is managed and controlled
    by national and international organizations. These companies charge a purchase
    price and an annual fee to maintain an IP address. It is the responsibility of
    these companies to ensure that IP addresses are unique.


