  md: '# 8.1 Introduction


    One of the best things that the Internet offers is electronic file transfer from
    one computer to another. This transfer requires both computers to be networked,
    and permissions must be granted to users to transfer files. Internet users download
    files all the time from Web servers to their local computers. These Internet downloads
    allow users to transfer files simply by clicking links, similar to syncing handheld
    devices.


    File transfer across the Internet is very useful in syncing different computers,
    primarily at home and work. For example, if you have files in different locations,
    it can be confusing to remember which location has the latest version of a file.
    File transfer can solve this problem; after changing a file in one location, the
    user transfers it across the Internet to the other location.


    File transfer can come handy in many cases. Let assume that you worked on a file
    at home and wanted to take it to work the next morning. You go to work only to
    discover that you forgot to bring the files on a floppy disk, zip disk, or CD.
    If your computer is accessible via a network, you can access the file from your
    office and download it. Alternatively, even if you have the file on a floppy disk,
    the floppy disk could get corrupted causing you to be unable to open the file.
    Here, you can download it from the computer instead.


    # 8.2 File Types


    We have covered different issues related to files throughout the book far. Section
    1.11 covered the different file protocols required to exchange files across the
    Internet. Section 1.12 discussed compressed, or zipped, files and decompression,
    or unzipping. It also described self-extracting and non-extracting files. Section
    1.16 covered the two types of Internet downloads: software and freeway. Chapter
    2 discussed PDF files and how useful they are.


    We extend the previously discussed background about files here. Each file has
    a type. A file type is designated by the extension of the file. For example, a
    file .abc has the name abc and the extension .doc. The name and extension are
    separated by a period. File extensions are used by operating systems to launch
    the appropriate application (program) to open (read) a file when a user clicks
    a link to it. For example, .abc .doc can be opened with Word.


    OS such as Windows have built-in associations of file types and applications.
    For example, .txt, .ppt, .x15, and .bmp files are opened with Notepad, PowerPoint,
    Excel, and Paint, respectively. If the user clicks a file that has a new type,
    the OS asks the user to select an association with which to open the file. The
    user may also change the default associations that an OS offers. For example,
    a user may associate the .txt extension with another text editor instead of the
    Notepad editor.


    Example 8.1 Associate a file type with which to open a file.


    Learn how to select a program with which to open a file.'
  merge: -1
