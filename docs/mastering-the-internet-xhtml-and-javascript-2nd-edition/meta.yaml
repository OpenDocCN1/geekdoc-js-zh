  md: '# 182


    # Chapter 5 • Lists and Newsgroups


    Some useful newsgroups, especially for new users, include news.newusers.announce,
    news.newusers.questions, news.answers, alt.answers, and alt.internet.services.


    Users need newsreader software in order to subscribe (unsubscribe) to newsgroups,
    respond to messages, search for information, and manage (delete and archive) messages.
    The newsreader also keeps track of which articles a user has already read. The
    newsreader software reads and manages messages by using the Net News Transport
    Protocol (NNTP).


    A newsreader can be a browser, or a Web page in Web-based newsgroups. One example
    of a Web-based newsreader is http://groups.google.com. The search engine Google
    has acquired the well-known Deja website. The URLs http://www.dejanews.com and
    http://www.deja.com are directed to http://groups.google.com. Figure 5.2 shows
    the main page for the Google Usenet newsgroups.


    Newsreaders use a standard hierarchy to read messages (all known as articles)
    from a Usenet group server that is structured with this hierarchy. Each newsgroup
    server has a set of newsgroups at the top of the hierarchy, one per topic. The
    topic (and the newsgroup-parents) at this level is very general. It is divided
    into increasingly specific subtopics (newsgroups) at the subsequent levels of
    the hierarchy, which are topic threads. Each topic consists of its messages''
    headers, which are e-mail messages. The user clicks a header to read its body.
    Figure 5.3 shows the structure of Usenet newsgroups.


