  md: '# Connecting to the Internet


    phone call you make to connect to the server may be a local call to you, and depending
    on your phone billing plan, the call may not add charge to your phone bill. To
    minimize or eliminate charges to users for phone calls during connection time,
    all ISPs have many POP (point of presence) access points in many regions of the
    country.


    It does not too much effort to make a home PC Internet ready. A computer program
    that uses the TCP/IP protocol is totally part of the OS (e.g., Windows). Configuring
    a PPP connection is systematic and simple, as shown in Tutorial 1.17.75. The connection
    uses sockets to connect two computers. A socket is a method of communication between
    a client and a server. Think of a socket is like a virtual wire that goes into
    a computer. Client/server communication requires two sockets, one on each end.
    They are known as a client socket and a server socket.


    OSs (e.g., Windows and Unix) provide users with built-in computer programs that
    handle socket communication. Windows uses the Winsock (Windows socket) API (application
    programming interface). Winsock is an adaptation of the Berkeley socket interface.
    Winsock became available in 1993 and part of the OS with Windows 95. Stand-alone
    versions of Winsock, as Trump Winsock, also exist. Unix OS does not require a
    Winsock socket equivalent, because TCP/IP and sockets are designed to open directly
    with Unix application programs.


    Winsock runs between a browser and the program that uses the TCP/IP protocol,
    as shown in Figure 1.5. It runs as a Windows DLL (dynamic link library) file—that
    is, it is loaded and executed when, say, a TCP/IP program needs it.


    The bottleneck for dial-up users is the access speed. Downloading or uploading
    Web pages with many graphics, a lot of animation, and high sound content is very
    slow when using modern speeds. Access speeds are directly dependent on the wires
    that make up the telephone system. They are typically twisted-pair wires. These
    wires are not the ideal medium for moving data at high speeds. As a result, telecommunication
    companies such as Cisco, Lucent Technologies, and Northern Telecom as well as
    telephone and cable-television companies compete to upgrade transmission methods
    and speeds.


