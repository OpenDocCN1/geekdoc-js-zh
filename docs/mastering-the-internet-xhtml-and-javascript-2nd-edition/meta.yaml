  md: '# 1.13 Intranets and Extranets


    The underlying concept for the Internet, intranets, and extranets is the same.
    They are all networks using the same hardware and software. The differences occur
    with respect to their geographical domains and the level of security they use.
    Figure 1.4 shows the three types of networks. An intranet is a network that is
    contained within an organization; that is, it is an internal or private network.
    Organizations use intranets to share information and computing resources among
    employees in different departments and widespread proff.


    Like the Internet, intranets connect heterogeneous computer hardware, including
    server computers, workstations, and PCs. Because intranets provide companywide
    (intracompany) access to the internal private information of the entire company,
    they must be protected from outside intruders. Thus, it is typical for companies
    to install firewalls around their intranets in order to prevent unauthorized access.
    A firewall is a collection of related computer programs installed on a server
    computer that acts as a gateway to the intranet. The firewall intercepts incoming
    packets and examines the sender''s IP address to determine whether to forward
    it to its destination.


    An extranet is an organization network that allows access to outside networks
    such as the Internet. It allows users outside a company to communicate with its
    employees, and vice versa. The users can access the company''s internal information
    and resources as well. An extranet facilitates intercompany relationships. Extranets
    typically link companies and businesses with their customers, suppliers, vendors,
    partners, and other businesses over the Internet. Extranets provide secure and
    private links via advances in network security and the use of firewalls. An extranet
    may be viewed as an intermediate network between the Internet and an extranet.


    ![](bbox=[0.225, 0.613, 0.775, 0.89])


    **Figure 1.4** The Internet, intranets, and extranets.'
