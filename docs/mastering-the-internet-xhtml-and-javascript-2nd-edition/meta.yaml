    # 3.6 E-Mail Clients and Web-Based E-Mail


    As a client-application, e-mail messages arrive at a server and a client accesses
    them. The general question is, how can a client read and manage the messages once
    they are placed in a designated mailbox on the server? A client may connect, to
    the server, and download'
  merge: -1
  pgno: 126
- img_proc: false
  md: '# 102


    # Chapter 3 • E-Mail Tools


    all the messages to a local computer at once; the user can read them later off-line.
    This type of client must use the POP3 protocol. Another client may go online,
    connect to the server and leave all the messages on it; the user can read them
    online. This type of client must use the IMAP protocol. Clients that use IMAP
    are either stand-alone e-mail programs or Web pages. Clients that use POP3 or
    IMAP are stand-alone programs or Web pages. Clients for Web pages are known as
    Web-based e-mail. Thus, a user can utilize an e-mail client or Web-based e-mail
    to read and manage e-mails. A user can configure an e-mail client to use POP3,
    IMAP, or both.


    There is a distinction between using POP3 and using IMAP. POP3 downloads both
    the headers and bodies of all available messages, at the time that e-mail is checked
    off the incoming mail server. Thus, POP3 is viewed as an e-mail forwarding for
    off-line reading of e-mail. IMAP, on the other hand, downloads the headers only.
    The bodies of messages remain on the incoming mail server. The user views the
    headers and reads a message body, by clicking the message''s header. Web-based
    e-mail e-mail clients that use POP3 can be configured to delete messages or leave
    them on the incoming e-mail server after downloading them. Examples of e-mail
    clients that use POP3 include Eudora, Outlook, Netscape, and Opera. Similarly,
    e-mail clients that use IMAP can be configured to download copies of messages''
    bodies in order to allow off-line reading. Eudora is one example.


    There are pros and cons for each method of reading e-mail. POP3 works best if
    the user always reads e-mail from the same computer and if the has a dial-up connection
    and pays for connection time. Its con is the unavailability to access their e-mail
    via different computers. Web-based e-mail allows a user to read e-mail anywhere.
    All the user needs a login account (username and password) and a browser. It does
    not require any installation or configuration, as the user accesses the account
    via a Web page. It is then that the user must be online in order to read mail.
    Moreover, it is typically suitable for people who rely on e-mail for business
    or crucial communication that cannot be interrupted by banner ads, advertising,
    and junk mail. To avoid banner ads and junk mail, many businesses have Web-based
    e-mail for employees who travel, and a that the employees'' access is ban and
    ad free. In addition, since the Web-based e-mail is just another way of accessing
    the employees usual busy e-mail account, it doesn''t cause the employee to receive
    junk mail.


    Some e-mail programs provide both e-mail clients and Web-based e-mail. Eudora
    is one of them. The structure of the main window client is what different from
    the Web-based e-mail. Figure 3.4 shows the generic structure for each group. In
    general, an e-mail client provides more menus and buttons for managing and managing
    e-mails than Web-based e-mail provides. However, the basic functionality is the
    same. Both groups provide a mailbox with multiple folders, as well as an address
    book. An address book is a file or document that contains e-mail addresses that
    can be used in storing e-mail messages. A user builds an address book over time
    by storing e-mail addresses in it. An address book saves the time of retyping
    e-mail addresses.'
