  md: '# Connecting to the Internet


    # 1.14 Connecting to the Internet


    Organizations, such as companies and universities, and individuals need an Internet
    service provider (ISP) in order to connect to the Internet. Organizations connect
    their networks to one of the ISPs. Individuals typically connect their computers
    at home to an ISP network. Individuals who have more than one computer at home
    can network first before connecting them to an ISP network.


    ISPs offer Internet access (connection) only or both access and content. Organizations
    usually select access and content. America Online (AOL) and the Microsoft Network
    (MSN) are examples of ISPs that offer both types of service. These ISPs offer
    categorized online services, including information, sports, finance, news, and
    shopping, to end users. Phone and cable companies that are ISPs provide access
    only. End users who have online access surf the Internet on their own to find
    the content they need. A content-providing ISP would be its directory. If you
    think of the Internet as a city, a content-providing ISP could be consuming for
    some users. Once you remove the directory, you are on your own finding your way
    around the city.


    The choice of an ISP for individual use depends largely on the individual''s needs.
    Interested readers can search the Internet for itself. However, some of the general
    features one should consider when choosing an ISP include the connection speed;
    the type of connection (dial-up or broadband); whether there is an available 800-number
    help line; the software provided, if any, for browsing and other online activities;
    the monthly service charges and hourly rates (both peak and off-peak), the search
    tools and Web services provided; the extent of technical support provided, whether
    there are any trial accounts one can use before purchasing the service; the procedure
    for installation and orientation (e.g., via a CD-ROM); and the supported networks
    and groups.


    After choosing an ISP, organizations connect their employees'' PCs and workstations
    to network (known as Ethernet) ports. These ports provide dedicated broadband
    (high-speed) connections that are available 24 hours a day. The PCs and workstations
    have Ethernet cards to allow communication with the network. Organizations also
    install Web browsers on the PCs and workstations in order to complete the Internet
    access requirements. They also provide in-house training and support for their
    employees using the companywide Web tools such as e-mail tools, databases, and
    Web-based software.


    Individuals who use Internet connections at home need a modem and a router. Refer
    to the next section for information on modem types and specifications. Three types
    of connections exist. A dial-up connection requires a telephone line and a modem.
    The modem speed is 56K (See the next section for more details.) This type of connection
    is slow, crash prone, and ties up phone lines. The user must dial a phone number
    provided by the ISP to establish a connection. After he or she is surfing the
    web, the user must disconnect the phone line.


    The other two types of home connections are cable and DSL. (See the next section
    for more details.) Both types are dedicated (i.e., available 24 hours a day) and
    high speed'
