  md: '# 132


    # Chapter 3 • E-Mail Protocols


    # Communication and Protocols (Sections 3.2 and 3.3)


    +   Q:Is Inbox a standard folder name that all e-mail clients use?

    A: But many clients do use it. For example, Hotmail, Yahoo! Mail, Outlook, and
    Netscape Mailer use it. However, Eodora uses In, while Opera uses Received.


    +   Q:How many incoming e-mail servers can I specify in my e-mail program when
    I configure it to set up an account?

    A: You can specify multiple IMAP and POP3 servers. To access your account on any
    one of them, you need use the account login (username and password). You cannot
    always specify multiple IMAP and POP3 servers. It depends on the e-mail program.


    +   Q:What are queued e-mail messages on an SMTP server?

    A: These are messages that are waiting to be sent, because the receiving server
    could be down or experiencing heavy e-mail traffic.


    +   Q:What are the standard port numbers used by e-mail servers?

    A: SMTP servers listen on port 25, while POP3 servers listen on port 110 and IMAP
    servers listen on port 143. When an e-mail client sends a message, the SMTP server
    receives it through port 25. And when the client e-mail, the POP3 (IMAP) server
    sends it through port 110 (143).


    ![](bbox=[0.343, 0.513, 0.715, 0.623])


    +   Q:What are some e-mail clients that can be configured to use different types
    of e-mail servers?

    A: The program Mail .app that runs on a Macintosh can specify multiple POP3 servers
    or a mixture of POP3 and IMAP servers. Other e-mail programs that can have multiple
    servers of mixed type Pine and Mutt on Unix systems.


    # Content, Attachments, and Etiquette (Section 3.4)


    +   Q:I received an e-mail message that is only one line long. How do I read it?

    A: Assuming that the sender did not intend to write a long line, which means that
    word wrap of your e-mail client did not work for this message. Sometimes this
    happens when you receive messages from a different OS (e.g., a message from Mac
    to Windows). To read the message, check the setup of your e-mail program and turn
    the word wrap option. Alternatively, you can copy and paste the body of the message
    into Notepad or Word.'
  merge: -1
