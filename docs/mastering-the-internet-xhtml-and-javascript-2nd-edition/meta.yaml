  md: '# Mailing Lists


    List servers often support three modes of message delivery to subscribers. With
    real-time delivery, subscribers receive messages from other subscribers as soon
    as they are sent to the list server. A common alternative, digest delivery, summarizes
    all messages sent to the list over a period of time called the digest cycle, which
    can be daily or weekly. When a subscriber requests digest delivery, the list server
    sends to the subscriber one (e-mail message) that contains all messages from the
    list during the digest cycle. Digest delivery minimizes the number of individual
    messages received each day or from the list server. Some list servers provide
    a no-mail fellow to subscribers to enable them to suspend and resume message delivery
    during vacation periods. Web-based delivery lets subscribers, or even non-subscribers,
    view lists with a browser. Users can navigate the lists and search for specific
    content.


    Two popular mailing-list servers are LISTSERV and Majordomo. They provide numerous
    mailing lists that cover many topics. LISTSERV is a commercial product manufactured
    by L-Soft International (http://www.lsoft.com). LISTSERV is sometimes used incorrectly
    to refer to any mailing-list server. Majordomo is freeware and can be downloaded
    from http://www.greatcircle.com/majordom. It works with Unix lists. Both servers
    provide Web-based services. For example, LISTSERV provides a fully customizable
    interface for site administrators, list owners, and subscribers. Majordomo provides
    a Web interface software to its list server, allowing novice users to manage their
    list configuration and subscriber-base.


    To receive messages from a mailing list, you subscribe to it, much as you subscribe
    to a magazine. Each list server provides two different e-mail addresses. The server
    address is the address to which a person sends commands to subscribe (unsubscribe)
    to a mailing list that the list server offers. The list address is the address
    to which a subscriber submits (posts) messages or shares knowledge with the entire
    group on the list. To subscribe, you can send an e-mail message with the command
    subscribe list-name@server-address, or its equivalent—use the command subscribe
    pets@server.com to subscribe to the pets mailing list offered by server.com. To
    unsubscribe, use the command unsubscribe list-name@server-address—example, unsubscribe
    pets@serverCom. List servers typically provide their users with instructions and
    guidance on what information is required to subscribe or unsubscribe. Some list
    servers provide a Web-based subscription-unsubscription service, where the user
    points and clicks to subscribe or unsubscribe to a list.


    Many mailing lists exist. Examples include crc-request@listserv.class-room.net
    (classroom-related lists), listserv@occmvm. cnyric.org (for K–12 educators), and
    majordomo@gsn (school foundation). The World Web Consortium has a large mailing
    list, lists@w3c, which includes many public archived lists for the benefit of
    the Web community at large to promote exchange of ideas. Visit http://www.w3.org/Mail'
