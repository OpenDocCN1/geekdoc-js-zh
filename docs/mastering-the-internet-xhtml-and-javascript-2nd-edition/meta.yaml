  md: '# Types of Modems


    5. B-ISDN modems. These are are broadband ISDN modems. (The previously mentioned
    ISDN modems are narrowband ISDN modems.) B-ISDN lines use fiber optics instead
    of twisted-pair copper wires. B-ISDN is much faster than ISDN.


    6. Satellite modems. Satellite-based Internet accesses a satellite dish to receive
    data at an average speed of 300 Kbps. A satellite Internet connection requires
    a special receiver, a PC adapter card, and special software. Each one of these
    components has a price associated with it, in addition to a monthly fee. The advantage
    of satellite-based Internet connection is that it allows areas and the developing
    world, where phone lines are rare or nonexistent, to access the Internet.


    7. Wireless (cellular) modems. Cellular modems are used to connect a laptop computer
    or a cellular phone to the Internet. This capability alleviates the need to plug
    the laptop into a wall socket. Users can check their e-mail while on the road,
    on a boat, in a plane, etc. Wireless modems are slow. While connected, the modem
    may transfer data at a rate of 9600 bits per second over a cellular phone line,
    costing you a lot to check your e-mail, for example. To try to bring down the
    cost, the cellular phone companies have developed a replacement for the TCP/IP
    protocol. The new protocol is called CPDD (cellular digital packet data). The
    CPDD packets are IP encrypted for security purposes. This technique allows cellular
    phone companies to charge customers by packets transferred and by the number of
    minutes of connection.


    # Example 1.6 Understand home broadband networking.


    How do you network multiple computers at home to share the same cable or DSL modem?


    Solution 1.6 You can buy a home broadband networking kit from an electronics store.
    The kit typically comes with a router (hub), network cables, and LAN cards. A
    cable or DSL line connects your ISP to a cable or DSL modem at home. Another cable
    connects the modem to the router. A LAN card is installed into each computer at
    home. Each card is connected to the router via a separate cable. In addition,
    LAN software is installed on each computer. The software must be configured before
    successful communication through the network can be achieved. It is preferred
    that the kit provide wireless networking, because a wireless setup is more convenient
    to use around the house.


