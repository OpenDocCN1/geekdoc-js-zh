  md: '# # Preface


    This second edition has been redesigned from the ground up to reflect and respond
    to many of the suggestions the author has received since the first edition was
    written. It has also been rewritten to accommodate the new Internet concepts that
    have been developed since the first edition was released.


    This edition has many new pedagogical and content features:


    +   - The page design and layout are completely new, with many eye-catching graphics
    features for section and example.

    - Abundant figures and screen captures have been included to illustrate concepts.

    - Each chapter begins with a goal, a set of objectives, and a list of section
    titles; and ends with tutorials, FAQs, a summary, a progress checklist, and problems.

    - Many chapters have a "Quick reference" section at the end that summarizes software
    use (Part I of the book), syntax of XHTML (Part II), and JavaScript syntax (Part
    III).

    - Each section has at least one pedagogical tool, be an image insert, a figure,
    a table, an example, a tutorial, an FAQ, or a piece of advice. These tools make
    it easy to follow and understand the material and minimize the need to thumb through
    pages in order to find material.

    - Each example and tutorial in the book have three pedagogical elements that inspire
    activity and deeper understanding. "Code explained" describes what particular
    code lines and sections do, "Discussion" provides insight on why certain segments
    of code are written the way they are. It also provides tips on running the code
    and pitfalls to avoid. "Hands-on" asks the reader to extend the existing code
    to accomplish a new task. This element is a confidence builder, as it is hard
    to write completely new code during the learning process.'
  merge: -1
  pgno: 22
- img_proc: false
  md: '# xxii Preface


    +   - Each example focuses on one chapter concept only, while each tutorial combines
    a few chapter concepts together to provide a more practical application.

    - Concepts are explained first and then applied, using many existing software
    tools in one place, so that the reader can have a conceptual overview and compare
    the available tools.

    - The "FAQs" are organized by chapter sections and serve as a stimulus for discussion.

    - The "Blackbox" (summary) section is tightly integrated with the chapter material.
    It lists the section and numbers where the corresponding detailed information
    can be found.

    - The "Check your progress" section is tightly integrated with the chapter sections.
    It can serve to focus group discussions in class or as a review for exams.

    - The text is written in an easy-to-follow writing style.

    - All topics are covered with great attention to depth and breadth.

    - The book covers three essential elements of today''s Web pages: the Internet,
    HTML, and JavaScript.

    - The book covers four major browsers: IE 6.0, Netscape 4.8 & 7.0, Opera 7, and
    Crazy Browser 1.05.

    - The book covers seven major e-mail tools: Eudora,ing, Outlook Express 6.0, Yahoo!
    Mail, Netscape 4.8, Netscape 7.01 mailer, and Opera 7 M.

    - The book covers three major HTML editors: FrontPage2002, Composer 7001, and
    AceHTML 5.0.

    - The book covers two leading servers: Apache server 2.0.45 and Tomcat server
    version 1.24, by the Apache Software Foundation.


    The rationale behind this edition is simple, but effective: We need to provide
    a comprehensive and simple course of Web knowledge for students to be able to
    learn the basics to be proficient in client-side technologies. These technologies
    include Internet literacy, HTML, and client-side JavaScript—three essential elements
    that one begins in order to understand the Web and Web pages today. As the Web
    matures and its users become more sophisticated, both students and instructors
    should continue to find this book as a single source for all learning and teaching
    needs.


    The purpose of this edition is to present the fundamental concepts of the Internet
    and its scripting tools (XHTML and JavaScript) in a generic framework. These concepts
    and tools are supplemented with examples, tutorials, and problems to provide readers
    with hands-on experience so they can master the concepts. The book strikes a balance
    between subject depth and breadth, and between generic and practical aspects of
    the Internet. As an example of the book''s coverage of depth and breadth, the
    text covers the basic topics pertaining to the Internet and its effective use
    in daily tasks such as e-mail and searching, as well as all aspects of client-side
    XHTML and JavaScript. As an example of its coverage of generic and practical aspects,
    the book allows the generic concepts to turn in technology, software, and practical
    applications. For instance, the book discusses the generic concepts behind e-mail
    tools'
  merge: -1
  pgno: 23
- img_proc: false
  md: '# Preface


    # xxiii


    and then covers the details of seven popular tools today, including e-mail clients
    and Web-based mail. Another example is the use of HTML editors: After covering
    the generic aspects of XHTML, the book presents some of the commonly used HTML
    editors and relates their user interfaces to the raw XHTML.


    This book fills an important need in the market. Students need a book that explains
    the subject matter in a simple, yet comprehensive and coherent way, with ample
    examples and hands-on tutorials. As a matter of fact, this book''s approach is
    a response to the nature of surfing the Web: If surfers do not find what they
    need on a Web page in about 30 seconds, they move to another one. If a Web site
    does not offer visitors concerned services and information, they lose them. This
    book offers concentrated knowledge to readers so that they can find what they
    need very quickly. Students can also use the book''s companion website, located
    at http://www.prenhall.com/zeid, to download the source code for each chapter
    and use the chapter''s practice questions to study and prepare for exams.


    Instructors need a book that provides them with ample topics, examples, tutorials,
    problems, and pedagogy. For example, the instructor may use the examples, tutorials,
    or exercises in a lab setting. Or the instructor may use the “Blackbox” (summary)
    section to prepare students for the end of each chapter as the base for class
    discussion and may also access the book''s companion website to download a complete
    set of PowerPoint slides and all the book''s source code, or use the online tool
    to prepare quizzes and exams. Solutions manual accompany the book as well. Moreover,
    instructors who wish to have only parts of the book can go through custom publishing—a
    request that Prentice Hall handles with ease through its sales representatives.


    The book covers three topics: Internet literacy, XHTML, and JavaScript. If you
    cover the three topics in one, use the book as is. If you cover each topic in
    a separate order, order one part through Prentice Hall''s custom-publishing service.
    Why should instructors use this three-part volume instead of three books? Consistency
    in style, format, and pedagogy is the reason. This consistency significantly increases
    the ease of using the book for both instructors, who must prepare the material,
    and students, who must learn it. Reducing the overhead of preparation and learning
    allows both instructors and students to devote their scarce time to using and
    learning the material instead of weaving through page after to follow and understand
    three styles of different books and authors. With the three parts of this book,
    instructors know what to expect and where to find it.


    Professionals, who are usually pressed for time, need a book that they can use
    for self-teaching purposes. They also need a book that provides them with answers
    to specific questions when they are developing websites and Web pages. With this
    volume, professionals can tap into the “Blackbox” (summary) and “FAQs” sections
    for quick consultation. In fact, many of the questions in the “FAQs” sections
    of this book are asked by students and professionals.


    The book is organized into three related parts. Part I covers the effective use
    of the Internet. This part develops the basic skills required for using the Internet.
    While many readers have been using the Internet for a long time, Part I formalizes
    this experience. Part II discusses, in detail, XHTML and Web-page design and development.
    Part III covers client-side JavaScript. This'
