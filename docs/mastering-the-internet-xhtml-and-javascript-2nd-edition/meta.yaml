    primarily computer programs. While many readers have already used them extensively,
    we list them as a reminder. These tools, and others, are covered in more detail
    throughout the book. The basic tools are a Web browser, a virus-scan program,
    a zip-unzip program, a screen-capture program, an FTP program, a Telnet program,
    and a graphics program. A screen capture is any of the entire computer screen
    or parts of it.


    Some of these programs are shareware, while others are freeware. Shareware is
