  md: '# 2.17 Wireless Browsing


    Wireless browsing (also known as mobile or handheld browsing) refers to browsing
    activities on miniature screens of small devices. Handheld devices are mobile,
    and some are wireless. They include pocket PCs, handheld PCs, cell and smart phones,
    and PDAs (personal digital assistants) such as Palm Pilots, Handspring Visors,
    Blackberries, and many other organizers. These handhelds are known to be memory
    starved and power space constrained, as well as to have small display screens
    compared with those of desktop computers. Thus, stripped-down versions of desktop
    Web browsers must be developed to accommodate the limited onboard memory of these
    devices.


    ![](bbox=[0.213, 0.348, 0.828, 0.655])


    Handheld browsing may be done online or off-line. Handheld online browsing requires
    a wireless modem and an ISP. Handheld off-line browsing requires the user first
    to download the desired Web pages from their respective websites to the handheld
    device for later viewing off-line. This process is known as synchronizing (or
    syncing) for short the handheld device, and is done by downloading it onto its
    cradle. The cradle is, in turn, connected to the Internet via a desktop computer
    during the sync process. Users of handheld devices often sync them in the morning
    before becoming “mobile” and then browse the Web pages off-line on the road. The
    sync process can be used to download new Web pages or replace the old content
    of already synced Web pages. The downloaded content is mostly text, because of
    the memory limitations of handheld devices. Popular content among handheld users
    includes weather forecasts, news (financial, sports, and otherwise), maps and
    driving directions, entertainment, travel data, and restaurant information.'
  merge: -1
  pgno: 99
- img_proc: false
  md: '# Wireless Browsing


    ![](bbox=[0.285, 0.115, 0.648, 0.335])


    The handheld browsing experience is different from the desktop browsing experience
    because of the small screens and limited memory size of handsets. Users confined
    to viewing small portion of a Web page often lack the overall context and find
    themselves to scroll to the Web page extensively. In addition, the user has access
    to only a few Web pages at any given time. Further, the content may not be current,
    depending on when the handheld was last synced. Caching Web pages to view them
    up a lot of resources on the handheld.


    There are browsers for both off-line and online handheld browsing. Three examples
    come from Microsoft, AvantGo, and Opera. Microsoft offers Pocket IE (PIE). PI''s
    a compatible version of Microsoft''s desktop IE under Windows CE OS and Pocket
    PC 2002 OS, both from Microsoft. The user employs desktop IE to sync a Pocket
    PC for off-line browsing. Desired Web pages are transferred from IE''s favorites
    to PI''s favorites during the sync time. PIE has built-in support for Microsoft
    Mobile Channels (popular websites) and AvantGo.


