    # 2.11 Browser Cache


    Browsers use the cache concept to improve the access of Web pages. A cache is
    a temporary storage location. You have noticed that, when you return to Web pages
    you have visited during the current session, the browser displays them faster
    than it did the first time. After a Web page is downloaded from the Internet during
    a session, the browser keeps a copy of it in a cache on the client computer. When
    the user requests a Web page, the browser checks the cache before downloading
    a fresh copy from the Internet. If the requested page is in the cache, the browser
    displays it without using the Internet. Keeping Web pages in the browser cache
    improves access dramatically, especially at times of heavy Internet traffic.


    A browser uses two types of caching schemes: memory and disk. The memory cache
    is the portion of the computer''s RAM that the browser uses to store the most
    recently downloaded Web pages during the current session of surfing the Internet.
    A browser typically has a default size for its cache. The user can change this
    size if needed. If the total size of the Web pages user has downloaded exceeds
    the current size of the memory cache being used by the browser, older pages are
    removed (flushed) from cache to create space for new pages downloaded. At the
    end of a browser session, the memory cache is erased and released back to the
    computer''s available RAM for other applications.


    The disk cache is a portion of the computer''s hard disk that the browser uses
    to store downloaded Web pages from previous sessions. As memory cache, a browser
    has a default size for its disk cache that the user can change. The disk cache
    used by the browser is flushed in a similar way to the memory cache; however,
    unlike the memory cache, the disk cache retains Web documents between browser
    sessions.'
  merge: -1
  pgno: 84
- img_proc: false
  md: '# 60 Chapter 2 • Web Browsers


    A browser uses the two types of caches according to the following scenario: A
    user requests a Web page by typing URL into the browser''s URL toolbar or by using
    the Back and Forward buttons of the browser. In either case the browser checks
    its memory cache first, followed by its disk cache. If it finds the Web page in
    either cache it loads into its window. To guard against old content in its disk
    cache, the browser usually contacts the Web page''s server to verify whether the
    content of a Web page has been altered since its retrieval. If it has, the browser
    downloads the new content. The browser does not perform this check for its memory
    cache, because content change is highly unlikely within one browser session.


    Most browsers allow their users to change the sizes of the memory and disk caches.
    As the available cache space is filled, old Web pages are replaced with new ones.
    Decreasing the size of cache will decrease the chances of having previously visited
    Web pages being available from the cache. A user who does not want to store Web
    pages between browser sessions should set the disk cache to zero.


