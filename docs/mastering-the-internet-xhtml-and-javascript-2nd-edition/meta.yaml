  md: '# Security


    # 73


    # Example 2.9 Understand security levels in Web browsers.


    What are the security levels that browsers can use an encrypted connection between
    a browser and a server. and how do we set them up?


    Solution 2.9 SSL provides an encrypted TCP connection between a browser and a
    server. SSL has two versions: SSL 2.0 (developed in 1994) and SSL 3.0 (developed
    in 1996). SSL was succeeded by TLS 1.0 (Transport Layer Security) in 1999. TLS
    1.0 is based on SSL 3.0; it improved security because of better cryptographic
    (encryption–decryption) formulas and better methods to generate encryption keys.
    The TLS protocol is the standardization of SSL.


    Major browsers support the three versions SSL 2.0, SSL 3.0, and TLS 1.0. The level
    of security a browser supports the size of the keys used in encryption. The size
    of a key is the number of bits and key sizes range from 40 to 2048 bits. Commonly
    used sizes are 40 and 128 bits. The larger the key, the better is the security;
    that is, more bits mean security. Forty-bit encryption is known as weak encryption,
    while 128-bit encryption is known as strong encryption. It will take 2^128 attempts
    to crack a message encrypted with keys as 40-bit encryption. Most online applications
    use security as being conducted with 128-bit encryption.


    Browsers offer their users control over the level of security. Just remember,
    that the server you connect to must support your desired level. You can check
    the default level of security of both IE and Netscape using the Help menu. In
    IE, click Help => About Internet. In Explorer, click the Help menu and search
    the contents for “security” or “encryption”. In Opera and CB, start with the Help
    => Communicator. In, the four browsers use a padlock symbol (on the Status bar
    in IE, Netscape, and CB and on the URL bar in Opera) to indicate the security
    of Web connections. An open padlock means an insecure connection, while a closed
    padlock signifies a secure connection. If you-click on IE’s padlock or Netscape’s
    padlock, a popup window will display the security information of the current connection.
    The four browsers provide users with security options as shown in the following
    screens:


    ![](bbox=[0.039, 0.723, 0.92, 0.903])'
