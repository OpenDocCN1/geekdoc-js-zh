  md: '# Usenet Newsgroups


    The collection of news that is posted to servers on a worldwide network is known
    as Usenet. Usenet utilizes software that copies messages that users contribute,
    so that participating server has an exact copy of every message contributed to
    the network. The Usenet software organizes these messages into newsgroups that
    people can read and respond to. Newcomers to a newsgroup may want to read its
    messages for a while before deciding to post messages themselves, a practice know
    as lurking (see Chapter 4).


    Usenet started out by a method of sharing information about topic. Unix computer
    systems Users wanted to exchange and organize notes and observations by topic.
    Further, they wanted the information to be available to many people. Usenet spread
    widely after its software underwent a major revision during the early 1980s that
    enabled it to handle a larger volume of messages.


    Usenet is intended for technical use, but people also need to discuss social,
    political, hobby, recreation, and other issues. Usenet is a great resource. Many
    newsgroups offer intelligent discussions, particularly the moderated ones. One
    of the best things about Usenet is the FAQs. The FAQs attempt to provide answers
    to some of the questions people most likely to ask. There are hundreds of these
    FAQs, and some of them are among the best sources of information on a topic.


    The structure of Usenet newsgroups is hierarchical. At the top level are some
    very general topics, and each of these topics are more and more specific topics.
    Originally, the Usenet groups were divided into seven sub groups, which are still
    called the Big Seven. New hierarchies have been coming into being since. Listed
    as follows are some of the newsgroups that are available, with the Big Seven listed:


    +   1. **comp**: topics related to hardware, computer science, programming languages,
    and games.

    2. **sci**: scientific research and applications topics, such as physics, biology,
    and psychology.

    3. **rec**: recreational topics, such as sports, music, video making, and cooking.

    4. **news**: the hierarchy where Usenet talks about itself; it is very useful
    for new users.

    5. **talk**: loose discussions on unresolved questions; politics and religion
    are popular topics.

    6. **soc**: discussions about social issues relating to not belong to the foregoing
    groups, such as for-sale postings.

    7. **misc**: discussion on other things that do not belong to **alt.computing**
    to **alt.tv.systems**

    8. **alt**: a bizarre of topics from **alt**. It is easier to create a new group
    in the **alt** hierarchy than other hierarchies. Some **alt** groups are quite
    useful.

    9. **k12**: discussions and groups relating to education from kindergarten through
    grade 12, both teachers and students.

    10. **fj**: discussions of hundreds of different topics in Japanese.

    11. **de**: a hierarchy with the scope and size of **alt**, but all in German.'
