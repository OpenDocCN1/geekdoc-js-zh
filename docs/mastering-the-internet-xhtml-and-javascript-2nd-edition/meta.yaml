    # 4.1 Introduction


    The Web is all about communication in an easy and convenient way. Web communication
    has two modes: synchronous and asynchronous. Synchronous communication is an activity
    in which the two communicating persons send (receive) messages to (from) each
    other simultaneously, in real time. Examples include instant messaging (IM) and
    chatting, and the subject of this chapter. Asynchronous communication is an activity
    in which the two communicating persons send (receive) messages to (from) each
    other independently, at different times. Examples include e-mail (Chapter 3) and
    newsgroups (Chapter 5).


    Chatting on the Web is fun and easy to do. It is like having friends, family members,
    or colleagues in one place at a time. It enables us to stay in touch. In addition
    to chatting for, the uses of Web chatting are unlimited. For example, salespeople
    are constantly on the road and can use it to talk to their customers and clients.
    Company executives can hold meetings from remote locations. Professors and instructors
    can hold office hours with their students online by setting a specific time when
    students can post questions and ask for help.


    Three types of content exist for Web chatting. In text-only chatting, short text
    messages are exchanged. These messages usually use abbreviations, or acronyms
    (Chapter 3.) In instant messaging, graphics and text content are used Such that
    the text messages are augmented with colors and graphics in the form of emoticons
    (Chapter 3.) The third type of chatting includes both audio and video content.
    This type is known as Webcasting.


    Web chatting is a distributed application that uses the client/server model of
    communication. (Chapter 1.) Web the client-based type, the user needs to download
    and install a chatting client. Examples include America Online Instant Messenger
    (AIM), Yahoo! Messenger (YM), and Microsoft Messenger (MSN Messenger). In Web-based
    type, users chat through Web pages.'
  merge: -1
  pgno: 171
