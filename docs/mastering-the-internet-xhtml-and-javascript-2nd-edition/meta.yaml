  md: '# Tutorials


    # 129


    # Example 3.20 Filter spam.


    Learn to filter unwanted e-mail.


    Solution 3.20 Eudora: To block a specific e-mail address, click Tools (menu on
    the menu bar) => Filters => Follow the prompts. Blocking a message means intercepting
    the message and moving it to the e-mail folder specified by the filter.


    Outlook Express: To block a specific e-mail address, click Tools (menu on the
    menu bar) => Message Rules => Mail => Select (check) the rules and actions checkboxes
    => click the links that show and the required data => OK => OK.


    Netscape: To block a specific e-mail address in Messenger, click Edit (menu on
    the menu bar) => Message Filters => New => Type the filter name and rules (conditions)
    => OK => OK. To block e-mail in Mailer, click Tools (menu on the menu bar) =>
    Message Filters => New => Add filter rules and actions => OK => OK.


    # 3.16 Wireless E-Mail


    Wireless (mobile or handheld) e-mail is an ideal application to use the IMAP protocol
    for communication, as it avoids the downloading of messages to handheld devices,
    which have limited storage capacity. IMAP also contributes to keeping e-mail in
    one location: the incoming e-mail server.


    There are three key issues to wireless, handheld, and mobile e-mail. The first
    is security. The downloading of e-mail should be done via a secure Internet connection
    that uses encryption keys. The second issue is a single-mailbox integration. Syncing
    the handheld mailbox with desktop mailboxes could be confusing for users. The
    third issue is known as a device. Push is the process by which e-mail is automatically
    delivered to the handheld device rather than the user having to initiate the process
    each time.


    # 3.17 Tutorials


    # 3.17.1 Open and Save E-Mail Attachments (Study Sections 3.4 and 3.14)


    To open an attachment in any e-mail or Web e-mail, click on the attachment. Some
    clients, such as Eudora, ask you if you wish to open the attachment. Once opened,
    you can save it. Other clients, such as Netscape, give you the option to open
    or save is the attachment. It is recommended that you save the attachment locally
    and check it with a virus scan program before opening it.'
