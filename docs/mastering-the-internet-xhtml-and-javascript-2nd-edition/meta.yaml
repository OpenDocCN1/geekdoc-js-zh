    # 7.3 Open Directory Project


    When users search for information on the Internet by using a directory’s search
    engine, the engine ranks its search results. Different directories use different
    techniques to develop their ranking systems. For example, Yahoo! and Lycos have
    an army of editors and staff who evaluate websites. Directories are referred to
    as human-powered search engines.


    This approach to creating ranking systems faces a monumental challenge. As the
    number of Web pages on every imaginable increases, directory search engines should
    try to do more than list every available page on one subject. One logical solution
    is to turn the ranking system over users. This is the main idea behind a project
    the Open Directory Project (http://dmoz.org). The project''s website offers its
    own directory and many other interesting facts. The project started in 1998. The
    project acknowledges that it is impossible for a search service to know everything
    about anything. Thus, the project turns to themselves.'
