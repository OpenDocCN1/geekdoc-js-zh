    # 6.11 .NET Passport


    .NET Passport is a Microsoft service that allows users to make online purchases
    and perform other activities across different participating websites, with the
    use of one single login (username and password). The .NET Passport service (http://www.passport.net)
    includes .NET Passport wallet and .NET Passport express purchase.


    The .NET Passport recognizes the user''s privacy and the importance of protection
    of personal information. The website publishes the .NET privacy statements for
    both adults and children. The statements apply only to the .NET Passport and its
    participating websites. We describe the collection, use, and disclosure practices
    by .NET Passport of personal information. During registration for a .NET Passport,
    the user must provide certain personal information in order to create a .NET Passport
    profile: e-mail address, first and last name, country, region, state or zip code,
    postal code, language, time zone, gender, birth date, and occupation. The .NET
    Passport service and its participating websites may require additional personal
    information during use of their websites, such as telephone number for mobile
    users, and credit card number and billing and shipping address for .NET Passport
    wallet.


    Websites associated with .NET Passport require registrations from the user: one
    for .NET Passport and one for the participating website. The website may use two
    registration forms or one form. In the latter case, the .NET Passport information
    is identified on form by a .NET Passport icon, next to each field.


    .NET Passport uses personal information according to its privacy statement. It
    will not sell or share the personal information in a manner different from that
    stipulated in the privacy statement without prior consent. However, .NET Passport
    will use the information for maintenance and operation of its accounts. For example,
    it may send a user e-mail message in order to verify the e-mail address. Or it
    may send e-mail about periodic services, recommended security updates, or surveys
    related to the .NET Passport service.


    . .NET Passport service uses cookies. If a cookies-disabled browser attempts to
    access the service, an error occurs. .NET Passport uses cookies whenever a user
    signs into .NET-participating website. The cookie stores a unique identifier,
    the sign-in time, and other pro-file information from participating websites.
    The cookie is stored in an encrypted format on the .NET member hard disk. The
    cookie allows the user to move from one page to another within the participating
    website without having to log in again each time.'
