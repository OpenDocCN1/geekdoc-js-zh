    ![](bbox=[0.137, 0.114, 0.768, 0.503])


    Figure 7.1 Any word Google search.


    Let us use the exact-phrase search. Type the search string shown in Figure 7.1
    into the second search field shown in Figure 7.1, and click the search button.
    Alternatively, you can type "golf sportswear and equipment" (including the quotes)
    into Google''s Web page. This search returns no hits.


    # 7.6.2 Boolean Search


    A Boolean (also known as math or symbol) provides users with control over how
    a search engine uses the words of a search string. There are four operators: AND,
    OR, NOT, and NEAR. The AND operator requires that all search words be present
    in the search results, similar to the all-words search described in Section 7.6.1—e.g.,
    cats AND dogs. The OR operator requires that at least one search word be present,
    similar to the any-words search described in Section 7.6.2—e.g., cats OR dogs.
    The NOT operator is a negation (exclusion) operator. For example, dogs AND NOT
    food returns Web pages that do NOT contain food, but both dogs and breed NOT.
    The NEAR (proximity) operator is used to specify which words should appear close
    to each other—e.g., cats NEAR dogs. Search engines provide forms that users can
    use for simple Boolean'
