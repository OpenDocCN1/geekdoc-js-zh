  md: '# Overview of the Internet


    # Goal


    Understand and master some of the basic concepts of the Internet and the World
    Wide Web in order to be able to use them effectively in ordinary life, as well
    as in professional activities.


    # Objectives


    +   * Client/server model

    * Data and file transmission across the Internet

    * URLs and IP addresses as unique Internet IDs

    * The structure of e-mail addresses

    * File protocols and compression and decompression of files

    * Inranets and extranets

    * Requirements and types of Internet connections

    * Modem types'
  merge: -1
  pgno: 28
- img_proc: false
  md: '# Outline


    +   1.1 Introduction

    1.2 The Internet and the World Wide Web

    1.3 Internet Jargon

    1.4 Client/Server Model

    1.5 Client/Server Diagnostic Commands

    1.6 Evolution of the Internet and the World Wide Web

    1.7 Transmission across the Internet

    1.8 IP Addresses and URLs

    1.9 Internet Domain Names

    1.10 E-mail Addresses

    1.11 File Protocols on the Internet

    1.12 File Compression and Decompression

    1.13 Intranets and Extranets

    1.14 Connecting to the Internet

    1.15 Types of Modems

    1.16 Internet Tools

    1.17 Tutorials

    FAQs -Blackbox -Check Your Progress - Problems


    # 1.1 Introduction


    The Internet has been acknowledged as the source of a profound revolution. It
    has already changed the ways and the lays in which we communicate and conduct
    business. For example, many of us send e-mail messages back and forth to friends,
    colleagues, customers, clients and relatives all over the world. The Internet
    provides an instant mode of communication in the form of electronic mail—or e-mail
    for short—and instant messaging. You can even meet people on the Internet. Web
    pages clutter the Internet. Today, Yellow Pages assist in helping people sift
    through the clutter. There is no doubt that this medium of communication will
    dominate and surpass any other medium. The Internet had more users in its first
    5 years than the telephone did in its first 30 years, and the volume of e-mail
    sent every day already outnumbers that of regular mail.


    While reading and reading about the Internet is exciting, putting all related
    pieces together is often confusing. This chapter provides an overview of the structure
    of the Internet, explains how the Internet works, and discusses the different
    types of connections to the Internet.


    # 1.2 The Internet and the World Wide Web


    The Internet encompasses diverse computers and programs working together seamlessly
    as a network. A network is a collection of devices (such as computers and printers)
    that are connected together by communication paths. These devices are called the
    nodes of the network, and'
  merge: -1
  pgno: 29
- img_proc: false
  md: '# The Internet and the World Wide Web


    the communication paths may be wires, fiber-optic cables, or wireless connections.
    The Internet is a network of networks. These networks include various federal
    networks, a set of regional networks, campus networks, and foreign networks. The
    Internet connects many geographical regions; sometimes it is known as the “information
    superhighway”. It also enables international networks to communicate with each
    other.


    This definition of the Internet typically does not mean much to the end user.
    The user only wants to do something, such as running a program, access a website,
    or download a particular file. As such, an end user does not need to worry about
    how the Internet is put together. A good analogy is the telephone system; it,
    too, is a network. Phone companies such as AT&T, MCI, and all separate corporations
    running pieces of the telephone system. They worry about how to make it all work
    together; all the user has to do is dial the number. The user begins to worry
    only when a problem occurs, as when a phone call cannot be completed. In such
    cases, the company that owns the phone system causing the problem should fix it.
    Same is true for the Internet: Each network has its own operations center. If
    something goes wrong with the network, the center that operates it should fix
    the problem.


    The Internet’s driving force is the World Wide Web (also known as WWW, W3, or
    Web), the section of the Internet that features multimedia capabilities (i.e.,
    has video, audio, images, graphics, and text). The Web began to take off after
    Mosaic, the first graphical Web viewer (browser), came out in 1994 and has brought
    a vast network of data, news-promoting promotional materials, periodicals, and
    Web pages, displayed in colors, with audio and video output. ...XHTML) allows
    website creators to link their Web pages to other pages, with each page accessed
    by a simple click of the mouse button.


    ![](bbox=[0.315, 0.597, 0.683, 0.725])


    The Internet links powerful servers in every part of the world. A server is a
    program that resides on a computer and provides services for other computer programs
    known as clients. A particular computer may contain both client and server programs.
    Web users can transfer files to and from other computers (known as uploading and
    downloading, respectively), send electronic messages to the e-addresses of other
    users, and set up their Web pages for whatever purpose they desire. Companies,
    universities, government agencies, and individuals throughout the world now maintain
    main pages on the Web, and the demand for Web access is increasing PC (personal
    computer).


    The methods for finding and accessing information on the Internet are very unique.
    Traditionally, as found in libraries, information is organized in books that are
    indexed and shelved in'
  merge: -1
  pgno: 30
- img_proc: false
  md: '# 6 Chapter 1 • Overview of the Internet


    order, according to a standard classification system. Unlike information in libraries,
    however, information on the Internet is not organized at all. Information is contained
    in Web pages. In order to find a particular piece of information, a Web surfer
    uses a search engine. A Web surfer is a person who uses the Internet to find desired
    information. A search engine is a computer program that helps you find specific
    information on the Web. The Web surfer types a search string (one or more words
    that may be found in websites containing the information), and the search engine
    returns links to the Web pages that contain the string (usually as hits).


    The conclusion drawn from the foregoing analogy is that we need to use a different
    model when dealing with information on the Web. The heart of this model is a dynamic
    nature and randomness of information. Thus, one should not tend to memorize the
    addresses and titles of websites, but rather learn to search for information effectively.


    # 1.3 Internet Jargon


    The Internet is full of acronyms and new words. The chapters of this book introduce
    definitions as we need, and these definitions are listed again in the glossary
    in Appendix A. For additional information on Internet jargon, refer to the following
    websites or use a search engine: http://www.whatis.com and http://www.webopaedia.com.


    # 1.4 Client/Server Model


    The client/server model is central to Internet communication, distributed networked
    computing, and services. This model uses two computers installed on two separate,
    but networked, computers at different locations. The client program (or client,
    for short) installed on one computer (known as the client computer) communicates
    with the server program (or server, for short) installed on the other computer
    (known as the server computer), as shown in Figure 1.1. The client requests services
    from the server. While the server is running, it acts as a daemon. A daemon is
    a process that awaits (‘listens”) to client requests. When it receives a request
    from a client, it grants the request and sends a response back to the client.
    A common example of client/server communication is a Web browser acting as a client
    when requesting a Web page from a server.


    Multiple clients can access a server concurrently. This situation increases the
    demand (known as the server load, traffic, or number of hits) on the server and
    may slow its response significantly. In such a case, the server computer (also
    known as the host computer or machine, or for short) must be upgraded or replaced
    with a faster computer to handle the increased demand. Balancing a server’s load
    to improve its response time is a very interesting and practical problem, which
    is beyond the scope of this book.


    ![](bbox=[0.365, 0.826, 0.678, 0.936])'
  merge: -1
  pgno: 31
- img_proc: false
  md: '# Client/Server Model


    ![](bbox=[0.187, 0.125, 0.81, 0.337])


    ![](bbox=[0.177, 0.366, 0.822, 0.585])


    **Figure 1.1** Client/server model.


    Client/server databases are used extensively on the Web. A **database** is a set
    of data that is stored and organized in a single or many files. For example, a
    bank customer can use a browser to access the bank''s database, installed on a
    server, to check his her account balance. A common architecture of a client/server
    database is the **two-tier model**, where two networked computers are used as
    shown in Figure 1.1(a). The client, running as an application in a browser, sends
    requests (queries) to the database. The database, accessed through a server, sends
