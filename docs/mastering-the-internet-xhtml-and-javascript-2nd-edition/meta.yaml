  md: '# 116 Chapter 3 • E-Mail Tools


    encrypted and decrypted using public and private keys. A user can configure an
    e-mail client to provide s-mail.


    The encryption and decryption of an s-mail message also requires encrypting and
    decrypting its attachments, if any. The two available protocols are S/MIME and
    PGP/MIME. The difference between the two is in the use of different formats and
    algorithms to encrypt and decrypt the s-mail''s content and digital certificates.
    S/MIME (secure MIME) was originally developed by RSA Data Security, Inc. PGP/MIME
    is based on PGP, which was developed by individuals. PGP (Pretty Good Privacy)
    is a protocol used to encrypt and decrypt s-mail over the Internet. It can also
    be used to send digital signatures.


