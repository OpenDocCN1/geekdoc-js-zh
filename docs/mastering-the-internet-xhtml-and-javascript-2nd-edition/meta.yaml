    # General


    Q:Is the Internet free? Who pays when I am connected to a site in, say, Australia?

    A: You pay in the form of an access fee to your ISP.

    Q: What is the difference between the Internet and the WWW?

    A: The WWW is the part of the Internet that features multimedia capabilities such
    as images, audio, and video. WWW is thus a subset of the Internet.

    Q: How do I learn more about the chapter topics?

    A: Search the Internet itself, using a search engine.

    Q: What is a POP?

    A: POP is a term that stands for point of presence. It is an access point with
    an IP address to the Internet. ISPs have POPs in various geographical locations,
    to allow customers to connect to them via local phone calls. POP also stands for
    Office Protocol. For example, POP3 is a popular e-mail server type. We cover e-mail
    in more detail in Chapter 3.

    Q: How can I find people and companies with the Internet?

    A: Use search engines. Try this website: http://www.switchboard.com.

    Q: Why does a shareware downloaded and installed not work correctly?

    A Downloading a file could result in its corrupt because of say, a bad Internet
    connection. Try to download it again.


    # URLs and IP Addresses (Sections 1.8–1.13)


    Q:What are the different parts of a domain name?

    A: Consider the website coe.neu.edu www is the host name, co.neu.edu is the second-level
    domain name, and edu is the TLD.

    Q: What is the difference between a URL, a domain name, and an IP address?

    A: Consider the URL http://coe.neu.edu is the file protocol, and www.coe.edu is
    the website (also known as the domain name). The IP address is 129.10.32.98. The
    website is the name of the IP address. You can use http://129.10.32.98 as a URL
    instead of http://coe.neu.edu.


