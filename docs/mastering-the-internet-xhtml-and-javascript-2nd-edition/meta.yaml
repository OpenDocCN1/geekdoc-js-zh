    # 4.8 Webcasting


    We have discussed two of the Web-chatting methods: text-based chatting (chat rooms
    and IRC) and instant messaging. The third method we cover here is Webcasting (also
    known as netcasting). Webcasting is the ability to deliver, via the Web, live
    or delayed versions of sound and video broadcasts. Webcasting can deliver previous
    versions of weather reports, news, movies, music videos, radio and television
    programs, and other information.


    Webcasting requires the installation of software on one computer so that one may
    receive the digital signals of the broadcasts. The Internet Explorer 6.0 and Netscape
    7.01 browsers are examples of such software. Webcasting uses what is called push
    technology, in which the Web server “pushes,” or sends, information and news to
    the user. Webcasting comes to the user in the form of channels to which the user
    can subscribe.


    ![](bbox=[0.039, 0.658, 0.89, 0.673])


    Example 4.11 Use IE 6.0 and Netscape 7.01 Webcasting channels.


    Learn to use some Webcasting channels.


    Solution 4.11 Internet Explorer: IE uses MSN channels located at http://www.msn.com.
    Start the IE browser. Then click this sequence: Favorites (menu on the menu bar)
    => MSN.com. Select any channel, such as Music, Movie & TV. You can also access
    MSN in any other browser.


    Netscape: Netscape browser provides Netscape radio, Radio@Netscape, which is integrated
    into its Personal toolbar. (See the forthcoming screen capture). Radio@Netscape
    is an easy-to-use player that allows you to choose from dozens of genres of music
    and over 150 stations. Netscape Radio uses the RealPlayer software to deliver
    playback of music on a PC. You can customize Radio@Netscape''s preset channels
    by selecting from a wide variety of music, or you can listen to the channels of
    a guest DJ.'
