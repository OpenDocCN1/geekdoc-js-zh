    # 3.13 S-Mail


    S-mail (secure mail) consists of e-mails that are sent and received over secure
    connections, as discussed in Section 21.6. Sending confidential information by
    s-mail ensures that no one intercepts the e-mail and reads it or alters it in
    any way. Secure e-mail messages are'
