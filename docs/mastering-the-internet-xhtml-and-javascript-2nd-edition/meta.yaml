    # 1.11 File Protocols on the Internet


    While the TCP/IP protocol transmits files between servers and clients, file protocols
    determine the formats and rules of exchanging files between them. For example,
    exchanging a Web-page file is different from exchanging a plain-text file, although
    both are transmitted as packets. The concept of a file protocol is analogue to
    making a phone call. While the voices of both the caller and the recipient are
    transmitted as sound waves, both the caller and the recipient must speak the same
    language in order to exchange the call correctly, i.e., understand each other.
    Unlike TCP/IP, a file protocol is an application protocol. Several types of protocols
    are used on the Web, including the following:


    +   1. HTTP (hypertext transfer protocol): Allows a client to request a Web page
    from a server. An example is `http://www.neu.edu`.

    2. HTTPS (secure HTTP): Ensures secure communication between a client and a server.
    An example is `https://www.amazon.com`, e.g.,

    3. Mailto: Sends an e-mail message to a specified address, `mailto:zeid@coe.neu.edu`.
    When this command is typed in a browser, it invokes the client''s e-mail tool.

    4. NNTP (network news transfer protocol): Allows to read (post) messages from
    to newsgroups and bulletin boards. Refer to Chapter 5 for an explanation of how
    to use this protocol.

    5. FTP (file transfer protocol): Allows you to receive (download) and send (upload)
    files from a remote computer. An example is `ftp://coe.neu.edu`.

    6. Telnet: Allows you to access a remote computer. An example is `telnet://gate-way.coe.neu.edu`.

    7. File: Displays a file that exists on any of the client''s local drives, such
    as a hard or floppy drive. An example is c:`c:\dir1\dir2\filename.txt`.


    Tutorial 1.17 demonstrates how to use some of these protocols. The default protocol
    is HTTP. If a user does not specify a protocol, the browser uses HTTP to send
    and receive information from the Web. In addition to protocols, URLs may occasionally
    use port numbers. A port is a logical connection or channel that allows a client
    to communicate with a server. For example, HTTP communication occurs through port
    80. An example is `http://www.neu.edu:80`.'
