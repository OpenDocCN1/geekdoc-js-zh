  md: '# Blackbox


    Q:How do I use the e-mail quote symbol, >?


    A: When you respond to someone''s e-mail message, you can quote him or her in
    order to make communication easier. When you use your e-mail program to respond
    to the message, it appends the quote symbol to the beginning of each line of the
    message, in anticipation of your use of quotes. It sometimes italicizes the body
    of the message. Simply insert your responses at the proper places in the message.
    Here is an example:


    > >and can you please me the time and place?

    3 P.M. in the conference room of the IT department.


    # E-Mail Clients and Web-Based E-Mail (Section 3.6)


    Q:What is the difference between the IMAP and POP3 protocols?


    A: IMAP keeps your e-mail messages on the incoming e-mail server, allowing you
    to use any e-mail client anywhere to read them. POP3 requires you to download
    all e-mail onto your computer (where your e-mail client resides) before you can
    read it. Think of IMAP as an online e-mail reader and POP3 as an off-line e-mail
    reader.


    Q:What should I do when I delete a message, but it still shows with a line through
    its header instead of going away?


    A: This means that you are using an IMAP server. Check your e-mail client and
    make sure that you change your option to remove the message instead of striking
    its header with a line.


    # Eudora (Section 3.7)


    Q:What is the difference between the Inbox and In folders of Eudora?


    A: Eudora uses the Inbox folder to download incoming e-mail when you configure
    it to use the IMAP protocol. It uses the In folder when you configure it to use
    the POP3 protocol.


    Q:My Eudora program does not check e-mail when I click the Check Mail button,
    even though I am online. What is the problem?


    A: Check the incoming e-mail server''s setup. If your e-mail server is using POP3
    and you check IMAP accidentally, this problem occurs.


    # Hotmail and Yahoo! (Sections 3.11 and 3.12)


    Q:Does the Tab key on the keyboard work while I am composing messages using Hotmail
    or Yahoo! Mail?


    A: No. If you hit it, the cursor will disappear (it is a mail program issue).
    Click anywhere in the message area to see it again.


