    # 5.1 Introduction


    E-mail, mailing lists, and newsgroups are forms of asynchronous communication.
    The latter two are not as prevalent as they once were, because of the recent popularity
    of instant messaging and chat rooms. However, they still provide a wealth of information
    that Web surfers can search in order to find every issue and question you can
    imagine. Instant messaging and chat rooms do not provide a permanent record to
    which we can easily refer.


    # 5.2 Mailing Lists


    A mailing list is a service that sends information via e-mail to a distribution.
    The list is composed of a group of people (subscribers) who recieve periodic e-mail
    messages on a particular topic. There exist many mailing lists today. A mailing
    list includes the e-mail addresses of its subscribers. Some companies and software
    vendors use mailing lists to keep in touch with their customers. Some groups use
    them to distribute announcements and upcoming events.


    Two types of mailing lists exist: moderated and unmoderated. A moderated mailing
    list is a mailing list for which a moderator, as the list owner, reviews the incoming
    messages before posting them to list subscribers. Some moderated lists do not
    accept messages from subscribers. For these lists, the owner posts all messages
    and subscribers read them, without any other means of participation. Moderation
    is often used to increase the "signal-to-noise ratio" of a list—that is, to select
    meaningful content and filter out uninformative comments and abuse. Moderation
    requires human intervention, and lists with a high level of activity require human
    time. An unmoderated mailing list lets one subscriber post a message to all subscribers
    without human intervention.


    The client/server model of communication applies to mailing lists. A list server
    hosts a mailing list and its messages, to allow its subscribers (clients) to receive
    (post) e-mail messages from (to) the server. When the list server receives a message,
    it automatically broadcasts it to everyone on the list. The result is similar
    to the services provided by chat rooms and IRC channels, except that the messages
    are transmitted as e-mail and are therefore available on individual.'
  merge: -1
