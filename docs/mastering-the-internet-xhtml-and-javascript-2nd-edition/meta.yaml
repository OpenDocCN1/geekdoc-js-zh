  md: '# Chapter 1 • Overview of the Internet


    (i.e., broadband). DSL connections use using phone lines; they require DSL modems.
    Cable connections use TV cables and require cable modems. Both connections have
    compatible speeds. Telephone companies usually offer DSL services, and cable-TV
    companies offer cable services.


    # 1.14.1 T-Carrier System


    ISPs use T lines to provide dedicated high-speed access to the Internet. The T-carrier
    system is the easiest, fastest, and most convenient way to connect to the Internet.
    The system was introduced by Bell phone companies in the United States in the
    1960s. A T line supports digital transmission at high speeds. Large organizations
    typically lease T lines at a speed of their choice from a commercial provider.
    The provider places a routing computer (router) to send them to their final destinations.
    All computers can connect from the site to the router via the site for ISPs. The
    LANs are the responsibility of the site. Once the site is up and running, the
    provider is responsible for only the router and the T line.


    How are T lines? Two of the existing technologies are T1 and T3 lines. A T1 line
    provides a bandwidth of 1.5 million bits per second. A T3 line has a bandwidth
    of 45 Mbps (megabits, or 45 million bits, per second). A bandwidth of 45 Mbps
    means that a T3 line transmits 45 million bits of data, voice, and video per second.
    A T1 line uses 24 Gbps channels (24×64 Kbps = 1.5 Mbps) to deliver its data throughput.
    A T3 line can be divided or allocated over data, video, and voice, depending on
    a company''s needs. A T1 line provides enough speed for a small company that has
    a Web server that has more than 1500 hosts or 25,000 bits per month. The cost
    of a T1 line includes installation fees and a monthly fee that depends on the
    traffic (number of bits) that goes through the line. A T3 line costs more than
    a T1 line and can handle more traffic.


    # 1.14.2 Point-to-Point Dial-Up Connection


    All Internet dial-up connections via a modem and telephone line use the PPP (point-to-point)
    protocol. ISPs issue PPP accounts to their dial-up customers. Whether you configure
    the PPP connection yourself or through your ISP, it is beneficial to know the
    bases of the procedure.


    The PPP protocol enables the connection of two hosts, such as your PC and a Web
    server, over a direct link such as a telephone line. Your PC becomes a host on
    the network. The PPP protocol was introduced in 1992. It allows the user to specify
    the network protocol—that is, whether it is TCP/IP or something else. It can negotiate
    connection parameters and compression, and it can protect against transmission
    errors.


    You need a PPP account in order to be able to use a PPP connection. ISP provides
    you with the account and its information. The ISP also gives you a phone number,
    username, and a password. With this information, you can log into your service
    provider''s server. The'
