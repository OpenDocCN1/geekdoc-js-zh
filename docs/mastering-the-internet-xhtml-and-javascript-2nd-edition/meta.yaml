  md: '# Invisible Web


    +   - A user’s intelligent agent resides on the user’s computer and waits for
    service orders, or night.


    +   - A user can customize intelligent agents and adjust them to fit their preferences
    and wishes.


    +   - Intelligent agents are able to continuously scan the Internet for information.


    # 7.8 Invisible Web


    As we have discussed in Section 7.7, Web content takes the form of Web pages and
    online databases. This content is “visible” to us via our personal knowledge of
    Web pages or databases or via the use of search engines. As search engines cannot
    find every bit of content, we are bound to miss some content. The Invisible Web
    is what we see in the search results from search engines, or the subject directories.
    The Invisible Web (also known as the Deep Web) is the hidden Web content. The
    Invisible Web includes the Web pages that are excluded from search engines results
    by policy or because spiders cannot access them. The size of the Invisible Web
    is estimated to be an order of magnitude bigger than the Invisible Web.


    Some search engines exclude Web pages from their searches because the format of
    these pages becomes problematic for their spiders. Search engines are optimized
    for XHTML-format. Other types of programming language contain codes and formats
    that are incompatible with XML. Moreover, pages formatted in, for example, PDF,
    Microsoft Word, and PowerPoint use no HTML at all; others use it, if any, HTML
    text. Search engines, such as Google, have solved this formatting problem.


    Search engines cannot index information that is locked within specialized databases,
    again because their spiders cannot actually type or think. Spiders find Web pages
    by following links on other Web pages. Specialized databases, such as library
    catalogs, do not require a password to be invisible.


    There are techniques for searching the Invisible Web. Much of the invisible material
    and content is hidden in directories and databases. The techniques are described
    as follows:


    +   - Directories. Some websites provide Invisible Web catalogs. An Invisiblecatalog
    is a directory that includes content which will be missed by search engines. The
    Yahoo! directory is the best example. Other websites have directories with Invisible
    Web catalogs, such as Lycos.


    +   - Invisible databases allow users to search for invisible content. Lycos has
    an invisible database at http://www.freepint.com/gary/direct.html). Others include
    Direct Search (http://www.invisibleweb.com), Internet (http://www.internet.com),
    the CompletePlanet (http://www-completeplanet.com), and IncyWincy (http://incywincy.com).
    (See the forthcoming search captures).


    +   - Search engines. Two of the search engines listed in Section 7.4 that search
    the Invisible Web are Google and AllTheWeb.'
