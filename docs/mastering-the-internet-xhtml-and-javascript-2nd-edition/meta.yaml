    # FAQs


    Mailing Lists (Section 5.2)


    +   Q: Will subscribing to a mailing list cause me to receive an increased amount
    of span


    +   A: Mailing-list servers install spam filters to shield their lists members
    from spam and unsolicited bulk e-mail.


    +   Q: Can I send an HTML e-mail message to a mailing list?


    +   A: List servers as LISTSERV support both XHTML and text formats. However,
    plain text is recommended.


    Usenet Newgroups (Section 5.4)


    +   Q: What port number do NNTP servers?


    +   A: The standard default port number is 119.


    +   Q: Are there any public news servers I can use to configure my browser as
    a newsreader?


    +   A: There are few today. You have to search for them. The one we use in Example
    5.3 of this chapter is a German news server. To find others, use a Google searching
    the list of public nntp servers. Then try one at a time in Step 1 (Install a newsgroups)
    of Example 5.3 until you hit one that is alive. You cannot access news servers
    of organizations such as Yahoo! or Google.


