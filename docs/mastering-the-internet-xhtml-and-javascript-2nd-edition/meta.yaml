    # 3.15 Managing E-Mail


    Over time, mailboxes become cluttered with many forgotten messages. As a matter
    of fact, as the size of a mailbox increases, it becomes increasingly slow to access
    e-mail and switch from one e-mail folder to another. In addition, Inbox usually
    fills faster than a user can respond to all the messages. Managing e-mail is all
    about dealing with incoming and outgoing messages. Dealing with incoming messages
    includes organizing, responding effectively, deleting, archiving, and filtering
    spam, junk, and bulk mail. Dealing with outgoing messages includes creating electronic
    signatures, vCards, stationeries (templates), mailing lists, aliases, and address
    books.


    Respond to e-mail. Replying to messages can be hard at busy times. A user may
    label messages according to when to respond to them. We have shown e-mail clients
    label columns for messages.


    Delete e-mail. Highlight the message header and click the Delete button to delete
    the message. To completely remove it, open the Trash folder, highlight the message
    again, and click Delete.


    Archive e-mail. E-mail folders are themselves with names and extensions. Their
    names are what we see in e-mail clients and Web e-mail. E-mail programs let users
    import e-mail to other programs. But they generally do not let users export e-mail
    from an e-mail client. The only way to back up e-mail is to manually copy the
    files of e-mail folders to backup media such as CDs or floppy disks, or to another
    computer.


    Filtering. We are all familiar with junk mail, from either the post office or
    the Internet. We refer to junk e-mail as spam. Spam is unsolicited e-mail on the
    Internet. The sender considers it junk e-mail to a mailing list when signing up
    for free Internet services. Filtering is a technique that blocks incoming e-messages
    from certain domain names. E-mail programs divert messages received from these
    addresses into a special Spam folder to avoid cluttering the recipient''s Inbox
    folder.'
