- img_proc: false
  md: 'Boolean operators can also be expressed using math symbols. AND is represented
    by the "-" symbol. There is no symbol for OR. Search engines as Google require
    a space before the symbol. You can combine symbols in any way to control your
    search precisely—e.g., word +cup +soccer -last -year. This search string is to
    return Web pages that include the words world soccer, but do not include the words
    last year.


    Users can nest Boolean operators via the use of parentheses, for more search control.
    For example, the search winter AND (skiing OR hockey) returns Web pages that include
    winter, sports, and skiing or the words winter and hockey. It will not include
    Web pages that have all four words. Moreover, users can also mix the types of
    searches. For example, we can search for world environment NOT "harsh conditions".


    ![](bbox=[0.1, 0.355, 0.14, 0.375])


    # Example 7.3 Perform a Boolean search.


    Use Boolean operators to search for Web pages on golf sportswear and equipment.


    # Solution 7.3 Let us use these search strings: golf AND sportswear equipment-ment
    (as golf +sportswear +equipment) and golf AND sportswear NOT equipment (as golf
    +sportswear -equipment). The first search is expected to yield more hints than
    the second one, and it does. Use Google'' separately, type both search strings
    into its search field. Notice that the first search is the same as the all-words
    search golf sportswear and equipment. Both search strings produce the same number
    of hints. You can also use variations of the search string. For example, by using
    a nested string like golf AND (sportswear AND equipment).


    # 7.6.3 Other Searches


    There are other searches that search engines provide more control to their users.
    The title search allows users to search the titles of Web pages for more accurate
    results. A page title is the text that appears in the browser''s title file. If
    a Web page is properly designed, its title should be an accurate indication of
    its content, like a book title. The keyword to perform a title search depends
    on the search engine. Use title: for AltaVista, Inktomi, and Northern Light; normal.title:
    for AllWeb and Lycos; and intitle: or intitle: for Google. For example, type:solar
    system in the search field of the AltaVista search engine, in order to search
    Web pages that have the words solar system in the title.


    The site search limits the search to a particular website or host. That is, the
    search returns only Web pages found in the specified website in the search. This
    is a useful feature if the search is to be specific. The host name can be full,
    in the format aaa.bbb.ttt, or a TLD such as edu, com. The keyword to perform a
    title search depends on the search engine. Use host: for AltaVista; for Excite,
    Google, and Yahoo!; url.host: for AllWeb; and domain: for Inktomi. For example,
    type host:mars.jpl.nasa.gov'
