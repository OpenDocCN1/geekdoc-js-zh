  md: '# 148


    # Chapter 4 • Instant Messaging


    Scrolling and lurking are two issues related to chatting. Scrolling is monopolizing
    and disabling a conversation by repeatedly typing the same message or phrase.
    Scrolling is against chatting protocol. Lurking is a silent participant during
    a chat, by just reading messages. A user who is lurking does not take an active
    part in the discussion. Lurking is an accepted practice. There are often lurkers
    in any chat room, and new people to a particular chat are advised to become familiar
    with the discussion.


    # 4.2.1 Bulletin Board System


    Two chatting systems exist: the bulletin board system (BBS: also known as message
    boards) and Internet relay (IRC). We cover IRC in Section 4.2.2. The BBS, the
    older of the two, were created in 1978. A BBS is a computer application dedicated
    to exchanging messages and files on a network. The BBS was the primary kind of
    online communication throughout the 1980s. Today’s BBS systems are Web, replacing
    the text-based user interface of the 1980s. A Web-based BBS is essentially a website
    that is powered by BBS software rather than a Web server.


    In the mid-1990s, membership to BBSs began to decrease as the graphics-oriented
    Web burst onto the scene and grabbed users attention. BBS systems are free to
    use. A user needs an account log in. The screen capture shown in Figure 4.1 shows
