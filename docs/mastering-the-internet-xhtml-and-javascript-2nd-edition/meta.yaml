    # 9.4 Authoring of Web Pages


    Assuming that our Web page design has been completed, we need to write (author)
    the HTML content that converts the design into a Web page (HTML document) that
    can be viewed within a browser. HTML is a descriptive markup language that describes,
    in a simple way, the formatting of content of Web pages. It uses special code,
    known as tags, that instructs Web browsers as how to display the page’s content.
    This feature allows designers and authors of Web pages to concentrate on content
    and structure and less on formatting and presentation.


    HTML evolved over time. It is a subset of Generalized Markup Language (SGML).
    HTML is defined by Document Type Definition (DTD) within SGML. SGML was developed
    in the 1960s by IBM to solve the problems of exchanging documents across hardware
    platforms. Thus, HTML is platform independent and easy to use. Factor contributes
    to its popularity.


    HTML has gone through some revisions, ending with version 4.01, which was released
    in 1999. The growth and popularity of the Web has far exceeded the limits of HTML
    and its intent. This factor forced many developers, especially the browser software
    companies such as Microsoft and Netscape, to add extensions to HTML that made
    it difficult to manage it as a standard. As a result, a new standard known as
    XML (eXtensible Markup Language) has evolved. One of the goals of XML is to enhance
    HTML, not replace it. In this, 2000,'
