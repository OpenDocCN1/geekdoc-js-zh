  md: '# FTP 231


    The third method of using FTP is via GUI-based stand-alone FTP programs. You download
    and install an FTP client on your computer. The client connects to and communicates
    with an FTP server. The client provides all that you need in order to download
    and upload files. Some websites have an FTP site that you can access by replacing
    with ftp in the site''s URL—for example, http://ftp.microsoft.com.. Also, you
    must use FTP, not HTTP, protocol to access the FTP site. You need to be aware
    of the directory structure of the FTP site you want to connect to so that you
    can find the software you need to download.


    The fourth method of using FTP is through applications. For example, Dreamweaver
    allows its users to connect to a Web server via FTP to upload Web pages to the
    server. These applications hide the FTP procedure and commands from its users.


    Two kinds of FTP sites exist. An anonymous FTP site is a public site that requires
    a generic login (the same username, as anonymous, and password, such as anonymous,
    for everyone). A unanimous FTP site requires a specific login. FTP sites from
    which you download and share are anonymous sites. Anonymous FTP acts as the underpinning
    for free exchange of information on the Internet, it makes files available to
    anyone who wants them. Notice in the following set of list commands that you needed
    a username and password. In anonymous FTP, you use the word anonymous for username.
    The password could be guest, e-mail address, any password, or no password. The
    FTP host will tell you which username and password to use.


    Many FTP servers, particularly those for anonymous FTP, store files in compressed
    formats. An important fact about compressed files, in addition to their small
    sizes, is that they can contain multiple files. It is always a good idea to unpack
    a compressed file in a new directory. Unpacking (unzipping) compressed files requires
    specific programs. The Unix programs for compressing and decompressing files are
    compress and undecompress, respectively. Other programs are gzip, gunzip, zip,
    and unzip. The program WinZip does both compressing and decompressing, with .zip
    as the file type (extension).


    ![](bbox=[0.029, 0.663, 0.105, 0.678])


