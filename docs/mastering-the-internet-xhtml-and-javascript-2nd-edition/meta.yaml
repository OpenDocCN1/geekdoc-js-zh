  md: '24


    Chapter 1 • Overview of the Internet


    #  1.15 Types of Modems


    Different types of modems. What most people refer to as just "a modem" is analog
    modem. In this book, when we say a modem, we mean an analog modem. A modem is
    a device that is used to transfer data from one location to another through phone
    lines. On the ending end, the modem converts the data into sound (analog) waves
    that can be transmitted through the phone lines. Thus, the modem acts as a modulator.
    On the receiving end, the modem performs the opposite operation: it converts the
    sound back to data. Here, the modem acts as a demodulator. The modem name originates
    from the words "modulator" and "demodulator."


    The battle for dial-up connections has resulted in many technologies and ways
    to access the Internet, but it is a list of the available modems for dial-users:


    +   1. Telephone (analog) modems. This is the most common and cheapest way to
    connect to the Internet, but it is also the slowest. The fastest modem today is
    56K; as is, the modem can transmit 56,000 bits of data per second. Slower modem
    speeds, such as 28.8K and 14.4K, also exist. The slower the modem speed, the longer
    it takes to download Web pages. Most home PCs with a 56K modem. All 56K modems
    use the ITU V.90 analog modem standard.


    +   2. Cable modems. Cable-television wires, using coaxial cables, can be adapted
    to transfer data at access speeds as high as 10 Mbps. Cable companies charge installation
    fees for with cable cables, the cable company becomes their ISP. Users who are
    interested in utilizing cable modems should check with their local cable companies
    to make sure the service exists in their area or neighborhood. Cable companies
    share the bandwidth with many users; thus, ISPs offer cable connections unless
    prohibit running a server. DSL providers (see the next item) do.


    +   3. DSL and ADSL modems. Digital subscriber line (DSL) and asynchronous DSL
    (ADSL) are technologies that allow Internet users to tap into the Internet over
    an ordinary line, with speeds significantly faster than those of the V.90 modems.
    DSL modems take an electronic signal and splits it into a single phone wire that
    can transmit voice (regular phone calls) and data (Internet) simultaneously. A
    DSL modem uses the same speed for both downloading and uploading. ADSL modems
    allow faster downloads than uploads. Use of DSL and ADSL modems enables one member
    to chat on the phone or download a file while another member in the same house
    is surfing the Web, using the same phone line. Speeds of DSL and ADSL modems range
    from 144 Kps to 1.5Mb per second, with plans for 7.1 Mbps in the works. DSL works
    best when the modem is close to the origin of the phone line and suffers greatly
    with decreasing line quality and increasing distance.


    +   4. ISDN (digital) modems. ISDN (integrated services digital network) modems
    transmit data, voice, and video over ordinary telephone lines. Transmission speed
    is up to 128 Kbps. An ISDN line is a digital line. It uses twisted-pair copper
    wires. The monthly fee for an ISDN line depends on its speed and use.'
  merge: -1
