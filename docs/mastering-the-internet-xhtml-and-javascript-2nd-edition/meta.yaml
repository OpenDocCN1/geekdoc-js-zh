    # 1.5 Client/Server Diagnostic Commands


    There are many operating-level (OS-level) commands that a client can use to probe
    communication with a server. These commands are supported by many OS such as Windows
    and Unix. We cover three commands in this section: finger, ping, and traceroute.
    Refer to Tutorial 1.17.1 for an exercise in their use. We cover the nslookup command
    in Section 1.8.


    The finger command allows you to find out who is currently logged into a guest
    host or whether a particular user is logged in. To finger a host, use the command
    finger hostname—example, finger neu.edu, for which the result would be a list
    of users currently logged into the .edu host. To finger a particular user, use
    the command finger username@hostname—example, finger zeid@coe.edu. If the user
    is logged in, you will receive back the login name, the last name, and the logging
    time of the user. You need to realize that some computers may reject the finger
    command, for security reasons.


    The ping command allows a to check whether a server is up and running. The general
    command syntax is ping hostname—example, ping neu.edu. The command returns whether
    the host is up or down. This is useful to help you connect to a host.


    The traceroute (Unix) and tracert (Windows) commands trace the route that data
    take from a client to a server. The general command syntax is traceroute—example,
    traceroute www.mit.edu. The route is measured in time of hops. A hop is the trip
    that takes from one router to another. Alternatively, a hop is an intermediate
    network node that data pass through. The command also calculates and displays
    the amount of time each hop takes. Traceroute is useful in debugging network problems,
    especially with determining where they are.


    There are computer programs that include finger, ping, traceroute, and other diagnostic
    commands. Interested readers can search for Internet sites from which they may
    download and install one of these programs. To do so, go to a search engine and
    enter the "ping and trace tools". Examples of the programs include NetMaps and
    CyberKit.'
