  md: '# 3.4 Content, Attachments, and Etiquette


    Similar to a paper memorandum (memo), an e-mail message has four parts: (content),
    a signature, and attachments. Figure 3.3 shows the structure of an e-mail message.
    The header section includes four headers: From, To, Subject, and Date. E-mail
    programs provide a “compose” window, where the sender can fill in the To (recipient’s
    e-mail address) and Subject (subject line, which usually states the reason for
    sending the message) headers. The program adds the From (the sender’s e-mail address)
    and the Date (the time stamp, shows the date and time that the message was sent).
    It also provides a space for the message body. After writing the message content,
    the sender signs the message (i.e., his or her name after the content) and sends
    it off to the recipient. An e-mail message must have at least one header filled
    with the e-mail address of the intended recipient, to be delivered. If this e-mail
    address is the only information provided, then sending the message is equivalent
    to sending someone a blank piece of paper through the mail.


    An e-mail message is usually short, informal, timely, and addresses a single topic.
    It can be a new message or a reply to a previous message. The body of the message
    can be plain or formatted text. Users can use XHTML to format a message body as
    a Web page. The “compose” window of an XHTML-enabled e-mail program provides formatting
    menus and buttons similar to those of word processors. The program also preserves
    a URL included in a message body. The message’s recipient clicks the URL to view
    the corresponding Web page, instead of copying and pasting it into a browser’s
    URL toolbar.


    The body of an e-mail message may contain an e-thread. An e-mail thread is a sequence
    of related e-mail messages on a particular topic. The sequence begins with a new
    (first) message. All the other messages in the thread are responses to each other.
    It is recommended to


    ![](bbox=[0.368, 0.125, 0.713, 0.403])'
  merge: -1
  pgno: 123
- img_proc: false
  md: '# Content, Attachments, and Etiquette


    ![](bbox=[0.029, 0.103, 0.871, 0.526])


    Figure 3.3 Structure of an e-mail message.


    include the body of the message to which you are responding as part of your response.
    This helps the recipient understand your intentions and what you mean when you
    respond with for example, "OK, that is fine. I''ll meet you there." If the thread
    is long, the message body will be long, too. E-mail threads are typically separate
    exchanges.

    Files (documents) can be added to e-mail messages. An attachment is some data
    that accompany the body of a message, in the form of a file. The MIME protocol
    allows the exchange of any file. At the sending end, MIME encodes (converts) both
    the file and the message body into a plain-text (only characters) continuous string,
    so that an e-mail program can send it to its recipient. MIME uses a format known
    as Base64 to encode messages and their attachments. At the receiving end, MIME
    decodes the plain-text string back into the original file and the message body.
    The recipient can then save or open the attachment.

    Attachments pose a security problem. Almost all computer viruses are spread through
    e-mail attachments. Users run malicious programs unintentionally through attachments.
    The general rule is to be safe rather than sorry. This means that users should
    not open any attachments from unknown sources, no matter how tempting it is.

