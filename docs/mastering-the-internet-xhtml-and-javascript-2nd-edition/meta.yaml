    to save the URL of a particular page as a bookmark in order for the user to be
    able to quickly locate it later. The user may assign a meaningful name to a bookmark,
    such as "my bank account." Bookmarks created in one browser are not visible in
    another browser on the same machine, or in any browser on another machine. For
    example, IE bookmarks cannot be shared with Netscape on the same computer. Some
    websites solve this by allowing users to save their bookmarks independently of
    a browser or a machine. Thus, the user can use them anytime.


