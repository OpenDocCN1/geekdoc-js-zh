  md: 'FAQs


    # FAQs


    # General


    Q:What is ICQ?

    A:ICQ stands for "I seek you." It is an instant messenger, like the others discussed
    in this chapter. It can be used as a client or as a Web-based application. Visit
    http://www.icq.com to learn more.


    Q:What is the difference between a buddy, friend, and a contact in IM?

    A:Nothing. They all refer to a person with whom you do IMing. AIM, YM, and MSNM
    use the term buddy, friend, and contact, respectively, to refer to that person.


    # AIM (Section 4.4)


    Q:How can I change my chatting profile on AIM?

    A:You need to edit your profile. Click My AIM (menu on the AIM Buddy List Window)
    => Edit Profile => Follow the prompts and fill in the required information.


    Q:Why is my message not sent even though I set it up?

    A:Because it is not enabled. Click this sequence to enable it: My AIM => Edit
    Options => Edit Preferences => Away Message => Select (check) the Auto respond
    and insert in profile radio button.


    Q:Can I sign on using two different names on one computer at the same time?

    A:No, aim would not know how to distribute the incoming messages.


    Q:How can I create an away message?

    A:Click this sequence: My AIM (menu on the Buddy List Window) => Away Message
    => New Message => Type the message in the window that pops up => I''m Away (button
    on window). This command operates the Default Away window. This window (the screen
    capture on page) will show your message and the messages you have received while
    you were away. It also has the I''m Back button, which you should click when you
    want to go back online.


    ![](bbox=[0.305, 0.762, 0.613, 0.931])'
  merge: -1
  pgno: 194
- img_proc: false
  md: '# 170 Chapter 4 • Instant Messaging


    G:How do I save an IMing session?

    A:Click File (menu on the Instant Message window) => Save => Choose a folder to
    save it in, and type a filename for it => Save. The IMing session is saved as
    a Web page that can be opened in a browser for viewing. YM and MSNM do not provide
    this functionality.


    # Yahoo! Messenger (Section 4.5)


    Q:What is “buzzing a friend” in YM, and why would one use it?

    A:This is a way of getting your friend''s attention while IMing. Bring the YM
    window into the foreground on your computer, hold down the CTRL key, and press
    the G key. Your friend''s YM windows will make a “ding dong” sound and vibrate.
    Your friend will also see the word BUZZ in or her IM window, to let him or her
    know that an alert was received.


    Q:Can I send offline messages to my friends?

    A:Yes. If they are not online, YM still receive messages. The offline messages
    you send them will popup automatically when they connect to the Internet.


    Q:Can I add my own image as a YM IMvironment?

    A:No. You can only use the images that come with YM; however YM provides numerous
    images. Click this to see all of: IMEnvironment (button on the YM Instant Message
    window) => See All IMEnvironments => Browse through all the folders.


    # MS Messenger (Section 4.6)


    Q:How do I manage contacts in MS Messenger?

    A:Click Tools (on the MS Messenger menu bar) => Manage Contacts => Select a contact
    to delete, or view contacts’ profile properties.


    Q:How do I create a group?

    A:Click Tools (on the MS Messenger menu bar) => Manage Groups => Add, delete,
    or rename a group.


