    # 8.4 Telnet


    FTP provides a way to obtain files. Telnet, on the other hand, provides a way
    to access services from remote hosts or servers. Telnet allows you to log into
    a remote computer and it. You may use a valid user and account on that computer.
    When you telnet from a remote location, you are prompted for your username and
    password. Once logged in, you can use your account to check e-mail, run programs,
    save files, and so forth.


    Telnet is a client/server application. You must run a client program on the local
    computer in order to start a Telnet session and communicate with a Telnet server.
    Telnet programs can be bundled with OSs or be stand-alone. Windows, for example,
    has a built-in Telnet program. Some stand-alone programs also provide Telnet support.


    Multistage Telnet is sometimes. Here, you telnet from one host to another and
    from that host to yet another, to make connections that otherwise would be impossible.
    For example, you may be able to connect to host only via another host, or you
    may have to connect to a host in order to get access to high-speed mediums.


    Multistage Telnet happens when you use multiple copies of the Telnet program to
    access more than one remote host simultaneously. This is different from multistage
    Telnet. Multistage Telnet is like doing multiple tasks at the same time—for example,
    telnet to a library to run a search and while the search is in progress, start
    another Telnet session to the National Weather Center to check the weather. You
    can switch back and forth between the sessions.


    Anonymous Telnet is available, although it is not as popular as anonymous FTP.
    Internet hosts will let you log in to use Telnet without requiring you to have
    an individual account.


    Telnet requires a set of commands to start, manage, and end sessions. Once you
    are logged into an account, use the system-level commands to deal with files,
    or use applications commands to run programs. For example, you can telnet from
    home to compile a computer program on your computer at school that you forgot
    to bring home for the weekend.


