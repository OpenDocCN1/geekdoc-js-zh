    # 4.2.2 Internet Relay Chat


    An IRC network is a communication system, based on BBS technology, that enables
    forums for discussion and real-time chatting, putting a virtual meeting place
    where people from all over the world can meet and talk. The BBS initially allowed
    users to post only simple text sages. It was limited. IRC began to develop in
    1988. IRC is very popular today, especially among Unix users. It is also available
    on Windows, Mac, and Linux OSs. The darker side of IRC is that its servers have
    become a haven for computer hackers with malicious intent.


    There are thousands of IRC servers available for users to connect to. Examples
    include http://www.efnet.org, http://www.undert.org, and http://www.irc-net.org.
    Any search engine will turn up many other IRC servers. A user who wishes to communicate
    with any of these server must download and install an IRC client. mIRC is a simple
    client for Windows and IRCle for MAC (http://www.ircle.com) and 2 for Unix (http://www.funet.fi/pub/unix/server).
    The most common default port for IRC servers is 6667. The IRC protocol uses the
    TCP protocol.


    To utilize an IRC network, a user needs an IRC client, an IRC server to connect
    to, and a channel to join. A channel is a chat room. An IRC network typically
    has many users, servers, and channels; it is a multiuser and multichannel chat
    system. The user can start a new channel or join an existing one. The user also
    needs a login name and password to join a channel, as well as a chat nickname.


    ![](bbox=[0.029, 0.655, 0.145, 0.672])


