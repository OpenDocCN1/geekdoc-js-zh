  md: '# Chapter 6 • Security and Privacy


    fraud? Consumers have little to fear. Most credit card companies reimburse cardholders
    for fraudulent transactions and write them off as a business loss.


    Internet investment scams offer another prime example of Internet fraud. Investment
    news, whether true or false, can spread rapidly by posting messages on online
    bulletin boards, discussing investment opportunities in chat rooms, or messaging
    on e-mails. It is easy for fraudsters to make their messages look real and creditable.
    Further, online investment newsletters may offer false or wrong information or
    make false claims.


    Investment frauds usually fit one of four categories. The pump-and-dump scam sends
    investors urging to buy or sell a company''s stock quickly. Often, the scam perpetrators
    claim to have information from reliable sources. After the fraudsters make their
    money and the news fades away, innocent investors lose money.


    The pyramid scheme is all about making big money from home by working only a few
    weeks. The online pyramid scheme is an electronic version of the classic pyramid
    scheme, where people make money by recruiting others.


    The risk-free fraud claims to offer exciting low-risk investment opportunities
    in projects and areas such as bank securities. The conventional wisdom holds:
    If the deal seems too good to be true, then it is.


    The offshore fraud capitalizes on investors'' lack of knowledge of other countries
    and their economic systems, as well as currency fluctuations, to convince investors
    that there are great money-making opportunities waiting for them.


    The government and its agencies are tirelessly trying to protect citizens from
    falling victim to fraud and scams. The Internet Fraud Complaint Center (IFCC),
    with the FBI, has the mission of addressing fraud committed over the Internet.
    Victims of Internet fraud can report and alert authorities of suspected activities.
    The IFCC website is http://www.ifccfb.gov. Another center is the Internet National
    Fraud Information Center; its website is http://www.fraud.org. A third service
    is the Fraud Bureau (FB), which alerts online consumers about online vendors,
    auctions websites, and investment firms. The FB''s website is http://www.fraudbureau.com.


    # 6.3 Crackers


    Crackers are malicious hackers who attack websites and render them dysfunctional,
    resulting in what is known as denial-of-service attacks, such as the attacks that
    Yahoo!, CNN, and other major websites in previous years. The motivations behind
    these attacks are personal satisfaction and social attention.


    Crackers sometimes use automated vulnerability scanners to probe networks in order
    to find holes in them that they can exploit to deplete the computing resources
    of the network. While the network computers are busy meeting the demands of the
    crackers, users cannot access the websites supported by the network. Crackers
    may use one less important network in order to launch and mount attacks on other,
    major, vital networks. A hole in a network usually leads to one or more routers
    that crackers can use.'
