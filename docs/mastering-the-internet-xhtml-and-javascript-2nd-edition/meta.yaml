    # ## 9.1 Introduction


    When surfers browse the Web, they are accessing and reading Web Pages and other
    pages that are linked to them. A surfer views a Web page as a URL and a display
    in a browser. A Web developer views the Web page as a document (file) that must
    be created according to authoring and development guidelines. A Web developer
    is the person who writes the code for a Web page. Web developers use HTML (HyperText
    Markup Language) or XHTML (eXtensible HTML) as the authoring language to write
    the code of the Web page that they save in the file. Web developers must learn
    the syntax of the language they are writing. The syntax is the set of rules or
    the grammar of writing code. Part II of this book, starting with this chapter,
    covers all the XHTML syntax.


    Web browsers render the HTML file and display its content. A browser has a built-in
    HTML-rendering engine or an interpreter that reads HTML code and converts it to
    the visual display in its window. An interpreter (parser) is a computer program
    that understands the syntax of the authoring language, executes it, and outputs
    the results to the browser window.


    # ## 9.2 Websites and Web Pages


    Authors and designers of Web pages generally, keep the pages short in order to
    avoid content clutter. More often than not, multiple Web pages are needed to provide
    all the intended content to Web surfers. The collection of these Web pages is
    known as a website. Websites have many'
