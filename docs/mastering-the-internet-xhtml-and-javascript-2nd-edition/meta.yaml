    # Chapter 3 • E-Mail Lists


    message as TCP packets, finds the IP address (via a DNS server) of Smith''s incoming
    mail server, adds the IP address to the TCP packets, and finally delivers them
    to Smith''s mailbox on Smith''s incoming mail server. Smith uses her e-mail client
    to receive and read her e-mail messages, including Jones''s, off incoming e-mail
    server. Smith may then send a reply to Jones.


    ISPs manage and maintain mail servers. An ISP issues each e-mail address to send
    mail and a username and a password to access his or her e-mail account (mailbox).
    Each mail server holds accounts for different users. ISPs usually provide two
    servers in order to handle heavy e-mail traffic: one for incoming mail and one
    for outgoing mail.


    How do outgoing and incoming mail servers handle e-mail messages? They both handle
    mail in a similar fashion to the post office mail system. The outgoing mail server
    sends e-mail messages as they come. If the recipient''s incoming mail server is
    down, the sender''s mail server holds the messages in the **queue** and tries
    to send them again. This holding process is known as **queuing** messages. The
    incoming mail server has a queue for the messages that it receives, from which
    it delivers the messages to the mailboxes of intended recipients. It also holds
    the messages in the mailboxes (Figure 3.1) until the recipients check their mail.


    A mailbox typically has multiple folders, including **Inbox**, **Draft**, and
    **Trash**. The **Inbox** folder receives and stores the incoming mail. The **Sent**
    folder holds copies of outgoing (already sent) mail messages. Users utilize the
    *Draft* folder to keep in progress messages that are not yet ready to be sent.
    The **Trash** folder keeps the messages to be deleted. A message requires two
    deletes in order to remove it completely from a mailbox. The first delete removes
    the message from its current folder, such as **Inbox**, **Sent**, or **Draft**.
    This delete actually does not delete the message; instead, it moves it to the
    Trash folder. The second delete truly deletes the message. The user must open
    the Trash folder, highlight the message, and delete it.


