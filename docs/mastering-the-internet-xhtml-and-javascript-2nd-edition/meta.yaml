  md: '# The Browsers


    # 2.4 The Internet Explorer (IE)


    Microsoft Internet Explorer (IE) is the major browser that Internet users employ
    to navigate the Web. Netscape Communicator comes in a distant second to IE. Both
    browsers offer similar functionality. Their windows'' look and feel similar. However,
    there have been debates and studies about the comparative performance, speed,
    and ease of use of these browsers.


    Downloading and installing a browser software is a straightforward process. Visit
    http://www.microsoft.com to download IE software. Look for the Downloads link
    and then follow the prompts. The version we cover in this chapter is IE 6.0. Double-click
    the downloaded file and follow the prompts to install IE on your computer.


    Visit http://www.netscape.com to download Netscape Communicator. Look for the
    Downloads link and then follow the prompts. Double-click the downloaded file and
    follow the prompts to install Communicator on your computer. Netscape is based
    on the Mozilla browser of The Mozilla Foundation (http://www.mozilla.org). Netscape
    has two distinct products: Netscape 4.8 and Netscape 7.1. Netscape 4.8 is the
    older product. It does not support XML (Extensible Markup Language). XML is the
    metalanguage for which HTML is 6.0 and supports XML. Netscape 7.1 is the newer
    product. The newer Netscape originated with version XML. Some of the Netscape
    users prefer the older Netscape 4 product. We cover both Netscape 4.8 and 7.1.
    You can download Netscape 4.8 from the Netscape FTP at ftp://ftp.netscape.com/pub/communicator/english/4.8.
    Netscape''s website Downloads links directly to Netscape 7.1.


    Figures 2.2–4 illustrate the two browsers'' windows. The structure of each window
    and the use of each are covered in detail throughout this chapter. If IE has only
    one module, Communicator 4.8 consists of five modules: Navigator, Inbox, Newsgroups,
    Address Bar, and Composer. Figure 2.3 shows the icons for the five modules. The
    Navigator is the browser module, whose window is shown in Figure 2.3. The Inbox
    and Newsgroups modules enable users to access their e-mail and news messages,
    respectively. Users may employ the Address Bar to save e-mail addresses. The Composer
    is the Netscape HTML editor that is used to develop Web pages. This chapter covers
    the details of the Navigator only.


    Netscape 4.8 provides a Component bar that is docked at the bottom right corner
    of the browser window, as shown in Figure 2.3. The bar has five icons that provide
    access to the five modules. Clicking any of these icons opens the corresponding
    module. If, you use Netscape as your e-mail client, clicking the Inbox icon will
    open the Inbox window. Moving the mouse over each icon shows the icon''s name.
    You can expand the Component bar by clicking the icons at its left edge (as pointed
    out in Figure 2.3) and can expand the bar by dragging it to the desired location
    (“docked” at the bottom right corner by clicking the Close bar (x). If the user
    right-clicks on the title bar, a popup menu is displayed, as shown in Figure 2.3.
    The display of the bar can be changed by choosing any of the menu items. The expanded
    bar can be displayed horizontally or vertically.'
