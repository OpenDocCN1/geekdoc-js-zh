    In light of the foregoing information, the reader may ask two questions. How come
    search engines do not return good hits? And, why does the same search, using the
    same search string and keywords, produce different hits on different search engines?
    For the first question, search engines should not be the only factor to blame
    for the failure of a search. Other factors include how the authors of Web pages
    design their pages and (more importantly) how a surfer formulates a search. If
    the authors do not select the title and content of their pages carefully, search
    engines may miss them during a search. In addition, if the surfer is careless
    or vague in defining a search, search engines will return irrelevant.


    The answer to the second question comes from the fact that each search engine
    uses its own features to search the Web, and uses the title-frequency method only
    to a degree. First, some search engines index more Web pages than other search
    engines and update their index more often. This condition leads to different search
    engines having different databases to search through. A search engine may also
    give preference to more popular and heavily visited Web pages over others that
    are less popular, or may prefer Web pages reviewed by its own editors. There are
    many other features that search engines use to make themselves unique. Visit the
    website http://www.searchenginewatch.com for more detail.


    # 7.5 Metasearch Engines


    When it comes to building and developing search engines, there are two distinct
    approaches. The typical, straightforward approach is to develop an engine that
    searches the Internet. The other, approach, which is less obvious, but very interesting,
    is to build an engine that searches many other search engines at once for every
    search request—that is, performs a multilingual search. Search engines that use
    this latter approach are known as metasearch engines. A metasearch engine, therefore,
    expands an Internet search and makes it more convenient using multiple search
    engines. If a search engine is down for some reason, the metasearch engine automatically
    skips it. Metasearch engines do not own a database of Web pages; they send search
    strings to the databases maintained by other search engines. Examples of metasearch
    engines include http://www.dogpile.com, http://www.metacrawler.com, and http://www.profusion.com.


    # 7.6 Search Techniques


    Most surfers can find satisfactory search results by conducting a basic search
    using any search engine. A basic search implies that the user uses a string in
    the search field of the search engine. However, most search engines provide users
    with options (search techniques) to refine searches in order to get better search
    results. Users can find these options under the Advanced Search link located somewhere
    on the Web page of the search engine.'
  merge: -1
