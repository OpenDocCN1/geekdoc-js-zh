    A website''s privacy policy tells users what kind of information the site collects
    them, to whom it gives the information, and how the information is used. Users
    can view privacy policies of websites by using browsers such as IE. Browsers simplify
    the process of deciding whether and when users disclose personal information to
    websites. While there are standards (see Section 6.5) for describing privacy practices,
    there are no standards that Web sites must follow to set privacy rules.


    ![](bbox=[0.031, 0.296, 0.088, 0.313])


    # Example 6.1 Managing Web-server security.


    What are some of the best security practices?


    **Solution 6.1** Place the server in a firewall. Disallow all remote administration.
    Keep a log of all users'' activities. Remove all unused services. Remove unnecessary
    programs and files. Apply security patches as soon as they are announced. Scan
    the server periodically to look for vulnerabilities. Monitor connections to the
    server.


    ![](bbox=[0.031, 0.466, 0.088, 0.483])


    # Example 6.2 Security risks.


    What are the Web security risks that we should be aware of?


    **Solution 6.2** Hackers steal confidential documents from Web servers, execute
    commands on the server that allow them to modify and break into the system, launch
    denial-of-service attacks that render the machine temporarily unusable, crash
    users'' Web servers by using ActiveX, damage users'' systems, breach users'' privacy,
    or merely create an annoyance. **ActiveX** is a technology developed by Microsoft
    for distributing software over the Internet, similar to Java-Beans from Sunsystems.


    ![](bbox=[0.031, 0.676, 0.088, 0.693])


    # Example 6.3 Setting Web browsers'' security.


    Learn how set up the security level of Internet connections.


    **Solution 6.3** We covered this issue in Example 2.9, where we showed how to
    set the level of security with the four major browsers: IE, Netscape, Opera, and
    Crazy Browser.


    # 6.2 Fraud


    Internet fraud and cyberscams are not different from their traditional counterparts.
    The Internet is just another medium of practicing these unlawful activities. Credit
    card fraud is a widely known problem. Online credit card fraud occurs online retailers
    do not check on buyers history. Fraud cases are likely to be detected weeks after
    they have occurred, when cardholders receive their monthly account statements.
    Who pays for the damage resulting from'
