    If, for some reason, the SMTP server cannot send a message on the first attempt,
    the message goes into a queue. The server will periodically try to resend the
    messages in its queue, every 15 minutes. After a few hours, it sends a message
    to the sender informing him or her of the problems it is experiencing. After,
    for example, five days, the server returns the message to the sender undelivered.


