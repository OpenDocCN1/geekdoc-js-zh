- md: "\n## 49. Make a program that reads three grades from a student and reports\
    \ whether he passed (final grade greater than or equal to 7), failed (final grade\
    \ less than 4) or was in recovery (final grade between 4 and 7).\n\n```javascript\n\
    // Prompt the user for three grades\nconst grade1 = parseFloat(prompt(\"Enter\
    \ the first grade:\"));\nconst grade2 = parseFloat(prompt(\"Enter the second grade:\"\
    ));\nconst grade3 = parseFloat(prompt(\"Enter the third grade:\"));\n\n// Calculate\
    \ the average grade\nconst averageGrade = (grade1 + grade2 + grade3) / 3;\n\n\
    // Report the student's status based on the final grade\nif (averageGrade >= 7)\
    \ {\n    console.log(\"Student passed.\");\n} else if (averageGrade < 4) {\n \
    \   console.log(\"Student failed.\");\n} else {\n    console.log(\"Student is\
    \ in recovery.\");\n}\n```\n\n## 50. Write a program that asks for a person's\
    \ height and weight and calculates their body mass index (BMI), displaying the\
    \ corresponding category (underweight, normal weight, overweight, obese, severely\
    \ obese).\n\n```javascript\n// Prompt the user for their height in meters\nconst\
    \ height = parseFloat(prompt(\"Enter your height in meters:\"));\n\n// Prompt\
    \ the user for their weight in kilograms\nconst weight = parseFloat(prompt(\"\
    Enter your weight in kilograms:\"));\n\n// Calculate the BMI\nconst bmi = weight\
    \ / (height * height);\n\n// Determine the BMI category\nlet category;\nif (bmi\
    \ < 18.5) {\n  category = \"Underweight\";\n} else if (bmi < 24.9) {\n  category\
    \ = \"Normal weight\";\n} else if (bmi < 29.9) {\n  category = \"Overweight\"\
    ;\n} else if (bmi < 34.9) {\n  category = \"Obese\";\n} else {\n  category = \"\
    Severely obese\";\n}\n// Display the BMI and corresponding category\nconsole.log(`Your\
    \ BMI is: ${bmi.toFixed(2)} - ${category}`);\n```\n\n## 51. Write a program that\
    \ asks the user to enter their grade (0-100) and prints their letter grade (A\
    \ for 90-100, B for 80-89, C for 70-79, D for 60-69, F for under 60).\n\n```javascript\n\
    // Prompt the user to enter their grade\nconst grade = parseInt(prompt(\"Enter\
    \ your grade (0-100):\"));\n\n// Determine the letter grade based on the entered\
    \ grade\nlet letterGrade;\nif (grade >= 90 && grade <= 100) {\n  letterGrade =\
    \ 'A';\n} else if (grade >= 80 && grade <= 89) {\n  letterGrade = 'B';\n} else\
    \ if (grade >= 70 && grade <= 79) {\n  letterGrade = 'C';\n} else if (grade >=\
    \ 60 && grade <= 69) {\n  letterGrade = 'D';\n} else {\n  letterGrade = 'F';\n\
    }\n// Display the corresponding letter grade\nconsole.log(`Your letter grade is:\
    \ ${letterGrade}`);\n```\n\n## 52. Write a program that reads the values a, b\
    \ and c of a quadratic equation, and says if the roots of the function are real\
    \ or imaginary.\n\n```javascript\n// Prompt the user for coefficients of the quadratic\
    \ equation\nconst a = parseFloat(prompt(\"Enter the coefficient a:\"));\nconst\
    \ b = parseFloat(prompt(\"Enter the coefficient b:\"));\nconst c = parseFloat(prompt(\"\
    Enter the coefficient c:\"));\n\n// Calculate the discriminant\nconst discriminant\
    \ = b * b - 4 * a * c;\n\n// Determine if roots are real or imaginary based on\
    \ the discriminant\nif (discriminant > 0) {\n  console.log(\"The roots of the\
    \ quadratic equation are real.\");\n} else if (discriminant === 0) {\n  console.log(\"\
    The roots of the quadratic equation are real and equal.\");\n} else {\n  console.log(\"\
    The roots of the quadratic equation are imaginary.\");\n}\n```\n\n## 53. Create\
    \ a program that reads the price of a product. If the price is more than US $200,\
    \ the tax is 5%, if it is more than US$500, the tax is 7.5%. Products up to US\
    \ $200 do not pay taxes. Print the final price of the product on the screen.\n\
    \n```javascript\n// Prompt the user for the price of the product\nconst price\
    \ = parseFloat(prompt(\"Enter the price of the product:\"));\n\nlet finalPrice;\n\
    \n// Calculate the final price based on different tax rates\nif (price > 500)\
    \ {\n  finalPrice = price * 1.075; // 7.5% tax\n} else if (price > 200) {\n  finalPrice\
    \ = price * 1.05; // 5% tax\n} else {\n  finalPrice = price; // No tax for products\
    \ up to $200\n}\n\n// Display the final price of the product\nconsole.log(`The\
    \ final price of the product is: $${finalPrice.toFixed(2)}`);\n```\n\n## 54. Write\
    \ a program that reads a year (a four digit number) and checks whether it is a\
    \ leap year or not.\n\n```javascript\n// Prompt the user for a four-digit year\n\
    const year = parseInt(prompt(\"Enter a four-digit year:\"));\n\nlet isLeapYear\
    \ = false;\n\n// Check if the year is a leap year\nif ((year % 4 === 0 && year\
    \ % 100 != 0) || year % 400 === 0) {\n  isLeapYear = true;\n}\n\n// Display the\
    \ result\nif (isLeapYear) {\n  console.log(`${year} is a leap year.`);\n} else\
    \ {\n  console.log(`${year} is not a leap year.`);\n}\n```\n\n## 55. Input three\
    \ numbers representing the coefficients of a quadratic equation (a, b, c) and\
    \ finds its roots, also mention if they are real or complex\n\n```javascript\n\
    // Prompt the user for coefficients of the quadratic equation\nconst a = parseFloat(prompt(\"\
    Enter the coefficient a:\"));\nconst b = parseFloat(prompt(\"Enter the coefficient\
    \ b:\"));\nconst c = parseFloat(prompt(\"Enter the coefficient c:\"));\n\n// Calculate\
    \ the discriminant\nconst discriminant = b * b - 4 * a * c;\n\nlet root1, root2;\n\
    if (discriminant > 0) {\n  root1 = (-b + Math.sqrt(discriminant)) / (2 * a);\n\
    \  root2 = (-b - Math.sqrt(discriminant)) / (2 * a);\n  console.log(`Roots are\
    \ real and distinct: ${root1} and ${root2}`);\n} else if (discriminant === 0)\
    \ {\n  root1 = -b / (2 * a);\n  console.log(`Roots are real and equal: ${root1}`);\n\
    } else {\n  let realPart = -b / (2 * a);\n  let imaginaryPart = Math.sqrt(-discriminant)\
    \ / (2 * a);\n  console.log(`Roots are complex: ${realPart} + ${imaginaryPart}i\
    \ and ${realPart} - ${imaginaryPart}i`);\n}\n```\n\n## 56. Write a program that\
    \ prints the numbers 1 to 10 using a while loop.\n\n```javascript\nlet i = 1;\n\
    while (i <= 10) {\n  console.log(i);\n  i++;\n}\n```\n\n## 57. Write a program\
