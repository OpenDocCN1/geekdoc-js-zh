    \ 2\n\n```javascript\nconst input = prompt(\"Enter a list of integers separated\
    \ by spaces:\");\nconst integers = input.split(\" \").map(Number);\n\nconst k\
    \ = parseInt(prompt(\"Enter the value of k:\"));\n\n// Function to find kth smallest\
    \ element using quickselect algorithm\nfunction kthSmallest(arr, k) {\n  const\
    \ swap = (a, b) => {\n    const temp = arr[a];\n    arr[a] = arr[b];\n    arr[b]\
    \ = temp;\n  };\n\n  const partition = (left, right, pivotIndex) => {\n    const\
    \ pivot = arr[pivotIndex];\n    let i = left;\n\n    swap(pivotIndex, right);\n\
    \    for (let j = left; j < right; j++) {\n      if (arr[j] < pivot) {\n     \
    \   swap(i, j);\n        i++;\n      }\n    }\n    swap(i, right);\n    return\
    \ i;\n  };\n\n  const quickSelect = (left, right, kth) => {\n    if (left ===\
    \ right) return arr[left];\n\n    const pivotIndex = Math.floor(Math.random()\
    \ * (right - left + 1)) + left;\n    const partitionIndex = partition(left, right,\
    \ pivotIndex);\n\n    if (kth === partitionIndex) {\n      return arr[kth];\n\
    \    } else if (kth < partitionIndex) {\n      return quickSelect(left, partitionIndex\
    \ - 1, kth);\n    } else {\n      return quickSelect(partitionIndex + 1, right,\
    \ kth);\n    }\n  };\n\n  return quickSelect(0, arr.length - 1, k - 1);\n}\n\n\
    // Find kth smallest and largest elements\nconst kthSmallestElement = kthSmallest([...integers],\
    \ k);\nconst kthLargestElement = kthSmallest([...integers], integers.length -\
    \ k + 1);\nconsole.log(`The ${k}th smallest element in the array is: ${kthSmallestElement}`);\n\
