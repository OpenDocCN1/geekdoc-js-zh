    \ that prints the numbers 1 to 10 using a do-while loop.\n\n```javascript\nlet\
    \ i = 1;\ndo {\n  console.log(i);\n  i++;\n} while (i <= 10);\n```\n\n## 59. Write\
    \ a program that prints all even numbers from 1 to 100 using a while loop.\n\n\
    ```javascript\nlet i = 1;\nwhile (i <= 100) {\n  if (i % 2 === 0) {\n    console.log(i);\n\
