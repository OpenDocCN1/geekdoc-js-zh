  mdcn: "\n\n## 49. 编写一个程序，从学生处读取三个成绩，并报告其是及格（最终成绩大于等于 7）、不及格（最终成绩小于 4）还是处于恢复分（最终成绩在\
    \ 4 到 7 之间）。\n\n```javascript\n// 提示用户输入三个成绩\nconst grade1 = parseFloat(prompt(\"\
    输入第一个成绩:\"));\nconst grade2 = parseFloat(prompt(\"输入第二个成绩:\"));\nconst grade3\
    \ = parseFloat(prompt(\"输入第三个成绩:\"));\n\n// 计算平均分\nconst averageGrade = (grade1\
    \ + grade2 + grade3) / 3;\n\n// 根据最终成绩报告学生状态\nif (averageGrade >= 7) {\n    console.log(\"\
    学生及格了.\");\n} else if (averageGrade < 4) {\n    console.log(\"学生不及格.\");\n} else\
    \ {\n    console.log(\"学生处于恢复分阶段.\");\n}\n```\n\n## 50. 编写一个程序，询问用户的身高和体重，并计算其体质指数（BMI），显示相应的类别（体重过轻、正常、超重、肥胖、严重肥胖）。\n\
    \n```javascript\n// 提示用户输入以米为单位的身高\nconst height = parseFloat(prompt(\"输入你的身高（米）\"\
    ));\n\n// 提示用户输入以公斤为单位的体重\nconst weight = parseFloat(prompt(\"输入你的体重（公斤）\"));\n\
    \n// 计算 BMI\nconst bmi = weight / (height * height);\n\n// 确定 BMI 类别\nlet category;\n\
    if (bmi < 18.5) {\n  category = \"过轻\";\n} else if (bmi < 24.9) {\n  category\
    \ = \"正常\";\n} else if (bmi < 29.9) {\n  category = \"超重\";\n} else if (bmi <\
    \ 34.9) {\n  category = \"肥胖\";\n} else {\n  category = \"严重肥胖\";\n}\n// 显示 BMI\
    \ 和相应的类别\nconsole.log(`你的 BMI 是: ${bmi.toFixed(2)} - ${category}`);\n```\n\n##\
    \ 51. 编写一个程序，要求用户输入分数（0-100），并打印其字母等级（90-100 为 A，80-89 为 B，70-79 为 C，60-69 为 D，60\
    \ 分以下为 F）。\n\n```javascript\n// 提示用户输入分数\nconst grade = parseInt(prompt(\"输入你的分数\
    \ (0-100):\"));\n\n// 根据输入的数的确定字母等级\nlet letterGrade;\nif (grade >= 90 && grade\
    \ <= 100) {\n  letterGrade = 'A';\n} else if (grade >= 80 && grade <= 89) {\n\
    \  letterGrade = 'B';\n} else if (grade >= 70 && grade <= 79) {\n  letterGrade\
    \ = 'C';\n} else if (grade >= 60 && grade <= 69) {\n  letterGrade = 'D';\n} else\
    \ {\n  letterGrade = 'F';\n}\n// 显示对应的字母等级\nconsole.log(`你的字母等级是: ${letterGrade}`);\n\
    ```\n\n## 52. 编写一个程序，读取二次方程的系数 a、b 和 c，并判断函数的根是实数还是虚数。\n\n```javascript\n// 提示用户输入二次方程的系数\n\
    const a = parseFloat(prompt(\"输入系数 a:\"));\nconst b = parseFloat(prompt(\"输入系数\
    \ b:\"));\nconst c = parseFloat(prompt(\"输入系数 c:\"));\n\n// 计算判别式\nconst discriminant\
    \ = b * b - 4 * a * c;\n\n// 根据判别式判断根是实数还是虚\nif (discriminant > 0) {\n  console.log(\"\
    二次方程的根是实数.\");\n} else if (discriminant === 0) {\n  console.log(\"二次方程的根是实数且相等.\"\
    );\n} else {\n  console.log(\"二次方程的根是虚数.\");\n}\n```\n\n## 53. 创建一个程序读取产品价格。如果价格超过\
    \ 200 美元，税率为 5%；如果超过 500 美元，税率为 7.5%。200 美元及以下的产品不收税。在屏幕上打印该产品的最终价格。\n\n```javascript\n\
    // 提示用户输入产品价格\nconst price = parseFloat(prompt(\"输入产品价格:\"));\n\nlet finalPrice;\n\
    \n// 根据不同的税率计算最终价格\nif (price > 500) {\n  finalPrice = price * 1.075; // 7.5%\
    \ 税\n} else if (price > 200) {\n  finalPrice = price * 1.05; // 5% 税\n} else {\n\
    \  finalPrice = price; // 200 美元以下的产品不收税\n}\n\n// 显示产品的最终价格\nconsole.log(`产品的最终价格为:\
    \ $${finalPrice.toFixed(2)}`);\n```\n\n## 54. 编写一个程序读取年份（四位数字），并检查其是否为闰年。\n\n\
    ```javascript\n// 提示用户输入四位年份\nconst year = parseInt(prompt(\"输入四位年份:\"));\n\n\
    let isLeapYear = false;\n\n// 检查是否为闰年\nif ((year % 4 === 0 && year % 100 != 0)\
    \ || year % 400 === 0) {\n  isLeapYear = true;\n}\n\n// 显示结果\nif (isLeapYear)\
    \ {\n  console.log(`${year} 是闰年.`);\n} else {\n  console.log(`${year} 不是闰年.`);\n\
    }\n```\n\n## 55. 输入三个代表二次方程系数的数字 (a, b, c)，求它的根，同时说明它们是实数还是复数。\n\n```javascript\n\
    // 提示用户输入二次方程的系数\nconst a = parseFloat(prompt(\"输入系数 a:\"));\nconst b = parseFloat(prompt(\"\
    输入系数 b:\"));\nconst c = parseFloat(prompt(\"输入系数 c:\"));\n\n// 计算判别式\nconst discriminant\
    \ = b * b - 4 * a * c;\n\nlet root1, root2;\nif (discriminant > 0) {\n  root1\
    \ = (-b + Math.sqrt(discriminant)) / (2 * a);\n  root2 = (-b - Math.sqrt(discriminant))\
    \ / (2 * a);\n  console.log(`根是实数: ${root1}, ${root2}`);\n} else if (discriminant\
    \ === 0) {\n  root1 = -b / (2 * a);\n  console.log(`根是实数且相等: ${root1}`);\n} else\
    \ {\n  let realPart = -b / (2 * a);\n  let imaginaryPart = Math.sqrt(-discriminant)\
    \ / (2 * a);\n  console.log(`根是复数: ${realPart} + ${imaginaryPart}i 和 ${realPart}\
    \ - ${imaginaryPart}i`);\n}\n```\n\n"
