    \ isRawWord(word) {\n  let sum = 0;\n  for (let i = 0; i < word.length; i++) {\n\
    \    sum += calculateLetterValue(word[i]);\n  }\n  return isPrime(sum);\n}\n\n\
    const inputWord = prompt(\"Enter a word:\");\nif (isRawWord(inputWord)) {\n  console.log(`${inputWord}\
