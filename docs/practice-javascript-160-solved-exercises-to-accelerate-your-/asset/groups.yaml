- md: '

    # JS

    # PRACTICE

    # JAVASCRIPT

    # 160 solved

    # EXERCISES

    to accelerate your learning

    RUHAN CONCEIÇÃO


    ## PRACTICE JAVASCRIPT

    160 Solved Exercises to Accelerate your Learning

    Ruhan Avila da Conceição


    ## Preface


    Welcome to this book where solved and commented Javascript exercises are presented.
    In this book, you will find a collection of 160 exercises designed to help you
    improve your programming skills in this powerful language.


    Learning to program involves not only understanding theoretical concepts but also
    applying those concepts in real-life situations. That''s exactly what you will
    find in this book: a wide variety of problems ranging from basic fundamentals
    to more complex challenges.


    As you progress through the exercises, you will be challenged with tasks involving
    mathematical formula manipulation, strings, conditionals, loops, vector manipulation,
    matrices, and much more.


    The main goal of this book is to provide a practical and comprehensive resource
    for programmers seeking improvement. Whether you are a beginner in Javascript
    looking to solidify your knowledge or an experienced programmer wishing to deepen
    your expertise, these exercises will serve as an excellent study guide and reference.
    This book is also suitable for teachers who would like to have a rich collection
    of solved Programming Logic exercises to create exercises and questions for their
    students.


    Enjoy this learning journey and dive into the solved and commented Javascript
    exercises. Prepare yourself for stimulating challenges, creative solutions, and
    a unique opportunity to enhance your programming skills.


    This book was written using artificial intelligence tools in content creation,
    but all materials have been reviewed and edited by the author to deliver a final
    high-quality product.


    Happy reading, happy studying, and have fun exploring the fascinating world of
    Javascript programming.

    Ruhan Avila da Conceição.


    ## Summary


    - Introduction

    - Basic Exercises

    - Mathematical Formulas

    - Conditionals

    - Repeat Loops

    - Arrays

    - Strings

    - Matrices

    - Recursive Functions

    - Regular Expressions

    - Sorting Algorithms

    - Complete List of Exercises

    - Additional Content

    - About the Author


    ## Introduction


    If you have acquired this book, you want to start programming and be logically
    challenged as soon as possible, without wanting to read a sermon on the mount.
    But it is important to highlight a few things before we begin.


    Even though many exercises may be considered easy, if you are new to this programming
    journey, it is important for you to first try to solve the problem on your own
    before looking at the solution. There is more than one possible solution to the
    same problem, and you need to think and develop your own solution. Then, you can
    compare it with the proposed one in the book, identify the strengths of each,
    and try to learn a little more.


    If the exercise is too difficult and you can''t solve it, move on to the next
    one and try again the next day. Don''t immediately jump to the answer, even if
    you can''t solve it, and definitely don''t look at the answer without even attempting
    to solve it.


    Learning programming logic is not about getting the answer; it''s about the journey
    you take to arrive at the answer.


    With that being said, the remaining chapters of this book are divided according
    to the programming topics covered in the proposed exercises.


    From now on, it''s all up to you!


    ## Basic Exercises


    Before starting the exercises, it''s important to carefully read this. When a
    particular exercise requires user input, the **prompt** command will be used.
    However, please note that the **prompt-sync** package needs to be installed beforehand.
    To do this, initiate an npm project and install the package using the following
    steps:


    ```

    npm init

    ```


    ```

    npm install prompt-sync

    ```


    Additionally, you must add the following command in the first line in your code:


    ```

    prompt = require("prompt-sync")()

    ```


    - 1. Write a program that prints "Hello World!" on the screen.


    ```

    console.log("Hello World!");

    ```


    - 2. Write a program that prints "Hello" on one line and "World!" on the bottom
    line, using two different commands.


    ```

    console.log("Hello");

    ```

    ```

    console.log("World!");

    ```


    - 3. Write a program that prints "Hello" on one line and "World!" on the bottom
    line, using only one command to print.


    ```

    console.log("Hello\nWorld!");

    ```


    - 4. Write a program that prints "Hello" on one line and "World!" on the bottom
    line, leaving a blank line between the words.


    ```

    console.log("Hello");

    console.log(""); // Blank line

    console.log("World!");

    ```


    - 5. Write a program that prints "Hello World!" (in the same line) on the screen,
    using one command to print "Hello" and another command to print "World!".


    ```

    process.stdout.write("Hello ");

    process.stdout.write("World!");

    console.log(); // Add a newline to move to the next line

    ```


    To do this, you must run this command before: npm i --save-dev @types/node


    - 6. Write a program that prints "Hello World!" (in the same line) on the screen,
    using one command to print "Hello", another command to print "World", and another
    to print "!".


    ```

    process.stdout.write("Hello ");

    process.stdout.write("World");

    process.stdout.write("!");

    console.log(); // Add a newline to move to the next line

    ```


    - 7. Make a program that asks for the user''s name, and prints the name on the
    screen immediately after.


    // This command below will be omitted in next exercises


    ```

    prompt = require("prompt-sync")()


    const userName = prompt("Please enter your name:")

    console.log("Hello, " + userName + "!");

    ```


    - 8. Make a program that reads the names of three people in sequence, followed
    by their respective ages, and prints each name with their respective ages on the
    screen.


    // Read information for the first person


    ```

    const name1 = prompt("Enter the name of the first person:")

    const age1 = prompt("Enter the age of the first person:")

    ```


    ```

    // Read information for the second person

    const name2 = prompt("Enter the name of the second person:");

    const age2 = prompt("Enter the age of the second person:");

    ```


    ```

    // Read information for the third person

    const name3 = prompt("Enter the name of the third person:");

    const age3 = prompt("Enter the age of the third person:");

    ```


    ```

    // Print each person''s name and age

    console.log(name1 + " is " + age1 + " years old.");

    console.log(name2 + " is " + age2 + " years old.");

    console.log(name3 + " is " + age3 + " years old.");

    ```


    - 9. Make a program that reads the names of three people in sequence, followed
    by their respective ages and heights, and prints the data in table format on the
    screen.


    ```

    // Read information for the first person

    const name1 = prompt("Enter the name of the first person:");

    const age1 = prompt("Enter the age of the first person:");

    const height1 = prompt("Enter the height of the first person (in cm):");

    ```


    ```

    // Read information for the second person

    const name2 = prompt("Enter the name of the second person:");

    const age2 = prompt("Enter the age of the second person:");

    const height2 = prompt("Enter the height of the second person (in cm):");

    ```


    ```

    // Read information for the third person

    const name3 = prompt("Enter the name of the third person:");

    const age3 = prompt("Enter the age of the third person:");

    const height3 = prompt("Enter the height of the third person (in cm):");


    // Print the data in table format

    console.log("Name\t\Height(cm)");

    console.log(name1 + "\t" + age1 + "\t" + height1);

    console.log(name2 + "\t" + age2 + "\t" + height2);

    console.log(name3 + "\t" + age3 + "\t" + height3);

    ```


    - 10. Make a program that reads the names of three people in sequence, followed
    by reading their respective ages and heights, and prints the data on the screen
    in table format, using dashes (-) to separate rows and pipes (|) to separate columns.

    '
