  md: '# 29. Make a program that reads the resistance of two resistors and displays
    the resulting resistance value when connected in series, adding the values, and
    in parallel using the formula (R1 * R2) / (R1 + R2)


    ```

    // Prompt the user for the resistance value of the first resistor (R1)

    const resistance1 = parseFloat(prompt("Enter the resistance value of the first
    resistor (R1):"));


    // Prompt the user for the resistance value of the second resistor (R2)

    const resistance2 = parseFloat(prompt("Enter the resistance value of the second
    resistor (R2):"));


    // Calculate the equivalent resistance in series

    const seriesResistance = resistance1 + resistance2;


    // Calculate the equivalent resistance in parallel

    const parallelResistance = (resistance1 * resistance2) / (resistance1 + resistance2);


    // Display the results

    console.log("Equivalent resistance in series: " + seriesResistance.toFixed(2)
    + " ohms");

    console.log("Equivalent resistance in parallel: " + parallelResistance.toFixed(2)
    + " ohms");

    ```


