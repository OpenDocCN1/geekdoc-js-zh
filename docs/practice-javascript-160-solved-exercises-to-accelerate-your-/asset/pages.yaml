  md: "```\nconst k = parseInt(prompt(\"Enter the value of k:\"));\n\n// Function\
    \ to find kth smallest element using quickselect algorithm\nfunction kthSmallest(arr,\
    \ k) {\n  const swap = (a, b) => {\n    const temp = arr[a];\n    arr[a] = arr[b];\n\
    \    arr[b] = temp;\n  };\n\n  const partition = (left, right, pivotIndex) =>\
    \ {\n    const pivot = arr[pivotIndex];\n    let i = left;\n\n    swap(pivotIndex,\
    \ right);\n    for (let j = left; j < right; j++) {\n      if (arr[j] < pivot)\
    \ {\n        swap(i, j);\n        i++;\n      }\n    }\n    swap(i, right);\n\
    \    return i;\n  };\n  swap(i, right);\n  return i;\n};\n```"
