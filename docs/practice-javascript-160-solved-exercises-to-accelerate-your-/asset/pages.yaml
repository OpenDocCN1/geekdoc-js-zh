  md: '# 26. Write a program that calculates the n-th term of an arithmetic progression
    given the value of the first term, the common difference (ratio), and the value
    of n read from the user $\rightarrow a_n = a_1 + (n-1) \times r$


    ```

    // Prompt the user for the first term

    const firstTerm = parseFloat(prompt("Enter the first term (a) of the arithmetic
    progression:"));


    // Prompt the user for the common difference (d)

    const commonDifference = parseFloat(prompt("Enter the common difference (d):"));


    // Prompt the user for the value of n

    const n = parseInt(prompt("Enter the value of n:"));


    // Calculate the n-th term of the arithmetic progression

    const nthTerm = firstTerm + (n - 1) * commonDifference;


    // Display the result

    console.log("The " + n + "-th term of the arithmetic progression is: " + nthTerm);

    ```


