  md: 'recommended as it is considered a good programming practice.


    # Case Sensitivity


    JavaScript is sensitive to capitalization or case of the letters being used. For
    instance, I and i are two different identifiers for JavaScript. This holds true
    for any keyword, function name or variable name that you use. Anything you write
    in JavaScript must have a consistent case for it to be identifiable by JavaScript.


    # Writing Comments


    JavaScript identifies both C and C++ style of comments. The single line comments
    can be made by writing // at the beginning of the line. In this scenario, anything
    that is written between the characters and end of the line are treated as comments
    and ignored by JavaScript. The other type of comments supported by JavaScript
    is the multi-line comment. Such a comment begins with /* and ends with */. JavaScript
    ignores any character and number of lines that lie between these two sequences.


    Besides the above-mentioned, JavaScript also supports HTML style of commenting.
    However, it only recognizes <!-- and treats the characters following this character
    phrase till the end of the line as a single line comment. JavaScript does not
    recognize the HTML comment closing character sequence, -->. Therefore, as and
    when you require the use of this character phrase, you must precede it with //.
    In order to help you understand this in a better way, sample code has been given
    below.


    ```

    <script language="javascript" type="text/javascript">

    <!--

    // Single line comment.

    /* Multi-line comment

    Similar to the comments in C and C++ */

    -->

    </script>

    ```'
