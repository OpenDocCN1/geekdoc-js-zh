    \ text”（纯文本）。\n\n现在你已经创建了你的第一个 html 文件，请使用你所拥有的任何网络浏览器打开它，看着一个简单的文本字符串出现在你眼前！然而，请注意，你在文本编辑器中输入的内容（称为“源代码”）看起来和浏览器显示的内容一模一样；它没有\
    \ `<html>` 标签和其他东西。这是怎么回事呢？\n\n现在，尝试通过添加几个标签来更改你的 html 文件。它看起来应该像这样：\n\n```\n\
    <!DOCTYPE html>\n```\n\n```\n<html>\n<body>\n  Hi There!\n</body>\n</html>\n```\n\
    \n现在重新加载你的浏览器并看看发生了什么。\n你的浏览器没有故障；尽管源代码中添加了标签，网页看起来几乎完全一样。在这一点，你可能还没有完全理解为什么要使用标签，但不要担心；当你开始更多地进行\
    \ HTML 编程时，你就会看到它们的用途了。\n\n## 结论\n\n你刚刚对 HTML 进行了首次尝试——并不深入，只需足够的的基础知识来帮助你正确将\
    \ JavaScript 与 HTML 使用。如果你对学习更多 HTML 感兴趣，你会想要查看在线教程和参考，并查看其他网页开发者如何编写他们自己的网站代码。你可以通过右键点击网站并点击“查看页面源代码”（view\
    \ page source）或类似的操作来实现。如果你准备好投身 JavaScript 的世界，请前往。\n\n## 第 3 章 JavaScript 控制流语句\n\
    \n这种语言提供了一组紧凑的控制流语句，你可以将其添加到代码中。通常情况下，控制流语句会增强 JavaScript 程序的功能和交互性。本书的这一部分重点介绍控制流语句。\n\
    \n## 块语句 (The Block Statement)\n\n程序员认为这是 JavaScript 中最基本的语句。使用它来组合你的 JavaScript\
    \ 语句。在编写程序时，使用一对括号包裹块语句。\n\n```\n{\nstatement_1;\nstatement_2;\n.\nstatement_n;\n\
    }\n```\n\n下面的图片显示了块语句的语法：\n\n通常情况下，程序员使用块语句用于控制流语句（即用于 for, if, while 等）。这里有一个示例：\n\
    \n```\nwhile (y > 69) {\n  123;\n}\n```\n\n在给出的代码段中，“123;”充当了块语句。\n\n## 条件语句 (The\
    \ Conditional Statements)\n\n条件语句是一组在分配的条件为真时运行的命令。JavaScript 语言提供了两种条件语句：(1)\
    \ if... else 和 (2) switch。\n\n让我们详细讨论这些条件语句：\n\n### “if... else”语句\n通过此语句，只要分配的条件为真，你就可以运行命令。它包含一个“else”子句（可选）。“else”子句包含一个在分配的条件为假时运行的语句。\n\
    \n```\nif (condition) {\n  statement_1;\n} else {\n  statement_2;\n}\n```\n\n\
    基础“if... else”语句的语法是：\n\n由于你的条件必须是“真”或“假”，因此在编写条件语句时，必须使用布尔表达式。如果条件为真，则运行第一条语句；否则，运行第二条语句。\n\
    \nJavaScript 允许在条件语句中设置多个条件。你只需要在条件语句中组合多个“if”和“else”子句即可。以下是你必须使用的语法：\n\n```\n\
    if (condition_1) {\n  statement_1;\n} else if (condition_2) {\n  statement_2;\n\
    } else if (condition_n) {\n  statement_n;\n} else {\n  statement_last;\n}\n```\n\
    \n要运行多条语句，你必须将它们放在块语句内部（即 { ... }）。编程专家声称，利用块语句是最好的，特别是在组合语句时。\n\n```\nif (condition)\
    \ {\n  statement_1_runs_if_condition_is_true;\n  statement_2_runs_if_condition_is_true;\n\
    } else {\n  statement_3_runs_if_condition_is_false;\n  statement_4_runs_if_condition_is_false;\n\
    }\n```\n\n检查以下示例：\n\n如果可能，避免在你的条件表达式中使用简单赋值。这是因为在检查 JavaScript 代码时，简单赋值经常与等值判断混淆。例如，你不能在你的语句中添加以下代码：\n\
    \n```javascript\nif (a = b) {\n  /* sample_statement */\n}\n```\n\n如果你确实需要在你的条件表达式中使用简单赋值，请将其放在一对括号之间。这是一个示例：\n\
    \n```javascript\nif ((x = y)) {\n  /* sample_statement */\n}\n```\n\n### 假值 (The\
    \ Falsy Values)\n假值是指评估为假的值。以下是你在使用 JavaScript 时会遇到的假值：\n\n- null\n- false\n-\
    \ undefined\n- NaN\n- \"\"（即空字符串）\n\n未列出的任何值在条件语句中使用都会评估为真。\n\n### “Switch”语句\n\
    这种语句允许应用程序检查一个表达式并与预定义的一组情况进行比较。如果匹配，应用程序将运行分配的命令。这是基础 switch 语句的语法：\n\n```\n\
    switch (expression) {\n  case label_1:\n    statements_1;\n    break;\n  case\
    \ label_2:\n    statements_2;\n    break;\n  ...\n  default:\n    statements_def;\n\
    \    break;\n}\n```\n\n首先，应用程序将搜索与表达式值匹配的标签。然后，它将控制流传递给该特定的子句，执行分配的语句/语句。如果没有找到匹配，应用程序将检查默认子句（可选）并将控制流传递给该子句，运行分配的语句/语句。如果语句没有默认子句，应用程序将直接运行\
    \ switch 之后的语句。\n\n## 如何处理异常 (How to Handle Exceptions)\n\nJavaScript 允许你抛出和管理异常。为了执行这些操作，你必须使用以下语句：\n\
    \n- \"throw\"语句\n- \"try... catch\"语句\n\n## 异常的不同类型 (The Different Types of Exceptions)\n\
    \n在 JavaScript 中，你可以抛出任何类型的对象。然而，抛出的对象可能具有不同的特征。虽然通常抛出字符串\n"
