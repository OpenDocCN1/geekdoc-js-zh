    # Chapter 21 Values, Types, and Operators


    In the world of computers, there is data. You can create new data, read data and
    change data, which are all stored as a look-alike long succession of bits. Define
    bits as zeros and ones that take a strong or weak signal, high or low electrical
    charge from inside the computer. All data and pieces of information are described
    as a succession of zeros and ones and represented in bits.


    # Values


    Take a deep breath and think of an ocean of bits. The latest PCs contains more
    than 30 billion bits in its data storage. We use bits to create values. The computer
    can function correctly because every bit of information is split into values.
    Every value consists of a type that influences its role, and values can be numbers,
    text or functions, etc. To generate a value, you need to invoke its name, and
    it appears from where it was stored.


    # Arithmetic


    Arithmetic is the major thing to do with numbers. The multiplication, addition,
    and subtraction of more than one number to produce another number is an arithmetic
    operation. This is an example of what they look like JavaScript:


    ```javascript

    100 + 4 * 11

    ```


    The + and * symbols are called operators, the first means addition while the other
    means multiplication. An operator inserted between two values will produce another
    value. The - operator is for subtraction and the / operator is for the division.
    If operators show together without parentheses, the precedence of operators decides
    the way they are applied. If several operators with the same precedence show right
    next to each other like 1 - 2 + 1, apply them left to right: (1 - 2) + 1.


    # Special numbers


    JavaScript consists of three unique values that do not act like numbers but regarded
    as numbers. Infinity and -Infinity are the first two, which mean the positive
    and negative infinities, and the last value is the NaN. NaN says “not a number,”
    although it is a value of the number type.


    # Strings


    A string is a sequence of characters. A string is used to represent text. Strings
    are enclosed in single quotes, double quotes, or backticks.


    A string is immutable, meaning you cannot change its characters once it is created.
    However, you can create a new string with modified characters.


    ```javascript

    var str = "Hello world";

    console.log(str.length); // prints 11

    console.log(str.charAt(0)); // prints ''H''

    console.log(str.toUpperCase()); // prints "HELLO WORLD"

    console.log(str.toLowerCase()); // prints "hello world"

    ```


    Strings can also be concatenated using the + operator.


    ```javascript

    var firstName = "John";

    var lastName = "Doe";

    var fullName = firstName + " " + lastName;

    console.log(fullName); // prints "John Doe"

    ```


    There are many methods available to work with strings:


    ```javascript

    var text = "The quick brown fox jumps over the lazy dog";

    console.log(text.slice(0, 10)); // prints "The quick"

    console.log(text.includes("fox")); // prints true

    console.log(text.startsWith("The")); // prints true

    console.log(text.replace("fox", "cat")); // prints "The quick brown cat jumps
    over the lazy dog"

    ```


    # Template Literals


    Template literals are a modern way to create strings, allowing for variable interpolation
    and multiline strings. They use backticks.


    ```javascript

    var name = "Alice";

    var age = 25;

    var message = `Hello, ${name}, you are ${age} years old.`;

    console.log(message); // prints "Hello Alice, you are 25 years old."

    ```


    # Numbers


    JavaScript has a single type for numbers, which represents both integers and floating-point
    numbers.


    ```javascript

    var int = 42;

    var float = 3.14;

    var scientific = 2e3; // 2000

    ```


    There are also special numeric values:


    - `Infinity`: positive infinity.

    - `-Infinity`: negative infinity.

    - `NaN`: "Not a Number", represents the result of an undefined mathematical operation.


    ```javascript

    console.log(Infinity); // Infinity

    console.log(NaN); // prints NaN

    ```


    # String Comparison


    Strings can be compared using comparison operators like <, >, <=, >=. Note that
    string comparison is case-sensitive.


    ```javascript

    console.log("apple" < "banana"); // true

    console.log("Apple" < "apple"); // false

    ```


    # Operators


    Operators are used to perform operations on variables and values.


    ## Arithmetic Operators


    - `+`: Addition

    - `-`: Subtraction

    - `*`: Multiplication

    - `/`: Division

    - `%`: Modulo (remainder)

    - `**`: Exponentiation

    - `++`: Increment

    - `--`: Decrement


    ## Assignment Operators


    - `=`: Assignment

    - `+=`: Addition and assignment

    - `-=`: Subtraction and assignment

    - `*=`: Multiplication and assignment

    - `/=`: Division and assignment


    ## Comparison Operators


    - `==`: Loose equality (type coercion)

    - `===`: Strict equality (value and type check)

    - `!=`: Loose inequality

    - `!==`: Strict inequality

    - `<`: Less than

    - `<=`: Less than or equal

    - `>`: Greater than

    - `>=`: Greater than or equal


    ## Logical Operators


    - `&&`: AND

    - `||`: OR

    - `!`: NOT


    ## Operators


    - `&`: Bitwise AND

    - `|`: Bitwise OR

    - `^`: Bitwise XOR

    - `~`: Bitwise NOT

    - `<<`: Left bit shift

    - `>>`: Right bit shift


    # Ternary Operator


    The ternary operator is the only operator in JavaScript that takes three operands.
    It is a shorthand for an if-else statement.


    Syntax: `condition ? expressionIfTrue : expressionIfFalse;`


    ```javascript

    var age = 20;

    var status = (age >= 18) ? "Adult" : "Minor";

    console.log(status); // prints "Adult"

    ```


    # Type Checking


    The `typeof` operator is used to determine the data type of an unevaluated operand.


    | Expression | `typeof` | Description |

    | :--- | :--- | :--- |

    | `42` | `"number"` | Numeric value |

    | `"Hello"` | `"string"` | String value |

    | `true` | `"boolean"` | Boolean value |

    | `undefined` | `"undefined"` | Undefined variable |

    | `null` | `"object"` | Object (a known bug in JS) |

    | `}` | `"object"` | Object literal |

    | `[]` | `"object"` | Array literal |

    | `function(){}` | `"function"` | Function |


    # Instanceof


    The `instanceof` operator is used to check if an object is an instance of some
    class declaration.


    ```javascript

    var date = new Date();

    console.log(date instanceof Date); // true

    console.log(date instanceof Array); // false

    ```


    # Coercion


    Type coercion is the automatic or implicit conversion of values from one type
    to another.


    ```javascript

    console.log("5" + 2); // "52" (string coercion)

    console.log("5" - 2); // 3 (number coercion)

    console.log(true == 1); // true (boolean to number coercion)

    ```

