    # Assignment Operators


    The standard assignment operator (=) has the following form,

    lval = expression;

    where the left operand, lval, is assigned the value of the right operand,

    expression. For example:


    x = 2 * y + z + 5;


    Like the operand of the ++ or -- operator explained previously, the left operand
    of the assignment operator must be an lvalue—that is, an expression that specifies
    a data item whose value can be changed, such as a variable. (You''ll learn about
    two other kinds of lvalues later in the book: a property of an object and an element
    of an array.)


    The assignment operator is an example of an operator that has an important side
    effect (namely, making the assignment). Like all operators, it also returns a
    value, which is simply the value of the right operand. This method of evaluation,
    coupled with the operator''s right-to-left associativity), allows you to chain
    assignments like this:


    a = b = c = 5;


    When JavaScript evaluates this expression, it first assigns 5 to c, then takes
    the value of that assignment (namely 5) and assigns it to b, then takes the value
    of that assignment (5 again) and assigns it to a. As a result, variables get set
    to 5.


    JavaScript also provides a set of shortcut operators that perform an operation
    and make an assignment. Here are the most common ones:


    | Operator | Example | Equivalent |

    | --- | --- | --- |

    | += | x += 5; s += " ft"; | x = x + 5; s = s + " ft"; |

    | -= | x -= 5; | x = x - 5; |

    | *= | x *= 10; | x = x * 10; |'
