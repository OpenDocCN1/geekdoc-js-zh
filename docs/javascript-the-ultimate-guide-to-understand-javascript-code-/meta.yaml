    # Changing an element’s text color


    You can get or set the text color of an element using the ‘color’ sub-property

    of the ‘style’ property of an element.


    Syntax:


    ```

    var getVal = element.style.color// GET

    element.style.color = set// SET

    ```


    # Changing an element’s text size


    You can get or set the text size of an element using the ‘fontSize’ sub-

    property(note the camel case here) of the ‘style’ property of an element.


    Syntax:


    ```

    var getVal = element.style.fontSize = set// SET

    ```


    element.style.fontSize = set// SET

    NOTE: When you assign a size to any size-related property like font size,

    height width, etc., the sizes should be assigned along with their units (px, em,

    hv, etc.). Not doing so will result in an error.


    Example:


    ```

    element.style.fontSize = 40;// WRONG

    element.style.fontSize = ‘40’;// WRONG

    element.style.fontSize = ‘40px’;// RIGHT

    ```


    The ‘float’ property, an exception in naming convention in DOM

    The ‘float’ property in CSS is used to specify the position of an element in

    the layout. But ‘float’ is also a reserved word in JavaScript. Owing to this,
    we

    cannot use ‘float’ as a property name in JavaScript. We use the name

    ‘cssFloat’ in JavaScript to refer to the ‘float’ property.


    Syntax:


    ```

    var getVal = element.style.cssFloat// GET

    element.style.cssFloat = set// SET

    ```'
