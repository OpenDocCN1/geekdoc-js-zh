    The type property indicates the type of event produced, which is useful when the
    same function is used to handle several events: var type = event.type;


    The type property returns the type of event produced, which is equal to the name
    of the event but without the prefix on.


    Using this property, the previous example in a section of contents was highlighted
    when you hover over the mouse.


    # Information about keyboard events


    Of all the events available in JavaScript, keyboard-related events are the most
    incompatible between different browsers and therefore, the most difficult to handle.
    First, there are many differences between browsers, keyboards, and user operating
    systems, mainly due to differences between languages.


    In addition, there are three different events for the keystrokes: onkeyup, onpress,
    and onkeydown. Finally, there are two types of keys: normal keys (such as letters,
    numbers and normal symbols) and special keys (such as ENTER, Alt, Shift, etc.).


    When a user presses a normal key, three events occur in a row and in this order:
    onkeydown, onpress and onkeyup. The onkeydown event corresponds to the fact of
    pressing a key and not releasing it; the onpress event is the key press itself
    and the onkeyup refers to the release of a key that was pressed.


    The easiest way to obtain information about the key that has been pressed is through
    the onkeypress event. The information provided by the onkeydown and onkeyup events
    can be considered as more technical since they return the internal code of each
    key and not the character that has been pressed.'
