  md: '# Chapter 20 Arrays in JavaScript


    What is an array?


    An array is a collection of items. It is basically a JavaScript object that is
    used to store an ordered collection of items. All the items can be accessed by
    a single name which is the array name. Unlike Java, arrays in JavaScript can have
    non-homogenous data stored in them, i.e., items in the array can be of different
    data types.


    An array is one of the most useful entities in any programming language; a programming
    language is incomplete without an array. Often we find the need to have a list
    of items, and it is easier to do so with arrays, instead of having a separate
    variable for each item, you can refer to the whole list with just one variable
    if you use arrays.


    Initializing arrays in JavaScript


    There are two ways of initializing an array in JavaScript which is listed below.


    +   * Method 1:


    This is the most commonly used method to create an array, in this method array
    is declared with the help of square brackets [ ], where we find the items of the
    array are placed between these square brackets separated by commas.


    Example:


    ```

    var myArray = []; //initializing an empty array

    ```


    ```

    var myArray2 = [''this'', ''is'', ''an'', ''array''];

    ```


    +   * Method 2:


    This method involves initialization of array with the help of ‘new’ keyword which
    is used to initialize an object of Array ‘class’.


    Example:


    ```

    var myArray = new Array(); //initializing an empty array

    ```


    ```

    var myArray2 = new Array(''this'', ''is'', ''an'', ''array'');

    ```


    Accessing elements of array


    Array’s elements or items are accessed by referring to their index number'
