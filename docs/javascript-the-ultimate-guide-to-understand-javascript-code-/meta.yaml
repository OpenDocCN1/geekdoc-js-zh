  md: '# Numeric Operators


    The operators + - * / % perform addition, subtraction, multiplication, division,
    and the modulus operation, as in the following expression:


    2 * a + b / 3 - 7 * c


    Recall that multiplication, division, and the modulus operation are performed
    before addition and subtraction.


    In some languages, if both operands are integers, the / operator performs integer
    division—that is, it returns an integer result. For example, 5 / 2 equals 2. JavaScript,
    however, does not truncate the result of a division to an integer simply because
    the operands are both integers, so in JavaScript 5 / 2 equals 2.5.


    The modulus operator (%) divides the first operand by the second, and returns
    the remainder of the division. For example:


    | Expression | Value |

    |---|---|

    | 10 % 4 | 2 |

    | -10 % 4 | -2 |

    | 10 % -4 | 2 |

    | -10 % -4 | -2 |


    Notice that the sign of the result is always the same as the sign of the first
    operand.


