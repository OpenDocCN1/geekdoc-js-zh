    The JavaScript code is enclosed within the <script></script> tag. This script
    is embedded inside the HTML file by placing it inside the <body></body> of the
    <html></html> tags. As you see, the code is also enclosed inside HTML comments.
    The reason for doing this is that it prevents browsers that do not understand
    JavaScript to use this code unlawfully.


    As part of the main code, document.write function is called, which prints the
    string given to it as parameter on the screen. This function can be used to'
  - '[PAGE 41]


    write HTML as well. In order to execute this code, open a text editor and copy
    this code to the file. Save the file as index.htm and open it in a web browser
    that supports JavaScript. The result of this can be shown in the image below.


    # Line Breaks and Whitespaces


    You are free to use whitespaces, tabs and newlines in your code to make it readable
    and well organized. These characters are completely ignored by JavaScript.


    # Optional Use of Semicolons


    Most conventional programming languages like C, Java and C++ require you to place
    semicolon at the end of each statement to indicate the termination of an statement.
    However, in Java, if you have written code in such a manner that each statement
    is on a different line, then you can omit the use of semicolons. Example of this
    concept is the code shown below —


    ```

    <script language="javascript" type="text/javascript">

    <!--

    variab1 = 15

    variab2 = 35

    -->

    </script>

    ```


    However, if all the statements are written in continuity, then you must use semicolons
    to tell JavaScript where a statement ends and a new one starts. Sample code to
    demonstrate the use of semicolon is given below —


    ```

    <script language="javascript" type="text/javascript">

    <!--

    variab1 = 15;

    variab2 = 35;

    -->

    </script>

    ```


    With this said, it is important to mention that the use of semicolon is'
  - '[PAGE 42]


    recommended as it is considered a good programming practice.


    # Case Sensitivity


    JavaScript is sensitive to capitalization or case of the letters being used. For
    instance, I and i are two different identifiers for JavaScript. This holds true
    for any keyword, function name or variable name that you use. Anything you write
    in JavaScript must have a consistent case for it to be identifiable by JavaScript.


    # Writing Comments


    JavaScript identifies both C and C++ style of comments. The single line comments
    can be made by writing // at the beginning of the line. In this scenario, anything
    that is written between the characters and end of the line are treated as comments
    and ignored by JavaScript. The other type of comments supported by JavaScript
    is the multi-line comment. Such a comment begins with /* and ends with */. JavaScript
    ignores any character and number of lines that lie between these two sequences.


    Besides the above-mentioned, JavaScript also supports HTML style of commenting.
    However, it only recognizes <!-- and treats the characters following this character
    phrase till the end of the line as a single line comment. JavaScript does not
    recognize the HTML comment closing character sequence, -->. Therefore, as and
    when you require the use of this character phrase, you must precede it with //.
    In order to help you understand this in a better way, sample code has been given
    below.


    ```

    <script language="javascript" type="text/javascript">

    <!--

    // Single line comment.

    /* Multi-line comment

    Similar to the comments in C and C++ */

    -->

    </script>

    ```'
- md: "\n# Chapter 6 Enabling JavaScript in Browsers\n\nMost of the browsers that\
    \ are being used today support JavaScript. However, you may be required to disable\
    \ or enable this feature of your browser. You may perform this operation manually.\
    \ This chapter gives you a quick insight into how manual enabling and disabling\
    \ of JavaScript can be performed for browsers like Firefox, Google Chrome and\
    \ Internet Explorer.\n\n## Internet Explorer (IE)\n\nIn order to enable or disable\
    \ JavaScript on IE, you need to follow the steps given below –\n\nIn the IE panel,\
    \ go to Tools and from the menu, open Internet Options. Look for Security tab\
    \ and select the same. Choose the button named Custom Level. Now scroll down and\
    \ you will see an option of the name, Scripting. Under this heading, select the\
    \ radio button that says Active Scripting. Click ok and you will be back to your\
    \ browser.\n\nIf you wish to disable JavaScript, you need to follow the same set\
    \ of steps and at the point where you choose Active Scripting you must choose\
    \ the Disable button.\n\n## Firefox\n\nIn order to enable or disable JavaScript\
    \ on Firefox, you need to follow the steps given below –\n\nOpen a new window\
    \ and in the address bar of the tab, type – about: config. This will bring a dialog\
    \ box in front of you, which shall give you a warning. Choose the option that\
    \ says ‘I’m careful, I promise!’ Once you choose this option, the browser will\
    \ present you with a list of configure options. Type - javascript.enabled - in\
    \ the search bar. If you right click on this value, you will see an option that\
    \ says select toggle. Choosing this option will simply toggle the value. If JavaScript\
    \ is enabled, then choosing this option will disable it else will be enabled.\n\
    \n## Chrome\n\nIn order to enable or disable JavaScript on Google Chrome, you\
    \ need to follow the steps given below –\n\nEnter the Chrome menu by clicking\
    \ on a symbol on the top right hand corner of the window. From the available options,\
    \ choose Setting and click on ‘Show Advanced Setting’. The window that will option\
    \ after this will have a section named Privacy. Look for the button that says\
    \ Content settings. You will be able to locate a JavaScript section under this\
    \ button. To enable JavaScript, select Allow all sites to run JavaScript (recommended)’\
    \ else select ‘Do not allow any site to run JavaScript’.\n\n## Programming in\
    \ JavaScript for Non-JavaScript Browsers\n\nIf you are writing a JavaScript and\
    \ the same is run by a user on a non-JavaScript browser, then you can print a\
    \ message for the user with the help of the <noscript> tag. This concept can be\
    \ implemented in the following manner.\n\n```\n<html>\n<body>\n<script language=\"\
    javascript\" type=\"text/javascript\">\\<!--\ndocument.write(\"Hello World...\"\
    )\n//-->\n</script>\n<noscript>\nWarning: JavaScript Required!\n</noscript>\n\
    </body>\n</</html>\n```\n\nThis message ‘Warning: JavaScript Required!’ will be\
    \ displayed to the user if the user attempts to run the script on a non-JavaScript\
    \ browser.\n\n# Chapter 7 Placement of JavaScript in Files\n\nAlthough, the user\
    \ is free to include the JavaScript code anywhere inside the HTML document as\
    \ long as the code is enclosed inside the <script></script> tags, there are some\
    \ preferred ways of its inclusions. These practices are described below.\n\n###\
    \ Including JavaScript Code in <HEAD></HEAD> Section\n\nTypically, if you wish\
    \ to trap user clicks, code related to the same is inside the head section of\
    \ the HTML document. In order to help you understand this concept, a sample code\
    \ is given below.\n\n```\n<html>\n<head>\n<script type=\"text/javascript\">\n\
    <!--\nfunction pHWorld() {\nalert(\"HelloWorld!\")\n}\n-->\n</script>\n</head>\n\
    <body>\n<input type=\"button\" onclick=\"pHWorld()\" value=\"Print HelloWorld!\"\
    \ />\n</body>\n</</html>\n```\n\n### Including JavaScript Code in <body></body>\
    \ Section\n\nIf there is some JavaScript functionality that you want to run after\
    \ the page has loaded, then this script should appear inside the body of the HTML\
    \ document. The code given below shows how JavaScript code can be embedded into\
    \ the body of an HTML document.\n\n```\n<html>\n<head>\n</head>\n<body>\n<script\
    \ type=\"text/javascript\">\n<!--\ndocument.write(\"HelloWorld!\")\n//-->\n</script>\n\
    <p>Body of HTML document</p>\n</body>\n</</html>\n```\n\n### Including JavaScript\
    \ Code in <HEAD></HEAD> and <BODY></BODY> Sections\n\nYou can have different JavaScript\
    \ codes embedded in the head and body sections of the same HTML document. Sample\
    \ code to illustrate how this can be done is given below.\n\n```\n<html>\n<head>\n\
    <script type=\"text/javascript\">\n<!--\nfunction printHW() {\nalert(\"HelloWorld!\"\
    )\n}\n//--\n</script>\n</head>\n\n<script type=\"text/javascript\">\n<!--\ndocument.write(\"\
    HelloWorld!\")\n//-->\n</script>\n<input type=\"button\" onclick=\"printHW()\"\
    \ value=\"Print Hello World\" />\n<body>\n</</html>\n```\n\n## Writing JavaScript\
    \ into External Files\n\nThe more pages you have in your website, the more you\
    \ will realize that you are writing the same JavaScript code in all these different\
    \ pages or at least some of these pages. JavaScript allows you to manage identical\
    \ code used in different HTML documents by writing the JavaScript code in external\
    \ files, which can then be linked with the page to call the required JavaScript\
    \ functionality. You can link external files by using the src attribute of the\
    \ script tag. Sample code to illustrate this functionality has been given below.\n\
    \n```\n<html><head><script type=\"text/javascript\" src=\"sample.js\"></script></head><body></</html>\n\
    ```\n\nHere, sample.js is the JavaScript file containing the script. The code\
    \ within this file can be used by the HTML document just like you used the JavaScript\
    \ written within the script tag. Please note that the JavaScript code needs to\
    \ be written into any text file and must be saved with the extension .js. For\
    \ instance, your sample.js can look like this –\n\n```\nfunction printHW() {\n\
    alert(\"HelloWorld!\")\n}\n```\n\n# Chapter 8 Popup Message\n\nJavaScript has\
    \ numerous built-in methods that can help in displaying popup messages for various\
    \ purposes. Let us discuss the various popup boxes provided by JavaScript:\n\n\
    ## Alert Box\n\nThis is used to show a message to a user, particular where the\
    \ emphasis is needed. It comes with an OK button that closes the popup when clicked.\
    \ It is created by calling the JavaScript’s alert() function.\n\nFor example:\n\
    \n```html\n<body>\n  <h1>Popup World!</h1>\n  <script>\n    alert(\"Hello World!\"\
    ); // to display a string message\n    alert(12); // to display a number\n   \
    \ alert(true); // to display a boolean\n  </script>\n</body>\n```\n\nWhen you\
    \ run the code, it will display the first alert box with the string Hello World!\
    \ Click OK button and it will display an alert with 12. Again, click the OK button\
    \ and it will display an alert box with true. This shows that the alert box can\
    \ be used to display a message of any type.\n\n## Confirm Box\n\nSometimes, a\
    \ user is expected to give a confirmation so as to proceed. For example, you may\
    \ want a user to confirm deletion or update of certain details before the process\
    \ be completed. This can be done using the confirm() function provided by JavaScript.\
    \ This function will display a popup box to the user with two buttons namely OK\
    \ and Cancel. The next step is determined by the button that the user clicks.\n\
    \nFor example:\n\n```\n<html>\n<body>\n  <h1>confirm()</h1>\n  <p id=\"del\"></p>\n\
    \  <script>\n    var userChoice;\n    if (confirm(\"Do you really want to delete\
    \ the data?\") == true) {\n      userChoice = \"Data deleted successfully\";\n\
    \    } else {\n      userChoice = \"Delete Canceled!\";\n    }\n    document.getElementById(\"\
    del\").innerHTML = userChoice;\n  </script>\n</body>\n</</html>\n```\n\n## Prompt\
    \ Box\n\nIn some cases, you may need to receive an input from users and use it\
    \ to perform further actions on the web page. For example, you may need to calculate\
    \ the monthly amount for loan repayment based on the number of months which the\
    \ user wants to settle the loan. In such a case, you can use the prompt() function\
    \ provided by JavaScript.\n\nThe function should take two string parameters. The\
    \ first one is the message that will be displayed the second one is the default\
    \ value to be in the input text once the message has been displayed:\nprom([string\
    \ display_message], [string default_Value]);\n\nFor example:\n\n```\n<html>\n\
    <body>\n```\n"
  mdcn: "\n\n# 第 6 章在浏览器中启用 JavaScript\n\n今天使用的大多数浏览器都支持 JavaScript。然而，你可能需要禁用或启用浏览器的此功能。你可以手动执行此操作。本章将带你快速了解如何在\
    \ Firefox、Google Chrome 和 Internet Explorer 等浏览器中手动启用和禁用 JavaScript。\n\n## Internet\
    \ Explorer (IE)\n\n要在 IE 中启用或禁用 JavaScript，你需要按照以下步骤操作——\n\n在 IE 面板中，转到“工具”(Tools)，从菜单打开“Internet\
    \ 选项”(Internet Options)。找到“安全”(Security)选项卡并选择它。选择“自定义级别”(Custom Level)按钮。现在向下滚动，你会看到一个名为“脚本”(Scripting)的选项。在此标题下，选择“活动脚本”(Active\
    \ Scripting)单选按钮。点击确定，你将返回浏览器。\n\n如果你想禁用 JavaScript，需要按照相同的步骤操作，在选择“活动脚本”时，你必须选择“禁用”(Disable)按钮。\n\
    \n## Firefox\n\n要在 Firefox 中启用或禁用 JavaScript，你需要按照以下步骤操作——\n\n打开新窗口，并在标签页的地址栏中输入\
    \ – about: config。这将为你弹出一个对话框，并向你发出警告。选择写有“我很小心，我保证！”(I’m careful, I promise!)的选项。一旦选择此选项，浏览器将向你列出配置选项。在搜索栏中输入\
    \ - javascript.enabled -。如果你右键点击此值，你会看到“选择切换”(select toggle)选项。选择此选项将简单切换值。如果\
    \ JavaScript 已启用，选择此选项将将其禁用，否则将启用。\n\n## Chrome\n\n要在 Google Chrome 中启用或禁用 JavaScript，你需要按照以下步骤操作——\n\
    \n点击窗口右上角的图标进入 Chrome 菜单。在可用选项中，选择“设置”(Setting)并点击“显示高级设置”(Show Advanced Setting)。之后出现的窗口将有一个名为“隐私”(Privacy)的部分。寻找“内容设置”(Content\
    \ settings)按钮。你可以在此按钮下找到 JavaScript 部分。要启用 JavaScript，选择“允许网站运行 JavaScript (Allow\
    \ all sites to run JavaScript (recommended))”，否则选择“不允许任何网站运行 JavaScript”(Do not\
    \ allow any site to run JavaScript)。\n\n## 为非 JavaScript 浏览器编写 JavaScript 代码\n\
    \n如果你正在编写 JavaScript，且用户在非 JavaScript 浏览器上运行它，那么你可以借助 `<noscript>` 标签为用户打印消息。这一概念可以通过以下方式实现。\n\
    \n```\n<html>\n<body>\n<script language=\"javascript\" type=\"text/javascript\"\
    ><!--<!--\ndocument.write(\"Hello World...\")\n//-->\n</script>\n<noscript>\n\
    Warning: JavaScript Required!（需要 JavaScript！）\n</noscript>\n</body>\n</html>\n\
    ```\n\n如果用户尝试在非 JavaScript 浏览器上运行脚本，将向用户显示此消息“Warning: JavaScript Required!”。\n\
    \n# 第 7 章 JavaScript 在文件中的位置\n\n虽然用户可以将 JavaScript 代码封装在 `<script></script>` 标签内，并包含在\
    \ HTML 文档的任何位置，但存在一些首选的包含方式。这些实践在下方所示。\n\n### 在 <HEAD></HEAD> 部分包含 JavaScript\
    \ 代码\n\n通常，如果你想捕获用户点击，相关代码将位于 HTML 文档的 head 部分。为了帮助你理解这一概念，下面提供了一个示例代码。\n\n```\n\
    <html>\n<head>\n<script type=\"text/javascript\">\n<!--\nfunction pHWorld() {\n\
    alert(\"HelloWorld!\")\n}\n-->\n</script>\n</head>\n<body>\n<input type=\"button\"\
    \ onclick=\"pHWorld()\" value=\"Print HelloWorld!\" />\n</body>\n</html>\n```\n\
    \n### 在 <body></body> 部分包含 JavaScript 代码\n\n如果你有一些要在页面加载后运行的 JavaScript 功能，那么此脚本应该出现在\
    \ HTML 文档的 body 中。下面的代码显示了如何将 JavaScript 代码嵌入 HTML 文档的 body 中。\n\n```\n<html>\n\
    <head>\n</head>\n<body>\n<script type=\"text/javascript\">\n<!--\ndocument.write(\"\
    HelloWorld!\")\n//-->\n</script>\n<p>Body of HTML document</p>\n</body>\n</html>\n\
    ```\n\n### 在 <HEAD></HEAD> 和 <BODY></BODY> 部分包含 JavaScript 代码\n\n可以在同一个 HTML 文档的\
    \ head 和 body 部分嵌入不同的 JavaScript 代码。下面提供了说明如何操作的示例代码。\n\n```\n<html>\n<head>\n\
    <script type=\"text/javascript\">\n<!--\nfunction printHW() {\nalert(\"HelloWorld!\"\
    )\n}\n//--\n</script>\n</head>\n\n<script type=\"text/javascript\">\n<!--\ndocument.write(\"\
    HelloWorld!\")\n//-->\n</script>\n<input type=\"button\" onclick=\"printHW()\"\
    \ value=\"Print Hello World\" />\n<body>\n</html>\n```\n\n## 将 JavaScript 写入外部文件\n\
    \n你的网站页面越多，你就越会意识到你在所有这些不同页面或至少是某些页面中编写相同的 JavaScript 代码。JavaScript 允许你通过在外部文件中编写\
    \ JavaScript 代码来管理在不同 HTML 文档使用的相同代码，然后将其与页面链接以调用所需的 JavaScript 功能。你可以通过 `script`\
    \ 标签的 `src` 属性来链接外部文件。下面提供了说明此项功能的示例代码。\n\n```\n<html><head><script type=\"text/javascript\"\
    \ src=\"sample.js\"></script></head></body></html>\n```\n\n在这里，sample.js 是包含脚本的\
    \ JavaScript 文件。该文件中的代码可以被 HTML 使用。请注意，脚本标签内的 JavaScript 代码需要写入文本文件并以 .js 扩展名保存。例如，你的\
    \ sample.js 可以如下所示：\n\n```\nfunction printHW() {\nalert(\"HelloWorld!\")\n}\n\
    ```\n\n# 第 8 章 弹出消息\n\nJavaScript 具有许多内置方法可以帮助出于各种目的显示消息。让我们讨论 JavaScript 提供的各种弹出框：\n\
    \n## Alert框 (Alert Box)\n\n用于向用户显示消息，特别是在需要强调的情况下。它带有一个 OK 按钮，点击后关闭弹出。它是通过调用 JavaScript\
    \ 的 `alert()` 函数创建的。\n\n例如：\n\n```html\n<body>\n  <h1>Popup World!</h1>\n  <script>\n\
    \    alert(\"Hello World!\"); // 显示字符串\n    alert(12); // 显示数字\n    alert(true);\
    \ // 显示布尔值\n  </script>\n</body>\n```\n\n当你运行代码时，它将显示第一个带有字符串 Hello World! 的 alert框。点击\
    \ OK 按钮将显示 12。再次点击 OK 按钮将显示 true。这表明 alert框可以显示任何类型的消息。\n\n## Confirm框 (Confirm\
    \ Box)\n\n有时，需要用户确认以便继续。例如，你可能希望用户在完成删除之前删除或或更新可以使用可以使用提供的 `confirm()` 函数来实现。此函数将向用户显示一个带有确定和取消按钮的弹出框。下一步由用户点击的按钮决定。\n\
    \n例如：\n\n```\n<html>\n<body>\n  <h1>confirm()</h1>\n  <p id=\"del\"></p>\n  <script>\n\
    \    var userChoice;\n    if (confirm(\"Do you really want to delete the data?\"\
    ) == true) {\n      userChoice = \"Data deleted successfully\";\n    } else {\n\
    \      userChoice = \"Delete Canceled!\";\n    }\n    document.getElementById(\"\
    del\").innerHTML = userChoice;\n  </script>\n</body>\n</html>\n```\n\n## Prompt框\
    \ (Prompt Box)\n\n在某些情况下，你可能需要接收用户的输入并将其用于网页上执行进一步的操作。例如，你可能需要根据用户想要结算贷款的月数计算每月还款金额。在这种情况下，你可以使用\
    \ JavaScript 提供的 `prompt()` 函数。\n\n该函数接受两个字符串参数。第一个是将被显示的消息，第二个是消息显示后输入框中的默认值：\n\
    `prom([string display_message], [string default_Value]);`\n\n例如：\n\n```\n<html>\n\
    <body>\n```\n\n"
