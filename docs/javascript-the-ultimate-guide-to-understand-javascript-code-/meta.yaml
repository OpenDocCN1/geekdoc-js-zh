    logical if viewed from the programming angle. For example, if we read the statement
    age=age+1 backwards what happens is that the value of 1 is added to the current
    age of 35 which would make 36 the new value of age. Additionally, we can use a
    complex assign operator such as (=) in the statement age+=10, to increase the
    value of the variable by 10. We can also use the same logic to other operations
    like subtraction, division and multiplication.


    ```javascript

    age-=5; is the same as age = age - 5;

    age*= 5; is the same as age = age * 5;

