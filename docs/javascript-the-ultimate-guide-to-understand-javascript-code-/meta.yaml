    \ (Brackets):\n\n此脚本告诉浏览器在 `Files` 目录下查找名为 `index.js` 的文件。脚本可能具有许多其他属性；我们只是用它来说明最重要的\
    \ HTML 标签，在创建 JavaScript 网页和应用程序之前，你必须掌握这些标签的知识。\n\n注意：如前所述，在没有一些 HTML 和 CSS 知识的情况下，你无法使用\
    \ JavaScript。\n\n## 使用 JavaScript：初学者 CSS 简明指南\n\n级联样式表（Casc，或简称 CSS）是一种用于展示和修改网页外观的设计语言。它允许网页开发者更改页面特征，例如字体、图像展示以及各种\
    \ html 元素的位置。\n\n与 HTML、JavaScript、PHP、Python 以及其他编程语言一样，CSS 随着时间的不断演进，每次演进都会添加新功能。本书关注\
    \ CSS 的最新版本，即 CSS3。\n\n## CSS 叠加 (CSS Overlay)\n\nCSS 文件在 html 页面上以外部链接的方式引入。然而，你可以将\
    \ CSS 代码包含在 HTML 中（内联 CSS），但我们不建议这样做。CSS 代码主要包含三个部分。\n\n它由一组主要关注样式部分的规则组成，这些规则由浏览器解释，然后应用到相应的元素上。\n\
    \nCSS 的三个部分是：\n\n- 选择器（Selector）——CSS 选择器是应用样式的 HTML 标签。它可以是一个段落（使用 `<p>` 标签）。\n\
    - 属性（Property）——属性是 HTML 标签的一个特征。属性包括：颜色、边框、导航等。\n- 值（Value）——值是分配给变量的定义值。边框可以是\
    \ 2px 宽。2px 就是分配给边框属性的值。\n\n典型的 CSS 语法如下：\n\n```\nSelector: {\nProperty: value;\n\
    Property2: value;\n```\n\n```\nh1 {\n  color: aquamarine;\n  border-bottom: 2px;\n\
    }\np {\n  font-family: \"Times New Roman\", Times, serif;\n}\n```\n\n从上面的示例可以看出，h1\
    \ 和 p 分别代表一级标题和段落，它们代表选择器。接下来，当我们想要进行操作时，可以选择该元素并设置属性和值，例如将颜色设置为蓝色、红色或水蓝绿色（aquamarine）。在颜色方面，你可以使用\
    \ RGB 或 HEX 代码进行设置。\n\n有许多类型的 CSS 选择器和选择方法。例如，你可以使用 `*`（星号）作为全局选择器。你也可以使用元素名来在存在多个元素时选择某个特定的元素。\n\
    \n注意：这不是一本关于 CSS 的书，因此 CSS  超出了本书的范围。本章的目的是让你对最重要的 CSS 元素有一个基础的了解，以便你知道如何使用它们，从而开始学习如何创建\
    \ JavaScript 代码、网页和 Web 。\n\n现在你已经对如何操作 HTML 和 CSS 有了基础的了解，我们可以继续学习如何操作 JavaScript\
    \ 了，在你追求掌握这种重要的脚本语言的过程中，特别是如果你的意图是学习 JavaScript 以创建动态网页、响应式 Web 应用程序以及网站。\n\n\
    ## 第 12 章 使用 DOM 更改 HTML 元素的内容\n\n为了制作动态 Web 应用或网站，我们经常需要更改 HTML 元素的内容。一些示例场景包括：\n\
    \n- 给用户反馈。替换 HTML 元素的内容而不是使用 `alert` 函数是提供反馈的更好替代方案，因为你可以修改元素的外观，从而让你的反馈在视觉上显示更好。这反会带来更愉快的用户体验。\n\
    - 你在 Web 应用上见过实时时钟或倒计时吗？它们在运行的时间单位发生变化时，都会替换其 HTML 元素的内容。\n- 在点击按钮时不刷新页面就更改页面内容。`innerHTML`\
    \ 属性。\n\n这可能是更改 HTML 元素内容最简单且最频繁的方法。DOM 中元素对象的此属性代表该元素当前的内容，并用于获取或设置该元素的内容。如果给元素对象的此属性分配一个值，那么该元素的内容就会变为新分配的值。\n\
    \n语法：\n\n```\nelementObject.innerHTML = ‘new value’; // 设置\nvar x = elementObject.innerHTML;\
    \ // 获取\n```\n\n注意，该属性代表元素标签内的所有内容，甚至是它的子元素和孙子元素。\n\n获取元素内容的示例：\n\n```html\n<body>\n\
    \n<div id='outer'>\n\n<div id='inner'>\nHey there\n</div>\n</div>\n<script>\n\
    var innerContent = document.getElementById('inner').innerHTML;\nvar outerContent\
    \ = document.getElementById('outer').innerHTML;\n\nconsole.log( innerContent );\n\
    \nconsole.log( outerContent );\n</script>\n</body>\n```\n\n上述代码在控制台屏幕上产生以下输出：\n\
    \nHey there\n<div id=\"inner\">\nHey there\n</div>\n\n如你所见，输出包含了空格和制表符。\n\n提示：如果你希望消除内容开头和结尾的额外空格和制表符，可以使用字符串类的\
    \ `.trim()` 方法对它们进行处理！\n\n更改元素内容的示例：\n\n```html\n<body>\n<div id='outer'>\n<div\
    \ id='inner'>\nHey there\n</div>\n</div>\n\n<script>\nvar innerElement = document.getElementById('inner');\n\
    innerElement.innerHTML = 'Hola amigos';\n\n// id 为 inner 的 div 元素的内容已更改为 ‘Hola\
    \ amigos’\n</script>\n</body>\n```\n\n## ‘textContent’属性\n\n此属性与 `innerHTML` 属性几乎相同。该属性与\
    \ `innerHTML` 属性的区别在于，它仅用于获取或设置文本内容（意味着获取内容时不包含子元素和孙子元素的标签名），而在 `innerHTML` 属性的情况下，标签名也会返回。\n\
    \n让我们通过使用在 `innerHTML` 属性情况下使用的相同示例来理解这一点——但在这里我们将 `innerHTML` 属性替换为 `textContent`\
    \ 属性。\n\n```html\n<body>\n\n<div id='outer'>\n\n<div id='inner'>\n\nHey there\n\
    </div>\n</div>\n<script>\nvar innerContent = document.getElementById('inner').textContent;\n\
    var outerContent = document.getElementById('outer').textContent;\n\nconsole.log(\
    \ innerContent );\nconsole.log( outerContent );\n</script>\n</body>\n```\n\n上述代码在控制台屏幕上产生以下输出：\n\
    \nHey there\n\nHey there\n\n开头和结尾的空格和制表符也包含在结果输出中，但注意 `<div>` 标签没有包含！\n\n这两个属性的另一个区别是，使用\
    \ `innerHTML` 属性获取的内容会将 `&`、`<` 或 `>` 分别替换为 `&amp;`、`&lt;` 和 `&gt;`，而使用 `textContent`\
    \ 属性获取的内容中这些字符保持原样。\n\n这两个属性的设置操作是相同的。这里有一个示例：\n\n```html\n<body>\n<div id='outer'>\n\
    <div id='inner'>\nHey there\n</div>\n</div>\n<script>\nvar innerElement = document.getElementById('inner');\n\
    innerElement.textContent = 'Hola amigos';\n\n// id 为 inner 的 div 元素的内容已更改为 ‘Hola\
    \ amigos’\n</script>\n</body>\n```\n\n这两个属性之间另一个重大的区别是，当你使用 `.innerHTML` 属性设置元素内容时，它会被解释为\
    \ HTML 代码，而在 `.textContent` 的情况下，它会被解释为原始文本。\n\n示例：\n\n```html\n<body>\n\n<div\
    \ id='outer'>\n\n<div id='inner'>\n\nHey there\n</div>\n</div>\n<script>\nvar\
    \ innerElement = document.getElementById('inner');\n\n// 在这种情况下不会弹出警告框：\n    innerElement.textContent\
    \ = \"<script>alert('hey')</script>\";\n    // 在这种情况下会弹出警告框：\n    innerElement.innerHTML\
    \ = \"<script>alert('hey')</script>\";\n\n// 这是因为在后者中，文本被解释为 HTML 代码\n</script>\n\
    \n</body>\n```\n\n"
