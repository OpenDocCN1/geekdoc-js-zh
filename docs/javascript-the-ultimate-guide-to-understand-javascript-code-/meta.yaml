    # The String Concatenation Operator


    The + operator can also be used to combine two strings into a string:


    ```javascript

    var s = prompt("Enter your name.", "");

    alert("Your name is " + s + ".");

    ```


    One common use for string concatenation is to convert a non-string value to a
    string and combine it with another string, all in a single operation:


    ```javascript

    var count = 0;

    /* code that increments count... */

    alert("Final count: " + count);

    ```


    If only one of its operands is a string, + converts the other operand to a string
    and joins the two strings. (The + operator favors string over a number. If one
    operand is a string and the other a number, + does not attempt to convert the
    string to a numeric value and add the two numbers!)


    Recall from that the automatic conversion of a number, boolean value, null, or
    undefined to a string works as expected and is one of the benign forms of automatic
    conversion. An easy way to make this conversion is by using the + an empty string.
    If you don''t want to add any characters, you can just concatenate with an empty
    string:


    ```javascript

    var count = 0;

    /* code that increments count... */

    /* done incrementing ''count''; now convert it to a string: */

    var s = count + "";

