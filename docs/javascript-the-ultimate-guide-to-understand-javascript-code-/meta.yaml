  md: '# Chapter 6 Enabling JavaScript in Browsers


    Most of the browsers that are being used today support JavaScript. However, you
    may be required to disable or enable this feature of your browser. You may perform
    this operation manually. This chapter gives you a quick insight into how manual
    enabling and disabling of JavaScript can be performed for browsers like Firefox,
    Google Chrome and Internet Explorer.


    # Internet Explorer (IE)


    In order to enable or disable JavaScript on IE, you need to follow the steps given
    below –


    In the IE panel, go to Tools and from the menu, open Internet Options. Look for
    Security tab and select the same. Choose the button named Custom Level. Now scroll
    down and you will see an option of the name, Scripting. Under this heading, select
    the radio button that says Active Scripting. Click ok and you will be back to
    your browser.


    If you wish to disable JavaScript, you need to follow the same set of steps and
    at the point where you choose Active Scripting you must choose the Disable button.


    # Firefox


    In order to enable or disable JavaScript on Firefox, you need to follow the steps
    given below –


    Open a new window and in the address bar of the tab, type – about: config. This
    will bring a dialog box in front of you, which shall give you a warning. Choose
    the option that says ‘I’m careful, I promise!’ Once you choose this option, the
    browser will present you with a list of configure options. Type - javascript.enabled
    - in the search bar. If you right click on this value, you will see an option
    that says select toggle. Choosing this option will simply toggle the value. If
    JavaScript is enabled, then choosing this option will disable it else will be
    enabled.


    # Chrome


    In order to enable or disable JavaScript on Google Chrome, you need to follow
    the steps given below –


    Enter the Chrome menu by clicking on a symbol on the top right hand corner'
