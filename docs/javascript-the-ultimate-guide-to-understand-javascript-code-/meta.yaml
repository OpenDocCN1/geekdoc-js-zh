  - '[PAGE 128]


    The bind() method is a bit different from the other two.


    Where the apply() and call() methods execute the current function on the spot,
    the bind() method returns a newly created function.


    A bind() method can be used for events such as onClick, where the firing of such
    events is uncertain.


    We as programmers can''t predict when those events will be fired, but we can serve
    the context to them.'
  - '[PAGE 129]


    # Chapter 19 Events


    So far, the applications and scripts that have been created something in common:
    they are executed from the first instruction to the last sequentially. Thanks
    to the flow control structures (if, for, while) it is possible to slightly modify
    this behavior and repeat some pieces of the script and skip other pieces depending
    on some conditions.


    These types of applications are not very useful since they do not interact with
    users and cannot respond to the different events that occur during the execution
    of an application. Fortunately, web applications created with the JavaScript language
    can use the event-based programming model.


    In this type of programming, the scripts are dedicated to waiting for the user
    to "do something" (press a key, move the mouse, close the browser window). Next,
    the script responds to the user''s action by normally processing information and
    generating a result.


    Events make it possible for users to transmit information to programs. JavaScript
    defines numerous events that allow a complete interaction between the user and
    the web pages/applications. Pressing a key constitutes an event, as well as clicking
    or moving the mouse, selecting an element of a form, resizing the browser window,
    etc.


    JavaScript allows you to assign a function to each of the events. In this way,
    when any event occurs, JavaScript executes its associated function. These types
    of functions are called "event handlers" in English and are usually translated
    as "event handlers".


    # Event Models


    Creating web pages and applications has always been much more complex than it
    should be due to incompatibilities between browsers. Although there are dozens
    of standards for the technologies used, browsers do not fully support them or
    even ignore them.


    The main incompatibilities occur in the XHTML, in the support of CSS stylesheets
    and, above all, in the implementation of JavaScript. Of all of them, the most
    important incompatibility occurs precisely in the browser''s event model. Thus,
    there are up to three different models to handle events depending on the browser
    in which the application runs.'
  - '[PAGE 130]


    # Basic Event Model


    This simple event model was introduced for version 4 of the HTML standard and
    is considered part of the most basic level of DOM. Although its features are limited,
    it is the only model that is compatible in all browsers and therefore, the only
    one that allows you to create applications that work the same way in all browsers.


    # Standard Event Model


    The most advanced versions of the DOM standard (DOM level 2) define a completely
    new and much more powerful event model than the original. All modern browsers
    include it, except Internet Explorer.


    # Internet Explorer Event Model


    Internet Explorer uses its own event model, which is similar but incompatible
    with the standard model. It was first used in Internet Explorer 4 and Microsoft
    decided to continue using it in the other versions, despite the fact that the
    company had participated in the creation of the DOM standard that defines the
    standard event model.


    # Basic Event Model


    # Types Of Events


    In this model, each XML element or tag defines its own list of possible events
    that can be assigned. The same type of event (for example, clicking the left mouse
    button) can be defined for several different XHTML elements and the same XHTML
    element can have several different events associated.


    The name of each event is constructed with the prefix, followed by the English
    name of the action associated with the event. Thus, the event of clicking an element
    with the mouse is called onclick and the event associated with the action of moving
    the mouse is called onousemove.


    The most used events in traditional web applications are unload to wait for the
    page to load completely, the events onclick, onmouseover, onmouseout to control
    the mouse and onsubmit to control the submission of forms.


    The typical actions that a user performs on a web page can lead to a succession
    of events. Pressing for example on a button of type <input type = "submit"> triggers
    the events mousedown, onclick, onmouseupup and'
  - '[PAGE 131]


    onsubmit consecutively.


    # Event Handlers


    A JavaScript event by itself lacks utility. For events to be useful, JavaScript
    functions or code must be associated with each event. In this way, when an event
    occurs, the indicated code is executed, so the application can respond to any
    event that occurs during its execution.


    The functions or JavaScript code defined for each event are called "event handler"
    and since JavaScript is a very flexible language, there are several ways to indicate
    the handlers:


    +   - Handlers as attributes of the XHTML elements

    - Handlers as external JavaScript functions.

    - "Semantic" handlers.


    # Event handlers as XML attributes


    This is the simplest and least professional method of indicating the JavaScript
    code that should be executed when an event occurs. In this case, the code is included
    in an attribute of the XHTML element itself. In the following, we want to show
    a message when the user clicks on a button:


    ```

    <input type="button" value="Click me and you will see" onclick="alert (Thanks
    for clicking);" />

    ```


    In this method, XHTML attributes are defined with the same name as the events
    to be handled. The previous example only wants to control the event of clicking
    with the mouse, whose name is onclick. Thus, the XHTML element for whom you want
    to define this event must include an attribute called onclick.


    The content of the attribute is a text string that contains all the JavaScript
    instructions that are executed when the event occurs. In this case, the JavaScript
    code is very simple (alert (''Thanks for clicking''));), since it is only about
    describing a message.


    In this other example, when the user clicks on the <div> element a message is
    displayed and when the user hovers the mouse over the element, another message
    is displayed:


    ```

    <div onclick="alert (''You clicked with the mouse''); " onmouseover="alert

    ```'
