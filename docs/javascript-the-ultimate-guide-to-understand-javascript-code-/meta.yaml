- md: "\n# Chapter 13 Changing CSS using DOM\n\nCSS is used to style our web pages.\
    \ Almost everything you see on modern sites has been styled using CSS. Thus, it\
    \ becomes important for us to learn how to change CSS, which can help us to dynamically\
    \ change the styling of our web page. Doing so will make our web page more interactive,\
    \ giving the user a better experience. An example scenario – when a user is writing\
    \ in a text box, you can make textbox background red to indicate that input is\
    \ invalid, and green to indicate that it is valid. Have you ever noticed registering\
    \ on some sites, filling in the password, the password input border color changes\
    \ from red to orange and then to green to indicate the strength of password? This\
    \ is done with the help of JavaScript.\n\n## The element.style property\n\nWe\
    \ don’t directly assign a string containing CSS style definition to this property.\
    \ Instead, we assign values to “sub-properties” of this property. Technically,\
    \ this property is an object itself. You can access a property by using the convention\
    \ “element.style.propertyName”. The naming convention of these “sub-properties”\
    \ is almost the same as in CSS. For example: to change text color, we use the\
    \ property “color” in CSS. To access or modify it in DOM, we can use element.style.color.\
    \ Also, note that the naming convention of these CSS “sub-properties” in DOM is\
    \ camelcase not in kebab-case as in CSS, as the property ‘border-bottom’ becomes\
    \ ‘borderBottom.’\n\nThe values assigned to these “sub-properties” should be in\
    \ the same format as in CSS.\n\nDiscussed below are some of the important CSS\
    \ properties and how you can get and set them using DOM.\n\n### Changing an element’s\
    \ background\n\nYou can get or set the background of an element using the ‘background.’\
    \ sub-property of the ‘style.’ property of an element.\n\nSyntax:\n\n```javascript\n\
    var getVal = element.style.background// GET\nelement.style.background = set;//\
    \ SET\n```\n\nExample usage:\n\n```html\n<body>\n<p style='background:red' id='changeBg'>\n\
    This paragraph background color was originally red but will change to blue by\
    \ the JavaScript code!\n</p>\n<script>\nvar pElement = document.getElementById('changeBg');\n\
    \nconsole.log(pElement.style.background); // prints 'red' on the console screen\n\
    \n// now let's change its background to blue\npElement.style.background = 'blue';\n\
    \nconsole.log(pElement.style.background); // prints 'blue' on the console screen\n\
    </script>\n</body>\n```\n\nYou can directly assign values to the .background sub-property\
    \ in shortland format too, as you do in CSS. Example:\n\n`pElement.style.background\
    \ = \"#00ff00 url('image.png') no-repeat fixed center\";`\n\nNOTE: If a color\
    \ is specified in HEX format(#RRGGBB) in any of the CSS property, then while accessing\
    \ it from DOM it will appear in 'rgb(rrr, ggg, bbb)' format.\n\nExample:\n\n```javascript\n\
    var pElement = document.getElementById('changeBg');\npElement.style.background\
    \ = '#0000ff'; // HEX representation of blue color\nconsole.log( pElement.style.background\
    \ ); // prints ‘rgb(0, 0, 255)’ on the console screen\n```\n\n### Changing an\
    \ element’s text color\n\nYou can get or set the text color of an element using\
    \ the ‘color’ sub-property of the ‘style’ property of an element.\n\nSyntax:\n\
    \n```javascript\nvar getVal = element.style.color// GET\nelement.style.color =\
    \ set// SET\n```\n\n### Changing an element’s text size\n\nYou can get or set\
    \ the text size of an element using the ‘fontSize’ sub-property(note the camel\
    \ case here) of the ‘style’ property of an element.\n\nSyntax:\n\n```javascript\n\
    var getVal = element.style.fontSize = set// SET\nelement.style.fontSize = set//\
    \ SET\n```\n\nNOTE: When you assign a size to any size-related property like font\
    \ size, height width, etc., the sizes should be assigned along with their units\
    \ (px, em, hv, etc.). Not doing so will result in an error.\n\nExample:\n\n```javascript\n\
    element.style.fontSize = 40;// WRONG\nelement.style.fontSize = ‘40’;// WRONG\n\
    element.style.fontSize = ‘40px’;// RIGHT\n```\n\n### The ‘float’ property, an\
    \ exception in naming convention in DOM\n\nThe ‘float’ property in CSS is used\
    \ to specify the position of an element in the layout. But ‘float’ is also a reserved\
    \ word in JavaScript. Owing to this, we cannot use ‘float’ as a property name\
    \ in JavaScript. We use the name ‘cssFloat’ in JavaScript to refer to the ‘float’\
    \ property.\n\nSyntax:\n\n```javascript\nvar getVal = element.style.cssFloat//\
    \ GET\nelement.style.cssFloat = set// SET\n```\n\n### Modifying CSS style using\
    \ element.setAttribute() method\n\nThe .setAttribute() method is used to change\
    \ attributes of elements. We can change the CSS styling of an element by modifying\
    \ their ‘style’ attribute. This attribute’s value is plain CSS.\n\nSyntax:\n\n\
    ```javascript\nelement.setAttribute('style', 'PLAIN CSS HERE')\n```\n\nExample:\n\
    \n```javascript\nelement.setAttribute('style', 'background:red; height:15px');\n\
    ```\n\n### Modifying CSS style by adding a CSS class to it\n\nYou can also modify\
    \ CSS styling of an element through JavaScript by adding a predefined CSS class\
    \ to it. You can add classes to an element by adding them to ‘className’ property\
    \ of the element.\n\nSyntax for adding a CSS new class:\n\n```javascript\nelement.className\
    \ += ' newClassName'\n```\n\nNote that there must be a space present in the string\
    \ before the CSS class name as this property is merely a string containing all\
    \ the name of all the CSS classes of the element separated by a space.\n\nExample:\n\
    \n```html\n<body>\n<p style='background:red' id='changeClass'>\nThis paragraph’s\
    \ styling will be changed by JavaScript by adding a CSS class to it!\n</p>\n<style>\n\
    # our custom CSS class:\n.myClass {\nbackground:blue;\nheight:10px;\n}\n</style>\n\
    \n<script>\nvar pElement = document.getElementById('changeClass');\npElement.className\
    \ += ' myClass';\n</script>\n</body>\n```\n\nYou may use any way you like to change\
    \ the CSS styling, but doing it via CSS class names is considered a better practice.\
    \ This helps by making a more structured codebase similar to stateful architecture,\
    \ where each class conceptually represents a state. Consider the scenario of weak\
    \ and strong passwords as described in the beginning of this chapter. When the\
    \ password has weak strength, you can add a class named 'weakPassword' to the\
    \ password textbox and a class named 'mildPassword' when it is of mild strength.\
    \ This helps us to write more organized code.\n\n# Chapter 14 Pointers\n\nPointer\
    \ make certain tasks easier and they are fairly simple to use. A pointer is defined\
    \ as a variable that holds the address of another variable. Much like a variable,\
    \ before its use it must be defined.\n\n```cpp\ntype *var-name;\n```\n\nWhen using\
    \ a pointer, the type is whatever the type of the base type is. For example, if\
    \ my pointer is pointing to a double variable, my pointer must be a double. The\
    \ var-name is the name of your pointer. The asterisk must be used in order to\
    \ denote a pointer.\n\n```cpp\nint *int_point; // pointer to an integer\ndouble\
    \ *dou_point; // pointer to a double\nfloat *flo_point; // pointer to a float\n\
    char *ch_point; // pointer to character\n```\n\nThe following example shows the\
    \ information which is stored in a pointer, run the following code to get a better\
    \ understanding.\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main\
    \ () {\n    int variable = 10; // actual variable\n    int *ipointer; // pointer\
    \ variable\n    cout << \"Value of variable: \";\n    cout << variable << endl;\n\
    \    // access the value at address available\n    cout << \"Value of ipo: \"\
    ;\n    cout << *ipointer << endl;\n    return 0;\n}\n```\n\n# Null Pointers\n\n\
    A pointer that is assigned to NULL is referred to as a null pointer. A null pointer\
    \ is assigned at the time of declaration. The null pointer is generally constant\
    \ and holds a value of zero.\n\n# Chapter 15 Expressions and Operators\n\nAn expression\
    \ can be loosely defined as a block of code that yields a value. You've already\
    \ seen examples of simple expressions:\n\n- A literal value, such as 5, \"Hit\"\
    , true, null, and undefined. (Later in the book, you'll learn how to formulate\
    \ literal values for objects, arrays, and functions. These also constitute expressions.)\n\
    - A variable. For example, if you've declared a variable x, then an occurrence\
    \ of x in your code is an expression. The value of the expression is the current\
    \ value assigned to the variable.\n- A function call. The value of a function\
    \ call is the value returned by the function, or undefined if the function doesn't\
    \ return a value. For example, the function call parseFloat(str) is an expression\
    \ that has a numeric value.\n\n# Note\n\nWhen an expression forms the left side\
    \ of an assignment statement, such as the x in x = 5;, it's more accurate to say\
    \ that the expression yields the location or address of a value. The value at\
    \ that location is replaced by a new value through the assignment.\n\nDon't confuse\
    \ an expression with a statement. A statement is a basic unit of JavaScript code,\
    \ usually terminated with a semicolon.\n\nSome statements do not contain any expressions,\
    \ such as a variable declaration:\n\n```javascript\nvar x;\n```\n\nAn expression\
    \ often forms part of a statement, such as the occurrence of the variable valid\
    \ in the following if statement:\n\n```javascript\nif (valid)\n/* do something...\
    \ */\n```\n\nAnd, it's legal for any expression to appear as a complete statement,\
    \ although it might not serve a useful purpose:\n\n```javascript\n/* this literal\
    \ string expression forms a legal but useless statement: */\n\"Hello\";\n```\n"
  mdcn: "\n\n# 第 13 章 使用 DOM 修改 CSS\n\nCSS 用于为我们的网页进行样式设置。现代网站上你看到的几乎所有内容都是使用 CSS\
    \ 进行样式化的。因此，学习如何更改 CSS 对我们来说非常重要，这可以帮助我们动态地更改网页的样式。这样做会让我们的网页更具交互性，为用户提供更好的体验。一个示例场景——当用户在文本框中输入内容时，你可以让文本框背景变为红色以表示输入无效，变为绿色以表示输入有效。你是否注意到在某些网站上注册时，填写密码后，密码输入框的框颜色会从红色变为橙色，然后变为绿色，以表示密码强度？这是通过\
    \ JavaScript 实现的。\n\n## element.style 属性\n\n我们并不直接向此属性分配一个包含 CSS 样式定义的字符串。相反，我们向该属性的“子属性”赋值。从技术上讲，这个属性本身就是一个对象。你可以通过“element.style.propertyName”的约定来访问属性。这些“子属性”的命名约定与\
    \ CSS 中的几乎相同。例如：要更改文本颜色，我们在 CSS 中使用 `color` 属性。在 DOM 中访问或修改它时，我们可以使用 `element.style.color`。此外，注意\
    \ DOM 中这些 CSS “子属性”的命名约定是驼峰命名（camelcase），而不是 CSS 中的横线命名（kebab-case），例如属性 `border-bottom`\
    \ 变成了 `borderBottom`。\n\n给这些“子属性”的值应与 CSS 中的格式相同。\n\n下面讨论了一些重要的 CSS 属性以及你如何使用\
    \ DOM 获取和设置它们。\n\n### 修改元素的背景颜色\n\n你可以使用元素 `style` 属性的 `background` 子属性获取或设置元素的背景。\n\
    \n语法：\n\n```javascript\nvar getVal = element.style.background// 获取\nelement.style.background\
    \ = set;// 设置\n```\n\n示例用法：\n\n```html\n<body\n<p style='background:red' id='changeBg'>\n\
    此段落的背景颜色原本是红色的，但将通过 JavaScript 代码变为蓝色！\n</p>\n<script>\nvar pElement = document.getElementById('changeBg');\n\
    \nconsole.log(pElement.style.background); // 在控制台屏幕打印 'red'\n\n// 现在让它的背景变为蓝色\n\
    pElement.style.background = 'blue';\n\nconsole.log(pElement.style.background);\
    \ // 在控制台屏幕打印 'blue'\n</script>\n</body>\n```\n\n你也可以像在 CSS 中那样使用短格式直接为 `.background`\
    \ 子属性赋值。示例：\n\n`pElement.style.background = \"#00ff00 url('image.png') no-repeat\
    \ fixed center\";`\n\n注意：如果在任何 CSS 属性中以 HEX 格式(#RRGGBB) 指定颜色，那么当从 DOM 访问它时，它将以\
    \ 'rgb(rrr, ggg, bbb)' 格式出现。\n\n示例：\n\n```javascript\nvar pElement = document.getElementById('changeBg');\n\
    pElement.style.background = '#0000ff'; // 蓝色的 HEX 表示\nconsole.log( pElement.style.background\
    \ ); // 在控制台屏幕打印 ‘rgb(0, 0, 255)’\n```\n\n### 修改元素的文本颜色\n\n你可以使用元素 `style` 属性的\
    \ `color` 子属性获取或设置元素的文本颜色。\n\n语法：\n\n```javascript\nvar getVal = element.style.color//\
    \ 获取\nelement.style.color = set// 设置\n```\n\n### 修改元素的字体大小\n\n你可以使用元素 `style`\
    \ 属性的 `fontSize` 子属性（注意这里是驼峰命名）获取或设置元素的字体大小。\n\n语法：\n\n```javascript\nvar getVal\
    \ = element.style.fontSize = set// 设置\nelement.style.fontSize = set// 设置\n```\n\
    \n注意：向任何与大小相关的属性（如字体大小、高度、宽度等）赋值大时，应连同其单位（px, em, hv, 等）一起赋值。这样做会导致错误。\n\n示例：\n\
    \n```javascript\nelement.style.fontSize = 40;// 错误\nelement.style.fontSize = ‘40’;//\
    \ 错误\nelement.style.fontSize = ‘40px’;// 正确\n```\n\n### ‘float’ 属性，DOM 命名约定中的一个例外\n\
    \nCSS 中的 `float` 属性用于指定元素在布局中的位置。但 `float` 也是 JavaScript 中的一个保留字。由于由于，我们不能在 JavaScript\
    \ 中将 `float` 作为属性名。我们在 JavaScript 中使用 `cssFloat` 名称来指代 `float` 属性。\n\n语法：\n\n\
    ```javascript\nvar getVal = element.style.cssFloat// 获取\nelement.style.cssFloat\
    \ = set// 设置\n```\n\n### 使用 element.setAttribute() 方法修改 CSS 样式\n\n`.setAttribute()`\
    \ 方法用于更改元素的属性。我们可以通过修改元素的 `style` 属性来更改其 CSS 样式。该属性的值是纯 CSS。\n\n语法：\n\n```javascript\n\
    element.setAttribute('style', '这里是纯 CSS')\n```\n\n示例：\n\n```javascript\nelement.setAttribute('style',\
    \ 'background:red; height:15px');\n```\n\n### 通过添加 CSS 类修改 CSS 样式\n\n你还可以通过 JavaScript\
    \ 为元素添加预定义的 CSS 类来修改其 CSS 样式。你可以通过将类添加到元素的 `className` 属性中来实现。\n\n添加新 CSS 类的语法：\n\
    \n```javascript\nelement.className += ' newClassName'\n```\n\n注意，在 CSS 类名之前的字符串中必须存在空格，因为该属性仅仅是包含由空格分隔的所有元素所有\
    \ 类 类名的字符串。\n\n示例：\n\n```html\n<body>\n<p style='background:red' id='changeClass'>\n\
    此段落的样式将通过 JavaScript 添加一个 CSS 类来更改！\n</p>\n<style>\n# 我们的自定义 CSS 类:\n.myClass\
    \ {\nbackground:blue;\nheight:10px;\n}\n</style>\n\n<script>\nvar pElement = document.getElementById('changeClass');\n\
    pElement.className += ' myClass';\n</script>\n</body>\n```\n\n你可以使用任何喜欢的方法来更改\
    \ CSS 样式，但通过 CSS 类名进行更改被认为是更好的实践。这有助于使代码库更具结构化，类似于状态架构，其中每个类在概念上代表一个状态。考虑本章开头描述的弱密码和强密码的场景。当密码强度弱时，你可以为密码文本框添加一个名为\
    \ `weakPassword` 的类，当强度为中等时添加一个名为 `mildPassword` 的类。这有助于我们编写更有组织的代码。\n\n# 第 14\
    \ 章 指针\n\n指针使某些任务变得更简单，而且它们非常容易使用。指针被定义持有另一个变量地址的变量。与变量一样，在使用之前必须定义它。\n\n```cpp\n\
    type *var-name;\n```\n\n当使用指针时，类型取决于基础类型的类型。例如，如果我的指针指向一个 `double` 变量，那么我的指针必须是\
    \ `double`。`var-name` 是你的指针的名称。必须使用星号来表示指针。\n\n```cpp\nint *int_point; // 指向整数的指针\n\
    double *dou_point; // 指向双数的指针\nfloat *flo_point; // 指向浮点的指针\nchar *ch_point; //\
    \ 指向字符的指针\n```\n\n下面的示例显示了存储在指针中的信息，运行以下代码以便理解。\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main () {\n    int variable = 10; // 实际变量\n    int *pointer;\
    \ // 指针变量\n    cout << \"变量的值: \";\n    cout << variable << endl;\n    // 访问地址的值\n\
    \    cout << \"指针的值: \";\n    cout << *pointer << endl;\n    return 0;\n}\n```\n\
    \n# 空指针\n\n赋值为 NULL 的指针被称为空指针。空指针在声明时赋值。空指针通常是常量且其值为零。\n\n# 第 15 章 表达式和运算符\n\n\
    表达式可以粗略定义为产生值的代码块。你已经看到了一些简单表达式的示例：\n\n- 字面量值，例如 5、\"Hit\"、true、null 和 undefined。（在书的后面你将学习如何构造对象、数组和函数的字面量。这些也构成表达式。）\n\
    - 变量。例如，如果你声明了一个变量 x，那么代码中出现的 x 就是一个表达式。该表达式的值是赋值给变量的当前值。\n- 函数调用。函数调的值是返回值，如果函数没有返回值，则是\
    \ undefined。例如，parseFloat(str) 是一个具有数值值的表达式。\n\n# 注意\n\n当表达式形成赋值语句的左侧时（例如 `x =\
    \ 5;` 中的 `x`），更准确的说是该表达式产生了值的位置或地址。该位置的值通过赋值替换为新值。\n\n不要混淆表达式和语句。语句是 JavaScript\
