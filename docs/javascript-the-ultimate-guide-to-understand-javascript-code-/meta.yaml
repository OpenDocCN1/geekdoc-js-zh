    的 `age` 上，这将 `36` 成为 `age` 的新值。此外，我们可以在 `age+=10` 语句中使用复合赋值运算符如 `+=`，将变量的值增加 `10`。我们也可以将相同的逻辑用于减法、除法和乘法等操作。


