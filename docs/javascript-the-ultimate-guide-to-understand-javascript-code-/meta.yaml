  md: '# Chapter 12 Changing the content of HTML elements using DOM


    We need to change the content of the HTML elements very often for making a dynamic
    web application or website. Some example scenarios include:


    +   - Giving user feedback. Replacing an HTML element’s content instead of using
    the ‘alert’ function is a better alternative to give feedback, as you can modify
    how an element looks and thus make your feedback display better visually. This
    will, in turn, lead to a more pleasurable user experience.

    - Have you seen a live clock, or countdown, on a web application? They both replace
    their HTML element’s content when the unit of time they function on by.

    - Changing a page’s content on a button click without refreshing. The ‘innerHTML’
    property


    This is perhaps the easiest and the most frequently used way of changing the content
    of an HTML element. This property of an element''s object in the DOM represents
    the current content of that element, and can be used to get or set the content
    of that element. If a value is assigned to this property of an element’s object,
    then that element’s content changes to the newly assigned value.


    Syntax:


    ```

    elementObject.innerHTML = ‘new value’; // setting

    var x = elementObject.innerHTML; // getting

    ```


    Note that this property represents everything within the element’s tag, even it’s
    children and sub-children.


    Example demonstrating getting an element’s content:


    ```

    <body>


    <div id=''outer''>


    <div id=''inner''>

    ```'
