    \ as you pursue mastery of this important scripting language especially if your\
    \ intention is to learn JavaScript so that you can create dynamic webpages and\
    \ responsive web applications and websites.\n\n## Chapter 12 Changing the content\
    \ of HTML elements using DOM\n\nWe need to change the content of the HTML elements\
    \ very often for making a dynamic web application or website. Some example scenarios\
    \ include:\n\n- Giving user feedback. Replacing an HTML element’s content instead\
    \ of using the ‘alert’ function is a better alternative to give feedback, as you\
    \ can modify how an element looks and thus make your feedback display better visually.\
    \ This will, in turn, lead to a more pleasurable user experience.\n- Have you\
    \ seen a live clock, or countdown, on a web application? They both replace their\
    \ HTML element’s content when the unit of time they function on by.\n- Changing\
    \ a page’s content on a button click without refreshing. The ‘innerHTML’ property\n\
    \nThis is perhaps the easiest and the most frequently used way of changing the\
    \ content of an HTML element. This property of an element's object in the DOM\
    \ represents the current content of that element, and can be used to get or set\
    \ the content of that element. If a value is assigned to this property of an element’s\
    \ object, then that element’s content changes to the newly assigned value.\n\n\
    Syntax:\n\n```\nelementObject.innerHTML = ‘new value’; // setting\nvar x = elementObject.innerHTML;\
    \ // getting\n```\n\nNote that this property represents everything within the\
    \ element’s tag, even it’s children and sub-children.\n\nExample demonstrating\
    \ getting an element’s content:\n\n```html\n<body>\n\n<div id='outer'>\n\n<div\
    \ id='inner'>\nHey there\n</div>\n</div>\n<script>\nvar innerContent = document.getElementById('inner').innerHTML;\n\
    var outerContent = document.getElementById('outer').innerHTML;\n\nconsole.log(\
    \ innerContent );\n\nconsole.log( outerContent );\n</script>\n</body>\n```\n\n\
    The above code produces the following output on the console screen:\n\nHey there\n\
    <div id=\"inner\">\nHey there\n</div>\n\nAs you can see, the output contains the\
    \ white spaces and the tabs.\n\nTIP: If you wish to get rid of the extra white\
    \ spaces and tab spaces at the start and end of the content you can use the .trim()\
    \ method from the string class on them!\n\nExample demonstrating the changing\
    \ of an element’s content:\n\n```html\n<body>\n<div id='outer'>\n<div id='inner'>\n\
    Hey there\n</div>\n</div>\n\n<script>\nvar innerElement = document.getElementById('inner');\n\
    innerElement.innerHTML = 'Hola amigos';\n\n// the content of <div> with id ‘inner’\
    \ has been changed to ‘Hola amigos’\n</script>\n</body>\n```\n\n## ‘textContent’\
    \ property\n\nThis property is almost same as the ‘.innerHTML’ property. The difference\
    \ between this property and ‘.innerHTML.’ is that this property is only used to\
    \ get or set the textual content (meaning the children and sub-children element’s\
    \ tag name is not included when getting the content of the element), whereas in\
    \ the case of the ‘.innerHTML’ property, the full content of the element including\
    \ the children and sub-children element’s tag names and attribute were also returned.\n\
    \nLet us understand this by using the same example as we used in the case of the\
    \ ‘.innerHTML.’ property – but instead, we will use ‘.textContent.’ property in\
    \ place of the ‘.innerHTML’ property here.\n\n```html\n<body>\n\n<div id='outer'>\n\
    \n<div id='inner'>\n\nHey there\n</div>\n</div>\n<script>\nvar innerContent =\
    \ document.getElementById('inner').textContent;\nvar outerContent = document.getElementById('outer').textContent;\n\
    \nconsole.log( innerContent );\nconsole.log( outerContent );\n</script>\n</body>\n\
    ```\n\nThe above code produces the following output on the console screen:\n\n\
    Hey there\n\nHey there\n\nThe white spaces and the tab spaces at the start and\
    \ at the ending are included in the output of this result as well, but note that\
    \ the <<div>> tag is not!\n\nAnother difference between the two properties is\
    \ that the content that we get using the ‘innerHTML’ property has the characters\
    \ ‘&’, ‘<’, or ‘’ replaced by ‘&amp;', ‘&lt; and ‘&gt;’ respectively, whereas\
    \ in the content obtained using ‘textContent’ property these characters remain\
    \ as they are.\n\nThe setting action of both properties will work the same. Here\
    \ is an example:\n\n```html\n<body>\n<div id='outer'>\n<div id='inner'>\nHey there\n\
    </div>\n</div>\n<script>\nvar innerElement = document.getElementById('inner');\n\
    innerElement.textContent = 'Hola amigos';\n\n// the content of <div> with id ‘inner’\
    \ has been changed to ‘Hola amigos’\n</script>\n</body>\n```\n\nYet another major\
    \ difference between the two properties is that when you set an element’s content\
    \ using .innerHTML property, it is interpreted as HTML code whereas in the case\
    \ of .textContent, it is interpreted as raw text.\n\nExample:\n\n```html\n<body>\n\
    \n<div id='outer'>\n\n<div id='inner'>\n\nHey there\n</div>\n</div>\n<script>\n\
    var innerElement = document.getElementById('inner');\n\n// no alert box will pop\
    \ up in this case:\n    innerElement.textContent = \"<script>alert('hey')</script>\"\
    ;\n    // A alert box will pop up in this case:\n    innerElement.innerHTML =\
    \ \"<script>alert('hey')</script>\";\n\n// this was because, in the latter, the\
    \ text was interpreted as HTML code\n</script>\n\n</body>\n```\n"
