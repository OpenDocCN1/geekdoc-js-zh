    type of data, such as a string or an integer. Arrays are going to be used in order
    to help a computer program, or your coding language, organize data so that a set
    of values that are related is to be sorted or searched through


    No matter what kind of coding language you decide to work with, you will find
    that keeping the data and the objects organized is going to be important. If you
