    # Boolean Operators


    The boolean operators return all boolean values, and are of two types: relational
    and logical.


    ## Relational Operators


    == and != are the standard equality and inequality operators. For example, if
    a, b, and c are declared and initialized as follows,


    ```javascript

    var a = 1;

    var b = 1;

    var c = 2;

    ```


    then:


    | a == b | true |

    | a == c | false |

    | b != c | true |


    The problem with the standard equality and inequality operators is that if the
    two operands are not of the same type, the operator follows a complex set of somewhat
    arbitrary and hard-to-remember rules that determine whether a conversion takes
    place, which operand is converted, and the way a conversion is performed.


    Although you could make it a practice to use operands of the same type with the
    standard operators, a safer approach is to use the strict equality and inequality
    operators, === and !=, which do not perform type conversions. The === returns
    true only if all three of the following conditions are true:


    - Both operands have the same type.

    - Both operands have the same value.

    - Neither operand is NaN.


    The !== returns true if one or more of these conditions fails.


    Provided that both operands have the same data type, you can use the strict equality
    and inequality operators with any type—for example:


    | 5 === 5 | true |

    | 5 !== 10 | true |

    | "abc" === "abc" | true |

    | "ABC" === "abc" | false |

    | true === true | true |

    | true !== false | true |

    | undefined === undefined | true |

    | null === null | true |

    | NaN === NaN | false |


    You can compare two strings or two numbers using the comparison operators:


    | < less than | 5 < 12 (true), "5" < "12" (false) |

    | <= less than or equal | 5 <= 5 (true) |

    | > greater than | "abc" > "ABC" (true) |

    | >= greater than or equal | "1" >= "A" (false) |


    Strings are compared alphabetically, based on the Unicode values of the characters.
    For example, within the set of standard ASCII characters, all numbers are less
    than the letters, and all capital letters are less than the lowercase letters.


    Numbers are of course compared numerically. When comparing numbers, if either
    operand is NaN, the operator always returns false.


    JavaScript doesn''t provide strict versions of the comparison operators. If you
    supply operands that are neither both strings nor both numbers, the comparison
    operators make conversions according to fairly complex and arbitrary rules. Again,
    to avoid errors and to create clear code, it''s best to first do any necessary
    conversions explicitly so that you can make both operands the same type.


    # Logical Operators


    Sometimes you need to express a truth condition that is more complex than a simple
    relational test. For example, in code searches for an item, you might want to
    display the results only if the item was found (i.e. the boolean variable is true)
    and the user wants results shown (i.e. the boolean variable show true). This could
    be expressed using the logical AND operator, &&


    ```javascript

    if (found && showResults)

    ```


    ```javascript

    /* then display the search results... */

    ```


    The following are the three logical operators:


    | Op | Description | Example |

    |---|---|---|

    | && | AND (true if both operands are true) | a && b |

    | || | OR (true if either or both operands are true) | a || b |

    | ! | NOT (true if the single operand is false, false if the operand is true)
    | !a |


    If an operand is not boolean, it''s converted to boolean according to the straightforward
    rules that were explained in Any type to boolean.


    Several logical operands can be used in a single expression, as in the following
    example:


    !(a && b) === (!a || !b)


    This particular expression is always true regardless of the truth values of its
    operands (it''s from Morgan''s laws). Recall from the table of Operator Precedence
    that ! has the highest precedence, then ===, then &&, but that the parentheses
    override the default order of evaluation.


    # Short Circuiting


    When an && expression is evaluated, if the first operand is false, the second
    operand is guaranteed not to be evaluated. This policy can be useful. Likewise,
    when an || expression is evaluated, if the first operand is true, the second operand
    is guaranteed not to be evaluated.


    ## Note About the && and || Operators


    The && and || operators do not necessarily return a boolean value. Consider an
    && expression:


    A && B


    If A is false, the expression simply returns A. If A is truthy, the expression
    returns B. Now consider an || expression:


    A || B


    If A is true, the expression returns A. If A is falsy, it returns B. Say, for
    example, that you want to use a default value if x is zero. You could accomplish
    this through the following compact expression:


    ```javascript

    x = x || 100;

    ```


    # Assignment Operators


    The standard assignment operator (=) has the following form,

    lval = expression;

    where the left operand, lval, is assigned the value of the right operand, expression.
    For example:


    x = 2 * y + z + 5;


    Like the operand of the ++ -- operator explained previously, the left operand
    of the assignment operator must be an lvalue—that is, an expression that specifies
    a data item whose value can be changed, such as a variable. (You''ll learn about
    two other kinds of lvalues later in the book: a property of an object and an element
    of an array.)


    The assignment operator is an example of an operator that has an important side
    effect (namely, making the assignment). Like all operators, it also returns a
    value, which is simply the value of the right operand. This method of evaluation,
    coupled with the operator''s right-to-left associativity, allows you to chain
    assignments like this:


    a = b = c = 5;


    When JavaScript evaluates this expression, it first assigns 5 to c, then takes
    the value of that assignment (namely 5) and assigns it to b, then takes the value
    of that assignment (5 again) and assigns it to a. As a result, variables get set
    to 5.


    JavaScript also provides a set of shortcut operators that perform an operation
    and make an assignment. Here are the most common ones:


    | Operator | Example | Equivalent |

    | --- | --- | --- |

    | += | x += 5; s += " ft"; | x = x + 5; s = s + " ft"; |

    | -= | x -= 5; | x = x - 5; |

    | *= | x *= 10; | x = x * 10; |

