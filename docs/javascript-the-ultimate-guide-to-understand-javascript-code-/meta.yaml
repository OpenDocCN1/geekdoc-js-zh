    # Chapter 13 Changing CSS using DOM


    CSS is used to style our web pages. Almost everything you see on modern sites
    has been styled using CSS. Thus, it becomes important for us to learn how to change
    CSS, which can help us to dynamically change the styling of our web page. Doing
    so will make our web page more interactive, giving the user a better experience.
    An example scenario – when a user is writing in a text box, you can make textbox
    background red to indicate that input is invalid, and green to indicate that it
    is valid. Have you ever noticed registering on some sites, filling in the password,
    the password input border color changes from red to orange and then to green to
    indicate the strength of password? This is done with the help of JavaScript.


    The element.style property


    We don’t directly assign a string containing CSS style definition to this property.
    Instead, we assign values to “sub-properties” of this property. Technically, this
    property is an object itself. You can access a property by using the convention
    “element.style.propertyName”. The naming convention of these “sub-properties”
    is almost the same as in CSS. For example: to change text color, we use the property
    “color” in CSS. To access or modify it in DOM, we can use element.style.color.
    Also, note that the naming convention of these CSS “sub-properties” in DOM is
    camelcase not in kebab-case as in CSS, as the property ‘border-bottom’ becomes
    ‘borderBottom.’


    The values assigned to these “sub-properties” should be in the same format as
    in CSS.


    Discussed below are some of the important CSS properties and how you can get and
    set them using DOM.


    Changing an element’s background


    You can get or set the background of an element using the ‘background.’ sub-property
    of the ‘style.’ property of an element.


    Syntax:


    ```

    var getVal = element.style.background// GET

    element.style.background = set;// SET

    ```


    Example usage:'
  - '[PAGE 77]


    ```

    <body>

    <p style=''background:red'' id=''changeBg''>

    This paragraph background color was originally red but will change to blue by
    the JavaScript code!

    </p>

    <script>

    var pElement = document.getElementById(''changeBg'');


    console.log(pElement.style.background); // prints ''red'' on the console screen


    // now let''s change its background to blue

    pElement.style.background = ''blue'';


    console.log(pElement.style.background); // prints ''blue'' on the console screen

    </script>

    </body>

    ```


    You can directly assign values to the .background sub-property in shortland format
    too, as you do in CSS. Example:


    pElement.style.background = "#00ff00 url(''image.png'') no-repeat fixed center";


    NOTE: If a color is specified in HEX format(#RRGGBB) in any of the CSS property,
    then while accessing it from DOM it will appear in ''rgb(rrr, ggg, bbb)'' format.


    Example:


    ```

    var pElement = document.getElementById(''changeBg'');

    ```


    ```

    pElement.style.background = ''#0000ff''; // HEX representation of blue color

    ```'
