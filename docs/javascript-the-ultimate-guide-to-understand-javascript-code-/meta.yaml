    \ In colors, you can set it in RGB or HEX code.\n\nThey are many types of CSS\
    \ selectors and selection methods. For example, you can use the * (asterisk) as\
    \ a global selector. You can also use the element to select a specific element\
    \ in case there are multiple.\n\nNOTE: This is not a CSS book and CSS is therefore\
    \ beyond the scope of this book. What this chapter sought to do is give you a\
