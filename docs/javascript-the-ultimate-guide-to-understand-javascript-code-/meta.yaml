    ## 逻辑运算符的短路


    `&&` 和 `||` 被称为逻辑运算符。它们用于以特定方式持有多种类型的值。它们会将左侧的值转换为布尔类型以便判断，尽管这取决于运算符和生成结果的类型，但总是恢复左侧或右侧的值。`||`
    运算符在可以转换为 true时向左侧返回值，并且


    ```

    console.log(null || "user")

    // → user

    console.log("Kate" || "user")

    // → Kate

    ```


    此函数用于返回其默认值，并作为空值的内部替换。字符串和数字到布尔的转换规则表明，0、NaN 和空字符串 ("") 被视为 false，而其他值均为 true。`&&`
    运算符的操作相同，但方向相反。当左侧的值可以转换为 false 时，返回该值，或者将值发送到右侧。例如，`true || -1` 输出 -1。两个运算符只有在需要时才会评估右侧的值。例如，我们有如下值
    `true || X`，X 的值将是 true且不会考虑它。同样的规则适用于 `false && X`，它是 false 并将忽略它。你可以将此过程称为短路求值。


