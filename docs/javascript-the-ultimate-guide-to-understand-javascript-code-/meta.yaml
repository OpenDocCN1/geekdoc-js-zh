    # Modifying CSS style using element.setAttribute() method


    The .setAttribute() method is used to change attributes of elements. We can change
    the CSS styling of an element by modifying their ‘style’ attribute. This attribute’s
    value is plain CSS.


    Syntax:


    ```

    element.setAttribute(''style'', ''PLAIN CSS HERE'')

    ```


    Example:


    ```

    element.setAttribute(''style'', ''background:red; height:15px'');

    ```


    Modifying CSS style by adding a CSS class to it


    You can also modify CSS styling of an element through JavaScript by adding a predefined
    CSS class to it. You can add classes to an element by adding them to ‘className’
    property of the element.


    Syntax for adding a CSS new class:


    ```

    element.className += '' newClassName''

    ```


    Note that there must be a space present in the string before the CSS class name
    as this property is merely a string containing all the name of all the CSS classes
    of the element separated by a space.


    Example:


    ```

    <body>

    <p style=''background:red'' id=''changeClass''>

    This paragraph’s styling will be changed by JavaScript by adding a CSS class to
    it!

    </p>

    <style>

    # our custom CSS class:

    .myClass {

    background:blue;

    height:10px;

    }

    </style>

    ```'
