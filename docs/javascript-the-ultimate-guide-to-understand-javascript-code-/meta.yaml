    # Short Circuiting


    When an && expression is evaluated, if the first operand is false, the second
    operand is guaranteed not to be evaluated. This policy can be useful: the first
    operand can test whether some object exists before the first operand attempts
    to use that object, avoiding the runtime error that would occur if you attempted
    to use a non-existent object.


    Likewise, when an || expression is evaluated, if the first operand is true, the
    second operand is guaranteed not to be evaluated.


    # Note


    The Truth About the && and || Operators


    The && and || operators do not necessarily return an actual boolean value. Consider
    an && || expression:


