  md: '# Chapter 17 Closures and Callbacks in JavaScript


    The chapter will deal with two very basic concepts of JavaScript, closures and
    callbacks. They allow us to make our code concise, crisp and creative. You will
    encounter these concepts in your development repeatedly. Let us have a look.


    Closures in JavaScript


    Closures, in their most basic form, are inner functions that have access to variables
    from outside its scope. The concept of closures requires a legit understanding
    of nested functions.


    Nested functions are “functions containing functions”. Let’s look at an example
    to expand upon the point:


    ```

    // function 1 is an outer function

    function outer(){ //definition of function 1

    //body of outer()

    //function 2 is an inner function

    function inner(){//definition of function 2

    //body of inner()

    }

    }

    ```


    In above example, function 2( inner() ) resides inside the body of function 1(outer())
    and hence is called a nested function. Similarly, we can have more than one nested
    function inside an outer function.


    ```

    //function 1 is an outer function

    function outer(){ //definition of function 1

    //body of outer()

    //function inner1 is an inner function

    function inner1(){//definition of inner function 1

    //body of inner()

    }

    //function inner2 is an inner function

    ```'
