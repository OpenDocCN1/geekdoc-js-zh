    # Variables


    One of the fundamental aspect of JavaScript, and any programming language in general,
    is the concept of variables. A variable is a way to declare and store information
    which can later be used. This information can vary with the circumstances and
    hence the name variable.


    Let us look at the following statement.


    ```

    var name = "Martin";

    ```


    In plain language this is the same as saying "My name is Martin". The keyword
    var is JavaScript speak for "create a variable", or in the programming dialect,
    "declare a variable". What follows is the name of the variable which can be anything
    we choose with certain limits. Assigning a value to the variable is done with
    = sign, which is not immediately necessary, as this can happen later. We can declare
    an undefined variable in one statement and assign it a value in a later statement.
    For example:


    ```

    var name;

    name = "Martin";

    ```


    As mentioned previously, variable names can be anything, like name, abc, R2D2,
    with a few rules. Variable names can contain letters, numbers, dollar sign ($),
    or lower line (_), special characters are not allowed. Furthermore a variable
    name cannot begin with a number, any other allowed value is acceptable. Finally,
    variable names are case-sensitive, meaning that the interpreter in the web browser
    makes a distinction between uppercase and lowercase letters, making ''score''
    different from ''Score''.


    Note: Although we can use almost anything for a variable name, it is wise to use
    names which are meaningful as will this will help us and other programmers to
    better understand the written code.


    # Variable Types


    Based on the type of data, variables can come in different flavors. The three
    most basic types are number, string, and boolean.


    A number variable is represented by a numeric character. This variable can accept
    whole integers, negative integers and fractional integers. Numbers frequently
    used in calculations, hence our number variables are often included in mathematical
    operations. The following statement declares a variable name age and assigns it
    a value of 35.


    ```

    var age = 35;

    ```


    A string variable is used to represent any series of letters like words or sentences.
    Strings are represented as a series of characters enclosed within quotation marks,
    with the quotation marks signaling to the interpreter that what follows is a string
    variable. JavaScript allows us to use both the double quotes ("") or the single
    quote ('''') marks, but we have to be mindful to use the same type of quotation
    mark.


    ```

    var location = "California";

    ```


    A boolean variable is rather simpler as it can accept only one of two values:
    true or false. This variable is used when we create JavaScript programs that we
    want to intelligently react to user actions.


    # User Variables


    JavaScript would not be fun if it didn''t allow us to share our thoughts and create
    or alter the variables dynamically. One of the simplest ways to "give" our input
    is to use the prompt() command.


    ```

    var name = prompt("What is your name?", "");

    ndocument.write(name);

    ```


    ![](img/40b8c4fe8ca3cd2daa674817ca7d8052_13_0.png)


    Image 3. A custom prompt dialog box


    The result of the prompt() command is a dialog box. Instead of just displaying
    a message like the alert dialog box, the prompt dialog box can also receive an
    answer. Hence, in the syntax for a prompt dialog box it is necessary to provide
    two arguments between the parentheses separated with a comma. The first argument
    is the prompt text that is displayed in the box, while the second argument is
    the default value for the text box, and consequently, the variable.


    In the example above, the prompt text displayed in the box will be "What is your
    name?" and the default value presented in the box will be empty, as is obviously
    no content between the quotation marks. Once we type in something in the box and
    either click OK or press the Enter key, the variable receives the value that was
    entered in the field. Consequently, the name will be displayed on the web page.
    Otherwise, if we click on Cancel, press the Esc key or close the prompt box, the
    returned value would be empty and there would be no text on the screen.


    Note: Instead of prompt() we can also use the more formal window.prompt command.


    # Operators


    Storing information in a variable is a first step, the beauty of programming is
    the ability to manipulate this information in many creative ways. For this, JavaScript
    provides different operators that allow us to modify data. An operator, represented
    by a symbol or a word, is something that can change one or more values into something
    else. The type of operators available are different based on the data type.


    # Mathematical Operators


    The basic mathematical operators like (+), subtraction (-), multiplication (*)
    and division (/) are readily available in JavaScript. They can be used in independent
    statements or when declaring variables. For example, by "operating" with the variables
    currentYear and yearofBirth, we can determine the value of the variable age.


    ```

    var currentYear = 2015;

    var yearofBirth = 1979;

    var age = currentYear - yearofBirth;

    document.write(age);

    ```

