  md: '# Chapter 9 JavaScript Variables


    A variable is a name for a storage location. From its name, it can vary. Variables
    hold values that can vary. In JavaScript, we use the var keyword to declare variables.
    Each variable must be given a unique name. You are allowed to assign a value to
    a variable during the time of its declaration. This can be done using the equals
    to symbol (=).


    The following is the syntax for declaring and initializing variables in JavaScript:


    ```

    var variable-name;

    ```


    ```

    var variable-name = value;

    ```


    Here are valid examples of this:


    ```

    var x = 1; // variable storing a numeric value

    var y = ''nicholas''; // variable storing a string value

    var z; // declare a variable and not assign a value

    ```


    We have used the var keyword to declare three variables. Two of the variables
    have been assigned a value. Note that this has been done at the time of their
    declaration.


    We can also declare more than one variable in a single line and separate them
    by a comma (,). This is demonstrated below:


    ```

    var x = 1, y = ''nicholas''; z;

    ```


    Note that in JavaScript, one can declare a variable without using the var keyword.
    However, if you do this, ensure that you assign a value to the variable immediately.
    This is demonstrated below:


    ```

    x = 1;

    ```


    ```

    y = ''nicholas'';

    ```


    However, I don''t recommend that you declare any variable without the use of var
    keyword. This is because you may end up overriding a global variable without knowing.


    If a variable is declared without the var keyword, it automatically becomes a
    global variable, regardless of where it has been declared.


    Here are the rules that govern the declaration of variable names in JavaScript:'
