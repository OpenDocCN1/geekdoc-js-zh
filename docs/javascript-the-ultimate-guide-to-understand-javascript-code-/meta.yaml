    ```


    ```

    document.write("<p>JavaScript is starting to make a little sense.</p>");

    ```


    ![](img/40b8c4fe8ca3cd2daa674817ca7d8052_11_0.png)


    What we can see from the results is that the previously empty document, now

    has one paragraph of text. Following the previous interpretation of how

    JavaScript works and from the web browser results we can correctly assume

    that the document.write keyword commands the browser to write directly

    to the web page. Similar to alert(), it writes whatever is placed between the

    opening and closing brackets.


    # Variables


    One of the fundamental aspect of JavaScript, and any programming language

    in general, is the concept of variables. A variable is a way to declare and store

    information which can later be used. This information can vary with the

    circumstances and hence the name variable.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Let us look at the following statement.


    ```

    var name = "Martin";

    ```


    In plain language this is the same as saying "My name is Martin". The keyword
    var is JavaScript speak for "create a variable", or in the programming dialect,
    "declare a variable". What follows is the name of the variable which can be anything
    we choose with certain limits. Assigning a value to the variable is done with
    = sign, which is not immediately necessary, as this can happen later. We can declare
    an undefined variable in one statement and assign it a value in a later statement.
    For example:


    ```

    var name;

    name = "Martin";

    ```


    As mentioned previously, variable names can be anything, like name, abc, R2D2,
    with a few rules. Variable names can contain letters, numbers, dollar sign ($),
    or lower line (_), special characters are not allowed. Furthermore a variable
    name cannot begin with a number, any other allowed value is acceptable. Finally,
    variable names are case-sensitive, meaning that the interpreter in the web browser
    makes a distinction between uppercase and lowercase letters, making ''score''
    different from ''Score''.


    Note: Although we can use almost anything for a variable name, it is wise to use
    names which are meaningful as will this will help us and other programmers to
    better understand the written code.


    # Variable Types


    Based on the type of data, variables can come in different flavors. The three
    most basic types are number, string, and boolean.


    A number variable is represented by a numeric character. This variable can accept
