    \ that you can add to your codes. In general, a control flow statement boosts\
    \ the functionality and interactivity of a JavaScript program. This section of\
    \ the book focuses on control flow statements.\n\n## The Block Statement\n\nProgrammers\
    \ consider this as the most basic statement in JavaScript. Use this to group your\
    \ JavaScript statements. When writing your programs, enclose the block statement\
    \ using a pair of brackets.\n\n```\n{\nstatement_1;\nstatement_2;\n.\nstatement_n;\n\
    }\n```\n\nThe image below shows the syntax of a block statement:\n\nIn general,\
    \ programmers use block statements for control flow statements (i.e. for for,\
    \ if, while, etc.). Here’s an example:\n\n```\nwhile (y > 69) {\n  123;\n}\n```\n\
    \nIn the code snippet given above, “123;” serves as the block statement.\n\n##\
    \ The Conditional Statements\n\nConditional statements are sets of commands that\
    \ run if the assigned condition is true. The JavaScript language offers two kinds\
    \ of conditional statements: (1) if... else and (2) switch.\n\nLet’s discuss these\
    \ conditional statements in detail:\n\n### The “if... else” Statement\nWith this\
    \ statement, you can run a command as long as the assigned condition is true.\
    \ It involves an “else” clause (which is optional). The “else” clause holds a\
    \ statement that will run if the assigned condition is false.\n\n```\nif (condition)\
    \ {\n  statement_1;\n} else {\n  statement_2;\n}\n```\n\nThe syntax of a basic\
    \ “if... else” statement is:\n\nSince your condition must get either “true” or\
    \ “false”, you must use Boolean expressions when writing a conditional statement.\
    \ If the condition is true, the first statement will run; otherwise, the second\
    \ one will run.\n\nJavaScript allows you to set multiple conditions in your conditional\
    \ statements. You just have to combine several “if” and “else” clauses in a conditional\
    \ statement. Here’s the syntax that you must use:\n\n```\nif (condition_1) {\n\
    \  statement_1;\n} else if (condition_2) {\n  statement_2;\n} else if (condition_n)\
    \ {\n  statement_n;\n} else {\n  statement_last;\n}\n```\n\nTo run multiple statements,\
    \ you must place them inside a block statement (i.e. { ... }). Programming experts\
    \ claim that it’s best to utilize block statements, particularly when combining\
    \ statements.\n\n```\nif (condition) {\n  statement_1_runs_if_condition_is_true;\n\
    \  statement_2_runs_if_condition_is_true;\n} else {\n  statement_3_runs_if_condition_is_false;\n\
    \  statement_4_runs_if_condition_is_false;\n}\n```\n\nCheck the following example:\n\
    \nIf possible, avoid using simple assignments in your conditional expressions.\
    \ This is because simple assignments are often confused with equality when checking\
    \ JavaScript codes. For instance, you must not add the following code into your\
    \ statements:\n\n```javascript\nif (a = b) {\n  /* sample_statement */\n}\n```\n\
    \nIf you really need to use a simple assignment in your conditional expressions,\
    \ place it between a pair of parentheses. Here’s an example:\n\n```javascript\n\
    if ((x = y)) {\n  /* sample_statement */\n}\n```\n\n### The Falsy Values\nA “falsy\
    \ value” is a value that evaluates to false. Here are the falsy values that you\
    \ will encounter while using JavaScript:\n\n- null\n- false\n- undefined\n- NaN\n\
    - \"\" (i.e. an empty string)\n\nAny value not listed above evaluates to true\
    \ when used in conditional statements.\n\n### The “Switch” Statement\nThis kind\
    \ of statement allows an application to check an expression and compare it with\
    \ a predetermined set of cases. If there's a match, the application runs the assigned\
    \ command. Here is the syntax of a basic switch statement:\n\n```\nswitch (expression)\
    \ {\n  case label_1:\n    statements_1;\n    break;\n  case label_2:\n    statements_2;\n\
    \    break;\n  ...\n  default:\n    statements_def;\n    break;\n}\n```\n\nFirst,\
    \ the application will search for a case with a label that matches the expression's\
    \ value. Then, it will pass the control flow to that particular clause, performing\
    \ the assigned statement/s. If no match is found, the application will check the\
    \ default clause (which is optional) and pass the control flow to that clause,\
    \ running the assigned statement/s. If the statement has no default clause, the\
    \ application will simply run the statement after the switch.\n\nYou may also\
    \ add a break statement in your switches. A break statement makes sure that the\
    \ application will get out of the switch once a match is found. When the application\
    \ gets out of the switch, the system will run the statement right after the switch\
    \ statement.\n\n## How to Handle Exceptions\n\nJavaScript allows you to throw\
    \ and manage exceptions. To do these things, you must use the following statements:\n\
    \n- the \"throw\" statement\n- the \"try... catch\" statement\n\n## The Different\
    \ Types of Exceptions\n\nIn JavaScript, you can throw any type of object. However,\
    \ thrown objects may possess different characteristics. Although it is usual to\
    \ throw strings\n"
