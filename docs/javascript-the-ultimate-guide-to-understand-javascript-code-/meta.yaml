    indicate the non-appearance of an important value. They contain zero data.


    Automatic type conversion

    Earlier I said that JavaScript accepts practically all given programs, including

    programs with odd behaviors. Automatic type conversion illustrates in the

    following expressions:


    ```

    console.log(8 * null)

    // → 0

    console.log("5" - 1)

    // → 4

    console.log("5" + 1)

    // → 51

    console.log("five" * 2)

    // → NaN

    console.log(false == 0)

    // → true

    ```'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'When you assign an operator the wrong value, JavaScript silently returns value
    to the exact type it requires using the type coercion rule. In the first expression,
    the null turns to 0, and the 5 in the second expression remains 5 (from string
    to number). In the third expression, there was a string concatenation before the
    numeric addition, which converts the 1 to 1 (from number to a string). When odd
    numbers as "five" or undefined changes to the number, it gets the value of NaN.
    If you want to differentiate between values of the same type using ==, the output
    should be true if the values are similar except NaN. If you want to test if a
    value contains a real value, use the == (or! =) operator to compare it. To avoid
    unexpected type conversions, use the three-character comparison operators.


    # Short-circuiting of logical operators


    The && and || are called the logical operators. They are used to hold several
    types of values in a specific way. They change the values contained in the left
    side to Boolean type to decide, although it depends on the operators and the type
    of generated result, but will always reinstate the left or right-hand value. The
    || operator sends back value to the left when it can be changed to true and will


    ```

    console.log(null || "user")

    // → user

    console.log("Kate" || "user")

    // → Kate

    ```


    This function is used to return values to its default value and placed within
    an empty value as a replacement. Strings and numbers to Boolean conversion rules
    indicate that 0, NaN, and empty string ("") count as false while other values
    are true. The && operator operates identically but the other way around. When
    values to the left can be changed to false, return the value, or it sends the
    value to the right. For example, true || -1 outputs -1. Both operators evaluate
    the value to the right only when it is required. For example, we have the following
    values as true || X, the value of X will be true and will not consider it. The
    same rule applies to the false && X, which is false and will overlook it. You
    can call this process short-circuit evaluation.


    # Summary'
