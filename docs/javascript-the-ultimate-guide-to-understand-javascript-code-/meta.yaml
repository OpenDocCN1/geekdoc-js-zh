    # Chapter 16 Variables, data types & constants


    ## Variables


    Variables are always an important aspect of any programming language. They are
    used to store values which can be later addressed using variable names. Same goes
    with JavaScript. Let us look at the syntax for creating a variable:


    ### Syntax


    ```

    var <variableName>; //Declares a variable

    ```


    ```

    <variableName> = value;//Assigning value to the variable

    ```


    Or


    ```

    var <variableName> = value; //Declaration and assignment in same line

    ```


    In the first method, we declare the variable and then assign a value to it at
    some later point in the program. The only thing one must keep in mind here is
    that declaration must always come before the assignment. However, in the second
    method, both the declaration as well as the assignment happen in a single line.


    Let us look at some examples here


    var abc;//Declaration


    ```

    abc = "New variable"; // Declaration and Assignment

    ```


    ```

    var num = 33;//Declaration and assignment

    ```


    In above example, the variable "abc" will store the string value "New variable"
    while the variable "num" will store the number value 33.


    Let us look at one more example:


    ```

    var marksScience = 85; //Variable name

    ```


    ```

    var marksMaths= 100;

    ```


    ```

    var total = marksScience+ marksMaths; //add and store the result

    ```


    In the above example, the variable total will store the calculated value i.e.
    185.


    All the variables which are used in the program must have unique names or else
    might end up creating a ruckus while executing the code. These unique names are
    called identifiers. For naming a variable, certain rules must be followed.


    ### Rules for naming a variable


    - Names must start with a letter, dollar ($), or underscore (_).

    - You can include letters, digits, underscores, and dollar signs in variable name.

    - Variable names in JavaScript are case-sensitive.

    - You cannot use reserved words / keywords as variable names.


    Some of the examples of valid variable names are as follows:


    # Marks1


    # $abc


    # _fun


    # marks2


    You would have noticed that we make use of an “equal to” symbol to assign some
    values to a variable. This “equal to” symbol is called assignment operator and
    is used to initialize a variable.


    Few important points to remember:


    - 1. When you simply declare a variable, it holds no value.


    For example:


    ```

    var abc;

    ```


    Here the variable “abc” will not contain any value until we assign it some value.


    - 2. Many variables can be declared in a single statement. To do that, we start
    the statement with var and separate the variables by a comma.


    For example:


    ```

    var firstName="Amitabh", lastName="Kumar", age=70;

    ```


    - 3. The declaration of variables can span multiple lines.

    ```

    var firstName="Amitabh",

    lastName="Kumar",

    age=70;

    ```


    - 4. Most of the time, variables are simply declared and are initialized at some
    later point in the program. As mentioned in the first point, after the declaration,
    the variable holds no value. To be precise, it holds the value undefined. For
    example:


    ```

    var name;

    ```

    The variable "name" will contain the value undefined after the above statement
    is executed.


    - 5. Even if you re-declare a JavaScript variable, it retains its previous value.


    For example:

    ```

    var name="Amitabh"

    var name;

    ```

    Even after the execution of these statements, the variable "name" will still have
    the value "Amitabh."


    ## Data Types


    data types, as the name suggests, signifies the type of data a variable can hold.
    A JavaScript variable can hold several types of data. For example string, number,
    object, Boolean, etc.


    # var age = 70//stores a Number


    # var lastName = "Kumar"// stores a String


    ```javascript

    var name = {"firstName":"Amitabh",

    lastName:"Kumar"};

    //stores an object

    ```


    ```javascript

    var case=true; //Stores a Boolean

    ```


    Data types is an important aspect of programming because it specifies what kind
    of data a variable is holding. This helps the compiler to understand what kind
    of operations can be performed on. The addition operator will have different results
    if applied to two numbers and a radically different result if applied on two strings.
    For example:


    ```javascript

    var name="Amit" + "" + "Kumar";

    ```


    ```javascript

    var age = 30+40;

    ```


    The variable "name" will store the concatenated value of both the strings i.e.
    "Amit Kumar" while the variable age will store the added value of 30 & 70.


    Now consider the next example:


    ```javascript

    var abc = 70 + "Amit";

    ```


    If we try and relate the above example with normal arithmetic, it does not makes
    much sense. Adding a number to a string is not possible in normal arithmetic.
    However, it would be interesting to see how JavaScript will treat the above example
    as follows:


    ```javascript

    var abc = "70" + "Amit";

    ```


    Whenever we try to add a number to a string, JavaScript will treat the number
    as a string. However, what if our expression is a mix of several numbers and several
    strings! What will be the result in that case? Let''s look at the following examples:


    ```javascript

    var temp = "Amit" + " " + "Kumar" + 30 + 40;

    ```


    ```javascript

    var temp1 = 30 + 40 + "Amit" + " " + "Kumar";

    ```


    In the above example, the temp will store the value "Amit Kumar3040" whereas the
    variable temp1 will store "70Amit Kumar". How similar expressions produced different
    results? Let''s see how JavaScript treats the above two example. JavaScript starts
    evaluating expressions from left to right. So in the first case when encountered
    a string, it considers all the remaining as a string itself. Therefore 30 and
    40 becomes two separate strings. However, in the second example, since the numbers
    are written first, it first adds them and then concatenates with the remaining
    string.


