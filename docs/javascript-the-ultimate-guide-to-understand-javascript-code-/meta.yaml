    # 运算符优先级


    你可以在单个表达式中包含多个运算符：


    2 * x + 3 * y + z


    此类表达式的值取决于操作执行的顺序。为了定义操作顺序，JavaScript 运算符被分配了不同的优先级级别。例如，* * 运算符（乘法）的优先级高于 + 运算符（加法），因此在上面的表达式中，乘法会在加法之前执行。


    你可以使用括号指定任何计算顺序。如果你不确定运算符的优先级，或者如果你只是想通过显式操作顺序来清晰代码，就可以对表达式加上括号：


    ```

