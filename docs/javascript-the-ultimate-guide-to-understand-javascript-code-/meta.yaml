  md: '# Introduction


    HTML is not very smart. It mostly lets people look at text and images and allows
    them to move to other pages where they will do more of the same. What adds the
    intelligence to a web page is JavaScript. It makes the website more engaging,
    effective, and useful by letting pages respond to our visitors when they interact
    with the content.


    This book assumes that we already know how to use HTML to specify web page structure
    and content. It will be additionally beneficial if we are familiar how pages are
    styled with CSS, separate from the web page structure. If this is the case then
    we are ready to add a little behavior to the page and make it more dynamic and
    interactive with JavaScript. Otherwise, without HTML and CSS, JavaScript will
    not do us much good. They are viewed as the three fundamental pillars of the web
    page: structure, presentation and behavior.


    # What is JavaScript?


    JavaScript is the scripting language of the web with the sole purpose of adding
    interactivity to pages. In addition to interactivity, modern versions of JavaScript
    can also be used to load and parse information from external sources or even the
    website''s users. JavaScript is essentially a piece of programming code embedded
    in the HTML structure of a web page. When the web browser reads this code it activates
    a built-in interpreter that understands how to decipher this language and process
    its commands.


    Although programming is involved during coding, JavaScript is not a programming
    language. In conventional web programming languages, like Java or .NET, the code
    has to be compiled before it is executed. Compiling means that the code has to
    be first sent to a special program that is run on the server. This program, also
    known as application server software, translates the code, creates the requested
    page/or functionality and serves this back as HTML. Scripting languages, like
    JavaScript, are not compiled, but rather are interpreted on-the-fly. This means
    that no special software is involved as the user''s browser runs and executes
    the code as it is encountered.


    Note: JavaScript was created during a time when Java was a very popular language.
    Other than that, the languages are not related and have almost nothing in common
    except for basic programming logic.


    # Implementing JavaScript'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'Now that we have a general idea as to what JavaScript, we can start working
    with this language. As JavaScript code is part of the HTML document, we need to
    know how to tell browsers to run our scripts. There are two common options available
    to us when we want to include JavaScript in a web document and in both cases we
    will use the <script> element. The <script> tag is used when we want to tell the
    browser where the JavaScript code begins and where it ends within an HTML document.
    As such, this tag can be included either in the head or the body section of the
    page.


    The first option is to place the code inline within the document structure. To
    do this we begin by opening a <script> tag, entering the JavaScript code, and
    then finish by closing with the </script> tag. We can theoretically leave the
    document like this as almost all browsers will assume that the scripting language
    between the <script> tags is JavaScript by default. Nevertheless, for maximum
    compatibility we will extend this tag with the type attribute and to instruct
    the browser how to interpret the text/javascript value in order.


    ```

    <script type="text/javascript">

    //A JavaScript comment

    </script>

    ```


    The second option is to load the JavaScript code from an external file into our
    HTML document. For this purpose we can use the <script> element again, but this
    time in addition to the type attribute we will also include the URL to the external
    file in the src attribute of the <script> element. The external file must be a
    text-only file with the .js extension that contains only pure JavaScript code
    without any HTML elements or CSS rules. For example, we to call the external scripts.js
    file into our browser we will use the following code:


    ```

    <script src="script.js" type="text/javascript">

    </script>

    ```


    We put JavaScript in an external file and include it in the web page when we like
    to share the functionalities across our entire web site. Otherwise, if we just
    need to add some local interactive behavior, we embed the code within the page.'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'Note: Script files are loaded in the order in which they are placed in the
    HTML code'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Chapter 1 Fundamental JavaScript Concepts


    Generally, when we hear the term programming we immediately think of other people
    typing an incomprehensible string of letters and numbers. Programming looks like
    magic beyond the realm of mere mortals. Nevertheless, the concepts in programming
    are not difficult to grasp as they have always been real life applications. JavaScript,
    although it is not as simple as HTML or CSS, is not an overly complicated language.
    Unlike other languages, its "grammar" is more descriptive and intuitive a good
    fit for a first programming language. Basically, learning JavaScript is like learning
    a new language, but a new language that is similar to English. Once we learn the
    new words, and understand how to put them together to form "sentences" we''ll
    be good to go.


    Syntax


    Every language has its own set of characters and words that go along with a set
    of rules as to how to arrange these characters and words together into a well-formed
    sentence. These rules are also known as the language syntax and it is the syntax
    that holds the language together and gives it meaning.


    Before start with some examples of JavaScript syntax, let us first set up the
    environment for JavaScript. As discussed previously, JavaScript code is always
    a part of the HTML code. Therefore, in order to work with JavaScript we will first
    need to create a basic HTML document. To start, let us open a text editor (like
    Notepad) and type in the HTML code for the most basic web page. In addition to
    the basic HTML tags, we will include a <script> element in the <head> section
    where we will start placing the JavaScript code.


    ```

    <!doctype html>

    <head>

    <title>First Steps in JavaScript</title>

    <script type="text/javascript">

    </script>

    </head>

    <body>

    ```'
