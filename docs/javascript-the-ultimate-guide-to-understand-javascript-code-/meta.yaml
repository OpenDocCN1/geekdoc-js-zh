  md: '# Chapter 15 Expressions and Operators


    A JavaScript expression can be loosely defined as a block of code that yields
    a value. You''ve already seen examples of simple expressions:


    +   - A literal value, such as 5, "Hit", true, null, and undefined. (Later in
    the book, you''ll learn how to formulate literal values for objects, arrays, and
    functions. These also constitute expressions.)

    - A variable. For example, if you''ve declared a variable x, then an occurrence
    of x in your code is an expression. The value of the expression is the current
    value assigned to the variable.

    - A function call. The value of a function call is the value returned by the function,
    or undefined if the function doesn''t return a value. For example, the function
    call parseFloat(str) is an expression that has a numeric value.


    # Note


    When an expression forms the left side of an assignment statement, such as the
    x in the statement x = 5;, it''s more accurate to say that the expression yields
    the location or address of a value. The value at that location is replaced by
    a new value through the assignment.


    Don''t confuse an expression with a statement. A statement is a basic unit of
    JavaScript code, usually terminated with a semicolon.


    Some statements do not contain any expressions, such as a variable declaration:


    ```

    var x;

