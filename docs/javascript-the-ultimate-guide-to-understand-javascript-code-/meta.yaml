  - "[PAGE 124]\n\n# Chapter 18 Apply, call, and bind methods in JavaScript\n\nThe\
    \ apply(), call(), and bind() methods in JavaScript allow us to change the value\
    \ of the \"this\" keyword with the help of some arguments. These methods are useful\
    \ for calling a specified or targeted function. All three of these methods are\
    \ closely related.\n\nIn this section, we will review these three methods of JavaScript\
    \ in brief.\n\nThe ‘this’ keyword\n\nBefore diving into the details of apply(),\
    \ call(), and bind() methods, we need to know about the keyword \"this\" in JavaScript.\n\
    \nIn terms of global context\n\nThe keyword \"this\" refers to the global object\
    \ outside of any method. In the following example, we will see the scope of this\
    \ keyword in the global context. We will just console.log the \"this\" keyword\
    \ in the browser.\n\n```\nconsole.log(this);\n```\n\nThe result in the console\
    \ is “window\", which is nothing but the global object. This result implies that:\n\
    \n```\nconsole.log(this) === window; // is true\n```\n\nIn the example above,\
    \ we entered console.log(this) which gave us window object.\n\nIn this example,\
    \ we will use strict mode and check the value of the “this” keyword.\n\n```\n\
    function abc() {\n  'use strict'; // the strict mode\n  return this;\n}\nconsole.log(abc());\
    \ // undefined\n```\n\nThis time, the value of the ‘this’ keyword is undefined\
    \ because it was not defined inside the function abc().\n\nIn terms of function\
    \ context\n\nAddressing the “this” keyword in terms of function context, we have\
    \ the three methods call(), apply(), and bind()."
  - "[PAGE 125]\n\nLet’s talk about these methods in detail.\n\n# The apply method\n\
    \nThe apply() method invokes a function with the value of “this” keyword, and\
    \ parameters provided as an array (or an array-like object).\n\nSyntax:\n\nThe\
    \ method apply() has the following syntax:\n\n```\nfunctionName.apply(thisArgument,\
    \ argsArray[])\n```\n\n# Parameters\n\nLet’s have a look at the arguments provided\
    \ to the apply() method.\n\n+   - thisArgument: The value of keyword “this” provided\
    \ for the invoke functionName.\n\nNote: The value of the keyword \"this\" may\
    \ not be the original value seen by the function when working in non-strict mode.\
    \ The primitive values and the global object will be replaced by “undefined” and\
    \ “null”.\n\n+   - argsArray[]: An argument of an array-like object that specifies\
    \ the arguments with which functionName should be called, or undefined or null\
    \ if no arguments should be provided to the method.\n\nExample:\n\nIn the following\
    \ example, we will take a look at the basic functionality of the apply() method.\n\
    \n```\nvar student1 = {firstName: 'Abhishek', lastName: 'Kumar'};\nvar student2\
    \ = {firstName: 'Ashok', lastName: 'Mehta'};\nfunction text(hello) {\n  console.log(hello\
    \ + ' ' + this.firstName + ' ' + this.lastName + ' ? ');\n}\ntext.apply(student1,\
    \ ['How are you Abhishek Kumar']); // How are you Abhishek Kumar?\ntext.apply(student2,\
    \ ['How are you you']); // How are you Ashok Mehta?\n```\n\n# The call method\n\
    \nThe call() method invokes a particular function with the help of the \"this\"\
    \ keyword and an individual argument."
- md: "\n# Syntax:\n\nThe method call() has the following syntax:\nfunctionName.call(thisArgument,\
    \ argument1, argument2, ....)\n\n## Parameters\nLet's have a look at the arguments\
    \ provided to the apply() method.\n\n- thisArgument: The value of keyword \"this\"\
    \ provided for the invoke functionName.\n- Note: As with the apply() method, the\
    \ value of keyword \"this\" may not be the original value seen by the function\
    \ when working in non-strict mode. The primitive values and the global object\
    \ will be replaced by undefined and null.\n- Argument1, 2 ... :Arguments for the\
    \ different functions\n\n## Example:\n```javascript\nvar student1 = {firstName:\
    \ 'Abhishek', lastName: 'Kumar'};\nvar student2 = {firstName: 'Ashok', lastName:\
    \ 'Mehta'};\nfunction text(hello) {\n  console.log(hello + ' +' + this.firstName\
    \ + ' +' + this.lastName + ' ?');\n}\n\ntext.call(student1, ['How are you?']);\
    \ // How are you Abhishek Kumar\ntext.call(student2, ['How are you?']); // How\
    \ are you Ashok Mehta ?\n```\n\n## The bind method\nThe method bind() calls a\
    \ newly created function (created by the method itself), which has the value of\
    \ the keyword \"this\" set to the specified value, with a given pattern of parameters.\n\
    \n# Syntax:\n\nThe method call() has the following syntax:\nfunction.bind(thisArgument,\
    \ argument1[, argument2[, ...]])\n\n## Parameters\nLet's have a look at the arguments\
    \ provided to the apply() method.\n\n- thisArgument: The value to be passed as\
    \ the keyword argument to the specified function when the bound function is invoked.\
    \ If the bound function is created using the new operator, the value will be ignored.\n\
    - argument1[, argument2[, ...]]: Arguments attached to arguments provided to the\
    \ bound function when the specified function is called.\n\n## Example:\n```javascript\n\
    var student1 = {firstName: 'Abhishek', lastName: 'Kumar'};\nvar student2 = {firstName:\
    \ 'Ashok', lastName: 'Mehta'};\nfunction text() {\n  console.log('hello' + ' '\
    \ + this.firstName + ' ' + this.lastName + ' ?');\n}\nvar textHelloAbhishek =\
    \ text.bind(student1);\nvar textHelloAshok = text.bind(student2);\ntextHelloAbhishek();\
    \ // How are you Abhishek Kumar ?\ntextHelloAshok(); // How are you Ashok Mehta\
    \ ?\n```\n\n## Difference between apply, call and bind\n\nThe apply() method calls\
    \ the function and allows you to pass in parameters as an array or an array-like\
    \ object.\n\nThe call() method calls the function and allows you to pass in parameters\
    \ one by one.\n\nThe bind() method returns a newly created function and allows\
    \ you to pass in any number of arguments.\n\nNow that we know what the call(),\
    \ apply(), and bind() methods in JavaScript are, the question still remains “when\
    \ do I use which methods?”\n\nIn this section, we will clear this confusion by\
    \ comparing all them based on a few parameters.\n\nThe method call(), and apply()\
    \ are somewhat interchangeable, depending on how the the programmer decides to\
    \ utilize them. You have a choice to determine whether it is easier to send a\
    \ list of arguments separated by commas, or an array of arguments.\n\nThe bind()\
    \ method is a bit different from the other two.\n\nWhere the apply() and call()\
    \ methods execute the current function on the spot, the bind() method returns\
    \ a newly created function.\n\nA bind() method can be used for events such as\
    \ onClick, where the firing of such events is uncertain.\n\nWe as programmers\
    \ can't predict when those events will be fired, but we can serve the context\
    \ to them.\n\n# Chapter 19 Events\n\nSo far, the applications and scripts that\
    \ have been created have something in common: they are executed from the first\
    \ instruction to the last sequentially. Thanks to the flow control structures\
    \ (if, for, while) it is possible to slightly modify this behavior and repeat\
    \ some pieces of the script and skip other pieces depending on some conditions.\n\
    \nThese types of applications are not very useful since they do not interact with\
    \ users and cannot respond to the different events that occur during the execution\
    \ of an application. Fortunately, web applications created with the JavaScript\
    \ language can use the event-based programming model.\n\nIn this type of programming,\
    \ the scripts are dedicated to waiting for the user to \"do something\" (press\
    \ a key, move the mouse, close the browser window). Next, the script responds\
    \ to the user's action by normally processing information and generating a result.\n\
    \nEvents make it possible for users to transmit information to programs. JavaScript\
    \ defines numerous events that allow a complete interaction between the user and\
    \ the web pages/applications. Pressing a key constitutes an event, as well as\
    \ clicking or moving the mouse, selecting an element of a form, resizing the browser\
    \ window, etc.\n\nJavaScript allows you to assign a function to each of the events.\
    \ In this way, when any event occurs, JavaScript executes its associated function.\
    \ These types of functions are called \"event handlers\" in English and are usually\
    \ translated as \"event handlers\".\n\n# Event Models\n\nCreating web pages and\
    \ applications has always been much more complex than it should be due to incompatibilities\
    \ between browsers. Although there are dozens of standards for the technologies\
    \ used, browsers do not fully support them or even ignore them.\n\nThe main incompatibilities\
    \ occur in the XHTML, in the support of CSS stylesheets and, above all, in the\
    \ implementation of JavaScript. Of all of them, the most important incompatibility\
    \ occurs precisely in the browser's event model. Thus, there are up to three different\
    \ models to handle events depending on the browser in which the application runs.\n\
    \n# Basic Event Model\n\nThis simple event model was introduced for version 4\
    \ of the HTML standard and is considered part of the most basic level of DOM.\
    \ Although its features are limited, it is the only model that is compatible in\
    \ all browsers and therefore, the only one that allows you to create applications\
    \ that work the same way in all browsers.\n\n# Standard Event Model\n\nThe most\
    \ advanced versions of the DOM standard (DOM level 2) define a completely new\
    \ and much more powerful event model than the original. All modern browsers include\
    \ it, except Internet Explorer.\n\n# Internet Explorer Event Model\n\nInternet\
    \ Explorer uses its own event model, which is similar but incompatible with the\
    \ standard model. It was first used in Internet Explorer 4 and Microsoft decided\
    \ to continue using it in the other versions, despite the fact that the company\
    \ had participated in the creation of the DOM standard that defines the standard\
    \ event model.\n\n# Types Of Events\n\nIn this model, each XML element or tag\
    \ defines its own list of possible events that can be assigned. The same type\
    \ of event (for example, clicking the left mouse button) can be defined for several\
    \ different XHTML elements and the same XHTML element can have several different\
    \ events associated.\n\nThe name of each event is constructed with the prefix,\
    \ followed by the English name of the action. Thus, the event of clicking an element\
    \ with the mouse is onclick and the event associated with moving the mouse is\
    \ onmove.\n\nThe most used events in traditional applications are onload to wait\
    \ for the page to load completely, the events onclick, onmouseover, onmouseout\
    \ to control the mouse and onsubmit to control the submission of forms.\n\nThe\
    \ typical actions that a user performs on a web page can lead to a succession\
    \ of events. Pressing for example a button of type=\"submit\" triggers the events\
    \ mousedown, onclick, onmouseup and onsubmit.\n\n# Event Handlers\n\nA JavaScript\
    \ event by itself lacks utility. For events to be useful, JavaScript functions\
    \ or code must be associated with each event. In this way, when an event occurs,\
    \ the indicated code is executed, so the application can respond to any event\
    \ that occurs during its execution.\n\nThe functions or JavaScript code defined\
    \ for each event are called \"event handler\" and since JavaScript is a very flexible\
    \ language, there are several ways to indicate the handlers:\n\n- Handlers as\
    \ attributes of the XHTML elements\n- Handlers as external JavaScript functions.\n\
    - \"Semantic\" handlers.\n\n# Event handlers as XML attributes\n\nThis is the\
    \ simplest and least professional method of indicating the JavaScript code that\
    \ should be executed when an event occurs. In this case, the code is included\
    \ in an attribute of the XHTML element itself. In the following, we want to show\
    \ a message when the user clicks on a button:\n\n```html\n<input type=\"button\"\
    \ value=\"Click me and you will see\" onclick=\"alert (Thanks for clicking);\"\
    \ />\n```\n\nIn this method, XHTML attributes are defined with the same name as\
    \ the events to be handled. The previous example only wants to control the event\
    \ of clicking with the mouse, whose name is onclick. Thus, the XHTML element for\
    \ whom you want to define this event must include an attribute called onclick.\n\
    \nThe content of the attribute is a text string that contains all the JavaScript\
    \ instructions that are executed when the event occurs. In this case, the JavaScript\
    \ code is very simple (alert ('Thanks for clicking'));), since it is only about\
    \ describing a message.\n\nIn this other example, when the user clicks on the\
    \ <div> element a message is displayed and when the user hovers the mouse over\
    \ the element, another message is displayed:\n\n```html\n<div onclick=\"alert\
    \ ('You clicked with the mouse'); \" onmouseover=\"alert ('You hovered over the\
    \ element')\"\n```\n"
  mdcn: "\n\n# 语法：\n\ncall() 方法具有以下语法：\nfunctionName.call(thisArgument, argument1,\
    \ argument2, ....)\n\n## 参数\n让我们来看提供给 `apply()` 方法的参数。\n\n- thisArgument: 为调用\
    \ `functionName` 时提供的关键字 \"this\" 的值。\n- 注意：与 `apply()` 方法一样，在非严格模式下工作时，关键字 \"\
    this\" 的值可能不是函数看到的原始值。原始类型值和全局对象将被替换为 `undefined` 和 `null`。\n- Argument1, 2 ...\
    \ : 用于不同函数的参数。\n\n## 示例：\n```javascript\nvar student1 = {firstName: 'Abhishek',\
    \ lastName: 'Kumar'};\nvar student2 = {firstName: 'Ashok', lastName: 'Mehta'};\n\
    function text(hello) {\n  console.log(hello + ' +' + this.firstName + ' +' + this.lastName\
    \ + ' ?');\n}\n\ntext.call(student1, ['How are you?']); // How are you Abhishek\
    \ Kumar\ntext.call(student2, ['How are you?']); // How are you Ashok Mehta ?\n\
    ```\n\n## bind 方法\n`bind()` 方法调用一个新创建的函数（由方法本身创建），该函数的关键字 \"this\" 的值设置为指定的值，并带有给定的参数模式。\n\
    \n# 语法：\n\ncall() 方法具有以下语法：\nfunction.bind(thisArgument, argument1[, argument2[,\
    \ ...]])\n\n## 参数\n让我们来看提供给 `apply()` 方法的参数。\n\n- thisArgument: 当调用绑定函数时，作为关键字参数传递给指定函数的值。如果绑定函数是使用\
    \ `new` 运算符创建的，则该值将被忽略。\n- argument1[, argument2[, ...]]: 当调用指定函数时，附加到提供给绑定函数的参数上的。\n\
    \n## 示例：\n```javascript\nvar student1 = {firstName: 'Abhishek', lastName: 'Kumar'};\n\
    var student2 = {firstName: 'Ashok', lastName: 'Mehta'};\nfunction text() {\n \
    \ console.log('hello' + ' ' + this.firstName + ' ' + this.lastName + ' ?');\n\
    }\nvar textHelloAbhishek = text.bind(student1);\nvar textHelloAshok = text.bind(student2);\n\
    textHelloAbhishek(); // How are you Abhishek Kumar ?\ntextHelloAshok(); // How\
    \ are you Ashok Mehta ?\n```\n\n## apply, call 和 bind 之间的区别\n\n`apply()` 方法调用函数并允许你以数组或类数组的形式传递参数。\n\
    \n`call()` 方法调用函数并允许你一个一个地传递参数。\n\n`bind()` 方法返回一个新创建的函数并允许你传递任意数量的参数。\n\n现在我们已经知道了\
    \ JavaScript 中的 `call()`、`apply()` 和 `bind()` 方法是什么，但问题仍然是：“我应该使用哪种方法？”\n\n在本节中，我们将通过根据几个参数对它们进行比较来消除这种困惑。\n\
    \n`call()` 方法和 `apply()` 方法在某种程度上是可以交换的，取决于程序员决定如何利用它们。你可以选择发送逗号分隔的参数列表还是参数数组。\n\
    \n`bind()` 方法与另外两个有所不同。\n\n`apply()` 和 `call()` 方法在现场执行当前函数，而 `bind()` 方法返回一个新创建的函数。\n\
    \n`bind()` 方法可以用于如 `onClick` 等事件，这些事件的触发是不确定的。\n\n作为程序员，我们无法预测这些事件何时触发，但我们可以为它们提供上下文（context）。\n\
    \n# 第19 章 事件\n\n到目前为止，创建的应用程序和脚本有一个共同点：它们从第一条指令到最后一条指令顺序执行。得益于流程控制结构（if, for,\
    \ while），可以稍微修改这种行为，并根据某些条件重复某些脚本部分并跳过其他部分。\n\n这类应用程序并不有用，因为它们不与用户交互，也无法对应用程序执行期间发生的不同事件做出响应。幸运的是，使用\
    \ JavaScript 语言创建的应用程序可以使用基于事件的编程模型。\n\n在这种编程中，脚本专门等待用户“做某些事情”（按下键、移动鼠标、关闭浏览器窗口）。接下来，通过通过处理信息并生成结果来响应用户的操作。\n\
    \n事件使用户向程序传输信息。JavaScript 定义了许多事件，允许用户与网页/应用程序之间的完全交互。按下键构成一个事件，点击或移动鼠标、选择表单元素、调整浏览器窗口大小等也是。\n\
    \nJavaScript 允许你为每个事件分配一个函数。这样，当任何事件发生时，JavaScript 都会执行与其相关的函数。这些函数在英语中被称为 \"\
    event handlers\"，通常翻译为“事件处理器”。\n\n# 事件模型\n\n由于浏览器之间的不兼容性，创建网页和应用程序一直比应该的复杂得多。尽管对于使用的技术有几十种标准，但浏览器并没有完全支持它们，甚至忽略了它们。\n\
    \n主要的不兼容性发生在 XHTML、对 CSS 样式表的支持以及最重要的是 JavaScript 的实现中。在所有这些中，最重要的不兼容性恰恰发生在浏览器的事件模型中。因此，根据运行应用程序的浏览器，最多三种不同的模型来处理事件。\n\
    \n# 基础事件模型\n\n这个简单的事件模型是为 HTML 标准第4 版本引入的，被认为是 DOM 最基础层次的一部分。尽管它的功能有限，但它是唯一兼容的模型。\n\
    \n# 标准事件模型\n\n标准事件模型（DOM 2）比原始模型更强大。它在现代浏览器中使用。\n\n# Internet Explorer 事件模型\n\n\
    Internet Explorer 使用它自己的事件模型，与标准模型相似但不兼容。\n\n# 事件类型\n\n在模型模型中，每个 XML 元素定义了可能的事件。相同的\
    \ HTML 元素可以具有不同的事件（例如，点击左鼠标按钮）。\n\n事件的名称是以缀形式，后面是动作的英文名称。因此，点击事件是 `onclick`。\n\
    \n在应用程序中最常用的事件是 `onload`（等待页面加载）、`onclick`、`mouseover`（鼠标移入）、`onmouseout`（鼠标移出）以及\
    \ `onSubmit`（表单提交）。\n\n用户在网页上执行的典型操作会导致一系列事件。例如按下 `type=\"submit\"` 的按钮会触发 `mousedown`、`click`、`mouseup`\
    \ 和 `submit`。\n\n# 事件处理器\n\n事件本身没有用处。为了让事件有用，必须与每个事件关联 JavaScript 函数或代码。这样，当事件发生时，就会执行指示的代码，因此应用程序可以响应执行期间发生的任何事件。\n\
    \n为每个事件定义的函数或 JavaScript 代码被称为“事件处理器”，由于 JavaScript 是一种非常灵活的语言，有几种方法来指示处理器：\n\n\
    - 作为 XHTML 元素的属性\n- 作为外部 JavaScript 函数\n- “语义”处理器\n\n# 作为 XML 属性的事件处理器\n\n这是指示执行时执行的\
    \ JavaScript 代码的最简单且不专业的方法。在这种情况下，代码包含在元素本身的一个属性中。在下面，我们要在用户点击按钮时显示消息：\n\n```html\n\
    <input type=\"button\" value=\"Click me and you will see\" onclick=\"alert (Thanks\
    \ for clicking);\" />\n```\n\n在这种方法中，XHTML 属性与要处理的事件具有相同的名称。上一个示例只想控制点击鼠标的事件，其名称为\
    \ `onclick`。因此，你想要定义此事件的 XHTML 元素必须包含名为 `onclick` 的属性。\n\n属性的内容是一个文本字符串，包含了在事件发生时执行的所有\
    \ JavaScript 指令。在这种情况下，JavaScript 代码非常简单（alert ('Thanks for clicking'));），因为它只是关于描述一条消息。\n\
    \n在另一个示例中，当用户点击 `<div>` 元素时会显示消息，当用户鼠标悬停在元素上时会显示另一条消息：\n\n```html\n<div onclick=\"\
    alert ('You clicked with the mouse'); \" onmouseover=\"alert ('You hovered over\
    \ the element')\"\n```\n\n"
