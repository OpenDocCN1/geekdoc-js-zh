  md: '# Chapter 10 JavaScript ECMAScript Standard


    ECMAScript is a conventional specification for scripting languages regulated by
    the ECMA International. It is core to several scripting languages such as JavaScript,
    ActionScript, and Jscript.


    In this guide, we are not going to look at the history of the ES standardization.
    What we are going to do is use the ECMAScript to learn a bit more about the evolution
    of JavaScript.


    You can however learn more about the ECMAScript standard by visiting the resource
    page:


    https://bit.ly/2DZiHQb


    # A Brief History of JavaScript


    JavaScript is the creation of Brendan Eich, who at the time of creating the scripting
    language, was an employee at Netscape Communications Corporation, a corporation
    that Wikipedia notes had hired to help embed their “schema” programming language
    into the Netscape Navigator, one of the most dominant web browser of the 1990s.


    Wikipedia also notes that before Eich could start his work at Netscape in 1995,
    the company collaborated with Sun Systems agreeing to use Sun’s static programming
    language, Java, in their Netscape Navigator.


    JavaScript developed out of the collaboration mentioned above once Netscape Communications
    and Sun’s System collaborated, Netscape Communications immediately realized that
    they needed to create a new scripting language whose syntax was similar to that
    of Java so that the two languages could complement each other and allow Netscape
    to create web technologies platforms that could effectively compete with Microsoft,
    one of the giant computing companies of the 1990s.


    Netscape tasked Eich with the task of creating a prototype of this scripting language,
    which is how, as Wikipedia notes, Eich ended up creating JavaScript in 10 days
    of May 1995.


    During its developmental stages in the 1990s, JavaScript went by the name Mocha,
    and during its beta development stages in Netscape Navigator 2.0, it was initially
    called LiveScript a name later changed to JavaScript in December 1995 with the
    intent behind the name not being to cause confusion'
