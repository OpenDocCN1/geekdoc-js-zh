    into precedence sections. Operators in the same section (such as . and []) have
    the same precedence. Operators in different sections (such as () and ++) have
    different precedence, with the operator in the first section having the higher
    precedence. The "A" column is explained following the table. You''ll find a complete
    operator precedence table that includes the more esoteric operators at http://bit.ly/OpTable.


    | Operator | Description | A |

    |---|---|---|'
