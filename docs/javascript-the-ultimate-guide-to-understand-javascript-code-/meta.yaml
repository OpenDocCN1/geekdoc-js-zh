  md: '# Modifying and adding elements to array


    You can directly assign values to array elements by referring them with their
    index number, the same way as you do to access them.


    Example:


    ```

    var myArray = [ ''this'', ''is'', ''an'', ''array''];

    console.log( myArray ); // prints ''an'' on the console screen

    myArray = ''change'';

    ```


    console.log( myArray ); // prints ''change'' on the console screen


    You can add values to array in the exact manner as you assign values to array
    elements, if that particular index is bigger than array’s size then it gets created
    automatically.


    Example:


    ```

    var myArray = [ ''this'', ''is'', ''an'', ''array''];

    myArray = ''change''; // index 12 doesn’t exists but gets created when we

    assign value to this

    ```


    console.log( myArray ); // prints ''change'' on the console screen


    You can also add elements to the array by using .push() method about which

    You will read later in this chapter.


    Size or length of an array


    You can get the size/length of an array by using the ‘length’ property of

    array object. as the index starts from 0, the valid indexes for an array of

    length ‘n’ is from 0 to (n – 1);


    Example:


    ```

    var myArray = [ ''this'', ''is'', ''an'', ''array'', ‘example’];

    console.log(myArray.length ); //prints ‘5’ on the console screen

    ```


    ```

    console.log(myArray[ myArray.length – 1 ]); //prints ‘example’ on the

    console screen

    ```


    When you add a new value to an array by using an index number that did not

    exist previously, the array length is updated accordingly.'
