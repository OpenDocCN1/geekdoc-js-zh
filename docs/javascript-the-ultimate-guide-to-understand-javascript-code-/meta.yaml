  md: '# Operator Precedence


    You can include more than one operator in a single expression:


    2 * x + 3 * y + z


    The value of such an expression depends upon the order in which the operations
    are performed. To define the order of operations, the JavaScript operators have
    been assigned different levels of precedence. For example, the * operator (multiplication)
    has a higher precedence than the + operator (addition), so in the above expression
    the multiplications are performed before the additions.


    You can specify any order of evaluation by using parentheses. You might want to
    parenthesize an expression if you''re uncertain of the precedence of the operators,
    or if you simply want to clarify your code by making the order of operations explicit:


    ```

    /* here the parentheses clarify the default evaluation order: */

    ```


    ```

    (2 * x) + (3 * y) + z

    ```


    You can also use parentheses to change the evaluation order from the default.
    For instance, if you wanted the additions to be performed before the multiplications
    in the example expression, you could parenthesize it like this:


    ```

    /* here the parentheses change the evaluation order: */

    ```


    ```

    2 * (x + 3) * (y + z)

    ```


