  mdcn: "\n● 内部函数在执行后仍然可以访问外部函数的变量，正如我们在第三个示例中所看到的。我们在调用内部函数之前调用了外部函数，甚至在返回值后，我们仍然可以在内部函数内部使用外部函数的参数，因为这些参数被保留了。\n\
    \n● 闭包存储的是对外部函数变量的引用而非实际值，如果需要，可以进行编辑（参见示例 4）。\n\n● 闭包提供了一种处理某些数据的安全方法，因为我们可以保存变量的引用并防止意外更改。\n\
    \n```\n//Example 4\n//定义变量 a = 5\n\nvar a = 5;\n//定义函数 add，它向 a 增加 5 并返回值\nvar\
    \ add = function(val){\n  a = a + val;//将 val 加到 a 上\n  return a\n}\na = 10; //更新\
    \ a 的值\nvar result = add(5); //将使 result 等于 15 而不是 10，因为 //a 的值在\n闭包关闭之前被更新了，所以保存的\
    \ //引用已更新为新的\n引用\n```\n\n闭包非常强大，但需要格外小心，因为更新的引用可能会让你的代码充满错误。务必确保谨慎使用该功能。\n\n注意：闭包是函数或内部函数，它们保留了从全局或外部作用域引用的内部数据。\n\
    \n## JavaScript 中的回调 (Callbacks)\nJavaScript 函数是一一等对象。“一等对象”意味着它们可以在函数体内像其他对象一样使用。就像变量一样，我们可以保存它们的引用，将它们作为参数传递，声明嵌套函数（参见前面的章节），并像我们之前看到的那样，作为函数的返回值。\n\
    \n函数可以作为参数传递给另一个函数的能力使得 JavaScript 函数变得特殊。被传递的函数可以在稍后的阶段执行，或者作为一个函数被返回，由其他函数稍后执行。这构成了\
    \ JavaScript 回调（JavaScript Callbacks）。\n\n回调是指作为参数传递给另一个函数的函数，并在包含该函数的体内部执行。由于这种此类功能用途的场景有限，它们可以被称为回调模式。\n\
    \n```\n//定义一个回调函数 function()\nvar sum = function ( num1 , num2 ){\nreturn num1\
    \ + num2;\n}\n//定义一个使用 sum() 作为参数的函数\nvar calling_func = function ( a , b , callback\
    \ ){\nreturn callback ( a , b );//带有//参数调用回调函数\nvar sample = calling_func(5 ,\
    \ 5 , sum);//sample 将赋值为 10\n```\n\n让我们来看上面的代码。首先，我们声明了一个简单的函数，将两个值相加并返回结果。接下来，我们定义了一个接收两个参数以及第三个参数“callback”的函数。回调基本上是一个变量，它将存储我们将传递的函数名称并相应地执行它。它可以是任何名称。为了方便理解，我将其命名为\
    \ callback。\n\n需要注意的是，当我们把函数作为变量传递时，我们只发送函数调用的名称（例如 sum），而不是带括号的函数调用。该函数只有在包含它的体内部被调用时才会被执行。\n\
    \n正如我们看到的，回调函数并不是立即调用的，而是作为引用被保留的，并且只有在调用函数指定时才被调用，因此它们正如前一节详细描述的样闭包。\n\n回调函数不仅可以接受现有函数作为参数，还可以在参数中定义完全全新的函数。它将作为回调被包含函数调用。让我们来看一个例子：\n\
    \n```\n//没有定义回调函数\n```\n\n```\n//定义一个使用 sum() 作为参数的函数\n```\n\n```\nvar sum = function(a,b){\n\
    return a+b;\n}\nvar some_func= function( a , b , callback ){\nreturn callback(a,b);\n\
    }\nconsole.log(some_func(5,5,function(a,b){\nreturn a-b;\n}));\n```\n\n```\n//输出\n\
    ```\n\n0\n\n在这里，函数直接通过返回值进行指定。这种工作运行良好，适用于我们知道在开发过程中某个函数只会被使用一次或两次的情况。\n\n另一个需要学习的重要点是，我们可以从包含函数的内部向回调函数传递参数。\n\
    \n```\nvar sum = function(a,b){\nreturn a+b;\n}\n```\n\n```\nvar b = 10; //定义一个全局变量\n\
    ```\n\n```\nvar some_func= function( a , callback ){return callback(a,b);////将全局变量作为参数传递\n\
    }\n```\n\n```\nconsole.log(some_func(5,sum));\n```\n\n```\n//输出\n```\n\n15\n\n\
    在这里，我们可以向回调函数传递一些预留或预定义的参数，回调函数可以这些它们。这带来了更好的代码质量和更高的安全性。\n\n有一个必要条件是，无论回调函数是什么，它必须合法地是一个函数。为了防止意外将回调变量传递为函数以外的内容，我们可以放置一个“if”条件来检查\
    \ callback 的类型，只有当它的类型为“function”时才继续执行。\n\n```\nIf(typeof callback === \"function\"\
    ){\n//我们的函数体\n}\n```\n\n回调可以是多个函数，并且可以作为单个回调的参数传递。\n\n```\nvar sum = function(a,b){\n\
    console.log(\"Callback\")\n}\n```\n\n```\nvar sum1 = function(a,b){\nconsole.log(\"\
    Callback2\")\n}\n```\n\n```\nvar b = 10;\n```\n\n```\nvar some_func= function(\
    \ a , callback ){console.log(\"containing func\")\ncallback();\n}\nsome_func(sum,sum1);\n\
    //output\nCallback\nCallback2\n```\n\n等等，我发现了一些重复。让我根据提供的 OCR 流程重新对齐文本。\n\n（自纠：提示中提供的\
