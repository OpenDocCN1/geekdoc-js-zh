    If A is false or converts to false (that is, it''s "falsy"), the expression simply
    returns the value of A. If A happens to be a boolean variable, then the expression
    doesn''t return a boolean value (i.e. false). If A isn''t boolean, the expression
    doesn''t return a boolean value, but rather A''s actual value, which is some falsy
    value: undefined, 0, NaN, or "". (Conversions to boolean values were explained
    in Any type to boolean.) If A is "truth," then the expression returns the value
    of B, which might or might not be boolean, but like all values will be either
    truth or falsy.


    Now consider an || expression, which works in a similar way:


    A || B


    If A is truthy, the expression returns the value of A. If A is falsy, it returns
    the value of B.


    Because of the way it''s evaluated, the || operator is often used to select the
    first truth value in a series of values. Say, for example, that you want to use'
