    # Obtaining Event Information (Event Object)


    Normally, event handlers require additional information to process their tasks.
    If a function, for example, is responsible for processing the onclick event, you
    may need to know what position the mouse was at at the time of clicking the button.


    However, the most common case in which it is necessary to know additional information
    about the event of the events associated with the keyboard. Normally, it is very
    important to know the key that has been pressed, for example, to differentiate
    the normal keys from the special keys (ENTER, tab, Alt, Ctrl, Etc.).


    JavaScript allows you to obtain information about the mouse and keyboard using
    a special object called event. Unfortunately, different browsers have very notable
    differences in the treatment of information about events.


    The main difference lies in the way in which the event object is obtained. Internet
    Explorer considers that this object is part of the window object and the rest
    of browsers consider it as the only argument that the event handling functions
    have.


    Although it is a behavior that is very strange at first, all modern browsers except
    Internet Explorer magically and automatically create an argument that is passed
    to the managing function, so it is not necessary to include it in the call to
    the managing function. Thus, to use "magic argument", it is only necessary to
    assign it a name, as browsers automatically create it.


    In summary, in Internet Explorer type browsers, the event object is obtained directly
    by: var event = window.event.


    On the other hand, in the rest of browsers, the event object is obtained magically
    from the argument that the browser automatically creates: function handlerEvents(theEvent)
    {


    ```

    var event = theEvent;

    }

    ```


