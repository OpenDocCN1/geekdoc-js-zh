    # Statements


    To express ourselves in everyday common language we use sentences as the basic
    form of communication. Similarly, in JavaScript we also form sentences to express
    our intentions that are more formally called statements. A JavaScript sentence
    is the basic unit of communication, usually representing a single step in the
    program. And just like we put sentences together to express an opinion, we combine
    statements together to create a program.


    Let us look at a simple JavaScript statement and see what it does. Between the
    opening and closing <script> tag of the html document places the following text:


    alert("JavaScript is starting to make a little sense.");


