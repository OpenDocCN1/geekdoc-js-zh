    ~ ~ ~


    You can combine expressions using operators to form more complex

    expressions. For example, assuming the variable x contains a number, the

    following expression consists of two numeric expressions, one a variable and

    one a literal number, combined with the + (addition) operator:


    x + 5


    If the value of x is 2, then the value of the resulting, more complex

    expression is 7. The expressions that are combined using an operator (in this

    example, the x and the 2) are known as operands.


    # Operator Precedence


    You can include more than one operator in a single expression:


    2 * x + 3 * y + z


    The value of such an expression depends upon the order in which the operations
    are performed. To define the order of operations, the JavaScript operators have
    been assigned different levels of precedence. For example, the * operator (multiplication)
    has a higher precedence than the + operator (addition), so in the above expression
    the multiplications are performed before the additions.


    You can specify any order of evaluation by using parentheses. You might want to
    parenthesize an expression if you''re uncertain of the precedence of the operators,
    or if you simply want to clarify your code by making the order of operations explicit:


    ```

    /* here the parentheses clarify the default evaluation order: */

    ```


    ```

    (2 * x) + (3 * y) + z

    ```


    You can also use parentheses to change the evaluation order from the default.
    For instance, if you wanted the additions to be performed before the multiplications
    in the example expression, you could parenthesize it like this:


    ```

    /* here the parentheses change the evaluation order: */

    ```


    ```

    2 * (x + 3) * (y + z)

    ```


    The following table describes the basic JavaScript operators that are used in
    this book, listing them in precedence order. The horizontal bars divide the table
    into precedence sections. Operators in the same section (such as . and []) have
    the same precedence. Operators in different sections (such as () and ++) have
    different precedence, with the operator in the first section having the higher
    precedence. The "A" column is explained following the table. You''ll find a complete
    operator precedence table that includes the more esoteric operators at http://bit.ly/OpTable.


    | Operator | Description | A |

    |---|---|---|

    | . | Access a property of an object | L |

    | [] | Access an element of an array | L |

    | () | Call a function | L |

    | new | Create a new object | R |

    | ++ | Increment | R |

    | -- | Decrement | R |

    | - | Negate (unary) | R |

    | ! | Logical NOT | R |

    | delete | Remove a property from an object | R |

    | typeof | Get data type | R |

    | * / % | Multiply, divide, get remainder | L |

    | + - | Add, subtract | L |

    | + | Concatenate string | L |

    | <= | Less than, less than or equal | L |

    | >= | Greater than, greater than or equal | L |

    | instanceof | Test object inheritance | L |

    | in | Test property existence, or construct a for/in loop | L |

    | == | Test for equality, loosely | L |

    | != | Test for inequality, loosely | L |

    | === | Test for equality, strictly | L |

    | !== | Test for inequality, strictly | L |

    | && | Logical AND | L |

    | || | Logical OR | L |

    | ?: | Conditional operator | R |

    | = | Assign | R |

    | += -= *= /= %= | Assign, with operation | R |

    | , | Return right operand | L |


    If operators have the same precedence, their order of evaluation is determined
    by their associativity, which is given in the "A" column. Operators with "L" associativity
    are evaluated left-to-right. For example, because the + operator has left-to-right
    associativity, the expression


    a + b + c + d


    is evaluated like this:


    ((a + b) + c) + d


    Operators with "R" associativity are evaluated right-to-left. Because the = operator
    has left-to-right associativity, the expression


    p = q = r = s;


    is evaluated as


    p = (q = (r = s));


    (As you''ll see later, the value of a single assignment expression such as r =
    s is simply the right operand.)


    # Note


    The book uses the term "assignment statement" as a short description for what
    is more accurately termed "a statement consisting of an assignment expression."


    The number of operands that an operator expects is either 1 (a unary operator),
    2 (a binary operator), or 3 (a ternary operator). The unary operators, the one
    ternary operator (?:), and the various assignment operators all have left-to-right
    associativity. The remaining binary operators have left-to-right associativity.


    The following sections explain many of the operators given in the table. Some
    of the operators are used in conjunction with objects, arrays, or functions, and
    are discussed in later chapters that cover those topics. The typeof operator was
    explained in the previous chapter.


