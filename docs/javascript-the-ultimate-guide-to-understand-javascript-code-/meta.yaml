    # 结论


    # 引言


    HTML 并不聪明。它主要让人们查看文本和图像，并允许他们移动到其他页面进行更多类似的操作。为网页增加智能的是 JavaScript。它通过让页面在访问者与内容交互时做出响应，使网站更具吸引力、高效且实用。


    本书假设我们已经知道如何使用 HTML 指定网页的结构和内容。如果我们熟悉如何使用 CSS 对页面进行样式设计（独立于网页结构），将额外有益。如果是这样，我们就准备好为页面添加一些行为，并通过
    JavaScript使其更具动态性和交互性。否则，没有 HTML 和 CSS，JavaScript 对我们不会产生太大帮助。它们被视为网页的三大支柱：结构、表现和行为。


    # 什么是 JavaScript？


    JavaScript 是 Web 的脚本语言，唯一目的是为页面添加交互性。除了交互性外，现代版本的 JavaScript 还可以从外部源甚至网站用户加载并解析信息。JavaScript
    本质上是嵌入在网页 HTML 结构中的一段代码。当当浏览器读取这段代码时，它会激活一个内置解释器，该解释器理解如何解码这种语言并处理其命令。


    虽然编码过程中涉及编程，但 JavaScript 并不是一种编程语言。在传统的 Web 编程语言（如 Java 或 .NET）中，代码在执行之前必须经过编译。编译意味着代码必须先发送到运行在服务器上的特殊程序。该程序也称为应用程序服务器软件，会翻译代码，创建请求的页面或功能，并将其作为
    HTML 返回。像 JavaScript 这样的脚本语言不是编译的，而是被即时解释的。这意味着当用户的浏览器运行并执行遇到的代码时，不需要涉及任何特殊的软件。


    注意：JavaScript 创建于 Java 是一种非常流行的语言的时代。除外，这些语言之间没有关系，除了基本的编程逻辑外，几乎没有任何共同点。


    # 实现 JavaScript


    现在我们对 JavaScript 是什么有了大致了解，就可以开始学习这种语言了。由于 JavaScript 代码是 HTML 文档的一部分，我们需要知道如何告诉浏览器运行我们的脚本。当我们想要在
    Web 文档中包含 JavaScript 时，有两种常用的选项，在这两种情况下我们都会使用 `<script>` 元素。当我们需要告诉浏览器在 HTML 文档中
    JavaScript 代码从何时开始、何时结束时，就会使用 `<script>` 标签。因此，此标签可以包含在页面的 `head` 或 `body` 部分。


    第一个选项是将代码内联文档结构中。要做到这一点，我们首先打开 `<script>` 标签，输入 JavaScript 代码，然后通过 `</script>`
    标签结束。从理论上讲，我们可以让文档保持这样，因为几乎所有的浏览器都会默认 `<script>` 标签之间的脚本语言是 JavaScript。尽管如此，为了最大的兼容性，我们将使用
    `type` 属性扩展此标签，并指示浏览器如何解释 `text/javascript` 值。


    ```javascript

    <script type="text/javascript">

    // JavaScript 代码

    </script>

    ```


    第二个选项是从外部文件加载 JavaScript 代码到 HTML 文档。为了这个目的，我们可以再次使用 `<script>` 元素，但这次除了 `type`
    属性外，我们将在 `<script>` 元素的 `src` 属性中包含文件的 URL。外部文件必须是带有 .js 扩展名的文本文件，仅纯 JavaScript
    代码，而不包含任何 HTML 元素或 CSS 规则。例如，我们将 `script.js` 文件加载到浏览器中将使用以下代码：


    ```javascript

    <script src="script.js" type="text/javascript">

    </script>

    ```


    当我们想在整个网站共享功能时，我们将 JavaScript 放在外部文件中并包含在网页中。否则，如果我们只需要添加一些本地交互行为，我们将代码嵌入页面中。


    注意：脚本文件按照它们在 HTML 代码中的放置顺序加载


    # 第 1 章 JavaScript 基础概念


    通常，当我们听到“编程”一词时，会立即想到其他人输入无法理解的字母和数字字符串。编程看起来像是超凡脱俗的魔法。尽管如此，编程概念并不难理解，因为它们一直都是现实应用。JavaScript
    虽然不像 HTML 或 CSS 那么简单，但并不是过度复杂的语言。与其他语言不同，它的“语法”更具描述性和直观性，适合作为第一种编程语言。基本上，学习 JavaScript
    就像学习一种新语言，但是一种类似于英语的新语言。一旦我们学会了新词汇并理解了如何将它们组合成“句子”，就可以了。


    ## 语法


    每种语言都有自己的一组字符和单词，并有一套如何将这些字符和单词组合成良好句子的规则。这些规则被称为语言语法，它是将语言结合在一起并赋予其意义的基础。


    在开始学习 JavaScript 语法的示例之前，让我们先为 JavaScript 准备环境。如前所述，JavaScript 代码始终是 HTML 代码的一部分。因此，为了使用
    JavaScript，我们首先需要创建一个基础 HTML 文档。首先，让我们打开一个文本编辑器（如记事本）并输入基础网页的 HTML 代码。除了基础 HTML
    标签外，我们将在 `<head>` 部分包含一个 `<script>` 元素，从那里开始放置 JavaScript 代码。


    ```html

    <!doctype html>

    <head>

    <title>JavaScript 第一步</title>

    <script type="text/javascript">

    </script>

    </head>

    <body>

    </body>

    ```


