    # The Conditional Operator


    The conditional operator (:) is JavaScript''s only ternary operator (an operator
    with three operands). An expression looks like this:


    ```

    bool_val ? val1 : val2

    ```


    If bool_val is true (or converts to true), JavaScript evaluates and returns val1.
    If bool_val is false (or converts to false), JavaScript evaluates and returns
    val2. Note that only one of the second (val1 or val2) is evaluated, neither both.
    For an explanation of the way values are converted to boolean, see Any type to
    boolean. You''ll see examples of the use of this operator later in the book.


    # The Comma Operator


    Finally, there is the strange comma operator (,), which is a binary operator that
    is used like this:


    ```

    op1, op2

    ```


    The operator evaluates op1, evaluates op2, returns the value of op2, and discards
    the value of op1. The operator actually has a common use in the for-loop statement.


