- "# Javascript 编码：绝对初学者基础指南：快速学习编码的步步指南\n\n\n\n![](img/cover00124.jpeg)\n\n\n# 学习\
  \ JavaScript\n\nJavaScript 是一种轻量级、跨平台的基于对象的脚本语言。\n\nJavaScript 是一种译译型语言，而不是编译型语言。JavaScript\
  \ 翻译器（内置在浏览器中）负责为 Web 浏览器翻译 JavaScript 代码。\n\nJavaScript (`js`) 是一种轻量级的面向对象的编程语言，被许多网站用于编写网页脚本。\n\
  \n当应用于 HTML 文档时，它是一种解释型的、功能完备的编程语言，能够实现网站上的动态交互。它首次发布于 1995 年，允许用户在 Netscape Navigator\
  \ 浏览器中向网页添加程序。\n\n从那时起，所有其他图形网络浏览器都接受了它。用户可以使用 JavaScript 创建现代 Web 应用，实现即时交互，而无需每次都重新加载页面。Js\
  \ 用于标准网站，以提供各种类型的交互性和简单性。\n\n另一方面，JavaScript 与 Java 编程语言没有关系。\n\n## JavaScript 的特性\n\
  \n- 由于它们内置了执行环境，所有流行的网络浏览器都支持 JavaScript。\n- JavaScript 的语法和结构基于 C 语言语言。因此，它被归类为结构化语言。\n\
  - JavaScript 是一种弱类型语言，并对某些类型进行隐式转换（取决于具体操作）。\n- JavaScript 是一种面向对象的编程语言，通过原型而非类进行继承。\n\
  - 它是一种简单且可解释的语言。\n- 该语言对大小写敏感。\n- JavaScript 兼容多种操作系统，包括 Windows、macOS 和 Linux。\n\
  - 它让用户对浏览器拥有完全控制权。\n\n![](img/image00082.jpeg)\n\n### JavaScript 示例\n\n```javascript\n\
  <script>\n  document.write(\"Hello JavaScript by JavaScript\");\n</script>\n```\n\
  \n# JavaScript 注释\n\nJavaScript 注释是传递信息的有效手段。它用于包含代码相关信息，如警告或建议，以便终端用户能够理解。\n\n\
  集成在浏览器中的 JavaScript 引擎会忽略 JavaScript 注释。\n\n### 优点 - JavaScript 注\n\n- 使代码更易于理解：它可以解释代码，以便终端用户能够理解。\n\
  - 避免编写不需要的代码：它也可以用于防止代码运行。我们有时添加代码来执行某些操作，但一段时间后可能需要禁用这些代码。在这种情况下，利用注释更为优。\n\n##\
  \ JavaScript 注释 - 类型\n\n1. 单行注释\n2. 多行注释\n\n## 单行注释\n\n使用双正斜杠 (`//`）来表示这种注释。在句子之前之后使用它都是合适的。\n\
  \n让我们来看一个单行注释的示例，即在语句之前的注释。\n\n```javascript\n<script>\n  // 这是一个单行注释\n  document.write(\"\
  hello javascript\");\n</script>\n```\n\n## 示例\n\n```javascript\n<script>\n  var\
  \ a=10;\n  var b=20;\n  var c=a+b;//相加变量 a 和 b 的值\n  document.write(c);//打印 10 和\
  \ 20 的和\n</script>\n```\n\n## 多行注释\n\n它可以用于创建单行和多行注释。因此，它更具实用。\n\n它的符号是一个正斜杠后跟星号，然后另一个正斜杠。考虑以下场景：\n\
  \n```javascript\n/* 在此处输入你的代码 */\n```\n\n它可能出现在语句之前、之后或中间。\n\n```javascript\n<script>\n\
  \  /* 这是一个多行注释。\n  它将不会显示 */\n  document.write(\"example of javascript multiline\
  \ comment\");\n</script>\n```\n\n# JavaScript 变量\n\nJavaScript 变量仅仅是存储位置的名称。在 JavaScript\
  \ 中，有两种变量：局部变量和全局变量。\n\n在声明 JavaScript 变量时，有一些需要遵循的指南（也称为标识符）。\n\n- 名称必须以字母（a 到\
  \ z 或 A 到 Z）、下划线 (`_`) 或美元符号 (`$`) 开始。\n- 可以在初始字母后放置数字（0 到 9），例如 `value1`。\n- JavaScript\
  \ 中的变量对大小写敏感，因此 `x` 和 `X` 是两个不同的变量。\n\n## 正确的 JavaScript 变量\n\n```javascript\nvar\
  \ x = 10;\nvar _value=\"sonoo\";\n```\n\n## 错误的 JavaScript 变量\n\n```javascript\n\
  var 123=30;\nvar *aa=320;\n```\n\n## 示例 - JavaScript 变量\n\n```javascript\n<script>\n\
  \  var x = 10;\n  var y = 20;\n  var z=x+y;\n  document.write(z);\n</script>\n```\n\
  \n### 输出\n30\n\n## JavaScript 局部变量\n\nJavaScript 中的局部变量在块或函数内部声明。它只能从函数或块内部访问。考虑以下场景：\n\
  \n```javascript\n<script>\n  function abc(){\n    var x=10;//局部变量\n  }\n</script>\n\
  ```\n\n或者，\n\n```javascript\n<script>\n  If(10<13){\n    var y=20;//JavaScript 局部变量\n\
  \  }\n</script>\n```\n\n## JavaScript 全局变量\n\nJavaScript 中的全局变量可以从任何函数访问。全局变量是在函数外部或使用\
  \ `window` 对象声明的变量。考虑以下场景：\n\n```javascript\n<script>\n  var data=200;//全局变量\n \
  \ function a(){\n    document.writeln(data);\n  }\n  function b(){\n    document.writeln(data);\n\
  \  }\n  a();//调用 JavaScript 函数\n  b();\n</script>\n```\n\n## JavaScript 全局变量\n\n\
  JavaScript 中的全局变量在函数外部或使用 `window` 对象声明。可以从任何函数访问它。\n\n让我们来看一个全局变量的简单示例。\n\n```javascript\n\
  <script>\n  var value=50;//全局变量\n  function a(){\n    alert(value);\n  }\n  function\
  \ b(){\n    alert(value);\n  }\n</script>\n```\n\n### 在函数内部声明 JavaScript 全局变量\n\n\
  你必须利用 `window` 对象在函数内部声明全局变量。考虑以下场景：\n\n```javascript\nwindow.value=90;\n```\n\n\
  它现在可以在任何函数内部声明，并从任何函数内部访问。考虑以下场景：\n\n```javascript\nfunction m(){\n  window.value=100;//通过\
  \ window 对象声明全局变量\n}\nfunction n(){\n  alert(window.value);//从其他函数访问全局变量\n}\n```\n\
  \n# JavaScript 数据类型\n\nJavaScript 提供了不同的数据类型来存储不同类型的值。在 JavaScript 中，有两种数据类型。\n\n\
  1. 原生数据类型\n2. 非原生数据类型（引用类型）\n\n\n\n\n\nJavaScript 是一种动态类型语言，这意味着你不需要指定变量的类型，因为 JavaScript\
  \ 引擎会动态地使用它。要指定数据类型，你必须使用 `var`。它可以存储任何类型的值，包括数字、字符串等。考虑以下场景：\n\n1. `var a=40;//持有数字`\n\
  2. `var b=\"Rahul\";//持有字符串`\n\n![](img/image00083.jpeg)\n![](img/image00084.jpeg)\n\
  \n# JavaScript 运算符\n\nJavaScript 中的运算符是对操作数执行操作的符号。考虑以下场景：\n\n1. `var sum=10+20;`\n\
  \n在这里，`+` 是算术运算符\n而 `=` 是赋值运算符。\n\nJavaScript 运算符的类型：\n\n1. 算术运算符\n2. 比较（关系）运算符\n\
  3. 位运算符\n4. 逻辑运算符\n5. 赋值运算符\n6. 特殊运算符\n\n## JavaScript 算术运算符\n\n为了对操作数进行算术运算，需要使用算术运算符。JavaScript\
  \ 算术运算符是下面列出的运算符。\n\n![](img/image00085.jpeg)\n\n## JavaScript 比较运算符\n\nJavaScript\
  \ 中的比较运算符用于比较两个操作数。以下是比较运算符：\n\n![](img/image00086.jpeg)\n\n## JavaScript 位运算符\n\
  \n位运算符在操作数上执行位位操作。以下是位运算符：\n\n![](img/image00087.jpeg)\n\n## JavaScript 逻辑运算符\n\n\
  JavaScript 逻辑运算符是下面列出的运算符。\n\n![](img/image00088.jpeg)\n\n## JavaScript 赋值运算符\n\n\
  ![](img/image00089.jpeg)\n\n## JavaScript 特殊运算符\n\n![](img/image00090.jpeg)\n\n\
  # JavaScript If-else\n\n![](img/image00091.jpeg)\n\n### JavaScript If 语句\n\n只有当表达式为真时，才会评估内容。JavaScript\
  \ 中的 `if` 语句具有以下签名。\n\n```javascript\nif(expression){\n  //要评估的内容\n}\n```\n\n![](img/image00092.jpeg)\n\
  \n示例\n\n```javascript\n<script>\nvar a=20;\nif(a>10){\n  document.write(\"value\
  \ of a is greater than 10\");\n}\n</script>\n```\n\n输出\nvalue of a is greater than\
  \ 10\n\n### JavaScript If...else 语句\n\n它通过评估内容来确定条件是真是假。JavaScript 中 `if-else` 语句的语法所示。\n\
  \n```javascript\nif(expression){\n  // 如果条件为真，则评估的内容\n}\nelse{\n  // 如果条件为假，则评估的内容\n\
  }\n```\n\n![](img/image00093.jpeg)\n\n示例\n\n```javascript\n<script>\nvar a=20;\n\
  if(a%2==0){\n  document.write(\"a is even number\");\n}\nelse{\n  document.write(\"\
  a is odd number\");\n}\n</script>\n```\n\n输出\na is even number\n\n### JavaScript\
  \ 中的 If...else if 语句\n\n只有当一个或多个表达式为真时，它才分析内容。JavaScript 中的 `if else if` 语句具有以下签名。\n\
  \n```javascript\nif(expression1){\n  // 如果 expression1 为真，则评估的内容\n}\nelse if(expression2){\n\
  \  // 如果 expression2 为真，则评估的内容\n}\nelse if(expression3){\n  // 如果 expression3 为真，则评估的内容\n\
  }\nelse{\n  // 如果没有表达式为真，则评估的内容\n}\n```\n\n示例\n\n```javascript\n<script>\nvar a=20;\n\
  if(a==10){\n  document.write(\"a is equal to 10\");\n}\nelse if(a==15){\n  document.write(\"\
  a is equal to 15\");\n}\nelse if(a==20){\n  document.write(\"a is equal to 20\"\
  );\n}\nelse{\n  document.write(\"a is not equal to 10, 15 or 20\");\n}\n</script>\n\
  ```\n\n输出\na is equal to 20\n\n# JavaScript Switch\n\n`switch` 语句用于将多个表达式组合到单代码中。它与我们在上一页学到的\
  \ `else if` 语句相同。然而，它比 `else..if` 更用，因为可以与整数、字符和其他变量一起。\n\n`switch` 语句的签名所示。\n\n\
  ```javascript\nswitch(expression){\n  case value1:\n    要执行的代码\n    break;\n  case\
  \ value2:\n    要执行的代码\n    break;\n  default:\n    // 如果未匹配到上述值，则执行的代码；\n}\n```\n\
  \n简单示例 - switch - javascript。\n\n```javascript\n<script>\nvar grade='B';\nvar result;\n\
  switch(grade){\n  case 'A': result=\"A Grade\"; break;\n  case 'B': result=\"B Grade\"\
  ; break;\n  case 'C': result=\"C Grade\"; break;\n  default: result=\"No Grade\"\
  ;\n}\ndocument.write(result);\n</script>\n```\n\n输出\nB Grade\n\nswitch 语句的行为\n\n\
  ```javascript\n<script>\nvar grade='B';\nvar result;\nswitch(grade){\n  case 'A':\
  \ result+=\"A Grade\";\n  case 'B': result+=\"B Grade\";\n  case 'C': result+=\"\
  C Grade\";\n  default: result+=\"No Grade\";\n}\ndocument.write(result);\n</script>\n\
  ```\n\n输出\nundefined B Grade C Grade No Grade\n\n# JavaScript 循环\n\n`for`、`while`、`do\
  \ while` 和 `for-in` 循环用于在 JavaScript 中迭代代码。它减少了代码的大小。它最出现在数组中。\n\n1. for 循环\n2.\
  \ while 循环\n3. do-while 循环\n4. for-in 循环\n\n## 1) JavaScript For 循环\n\nJavaScript\
  \ 中的循环按指定的次数迭代组件。如果迭代次数已知，则应该使用它。`for` 循环的语法所示。\n\n```javascript\nfor (initialization;\
  \ condition; increment){\n  要执行的代码\n}\n```\n\n示例\n\n```javascript\n<script>\nfor\
  \ (i=1; i<=5; i++){\n  document.write(i + \"<br/>\")\n}\n</script>\n```\n\n输出：\n\
  1\n2\n3\n4\n5\n\n## 2) JavaScript while 循环\n\nJavaScript 中的 `while` 循环无限次迭代组件。如果迭代次数未知，则应该使用它。`while`\
  \ 循环的语法所示。\n\n```javascript\nwhile (condition){\n  要执行的代码\n}\n```\n\n示例\n\n```javascript\n\
  <script>\nvar i=11;\nwhile (i<=15){\n  document.write(i + \"<br/>\");\n}\n</script>\n\
  ```\n\n输出：\n11\n12\n13\n14\n15\n\n## 3) Do while 循环\n\n`do while` 循环像 `while` 循环一样迭代元素。无论条件是真是假，代码至少都会执行一次。以下是\
  \ `do while` 循环的语法。\n\n```javascript\ndo{\n  要执行的代码\n}while(condition);\n```\n\n\
  示例\n\n```javascript\n<script>\nvar i=21;\ndo{\n  document.write(i + \"<br/>\");\n\
  \  i++;\n}while(i<=25);\n</script>\n```\n\n输出\n21\n22\n23\n24\n25\n\n## 4) JavaScript\
  \ for in 循环\n\n`for in` 循环用于遍历对象的属性。\n\n# JavaScript 函数\n\n为了执行操作，需要 JavaScript\
  \ 函数。为了重用代码，我们可以多次调用 JavaScript 函数。\n\n使用 JavaScript 的好处\n\n代码的可重用性：因为我们可以多次调用函数，所以可以节省编码时间。\n\
  \n更少的代码意味着我们的程序更紧凑。为了完成常见任务，我们每次不需要编写许多行代码。\n\n## JavaScript 函数语法\n\n```javascript\n\
  function functionName([arg1, arg2, ...argN]){\n  //要执行的代码\n}\n```\n\n示例\n\n```javascript\n\
  <script>\nfunction msg(){\n  alert(\"hello! this is message\");\n}\n</script>\n\
  <input type=\"button\" onclick=\"msg()\" value=\"call function\"/>\n```\n\n## JavaScript\
  \ 函数参数\n\n```javascript\n<script>\nfunction getcube(number){\n  alert(number*number*number);\n\
  }\n</script>\n<form>\n  <input type=\"button\" value=\"click\" onclick=\"getcube(4)\"\
  />\n</form>\n```\n\n## 带返回值的函数\n\n我们可以通过调用在程序中使用返回返回值的函数。让我们看一个返回返回值的函数示例。\n\n```javascript\n\
  <script>\n```\n\n\n\n\n\n```javascript\nfunction getInfo(){\n  return \"hello javatpoint!\
  \ How r u?\";\n}\n</script> \n<script>\n  document.write(getInfo());\n</script>\n\
  ```\nOUTPUT\nhello javatpoint! How r u?\n\n## JavaScript 函数对象\n\nJavaScript 中的 `Function`\
  \ `Object() { [native code] }` 用于生成新的 `Function` 对象。它在全局范围内运行代码。然而，当我们直接调用函数 `Object()\
  \ { [native code] }` 时，会动态构建一个函数，但是不安全的。\n\n### 语法\n\n`new Function ([arg1[, arg2[,\
  \ ....argn]],] functionBody)`\n\n![](img/image00094.jpeg)\n![](img/image00095.jpeg)\n\
  \n## JavaScript 函数对象\n\n## 示例\n\n```javascript\n<script>\n  var add=new Function(\"\
  num1\",\"num2\",\"return num1+num2\");\n  document.writeln(add(2,5));\n</script>\n\
  ```\nOutput:\n7\n\n### 示例 2\n\n```javascript\n<script>\n  var pow=new Function(\"\
  num1\",\"num2\",\"return Math.pow(num1,num2)\");\n  document.writeln(pow(2,3));\n\
  </script>\n```\nOutput:\n8\n\n# JavaScript 对象\n\nJavaScript 对象是一个基于状态和行为的实体（属性和方法）。例如，汽车、笔、自行车、椅子、玻璃杯、键盘和显示器。\n\
  \nJavaScript 是一种面向对象的编程语言。在 JavaScript 中，一切都是对象。\n\nJavaScript 是一种基于模板的语言，而不是基于类的。获取对象时我们不需要构建类。但是，我们直接创建对象。\n\
  \n![](img/image00096.jpeg)\n![](img/image00097.jpeg)\n\n## 示例\n\n```javascript\n\
  <script>\n  emp={id:102,name:\"Shyam Kumar\",salary:40000}\n  document.write(emp.id+\"\
  \ \"+emp.name+\" \"+emp.salary);\n</script>\n```\nOUTPUT\n102 Shyam Kumar 40000\n\
  \n![](img/image00098.jpeg)\n\n## 示例\n\n```javascript\n<script>\n  var emp=new Object();\n\
  \  emp.id=101;\n  emp.name=\"Ravi Malik\";\n  emp.salary=50000;\n  document.write(emp.id+\"\
  \ \"+emp.name+\" \"+emp.salary);\n</script>\n```\nOUTPUT\n101 Ravi 50000\n\n![](img/image00099.jpeg)\n\
  \n## 示例\n\n```javascript\n<script>\n  function emp(id,name,salary){\n    this.id=id;\n\
  \    this.name=name;\n    this.salary=salary;\n  }\n  e=new emp(103,\"Vimal Jaiswal\"\
  ,30000);\n  document.write(e.id+\" \"+e.name+\" \"+e.salary);\n</script>\n```\n\
  OUTPUT\n103 Vimal Jaiswal 30000\n\n## 定义方法 - JavaScript 对象\n\n在 JavaScript 对象中，我们可以指定方法。然而，在定义方法之前，我们必须向函数添加一个与方法同名的属性。\n\
  \n## 示例\n\n```javascript\n<script>\n  function emp(id,name,salary){\n    this.id=id;\n\
  \    this.name=name;\n    this.salary=salary;\n    this.changeSalary=changeSalary;\n\
  \    function changeSalary(otherSalary){\n      this.salary=otherSalary;\n    }\n\
  \  }\n  e=new emp(103,\"Sonoo Jaiswal\",30000);\n  document.write(e.id+\" \"+e.name+\"\
  \ \"+e.salary);\n  e.changeSalary(45000);\n  document.write(\"<br>\"+e.id+\" \"\
  +e.name+\" \"+e.salary);\n</script>\n```\nOUTPUT\n103 Sonoo Jaiswal 30000\n103 Sonoo\
  \ Jaiswal 45000\n\n## JavaScript 对象方法\n![](img/image00100.jpeg)\n![](img/image00101.jpeg)\n\
  ![](img/image00102.jpeg)\n![](img/image00103.jpeg)\n\n# JavaScript 数组\n\nJavaScript\
  \ 数组是一个表示相同类型对象组的对象。在 JavaScript 中，创建三种数组的方法：\n\n1. 通过数组字面量\n2. 直接创建 `Array` 实例（使用\
  \ `new` 关键字）\n3. 通过使用 `Array` 构造函数（使用 `new` 关键字）\n\n## 1) JavaScript 数组字面量\n\n以下是使用数组字面量生成数组的语法：\n\
  `var arrayname=[value1,value2.....valueN];`\n值包含在 `[]` 中并用逗号分隔。让我们来看一个 JavaScript\
  \ 中创建和使用数组的简单示例。\n\n```javascript\n<script>\n  var emp=[\"Sonoo\",\"Vimal\",\"atan\"\
  ];\n  for(i=0;i<emp.length;i++){\n    document.write(emp[i]+\"<br/>\n  }\n</script>\n\
  ```\nOutput\nSonoo\nVimal\natan\n\n## 2) JavaScript 直接创建数组\n\n以下是创建数组的语法：\n`var\
  \ arrayname=new Array();`\n在这种情况下，使用 `new` 关键字创建日期对象。让我们看看使用 `new` 关键字创建数组的示例。\n\
  \n```javascript\n<script>\n  var i;\n  var emp=new Array();\n  emp[0]=\"Arun\";\n\
  \  emp[1]=\"Varun\";\n  emp[2]=\"John\";\n  for(i=0;i<emp.length;i++){\n    document.write(emp[i]+\"\
  <br>\");\n  }\n</script>\n```\nOutput\nArun\nVarun\nJohn\n\n## 3) JavaScript 构造函数\n\
  \n这样我们通过传递参数给 `Array()` 来创建数组。\n\n```javascript\n<script>\n  var i;\n  var emp=new\
  \ Array(\"Jai\",\"Smith\");\n  for(i=0;i<emp.length;i++){\n    document.write(emp[i]+\"\
  br>\");\n  }\n</script>\n```\nOutput\nJai\nSmith\n\n## JavaScript 数组方法\n![](img/image00104.jpeg)\n\
  ![](img/image00105.jpeg)\n![](img/image00106.jpeg)\n\n# JavaScript 字符串\n\nJavaScript\
  \ 字符串是表示字符的对象。在 JavaScript 中，有两种方法可以制作字符串：\n\n1. 字符串字面量\n2. 字符串对象（使用 `new` 关键字）\n\
  \n## 1) 字符串字面量\n\n以下是使用字符串字面量生成字符串的语法：\n`var stringname=\"value\";`\n值包含在双引号中。让我们来看一个\
  \ JavaScript 中创建和使用字符串的简单示例。\n\n```javascript\n<script>\n  var str=\"This is\";\n\
  \  document.write(str);\n</script>\n```\nOutput\nThis is\n\n## 2) 字符串对象（使用 `new`\
  \ 关键字）\n\n以下是使用 `new` 关键字创建字符串的语法：\n`var stringname=new String(\"value\");`\n`new`\
  \ 关键字用于创建字符串实例。让我们看看使用 `new` 关键字创建字符串的示例。\n\n```javascript\n<script>\n  var str=new\
  \ String(\"hello string\");\n  document.write(str);\n</script>\n```\nOutput\nhello\
  \ string\n\n## JavaScript 字符串方法\n![](img/image00107.jpeg)\n![](img/image00108.jpeg)\n\
  \n# JavaScript Date 对象\n\n你可以使用 Date 对象获取年份、月份和日期。Date 对象可以用于在网页上显示计时器。要生成日期对象，你可以使用多种\
  \ `Date` 构造函数。它具有获取和设置日、月、年、小时、分和秒的方法。\n\n## 构造函数\n\n`Date` 构造函数的 4 种变：\n1. `Date()`\n\
  2. `Date(milliseconds)`\n3. `Date(dateString)`\n4. `Date(year, month, day, hours,\
  \ seconds, milliseconds)`\n\n## JavaScript Date 方法\n![](img/image00109.jpeg)\n![](img/image00110.jpeg)\n\
  ![](img/image00111.jpeg)\n\n### JavaScript Date 示例\n\n```javascript\n<script>\n\
  \  var today=new Date();\n  document.getElementById('txt').innerHTML=today;\n</script>\n\
  ```\nOUTPUT\nCurrent Date and Time: Sat Feb 12 2022 23:47:52 GMT+0530 (India Standard\
  \ Time)\n\n### 示例 2\n\n```javascript\n<script>\n  var date=new Date();\n  var day=date.getDate();\n\
  \  var month=date.getMonth()+1;\n  var year=date.getFullYear();\n  document.write(\"\
  <br>Date is: \"+day+\"/\"+month+\"/\"+year);\n</script>\n```\n\n### JavaScript 当前时间示例\n\
  \n```javascript\n<script>\n  var today=new Date();\n  var h=today.getHours();\n\
  \  var m=today.getMinutes();\n  var s=today.getSeconds();\n  document.getElementById('txt').innerHTML=h+\"\
  :\"+m+\":\"+s;\n</script>\n```\n\n### 数字时钟示例\n\n让我们来看一个使用 JavaScript 日对象显示数字时钟的简单示例。在\
  \ JavaScript 中，你可以使用 `setTimeout()` 或 `setInterval()` 方法来指定间隔。\n\n\n\n\n\n1. 当前时间：<span\
  \ id=\"txt\"></span>\n\n```javascript\n<script>\n  window.onload=function(){getTime();}\n\
  \  function getTime(){\n  var today=new Date();\n  var h=today.getHours();\n  var\
  \ m=today.getMinutes();\n  var s=today.getSeconds();\n  // add a zero in front of\
  \ numbers<10 \n  m=checkTime(m);\n  s=checkTime(s);\n  document.getElementById('txt').innerHTML=h+\"\
  :\"+m+\":\"+s;\n  setTimeout(function(){getTime()},1000);\n}\n//setInterval(\"getTime()\"\
  ,1000);//another way\nfunction checkTime(i){\n  if (i<10){\n    i=\"0\" + i;\n \
  \ }\n  return i;\n}\n</script>\n```\n\n# JavaScript 数学\n\n为了进行数学运算，JavaScript math\
  \ 对象暴露了各种常量和方法。与 date 对象不同，它没有构造函数。\n\n## JavaScript 数学方法\n\n![](img/image00117.jpeg)\n\
  ![](img/image00118.jpeg)\n![](img/image00119.jpeg)\n\n## Math.sqrt(n)\n\nJavaScript\
  \ `math.sqrt(n)` 方法返回数字的平方根。\n\n1. 17 的平方根是：<span id=\"p1\"></span>\n\n```javascript\n\
  <script>\n  document.getElementById('p1').innerHTML=Math.sqrt(17);\n</script>\n\
  ```\n\n输出：\n17 的平方根是：4.123105625617661\n\n## Math.random()\n\nJavaScript 中的 `math.random()`\
  \ 方法返回一个 0 到 1 之间的随机数。\n\n1. 随机数是：<span id=\"p2\"></span>\n\n```javascript\n<script>\n\
  \  document.getElementById('p2').innerHTML=Math.random();\n</script>\n```\n\n输出：\n\
  随机数是：0.02157876559753591\n\n## Math.pow(m,n)\n\n1. 3 的 4 次方是：<span id=\"p3\"></span>\n\
  \n```javascript\n<script>\n  document.getElementById('p3').innerHTML=Math.pow(3,4);\n\
  </script>\n```\n\n输出：\n3 的 4 次方是：81\n\n## Math.floor(n)\n\nJavaScript `math.floor(n)`\
  \ 方法返回数字的最小整数。例如，3.7 返回 3，5.9 返回 5，以此此类推。\n\n1. 4.6 的取整是：<span id=\"p4\"></span>\n\
  \n```javascript\n<script>\n  document.getElementById('p4').innerHTML=Math.floor(4.6);\n\
  </script>\n```\n\n输出：\n4.6 的取整是：4\n\n## Math.ceil(n)\n\nJavaScript `math.ceil(n)`\
  \ 方法返回给定值的最大整数。例如，3.7 返回 4，5.9 返回 6，以此此类推。\n\n1. 4.6 的向上取整是：<span id=\"p5\"></span>\n\
  \n```javascript\n<script>\n  document.getElementById('p5').innerHTML=Math.ceil(4.6);\n\
  </script>\n```\n\n输出：\n4.6 的向上取整是：5\n\n## Math.round(n)\n\nJavaScript 中的数学运算。`round(n)`\
  \ 方法为提供的数字提供最近的四舍五入整数。如果小数部分大于或等于 0.5，则赋值为较大的值 1；否则赋值为较小的值 0。例如，3.7 返回 4，3.3 返回\
  \ 3，5.9 返回 6，以此此类推。\n\n1. 4.3 的四舍五入是：<span id=\"p6\"></span><br>\n2. 4.7 的四舍五入是：<span\
  \ id=\"p7\"></span>\n\n```javascript\n<script>\n  document.getElementById('p6').innerHTML=Math.round(4.3);\n\
  \  document.getElementById('p7').innerHTML=Math.round(4.7);\n</script>\n```\n\n\
  输出：\n4.3 的四舍五入是：4\n4.7 的四舍五入是：5\n\n# JavaScript Number 对象\n\n你可以使用 JavaScript number\
  \ 对象表示数值。它可以是整数或浮点数。JavaScript number 对象遵循表示浮点数的 IEEE 标准。\n\n在 JavaScript 中，你可以使用\
  \ `Number()` 函数创建数字对象 Object() { [native code] }。考虑以下场景：\n\n1. `var n=new Number(value);`\n\
  \n如果该值无法转换为数字，它将返回 `NaN`（不是数字），可以使用 `isNaN()` 方法进行验证。\n\n你也可以直接将数字赋值给变量。考虑以下场景：\n\
  \n1. `var x=102;//整数值`\n2. `var y=102.7;//浮点数值`\n3. `var z=13e4;//指数值，输出：130000`\n\
  4. `var n=new Number(16);//通过数字对象的整数值`\n\n输出：\n102 102.7 130000 16\n\n## JavaScript\
  \ Number 常数\n\n![](img/image00120.jpeg)\n\n## JavaScript Number 方法\n\n![](img/image00121.jpeg)\n\
  \n# JavaScript 布尔\n\nJavaScript 中的 Boolean 对象表示两种状态之一的值：真（true）或假（false）。JavaScript\
  \ 中的 `Boolean()` 函数 Object() { [native code] } 可用于构建 JavaScript 布尔对象，如下所示：\n\n1.\
  \ `Boolean b=new Boolean(value);`\n\n## JavaScript 布尔示例\n\n```javascript\n<script>\n\
  \  document.write(10<20);//true\n  document.write(10<5);//false\n</script>\n```\n\
