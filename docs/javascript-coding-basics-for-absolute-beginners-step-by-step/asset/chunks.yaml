- fmt: "\n![](Images/cover00124.jpeg)\n\n# JAVASCRIPT CODING: BASICS FOR ABSOLUTE\
    \ BEGINNERS\nSTEP BY STEP GUIDE TO LEARN CODING QUICKLY J NEWMAN\n\n# Learn JavaScript\n\
    \nJavaScript is a lightweight, cross-platform object-based scripting language.\n\
    \nJavaScript is a translated language, not a compiled language. The JavaScript\
    \ Translator (which is built within the browser) is in charge of translating JavaScript\
    \ code for web browsers.\n\nJavaScript (`js`) is a lightweight object-oriented\
    \ programming language that is used to script webpages by a number of websites.\n\
    \nWhen applied to an HTML document, it is an interpreted, full-featured programming\
    \ language that enables dynamic interactivity on websites. It was first released\
    \ in 1995 to allow users to add programs to webpages in the Netscape Navigator\
    \ browser.\n\nSince then, all other graphical web browsers have embraced it. Users\
    \ can use JavaScript to create modern web applications that interact immediately\
    \ without having to reload the page every time. Js is used on a standard website\
    \ to provide many sorts of interactivity and simplicity.\n\nJavaScript, on the\
    \ other hand, has no connection to the Java programming language.\n\n## Features\
    \ of JavaScript\n\n- Because they have built-in execution environments, all popular\
    \ web browsers support JavaScript.\n- The grammar and structure of JavaScript\
    \ are based on the C programming language. As a result, it is classified as a\
    \ structured programming language.\n- JavaScript is a weakly typed language with\
    \ implicit casting of certain types (depending on the operation).\n- JavaScript\
    \ is an object-oriented programming language that inherits through prototypes\
    \ rather than classes.\n- It's a simple and interpretable language.\n- The language\
    \ is case-sensitive.\n- JavaScript is compatible with a variety of operating systems,\
    \ including Windows, macOS, and Linux.\n- It gives consumers complete control\
    \ over their web browsers.\n\n![](Images/image00082.jpeg)\n\n### JavaScript Example\n\
    \n```javascript\n<script>\n  document.write(\"Hello JavaScript by JavaScript\"\
    );\n</script>\n```\n\n# JavaScript Comment\n\nJavaScript comments are an effective\
    \ means of conveying information. It's used to include code-related information,\
    \ such as warnings or suggestions, so that the end user can understand it.\n\n\
    The JavaScript engine, which is incorporated in the browser, ignores the JavaScript\
    \ comment.\n\n### Advantages - JavaScript comments\n\n- To make coding more understandable\
    \ It can be used to explain the code so that the end user can understand it.\n\
    - To avoid having to write unneeded code It can also be used to prevent the code\
    \ from running. We sometimes add code to do a certain action. However, the code\
    \ may need to be disabled after some time. It is preferable to utilise comments\
    \ in this situation.\n\n## JavaScript Comments - Types\n\n1. Single-line Comment\n\
    2. Multi-line Comment\n\n## Single line Comment\n\nDouble forward slashes (`//`)\
    \ are used to indicate it. It's appropriate to use it both before and after the\
    \ sentence.\n\nLet's look at an example of a single-line comment, which is one\
    \ that is placed before the statement.\n\n```javascript\n<script>\n  // It is\
    \ single line comment\n  document.write(\"hello javascript\");\n</script>\n```\n\
    \n### EXAMPLE\n\n```javascript\n<script>\n  var a=10;\n  var b=20;\n  var c=a+b;//It\
    \ adds values of a and b variable\n  document.write(c);//prints sum of 10 and\
    \ 20\n</script>\n```\n\n## Multi line Comment\n\nIt can be used to create both\
    \ single and multi-line comments. As a result, it is more practical.\n\nIt's symbolised\
    \ by a forward slash followed by an asterisk, then another forward slash. Consider\
    \ the following scenario:\n\n```javascript\n/* your code here */\n```\n\nIt might\
    \ appear before, after, or in the middle of a statement.\n\n```javascript\n<script>\n\
    \  /* It is multi line comment.\n  It will not be displayed */\n  document.write(\"\
    example of javascript multiline comment\");\n</script>\n```\n\n# JavaScript Variable\n\
    \nA JavaScript variable is nothing more than a storage location's name. In JavaScript,\
    \ there are two sorts of variables: local variables and global variables.\n\n\
    When declaring a JavaScript variable, there are some guidelines to follow (also\
    \ known as identifiers).\n\n- A letter (a to z or A to Z), underscore (`_`), or\
    \ dollar (`$`) sign must begin the name.\n- We can put numerals (0 to 9) after\
    \ the initial letter, for example `value1`.\n- Variables in JavaScript are case\
    \ sensitive, so `x` and `X` are two separate variables.\n\n## Correct JavaScript\
    \ variables\n\n```javascript\nvar x = 10;\nvar _value=\"sonoo\";\n```\n\n## Incorrect\
    \ JavaScript variables\n\n```javascript\nvar 123=30;\nvar *aa=320;\n```\n\n##\
    \ Example - JavaScript variable\n\n```javascript\n<script>\n  var x = 10;\n  var\
    \ y = 20;\n  var z=x+y;\n  document.write(z);\n</script>\n```\n\n### Output\n\
    30\n\n## JavaScript local variable\n\nA local variable in JavaScript is declared\
    \ within a block or function. It can only be accessed from within the function\
    \ or block. Consider the following scenario:\n\n```javascript\n<script>\n  function\
    \ abc(){\n    var x=10;//local variable\n  }\n</script>\n```\n\nOr,\n\n```javascript\n\
    <script>\n  If(10<13){\n    var y=20;//JavaScript local variable\n  }\n</script>\n\
    ```\n\n## JavaScript global variable\n\nA global variable in JavaScript can be\
    \ accessed from any function. A global variable is one that is declared outside\
    \ of the function or with the `window` object. Consider the following scenario:\n\
    \n```javascript\n<script>\n  var data=200;//gloabal variable\n  function a(){\n\
    \    document.writeln(data);\n  }\n  function b(){\n    document.writeln(data);\n\
    \  }\n  a();//calling JavaScript function\n  b();\n</script>\n```\n\n# JavaScript\
    \ Global Variable\n\nA global variable in JavaScript is declared outside of the\
    \ function or with the `window` object. It's possible to go to it from any function.\n\
    \nLet's look at a simple example of a global variable.\n\n```javascript\n<script>\n\
    \  var value=50;//global variable\n  function a(){\n    alert(value);\n  }\n \
    \ function b(){\n    alert(value);\n  }\n</script>\n```\n\n### Declaring a global\
    \ variable in JavaScript within a function\n\nYou must utilise the `window` object\
    \ to declare global variables inside a function. Consider the following scenario:\n\
    \n```javascript\nwindow.value=90;\n```\n\nIt can now be declared within any function\
    \ and accessed from within any function. Consider the following scenario:\n\n\
    ```javascript\nfunction m(){\n  window.value=100;//declaring global variable by\
    \ window object\n}\nfunction n(){\n  alert(window.value);//accessing global variable\
    \ from other function\n}\n```\n\n# Javascript Data Types\n\nDifferent data types\
    \ are available in JavaScript to hold various types of values. In JavaScript,\
    \ there are two sorts of data types.\n\n1. Primitive data type\n2. Non-primitive\
    \ (reference) data type\n"
