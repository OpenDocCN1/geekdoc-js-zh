    \ Math\n\nTo conduct mathematical operations, the JavaScript math object exposes\
    \ various constants and methods. It does not have constructors, unlike the date\
    \ object.\n\n## JavaScript Math Methods\n\n![](Images/image00117.jpeg)\n![](Images/image00118.jpeg)\n\
    ![](Images/image00119.jpeg)\n\n## Math.sqrt(n)\n\nThe square root of a number\
    \ is returned by the JavaScript `math.sqrt(n)` method.\n\n1. Square Root of 17\
    \ is: <span id=\"p1\"></span>\n\n```javascript\n<script>\n  document.getElementById('p1').innerHTML=Math.sqrt(17);\n\
    </script>\n```\n\nOutput:\nSquare Root of 17 is: 4.123105625617661\n\n## Math.random()\n\
    \nThe `math.random()` method in JavaScript returns a random number between 0 and\
    \ 1.\n\n1. Random Number is: <span id=\"p2\"></span>\n\n```javascript\n<script>\n\
    \  document.getElementById('p2').innerHTML=Math.random();\n</script>\n```\n\n\
    Output:\nRandom Number is: 0.02157876559753591\n\n## Math.pow(m,n)\n\n1. 3 to\
    \ the power of 4 is: <span id=\"p3\"></span>\n\n```javascript\n<script>\n  document.getElementById('p3').innerHTML=Math.pow(3,4);\n\
    </script>\n```\n\nOutput:\n3 to the power of 4 is: 81\n\n## Math.floor(n)\n\n\
    The JavaScript `math.floor(n)` method returns the number's lowest integer. For\
    \ instance, 3 for 3.7, 5 for 5.9, and so on.\n\n1. Floor of 4.6 is: <span id=\"\
    p4\"></span>\n\n```javascript\n<script>\n  document.getElementById('p4').innerHTML=Math.floor(4.6);\n\
    </script>\n```\n\nOutput:\nFloor of 4.6 is: 4\n\n## Math.ceil(n)\n\nThe `math.ceil(n)`\
    \ method in JavaScript returns the largest integer for a given value. For instance,\
    \ 4 for 3.7, 6 for 5.9, and so on.\n\n1. Ceil of 4.6 is: <span id=\"p5\"></span>\n\
    \n```javascript\n<script>\n  document.getElementById('p5').innerHTML=Math.ceil(4.6);\n\
    </script>\n```\n\nOutput:\nCeil of 4.6 is: 5\n\n## Math.round(n)\n\nThe math in\
    \ JavaScript. The `round(n)` method gives the nearest rounded integer for a supplied\
    \ number. If the fractional component is equal to or higher than 0.5, it is assigned\
    \ to the upper value 1; otherwise, it is assigned to the lower value 0. For instance,\
    \ 4 for 3.7, 3 for 3.3, 6 for 5.9, and so on.\n\n1. Round of 4.3 is: <span id=\"\
    p6\"></span><br>\n2. Round of 4.7 is: <span id=\"p7\"></span>\n\n```javascript\n\
    <script>\n  document.getElementById('p6').innerHTML=Math.round(4.3);\n  document.getElementById('p7').innerHTML=Math.round(4.7);\n\
    </script>\n```\n\nOutput:\nRound of 4.3 is: 4\nRound of 4.7 is: 5\n\n# JavaScript\
    \ Number Object\n\nYou can represent a numeric value with the JavaScript number\
    \ object. It could be either an integer or a floating-point number. The IEEE standard\
    \ for representing floating-point numbers is followed by the JavaScript number\
    \ object.\n\nIn JavaScript, you can make a number object with the `Number()` function\
    \ Object() { [native code] }. Consider the following scenario:\n\n1. `var n=new\
    \ Number(value);`\n\nIf the value cannot be converted to a number, it returns\
