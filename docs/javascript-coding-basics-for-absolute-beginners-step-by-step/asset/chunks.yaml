    \ }\n  }\n  e=new emp(103,\"Sonoo Jaiswal\",30000);\n  document.write(e.id+\"\
    \ \"+e.name+\" \"+e.salary);\n  e.changeSalary(45000);\n  document.write(\"<br>\"\
    +e.id+\" \"+e.name+\" \"+e.salary);\n</script>\n```\nOUTPUT\n103 Sonoo Jaiswal\
    \ 30000\n103 Sonoo Jaiswal 45000\n\n## JavaScript 对象方法\n![](img/image00100.jpeg)\n\
    ![](img/image00101.jpeg)\n![](img/image00102.jpeg)\n![](img/image00103.jpeg)\n\
    \n# JavaScript 数组\n\nJavaScript 数组是一个表示相同类型对象组的对象。在 JavaScript 中，创建三种数组的方法：\n\n\
    1. 通过数组字面量\n2. 直接创建 `Array` 实例（使用 `new` 关键字）\n3. 通过使用 `Array` 构造函数（使用 `new` 关键字）\n\
    \n## 1) JavaScript 数组字面量\n\n以下是使用数组字面量生成数组的语法：\n`var arrayname=[value1,value2.....valueN];`\n\
    值包含在 `[]` 中并用逗号分隔。让我们来看一个 JavaScript 中创建和使用数组的简单示例。\n\n```javascript\n<script>\n\
    \  var emp=[\"Sonoo\",\"Vimal\",\"atan\"];\n  for(i=0;i<emp.length;i++){\n   \
    \ document.write(emp[i]+\"<br/>\n  }\n</script>\n```\nOutput\nSonoo\nVimal\natan\n\
    \n## 2) JavaScript 直接创建数组\n\n以下是创建数组的语法：\n`var arrayname=new Array();`\n在这种情况下，使用\
    \ `new` 关键字创建日期对象。让我们看看使用 `new` 关键字创建数组的示例。\n\n```javascript\n<script>\n  var\
    \ i;\n  var emp=new Array();\n  emp[0]=\"Arun\";\n  emp[1]=\"Varun\";\n  emp[2]=\"\
    John\";\n  for(i=0;i<emp.length;i++){\n    document.write(emp[i]+\"<br>\");\n\
    \  }\n</script>\n```\nOutput\nArun\nVarun\nJohn\n\n## 3) JavaScript 构造函数\n\n这样我们通过传递参数给\
    \ `Array()` 来创建数组。\n\n```javascript\n<script>\n  var i;\n  var emp=new Array(\"\
    Jai\",\"Smith\");\n  for(i=0;i<emp.length;i++){\n    document.write(emp[i]+\"\
    br>\");\n  }\n</script>\n```\nOutput\nJai\nSmith\n\n## JavaScript 数组方法\n![](img/image00104.jpeg)\n\
    ![](img/image00105.jpeg)\n![](img/image00106.jpeg)\n\n# JavaScript 字符串\n\nJavaScript\
    \ 字符串是表示字符的对象。在 JavaScript 中，有两种方法可以制作字符串：\n\n1. 字符串字面量\n2. 字符串对象（使用 `new` 关键字）\n\
    \n## 1) 字符串字面量\n\n以下是使用字符串字面量生成字符串的语法：\n`var stringname=\"value\";`\n值包含在双引号中。让我们来看一个\
    \ JavaScript 中创建和使用字符串的简单示例。\n\n```javascript\n<script>\n  var str=\"This is\"\
    ;\n  document.write(str);\n</script>\n```\nOutput\nThis is\n\n## 2) 字符串对象（使用 `new`\
    \ 关键字）\n\n以下是使用 `new` 关键字创建字符串的语法：\n`var stringname=new String(\"value\");`\n\
    `new` 关键字用于创建字符串实例。让我们看看使用 `new` 关键字创建字符串的示例。\n\n```javascript\n<script>\n  var\
    \ str=new String(\"hello string\");\n  document.write(str);\n</script>\n```\n\
    Output\nhello string\n\n## JavaScript 字符串方法\n![](img/image00107.jpeg)\n![](img/image00108.jpeg)\n\
    \n# JavaScript Date 对象\n\n你可以使用 Date 对象获取年份、月份和日期。Date 对象可以用于在网页上显示计时器。要生成日期对象，你可以使用多种\
    \ `Date` 构造函数。它具有获取和设置日、月、年、小时、分和秒的方法。\n\n## 构造函数\n\n`Date` 构造函数的 4 种变：\n1. `Date()`\n\
    2. `Date(milliseconds)`\n3. `Date(dateString)`\n4. `Date(year, month, day, hours,\
    \ seconds, milliseconds)`\n\n## JavaScript Date 方法\n![](img/image00109.jpeg)\n\
    ![](img/image00110.jpeg)\n![](img/image00111.jpeg)\n\n### JavaScript Date 示例\n\
    \n```javascript\n<script>\n  var today=new Date();\n  document.getElementById('txt').innerHTML=today;\n\
    </script>\n```\nOUTPUT\nCurrent Date and Time: Sat Feb 12 2022 23:47:52 GMT+0530\
    \ (India Standard Time)\n\n### 示例 2\n\n```javascript\n<script>\n  var date=new\
    \ Date();\n  var day=date.getDate();\n  var month=date.getMonth()+1;\n  var year=date.getFullYear();\n\
    \  document.write(\"<br>Date is: \"+day+\"/\"+month+\"/\"+year);\n</script>\n\
    ```\n\n### JavaScript 当前时间示例\n\n```javascript\n<script>\n  var today=new Date();\n\
    \  var h=today.getHours();\n  var m=today.getMinutes();\n  var s=today.getSeconds();\n\
    \  document.getElementById('txt').innerHTML=h+\":\"+m+\":\"+s;\n</script>\n```\n\
    \n### 数字时钟示例\n\n让我们来看一个使用 JavaScript 日对象显示数字时钟的简单示例。在 JavaScript 中，你可以使用 `setTimeout()`\
    \ 或 `setInterval()` 方法来指定间隔。\n\n"
