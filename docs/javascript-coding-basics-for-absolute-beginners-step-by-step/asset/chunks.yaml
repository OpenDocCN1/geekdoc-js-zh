    \ z=13e4;//exponent value, output: 130000`\n4. `var n=new Number(16);//integer\
    \ value by number object`\n\nOutput:\n102 102.7 130000 16\n\n## JavaScript Number\
    \ Constants\n\n![](Images/image00120.jpeg)\n\n## JavaScript Number Methods\n\n\
    ![](Images/image00121.jpeg)\n\n# JavaScript Boolean\n\nA Boolean object in JavaScript\
    \ represents a value in one of two states: true or false. The `Boolean()` function\
    \ Object() { [native code] } in JavaScript can be used to build a JavaScript Boolean\
    \ object, as seen below.\n\n1. `Boolean b=new Boolean(value);`\n\n## JavaScript\
    \ Boolean Example\n\n```javascript\n<script>\n  document.write(10<20);//true\n\
    \  document.write(10<5);//false\n</script>\n```\n\n## Boolean Properties\n\n![](Images/image00122.jpeg)\n\
    \n## Boolean Methods\n\n![](Images/image00123.jpeg)\n"
