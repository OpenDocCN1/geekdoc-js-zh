  trans: "\n\n![](img/cover00124.jpeg)\n\n# JAVASCRIPT 编码：初学者入门\n快速学习编程的逐步指南 J NEWMAN\n\
    \n# 学习 JavaScript\n\nJavaScript 是一种轻量级、跨平台的基于对象的脚本语言。\n\nJavaScript 是一种译译型语言，而不是编译型语言。JavaScript\
    \ 翻译器（内置在浏览器中）负责为 Web 浏览器翻译 JavaScript 代码。\n\nJavaScript (`js`) 是一种轻量级的面向对象的编程语言，被许多网站用于编写网页脚本。\n\
    \n当应用于 HTML 文档时，它是一种解释型的、功能完备的编程语言，能够实现网站上的动态交互。它首次发布于 1995 年，允许用户在 Netscape Navigator\
    \ 浏览器中向网页添加程序。\n\n从那时起，所有其他图形网络浏览器都接受了它。用户可以使用 JavaScript 创建现代 Web 应用，实现即时交互，而无需每次都重新加载页面。Js\
    \ 用于标准网站，以提供各种类型的交互性和简单性。\n\n另一方面，JavaScript 与 Java 编程语言没有关系。\n\n## JavaScript\
    \ 的特性\n\n- 由于它们内置了执行环境，所有流行的网络浏览器都支持 JavaScript。\n- JavaScript 的语法和结构基于 C 语言语言。因此，它被归类为结构化语言。\n\
    - JavaScript 是一种弱类型语言，并对某些类型进行隐式转换（取决于具体操作）。\n- JavaScript 是一种面向对象的编程语言，通过原型而非类进行继承。\n\
    - 它是一种简单且可解释的语言。\n- 该语言对大小写敏感。\n- JavaScript 兼容多种操作系统，包括 Windows、macOS 和 Linux。\n\
    - 它让用户对浏览器拥有完全控制权。\n\n![](img/image00082.jpeg)\n\n### JavaScript 示例\n\n```javascript\n\
    <script>\n  document.write(\"Hello JavaScript by JavaScript\");\n</script>\n```\n\
    \n# JavaScript 注释\n\nJavaScript 注释是传递信息的有效手段。它用于包含代码相关信息，如警告或建议，以便终端用户能够理解。\n\n\
    集成在浏览器中的 JavaScript 引擎会忽略 JavaScript 注释。\n\n### 优点 - JavaScript 注\n\n- 使代码更易于理解：它可以解释代码，以便终端用户能够理解。\n\
    - 避免编写不需要的代码：它也可以用于防止代码运行。我们有时添加代码来执行某些操作，但一段时间后可能需要禁用这些代码。在这种情况下，利用注释更为优。\n\n\
    ## JavaScript 注释 - 类型\n\n1. 单行注释\n2. 多行注释\n\n## 单行注释\n\n使用双正斜杠 (`//`）来表示这种注释。在句子之前之后使用它都是合适的。\n\
    \n让我们来看一个单行注释的示例，即在语句之前的注释。\n\n```javascript\n<script>\n  // 这是一个单行注释\n  document.write(\"\
    hello javascript\");\n</script>\n```\n\n### 示例\n\n```javascript\n<script>\n  var\
    \ a=10;\n  var b=20;\n  var c=a+b;//相加变量 a 和 b 的值\n  document.write(c);//打印 10\
    \ 和 20 的和\n</script>\n```\n\n## 多行注释\n\n它可以用于创建单行和多行注释。因此，它更具实用。\n\n它的符号是一个正斜杠后跟星号，然后另一个正斜杠。考虑以下场景：\n\
    \n```javascript\n/* 在此处输入你的代码 */\n```\n\n它可能出现在语句之前、之后或中间。\n\n```javascript\n\
    <script>\n  /* 这是一个多行注释。\n  它将不会显示 */\n  document.write(\"example of javascript\
    \ multiline comment\");\n</script>\n```\n\n# JavaScript 变量\n\nJavaScript 变量仅仅是存储位置的名称。在\
    \ JavaScript 中，有两种变量：局部变量和全局变量。\n\n在声明 JavaScript 变量时，有一些需要遵循的指南（也称为标识符）。\n\n\
    - 名称必须以字母（a 到 z 或 A 到 Z）、下划线 (`_`) 或美元符号 (`$`) 开始。\n- 可以在初始字母后放置数字（0 到 9），例如 `value1`。\n\
    - JavaScript 中的变量对大小写敏感，因此 `x` 和 `X` 是两个不同的变量。\n\n## 正确的 JavaScript 变量\n\n```javascript\n\
    var x = 10;\nvar _value=\"sonoo\";\n```\n\n## 错误的 JavaScript 变量\n\n```javascript\n\
    var 123=30;\nvar *aa=320;\n```\n\n## 示例 - JavaScript 变量\n\n```javascript\n<script>\n\
    \  var x = 10;\n  var y = 20;\n  var z=x+y;\n  document.write(z);\n</script>\n\
    ```\n\n### 输出\n30\n\n## JavaScript 局部变量\n\nJavaScript 中的局部变量在块或函数内部声明。它只能从函数或块内部访问。考虑以下场景：\n\
    \n```javascript\n<script>\n  function abc(){\n    var x=10;//局部变量\n  }\n</script>\n\
    ```\n\n或者，\n\n```javascript\n<script>\n  If(10<13){\n    var y=20;//JavaScript\
    \ 局部变量\n  }\n</script>\n```\n\n## JavaScript 全局变量\n\nJavaScript 中的全局变量可以从任何函数访问。全局变量是在函数外部或使用\
    \ `window` 对象声明的变量。考虑以下场景：\n\n```javascript\n<script>\n  var data=200;//全局变量\n\
    \  function a(){\n    document.writeln(data);\n  }\n  function b(){\n    document.writeln(data);\n\
    \  }\n  a();//调用 JavaScript 函数\n  b();\n</script>\n```\n\n# JavaScript 全局变量\n\n\
    JavaScript 中的全局变量在函数外部或使用 `window` 对象声明。可以从任何函数访问它。\n\n让我们来看一个全局变量的简单示例。\n\n```javascript\n\
    <script>\n  var value=50;//全局变量\n  function a(){\n    alert(value);\n  }\n  function\
    \ b(){\n    alert(value);\n  }\n</script>\n```\n\n### 在函数内部声明 JavaScript 全局变量\n\
    \n你必须利用 `window` 对象在函数内部声明全局变量。考虑以下场景：\n\n```javascript\nwindow.value=90;\n```\n\
    \n它现在可以在任何函数内部声明，并从任何函数内部访问。考虑以下场景：\n\n```javascript\nfunction m(){\n  window.value=100;//通过\
    \ window 对象声明全局变量\n}\nfunction n(){\n  alert(window.value);//从其他函数访问全局变量\n}\n\
    ```\n\n# JavaScript 数据类型\n\nJavaScript 提供了不同的数据类型来存储不同类型的值。在 JavaScript 中，有两种数据类型。\n\
    \n1. 原生数据类型\n2. 非原生数据类型（引用类型）\n\n"
- fmt: "\nJavaScript is a dynamic type language, which means you don't have to specify\
    \ the type of a variable because the JavaScript engine uses it dynamically. To\
    \ specify the data type, you must use `var`. It may store any type of value, including\
    \ numbers, strings, and so on. Consider the following scenario:\n\n1. `var a=40;//holding\
    \ number`\n2. `var b=\"Rahul\";//holding string`\n\n![](Images/image00083.jpeg)\n\
    ![](Images/image00084.jpeg)\n\n# JavaScript Operators\n\nOperators in JavaScript\
    \ are symbols that perform operations on operands. Consider the following scenario:\n\
    \n1. `var sum=10+20;`\n\nHere, `+` is the arithmetic operator\nAnd `=` is the\
    \ assignment operator.\n\nTypes of operators in JavaScript:\n\n1. Arithmetic Operators\n\
    2. Comparison (Relational) Operators\n3. Bitwise Operators\n4. Logical Operators\n\
    5. Assignment Operators\n6. Special Operators\n\n## JavaScript Arithmetic Operators\n\
    \nTo conduct arithmetic operations on the operands, arithmetic operators are employed.\
    \ JavaScript arithmetic operators are the operators listed below.\n\n![](Images/image00085.jpeg)\n\
    \n## JavaScript Comparison Operators\n\nThe comparison operator in JavaScript\
    \ compares the two operands. The following are the comparison operators:\n\n![](Images/image00086.jpeg)\n\
    \n## JavaScript Bitwise Operators\n\nOn operands, the bitwise operators perform\
    \ bitwise operations. The following are the bitwise operators:\n\n![](Images/image00087.jpeg)\n\
    \n## JavaScript Logical Operators\n\nJavaScript logical operators are the operators\
    \ listed below.\n\n![](Images/image00088.jpeg)\n\n## JavaScript Assignment Operators\n\
    \n![](Images/image00089.jpeg)\n\n## JavaScript Special Operators\n\n![](Images/image00090.jpeg)\n\
    \n# JavaScript If-else\n\n![](Images/image00091.jpeg)\n\n### JavaScript If statement\n\
    \nOnly if expression is true does it assess the content. The `if` statement in\
