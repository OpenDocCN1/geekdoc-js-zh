    # Learn JavaScript


    JavaScript is a lightweight, cross-platform object-based scripting language.


    JavaScript is a translated language, not a compiled language. The JavaScript Translator
    (which is built within the browser) is in charge of translating JavaScript code
    for web browsers.


    JavaScript (js) is a lightweight object-oriented programming language that is
    used to script webpages by a number of websites.


    When applied to an HTML document, it is an interpreted, full-featured programming
    language that enables dynamic interactivity on websites. It was first released
    in 1995 to allow users to add programs to webpages in the Netscape Navigator browser.


    Since then, all other graphical web browsers have embraced it. Users can use JavaScript
    to create modern web applications that interact immediately without having to
    reload the page every time. Js is used on a standard website to provide many sorts
    of interactivity and simplicity.


    JavaScript, on the other hand, has no connection to the Java programming language.


    ## Features of JavaScript


    Because they have built-in execution environments, all popular web browsers support
    JavaScript.


    The grammar and structure of JavaScript are based on the C programming language.
    As a result, it is classified as a structured programming language.


    JavaScript is a weakly typed language with implicit casting of certain types (depending
    on the operation).


    JavaScript is an object-oriented programming language that inherits through prototypes
    rather than classes.


    It''s a simple and interpretable language.


    The language is case-sensitive.


    JavaScript is compatible with a variety of operating systems, including Windows,
    macOS, and Linux.


    It gives consumers complete control over their web browsers.


    ![](Images/image00082.jpeg)


    ### JavaScript Example


    1.  <script>  


    2.  document.write("Hello JavaScript by JavaScript");  


    3.  </script>  


    # JavaScript Comment


    JavaScript comments are an effective means of conveying information. It''s used
    to include code-related information, such as warnings or suggestions, so that
    the end user can understand it.


    The JavaScript engine, which is incorporated in the browser, ignores the JavaScript
    comment.


    #### Advantages - JavaScript comments


    To make coding more understandable It can be used to explain the code so that
    the end user can understand it.


    To avoid having to write unneeded code It can also be used to prevent the code
    from running. We sometimes add code to do a certain action. However, the code
    may need to be disabled after some time. It is preferable to utilise comments
    in this situation.


    ## JavaScript Comments - Types


    1.  Single-line Comment


    2.  Multi-line Comment


    ## Single line Comment


    Double forward slashes (//) are used to indicate it. It''s appropriate to use
    it both before and after the sentence.


    Let''s look at an example of a single-line comment, which is one that is placed
    before the statement.


    1.  <script>  


    2.  // It is single line comment  


    3.  document.write("hello javascript");  


    4.  </script>


    EXAMPLE


    1.  <script>  


    2.  var a=10;  


    3.  var b=20;  


    4.  var c=a+b;//It adds values of a and b variable  


    5.  document.write(c);//prints sum of 10 and 20  


    6.  </script>


    ## Multi line Comment


    It can be used to create both single and multi-line comments. As a result, it
    is more practical.


    It''s symbolised by a forward slash followed by an asterisk, then another forward
    slash. Consider the following scenario:


    1.  /* your code here  */  


    It might appear before, after, or in the middle of a statement.


    1.  <script>  


    2.  /* It is multi line comment.  


    3.  It will not be displayed */  


    4.  document.write("example of javascript multiline comment");  


    5.  </script>  


    # JavaScript Variable


    A JavaScript variable is nothing more than a storage location''s name. In JavaScript,
    there are two sorts of variables: local variables and global variables.


    When declaring a JavaScript variable, there are some guidelines to follow (also
    known as identifiers).


    A letter (a to z or A to Z), underscore(_), or dollar($) sign must begin the name.


    We can put numerals (0 to 9) after the initial letter, for example value1.


    Variables in JavaScript are case sensitive, so x and X are two separate variables.


    ## Correct JavaScript variables


    1.  var x = 10;  


    2.  var _value="sonoo";  


    ## Incorrect JavaScript variables


    1.  var  123=30;  


    2.  var *aa=320;  


    ## Example - JavaScript variable


    1.  <script>  


    2.  var x = 10;  


    3.  var y = 20;  


    4.  var z=x+y;  


    5.  document.write(z);  


    6.  </script>  


    #### Output


    30


    ## JavaScript local variable


    A local variable in JavaScript is declared within a block or function. It can
    only be accessed from within the function or block. Consider the following scenario:


    1.  <script>  


    2.  function abc(){  


    3.  var x=10;//local variable  


    4.  }  


    5.  </script>  


    Or,


    1.  <script>  


    2.  If(10<13){  


    3.  var y=20;//JavaScript local variable  


    4.  }  


    5.  </script>  


    ## JavaScript global variable


    A global variable in JavaScript can be accessed from any function. A global variable
    is one that is declared outside of the function or with the window object. Consider
    the following scenario:


    1.  <script>  


    2.  var data=200;//gloabal variable  


    3.  function a(){  


    4.  document.writeln(data);  


    5.  }  


    6.  function b(){  


    7.  document.writeln(data);  


    8.  }  


    9.  a();//calling JavaScript function  


    10.  b();  


    11.  </script>


    # JavaScript Global Variable


    A global variable in JavaScript is declared outside of the function or with the
    window object. It''s possible to go to it from any function.


    Let''s look at a simple JavaScript example of a global variable.


    1.  <script>  


    2.  var value=50;//global variable  


    3.  function a(){  


    4.  alert(value);  


    5.  }  


    6.  function b(){  


    7.  alert(value);  


    8.  }  


    9.  </script> 


    ### Declaring a global variable in JavaScript within a function


    You must utilise the window object to declare JavaScript global variables inside
    a function. Consider the following scenario:


    1.  window.value=90;  


    It can now be declared within any function and accessed from within any function.
    Consider the following scenario:


    1.  function m(){  


    2.  window.value=100;//declaring global variable by window object  


    3.  }  


    4.  function n(){  


    5.  alert(window.value);//accessing global variable from other function  


    6.  } 


    #### In JavaScript, the internals of a global variable


    When you declare a variable outside of a function, it is automatically added to
    the window object. You can also use the window object to get to it. Consider the
    following scenario:


    1.  var value=50;  


    2.  function a(){  


    3.  alert(window.value);//accessing global variable   


    4.  } 


    # Javascript Data Types


    Different data types are available in JavaScript to hold various types of values.
    In JavaScript, there are two sorts of data types.


    1.  Primitive data type


    2.  Non-primitive (reference) data type'
