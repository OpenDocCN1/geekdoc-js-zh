    # Service Status


    One function is also quite useful: the Win32::Service::Status() function. It reports
    the current status of a given service, either locally or remotely. Example 8.3
    does exactly that. Notice Win32::Service does not export the various status constants.
    This oversight almost defeats the usefulness of the Status() function because
    it returns only a numeric value, which means nothing to a typical user. Table
    8.1 describes each value that Win32::Service::Status() returns.


    # 8.1 Service Status Values


    | Status Constant | Value | Description |

    |---|---|-|

    | SERVICE_STOPPED | 0x1 | The service is not running. |

    | SERVICE_START_PENDING | 0x2 | The service is starting. |

    | SERVICE_STOP_PENDING | 0x3 | The service is stopping. |

    | SERVICE_RUNNING | 0x4 | The service is running. |

    | SERVICE_CONTINUE_PENDING | 0x5 | The service continue is pending. |

    | SERVICE_PAUSE_PENDING | 0x6 | The service pause is pending. |

    | SERVICE_PAUSED | 0x7 | The service is paused. |


    To use the script in Example 8.3, use the following syntax:


    ```

    perl servicestatus.pl ServiceDisplayName [MachineName]

    ```'
