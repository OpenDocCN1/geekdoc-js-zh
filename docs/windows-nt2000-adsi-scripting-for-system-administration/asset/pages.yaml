    figure also illustrates what a part of the output looks like. The first line of
    each privilege is the privilege constant name (such as SE_ASSIGN_PRIMARYTOKEN_NAME).
    Win32 internally uses the display name to represent the privilege. For the sake
    of this script, you can specify either of these names; they are synonymous. However,
    programmers who program the Win32 API are advised to use constant names because
    they are guaranteed not to change as Windows versions change.


    Some of the privilege entries in the figure have comment lines. They simply describe
    what the privilege is used for—which is welcome information, especially when you
    try to decipher the meaning from the privilege name. Not all privileges have comment
    lines because Win32 does not supply them.


    ```

    C:\perl priv.pl -p

    SE_ASSIGNPRIMARYTOKEN_NAME:

    Display name: SeAssignPrimaryTokenPrivilege

    Comment: Replace a process level token


    SE_AUDIT_NAME:

    Display name: SeAuditPrivilege

    Comment: Generate security audits


    SE_BACKUP_NAME:

    Display name: SeBackupPrivilege

    Comment: Back up files and directories


    SE_BATCH_LOGON_NAME:

    Display name: SeBatchLogonRight

    ```


