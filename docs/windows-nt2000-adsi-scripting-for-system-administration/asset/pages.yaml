  md: '# 4 Crisis Management


    Sooner or later some crisis will rear its head, and your team will have to jump
    to action. This group of people will either be heralded as heroes or be walking
    toward the unemployment line, depending on their swift resolution of the situation
    at hand. Of course, a simple solution to this problem is to institute routine
    preventive maintenance, such as cycling a server every seven days or backing up
    data to tape every evening. This routine maintenance can go a long way toward
    preventing serious problems and providing solutions if they do arise. However,
    regardless of how well prepared your team is, some situations invariably leave
    you wishing you had thought about them earlier.


    It has been my observation that the biggest problems are not of magnitude but
    of details. For example, you can easily explain to a director or CIO that a file
    server crashed and is being rebuilt; he can understand. However, having to explain
    that the file server is healthy but data cannot be accessed because a NULL DACL
    is preventing files from being accessed can prove to be considerably more difficult.


    Many shrink-wrapped, off-the-shelf solutions can manage such crises. As an example,
    the typical backup software is designed to quickly restore backed-up files from
    tape to disk. However, some situations do not require such drastic measures—for
    example, if an administrator accidentally revoked permissions on all files in
    a shared directory. If each file and subdirectory has different permissions, re-creating
    the permissions correctly can be a daunting task, especially if you have hundreds
    of objects to touch. Restoring from tape could result in the overwriting of megabytes
    of data collected since a previous backup. If, however, permissions were previously
    backed up, all it takes is a short Perl script to reapply the permissions appropriately
    without losing any data.'
