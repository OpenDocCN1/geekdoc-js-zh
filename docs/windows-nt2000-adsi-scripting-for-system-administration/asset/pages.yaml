- img_proc: true
  md: '# Last Logon and Logoff 37


    formally logged off (for example, the machine crashed, the network became disconnected,
    and so forth), or a different DC processed the logon event.


    When a user logs on to a network, a DC must process the logon. This machine is
    responsible for authenticating the user’s password and checking whether the account
    is disabled, the password has expired, the user is allowed to log on using the
    machine he is on, and a host of other things. Just as logging on, when the user
    logs off the domain, a DC processes this activity as well. However, there is no
    guarantee that the same DC will process both the logon and logon events.


    Because any number of different DCs can process logon and logon requests, the
    last logon and logon times may be scattered among DCs. Therefore, the appropriate
    technique to determine the last logon and logon times for a given user is to query
    each DC in the domain and compare the logon and logon times. Whichever controller
    reports the most recent time is the one you’re interested in. You must query each
    controller for each attribute because controllers could have processed the logon
    and logon events.


    Two other attributes fall into a similar predicament: the logon count and the
    bad password count. These values represent the total number of times the user
    successfully logged on to the domain and the number of times an attempt to log
    on the domain failed because of an incorrect password. The true value of these
    attributes consists of the sum of each DC’s value. Therefore, each controller
    is queried, and its result is added to the value.


    Figure 2.2 illustrates the use of this technique. In this particular instance,
    the administrator account is being queried for the domain MyDomain. The DCs were
    discovered for this domain: \server1 and \server2. The domain-wide attributes
    are processed and displayed. You run this query using Example 2.5.


    ```

    C:\perl laston.pl -d MyDomain administrator

    Querying \server1

    Querying \server2

    administrator (Mr. Administrator):

    Last logon: Sat May 20 19:00:00 2000 (\server1 )

    Last logoff: Sat May 20 19:00:00 2000 (\server2 )

    Total number of bad password attempts: 0

    Total number of logons: 471

    ```


    Figure 2.2 Displaying the last logon time.'
