  md: '# The File System 71


    retrieves necessary information and other relevant data, such as the volume name,
    file system type (NTFS, FAT, FAT32, and so on), serial number, and the volume''s
    flags. The flags indicate what features are available for the drive. The flags
    and their descriptions are listed in 3.1.


    # Table 3.1 Volume Flags


    | Flag | Description |

    | --- | --- |

    | FS_CASE_IS_PRESERVED | The file system preserves the case of filenames when
    it places a name on disk. |

    | FS_CASE_SENSITIVE | The file system supports case-sensitive file names. |

    | FS_UNICODE_STORED_ON_DISK | The file system supports Unicode in filenames as
    they appear on disk. |

    | FS_PERSISTENT_ACLS | The file system preserves and enforces Access Control Lists
    (ACLs—also known as permissions). For example, NTFS preserves and enforces ACLs,
    but FAT does not. |

    | FILE_COMP_COMPRESSION | The file system supports file-based compression. |

    | FILE_VOL_IS_COMPRESSED | The specified volume is a compressed volume—for example,
    a Double volume. |

    | FILE_NAMED_STREAMS | The file system supports named streams. |

    | FILE_SUPPORTS_ENCRYPTION | The file system supports the Encrypted File System
    (EFS). |

    | FILE_SUPPORTS_OBJECT_IDS | The file system supports object identifiers. |

    | FILE_SUPPORTS_REPARSE_POINTS | The file system supports reparse points. This
    capability allows for features such as using NTFS links and moving infrequently
    accessed data to long-term storage such as tape backup. |

    | FILE_SUPPORTS_SPARSE_FILES | The file system supports sparse files. Sparse files
    have disk storage allocated only for the parts of the file that contain data.
    Therefore, large blocks of Os are not stored to disk to conserve drive storage
    space. |

    | FILE_VOLUME_QUOTAS | The file system supports space allocation limits on a per
    user basis.|


    The script accepts a list of drive letters or UNCs like this:


    ```

    perl volume.pl \\server\share

    ```


    In this case, the script displays volume information for both the local machine''s
    c:\ drive as well as for the volume that is shared by the UNC \server\share. Figure
    3.1 illustrates the output from this code. If no parameter is passed in, information
    regarding the volume for the current directory is displayed.'
