    Procuring the list of available domains that a machine can see is relatively simple.
    To do so, you bind to the root of the WinNT: ADSI provider''s name-space and then
    enumerate each object. Example 9.3 does exactly this.

    Line 4 requests an ADSI COM object that is bound to the WinNT: name-space. Lines
