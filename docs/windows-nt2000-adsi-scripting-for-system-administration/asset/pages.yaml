    m different from its DOS origins. To be fair, the Win32 command process-

    or (which batch files stem from) is far superior to the DOS command

    processor; however, it still falls terribly short on automation capabilities.


    With NT 4.0, Microsoft introduced the Windows Scripting Host (WSH)

    technology, which facilitates scripting engines as PerlScript,

    JavaScript, and VBScript. This technology enables you to execute scripts

    that provide functionality far beyond the reach of the command processor''s

    batch files.


    WSH was a separate download for NT 4.0, but ships with Windows

    2000. A scripting language must be designed as a COM server that is WSH-

    compliant. Perl not only does this, but also enables you to use it as a

    command-line application, meaning that you don''t need to register a COM

    server, nor do you need to have WSH installed at all.


    # Running Perl Scripts from a Command Line


    Years ago, I was working with a friend who was a system administrator for

    a Solaris box. Every time he wanted to run a Perl script, he had to labori-

    ously type in the full path to the Perl executable. I don''t know why he

    didn''t just add the Perl bin directory to the system path. Each time he typed
    in the

    full path, I would sigh with anticipation—especially when he mistyped

    som and had to delete, fix it, and then rethink the rest of the path. At

    that point, it occurred to me that not everyone adds Perl to the system path.


    When you add the perl\bin directory to the system path, running a Perl

    script is easier because you don''t have to specify the full path to Perl.EXE.

    You can simply run a script (such as an imaginary F00.PL script) by entering

    the following:


    ```

    perl foo.pl

    ```


    Some administrators prefer to add this line only to a user path, but I find

    that is far more useful to add it to the system path so that all processes can

    utilize it.


    You can use many tricks to get a Perl script to execute without having to

    type in something like this:


    ```

    c:\perl\bin\perl.exe c:\perl\scripts\myscript.pl

    ```


    By far the easiest way is to use a simple, three-step method that makes Perl

    scripts run simply and efficiently. The following steps work with Windows

    NT/2000 but, unfortunately, not with Windows 95/98. For Windows 95/98,

    there is no simple way to achieve the same results.'
