- img_proc: true
  md: "the same open file handles and sockets as its parent. This makes for a good\
    \ way to process incoming socket requests, for example. the parent simply accepts\
    \ an incoming socket request, for then closes the socket. the forked child process\
    \ inherits the open socket, so it reads and writes to the socket as it needs.\
    \ The fact that the parent process closes the socket does not affect the child's\
    \ copy of it at all.\n\nBecause Win32 does not have any concept of forking, Perl\
    \ creates a copy of its internal objects (such as global variables, open files\
    \ and sockets, and so on) and creates a new thread to access this copy. For the\
    \ most part, this approach is an inventive way to achieve forking, even it is\
    \ still quite limited.\n\nHowever, forking (and threading, for that matter) is\
    \ still experimental in Perl 5.6 (as of this writing), so you can expect bugs\
    \ to creep up until future versions perfect the function.\n\n> Note\nThe use of\
    \ threads is not covered because they are very experimental, and the Thread.pm\
    \ interface is expected to change in future versions. This is documented in the\
    \ Thread.pm file:\n\nWARNING: Threading is an experimental feature. Both the interface\
    \ and implementation are subject to change drastically. In fact, this documentation\
    \ describes the flavor of threads that were in version 5.6.0 and later have the\
    \ beginnings of support for interpreter threads, which (when finished) is expected\
    \ to be significantly different from what is described here. The information contained\
    \ here may therefore be obsolete. Use at your own risk! \n\nBecause the fork()\
    \ method is well documented in various other Perl resources (including online\
    \ documentation that comes with Perl), this chapter provides only a cursory overview.\n\
    \nWhen a script executes the fork() function, an identical copy of the script\
    \ is created. This new copy is called the child process, and the original is called\
    \ the parent process.\n\nThe fork() command returns one of three different values,\
    \ as shown in Table 7.1.\n\n# Table 7.1 Return Values from the fork() Function\n\
    \n| Return Value | Description |\n|---|---|n| undef | If the fork() failed, it\
    \ returns an undefined value. |\n| 0 | The child process always returns a 0 value.\
    \ |\n| Nonzero value | The parent process always returns a nonzero value. This\
    \ value is the process identifier (PID) of the newly created child process. |"
