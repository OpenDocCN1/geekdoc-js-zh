  md: 'Unfortunately, these methods kick a GUI application that users must interact
    with. For most users, this is probably fine, but Percl needs to achieve the same
    results programmatically.


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_250_0.png)


    Figure 7.1 The Task Manager window.


    You can obtain the process list, but doing so is not so easy. You need to extract
    information from the Registry. To be more precise, you take the information from
    the Registry performance root key (HKEY_PERFORMANCE_DATA). You could write a Perl
    script to do so, but writing such a script is very slow and extremely messy.


    Jutta Klebe used a Perl extension called Win32::PerfLib. It provides a simple
    and fast way to extract the necessary performance data from the Registry. Even
    though this extension manages much of the work, it is still messy—not as messy
    as if you were to use the Win32::Registry extension.


    Using Jutta''s extension, you can not only get a list of PIDs, but you can also
    obtain interesting information regarding each process—data such as how much memory
    is allocated (the working set) and the largest amount of memory that process has
    used (the peak working set). Other information such as how many threads and handles
    each process has opened, timing, and process priority can also be procured.


    Example 7.15 uses the Win32::PerfLib to dump the process list with some details
    about each process. When you run this code, it dumps various properties of each
    process running on the machine. When the script runs, it displays process statistics
    running on the local computer. You can obtain process information for a remote
    machine by passing in its name (Win32 computer name, DNS name, or IP address)
    as a parameter from the command line.'
