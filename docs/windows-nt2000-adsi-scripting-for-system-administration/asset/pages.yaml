  md: 'However, you need to be vigilant regarding security because recent versions
    of Windows enabled Distributed COM (DCOM). This technology enables one computer
    to communicate with a program running on another machine. This capability is ideal
    for administration purposes but potentially dangerous if renegade hackers break
    into a machine.


    Windows provides the DCOMCFG.EXE utility, which is used to configure DCOM security.
    This tool enables you to select who has access to a computer via DCOM. It has
    two problems, though: it is GUI-based, and it runs only on a local machine.


    Because the program is GUI-based, getting a quick overview of how a machine''s
    DCOM is configured is difficult. Instead, you must move from tab to tab clicking
    on buttons. Doing so is not only annoying but a time burden as well.


    Because the utility reports only the DCOM configuration for the machine it is
    running on, its use is quite limited. This limitation requires you to walk to
    each server, log on, and then run the utility if you want to check your server
    farm.


    Example 3.13 displays a machine''s DCOM configuration quickly and without any
    GUI. You can also check a remote machine''s DCOM configuration by passing in the
    machine''s name when running the script.


    > Every machine that is a member of a domain has a machine account (similar to
    user account) in the domain. When the machine is booted up and comes online, it
    logs into the domain using the machine account and a password. When examining
    a machine''s DCOM configuration, you might find references to user, group, and
    machine accounts.


    Example 3.5 shows the output of Example 3.13. Notice that the Guest account has
    been explicitly denied in all the security-related configurations. The script
    shows whether access was granted or denied.


    ```

    C:\perl dcom.pl \\server1


    DCOM settings for \\Server1:

    DCOM is enabled.

    COM Internet Services are enabled.


    The following accounts are allowed to launch COM applications:

    Allow NT AUTHORITY\SYSTEM

    Allow NT AUTHORITY\INTERACTIVE

    Deny SERVER1\Guest

    Allow BUILTIN\Administrators

    ```


    continues ►'
