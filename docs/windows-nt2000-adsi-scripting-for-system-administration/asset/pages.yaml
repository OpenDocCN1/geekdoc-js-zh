    # The PSAPI Library


    In the preceding section, you learned that the Win32 API does not offer simple
    API functions that provide quick access to process information. This is quite
    unfortunate; however, to help rectify this problem Microsoft released a library
    that does most of the dirty work for you. This library, known as the Process Status
    API (PSAPI), is a DLL that is available for free download from Microsoft''s Web
    site. It also comes with the Win32 SDK as well as Windows 2000.


    The library itself, called psapi.dll, is small (just under 30KB in size). When
    you use this library, a Perl script can enumerate the list of processes easily.
    You only need the psapi.dll library (stored in the path such as the System32 directory)
    and the win32::API extension.


    The PSAPI supplies functions that can only generate the PID list but also open
    each process so that a script can discover the list of modules (such as DLLs,
    OCXs, and EXEs) that it has loaded. A full discussion about this API is available
    through MSDN (http://msdn.microsoft.com/library/sdk/winbase/psapi_25ki.htm).


    So, you may now feel that hope is not lost. But there''s a catch. The PSAPI works
    only on Windows NT/2000. For non-NT machines such as Windows 95 and 98, the situation
    is a bit different, and your scripts have to rely on a library called TOOLHELP32,
    which is cleverly embedded in the kernel32.dll file. Back in Windows 3.0 and 3.1,
    this library was located in a file called toolhelp.dll. The library was updated
    for Win32 and added to the kernel.


    Example 7.17 demonstrates how to use the PSAPI. This example accepts a list of
    PIDs passed in the command line as follows:


    ```

    perl.exe modules.pl 1472 168 188 216

    ```


    It displays both the current and peak memory usages for each specified process.
    Additionally'
