- img_proc: true
  md: 'A service also announces itself by calling the

    Win32::Daemon::SetServiceBits() function. It passes in a bitmask that represents
    the bits (or flags) that it is associating itself with. For example,

    Microsoft''s SQL Server service announces itself as the SV_TYPE_SQLSERVER service.
    This constant equates to 0x00000004 or bit number 2.

    As you can see in Example 8.8, a call into Win32::NetAdmin::GetServers() actually
    requests all machines to report whether they are running a service that has registered
    with bit number 2 (0x04). Microsoft resolves several bits, one of which represents
    its SQL Server service.


    # Example 8.8 Looking for SQL Server Machines


    ```

    01. use Win32::NetAdmin;

    02. $Domain = Win32::DomainName();

    03. Win32::NetAdmin::GetDomainController('''', $Domain, $Pdc);

    04. if (Win32::NetAdmin::GetServers($Pdc, $Domain, 0x04, \List))

    05. {

    06.     foreach my $$$Machine ($List)

    07.     {

    08.         print "\$$Machine is a SQL Server.\n"

    09.     }

    10. }

    ```


    So, when would you actually use this announcement mechanism? Say that you''re
    running a Perl paging service on a machine. This service can accept incoming socket
    requests to send a text message to someone''s pager and register itself on the
    network so that the client program can simply look up which machines are running
    this service. This way, you never need to hardcode addresses into servers throughout
    the client script, allowing your network to be outfitted with several paging servers
    throughout the enterprise network.


    Microsoft has reserved 22 of the 32 bits for its own purposes, leaving all other
    services only 10 bits. For all practical purposes, having only 10 bits is not
    too bad because most machines don''t run services that need to announce themselves.


    The Win32::Daemon extension exposes these 10 bits as constants:


    ```

    USER_SERVICE_BITS_1

    USER_SERVICE_BITS_2

    ..

    USER_SERVICE_BITS_10

    ```


    The Win32::Daemon extension permits only the 10 available bits to be set, so efforts
    to set other bits will fail. Each call to the SetServiceBits() function clears
    any previous bits and then applies the new ones.'
