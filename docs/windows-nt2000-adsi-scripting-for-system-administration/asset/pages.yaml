  md: '# Displaying Who Has a Privilege


    Another syntax the script Example 2.9 takes is to show all the groups and accounts
    that have a particular privilege. This is useful to determine the scope of who
    has a particular ability. The script does so by specifying the show privilege
    assignment (-s) option:


    ```

    perl priv.pl -s Privilege2

    ```


    The list of privileges can either be fully privileged constants (for example,
    SE_BATCHLOGON_RIGHT) or display names (for example, SeBatchLogonRight). The script
    is flexible enough to mangling of either. Mangling is done by specifying the root
    of the privilege, such as BATCHLOGON.


    The script displays all users and groups who have each of the specified privileges,
    as shown in Figure 2.4. Notice that the first privilege specified is the full
    display name, the second is only the root of a privilege name.


    ```

    C:\>priv.pl -s SeBatchLogonRight restore

    SE_BATCHLOGON_NAME (SeBatchLogonRight):

    MyDomain\Daemons

    MyDomain\Mail Users

    MyDomain\MailServices


    SE_RESTORE_NAME (SeRestorePrivilege):

    BUILTIN\Backup Operators

    BUILTIN\Server Operators

    BUILTIN\Administrators

    MyDomain\BackupService

    ```


    > Figure 2.4 Displaying who has particular privileges.


    # Displaying and Modifying User and Group Privileges


    User and group privileges are powerful only as long as they can be modified. This
    is the default operation of the script. If you specify neither the -s nor the
    -p switch, the parameters passed in are assumed to be user or group names. The
    privileges assigned to each of these users and groups are displayed. They are
    a simple and easy way to discover who has what privileges. Figure 2.5 shows the
    result of a simple query on the BackupService account.'
