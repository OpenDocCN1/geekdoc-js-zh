  md: '# Killing a Process


    Generally speaking, a process continues to run until it comes to the end of its
    processing, a user requests that it stop (typically by selecting some Exit command
    or menu item), or the process crashes. You can, however, force a process to terminate.


    All processes have at least one thread. A process begins by starting a thread
    of execution at the beginning of the program. This first thread is called the
    *primary thread*. When this primary thread terminates (for whatever reason), all
    threads come to a halt, and the process is purged from memory.


    # TerminateProcess()


    You can terminate a process by calling the Win32 API''s `TerminateProcess()` function,
    which terminates the primary thread—ending the program''s life. This is what happens
    when you terminate a process by using the Task Manager.


    When a process terminates, it returns an integer value to its parent process.
    This *result code* is typically used to determine whether the process was successful
    or had an error during processing. In Windows, such result codes are not often
    observed, but batch file writers use them to determine whether XCOPY.EXE or MOVE.EXE
    functioned correctly.


    # kill()


    `kill()` function terminates a process that the calling script has permission
    to terminate. This function does not work on services, however. It works by calling
    the Win32 API `TerminateProcess()` to terminate a process without prejudice; therefore,
    you should not expect the process to save any open documents or graciously unlock
    files and such. Use of the `kill()` function can have unexpected results because
    it may leave files in a partially stored state. Additionally, if the process is
    communicating through COM, DCOM, named pipes, or sockets (to name a few forms
    of IPC), you could have some problems, such as COM objects that have not been
    properly shut down or released. In general, don''t use `kill()` unless you know
    what you''re doing.


    You call the function by passing in at least two parameters:


    ```

    $Total = kill($ResultCode, $Pid1 [, $Pid2 [, .. $Pidn] ] )

    ```'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'The first parameter is a numeric integer that will be the result code that
    the process reports as its termination value. Typically, if you need to kill a
    process, you are not very concerned about its return value. However, if a batch
    file, for example, checks the return code of the process, you might want to return
    a particular value so that the script will process normally.


    The rest of the parameters ($Pid1, $Pid2, and so on) are the PIDs of each process
    to be terminated. You can list many as need termination. The function returns
    the total number of processes that were killed.


    Contrary to what you might assume, the kill() function does not always work. Under
    certain circumstances, such as when the process is secured (for example, the WinLogon
    service), if a process is interacting with DCOM, or even times if the process
    is interacting with the network (for example, resolving DNS names).


    Example 7.18 goes a step beyond Perl''s kill() function. This script accepts any
    number of PIDs passed in on the command line and attempts to kill each one. However,
    if Perl''s kill() function fails to terminate a process, it acts as a debugger
    so that it can attach to the process. After it is attached, you can kill it from
    the inside as though the terminate() were called from within the process, therefore
    eliminating the security issue.


    Even though this script goes through many steps, some processes (in particular
    the security services) still refuse to do much other than shut down Windows. If
    you could terminate them, they would immediately trigger a system reboot anyhow.


    This script assumes that the user running it has debug processes privilege (SE_DEBUG_NAME)
    assigned to her. Otherwise, the script''s attempt to set this privilege will fail.


