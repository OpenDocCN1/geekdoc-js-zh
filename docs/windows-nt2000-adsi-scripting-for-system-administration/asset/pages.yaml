  md: '# Monitoring Network Server States


    A perfect example of a monitoring daemon is a service that monitors machines for
    network uptime. The service occasionally pings a host and reports when the host
    does not respond. Example 5.3 does exactly.


    The service runs and monitors the machines in the @HOSTS array defined in lines
    18 through 22. In this case, the IP addresses 127.0.0.1, 192.168.3.22, and www.mydomain.com
    are monitored. You can replace these addresses with a list of IP addresses or
    computer names to monitor.


    Lines 18 and 22 decide which path to store a log file. You can easily modify these
    lines to specify the path of a named pipe so that you can monitor the service
    in real-time using Example 8.13 in Chapter 8.


    Notice that line 51 registers an Event Log source, which guarantees that any reports
    to the Event Log will be, at least, formatted nicely. This is significant because
    you''re reading the logged events, you might overlook any event that is not properly
    formatted (thinking the event was either a mistake or not something to take seriously).


    The script reports an event to the Event Log when significant issues arise, such
    as the starting and stopping of the service or as a server being unreachable.


    Lines 292 through 297 define the Alert() function. You can customize this monitoring
    script by adding code to this function to send an alert. Such alerts could alert
    you of the downed machine by sending email, paging, dialing a telephone, activating
    an X10 module, or whatever clever technique you can think of.


    To install this service, simply run it and pass it in an install parameter as
    follows:


    ```

    perl monitor.pl -install

    ```


    To remove a service that has already been installed, run the following:


    ```

    perl monitor.pl -remove

    ```


    # Example 5.3 A Machine Monitoring Service


    ```

    01. use Net::Ping;

    02. use Getopt::Long;

    03. use Win32::Daemon;

    04. use Win32::EventLog;

    05. use Win32::EventLog::Message;

    06.

    07. # How long to wait for a ping ($PING_TIMEOUT), how long to wait between

