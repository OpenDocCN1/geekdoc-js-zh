    We know how important it is to have access to detailed, solution-oriented information
    on core technologies. Landmark Series books contain the essential information
    you need to solve technical problems. Written by experts and subjected to rigorous
    peer and technical reviews, our Landmark books are hard-core resources for practitioners
    like you.


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_393_1.png)


    ESSENTIAL REFERENCE

    The Essential Reference series from New Riders provides answers when you know
    what you want to do but not how to do it. Each title skips extraneous material
    and assumes a strong base of knowledge. These are indispensable books for the
    practitioner who wants to find specific features of a technology quickly. Avoiding
    fluff and basic material, these books present solutions in an innovative, clean
    format—and at a great value.


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_393_2.png)


