- img_proc: true
  md: '# 158 Chapter 5: Monitoring and Reporting


    Because the message table that Win32::EventLog::Message uses no text itself, it
    does not allow for internationalization. After all, how do you localize the %
    string? The extension does, however, allow a script to register and unregister
    other message tables as sources. Therefore, a coder could create a message table
    using some message table compiler (such as MC.EXE, Microsoft''s message table
    compiler) and a C compiler and then use this extension to register the resulting
    .DLL file as an Event Log source. This provides a mechanism to customize and internationalize
    the Event Log display.


    # Event Log Sources


    Each Event Log can have several different sources, and typically, it does. usually
    has an Event Log source for every program that may need to report an Event. Often
    multiple programs share the same source (message file).


    You can discover what sources are registered using Win32::EventLog::GetSource()
    function. Example 5.1 shows how to use this function. The script accepts the Event
    Log as the first parameter, which can be any of the Event Logs, such as System,
    Application, Security, or any other Event Log that has been registered. The script
    displays all event sources registered under the specified Event Log.


    If the script is passed any additional parameters, they are interpreted as source
    names. The message table paths for only the specified source names are then displayed.


    For example, the command line


    ```

    perl DumpEvents.pl System

    ```


