  md: 'The user and password keys represent the user and password to use when the
    service starts. This is the account that the service will run under. The account
    must have the Logon as a Service privilege before the service starts (refer to
    Chapter 2, “Account Maintenance,” for a tool to set privileges on user accounts).
    The privilege is required only to start the service, not to install it. If no
    username is specified, the Local System is used.


    Specifying a full name for the user key is very important. This includes the domain
    that the user belongs to. The reason for using the full name is to resolve ambiguity.
    If the local machine has a Joel account and the default domain has a Joel account,
    the service may not know which account to use and default to the local computer
    account. An example of a full account name is Accounting\Joel.


    The parameters key is a string of values to pass into the service. That you might
    specify on a command line. If the service is a Perl script, this key contains
    the name of the Perl script to run and any optional switches. For example, assuming
    that the paths to PERL.EXE, the parameters may be c:\perl\myservice.pl -someswitch
    Parameters To In.


    The service_type key represents what type of service you are installing. Refer
    to Table 8.3 for a description of the various service types.


    The start_type key indicates when the service will start. Refer to Table 8.4 for
    the various options.


    The error_control key describes what Win32 does if the service starts but ends
    in an error. Refer to Table 8.5 for the different error control options.


    The load_order key is the name of a load order group that the service belongs
    to. Services particular load order group are started at the same time. This way,
    one group can be loaded after another group, which may be dependent upon. Usually,
    you don''t need to associate a service with a group, so this key is left blank.


    The dependencies key is an array of service names and load order groups. If a
    service is dependent upon another service to run (such as an email server is dependent
    upon the TCP/IP protocols), the service specifies its dependencies with this key.
    The service does not start until each specified service/device driver and at least
    one member of each specified group has started.


    The two types of dependencies are services/device drivers and groups. To specify
    that a dependency is a group, simply prepend the + (plus) character to the name
    of each group; otherwise, it is assumed to be a name of a service or device driver.'
