  md: '# Logon Scripts


    When a user logs on to an NT machine, a logon script can be executed. This script
    enables you, as the network administrator, to dynamically customize the user''s
    environment. Such flexibility has been a part of computer systems since the beginning.
    UNIX shell scripts have, for example, always provided facilities to customize
    the user''s environment during the logon process.


    The name logon script is a bit of a misnomer because it does not really have to
    be a script per se. It can be any executable program, such as an application,
    a batch file, a Java application, a Visual Basic script, or even a Perl script.
    Traditionally, logon scripts have been batch files.


    Because Windows NT enables different users to log on to different machines, setting
    up a computer for only one user is difficult. Logon scripts provide the mechanism
    required to guarantee that drives can be mapped to appropriate network servers,
    printers can be reconnected to local printing devices, environment variables can
    be updated, and so on.


    # How Logon Scripts Work


    When a user attempts to log on to a Win32 domain, her machine contacts a domain
    controller (DC). The DC holds each user account''s configuration information.
    The DC authenticates the user and (if her password is correct), she is permitted
    to log on to the domain.


    A DC that services a logon request is known as the logon session''s logon server.
    If a network has several DCs, a request to log on may be serviced by different
    DCs at different times. Which machine services your logon request is based, in
    part, on which controller is least busy.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Chapter 6: Logon Scripts


    # Note


    Logon scripts run only when a user interactively logs in to a domain (such as
    when logging on using the keyboard or via a terminal server client). If the user
    logs in over a network (as in mapping a drive letter to a server) or if the user''s
    account is impersonated (such as when a Web server authenticates an account),
    the logon script is not executed. ◆


    After a user successfully logs in to a domain, the machine attempts to run the
    user''s logon script. The logon script is always run from the logon server''s
    NetLogon shared directory. For example, if a user account is authenticated by
    the DC called LogonServer, and the user''s logon script is MyLogonScript.exe,
    Win32 attempts to run the following:


    ```

    \\LogonServer\NetLogon\MyLogonScript.exe

    ```


    This means that any account logon scripts must be a path relative to a DC''s NetLogon
    shared directory. If the file does not exist or is inaccessible (maybe because
    of security permissions), the attempt to execute the logon script simply fails,
    but no error message is displayed to the user.


    # Tip


    If you have many DCs on your network, maintaining up-to-date copies of any logon
    scripts on each controller is important. This is what the Replication Service
    was designed for. It enables you to designate one controller, typically the primary
    domain controller (PDC), as the logon script repository.


    Any script updates are made to scripts in the repository. Scripts that have been
    replicated to all the other DCs. ◆


    A logon script does not really have to be a script at all. It can be an executable
    program, a batch file, or a script such as Perl, Java, Python, or Visual Basic.
    For example, a logon script can be configured to be a Perl script like:


    ```

    UserScripts\MyPerlLogonScript.pl

    ```


    This example assumes, of course, that the machine the user logs on has the .pl
    extension associated with Perl (refer to Chapter 1, "Perl and the Admin," for
    details).


    In a user account, the logon script attribute is really just an arbitrary string.
    This means that an account can be configured to be more than just a path to a
    logon script. It can contain parameters to be passed in as well. For example,
    an account can be configured to pass in the name of the user as well as the local
    computer name (using environment variables):


    ```

    UserScripts\MyLogonScriptProgram.exe %USERNAME% %COMPUTERNAME%

    ```'
  merge: -1
