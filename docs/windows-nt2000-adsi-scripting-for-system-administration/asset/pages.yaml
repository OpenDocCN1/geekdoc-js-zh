  md: '# Inheriting File Handles (Pseudo-Forking) 255


    At this point, you might be asking why any of this information is important. After
    all, Example 7.20 produces the same results as Example 7.21 using twice as much
    code. This concept is important because it illustrates how a script can redirect
    one of standard I/O handles to a file or socket handle. Say that you did just
    that—you redirected STDOUT to a socket. If you create a new Win32 process while
    specifying that you want to inherit all file handles, the new process also redirects
    STDOUT to the socket. This means you can pass file and socket handles across process
    boundaries. In other words, you have a simple way of emulating fork().


    Keep in mind that this is not the same as a true fork() in the new process does
    not have access to a copy of its parent variables; nor does it continue processing
    where the parent process spawned the new process. It does, however, enable a daemon
    process to “fork” off a new process, handling the open file or socket handle.


    Now look at Example 7.22, which is a simple socket daemon script. When it runs,
    it binds to a port and waits for a client to connect. When it occurs, the script
    redirects STDOUT to the socket, creates a new process, replaces STDOUT with its
    original value, closes the socket (which does not affect the new process at all),
    and waits for another connection.


    The magic lies here in myFork() subroutine in lines 42 through 70. Line 55 saves
    STDOUT to a backup handle for later use. Line 56 redirects STDOUT to the socket,
    which is connected to a client that connected to the daemon.


    Line 58 performs the actual process creation. Notice that the variable sInherit
    is set to TRUE (a value of 1). This is the secret: it forces the new process to
    inherit the open file handles, which include STDOUT redirected to the socket.
    Only the other process-connection functions can perform such a feat Win32::AdminMisc::CreateProcess()
    and CreateProcessAsUser() functions (unless you want to consider using Win32::API
    and manually calling the Win32 API CreateProcess() function).


    The script creates a new Perl script (line 48) by running the same script (represented
    as $0 in line 49). Command-line argument is passed in declaring that the new process
    is a child (the child:iProcessCount in line 49). When the new process starts,
    lines 4 through 8 process the script as a child, not as a daemon.


    Line 52 is very important to making this emulated fork() work. This line sets
    the CreateProcess() flag to €. Normally, when creating a new Perl process, you
    specify the flag CREATE_NEW_CONSOLE. However, that would cause the STDIN, STDOUT,
    and STDERR handles to be reset as the new window is created. This means that the
    remapping of STDOUT to the socket (line 56) would be lost, and the new Perl process
    would not have any way to access the socket.'
