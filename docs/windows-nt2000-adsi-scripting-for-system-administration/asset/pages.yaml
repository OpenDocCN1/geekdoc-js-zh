- img_proc: true
  md: '# Creating Processes 219


    in a Perl script, the test.pl script would successfully execute, assuming .pl
    is associated with perl.exe.


    Just as with the other process-creation functions already discussed, on a Windows
    2000 machine, you can pass the name of the executable without an extension, as
    in


    ```

    system(''test'');

    ```


    provided that the extension has been properly associated with an executable (for
    example, .pl associated with perl.exe; again, see Chapter 1 for details) and the
    extension has been added to the PATH environment variable.


    Like the other process-creation functions, a process path with embedded spaces
    must be surrounded by quotation marks, as shown here:


    ```

    system(''my long file name.exe'');

    ```


    The difference between the system() function and the others is that it does not
    capture the STDOUT from the new process. Even though a script does not have to
    wait to capture the output of the system() function, the script enters a blocking
    state and waits until the new process has terminated.


    # Win32::Spawn()


    So far, you have examined several process creating functions, all of which have
    their unique qualities. They all do, however, share one discouraging commonality:
    they all block while the new process runs (with the exception of fork()), which
    is available only in Perl version 5.6 and higher, and piped opens when not reading
    from the pipe. You need a way to spawn a process that runs independently from
    the calling script.


    Win32::Spawn() is unique to Perl because it exists only on Win32 machines. This
    function is quite simple:


    ```

    Win32::Spawn($App, $Args, $SPid);

    ```


    The first parameter you pass in is the path to the program to be executed. The
    second parameter is the arguments to pass into the application. The third parameter
    must be a scalar variable (such as $SPid); it cannot be a constant (such as 1
    or "hello").


    You should know about a couple of things before using this function, to be sure
    to read the next few paragraphs; otherwise, you may be pulling your hair in frustration.
    If the path has embedded spaces, you do not have to surround the path with double
    quotation marks. Because the first parameter represents only the path, you don''t
    need to delimit the path from anything else.'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'The application that you specify must be either a full path to the executable
    (such as c:\winnt\notepad.exe) or a relative path (such as notepad.exe or ..\notepad.exe).
    If you specify a relative path, the current drive and directory are automatically
    prepended to the application name. Therefore, don''t pass in NOTEPAD.EXE expecting
    it to run just because the application can be located by the PATH environment
    variable.


    The $Args parameter is pretty simple to understand. If you''re running the Notepad
    program and want it to open a particular file, pass the path to the file as the
    second parameter. Simple enough, right? Well, almost. It is not so obvious as
    the $Args parameter must start with the name of the executable. Yes, you read
    correctly: You need to specify the executable twice (once in the first parameter
    and again in the second). To be more accurate, you need to specify something (actually
    anything) in the beginning of the $Args parameter that represents the executable.
    It can be anything, so as


    ```

    Win32::Spawn(''c:\winnt\notepad.exe'', ''blah c:\temp\test.txt'', $Pid);

    ```


    When Win32 creates the new process, it passes the processes in $Args parameter
    as the command line to the new process. This entire string is parsed and presented
    to a C program as its argv. Therefore, in this example, a C program''s argv[]
    value would be "blah". The third parameter, $Pid, would be a scalar variable after
    the new process is created, the scalar passed in as the third parameter is set
    to the value of the new process identifier. The silly thing is that if you pass
    in a constant, the function fails, but only after the process has been created.


    As an aside, you can pass in a reference as the third parameter, like this:

    Win32::Spawn($App, $Args, \Pid);


    This reference works, however, who knows what will happen to \Pid? I mention this
    point because no checking is done to make sure that the third parameter is a reference.
    If you pass in a scalar reference, the scalar itself is not set correctly.


    The truly unfortunate aspect of this function is that you cannot specify any environment
    variables in the parameters. If $App is "%SystemRoot%\notepad.exe", the function
    fails because path contains environment strings. You can call in Win32::ExpandEnvironmentStrings(),
    and the function returns the passed-in string with all environment variables expanded.
    This is truly a convenience.

    Example 7.9 shows an example.


    # Example 7.9 Expanding Variables for Win32::Spawn()


    ```

    01. use Win32;

    02. my $App = "%SystemRoot\notepad.exe";n03. my $Args = "notepad %temp\test.txt";n04.
    $App = Win32::ExpandEnvironmentStrings($App );

    05. $Args = Win32::ExpandEnvironmentStrings($Args);

    ```'
