    # Creating Hard File Links


    UNIX users could always create hard links between files, and starting with Windows
    2000, so users of the Win32 platform. Previous versions of Windows NT were able
    to create links by utilizing a POSIX subsystem; however, with Windows 2000 the
    link functionality is built directly into the Win32 API. Unfortunately, these
    links are not as rich as their UNIX brethren. UNIX''s hard links, they must be
    located on the same volume. This means a link must reside on the same hard drive
    as the file it is linked to. Win32, however, does not have the capability to symbolically
    link across volumes. The closest equivalent is shortcut, but that is interpreted
    by an application, not the operating system (therefore, you cannot rely on all
    programs to understand how to use them).


    This hard-linking capability is supported only on NTFS volumes. Example 3.3 creates
    such hard links. The script takes in two parameters like this:


    ```

    perl ln.pl c:\temp\MyExistingFile.txt c:\MyNewLink.txt

    ```


    The first parameter is the existing file, and the second parameter is the path
    to where the new linked file will be created. This new link file will be (for
    all practical purposes) the same file as specified in the first parameter.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Chapter 3: Tools


    Editing either of these files results in both files being modified. This makes
    sense because you really have only one file, just two separate file entries for
    it.


    After a hard link has been created on an NTFS volume, it is literally linked to
    the original file. Even if you move the original or linked file, they both still
    point to the same data. Additionally, you can modify the content of either file,
    and it updates the same data. This can cause concurrency problems if you are accessing
    multiple files linked to. Because the file is only a link to the original file,
    it can be deleted without affecting the original file.


