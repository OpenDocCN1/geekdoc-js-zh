  md: '# Chapter 9: ADSI and WMI


    This would select the Browser service from the computer called MyComputer in the
    domain called MyDomain.


    This script displays all objects that the specified path contains. For example,
    if you pass a path to a domain (as in WinNT://MyDomain), it returns a list of
    all users, groups, and machines that make up the domain.


    The interesting thing about this script is that it enables a to impersonate another
    user. The user can do so by specifying the -u and -p switches, in this example:


    ```

    perl DisplayADSIObject.pl -u Administrator -p MyPassword

    ```


    Optionally, the user can pass a list of filters using the -f. If any filters are
    specified, only objects that match one of these filters are displayed. For example,
    the following command displays only user accounts and local groups from the computer
    called MyMachine:


    ```

    perl DisplayADSIObject.pl -f user localgroup WinNT://MyMachine,computer

    ```


    The first thing to notice about Example 9.5 is that line 4 loads the Win32::OLE::const
    module, which loads the ADSI library and all constants associated with it. This
    point is important because the script uses some of these constants to perform
    any user impersonation.


    The script performs its impersonation magic by providing GetADSIObject() subroutine.
    The script calls this function in line 13. Notice that it passes in a reference
    to the %config hash. The hash contains all configuration options such as the ADSI
    path, username, and password.


    Line 16 binds to the schema object that represents the ADSI COM object requested
    in line 13. The binding to the schema object allows the script to discover class
    information, as if the object is a container. A container can hold other objects
    (a directory is a container because it holds files and other directories). If
    it is a container, a filter can be applied to it.


    When a container''s objects are enumerated, all objects are referenced. However,
    if a filter is applied to a container, an enumeration of its results in only those
    objects that are of the type specified by the filter. For example, enumerating
    a domain''s objects can yield results, local groups, global groups, and computers.
    However, if a filter is applied to a domain object that specifies only users and
    computers, only user and computer objects are enumerated.


    Line 24 applies a filter to the ADSI COM object if the user specifies a list of
    classes to filter. Note that the filter accepts only an array reference. It can
    be an anonymous array or (in this case) a reference to an array.


    Lines 28 through 31 perform the actual enumeration and display each object held
    within the ADSI COM object.'
