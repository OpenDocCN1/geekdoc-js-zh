    different machines to perform this task, using a GUI-based application can be
    quite time-consuming. Example 9.11 enables you to query or set properties on multiple
    machines or virtual servers at one time.


    The script takes any number of IIS: relative paths that you want to modify. It
    also takes any number of -p switches, which indicate what properties to query
    or set. Check out this example:


