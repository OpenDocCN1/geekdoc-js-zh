    # Modifying Variables


    Generally speaking, a logon script does not need to modify environment variables.
    Typically, a script queries such a variable so that it can make logical decisions.
    For example, a logon script may query the Temp variable to determine the path
    of the temporary file directory, possibly to clean it out. Such querying is common,
    but setting environment variables from a logon script is not common. There are,
    however, exceptions to this rule, as as a logon script wants to record the time
    and date when the user logged in.


    A nonadministrative user''s logon script has permissions to modify only the user
    set of environment variables, not the system set (unless administrative privileges
    have been granted). Consider a machine with a system environment variable called
    INCLUDE that consists of a list of semicolon-separated paths pointing to where
    C++ header files are located. This is a system variable, so it cannot accidentally
    be modified by a user. When a developer needs to point to her own set of include
    directories, she could create a user environment variable named INCLUDE that would
    override the system version, losing whatever the system administrator had set.
    If the INCLUDE system variable contained a reference to %INCLUDE%, then the user
    variable would expand the reference into the system variable. This would allow
    the user to modify the INCLUDE variable''s value without modifying the value directly.


    You can implement another strategy to ensure that the system variable is always
    first in a path. For example, if the user adds his own version of the INCLUDE
    variable


    ```

    C:\MyInclude;%INCLUDE%

    ```'
