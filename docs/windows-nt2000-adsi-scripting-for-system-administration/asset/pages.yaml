  md: "# 226 Chapter 7: Processes\n\nSimple forking can be achieved in a script, such\
    \ as in Example 7.12. In this script, a fork takes place, and both the parent\
    \ and child processes count from 100 to 0, printing each number along the way.\
    \ The purpose here is to demonstrate how a fork works.\n\nLine 2 is very important,\
    \ although the reason may not be so obvious. This line enables autoflush mode,\
    \ which means that when the script prints something, it is automatically flushed,\
    \ and the printed text is forced to the screen. Without this line, all output\
    \ to the screen would be buffered, resulting in delayed printing. That would make\
    \ it look as though one process ran and finished, and then the other process ran\
    \ and finished with no concurrency in their.\n\nLine 5 performs the actual forking.\
    \ Notice that the script checks whether the command returned undef. If it does,\
    \ the fork fails and the script dies. Otherwise, two running processes all call\
    \ the Count() subroutine.\n\n# Example 7.12 Example of Forking\n\n```\n01. # Turn\
    \ off output buffering (turn on auto flush)\n02. $! = 1;\n03.\n04. # Fork the\
    \ process\n05. defined ($pid = fork()) || die \"Could not fork: $!\\n\";n06. if\
    \ ($0 == 0) {\n07.\n08. # We get here if we are the child process\n09. Count('Child:\
    \ \\ ');\n10. }\n11. else\n12. {\n13. # We get here if we are the parent process\n\
    14. Count('Parent: \\ ');\n15. }\n16.\n17. # Both parent and child will get here\n\
    18. $string = ( $pid ) ? \"Parent \" : \"Child\" . . \" process has finished.\\\
    n\";n19. print $string;\n20.\n21. sub Count\n22. {\n23. my ($String) = @_;\n24.\
    \ my $iCount = 100;\n25.\n26. while ($iCount--) {\n27. \n28. print \"\\$String\\\
    $iCount\\n\";n29. }\n30. }\n```\n\nForking is really quite simple. Just make sure\
    \ that the script can determine whether it is a child or parent process and execute\
    \ code accordingly. A better example of how to use fork is Example 7.24."
