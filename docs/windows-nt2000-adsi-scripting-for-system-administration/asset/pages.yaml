    # Expiring Passwords


    You can configure an account so that the next time the user logs on is forced
    to change his password. This is typically performed automatically when you set
    a password age for accounts. When an account''s password grows older than is allowed,
    the account password is automatically expired.

    To manually expire an account, you must set a flag on the account. Not only does
    the password expire when it has grown older than is allowed, but you can also
    purposely expire the account by setting this flag. The User'
