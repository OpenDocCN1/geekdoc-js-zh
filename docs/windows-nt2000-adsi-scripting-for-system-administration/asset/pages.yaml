    \ to re-create your workstation or domain from scratch, you might not want to\
    \ re-create an identical copy of the database. Or if you want to create local\
    \ service accounts on hundreds of workstations, a physical copy of the SAM database\
    \ will do you no good.\n\nSo, this is where Perl comes to the rescue again. An\
