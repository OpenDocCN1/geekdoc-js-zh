    |---|---|

    | acct_expires | This attribute indicates the time when the account expires. After
    the account expires, the user is locked out and cannot log on. An administrator
    must unlock the account through the User Manager or with Example 2.6 (shown later).
    |


    Even though the script uses several hard-coded configuration options, some user-specific
    attributes can be specified from the command line. These particular attributes
    are user-specific rather than domain-specific hard-coded options. Table 2.2 describes
    the command-line switches that can be specified.


    # Table 2.2 Command-Line Switches for Example 2.1


    | Switch | Function |

    |---|---|

    | -m Machine | Specifies the computer where the account is located. |

    | -d Domain | Specifies the domain where the account is located. It overrides
    any -m switch. |

    | -c Comment | Contains the user account''s comment. |

    | -f FullName | Specifies the user''s full name. |

    | -g Group | Indicates a group that the user will be a member of. It can be either
    a global or local group. Multiple -g Group switches can be specified. |


    If neither domain nor machine names are specified, the script defaults to the
    current domain of the user running the script.


    An example of using this script:


    ```

    perl AddUser.pl -d MyDomain -c "Joel''s Account" -f "Joel Smith" -g Users -g "Domain
    Users" -g Joel

    ```


    In this particular example, the user is creating a new account called Joel in
    the MyDomain domain. The account has become a member in both the Users and Domain
    groups.


    After you run this script, you should perform a domain synchronization. Refer
    to the "Synchronizing Domain Controllers" in this chapter.


