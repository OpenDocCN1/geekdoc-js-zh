    # CASE STUDY Implementing a Unified Logon Script


    A new network administrator was hired into a medium-sized company. One of first
    tasks was to revamp the logon process for her users. She was in charge of several
    thousand users, each of whom ran one of several different logon scripts. These
    scripts were quite elaborate and designed to perform specific tasks, making it
    difficult to adapt them to groups of users.


    The administrator decided to utilize a unified logon script for all her users.
    Because she was a member of several NT groups, she decided to make the main logon
    script call out and run separate'
