  md: '# 192 Chapter 6: Logon Scripts


    User environment variables are separate from system environment variables. The
    system has its own set of variables that it uses from boot time until shutdown.
    This set includes important variables as PATH and as by either the system itself
    or a user with administrator privileges.


    Typically, user variables override system variables. For example, if a system
    variable INCLUDEPATH is set to c:\SystemInclude, and a user who has a user variable
    INCLUDEPATH set to c:\MyInclude logs, then any application that uses the INCLUDEPATH
    variable will only see the user version: c:\MyInclude. This can be a problem because
    it means that a user can use either the system value or the user variable, but
    not both at the same time.


    The workaround is to embed the system variable within the user variable. To continue
    the preceding example, if the user variable INCLUDEPATH is set to %INCLUDEPATH%;c:\SystemInclude,
    an application that uses this environment sees INCLUDEPATH as c:\SystemInclude;
    the system version of. When you place a reference to the environment variable
    within the user variable, it inherits the system variable''s value. This trick
    works only in that direction. A system variable cannot inherit from a user variable.
    If it did, this could result in redundant loops of variable inheritance. The moral
    here is that if a user variable refers to itself, it is really referring to the
    system environment by the same name.


    As you already learned, a user variable will override a system variable by the
    same name. This variable is special because it is required by the system. In this
    case, any user-defined PATH is appended to the system''s variable. Thus, if any
    user defines PATH to be c:\temp and the system''s PATH is set to c:\windows;c:\system32,
    the resulting PATH is c:\windows;c:\system32;c:\temp. This allows configurations
    as a user defining his PATH to point back to his home directory—for example, \serverhome\bin.
    This enables the user to place tools and applications he uses often in one place
    so that he can seamlessly access them from anywhere on the LAN.


    # Perl and Environment Variables


    Because a user variable can override a system variable, it is difficult for a
    Perl script to discover the version of the variable that the system intended for
    application to use. Perl accesses environment variables by the %ENV hash. It accesses
    only the set of variables exposed by the current environment. This environment,
    just like a DOS box, does not have a way to distinguish system versus variables.
    Therefore, Perl is unable to see system variables if a user variable exists with
    the same name.'
  merge: -1
