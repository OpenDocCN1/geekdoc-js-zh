  md: '# Configuring Logon Scripts


    Because logon script attributes are arbitrary strings, you can use them to run
    Perl from the logon server and pass in the name of the logon script. For example,
    say that you have installed Perl in a Perl directory under the NetLogon share
    on all your DCs. You can configure your user accounts to have this logon script:


    ```

    perl\bin\perl.exe %LOGONSERVER\NetLogon\Users\Scripts\MyLogonScript.pl

    ```


    Of course, when this script is run, the logon server and NetLogon share are prepended,
    so Win32 actually executes the following:


    ```

    //MyLogonServer\NetLogon\bin\perl.exe

    //MyLogonServer\NetLogon\Scripts\MyLogonScript.pl

    ```


    In this case, %LOGONSERVER environment variable is replaced with the name of the
    DC (\MyLogonServer) that is authenticating the user. By doing this, you don''t
    need to install Perl on individual user machines but instead only on the DCs.
    Accessing Perl across the network in this manner presents some pitfalls, however.
    Refer to Chapter 1 for more information.


