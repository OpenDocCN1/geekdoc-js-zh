  md: '# 12 Chapter I: Perl and the Admin


    So, why would you want to use one easy answer to this question; the choice may
    totally depend on the programmer and the situation. For example, if I am writing
    a script that makes extensive use of Win32::Lanman, I would probably use my NetServerEnum()
    function instead of loading the Win32::NetNetAdmin extension just for a call to
    its equivalent GetServers() function. Another reason is to consider the simplicity
    or completeness of one extension''s function, such as creating a new account.
    The Win32::Lanman::UserAdd() function, example, takes the place of the Win32::NetAdmin::CreateUser()
    and Win32::AdminMisc::UserSetMiscAttributes() functions.


    One simple criterion that is commonly used in deciding what extensions to use
    has to do with its availability. Because Win32::NetAdmin comes with ActivePerl
    as a part of the standard library, it is more likely that machines with Win32
    Perl installed will have that extension. Using Win32::Lanman, however, requires
    that someone download and install it.


    # Consistency


    Keep in mind that Perl extensions are all of inconsistencies. Even though many
    of the Win32 extensions call the same Win32 API functions (as we saw in the previous
    section), they may expose these functions differently. For example, to add a user
    to a local group, the Win32::NetAdmin extension uses


    ```

    LocalGroupAddUsers($Server, $GroupName, @Users);

    ```


    However, Win32::Lanman uses


    ```

    NetLocalGroupAddMembers($Server, $Group, \UserID);

    ```


    The first difference is the name of the function. If you are a C programmer or
    a hard-core Delphi coder, using the Win32::Lanman version of this function makes
    sense because its name is identical to the Win32 API. The second difference is
    that the former version of the function accepts an array of username strings (SID).
    The latter function accepts an array of user security identifiers (SID).


    These mini-issues come up quite often when you''re programming Win32 Perl. If
    you decide to use one extension over another, you might have to implement a different
    strategy than you used the other extension.


