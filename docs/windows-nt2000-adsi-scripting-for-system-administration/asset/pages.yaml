    # Email


    Alerts usually must be fast. Otherwise, by the time you receive the alert, it
    may be too late to correct a problem. Network messaging and paging generally are
    good mechanisms to deliver alert information because they are fast; however, both
    can fail. A message may be sent successfully, but you might be out of range when
    the page is sent. For these reasons, a message sent as email will most likely
    find its way to the recipient and provide a good historical trail.


    Example 5.7 demonstrates sending an alert via email. You can add the SendAlert()
    function to any monitoring script to provide alert support. The Net::SMTP module
    comes as part of the lib archive, available on CPAN.


    To use Example 5.7, just pass in the message email followed by the email addresses
    of the recipients—for example:


    ```

    perl SendEmail.pl "This is my test message" joel@mydomain.com betty@mydomain.com

    ```


    In this script, we are using the Net::SMTP module, but you could use a variety
    of other email transport mechanisms. This could be as low-level as opening your
    own socket to an email server as high-level as using COM to create a API session
    via CDO. Alternatively, you could just shell out to some third-party application,
    such as SENDMAIL.EXE or BLAT.EXE. The decision to implement Net::SMTP was made
    due to simplicity and ubiquity.'
