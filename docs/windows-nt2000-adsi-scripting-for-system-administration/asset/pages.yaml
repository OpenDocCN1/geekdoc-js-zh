  md: 'Perl Information


    # Installing Extensions


    By far the easiest way to install an extension is by using the PPM Perl script.
    You typically can use this by specifying the following command from a DOS box:


    ```

    ppm install win32-api

    ```


    This particular command will attempt to download and install the Win32::API extension.
    Notice that you need to replace the Perl namespace delimiter :: (double colons)
    with a dash. By default, the PPM script will contact ActiveState to retrieve the
    requested extension. In some cases, however, updated versions of extensions can
    be found in other locations. Such locations can be specified with a --location
    switch. For example, to install Win32::EventLog::Message


    ```

    ppm install win32-eventlog-message \

    location=http://www.roth.net/perl/packages/

    ```


    If you are located behind a firewall or proxy server, you need to read the documentation
    for PPM.


    # Perl Information


    After you have digested all the information in this book, you may be wonderingwhere
    to go next. That is easily answered—you go online! In this section you will find
    a small sampling of Internet sites you can check out to find more information
    on Win32 Perl. These particular sites are well-suited to act as a springboard,
    thrusting you headlong into the world of Perl programming.


    # Web Sites


    The Official Perl Web Site


    ```

    http://www.perl.com/

    ```


    Make no mistake about it—this is the official Perl Web site. You can depend on
    finding the real scoop on Perl.


    # CPAN


    ```

    http://www.cpan.org/

    ```


    The Comprehensive Perl Archive Network (CPAN) is the global network of Perl code.
    Authors post modules, scripts, and extensions here, and they are replicated around
    the world. Chances are that someone has already written code to do what you need.
    You would look for it here.'
  merge: -1
