  md: '# Creating an Alert


    In many cases, monitoring scripts can manage events programmatically. If a service
    stops, for example, a monitoring script can restart it. Or if a hard drive fills
    up, a script that can delete old files to free up space. However, when a program
    cannot relieve a problem, some type of alert must be triggered. Such an alert
    can be created by sending a network message, sending email, or paging a system
    administrator.


    # Network32 Messages


    Win32 machines can send network messages to other Win32 machines. These messages
    can be sent to a user, a machine, or a domain (work-group). These network messages
    can be viewed by any NT or Windows 2000 machine running the Messenger service
    or a Windows 95/98/ME machine running the WINPOP.EXE program.


    Sending network messages is incredibly easy. One method is to shell out and run
    the send command. However, this method works only on Windows NT/2000. Another
    method is to use Win32::Message extension, as in Example 5.5. This script sends
    a message to any number of specified users. The specified recipients can be usernames,
    computer names, or NT domain names.


    When you use the Win32::Message::Send() function, the recipient can be a machine
    or domain name appended with an asterisk (*), which indicates to send the message
    to every user on the machine or in the domain. The result is that all users currently
    interactively logged on to the machine or domain will receive the message.


    A monitoring script that needs to send out an alert to a list of recipients can
    use the same SendAlert() function defined in Example 5.5, lines 5 through 22.


    A downside of sending network messages is that there is no guarantee that the
    user will receive the message. If the receiver''s messenger service (or WINPOP.EXE)
    is paused or stopped, the message is not received. Additionally, if a user logs
    on multiple computers at once, the alert finds only the machine that the user
    last logged on.


    Example 5.5 Sending Network Messages


    ```

