    # Conclusion


    There are dozens of different tools that an administrator can use to make her
    job easier. Tools ranging from open source code to commercial shrink-wrapped packages
    provide the necessary utilities to accomplish an administrative goal.


    This chapter demonstrates Perl''s remarkable capability to exercise the Win32
    API to accomplish tasks. We have uncovered ways to use Perl to manage the Win32
    file system, permissions, and the Registry. The tools discussed are useful and
    help define techniques that can be modified to target other tasks.'
