    # Privileges


    In Win32, a privilege is something that an administrator grants to an account.
    A privilege dictates what account is permitted to perform what actions. For example,
    the SE_BACKUP_NAME privilege enables an account to back up files and directories
    bypassing security permissions placed on the files and directories. For an account
    to shut down a computer remotely, it requires the SE_REMOTE_SHUTDOWN_NAME privilege.
    An account has to be specifically granted these permissions by an administrator.


    Privileges can be assigned to either a user account or a group. Assigning a privilege
    to a group can be very useful, especially if groups of user accounts share a particular
    purpose. Consider, for example, the ability to take ownership of objects such
    as files, directories, and Registry keys. This powerful privilege renders all
    security useless because a user with this privilege can simply become the owner
    of any object (and therefore have full permissions to manipulate it). It stands
    to reason that such a powerful ability should be bestowed upon network administrators.
    If your domain has several administrators, you might find yourself assigning privilege
    to each administrator account. A more efficient method would be to assign the
    privilege to the Administrators and Domain Adm groups. This way, user accounts
    assigned to either of these groups have this privilege.


    Normally, you would have to run the User Manager or MMC to assign privileges (also
    known as user rights). Sometimes these privileges are assigned automatically for
    the administrator, such as when an account other than local system is chosen to
    log on for a service. Example 2.9, shown later, is a full-privilege management
    script that enables you to query'
