  md: '# Windows 2000

    Routing and

    Remote Access

    Service

    By Mackie Charles

    1st Edition

    400 pages, $34.99

    ISBN: 0-7357-0951-3


    # Windows 2000

    DNS

    By Herman Knief,

    Jeffrey Graham,

    Andrew Daniels, and

    Roger Abell

    2nd Edition

    480 pages, $39.99

    ISBN: 0-7357-0973-4


    Ideal for system administrators looking to create cost-effective and secure remote
    access across the network. Author Mackie Charles uses concrete examples to demonstrate
    how to smoothly integrate Windows 2000 routing with your existing infrastructure,
    and connects users to the network while maximizing bandwidth. Featured coverage
    includes new authentication models, routing protocols, configuration of the Windows
    2000 router, design issues, security, and troubleshooting.


    Focusing on key topics like designing and securing DNS services, planning for
    interoperation, and installing and using DHCP and WINS services, Windows 2000
    DNS is a comprehensive guide to the newest iteration of Microsoft''s DNS. The
    authors provide you with real-world advice, best practices, and strategies you
    will need to design and administer DNS for optimal.


    # Windows 2000

    Deployment &

    Desktop

    Management

    By Jeffrey A. Ferrís

    1st Edition

    408 pages, $34.99

    ISBN: 0-7357-0975-0


    # Windows 2000

    User Management

    By Lori Sanders

    1st Edition

    240 pages, $34.99

    ISBN: 1-56205-886-X


    With the dawn of Windows 2000, it has become even more difficult to draw a clear
    line between managing the user''s environment and desktop. This book, written
    by a trained trainer and consultant, provides a comprehensive, practical guide
    to managing users and their desktop environments with Windows 2000.


    More than a simple overview of new features and tools, this book is a thorough
    reference to deploying Windows 2000 Professional to corporate workstations. The
    expert real-world advice and detailed exercises make this a one-stop, easy-to-use
    resource for any system administrator, integrator, engineer, or other IT professional
    planning rollout of Windows 2000 clients.'
  merge: -1
  pgno: 395
- img_proc: true
  md: '# Windows 2000 Professional


    By Jerry Honeycuttn1st Edition

    330 pages, $34.99

    ISBN: 0-7357-0950-0


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_396_0.png)


    # Windows 2000 Server Professional Reference


    By Karanjit Siyan, Ph.D.

    3rd Edition

    1848 pages, $75.00

    ISBN: 0-7357-0952-1


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_396_1.png)


    Windows 2000 Professional explores the power available to the Windows workstation
    user on the corporate network and Internet. The book is aimed directly at the
    power user who values the security, stability, and networking capabilities of
    NT alongside the ease and familiarity of the Windows 9X interface. This book covers
    both user and administration topics, with a dose of networking content added for
    connectivity.


    Windows 2000 Professional Reference is the benchmark of references available for
    Windows 2000. Although other titles take you through the setup and implementation
    phase of the product, no other book provides the user with detailed answers to
    day-to-day administration problems and tasks. Solid content shows administrators
    how to manage, troubleshoot, and fix problems that are specific to heterogeneous
    Windows networks, as well as Internet features and functionality.


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_396_2.png)


    # Planning for Windows 2000


    By Eric K. Cone, Jon Boggs, and Sergio Perezn1st Edition

    448 pages, $29.99

    ISBN: 0-7357-0048-6


    # Windows 2000 Security


    By Roberta Braggn1st Edition

    608 pages, $39.99

    ISBN: 0-7357-0991-2


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_396_3.png)


    Are you ready for Windows 2000? This book explains the steps involved in preparing
    your NT-based heterogeneous network for Windows 2000. Rollout procedures are presented
    in detail as the authors draw from their own experiences and scenarios to explain
    an otherwise tangled series of procedures. Planning for Windows 2000 is an indispensable
    companion to any considering migration.


    No single authoritative reference on security exists for serious system administrators.
    The primary directive of this title is to assist the Windows networking professional
    in understanding and implementing Windows 2000 security in his organization. Included
    are Best Practices sections, which make recommendations for settings and security
    practices.'
  merge: -1
  pgno: 396
- img_proc: true
  md: '# Windows NT/2000

    Network Security

    By Eugene Schultz

    1st Edition

    440 pages, $45.00

    ISBN 1-57870-253-4


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_397_0.png)


    # Windows 2000

    Virtual Private Networking

    By Thaddeus Fortenberry

    1st Edition

    350 pages, $45.00

    ISBN 1-57870-246-1

    January 2001


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_397_1.png)


    Windows NT/2000 Network Security provides a framework that will promote a genuine
    understanding of the Windows security model and associated capabilities. The goal
    is to acquaint readers with the major types of Windows security exposures when
    used in both peer-to-peer and client-server settings. This book teaches readers
    specific security controls and settings that address each exposure, and shows
    how to evaluate tradeoffs to determine which control (if any) apply.


    Because of the ongoing push for distributed workforce, administrators must support
    laptop users, home LAN environments, complex branch offices, and—all within a
    secure and effective network design. The way an administrator implements VPNs
    in Windows 2000 is different than that of other operating system. In addition
    to discussions about Windows 2000 tunneling, new VPN features that can affect
    Active Directory replication and Network Address translation are also covered.


    # Windows NT/2000

    Thin Client Solutions

    By Todd Mathers

    2nd Edition

    840 pages, $45.00

    ISBN: 1-57870-239-9


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_397_2.png)


    # Windows 2000

    Active Directory Design & Deployment

    By Gary Olsen

    1st Edition

    648 pages, $45.00

    ISBN: 1-57870-242-9


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_397_3.png)


    A comprehensive reference to MetaFrame 1.8 and Terminal Server Edition, this book
    should be the first source for answers to the tough questions on the TSE/MetaFrame
    platform. Building on the quality of the previous edition, additional coverage
    of installation of Terminal Services and MetaFrame on a Windows 2000 Server, as
    well as chapters on TSE management, remote access, and application integration,
    are included.


    This book focuses on the design of a Windows 2000 Active Directory environment,
    and how to develop an effective design and migration plan. The reader is lead
    through the process of developing a design plan by reviewing each pertinent issue,
    and then expert advice on how to evaluate each issue as it applies to the reader’s
    particular environment. Practical examples illustrate all of these issues.'
  merge: -1
