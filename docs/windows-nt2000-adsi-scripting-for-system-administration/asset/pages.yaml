    Impersonation Far, the examples in this chapter have been pretty straightforward.

    However, they all assume that the user running the Perl script has permission
    to interact with the ADSI COM object. If the user is an administrator, this assessment
    is probably accurate. However, when a different user account is required, ADSI
    provides a mechanism that enables the user to impersonate another user, provided
    that she has the correct credentials.


    A Perl script can request an ADSI COM object bound to the top class in a given
    ADSI provider namespace. The resulting class exposes a method called openObject().
    This method accepts an ADSI path, along with a user ID, password, and options.


    Example 9.5 displays all ADSI objects found within a specified ADSI path. By default,
    the path is WinNT://DOMAINNAME, where DOMDOMAIN is the name of the local machine''s
    domain. You can change the ADSI path by passing one in from the command line.
    For example,


    ```

    perl DisplayADSIObject.pl WinNT://MyDomain

    ```


    In this case, the MyDomain is specified. Any valid ADSI path can be passed in
    such as:


    ```

    perl DisplayADSIObject.pl WinNT://MyDomain/MyComputer/Browser,service

    ```'
