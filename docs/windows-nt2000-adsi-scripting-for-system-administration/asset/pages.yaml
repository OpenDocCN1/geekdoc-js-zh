    # Inheriting File Handles (Pseudo-Forking)


    When Win32 creates a new process, a flag indicates whether to inherit open file
    handles. They are Win32 handles, not C runtime or Perl file handles. However,
    Perl file handles are based on C runtime handles, and C handles are based on Win32
    file handles. This means that when Perl spawns a new process, open file and socket
    handles can be inherited. The problem is that a new Perl process cannot create
    a file or socket handle from a Win32 handle.'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'One way around this problem is to redirect a common handle, such as STDOUT,
    to a socket or file. If a script is to then create a new process inheriting file
    handles, the new process'' STDOUT would already be mapped to the Win32 handle.
    Confusing? Sure, but it is very important because this is the basis of mimicking
    fork() command.


    When a script opens a file or a socket, the result is a handle that can be used
    with a variety of functions. For example, if you open a file, you can print to
    it using the print() function, as in Example 7.20.


    # Example 7.20 Printing to a File Handle


    +   01. if (open(FILE, "test.txt") )

    02. {

    03.   print "Hello there!"

    04.   close(FILE);

    05. }


    Instead of explicitly specifying the file handle to print to (as in Example 7.20),
    a script can redirect STDOUT to a file handle. This concept is probably had to
    toe you, but understanding it is very important because it''s the basis of redirecting
    input and output for a child process. Example 7.21 shows how this is done. Notice
    that line 3 creates a new file handle called STDOUT_BACKUP by reopening the STDOUT
    file handle. This line essentially makes a backup copy of STDOUT for later use.
    Next, line 4 performs much the same line as line 3, but it redirects STDOUT to
    the file opened in line 1. Line 5 prints "Hello there!". Because no file handle
    is specified, it is automatically printed to STDOUT, which has been redirected
    to FILE. Therefore, line 5 is equivalent to the following:


    ```

    print "Hello there!\n"

    ```


    Line 6 puts things back the way they were originally by changing STDOUT to redirect
    to STDOUT_BACKUP, which is the saved version of the original STDOUT. By the time
    the script reaches line 9, STDOUT prints to the screen and no files are open.


    # Example 7.21 Printing to a File Handle by Redirecting STDOUT


    +   01. if (open(FILE, "test.txt") )

    02. {

    03.   open(STDOUT_BACKUP, ">STDOUT");

    04.   open(STDOUT, ">FILE");

    05.   print "Hello there!\n"

    06.   open(STDOUT, "&STDOUT_BACKUP");

    07.   close(STDOUT_BACKUP);

    08.   close(FILE);

    09. }'
