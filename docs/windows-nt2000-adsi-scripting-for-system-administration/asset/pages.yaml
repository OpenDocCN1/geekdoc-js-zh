    # Examining Accounts


    When a user complains that her account is not working correctly, you can run the
    User Manager or some equivalent program to check the account. This process, however,
    involves moving a mouse around and negotiating a GUI. Instead, you can do the
    same thing quickly from the command line. Example 2.2 does exactly this: You pass
    in the account name and comes an exhaustive dump of the account''s configuration.
    You can even use it for groups and domain trust accounts.


    Figure 2.1 shows the configuration of the administrator account on a machine called
    Server1. Notice that the account flags are broken out into flag names. These are
    the same names you would specify when creating an account or modifying the flags
    attribute.


    All the values displayed reflect the account''s attributes for the machine displayed
    on the first line. If the account is a member of a domain, certain values apply
    only to the domain controller listed. These attributes are


    +   - last logon

    - last logoff

    - num logons

    - bad pw count


    For example, the last logon date displayed is May 15, 2000, at 8:31 a.m.; however,
    the user may have logged on to a different domain controller at a later time.
    The only way to know for sure is to query each domain controller in the domain
    and compare to see which attribute is later. Likewise, the bad password count
    should be the total number of passwords across each domain controller. Refer to
    Example 2.5, later in this chapter, for an example of querying across all domain
    controllers in a domain for an accurate account of these attributes.'
