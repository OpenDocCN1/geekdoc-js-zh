    # Installing SRVANY.EXE Services


    Because SRVANY.EXE is a very simple service application, unfortunately, cannot
    install itself as a service. For this function, it relies on other techniques,
    such as its companion program INSTSRV.EXE. As you can guess, this program is designed
    to install a service. Actually, just like SRVANY.EXE, it is generic and does not
    require any other particular application. Can install SRVANY.EXE as a service,
    but likewise it can install WINWORD.EXE or NETSCAPE.EXE as a service, although
    you may be hard-pressed to come up with a good reason for doing that. Refer to
    the earlier section, “Creating and Removing Services,” for alternative techniques
    to install and configure services.


    To install SRVANY.EXE (or any other service) using INSTSRV.EXE, simply pass in
    the name of the service and a full path to the executable as follows:


    ```

    instserv.exe "MyNewService" c:\tools\srvany.exe

    ```


    That''s it. Notice that, unlike using Win32::Lanman or Win32::Daemon, you don''t
    have much control over how the service is configured. To configure the service,
    you can either use Regedit to modify the service''s Registry key values or configure
    the service using Win32::Lanman or Win32::Daemon, even though they were not used
    to install the service.


    After SRVANY.EXE is installed as a service, you need to modify the Registry to
    configure it. Even if you have already configured the service using Win32::Lanman
    or Win32::Daemon, you still need to configure SRVANY.EXE so that it knows what
    program to run when it starts.


    You need to create a Parameters Registry key to hold the SRVANY.EXE configuration.
    The key must be created under the Services key as follows:


    ```

    HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\MyNewService\Parameters

    ```


    Notice that the Registry key''s path reflects the name you used when installing
    the service (in this case MyNewService). The values that need are listed in Table
    8.6.'
