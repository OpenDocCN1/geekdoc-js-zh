  md: '# Conclusion


    Win32 services have always been an important aspect of the successful operation
    of Windows machines. These services can perform functions that are active from
    boot time till shutdown and without requiring any user intervention.


    This chapter provided sample scripts that install, remove, and reconfigure services.
    It also explained how services work and some problems that services face.'
