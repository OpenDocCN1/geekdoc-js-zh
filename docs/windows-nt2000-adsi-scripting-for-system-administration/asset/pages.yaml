  md: '# Chapter 9: ADSI and WMI


    Microsoft also provides ADSI for Windows NT 4.0, Windows 98, and Windows 95. You
    can download it from the MS Web site at http://msdn.microsoft.com/downloads/sdks/wmi/


    # WMI Details


    Just like ADSI, WMI works with providers. A provider acts as a bridge between
    WMI and some process or database. For example, by default, there are WMI providers
    for SNMP objects, Registry objects, and Win32 objects. If a third party writes
    a new program or service, it can ship a WMI provider, which enables you to use
    WMI to interact with the program or service. WMI also shares the concepts of namespace
    and classes with ADSI.


    Generally, to request a WMI object, you must construct a path string that specifies
    the WinMgmts provider. This provider accesses the WMI service (WinMgmts.exe).
    When specifying a WMI path, you can declare a security level immediately after
    the provider. Generally, you use the {impersonationLevel=impersonate} string to
    indicate that you want to represent yourself on a remote machine (this would attempt
    to impersonate yourself on the remote machine). It is not needed when you use
    WMI on Windows 2000 machines but should always be specified for backward compatibility
    with Windows NT and Windows 95/98.


    Next, you need to specify the path followed by double slashes (//) and the machine
    name, as in this example:

    WinMgmts:(impersonationLevel=impersonate)//MachineName


    This path returns a WMI object that represents the specified machine (MachineName
    in this case). This particular path returns an SWbemServices class object. This
    object can be used to retrieve other WMI objects or instantiate a WMI object.
    For example,


    ```

    $Path = "WinMgmts:(impersonationLevel=impersonate)//MachineName"

    $WMI = Win32::OLE->GetObject($Path);

    ```


    results in an SWbemServices object: WMI.

    The SWbemServices class defines several methods, which are two of importance to
    Perl: Get() and InstancesOf(). The Get() method returns a class or collection
    of objects (refer to Example 9.16). The InstancesOf() method returns all instances
    of a specified class (see Example 9.13). Both of these functions are described
    in the next sections.


    # Discovering Disks on Remote Machines


    Example 9.13 uses WMI to obtain a remote machine''s drive information. Line 21
    requests an SWbemService object from the remote machine. Line 28 then calls the
    InstancesOf() method, requesting all instances of the Win32_LogicalDisk class.'
