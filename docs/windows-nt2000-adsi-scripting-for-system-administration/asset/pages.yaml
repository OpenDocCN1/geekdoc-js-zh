  md: '# 8 Win32 Services


    UNIX administrators know them as daemons, and Win32 administrators know them as
    services: They are processes that run from bootup to shut-down. These pieces of
    code usually perform very specific tasks and always need to be running.


    The ability to autorun Perl scripts (and other applications) at boot time has
    always been of great interest to administrators. Such abilities provide a method
    to begin monitoring and other applications without requiring any user interaction.
    This chapter discusses the various issues related to just an endeavor.


    # What Are Win32 Services?


    In the world of operating systems, certain programs must run continuously. Such
    programs are designed to perform some type of function that other processes rely
    on or accomplish some important task. This is what a Win32 service is. In a UNIX
    environment, these types of services are known as daemons. For all practical purposes,
    a Win32 service can be considered the equivalent of a UNIX daemon.


    You interact with these services every day. Processes such as Web, email, databases,
    streaming media, and logon services are all programs that begin to run when the
    machine boots up. They continue running until they are stopped by an administrator
    or the machine shuts down.


    Win32 employs a Service Manager to oversee all services and device drivers. This
    manager contains a database of what services are to run at time. When the computer
    boots, the Service Manager walks through the list of services and determines which
    services to start first, second, third, and so on. It also determines which services
    depend on what other services. For example, a Web service relies on network card
    drivers and the TCP/IP protocols. Therefore, the Service Manager guarantees the
    Web service starts only after the network cards are loaded and TCP/IP is successfully'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'bound to the cards. Likewise, an email service may depend on some user

    authorization service, so the Service Manager starts the email service only

    after the authorization service has successfully started.


    Some services incorrectly report to the Service Manager that they have

    successfully started before they have actually finished starting. This can play

    havoc on another service that must interact with such a service. In this case,

    the Service Manager starts the dependent service before the original service

    is fully ready for any interaction. Therefore, if you write a service that

    dep on other services, you might find it useful to put a slight delay

    before interacting with any services your service depends on.


    A Win32 service is simply a program that knows how to talk to the

    Service Manager. And it tells it. When a service starts, it must tell

    the Service Manager that it is starting and point the Manager to a function

    called the event handler. The event handler''s only function is to listen and

    respond to the Service Manager. For example, if the administrator provides

    t service, the Service Manager sends a SERVICE_CONTROL_PAUSE control mes-

    to service informing that it should be pausing. The service imme-

    diately tells the Service Manager that it is preparing to pause by returning a

    SERVICE_PAUSE_PENDING message. That service then does whatever it needs

    to pause itself before finally sending the Service Manager a

    SERVICE_USED message. The service waits for more requests from the

    manager. This type of conversation with the Service Manager is really the

    only requirement of a service. It can prevent pretty much process just as any
    other

    application does, with a few exceptions, as not being able to interact

    with the user.


    A service runs in a special environment that is different from what a nor-\mal
    logged-on user experiences. Simply stated, a service does not see a user or desk-

    top, mouse, or keyboard. There is no simple way for a service to directly

    communicate with a user, and vice versa. Conceptually there is no need for

    a service to interact with a user. Most services perform some type of pro-\cessing
    that is void of user interaction. For example, a Web server never

    needs to interact with the logged-on user.


    If a service needs to communicate for the sake of debugging or log-\ging events,
    for example, it can do so by writing to the Win32 Event Log or

    opening and storing information to a file or named pipe. The latter

    approach is quite useful because you can run a Perl script that creates a

    named pipe. The service can connect to the named pipe, dumping log infor-\mation
    into it, and the Perl script can simply read from the pipe and display

    the contents on the screen.'
  merge: -1
  pgno: 281
