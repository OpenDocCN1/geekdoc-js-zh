    # Synchronizing Domain Controllers


    In large networks, having multiple DCs is common. All domains must have only one
    primary domain controller (PDC) but can have any number of backup domain controllers
    (BDCs). BDCs are literally backup domain controllers; if the PDC goes down, one
    of the BDCs promotes itself to be a temporary PDC.


    The job of a DC is to, among other things, process requests for user logons and
    authenticate users. Any DC can process such requests, whether it is a PDC or BDC.
    This capability helps distribute the load across multiple machines, preventing
    both networking and processing bottlenecks.


    One problem with such a distributed topology is that each DC must keep its own
    copy of the user account database. Each BDC therefore must routinely synchronize
    itself with the PDC. For example, when a user changes her password, the modification
    is submitted to the PDC. The PDC must propagate the change to all the BDCs so
    that the user can make use of the new password if she is logged on by one of the
    BDCs. Under certain conditions, such propagation could take a considerable amount
    of time.


    Example 2.10 enables you to force a BDC to synchronize with its PDC, or it forces
    full domain synchronization. This process should be performed after account modifications
    are made, such as creating, deleting, or renaming, or if an individual account
    is modified (password changes, disabling, unlocking, and so on).


    To force a BDC to synchronize with its PDC, just pass in the BDC:


    ```

    perl domync.pl server1 server2 server3

    ```


    To force a PDC to synchronize with all its BDCs, use the following:


    ```

    perl domync.pl -f MyDomain

    ```'
