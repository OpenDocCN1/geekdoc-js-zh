    # Paging


    Perl can send out using various techniques. Ideally, you could use the Net::SNPP
    module to send messages to pagers and cell phones using the Simple Network Paging
    Protocol (SNPP). However, not many companies have SNPP servers online for public
    use. Most do have, however, a Web page that can be used to submit paging requests.


    You can write a script to submit HTML forms to a paging server or a module called
    Net::Pager. The module interfaces with a paging back-end server hosted by www.simplewire.com
    does the work for your script. The Net::Pager Perl module is available on CPAN
    or from http://www.simplewire.com/.


    Example 5.6 sends out alerts to pagers and cell phones using the Net::Pager module.
    Here, as in Example 5.5, a monitoring program can use the SendAlert() function
    to send in various pager and cell phone numbers.


    To use Example 5.6, just pass in the message to send out, followed by a list of
    pager PIN numbers or cell phone numbers. This assumes, of course, the recipients
    are using the service defined on line 12 (in this case AT&T). For example,


    ```

    perl SendPage.pl "This is my test message" 8005551212 1234567890

    ```


    will send the message to the cell phone or pager that has the PIN number 8005551212
    and 1234567890.


