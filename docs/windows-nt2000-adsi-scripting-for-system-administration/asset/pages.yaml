    # Backing Up and Restoring Permissions


    Backing up files can be as easy as copying them to another drive or as complex
    as installing, configuring, and executing a backup software package. However,
    backing up the owner, auditing, and security information on the directory tree
    is another issue. You can employ a Perl script to make backups of directory tree
    and Registry tree permissions.


    Most backup programs can back up NT File System (NTFS) object information, such
    as owner, security, and auditing information. Finding one that can restore only
    that information and not the entire file, however, is more difficult. Likewise,
    finding a backup program that can also save security information for files, directories,
    Registry keys, network shares, and shared printers is quite difficult.


    Imagine some administrator accidentally reset permissions on all users'' home
    directories. Depending on the number of users, this situation could be quite a
    mess. Assuming that each user directory had specific permissions, such as for
    the employee, the employee''s manager, and secretary, programmatically applying
    permissions would be difficult unless they had been backed up earlier.


    Another example to consider is a Web server that had various permission sets placed
    on various directories. Such permissions could represent who can access Web data.
    Accidentally resetting these permissions could lead to the entire Web gaining
    access to your Web site.


    The obvious solution to these problems is to periodically back up permissions
    and auditing information. The script in Example 4.5 dumps security information
    for a securable object, such as files, directories, Registry keys, and so on.
    The information is gathered and dumped to STDOUT. This allows the output to be
    redirected to a file.


    The script accepts any number of paths as input parameters. These paths can be
    any of the types defined in Table 4.2. File and directory paths can contain wildcards
    or be relative paths; all other types must specify absolute paths. Also, any mix
    of paths can be passed into the script.'
