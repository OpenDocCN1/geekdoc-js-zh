  md: '# Expiring Passwords 45


    Manager (or the Computer Management MMC snap-in) enables such expiration by exposing
    the user must change password at next logon flag.


    Example 2.7 expires an account''s password by setting the password expiration
    flag. The script first removes the "user cannot change password" (UF_PWD_CANT_CHANGE)
    flag if it has already been set. This is required; otherwise, the next time the
    user logs on, he will be forced to change the password, but the flag will prevent
    him from doing so. Next, the "password never expires" (UF_DONT_EXPIRE_PASSWORD)
    flag is cleared if it has already been set. This flag must not be set before an
    attempt is made to expire the password. Finally, the "user must change password
    at next logon" (USER_PASSWORD_EXPIRED) attribute is set to either true or false,
    depending on whether or not the -u switch was passed in.


    Another flag, at first glance, would appear to be a problem. If the password never
    expires is set, it seems as though the password cannot be expired. However, when
    the script expires the password, Win32 automatically removes the password never
    expires flag.


    Keep in mind that after the user resets his password, the user cannot change password
    and password never expires flags are not set. As administrator, you might need
    to change the password flags after the user changes his password.


    Example 2.7 accepts lists of user accounts, so you can expire multiple users''
    passwords at once. For example, the following line forces the users Joel and Betty
    to change their passwords the next time they log on:


    ```

    perl expire.pl joel betty

    ```


    Additionally, you can specify an asterisk (*) to expire passwords for all users
    whose usernames begin with the specified string. For example, the following command
    expires passwords for all users whose names begin with Test, such as Test, Testuser1,
    Testuser2, and TestAccount:


    ```

    perl expire.pl test*

    ```


    You can also un-expire accounts by passing in the -u switch in:


    ```

    perl expire.pl test* -u

    ```


    The following three switches can be passed in:


    | Switch | Function |

    | -m Machine | Specifies the computer where the account is located. |

    | -d Domain | Specifies the domain where the account is located. It overrides
    any -m switch. |

    | -u | Causes each account to un-expire the password. Therefore, the next time
    the user logs on, he will not be forced to change his password. |'
