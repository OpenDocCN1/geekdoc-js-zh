  md: '# Piping (with open())


    Many system administrators have used the open() function to create processes.
    The Perl script can redirect the process'' STDIN or STDOUT to a Perl file handle.


    When a script opens a new child process using the piped open function, it can
    continue processing asynchronously from the new process. That is, both processes
    run at the same time. The output of the child process is buffered in the file
    handle specified in the call to open(). The parent process therefore can continue
    whatever it needs to do and read from the file handle if and when it needs to.
    Because reading from a file handle can cause a blocking state (if no data is waiting
    to be read), the parent process effectively stops processing until the child task
    sends a line of data or the child side of the pipe closes (when the child process
    terminates).


    The semantics surrounding the execution of the processes are consistent with backticks.
    Example 7.8 is identical to Example 7.6, except that of using backticks, the process
    is created using a piped open() function. Line 2 opens the process and redirects
    the STDERR into the STDOUT, which is all piped into the file handle.


    This script illustrates that backticks and piped opens are very similar. They
    even share the same filename problems. If $Name were assigned a value with embedded
    spaces, line 2 would have to look like this:


    ```

    if(open(FILE, "\$Name" 2>&1 | ))

    ```


    Notice that $Name is defined by double quotation marks. For more details, refer
    to the discussion of issues surrounding backticks in the "Backticks" section in
    this chapter.


    Example 7.8 Redirecting STDERR to STDOUT Using a Piped open()


    ```

    01. my $Name = "MyScript.pl"

    02. if (open (FILE, "\$Name2" 2>&1 | ))

    03. {

    04. while (my $Line = <FILE>

    05. {

    06.     print $Line;

    07. }

    08. close (FILE);

    09. }

    ```


    # The system() function


    Most Perl coders coming from UNIX backgrounds are familiar with the system() command,
    which launches an application passed into the function. This command largely serves
    the same function as using backticks or open() with a pipe. For example, if you
    were to use the line


    ```

    system(''test.pl'');

    ```'
