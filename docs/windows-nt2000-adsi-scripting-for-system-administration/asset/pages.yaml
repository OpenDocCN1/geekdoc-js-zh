  md: '# WIN32 PERL SCRIPTING


    # The Administrator''s Handbook


    "It''s this simple: Everyone responsible for a Windows host should have a copy
    of Win32 Perl Scripting:The Administrator''s Handbook."


    In Win32 Perl Scripting:

    **Administrator''s Handbook**,

    Dave Roth applies the same straightforward and example-driven approach in his
    book on Win32 Perl extensions. This resource focuses on the ways you can automate
    administrative tasks and take advantage of Perl''s capabilities on the Win32 platform.
    You will find expertise on such issues as:


    **Cameron Laird**, coauthor of the "Regular Expressions" column on scripting languages
    and maintainer of the Perl/Tk FAQ


    +   * Using Win32 and COM to interact with Windows programs

    * Writing Win32 services using Perl

    * Managing drives, users, and group accounts, including backing up user databases
    and modifying user login profiles

    * Securing systems through effective permissions management


    **Dave Roth** is the contributor of various popular Win32 extensions, including
    Win32::ODBC, Win32::AdminMisc, Win32::Daemon, and Win32::Perms, and has been providing
    to the Perl community since 1994. Dave has been a speaker at the O''Reilly Perl
    and the USENIX LISA-NT conferences. He has contributed to *The Perl Journal* and
    is the author of Win32 Perl Programming: The Standard Extensions (1999, 1-57870-067-1).


    Dave has been programming since 1981 in various languages, from C++, LPC, and
    Perl. His code is used by organizations as diverse as Microsoft®, the U.S. Department
    of Defense, Disney Light and Magic, Digital Paper, Hewlett-Packard, Metagenix,
    Radcom, and colleges and universities. Formerly, Dave helped assemble and administer
    a statewide WAN for the state of Michigan, and he has designed and administered
    LANs for Ameritech and Michigan State University.


    This instructive provides you with scripts that enable you to more effectively:

    * Locate data in the Registry

    * Interact with ADSI and WMI

    * Check for errors in event logs

    * Manage running processes on local and remote machines

    * Manage user privileges


    Category: Windows® NT/2000 Perl Programming


    ISBN 1-57870-215-1 553500


