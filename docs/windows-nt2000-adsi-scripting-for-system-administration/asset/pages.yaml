  md: '# Conclusion


    The Win32 platform provides a rich GUI environment to manage the various aspects
    of user and group accounts. However, the sheer number of such accounts found in
    most networks makes it quite impractical to expect any administrator to use the
    default tools.


    This chapter showed how Win32 Perl can be used to effectively manage these tasks
    and make them not only easier, but automated and less prone to error.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# 3 Tools


    Every good administrator assembles a collection of tools that she simply cannot
    do without. These tools perform specific tasks that enable her to quickly perform
    her job. A perfect example of such a utility is the popular XCAGLS.EXE program
    that comes with the Windows NT Resource Kit.


    This utility (and its little brother XCAGLS.EXE) dumps any permissions that are
    applied to a file or directory. Without such a tool, you are doomed to open an
    Explorer window, select the object in question, right-click, select the Properties
    context menu, and then go to the Security tab on the resulting property page.
    If this procedure doesn''t sound like very much work, you have not administered
    a network of thousands of machines with various security permissions applied to
    various directories and files.


    This chapter covers an assortment of scripts that were created for my workload
    as an administrator. To be sure, I wrote each of these scripts to simplify and
    lessen my workload for the sake of demonstrating how you can leverage Win32 Perl
    to solve problems administrators face every day. When you scrutinize the code,
    it becomes obvious that there is almost no Win32 task that cannot be managed with
    a bit of Perl coding.


    These scripts were not written to be simple or to be tutorials but instead to
    get into the nifty-gritty of task solving. I recommend that you use a good Win32
    API reference while looking at the code that makes up these scripts; in particular,
    check out Microsoft''s MSDN library (http://msdn.microsoft.com/) and, of course,
    my other book, Win32 Perl Programming: The Standard Extensions (New Riders Publishing).'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# The File System


    The Win32 operating system makes copious use of its file system. As an administrator,
    you have the burden of managing this important resource. Your job covers the entire
    range of administrative tasks, ranging from securing files and directories to
    creating directories and updating outdated files. Many different tools and utilities
    available from various companies can help administer your machine''s file system.
    However, you will not be able to easily find some tools.


    Many of the existing tools are confusing because they reflect aspects of the file
    system that are not commonly known, as alternate data streams. Some tools are
    not used simply because administrators have no idea that they exist, as tools
    used to discover hidden directories on remote machines. The following sections
    focus on file system-related tools that can save you a great deal of work.


    # Discovering Shared Directories


    Ever since Windows for Workgroups was, sharing directories for others to connect
    has been quite simple. From a Windows NT/2000 command line, you can easily share
    a directory by using the net command. The following line shares a temporary directory
    with the name TempDir:


    ```

    net share TempDir=c:\temp

    ```


    Alternatively, you can share directories from the File Manager, the Explorer,
    and the Service Manager GUI applications.


    The Win32 world permits you to hide shared directories—that is, share a directory
    that nobody can see when browsing the network. The only way to access the directory
    is to know it that it has been shared and explicitly access the hidden share.
    You hide directories by appending a dollar sign ($) to the end of the share name.
    For example, the following command line creates a hidden shared directory called
    MyHiddenShare:$


    ```

    net share MyHiddenShare=$c:\temp

    ```


    Now, only users who know about this hidden share can access it.

    You can see which directories your machine is sharing by using this command line:


    ```

    net share

    ```


    This line displays all the shared directories on the local machine. However, there
    is no easy way to discover shared directories on a remote machine.'
  merge: -1
  pgno: 87
