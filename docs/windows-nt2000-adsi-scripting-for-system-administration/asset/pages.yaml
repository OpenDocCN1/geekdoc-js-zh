    \nAs services are usually not expected to interact with a user, they are automatically\
    \ run in a hidden environment; this is called a windows station. Imagine a windows\
    \ station to be a virtual computer environment. Because this environment is hidden\
    \ from the user, it is never seen even though the service is running. You can\
    \ use the Win32::Daemon extension to reveal the service by moving it from this\
    \ hidden windows station to the user's windows station, which is always seen by\
    \ the current user. This is what the Show() function does. It is not required\
    \ to call this function; the only time you would want to call it is to show the\
    \ service itself, maybe for debugging purposes. However, there is a catch. If\
    \ a service is to create new processes, such as spawning another program that\
    \ will interact with the user, these processes appear only in the service's windows\
    \ station. If the service is hidden, the processes are hidden as well.\n\nIf you\
    \ show the service, all processes that it spawns are displayed to the user. The\
    \ user then not only can see the processes, but can also interact with them using\
    \ the mouse and keyboard.\n\nYou also manage these windows stations by using the\
    \ Win32::AdminMisc extension. Refer to the extension's documentation for more\
    \ information.\n\n# Accounts\n\nAs most administrators know, a service must run\
    \ under an account. Typically most services run under the Local System account.\
    \ This account is special because it refers not to a user, but to the operating\
    \ system itself. It is similar to the Administrator account in that it is granted\
    \ many privileges that most other accounts do not have. It therefore is ideal\
    \ for running services, but there is a catch. The Local System account does not\
    \ have network access."
