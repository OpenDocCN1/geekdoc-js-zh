  md: '# Controlling Services


    Every Win32 machine has some services running. By default, all Windows 2000 and
    Windows NT machines run the Local Security Authority Security Service (LSASS)
    and the Windows logon service (winlogon) as as others. Many of these services
    are crucial for the operating system to function, but others are only as important
    as an administrator deems. Services such as SQL Server and data backup are not
    necessary to provide appropriate services for the successful running of the operating
    system but may be necessary for it. Not all services, however, are shrink-wrapped
    and available at the local computer store.


    Considering that every network administrator manages her just little differently
    from others and every network has its own idiosyncrasies, you might not be able
    to find a service that fits some need. In these cases, you can use Perl to satisfy
    such niche needs.


    # Controlling Services


    The operating system permits users and processes to control services. You can
    manually do this by using the Services control panel applet or the NET.EXE command-line
    application. You can also do programmatically by using Perl (among other languages).
    Two extensions in particular control services: Win32::Service and Win32::Lanman.
    Both of these extensions do an admirable job of controlling services; however,
    the Win32::Service extension is very small and provides only service-related functions.
    For this one alone, that extension is the focus for this section.


    # Lists of Services


    You can find the list of services installed on a machine by using the Win32::GetService()
    function. As Example 8.1 shows, obtaining this list of services is trivial. The
    second parameter passed into the GetServices() function is a hash reference that
    is populated with the display names and their service names as values. This reference
    is quite important because Win32::Service functions expect only the service name
    as a parameter. Passing in the display name will cause a function to fail.


    # Example 8.1 Discovering Which Services Exist on a Machine


    ```

    01. use Win32::Service;

    02.

    03. foreach my $Machine (@ARGV)

    04.

    05.     local %List;

    06.     print ''Available services on $Machine:\n'';

    07.     if (Win32::Service::GetServices($Machine, \List ))

    08.     {

    ```


    continues ▶'
