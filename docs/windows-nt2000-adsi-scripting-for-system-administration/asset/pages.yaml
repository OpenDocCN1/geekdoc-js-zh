  md: '# 9 ADSI and WMI


    Microsoft has introduced two rather exciting technologies: the Active Directory
    Services Interface (ADSI) and Windows Management Instrumentation (WMI). Even though
    they are related, they are also radically different and have different purposes.
    These technologies are tightly integrated with Windows 2000 but are available
    on the Windows NT 4.0 platform as well. Learning to use these technologies will
    not be wasted effort because they will be around for a long time to come.


    ADSI and WMI are actually abstractions of other technologies—that is, they provide
    functionality that sits on top of other technologies and that provides an abstracted
    interface into them. Although this sounds quite challenging, the truth of the
    matter is that both ADSI and WMI are extremely simple to understand and use. This
    is good news because you can leverage ADSI and WMI to seriously simplify your
    network administration activities.


    # Active Directory Services Interface


    The concept of Directory Services has always been a part of Microsoft operating
    systems. A Directory Service (DS) is a type of repository where information is
    stored. You can think of it as a large database that you fill with information
    relevant to your network. You might use a DS to associate a printer with a particular
    name or user account with a set of permissions. A program could then query the
    database to discover what permissions that particular user has.


    Consider a Web proxy server. Say that all users must go through this proxy server
    to surf Web sites on the Internet. The proxy server could query the DS database
    to discover whether users are authorized to access the Internet, thus preventing
    unauthorized users from accessing Web sites.'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# 310 Chapter 9: ADSI and WMI


    Several different variations of DSs are available, ranging from X.500 Novell''s
    DS to Lotus Notes. Not to be left out of the rush to directory service Nirvana,
    Microsoft rolled out its version. The marketing wizards dubbed the Active Directory
    Services (ADS). Simply stated, ADS is Microsoft''s version of a DS.


    The problem, however, is that each DS has its own unique interface. Therefore,
    it is difficult for a program to interact with different DSs without having to
    be intimate with each DS interface. It also makes it difficult for a program to
    be “open-ended.” As new DSs become available, a program has to be redesigned to
    incorporate the new DS interfaces.


    In an attempt to untangle the mess of DS interfaces, Microsoft implemented the
    Active Directory Services Interface, which is essentially an abstract interface
    into various directory services. ADSI provides an architecture that exposes simple
    functions that are common to most directory services. It provides a simple API
    that a program can use to interact with any DS.


    ADSI is the type of architecture that other DSs can “plug” into. The DS therefore
    can expose its services to any program willing to interact with ADSI. Each DS
    must supply a “provider” component that acts as a bridge between ADSI and the
    DS, which enables a program to speak ADSI interact with various different directory
    services through their respective provider components. Other abstraction APIs,
    such as ODBC, work similarly.


    One of the inviting aspects of ADSI is that it is automation-compliant. This means
    that any program that interact with the IDdispatch COM interface can use ADSI.
    Therefore it is a perfect Perl technology. When you use the Win32::OLE extension,
    any Perl script can interact with any DS that has an installed ADSI provider.


    It is important to draw a distinction between ADS and ADSI. Active Directory Services
    is just a DS, whereas the Active Directory Services Interface is an abstract interface
    into any one of many different DSs (including ADS) through their providers. It
    is possible for a machine to have ADSI installed there but not ADS.


    # How Do You Get ADSI?


    Windows 2000 and Windows ME both come with ADSI components already installed.
    However, the ADS runs only on the Windows 2000 Server platforms (Server, Advanced
    Server, and Data Center).'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# Active Directory Services Interface


    Microsoft also provides ADSI for Windows NT 4.0, Windows 98, and Windows 95. You
    can download it from the MS Web site at http://www.microsoft.com/adsi/


    # Learning About ADSI


    Learning the ADSI interface is fairly easy. However, doing without a good guide
    can be a bit daunting at first. I find two resources particularly useful for learning
    about ADSI. The first resource is the ADSI help files. You can download them from
    Microsoft''s ADSI site. Check out http://www.microsoft.com/adsi/ and look around
    for the ADSI Help Files download link.


    Another good place to find documentation is Microsoft''s Developer Network (MSDN).
    Its ADSI documentation is online under the MSDN Win32 API documentation at http://msdn.microsoft.com/library/


    After you access this link, you need to drill down in the table of contents (in
    the left frame). Select Platform SDK and Network and Directory Services. Finally,
    select the Active Directory, ADSI, and Directory Services link.


    For a hard-copy version of ADSI documentation, check out the book Windows NT/2000:
    ADSI Scripting for System Administration by Thomas Eck (New Riders). Not only
    does it cover the history of ADSI, but it also explains how ADSI works in real-world
    settings. It includes many sample scripts that illustrate how ADSI works and are
    useful for any administrator. All the scripts are coded in Visual Basic, but converting
    them into Perl is a trivial task. Many of the ADSI scripts in this chapter are
    Perl versions of those found in Thomas''s book.


    # Namespaces


    ADSI defines unique scopes for a given DS provider called a *namespace*. Consider
    a namespace to be a context in which functionality is related. For example, if
    a DS provider MyDS allows you to modify printer settings, those printer settings
    are located in the MyDS namespace.


    Each namespace defines its own way to represent data. For example, one DS provider
    may refer to a user by a username, whereas another provider may refer to a user
    by a user ID. When a program interacts with different namespaces, it needs to
    know how each namespace manages its own data.


    ADSI allows a program to specify which namespace (or DS provider) it wants to
    interact with by defining an *ADPath* (Active Directory Services Path) string.
    All ADsPath strings must begin with the name of an ADSI provider. Some of the
    standard provider prefix strings are listed in Table 9.1.'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Chapter 9: ADSI and WMI


    ### Table 9.1 Common ADSI Provider ADsPath Prefixes

    | ADsPath String (Provider Namespace) | Description |

    |---|||

    | ADs: | Active Directory Service. This provider interacts with Windows 2000''s
    Active Directory Services. It can also interact with Active Directory installed
    on a non-Windows 2000 machine (such as Microsoft Exchange and Site servers). |

    | WinNT: | NT directory service. This provider interacts with the Windows NT domain
    and user account managers. It can also interact with Windows 2000 directory services,
    although it doesn''t take full advantage of Windows 2000''s Active Directory Services.
    |

    | LDAP: | Lightweight Directory Access Protocol (LDAP). This provider uses the
    LDAP protocol to interact with any LDAP-enabled directory service (including Active
    Directory Services). |

    | NDS: | Novell Directory Service. |

    | IIS: | The IIS metabase configuration database. This provides access into IIS''s
    configuration database (called the *metabase*).


    The ADsPath is case-sensitive, and its syntax changing on what provider is specified.
    A programmer may have to refer to the provider''s documentation to determine how
    to use it.

    Because each provider performs functions that relate only to its namespace, understanding
    what information and functionality each namespace can provide is important. Additionally,
    understanding the meaning of a namespace''s properties and what syntax to use
    is imperative. This is where the schema comes in.


    Schemas

    A *schema* is a sort of dictionary of terms that a particular DS provider uses.
    Each property that a DS exposes is accessed as an ADSI COM object. The schema
    enables an application to learn what each object represents. The schema for a
    provider describes each class that the provider implements.


    Classes

    ADSI providers expose a series of different *classes*. These classes are similar
    to object-oriented C++ or Perl classes. An ADSI class is simply a group of properties
    and methods. One class, for example, may represent a user account in a domain.
    This particular class has a property for the username and password. It also may
    have a method for renaming the user account.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Active Directory Services Interface 313


    Binding

    A Perl script interacts with ADSI classes by binding to a particular object. This
    binding simply means that ADSI produced a COM object that represents a particular
    class. The ADPath string is also known as a binding string. This string represents
    the path ADSI provider will use to bind to a particular ADSI object. Each object
    is based on an ADSI class that exists in an ADSI namespace.


    When a script requests an ADSI COM object, the ADSI provider must determine what
    type of class the script is attempting to bind to, which can result in time delays.
    Say that a Perl script implements the following line:


    ```

    $ADSIObj = Win32::OLE->GetObject("WinNT://SomeName");

    ```


    The WinNT provider must determine what SomeName—a computer or a domain name. It
    might do so by first querying for a domain called SomeName. If that query fails,
    then tries to access a machine \SomeName. Of course, this entire process could
    impose a blocking delay. In this case, the binding to the domain or computer class
    is very inefficient. The WinNT provider allows you to specify what class to bind
    to. You make this request by specifying a comma followed by the class name like
    this:


    ```

    $ADSIObj = Win32::OLE->GetObject("WinNT://SomeName,computer");

    ```


    In this case, the ADSI provider knows that the script is attempting to bind to
    the computer class. The provider can quickly instantiate the appropriate class.


    In the previous example, the ADPath referred to a particular object that is interpreted
    as either a network domain or a network machine. Either, the provider component
    recognizes that the path is something that is a networked object. Sometimes, however,
    a provider''s syntax can make a request vague and undecidable.


    ```

    $ADSIObj = Win32::OLE->GetObject("WinNT://SomeName/JOEL");

    ```


    In this case, it is not clear what SomeName and JOEL are. SomeName could be either
