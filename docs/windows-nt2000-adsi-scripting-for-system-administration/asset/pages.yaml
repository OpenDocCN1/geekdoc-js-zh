    Volume in drive C is unnamed\nVolume Serial Number is DCF6-AF23\n```\n\nDirectory\
    \ of C:\\\n\n```\n06/01/2000  09:14    24 test.txt\n               1 File(s) \
    \        17 bytes\n               @ Dir(s)          592,346,112 bytes free\n```\n\
    \nNotice that even though the file size changes, the amount of available disk\
    \ space does not because NTFS calculates either two different sizes for each file:\
    \ how large the file is and how much disk space the file takes up. In this case,\
    \ the file size is either 15 or 24 bytes. However, the file takes up (at least)\
    \ one sector of disk space. And each sector (on this particular volume) is made\
    \ up of 1 kilobyte (1024 bytes) of disk space. Therefore, it takes 1024 bytes\
    \ of disk space to store only 15 bytes of data. When NTFS computes the available\
    \ disk space, that amount is based on the amount of unallocated disk space. Because\
    \ disk space is taken up in 1KB blocks, the free space is always rounded down\
    \ to a multiple of 1024.\n\n# Enumerating NTFS Streams\n\nThe problem with NTFS\
    \ streams is that there is no way to enumerate the streams in a file. This problem\
    \ is rather tragic, considering how powerful NTFS streams can be. Basically, this\
    \ means that if you forget which streams you have added to a file, there is no\
    \ way to discover them. This situation is akin to removing the dir command from\
    \ the DOS box: How would you possibly discover which files are in a directory?\
    \ Yes, bizarre as it may sound, this is the reality of Win32's lack of proper\
    \ support for NTFS streams.\n\nThe good news is that you can use a hack to enumerate\
    \ streams. This solution involves reading the file as backup software does, using\
    \ the Win32 API's BackupRead() function.\n\nThe Streams.pl script (see Example\
    \ 3.8) displays the names and sizes of all streams in an NTFS file. The script\
    \ accepts any number of parameters from the command line. Each parameter is a\
    \ path to a file that to be examined for alternate streams. The file path can\
