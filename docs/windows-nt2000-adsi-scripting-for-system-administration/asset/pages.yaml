    # User Account Information


    To see just how you can use ADSI to query DSs, look at Example 9.6, which displays
    user configuration information. Just pass in any number of computer, user, or
    group names. The names passed in can take one of these three formats:


    ```

    account

    Domain\account

    \machine\account

    ```


    The account can be the name of a user account or a group name. If you specify
    a domain, account can be a computer name as well. For example, the command


    ```

    perl ADSIDumpAccount.pl joel

    ```


    displays information about the default domain''s account joel. However, the command


    ```

    perl ADSIDumpAccount.pl \ServerA\joel

    ```


    displays information about the joel account on the machine \ServerA—just as the
    command


    ```

    perl ADSIDumpAccount.pl "MyDomain\Domain Admins",

    ```


    displays information about the Domain Admins group in the MyDomain domain. The
    script will also interpret other, nonzero accounts, such as:


    ```

    perl ADSIDumpAccount.pl MyDomain\ServerA

    ```


    This will display information for the machine \ServerA in the MyDomain domain.'
