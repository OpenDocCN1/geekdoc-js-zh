    # Ownership


    Almost all secular objects have an owner. The owner is an account (either a user
    or group account) that has ultimate access over the file. The owner of an object
    can never be denied access to it. He can read, delete, and modify permissions,
    as well as anything else that is possible.


    To discover who is the owner of a particular object (file, directory, or Registry
    key), you need to locate the security information for the object. For files and
    directories, you typically use the Explorer program to select the object''s properties
    and select the Security tab on the displayed property page. For a Registry key,
    you display the key''s permission information from the REGEDT32.EXE program.


    Ownership of an object was designed so that it could only be taken, not given.
    For example, an administrator could become the owner of a file (take ownership)
    so that she could usurp permissions placed on the file. However, because she could
    not assign ownership to another user (give ownership), it would be obvious as
    to who had bypassed security because the administrator would remain the owner
    until someone else took ownership. Because an administrator must grant a user
    account with the privilege to take ownership (the SE_TAKE_OWNERSHIP_NAME privilege
    to be precise), this paradigm was deemed safe.'
