- img_proc: true
  md: '# Positioning the UNC in the beginning or middle of the path can be a problem.


    If the share is removed, the remote server goes offline, or the network has problems,
    then all programs that are run may temporarily pause when first starting. The
    pause would occur due to Win32 waiting to timeout on the request to access the
    UNC.


    On an NT machine (or Windows 2000), a user has his own set of environment variables,
    including his own personalized path. When the user logs on an NT machine, his
    user path variable is appended to the system path variable. This means that if
    you locate the Perl UNC at the end of the system path variable, You should consider
    this issue when configuring your network for Perl use: It is ideal to add the
    Perl UNC to the end of the user''s path variable.


    By now, the issue of adding a Perl share to your path is not as simple as you
    might have assumed. Now let me test in another problem. Say that you have a network
    with 1,000 users. Also, assume that each user has a Perl-based logon script, and
    you have configured each user to access Perl from a network share. At 8:00 a.m.
    on Monday, you 1,000 users all logging on their machines. Imagine the network
    traffic as all users are accessing Perl''s binaries and assorted libraries and
    packages. Ideally, you would set up a shared Perl directory for each subnet, therefore
    minimizing traffic across all routers. This means that each machine needs to know
    which server on the subnet contains the Perl shared directory.


    Now consider these two issues together. If you add the Perl UNC to the end of
    the user''s path variable, and each machine has to know which specific server
    to connect to, alas—you have a problem: A user can log on to a machine on any
    subnet. Therefore, hard-coding the Perl UNC in the user''s path variable could
    cause Perl access to travel across routers. This problem, too, has a solution.
    You can create a system variable PERLDIA on each machine. This new variable contains
    the UNC to the shared Perl directory on the local subnet. Now all you have to
    do is %PERLDIA to the end of the user''s path variable. For example, you can set
    the system PERLDIA variable to:


    ```

    PERLDIA = \server1\perlshare

    ```


    Then you can append the variable to the user''s path variable like this:


    ```

    PATH = c:\Program Files\Foo;%PERLDIA%\bin

    ```


    This is the ideal solution.'
