  md: '# 216 Chapter 7: Processes


    The reason for such a failure has to do with how the .pl extension was asso-ciate
    with the Perl.EXE program. Many administrators incorrectly asso-ciate the .pl
    extension with the command line


    ```

    ftype PerFile=c:\perl\bin\perl.exe %1 *

    ```


    This is a mistake because when the filename has embedded spaces (such as "c:\Program
    Files\My Long Perl Script Name.pl"), this command expands to be


    ```

    c:\perl\bin\perl.exe c:\Program Files\My Perl Script Name.pl

    ```


    This will cause you to attempt to load a script c:\Program and pass in parameters:
    Files\My, Long, Perl, Script, and Name. The way to correct this is to rerun the
    ftype command surrounding the %1 parameter with quote marks (refer to Chapter
    1 for more details), as in


    ```

    ftype PerFile=c:\perl\bin\perl.exe "%1" *

    ```


    Because a script cannot depend that the .pl extension has been correctly associated,
    it can use a second, and more effective, fix (I have yet to see this technique
    fail). Simply convert the long filename to a short name.


    For the sake of backward compatibility with DOS and Win16 applic-tions (those
    old Windows 3.1 programs), Win32 allows each file to have a long and short name.
    For example, for this long filename


    My list of files.txt


    the short name version of this file might be


    ```

    MYLIST-1.TXT

    ```


    The only reliable way to ensure a program can discover the short pathname of a
    file is by calling the Win32 API''s GetShortPathName() function. It just so happens
    that the Perl Win32 extension exposes this function. Example 7.5 demon-strates
    fixes.


    # Example 7.5 Resolving the Problem of Having Backticks with Long Filenames with
    Spaces


    ```

    01. use Win32;

    02. my $Name = "My Long Perl Script Name.pl";n03.

    04. # Fix 1: Surround the long file name with quotes...

    05. my $Output = "$Name";n06. print @Output;

    07.

    08. # Fix 2:

    09. $Name = Win32::GetShortPathName($Name);

    10. @Output = `$Name`;

    11. print @Output;

    ```'
