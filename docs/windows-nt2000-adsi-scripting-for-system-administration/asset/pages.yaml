- img_proc: true
  md: '# Creating Processes


    While looking over the script, you may question what line 20 is for. It is not
    very intuitive, but it serves a very good purpose. A process is suspended (either
    by calling the process object suspend() method or by creating the process in a
    suspended state), Win32 increases an internal counter. This counter indicates
    how many times the process has been suspended. Because a process can be suspended
    multiple times, this counter keeps track the level of suspension. A call to the
    object''s Resume() method causes the counter to decrease.


    The Resume() method returns the suspension level that the process was under before
    the call to Resume(). This means that Resume() returns a value of 1, the process
    is no longer suspended. Considering that a process can be suspended multiple times
    (even by other processes), line 20 continuously calls Resume() until the process
    is no longer suspended.


    Line 23 calls the Wait() method, causing the script to block until either the
    process is terminated or the timeout value expires. In milliseconds, it is passed
    into the Wait() method. When a call to Wait() returns, if its return value is
    0, the timeout value expired; otherwise, the process was terminated.


    Line 27 shows how you can kill the process. The value passed into the Kill() method
    is the process'' exit code. All processes can return a numeric value when they
    exit (or are killed).


    # Example 7.11 Creating a Suspended Process


    ```

    01. use Win32::Process;

