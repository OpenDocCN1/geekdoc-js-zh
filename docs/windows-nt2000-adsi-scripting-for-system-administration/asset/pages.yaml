  md: "# Reconfiguring a Service\n\nFrom time to time, you might need to reconfigure\
    \ a service. If, for example, a service account's password has changed, the service\
    \ must be reconfigured to use the new password. The Win32::Daemon::ConfigureService()\
    \ function performs this task. This function works just like the CreateService()\
    \ function. A hash reference is passed into the function. This hash, however,\
    \ needs to contain only keys that represent configuration changes.\n\nIn Example\
    \ 8.5, the user's account and password are changed; therefore, they are the only\
    \ two keys in the hash. Of course, the name key is included; otherwise, the function\
    \ would not know what service to modify. Needless to say, the service name is\
