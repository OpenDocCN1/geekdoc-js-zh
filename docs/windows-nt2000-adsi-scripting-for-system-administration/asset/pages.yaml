  md: '# Creating and Removing Services


    # Creating and Removing Services


    Different techniques are available to install, modify, or remove services. The
    two prominent ones use the Win32::Daemon or the Win32::Lanman extensions. They
    both do a splendid job. Most administrators, however, don''t need to install services
    using Perl because all professional services come with some form of setup application
    that performs the installation. If you need to install some service, it is usually
    because a script runs as a service itself that has been made. Many administrators
    write Win32 services using Perl, so they typically use the Win32::Daemon extension;
    therefore, they rely on its installation and remove functions. Other, nonservice,
    scripts may instead rely on the functions that Win32::Lanman provides if the extension
    is already used for other networking-related reasons.


    Alternatively, some third-party utilities provide such functionality, such as
    Microsoft''s SC.EXE that come with the Windows NT/2000 Resource Kit.


    # Installing Services


    To install a service using Win32::Daemon, a call is made to the CreateService()
    function.


    Example 8.4 shows how this can be done. Line 2 configures a hash that describes
    the service to be installed. The different values available to this hash are listed
    in Table 8.2.


    > When using the Win32::Daemon::CreateCharacter() function, the only hash key
    you must specify is the name key. All other values will default to a value that
    comes for most services. ✦


    # Example 8.4 Installing a Service


    ```

    01. use Win32::Daemon;

    02. %ServiceConfig = (

    03. name => ''MyServiceName'',

    04. display => ''My Service Display Name'',

    05. path => ''$X'',

    06. user => '''',

    07. password => '''',

    08. parameters => ''c:\scripts\MyService.pl'',

    09. dependencies => [[]],

    10. );

    11. if (Win32::Daemon::CreateCharacter(\$ServiceConfig))

    12. {

    13. print ''The \$ServiceConfig(display) service '';

    14. print ''was successfully installed.\n'';

    15. }

    16. else

    ```


