    # A Note About This Book


    You should consider this book to be just a leaping point into administration using
    Win32 Perl. The information held within these pages is just a guide. Consider
    it a guide from a system administrator who has learned a few things. Almost the
    extensions that I have authored have to solve problems that I have encountered
    while managing Windows networks.


    The sample scripts are designed to be functional and illustrate how particular
    problems can be resolved. The emphasis is on the latter more than the former.
    For example, many scripts use third-party extensions, such as Win32::Lanman. Even
    though this extension is not yet part of the standard library, it provides a wonderful
    interface to the Win32 Lan Manager programming interface (API). Other scripts,
    however, use the handy Win32::API to access functions that Win32::Lanman exposes.
    You might be confused when one script uses Win32 for some function but Win32::API
    for the same function in a different script. This is on purpose. You should understand
    that Win32 Perl is much like Perl in general that “there is more than one way
    to do it."


    You will find that some scripts are useful but can be expanded to include some
    functionality. This is true; however, these scripts can consume much time in development,
    so to avoid “feature creep” (as well as “time creep”), some functionality has
    been ignored. Feel free to mangle these scripts to fit your particular need. I
    also hope that you will not only use the scripts, but study and learn the concepts
    behind them. These concepts can be indispensable when you’re solving other similar,
    but different, problems.


    # Reusing Code


    Having come from a C and assembler background, I have found that the ability to
    structure Perl scripts into discrete, reusable code chunks has made my life much
    easier. As a matter of fact, most coders feel the same way. Evidence of this can
    be found at any Comprehensive Perl Archive Network (CPAN) site, such as www.perl1.com,
    where entire directories of donated chunks of code are available. Most of them
    are in the form of Perl extensions and modules—reusable code that others find
    beneficial.'
