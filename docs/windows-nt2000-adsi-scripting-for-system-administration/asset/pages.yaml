    # Disabling Accounts


    When you need to make an account temporarily unusable, you can disable it. Some
    administrators feel that disabling accounts is a waste of time and instead should
    be deleted. However, disabling can be a time-saver. For example, if a manager
    leaves a company, you could disable her account instead of deleting. This way,
    when a replacement is hired, you only need to enable and rename the account to
    reflect the new manager. The alternative would be to create a new account, but
    doing so entails not only reconfiguring the account but also walking through each
    file, directory, and share to reapply permissions for particular manager. Depending
    on the configuration of the domain, this task can be quite unreasonable.


    The script in Example 2.3 accepts lists of user accounts, so you can disable multiple
    accounts at once. For example, the following line disables both the Joel and Betty
    accounts:


    ```

    perl Disable.pl joel betty

    ```


    Additionally, you can specify an asterisk wildcard (*) to disable passwords for
    all users whose usernames begin with the specified string. For example, the following
    command disables all accounts that begin with Test, such as Test, Tester1, Testuser2,
    and Testaccount:


    ```

    perl disable.pl test*

    ```


    The three switches in the following table can be passed in:


    | Switch | Function |

    | --- | --- |

    | -m Machine | Specifies the computer where the account is located. |

    | -d Domain | Specifies the domain where the account is located. It overrides
    any -switch. |

    | -e | Enables the specified accounts. Use this if the account is already disabled
    and you want to enable it. |


    If neither domain nor machine names are specified, the script defaults to the
    domain of the user running the script.'
