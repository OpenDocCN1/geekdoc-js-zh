    \  }\n96.   return;\n97.\n```\n\n# Registry\n\nWin32 platforms make use of the\
    \ Registry to store configuration information. Programs and system services alike\
    \ populate Registry keys with values that represent various settings of some sort.\
    \ Information on services and system drivers are stored along with details on\
    \ how they are loaded and where their files are located. The Registry is where\
    \ you can find COM component configurations, TCP settings, and auto logon settings,\
    \ just to name a few.\n\n# Regfind\n\nThe Registry is a vast wasteland of configuration\
    \ information. It's so vast, in fact, locating anything there therein can be quite\
    \ daunting. Because the Registry is a database of configuration data, you would\
    \ hope that you could search and efficiently locate necessary tidbits of information.\
    \ However, you would be disappointed to learn that this is not possible. The Win32\
    \ API does not have any mechanism that enables such searching. Considering this\
    \ database, even on a notebook, can grow several tens of megabytes in size, locating\
    \ data is comparable to finding a needle in a haystack."
