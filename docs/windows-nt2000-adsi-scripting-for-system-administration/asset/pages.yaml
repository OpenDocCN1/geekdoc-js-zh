    intermediary directories. For example, if you run


    ```

    md Dir1\Dir2

    ```


    and Dir1 does not already exist, then Dir2 will not be created.


    > Tip


    > On the Windows NT and 2000 platforms, if command extensions are enabled, the
    DOS box md mkdir commands create any intermediary directories. For information,
    run cmd.exe |.


    Even Win32 fails to create any intermediary directories—most likely because it
    simply calls into the c: library''s mkdir() function, which in turn, calls the
    Win32 API''s createdirectory() function.


    Example 3.4 creates as many directories as it needs in order to create the passed-in
