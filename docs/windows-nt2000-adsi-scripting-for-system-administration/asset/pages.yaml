- img_proc: true
  md: 'It is this benevolence that characterizes the core of the Perl community.

    The availability of reusable code is great for most coders; however, system administrators
    are a different breed. For many reasons—some of which include system integrity,
    security, and corporate politics—many administrators refuse to use code that has
    been prepackaged by someone they do not know. I found times when it was easier
    to write my own modules than to attempt to understand the how''s and why''s of
    someone else''s code.


    Often I have found that one module was built on another module that was, in turn,
    built on another module. This is, after all, the foundation of reusable code.
    However, it poses a problem: if one of those modules fails, the entire project
    fails. When all your code depends on layer upon layer of reusable code modules,
    just locating, debugging, and fixing problems can become time-consuming.


    Such concerns led me to write a considerable amount of my own modules and extensions.
    For the sake of the community, much of this code was donated to the public domain
    under the GNU license. This way, other users can use the code and catch bugs that
    I overlooked. However, I found that more and more of my time was spent on documenting
    and fielding questions. This is one of the nongorous aspects of donating code
    to the public forum. It did, however, lead me to a belief that even most Perl
    programmers mean, it is inevitable that many will attempt to use modules and extensions
    without understanding the code, logic syntax, structure, or concepts. Consider,
    the ODBC modules such as DBD:ODBC, Win32:ODBC, ODBC, and ODBCTable. These wonderful
    extensions provide access to databases; unless users understand what ODBC does
    and how it works, a flurry of questions, complaints, and constructive criticisms
    will inevitably arise.


    Regardless, simple mistakes will be made when a programmer does not fully understand
    an extension or module. It becomes obvious that thorough documentation must be
    created in addition to the software. A lack of this documentation may not be a
    problem for those of us who routinely walk through the source code to understand
    it. Even though documentation may exist for some software, many of us still examine
    the source (you would not believe how many undocumented features can be found).


