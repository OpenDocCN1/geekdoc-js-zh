    # Win32::Process


    By now, it should be clear that there are more ways to create a process than you
    shake a stick at, but you''re not quite done yet using Win32::Perl. Two more exciting
    functions are awaiting you. The first is from Win32::Process extension. This particular
    extension is quite useful for managing a process. The Win32::Process::Create function
    creates a new Win32 process. If it is successful, it returns a Win32::Process
    object that can later be used to pause, kill, or wait for the process to die.


    Frankly, everything you can do with Win32::Process you can accomplish with other
    functions. You can create and kill a process in other ways as well. However, this
    extension outshines the others in its capability to manage a process.


    You create a Win32::Process using the Create() method:

    Win32::Process::Create($App, $Args, $Inherit, $Flag, $Dir)


    The first parameter must be a scalar variable. If the creation is successful,
    this variable is set with a reference to a Win32::Process object.

    The second and third parameters, $App and $Args, are identical to the first and
    second parameters in the Win32::Spawn() function. Refer to the section "Win32::Spawn()"
    for more details.

    The fourth parameter, $Inherit indicates whether the new process will inherit
    any open file handles and sockets. Keep in mind, however, that they are Win32,
    not Perl, file handles and sockets. Therefore, setting this parameter to 1 (indicating
    inheritance will occur) may not really benefit a script much.'
