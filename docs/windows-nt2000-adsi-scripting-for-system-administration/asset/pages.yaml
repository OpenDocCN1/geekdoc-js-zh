  md: 'It did not take long, however, for programmers to discover that backup software
    somehow had to be able to restore a file with its original owner intact. That
    meant there was a way to give ownership! The technique for doing so lies in the
    ability for a process to act like backup software. This, of course, requires that
    the user has a special privilege (SE_RESTORE_NAME).


    All this leads to Example 3.12, which enables you not only to discover who is
    the owner for a given object but also to change the object''s (provided you have
    permission to do so). Any user can use this script to view who the owner is, but
    a user requires the SE_RESTORE_NAME privilege to change the ownership of a secured
    object.


    This script accepts a number of parameters representing paths to secured objects.
    To set the owner on the specified objects, you pass in an -s switch followed by
    the account name of the new owner. Consider these two examples:


    ```

    perl owner.pl c:\temp\.txt \server\HKLM\Software\ActiveState

    ```


    ```

    perl owner.pl -s JOEL c:\temp\.txt \server\HKLM\Software\ActiveState

    ```


    The first example displays the owner for all text files in the c:\directory as
    well as the HKEY_LOCAL_MACHINE\Software\ActiveState Registry key on the machine\server.


    The second example is essentially the same as the first example, except it first
    sets all the objects'' owners to Joel and displays who is the owner. If the user
    running the script has the appropriate privileges, Joel is displayed as the new
    owner for each object.


    # Tip


    When referring to an account name, you can pass in the name of an account and
    have Win32 decide if the account is a domain or local machine account.


    Alternatively, you can explicitly specify what machine or the account belongs
    to.


    To specify a domain account, refer to it by specifying the domain followed by
    a backslash and account name as in


    ```

    MyDomain\joel

    "Some Domain\Domain Admins"

    ```


    To specify a particular machine account, pass in the server name beginning with
    double backslashes. Then append a backslash and account name as in


    ```

    \\Server1\joel

    "\Server1\Domain Admins" ◆

    ```'
