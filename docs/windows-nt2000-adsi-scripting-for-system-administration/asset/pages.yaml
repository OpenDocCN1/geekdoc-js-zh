    # Machine Setup Script


    One of the most mundane aspects of system administration is configuring new machines.
    This process can be slow and tedious. Each machine requires that you install the
    operating system, configure it, install appropriate software, and configure thatat
    as well. An easy way to automate this process is to leverage logon scripts.


    By creating a special administrative account that has a special logon script,
    you can simply walk over to a new machine, log on, and walk away. The logon script
    runs and begins the work of reconfiguring the computer. When it is finished, the
    logon script can reboot the computer so that it is ready for you a user. And all
    it took was someone simply logging on with the special account.'
