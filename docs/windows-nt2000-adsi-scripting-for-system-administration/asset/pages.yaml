  md: '# Killing Processes


    Just as with the previous example (refer to Example 9.14), this section revis-
    its script that was covered in Chapter 7''s task killing script (refer to Example
    7.19). Using WMI, however, Example 9.15 is not only able to ter-minate a process
    on the local machine, but it can also terminate processes on remote machines.


    If a machine name is passed in the first parameter (denoted by prepending a machine
    name with double backslashes), all process termina-tion takes place on the specified
    machine. All additional parameters are either considered to be process ID (PID)
    numbers or the name of a process. If a process name is passed in all, all processes
    matching the name are termi-nated. If the name contains wildcards such as * and
    ?, it is used as a regular expression. For example:


    ```

    perl WMI_Kill.pl \server 415 *word

    ```


    terminates a process with PID 415 and any process that has word in its name on
    the machine \server.


    # Example 9.15 Using Win32:OLE to Kill Processes


    ```

    01. use Win32:OLE qw{ in };

    02.

    03. $Machine = ".* unless $Machine = shift ARGV;

