- img_proc: true
  md: 'The lack of such search functionality is probably due to, in part, the lack
    of any real need. After all, the repository of information was designed for processes
    to hold configuration data—what used to be held in .INI files. The presumption
    here is that software would know where it stored data in the Registry, so it would
    never need to look for it. This presumption, however, is based on the notion that
    software behaves itself.


    All too often when you uninstall software, it leaves, intact, traces of itself,
    such as Registry information. Under these circumstances, searching the Registry
    for a given GUID or search can be quite valuable. To give another, but altogether
    pertinent, example, often, for some odd reason, some software moves a window to
    a location just off the screen. This repositioning of a window may occur if you
    are using dual monitors but have to temporarily resort to using only one. This
    could also occur if, from time to time, you use a higher resolution display. Either
    way, every time the application is run, the window user interacts with is located
    where it cannot be seen. Because most users do not know where, say, Notepad may
    locate its configuration store in the Registry, a search becomes important.


    Example 3.14 performs such searches. When you pass in Registry paths and search
    strings, the script scans the Registry and displays its findings as it proceeds.
    You can pass in multiple paths and multiple search strings. All you need to do
    is specify each path with a -p switch—as many of them as necessary. Then pass
    in as many strings as required.


    You can locate each path on a remote machine by prepending the machine name to
    the path. You can also abbreviate the Registry root keys as in Table 3.3.


    Table 3.3 Registry Roots and Their Abbreviations

    | Registry Root | Abbreviation |

    | HKEY_LOCAL_MACHINE | HKLM |

    | HKEY_CURRENT_USER | HKCR |

    | HKEY_CLASSES_ROOT | HKCU |

    | HKEY_USERS | HKU |

    | HKEY_CURRENT_CONFIG | HKCC |


    Consider this example:


    ```

    perl regfind.pl -p HKEY_LOCAL_MACHINE\Software

    -p \server1\HKLM\Software winamp "windows media"

    ```'
