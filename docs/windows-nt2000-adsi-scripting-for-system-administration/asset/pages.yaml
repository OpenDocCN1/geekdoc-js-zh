    # Notes on Files and Directories\n\nFor files and directory paths, wildcards are\
    \ acceptable; however, for Registry keys, they are not.\n\nYou can specify files\
    \ and directories on remote machines by using a UNC. However, if you're specifying\
    \ a UNC's root directory, make sure that you terminate the path with a backslash\
    \ like this:\n\n```\n\\\\server\\\n```\n\nIf you do not append the backslash,\
    \ the permissions of the network share itself are referenced.\n\n# Notes on Shared\
    \ Directories and Printers\n\nShared directory and printer pathnames must not\
    \ end with a backslash. If you specify a shared directory path with an ending\
    \ backslash, the permissions for the shared directory's root directory are displayed,\
    \ not the permissions for the network share itself. An attempt to reference a\
    \ printer with an ending backslash simply fails.\nAlso, note that shared directories\
    \ have neither an owner nor a group.\n\n# Notes on Registry Keys\n\nYou can specify\
    \ Registry keys with a full Registry key path like this:\n\n```\nHKEY_LOCAL_MACHINE\\\
    Software\n```\n\nYou can abbreviate the Registry root by shortening it like this:\n\
    \n```\nHKLM\\Software\n```\n\nYou can also specify Registry keys on remote machines\
    \ by prepending the machine name like this:\n\n```\n\\\\server\\HKEY_LOCAL_MACHINE\\\
    Software\n```\n\nor\n\n```\n\\\\server\\HKLM\\Software\n```"
