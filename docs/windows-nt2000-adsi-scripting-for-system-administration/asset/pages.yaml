    Caution

    Win32 Perl''s fork emulation appears to solve many problems that this chapter
    has

    so far addressed. However, this emulation is still relatively young and has many

    bugs to be worked out. In my test lab, most processes that loop creating

    children almost eventually crash. Therefore, use caution before implement-

    Win32 Perl''s fork() if you plan on deploying such scripts in a production

    environment. ◆


    # Running Processes as Another User


    Since Windows NT was developed, administrators have been lamenting over

    the lack of a UNIX-like super user (SU) utility. In UNIX, anyone could run

    t SU utility, provide the correct password, and be treated as if he were the

    super user. The Win32 world does not have a super user account; instead, it has

    the Administrator account. The only way to be treated as the admin-

    istrator is to log on as the administrator. Doing so requires anyone currently

    logged on to close all applications and log off first. This approach is not

    very user friendly.


    Years ago I got around this problem by writing a script called

    RunAs.pl (see Example 7.14). When calling the script, you provide a user-

    name (and optionally a domain), a password, and an application to run. If

    You are logged in with the correct privileges on your account, the applica-

    tions run, impersonating the specified username. This capability has come in

    quite handy. Typically, I do something like this:


    ```

    perl runas.pl mydomainadministrator myadminpwd cmd.exe

    ```


    The result is a DOS box that runs under the Administrator account. I can

    t perform administrative tasks such as deleting secured files. If you were

    to run a simple WhoAmI.pl script (see Example 7.13), it would print the

    following:


    ```

    Currently logged on as:

    -----------------------

    Domain: mydomain

    Computer: TEST_PC

    User: Administrator

    ```


    This output shows that the new process (CMD.EXE) is running as the

    ministrator and not the current user—unless, of course, the current user is

    the administrator.'
