- img_proc: true
  md: '# Debugging


    Services are designed to be a lights-out approach to program running; that is,
    the program starts and eventually terminates without ever having to interact with
    a user. This means that services rarely need to present information to a user;
    therefore, most services never expose any windows. Not having any windows, of
    course, makes it very difficult to debug.


    With creative thinking on your part, this problem quickly becomes manageable.
    Example 8.9, shown earlier, takes two different approaches to solving this problem.
    First, it opens a log file (refer to lines 24 through 32). This technique is used
    for archiving purposes so that a log of the service''s activity is created. However,
    the log can just as easily be used for debugging. The service uses its own write()
    instead of calling Perl''s print function. This function is used to redirect information
    to the log file.


    Lines 42 through 45 illustrate another technique to debugging services. In this
    block of code, the service attempts to show itself by exposing its console window
    with the show() function. Typically this works when the service logs on the local
    system. It creates a new console buffer and displays it in the console (lines
    42 and 43). When this step is done, anything that is passed to buffer::write()
    is displayed in the console window. In addition to saving to the log file, this
    is what the write() function does, enabling the programmer to quickly see what
    is being logged at the time it is being logged, easing the burden of debugging.
    This particular method of debugging is useful as the service runs under the Local
    System account. Otherwise, you might not see the created console.


    A service can just as easily implement the capability to log entries to the Win32
    Event Log (“Monitoring and Reporting”). Another useful debugging tool is to run
    a Perl script that creates a named pipe and dumps any incoming data to the stream.
    This enables the service to connect to the named pipe when it starts and print
    debug messages into the pipe. This approach provides a programmer with instant
    debugging information. It also enables you to debug from across the network. This
    is one of the single most useful tools that can be used when you are debugging
    services.


    Example 8.12 is a named pipe server application that can be used to receive debugging
    messages from Win32 services (or any other script for that matter). To use this
    functionality, all you need to do is incorporate the two functions from Example
    8.13 into your service script. Then, at the beginning of the service, call the
    start() function, passing in the name of the machine the named pipe server script
    is running on. If you pass nothing, the local machine is assumed. Any time you
    needs to dump debug information, pass the data to the Log() function. As long
    as Example 8.12 is running prior to the service starting, it dumps all the debug
    information.'
