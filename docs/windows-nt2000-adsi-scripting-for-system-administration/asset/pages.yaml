- img_proc: true
  md: '# Perl and the Admin


    If you are reading this book, chances are that either you are a system administrator
    who needs to automate administrative tasks, or you have an extraordinary sense
    of curiosity. Either way, you are embarking on a journey that will take you to
    the far reaches of administering Win32 machines.


    As a system administrator, I quite often found myself having to automate tasks
    that my colleagues were content to do by hand. For some reason, they felt that
    adding tens of users at a time to a domain was best accomplished using the User
    Manager application. The closest they came to automating was a batch file that
    deleted temporary files from the temp directory. If they ever needed to make environmental
    modifications on a wide scale (say, across thousands of machines), I would rather
    walk to each box, log on, and make the necessary modifications. I, on the other
    hand, found that approach simply an unacceptable waste of my time. In the time
    it would take me to modify two or three machines, I could have written a Perl
    script that would scurry across the network and make the necessary modifications
    on all the machines. The total turnaround time to hit all the computers on the
    network was in the scope of minutes, whereas my peers would require an entire
    weekend or more.


    Scripting—whether in Perl, JavaScript, Visual Basic, Python, or any of a dozen
    other languages—is a tremendous way to automate, thus saving time, effort, and
    in end. In my mind, a system administrator must be able to effectively use a scripting
    language; otherwise, he is simply a knowgeable computer user. You can follow this
    logic back to the UNIX platform, where scripting was necessary to keep a machine
    configured properly. It is not untypical to see a UNIX box littered with shell,
    Perl, and other types of scripts. For some unfortunate reason, Win32 has departed
    from that trend. Win32 administrators far too often look to some third-party application
    that will magically perform some type of configuration or'
  merge: -1
