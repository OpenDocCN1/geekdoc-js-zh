  md: '# Chapter 7: Processes


    This forking emulation can help solve the problem of Win32''s lack of fork() in
    versions before 5.6. However, recent versions of Win32 Perl now support forking.
    To demonstrate how efficient it is to use “real” forking in this same script,
    refer to Example 7.24. This script is consider-short, and it results in more efficient
    use of the machine’s CPU because Perl 5.6''s fork emulation results in the creation
    of a new thread, not a new process.


    # Example 7.23 Socket Daemon Client


    ```

    01. use IO::Socket;

    02.

    03. $Host = ''localhost'' unless ($Host = $ARGV[0] );

    04. $Port = 8080;

    05.

