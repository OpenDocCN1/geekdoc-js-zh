  md: '# Monitoring and Reporting


    Most network administrators'' job descriptions explain that the position entails
    maintenance and planning. However, any administrator who has been at the job more
    than a week can tell you that this is only one-third of the work. Extinguishing
    fires typically ends up being the bulk of the work. With a bit of foresight and
    planning, however, many of these fires can be prevented.


    Reporting is a way of monitoring events that are taking place and being able to
    address them when they occur. For example, a smoke alarm monitors the air quality
    and begins to beep if too many smoke particles or intense heat is detected. Reporting
    typically is performed in two discrete phases: detection and alerting.


    # Dection


    The first phase of reporting is the detection phase. This particular phase is
    concerned with monitoring events. An event may be a service stopping or a machine
    going offline. Typically, detection is performed by polling; that is, a script
    continuously requests an update on the state of some device or process.


    Polling techniques can present problems because there could be several points
    of failure between the querying process and the device to be queried. For example,
    if one machine is monitoring another, it may attempt to contact the monitored
    box every minute. If the monitored machine fails to respond, an assumption is
    made that the machine has gone down. However, this assumption may or may not be
    correct. A router between the monitoring machine and the supposedly downed server
    may have been overwhelmed by a burst of network activity. Therefore, the monitoring
    script must take this situation into consideration, possibly by waiting until
    the connection fails repeatedly over a span of time to account for a few dropped
    network packets.'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'There is no simple technique to monitoring an event. Each task requires its
    own unique method. For example, you might test a server to see whether it is alive
    by pinging its IP address. You can do so by using the Net::Ping module or shelling
    out to the PING.EXE program. In this case, both approaches would work; however,
    each technique would require different processing. One technique examines the
    results of a function call, and the other parses the text output of an external
    program.


    # # Alerting


    When a monitored event occurs, the second phase of reporting begins. This is the
    process of alerting.


    The results of some monitoring action can be reported in several ways. The first
    should be the Win32 Event Log. Using this log is the standard way of journaling
    system events that take place on an NT or Windows 2000 machine. This log is always
    available, it can be remotely accessed, any account can write to it, and it logs
    the time and date of each entry, among other things.


    # # Event Logs


    Windows NT/2000 provides journaling capability so that informational as well as
    critical events can be logged. This feature is known as the Event Log.


    The Event Log''s function is similar to that of UNIX''s syslog daemon. An application
    (or device driver, service, component, or any executable piece of code) can review
    these events by running the EVENTVWR.EXE application. You can register an *event*
    on any machine for which it has permissions.


    Typically, a server has three Event Logs: Application, System, and Security. Windows
    2000 Server also adds Directory Service, DNS Server, and File Replication Service
    logs. Normally, an application reports events only under the appropriate log.
    So, security-related events are reported to the Security log, and system events
    (driver failures, network cards binding to DHCP addresses, and so on) are reported
    under the System log.


    Two Win32 Perl extensions expose the Event Log API functions: Win32::EventLog
    and Win32::Lanman. One would suffice for logging events. A third extension, called
    Win32::EventLog::Message, works in conjunction with either of them.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Event Win32::EventLog::Message Tables


    The EventLog::EventLog::Message extension provides a message table that permits
    formatting of your Event Log message. A message table is simply a list of formats
    that can be used to display information. Typically, a message table has precomposed
    text strings in a particular format. These text strings have placeholders that
    are swapped with variable information for display onscreen or in the Event Log.
    For example, say that you write code that displays a dialog box indicating the
    time of day. You may create this entry in a message table: `current time is: %1!`.
    When you display the dialog box, `%1!` is swapped with some string that the program
    decides on at runtime. This extension works tables if you need to change languages,
    you can simply replace the resource .DLL file that contains the message table.
    Say that you “internationalize” your program in English and Turkish. Let''s say
    that the English version of the message table results in a message box that looks
    like Figure 5.1. However, when you swap the English message table with a Turkish
    version, the dialog box magically appears like the one in Figure 5.2. This change
    occurs without having to recompile your program; all you need to do is create
    the new message table .DLL file.


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_174_0.png)


    Figure 5.1 A simple message table.


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_174_1.png)


    Figure 5.2 The same dialog box as in Figure 5.1, using a Turkish message table.


    In an Event Log, message tables are referred to as sources. A source is associated
    with a particular log. For example, a user may want to create a source for some
    Perl script that runs as a service. She would probably want to associate the source
    under the System log (where most services go). A program must register an Event
    Log source by specifying the source name and path to a resource library (typically
    a .DLL, .EXE, or .SYS) file that contains a message table. After a source is properly
    registered, Event Log entries are associated with the particular source link to
    the source''s message table.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Chapter 5: Monitoring and Reporting


    Each log entry can be associated with an event ID, which indicates which entry
    in the message table to use. The message table entry is typically text message
    that has modifiable fields. For example, Figure 5.3 contains this message:


    A request to suspend power was denied by WINWORD.EXE.


    This message comes from the Win32k event source, which is mapped to %SystemRoot%\System32\win32k.sys.
    The event ID is 240, so when the Event Log displays this entry, it opens the %SystemRoot%\System32\win32k.sys
    file and looks up the message from row 240 of the file''s message table. That
    table entry consists of this string:


    A request to suspend power was denied by %1!


    When the Event Log entry was made, a number of strings were provided. The %1!
    is replaced by the contents of the first string and interpreted as a text string.
    If %2! appeared in the message, it would have been replaced with the contents
    of the second string (interpreted as a numeric value).


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_175_0.png)


    Figure 5.3 An Event Log entry.


    When Perl reports an Event Log entry (using Win32::EventLog or Win32::Lanman),
    it can specify a source, event ID, and strings (at least these are the three most
    important things). Most users want to report an event on behalf of their script.
    Because a Perl script does not, by default, have a source associated with a message
    table, the Perl script’s log entry ends up looking like Figure 5.4. Notice that
    the strings passed in are displayed, but not in an elegant fashion.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Alerting


    # 157


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_176_0.png)


    Description:

    This description for Event ID 0 is in Source Application and cannot be found.
    The local computer may not have the corresponding registry entry or message DLL
    files to display the message from a remote computer. The following is a copy of
    the event: Server ''Server'' reported down at Jun 16 16:01:42 2000


    Figure 5.4 An Event Log entry without a message table.


    This is where The Win32::EventLog::Message extension comes in. It provides a simple
    message table with one entry, which contains


    +   * %1s


    This table entry simply expands to whatever you passed in. Therefore, your Perl
    script can pass in any formatted text (with carriage returns, multiple spaces,
    tabs, and so on). Figure 5.5 illustrates how the same string in Figure 5.4 looks
    when using this extension''s message table.


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_176_1.png)


    Figure 5.5 An Event Log entry using Win32::EventLog::Message.'
