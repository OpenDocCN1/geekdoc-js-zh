  md: '# # If you are looking for more information on Scripting, you should pick up...


    # ## WINDOWS® NT®/2000 ADSI SCRIPTING FOR SYSTEM ADMINISTRATION


    "Filled with practical code examples, Thomas Eck''s book is my constant companion
    for Windows 2000 directory services development. Its pragmatic style and sensible
    organization make access to the wealth of useful VB and ASP code easily."

    n—Scott Loban, Senior Engineer, Stellcom Technologies


    Windows NT/2000 ADSI Scripting for System Administration provides advanced system
    administrators, application developers, and IT managers with programmatic methods
    to help simplify administrative tasks in large-scale environments. This practical
    guide includes:


    +   - Proven techniques to automate redundant tasks using Visual Basic and VBScript


    +   - Hundreds of administrative code samples that enable use of the Visual Basic
    IDE as an administrative console for one or more million samples


    +   - Ready-to-implement code covering almost every aspect of namespace administration
    supported by the WinNT, LDAP, and IIS ADSI service providers


    As a specialist with the Global Financial Services industry of Perots Systems
    Corporation, Thomas Eck is a developer and project manager for defining the Web
    infrastructure standards and for a major global investment bank. His achievements
    in this role include creating a Web-based delegated administration architecture
    for Windows NT user and resource domain administration using ADSI, COM, and MTS
    in the application''s middle tier.Thomas''s unique coupling of practical and theoretical
    knowledge of both system administration and multi-tier development practices enables
    him to derive robust Web-based and process workflow solutions for large enterprise
    computing environments.


    With the aid of this reference, you''ll learn techniques to help you:


    +   - Develop reusable COM objects


    +   - Create a delegated administration model using ADSI, COM, and MTS


    +   - Programmatically enforce enterprise naming standards and process consistency


    +   - Script custom administrative workflow process applications for Windows NT/2000,
    IIS, Microsoft Exchange Server, and Netscape Directory Server


    Available now at a bookstore or online retailer near you! ISBN 1-58780-219-4 $45.00
    US 700 pages


    ![](img/b5063514d2e449d6d8c5d65f100b84aa_418_0.png)'
