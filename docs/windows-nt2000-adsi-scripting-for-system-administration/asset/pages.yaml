  md: '# Conclusion


    It is reasonable to presume that crises will occur on your network. Whether a
    workstation''s drive becomes corrupt or a file server crashes, it is not a matter
    of “if” but more a matter of “when.” When such a crisis arises, it is best to
    be ready so that you can take action for a swift resolution. Perl is the perfect
    language to prepare for such crises, as well as react to them.


    The interesting thing about leveraging Perl in this regard is that it is simply
    a tool. The administrator is required to design a Perl-based solution that is
    specific for his network. But when the language is married to such a solution,
    you can rest assured that you will be ready for any problem.'
