    # Unlocking Accounts


    Some domains implement policies that prevent abuses of accounts. For example,
    a policy may force a user to change their password every 90 days. Another policy
    may prevent the user from reusing the same password. Several policies can be leveraged
    to help secure a domain.


    One of these policies, however, can lead to very frustrated users. This policy
    locks out a user account if too many logon attempts are made using the incorrect
    password. Such locking prevents the user from logging on, even with the correct
    password. It is very similar to a disabled account, with the exception that an
    account cannot be placed manually in the locked-out state; it must violate particular
    policies (such as too many bad logon attempts). It is locked so that you know
    the account was disabled due to policy violation.


    The only correct way to change the state of a locked-out account is to have an
    administrator unlock the account. This is normally done by using the User Manager
    or MMC deselecting the Account Locked Out check box. However, by using the script
    in Example 2.6, you can quickly unlock accounts from the command line.


    The script can take any number of accounts to process. In this script, as with
    many other scripts in this chapter, you can supply an asterisk to indicate that
    all accounts matching that name are to be displayed. For example, the following
    line results in the unlocking of the Tester1, Tester2, Testertemp, and Joel accounts
    for the myDomain domain:


    ```

    perl unlock.pl -d MyDomain tester* joel

    ```


    This script accepts the command-line switches described earlier in Table 2.3.
    If neither domain nor machine names are specified, the script defaults to the
    domain of the user running the script.'
