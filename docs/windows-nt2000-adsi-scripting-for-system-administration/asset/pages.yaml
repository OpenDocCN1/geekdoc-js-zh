    # The IIS ADSI Provider


    ADSI comes with several default providers. The provider that interfaces with Microsoft''s
    Internet Information Server (IIS): Using this particular provider is the only
    way a Perl script can interact with IIS. The IIS service has quite a large object
    model with an impressive number of properties. You can see this for running Example
    9.2 and passing in an ADsPath string that points to a valid IIS server like this:


    ```

    perl IIS://localmachine

    ```


    This command displays all the IIS classes and properties stemming from the specified
    path. If you want to examine only the IIS Web server classes, you can specify
    an ADSI AdsPath of IIS://localmachine/w3SC. To examine only the FTP classes, use
    IIS://localmachine/MSFTVSVC.


    # Discovering IIS Properties


