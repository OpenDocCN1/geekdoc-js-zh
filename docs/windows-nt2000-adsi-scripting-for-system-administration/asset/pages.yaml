  md: '# Active Directory Services Interface 325


    If a script requests an ADSI object, it can query its properties over and over
    again. This is relatively painless when the ADSI object represents something on
    the local machine. Every time the script accesses a property, the ADSI provider
    talks to the local machine, discovers the value of the property, and returns it
    to the script. However, if the ADSI object represents, say, a user on a remote
    machine, the ADSI provider has to request the property''s value from across the
    network. This could have serious performance ramifications, especially if a script
    processes many objects and properties.


    To lessen the impact on a network, ADSI caches various objects and properties.
    Having this cache means the provider has to query across the network only once—to
    get the object first time it is referenced. This strategy generally improves network
    and script performance.


    This approach does have one slight problem, though. If you modify an object''s
    properties, they are modified to the cached object. This, again, improves performance,
    not having to write across the network every time modifications are made. However,
    a burden is placed on the script to commit any changes that are made.


    Committing changes made to an ADSI object is simple. You can commit an ADSI object
    that has properties by calling the object''s setInfo() method, which forces ADSI
    to submit the cached object to its repository. This repository enables or disables
    specified accounts. The magic of this script occurs either be a local machine
    or a remote machine across the network.


    Example 9.7 illustrates how an object can be committed from cache. This script
    occurs in line 25, which calls the user object''s setInfo() method. Here, the
    modifications made to the user account are committed to the database where the
    account resides.


    Line 26 is for those of us who are paranoid that method calls don''t always work.
    In this code the calls getInfo() method, which refreshes the user object in the
    cache. It forces ADSI to go out across the network and procure the latest properties
    for the user account. Lines 27 and 28 then check to see whether the property was
    successfully set.


    The script takes any number of accounts in one of the following formats:


    ```

    account

    domain\account

    \machine\account

    ```


    The script, by default, enables the specified accounts. If the -d switch is passed
    in, the accounts are disabled.'
