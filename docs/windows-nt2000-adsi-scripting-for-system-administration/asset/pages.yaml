    # Creating Directories


    Creating directories is not a new concept. All disk-based operating systems such
    as UNIX, Win32, DOS, and Macintosh have the concept of file-based container (for
    example, a directory or folder). You must create a container so that you can move
    objects as files and other directories into it. You usually do so by using a command
    as md or mkdir. Win32 exposes this functionality through its Win32 API CreateDirectory()
    and CreateDirectoryEx() functions. It is also available from a DOS box when'
