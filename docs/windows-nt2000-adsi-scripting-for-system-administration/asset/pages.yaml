- img_proc: true
  md: '# Chapter 2: Account Maintenance


    Example 2.1 creates a user account in a specified domain (or specified machine),
    adds the user to various specified groups, and creates and applies permissions
    to the user''s home directory. To use this code, you need to change variables
    to match your own network.


    You should modify the % hash so that the profile key (line 8) reflects the path
    to your user''s home directories. The script key (line 10) is the path to a logon
    script. The logon path is relative to the logon script''s directory on the domain
    controller (DC) that authenticates the user. See Chapter 6, "Logon Scripts," for
    more details.


    Additionally, you can change the permission masks in the %Permission hash to suit
    your needs (lines 14–23). The hash contains sub-hashes, one per user or group
    (the key for the sub-hash is a user or group account name). One, called <user>,
    is replaced by the account''s name for which the directory is being created. Lines
    159–172 actually apply the permissions, depending on how the hash is constructed:
    File permissions are applied if a file hash exists, and directory permissions
    are applied if a dir hash is defined.


    The %account hash in lines 58–76 defines how the account is created. Here, you
    can tweak the attributes of the account. By default, the password is a lowercase
    version of the account name. Table 2.1 explains some of the other, more obscure
    attributes.


    # Table 2.1 Meanings of the Keys in Example 2.1''s %Account Hash


    | Key | Description |

    | --- | --- |

    | usr_comment | This attribute specifies a comment about the user account. Nobody
    sees it except those who examine the account at a low level, such as the script
    in Example 2.2. Even if an administrator uses the User Manager, this attribute
    is not displayed. It is typically not used; however, it might contain a comment
    about the state of the account, such as Temporarily disabled until further notice
    |

    | params | This attribute should be left empty. It is modified by certain programs
    to store configuration information. Additionally, Microsoft stores Remote Access
    Services (RAS) and other configuration information here |

    | workstations | This attribute represents the machines the account is allowed
    to log on to in a comma-separated list, such as server1,server2,JimsComputer If
    this attribute is empty, the account is permitted to log on to any machine in
    the domain. |'
