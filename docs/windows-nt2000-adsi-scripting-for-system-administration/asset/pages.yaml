- img_proc: true
  md: 'The fifth parameter, $1Flag, allows a script to specify various creation flags.
    These flags determine how the process is created. The following three flags are
    worth noting:


    +   - CREATE_NOWWINDOW creates the process with no window if it is a console application
    (such as a Perl script). The process runs, but no console window (DOS-like box)
    is created for it. Therefore, STDOUT and STDERR are not displayed.

    - CREATE_NEW_CONSOLE creates the process with a new console window. If the created
    process is a regular Windows application (with a graphic window), this flag doesn''t
    do anything. STDOUT and STDERR from the process are displayed in the new window.

    - CREATE_SUSPENDED is a useful flag if you need to perform benchmarking or synchronize
    the new process. The process is created but automatically suspended in paused
    state. You can resume the process with a call to the Resume() method. This method
    works for any process, console- or window-based. When the process is created,
    it does not show its window until it resumes. If you specify the CREATE_NO_WINDOW
    flag as well, a console-based application''s window never appears, even after
    resuming.


    Typically, scripts specify CREATE_NEW_CONSOLE when creating new Perl script processes.
    This way, the user can see the output of the process. However, if you have some
    service or daemon that creates processes quite often, always having a window pop
    up to the focus can be distracting and annoying. In that case, you should specify
    the CREATE_NO_WINDOW nor CREATE_NEW_CONSOLE flags.


    If you specify not the CREATE_NO_WINDOW nor CREATE_NEW_CONSOLE flags, all output
    from a new console process is dumped into the same window as the original Perl
    script. Seeing outputs from different processes intermixed on the same window
    can become chaotic.


    Finally, the last parameter is the default directory that will be set for the
    new process.

    Example 7.11 uses NOTEPAD.EXE to display a text file for a specified amount of
    time. After the timeout value is exceeded, the process is killed. Even though
    this approach is not an elegant way of displaying a message of the day, it could
    be useful in something like a logon script. The nature of this particular script
    is to demonstrate the usefulness of the win32::Process extension.


    Note that using the CREATE_SUSPENDED flag (line 8) is not necessary; it is here
    only to demonstrate how to create a suspended process. Likewise, calling the Resume()
    method (line 20) is necessary only because the process is created in a suspended
    state.'
