    Lines 54 through 61 configure the script to access Jamie''s pager. In this example,
    she uses AT&T''s SMS paging service using the Net::Pager module. She could just
    as well configured it to use another paging service or use SMTP to send email
    instead. This configuration hash also identifies her Exchange server as well as
    her mailbox. You can easily modify these values to reflect your own configuration.


    Line 70 is important because it determines which file the service will write its
    log to. This log file shows when pages have been sent out. By default, the log
    file is placed in the same directory as the script itself. It is also named the
    same as the script, with the exception that its file extension is .log. By modifying
    line 70, you can direct the log to anywhere—as long as the account running the
    service has permissions to write to the file. For example, you can modify this
    line as follows:


    ```

    my $DB_FILE = "\\\\pipe\Debug Logging";

    ```


    This log path would log data created by Example 8.12. This approach is a terrific
    way to monitor the progress of the service because the named pipe script will
    display all information that the reminder service logs, in real time. Notice that
    if the named pipe server runs on another machine, you can replace the "\\\\MachineName",
    where MachineName is the name of the computer running the named pipe script, so
    line 70 might make look like this:


    ```

    my $DB_FILE = "\\\\MachineName\pipe\Debug Logging";

