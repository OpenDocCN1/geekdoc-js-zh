    # Enumerating Processes


    Getting a list of currently running processes can be quite tricky. By far, the
    easiest way to obtain such a list is to run the Task Manager (see Figure 7.1).
    You can run this program by pressing Ctrl+Shift+Esc. You can also run this program
    by right-clicking the taskbar and then selecting Task Manager.'
