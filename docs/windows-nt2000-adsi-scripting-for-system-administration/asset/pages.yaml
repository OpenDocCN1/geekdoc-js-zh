  md: '# Running Perl Scripts as Win32 Services


    A few aspects of this example are worth noting. Each code block that deals with
    a pending state change ends by calling the win32::Daemon::State function passing
    in the new state (lines 8, 13, 18, and 23). Calling this function is imperative
    so that the script can update the Service Manager with the new state change; otherwise,
    the service gives up trying to control the service. If that occurs, the service
    cannot be stopped, paused, or resumed.


    Line 32 is especially important; this line simply causes the script to fall asleep
    for a brief period of time. For most services, such a pause is required; otherwise,
    it is processed so quickly that it may threaten to suck up CPU processing time
    needlessly.


    Finally, the SERVICE_RUNNING block (lines 25 through 31) contains the code that
    performs the actual work of the service. When you put the actual processing code
    in this block, the code is not run if the service enters the SERVICE_PAUSED state,
    which is exactly what a service should do in the paused state.


    What is most important to know regarding this service control loop is that it
    must periodically loop. That is, it must not enter some race condition that blocks
    it from looping. An example of a bad-coding practice would be to listen on a socket
    for a client connection. Unless the listening is non-blocking, it could prevent
    the service from responding to the Service Manager, risking becoming an abandoned
    service.


    If you are running a version of Perl that supports threads, it is quite possible
    to create a new thread that performs the processing work. In this way, the thread
    can be controlled by the service control loop—pausing and resuming as needed.


    # Registering a Win32::Daemon Service on the Network


    Often a service is designed to work with outside processes. Examples of such processes
    may be a time service that provides an “official” time of day that other computers
    synchronize to, a database engine to which other computers must connect and submit
    updates, or an antivirus update service in virus services can connect to and retrieve
    the latest virus signatures. These types of services may want to announce themselves
    on the network. Doing so allows other machines to easily locate which machines
    these are running on.


    A service can announce itself by associating with one of 32 announcement flags.
    If anyone on the network requests a list of machines running a service, the service
    specifies one of these flags. The query results in a list of all machines that
    have a service associated with the specified flag. A machine can query services
    by calling the Win32::NetAdmin::GetServers() or Win32::Lanman::EnumServers() functions.'
