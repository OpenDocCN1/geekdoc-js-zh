  md: '# Minimizing Network Bandwidth Use


    Win32 tries to minimize memory usage. Considering that the operating system is
    a multitasking environment, one process may need more memory at one time, whereas
    another process may require less. Because a machine has only a finite amount of
    memory, Win32 swaps blocks of memory in and out of RAM. For example, if you''re
    editing a TIFF graphic in Photoshop, Windows may temporarily move a Word document
    from RAM to a swap file on the hard drive. This frees up RAM for Photoshop to
    use. When you go back to Word to continue editing the document, the operating
    system may move Photoshop''s TIFF file data to the swap file and reload the Word
    document back into RAM. As a result, you may often experience disk thrashing when
    you have many applications running.


    Win32 also uses another way of managing memory. When an application runs (such
    as Photoshop, Excel, or Perl), the operating system has to load the program''s
    code into RAM to execute. This process can take quite a bit of memory. Just like
    a TIFF file or Word document, code memory can be swapped out of RAM.


    Why should you fill the swap file with this code when it is already stored on
    the hard drive in .EXE or .DLL file? The answer is that there is no reason. This
    is precisely why some programs and libraries are marked as DISCARDABLE. If code
    is marked as purge, it is purged from RAM when more memory is needed by another
    process. This means it is removed from RAM but not stored in the swap file. When
    the code is needed again, it is simply reloaded from the .EXE or .DLL file. This
    process works remarkably well. Well, almost remarkably well.


    A problem arises when you are accessing Perl over a network or from a CD-ROM.
    If Win32 purges the Perl program code, it has to travel across the network or
    start to spin up the CD to reload the code later when it is needed. This burdens
    both the network with excess traffic and the user in terms of latency.


    You can mark executables and libraries so that they "run from a swap file." This
    means when the .EXE or .DLL file is loaded, all of its image is loaded into RAM.
    Therefore, if any pages are swapped out of memory, they go into the pagefile on
    the hard drive instead of being purged from RAM altogether.


    Typically, neither Perl nor any of its libraries are marked for this type of forcing
    into memory. However, if you are compiling Perl yourself using Microsoft Visual
    C++ (MSVC), you can tell the linker to set the header flags such that network
    and/or CD-ROM access forces the file image'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'fully load into RAM. If, however, you are not compiling Perl, you can still
    set the flags by using a binary image header editor, such as EDITBIN.EXE (which
    comes with Microsoft''s Visual C++).


    You can set the appropriate flags (for network or CD-ROM access) by using the
    following command:


    ```

    editbin perl.exe /swaprun:net /swaprun:cd

    ```


    Of course, only specify the example you want (or if neither need be). To remove
    the flags, use the following command:


    ```

    editbin perl.exe /swaprun:net /swaprun:lcd

    ```


    The following three files should be configured with the swaprun flags for Perl
    5.005.


    ```

    perl.exe

    perlcore.dll

    perlrt.dll

    ```


    And for Perl 5.6 (a.k.a. 5.006), you use these files:


    ```

    perl.exe

    perl56.dll

    ```


    Likewise, you might want to set the flags on any extension DLL that is used often,
    especially if they are large, such as Win32::GUI, Win32API::Registry, Win32::00BC,
    and Win32::WinError.


    The list of files loaded by Perl can be determined using the modules.pl script
    (Example 7.17), which is discussed in Chapter 7, "Processes.".


    # Extensions


    Many extensions are available for Win32. These extensions provide an absolute
    wealth of functionality that makes Perl very powerful. Because extensions are
    written by people who have different needs, it is common to find an extension
    that exposes some functionality identical to that found in other extensions. For
    example, the Win32::Lanman extension provides a function called NetServerEnum()
    that returns a list of servers; the Win32::NetAdmin extension also provides a
    similar function called GetServers().

    Fundamentally, there is no difference between the two because both end up calling
    the same Win32 API function, but there is a difference in how each of the functions
    is called.'
