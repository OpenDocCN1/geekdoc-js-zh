  md: '# Redirecting Input and Output Handles


    In Win32, a script can redirect the standard input and outputs (STDIN, STDOUT,
    STDERR). By using Win32 command redirect tokens, you can effectively redirect
    these streams.


    Win32 command lines recognize the < and > redirection characters, which tell the
    command interpreter to redirect input (<) into or output (>) from a process. Consider
    this example:


    ```

    dir *.> directory.txt

    ```


    This command redirects the output from the dir .* command into a file called directory.txt.
    However, NT provides a bit more power by enabling you to specify which output
    stream to be redirected. By default, the STDOUT output stream (which is always
    handle 1) is redirected. Therefore, the preceding command is equivalent to this:


    ```

    dir .* 1> directory.txt

    ```


    If you want to redirect the STDERR of a command, simply specify the STDERR file
    handle number (which happens to be 2):


    ```

    rd MyDir 2> error.txt

    ```


    In this case, if the directory, MyDir, does not exist, an error message is saved
    into a file called error.txt.


    Now the cool part is that you can also specify a stream to redirect into by specifying
    an ampersand (&) character and the stream''s file handle number:


    ```

    rd MyDir 2>&1

    ```


    This command redirects the STDERR output into the STDOUT. If you were to combine
    this with the backtick execution, you would successfully get all STDOUT and STDERR
    returned. Example 7.6 does exactly this. The array @output in line 3 is assigned
    each line of both outputs. The first part of the array is STDOUT, followed by
    STDERR. Example 7.7 is called by Example 7.6 and provides output for the sample
    of demonstration.


    # Example 7.6 Redirecting STDERR to STDOUT Using Backticks


    +   01. my $Name = "MyScript.pl";

    02.

    03. my @Output = ''$Name 2>&1'';

    04. print @Output;


    # Example 7.7 The MyScript.pl Script for Example 7.6


    +   01. print STDERR "This is STDERR line #1\n";n02. print STDOUT "This is STDOUT
    line #1\n";n03. print STDERR "This is STDERR line #2\n";n04. print STDOUT "This
    is STDOUT line #2\n";'
