  md: '# 7

    Processes


    One fundamental purpose of modern day computers is to run applications. These
    applications can be in such basic forms as services and daemons, programs, automated
    batch jobs, or Visual Basic, Java, or even Perl scripts. Because this capability
    is common among almost all computers, it stands to reason that they share similarities.
    For the most part, that is true.


    The Win32 world, however, has several idiosyncrasies that coders from the UNIX
    discipline find laughable. To be sure, from a UNIX background, these issues are
    considered limitations and are indeed mockable. However, they are not necessarily
    a bad thing; actually, they can be quite useful and empowering. The real issue
    is that UNIX coders are not familiar with Win32 process creation. If Win32 had
    come before UNIX, you can be assured that Win32 folks were mocking UNIX process
    techniques.


    This chapter discusses various methods for creating and managing processes. Different
    techniques for process creation are discussed. Common traps and pitfalls are also
    described.


    # Win32 Processes


    Whenever a user double-clicks a program or runs an application (such as Perl)
    from a command line, she is instructing Win32 to create a new process. Normally,
    users don''t think twice about this procedure; they simply run Excel, Photoshop,
    or may be a new session of Quake. Regardless of what program is started, Win32
    allocates a block of memory, loads the program and any library files it requires
    into this block of memory, and then creates a primary thread to execute the loaded
    code. After all this is done and the program is running, it is referred to as
    a process. A process can access any of the memory that it has been given by the
    operating system, but only that memory. You can think of each process as having
    its own little sandbox in which it can do what it likes but cannot step out of.
    This is known as a *process space*. If you prevent a process from accessing resources
    outside its process space, you can maintain system security.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'Many words represent processes. Daemons, services, applications, and programs
    are just a few that simply refer to processes. Each may have different processes
    for running, but they all share the same physical manifestations in the computer:
    They are processes.


    Several processes typically run at the same time. Normally, one running enables
    you to share printers and directories (the server service); another enables you
    to connect to other machines (the workstation service); one manages logon security
    (the winlog service); and some, like the TCP echo service, do simple things. As
    administrator, you can add additional services or processes, such as email services
    or word processing applications.


    Such process creation isn''t new; it''s been around since computers have been
    able to dynamically load program code into memory. However, Win32 departs from
    the traditional paradigm that UNIX codes have to depend on. Capabilities such
    as splitting a running program into two identical copies of itself (forking) have
    long been a staple of UNIX daemon coding. However, this particularly useful functionality
    has not been implemented into the Win32 family of operating systems—much to the
    mortification of programmers port over UNIX.


    The good news is that Microsoft opted out forking for a more efficient approach:
    threading. Just UNIX or Win32 can multitask many applications at once, so can
    an application multithread subtasks within an application. Multithreading is efficient
    because all the threads live within the same process, so they all share the same
    memory and security attributes. This means costly interprocess communication calls
    (IPC) such as shared memory, pipes, and sockets are not necessary.


    Contr to the forking method, the threads can access each other''s data structures
    directly. A forked process results in two processes with identical copies of memory.
    Because both processes are running in different memory spaces, there is no inherent
    way for one process to access the memory of the other process. IPC can be used
    to access the other process, but that takes both processes working in concert
    to make such access possible.


    So, Win32 has its threading model, and has its forking model. Win32''s model,
    however, is not too unique because UNIX has variations of threads for years. What
    is unique, however, is the lack of a forking mechanism, which is where this story
    on processes begins.


    Following in the fine tradition of UNIX coding, Perl hacks have used forking in
    their scripts for many reasons. Even though Perl is a crossplatform language,
    any script that was based on forking broke when run on a Win32 machine. There
    are no exceptions to this rule because Win32 itself does not support forking.'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'Masses of Perl coders were forced to rewrite their scripts, moving from forking
    to threading. They began the process with good intentions and high hopes, only
    to fall victim to the cruelest of jokes—Win32 did not have thread support for
    Perl. Oh, the humanity!


    Okay, so coders could neither fork nor thread. This was quickly becoming a situation
    in which Java or Visual Basic was looking more and more attractive. Then Perl
    5.005 was released, hinting at the promise of Win32 threading. It was still experimental,
    but it looked like this release could be the panacea everyone had been seeking.


    Then Perl 5.6 was introduced and brought with it not only threading (still experimental)
    but forking as well. This forking (at least on Win32 platforms) was emulated.
    This meant that Perl made it look as though the process had been forked, even
    though it had not. Perl would create a copy of the Perl interpreter object and
    give it its own thread to run on.


    This emulated forking works for the most part, but other issues can easily crop
    up. For example, if a Perl extension is not designed to be multithreadsafe, running
    a script in a new thread (as fork emulation) may lead to inaccurate results because
    one thread may overwrite global variables and data structures by another thread.


    Even with these new threading and forking capabilities, Win32 still can create
    (or spawn) new processes. Even though spawning processes can be slower, more cumbersome,
    and rife with limitations, a bit of creative thinking can allow clever coders
    to achieve the results they desire.


    # Creating Processes


    You can find a good reference on creating processes using Win32 Perl in my book
    Win32 Perl Programming: The Standard Extensions (New Riders Publishing). It covers
    the methods for spawning new processes and explains the flags and other parameters
    that the process-creation functions accept. However, this chapter covers the most
    common process-creation methods from piping, the system command, spawning, Win32::Process
    and Win32::AdminMisc, and forking.


    The first, and easiest, to create a new process is to use backticks.


    # Backticks


    Using backticks is probably one of the quickest and least complicated ways to
    spawn new processes. When you simplify a command line between backticks, the command
    is executed by Win32, and each line of output the new process sends to STDOUT
    is captured and returned as an element in an array. This is exactly what Example
    7.1 does.'
