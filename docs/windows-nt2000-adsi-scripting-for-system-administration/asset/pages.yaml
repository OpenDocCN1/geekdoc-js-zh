  md: '# Monitoring Internal Processes


    Say that you have a Web server that runs a series of CGI scripts. CGI scripts
    must shell out to separate processes from time to time. These processes could
    be anything from NBSTAT.EXE (to display NetBEUI statistics) to NETSTAT.EXE (to
    display network connections). Requests to the Web server increase, the server,
    of course, slows down. The impact on performance can cause scripts to run events
    more slowly, taking longer for a process to finish. As this occurs, more Web requests
    may come in, creating new CGI scripts and processes and further compounding the
    problem.


    Many Web servers can specify a script timeout value. If a script does not finish
    in the specified amount of time, the Web server terminates it. This, however,
    does not allow you to discriminate between one script that requires a long time
    to run and another process that should not take a long time at all. A workable
    solution would be to design a service that terminates only selected processes
    after a specified duration.


    Such a solution could also be used for other reasons, such as preventing a user
    from running programs longer than an allotted time. This could be for the sake
    of billing a customer in an Internet cafe or guaranteeing that a process does
    not operate a deadlock condition.


    Example 5.2 monitors all and terminates any that have been alive for longer time.
    In this particular script, only two processes are monitored: Telnet and FTP. These
    processes, and their timeout values, are configured in lines 17 through 20. The
    Telnet process is allowed to run for no more than 120 seconds. The FTP program
    is granted 0 seconds of runtime. This is effectively the same as saying that the
    FTP process is prevented from running (actually, the process can run, but it is
    terminated almost instantly).


    Most of the code is based on the typical Win32::Daemon framework (refer to Chapter
    8). The real engine is on line 89 and lines 132 through 156. Line 89 procures
    a WMI object that is used for the duration of the service (refer to Chapter 9,
    “ADSI and WMI,” for more details on WMI). Lines 132 through 156 use the WMI object
    to walk through each process (via the collection of Win32_Process WMI objects),
    checking for a monitored process. If the process is monitored, the number of seconds
    it has been running is calculated and is compared to the permitted time threshold
    for the particular process. If the running time equals or exceeds the allotted
    time, the process is terminated.


    This script uses WMI to walk through the list of all processes on a machine. The
    process list can be procured from any machine on a network, thus enabling the
    script to monitor processes on remote machines. Lines 52 and 53 create the WMI
    moniker. Notice that the $Config{machine} hash key'
