- img_proc: true
  md: 'This means that if a service is configured to run as the Local System, it cannot
    access shared resources over the network. It can open files locally but cannot
    open them as a UNC or over a network-mapped drive. Access to mapped drives will
    fail even if the drive is mapped by an administrator with full access before the
    service attempts to access it.


    The two exceptions to this situation are using sockets and acting as the server
    end of a named pipe. A service running under the Local System account can open,
    close, and access data through TCP sockets—presumably because there is no inheritance
    security with network connections. Likewise, a Local System service can create
    server-side named pipes.


    Creating a named pipe does not involve accessing resources over the network; it
    is simply creating a file that the system shares with other processes and machines.
    Such a service, however, cannot create the client end of a named pipe that connects
    across the network.


    Any account that will be used to run a service must be granted the Logon privilege.
    There is no exception to this rule.


    # CASE STUDY


    # Creating a Reminder Service


    Jamie has discovered that her Outlook email program has become quite an indispensable
    tool. Every day she comes to work and checks Outlook to see what meetings she
    has for the day. Often her schedule is loaded with meetings that take her away
    from her real job of administering her network. Her peers always seem to be requesting
    requests while she is away at another meeting. Her computer receives requests
    while she is away at another meeting. She has found that this is a trick that
    many of her coworkers have used to avoid confronting her directly. After all,
    if she is busy in a meeting across town, it would be nearly impossible for her
    to know that she has just been invited to another meeting.


    One day Jamie decided to sit down and write a Perl script that would check her
    schedule for her. Because she does not always have access to email, she wanted
    the script to send her a page whenever a reminder occurs. Because she cannot always
    guarantee that she will be at her computer in the morning to log on and start
    up the Perl script, she wrote it as a Win32 service. She also knows that some-times
    she might need to pause and stop the service, so she wrote it using Win32::Daemon.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Issues with Perl-Based Services


    She decided to use COM and directly talk with her Outlook email program. However,
    after some experimentation, Jamie discovered that Outlook can be run in one process
    at a time. This meant that either the service can run and integrate with Outlook,
    or she can log on and run Outlook, but not both at the same time. This solution
    was quite unacceptable, so she turned to Collaboration Data Objects (CDO).


    CDO is a COM-based API that allows a program or script to interact with collaboration
    services such as Outlook and Microsoft Exchange. Outlook comes with COM version
    1.21, which solved Jamie''s problems. Using COM, Jamie can bypass Outlook altogether
    and talk directly to her Exchange server, where her schedule resides. It became
    clear to her that this was the ideal approach.


    Example 8.14, shown later in the section “Using the Service,” shows the code that
    she used.


    # Obtaining CDO


    Jamie poked around in the Registry to see whether she already had CDO installed,
    and to much to her surprise, However, her version was CDONTS, which comes with
    Windows 2000 and provides SMTP and NNTP support. This version does not talk with
    an Exchange server she needed. Therefore, she ran the Microsoft Office setup program
    and selected the CDO components to install the correct version for her.


    # Installing and Removing the Service


    To make installation and removal simple, Jamie wrote her script to accept installation
    and removal switches. This way, she never needs to rely on separate partitions
    to install or remove the script as a service. She can install the script by calling


    ```

    perl reminder.pl -install

    ```


    Likewise, she can remove the script by calling


    ```

    perl reminder.pl -remove

    ```


    When installing, she can specify an account and password to run under. For example,
    this command installs the script to run under Jamie''s account in debug mode (which
    logs much more information than it normally would);


    ```

    perl reminder.pl -install -account ''MyDomain\Jamie''

    -password ''MyPassword'' -debug

    ```


    continues ▶'
