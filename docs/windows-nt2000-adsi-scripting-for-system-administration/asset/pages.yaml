    # Using ADSI


    When a Perl script uses ADSI, it must load the Win32::OLE extension. When the
    script requests an ADSI COM object by calling the extension''s getObject function().
    If the request is valid, the resulting ADSI COM object represents the namespace
    from the specified ADSI provider. Following is an example of such request:


    ```

    $ADsiObject = Win32::OLE->GetObject( "WinNT://MyDomain" );

    ```


    Notice that the ADsPath ("WinNT://MyDomain") in this case represents the WinNT;
    it could have just as well been another provider such as LDAP or IIS.


    For the sake of simplicity, the ADSI examples in this chapter use the WinNT: and
    IIS: providers.


    # Discovering the ADSI providers


    One of the easiest tasks that ADSI can perform is to enumerate the different ADSI
    providers installed on a local machine. Example 9.1 demonstrates this capability
    by binding to the ADs: namespace and then enumerating each provider.


    # Example 9.1 Displaying the ADSI Providers


    ```

    01. use Win32::OLE qw( in );

    02.

    03. $ADsPath = "ADs";

    04. if ($SDS = Win32::OLE->GetObject( $ADsPath ))

    05. {

    06. my $iCount = 0;

    07. print "This machine has the following ADSI providers installed:\n";n08. foreach
    my $Provider ( in ($SDS ) )

    09. {

    10. print ++$iCount . \ ") $Provider->{Name}\n";n11. }

    12. }

    ```


