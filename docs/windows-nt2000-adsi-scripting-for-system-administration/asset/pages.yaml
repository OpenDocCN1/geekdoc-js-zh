    is referenced on line 53. This is where another machine name can be specified.
    By default, this value equates to the period (") character, indicating that the
    local machine is to be monitored. You can specify a remote machine by passing
    in the -m Machine_Name parameter when installing the service.


    The script can monitor remote machines just well as a local machine. This is done
    by passing in the -m switch followed by a machine name when installing the service.
    When the service is installed to monitor remote machines, it must be configured
    to log on as a user account (and not the default Local System account). This is
    required because the Local System account has administrative rights, but only
    on the local machine. Therefore, the service must log on using an account that
    has administrative privileges on the remote machine. For example,


    ```

    perl procmon.pl -install -m Server -u MonitorDaemon -p AdminPassword

    ```


    assumes that the MonitorDaemon account has privileges on the machine \Server.

    If you are installing to run on a local machine, there is no need to specify an
    account name and password. Notice that in lines 264 and 265, the specified username
    and password are assigned to the service configuration hash. If no user account
    and password are specified, these will be empty, Win32::Daemon interprets as the
    Local System account.


    WMI must be installed on both the machine running the service and the machine
    that is being monitored. Windows 2000 comes with WMI installed, but NT 4.0 and
    Windows 95/98 have WMI installed. The technology can be downloaded from Microsoft''s
    Web site. See Chapter 9 for more details on WMI.


