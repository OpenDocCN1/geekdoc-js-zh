  md: '# Table 8.4 Service Start Options


    | Option | Description |

    | --- | --- |

    | SERVICE_AUTO_START | Specifies that the service will be started automatically
    by the Service Control Manager during startup. |

    | SERVICE_DEMAND_START | Specifies that the service will start when it is explicitly
    told to do so. Either an application starts the service (such as with the net
    start command), or an administrator starts it from the Service Manager. |

    | SERVICE_DISABLED | Specifies that the service cannot be started. To start the
    service, you must change its start option to one of the other two options: SERVICE_AUTO_START
    or SERVICE_DEMAND_START. |


    # Table 8.5 Service Error Control Options


    | Option | Description |

    | --- | --- |

    | SERVICE_ERROR_IGNORE | An error is recorded in the Win32 Event Log, but the
    service continues to start. |

    | SERVICE_ERROR_NORMAL | An error is recorded in the Win32 Event Log, and a message
    box is displayed on the screen, but the service continues to start. |

    | SERVICE_ERROR_SEVERE | An error is recorded in the Win32 Event Log and if the
    last-known good configuration is being started, the startup operation continues.
    Otherwise, the system is restarted with the last-known good configuration. |

    | SERVICE_ERROR_CRITICAL | An error is recorded in the Win32 Event Log and if
    the last-known good configuration is being started, the startup operation fails.
    Otherwise, the system is restarted with the last-known good configuration. |


    Previously in Example 8.4, the name key is the name of the service. The Service
    Manager uses this name to refer to the service. When you''re controlling the service
    using the Win32::Service extension''s functions (such as StartService()), you
    use this name to identify the service. For example, Microsoft''s Web Server''s
    name is w3svc.


    The display key is the service''s display name. It is what you would see in the
    Controls panel applet. This value is simply a nicely formatted name that is easier
    for humans to read than the service name—for example, World Wide Web Publishing
    Service.


    The path key is the *full path* to the service executable file. It *must* be a
    full path, and it must be an executable program. If you are using a Perl script
    as your service, this key is the full path to the PERL.EXE program, such as `c:\perl\bin\perl.exe`.'
