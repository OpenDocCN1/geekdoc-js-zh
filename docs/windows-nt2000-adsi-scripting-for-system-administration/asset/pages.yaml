  md: '# The Win32::Daemon Framework


    The service control loop begins after the service is officially started. To officially
    start the service, the script calls the Win32::Daemon::StartService() function.
    If the function is successful, the service control loop begins. The loop continues
    until the service enters the SERVICE_STOPPED state. At that point, the script
    stops the service control loop and calls the Win32::Daemon::StopService() function
    to instruct the Service Manager to stop interacting with the script. This step
    is the prelude to ending the service. Example 8.7 shows a very simple skeleton
    for a Win32 service script. If this code is installed as a service, it works but
    does not accomplish anything.


    # Example 8.7 A Minimal Win32 Service Script


    ```

    01. use Win32::Daemon;

    02. Win32::Daemon::StartService();

    03. while (SERVICE_STOPPED != ($State = Win32::Daemon::State))

    04. {

    05.   if (SERVICE_START_PENDING == $State)

    06.   {

    07.     # Add initialization code here

    08.     Win32::Daemon::State(SERVICE_RUNNING);

    09.   }

    10. elseif (SERVICE_PAUSE_PENDING == $State)

    11.   {

    12.     # Add pausing code here

    13.     Win32::Daemon::State(SERVICE_PAUSED);

    14.   }

    15. elseif (SERVICE_CONTINUE_PENDING == $State)

    16.   {

    17.     # Add resuming code here

    18.     Win32::Daemon::State(SERVICE_RUNNING);

    19.   }

    20. elseif (SERVICE_STOP_PENDING == $State)

    21.   {

    22.     # Add stopping code here

    23.     Win32::Daemon::State(SERVICE_STOPPED);

    24.   }

    25. elseif (SERVICE_RUNNING == $State)

    26.   {

    27.     # This is the core functionality of the service

    28.     # Add code here to perform whatever work the

    29.     # service must accomplish. Avoid any code that

    30.     # blocks for long durations of time

    31.   }

    32.   sleep( 5);

    33. }

    34. Win32::Daemon::StopService();

    ```'
