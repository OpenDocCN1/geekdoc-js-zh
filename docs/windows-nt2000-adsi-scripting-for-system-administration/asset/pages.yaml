  md: 'Such an infrastructure would be ideal if it were not for having to modify each
    user''s account to point to the correct script. An administrator''s logon script
    may be


    ```

    scripts\administrators.pl

    ```


    and an accountant''s logon script may be


    ```

    scripts\accountants.pl

    ```


    However, this solution breaks down if the organization has accountant administrators—that
    is, members of both the Administrators and Accountants groups. Likewise, this
    solution does not scale well as the number of users increases. Constantly making
    modifications every time someone moves from one position to another in the organization
    becomes unmanageable.


    A more effective method to manage such scalability issues is to use the same logon
    script for all users—a sort of unified logon script.


    # Unified Logon Scripts


    An efficient method to manage user logon scripts is to use a logon script. Such
    a script enables to configure every user to use the same logon script. When you
    create a new user account, you simply configure it to execute the same logon script
    as all the other users. This efficient technique allows the logon script itself
    to implement the logic to figure out what it should do for the user during the
    logon sequence.


    Unified logon scripts can be beneficial because they are shared by all users.
    Consider such a script that collects the current date, IP address, computer name,
    and username and then submits that information to a centralized database. This
    information provides you with quick access to efficiently find what machine a
    user is on. In a large environment, this information can be advantageous for pinpointing
    the location of a particular user at a particular time. This is especially true
    if a user may have logged on to multiple machines, making it difficult to find
    him based on his network-registered username (because network-based usernames
    are unique and can be registered on only one machine at a time).


    # Processing User Groups


    As you learned earlier in the section “Effectively Processing Logon Scripts,”
    breaking out logon scripts based on user group membership can greatly enhance
    effectiveness of the logon scripts. The problem is that if a network implements
    a unified logon script, you cannot easily decide which groups a given user belongs
    to. If the unified logon script could discover which groups the user belongs to,
    it could execute each related group script.'
