  md: '# 2 Account Maintenance


    At the heart of a Win32 network are the accounts. For any process to start, an
    account must be associated with it. Even automatic processes, such as services,
    are started by some logged-on user. In some cases, this user is a normal user;
    in others, it may be a special user whose account has been granted specialized
    privileges.



    Most users are familiar with accounts because they have to use them to log on
    to a machine. As administrator, however, you know that several types of accounts
    are available: user, group, machine, and domain trust accounts. You have to know
    these various types of accounts because you have the burden of managing them.



    # Creating Accounts


    You can easily create an account by using the GUI-based User Manager or Microsoft
    Management Console (MMC) snap-in. Basically, you point and click, fill in some
    information, and then click OK. This task is pretty simple. However, when you''re
    in a rush or you need to work on multiple accounts, doing it programmatically
    can often be easier. For example, creating 30 accounts by hand can be quite tedious,
    but when you use a script, it''s a snap.



    Using GUI applications requires more effort than simply creating the account.
    After you create the account, you still need to add the new user to various groups.
    Having done that, you need to create the user''s home directory as well as apply
    any security permissions to the directory tree. On the bright side, when a script
    is set up to do those things, as you''ll see in Example 2.1, it''s no longer a
    burden.



    Unfortunately, writing scripts that create accounts programmatically is more burdensome
    than using a GUI because a script has to deal with some aspects of an account
    that someone using a GUI never sees. For example, a script needs to know if the
    account is a user, machine, or domain trust account; GUI applications typically
    assume you are referring to a user account.'
