    # Using Perl over a Network


    Ideally, an administrator would install Perl on each machine in a network. By
    doing so, he can guarantee that each computer can run Perl for logon scripts,
    services, and scheduled batch jobs, or by user scripts.


    Having Perl on each desktop can be remarkably empowering. However, not all machines
    can handle it. Even though drive space is becoming less and less expensive, many
    shops have older equipment and no budget to upgrade. This can place a couple of
    megabytes of drive space at a premium.


    One rather simple way around this problem is to copy Perl onto a file server and
    share its directory. This solution is pretty simple. When someone wants to call
    a Perl script, he can simply access the shared Perl directory on the file server.
    This solution, has its own issues to consider.


    As mentioned earlier in this chapter, you can add Perl’s bin directory to the
    path. Doing so is an absolute must, in my opinion. However, if you are accessing
    Perl remotely on a file server’s shared directory, what do you put in the path?
    There are two answers to this question.


    First, you can map a drive letter to the shared directory. After you do, so requires
    that you can reliably map the bin directory to the mapped drive. a specific drive
    to the share. As silly as it may seem, some applications there still require you
    to use a specific drive letter. So, depending on your organization’s needs, you
    might have to think about which drive is available. Another issue to contend with
    is a user accidentally deleting the mapped drive. When this is done, Perl won’t
    run, and chances are the user won’t tell you this has happened.


    The second and more desirable approach is to refer to Perl’s bin directory as
    a universal naming convention (UNC). This means adding the UNC to the path. Here
    is a little trick: when you add the UNC to the path, make sure to add it at the
    end. For example, if your path is


    ```

    C:\winnt;c:\winnt\system32

    ```


    you should add the Perl UNC to the end of the path like this:


    ```

    C:\winnt;c:\winnt\system32\server\perlshare\bin

    ```'
