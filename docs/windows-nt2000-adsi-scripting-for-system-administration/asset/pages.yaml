  md: '# About the Author


    Dave Roth is the contributor of various popular Win32 Perl extensions, including
    Win32::ODBC, Win32::Misc, Win32::Daemon, and Win32::Perms. He has been providing
    solutions to the Perl community for difficult-to-solve problems since 1994. Dave
    has been a speaker at the O''Reilly Perl Conferences as well as the USENIX LISA-NT
    conferences. He has also contributed to the Perl Journal and is the author of
    Win32 Perl Programming: The Standard Extensions (New Riders Publishing, 2999).


    Dave has been programming since 1981 in various languages, from assembler to C++,
    LPC, and Perl. His code is used by organizations such as Microsoft, the U.S Department
    of Defense, Disney, Lucus Films, Digital Paper, Hewlett-Packard, Metagenix, Radcom,
    the state of Michigan, and various colleges and universities, among many others.
    Dave helped assemble and administer a statewide WAN for the state of Michigan
    and has designed and administered LANs for Michigan State University and Ameritech.'
  merge: -1
