    for technical content, organization, and flow. Their feedback was critical to
    ensuring Win32 Perl Scripting: The Administrator’s Handbook fits our reader’s
    need for the highest quality technical information.


    Joseph Casadonte (joc@netaxs.com) is the lead software architect for Global Logistics
    Technologies, with 15 years professional programming experience in C, C++, Java,
    Perl, and most recently, Lisp. In his spare time he enjoys creating large programs
    (usually in Perl) to automate frivolous tasks, as cataloging his Grateful Dead
    CD collection. He has recently taken to writing List to customize his new favorite
    editor, Emacs. His Perl Win32 page is at http://www.netaxs.com/~joc/perlwin32.html,
    where you can link to his CD collection and Emacs pages.


    Jutta M. Klebe is an Engineer and a Microsoft Certified Professional (MCP) with
    15 years of programming and operating system experience. After finishing the polytechnic
    as a mechanical engineer (Dipl.-Ing. in Germany), she has worked since 1990 as
