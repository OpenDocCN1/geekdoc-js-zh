    # Services Using Win32::Daemon


    The Win32::Daemon extension provides a Perl script with all the functionality

    it needs to run as a Win32 service. It enables a script to respond to

    service control requests as a real service would and enables you to control

    the process as you expect from any Win32 service.


    Because a Win32::Daemon-based script does interact with the Service

    Manager, it is naturally more complicated than a simple script that is

    launched by SRVANY.EXE. Exactly how complicated such a script must be

    a matter of what it needs to do. The simplest form of a Win32::Daemon

    script can be quite simple, as long as a basic framework is used.


    # The Control Loop


    All Win32::Daemon scripts must occasionally poll the current service control

    state. This state may change from time to time, depending on what the

    Service Manager requires. For example, if the administrator decides to

    pause the Perl-based service, the script would poll the service control state

    d discover that it is entering the paused state. It performs whatever task it

    must pause itself and then reports to the Service Manager that the service

    has officially paused it. Even while the service is in the paused state,

    however, it must continue to poll the current service control state in case

    request is made to resume or stop the service.


    Polling is typically performed in the service control loop. This loop

    calls the Win32::Daemon::State() function to query the current state.

    The loop must have code to handle the pending states listed in Table 8.7.


    Table 8.8 shows optional control states that a service script does not need

    to process. Most services should process all states (from both tables).

    The control states must be responded to in a timely manner; otherwise,

    the Service Manager assumes the service has crashed or is in some'
