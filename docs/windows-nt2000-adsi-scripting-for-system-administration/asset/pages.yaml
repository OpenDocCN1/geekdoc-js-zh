  md: '# Backing Up and Restoring Network Shares


    For file servers, it is not uncommon to have many shared directories. Some may
    be public for everyone to access, and others may be secured so that only certain
    users are granted particular permissions. Likewise, some shares may be hidden
    from browsing, whereas others are visible to all.


    Having many shared directories can be quite unwieldy to manage. Ask any administrator
    who has had to reinstall an operating system on a file server. However, this does
    not have to be so difficult. As a matter of fact, it can be quite easy to manage
    with the proper tools.


    Example 4.1 provides a simple script that connects to a machine and attempts to
    discover its various shared directory configurations. This approach to backing
    up shared directories is ideal because it generates configuration in a simple
    text-based format. This format makes it easy for you to modify the configuration
    using a text editor.


