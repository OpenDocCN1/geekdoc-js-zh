  md: '# NTFS Streams


    One of the greatest joys of using the NTFS file system is the ability to create
    multiple streams in a file. However, most administrators, let alone users, are
    not even aware of this capability.


    Just like any file system, in this one the data contains data. However, unlike
    other file systems, each data is stored in what is called an NTFS stream. This
    stream is simple data that is associated with the file by means of a name. This
    is very very similar to the way a Perl hash works. A stream name is much like
    a hash key, just as data can be associated with a file stream name. By default,
    NTFS files have only one stream, the default stream, which is the place data is
    stored. However, NTFS allows additional streams to be created in a file. Because
    each stream has a name (with the exception of the default stream), you access
    the stream by name.


    Thinking of multiple data segments for a single file may be mind-bending—but only
    because it is not common. Think of multiple streams as a tar file, you could create
    one file with multiple streams, each stream consisting of data from different
    files. This would enable you to create a log file for, say, a Web server that
    consists of only one file. But each day the Web server creates a new log, it creates
    a new stream in the log file. The end result is that you could have an entire
    year''s worth of Web log entries consolidated into one convenient this. Then you
    can easily copy all the logged data from one place to another this way because
    you are copying only one file.


    A Windows NT/2000 machine can store Macintosh files on its NTFS drives. By using
    alternate data streams, the operating system can store both the Macintosh data
    and resource forks in one file.


    To access an NTFS stream you must refer to the NTFS file as you normally would,
    but you use a colon followed by the stream name. The format is


    ```

    pathfile_name:stream_name

    ```


    Here''s an example:


    C:\temp\MyTestFile.txt:MyFirstStream


    Perl can read and write to such NTFS streams using the normal file functions.
    You can test this capability by running Example 3.5 and Example 3.6 on an NTFS
    drive. Example 3.5 creates a text file with two streams: the main data stream
    and an alternative stream.'
