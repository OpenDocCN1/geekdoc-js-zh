    # Discovering File Versions


    Many binary files, such as programs and DLLs, can have version information branded
    into them. Such branding is not required but is incredibly helpful. When you install
    software that has updated binary files, it usually checks the version information
    on files to make sure it is not overwriting a file with an older version.'
