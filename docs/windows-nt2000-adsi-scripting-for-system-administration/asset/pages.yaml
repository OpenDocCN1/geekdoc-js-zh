  md: '# Discovering Open Files


    Each machine shares files and directories maintains a list of what is currently
    in use by each user. When you need to track which resources a particular user
    has opened, this list can be more than invaluable. Example 4.7 connects to a specified
    machine (the local machine if one is not specified) and procures the list of opened
    resources.


    You can easily imagine how useful this particular script can be. Consider that
    you are tracking files a user has opened. If someone has breached network security
    by logging in as some user, you can quickly discover which files that person has
    opened on which file servers. Figure 4.1 demonstrates this particular.


    ```

    C:\perl openfiles -m * -m dev -u Joel

    ```


    ```

    Open files on \DATA:

    ID Locks User Path

    9959 @ Joel             \PIPE\spoolss

    31339 @ Joel             \PIPE\winreg

    35419 @ Joel             e:\CDROM\WSDN Disk 2.cdi

    36506 @ Joel             e:\Data\rothold\template\mcpglobal.dot

    36784 @ Joel             e:\Data\rothold\document ... andbook\WRL0002.4.doc

    36793 @ Joel             e:\Data\rothold\document ... ndbook\Chapter 4.doc

    41968 @ Joel             \PIPE\srvsvc

    ```


    ```

    Open files on \PROXY:

    ID Locks User Path

    ```


    ```

    Open files on \dev:

    ID Locks User Path

    25 @ Joel             C:\temp

    26 @ Joel             \PIPE\srvsvc

    ```


    > Figure 4.1 Dumping the list of open files.


    This example shows that all domains (-m *) in addition to one other server (-m
    dev) are queried for any connections made by the user Joel (-u Joel). The result
    shows that the user has several open resources on the server (\DATA), including
    a connection to both the printer spool (\PIPE\spoolss) and the Registry (\PIPE\winreg).
    As an administrator, you should become suspicious at the Registry connection.'
