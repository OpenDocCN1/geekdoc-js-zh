    # Issues with Perl-Based Services


    Perl-based services are wonderful, but they are not without their own hazards.
    To be fair, it is not as much Perl-based services that can be problematic as is
    how Win32 services themselves work. This section discusses how to get around some
    Win32-related problems.'
