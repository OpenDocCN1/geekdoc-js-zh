    You can pass the name of the machine on your network as the only-parameter into
    the script, which causes the script to discover the configuration of all shared
    directories on that machine, provided that your script has administrative privileges
    on that machine. If no machine name is specified, the local machine is used.


    The script dumps the configuration to STDOUT, so if you want to save the configuration,
    you can redirect it to a file as follows:

    perl DumpShares.pl \server > server_shares.ini


    The output data appears in the standard Windows .INI file format. Because the
    file can be executed remotely, you could designate one machine on your network
    to run this script for each server you administer. Such a library of shared directory
    configuration files could be used to re-create a server''s shared directories
    if the need arises. The configuration files are text-based .INI files, you could
    modify the files, enabling them to modify directories by removing them and then
    re-creating them using the modified configuration script.


    To create shared directories from the configuration files, run the script in Example
    4.2 and pass in the name of the configuration file. To re-create the directories
    backed up in the previous example, you could use the following:

    perl MakeShares.pl server_shares.ini


