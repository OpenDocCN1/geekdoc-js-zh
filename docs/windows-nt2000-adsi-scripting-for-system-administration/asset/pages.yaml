- img_proc: true
  md: '# Example 7.13 A Simple WhoAml Script


    ```

    01. use Win32;

    02. print "\nIncurrently logged on as:\n";

    03. print "------------------------------------\n";

    04. print "Domain: ";

    05. print Win32::DomainName(), "\n";

    06. print "Computer: ";

    07. print Win32::NodeName(), "\n";

    08. print "User: ";

    09. print Win32::LogonName(), "\n";

    ```


    Windows 2000 comes with a utility called RunAs.exe, which performs much the same
    function as Example 7.14. The much more powerful Windows 2000 version can load
    the specified user''s profile, Registry hive, and environment. Adding the code
    to enable the same functionality for Example 7.14 would not take much work, however.
    Until everyone upgrades to Windows 2000, Example 7.14 provides a working substitute
    in Windows 3.5, 3.51, and 4.0.


    The magic script uses a combination of two Win32::AdminMisc functions: LogonAsUser()
    and CreateProcessAsUser(). The LogonAsUser() function is pretty simple: You pass
    in the domain, name, and password of the user you want to impersonate, along with
    a logon type flag. If the function is successful, the script continues under the
    impersonated user of the specified user. It continues until the script terminates
    or a call to Win32::AdminMisc::LogoffAsUser() is made. At this point, the CreateProcessAsUser()
    function comes in.


    Say you have a Perl script that successfully impersonates another user by using
    LogonUser(). Only that script can run as the impersonated user. Therefore, if
    you spawn another program (a DOS box, Microsoft Word, a Web browser, or whatever),
    it does not run as the impersonated user. The script would have to create the
    new process using CreateProcessAsUser() instead.


    The trick with using the Win32::AdminMisc::LogonAsUser() function (as in Example
    7.14) is that the logged-on user (the account running the script) must be granted
    the following privileges:


    +   * SetToPrivilege to act as part of the operating system

    * SeAssignPrimary to replace a process level

    * SeIncreaseQuota to increase quotas

    * SeChangeNotify to bypass traverse checking'
