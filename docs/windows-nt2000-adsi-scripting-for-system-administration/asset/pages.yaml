  md: '# Running Processes as Another User 229


    Because these privileges are local, a user must have these privileges on every
    computer that she intends to run scripts that call the LogonAsUser() function.
    In Chapter 2, "Account Maintenance," Example 2.9 contains a tool that enables
    an administrator to manage these privileges from the command line.


    > Note

    If user privileges are modified for a particular user, that user must log off
    and log again for new settings to take effect because of the way privileges are
    assigned at log time.

    When a user logs on, he is given a token that indicates certain attributes of
    his account, such as what groups he is a member of and what privileges he has
    been granted. After the user is logged on, the token does not change; therefore,
    he must log off and log on again so that his new token reflects the updated changes
    to his account.


    Additionally, the user account that is impersonated requires the correct login
    right. Typically, the LOGON2_LOGON_INTERACTIVE flag is used (it is the default
    if one is not specified). This particular account allows the user to log onto
    the machine using the keyboard (interactively). Other rights allow the account
    to log on as a batch job, a service, or through the network.


    > Note

    If the LOGON32_LOGON_INTERACTIVE flag is shifted during a call to Win32::AdminMisc:

    LogonAsUser(), an attempt to call Win32::AdminMisc::CreateProcessAsUser() may
    fail on versions of NT before 4.0 because a primary token cannot be generated
    through a network login. Windows NT 4.0 allows an impersonation token to be duplicated
    as a primary token. This simply means that you can avoid LOGON32_LOGON_NETWORK,
    do not use it.


    If the script is successful at impersonating a user through LogonAsUser(), a new
    process created using CreateProcessAsUser() inherits the user''s credentials.
    Therefore, even though the impersonated script terminates—or if the script explicitly
    stops impersonating with a call to Win32::AdminMisc:

    LogoffAsUser()—the new process continues impersonating.


