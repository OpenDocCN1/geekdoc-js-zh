  md: '# Modifying the User Environment 193


    In Windows, each application has access to an environment, which is a block of
    memory allocated for a process that contains such information as the list of environment
    variables and their values. Each running process can have its own unique copy
    of the environment. When a change to environmental variable takes place (such
    as a user uses the Control Panel to change a variable''s value), all running programs
    are notified, and they can choose to reload the updated values into their environment.
    Therefore, a running Windows program should see such changes depends on how the
    application was designed. (Whether Windows programs may not see these changes
    immediately.) Console applications, on the other hand, typically do not listen
    for such messages. Therefore, legacy DOS applications, Perl, the DOS window, and
    other console-based applications do not see these changes until the console environment
    is terminated and re-created. This means that a Perl script must be stopped, the
    console window it runs in closed, a new console window opened, and the Perl script
    run again before the variable change is seen.


    Console applications can update their environment when changes are detected, but
    most usually do not. Perl does not listen for environment changes. Changes to
    this environment are performed only by a Perl script using the %ENV hash.


