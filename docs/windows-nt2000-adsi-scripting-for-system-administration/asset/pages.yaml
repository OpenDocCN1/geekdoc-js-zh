  md: 'Example 4.3 retrieves user account information from either machine or

    a domain. It dumps all account information to STDOUT, so you can

    irect it into a file as follows:


    ```

    perl DumpAccounts.pl -d MyDomain > users.ini

    ```


    The script can accept a few different command-line switches that expand its

    capabilities. These switches are listed in Table 4.1.


    Table 4.1 Switch Options for Example 4.3

    | Option | Description |

    |---|---|

    |-m Machine | Identifies which specific machine performs the query. Use this option
    if you want to obtain a specific machine''s user accounts or if you want a specific
    machine (such as

    a DC) to generate the list. |

    |-d Domain | Specifies a domain you want the account list to come

    from. This option overrides the -m switch. The PDC for

    sspecified domain generates the account list. |

    |-p Prefix | Lists objects that begin with the Prefix string. Because some domains
    and machines have thousands

    of accounts, you might want to break them into more

    manageable sized groups. |

    |-t user | machine | Determines the type of account to list. By default, user

    accounts are listed. However, machine accounts for a

    specified domain can be listed instead.


    To generate a list of all user accounts on the machine \WESERVER and store

    the account configuration in a WEBSERVER.INI file, you can use the fol-

    lowing command:


    ```

    perl DumpAccounts.pl -m \WESERVER > webserver.ini

    ```


    # Backing Up Machine Accounts


    Every computer that participates in a domain has a machine account. It is

    almost identical to a user account except that it has a different flag set.

    Additionally, a machine account name must end with a dollar sign ($). To

    gerate a list of machine names in a domain, use this command:


    ```

    perl DumpAccounts.pl -d MyDomain -t machine > machines.ini

    ```


    # Restoring Accounts


    After you have successfully generated a list of accounts (machine or user),

    y can restore them by using the script in Example 4.4. This script reads

    the contents of a configuration file previously created (using Example 4.3)

    and re-creates its accounts. If the account already exists, it is not modified.'
