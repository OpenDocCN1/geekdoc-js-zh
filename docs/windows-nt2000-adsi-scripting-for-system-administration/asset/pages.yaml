- img_proc: true
  md: "Using this particular example, all you need to do is walk over to each machine\
    \ and log on with the special account. You do so 100 times, and you're finished.\
    \ Consider this to be a poor man's version of Microsoft's Systems Management Server\
    \ (SMS).\n\nThe dark side of autologon is that a username and password are added\
    \ into the Registry, and they can be discovered with relative ease. The information\
    \ is not encoded, so anyone with permission to view the Registry key can see both\
    \ the username and password. You can remedy this by applying permissions so that\
    \ only administrators and the System accounts have read access on the key and\
    \ can change permissions and take ownership. Example 3.1 turns on or off the autologon\
    \ feature, depending on what you pass into the script. The syntax is\n\n```\n\
    perl setlogon.pl [-m Machine] [-clear] [<Domain\\User | User> <Password>]\n```\n\
    \nThe switches are described in Table 3.4. If a username is specified, a password\
    \ must be specified as well. The user account's domain should be specified but\
    \ not need to be. However, a logon problem may occur if another user account in\
    \ the local machine's user database has the same name as one in the default domain.\n\
    \n# Table 3.4 Autologon Switches\n\n| Switch | Description |\n| -m Machine | This\
    \ switch specifies for which machine to configure autologon. If this switch is\
    \ not specified, the default is the local machine. |\n| clear | This switch clears\
    \ the autologon configuration. The username, domain, and password are cleared,\
    \ and autologon is turned off. |\n| User | The username of the account to log\
    \ on automatically. |\n| Domain | The domain of the account to log on automatically.\
    \ This switch is optional. |\n| Password | The password of the account to log\
    \ on automatically. |\n\n# Example 3.15 Setting the Autologon User Account\n\n\
    ```\n01. use Getopt::Long;\n02. use Win32::Registry;\n03.\n04. $PATH = \"Software\\\
    Microsoft\\Windows NT\\CurrentVersion\\Winlogon\";\n05. Configure (\\$Config);\n\
    06. if ($Config(help)) {\n07. \n08. Syntax();\n09. exit();\n```\n\ncontinues ▶"
