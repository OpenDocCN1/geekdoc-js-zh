    \ and perform a virus scan. Or, maybe the script could update a database with\
    \ details of the new file.\n\nA monitoring script can be implemented in many different\
    \ ways. It can be designed to run either as a standalone script or as a daemon.\
    \ Standalone scripts are run by an administrator only when she needs to begin\
