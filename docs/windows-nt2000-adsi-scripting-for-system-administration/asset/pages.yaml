    # Setting Autologon\n\nThere is a little-known ability to configure a Windows\
    \ NT/2000 machine to boots up, it automatically logs in as a specific user. You\
    \ can set this autologon by manipulating some settings in the Registry. Using\
    \ such a configuration is a terrifying way to configure a machine.\n\nSay that\
    \ you need to configure 100 brand new machines. You could create an administrator-like\
    \ account with a special logon script (covered in Chapter 6, \"Logon Scripts\\\
    \ The logon script would perform any functions that it needs to properly configure\
    \ the machine—creating proper directories, copying files from a master file server,\
    \ installing ODBC drivers and other software packages, and on. Often, many programs\
    \ need to reboot the computer before they can finish installing. Autologon handles\
    \ this task. Before the logon script finishes, it sets the necessary information\
    \ in the Registry and reboots the computer. The computer reboots and logs on automatically\
    \ using the specified user ID. User ID uses a logon script to run; the script\
    \ recognizes the state of the machine and finishes whatever it needs to do. The\
    \ final script removes the autologon settings and either logs off or reboots again."
