  md: 'Associate the .PL extension with Perl using the assoc command:

    assoc .pl=PerlFile


    2. Register the PerlFile file type with the Perl binary by using the ftype command:

    ftype PerlFile=c:\perl\bin\perl.exe "%1" %*


    Note that the %1 is surrounded by double quotes. This is important, especially
    if you expect to reference a Perl script that has embedded spaces in its filename.


    3. Add the .PL extension to the list of executable extensions. Windows 2000 uses
    an environment variable called PATHEXT, which is a list of file extensions that
    are considered executable. An example could look like this:


    PATHEXT=.COM;.EXE;.BAT;.CMD;.VBE;.JS;.JSE;.WSF;.WSH


    Simply add the .PL extension to this list:


    PATHEXT=.PL;.COM;.EXE;.BAT;.CMD;.VBE;.JS;.JSE;.WSF;.WSH


    4. (Optional) Place Perl''s directory in the path.


    After you complete these steps, you can run a Perl script by using only its filename:

    mcript.pl


    This will result in Perl executing the script.

    If the script ends with a .PL (or whatever extension you specified in the assoc
    command), and you are running on a Windows 2000 machine with the extension added
    to the PATHEXT variable, you can call a script by using only its name, without
    an extension:


    myscript


    You can pass parameters into the script as well. However, if you need to pass
    in some flag, such as -d or -w, you need to perform the optional fourth step and
    modify the system path. You can then either reference the entire command line,
    including perl.exe, as in

    perl -d c:\temp\myscript.pl


    or, alternatively, add the flags to the "sha-bang" line in the beginning of the
    script, as in Example 1.1.'
