    # Creating Remote Processes


    Example 9.16 creates a process on a remote machine. You just pass in parameters
    that you would normally use on the the command line. For example, if you want
    to run the NOTEPAD.EXE program loading in a particular file, you can call the
    script like this


    ```

    perl WMI_Run.pl notepad.exe c:\temp\MyFile.txt

    ```


    This command starts the Notepad program loading in the specified file. If you
    want to run a program on a remote machine, simply pass in the remote machine name
    as the first parameter. The following uses the same example:


    ```

    perl WMI_Run.pl \server notepad.exe c:\temp\MyFile.txt

    ```


    This command runs the Notepad program on the machine \Server. Note that the file
    loaded is relative to the remote machine. Therefore, c:\temp\MyFile.txt refers
    to the C:\ drive on the remote machine. Both the local and the remote machine
    must have WMI installed for this script to work.


    # Example 9.16 Creating Remote Processes


    ```

    01. use Win32::OLE qw( in );

    02. use Win32::OLE::Variant;

    03.

    04. $Machine = unless $Machine = shift @ARGV;

    05. $Machine =~ s#(\[\])?# if ($ARGV[0] =~ m#(\[\]){2}#);

    06.

    07. # This is the WMI moniker that will connect to a machine''s

    08. # $CIM (Common Information Model) repository

    09. $CLASS = "WinMgmts:impersonationLevel=impersonate!/\\$Machine";n10.

    11. # Get the WMI (Microsoft''s implementation of WBEM) interface

    12. $WMI = Win32::OLE->GetObject($CLASS )

    ```'
