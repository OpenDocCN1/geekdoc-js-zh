    group-based logon scripts. This way, she could manage large groups of users by
    simply changing their NT memberships.


    Her network had many subnets, some of which were located across slow frame relay
    links. Therefore, she decided that it would be best to replicate all logon scripts
    across the DCs on each subnet. She set up the controllers that she replicated
    from the PDC at a regular interval. As a result, updating scripts was as easy
    as changing them in only one location. In the netlogon share, she created a subdirectory
    where she placed all the group-based scripts.


    She wrote a script for most of her domain''s groups, such as Accounting.pl, Marketing.pl,
    Developers.pl, and, of course, Administrators.pl.


    She also created a subdirectory Users. In this directory, she could place logon
    scripts for every user who required one. For certain network administrators and
    upper management users who had specialized needs required their own logon script,
    the Users directory contained Perl scripts after the specific user account it
    belonged to. The unified logon script made of the infrastructure illustrated in
    Example 6.9.


    Lines 9 through 14 create a crash that contains logon-related information. Notice
    that the domain controller key (dc) has been assigned the undef value. This is
    done because NetAdmin::GetAnyDomainController() function (lines 24 and 25) requires
    that something is assigned to the variable before it is passed into the function.


    Line 28 fetches all of the DCs. The script then walks through this list, one machine
    at a time, looking for the particular shared directory. For each machine that
    is sharing the logon scripts, a ping test is performed to find the closest server
    (lines 36 through 42). This process may not be as effective on larger networks
    that have many DCs and subnets because it might take to ping all machines. It
    also increases network traffic.). Line 46 sets the user environment variable with
    the server name so that scripts that run later during the logon session can discover
    what machine was used to run the logon scripts.


    At this point, an attempt is made to connect to an ODBC database (line 50). This
