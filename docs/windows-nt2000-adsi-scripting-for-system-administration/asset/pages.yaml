    # Permissions security is, in part, based on permissions. Permissions, which are
    placed on securable objects (such as files, directories, Registry keys, and network
    shares), designate which users have access to perform actions. The topic of permissions
    is quite involved and can easily take an entire book by itself, so I won''t go
    into detail on how they work. For this type of information, you can consult any
    number of resources, including http://www.roth.net/perl/perms/security/.


    # Displaying Permissions


    UNIX machines have always been capable of listing who has permissions on files
    and directories. You get this listing by using the ls command. Win32’s equivalent
    to ls is dir, but it does not display any permission information.

    Example 3.10 displays permission information on any path passed in the command
    line. This script accepts a number of parameters representing paths to securable
    objects, as in this example:

    perl perm.pl c:\*.txt \server\HKLM\Software\ActiveState\server2\Temp$


    This example displays the permissions for all text files in the c: direct directory
    as well as the HKEY_LOCAL_MACHINE\Software\ActiveState Registry key on the machine
    \server and the Temp share on \server2.

    Example 3.10 displays the permissions in the form of an array of letters. Each
    letter indicates the type of permission that the specified user has been granted.
    Table 3.2 describes these letters.


    # Table 3.2 Permissions by Letter


    | Letter | Permission |

    | R | User is allowed to open the object for reading. |

    | r | User is not allowed to open the object for reading. |

    | W | User is allowed to open the file for writing. |'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# Permissions 89


    | Letter | Permission |

    | --- | --- |

    | w | User is**not** allowed to open the file for writing. |

    | D | User is allowed to delete the object. |

    | d | User is **not** allowed to delete the object. |

    | X | User is allowed to execute the object. When this permission is applied to
    a directory or Registry key, the user is allowed to access its contents. |

    | x | User is **not** allowed to execute the object. When this permission is applied
    to a directory or Registry key, the user is **not** allowed to access its contents.
    |

    | P | User is allowed to change the object''s permissions. |

    | p | User is **not** allowed to change the object''s permissions. |

    | O | User is allowed to take ownership of the object. |

    | o | User is **not** allowed to take ownership of the object. |

    | A | User has granted all permissions. This permission may be set in addition
    to other flags. |

    | a | User has denied all permissions. This permission may be set in addition
    to other flags. |


    Figure 3.3 shows the permissions on a specific directory (C:\temp). The script
    first prints the name of the owner and group of the object (in this case, a directory).
    Next, it prints each user and group account that has been granted or denied access
    to the object. The type of object that the permission relates to follows the account
    name. In this example, the Administrator account is granted directory permissions,
    and the PerTest7 account has been granted both directory and file permissions.


    The permissions are then displayed. This seven-letter string indicates which permissions
    are granted, denied, or not addressed. A capital letter indicates that the related
    permission has been explicitly granted, and a lowercase letter indicates that
    the permission has been explicitly denied. We can see that PerTest7 has been granted
    read and execute but denied write permissions on files in the C:\temp directory.
    Additionally, the account has been denied permission to take ownership of the
    directory. On the other hand, the Administrator account has been granted all permissions.
    The letter A means there was no need to explicitly grant the read, write, execute,
    and delete permissions. Notice that the Joel account has been granted all access
    (like the Administrator); however, the delete permission has been explicitly denied.
    Because explicitly denied access always overrides allowed access, the user has
    full control over the directory, except that he cannot delete it.


