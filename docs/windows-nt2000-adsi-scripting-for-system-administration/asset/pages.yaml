    Detecting Service Shutdown

    The Win32::Daemon service control loop can receive a SERVICE_CONTROL_SHUTDOWN
    message. When the operating system is shutting down, it sends this message to
    all services. This message gives the service roughly 20 seconds to perform any
    shutdown tasks, such as closing files, updating databases, or doing whatever else
    a service may want to perform. When the 20 seconds have expired, the service is
    terminated by the Service Manager, possibly while the service is still performing
    shutdown tasks.


    If the service requires more time to shut down, it can call the Win32::Daemon::State()
    function to update the Service Manager with the SERVICE_PENDING control message
    and a second parameter with the number of seconds needed to completely finish
    its shutdown tasks. The Service Manager extends the life span of the service by
    the time submitted. After that time has expired, the service is terminated. If
    the service finishes before the time allotted, it can submit the SERVICE_STOPPED
    control message, and the service is allowed to end on its own terms.


    This scenario is illustrated in Example 8.11. Lines 21 through 27 manage the SERVICE_CONTROL_SHUTDOWN
    control message. Notice that line 24 informs the Service Manager that not only
    does the service acknowledge that it is beginning the process of stopping, but
    it also requests 45 seconds to perform all its shutdown tasks. If it does not
    successfully set the state to SERVICE_STOPPED within these 45 seconds, the Service
    Manager will forcibly shut down the service by terminating the process.'
