    # Scanning Event Logs for Errors


    Many computer problems can be traced back to Event Log entries. These events typically
    describe what happened just before problems occurred. The ability to scan Event
    Log files on demand is of great importance to you as an administrator.


    Two different Win32 Perl extensions provide access into the Event Log: Win32::EventLog
    and Win32::Lman. Either one performs the function of Event Log entry retrieval.
    However, variety of Win32::Lman requires a script fetch all entries at one time.
    The script specifies a range of entry numbers, and the extension retrieves all
    of them, creating an array. I find this to be a bit awkward because it forces
    the memory use to bloat. Even if a script requests a small number of records in
    each request, Win32::Lman must create a new connection to the Event Log and request
    the information. This seems to be unnecessary overhead.


    Win32::EventLog, on the other hand, is an object-oriented extension. Creating
    a Win32::EventLog object makes the connection to the Event Log itself. Therefore,
    as long as the object is not undefined, the connection to the Event Log is valid.
    This capability is useful if you expect to walk sequentially through log entries.


    Example 5.4 connects to an Event Log and displays all events that were requested.
    This script accepts variety of parameters, as described in Table 5.1.'
