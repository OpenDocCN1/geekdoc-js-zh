    # Running Perl Scripts as Win32 Services


    You can resolve many problems by writing Perl scripts. Some of these types of
    problems, however, require that a script is running at all times. On a Windows
    2000 or Windows NT machine, programs are run by a user executing them, or they
    can be automatically run when a user logs on. Either such execution requires is
    not always acceptable, however, which is how many administrators create Perl scripts
    and register them as a Win32 service. You can choose from two ways to run a script
    in such a way: the SRVANY.EXE program and the Win32::Daemon extension. Other applications
    are similar to SVRANY.EXE, but they are not as widely used.


    You can use either of these techniques to effectively run a Perl script from computer
    boot time until shutdown. The SRVANY.EXE technique can be implemented quickly
    but lacks the control an administrator may require. Using the Win32::Daemon, on
    the other hand, requires a bit more thought and coding; however, it implements
    a Perl script as a true Win32 service, allowing for true Win32 service control.


    # Services Using SRVANY.EXE


    The Windows NT/2000 Resource Kit contains a small executable program called SRVANY.EXE.
    This application enables any program to run as if it were a service—hence its
    name. The SRVANY.EXE program runs as a service, and its only task is to create
    a new process, which could be another program or even a Perl script. The SRVANY
    process manages all service control messages on behalf of the new process it started.'
