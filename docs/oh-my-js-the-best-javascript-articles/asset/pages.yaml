  md: "# Testing\n\nOr maybe you're coding a parallax scrolling effect where, as you\
    \ scroll, background images changenthe position relative to page's scroll position.\
    \ I will go with the former of the two common uses, and\nthe gist of your code\
    \ might be:\n\n```\nfunction onScroll() {\n    update();\n}\nfunction update()\
    \ {\n    // assume domElements has been declared\n    // by this point :\n   \
    \ for(var i = 0; i < domElements.length; i++) {\n        // read offset of DOM\
    \ elements\n        // to determine visibility - a reflow\n        // then apply\
    \ some CSS classes\n        // to the visible items - a repaint\n    }\n}\n\n\
    window.addEventListener('scroll', onScroll, false);\n```\n\nThe main issue is\
    \ that we are triggering a reflow and repaint whenever we get a scroll event:\
    \ we\nask the browser to recalculate the real positions of DOM elements, an expensive\
    \ reflow operation,\nan then we apply some CSS classes, which causes the browser\
    \ to repaint. We end up ping-pong\nbetween reflowing and repainting, and this\
    \ is going to undermine your app's performance. We're\npicking on scroll events,\
    \ but the same applies to resize events. In fact, any event that you're\nmaking\
    \ use of in this way can cause performance issues. Read Tony Gencifer's Fastasite\n\
    log post for a breakdown of properties that cause a reflow in WebKit159.\n\nWhat\
    \ we need to do is decouple the scroll event from the update function, and this\
    \ is exactly\nwhere requestAnimationFrame steps in to help. We need to change\
    \ things around that we are\nlistening to our scroll events, but we will only\
    \ store the most recent value:\n\n> 159http://gent.ilcore.com/2011/03/how-not-to-trigger-layout-in-webkit.html"
