    # # Understanding JavaScript Function Invocation and "this"


    ## Original Article

    nhttp://yehudakatz.com/2011/08/11/understanding-javascript-function-invocation-and-this

    Yehuda Katz, yehudakatz.com


    Over the years, I''ve seen a lot of confusion about JavaScript function invocation.
    In particular, a lot of people have complained that the semantics of this in function
    invocations is confusing.


    In my opinion, a lot of this confusion is cleared up by understanding the core
    function invocation primitive, and then looking at all other ways of invoking
    a function as sugar on top of primitive. In fact, this is exactly how the ECMAScript
    spec thinks about it. In some areas, this post is a simplification of the fact,
    but the basic idea is the same.


    # # The Core Primitive


    First, let''s look at the core function invocation primitive, a Function''s call
    method[1]. The call method is relatively straightforward.


    +   1. Make an argument list (argList) out of parameters 1 through the end

    2. The first parameter is thisValue

    3. Invoke the function with this set to thisValue and the argList as its argument


    For example:


