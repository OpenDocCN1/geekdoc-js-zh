  md: "```\nInjector.getDependencies = function(arr) {\n  var self = this;\n  return\
    \ arr.map(function(dependencyName) {\n    return self.dependencies[dependencyName];\n\
    \  });\n}\n```\n\nThe getDependencies method takes the array of dependency names\
    \ and maps it to a corresponding array of actual dependencies. If this map function\
    \ is foreign to you check out the [Array.prototype.map documentation](#).\n\n\
    Now we have implemented our dependency resolver we can head back over to our process\
    \ method and execute the target function with its proper dependencies.\n\n+  \
    \ target.apply(target, this.getDependencies(args));\n\nPretty awesome, right?\n\
    \n# Injector.js\n\n```\nvar Injector = {\n  dependencies: {},\n\n  process: function(target)\
    \ {\n    var FN_AGGS = /^\\s*([\\/\\s(/\\/)]*)\\)/m;\n    var text = target.toString();\n\
    \    var args = text.match(FN_AGGS)[1].split(',');\n\n    target.apply(target,\
    \ this.getDependencies(args));\n  },\n\n  getDependencies: function(arr) {\n \
    \   var self = this;\n    return arr.map(function(value) {\n      return self.dependencies[value];\n\
    \    });\n  },\n\n  register: function(name, dependency) {\n    this.dependencies[name]\
    \ = dependency;\n  });\n```\n\n> https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Global_Objects/Array/map"
