  md: "# Node.js 100\n\nWe can use this to write a piece of code that creates a loop\
    \ that Node.js (or a browser) will never break out of:\n\n```\nEE = require('events').EventEmitter\n\
    ee = new EE();\n\ndie = false;\n\nee.on('die', function() {\n  die = true;\n});\n\
    \nsetTimeout(function() {\n  ee.emit('die');\n}, 100);\n\nwhile(die) {\n}\n\n\
    console.log('done');\n```\n\nIn this example, console.log will never be called\
    \ because the while loop stops Node from ever getting chance to callback the timeout\
    \ and emit the 'die' event.\n\nThis is a really important piece of information,\
    \ while it's unlikely we would program a loop like this relies on an external\
    \ condition to exit, it illustrates how Node.js can do only one thing at once.\
    \ And getting a fly in the ointment can really screw up the whole server.\n\n\
    Let's look at the standard Node.js code for creating an HTTP server:\n\n```\n\
    var http = require('http');\nhttp.createServer(function (req, res) {\n  res.writeHead(200,\
    \ {'Content-Type': 'text/plain'});\n  res.end('Hello World\\n');\n}).listen(8124,\
    \ '127.0.0.1');\nconsole.log('Server running at http://127.0.0.1:8124/')\n```\n\
    \nThis code is the 101st example from the Node.js web site. It creates an HTTP\
    \ server using a factory method in the http library. The factory method creates\
    \ a new HTTP server and attaches a callback to the 'request' event. The callback\
    \ is specified as the argument to the createServer.\n\nWhat's interesting is what\
    \ happens when this code is run. The first thing Node.js does is run the preceding\
    \ code from top to bottom. This can be considered the 'setup' phase of Node programming.\n\
    \n> [166](https://nodejs.org/ )"
