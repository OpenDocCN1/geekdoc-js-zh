  md: '# Node.js


    # Understanding event loops and writing great code for Node.js


    Original Article


    http://developer.yahoo.com/blogs/ydn/part-1-understanding-event-loops-writing-great-code-11401.html


    Tom Hughes-Croucher, developer.yahoo.com/blogs#


    #http://developer.yahoo.com/blogs


    As usual JSConf.Eu¹⁶⁴ was one of the best conferences I''ve been to this year.
    It''s a delight to hang out with some of the smartest JavaScript coders on the
    planet, and doing it in the very trendy city of Berlin was a nice bonus. There
    are a few great recaps of JSConf¹⁶⁵ so I''m not focusing on instead; I''m going
    to expand the talk I gave


    Programming inside an event loop is something most programmers only having a passing
    familiarity with. Node.js is quickly gaining traction as a very popular event
    loop-based server for JavaScript. It is simple as people to write JavaScript on
    the server, which has access to the HTTP stack, TCP file, I/O, and databases.
    However the kind of programs that we write in this context tend to be very different
    from the kind of programs we write for browser-based applications or sites.


    In the browser, the bulk of the program tends to be involved with setting up the
    user-interface, and there are some small event callbacks that are enacted — most
    typically, based on user interaction with the browser. For example, when the user
    clicks Submit on a form, we intercept the click and validate their submission.


    There is an important point here: in more browser programming, programmers are
    only dealing with events caused by the user, and the user can only do so many
    things at once. Moreover the callbacks for these events tend to be very discrete
    and don''t count other events. Some libraries, like YUI, have custom event support.
    But it is often thought of an advanced feature.


    On the server


    ¹⁶⁴http://jsconf.eu/2010/

    ¹⁶⁵http://palagut-coding.blogspot.com/2010/09/in-case-you-missed-it-jsconf-2010-day.html'
