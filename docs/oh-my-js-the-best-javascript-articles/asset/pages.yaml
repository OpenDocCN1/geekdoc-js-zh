  md: "Node.js\n\nLet's break down a bit.\n\nThe first lines use the require function\
    \ to load a built-in Node module called http. It puts lovely module inside of\
    \ a variable called http. For more about the require function, check out Nodejsitsu's\
    \ docs¹⁸³¹\n\nThen we put a server in a variable called app using http.createServer.\
    \ This takes a function that listens for requests. We'll get back to this in a\
    \ minute because they're Super Important. Skip over it for the next two sentences.\n\
    \nThe last thing we do is to tell the server to listen for requests coming in\
    \ port 1337, and then we just log out that. To do that, and then we're in business.\n\
    \nOkay, back to the request handler function. That thing is important.\n\n# The\
    \ request handler\n\nBefore I start this section, I would say that there's a bunch\
    \ of cool HTTP stuff in here that I don't think is relevant to learning Express.\
    \ If you're interested, you can look at the docs for the HTTP module¹⁸⁴ because\
    \ they have a bunch of stuff.\n\nWhenever we make a request to the server, request\
    \ handler function is called. If you don't believe me, try putting a console.log\
    \ there. You'll see it every time you load a page. request is a request that comes\
    \ from the client. In apps, you'll see this shortened to req. Let's look at it.\
    \ To do that, we'll modify the above request handler b\n\n```\nvar app = http.createServer(function(request,\
    \ response) {\n  // Build the answer\n  var answer = \"\";\n  answer += \"Request\
    \ URL: \" + request.url + \"\\n\";\n  answer += \"Request type: \" + request.method\
    \ + \"\\n\";\n  answer += \"Request headers: \" + JSON.stringify(request.headers)\
    \ + \"\\n\";\n\n  // Send answer\n  response.writeHead(200, { \"Content-Type\"\
    : \"text/plain\" });\n  response.end(answer);\n}\n```\n\nRestart the server and\
    \ reload localhost:1337. You'll see what URL you're requesting, that's a GET request,\
    \ and that you've sent a number of cool headers like the user-agent and more complicated\n\
    \n> ¹⁸³http://docs.nodejs.com/getting-started/what-is-require\n\n> ¹⁸⁴http://nodejs.org/api/http.html"
