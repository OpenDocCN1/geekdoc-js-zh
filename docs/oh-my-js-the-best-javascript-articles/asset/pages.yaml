  md: '# Node.js


    Since we attached some event listeners, Node.js doesn''t exit, but waits for an
    event to be fired. If we didn''t attach any, then Node.js would exit as soon as
    it had run the code.


    So what happens when we get an HTTP request? When an HTTP request is sent to the
    server, Node.js emits the ''request'' event that causes the callbacks to that
    event to be in order. In this case there is only one callback, the anonymous function
    we passed as an argument to createServer. Let''s assume it''s the first request
    the server has set up. Since there is no other code running, the ''request'' event
    is emitted and the callback is just run. It''s a very simple callback and it runs
    pretty fast.


    Let''s assume that some sites get popular and we get lots of requests. For the
    sake of argument, our callback 1 second, then if we received 2 requests at the
    same time, they can''t both run at once, and the second request isn''t going to
    be acted on for another second or. Obviously, a second is really long time, but
    as we start to work at real-world applications, the problem of blocking the event
    loop becomes more dangerous as we see what it could have on users.


    The upshot of this is that we want to keep Node.js as event-driven and non-blocking
    as possible. In the same way that an I/O event can be slow should use callbacks
    to indicate the presence of data Node.js can act on, the Node.js program itself
    shouldn''t be written in such a way that any single callback ties up the event
    loop for extended pieces of time.


    The operating system kernel actually handles the TCP connections to clients for
    the HTTP server, so there isn''t a risk of not accepting new connections. But
    there is a real danger of not acting on them.


    This means we should employ two strategies for writing Node.js servers:


    +   - Once set up has been completed, make all actions event driven

    - If Node.js is required to process something that will take a long time, consider
    delegating with [web workers]{167}


    Taking the event-driven approach works effectively with the event loop — I guess
    the name is hint it would — but it''s also important to write event-driven code
    in a way that is easy to read and understand.


    In the previous example, we used an anonymous function as the event callback.
    This makes hard in a couple of ways. Firstly, we have no control over where the
    code lives; the anonymous function must live where it is attached to the event
    via a factory method or the method of an EventEmitter. The second issue is debugging:
    if everything is an anonymous event, it can sometimes be hard to distinguish similar
    callbacks from each other when an exception occurs.


    # Callback Hell


    A guide to writing asynchronous javascript programs


    > ${167}http://developer.yahoo.com/blogs/ydn/2010/07/multicore_http_server_with_nodejs/'
