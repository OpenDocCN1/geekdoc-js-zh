  md: "# Node.js\n\nSo let's step through this.\n\nFirst, we require Connect. We require\
    \ Node's HTTP module just like we did before. We are ready.\n\nThen we make a\
    \ variable called app like we did before, but instead of creating the server,\
    \ we call connect(). What's going on? What is this madness?\n\nWe add some middleware\
    \ - it's just a function. We pass this to app.use(), and this function allows\
    \ an awful lot like the request handlers from above. In fact, I copy-pasted it.\n\
    \nThen we create the server and start listening. http.createServer takes a function\
    \ before, so guess what app is just a function. It's a Connect-made function that\
    \ starts going through all the middleware until the end. But it's just a request\
    \ handler like before.\n\n> (Noting that you might see people using app.listen(1337),\
    \ which just defers to http.createServer. This is true in both Connect and Express.)\n\
    \nOkay, now I'm going to explain middleware.\n\n# What is middleware?\n\nI want\
    \ to start by saying that Stephen Sugden's description of Connect middleware¹⁸⁸\
    \ is really good and does a better job than I can. If you don't like my explanation,\
    \ read his.\n\nRemember the request handlers from a few sections earlier? Each\
    \ piece of middleware is a request handler. You start by looking at the first\
    \ request handler, then you look at the next one, then the next, and so on.\n\n\
    Here's what middleware basically looks like:\n\n```\nfunction myFunMiddleware(request,\
    \ response, next) {\n  // Do stuff with the request and response.\n  // When we're\
    \ all done, call next() to defer to the next middleware.\n  next();\n}\n```\n\n\
    When we start a server, we start at the topmost middleware and work our way to\
    \ the bottom. If we wanted to add simple logging to our app, we could do it!\n\
    \n> ¹⁸⁸http://stephensugden.com/middleware_guide/"
