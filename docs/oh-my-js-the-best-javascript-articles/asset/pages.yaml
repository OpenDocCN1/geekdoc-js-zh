  md: "# Testing\n\n```\nvar latestKnownScrollY = 0,\nnticking = false;\nfunction\
    \ onScroll() {\n  latestKnownScrollY = window.scrollY;\n  requestTick();\n}\n\
    function requestTick() {\n  if(!ticking) {\n    requestAnimationFrame(update);\n\
    \  }\n  ticking = true;\n}\n```\n\nWhenever we scroll we will try and call requestAnimationFrame,\
    \ but if one is already requested we don't initiate another. This is an important\
    \ optimization, since the browser will stack all the repeated RAF requests and\
    \ we will be back to a situation with more calls to update we need.\n\nThanks\
    \ to this we no longer need to call requestAnimationFrame at the top of update\
    \ because we will know it is requested when one or more scroll events has taken\
    \ place. We also no longer need the kick off all at the bottom, so it's update:\n\
    \n```\nfunction update() {\n  // reset the tick so we can\n  // capture the next\
    \ onScroll\n  ticking = false;\n  var currentScrollY = latestKnownScrollY;\n \
    \ // read offset of DOM elements\n  // and compare to the currentScrollY value\n\
    \  // then apply some CSS classes\n  // to the visible items\n}\n// kick off -\
    \ no longer needed! Woo.\nupdate();\n```\n\nHopefully you can see the benefits\
    \ of debouncing the animations in your app from any scroll or resize events that\
    \ influence it. If you're still in any doubt, John Res wrote a great article about\
    \ how Twitter was affected by scroll events¹⁶⁰ a while ago. Had RAF been around\
    \ back then, the above technique would have probably been his recommendation.\n\
    \n> ¹⁶⁰http://john.org/blog/learning-from-twitter/"
