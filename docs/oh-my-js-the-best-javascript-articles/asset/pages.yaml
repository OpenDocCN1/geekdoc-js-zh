  md: "# Node.js 118\n\n# Bonus cool feature: everything from Connect and Node\n\n\
    I want to remind that Express is built on top of Connect which is built on top\
    \ of Node. This means that all Connect middleware works with Express. This is\
    \ useful! For example:\n\n```\nvar express = require(\"express\");\nvar app =\
    \ express();\napp.use(express.logger()); // Inherited from Connect\n.get(\"/\"\
