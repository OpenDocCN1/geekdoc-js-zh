  md: "```\n1 var express = require(\"express\");\n2 var http = require(\"http\");\n\
    3 var app = express();\n4 \n5 app.all(\"*\", function(request, response, next)\
    \ {\n6   response.writeHead(200, {\"Content-Type\": \"text/plain\"});\n7   next();\n\
    8 });\n9 \n10 app.get(\"/\", function(request, response) {\n11   response.end(\"\
    Welcome to the homepage!\");\n12 });\n13 \n14 app.get(\"/about\", function(request,\
    \ response) {\n15   response.end(\"Welcome to the about page!\");\n16 });\n17\
    \ \n18 app.get(\"**\", function(request, response) {\n19   response.end(\"404!\"\
    );\n20 });\n21 \n22 http.createServer(app).listen(1337);\n```\n\nOoh. That's hot.\n\
    After the basic rules, we say \"every request goes through this function\" with\
    \ app.all. And that function looks an awful lot like middleware, don't it?\n\n\
    The three calls to app.get are Express’s routing system. They could also be app.post,\
    \ which respond to POST requests, or PUT, or any of the HTTP verbs. The first\
    \ argument is a path, like /about or /. The second argument is a request handler\
    \ similar to what we’ve seen before. To quote the Express documentation¹⁹³¹\n\n\
    > [These request handlers] behave just like middleware, with the one exception\
    \ that these callbacks may invoke next('/route') to bypass callback(s). This mechanism\
    \ can be used to perform pre-conditions on a route then pass control to subsequent\
    \ routes where there is no reason to proceed with the route matched.\n\nIn short:\
    \ they’re basically middleware like we’ve seen before. They’re just functions,\
    \ just like before. These routes can get smarter, with things like this:"
