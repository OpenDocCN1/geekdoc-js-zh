  md: '# if Statement


    The if class of statements should have the following form:


    ```

    if (condition) { statements }

    if (condition) { statements } else { statements }

    if (condition) { statements } else if (condition) { statements } else { statements
    }

    ```


    # for Statement


    A for class of statements should have the following form:


    ```

    for (initialization; update) { statements }

    for (variable in object) { if (filter) { statements } }

    ```


    The first form should be used with arrays and loops of a preable number of iterations.

    The second form should be used with objects. Be aware that members that are added
    to the prototype of the object `will be included` in the enumeration. It is wise
    to program defensively using the `hasOwnProperty` method to distinguish the true
    members of the object:


    ```

    for (variable in object) { if (object.hasOwnProperty(variable)) { statements }
    }

    ```


    # While Statement


    A while statement should have the following form:


    ```

    while (condition) { statements }

    ```


    # do Statement


    A do statement should have the following form:


    ```

    do { statements } while (condition);

    ```


    Unlike the other compound statements, the do statement always ends with a ; semicolon.


    # switch Statement


    A switch statement should have the following form:


    ```

    switch (expression) { case expression: statements default: statements }

    ```


    Each case is aligned with the switch. This avoids over-indentation.

    Each group of statements (except the default) should end with break, return, or
    throw. Do not fall through.'
