  md: 'Dynamic code loading (done in AMD systems require([], function ()))55 is a
    basic requirement. CJS talked about this need, it had some proposals, but it was
    not fully embraced. Node does not have any support for this need, instead relying
    on the synchronous behavior of require(*), which is not portable to the web.


    Loader plugins56 are incredibly useful. It helps avoid nested brace indent common
    in callback-based programming.


    Selectively mapping one module to load from another location makes it easy to
    provide mock objects for testing.


    There should only be at one action for each module, and it should be straightforward.
    Web browsers are not tolerant of multiple IO lookups which Node does now, and
    avoid the use of a package.json "main" property. Just use module names that map
    easily to one location on the project''s location, using a default convention
    that does not require verbose configuration, but allow for simple configuration
    when needed.


    It is best if there is an opt-in* call that can be done so that older JS code
    can participate in the new system.


    If a JS module system cannot deliver on the above features, it is at a significant
    disadvantage compared to AMD and its related APIs around callback-require57, loader
    plugins58, and paths-based module IDs.


