  md: "# Debouncing Mouse Events\n\nWe've gone through one common use-case for using\
    \ rAF to decouple animations from scroll and resize events, now let's talk about\
    \ another one: using it to deal with interactions. In this instance we're going\
    \ to have something stick to the current mouse position, only when the mouse button\
    \ is pressed. When it's released we'll stop the animation.\n\nLet's jump straight\
    \ into the code, then we'll pick it apart:\n\n```\nvar mouseDown = false;\nlastMousePosition\
    \ = { x: 0, y: 0 };\n\nfunction onMouseDown() {\n  mouseDown = true;\n  requestAnimationFrame(update);\n\
    }\n\nfunction onMouseUp() {\n  mouseDown = false;\n}\n\nfunction onMouseMove(evt)\
    \ {\n  lastMousePosition.x = evt.clientX;\n  lastMousePosition.y = evt.clientY;\n\
    }\n\nfunction update() {\n  if(mouseDown) {\n    requestAnimationFrame(update);\n\
    \  }\n  // now draw object at lastMousePosition\n}\nndocument.addEventListener('mousedown',\
    \ onMouseDown, false);\ndocument.addEventListener('mouseup', onMouseUp, false);\n\
    document.addEventListener('mousemove', onMouseMove, false);\n```\n\nIn this instance\
    \ we are setting a boolean (mouseDown) depending on whether or not the mouse button\
    \ is currently pressed. We can also piggy back on the mousedown event to initiate\
    \ the first requestAnimationFrame call, which is handy. As we move the mouse we\
    \ do a similar trick to the previous example where we simply store the last known\
    \ position of the mouse, which we use later"
