  md: "# Module Definition § 5\n\nUsing JavaScript functions for encapsulation has\
    \ been documented as the module pattern^{52}:\n\n```\nfunction () {\n  this.myGlobal\
    \ = function () {};\n});\n```\n\nThat type of module relies on attaching properties\
    \ to the global object to export the module value, and it is difficult to declare\
    \ dependencies with this model. The dependencies are assumed to be immediately\
    \ available when this function executes. This limits the loading strategies for\
    \ the dependencies.\n\nAMD addresses these issues by:\n\n+   * Register the factory\
    \ function by calling define(), instead of immediately executing it.\n* Pass dependencies\
    \ as an array of string values, not grab globals.\n* Only execute the factory\
    \ function once the dependencies have been loaded and executed.\n* Pass the dependency\
    \ as arguments to the factory function.\n\n```\n//Define with a dependency array\
    \ and a factory function define(['dep1', 'dep2'],\nfunction (dep1, dep2) {\n \
    \ return function () {};\n});\n```\n\n# Named Modules § 6\n\nNotice that the above\
    \ module does not declare a name for itself. This is what makes the module very\
    \ portable. It allows a developer to place the module in a different path to give\
    \ it a different ID/name. The AMD loader will give the module ID based on how\
    \ it is referenced by other scripts.\n\nHowever, tools that combine multiple modules\
    \ together for performance need a way to give names to each module in the optimized\
    \ file. For that, AMD allows a string as the first argument to define():"
