  md: "# Patterns and Code Organization\n\nYou also might have noticed the var keyword.\
    \ If you aren't sure of how it is used, a basic explanation is that by preceding\
    \ a variable declaration with var creates a property on the nearest containing\
    \ function. If you omit the var keyword then you are saying that you want to assign\
    \ a value to an existing variable up the scope, which may or may not be the global\
    \ scope.\n\n```\nvar imAGlobal = true;\nfunction globalGrabber() {\n  imAGlobal\
    \ = false;\n  return imAGlobal;\n}\nconsole.log(imAGlobal); //outputs \"true\"\
    \nconsole.log(globalGrabber()); //outputs \"false\"\nconsole.log(imAGlobal); //outputs\
    \ \"false\"\n```\n\nAs you can see, it is dangerous to rely on globals in your\
    \ functions, due to possible side effects and collisions that are bound to occur.\
    \ What happens when we use the var keyword?\n\n```\nvar imAGlobal = true;\nfunction\
    \ globalGrabber() {\n  var imAGlobal = false;\n  return imAGlobal;\n}\nconsole.log(imAGlobal);\
    \ //outputs \"true\"\nconsole.log(globalGrabber()); //outputs \"false\"\nconsole.log(imAGlobal);\
    \ //outputs \"true\"\n```\n\nJavascript hosts the var declaration to the top of\
    \ the function block, then initializes the variable. This is called variable hoisting.\n\
    \n**To summarize:** all variables are scoped to a function (which is itself an\
    \ object), and where you declare those variables with var determines the function\
    \ they are scoped to. Excluding var will imply global scope for a variable.\n\n\
    Let's look at how variable hoisting happens:"
