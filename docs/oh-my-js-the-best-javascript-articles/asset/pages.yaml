    \ scheduled). We've also moved the offsetTop property lookups into one loop and\
    \ class changes into a second loop which means we are avoiding the reflow-repaint\
    \ problem. We decoupled our events from the draw so they can happen as often as\
    \ they like and we won't be doing unnecessary drawing. Finally we've switched\
    \ className for classList, which is a massive performance saver.\n\nOf there are\
    \ other things we can do to take this further, in particular not iterating through\
    \ all 800 DOM elements on each page, even just the changes we have made given\
    \ us great performance improvements.\n\n# Conclusion\n\nIt's important not to\
    \ only requestAnimationFrame for your animations, but also to use it in the right\
    \ way. As you can hopefully see it is quite easy to inadvertently cause bottlenecks,\
    \ but by understanding how the browser actually executes your code you can fix\
    \ any problems quickly. Take time with Chrome's Dev Tools, especially the frame\
    \ mode, and see where your animations can be improved.\n\n> ^163http://www.htmlrocks.com/en/tutorials/animations/post.html"
