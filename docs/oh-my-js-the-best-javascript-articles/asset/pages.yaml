  md: "# Tools\n\n\"The cyclomatic complexity of a section of source code is the count\
    \ of the number of linearly independent paths through the source code.\" --http://en.wikipedia.org/wiki/Cyclomatic_complexity\n\
    \nIn addition to the above parameters, depth, and statement metrics we can now\
    \ track the overall complexity using the maxcomplexity option. \" /jshint maxcomplexity:3\
    \ // /global console:false */ (function undefined) [ \"use strict\":\n\n```\n\
    function isPrime( number ) {\n  var prime = true, i;\n\n  if ( isNumber( number\
    \ ) ) {\n    for ( i = 2; i < number; i++) {\n      if ( number % i === 0 ) {\n\
    \        prime = false;\n      }\n    }\n  } else {\n    prime = false;\n  }\n\
    \n  return prime;\n}\n```\n\n```\nfunction isNumber( number ) {\n  return !isNaN(\
    \ parseFloat( number ) ) && isFinite( number );\n}\n```\n\n```\nconsole.log( isPrime(\
    \ 109 ) );\n```\n\nAs you see, the above function has more complexity than what\
    \ we set in maxcomplexity.\n\nYou might be wondering what a reasonable maxcomplexity\
    \ value is for your project. In the 2nd edition of Steve McConnell's Code Complete\
    \ he recommends that cyclomatic complexity from 0 to 5 is typically fine, but\
    \ you should be aware if the complexity starts to get in the 6 to 10 range. He\
    \ explains that anything over a complexity of 10 you should strongly consider\
    \ refactoring your code.\n\n# Global Options\n\nInstead of adding these options\
    \ to the top of each and every JavaScript file you instead use a .jsintrc file\
    \ in your project and JSHint should pick up these settings. This is handy if your\
    \ project is large and you want consistent settings across the board."
