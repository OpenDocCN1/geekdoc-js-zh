    117


    ```

    1 // Start Express

    2 var express = require("express");

    3 var app = express();

    4

    5 // Set the view directory to /views

    6 app.set("views", __dirname + "/views");

    7

    8 // Let''s use the Jade templating language

    9 app.set("view engine", "jade");

    ```


    The first block is as same as always. Then we say "our views are in a folder called
    views". Then we say "Jade" is a templating language. We''ll see how it works in
    just a second! Now, we''ve set up these views. How do we use them?


    Let''s start by making a file called index.jade and put it into a directory called
    views. It might look like this:


    ```

    1 doctype 5

    2 html

    3

    4 body

    5 h1 Hello, world!

    6 p= message

    ```


    This is basically HTML without the brackets. It should be fairly straightforward
    if you know HTML. The only interesting part is the last line. message is a variable!
    Woah! Where did that come from? I''ll tell you.


    We need to render the view from Express. Here''s what that looks like


    ```

    1 app.get("/", function(request, response) {

    2 response.render("index", { message: "I love anime" });

    3 });

    ```


    Express adds a method to response, called render. A bunch of smart stuff, but
    it basically looks at the view engine and views directory (the stuff we defined
    earlier) and renders index.jade.

    The last step (I suppose it is the first step) is to install Jade, because it''s
    not bundled with Express. Add it to your package.json or npm install it.


    If you get all of set up, see this page¹⁹⁸. Here''s all the source code.¹¹⁹⁹


