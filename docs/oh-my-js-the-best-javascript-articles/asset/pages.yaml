    \ hides difficult bits and says \"don't worry, you don't need to understand this\
    \ part. It does things for you that you don't have to do it. In other worlds,\
    \ it's magic\n\nIt's good magic, Express catalogs some people using it180, and\
    \ there are some big names: MySpace, Klout, and even some that I've made. Me's\
    \ a huge deal. I've got a blog.\n\nBut all magic comes at a price181; you might\
    \ not understand the inner workings of Express. This is like driving a car; I\
    \ drive a car just without intimate knowledge of its workings, but I'd be better\
    \ off with that knowledge. What if things break? What if you want to get all the\
    \ performance you can out of the car? What if you have an insatiable thirst for\
    \ knowledge?\n\nSo let's understand Express from the bottom, with Node.\n\n# Bottom\
    \ layer: Node's HTTP server\n\nNode has HTTP module182 which makes a pretty simple\
    \ abstraction for making a webserver. Here's what that might look like:\n\n```\n\
    // Require what we need\nvar http = require(\"http\");\n\n// Build the server\n\
    var app = http.createServer(function(request, response) {\n  response.writeHead(200,\
