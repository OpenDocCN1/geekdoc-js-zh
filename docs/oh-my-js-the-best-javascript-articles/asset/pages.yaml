    \ 'dependency2'], function (require) {\n  var dependency1 = require('dependency1');\n\
    \  dependency2 = require('dependency2');\n\n  return function () {};\n});\n```\n\
    \nThis allows the loader to load dependency1 and dependency2 asynchronously, execute\
