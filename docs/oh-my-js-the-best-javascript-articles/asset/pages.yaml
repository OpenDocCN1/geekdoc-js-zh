  md: "# Node.js\n\n```\nfunction submit(submitEvent) {\n  var name = document.querySelector('input').value\n\
    \  request({\n    uri: \"http://example.com/upload\",\n    body: name,\n    method:\
    \ \"POST\"\n  }, postResponse);\n}\n\nfunction postResponse(err, response, body)\
    \ {\n  var statusMessage = document.querySelector('.status')\n  if (err) return\
    \ statusMessage.value = err\n  statusMessage.value = body\n}\n\nexports.submit\
    \ = formSubmit\n```\n\nThe exports at the end is an example of the CommonJS module\
    \ system, which is used by Node.js for server side javascript programming. I like\
    \ this style of modules because it is so simple – you only have to define what\
    \ should be shared when the module requires (that's what the exports thing).\n\
    \nTo use CommonJS modules in the browser you can use a command-line tool like\
    \ browserify¹⁰ I won't get into the details of how to use here but it will require\
    \ you to load modules into your programs.\n\nNow that we have formula.js (and\
    \ it is loaded in the page as a script tag) we just need to require it and use\
    \ it! Here is our application specific code looks now:\n\n```\nvar formulaLoader\
    \ = require('formulaloader')\ndocument.querySelector('form').onsubmit = formulaLoader.submit\n\
    ```\n\nNow our application is only two lines of code and has the following benefits:\n\
    \n+   - easier for new developers to understand - they won't get bogged down by\
    \ having to read all of the formulaloader functions\n- formulaloader can get used\
    \ in other places without duplicating code and can easily be shared on github\n\
    - the code itself is nice and simple and easy to read\n\nThere are lots of patterns\
    \ for web browser¹¹ and on the server¹². Some of them get complicated. The ones\
    \ shown here are what I consider to be the simplest to understand.\n\n> ¹⁰https://github.com/substack/node-browserify\n\
    ¹¹http://www.adequatelygood.com/2010/3/JavaScript-Module-Pattern-In-Depth\n¹²http://nodejs.org/api/modules.html"
