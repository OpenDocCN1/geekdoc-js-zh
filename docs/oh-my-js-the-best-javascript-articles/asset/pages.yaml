  md: 'JavaScript Fundamentals


    # Spec is cryptic and JavaScript implementations differ


    Rules for automatic semicolon insertion²⁷ are here and are, while somewhat difficult
    to comprehend by a casual reader, explicitly laid out. As for JavaScript implementations
    where interpretation of these rules differs, I''ve yet to find one. When I ask
    developers about this, or found archived discussions, typically they are yeah,
    this browser where this is utterly broken, I simply forgot it. Of course, they
    never remember.


    I write semicolon-less code and, in my experience, there isn''t a JavaScript interpreter
    that can''t handle it.


    # You can''t minify JavaScript code without semicolons


    There are 3 levels of reducing size of JavaScript source files: compression (e.
    gzip), minification (removing unnecessary whitespace and comments) and obfuscation
    (changing code, shortening variable and function names)


    Compression like gzip is the easiest; it requires one-time server configuration,
    doesn''t need extra effort by developers and doesn''t change your code. There
    was a time when IE6 couldn''t handle it, but if I remember correctly it patched
    years ago and pushed as a Windows update, and today rarely cares.


    Minification and obfuscation change your code. They are tools that you run on
    your source code saying "here are some JavaScript files, try to make them smaller,
    but don''t change functionality". I''m reluctant to use these tools because many
    developers report that if I don''t use specific coding styles, like writing semicolons,
    they will break my code. I''m OK with people (community) forcing certain coding
    styles on me, but not tools.


    Suppose I have code that works in every JavaScript implementation that I target
    (major browsers and some server-side implementations). If I run it through your
    minification and tool that breaks my code, then I''d report to your code is broken.
    If this tool edits JavaScript code, it''d better understand it as a real interpreter


    While the topic of minification, let''s do a reality check. I took the jQuery
    Source and removed all semicolons²³, then ran it through Google Closure Compiler²⁸.
    Resulting size was 76,673 bytes. Size of original "jquery.min.js" was 76,674 (1
    more). So you see, there was almost no change; and of course, this test passed
    as before.


    How is that possible? Well, consider this code:


    > ²⁷http://bquare.com/2004/11/07/ea-7.9


    > ²⁸http://github.com/mislav/jquery/commit/42af8987fc3bafec9def5b52b4de190c


    > ²³http://code.google.com/closure/compiler/'
