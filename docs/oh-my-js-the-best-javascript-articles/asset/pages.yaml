    \ be hardcore like the npm.org folks¹¹⁸⁷ and tough it out with Vanilla Node. But\
    \ you could also build a framework. That's Sencha did. And you called it.\n\n\
    # Middle layer: Connect\n\nFitting that Connect¹¹⁸ happens to be the middle layer\
    \ of this JavaScript cake, because it calls itself a \"middleware framework for\
    \ node\". Don't go searching \"middleware\" just yet - I'm about to explain it.\n\
    \n# A little bit of Connect code\n\nLet's say we wanted to write the \"hello world\"\
    \ app that we had above, but with Connect this time. Don't forget to install Connect\
    \ (npm install, baby). Once you've done that, the app is pretty similar.\n\n```\n\
    // Require the stuff we need\nvar connect = require(\"connect\");\nvar http =\
    \ require(\"http\");\n\n// Build the app\nvar app = connect();\n\n// Add some\
    \ middleware\napp.use(function(request, response) {\n  response.writeHead(200,\
    \ { \"Content-Type\": \"text/plain\" });\n  response.end(\"Hello world!\\n\");\n\
    });\n\n// Start it up!\nhttp.createServer(app).listen(1337);\n```\n\n> ¹¹⁸⁷ https://github.com/isaacs/npm-www#design-philosophy\n\
    ¹¹⁸ http://www.senchalabs.org/connect/"
