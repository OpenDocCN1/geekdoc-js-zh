- img_proc: true
  md: "# Setup\n\nIn order to illustrate how they work we need a couple of functions\
    \ that will find and process the records. In the real world these functions will\
    \ make an AJAX request and return the results, but for now let's just use timeouts.\n\
    \n```\nfunction finder(records, cb) {\n  setTimeout(function () {\n    records.push(3,\
    \ 4);\n    cb(records);\n  }, 1000);\n}\nfunction processor(records, cb) {\n \
    \ setTimeout(function () {\n    records.push(5, 6);\n    cb(records);\n  }, 1000);\n\
    }\n```\n\n# Using the callbacks\n\nThe code that consumes these functions looks\
    \ like this:\n\n```\nfinder([1, 2], function (records) {\n  processor(records,\
    \ function(records) {\n    console.log(records);\n  });\n});\n```\n\nWe call the\
    \ first function, passing a callback. Inside this callback we call the second\
    \ function passing another callback.\n\nThese nested callbacks can be written\
    \ more clearly by passing a reference to another function."
