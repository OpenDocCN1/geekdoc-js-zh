  md: "# Basic Requirements\n\nLets explore some of the requirements to make this\
    \ function work as expected.\n\n+   1. The dependency container needs to know\
    \ that this function wants to be processed. The AngularJS world that is done through\
    \ the Application object and the declarative HTML bindings. In our world we explicitly\
    \ ask our injector to process a function.\n2. It needs to know a Greeter before\
    \ it can inject it.\n\n# Requirement 1: Making the injector aware.\n\nTo make\
    \ our dependency injector aware of our WelcomeController we will simply tell our\
    \ injector want a function processed. Its important to know AngularJS ultimately\
    \ does this thing using less obvious mechanisms whether it be the Application\
    \ object or the HTML declarations.\n\n```\nvar Injector = {\n  process: function(target)\
    \ {\n    // Time to process\n  }\n};\nInjector.process(WelcomeController);\n```\n\
    \nOk, now that the Injector has the opportunity to process the WelcomeController\
    \ we can figure out what dependencies the function wants, and execute it with\
