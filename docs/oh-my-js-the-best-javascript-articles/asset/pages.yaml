    This page talks about the design forces and use of the Asynchronous Module Definition
    (AMD) API⁹ for JavaScript modules, the module API supported by RequireJS. There
    is a different page that talks about general approach to modules on the web¹⁰.


    # Module Purposes § 1


    What are JavaScript modules? What is their purpose?


    +   * **Definition**: how to encapsulate a piece of code into a useful unit, and
