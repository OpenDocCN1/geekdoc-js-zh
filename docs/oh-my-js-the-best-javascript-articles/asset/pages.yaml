  md: "# JavaScript Fundamentals 6\n\nThe short version is: a function invocation\
    \ like fn(...args) is the same as fn.call(window [ES5-strict: undefined], ...args).\n\
    \nNote that this is also true about functions declared inline: (function() {})()\
    \ is the same as (function() {}).call(window [ES5-strict: undefined).\n\n[2] Actually,\
    \ I read a bit. The ECMAScript spec says that undefined is (almost) always passed,\
    \ but that the function being called should change thisValue to the global object\
    \ when not in strict mode. This allows strict mode callers to avoid breaking existing\
    \ non-strict-mode libraries.\n\n# Member Functions\n\nThe next common way to invoke\
    \ a method is as a member of an object (person.hello()). In this case, the invocation\
    \ desugars:\n\n```\nvar person = {\n  name: \"Brendan Eich\",\n  hello: function(thing)\
    \ {\n    console.log(this + \" says hello \" + thing);\n  }\n}\n\n// this:\nperson.hello(\"\
    world\")\n\n// desugars to this:\nperson.hello.call(person, \"world\")\n```\n\n\
    Note that it doesn't matter how the method becomes attached to the object in this\
    \ form. Remember that we defined hello as a standalone function. Let's see what\
    \ happens if we attach to the object dynamically:\n\n```\nfunction hello(thing)\
    \ {\n  console.log(this + \" says hello \" + thing);\n}\n\nperson = { name: \"\
    Brendan Eich\" }\nperson.hello = hello;\n\nperson.hello(\"world\") // still desugars\
    \ to person.hello.call(person, \"world\")\n\nhello(\"world\") // \"[object DOMWindow]\n\
    ```\n\nNotice that the function doesn't have a persistent notion of 'this'. It\
    \ is always set at call time based on the way it was invoked by its caller."
