  md: "# Using Function.prototype.bind\n\nBecause it can sometimes be convenient to\
    \ have a reference to a function with a persistent value, people have historically\
    \ used a simple closure trick to convert a function into one with an unchanging\
    \ this:\n\n```\nvar person = {\n  name: \"Brendan Eich\",\n  hello: function(thing)\
    \ {\n    console.log(this.name + \" \" says hello \" + thing);\n  }\n}\nvar boundHello\
    \ = function(thing) { return person.hello.call(person, thing); };n\nboundHello(\"\
    world\");\n```\n\nEven though your boundHello still calls desugars to boundHello.call(window,\
    \ \"world\"), we turn right around and use our primitive call method to change\
    \ this value back to what we want it to be.\n\nWe can make this trick general-purpose\
    \ with a few tweaks:\n\n```\nvar bind = function(func, thisValue) {\n  return\
    \ function() {\n    return func.apply(thisValue, arguments);\n  }\n}\n```\n\n\
    ```\nvar boundHello = bind(person.hello, person)\nboundHello(\"world\") // \"\
    Brendan Eich says hello world\"\n```\n\nIn order to understand this, you need\
    \ two more pieces of information. First, arguments is an Array-like object that\
    \ represents all of the arguments passed into a function. Second, the apply method\
    \ works exactly like the call primitive, except that it takes an Array-like object\
    \ instead of listing the arguments one at a time.\n\nOur bind method simply returns\
    \ a new function. When it is invoked, our new function simply invokes the original\
    \ function that was passed in, setting the original value as this. It also passes\
    \ through the arguments.\n\nBecause this was a somewhat common idiom, ES5 introduced\
    \ a new method bind on all Function objects that implements this behavior:"
