  md: '# Bonus Suggestions


    {} and []


    Use {} instead of new Object(). Use [] instead of new Array().


    Use arrays when the member names would be sequential integers. Use objects when
    the member names are arbitrary strings or names.


    , (comma) Operator


    Avoid the use of the comma operator except for very disciplined use in the control
    part of for statements. (This does not apply to the comma separator, which is
    used in object literals, array literals, vars, and parameter lists.)


    # Block Scope


    In JavaScript blocks do not have scope. Only functions have scope. Do not use
    blocks except as required by the compound statements.


    # Assignment Expressions


    Avoid doing assignments in the condition part of if and while statements.


    Is


    ```

    if (a = b) {

    ```


    a correct statement? Or Was


    ```

    if (a == b) {

    ```


    intended? Avoid constructs that cannot easily be determined to be correct.


    === and !== Operators.


    It is almost always better to use the === and !== operators. The === and !== do
    type coercion. In particular, do not use == to compare against falsy values.


    # Confusing Pluses and Minuses


    Be careful not to follow a + with or ++. This pattern can be confusing. Insert
    parens between them to make your intention clear.'
