    # ## Common JavaScript "Gotchas"


    Original Article


    http://www.jblotus.com/2013/01/13/common-javascript-gotchas


    James Fuller, Jblotusᵃ

    ³ᵃhttp://www.jblotus.com/author/jblotus/


    PHP was my first programming language, and my initial exposure to JavaScript was
    through libraries like jQuery³³. There were things about JavaScript that always
    seemed to trip me up in the beginning due to how they worked differently than
    PHP. Here there are still some things today that are confusing. I want to share
    some of the things I struggled with when I started working with JavaScript. I
    am going to cover the global namespace, this, knowing the difference between ECMAScript
    3 and ECMAScript 5, asynchronous operations, prototypes, and simple JavaScript
    inheritance.


    # ### The Global Namespace


    In PHP specifically, when you declare a variable function outside of a class (or
    namespace block³) you are essentially adding a function to the global namespace.
    In JavaScript, there is no such thing as a namespace per se, rather everything
    is attached to the global object. In the case of the web browser, that is the
    window object. The other key difference is that in JavaScript, functions and variables
    are attributes of the global object, which we typically refer to as properties.


    This can be troublesome because you won''t get a warning in JavaScript if you
    overwrite a global function or property and it can actually be quite dangerous.


    > ³http://jquery.com/

    ³⁴http://php.net/manual/en/language.namespaces.definitionmultiple.php'
