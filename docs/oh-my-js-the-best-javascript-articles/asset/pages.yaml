  md: '# JavaScript Files


    JavaScript programs should be stored in and delivered as .js files.


    JavaScript code should not be embedded in HTML unless the code is specific to
    a single session. In HTML adds significantly to pageweight with no opportunity
    for mitigation by caching and compression.


    <script src=filename.js> tags should be placed as late in the body as possible.
    This reduces the effects of delays imposed by script loading on other page components.
    There is no need to use the language or type attributes. It is the server, not
    the script tag, that determines the MIME type.


    # Indentation


    The unit of indentation is four spaces. Use of tabs should be avoided because
    (as of this writing in the 21st Century) there is still not a standard for the
    placement of tabstops. The use of spaces can produce a larger filesize, but the
    size is not significant over local networks, and the difference is eliminated
    by minification.


    # Line Length


    Avoid lines longer than 80 characters. When a statement will not fit on a single
    line, it may be necessary to break it. Place the break after an operator, ideally
    after a comma. A break after an operator decreases the likelihood of a copy-paste
    error will be masked by semicolon insertion. The next line should be indented
    8 spaces.


    # Comments


    Be generous with comments. It is useful to leave information that will be read
    at a later time by people (possibly yourself) who will need to understand what
    you have done. The comments should be well-written and clear, just like the code
    they are annotating. An occasional nugget of humor might be appreciated. Frustrations
    and results will not.


    It is important that comments be kept up-to-date. Erroneous comments can make
    programs even harder to read and understand.


    Make comments meaningful. Focus on what is not immediately visible. Don’t waste
    the reader’s time with stuff like


    ```

    i = 0; // Set i to zero.

    ```


    Generally use line comments. Save block comments for formal documentation and
    for commenting out.


    > http://yuiblog.com/blog/2006/03/06/minification-v-obfuscation/'
