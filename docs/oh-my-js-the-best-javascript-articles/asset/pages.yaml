  md: '# JavaScript Fundamentals


    warning if a required new is omitted. Bad things can happen if new is not used,
    so the capitalization convention is the only defense we have.


    Global variables should be in all caps. (JavaScript does not have macros or constants,
    so there isn’t much point in using all caps to signify features that JavaScript
    doesn’t.)


    # Statements


    # Simple Statements


    Each line should contain at most one statement. Put a ; (semicolon) at the end
    of every statement. Note that an assignment statement which is assigning a function
    literal or object literal is still an assignment statement and must end with a
    semicolon.


    JavaScript allows any expression to be used as a statement. This can mask some
    errors, particularly in the presence of semicolon insertion. The only expressions
    that should be used as statements are assignments and invocations.


    # Compound Statements


    Compound statements are statements that contain lists of statements enclosed in
    { } (curly braces).


    +   - The enclosed statements should be indented four more spaces.

    - The { (left curly brace) should be at the end of the line that begins the statement.

    - The } (right curly brace) should begin a line and be indented to align with
    the beginning of the line containing the matching { (left curly brace).

    - Braces be used around all statements, even single statements, when they are
    part of a control structure, such as an if or for statement. This makes it easier
    to add statements without accidentally introducing bugs.


    # Labels


    Statement labels are optional. Only these statements should be labeled: while,
    do, for, switch.


    ```

    return Statement

    ```


    A return statement with a value should not use ( ) (parentheses) around the value.
    The return value expression must start on the same line as the return keyword
    in order to avoid semicolon insertion.'
