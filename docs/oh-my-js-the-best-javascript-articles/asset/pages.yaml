  md: '# heatmap.js


    **heatmap.js**

    Heatmap.js is a JavaScript library used to generate web heatmaps with the html5canvas
    element based on your data.

    Heatmap instances contain a store in order to colorize the heatmap based on relative
    data, which if you''re adding only a single dataset to the store will be displayed
    on the canvas. For high speed, and efficiency, we recalculate. The heatmaps are
    fully customizable - you welcome to choose your color gradient, intensity its
    opacity, datapoint radius and more.


    Contributions on github and feedback is very appreciated. If you have any questions
    or suggestions, please let me know.


    If you''d like to learn how heatmap.js works there is an article about the inner
    life of heatmap.js


    # What is a heatmap?


    You''ve never heard of heatmaps? No problem! A heatmap is a graphical representation
    of datapoints with differing frequency, yellow spots on a heatmap are highly frequent
    spots and blue ones are less frequent spots. For a more detailed explanation check
    wikipedia


