  md: "# Patterns and Code Organization\n\nAnimations in the browser are also asynchronous,\
    \ so this is also a common source of confusion.\nI'm not going to go into detail\
    \ here, but you need to treat animations much like ajax requests in the way you\
    \ handle them via callbacks. I'm not really an expert on the subject so please\
    \ take a look at the `jQuery.animate() method()`.\n\n# Simple Inheritance in JavaScript\n\
    \nGrosly simplified, JavaScript clones objects to extend them, while PHP, Ruby,\
    \ Python and Java use and extend classes. In JavaScript you have something called\
    \ a prototype, and every object has one. In fact, functions, strings, numbers\
    \ and objects have a common ancestor, `Object`. There are two things about prototype\
    \ to remember: blueprints and chains.\n\nEach prototype is basically an object\
    \ in itself that describes properties available when creating an instance of an\
    \ object. The prototype chain allows prototypes to extend other prototypes. In\
    \ fact, prototypes can have prototypes. When a method or attribute does not exist\
    \ on an object instance, then it is looked for that object's `prototype`, and\
    \ the prototypes' `prototype`, and so until it finally reaches `undefined` if\
    \ no such property exists.\n\nThankfully, beginners generally do not need to mess\
    \ with this stuff at all, since it is easy enough to create an object literal\
    \ and append properties to it at runtime.\n\n```\nvar obj = {};\nob.newFunction\
    \ = function() {\n  console.log('I am a dynamic function');\n}\nob.newFunction();\n\
    ```\n\nAn easy way to extend objects that I use all the time is `jQuery.extend()`\n\
    \n```\nvar obj = {\n  a: 'i am a lonely property'\n}\nvar newObj = {\nb: function()\
    \ {\n  return 'i am a lonely function'\n}\n}\n```\n\n> http://api.jquery.com/animate/"
