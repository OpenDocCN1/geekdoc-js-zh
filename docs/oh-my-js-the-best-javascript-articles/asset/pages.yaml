    \ optimizer that knows how to convert these into the normalized dependency array\
    \ form, like the RequireJS optimizer⁵³.\n\nSince the number of browsers that cannot\
    \ support this toString() scanning is very small, it is safe to use this shared\
    \ forms for all your modules, particularly if you like to line up the dependency\
    \ names with the variables that will hold their module values.\n\n# CommonJS Compatibility\
    \ § 8\n\nEven though this sighed form is referred to as the \"simplified CommonJS\
    \ wrapping\", it is not 100% compatible with CommonJS modules. However, the cases\
    \ that are not supported would likely break in the browser anyway, they generally\
    \ assume synchronous loading of dependencies.\n\nMost CJS modules, around 95%\
