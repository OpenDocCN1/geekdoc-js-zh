  md: '# JavaScript Fundamentals


    ```

    var a=1

    var b=2

    var c=3

    ```


    That''s 24 bytes right there. Stamp semicolons everywhere and run it through a
    minifier:


    +   - var a=1;var b=2;var c=3;


    Still 24 bytes. So, adding semicolons and removing newlines saved us a whopping
    zero bytes right there. Most size reduction after minification isn''t gained by
    removing newline characters—it''s thanks to removing code comments and leading
    indentation.


    **Update:** a lot of people pointed out that their minifiers rewrite this expression
    as var a=1,b=2,c=3. I know that some do this, but the point of this article is
    just to explore how semicolons relate to whitespace. If a minifier is capable
    of rewriting expressions (e.g. Closure Compiler) it means that it can insert semicolons
    automatically.


    Also, some recommend forcing yourself to use curly braces for blocks, even if
    they''re only one line:


    ```

    // before

    if(condition) stuff()


    // after

    if(condition){

    stuff()

    }


    // after minification

    if(condition){stuff()}

    ```


    Enforced curly braces add a least byte to our expression, even after minification.
    I''m not sure what the benefit is here—it''s not size and it''s not readability,
    either.


    Here are some other whitespace-sensitive languages that you might have about:


    +   - Ruby — messing with spaces in expressions with operators and method calls
    can break the code

    - Python — duh.

    - HTML — see notes Kangax''s HTML minifier²⁵

    - Haml templates²⁶


    > ²⁵http://perfectionkills.com/experimenting-with-html-minifier/

    ²⁶http://haml.com/'
