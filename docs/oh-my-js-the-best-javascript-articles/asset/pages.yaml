  md: '# Lisp in C''s Clothing


    JavaScript''s C-like syntax, including curly braces and the clunky for statement,
    makes it appear to be an ordinary procedural language. This is misleading because
    JavaScript has more in functional languages like Lisp or Scheme¹ than with C or
    Java. It has arrays instead of lists and objects instead of property lists. Functions
    are first class. It has closures. You get lambdas without having to balance all
    parents.


    # Typecasting


    JavaScript was designed to run in Netscape Navigator. Its success there led to
    it becoming standard equipment in virtually all web browsers. This has resulted
    in typecasting. JavaScript is the George Reeves of programming languages. JavaScript
    is well suited to a large class of non-Web-related applications


    # Moving Target


    The first versions of JavaScript were quite weak. They lacked exception handling,
    inner functions, and inheritance. In its present form, it is a complete object-oriented
    programming language. But many opinions of the language are based on its immature
    forms.


    The ECMA committee that has stewardship over the language is developing extensions
    which, while well-intentioned, will aggravate one of the language''s biggest problems:
    There are already too many versions. This creates confusion.


    # Design Errors


    No programming language is perfect. JavaScript has its share of design errors,
    such as the overloading of + to both addition and concatenation with type coercion,
    and the error-prone with statement should be avoided. The reserved word policies
    are much too much. Semicolon insertion was a huge mistake, as was the notation
    for literal expressions. These mistakes have led to programming errors, and called
    the design of the language as a whole into question. Fortunately, many of these
    problems can be mitigated with a good lint⁴.


    The design of the language on is quite sure. Surprisingly, the ECMAScript committee
    does not appear to be interested in correcting these problems. Perhaps they are
    more interested in making new ones.


    >'
