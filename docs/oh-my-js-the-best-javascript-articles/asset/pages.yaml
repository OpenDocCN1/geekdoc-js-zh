  md: '# Patterns and Code Organization


    These cases are handled by the callback-require54, require([moduleName], function
    (){}) normally present in AMD loaders.


    The AMD execution model is better aligned with how ECMAScript Harmony modules
    are being specified. The CommonJS modules that would not work in an AMD wrapper
    will not work as a Harmony module. AMD''s code execution behavior is more future
    compatible.


    # Verbosity vs. Usefulness


    One of the criticisms of AMD, at least compared to CJS modules, is that it requires
    a level of indent and a function wrapping.


    But here is the plain truth: the perceived extra typing and a level of indent
    to use AMD does not matter. Here is where your time goes coding:


    +   - Thinking about the problem.

    - Reading code.


    Your time coding is mostly spent thinking. While fewer words are generally preferable,
    there is a limit to that approaching off, and the extra typing in AMD is not that
    much.

    Most web developers use a function wrapper to avoid polluting the page with globals.
    Seeing a function wrapped around functionality is a very common sight and does
    not add to the reading cost of a module.


    There are also hidden costs with the CommonJS format:


    +   - the tooling dependency cost

    - edge cases that break in browsers, like cross domain access

    - worse debugging, a cost that continues to add up over time


    AMD modules require less tooling, there are fewer edge cases issues, and better
    debugging support.

    What is important: being able to share code with others. AMD is the lowest energy
    pathway to that goal.


    Having a working, easy to debug module system that today''s browsers means real
    world experience in making the best module system for JavaScript in the future.

    AMD and its related APIs, have shown the power for any future JS module system:


    +   - Returning a function as the module value, particularly a constructor function,
    leads to better API design. Node module.exports to allow this, but being able
    to use "return function()" is much cleaner. It means not having to get a handle
    on "module" to do module.exports, and it is a clearer code expression.


