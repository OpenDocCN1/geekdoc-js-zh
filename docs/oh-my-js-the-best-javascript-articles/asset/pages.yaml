    This is most useful when you need a raw function to pass as a callback:


    ```

    1 var person = {

    2   name: "Alex Russell",

    3   hello: function() { console.log(this.name + " says hello world"); };

    4 }

    5n6("#some-div").click(person.hello.bind(person));

