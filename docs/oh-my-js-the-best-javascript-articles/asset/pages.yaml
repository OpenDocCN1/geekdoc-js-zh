- img_proc: true
  md: "```\nvar latestKnownScrollY = 0;\nfunction onScroll() {\n  latestKnownScrollY\
    \ = window.scrollY;\n}\n```\n\nWe're in a better place: onScroll runs whenever\
    \ the browser chooses to execute it, but all we're doing is storing the window's\
    \ scroll position. This code could run once, twenty or a hundred times before\
    \ we try to use the value in our animation and it wouldn't matter. The point is\
    \ that we're keeping a track of the value but it's not triggering potentially\
    \ unnecessary calls. If your draw call is expensive then you'll really benefit\
    \ from avoiding those extra calls.\n\nThe other part of this change is to use\
    \ requestAnimationFrame to handle the visual updates at the most convenient time\
    \ for the browser:\n\n```\nfunction update() {\n  requestAnimationFrame(update);\n\
    \  var currentScrollY = latestKnownScrollY;\n  // read offset of DOM elements\n\
    \  // and compare to the currentScrollY value\n  // then apply some CSS classes\n\
    \  // to the visible items\n}\n\n// kick off\nrequestAnimationFrame(update);\n\
    ```\n\nWe're just pushing the latest value from lastKnownScrollY when we need\
    \ it and discarding everything else. If you need to capture all the values since\
    \ the last draw you could use an array and push all the values captured in onScroll\
    \ onto it. When the time comes to do the drawing you could average the value or\
    \ whatever's most appropriate. In this case we're keeping it simple and only tracking\
    \ the last value we captured.\n\nWhat else can we do? Well for one thing we are\
    \ constantly running requestAnimationFrame and that's not necessary if we haven't\
    \ just scrolled since nothing will have changed. To fix that we have the onScroll\
    \ initiate the requestAnimationFrame:"
