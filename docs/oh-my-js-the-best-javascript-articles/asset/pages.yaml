    \n# CommonJS §3\n\n```\nvar $ = require('jquery');\nexports.myExample = function\
    \ () {};\n```\n\nThe original CommonJS (JS) list¹ participants bound to work out\
    \ a module format that worked today's JavaScript language, but was not necessarily\
