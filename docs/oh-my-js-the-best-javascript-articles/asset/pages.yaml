  md: "# Parameters, Depth, and Statements\n\nBy reducing the number of parameters,\
    \ the number of nesting, and the number of statements in your function can dramatically\
    \ increase the readability and modularity of your code.\n\nThe following piece\
    \ of code shows using the maxparams, maxdepth, and maxstatements to warn of possible\
    \ issue with our functions.\n\n```\n/*jshint maxparams:3, maxdepth:2, maxstatements:5\
    \ */\n/*global console:false /\n\n(function( undefined) {\n  \"use strict\";\n\
    \n  function testi(arg1, arg2, arg3, arg4) {\n    console.log(\"too many parameters!\"\
    );\n    if (arg1 === 1) {\n      console.log(arg1);\n      if (arg2 === 2) {\n\
    \        console.log(arg2);\n        if (arg3 === 3) {\n          console.log(\"\
    too much nesting!\");\n          console.log(arg3);\n          console.log(arg4);\n\
    \        }\n      }\n    }\n    console.log(\"too many statements!\");\n  }\n\
    }\n\ntesti(1, 2, 3, 4));\n```\n\nJSHint gives an error that too many parameters\
    \ were used because we limited maxparams to 3 and the code accepted 4 parameters.\
    \ An error occurred because the depth of logic is too deep because we limited\
    \ it to a maxdepth of 2. We will also get an error about the number of lines in\
    \ our function because we limited maxstatements to 5 and we have many more than\
    \ that.\n\n# Cyclomatic Complexity\n\nA less commonly known software metric used\
    \ to evaluate functions is Cyclomatic Complexity. Like it sounds, it's purpose\
    \ is to calculate the overall intricacy of a function and to give a score that\
    \ reflects it's complexity."
