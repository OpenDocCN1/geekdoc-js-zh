    # Promises\n\nFinally we get to our final destination. Promises are a very powerful\
    \ tool, but they are the least understood.\n\nCode using promises may look like\
    \ this:\n\n```\nfinder([1,2])\n  .then(function(records) {\n    do something\n\
    \  });\n```\n\nThis will vary widely depending on the promises library you use,\
    \ in this case I am using when.js⁴².\n\n# Setup\n\nOut finder finder(records)\
    \ and processor functions look like this:\n\n```\nfunction finder(records) {\n\
    \  var deferred = when.defer();\n  setTimeout(function () {\n    records.push(3,\
    \ 4);\n    deferred.resolve(records);\n  }, 500);\n  return deferred.promise;\n\
    }\nfunction processor(records) {\n  var deferred = when.defer();\n  setTimeout(function\
    \ () {\n    records.push(5, 6);\n    deferred.resolve(records);\n  }, 500);\n\
    \  return deferred.promise;\n}\n```\n\nEach function creates a deferred object\
    \ and returns a promise. Then it resolves the deferred when the results arrive.\n\
    \n> *⁴²https://github.com/cujojs/when"
