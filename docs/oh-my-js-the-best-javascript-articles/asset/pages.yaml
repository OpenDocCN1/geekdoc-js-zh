  md: "# Variable Declarations\n\nAll variables should be declared before used. JavaScript\
    \ does not require this, but doing so makes the program easier to read and makes\
    \ it easier to detect undeclared variables that may become implied globals^1.\
    \ Implied global variables should never be used.\n\nImplied global variables should\
    \ never be used.\n\nThe var statements should be the first statements in the function\
    \ body.\n\nIt is preferred that each variable be given its own line and comment.\
    \ They should be listed in alphabetical order.\n\n```\nvar currentEntry;   //\
    \ currently selected table entry\nvar level;          // indentation level\nvar\
    \ size;           // size of table\n```\n\nJavaScript does not have block scope,\
    \ so defining variables in blocks can confuse programmers who are experienced\
    \ with other C family languages. Define all variables at the top of the function.\n\
    Use of global variables should be minimized. Implied global variables should never\
    \ be used.\n\n# Function Declarations\n\nAll functions should be declared before\
    \ they are used. Inner functions should follow the var statement. This helps make\
    \ clear what variables are included in its scope.\n\nThere should be no space\
    \ between the name of a function and the ( (left parenthesis) of its parameter\
    \ list. There should be one space between the ) (right parenthesis) and the {\
    \ (left curly brace) that begins the statement. The body itself is indented four\
    \ spaces. The } (right curly brace)\n\n```\nfunction outer(c, d) {\n    var e\
    \ = c *\n\n    function inner(a, b) {\n        return (e * a) + b;\n    }\n\n\
    \    return inner(0, 1);\n}\n```\n\nThis convention works well with JavaScript\
    \ because in JavaScript, functions and object literals can be placed anywhere\
    \ that an expression is allowed. It provides the best readability with inline\
    \ functions and complex structures.\n\n> ^1http://yuyblog.com/blog/2006/06/01/global-domination/"
