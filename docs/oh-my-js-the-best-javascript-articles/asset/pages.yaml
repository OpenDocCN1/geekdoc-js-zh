  md: 'activities should be non-blocking (for reasons we''ll explain later). This
    means that all HTTP requests, database queries, file I/O, and so on, do not halt
    execution until they return. Instead they run independently and emit an event.js
    when the data is available.


    This means programming in Node.js has lots of callbacks dealing with kinds of
    I/O and then initiating callbacks for other kinds of I/O. This is a very different
    from browser programming. There is still a certain amount of linear setup, but
    the bulk of the code dealing with callbacks.


    Event drivenBecause these different programming styles, we need to look for patterns
    to help us effectively program on the server. That with the event loop, let''s
    take a look at that in in more depth.


    I think that most people intuitively get event-driven programming because its
    like everyday life. Imagine you are cooking. You are chopping a bell pepper and
    a pot starts to boil. You finish the slice since you are doing, and then turn
    the stove. In daily life, we are used to having sorts of internal callbacks for
    dealing with events, and yet, JavaScript we only do one thing at a time.


    Yes, yes I can see you rubbing your tummy and patting your head at the same time,
    we do not. But, if you try to do any serious activities at the same time, it goes
    pretty quickly. This is like JavaScript. It''s getting at events drive the action,
    but it is "single-threaded" so only one thing happens at once.


    Another way to think about this event loop is a post (or mail). When our event-loop
    postman gets a letter is an event. He has a stack of events to deliver in order.
    For each letter (event) the postman gets, he walks to the route to deliver the
    letter. The route is the callback function assigned to that (sometimes more than
    one). However, critically, our mailman has a single set of events, he can only
    walk a single code path at once.


    Sometimes, while the postman is walking a route someone will give him another
    letter. This is because the callback function he code has emitted an event. In
    this case the postman delivers the new message immediately (after all gave to
    him directly instead of going via the post office so it must be urgent). The postman
    will diverge from his current code path and walk the code path to deliver the
    new event. He then carries on walking the original event that emitted the event
    he walked.


    Let''s look at another example. Let''s give the postman to deliver a letter that
    requires a gate to be open. He gets the gate and finds it closed, so he waits
    and tries again, and again. He''s trapped in an endless loop waiting for the gate
    to open. But if there is a letter on the stack that will ask someone to open the
    gate so the postman can get through, surely that will solve things, right?


    Unfortunately it won''t, the postman will never deliver the letter because he
    stuck waiting endlessly for the gate to open. This is because the event that opens
    the gate is external from the current event callback. If we emit the event from
    within a callback, we already know our postman will go and deliver that letter
    before carrying on. However, when events are external to the currently executing
    piece of code, they will not be called until that piece of code has been fully
    evaluated to its conclusion.'
