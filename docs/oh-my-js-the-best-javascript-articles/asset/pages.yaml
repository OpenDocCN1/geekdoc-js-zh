  md: 'Patterns and Code Organization


    50


    Whenever I find myself building something with a potential for reuse, I break
    it out into a module-based jQuery plugin. The best part about this approach is
    that it forces you to use–and test–the code you write. By using something as you
    build it, you’ll quickly identify strengths, discover shortcomings, and plan changes.


    This process leads to battle-tested code for open-source contributions, or to
    be so and distributed. I’ve released my (mostly) polished plugins as open-source
    projects on GitHub⁸.


    Even if you aren''t building something to be released in the wild, it’s still
    important to think the design of your code. Your future self will thank you.


    # Why AMD?


