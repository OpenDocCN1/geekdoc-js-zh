  md: 'Node.js


    Some people saw Connect and they said, "this code can be even easier". So they
    built Expresss. (Actually, it seems like they saw Sinatra[^192] and stole it.)


    # # Top layer: Express


    We''ve finally arrived at the third act of our nerdy quest. We''re at the peak
    of our abstraction mountain. There is a beautiful sunset. Your long, golden locks
    wave in the cool breeze.


    Just like Connect extends Node, Express extends Connect. The beginning looks very
    similar to Connect:


    ```

    var express = require("express");

    var http = require("http");

    var app = express();

    ```


    And so does the end:


    ```

    http.createServer(app).listen(1337);

    ```


    The middle is what''s different. Where Connect gives you one cool feature (middleware),
    I think that Express gives you three cool features: routing, better request handlers,
    and views. Let''s start with routing.


    # # Cool feature 1: routing


    Routing is a way to map different requests to specific handlers. In many of the
    above examples, we had a homepage and an about page and a 404 page. We''d basically
    do this with a bunch of if statements in the examples.


    But Express is smarter than that. Express gives us something called "routing"
    which I think is better explained with code than with English:


    > [192]:http://www.sinatrab.com/'
