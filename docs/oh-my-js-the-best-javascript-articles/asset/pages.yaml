    \ document.querySelector('form')\nform.onsubmit = function(submitEvent) {\nvar\
    \ name = document.querySelector('input').value\nrequest({\\n  uri: \"http://example.com/upload\"\
    ,\n  body: name,\n  method: \"POST\",\\  function(err, response, body) {\n  var\
    \ statusMessage = document.querySelector('.status')\n  if (err) return statusMessage.value\
    \ = err\n  statusMessage.value = body\n}\n}\n```\n\nThis code has two anonymous\
    \ functions. Let's get them names!\n\n```\nvar form = document.querySelector('form')\n\
    form.onsubmit = function formSubmit(submitEvent) {\nvar name = document.querySelector('input').value\n\
    request({\\n  uri: \"http://example.com/upload\",\n  body: name,\n  method: \"\
    POST\",\n  function(err, response, body) {\n  var statusMessage = document.querySelector('.status')\n\
    \  if (err) return statusMessage.value = err\n  statusMessage.value = body\n}\n\
    }\n```\n\nAs you can see naming functions is super easy and does some nice things\
    \ to your code:\n\n+   - makes code easy to read\n- when exceptions happen you\
