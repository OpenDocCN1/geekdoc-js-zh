    It''s important to note that anything that works in the Node.js server also works
    in middleware. For example, if you want to inspect req.method, it''s right there.


    While you can write your own, Connect comes with a bunch of cool middleware and
    a bunch of third-party middleware too. Let''s remove our logger and use the one
    built into Connect!


