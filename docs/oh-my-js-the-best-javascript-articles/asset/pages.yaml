  md: '# Testing


    # Leaner, Meaner, Faster Animations with

    requestAnimationFrame


    Original Article


    http://www.html5rocks.com/en/tutorials/speed/animations


    Paul Lewis, html5rocks.com*

    ^*http://www.html5rocks.com


    It''s a fair bet you do some animation work in your time as a developer, whether
    that''s smaller

    UI effects or large interactive canvas pieces. Chances you''re also come across
    requestAnimationFrame,

    or rAF (if we say raff around these parts), and hopefully you''ve had a chance
    to use it in your

    Projects. In case you don''t know, requestAnimationFrame is the browser''s native
    way of handling

    y animations. Because rAF is specifically designed to deal with animation and
    rendering, the

    browser can schedule it at the most appropriate time and, if we play our cards
    right, it will help us

    get a buttery smooth 60 frames per second.


    What we want to do in this article is outline some additional ways to ensure you''re
    getting the

    maximum benefit from your animation code. Even if you''re using requestAnimationFrame
    there are

    other ways you can end up with bottlenecks in your animations. At 60 frames per
    second each

    frame that you draw is 16.67ms to get everything. That''s not a lot, so every
    optimisation

    counts!


    TLDR Decouple your events from animations; animations that result in reflow-

    paint loops; your rAF calls to expect a high resolution timestamp as the first

    parameter; only rAF when you have visual updates to do.


    # Debouncing Scroll Events


    Debouncing is the process of decoupling your animation from any inputs that affect
    it. Take, for

    example, an effect that is triggered when you scroll the page. The effect might
    check if some DOM

    elements are visible to the user and, then they, apply some CSS classes to those
    elements.'
