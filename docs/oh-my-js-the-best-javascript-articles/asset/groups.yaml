    \nThis is extremely useful, because the default value of this in anonymous callbacks\
    \ is not particularly useful, but it can give beginners to JavaScript the impression\
    \ that this is, in general, a strange, often mutated concept that is hard to reason\
    \ about.\n\nIf you understand the basic rules for wrapping a sugary call into\
    \ a desugared func.call(thisValue, ...args), you should be able to navigate the\
    \ so treacherous waters of the JavaScript value this.\n\n# PS: I Cheated\n\nIn\
