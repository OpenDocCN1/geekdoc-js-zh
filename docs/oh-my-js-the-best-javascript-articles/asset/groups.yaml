    \ have the following form:\n\n```\nif (condition) { statements }\nif (condition)\
    \ { statements } else { statements }\nif (condition) { statements } else if (condition)\
    \ { statements } else { statements }\n```\n\n# for Statement\n\nA for class of\
    \ statements should have the following form:\n\n```\nfor (initialization; update)\
    \ { statements }\nfor (variable in object) { if (filter) { statements } }\n```\n\
    \nThe first form should be used with arrays and loops of a preable number of iterations.\n\
