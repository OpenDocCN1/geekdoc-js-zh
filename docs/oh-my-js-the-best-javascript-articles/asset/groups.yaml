- md: "\n# Node.js\n\nVisit localhost:1337 and you'll see some logging!\n\n# I thirst\
    \ for more\n\nOne could imagine figuring together some middleware to build an\
    \ app. Maybe you'd do it like this:\n\n```javascript\nvar connect = require(\"\
    connect\");\nvar http = require(\"http\");\nvar app = connect();\n\napp.use(connect.logger());\n\
    \n// Homepage\napp.use(function(request, response, next) {\n  if (request.url\
    \ == \"/\") {\n    response.write(200, {\"Content-Type\": \"text/plain\"});\n\
    \    response.end(\"Welcome to the homepage!\\n\");\n    // The middleware stops\
    \ here.\n  } else {\n    next();\n  }\n});\n\n// About page\napp.use(function(request,\
    \ response, next) {\n  if (request.url == \"/about\") {\n    response.write(200,\
    \ {\"Content-Type\": \"text/plain\"});\n    response.end(\"Welcome to the about\
    \ page!\\n\");\n    // The middleware stops here.\n  } else {\n    next();\n \
    \ }\n});\n\n// 404'd!\napp.use(function(request, response) {\n  response.write(404,\
    \ {\"Content-Type\": \"text/plain\"});\n  response.end(\"404 error!\\n\");\n});\n\
    \nhttp.createServer(app).listen(1337);\n```\n\n\"This is ugly! I need to build\
    \ a framework,\" you say. Savage. You're never satisfied, are you? Will there\
    \ ever be enough?\n\nNode.js\n\nSome people saw Connect and they said, \"this\
    \ code can be even easier\". So they built Express. (Actually, it seems like they\
    \ saw Sinatra[^192] and stole it.)\n\n# Top layer: Express\n\nWe've finally arrived\
    \ at the third act of our nerdy quest. We're at the peak of our abstraction mountain.\
    \ There is a beautiful sunset. Your long, golden locks wave in the cool breeze.\n\
    \nJust like Connect extends Node, Express extends Connect. The beginning looks\
    \ very similar to Connect:\n\n```javascript\nvar express = require(\"express\"\
    );\nvar http = require(\"http\");\nvar app = express();\n```\n\nAnd so does the\
    \ end:\n\n```javascript\nhttp.createServer(app).listen(1337);\n```\n\nThe middle\
    \ is what's different. Where Connect gives you one cool feature (middleware),\
    \ I think that Express gives you three cool features: routing, better request\
    \ handlers, and views. Let's start with routing.\n\n# Cool feature 1: routing\n\
    \nRouting is a way to map different requests to specific handlers. In many of\
    \ the above examples, we had a homepage and an about page and a 404 page. We'd\
    \ basically do this with a bunch of if statements in the examples.\n\nBut Express\
    \ is smarter than that. Express gives us something called \"routing\" which I\
    \ think is better explained with code than with English:\n\n> [192]:http://www.sinatrab.com/\n\
    \n```javascript\nvar express = require(\"express\");\nvar http = require(\"http\"\
    );\nvar app = express();\n\napp.all(\"*\", function(request, response, next) {\n\
    \  response.writeHead(200, {\"Content-Type\": \"text/plain\"});\n  next();\n});\n\
    \napp.get(\"/\", function(request, response) {\n  response.end(\"Welcome to the\
    \ homepage!\");\n});\n\napp.get(\"/about\", function(request, response) {\n  response.end(\"\
    Welcome to the about page!\");\n});\n\napp.get(\"**\", function(request, response)\
    \ {\n  response.end(\"404!\");\n});\n\nhttp.createServer(app).listen(1337);\n\
    ```\n\nOoh. That's hot.\nAfter the basic rules, we say \"every request goes through\
    \ this function\" with app.all. And that function looks an awful lot like middleware,\
    \ don't it?\n\nThe three calls to app.get are Express’s routing system. They could\
    \ also be app.post, which respond to POST requests, or PUT, or any of the HTTP\
    \ verbs. The first argument is a path, like /about or /. The second argument is\
    \ a request handler similar to what we've seen before.\n\n[These request handlers]\
    \ behave like middleware, with one exception that these callbacks may invoke next()\
    \ to bypass subsequent routes. This mechanism can be used to perform pre-conditions\
    \ on a route then pass control to matched routes where there is reason to proceed.\
    \ In short: they’re basically middleware like we’ve seen before. They’re just\
    \ functions, just like before. These routes can get smarter, with things like\
    \ this:\n\n```javascript\napp.get(\"/hello/:who\", function(req, res) {\n  res.end(\"\
    Hello, \" + req.params.who + \"\");\n});\n```\n\nRestart your server and visit\
    \ localhost:1337/hello/world for the following message:\n\nHello, world!\n\nThis\
    \ example also uses regular expressions, and you can do lots of other stuff with\
    \ routing. For conceptual understanding, I've said enough. But it gets cooler.\n\
    \n# Cool feature 2: request handling\n\nRouting would be enough, but Express is\
    \ absolutely ruthless. It augments the request and response objects that you're\
    \ passed in request handler. The old stuff is still there, but they add some new\
    \ stuff! Express gives you nicely if you have redirect. Here are some examples:\n\
    \n```javascript\nresponse.redirect(\"/hello\");\nresponse.redirect(\"http://www.example.net\"\
    );\nresponse.redirect(301, \"http://www.example.org\"); // HTTP status code\n\
    ```\n\nThis isn't in Vanilla Node and it's also absent from Connect, but Express\
    \ adds this. It adds things like sendFile lets you send a whole file:\n\n```javascript\n\
    response.sendFile(\"/path/to/anime\");\n```\n\nThe request gets a number of cool\
    \ properties, like ip to get the IP address and files. Conceptually, there's not\
    \ much to know, than the fact that Express extends the request and response. For\
    \ everything, check out the API docs.\n\n# Cool feature 3: views\n\nMore features?\
    \ Oh, Express is blushing. Express can handle views. It's not too bad. Here's\
    \ what the setup looks like:\n\n```javascript\n// Start Express\nvar express =\
    \ require(\"express\");\nvar app = express();\n\n// Set the view directory to\
    \ /views\napp.set(\"views\", __dirname + \"/views\");\n\n// Let's use Jade templating\
    \ language\napp.set(\"view engine\", \"jade\");\n```\n\nThe first block is same\
    \ as always. Then we say \"our views are in a folder called views\". Then we say\
    \ \"Jade\" is a templating language. We'll see how it works in just a second!\
    \ Now, we've set up these views. How do we use them?\n\nLet's start by making\
    \ a file called index.jade and put it into a directory called views. It might\
    \ look like this:\n\n```jade\ndoctype html\nhtml\n\nbody\n  h1 Hello, world!\n\
    \  p= message\n```\n\nThis is basically HTML without the brackets. It should be\
    \ straightforward if you know HTML. The only interesting part is the last line.\
    \ message is a variable! Woah! Where did that come from? I'll tell you.\n\nWe\
    \ need to render the view from Express. Here's what that looks like:\n\n```javascript\n\
    app.get(\"/\", function(request, response) {\n  response.render(\"index\", { message:\
    \ \"I love anime\" });\n});\n```\n\nExpress adds a method to response, called\
    \ render. A bunch of smart stuff, but it basically looks at the view engine and\
    \ views directory (the stuff we defined earlier) and renders index.jade. The last\
    \ step (I suppose it is the first step) is to install Jade, because it's not bundled\
    \ with Express. Add it to your package.json or npm install it.\n\nIf you get all\
    \ of set up, see this page¹⁹⁸. Here's all the source code.¹¹⁹⁹.\n\n- ¹⁹⁸http://jade-lang.com/\n\
    - ¹⁹⁸https://evanhahn.com/wp-uploads/2013/05/anime.html\n- ¹¹⁹⁹https://gist.github.com/EvanHahn/5673968\n\
    \n# Bonus cool feature: everything from Connect and Node\n\nI want to remind that\
    \ Express is built on top of Connect which is built on top of Node. This means\
    \ that all Connect middleware works with Express. This is useful! For example:\n\
    \n```javascript\nvar express = require(\"express\");\nvar app = express();\napp.use(express.logger());\
    \ // Inherited from Connect\napp.get(\"/\", function(req, res) {\n  res.send(\"\
    anime\");\n});\napp.listen(1337);\n```\n\nIf you learn one thing from this post,\
    \ it should be this. If your brain has another fun fact: hippo is pink!\n\n# Actually\
    \ building something\n\nMost of the stuff in this post is conceptual, but let\
    \ me push you in the right direction for building something you want to build.\
    \ I don't want to delve into specifics.\n\nYou can install Express as an executable\
    \ in your terminal. It spits out boilerplate code that's very helpful for starting\
    \ your app. Install it with npm:\n\n```bash\n### You'll probably need sudo for\
    \ this:\nnpm install -g express\n```\n\nIf you need help, use express --help.\
    \ It spits out some options. For example, let's say I want to use EJS template\
    \ and LESS for CSS. My app is called \"MyApp\". Here's what I'd type to get started:\n\
    \n```bash\nexpress --ejs --css less myWeb\n```\n\nIt'll generate a bunch of files\
    \ when you go to that directory and npm install. If you do, you'll have a basic\
    \ running app with node! I recommend looking through the generated files to see\
    \ some boilerplate, and then messing with a bunch. It's hardly a full app, but\
    \ I found it very helpful to poke through these files when getting started.\n\n\
    Also helpful the many official examples on GitHub²⁰⁰.\n\n- If you use CoffeeScript\
    \ like I do²⁰¹, you should know that all of this stuff works with\n\n> ²⁰⁰https://github.com/visionmedia/express/tree/master/examples\n\
    ²⁰¹http://evanhahn.com/i-love-coffeescript/\n"
  mdcn: "\n\n# Node.js\n\n访问 localhost:1337，你将看到一些日志！\n\n# 我渴望更多\n\n人们可以想象一起构思一些中间件来构建一个应用程序。也许你会这样做：\n\
    \n```javascript\nvar connect = require(\"connect\");\nvar http = require(\"http\"\
    );\nvar app = connect();\n\napp.use(connect.logger());\n\n// 首页\napp.use(function(request,\
    \ response, next) {\n  if (request.url == \"/\") {\n    response.write(200, {\"\
    Content-Type\": \"text/plain\"});\n    response.end(\"Welcome to the homepage!\\\
    n\");\n    // 中间件在此停止。\n  } else {\n    next();\n  }\n});\n\n// 关于页面\napp.use(function(request,\
    \ response, next) {\n  if (request.url == \"/about\") {\n    response.write(200,\
    \ {\"Content-Type\": \"text/plain\"});\n    response.end(\"Welcome to the about\
    \ page!\\n\");\n    // 中间件在此停止。\n  } else {\n    next();\n  }\n});\n\n// 404错误！\n\
    app.use(function(request, response) {\n  response.write(404, {\"Content-Type\"\
    : \"text/plain\"});\n  response.end(\"404 error!\\n\");\n});\n\nhttp.createServer(app).listen(1337);\n\
    ```\n\n“这太丑了！我需要构建一个框架，”你说道。真野蛮。你永远都不会满足，不是吗？真的会有足够的一时刻吗？\n\nNode.js\n\n有些人看到了\
    \ Connect，他们说：“这段代码可以写得更简单”。于是他们构建了 Express。（实际上，看起来他们像是看到了 Sinatra[^192] 并偷了它。）\n\
    \n# 顶层：Express\n\n我们终于来到了这场极客之旅的第三幕。我们正处于抽象山的顶点。那里有美丽的日落。你长长的金发在凉凉的风中飘动。\n\n就像\
    \ Connect 扩展了 Node 一样，Express 扩展了 Connect。开头看起来和 Connect 非常相似：\n\n```javascript\n\
    var express = require(\"express\");\nvar http = require(\"http\");\nvar app =\
    \ express();\n```\n\n结尾也是如此：\n\n```javascript\nhttp.createServer(app).listen(1337);\n\
    ```\n\n中间部分是不同的。Connect 给你一个酷炫的功能（中间件），而我认为 Express 给了你三个酷炫的功能：路由、更好的请求处理器和视图。让我们从路由开始。\n\
    \n# 酷炫的功能 1：路由\n\n路由是将不同的请求映射到特定处理程序的方法。在上面的许多示例中，我们有一个首页、一个关于页面和一个 404 页面。在示例中，我们基本上是通过一堆\
    \ `if` 语句来实现这些。\n\n但 Express 比它更智能。Express 给了我们一种被称为“路由”的东西，我认为用代码比用英语解释得更清楚：\n\
    \n> [192]:http://www.sinatrab.com/\n\n```javascript\nvar express = require(\"\
    express\");\nvar http = require(\"http\");\nvar app = express();\n\napp.all(\"\
    *\", function(request, response, next) {\n  response.writeHead(200, {\"Content-Type\"\
    : \"text/plain\"});\n  next();\n});\n\napp.get(\"/\", function(request, response)\
    \ {\n  response.end(\"Welcome to the homepage!\");\n});\n\napp.get(\"/about\"\
    , function(request, response) {\n  response.end(\"Welcome to the about page!\"\
    );\n});\n\napp.get(\"**\", function(request, response) {\n  response.end(\"404!\"\
    );\n});\n\nhttp.createServer(app).listen(1337);\n```\n\n哦。这真酷。\n在基础规则之后，我们通过 `app.all`\
    \ 表示“每个请求都通过这个函数”。那个函数看起来非常像中间件，不是吗？\n\n三次对 `app.get` 调用是 Express 的路由系统。它们也可以是\
    \ `app.post`，响应 POST 请求，或者任何其他 HTTP 方法。第一个参数是路径，如 `/about` 或 `/`。第二个参数是请求处理器，类似于我们之前看到的。[这些请求处理器]\
    \ 行为类似于中间件，唯一的例外是它们可以调用 `next()` 来跳过后续路由。简短来说：它们基本上就是中间件。它们只是函数，和之前一样。这些路由可以变得更智能，像这样：\n\
    \n```javascript\napp.get(\"/hello/:who\", function(req, res) {\n  res.end(\"Hello,\
    \ \" + req.params.who);\n});\n```\n\n重启服务器并访问 localhost:1337/hello/world 查看以下内容：\n\
    \nHello, world!\n\n这个示例也使用了正则表达式，你可以通过路由做很多事情。对于概念理解，我已经说足够了。但它更酷了。\n\n# 酷炫的功能\
    \ 2：请求处理\n\n路由已经足够了，但 Express 是绝对无情的。它增强了请求和响应对象。旧的东西还在那里，但它们添加了一些新东西！如果你有 `redirect`，Express\
    \ 会非常好用。这里有一些示例：\n\n```javascript\nresponse.redirect(\"/hello\");\nresponse.redirect(\"\
    http://www.example.net\");\nresponse.redirect(301, \"http://www.example.org\"\
    ); // HTTP 状态码\n```\n\n这在原生 Node 中没有，Connect 也缺失，但 Express 添加了。像 `sendFile` 这样的东西允许你发送整个文件：\n\
    \n```javascript\nresponse.sendFile(\"/path/to/anime\");\n```\n\n请求有很多酷的属性，比如获取\
    \ IP 地址和文件。从概念上说，没什么需要知道的 Express 扩展了请求和响应。对于一切，请查看 API 文档。\n\n# 酷炫的功能 3：视图\n\n\
    更多功能？哦，Express 在害羞。Express 可以处理视图。这并不糟糕。设置如下：\n\n```javascript\n// 启动 Express\n\
    var express = require(\"express\");\nvar app = express();\n\n// 设置视图目录为 /views\n\
    app.set(\"views\", __dirname + \"/views\");\n\n// 使用 Jade 模板语言\napp.set(\"view\
    \ engine\", \"jade\");\n```\n\n第一部分一直一样。然后说“我们的视图在 views 文件夹中”。然后说“Jade”是一种模板语言。我们稍后会看到它是如何工作的！现在，我们设置了这些视图。如何使用它们？\n\
    \n让我们从创建一个 `index.jade` 文件并将其放入 `views` 目录开始。它可能像这样：\n\n```jade\ndoctype html\n\
    html\n\nbody\n  h1 Hello, world!\n  p= message\n```\n\n这基本上是没有括号的 HTML。如果你熟悉 HTML，这应该很简单。唯一有趣的是最后一行。`message`\
    \ 是一个变量！哇！那是从哪里来的？我会告诉你。\n\n我们需要从 Express 渲染视图。看起来如下：\n\n```javascript\napp.get(\"\
    /\", function(request, response) {\n  response.render(\"index\", { message: \"\
    I love anime\" });\n});\n```\n\nExpress 为 `response` 添加了一个名为 `render` 的方法。有很多智能的东西，但它基本上查看视图引擎和\
    \ views 目录（我们之前定义的）并渲染 `index.jade`。最后一步（我假设是第一步）是安装 Jade，因为它没有随 Express 绑定。将其添加到\
    \ `package.json` 或通过 `npm` 安装。\n\n如果你完成了所有设置，看这个页面¹⁹⁸。这里是源代码¹¹⁹⁹。\n\n- ¹⁹⁸http://jade-lang.com/\n\
    - ¹⁹⁸https://evanhahn.com/wp-uploads/2013/05/anime.html\n- ¹¹⁹⁹https://gist.github.com/EvanHahn/5673968\n\
    \n# 额外来自 Connect 和 Node 的一切\n\n我想提醒 Express 是构建在 Connect 之上的，而 Connect 构建在 Node\
