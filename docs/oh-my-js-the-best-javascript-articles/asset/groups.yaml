    \ 作为值，并提供 `argList` 作为参数值。”\n\n它们的顺序本质上是相同的，只是 `argList` 和 `thisValue` 已经确定了。\n\
    \n我在调用原始 `call` 时稍微作了点作弊，但其含义与我在文章开头提取并逐字引用的规范内容本质上是一样的。\n\n# JavaScript 编程语言代码规范\n\
    \n| 原文链接 | 作者信息 |\n| :--- | :--- |\n| http://javascript.crockford.com/code.html\
    \ | Douglas Crockford, crockford.com |\n\n这是一组用于 JavaScript 编程的编码规范和规则。它的灵感源自\
    \ Sun¹³《Java 编程语言代码规范⁴》。当然，它经过了大量的修改，因为 JavaScript 不是 Java¹⁵。\n\n软件对组织的长期价值与其代码库的质量成正比。在整个生命周期内，一个程序会被许多双手和许多眼睛处理。如果一个程序能够清晰地传达其结构和特征，那么它在不久的将来被修改时崩溃的概率就会降低。\n\
    \n代码规范有助于减少程序的脆弱性。\n\n你所有的 JavaScript 代码都直接面向公众。它们应该始终保持出版级水平。整洁非常重要。\n\n¹³http://www.sun.com/\n\
    ⁴http://java.sun.com/docs/codeconv/\n¹⁵http://javascript.crockford.com/javascript.html\n\
    \n# JavaScript 文件\n\nJavaScript 程序应该存储在 .js 文件中并交付。\n\n除非代码特定于单个会话，否则不应将 JavaScript\
    \ 代码嵌入 HTML 中。在 HTML 中添加代码会显著增加页面权重，且无法通过缓存和压缩来缓解。\n\n`<script src=\"filename.js\"\
    >` 标签应该尽可能放在 `body` 的最后。这可以减少脚本加载对其他页面组件造成的延迟影响。没有必要使用 `language` 或 `type` 属性。决定\
    \ MIME 类型的是服务器，而不是脚本标签。\n\n# 缩进\n\n缩进单位是四个空格。应避免使用制表符（tabs），因为（在本文写作的 21 世纪）还没有制表符位置的标准。使用空格可能会产生更大的文件大小，但在局域网上这种差异并不显著，而且差异可以通过代码压缩（minification）消除。\n\
    \n# 行长度\n\n避免超过 80 个字符的行。当一个语句无法单行显示时，可能需要将其断开。在操作符之后断开，最好在逗号之后。在操作符后断开可以减少因分号插入而掩盖复制粘贴错误的概率。后续应缩进\
    \ 8 个空格。\n\n# 注释\n\n慷慨地写注释。留下一些信息供以后的人（可能是你自己）阅读是有用的，因为他们将需要理解你做了什么。注释应该写得良好且清晰，就像它们所注释的代码一样。偶尔的一点幽默可能会受到欢迎，但挫败感和结果则不会。\n\
    \n保持注释更新至关重要。错误的注释会让程序更难以阅读和理解。\n\n让注释具有意义。关注可见的内容。\n\n```\ni = 0; // 设置 i 为零。\n\
    ```\n\n> http://yuy.com/blog/2006/06/01/global-domination/\n\n# 变量声明\n\n所有变量都应在使用之前声明。JavaScript\
    \ 没有块级作用域，因此在块中定义变量可能会困扰习惯于其他语言的程序员。\n\n```\nvar currentEntry; // 类名数组\nvar level;\
    \        // 缩进\nvar size;         // 表格大小\n```\n\n最好每个变量单独占一行。写在函数顶部。应尽量减少全局变量的使用。\n\
    \n# 函数声明\n\n所有函数都应在使用之前声明。内部函数跟在 `var` 语句之后。函数名与参数列表的 `(`（左括号）之间不应有空格。在 `)`（右括号）和起始语句的\
    \ `{`（左花括号）之间有一个空格。函数体本身缩进四个空格。\n\n```\nfunction outer(c, d) {\n    var e = c;\n\
    \n    function inner(a, b) {\n        return a + b;\n    }\n\n    return inner(0,\
    \ 1);\n}\n```\n\n这种规范在 JavaScript 中效果良好，因为在 JavaScript 中，函数和对象字面量可以放置在任何允许表达式的地方。它为内联函数和复杂结构提供了最佳的可读性。\n\
    \n# JavaScript 基础\n\n```javascript\nfunction getElementsByClassName(className)\
    \ {\n  var results = [];\n  walkDOM(document.body, function (node) {\n    var\
    \ a; // 类名数组\n    var c = node.className; // 节点的 className\n    var i; // 循环计数\n\
    \    // 如果节点有类名，将其拆分为一个简单名称的列表。\n    // 如果其中任何一个与请求的匹配，则将节点添加到结果集中。\n    if (c)\
    \ {\n      a = c.split(' ');\n      for (i = 0; i < a.length; i++) {\n       \
    \ if (a[i] === className) {\n          results.push(node);\n          break;\n\
    \        }\n      }\n    }\n  });\n  return results;\n}\n```\n\n如果函数字面量是匿名的，`function`\
    \ 单词与 `(`（左括号）之间应该有一个空格。如果省略了空格，看起来就像函数的函数名是 `function`，这是一种错误的解读。\n\n```\ndiv.onclick\
    \ = function (e) {\n  return false;\n};\n\nthat = {\n  method: function () {\n\
    \    return this.datum;\n  },\n  datum: 0\n};\n```\n\n应尽量减少全局函数的使用。\n\n当需要立即调用函数时，整个调用表达式应该包装在括号中，以便清楚地表明产生的值是函数的结果而不是函数本身。\n\
    \n"
