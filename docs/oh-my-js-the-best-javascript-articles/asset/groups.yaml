    Inversion of control⁸³ and more specifically dependency injection⁸⁴ have been
    growing in popularity in the JavaScript landscape thanks to projects like Require.js⁸⁵
    and AngularJS⁸⁶. This article is a brief introduction to dependency injection
    and how it fits into JavaScript. It will also demystify the elegant way AngularJS
    implements dependency injection.


    # # Dependency Injection In JavaScript


    Dependency injection facilitates better testing by allowing us to mock dependencies
    in environments so we only test one at a time. It enables us to write more maintainable
    code by decoupling our objects from their implementations.


    With dependency injection, your dependencies are given to your object instead
    of creating it or explicitly referencing them. This means the dependency injector
    can provide a different dependency based on the context of the situation. For
    example, in your tests it might pass a fake version of your services API that
    doesn''t make requests but returns static objects, while in production it produces
    the actual services API.


