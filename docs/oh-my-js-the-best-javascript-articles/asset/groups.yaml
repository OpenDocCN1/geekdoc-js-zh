    # Patterns and Code Organization


    ```

    1 Injector.dependencies = {};

    2 Injector.register = function(name, dependency) {

    3 this.dependencies[name] = dependency;

    4 };

    ```


    All we do is store our dependency by name so the injector knows what to provide
    when certain dependencies are requested. Let''s go ahead and register an implementation
    of Greeter.


    ```

    1 var RobotGreeter = {

    2 greet.function() {

    3 return ''Domo Arigato'';

    4 }

    5 };

    ```


    ```

    6 Injector.register(''Greeter'', RobotGreeter);

    ```


    Now our injector knows what to provide when Greeter is specified as a dependency.


    # Moving Forward


    The building blocks are in place it''s time for the sweet part of this article.
    The reason I wanted to post this article in the first place, the nutrients, the
    punch, the hook, the call toString() with some reflection. This is where the magic
    is, in JavaScript we don''t have to execute a function immediately. The trick
    is to call toString on your function which returns the function as a string, gives
    a chance to preprocess our functions as strings and turn them back into functions
    using the Function constructor, or just execute them with the proper parameters
    after doing some reflection. The latter is exactly what we do here.


    # toString Returns Winning


    ```

    1 var WelcomeController = function (Greeter) {

    2 Greeter.greet();

    3 };

    4 // Returns the function as a string.

    5 var controllable = WelcomeController.toString();

    ```


    You can try it in your console!


    Now that we have the WelcomeController as a string we can do some reflection to
    figure out which dependencies to inject.'
