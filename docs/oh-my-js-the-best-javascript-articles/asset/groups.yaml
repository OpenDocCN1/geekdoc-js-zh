    # JavaScript Fundamentals


    Of course, there''s no need for minification on the server-side. I made this list
    for the sake of the following argument: Whitespace can, and often is, part of
    the (markup) language. It''s not necessarily a bad thing.


    # It''s good coding style


    Also heard as:


    +   - It''s good to have them for the sake of consistency

    - JSLint⁷ will complain

    - Douglas Crockford says so.²⁸


    This is another way of expressing the “everybody is doing it” notion and is used
    by people during online discussion in the (rather common) case of a lack of arguments.


    My advice on JSLint: don''t use it. Why would you use it? If you believed that
    it helps you have less bugs in your code, here''s a new flash: only people can
    detect and solve bugs, not tools. Instead of tools, get more people to look at
    your code.


    Douglas Crockford says “four cases”, and most popular JavaScript libraries are
    set in either tab or two tabs. Communities around different projects are different,
    and that''s just how it should be. As I have said before: let people and shape
    your coding style, not some simple person or tool.


    You might notice that in this article I''m not telling you should be semicolon-free.
    I''m just laying out concrete evidence that you can be. The choice should be yours.


    As for coding styles, they exist so are more readable and easier to understand
    for a group of people in charge of working on it. Think deeply if semicolons actually
    improve the readability of your code. What improves it is whitespace—indentation,
    empty line to separate blocks, spaces to pad out expressions—and variable and
    function naming. Look at some obfuscated code², are there semicolons there. Does
    it help readability? No, but what would really help is a lot of whitespace and
    original variable names.


    # Semicolon insertion bites back in return statements


