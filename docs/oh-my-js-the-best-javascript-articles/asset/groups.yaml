    # The Secrets of Node''s Success¹³¹


    In the short time since its initial release in late 2009, Node.js has captured
    the interest of thousands of experienced developers, grown a package manager and
    a corpus of interesting modules and applications, and even spawned a new of start-ups.
    What is it about this technology that makes it interesting to developers? And
    why has it succeeded while other server-side JavaScript implementations linger
    or or fail altogether?


    # Asynchronous Code Design with Node.js¹³²


    The asynchronous-driven I/O of Node.js is currently evaluated by many enterprises
    as a high-performance alternative to the traditional synchronous I/O of multi-threaded
    application server. The asynchronous nature means that enterprise developers have
    to learn new programming patterns, and unlearn old ones


