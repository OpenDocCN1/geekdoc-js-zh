  - "[PAGE 40]\n\nPatterns and Code Organization\n\nmakes a lot of sense these days\
    \ considering it's rebirth and widespread availability. This blog by no means\
    \ attempts to be a complete panacea, but hopefully it will help a few people understand\
    \ some of the fundamentals before being forced into writing awful JavaScript code,\
    \ secretly hoping to get reassigned to a back project buried in database queries\
    \ in happy PHP land.\n\n# Asynchronous JS: Callbacks, Listeners, Control Flow\
    \ Libs and Promises\n\n![](img/5f4a286ef99041bf37736af72f6b8b9b_40_0.png)\n\n\
    When it comes to dealing asynchronous development in JavaScript there are many\
    \ tool you can use. This post explains four of these tools and what their advantages\
    \ are. These are Callbacks, Listeners, Control Flow Libraries and Promises.\n\n\
    # Example Scenario\n\nTo illustrate the use of these four tools, let's create\
    \ a simple example scenario.\n\nLet's say that we want to find some records, process\
    \ them and finally return the processed results. Both operations (find and process)\
    \ are asynchronous.\n\n# Callbacks\n\nLet's start with callback pattern, this\
    \ is the most basic and the best known pattern to deal with async programming.\n\
    \nA callback looks like this:\n\n```\nfinder([1, 2], function(results) {\n  .do\
    \ something\n});\n```\n\nIn the callback pattern we call a function that will\
    \ do the asynchronous operation. One of the parameters we pass is a function that\
    \ will be called when the operation is done."
  - "[PAGE 41]\n\n# Setup\n\nIn order to illustrate how they work we need a couple\
    \ of functions that will find and process the records. In the real world these\
    \ functions will make an AJAX request and return the results, but for now let's\
    \ just use timeouts.\n\n```\nfunction finder(records, cb) {\n  setTimeout(function\
    \ () {\n    records.push(3, 4);\n    cb(records);\n  }, 1000);\n}\nfunction processor(records,\
    \ cb) {\n  setTimeout(function () {\n    records.push(5, 6);\n    cb(records);\n\
    \  }, 1000);\n}\n```\n\n# Using the callbacks\n\nThe code that consumes these\
    \ functions looks like this:\n\n```\nfinder([1, 2], function (records) {\n  processor(records,\
    \ function(records) {\n    console.log(records);\n  });\n});\n```\n\nWe call the\
    \ first function, passing a callback. Inside this callback we call the second\
    \ function passing another callback.\n\nThese nested callbacks can be written\
    \ more clearly by passing a reference to another function."
- md: "\n## Patterns and Code Organization\n\n```\nfunction onProcessorDone(records)\
    \ {\n  console.log(records);\n}\n\nfunction onFinderDone(records) {\n  processor(records,\
    \ onProcessorDone);\n}\n\nfinder([1, 2], onFinderDone);\n```\n\nIn both case the\
    \ console log above with log [1,2,3,4,5,6]\nWorking example here:\n\n## Pros\n\
    \n- - They are a very well known pattern, so they are familiar thus easy to understand.\n\
    - Very easy to implement in your own libraries / functions.\n\n## Cons\n\n- -\
    \ Nested callbacks will form the infamous pyramid of doom as shown above, which\
    \ can be hard to read when you have multiple nested levels. This is quite easy\
    \ to fix by splitting the functions also as shown above.\n- You can only pass\
    \ one callback for a given event, this can be a big limitation in many cases.\n\
    \nPhoto credit: Brandon Christopher Warren / Foter / CC BY-NC\n\n## Listeners\n\
    \nListeners are also a well known pattern, mostly made popular by jQuery and other\
    \ DOM libraries. A Listener might look like this:\n\n```\nfinder.on('done', function\
    \ (event, records) {\n  // do something\n});\n```\n\nWe call a function on an\
