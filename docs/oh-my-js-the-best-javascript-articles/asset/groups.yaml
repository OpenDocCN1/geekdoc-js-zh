    ⁴http://java.sun.com/docs/codeconv/\n¹⁵http://javascript.crockford.com/javascript.html\n\
    \n# JavaScript Files\n\nJavaScript programs should be stored in and delivered\
    \ as .js files.\n\nJavaScript code should not be embedded in HTML unless the code\
    \ is specific to a single session. In HTML adds significantly to pageweight with\
    \ no opportunity for mitigation by caching and compression.\n\n<script src=\"\
