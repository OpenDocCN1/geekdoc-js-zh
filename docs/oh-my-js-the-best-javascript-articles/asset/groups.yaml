    \ some headers. In our example, we do this:\n\n```\nresponse.writeHead(200, {\
    \ \"Content-Type\": \"text/plain\" });\n```\n\nThis does two things. First, it\
    \ sends HTTP status code¹⁸⁶ 200, which means everything is good. Then, it sends\
    \ some response headers. In this case, we're sending back the plaintext content-type.\
    \ We could send other things like JSON or HTML.\n\n# I thirst for more\n\nYou\
    \ want more? Okay. You asked nicely.\n\nOne could imagine these APIs and turning\
    \ them into something cool. You could do something (sorta) like this:\n\n```\n\
    var http = require(\"http\");\nhttp.createServer(function(req, res) {\n\n// Homepage\n\
    \  if (req.url == \"/\") {\n    res.writeHead(200, { \"Content-Type\": \"text/html\"\
    \ });\n    res.end(\"Welcome to the homepage!\");\n  }\n\n  // About page\n  else\
    \ if (req.url == \"about\") {\n    res.writeHead(200, { \"Content-Type\": \"text/html\"\
    \ });\n    res.end(\"Welcome to the about page!\");\n  }\n});\n```\n\n> ¹⁸⁵nodejs.org/api/http.htmlhttp_response_end_data_encoding\n\
    ¹⁸⁶https://en.wikipedia.org/wiki/List_of_HTTP_status_codes"
  - "[PAGE 115]\n\n# Node.js\n\n```\n// 404'd!\nelelse {\n  res.writeHead(404, { \"\
    Content-Type\": \"text/plain\" });\n  res.send(\"404 error! File not found.\"\
    );\n}\n).listen(1337, \"localhost\");\n```\n\nYou could clean this up and make\
    \ it pretty, or you could be hardcore like the npm.org folks¹¹⁸⁷ and tough it\
    \ out with Vanilla Node. But you could also build a framework. That's Sencha did.\
    \ And you called it.\n\n# Middle layer: Connect\n\nFitting that Connect¹¹⁸ happens\
    \ to be the middle layer of this JavaScript cake, because it calls itself a \"\
    middleware framework for node\". Don't go searching \"middleware\" just yet -\
    \ I'm about to explain it.\n\n# A little bit of Connect code\n\nLet's say we wanted\
    \ to write the \"hello world\" app that we had above, but with Connect this time.\
    \ Don't forget to install Connect (npm install, baby). Once you've done that,\
    \ the app is pretty similar.\n\n```\n// Require the stuff we need\nvar connect\
    \ = require(\"connect\");\nvar http = require(\"http\");\n\n// Build the app\n\
    var app = connect();\n\n// Add some middleware\napp.use(function(request, response)\
    \ {\n  response.writeHead(200, { \"Content-Type\": \"text/plain\" });\n  response.end(\"\
    Hello world!\\n\");\n});\n\n// Start it up!\nhttp.createServer(app).listen(1337);\n\
    ```\n\n> ¹¹⁸⁷ https://github.com/isaacs/npm-www#design-philosophy\n¹¹⁸ http://www.senchalabs.org/connect/"
  - "[PAGE 116]\n\n# Node.js\n\nSo let's step through this.\n\nFirst, we require Connect.\
    \ We require Node's HTTP module just like we did before. We are ready.\n\nThen\
    \ we make a variable called app like we did before, but instead of creating the\
    \ server, we call connect(). What's going on? What is this madness?\n\nWe add\
    \ some middleware - it's just a function. We pass this to app.use(), and this\
    \ function allows an awful lot like the request handlers from above. In fact,\
    \ I copy-pasted it.\n\nThen we create the server and start listening. http.createServer\
    \ takes a function before, so guess what app is just a function. It's a Connect-made\
    \ function that starts going through all the middleware until the end. But it's\
    \ just a request handler like before.\n\n> (Noting that you might see people using\
    \ app.listen(1337), which just defers to http.createServer. This is true in both\
    \ Connect and Express.)\n\nOkay, now I'm going to explain middleware.\n\n# What\
    \ is middleware?\n\nI want to start by saying that Stephen Sugden's description\
    \ of Connect middleware¹⁸⁸ is really good and does a better job than I can. If\
    \ you don't like my explanation, read his.\n\nRemember the request handlers from\
    \ a few sections earlier? Each piece of middleware is a request handler. You start\
    \ by looking at the first request handler, then you look at the next one, then\
    \ the next, and so on.\n\nHere's what middleware basically looks like:\n\n```\n\
    function myFunMiddleware(request, response, next) {\n  // Do stuff with the request\
    \ and response.\n  // When we're all done, call next() to defer to the next middleware.\n\
    \  next();\n}\n```\n\nWhen we start a server, we start at the topmost middleware\
    \ and work our way to the bottom. If we wanted to add simple logging to our app,\
    \ we could do it!\n\n> ¹⁸⁸http://stephensugden.com/middleware_guide/"
