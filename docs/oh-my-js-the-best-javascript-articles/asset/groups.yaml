    \ string \";\n\n//in modern browsers //outputs \" my string \"\nconsole.log(fatString);\
    \ //outputs \"my string\"\nconsole.log(fatString.trim()); //outputs \"my string\"\
    \n\n//in IE 8\nconsole.log(fatString.trim()); //error: Object doesn't support\
    \ property or method 'trim'\n```\n\nSo in the interim, we can use methods like\
    \ jQuery.trim() to do this for us, which I believe will fallback to String.trim()\
    \ if it is available in your browser for increased performance (native browser\
    \ implementations) are faster.\n\nYou might not care or even need to know all\
