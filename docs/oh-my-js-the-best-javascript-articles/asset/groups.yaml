- md: "\n# Lousy Implementations\n\nSome of the earlier implementations of JavaScript\
    \ were quite buggy. This reflected badly on the language. Compounding that, those\
    \ implementations were embedded in horribly buggy web browsers.\n\n# Bad Books\n\
    \nNearly all of the books about JavaScript are quite awful. They contain errors,\
    \ poor examples, and promote bad practices. Important features of the language\
    \ are often explained poorly, or left entirely. I have reviewed dozens of JavaScript\
    \ books, and I can recommend one: JavaScript: The Definitive Guide (5th Edition)\
    \ by David Flanagan. (Attention authors: If you have written a good one, please\
    \ send me a review copy.)\n\n# Substandard Standard\n\nThe official specification\
    \ for the language is published by ECMA. The specification is of extremely poor\
    \ quality. It is difficult to read and very difficult to understand. This has\
    \ been a contributor to the Bad Book problem-authors have been unable to use the\
    \ standard document to improve their own understanding of the language. ECMA and\
    \ the TC39 committee should be deeply embarrassed.\n\n# Amateurs\n\nMost of the\
    \ people writing in JavaScript are not programmers. They lack the training and\
    \ discipline to write good programs. JavaScript has so much expressive power that\
    \ they are able to do useful things in it, anyways. This has given JavaScript\
    \ a reputation of being strictly for the amateurs, that it is not suitable for\
    \ professional programming. This is simply not the case.\n\n# Object-Oriented\n\
    \nJavaScript object-oriented? It has objects which can contain data and methods\
    \ that act upon that data. Objects can contain other objects. It has no classes,\
    \ but it does have constructors which do classes, acting as containers for class\
    \ variables and methods. It does not have class-oriented inheritance, but it does\
    \ have prototype-oriented inheritance.\n\nThe two ways of building up object systems\
    \ are by inheritance (is-a) and by aggregation (has-a). JavaScript does both,\
    \ but its dynamic nature allows it to execute at aggregation.\n\nSome argue that\
    \ JavaScript is not truly object oriented because it does not provide information\
    \ hiding. All members are public.\n\n> http://www.amazon.com/exec/obidos/ASIN/0596101996/rrfdlwideeb\n\
    > http://www.ecma-international.org/publications/standards/Ecma-262.htm\n> http://www.ecma-international.org/\n\
    \n# JavaScript Fundamentals\n\nBut it turns out that JavaScript objects can have\
    \ private variables and private methods. (Click here now to find out.) Of course,\
    \ few understand this because JavaScript is the world's most misunderstood programming\
    \ language.\n\nSome argue that JavaScript is not truly object oriented because\
    \ it does not provide inheritance. it turns out that JavaScript supports not only\
    \ classical inheritance, but other code reuse patterns as well.\n\nCopyright 2001\
    \ Douglas Crockford.¹¹ All Rights Reserved Wrrrld.¹¹\n\n# # Understanding JavaScript\
    \ Function Invocation and \"this\"\n\n## Original Article\nnhttp://yehudakatz.com/2011/08/11/understanding-javascript-function-invocation-and-this\n\
    Yehuda Katz, yehudakatz.com\n\nOver the years, I've seen a lot of confusion about\
    \ JavaScript function invocation. In particular, a lot of people have complained\
    \ that the semantics of 'this' in function invocations is confusing.\n\nIn my\
    \ opinion, a lot of this confusion is cleared up by understanding the core function\
    \ invocation primitive, and then looking at all other ways of invoking a function\
    \ as sugar on top of primitive. In fact, this is exactly how the ECMAScript spec\
    \ thinks about it. In some areas, this post is a simplification of the fact, but\
    \ the basic idea is the same.\n\n# # The Core Primitive\n\nFirst, let's look at\
    \ the core function invocation primitive, a Function's call method[1]. The call\
    \ method is relatively straightforward.\n\n- 1. Make an argument list (argList)\
    \ out of parameters 1 through the end\n- 2. The first parameter is thisValue\n\
    - 3. Invoke the function with this set to thisValue and the argList as its argument\n\
    \nFor example:\n\n> ⁸http://www.crockford.com/private.html\n> ⁹http://javascript.crockford.com/inheritance.html\n\
    > ¹¹mailto:douglas@crockford.com\n> ¹¹¹http://www.crockford.com/\n\n```javascript\n\
    JavaScript Fundamentals\nfunction hello(thing) {\n  console.log(this + \" says\
    \ hello \" + thing);\n}\n```\n\n`hello.call(\"Yehuda\", \"world\") //> Yehuda\
    \ says hello world`\n\nAs you can see, the invoke method with this set to \"Yehuda\"\
    \ and a single \"world\". This is the core primitive of JavaScript function invocation.\
    \ You can think of all other function calls as desugaring to this primitive. (\"\
    desugar\" is to take a convenient syntax and better in terms of a more basic primitive).\n\
    \n- [1] In the ES5 spec¹,², the call method is described in terms of another,\
    \ more low level primitive, it's a very thin wrapper on top of that, so I'm simplifying\
    \ a bit here. See the end of this post for more information.\n\n# Simple Function\
    \ Invocation\n\nObviously, invoking functions with call all the time would be\
    \ pretty annoying. JavaScript allows us to invoke functions directly using the\
    \ pare syntax (hello(\"world\")). When we do that, the invocation desugars:\n\n\
    ```javascript\nfunction hello(thing) {\n  console.log(\"Hello \" + thing);\n}\n\
    // this:\nhello(\"world\")\n// desugars to:\nhello.call(window, \"world\");\n\
    ```\n\nThis behavior changed in ECMAScript 5 only when using strict mode[2]:\n\
    \n```javascript\n// this:\nhello(\"world\")\n// desugars to:\nhello.call(undefined,\
    \ \"world\");\n```\n\n> ¹http://es5.github.com/\n\n# JavaScript Fundamentals\n\
    \nThe next common way to invoke a method is as a member of the object. Remember\
    \ that it doesn't have a persistent notion of 'this'. It is always set at call\
    \ time based on how it was invoked.\n\n```javascript\nfunction hello(thing) {\n\
    \  console.log(this + \" says hello \" + thing);\n}\n\nperson = { name: \"Brendan\
    \ Eich\" }\nperson.hello = hello;\n\nperson.hello(\"world\") // \"Brendan Eich\
    \ says hello world\"\n```\n\nWait, what happens if we attach to the object dynamically:\n\
    \n```javascript\nfunction hello(thing) {\n  console.log(this.name + \" says hello\
    \ \" + thing);\n}\n\nperson = { name: \"Brendan Eich\" }\nperson.hello = hello;\n\
