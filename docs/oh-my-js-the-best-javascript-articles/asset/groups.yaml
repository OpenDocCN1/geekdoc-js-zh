    \n全局变量应该使用全大写。（JavaScript 没有宏或常量，因此使用全大写来表示 JavaScript 并不具备的特性并没有太大意义。）\n\n# 语句\n\
    \n# 简单语句\n\n每行最多包含一条语句。在每个语句的末尾加上一个 ;（分号）。请注意，赋值函数字面量或对象字面量的赋值语句仍然是赋值语句，并且必须以分号结尾。\n\
    \nJavaScript 允许将任何表达式用语句。这可能会掩盖某些错误，特别是在存在分号自动插入（semicolon insertion）的情况下。只有赋值和调用应该作为语句使用。\n\
    \n# 复合语句\n\n复合语句是指包含在 { }（大括号）中的语句列表的语句。\n\n- 包含的语句应缩进四个空格。\n- {（左大括号）应该位于语句开始所在行的末尾。\n\
    - }（右大括号）应该另起一行，并缩进以与包含匹配的 {（左大括号）的行对齐。\n- 当语句是控制结构（如 if 或 for 语句）的一部分时，所有语句（即使是单个语句）都应该使用括号包裹。这有助于添加语句而不会意外引入\
    \ bug。\n\n# 标签\n\n语句标签是可选的。只有这些语句应该标记标签：while, do, for, switch。\n\n```\nreturn\
    \ Statement\n```\n\n带有值的 return 语句不应在值周围使用 ( )（括号）。返回值表达式必须与 return 关键字在同一行开始，以避免分号自动插入。\n\
    \n# if 语句\n\nif 类的语句应具有以下形式：\n\n```\nif (condition) { statements }\nif (condition)\
    \ { statements } else { statements }\nif (condition) { statements } else if (condition)\
    \ { statements } else { statements }\n```\n\n# for 语句\n\nfor 类的语句应具有以下形式：\n\n\
    ```\nfor (initialization; update) { statements }\nfor (variable in object) { if\
    \ (filter) { statements } }\n```\n\n第一种形式应用于数组。第二种形式应用于对象。\n注意使用 `hasOwnProperty`\
    \ 方法来区分对象的成员：\n\n```\nfor (variable in object) { if (object.hasOwnProperty(variable))\
    \ { statements } }\n```\n\n# while 语句\n\nwhile 语句应具有以下形式：\n\n```\nwhile (condition)\
    \ { statements }\n```\n\n# do 语句\n\ndo 语句应具有以下形式：\n\n```\ndo { statements } while\
    \ (condition);\n```\n\n# switch 语句\n\nswitch 语句应具有以下形式：\n\n```\nswitch (expression)\
    \ {\ncase statements:\ndefault: statements\n}\n```\n\n# try 语句\n\ntry 类的语句应具有以下形式：\n\
    \n```\ntry { statements } catch (error) { statements } finally { statements }\n\
    ```\n\n# continue 语句\n\ncontinue 语句应具有以下形式：\n\n```\ncontinue;\n```\n\n# 空格\n\n\
    空行通过分隔区域来提高可读性。\n\n# 额外建议\n\n{} 和 []\n\n使用 {} 代替 Object()。使用 [] 代替 Array()。\n\n\
    当成员名称是顺序的使用数组。当名称是任意的使用对象。\n\n# 块作用域\n\nJavaScript 中的块没有作用域。只有函数有作用域。除非复合语句需要，否则不要使用块。\n\
    \n# 赋值表达式\n\n避免在 if 和 while 的条件部分进行赋值。\n\n是\n\n```\nif (a = b) {\n```\n\n正确的语句？还是\n\
    \n```\nif (a == b) {\n```\n\n符合预期？\n\n=== 和 !== 运算符\n\n几乎总是使用 === 和 !== 运算符。避免类型转换。特别是，不要使用\
