    # Conclusion


    That''s it! These are in my opinion the four main tools for dealing with asynchronous
    code. Hopefully I have helped you to understand them better and gave you more
    options for your asynchronous needs.


    # The Design of Code: Organizing JavaScript


    | Original Article |

    | http://alistapart.com/article/the-design-of-code-organizing-javascript |

    | Anthony Colangelo, alistapart.com |

    | http://alistapart.com |


    Great design is a product of care and attention applied to areas that matter,
    resulting in a useful, understandable, and hopefully beautiful user interface.
    But don''t be fooled into thinking that design is left only for designers.


    There is a lot of design in code, and I don''t mean code that builds the user-interface—I
    mean the design of code.


    Well-designed code is much easier to maintain, optimize, and extend, making for
    more efficient developers. That means more focus and energy can be spent on building
    great things, which makes everyone happy—users, developers, and stakeholders.


    There are three high-level, language-agnostic aspects to code design that are
    particularly important.


    +   - System architecture—The basic layout of the codebase. Rules that govern
    various components, such as models, views, and controllers, interact with each
    other.

    - Maintainability—How well can the code be improved and extended?

    - Reusability—How reusable are the application''s components? How easily can each
    implementation of a component be customized?


    In looser languages, specifically JavaScript, it takes a bit of discipline to
    write well-designed code. The JavaScript environment is so forgiving that it''s
    easy to throw bits and pieces everywhere and'
  - '[PAGE 50]


    # Patterns and Code Organization


    still have things work. Establishing system architecture early (and sticking to
    it!) provides constraints to your code base, ensuring consistency throughout.


    One approach I''m found consists of a tried-and-true software design pattern,
    the module pattern, whose extensible structure lends itself to a solid system
    architecture and a maintainable codebase. I like building modules within a jQuery
    plugin, which makes for beautiful reusability, provides robust options, and exposes
    a well-crafted API.


    Below, I''ll walk through how to craft your code into well-organized components
    that can be reused in projects to.


    # The module pattern


    There are a lot of design patterns out, and as many resources on them, Addy Osmani
    wrote an amazing (free!) book on design patterns in JavaScript, which I highly
    recommend to developers of all levels.


    The module pattern is a simple structural foundation that can help keep your code
    clean and organized. A "module" is just a standard object literal containing methods
    and properties, and that simplicity is the best thing to build about it: even
    someone unfamiliar with traditional software design patterns would be able to
    look at and instantly understand how it works.


    In applications that use this pattern, each component gets its own distinct module.
    For example, to build complete functionality, you create a module for the textfield
    and a module for the results list. These two modules work together, but the textfield
    wouldn''t touch the list code, and vice versa.


    Decoupling components is why the module pattern is great for building solid system
    architecture. Relationships within the application are well-defined; anything
    related to the textfield is managed by the textfield, not strewn throughout the
    codebase—result in clear code.


    Another benefit of module-based organization is that it is inherently maintainable.
    Modules can be improved and optimized independently without affecting any other
    part of the application.


    I used the module pattern for the basic structure of jPanelMenu, the jQuery plugin
    I built for off-canvas menu systems. I used that as an example to illustrate the
    process of building a module.


    # Building a module


    To begin, I define three methods and a property that are used to manage the interactions
    of the menu system.


