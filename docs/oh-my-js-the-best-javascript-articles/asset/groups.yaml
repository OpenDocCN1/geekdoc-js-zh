    \n不要使用 \\_（下划线）作为名称的第一个字符。它有时用于表示隐私，但它并不能提供隐私保护。如果隐私很重要，请使用提供私有成员的形式。避免使用表现出能力不足的约定。\n\
    \n大多数变量和函数应该以小写开头。\n\n必须配合 [new](http://yuiblog.com/blog/2006/11/13/javascript)\
