    \ | :--- |\n| http://javascript.crockford.com/code.html | Douglas Crockford, crockford.com\
    \ |\n\nThis is a set of coding conventions and rules for use in JavaScript programming.\
    \ It is inspired by the Sun¹³ Code Conventions for the Java Programming Language⁴.\
    \ It is heavily modified of course because JavaScript is not Java¹⁵.\n\nThe long-term\
