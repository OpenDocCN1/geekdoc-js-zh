    \ `func.call(thisValue, ...args)` 的基本规则，你就应该能够驾驭 JavaScript 中极其险恶的 `this` 值水域。\n\
    \n# 备注：我作弊了\n\n在几处地方，我对实现的细节与规范的字面描述略有不同。可能最重要的图表是我处理 `func.call(\"primitive\"\
