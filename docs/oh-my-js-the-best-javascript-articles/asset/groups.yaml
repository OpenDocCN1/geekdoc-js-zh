- md: "\n# Node.js\n\n# Understanding event loops and writing great code for Node.js\n\
    \nOriginal Article\n\nhttp://developer.yahoo.com/blogs/ydn/part-1-understanding-event-loops-writing-great-code-11401.html\n\
    \nTom Hughes-Croucher, developer.yahoo.com/blogs#\n\nhttp://developer.yahoo.com/blogs\n\
    \nAs usual JSConf.Eu¹⁶⁴ was one of the best conferences I've been to this year.\
    \ It's a delight to hang out with some of the smartest JavaScript coders on the\
    \ planet, and doing it in the very trendy city of Berlin was a nice bonus. There\
    \ are a few great recaps of JSConf¹⁶⁵ so I'm not focusing on instead; I'm going\
    \ to expand the talk I gave\n\nProgramming inside an event loop is something most\
    \ programmers only having a passing familiarity with. Node.js is quickly gaining\
    \ traction as a very popular event loop-based server for JavaScript. It is simple\
    \ as people to write JavaScript on the server, which has access to the HTTP stack,\
    \ TCP file I/O, and databases. However the kind of programs that we write in this\
    \ context tend to be very different from the kind of programs we write for browser-based\
    \ applications or sites.\n\nIn the browser, the bulk of the program tends to be\
    \ involved with setting up the user-interface, and there are some small event\
    \ callbacks that are enacted — most typically, based on user interaction with\
    \ the browser. For example, when the user clicks Submit on a form, we intercept\
    \ the click and validate their submission.\n\nThere is an important point here:\
    \ in more browser programming, programmers are only dealing with events caused\
    \ by the user, and the user can only do so many things at once. Moreover the callbacks\
    \ for these events tend to be very discrete and don't count other events. Some\
    \ libraries, like YUI, have custom event support. But it is often thought of an\
    \ advanced feature.\n\n## On the server\n\n¹⁶⁴http://jsconf.eu/2010/\n¹⁶⁵http://palagut-coding.blogspot.com/2010/09/in-case-you-missed-it-jsconf-2010-day.html\n\
    \nactivities should be non-blocking (for reasons we'll explain later). This means\
    \ that all HTTP requests, database queries, file I/O, and so on, do not halt execution\
    \ until they return. Instead they run independently and emit an event when the\
    \ data is available.\n\nThis means programming in Node.js has lots of callbacks\
    \ dealing with kinds of I/O and then initiating callbacks for other kinds of I/O.\
    \ This is a very different from browser programming. There is still a certain\
    \ amount of linear setup, but the bulk of the code dealing with callbacks.\n\n\
    ### Event-driven\n\nBecause these different programming styles, we need to look\
    \ for patterns to help us effectively program on the server. That with the event\
    \ loop, let's take a look at that in more depth.\n\nI think that most people intuitively\
    \ get event-driven programming because its like everyday life. Imagine you are\
    \ cooking. You are chopping a bell pepper and a pot starts to boil. You finish\
    \ the slice since you are doing, and then turn the stove. In daily life, we are\
    \ used to having sorts of internal callbacks for dealing with events, and yet,\
    \ in JavaScript we only do one thing at a time.\n\nYes, yes I can see you rubbing\
    \ your tummy and patting your head at the same time, we do not. But, if you try\
    \ to do any serious activities at the same time, it goes pretty quickly. This\
    \ is like JavaScript. It's getting at events drive the action, but it is \"single-threaded\"\
    \ so only one thing happens at once.\n\nAnother way to think about this event\
    \ loop is a post (or mail). When our event-loop postman gets a letter is an event.\
    \ He has a stack of events to deliver in order. For each letter (event) the postman\
    \ gets, he walks to the route to deliver the letter. The route is the callback\
    \ function assigned to that (sometimes more than one). However, critically, our\
    \ mailman has a single set of events, he can only walk a single code path at once.\n\
    \nSometimes, while the postman is walking a route someone will give him another\
    \ letter. This is because the callback function he code has emitted an event.\
    \ In this case the postman delivers the new message immediately (after all de\
    \ given to him directly instead of going via the post office so it must be urgent).\
    \ The postman will diverge from his current code path and walk the code path to\
    \ deliver the new event. He then carries on walking the original event that emitted\
    \ the event he walked.\n\nLet's look at another example. Let's give the postman\
    \ to deliver a letter that requires a gate to be open. He gets the gate and finds\
    \ it closed, so he waits and tries again, and again. He's trapped in an endless\
    \ loop waiting for the gate to open. But if there is a letter on the stack that\
    \ will ask someone to open the gate so the postman can get through, surely that\
    \ will solve things, right?\n\nUnfortunately it won't, the postman will never\
    \ deliver the letter because he stuck waiting endlessly for the gate to open.\
    \ This is because the event that opens the gate is external from the current event\
    \ callback. If we emit the event from within a callback, we already know our postman\
    \ will go and deliver that letter before carrying on. However, when events are\
    \ external to the currently executing piece of code, they will not be called until\
    \ that piece of code has been fully evaluated to its conclusion.\n\n# Node.js\
    \ 100\n\nWe can use this to write a piece of code that creates a loop that Node.js\
    \ (or a browser) will never break out of:\n\n```javascript\nEE = require('events').EventEmitter\n\
    ee = new EE();\n\ndie = false;\n\nee.on('die', function() {\n  die = true;\n});\n\
    \nsetTimeout(function() {\n  ee.emit('die');\n}, 100);\n\nwhile(die) {\n}\n\n\
    console.log('done');\n```\n\nIn this example, console.log will never be called\
    \ because the while loop stops Node from ever getting chance to callback the timeout\
    \ and emit the 'die' event.\n\nThis is a really important piece of information,\
    \ while it's unlikely we would program a loop like this that relies on an external\
    \ condition to exit, it illustrates how Node.js can do only one thing at once.\
    \ And getting a fly in the ointment can really screw up the whole server.\n\n\
    Let's look at the standard Node.js code for creating an HTTP server:\n\n```javascript\n\
    var http = require('http');\nhttp.createServer(function (req, res) {\n  res.writeHead(200,\
    \ {'Content-Type': 'text/plain'});\n  res.end('Hello World\\n');\n}).listen(8124,\
    \ '127.0.0.1');\nconsole.log('Server running at 127.0.0.1:8124');\n```\n\nIn this\
    \ example, console.log will never be called because the while loop stops Node\
    \ from ever getting chance to callback the timeout and emit the 'die' event.\n\
    \nThis is a really important piece of information, while it's unlikely we would\
    \ program a loop like this that relies on an external condition to exit, it illustrates\
    \ how Node.js can do only one thing at once. And getting a fly in the ointment\
    \ can really screw up the whole server.\n\n## Node.js\n\nSince we attached some\
    \ event listeners, Node.js doesn't exit but waits for an event to be. So what\
    \ happens when we get a request? When an HTTP request is sent to the server, Node.js\
    \ emits the 'request' that creates the. In this case there is only one callback\
    \ and it runs pretty fast.\n\nLet's assume that some sites get popular and we\
    \ get lots of requests. For the sake of argument, if we received two requests\
    \ at the same time, they can't both run at once, and the second request isn't\
    \ going to be acted on for another.\n\nThe upshot of this is that we want to keep\
    \ Node.js as event-driven and non-blocking as possible. In the same way that an\
    \ I/O event can be slow should use callbacks to indicate the presence of data\
    \ Node.js can act on, the Node.js program itself shouldn't be written in such\
    \ a way that any single callback ties up the event loop for extended pieces of\
    \ time.\n\nThe operating system kernel actually handles the TCP connections to\
    \ clients for the HTTP server, so there isn't a risk of not accepting new connections.\
    \ But there is a real danger of not acting on them.\n\nThis means we should employ\
    \ two strategies for writing Node.js servers:\n\n- Once set up has been completed,\
    \ make all actions event driven\n- If Node.js is required to process something\
    \ that will take a long time, consider delegating with workers\n\nTaking the event-driven\
    \ approach works effectively with the event loop — I guess the name is hint it\
    \ would — but it's also important to write event-driven code in a way that is\
    \ easy to read and understand.\n\nIn the previous example, we used an anonymous\
    \ function as the event callback. This makes hard in a couple of ways. Firstly,\
    \ we have no control over where the code lives; the anonymous function must live\
    \ where it is attached to the event via a factory method or the method of an EventEmitter.\
    \ The second issue is debugging: if everything is an anonymous event, it can sometimes\
    \ be hard to distinguish similar callbacks from each other when an exception occurs.\n"
  mdcn: "\n\n# Node.js\n\n# 理解事件循环并为 Node.js 编写优秀代码\n\n原文\n\nhttp://developer.yahoo.com/blogs/ydn/part-1-understanding-event-loops-writing-great-code-11401.html\n\
    \nTom Hughes-Croucher, developer.yahoo.com/blogs#\n\nhttp://developer.yahoo.com/blogs\n\
    \n一如既常，JSConf.Eu¹⁶⁴ 是我今年参加过的最棒的会议之一。与地球上最聪明的 JavaScript 编码员聚在一起是一种乐幸，而且在柏林这个非常时尚的城市举行这次活动更是一个额外的奖赏。关于\
    \ JSConf¹⁶⁵， 已经有很多非常精彩的总结，所以我不再重点关注它；我将准备扩展我之前所做的演讲。\n\n在事件循环内部进行编程是大多数程序员仅略有了解的事情。Node.js\
    \ 正在迅速成为一种非常流行的、基于事件循环的 JavaScript 服务器。它的简单易用在于，人们可以在服务器上编写 JavaScript，并且可以访问\
    \ HTTP 栈、TCP 文件 I/O 和数据库。然而，我们在这种语境下编写的程序类型，往往与我们为浏览器应用程序或网站编写的程序类型非常不同。\n\n在浏览器中，程序的大部分往往涉及设置用户界面，并且会执行一些小型的事件回调——最典型的是基于用户与浏览器的交互。例如，当用户点击表单上的“提交（Submit）”时，我们拦截该点击并验证他们的提交。\n\
    \n这里有一个重要的点：在较多的浏览器编程中，程序员只处理由用户引起的事件，而用户一次能做的事情是的。此外，这些事件的回调往往是离散的，并且不考虑其他事件。某些库（如\
    \ YUI）支持自定义事件，但这通常被认为是一项高级功能。\n\n## 在服务器上\n\n¹⁶⁴http://jsconf.eu/2010/\n¹⁶⁵http://palagut-coding.blogspot.com/2010/09/in-case-you-missed-it-jsconf-2010-day.html\n\
    \n活动应该是非阻塞的（原因我们稍后会解释）。这意味着所有的 HTTP 请求、数据库查询、文件 I/O 等在它们返回之前都不会停止执行。相反，它们独立运行，并在数据可用时发出一个事件。\n\
    \n这意味着在 Node.js 中编程有许多回调来处理各种 I/O，然后启动处理其他类型 I/O 的回调。这与浏览器编程非常不同。虽然仍然存在某种程度的线性设置，但大部分代码都是处理回调的。\n\
    \n### 事件驱动\n\n由于这些不同的编程风格，我们需要寻找模式来帮助我们有效地在服务器上进行编程。关于事件循环，让我们更深入地看看它。\n\n我认为大多数人直觉上就能理解事件驱动编程，因为它就像日常生活。想象一下你正在做饭。你正在切一个灯椒，这时一个锅开始烧开了。由于你正在切，所以你切完这一片，然后关炉子。在日常生活中，我们习惯了拥有某种内部回调来处理事件，但在\
    \ JavaScript 中，我们一次只做一件事。\n\n是的，是的，我能看到你一边揉肚子一边拍头，但我们并做不到。但是，如果你尝试同时做任何严肃的活动，进展就会非常缓慢。这就像\
    \ JavaScript。它是通过让事件驱动动作，但它是“单线程”的，所以一次只发生一件事。\n\n思考这种事件循环的另一种方式是**邮局（或邮件）。当我们的事件循环邮递员收到一封信时，就是一个事件。他有一堆需要按顺序递送的事件。对于邮递员收到的每封信（事件），他都会沿着路线去交付。路线就是分配给该信的回调函数（有时是多个）。然而，关键的一点是，我们的邮递员只有一组事件，他一次只能走一条代码路径。\n\
    \n有时，当邮递员在路线上行走时，有人会给他另一封信。这是因为他代码的回调函数发出了一个事件。在这种情况下，邮递员会立即递送新消息（在所有直接给他的之后，而不是通过邮局，所以它是紧急的）。邮递员将偏离当前的代码路径，走代码路径来递送新事件。然后他继续执行那个触发他所走路径的原始事件。\n\
    \n让我们来看另一个例子。让邮递员递送一封需要打开门的信。他到达了大门，发现门是关着的，于是他等待并再次尝试，一次又一次。他被困在了等待门打开的无限循环中。但如果栈中有一封信会要求某人开门以便邮递员通过，那么这一定能解决问题，对吧？\n\
    \n遗憾的是，并不会。邮递员永远不会递送那封信，因为他陷入了无止境的等待等待。这是因为打开门的事件是当前事件回调的外部的。如果我们从回调内部发出事件，我们已经知道邮递员会在继续执行之前去递送那封信。然而，当事件外部于当前执行的代码段时，在这些代码段被完全评估到结论之前，它们不会被调用。\n\
    \n# Node.js 100\n\n我们可以利用此来编写一段代码，创建一个 Node.js（或浏览器）永远无法跳出的循环：\n\n```javascript\n\
    EE = require('events').EventEmitter\nee = new EE();\n\ndie = false;\n\nee.on('die',\
    \ function() {\n  die = true;\n});\n\nsetTimeout(function() {\n  ee.emit('die');\n\
    }, 100);\n\nwhile(die) {\n}\n```\n[/content]\n\n我们可以利用此来编写一段代码，创建一个 Node.js（或浏览器）永远无法跳出的循环：\n\
    \n```javascript\nEE = require('events').EventEmitter\nee = new EE();\n\ndie =\
    \ false;\n\nee.on('die', function() {\n  die = true;\n});\n\nsetTimeout(function()\
    \ {\n  ee.emit('die');\n}, 100);\n\nwhile(die) {\n}\n```\n*(注：由于原文提供的代码块在输入中似乎不完整或有截断，我根据逻辑补全了常见的结构以保持翻译一致性，但严格遵循“不翻译代码块”原则。如果原文代码确实不完整，应保持原样：)*\n\
    \n```javascript\nEE = require('events').EventEmitter\nee = new EE();\n\ndie =\
