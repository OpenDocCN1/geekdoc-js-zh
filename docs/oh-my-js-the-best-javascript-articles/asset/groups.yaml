  - "[PAGE 42]\n\n# Patterns and Code Organization\n\n```\nfunction onProcessorDone(records)\
    \ {\n  console.log(records);\n}\n\nfunction onFinderDone(records) {\n  processor(records,\
    \ onProcessorDone);\n}\n\nfinder([1, 2], onFinderDone);\n```\n\nIn both case the\
    \ console log above with log [1,2,3,4,5,6]\nWorking example here:\n\n# Pros\n\n\
    +   - They are a very well known pattern, so they are familiar thus easy to understand.\n\
    - Very easy to implement in your own libraries / functions.\n\n# Cons\n\n+   -\
    \ Nested callbacks will form the infamous pyramid of doom as shown above, which\
    \ can be hard to read when you have multiple nested levels. This is quite easy\
    \ to fix by splitting the functions also as shown above.\n- You can only pass\
    \ one callback for a given event, this can be a big limitation in many cases.\n\
    \nPhoto credit: Brandon Christopher Warren / Foter / CC BY-NC\n\n# Listeners\n\
    \nListeners are also a well known pattern, mostly made popular by jQuery and other\
    \ DOM libraries. A Listener might look like this:\n\n```\nfinder.on('done', function\
    \ (event, records) {\n  .do something\n});\n```\n\nWe call a function on an object\
    \ that has a listener. In that function we pass the name of the event we want\
    \ to listen to and callback function. 'on' is one of many common name for this\
    \ function, other names you will come across are 'bind', 'listen', 'addEventListener',\
    \ 'observe'.\n\n# Setup\n\nLet's do some setup for a listener demonstration. Unfortunately\
    \ the setup needed is a bit more involving than in the callbacks example.\n\n\
    First we need a couple of objects that will do the work of finding and processing\
    \ the records."
  - "[PAGE 43]\n\n# Patterns and Code Organization\n\n```\nvar finder = {\n  run:\
    \ function (records) {\n    var self = this;\n    setTimeout(function () {\n \
    \     records.push(3, 4);\n      self.trigger('done', [records]);\n    }, 1000);\n\
    \  }\n}\n```\n\n```\nvar processor = {\n  run: function (records) {\n    var self\
    \ = this;\n    setTimeout(function () {\n      records.push(5, 6);\n      self.trigger('done',\
    \ [records]);\n    }, 1000);\n  }\n}\n```\n\nNote that they are calling a method\
    \ trigger when the work is done, I will add this method to these objects using\
    \ a mix-in. Again 'trigger' is one of the names you will come across, others common\
    \ names are 'fire' and 'publish'.\n\nWe need a mix-object that has the listener\
    \ behaviour, in this case I will just lean on jQuery for this:\n\n```\nvar eventable\
    \ = {\n  on: function(event, cb) {\n    $(this).on(event, cb);\n  },\n  trigger:\
    \ function (event, args) {\n    $(this).trigger(event, args);\n  }\n}\n```\n\n\
    Then apply the behaviour to our finder and processor objects:\n\n```\n.extend(finder,\
    \ eventable);\n$.extend(processor, eventable);\n```\n\nExcellent, now our objects\
    \ can take listeners and trigger events.\n\n# Using the listeners\n\nThe code\
    \ that consumes the listeners is simple:"
  - "[PAGE 44]\n\n# Patterns and Code Organization\n\n```\nfinder.on('done', function\
    \ (event, records) {\n  processor.run(records);\n}\nprocessor.on('done', function\
    \ (event, records) {\n  console.log(records);\n}\nfinder.run([1,2]);\n```\n\n\
    Again the console run will output [1,2,3,4,5,6]\nWorking example here:\n\n# Pros\n\
    \n+   - This is another well understood pattern.\n- The big advantage is that\
    \ you are not limited to one listener per object, you can add as many listeners\
    \ as you want. E.g.\n- finder.on('done', function (event, records) { .. do something\
    \ }) .on('done', function (event, records) { .. do something else });\n\n# Cons\n\
    \n+   - A bit more difficult to setup callbacks in your code, you will probably\
    \ want to use a library like jQuery, bean.js¹⁰.\n\nPhoto credit: Nod Young / Foter\
    \ / CC BY-NC-SA\n\n# A Flow Control Library\n\nFlow control libraries are also\
    \ a very nice way to deal with asynchronous code. One particularly like is Async.js¹¹.\n\
    Code using Async.js looks like this:\n\n```\nasync.series({\n  function(){ ...\
    \ },\n  function(){ ... }\n});\n```\n\n# Setup (Example 1)\n\nAgain we need a\
    \ couple of functions that will do the work, as in the other examples these functions\
    \ in the real world will probably make an AJAX request and return the results.\
    \ For now let's just use timeouts.\n\n> ¹⁰ https://github.com/fat/bean\n¹¹ https://github.com/caolan/async"
  - "[PAGE 45]\n\n```\nfunction finder(records, cb) {\n  setTimeout(function () {\n\
    \    records.push(3, 4);\n    cb(null, records);\n  }, 1000);\n}\nfunction processor(records,\
    \ cb) {\n  setTimeout(function () {\n    records.push(5, 6);\n    cb(null, records);\n\
    \  }, 1000);\n}\n```\n\nThe Node Continuation Passing Style Note the style used\
    \ in the callbacks inside the functions above.\n\ncb(null, records);\n\nThe first\
    \ argument in the callback is null if no error occurs; or the error if one occurs.\
    \ This is a common pattern in Node.js libraries as Async.js uses this pattern.\
    \ By using this style the flow between Async.js and the callbacks becomes super\
    \ simple.\n\n# Using Async\n\nThe code that will consume these functions looks\
    \ like this:\n\n```\nasync.waterfall([\n  function(cb) {\n    finder([1, 2], cb);\n\
    \  },\n  processor(records, cb) {\n    alert(records);\n  }\n]);\n```\n\nAsync.js\
    \ takes care of calling each function in order after the previous one has finished.\
    \ We can just pass the \"processor\" function, this is because we are using the\
    \ Node continuation style. As you can see this code is quite minimal and easy\
    \ to understand.\n\nWorking example here:"
  - "[PAGE 46]\n\n# Another setup (Example 2)\n\nNow, when doing front-end development\
    \ it is unlikely that you will have a library that follows the callback(null,\
    \ results) signature. So a more realistic example will look like this:\n\n```\n\
    function finder(records, cb) {\n  setTimeout(function () {\n    records.push(3,\
    \ 4);\n    cb(records);\n  }, 500);\n}\nfunction processor(records, cb) {\n  setTimeout(function\
    \ () {\n    records.push(5, 6);\n    cb(records);\n  }, 500);\n}\n// using the\
    \ finder and the processor\nasync waterfall({\n  function(cb){\n    finder([1,\
    \ 2], function(records) {\n      cb(null, records);\n    });\n  },\n  function(records,\
    \ cb{\n    processor(records, function(records) {\n      cb(null, records);\n\
    \    });\n  },\n  function(records, cb) {\n    alert(records);\n  }\n});\n```\n\
    \nIt becomes a lot more convoluted but at least you can see the flow going from\
    \ top to bottom. Working example here:\n\n# Pros\n\n+   - Usually code using a\
    \ control flow library is easier to understand because it follows a natural order\
    \ (from top to bottom). This is not true with callbacks and listeners."
  - "[PAGE 47]\n\n# Cons\n\n+   - If the signatures of the functions don't match as\
    \ in the second example then you argue that the flow control library offers little\
    \ in terms of readability.\n\nPhoto credit: Helmut Kaczmarek / Foter / CC BY-NC-SA\n\
    \n# Promises\n\nFinally we get to our final destination. Promises are a very powerful\
    \ tool, but they are the least understood.\n\nCode using promises may look like\
    \ this:\n\n```\nfinder([1,2])\n  .then(function(records) {\n    do something\n\
    \  });\n```\n\nThis will vary widely depending on the promises library you use,\
    \ in this case I am using when.js⁴².\n\n# Setup\n\nOut finder finder(records)\
    \ and processor functions look like this:\n\n```\nfunction finder(records) {\n\
    \  var deferred = when.defer();\n  setTimeout(function () {\n    records.push(3,\
    \ 4);\n    deferred.resolve(records);\n  }, 500);\n  return deferred.promise;\n\
    }\nfunction processor(records) {\n  var deferred = when.defer();\n  setTimeout(function\
    \ () {\n    records.push(5, 6);\n    deferred.resolve(records);\n  }, 500);\n\
    \  return deferred.promise;\n}\n```\n\nEach function creates a deferred object\
    \ and returns a promise. Then it resolves the deferred when the results arrive.\n\
    \n> *⁴²https://github.com/cujojs/when"
  - "[PAGE 48]\n\n# Using the promises\n\nThe code that consumes these functions looks\
    \ like this:\n\n```\nfinder([1,2])\n  then(processor)\n  .then(function(records)\
    \ {\n    alert(records);\n  });\n```\n\nAs you can see, it is quite minimal and\
    \ easy to understand. When used like this, promises bring a lot of clarity to\
    \ your code as they follow a natural flow. Note how in the first callback we can\
    \ simply pass the 'promise' function. This is because this function returns a\
    \ promise itself so everything will just flow nicely.\nWorking example here:\n\
    \nThere is a list to:\n\n+   * they can be passed around as regular objects\n\
    * aggregated into bigger promises\n* you can add handlers for failed promises\n\
    \n# The big benefit of promises\n\nNow if you think that all there is all to promises\
    \ you are missing what I consider the biggest advantage. Promises have a neat\
    \ trick that neither callbacks, listeners or control flows can do. You can add\
    \ a listener to promise even when it has already been resolved, in this case listener\
    \ will trigger immediately, meaning that you don't have to worry if the event\
    \ has happened when you add the listener. This works for the aggregated promises.\
    \ Let me show you an example of this:\n\nThis is a huge feature for dealing with\
    \ user interaction in the browser. In complex applications you may not know the\
    \ order of actions that the user will take, so you can use promises to track us\
    \ interaction. See this other post* if interested.\n\n# Pros\n\n+   * Really powerful,\
    \ you can aggregate promises, pass them around, or add listeners when already\
    \ resolved.\n\n> *http://sporto.github.com/blog/2012/09/22/embracing-async-with-deferreds/"
- md: "\n## Cons\n\n- The least understood of all these tools.\n- They can get difficult\
    \ to track when you have lots of aggregated promises with added listeners along\
    \ the way.\n\n## Conclusion\n\nThat's it! These are in my opinion the four main\
    \ tools for dealing with asynchronous code. Hopefully I have helped you to understand\
    \ them better and gave you more options for your asynchronous needs.\n\n## The\
    \ Design of Code: Organizing JavaScript\n\n| Original Article |\n| http://alistapart.com/article/the-design-of-code-organizing-javascript\
    \ |\n| Anthony Colangelo, alistapart.com |\n| http://alistapart.com |\n\nGreat\
    \ design is a product of care and attention applied to areas that matter, resulting\
    \ in a useful, understandable, and hopefully beautiful user interface. But don't\
    \ be fooled into thinking that design is left only for designers.\n\nThere is\
    \ a lot of design in code, and I don't mean code that builds the user-interface—I\
    \ mean the design of code.\n\nWell-designed code is much easier to maintain, optimize,\
    \ and extend, making for more efficient developers. That means more focus and\
    \ energy can be spent on building great things, which makes everyone happy—users,\
    \ developers, and stakeholders.\n\nThere are three high-level, language-agnostic\
    \ aspects to code design that are particularly important.\n\n- System architecture—The\
    \ basic layout of the codebase. Rules that govern various components, such as\
    \ models, views, and controllers, interact with each other.\n- Maintainability—How\
    \ well can the code be improved and extended?\n- Reusability—How reusable are\
    \ the application's components? How easily can each implementation of a component\
    \ be customized?\n\nIn looser languages, specifically JavaScript, it takes a bit\
    \ of discipline to write well-designed code. The JavaScript environment is so\
    \ forgiving that it's easy to throw bits and pieces everywhere and still have\
    \ things work. Establishing system architecture early (and sticking to it!) provides\
    \ constraints to your code base, ensuring consistency throughout.\n\nOne approach\
    \ I'm found consists of a tried-and-true software design pattern, the module pattern,\
    \ whose extensible structure lends itself to a solid system architecture and a\
    \ maintainable codebase. I like building modules within a jQuery plugin, which\
    \ makes for beautiful reusability, provides robust options, and exposes a well-crafted\
    \ API.\n\nBelow, I'll walk through how to craft your code into well-organized\
    \ components that can be reused in projects to.\n\n## The module pattern\n\nThere\
    \ are a lot of design patterns out, and as many resources on them, Addy Osmani\
    \ wrote an amazing (free!) book on design patterns in JavaScript, which I highly\
    \ recommend to developers of all levels.\n\nThe module pattern is a simple structural\
    \ foundation that can help keep your code clean and organized. A \"module\" is\
    \ just a standard object literal containing methods and properties, and that simplicity\
    \ is the best thing to build about it: even someone unfamiliar with traditional\
    \ software design patterns would be able to look at and instantly understand how\
    \ it works.\n\nIn applications that use this pattern, each component gets its\
    \ own distinct module. For example, to build complete functionality, you create\
    \ a module for the textfield and a module for the results list. These two modules\
    \ work together, but the textfield wouldn't touch the list code, and vice versa.\n\
    \nDecoupling components is why the module pattern is great for building solid\
    \ system architecture. Relationships within the application are well-defined;\
    \ anything related to the textfield is managed by the textfield, not strewn throughout\
    \ the codebase—result in clear code.\n\nAnother benefit of module-based organization\
    \ is that it is inherently maintainable. Modules can be improved and optimized\
    \ independently without affecting any other part of the application.\n\nI used\
    \ the module pattern for the basic structure of jPanelMenu, the jQuery plugin\
    \ I built for off-canvas menu systems. I used that as an example to illustrate\
    \ the process of building a module.\n\n## Building a module\n\nTo begin, I define\
    \ three methods and a property that are used to manage the interactions of the\
    \ menu system.\n\n- https://twitter.com/addyosmani\n- http://addyosmani.com/resources/essentialdesignpatterns/book/\n\
    - http://addyosmani.com/resources/essentialdesignpatterns/book/#modulepatternjjavascript\n\
    - http://jpanelmenu.com/\n\n```\nvar jpm = {\n  animated: true,\n  openMenu: function\
    \ () {\n    this.setsetStyle();\n  },\n  closeMenu: function () {\n    ...\n \
    \   this.setsetStyle();\n  },\n  setStyle: function () { ... }\n};\n```\n\nThe\
    \ idea is to break down code into the smallest, most reusable bits possible. I\
    \ could have written just one toggleMenu() method, but creating distinct openMenu()\
    \ and closeMenu() methods provides more control and usability within the module.\n\
    \nNotice that calls to module and properties from within the module (such as the\
    \ calls to setsetStyle()) are prefixed with this keyword--how's modules access\
    \ their own members.\n\nThat's the basic structure of a module. You can continue\
    \ to add methods and properties as needed, but it doesn't get more complex than\
    \ that. After the structural foundations are in place, the calls reusability-options\
    \ and an exposed API-can can be built on top.\n\n## jQuery plugins\n\nThe third\
    \ aspect of well-designed code is probably the most crucial: reusability. This\
    \ section comes with a caveat. While there are obviously ways to build and implement\
    \ reusable components in raw JavaScript (where we're about 90 percent of the way\
    \ there with our module above), I prefer to build jQuery plugins for more complex\
    \ things, for some reasons.\n\nMost importantly, it's a form of unobtrusive communication.\
    \ If you used jQuery to build a component, you should make that obvious to implementing\
    \ it.\n\nMost importantly, it's a form of unobtrusive communication. If you used\
