    \ Event Machine or Python's Twisted, but it takes the event model a bit further—it\
    \ presents the event as a language instead of as a library.\n\nAnd that's not\
    \ all: what's really great about Node.js is the thousands of modules available\
    \ for any purpose, as well as the vibrant community behind this project. In this\
    \ round-up, you will find the most useful resources for Node.js, from handy tools\
    \ to detailed tutorials, not to mention in-depth articles and resources on this\
    \ promising technology. Do you use Node.js already? Let us know in the comments\
    \ to this post!\n\n# Useful Node.js Tools\n\nNode Express Boilerplate¹⁰⁷\n Express\
    \ Boilerplate gives the developer a clean slate, while bundling enough useful\
    \ features to remove all of those redundant tasks that can derail a project before\
    \ it even gets started.\n\nSocket.IO¹⁰⁸\nSocket.IO is a cross-browser Web server\
    \ that aims to make real-time apps in every browser and mobile device, blurring\
    \ the distinctions between the various transport mechanisms. it's care-free real\
    \ time, in JavaScript.\n\nMastering Node¹⁰⁹\nWith Mastering Node, you can write\
    \ high-concurrency servers, using the CommonJS module system, Node.js's core libraries,\
