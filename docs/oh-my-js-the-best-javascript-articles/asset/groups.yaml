    ## Useful Node.js Tools


    ### Express Boilerplate¹⁰⁷

    Express Boilerplate gives the developer a clean slate, while bundling enough useful
    features to remove all of those redundant tasks that can derail a project before
    it even gets started.


    ### Socket.IO¹⁰⁸

    Socket.IO is a cross-browser Web server that aims to make real-time apps in every
    browser and mobile device, blurring the distinctions between the various transport
    mechanisms. it''s care-free real time, in JavaScript.


    ### Mastering Node¹⁰⁹

    With Mastering Node, you can write high-concurrency servers, using the CommonJS
    module system, Node.js''s core libraries, third-party modules, high-level Web
    development and more.


    ### Log.io¹¹⁰

    Your infrastructure may hundreds of log files spread across dozens of machines.
    To help you monitor deployments and troubleshoot, Log.io lets you instantly compose
    streams of logs in a user interface.


    ### Formaline¹¹¹

    Formaline is a low-level, full-featured (Node.js) module for handling form requests
    (HTTP POSTS and PUTs) and for parsing uploaded files quickly. it is also ready
    to use, for example, middleware software as Connect.


    ### LDAPjs¹¹²

    LDAPjs is a pure-JavaScript, from-scratch framework for implementing LDAP clients
    and servers in Node.js. it is intended for developers who are interacting with
    HTTP services in Node.js and Express.


    ### Node Supervisor¹¹¹³

    This is a little supervisor for Node.js. It runs your program and watches for
    code changes, you can have hot-code reloading-ish behavior without worrying about
    memory leaks or having to clean up all of the inter-module references, and without
    a whole new system.


    ### Stylus: An Expressive CSS Markup Language for Node.js¹¹⁴

    Stylus is supposed to be an expressive language that can be converted to CSS.
    The compiler is built in Node.js.


    ### Jade – Template Engine¹¹⁵

    Jade is a template engine for Node.js applications. It combines great power and
    flexibility with a nice and clean syntax.


    ### Express¹¹⁶

    This is a Sinatra-inspired Web development framework for Node.js: fast, flexible
    and sexy.


    ### Hook.io¹¹⁷

    hook.io creates a distributed Node.js EventEmitter that works cross-process /
    cross-platform / cross-browser. Think of it like a real-time event bus that works
    anywhere JavaScript is supported.


    ### Node Package Manager¹¹⁸

    NPM is a package manager for Node. You can use it to install and publish your
    node programs. It manages dependencies and does other cost full.


    ### Node-QRCode¹¹⁹

    Being quite young Node, Node.js already has a huge number of libraries for every
    possible application. This one is a QR code generator.


    ### NWM¹²⁰

    NWM is a dynamic manager for X that was written at NodeKO 2011. It uses libev
    to interface with X11, and allows you to lay out windows in Node.js.


    ### Bricks.js¹²²

    Bricks is an advanced modular framework built on Node.js. It is highly flexible.
    Bricks can be used as a standalone static Web server, a basic routing framework
    or a multi-level Apache-like routing system; it is modular enough to have the
    capability to completely switch out its routing engine.


    ### Node.js Modules¹²³

    A list of almost all the Node.js most famous modules organized by category. This
    list definitively is worth a look.


    ### 90 open-source Node.js modules¹¹²³

    Recently, Browserling released over 90 Node.js modules to the open-source community.
    Some of them are small and strange modules, others might be pretty useful for
    your next Node.js project.


    ### Calipso¹¹²⁴

    Calipso is a content management system (CMS) based on the NodeJS server.


