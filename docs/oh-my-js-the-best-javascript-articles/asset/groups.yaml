    Node.js


    CoffeeScript. You don''t even need to compile it! Instead of starting your server
    with node app.js, it starts with coffee app.coffee. This is what I do in my apps.
    Me. I''m a big deal. I got a blog.


    - I was confused when I saw app.use(app.router) - doesn''t Express always use
    a router? Short answer is that app.router is routing middleware, and it''s implicitly
    included when you define a route. You can explicitly include it because you use
    the router middleware to come before other, which is sometimes desirable. This
    StackOverflow explains it well²202.


    - This guide was written for Express 3, and the version 4 roadmap²203 shows the
    possibility of some dramatic changes. Most notably, it looks Express might be
    split up into a bunch of small modules and eat some of Connect''s features. It''s
    up in the air, but the “plans” are worth a look.


    # I thirst for


    Is no satisfying you? You glutton. You make me sick. Soon you''re gonna be sitting
    in an opium dens, half-alive, drooling the last drop of your programming talent.


    Just Likes is the de-facto way to build web apps with Ruby and demonic masochism
    is the de-facto way to build web apps in PHP, I get the impression that Express
    is the de-facto way to build web apps. Unlike Rails, Express is much lower-level.
    It seems like no high-level Node library has stuck out. I think this is going
    to change. Keep your eyes out.


    I won''t go in here, but as Express was built on Connect and Connect on Node,
    people have built things on top of Express. The Express wiki lists them²204 and
    many of them are Pretty Cool. You can use these frameworks if you''d prefer, or
    you can stick to the lower-level Express. Either way, go build cool stuff!


