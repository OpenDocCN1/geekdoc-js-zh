    Our demo page performance and rAF optimizations


    If you check out the pre-optimized page¹⁶ you''ll see it really struggle to keep
    up as you scroll, and there are a number of reasons why. We are firstly brute
    calling the requestAnimationFrame, whereas what we are doing is only calculate
    changes when we get a scroll event. Secondly, we are calling offsetTop which causes
    a reflow, and when we immediately leave the className change and that''s going
    to cause a repaint, we are using className rather than classlist.


    The reason using className is less performant than classList is that className
    will always affect the DOM element, even if the value has changed. By setting
    the value we trigger a repaint, which can be very expensive. Using classList,
    however, allows the browser to be more intelligent about updates, and it will
    leave the element alone already contain the list you''re adding (which is left
    in our case).


    If you want more information on using classList and the new-and-extremely-useful
    frame breakdown in Chrome''s Dev Tools you should watch this video by Paul Irish:


    So let''s take a look at what a better version of this would look like:


