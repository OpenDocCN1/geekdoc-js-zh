  mdcn: "\n\n## 缺点\n\n-   这些工具中最难理解的。\n-   当你有大量在途中添加了监听器的聚合承诺（promises）时，它们可能会变得难以追踪。\n\
    \n## 结论\n\n就是这些！在我看来，这是处理异步代码的四种主要工具。希望这能帮助你更好地理解它们，并为你的异步需求提供更多选择。\n\n## 代码的设计：组织\
    \ JavaScript\n\n| 原文文章 |\n| [http://alistapart.com/article/the-design-of-code-organizing-javascript](http://alistapart.com/article/the-design-of-code-organizing-javascript)\
    \ |\n| Anthony Colangelo, alistapart.com |\n| | |\n\n优秀的设计是对重要领域投入关注和用心的结果，从而产生一个有用、易于理解且尽可能美的用户界面。但不要被误骗，认为设计仅仅是留给设计师的。\n\
    \n代码中存在着大量的设计，我指的不是构建用户界面的代码——而是代码的设计。\n\n良好的代码更容易维护、优化和扩展，让开发人员更高效。这意味着可以将更多的精力和花放在构建伟大的事物上，这让用户、开发者和利益相关者都开心。\n\
    \n代码设计有三个高层、与语言无关的方面特别为重要。\n\n-   系统架构——代码库的基础布局。规范各种组件（如模型、视图和控制器）相互作用的规则。\n\
    -   可维护性——代码在多大程度上可以改进和扩展？\n-   可复用性——应用程序组件的可复用性如何？每个组件的实现有多容易自定义？\n\n在松散的语言中，特别是\
    \ JavaScript，编写良好的设计需要一点自律。JavaScript 环境非常宽容，以至于随处丢弃碎片代码程序也能正常运行。尽早建立系统架构（并坚持下去！）为你的代码库提供了约束，确保了始终的一致性。\n\
    \n我发现的一种方法是使用一种经典的软件设计模式——模块模式（module pattern），它可扩展的结构有助于构建稳健的系统架构和可维护的代码库。我喜欢在\
    \ jQuery 插件中构建模块，这可以实现优美的复用性，提供健壮的选项，并暴露精良的 API。\n\n下面，我将介绍如何将你的代码组织成良好的组件，这些组件可以在其他项目中被复用。\n\
    \n## 模块模式\n\n设计模式有很多，关于它们的资源也很多。Addy Osmani 写了一本关于 JavaScript 设计模式的精彩（免费！）书籍，我强烈向向所有水平的开发者推荐这本书。\n\
    \n模块模式是一种简单的结构基础，可以帮助保持代码的整洁和有序。“模块”只是一个包含方法和属性的标准对象字面量，而这种简单性是构建它最棒的一点：即使是不熟悉传统软件设计模式的人，也能查看并立即理解它是如何运作的。\n\
    \n在运行这种模式的应用程序中，每个组件都有它自己独特的模块。例如，为了构建完整的功能，你为文本框创建一个模块，为结果列表创建一个模块。这两个模块协同工作，但文本框不会触碰列表代码，反之亦然。\n\
    \n组件解耦是模块模式非常适合构建稳健系统架构的原因。应用程序内部的关系被定义得很好；与文本框相关的任何内容由文本框管理，而不是散落在整个代码库中——导致清晰的代码。\n\
    \n基于模块的组织的另一个好处是它具有内在的可维护性。模块可以独立地改进和优化，而不会影响应用程序的任何部分。\n\n我将模块模式用于 jPanelMenu\
    \ 的基本结构，这是我为离屏菜单系统构建的 jQuery 插件。我用它作为示例，说明了构建模块的过程。\n\n## 构建模块\n\n首先，我定义了三个方法和一个属性，用于管理菜单系统的交互。\n\
    \n- [https://twitter.com/addyosmani](https://twitter.com/addyosmani)\n- [http://addyosmani.com/resources/essentialdesignpatterns/book/](http://addyosmani.com/resources/essentialdesignpatterns/book/)\n\
    - [http://addyosmani.com/resources/essentialdesignpatterns/book/#modulepatternjjavascript](http://addyosmani.com/resources/essentialdesignpatterns/book/#modulepatternjjavascript)\n\
    - [http://jpanelmenu.com/](http://jpanelmenu.com/)\n\n```\nvar jpm = {\n  animated:\
    \ true,\n  openMenu: function () {\n    this.setsetStyle();\n  },\n  closeMenu:\
    \ function () {\n    ...\n    this.setsetStyle();\n  },\n  setStyle: function\
    \ () { ... }\n};\n```\n\n这个思想是将代码拆分为尽可能微小、最可复用的片段。我可以只写一个 `toggleMenu()` 方法，但创建不同的\
    \ `openMenu()` 和 `closeMenu()` 方法在模块内部提供了更多的控制和可用性。\n\n注意，模块内部对模块和属性的调用（例如对 `setStyle()`\
    \ 的调用）带有 `this` 关键字前缀——这就是模块访问其自身成员的方式。\n\n这就是模块的基本结构。你可以根据需要继续添加方法和属性，但它并不会比此更复杂。在结构基础建立之后，可以在此基础上构建可复用选项和暴露的\
    \ API。\n\n## jQuery 插件\n\n良好设计的第三个方面可能是最关键的：可复用性。这一节带有一个说明。虽然显然有方法在原生 JavaScript\
    \ 中构建和实现可复用组件（通过我们上面的模块我们已经完成了 90%），但出于某些原因，我更倾向于为更复杂的事情构建 jQuery 插件。\n\n最重要的是，这是一种非侵入性的通信。如果你使用\
    \ jQuery 构建了一个组件，你应该让实现它的人一而易见。\n\n（注：原文此处存在大量重复的段落，翻译时已根据要求去重，仅保留核心逻辑）\n\n"
