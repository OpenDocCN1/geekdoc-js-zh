- md: "\n# Original Article\n\n> http://callbackhell.com\nMax Ogden, github.com/maxogden*\n\
    *https://github.com/maxogden\n\n# What is \"callback hell?\"\n\nAsynchronous javascript,\
    \ or javascript that uses callbacks, is hard to get right intuitively. A lot of\
    \ code ends up looking just like this:\n\n```javascript\nfs.readdir(source, function(err,\
    \ files) {\n  if (err) {\n    console.log('Error finding files: ' + err)\n  }\
    \ else {\n    files.forEach(function(filename, fileIndex) {\n      console.log(filename)\n\
    \      gm(source + filename).size(function(err, values) {\n        if (err) {\n\
    \          console.log('Error identifying file size: ' + err)\n        } else\
    \ {\n          console.log(filename + ' : ' + values)\n          aspect = (values.width\
    \ / values.height)\n          widths.forEach(function(width, widthIndex) {\n \
    \           height = Math.round(width / aspect)\n            console.log('resizing\
    \ ' + filename + ' to ' + height + 'x' + height)\n            this.resize(width,\
    \ height).write(destination + '_w' + width + '_' + height + '.jpg')\n        \
    \  })\n        }\n      })\n    });\n    if (err) console.log('Error writing file:\
    \ ' + err)\n  }\n}.bind(this))\n```\n\nSee all the instances of function and }}?\
    \ Eek! This is affectionately known as callback hell.\nWriting better code isn't\
    \ that hard! You need to know about a few things:\n\n# Name your functions\n\n\
    Here is some (messy) browser javascript that uses browser-request¹⁶⁶ to make an\
    \ AJAX request to a server:\n\n```javascript\nvar form = document.querySelector('form')\n\
    form.onsubmit = function(submitEvent) {\n  var name = document.querySelector('input').value\n\
    \  request({\n    uri: \"http://example.com/upload\",\n    body: name,\n    method:\
    \ \"POST\",\n  }, function(err, response, body) {\n    var statusMessage = document.querySelector('.status')\n\
    \    if (err) return statusMessage.value = err\n    statusMessage.value = body\n\
    \  })\n}\n```\n\nThis code has two anonymous functions. Let's get them names!\n\
    \n```javascript\nvar form = document.querySelector('form')\nform.onsubmit = function\
    \ formSubmit(submitEvent) {\n  var name = document.querySelector('input').value\n\
    \  request({\n    uri: \"http://example.com/upload\",\n    body: name,\n    method:\
    \ \"POST\",\n  }, function(err, response, body) {\n    var statusMessage = document.querySelector('.status')\n\
    \    if (err) return statusMessage.value = err\n    statusMessage.value = body\n\
    \  })\n}\n```\n\nAs you can see naming functions is super easy and does some nice\
    \ things to your code:\n\n- makes code easy to read\n- when exceptions happen\
    \ you will get stacktraces that reference actual function names instead of \"\
    anonymous\"\n- allows you to keep your code shallow, or not nested deeply, which\
    \ brings me to my next point:\n\n> ¹⁶⁶https://github.com/iriscouch/browser-request\n\
    \n# Keep your code shallow\n\nBuilding on the last example, let's go a bit further\
    \ and get rid of the triple level nesting that is going on on the code:\n\n```javascript\n\
    function onSubmit(submitEvent) {\n  var name = document.querySelector('input').value\n\
    \  request({\n    uri: \"http://example.com/upload\",\n    body: name,\n    method:\
    \ \"POST\"\n  }, postResponse)\n}\n\nfunction postResponse(err, response, body)\
    \ {\n  var statusMessage = document.querySelector('.status')\n  if (err) return\
    \ statusMessage.value = err\n  statusMessage.value = body\n}\n\ndocument.querySelector('form').onsubmit\
    \ = formSubmit\n```\n\nCode like this is less scary to look at and is easier to\
    \ edit, refactor and hack on later.\n\n# Modularize!\n\nThis is the most important\
    \ part: Anyone is capable of creating modules (AKA libraries). To quote Isaac\
    \ Schluter¹⁶(of the node.js project): “Write small modules that do one thing”\n\
    \nLet's take the boilerplate code from above and turn it into a module by splitting\
    \ it up into couple of files. Since I wrote JavaScript in both the browser and\
    \ on the server, I'll show a method that works in both but is still nice and simple.\n\
    \nHere is a new file uploader.js that contains two functions from before:\n\n\
    > ¹⁶http://twitter.com/izs\n\n# Node.js\n\n```javascript\nfunction submit(submitEvent)\
    \ {\n  var name = document.querySelector('input').value\n  request({\n    uri:\
    \ \"http://example.com/upload\",\n    body: name,\n    method: \"POST\"\n  },\
    \ postResponse);\n}\n\nfunction postResponse(err, response, body) {\n  var statusMessage\
    \ = document.querySelector('.status')\n  if (err) return statusMessage.value =\
    \ err\n  statusMessage.value = body\n}\n\nexports.submit = formSubmit\n```\n\n\
    The exports at the end is an example of the CommonJS module system, which is used\
    \ by Node.js for server side javascript programming. I like this style of modules\
    \ because it is so simple – you only have to define what should be shared when\
    \ the module requires (that's what the exports thing).\n\nTo use CommonJS modules\
    \ in the browser you can use a command-line tool like browserify¹⁰ I't get into\
    \ the details of how to use here but it will require you to load modules into\
    \ your programs. Now that we have loader.js (and it is loaded in the page as script\
    \ tag) we just need to require it and use it! Here is our application looks:\n\
    \n```javascript\nvar loader = require('loader')\ndocument.querySelector('form').onsubmit\
    \ = loader.submit\n```\n\nNow our application is only two lines of code and has\
    \ the following benefits:\n\n- easier for new developers to understand - they\
    \ won't get bogged down by having to read all of\n- loader can be used in other\
    \ places without duplicating code and easily easily shared on the server\n- the\
    \ code itself is nice and easy to read\n\nThere are lots of patterns for web and\
    \ Some of them get complicated. The ones shown here are what I consider to be\
    \ the simplest to understand.\n\n> ¹⁰https://github.com/substack/browserify\n\
    > ¹¹http://www.adequatelygood.com/2010/3/JavaScript-Pattern-In-Depth\n> ²http://nodejs.org/api/modules.html\n\
    \n# I still don't get it\n\nTry reading my introduction to callbacks.\n\n# What\
    \ about promises?\n\nPromises are a more abstract pattern of working with async\
    \ code. The scope of this document is to show how to make vanilla javascript.\
    \ If you use a third party library that adds abstraction to your JS then you are\
    \ willing to force who contributes to your library to have the same views on.\
    \ In my own experience I use callbacks for 90% of the async code I write and when\
    \ things get hairy I bring in something like. That being said, everyone develops\
    \ their own unique style and what you should do like: some people to use only\
    \ callbacks, some people don't.\n\nPlease contribute new sections or fix existing\
    \ ones by forking this project on github!\n\n# Understanding Express.\n\n> Original\
    \ Article\nhttp://evanhahn.com/understanding-express/\nEvan Hahn, evanhahn.com\n\
    \nThis is aimed at people who have some familiarity with Node.js. They know how\
    \ to run scripts and install packages with npm. You don't have to be an expert,\
    \ though - promise. This guide was last updated for Express 3.2. It's an introduction\
    \ and mostly deals with concepts. Express.js describes itself better than I can:\
    \ \"a minimal and flexible node.js web application\"\n\n> ⁷³https://github.com/maxogden/art-of-node\n\
    > ⁷⁴http://domainie.me/2012/10/14/your-missing-the-point-of-promises/\n> ⁷⁵https://github.com/caolan/async\n\
    > ⁷⁶https://gist.github.com/399225\n> ⁷⁷https://github.com/maxogden/callback-hell\n\
    > ⁷⁸http://expressjs.com/\n\nframework. It helps you build web apps. If you've\
    \ used Sinatra in the Ruby world, a lot of this will be familiar.\n\nUnlike abstraction,\
    \ Express hides difficult bits and says \"don't worry, you don't need to understand\
    \ this part. It does things for you that you don't have to do. In other worlds,\
    \ it's magic. It's good magic, Express catalogs some people using it, and there\
    \ are some big names: MySpace, Klout, and even some that I've made. It's a huge\
    \ deal. I've got a blog.\n\nBut all magic comes at a price; you might not understand\
    \ the inner workings of Express. This is like driving a car; I drive a car just\
    \ without intimate knowledge of its workings, but I'd be better off with that.\
    \ What if things break? What if you want to get all the performance you can out\
    \ of the car? What if you have an insatiable thirst for knowledge?\n\nSo let's\
    \ understand Express from the bottom, with Node.\n\n# Bottom layer: Node's HTTP\
    \ server\n\nNode has HTTP module which makes a pretty simple abstraction for making\
    \ a webserver. Here's what that might look like:\n\n```javascript\n// Require\
    \ what we need\nvar http = require(\"http\");\n\n// Build the server\nvar app\
    \ = http.createServer(function(request, response) {\n  response.writeHead(200,\
    \ {\n    \"Content-Type\": \"text/plain\"\n  });\n  response.end(\"Hello world!\\\
    n\");\n});\n\n// Start that server, baby\napp.listen(1337, \"localhost\");\nconsole.log(\"\
    Server running at http://localhost:1337/\");\n```\n\nAnd if you run that app (if\
    \ that file is app.js, you'll run app.js), you'll get a response to \"Hello world!\"\
    \ if you visit localhost:1337 in your browser. You'll get the same response no\
    \ matter what, you. You can try visiting localhost:1337/anime_currency or localhost:1337/?onlyfriend=anime,\
    \ and it's like talking to a wall: \"Hello world\"\n\n> 179http://www.sinatrah.com/\n\
    > 180http://expressjs.com/applications.html\n> 181http://shapeshed.com/all-magic-comes-with-a-price/\n\
    > 182http://nodejs.org/api/http.html\n"
  mdcn: "\n\n# 原文\n\n> http://callbackhell.com\nMax Ogden, github.com/maxogden*\n\
    *https://github.com/maxogden\n\n# 什么是“回调地狱”？\n\n异步 JavaScript，或者说使用回调的 JavaScript，很难在直觉上写好。很多代码最后看起来都像这样：\n\
    \n```javascript\nfs.readdir(source, function(err, files) {\n  if (err) {\n   \
    \ console.log('Error finding files: ' + err)\n  } else {\n    files.forEach(function(filename,\
    \ fileIndex) {\n      console.log(filename)\n      gm(source + filename).size(function(err,\
    \ values) {\n        if (err) {\n          console.log('Error identifying file\
    \ size: ' + err)\n        } else {\n          console.log(filename + ' : ' + values)\n\
    \          aspect = (values.width / values.height)\n          widths.forEach(function(width,\
    \ widthIndex) {\n            height = Math.round(width / aspect)\n           \
    \ console.log('resizing ' + filename + ' to ' + height + 'x' + height)\n     \
    \       this.resize(width, height).write(destination + '_w' + width + '_' + height\
    \ + '.jpg')\n          })\n        }\n      })\n    });\n    if (err) console.log('Error\
    \ writing file: ' + err)\n  }\n}.bind(this))\n```\n\n看到所有的 `function` 和 `}}` 了？额！这被亲切地称为回调地狱。\n\
    写更好的代码并不难！你需要了解以下几点：\n\n# 给你的函数命名\n\n这里有一段（混乱的）浏览器 JavaScript，它使用 browser-request¹⁶⁶\
    \ 向服务器发送 AJAX 请求：\n\n```javascript\nvar form = document.querySelector('form')\n\
    form.onsubmit = function(submitEvent) {\n  var name = document.querySelector('input').value\n\
    \  request({\n    uri: \"http://example.com/upload\",\n    body: name,\n    method:\
    \ \"POST\",\n  }, function(err, response, body) {\n    var statusMessage = document.querySelector('.status')\n\
    \    if (err) return statusMessage.value = err\n    statusMessage.value = body\n\
    \  })\n}\n```\n\n这段代码有两个匿名函数。让我们给它们命名！\n\n```javascript\nvar form = document.querySelector('form')\n\
    form.onsubmit = function formSubmit(submitEvent) {\n  var name = document.querySelector('input').value\n\
    \  request({\n    uri: \"http://example.com/upload\",\n    body: name,\n    method:\
    \ \"POST\",\n  }, function(err, response, body) {\n    var statusMessage = document.querySelector('.status')\n\
    \    if (err) return statusMessage.value = err\n    statusMessage.value = body\n\
    \  })\n}\n```\n\n如你所见，命名函数超级简单，并且能给你的代码带来一些好变化：\n\n- 让代码易于阅读\n- 当发生异常时，你将获得引用了实际函数名的堆栈跟踪，而不是“匿名”\n\
    - 允许你保持代码扁浅，或者不要深层嵌套，这引出了我的下一点：\n\n> ¹⁶⁶https://github.com/iriscouch/browser-request\n\
    \n# 保持代码扁平\n\n在上一个例子的基础上，让我们更进一步，消除代码中发生的三层嵌套：\n\n```javascript\nfunction onSubmit(submitEvent)\
    \ {\n  var name = document.querySelector('input').value\n  request({\n    uri:\
    \ \"http://example.com/upload\",\n    body: name,\n    method: \"POST\"\n  },\
    \ postResponse)\n}\n\nfunction postResponse(err, response, body) {\n  var statusMessage\
    \ = document.querySelector('.status')\n  if (err) return statusMessage.value =\
    \ err\n  statusMessage.value = body\n}\n\ndocument.querySelector('form').onsubmit\
    \ = formSubmit\n```\n\n这样的代码看起来不那么可怕，而且更容易编辑、重构和黑客。\n\n# 模块化！\n\n这是最重要的一部分：任何人都能创建模块（即库）。引用\
    \ Isaac Schluter¹⁶（node.js 项目）：“编写只做一件事的小模块”。\n\n让我们采取模板代码，通过将其拆分成几个文件转换为模块。由于我在浏览器和服务器上都写\
    \ JavaScript，我将展示一种在两处运行但仍然良好且简单的方法。\n\n这是一个新的 `uploader.js` 文件，包含了之前的两个函数：\n\n\
    > ¹⁶http://twitter.com/izs\n\n# Node.js\n\n```javascript\nfunction submit(submitEvent)\
    \ {\n  var name = document.querySelector('input').value\n  request({\n    uri:\
    \ \"http://example.com/upload\",\n    body: name,\n    method: \"POST\"\n  },\
    \ postResponse);\n}\n\nfunction postResponse(err, response, body) {\n  var statusMessage\
    \ = document.querySelector('.status')\n  if (err) return statusMessage.value =\
    \ err\n  statusMessage.value = body\n}\n\nexports.submit = formSubmit\n```\n\n\
    结尾的 `exports` 是 CommonJS 系统的示例，Node.js 用于服务器端编程。我喜欢这种模块样式，因为它非常简单——你只需要定义应该共享的内容（这就是\
    \ `exports` 的作用）。\n\n要在浏览器中使用 CommonJS 模块，你可以使用像 browserify⁰ 这样的命令行工具。我不会涉及细节如何使用，但它会将模块加载到你的程序中。现在我们有了\
    \ `loader.js`（它是通过脚本标签加载的），我们只需要引入并使用它！这里是我们的应用：\n\n```javascript\nvar loader\
    \ = require('loader')\ndocument.querySelector('form').onsubmit = loader.submit\n\
    ```\n\n现在我们的应用程序只有两行代码，并且具有以下优点：\n\n- 更容易让开发者理解——他们不会被阅读所有代码所困\n- loader 可以在其他地方使用而无需重复代码，并在服务器上轻松共享\n\
    - 代码本身很好且易于阅读\n\nWeb有很多模式，其中有些变得复杂。这里展示的我认为是最容易理解的。\n\n> ¹⁰https://github.com/substack/browserify\n\
    > ¹¹http://www.adequatelygood.com/2010/3/JavaScript-Pattern-In-Depth\n> ²http://nodejs.org/api/modules.html\n\
    \n# 我还是不懂\n\n尝试阅读我的关于回调的介绍。\n\n# Promise 怎么样？\n\nPromise 是处理异步代码的更抽象的模式。本文目的是目的是编写原生\
    \ JavaScript。如果你使用了为 JS 添加抽象的第三方库，你就愿意让你贡献库的人有相同的观点。在我的经验中，我写的 90% 异步代码使用回调，当事情变得棘手时我会引入类似的东西。尽管如此，每个人都会开发出独特的风格，你应该像这样：有些人只用回调，有些人则不然。\n\
    \n请通过在 GitHub 上 fork 此项目来贡献新章节或修复现有章节！\n\n# 理解 Express。\n\n> 原文\nhttp://evanhahn.com/understanding-express/\n\
    Evan Hahn, evanhahn.com\n\n这针对熟悉 Node.js 的人。他们知道如何运行脚本和使用 npm 安装包。不过你不必成为专家——Promise。本指南最后更新是针对\
    \ Express 3.2。它是一份介绍，主要处理概念。Express 比我描述得更好：“一个极简且灵活的 node.js 应用程序”\n\n> ⁷³https://github.com/maxogden/art-of-node\n\
    > ⁷⁴http://domainie.me/2012/10/14/your-missing-point-of-promises/\n> ⁷⁵https://github.com/caolan/async\n\
    > ⁷⁶https://gist.github.com/399225\n> ⁷⁷https://github.com/maxogden/callback-hell\n\
    > ⁷⁸http://expressjs.com/\n\n框架。它帮助你构建 Web 应用。如果你在 Ruby 世界中使用过 Sinatra，这里的很多内容你会很熟悉。\n\
    \n与抽象不同，Express 隐藏了困难的部分并说“别担心，你不需要理解这部分”。它为你做了你不需要自己做的事。在另一个世界里，它是魔法。它是良性的魔法，Express\
    \ 列出了一些使用它的人，其中有一些大名字：MySpace、Klout，甚至还有一些我制作的。这是一件了不起。我有一个博客。\n\n但所有魔法都是代价的；你可能不理解\
    \ Express 的内部运作。这就像开车；我开车时并没有对其原理的详尽了解，但如果了解了会更好。如果东西坏了怎么办？如果你想从汽车中榨出所有性能怎么办？如果你对知识有永无的渴求怎么办？\n\
    \n所以让我们从底层开始通过 Node 理解 Express。\n\n# 底层：Node 的 HTTP 服务器\n\nNode 有 HTTP 模块，它为创建\
    \ Web 服务器提供了一个非常简单的抽象。它可能像这样：\n\n```javascript\n// 引入我们需要的\nvar http = require(\"\
    http\");\n\n// 构建服务器\nvar app = http.createServer(function(request, response)\
    \ {\n  response.writeHead(200, {\n    \"Content-Type\": \"text/plain\"\n  });\n\
    \  response.end(\"Hello world!\\n\");\n});\n\n// 启动服务器，宝贝\napp.listen(1337, \"\
    localhost\");\nconsole.log(\"Server running at http://localhost:1337/\");\n```\n\
    \n如果你运行该应用（如果该文件是 app.js，你就运行 app.js），如果你在浏览器中访问 localhost:1337，你将得到“Hello world!”的响应。无论你做什么，都会得到相同的响应。你可以尝试访问\
    \ localhost:1337/anime_currency 或 localhost:1337/?onlyfriend=anime，这就像是在对着墙说话：“Hello\
    \ world”\n\n"
