    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n```]\n# Understanding Async\n\nOne of\
    \ the things that tripped me up when the beginning to work with JavaScript, jQuery\
    \ in particular is the fact that some operations are asynchronous. There were\
    \ many times that I wrote code in a procedural manner expecting a result to be\
    \ returned immediately without realizing it.\n\nTake a look at this broken code:\n\
    \n```javascript\nvar remoteValue = false;\n$.ajax({\n  url: 'http://google.com',\n\
    \  success: function() {\n    remoteValue = true;\n  }\n});\n```\n\n```javascript\n\
    console.log(remoteValue); //outputs \"false\"\n```\n\nIt might take a while to\
    \ realize that you need to program around asynchronous calls using callbacks to\
    \ deal with the outcome of my ajax calls.\n\n```javascript\nvar remoteValue =\
    \ false;\nvar doSomethingWithRemoteValue = function() {\n  console.log(remoteValue);\
    \ //outputs true on success\n}\n\n$.ajax({\n  url: 'https://google.com',\n  complete:\
    \ function() {\n    remoteValue = true;\n    doSomethingWithRemoteValue();\n \
    \ }\n});\n```\n\nAnother cool thing is deferred (sometimes called promises), which\
    \ you can use to program in a more procedural style:\n\n```javascript\nvar remoteValue\
    \ = false;\nvar doSomethingWithRemoteValue = function() {\n  console.log(remoteValue);\n\
    }\n\nvar promise = $.ajax({\n  url: 'https://google.com'\n});\n\n//outputs \"\
    true\"\npromise.always(function() {\n  remoteValue = true;\n  doSomethingWithRemoteValue();\n\
    });\n\n//outputs \"foobar\"\npromise.always(function() {\n  remoteValue = 'foobar';\n\
    \  doSomethingWithRemoteValue();\n});\n```\n\nYou can use promises to chain callbacks\
    \ in a style that is in my opinion a bit easier to work with nested callbacks\
    \ in addition to a host of other benefits these objects offer.\n\n# Patterns and\
    \ Code Organization\n\nAnimations in the browser are also asynchronous, so this\
    \ is also a common source of confusion.\nI'm not going to go into detail here,\
    \ but you need to treat animations much like ajax requests in the way you handle\
    \ them via callbacks. I'm not really an expert on the subject so please take a\
    \ look at the `jQuery.animate()` method.\n\n# Simple Inheritance in JavaScript\n\
    \nRoughly simplified, JavaScript clones objects to extend them, while PHP, Ruby,\
    \ Python and Java use and extend classes. In JavaScript you have something called\
    \ a prototype, and every object has one. In fact, functions, strings, numbers\
    \ and objects have a common ancestor, `Object`. There are two things about prototype\
    \ to remember: blueprints and chains.\n\nEach prototype is basically an object\
    \ in itself that describes properties available when creating an instance of an\
    \ object. The prototype chain allows prototypes to extend other prototypes. In\
    \ fact, prototypes can have prototypes. When a method or attribute does not exist\
    \ on an object instance, then it is looked for that object's `prototype`, and\
    \ the prototypes' `prototype`, and so until it finally reaches `undefined` if\
    \ no such property exists.\n\nThankfully, beginners generally do not need to mess\
    \ with this stuff at all, since it is easy enough to create an object literal\
    \ and append properties to it at runtime.\n\n```javascript\nvar obj = {};\nobj.newFunction\
    \ = function() {\n  console.log('I am a dynamic function');\n}\nobj.newFunction();\n\
    ```\n\nAn easy way to extend objects that I use all the time is `jQuery.extend()`\n\
    \n```javascript\nvar obj = {\n  a: 'i am a lonely property'\n}\nvar newObj = {\n\
    \  b: function() {\n  return 'i am a lonely function'\n  }\n}\n```\n\n> http://api.jquery.com/animate/\n\
    \n# Patterns and Code Organization\n\n```javascript\nvar finalObj = $.extend({},\
    \ obj, newObj);\n```\n\n```javascript\nconsole.log(finalObj.a); //outputs \"i\
    \ am a lonely property\"\nconsole.log(finalObj.b); //outputs \"i am a lonely function\"\
    \n```\n\nECMAScript 5 offers you Object.create(), which you can use to extend\
    \ from an existing object but you probably need to avoid using to support older\
    \ browsers. It offers distinct advantages to property creation and setting attributes\
    \ of properties (yes, properties have properties³⁸).\n\n```javascript\nvar obj\
    \ = {\n  a: 'i am a lonely property'\n}\nvar finalObj = Object.create(obj, {\n\
    \  b: function() {\n    return \"i am a lonely function\";\n  }\n});\n\nconsole.log(finalObj.a);\
    \ //outputs \"i am a lonely property\"\nconsole.log(finalObj.b()); //outputs \"\
    i am a lonely function\"\n```\n"
  mdcn: "\n\n# 模式与代码组织\n\n```javascript\nvar fatString = \" my string \";\n\n// 在现代浏览器中\
    \ 输出 \" my string \"\nconsole.log(fatString); //输出 \"my string\"\nconsole.log(fatString.trim());\
    \ //输出 \"my string\"\n\n// 在 IE 8 中\nconsole.log(fatString.trim()); //错误：对象不支持属性或方法\
    \ 'trim'\n```\n\n因此，我们可以可以使用像 `jQuery.trim()`这样的方法来为我们完成工作，我相信如果你的浏览器支持 `String.trim()`，它将回退到该方法以提高性能（因为浏览器的**原生实现**速度更快）。\n\
    \n你可能并不关心，甚至不需要了解 ECMAScript 3 和 ECMAScript 5 之间的所有差异，但查阅 Mozilla 开发者网络 (MDN)\
    \ 的函数参考以首先查看语言的可用版本通常是一个好主意。通常情况下，如果你使用像 jQuery 或 underscore 这样的库来为你处理这些问题，那么应该是没问题的。\n\
    \n如果你兴趣为旧浏览器使用 ECMAScript 5 的填充程序（polyfill），请查看 https://github.com/kriskowal/es5-shim\n\
    \n# 理解异步\n\n在我刚开始学习 JavaScript（特别是 jQuery）时，让我感到困惑的问题之一是某些操作是异步的。很多时候，我以过程化的方式编写代码，期望结果会立即返回，但并没有意识到这一点。\n\
    \n看看下面这段错误的代码：\n\n```javascript\nvar remoteValue = false;\n$.ajax({\n  url: 'http://google.com',\n\
    \  success: function() {\n    remoteValue = true;\n  }\n});\n```\n\n```javascript\n\
    console.log(remoteValue); //输出 \"false\"\n```\n\n可能需要一段时间时间才能意识到，你需要使用回调函数围绕异步调用编写程序，以处理我的\
    \ ajax调用的结果。\n\n```javascript\nvar remoteValue = false;\nvar doSomethingWithRemoteValue\
    \ = function() {\n  console.log(remoteValue); // 成功时输出 true\n}\n\n$.ajax({\n \
    \ url: 'https://google.com',\n  complete: function() {\n    remoteValue = true;\n\
    \    doSomethingWithRemoteValue();\n  }\n});\n```\n\n另一个很酷的功能是延迟（有时称为承诺/promises），你可以用它以更接近过程化的风格进行编程：\n\
    \n```javascript\nvar remoteValue = false;\nvar doSomethingWithRemoteValue = function()\
    \ {\n  console.log(remoteValue);\n}\n\nvar promise = $.ajax({\n  url: 'https://google.com'\n\
    });\n\n// 输出 \"true\"\npromise.always(function() {\n  remoteValue = true;\n  doSomethingWithRemoteValue();\n\
    });\n\n// 输出 \"foobar\"\npromise.always(function() {\n  remoteValue = 'foobar';\n\
    \  doSomethingWithRemoteValue();\n});\n```\n\n你可以使用 promises 以链式回调的方式组织函数，在我看来，这种方式比嵌套回调更易处理，此外，这些对象还提供了许多其他益处。\n\
    \n# 模式与代码组织\n\n浏览器中的动画也是异步的，因此这也是常见的困惑来源。\n我在这里不会详细阐述，但你需要像处理 ajax 请求那样，通过回调函数来处理动画。我真的不是该主题的专家，所以请查阅\
    \ `jQuery.animate()` 方法。\n\n# JavaScript 中的简单继承\n\n粗略来说，JavaScript 通过克隆对象来扩展它们，而\
    \ PHP、Ruby、Python 和 Java 则使用并扩展类。在 JavaScript 中，你有被称为“原型（prototype）”的东西，每个对象都有一个原型。事实上，函数、字符串、数字和对象都有共同的祖先\
    \ `Object`。关于原型有两点需要记住：蓝图和链。\n\n每个原型本身就是一个对象，它描述了创建对象实例时可用的属性。原型链允许原型扩展其他原型。事实上，原型可以拥有原型。当某个方法或属性在对象上不存在时，它会查找该对象的原型，然后是原型的原型，直到找到它，或者如果属性找到则返回\
    \ `undefined`。\n\n幸运的是，初学者通常不需要纠结这些内容，因为只需创建一个对象字面量并在运行时向它添加属性。\n\n```javascript\n\
    var obj = {};\nobj.newFunction = function() {\n  console.log('I am a function');\n\
    }\nobj.newFunction();\n```\n\n扩展对象的另一种简单方法是使用 `jQuery.extend()`：\n\n```javascript\n\
    var obj = {\n  a: 'i am a property'\n}\nvar newObj = {\n  b: function() {\n  return\
    \ 'i am a function'\n  }\n}\n```\n\n> http://api.jquery.com/animate/\n\n# 模式与代码组织\n\
    \n```javascript\nvar finalObj = $.extend({}, obj, newObj);\n```\n\n```javascript\n\
    console.log(finalObj.a); //输出 \"i am a property\"\nconsole.log(finalObj.b); //输出\
    \ \"i am a function\"\n```\n\nECMAScript 5 提供了 `Object.create()`，你可以用它来扩展现有对象，但你可能需要避免这样做以支持旧浏览器。它在属性创建和设置方面具有独特的优势。\n\
    \n"
