    # # I still don''t get it


    Try reading my introduction to callbacks^{173}.


    # # What about promises?


    Promises^{174} are a more abstract pattern of working with async code in JavaScript.


    The scope of this document is to show how to make sure you write vanilla javascript.
    If you use a third party library that adds abstraction to your JS then''re willing
    to force everyone who contributes to your library to also have the same views
    on JS as.


    In my own experience I use callbacks for 90% of the async code I write and when
    things get hairy I bring in something like the async^{175} library.


    That being said, everyone develops their own unique JavaScript style and what
    should you do with like. Just remember that there are no absolutes: some people
    like to use only callbacks, some people don''t.


