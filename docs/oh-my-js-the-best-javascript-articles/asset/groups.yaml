    \ the effects of delays imposed by script loading on other page components. There\
    \ is no need to use the language or type attributes. It is the server, not the\
    \ script tag, that determines the MIME type.\n\n# Indentation\n\nThe unit of indentation\
    \ is four spaces. Use of tabs should be avoided because (as of this writing in\
    \ the 21st Century) there is still not a standard for the placement of tabstops.\
    \ The use of spaces can produce a larger filesize, but the size is not significant\
    \ over local networks, and the difference is eliminated by minification.\n\n#\
    \ Line Length\n\nAvoid lines longer than 80 characters. When a statement will\
    \ not fit on a single line, it may be necessary to break it. Place the break after\
    \ an operator, ideally after a comma. A break after an operator decreases the\
    \ likelihood of a copy-paste error will be masked by semicolon insertion. The\
    \ next line should be indented 8 spaces.\n\n# Comments\n\nBe generous with comments.\
    \ It is useful to leave information that will be read at a later time by people\
    \ (possibly yourself) who will need to understand what you have done. The comments\
    \ should be well-written and clear, just like the code they are annotating. An\
    \ occasional nugget of humor might be appreciated. Frustrations and results will\
    \ not.\n\nIt is important that comments be kept up-to-date. Erroneous comments\
    \ can make programs even harder to read and understand.\n\nMake comments meaningful.\
    \ Focus on what is visible.\n\n```\ni = 0; // Set i to zero.\n```\n\n> http://yuy.com/blog/2006/06/01/global-domination/\n\
    \n# Variable Declarations\n\nAll variables should be declared before they are\
    \ used. JavaScript does not have block scope, so defining variables in blocks\
