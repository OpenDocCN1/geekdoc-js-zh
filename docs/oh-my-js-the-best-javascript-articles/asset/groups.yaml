    \n## 使用监听器\n\n使用监听器的代码很简单：\n\n```\nfinder.on('done', function (event, records)\
    \ {\n  processor.run(records);\n});\nprocessor.on('done', function (event, records)\
    \ {\n  console.log(records);\n});\nfinder.run([1,2]);\n```\n\n再次，控制台运行将输出 [1,2,3,4,5,6]\n\
    工作示例在此处：\n\n## 优点\n\n- - 这是另一个易于理解的模式。\n- 大优势是你不再局限于每个对象一个监听器，你可以添加任意数量的监听器。例如：\n\
    - finder.on('done', function (event, records) { .. 执行一些事情 }).on('done', function\
    \ (event, records) { .. 执行其他事情 });\n\n## 缺点\n\n- - 在你的代码中设置回调稍微困难一点，你可能想使用像 jQuery、bean.js¹⁰\
    \ 这样的库。\n\n图片致谢：Nod Young / Foter / CC BY-NC-SA\n\n## Flow控制库\n\n流程控制库也是处理异步代码的一种棒的方法。特别流行的是\
    \ Async.js¹¹。\n使用 Async.js 的代码如下：\n\n```javascript\nasync.series({\n  function(){\
    \ ... },\n  function(){ ... }\n});\n```\n\n## 设置 (示例 1)\n\n同样我们需要几个执行工作的函数，就像其他示例一样，这些函数在现实世界中可能会发送\
    \ AJAX 请求并返回结果。现在我们只使用超时。\n\n> ¹⁰ https://github.com/fat/bean\n¹¹ https://github.com/caolan/async\n\
    \n```javascript\nfunction finder(records, cb) {\n  setTimeout(function () {\n\
    \    records.push(3, 4);\n    cb(null, records);\n  }, 1000);\n}\nfunction processor(records,\
    \ cb) {\n  setTimeout(function () {\n    records.push(5, 6);\n    cb(null, records);\n\
    \  }, 1000);\n}\n```\n\nNode 延续传递样式。注意上面函数内部回调使用的样式。\n\ncb(null, records);\n\n\
    如果没有发生错误，回调中的第一个参数为 null；如果发生错误，则为错误对象。这是 Node.js 库中的常见模式，因为 Async.js 使用了这种模式。通过使用这种样式，Async.js\
    \ 和回调之间的流程变得超级简单。\n\n## 使用 Async\n\n使用回调的代码如下：\n\n```javascript\nasync.waterfall([\n\
    \  function(cb) {\n    finder([], cb);\n  },\n  function(records, cb) {\n    processor(records,\
    \ cb);\n  }\n], function(results) {\n  console.log(results);\n});\n```\n\nNode\
    \ 延续传递样式。注意上面函数内部回调使用的样式。\n\ncb(null, records);\n\n如果没有发生错误，回调中的第一个参数为 null；如果发生错误，则为错误对象。这是\
    \ Node.js 库中的常见模式，因为 Async.js 使用了这种模式。通过使用这种样式，Async.js 和回调之间的流程变得超级简单。\n\n##\
    \ 设置 (示例 2)\n\n同样我们需要几个执行工作的函数，就像其他示例一样，这些函数在现实世界中可能会发送 AJAX 请求并返回结果。现在我们只使用超时。\n\
    \n```javascript\nfunction finder(records, cb) {\n  setTimeout(function () {\n\
    \    records.push(3, 4);\n    cb(null, records);\n  }, 1000);\n}\nfunction processor(records,\
    \ cb) {\n  setTimeout(function () {\n    records.push(5, 6);\n    cb(null, records);\n\
    \  }, 1000);\n}\n```\n\nNode 延续传递样式。注意上面函数内部回调使用的样式。\n\ncb(null, records);\n\n\
    如果没有发生错误，回调中的第一个参数为 null；如果发生错误，则为错误对象。这是 Node.js 库中的常见模式，因为 Async.js 使用了这种模式。通过使用这种样式，Async.js\
    \ 和回调之间的流程变得超级简单。\n\n（注：由于提供的待翻译文本中存在大量重复内容，已按要求合并并翻译了核心逻辑部分）\n\n"
