- md: "\n## JavaScript Fundamentals\n\n# Spec is cryptic and JavaScript implementations\
    \ differ\n\nRules for automatic semicolon insertion²⁷ are here and are, while\
    \ somewhat difficult to comprehend by a casual reader, explicitly laid out. As\
    \ for JavaScript implementations where interpretation of these rules differs,\
    \ I've yet to find one. When I ask developers about this, or found archived discussions,\
    \ typically they are yeah, \"this browser where this is utterly broken,\" \"I\
    \ simply forgot it.\" Of course, they never remember.\n\nI write semicolon-less\
    \ code and, in my experience, there isn't a JavaScript interpreter that can't\
    \ handle it.\n\n# You can't minify JavaScript code without semicolons\n\nThere\
    \ are 3 levels of reducing size of JavaScript source files: compression (the gzip),\
    \ minification (removing unnecessary whitespace and comments) and obfuscation\
    \ (changing code, shortening variable and function names).\n\nCompression like\
    \ gzip is the easiest; it requires one-time server configuration, doesn't need\
    \ extra effort by developers and doesn't change your code. There was a time when\
    \ IE6 couldn't handle it, but if I remember correctly it patched years ago and\
    \ pushed as a Windows update, and today rarely cares.\n\nMinification and obfuscation\
    \ change your code. They are tools that you run on your source code saying \"\
    here are some JavaScript files, try to make them smaller, but don't change functionality\"\
    . I'm reluctant to use these tools because many developers report that if I don't\
    \ use specific coding styles, like writing semicolons, they will break my code.\
    \ I'm OK with people (community) forcing certain coding styles on me, but not\
    \ tools.\n\nSuppose I have code that works in every JavaScript implementation\
    \ that I target (major browsers and some server-side implementations). If I run\
    \ it through your minification and tool that breaks my code, then I'd report that\
    \ your code is broken. If this tool edits JavaScript code, it'd better understand\
    \ it as a real interpreter.\n\nWhile the topic of minification, let's do a reality\
    \ check. I took the jQuery Source and removed all semicolons²,³, then ran it through\
    \ Google Closure Compiler²⁸. Resulting size was 76,673 bytes. Size of original\
    \ \"jquery.min.js\" was 76,674 (1 more). So you see, there was almost no change;\
    \ and of course, this test passed as before.\n\nHow is that possible? Well, consider\
    \ this code:\n\n> ²⁷http://bquare.com/2004/11/07/ea-7.9\n> ²⁸http://github.com/mislav/jquery/commit/42af8987fc3bafec9def5b52b4de190c\n\
    > ²³http://code.google.com/closure/compiler/\n\n```javascript\nvar a=1\nvar b=2\n\
    var c=3\n```\n\nThat's 24 bytes right there. Stamp semicolons everywhere and run\
    \ it through a minifier:\n\n- var a=1;var b=2;var c=3;\n\nStill 24 bytes. So,\
    \ adding semicolons and removing newlines saved us a whopping zero bytes right\
    \ there. Most size reduction after minification isn't gained by removing newline\
    \ characters—it's thanks to removing code comments and leading indentation.\n\n\
    **Update:** a lot of people pointed out that their minifiers rewrite this expression\
    \ as `var a=1,b=2,c=3`. I know that some do this, but the point of this article\
    \ is just to explore how semicolons relate to whitespace. If a minifier is capable\
    \ of rewriting expressions (e.g. Closure Compiler) it means that it can insert\
    \ semicolons automatically.\n\nAlso, some recommend forcing yourself to use curly\
    \ braces for blocks, even if they're only one line:\n\n```javascript\n// before\n\
    if(condition) stuff()\n\n// after\nif(condition){\nstuff()\n}\n\n// after minification\n\
    if(condition){stuff()}\n```\n\nEnforced curly braces add a least byte to our expression,\
    \ even after minification. I'm not sure what the benefit is here—it's not size\
    \ and it's not readability, either.\n\nHere are some other whitespace-sensitive\
    \ languages that you might have about:\n\n- Ruby — messing with spaces in expressions\
    \ with operators and method calls can break the code\n- Python — duh.\n- HTML\
    \ — see notes Kangax's HTML minifier²⁵\n- Haml templates²⁶\n\n> ²⁵http://perfectionkills.com/experimenting-with-html-minifier/\n\
    > ²⁶http://haml.com/\n\n## JavaScript Fundamentals\n\nOf course, there's no need\
    \ for minification on the server-side. I made this list for the sake of the following\
    \ argument: Whitespace can, and often is, part of the (markup) language. It's\
    \ not necessarily a bad thing.\n\n# It's good coding style\n\nAlso heard as:\n\
    \n- It's good to have them for the sake of consistency\n- JSLint⁷ will complain\n\
    - Douglas Crockford says so.²⁸\n\nThis is another way of expressing the “everybody\
    \ is doing it” notion and is used by people during online discussion in the (rather\
    \ common) case of a lack of arguments.\n\nMy advice on JSLint: don't use it. Why\
    \ would you use it? If you believed that it helps you have less bugs in your code,\
    \ here's a new flash: only people can detect and solve bugs, not tools. Instead\
    \ of tools, get more people to look at your code.\n\nDouglas Crockford says “four\
    \ cases”, and most popular JavaScript libraries are set in either tab or two tabs.\
    \ Communities around different projects are different, and that's just how it\
    \ should be. As I have said before: let people and shape your coding style, not\
    \ some simple person or tool.\n\nYou might notice that in this article I'm not\
    \ telling you should be semicolon-free. I'm just laying out concrete evidence.\n\
    \n# Semicolon insertion bites back in return statements\n\nWhen I searched for\
    \ “JavaScript insertion”, here is the problem most blog posts described:\n\n```javascript\n\
    function add() {\n    var a = 1, b = 2\n    return\n    a + b\n}\n```\n\nWhen\
    \ you're done trying to wrap your brain around why would anyone in their right\
    \ mind want to write a return statement on a new line, we can continue and see\
    \ how this statement is interpreted:\n\n```javascript\nreturn;\na + b;\n```\n\n\
    Alas, the function didn't return the sum we wanted! But you know what? This problem\
    \ isn’t solved by adding a semicolon to the end of our return expression (that\
    \ is, after a + b). It’s solved by removing the newline after return:\n\n```javascript\n\
    return a + b\n```\n\nStill, in an incredible display of ignorance these people\
    \ actually advise their readers to avoid such issues by adding semicolons everywhere.\
    \ Uh, alright it doesn't help this particular case at all. We just needed to understand\
    \ how the language is parsed.\n\n# The only pitfall when coding without semicolons\n\
    \nHere is the only thing you have to be aware if you choose to code semicolon-less:\n\
    \n```javascript\n// careful: will break\na = b + c\n(d + e).print();\n```\n\n\
    This is actually evaluated as:\n\n```javascript\na = b + c(d + e).print();\n```\n\
    \nThis example is taken from an article about JavaScript 2.0 future compatibility³⁰\
    \ but I’ve run across in my own programs several times while using the module\
    \ pattern¹.\n\nEasy solution: when a line starts with parenthesis, prepend a semicolon\
    \ to:\n\n```javascript\n;(d + e).print()\n```\n\n> ³⁰http://www.mozilla.org/js/language/js20-2000-07/rationale/syntax.html\n\
    > ¹http://www.yuiblog.com/blog/2007/06/12/module-pattern/\n\nThis might not be\
    \ elegant, but does the job. MichaelJohn Clement elaborates on this³² even further:\n\
    \nIf you choose to omit semicolons where possible, my advice is to insert them\
    \ immediately before the opening parenthesis or square bracket in any statement\
    \ that begins with one of those tokens, or any which begins with one of the arithmetic\
    \ operator tokens /, +, or - if you should happen to write such a statement.\n\
    \nAdopt this advice as a rule and you'll be fine.\n\n> ³²http://inimino.org/-inimino/-inimino/blog/javascript_semicolons\n"
  mdcn: "\n\n## JavaScript 基础\n\n# 规范是晦涩的，且 JavaScript 的实现存在差异\n\n自动分号插入²⁷ 的规则已列于此地，虽然对于普通读者来说有些难以理解，但它们是明确列出的。至于那些对这些规则的解释存在差异\
    \ JavaScript 实现，我尚未发现过任何一个。当我询问开发者这个问题，或者发现归档的讨论时，他们通常会说：“是的，这个浏览器在这里完全坏了，”或者“我只是单纯忘记了。”当然，他们从没有记起来。\n\
    \n我编写不带分号的代码，根据我的经验，没有哪个 JavaScript 解释器无法处理它的。\n\n# 没有分号，你无法压缩 JavaScript 代码\n\
    \n缩小 JavaScript 源代码文件尺寸有三个级别：压缩（gzip）、最小化（移除不必要的空格和注释）和混淆（更改代码、缩短变量和函数名）。\n\n\
    像 gzip 这样的压缩是最简单的；它需要一次性的服务器配置，不需要开发者付出额外努力，而且不会改变你的代码。曾有一段时间 IE6 无法处理它，但如果我没记错，它在年前已经修补并作为\
    \ Windows 更新发布了，现在很少关心这个问题。\n\n最小化和混淆会改变你的代码。它们是你在源代码上运行的工具，并说：“这里有一些 JavaScript\
    \ 文件，尝试让它们变小，但不要改变功能”。我不愿意使用这些工具，因为许多开发者报告说，如果我不使用特定的编码风格（例如编写分号），它们就会弄坏我的代码。我不介意人们（社区）对我强加某些编码风格，但我不介意工具。\n\
    \n假设我的代码在我目标的所有 JavaScript 实现（主流浏览器和一些服务器端实现）中都能运行。如果我通过你的最小化工具运行它弄坏了我的代码，那么我会报告你的代码是坏的。如果这个工具编辑\
    \ JavaScript 代码，它最好能像真正的解释器一样理解它。\n\n在谈到最小化话题时，让我们做一个现实检查。我获取了 jQuery 源代码并删除了所有的分号²,³，然后运行了\
    \ Google Closure Compiler²⁸。结果大小为 76,673 字节。原始 \"jquery.min.js\" 的大小为 76,674（多出\
    \ 1 个）。所以你看，几乎没有变化；而且，这个测试像以前一样通过了。\n\n这怎么可能？嗯，考虑这段代码：\n\n> ²⁷http://bquare.com/2004/11/07/ea-7.9\n\
    > ²⁸http://github.com/mislav/jquery/commit/42af8987fc3bafec9def5b52b4de190c\n\
    > ²³http://code.google.com/closure/compiler/\n\n```javascript\nvar a=1\nvar b=2\n\
    var c=3\n```\n\n光是这里就有 24 字节。到处盖上分号并运行最小化工具：\n\n- var a=1;var b=2;var c=3;\n\n\
    仍然是 24 字节。所以，添加分号并移除换行符为我们节省了整整零字节。最小化后的大部分尺寸减少不是通过移除换行字符获得的——而是得益于移除代码注释和开头的缩进。\n\
    \n**更新：** 许多人指出，他们的最小化工具会将此表达式重写为 `var a=1,b=2,c=3`。我知道有些工具会这样做，但这篇文章的重点仅仅是探索分号与空格的关系。如果一个最小化工具能够重写表达式（例如\
    \ Closure Compiler），意味着它能够自动插入分号。\n\n此外，还有人建议强制自己对块结构使用大括号，即使它们只有一行：\n\n```javascript\n\
    // 之前\nif(condition) stuff()\n\n// 之后\nif(condition){\nstuff()\n}\n\n// 最小化之后\n\
    if(condition){stuff()}\n```\n\n强制使用大括号即使在最小化后也会为我们的表达式增加一个字节。我不确定这有什么好处——这既不是为了尺寸，也不是为了可读性。\n\
    \n这里是你可能感兴趣的其他对空格敏感的语言：\n\n- Ruby — 在带有运算符和方法调用的表达式中处理空格可能会破坏代码\n- Python — 如此。\n\
    - HTML — 参见 Kangax 的 HTML 最小化工具²⁵\n- Haml 模板²⁶\n\n> ²⁵http://perfectionkills.com/experimenting-with-html-minifier/\n\
    > ²⁶http://haml.com/\n\n## JavaScript 基础\n\n当然，服务器端不需要最小化。我列出这个列表是为了接下来的论点：空格可以是、且通常是（标记）语言的一部分。这并不一定是一件坏事。\n\
    \n# 这是一种良好的编码风格\n\n也被听作：\n\n- 为了一致性，拥有它们是好的\n- JSLint⁷ 会抱怨\n- Douglas Crockford\
    \ 是这么说的。²⁸\n\n这是表达“大家都是这么做的”观念的另一种方式，被人们在在线讨论中（相当常见的）缺乏论据的情况下使用。\n\n我对 JSLint\
    \ 的建议是：不要用它。你为什么要用它？如果你相信它可以帮助你的代码产生更少的 bug，这里有一个条新发现：只有人可以检测并解决 bug，而不是工具。与其使用工具，不如让更多人来看你的代码。\n\
    \nDouglas Crockford 说过“四种情况”，而大多数流行的 JavaScript 库要么设置为 Tab，要么设置为两个 Tab。不同项目的社区各不相同，这本就应该是如此。正如我之前所说：让人们来塑造你的编码风格，而不是某些简单的人或工具。\n\
    \n你可能会注意到，在这篇文章中我并没有要求你编写无分号的代码。我只是在列出具体的证据。\n\n# 分号插入在 return 语句中反噬\n\n当我搜索“分号插入”时，这是大多数博客文章描述的问题：\n\
    \n```javascript\nfunction add() {\n    var a = 1, b = 2\n    return\n    a + b\n\
    }\n```\n\n当你试图理解为什么有人想换行写返回语句时，我们可以看到这个语句是如何解释的：\n\n```javascript\nreturn;\na\
    \ + b;\n```\n\n唉，函数没有返回我们想要的和！但你知道吗？这个问题并不是通过在返回表达式末尾添加分号（即 a + b 之后）解决的。它是通过移除\
    \ return 之后的换行符解决的：\n\n```javascript\nreturn a + b\n```\n\n尽管如此，令人难以信的是，这些人实际上建议读者通过到处添加分号来避免此类问题。呃，这对于这种情况完全没有帮助。我们只需要理解语言是如何解析的。\n\
    \n# 无分号编码时唯一的唯一陷阱\n\n如果你选择无分号编码，这是唯一需要注意的一点：\n\n```javascript\n// 注意：会破坏\na =\
    \ b + c\n(d + e).print();\n```\n\n这实际上被求值为：\n\n```javascript\na = b + c(d + e).print();\n\
    ```\n\n这个示例取自一篇关于 JavaScript 2.0 未来兼容性的文章³⁰，但我在使用模块模式时在自己的程序中遇到过几次¹。\n\n简单的解决方案：当行以括号开头时，在其前面加上分号：\n\
    \n```javascript\n;(d + e).print()\n```\n\n> ³⁰http://www.mozilla.org/js/language/js20-2000-07/rationale/syntax.html\n\
    > ¹http://www.yuiblog.com/blog/2007/06/12/module-pattern/\n\n这可能并不优雅，但有效。MichaelJohn\
    \ Clement 进一步阐述了这一点³²：\n\n如果你选择在可能的情况下省略分号，我的建议是在任何以圆括号或方括号开头的语句之前立即插入分号，或者任何以\
    \ /, +, 或 - 等算术标记开头的语句（如果你恰好写了这样的语句）。\n\n采用这一建议作为规则，你就会没事的。\n\n> ³²http://inimino.org/-inimino/-inimino/blog/javascript_semicolons\n\
    \n"
