    PDFKit is a PDF document-generation library for Node.js that makes it easy to
    create complex, printable documents. It is written in pure CoffeeScript, but you
    can use the API in plain ''ol JavaScript if you like. The API embraces chain,
    and it includes both low-level functions as abstractions for higher-level functionality.


    # Forever¹¹²⁶


    A simple CLI tool to ensure that a given script runs continuously (i.e. forever).


