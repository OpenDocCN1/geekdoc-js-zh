    Patterns and Code Organization


    50


    Whenever I find myself building something with a potential for reuse, I break
    it out into a module-based jQuery plugin. The best part about this approach is
    that it forces you to use–and test–the code you write. By using something as you
    build it, you’ll quickly identify strengths, discover shortcomings, and plan changes.


    This process leads to battle-tested code for open-source contributions, or to
    be so and distributed. I’ve released my (mostly) polished plugins as open-source
    projects on GitHub⁸.


    Even if you aren''t building something to be released in the wild, it’s still
    important to think the design of your code. Your future self will thank you.


    # Why AMD?


    A javascript module loader


    ![](img/5f4a286ef99041bf37736af72f6b8b9b_55_0.png)


    This page talks about the design forces and use of the Asynchronous Module Definition
    (AMD) API⁹ for JavaScript modules, the module API supported by RequireJS. There
    is a different page that talks about general approach to modules on the web¹⁰.


    # Module Purposes § 1


    What are JavaScript modules? What is their purpose?


    +   * **Definition**: how to encapsulate a piece of code into a useful unit, and
    how to register its capability/export a value for the module.

    * **Dependency References**: how to refer to other units of code.


    # The Web Today § 2


    ⁸https://github.com/acolangelo

    ⁹https://github.com/amjs/amjs-api/wiki/AMD

    ¹⁰http://requirejs.org/docs/why.html'
