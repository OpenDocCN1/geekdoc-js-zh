- md: "\n# Patterns and Code Organization\n\n```\n//Calling define with module ID,\
    \ dependency array, and factory function\ndefine('myModule', ['dep1', 'dep2'],\
    \ function (dep1, dep2) {\n  //Define the module value by returning a value.\n\
    \  return function () {};\n}\n```\n\nYou should avoid naming modules yourself,\
    \ and only place one module in a file while developing. However, for tooling and\
    \ performance, a module solution needs a way to identify modules in built resources.\n\
    \n# Sugar § 7\n\nThe AMD example works in all browsers. However, there is a risk\
    \ of mismatched dependency names named with function arguments, and it can start\
    \ to look a bit strange if your module has many dependencies:\n\n```\ndefine([\"\
    require\", \"jquery\", \"blade/object\", \"blade/fn\", \"rdapi\",\n\"oauth\",\
    \ \"blade/jig\", \"blade/url\", \"dispatch\", \"accounts\",\n\"storage\", \"services\"\
    , \"widgets/AccountPanel\", \"widgets/TabButton\",\n\"widgets/AddAccount\", \"\
    less\", \"osTheme\", \"jquery-ui-1.8.7.min\",\n\"query.jTextField\");\nfunction(require,\
    \ $, object, fn, rdapi,\noauth, jig, url, dispatch, accounts,\nstorage, services,\
    \ AccountPanel, TabButton,\nAddAccount, less, osTheme);\n});\n```\n\nTo make this\
    \ easy and it is easy to make a simple wrapping around CommonJS modules, this\
    \ form of define is supported, sometimes referred to as “simplified CommonJS wrapping:\"\
    ,\n\n```\ndefine(function(require) {\n  var dependency1 = require('dependency1'),\n\
    \  dependency2 = require('dependency2');\n  return function () {};\n});\n```\n\
    \nThe AMD loader will parse the require('()') calls by using Function.prototype.toString(),\
    \ then internally convert the define call into this:\n\n```\ndefine(['require',\
    \ 'dependency1', 'dependency2'], function (require) {\n  var dependency1 = require('dependency1');\n\
    \  dependency2 = require('dependency2');\n\n  return function () {};\n});\n```\n\
    \nThis allows the loader to load dependency1 and dependency2 asynchronously, execute\
    \ the dependencies, then execute this function.\n\nNot all browsers give a usable\
    \ Function.prototype.toString() results. As of October 2011, the PS 3 and Opera\
    \ Mobile browsers do not. Those browsers are more likely to need an optimized\
    \ build of the modules for network/device limitations, so just do build with an\
    \ optimizer that knows how to convert these into the normalized dependency array\
    \ form, like the RequireJS optimizer⁵³.\n\nSince the number of browsers that cannot\
    \ support this toString() scanning is very small, it is safe to use this shared\
    \ forms for all your modules, particularly if you like to line up the dependency\
    \ names with the variables that will hold their module values.\n\n# CommonJS Compatibility\
    \ § 8\n\nEven though this sighed form is referred to as the \"simplified CommonJS\
    \ wrapping\", it is not 100% compatible with CommonJS modules. However, the cases\
    \ that are not supported would likely break in the browser anyway, they generally\
    \ assume synchronous loading of dependencies.\n\nMost CJS modules, around 95%\
    \ based on my (thoroughly unscientific) personal experience, are perfectly compatible\
    \ with the simplified CommonJS wrapping.\n\nThe modules that break are ones that\
    \ do a dynamic calculation of a dependency, anything that does not use a string\
    \ literal for the require() call, and anything that does not look like a declarative\
    \ require() call.\n\n```javascript\n// BAD\nvar mod = require(someCondition) ?\
    \ 'a' : 'b');\n\n// BAD\nif (someCondition) {\n  var a = require('a');\n} else\
    \ {\n  var a = require('a1');\n}\n```\n\n> ⁵http://requirejs.org/docs/optimization.html\n\
    \n# Patterns and Code Organization\n\nThese cases are handled by the callback-require⁵⁴,\
    \ require([moduleName], function () {}) normally present in AMD loaders.\n\nThe\
    \ AMD execution model is better aligned with how ECMAScript Harmony modules are\
    \ being specified. The CommonJS modules that would not work in an AMD wrapper\
    \ will not work as a Harmony module. AMD's code execution behavior is more future\
    \ compatible.\n\n# Verbosity vs. Usefulness\n\nOne of the criticisms of AMD, at\
    \ least compared to CJS modules, is that it requires a level of indent and a function\
    \ wrapping.\n\nBut here is the plain truth: the perceived extra typing and a level\
    \ of indent to use AMD does not matter. Here is where your time goes coding:\n\
    \n- Thinking about the problem.\n- Reading code.\n\nYour time coding is mostly\
    \ spent thinking. While fewer words are generally preferable, there is a limit\
    \ to that approaching off, and the extra typing in AMD is not that much.\n\nMost\
    \ web developers use a function wrapper to avoid polluting the page with globals.\
    \ Seeing a function wrapped around functionality is very common sight and does\
    \ not add to the reading cost of a module.\n\nWhat is important: being able to\
    \ share code with others. AMD is the lowest pathway to that goal.\n\nReturning\
    \ a function as the module value, particularly a constructor, leads to better\
    \ API design. Node.exports to allow this, but being able to use \"return\" to\
    \ do module.exports, and return function()\" is much cleaner. It means not having\
    \ to get handle on \"module\" to do module.exports, and it is a clearer expression.\n\
    \nHaving a working, easy to debug module system that today's browsers means real\
    \ world experience in making the best module system for JavaScript.\n\nAMD and\
    \ its related APIs have shown the power for any future JS module system:\n\nSelectively\
    \ mapping one module to load from another makes it easy. There are also hidden\
    \ costs with CommonJS format:\n\n- tooling cost\n- edge cases that break in browsers,\
    \ like cross domain\n- worse debugging, a cost that continues to add up over time\n\
    \nSince the number of browsers that cannot support this toString() scanning is\
    \ very small, it is safe to use this shared forms for all your modules, particularly\
    \ if you like to line up the dependency names with the variables that will hold\
    \ their module values.\n\nDynamic code loading (done in AMD require([], function\
    \ ())) is a basic requirement. CJS talked about this need, had some proposals,\
    \ but was not fully embraced. Node does not have any support for this, instead\
    \ relying on the synchronous behavior of require(), which is not portable to the\
    \ web.\n\nLoader plugins are incredibly useful. It helps avoid nested indent in\
    \ callback-based programming. There should only one action for each module, and\
    \ it should be straightforward. Web browsers are not tolerant of multiple lookups\
    \ which Node does now, and avoid the use of package.json \"main\" property. Just\
    \ use module names that map easily to one location on the project's location,\
    \ using a default convention so that older code can participate in the new system.\n\
    \nIf a JS module system cannot deliver the above features, it is at a significant\
    \ disadvantage compared to AMD and its related APIs around callback-require⁵⁷,\
    \ and paths-based module IDs.\n\n# Used Today § 9\n\nAs of mid October 2011, AMD\
    \ already has good adoption on the web:\n\n- associated modules like bonzo⁵³,\
    \ query⁵⁴, bean⁵⁵ and domready⁵⁶\n- Used by Firebug⁶⁷ 1.8+\n- jQuery⁵⁹ 1.7\n-\
    \ Dojo⁶⁰ 1.7\n- EmbedJS⁶¹\n- The simplified CommonJS wrapper is used in Jetpack/Add-on\
    \ SDK⁶⁸ for Firefox\n- Used for parts of sites on the BBC⁶⁹ (observed by looking\
    \ at the source, not an official recommendation of AMD/RequireJS)\n\nhttps://github.com/amjs/amd-api/wiki/require\n\
    > ⁵⁶https://requirejs.org/docs/plugins.html\n> ⁵⁷https://github.com/amjs/amd-api/wiki/require\n\
    > ⁵⁸https://github.com/amjs/amd-api/wiki/Loader-Plugins\n> ⁵⁹https://jquery.com/\n\
    > ⁶⁰https://dojoskit.org/\n> ⁶¹https://uxe.github.com/embed/\n> ⁶²https://ender.node.de/\n\
    > ⁶³https://github.com/ded/bonzo\n> ⁶⁴https://github.com/ded/query\n> ⁶⁵https://github.com/fat/bean\n\
    > ⁶⁶https://github.com/ded/domready\n> ⁶⁷https://firebug.com/\n\n# What You Can\
    \ Do § 10\n\nIf you write applications:\n\n- Give an AMD loader to try. You have\
    \ some choices:\n  - RequireJS⁷⁰\n  - curl⁷¹\n  - Dojo⁷² 1.7+\n\nIf you want to\
    \ use AMD but still the one script at the bottom of the HTML page approach:\n\n\
    - Use the RequireJS optimizer⁷⁴ either in command line mode or as HTTP service⁷³\
    \ with the almond shim⁷⁶.\n\nIf you are a script/library author:\n\n- Optionally\
    \ define() if it is available. The nice thing is that you can still code your\
    \ library without relying on AMD, just participate if it is available. This allows\
    \ consumers of your modules to:\n  - avoid dumping global variables in the page\n\
    \  - use more options for code loading, delayed loading\n  - use existing AMD\
    \ tooling to optimize your project\n  - participate in a workable module system\
    \ for JS in the browser today.\n\nIf you write code loaders/engines/environments\
    \ for JavaScript:\n\n> ⁶⁸https://address.mozilla.org/en-US/developers/docs/sdk/1.1/\n\
    > ⁶⁹https://www.bbc.co.uk/\n> ⁷⁰https://requirejs.org/\n> ⁷¹https://github.com/scriptable/curl\n\
    > ⁷²https://github.com/zead/js\n> ⁷³http://devkit.org/\n> ⁷⁴https://requirejs.org/docs/optimization.html\n\
    > ⁷⁵https://github.com/jburke/r/js/blob/master/build/tests/httpBuild.js\n> ⁷⁶https://github.com/jburke/almond\n\
    > ⁷⁷https://github.com/umds/umd\n"
  mdcn: "\n\n# 模式与代码组织\n\n```\n// 使用模块 ID、依赖数组和工厂函数调用 define\ndefine('myModule', ['dep1',\
    \ 'dep2'], function (dep1, dep2) {\n  // 通过返回一个值来定义模块的值。\n  return function ()\
    \ {};\n}\n```\n\n在开发过程中，你应该避免自己手动命名模块，并且在一个文件中只放置一个模块。然而，为了工具化和性能考虑，模块解决方案需要一种在构建资源中识别模块的方法。\n\
    \n# Sugar 语法 § 7\n\nAMD 示例在所有浏览器中都能运行。然而，存在与函数参数命名的依赖名称不匹配的风险，而且如果你的模块有许多依赖项，看起来可能会有些奇怪：\n\
    \n```\ndefine([\"require\", \"jquery\", \"blade/object\", \"blade/fn\", \"rdapi\"\
    ,\n\"oauth\", \"blade/jig\", \"blade/url\", \"dispatch\", \"accounts\",\n\"storage\"\
    , \"services\", \"widgets/AccountPanel\", \"widgets/TabButton\",\n\"widgets/AddAccount\"\
    , \"less\", \"osTheme\", \"jquery-ui-1.8.7.min\",\n\"query.jTextField\");\nfunction(require,\
    \ $, object, fn, rdapi,\noauth, jig, url, dispatch, accounts,\nstorage, services,\
    \ AccountPanel, TabButton,\nAddAccount, less, osTheme);\n});\n```\n\n为了方便起，并且易于对\
    \ CommonJS 模块进行简单的封装，支持这种形式的 define，有时被称为“简化的 CommonJS 包装”：\n\n```\ndefine(function(require)\
    \ {\n  var dependency1 = require('dependency1'),\n  dependency2 = require('dependency2');\n\
    \  return function () {};\n});\n```\n\nAMD 加载器将通过 `Function.prototype.toString()`\
    \ 解析 `require('()')` 调用，然后在内部将 `define` 调用转换为此处：\n\n```\ndefine(['require', 'dependency1',\
    \ 'dependency2'], function (require) {\n  var dependency1 = require('dependency1');\n\
    \  dependency2 = require('dependency2');\n\n  return function () {};\n});\n```\n\
    \n这允许加载器异步加载 dependency1 和 dependency2，执行依赖项，然后执行此函数。\n\n并不是所有浏览器都能可用的 `Function.prototype.toString()`\
    \ 结果。截至 2011 年 10 月，PS 3 和 Opera Mobile 浏览器尚不支持。这些浏览器由于网络/设备限制，更有可能需要模块的优化构建，因此只需使用知道如何将这些转换为规范化依赖数组形式的优化器进行构建，例如\
    \ RequireJS 优化器⁵³。\n\n由于不支持这种 `toString()` 扫描的浏览器数量非常少，因此对你的所有模块使用这种共享形式是安全的，特别是如果你喜欢将依赖名称与存储其模块值的变量对齐时。\n\
    \n# CommonJS 兼容性 § 8\n\n尽管这种形式被称为“简化的 CommonJS 包装”，但它与 CommonJS 模块并不是 100% 兼容的。然而，那些不支持的情况在浏览器中可能也会崩溃，因为它们通常假设依赖项是同步加载的。\n\
    \n根据我（完全不科学的）个人经验，大约 95% 的 CJS 模块与简化的 CommonJS 包装完全兼容。\n\n会崩溃的模块是那些对依赖项进行动态计算的模块、任何在\
    \ `require()` 调用中未使用字符串字面量的模块，以及任何看起来不像声明式 `require()` 调用的模块。\n\n```javascript\n\
    // 错误\nvar mod = require(someCondition) ? 'a' : 'b');\n\n// 错误\nif (someCondition)\
    \ {\n  var a = require('a');\n} else {\n  var a = require('a1');\n}\n```\n\n>\
    \ ⁵http://requirejs.org/docs/optimization.html\n\n# 模式与代码组织\n\n这些情况通常由 AMD 加载器中常见的回调-require⁵⁴（即\
    \ `require([moduleName], function () {})`）处理。\n\nAMD 执行模型与 ECMAScript Harmony\
    \ 模块的规范方式更加一致。在 AMD 包装中无法工作的 CommonJS 模块将无法工作。AMD 的执行行为更具未来兼容性。\n\n# 冗余与实用性\n\n\
    AMD 的批评之一（与 CJS 模块相比）是它需要层层缩进和函数包装。\n\n但事实是：感知的额外输入和使用 AMD 的层层缩进并不重要。你的时间大部分花在了这里：\n\
    \n- 问题的思考。\n- 阅读代码。\n\n虽然更少的单词通常更优，但 AMD 的额外输入并没有那么多。大多数 Web 开发者使用函数包装来避免全局变量污染页面。重要的是：能够与他人共享代码。AMD\
    \ 是实现这一目标的最低路径。\n\n返回一个函数作为模块值，特别是作为构造函数时，会导致更好的 API 设计。AMD 及其相关 API 显示了任何未来 JS\
    \ 模块系统的威力。“return function”意味着不需要处理 `module.exports`，并且更加清晰。\n\n一个工作且易于调试的模块系统对于今天的\
    \ JavaScript 来说是最好的。选择性地将一个模块加载到另一个模块是很容易的。AMD 有一些隐藏的成本：\n\n- 工具化成本\n- 在浏览器中崩溃的边缘情况，如跨域\n\
    - 随着时间推移持续增加的\n\n# 今日 § 9\n\n截至 2011 年 10 月中，AMD 在 Web 端已经有了良好的应用：\n\n- 相关模块如\
    \ bonzo⁵³、query⁵⁴、bean⁵⁵ 和 domready⁵⁶\n- 用于 Firebug⁶⁷ 1.8+\n- jQuery⁵⁹ 1.7\n-\
    \ Dojo⁶⁰ 1.7\n- EmbedJS⁶¹\n在 Firefox 的 Jetpack/Add-on SDK⁶⁸ 中使用\n- 用于 BBC 的部分网站⁶⁹（通过查看源码观察到\
    \ AMD/RequireJS 的官方推荐）\n\n# 你可以做什么 § 10\n\n如果你编写应用程序：\n\n- 给一个 AMD 加载器试试。你有一些选择：\n\
    \  - RequireJS⁷⁰\n  - curl⁷¹\n  - Dojo⁷² 1.7+\n\n如果你想使用 AMD 但仍然采用在 HTML 页面底部单个脚本的方法：\n\
    \n- 使用 RequireJS 优化器⁷⁴，可以是命令行模式或带有 almond shim⁷⁶ 的 HTTP 服务⁷³。\n\n如果你是脚本/库作者：\n\
    \n- 如果可用，可选 `define()`。很棒的是，你仍然可以在不依赖 AMD 的情况下编写你的库，只需在可用时参与即可。这允许你的模块的使用者：\n\
    \  - 避免在页面中释放全局变量\n  - 为代码加载、延迟加载提供更多选项\n  - 使用现有的 AMD 工具优化你的项目\n  - 参与今天浏览器中可行的模块系统。\n\
    \n如果你为 JavaScript 编写代码加载器/引擎/环境：\n\n> ⁶⁸https://address.mozilla.org/en-US/developers/docs/sdk/1.1/\n\
    > ⁶⁹https://www.bbc.co.uk/\n> ⁷⁰https://requirejs.org/\n> ⁷¹https://github.com/scriptable/curl\n\
    > ⁷²https://github.com/zead/js\n> ⁷³http://devkit.org/\n> ⁷⁴https://requirejs.org/docs/optimization.html\n\
    > ⁷⁵https://github.com/jburke/r/js/blob/master/build/tests/httpBuild.js\n> ⁷⁶https://github.com/jburke/almond\n\
    > ⁷⁷https://github.com/umds/umd\n\n"
