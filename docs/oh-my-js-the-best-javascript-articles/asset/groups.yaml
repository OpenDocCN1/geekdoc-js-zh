    # JavaScript 基础


    ## 全球最被误解的编程语言


    原文


    http://javascript.crockford.com/javascript.html

    Douglas Crockford, crockford.com*


    *http://crockford.com


    JavaScript，又称 Mocha、LiveScript、ECMAScript 是世界上最流行的编程语言之一。世界上几乎每台电脑都安装并使用了 JavaScript
    解释器。它的流行完全归功于它作为 Web 脚本语言的角色。


    尽管它非常流行，但很少有人知道 JavaScript 是一门非常优秀的动态对象化编程语言。为什么这门语言会如此被误解？


    ## 命名


    Java 前缀暗示了 JavaScript 与 Java 有关，并且它是 Java 的一个低级版本。这种命名刻意制造了困惑，而困惑导致了误解。JavaScript
    不是解释型的 Java。JavaScript 是一门不同的语言。


    JavaScript 在语法上与 Java 有相似之处，正如 Java 之于 C 一样。但并不是 Java（原名 Oak）最初的设计目标。JavaScript
    并非在 Java 的母地 Sun Microsystems 开发。它最初被称为 LiveScript，但那个名字还不够困惑。


    -Script 后缀暗示它不是一门真正的编程语言，脚本语言低于编程语言。这实际上是一个专业化的问题。与 C 相比，JavaScript 用性能换取表达力和动态性。


    披着 C 外壳的 Lisp


    JavaScript 的类 C 语法（包括大括号和笨拙的 for 语句）使其看起来像是一门普通的程序化语言。这是具有误导性的，因为 JavaScript 与
    Lisp 或 Scheme 等函数式语言相比而非 C 或 Java。它有数组而不是列表，有对象而不是属性列表。函数是一等公民。它有闭包。无需平衡即可获得 lambda。


    ## 类型转换


    JavaScript 是为了 Netscape Navigator 设计的。它的成功使其成为几乎所有网络浏览器的标准配置。这导致了类型转换。JavaScript
    是编程语言中的乔治·里夫。JavaScript 非常适用于大量的非 Web 应用。


    ## 移动目标


    JavaScript 的早期版本非常弱。它们缺乏异常处理、内部函数和继承。在目前的形式下，它是一门完整的对象化编程语言。但许多对语言的观点是基于其不成熟的形式。负责该语言的
    ECMA 委员会正在开发扩展，这些扩展虽然初衷良好，但会加剧语言最大的问题之一：版本已经太多。


    ## 设计错误


    没有编程语言是完美的。JavaScript 也有自己的设计错误，例如将 + 重载为用于加法和字符串拼接，以及容易出错的 with 语句应该被避免。保留字策略过于复杂。分号自动插入是一个巨大的错误，字面量表达式的表示也是如此。这些错误导致了编程错误，并对语言的整体设计提出了质疑。幸运的是，许多问题可以通过良好的
    lint⁴ 工具来缓解。


