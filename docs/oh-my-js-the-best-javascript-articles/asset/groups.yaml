    \ var self = this;\n    setTimeout(function () {\n      records.push(3, 4);\n\
    \      self.trigger('done', [records]);\n    }, 1000);\n  }\n}\n```\n\n```javascript\n\
    var processor = {\n  run: function (records) {\n    var self = this;\n    setTimeout(function\
    \ () {\n      records.push(5, 6);\n      self.trigger('done', [records]);\n  \
    \  }, 1000);\n  }\n}\n```\n\n注意它们在工作完成后调用了 `trigger` 方法，我将使用混入（mix-in）将此方法添加到这些对象中。再次，'trigger'\
