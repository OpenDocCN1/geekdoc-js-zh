    \ // 输出 \"I am the new global function\"\n```\n\n使用 JavaScript 确保变量和函数自包含的一项技术是使用立即调用函数表达式（IIFE），通常称为自执行匿名函数。我通常通过向函数传递一个载体对象向外部世界暴露。这是模块模式的一种变体。\n\
