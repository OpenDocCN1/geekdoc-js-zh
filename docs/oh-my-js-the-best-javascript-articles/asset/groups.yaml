    \      values.splice(at, 1);\n      }\n    }\n  };\n});\n```\n\n# Names\n\nNames\
    \ should be formed from the 26 upper and lower case letters (A .. Z, a .. z),\
    \ the 10 digits (0 .. 9), and _ (underbar). Avoid use of international characters\
