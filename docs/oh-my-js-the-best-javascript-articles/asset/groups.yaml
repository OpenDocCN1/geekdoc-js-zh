    Node.js


    CoffeeScript。你甚至不需要编译它！与其用 `node app.js` 启动服务器，不如用 `coffee app.coffee` 启动。这就是我在我的应用中的做法。我。没错。我是个大人物。我有一个博客。


    - 当我看到 `app.use(app.router)` 时，我很困惑——Express 不是一直都在使用路由器吗？简短回答是，`app.router` 是路由中间件，当你定义路由时它是隐式包含在内的。你可以显式地包含它，因为你可以使用路由中间件使其在其他中间件之前运行，这有时是需要的。这个
    StackOverflow 解释得很好²202。


    - 本指南是为 Express 3 编写的，而版本 4 的路线图²203 显示了某些变化的可能性。最值得注意的是，Express 可能会被拆分成许多许多小的模块，并吸收一些
    Connect 的功能。这还悬而未决，但这些“计划”值得一看。


    # 我渴求


    难道还没有满足你吗？你这个贪婪的。你让我恶心。很快，你就会坐在鸦片馆里，半死不活，流着最后一点编程天赋的口水。


    如果说 Rails 是用 Ruby 构建 Web 应用的事实标准，而魔鬼受虐是用 PHP 构建 Web 应用的事实标准，我的印象是 Express 是构建
    Web 应用的事实标准。与 Rails 不同，Express 的层次要低得多。似乎还没有什么高级 Node 库脱颖而出。我认为这将会改变。请保持关注。


    我不会在这里详述，但由于 Express 是构建在 Connect 之上的，而 Connect 是构建在 Node 之上的，人们已经在 Express 之上构建了许多东西。Express
    wiki 列出了它们²204，其中许多都非常酷。如果你愿意，可以使用这些框架，也可以坚持使用底层的 Express。无论哪种，去构建酷炫的东西吧！


