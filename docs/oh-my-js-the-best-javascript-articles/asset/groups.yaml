- md: "\n## Patterns and Code Organization\n\n59\n\n- Implement the AMD API⁷. There\
    \ is a discussion list⁷⁹ compatibility tests⁸⁰. Implementing AMD, you will reduce\
    \ multi-module system boilerplate and help prove out a workable JavaScript module\
    \ system on the web. This can be fed back into the ECMAScript process to build\
    \ native module support.\n- Also support callback-require⁸¹ and loader plugins⁸².\
    \ Loader plugins are a great way to reduce the nested callback syndrome that can\
    \ be in callback/async-style code.\n\n## JavaScript Dependency Injection\n\n>\
    \ Original Article\n\nhttp://merrickchristensen.com/articles/javascript-dependency-injection.html\n\
    Merrick Christensen, merrickchristensen.com/*\n\n⁷http://merrickchristensen.com/\n\
    \nInversion of control⁸³ and more specifically dependency injection⁸⁴ have been\
    \ growing in popularity in the JavaScript landscape thanks to projects like Require.js⁸⁵\
    \ and AngularJS⁸⁶. This article is a brief introduction to dependency injection\
    \ and how it fits into JavaScript. It will also demystify the elegant way AngularJS\
    \ implements dependency injection.\n\n## Dependency Injection In JavaScript\n\n\
    Dependency injection facilitates better testing by allowing us to mock dependencies\
    \ in environments so we only test one at a time. It enables us to write more maintainable\
    \ code by decoupling our objects from their implementations.\n\nWith dependency\
    \ injection, your dependencies are given to your object instead of creating it\
    \ or explicitly referencing them. This means the dependency injector can provide\
    \ a different dependency based on the context of the situation. For example, in\
    \ your tests it might pass a fake version of your services API that doesn't make\
    \ requests but returns static objects, while in production it produces the actual\
    \ services API.\n\n⁷⁷https://github.com/amdjs/amdjs-api/wiki/AMD\n⁷⁹groups.google.com/group/amd-implement\n\
    ⁸⁰https://github.com/amdjs/amdjs-tests\n⁸¹https://github.com/amdjs/amdjs-api/wiki/require\n\
    ⁸²https://github.com/amdjs/amdjs-api/wiki/Loader-Plugins\n⁸³http://en.wikipedia.org/wiki/Inversion_of_control\n\
    ⁸⁴http://en.wikipedia.org/wiki/Dependency_injection\n⁸⁵http://requirejs.org/\n\
    ⁸⁶http://angularjs.org/\n\n## Patterns and Code Organization\n\nAnother example\
    \ could be to pass ZeptoJS* to your view objects when the device is running Webkit**\
    \ instead of jQuery** to improve performance.\n\nThe main benefits experienced\
    \ by adopting dependency injection are as follows:\n\n1. Code tends to be more\
    \ maintainable.\n2. APIs are more elegant and abstract.\n3. Code is easier to\
    \ test.\n4. Code is more modular and reusable.\n5. Cures cancer. (Not entirely\
    \ true).\n\nHolding dependencies to an API bad becomes a natural process. Coding\
    \ to interfaces is nothing new, the server side world has been testing this idea\
    \ for a long time to the extent that languages themselves implement the concept\
    \ of interfaces. In JavaScript we have to force ourselves to do this. Fortunately\
    \ dependency injection and module systems are a welcome friend.\n\nNow that you\
    \ have some idea of how dependency injection is, takes a look at how to build\
    \ a simple implementation of a dependency injector using AngularJS style dependency\
    \ injection*9 as a reference implementation. This implementation is purely for\
    \ didactic purposes.\n\n## AngularJS Style Injection\n\nAngularJS is one of the\
    \ only front JavaScript frameworks that fully adopts dependency injection right\
    \ down to the core of the framework. To a lot of developers the dependency injection\
    \ is implemented in AngularJS looks completely magic.\n\nWhen creating controllers\
    \ in AngularJS, the arguments are dependency names that will be injected into\
    \ your controller. The argument names are the key here, they are leveraged to\
    \ a dependency name to an actual dependency. Yeah, the word \"key\" was used on\
    \ purpose, you will see why.\n\n```javascript\n/* Injected */\nvar WelcomeController\
    \ = function (Greeter) {\n/** I want a different Greeter injected dynamically.\
    \ **/\n  Greeter.greet();\n}\n```\n\n*http://zepto.com/\n**http://www.webkit.org/\n\
    ***http://jquery.com/\n**9*http://docs.angularjs.org/guide/di\n\n## Basic Requirements\n\
    \nLets explore some of the requirements to make this function work as expected.\n\
    \n1. The dependency container needs to know that this function wants to be processed.\
    \ The AngularJS world that is done through the Application object and the declarative\
    \ HTML bindings. In our world we explicitly ask our injector to process a function.\n\
    2. It needs to know a Greeter before it can inject it.\n\n## Requirement 1: Making\
    \ the injector aware.\n\nTo make our dependency injector aware of our WelcomeController\
    \ we will simply tell our injector want a function processed. Its important to\
    \ know AngularJS ultimately does this thing using less obvious mechanisms whether\
    \ it be the Application object or the HTML declarations.\n\n```javascript\nvar\
    \ Injector = {\n  process: function(target) {\n    // Time to process\n  }\n};\n\
    Injector.process(WelcomeController);\n```\n\nOk, now that the Injector has the\
    \ opportunity to process the WelcomeController we can figure out what dependencies\
    \ the function wants, and execute it with the proper dependencies. This process\
    \ is called dependency resolution. Before we can do that we need a way to register\
    \ dependencies with our Injector object...\n\n## Requirement 2: Registering dependencies\n\
    \nWe need to be able to tell the dependency injector a Greeter before it can provide\
    \ one. Any dependency injector worth's bits will allow you to describe how it\
    \ is. Whether that means being instantiated as a new object or returning a singleton.\
    \ Most injection frameworks even have mechanisms to provide a constructor some\
    \ configuration and register multiple dependencies by the same name. Since our\
    \ dependency injector is just a simplified way to show how AngularJS does dependency\
    \ mapping by parameter names, we won't worry about that.\n\n## Patterns and Code\
    \ Organization\n\n```javascript\nInjector.dependencies = {};\nInjector.register\
    \ = function(name, dependency) {\n  this.dependencies[name] = dependency;\n};\n\
    ```\n\n```javascript\nvar RobotGreeter = {\n  greet: function() {\n    return\
    \ 'Domo Arigato';\n  }\n};\nInjector.register('Greeter', RobotGreeter);\n```\n\
    \n## Moving Forward\n\nThe building blocks are in place it's time for the sweet\
    \ part. The trick is to turn them strings back into functions. The latter is exactly\
    \ what we do here.\n\n```javascript\nvar WelcomeController = function (Greeter)\
    \ {\n  Greeter.greet();\n};\n// Returns the function as a string.\nvar controllable\
    \ = WelcomeController.toString();\n```\n\n## Dependency Checking\n\nIt's time\
    \ to implement the process method of our Injector. First lets take a look at injector.js\
    \ from Angular. You'll notice the reflection starts on line 54 and leverages a\
    \ few regular expressions to parse the function. Let's take a look at the regular\
    \ expression, shall we?\n\n```javascript\nvar FN_ARGS = /^\\FN_ARGS\\s*\\([^{]*\\\
    s*([^)]*)\\)/m;\n```\n\nThe FN_ARGS regular expression is used to select everything\
    \ inside the parentheses of a function. In our case, the dependency list.\n\n\
    ```javascript\n  var args = WelcomeController.toString().match(FN_ARGS)[1];\n\
    \  console.log(args); // Returns Greeter\n```\n\nPretty neat, right? We have now\
    \ parsed the WelcomeController's dependency list in our Injector prior to executing\
    \ the WelcomeController function! Suppose the WelcomeController had multiple dependencies,\
    \ this isn't terribly problematic since we can just split the arguments with a\
    \ comma!\n\n```javascript\nvar MultipleDependenciesController = function(Greeter,\
    \ OtherDependency) {\n  // Implementation of MultipleDependenciesController\n\
    }\nvar args = MultipleDependenciesController\n  .toString()\n  .match(FN_ARGS)[1]\n\
    \  .split(',');\nconsole.log(args); // Returns ['Greeter', 'OtherDependency']\n\
    ```\n\nThe rest is pretty straight forward, we just grab the requested dependency\
    \ by name from our dependencies cache and call the target function passing the\
    \ requested names as arguments. Lets implement the function that maps our array\
    \ of dependency names to their dependencies:\n\n> ^21https://github.com/angular/angular.js/blob/master/src/auto/injector.js\n\
    ^22https://github.com/angular/angular.js/blob/master/src/auto/injector.js\n"
  mdcn: "\n\n## 设计与代码组织\n\n59\n\n- 实现 AMD API⁷。有一个讨论列表⁷⁹兼容性测试⁸⁰。实现 AMD 将帮助减少多模块系统的样板代码，并帮助在\
    \ Web 上证明一个可行的 JavaScript 模块系统。这可以反馈到 ECMAScript 过程中以构建原生模块支持。\n- 同时也支持 callback-require⁸¹\
    \ 和加载插件⁸²。加载插件是减少回调/异步风格代码中可能出现的嵌套回调问题的极佳方法。\n\n## JavaScript 依赖注入\n\n> 原始文章\n\
    \nhttp://merrickchristensen.com/articles/javascript-dependency-injection.html\n\
    Merrick Christensen, merrickchristensen.com/*\n\n⁷http://merrickchristensen.com/\n\
    \n得益于 Require.js⁸⁵ 和 AngularJS⁸⁶ 等项目，反转控制⁸³ 以及更具体说是依赖注入⁸⁴ 在 JavaScript 领域变得越来越流行。本文是对依赖注入的简要介绍，以及它是如何融入\
    \ JavaScript 的。它还将揭示 AngularJS 实现依赖注入的优雅方式。\n\n## JavaScript 中的依赖注入\n\n依赖注入通过允许我们在环境中模拟依赖项，从而允许一次只测试一个，促进了更好的测试。它通过将对象与其实现解耦，使我们能够编写更具维护性的代码。\n\
    \n通过依赖注入，依赖项会被传递给对象，而不是在对象内部创建或显式地引用它们。这意味着依赖注入器可以根据具体的上下文提供不同的依赖项。例如，在测试中，它可能会传递服务\
    \ API 的伪版本，它不会发送请求但返回静态对象；而在生产环境中，它产生实际的服务 API。\n\n⁷⁷https://github.com/amdjs/amdjs-api/wiki/AMD\n\
    ⁷⁹groups.google.com/group/amd-implement\n⁸⁰https://github.com/amdjs/amdjs-tests\n\
    ⁸¹https://github.com/amdjs/amdjs-api/wiki/require\n⁸²https://github.com/amdjs/amdjs-api/wiki/Loader-Plugins\n\
    ⁸³http://en.wikipedia.org/wiki/Inversion_of_control\n⁸⁴http://en.wikipedia.org/wiki/Dependency_injection\n\
    ⁸⁵http://requirejs.org/\n⁸⁶http://angularjs.org/\n\n## 设计与代码组织\n\n另一个例子可以是，当设备运行时，向你的视图对象传递\
    \ ZeptoJS* 而不是 **jQuery** 以提高性能。\n\n采用依赖注入获得的主要好处如下：\n\n1. 代码往往更具可维护性。\n2. API\
    \ 更加优雅和抽象。\n3. 代码更容易测试。\n4. 代码更具模块化和可重用性。\n5. 治愈癌症。（不完全正确）。\n\n将依赖项绑定到 API 的坏习惯会变成一个自然过程。面向接口编程并不新鲜，服务端世界测试这个想法已经很久久了，以至于语言本身都实现了接口的概念。在\
    \ JavaScript 中，我们必须强迫自己这样做。幸运的是，依赖注入和模块系统是深受欢迎的朋友。\n\n现在你已经对依赖注入是什么有了一些了解，让我们看看如何以\
    \ AngularJS 风格的依赖注入*9 作为参考实现来构建一个简单的依赖注入器。此实现纯粹出于教学目的。\n\n## AngularJS 风格注入\n\n\
    AngularJS 是少数几个完全采用依赖注入直到框架核心的前端 JavaScript 框架之一。对于许多开发者来说，AngularJS 中实现的依赖注入看起来完全像魔法一样。\n\
    \n在 AngularJS 中创建控制器时，参数是将被注入到你的控制器的依赖名称。参数名是这里的关键，它们被用来将依赖名称映射到实际依赖项。是的，“键”这个词是有意使用的，你会明白为什么的。\n\
    \n```javascript\n/* 注入 */\nvar WelcomeController = function (Greeter) {\n/** 我希望动态注入一个不同的\
    \ Greeter。 **/\n  Greeter.greet();\n}\n```\n\n*http://zepto.com/\n**http://www.webkit.org/\n\
    ***http://jquery.com/\n\n*9http://angularjs.org/\n\nAngularJS 是少数几个完全采用依赖注入直到框架核心的前端\
    \ JavaScript 框架之一。对于许多开发者来说，AngularJS 中实现的依赖注入看起来完全像魔法一样。\n\n在 AngularJS 中创建控制器时，参数是将被注入到你的控制器的依赖名称。参数名是这里的关键，它们被用来将依赖名称映射到实际依赖项。是的，“键”这个词是有意使用的，你会明白为什么的。\n\
    \n```javascript\n/* 注入 */\nvar WelcomeController = function (Greeter) {\n/** 我希望动态注入一个不同的\
    \ Greeter。 **/\n  Greeter.greet();\n}\n```\n\n*http://zepto.com/\n**http://www.webkit.org/\n\
    ***http://jquery.com/\n\n*9http://angularjs.org/\n\n## 基础要求\n\n让我们探讨为了让它工作而的一些要求。\n\
    \n1. Injector 需要知道函数是什么。\n2. Injector 需要依赖项。\n\n## 要求 1：让 Injector 感知\n\n```javascript\n\
    \  var args = WelcomeController.toString().match(\n_\n  \n(\n);\n```\n\n好的，现在我们已经解析了控制函数的依赖列表，在执行执行Controller\
    \ 之前。\n\n```javascript\nvar Injector = {\n  process: function(target) {\n    //\
    \ 实现\n  }\n};\nInjector.process(WelcomeController);\n```\n\n有趣吧？我们现在解析了 WelcomeController\
    \ 的依赖列表，在执行 WelcomeController 之前！假设 WelcomeController 有多个依赖项，这并不棘手，因为我们可以用逗号分割参数！\n\
    \n```javascript\nvar MultipleDependenciesController = function(Greeter, OtherDependency)\
    \ {\n  // MultipleDependenciesController 的实现\n}\nvar args = MultipleDependenciesController\n\
    \  .toString()\n  .match(FN_ARGS)[1]\n  .split(',');\nconsole.log(args); // 返回\
    \ ['Greeter', 'OtherDependency']\n```\n\n剩余部分非常直观，我们只需要从依赖缓存中按名称获取请求的依赖，并将请求名称作为参数调用目标函数。让我们实现将依赖名称数组映射到依赖项的函数：\n\
    \n```javascript\nInjector.dependencies = {};\nInjector.register = function(name,\
    \ dependency) {\n  this.dependencies[name] = dependency;\n};\n```\n\n```javascript\n\
    var RobotGreeter = {\n  greet: function() {\n    return 'Domo Arigato';\n  }\n\
    };\nInjector.register('Greeter', RobotGreeter);\n```\n\n## 前进\n\n构建块已经就绪，现在到了关键部分。技巧是将这些字符串转换回函数。这正是我们在这里做的。\n\
    \n```javascript\nvar WelcomeController = function (Greeter) {\n  Greeter.greet();\n\
    };\n// 返回函数的字符串\nvar controllable = WelcomeController.toString();\n```\n\n## 依赖检查\n\
    \n是时候实现 Injector 的 process 方法了。首先让我们看看 Angular 的 injector.js。你会注意到反射从第 54 行开始，并利用了一些正则表达式来解析函数。让我们来看看正则表达式，好吗？\n\
    \n```javascript\nvar FN_ARGS = /^\\FN_ARGS\\s*\\([^{]*\\s*([^)]*)/m;\n```\n\n\
    FN_ARGS 正则表达式用于选择函数括号内的所有内容。在我们的案例中，依赖列表。\n\n```javascript\n  var args = WelcomeController.toString().match(FN_ARGS)[1];\n\
    \  console.log(args); // 返回 Greeter\n```\n\n很酷，对吧？我们现在已经在执行 WelcomeController\
    \ 函数之前，在 Injector 中解析了 WelcomeController 的依赖列表！\n\n## 要求 2：注册依赖项\n\n"
