    \ {\n  console.log('i exist');\n}\n\nmyFunction(); //outputs \"i exist\"\n```\n\
    \n# Understanding “this\"\n\nSince JavaScript uses function scope, the meaning\
    \ of this is quite different than what you get in PHP, and causes a lot of confusion.\
    \ Consider the following:\n\n```\nconsole.log(this); // outputs window object\n\
    var myFunction = function() {\n  console.log(this);\n}\nmyFunction(); //outputs\
    \ window object\nvar newObject = {\n  myFunction: myFunction\n}\nnewObject.myFunction();\
    \ //outputs newObject\n```\n\nthis by default refers to the object function is\
    \ contained. Since myFunction() is a property of the global object, this is a\
    \ reference to the global object, which is window. When we we myFunction() into\
    \ a newObject, this now refers to newObject. In PHP and other similar languages,\
    \ this always refers to the the instance of a class containing the method. You\
    \ could argue that JavaScript is doing something stupid here, but truthfully much\
    \ of the power of the JavaScript language comes from this feature. In fact, we\
    \ can even replace the value of this when invoking our JavaScript functions by\
    \ using the call() or apply() methods."
