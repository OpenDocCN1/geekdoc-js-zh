    \ new is not used, so the capitalization convention is the only defense we have.\n\
    \nGlobal variables should be in all caps. (JavaScript does not have macros or\
    \ constants, so there isn’t much point in using all caps to signify features that\
    \ JavaScript doesn’t.)\n\n# Statements\n\n# Simple Statements\n\nEach line should\
    \ contain at most one statement. Put a ; (semicolon) at the end of every statement.\
    \ Note that an assignment statement which is assigning a function literal or object\
