    \n，使用 `varvar   ，，，，，，，函数varvarvar。。。。。var var  var。 varvar `var` 声明 \n```\n\n\
    \n\n\n\n\n\n\n\n {\n  console.log('\n');\n\n\n\n\n\nfunction // 输出 \" function\"\
    \n```\n\n### 理解 “this”\n\n由于 JavaScript 使用函数作用域，`this` 的含义与 PHP 有很大不同。考虑以下情况：\n\
    \n```javascript\nconsole.log(this); // 输出 window object\nvar myFunction = function()\
    \ {\n  console.log(this);\n}\nmyFunction(); // 输出 window object\nvar newObject\
    \ = {\n  myFunction: myFunction\n}\nnewObject.myFunction(); // 输出 newObject\n\
    ```\n\n`this` 默认指向调用它的对象。当我们将 `myFunction()` 调用到 `newObject` 时，`this` 现在指向 `newObject`。在\
    \ PHP 和其他语言中，`this` 总是指向类的实例。\n\n### 模式与代码组织\n\n```javascript\nvar myFunction\
    \ = function(arg1, arg2) {\n  console.log(this, arg1, arg2);\n};\nvar newObject\
    \ = {};\nmyFunction.call(newObject, 'foo', 'bar'); // 输出 newObject \"foo\" \"\
    bar\"\nmyFunction.apply(newObject, ['foo', 'bar']); // 输出 newObject \"foo\" \"\
    bar\"\n```\n\n但让我们领先一步。我们都是通过将想要使用的对象值作为第一个参数来替换 `this` 值。`call()` 和 `apply()`\
