    # # Patterns and Code Organization


    # ## Common JavaScript "Gotchas"


    Original Article


    http://www.jblotus.com/2013/01/13/common-javascript-gotchas


    James Fuller, Jblotusᵃ

    ³ᵃhttp://www.jblotus.com/author/jblotus/


    PHP was my first programming language, and my initial exposure to JavaScript was
    through libraries like jQuery³³. There were things about JavaScript that always
    seemed to trip me up in the beginning due to how they worked differently than
    PHP. Here there are still some things today that are confusing. I want to share
    some of the things I struggled with when I started working with JavaScript. I
    am going to cover the global namespace, this, knowing the difference between ECMAScript
    3 and ECMAScript 5, asynchronous operations, prototypes, and simple JavaScript
    inheritance.


    # ### The Global Namespace


    In PHP specifically, when you declare a variable function outside of a class (or
    namespace block³) you are essentially adding a function to the global namespace.
    In JavaScript, there is no such thing as a namespace per se, rather everything
    is attached to the global object. In the case of the web browser, that is the
    window object. The other key difference is that in JavaScript, functions and variables
    are attributes of the global object, which we typically refer to as properties.


    This can be troublesome because you won''t get a warning in JavaScript if you
    overwrite a global function or property and it can actually be quite dangerous.


    > ³http://jquery.com/

    ³⁴http://php.net/manual/en/language.namespaces.definitionmultiple.php'
  - "[PAGE 30]\n\n```\nfunction globalFunction() {\n  console.log('I am the original\
    \ global function');\n}\nfunction overWriteTheGlobal() {\n  globalFunction = function();\n\
    \  console.log('I am the new global function');\n}\nglobalFunction(); // outputs\
    \ \"I am the original global function\"\noverWriteTheGlobal(); //this will overwrite\
    \ the original global function\nglobalFunction(); // outputs \"I am the new global\
    \ function\"\n```\n\nOne technique is to use JavaScript to ensure that your variables\
    \ and functions are self contained is to use an immediately-invoked function expression,\
    \ commonly known as a self-executing anonymous function. I typically expose to\
    \ the outside world by passing a carrier object to the function. This is a variation\
    \ of the module pattern.\n\n```\nvar module = {};\n(function(exports) {\n  exports.notGlobalFunction\
    \ = function() {\n    console.log('I am not global');\n  };\n}(module));\n\nfunction\
    \ notGlobalFunction() {\n  console.log('I am global');\n}\n\nnotGlobalFunction();\
    \ //outputs \"I am global\"\nmodule.notGlobalFunction(); //outputs \"I am not\
    \ global\"\n```\n\nInside the self-executing anonymous function, all of the global\
    \ scope is enclosed and we finish by attaching it the module variable. Technically\
    \ you could append properties directly to the module variable, but the reason\
    \ we are passing it to the function is to make it explicitly clear what we are\
    \ attaching our function to. It also allows us to alias the passed in in object\
    \ inside the function. The critical thing here is that we are declaring our dependencies\
    \ upfront and not relying on global variables, other than the module variable."
  - "[PAGE 31]\n\n# Patterns and Code Organization\n\nYou also might have noticed\
    \ the var keyword. If you aren't sure of how it is used, a basic explanation is\
    \ that by preceding a variable declaration with var creates a property on the\
    \ nearest containing function. If you omit the var keyword then you are saying\
    \ that you want to assign a value to an existing variable up the scope, which\
    \ may or may not be the global scope.\n\n```\nvar imAGlobal = true;\nfunction\
    \ globalGrabber() {\n  imAGlobal = false;\n  return imAGlobal;\n}\nconsole.log(imAGlobal);\
    \ //outputs \"true\"\nconsole.log(globalGrabber()); //outputs \"false\"\nconsole.log(imAGlobal);\
    \ //outputs \"false\"\n```\n\nAs you can see, it is dangerous to rely on globals\
    \ in your functions, due to possible side effects and collisions that are bound\
    \ to occur. What happens when we use the var keyword?\n\n```\nvar imAGlobal =\
    \ true;\nfunction globalGrabber() {\n  var imAGlobal = false;\n  return imAGlobal;\n\
    }\nconsole.log(imAGlobal); //outputs \"true\"\nconsole.log(globalGrabber()); //outputs\
    \ \"false\"\nconsole.log(imAGlobal); //outputs \"true\"\n```\n\nJavascript hosts\
    \ the var declaration to the top of the function block, then initializes the variable.\
    \ This is called variable hoisting.\n\n**To summarize:** all variables are scoped\
    \ to a function (which is itself an object), and where you declare those variables\
    \ with var determines the function they are scoped to. Excluding var will imply\
    \ global scope for a variable.\n\nLet's look at how variable hoisting happens:"
