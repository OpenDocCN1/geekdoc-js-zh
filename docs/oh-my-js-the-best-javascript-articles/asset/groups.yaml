    \ {\n  ee.emit('die');\n}, 100);\n\nwhile(die) {\n}\n```\n*(修正：重新审视原文，原文代码块确实是：)*\n\
    \n```javascript\nEE = require('events').EventEmitter\nee = new EE();\n\ndie =\
