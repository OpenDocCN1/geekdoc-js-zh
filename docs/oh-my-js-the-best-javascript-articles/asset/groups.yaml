    \ that should be used as statements are assignments and invocations.\n\n# Compound\
    \ Statements\n\nCompound statements are statements that contain lists of statements\
    \ enclosed in { } (curly braces).\n\n- The enclosed statements should be indented\
    \ four more spaces.\n- The { (left curly brace) should be at the end of the line\
    \ that begins the statement.\n- The } (right curly brace) should begin a line\
    \ and be indented to align with the beginning of the line containing the matching\
    \ { (left curly brace).\n- Braces be used around all statements, even single statements,\
    \ when they are part of a control structure, such as an if or for statement. This\
    \ makes it easier to add statements without accidentally introducing bugs.\n\n\
    # Labels\n\nStatement labels are optional. Only these statements should be labeled:\
