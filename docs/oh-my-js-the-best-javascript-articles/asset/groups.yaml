    \ a good idea to check the Mozilla Developer Network (MDN) for function reference\
    \ to see what versions of a language is available in first. Generally speaking,\
    \ you should be fine if you are using a library like jQuery or underscore to handle\
    \ this for you. \n\nIf you are interested in using a polyfill of ECMAScript 5\
