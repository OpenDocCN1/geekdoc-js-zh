    \ 变量添加属性，但我们将其传递给函数是为了明确我们正在将函数挂载到什么上。它还允许我们在函数内部对传入的对象取别名。这里的关键在于我们预先声明了依赖，而不是依赖\
    \ `module` 变量以外的全局变量。\n\n你可能注意到了 `var` 关键字。如果你不确定如何使用，基本的解释是：在变量声明前加上 `var` 会在最近的包含它的函数上创建一个属性。如果你省略了\
