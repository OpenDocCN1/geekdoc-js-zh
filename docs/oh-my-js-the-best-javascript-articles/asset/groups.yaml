- md: "\n# Patterns and Code Organization\n\n## Common JavaScript \"Gotchas\"\n\n\
    Original Article\n\nhttp://www.jblotus.com/2013/01/13/common-javascript-gotchas\n\
    \nJames Fuller, Jblotusᵃ³ᵃhttp://www.jblotus.com/author/jblotus/\n\nPHP was my\
    \ first programming language, and my initial exposure to JavaScript was through\
    \ libraries like jQuery³. There were things about JavaScript that always seemed\
    \ to trip me up in the beginning due to how they worked differently than PHP.\
    \ Here there are still some things today that are confusing. I want to share some\
    \ of the things I struggled with when I started working with JavaScript. I am\
    \ going to cover the global namespace, this, knowing the difference between ECMAScript\
    \ 3 and ECMAScript 5, asynchronous operations, prototypes, and simple JavaScript\
    \ inheritance.\n\n### The Global Namespace\n\nIn PHP specifically, when you declare\
    \ a variable function outside of a class (or namespace block³) you are essentially\
    \ adding a function to the global namespace. In JavaScript, there is no such thing\
    \ as a namespace per se, rather everything is attached to the global object. In\
    \ the case of the web browser, that is the window object. The other key difference\
    \ is that in JavaScript, functions and variables are attributes of the global\
    \ object, which we typically refer to as properties.\n\nThis can be troublesome\
    \ because you won't get a warning in JavaScript if you overwrite a global function\
    \ or property and it can actually be quite dangerous.\n\n³http://jquery.com/\n\
    ³⁴http://php.net/manual/en/language.namespaces.definitionmultiple.php\n\n```javascript\n\
    function globalFunction() {\n  console.log('I am the original global function');\n\
    }\nfunction overWriteTheGlobal() {\n  globalFunction = function();\n  console.log('I\
    \ am the new global function');\n}\nglobalFunction(); // outputs \"I am the original\
    \ global function\"\noverWriteTheGlobal(); //this will overwrite the original\
    \ global function\nglobalFunction(); // outputs \"I am the new global function\"\
    \n```\n\nOne technique is to use JavaScript to ensure that your variables and\
    \ functions are self contained is to use an immediately-invoked function expression,\
    \ commonly known as a self-executing anonymous function. I typically expose to\
    \ the outside world by passing a carrier object to the function. This is a variation\
    \ of the module pattern.\n\n```javascript\nvar module = {};\n(function(exports)\
    \ {\n  exports.notGlobalFunction = function() {\n    console.log('I am not global');\n\
    \  };\n}(module));\n\nfunction notGlobalFunction() {\n  console.log('I am global');\n\
    }\n\nnotGlobalFunction(); //outputs \"I am global\"\nmodule.notGlobalFunction();\
    \ //outputs \"I am not global\"\n```\n\nInside the self-executing anonymous function,\
    \ all of the global scope is enclosed and we finish by attaching it the module\
    \ variable. Technically you could append properties directly to the module variable,\
    \ but the reason we are passing it to the function is to make it explicitly clear\
    \ what we are attaching our function to. It also allows us to alias the passed\
    \ in in object inside the function. The critical thing here is that we are declaring\
    \ our dependencies upfront and not relying on global variables, other than the\
    \ module variable.\n\nYou might might have noticed the var keyword. If you aren't\
    \ sure of how it is used, a basic explanation is that by preceding a variable\
    \ declaration with var creates a property on the nearest containing function.\
    \ If you omit the var keyword then you are saying that you want to assign a value\
    \ to an existing variable up the scope, which may or may not be the global scope.\n\
    \n```javascript\nvar imAGlobal = true;\nfunction globalGrabber() {\n  imAGlobal\
    \ = false;\n  return imAGlobal;\n}\nconsole.log(imAGlobal); //outputs \"true\"\
    \nconsole.log(globalGrabber()); //outputs \"false\"\nconsole.log(imAGlobal); //outputs\
    \ \"false\"\n```\n\nAs you can see, it is dangerous to rely on globals in your\
    \ functions, due to possible side effects and collisions that are bound to occur.\
    \ What happens when we use the var keyword?\n\n```javascript\nvar imAGlobal =\
    \ true;\nfunction globalGrabber() {\n  var imAGlobal = false;\n  return imAGlobal;\n\
    }\nconsole.log(imAGlobal); //outputs \"true\"\nconsole.log(globalGrabber()); //outputs\
    \ \"false\"\nconsole.log(imAGlobal); //outputs \"true\"\n```\n\nJavascript hosts\
    \ the var declaration to the top of the function block, then initializes the variable.\
    \ This is called variable hoisting.\n\n**To summarize:** all variables are scoped\
    \ to a function (which is itself an object), and where you declare those variables\
    \ with var determines the function they are scoped to. Excluding var will imply\
    \ global scope for a variable.\n\nLet's look at how variable hoisting happens:\n\
    \n```javascript\nfunction variableHoist() {\n  console.log(hoisty);\n  hoisty\
    \ = 1;\n  console.log(hoisty);\n  var hoisty = 2;\n  console.log(hoisty);\n}\n\
    \nvariableHoist();\n//outputs undefined (would get a ReferenceError if no var\
    \ declaration existed in scope)\n//outputs \"1\"\n//outputs \"2\"\n```\n\n```javascript\n\
    try {\n  console.log(hoisty); //outputs ReferenceError (no global var \"hoisty\"\
    )\n} catch (e) {\n  console.log(e);\n}\n```\n\nAs you can see, it doesn't actually\
    \ matter where you put the var declaration in the function, because the property\
    \ gets created before the function executes any code. In practice, generally you\
    \ want to put your var declarations at the top of the function, since that is\
    \ where they end up anyway. It is also totally acceptable to initialize variables\
    \ at the top of the function, just to be aware of the order of events here.\n\n\
    Functions declared with the function keyword in JavaScript (not variable assignment)\
    \ also get hoisted. Behind the scenes, the entire function gets hoisted up and\
    \ is made available for execution.\n\n```javascript\nmyFunction(); //outputs \"\
    i exist\"\nfunction myFunction() {\n  console.log('i exist');\n}\n```\n\n**This\
    \ wholesale function hoisting does not occur when you use the var form of function\
    \ declaration:**\n\n```javascript\ntry {\n  myFunction();\n} catch (e) {\n  console.log(e);\
    \ //throws Uncaught TypeError: undefined is not a function\n}\nvar myFunction\
    \ = function() {\n  console.log('i exist');\n}\n\nmyFunction(); //outputs \"i\
    \ exist\"\n```\n\n### Understanding “this\"\n\nSince JavaScript uses function\
    \ scope, the meaning of this is quite different than what you get in PHP, and\
    \ causes a lot of confusion. Consider the following:\n\n```javascript\nconsole.log(this);\
    \ // outputs window object\nvar myFunction = function() {\n  console.log(this);\n\
    }\nmyFunction(); //outputs window object\nvar newObject = {\n  myFunction: myFunction\n\
    }\nnewObject.myFunction(); //outputs newObject\n```\n\nthis by default refers\
    \ to the object it is called on. Since myFunction() is a property of the global\
    \ object, this is window. When we myFunction() into a newObject, this now refers\
    \ to newObject. In PHP and other similar languages, this always refers to the\
    \ instance of a class.\n\n### Pattern and Code Organization\n\n```javascript\n\
    var myFunction = function(arg1, arg2) {\n  console.log(this, arg1, arg2);\n};\n\
    var newObject = {};\nmyFunction.call(newObject, 'foo', 'bar'); //outputs newObject\
    \ \"foo\" \"bar\"\nmyFunction.apply(newObject, ['foo', 'bar']); //outputs newObject\
    \ \"foo\" \"bar\"\n```\n\nBut let's get ahead of all ourselves. We are all invoking\
    \ the function by substituting an alternative value for this by placing the value\
