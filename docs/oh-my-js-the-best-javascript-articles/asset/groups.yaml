    \n$.each(els, handler);\n\n// 迭代 1 输出 wrapped jquery element for \"div\"\n// 迭代\
    \ 2 输出 wrapped jquery element for \"span\"\nhandler.apply({}); // 输出 object\n\
    ```\n\njQuery 会重写 `this` 的值，因此你应该始终意识到它在 jQuery 事件处理程序或其他结构中的含义。\n\n## 了解 ECMAScript\
