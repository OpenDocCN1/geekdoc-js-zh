  mdcn: "\n## Node.js\n\n让我们简单拆解一下。\n\n前几行使用 `require` 函数加载了一个名为 `http` 的 Node 内置模块。它将这个很棒的模块存放在一个名为\
    \ `http` 的变量中。关于 `require` 函数的更多信息，请查阅 Node.js 的文档¹⁸³。\n\n然后我们使用 `http.createServer`\
    \ 将服务器放入名为 `app` 的变量中。它接收一个监听请求的函数。我们稍后会回到这里，因为它们**非常重要**。接下来的两句先跳过它们。\n\n我们做的最后一件事是告诉服务器监听来自端口\
    \ 1337 的请求，然后我们只需将其打印出来。做到这一点，我们就可以开始工作了。\n\n好了，回到请求处理函数。那个东西很重要。\n\n## 请求处理器\n\
    \n在开始介绍这一节之前，我想说，这里有很多很酷的 HTTP 内容，我认为它们与学习 Express 并不直接相关。如果你感兴趣，可以查看 `HTTP` 模块的文档¹⁸⁴，因为里面有很多东西。\n\
    \n每当我们向服务器发送请求时，请求处理函数就会被调用。如果你不信，试着在那里放一个 `console.log`。你会在每次加载页面时都看到它。`request`\
    \ 是来自客户端的请求。在应用中，你会看到它缩写为 `req`。让我们来看看它。为了这样做，我们将修改上面的请求处理器：\n\n```javascript\n\
    var app = http.createServer(function(request, response) {\n  // 构建答案\n  var answer\
    \ = \"\";\n  answer += \"Request URL: \" + request.url + \"\\n\";\n  answer +=\
    \ \"Request type: \" + request.method + \"\\n\";\n  answer += \"Request headers:\
    \ \" + JSON.stringify(request.headers) + \"\\n\";\n\n  // 发送答案\n  response.writeHead(200,\
    \ { \"Content-Type\": \"text/plain\" });\n  response.end(answer);\n});\n```\n\n\
    重启服务器并刷新 `localhost:1337`。你会看到你请求的是什么 URL，这是一个 `GET` 请求，以及你发送了一些酷的请求头，如 `user-agent`\
    \ 和更复杂的头部。\n\n> ¹⁸³http://docs.nodejs.com/getting-started/what-is-require\n\n\
    > ¹⁸⁴http://nodejs.org/api/http.html\n\n## Node.js\n\nHTTP 内容！如果你访问 `localhost:1337/what_is_anime`，你会看到请求\
    \ URL 发生了变化。如果你用不同的浏览器访问，`user-agent` 就会改变。如果你发送一个 `POST` 请求，你会看到方法发生了变化。\n\n\
    响应是部分。就像之前的参数通常被缩写一样，这通常被缩写为三个字母的 `res`。对于每个响应，你会得到一个准备好发送的响应，然后执行 `response.end`。最终，你必须调用这个方法；Node\
    \ 文档是这么说的¹⁸⁵。该方法执行实际的数据发送。你可以尝试创建一个调用它的服务器，它会永远挂起。\n\n在发送之前，你可能想写一些头部。在我们的示例中，我们这样做：\n\
    \n```javascript\nresponse.writeHead(200, { \"Content-Type\": \"text/plain\" });\n\
    ```\n\n这做了两件事。首先，它发送了 HTTP 状态码¹⁸⁶ 200，这意味着一切正常。然后，它发送了一些响应头部。在这种情况下，我们返回的是纯文本\
    \ `content-type`。我们可以发送其他内容，如 JSON 或 HTML。\n\n## 我渴求更多\n\n想要更多？好吧。你要求得很客气。\n\n\
    可以想象这些 API 并它们变成某些酷东西。你可以做（某种）这样的操作：\n\n```javascript\nvar http = require(\"http\"\
    );\nhttp.createServer(function(req, res) {\n\n  // 首页\n  if (req.url == \"/\"\
    ) {\n    res.writeHead(200, { \"Content-Type\": \"text/html\" });\n    res.end(\"\
    Welcome to the homepage!\");\n  }\n\n  // 关于页面\n  else if (req.url == \"about\"\
    ) {\n    res.writeHead(200, { \"Content-Type\": \"text/html\" });\n    res.end(\"\
    Welcome to the about page!\");\n  }\n});\n```\n\n> ¹⁸⁵nodejs.org/api/http.html#http_response_end_data_encoding\n\
    > ¹⁸⁶https://en.wikipedia.org/wiki/List_of_HTTP_status_codes\n\n## Node.js\n\n\
    ```javascript\n// 404 错误！\nelse {\n  res.writeHead(404, { \"Content-Type\": \"\
    text/plain\" });\n  res.send(\"404 error! File not found.\");\n}\n}).listen(1337,\
    \ \"localhost\");\n```\n\n你可以清理这些并让它们变漂亮，或者你可以像 npm.org 的那些人¹⁸⁷一样硬核，直接用原生 Node\
    \ 硬到底。但你也可以构建一个框架。这就是 Sencha 所做的。而你为此了命名。\n\n## 中间层：Connect\n\n那个 Connect¹¹⁸ 正好是这个\
    \ JavaScript 蛋糕的中间层，因为它称自己为“用于 node 的中间件框架”。先不要去搜“中间件（middleware）”，我就要解释它了。\n\n\
    ## 一些 Connect 代码\n\n假设我们要写上面那个“你好世界”应用，但这次用 Connect。别忘了。\n\n```javascript\nvar\
