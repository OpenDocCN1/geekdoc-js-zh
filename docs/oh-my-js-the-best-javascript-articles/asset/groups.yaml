    # JavaScript Fundamentals


    ```

    1 var boundHello = person.hello.bind(person);

    2 boundHello("world") // "Brendan Eich says hello world"

    ```


    This is most useful when you need a raw function to pass as a callback:


    ```

    1 var person = {

    2   name: "Alex Russell",

    3   hello: function() { console.log(this.name + " says hello world"); };

    4 }

    5n6("#some-div").click(person.hello.bind(person));

    7 // when the div is clicked, "Alex Russell says hello world" is printed

    ```


    This is, of course, somewhat clunky, and TC39 (the committee that works on the
    next version(s) of ECMAScript) continues to work on a more elegant, backwards-compatible
    solution.


    # jQuery


    Because jQuery heavily uses anonymous callback functions, it uses the call method
    internally to set the value of these callbacks to a more useful value. For instance,
    instead of receiving window as in all event handlers (as you would without special
    intervention), jQuery invokes call on the callback with the element that set the
    event handler as its first parameter.


    This is extremely useful, because the default value of this in anonymous callbacks
    is not particularly useful, but it can give beginners to JavaScript the impression
    that this is, in general a strange, often mutated concept that is hard to reason
    about.


    If you understand the basic rules for wrapping a sugary call into a desugared
    func.call(thisValue, ...args), you should be able to navigate the so treacherous
    waters of the JavaScript value this.


    # PS: I Cheated


