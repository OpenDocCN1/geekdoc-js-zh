    # Lousy Implementations


    Some of the earlier implementations of JavaScript were quite buggy. This reflected
    badly on the language. Compounding that, those implementations were embedded in
    horribly buggy web browsers.


    # Bad Books


    Nearly all of the books about JavaScript are quite awful. They contain errors,
    poor examples, and promote bad practices. Important features of the language are
    often explained poorly, or left entirely. I have reviewed dozens of JavaScript
    books, and I can recommend one: JavaScript: The Definitive Guide (5th Edition)
    by David Flanagan. (Attention authors: If you have written a good one, please
    send me a review copy.)


    # Substandard Standard


    The official specification for the language is published by ECMA. The specification
    is of extremely poor quality. It is difficult to read and very difficult to understand.
    This has been a contributor to the Bad Book problem authors have been unable to
    use the standard document to improve their own understanding of the language.
    ECMA and the TC39 committee should be deeply embarrassed.


    # Amateurs


    Most of the people writing in JavaScript are not programmers. They lack the training
    and discipline to write good programs. JavaScript has so much expressive power
    that they are able to do useful things in it, anyways. This has given JavaScript
    a reputation of being strictly for the amateurs, that it is not suitable for professional
    programming. This is simply not the case.


    # Object-Oriented


    JavaScript object-oriented? It has objects which can contain data and methods
    that act upon that data. Objects can contain other objects. It has no classes,
    but it does have constructors which do classes, acting as containers for class
    variables and methods. It does not have class-oriented inheritance, but it does
    have prototype-oriented inheritance.


    The two ways of building up object systems are by inheritance (is-a) and by aggregation
    (has-a). JavaScript does both, but its dynamic nature allows it to execute at
    aggregation.


    Some argue that JavaScript is not truly object oriented because it does not provide
    information hiding. All members are public.


