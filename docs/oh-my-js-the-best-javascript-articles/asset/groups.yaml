    Original Article\n\nhttp://www.html5rocks.com/en/tutorials/speed/animations\n\n\
    Paul Lewis, html5rocks.com*\n^*http://www.html5rocks.com\n\nIt's a fair bet you\
    \ do some animation work in your time as a developer, whether that's smaller UI\
    \ effects or large interactive canvas pieces. Chances you're also come across\
    \ requestAnimationFrame, or rAF (if we say raaf around these parts), and hopefully\
    \ you've had a chance to use it in your projects. In case you don't know, requestAnimationFrame\
    \ is the browser's native way of handling animations. Because rAF is specifically\
    \ designed to deal with animation and rendering, the browser can schedule it at\
    \ the most appropriate time and, if we play our cards right, it will help us get\
    \ a buttery smooth 60 frames per second.\n\nWhat we want to do in this article\
    \ is outline some additional ways to ensure you're getting the maximum benefit\
    \ from your animation code. Even if you're using requestAnimationFrame there are\
    \ other ways you can end up with bottlenecks in your animations. At 60 frames\
    \ per second each frame that you draw is 16.67ms to get everything. That's not\
    \ a lot, so every optimisation counts!\n\nTLDR: Decouple your events from animations;\
    \ animations that result in reflow-paint loops; your rAF calls to expect a high\
    \ resolution timestamp as the first parameter; only rAF when you have visual updates\
    \ to do.\n\n# Debouncing Scroll Events\n\nDebouncing is the process of decoupling\
    \ your animation from any inputs that affect it. Take, for example, an effect\
    \ that is triggered when you scroll the page. The effect might check if some DOM\
    \ elements are visible to the user and, then, apply some CSS classes to those\
    \ elements.\n\nOr maybe you're coding a parallax scrolling effect where, as you\
    \ scroll, background images change the position relative to page's scroll position.\
    \ I will go with the former of the two common uses, and the gist of your code\
    \ might be:\n\n```javascript\nfunction onScroll() {\n    update();\n}\nfunction\
    \ update() {\n    // assume domElements has been declared\n    // by this point\
    \ :\n    for(var i = 0; i < domElements.length; i++) {\n        // read offset\
    \ of DOM elements\n        // to determine visibility - a reflow\n        // then\
    \ apply some CSS classes\n        // to the visible items - a repaint\n    }\n\
    }\n\nwindow.addEventListener('scroll', onScroll, false);\n```\n\nThe main issue\
    \ is that we are triggering a reflow and repaint whenever we get a scroll event:\
    \ we ask the browser to recalculate the real positions of DOM elements, an expensive\
    \ reflow operation, and then we apply some CSS classes, which causes the browser\
    \ to repaint. We end up ping-pong between reflowing and repainting, and this is\
    \ going to undermine your app's performance. We're picking on scroll events, but\
    \ the same applies to resize events. In fact, any event that you're making use\
    \ of in this way can cause performance issues. Read Tony Gencifer's Fastasite\
    \ log post for a breakdown of properties that cause a reflow in WebKit159.\n\n\
    What we need to do is decouple the scroll event from the update function, and\
    \ this is exactly where requestAnimationFrame steps in to help. We need to change\
    \ things around that we are listening to our scroll events, but we will only store\
    \ the most recent value:\n\n> 159 http://gent.ilcore.com/2011/03/how-not-to-trigger-layout-in-webkit.html\n\
    \n```javascript\nvar latestKnownScrollY = 0;\nfunction onScroll() {\n  latestKnownScrollY\
    \ = window.scrollY;\n}\n```\n\nWe're in a better place: onScroll runs whenever\
    \ the browser chooses to execute it, but all we're doing is storing the window's\
    \ scroll position. This code could run once, twenty or a hundred times before\
    \ we try to use the value in our animation and it wouldn't matter. The point is\
    \ that we're keeping a track of the value but it's not triggering potentially\
    \ unnecessary calls. If your draw call is expensive then you'll really benefit\
    \ from avoiding those extra calls.\n\nThe other part of this change is to use\
    \ requestAnimationFrame to handle the visual updates at the most convenient time\
    \ for the browser:\n\n(Note: The OCR text was missing here, but based on the context,\
    \ the logic follows.)\n\n# Debouncing Mouse Events\n\nWe've gone through one common\
    \ use-case for using rAF to decouple animations from scroll and resize events,\
    \ now let's talk about another one: using it to deal with interactions. In this\
    \ instance we're going to have something stick to the current position, only when\
    \ the mouse button is pressed. When it's released we'll stop the animation.\n\n\
    Let's jump straight into the code, then we'll pick it apart:\n\n```javascript\n\
    var mouseDown = false;\nlastMousePosition = { x: 0, y: 0 };\n\nfunction onMouseDown()\
    \ {\n  mouseDown = true;\n  requestAnimationFrame(update);\n}\n\nfunction onMouseUp()\
    \ {\n  mouseDown = false;\n}\n\nfunction onMouseMove(evt) {\n  lastMousePosition.x\
    \ = evt.clientX;\n  lastMousePosition.y = evt.clientY;\n}\n\nfunction update()\
    \ {\n  if(mouseDown) {\n    requestAnimationFrame(update);\n  }\n}\n```\nndocument.addEventListener('mousedown',\
    \ onMouseDown, false);\ndocument.addEventListener('mouseup', onMouseUp, false);\n\
    document.addEventListener('mousemove', onMouseMove, false);\n[/content] (Wait,\
