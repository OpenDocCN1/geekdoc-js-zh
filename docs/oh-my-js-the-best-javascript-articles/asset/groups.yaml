  - '[PAGE 119]


    Node.js


    Some people saw Connect and they said, "this code can be even easier". So they
    built Expresss. (Actually, it seems like they saw Sinatra[^192] and stole it.)


    # # Top layer: Express


    We''ve finally arrived at the third act of our nerdy quest. We''re at the peak
    of our abstraction mountain. There is a beautiful sunset. Your long, golden locks
    wave in the cool breeze.


    Just like Connect extends Node, Express extends Connect. The beginning looks very
    similar to Connect:


    ```

    var express = require("express");

    var http = require("http");

    var app = express();

    ```


    And so does the end:


    ```

    http.createServer(app).listen(1337);

    ```


    The middle is what''s different. Where Connect gives you one cool feature (middleware),
    I think that Express gives you three cool features: routing, better request handlers,
    and views. Let''s start with routing.


    # # Cool feature 1: routing


    Routing is a way to map different requests to specific handlers. In many of the
    above examples, we had a homepage and an about page and a 404 page. We''d basically
    do this with a bunch of if statements in the examples.


    But Express is smarter than that. Express gives us something called "routing"
    which I think is better explained with code than with English:


    > [192]:http://www.sinatrab.com/'
  - "[PAGE 120]\n\n```\n1 var express = require(\"express\");\n2 var http = require(\"\
    http\");\n3 var app = express();\n4 \n5 app.all(\"*\", function(request, response,\
    \ next) {\n6   response.writeHead(200, {\"Content-Type\": \"text/plain\"});\n\
    7   next();\n8 });\n9 \n10 app.get(\"/\", function(request, response) {\n11  \
    \ response.end(\"Welcome to the homepage!\");\n12 });\n13 \n14 app.get(\"/about\"\
    , function(request, response) {\n15   response.end(\"Welcome to the about page!\"\
    );\n16 });\n17 \n18 app.get(\"**\", function(request, response) {\n19   response.end(\"\
    404!\");\n20 });\n21 \n22 http.createServer(app).listen(1337);\n```\n\nOoh. That's\
    \ hot.\nAfter the basic rules, we say \"every request goes through this function\"\
    \ with app.all. And that function looks an awful lot like middleware, don't it?\n\
    \nThe three calls to app.get are Express’s routing system. They could also be\
    \ app.post, which respond to POST requests, or PUT, or any of the HTTP verbs.\
    \ The first argument is a path, like /about or /. The second argument is a request\
    \ handler similar to what we’ve seen before. To quote the Express documentation¹⁹³¹\n\
    \n> [These request handlers] behave just like middleware, with the one exception\
    \ that these callbacks may invoke next('/route') to bypass callback(s). This mechanism\
    \ can be used to perform pre-conditions on a route then pass control to subsequent\
    \ routes where there is no reason to proceed with the route matched.\n\nIn short:\
    \ they’re basically middleware like we’ve seen before. They’re just functions,\
    \ just like before. These routes can get smarter, with things like this:"
  - "[PAGE 121]\n\n```\napp.get(\"/hello/who\", function(req, res) {\n  res.end(\"\
    Hello, \" + req.params.who + \"\");\n});\n```\n\nRestart your server and visit\
    \ localhost:1337/hello/animelover69 for the following message:\n\nHello, animelover69.\n\
    \nThe docs<sup>194</sup> also show an example that uses regular expressions, and\
    \ you can do lots of other stuff with this routing. For a conceptual understanding,\
    \ I've said enough.\n\nBut it gets cooler.\n\n# Cool feature 2: request handling\n\
    \nRouting would be enough, but Express is absolutely ruthless.\n augments the\
    \ request and response objects that you're passed in every request handler. The\
    \ old stuff is still there, but they add some new stuff! The API docs<sup>195</sup>\
    \ explain everything, but let's look at a couple of examples.\n\nOne nicely if\
    \ you have a redirect. Here are some examples:\n\n```\nresponse.redirect(\"/hello/anime\"\
    );\nresponse.redirect(\"http://www.myanelist.net\");\nresponse.redirect(301, \"\
    http://www.anime.org\"); // HTTP status code 301\n```\n\nThis isn't in Vanilla\
    \ Node and it's also absent from Connect, but Express adds this stuff. It adds\
    \ things like sendFile lets you send a whole file:\n\n```\nresponse.sendFile(\"\
    /path/to/anime.mp4\");\n```\n\nThe request gets a number of cool properties, like\
    \ ip to get the IP address and request.files for uploaded files.\nConceptually,\
    \ there's not much to know, than the fact that Express extends the request and\
    \ response. For everything Express gives, you check out the API docs<sup>196</sup>.\n\
    \n# Cool feature 3: views\n\nMore features? Oh, Express, I'm blushing.\n\nExpress\
    \ can handle views. It's not too bad. Here's what the setup looks like:\n\n> <sup>194</sup>http://expressjs.com/api.html#app.VERB<sup>195</sup>http://expressjs.com/api.html\n\
    <sup>196</sup>http://expressjs.com/api.html"
