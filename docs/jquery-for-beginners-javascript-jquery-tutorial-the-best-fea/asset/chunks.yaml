    # jQuery 模块


    jQuery 模块数量丰富，并且在不断更新。jQuery 模块是库文档，提供了可以添加到到核心 `jQuery` 库的额外功能。在插件分类下有许多模块。软件工程师可以查阅并选择一个完全符合其需求的模块。此外，这些模块会不断更新，以适应操作系统和程序开发的新进展。


    ## jQuery Javascript 教程


    `jQuery` 是一个被广泛使用的 `Javascript` 库，因为它让网站的结构化变得简单。用迷人的颜色和格式设计网站是一件很有趣的事。设计师们倾向于使用
    `jQuery` 而不是 `Javascript`，因为它具有许多先进特性，而且利用 `jQuery` 创建网页或应用程序非常简单。`jQuery` 的代码量比
    `javascript` 少得多。专家们认为，在 `jQuery` 中用一行代码就能实现的结果，在 `Javascript` 中可能需要 20 行。


    `jQuery` 可用于选择页面组件，创建组件的排列布局，通过更改它们的外观、样式、可见性、文本，甚至是它们的 `HTML` 来控制组件的排列布局。`jQuery`
    并不大，执行其结果需要一些投入。它还被用于将客户端内容从 `HTML` 标记中分离。与其他 `javascript` 库完全不同，`jQuery` 包含了许多可以使用的功能。灵活性是
    `jQuery` 的优秀特性之一，它可以很好地用于各种程序，如 `Internet Explorer`、`Mozilla Firefox` 或 `Safari`。由于这些每个程序的工作方式都不相同，我们有时被迫为每个程序编写单独的代码。


    `jQuery` 消除了任务重复的困难性。它还可以用于处理事件、执行动画，并毫无复杂地将 `Ajax` 支持引入 Web 应用程序。同样，利用 `jQuery`
    可以提供的特效是非常出的。人们可以使用简单的代码实现切换、模糊、响应。


    学习 `jQuery` 既有趣又简单，因为内容易于理解。特别是对于熟悉 `Javascript` 的人来说，发现学习 `jQuery` 将轻而易举。网上有无数在线教程可以学习
    `jQuery`。许多地方以易于理解的结构提供 `jQuery` 教程，并可以附带模型。它们为每个特性、功能等提供了完美安排的语法结构，分类在不同的分类下，使用户户立即看到内容。没有多少教程还带有“尝试一下”选项，除了通过模型理解外，它还允许用户尝试检查特效或结果。


    ## jQuery 的最佳特性


    历久弥新的 `jQuery`。`jQuery` 将 `JavaScript` 代码提升到了前所未有的水平。如果你使用 `JavaScript`，你可能已经很熟悉
    `jQuery`。卓越的模型包括 Google 指南、`Facebook` 和 `Twitter`。


    ## 是什么造了 jQuery


    有了 `jQuery` 在你身边，它会让 `JavaScript` 部分更快，使用更少的代码。最受欢迎的元素是使用更少代码创建应用程序的灵活性。`JavaScript`
    是 `jQuery` 的生产者，因为 `jQuery` 是用 `JavaScript` 写的。`jQuery` 代码有两种完全不同的类型：压缩记录和压缩文档。


    ## 允许下载


    `JQuery` 开放下载并免费使用。你的库模块同样可用。


    ## jQuery 的理想选择


    以下是一些你可以使用 `jQuery` 完成的任务。动画、数据库查询和幻灯片是其中的结果。

    - **制作动画**：你可以制作滑动效果和模糊效果。

    - **制作幻灯片**：创建图像或图片幻灯片是最著名的特性之一。

    - **下拉菜单**：创建带有动画的级联下拉菜单的灵活性。

    - **DOM 操作**：你可以使用基本内容包含、更改请求或删除网页上的内容。

    - **MySQL 查询**：你可以在无需刷新页面的情况下向数据库发送 `MySQL` 问题。

    - **结构验证**：你可以将其用于你的结构验证。

    - **简化**：为你的网站客户创建直观的界面是有趣且令人兴奋的。


    ## 运行


    `JavaScript` 在 Web 程序兼容性上一直存在问题，但 `jQuery` 有更高的成功率。`JQuery` 永远不会以任何形式改变 `JavaScript`，但它会变得更加有用，并且对设计师来说变得更加普通。


    ## 针对你的浏览器 JavaScript 问题启动调查


    修复 `JavaScript` 问题并不困难，但有时很难确定问题的根源。各种问题都会导致 `JavaScript` 问题，因此你需要完成一些侦探工作来识别罪魁祸首并修复错误。


    ### 活动脚本如何修复 JavaScript 错误


    浏览网页时始终开启活动脚本。你还需要确保启用了 `ActiveX 控件` 和 `Java` 小程序。这些关键选项对于 `JavaScript` 正常工作至关重要。如果你在使用
    `JavaScript` 时遇到困难，那么你必须确保已启用动态脚本。这里是步骤：


    **Web Explorer 8 (Windows)**

    - 选择“工具”菜单。

    - 点击“Web 选项”。

    - 选择“安全”。

    - 选择“自定义级别”。

    - 勾选“启用活动脚本”旁边的复框。


    **Mozilla Firefox 3.5 (Windows)**

    - 从菜单栏选择“工具”。

    - 点击“备选项”。

    - 选择名为“内容”的标签页。

    - 勾选“启用 JavaScript”旁边的框。

    - 点击确定。关闭 Mozilla，然后重新打开。


    字体 破坏心情的错误警告


    如果烦人的警告不断骚扰你，但你的程序完全运行正常，那么你可能只需要禁用 JavaScript 错误警告。某些错误警告会导致你的电脑死机。它们还会干扰程序的实用性。在
    `Internet Explorer` 中实现这一点非常简单。遵循以下方法：


    **Web Explorer 8 (Windows)**

    - 选择“工具”菜单。

    - 点击“Web 选项”。

    - 选择“高级”。

    - 取消选择“对每个脚本错误显示通知”旁边的框框

    - 关闭 Mozilla，然后重新打开。


    如果一个网页看起来包含大量的 JavaScript 错误，那么它值得用另一个程序测试该网页。实际上，你应该始终使用不同的程序测试 JavaScript 错误。如果两个程序经历了类似的错误，那么几乎可以网页本身是
    JavaScript 错误的来源。


    ### 为了快速解决，运行注册表清理程序


    如果你无法摆脱这些 JavaScript 错误，请使用注册表清理程序。清理程序通过过滤你的整个错误库来工作。它随后迅速解决每个未创建的错误。


