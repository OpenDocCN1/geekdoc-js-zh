  trans: "\n\n# 初学者 JQUERY：JavaScript：JQUERY 教程：JQUERY 的最佳特性：JavaScript, PHP, CSS,\
    \ HTML\n\n## 引言\n\n在异步 JavaScript 和 XML (`AJAX`) 宇宙出现之前，在网页上处理创建的方式有些不寻常。信息字段接收数据，数据通常通过点击提交按钮进行收集，随后，你的页面会通过真实的\
    \ `POST` 或 `GET` 参数进行重新加载。对于那些尚未加入真实 AJAX 临时潮流的人来说——这确实可能是你以后会用上的一种方法。对于某些能力来说，这在目前可能是一个非凡的决定。无论如何，越来越多的人正在接受一种非并发的方式来处理他们的开发实践。得益于\
    \ JQuery 这个奇迹，这从未像现在这样来得简单。\n\nAJAX 允许 Web 开发者处理输入信息，而无需重新加载页面、重新加载页面的特定部分，等等。要开始使用，你需要下载\
    \ `JQuery` 库并在你网站的 `<head>` 部分中引用它。这非常简单。另一种方法是直接引用 Google 提供的免费 `JQuery` 库——它们始终保持着最新的稳定版本。定期查询更新并更新你的内容引用。\n\
    \n当你准备好这些代码后，你就准备好开始使用 `JQuery` 库了。我们来创建一个包含名称和电话号码的超基础地址录吧。你在这里直接需要两个 `div`，一个包含结构，另一个包含我们目前保存的所有名称和电话号码。\n\
    \n### 标题：\n电话：\n\n好了，既然结构在位置内，这是一个引入一些 JQuery 的绝佳机会。该业务的主要收获是理解真实的 `$(document).ready()`\
    \ 函数。设置在真实函数内的所有代码将在 DOM 构建完成后、但在页面内容通常被加载之前立即被堆栈（执行）。请查看下方的注释代码并尝试理解它。\n\n```javascript\n\
    $(document).ready(function() {\n    // 加载目前保存在数据库中的数据\n    $('#addressData').load('phoneNumbers.php');\n\
    \n    $('#submitMe').click(function() {\n        // 当客户端点击提交按钮时执行的函数\n       \
    \ var enteredName = $('#name').val();\n        var enteredPhone = $('#phone').val();\n\
    \n        $('#addressData').load('phoneNumbers.php?name=' + enteredName + '&number='\
    \ + enteredPhone, function() {\n            // 在请求成功执行后执行的函数\n            alert('加载完成。');\n\
    \        });\n```\n\n在你的 `phone numbers.PHP` 文件中，你应该检查 `GET` 参数是否已设置。如果它们已设置并提交，则在你的数据库中执行\
    \ `INSERT`，然后从数据库中 `SELECT` 你的电脑信息并显示。如果没有设置，只需在数据库中 `SELECT` 你的信息并显示。\n\n通俗逻辑如下：\n\
    - 当文档可以编写时，从 `phoneNumbers.PHP` 加载数据库中保存的号码并将其输出放在 `address data` `div` 中。\n-\
    \ 当个人点击提交按钮时，将字段信息发送到 `phone numbers.PHP`。\n- PHP 内容将执行数据库插入并在添加后返回新鲜出炉的信息。\n\
    - 这些细节被堆叠到 `address data` `div` 中。\n- 请求完成后，显示一个警告框告诉顾客请求已成功。\n\n你现在拥有的是在提交排序时简单重新加载单个\
    \ `div` 的基本案例，而不是期望重新加载整个页面。你会发现这部分特定文档的其他方法，但为了学习，我是手动编写的。\n\n## 创建你的第一个 JQuery\
    \ 插件\n\n### 为什么要创建一个 jQuery 模块\n\n偶尔，在你的代码中提供一些通用的功能是有帮助的。你可能需要一个单一函数，它可以访问一个\
    \ `jQuery` 选择器并在该选择器上执行特定操作。或者相反，你可能在其中一个任务中编写了一个工具函数，现在你需要能够将其有效地移动到不同的任务中。无论如何，编写一个模块都是你的最佳选择。`jquery`\
    \ 是不可错的。它是跨平台的、易于学习的，并让你非常容易使用界面。它还带有许多实用的模块，可以完成你想要的任何事情。\n\n然而，偶尔仅仅有很多是不够的，想象一种你找不到适合你要求的完美模块的情况。或者，可能存在一个模块，但它太大了，而你只需要它的部分。方案可能是亲力而编写自己的东西。毕竟，这听起来比实际的要复杂。这个简短的练习将介绍编写基础模块的方法，包括一些选项，甚至执行一个回调。\n\
    \n### 设置\n\n你可以下载此练习的完整项目。我们将制作一个简单的手风琴（accordion）模块。我们来创建一个 `js` 记录并将其放在网站的 `\"\
    js\"` 目录中。所有 `js` 模块文档的习惯做法是以 `\"jquery speck\"` 开头，后面跟着真实的模块名，所以我们将命名为 `\"jquery.simpleaccordion.js\"\
    `。\n\n- 我们网站注册中 js 目录下的模块文档\n\n现在我们必须将我们的模块文档与 `jQuery` 库一起包含到我们的基础 HTML 页面(`index.html`)\
    \ 中。从 Google 正地引入 `jQuery` 库是最佳实践，因为它们在全球范围内分布，而不是你的单个工作区域：对于大多数人意味着更快的响应时间。从\
    \ Google 包含 `jQuery` 的另一个优势是，当客人访问你的网站时，他们现在已经在本地作用域中拥有 `jQuery` 内容。\n\n### jQuery\
    \ 插件结构\n\njQuery 提供了所有必要的工具帮助你开发我们的模块。尽管如此，为了保持 JavaScript 的良好实践，我们应该确保一切都在本地作用域内。我们从\
    \ jQuery 模块的基本框架开始：\n\n```javascript\n(function($) {\n    $.fn.simpleAccordion\
    \ = function() {\n        // ：基础手风琴模块的代码\n    }\n}(jQuery));\n```\n\n"
