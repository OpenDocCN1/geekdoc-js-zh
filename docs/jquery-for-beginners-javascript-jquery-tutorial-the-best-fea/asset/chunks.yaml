  trans: "\n\n既然所有的部分都已就绪，让我们开始动手吧！\n\n## 为我们的插件添加功能\n\njQuery 的惊人之处在于它允许你使用任何需要的选择器。在任何情况下，你应该记住，我们的模块可以管理几种不同的组件类型。利用\
    \ `this` 关键字允许我们的插件通过遍历每个组件来应用相关功能，而无需关注组件类型。\n\n## 准备 HTML 部分 -构建折叠面板\n\n由于我们正在构建一个折叠面板，我们需要为它准备\
    \ HTML 结构，如下：\n\n### 标题 1\nCras dolor elit, porttitor air conditioning diam bibendum,\
    \ eleifend aliquam erat.\n\n### 标题 2\nDonec blandit risus nec est tristique interdum.\n\
    \n### 标题 3\nFusce sit amet arcu id justo malesuada faucibus.\n\n### 标题 4\nAliquam\
    \ tincidunt lobortis sem at porttitor.\n\n这是一个基础的折叠面板结构，包含四个标题和它们各自的内容区域。因此，我们的想法是让模块将这段\
    \ HTML 代码转换为实用的折叠面板，用户可以在其中展开和折叠不同的区域。在进一步通知之前，它的外观应该是这样的：\n\n为了美观起，我们应该包含一些简单的样式。代码如下：\n\
    \n```css\n.accordion {\n  width: 600px;\n  outskirt: 1px strong #ccc;\n  outskirt\
    \ base: none;\n}\n.accordion dt,.accordion dd {\n  outskirt base: 1px strong #ccc;\n\
    \  edge: 0px;\n}\n.accordion dt {\n  foundation: rgba(193, 221, 252, 0.24);\n\
    \  cursor: pointer;\n  cushioning: 8px 4px; text dimension: 14px;\n  textual style\
    \ weight: strong;\n}\n.accordion dd {\n  cushioning: 12px 8px;\n}\n```\n\n现在我们的折叠面板结构应该像这样：\n\
    \n## jQuery 部分 - 让它运行起来！\n\n为了给模块添加实用性，我们将修改 JS 并包含以下代码：\n\n```javascript\n(function($)\
    \ {\n  $.fn.simpleAccordion = function(options) {\n    return this.each(function()\
    \ {\n      var dts = $(this).children('dt');\n      dts.click(accordionClick);\
    \ dts.each(reset);\n    });\n\n    function accordionClick() {\n      $(this).siblings('dt').each(hide);\n\
    \      $(this).next().slideDown('fast');\n      return bogus;\n    }\n\n    function\
    \ stow away() {\n      $(this).next().slideUp('fast');\n    }\n\n    function\
    \ reset() {\n      $(this).next().hide();\n    }\n  }\n})(jQuery);\n```\n\n现在让我们来说过一下这段代码在做什么。首先，你必须理解\
    \ jQuery 是一个扩展 JavaScript 语言的库。在创建任何 jQuery 模块时，你基本上是在扩展 jQuery 库，而 jQuery 正在扩展\
    \ JavaScript。真正理解你的模块如何扩展 jQuery 库需要对 JavaScript 的模型属性有深入理解。尽管没有被直接使用，但 JavaScript\
    \ 模型属性是通过 jQuery 属性 `fn` 在后台使用的，`fn` 是本地 JavaScript 模型属性的 jQuery 别名。\n\n简单来说，你通过利用\
    \ `fn` 从 jQuery 扩展了你的模块。\n\n### \"你的模块名称\"\n\n此外，我们可以为模块添加选项。一个 jQuery 模块可以包含默认值和选项。选项是你传递给模块的参数。与发送几个参数相比，使用\
    \ `choices` 对象可以发送多个属性，这是 jQuery 的标准做法。在模块中允许选项时，最佳实践是使用 `defaults` 对象设置默认选项。就像\
    \ `choices` 一样，`defaults` 是一个严格的对象，它应该包含你允许传递给模块的属性。我们应该快速为我们的模块添加几个选项，以展示这是有多简单。\n\
    \n我们将传递一个边界选项，以便在折叠面板首次折叠时让其主区域打开。\n\n```javascript\n(function($) {\n  $.fn.simpleAccordion\
    \ = function(options) {\n    var state = $.extend({}, {open: false}, choices);\n\
    \    return this.each(function() {\n      var dts = $(this).children('dt');\n\
    \      dts.click(accordionClick); dts.each(reset);\n      if(state.open)\n   \
    \     $(this).children('dt:firstchild').next().show();\n    });\n\n    function\
    \ accordionClick() {\n      $(this).siblings('dt').each(hide);\n      $(this).next().slideDown('fast');\n\
    \      return bogus;\n    }\n\n    function cover up() {\n      $(this).next().slideUp('fast');\n\
    \    }\n\n    function reset() {\n      $(this).next().hide();\n    }\n  }\n})(jQuery);\n\
    ```\n\n你可能注意到，我们使用了 `open: false` 的默认估计，所以如果没有传递任何选项，模块将预期在首次折叠时折叠面板是关闭的。当模块获取选项时，你可以依赖\
    \ `$.extend` 方法来进行实际合并。`$.extend` 方法的作用是合并至少两个项目。\n\n## jQuery 效果优于 Flash 动画的优势\n\
    \njQuery 是一种非常棒的编程工具，可以为网页添加精美的动画。jQuery 已经存在很久了。使用 Flash 的活动出现在大量网站中。然而，Flash\
    \ 在方面存在一些今天尚未解决的问题。这些问题通过 jQuery 得到了更好的解决。并不是所有 Flash 能实现的动画都能通过 jQuery 实现，但持续的进展和新模块已经激励了开发者用\
    \ jQuery 效果替换许多 Flash 效果。让我们来聊 jQuery 效果相比 Flash 的优势。\n\n### 1. jQuery 效果的加载速度比\
    \ Flash 制作的更快\n执行 jQuery 效果不需要额外的模块。99% 的程序都支持 JavaScript。一个完美的 JavaScript 程序就足够执行\
    \ jQuery 了。由于不包含额外的模块，jQuery 效果的加载速度比 Flash 快得多。请记住，Flash 需要外部模块才能执行。如果程序没有正确形式的\
    \ Flash 模块来执行特定活动，那么模块将在动画开始之前堆栈。这使得整个 Flash 的运行生命周期低于 jQuery。\n\n### 2. 进的 jQuery\
    \ 效果制作并不困难\n要使用 jQuery 制作高级的效果，开发者必须在 Action 内容方面拥有深厚的知识（Action 是 Flash 使用的脚本技术）。相反，制作高级的\
    \ jQuery 效果非常简单。jQuery 官网提供了许多尖端模块。事实上，即使是初级软件工程师也可以在 Web 应用中有效地下载并使用它们。\n\n###\
    \ 3. jQuery 移动效果优于 Flash 制作\njQuery 比 Flash 更现代。因此，与 Flash 相比，jQuery 具有更好的适应性。实际上，许多著名的移动框架尚未支持\
    \ Flash 动画。而 jQuery 在各种移动框架和程序中都能无缝执行。\n\n"
