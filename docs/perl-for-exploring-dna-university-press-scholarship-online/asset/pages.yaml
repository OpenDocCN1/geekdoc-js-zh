  md: '# Modules


    In specialized packages of ready-made subroutines are recommended and introductory
    instructions are given for finding, loading, and using them.


    > The difference with Perl is that I decided to create the culture at the same
    time as I was creating the language.

    —Larry Wall (quoted in Davis, 1999)


    We use modules every day, and therefore are remarkable about them is easily overlooked.
    Nearly any complex task worth doing is made more efficient with modules. Say,
    I am building a new kitchen. Actually I am not building it myself, I hire the
    module called "plumbers," "the electricians," and many other essential modules.
    Otherwise I have little hope of seeing my kitchen completed. Each of the modules
    arrives not only with a repertoire of specialized expertise and time-honored practices
    but also all of the necessary materials and tools. That plumbers module is indeed
    modular; it can be used for any kitchen, and it is far more efficient than trying
    to learn and implement plumbing myself.


    One of the things ever well done by computers is only to divide projects and use
    and reuse suites of functions to solve specialized parts of the project. Actually,
    nearly every aspect of programming introduced in this book (and any programming
    book) has about modularity. Code is typically written in little modular units
    that form an integrated whole. Before writing the code, when you are still writing
    the algorithm on the board, the best practice is to break down the problem into
    modular parts. Furthermore, subroutines (introduced in chapter 7) make even more
    efficient define the boundaries between sections of a program and the usefulness
    of calling the same specialized code again and.

    The actual word module has a particular meaning in computer science. It refers
    to any large package of subrout that may be loaded all at once and used, something
    like hiring a team of plumbers. Programming modules vary widely: Some are already
    loaded into the perl on your computer, and you have been using them all along.
    Some are relatively easy to load from the Internet and are directly useful for
    sequence analysis. Other modules are more user-friendly, especially for novices.
    In this chapter we really introduce modules as a good idea and a potentially functional
    part of your big project. The difficulty in writing this chapter is that many
    Perl modules are written and maintained on a volunteer basis by members of the
    Perl community. We cannot guarantee that a great-sounding module that you found
    on the Internet will be in perfect working order or that the instructions will
    work for your particular operating system. Therefore, this limits its focus to
    a few modules that might be of interest in sequence analysis and that seem to
    have a history of being well maintained and relatively easy to use.'
