    the search results will be the ::Search::PubMed module, which provides access
    to search results from the National Library of Medicine''s PubMed database.

    The CPAN Search provides a convenient way to view module documentation. By clicking
    on the name of the search results pages, you''ll be able to directly view the
    documentation for that module. Module documentation typically follows a standard
    layout with common sections, such as Synopsis, Description, and Functions. By
    glancing over these sections, you have the chance to make sure the code looks
    like it you expect before installing the module. If the module satisfies your
    needs, the next step is to download and install it using the instructions on the
    Web site.


    # 14.32 Using ::Search::PubMed


    The ::Search module provides a way of accessing results from a variety of search
    engines. The ::Search::PubMed module allows you to query search the NCBI PubMed
    abstract database. Looking at the CPAN Search site for ::Search::PubMed, we can
    see that all we need to install two prerequisite modules: ::Search and XML::DOM.
    Install these modules and try out a variation of the example code from the Synopsis
    section of the module''s documentation.


    ```

    use ::Search;

    my $s = new ::Search (''PubMed'');

    $s->native_query( ''ACGT'' );

    my $r = $s->next_result;


    print "Title: " . $r->title . " \n";

    print "Description: " . $r->description . " \n";

    print "URL: " . $r->url . " \n"

    ```


    This code will print out the first result from a PubMed search for the ACGT motif.
    A result is shown below.


    > Title: [Nucleotide correspondence between protein-coding sequences of Helicobacter
    pylori 26695 and J99 strains]

    Description: (Mol Biol (Mosk). 39(6):945-51)

    URL: http://www.ncbi.nlm.nih.gov/80/entrez/query.fcgi?cmd=db=PubMed&uids=16358730&doopt=Abstract


    This is a powerful module! It allows your Perl programs to query PubMed automatically,
    saving the results to parse, collect, and analyze. We trust the implications for
    data mining are obvious and exciting.'
