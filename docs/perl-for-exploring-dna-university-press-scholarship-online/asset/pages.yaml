    # 8.4 A Summary of Modes for Opening Files for Input and Output


    The following table summarizes the most common modes that are used when using
    Perl''s open statement.


    | Mode | Can read from | Can write to | Can append to end | Create new file if
    not there | Overwrite existing file |

    |---|---|---|---|---|--|

    | < | Yes | No | No | No | No |

    | > | No | Yes | No | Yes | Yes |

    | >> | No | Yes | Yes | Yes | No |'
