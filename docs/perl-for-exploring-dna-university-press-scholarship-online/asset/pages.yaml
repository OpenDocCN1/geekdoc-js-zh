  md: '# 1.3 Computers Serendipity Machines


    *Serendipity, n., the faculty of making happy and unexpected discoveries by accident
    (Oxford English Dictionary).*


    The new and essential focus on collection, storage, and analysis of huge quantities
    of sequence data means that there are some "new" ways of doing experiments, including
    forming hypotheses and following through them. Actually these new days come from
    the origins of biology in natural history. *The Serendipity Machine* refers to
    fortunate accidents that occur during exploration and discovery: "For most of
    human history, information was scarce and expensive; now it is abundant and cheap"
    (p. 5). And that changed some ways of approaching scientific problems. The larger
    the data set and the more quickly and freely it can be explored or mined, the
    more likely it is that new combinations, connections, and relationships will be
    found among the data elements. Computers are "serendipity machines," essentially
    engines for creating serendipitous discoveries, says Green. It is a legitimate
    (albeit still controversial) scientific activity to seek patterns (often at lightning
    speed via computers) and contemplate hypothesize later! "This is a relatively
    new way of doing research which came to the fore of the 1970s as the power of
    computers increased. However many older scientists were (and are still) uncomfortable
    with the idea of deliberately setting out to make scientific discoveries without
    knowing what you are looking for. This is surprising because science has always
    exploited serendipity" (p. 89).


    Indeed, Darwin on the *Beagle* remained relatively unencumbered by hypotheses.
    Collecting and cataloging could have ended in themselves, the specimens stored
    safely in museums. It was only later back in England that Darwin reexamined his
    specimens, observed the patterns and distributions, and proposed an origin of
    species by natural selection.


    Green points out that one reason large data sets (or large collections such as
    Darwin''s) provide so many opportunities for accidental discovery is because there
    are so many possible combinations of the individual items. No matter how a database
    is designed (or a collection arranged), unanticipated patterns will emerge. The
    larger the database, the greater the possibility of serendipitous discovery. Indeed,
    the arrangements of data ought to be frequently examined as new items arrive because
    old hierarchies and taxonomies no longer fit the new information. Green calls
    this the "platypus effect" after the temporary chaos that occurred when duck-billed
    platypuses were discovered in Australia and could not be neatly cataloged with
    the other mammals until the classification was adjusted. Hierarchies and classifications
    are no more than hypotheses. Current practices in storing, sorting, and annotating
    DNA may need to be examined as more information pours in. Some of the new sequences
    may have platypus-like effects on the databases.


    # 1.4 Indexing as a Research Activity, Especially in Bioinformatics:


    # *Indexes as Discovery Tools*


    Bioinformatics is presently in its glorious indexing phase, and we do not know
    how long this phase will last except that sequences keep rolling in so far annotation
    has kept pace.'
