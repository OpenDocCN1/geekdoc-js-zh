  md: '# Accessing Files of Sequences from Databases


    iii. an absolute path name, implying that the program knows the “absolute"

    location of the input file, for example;

    Windows Users: "C:\genes\fly_odorant_receptor.fna";

    macOS X and Linux Users:

    "/Users/mbleanch/Desktop/fly_odorant_receptor.fna.

    (If you are using TextTrangler or BBEdit editors on MacOS X, see

    section 8.5).


    When a FILENAME is opened for reading, the second argument to the open

    function is ‘<’. This second argument, referred to as the MODE, means the file
    is

    be “opened for reading”. A summary of various modes is shown in section 8.4.

    Notice the use of “or” in conjunction with the open statement. Although

    required, we recommend that you use this safety feature when opening-

    a file. Failure to open a file is a common occurrence for a number of reasons,

    in missing a file name. If the open function should fail for any reason,

    de die function will print an appropriate message. We recommend that you

    so print the system $! variable in this situation. This will print extra

    information concerning the reason opened file. The open statement will fail

    if the given file name cannot be found or the input file has permissions set to

    be unreadable by you.


    Once opened, your program can proceed to read data from the file line at a

    time by using the line input, <...>. Perl’s line input operators surround

    your FILEHANDLE. Note that reading from the file uses the FILEHANDLE,

    not the FILENAME.


    ```

    $header = <<<FILENAME>; # read one line

    ```


    The line input operator returns the line in the input file or an undefined value

    (false) if no more data are available in the file. We will use this convention
    to detect

    t end of a file. Note that the line input operator grabs all the characters on
    the next

    line, including the end of line character (e.g., newline character). It is often
    the case

    that you do not want to store this extra character. We follow a read-line statement

    with Perl’s chop function that “chomps” the trailing newline character from

    the string. If a line of input does not end with a newline character, chop has

    no effect on the string; chop only removes trailing newline characters. Finally,
    it is

    always good programming practice to close your file handle once you have finished

    reading from the input file.


