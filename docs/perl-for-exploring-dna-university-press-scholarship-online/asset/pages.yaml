    # 3.6.2 tr: the Transliterate Pattern Matching Operator


    tr/CHANGESE/TOTHESE/

    The transliterate (tr) operator (referred here as as the translation operator)
    changes all occurrences of the characters listed in CHANGESE to the corresponding
    characters listed in TOTHESE. Note that the changes are made in a one-to-one fashion,
    that is, all occurrences of the first character in CHANGESE are changed to the
    first character in TOTHESE. The tr operator returns the number of characters that
    were changed.


    ```

    tr/*/ # convert all left brackets [

    tr/} # convert all right braces } to right brackets {}

    tr/./ # convert all exclamation points ! to periods.

    tr/ATCG/TAGC/ # convert to the complement sequence

    ```


    You may have noticed that the string on which the transliteration will occur is
    not an argument in the tr operator. Unlike most of the previous functions, the
    two pattern-matching operators, tr and s bind to a target string via the two-character
    binding assignment operator (=). As shown shortly, the binding operator ~= binds
    the operator to a sequence and performs the operator on that sequence, for example,
    translating a sequence to its complement.


    | my sequence = "ACGTCTTAG"

    print "Original: $sequence \n"

    $sequence -= tr/ACGT/TGCA/;


    print "        |||||||| \n"

    print "Complement: $sequence \n" | The =~ binding operator binds the string $sequence
    to the pattern in the tr operator. The tr operator performs the transliteration
    with the altered string residing in $sequence.'
