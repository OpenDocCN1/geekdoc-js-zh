  md: '# 1.5 Why Your Own Programs for DNA Analysis?


    Bioinformatics is still an immature field with many as yet unknown possibilities
    for methods and equipment. There is plenty of room for inventing new procedures.
    Most sciences started off that way. Then as the various fields matured, equipment
    and procedures “fossilized,” you can assume that researchers are no longer building
    their own. For example, chemists and chemistry departments still maintain glass-blowing
    rooms, to the wonder of undergraduates who simply use glassware off a shelf in
    the stock room. Molecular biologists used to build their own gel boxes with supplies
    from the hardware store (clamps, pane of glass, and wires). Protein sequencing
    projects at one time began with building your own sequencer. Furthermore, there
    is a long tradition in science of using modular parts of equipment to invent new
    equipment. That means many science departments still have drawers and cabinets
    full of glass connectors and old bits of tubing—relics of a more inventive past.
    Bioinformatics is still very much at that stage. The metaphorical drawers and
    cabinets of stuff are still in use. Although it is true that some bioinformatics
    software can be taken and applied directly off the shelf, of it still remains
    to be written. The field is appealingly undeveloped (compared to other scientific
    fields) and open for fascinating, new approaches.


    Note that none of the following list of Sixteen Seasons to Write Your Own Code
    precludes:


    +   1. Using preprocessing software. For example, there is no need to rewrite
    a BLAST program for yourself if BLAST is what you need. Being able to program
    makes it easier to understand preprocessing software—how it works and what its
    limitations might be.

    2. Getting professional programmers to write complicated software with thousands
    of lines of code, with intricacies that takes years of experience.


    # Sixteen Seasons to Write Your Own Code


    +   1. You have some really creative (so far unique) questions about genome structure
    and function and you don''t want to be held back by software.

    2. You like tinkering with things taking them apart, putting them back together.

    3. You (like an old-time explorer) are adventurous and even fearless!

    4. Writing software is actually a hypothesis-building activity—because of the
    decisions and priorities that have to be made at every step.

    5. After using a commercial software package, you came up with additional queries
    that went beyond the capabilities of the software.

    6. You are in a working group that includes programmers and you''d like to communicate
    with them a little better. You want a better idea of what the possibilities are
    and how quickly they could happen.

    7. You might find that you really enjoy building software. In finding that out,
    you will get an even better rapport and empathy with programmers, further improving
    communication and team synergy.

    8. You want to get a better idea of when you need to reinvent the wheel and when
    preexisting software is enough or tweakable.'
