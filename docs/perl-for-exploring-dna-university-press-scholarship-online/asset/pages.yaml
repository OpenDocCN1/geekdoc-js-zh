  md: '# Appendix 1

    How to Isolate DNA from Strawberries


    This is from the classic method for DNA isolation, for example, it was used by
    Franklin, Watson, and Crick when they isolated DNA for their X-ray analyses. Strawberries
    are an especially pleasant starting material. (Other procedures recommend beginning
    with a piece of a thymus gland itself as a calf.) As a stringy, slimy molecule,
    DNA readily comes out of solution and displays itself as a gelatinous mass. This
    procedure is so easy that one of us (the biologist, of course) surreptiously isolated
    some DNA for a computer science colleague in a diner in downtown Worcester, Massachusetts,
    while eating breakfast.


    +   1. Cut up two strawberries and place them in a sealable plastic sandwich bag.

    2. Add about 100 ml (3/8 cup) of chilled extraction buffer (made of household
    ingredients):

    Extraction Buffer

    (keep in refrigerator) (enough for about three extractions)

    1/8 cup (33 ml) of simple shampoo (without conditioner)

    2/3 tsp (5 g) salt

    1 8 cup (300 ml) water

    The shampoo contains a detergent, sodium lauryl sulfate, that breaks apart membranes,
    releasing the DNA and other cell contents. The salt helps make a solution that
    is similar in saltiness to the inside of cells.)

    3. Seal the bag and squish the strawberries, being careful not to squirt the mixture
    from the bag.

    4. Pour the strawberry mixture through cheesecloth to remove the pulp.

    5. Pour the red liquid into a tall, narrow, clear vessel.

    6. Slowly pour about 50 ml (about 1/4 cup) of ice-cold ethanol down the side of
    the vessel to form a layer on top of the red liquid. (Keep the ethanol in the
    freezer until you are ready to use it.)


    For best results, use at least 90% alcohol. In some states, that can be purchased
    (by people over 21) as grain alcohol. Alternatively, you could ask a chemistry
    or biology teacher for 50 ml of denatured ethanol. It will contain some methanol,
    rendering it poisonous to drink. (That''s what "denatured" means in this context.)
    High-proof alcohols like vodka are actually not concentrated enough for optimal
    results. For example 150-proof vodka is only 75 percent alcohol.


    +   7. Notice the filmy white DNA precipitating where the ethanol and red liquid
    are interfaced.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '+   8. Use a glass rod to gently spin some DNA from the interface. (Alternatively
    you could use some kitchen item like a toothpick, however the use of the glass
    rod is classic.).


    +   9. Note the thread, mucousy nature of the DNA. If you touch the glob to the
    side of the glass and gently pull it away, you may catch a glimpse of a gossamer
    thread forming temporarily.


    +   10. When done, rinse all solutions down the sink and rinse glassware.


    # How About Other Starting Materials Besides Strawberries?


    Strawberries work well because they can be macerated by hand in a plastic bag.
    Bananas and kiwi fruit work, too. For tougher fruits and vegetables or fresh (or
    frozen) meat, you need to chop finely and run through a blender. If you do choose
    to try animal tissue (meat), the best choice is organ meat like liver or kidney
    or sweetbread (thymus), as fresh as possible or frozen.


    Source: Based on a procedure by Diane Sweeney, Pearson Education (carnegieinstitutestitute.org).'
  merge: -1
