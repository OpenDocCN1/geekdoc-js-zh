  md: "Intrigued? We hope so. In addition to warnings and recommendations, this chapter\
    \ includes lots of refinements for your pattern matching search strategies and\
    \ suggestions for how to use them in sequence analysis.\n\n# 12.1 Commenting Regular\
    \ Expressions\n\nRegular expressions are sections of code written in a compact\
    \ syntax. The subtleties of these pattern-matching instructions require documentation\
    \ for the same reasons we comment the subroutines we write. For same rationale\
    \ for documenting subroutines (e.g., see section 7.2), regular expressions require\
    \ accompanying comments that help the reader translate your pattern-matching intentions\
    \ into English. More often than not, the reader will be you, attempting to decipher\
    \ your regex.\n\nThe extended formatting mode (/x) allows you to comment your\
    \ regular expressions. All whitespace (e.g., blank spaces and newlines) within\
    \ your regex are not considered part of the pattern to match and are ignored.\
    \ In addition, the comment symbol (#) and anything following it to the end of\
    \ the line is also ignored, thus you can comment each individual section of your\
    \ regular expression like this with other lines of Perl.\n\nFor example, the following\
    \ regular expression is nontrivial to parse. What exactly is this to match?\n\n\
    ```\nif ($motif ~ /((..)(.).*)(*?)4\\3\\2)/ )\n```\n\nGranted, we have thrown\
    \ in one new feature that we have yet to introduce, but the point is that by using\
    \ extended formatting mode for regex (/x), this pattern-matching expression can\
    \ be teased apart, translated to English, and presented to the reader in a very\
    \ clear fashion.\n\n```\nmy $dna = \"ATCGTCATGCTATGGTGCA\";\nif ($dna =~ m/(\n\
    \  # capture (remember) entire match\n  (.)(.).* # any three nucleotides, remember\
    \ them, then\n  (.*?) # zero or more of any nucl, NON-GREEDY, then\n  4\\3\\2\
    \ # recall three nucleotides in mirror-order\n) # end of entire match\n/x\n{\n\
    \  # if match is found\n  my $mirrorRepeat = $1; # save match with an appropriate\
    \ name\n  print \"Found (non-greedy) MIRROR REPEAT (>= 6bp): $mirrorRepeat\\n\"\
    ;\n}\nelse\n  # else no match found\n  print \"No Mirror Repeat of minimum length\
    \ 6 bp was found. \\n\";\n\n```"
