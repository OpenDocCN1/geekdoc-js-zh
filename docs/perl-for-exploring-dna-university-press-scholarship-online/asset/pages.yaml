  md: '# 14.2.1 Installing New Modules from CPAN


    Instructions for installing modules from CPAN are listed on their Web site. Follow
    the instructions for installing a new module to install the Statistics::Lite module.


    # 14.2.2 Using New Modules Installed from CPAN


    To use a newly installed module, follow the examples provided in the module''s
    documentation. In the documentation, the Synopsis section should give you a brief
    introduction to using the module in the form of a script excerpt.


    The following example assumes you want to use the Statistics::Lite module. Because
    this module does not come preinstalled with perl, you must download and install
    it.


    In the case of Statistics::Lite, you must first ask your Perl program to load
    and export the group of functions you need.


    ```

    use Statistics::Lite (''::all'');

    ```


    The (''::all'') tells the Statistics::Lite module that you''ll have access to
    the entire group of functions. If you know ill only use a subset of the functions,
    you can export other individual function names, such as


    ```

    use Statistics::Lite qw (mean median mode);

    ```


    See the Import Tags section of the documentation for more information. Now that
    the module is loaded and all the functions have been exported, you may access
    all the functions described in the documentation.


    ```

    use Statistics::Lite (''::all'');

    :

    # assuming @data is now filled with values

    # statshash returns a hash whose keys are the names of all

    # the statistics functions in the module with the

    # corresponding values as the answer(s) for that function.


    my %data = statshash @data;

    # fetch the result for the stddev of all the @data

    my $dev = $data{''stddev''};


    print "standard deviation: $dev\n";

    ```'
