    Using a regex, we can produce a more powerful and general solution to this problem
    of using only the first letter of the genus name as shown in the next example.
    The regex in the PATTERN


    ```

    s/(^)\S*(.*)/\1.$2$/

    ```


    does following: starting at the first letter ("save") or capture any initial character
    (.), ignore one or more (+) of the remaining characters in this name that are
    not whitespace (\S), and then capture the remaining characters in the string (.*).

    (Note that match characters that are not whitespace" in regex is represented as
    backslash uppercase \S we would use lowercase \s to mean "match any whitespace\).

    The REPLACEMENT string, "$1.$2", begins by recalling the first captured pattern
    ($1), in this case pattern is the initial letter (.) of the genus name. This is
    followed by the insertion of literal period, followed by the second captured pattern
    ($2), which is the remainder of the name (.*) beyond the genus name.'
