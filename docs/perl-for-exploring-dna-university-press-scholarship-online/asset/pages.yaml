  md: "Arrays 157\n\nCreate a new Perl program (e.g., globTest.pl). In the same directory\
    \ as your Perl program, create a new directory called Tests. In the Tests directory,\
    \ create and save four empty files (e.g., one.txt, two.txt, etc.). In this example,\
    \ the files need not contain any data we'll attempt to glob the file names and\
    \ print them. Write a short Perl program to glob the files in the directory Tests\
    \ and print the names to the console.\n\n# 9.5 Iterating through an Array with\
    \ foreach\n\nOnce an array is populated with values such as provided by glob,\
    \ Perl's foreach control structure will select each of the items in the array\
    \ one at a time to allow you to process each of the items individually. The foreach\
    \ statement is a control structure similar to the while loop introduced in chapter\
    \ 6, except in this case the foreach loop executes once for each item in an array.\n\
    \nAssume you want to run an experiment on many files of DNA sequence. The following\
    \ lines of Perl will glob all the files in the directory bacteriaGenomes into\
    \ an array and then iterate through each those files in the array one at a time\
    \ using a foreach loop. \"For each\" of the file names in the array, the next\
    \ file name in the array is $nextFile, and that file is opened and processed depending\
    \ on your experiment. Once reach the bottom of the foreach loop, control returns\
    \ to the top of the foreach loop, where the next file name is retrieved from the\
    \ array, stored in the variable $nextFile, and the process repeats.\n\n```\nmy\
    \ @bacteriafilenames; # an array of filenames\nmy $nextFile; # hold one filename\
    \ at a time\n\n@bacteriafilenames = glob(\"BacteriaGenomes/**\");\n\n|Acinetobacter_sp_ADP1.fna\
    \ | .../Escherichia_coli_K12.dna|\n0 1 2\n# now the array @bacteriafilenames holds\
    \ the filenames\n# for each filename in the array, process the filename\nforeach\
    \ $nextFile (@bacteriafilenames)\n{\n    my $sequence;\n    $sequence = readInDNA($nextFile);\n\
    \    :\n} # end foreach loop (return to top)\n```"
