  md: '# Your First Perl Programs with a Focus on String Analysis


    testPrint.pl


    ```

    #!/usr/bin/perl

    use strict;

    use warnings;


    print "one"

    print "two";nprint "three";

    ```


    ![](img/af031a6fb4441852f776d419466cf3a5_34_0.png)


    To force a subsequent line of output to begin on a new line, you can output a
    new line character explicitly by ending your message with \n. The backslash-combination
    is referred to as an escape sequence. The backslash informs the print statement
    that the next character is not to be interpreted as the normal alphabetic letter
    but rather the special character that forces the output to the next (new) line.

    If we add \n to the end of each of the Perl print statements,


    ```

    print "one \n"

    print "two \n"

    print "three \n";

    ```


    we will produce the following output


    ![](img/af031a6fb4441852f776d419466cf3a5_34_1.png)


    one

    two

    three

    |


    Each \n combination forces any proceeding output to begin on the next line. It
    is possible to use more than one \n in a print statement, as shown in the next
    example. To ensure that you understand both the absence and use of \n, carefully
    reread the Perl print statements in the next example and compare your expected
    output with the actual output.'
