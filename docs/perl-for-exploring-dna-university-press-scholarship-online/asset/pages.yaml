    that perform the weasel code as described by Dawkins (1996). The algorithm is
    briefly summarized in this section. The program demonstrates the power of cumulative
    selection as far superior to random searching when seeking a target word in a
    large search space. Cumulative selection is also one aspect (albeit an important
    one) of evolution that happens to lend itself to programming, but of course, it
    is by no the entire story. Thus, the program is not a simulation of evolution
    per se, as some have argued in their criticism of it. An Internet search for Dawkins
    and the weasel code will lead you to a range of commentary as people either over-
    underestimate what the program is actually doing.

    An example of a weasel program in Perl is by Wesley Elsbery. You can find it (Dawkins''
    site), copy and paste it into your IDE, and run the program. It allows you to
    choose some parameters, such as the mutation rate and the target string, however,
    particular versions using a particular DNA or protein sequence as a target. For
    example, you could start with a random DNA sequence and set the target to be a
    particular motif. Or you could start with a random amino acid sequence and set
    the target to be a sequence with the greatest number of hydrophobic amino acids
    (or amino acids of some other chemical property).


    A simplified algorithm for such a program is as follows:


    +   Create random string (of length L) of amino acids (or English alphabet or
    nucleotides).

    Put the random string into two identical arrays (experimental arrays #1 and #2).

    Choose a target sequence of length L.

    Place the target sequence into an array (target array).

    Begin While loop (while the chosen experimental array does not equal the target
    array)

    Mutate:

    Use random number generator to choose a number N within the length of the array.

    Use random number generator to choose an amino acid from the list of 20 (or the
    alphabet or the nucleotides).

    Change one of the two experimental arrays by changing the Nth element in the array
    to the newly generated random amino acid.

    Compare and Select:

    Compare the two experimental arrays with the target sequence array, index by index.\Choose
    the experimental array that best matches the target array.\Discard the other.
    Replace it with replicate of best match

    Count this as Generation #1 (#2, #3, etc).

    Repeat until experimental array is the same as the target

    End While Loop

    Report on the number of generations it took to get the match'
