  md: "```\n@patronSaints = ( \"Kent\", \"Chargaffff\", \"Wall\", \"Franklin\" );\n\
    @patronSaints = sort @patronSaints;\n```\n\n# 9.10.2 Sorting Arrays of Numbers\n\
    \nSorting items other than simple strings requires extra care, even if the items\
    \ are as simple as integers. Assume you have an array that holds one of the many\
    \ results of a microarray analysis for thousands of genes. For demonstration purposes,\
    \ suppose our focus is on the red fluorescence intensity for each of the first\
    \ five genes on the chip. We would like to sort these intensities.\n\n```\nmy\
    \ @redSignals = (1500, 1246, 1099, 1003, 2798);\n```\n\nRecall the relational\
    \ (or comparison) operators for comparing two strings (sq, le, qt, etc.) are not\
    \ the same operators to use when comparing numerical values (==, <=, >, etc.).\
    \ Given that the default behavior of sort is to assume it is sorting, the function\
    \ will work by using the string comparison operators. Thus, if we want to sort\
    \ an array to compare elements if one should come before the other, we have some\
    \ extra work to do.\n\nWhen you want to change the default sorting behavior (and\
    \ is almost always the case, only when you are sorting simple strings), you must\
    \ write a new subroutine to define how to compare two elements to determine if\
    \ one should come before the other. The name of the subroutine you write to becomes\
    \ the first argument, USER_SUBROUTINE_NAME, in the sort function. The subroutine\
    \ must return an integer less than, equal to, or greater than zero depending on\
    \ how you want the elements in the list or array to be ordered. A sample subroutine\
    \ to order the elements from smallest to largest is shown below. Note: This subroutine\
    \ named numerically_the_long_way to indicate that a shorter version will be introduced\
    \ once we understand how it works.\n\n```\n# not the shortest solution, but semantically\
    \ obvious\n# This subroutine is used by sort when comparing two\n# numerical items\
    \ to determine their numerical order.\n# Note: the two items are automatically\
    \ stored in $a and $b,\n#   so do not attempt to declare $a and $b\n\nsub numerically_the_long_way\n\
    {\n  if ($a < $b)\n{\n    return -1;      # means $a should come before $b\n \
    \ }\n}\n```"
