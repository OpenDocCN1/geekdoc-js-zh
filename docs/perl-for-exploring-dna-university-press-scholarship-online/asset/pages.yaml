  md: '# How Much DNA Is There in a Genome (Using the Human Genome as the Example)?


    Nearly every human has two copies of a genome of 3 billion base pairs. So that
    makes a total of 6 billion base pairs per cell. Depending on how tightly the DNA
    is coiled, each has about 4,000 base pairs per meter (micron) of DNA. A little
    calculation reveals that every cell contains the astounding length of 1,500 micrometers
    of DNA. That number can be made more vivid by converting it to meters cutting
    a string of length, tucking it into your pocket and slowly pulling the string
    out, after having elicited guesses from onlookers to the length. The string is
    1.5 meters long! How much an enormous polymer (no matter how thin) could be stuffed
    into a nucleus of about 1 micron diameter and remain functional is a topic of
    ongoing research.


    Now consider that there are about 10 trillion cells in an adult human being (Estimates
    vary. It is difficult to count.) That means we carry around about 15 million meters
    of DNA, a number almost impossible to imagine unless converted into other units,
    even representing it as 15 billion kilometers doesnt quite do it. The sun means
    we have enough DNA to string out into space 100 million times the distance to
    the sun.


    By the way, most of the cells we are hauling around are not the 10 trillion of
    ours rather our load of symbiotic bacteria, 100 trillion of them. And each of
    these bacteria has its own genome and so on.


    For more calculations about DNA, see chapter 5, in which the numbers are the printing
    of letters A, C, G, T to fill the right number of books to contain the human genome.


    # How Many Genes Are There in the Human Genome?


    This is still a contentious matter because of the difficulty of defining the word
    gene and partly for political reasons. The definitional problem centers on the
    extraordinarily flexible way that eukaryotes use their genes to get numerous protein
    products out of sequences. Exons (functional sections of genes) may be spliced
    together, in many combinatory possibilities. If we tally up messenger RNAs or
    proteins in a cell we get far more than the number of genes. Furthermore, different
    gene programming stumble in different ways over introns (the noncoding parts of
    genes) and pseudogenes (genes that are no longer functional due to accumulated
    mutations). The political problem centers around the commercial interests in what.
    In this context genes can be viewed as marketable units, each representing a potential
    function, cure, and profit.


    GeneSweep was established as a friendly wager at the Cold Spring Harbor Genome
    Meeting in 2000. Bets ($1 the first year, $5 the next, and $20 after that) were
    recorded in a lab notebook. Participants submitted estimates of the number of
    human genes. These estimates from experts in the field ranged from 26,000 to 150,000,
    which gives an idea of the challenges of gene prediction. Finally in'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Perl for Exploring DNA


    2003 the genome was declared “done” (at least from the perspective of the popular
    press), and the number of genes was announced as being in the range of (a shocking)
    24,000. Clearly complexity of function and structure is not correlated with the
    number of genes? Note Caenorhabditis elegans, a model worm of 1,000 cells and
    1 millimeter in length has about 20,000 genes. (The winner of GeneSweep is Lee
    Rowan of the Institute of Biology in Seattle with a guess of 25,947.) However,
    most biologists agree that the number is far from settled and considerable work
    is still needed in the area of gene finding software.


    # What About the Enormous Spaces between the Genes?


    With only 24,000 genes, lightly sprinkled throughout 3 billion base pairs, the
    spaces between the genes, the intergenic sequences, are enormous. Let''s roughly
    estimate the length of a gene as 10,000 base pairs. (Gene lengths vary widely.)
    That means genes occupy approximately 240 million base pairs, which is only about
    12 per of the genome. So that 1.5-meter length of string from your pocket and
    pinch off about 18 centimeters. The rest of the string represents the intergenic
    regions. Because it is now becoming pretty clear that we cannot attribute our
    complexity to our quantity of genes, we really must focus on the spaces.


    # What About the Intergenic Sequences?


    They aren''t junk. Those sequences where most of gene regulation is being encoded,
    resulting in the crucial and subtle differences in our limited repertoire of genes
    is being used. It is where “complexity” is encoded.


    However, the metaphor of referring to DNA, especially intergenic DNA that has
    not yet been deciphered as “junk,” is so simple and visual and easy for the general
    public that it is used and over again by popular science writers. Unfortunately,
    the phrase “junk DNA” is certain to be with us for quite a while. No matter how
    many new studies come out dispelling the idea of junk DNA, by deciphering and
    finding another supposedly useless piece of it, reporting by the popular press
    continues to be biased. Each meaningful bit of sequence is dismissed as an odd
    exception. For example, long repeats of intergenic DNA (microsatellites) have
    a history of being declared and dismissed as junk. However (and this is just one
    of examples), the length of a microsatellite distinguishes two species of vole.
    A longer microsatellite near a gene for hormone control seems to confer paternal
    care of offspring and a different structure in the mole nest (see Hammock and
    Young 2005).


    Perhaps one problem is that such examples viewed one at a time seem to be trivial
    and even anomalous. Vole paternal care might well be an exceptional case and the
    rest of intergenic DNA is still junk! Such examples viewed not one at a time by
    the thousands will lay the myth to rest some day. It isn''t junk; it just hasn''t
    been examined and deciphered yet.'
  merge: -1
