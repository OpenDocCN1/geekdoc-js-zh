  md: '# Box 14.1 What BioPerl?


    BioPerl often comes up on Internet searches for applications of Perl in the biological
    sciences. The first couple of pages of BioPerl (www.bioperl.org) show it to be
    comprehensive (even exhaustive) and well populated by some of the heavy hitters
    in computational biology. A search of your favorite keyword at BioPerl is likely
    to reach an intriguing page that recommends and describes an appropriate Perl
    module.


    So your logical question is: Why are we not covering BioPerl modules in this chapter
    about using modules?


    The answer is that after much scrutiny and discussion, we consider the modules
    at BioPerl to be an advanced topic, somewhat out of the scope of this book. Many
    of the BioPerl modules are in fact modules within modules. Some can be downloaded
    from the BioPerl site; others must be found and downloaded-elsewhere. The complexity
    and size of the BioPerl modules are such that the downloads are nontrivial. We
    could tell you to get them and load, but we really should include many pages of
    detailed instructions. In short, although we hate to phrase it in discouraging
    terms, many of the BioPerl modules are “expert” modules. We prefer to keep your
    first experiences with Perl as completely gratifying and uplifting as possible,
    and that just may not be doable with BioPerl.


    However, all is not doom and gloom. You may well be one of the many scientists
    working in an interdisciplinary group. Your contribution might be to download
    a BioPerl module but to point out its existence and suggest that a particular
    one might be further explored by someone who feels comfortable with the command
    line and a long list of queries in command line jargon. Once, it is up and running
    (tested), step in and try it!


    # 14.2 Introducing the CPAN


    In Perl, it''s often the case that some of functionality you need for a program
    has already been written and packaged into a module. But where can you find it?
    One of the biggest advantages of using Perl is the Comprehensive Perl Archive
    Network (CPAN: www.cpan.org). The CPAN is a worldwide archive of Perl modules
    available for free and accessible online.


    To demonstrate the power of CPAN, we walk through the process of downloading and
    installing a module. Later on, we''ll see how to search the CPAN for modules that
    perform specific tasks.


    Let''s assume we have need a statistics module for performing standard deviation
    and other statistical tests. There are many modules on the CPAN that provide this
    functionality, each with a slightly different interface and complexity level.
    For our purposes, the Statistics::Lite module is an ideal choice given its simple
    interface and the fact that it has no external dependencies on other modules.'
  merge: -1
