    The powerful part of this change is the array. The array held hundreds of motifs,
    you would not have to change any of the code in the `foreach` loop. The remainder
    of this chapter will show you how to fill the cells of an array with various types
    of information and then process some or all of those cells.


    # 9.2 Arrays as a Data Structure


    The array is one of Perl''s two aggregate data structures. The other aggregate
    data type, the hash table, is introduced in the next chapter. Perl has three built-in
    data structures: (1) scalars, (2) arrays of scalars, and (3) hashes of scalars
    [sometimes referred to as `associative arrays` of scalars, although we will stick
    with hash or hash table]. The scalar is a fundamental data structure (a variable),
    most often storing a simple string (`ACGTACGT`) or numerical value (13 or 0.25),
    whereas arrays and hashes are larger, more complicated data structures that store
    aggregates of scalars. Arrays are an ordered list of scalars with each item in
    the list indexed or referenced by an integer subscript. Pictures of a single scalar
    and an array of many scalars can begin to accent the utility of storing many like-scalars
    all together in one place.


    ```

    my $FileName; # scalar variable to hold one(1) filename

    $FileName = "NM_012374_1.fna";

    ```


    ![](img/af031a6fb4441852f776d419466cf3a5_166_0.png)


    $FileName


    ```

    my @allFiles; # array to hold many filenames for an experiment

    # assume the initial four cells in the array get filled here...

    ```'
