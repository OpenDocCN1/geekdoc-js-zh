- img_proc: true
  md: 'This book is for the intrepid biological explorer in need of just enough Perl
    programming language, but without the time to become a fluent speaker. In *Perl
    for Exploring DNA*, Mark LeBlanc and Betsey Dyer present an enjoyable and hands-on
    guide to DNA sequence analysis. This can be depicted as a linear map of As, Gs,
    and Ts; however, such a map only hints at the varied contours and crevices, twists,
    kinks, and loops of the extraordinary double helix. The authors join the on a
    computational expedition as they explain why Perl is the language of choice when
    identifying patterns in strings of text.


    The authors offer a simplified approach to programming that is directly applicable
    to biological sequence analysis. Benefiting from years of teaching experience
    in both computer science and biology, they provide an exceptionally friendly and
    pedagogically sound introduction to Perl that emphasizes good programming practices.
    Concepts include numerous creative approaches to working with strings and files
    of sequence data, regular expressions, control structures, subroutines, and data
    structures including arrays and hash tables.


    **Mark D.LeBlanc**, Professor of Computer Science, and **Betsey Dexter Dyer**,
    Professor of Biology, of Wheaton College, collaborate extensively to analyze DNA
    sequences. Their primary focus is developing new software for exploring sequences,
    and their research influences their classroom activities, where they strongly
    encourage interdisciplinary undergraduate research.


    > "For beginners wanting to do sequence analysis, there is nothing as clearly
    explained or motivated as this material. It places learning in context and encourages
    the reader to understand the programming."—Laurie J. Heyer, Davidson College


    > "The book teaches biology students the basics of Perl computer programming in
    an appealing and completely new way."—Travis E. W. Doom, Wright State University


    Visit the companion Web site for additional programming resources:

    www.oup.com/us/perlforDNA'
  merge: -1
  pgno: 291
