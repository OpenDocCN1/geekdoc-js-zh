  md: '# BLAST


    Query is some unknown sequence

    Database is all known sequences

    Builds index of short sequences in query

    Scans linearly through database

    Output shows areas of homology


    Query is one of three million fragments

    Database is all of the other fragments

    Builds index of short sequences in database

    Scans linearly through query sequence

    Output shows stitched-together fragments between scoring match.


    Both scan short matches and extend those to find the highest scoring


    Kent noted that all alignment programs he knew of break the problem into two parts:


    +   1. Search stage—Find all regions that are likely to be homologous.

    2. Alignment stage—Examine regions from step 1 and make best alignments.


    Presumably the search stage will screen out and reduce the amount of sequence
    passed on to the alignment stage, speeding up the most costly alignment.


    Kent acknowledged setting the index of all possible short sequences is a hurdle
    but once it is set up for genome, the programmer "owns" it and the index does
    not have to be done again.


    # Box 11.4 Speed I


    Perl walks on water, right? Well, not always. One of the reasons that so many
    different programming languages have been invented and developed is because there
    are so many different types of problems. Languages often excel in some but not
    all situations. Here is a case in point.


    One of us (computer scientist) wanted to analyze 200 microbial genomes at once.
    The program in Perl was relatively easy to design and implement, but it ran slowly.
    Although significantly more difficult to implement, the program was rewritten
    in C++ in an attempt to decrease the time for each experimental run. The experimental
    run for 200 genomes was reduced from many hours to about one hour. For this unique
    case, C++ was a better choice, at least in regard the time it took to complete
    an experimental run.


    Similar to other languages you may know of (including Python and Java), Perl is
    not strictly a compiled language. What does that mean? Every Perl program is processed
    by the Perl interpreter. (Notice that the language is spelled with an uppercase
    P and the interpreter or "engine" is spelled with a lowercase p.) The interpreter
    handles the execution of all Perl programs, much like word processing program
    (e.g., Word) handles written documents. The Perl interpreter performs four steps:
    (1) loads a Perl program, (2) checks for syntax (typing) errors and assuming there
    are no problems (commonly called syntax "bugs"), (3) converts (compiles) each
    of the Perl instructions from the'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Phrasing Questions by Writing Algorithms 211


    program to a middle-level language (a bytecode), and then (4) immediately interprets
    each bytecode to perform the requested action. The first three steps of the perl
    interpreter are not unlike those performed during the biological process of translation
    with ribosomes (the interpreter) read and convert codons to amino acids (bycodes).


    In contrast to the compile-interpreter-run steps in Perl, languages like C++ are
    compiled and executed in two stages C++ programs are passed through a compiler
    that checks for syntax errors, and then the compiler translates each C++ instruction
    into a series of very efficient low-level instructions, saving the low-level in
    a new executable file (e.g., pairwise.exe). This is the primary reason for the
    increase in speed in the previously mentioned C+: the compiler converts the C++
    into low-level instructions that are perfectly suited for compter. Note that compiling
    a C++ program does not execute the program. A second step is required where the
    user must run the compiled C++ program. On the opposite end of the language spectrum,
    pure-interpreted languages do not compile into a low level or even translate to
    a middle level, but immediately interpret and execute each line of the program
    as soon as it is encountered. Purely interpreted languages are the slowest languages
    in regard to execution speed.


    | Compiled language | Compiled-Interpreted | Interpreted-only language |

    | :--- | :--- | :--- |

    | High level | | |

    | C, C++,ing | Perl, Python, Java | BASIC, JavaScript, shell scripts |

    | example file name | pairwise.exe | findRepeats.pl | moveFiles.sh |

    | | COMPILER | COMPILER and INTERPRETER | INTERPRETER |

    | | Check syntax, if okay then create a new file containing the machine code |
    Check syntax in entire script, if okay, then compile into and then immediately
    execute the bytecode | Immediately execute each line of the script, halting if
    any line has an error |

    | ↓ | ↓ | ↓ |

    | Low level | | |

    | machine code (pairwise.exe) | | |'
