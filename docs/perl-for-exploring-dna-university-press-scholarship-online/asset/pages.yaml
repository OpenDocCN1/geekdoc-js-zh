  md: 'As you have seen in earlier chapters, Perl supports a large number of built-in
    functions (or subroutines). For example, you can call the function square root
    by typing sqrt in your program. The hidden calculations to perform a square root
    are done behind the scenes, the result is returned to your program. The various
    string analyses that have been introduced previously, such as length, substring
    (substr), and index, are all built-in Perl functions. The focus and strength of
    any programming language is in part due to the nature of its suite of built-in
    functions. Perl''s popularity for handling strings is due to its strong, comprehensive,
    and efficient list of string-focused functions.


    If Perl does not have the built-in function you are looking for, it may still
    exist, having been written and shared by some member of the Perl community. There
    are many Websites devoted to the distribution of subroutines, in response to particular
    needs. Each subroutine extends the Perl language, packaging behaviors that are
    labeled with meaningful symbolic names. Also available are packages of interrelated
    subroutines, called modules, which we will introduce later in chapter 14.


    Finally, if neither Perl nor the Perl community has the built-in function or subroutine
    you are wishing for, you can write it yourself. In the long run, taking the time
    to write a subroutine is more efficient and safer than pasting in the same piece
    of code over and over for some repetitive analysis.


    # 7.1 How to Find and Use Preexisting Subroutines


    One of the common questions concerning subroutines is, “How do I know if a subroutine
    has already been written?” It is a good question and one that we recommend you
    ask often. Clearly, if a subroutine already exists and you find out, you avoid
    rewriting it. Chances are good that it is a built-in function (or a function that
    exists in an external module that you can load into your program; see chapter
    14), the function works correctly and has survived some review process that deemed
    it worth keeping. In fact, like the buttons on a scientific calculator, the built-in
    functions are built because programmers like you appreciate the abstraction that
    furnishes the functionality without having to know the details.


    In addition to this book and other more comprehensive volumes on Perl, you can
    search the web using the phrase “Perl functions by category” to find groups of
    functions that are related by their functionality, for example, “operate on scalars,”
    “operate on numbers,” and “regular expressions and pattern matching.” Such a search
    will reveal a rich list of functions for you to consider, including not limited
    to


    ```

    Functions for scalars or strings

    chomp, index, lc, length, reverse, substr, tr///, uc...

    ```


    ```

    Regular expressions and pattern matching

    //, pos, s///, split,...

    ```


    ```

    Numeric functions

    abs, cos, exp, int, log, rand, sin, sqrt, rand

    ```'
