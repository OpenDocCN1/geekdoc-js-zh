  md: '# Box 10.1 The Convoluted Etymology and Use of Octothorpe and Its Many Synonyms


    From the very first Perl program, the symbol # has been used to designate the
    part of the program that is not read but contains comments in the programmer''s
    own words.

    The symbol # is sometimes called a hash, especially by programmers. And hash may
    be shortened to sh, as in pattern of "sh bang" for #, first symbols of a Perl
    program. (Note that "bang" refers to the exclamation point.)

    Of course, because # (hash) was selected as the comment indicator in Perl, it
    could not be employed as a symbol in building hash tables. For that, % comes into
    play. The symbol % also appears as a modulus operator among the arithmetic functions.)
    The word hash for # is just one of a long list of potential names. These have
    been researched by Michael Quinion for "World Wide Words," findable by an Internet
    search.

    The # is variously called


    +   - "Pound" because of its association with weight in pounds.

    - "Number," perhaps relates to its use for weight.

    - "Hash," which may have been derived from a mispronunciation (from the 1970s)
    of hatch in cross-hatching or cutting with a hatchet, and this, is the derivation
    of hash table.

    - "Tac Toe" for its pattern.

    - "Crunch," perhaps also pattern-like.

    - "Square," which was suggested as an international standard because it is easily
    translated into other languages.


    Octothorpe seems to have originated as a joke term from Bell Labs in the 1960s,
    although it did not appear until the mid-1970s. They were adding two symbols to
    the phone dial, the asterisk *, and the #, which they called octothorpe. Octo
    is obviously for the eight points of the figure. The suffix thorpe has a few explanations,
    the most likely of which may be this, recounted by a retiring Bell Labs scientist:
    Apparently at the same time there was a fresh name for the old pound sign, there
    was a movement afoot to support the return of Jim Thorpe''s Olympic medals (after
    a disqualification) and a sympathetic Bell Labs employee commemorated the term
    in the newly coined jargon.


    # 10.2 A Simple Hash of Stop Codons


    Hashes provide an elegant way to translate three-letter RNA codes to amino acid
    symbols or names. As a small introductory example, consider how we might use a
    hash table to translate the stop codons (UAA, UAG, UGA) to find their full stop
    codon names (Ochre, Amber, Opal, respectively). The three-letter RNA codes (strings)
    will serve as the key and the stop codon names as values. Entries in hashes are'
