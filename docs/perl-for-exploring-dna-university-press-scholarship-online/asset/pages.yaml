    | Box 1.2 Finding Words and Motifs with Your Word Processor |


    Why not commence your first endeavor in sequence analysis right now with your
    processor? You have Find and Replace functions in the edit menu. You also probably
    have the capability of doing a wildcard search with an asterisk, as in “wildcard”.
    This feature might not pop up immediately but may be revealed with a little sleuthing
    using online Help. Remember, you also have the capability of counting characters,
    with and without spaces, as well as counting words, lines, and paragraphs. Some
    sequence analysis software begins with these bases. Some of the first programs
    you write may not do more than what these built-in functions are doing.


    Using your processor, create a new file and type in a sequence of As, Cs, Gs and
    Ts like this:


    ```

    actgcaaatgcggattaaacccccctcgagatgaccaaaattacgaaatgtgtgcgtcggatgacgaaatgcgc

    ```


    By Using, you immediately and effortlessly locate each instance of “tt” or “gcat”
    or any other motif of interest. For a fuzzy search. If you have several pages
    of sequence to search through and merely wanted to discover and underline every
    position of “atg”, some of which could be serving as start codons at the beginnings
    of genes, your word processor might suffice. Use Replace to make all the instances
    of “atg” bold, capitals, or underlined.


    ```

    actgcaaatgcggattaaacccccctcgagatgaccaaaattacgaaatgtgtgcgtcggatgacgaaatgcgc

    ```'
