  md: '# Your First Perl Programs with a Focus on String Analysis


    23


    ![](img/af031a6fb4441852f776d419466cf3a5_36_0.png)


    Because the Perl print statement outputs all text between the double quotes, if
    you want to include double quotes (") in your output, you will have to precede
    the double quote you printed with a backslash, \".


    ```

    print "Welcome to \"DNA Land\"!!!";

    ```


    ![](img/af031a6fb4441852f776d419466cf3a5_36_1.png)


    The escape characters are summarized below.


    | Escape characters | If you want your output |

    |--- |--- |

    | \n | forced to the next line |

    | \n\n | double-spaced |

    | \t | tab-delimited |

    | \" | to actually print a double quote


    # Going Back for More


    +   - Practice with various combinations of the new line character (\n). For example,
