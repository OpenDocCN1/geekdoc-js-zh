    # 7.5 Scope


    In Perl and most other programming languages, the variables that you declare and
    the values stored in those variables are available for you, the programmer, to
    use within the block of Perl where each variable was declared. The specific block
    or blocks that each variable can be accessed is known as that variable''s scope.
    Appreciating how scope fully works is, well beyond the scope of this text; an
    introductory appreciation can help you avoid some memory errors as well as encourage
    you to follow some good programming practices that will serve you well in the
    future.\Recall that we have encouraged you to always use the following line at
    the top of all of your Perl programs.


    ```

    use strict;

    ```


    This directive to the Perl system requires you to declare every variable with
    the Perl keyword, for example,


    ```

    my $DNA;

    my $len;

    ```


    The keyword declares a variable and defines its scope to be from the point of
    declaration until the end of a block unless that variable is redeclared. A block
    is delineated by Perl''s beginning and ending braces ( ); if there is no enclosing
    of braces, the scope is the entire (current) file. This becomes important if you
    choose to use the same variable name in multiple places in your program. If you
    use the same name, the scope of the variable with multiple names determines which
    variable is actually being referenced. An example can help shed some light here.'
