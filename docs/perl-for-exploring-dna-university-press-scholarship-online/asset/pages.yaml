  md: '# 5.1.1 Examples of Operators in Action


    Some examples will help reinforce the rules that Perl follows when handling a
    statement involving these operators.


    ```

    $x = 2 * 5 * 4;

    # (22) multiplication before addition: 2 + (5 * 4)

    $y = (2 + 5) * 4;

    # (28) parentheses force addition first

    $z = 3 * 5 * 2;

    # (30) left-to-right: (3 * 5) * 2

    $x = 2 ** 3 ** 2;

    # (512) right-to-left: 2 ** (3 ** 2)

    $y = 1 + 2 * 3 - 4;

    # (3) means: (1 + (2 * 3)) - 4

    $z = 5 - 4 + 3 / 1 ** 0;

    # (7) means: (5 - 4) + ((3 * 2) / (1 ** 0))

    ```


    Becoming comfortable with the operator precedence, associativity, and overall
    order of operations is a crucial element when writing Perl, but do not be discouraged
    if this takes some practice. In this spirit, we offer a step-by-step hand trace
    of a relatively long arithmetic statement:


    ```

    $z = 5 - 4 + 3 / 1 ** 0; # not a nice expression

    ```


    Notice that this statement has different arithmetic operators. Two sets of operators
    have equal precedence, so you must be careful to do each set in the correct left-to-right
    order. Referring to the table of arithmetic operator symbols, we first handle
    all expressions within parentheses. Because there are no parentheses, we move
    down to the operator with the next precedence, exponentiation (**). Exponentiation
    has right-to-left associativity, so we must start with the rightmost exponent.
    In this case, there is only one exponentiation, so that it is performed (1**0).
    In the hand trace below, notice that the expression (1**0) is replaced with the
    resulting value of that expression. We recommend that you practice decipher arithmetic
    expressions in this manner. Having completed all exponentiations, we move down
    the hierarchy to the next operator, the unary minus. Then we move down to the
    next set of operators: (*, /, %, that is multiplication, division, and modulo
    division). All three of these operators have the same precedence and a left-to-right
    associativity, thus (3*2) is computed rather than (2 /1). Clearly, 3*2 computes
    to a (6) and that result is used as the left operand of the division operator
    (6/1),'
  merge: -1
