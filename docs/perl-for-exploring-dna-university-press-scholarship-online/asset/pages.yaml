  md: '# 14.1 Using Modules Already Installed with Perl


    Modules are collections of functions. Each of the functions we have already been
    using, for example, length, substr, and so much like the built-in functions, and
    so on. Once you discover a function that you would like to use in a particular
    module, the first issue to settle is to find out if the module is already installed
    with your version of Perl or if you have to download the module from the Internet
    (see next section). This assumes that the functions you want to use are within
    a module already installed with your version of Perl. In this case, you need to
    request to use the module and specifically ask for the set of functions you need.


    The simplest way of obtaining access to a function in a module is to simply use
    it, typically inserted at the top of the program, and also explicitly request
    (export) the functions within the module that you would like to use in your program.


    ```

    #!/usr/bin/perl

    use strict;

    use warnings;

    # load the List::Util module and export the max function

    use List::Util(''max'');

    ```


    The use operator takes a module name, finds the module on disk, and loads the
    code into your program, ready to be used. We recommend that you also export the
    function name(s) that you need at this time to (1) show the reader which parts
    of the module you are using in this program, as well as (2) allow you to use the
    short unqualified name (e.g., max) when you call this function. If you do not
    export the function name, you will have to use a fully qualified name (List::Util:max)
    when you make the call in your program. We show an example of the difference between
    exporting at the time of use and using a fully qualified name below. If the module
    cannot be found or loaded for some reason, the use operator will "die," and your
    program will quit with an error.


    # Try This Now


    Because modules can vary greatly in their design and interface, the best way to
    learn how to use one and its associated functions is to read its documentation.
    With access to the Internet, the perdoc.perl.org site provides a searchable set
    of documentation. For example, search for List::Util. This will give you all the
    supplied documentation for the List::Util module, including some new examples
    in the example shown next, the documentation mentions that the List::Util requires
    you to explicitly export each of the functions you want to use in this module.
    The qw (quote word) operator allows you to cleanly show items in a list; no quotes
    are needed around each item, and no commas are needed as separators between each
    item.'
