  md: '# Box 3.1 The Perl Community


    The fact that there is something called "the Perl community" says much about the
    open and congenial nature of the Perl language and its users. To get a glimpse
    of it you could join one of their online email lists and read some posts, essentially
    listening in. For example, look for the Perl Mongers site that has links to many
    regional groups. The dialogues will likely be loaded with jargon and queries about
    especially difficult problems. For example, "I bet you can work around that by
    saving STDOUT, reopening it in IO::Tee and having IO::Tee output to the file and
    the saved STDOUT." Even when you are planning to go out for bears, the exchange
    of posts can sound as though they are planning an especially technical expedition
    to the peak of Mount Everest.


    Should you make amateur queries on a professional discussion group? Use some caution.
    The answer could be overly technical and even a bit sarcastic. It might be better
    to go to one of the many online Perl tutorials and do look up.


    Keep an eye on the discussion lists for speakers coming into town. Some of the
    major innovators of Perl enjoy stopping in a "technical meeting" and either giving
    a talk or just conversing about Perl. You may never get involved enough to become
    part of the main dialogue, but you may get something out of attending one of the
    talks. If you are feeling even more intrepid you can find out when the next YAP
    (Yet Another Perl conference) is going to be held and attend.


    The Perl community provides an important service for all of us, no matter how
    amateur use of Perl might be. The community has stockpiled and annotated lots
    of useful code and suggestions for putting together programs. It is easy to make
    queries and look up bits of code that are actually looked out ups. Make queries
    for Perdoc.com; for many different useful links go to Perl.com.


    # 3.2 Controlling Output


    Controlling the results from your Perl program appear in the output window is
    an important part of programming. Although your program might take minutes or
    even hours to search and compute, the output from your print statements are your
    only source of knowing how your program is proceeding and if your final results
    are correct. It is always worth the time to write neat and explicit messages to
    print from your programs. Later on, as you write more complicated programs, the
    practice of writing good print statements will serve you.


    Each print statement literally outputs the message between the double quotes,
    unless otherwise each print statement continues printing wherever the previous
    message ended. Put differently, a series of print statements will continue to
    print on the same line if they are on separate lines of code, as shown in the
    file testPrint.pl and the associated output.'
