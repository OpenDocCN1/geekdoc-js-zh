  md: '# Using Perl to Do Calculations


    Because the precedence hierarchy is not something that is easy to recall, programmers
    often get lax and enter their arithmetic statements as they would algebraically
    upon. But of course, Perl never forgets the correct order of operations, a small
    error on your part can lead to wildly incorrect results.


    ```

    # raise negative two(-2) to the fourth power (the wrong way)

    $z = - ** 4; # WRONG! before unary(-), so does -(2**4)

    # z holds -16 (not +16!)


    # raise negative two(-2) to the fourth power (the right way)

    $z = (-2) ** 4; # RIGHT!

    ```


    In this example, exponentiation comes before unary minus, so if you do not use
    parentheses to force the unary minus to do its work first, you end up with a result
    of -16 rather than +16! Note that lack of parentheses is not wrong Perl to halt
    your program and give you an error message. The statement is syntactically correct
    (and that all the interpreter checks), but of course it is logically wrong. This
    is not for great alarm if you are writing Perl programs on your own desktop computer;
    however, if this line of code is part of a system that is dripping medicine into
    your arm, we can agree that -16 units of medicine is not a good thing.


    # Good Practices


    (Always use parentheses!) From the outset, when you are entering mathematical
    equations that involve more than one operator, we recommend that you get in the
    habit of using parentheses around each set of (operand operation). Although it
    is very important that you learn the order of operations so you can correctly
    interpret Perl statements written by others or even your own, this is one area
    where humans succumb to the unforgiving but consistent nature of machines. A good
    practice when dealing with complicated mathematical equations is to write down
    the formula on paper and insert parentheses around the operations you expect to
    occur first, working out surrounding combined operations, and so on.


    ```

    $z = $a - 4 + $b * 2 / $c ** $d; # ambiguous to a human!

    $z = $a - 4 + ($b * 2) / ($c ** $d); # much better

    ```


    Two important features of writing good programs are readability and maintainability.
    Readability means that a program is easy to interpret on a statement-by-statement
    basis. The programmer who considers readability is ever conscious of a future
    programmer who will be reviewing the program at a later time. Often the future
    programmer is yourself! Maintainability goes hand-in-hand with readability: a
    readable program is a program that is easily altered, updated, and maintained.'
