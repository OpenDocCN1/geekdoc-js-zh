  md: 'At first glance, building an index would seem to be a mundane and even tedious
    chore that necessarily follows the writing of a book and not much more. Concordances
    (essentially an index of words and their locations rather than subjects) and even
    the more elaborated detailed versions of indexes, such as catalogs do not seem
    vastly more exciting. The same sorts of decisions about what to index and how
    to place an index into a hierarchy and whether to cross-index and add annotation
    are all common practices of DNA annotation.


    The act of indexing essentially allows you, the curious researcher, to get dibs
    on genomic sequences! It allows you to make your mark or impression on the raw
    data, pulling it into some semblance of being informative. In fact, the first
    steps in indexing are taken, genomic sequences might as well have been generated
    randomly, so little information is revealed. You are indeed building an index
    or catalog or concordance when you


    +   1. Annotate any part of a genome—seeking and recording genes, introns, promoters,
    and other features. Objectivity is of course a goal, but subjectivity guides the
    decisions to what gets emphasized.

    2. Look for and record binding motifs, protein domains, and restriction sites,
    including motifs of (as yet) unknown function—such as small repeats in promoter
    regions.

    3. Organize sequences according to metabolic pathways or co-regulated genes.

    4. Look and record transposons, viruses, pseudogenes, and other intriguing genomic
    sequences.

    5. Attempt to decipher the promoters of suites of co-regulated genes in a pathway.

    6. Perform all sorts of counts of oligonucleotides—such dimers, tetramers, and
    so on.

    7. Do of any of the above while comparing and contrasting genomes.

    8. Make phylogenetic trees. The tree itself is an informative!

    9. Create graphic map-like representations of sequence information. Maps, too,
    are nonlinear indexes.

    10. Produce software that filters or mines data that is essentially index building,
    complete with all the best guesses necessary as to what is worth collecting.


    All of the above are hypotheses or hypothesis generators, subject to change and
    risk with potential discoveries. What you choose to include and in what hierarchies
    and categories represents your best guess as what is meaningful and appropriate.
    What you omit or exclude may be just as revealing.


    Commenting on the subject of indexing books, A. S. Byatt (2001) notes that some
    of the late entries in index are made only after the realization that a particular
    topic is relevant. An example is the Dewey decimal system (essentially an index
    of books), which was invented before computers. Therefore there wasn''t much space
    in the system for books on programming. Where are they? They are within 003 to
    006, tucked in books about books (002) and bibliographies (010), a sort of best
    guess at the time as to where such topic might reside. Such guesses considering
    the organized storage of DNA sequences as well. Making the decisions as to what
    is informational and what is random is one of the most daunting and essential,
    challenging, and exciting tasks of a bioinformatician.'
