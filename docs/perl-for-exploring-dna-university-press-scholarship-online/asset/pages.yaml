  md: 'numbers appear with an unnecessary (and inaccurate!) significant number of
    digits.

    For example, one-third will appear as:


    0.3333333333333333


    The printf statement, although somewhat cryptic, can facilitate the formatting
    of your output. This built-in function prints a formatted string by giving you
    more control over how you would like your results, integers, and strings to appear.
    A quick example can reveal a reason why you would use the printf function.

    The printf statement below prints one-third (1/3) in six spaces: two leading blank
    spaces, a zero, one of the total six spaces taken up by the decimal point, and
    two (2) digits after the decimal point.


    ```

    $a = 1 / 3;

    print "Unformatted: %a \n"

    printf "Using printf: %6.2f \n", $a, $a;

    ```


    Unformatted:    0.3333333333333333

    Using printf:     0.33


    # printf "FORMAT", VARIABLES


    The printf function requires two arguments: (1) a format string that dictates
    the width and precision (for real numbers) to use for each of the values to be
    printed and (2) the variables that hold the values to be printed. Variables that
    hold integers are printed with a %d format, variables that hold strings are printed
    with a %s, and real numbers are printed with a %f format. Each format letter (d,
    s, f) may also be preceded by an optional width (integer) that dictates the number
    of places to use when printing the value. A positive width means to print the
    value within the width right-justified and a negative width means to print the
    value left-justified. In addition real number formats allow an additional option
    to indicate the number of places to print after the decimal point. The following
    table and example summarize the available formats and show some of the more common
    uses.


    | When you need to format | In general | Example |

    |---|---|---|

    | a real number | %<width>.<precision>f | %6.2f |

    | an integer | %<width>d | %8d |

    | a string | %<width>s | %25s |'
