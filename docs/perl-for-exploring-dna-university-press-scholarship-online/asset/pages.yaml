  md: '# 15 Conclusions


    > To travel happily is a better thing than to arrive.

    —Robert Louis Stevenson, "El Dorado" in

    Virginibus Puerisque (1881)


    Anton van Leeuwenhoek, the microscist, was in great demand as a party guest in
    fashionable Delft homes in the seventeenth century. He could be counted on bringing
    along several handheld microscopes with glass bead lenses on which he would mount
    diverse specimens, especially with scrapings from the teeth of his fellow guests.


    A contemporary of van Leeuwenhoek, essayist Constantijn Huygens, wrote about such
    party scenes, noting the difficulty of people seeing for the first time the teeming
    microscopic inhabitants of their mouths. Without previous experience and a context
    in which to classify the new information, most complained that they had seen nothing:
    "When even completely inexperienced people look at things they have never seen,
    they complain that at first they see nothing, but soon cry out that they perceive
    marvelous objects with their eyes" (Alpers, 1984).


    Often we do not see what we do not (yet) understand. The problem in sequence analysis
    is compounded by the sheer quantity of the unanalyzed information and the direct
    methods by which that information is deciphered.


    How do we build tools to seek out what might constitute a meaningful sequence
    when we do not know the full extent of it? Phrasing a question and building a
    computational tool to answer it are activities in forming hypotheses. They are
    worthy scientific experiments in and of themselves.


    What do we do with the results of genome analyses? What are potential hypotheses
    for continued search, for tweaking tools, and designing new ones. Finally there
    is the ground truth of the molecular biology wet lab where sequence results can
    provide the hypotheses for experiments.


    How should results of sequence analysis be organized? Should it be done with an
    appreciation that any given organization is just one of many choices. Furthermore,
    we are often limited to visualizing data in only two to three dimensions. Some
    multidimensional correlations may be invisible depending on our choices. Deciding
    on a particular presentation of data is also a form of hypotheses building. It
    is important to be ready to take advantage of serendipitous correlations, juxtitions,
    and relationships that tumble out of any large data set. Keep the hypotheses flexible
    and know when to abandon one. Fortunately, some programming approaches allow us
    to do that, instead abandoning a dead-end Internet search.


    How much information is slipping through our current methods of classification
    and decoding because we do not yet have the context by which to design the right
    search tools? Academic labs, granting agencies, and editors of journals often
    have clear visions and definitive opinions of what sorts of sequences are worth
    collecting, analyzing, and using; traditionally, gene sequences have been featured'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'high on their lists. Indeed the annotation of any new genome begins and often
    ends with a catalog of which genes are present. Often the sequences between genes
    are ignored. When such intergenic sequences are analyzed, they do not become neatly
    classified and organized into preexisting databases designed with genes in mind.
    Meaningful information, which often reveals itself in well-organized data sets,
    may not be visible at all. That means there is plenty of work for anyone, even
    single researchers or small groups, to take their own slice of the pie, defined
    as they wish.


    Expeditions of free exploration and discovery are what drew many of us into the
    sciences when we were children. As depicted in National Geographic and Nova, scientists
    we admired seemed to be always on the go and on the verge of a great unknown.
    That enticing, exhilarating idea of being on an expedition (or could be) an aspect
    of DNA sequence analysis, especially in its current status. The balance is tipped
    heavily toward vast, unknown territories of undeciphered data waiting to be explored.'
