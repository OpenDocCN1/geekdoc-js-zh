  md: '# Arrays


    In which a list-like data structure is employed to collect and manage large numbers
    of DNA files and sequences for analysis.


    Now the calculating machine ... does—being moved by the turning of a crank—calculate
    ... tables necessary to the labors of all devoted to the higher branches of mathematics.
    Feed it with figures, set it properly, and it will turn out the required results
    with unfailing accuracy and with great speed.


    > —Charles Babbage, quoted in Harper’s New Monthly Magazine "The Life of a Philosopher"
    (1867)


    This chapter is about scaling up. Any analysis that can be done on a single string
    can be repeated on many strings. Any analysis that can be done on the sequence
    in one file can be done on the sequences from many files, one after another. An
    array is a list-like data structure that allows you to organize your sequences
    on a greater scale. Arrays can hold any set of items and allow you to access and
    manipulate them with various functions. Note that all of the items stored in arrays
    are essentially scalar variables of the sort discussed in chapter 3. The following
    are items (scalar variables) that biologists especially wish to organize in the
    accessible list-like fashion of an array. A list of short motifs:


    "agga", "caat", "cgc", "cttc", . . .


    a list of gene sequences:


    "atg . . . . tag., atg . . . . . taa", . . .


    or a list of file names containing coding sequence:


    "NM_012374_1.fna", "XM_523807.fna", . . .


    One of the great advantages of being able to list files by name is being able
    to request that those be opened one by one, the sequences within examined and
    analyzed, then the file closed and the next one opened, again and again until
    all are done. The management and use of huge numbers of files is a critically
    important task in bioinformatics, so this chapter will linger on the details of
    dealing with large numbers of idiosyncratic file names. There will also be some
    suggestions for how arrays can help you parse useful information from lengthy
    strings. For example, you might like to capture and organize some or all of the
    details in the string:


    "Escherichia coli K12 at Univ. Wisconsin [Complete]"'
