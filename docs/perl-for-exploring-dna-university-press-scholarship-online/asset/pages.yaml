    > Box 5.3 The Library of Babel


    Now might be a great time to read or reread the wonderful short story by Jorge
    Luis Borges, "The Library of Babel." Various English translations exist that may
    be found online or at the library. The story consists of a detailed, often mathematical
    description of a fantastic library (of length 410 pages) that can be created of
    22 alphabet letters (the Spanish alphabet) plus a space, a comma, and for a total
    of 25 characters. "In the vast library, there are no two identical books." And
    the number of books "thought vast, is not infinite." Most of the books are either
    completely without or nearly so. For example, "One... was made up of the letters
    MC, perpetually repeated from the first line to the last.\ Yet the library contains
    books on conceivable subject as well as those that are inconceivable.

    The minutely detailed history of the theory, the archangels'' autobiographies,
    the faithful catalogues of the Library, thousands and thousands of false catalogues,
    the demonstration of the fallacy of those catalogues, the demonstration of the
    fallacy of the true catalogue, the Gnostic gospel of Basilides, the commentary
    on that gospel, the commentary on the commentary on gospel, the true story of
    your death, the translation of every book in all languages, the interpolations
    of every book in all books.


    As usual, we are thinking of DNA. Consisting of combinations of a mere four letters,
    the catalog (or library) of all possible DNA sequences (of gene length, for example)
    is much smaller than Borges'' library but nonetheless daunting if analysis is
    the goal.

    If we choose 3000 bases as the length of a typical gene (producing a protein of
    about 1000 amino acids) then the probability of any particular gene in the catalogue
    is 4 to the 3000th power (4^3000), a number far too great to have a name. True,
    we do not have to wade through all random and therefore meaningless sentences,
    but until we understand DNA coding, we will not always recognize the difference
    quite a lot for us, although selection also provides a loop of circular reasoning:
    Natural selection sorts out things which have sufficient meaning reasoning: The
    genes of successfully reproducing organisms must have sufficient meaning and a
    relative lack of random sequences to carry out the minimum necessary functions.
    That leaves the nontrivial task of analyzing what we mean by "sufficient," "relative
    lack," and "minimum necessary," which is much of what the DNA sequence analysis
    is about.'
