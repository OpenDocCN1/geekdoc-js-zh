    # 3.6.1 The Concatenation Operator (.)


    The period (.) is the binary, infix operator for the concatenation of two strings.
    It is a binary operator because it requires two string operands to work on and
    infix because the operator appears between the two strings. Note that the concatenation
    operator does not leave a blank character between concatenated strings; rather,
    the last character of the left string immediately precedes the initial character
    of the right string. As the next example shows, this behavior is desirable when
    using Perl to generate file names that do not contain blank characters within
    the name.


    ```

    # concatenate genus,species,strain into an Excel (.xls) filename

    my $genus = "Escherichia"

    my $species = "coli"

    my $strain = "K12"


    my $nextOrganismFilename;

    $nextOrganismFilename = $genus . $species . $strain . ".xls";nprint "Filename:
    $nextOrganismFilename\n";

    ```


    ![](img/af031a6fb4441852f776d419466cf3a5_54_0.png)


    There are other ways to concatenate strings. Perhaps the most straightforward
    is to include your string variables in double quotes. Remember that within double
    quotes, your variables are interpolated, which means the values within the variables
    are used in the resulting string. Note that the period within double quotes is
    not the string concatenation operator but a literal period needed before the Excel
    file extension (.xls). The double quotes also alter the context so Perl treats
    the period as any other character.'
