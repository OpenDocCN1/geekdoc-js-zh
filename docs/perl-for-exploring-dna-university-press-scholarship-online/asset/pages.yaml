  md: "such as genus name, species name, strain number, and whether the genome sequencing\
    \ is complete or in progress.\n\n# 9.1 A Quick Example: An Array of Motifs\n\n\
    Assume you have hundreds of putative regulatory motifs that you need to store.\
    \ An array can store these motifs for you. The following Perl snippet fills an\
    \ array, @motifs, with the first five of those motifs.\n\n```\n# an array to store\
    \ many putative regulatory motifs\nmy @motifs = (\"ACGT\", \"CAAT\", \"TATATCTT\"\
    , \"GCAT\", \"CGCGC\\ );\n```\n\nThe @motifs holding five scalar strings would\
    \ appear like this in memory, each string stored within one cell of the array.\
    \ Each cell of the array has an index (or subscript) with indices beginning with\
    \ zero.\n\n| \"ACGT\" | \"CAAT\" | \"TATATCTT\" | \"GCAT\" | \"CGCGC\" |\n|---|---|---|---|--|\n\
    | 0 | 1 | 2 | 3 | 4 |\n\nSyntactically, notice that when you refer to an entire\
    \ array, the array name is prefixed by the symbol. To refer to one specific scalar\
    \ element within the array, you need to \"index the array\". For example, @motifs[3]\
    \ would access the array element subscribed by a 3 and get you the motif GCAT.\n\
    \nIn addition to accessing individual elements in the array, Perl provides a number\
    \ of looping control structures to visit every element in the array, one at a\
    \ time. For example, the following foreach loop can visit every element of the\
    \ array, one at a time for a set of alliances yours choosing. For now, we would\
    \ like to print any of the motifs that are longer than (7 bp) and/or GC-rich (GC\
    \ content only).\n\n```\nmy @motifs = (\"ACGT\", \"CAAT\", \"TATATCTT\", \"GCAT\"\
    , \"CGCGC\\ );\n# for each of the motifs in the array (one at a time),\n# is the\
    \ next motif longer than 7 bp or GC-rich?\nforeach $nextMotif {\n    if (length($nextMotif)\
    \ > 7) or ($nextMotif ~ m/^[GC]+$/) {\n        print \"$nextMotif\\n\";\n    }\n\
    n\n```"
