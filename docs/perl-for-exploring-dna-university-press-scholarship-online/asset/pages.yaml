    # 13.2.2 Random A:C:G:T Distributions Based on Actual Sequence


    The proportion of nucleotides in an actual experimental sequence is not likely
    to be 1:1:1:1. A few additional steps are necessary to generate a pseudo-random
    string of the right proportion. Generating a random sequence of DNA of the same
    length and A:C:G:T ratios is something we are likely to want in a number of situations,
    thus it is a great candidate for implementing this functionality in a subroutine.
    The following code assumes such a subroutine has been written. Perl that calls
    the subroutine and a sample output, a complete subroutine is given.


    ```

    # generate a random sequence of DNA based on the actual DNA

    # start with an "actual" sequence of DNA

    # Note: later on, we could read in the actual DNA from a file

    # $sequence = readInData("someFile.fna")

    my $sequence = "ACGGCTTGCCGTATATAAAATACTATATAA"

    print "ACTUAL Sequence: $sequence \n"

    my $randomSequence = generateRandomSequence($sequence);

    print "RANDOM Sequence: $randomSequence \n"

    ```


