  md: '# Good Practices


    When creating file names, we recommend that you concatenate multiple words, use
    lowercase letters except when starting new words, and avoid spaces. Examples of
    good filenames include helloDNA.pl, findMotif.pl, and fuzzyGeneFinder.pl.


    helloDNA.pl


    ```

    #!/usr/bin/perl

    use strict;

    use warnings;

    # This is my first Perl program


    print "hello DNA Land";

    ```


    This Perl program prints the message "hello DNA Land" to your computer screen.
    To run this Perl program, find the Run menu in your programming environment and
    select it. (Note: in some environments it is necessary to save the program before
    running it.) After you run this program in your Perl programming environment,
    you should see an output window containing your message. An example output window
    is shown below.


