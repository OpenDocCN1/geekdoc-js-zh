  md: '# Your First Perl Programs with a Focus on String Analysis


    In which you will get through “hello DNA Land” and proceed to the practical fun
    of using Perl in one of its great strengths—the analysis of strings such as DNA
    sequences.


    Perl is remarkably good for slicing, dicing, twisting, wringing, smoothing, summarizing,
    and otherwise mangling text.


    > Stein 2004


    The Perl programming language (Practical Extraction and Reporting Language) was
    not invented specifically for DNA sequence analysis, but it might as well have
    been. The parallels are many between the analysis of texts in natural languages
    and the analysis of DNA strings or sequences. For this chapter in particular,
    there is a great deal of material that you should get through. String analysis
    is the essence of DNA analysis. Therefore, we are cutting this introduction short
    and urging you to read and work through these examples as you sit at your computer.
    Take a break from programming later and read some of the text boxes in this chapter
    on topics such the amazing Larry Wall, inventor of Perl and the supportive Perl
    community. Meanwhile, let''s move on to “hello DNA Land.”


    If you have skimmed eagerly ahead to this chapter, failing to stop at chapter
    2, go back! You cannot begin to write programs until you have installed Perl and
    a Perl programming environment on your computer.


    # 3.1 My First Perl Program


    A first program is a special event. It serves as a quick test to ensure that your
    programming environment is working properly, and it also brings a quest to learn
    the syntax and semantics of a language that can make a computer do your bidding.


    A first Perl program is shown below. Assuming you have successfully installed
    a Perl programming environment (see chapter 2), use your programming environment
    to create a new Perl file called helloDNA.pl. You should begin the practice of
    using an appropriate file name, the name providing a hint at the task that the
    program will perform and ending with the Perl (.pl) file extension.'
