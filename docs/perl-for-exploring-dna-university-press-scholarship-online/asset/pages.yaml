    # 7.4 Terminology: Arguments


    Subroutines are distinguished by their formal names. Arguments, sometimes called
    parameters, are the scalar values sent to a subroutine when that subroutine is
    called. For example,


    | length($ DNA ); | # 1 argument to length |

    | printSequence($protein, 20); | # 2 arguments to |

    | | # printSequence |

    | index($putativeGene, "AC", 7); | # 3 arguments to index |


    The terminology becomes important as you read documentation for functions. For
    example, the documentation for the index function says that the first two arguments
    are required (the string to search and the substring to look for), whereas the
    third argument (where to begin the search) is optional.


