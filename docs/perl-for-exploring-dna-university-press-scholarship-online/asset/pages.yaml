  md: '| Regex | Meaning |

    |---|---|

    | \1 | recall the first captured group |

    | \2 | recall the second captured group |

    | \n | recall the nth captured group |

    | .? | optional, match any character 0 or 1 time |

    | T? | optional, match a T or nothing |

    | (CAAT)? | Optional, match CAAT or nothing |

    | A(3,7) | greedy match between 3 and 7 As |

    | A(3, ) | greedy match of 3 or more As |

    | [CG] | match any one of the characters in the set, a C or a G |

    | TATA[AT] | match TATA followed by an A or a T |

    | [^CG] | match any one character that is not in the set, not a C and not a G
    |

    | [CG]{5,10} | greedy match a C or a G between 5 and 10 times |

    | ^ATG | string begins with ATG |

    | TAG$ | string ends with TAG |

    | (?:...) | cluster-only parentheses, don''t capture 3 character (don''t remember
    3 characters) |

    | (?=TAG|TGA|TAA) | True if the look-ahead assertion succeeds; that is, it does
    find TAG or TGA or TAA |

    | (?!TAG|TGA|TAA) | True if the look-ahead assertion fails; that is, it fails
    to find TAG or TGA or TAA |

    | \s | match any whitespace character (tab, space, newline) |

    | \S | match any character that is not whitespace |

    | \d | match any character that is a digit, same as [0123456789] |

    | \D | match any character that is not a digit |

    | \w | match any one “word” character (includes alphanumeric, plus ''_'') |

    | \W | match any one nonword character |'
