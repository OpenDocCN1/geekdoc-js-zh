  md: "# Good Practices\n\nNotice that we use names in the singular for hashes (e.g.,\
    \ %amino_acid, %stopCodon). Because most references to a hash table in your programs\
    \ refer to a single (key, value) pair naming convention can help facilitate the\
    \ reading of your programs. Alternatively, because arrays are often referenced\
    \ collectively in your program, we use plural names for them (e.g., @bacteriaFilenames,\
    \ @patronSaints).\n\n# 10.4.2 Accessing All the Values in the Hash\n\nPerl provides\
    \ two functions to iterate over the entire set of keys in the hash, one at a time.\
    \ The functions are each and keys. The each function steps through the (key, value)\
    \ pairs one at a time and returns either a-two-element list consisting of the\
    \ next (key, value) pair\n\n```\n($key, $value) = each %hash_table; # next (key,value)\
    \ pair\n```\n\nor just the next key.\n\n```\n$key = each %hash_table; # next key\n\
    ```\n\nA while loop is shown below using to capture each (key, value) pair and\
    \ print the list of 64 codons, one per line. When the entire hash has been read,\
    \ the each function returns an empty list that evaluates to false in the while\
    \ loop test.\n\n```\n# print all (key, value) pairs in a hash\nmy $codon; # next\
    \ key\nmy $Aaname; # next value\nmy $sn = 1; # count amino acids\n\nprint \"Internal\
    \ (key,value) pairs \\n\"\nwhile ( ($codon, $Aaname) = each %amino_acid )\n{\n\
    \    print \"$sn $codon - $Aaname \\n\";\n    $sn++; # add one to count\n}\n```\n\
    \nA partial output of printing (key, value) pairs is shown next. Again notice\
    \ that the internal order of (key, value) pairs is not the same as the order of\
    \ initialization."
