  md: '# Hash Tables


    signs were used over and in various combinations. Yet these appeared not to be
    used phonetically, like individual letters and sounds. The puzzle was solved with
    the realization that the gaps are combinations (often highly redundant), or both
    phonetic and pictorial information.

    What does this have to do with DNA? Many numbers and facts about DNA sequences
    not add up (yet). The first and most notable problem was Chargaff''s numbers.
    Dismantle a DNA double helix and count the bases. The frequency of As will be
    equal to the frequency of Ts; the frequency of Cs will be equal to the frequency
    of Gs, which is a Biology 10 lesson about DNA. At one point, the significance
    was lost on many researchers including Watson, Crick, Franklin, and even Chargaff
    himself. Rebuilding a crooked and bumpy DNA model, using Chargaff''s numbers,
    was the eureka moment in 1953 for Watson and Crick.

    Suddenly the helix became a smooth cylinder as bases were aligned and linked in
    proper symmetry and Chargaff''s numbers were transformed into the canonical pairings
    of A-T and CG.


    Other problems might be considered “Chargaffian clues.” These are situations that
    do not make quite sense or add up and therefore suggest that data are missing
    or alternative points of view are still forthcoming. We include on the list the
    following examples from promoter regions.

    To summarize all of these, the lack of extensive conservation of promoter and
    enhancer motifs does not make sense if the goal is to think of them as linear,
    vectorial two-dimensional information, a paradigm that has worked for genes.


    +   1. There are many well-studied and seemingly well-promoted and essential short
    (10 bp or fewer) motifs in gene promoters. Much lab research in gene regulation
    has focused on these. Binding proteins often cover more than 10 bp, and nonspecific,
    fuzzy binding across sequences may be significant.

    2. Many assays for gene regulation are turning on or off a particular gene by
    inserting or deleting a motif in the promoter. However the promoter information
    may be highly modular and interchangeable. It may be possible to form syntactically
    correct and functional “sentences” in the promoter that are nonetheless nonsense.
    We called this the Mad Lib paradox, after the children''s game in which humorous,
    syntactically and grammatically correct sentences may be formed by inserting various
    words. The result might be nonsense, such as “The tree ate my uncle.”

    3. The search for a minimal functional size or consensus sequence for a particular
    promoter motif may yield results but may not reflect the real use of a particular
    motif. We have called this the classified ad or Vanna White paradox. Note that
    “3 bdpr art” is readable and might represent a minimal functional size of readability
    in a classified ad. Furthermore, if Vanna White reveals EL_PH_NT, perhaps we see
    the minimal functional size of the full word elephant in a genome (or in any language)
    the subtle nuances


    continued'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# Box 10.2 Continued


    grammar and spelling may be overlooked. If the goal is to decipher promoter information,
    minimal functional size may be misleading.

    4. Many mutations in promoter regions have no discernible effect, within the limits
    of lab assays. Therefore, many promoter sequences seem unconserved and irrelevant.
    However, the promoter regions are much less dependent on linear, vectorial code.
    Promoters may be error-tolerant due to redundancies that compensate for missing
    or misdescribed information. Furthermore the spacing of motifs should be considered
    as informative as themselves.


    5. Enhancers are often considered in a separate category from promoters, being
    hundreds to thousands of bp away from the gene. Furthermore, for convenience,
    some promoter studies focus only on sequences within a few hundred bands of a
    gene. Enhancers seem to be quite modular and context-sensitive. Including them
    into more promoter studies may facilitate deciphering regulatory information.


    6. Probably all proteins have a minimum, low-affinity binding to DNA. Mutational
    studies of promoter motifs might shift affinity along a continuum from random.
    It should not be assumed that strong binding is representative of actual use in
    promoting genes. There may be situations where a lack of or low-level binding
    forms some essential bit of information, but it would be extremely difficult to
    detect these above background noise of random binding.


    7. Instructions for gene regulation may be scattered throughout the genome. The
    linearity of chromosomes is an illusion of databases and models. Actual DNA is
    stuffed into a nucleus or cell such that the information being used three- and
    four-dimensionally. Attempting to “read” promoters linearly may never lead to
    full deciphering of the information.


    8. Motifs in promoters and enhancers are often collected, reported, and stored
    as linear and vectorial (like genes). This is a practical matter for designing
    databases of sequences, however it may not reflect the true functioning of motifs.


    9. Evolution is quite different from design. It is messy, illogical, and good
    enough (even if marginally) for the particular context of a generation in an environment.
    Therefore, looking carefully for logical patterns may lead to some misunderstandings
    about promoters.


    So what can we do about all of this? Take it as a challenge. We think of the upstreams
    (and we) of genes as the whitewater of the genome. Like the exploration of whitespace
    on a raft, we do not expect a linear, vectorial ride on the river. The design
    of databases to handle intergenic (whitewater) sequences is a major unsolved problem
    requiring more dimensions than required for gene data (Introns, the noncoding
    sequences within genes also, are not recorded in proper dimensionality, reflecting
    their complexity.)


    Anyone tackling the project might look beyond simple English lexicons as a model.
    For example, dictionaries of Chinese characters are more complex,


