    2. Write a subroutine called getSecondCodon to accept one argument (a DNA sequence)
    and return the second codon in the initial reading frame of the coding region.
    The second codon is the second triplet in a DNA coding region, that is, the first
    occurrence of the three nucleotides (1, 2, and 3) and ATG marks the first (start)
    codon and nucleotides (4, 5, and 6) denote the second codon. The DNA sequence
    might not start with ATG but you are assured that ATG does exist somewhere in
    the sequence, immediately followed by the second codon. The following Perl is
    a sample of a program that calls the function to test to see if the function works
    correctly.


