  md: "# Making Decisions Over Over Again with Perl's if and while 101\n\nsecond leftmost\
    \ parenthesis (2), and so on. Capturing previously clustered items within the\
    \ same regex requires the backslash syntax (e.g., \\2, \\3), whereas capturing\
    \ an item after (outside) requires the typical Perl variable syntax for example,\
    \ $1, $2, $3.\n\nReturning to the DR example, capturing (recalling) the second,\
    \ third, and fourth items within the regex requires backslashes, and capturing\
    \ the first (entire) match after the regex requires $1.\n\nEXPR =~ m/PATTERN/\
    \ [option]\nThe match (m/PATTERN/) operator searches a string (EXPR) for a particular\
    \ PATTERN, where the PATTERN is a regular expression. When used in the context\
    \ of a logical expression such as an if statement, the operator returns true if\
    \ successful, false otherwise. A number of options are available when performing\
    \ matches, for example /PATTERN/i when you wish to perform case-insensitive pattern\
    \ matching. If you capture (enclose) the entire regex within a set of parentheses\
    \ and a match is found, the result of the match is captured and stored in Perl's\
    \ global variable $1.\n\n# Good Practices\n\nWhen applying the match operator,\
    \ the use of the letter m at the start of the match is optional; however, we strongly\
    \ recommend you include it. The short route to follow is: \"explicit.\" The regular\
    \ expression syntax is daunting enough on its own. The reader of your program\
    \ (it may be you!) will appreciate the explicit reminder that this if-test is\
    \ an attempt to match (m) (regex) to the string.\nAs always, use good variable\
    \ names that will help the reader. When using numbered variables for capturing\
    \ (recalling) the result of a regular expression, immediately store the numbered\
    \ variable into a variable that defines the pattern you matched.\n\n```\n($DNA\
    \ ~ ~(TATA[AT]A[AT][AG]))\n{\n  $TATAbox = $1; # immediately store with a good\
    \ name\n:\n```\n\n```\n($DNA ~ m/((.).(.).*4\\3)/)\n{\n  $MR = $1; # store the\
    \ Mirror Repeat (MR) just matched\n:\n```"
