  md: '# Box 12.1 Go Ahead and Name It (and Join the DNA Philological Club)


    Let''s say you or your students are curious about ants and would like to immediately
    begin a project to find which kinds of ants are attracted to a bait of peanut
    butter on the ground. A major stopping point is that you know nothing of ant and
    would have to pore over dense dichotomous keys to have any hope identifying a
    single ant to genus and species. That isn''t a very satisfying start to an intriguing
    project. Tropical biologist Bentley suggests this solution. Start with the peanut
    butter immediately. Then, as needed, make up your own taxonomic key of whichever
    ants arrive. There may be just three types. You go ahead and name them: "bighead,"
    "tiny," and "red." Now you are free to make sorts of fascinating observations
    about their interactions and activities, which is what you wanted to do in the
    first place. You could do the same with sequences, of course, make ahead of any
    search to see whether the sequence already has an official name. In your explorations,
    do not be held back at first by jargon invented by other people. That can come
    later when you are fitting your research into the bigger picture.


    Now let''s say you want to popularize your organisms (or sequences), encouraging
    others to appreciate what you see and may join in. This is a realistic scenario
    for sequence analysis. In an interdisciplinary group, you need to cut through
    the jargon and demystify the naming process. A good example is what lovers of
    dragonflies do. They set out to popularize dragonflies, bringing them to a similar
    status to that of birds or butterflies by making attractive common names for each.
    For example, "goldgreens" instead of Corduliastridae. The multisyllabic Latin
    name still stands as the most important identifier, but novices can enter the
    dragonfly club more easily. So is it with sequences. You won''t want your first
    day in the interdisciplinary group to be spent stumbling over Latin jargon. Even
    if your does not become popular outside of your lab, you have taken important
    first steps to building your own working community. One of the many examples from
    our lab is versatile repeat, coined by us for repeats that are both (inverted
    and direct) or are (mirror and direct). We began using that phrase well before
    any serious analysis or deciphering of potential meaning.


    Here is one pitfalls of naming, particularly in a finalized form. The essential
    nature of the act of naming and thereby sorting and classifying is sometimes-reflected
    in premature names and classifications—found to be incorrect or impractical but
    which also are fossilized in the literature. Biology is full of terms that must
    be memorized if one is to follow the literature at any depth. Learning jargon
    is one of the most difficult tasks of undergraduate biologists, and it is further
    exacerbated by underestimates of how important it is to be able to spell, pronounce,
    and accurately and spontaneously use multisyllabic jargon couched in two ancient
    languages (Greek and Latin). Furthermore it is not always clear to a notice whether


