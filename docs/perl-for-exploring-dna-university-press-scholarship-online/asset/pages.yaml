    of strings that contain only these letters |

    | ^ab | Match ''ab'' at the beginning of a word |

    | ing$ | Match ''ing'' at the end of a word |


    We can find partial one-word anagrams in two steps (Aho and Ullman, 1995). The
    result from $patternOne can be the starting list of words for $patternTwo.'
