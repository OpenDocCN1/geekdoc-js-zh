  md: '# Box 12.2 Continued


    pictogram of waves in water (water) and a crouching man holding his hand to his
    mouth (drink).


    If this were done in English, the word for cough might look like couFgh followed
    closely by one or more pictures depicting a person coughing. This would be the
    way to make sure that you could pronounce the gh like F and know the meaning from
    the picture.


    Like any evolved system, hieroglyphics is convoluted in its lack of simplicity
    and shows many vestiges in origin as a completely pictorial method of writing.
    The newer (5,000-year-old) phonetics seems to have been layered in causiously
    leaving extra cues to make sense of the meaning. Thus in hieroglyphics there are
    at least two methods of perception for deciphering a word: hearing and pronouncing
    the phon and seeing the pictogram. Finally, of course, context is important. One
    would hope to find the third surrounded by other words complete a logical sentence.
    Otherwise it is back to the dictionary for more deciphering as there are many
    opportunities for ambiguity, including abbreviations and transpositions of glyphs
    for reasons of aesthetics. Ironically the great care to avoid misunderstandings
    by layers of redundancy makes simple translation thousands of years nearly impossible.


    Like hieroglyphics, DNA can appear deceptively linear in its translated form,
    acgtgcga. The actual meaning is likely to be more complex, multilayer, representing
    the likely linking or coiling of the DNA at that site of the motif and the likely
    binding of one or more proteins. The perception and meaning of a motif of DNA
    is the result of several types of chemical interactions, their probabilities of
    occurring and the context of the motif within the longer string. Furthermore,
    it is an evolved system and as is expected to be a bit ambiguous and jerry-rigged
    with vestiges of former meanings.


    Where does this leave the DNA analyzer? We submit with a deep respect for the
    ground truth of the lab bench. We cannot go back to ancient Egypt to clear up
    some of the many misunderstanding of hieroglyphics. We can, however, go into the
    wet lab or collaborate with colleagues who can do that for sequence interpretation.
    A certain motif may appear again and again in an enticing upstream position of
    a gene. It remains to go into the lab to find out what motif actually does. How
    many different proteins can it bind and how securely? What is the shape of the
    DNA at that motif and under what conditions? What happens to the cell or organism
    if that motif is missing? It is just a list of hypothetical motifs without that
    information.


    # 12.3 Noncapturing Groups


    At times it is necessary to group a part of a pattern without capturing (remembering)
    the group in a hidden variable. Recall that the use of parentheses within a regex'
