    anagram, n. 1. A transposition of the letters of a word, name, or phrase, whereby
    a new word or phrase is formed.


    We admit it: we couldn''t resist including anagrams. We love word play. In the
    spirit of this chapter, finding anagrams is a creative and fun application of
    pattern matching, not to mention an advanced application of some of the regexes
    you have been learning so far. No worries if you do not understand all the small
    details of this use of regex. Our reason for including it here is to encourage
    your creative application of regex for fixing patterns in text or DNA sequence.


    You need to use the anagram.pl program for this exercise (see section 4.5 for
    directions to download our Perl program).


    The Perl program anagram.pl finds partial anagrams, meaning that not every letter
    of a word needs to be counted for, for example, "go" is a partial anagram of "genome".


    One-word partial anagrams as defined here require two (2) regexes. $patternOne
    is a regex to match words as we have been doing in previous examples while $patternTwo
    is an inverse match, that keeps all words do not match pattern.


    ```

    ############################################

    # =====ENTER HERE ========

    my $patternOne = ''^[genome]*$'';

    my $patternTwo = ''.*.e.*|([^e]).*'';


    my $filename = "english.txt";

    # $filename = "ecoli.txt";

    ###########################################

    ```


    +   1) Match all words that only contain letters in the word "genome".

    2) Match all words that do not contain three or more of the letter ''e'' or a
    duplicate of any letter other than ''e''.


