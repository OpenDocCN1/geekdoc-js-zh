  md: '# 4.1 Continued, Imperfect, or Mismatched Repeats


    The vast majority of repeats have one or more mismatches. These are computationally
    challenging because of the many decisions that must be made in searching for them.
    For example, how many mismatches will be allowed per string and if there is more
    than one to make a match, which one will be used? These are some of the same issues
    encountered in any string comparison for analyzing phylogenies and relatedness.


    # 4.2 How Comparable Are These Two Word Lists?


    A list of words from an English dictionary and a list of seven-letter DNA motifs
    from E. coli are not directly comparable at all. However, they are useful as introductory
    datasets for learning about regex syntax and thinking about how pattern matching
    might be applied to DNA sequences. The beginning of each of the two lists are
    now next.

    The list of DNA motifs (words) was generated artificially from all 7-mers in the
    E.coli genome. It is a list with little meaning and in itself, a collection in
    which all seven-letter motifs appear in the E.coli genome are considered. That
    is not to say that none of these 7-mers are without meaning. A few DNA motifs
    (of this length) have their functions worked out and demonstrated in the lab.
    For example, short protein-binding sites and some are restriction sites; the majority
    of short motifs remain to be analyzed, and generating motifs from a genome is
    merely one small step.

    The list of English words is full of meaning to any native speaker. It serves
    as a sort of familiar, comforting grounding for this foray into pattern matching.
    However it is not meant to be directly analogous to the DNA motif list. Any English
    words that you “discover” will already have well-established meanings. In fact,
    in this chapter we are not making of a discovery at all but are testing your ability
    to write an accurate search statement using the regex syntax. This is quite important
    because regex carelessly written can return bad results rather quickly, and it
    takes some patience and vigilance to spot the errors. In this case, we use our
    knowledge of English to spot the successful searches and the errors (if any).


    ```

    english.txt

    A\aardark\aardwolf\Aaron

    Aronic

    abacate

    abacay

    abacinate

    abacinationiscus

    ```'
