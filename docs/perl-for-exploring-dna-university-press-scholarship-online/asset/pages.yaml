    > Box 6.2 Eric Davidson


    Eric Davidson is among biologists who use a programming metaphor as a working
    hypothesis for gene regulation. Davidson''s model organism, the sea urchin, had
    several of its regulatory pathways worked out, complete with features that look
    something like, for each, and if statements. Or at least it is possible to diagram
    the pathways in that manner.

    One way to think of the metaphor is this: Consider a single gene to be a simple
    command or imperative statement: "Make this product," for example, "Make rhodopsin."
    Notice that genes being used in that way, as simple commands, will not produce
    the necessary flexibility, specificity, and nuances for coordinated cell functions,
    especially in multicellular organisms. What is'
