  md: '# Phrasing Questions by Writing Algorithms


    In which guidelines are provided for designing and outlining programs with two
    sequence aligning programs, BLAST and BLAT as examples.


    > The boundary is the best place for acquiring knowledge.

    —Paul Tillich (in Levy, 2003)


    # 11.1 The BLAST Algorithm


    In 1990, Stephen Altschul and colleagues published their algorithm for sequence
    comparisons. The query of BLAST, the Basic Local Alignment Search Tool, well-known
    to most researchers in molecular biology. The acronym has even entered into common
    use as a verb-as in: "Let’s BLAST that sequence and see what it is." The impetus
    for the creation of BLAST was a need for a rapid search tool for large data sets
    using inexpensive and desktop computers. The starting point for building any such
    program is an algorithm, essentially an outline or recipe of the procedure by
    which a particular problem will be solved. Most likely, Altschul, and colleagues
    spent many hours diagramming on the whiteboard and sketching on scrap paper. They
    may have experimented with several alternative approaches to the problem that
    did not succeed. Here is what they finally produced, paraphrased, simplified,
    and rendered us into a list.


    +   1. Input a query string.

    2. Break up the query string into smaller "words" of length W.

    3. Find all possible words of length W in the database.

    4. Compare each query word to word in the database, using a matrix in which exact
    matches for each letter are scored +5 and mismatches -4 (e.g., the query ATG matched
    with the word ATGG in the database would score a score of 5+5+5-4=11).

    5. Look at each score and save those that are high enough by some criterion.

    6. Try to improve each score by extending the length of the query word by one
    base at a time to see if the score improves.

    7. Keep extending the word in both directions, as long as the score keeps improving.

    8. Stop when the score no longer improves and report the results.'
