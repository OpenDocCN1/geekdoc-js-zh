    # Box 4.1 Why Repeats Are Interesting


    # Mirror Repeats (MR)


    With your thumbs touching, hold out your hands as though to grasp a thick rope.
    That is the model for all DNA binding proteins, the mirrored structure seeking
    out (or actually happening upon) a corresponding mirror-like sequence in the DNA.
    Interestingly, the mirror may be in the form of an reflecting sequence in this
    double stranded sequence


    ```

    ACGT-TGCA

    TGCA-ACGT

    ```


    # Inverted Repeats (IR)


    The reflecting sequences could be more of a funhouse mirror, a twisted helix-like,
    so that the double stranded sequence (called an inverted repeat) is


    ```

    TAGG-CCTA

    ATCC-GGAT

    ```


    Give that mirror sequence (both strands) a little twist at the pivot point and
    you have a straight mirror!


    ```

    TAGG-GGAT

    ATCC-CCTA

    ```


