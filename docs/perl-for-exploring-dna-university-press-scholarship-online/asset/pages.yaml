  md: '# Accessing Files of Sequences from Databases


    In which instructions are given for getting you to the vast databases of NCBI
    and coming away with all of the files of sequence you want.


    > [The London Library catalogue system] represents order—it is helpful, it leads
    you to what you were trying to find, and also to what you needed, but did not
    know you needed to find. It also has the delightful quality of heterogeneous things
    linked violently together by the arbitrary order of the alphabet.

    >--Byatt, 2001


    Sequence databases are the new museums of the genomic age. The grandest of them
    all publicly available at the National Center for Biotechnology Information (NCBI).
    The databases at NCBI are the best maintained, fastest, and most frequently updated
    of any public databases in existence. Scientists worldwide are many times fortunate
    that sequence information is so convenient and accessible, and most of all, free.
    Nightmare could be imagined in which major governments had declined to become
    involved with genomic sequence and therefore most sequence data were proprietary.


    Some of the problems with sequence databases, even those at NCBI, are similar
    to those encountered in the first museums dating from the seventeenth century.
    Referred to as Wunderkammers (Chambers of Wonders), early museums brought together
    diverse, curious, and rare objects collected worldwide. To organize and arrange
    the artifacts was not at all obvious. The rocks, bones, feathers, plants, holy
    relics, ancient coins, and much more (some items fragmentary) have been collected
    well ahead of any knowledge as to how they might be classified.


    Such are the challenges at NCBI when sequence data pours in various states of
    annotation and completion. The overall design of a database requires great insight
    and foresight as what classifications should be used; this is particularly difficult
    when there is so much about sequences that we do not understand. The designs of
    databases to store genes have fairly obvious, although not without pitfalls introns
    and exons are identified and their functions deciphered and pseudogenes, horizontal
    transfer, and transposons must be dealt with. The classification of intergenic
    sequences is still in its inception because so little is known of what the relationships
    and functions will be. Some aspects of intergenic regions may be true mysteries
    (at least for us) that they might not be deciphered in our lifetime.


    An interesting case in point was the enormous influx of data entered at NCBI from
    the Beagle-like expedition of J. Craig Venter and his team on the Sorcerer II.
    They circumnavigated the globe, pulling up water samples every 200 miles. From
    those samples, the team sequenced all of the microbial DNA they could find. Most
    of the sequences were new and not readily classified with the rest of the prokaryotes,'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'an indication of how little we know the open ocean. Therefore sequences by
    the thousands received identifiers as vague as “Sargasso Sea,” indicating that
    the DNA had been found, but nothing more. Soon after, researchers (including Venter’s
    colleagues) began to complain that BLAST hits at NCBI were coming with long, uninformative
    lists of “Unidentified Sargasso Bacteria.” A temporary solution was to segregate
    the Sorcerer II from the usual BLAST search files at least until further information
    could be derived.


    An intriguing philosophical issue encountered at both museums and genomic databases
    is the lack of singularity of the items in store. We know of course that a single
    stuffed and mounted three-toothed sloth on at the American Museum of Natural History
    is not “the” three-toothed sloth, nor the “average” three-toothed sloth. It is
    just one specimen of an individual unlucky enough to be caught, stuffed, and mounted.
    If we find a genome for *Bradypus variegatus* (three-toothed sloth) at NCBI, we
    should understand that it is not the genome but merely one variant. The point
    is made even more emphatically when we realize that individual humans and dogs
    (with names, personalities, and predispositions to diseases) who were the first
    to have sequenced DNA achieved at NCBI. These individuals have come to represent
    a genome but certainly not the human and canine genomes at NCBI.


    The lack of an Aristotelian ideal or universal essence of a three-toothed sloth
    or any organism is taken for granted by most biologists. In fact, as evolutionists
    know, variability is much more interesting. Even species are not taken as averages
    or ideals of a particular species. However, for some time in the history of genome
    research there was a prevalent misunderstanding of DNA—that however there was
    something singular and essential in a DNA sequence that would make it a sort of
    commodity. That aroused the great fear over the patenting and ownership of genes,
    especially in the legal sense, has not resulted in any obvious profits. If there
    were a truly unique sequence pertaining to, for example, colon cancer, the patent
    lawyers would have something tangible on which to litigate. However, genes are
    not unique sequences but a singular sequence submitted to NCBI and precisely recorded
    is a snapshot of a moving target. A gene is a continuum of similar sequences within
    which we can say we have a particular range of function and beyond which we are
    the territory of other genes or less related. A gene is a concept of human construction
    in its boundaries continually reflect what humans consider to relevant and nothing
    more. The situation is much fuzzier for the sequences between the genes. The good
    news, of course, is all of the work that needs to be done on genomic databases
    and the central position of computational analyses accomplishing it.


    Other challenges for the museum-like, archival databases of NCBI exist partly
    because of the limitations of human observers. We can readily see data crammed
    in three dimensions. With the addition of color and style or even some type of
    movement we could add dimensions to our capabilities of seeing relationships.
    However, the intricacies of the databases at NCBI are far greater in dimension
    than what could be comfortably comprehended (by a human) at all. Therefore, queries
    must necessarily be limited to a few parameters, and (alas) by assumptions and
