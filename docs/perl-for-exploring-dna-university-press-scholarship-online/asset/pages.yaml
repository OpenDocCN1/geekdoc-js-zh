  md: '# Good Practices


    In the previous example, notice that the print function outputs the values stored
    in the variables $someMotif and $motifLength, not their names. The print function
    interprets all the variables within the double quotes and substitutes the number
    held in the respective variable to the message to be printed. The print function
    also allows you to enclose the string in single quotes; however, within single
    quotes your variables will not be converted to their values. This is a case where
    you would not want use single quotes because they do not interpret variables within
    the string and give you literally what you single quote. The difference is shown
    below.


    ```

    #!/usr/bin/perl

    use strict;

    use warnings;


    my $someMotif;

    $someMotif = "ACGTTACGCG";

    my $motifLength = length($someMotif);


    # variables are interpreted within double-quotes; values printed

    print "$someMotif has a length of $motifLength (bp).\n\n";n

    # variables are NOT interpreted within single-quotes

    print ''\$someMotif has a length of $motifLength (bp).\n\n'';

    ```


    The motif ACGTTACGCG has a length of 14 (bp).

    The motif $someMotif has a length of $motifLength (bp).\\n\n


    # index(STRING, SUBSTRING [ , POSITION])


    The index function will return the location of the first instance of a known target
    STRING within a larger STRING. For example, the index function could help you
    locate the first adenine (A) nucleotide that occurs in a GC-sequence or the first
    ATG codon that for the amino methionine in a putative coding region. In Perl,
    all strings have numbered locations, as shown in the following string. Note that
    the initial character is numbered beginning with zero (0). The index function
    returns the integer location or negative one (-1) if the target sequence is not
    found.


    ```

    "ACGTTACG"

    012345678

    ```


    Thus, the first cytosine (C) nucleotide is located in position 1, whereas the
    first occurrence of the dimer GC is in location 2.'
