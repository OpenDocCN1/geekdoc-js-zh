    In programming language, testing for mutually exclusive situations are referred
    to as conditional and repetitional control, respectively. Most programming languages
    provide the programmer (you) with three types of control: (1) sequential (one
    instruction after another from top to bottom), (2) conditional (if-else), and
    (3) repetition (while). Up to this point, all your Perl programs have used only
    sequential control; that is, statements are executed sequentially, from the top
    of your program to the bottom. This chapter introduces you to the other two types
    of control, conditional and repetition. All programs from this point will be creative
    blends of these three types of control structures.'
