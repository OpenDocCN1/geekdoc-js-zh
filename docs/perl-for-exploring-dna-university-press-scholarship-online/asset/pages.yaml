  md: '# Preface


    This book is an introduction to the Perl programming language for the exploration
    of biological sequences (DNA and protein) with a focus on DNA for most examples.
    DNA can be depicted as a linear map of As, Cs, Gs, and Ts (the direct output of
    any DNA sequencing project) only hints at the virtual contours and crevices, twist
    and kinks, loops and nodes that comprise the structure and function of the extraordinary
    double helix. An expedition into territory, still mostly unknown, can be approached
    in two major venues, interdependent with each other.


    The first is with the repertoire of techniques that is molecular biology. By those
    methods, we know genes and have had a good understanding of how they code for
    proteins since the early 1960s. We also know many short sequences proximal to
    the genes with specific functions by which genes are regulated.


    The second is with the set of computational tools that comprise the emerging fields
    of genomics (for DNA) and proteomics (for protein). The approach is like large-scale,
    molecular code-breaking, a search for revealing patterns that suggest meaning.
    "scaled-up" experiments in molecular biology are piecemeal, one sequence at a
    time. Wet lab techniques, even if organized and accelerated by their computers,
    are limited by the speed of the robot and the incubation times for the myriad
    regions. Computational methods are orders of magnitude faster and allow for exhaustive,
    repetitive, tireless searches and meticulous collecting and annotation limited
    only by the imaginations and wills of the programmers.


    In large-scale, comprehensive genomics (or proteomics) project, molecular programs
    are biological and computational analyses are co-dependent. Computational programs
    are the lightning-fast map readers, flying across miles of tedious As, Cs, Gs,
    and Ts relentlessly collecting and "imaging" every pattern. Molecular biology
    provides the "ground truth" because many patterns can be easily imagined but to
    be false leads, more than random. Computation has the power to provide hypotheses
    for molecular biology. For example, "we (the computers) have found an abundance
    of short sequences GTACGTCAC upstream of some related genes. We hypothesize that
    the sequence may be essential in regulating these genes." Molecular biology completes
    this with a mutational study by which subtle point-point changes in GTACGTCAC
    indeed do have significant effects. Then computation completes the loop by allowing
    over more lightning-fast, relentless collecting of every possible permutation
    of GTACGTCAC. Maybe patterns (hypotheses) are to be found, but if not, seconds
    or minutes will have last!


    Perl has been the language of choice when working with, searching through, and
    identifying patterns in text. DNA and protein sequence analysis is all about strings
    (for example, linear map of As, Cs, Gs, and Ts) so it is not surprising that Perl
    has emerged as the programming language of choice for researchers in'
