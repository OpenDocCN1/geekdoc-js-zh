  md: "# Good Practices\n\nIt is considered wise practice to write documentation (#\
    \ comments) for each of your subroutines. Your documentation should give a short\
    \ SUMMARY of what the subroutine does (not how it does), a description of each\
    \ of the items that are IN to the subroutine, as well as a description of the\
    \ value that is RETURN. In addition to the English descriptions, we provide a\
    \ sample style that makes your subroutines stand out as independent sections of\
    \ code (e.g., like a file in a filing cabinet) to facilitate the copy-and-paste\
    \ use of the subroutine in later programs.\n\n```\n---------------------------\n\
    # complement \\\n---------------------------\n# SUMMARY: This subroutine accepts\
    \ a sequence of DNA and\n#       returns the complement sequence of DNA.\n# IN:\
    \ a sequence of DNA (string scalar)\n# RETURNS: the complementary sequence (string\
    \ scalar)\nsub complement\n{\n    my $dna = shift(@_); // shift the string value\
    \ sent\n    my $antiSense = $dna;\n    $antiSense =~ tr/ACGTacgt/TGCatca/\n  \
    \  return $antiSense;\n}\n--------------------------\n```\n\nWe come across an\
    \ amazingly exhaustive document from Donald Eastlake, Carl Uno Manros, and Eric\
    \ Raymond (The Internet Society) on the etymology of the word foo (http://www.faqs.org/rfc/3092.html).\
    \ Foo and its extension foobar are used as the diminutive form of bar. Foo and\
    \ `bar` are temporary default names for variables, introduced on the fly and before\
    \ any thought could go into assigning a more useful name. Many computer scientists\
    \ use foo and foobar without knowing much or anything about history. First-time\
    \ programmers may be puzzled by the sudden appearance of such metasyactic (lacking\
    \ proper definition) variables. Other such variables include quis, quux, grault,\
    \ waldo, fred, and xxyzy.\n\nFoo may have originated in the 1930s as a comic strip\
    \ phrase, sounding vaguely Yiddish or even Chinese. Foo appeared often on signs\
    \ and license plates in Bill Holman’s “Smoky Stover” comic as well as in Walt\
    \ Kelly’s “Pogo.” As a result, foo became a trendy slang word in the 1930s. Then\
    \ it seems to have been picked up by the American military in WW II.\n\n# Box\
    \ 7.2 The Etymology of the Metasyactic Variable Foobar"
