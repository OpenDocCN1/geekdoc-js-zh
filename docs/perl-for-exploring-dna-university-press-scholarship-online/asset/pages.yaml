    \ will be joined (nothing, the empty string) into one string.\n\n```\n# join individual\
    \ letters into a sequence\n$randomSequence = join('',', @shuffledNucleotides);\n\
    ```\n\n# 9.10 Sorting Arrays\n\nsort [USER_SUBROUTINE_NAME] LIST\nThe sort function\
    \ arranges the values found in LIST and returns the list in sorted fashion. By\
    \ default, the sort function uses standard string comparisons to determine if\
    \ one item should appear before another. Thus when the items you want are not\
    \ strings, additional care must be taken.\n\n# 9.10.1 Sorting Arrays of Strings\n\
    \nThe most straightforward use of sort is the sorting of string values within\
    \ an array."
