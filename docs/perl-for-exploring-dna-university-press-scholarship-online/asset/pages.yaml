  md: "# 12.4.3 Positive Look Ahead\n\nIf we wanted to find all the locations where\
    \ AAACGG actually is followed by a stop codon, we could use a zero-width positive\
    \ look-ahead assertion. The syntax for a positive look-ahead is: (?=pattern).\
    \ Again, the parentheses will not capture anything.\n\n```\n# Positive Look-Ahead\n\
    while ($seq =~ m/)\n    AAA # Asparagine, followed by\n    CGG # Arginine, followed\
    \ by\n    (?=TAG|TGA|TAA) # positive look-ahead\n    /xg;\n```\n\n# 12.5 Summary\
    \ of Regular Expression Syntax\n\n| Regex | Meaning |\n|---|---|\n| TATA | match\
    \ four consecutive letters, TATA |\n| TAG|TGA|TAA | match TAG or TGA or TAA |\n\
    | . | match any character but not a newline character |\n| .. | match any two\
    \ characters (independently, not necessarily the same character) |\n| (.) | capture\
    \ (remember) and match any character |\n| .* | greedy match any character 0 or\
    \ more times (each is independent of others) |\n| (*) | capture and greedy match\
    \ any character 0 or more times |\n| (.*?) | capture and nongreedy match any character\
    \ 0 or more times |\n| .+ | greedy match any character 1 or more times (each is\
    \ independent of others) |\n| (.+) | capture and greedy match any character 1\
    \ or more times |\n| (.+?) | capture and nongreedy, match any character 1 or more\
    \ times |"
