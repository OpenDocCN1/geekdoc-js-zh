  md: "# Box 9.1 Favorite Gene\n\nScaled-up, public, and private gene-finding programs\
    \ in particular and genome analysis in general provide much of the annotation\
    \ at databases as those found at NCBI. Many genome search projects are motivated\
    \ by commercial or political interests. However, details and nuances are easily\
    \ missed by comprehensive programming approaches. The sheer volume of data precludes\
    \ lingering and reflection. That is the reason, in many cases, the annotation\
    \ and analysis of genes (and proteins) and their associated promoter sequences\
    \ have been done on a grassroots level by the very labs that already have a focus\
    \ and vested interest in them, such as yours.\n\nA logical place in bioinformatics\
    \ is with your own favorite genes. (We call *favGenes* after a program we write\
    \ to find them quickly in large databases.) By begin taking ownership of your\
    \ sequences by going to NCBI and downloading the files (see chapter 8) and then\
    \ do the commercial projects cannot afford to explore: the sequences, motivated\
    \ by nothing more than curiosity. Who to do that but you? A sequence annotation\
    \ tells a story of its own about the knowledge base, focus, and priorities of\
    \ the annotator.\n\nConsider printing your favorite genes in some linear format\
    \ that can be taped up the wall of a long corridor or around the walls of your\
    \ lab. To get to work with colored markers to do some hand annotation, perhaps\
    \ marking the beginnings and ends of the genes. In a way, you are creating your\
    \ meta-version of the sequence with layers of new potential information, perhaps\
    \ noticed for the first time by you. Obviously, you should do some analyses and\
    \ annotations with the wonderful public software available at NCBI, such as BLAST.\
    \ However, by learning some Perl, you have the opportunity to take the analyses\
    \ much further. Design and implement your own dream software for searching the\
    \ kinds of motifs, patterns, and associations that interest you.\n\n# 9.6 Determining\
    \ the Number of Elements in an Array\n\nOnce an array is loaded with data, you\
    \ will often need to know how many individual elements are held in it. For example,\
    \ if you glob a directory of files into an array, you'll probably want to report\
    \ the number of files in your experiment. A scalar evaluation of the name of an\
    \ array will result in its length, or the number of elements in the array.\n\n\
    ```\n @bacteriaFilenames; # an array of filenames\n@bacteriaFilenames = glob(\"\
    BacteriaGenomes/*.fna\");\nmy $lengthArray = scalar(@bacteriaFilenames);\nprint\
