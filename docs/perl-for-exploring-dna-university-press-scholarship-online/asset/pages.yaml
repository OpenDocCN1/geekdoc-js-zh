    use List::Util qw(first max maxstr minstr reduce shuffle sum);

    ```


    # DESCRIPTION


    List::Util contains a selection of subroutines that people have expressed would
    be nice to have in the perl core, but the usage would not be high enough to warrant
    the use of a keyword, and the size is so small that being individual extensions
    would be wasteful.


    By default List::Util does not export subroutines. The subroutines defined are


    Also, you can open a new terminal shell and use the perdoc command supplied with
    perl. On the command line, enter:


    ```

    perdoc List::Util

    ```


    If the module can''t be found, you''ll be given an error message.


    # 14.1.1 List::Util


    The List::Util module provides a suite of functionality for working with lists.
    You could write most (if not all) of these functions as your subroutines, but
    don''t do that, for two reasons. First, these functions have stood a test of time
    and were deemed correct and valid by the larger Perl community. Second, these
    functions are implemented to be very efficient.


    For example, in List::Util, a max function will return the largest value in an
    array of values, where largest is defined by the greater than numerical comparison
    operator (>). If you do not export the function, it may be called with its fully
    qualified name, as shown below.


    ```

    use strict;

    use warnings;

    use List::Util; # use module, no functions exported

    my @redSignals = (1500, 1246, 1099, 2798, 1003);

    my $largest;

    # must call the function in the module using

    # the fully qualified name

    $largest = List::Util::max( @redSignals );

    print "The largest red signal is: $largest \n";

    ```'
