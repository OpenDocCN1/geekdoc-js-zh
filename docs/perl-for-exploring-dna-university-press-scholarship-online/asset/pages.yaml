  md: '# Arrays 159


    Note because array subscripts begin with zero, the length of an array is always
    one larger than the subscript of the last cell in the array that is filled with
    data. The exact value of the subscript of an array can be obtained with $arrayName,
    for example, $bacteriaFilenames evaluates to the value of the subscript of the
    last element in the array @bacteriaFilenames. For arrays that contain data, the
    last subscript in an array is always one less than the length of the array; this
    is the following is true:


    ```

    scalar(@arrayName) == ($@arrayName + 1 )

    ```


    The following example manually fills a small array and then shows an example of
    determining the length and ending subscript of an array.


    ```

    my @patronSaints; # an array of names of our "patron saints"

    @patronSaints = ("Chargaff","Franklin","Kent","Wall");


    | Chargaff | Franklin | Kent | Wall |

    | 0 | 1 | 2 | 3 |


    my $lengthOfArray = scalar(@patronSaints);

    my $lastSubscript = $@patronSaints;

    print "The length of the array is: $lengthOfArray\nn";nprint "The last subscript
    in the array is: $lastSubscript\n";

    ```


    ![](img/af031a6fb4441852f776d419466cf3a5_172_0.png)


    # 9.7 Working with Arrays Using Subscripts


    In addition to using Perl''s foreach loop for iterating through all the elements
    in an array, you will often need to access individual elements, iterate through
    only some of the elements by using the subscript (index) of individual cells,
    or take a slice of an array such as the third, fourth, and fifth elements.

    For example, assume an array @bacteriaFilenames is filled with file names.'
