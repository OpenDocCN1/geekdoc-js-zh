    # 6.1 Simple statements versus Controlled Statements


    So far, you have been issuing simple commands in Perl, and as long as the spelling
    and syntax have been correct, you have been obeyed. For example, strings of DNA
    sequences have been sought, found, and manipulated in various ways. What are missing
    right now are certain subtleties that enable you to handle exclusive events and
    relieve you of the chore of having to issue the same Perl statements over and
