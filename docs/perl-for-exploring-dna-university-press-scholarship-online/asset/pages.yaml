    # 10.4.3 Sorting a Hash by Values


    As shown in 10.4.2, the keys function in conjunction with the sort function can
    create an alphabetically sorted list of keys. However, as described in section
    9.10, you must write your own comparison statements to sort by a more complicated
    definition, including the case where you want to sort by the values in the hash.
    The following algorithm provides an outline of the steps needed to sort a hash
    by its values.


    +   1. Form a list of all the keys in your hash (e.g., keys %hash).

    2. In the block where sorting of two elements is performed, compare two hash values
    based on the keys use cmp if comparing strings and <= if comparing integers. Recall
    that sorting in increasing order requires a definition of `$hash{a} comes before
    $hash{b}` (e.g., `$hash{a} cmp $hash{b}` if comparing strings), while sorting
    in decreasing order requires a definition of `$hash{b} cmp $hash{a}`.

    3. Store the hash keys in an array; the initial element in the array of keys will
    hold the key that corresponds to the value in the hash that should come first
    based on the sorting.

    4. Traverse the array of keys to access the hash values in sorted order.


    The following program can be used to sort a hash by its values, for example, sorting
    by the names of the amino acids. Again, note that the criterion for sorting is
    based on the comparison of the values, but we will store the keys that are associated
    with those sorted values.


    ```

    # (1) using all the hash keys

    # (2) sort by hash VALUES (use cmp since values are strings)

    # (3) store keys in an array

    my @keys_sortedByValue;

    ```'
