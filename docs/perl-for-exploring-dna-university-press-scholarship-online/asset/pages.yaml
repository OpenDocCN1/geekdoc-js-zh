  md: '```

    #!/usr/bin/perl

    use strict;

    use warnings;

    # FRACTIONAL values

    my $n1 = rand( 1 ); # returns fraction: 0 <= value < 1

    my $n2 = rand; # same as above

    # INTEGER values

    my $roll = int(rand(6)); # returns INTEGER: 0 <= value <= 5

    my $nuc = int(rand(4)); # returns INTEGER: 0 <= value <= 3


    print "n1 = $n1 \n";nprint "n2 = $n2 \n";nprint "roll = $roll \n";nprint "nuc
    = $nuc \n";

    ```


    One possible output of these random values is shown below. Of course, if you run
    this program again, you will get a different set of numbers. Notice how int is
    required if you expect integer values. The int operator truncates fractional values,
    for example, int(2.9) becomes 2.


    n1 = 0.514883738084794

    n2 = 0.23388372487122

    roll = 2

    nuc = 1


    Also note that rand returns values up but not including the value used as an argument.
    In the example of rolling a die, note that you must add one to your result because
    you expect numbers in the range of one to six, inclusive.


    ```

    my $roll = int(rand(6)) + 1; # simulate a die: 1 <= N <= 6

    ```


