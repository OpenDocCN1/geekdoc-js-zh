  md: "```\nelsif ( $a > $b )\n{\n    return 1; # means $b should come before $a\n\
    } else if $a == $b\n{\n    return 0; # otherwise the two items are the same\n\
    }\n```\n\nThe use of $a and $b in the numerically_the_long_way subroutine requires\
    \ some faith on your part. At this point, it would be reasonable for you to ask,\
    \ “But where are $a and $b declared? Where do the values in $a and $b come? Why\
    \ does returning a minus (-1) signal that the value in $a should come before the\
    \ value in $b?” Good questions.\nYou called Perl's sort function, it repeatedly\
    \ selects two items from the list or array to compare and assigns those two values\
    \ to the globally-defined variables $a and $b. “Globally defined” means the variables\
    \ $a and $b are defined elsewhere, specifically in a built-in module (see chapter\
    \ 14) containing the sort function. The variables $a and $b are actually aliases\
    \ to the real values, and you should never change your variables. The sort function\
    \ calls your subroutine repeatedly, time setting the next two values to compare\
    \ into $a and $b. For every two values sent to your subroutine, the sort waits\
    \ for a value to indicate the result of the comparison. The use of -1, 1, and\
    \ 0 for return values are part of a standard definition when comparing items;\
    \ you cannot alter this definition when using sort. In short, your subroutine\
    \ (e.g. numerically_the_long_way) defines what if $a is less than $b, sort expects\
    \ that your subroutine will return a -1. One element should precede another element\
    \ and returns the appropriate integer.\nPerl's comparison relational operators,\
    \ <= for numbers and cmp for strings, automatically return -1, 1, and 0 according\
    \ to the standard definition of comparing two items. Thus we can rewrite the subroutine\
