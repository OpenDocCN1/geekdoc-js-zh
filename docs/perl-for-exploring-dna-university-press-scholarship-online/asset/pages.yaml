    \ As described earlier, when the while test evaluates to false, the loop stops\
    \ and control of the program continues below the while loop to the statement that\
    \ outputs \"Blastoff!\"\n\n# 6.8.2 while and Regex: Searching for All GC-Rich\
    \ Motifs\n\nWhile loops can be used repeatedly to search for matches (@m) in strings.\
    \ Previously, we used if-else statements to search for one match: Is it, or is\
    \ it not? But what if you want to continue searching for other matches, for example,\
    \ the sequence after you find the first and each match? The while statement in\
    \ conjunction with the match operator is what we need.\n\nIn general, repeatedly\
    \ searching for matches in a string uses the following algorithm (recipe), presented\
    \ here in pseudo-code (that is, not quite English, not quite Perl).\n\n```\nwhile\
    \ (more DNA to search, look for the next match)\n    # ok, we found a match\n\
    \    (a) save the match\n    (b) note the location where it was found\n# end of\
    \ loop, return above to while statement\n    # but begin next search after the\
    \ match just found\n```\n\nThis algorithm translated into Perl, in this case searching\
