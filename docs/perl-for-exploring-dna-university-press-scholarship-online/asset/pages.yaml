    # 13.3 Shuffling an Array to Get a Random Sequence


    Another method to generate a random sequence uses an and fewer lines of code to
    take any actual sequence and shuffle it a deck of cards. This maintains the same
    proportions of A, Cs, Gs, and Ts. In this solution, individual nucleotides are
    first stored in cells of an array. Using a variant of an algorithm called the
    Fisher-Yates Shuffle, random pairs of nucleotides in an array are swapped over
    and over, shuffling the order.

    The code to shuffle an array actually comes with Perl in a module. You just need
    to explicitly ask to use the module that contains the shuffle function (List::Util).
    Chapter 14 covers modules in some depth, but if you''ll exceed the forward reference,
    the following example shows the shuffle function in action followed by a sample
    output.


    ```

    use List::Util `shuffle`;


    print "Using List::Util''s shuffle...\n"

    print "ACTUAL Sequence: $sequence\n"


    # split on the empty pattern; returns individual letters

    my @nucl = split ( //, $sequence );


    # call shuffle and store into a new array

    my @shuffledNuc = shuffle (@nucl);


    # join individual letters into our new random sequence

    $randomSequence = join ('','', @shuffledNuc);


    print "RANDOM Sequence: $randomSequence\n";

    ```'
