  md: '# Regular Expressions Revisited


    In some refinements will be introduced by which your regular expressions might
    be restrained from their customary greedy and exuberant activities. This is introductory
    obedience school for regular expressions.


    Some people, when confronted with a problem, think: “I know, I’ll use regular
    expressions.” Now they have two problems.


    > -Jamie Zawinski (in Conway, 2005)


    Regular expressions (regex), introduced in chapters 4 and 6, deserve a little
    revisit. Before reading this chapter, you may want to review some aspects of regex
    syntax from those earlier chapters. Like an overgrown golden retriever puppy,
    regexes are lots of fun and eager to please. They are also destructive and a bit
    dangerous if trained incorrectly. Even professional programmers use regexes with
    caution.


    Let’s say a big, fluffy, golden retriever pup been sent out to fetch the news-paper.
    It fetches every single newspaper in the neighborhood, chews up some of them,
    leaves others in the bushes, and brings the rest home. All there is to say that
    regexes are greedy in their eagerness to please. If you send one out to collect
    sequences of a particular length, you may expect to get the best sequence regex
    could find, though you might have hoping for something more subtle. This chapter
    shows you how to give your regexes some obedience training. If you’re looking
    for a particular sort of sequence in a big file, what you probably want is the
    first and every subsequent occurrence of the pattern and not the single longest
    sequence regex could retrieve for.


    Another challenge with regular expressions is that they can be difficult to read
    if they are written out in one dense line of code. This chapter introduces the
    practice of splitting up a big regex into lots of little lines and commenting
    each section. Regex syntax is not Perl syntax; it is far from it. It is like inserting
    lines of Greek or Chinese into English text. In the examples to follow, we make
    lavish use of comments to help the reader translate those regex.


