    led to an appreciation that occurred time. As an experienced teacher of graduate
    computer science courses at all levels, Mark explains and interprets syntax clearly
    and knows many of the classroom tricks for presenting difficult material. He is
    also a good predictor of the pitfalls that await novice programmers. Mark wrote
