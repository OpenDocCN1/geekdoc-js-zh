  md: '# 11.5 DNA Dictionary


    Motivated by our collective pleasure when using the online Oxford English Dictionary,
    or motif lexicon. We decided to build a DNA Dictionary, or motif to respond to
    a user''s query (a short DNA motif of interest) with a rich set of annotation,
    including the type of motif (e.g., direct, mirror, inverted or versatile repeat),
    all starting base pair (bp) locations of that motif within the genome, and links
    to information for upstream and downstream genes. Significant constraints included
    that a user could enter any motif of length, and the tool was Web-based, the search
    and response time had to be sufficiently fast. How could we efficiently determine
    every location of any possible motif in an entire genome?


    As the programmers in our group considered various strategies, the biologist in
    the group went to the whiteboard and shared her algorithm, "Search and save (cache)
    every starting location of every 4-mer, 5-mer, 6-mer, and 7-mer and concatenate
    the starting locations." (Insert silence from here.)


    Here is how it was implemented. For every genome in the motif lexicon, we cached
    the starting locations of all 4 to 7-mers. An example of some possible 4-mers
    is shown below:


    | Genome: | AAAAAACAAACG. |

    | --- | --- |

    | | 1234567890... |


    Starting locations for each 4-mer:


    | AAAA | AAAC | AACA | ACAA |

    | --- | --- | --- | --- |

    | 1 | 3 | 4 | 5 |

    | 2 | : | : | : |

    | 7 | : | : | : |

    | CAAA | AAAT | AATC | ATCG |

    | 6 | 8 | 9 | 10 |

    | : | : | : | : |

    | | : | : | : |


    User Query: "Look up the motif—AAAACAAA "


    Algorithm (using only 4-mers and liberties taken with variable names to match
    the example)'
