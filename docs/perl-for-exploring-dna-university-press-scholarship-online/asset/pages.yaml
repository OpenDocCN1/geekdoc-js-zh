    \ and so on.\n\n# 6.5 Logical Connections (and, or, or not)\n\nIn addition to\
    \ the logical comparison operators (e.g., ==, !=, eq, etc.), Perl provides you\
    \ with three logical connectors (and, or, not) that enable you to build more sophisticated\
    \ if-else tests. For example, if you were checking for 10-mers or 12-mers, you\
    \ could make the following test:\n\n```\nif ($lengthString == 10) or ($lengthString\
    \ == 12) {\n    print \"Another 10-mer or 12-mer: $string\\n\";\n} else {\n  \
    \  print \"$string is NOT of length 10 or 12.\\n\";\n}\n```\n\nWhen using logical\
    \ or, only one of the tests need be true for the entire comparison to result in\
    \ true. In some cases, both tests may be true when using or, although in this\
    \ example, they can't be true. Why?\n\nWhen you make a logical comparison with\
    \ two the tests must be true for the entire comparison to be true, we use and.\
    \ For example, if you wanted to find all sequences with lengths between 10 and\
    \ 12, algebraically you would write:\n\n10 <= 12\n\nBecause we are asking two\
    \ separate questions, \"Is 10 less than or equal to the length?\" and \"Is the\
    \ length less or equal to 12?\", we must use a logical and to connect these two\
    \ separate tests."
