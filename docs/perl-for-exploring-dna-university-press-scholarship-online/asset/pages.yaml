    # 3.6.4 s: The Substitution Pattern Matching Operator


    ■ /PATTERN/REPLACEMENT/[option]


    The substitution (s) operator searches a given string for a particular PATTERN
    and replaces the characters in the PATTERN with those from the REPLACEMENT. This
    operator returns the number of substitutions made. Of particular significance
    for is that this can be a regular expression (chapter 4), thus this operator provides
    a rich set of possibilities for crafting patterns that you need to find and replace
    with alternate characters. Additionally, a number of options are available when
    performing substitution, including an ability to globally (g) replace all occurrences
    of the PATTERN or perform case-sensitive (i) pattern matching.


    Note that a specific substitution will inevitably occur within larger Perl programs
    that you learn to write. For each of the examples that follow, we assume a specific
    context to keep the focus on how to use the substitution operator.


    The most straightforward substitutions are when you know the exact PATTERN you
    wish to replace. For example, perhaps you''d like to highlight the first putative
    codon (ATG) from a sequence by making it appear uppercase.


    # Good Practices


    Because the substitution (s) operator is a "destructive" operator—that is, it
    permanently alters the string—we will make a copy of the original string prior
    to the substitution and perform the substitution on the copy. It is often the
    case that you''ll want the original version later so making a copy and operating
    on the copy is a wise move.


    ```

    my $someGene; # upstream and beginning of a coding region

    my $copyGene; # working copy of the region


    $someGene = "cgcataatgtctcggcccta"


    print "Original: $someGene \n";


    # highlight start codon

    $copyGene = $someGene;

    $copyGene =~ s/at/ATG/; # substitute upper for lower case

    ```


