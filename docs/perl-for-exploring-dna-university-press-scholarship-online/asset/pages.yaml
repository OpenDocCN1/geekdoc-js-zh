  md: '# Regular Expressions Revisited


    automatically captures (stores) the result of the pattern within the parentheses
    and the result of that particular match can be recalled either later within the
    same regex or after the regex is complete. For example, in the previous sections,
    we used \2 within the regex to recall the second captured item (the first nucleotide
    in a mirror repeat) and we used \1 in a special Perl to recall the entire pattern
    that matched. Grouping and capturing both use parentheses, there exists a special
    case that uses parentheses to group sections of the regex but does not capture
    the pattern that matches. In certain cases, you need to use parentheses to group
    part of the regex together, but you do not need to recall the result of that part
    of the regex, so you want to avoid the overhead of storing the result. In other
    words, "match the pattern in this group, but don''t remember the result." The
    syntax for using a noncapturing group is (?:-pattern).


    # 12.3.1 Is this Open Reading Frame?


    Assume you are scanning hundreds of newly sequenced DNA strings and in preliminary
    analyses you ask the question, "Is this sequence open reading frame?" More specifically,
    you would like to know if the sequence has a valid open reading frame within a
    start and stop codon. You are not necessarily interested at that time in the particular
    codons, that is, you do not need to store the start or stop codon nor the codons
    between the start and the stop. Thus, you do not need to capture any of your matches,
    but you are just interested in whether a match occurs.


    It is worth mentioning that dealing with open reading frames in general and finding
    genes is very complicated. To keep the focus on the noncapturing groups, this
    example makes a number of assumptions, such as ignoring the presence of exons.
    If you wish, imagine we are working with a prokaryotic sequence or are starting
    with cDNA.


    To match an open reading frame but not capture the codons that make it up, a regex
    must match a start codon followed by any number of three-nucleotide codons followed
    by one of the three possible stop codons. Because we are only interested in the
    presence of a match and the sequence might be very large, capturing the codons
    would be a waste of memory. The following regex uses noncapturing parentheses
    to group the start and all intermediate groups of three nucleotides.


    | AATGGCTACAGAATGA |


    | ATG | GCT | ACA | GAA | TGA |


    ```

    # Non-Capturing Groups

    # Is this an open reading frame? (Yes/No)

    my $seq = "AATGGCTACAGAATGA";

    ```'
