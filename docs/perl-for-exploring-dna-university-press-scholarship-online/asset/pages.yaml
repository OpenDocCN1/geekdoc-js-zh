    # ## This Book Is Not


    This is not a direct route to complete mastery of Perl; this is not a comprehensive
    treatise on all things Perl; you will not become a wizard or guru unless you are
    inspired to go much further than the contents of this book. Biologists, we are
    not urging you to quit your day job and become a programmer. We argue that there
