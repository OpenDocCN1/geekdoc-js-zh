  md: "# Perl for Exploring DNA\n\nslice returns a list of values, presumably more\
    \ than one, the left-hand side of your assignment statement must be ready to store\
    \ multiple values. In Perl, when paren-these surround a group of variables, the\
    \ group is referred to as a list, such as:\n\n```\n($second, $third)\n```\n\n\
    When used on the left-hand side of an assignment operator (=), the variables in\
    \ the list are assigned the items from the list on the right-hand side, for example,\
    \ a slice of two values from an array such as shown here:\n\n```\n# a slice of\
    \ the second and third elements in the array\nmy @patronSaints; # an array of\
    \ names of our \"patron saints\"\n@patronSaints = (\"Chargaff\", \"Franklin\"\
    , \"Kent\", \"Wall\");\n    ($second, $third) = @patronSaints[1..2];\n\n\"Chargaff\"\
    \ \"Franklin\" \"Kent\" \"Wall\"\n0 1 2 3\n```\n\nSlicing a small number of variables\
    \ works fine; however, if you need to take a large slice from an array, setting\
    \ up individual variables to catch each of the items from the slice is prohibitive.\
    \ Similar to our original motivation for needing arrays, we can use an array on\
    \ the left-hand side of the assignment to catch a large slice from an array. The\
    \ following lines of Perl store a slice of the elements from subscript 10 to 24\
    \ from another array using only one line of code.\n\n```\n# store a slice of one\
    \ array into another array\nmy @smallArray = @bigArray[10..24];\n```\n\n# 9.7.3\
    \ Accessing Every nth Element in an Array\n\nIf you only need to process every\
    \ nth element in an array (for example, every subscript that is odd or every third,\
    \ fourth, fifth, or nth element), you need to return to the while loop. For example,\
    \ suppose you need to process every third element starting at subscript 10 through\
    \ 50. The foreach loop assumes an integer +1 increase between each element in\
    \ a list of values to try (e.g., 5..10 means 5, 6, 7, 8, 9, and 10), so it will\
    \ not enable you to efficiently jump to every third element. On the other hand,\
    \ a while loop requires you to control the increment of your index variable, a\
    \ jump of three ($i + 3) is easily handled, as shown next."
