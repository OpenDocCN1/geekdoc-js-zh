    One of the tools that our genomics research group has built is a motif lexicon
    "dictionary" (Dyer et al., 2004). The user selects a genome and enters a motif
    of interest, for instance, ACGT, and the motif lexicon returns a rich set of annotation
    about that motif including all locations (bp), links to upstream and downstream
    genes for each location, and statistical information about the likelihood of finding
    this motif. The following example highlights the use of the mathematical functions
    log() and exp() in the context of computing how likely it is to find a motif of
    interest when working with a specific A-C-G-T distribution.


    As shown in chapter 3, the transliterate (tr) function can be used to count the
    number of nucleotides


    ```

    # determine the length of the DNA sequence

    $sequenceLength = length($sequence);

    # number of Adenines (A), etc...

    $numA = ($sequence =~ tr/A/A/);

    $numC = ($sequence =~ tr/C/C/);

    $numG = ($sequence =~ tr/G/G/);

    $numT = ($sequence =~ tr/T/T/);

    ```


    Using these newly computed frequency counts and the overall length of the sequence,
    one can easily compute the proportions:


    ```

    # calculate the proportion of each nucleotide here

    $probA = $numA / $sequenceLength;

    $probC = $numC / $sequenceLength;

    $probG = $numG / $sequenceLength;

    $probT = $numT / $sequenceLength;

    ```


    Given the nucleotide distributions and making the assumption that the nucleotides
    are independent from one another, one can use the product rule to easily compute
    the likelihood of encountering a particular motif. (Note: Assuming independence
    of nucleotides is done here to keep the mathematics simple. A more thorough treatment
    of this topic can be found inurbin et al., 1998). Assuming Chargaff''s Rule [p(A)=p(T)
    and p(G)=p(C)] is strictly applied in the following A-C-G-T distributions, the
    likelihood of the largely six-letter GC-rich motif GCCAGC as calculated by hand
    is:


    ```

    p(A) = 0.22

    p(T) = 0.22

    p(C) = 0.28

    p(G) = 0.28

    ```


    considering a string of length 6 only


    ```

    p(GCCAGC) = p(G)p(C)p(C)p(A)p(G)p(C)

    = (.28)(.28)(.22)(.28)(.28)

    = 0.000378628

    = 3.79×10⁻⁴

    ```'
