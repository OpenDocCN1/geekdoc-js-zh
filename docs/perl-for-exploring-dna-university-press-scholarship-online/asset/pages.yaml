    \ If I have a dollar or more, I can buy a cup of coffee or else if I have less\
    \ than a dollar I cannot. That conditional statement can be written in Perl:\n\
    \n```\nmy $moneyInPocket;\n$moneyInPocket = ________; # fill in an amount of money\n\
    if ($moneyInPocket >= 1)\n{\n    print \"May I have a cup of coffee? \\n\";\n\
    }\nelse\n{\n    print \"I cannot afford coffee today. \\n\"\n}\n```\n\nConditional\
    \ statements, often called if-else statements, have the following general form.\n\
    \nif ( a test which evaluates to true or false )\n\n![](img/af031a6fb4441852f776d419466cf3a5_107_0.png)\n\
    \nelse\n\n![](img/af031a6fb4441852f776d419466cf3a5_107_1.png)\n\nThe braces {\
    \ and } form what is called a “code block,” where all the statements within a\
    \ block are treated as one unit. In the case of an if-else statement, the two\
    \ blocks are mutually exclusive, that is, only one block of statements will be\
    \ executed on a given run of the program depending on the result of the true/false\
    \ test. If the test evaluates to true, then the if-block statements are run and\
    \ the else-block is entirely skipped. Otherwise, if the test evaluates to false,\
    \ the if-block is skipped and the else-block statements are run.\n\nNotice in\
