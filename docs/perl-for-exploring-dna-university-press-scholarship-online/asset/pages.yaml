  md: '# Box 1.1 The Fine Print


    Some of the things that you will get little or none of in this book: You will
    not be given really explicit instructions for the standard use of preexisting
    software. Our goal is that you might just dare to write your own or participate
    actively in a group that is writing its own. Yet we are not necessarily trying
    to produce professional programmers from novices. It is most important, for the
    way in which much of science is done, to become a versatile, functional member
    of an interdisciplinary field. That might very well involve some Perl, while at
    the same time not quitting your day job as a biologist or chemist.


    You will not be advised too strongly about what sorts of analyses you should be.
    For example, we will not tell you that you ought be building phylogenetic trees
    or studying introns. We leave that up to you, assuming that you have lots of good
    ideas and are creating ways to implement them. Perhaps we stand a chance of the
    book not going out of date as quickly as one other type of analysis goes or out
    of fashion. We do, have your own preferences over what sorts of analyses are interesting,
    and these will be scattered throughout the book as models. One example that will
    soon appear is that we think very highly of concordance or lexicon using us on
    as a first step to deciphering sequences. Even if you don''t agree with us, many
    of the models we will show good starting points for your own personal interests
    in writing software.


    We will not encourage you to write your own software when perfectly good software
    might already exist (and is accessible) for your particular query. The NCBI is
    a rich source of computational tools, including BLAST, and only gets better every
    year. Check often to see what is new and usable and time-saving for you.


    analyses, such as “gene finding,” are available as research topics because gene
    finding, especially in eukaryotes (organisms with complex cells), is still an
    imperfect science. Among the complications are abundant pseudogenes (highly mutated
    and no longer functional) and the splice forms of genes by which one sequence
    might result in many diverse products. Furthermore, many genes have been transferred
    horizontally from one species to another (as opposed to vertically in a tree hierarchy),
    thus complicating the building of sequence phylogenies. The enormous task of assigning
    names and functions to genes and grouping genes into logical gene families and
    super families (essentially taxonomy) lags far behind the accumulation of data
    from DNA sequencing projects.


    The greatest uncharted territories are the sequences between genes (intergenic
    sequences) where it is possible to venture into long stretches of DNA before ever
    examined. Within those intergenic regions, comprising the majority of eukaryotic
    genomic sequences, genes are controlled by mechanisms that not yet completely
    deciphered. Maybe DNA sequence analysis is also a form of stamp collecting, but
    it is also an exciting time in the history of science to have so much raw data,
    so potentially laden with meaning, awaiting exploration on almost any level.'
