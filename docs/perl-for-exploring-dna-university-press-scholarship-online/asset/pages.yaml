    # 6.8 Repetitional Control: Repeating Statements Over with while


    Much of the same logic and syntax used in if-else statements can be used again
    in constructing while statements. The major difference between conditional control
    (if-else) and repetitional control (while) is while statements allow you to build
    a loop that cycles through a section of your program as many times as requested.
    In short, while allows you to be relentless and thorough. while allows you to
    look and look through a long sequence of DNA (or entire genome) until something
    is found or you are satisfied that it is not there.(Note: The previous programs
    using only if-else statements were content to stop when they had produced one
    [the first] answer and thus if-else statements were not obliged to go back and
    pull out any more.)'
