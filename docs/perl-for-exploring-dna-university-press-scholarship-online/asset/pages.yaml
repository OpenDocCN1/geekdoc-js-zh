  md: '# length (STRING)


    One of the most common operations performed on a string is to ask for its length.
    For demonstration purposes in the examples to follow, the string length is explicitly
    returned in the Perl code; however, we will soon encounter situations where the
    sequence length is not known until we use the length function to compute and return
    the length. Examples of times when a sequence length will be unknown include when
    your program reads a motif from a file, snips out an upstream region of sequence,
    or loads an entire genome.


    A detailed explanation of the length function as shown in the next example will
    serve us well for understanding and uses of built-in functions. Functions, whether
    built in or created by you, usually have two distinguishing features: (1) arguments
    and a return value. The length function for example has one argument, a string.
    A Perl string, the item that is "sent to" the length function when called. A return
    value is sent back to your Perl program from the function, the length function
    returning a value indicating the number of characters in the string.


    | Value returned | Function call |

    |---|---|

    | 3 | length("ATC") |

    | 14 | length("ACCGTTACGTCGCG") |

    | 0 | length("") |


    When your Perl program uses a built-in function, it is referred to as "calling
    the function." The following Perl program includes five lines that tease apart
    the action that occurs in the Perl statement that makes the call to the length
    function.


    ```

    $motifLength = length($someMotif);

    ```


    As all Perl statements, we first add the instructions to the right of the assignment
    operator (=). In this case, (1) a call is made to the built-in length function.
    The length function requires one argument, that is, between the parentheses you
    must provide the length function with a string. In this example, the variable
    $someMotif holds the string so $someMotif is the argument that is sent to the
    length function. At this point, your Perl program pauses while the length function
    does its work, in this case (3) counting the number of characters in the string
    within $someMotif (14). Once the length function has computed the answer, (4)
    the answer is returned to your Perl program. (5) Steps (1) through (4) occur to
    the right of the assignment statement. The final step, the returned value of 14,
    is now the result of the right-hand side. If we could hold your program after
    returning from the function and before the assignment operator does its work,
    the state would be as follows.


    ```

    $motifLength = 14 (returned from length)

    ```


    The final step (5) assigns the value returned from length to the variable $motifLength.
    The print statement would then output the resulting message.'
