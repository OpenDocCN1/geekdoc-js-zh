    # 4.10 Using Regex with the Substitution Pattern Matching Operator


    ```

    s/REGEX/REPLACEMENT/[option]

    ```


    As introduced in chapter 3 (section 3.6), the substitution (s) operator searches
    a given string for a particular PATTERN and replaces the characters in the PATTERN
    with those characters from the REPLACEMENT. Often you will need to find a pattern
    in a string, replace the pattern, and then throw away all text surrounding the
    original pattern. Because the substitution operator (s) allows regular expressions
    for PATTERNS, we can introduce a small amount of regex in our PATTERN to help
    us.


    For example, suppose we are scanning summaries of genomes that have been sequenced
    and are creating a list of the names of the sequencing centers where each genome
    was sequenced. Some of the sequencing centers are abbreviated (e.g., TIGR), however,
    we would like to list the complete name (e.g., The Institute for Genomic Research).
    In this case, we can search for all occurrences of the string TIGR, replace it
    with the full name, and remove all surrounding text. Notice how we ignore all
    the text before and after TIGR using the regex syntax to match "any number of
    characters" (*).'
