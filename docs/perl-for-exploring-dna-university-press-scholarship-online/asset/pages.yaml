    # 8.6 Finding Files of Entire Genomes at NCBI


    NCBI is a rich source of genomic data. One of our favorite sections is the collection
    of prokaryotic genomes; this serves as a good first source of data. Although your
    colleagues undoubtedly have suggestions for appropriate data sets, if you are
    looking for places to start, we recommend you pick a microbial genome (e.g., E.
    coli or some other exotic microbe you''ve heard of) and download at least two
    files: the DNA (stored in a FASTA formatted file of 70 nucleotides per line followed
    by a newline file name ends with the extension .fasta and the associated protein
    table (file extension .ppt), which includes annotation on the protein coding regions
    (genes) in this organism''s genome, including but not limited to the starting
    and stopping base pair locations of the genes, the accession (ID) numbers for
    each gene, and possibly a description of that gene''s function.


