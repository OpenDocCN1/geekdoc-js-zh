  md: '# 11.2 Pseudocode


    Algorithms are typically represented in pseudocode, not necessarily a step-by-step
    list. Pseudocode is a set of instructions that resembles (thus *pseudo*) the organization,
    tempo, flow, and content of a set of directives from a programming language, such
    as Perl. Some of the elements that always appear in pseudocode include the following:


    +   1. A clear statement in English as to what you expect the program to do. This
    should include your intended output, what you hope your program will deliver.
    Dream big! You can always trim back your expectations later. Notice the output
    comes first. After all, that is why you are writing the program. One way to think
    about the design of algorithms is that you will be working backward from your
    desired result. Rough analogies include envisioning a finished sweater in a particular
    pattern and then working backward to write the instructions, all of the knits
    and purls you will need to accomplish that pattern.

    2. A statement about what input you need and where it is coming from. For BLAST,
    a user will insert a query sequence, and you need access to a database against
    which to check the query.

    3. On a chalkboard, laying out the entire program in boxes, Connect the boxes
    with arrows so that it is clear what goes in (and from where) and what goes out
    (and to where).


    ![](img/af031a6fb4441852f776d419466cf3a5_218_0.png)


    +   4. Now make a transition from boxes to more detailed pseudocode, which should
    have familiar Perl-like organizational patterns and conventions. Do this with
    a liberal use of brackets, including nested ones like { { { } }, indicating a
    particular order in which the program will proceed as well as indentations to
    help you follow the order of the brackets. You''ve seen and used plenty of'
