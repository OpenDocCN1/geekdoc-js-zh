    # 4.6 Basic Rules of Regular Expression Behavior


    Before we begin, a simple description of the basic rules of regular expressions
    is in order. As the chapter proceeds, we gently introduce you to the various types
    of regex behavior and encourage hands-on practice with each new set of features.'
