    # 8.1 Input, Output, and Your Perl Program


    Perl programs can open files of DNA sequence, read any initial header information

    and then the sequence, store the information in appropriate variables, and close
    the

    file when reading is completed. Because so much data is stored in so many files,

    understanding how to open files and read sequence and other data from files is
    one of

    of the important steps toward programming in the large.


    As shown in the diagram that follows, when your Perl program opens a file for

    reading (e.g., geneXYZ2.fna), a “pipe” (formally called a file handle) connects
    your

    Perl program to the input file. Each time your Perl program reads a line of data
    from

    line of data in a pipe connects the pipe to your Perl program, which can store
    the

    line of data in a variable. Alternatively, when your Perl program opens a file
    for

    writing, use the program to an output file. Each time your Perl program

    writes some data from a variable in your program to the file, the data travels
    down

    out output pipe and is added to the output file.


    ![](img/af031a6fb4441852f776d419466cf3a5_150_0.png)'
