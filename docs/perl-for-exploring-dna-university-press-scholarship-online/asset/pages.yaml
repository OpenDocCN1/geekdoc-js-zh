  md: '# 6.8.1 while and Counting


    One challenging aspect of building a while loop is controlling it. You want the
    loop to continue when you have more work to do and stop when the work is done.
    In general, while loops are comprised of the five items indicated below.


    +   [1] initialization

    (e.g., start your counter at (1) and/or start your sum at zero (0))


    ```

    while ( [2] test some logical expression that evaluates to either True or False
    )

    {

    ```


    +   [3] do this action when the logical expression evaluates to true;

    when true, we do these statements “inside” the while loop

    ::


    +   [4] update at bottom of the loop (before returning to the top of the loop)

    we update a counter or perform some statement that brings the logical expression
    “closer” to becoming false


    } # end of the while loop (return to the top of the loop)


    +   [5] Continue below the loop when the while loop test is false

