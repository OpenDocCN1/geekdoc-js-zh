  md: 'Meanwhile, you want your code to be absolutely transparent to future users,
    especially those who will need to add to, adjust, and otherwise maintain your
    program. That future user could be yourself, a year from now, puzzled by your
    choices. Long descriptive variable names and essay-like comments take up both
    space and time. It takes longer to trace through code that occupies instead of
    dozens of lines.


    To achieve balance between efficiency and understandability is to produce something
    beautiful. And Perl guru Greg Williams, who like many gurus leans toward verse
    (rather than prose), says that the goal is "to use as many of the language features
    of Perl as possible for the greatest effect while being completely understandable."

    This is something to which we all aspire.


    # 11.4 Jim Kent''s BLAT Algorithm


    A heroic story of algorithm building is that of Jim Kent, a programmer who was
    completing work in biology at the University of California, Santa Cruz. When the
    sequencing of the chromosomes of the human genome had been completed, that genome,
    at that point, from finished. Most freshly sequenced genomes, it was all in fragments,
    three million of them, described by Kent as being like fragments of the Dead Sea
    scrolls. Assembly of these small DNA sequences was predicted to be a long and
    arduous process using the available software of the Human Genome Project. Meanwhile,
    the competing commercial enterprise at Celera was weeks away from assembling its
    own draft of the human genome and (at least for a time) keeping it proprietary
    as well as applying for patents on many genes as possible.


    Undaunted, Kent began sketching out algorithms (based on his research) by which
    the assembly might go as smoothly and quickly. Ambitiously, he focused on speed,
    requiring that the assembly be completed in two weeks. Working as much as 80 hours
    out of a week and using 100 Pentium III processors, Kent produced and implemented
    Assembl. It was used in June 2000, finishing the first draft of the human genome
    a few days later than Celera. Almost immediately, Kent and his group placed the
    draft into public domain. In 2002 Kent published the algorithm for his tool, BLAT,
    which stands for BLAST-BLAT Alignment Tool. The goal of BLAT was to "stitch together"
    sequence fragments with significant overlaps. For example, two fragments might
    be stitched together.


    ```

    actgggcattagct and ttagctatacgtgct

    ```


    to make


    ```

    actgggcattagctatacgtgct

    ```


    and so on, to assemble entire chromosome.

    In his paper, Kent compared BLAST with BLAT, summarized and simplified by us.'
