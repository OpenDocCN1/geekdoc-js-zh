  md: '# Introduction: Explorations and Indexes


    In addition to playing with the features on your word processor, you may want
    to open your internet browser. Online search engines typically have some versatile
    features, including Boolean searching and wildcards. We would like to point out
    that simply typing in a DNA string (or protein) of sufficient length, as as "gtgcacc,"
    might quickly reveal some research or annotation being done on that sequence.
    We have noticed that although short trimers and tetramers tend to get used for
    acronyms search subjects, longer motifs of interest are definitely worth trying.
    We have used similar searches at PubMed (MedLine) to find scientific abstracts
    that particular sequences of DNA or proteins.


    # Box 1.3 Annotating Sequences by Hand


    One of the conventions for naming short, meaningful sequences of DNA is to call
    them boxes as in "TATA box," "CAAT box," and "homeobox." This dates from the time
    when DNA analysis was mostly done by hand with colored pencils or pens. Sequences
    of potential interest literally would have a box drawn around them. In 1975 David
    Pribnow reported in the Proceedings of the National Academy of Sciences on the
    significance of TATAAT as a binding site in the promoter region of some prokaryotes.
    Shortly thereafter, colleagues began to refer to that sequence as a Pribnow box
    and the term box entered common parlance for any sequence of interest. Some biochemists
    use a dry sense of humor in naming sequence elements as CAAT box (a binding site
    of eukaryotic promoters), evocative of a box of kitty litter.


    Colored pencils still have a role in DNA sequence analysis. If you are writing
    a program to execute a search for pattern or motif in a sequence, you need to
    start with a very small test file that you have marked up, in advance, to locate
    your sequences of interest. If your program succeeds in finding the same sequences,
    perhaps you are ready for larger files. Otherwise, there may be some error in
    your program. Part of the ground truth of programming is checking output results
    by hand that you can trust what your machine is doing for you.'
