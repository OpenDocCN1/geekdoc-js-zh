  md: "# 12.2.1 Greedy Match\n\nGiven a long sequence of DNA, including an entire\
    \ genome, how can we design a regex to find all the repeats of length greater\
    \ than 6 bp? The following example shows that the (.*) is greedy, and thus the\
    \ pattern returns the longest match. In this case, greediness is not good.\n\n\
    ```\nmy $dna = \"ATCGATCGCCTCTGATCGGTGCA\";\nwhile ($dna =~ m/\n    # capture\
    \ (remember) entire match\n    (.).(.).(.)\n    # any 3 nucleotides, remember,\
    \ then\n    (.*)\n    # GREEDY! 0 or more of any nucl.\n    4\\3\\2\n    # recall\
    \ in mirror-order\n)\n    # end of entire match\n/xg\n    # find all (g) globally\n\
    {\n        # while another match is found\n    my $mirrorRepeat = $1;\n    my\
    \ $foundBP = pos($dna)-length($mirrorRepeat);\n    print \"Found (greedy) MR:\
    \ $mirrorRepeat at bp $foundBP \\n\";\n}\n# end while more MRs to find\n```\n\n\
    The output of the regex with the greedy quantifier (.*) is shown below.\n\nFound\
    \ (non-greedy) MR: CGTCATGC at bp 2\nFound (non-greedy) MR: CGATCTGTGC at bp 15\n\
    \nA careful look at the sequence will reveal that this regex has returned the\
    \ second and longest mirror repeat (MR) and skipped past the initial MR.\n\nWhat\
    \ about this MR?\nATCGATCGCCTCTGATCGGTGCA\n\n```\n(.).(.).(.)    (.*)\n    4\\\
    3\\2\n    greedy\n```\n\nSince the * quantifier is greedy, (.* will match as much\
    \ as it can. So (.+). If you were to run this regex against a string representing\
    \ an entire genome, you'd get back one very long result. In that case, you might\
    \ suspect something is amiss,"
