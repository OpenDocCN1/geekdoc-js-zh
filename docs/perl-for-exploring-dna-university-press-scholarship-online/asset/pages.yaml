    # 9.3 Motivation for Using Arrays


    Suppose your group needed to run some experiments on prokaryotic genomes. Following
    good software engineering advice, you decide to start with just three genomes
    to ensure that you can successfully open the genome data files and check that
    your logic and math are correct. You might store the names of the files containing
    FASTA format data in one scalar per genome.


    ```

    $my $genome1 = "Bacillus_anthracis_str_Ames.fna";

    $my $genome2 = "Escherichia_coli_K12.fna";

    $my $genome3 = "Pyrocococcus_furiosus_DSM_3638.fna";

    ```


    Assuming that your experimental tests on these three genomes go well, your group
    peers over your shoulder and say, “Great. Now can you make that work for the 200+
    bacterial genomes available at NCBI and why not also include the scores of Archaea
    as well?

    As look at the Perl, you suddenly get this awful image in your head of the following:


    ```

    $my $genome001 = "Acinobacter_str_ADP1.fna";

    :

    $my $genome013 = "Bacillus_anthracis_str_Ames.fna";

    :

    $my $genome102 = "Escherichia_coli_K12.fna";

    :

    $my $genome179 = "Pyrocococcus_furiosus_DSM_3638.fna";

    :

    $my $genome214 = "Zymomonas_mobilis_subsp_mobilis_ZM4.fna";

    ```


    Clearly, this is a programming nightmare. Even if you were to get this program
    to work with all these independent variables, what would you do if your group
    decides to remove all the Gammaproteobacteria genomes? This is a classic case
    of a program that works versus a program that has been designed to handle the
    general case. In this example, we need a program that works for any number of
    file names in a data structure without changing the program to accommodate the
    varying number of files on a particular run.

    The take-home story from this is that scalar variables alone are not sufficient
    to store a list of many related items, especially when you need to write a program
    that can operate on those items one at a time. The next section reveals a solution
    for holding multiple file names by using an array.'
