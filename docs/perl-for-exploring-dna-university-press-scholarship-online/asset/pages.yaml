  md: '# 8.5 Opening Files on the Mac Using TextWrangler and BBEdit


    If you are using a Macintosh (OS X and higher) and a text editor such as TextWrangler
    or BBEdit, these editors will not recognize your relative path names, you''ll
    get error messages when attempting to open your files. You can ignore this section
    if you are using a Windows operating system or if you are running your Perl programs
    on a Linux or Mac OS command line.


    Because TextWrangler and BBEdit are text editors and not full-fledged development
    environments, they are not able to recognize by default the directory where your
    Perl program runs. The solution will contain some features of Perl that have not
    yet been addressed, but consider this in borrowing code. In short, this solution
    borrows functionality from a module of Perl functions called File::Spec. In particular,
    the splitdir and catfile functions determine the absolute path name of your running
    Perl program, helping you construct the appropriate path name to use to open your
    files.


    ```

    #!/usr/bin/perl

    use strict;

    use warnings;


    # needed for MacOS X if using BBEdit or TextWrangler

    use File::Spec;

    ---------------------------------------------------------------------------------

    # establish the absolute pathname to directory of input files

    ---------------------------------------------------------------------------------

    # need for MacOS X when using BBEdit or TextWrangler

    #

    determine the absolute pathname to the current directory

    my @path = File::Spec->splitdir( File::Spec->rel2abs($0) );


    my $abs_pathname;

    $abs_pathname = File::Spec->catfile(@path[0..$path[-1], "");


    my $pathname = "BACT/BA/BACT_ancient_Thermotoga/";

    my $filename = "D_04_TM0008.fna";


    my $fullname = $abs_pathname . $pathname . $filename;

    my $FNAFILE;


    open ($FNAFILE, ''<'', $fullname)

    nor die "Cannot open the input file: $fullname $!";


    print "full pathname opened is: \n$fullname \n";

    #...


    close ( $FNAFILE );

    ```'
