- img_proc: true
  md: '# # Appendix 2

    # Bioinformatics as Part of the Solution


    Jane Margolis and Allan Fisher asked the difficult question of why there are so
    few women in computer science. The results of their study, focused mostly on the
    computer science department of Carnegie Mellon University are presented in Unlocking
    the Clubhouse (2002). The authors included a list of suggestions for enriching
    computer science assignments as that they might more broadly appealing to women,
    (who according to the study) are less attracted to more conventional programming
    problems, while a minority of men are attracted to computer science and these
    same suggestions might broaden male participation in computer science as well.)
    We noticed reprinting the list of suggested enrichments that bioinformatics may
    be part of the solution. Indeed, our approach to Perl has been primarily centered
    on the joys of applications and the intriguing personalities and problems of bioinformatics.
    Therefore we are reprinting the list of Margolis and Fisher, shortened by us and
    including our own commentary (in parentheses) on the excellent fit of Perl and
    DNA sequence analysis.


    # ## Ways to Enrich a Programming Assignment

    ## (or Career in Computer Science)


    +   1. Make it useful, personal, or local. Make it socially relevant. Include
    observations of the real world. (That’s bioinformatics! All sorts of fascinating,
    practical problems in medicine, the environment, and evolution may be solved through
    computation.)

    2. Interface with other programs. (The public repository of sequences at NCBI
    includes powerful programs for analysis such as BLAST. We encourage a balance
    of using what is already available and writing your own as needed.)

    3. Focus on the case of use. (Throughout this time we emphasized how do-able this
    is without necessarily being a wizard or guru.)

    4. Use big data. Use real-world data. Problems that are too large to solve by
    hand help students understand the real value of computing. (Are billions of bases
    of DNA big enough dataset? The sequence files are growing every day. There is
    enough unanalyzed information for lifetimes of work. We are in an age of genome
    exploration.)

    5. Use natural-language text. (We were pleased to see this one because our whole
    approach to sequence analysis is to treat the data like a text to be deciphered.
    Our working metaphor is linguistics.)'
  merge: -1
  pgno: 276
- img_proc: true
  md: '+   6. Make it sensory: graphics, audio, animations. Write simulations. (Although
    we don''t go there in our book, graphics and simulations are an obvious next step
    for creatively presenting the intricacies of DNA.)


    +   7. Bring in experts. (One of our favorite teaching methods is linking preexisting
    courses in which, for example, a biologist does a couple of lectures in computer
    science and vice versa and then the two sets of students collaborate on an interdisciplinary
    project in DNA sequence analysis.)


    +   8. Illustrate how everyday computational objects work. (Medicine and other
    practical areas of science increasingly will be organized and implemented with
    computational methods. Knowing how some of the programs and databases work is
    empowering.)'
