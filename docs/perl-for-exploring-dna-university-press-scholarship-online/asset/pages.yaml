  md: '# 9.8.3 Parsing FASTA Format Header Lines


    DNA sequence files in FASTA format begin with a header line, an initial line providing
    information about the sequence found in the file. The header often begins with
    a character greater than (>), and the individual pieces of information in the
    header line are typically separated by a delimiter, often a vertical bar (|) (sometimes
    called a pipe). A sample header is defined by pipe characters (|):


    ```

    >gi49175990|ref|NC_000913.2| Escherichia coli K12, genome

    ```


    The regular expression in the split function can match each pipe character, the
    individual substrings of information between the pipes, and return the substrings
    in text context to be stored individually, as shown in the following example.


    ```

    my $header = ''>gi49175990|ref|NC_000913.2| Escherichia coli K12, complete genome'';

    chomp($header); # remove newline if any

    my @headerFields = split(/\|/, $header);


    my $NCBI_number = $headerFields[ 3 ];

    my $description = $headerFields[ 4 ];


    print "The fourth item in the header is: $NCBI_number \n";

    print "The fifth item in the header is: $description \n";

    ```


    Note that the pattern in the regular expression contains the pipe character (|),
    but because this character is part of the regular expression syntax (to allow
    multiple possible matches, match this "or"), we must precede the pipe character
    with a backslash (\). The combination of (\|) means that we really mean that the
    pipe character should be matched as the delimiter or in other words, do *not*
    (\) treat the | as a regular expression or-symbol.


    # 9.8.4 Converting a String into an Array of Characters Split


    The split function makes it easy to break a DNA sequence into individual nucleotides
    or a protein sequence into individual amino acid symbols and store each individual
    item into an array. In this case, you split on "" (//), this being a default way
    to divide a string into individual characters. In the example that, split breaks
    the protein sequence apart and stores each symbol into the cells of the array
    @proteinSymbols.


    ```

    # split on the empty pattern; returns individual letters

    $proteinSequence = "VWFFAMILY"; # hydrophobic AAs

    my @proteinSymbols = split ( //, $proteinSequence );

    ```'
