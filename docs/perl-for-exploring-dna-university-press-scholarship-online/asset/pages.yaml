  md: '# String Play with Regular Expressions


    | Regex | Meaning |

    |---|---|

    | .+ | optional, match any character 0 or 1 time |

    | T? | optional, match a T or nothing |

    | (CAAT)? | optional, match CAAT or nothing |

    | A(3,7) | match between 3 and 7 As |

    | A{3,} | match of 3 or more As |

    | [CG] | match any one of the characters in the set, a C or a G |

    | TATA[AT] | match TATA followed by an A or a T |

    | [^CG] | match any one character that is not in the set, not a C and not a G
    |

    | [CG]{5,10} | match a C or a G between 5 and 10 times |

    | ^ATG | string begins with ATG |

    | TAG$ | string ends with TAG |

    | \s | match any whitespace character (tab, space, newline) |

    | \S | match any character that is not whitespace |

    | \d | match any character that is a digit, same as [0123456789] |

    | \D | match any character that is not a digit |

    | \w | match any one "word" character (includes alphanumeric, plus ''_'') |

    | \W | match any nonword character |


    # 4.8 Facing Page Translations


    Facing page translations are often used to help readers translate between two
    different languages, for example, English text on the left-hand, even-numbered
    pages and the comparable French text on the right-hand odd-numbered pages. Here
    we introduce regular expression syntax in small doses, first applying regex to
    English text on the left and then applying that regex to DNA sequences on the
    right. Using regex to find patterns in English words is instantly gratifying.
    Applying the same regex to find patterns in motifs complements the power of such
    simple pattern-matching syntax. Each pair of facing pages introducing new regex
    syntax with examples and questions is followed by an associated pair of pages
    with answers to the questions.'
