    # 10.4.1 Syntactic Features Unique to Hash Tables


    +   1. References to the entire hash table are preface with the percent symbol
    ().

    2. The operator (=>), sometimes called the "fat comma" operator, is useful when
    initializing hash table (key, value) pairs. If you know the (key, value) pairs
    ahead of time, we recommend this syntax for initializing pairs in the hash: key=>
    value. Notice that although the keys are strings, you do not have to quote the
    keys. The fat comma operator assumes your keys are to be quoted.

    3. Like arrays, referencing a single (scalar) element in the hash, we use the
    dollar ($) syntax prior to the name, $amino_acid, but the key is enclosed within
    open and closing braces {key}. Thus, to reference "find", "look-up" the amino
    acid name for the start codon AUG, we need not worry about where the cell is located
    in the hash table, rather we can directly use AUG as the index:


