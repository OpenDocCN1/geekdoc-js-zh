  md: '# Box 3.4 Why Do Computer Scientists Count from Zero?


    Let''s turn title question and ask why the rest of the world is inconsistent in
    its counting practices.


    Although it makes practical sense that any useful counting system ought to begin
    with zero, children are persistently taught to begin at one. Perhaps it is the
    fault of our having such convenient counting objects as our ten fingers and our
    reluctance to imagine zero of them. Indeed, as books like Perl (Seife 2000) and
    The Nothing that Is (Kaplan and Kaplan 1999) attest, the concept of zero was not
    only obvious but even strongly resisted through most of the history of human counting.


    Nevertheless (index-like) we begin all lines at age zero and spend our first year
    as age zero, consistent with the way we make subsequent years as age 1 or age
    1 or 11. However a certain discomfort level with zero means that we prefer to
    avoid it as an infant''s age (especially for an entire year) and substitute the
    (more satisfying) counting of months and weeks instead. The same is true for the
    Western calendar, which begins awkwardly with the year one rather than the zero,
    as it should have. There was a bit of confusion exactly when we consider the new
    millennium to have begun. If the year 1 was the real year 0, then we were premature
    in opening all that champagne in 2000!


    Meanwhile, the practicalities of travel through space themselves make the correct
    use of zero unavoidable because the physical reality is. For example, a trip necessarily
    begins with zero until one has taken the first step. Certainly one does not count
    mile number one or even step number until one has achieved it. That mandate truth
    is the simple reason for beginning an index or list in computer science with zero.
    Because any journey begins with zero, it is a simple extrapolation to a trip down
    the length of a string of As, Cs, G, and Ts. Until we have moved off the first
    DNA base, we are at zero. That starting base, is not our first base; it is our
    zeroth base!


    This elegant (and correct) counting system, affords calculations to be visualized
    more readily, which is why numbers with zero are eventually (but perhaps not soon
    enough) introduced in elementary school math. We can slide with ease up and down
    a number line that commences with zero adding and subtracting numbers always arriving
    in the right spot. Unlike a number line beginning with one (if there is a thing
    outside the realm of a child''s fingers), zero provides possibilities to explore
    the realm of negative numbers as well as Zeno''s territory of infinite fractions
    less than one.


