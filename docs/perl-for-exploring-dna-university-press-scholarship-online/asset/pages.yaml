  md: '# 12.2 Hieroglyphics


    Is a language (like English) with a linear (string-like) representation useful
    in generating hypotheses about information that might or might not be present
    in a DNA string?


    On first glance, an English-language (or linear-language) metaphor may make a
    reasonable first step to finding hypotheses. Indeed, many of the examples in this
    book do that: Treat DNA like a linear string of information that may be analyzed
    by some of the traditional methods of linguistic analysis, such as frequency analyses
    and index-building or concordance-building.


    But a purely linear approach has its limitations given the dimensional folds,
    kinks, and coils of DNA and the three-dimensional nature of DNA interactions with
    proteins and other molecules. Reluctant to let go of natural-language metaphor
    and in the spirit of open-minded exploration, we suggest an examination of some
    of the less (more multidimensional) human languages especially in their written
    form. These might include Chinese diagrams and hieroglyphics.


    Hieroglyphic diagrams are typically set out in linear fashion after another, either
    right to left, left to right, or down to up. Like many ancient writing systems,
    hieroglyphics lock vowels and spaces between words. However, hieroglyphs do not
    have a simple one-to-one correspondence or transliteration with linearly represented
    languages, such as English or Russian. The hieroglyphic characters double back
    on themselves, three dimensionally, by containing layers of redundant information
    within each diagram. That is quite a challenge for translators. The code provided
    the Rosetta Stone was impenetrable for translation into a Greek of hieroglyphics.


    Middle Egyptian scribes had choices as how to write a word in hieroglyphic notation.
    They could spell it by letter and leave it at that, but simple spelling is almost
    never done. There are 24 unilateral letters in the alphabet, including m, which
    is a picture of an owl, and w, which is a quill chick.


    The scribe could use diliter or triliter symbols so that for example mw becomes
    a new symbol, waves of water. Within a single ideogram, a scribe might choose
    to use both methods (the unilateral letters and the diliter symbol) to depict
    mw redundantly using all three—owl, quill chick, and water—emphasis.


    But that''s all. That is merely the phonetic part of the ideogram. The owl sign
    also means “in” as that of derived pictogram and the waves of water sign also
    mean “water.” Thus, a third level of redundancy might be introduced.


    To summarize, any given word in hieroglyphics is a complex, redundant combination
    of both its phonogram (what it ought to sound) and its pictogram (what it ought
    to mean). The ideogram for thirst requires five symbols (Keep in mind that vowels
    are left out.) The symbols are a reed (y) and a foot (f) representing the two
    consonants of the word, followed by a baby goat representing the diphthong for
    those two consonants, followed by'
