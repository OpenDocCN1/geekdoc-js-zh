  md: '# Good Practices


    Take particular notice of the second call to index. You''ll notice that we used
    the variable `$whereStart` as the third argument. Why did we do that? Couldn''t
    we just have used the integer 5? Well, in this example, an integer 5 would work
    and the explicit 5 would cause your program to produce the same output. But note
    that an integer 5 only works for the case where we start with the string ACGTTAGTAC.
    If you or someone else were to run your program using a different sequence where
    the initial start codon does not start in position 5, then using an explicit 5
    as the third argument in the call may not produce the correct result. In our solution,
    we know that the variable `$whereStart` holds the position of the initial ATG
    in whatever sequence is held in the variable `$putativeGene`. If someone changes
    the sequence in `$putativeGene` and reruns the program, `$whereStart` will hold
    the different ATG starting position. Using `$whereStart` as the third argument
    to index is a good solution that works on whatever sequence is used. Perhaps this
    seems obvious, but from a programming point of view, the distinction between using
    a specific value (5) and a general solution that uses a value stored in a variable
    distinguishes a dangerous program from a good program. Note that we said "dangerous"
    and not just a "bad" solution. A dangerous program runs and produces answers...
    but the answers are sometimes wrong


