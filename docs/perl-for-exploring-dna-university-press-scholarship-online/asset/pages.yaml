  md: '# 5.1.3 Modulo Division


    The modulo division operator (%) may be new to you because this is not an operator
    you find on most calculators; however; modulo division can be extremely timely
    in a number of instances and is worth exploring briefly. Modulo division returns
    the `remainder` of a division.


    ```

    1 R 2

    3 | 5

    ```


    Thus 5 % 3 (read “five mod three”) is 2. Modulo is valuable when you want to do
    something for, say, 1000 times, and restart your count back at zero each time
    you reach 1000. For example, assume you are sampling (and counting as you go)
    every 1,000 nucleotides in a downstream region. In this case, if you use `$count
    % 1000` the result of any count mod 1000 will return a result in the range [0...999].


    | $count is | $count % 1000 |

    |---|---|

    | 0 | 0 |

    | 1 | 1 |

    | : | : |

    | 999 | 999 |

    | 1000 | 0 |

    | 1001 | 1 |

    | : | : |


    In the next chapter we will discuss how a loop will enable you to maintain a running
    tally like `$count`. For now, practice with a few modulo operations and keep this
    section in mind as you move on.


