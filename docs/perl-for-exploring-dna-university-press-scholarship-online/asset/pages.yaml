  md: '# Box 11.1 An Algorithm for Discovery: Five Simple Principles


    +   1. Slow down to explore. Discovery is facilitated by an unhurried attitude.
    We favor a relaxed yet attentive and prepared state of mind that is free of the
    checklists, deadlines, and other exigencies of the workday schedule. Resist the
    temptation to settle for quick closure and instead search for deviations, inconsistencies,
    and peculiarities that don''t quite fit. Hidden among these anomalies are the
    clues that might challenge thinking and conventional explanations.

    2. Read, but not too. It is important to master what others have already written.
    Published works are the forum for scientific discourse and embody the accumulated
    experience of the research community. The influence of experts can be powerful
    and might squash a nascent idea before it is tested without bias. It can take
    root. Fledgling ideas need nurturing until their viability is proven. So think
    again before abandoning an investigation merely because someone says it is done
    or unimportant.

    3. Pursue quality for its own sake. Simple refining methods and design is almost
    always rewarded. Rigorous attention to such details avert the premature rejection
    or acceptance of hypotheses. Sometimes, in the process of perfecting one''s approach,
    unexpected discoveries can be made. An example of this is the background radiation
    attributed to the Big Bang, which was identified by researchers who were pursuing
    the source of a noisy signal from a radio telescope. Meticulous testing is a key
    to generating reliable information that can lead to breakthroughs.

    4. Look at the raw data. There is no substitute for viewing the data firsthand.
    Of course, there is no question that further processing of data is essential for
    their management, analysis, and presentation. The problem is that most of us do
    not really understand how automated packaging tools work. Looking at the raw data
    provides a check against the automated averaging of unusual, subtle, or contradictory
    phenomena.

    5. Cultivate smart friends. Sharing with a buddy can sharpen critical thinking
    and spark new insights. Finding the right colleague is in itself a process of
    discovery and requires some luck. Sheer intelligence is not enough; a pal whose
    attributes are complementary to your own, and you may be rewarded with a new perspective
    on your work. Being this kind of friend is the secret to winning this kind of
    friendship in return.


    Most of us already know these five precepts in one form or another, we have noticed
    some difficulty in putting them into practice. Many obligations appear to erode
    time for discovery. We hope that this essay can serve as an inspiration for refining
    the process of discovery and making it a part of the daily routine. In 1936, in
    Physics and Reality, Einstein wrote, "The whole of science is nothing more than
    a refinement of everyday thinking." Practicing this art does not require elaborate
    instrumentation, generous funding, or prolonged sabbaticals. What it requires
    is a commitment to exercising one''s creative spirit—curiosity''s sake.


    > Reprinted and slightly abridged from Paydarfer and Schwarts (2001).'
