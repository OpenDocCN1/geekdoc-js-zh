  md: '# 8.2 Open a File for Reading (Input)


    When reading data from a file into your program, Perl''s built-in open function
    associates the name of a data file with a user-declared file handle to move data
    from the file to your program. As shown earlier, it is helpful to visualize the
    file handle as a named pipe that connects your program to the input. The basics
    are shown in the following program, which opens a file for reading, reads the
    initial header line from the file, and closes that file.


    ```

    !/usr/bin/perl

    use strict;

    use warnings;

    # Drosophila melanogaster odorant receptor Or83b mRNA

    my $filename = "fly_odorant_receptor.fna";

    my $FNAFILE; # create a variable to hold the file handle

    # try to open the file;

    # if no file by that name, print error message ($!), then exit

    open($FNAFILE, ''<'', $filename)

    or die "Cannot open the input file: $filename: $!

    ```


    open($FILEHANDLE, ''MODE'', FILENAME )

    The $FILEHANDLE is a user-defined variable, that is, you get to make up the name,
    for example, $FILENAME. Because this is the name you will use in your program
    whenever you perform a read, we recommend that you use a good name for your file
    handle. The FILENAME can be one of three types of strings:


    +   i. a simple name "fly_odorant_receptor.fna" implying that the input file is
    in the same directory as the Perl program;

    n. a relative path name "fruit_fly/olfaction_genes/fly_odorant_receptor.fna" implying
    that the Perl program is in a directory that contains a directory called fruit_fly,
    which contains a directory called olfaction_genes, which contains the input file
    to open (fly_odorant_receptor.fna);'
