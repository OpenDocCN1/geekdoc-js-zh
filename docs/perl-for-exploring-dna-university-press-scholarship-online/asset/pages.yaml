    # Best Practices


    A good rule of thumb is to write short, succinct print statements; a long message
    is best done over multiple print statements rather than one long message.


    Another useful sequence is the tab character (\t). In later programs, we''ll want
    to produce tab-delimited output so we can perform subsequent analyses and formatting
    with a spreadsheet program. Printing tab characters between column headings and
    data values ensures that your Perl output will automatically place-delimited data
    in their own columns when opened by a spreadsheet program such as Excel. A sample
    print statement that produces tab-delimited headers for a table of data is shown
    next.


    ```

    print "A, C, G, T ratios for Organism\n";nprint "Genus\tSpecies\tA\tC\tG\tT\tother";

    ```'
