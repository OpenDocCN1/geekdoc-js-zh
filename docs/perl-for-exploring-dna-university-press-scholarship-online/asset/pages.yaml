  md: '# Preface


    bioinformatics, genomics, proteomics, and systems biology. As such, Perl is ideally
    suited to answer questions such as


    How can I determine all the three-letter prefixes of every word from a John Donne
    poem?

    How can I determine all the three-letter prefixes of 7-mer found upstream of my
    favorite kinesin gene in yeast?

    How can I determine all the partial anagrams in a certain word?

    How can I search for hydrophobic domains in proteins?

    How can I find and count every occurrence of “love” in a psalm

    How can I find and count every occurrence of the putative binding site ACGT upstream
    of genes in the Krebs cycle?

    How can I find all palindromes in the English dictionary?

    How can I find all mirror repeats in a genome?


    # Intiguing and Unique Aspects of This Perl Book


    +   1. Uses an appealing “exploration” metaphor throughout. Biology has returned
    to an age of discovery, perhaps not seen since the days of nineteenth-century
    scientific expeditions. For example, Charles Darwin was charged with collecting
    and cataloging every organism that he could on his voyage on the Beagle. We are
    all (biologists and computer scientists as explorers) with billions of bases of
    unshared DNA sequences and a great need for simple collecting, cataloging, and
    annotating. What the intrepid traveler needs is a guide to make the transition
    into sequence analysis enjoyable and rewarding.

    2. Uses a foreign language “phrase book” approach for instant gratification for
    the novice user. For example using a French phrase book to say, “May I have a
    croissant, please?” brings the speaker a croissant. Substituting the word espresso
    brings more gratification in form of espresso. Knowing all of the fine points
    of the grammar is not necessary to get results.

    By that analogy, a biologist (and Perl novice) using our book wishing to search
    for all direct repeats of length six in a DNA sequence, would


    ```

    m/(.).(.).(.).\1\2\3/g

    ```


    And find mirror repeats would simply substitute


    ```

    m/(.).(.).\3\21/g

    ```


    +   3. Encourages a “favorite gene” approach by which the user is encouraged to
    use all possible tools to solve a particular research problem. This is not entirely
    for biologists who are accustomed to trying different lab techniques and in some
    cases using prepackaged software for sequence analysis. What is the ease with
    which biologists can begin making queries specific to their own favorite genes
    using their own Perl scripts. We strongly believe that a grassroots effort in
    genomics will solve many of the more interesting problems on DNA function and
    regulation.'
