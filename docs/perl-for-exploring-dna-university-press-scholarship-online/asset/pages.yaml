  md: 'which results in case (6). Having computed the first few operators and substituting
    their resulting value, we are left with the expression:


    ```

    $z = 5 - 4 + 6 ;

    ```


    Because we have completed all of the multiplication and division operators, we
    move down the hierarchy again. Next, addition and subtraction are of the same
    precedence with a left-to-right associativity, thus the subtraction $(5 - 4)$
    is computed next rather than $(4 + 6)$. Notice that in this case the left-to-right
    associativity makes a difference since $(5 - 4)+6$ ? $(4 + 6)$. Once all arithmetic
    is completed on the right-hand side of the statement, the final result of (7)
    is finally assigned to the variable $z.


    ![](img/af031a6fb4441852f776d419466cf3a5_93_0.png)


    # 5.1.2 Unary Minus


    The unary minus (negation) operator is somewhat of an anomaly. Intuitively, we
    use it all the time, for example, when we write "negative five." -5. Specifically,
    this negation operator is unary because it operates on only *one* operand, that
    is, it negates the sign of the value to the right. This is opposed to the typical
    binary operators like subtraction that operate on two operands. Like exponentiation,
    unary operators are handled from right to left. Thus, you must handle each unary
    operator that you encounter in each statement starting from the right and working
    toward the left.


    ```

    $x = -5;

    # x holds a negative five (-5)


    $y = -x;

    # y holds negated value in $x, thus -(-$x) or (positive) 5


    $z = -$x + 1;

    # x holds -5

    # z now holds (-5) + 1 or six (6)

    ```'
