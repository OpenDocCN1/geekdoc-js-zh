    substr(STRING, OFFSET [ , LENGTH])


    The substring(substr) function extracts a substring from a longer STRING. The
    second argument indicates the starting position or OFFSET of the substring to
    extract. For example, if the second argument was a 2, the substring would begin
    at the third character in STRING (remember the initial character position is zero
    [0]). If the second argument is a negative number, the substring will start far
    from the right end of the STRING. The optional third argument indicates the LENGTH
    of the substring to extract. If the third argument is omitted, the substr function
    returns everything from the offset to the end of the string. If the third argument
    is a negative number, the substr function will leave many characters off the end
    of the string.


