    for the reader to verify that multiple randomly generated sequences have a similar
    A:C:G:T ratio as the starting actual sequence. For now, notice that the actual
    sequence, the random sequence, also appears to be AT-rich.


    ```

    ACTUAL Sequence: ACGGCTTGCCGTATATAAAATACTATATAA

    RANDOM Sequence: TTACGTATACAGTTAGTAATTAACTATATCA

    ```'
