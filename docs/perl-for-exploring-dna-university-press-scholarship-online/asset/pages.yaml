    \nFound AAACGG at bp 3\n\n# 12.42 Negative Look Ahead\n\nTo match 1 and 2, we\
    \ need to use a “zero-width look ahead.” A look-ahead assertion is a regular expression\
    \ pattern that can tell you if a match will occur without moving the position\
    \ in the string where the next match will take place. Technically speaking, we\
    \ need to use a zero-width negative look-ahead assertion so that we can find a\
    \ pattern that is not followed by a stop codon. The syntax for a negative look\
    \ ahead is: `(?pattern)`. Similar to the syntax for noncapturing groups in section\
    \ 12.3, think of the question mark in this context as meaning “noncapture” and\
    \ the bang (!) as “negative look ahead.” So in this case, the parentheses will\
    \ not capture anything.\n\n```\n# CORRECT\n# Negative Look-Ahead\n# Find AAACGG\
