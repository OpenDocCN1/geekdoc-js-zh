  md: "# Hash Tables\n\nEach time you read a 4-mer (e.g., AAAG) you'll scan your tally\
    \ sheet for this motif and if you find it, you'll count it by adding a new tally\
    \ mark. If you don't find that, this will be the first occurrence of 4-mer, so\
    \ you'll add it to the bottom of your tally sheet with a count of one. As it turns\
    \ out, it is almost exactly what Perl does when a problem with a hash table.\n\
    \nBecause we want each motif to be associated with a single frequency count and\
    \ we want to reference (key, find, look-up) the count for a specific word by keying\
    \ on the actual motif name (string), a hash table is the data structure for this\
    \ job! The following Perl program breaks a DNA sequence into 4-mers, uses each\
    \ 4-mer as the key into the hash table, and adds one count for each 4-mers\n\n\
    ```\n# a hash table of frequency counts for each DNA motif\nmy $motifCounts;\n\
    my $LMER = 4; # let's count 4-mers, L = 4\nmy $DNA = \"AAAAACAAA\"; # simulate\
    \ some DNA sequence\nmy $DNALEN = length($DNA);\nmy $startBP = 0; # take L-mer\
    \ substrings starting here\nmy $end = $DNALEN-$($LMER-1); # upto here\nwhile ($startBP\
    \ < $end) {\n  # snag $LMER nucleotides from DNA at $startBP\nmy $nextMotif =\
    \ substr($DNA, $startBP, $LMER);\n  # add one (++) to this next motif's count\n\
    \  $motifCounts{$nextMotif}++;\n  $startBP++; # move to next motif\n}\n```\n\n\
    Starting with the DNA sequence GAAAACAAAC, the (key, values) in the hash table\
    \ might possibly look like this in memory.\n\n| GAAA | 1 |\n|---|---|\n| CAAAA\
    \ | 1 |\n| AAAC | 2 |\n| AAAA | 3 |\n| AACA | 1 |\n| ACAA | 1 |"
