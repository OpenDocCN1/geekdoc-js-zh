    \ {\n      vLink.requestChange(f.target.value);\n    };\n    return <input type=\"\
    text\" value={vLink.value} onChange={handleChange} />;\n  }\n});\n```\n\n# 第 8\
    \ 章 Props 的传递\n\n程序员在 React 中进行编程时希望创建抽象。。外部部分将有一个可以用于执行复杂操作的组件。\n\n## 手动传递\n\n"
- fmt: "\nYou need to pass the properties down most of the time. This is to make sure\
    \ that only a subset of the inner API has been exposed, and the one that is intended\
    \ to work.\n\nConsider the following program code:\n\n```javascript\nvar FCheckbox\
    \ = React.createClass({\n    render: function() {\n        var fClass = this.props.checked\
    \ ? 'FancyChecked' : 'FancyUnchecked';\n        return (\n            <div className={fClass}\
    \ onClick={this.props.onClick}>\n                {this.props.children}\n     \
    \       </div>\n        );\n    }\n});\n\nReact.render(\n    document.getElementById('sample')\n\
    );\n```\n\nJust write the program, and then run it. You will get the following\
    \ output:\n\n![](images/00020.gif)\n\nWe have created `FancyCheckBox` in React.\
    \ The transfer has been done manually.\n\n## Transfer with JSX\n\nPassing every\
    \ property along can be tedious and fragile most of the time. To avoid this, it\
    \ is recommended that you use destructing assignment together with rest properties\
    \ for the purpose of extracting unknown properties. All the properties which need\
    \ to be consumed should be listed out and then followed by `… other`. This is\
    \ demonstrated below:\n\n`var { checked, ...other } = this.props;`\n\nWith this,\
    \ all the props will be passed, with the exception of the ones being consumed.\
    \ Consider the program code shown below:\n\n```javascript\nvar FCheckbox = React.createClass({\n\
    \    render: function() {\n        var { checked, ...other } = this.props;\n \
    \       var fClass = checked ? 'FancyChecked' : 'FancyUnchecked';\n        //\
    \ `other` contains { onClick: console.log } but has no checked property\n    \
    \    return (\n            <div {...other} className={fClass} />\n        );\n\
    \    }\n});\n\nReact.render(\n    <FCheckbox checked={true} onClick={console.log.bind(console)}>\n\
    \        Hello there!\n    </FancyCheckbox>,\n    document.getElementById('sample')\n\
    );\n```\n\nJust write the above program, and then run it. The output will be as\
    \ follows:\n\n![](images/00020.gif)\n\nThis shows that we have successfully created\
    \ our fancy checkbox. The prop `checked` is a DOM attribute. In case you fail\
    \ to pass the property in the way shown above, then you might end up passing it\
    \ along. If you are passing unknown `other` props then use the property as shown\
    \ below:\n\n```javascript\nvar FCheckbox = React.createClass({\n    render: function()\
    \ {\n        var fClass = this.props.checked ? 'FancyChecked' : 'FancyUnchecked';\n\
    \        // ANTI-PATTERN: `checked` which will be passed down the inner component\n\
    \        return (\n            <div {...this.props} className={fClass} />\n  \
    \      );\n    }\n});\n```\n\n## Consumption and transfer of the same prop\n\n\
    It is possible that your component might need to consume and then transfer the\
    \ same prop. In this case, you can explicitly pass it using `checked = {checked}`.\
    \ This method is better compared to passing `this.prop` in full. The reason is\
    \ because it will be easy to lint and refactor. Consider the program code below:\n\
    \n```javascript\nvar FCheckbox = React.createClass({\n    render: function() {\n\
    \        var { checked, title, ...other } = this.props;\n        var fClass =\
    \ checked ? 'FancyChecked' : 'FancyUnchecked';\n        var fTitle = checked ?\
    \ 'X ' + title : 'O ' + title;\n        return (\n            <label>\n      \
    \          <input {...other} checked={checked} className={fClass} type=\"checkbox\"\
    \ />\n                {fTitle}\n            </label>\n        );\n    }\n});\n\
    ```\n\nJust write and run the above program. You will observe the following:\n\
    \n![](images/00021.gif)\n\nThe output shows a checkbox which has been checked\
    \ by default. You need to note that the order matters a lot. In case `… other`\
    \ comes before JSX, then it will be hard for the consumer of the props to do overriding.\
    \ In the above program, we are very sure that we will get an input of checkbox.\n\
    \nWith Rest properties, it is possible for you to do an extraction of the properties\
    \ of an object which are remaining into another object. Every property listed\
    \ in the pattern is not included. Consider the following:\n\n`var { a, b, ...c\
    \ } = { a: 1, b: 2, x: 3, y: 4 };`\n`a; // 1`\n`b; // 2`\n`c; // { x: 3, y: 4\
    \ }`\n\nThe program shows how to effectively implement ES7 proposal.\n\n## Transfer\
    \ with Underscore\n\nA library can be used instead of the JSX, and the same pattern\
    \ can be achieved. With the underscore, properties can be filtered out using `_.omit`\
    \ and can be copied into a new object using `_.extend`. The following program\
    \ code demonstrates this can be done:\n\n```javascript\nvar FCheckbox = React.createClass({\n\
    \    render: function() {\n        var cked = this.props.checked;\n        var\
    \ other = _.omit(this.props, 'ckd');\n        var fClass = cked ? 'FancyChecked'\
    \ : 'FancyUnchecked';\n        return (\n            React.DOM.div(_.extend({},\
    \ other, { className: fClass }))\n        );\n    }\n});\n```\n\nJust write the\
    \ program above, and then run it. You will observe the following output:\n\n![](images/00021.gif)\n\
    \nFrom the figure above, it is very clear that we have achieved the same result,\
    \ using a different method.\n\n# Chapter 9: React and Browsers\n\nWith React,\
    \ too much abstraction is provided in such a way that you do not even have to\
    \ access the DOM in a direct manner. In most cases, accessing the underlying API\
    \ is enough for you to be able to work with existing code or a third-party library.\n\
    \nReact Javascript is a fast programming language. It keeps a representation of\
    \ the DOM in memory, and the `render()` method is responsible for returning the\
    \ description of this DOM if needed. To update the browser, React must compute\
    \ the difference between the in-memory description and this description.\n\nThe\
    \ React’ “faked browser” is easier to use and performs well, so you should consider\
    \ using it most of the times. However, sometimes, you might need to access the\
    \ underlying API so as to work with a third-party library such as the JQuery plugin.\n\
    \n## findDOMNode() and Refs\n\nYou have to get a reference to a DOM node so as\
    \ to work with a browser in React. The function `React.findDOMNode(component)`\
    \ in React serves this purpose. You have to call it so as to get a reference to\
    \ the DOM node of your component. However, this function will only work on components\
    \ which have been placed on DOM, that is, mounted components, otherwise, an exception\
    \ will be thrown.\n\nConsider the following program code:\n\n```javascript\nvar\
    \ MComponent = React.createClass({\n    handleClick: function() {\n        //\
    \ focusing on the text input explicitly using raw DOM API.\n        React.findDOMNode(this.refs.mTxtInput).focus();\n\
