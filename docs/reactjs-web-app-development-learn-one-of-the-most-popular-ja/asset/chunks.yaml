    \ an element from the list, the function will keep it in the DOM. If you animate,\
    \ you will be notified that an animation which was expected has not happened.\
    \ The reason is because the function `ReactCSSTransitionGroup` will keep the elements\
    \ that you specify in the page until the transition is complete. Add this CSS\
    \ to your program:\n\n```css\n.sample-leave {\n    opacity: 1;\n    transition:\
    \ opacity .5s ease-in;\n}\n\n.sample-leave.sample-leave-active {\n    opacity:\
    \ 0.01;\n}\n```\n\nNote that the above program will only show a single transition.\
    \ It is possible for you to add an extra transition to the animation after the\
    \ initial transition. This can be done using the function `transitionAppear`.\
    \ Consider the following program, which uses the above function after setting\
    \ its value to `true`.\n\n```javascript\nrender: function() {\n  return (\n  \
    \  <ReactCSSTransitionGroup transitionName=\"sample\" transitionAppear=\"true\"\
    >\n      <h1>Fade the initial mount</h1>\n    </ReactCSSTransitionGroup>\n  );\n\
    }\n```\n\nThe following should be the CSS code for the above:\n\n```css\n.sample-appear\
    \ {\n    opacity: 0.01;\n    transition: opacity .5s ease-in;\n}\n\n.sample-appear.sample-appear-active\
    \ {\n    opacity: 1;\n}\n```\n\nIn order for the animation to be applied to the\
    \ children, the prop `transitionAppear` should be set to `true`. The `ReactCSSTransitionGroup`\
    \ can also be mounted to the DOM. Consider the example shown below:\n\n```javascript\n\
    render: function() {\n  var itms = this.state.itms.map(function(item, j) {\n \
    \   return (\n      <div key={itm} onClick={this.handleRemove.bind(this, j)}>\n\
    \        <ReactCSSTransitionGroup transitionName=\"sample\">\n          {itm}\n\
    \        </ReactCSSTransitionGroup>\n      </div>\n    );\n  }, this);\n\n  return\
    \ (\n    <div>\n      <button onClick={this.handleAdd}>Create Item</button>\n\
    \      {itms}\n    </div>\n  );\n}\n```\n\nJust try to run the program, and observe\
    \ what will happen. There will be no observed result. The reason is because the\
    \ `ReactCSSTransitionGroup` was mounted along the new item. To solve this problem,\
    \ mount the new item within the `ReactCSSTransitionGroup`.\n\nNote that it is\
    \ possible for the children of `ReactCSSTransitionGroup` to be zero or one. This\
    \ means that it is possible for a single element which enters or leaves to be\
    \ animated. Consider the following program:\n\n```javascript\nvar ReactCSSTransitionGroup\
    \ = React.addons.CSSTransitionGroup;\nvar ICarousel = React.createClass({\n  propTypes:\
    \ {\n    imageSrc: PropTypes.string.isRequired\n  },\n  render: function() {\n\
    \    return (\n      <div>\n        <ReactCSSTransitionGroup name=\"carousel\"\
    >\n          <img src={this.props.imgSrc} key={this.props.imgSrc} />\n       \
    \ </ReactCSSTransitionGroup>\n      </div>\n    );\n  }\n});\n```\n\nThe program\
    \ shows how to implement a simple carousel in React. You need to change the `imgSrc`\
    \ to the name of your image for the image to be animated. Notice that we have\
    \ used only a single image in the above example. However, it is possible to animate\
    \ multiple images in an carousel created in React. You might also want to disable\
    \ an animation. This can be done by setting the `transitionLeave` to `false` or\
    \ `transitionEnter` to `false`. The effect will be the same in both cases. This\
    \ feature can be applied if you want an enter animation but no leave animation.\
    \ Also, note that with `ReactTransitionGroup` there is no way how you can be notified\
    \ in case transition ends. You also can perform anything else which is complex\
    \ on your animation.\n\n# Chapter 7 Two-way Binding in React\n\nReact allows the\
    \ data to flow only one way, that is, from the owner to the child. This is due\
    \ to the use of `ReactLink`. It employs the use of the Von Architecture of computers.\
    \ However, you might need to read some data and then flow it back to the program\
    \ in your application. A good example is when you are creating forms. In this\
    \ case, you might need to update the state of React once you have received some\
    \ input from the user. This can also be applicable when the layout has been created\
    \ in Javascript, and then you want to react to any changes in the size of a DOM\
    \ element. In React, this can be easily implemented, which you will listen to\
    \ a `change` event, read from the source of your data, and finally call the `setState()`\
    \ on any of your components. If you need to create programs which are easy to\
    \ understand, then you can close the loop for data flow. Consider the sample program\
    \ given below:\n\n```javascript\nvar NLink = React.createClass({\n  getInitialState:\
    \ function() {\n    return {message: 'Hello there'};\n  },\n  handleChange: function(event)\
    \ {\n    this.setState({message: event.target.value});\n  },\n  render: function()\
    \ {\n    var mssge = this.state.mssge;\n    return <input type=\"text\" value={mssge}\
    \ onChange={this.handleChange} />;\n  }\n});\n```\n\nWe have just created a simple\
    \ form without making use of `ReactLink`. Just run the program, and observe the\
    \ output. It will be as follows: (images/00019.gif)\n\nThe form works just in\
    \ the right way. However, in case the form has several fields, we might need to\
    \ be more verbose. With `ReactLink`, we can save some typing time. Consider the\
    \ following code:\n\n```javascript\nvar WLink = React.createClass({\n  mixins:\
    \ [React.addons.LinkedStateMixin],\n  getInitialState: function() {\n    return\
    \ {message: 'Hello there'};\n  },\n  render: function() {\n    return <input type=\"\
    text\" valueLink={this.linkState('message')} />;\n  }\n});\n```\n\nNotice the\
