    Note that it is possible for the children of “ReactCSSTransmissionGroup” to be
    zero or one. This means that it is possible for a single element which enters
    or leaves to be animated. Consider the following program:


    varReactCSSTransitionGroup = React.addons.CSSTransitionGroup;


                  varICarousel = React.createClass({


