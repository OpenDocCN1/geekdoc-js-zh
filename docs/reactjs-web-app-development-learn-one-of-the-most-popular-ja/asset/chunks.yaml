    # Chapter 5


    Creating Forms in React


    It is possible to create forms in React which allow for user interaction. Both
    controlled and uncontrolled form components can be created. Write the following
    Javascript code and run it:


    render: function() {


                  return<input type="text" value="Hello there" />;


    }


    After running it, observe the output. It should be as follows:


    ![](images/00013.gif)


    The result shows a text box with the text which we specified. This should be the
    default text for the text box. However, you might need to change this default
    text. Consider the following Javascript code:


    getInitialState: function() {


                  return {value: ''Hello there''};


    },


    handleChange: function(event) {


                  this.setState({value: event.target.value});


    },


    render: function() {


                  var v = this.state.value;


    return<input type="text" value={v} onChange={this.handleChange} />;


    }


    After running the above code, you will notice that it will be possible for a user
    to provide other input into the text box rather than the one displayed by default.
    Suppose that you would like to do a truncation on what the user provides as input
    into the text box. This is a good feature in websites. Let’s say that you want
    to truncate this input into the first 150 characters. This can be done as follows:


    handleChange: function(event) {


                  this.setState({value: event.target.value.substr(0, 150)});


    }


    The above function will truncate what the user enters as input into the first
    150 characters. You now know how to create controlled components in React. It
    is also possible to create uncontrolled components in this language. Suppose that
    you want the text box to contain nothing in it, so that the user can provide the
    input that he or she wishes. This can be done as follows:


    render: function() {


                  return<input type="text" />;


    }


    Just write the code, and then run it. The following output will be observed:


    ![](images/00014.gif)


    The text box contains nothing in it. The user can then provide the input of his
    or her choice. This is an example of an uncontrolled element in React. Notice
    the use of the “render” function.


    Another component of a form in React is the Textarea. This will allow you to provide
    much input toit, especially when describing something. Consider the following
    code:


    render: function() {


                  return<textarea name="textarea">Provider a description.</textarea>


    />;


    }


    You can write and run the above program. It will provide the following output:


    ![](images/00015.gif)


    The figure shows the text area which we have just created. Withthis, the user
    can provide multiple lines when describing something. We have also provided a
    default text for the textarea, but this is not a must. You might not be interested
    in this.


    Sometimes, you might need to select your own choice from a set of provided options.
    This can be accomplished by use of a “select” in React. This is how a select is
    created in React:


    <select value="School">


    <option value="university">University</option>


    <option value="college">College</option>


    <option value="secondary">Secondary</option>


    <option value="primary">Primary</option>


    <option value="nursery">Nursery</option>


    </select>


    The above program should give the following output:


    ![](images/00016.gif)


    On clicking the arrow facing downwards, you will see the options which we specified.
    You can select the choice that you want from the ones being provided. The above
    component is controlled. However, you may want to make it uncontrolled. In this
    case, you will have to provide a default value for the same.


