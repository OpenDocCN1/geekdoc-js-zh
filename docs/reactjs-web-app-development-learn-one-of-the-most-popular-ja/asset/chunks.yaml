    \ 中的双向绑定\n\nReact 允许数据仅单向流动，即从所有者到子元素。这是由于使用了 `ReactLink`。它采用了计算机的冯·诺依架构。然而，你可能需要读取某些数据然后将其流回你的应用程序。一个很好的例子是当你创建表单时。在这种情况下，一旦收到用户的输入，你可能需要更新\
    \ React 的状态。这也适用于在 JavaScript 中创建布局，然后你想对 DOM 元素尺寸的更改做出响应。在 React 中，这可以很容易实现，将监听\
