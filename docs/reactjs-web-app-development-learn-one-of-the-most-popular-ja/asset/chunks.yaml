    What we have done is that a box has been drawn around each of the components.
    A name has then been given to each of the boxes. Notice that each of the above
    components only has a single task. Ifthe component grows, then divide it into
    a number of subcomponents.


    The header of the table which contains the “Attribute” and the “Value” labels
    is a component on its own. However, it is also possible to handle each separately
    if you need to do it that way, so do not be limited to the way we have done it
    above. A good example is when it grows, meaning that you might have to separate
    its components into a number of subcomponents. Notice that the components have
    been arranged into an hierarchy in which components to be placed inside other
    components should be treated as children.


    It is possible to implement this statically with React. In this case, since we
    already have our hierarchy, we can come up with an app that will render our data
    into a user interface, but there will be no interactivity. With this, much typing
    will be needed compared to thinking. In the latter version, much thinking will
    be needed compared to typing.


    For you to implement this, you must make it in such a way that components will
    use other components for the purpose of passing data. Props, which are normally
    used for the passage of data from the parent to child, are normally used in this
    case. The app can be developed using the top-down approach, in which you start
    with components higher up in the hierarchy or bottom-up, in which you start with
    the components down in the hierarchy.


    However, in the case of simple apps, the top-down approach is highly recommended
    while for large and complex apps, the bottom-up approach is used. In this case,
    we will come up with a set of reusable components. Since we are trying to make
    the app static, we will only use the “render()” method. The components located
    at the top of the hierarchy will have the task of taking the data model as a prop.
    In case changes are made to the underlying data model, then it will be easy to
    update the user interface after calling the “React.render()” method.


