    # Chapter 2


    Creating Components in React


    Components make it possible for React to call classes. To achieve this, one should
    do the following:


    varMainV = React.createClass({});


    After the above, the next step should be rendering it onto the screen. This can
    be achieved as follows:


    React.renderComponent(newMainV(), document.body);


    Let us demonstrate this with an example. Consider the following sample code:


    varMainV = React.createClass({


    getDefaultProps: function(){


    return {


    }


    },


    getInitialState: function(){


    return {


    }


    },


    render: function(){


    returnReact.DOM.div({


    className: ''root''


    }, ''My div'')


    }


    })


    Just write the code, and then run it. Observe the output that you get. It should
    be as follows:


    ![](images/00002.gif)


    The code outputs a “div” element which we have created together with the text
    which we have specified. This has been achieved very easily with React. It is
    important to note the use of the following methods:


    *   getDefaultProps: this method is callable only once, and it must be called
    before we can render the output on the screen. It has formed the first method
    to be called.


    *   getInitialState: the method can also be called once. It gives the default
    state of our component. Notice that it has been called after the method above;


    *   render: this method has the purpose of rendering the output or the result
    on the screen. It can only be called once.


