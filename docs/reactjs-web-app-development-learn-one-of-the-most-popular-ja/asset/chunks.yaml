    # 引言


    在过去，开发者（尤其是 Web 开发者）在开发单页应用时遇到了问题。这个问题一直持续到 React 的出现。这是一个有助于解决程序员遇到问题的 Javascript
    库。


    通过 React，人们可以开发大型应用程序并使用频繁变化的数据。这可以通过非常简单的方式来实现。注意，它仅用于开发应用程序界面，因为在 MVC（模型-视图-控制器）中，它只形成视图。


    可以将此库与其他 Javascript 库（如 AngularJS）集成。尽管它仅用于开发界面，但可以与其他响应事件的插件一起使用，从而创建出 Web 应用。


    在 DOM（文档对象模型）方面，它维护了一个自带的 DOM，这意味着它并不非常依赖浏览器的 DOM。


    这意味着通过与存储的内容进行对比，可以得知 DOM 的哪些部分发生了变化。它可以随后更新 DOM。


