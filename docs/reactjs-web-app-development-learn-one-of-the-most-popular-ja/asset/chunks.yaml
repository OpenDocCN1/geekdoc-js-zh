    },\n\nhandleChange: function(ev) {\n  this.setState({userInput: ev.target.value});\n\
    },\n\nclearAndFocusInput: function() {\n  this.setState({userInput: ''}); // Clearing\
    \ the input\n  // focusing on the <input /> now!\n},\n\nrender: function() {\n\
    \  return (\n    <div>\n      <div onClick={this.clearAndFocusInput}>\n      \
    \  Click for focusing and Resetting\n      </div>\n      <input\n        value={this.state.userInput}\n\
    \        onChange={this.handleChange}\n      />\n    </div>\n  );\n}\n});\n```\n\
    \nJust write the above program, and then run it. You will be presented with the\
    \ following output:\n\n![](images/00023.gif)\n\nIn the program, we want to tell\
    \ the input component to focus, once its value has been changed to an empty string.\
    \ This component cannot infer this from its props over time. We need to inform\
    \ it that it should become focused. However, the `render()` method returns a description\
    \ of the children at a particular time, rather than the actual composition of\
    \ the components of the child. This means that you should not entirely rely on\
    \ anything returned from the `render()` method, since it might not be meaningful\
    \ at a particular time.\n\nConsider the following counterexample being given:\n\
    \n```javascript\n// This is a counterexample. Avoid this.\n\nrender: function()\
    \ {\n  var mInput = <input />;// let us try to call a number of methods on this\n\
    \  this.rememberThisInput = mInput; // this will serve as an input in futureNOW!\n\
    \n  return (\n    <div>\n      <div>...</div>\n      {mInput}\n    </div>\n  );\n\
    }\n```\n\nIn the above example, we have created a real backing instance for the\
    \ out `<input />` element.\n\n## Ref Callback\n\nThe `ref` attribute can be used\
    \ as a callback function rather than as a name. Once the component has been mounted,\
    \ then execution of this element will be done immediately. The component being\
    \ referenced needs to be passed as a parameter, meaning that the parameter can\
    \ be used immediately by the callback function. The reference can also be saved\
    \ for future use.\n\nConsider the following example:\n\n```javascript\nvar App\
    \ = React.createClass({\n  getInitialState: function() {\n    return {userInput:\
    \ ''};\n  },\n\n  handleChange: function(ev) {\n    this.setState({userInput:\
    \ ev.target.value});\n  },\n\n  clearAndFocusInput: function() {\n    // Clearing\
    \ the input\n    this.setState({userInput: ''}, function() {\n      // After re-rendering\
    \ of the component, this code will be executed.\n      React.findDOMNode(this.refs.theInput).focus();\
    \   // Already focussed\n    });\n  },\n\n  render: function() {\n    return (\n\
    \      <div>\n        <div onClick={this.clearAndFocusInput}>\n          Click\
    \ forFocusing and Resetting\n        </div>\n        <input\n          ref=\"\
    theInput\"\n          value={this.state.userInput}\n          onChange={this.handleChange}\n\
    \        />\n      </div>\n    );\n  }\n});\n```\n\nIn the above example, the\
    \ returned result will be a description of an instance of `<input/>`. The program\
    \ should present to you the following interface:\n\n![](images/00024.gif)\n\n\
    However, the true instance is accessible via `this.refs.theInput`. This will always\
    \ return the correct instance, provided render returns the child component having\
    \ ref=\"input\"`. This is also applicable on higher-level components. Notice that\
    \ if a child is destroyed, the same thing happens to its ref. You should avoid\
    \ accessing refs inside the render method of any component.\n\n# Conclusion\n\n\
    It can be concluded that React Javascript, which people commonly refer to as ReactJS\
    \ or React.js is a Javascript library. It is open-source, meaning that you can\
    \ download it for free. Programmers use it to develop user interfaces for web\
    \ applications. The library was developed to help programmers solve problems that\
    \ they experience when developing simple page applications.\n\nIt is also possible\
    \ for developers to use this library for development of large web applications\
    \ which are able to access and manage data which change most frequently. The language\
    \ has the view of the web application, meaning that it can only be used for the\
    \ development of the interface part of the application. It is possible to integrate\
    \ it with other libraries belonging to Javascript so that the developed applications\
    \ can be amazing to the users.\n"
