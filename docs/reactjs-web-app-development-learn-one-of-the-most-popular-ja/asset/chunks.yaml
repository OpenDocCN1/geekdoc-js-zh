    #f0f\"\n    },\n    {\n      color: \"black\",\n      value: \"#000\"\n    },\n\
    \    {\n      color: \"yellow\",\n      value: \"#ff0\"\n    }\n  ]\n}\nvar rows\
    \ = getData();\nvar mainV = new MainV({\n  rows: rows\n});\n\nReact.renderComponent(mainV,\
    \ document.body);\n```\n\nAdd the following CSS:\n\n```css\n.box {\n  width: 45px;\n\
    \  height: 40px;\n  background-color: red;\n}\n```\n\nAdd the following HTML code:\n\
    \n```html\n<script type=\"text/javascript\" src=\"http://underscorejs.org/underscore-min.js\"\
    ></script>\n```\n\nJust run the program, and observe the output. It should be:\n\
    \n![](images/00006.gif)\n\nWhat we have done is we have just created a new instance\
    \ of `ItemRenderer`, then we have passed it into our object.\n\n## Adding state\n\
    \nTo change the state, use the following method: `setState({key: 'value'})`. It\
    \ is good to avoid changing the state using the following method: `this.state.key\
    \ = 'other value'`. If you need to be able to access the state immediately after\
    \ it has changed, use the following method: `setState({key: 'other value'})`.\n\
    \nLet us demonstrate this using an example. Write the following code:\n\n```javascript\n\
    var MainV = React.createClass({\n  getDefaultProps: function(){\n    return {\n\
    \      rows: null\n    }\n  },\n  getInitialState: function(){\n    return {\n\
    \    }\n  },\n  render: function(){\n    return React.DOM.div({\n      className:\
    \ 'root'\n    },\n    _.map(this.props.r, function(r){\n      return new ItemRendererV(r);\n\
    \    })\n  )\n  }\n})\n\nvar ItemRendererV = React.createClass({\n  getDefaultProps:\
    \ function(){\n    return {\n      color: null,\n      value: null\n    }\n  },\n\
    \  getInitialState: function(){\n    return {\n      selected: false\n    }\n\
    \  },\n  render: function(){\n    return React.DOM.div({\n      className: 'box\
    \ ' + (this.state.selected ? 'selected' : 'unselected'),\n      onClick: function(){this.setState({selected:\
    \ !this.state.selected})}.bind(this),\n      style: {\n        backgroundColor:\
    \ this.props.value\n      }\n    }, this.props.color)\n  }\n})\n\nvar getData\
    \ = function getData(){\n  return [\n    {\n      color: \"green\",\n      value:\
