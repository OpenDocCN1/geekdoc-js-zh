    ```\n\nOnce you have written the above program, just run it and observe the resulting\
    \ output. It will be as follows:\n\n![](images/00012.gif)\n\n# Chapter 5: Creating\
    \ Forms in React\n\nIt is possible to create forms in React which allow for user\
    \ interaction. Both controlled and uncontrolled form components can be created.\
    \ Write the following Javascript code and run it:\n\n```javascript\nrender: function()\
    \ {\n  return<input type=\"text\" value=\"Hello there\" />;\n}\n```\n\nAfter running\
    \ it, observe the output. It should be as follows:\n\n![](images/00013.gif)\n\n\
    The result shows a text box with the text which we specified. This should be the\
    \ default text for the text box. However, you might need to change this default\
    \ text. Consider the following Javascript code:\n\n```javascript\ngetInitialState:\
    \ function() {\n  return {value: 'Hello there'};\n},\nhandleChange: function(event)\
    \ {\n  this.setState({value: event.target.value});\n},\nrender: function() {\n\
    \  var v = this.state.value;\n  return<input type=\"text\" value={v} onChange={this.handleChange}\
    \ />;\n}\n```\n\nAfter running the above code, you will notice that it will be\
    \ possible for a user to provide other input into the text box rather than the\
    \ one displayed by default. Suppose that you would like to do a truncation on\
    \ what the user provides as input into the text box. This is a good feature in\
    \ websites. Let’s say that you want to truncate this input into the first 150\
    \ characters. This can be done as follows:\n\n```javascript\nhandleChange: function(event)\
    \ {\n  this.setState({value: event.target.value.substr(0, 150)});\n}\n```\n\n\
    The above function will truncate what the user enters as input into the first\
    \ 150 characters. You now know how to create controlled components in React. It\
    \ is also possible to create uncontrolled components in this language. Suppose\
    \ that you want the text box to contain nothing in it so that the user can provide\
    \ the input that he she wishes. This can be done as follows:\n\n```javascript\n\
    render: function() {\n  return<input type=\"text\" />;\n}\n```\n\nJust write the\
    \ code, and then run it. The following output will be observed:\n\n![](images/00014.gif)\n\
    \nThe text box contains nothing in it. The user can then provide the input of\
    \ his her choice. This is an example of an uncontrolled element in React. Notice\
    \ the use of the `render` function. Another component of a form in React is the\
    \ `textarea`. This will allow you to provide much input especially when describing\
    \ something. Consider the following code:\n\n```javascript\nrender: function()\
    \ {\n  return<textarea name=\"textarea\">Provider a description.<|textarea|>;\n\
    }\n```\n\nYou can write and run the above program. It will provide the following\
    \ output:\n\n![](images/00015.gif)\n\nThe figure shows the text area we have just\
    \ created. With this, the user can provide multiple lines describing something.\
    \ We have also provided a default text for the `textarea`, but this is not a must.\
    \ You might be interested in this. Sometimes, you might need to select your own\
    \ choice from a set of provided options. This can be accomplished by use of `select`\
    \ in React. This is how a select is created:\n\n```html\n<select value=\"School\"\
    >\n  <option value=\"university\">University</option>\n  <option value=\"college\"\
    >College</option>\n  <option value=\"secondary\">Secondary</option>\n  <option\
    \ value=\"primary\">Primary</option>\n  <option value=\"nursery\">Nursery</option>\n\
    </select>\n```\n\nThe above program should give the following:\n\n![](images/00016.gif)\n\
    \nOn clicking the arrow downwards, you will see the options we specified. You\
    \ can select the choice you want from the ones provided. The above component is\
    \ controlled. However, you may want to make it uncontrolled. In this case, you\
