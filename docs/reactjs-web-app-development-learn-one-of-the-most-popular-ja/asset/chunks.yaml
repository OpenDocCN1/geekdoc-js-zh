    # Chapter 7


    Two-way Binding Helpers in React


    React allows the data to flow only in one way, that is, from the owner to the
    child. This is due to the use of “ReactLink.”It employs the use of the mechanism
    of the Von Neumann Architecture of computers.


    However, you might need to read some data and then flow it back to the program
    in your application. A good example is when you are creating forms. In this case,
    you might need to update the state of React once you have received some input
    from the user. This can also be applicable when the layout has been created in
    Javascript,and then you want to react to any changes in the size of a DOM element.


    In React, this can be easily implemented, in which you will listen to a “change”
    event, read from the source of your data, and then finally call the “setState()”
    on any of your components. If you need to create programs which are easy to understand,
    then you can close the loop for data flow.


    Consider the sample program given below:


    varNLink = React.createClass({


                  getInitialState: function() {


                                return {message: ''Hello there''};


    },


    handleChange: function(event) {


                  this.setState({message: event.target.value});


    },


    render: function() {


                  varmssge = this.state.mssge;


                                return<input type="text" value={mssge} onChange={this.handleChange}
    />;


    }


    });


    We have just created a simple form without making use of “ReactLink.”Just run
    the program, and observe the output. It will be as follows:


    ![](images/00019.gif)


    The form works just in the right way. However, in case the form has several fields,
    we might need to be more verbose. With “ReactLink,” we can save some typing time.
    Consider the following code:


    varWLink = React.createClass({


                  mixins: [React.addons.LinkedStateMixin],


                  getInitialState: function() {


                                return {message: ''Hello there''};


    },


    render: function() {


                  return<input type="text" valueLink={this.linkState(''message'')}
    />;


    }


    });


    Notice the use of “ReactSateMixin” which has the task of adding the method “linkSate()”
    to the React component. This will, in turn, give a “ReactLink” object which provides
    the current state of the React, and a callback to it so as to change this state.
    Once you have run the program, a text field will be observed as shown below:


    ![](images/00019.gif)


    Objects which belong to the “ReactLink” can be passed either up or down the tree
    as props. This means that two-way binding can easily be set between states higher
    in the hierarchy and those deep in the hierarchy. The first phase of “ReactLink”
    is where you create it, and then the second phase involves using it.


    If you need to create a ReactLink without “LinkedStateMixin,”do the following:


    VarWMixin = React.createClass({


                  getInitialState: function() {


                                return {message: ''Hello there''};


    },


    handleChange: function(newValue) {


                  this.setState({message: newValue});


    },


    render: function() {


                  varvLink = {


                  value: this.state.message,


    requestChange: this.handleChange


    };


                  return<input type="text" valueLink={vLink} />;


    }


    });


    It is very clear that “ReactLink”objects contain only a value and a “RequestChange”
    prop.


    If you need to create a “ReactLink” without a valueLink, do the following:


    varWLink = React.createClass({


                  mixins: [React.addons.LinkedStateMixin],


                  getInitialState: function() {


                                return {message: ''Hello there''};


    },


    render: function() {


                  var vLink = this.linkState(''message'');


                                varhandleChange = function(f) {


                                valueLink.requestChange(f.target.value);


    };


    return<input type="text" value={vLink.value} onChange={handleChange} />;


    }


    });


    This will give you a text field, but without a valueLink.


