  trans: "\n在大多数情况下，你需要将属性向下传递。这是为了确保只暴露内部 API 的子集，并且是预期的工作部分。\n\n考虑以下程序代码：\n\n```javascript\n\
    var FCheckbox = React.createClass({\n    render: function() {\n        var fClass\
    \ = this.props.checked ? 'FancyChecked' : 'FancyUnchecked';\n        return (\n\
    \            <div className={fClass} onClick={this.props.onClick}>\n         \
    \       {this.props.children}\n            </div>\n        );\n    }\n});\n\n\
    React.render(\n    document.getElementById('sample')\n);\n```\n\n编写该程序并运行它。你将得到以下输出：\n\
    \n![](img/00020.gif)\n\n我们在 React 中创建了 `FancyCheckBox`。传递是手动完成的。\n\n## 使用 JSX\
    \ 进行传递\n\n在大多数情况下，沿用每一个属性可能是繁琐且脆弱的。为了避免这种情况，建议你使用解构赋值结合剩余属性（rest properties）来提取未知属性。所有需要被消耗的属性都应该列出来，然后紧跟\
    \ `… other`。下文所示：\n\n`var { checked, ...other } = this.props;`\n\n通过这种方式，所有的 props\
    \ 将被传递，被消耗的除外。考虑所示的程序代码：\n\n```javascript\nvar FCheckbox = React.createClass({\n\
    \    render: function() {\n        var { checked, ...other } = this.props;\n \
    \       var fClass = checked ? 'FancyChecked' : 'FancyUnchecked';\n        //\
    \ `other` 包含 { onClick: console.log } 但没有 checked 属性\n        return (\n     \
    \       <div {...other} className={fClass} />\n        );\n    }\n});\n\nReact.render(\n\
    \    <FCheckbox checked={true} onClick={console.log.bind(console)}>\n        Hello\
    \ there!\n    </FCheckbox>,\n    document.getElementById('sample')\n);\n```\n\n\
    编写上述程序并运行。输出将如下：\n\n![](img/00020.gif)\n\n这说明我们已经成功创建了我们的花式复选框。属性 `checked` 是一个\
    \ DOM 属性。如果你没有按照上述方式传递属性，那么你可能会将它直接传递下去。如果你正在传递未知的 `other` props，请像下面所示使用该属性：\n\
    \n```javascript\nvar FCheckbox = React.createClass({\n    render: function() {\n\
    \        var fClass = this.props.checked ? 'FancyChecked' : 'FancyUnchecked';\n\
    \        // 反模式模式：`checked` 将被传递给内部组件\n        return (\n            <div {...this.props}\
    \ className={fClass} />\n        );\n    }\n});\n```\n\n## 同一属性的消耗与传递\n\n你的组件可能需要消耗并传递同一个属性。在这种情况下，你可以显式地使用\
    \ `checked = {checked}` 来传递它。这种方法比完整地传递 `this.prop` 更好。原因是因为它更容易进行代码检查（lint）和重构。考虑下方的程序代码：\n\
    \n```javascript\nvar FCheckbox = React.createClass({\n    render: function() {\n\
    \        var { checked, title, ...other } = this.props;\n        var fClass =\
    \ checked ? 'FancyChecked' : 'FancyUnchecked';\n        var fTitle = checked ?\
    \ 'X ' + title : 'O ' + title;\n        return (\n            <label>\n      \
    \          <input {...other} checked={checked} className={fClass} type=\"checkbox\"\
    \ />\n                {fTitle}\n            </label>\n        );\n    }\n});\n\
    ```\n\n编写并运行上述程序。你将观察到以下情况：\n\n![](img/00021.gif)\n\n输出显示了一个默认被选中的复选框。你需要注意的是顺序非常重要。如果\
    \ `… other` 出现在 JSX 之前，那么属性的消耗者将很难进行覆盖。在上面的程序中，我们非常确定会得到一个复选框的输入。\n\n通过剩余属性（Rest\
    \ properties），你可以将对象中剩余的属性提取到另一个对象中。模式中列出的每个属性都不会被包含在。考虑以下：\n\n`var { a, b, ...c\
    \ } = { a: 1, b: 2, x: 3, y: 4 };`\n`a; // 1`\n`b; // 2`\n`c; // { x: 3, y: 4\
    \ }`\n\n该程序展示了如何有效实现 ES7 。\n\n## 使用 Underscore 进行传递\n\n可以使用库代替 JSX，并实现相同的模式。通过\
    \ Underscore，可以使用 `_.omit` 过滤属性，并可以使用 `_.extend` 将其拷贝到新对象中。下面的程序代码演示了这一点：\n\n\
    ```javascript\nvar FCheckbox = React.createClass({\n    render: function() {\n\
    \        var cked = this.props.checked;\n        var other = _.omit(this.props,\
    \ 'ckd');\n        var fClass = cked ? 'FancyChecked' : 'FancyUnchecked';\n  \
    \      return (\n            React.DOM.div(_.extend({}, other, { className: fClass\
    \ }))\n        );\n    }\n});\n```\n\n编写上面的程序并运行它。你将观察到以下输出：\n\n![](img/00021.gif)\n\
    \n从上面的图中清楚地看到，我们使用不同的方法实现了相同的结果。\n\n# 第 9 章：React 与浏览器\n\n在 React 中，提供了大量的抽象，以至于你甚至不需要直接访问\
    \ DOM。在大多数情况下，访问底层 API 就足够让你与现有代码或第三方库工作了。\n\nReact Javascript 是一种快速的编程语言。它在内存中保持\
    \ DOM 的表示，`render()` 方法负责在需要时返回该 DOM 的描述。为了更新浏览器，React 必须计算内存中的描述与此描述之间的差异。\n\n\
    React 的“伪造浏览器”更容易使用且性能良好，因此你应该大多数时候考虑使用它。然而，有时你可能需要访问底层 API 以与 JQuery 插件等第三方库工作。\n\
    \n## findDOMNode() 和 Refs\n\n在 React 中与浏览器工作时，你需要获取 DOM 节点的引用。React 中的 `React.findDOMNode(component)`\
    \ 函数用于此目的。你必须调用它来获取组件 DOM 节点的引用。但是，此函数仅对已放置在 DOM 中的组件有效，否则将抛出异常。\n\n考虑以下程序代码：\n\
    \n```javascript\nvar MComponent = React.createClass({\n    handleClick: function()\
    \ {\n        // 使用原生 DOM API 聚焦输入\n        React.findDOMNode(this.refs.mTxtInput).focus();\n\
    \    },\n    render: function() {\n        // ref 属性会在组件挂载后将组件引用\n        // 添加到\
    \ this 中。\n        return (\n            <div>\n                <input type=\"\
    text\" ref=\"mTxtInput\" />\n                <input\n                    type=\"\
    button\"\n                    value=\"Focussing on the text input\"\n        \
    \            onClick={this.handleClick}\n                />\n            </div>\n\
    \        );\n    }\n});\n\nReact.render(\n    <MComponent />,\n    document.getElementById('sample')\n\
    );\n```\n\n编写上述程序并运行它。观察你得到的输出。它应该是这样的：\n\n![](img/00022.gif)\n\n注意程序显示了我们需要的组件。程序还展示了我们可以使用\
    \ `refs` 来引用你拥有的组件，或者使用 `this` 获取当前的 React 组件。\n\n## 关于 Refs 的更多信息\n\n一旦你使用了 `render()`\
    \ 方法来显示应用程序的用户界面，你可能需要调用位于 render 方法返回的组件实例上的组件。\n\n然而，这种想法并不是为了让数据在应用程序中流动，因为响应式数据流直接或间接地负责了此工作。但是，了解如何实现它是好的，因为你将来可能想要使用它。考虑给定的程序：\n\
    \n```javascript\nvar Application = React.createClass({\n```\n"
