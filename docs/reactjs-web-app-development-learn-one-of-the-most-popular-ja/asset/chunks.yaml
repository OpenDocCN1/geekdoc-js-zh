    # Book Description


    This book is all about React Javascript. It begins by explaining what React is,
    and where it is used. The book also explains the origin of this language. A guide
    on how to get started with React is provided, including how to download the library
    and setting it up to be ready for use. You will also be guided on how to write
    your first React program.


    Sometimes, your program might involve a combination of a HTML, a CSS, and a React
    code. After reading this book, you will know how to write these separately, and
    then run them so as to achieve your result. Components, which are a common feature
    in React, are deeply explored in this book.


    The book discusses how to create components with no details left out. You will
    get to know how to add data to the components that you create in React, as well
    as creating subcomponents in React. The various ways in which one can add state
    to the components are explored:


    - Definition

    - Creating Components in React

    - Comment Box in React

    - Breaking the User Interface into an Hierarchy of Components

    - Creating Forms in React

    - Animations in React

    - Two-way Binding Helpers in React

    - Transferring Props

    - React and Browsers


    # Introduction


    Some years ago, developers, especially web developers, experienced problems when
    developing single page. This problem persisted until React was introduced. This
    is a Javascript library which helps in solving the problems experienced by programmers.


    With React, one can develop large applications and use data which can change frequently.
    This can be done in a very simple manner. Note that it can only be used to develop
    the interface part of your application, since in terms of MVC (mode-view-controller),
    it only forms the view.


    It is possible to integrate this library with other Javascript libraries such
    as AngularJS. Although it is used for development of the user interface alone,
    it is possible to use add-ons which react to events together with this library,
    so as to create amazing web applications.


    In terms of DOM (Data Object Manipulation), it maintains a DOM which it comes
    with, meaning that it doesn’t rely very much on the DOM of the browser.


    This means that it is easy to know the parts of the DOM which have changed by
    comparing it with the one being stored. It can then update the DOM of the browser.


    # Chapter 1 Definition


    This is a Javascript Library, and it is used for development of user interfaces.
    The library is open-source, and most people refer toit as `React.js` or `ReactJS`.
    The library was developed so as to solve the problems that programmers experience
    when developing applications which are single page. It is maintained by Instagram,
    Facebook, and a group which is made up of developers.


    ## Getting started with React Javascript


    You need to first download the library. This can be downloaded from GitHub. The
