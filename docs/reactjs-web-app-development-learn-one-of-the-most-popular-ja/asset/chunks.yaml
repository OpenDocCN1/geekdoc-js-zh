    ## Ref Callback


    The “ref” attribute can be used as a callback function rather than as a name.
    Once the component has been mounted, then execution of this element will be done
    immediately. The component being referenced needs to be passed as a parameter,
    meaning that the parameter can be used immediately by the callback function. The
    reference can also be saved for future use.


    Consider the following example:


    var App = React.createClass({


                  getInitialState: function() {


                  return {userInput: ''''};


    },


    handleChange: function(ev) {


                  this.setState({userInput: ev.target.value});


    },


    clearAndFocusInput: function() {


    // Clearing the input


                  this.setState({userInput: ''''}, function() {


    // After re-rendering of the component, this code will be executed.


    React.findDOMNode(this.refs.theInput).focus();   // Already focussed


    });


    },


    render: function() {


                  return (


    <div>


    <div onClick={this.clearAndFocusInput}>


    Click forFocusing and Resetting


    </div>


    <input


    ref="theInput"


                  value={this.state.userInput}


                  onChange={this.handleChange}


    />


    </div>


    );


    }


    });


    In the above example, the returned result will be a description of an instance
    of <input/>. The program should present to you the following interface:


    ![](images/00024.gif)


    However, the true instance is accessible via “this.refs.theInput.”This will always
    return the correct instance, provided render returns the child component having
    ref=”input.” This is also applicable on higher-level components. Notice that if
    a child is destroyed, the same thing happens to its ref. You should avoid accessing
    refs inside the render method of any component.


    # Conclusion


    It can be concluded that React Javascript, which people commonly refer to as ReactJS
    or React.js is a Javascript library. It is open-source, meaning that you can download
    it for free. Programmers use it to develop user interfaces for web applications.
    The library was developed to help programmers solve problems that they experience
    when developing simple page applications.


    It is also possible for developers to use this library for development of large
    web applications which are able to access and manage data which change most frequently.
    The language has the view of the web application, meaning that it can only be
    used for the development of the interface part of the application. It is possible
    to integrate it with other libraries belonging to Javascript so that the developed
    applications can be amazing to the users.


    For you to use the library, you need to begin by downloading it. The downloaded
    file will always be in a zipped format, meaning that it must be extracted after
    the download. The extracted components should be kept in the same directory where
    your React program files will be kept. You may also choose to correctly specify
    the path of the location of the extracted components. As long as you have the
    library, you are set to start programming.


    The writing of the code can be done in any of the editors, provided you are comfortable
    with it. There also are numerous editors available online for the purpose of writing
    React programs. A good example of these is the “jsfiddle.” With these, you will
    have not to download the Javascript library, but just to write your React code
    and then run it. React supports the use of components which one can use to call
    classes.


    One can also add data to React components. The language makes use of elements
    called “props,”which are responsible for the passage of data from the child to
    the parent. The user interface of an application developed in React can be broken
    into a hierarchy of components.'
