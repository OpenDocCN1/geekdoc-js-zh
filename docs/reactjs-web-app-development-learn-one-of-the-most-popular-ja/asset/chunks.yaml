    \ \"blue\",\n      value: \"#00f\"\n    },\n    {\n      color: \"magenta\",\n\
    \      value: \"#f0f\"\n    },\n    {\n      color: \"black\",\n      value: \"\
    #000\"\n    },\n    {\n      color: \"yellow\",\n      value: \"#ff0\"\n    }\n\
    \  ]\n}\nvar r = getData();\nvar mainV = new MainV({\n  r: r\n});\n\nReact.renderComponent(mainV,\
    \ document.body);\n```\n\nAdd the following CSS code:\n\n```css\n.box {\n  width:\
    \ 45px;\n  height: 40px;\n  background-color: red;\n}\n```\n\nAdd the following\
    \ HTML code:\n\n```html\n<script type=\"text/javascript\" src=\"http://underscorejs.org/underscore-min.js\"\
    ></script>\n```\n\nJust write the program, and then run it. The output should\
    \ be as follows:\n\n![](images/00007.gif)\n\n## Handling Events\n\nSometimes,\
    \ after selection of an item, you might need the parent view to be updated. This\
    \ can be done during the instantiation of the renderer, in which a prop with a\
    \ function is added. The function will be called by the item render when necessary.\n\
    \nLet us demonstrate this using an example. Write the following Javascript:\n\n\
