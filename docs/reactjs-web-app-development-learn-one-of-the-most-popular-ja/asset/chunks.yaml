    \n              a; // 1\n\n              b; // 2\n\n              c; // { x: 3,\
    \ y: 4 }\n\nThe program shows how to effectively implement an ES7 proposal experimentally.\n\
    \n## Transfer with an Underscore\n\nA library can be used instead of the JSX,\
    \ and the same pattern can be achieved. With the underscore, properties can be\
