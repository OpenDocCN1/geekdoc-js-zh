  trans: "\n在某个目录中提取文件内容。打开你喜欢的文本编辑器，如果你使用的是 Windows 可以使用，可以使用 `notepad` 或 `notepad++`。对于\
    \ Linux 和 Mac OS X 用户，请使用你喜欢的文本编辑器，如 Linux 下的 `VIM` 和 Mac 下的 `Emacs`。在编辑器中编写以下代码：\n\
    \n```javascript\nReact.render(\n  <h1>Hello, welcome to React!</h1>,\n  document.getElementById('hello')\n\
    );\n```\n\n写完代码后，将文件以 `.html` 扩展名保存，并保放在提取下载文件内容的相同目录中。用浏览器打开该文件，并观察输出。你应该观察到以下内容：\n\
    \n![](img/00001.gif)\n\n从上图中所示，非常清楚，代码已经生成了我们指定的输出文字。\n\n也可以单独编写 React 代码。编写以下\
    \ `src/hello.js` 代码：\n\n```javascript\nReact.render(\n  <h1>Hello, welcome to\
    \ React!</h1>,\n  document.getElementById('hello')\n);\n```\n\n只需将上述文件保存为 `.js`\
    \ 扩展名，以表示这是一个 Javascript 文件。然后如下从保存为 `.html` 扩展名的文件中引用它：\n\n```html\n<script type=\"\
    text/jsx\" src=\"src/hello.js\"></script>\n```\n\n此时 HTML 文件应更新如下：\n\n```html\n\
    </head>\n<!DOCTYPE html>\n<html\n<head>\n<title>Hello, welcome to React!</title>\n\
    <script src=\"build/react.js\"></script>\n<!-- No need for JSXTransformer! -->\n\
    <body>\n<div id=\"hello\"></</div>\n<script src=\"build/hello.js\"></script>\n\
    </body>\n</html>\n```\n\n然后你就可以就可以运行你的代码了，你将观察到以下输出：\n\n![](img/00001.gif)\n\n\
    显而周知，我们通过不同的方法实现了相同的结果。\n\n# 第 2 章：在 React 中创建组件\n\n组件使得 React 能够调用类。为了实现这一点，应该执行以下操作：\n\
    \n```javascript\nvar MainV = React.createClass({});\n```\n\n完成上述操作后，下一步应该是将其渲染到屏幕上。可以通过以下方式实现：\n\
    \n```javascript\nReact.renderComponent(new MainV(), document.body);\n```\n\n让我们通过一个示例来演示。考虑以下示例代码：\n\
    \n```javascript\nvar MainV = React.createClass({\n  getDefaultProps: function(){\n\
    \    return {\n    }\n  },\n  getInitialState: function(){\n    return {\n   \
    \ }\n  },\n  render: function(){\n    return React.DOM.div({\n      className:\
    \ 'root'\n    }, 'My div')\n  }\n})\n```\n\n只需编写代码并运行它。观察你得到的输出。它应该如下：\n\n![](img/00002.gif)\n\
    \n代码输出了我们一起创建的 `div` 元素，以及我们指定的文本。这通过 React 可以非常容易地实现。重要的是注意的是以下方法的使用：\n\n- `getDefaultProps`：该方法只能被调用一次，并且必须在我们在屏幕上渲染输出之前调用。它构成了第一个被调用的方法。\n\
    - `getInitialState`：该方法也可以被调用一次。它提供了我们组件的默认状态。注意它是在上述方法之后调用的；\n- `render`：该方法的目的是在屏幕上渲染输出或结果。它只能被调用一次。\n\
    \n## 向组件添加数据\n\n可以向我们上面创建的组件添加内容。这可以非常轻松地完成。考虑以下：\n\n编写以下 Javascript 代码：\n\n```javascript\n\
    var MainV = React.createClass({\n  getDefaultProps: function(){\n    return {\n\
    \      r: null\n    }\n  },\n  getInitialState: function(){\n    return {\n  \
    \  }\n  },\n  render: function(){\n    return React.DOM.div({\n      className:\
    \ 'root'\n    },\n    _.map(this.props.r, function(r){\n        return React.DOM.div({\n\
    \          className: 'box'\n        })\n    })\n    )\n  }\n})\n\nvar getData\
    \ = function getData(){\n  return [\n    { color: \"green\", value: \"#0f0\" },\n\
    \    { color: \"red\", value: \"#f00\" },\n    { color: \"cyan\", value: \"#0ff\"\
    \ },\n    { color: \"blue\", value: \"#00f\" },\n    { color: \"magenta\", value:\
    \ \"#f0f\" },\n    { color: \"black\", value: \"#000\" },\n    { color: \"yellow\"\
    , value: \"#ff0\" }\n  ]\n}\n\nvar r = getData();\nvar mainV = new MainV({\n \
    \ r: r\n});\n\nReact.renderComponent(mainV, document.body);\n```\n\n对应的 HTML 代码应如下：\n\
    \n```html\n<script type=\"text/javascript\" src=\"http://underscorejs.org/underscore-min.js\"\
    ></script>\n```\n\n对应的 CSS 代码如下：\n\n```css\n.box {\n  width: 45px;\n  height:\
    \ 40px;\n  background-color: red;\n}\n```\n\n只需运行程序，并观察输出，它应该如下：\n\n![](img/00003.gif\n\
    \n我们创建了几个 `div` 元素，但它们具有相同的背景。这意味着它们被连接在一起。为了区分这些框，可以通过更新 `render` 方法来实现。Javascript\
    \ 文件应该如下：\n\n```javascript\nvar MainV = React.createClass({\n  getDefaultProps:\
    \ function(){\n    return {\n      r: null\n    }\n  },\n  getInitialState: function(){\n\
    \    return {\n    }\n  },\n  render: function(){\n    return React.DOM.div({\n\
    \      className: 'root'\n    },\n    _.map(this.props.r, function(r){\n     \
    \ return React.DOM.div({\n        className: 'box',\n        style: {\n      \
    \    backgroundColor: r.value\n        }\n    }, r.color)\n    })\n    )\n  }\n\
    })\n```\n"
