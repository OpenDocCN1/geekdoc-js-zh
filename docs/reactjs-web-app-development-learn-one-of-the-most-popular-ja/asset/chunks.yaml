    \ return (\n\n              <div {...other} className={fClass} />\n\n);\n\n}\n\
    \n});\n\n              React.render(\n\n              <FCheckbox checked={true}\
    \ onClick={console.log.bind(console)}>\n\n              Hello there!\n\n</FancyCheckbox>,\n\
    \n              document.getElementById('sample')\n\n);\n\nJust write the above\
    \ program, and then run it. The output will be as follows:\n\n![](images/00020.gif)\n\
    \nThis shows that we have successfully created our fancy checkbox. The prop “checked”\
