  \n![](img/00009.gif)\n\n注意颜色的外观得到了增强。我们还在代码中添加了一种过渡效果。\n\n# 第 3 章：React 中的评论框\n\n\
  只需打开你的编辑器并编写以下代码：\n\n```html\n<!-- index.html -->\n<html>\n<head>\n  <title>React\
