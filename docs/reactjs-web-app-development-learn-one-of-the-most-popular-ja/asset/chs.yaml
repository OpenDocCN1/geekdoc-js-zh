  ></script>\n```\n\n一旦你写了上述程序，只需运行它并观察结果。输出将如下：\n\n![](img/00012.gif)\n\n# 第 5 章：在\
  \ React 中创建表单\n\n可以在 React 中创建允许用户交互的表单。可以创建受控和不受控表单组件。编写以下 Javascript 代码并运行它：\n\
  \n```javascript\nrender: function() {\n  return<input type=\"text\" value=\"Hello\
  \ there\" />;\n}\n```\n\n运行后，观察输出。它应该如下：\n\n![](img/00013.gif)\n\n结果显示了一个带有我们指定的文本的文本框。这应该是该文本框的默认文本。然而，你可能需要更改此默认文本。考虑以下\
  \ Javascript 代码：\n\n```javascript\ngetInitialState: function() {\n  return {value:\
  \ 'Hello there'};\n},\nhandleChange: function(event) {\n  this.setState({value:\
  \ event.target.value});\n},\nrender: function() {\n  var v = this.state.value;\n\
  \  return<input type=\"text\" value={v} onChange={this.handleChange} />;\n}\n```\n\
  \n运行上述代码后，你会注意到用户可以向文本框中提供其他输入，而不是默认显示的那个。假设你想对用户在文本框中提供的输入内容进行截断。这是网站中的一个很好的功能。假设你想将此输入内容截断为前\
  \ 150 个字符。可以这样操作：\n\n```javascript\nhandleChange: function(event) {\n  this.setState({value:\
  \ event.target.value.substr(0, 150)});\n}\n```\n\n上述函数将把用户输入的输入内容截断为前 150 个字符。你现在知道如何在\
  \ React 中创建受控组件了。在该语言中，也可以创建不受控组件。假设你想让文本框保持为空，这样用户就可以提供他们想要提供的输入。可以这样操作：\n\n```javascript\n\
  render: function() {\n  return<input type=\"text\" />;\n}\n```\n\n只需编写代码，然后运行它。将观察到以下输出：\n\
  \n![](img/00014.gif)\n\n文本框内是空的。用户随后可以提供他们选择的输入。这是 React 中不受控元素的一个示例。注意 `render`\
  \ 函数的使用。React 中表单的另一个组件是 `textarea`。这将允许你提供大量的输入，特别是在描述某些事情时。考虑以下代码：\n\n```javascript\n\
  render: function() {\n  return<textarea name=\"textarea\">提供描述。<|textarea|>;\n}\n\
  ```\n\n你可以编写并运行上述程序。它将提供以下输出：\n\n![](img/00015.gif)\n\n图片显示了我们刚刚创建的文本区域。通过它，用户可以提供多行内容来描述某些事情。我们还提供了一个选项，以便用户可以提供多行描述某些事情。我们还提供了一个默认值，但这并不是必须的。你可能需要从中选择。可以通过以下方式实现：\n\
  \n```html\n<select value=\"School\">\n  <option value=\"university\">大学</option>\n\
  \  <option value=\"college\">学院</option>\n  <option value=\"secondary\">中学</option>\n\
  \  <option value=\"primary\">小学</option>\n  <option value=\"nursery\">幼儿园</option>\n\
  </select>\n```\n\n上述程序应该给出：\n\nimages/00016.gif\n\n点击箭头，你将看到指定的选项。你可以从提供的选项中选择。上述组件是受控的。然而，你可能想让它是不受控的。\n\
  \n# 第 6 章：React 中的动画\n\nReact 有一个名为 `TransitionGroup` 的插件，它是用于在 React 中创建动画的高级 API。`TransitionGroup`\
  \ 也用于 CSS 的增强。程序员在 React 组件进入或离开 DOM 时使用它来执行动画。考虑以下一个列表元素淡入淡出的示例：\n\n```javascript\n\
  var CSTransitionGroup = React.addons.CSSTransitionGroup;\nvar toDo = React.createClass({\n\
  \  getInitialState: function() {\n    return {items: ['hello', 'there', 'click',\
  \ 'here']};\n  },\n  handleAdd: function() {\n    var nItems = this.state.items.concat([prompt('某些文本')]);\n\
  \    this.setState({items: nItems});\n  },\n  handleRemove: function(j) {\n    var\
  \ nItems = this.state.items;\n    nItems.splice(j, 1);\n    this.setState({items:\
  \ nItems});\n  },\n  render: function() {\n    var itms = this.state.items.map(function(item,\
  \ j) {\n      return (\n        <div key={itm} onClick={this.handleRemove.bind(this,\
  \ j)}>\n          {itm}\n        </div>\n      );\n    }.bind(this));\n    return\
  \ (\n      <div>\n        <button onClick={this.handleAdd}>创建项目</button>\n     \
  \   <ReactCSSTransitionGroup transitionName=\"sample\">\n          {itms}\n    \
  \    </ReactCSSTransitionGroup>\n      </div>\n    );\n  }\n});\n```\n\n只需编写上述代码，然后运行它。程序的第一个输出将如下：\n\
  \nimages/00017.gif\n\n这是我们在程序中指定的文本。程序应该动画化指定的文本。下一个要动画化的单词是“there”。它将将如下所示：\n\n\
  images/00018.gif\n\n这是我们指定的第二个单词。这将一直持续到我们指定的最后一个单词被动画化。动画是通过我们指定的元素的淡入淡出实现的。如果你需要使用\
  \ CSS 来触发过渡，请添加以下 CSS 代码并在列表中添加新项目：\n\n```css\n.sample-enter {\n  opacity: 0.01;\n\
  \  transition: opacity .5s ease-in;\n}\n.sample-enter.sample-enter-active {\n```\n\
  \n\n\n\n\n```css\n{\n    opacity: 1;\n}\n```\n\n发生的情况是，从列表中删除一个元素后，函数将将其保留在 DOM\
  \ 中。如果你执行了动画，你将收到通知，预期的动画没有发生。这是因为 `ReactCSSTransitionGroup` 函数会在过渡完成之前将你指定的元素保留在页面上。在你的程序中添加此\
  \ CSS：\n\n```css\n.sample-leave {\n    opacity: 1;\n    transition: opacity .5s\
  \ ease-in;\n}\n\n.sample-leave.sample-leave-active {\n    opacity: 0.01;\n}\n```\n\
  \n注意，上述程序将只显示一次过渡。你可以在初始过渡之后为动画添加一个额外的过渡。这可以通过 `transitionAppear` 函数来实现。考虑以下程序，它在将其值设置为\
  \ `true` 后使用了上述函数。\n\n```javascript\nrender: function() {\n  return (\n    <ReactCSSTransitionGroup\
  \ transitionName=\"sample\" transitionAppear=\"true\">\n      <h1>Fade the initial\
  \ mount</h1>\n    </ReactCSSTransitionGroup>\n  );\n}\n```\n\n以下应该是上述对应的 CSS 代码：\n\
  \n```css\n.sample-appear {\n    opacity: 0.01;\n    transition: opacity .5s ease-in;\n\
  }\n\n.sample-appear.sample-appear-active {\n    opacity: 1;\n}\n```\n\n为了让动画应用到子元素，属性\
  \ `transitionAppear` 应该设置为 `true`。`ReactCSSTransitionGroup` 也可以挂载到 DOM 中。考虑下方所示示例：\n\
  \n```javascript\nrender: function() {\n  var itms = this.state.itms.map(function(item,\
  \ j) {\n    return (\n      <div key={itm} onClick={this.handleRemove.bind(this,\
  \ j)}>\n        <ReactCSSTransitionGroup transitionName=\"sample\">\n          {itm}\n\
  \        </ReactCSSTransitionGroup>\n      </div>\n    );\n  }, this);\n\n  return\
  \ (\n    <<div>\n      <button onClick={this.handleAdd}>Create Item</button>\n \
  \     {itms}\n    </div>\n  );\n}\n```\n\n只需尝试运行该程序，并观察会发生什么。不会观察到任何结果。这是因为 `ReactCSSTransitionGroup`\
  \ 是随着新项目一起挂载的。要解决这个问题，请在 `ReactCSSTransitionGroup` 内部挂载新项目。\n\n注意，`ReactCSSTransitionGroup`\
  \ 的子元素可以是零为一个。这意味着进入或离开的单个元素是可以动画的。考虑以下程序：\n\n```javascript\nvar ReactCSSTransitionGroup\
  \ = React.addons.CSSTransitionGroup;\nvar ICarousel = React.createClass({\n  propTypes:\
  \ {\n    imageSrc: PropTypes.string.isRequired\n  },\n  render: function() {\n \
  \   return (\n      <div>\n        <ReactCSSTransitionGroup name=\"carousel\">\n\
  \          <img src={this.props.imgSrc} key={this.props.imgSrc} />\n        </ReactCSSTransitionGroup>\n\
  \      </div>\n    );\n  }\n});\n```\n\n该程序展示了如何在 React 中实现一个简单的轮播图。你需要将 `imgSrc`\
  \ 修改为你的图片名称以便对图片进行动画处理。注意我们在上面的示例中只使用了一张图片。然而，在 React 创建的轮播图中对多张图片进行动画处理是可能的。你可能还想禁用动画。这可以通过将\
  \ `transitionLeave` 设置为 `false` 或 `transitionEnter` 设置为 `false` 来实现。两种情况下的效果是相同的。如果你想要进入动画但不要离开动画，可以使用此功能。另外注意，在\
  \ `ReactTransitionGroup` 中，没有办法可以在过渡结束时被通知。你也可以对你的动画执行任何其他复杂的操作。\n\n# 第 7 章 React\
  \ 中的双向绑定\n\nReact 允许数据仅单向流动，即从所有者到子元素。这是由于使用了 `ReactLink`。它采用了计算机的冯·诺依架构。然而，你可能需要读取某些数据然后将其流回你的应用程序。一个很好的例子是当你创建表单时。在这种情况下，一旦收到用户的输入，你可能需要更新\
  \ React 的状态。这也适用于在 JavaScript 中创建布局，然后你想对 DOM 元素尺寸的更改做出响应。在 React 中，这可以很容易实现，将监听\
  \ `change` 事件，从数据源读取，并最终对你的任何组件调用 `setState()`。如果你需要创建易于理解的程序，就可以关闭数据流循环。考虑下方提供的示例程序：\n\
  \n```javascript\nvar NLink = React.createClass({\n  getInitialState: function()\
  \ {\n    return {message: 'Hello there'};\n  },\n  handleChange: function(event)\
  \ {\n    this.setState({message: event.target.value});\n  },\n  render: function()\
  \ {\n    var mssge = this.state.mssge;\n    return <input type=\"text\" value={mssge}\
  \ onChange={this.handleChange} />;\n  }\n});\n```\n\n我们刚刚在没有使用 `ReactLink` 的情况下创建了一个简单的表单。只需运行程序并观察输出。结果如下：(images/0019.gif)\n\
  \n即使没有 `ReactLink`，表单也能正常工作。但是，如果表单有多个字段，我们可能需要更冗长的。通过 `ReactLink` 我们可以节省时间。考虑以下代码：\n\
  \n```javascript\nvar WLink = React.createClass({\n  mixins: [React.addons.LinkedStateMixin],\n\
  \  getInitialState: function() {\n    return {message: 'Hello there'};\n  },\n \
  \ render: function() {\n    return <input type=\"text\" value={this.linkState('message')}\
  \ />;\n  }\n});\n```\n\n注意 `StateMixin` 的使用，它的任务是为 React 组件添加 `linkState()` 方法。这反过来会给\
  \ `ReactLink` 对象，提供 React 的当前状态以及一个更改此状态的回调。一旦运行程序，将看到像下面的文本框：(images/0019.gif)\n\
  \n属于 `ReactLink` 的对象可以通过 props 向上或向下传递。这意味着在高层和深层之间可以轻松设置双向绑定。`ReactLink` 的第一阶段是创建它，第二阶段涉及使用它。\n\
  \n如果你需要在没有 `valueLink` 的情况下创建 `ReactLink`，请参考以下：\n\n```javascript\nvar WMixin =\
  \ React.createClass({\n  getInitialState: function() {\n    return {message: 'Hello\
  \ there'};\n  },\n  handleChange: function(newValue) {\n    this.setState({message:\
  \ newValue});\n  },\n  render: function() {\n    var vLink = {\n      value: this.state.message,\n\
  \      requestChange: this.handleChange\n    };\n    return <input type=\"text\"\
  \ valueLink={vLink} />;\n  }\n});\n```\n\n显然，`ReactLink` 对象仅包含一个 `value` 和一个 `requestChange`\
  \ 属性。如果你需要在没有 `valueLink` 的情况下创建 `ReactLink`，可以使用：\n\n```javascript\nvar WLink =\
  \ React.createClass({\n  mixins: [React.addons.LinkedStateMixin],\n  getInitialState:\
  \ function() {\n    return {message: 'Hello there'};\n  },\n  render: function()\
  \ {\n    var vLink = this.linkState('message');\n    var handleChange = function(f)\
  \ {\n      vLink.requestChange(f.target.value);\n    };\n    return <input type=\"\
  text\" value={vLink.value} onChange={handleChange} />;\n  }\n});\n```\n\n# 第 8 章\
  \ Props 的传递\n\n程序员在 React 中进行编程时希望创建抽象。。外部部分将有一个可以用于执行复杂操作的组件。\n\n## 手动传递\n\n\n\n\
  \n在大多数情况下，你需要将属性向下传递。这是为了确保只暴露内部 API 的子集，并且是预期的工作部分。\n\n考虑以下程序代码：\n\n```javascript\n\
  var FCheckbox = React.createClass({\n    render: function() {\n        var fClass\
  \ = this.props.checked ? 'FancyChecked' : 'FancyUnchecked';\n        return (\n\
  \            <div className={fClass} onClick={this.props.onClick}>\n           \
  \     {this.props.children}\n            </div>\n        );\n    }\n});\n\nReact.render(\n\
  \    document.getElementById('sample')\n);\n```\n\n编写该程序并运行它。你将得到以下输出：\n\n![](img/00020.gif)\n\
  \n我们在 React 中创建了 `FancyCheckBox`。传递是手动完成的。\n\n## 使用 JSX 进行传递\n\n在大多数情况下，沿用每一个属性可能是繁琐且脆弱的。为了避免这种情况，建议你使用解构赋值结合剩余属性（rest\
  \ properties）来提取未知属性。所有需要被消耗的属性都应该列出来，然后紧跟 `… other`。下文所示：\n\n`var { checked, ...other\
  \ } = this.props;`\n\n通过这种方式，所有的 props 将被传递，被消耗的除外。考虑所示的程序代码：\n\n```javascript\n\
  var FCheckbox = React.createClass({\n    render: function() {\n        var { checked,\
  \ ...other } = this.props;\n        var fClass = checked ? 'FancyChecked' : 'FancyUnchecked';\n\
  \        // `other` 包含 { onClick: console.log } 但没有 checked 属性\n        return (\n\
  \            <div {...other} className={fClass} />\n        );\n    }\n});\n\nReact.render(\n\
  \    <FCheckbox checked={true} onClick={console.log.bind(console)}>\n        Hello\
  \ there!\n    </FCheckbox>,\n    document.getElementById('sample')\n);\n```\n\n\
  编写上述程序并运行。输出将如下：\n\n![](img/00020.gif)\n\n这说明我们已经成功创建了我们的花式复选框。属性 `checked` 是一个\
  \ DOM 属性。如果你没有按照上述方式传递属性，那么你可能会将它直接传递下去。如果你正在传递未知的 `other` props，请像下面所示使用该属性：\n\n\
  ```javascript\nvar FCheckbox = React.createClass({\n    render: function() {\n \
  \       var fClass = this.props.checked ? 'FancyChecked' : 'FancyUnchecked';\n \
  \       // 反模式模式：`checked` 将被传递给内部组件\n        return (\n            <div {...this.props}\
  \ className={fClass} />\n        );\n    }\n});\n```\n\n## 同一属性的消耗与传递\n\n你的组件可能需要消耗并传递同一个属性。在这种情况下，你可以显式地使用\
  \ `checked = {checked}` 来传递它。这种方法比完整地传递 `this.prop` 更好。原因是因为它更容易进行代码检查（lint）和重构。考虑下方的程序代码：\n\
  \n```javascript\nvar FCheckbox = React.createClass({\n    render: function() {\n\
  \        var { checked, title, ...other } = this.props;\n        var fClass = checked\
  \ ? 'FancyChecked' : 'FancyUnchecked';\n        var fTitle = checked ? 'X ' + title\
  \ : 'O ' + title;\n        return (\n            <label>\n                <input\
  \ {...other} checked={checked} className={fClass} type=\"checkbox\" />\n       \
  \         {fTitle}\n            </label>\n        );\n    }\n});\n```\n\n编写并运行上述程序。你将观察到以下情况：\n\
  \n![](img/00021.gif)\n\n输出显示了一个默认被选中的复选框。你需要注意的是顺序非常重要。如果 `… other` 出现在 JSX 之前，那么属性的消耗者将很难进行覆盖。在上面的程序中，我们非常确定会得到一个复选框的输入。\n\
  \n通过剩余属性（Rest properties），你可以将对象中剩余的属性提取到另一个对象中。模式中列出的每个属性都不会被包含在。考虑以下：\n\n`var\
  \ { a, b, ...c } = { a: 1, b: 2, x: 3, y: 4 };`\n`a; // 1`\n`b; // 2`\n`c; // {\
  \ x: 3, y: 4 }`\n\n该程序展示了如何有效实现 ES7 。\n\n## 使用 Underscore 进行传递\n\n可以使用库代替 JSX，并实现相同的模式。通过\
  \ Underscore，可以使用 `_.omit` 过滤属性，并可以使用 `_.extend` 将其拷贝到新对象中。下面的程序代码演示了这一点：\n\n```javascript\n\
  var FCheckbox = React.createClass({\n    render: function() {\n        var cked\
  \ = this.props.checked;\n        var other = _.omit(this.props, 'ckd');\n      \
  \  var fClass = cked ? 'FancyChecked' : 'FancyUnchecked';\n        return (\n  \
  \          React.DOM.div(_.extend({}, other, { className: fClass }))\n        );\n\
  \    }\n});\n```\n\n编写上面的程序并运行它。你将观察到以下输出：\n\n![](img/00021.gif)\n\n从上面的图中清楚地看到，我们使用不同的方法实现了相同的结果。\n\
  \n# 第 9 章：React 与浏览器\n\n在 React 中，提供了大量的抽象，以至于你甚至不需要直接访问 DOM。在大多数情况下，访问底层 API 就足够让你与现有代码或第三方库工作了。\n\
  \nReact Javascript 是一种快速的编程语言。它在内存中保持 DOM 的表示，`render()` 方法负责在需要时返回该 DOM 的描述。为了更新浏览器，React\
  \ 必须计算内存中的描述与此描述之间的差异。\n\nReact 的“伪造浏览器”更容易使用且性能良好，因此你应该大多数时候考虑使用它。然而，有时你可能需要访问底层\
  \ API 以与 JQuery 插件等第三方库工作。\n\n## findDOMNode() 和 Refs\n\n在 React 中与浏览器工作时，你需要获取\
  \ DOM 节点的引用。React 中的 `React.findDOMNode(component)` 函数用于此目的。你必须调用它来获取组件 DOM 节点的引用。但是，此函数仅对已放置在\
  \ DOM 中的组件有效，否则将抛出异常。\n\n考虑以下程序代码：\n\n```javascript\nvar MComponent = React.createClass({\n\
  \    handleClick: function() {\n        // 使用原生 DOM API 聚焦输入\n        React.findDOMNode(this.refs.mTxtInput).focus();\n\
  \    },\n    render: function() {\n        // ref 属性会在组件挂载后将组件引用\n        // 添加到\
  \ this 中。\n        return (\n            <div>\n                <input type=\"text\"\
  \ ref=\"mTxtInput\" />\n                <input\n                    type=\"button\"\
  \n                    value=\"Focussing on the text input\"\n                  \
  \  onClick={this.handleClick}\n                />\n            </div>\n        );\n\
  \    }\n});\n\nReact.render(\n    <MComponent />,\n    document.getElementById('sample')\n\
  );\n```\n\n编写上述程序并运行它。观察你得到的输出。它应该是这样的：\n\n![](img/00022.gif)\n\n注意程序显示了我们需要的组件。程序还展示了我们可以使用\
  \ `refs` 来引用你拥有的组件，或者使用 `this` 获取当前的 React 组件。\n\n## 关于 Refs 的更多信息\n\n一旦你使用了 `render()`\
  \ 方法来显示应用程序的用户界面，你可能需要调用位于 render 方法返回的组件实例上的组件。\n\n然而，这种想法并不是为了让数据在应用程序中流动，因为响应式数据流直接或间接地负责了此工作。但是，了解如何实现它是好的，因为你将来可能想要使用它。考虑给定的程序：\n\
  \n```javascript\nvar Application = React.createClass({\n```\n\n\n\n\n```javascript\n\
  getInitialState: function() {\n  return {userInput: ''};\n},\n\nhandleChange: function(ev)\
  \ {\n  this.setState({userInput: ev.target.value});\n},\n\nclearAndFocusInput: function()\
  \ {\n  this.setState({userInput: ''}); // Clearing the input\n  // focusing on the\
  \ <input /> now!\n},\n\nrender: function() {\n  return (\n    <div>\n      <div\
  \ onClick={this.clearAndFocusInput}>\n        Click for focusing and Resetting\n\
  \      </</div>\n      <input\n        value={this.state.userInput}\n        onChange={this.handleChange}\n\
  \      />\n    </div>\n  );\n}\n});\n```\n\n只需编写上述程序并运行。你将看到以下输出：\n\n![](img/00023.gif)\n\
  \n在程序中，我们想要告诉输入组件，当它的值更改为空字符串时让其获取焦点。该组件无法从其随时间变化的 props 中推断出这一点。我们需要通知它应该获取焦点。然而，`render()`\
  \ 方法返回的是特定时刻子元素的描述，而不是子组件的实际组成。这意味着你不应该完全依赖于 `render()` 方法返回的任何内容，因为它们在特定时刻可能是没有意义的。\n\
  \n考虑以下反例：\n\n```javascript\n// This is a counterexample. Avoid this.\n\nrender:\
  \ function() {\n  var mInput = <input />;// let us try to call a number of methods\
  \ on this\n  this.rememberThisInput = mInput; // this will serve as an input in\
  \ futureNOW!\n\n  return (\n    <div>\n      <div>...</div>\n      {mInput}\n  \
  \  </div>\n  );\n}\n```\n\n在上面的示例中，我们为输出 `<input />` 元素创建了一个真实的底层实例。\n\n## Ref 回调\n\
  \n`ref` 属性可以作为回调函数而不是名称。一旦组件完成，该元素的执行将立即完成。被引用的组件需要作为参数传递，这意味着该参数可以被回调函数立即使用。引用也可以被保存以供以后使用。\n\
  \n考虑以下示例：\n\n```javascript\nvar App = React.createClass({\n  getInitialState: function()\
  \ {\n    return {userInput: ''};\n  },\n\n  handleChange: function(ev) {\n    this.setState({userInput:\
  \ ev.target.value});\n  },\n\n  clearAndFocusInput: function() {\n    // Clearing\
  \ the input\n    this.setState({userInput: ''}, function() {\n      // 在组件重新渲染后，这段代码将被执行。\n\
  \      React.findDOMNode(this.refs.theInput).focus();   // Already focussed\n  \
  \  });\n  },\n\n  render: function() {\n    return (\n      <div>\n        <div\
  \ onClick={this.clearAndFocusInput}>\n          Click forFocusing and Resetting\n\
  \        </div>\n        <input\n          ref=\"theInput\"\n          value={this.state.userInput}\n\
  \          onChange={this.handleChange}\n        />\n      </div>\n    );\n  }\n\
  });\n```\n\n在上面的示例中，返回的结果是 `<input/>` 实例的描述。程序将向你展示以下界面：\n\n![](img/00024.gif)\n\
  \n然而，真实的实例可以通过 `this.refs.theInput` 访问。只要 render 返回了带有 `ref=\"input\"` 的子组件，它始终会返回正确的实例。这也适用于更高级别的组件。注意，如果子元素被销毁，其\
  \ ref 也会发生同样的情况。你应该避免在任何组件的 render 方法内部访问 refs。\n\n# 结论\n\n可以得出结论，人们常说的 ReactJS\
  \ 或 React.js 即 React Javascript 是一个 JavaScript 库。它是开源的，这意味着你可以免费下载。程序员使用它来开发 Web\
  \ 应用程序的用户界面。该库的开发目的是帮助程序员解决开发简单页面应用时遇到的问题。\n\n开发者也可以使用此库开发大型 Web 应用程序，能够访问和管理变化频繁的数据。该语言负责\
  \ Web 应用的视图，意味着它只能用于应用程序界面部分的开发。它可以与 JavaScript 的其他库集成，使得开发的应用程序对用户来说非常惊艳。\n\n"
