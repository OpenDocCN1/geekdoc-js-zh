  \  render: function() {\n    return (\n      <form>\n        <input type=\"text\"\
  \ placeholder=\"搜索...\" />\n        <p>\n          <input type=\"checkbox\" />\n\
  \          {' '}\n          仅显示可用学生\n        </p>\n      </form>\n    );\n  }\n\
  });\n\nvarFAttributeTable = React.createClass({\n  render: function() {\n    return\
