  Search...\" />\n        <p></p>\n      </form>\n    );\n  }\n});\n\nvarFAributeTable\
  \ = React.createClass({\n  render: function() {\n    return (\n      <div>\n   \
  \     <SearchBar />\n        <AttributeTable attributes={this.props} />\n      </div>\n\
  \    );\n  }\n});\n\nvar ATTRIBUTES = [\n  {color: \"First color\", value: \"#3498db\"\
