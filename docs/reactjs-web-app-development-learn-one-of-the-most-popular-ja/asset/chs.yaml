- "# ReactJS：Web 应用开发：学习最流行的 Javascript 库之一\n\n\n\n![](img/00025.jpeg)\n\n\n\n\n\n\
  \n\n\n\n\n\n\n# 书籍介绍\n\n本书完全关于 React Javascript。它首先解释了什么是 React 以及它在哪里使用。书中还解释了这种语言的起源。书中提供了如何开始学习\
  \ React 的指南，包括如何下载库以及将其设置好可以使用。你还将被指导如何编写第一个 React 程序。\n\n有时，你的程序可能涉及 HTML、CSS 和\
  \ React 代码的组合。在阅读这本书后，你将知道如何单独编写这些代码并运行它们以实现你的结果。组件是 React 中的一个常见特性，书中对其进行了深入探讨。\n\
  \n书中讨论了如何创建组件且不遗留任何细节。你将了解如何在 React 中创建的组件中添加数据，以及如何创建子组件。书中探讨了向组件添加状态的不同方法：\n\n\
  - 定义\n- 在 React 中创建组件\n- React 中的评论框\n- 将用户界面拆分为组件层级结构\n- 在 React 中创建表单\n- React\
  \ 中的动画\n- React 中的双向绑定助手\n- 属性的传递\n- React 与浏览器\n\n# 引言\n\n在过去，开发者（尤其是 Web 开发者）在开发单页应用时遇到了问题。这个问题一直持续到\
  \ React 的出现。这是一个有助于解决程序员遇到问题的 Javascript 库。\n\n通过 React，人们可以开发大型应用程序并使用频繁变化的数据。这可以通过非常简单的方式来实现。注意，它仅用于开发应用程序界面，因为在\
  \ MVC（模型-视图-控制器）中，它只形成视图。\n\n可以将此库与其他 Javascript 库（如 AngularJS）集成。尽管它仅用于开发界面，但可以与其他响应事件的插件一起使用，从而创建出\
  \ Web 应用。\n\n在 DOM（文档对象模型）方面，它维护了一个自带的 DOM，这意味着它并不非常依赖浏览器的 DOM。\n\n这意味着通过与存储的内容进行对比，可以得知\
  \ DOM 的哪些部分发生了变化。它可以随后更新 DOM。\n\n## 开始学习 React Javascript\n\n你首先需要下载库。这可以从 GitHub\
  \ 下载。下载的文件始终是压缩格式。你必须解压它才能使其可用。你编写代码的文件应该保存在解压下载内容的相同目录下。它们也应该以 `.html` 扩展名保存。\n\
  \n让我们通过在 React 中编写我们的第一个示例代码来演示：\n\n\n\n\n在某个目录中提取文件内容。打开你喜欢的文本编辑器，如果你使用的是 Windows\
  \ 可以使用，可以使用 `notepad` 或 `notepad++`。对于 Linux 和 Mac OS X 用户，请使用你喜欢的文本编辑器，如 Linux\
  \ 下的 `VIM` 和 Mac 下的 `Emacs`。在编辑器中编写以下代码：\n\n```javascript\nReact.render(\n  <h1>Hello,\
  \ welcome to React!</h1>,\n  document.getElementById('hello')\n);\n```\n\n写完代码后，将文件以\
  \ `.html` 扩展名保存，并保放在提取下载文件内容的相同目录中。用浏览器打开该文件，并观察输出。你应该观察到以下内容：\n\n![](img/00001.gif)\n\
  \n从上图中所示，非常清楚，代码已经生成了我们指定的输出文字。\n\n也可以单独编写 React 代码。编写以下 `src/hello.js` 代码：\n\n\
  ```javascript\nReact.render(\n  <h1>Hello, welcome to React!</h1>,\n  document.getElementById('hello')\n\
  );\n```\n\n只需将上述文件保存为 `.js` 扩展名，以表示这是一个 Javascript 文件。然后如下从保存为 `.html` 扩展名的文件中引用它：\n\
  \n```html\n<script type=\"text/jsx\" src=\"src/hello.js\"></script>\n```\n\n此时 HTML\
  \ 文件应更新如下：\n\n```html\n</head>\n<!DOCTYPE html>\n<html\n<head>\n<title>Hello, welcome\
  \ to React!</title>\n<script src=\"build/react.js\"></script>\n<!-- No need for\
  \ JSXTransformer! -->\n<body>\n<div id=\"hello\"></</div>\n<script src=\"build/hello.js\"\
  ></script>\n</body>\n</html>\n```\n\n然后你就可以就可以运行你的代码了，你将观察到以下输出：\n\n![](img/00001.gif)\n\
  \n显而周知，我们通过不同的方法实现了相同的结果。\n\n# 第 2 章：在 React 中创建组件\n\n组件使得 React 能够调用类。为了实现这一点，应该执行以下操作：\n\
  \n```javascript\nvar MainV = React.createClass({});\n```\n\n完成上述操作后，下一步应该是将其渲染到屏幕上。可以通过以下方式实现：\n\
  \n```javascript\nReact.renderComponent(new MainV(), document.body);\n```\n\n让我们通过一个示例来演示。考虑以下示例代码：\n\
  \n```javascript\nvar MainV = React.createClass({\n  getDefaultProps: function(){\n\
  \    return {\n    }\n  },\n  getInitialState: function(){\n    return {\n    }\n\
  \  },\n  render: function(){\n    return React.DOM.div({\n      className: 'root'\n\
  \    }, 'My div')\n  }\n})\n```\n\n只需编写代码并运行它。观察你得到的输出。它应该如下：\n\n![](img/00002.gif)\n\
  \n代码输出了我们一起创建的 `div` 元素，以及我们指定的文本。这通过 React 可以非常容易地实现。重要的是注意的是以下方法的使用：\n\n- `getDefaultProps`：该方法只能被调用一次，并且必须在我们在屏幕上渲染输出之前调用。它构成了第一个被调用的方法。\n\
  - `getInitialState`：该方法也可以被调用一次。它提供了我们组件的默认状态。注意它是在上述方法之后调用的；\n- `render`：该方法的目的是在屏幕上渲染输出或结果。它只能被调用一次。\n\
  \n## 向组件添加数据\n\n可以向我们上面创建的组件添加内容。这可以非常轻松地完成。考虑以下：\n\n编写以下 Javascript 代码：\n\n```javascript\n\
  var MainV = React.createClass({\n  getDefaultProps: function(){\n    return {\n\
  \      r: null\n    }\n  },\n  getInitialState: function(){\n    return {\n    }\n\
  \  },\n  render: function(){\n    return React.DOM.div({\n      className: 'root'\n\
  \    },\n    _.map(this.props.r, function(r){\n        return React.DOM.div({\n\
  \          className: 'box'\n        })\n    })\n    )\n  }\n})\n\nvar getData =\
  \ function getData(){\n  return [\n    { color: \"green\", value: \"#0f0\" },\n\
  \    { color: \"red\", value: \"#f00\" },\n    { color: \"cyan\", value: \"#0ff\"\
  \ },\n    { color: \"blue\", value: \"#00f\" },\n    { color: \"magenta\", value:\
  \ \"#f0f\" },\n    { color: \"black\", value: \"#000\" },\n    { color: \"yellow\"\
  , value: \"#ff0\" }\n  ]\n}\n\nvar r = getData();\nvar mainV = new MainV({\n  r:\
  \ r\n});\n\nReact.renderComponent(mainV, document.body);\n```\n\n对应的 HTML 代码应如下：\n\
  \n```html\n<script type=\"text/javascript\" src=\"http://underscorejs.org/underscore-min.js\"\
  ></script>\n```\n\n对应的 CSS 代码如下：\n\n```css\n.box {\n  width: 45px;\n  height: 40px;\n\
  \  background-color: red;\n}\n```\n\n只需运行程序，并观察输出，它应该如下：\n\n![](img/00003.gif\n\n\
  我们创建了几个 `div` 元素，但它们具有相同的背景。这意味着它们被连接在一起。为了区分这些框，可以通过更新 `render` 方法来实现。Javascript\
  \ 文件应该如下：\n\n```javascript\nvar MainV = React.createClass({\n  getDefaultProps:\
  \ function(){\n    return {\n      r: null\n    }\n  },\n  getInitialState: function(){\n\
  \    return {\n    }\n  },\n  render: function(){\n    return React.DOM.div({\n\
  \      className: 'root'\n    },\n    _.map(this.props.r, function(r){\n      return\
  \ React.DOM.div({\n        className: 'box',\n        style: {\n          backgroundColor:\
  \ r.value\n        }\n    }, r.color)\n    })\n    )\n  }\n})\n```\n\n\n\n```javascript\n\
  var getData = function getData(){\n  return [\n    {\n      color: \"green\",\n\
  \      value: \"#0f0\"\n    },\n    {\n      color: \"red\",\n      value: \"#f00\"\
  \n    },\n    {\n      color: \"cyan\",\n      value: \"#0ff\"\n    },\n    {\n\
  \      color: \"blue\",\n      value: \"#00f\"\n    },\n    {\n      color: \"magenta\"\
  ,\n      value: \"#f0f\"\n    },\n    {\n      color: \"black\",\n      value: \"\
  #000\"\n    },\n    {\n      color: \"yellow\",\n      value: \"#ff0\"\n    }\n\
  \  ]\n}\nvar r = getData();\nvar mainV = new MainV({\n  r: r\n});\n\nReact.renderComponent(mainV,\
  \ document.body);\n```\n\nCSS 代码应该如下：\n\n```css\n.box {\n  width: 45px;\n  height:\
  \ 40px;\n  background-color: red;\n}\n```\n\nHTML 文件应该包含以下代码：\n\n```html\n<script\
  \ type=\"text/javascript\" src=\"http://underscorejs.org/underscore-min.js\"></script>\n\
  ```\n\n只需编写程序并运行它。观察输出，结果应当如下：\n\n![](img/00005.gif)\n\n如上图所示，每个框中都添加了文本。\n\n##\
  \ 创建 React 的子组件\n\n这可以像我们在前面的章节中做的那样简单。我们只需要创建一个只有一个单一任务的 `ItemRenderer`。该组件将承担渲染数据的任务。编写以下\
  \ Javascript 代码：\n\n```javascript\nvar MainV = React.createClass({\n  getDefaultProps:\
  \ function(){\n    return {\n      r: null\n    }\n  },\n  getInitialState: function(){\n\
  \    return {\n    }\n  },\n  render: function(){\n    return React.DOM.div({\n\
  \      className: 'root'\n    },\n      _.map(this.props.r, function(r){\n     \
  \   return new ItemRendererV(r);\n      })\n    )\n  }\n})\n\nvar ItemRendererV\
  \ = React.createClass({\n  getDefaultProps: function(){\n    return {\n      color:\
  \ null,\n      value: null\n    }\n  },\n  render: function(){\n    return React.DOM.div({\n\
  \      className: 'box',\n      style: {\n        backgroundColor: this.props.value\n\
  \      }\n    }, this.props.color)\n  }\n})\n\nvar getData = function getData(){\n\
  \  return [\n    {\n      color: \"green\",\n      value: \"#0f0\"\n    },\n   \
  \ {\n      color: \"red\",\n      value: \"#f00\"\n    },\n    {\n      color: \"\
  cyan\",\n      value: \"#0ff\"\n    },\n    {\n      color: \"blue\",\n      value:\
  \ \"#00f\"\n    },\n    {\n      color: \"magenta\",\n      value: \"#f0f\"\n  \
  \  },\n    {\n      color: \"black\",\n      value: \"#000\"\n    },\n    {\n  \
  \    color: \"yellow\",\n      value: \"#ff0\"\n    }\n  ]\n}\nvar rows = getData();\n\
  var mainV = new MainV({\n  rows: rows\n});\n\nReact.renderComponent(mainV, document.body);\n\
  ```\n\n添加以下 CSS：\n\n```css\n.box {\n  width: 45px;\n  height: 40px;\n  background-color:\
  \ red;\n}\n```\n\n添加以下 HTML 代码：\n\n```html\n<script type=\"text/javascript\" src=\"\
  http://underscorejs.org/underscore-min.js\"></script>\n```\n\n只需运行程序并观察输出。它应当是：\n\
  \n![](img/00006.gif)\n\n我们所只是创建了 `ItemRenderer` 的新实例，然后将其传递到我们的对象中。\n\n## 添加状态 (state)\n\
  \n要更改状态，请使用以下方法：`setState({key: 'value'})`。避免使用以下方法更改状态：`this.state.key = 'other\
  \ value'`。如果你需要在状态更改后立即访问它，请使用以下方法：`setState({key: 'other value'})`。\n\n让我们通过示例来演示这一点。编写以下代码：\n\
  \n```javascript\nvar MainV = React.createClass({\n  getDefaultProps: function(){\n\
  \    return {\n      rows: null\n    }\n  },\n  getInitialState: function(){\n \
  \   return {\n    }\n  },\n  render: function(){\n    return React.DOM.div({\n \
  \     className: 'root'\n    },\n    _.map(this.props.r, function(r){\n      return\
  \ new ItemRendererV(r);\n    })\n  )\n  }\n})\n\nvar ItemRendererV = React.createClass({\n\
  \  getDefaultProps: function(){\n    return {\n      color: null,\n      value:\
  \ null\n    }\n  },\n  getInitialState: function(){\n    return {\n      selected:\
  \ false\n    }\n  },\n  render: function(){\n    return React.DOM.div({\n      className:\
  \ 'box ' + (this.state.selected ? 'selected' : 'unselected'),\n      onClick: function(){this.setState({selected:\
  \ !this.state.selected})},\n    }, this.props.color)\n  }\n})\n\n// ... (注：原文代码中\
  \ this.props.r 似乎是 this.props.rows 的笔误，此处保持代码逻辑不变，仅翻译说明)\n```\n\n*(注：由于原文提供的代码片段在状态演示部分存在逻辑不连续（如\
  \ `r` 与 `rows` 的不一致），根据“不要漏掉任何行”原则，翻译将严格遵循原文结构。)*\n\n我们所做的只是创建了一个 `ItemRenderer`\
  \ 的新实例，然后将其传递到我们的对象中。\n\n## 处理事件 (Events)\n\n当用户点击一个框时，我们希望改变它的状态。这可以通过 `onClick`\
  \ 属性来实现。在 `ItemRenderer` 组件中，我们可以使用 `setState` 方法来更新 `selected` 状态。\n\n```javascript\n\
  onClick: function(){\n  this.setState({selected: !this.state.selected})\n}\n```\n\
  \n通过这种方式，框的 `className` 会根据 `selected` 状态动态变为变为 `selected` 或 `unselected`。\n\n\n\
  \n```javascript\n__onItemRendererSelect: function(d){\n  // alert(d.color)\n},\n\
  \nrender: function(){\n  var _this = this;\n  returnReact.DOM.div({\n    className:\
  \ 'root'\n  },\n  _.map(this.props.r, function(r){\n    return new IRendererV({\n\
  \      d: r,\n      onSelect: _this.__onItemRendererSelect\n    });\n  })\n  )\n\
  }\n})\n\nvarIRendererV = React.createClass({\n  getDefaultProps: function(){\n \
  \   return {\n      d: {\n        color: null,\n        value: null\n      },\n\
  \      onSelect: null\n    }\n  },\n  getInitialState: function(){\n    return {\n\
  \      selected: false\n    }\n  },\n  __onClick: function(){\n    this.setState({selected:\
  \ !this.state.selected}, function(){\n      if(this.state.selected&&this.props.onSelect){\n\
  \        this.props.onSelect(this.props.d);\n      }\n    })\n  },\n  render: function(){\n\
  \    returnReact.DOM.div({\n      className: 'box ' + (this.state.selected ? 'selected'\
  \ : 'unselected'),\n      onClick: this.__onClick,\n      style: {\n        backgroundColor:\
  \ this.props.d.value\n      }\n    }, this.props.d.color)\n  }\n})\n\nvargetData\
  \ = function getData(){\n  return [\n    {\n      color: \"First color\",\n    \
  \  value: \"#3498db\"\n    },\n    {\n      color: \"second color\",\n      value:\
  \ \"#34495e\"\n    },\n    {\n      color: \"third color\",\n      value: \"#2ecc71\"\
  \n    },\n    {\n      color: \"fourth color\",\n      value: \"#e74c3c\"\n    },\n\
  \    {\n      color: \"fifth color\",\n      value: \"#f1c40f\"\n    },\n    {\n\
  \      color: \"sixth color\",\n      value: \"#1abc9c\"\n    },\n    {\n      color:\
  \ \"seventh color\",\n      value: \"#ecf0f1\"\n    }\n  ]\n}\n\nvar rows = getData();\n\
  varmainV = new MainV({\n  r: r\n});\n\nReact.renderComponent(mainV, document.body);\n\
  ```\n\nCSS 代码应该如下：\n\n```css\n.box {\n  width: 60px;\n  height: 60px;\n  background-color:\
