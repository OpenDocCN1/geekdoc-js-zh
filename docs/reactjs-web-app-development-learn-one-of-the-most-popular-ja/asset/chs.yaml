  >\n    varCommentBox = React.createClass({\n      render: function() {\n       \
  \ return (\n          <div className=\"commentBox\">\n            Hello there, this\
  \ is a comment box.\n          </div>\n        );\n      }\n    });\n\n    React.render(\n\
  \      <CommentBox />,\n      document.getElementById('content')\n    );\n  </script>\n\
  </body>\n</html>\n```\n\n这段代码将给你以下结果：\n\n![](img/00010.gif)\n\n输出显示了一个评论框。我们所做的是使用了\
  \ `React.createClass()` 方法创建了一个新的 React 组件。\n\n# 第 4 章：将用户界面拆分为层次化组件\n\n这通过 React\
  \ JavaScript 是可以实现的。编写以下 JavaScript 代码：\n\n```javascript\nvarAttributeCategoryRow\
  \ = React.createClass({\n  render: function() {\n    return (<tr><th colSpan=\"\
  2\">{this.props.category}</th></tr>);\n  }\n});\n\nvarAttributeRow = React.createClass({\n\
  \  render: function() {\n    var name = this.props.attribute.stocked ?\n    this.props.attribute.name\
  \ :\n    <span style={{color: 'red'}}>{this.props.attribute.name}</span>;\n    return\
  \ (\n      <tr>\n        <td>{name}</td>\n        <td>{this.props.attribute.value}</td>\n\
  \      </tr>\n    );\n  }\n});\n\nvarAttributeTable = React.createClass({\n  render:\
  \ function() {\n    var rs = [];\n    var lCategory = null;\n    this.props.attributes.forEach(function(attribute)\
  \ {\n      if (attribute.category !== lCategory) {\n        rs.push(<AttributeCategoryRow\
  \ category={attribute.category} />);\n        lCategory = attribute.category;\n\
  \      }\n      rs.push(<AttributeRow attribute={attribute} />);\n    });\n    return\
  \ (\n      <table>\n        <thead>\n          <tr>\n            <th>Attribute</th>\n\
  \            <th>Value</th>\n          </tr>\n        </thead>\n        <tbody>{rs}</tbody>\n\
  \      </table>\n    );\n  }\n});\n\nvar SearchBar = React.createClass({\n  render:\
