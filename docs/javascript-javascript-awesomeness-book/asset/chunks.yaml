- fmt: "\nAnd that’s the kind of things we want to be associate with, these days.\
    \ Leather jackets and a fluffy red goat.\n\nSo… how are we gonna print our fluffy\
    \ red goat into our screen?\n\nAll you need to do is to print `document`, follow\
    \ by a dot, and then type the word `write`.\n\nRight after that, you will have\
    \ to open parentheses `(` and close parentheses `)`. inside of these parentheses,\
    \ we will have quotation marks. \n\nAnd in the quotation marks, we will write\
    \ down “I’m printing a fluffy red goat… ”. Because… that’s what we do.\n\nAnd\
    \ in the end, just like any language, if we want to end a sentence, you will write\
    \ a dot, right?\n\nBut in javascript, we are writing a semicolon `;`.\n\n```javascript\n\
    document.write(“I’m printing fluffy red goat… ”);\n```\n\nWe will save our file,\
    \ and refresh our page and. Oh my!\n\nWe just printed our very own fluffy red\
    \ goat!\n\nAh! Hack! That’s too good to be a singular event!\n\nLet’s print more\
    \ of these!\n\n```javascript\ndocument.write(“I’m printing fluffy red goat… ”);\n\
    document.write(“I’m printing fluffy red goat… ”);\ndocument.write(“I’m printing\
    \ fluffy red goat… ”);\ndocument.write(“I’m printing fluffy red goat… ”);\n```\n\
    \nYay…… We are having lots of fluffy goats….!\n\nOK OK!!! … Now we want to warn\
    \ everybody, before we are printing our goats, to watch out! Fluffy red goats\
    \ are on the loose! Preferably with annoying pop up on the screen!\n\nSo we will\
    \ write down `alert`, and then we will open parentheses, and inside our parentheses,\
    \ we will have double quotation marks as well, and then we will write “watch out!\
    \ Red fluffy goats are on their way!”\n\nAnd we will close our statement with\
    \ a semicolon, as usual.\n\n```javascript\nalert(“watch out! Red Fluffy goats\
    \ are on their way! ”);\n```\n\nNow save your document and refresh the page, and…\
    \ oh! I am very impressed by your sort-of-a-road-sign thingy, warning everybody\
    \ about what could be… the end of time!\n\nBy the way, did you see that we place\
    \ our `alert` before the `document.write`, and refreshed the page, the alert showed\
    \ first, but you didn’t see the any of the text on your document just yet.\n\n\
    That’s because javascript is operate as a queue. First in the first statement,\
    \ then the second one… And so on!\n\nNow you know all about writing and printing\
    \ in your document, and all about annoying popups! As well as all about fluffy\
    \ red goats.\n\nIn the next chapter I’ll show you how to write comments.\n\n#\
    \ Chapter 6: Comments\n\nSsshhh!!! I have to tell you a secret.\n\nYesterday,\
    \ I went to a fortune teller!\n\nI sat on the chair, and then she approaches me\
    \ and said;\n\n“awww… My dearly beloved almighty, awesomely humble Gilad… I have\
    \ to tell you something about your students…”\n\nAnd you know me, I care a big\
    \ deal about my young padawans, so I asked… “what?”\n\nSo she told me; ”In the\
    \ near future, they will be working on a project… as web developers!”\n\nAnd I\
    \ was shocked! I said “WHAT??? Are you SURE? My students???”\n\nSo she said: “Wa…\
    \ Wait, I didn’t get to the point yet!”. And I was like “oh… Yeah… well… Carry\
    \ on“\n\n“ …In the near future, they will be working on a project… As web developers!!!\
