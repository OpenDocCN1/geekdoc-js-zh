  trans: "\n现在每当你想使用这个东西时，我们就不需要重新写我们的 `document.write` 了，还有我们的 `alert`……还有另一次 `document.write`……我们只需要再次调用我们的\
    \ `Congrats()` 函数即可！\n\n```\nCongrats();\nCongrats();\n```\n\n# 第 12 章\n\n## 函数参数\n\
    \n你知道那个叫“大交易”（Let’s make a deal）的游戏节目吗？你有 3 块帘子，你需要猜哪块帘子后面是一辆全新的闪亮汽车，而哪块后面是一只活生生的成年羊驼？\n\
    \n我一直在想，他们之后真的得带走那只羊驼吗……喂它、清理它的粪便、成为它的好朋友……即使他们对那只羊驼过敏，但他们觉得不安全，因为那是一只凶残的羊驼……\n\
    \n无论管怎样……\n\n今天我们将有一个“大交易”节目的 JavaScript 版本！\n\n首先，我们将有 3 个输入框，类型为按钮。每一个都代表一个帘子。\n\
    \n1 号帘子、2 号帘子和 3 号帘子。\n\n```html\n<input type=”button” value=”Curtain 1\" />\n\
    <input type=”button” value=”Curtain 2\" />\n<input type=”button” value=”Curtain\
    \ 3\" />\n```\n\n现在让我们为我们的函数留出空间：\n\n创建一个名为 `ShowCurtain` 的新函数，但不要让括号空着，输入 `prize`。（别担心，我们稍后会解释一切，让我先完成这个函数……）\n\
    \n现在我们将在函数内部写一个 `alert`，带有“你赢了”的消息，以及我们括号里的那个同样的奖品。\n\n```javascript\nfunction\
    \ ShowCurtain(prize){\n  alert(“You won” + prize);\n}\n```\n\n好了，让我们解释一下这个 `prize`\
    \ 到底是怎么回事……\n\n我们在括号里的任何东西都称为“参数”（parameter），我们的参数实际上表现得像动态变量……\n\n这意味着，当我们调用函数时，我们会在括号里设置参数，就像我们设置每个变量一样……然后，只要函数在运行，我们的参数就会存在并被使用。\n\
    \n好了，让我们尝试一些新东西，好吗？\n\n与其最后一次调用函数，我们可以在按钮被点击时调用它。\n\n所以给每个按钮添加一个名为 `onclick` 的属性，并将其设置为你的函数。记住，我们的函数要求一个\
    \ `prize` 参数，所以将其设置为任何你想要得到的奖品。因为我们已经在 HTML 属性中使用了双引号，所以改用单引号来包裹我们的字符串……这应该可以运行。\n\
    \n```html\n<input type=”button” value=”Curtain 1” onclick=”’a shiny brand new\
    \ tooth pick!’” />\n<input type=”button” value=”Curtain 2” onclick=”’a colorful\
    \ rubber band’” />\n<input type=”button” value=”Curtain 3” onclick=”’a living\
    \ Llama!’” />\n```\n\n好了，保存，刷新页面，让我们看看我们得到了什么：\n\n让我们打开 1 号帘子……它是……它是……是的！！！一根全新的闪亮牙签签！非常方便……非常方便……\n\
    \n……现在是 2 号帘子……观众们热情地欢呼……它是……噢我的天！一个彩色的橡皮筋！！！等不及要用它了！\n\n现在……3 号帘子……会是什么呢？噢我的天！！！我无法相信……我一直最喜爱的！一只活生生的羊驼！！！谁来喂这只动物啊！？\n\
    \n我简直不敢相信……多么美好的一天……\n\nJavaScript 函数参数？？还有一只活生生的羊驼？！老师还能要求些什么呢？！\n\n# 第 13 章\n\
    \n## 多重参数\n\n有时候，你可以拥有可以包含参数的函数，但你还需要添加另一个参数。\n\n在我们上一个例子中，我们有一个参数请求奖金，我们有一条消息告诉用户他赢了什么奖品，但如果我们想添加另一个信息，比如，用户刚刚打开的是哪几块帘子呢？\n\
    \n如果我们想实现这种任务，我们可以在括号中添加另一个参数。\n\n只需添加一个逗号，然后输入你想要添加的额外参数名。\n\n例如，为了让我们的消息更酷，我们将添加另一个名为\
    \ `curtainNumber` 的参数，然后在消息中提示“你打开了第 号帘子”，然后放上我们的参数，并像上一个例子一样继续写他赢了什么：\n\n```javascript\n\
    function ShowCurtain(curtainNumber, prize){\n  alert(“You opened curtain number\
    \ ”+ curtainNumber + “, You have won” + prize);\n}\n```\n\n现在我们将不同的帘子编号添加到按钮中，这样参数就知道了如何设置了。\n\
    \n`onclick=\" 1, ’a shiny brand new tooth pick!’ \"`\n\n但注意参数的顺序是重要的，如果我们把 `curtainNumber`\
    \ 作为第一个参数，我们也需要先设置它……\n\n好了，让我们测试我们的帘子！\n\n可以工作了！\n\n耶！\n\n# 第 14 章\n\n## 返回语句\
    \ (Return Statement)\n\n在之前的课程中，我们讨论了函数，我们的函数只是执行了一些操作，对吧？\n\n我们在屏幕上打印内容，按一个按钮就弹出一个消息，之类的……\n\
    \n但在某些情况下，你希望你的函数返回某个值，以便你以后可以使用。\n\n这就是为什么我们有 `return` 语句。\n\n让我们来看例子：\n\n写一个名为\
    \ `BasicAddition` 的函数，请求两个参数 `num1` 和 `num2`。它将返回两者的和。\n\n```javascript\nfunction\
    \ BasicAddition(num1,num2){\n  return num1 + num2;\n}\n```\n\n现在我们将调用函数，并放入参数\
    \ `1` 和 `2`。\n\n```javascript\nBasicAddition(1, 2);\n```\n\n（注：输入文本意外中断或包含重复块；我已对提供的内容进行了格式化。）\n"
- fmt: "\n# My Dream\n\nBefore I wanted to be a web developer, I always wanted to\
    \ be a hamster-tamer.\n\nYou know, just like a lion tamer that works with lions…\
    \ But… with hamsters.\n\nYou suppose to tame them, so they can… do stuff.\n\n\
    Anyway, sometimes I wonder what if I was going with my dream.\n\nAnd to make this\
    \ thought come true, I will use my javascript skills!\n\n# Javascript Conditions\n\
    \nIn Javascript, you can have conditions in your code. For example:\n\n- If `x`\
    \ is true, then… execute this code.\n- If `x` is false… Then… do that code.\n\
    - If `x` is greater than `y`, then run those functions…\n\nLet’s make it happened!\n\
    \nTo write an `if` statement, you should type `if`, then open parenthese, and\
    \ then inside of those parenthesis you should write your condition. Then you should\
    \ open curly brackets, and inside of those curly brackets, your code will be execute,\
    \ only if the condition is true.\n\n```javascript\nif(##YOUR CONDITION HERE##){\n\
    \    ##YOUR CODE HERE##\n}\n```\n\nSo let’s say we want to check if the number\
    \ 2 is really equals to the number 2. (you’ll never know, right?)\n\nLet’s make\
    \ two variables, `num1andnum2`. And we will set both to 2. So in the condition,\
    \ type `num1 == num2`.\n\nNote that we are having two equal signs, and not just\
    \ one equal sign. The reason for that, is that if we will type just one equal\
    \ sign, the browser will might confuse and think we want to set a new variable.\
    \ So two equal sign is the way to go, if you want to check if something is equal\
    \ to something.\n\nLet’s change our code here to just say “If I was a hamster-tamer,\
    \ my cow was broken”, because she might be someday!\n\n```javascript\nvar num2\
    \ = 2;\nvar num1 = 2;\nif(num1==num2){\n    document.write(“If I was hamster-tamer,my\
    \ cow was broken”);\n}\n```\n\nAnd let’s run this thing! And indeed that’s true,\
    \ 2 is equal to 2, after all, and we have a broken cow just now.\n\n## Not Equal\n\
    \nWhat if we want to check rather if 2 is not equal to 2. We should type instead\
    \ of two equal sign (let’s erase that), we need to type exclamation mark, followed\
    \ by equal sign. That’s “not equal”.\n\nSo let’s test just that.\n\n```javascript\n\
    if(num1 != num2){\n    document.write(“my cow is broken”);\n}\n```\n\nLet’s refresh\
    \ that, and yup! As we suspect! We don’t get any message, that means that 2 still\
    \ does equal 2, and because we check for if it’s not equal, the code doesn’t fire…\n\
    \nIf we will change `num1` into the number 3, and run the code again, we will\
    \ see that the code run perfectly, because 3 is not equal to 2.\n\n## Comparisons\n\
    \nLet’s learn another one! What if we want to check rather if 3 is greater than\
    \ 2. We will change our condition to this funky angle bracket…\n\n```javascript\n\
    var num2 = 3;\nvar num1 = 2;\nif(num1 > num2){\n    document.write(“my cow is\
    \ broken”);\n}\n```\n\nIf we want to check if 2 is greater than 3, we need to\
    \ change it to a greater sign.\n\n```javascript\nif(num1 < num2){\n    document.write(“my\
    \ cow is broken”);\n}\n```\n\nNow we can check if one number is “less than” the\
    \ other, or equal…\n\n```javascript\nif(num1 <= num2){\n    document.write(“my\
    \ cow is broken”);\n}\n```\n\nSo if we will check the number 4, it won’t run,\
    \ 3, it won’t run, 2… ? bam. Got it. And we can also check if it’s “greater than”\
    \ or “equal”\n\n```javascript\nif(num1 >= num2){\n    document.write(“my cow is\
    \ broken”);\n}\n```\n\n# Chapter 17: Else & Else if\n\nLet’s say you have a condition,\
    \ for example….the word “banana” equals to the word “banana”: And when it does,\
    \ you will have a function called `ChoppingBanana`.\n\n```javascript\nif(“banana”\
    \ == “banana”){\n    ChoppingBanana();\n}\n```\n\nTill now, nothin’ new, right?\
    \ Banana is a banana, and the code will be fire. And if I will replace one of\
    \ the bananas into a Pineapple… the `ChoppingBanana` function will not be fired…\
    \ right?\n\nBut let’s say I want some other function to be fire if the condition\
    \ is not true? What do I do? In this case, we need to type right after our last\
    \ curly brackets an `else` statement. and another curly brackets, and inside of\
    \ those curly brackets we can write our code.\n\n```javascript\nif(“banana” ==\
    \ “pineapple”){\n    ChoppingBanana();\n} else {\n    ChoppingPineapple();\n}\n\
    ```\n\nIf we want, we can write another condition as well, we will write `else\
    \ if` and another condition, say “banana” equals to “cherry”, and then another\
    \ curly brackets.\n\n```javascript\nif(“banana” == “pineapple”){\n    ChoppingBanana();\n\
    } else if(“banana” == “cherry”){\n    ChoppingCherry();\n} else {\n    ChoppingPineapple();\n\
    }\n```\n\nSo in this example, the browser will go first into the first `if`, and\
    \ ask the condition rather if a banana is a pineapple. If it’s not true, then\
    \ he will go to the next `if`, the `else if`, and ask… “Does a banana looks like\
    \ a cherry?” , well it doesn’t… Oh! One more thing… You can have as many `else\
    \ if` as we can wish!!! We can have like… A gazillion `else if`… If some condition\
    \ is true, it will be fire the code inside of it, and leave the whole bunch of\
    \ `ifs` and `else` and `else ifs` alone… But if it doesn’t, it will continue to\
    \ ask until it gets to the last `else`.\n\nThe `else` is the final try of our\
    \ browser, if no `if` statement and no `else if` was fired, than our browser will\
    \ be satisfied and go in. If your browser visited any condition, the `else` statement\
    \ will not be fired.\n\n# Chapter 18: Switch\n\nWho knows, maybe someday you will\
    \ have your own web development company. And as any other big company, it has\
    \ its own… vending machine! But we are not like any other big company, right ?\
    \ our vending machine will be special!\n\nSo we will have the… *drum* The Vending\
    \ Pending Machine! Our vending machine will make you pending. And… that’s it.\
    \ No soda or anything. Just… wait for a while, and go away.\n\nAlright, so first,\
    \ of course, we have to build our vending pending machine title.\n\n```html\n\
    <h1>The Vending Pending Machine</h1>\n```\n\nNow we need to build the vending\
    \ machine function.\n\n```javascript\nfunction VendingMachine(pendingTime){\n\
    \    switch(pendingTime){\n        case 1:\n            // CODE FOR #1…\n    \
    \        break;\n        case 2:\n            // CODE FOR #2…\n            break;\n\
    \        case 3:\n            // CODE FOR #3…\n            break;\n        default:\n\
    \            // DEFAULT CODE…\n    }\n}\n```\n\nLet’s populate our cases!\n\n\
    ```javascript\nfunction PendingMessage(time){\n    alert(“The Vending Pending\
    \ Machine says you have to wait ”+ time + “ minutes”);\n}\n```\n\nNow we need\
