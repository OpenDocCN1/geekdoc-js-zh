    让我通过在我们的文本编辑器中写写来向你解释：


    我将编写 `var`、`name`，赋值为 `9`：


    ```javascript

    var name = 9;

    document.write(name);

    ```


    这就是我们在上一节课中做的内容，对吧？


    我们有一个名为 `name` 的变量，它等于数字 `9`。


    但是，我的名字不是九（nine），对吧？（我发誓真的不是！）


    让我们尝试删掉数字 9，把它换成我的名字。


    ```javascript

    var name = gilad;

    document.write(name);

    ```


    保存，刷新，让我们看看这里显示什么……


    啊！什么都没有显示！发生什么了？


    `9` 和 `gilad` 之间的区别在于，“gilad”是一段文本（或者用 Javascript 喜欢称呼的话：“字符串”/string）。而 `9` 只是一个数字。


    问题在于，javascript 很容易认为 `gilad` 可能只是另一个变量，正因为它可能是一个变量，它会尝试在整个页面中查找它。当它找不到时，它就说……“噢，好吧……我已经尽力了，我在哪里都找不到它……那我就什么都不做，休息一下吧……”（过早放弃了，哈？）


    要明确地告诉 Javascript 我们这里有一个字符串，我们需要将文本包裹在引号内。


    让我们这样做：


    ```javascript

    var name = “gilad”;

    document.write(name);

    ```


    保存，刷新，然后……没错，亲爱的！我们还是搞定了！


    所以现在我们知道有两个不同类型的变量。


    数字和字符串。


    而它们之间的区别就是那个小引号。


    在 javascript 中我们还有其他类型的变量，我们将在稍后的课程中介绍它们。


    # 第 9 章：使用不同类型的 `var`


    你知道 Javascript 可以帮你做作业吗？


    如果我早知道了，我 5 岁就会学 Javascript 了！


    这是一个例子：


    ```javascript

    document.write(3 + 3);

    ```


    这在一年级可能会很有用，你不觉得吗？


    嗯……让我们尝试一下……


    我会声明 `twovars`，第一个命名为 `num1` 并将其设置为 `4`，然后第二个我命名为 `num2`，并将其设置为数字 `2`。


    现在在 `document.write` 中，我将 `3 + 3` 替换为 `num1 + num2` 并运行。


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 + num2);

    ```


    好了……我们得到了 `6`。太棒了！我们学了新东西！我们实际上可以把变量相加！想象一下这些可能性！


    但我想如果我把……比如……`4` 改成 `“4”`你知道的，作为一个字符串……会发生什么


    好了，让我们戴上疯狂科学家的眼镜试一下：


    ```javascript

    var num1 = “4”;

    var num2 = 2;

    document.write(num1 + num2);

    ```


    噢，这真奇怪……`42`？


    我的意思是，我知道生命、宇宙和一切的答案是 `42`，但是……我没问那个……


    让我们看看发生了什么：


    首先，我们输入了 `num1` 等于 `4`。但由于我们在 `4` 周围有引号，它会被视为“字符串”而不是数字。所以我们的浏览器只是在屏幕上打印了 `4`。然后，我们加上了
    `2`。但由于我们的 `4` 只是一个字符串，浏览器并没有认为这是一个数学题，而是直接把它原样加到了屏幕上……


    所以我们可以轻松将 `4` 替换为 `“I love you “`


    如果我们刷新页面，就可以看到你的浏览器爱你 `2`。


    浏览器！！！你这个傻瓜……


    # 第 10 章：数学运算符


    在数学中，我们有 4 种你可以进行的 Basic 运算。


    加、减、乘、除。


    在上一节课中，我们已经看到可以在 javascript 中相加数字。


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 + num2);

    ```


    除了基础加法之外，我们在 Javascript 中还有另一种数学运算。


    让我们看看其他的。


    我们有减法：


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 - num2);

    ```


    你只需要写减号即可。


    如果你想让数字相乘，不要写字母 `x` 之类的字符，直接写星号即可：


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 * num2);

    ```


    这是乘法。


    我们也可以除法。


    你只需要输入正斜杠。


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 / num2);

    ```


    这就是除法。


    现在我有一个奖励送给你们！


    假设你想让一个数字加 1。


    所以……当然了……你可以写像这样的代码：


    ```javascript

    var num1 = 4;

    document.write(num1 + 1);

    ```


    但是！如果你像我一样是个懒人，你可以简写成这样：


    ```javascript

    var num1 = 4;

    document.write(num1++);

    ```


    或者如果我们想让数字减 1，可以这样做：


    ```javascript

    var num1 = 4;

    document.write(num1--);

    ```


    或者如果我们想让数字减 1：`++` 或 `--`。


