    现在……注意，我们有一个“发送”按钮……所以……我们必须把表单发送到某个地方，对吧？让我给我们的样式标签里添加一些小花样……


    <style>

    #sendItem{

    background-color: red;

    width: 200px;

    margin: 30px;

    padding: 30px;

    transition: 3s all;

    left:0;

    }

    .leftTrans{ left: 3000px !important; }

    </style>


    我添加了另一个名为 `leftTrans` 的类，并对我们的 `sendItem` id 添加了更多修改……


    现在，在我们成功输入密码组合后，表单将被发送给我们——这些反派！让我们在 `else` 语句中添加 `var y`，它将获取 `sendItem` 的 id，这样我们访问
    `sendItem` 元素……现在，我们将获取变量 `y` 并添加一个名为 `leftTrans` 的类。


    ```javascript

    else{

    var y = document.getElementById(“sendItem”);

    y.className += “leftTrans”;

    }

    ```


