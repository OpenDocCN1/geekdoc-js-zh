  trans: "\n\n# 我的梦想\n\n在我想成为一名 Web 开发人员之前，我一直想成为一名仓鼠驯养师。\n\n你知道的，就像一个和狮子工作的狮子戏演员……但是……是仓鼠。\n\
    \n你应该驯服它们，这样它们就能……做些事情。\n\n总之，有时我会想，如果我追随自己的梦想会怎样。\n\n为了让这个想法变成现实我将使用我的 javascript\
    \ 技术！\n\n# Javascript 条件\n\n在 Javascript 中，你可以在代码中编写条件。例如：\n\n- 如果 `x` 为真，那么……执行这段代码。\n\
    - 如果 `x` 为假……那么……执行那段代码。\n- 如果 `x` 大于 `y`，那么运行那些函数……\n\n让我们把它实现吧！\n\n要写一个 `if`\
    \ 语句，你应该输入 `if`，然后打开括号，在括号内编写你的条件。然后你应该打开大括号，在大括号内部，只有当条件为真时，你的代码才会执行。\n\n```javascript\n\
    if(##在此处输入你的条件##){\n    ##在此处输入你的代码##\n}\n```\n\n假设我们要检查数字 2 是否真的等于数字 2。（你永远不知道，对吧？）\n\
    \n让我们创建两个变量 `num1andnum2`。我们将它们都设置为 2。因此在条件中，输入 `num1 == num2`。\n\n注意，我们使用的是两个等号，而不是一个等号。之所以这样做，是因为如果我们只输入一个等号，浏览器可能会混淆，并认为我们想要设置一个新的变量。所以，如果你想检查某个东西是否等于另一个东西，两个等号是正确的做法。\n\
    \n让我们修改代码，只说“如果我是仓鼠驯养师，我的牛就坏了”，因为也许有一天它会坏！\n\n```javascript\nvar num2 = 2;\nvar\
    \ num1 = 2;\nif(num1==num2){\n    document.write(“If I was hamster-tamer,my cow\
    \ was broken”);\n}\n```\n\n让我们运行它吧！确实如此，2 到底等于 2，我们刚刚有一头坏掉的牛。\n\n## 不等于\n\n如果我们想检查\
    \ 2 是否不等于 2 呢？我们应该代替两个等号（把它删掉），我们需要输入感叹号，后面跟着等号。这表示“不等于”。\n\n让我们测试一下。\n\n```javascript\n\
    if(num1 != num2){\n    document.write(“my cow is broken”);\n}\n```\n\n刷新一下，没错！正如我们预料的那样！没有得到任何消息，这意味着\
    \ 2 仍然等于 2，因为我们检查的是它是否相等，所以代码没有触发……\n\n如果我们把 `num1` 改为数字 3 并再次运行代码，我们会看到代码运行得完美，因为\
    \ 3 不等于 2。\n\n## 比较\n\n让我们学习另一个吧！如果我们想检查 3 是否大于 2 呢？我们将条件条件修改为这个奇怪的角括号……\n\n```javascript\n\
    var num2 = 3;\nvar num1 = 2;\nif(num1 > num2){\n    document.write(“my cow is\
    \ broken”);\n}\n```\n\n如果我们想检查 2 是否大于 3，我们需要将其改为大于号。\n\n```javascript\nif(num1\
    \ < num2){\n    document.write(“my cow is broken”);\n}\n```\n\n现在我们可以检查一个数字是否“小于”另一个数字，或者等于……\n\
    \n```javascript\nif(num1 <= num2){\n    document.write(“my cow is broken”);\n\
    }\n```\n\n所以如果我们检查数字 4，它不会运行；3，不会运行；2……？砰。懂了。我们还可以检查它是否“大于”或“等于”。\n\n```javascript\n\
    if(num1 >= num2){\n    document.write(“my cow is broken”);\n}\n```\n\n# 第 17 章：Else\
    \ & Else if\n\n假设你有一个条件，例如……单词“banana”等于单词“banana”：当它成立时，你将有一个名为 `ChoppingBanana`\
    \ 的函数。\n\n```javascript\nif(“banana” == “banana”){\n    ChoppingBanana();\n}\n\
    ```\n\n到目前为止，没什么新奇的，对吧？香蕉就是香蕉，代码会执行。如果我把其中一个香蕉换成菠萝……`ChoppingBanana` 函数将不会触发……对吧？\n\
    \n但如果我想在条件不为真时让另一个函数触发呢？我该怎么办？在这种情况下，我们需要在最后一个大括号之后输入一个 `else` 语句，以及另一个大括号，在大括号内部我们可以编写我们的代码。\n\
    \n```javascript\nif(“banana” == “pineapple”){\n    ChoppingBanana();\n} else {\n\
    \    ChoppingPineapple();\n}\n```\n\n如果我们需要，我们也可以写另一个条件，我们将写 `else if` 和另一个条件，比如“banana”等于“cherry”，然后是另一个大括号。\n\
    \n```javascript\nif(“banana” == “pineapple”){\n    ChoppingBanana();\n} else if(“banana”\
    \ == “cherry”){\n    ChoppingCherry();\n} else {\n    ChoppingPineapple();\n}\n\
    ```\n\n# 第 18 章：Switch\n\n谁知道呢，也许有一天你将拥有自己的 Web 开发公司。就像任何其他大公司一样，它有自己的……自动售卖机！但我们不像其他大公司，对吧？我们的自动售卖机是特殊的！\n\
    \n所以我们将拥有……*鼓点* 自动等待机！我们的自动售卖机会让你等待。而且……就这样了。没有饮料之类的。只是……等一会儿，然后离开。\n\n好了，首先，我们当然要构建自动售卖机标题。\n\
    \n```html\n<h1>The Vending Machine</h1>\n```\n\n现在我们需要构建自动售卖机函数。\n\n```javascript\n\
    function VendingMachine(pendingTime){\n    switch(pendingTime){\n        case\
    \ 1:\n            // 为 #1 代码……\n            break;\n        case 2:\n        \
    \    // 为 #2 代码……\n            break;\n        case 3:\n            // 为 #3 代码……\n\
    \            break;\n        default:\n            // 默认代码……\n    }\n}\n```\n\n\
    让我们填充我们的分支 (case)\n\n```javascript\nfunction PendingMessage(time){\n    alert(“The\
    \ Vending Machine says you have to wait ”+ time + “ minutes”);\n}\n```\n\n现在我们需要函数放入按钮中：\n\
    \n```html\n<input type=\"button\" onclick=\"VendingMachine(1)\" value=\"1\" />\n\
    <input type=\"button\" onclick=\"VendingMachine(2)\" value=\"2\" />\n<input type=\"\
    button\" onclick=\"VendingMachine(3)\" value=\"3\" />\n<input type=\"button\"\
    \ onclick=\"VendingMachine(7)\" value=\"4\" />\n```\n\n好了！让我们第一次尝试我们的等待售卖机！点击\
    \ 1 号按钮。我们需要等 1 分钟……（但我们不用等……因为……我不想等。）\n\n"
