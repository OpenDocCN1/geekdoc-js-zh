    For loop


    Back in the days, and still in the Simpson’s episodes, there was a widespread
    punishment for naughty students. Writing like a gazillion times what they did
    wrong… For example… “I must not talk in class” or “I won’t forget to do my homework
    again”… And stuff like that.


    So today we will break all the naughty students free, with our shiny new Machine,
    that write lines for you!


    So first of all let’s make our document looks like chalkboard…


    <style>


    body{background-color: #333333; color: #f0f0f0;}


    </style>


    Alright, first thing first, let’s see how can we repeat the same stuff over and
    over again…


    And to make that happen, we will use our brother-from-another-mother, the “for
    loop”.


    The for loop is a technique that lets you loop through any code, until you hit
    some sort of a counter… Let’s write it down and I’ll explain it further:


    for(i=0; i < 10 ; i++){


    ##… CODE… ##


    }


    Alright, so to create a for loop, you have to write the word for, and open parenthesis…
    Inside of the parenthesis you have 3 sections divided by semicolons, the first
    section you suppose to reset your counter. Because the for loop is running until
    you hit that counter. So the first section is to reset your counter, and you can
    call your counter whatever you like, I named iti, that’s short enough, and reset
    it to zero.


    Right after, we have the second section. It all about telling the for loop :”if
    that’s condition is true… Well… just keep loopin’ will ya?!“ so I wrote “i < 10”,
    which is in english : “as long as our counter ‘i’ is under 10, don’t mention it,
    just keep looping… “


    And in the last section, is the the counter increment. After every loop, do the
    plus-plus thingy, which if you are remember, means “increment yourself by one!”,
    so if our counter i is 0, after one loop it will change to 1 , and then to 2,
    and then to 3 and so on…


    And every time our middle section is satisfied, our code here will keep on running.


    Alright, let’s combine a lil’ bit of for loops and functions, and create ourselves
    a Writing Line Machine!


    ��  ♫…Writing Line Machineee…. yeahh… eaa… ea… a…♫ ��


    Yeah, so first of all, we will write a function calledWriteLineMachinewith afor
    loopinside of it, and that function will take a parameter calledlineText.


    And we will let thefor loop running for 10 times for now…


    function WriteLineMachine(lineText){


    for(i=0 ; i < 10 ; i++){


    //… Some write function…


    }


    }


    I will leave a comment now inside of thefor loop, and now we will write a function
    that writing our text, and then we will insert it inside of our for loop, k ?


    So let’s write it down!


    I will create another function calledWrite, and this function will ask for a parameter
    calledlineText, and it will simply will write on our document, the same value
    the parameter has.


    function Write(lineText){


    document.write(lineText);


    }


    And we will insert our new function inside of ourWriteLineMachine… And link the
    parameter of theWriteLineMachine


    function WriteLineMachine(lineText){


    for(i=0 ; i < 10 ; i++){


    Write(lineText);


    }


    }


    Alright, and now we will have another function that starts our machine, calledStartMachine,
    and we will just insert ourWriteLineMachineinside of it. With a parameter oflineText.


    function StartMachine(lineText){


    WriteLineMachine(lineText);


    }


    Now, we will have a new variable, that holds a text. let’s say we want to repeat…
    this text:


    “I will never ride my hamster-mobile to school ever again.” (I promise!!!)


    var text = “I will never ride my hamster-mobile to school ever again.”;


    And finally , we link all together with aStartMachine, and letting it use our
    text variable…


    StartMachine(text);


    So our code go to ourStartMachinefunction, with our text, travels to ourWriteLineMachinefunction
    with our text, loop 10 times, and each and every loop he will visit ourWrite function,
    that just printing inside of our document, our text which is… Well… my forbidden
    rides on the hamster-mobile…


    By the way, we can easily think of improving our machine, and give it dynamic
    variable of the number of loops… Like that :


    var loopNum = 50;


    for(i=0 ; i < loopNum ; i++){


    Write(lineText);


    }


    And that’s it.


    Now we can trick our teachers and let our machine to write lines for us!


    Chapter 20


    Array


    So now we will learn what Arrays is.


    Sometimes you will want to list stuff on your Javascript, like a list of your
    user names, or dates, or whatever.


    In order to do just that, you can surely declare a variable for every one of them,
    like var user1 , var user2, var user3, and so on… But it will be completely inefficient.
    (especially on bigger list… )


    So for that kind of task, we have Arrays.


    Arrays will store a list, but on just one variable.


    Let me show you what I mean, I will create an array of names. all you need to
    do is to type “new” and then “Array”, and theArray word is something you have
    to type , you cannot type whatever you want, that’s reserved name…


    You open parenthesis, and inside of those parentheses you write your variables
    , I will type an array of string names as I said earlier.


    Big Tony, Amazing Bob, Cool Jeff, and Awesome Jane.


    var names = new Array(“Big Tony”, “Amazing Bob”, “Cool Jeff”, “Awesome Jane”);


    Now let’s say I want to print on the screen the name Amazing Bob, what do I do
    ?


    I will writedocument.write, and then inside of our parenthesis I will write name,
    because that’s the variable of our array, and then we want to access Bob.


    What we don’t know is that each and every one of that array, has a secret index
    number, and instead of one, it starts with zero.


    So Big Tony will be indexed zero, Amazing Bob will be indexed one, Cool Jeff will
    be indexed as two, and Awesome Jane will be three.


    So to access amazing Bob, we need to type index one, right?


    So to make that happened, we will open square brackets, and type 1.


    Let’s try it.


    document.write(names[1]);


    And here we go, we have amazing Bob right there.


    And if we wanted to… get Awesome Jane printed on the screen… Let’s see what''s
    her index number… 0, 1, 2, 3.


    Three is the index of Jane, let’s change it to 3 here :


    document.write(names[3]);


    And we’ve got Jane!


    Now let’s do something funky! Let’s say our user Awesome Jane, decided to change
    her name to Tammy.


    In that case , we would write names[3] to access her name, and then set it, just
    like we set a new variable, “Tammy”, and let’s add another document.write, to
    see that indeed it changed over time.


    var names = new Array(“Big Tony”, “Amazing Bob”, “Cool Jeff”, “Awesome Jane”);


    document.write(names[3] + “<br/>”);


    Names[3] = “Tammy”;


    document.write(names[3] + “<br/>”);


    And yup. We’ve got it!


    Chapter 21


    Array Tricks


    Alright! We have a few more tricks for Arrays!


    We can add a new item with a push method


    So let’s say we want to add 2 more names for example… Martha, and George.


    names.push(“Martha”, “George”);


    document.write(names + “<br/>”);


    Let’s see if we’ve got it…


    yup!


    We can also sort it alphabetically… With a sort method…


    names.sort();


    document.write(names + “<br/>”);


    Let''s see… Yup! Sorted it out!!!


    And we can also… reverse everything!


    names.reverse();


    document.write(names + “<br/>”);


    Let’s refresh it and see what we got…. Yup!


    Still got it!


