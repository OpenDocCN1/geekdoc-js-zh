    By the way, did you see that we place our alert before the document.write, and
    refreshed the page, the alert showed first, but you didn’t see the any of the
    text on your document just yet.


    That’s because javascript is operate as a queue. First in the first statement,
    then the second one… And so on!


    Now you know all about writing and printing in your document, and all about annoying
    popups! As well as all about fluffy red goats.


    In the next chapter I’ll show you how to write comments.


    Chapter 6


    Comments


    Ssshhh!!! I have to tell you a secret.


    Yesterday, I went to a fortune teller!


    I sat on the chair, and then she approaches me and said;


    “awww… My dearly beloved almighty, awesomely humble Gilad… I have to tell you
    something about your students…”


    And you know me, I care a big deal about my young padawans, so I asked… “what?”


    So she told me; ”In the near future, they will be working on a project… as web
    developers!”


    And I was shocked! I said “WHAT??? Are you SURE? My students???”


    So she said: “Wa… Wait, I didn’t get to the point yet!”. And I was like “oh… Yeah…
    well… Carry on“


    “ …In the near future, they will be working on a project… As web developers!!!
    … And they will be working with other web developers as well!!! … “


    “Other web developers??? Other??? Are you sure???”


    “Indeed.”


    So I ran quickly to my office and prepared you this lecture.


    If you are about to work with other web developers, you will have to communicate
    with them properly, and there is no better option to do so, but with comments!


    Comments are for your own sole purpose, and for your colleagues as well.


    You see, Comments are not being rendered on the page, so you can write whatever
    you want, like “hey Jeff, don’t mention about yesterday, I was really hungry.
    And…. your computer was the only thing that tastes like chicken! P.S, this line
    of code is getting everything from the database.”.


    So now you know why do you need comments, but how can we do that?


    Simply write inside of your script tag two forward slash, and start typing!


    Like that:


    // Hey Jeff!… Sorry about your tasty chicken computer


    Save it, Refresh it, and…. It’s a christmas miracle! Just like we’ve expected:
    nothing renders!


    Now only me and my colleague Jeff would know about our little incident.


    But what about if I want to leave Jeff multi-line comment about what I ate for
    dinner… the list of things I’m allergic to… and why I always laugh like a crazy
    person when it rains?


    So in that case we would have one forward slash, followed by star. We write whatever
    we want to write, and then close it with star, and… another forward slash.


    /* Hey Jeff,


    Thanks for the present for christmas,


    however I feel like We are not in that phase


    of our relationship to sending each other


    Parking tickets.


    P.S. : This code is not working.


    P.S.S : we are out of milk. So get one. thanks! */


    Hopefully, you would not work with Jeff, because he is a handful…


    But if you would or wouldn’t, at least now you know how to write Javascript comments.


    Chapter 7


    Variables


    Do you remember back in school when your teacher said something along the lines
    of…


    X = 98


    And then she said something like:


    “Danny just eat X apples”,


    You all knew… You all knew she''s talking about Danny, that just swallowed 98
    apples, right?


    That’s exactly how variables works on Javascript.


    Javascript Variables are like little placeholders, they store your data, and then
    if you want to use that data later, you just call the variable name, and use it!


    So before you will use your variable, you need to declare a name for it.


    So to declare variable, the lazy javascript people just shorthand the word variable
    into just “var”… so you should always write “var” first, and then , you can come
    up with every name for your variable, any name you can think of… I’ll write my
    name for example, “gilad”


    Then, you should write an equal sign, and then what you want to assign your variable
    to.


    Let’s say we want to print the number 9.


    And we will close it with a semicolon like always.


    var gilad = 9;


    Right now you already know how to print stuff to your page, remember our fluffy
    red goat?


    document.write(“I’m printing fluffy red goat… ”);


    So erase the text inside, and just write your variable’s name (no quotation mark
    needed!).


    document.write(gilad);


    Save it, and refresh it.


    Holly goats! We’ve got a 9 on our screen!


    Let’s explain what just happened:


    Your browser thinking for himself, “oh alright, awesomely-cool-web-developer!
    You want me to set a variable, and then you call the variable ‘gilad’. So i’ll
    set a place in my room just for you… And I will call that place ‘gilad’ from now
    on…“


    Then we wrote the equal sign… so that means you set it to whatever on the right
    side of the equal sign.


    Which is 9.


    So the computer says “ok, I’ll now store 9, in my place called ‘gilad’. And I
    promise you, I will use it whatever you will tell me to use it… “


    Then when we called the ‘gilad’ variable inside our‘document.write’, the computer
    took the value, and print it inside of the document.


    Oh, but one more thing… Do you remember I told you about the name of variable,
    and that you can name it whatever you like… Well… you can.


    But you have 2 rules you have to keep, ok?


    Rule number one:


    Don’t ever write anything funky like that:#5^$%^^$. Your browser will go bananas,


    and wouldn’t know what you mean by that name! You can only call your variables
    by letters,


    numbers, and underscores.


    Rule number two:


    Javascript is case sensitive language, so don’t call your variablejeffery, all
    letter case, and


    then afterwards call itJeFferY like a crazy person. For the browser, It’s like
    you will call


    Some girl “Hillary!” and then switch to “Hey Brittney! Sup Brit… I mean… Doris!…
    Doris!!!


    Jenni… Bath!… Elizab… Doris!!! Doris…”


    Yeah… so don’t do that… Other than that. You’re safe!


    Chapter 8


    Variable types


    Do you remember when you were a baby, you had this weird game of shapes, and you
    were supposed to sort those shapes and put every shape into its place?


    Just like that game, Javascript has different types of variables. And they cannot
    fit everywhere…'
