    ## Stop Everything! I Have a Present For You!


    OMG! OMG!!! OMG!!! Aren’t you excited? … who doesn’t love presents???


    This book gets you to know Javascript, but personally I prefer videos over books
    – I mean, it’s easier if someone does all the work of reading for you, right?
    You can watch a bunch of videos and be an expert in no time.


    So, I took this book, and blended it all into a bite-sized video course. if you
    will watch it, you will know every basic building block of Javascript in no time!
    Neat, huh?


    And because you have purchased this book, I will give you 50% off this video course.
    Awesome, right?


    Grab the videos here: [http://basicjavascript.gilad.me/discount50/](http://basicjavascript.gilad.me/discount50/)


    ## Introduction


    Hey Guys!


    Welcome to the Javascript Awesomeness Course, where you will learn to write the
    basics of Javascript, the awesome way!


    My name is Gilad, and I will lead you through this amazing course!


    I began my career as a web developer, but soon transitioned to entrepreneurship,
    where I founded my very own startup company.


    Currently, I work at the company I founded from scratch, doing what I love most
    - teaching you guys!


    I designed this course for anyone seeking to learn basic of Javascript and begin
    a career as a rockstar web developer, as well as anybody who just loves to expand
    their knowledge.


    By the end of the course, you will have a rock solid knowledge of all Javascript
    building blocks such as:


    * Javascript Variables

    * Javascript Functions

    * Javascript If Statement

    * Javascript Form Validation

    * And many many more…


    I will teach you the latest version of Javascript by the standards of the W3C
    Association. These standards are used by all the major companies in the world.


    I will not only cover all these topics, but I will also give you an opportunity
    to practice them by giving you a pop quiz every now and then.


    The ideal student for this course is anybody who wants to expand their knowledge
    of Javascript or get a leg up in the web developer world.


    To take this course, you will have to know the basics of HTML and CSS, and also
    come open-minded to my silly jokes!


    You are free to take a look at the course description, and I look forward to meeting
    you inside.


    ## Chapter 1: Why Learn Javascript Anyway?


    Did you ever sit in your comfy couch at your house and wondered;


    Why Javascript?


    What can it do for me?


    Why all the buzz about it?


    And, what is an elephant doing in my living room?


    If it happens to you, pet your brand new elephant right away. And also, join me
    in being more knowledgeable about Javascript.


    Right of the bat, Javasript is really cool! You can add logic to your website,
    make it more interactive, and also manipulate your HTML and CSS due to that logic!


    But if you thought “cool” is the only feature of Javascript, then you are wrong,
    because Javascript is also relatively easy, and it’s the base of the most popular
    frameworks out there, such as `angular.js`, `react.js`, `backbone.js`, `knockout`,
    and even good old `JQuery!` Wherever you step, on the web development world, you’ll
    see the footprints of Javascript.


    If you desire to be a web developer, then you just HAVE to be familiar with javascript.
    And that’s why you are here, right?


    So I’m glad you are here. Let’s get started.


    ## Chapter 2: What is Javascript?


    Here’s a person, called Bob.


    Bob has eyes, ears, nose, mouth…


    He has a body, and also some clothes…


    But until it has a brain that functions everything together, it’s only a bunch
    of organs connected to each other.


    Just like our weird but beloved Bob, you can surely know HTML, and structure huge
    website.


    You can also decorate and style your website, with your amazingly CSS skills.


    But, if you lack in your Javascript skills, your webpages will look dull and old.


    Javascript is the programming language of the web. It is our brain that keeps
    everything in touch.


    If you want your website to be more interactive, so your users could click on
    one element and be amazed, be sure.


    ## Chapter 3: Do I need to know anything before I learn Javascript?


    Although it’s a javascript course, you will need to know at least a little bit
    of HTML and CSS to understand the content.


    I will use several examples that uses HTML and CSS, so if you don’t know any of
    those, please go back and strengthen those skills.


    I do have HTML course and CSS course for those who needs it, and because I’m so
    awesomely generous with you guys, I will give you a 50% coupon for any of my other
    courses.


    You can grab your coupon here: [http://basicjavascript.gilad.me/discount50/]


    One more thing; for all my examples in this course I will use `Notepad++`, which
    is a completely free text editor.


    (you can grab it here, for free!: [http://notepad-plus-plus.org/download](http://notepad-plus-plus.org/download))


    However, if you happen to be allergic to my suggestions, you can always try other
    software as well.


    I won’t judge you, I promise!


    *whispering* I will! *whispering*


    ## Chapter 4: How to set up your page


    Alright Alright Alright!!! You are already sold about learning Javascript, you
    are supposed to be set with your `Notepad++`, and you want to start coding Javascript,
    right?


    Before you do, you need to set up your page:


    In order to do so, all you need to do, is to write inside of your head tag, a
    tag named `script`. Like that:


    ```html

    <!DOCTYPE>

    <html>

    <head>

    <script type="text/javascript">

    # JAVASCRIPT CODE #

    </script>

    </head>

    <body>


    </body>

    </html>

    ```


    Inside of the `script` tag, we will have an attribute called `type/javascipt`,
    that tells the browser we are having a javascript typed script.


    Inside of that tag, you will write your Javascript code!


    ## Chapter 5: Simple alert, write to document


    OMG OMG OMG!!! I’m so excited!!! … just like a baby trying to walk its first steps,
    you are about to write your very first javascript code.


    And it’s going to contain …*DrumsRoll*…


    Printing a fluffy red goat!


    Why printing a fluffy red goat, you ask?


    Because there is nothing more suspicious than walking down the street and see
    a person printing goats just for the sake of printing goats. That is red… and…
    also fluffy.

