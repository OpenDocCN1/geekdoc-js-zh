    Let me explain it to you by first writing it down in our text editor:


    I will write `var`, `name`, equals to `9`:


    ```javascript

    var name = 9;

    document.write(name);

    ```


    That’s what we’ve done in the last lecture, right?


    We have a variable named `name`, and it’s equal to the number `9`.


    But, my name is not nine, right? (I swear it’s doesn’t!)


    Let’s try to erase the number nine, and place my name instead.


    ```javascript

    var name = gilad;

    document.write(name);

    ```


    Save it, refresh it, and let’s see what we have here…


    ah! Nothing shows! What happened?


    The difference between `9` and `gilad`, is that “gilad” is a text (or as Javascript
    like to call it: a “string”). And `9` is just a number.


    The thing is, javascript could easily think that `gilad` may be just another variable,
    and because it could be a variable, it''s trying to look for it in the entire
    page, and when it couldn’t find it, it just says… “Oh Well, alright… I did my
    best, I cannot find it anywhere… So I’ll just do nothing and relax… ” (giving
    up early, huh?)


    To say explicitly to Javascript that we have a string here, we need to wrap our
    text inside of quotation mark.


    Let’s do that:


    ```javascript

    var name = “gilad”;

    document.write(name);

    ```


    Save it, refresh it, and… yeah baby! We’ve still got it!


    So now we know that we have two different types of variables.


    Numbers, and strings.


    And the difference between them is that little quotation mark.


    We have a few more types of variables in javascript, and we will cover them in
    later lectures.


    # Chapter 9: Using different types of `var`


    Did you know that Javascript can make your homework?


    If I knew that, I would study Javascript at age 5!


    Here’s an example:


    ```javascript

    document.write(3 + 3);

    ```


    That could come handy in first grade, don’t you think?


    Hmm… let’s try something…


    I’ll declare `twovars`, the first one I will name `num1` and set it to `4`, and
    then second one, I will name `num2`, and set it to the number `2`.


    Now in the `document.write`, I will replace the `3 + 3` into `num1 + num2`, and
    run it.


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 + num2);

    ```


    Alright… we’ve got `6`. Awesome! We’ve learned something new! We can actually
    add variables together! Imagine the possibilities!


    But I wonder what would happened if I would change … say…`4`, into `“4”`, you
    know, as a string…


    Alright, let’s put our mad scientist goggles and try it out:


    ```javascript

    var num1 = “4”;

    var num2 = 2;

    document.write(num1 + num2);

    ```


    Oh, that’s weird… `42`?


    I mean, I know the answer to life, the universe and everything is `42`, but …
    I didn’t ask that…


    Let’s see what happened:


    First, we typed `num1`, equals to `4`. But since we have our quotation mark around
    `4`, it would be considered as “string” and not as number. So our browser merely
    printed `4` on the screen. And then, we added `2`. But since our `4` is only a
    string, our browser didn’t thought it’s a math problem, and just added it to the
    screen, as is…


    So we could easily replace `4` to `“I love you “`


    And if we will refresh the page, we can see that your browser loves you `2`.


    Browser!!! Silly you….


    # Chapter 10: Math operators


    In math, we have 4 basic operations that you can make.


    Addition, subtraction, multiplication, and division.


    In the last lecture, We’ve already seen that we can add numbers in javascript.


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 + num2);

    ```


    But apart from basic addition, we’ve got another math operation in Javascript.


    Let’s take a take a look at the rest of them.


    We have got subtraction:


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 - num2);

    ```


    You simply make the minus sign.


    If you want to multiply numbers, don’t write the `x` letter or something like
    that, simply write star instead:


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 * num2);

    ```


    That’s Multiplication.


    We can divide numbers as well.


    All you need to do, is to type a forward slash.


    ```javascript

    var num1 = 4;

    var num2 = 2;

    document.write(num1 / num2);

    ```


    So that’s division.


    Now I’ve got a bonus for ya!


    Let’s say you want to increment a number by one.


    So… of course… you can type something like that… :


    ```javascript

    var num1 = 4;

    document.write(num1 + 1);

    ```


    But! If you are a lazy person like myself, you can shorthand and do that: !


    ```javascript

    var num1 = 4;

    document.write(num1++);

    ```


    Or something like that if we want a number to be decreased:


    ```javascript

    var num1 = 4;

    document.write(num1--);

    ```


    Or something like that if we want a number to be decreased: `++` or `--`.


