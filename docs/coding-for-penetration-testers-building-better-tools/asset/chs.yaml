  \ 4109 字节，使用 -b 选项提取）\n焦距：12.5 mm\n镜头：7.7 - 23.1 mm\n光值：9.0\n\n如果这是在支持 GPS 的设备上拍摄的，我们还会看到关于文件创建位置的信息。在更高端的设备上，我们可能会看到更多信息，包括网络设置（如果设备具备此功能）。这是信息过载的领域之一，但我们永远不知道哪些信息最终会有用。\n\
  \n当然，由于这是一个命令行工具，输出仅为格式化文本，我们可以轻松地将其整合到本章前面讨论的脚本中。这可能会让我们能够做一些事情，比如搜索所有图像文件格式的文件（`.jpg`、`.gif`、`.tif`\
  \ 等），并快速搜索它们以提取我们感兴趣的信息。拥有这样的能力可以让我们快速获得潜在的有趣信息，也许包括某个特定人员居住、工作和经常访问的地点，这些信息可能作为社会工程攻击的基础而派上用场。\n\
  \n## 综合运用\n\n让我们看看如何编写一个脚本来实现本章讨论的一些功能。我们已经讨论了从 Google 提取信息、使用 Web 自动化以及搜索文件中的元数据，现在我们将所有这些整合到一个包中。\n\
  \n```perl\n#!/usr/bin/perl\n\nuse WWW::Mechanize;\n\n$site = @ARGV[0];\n\n$filetype\
  \ = @ARGV[1];\n\n$searchurl =\"[`www.google.com/search?hl=en&q=site%3A$site+filetype%3A$filetype`](http://www.google.com/search%3Fhl%3Den&q=site%3A$site+filetype%3A$filetype)\"\
  ;\n\n$mech = WWW::Mechanize->new();\n\n$mech->agent_alias(’Windows Mozilla’);\n\n\
  $mech->get($searchurl);\n\n@links = $mech->find_all_links(url_regex => qr/\\d+.+\\\
  .$filetype$/);\n\nfor $link (@links) {\n\n   $url = $link->url_abs;\n\n   $filename\
  \ = $url;\n\n   $filename =~ s[.^∗/][];\n\n   print \"downloading $url\\n\";\n\n\
     $mech->get($url, ’:content_file’ => $filename);\n\n}\n\n@files = glob(\"^∗.$filetype\"\
  );\n\nfor $file (@files){\n\n   print \"running strings against $file\\n\";\n\n\
     ’echo -e \"^(∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗) $filename ^(∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗)\\\
  n\\n\" >> stringsreport.txt’;\n\n   ’strings $file >> stringsreport.txt’;\n\n   if\
  \ ($filetype =~ /pdf/i){\n\n     print \"running exiftool against $file\\n\";\n\n\
       ’echo -e \"^(∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗) $filename ^(∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗)\\\
  n\\n\" >> exifreport.txt’;\n\n     ’exiftool $file >> exifreport.txt’;\n\n   }\n\
  \n}\n```\n\n这里我们结合了本章中整理的一些内容。直到大约第 20 行，我们使用了之前从 Google 下载文件的相同脚本。末尾的部分将处理这些文件，从中提取元数据。\n\
  \n我们需要查看的第一个新部分是 `@files = glob(\"^∗.$filetype\");` 这一行。这一行使用了 Perl 中的 `glob` 函数，返回与存储在\
  \ `$filetype` 中的扩展名匹配的文件列表，并将该列表放入数组 `@files` 中。现在我们有了文件列表，可以对其进行一些处理，类似于本章前面使用\
  \ `strings` 的 bash 脚本。所有这些工作都在我们的 `for` 循环内完成。\n\n在循环内部，我们遍历 `@files` 中的文件列表，并像在\
  \ bash 脚本中一样，对每个文件运行 `strings`。这里我们使用反引号（`）来运行所需的命令，并将文本回显到报告文件中。我们还在循环内部使用了一个 `if`\
  \ 语句来检查 `$filetype` 是否为 `pdf`，然后对 `$file` 中的文件运行 `exiftool`（是的，`exiftool` 支持 PDF），并生成一个单独的\
  \ EXIF 数据报告。\n\n我们可以将工具运行为 [**./filegrubber.plsyngress.comppt**](http://./filegrubber.plsyngress.comppt)，然后从\
  \ Google 获取结果文件，以及 `stringsreport.txt` 中 `strings` 的输出。如果运行为 [**./filegrubber.pl\
  \ elsevier.com pdf**](http://elsevier.com)，我们还会触发额外的逻辑来对文件运行 `exiftool`，因此最终会得到\
  \ `stringsreport.txt` 和 `exifreport.txt` 文件。\n\n我们可以在以下几个方面改进这个脚本：\n\n- 目前，我们只会从\
  \ Google 下载第一页结果。如果我们愿意，可以使用 `WWW::Mechanize` 遍历所有结果页面。我们可能还想从命令行参数中获取要从 Google\
  \ 结果中提取的文档数量。\n- 我们可能希望同时搜索多种文件类型，例如 PDF、DOC 和 XLS。我们应该能够通过额外的参数和更多的循环来处理每种文件类型。\n\
  - 目前我们对 `exiftool` 的使用非常有限。然而，我们可以扩展 `if` 语句中的正则表达式，以包含更多 `exiftool` 能够处理的文件类型（实际上非常多）。\n\
  - 目前我们将下载的文件放在运行脚本的目录中。最好将它们放在自己的目录中，或者放在 `/tmp` 中。\n\n我们这里的示例运行得相当不错，并且有助于说明我们可以利用各种文件中的元数据做些什么，以及如何找到它们。要查看一个功能类似且完全开发的应用程序示例，请务必查看\
  \ Christian Martorella 的工具 MetaGooFil^(4)。MetaGooFil 非常擅长从文档中提取有趣的信息，如用户名和文件路径，并且能够很好地扩展到大量文档。MetaGooFil\
  \ 是用 Python 编写的，我们在第 2 章中讨论过，因此有兴趣了解其工作原理的人也可以深入研究其源代码。\n\n## 总结\n\n\n\n\n在渗透测试过程中，信息收集可能对我们大有裨益。它能让我们收集关于目标人员、系统和环境的信息，并基于这些信息发起攻击。我们收集到的信息有多种潜在用途，但其中两个主要目的是用于社会工程学攻击以及对攻击目标进行足迹分析。\n\
  \n我们能够访问的一个巨大潜在信息来源是谷歌。在谷歌庞大的索引中进行搜索，可以返回关于人员、设备、文档和文件的具体信息，从中提取元数据，以及各种其他有趣的信息——前提是我们知道如何正确进行这些搜索。此外，我们可以应用自动化手段来简化这项工作。\n\
  \n正如我们在第 3 章中讨论的，Perl 是用于解析文本的绝佳工具。我们还可以使用 Perl 来自动化导航和搜索网页或应用程序，从而节省大量工作。借助各种面向\
  \ Web 的 Perl 模块，我们可以实现自动浏览、解析以及与 Web 交互。\n\n元数据，即关于数据的数据，几乎附加在所有文档、文件、视觉媒体以及其他用于数字信息存储的结构中。在渗透测试过程中，元数据对我们来说可能非常有价值。元数据可以提供用户名、文件系统路径、网络服务器名称和路径、已删除的敏感数据以及各种其他有趣的信息。通过使用诸如\
  \ `strings` 之类的工具或类似的搜索工具，通常可以轻松从文档中恢复这些信息。\n\n## 尾注\n\n1. Kunder M de. 万维网的规模。[*WorldWideWebSize.com*](http://WorldWideWebSize.com)\
