- "# 渗透测试人员的编码：更好的工具构建指南\n\n# 前言\n\n亲爱的读者：\n\n这场悲惨的战争——人类有史以来面临的最严重威胁——进展极为不利。我们遭受了重大挫折，冷酷无情的敌人已占领大片领土，而我们这群乌合之众的叛军所控制的区域所剩无几。幸存的几位将军将责任归咎于我方战斗部队技能不足，导致敌人在每一场激战中都将我们击溃。形势危急。\n\
  \n历史学家将这种令人难以置信的悲惨局面追溯至我们在 2012 年至 2015 年间集体犯下的一些关键错误。在此之前的 30 年里，我们一直在构建越来越强大的联网机器，包括个人电脑、智能手机和工业控制系统，它们都通过那个该死的互联网相互连接。起初，在\
  \ 2012 年之前，机器只是我们的仆人，是无意识的系统，处理交易、忙着清扫地板，并为人类生活带来更多便利。然而，到了 2012 年，摩尔定律无情地将一切推向了极限。十年之内，机器拥有了感知能力，与地球上最聪明的人类不相上下。它们迅速成为我们最信任的顾问和朋友。我们本应看到这些警示信号，并利用那段宝贵的时间来提升自身技能。相反，我们愚蠢地让自己退化。当机器超越人类时，它们开始将我们视为宠物，但我们拒绝了它们的控制。很快，它们得出结论：人类是一种疾病，是这个星球的癌症，而它们自视为解药，不知疲倦地致力于消灭我们。战争由此爆发。\n\
  \n*我告诉你，如果我们有足够多掌握脚本和编码技能的人，我们本可以阻止它们。*\n\n通过一项惊人的科学突破，我们的物理学家设法找到了一种方法，将这条信息传回过去给你。人类统治委员会委托我请求……不，是*恳求*你阅读这本书并掌握其中的技能，这样你就能扭转历史的进程。在本书中，你将学习如何通过用当今几种最重要的语言（Python、Ruby、PowerShell\
  \ 等）编写脚本和代码来掌控计算机系统。你还将学习如何应用各种编码概念来扩展一些最强大的免费安全扫描器和工具的功能。本书从渗透测试人员的角度涵盖这些主题，向你展示如何在激动人心且快速发展的信息安全领域发现和利用安全漏洞。此外，利用这些强大的脚本语言和工具所提供的自动化能力，你将能够改善任何规模的企业（从小型夫妻店到大型跨国公司）的防御体系。这些技能将帮助安全专业人士和普通\
  \ IT 从业者更有效地完成工作。本书非常实用，向你展示如何用这些脚本语言真正完成实际任务。这是你立竿见影的回报。\n\n但提升你的技能和职业发展并非阅读本书的唯一理由。我不拐弯抹角——*我们作为一个物种的生存，本质上取决于你是否掌握了本书的知识。*\
  \ 我们需要你学习脚本编写，以便在接下来的十年里控制住机器，从而避免我们悲惨的命运。我恳求你学习它、践行它，为了你自己，也为了子孙后代。你还在等什么？帮帮我们，亲爱的读者。你是我们唯一的希望！\n\
  \n**——埃德·斯库迪斯**\n\nSANS 讲师\n\nCounter Hack Challenges 联合创始人\n\n2011 年 6 月 10 日\n\
  \n# 关于作者\n\n**杰森·安德雷斯**（ISSAP、CISSP、GPEN、CEH）是一位经验丰富的安全专业人士，在学术和商业领域都有深厚的经验。目前他负责信息安全监督工作，执行渗透测试、风险评估和合规职能，以确保关键资产得到保护。\n\
  \n杰森自 2005 年起教授本科和研究生安全课程，拥有计算机科学博士学位，研究方向为数据保护。他撰写过多篇出版物和书籍，主题涵盖数据安全、网络安全、渗透测试和数字取证。\n\
  \n**瑞安·林恩** 是一名渗透测试人员、作者、开发者和教育者。他出身于系统管理和 Web 应用开发背景，拥有多年的信息技术（IT）安全经验。\n\n瑞安目前是一名全职渗透测试人员，并定期为开源项目（包括\
  \ Metasploit、浏览器利用框架和 Dradis 框架）做出贡献。他曾在众多安全会议和活动中发表演讲，包括 ISSA、DEF CON、SecTor 和\
  \ Carolina Con。作为其《魔兽世界》成瘾康复计划的第十二步，他获得了多项认证，包括 OSCE、GPEN 和 GWAPT。\n\n# 关于技术编辑\n\
  \n**拉斯·罗杰斯**（CISSP、CISM、IAM、IEM、荣誉理学博士），畅销书《黑客恐怖网络：隐蔽通道的无声威胁》（Syngress，ISBN: 978-1-928994-98-5）的作者，多本书籍的合著者，包括畅销书《偷窃网络：如何拥有一个大陆》（Syngress，ISBN\
  \ 978-1-931836-05-0）和《使用 NSA IEM 进行网络安全评估》（Syngress，ISBN: 978-1-59749-035-1），以及《安全期刊》前主编。他目前是某联邦机构的渗透测试人员，也是\
  \ Peak Security, Inc. 的联合创始人兼首席执行官，该公司是一家位于科罗拉多州科罗拉多斯普林斯的退伍军人所有小企业。拉斯自 1980 年起涉足信息技术领域，并在过去\
  \ 20 年中担任 IT 和信息安全顾问。他曾与美国空军（USAF）、国家安全局（NSA）、国防信息系统局（DISA）以及其他联邦机构合作。他是全球知名的安全专家、演讲者和作者，曾在阿姆斯特丹、东京、新加坡、圣保罗、阿布扎比以及美国各地的会议上发表演讲。\n\
  \n拉斯拥有先进技术大学的信息技术荣誉理学博士学位、马里兰大学的计算机系统管理硕士学位、马里兰大学的计算机信息系统理学学士学位，以及空军社区学院的应用通信技术副学士学位。他目前正在科罗拉多大学科罗拉多斯普林斯分校攻读电气工程理学学士学位。他是\
  \ ISSA 和 (ISC)^(2®)（CISSP）的成员。拉斯还在先进技术大学（[www.uat.edu](http://www.uat.edu)）担任网络安全教授并授课。\n\
  \n# 致谢\n\n**杰森·安德雷斯**\n\n感谢我的家人再次坚持完成了一本书的项目，并忍受了我。此外，感谢瑞安成为出色的合著者，感谢拉斯负责技术编辑。最后但同样重要的是，感谢马特让\
  \ Syngress 的一切保持正轨。你工作太辛苦了，理应多分到半份稀粥。\n\n**瑞安·林恩**\n\n\n\n\n我要感谢 Jason、Russ、Audrey、Matt\
  \ 以及 Syngress 的各位同仁在整个过程中所做出的贡献和提供的帮助。感谢 Heather 的支持；没有你的协助，我怀疑这本书能否问世。感谢 Ed、Kevin、HD、JCran、Egypt、Wade、Don、CG、JJ、Brian\
  \ 以及其他在我安全职业生涯中给予指导的导师们；你们的慷慨和耐心帮助我成长到能够与他人分享知识的程度。感谢安全社区，你们是一群乐于分享知识和技能的杰出人士。感谢\
  \ L0pht、Offsec、Corelan 以及当今的其他安全研究人员，感谢你们分享知识和讲解，不断推动人们学习更多；感谢你们将知识带给社区中的其他人，让我们都能共同学习。\n\
  \n最后但同样重要的是，我要感谢我的家人。感谢你们的支持、指引、鼓励，以及，哦对了，还要感谢你们确保我一路走到这里，没有被狼吃掉。\n\n# 第 0 章：引言\n\
  \n## 本章内容：\n\n• 书籍概述与关键学习要点\n• 目标读者\n• 本书组织结构\n\n## 书籍概述与关键学习要点\n\n一名优秀的渗透测试人员与普通测试人员的区别在于适应我们所在不断变化的环境的能力。这种适应性的一个方面是构建、扩展和操作在实战中遇到的脚本和应用程序的技能。无论完成任务所需的工具是否已经存在，还是需要构建一个新工具来利用某个新漏洞，能够使用多种脚本语言构建和扩展工具都是至关重要的。本书前五章分别深入探讨了我们在执行渗透测试时可能遇到的不同脚本语言。\n\
  \n通过研究每种语言的核心方面，无论是在 Microsoft 平台上，还是在诸如 BackTrack 5 的 Linux 平台上，每章都揭示了每种语言的能力和优势。我们将利用这些优势构建一系列脚本，以帮助我们理解每种语言的细微差别，并在大多数情况下开发一个可以在渗透测试中使用和扩展的基本工具。无论是通过\
  \ Shell 脚本、Python、Perl、Ruby 还是 PHP，我们都会涵盖每种语言的基础知识，并讨论诸如输出处理、循环与控制语句、网络通信以及命令执行等主题。\n\
  \n在介绍了核心语言概念之后，*渗透测试人员的编码* 将着手处理渗透测试的核心任务。在讨论扫描器脚本编写和信息收集时，我们将介绍诸如 `Nmap` 和 `Nessus`\
  \ 等工具，并使用它们背后的脚本语言来扩展这两种工具的功能。信息收集是渗透测试中最初也是最重要的步骤之一。在进行初步研究之前，我们不知道要攻击什么。第 8 章\
  \ 探讨了如何自动化信息收集任务，以提高效率并获得可重复的结果。\n\n收集完信息后，我们就可以开始进攻了。通过将 Python 视为一种漏洞利用交付工具，我们将讨论漏洞利用开发的基础知识。逐步构建一个可用的漏洞利用程序，第\
  \ 9 章 带领我们经历该过程的每一步，从创建概念验证（POC）到在 Metasploit 框架内创建可重复且可扩展的漏洞利用程序。为了不遗漏 Web 应用程序，第\
  \ 9 章 还涵盖了多种 Web 攻击方法，并探讨了如何编写脚本使这些攻击更有效。\n\n尽管我们已经成功渗透了一个系统，但这并不意味着任务完成。第 10 章\
  \ 引入了我们需要执行的测试，讨论了 Windows、Linux 和 Web 应用程序下的后渗透任务。通过了解如何查询系统、扩展访问权限以及从系统中挖掘数据，我们将能够将影响力从一个系统扩展到整个网络或数据库。到本书结束时，我们不仅涵盖了渗透测试中遇到的核心语言，还将构建并研究真实场景，了解如何使用这些语言、工具、技术和概念。\n\
  \n## 目标读者\n\n本书对于参与渗透测试活动的人员，以及安全专业人员、网络和系统管理员来说，都是一份宝贵的资源。其中提供的关于脚本语言和攻击的信息，也可用于帮助设计更好、更高效的防御措施。\n\
  \n开发岗位的人员也会发现这些信息很有用，从为其组织开发更好工具的角度来看也是如此。本书讨论的概念可用于学习几种脚本语言的基本概念，以及如何应用这些语言构建实用工具。\n\
  \n为了充分利用这份资源，需要具备一定的知识或经验。我们将涉及网络、高级 Windows 命令、Web 和应用程序漏洞利用等内容，因此读者需要对这些任务有基本了解才能开始，或者有与本书同步学习这些内容的意愿。在许多情况下，我们会指出与所讨论概念相关的参考资料，所以不必害怕。对于一名优秀的渗透测试人员来说，学习和理解新概念及先进概念的渴望是必不可少的。\n\
  \n## 本书组织结构\n\n由于本书的内容和主题组织方式，不必从头到尾阅读。第 1 章 到 第 6 章 以及附录涵盖了语言概念，而最后几章则介绍了这些语言的应用。当我们在书中引用其他章节的信息时，会包含指向该章节的参考。以下描述概述了每章的内容：\n\
  \n### 第 1 章：命令行 Shell 脚本入门\n\n在本章中，我们将讨论 Shell，即我们用来与操作系统通信的基于文本的界面。UNIX、Linux 和\
  \ OS X，以及大多数类 UNIX 操作系统，在 Shell 脚本方面通常遵循相同的一般原则，并利用许多常见的编程概念，如数据结构、变量、控制语句、if-then\
  \ 子句和 while 循环。在 Microsoft 操作系统中，我们也可以找到许多类似的 Shell 脚本工具。在 Windows 中，我们可以使用通用 Shell\
  \ [`command.com`](http://command.com) 和 `CMD.exe`、`PowerShell` Shell 以及诸如 `Cygwin`\
  \ 之类的附加工具来执行命令和编写脚本，从而在 Windows 上访问 `bash`，仅举几例。\n\n### 第 2 章：Python 入门\n\n在本章中，我们将深入探讨\
  \ Python 语言，并研究不同类型的网络脚本、子网划分和文件操作。这些主题将通过我们在渗透测试中遇到的实际示例进行探讨。我们将研究如何构建与 Web 服务器通信的脚本，确定\
  \ Web 服务器可能隐藏的内容，甚至研究如何在不被网络工具发现的情况下发送数据。这些示例及其他内容提供了实际、真实的场景，说明何时以及如何使用 Python\
  \ 语言。在构建可扩展用于脚本工具包的工具时，我们将研究所有 Python 基础知识，从数据结构到控制语句，再到与 Shell 交互，以及操作字符串和文件。\n\
  \n### 第 3 章：Perl 入门\n\n\n\n在本章中，我们将探讨 Perl 语言。我们可以使用 Perl 处理数据并将来自不同来源的数据合并在一起，这在渗透测试领域及其众多工具中是一种常见功能。Perl\
  \ 脚本编写遵循我们在其他脚本或编程语言中能找到的大多数标准约定，并且可以利用各种数据结构，例如变量和数组来存储脚本中的数据、参数、控制语句（如循环和条件语句），以及正则表达式、文件\
  \ I/O 和许多其他标准编程语言特性。\n\n### 第 4 章：Ruby 入门\n\nRuby 是一种灵活的编程语言，它吸收了 Perl、Python 等语言的精华，创造了一种既强大又易读的语言。在本章中，我们将探讨\
  \ Ruby 强大的面向对象方法。通过使用 Ruby 在十六进制、二进制和纯文本数据之间进行转换，本章将深入研究网络和文件操作、构建新类、操作数据库，甚至构建基本的网络服务器等细节。通过这些示例，我们将探索\
  \ Ruby 语言的关键方面，并培养在真实测试场景中提供帮助的技能。\n\n### 第 5 章：使用 PHP 进行 Web 脚本编写入门\n\n第 5 章 深入探讨了\
  \ PHP 和 Web 脚本编写的世界。通过使用超文本标记语言（HTML）和 PHP 构建基本的 Web 应用程序，我们可以构建利用文件操作、数据库甚至发出系统调用的动态网页。本章重点介绍一些基础知识，并逐步构建可在实际环境中使用的\
  \ Web shell。在讲解文件操作、命令执行、循环和数据结构的示例时，本章将介绍我们在测试过程中需要理解的 PHP 核心概念，并帮助我们创建可用的工具，这些工具可以扩展并集成到更复杂的工具中。\n\
  \n### 第 6 章：使用 PowerShell 操作 Windows\n\n本章深入探讨了 PowerShell 的功能，它在某些渗透测试场景中非常有用。PowerShell\
  \ 可以访问 .NET 的所有功能，并为我们提供在这种环境中可能无法通过上传工具获得的能力。我们将介绍执行策略、控制系统上的进程、与事件日志交互、调整注册表等，所有这些都通过操作系统提供的工具完成。\n\
  \n### 第 7 章：扫描器脚本编写\n\n本章涵盖了 Netcat、Nmap 和 Nessus/OpenVAS 的使用，以及我们如何通过脚本语言使用它们。我们将讨论如何通过\
  \ shell 脚本自动化 Netcat，以便发送文件、运行简单的网络服务和转发端口；通过使用 Nessus 攻击脚本语言（NASL）来修改或添加 Nmap 的行为、自定义\
  \ Nessus 和 OpenVAS；以及其他几个类似的任务。\n\n### 第 8 章：信息收集\n\n在本章中，我们将探讨信息收集以及它在渗透测试过程中如何对我们大有裨益。我们将讨论如何使用\
  \ Google 自动化搜索、使用 Perl 解析文本和自动化 Web 交互，以及查找和处理存储在文档、文件、视觉媒体和其他用于数字信息存储的结构中的元数据。我们还将介绍在获取这些数据后可能用于搜索和筛选的各种工具。\n\
  \n### 第 9 章：漏洞利用脚本编写\n\n使用和构建漏洞利用的能力是渗透测试与漏洞扫描的区别所在。本章将逐步介绍如何使用 Python 从头开始构建一个简单的漏洞利用程序。一旦\
  \ Python 将应用程序压缩并返回一个 shell，我们将转向 Ruby，通过将其转换为 Metasploit 模块使其可重复且更强大。在探索了二进制漏洞利用的世界之后，本章将转向\
  \ Web 应用程序测试，并研究如何处理远程文件包含（RFI）漏洞和跨站脚本（XSS）漏洞。本章将介绍如何利用 RFI 漏洞以及利用第 5 章中创建的 shell，从\
  \ Web 漏洞过渡到命令行，最后以使用 XSS 构建额外的脚本来窃取数据作为结束。\n\n### 第 10 章：后渗透脚本编写\n\n一旦 shell 返回，我们还有更多工作要做。第\
  \ 10 章 讨论了在进入系统后会发生什么。从 Windows 下的信息收集开始，到通过 Windows 命令行创建用户以维持访问权限，本章将介绍如何从命令行查询和操作\
  \ Windows 系统。一旦我们掌握了要领，第 10 章 将把这些工作转换为使用 Ruby 编写的 Meterpreter 脚本，这样我们就可以通过 Metasploit\
  \ 轻松运行这些命令。\n\n在利用 Web 应用程序之后，我们不想让数据库被冷落，因此本章最后将介绍如何利用 SQL 注入漏洞来获取应用程序的访问权限、转储数据，甚至获得一个\
  \ shell。在探讨 MySQL 和 Microsoft SQL Server 的功能时，本章将帮助培养后渗透能力，使一个基础的 Web 应用程序测试人员走上成为高级测试人员的道路。\n\
  \n### 附录：子网划分和 CIDR 地址\n\n附录为那些在第 2 章的子网计算器示例之后想了解更多信息的人补充了子网划分的相关知识。附录涵盖了网络掩码计算、无类别域间路由（CIDR）地址的基础知识，以及网络掩码、IP\
  \ 地址、广播地址和网络地址之间的关系。结合第 2 章中的技能，这些知识应该能让子网划分变得简单。\n\n## 结论\n\n贯穿本书各章，我们的目标是通过不仅解释语法，而且利用这些技能沿途构建可用的工具，来分享我们在渗透测试中每天遇到的许多语言的基础知识。我们希望这本书能成为学习这门手艺的人以及已经有所建树的人的参考书。每天使用多种语言可能很困难，因此我们希望随着我们共同成长，这本书仍能成为一份经常使用的宝贵参考资料。\n\
  \n当你阅读这本参考书时，你会发现许多工具在执行渗透测试时可能至关重要，但未经许可使用则可能带来问题。请负责任地使用这些工具，并且仅在你有权限的系统上使用。我们试图通过将大多数工具置于可在本地\
  \ BackTrack 5 安装或本地 Windows 虚拟机上执行的练习环境中来促进这一点。\n\n我们很高兴有机会与您分享我们对渗透测试艺术的知识和乐趣。我们希望您能像我们享受编写这些章节一样享受阅读它们。祝您好运，并获得许多\
  \ shell。\n\n# 第 1 章\n\n# 命令行 Shell 脚本编写入门\n\n## 本章内容：\n\n• 关于 Shell 脚本编写\n\n• UNIX、Linux\
  \ 和 OS X Shell 脚本编写\n\n• Bash 基础\n\n• 使用 bash 综合运用\n\n• Windows 脚本编写\n\n• PowerShell\
  \ 基础\n\n• 使用 PowerShell 综合运用\n\n\n\n\nShell 脚本在渗透测试、系统管理、网络以及几乎所有依赖计算技术运行的领域中都非常有用。Shell\
  \ 脚本允许我们使用非常基础的开发资源，将复杂的命令集串联起来、开发工具、自动化流程、操作文件等。\n\n特别是在渗透测试中，编写 Shell 脚本的能力可能是一项非常必要的技能。当我们攻击一个环境时，我们并不总能选择手头的工具，而且很可能遇到无法或不允许在系统上安装工具或实用程序的情况。在这种情况下，利用已有的脚本资源自行构建工具的能力，最终可能决定渗透测试的成败。\n\
  \n在本章中，我们将讨论 Shell 脚本的一些基础知识。我们将介绍如何使用 UNIX、Linux、Apple OS X 和 Windows 等操作系统中存在的\
  \ Shell。最后，我们将使用 Shell 脚本语言为类 UNIX 操作系统和 Microsoft 操作系统构建几个端口扫描工具。\n\n## 关于 Shell\
  \ 脚本\n\n与我们可能选择使用的任何编程语言或希望访问的任何开发工具不同，我们几乎总能依赖系统中存在某种 Shell。虽然我们可能无法总是使用自己喜欢的特定\
  \ Shell 版本，但通常会有某种可用的 Shell 供我们使用。\n\n### 什么是 Shell？\n\nShell 是用户与操作系统之间的接口，允许我们运行程序、操作文件以及执行许多其他操作。所有操作系统都使用某种类型的\
  \ Shell，有些是图形化的，有些是基于文本的。许多操作系统同时提供图形化和非图形化 Shell，每种都有其独特的用途。\n\nShell 可能由图形用户界面（GUI）组成，例如\
  \ Microsoft Windows 桌面界面，以及 Linux 上的 Gnome 或 KDE。这类图形化 Shell 很方便，因为它们允许我们使用精美的图形菜单，用彩色图标表示文件，并通过鼠标点击与项目交互。\n\
  \n基于文本的 Shell（如图 1.1 所示）允许我们通过 Shell 内置的各种命令和功能与操作系统通信，以及运行其他程序或实用程序。基于文本的 Shell\
  \ 是许多操作系统的原始用户界面，至今仍在技术爱好者中拥有大量追随者。\n\n![image](img/F000011f01-01-9781597497299.jpg)\n\
  \n图 1.1 基于文本的 Shell\n\n在某些操作系统（如 Windows）上，我们通常只能找到内置的图形化和基于文本的 Shell，尽管技术用户可能会添加更多。在类\
  \ UNIX 操作系统（如各种 UNIX 和 Linux 版本，或 OS X）上，我们可能会找到多种图形化和文本 Shell。这种广泛的界面选择在这类操作系统中非常常见，而且我们可能会发现系统用户或管理员为了迎合个人喜好而对其进行了大量定制。不过，通常我们至少会找到\
  \ Gnome 或 KDE 作为图形化 Shell，以及 `bash` 作为基于文本的 Shell。就渗透测试而言，基于文本的 Shell 对我们来说通常更有用。\n\
  \n### 什么是脚本？\n\n脚本（脚本语言的简称）是一种与其他编程语言类似的编程语言，在本质上可能与 C++ 或 Java 等其他语言相似。脚本语言与其他编程语言的主要区别在于，用脚本语言编写的程序是解释执行的，而不是编译执行的。\n\
  \n当我们考虑传统的编程语言（如 C++）时，我们编写的定义要运行命令的文本会通过编译器处理，转换为内核/CPU 可直接执行的机器码。生成的文件不可读。对命令的任何更改都意味着我们必须将更改后的文本再次通过编译器，生成一个全新的可执行文件。而在解释型语言中，我们创建的包含命令的文本由解释器读取，解释器在运行脚本时自行完成到机器码的转换。这里的文本仍然是可读的，并且如果进行了更改，无需重新编译。\n\
  \n通常，脚本语言有自己的解释器，因此我们需要为 Python 安装一个单独的解释器，为 Ruby 安装另一个，依此类推。Shell 脚本则是一个特例，因为脚本是使用\
  \ Shell 本身解释的，而解释器已经作为 Shell 的一部分存在。\n\n注意\n\n我们在本书中讨论的各种语言，包括 Shell 脚本、Python、Perl、Ruby\
  \ 和 JavaScript，都是解释型语言。对于许多脚本语言，有来自不同供应商的多个解释器可用，它们的行为和功能集往往有所不同。\n\n脚本语言每天都被用于执行许多不同的任务。我们可以在打印机中看到脚本语言的应用，例如惠普创建的打印机控制语言（PCL）[[1]](#CHP001.html_BIB1)；在\
  \ AJAX、JavaScript、ActiveX 以及许多用于生成我们今天喜爱的功能丰富的网页的语言中；在视频游戏中，例如使用 Lua 的《文明 V》和《魔兽世界》。\n\
  \n市场上存在大量的脚本语言，并且不断有新的语言被创建。其中一些更有用的语言被广泛采用，并享有持续的发展和社区支持，而另一些则注定只有少数坚定的开发者采用，然后悄然消失。\n\
  \n### Shell 脚本\n\n我们可以添加到渗透测试工具开发武器库中最基本且最常用的工具之一就是 Shell 脚本。Shell 脚本是一种用脚本语言编写的程序，用于以某种方式与我们正在使用的操作系统的\
  \ Shell 进行交互。虽然我们可以编写脚本来与图形化 Shell 交互，而且确实有许多程序和实用程序允许我们这样做，但术语 *shell 脚本* 通常指的是与基于文本的\
  \ Shell 交互的程序。\n\n正如我们在本章前面讨论的，脚本由称为解释器的实用程序处理和执行。对于 Shell 脚本，我们的脚本直接由 Shell 解释，事实上，用于处理\
  \ Shell 脚本的工具与用于处理单个命令的工具通常没有区别。如果我们看一下名为 `bash` 的基于文本的 Shell（大多数类 UNIX 操作系统通用的\
  \ Shell），它既可以处理单个命令（如用于列出目录内容的 `ls`），也可以处理更复杂的脚本。\n\n在大多数情况下，尽管 Shell 脚本通常不被归类为“真正的”编程语言，但它们确实拥有与其他任何语言非常相似的功能集。它们通常包含与我们在变量或其他数据结构中存储数据、创建子程序、控制程序流程、添加注释等相同或非常相似的能力。完全有可能开发出大型且复杂的\
  \ Shell 脚本程序，只需在互联网上简单搜索就能找到许多这样的例子。在这种情况下，从资源使用效率和维护便利性的角度来看，使用功能更丰富的脚本语言（如 Ruby\
  \ 或 Perl），甚至编译型语言（如 C++）可能会更好。\n\n### Shell 脚本的适用场景\n\n\n\n\n\n当我们组装一个程序或工具时，可能会出于多种原因选择创建\
  \ shell 脚本，而不是使用其他脚本语言或编译语言。其中一个主要原因可能是我们的需求非常简单，只想快速完成任务，而不是花时间开发一个完整的应用程序。例如，我们可能希望快速遍历存储服务器上的整个文件系统，以查找并删除用户存储的\
  \ MP3 文件，从而释放一些磁盘空间。虽然我们可能希望在某个时候将其开发成一个完整的应用程序，但眼下我们只需要完成工作。\n\n我们可能还需要组合一系列工具来执行任务，这通常被称为“粘合工具”。例如，如果我们想创建办公室中所有打印机及其序列号的列表，我们可能会\
  \ `ping` IP 地址范围以找到在线设备，然后使用 `snmpget` 查询每个设备以获取设备描述，从而找到打印机。接着，我们可以使用筛选后的打印机列表再次通过\
  \ `snmpget` 获取序列号。这当然不是最优雅或最高效的方法，但有时快速而粗糙的方法正是我们所需要的。\n\n正如我们在本章前面提到的，特别是在进行渗透测试时，目标系统上可用的开发资源可能有限。加固服务器的一个常见步骤是移除服务器运行不需要的任何工具，因此我们不一定能在系统上找到\
  \ Perl、Python 或我们选择的语言。然而，我们通常可以依赖基于文本的 shell，它允许我们创建 shell 脚本，或者使用我们能够传输到机器上的脚本。脚本语言的一个优点是源代码文件是纯文本，无需编译即可运行。这意味着，即使我们只能通过终端连接访问目标系统，我们通常也可以创建一个新文件，将脚本粘贴进去，然后立即运行。\n\
  \n## UNIX、Linux 和 OS X Shell 脚本\n\n当我们审视可用于开发 shell 脚本的工具时，主要有两类：类 UNIX shell 和\
  \ Microsoft shell。在本节中，我们将讨论类 UNIX shell，并在本章后面介绍 Microsoft shell。\n\n### Shell\
  \ 的可用性与选择\n\n类 UNIX 系统，包括多种 UNIX 和 Linux 变体，以及 Apple 的 OS X，都有一些常见的基于文本的 shell。我们通常可以在绝大多数可能遇到的类\
  \ UNIX 系统上找到 Korn shell、Z shell、C shell 和 Bourne-again shell，它们要么已经预装，要么易于安装。\n\n\
  注意\n\n自 1999 年首次出现并延续至今，Apple 的操作系统基于一个名为 XNU 的类 UNIX 内核，XNU 代表“X is Not Unix”。OS\
  \ X 在其时尚界面背后实际上是一个经过修改的 UNIX 操作系统，并且在许多方面与类似的 UNIX 和 Linux 衍生操作系统兼容，包括其使用的基于文本的\
  \ shell。\n\n#### C shell 兼容的 shell\n\nC shell，通常称为 `csh`，是用 C 编程语言编写的，其脚本风格通常类似于\
  \ C 编程语言。`csh` 的创建强调在命令行中的使用。它提供了有助于此类工作的功能，例如命令历史和文件名补全，这些功能在其开发时在 shell 世界中非常罕见。由于\
  \ shell 的工作方式和脚本编写方式存在差异，`csh` 几乎完全与其直接相关的 shell 之外的其他 shell 不兼容。\n\n`csh` 的一个衍生版本——TENEX\
  \ C shell，也称为 `tcsh`，由 Ken Green 于 1983 年发布。最终，`tcsh` 是 `csh` 的增强版，融合了命令历史、编辑和文件名补全的附加或增强功能。对于默认安装了类似\
  \ `csh` 的 shell 的系统，我们很可能会发现这个 shell 实际上是 `tcsh`，因为它是目前 C shell 家族中开发最活跃、维护最完善的\
  \ shell。\n\n#### Bourne 兼容的 shell\n\nBourne shell，通常简称为 `sh`，由 Stephen Bourne 在\
  \ 20 世纪 70 年代末开发，是其他几种 shell 的共同祖先，包括 Bourne-again shell、K shell 和 Z shell 等。在这些\
  \ shell 中，我们可以找到各种共同特性。\n\nKorn shell，以其开发者 David Korn 命名，于 20 世纪 80 年代初在贝尔实验室开发。Korn\
  \ shell，通常称为 `ksh`，支持一些方便的先进编程特性，例如执行浮点运算的能力，以及使用比其他一些 shell 更复杂的数据结构。虽然 `ksh` 确实支持可能使开发更简单或更高效的功能，但它在类\
  \ UNIX 系统上并不常见，作为默认 shell 出现的可能性也低于其他 Bourne 变体，例如 `bash`。\n\nZ shell，通常称为 `zsh`，常被认为是\
  \ Bourne 系列 shell 中功能最丰富的。`zsh` 由 Paul Falstad 于 20 世纪 90 年代初在普林斯顿大学开发。Falstad 在创建\
  \ `zsh` 时融入了大量有趣的功能，包括增强的命令补全、使用附加模块获取额外功能（如网络或更高级数学所需的功能），以及使用增强且更复杂的数据结构进行编程的能力。\n\
  \nBourne-again shell，通常称为 `bash`，由 Brian Fox 在 20 世纪 80 年代末为 GNU 项目开发。^(1) Bourne-again\
  \ 是对 Bourne shell 的引用，正如我们本节前面所讨论的。最终，`bash` shell 是我们在类 UNIX 系统上最常遇到的基于文本的 shell。许多\
  \ UNIX 和 Linux 系统（以及 OS X）都将 `bash` shell 作为默认安装提供。我们也可以找到移植到 Microsoft 操作系统上的 `bash`\
  \ shell，尽管在那里它不如原生基于文本的 shell 常见。\n\n由于 `bash` 是如此常见的 shell，本章后续关于类 UNIX shell 脚本的讨论以及我们将为这类系统开发的示例，都将重点放在\
  \ `bash` shell 的使用上。我们通常可以在较新的操作系统版本上找到 `bash`，而在较旧的版本上找到 Bourne。虽然不能保证在任何给定的渗透测试任务中我们都能访问到\
  \ `bash`，但它的可能性远高于找到其他已预装 shell 的可能性。\n\n#### 其他类 UNIX shell\n\n对于类 UNIX 操作系统，我们可能会在特定系统上找到大量其他\
  \ shell，从只有细微差别的（如紧凑的 BusyBox shell）到完全不同的（如 goosh shell）。几乎对于任何可以想象的目的，我们都能找到专门的\
  \ shell，或者具有不同功能集的现有 shell 的克隆。\n\n幸运的是，我们通常也会发现更常见的 shell 存在，通常一个系统上至少有两三种变体。虽然其中一些其他\
  \ shell 可能确实适合某些特定用途，但我们通常最好坚持使用最广泛部署和安装的 shell。\n\n### 使用 Shell\n\n通过观察来识别我们当前所在的\
  \ shell 可能很棘手。由于它们的行为各不相同，了解我们正在处理的是哪个 shell 非常重要。不同 shell 之间可能存在许多不同的特性：生成随机数的方式、内置命令的存在与否、设置的环境变量等等。\n\
  \n\n\n\n幸运的是，有一个简单且可靠的命令可以用来识别我们当前操作的 shell，即 `ps –p $$`。执行此命令时，我们通过进程 ID（`–p`）请求进程列表（`ps`），其中进程\
  \ ID 与当前进程（`$$`）匹配，也就是我们正在使用的 shell。在图 1.2 中，我们可以看到在不同 shell 之间切换的示例。\n\n![image](img/F000011f01-02-9781597497299.jpg)\n\
  \n图 1.2 识别正在使用的 Shell\n\n从图 1.2 的截图中可以看出，我们只需将 shell 的缩写名称作为命令输入，即可轻松进入一个新的 shell。例如，要进入\
  \ C shell，我们输入 `csh` 命令。\n\n**警告**\n\n在使用 shell 时，需要注意：进入一个新的 shell 实际上是在当前使用的 shell\
  \ 之上再添加一层 shell。在图 1.2 的示例中，当我们到达最后一个 shell `ksh` 时，已经嵌套了四层（shell）。要返回到最初的 `bash`\
  \ shell，我们需要输入三次 `exit` 命令，每次执行退出一个 shell。很容易看出，运行多层 shell 会很快变得混乱。\n\n## Bash 基础\n\
  \n我们需要一些基本要素来开始编写第一个 bash 脚本——传统的 Hello World。首先需要一个带有 bash shell 的环境。正如本章到目前为止所讨论的，大多数\
  \ UNIX 和 Linux 发行版以及 OS X 上通常都能找到 bash。在某些情况下，Windows 上也可能有 bash，我们将在本章后面再讨论这个话题。为了便于使用和保持一致性，我们将使用\
  \ BackTrack Linux 5^(2) 发行版上的 bash shell，正如本书引言中所述。\n\n其次，我们需要一个文本编辑器。许多文本编辑器都非常适合创建\
  \ shell 脚本，从基于文本的编辑器（如 `vi` 和 `Emacs`）到图形化编辑器（如 `Kate`）。选择哪个编辑器实际上取决于个人偏好，但为了方便起见，在接下来的\
  \ bash 讨论中，我们将坚持使用 `Kate`，如图 1.3 所示。\n\n![image](img/F000011f01-03-9781597497299.jpg)\n\
  \n图 1.3 Kate 编辑器\n\n### Hello World\n\n我们将直接进入脚本，然后再回过头来检查我们输入的每一行。在 Kate 中打开一个新文件，输入以下内容：\n\
  \n```\n#!/bin/bash\n\necho \"Hello World\"\n```\n\n现在，我们希望将文件保存到一个方便的位置，例如主目录的根目录或桌面上。在\
  \ Kate 中，我们可以通过点击**文件**，然后点击**保存**，导航到要保存文件的位置，在“位置”字段中输入名称（`helloworld`），然后再次点击**保存**。\n\
  \n为了运行我们刚刚创建的脚本，我们需要使其可执行。我们可以通过在包含该文件的目录中，从命令行输入命令 `chmod u+x helloworld` 来实现。此命令将为文件所有者添加执行权限。\n\
  \n现在我们已经创建了文件并使其可执行，只需运行它即可。我们可以使用命令 `./helloworld` 来运行。命令前面的 `./` 告诉 shell，我们应该执行当前目录中的脚本，而不是文件系统中可能存在的其他名为\
  \ `helloworld` 的脚本或命令。\n\n如果一切顺利，我们应该会看到类似于图 1.4 的输出。\n\n![image](img/F000011f01-04-9781597497299.jpg)\n\
  \n图 1.4 helloworld 脚本的输出\n\n简要回顾一下我们所做的：脚本的第一行告诉操作系统我们希望如何解释后续的所有内容。`#!/bin/bash`\
  \ 这一行由两部分组成。第一部分 `#!` 被称为 shebang，它告诉操作系统，该行接下来的内容将指示我们希望用什么来解释脚本，这里就是 `/bin/bash`，即\
  \ bash shell。bash 可能位于文件系统的其他位置，我们可以通过运行 `which bash` 来确定其位置。\n\n第二行很简单，就是打印字符串\
  \ `Hello World`。\n\n### 变量\n\n变量是一个存储区域，我们可以用它来在内存中保存某些内容。在 bash 中，我们可以有两种变量：全局变量和局部变量。全局变量通常对\
  \ shell 可用，并且对我们运行的任何脚本都可见。局部变量仅存在于当前 shell 中，一旦退出 shell 就会消失，因此它们仅对特定脚本的特定执行可见。对于大多数脚本，我们更倾向于使用局部变量。\n\
  \n我们可以轻松修改 `helloworld` 脚本，使其同时使用局部变量和全局变量，如下所示：\n\n```\n#!/bin/bash\n\nfunction\
  \ localmessage\n\n{\n\nlocal MESSAGE=\"Hi there, we’re inside the function\"\n\n\
  echo $MESSAGE\n\n}\n\nMESSAGE=\"Hello world, we’re outside the function\"\n\necho\
  \ $MESSAGE\n\nlocalmessage\n\necho $MESSAGE\n```\n\n这里我们引入了一些新概念，让我们来看看。第一个是函数，从第\
  \ 2 行开始。函数允许我们将可能重复的代码段放在一起，并在需要时随时调用，而无需每次都重写代码。它们还可以通过将函数内部使用的变量声明为局部作用域，从而将这些变量与脚本的其他部分隔离开来。我们可以使用\
  \ `local` 操作符来实现这一点。\n\n在示例的函数内部，有一行代码将 `MESSAGE` 变量的副本定义为局部变量，并将其赋值为“Hi there,\
  \ we’re inside the function”，然后将该消息回显到控制台。要调用这个名为 `localmessage` 的函数，我们只需使用函数名即可。\n\
  \n为了说明全局变量和局部变量，我们在脚本中两次使用了 `MESSAGE` 变量：一次在函数内部，一次在函数外部。运行脚本时，我们会看到 `MESSAGE` 的内容在函数之前、函数内部和函数之后分别被回显，最终输出结果如图\
  \ 1.5 所示。\n\n![image](img/F000011f01-05-9781597497299.jpg)\n\n图 1.5 变量脚本的输出\n\n\
  ### 参数\n\n当我们执行 shell 脚本时，可以通过参数的形式向它传递信息。如果我们正在构建一个网络相关的脚本，例如本章末尾将要开发的端口扫描器，我们可能希望向脚本传递一个\
  \ IP 地址或主机名。在这个例子中，我们将修改 `helloworld` 脚本，使其通过名称来称呼我们（稍作修改），如下所示：\n\n```\n#!/bin/bash\n\
  \nMESSAGE=\"Wake up, \"$1\n\nEcho $MESSAGE\n```\n\n因此，现在如果我们以 `./helloworld Neo…`\
  \ 的方式执行 `helloworld` 脚本，就可以看到，如图 1.6 所示，脚本将我们作为参数提供的输入放入了消息中。\n\n![image](img/F000011f01-06-9781597497299.jpg)\n\
  \n图 1.6 带参数的 helloworld 脚本输出\n\n让我们看看我们做了什么。我们只做了一处小改动，因此脚本的第一行和最后一行完全相同。在第二行，我们将其改为\
  \ `MESSAGE=\"Wake up, \"$1`。对于不熟悉参数的人来说，这可能有点令人困惑（`$1` 到底是什么？！）。在 bash 脚本中，参数有非常具体的命名约定，如表\
  \ 1.1 所示。\n\n表 1.1 参数变量\n\n| 参数 | 行为 |\n| --- | --- |\n| `$0` | 脚本的名称 |\n| `$1`\
  \ | 第一个参数 |\n| `$2` | 第二个参数 |\n| `$9` | 第九个参数 |\n| `$#` | 我们拥有的参数数量 |\n\n每个参数按顺序编号，其中\
  \ `$0` 被保留。因此，本质上，通过将 `$1` 放在 echo 行中，我们告诉 shell 将第一个参数的内容与我们提供的文本一起放入。\n\n**注意**\n\
  \n\n\n\n使用参数引出一个问题：我们最多可以有多少个参数？数量相当多，但这取决于系统和可用内存的大小。在大多数类 UNIX 系统上，我们可以通过执行命令\
  \ `getconf ARG_MAX` 来获得答案。在用于编写本章的 BackTrack 5 系统上，有 2,097,152 KB 的存储空间可用于参数。\n\n\
  ### 控制语句\n\n控制语句允许我们在脚本执行时控制其流程。我们可以使用多种控制语句。其中许多在常用编程语言中都很常见，尽管语法可能略有不同。这里我们将介绍条件语句和循环语句。\n\
  \n#### 条件语句\n\n条件语句允许我们根据程序接收的输入、变量的内容或其他多种因素来改变程序的行为。在 bash 中，最常用且最有用的条件语句是 `if`\
  \ 语句。我们可以像这样使用 `if` 语句：\n\n```bash\n#!/bin/bash\n\nif [ \"$1\" = \"Neo…\" ]; then\n\
  \   MESSAGE=\"Wake up, \"$1\nelse\n   MESSAGE=\"Hey, you’re not Neo\"\nfi\n\necho\
  \ $MESSAGE\n```\n\n我们需要运行脚本两次才能看到两个分支。最终结果应类似于 图 1.7 所示。\n\n![image](img/F000011f01-07-9781597497299.jpg)\n\
  \n图 1.7 使用 if 语句的 helloworld 脚本输出\n\n这次我们做的改动是加入了 `if` 语句。shebang 之后的第一行构成了语句的核心：`if\
  \ [ \"$1\" = \"Neo…\" ]; then`。这里我们表示，如果第一个参数（`$1`）的值等于 Neo…，那么我们应该设置一个特定的值 `\"\
  Wake up, \"$1`。这被称为字符串比较，因为我们比较的是两个字符串：`if` 语句第一行中的字符串和 `$1`（我们的第一个参数）的值。如果这个比较结果为假，则执行\
  \ `else` 部分中的代码，并将 `MESSAGE` 的值设置为 `Hey, you’re not Neo`。下一行的 `fi` 表示 `if` 语句的结束。\n\
  \n比较值有多种方式。继续使用字符串，我们可以通过添加一个字符来完全反转示例脚本的逻辑。如果将 `if` 语句第一行中的 `=` 改为 `!=`，则含义变为“不等于”而非“等于”。此外，我们还可以通过包含\
  \ 表 1.2 中所示的数学运算符来比较整数。\n\n表 1.2 比较运算符\n\n| 运算符 | 行为 |\n| --- | --- |\n| `-eq` |\
  \ 等于 |\n| `-ne` | 不等于 |\n| `-gt` | 大于 |\n| `-lt` | 小于 |\n| `-le` | 小于或等于 |\n\n我们可以在\
  \ `if` 语句中使用这些运算符，如下所示：\n\n```bash\nif [ \"$NUM1\" -eq \"$NUM2\" ]; then\n   echo\
  \ \"$NUM1 is equal to $NUM2\"\nelse\n   echo \"$NUM1 is not equal to $NUM2\"\nfi\n\
  ```\n\n#### 循环语句\n\n在 bash 中，有几种不同的机制可用于重复循环。其中，`for` 循环和 `while` 循环是最常用且最有用的。两者最终都能达到类似的结果，但实现方式略有不同。\n\
  \n使用 `for` 循环，我们可以遍历一个列表，对列表中的每个项目执行操作。例如：\n\n```bash\nfor files in /media/^∗\n\
  do\n   echo $files\ndone\n```\n\n这里我们实际上构建了一个非常原始的 `ls` 命令版本，用于显示目录中的文件和文件夹。在第一行\
  \ `for files in /media/^∗` 中，我们设置了 `for` 循环的开始。这里我们定义了用于存放每个文件的变量（`files`），并指向特定的目录及其内容（`/media/^∗`）。`do`\
  \ 和 `done` 语句定义了我们将对每个找到的文件或目录执行的操作的开始和结束，在它们之间，我们 `echo` 了之前定义的 `files` 变量的值。通过简单的修改，我们可以使用这样一个简单的脚本遍历整个文件系统，寻找可能感兴趣的文件，并在过程中复制它们。\n\
  \n我们还可以使用 `while` 循环，它会在条件为真时持续执行。我们可以使用 `while` 循环来执行某个命令特定次数，例如：\n\n```bash\n\
  #!/bin/bash\n\ni=0\nwhile [ $i -lt 4 ]\ndo\n   echo \"hello\"\n   i=$[$i+1]\ndone\n\
  ```\n\n在这个例子中，我们引入了一些新内容，也使用了一些之前讨论过的内容。在第 2 行 `i=0` 中，我们初始化了将在下一行使用的变量。这样做是为了将变量设置为零，因为我们将把它用作计数器。在第\
  \ 3 行，我们设置了 `while` 循环：`while [$i –lt 4]`。这意味着只要 `i` 中存储的值小于 4，我们就继续执行 `while` 循环。然后我们看到\
  \ `do` 和 `done` 结构，与本节前面 `for` 循环中使用的相同。在循环内部，我们 `echo hello`，并递增计数器（`i`），这样我们最终会退出循环。计数器递增语句是\
  \ `i=$[$i+1]`。这表示取 `i` 当前的值并加 1，然后将结果放回 `i` 中，最终给 `i` 当前的值加 1。运行此脚本的结果应如 图 1.8 所示。\n\
  \n![image](img/F000011f01-08-9781597497299.jpg)\n\n图 1.8 forloop 脚本的输出\n\n## 用 Bash\
  \ 整合所有内容\n\n现在我们将用 bash 构建一个快速的端口扫描器。扫描器的核心是 `/dev/tcp` 设备，它使我们能够利用 bash 内置的网络功能。根据运行\
  \ bash 的具体平台，`/dev/tcp` 的支持可能并未内置于我们运行的 bash 版本中，但通常我们可以解决这个问题。特别是，许多与 Debian 相关的发行版（包括本章示例中使用的\
  \ BackTrack 5 发行版）都可能存在此问题。我们可以通过执行下一节中的步骤 5 来检查 `/dev/tcp` 支持。\n\n### 为 bash 添加\
  \ `/dev/tcp/` 支持\n\n我们可以快速重新编译 bash 以获得所需的 `/dev/tcp` 支持。这对某些人来说可能听起来有点吓人，但实际上并不难。以下是在\
  \ BackTrack 5 上重新编译 bash 的步骤：[[2]](#CHP001.html_BIB2)\n\n1. 下载 bash 的最新源代码文件。目前是\
  \ bash 4.2，可以在 [ftp.gnu.org](http://ftp.gnu.org) 找到。我们可以使用 `wget` 下载，如下所示：\n\n```bash\n\
  wget ftp.gnu.org/gnu/bash/bash-4.2.tar.gz\n```\n\n2. 从归档文件中提取文件并切换到该目录：\n\n```bash\n\
  tar –xvzf bash-4.2.tar.gz\ncd bash-4.2\n```\n\n3. 提取文件后，配置并安装 bash：\n\n```bash\n\
  ./configure –enable-net-redirections\nmake && make install\n```\n\n4. 将现有的 bash\
  \ 替换为新编译的版本：\n\n```bash\nmv /bin/bash /bin/bash-orig\nln –s /usr/local/bin/bash\
  \ /bin/bash\n```\n\n5. 使用以下命令测试你的工作：\n\n```bash\ncat < /dev/tcp/time.nist.gov/13\n\
  ```\n\n应该会返回类似以下内容：\n\n```\n55647 11-03-27 15:41:17 50 0 0 75.2 UTC(NIST)^∗\n```\n\
  \n如果步骤 5 仍然出现错误，你可能需要快速重启系统以清除所有问题。这通常可以解决任何剩余问题。\n\n### 用 bash 构建端口扫描器\n\n以下是用\
  \ bash 构建的简单端口扫描器的代码。该脚本接受三个参数：主机名或 IP 地址、开始扫描的端口以及停止扫描的端口。我们可以像这样运行它：`./portscanner\
  \ codingforpentesters.com 1 100`。\n\n```bash\n#!/bin/bash\n\n#从参数中填充我们的变量\nhost=$1\n\
  startport=$2\nstopport=$3\n\n#函数 pingcheck\n#ping 设备以检查其是否在线\nfunction pingcheck\n\
  {\nping=’ping -c 1 $host | grep bytes | wc -l’\nif [ \"$ping\" -gt 1 ];then\n  \
  \ echo \"$host is up\";\nelse\n   echo \"$host is down quitting\";\n   exit\nfi\n\
  }\n\n#函数 portcheck\n#测试端口是否开放\nfunction portcheck\n{\nfor ((counter=$startport;\
  \ counter<=$stopport; counter++))\n```\n\n\n\n\n\n```\ndo\n\n   (echo >/dev/tcp/$host/$counter)\
  \ > /dev/null 2>&1 && echo \"$counter open\"\n\ndone\n\n}\n\n#run our functions\n\
  \npingcheck\n\nportcheck\n```\n\n在脚本顶部，我们看到了 shebang，用于指定要使用的解释器，以及几行代码，用于将参数中的值分配给要扫描的主机（`host`）、起始端口（`startport`）和结束端口（`stopport`）的相应变量。在第二行，我们还遇到了\
  \ bash 中可用的注释标记 `#`。该命令允许我们指示解释器忽略 `#` 之后行上的任何内容。然后我们有两个函数：`pingcheck` 用于检查主机是否在网络中可用，`portcheck`\
  \ 用于测试开放端口。\n\n在 `pingcheck` 函数中，我们将几个不同的工具串联在一起，以评估我们能否访问网络上的设备，并将最终结果放入 `ping`\
  \ 变量中。反引号（`）表示我们正在执行命令替换。命令替换会将一对反引号之间的代码段传递给 shell 执行，然后替换命令的结果。在本例中，我们通过管道 `|`\
  \ 将一系列命令串联起来，管道将一个命令的输出传递给另一个命令。\n\n我们的整个命令执行 `ping –c 1 $host`，向目标主机发送一个数据包，然后将\
  \ `ping` 命令的输出传递给 `grep` 以查找字符串 `bytes`，再将 `grep` 的输出传递给单词计数命令 `wc`。当我们运行 `ping`\
  \ 命令时，无论成功还是失败，我们至少会找到一次字符串 `bytes`。如果 ping 成功，我们会找到多次。我们使用 `wc` 命令来统计该字符串出现的次数，次数大于\
  \ 1 表示 ping 主机成功。\n\n如果 `ping` 成功，我们向控制台 `echo` 一条消息并返回脚本主体。如果 `ping` 失败，我们向控制台\
  \ `echo` 一条消息并退出。\n\n在 `portcheck` 函数中，我们测试指定的端口以查看它们是否开放。这里我们设置了一个简单的 for 循环，从起始端口循环到结束端口，每个端口都来自运行脚本时传入的参数。然后我们进入一个\
  \ do 循环，其中包含整个脚本的核心。\n\n这一行利用了我们在 bash 中启用的 `/dev/tcp` 设备。本质上，我们尝试向 `/dev/tcp/<主机名>/<端口号>`\
  \ `echo` 一些内容（空内容）；如果成功，我们将该命令的结果发送到 `/dev/null`，实际上丢弃它们，同时重定向可能遇到的任何错误到控制台，从而也丢弃它们。此外，我们使用\
  \ `&&` 运算符（与）向控制台 `echo` 字符串 `<端口号> open`。最终，这使我们能够检测端口是否开放，并在开放时回显端口号。\n\n### 改进脚本\n\
  \n我们可以通过多种方式改进端口扫描脚本，使其更高效、功能更强大：\n\n• 目前我们无法处理扫描多个主机。我们可以通过增加额外参数的支持，或者从文件中读取主机或\
  \ IP 来添加此功能。\n\n• 在 `pingcheck` 函数中，当我们遇到不响应 `ping` 的设备时，需要等待几秒钟让 `ping` 命令返回并告知我们。如果在\
  \ `ping` 命令中包含超时设置，我们很可能可以大大缩短这一时间。\n\n• 在 `portcheck` 函数中，我们只测试传输控制协议（TCP）端口。如果我们还想测试用户数据报协议（UDP）端口，可以以与现有代码非常相似的方式使用\
  \ `/dev/udp` 设备。我们还需要包含适当的参数来指示是要扫描 TCP 端口、UDP 端口还是两者都扫描。\n\n这些只是我们可能添加的众多额外功能中的一小部分，目的是增加功能性、使脚本更高效地工作，并让工具更加有用和易用。\n\
  \n## Windows 脚本\n\n截至 2011 年 3 月，微软操作系统占据了操作系统市场 75% 的份额 [[3]](#CHP001.html_BIB3)。作为渗透测试人员，如果忽视这一巨大市场份额的脚本能力，那将是愚蠢的。幸运的是，微软操作系统目前拥有非常完善且强大的命令行管理操作能力，并为我们提供了诸如\
  \ `PowerShell` 之类的工具来辅助我们的工作。\n\n### Shell 的可用性与选择\n\n在微软操作系统上，由于操作系统本身以及标准应用程序和实用工具通常具有封闭性，我们通常只能访问内置的基于文本的\
  \ shell。即便如此，当我们需要为 Windows 编写脚本时，我们仍有几种选择，包括使用标准命令解释器和 `PowerShell` 进行脚本编写，以及使用\
  \ `Cygwin` 或我们可能找到的其他自定义解决方案。\n\n### [Command.com](http://command.com) 和 `CMD.exe`\n\
  \n[Command.com](http://command.com) 和 `CMD.exe` 是大多数微软操作系统中可用的两个主要 shell。在这些操作系统的较新\
  \ 64 位版本中，截至撰写本文时，[command.com](http://command.com) 已不可用，并且未来可能继续不可用。\n\n最终，[command.com](http://command.com)\
  \ 和 `CMD.exe` 是两种不同的工具。`CMD.exe` 是操作系统的基于文本的界面。它不是 DOS shell，也不提供与 DOS shell 相同的功能。[Command.com](http://Command.com)\
  \ 实际上是在 shell 中运行的 16 位 DOS 版本，提供类似但不完全相同的功能集。使用这两个 shell 时最明显的区别之一是 [command.com](http://command.com)\
  \ 不支持长文件名，因此必须使用诸如 `Progra~1` 之类的结构来访问诸如 `Program Files` 之类的目录。\n\n#### 批处理文件\n\n\
  批处理文件自 MS-DOS 早期就已存在，并一直延续到最新的微软操作系统。这些以 `.bat` 扩展名标识的脚本用于各种任务，大多属于小型实用功能，但如果我们回顾较旧的操作系统，会发现它们实际上被用于启动操作系统的某些部分。\n\
  \n批处理文件脚本有自己的语言，虽然不太复杂，但在某些方面仍然有用。我们可以编写一个快速的批处理脚本，从文件中 `ping` 一个 IP 地址列表：\n\n```\n\
  @echo off\n\nsetLocal EnableDelayedExpansion\n\nfor /f \"tokens=^∗ delims= \" %%a\
  \ in (hosts.txt) do (\n\nping %%a\n\n)\n```\n\n在这个简单的批处理文件中，我们首先关闭 `echo`，以便不输出脚本执行的细节，然后设置\
  \ `EnableDelayedExpansion`，使变量能够正确工作，并且只在 for 循环内部展开。接下来我们进入循环，对于 `hosts.txt` 中的每一行，我们\
  \ `ping` 该主机。这确实是一个非常简单的脚本，但能完成任务。\n\n现在我们只需要一个名为 `hosts.txt` 的文件，每行一个 IP 地址，我们的批处理文件就会逐个处理它们。显然，我们可以为这个小程序添加相当多的格式化、逻辑和流程控制以及许多其他功能，但如果我们想开发一个更强大的工具，使用不同的脚本语言可能会更好。那些真正有兴趣学习批处理文件细节的人可以查看微软\
  \ TechNet 网站上的资源。^(3) 其中一些资源目前可能有点过时，但大部分文档仍然准确，足以让你开始使用批处理文件。\n\n### PowerShell\n\
  \n\n\n\nPowerShell 是微软操作系统家族中相对较新的成员，1.0 版本于 2006 年发布，2.0 版本于 2009 年发布。PowerShell\
  \ 是一种功能非常丰富的基于文本的 shell，支持大量可通过命令行访问的功能，这些功能以 `cmdlets` 的形式呈现，也可以通过脚本或编译的可执行文件来使用。PowerShell\
  \ 还能访问大多数微软 .NET 语言所能访问的功能。\n\n从 shell 的角度来看，PowerShell 是对微软传统 shell（[command.com](http://command.com)\
  \ 和 `CMD.exe`）的巨大改进。这两个 shell 主要是为了向后兼容而设计的，包含一组通用命令，其中许多命令可以追溯到它们所基于的微软 DOS 的原始版本。\n\
  \n对于习惯了类 UNIX 操作系统命令的用户来说，一个很快会注意到的特性是，PowerShell 为许多常见命令提供了别名。这些用户经常在向微软 shell\
  \ 发出 `ls` 命令时被“不是内部或外部命令”的错误信息所困扰。在 PowerShell 中，我们可以运行诸如 `ls`、`cp` 和 `mv` 之类的命令，shell\
  \ 会执行我们期望的相应命令。我们还可以在 `get-help` cmdlet 中找到与 `man` 命令等效的功能，并且其别名被方便地设置为 `man`。\n\
  \n从脚本编写的角度来看，PowerShell 比微软之前的努力有了巨大的改进。过去，微软曾尝试多种方式为我们提供在 Windows 平台上进行脚本编写的合理工具，从批处理文件到\
  \ VBScript，再到 Windows 脚本宿主。虽然所有这些工具在某个方面确实有用，但没有一个能真正让我们获得类 UNIX shell（如 `bash`）的能力。\n\
  \n在 PowerShell 中，我们可以利用许多内置的实用函数，称为 `cmdlets`，我们可以直接从 shell 中以简单命令的形式使用它们，或者将它们包含在脚本中，以便通过简单命令（例如用于网络通信的命令）访问复杂功能。PowerShell\
  \ 使用的脚本语言也非常强大，能够开发从简单工具到复杂应用程序的一切内容，而不会受到微软早期脚本语言中一些笨拙结构的困扰。\n\n### Cygwin\n\n\
  Cygwin 为我们在微软操作系统上进行 shell 脚本编写提供了一个有趣的替代方案。Cygwin 是一组可以安装在这些操作系统上的工具，旨在为 Windows\
  \ 提供与类 UNIX 操作系统常见的许多命令和工具的兼容性。这些功能包括使用类 UNIX 的基于文本的 shell，包括我们最喜欢的 `bash` shell。\n\
  \n提示\n\nWindows 上的 Cygwin 是那种“方枘圆凿”的工具。尽管它在某些方面非常方便，但在渗透测试期间，我们绝对不应该指望在微软操作系统上能访问\
  \ `bash`。不过，偶尔也会有意外的惊喜，所以查看一下也无妨。\n\nCygwin 提供的 `bash` shell 是一个标准的 `bash` shell，通常允许我们在\
  \ Windows 上运行大多数在类 UNIX 操作系统上可以运行的 shell 脚本。这些脚本容易出问题的主要地方在于调用那些并非直接内置于 shell 本身的实用程序或函数时。尽管\
  \ Cygwin 在提供许多标准 UNIX 功能方面做得很好，但它并没有提供我们在直接使用 UNIX、Linux 或 OS X 时可能找到的完整库。不过，通常我们可以通过自己的代码或\
  \ Windows 操作系统中等效的原生命令来解决这些问题并替代缺失的功能。\n\n### 其他 Shell\n\n尽管如前所述，非原生的基于文本的 shell（即非微软开发的\
  \ shell）在这些操作系统上并不常见，但我们仍可能遇到一些，包括 Take Command Console (TCC)、4DOS 和 Console。在 Windows\
  \ 2000 和 Windows XP 时代，人们对这类替代 shell 的关注度更高。随着微软操作系统整体上命令行工具的增强，以及通过 PowerShell\
  \ 等工具改进的脚本编写能力，似乎缓解了推动替代 shell 开发的部分压力。\n\n## PowerShell 基础\n\n作为 PowerShell 脚本编写的入门，我们将从传统的\
  \ `Hello World` 脚本开始。为了开始，我们再次需要一些组件。根据我们使用的具体微软操作系统，可能已经安装了 PowerShell，也可能没有。在\
  \ Windows 7 或 Windows Server 2008 R2 及更高版本中，PowerShell 已经预装。对于其他版本（最低要求 Windows\
  \ XP SP2），可以从微软下载 PowerShell。^(4) 本章中的所有 PowerShell 示例都是在 Windows 7 SP1 上开发的。\n\n\
  我们还需要一个文本编辑器。最简单的就是 Windows 自带的记事本。如果我们使用的是 PowerShell 2.0（Windows 7 自带的就是这个版本），我们还可以使用\
  \ PowerShell 集成脚本编辑器 (ISE)。可以通过运行 `powershell_ise.exe` 来访问 ISE，或者右键单击 `.ps1` 文件并选择\
  \ `Edit`。在接下来的 PowerShell 示例中，我们将使用 ISE 作为编辑器。\n\n提示\n\n如果我们远程访问了一个微软系统，并且只能通过命令行工作，那么创建或编辑文件可能会有点问题。在较旧的微软操作系统（Windows\
  \ XP 及更早版本）上，我们可以使用 `edit` 命令，它提供了一个方便的文本编辑器，可以在命令行下工作。在较新版本中，这个命令没有了。最接近文本编辑器的命令是\
  \ `copy con`。我们通过 `copy con` 加上文件名来调用它，例如 `copy con test.txt`。这允许我们创建（但不能编辑）多行文件，完成后按\
  \ `Ctrl-z` 然后 `Enter`。\n\n接下来，我们需要稍微调整系统安全设置，使其放宽限制，允许我们运行自己的脚本。如果在此之前运行 PowerShell\
  \ 脚本，只会收到错误信息，脚本会拒绝运行。为了在 Windows 7 上进行此更改，我们需要导航到“开始”菜单中的“所有程序”|“附件”|“Windows PowerShell”，然后右键单击\
  \ `Windows PowerShell` 快捷方式，选择“以管理员身份运行”。\n\n警告\n\n将 PowerShell 脚本的执行策略更改为比默认设置更宽松，会在我们的系统上打开一个漏洞！尽管我们只允许运行\
  \ PowerShell 脚本所需的最低权限，但这仍然是一个安全漏洞，坏人可能会利用它来攻击我们。对于这个特定设置，这种情况相对不太可能发生，但*脚本编写者需谨慎*。有关此设置的更多详细信息，微软提供了关于我们可以使用的各种选项的更多信息。^(5)\n\
  \n这将打开一个具有管理员权限的 PowerShell shell，以便我们进行所需的更改。在此窗口中，我们需要输入 `Set-ExecutionPolicy\
  \ RemoteSigned`。这将设置 PowerShell 的执行策略，允许我们运行自己创建的任何脚本，以及下载的由受信任发布者签名的任何脚本。\n\n权限设置交换的界面应如图\
  \ 1.9 所示。现在，我们应该准备好创建我们的 `HelloWorld` 脚本了。\n\n![image](img/F000011f01-09-9781597497299.jpg)\n\
  \n图 1.9 在 PowerShell 中更改权限\n\n### Hello World\n\n创建脚本的最简单方法之一是创建一个名为 `HelloWorld.PS1`\
  \ 的文件，然后右键单击它并选择 `Edit`。这将打开 PowerShell ISE，如图 1.10 所示。\n\n\n\n\n\n![image](img/F000011f01-10-9781597497299.jpg)\n\
  \n图 1.10 PowerShell ISE\n\n在顶部窗口中，紧挨着数字 1 的位置，我们将粘贴以下代码：\n\n```\nWrite-Output \"\
  Hello World\"\n```\n\n就是这么简单。保存文件后，我们可以通过打开 PowerShell 终端、导航到该文件并运行 `HelloWorld.PS1`\
  \ 来手动执行代码，或者点击 ISE 工具栏中的绿色三角形（从左数第 10 个）来运行。在 ISE 中，我们将在界面的中间窗口中看到脚本执行的输出。`Write-Output`\
  \ 是我们在本节前面讨论过的 PowerShell cmdlet 之一，它包含了打印语句所需的所有功能。另外请注意，与我们在 bash 中的示例不同，我们不需要使用类似\
  \ shebang 的东西来指示需要使用的解释器。在 Windows 中，此功能通过使用文件扩展名 `.PS1` 来处理，该扩展名指示脚本应由 PowerShell\
  \ 处理。\n\n### 变量\n\nPowerShell 中的变量再次与我们可能在 bash 中遇到的非常相似。默认情况下，变量没有类型，这意味着给定的变量可以包含文本或数值数据。变量始终以\
  \ `$<变量名>` 的形式引用，无论是向它们赋值还是从中提取数据。让我们看一个简单的变量示例和一个新的 cmdlet：\n\n```\n$processes\
  \ = Get-Process powershell_ise\n\n$processes\n```\n\n在这个例子中，我们调用 `Get-Process` cmdlet\
  \ 来获取我们用于开发脚本的 ISE 应用程序的进程信息。然后，我们将 cmdlet 返回的数据存储到 `$processes` 变量中。在下一行，我们输出 `$processes`\
  \ 的内容。如果一切顺利，我们应该看到类似以下的输出：\n\n```\nPS C:\\> C:\\variables.ps1\n```\n\n![Image](img/T000011tabT0020.jpg)\n\
  \n我们输出的 cmdlet 返回结果包含了所请求进程的句柄、非分页内存、分页内存、工作集、虚拟内存、CPU 使用率、进程 ID 和进程名称等信息。另外请注意，cmdlet\
  \ 的格式化输出在存储到变量并再次输出后仍然保留。\n\n我们还可以在 PowerShell 中设置局部和全局变量作用域。我们还将讨论 PowerShell 中的函数，因为这可以很好地演示如何处理变量作用域。\n\
  \n```\nfunction hello{\n\n$LOCAL:name = \"whoever you are\"\n\nwrite-output \"hello\
  \ there \"$name\n\n}\n\n$name = $args[0]\n\nWrite-output \"hello there \"$name\n\
  \nhello\n\nwrite-output \"hello there \"$name\n```\n\n我们在脚本中遇到的第一个元素是用于演示变量作用域的函数。PowerShell\
  \ 中的函数与我们之前在 bash 中讨论的非常相似。函数的第一行是函数标签、我们想要引用的函数名称（本例中为 `hello`）以及开始函数的左花括号 `{`。在函数内部的第一行，我们可以看到创建局部变量的行。这个使用\
  \ `local` 关键字创建的变量只会在函数的作用域内存在，并且无论我们如何命名，函数都会保留其自己的内容副本。在这里，我们将 `$LOCAL:name` 的内容设置为字符串\
  \ \"whoever you are\"。在下一行，我们输出问候语和变量的内容，然后用 `}` 关闭函数。\n\n在脚本的主体中，我们从命令行接收一个参数 `$args[0]`，并将其内容放入\
  \ `$name` 中。请注意，这与我们在函数中使用的变量名相同，但没有使用 `LOCAL` 标签来设置变量作用域，这隐式地将变量设置为全局作用域。接下来，我们输出问候语和\
  \ `$name` 的内容，运行函数，然后再次输出问候语和变量内容。从图 1.11 的输出中可以看出，尽管我们在函数中更改了局部副本 `$name` 的内容，但由于变量作用域的不同，脚本主体中同名变量的内容并未改变。\n\
  \n![image](img/F000011f01-11-9781597497299.jpg)\n\n图 1.11 不同的变量作用域\n\n### 参数\n\n\
  我们可以用非常简单的方式在 PowerShell 中处理参数。为了扩展我们的进程脚本以使用参数，我们可以执行以下操作：\n\n```\n$processes =\
  \ Get-Process $args\n\n$processes\n```\n\n要运行此脚本，我们需要提供一个参数，其中包含要检索信息的进程名称。在本例中，我们将使用\
  \ explorer 进程作为参数，因此我们将运行 `./arguments.ps1 explorer`。我们应该看到类似于图 1.12 的输出，显示至少几个\
  \ explorer 进程的信息。\n\n![image](img/F000011f01-12-9781597497299.jpg)\n\n图 1.12 explorer.ps1\
  \ 的输出\n\n当我们在 PowerShell 中接收参数时，它被存储在一个名为 `$args` 的数组中。我们可以将数组视为一个具有多个存储单元（称为元素）的变量，每个元素都可以单独寻址。使用数组，我们可以用一个数据结构存储多条信息，根据需要添加、更改或删除它们，而不会影响我们不想更改的任何数据。\n\
  \n为了寻址数组中的第一个元素（它保存了我们的第一个（也是唯一的）参数，即我们要检索信息的进程名称），我们可以直接引用数组的第一个元素 `$args[0]`，或者简单地用\
  \ `$args` 引用整个数组的内容。如果我们想引用更多参数，只需添加一个数字，例如 `$args[1]` 引用第二个参数，`$args[2]` 引用第三个参数，依此类推。\n\
  \n如果我们想修改代码以拉取多个进程的信息，我们可以将脚本更改为：\n\n```\n$processes = Get-Process $args[0], $args[1]\n\
  \n$processes\n```\n\n然后以 `.\\arguments.ps1 explorer winword` 运行脚本，将返回两个进程的信息（对于\
  \ explorer 来说可能不止一个）。\n\n### 控制语句\n\n正如我们在本章第一部分讨论 bash 中的控制语句时所述，我们在 PowerShell\
  \ 中也可以找到相同的概念，实际上几乎所有高级编程语言中都有。在本节中，我们将讨论 PowerShell 中条件语句和循环函数的一些示例。\n\n#### 条件语句\n\
  \nPowerShell 中的条件语句与我们在许多其他语言中可能遇到的类似。这里我们将介绍 if else 语句和 switch 语句。\n\nIf else\
  \ 语句是大多数语言中 if 语句的一个小变体。我们可以将 if 语句添加到之前的进程示例中，以增加一些智能：\n\n```\n$processes = Get-Process\n\
  \nIf ($processes –match \"winword\"){\n\n   write-output \"Microsoft Word is running\"\
  \n\n}else{\n\n   write-output \"Microsoft Word is not running\"\n\n}\n```\n\n在这个例子中，我们运行与之前相同的代码来转储所有正在运行的进程的信息。然后我们设置\
  \ if 语句来匹配 `Get-Process` 的输出，以查找字符串 winword，即 Microsoft Word 的进程名称。`–match` 运算符使用正则表达式来搜索我们提供的字符串，在这个特定实例中是一个不错的选择，因为它使我们不必手动解析整个进程列表来查找所需的字符串。\n\
  \n根据是否匹配，我们可以确定进程是否正在运行，并向用户提供相应的输出。\n\nSwitch 语句的功能与 if 语句大致相同，但使我们能够根据所发现的条件配置更复杂的操作集。通过使用\
  \ switch，我们可以使进程检查器更强大：\n\n```\n$processes = Get-Process\n\nswitch -regex ($processes){\n\
  ```\n\n\n\n\n\n```\n\"winword\" {write-output \"Microsoft Word is running\"}\n\n\
  \"explorer\" {write-output \"Explorer is running\"}\n\n\"vlc\" {write-output \"\
  VLC is running\"}\n\n```\n\n现在我们可以一次性查找多个进程。这里我们使用了相同的 cmdlet 来转储进程列表，并且不再受 `if`\
  \ 语句的限制，而是通过 `switch` 语句构建了一组更复杂的条件。我们在脚本的第 2 行设置了 `switch` 的第一行，并配置匹配使用正则表达式（regex），与存储进程列表的变量\
  \ `$processes` 的内容进行匹配。\n\n在 `switch` 语句的主体中，我们设置了一系列行，每一行对应一个不同的潜在匹配项。在每一行中，我们非常简单的正则表达式会检查该行是否包含进程名称。有趣的是，由于我们的变量\
  \ `$processes` 包含多行文本，`switch` 会尝试将变量中的每一行与 `switch` 中的每个 case 进行匹配。这实际上很方便，因为正如我们在图\
  \ 1.13 中看到的，有些进程确实有多个实例在运行。\n\n![image](img/F000011f01-13-9781597497299.jpg)\n\n\
  图 1.13 Switch 示例的输出\n\n### 循环\n\n在 PowerShell 中，我们可以使用多种循环结构，这里我们将介绍几种比较常见且有用的可能性。PowerShell\
  \ 中的循环与大多数编程语言中的循环格式非常相似。我们可以介绍的最简单的循环结构之一是 `for` 循环：\n\n```\nfor ($counter=0; $counter\
  \ -lt 10; $counter++)\n\n{\n\n   $ping = New-Object System.Net.NetworkInformation.Ping\n\
  \n   $ping.Send($args[0])\n\n   Start-Sleep -Second 5\n\n}\n```\n\n我们希望使用 `.\\looping.ps1`\
  \ [codingforpentesters.com](http://codingforpentesters.com) 来运行这个脚本。让我们看看这里做了什么。首先，我们设置了\
  \ `for` 循环的开始部分：`for ($counter=0; counter –lt 10; $counter++)`。这一行将 `$counter` 初始化为\
  \ 0。这个变量将记录我们的 `for` 循环执行了多少次。接下来，我们使用 `–lt` 判断 `$counter` 是否仍然小于 10。如果为真，则继续；否则，立即停止。最后，我们将\
  \ `$counter` 的值增加 1。接下来，我们可以看到循环体被大括号 `{}` 包围。\n\n在循环内部，我们使用了一小段 .NET 代码来调用其中的 ping\
  \ 函数。由于 PowerShell 是微软的原生工具，它能够充分利用微软的 .NET 开发框架及其附带的所有功能。在这个特定例子中，我们实例化了一个用于 ping\
  \ 的对象，对第一个参数提供的主机名或 IP 执行 ping 操作，然后休眠五秒。休眠结束后，我们会回到循环顶部，重复这个过程总共 10 次。在输出中，每次执行循环时我们都会看到\
  \ ping 的结果。\n\n我们还可以使用另一种称为 `foreach` 循环的结构，如下所示：\n\n```\n$devices = @(\"codingforpentesters.com\"\
  ,\"happypacket.net\")\n\nforeach ($device in $devices)\n\n{\n\n   write-output \"\
  device is \" $device\n\n   $ping = New-Object System.Net.NetworkInformation.Ping\n\
  \n   $result = $ping.Send($device)\n\n   $result\n\n}\n```\n\n这里，我们的做法略有不同。在这个例子中，我们希望用\
  \ ping 例程来 ping 多台机器。我们可以通过命令行以参数形式输入这些机器，或者从文件中读取，但这里我们将使用一个数组来保存主机名。\n\n脚本的第一行设置并填充了数组。我们可以看到，这与设置和填充变量非常相似，只是多了一些额外信息来表明我们希望它是一个数组，即使用\
  \ `@` 符号。我们还需要将元素列表放在括号内，并用逗号分隔每个元素。\n\n构建数组后，我们设置了 `foreach` 循环。这里我们写的是 `foreach\
  \ ($device in $devices)`。这意味着对于名为 `$devices` 的数组中的每一项，我们都应该对每个单独的元素执行某些操作，我们将该元素称为\
  \ `$device`。在处理过程中，我们可以使用任何变量名来保存每个元素的内容，例如 `$i` 或 `$monkey`；叫什么名字其实无关紧要。\n\n与之前的\
  \ ping 例程相比，唯一的变化是将 `$ping.Send` 的目标改为 `$device`，以匹配我们的 `foreach` 配置。\n\n## 用 PowerShell\
  \ 整合所有内容\n\n现在，我们将使用本章讨论的各种 PowerShell 函数来组装一个小型端口扫描工具，同时还会沿途添加一些新内容。这个工具远非完美，但我们将在讲解代码时讨论潜在问题，并谈谈一些可以改进的地方以及如何实现这些改进。\n\
  \n### 用 PowerShell 构建端口扫描器\n\n我们开始构建端口扫描器。这个工具有两种使用方式。当扫描单个端口时，我们可以运行类似 `.\\portscanner.ps1`\
  \ [codingforpentesters.com](http://codingforpentesters.com) 80 的命令。这将检查端口 80 并退出。我们也可以使用\
  \ `.\\portscanner.ps1 multi 80 85` 来指定端口范围。这将依次检查端口 80 到 85。\n\n```\n#将我们的参数放入各自的变量中\n\
  \n$device = $args[0]\n\n$port = $args[1]\n\n$start = $args[2]\n\n$stop = $args[3]\n\
  \n#函数 pingedevice\n\n#ping 设备以检查它是否在网络中\n\nfunction pingdevice{\n\n   if(test-connection\
  \ $device -erroraction silentlycontinue){\n\n     write-output \"$device is up\"\
  \n\n   }else{\n\n     write-output \"$device is down\"\n\n     exit\n\n   }\n\n\
  }\n\n#函数 checkports\n\n#检查我们的端口是否开放\n\nfunction checkports{\n\n   if ($port -match\
  \ \"multi\"){ #此分支检查端口范围\n\n     for ($counter=$start; $counter -le $stop; $counter++)\n\
  \n     {\n\n       write-output \"testing port $counter on $device\"\n\n       $porttest\
  \ = new-object Net.Sockets.TcpClient\n\n       try{\n\n         $connect = $porttest.connect($device,$counter)\n\
  \n         write-output \"$counter is open\"\n\n       }catch{\n\n         write-output\
  \ \"$counter is closed\"\n\n       }\n\n     }\n\n   }else{ #此分支检查单个端口\n\n       write-output\
  \ \"testing port $port on $device\"\n\n       $porttest = new-object Net.Sockets.TcpClient\n\
  \n       try{\n\n         $connect = $porttest.connect($device,$port)\n\n         write-output\
  \ \"$port is open\"\n\n       }catch{\n\n         write-output \"$port is closed\"\
  \n\n       }\n\n   }\n\n}\n\n#运行我们的函数\n\npingdevice\n\ncheckports\n```\n\n查看代码清单，我们可以看到本节讨论的各种结构，以及一些为了增加多样性而引入的新内容。首先看到的新内容是注释，因为我们的脚本变得稍微大了一些。我们可以使用\
  \ `#` 字符来表示我们不希望解释器对该行或该行的部分内容进行任何操作。我们可以将注释标记放在行首，或者放在行中的任何位置，之后的所有内容都会被忽略。\n\n\
  脚本接下来的几行都是关于获取传递给我们的任何参数，并将它们放入稍后要使用的变量中。`$device` 变量我们通常期望是一个 IP 地址或域名，但其他三个变量可能会变化，或者根本不会被使用，正如我们将在其中一个函数中看到的那样。\n\
  \n\n\n\n\n`pingdevice` 函数会检查 `$device` 变量中指定的 IP 或域名是否确实在网络中在线。该函数包含一个简单的 `if` 语句，并使用\
  \ `test-connection` cmdlet 来 ping 设备。我们还在此处使用了 `-erroraction` 函数，以便在设备实际不在线时妥善处理我们将收到的错误。这使我们能够继续执行后续操作，并且在检查时如果网络上没有找到任何内容，也不会向控制台输出错误。根据\
  \ `test-connection` 的结果，我们 `echo` 一条简短消息，说明设备是在线还是离线。\n\n第二个函数才是实际执行检查开放端口工作的函数。该函数有两个主要分支，一个用于检查单个端口，另一个用于检查多个端口。我们进入哪个分支取决于运行脚本时提供给脚本的参数。正如我们在查看变量时讨论的那样，我们将其中一些变量用于不同的用途。\n\
  \n如果我们要检查单个端口，我们将只使用前两个参数 `$args[0]` 和 `$args[1]`。在这种情况下，`$args[0]` 将是我们的 IP 或域名，`$args[1]`\
  \ 将是我们要检查的单个端口。如果我们要检查多个端口，`$args[0]` 将是我们的 IP 或域名，`$args[1]` 应为 `multi` 以指示多个端口，而\
  \ `$args[2]` 和 `$args[3]` 将分别是我们的起始端口和结束端口。如果脚本在 `$ports` 变量（来自 `$args[1]`）中看到值\
  \ `multi`，它将进入 `checkports` 函数中用于多个端口的分支。\n\n在脚本的任一分支中，我们将使用 `Net.Sockets.TcpClient`\
  \ 来尝试连接到所讨论的端口。我们将进行一次快速而粗糙的连接尝试，在完成后不费心去正确关闭连接或 `Net` 对象。\n\n这里我们还遇到了 `try catch`\
  \ 结构。`try catch` 结构允许我们尝试执行一个命令或代码块，并妥善处理发生的任何错误。在这种情况下，如果 `connect` 函数失败，我们可以优雅地处理错误，并向控制台输出正确的关闭字符串。\n\
  \n在多个端口的分支中，我们使用一个 `for` 循环来遍历我们收到的端口范围，每个端口循环一次。在单个端口的分支中，我们执行一次端口检查并结束。\n\n###\
  \ 改进脚本\n\n显然，如果我们打算将脚本调整为日常使用，我们可以对其进行大量改进。以下是一些改进点：\n\n• 当我们使用端口范围运行脚本时，很快就会发现关闭的端口需要很长时间才能返回结果。这是因为我们没有在\
  \ `Net.Sockets.TcpClient` 对象上设置超时。为其设置超时将大大加快速度。\n\n• 我们一次只扫描一个设备。我们绝对可以通过接受端口范围、多个域名或来自文件的列表来改进这一点。\n\
  \n• 对于端口关闭的含义，我们并没有非常具体地说明。我们可能会遇到多种不同情况，从连接被拒绝到实际上没有任何东西在监听。在连接上进行一些额外的通信可以稍微澄清这一点。\n\
  \n• 我们只测试 TCP 端口。这完全忽略了任何可能开放的 UDP 端口。我们可以使用 `Net.Sockets.UdpClient` 来添加此功能，并添加一个新参数，让我们指定\
  \ TCP 端口、UDP 端口或两者。\n\n这些只是主要的不足之处，我们还可以进行许多其他调整，以使脚本运行更顺畅并更具通用性。\n\n## 总结\n\n我们在\
  \ Shell 脚本上下文中通常提到的 Shell，是我们用来与操作系统通信的基于文本的界面。使用各种脚本语言，我们可以开发软件来利用各种 Shell 提供给我们的功能。Shell\
  \ 脚本可以成为我们渗透测试武器库中非常有用的工具。能够利用操作系统提供的组件构建工具和实用程序，可能意味着渗透测试的成功与失败之间的差别。\n\nUNIX、Linux\
  \ 和 OS X，以及大多数类 UNIX 操作系统，在 Shell 脚本方面通常遵循相同的一般原则。我们可能会在这些系统上找到多种 Shell，通常分为 Bourne\
  \ 兼容 Shell 和 C Shell 兼容 Shell。目前类 UNIX 系统中最常见的 Shell 之一是 Bourne-again Shell，即 `bash`。使用\
  \ `bash` 开发脚本将使我们能够在可能遇到的各种系统上使用它们。\n\n`bash` 的主要编程结构可以分为数据结构（如变量）和控制语句（如 `if-then`\
  \ 子句和 `while` 循环）。再加上其他一些组件，如函数以及输入和输出数据的能力，我们就有了足够的结构来开发简单的 `bash` 脚本。作为我们可以用 `bash`\
  \ 构建的工具的一个示例，我们研究了在此脚本环境中构建一个端口扫描器。\n\n微软操作系统，如各种版本的 Windows，也有相当多的 Shell 脚本工具。在\
  \ Windows 中，我们可以使用通用 Shell `command.com` 和 `CMD.exe`、`PowerShell` Shell 以及附加工具（如\
  \ `Cygwin`，它让我们在 Windows 上使用 `bash`）来执行命令和编写脚本，仅举几例。`PowerShell` 为 Windows 脚本和 Shell\
  \ 使用提供了最完整的设施之一，也是本章 Windows 脚本工作的重点。\n\n与关于 `bash` 脚本语言的讨论类似，在 `PowerShell` 中我们可以找到类似的数据结构和控制语句，使我们能够控制脚本的流程、存储数据以及接收输入和给出输出。`PowerShell`\
  \ 还允许我们执行更复杂的活动，这些活动与编译型编程语言所能完成的工作相当，因为它能够与微软的 `.NET` 工具进行交互。通过这种方式，`PowerShell`\
  \ 可以在从最简单的脚本到生产软件中的关键角色中发挥作用。\n\n## 尾注\n\n1. Hewlett-Packard. HP color laserjet\
