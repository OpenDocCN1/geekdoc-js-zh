  \n# 第 8 章\n\n# 信息收集\n\n## 本章内容：\n\n• 渗透测试的信息收集\n\n• 与 Google 对话\n\n• 使用 Perl 进行\
  \ Web 自动化\n\n• 处理元数据\n\n• 综合运用\n\n在研究渗透测试目标的过程中，测试人员通常会从各种公开信息源中获取帮助，作为其工作的一部分。如今，人们普遍参与各种社交媒体平台，如\
  \ Twitter、Facebook 和大量博客平台，以及更多面向企业的工具（如招聘信息板），我们拥有大量优质的信息来源。\n\n此外，大量信息以非刻意的形式出现在互联网上，例如文档、图片和其他文件附带的元数据，所有这些信息都可以供我们查阅。\n\
  \n在许多情况下，我们可获取的信息量之大，反而在一定程度上保护了这些信息不被发现。如果我们被迫手动筛选所有这些信息，任务将变得不堪重负，可能永远找不到所需的内容。\n\
  \n幸运的是，我们可以将这些工作自动化。我们可以利用现有的工具（如 Google），并在此基础上应用自己的自动化层，以获得更符合我们需求的结果。我们还可以编写脚本来解析网站数据、扫描文件中的元数据以及执行其他类似任务。我们可以利用本书中讨论过的一些脚本工具，例如\
  \ shell 脚本或 `Perl`，来帮助我们完成这些工作。\n\n## 渗透测试的信息收集\n\n信息收集和研究在渗透测试中具有重要价值，尤其是在我们对目标或环境缺乏内部了解的情况下。我们有许多数据源和多种工具可用于我们的工作。\n\
  \n### 信息来源\n\n在信息收集工作中，我们可以访问大量来源，有些是公开的，有些则不是。将这些来源应用于渗透测试工作，通常能大大简化任务，甚至可能决定成败。\n\
  \n在公开方面，正如我们本章前面所讨论的，社交媒体工具和网站中存储着海量信息。许多使用这些工具的人并不注意自己泄露的信息，他们可能会分享大量关于工作、居住地、社交圈等方面的信息，而且往往详细得令人发指。这对渗透测试人员来说可能是一座信息金矿。\n\
  \n注意\n\n根据我们所在的地理区域，在收集个人或敏感信息时可能需要谨慎。管理此类信息的法律从不存在到严苛不等，因此在开始之前，了解我们所受的限制可能会有所帮助。\n\
  \n此外，如果我们查看在线论坛、招聘信息板和其他类似网站，可能会发现关于特定目标或地点所使用的具体技术、实施方案和基础设施设备的信息。这些信息片段可能非常宝贵。\n\
  \n我们还可以通过查询公开的域名系统（DNS）记录、查看正在使用的域名的记录以及其他类似信息，来获取大量关于目标网络和系统的信息。在这里，我们可以使用 `dig`\
  \ 等工具，以及在线信息网站——针对任何特定目的，都存在大量此类网站，例如 `whois` 查询、域名所有权历史记录以及其他类似的有趣信息片段。\n\n在非公开方面，当我们已经进入某个系统或环境时，我们也可以访问到许多有趣的信息。我们可能能够看到浏览器中存储的数据，例如缓存、历史记录或书签，这些通常值得一读。如果我们能够访问存储的电子邮件或账户，并且能够搜索所需信息，那么我们就拥有了一座潜在的信息金矿。\n\
  \n我们还可能访问到文件——公开的、非公开的，或两者兼有。根据具体文件的不同，它们可能包含直接可见的有趣数据，也可能需要我们稍微挖掘一下——我们将在本节后面讨论文档和文件中的元数据时涉及这一主题。\n\
  \n### 信息中的模式\n\n当我们搜索信息时，无论是来自文档或网页的纯文本、文件中的元数据、应用程序二进制文件中的编译代码，还是几乎任何其他来源，我们通常可以寻找与所需信息相关的特定模式。特别是在搜索特定信息（例如\
  \ IP 地址或信用卡号）时，这种搜索可以大大简化，并为我们省去大量麻烦。\n\n正如我们在第 3 章讨论 `Perl` 时所述，正则表达式（regex）对于搜索这些模式非常方便，至少在我们有具体目标时如此。如果我们能够为电子邮件地址、信用卡号、序列号等构建正则表达式，通常可以将需要大量手动苦差事的任务交给计算机处理，只需在查看结果时介入即可。\n\
  \n我们还可以使用更简单的工具，例如 `strings` 实用程序，来执行更通用的信息搜索。对于 `strings` 工具，我们可以在文件（如二进制文件或文档文件）中搜索文本字符串。`strings`\
  \ 可以匹配指定长度的字符串，这些字符串后面跟着非打印字符（如空格、换行符或回车符）。虽然这有时只会返回文件中的垃圾文本字符串，但通常也会给我们带来一些潜在有趣的条目。幸运的是，`strings`\
  \ 是一种非常适合脚本编写的工具，我们将在本章后面讨论这一点。\n\n\n\n在大量信息中找到模式化数据是渗透测试领域中一项非常实用的技能，值得我们投入精力去熟练掌握。这也是一项通用的优秀技能，可以应用于许多技术场景，甚至包括安全行业之外。\n\
  \n### 元数据\n\n元数据有可能为我们提供一些极好的信息来源，我们可以围绕这些信息开展渗透测试工作，从社会工程攻击到密码猜测或破解，从而获得系统访问权限。\n\
  \n元数据是关于数据的数据。例如，在大多数操作系统中查看某个文件时，无论它是什么类型，我们都会找到与该文件相关的信息，但这些信息并不具体涉及文件内容。这些元数据项可能存储文件大小、创建、修改或访问的时间戳，以及其他类似信息。根据文件类型和创建它的应用程序，我们还可能在元数据中找到相当多的其他信息，例如文件创建时的物理位置（如视频文件或图片中可能看到的），或者许多文本文档中的账户名称和文件系统路径。这两种文件类型通常包含更有趣的数据。\n\
  \n在渗透测试过程中，文档元数据对我们来说可能是一个特别丰富的数据来源。我们用来创建文档的工具通常会在文档中隐藏大量元数据，这些数据在应用程序的正常界面中是不可见的。尽管细心的用户通常可以清除其中一部分数据，例如文档创建者的姓名和其他一些信息，但文档本身可能包含大量我们无法清除的其他数据。这可能包括本地文件系统或网络位置的完整路径，这些路径是文档过去保存过的位置，通常涵盖最近几次保存。\n\
  \n我们通常还可以找到编辑过文档的各种账户的名称或用户名，这对于渗透测试来说非常有用。此外，我们可能还能找到文档中某些文本部分的先前修订版本。如果文档为了公开发布而删除了敏感的内部信息，这一点也会非常有益。\n\
  \n图像和视频元数据通常存储着与文档中完全不同的信息集，尽管数量上绝不逊色。对于直接创建此类文件的设备，我们通常会找到嵌入的元数据，其中包含有关图像或视频本身的信息，例如用于拍摄图像的相机设置。在配备全球定位系统（GPS）接收器的设备上，我们通常还可以找到图像或视频创建时的坐标，作为元数据的一部分。\n\
  \n此外，从一般安全角度来看，我们可能还会找到其他有用的信息，例如用于创建这些文件的设备的具体型号和序列号。我们将在本章后面讨论如何通过各种工具和脚本与元数据进行交互。\n\
  \n### 我们能利用这些信息做什么？\n\n当我们费尽心思研究和收集这些信息后，可以将其用于哪些用途？这个问题的答案是多方面的，而且可能很复杂，但有两个主要用途立即显现出来：我们可以将这些信息用于社会工程攻击，也可以用于对我们将要测试的环境和系统进行一些高级的足迹分析。\n\
  \n在社会工程攻击中，这类信息可能价值连城。如果我们能够收集到人们的姓名、账户名、电话号码、职位、具体型号或任何其他大量信息，这就会为我们构建社会工程攻击提供一个框架。如果我们试图冒充目标环境中的某个人，并且发现吉姆·鲍勃·琼斯实际上昵称是“斯帕基”，那么我们成功的几率就会大大增加。同样，任何我们能获取到的其他小细节，都能让我们的社会工程攻击对目标更具可信度。\n\
  \n在技术方面，我们也可以将收集到的信息用于系统、环境或网络的足迹分析。\n\n正如我们之前讨论的，我们可能能够在招聘信息中找到有关正在使用的设备的信息。至少，我们通常能够找到有关正在使用的设备特定供应商的信息，如果不是更具体的信息，如型号或版本。这通常可以为我们提供一个起点，开始寻找可能利用的潜在漏洞。对于正在使用的软件及其特定版本，情况可能也是如此。\n\
  \n除此之外，我们还可以通过从外部检查网络结构来获取信息，包括使用网络工具梳理 DNS 条目，检查提供电子邮件、Web 和文件传输功能的面向互联网服务器的横幅、标头和其他信息，以及无线网络和环境中我们可以从外部访问的任何其他部分。\n\
  \n对于大多数此类工具，我们可以组合一套脚本来自动化、屏幕抓取，并简化收集和解析我们努力后可能产生的大量数据的任务。\n\n## 与 Google 对话\n\n\
  对于渗透测试人员来说，Google 绝对是一个极好的工具。我们可能认为 Google 只是一个搜索引擎，当我们查询某些内容时，它主要返回色情结果，但我们只需要学会在与之对话时更具体一些。如果我们恰当地运用\
  \ Google，很快就能让它精确返回我们正在寻找的结果，前提是这些结果确实存在。\n\nGoogle 索引的信息量之大令人震惊。在 2011 年初到中期，Google\
  \ 页面索引的大小接近 400 亿个页面 [[1]](#CHP008.html_BIB1)。这意味着 Google 已经索引了数百万份简历、博客、招聘信息、Web\
  \ 服务器上发布的随机文件，以及各种其他杂项。\n\n在这些信息中，我们可以找到在渗透测试过程中非常有用的零碎信息。Google 上的许多信息可能看起来相对无用的琐事，但如果我们知道如何查询，就能找到各种有趣的信息。\n\
  \n### Google 黑客技术\n\n*Google 黑客技术*这个术语更具体地指代使用 Google 查找安全领域（尤其是渗透测试人员）感兴趣的信息的通用做法。当我们进行\
  \ Google 黑客攻击时，我们利用 Google 和高级搜索运算符来查找安全漏洞、不安全的设备、密码、漏洞评估和渗透测试报告，以及各种绝对不应该在公共互联网上自由流传的其他数据。对于渗透测试人员来说，没有什么比一份漏洞工具报告或一份概述环境中所有安全漏洞的文档更好的材料了。\n\
  \n关于 Google 黑客技术的一个极好资源是 Johnny Long 所著的《Google Hacking for Penetration Testers》第二卷（ISBN:\
  \ 978-1-59749-176-1, Syngress）。这本书介绍了 Google 黑客技术的基础知识，并包含了许多技巧和窍门。总的来说，这是一本很好的读物，向我们展示了在\
  \ Google 搜索中可以使用的各种有趣的零碎信息。\n\n\n\n另一个可用于此类工作的绝佳资源是谷歌黑客数据库（GHDB）。^(1) GHDB 是一个定期维护的存储库，收录了谷歌上出现的各种有趣信息，以及找到这些信息所需的确切搜索词。该数据库的主要类别如下：[[2]](#CHP008.html_BIB2)\n\
  \n• 立足点（可帮助黑客在 Web 服务器上获得立足点的查询示例）\n• 包含用户名（但不含密码）的文件\n• 敏感目录\n• Web 服务器检测（展示谷歌对\
  \ Web 服务器进行概要分析能力的链接）\n• 易受攻击的文件\n• 易受攻击的服务器\n• 错误消息（暴露过多信息的愚蠢错误消息）\n• 包含有价值信息（但不含用户名或密码）的文件\n\
  • 包含密码的文件\n• 敏感的在线购物信息（包括客户数据、供应商、订单、信用卡号等）\n• 网络或漏洞数据（包含防火墙日志、蜜罐日志、网络信息、IDS 日志等内容的页面）\n\
  • 包含登录门户的页面（各种服务的登录页面）\n• 各种在线设备（包括打印机、摄像机和其他设备）\n• 公告和漏洞（即易受攻击的服务器；这些搜索通常来自各种安全公告帖子，且在许多情况下针对特定产品或版本）\n\
  \n从 GHDB 主页面点击大约三次，我们就能看到互联网上公开的明文密码，以及大量其他有趣信息。利用我们将在下一节讨论的谷歌高级运算符，我们可以非常轻松地将这些信息缩小到特定目标，这在渗透测试领域是一项非常实用的能力。\n\
  \n### 高级运算符\n\n搜索谷歌的关键之一在于使用高级运算符。高级运算符使我们能够更精确地进行搜索，并有助于剔除那些困扰我们许多搜索的垃圾结果。\n\n\
  我们可以使用的高级运算符非常多。一个展示了许多此类运算符的好资源可以在 GoogleGuide 网站上找到，^(2) 但即使这个列表也并不完全，时不时还会出现一些新的或以前未知的运算符。我们可能想要了解的几个主要高级运算符包括\
  \ `site:`、`filetype:` 和 `link:`。\n\n`site:` 运算符是整个列表中最实用的运算符之一，尤其是在缩小搜索结果范围方面。该运算符允许我们将搜索结果限制在特定站点或域。假设我们正在搜索一本关于网络战的书。如果我们在谷歌搜索框中输入“Cyber\
  \ Warfare” book，我们会得到超过 75 万条结果。如果我们不记得书的确切标题，这需要浏览大量信息。然而，如果我们使用 `site:` 运算符，输入\
  \ `site:`[syngress.com](http://syngress.com) “Cyber Warfare” book，我们只会得到大约五六条结果，其中大部分会直接指向我们想要去的地方。好多了。\n\
  \n使用 `link:` 运算符，我们可以查看链接到特定 URL 的页面。以我们刚才提到的书为例，我们可以运行一个谷歌搜索，例如 `link:`[www.syngress.com/hacking-and-penetration-testing/Cyber-Warfare/](http://www.syngress.com/hacking-and-penetration-testing/Cyber-Warfare/)。我们应该会得到一些结果。如果结果仍然太多，我们可以组合使用多个运算符，加入\
  \ `site:` 运算符，使搜索变成 `link:`[www.syngress.com/hacking-and-penetration-testing/Cyber-Warfare/](http://www.syngress.com/hacking-and-penetration-testing/Cyber-Warfare/)\
  \ `site:`[syngress.com](http://syngress.com)。我们还可以以否定方式使用运算符，只需在特定运算符前加一个短横线。因此，在这种情况下，`link:`[www.syngress.com/hacking-and-penetration-testing/Cyber-Warfare/](http://www.syngress.com/hacking-and-penetration-testing/Cyber-Warfare/)\
  \ -`site:`[syngress.com](http://syngress.com) 将查找指向我们 URL 但明确不在 [syngress.com](http://syngress.com)\
  \ 上的链接。\n\n最后，让我们看看 `filetype:` 运算符。我们可以使用 `filetype:` 运算符来仅查找特定类型的文件，这在寻找目标以挖掘元数据时非常有用，我们将在本章后面更详细地讨论这一点。这里我们选择一个更丰富的目标，组合一个搜索，例如\
  \ `site:`[elsevier.com](http://elsevier.com) `filetype:doc`。在这种情况下，我们在 [elsevier.com](http://elsevier.com)\
  \ 上搜索，并且只查找 Microsoft Word 文档。通过这个搜索，我们应该会得到大约 600 个文档，这对于我们后续的挖掘工作来说是一个相当扎实的材料库。\n\
  \n有大量这样的高级运算符可供我们使用，花时间熟悉它们是非常值得的。让我们看看如何为这些操作添加一些自动化，让它们为我们做一些工作。\n\n### 自动化谷歌发现\n\
  \n这里我们将编写一个快速而粗糙的 Perl 脚本，从谷歌获取文件列表。在这个特定的脚本中，我们将使用 Perl 的 `LWP::UserAgent` 模块来处理我们的\
  \ Web 任务。有更好、更优雅的方法可以做到这一点，我们将在本章后面看到其中一些，但现在，这个脚本足以完成任务。\n\n```\n#!/usr/bin/perl\n\
  \nuse LWP::UserAgent;\n\nuse HTML::Parse;\n\n$site = @ARGV[0];\n\n$filetype = @ARGV[1];\n\
  \n$searchurl =\"[`www.google.com/search?hl=en&q=site%3A$site+filetype%3A$filetype`](http://www.google.com/search%3Fhl%3Den&q=site%3A$site+filetype%3A$filetype)\"\
  ;\n\n$useragent = new LWP::UserAgent;\n\n$useragent->agent(’Mozilla/4.0 (compatible;\
  \ MSIE 5.0; Windows 95)’);\n\n$request =HTTP::Request->new(’GET’);\n\n$request->url($searchurl);\n\
  \n$response = $useragent->request($request);\n\n$body = $response->content;\n\n\
  $parsed = HTML::Parse::parse_html($body);\n\nfor (@{ $parsed->extract_links(qw(a))\
  \ }) {\n\n   ($link) = @$_;\n\n   if ($link =~ m/url/){\n\n     print $link . \"\
  \\n\";\n\n     }\n\n}\n```\n\n让我们看看我们做了什么。在顶部，我们有 shebang 来指明解释器，以及几行代码来设置脚本使用的模块。这里我们将使用\
  \ `LWP::UserAgent` 和 `HTML::Parse` 模块来完成繁重的工作。我们还接收两个参数：站点名称存入 `$site`，我们要查找的文件类型存入\
  \ `$filetype`。\n\n接下来，我们为谷歌构建搜索 URL。`$searchurl` 中的字符串是一个简单的谷歌搜索，将 `$site` 和 `$filetype`\
  \ 的值插入到适当的位置。然后我们设置用户代理及其句柄 `$useragent`，并将代理字符串设置为 Mozilla/4.0 (compatible; MSIE\
  \ 5.0; Windows 95)。代理字符串在这里是可选的，但如果我们不设置它，谷歌将不会与我们通信，因为它会认为我们是一个脚本而不是真正的浏览器，所以我们确实需要它。\n\
  \n警告\n\n此脚本中使用的谷歌搜索*不是*通过自动化与谷歌通信的批准方式。如果我们不小心并滥用这种连接，谷歌会生气并封禁我们的 IP 地址。谷歌已经提供了有用的文档^(3)\
  \ 说明了正确的方法，我们确实应该使用那种方法。这有点超出我们这里所做的范围，但该文档将指导我们以批准的方式构建查询。\n\n之后，我们使用 `HTTP::Request`\
  \ 请求页面。我们实例化一个新对象，以 `$request` 作为句柄，用它来请求我们的页面，将响应放入 `$response`，并将页面的实际内容提取到 `$body`\
  \ 中。\n\n\n\n\n在最后一个代码块中，我们提取出了我们感兴趣的实际 URL。这里我们使用`HTML::Parse`模块将`$body`的内容解析成比纯文本更容易处理的形式，并将其存入`$parsed`。然后我们构建一个\
  \ for 循环遍历各行，只查找链接，并且在这些链接中只查找`a href`类型的链接，丢弃图片和其他我们不感兴趣的链接。对于每个剩余的链接，我们运行一个简单的正则表达式，查找行中的文本字符串`url`。在\
  \ Google 返回的结果格式中，这些正是我们实际感兴趣的行。最后，我们打印出过滤后的结果。\n\n我们可以像`./download.pl` [cnn.com](http://cnn.com)\
  \ `doc`这样运行脚本，或者类似的方式，然后应该会得到类似图 8.1 的结果。\n\n![image](img/F000084f08-01-9781597497299.jpg)\n\
  \n图 8.1 download.pl 输出\n\n所以，正如我们所说，这确实完成了任务，但我们完全可以构建一个更完善的工具，而不仅仅是列出几个链接。在下一节中，我们将讨论如何更好地使用\
  \ Perl 与网页交互，并将使用一个名为`WWW::Mechanize`的 Perl 模块，它能在处理此类目标时提供更多的灵活性和实用性。\n\n## 使用\
  \ Perl 实现 Web 自动化\n\n在前一节中，我们简要了解了如何使用 Perl 与网站通信。当我们用 Perl 或任何其他现代脚本语言处理特定任务时，通常有多种方法可以解决。我们在前一节中看到的特定模块`LWP::UserAgent`对于我们所做的简单任务来说表现良好，但它只是实现目标的一种方式。在本节中，我们将介绍几种完成类似任务的替代方案。\n\
  \n### 从网站提取信息\n\n让我们看一种非常快速简便的方法来从网站获取页面。之前我们使用`LWP::UserAgent`执行类似任务，但我们可以通过使用一个类似的模块`LWP::Simple`来进一步简化操作。甚至可以在单行命令中完成：\n\
  \n```\nperl -MLWP::Simple -e \"getprint ’http://www.cnn.com’\"\n```\n\n这应该会得到类似图\
  \ 8.2 的结果。\n\n![image](img/F000084f08-02-9781597497299.jpg)\n\n图 8.2 LWP::Simple\
  \ 输出\n\n我们只是调用了 Perl 解释器，告诉它使用`LWP::Simple`模块，并让它获取并打印指定的 URL。这很简单，对吧？\n\n我们最终得到的是网页的原始版本，但如果只是打算做一些简单的事情，比如从页面中解析字符串，这完全够用。正如我们所说，我们可以用多种方式处理这个任务，也可以使用`WWW::Mechanize`模块来体验功能的另一极端。\n\
  \n#### WWW::Mechanize\n\n`WWW::Mechanize`模块是一个强大且（可能）复杂的工具。我们可以用它完成几乎任何人类操作浏览器能做的事情：认证网页、跟踪链接、下载和上传文件、运行搜索等等。`WWW::Mechanize`的优点是，如果任务不需要太复杂，我们仍然可以用相对简单的方式完成，但如果需要，全套功能也随时可用。\n\
  \n让我们重新审视本章前面编写的代码，用于从 Google 提取文件 URL，但这次我们使用`WWW::Mechanize`代替`LWP::UserAgent`：\n\
  \n```\n#!/usr/bin/perl\n\nuse WWW::Mechanize;\n\n$site = @ARGV[0];\n\n$filetype\
  \ = @ARGV[1];\n\n$searchurl=\"http://www.google.com/search?hl=en&q=site%3A$site+filetype%3A$filetype\"\
  ;\n\n$mech = WWW::Mechanize->new();\n\n$mech->agent_alias(’Windows Mozilla’);\n\n\
  $mech->get($searchurl);\n\n@links = $mech->find_all_links(url_regex => qr/\\d+.+\\\
  .$filetype$/);\n\nfor $link (@links) {\n\n   $url = $link->url_abs;\n\n   $filename\
  \ = $url;\n\n   $filename =~ s[.^∗/][];\n\n   print \"downloading $url\\n\";\n\n\
     $mech->get($url, ’:content_file’ => $filename);\n\n}\n```\n\n我们可以看到，这段代码与之前使用另一个模块的代码大体相似。这是因为`WWW::Mechanize`在很大程度上是`LWP::UserAgent`功能的扩展，并且大部分功能运行方式非常相似。\n\
  \n**提示**\n\n`WWW::Mechanize`由 Andy Lester 开发[[3]](#CHP008.html_BIB3)，它是一个非常常用的工具，以至于也被其他语言实现，包括\
  \ Python 和 Ruby。这些实现可以分别在[wwwsearch.sourceforge.net/mechanize/](http://wwwsearch.sourceforge.net/mechanize/)和[`mechanize.rubyforge.org/mechanize/`](http://mechanize.rubyforge.org/mechanize/)找到。感谢\
  \ Andy 提供了如此出色的工具！\n\n我们以通常的 shebang 行开始，然后使用模块，并将要搜索的站点和文件类型分别赋值给变量`$site`和`$filetype`。我们还像之前的脚本一样，组装了\
  \ Google 的搜索 URL，并将其存入`$searchurl`。\n\n接下来，我们创建一个新的`WWW::Mechanize`实例，并将其作为句柄赋值给`$mech`。我们还设置了用户代理字符串，然后使用该对象获取搜索\
  \ URL。\n\n获取结果页面后，我们可以筛选链接。`WWW::Mechanize`模块让我们能更精确地处理这个搜索。我们首先解析出结果页面中的所有链接，然后通过一个正则表达式检查它们是否匹配之前指定的文件类型，并将结果存入数组`@links`。\n\
  \n获得所需链接后，我们设置一个 for 循环遍历每个元素。在循环内部，我们获取链接的绝对 URL，以避免依赖任何间接链接，并将其存入`$url`。我们执行一个简单的替换操作，将文件名与路径分离，然后输出一行提示正在下载哪个文件。最后，我们使用`get`方法和`content_file`下载特定文件，并以`$filename`的值命名。我们继续遍历`@links`数组，直到处理完所有元素。\n\
  \n我们像调用早期版本一样调用这个脚本：`./mechanize.pl` [syngress.com](http://syngress.com) `ppt`。这应该会返回一些文件，脚本的输出应该类似于图\
  \ 8.3。\n\n![image](img/F000084f08-03-9781597497299.jpg)\n\n图 8.3 Mechanize.pl 输出\n\
  \n这比我们在前一节中编写的代码更简洁一些，我们可以用它为基础，构建下一节将要开发的工具。这段代码确实存在一些问题，我们将在本章后面讨论其中的一部分。\n\n\
  ## 处理元数据\n\n正如我们在本章前面所讨论的，元数据可以为我们提供各种有趣的信息，这些信息在渗透测试过程中可能会用到。我们可能能够找到姓名、用户名、路径、网络信息以及各种其他有用的零碎信息。我们知道这些信息可能存在，但如何找到它们，又如何从我们拥有的文件中提取出来呢？\n\
  \n### 查找元数据\n\n在某种程度上，我们可以通过使用创建或用于处理这些文件的应用程序来查找元数据。例如，如果在较新版本的 Word 中打开一个 Microsoft\
  \ Word 文档，并选择**文件 | 信息 | 检查问题**，这将弹出文档检查器对话框，让我们看到 Word 认为存在的元数据，并允许我们删除大部分此类数据。\n\
  \n\n\n\n\nWord 和 Adobe Acrobat 等工具在较新版本中显示此类数据时表现相对良好，但并非我们手头的每个工具或文件都能如此。查找此类数据的一个经典方法是使用\
  \ `strings` 工具。\n\n为了快速演示 `strings` 的用途，我们来看一个通常难以从中获取大量信息的文件——几乎任何二进制格式的文件都是如此。这里，`strings`\
  \ 工具本身就是一个绝佳的例子。在 BackTrack 5 中，`strings` 位于 `/usr/bin/strings`。如果我们运行 `cat /usr/bin/strings`，会得到大量快速滚动的数据，其中部分是人类可读的，部分则不是。然而，如果我们运行\
  \ `strings /usr/bin/strings`，则会得到一个包含文件中所有可读字符串的清晰列表，如图 8.4 所示。\n\n![image](img/F000084f08-04-9781597497299.jpg)\n\
  \n**图 8.4 strings 输出**\n\n我们可以利用 `strings`，通过少量脚本对目录中的所有文件进行排序：\n\n```\n#!/bin/bash\n\
  \nfind . -name \"^∗.ppt\" | while read filename;\n\ndo\n\necho -e \"^(∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗)\
  \ $filename ^(∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗∗)\\n\\n\" >> stringsreport.txt;\n\nstrings\
  \ $filename >> stringsreport.txt;\n\ndone\n```\n\n这里我们执行一个快速的 `find` 命令，搜索执行脚本的目录中的\
  \ `.ppt` 文件，并将结果传递给一个 while 循环。在循环内部，我们向报告文件输出一行，以便区分报告中的不同文件，然后对 `$filename` 中的文件名运行\
  \ `strings`，并将结果也输出到该文件。\n\n我们可以对这个想法稍加调整，扩展脚本以添加其他功能。例如，我们可以让它递归遍历目录，从而也能获取子目录中的文档。我们还可以让它根据命令行参数搜索特定文件类型，而不是硬编码文件类型。此外，我们还可以将其与另一个搜索工具（如\
  \ `grep`）结合使用，或者加入一些正则表达式来筛选结果。\n\n### 文档元数据\n\n在搜索文档元数据时，我们可以综合运用本章讨论的几种资源来完成任务。我们可以结合使用\
  \ Google（或其他类似搜索引擎）、正则表达式和文本搜索，将文档纳入数据搜索流程。\n\n利用本章前面讨论的 Google 高级搜索运算符，我们可以搜索特定文档类型。例如，如果我们只想在特定域名下查找特定文档类型，可以使用\
  \ `filetype:` 高级运算符从目标域名下载这些文档。这为我们提供了一个很好的起点，也可能提供一组值得仔细梳理的文档。\n\n接下来，我们可能需要使用一些正则表达式来筛选特定类型或模式的数据。这里可以运用我们在第\
  \ 3 章中讨论的一些正则表达式，特别是那些能查找电子邮件地址、文件系统路径、网络路径以及其他类似信息的表达式。通过这种方式，我们有可能找到具有内在价值的信息，例如信用卡号或社会安全号码，但在从公共网站、FTP\
  \ 服务器等抓取的文档中，这种情况相对少见。不过，尝试一下总没有坏处，而且通过自动化流程进行尝试通常成本不高。\n\n最后，我们可以使用 `strings` 之类的工具进行一些通用搜索，直接转储给定文档中所有可找到的文本字符串。这可能会产生一定量的垃圾信息，但也可能带来令人惊喜的结果。我们可以将这些搜索结果记录到报告或一组文件中，供日后查阅，并可能从文件中的大量垃圾信息中偶尔发现宝藏。特别是来自专用文本处理软件（如\
  \ Microsoft Word 或 Adobe Acrobat）的文档，当我们这样做时，往往会返回大量虚假结果。\n\n### 媒体文件中的元数据\n\n在媒体文件中，我们可以找到各种有趣的元数据。例如，关于创建或处理图像的相机或软件的设置信息、地理位置信息、原始图像的缩略图，以及其他许多信息。由于文件格式主要是二进制编码数据，文件中的人类可读字符串相对容易解析，甚至用肉眼也能识别。这使得\
  \ `strings` 甚至 `grep` 等工具的工作变得特别简单。\n\n例如，如果我们想在一组图像中搜索包含特定信息（如特定相机型号或序列号）的图像，可以很容易地通过一段简短的\
  \ bash 脚本实现。让我们看看对数码相机生成的 JPEG 文件运行 `strings` 后能看到什么。在图 8.5 所示的结果中，我们得到了一些有趣的信息。\n\
  \n![image](img/F000084f08-05-9781597497299.jpg)\n\n**图 8.5 JPEG 文件的 strings 输出**\n\
  \n这些信息可能正是我们想要的，也可能不是，但我们可以利用另一个工具从文件中提取更多信息。我们一直在讨论的元数据，特别是与媒体文件（包括图像和音频文件）相关的元数据，通常被称为可交换图像文件格式（EXIF）数据。方便的是，BackTrack\
  \ 5 自带了一个专门用于读取这些数据的工具，它能返回比 `strings` 多得多的信息。\n\n要运行该工具，只需提供文件名，例如 `exiftool biopic.jpg`。这将返回大量信息：\n\
