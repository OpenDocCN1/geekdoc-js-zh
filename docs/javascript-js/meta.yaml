    \n# 52- 总结：\n\n数组只是通过数字访问的变量列表，循环用于多次执行某行或多行代码，直到满足特定条件，而 switch 语句和三元运算符提供了一种替代的决策方式。\n\
    \n# 53- 定时器与过渡：\n\n### 53a- 引言：\n\n定时器是 JavaScript 事件，通常我们希望速度变快而不是变慢，但唯一的例外是需要减速时的过渡过渡效果，这样人们就能以慢动作捕捉正在发生的变化。我们可以使用\
    \ JavaScript 定时器来实现，但 CSS3 提供了定时器，提供了带有减速可能的时间控制，这样我们就不完全依赖 JavaScript 的动画效果。\n\
    \n### 53b- 定时器或计时事件：\n\n允许代码执行延迟，JavaScript 在执行某些函数之前会等待，代码将在精确的时间间隔内通过调用计时事件来执行。\n\
    \n使用定时器有两种方式：\n\n- setTimeout(): 括号中包含执行一次的函数，以及以毫秒为单位的精确秒数。\n\n- setInterval():\
    \ 括号中包含以毫秒为单位、在精确时间间隔内重复执行的函数，类似于循环，但带有时间延迟。\n\n注意：setTimeout() 和 setInterval()\
    \ 是 HTML DOM（文档对象模型）的方法。\n\n该函数是要执行的 JavaScript 函数，而毫秒是 1 秒的 1/1000。\n\nsetTimeout()\
    \ 和 setInterval() 是窗口事件的方法，它们可以带有 `window` 和点 `.` 编写，例如 `window.setInterval()`\
    \ 和 `window.setTimeout()`，这在 JavaScript 中是可以省略的，因此直接使用 `setInterval()` 和 `setTimeout()`\
    \ 是可以的。\n\n# 3) 给定时器赋值的语法：\n\n```javascript\nvar name = setTimeout(\"JavaScript\
    \ function\", delay in milliseconds);\nvar name = setInterval(\"JavaScript function\"\
    , delay in milliseconds);\n```\n\n你可以选择变量名称，使用 `setInterval()` 的代码与 `setTimeout()`\
    \ 相同，一旦定时器与变量名连接，你就可以通过以下方式停止它：\n`clearInterval(定时器的变量名)` 或 `clearTimeout(定时器的变量名)`。\n\
    \n# 示例 1：设置执行时间间隔。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>警框每隔 5 秒连接打开一次。</p>\n\
    <p>关闭窗口以停止持续的警框。</p>\n\n<button onclick=\"setInterval(function() { alert('How\
    \ are you?');},5000);\">点击</button>\n</body>\n</html>\n```\n\n结果：\n\n![](img/331e10bc8df06a94fc8288a269de6c23_82_0.png)\n\
    \n注意：\n\n每当你关闭警框时，5 秒钟后它又会再次打开，因此你需要关闭浏览器窗口。\n\n示例 2：使用 `setInterval()` 方法每 3\
    \ 秒显示一次当前时间。\n\n```html\n<p id=\"test\"></p>\n<script>\nvar clock=setInterval(function(){currentTime()},3000);\n\
    \nfunction currentTime() {\nvar date= new Date();\ndocument.getElementById(\"\
    test\").innerHTML =\ndate.toLocaleTimeString();\n}\n</script>\n</body>\n```\n\n\
    **结果：下午 7:02:01 之后**是下午 7:02:04，然后是下午 7:02:07，以此类推，每 3 秒一次。\n\n![](img/331e10bc8df06a94fc8288a269de6c23_83_0.png)\n\
    \n**注意：** 显示时间的秒部分将每 3 秒执行一次，并显示 3 的倍数。\n\n**尝试**将时间改为 5000（即 5 秒）或你想要的任何数字。\n\
