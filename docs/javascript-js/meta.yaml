  md: '# 9- Summary:


    JavaScript is a scripting language and supported by the most popular browser,
    it is used along with HTML and CSS for the web development.


    It uses open/close tags to tell the user (in this case the web browser) where
    the scripting language starts and where it ends.


    To add a comment in JavaScript we use // for single line comment or /* to start
    and /* to end the comment which are (/* & */ the same used for multiple line commenting
    as well.


    # 10- Events Handling:


    The execution of the code in JavaScript is as important as the code itself, for
    example the command onmouseover doesn''t get alone unless the user wants to do
    so, and move the mouse over something, so there is a time when the code is sitting
    and that is what we want to be just silent until we decide otherwise, it stays
    silent until we execute it!


    Therefore this is called event handling, we have full control, thanks to HTML
    with JavaScript coding, it allows more page interaction and control of the events.


    JavaScript is an event handler, by clicking anywhere on the page, the interaction.


    takes place when the event is detected and the code''s execution happens.


    Event handlers are mostly attributes, you can use them inside HTML tags and they
    all start with the “on”, with NO space.


    Here are few:


    | Event | Description |

    |---|---|

    | onclick | The user clicks on an element |

    | onmouseover | The user moves the mouse over an element |

    | onchange | When an HTML element is changed |

    | onload | When the page loading is finished |

    | onmouseout | When the mouse moves away from the element |

    | oncontextmenu | When the element is clicked using the right mouse part |

    | ondblclick | When double clicked on the element |

    | onmouseleave | When mouse pointer is out of the element |'
  merge: -1
  pgno: 20
- img_proc: true
  md: '| | |

    | onmouseover | Mouse button set free over the element |

    | onmousedown | Mouse button held down over the element |

    | onmousemove | Pointer in motion over the element |


    We add the JavaScript code to the HTML element to allow the event handling attribute.
    For that we use "single quotes or double quotes".

    Because HTML is not case sensitive so may encounter events that looks something
    like: onMouseOver or onMOUSEOVER or...That Will not affect anything, but try keeping
    it lower case such as mouseover and so on.


    <an HTML element event="JavaScript which is a handler(event)">


