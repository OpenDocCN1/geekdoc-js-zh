    - setTimeout(): The parentheses hold the function that executes once and the milliseconds\
    \ which is a precise number of seconds.\n\n- setInterval(): The parentheses hold\
    \ the function that executes in a repetitive way at a precise time intervals expressed\
    \ in milliseconds similar to a loop but with a time delay.\n\nNote: setTimeout()\
