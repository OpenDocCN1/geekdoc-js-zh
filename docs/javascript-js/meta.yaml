- img_proc: true
  md: "To explain the code process, after clicking the button, JavaScript switch statement\
    \ decides what to output. The code has simple HTML and CSS elements to display\
    \ the button, a simple sentence that appears on the page located after the opening\
    \ paragraph tag and the onclick event for the button that has the JavaScript switchesample()\
    \ and the var number is executed first, if the variable is created and any value\
    \ entered in the box by the user be put in, the parseInt() method converts the\
    \ input into a number and if something else typed it returns NaN that stands for\
    \ “Not a Number”.\n\nThen comes the var info = “” with an empty string.\nAfter\
    \ that comes the 3 cases with the one, two and three values, if none of the cases\
    \ is then the default case takes over and “It has to be a number from 1 to 3”.\n\
    In a way the switch statement works exactly like the if...else statements and\
    \ it is fine to replace the case statement by the if...else statement, we get\
    \ the same result.\n\n# Same sample code using if...else statements instead of\
    \ switch.\n\n```\nfunction switch() {\n  var number = parseInt(document.getElementById(\"\
    textEntered\").value);\n  //Acknowledge info as string.\n  var info = \"\"\n\n\
    \  if (number == 1) {\n    info = \"one\";\n  } else if (number == 2) {\n    info\
    \ = \"two\";\n  } else if (number == 3) {\n    info = \"three\";\n  } else {\n\
    \    info = \"It has to be a number from 1 to 3\";\n  }\n  //Finding and generating\
    \ outcome.\n  document.getElementById(\"outcome\").innerHTML = info;\n}\n```\n\
    \n# Result:\n\n![](img/331e10bc8df06a94fc8288a269de6c23_79_0.png)\n\n# 51- JavaScript\
    \ Ternary Operator:\n\nCalled the conditional operator and used for an understood\
    \ if decisions offering an"
  merge: -1
  pgno: 79
- img_proc: true
  md: "abbreviated notation, assigns a value to a variable according to a defined\
    \ condition,\nwhile the statement switch is based on many choices to make a decision.\n\
    \n# Syntax:\n\nvariable name = (condition) ? Value1(if true):value2(if false)\n\
    \nThe condition evaluates to true or false, to value1 if the condition is true\
    \ and to value2\nthe condition is false.\n\n# Sample:\n\n```\n<body>\n<p>Enter\
    \ your age then click the button:</p>\n<input id=\"age\" value=\"22\" />\n\n<button\
    \ onclick=\"myFunction()\">GO</button>\n<p id=\"test\"></p>\n\n<script>\nfunction\
    \ myFunction() {\n  var age,driving;\n  age = document.getElementById(\"age\"\
    ).value;\n  driving = (age < 16) ? \"Cannot drive\":\"Can drive\";\n  document.getElementById(\"\
    test\").innerHTML = driving + \" the car.\";\n}\n</script>\n</body>\n```\n\n#\
    \ Result 1:\n\n| Enter your age then click the button: |\n| 22 | GO |\n| Can drive\
    \ the car. | |\n\n# Result 2:\n\n| Enter your age then click the button: |\n|\
    \ 13 | GO |\n| Cannot drive the car. | |\n\nThe code starts with a variable named\
    \ age and another one named driving which starts\nwith a condition of age less\
    \ than 16 followed by the ? (question mark), the value1 is the\nstring \"cannot\
    \ drive\" and the value2 is the string \"can drive\".\n\nIf the age entered in\
    \ the box is less than 16 the outcome cannot drive, if the number\nentered is\
    \ => (equal or greater) than the 16 the outcome will read drive.\n\nThe ternary\
    \ operator does what if statement does.\n\n# Sample: The if statement."
  merge: -1
  pgno: 80
- img_proc: true
  md: "```\n<script>\nfunction myFunction() {\n  var age,driving=document.getElementById(\"\
    age\").value;\n  if (age < 16) {\n    driving = \"Cannot drive\";\n  } else {\n\
    \    driving = \"Can drive\";\n  }\n  document.getElementById(\"test\").innerHTML\
    \ = driving + \" the car.\";\n}\n</script>\n```\n\n# Result:\n\n![](img/331e10bc8df06a94fc8288a269de6c23_81_0.png)\n\
    \n# 52- Summary:\n\nAn array is just a list of variables that we get hold through\
    \ a number, loops are for repeating the line or lines of code many times until\
    \ it meets a specific condition and the switch statement and ternary operators\
    \ provide an alternative way for decision-making.\n\n# 53- Timers and Transitions:\n\
    \n# 53a- Introduction:\n\nTimers are JavaScript events, usually we like things\
    \ to speed up and not slow down but the one exception is transition effect when\
    \ slowing down is necessary so people can catch the changing happening at a slow\
    \ motion. We can do with JavaScript timers, however, CSS3 provides timers which\
    \ offer the control of time with the possibility of slowing down, in this way\
    \ we are not completely dependent on JavaScript for animation effects.\n\n# 53b-\
    \ Timers or Timing Events:\n\nAllow code execution delay, JavaScript waits before\
    \ executing some function, the code will be executed at a precise time intervals\
    \ calling timing events.\n\nthere are two ways of using timers:\n\n+   - setTimeout():\
    \ The parentheses hold the function that executes once and the milliseconds which\
    \ is a precise number of seconds.\n\n+   - setInterval(): The parentheses hold\
    \ the function that executes in a repetitive way at a precise time intervals expressed\
    \ in milliseconds similar to a loop but with a time delay.\n\nNote: setTimeout()\
    \ and setInterval() are methods of HTML DOM (Document Object Model)."
  merge: -1
  pgno: 81
- img_proc: true
  md: 'The function is a JavaScript function to be execute and a millisecond is 1/1000th
    of a second.


    setTimeout() and setInterval() are methods of the window event, they might be
    written with window and dot such as window.setInterval() and window.setTimeout()
    which is left out in JavaScript so it is OK to use setInterval() and setTimeout().


    # 3) Syntax to assign a variable to a timer:


    var name = setTimeout("JavaScript function", delay in milliseconds);

    var name = setInterval("JavaScript function", delay in milliseconds);


    You can choose the name of the variable, the code using setInterval() works the
    same as setTimeout(), once the timer is connected with a variable name you are
    able to stop it by using:

    clearInterval(variable name of the timer) Or clearTimeout(variable name of the
    timer).


    # Sample 1: Setting the execution time interval.


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <p>The alert box will connect to open every 5 seconds.</p>

    <p>Close the window to stop the ongoing alert box.</p>


    <button onclick="setInterval(function() { alert(''How are you?'');},5000);">Click</button>

    </body>

    </html>

    ```


    Result:


    ![](img/331e10bc8df06a94fc8288a269de6c23_82_0.png)


    Note:


    Each time you close the alert box, after 5 seconds it opens again, so you need
    to close the browser window.


    Sample 2: Using the setInterval() method to display the current time every 3 seconds.'
