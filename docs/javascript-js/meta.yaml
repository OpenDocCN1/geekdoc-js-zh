    \ browser handles the HTML5 input controls.\n\n## 46- Applying CSS:\n\nCSS is\
    \ used for styling websites and can be controlled using JavaScript which has ability\
    \ to make decisions in an intelligent way, but the name of the property used in\
    \ JavaScript and CSS is not always the same which is unfortunate, in JavaScript\
    \ we need to eliminate the hyphen and capitalize the first letter after.\n\n#\
    \ Table of some properties:\n\n| CSS Properties | Description | JavaScript properties\
    \ |\n| --- | --- | --- |\n| background | Specifies the background properties |\
    \ background |\n| background-color | Specifies the background color | backgroundColor\
    \ |\n| background-image | Specifies the background image | backgroundImage |\n\
    | background-size | Specifies the size of the background | backgroundSize |\n\
    | border-color | Specifies the color of the border | borderColor |\n| color |\
    \ Specifies the color of the text | color |\n| font-family | Specifies the font\
    \ family of the text | fontFamily |\n| font-size | Specifies the font size of\
    \ the text | fontSize |\n| text-align | Specifies the horizontal alignment of\
    \ the text | textAlign |\n\n## 47- Summary:\n\n- HTML5 audio doesn't need plug-ins\
    \ to play.\n- <audio> tags allow the audio object to be controlled by using JavaScript.\n\
    - Possible creation of audio object in a browser that supports it.\n- .canPlayType(),\
    \ .play() and .pause() methods allow the control of when and what the player plays.\n\
    - .setAttribute allows a value assignment to any HTML tag.\n- .style property\
    \ allows CSS to be applied to elements through JavaScript.\n\n## 48- Arrays and\
    \ Loops:\n\n### 48a- Creating Arrays:\n\nSometimes in programming you need to\
    \ work with lists of items and the best way to do it is by having a group of file\
    \ names in a list, therefore it is easier to work with them through their positions\
    \ in the list which can be expressed in numbers which computers are known to be\
    \ great at comprehending.\n\nThe list of items is visible to the programming language\
