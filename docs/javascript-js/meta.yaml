    \ that JavaScript function.\n\n```\n<button onclick=\"play()\">Try</button>\n\
    function play() {\n  if (window.player) {\n    player.play();\n  }\n}\n```\n\n\
    When we call the function play() the event is executed, in this code sample, when\
