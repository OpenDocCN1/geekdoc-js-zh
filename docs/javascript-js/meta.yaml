    \ else a red sentence, in the code of outcome color to red) appears asking for\
    \ a number between 1 and 3, see the Result 2 and the Result 3.\n\n![](img/331e10bc8df06a94fc8288a269de6c23_78_1.png)\n\
    \nResult 3:\n\n![](img/331e10bc8df06a94fc8288a269de6c23_78_2.png)"
