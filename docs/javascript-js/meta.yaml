  md: '# 1- Who is it for?


    JavaScript is a very easy programming language to learn and excel at, it is used
    in parallel with HTML (Hyper Text Markup Language) and CSS (Cascading Style Sheet).


    A basic knowledge of the 2 above helps you start right away with JavaScript programming.
    But don''t be scared and don''t worry, having a great desire to learn is the key
    to success.


    JavaScript is friendly to use and once you achieve the learning journey you''ll
    be very happy accomplishing the success.


    Start with the basic each time you finish a level with full understanding you
    move your way up!


    # 2- Introduction and History:


    In early 1990s the web was created but the pages in that time were static with
    no user interaction with the page.


    That time 2 browsers were popular enough to be mentioned, Netscape that used the
    programming language and allowed the pages to become interactive, with no compilation
    to interpret the commands.


    The other one was Java with its own plugin which got known soon enough that Netscape
    renamed its language to JavaScript.


    Internet Explorer was updated as well to support the vscript and the Jscript which
    was quite similar to JavaScript.


    Once Internet Explorer topped the browsers JavaScript became the accepted standard
    for interaction.


    JavaScript is Not Java programming language in fact it is so different they have
    different semantics. it is an easier language to learn, it facilitates the interaction
    with the user, it is very dynamic and very popular used by most browsers nowadays.


    It has many features that allow the object-oriented,


    Developed by Brendan Eich of Netscape which is an internet, software and telecommunication
    industry, JavaScript a client scripting language.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'During its development JavaScript was called Mocha then LiveScript, Brendan
    Eich trying to make it seams seems like the little brother of Java.


    ECMAScript scripting name got adjusted to JavaScript to avoid resemblance with
    skin disease.


    The competing browsers took into consideration this scripting language and its
    continuous growth and in 1996 JavaScript became the responsibility of the international
    standards body ECMA to be developed and officially named ECMAScript, but people
    refer to it as JavaScript.


    It creates interactive effects as we will explain later on, it is supported by
    the major browsers as internet explorer and...


    Any plain text editor as Note pad can be used to code in JavaScript.


    It is used with HTML Hyper Text Markup Language that is used to create static
    pages. HTML is not a programming language but JavaScript is and its code is included
    in the HTML code sometimes, often developers use JavaScript in a separate file
    with a `js` extension that should be saved in the same path or folder as the HTML
    one and that it is much easier to modify the `js` file without having to check
    a heavy coding file.


    And all what we have to do is link both of them by using the open/close Tags `<script>...<</script>`
    and the `slash` is to end the tag similarly to an HTML ending tag.


    The JavaScript is then added to many pages as we need to of course with the appropriate
    JavaScript code.


