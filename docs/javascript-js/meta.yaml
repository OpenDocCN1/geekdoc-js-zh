    # Using the .canPlayType (‘mimetype’):


    To test for more than one you use .canPlayType (‘mimetype’).


    MIME: Multipurpose Internet Mail Extensions that allows exchange of data files
    such as audio and video on the internet.


    A mime type is a string that has two parts, a type and a subtype


