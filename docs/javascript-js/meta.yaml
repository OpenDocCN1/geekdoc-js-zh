    </h1>

    ```


    No code executed once opened in the browser even if you click on the title.


    Why? The context menu is a shortcut menu and gets opened with the right click
    mouse button, for Mac use CTR + Click the subject.


    So right click on the title and the alert box opens, click OK, then a menu opens
    for you with options to choose from, you can just click Esc for escape or click
    anywhere in the browser to get red of it.


    # 15- **Decrease “hot spot”:**


    Let''s add an inline style, a border to the h1 text element with the onclick event
    handler.


    ```

    <h1 onclick="alert(''Save a tree'')" style="border:solid 3px blue">

    Trees are important

    </h1>

    ```


    **Result:** If you click anywhere inside the blue border the alert box opens,
    the border took the browser width.


    ![](img/331e10bc8df06a94fc8288a269de6c23_25_0.png)


    To fix that and get only the text to be applied to the event handler not the right
    empty space you can use span that is as wide as it contains. Take off the CSS
    inline style.


    **The span tag** now holds the JavaScript code.


    **See example:**


    ```

    <h1>

    <span onclick="alert(''Save a tree'')">

    Trees are important

    </span>

    </h1>

    ```


    **Result:** If you click on the right side of the text nothing will happen, the
    span now is hot and holds the JavaScript code, and the onclick event handler works
    just on what the span tag holds within it.'
