    setTimeout() and setInterval() are methods of the window event, they might be
    written with window and dot such as window.setInterval() and window.setTimeout()
    which is left out in JavaScript so it is OK to use setInterval() and setTimeout().


    # 3) Syntax to assign a variable to a timer:


    var name = setTimeout("JavaScript function", delay in milliseconds);

    var name = setInterval("JavaScript function", delay in milliseconds);


    You can choose the name of the variable, the code using setInterval() works the
    same as setTimeout(), once the timer is connected with a variable name you are
    able to stop it by using:

    clearInterval(variable name of the timer) Or clearTimeout(variable name of the
    timer).


    # Sample 1: Setting the execution time interval.


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <p>The alert box will connect to open every 5 seconds.</p>

    <p>Close the window to stop the ongoing alert box.</p>


    <button onclick="setInterval(function() { alert(''How are you?'');},5000);">Click</button>

    </body>

    </html>

    ```


    Result:


    ![](img/331e10bc8df06a94fc8288a269de6c23_82_0.png)


    Note:


    Each time you close the alert box, after 5 seconds it opens again, so you need
    to close the browser window.


    Sample 2: Using the setInterval() method to display the current time every 3 seconds.'
