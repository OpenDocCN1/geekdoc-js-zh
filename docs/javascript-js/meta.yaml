    \ we refer to this type of list as an array to differentiate from the visible\
    \ lists on a page.\n\n### 1) JavaScript Array:\n\nThe array object in JavaScript\
    \ has properties and methods to help work with data which is stored in arrays\
    \ that are just lists in the computer memory.\n\nAn array is a variable that is\
    \ capable of holding more than one value at once.\n\n# Code:\n\n```javascript\n\
    var name = new Array()\n```\n\nWhere name will be replaced by your chosen variable\
    \ name that must start with a letter with no spaces or symbols. The code tells\
    \ JavaScript the intention of creating an array.\n\nIn Array( ) we used uppercase\
    \ A which is typical in JavaScript's object name.\n\nWe need the assignment operator\
    \ =, all items have the same name and to differentiate between them we just give\
    \ each a number in square brackets.\n\nThe number starts from 0 and so on...not\
    \ 1, so [0] is the first element in the array and [1] is the second element.\n\
    \nWe can have different types of variables in the same array, we can have names,\
    \ objects, functions, arrays within the array...\n\n# Sample for Array coding:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Array coding</title>\n</head>\n\
    <body>\n<p id=\"test\"></p>\n<script>\nvar cars = new Array(\"BMW\", \"Mazda\"\
    , \"Mercedes\");\ndocument.getElementById(\"test\").innerHTML = cars;\n</script>\n\
    </body>\n</html>\n```\n\nResult:\n\n```javascript\nvar cars = [\"BMW\", \"Mazda\"\
    , \"Mercedes\"];\ndocument.getElementById(\"test\").innerHTML = cars;\n```\n\n\
