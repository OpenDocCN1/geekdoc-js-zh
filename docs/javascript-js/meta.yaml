    # 1- 它是给谁的？


    JavaScript 与 HTML（文本标记语言）和 CSS（层叠样式表）一起使用。HTML 不是编程语言，但 JavaScript 是，而它的代码包含了-
    所有强烈渴望学习 JavaScript (js) 脚本语言的你们。拥有学习的欲望是成功的最好途径。JavaScript 用于创建动态页面，它在浏览器中非常流行，并被许多网站使用。


    # 2- 简介与历史


    20 世纪 90 年代初，JavaScript 由 Netscape 的 Brendan Eich 创建。在开发期间，JavaScript 被称为 Mocha，然后是
    LiveScript。1996 年它被正式命名为 ECMAScript，但人们仍其称为 JavaScript。竞争浏览器考虑了这种语言及其增长。Internet
    Explorer 进行了更新以支持它，并重命名为 Jscript。它是面向对象的，具有许多功能，允许用户在网页上创建交互式元素。


