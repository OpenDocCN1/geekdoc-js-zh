    ## 3- JavaScript definition:


    JavaScript is a programming language that uses code which works behind the content
    of the web page you look at. So the user doesn''t see what is behind the content
    of the web page but the computer or the processor does.


    However, you can view the source code by right clicking on the page and choosing
    "view source code", yep you can view it!


    HTML elements, it is a coding language somehow, it uses texts, paragraphs, links,
    images tags and much more to build a web page, CSS code styles and gives it a
    better look by using selectors as color, font, background-color and much more
    to those pages created in HTML. JavaScript takes it farther by bringing dynamic
    to the page which, without it, is just a static one and can be boring, so it controls
    the page by making the interaction with the user possible and fun, when the user
    clicks on something.


    ## 4- JavaScript is a scripting Language:


    JavaScript is included in the file used to create the web page, which is saved
    as a .html file. You don''t really need a separate file to run JavaScript in that
    web page; it runs within it.


    But you can use a separate file in JavaScript with .js extension instead, that
    makes it easy for future updates and corrections of the code.


    Because it is a scripting language used to enhance the page that used HTML and
    CSS. We call it an interpretive language; most instructions are executed directly,
    it is fast, easy and cost-effective to use.


    The compiled languages are complex because of the code compilation.


    ## 5- Are JavaScript and Java the same?


    They are completely different; while JavaScript is a scripting language used with
    HTML and CSS, Java is not related to them and is a compiled language.


    In the world of web development, JavaScript is the one to use; the similarity
    in the name is just a marketing thing, when it was developed by Netscape in the
    1990s, Java was very popular and by calling it JavaScript, it got easier to be
    known.


    Netscape handed the language to ECMA which is a global company; since then all
    famous browsers have supported the ECMAScript, still called by everyone as JavaScript.


    ## 6- The start:


    To get started, we need to do a few things to be set and make sure it is organized.


    So you will create a folder and save it somewhere you remember and which will
    hold all the files that you will create to learn JavaScript.


    ### 6a- Folder creation:


    Creating web pages requires many files to be saved in the same path, to get hold
    of them easily and also coding files to be in the same place.


    Let us create a folder called "Basic JavaScript", you have the choice to put it
    anywhere you want on your PC or Mac.


    - Windows: right click on an empty space and choose New-Folder then type in the
    name Basic JavaScript.

    - Mac OS: CTRL + click an empty space and choose New Folder, click the new entitled
    folder, select it, click the untitled again, and make the name and write "JavaScript"
    press Enter.

    - Windows PC: choose the path where you like to have your file then, right Click
    in an empty space, select New, then folder, left mouse Click to accept, once done,
    right click on the empty folder and Rename then type the file name you want.


    Once the folder to keep the work is ready, let''s create a web page, where JavaScript
    is created in it.


    Let''s use a plain Text Editor, Notepad for Windows as an example to code or any
    other that you have.


    Start with "<!DOCTYPE html>" tag which means the document is used as HTML.


    The browser as well expects that.


    - 1. let''s use "Notepad (free), Notepad++ (free), TextEdit, KomodoEdit (free),
    Dreamweaver, TextWrangler (free) or any other you prefer..." to create a web page.


    If iCloud used, put the folder you created in your hard drive.


    Note: Change TextEdit preferences to plain text.


    HTML Code file: HTML is not sensitive to lower and upper cases. Minimum tags needed
    to create a web page are:


    ```html

    <!DOCTYPE html>

    <html></html> are the open/close HTML tags between which all the coding will be.

    <head></head> are the open/close tags that can have <title>....</title> open/close
    tags.

    </body></body> open/close tags where paragraphs and maybe lists and other tags
    will be.

    ```


