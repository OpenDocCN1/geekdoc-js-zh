    # 1- Who is it for?


    JavaScript is used with HTML (Text Markup Language) and CSS (Cascading Style Sheet).
    HTML is not a programming language but JavaScript is and its code is included
    in- all of you with the strong desire to learn the scripting language JavaScript
    (js). Having the desire to learn is the best to succeed. JavaScript is used to
    create dynamic pages, it is very popular among browsers and it is used on many
    websites.


    # 2- Introduction and History


    In early 1990s JavaScript was created by Brendan Eich of Netscape. During its
    development JavaScript was called Mocha then LiveScript. In 1996 it was officially
    named ECMcript, but people refer to it as JavaScript. Competing browsers took
    into consideration this language and its growth. Internet Explorer was updated
    to support it and renamed to Jscript. It is object-oriented and has many features
    that allow the user to create interactive elements on the web.

