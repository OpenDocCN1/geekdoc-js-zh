    ```\n\n## 44- JavaScript Audio:\n\n```\n<audio src=\"soundfile\">\n</audio>\n\
    ```\n\nThe soundfile will be replaced with the audio file of your choice, the\
    \ src is an attribute setting a value, setAttribute can be used in JavaScript\
    \ to tell it which sound file to play.\n\n## 45- Sound Effects:\n\nIn response\
