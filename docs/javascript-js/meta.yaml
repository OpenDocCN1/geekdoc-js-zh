    ## 9- Summary:


    JavaScript is a scripting language and supported by the most popular browser,
    it is used along with HTML and CSS for the web development.


    It uses open/close tags to tell the user (in this case the web browser) where
    the scripting language starts and where it ends.


    To add a comment in JavaScript we use // for single line comment or /* to start
    and /* to end the comment which are (/* & */ the same used for multiple line commenting
    as well.


    ## 10- Events Handling:


    The execution of the code in JavaScript is as important as the code itself, for
    example the command onmouseover doesn''t get alone unless the user wants to do
    so, and move the mouse over something, so there is a time when the code is sitting
    and that is what we want to be just silent until we decide otherwise, it stays
    silent until we execute it!


