    ![](img/331e10bc8df06a94fc8288a269de6c23_83_0.png)


    **Note:** The seconds part of the displayed time will execute every 3 seconds
    and display multiples of 3.


    **Try** to change the time to 5000 which is 5 seconds or any number you want.


    # # Conclusion


    Learning JavaScript, which is a scripting language, its basics and fundamentals
    is very easy and helpful to start learning a compiled programming languages which
    is complex.'
