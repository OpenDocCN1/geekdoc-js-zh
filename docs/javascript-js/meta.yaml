    # 11- Nesting:


    Nesting is important, you can use either double quotation then single ones Or
    the inverse start with the single quotations the double ones, as long as JavaScript
    is in quotation.


    ```

    <p onclick="alert{Take care}"></p>

    ```


    OR they use the single quotations first:


    ```

    <p onclick=''alert{Take care}''></p>

    ```


    The reason of using the first quotation onclick=" Or for some others onclick=''
    is for the browser to know that it is the start of JavaScript code then " the
    closing quotation that it knows is the end of it.


    As long as it has a start quotation matching the end quotation meaning: “ and
    ” Or '' and ''. Which is assumed by the browser.


    Nesting properly must be otherwise problems executing the event will be encountered.


    Something like this example is wrong:


    ```

    <p onclick="alert{Take care}\></p>

    ```


    # Good Practice:


    <p onclick="" Put right away after the onclick= the quotations! Therefore you
    avoid the mistake.


    # Remark:


    We can use JavaScript code without the script tags, and we can make the execution
    of events some time to get executed.


