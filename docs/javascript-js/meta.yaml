  md: '# Property: “.canPlayType”


    After defining an audio player .canPlayType property, this method checks the ability
    of the browser to play the audio/video type and can return either probably, maybe
    or an empty string "" is an unusual property because it returns a string instead
    of true or false. An empty string "" (zero) tells us away that it cannot play
    the file.


    # Using the .canPlayType (‘mimetype’):


    To test for more than one you use .canPlayType (‘mimetype’).


    MIME: Multipurpose Internet Mail Extensions that allows exchange of data files
    such as audio and video on the internet.


    A mime type is a string that has two parts, a type and a subtype


    MP3 is supported by most browsers, the type and subtype of the file extension
    .mp3 for example are: audio/mpeg3, audio/x-mpeg-3, video/mpeg and video/x-mpeg,
    where x means non-standard.


    To use this give a name to your player and replace mimetype with the file type,
    such as: name.canPlayType (‘mimetype’).


    MP3: simple audio/mpeg format.


    OGG: complex, codecs (compressor/decompress).


