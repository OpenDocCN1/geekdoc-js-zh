- md: "\n## Sample:\nvar x = 5\n\nWe created a variable named x and assigned to it\
    \ the value 5, there is no comparison at all.\nWe stored the number 5 in the variable\
    \ named x. Let's check the table in this case.\n\n| Example | Returns |\n|---|---|\n\
    | x==5 | true |\n| x>5 | false |\n| x<5 | false |\n| x>=5 | true |\n| x<=5 | true\
    \ |\n| x!=5 | false |\n\n## Sample code:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>if else statement</title>\n</head>\n<body>\n<script>\n  var score\
    \ = 80;\n  if (score > 73) {\n    document.write(\"The score is high\");\n  }\
    \ else {\n    document.write(\"The score is low\");\n  }\n</script>\n</body>\n\
    </html>\n```\n\n## Result:\n\n![](img/331e10bc8df06a94fc8288a269de6c23_46_0.png)\n\
    \nThe if code executes because the condition score >= 73 is true, therefore the\
    \ web displays\nThe score is high.\n\nSome testing conditions are not simple and\
    \ need other type of operators called the Logical Operators.\n\n## 30b- Logical\
    \ Operators:\n\nJavaScript Logical Operators are used to establish the logic between\
    \ variables or they allow testing for many conditions to determine if all or some\
    \ of them are true or not.\nLet's consider two variable, x = 5 and y = 9.\n\n\
    | Operator | Means | Example |\n| --- | --- | --- |\n| && | and | (x < 7 && y\
    \ > 4) is true |\n| ! | not | !(x == y) is true |\n| || | or | (x == 3 || y ==\
    \ 3) is false |\n\n## More complex sample:\n\nWhich is actually very simple if\
    \ we look at each step.\n\n```html\n<body>\n<script>\n  var age = 90\n  if (age\
    \ <= 13) {\n    document.write(\"cannot drive\")\n  } else if (age > 16 && age\
    \ < 85) {\n    document.write(\"can drive\")\n  } else {\n    document.write(\"\
    someone else should drive\")\n  }\n</script>\n</body>\n```\n\n## Result:\n\n![](img/331e10bc8df06a94fc8288a269de6c23_47_0.png)\n\
    \n## Explanation:\n\nvar age = 90 (creates a variable named age and stores 90\
    \ as value).\nif (age <= 13) {\n  document.write(\"cannot drive\")\n}\nThat means\
    \ if age is less than or equal to 13 the person cannot drive and since 90 is over\
    \ that it will not happen.\n\n```javascript\nelse if (age > 16 && age < 85) {\n\
    \  document.write(\"can drive\")\n}\n```\n\nThat means if age is greater than\
    \ 16 and less than 85 the person can drive but it is not the case as the var age\
    \ is set to 90.\n\n```javascript\nelse {\n  document.write(\"someone else should\
    \ drive\")\n}\n```\n\nTherefore the else statement will be executed and the web\
    \ displays someone else drive.\n\n## 31- Summary:\n\n- JavaScript language stores\
    \ data to create interactive web pages.\n- Boolean values are either true or false.\n\
    - Dates are such as month, day, year or simply time.\n- Numbers are scalar values\n\
    - Strings are texts such as names.\n\nThe if...else logic allows the code to make\
    \ decisions based on the variable’s values which helps developing websites and\
    \ more.\n\n## 32- Searching the site:\n\nLet's get started with the usual HTML\
    \ controls and HTML5 tags and coding to allow went searching.\n\nOpen the editor\
    \ in my case Notepad, or any of your choice and start coding.\n\n## Sample:\n\n\
    File Edit Format View Help\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Searching\
    \ the web</title>\n</head>\n<body>\n<script>\n<p>Searching the web\n<input type=\"\
    text\" id=\"wordoffsetof\" autofocus>\n<input type=\"button\" onclick=\"search()\"\
    \ value=\"find\">\n</p>\n</script>\n</body>\n</html>\n```\n\n![](img/331e10bc8df06a94fc8288a269de6c23_49_0.png)\n\
    \nWhen you save it as .html then open it in the browser nothing shows up, why?\
    \ Because we need JavaScript code to make search happen and take place. So below\
    \ the </title> tag but above the </head> tag, we need to add <script> tag then\
    \ close it by adding the </script> tag.\n\n```html\n<html>\n<head>\n<title>Searching\
    \ the web</title>\n<script>\n</script>\n</head>\n```\n\nThe use of onclick=\"\
    search()\" in the input tag, is for the code to find function once the button\
    \ is clicked.\n\n```html\n<html>\n<head>\n<title>Searching the web</title>\n<script>\n\
    function search() {\n}\n</script>\n</head>\n```\n\nNotice that now we have a JavaScript\
    \ function () but still does nothing because it is empty. The code to executed\
    \ is enclosed between the opening and closing braces. When calling the function\
    \ the text box isn't filled at all and still empty then use alert to remind the\
    \ user to type. To get what the user typed, a URL (Uniform Resource Locator: http://...)\
    \ and put it in the address bar, you can use any site's name that you know to\
    \ begin searching, if you have your own site then you can use instead. Start coding\
    \ between the open curly braces, you can use comments to make notes yourself here.\n\
    \n```javascript\n<script>\nfunction search() {\n  //use any website's name\n \
    \ var site = \"dictionary.org\";\n}\n</script>\n```\n\nTo get what the user typed\
    \ in the text box we use document.getElementById, in our sample the input tag\
    \ has id=\"wordtofind\" we can get its value in JavaScript means whatever the\
    \ user typed. Let's add this to code.\n\n```html\n<html>\n<head>\n<title>Searching\
    \ the web</title>\n<script>\nfunction search() {\n  //use any website's name\n\
    \  var site = \"dictionary.org\"\n  //the text that the user typed\n  var find\
    \ = document.getElementById(\"wordtofind\").value;\n}\n</script>\n</head>\n</html>\n\
    ```\n\nA variable find was added, it will store the data the user typed in the\
    \ text box.\n\n## 32a- Searching:\n\nIf the user typed the text in the text box\
    \ the code will perform the search but in case blank then the user gets an alert\
    \ message to type something. Sample same as before adding the if else block.\n\
    \n```html\n<html>\n<head>\n<title>Searching the web</title>\n<script>\nfunction\
    \ search() {\n  //use any website's name\n  var site = \"dictionary.org\"\n  //the\
    \ text that the user typed\n  var find = document.getElementById(\"wordtofind\"\
    ).value;\n  //Adding the if...else block, case: textbox not empty\n  if () {\n\
    \  } else {\n  }\n}\n</script>\n</head>\n```\n\nNote: the last curly brace closes\
    \ the whole block of code, it belongs to the code\n\n```javascript\nfunction search\
    \ () {\n  block of code to be executed\n}\n```\n\nThe use of if is to make a decision\
    \ based on the text box blank or not. We have a variable named find therefore\
    \ anything stored in that text box is that variable which is a string type because\
    \ it is in the text box.\n\n## 32b- Length property:\n\nUse the syntax: string.length\
    \ to find the length of the string typed by the user .length property allows you\
    \ to do that, it determines the number of characters, if the text box was blank\
    \ then the result will show 0 (the number zero).\n\nSample:\n\n![](img/331e10bc8df06a94fc8288a269de6c23_51_0.png)\n\
    \nResult:\n\n![](img/331e10bc8df06a94fc8288a269de6c23_51_1.png)\n\nNote: the space\
    \ is also a character why we have 8 for the string \"Hi there\".\n\nThe code sends\
    \ a URL (Uniform Resource Locator) which is an address to Google when performing\
    \ the search, therefore Google search for it finds it, we can also enter a site\
    \ name in the search text box. The string concatenation in the programming language\
    \ builds the URL to join two more strings.\n\n## 33- String concatenation:\n\n\
    A string is a text, concatenation means \"linking or joining things together\"\
    \ like a chain, so let's say we have two strings Hi and There, if we concatenate\
    \ them together we get Hi There, it is that simple.\n\nTo concatenate simply use\
    \ JavaScript + operator.\n\nIn the case of strings (not numbers) the + operator\
    \ joins two or more strings to make a single one, example: \"Hi\" + \"There\"\
    \ gets us one single string which is \"Hi There\".\n\nSample:\n\n```html\n<body>\n\
    <p>Click on the button to join strings</p>\n<button onclick=\"myfunction()\">Click\
    \ here</button>\n<p id=\"test\"></p>\n\n<script>\nfunction myFunction() {\n  var\
    \ string1 = \"Hi \";\n  var string2 = \"There!\"\n  var string3 = \" How are you?\"\
    \n  var result = string1.concat(string2,string3);\n  document.getElementById(\"\
    test\").innerHTML = result;\n}\n</script>\n</body>\n```\n\n## Result:\n\n![](img/331e10bc8df06a94fc8288a269de6c23_53_0.png)\n\
    \nOnce you click the button the sentence below appears. String concat() method\
    \ is very simple, it returns a new string of the existing ones.\n\n## 34- Drop\
    \ Down List:\n\nAdding a drop-down list that holds selections and choices for\
    \ the user is helpful, using HTML controls and JavaScript. Many websites have\
    \ drop-down lists, the controls are just a text box with an arrow on its side,\
    \ by clicking on the arrow the selection list shows up. To add a drop-menu or\
    \ list we use HTML opening and closing tags: <select>...</select> and <option>...</option>.\
    \ By adding an id to <select> tag or element allow the selection from the list\
    \ through JavaScript, an ID name is needed for the control because JavaScript\
    \ finds controls only through IDs. The <option> tag inside the <select> element\
    \ which is itself a control that enables to collect user data states the convenient\
    \ options in the list. In each option can use a value that has a unique item,\
    \ JavaScript determines which choice the user picked through the value of the\
    \ item chosen. To end the control <select> closing tag.\n\n## Sample:\n\nNote:\
    \ <!-- write your comment here --> is the HTML comment tag &nbsp; is an HTML entity\
    \ used for non-breaking space.\n\n```html\n<body>\n<p>Search here:\n  <input type=\"\
    text\" id=\"textfield\" autofocus>\n  <!-- search textbox and text -->\n  &nbsp;searchPick:\n\
    \  <input type=\"button\" onclick=\"search()\" value=\"Click\">\n</p>\n</body>\n\
    ```\n"
