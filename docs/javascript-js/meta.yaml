    # 48b- Loops:


    Like many programming languages JavaScript has loops which consist of a block
    of code repeated many times until it reaches a specific condition. It helps saving
    time and avoiding rewriting the same code over and over again, they are used to
    access elements in an array, there are two types of loops.


    +   1) JavaScript for loop:


    It is used to create a loop and supply means of its repetition at an established
    number of times at the same time of incrementing or decrementing the value of
    some variable, so it offers the possibility to count forward or backward, also
    to start and end at any number.

    We use the for statement as counter, we need the starting point which is the initial
    value of the counting start, the condition to test determine the continuation
    of the loop and if it is true the increment or decrement to be executed, after
    the complete execution of the loop again.


    ```

    for (start, condition, increment or decrement)

    code to be executed

    }

    ```


    Note: All the parts of the for loop occur at the same time.

    - i is the label for the counter variable which is used to count how many times
    the loop has looped.

    - The condition to decide whether or not the loop continues the execution and
    usually includes the counter variable.

    - After each loop loop the counter variable is incremented or decremented.

    Then the code to be executed for each loop.


    Sample:

    for (start, condition, increment or decrement)

    code to be executed

    }

    For start part let''s replace it by a variable named i and assign an initial value
    to it.

    For condition part let''s set when the loop stops repeating.

    For increment part let''s set the amount of increments or decrements, we can use
    ++ to'
