    \ 示例代码:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>if else语句</title>\n\
    </head>\n<body>\n<script>\n  var score = 80;\n  if (score > 73) {\n    document.write(\"\
    The score is high\");\n  } else {\n    document.write(\"The score is low\");\n\
    \  }\n</script>\n</body>\n</html>\n```\n\n## 结果:\n\n![](img/331e10bc8df06a94fc8288a269de6c23_46_0.png)\n\
    \nif 代码执行了，是因为条件 score >= 73 为真，因此网页显示\nThe score is high。\n\n某些测试条件并不简单，需要其他类型的运算符，称为“逻辑运算符”。\n\
    \n## 30b- 逻辑运算符:\n\nJavaScript 逻辑运算符用于建立变量之间的逻辑关系，或者允许测试许多条件以确定它们是否全部或部分为真。\n\
    让我们考虑两个变量，x = 5 和 y = 9。\n\n| 运算符 | 含义 | 示例 |\n| --- | --- | --- |\n| && | 与 |\
    \ (x < 7 && y > 4) 为真 |\n| ! | 非 | !(x == y) 为真 |\n| || | 或 | (x == 3 || y ==\
    \ 3) 为假 |\n\n## 更复杂的示例:\n\n如果我们看每一个步骤，它实际上非常简单。\n\n```html\n<body>\n<script>\n\
    \  var age = 90\n  if (age <= 13) {\n    document.write(\"cannot drive\")\n  }\
    \ else if (age > 16 && age < 85) {\n    document.write(\"can drive\")\n  } else\
    \ {\n    document.write(\"someone else should drive\")\n  }\n</script>\n</body>\n\
    ```\n\n## 结果:\n\n![](img/331e10bc8df06a94fc8288a269de6c23_47_0.png)\n\n## 解释:\n\
    \nvar age = 90（创建一个名为 age 的变量并将 90 存储为值）。\nif (age <= 13) {\n  document.write(\"\
    cannot drive\")\n}\n这意味着如果 age 小于或等于 13，该人不能开车，由于 90 超过了该值，所以不会发生。\n\n```javascript\n\
    else if (age > 16 && age < 85) {\n  document.write(\"can drive\")\n}\n```\n\n\
    这意味着如果 age 大于 16 且小于 85，该人就可以开车，但并非如此，因为 var age 被设置为 90。\n\n```javascript\nelse\
    \ {\n  document.write(\"someone else should drive\")\n}\n```\n\n因此，将执行 else 语句，网页显示\
    \ someone else drive。\n\n## 31- 总结:\n\n- JavaScript 语言存储数据以创建交互式网页。\n- 布尔值为 true（真）或\
    \ false（假）。\n- 日期诸如月、日、年或简单的时间。\n- 数字是标量值。\n- 字符串是如文本。\n\nif...else 逻辑允许代码根据变量的值做出决策，这有助于开发网站等。\n\
    \n## 32- 站点搜索:\n\n让我们从常用的 HTML 控制、HTML5 标签和编码开始，实现搜索。\n\n在我的情况下，打开记事本编辑器或你选择的任何编辑器并开始编码。\n\
    \n## 示例:\n\n文件 编辑 格式 查看 帮助\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>搜索网页</title>\n\
    </head>\n<body>\n<script>\n<p>Searching the web\n<input type=\"text\" id=\"wordoffsetof\"\
    \ autofocus>\n<input type=\"button\" onclick=\"search()\" value=\"find\">\n</p>\n\
    </script>\n</body>\n</html>\n```\n\n![](img/331e10bc8df06a94fc8288a269de6c23_49_0.png)\n\
    \n当我们将其保存为 .html 后在浏览器中打开时什么都没有显示，为什么？因为我们需要 JavaScript 代码来让搜索发生并进行。因此，在 </title>\
    \ 标签下方、</head> 标签上方，我们需要添加 <script> 标签，然后通过添加 </script> 标签将其关闭。\n\n```html\n<html>\n\
    <head>\n<title>Searching the web</title>\n<script>\n</script>\n</head>\n```\n\n\
    在 input 标签中使用 onclick=\"search()\" 是为了让代码在点击按钮后找到 search 函数。\n\n```html\n<html>\n\
    <head>\n<title>Searching the web</title>\n<script>\nfunction search() {\n}\n</script>\n\
    </head>\n```\n\n注意，现在我们有一个 JavaScript 函数 ()，但它仍然什么都不做，因为它是空的。执行的代码包含在起始括号和结束括号之间。当调用函数时，文本框完全没有填写且仍然是空的，使用\
    \ alert 提醒用户输入。获取用户输入的内容 URL（统一资源定位符：...）并将其放在地址栏，你可以使用任何网站名称来开始搜索，如果你有自己的网站，可以在大括号之间编码，你可以使用注释。\n\
    \n```javascript\n<script>\nfunction search() {\n  // 使用任何网站名称\n  var site = \"\
    dictionary.org\";\n}\n</script>\n```\n\n为了获取用户在文本框中输入的内容，我们使用 getgetElementById，在我们的示例中\
    \ input 标签有 id=\"wordtofind\"，我们可以获取它的值。将此添加到代码中。\n\n```html\n<html>\n<head>\n\
    <title>Searching the web</title>\n<script>\nfunction search() {\n  // 使用任何网站名称\n\
    \  var site = \"dictionary.org\"\n  // 用户输入的文本\n  var find = document.getElementById(\"\
    wordtofind\").value;\n}\n</script>\n</head>\n</html>\n```\n\n添加了一个变量 find，它将存储用户在文本框中输入的数据。\n\
    \n32a- 搜索:\n\n如果用户在文本框中输入文本，代码将执行搜索，如果为空则用户将收到 alert 提示输入内容。和之前一样添加 if else 块。\n\
    \n```html\n<html>\n<head>\n<title>Searching the web</title>\n<script>\nfunction\
    \ search() {\n  // 使用任何网站名称\n  var site = \"dictionary.org\"\n  // 用户输入的文本\n \
    \ var find = document.getElementById(\"wordtofind\").value;\n  // 添加 if...else\
    \ 块，情况为空\n  if () {\n  } else {\n  }\n}\n</script>\n</head>\n```\n\n注意：最后一个大括号关闭了整个代码块，它属于代码。\n\
    \n```javascript\nfunction search () {\n  // 执行代码块\n}\n```\n\n使用 if 是根据文本框是否为空来做出决策。我们有一个名为\
    \ find 的变量，因此文本框中的任何内容都是字符串类型。\n\n32b- Length 属性:\n\n使用语法 string.length 来查找用户输入的字符串长度。length\
    \ 属性允许你这样做，它确定字符的数量，如果文本框为空，结果将显示为 0（数字）。\n\n示例:\n\n![](img/331e10bc8df06a94fc8288a269de6c23_51_0.png)\n\
    \n结果:\n\n![](img/331e10bc8df06a94fc8288a269de6c23_51_1.png)\n\n注意：空格也是一个字符，我们有字符串\
    \ \"Hi there\"。代码发送一个 URL（统一资源定位符），当执行搜索时这是一个地址，因此 Google 搜索并找到它，我们还可以在搜索文本框中输入网站名称。编程语言中的字符串拼接用于连接两个更多的字符串。\n\
    \n## 33- 字符串拼接:\n\n字符串是文本，拼接意味着“将事物连接在一起”，就像链一样。假设我们有两个字符串 Hi 和 There，把它们拼接在一起就会得到\
    \ Hi There，就如此。\n\n要拼接只需使用 JavaScript 的 + 运算符。\n\n在字符串（而不是数字）的情况下，+ 运算符将两个或多个字符串连接成一个，例如：\"\
    Hi\" + \"There\" 让我们得到一个单一字符串 \"Hi There\"。\n\n示例:\n\n```html\n<body>\n<p>点击按钮连接字符串</p>\n\
    <button onclick=\"myfunction()\">点击这里</button>\n<p id=\"test\"></p>\n\n<script>\n\
    function myFunction() {\n  var string1 = \"Hi \";\n  var string2 = \"There!\"\n\
    \  var string3 = \" How are you?\"\n  var result = string1.concat(string2,string3);\n\
    \  document.getElementById(\"test\").innerHTML = result;\n}\n</script>\n</body>\n\
    ```\n\n## 结果:\n\n![](img/331e10bc8df06a94fc8288a269de6c23_53_0.png)\n\n一旦点击按钮，下方的句子就会出现。String\
    \ concat() 方法非常简单，它返回现有字符串的新字符串。\n\n## 34- 下拉列表:\n\n使用 HTML 控制和 JavaScript 增加一个包含用户选择和选项的下拉列表是有帮助的。许多网站都有下拉列表，这些控件只是一个侧边带有箭头的文本框，通过点击箭头，选择列表就会出现。要添加下拉菜单或列表，我们使用\
    \ HTML 的起始和结束标签：<select>...</select> 和 <option>...</option>。通过向 <select> 标签或元素添加\
    \ id，允许通过 JavaScript 从列表中进行选择，控件需要一个 ID 名称，因为 JavaScript 只通过 ID 查找控件。<select>\
    \ 元素内部的 <option> 标签（其本身是一个能够收集用户数据的控件）列出了列表中的方便选项。每个选项可以使用一个具有唯一项目的值，JavaScript\
    \ 通过所选项目的值来确定用户选择了哪种选择。结束控件使用 </select> 结束标签。\n\n"
