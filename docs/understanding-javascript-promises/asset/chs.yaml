- "# JavaScript Promises 入门指南\n\n\n\n![](img/cover.jpg)\n![](img/file0.jpg)\n\n\n\n\
  \n\n\n## 简介\n\n虽然 Promise 经常与异步操作相关，但它们仅仅是值的占位符。该值可能已经确定，或者更常见的是，值可能是异步操作的结果。与其订阅事件或向函数传递回调函数，函数可以返回一个\
  \ Promise，如下：\n\n```javascript\n// fetch() 承诺在未来的某个点完成\nconst promise = fetch (“books.json”);\n\
  ```\n\nJavaScript 最强大的特性之一是它如何方便地处理异步编程。在引入 Promise 之前，处理异步操作通常依赖于回调函数，这往往会导致“回调地狱”，使得代码难以维护和理解。Promise\
  \ 的出现了一种更优雅的方式来处理这些问题。\n\n在本书中，我们将深入探讨 Promise 的核心概念，学习如何使用它们来构建复杂的异步逻辑。无论你是 JavaScript\
  \ 初学者还是寻求进阶技巧的开发者，本书都将为你提供实用的指南。\n\n## 关于本书书\n\n本书的目标是帮助你理解 Promise 的工作原理。我们将从基础概念开始，逐步过渡到高级用法，如链式调用、并发处理以及现代的\
  \ `async/await` 语法。书中包含了大量的代码示例，帮助你直观地理解这些技术在实际项目中的应用。\n\n## 致谢\n\n我感谢我的父亲 Speros\
  \ Zakas 对本书的校对，感谢 Rob Friesel 的技术编辑。你们都让这本书变得完善得多。\n\n感谢所有审阅早期版本并提供反馈的人：Mike Sherov,\
  \ David Hund, Murat Corlu 和 Chris Ferdinandi。\n\n## 关于作者\n\nNicholas C. Zakas 是一位独立软件工程师、顾问和教练。他是\
  \ ESLint 开源项目的创建，并担任 ESLint 技术委员会成员。Nicholas 与公司和个人合作改进工程流程，帮助技术领导者成长和成功。他还编写或参与了十多本关于\
  \ JavaScript 和 Web 开发的书。你可以通过 `https://humanwhocodes.com` 找到，并在 Twitter 上关注他 `@slicknet`。\n\
  \n## 免责声明\n\n虽然出版商和作者已尽最大努力确保书中包含的信息和说明准确，但出版商和作者对任何错误或遗漏不承担责任，包括但不限于对使用或依赖本书所导致损害的责任。使用书中包含的信息和说明风险由用户自负。如果本书包含或描述的任何代码示例或其他技术受开源许可或他人知识产权的限制，你有责任确保你的使用符合此类许可和/或权利。\n\
  \n# 1. Promise 基础\n\n虽然 Promise 通常与异步操作相关，但它们仅仅是值的占位符。该值可能已经确定，或者更常见的是，值可能是异步操作的结果。与其订阅事件或向函数传递回调函数，函数可以返回一个\
  \ Promise，如下：\n\n```javascript\n// fetch() 承诺在未来的某个点完成\nconst promise = fetch (“books.json”);\n\
  ```\n\n\n\n\n`fetch()` 函数是 JavaScript 运行时中常用的工具函数，用于发送网络请求。调用 `fetch()` 并不会立即完成网络请求；请求将在稍后完成。相反，该函数会返回一个\
  \ promise 对象（在示例中存储在 `promise` 变量中，但你可以为它命名任何名称），代表该异步操作，以便你以后对其进行处理。你何时能够处理该结果完全取决于\
  \ promise 的生命周期如何进展。\n\n## Promise 的生命周期\n\n每个 promise 都会经历一个短暂的生命周期，从 `pending`（等待中）状态开始，表示\
  \ promise 尚未完成。处于等待状态的 promise 被视为未决定的（unsettled）。在上一个示例中，promise 在 `fetch()` 返回时立即处于\
  \ `pending` 状态。一旦 promise 完成，它就会被视为已决（settled），并进入两种可能状态之一（见图 1-1）：\n\n- **Fulfilled**（已完成）：promise\
  \ 成功完成。\n- **Rejected**（已拒绝）：promise 因为错误或其他原因未成功完成。\n\n![](img/file1.png)\n\n图\
  \ 1-1：Promise 状态\n\n内部属性 `[[PromiseState]]` 被设置为 `“pending”`、`“fulfilled”` 或 `“rejected”`\
  \ 以反映 promise 的状态。promise 对象并不暴露此属性，因此你无法通过编程判断 promise 处于哪种状态。但你可以通过 `then()` 方法在\
  \ promise 状态改变时执行特定操作。\n\n## 使用 then() 分配处理器\n\n`then()` 方法存在于所有 promise 上，并接受两个参数。第一个参数是在\
  \ promise 成功完成时调用的函数，称为完成处理器（fulfillment handler）。与异步操作相关的任何额外数据都会传递给此函数。第二个参数是在\
  \ promise 被拒绝时调用的函数，称为拒绝处理器（rejection handler）。与完成处理器类似，拒绝处理器也会接收与拒绝（错误）相关的任何额外数据。\n\
  \n任何以这种方式实现 `then()` 方法的对象都被称为 thenable（可类 promise 对象）。所有的 promise 都是 thenable，但并不是所有\
  \ thenable 都是 promise。\n\n`then()` 的两个参数都是可选的，因此你可以监听完成和拒绝的任何组合。例如，考虑以下这组 `then()`\
  \ 调用：\n\n```javascript\n1 const promise = fetch ( “books.json” ); 2 3 // 添加一个完成和一个拒绝处理器\
  \ 4 promise . then ( response => { 5     // 完成 6     console . log ( response .\
  \ status ); 7 }, reason => { 8     // 拒绝 9     console . error ( reason . message\
  \ ); 10 }); 11 12 // 再添加一个完成处理器 13 promise . then ( response => { 14     // 完成 15\
  \     console . log ( response .statusText ); 16 }); 17 18 // 再添加一个拒绝处理器 19 promise\
  \ . then ( null , reason => { 20     // 拒绝 21     console . error ( reason . message\
  \ ); 22 });\n```\n\n所有三个 `then()` 调用都作用于同一个 promise。第一个调用同时分配了完成处理器和拒绝处理器。第二个调用只分配了完成处理器；错误不会被报告。第三个调用只分配了拒绝处理器且不会报告成功。\n\
  \n`fetch()` 函数的一个特点是，只要它接收到 HTTP 状态码，返回的 promise 就会变为完成，即使是 404 或 500。只有当网络请求由于某种原因失败时，promise\
  \ 才会被拒绝。如果你想确保状态处于 200-299 范围内，可以检查 `response.ok` 属性，如示例所示：\n\n```javascript\n1\
  \ const promise = fetch ( “books.json” ); 2 3 promise . then ( response => { 4 \
  \    if ( response . ok ) { 5         console . log ( “Request succeeded.” ); 6\
  \     } else { 7         console . error ( “Request failed.” ); 8     } 9 });\n\
  ```\n\n## 使用 catch() 分配拒绝处理器\n\nPromise 还有一个 `catch()` 方法，当只传递拒绝处理器时，它的行为与 `then()`\
  \ 相同。例如，以下 `catch()` 和 `then()` 调用在功能上是等等的：\n\n```javascript\n1 const promise =\
  \ fetch ( “books.json” ); 2 3 promise . catch ( reason => { 4     // 拒绝 5     console\
  \ . error ( reason . message ); 6 }); 7 8 // 等同于： 9 10 promise . then ( null , reason\
  \ => { 11     // 拒绝 12     console . error ( reason . message ); 13 });\n```\n\n\
  `then()` 和 `catch()` 的意图是让你结合使用它们，清晰地指示如何处理结果。这套系统比事件和回调更好，因为它让成功或失败变得完全清晰。（事件在发生错误时通常不会触发，而在回调中，你必须始终记得检查错误参数。）只需知道，如果你没有为被拒绝的\
  \ promise 附加拒绝处理器，JavaScript 运行时将向控制台输出消息、抛出错误、或者两者兼有（取决于运行时）。\n\n## 使用 finally()\
  \ 分配终决处理器\n\n除了 `then()` 和 `catch()`，还有 `finally()`。传递给 `finally()` 的回调（称为终决处理器\
  \ settlement handler）无论成功失败都会被调用。与 `then()` 和 `catch()` 的回调不同，`finally()` 回调不接收任何参数，因为尚不清楚\
  \ promise 是完成还是被拒绝。由于终决处理器在完成和拒绝时都会调用，它与使用 `then()` 同时传递完成和拒绝的处理器相似（但并不相同；将在第 2\
  \ 章进一步讨论）。如下所示：\n\n```javascript\n1 const promise = fetch ( “books.json” ); 2 3\
  \ promise . finally (() => { 4     // 无论成功失败都会 5     console . log ( “Settled” );\
  \ 6 }); 7 8 // 类似于： 9 10 const callback = () => { 11     console . log ( “Settled”\
  \ ); 12 }; 13 14 promise . then ( callback , callback );\n```\n\n只要你不访问传递给 `callback`\
  \ 的参数，这两个示例的行为是相同的。但是，与 `catch()` 一样，使用 `finally()` 比起 `then()` 意图更清晰。\n\n终决处理器适用于你想知道操作已完成但不关心结果的情况。例如，你可能希望在\
  \ `fetch()` 请求期间在网页上显示加载指示，并在请求完成后隐藏它。无论请求是否成功，加载指示都应该停止。在你的 Web 应用中可能会如下代码：\n\n\
  ```javascript\n1 const appElement = document . getById ( “app” ); 2 const promise\
  \ = fetch ( “books.json” ); 3 4 appElement . classList . add ( “loading” ); 5 6\
  \ promise . then (() => { 7     // 处理成功 8 }); 9 10 promise . catch (() => { 11 \
  \    // 处理失败 12 }); 13 14 promise . finally (() => { 15     appElement . classList\
  \ . remove ( “loading” ); 16 });\n```\n\n在这里，`appElement` 代表封装整个应用的 HTML 元素。通过 `fetch()`\
  \ 初始化网络请求并向 HTML 元素添加 CSS 类 “loading”（允许根据需要更改样式）。当网络请求完成后，`promise` 稳定，终决处理器移除\
  \ HTML 元素上的“loading”类以重置应用状态。你可以使用 `then()` 和 `catch()` 响应成功和失败，而 `finally()` 仅处理状态变化。如果没有\
  \ `finally()`，你需要在完成和拒绝处理器中都移除“loading”类。\n\n通过 `finally()` 添加的终决处理器不会防止拒绝向控制台输出错误或抛出错误。在这种情况下，你仍然必须添加拒绝处理器以防止错误被抛出。\n\
  \n## 为已决定的 Promise 分配处理器\n\n即使在 promise 已经稳定之后添加完成、拒绝或终决处理器，它们仍然会被执行。这允许你在任何时候添加新的完成和拒绝处理器，并保证它们会被调用。例如：\n\
  \n\n\n\n\n```javascript\nconst promise = fetch ( “books.json” );\n// original fulfillment\
  \ handler\npromise .then ( response => {\n    console . log ( response .status );\n\
  \n    // now add another\n    promise .then ( response => {\n        console . log\
  \ ( response .statusText );\n    });\n});\n```\n\n在此代码中，成功处理函数（fulfillment handler）为同一个\
  \ `promise` 添加了另一个成功处理函数。此时 `promise` 已经完成履行，因此新的成功处理函数被添加到微任务队列中，并在就绪时调用。拒绝处理函数（rejection）和状态处理函数（settlement）的工作的方式相同。\n\
  \n## 处理程序与微任务\n\n在程序常规流中执行的 JavaScript 是以任务（task）的形式执行的，这意味着 JavaScript 运行时创建了一个新的执行上下文并完全执行代码，完成后退出。例如，网页中按钮的\
  \ `onclick` 处理程序是作为任务执行的。当按钮被点击时，会创建一个新任务并执行 `onclick` 处理程序。一旦完成，JavaScript 运行时将等待下次交互以执行更多代码。然而，Promise\
  \ 处理程序的执行方式不同。\n\n所有的 Promise 处理程序（无论是成功、拒绝还是状态处理）都是在 JavaScript 引擎内部作为微任务（microtasks）执行的。微任务被缓存，并在当前运行的任务完成后立即执行，在\
  \ JavaScript 运行时变为空闲之前执行。调用 `then()`、`catch()` 或 `finally()` 会告诉 `promise` 在状态确定后将指定的微任务队列。\n\
  \n这与使用 `setTimeout()` 或 `setInterval()` 创建定时器不同，这两者都会创建新任务并在稍后的某个时间点执行。队列中的 Promise\
  \ 处理程序始终会在同一任务中排队的的定时器之前执行。你可以通过全局函数 `queueMicrotask()` 来亲自测试这一点，该函数用于在 promise\
  \ 之外创建微任务：\n\n```javascript\nsetTimeout (() => {\n    console . log ( “timer” );\n\
  \n    queueMicrotask (() => {\n        console . log ( “microtask in timer” );\n\
  \    });\n}, 0 );\n\nqueueMicrotask (() => {\n    console . log ( “microtask” );\n\
  });\n```\n\n在此代码中，创建了一个延迟为 0 毫秒的定时器，并在定时器内部创建了一个微任务。此外，在定时器外部创建了一个微任务。当这段代码执行时，你将在控制台中看到以下输出：\n\
  \nmicrotask\ntimer\nmicrotask in timer\n\n尽管定时器被设置为延迟 0 毫秒，但微任务首先执行，紧接着是定时器，然后是定时器内部的微任务。\n\
  \n关于微任务（包括所有 Promise 处理程序）需要记住的最重要的一点是，它们一旦任务完成就会立即执行。这尽可能缩短了 `promise` 确定与对确定反应之间的时间，使得\
  \ Promise 适用于对运行时性能要求的场景。\n\n## 创建新的（未确定的）Promise\n\n新的 Promise 使用 `Promise` 构造函数创建。该构造函数接受一个参数：一个称为\
  \ `executor`（执行器）的函数，它包含了初始化 `promise` 的代码。`executor` 接收两个命名为 `resolve()` 和 `reject()`\
  \ 的函数作为参数。当 `executor` 成功完成时，你调用 `resolve()` 函数来指示 `promise` 已解析，或者调用 `reject()`\
  \ 函数指示操作已失败。\n\n这里有一个使用旧版 `XMLHttpRequest` 浏览器 API 的示例：\n\n```javascript\n// 浏览器示例\n\
  function requestURL ( url ) {\n    return new Promise (( resolve , reject ) => {\n\
  \n        const xhr = new XMLHttpRequest ();\n\n        // 分配事件处理器\n        xhr\
  \ .addEventListener ( “load” , () => {\n            resolve ({\n               \
  \ status : xhr .status ,\n                text : xhr . responseText\n          \
  \  });\n        });\n\n        xhr . addEventListener ( “error” , error => {\n \
  \           reject ( error );\n        });\n\n        // 发送请求\n        xhr . open\
  \ ( “get” , url );\n        xhr . send ();\n    });\n}\n\nconst promise = requestURL\
  \ ( “books.json” );\n\n// 监听成功和拒绝\npromise .then ( response => {\n    // 成功\n  \
  \  console . log ( response .status );\n}, error => {\n    // 拒绝\n    console .\
  \ log ( error );\n });\n```\n\n在此示例中，`XMLHttpRequest` 对象被封装在 `promise` 中。在 `xhr`\
  \ 请求完成之前，`promise` 保持未确定状态。如果 `load` 事件触发，将调用 `resolve()` 并传入响应数据。如果 `error` 事件触发，将调用\
  \ `reject()`。\n\n执行器的一个重要方面是是它们在被创建时就会立即运行。例如，考虑一下在 `executor` 内部调用 `resolve()`\
  \ 会发生什么：\n\n```javascript\nconst promise = new Promise (( resolve , reject ) =>\
  \ {\n    console . log ( “Executor” );\n    resolve ( 42 );\n});\n\npromise .then\
  \ ( result => {\n    console . log ( result );\n});\n\nconsole . log ( “Hi!” );\n\
  ```\n\n在这里，`promise` 立即解析，尽管添加了成功处理函数，但输出将是：\n\nExecutor\nHi!\n42\n\n`executor`\
  \ 先运行，输出“Executor”。接下来分配了成功处理函数，但在脚本任务完成之前它不会执行。一个 `promise` 只能解析一次，因此如果你在 `executor`\
  \ 内部多次调用 `resolve()`，则第一次调用之后的每次调用都会被忽略。\n\n### 执行器错误\n\n如果在 `executor` 内部抛出错误，则会调用\
  \ `promise` 的拒绝处理函数。例如：\n\n```javascript\nconst promise = new Promise (( resolve\
  \ , reject ) => {\n    throw new Error ( “Uh oh!” );\n});\n\npromise .catch ( reason\
  \ => {\n    console . log ( reason .message );\n});\n```\n\n在段代码中，`executor` 故意抛出一个错误。每个\
  \ `executor` 内部都有一个隐式的 `try-catch`，以便错误被捕获并传递给拒绝处理函数。上一个示例等同于：\n\n```javascript\n\
  const promise = new Promise (( resolve , reject ) => {\n    try {\n        throw\
  \ new Error ( “Uh oh!” );\n    } catch ( ex ) {\n        reject ( ex );\n    }\n\
  });\n```\n\n`executor` 会捕获所有抛出的错误以简化这种常见用例，并且与其他拒绝的情况一样，如果没有分配拒绝处理函数，JavaScript\
  \ 引擎将抛出错误并停止执行。\n\n## 创建已定的 Promise\n\n由于 Promise 执行器行为的动态性，`Promise` 构造函数是创建未确定\
  \ Promise 的最佳方法。但如果你希望 `promise` 表示一个预先计算的值，那么创建一个仅仅将值传递给 `resolve()` 或 `reject()`\
  \ 函数的执行器就没有意义。相反，有两种方法可以根据特定值创建已定的 Promise。\n\n使用 `Promise.resolve()`\n\n\n\n\n\n\
  `Promise.resolve()` 方法接受一个参数并返回一个处于已履行（fulfilled）状态的 promise。这意味着如果你已经知道了 promise\
  \ 的值，就不需要执行器（executor）。例如：\n\n```javascript\nconst promise = Promise.resolve(42);\n\
  promise.then(value => {\n    console.log(value); // 42\n});\n```\n\n这段代码创建了一个已履行的\
  \ promise，因此履行处理程序接收到的 `42` 作为 `value`。与本章中的其他示例一样，履行处理程序会在当前脚本任务完成后作为微任务（microtask）执行。如果为此\
  \ promise 添加了拒绝处理程序（rejection handler），该处理器永远不会被调用，因为 promise 永远不会处于拒绝（rejected）状态。\n\
  \n如果你向 `Promise.resolve()` 传递一个 promise，该函数将返回你传递的同一个 promise。例如：\n\n```javascript\n\
  const promise1 = Promise.resolve(42);\nconst promise2 = Promise.resolve(promise1);\n\
  console.log(promise1 === promise2); // true\n```\n\n### 使用 Promise.reject()\n\n\
  你也可以使用 `Promise.reject()` 方法创建被拒绝的 promise。它的工作方式与 `Promise.resolve()` 类似，但创建的 promise\
  \ 处于拒绝状态，如下：\n\n```javascript\nconst promise = Promise.reject(42);\npromise.catch(reason\
  \ => {\n    console.log(reason); // 42\n});\n```\n\n添加到此 promise 的任何额外拒绝处理程序都会被调用，但履行处理程序不会，因为\
  \ promise 永远不会处于已履行状态。\n\n如果你向 `Promise.resolve()` 或 `Promise.reject()` 方法任其一传递\
  \ promise，返回的 promise 将不经过任何修改。\n\n### 非 Promise 的 Then 对象 (Thenables)\n\n`Promise.resolve()`\
  \ 和 `Promise.reject()` 也接受非 promise 的 thenable（具有 then 方法的对象）作为参数。当传递非 promise 的\
  \ thenable 时，这些方法会创建一个在 `then()` 函数之后被调用的新 promise。\n\n当一个对象拥有 `then()` 方法且该方法接受\
  \ `resolve` 和 `reject` 参数时，就会创建一个非 promise 的 thenable：\n\n```javascript\nconst thenable\
  \ = {\n    then(resolve, reject) {\n        resolve(42);\n    }\n};\n```\n\n此示例中的\
  \ thenable 对象除了 `then()` 方法外，没有与 promise 相关的其他特征。你可以调用 `Promise.resolve()` 将 thenable\
  \ 转换为已履行的 promise：\n\n```javascript\nconst thenable = {\n    then(resolve, reject)\
  \ {\n        resolve(42);\n    }\n};\nconst promise = Promise.resolve(thenable);\n\
  promise.then(value => {\n    console.log(value); // 42\n});\n```\n\n在此示例中，`Promise.resolve()`\
  \ 调用了 `thenable.then()`以便确定 promise 的状态。`thenable` 的 promise 状态是已履行的，因为在 `then()`\
  \ 方法内部调用了 `resolve(42)`。创建了一个名为 `promise` 的新 promise，它处于已履行状态，其值是从 `thenable` 传递的（即\
  \ `42`），`promise` 的履行处理程序接收到的 `42` 作为值。\n\n相同的的过程也可以用于 `Promise.resolve()` 从 thenable\
  \ 创建被拒绝的 promise：\n\n```javascript\nconst thenable = {\n    then(resolve, reject)\
  \ {\n        reject(42);\n    }\n};\nconst promise = Promise.resolve(thenable);\n\
  promise.catch(value => {\n    console.log(value); // 42\n});\n```\n\n此示例与上一个相似，不同之处在于\
  \ `thenable` 被拒绝了。当 `thenable.then()` 执行时，会创建一个处于拒绝状态的新 promise，其值为 `42`。该值随后被传递给\
  \ `promise` 的拒绝处理程序。\n\n`Promise.resolve()` 和 `Promise.reject()` 正是这样工作，允许你轻松地处理非\
  \ promise 的 thenable。在 2015 年 promise 引入之前，许多库都使用 thenable，因此将 thenable 转换为正式 promise\
  \ 的能力对于与现有库的向后兼容非常重要。当你不确定一个对象是否为 promise 时，将该对象通过 `Promise.resolve()` 或 `Promise.reject()`（取决于你的预期结果）是查找结果的最佳方法，因为\
  \ promise 只会原样通过。\n\n# 总结\n\npromise 是一个值的值的占位符，该值以后可能会作为某些异步操作的结果提供。与其向函数分配事件处理器或向函数传递回调函数，不如使用\
  \ promise 来表示操作的结果。\n\nPromise 有三种状态：等待中（pending）、已履行（fulfilled）和被拒绝（rejected）。promise\
  \ 起于等待中（未稳定）状态，并在执行成功时变为已履行，在失败时变为被拒绝（履行和拒绝都是已稳定状态）。在任何情况下，都可以添加处理器来指示 promise 何时变为稳定。`then()`\
  \ 方法允许你分配一个履行处理器和一个拒绝处理器；`catch()` 方法允许你只分配一个拒绝处理器；`finally()` 方法允许你分配一个无论结果如何都会被调用的稳定状态处理程序。所有\
  \ promise 处理器都作为微任务运行，因此它们在当前脚本任务完成之前不会执行。\n\n你可以使用 `Promise` 构造函数创建新的等待中 promise，该构造函数接受一个执行器函数作为唯一参数。执行器函数被传递\
  \ `resolve()` 和 `reject()` 函数，你使用这些函数来指示 promise 的成功或失败。执行器在 promise 创建时立即运行，这与作为微任务运行的处理器不同。在执行器中抛出的任何错误都会被自动捕获并传递给\
  \ `reject()`。\n\n可以使用 `Promise.resolve()` 创建已履行的 promise，使用 `Promise.reject()` 创建被拒绝的\
  \ promise。每种方法都会将它的参数包装在 promise 中（如果它不是 promise），创建一个新 promise（对于非 promise thenable），或者透传任何现有\
  \ promise。这些方法在你不确定值是否为 promise 但希望它像 promise 时非常有用。\n\n虽然创建单个 promise 是处理 JavaScript\
  \ 中异步操作的一种实用有效的方法，但 promise 在链在一起时允许有趣的组合。在下一章中，你将学习 处理器如何创建 promise 链以及为什么这很有价值。\n\
  \n# 2. Promise 链\n\n到目前为止，promise 似乎只是对使用回调和 `setTimeout()` 函数的选择性改进，但 promise 远比看到的复杂。具体来说，有许多方法可以链\
  \ promise 以实现更多的异步行为。\n\n每次调用实际上都会创建并返回另一个 promise。第二个 promise 只有在第一个履行或被拒绝后才会稳定。考虑这个示例：\n\
  \n```javascript\nconst promise = Promise.resolve(42);\npromise.then(value => {\n\
  \    console.log(value);\n}).then(() => {\n    console.log(\"Finished\");\n});\n\
  ```\n\n代码输出：\n\n```\n42\nFinished\n```\n\n`promise.then()` 调用返回第二个 promise，并在上面调用\
  \ `then()`。第二个 `then()` 履行处理器只有在第一个 promise 解析后才被调用。如果你解链这个示例，它看起来如下：\n\n```javascript\n\
  const promise1 = Promise.resolve(42);\nconst promise2 = promise1.then(value => {\n\
  \    console.log(value);\n});\npromise2.then(() => {\n    console.log(\"Finished\"\
  );\n});\n```\n\n在代码的未链版本中，`promise.then()` 的结果存储在 `promise2` 中，然后调用 `promise2.then()`\
  \ 来添加最后的履行处理器。`promise2.then()` 的调用也返回一个 promise。这个示例并没有使用该 promise。\n\n### 捕获错误\n\
  \nPromise 链允许你捕获在上一个 promise 的履行或拒绝处理器中可能发生的错误。例如：\n\n```javascript\nconst promise\
  \ = Promise.resolve(42);\npromise.then(value => {\n    throw new Error(\"Oops!\"\
  );\n}).catch(reason => {\n    console.error(reason.message); // \"Oops!\"\n});\n\
  ```\n\n\n\n\n\n在此段代码中，promise 的成功处理器（fulfillment handler）抛出了错误。对 `catch()` 方法的链式调用（位于第二个\
  \ promise 上）可以通过其拒绝处理器（rejection handler）接收该错误。如果拒绝处理器也抛出错误，结果也是如此：\n\n```javascript\n\
  const promise = new Promise (( resolve , reject ) => { \n    throw new Error ( “Uh\
  \ oh!” ); \n}); \npromise . catch ( reason => { \n    console . log ( reason . message\
  \ );     // “Uh oh!”\n    throw new Error ( “Oops!” ); \n}). catch ( reason => {\
  \ \n    console . error ( reason . message );   // “Oops!” \n});\n```\n\n在这里，执行器（executor）抛出一个错误，触发了\
  \ promise 的拒绝处理器。该处理器接着抛出另一个错误，该错误被第二个 promise 的拒绝处理器捕获。链式 promise 调用可以感知链中其他 promise\
  \ 的错误。\n\n你可以利用这种能力通过 promise 链来捕获错误，从而有效地实现 `try-catch` 语句的作用。考虑使用 `fetch()` 获取某些数据并想要捕获可能发生的任何错误：\n\
  \n```javascript\nconst promise = fetch ( “books.json” ); \npromise . then ( response\
  \ => { \n    console . log ( response . status ); \n}). catch ( reason => { \n \
  \   console . error ( reason . message ); \n});\n```\n\n如果 `fetch()` 调用成功，此示例将输出响应状态；如果调用失败，将输出错误信息。你可以更进一步，通过检查\
  \ `response.ok` 属性（在第 1 章讨论过）并将 200-299 范围之外的状态码作为错误处理，如果为 `false` 则抛出错误，如例所示：\n\
  \n```javascript\nconst promise = fetch ( “books.json” ); \npromise . then ( response\
  \ => { \n    if ( response . ok ) { \n        console . log ( response . status\
  \ ); \n    } else { \n        throw new Error ( `Unexpected status code: ${ response\
  \ . status } ${ response . statusText }` ); \n    } \n}). catch ( reason => { \n\
  \    console . error ( reason . message ); \n});\n```\n\n示例中的链式 `catch()` 调用创建了一个拒绝处理器，它可以捕获\
  \ `fetch()` 返回的错误，也可以捕获成功处理器中抛出的任何错误。因此，你不需要为捕获两种不同的错误准备两个不同的处理器，可以使用一个处理器来处理链中可能发生的所有错误。\n\
  \n始终在 promise 链的末尾保留一个拒绝处理器，以确保能够妥善处理可能发生的任何错误。\n\n## 在 Promise 链中使用 finally()\n\
  \n`finally()` 方法的行为与 `then()` 或 `catch()` 不同，它会将上一个 promise 的状态和值复制到它返回的 promise\
  \ 中。这意味着如果原始 promise 以某个值成功，那么 `finally()` 返回的 promise 也将以相同的值成功。例如：\n\n```javascript\n\
  const promise = Promise . resolve ( 42 ); \npromise . finally (() => { \n    console\
  \ . log ( “Finally called.” ); \n}). then ( value => { \n    console . log ( value\
  \ );         // 42 \n});\n```\n\n在这里，终结处理器（settlement handler）无法从 `promise` 接收成功的值，因此该值被复制到方法调用返回的新\
  \ promise 中。新 promise 以值 42（从 `promise` 复制）成功，因此成功处理器接收到的 42 作为参数。请记住，尽管返回的 promise\
  \ 和 `promise` 具有相同的值，但它们并不是同一个对象，如示例所示：\n\n```javascript\nconst promise1 = Promise\
  \ . resolve ( 42 ); \nconst promise2 = promise1 . finally (() => { \n    console\
  \ . log ( “Finally called.” ); \n}); \npromise2 . then ( value => { \n    console\
  \ . log ( value );         // 42 \n}); \nconsole . log ( promise1 === promise2 );\
  \ // false\n```\n\n在此段代码中，`promise1.finally()` 的返回值存储在 `promise2` 中，此时你可以判断它与 `promise1`\
  \ 不是同一个对象。`finally()` 的调用总是从原始 promise 复制状态和值。这意味着当在被拒绝的 promise 上调用 `finally()`\
  \ 时，它也会返回一个被拒绝的 promise，如示例所示：\n\n```javascript\nconst promise = Promise . reject\
  \ ( 43 ); \npromise . finally (() => { \n    console . log ( “Finally called.” );\
  \ \n}). catch ( reason => { \n    console . error ( reason );       // 43 \n});\n\
  ```\n\n示例中的 `promise` 因原因 43 被拒绝。再次，终结处理器无法访问此信息，因为它没有作为参数传递进来，相反，它返回了一个因相同原因被拒绝的新\
  \ promise。然后你可以使用 `catch()` 来获取该原因。\n\n`finally()` 工作方式的唯一例外是在终结处理器内部抛出了错误，或者返回了一个被拒绝的\
  \ promise。在一种情况下，`finally()` 返回的 promise 不会维持原始 promise 的状态和值，而是以抛出的错误为原因被拒绝。这里有一个示例：\n\
  \n```javascript\nconst promise1 = Promise . reject ( 43 ); \npromise1 . finally\
  \ (() => { \n    throw 44 ; \n}). catch ( reason => { \n    console . error ( reason\
  \ );       // 44 \n}); \nconst promise2 = Promise . reject ( 43 ); \npromise2 .\
  \ finally (() => { \n    return Promise . reject ( 44 );\n}). catch ( reason =>\
  \ { \n    console . error ( reason );       // 44 \n});\n```\n\n由于示例中终结处理器抛出了 `44`\
  \ 或返回了 `Promise.reject(44)`，返回的 promise 被 44 拒绝，因此控制台输出了 `44`。原始 promise 的状态和值丢失了。在第\
  \ 1 章中，你看到如何使用终结处理器切换应用程序的加载状态。使用 promise 链重写该示例，并结合之前的错误处理，这里有一个完整的示例：\n\n```javascript\n\
  const appElement = document .ById ( “app” ); \nconst promise = fetch ( “books.json”\
  \ ); \nappElement . classList . add ( “loading” ); \npromise . then ( response =>\
  \ { \n    if ( response . ok ) { \n        console . log ( response . status );\
  \ \n    } else { \n        throw new Error ( `Unexpected status code: ${ response\
  \ . status } ${ response . statusText }` ); \n    } \n}).finally (() => { \n   \
  \ appElement . classList . remove ( “loading” ); \n}).catch ( reason => { \n   \
  \ console . error ( reason . message ); \n});\n```\n\n与 `try-catch` 语句不同，你不希望 `finally()`\
  \ 是链的最后一部分，以防它抛出错误。因此首先调用 `then()` 来处理 `fetch()` 的响应，然后添加 `finally()` 来触发 UI 变化，最后由\
  \ `catch()` 为整个链添加错误处理器。这就是终结处理器传递之前的 promise 状态有用的地方：如果成功处理器最终抛出错误，终结处理器将传递该拒绝状态以便拒绝处理器可以访问。\n\
  \n## 在 Promise 链中返回值\n\nPromise 链的另一个重要方面是将数据从一个传递到下一个。你已经看到传递给执行器内部 `resolve()`\
  \ 处理器的值会传递给该 promise 的成功处理器。你可以通过在成功处理器中指定返回值来继续沿链传递数据。例如：\n\n```javascript\nconst\
  \ promise = Promise . resolve ( 42 ); \npromise . then ( value => { \n    console\
  \ . log ( value );         // 42 \n    return value + 1 ; \n}). then ( value =>\
  \ { \n    console . log ( value );         // 43 \n});\n```\n\n` `promise` 的成功处理器在执行时返回\
  \ `value + 1`。由于 `value` 是 42（来自执行器），成功处理器返回 43 。该值随后被传递给第二个 promise 的成功处理器，该处理器将其输出到控制台。\n\
  \n\n\n\n你也可以对拒绝处理器（rejection handler）执行相同的操作。当拒绝处理器被调用时，它可能会返回一个值。如果返回了，该值将用于解析链中的下一个\
  \ promise，如下所示：\n\n```javascript\nconst promise = Promise.reject(42);\npromise.catch(value\
  \ => {\n    // 拒绝处理器\n    console.error(value);      // 42\n    return value + 1;\n\
  }).then(value => {\n    // 成功处理处理器\n    console.log(value);        // 43\n});\n\
  ```\n\n在这里，创建了一个值为 `42` 的拒绝状态 promise。该值被传递给 promise 的拒绝处理器，并在该处返回了 `value + 1`。尽管这个返回值来自拒绝处理器，但它仍然被用于链中下一个\
  \ promise 的成功处理处理器。如果必要的话，一个 promise 的失败可以允许整个链的恢复。\n\n然而，使用 `finally()` 会导致不同的行为。从状态处理器（settlement\
  \ handler）返回的任何值都会被忽略，这样你就可以访问原始 promise 的值。这里有一个示例：\n\n```javascript\nconst promise\
  \ = Promise.resolve(42);\npromise.finally(() => {\n    // 状态处理器\n    return 43;\
  \                  // 被忽略！\n}).then(value => {\n    // 成功处理处理器\n    console.log(value);\
  \        // 42\n});\n```\n\n传递给成功处理处理器的值是 `42` 而不是 `43`。状态处理器中的 return 语句被忽略，以便可以使用\
  \ `then()` 获取原始值。这是 `finally()` 返回一个状态和值复制自原始 promise 的结果结果之一。\n\n## 在 Promise 链中返回\
  \ Promise\n\n从 promise 处理器返回原始类型值允许在 promise 之间传递数据，但如果你返回一个对象呢？如果该对象是一个 promise，那么会额外执行一步来确定如何继续。考虑以下示例：\n\
  \n```javascript\nconst promise1 = Promise.resolve(42);\nconst promise2 = Promise.resolve(43);\n\
  \npromise1.then(value => {\n    console.log(value);    // 42\n    return promise2;\n\
  }).then(value => {\n    console.log(value);    // 43\n});\n```\n\n在这段代码中，`promise1`\
  \ 解析为 `42`。`promise1` 的成功处理处理器返回了 `promise2`，这是一个已经处于解析状态的 promise。第二个成功处理处理器被调用，是因为\
  \ `promise2` 已经成功解析。如果 `promise2` 被拒绝，则会调用拒绝处理器（如果存在），而不是第二个成功处理处理器。\n\n关于这种模式需要识别到的重要点是，第二个成功处理处理器并没有被添加到\
  \ `promise2` 上，而是被第三个 promise 上，这使得上一个示例等同于此：\n\n```javascript\nconst promise1 =\
  \ Promise.resolve(42);\nconst promise2 = Promise.resolve(43);\n\nconst promise3\
  \ = promise1.then(value => {\n    console.log(value);    // 42\n    return promise2;\n\
  });\n\npromise3.then(value => {\n    console.log(value);    // 43\n});\n```\n\n\
  在这里，很明显第二个成功处理处理器是绑定在 `promise3` 而不是 `promise2` 上。这是一个微妙但重要的区别，因为如果 `promise2` 被拒绝，第二个成功处理处理器将不会被调用。例如：\n\
  \n```javascript\nconst promise1 = Promise.resolve(42);\nconst promise2 = Promise.reject(43);\n\
  \npromise1.then(value => {\n    console.log(value);    // 42\n    return promise2;\n\
  }).then(value => {\n    console.log(value);    // 永远不会被调用\n});\n```\n\n在这个示例中，第二个成功处理处理器永远不会被调用，因为\
  \ `promise2` 被拒绝了。不过，你可以附加一个拒绝处理器：\n\n```javascript\nconst promise1 = Promise.resolve(42);\n\
  const promise2 = Promise.reject(43);\n\npromise1.then(value => {\n    console.log(value);\
  \    // 42\n    return promise2;\n}).catch(value => {\n    console.error(value);\
  \      // 43\n});\n```\n\n在这里，拒绝处理器是因为 `promise2` 被拒绝而被调用。来自 `promise2` 的拒绝值 `43`\
  \ 被传递到该拒绝处理器中。\n\n当一个操作需要多个 promise 才能执行完成时，从成功处理处理器返回 promise 是很有用的。例如，`fetch()`\
  \ 需要第二个 promise 来读取响应体。要读取 JSON 响应体，你需要使用 `json()`，它返回另一个 promise。在不使用链式调用的情况下如下：\n\
  \n```javascript\nconst promise1 = fetch(\"books.json\");\npromise1.then(response\
  \ => {\n    promise2 = response.json();\n    promise2.then(payload => {\n      \
  \  console.log(payload);\n    }).catch(reason => {\n        console.error(reason);\n\
  \    });\n});\n```\n\n这段代码需要两个拒绝处理器来捕捉错误。从成功处理处理器返回第二个 promise 可以简化代码：\n\n```javascript\n\
  const promise = fetch(\"books.json\");\npromise.then(response => {\n    return response.json();\n\
  }).then(payload => {\n    console.log(payload);\n}).catch(reason => {\n    console.error(reason);\n\
  });\n```\n\n在这里，当接收响应时，第一个成功处理处理器被调用并返回一个读取体的 promise。你只需要在结尾处拒绝处理器来捕获沿中的错误。\n\n\
  使用 `finally()` 从状态处理器返回 promise 也表现出与 `then()` 或 `catch()` 不同的行为。首先，如果你从状态处理器返回一个已解析的\
  \ promise，该 promise 将被忽略而优先保留原始 promise，如示例所示：\n\n```javascript\nconst promise =\
  \ Promise.resolve(42);\npromise.finally(() => {\n    return Promise.resolve(44);\n\
  }).then(value => {\n    console.log(value);    // 42\n});\n```\n\n在这个示例中，状态处理器返回了一个带有\
  \ `44` 的 promise，但返回的 promise 使用原始值 `42` 是成功解析的。\n\n然而，如果你从状态处理器返回一个被拒绝的 promise，那么返回的\
  \ promise 将采用该原因，并且返回的 promise 将被拒绝，如下：\n\n```javascript\nconst promise = Promise.resolve(42);\n\
  promise.finally(() => {\n    return Promise.reject(43);\n}).catch(reason => {\n\
  \    console.error(reason); // 43\n});\n```\n\n即使原始 promise 被拒绝，这一点仍然成立，如下所示：\n\n\
  ```javascript\nconst promise = Promise.reject(43);\npromise.finally(() => {\n  \
  \  return Promise.reject(45);\n}).catch(reason => {\n    console.log(reason); //\
  \ 45\n});\n```\n\n从状态处理器返回被拒绝的 promise 在功能上等同于抛出错误：返回的 promise 将根据指定的原因被拒绝。\n\n\
  从成功处理或拒绝处理器返回 promise 不会改变 promise 执行器的执行顺序。第一个定义的 promise 将先运行其执行器；然后运行第二个 promise\
  \ 执行器，依此类推。返回 promise 仅仅是允许你对 promise 的结果定义额外的响应。你通过在成功处理处理器内部创建一个新的 promise 来推迟成功处理器的执行。例如：\n\
  \n```javascript\nconst p1 = Promise.resolve(42);\np1.then(value => {\n    console.log(value);\
  \    // 42\n    // 创建一个新的 promise\n    const p2 = new Promise((resolve, reject)\
  \ => {\n        setTimeout(() => {\n            resolve(43);\n        }, 500);\n\
  \    });\n    return p2;\n}).then(value => {\n    console.log(value);    // 43\n\
  });\n```\n\n\n\n\n在这个示例中，`p1` 的成功处理函数内部创建了一个新的 promise。这意味着在 `p2` 成功完成之前，第二个成功处理函数不会执行。`p2`\
  \ 的执行器通过 `setTimeout()` 延迟了 500 毫秒，但在更实际的场景中，你可能会发起网络请求或文件系统请求。当你希望等待上一个 promise\
  \ 确定（settled）后再启动一个新的异步操作时，这种模式非常有用。\n\n# 总结\n\n多个 promise 可以以各种方式链在一起，以便在它们之间传递信息。每次对\
  \ `then()`、`catch()` 和 `finally()` 的调用都会创建并返回一个新的 promise，该 promise 在前一个 promise\
  \ 确定后解析（resolved）。如果 promise 处理程序返回一个值，那么该值将成为 `then()` 和 `catch()` 创建的新 promise\
  \ 的值（`finally()` 会忽略此值）；如果 promise 处理程序抛出错误，则错误会被捕获，且返回的新 promise 将以该错误为原因被拒绝（rejected）。\n\
  \n当链中的一个 promise 被拒绝时，从其他链式处理程序创建的 promise 也会被拒绝，直到链的末尾。考虑到这一点，建议在每个 promise 链的末尾附加拒绝处理程序，以确保错误得到正确处理。未能捕获\
  \ promise 拒绝会导致控制台输出消息、抛出错误或两者兼有（取决于运行时环境）。\n\n你可以从处理程序返回 promise，在这种情况下，从 `then()`\
  \ 和 `catch()` 调用返回的 promise 的确定状态将变得与处理程序返回的 promise 的确定状态和值一致（`finally()` 返回的成功\
  \ promise 会被忽略，而拒绝的 promise 会被遵循）。你可以利用这一特性，延迟某些操作直到一个 promise 成功完成，然后启动并返回第二个 promise\
  \ 以继续使用同一个 promise 链。\n\n本章探讨了如何将多个 promise 链在一起，使它们表现得更像一个 promise。在下一章中，你将学习如何处理并行运行的多个\
  \ promise。\n\n# 3. 处理多个 promise\n\n到目前为止，书中的每个示例都处理的是一次响应一个 promise。然而，有时你可能希望监控多个\
  \ promise 的进度，以便决定下一步操作。JavaScript 提供了几种方法来监控多个 promise 并以略不同的方式对它们做出响应。本章中讨论的所有方法都允许多个\
  \ promise 并执行，然后作为一个整体进行响应，而不是逐个响应。\n\n## Promise.all() 方法\n\n`Promise.all()` 方法接受单个参数，该参数是一个要监控的\
  \ promise 可迭代器（例如数组），并返回一个只有当迭代器中的每个 promise 都已解析后才会被解析的 promise。当迭代器中的每个 promise\
  \ 都成功完成时，返回的 promise 也会成功完成，例所示：\n\n```javascript\nlet promise1 = Promise.resolve(42);\n\
  let promise2 = new Promise((resolve, reject) => {\n    resolve(43);\n});\nlet promise3\
  \ = new Promise((resolve, reject) => {\n    setTimeout(() => {\n        resolve(44);\n\
  \    }, 100);\n});\n\nlet promise4 = Promise.all([promise1, promise2, promise3]);\n\
  \npromise4.then(value => {\n    console.log(Array.isArray(value));   // true\n \
  \   console.log(value[0]);               // 42\n    console.log(value[1]);     \
  \          // 43\n    console.log(value[2]);               // 44\n});\n```\n\n这里的每个\
  \ promise 都用数字解析。对 `Promise.all()` 的调用创建了 `promise4`，它在 `promise1`、`promise2` 和\
  \ `promise3` 成功完成后最终会成功完成。传递给 `promise4` 成功处理函数的结果是一个包含每个解析值的数组：`42`、`43` 和 `44`。这些值按照\
  \ promise 传递给 `Promise.all()` 的顺序存储，因此你可以将 promise 结果与对应的 promise 相匹配。\n\n如果传递给\
  \ `Promise.all()` 的任何 promise 被拒绝，返回的 promise 将立即被拒绝，而无需等待其他 promise 完成：\n\n```javascript\n\
  let promise1 = Promise.resolve(42);\nlet promise2 = Promise.reject(43);\nlet promise3\
  \ = new Promise((resolve, reject) => {\n    setTimeout(() => {\n        resolve(44);\n\
  \    }, 100);\n});\n\nlet promise4 = Promise.all([promise1, promise2, promise3]);\n\
  \npromise4.catch(reason => {\n    console.log(Array.isArray(reason)); // false\n\
  \    console.log(reason);               // 43\n});\n```\n\n在这个示例中，第二个 promise (`promise2`)\
  \ 被以值 `43` 拒绝。`promise4` 的拒绝处理会被立即调用，而无需等待第一个 promise。\n\n## 何时使用 Promise.all()\n\
  \n当你需要等待多个 promise 成功完成，并且任何一个失败都应该导致整个操作失败时，就会使用 `Promise.all()`。\n\n### 同时处理文件\n\
  \n在使用如 Node.js 或 Deno 等服务端 JavaScript 运行时，你可能需要从多个文件中读取。在这种情况下，并行读取文件并等待它们全部读取完成是最高效的。这是一个在\
  \ Node.js 中运行的示例：\n\n```javascript\nimport { readFile } from \"node:fs/promises\"\
  ;\n\nfunction readFiles(filenames) {\n    return Promise.all(\n        filenames.map(filename\
  \ => readFile(filename, \"utf8\"))\n    );\n}\n\nreadFiles([\"file1.json\", \"file2.json\"\
  ])\n  .then(fileContents => {\n    // 解析 JSON 数据\n    const data = fileContents.map(\n\
  \        fileContent => JSON.parse(fileContent)\n    );\n    // 根据需要进行处理\n    console.log(data);\n\
  \  })\n  .catch(reason => {\n    console.error(reason.message);\n  });\n```\n\n\
  此示例使用 Node.js 基于 promise 的文件系统 API 并行读取多个文件。`readFiles()` 函数接收要读取的文件名数组，然后将每个文件名映射到导入的\
  \ `readFile()` 函数创建的 promise。文件以文本形式读取（如作为第二个参数传递的 `\"utf8\"` 编码所示），结果在成功处理函数中以\
  \ `fileContents` 数组的形式可用，其中包含每个文件的文本。从那时起，文件内容被解析为 JSON 并进入 `data` 数组，然后传递给 `processData()`\
  \ 函数。这是跨文件处理数据的常用方法，因为如果任何一个文件无法读取或解析，操作将无法正确完成并应该停止。\n\n### 调用多个依赖的 Web 服务 API\n\
  \n`Promise.all()` 的另一个常见用例是调用多个 Web 服务 API。这在 REST API 中特别为常见，因为与实体关联的种类型数据可能有其自己的端点。例如，考虑一个应用程序，每个用户都有博客文章和专辑，你可能需要在用户的个人资料中收集所有这些信息。代码可能如下：\n\
  \n\n\n\n```javascript\nconst API_BASE = \"https://jsonplaceholder.typicode.com\"\
  ;\n\nfunction fetchUserData(userId) {\n    const urls = [\n        `${API_BASE}/users/${userId}/posts`,\n\
  \        `${API_BASE}/users/${userId}/albums`\n    ];\n    return Promise.all(urls.map(url\
  \ => fetch(url)));\n}\n\nfetchUserData(1).then(responses => {\n    return Promise.all(\n\
  \        responses.map(response => {\n            if (response.ok) {\n         \
  \       return response.json();\n            } else {\n                return Promise.reject(\n\
  \                    new Error(`Unexpected status code: ${response.status} ${response.statusText}\
  \ for ${response.url}`)\n                );\n            }\n        })\n    );\n\
  }).then(([posts, albums]) => {\n    // process your data as necessary\n    console.log(posts);\n\
  \    console.log(albums);\n}).catch(reason => console.error(reason.message));\n\
  ```\n\n此示例使用了 `JSONPlaceholder` 服务，这是一个用于测试和原型设计的免费模拟 API。给定一个特定的用户 ID，`JSONPlaceholder`\
  \ 将生成模拟数据。在这种情况下，代码对每个用户使用了 `/posts` 和 `/albums` 端点。`fetchUserData()` 函数接收一个用户 ID\
  \ 并生成调用的 URL。然后，将这些 URL 映射到每个 `fetch()` 调用返回的 promise。当获取到响应时，会使用另一个 `Promise.all()`\
  \ 调用将每个响应映射到另一个 promise：如果响应状态在 200-299 范围内，则返回 JSON 体；否则返回被拒绝的 promise（这将导致整个操作短路并调用拒绝处理程序）。在最后一个结算处理程序中，`posts`\
  \ 和 `albums` 数据可供处理。\n\n## 创建人工延迟\n\n`Promise.all()` 的一个不常见场景是你希望延迟某些操作发生得太快。这种情况在浏览器端比在服务器端更有可能发生，因为在服务器端，你有时需要在用户操作和响应之间设置微小的延迟。例如，当从服务器获取数据时，你可能希望显示一个加载指示器，但如果响应太快，用户可能看不到加载旋转动画，从而不知道屏幕上的数据是最新的。在这种情况下，你可以引入一个人工延迟，如下所示：\n\
  \n```javascript\nconst API_BASE = \"https://jsonplaceholder.typicode.com\";\nconst\
  \ appElement = document.getElementById(\"app\");\n\nfunction delay(milliseconds)\
  \ {\n    return new Promise(resolve => {\n        setTimeout(() => {\n         \
  \   resolve();\n        }, milliseconds);\n    });\n}\n\nfunction fetchUserData(userId)\
  \ {\n    appElement.classList.add(\"loading\");\n\n    const urls = [\n        `${API_BASE}/users/${userId}/posts`,\n\
  \        `${API_BASE}/users/${userId}/albums`\n    ];\n\n    return Promise.all([\n\
  \        ...urls.map(url => fetch(url)),\n        delay(1500)\n    ]).then(results\
  \ => {\n        // 移除 delay() 产生的 undefined 结果\n        return results.slice(0,\
  \ results.length - 1);\n    });\n}\n\nfetchUserData(1).then(responses => {\n   \
  \ return Promise.all(\n        responses.map(response => {\n            if (response.ok)\
  \ {\n                return response.json();\n            } else {\n           \
  \     return Promise.reject(\n                    new Error(`Unexpected status code:\
  \ ${response.status} ${response.statusText} for ${response.url}`)\n            \
  \    );\n            }\n        })\n    );\n}).then(([posts, albums]) => {\n   \
  \ // process your data as necessary\n    console.log(posts);\n    console.log(albums);\n\
  }).finally(() => {\n    appElement.classList.remove(\"loading\");\n}).catch(reason\
  \ => console.error(reason.message));\n```\n\n这段代码在之前示例的基础上，通过在每个 `fetch()` 调用中引入延迟来实现。`delay()`\
  \ 函数返回一个在指定的毫秒数后解析（resolve）的 promise。它使用原生的 `setTimeout()` 函数并传递一个调用 `resolve()`\
  \ 的回调函数来实现。请注意，在这种情况下不需要向 `resolve()` 传递任何值，因为存在相关数据。你也可以将 `resolve` 作为 `setTimeout()`\
  \ 的第一个参数；但是，某些 JavaScript 运行时会向超时函数传递参数。为了在不同运行时之间获得最佳兼容性，最好在另一个函数内部调用 `resolve()`。\n\
  \n`fetchUserData()` 函数为指定的用户 ID 发起网络服务请求。与上一节的示例一样，使用 `Promise.all()` 来监控多个 `fetch()`\
  \ 请求，但在本示例中，传递给 `Promise.all()` 的数组中还包含了对 `delay()` 的调用。当返回的 promise 完成时，完成处理程序将接收包含所有结果的数组，其中最后一个元素为\
  \ undefined。在从 `fetchUserData()` 返回之前，删除了最后一个元素，这样调用 `fetchUserData()` 的代码就不需要感知\
  \ `delay()` 的调用。应用元素上添加了 CSS 类 `loading` 以表示数据正在检索，并在接收到响应后由结算处理程序将其移除。\n\n你刚刚学习了\
  \ `Promise.all()` 作为最佳解决方案的用例。但如果你希望即使一个 promise 被拒绝（rejected），你的操作仍然继续，该怎么办？这时\
  \ `Promise.allSettled()` 将是更好的选择。\n\n## Promise.allSettled() 方法\n\n`Promise.allSettled()`\
  \ 方法是 `Promise.all()` 的微变版本，它会等待直到指定迭代器中的所有 promise 都结算（settled），无论它们是完成（fulfilled）还是拒绝（rejected）。`Promise.allSettled()`\
  \ 的返回值始终是一个解析为结果对象数组的 promise。\n\n完成的 promise 的结果对象有两个属性：\n- `status`: 始终设置为 `fulfilled`\n\
  - `value`: promise 的完成值\n\n对于拒绝的 promise，结果对象中也有两个属性：\n- `status`: 始终设置为 `rejected`\n\
  - `reason`: promise 的拒绝值\n\n你可以使用返回的结果对象数组来确定每个 promise 的结果。\n\n```javascript\n\
  let promise1 = Promise.resolve(42);\nlet promise2 = Promise.reject(43);\nlet promise3\
  \ = new Promise((resolve, reject) => {\n    setTimeout(() => {\n        resolve(44);\n\
  \    }, 100);\n});\n\nlet promise4 = Promise.allSettled([promise1, promise2, promise3]);\n\
  \npromise4.then(results => {\n    console.log(Array.isArray(results)); // true\n\
  \    console.log(results[0].status); // \"fulfilled\"\n    console.log(results[0].value);\
  \ // 42\n    console.log(results[1].status); // \"rejected\"\n    console.log(results[1].reason);\
  \ // 43\n    console.log(results[2].status); // \"fulfilled\"\n    console.log(results[2].value);\
  \ // 44\n});\n```\n\n即使第二个 promise (`promise2`) 是一个拒绝的 promise，`Promise.allSettled()`\
  \ 的调用也会返回一个解析为结果对象数组的 promise。你随后可以通过这些结果对象来确定每个 promise 的结果。\n\n## 何使用 Promise.allSettled()\n\
  \n`Promise.allSettled()` 方法可以在许多与 `Promise.all()` 相似的场景中使用；但是，它最适用于希望忽略拒绝、以方式处理拒绝或允许部分成功的情况。以下是\
  \ `Promise.allSettled()` 的常见用例：\n\n### 分别处理多个文件\n\n\n\n\n在讨论 `Promise.all()` 时，你可能看到了一个处理相互依赖、必须全部成功的多个文件的示例。在某些情况下，分别处理多个文件意味着即使其中一个操作失败，你也不需要停止整个操作；你可以继续完成成功的操作，然后记录失败的操作以便稍后重试。这里有一个\
  \ Node.js 的示例：\n\n```javascript\nimport { readFile, writeFile } from \"node:fs/promises\"\
  ;\n\n// 或对文件进行任何操作\nfunction transformText(text) {\n    return text.split(\"\").reverse().join(\"\
  \");\n}\n\nfunction transformFiles(filenames) {\n    return Promise.allSettled(\n\
  \        filenames.map(filename =>\n            readFile(filename, \"utf8\")\n \
  \               .then(text => transformText(text))\n                .then(newText\
  \ => writeFile(filename, newText))\n                .catch(reason => {\n       \
  \             reason.filename = filename;\n                    return Promise.reject(reason);\n\
  \                })\n        )\n    );\n}\n\ntransformFiles([\"file1.txt\", \"file2.txt\"\
  ]).then(results => {\n    // 获取失败的结果\n    const failedResults = results.filter(\n\
  \        result => result.status === \"rejected\"\n    );\n\n    if (failedResults.length)\
  \ {\n        console.error(\"以下文件未成功转换:\");\n        console.error(\"\");\n    \
  \    failedResults.forEach(failedResult => {\n            console.error(failedResult.reason.filename);\n\
  \            console.error(failedResult.reason.message);\n            console.error(\"\
  \");\n        });\n    } else {\n        console.log(\"所有文件转换成功.\");\n    }\n});\n\
  ```\n\n这个示例读取了一系列文件，反转文件中内容的顺序，然后将文本写回原始文件（当然，你可以将 `transformText()` 替换为任何你的操作）。`transformFiles()`\
  \ 函数接收一个 `filenames` 数组，读取文件内容，转换文本，并将转换后的文本写回文件。Promise 链代表了过程中的每一步，而拒绝处理器在任何拒绝原因中添加了\
  \ `filename` 属性，以便在事后更容易地解释结果。\n\n当所有文件的操作完成后，会对结果进行过滤，以找到任何转换未成功完成的文件，并将这些结果输出到控制台。在生产系统中，你可能会将失败的结果输入到监控系统或队列中，以尝试重新转换。\n\
  \n### 调用多个独立的 Web 服务 API\n\n`Promise.all()` 部分的另一个示例是调用多个希望所有请求都成功的 Web 服务 API。如果你不需要所有请求都成功，那么可以使用\
  \ `Promise.allSettled()`。回到之前的示例，如果即使在部分数据缺失的情况下，仍然可以显示用户个人资料页，那么请使用 `Promise.allSettled()`\
  \ 代替 `Promise.all()`，以避免向用户显示错误。例如：\n\n```javascript\nconst API_BASE = \"https://jsonplaceholder.typicode.com\"\
  ;\n\nfunction fetchUserData(userId) {\n    const urls = [\n        `${API_BASE}/users/${userId}/posts`,\n\
  \        `${API_BASE}/users/${userId}/albums`,\n        `${API_BASE}/users/${userId}/extras`\n\
  \    ];\n    return Promise.allSettled(urls.map(url => fetch(url)))\n        .then(results\
  \ => results.map(result => result.value));\n}\n\nfetchUserData().then(responses\
  \ => {\n    return Promise.all(\n        responses.map(response => {\n         \
  \   if (response?.ok) {\n                return response.json();\n            }\n\
  \        })\n    );\n}).then(([posts, albums, extras]) => {\n    // 根据需要处理你的数据\n\
  \    if (posts) {\n        console.log(\"Posts\");\n        console.log(posts);\n\
  \    }\n    if (albums) {\n        console.log(\"Albums\");\n        console.log(albums);\n\
  \    }\n    if (extras) {\n        console.log(\"Extras\");\n        console.log(extras);\n\
  \    }\n}).catch(reason => console.error(reason.message));\n```\n\n在这个示例版本中，`fetchUserData()`\
  \ 函数使用 `Promise.allSettled()` 代替 `Promise.all()`，以确保拒绝可以被忽略。此示例还调用了第三个端点 `/users/{userId}/extras`，该端点并不会导致返回\
  \ 404（出于演示目的）。一旦所有请求完成，成功处理器会将每个结果映射到其 `value` 属性，这确保了任何拒绝的 Promise 都映射为 `undefined`，而已完成的\
  \ Promise 则映射到 `fetch()` 返回的响应对象。由于 `response` 可能是 `undefined`，因此你需要在检查 `ok` 属性之前检查\
  \ `response` 是否为真。然后读取每个有效响应的 JSON 体，并由最后一个成功处理器读取这些数据。无法保证请求的每项数据都存在（在本文示例中 `extras`\
  \ 将是 `undefined`），因此你需要在处理每个值之前检查该值是否存在。\n\n### 等待动画完成\n\n在网页中，元素可以以多种不同的方式进行动画处理。例如，你可以让元素从页面底部向上移动，同时让其宽度和高度增加，以使元素进入视野。在这些情况下，等待所有动画完成后再对元素或页面进行下一次修改是有帮助的。在《构建\
  \ toast 组件》（Building a toast component）一文中，Adam Argyle 解释了跟踪 DOM 元素动画完成的基本方法。我在这里重写了代码以以便理解：\n\
  \n```javascript\nfunction waitForAnimations(element) {\n    return Promise.allSettled(\n\
  \        element.getAnimations().map(animation => animation.finished)\n    );\n\
  }\n\nconst toasterElement = document.getElementById(\"toaster\");\nwaitForAnimations(toasterElement).then(()\
  \ => console.log(\"Toaster is done.\"));\n```\n\n在这种，你并不关心过程中是否有任何动画失败，也不关心从动画中接收任何完成的值，因此\
  \ `Promise.allSettled()` 比 `Promise.all()` 更合适的选择。`getAnimations()` 方法返回一个对象数组，每个对象都有一个\
  \ `finished` 属性，该属性包含一个在动画完成后解析的 Promise。通过将这些 Promise 传递给 `Promise.allSettled()`，将在所有动画完成后收到通知。由于\
  \ `Promise.allSettled()` 永远不会返回拒绝的 Promise，你只需要附加一个成功处理器，而不必担心任何未捕获的拒绝错误。\n\n##\
  \ Promise.any() 方法\n\n`Promise.any()` 方法也接受 Promise 的可迭代对象，并在传入的 Promise 中任何一个完成时返回一个已完成的\
  \ Promise。一旦其中一个 Promise 完成，操作就会短路。（这与 `Promise.all()` 相反，后者在其中一个 Promise 被拒绝时操作就会短路。）这里有一个示例：\n\
  \n```javascript\nlet promise1 = Promise.reject(43);\n\nlet promise2 = Promise.resolve(42);\n\
  \nlet promise3 = new Promise((resolve, reject) => {\n    setTimeout(() => {\n  \
  \      resolve(44);\n    }, 100);\n});\n\nlet promise4 = Promise.any([promise1,\
  \ promise2, promise3]);\n\npromise4.then(value => console.log(value));\n```\n\n\n\
  \n尽管此示例中的第一个 promise (`promise1`) 被拒绝（rejected），但 `Promise.any()` 的调用仍然成功了，因为第二个\
  \ promise (`promise2`) 已完成（fulfilled）。第三个 promise (`promise3`) 的结果被丢弃了。\n\n如果传递给\
  \ `Promise.any()` 的所有 promise 都被拒绝，则返回的 promise 将会被 `AggregateError` 被拒绝。`AggregateError`\
  \ 是一种表示存储在 `errors` 属性中的多个错误的错误。例如：\n\n```javascript\nlet promise1 = Promise.reject(43);\n\
  let promise2 = new Promise((resolve, reject) => {\n    reject(44);\n});\nlet promise3\
  \ = new Promise((resolve, reject) => {\n    setTimeout(() => {\n        reject(45);\n\
  \    }, 100);\n});\n\nlet promise4 = Promise.any([promise1, promise2, promise3]);\n\
  \npromise4.catch(reason => {\n    // Runtime dependent error message\n    console.log(reason.message);\n\
  \n    // output rejection values\n    console.log(reason.errors[0]);   // 43\n \
  \   console.log(reason.errors[1]);   // 44\n    console.log(reason.errors[2]); \
  \  // 45\n});\n```\n\n在这里，`Promise.any()` 接收到的 promise 都没有完成，因此返回的 promise 被 `AggregateError`\
  \ 拒绝。你可以检查 `errors` 属性（它是一个数组），以获取每个 promise 的拒绝值。\n\n## 何时使用 Promise.any()\n\n\
  当你希望 promise 中的**任何一个**完成时，使用 `Promise.any()` 是最佳的，并且你不在乎其他有多少个 promise 被拒绝，除非它们全部被拒绝。以下是一些你可能想要使用\
  \ `Promise.any()` 的场景。\n\n### 执行对冲请求 (Hedged Requests)\n\n根据《规模化后端》（The Tail at\
  \ Scale）中的定义，对冲请求（hedged request）是指客户端向多个服务器发送请求，并接受第一个响应的响应。这在客户端需要尽可能低的延迟，并且有服务器资源用于管理额外负载和响应去重的情况下非常有帮助。这是一个示例：\n\
  \n```javascript\nconst HOSTS = [\n    \"api1.example.com\",\n    \"api2.example.com\"\
  \n];\n\nfunction hedgedFetch(endpoint) {\n    return Promise.any(\n        HOSTS.map(hostname\
  \ => fetch(`https://${hostname}${endpoint}`))\n    );\n}\n\nhedgedFetch(\"/transactions\"\
  )\n    .then(transactions => console.log(transations))\n    .catch(reason => console.error(reason.message));\n\
  ```\n\n此示例维护了一个主机数组，每个对冲请求都应该调用这些主机。`hedgedFetch()` 函数根据这些主机名创建一个 `fetch()` 请求的数组，并将该数组传递给\
  \ `Promise.any()`。对于 `hedgedFetch()` 的使用者来说，看起来就像只发送了一个请求，尽管尽管在后台有多个请求在进行。这允许使用者只使用一个完成处理器和一个拒绝处理器来处理结果。如果任何一个请求失败了，使用者也永远感知不到；只有当所有请求都失败时，才会调用拒绝处理器。\n\
  \n### 在 Service Worker 中使用快速响应\n\n使用 service worker 的 Web 页面通常可以选择从哪里加载数据：网络或缓存。在某些情况下，网络请求实际上可能比从缓存加载更快，因此你可能想使用\
  \ `Promise.any()` 来选择更快的响应。以下是类 service worker 内部演示这种模式的代码：\n\n```javascript\nself.addEventListener(\"\
  fetch\", event => {\n    // 获取缓存响应\n    const cachedResponse = caches.match(event.request);\n\
  \n    // 获取新响应\n    const fetchedResponse = fetch(event.request.url);\n\n    //\
  \ 使用最佳选项响应\n    event.respondWith(\n        Promise.any([\n            fetchedResponse.catch(()\
  \ => cachedResponse),\n            cachedResponse,\n        ])\n        .then(response\
  \ => response ?? fetchedResponse)\n        .catch(() => {})\n    );\n});\n```\n\n\
  `fetch` 事件监听器允许你监听网络请求并拦截响应。这个 service worker 示例使用 `fetch` 事件监听器同时从缓存（使用 `caches.match()`）和网络（使用\
  \ `fetch()`）读取内容。`caches.match()` 的调用返回一个解析为缓存响应或 `undefined` 的 promise。`fetch()`\
  \ 返回一个解析为网络响应的 promise。`Promise.any()` 方法确保使用第一个解析（resolve）的 promise。如果网络请求失败，`catch(()\
  \ => cachedResponse)` 确保了使用 `cachedResponse`。如果两者都失败，`Promise.any()` promise 将被拒绝。\n\
  \n## Promise.race() 方法\n\n`Promise.race()` 方法为监控 promise 提供了一种稍不同的视角。该方法也接受一个 promise\
  \ 迭代器，并在任何 promise 稳定（settled）时立即返回一个 promise。它不像 `Promise.all()` 那样等待所有 promise，也不像\
  \ `Promise.any()` 那样仅对第一个完成的进行短路，`Promise.race()` 返回第一个状态定的结果。例如：\n\n```javascript\n\
  let promise1 = Promise.resolve(42);\nlet promise2 = new Promise((resolve, reject)\
  \ => {\n    reject(43);\n});\nlet promise3 = new Promise((resolve, reject) => {\n\
  \    setTimeout(() => {\n        resolve(44);\n    }, 100);\n});\n\nlet promise4\
  \ = Promise.race([promise1, promise2, promise3]);\n\npromise4.then(value => console.log(value));\n\
  ```\n\n在此代码中，第一个 promise (`promise1`) 被创建为一个完成的 promise，而其他的在调度任务。`promise4` 的完成处理器将带有值\
  \ 42 被调用并忽略其他的。传递给 `Promise.race()` 的 promise 真正在竞争看哪个先稳定。如果第一个稳定的 promise 是完成的，则返回的\
  \ promise 是完成的；如果第一个稳定的 promise 是被拒绝的，则返回的 promise 是被拒绝的。这里有一个包含拒绝的示例：\n\n```javascript\n\
  let promise1 = new Promise((resolve, reject) => {\n    setTimeout(() => {\n    \
  \    resolve(42);\n    }, 100);\n});\nlet promise2 = new Promise((resolve, reject)\
  \ => {\n    reject(43);\n});\nlet promise3 = new Promise((resolve, reject) => {\n\
  \    setTimeout(() => {\n        resolve(44);\n    }, 50);\n});\n\nlet promise4\
  \ = Promise.race([promise1, promise2, promise3]);\n\npromise4.catch(reason => console.log(reason));\n\
  ```\n\n\n\n\n`Promise.race()` 方法最适用于你希望短路多个不同 promise 完成情况的场景。与 `Promise.any()`\
  \ 不同——在后者你明确希望其中一个 promise 成功，并且只关心所有 promise 是否都失败——而在 `Promise.race()` 中，只要某个\
  \ promise 在任何其他 promise 完成之前失败，即使它失败了，你也想知道结果。以下是一些你可能想要使用 `Promise.race()` 的场景。\n\
  \n### 为操作建立超时\n\n虽然 `fetch()` 函数有很多实用的功能，但它没有做的一点是管理给定请求的超时；请求会一直挂起，直到请求以某种方式完成为止。你可以使用\
  \ `Promise.race()` 轻松地创建一个包装方法，为任何请求添加超时：\n\n```javascript\nfunction timeout(milliseconds)\
  \ {\n  return new Promise((resolve, reject) => {\n    setTimeout(() => {\n     \
  \ reject(new Error(\"Request timed out.\"));\n    }, milliseconds);\n  });\n}\n\n\
  function fetchWithTimeout(...args) {\n  return Promise.race([\n    fetch(...args),\n\
  \    timeout(5000)\n  ]);\n}\n\nconst API_URL = \"https://jsonplaceholder.typicode.com/users\"\
  ;\n\nfetchWithTimeout(API_URL)\n  .then(response => response.json())\n  .then(users\
  \ => console.log(users))\n  .catch(reason => console.error(reason.message));\n```\n\
  \n`timeout()` 函数与本章之前创建的 `delay()` 函数类似，区别在于它在延迟后调用 `reject()` 而不是 `resolve()`。在这种情况下，延迟代表错误条件，因为你希望在请求时间超过预期（在本例中为\
  \ `5000` 毫秒）时收到通知。`fetchWithTimeout()` 函数将 `fetch()` 和 `timeout()` 放入数组中传递给 `Promise.race()`。如果\
  \ `fetch()` 的调用时间超过超时，返回的 promise 将被拒绝，这样你就可以适当地处理失败。\n\n请记住，尽管 `fetchWithTimeout()`\
  \ 会在请求时间超过指定的超时时被拒绝，但请求并不会取消。它仍会在后台继续等待响应，尽管该响应会被忽略。\n\n# 总结\n\n当你需要同时监控并响应多个 promise\
  \ 时，JavaScript 提供了几种方法。每种方法的行为略有不同，但都允许你并行运行 promise 并作为一个整体对它们做出响应：\n\n* `Promise.all()`\
  \ - 当所有 promise 都完成时，返回的 promise 成功；当任何 promise 被拒绝时，返回的 promise 被拒绝。\n* `Promise.allSettled()`\
  \ - 返回的 promise 总是通过一个包含 promise 结果的数组完成，返回的 promise 永远不会拒绝。\n* `Promise.any()`\
  \ - 当第一个 promise 完成时，返回的 promise 成功；当所有 promise 都被拒绝时，返回的 promise 被拒绝。\n* `Promise.race()`\
  \ - 当第一个完成（settle）的 promise 完成时，返回的 promise 成功；当第一个完成的被拒绝时，返回的 promise 被拒绝。\n\n\
  这些方法适用于不同的用例，取决于你在任何情况下决定哪种是合适的。\n\n# 4. Async 函数和 await 表达式\n\nJavaScript promises\
  \ 被设计为一种底层工具，可以由高级语言特性在后台使用。async 函数（async functions）正是这样一种高级语言特性，它使得使用 promise\
  \ 的编程与不使用 promise 的编程更加相似。与其担心跟踪 promise 及其各种处理器，async 函数 抽象了 promise。最终结果是遵循熟悉的自上而下顺序的代码。\n\
  \n在深入了解 async 函数的工作原理之前，了解它们是如何定义的会有帮助。\n\n我使用“async 函数”一术语来描述函数以及出现在对象或类的方法。每当使用该术语时，你都可以假设我说的话也适用于异步方法，除非另有说明。\n\
  \n### 定义 async 函数\n\nasync 函数可以像同步函数一样在任何地方使用。为了使其变为异步，你需要在函数或方法前添加 `async` 关键字。这意味着函数是异步的。以下是一些示例：\n\
  \n```javascript\n// 函数声明\nasync function doSomething() {\n  // body\n}\n\n// 箭头函数\n\
  const doSomething = async () => {\n  // body\n};\n\n// 箭头函数\nconst doSomethingElse\
  \ = async () => {\n  // body\n};\n\n// 对象方法\nconst object = {\n  async doSomething()\
  \ {\n    // body\n  }\n};\n\n// 类方法\nclass MyClass {\n  async doSomething() {\n\
  \    // body\n  }\n}\n```\n\n### async 函数的不同之处\n\nasync 函数与同步函数的区别有以下四点：\n1. 返回值总是\
  \ promise\n2. 抛出的错误是 promise 拒绝\n3. 可以使用 `await` 表达式\n4. 可以使用 `for-of` 循环\n\n这些方面使得\
  \ async 函数与同步函数非常不同，因此值得详细介绍每一点。\n\n### 返回值总是 promise\n\n你可以像在同步函数中使用 `return` 运算符一样在\
  \ async 函数中使用。区别在于 async 函数总是返回 promise。例如，如果你返回一个数字，它会被封装在 promise 中：\n\n```javascript\n\
  async function getMeaningOfLife() {\n  return 42;\n}\n\nconst result = getMeaningOfLife();\n\
  console.log(result instanceof Promise); // true\nconsole.log(typeof result === \"\
  number\"); // false\nresult.then(value => {\n  console.log(value); // 42\n});\n\
  ```\n\n在此代码中，`getMeaningOfLife()` async 函数返回 `42`，但返回值实际上是一个完成的 promise。你可以附加完成处理器来获取值。\n\
  \n如果你在 async 函数内部向 `return` 传递 promise，那么该 promise 不直接传递。相反，promise 的状态和值会被复制一个新的\
  \ promise 并返回。示例：\n\n```javascript\nconst promise = Promise.resolve(42);\n\nasync\
  \ function getMeaningOfLife() {\n  return promise;\n}\n\nconst result = getMeaningOfLife();\n\
  console.log(result === promise); // false\nresult.then(value => {\n  console.log(value);\
  \ // 42\n});\n```\n\n在这里，`result` 与 `promise` 不是同一个 promise 对象，但它具有所有的内部状态，因此仍然解析为\
  \ `42`。\n\n如果你没有为 async 函数指定返回值，那么返回值是一个解析为 `undefined` 的 promise。例如：\n\n```javascript\n\
  async function doSomething() {\n  // 没有返回值\n}\n\nconst result = doSomething();\n\
  console.log(result instanceof Promise); // true\nresult.then(value => {\n  console.log(value);\
  \ // undefined\n});\n```\n\n底线是，无论你在 async 函数内部做了什么，它总是返回一个 promise。在抛出错误时也是如此。\n\
  \n### 抛出的错误是 promise 拒绝\n\n当错误在 async 函数中抛出时，返回的是一个被拒绝的 promise，而不是在函数外部抛出错误。这意味着你无法使用\
  \ `try-catch` 捕获 async 函数的错误。例如，以下代码将无法捕获错误：\n\n\n\n\n\n```javascript\nasync function\
  \ throwError () {\n    throw new Error(\"Oh no!\");\n}\ntry {\n    throwError();\n\
  \    console.log(\"Didn’t catch error\");\n} catch (ex) {\n    // never called\n\
  \    console.log(\"Caught error\");\n}\n```\n\n在这个示例中，`try-catch` 语句没有捕获 `throwError()`\
  \ 抛出的错误，因为它返回的是一个被拒绝（rejected）的 promise。要捕获错误，你需要提供一个拒绝处理器，如下：\n\n```javascript\n\
  async function throwError () {\n    throw new Error(\"Oh no!\");\n}\nthrowError().catch(reason\
  \ => {\n    console.log(\"Caught error:\", reason.message);\n});\n```\n\n在这里，拒绝处理器是通过\
  \ `catch()` 指定的，错误会导致向 `console` 输出一条消息。\n\nJavaScript 引擎花费了大量精力来确保 `async` 函数始终返回\
  \ promise，这样你就有了一种一致的方式来处理返回值。这引出了 `async` 函数与同步函数不同的第三种方式：`await` 表达式。\n\n## 使用\
  \ await 表达式\n\n`await` 表达式的设计初衷是让处理 promise 变得简单。无需手动分配履行（fulfillment）和拒绝（rejection）处理器，`await`\
  \ 表达式中使用的任何 promise 的行为都更像同步函数中的代码：该表达式在成功时返回 promise 的已履行值，在 promise 失败时抛出拒绝值。这允许你轻松地将\
  \ `await` 表达式的结果赋值给变量，并使用 `try-catch` 语句捕获任何拒绝。这里是一个使用 `fetch()` API（在浏览器和 Deno\
  \ 中可用）但未使用 `await` 的示例：\n\n```javascript\nfunction retrieveJsonData(url) {\n   \
  \ return fetch(url)\n        .then(response => {\n            if (response.ok) {\n\
  \                return response.json();\n            } else {\n               \
  \ throw new Error(`Unexpected status code: ${response.status} ${response.statusText}`);\n\
  \            }\n        })\n        .catch(reason => console.error(reason.message));\n\
  }\n```\n\n`retrieveJsonData()` 函数返回一个 promise，该 promise 解析为 `fetch()` 调用响应中的 JSON\
  \ 数据。此外还有一个 true 拒绝处理器来打印任何错误消息。以下是如何将该函数重写为使用 `await` 的 `async` 函数：\n\n```javascript\n\
  async function retrieveJsonData(url) {\n    try {\n        const response = await\
  \ fetch(url);\n        if (response.ok) {\n            return await response.json();\n\
  \        } else {\n            throw new Error(`Unexpected status code: ${response.status}\
  \ ${response.statusText}`);\n        }\n    } catch (error) {\n        console.error(error.message);\n\
  \    }\n}\n```\n\n在重写后的 `retrieveJsonData()` 版本中，`await fetch(url)` 的调用处理了返回 promise\
  \ 的履行和拒绝处理器的定义。变量 `response` 被赋值为该 promise 的已履行值（如果成功），而拒绝则抛出一个由 `try-catch` 语句捕获的错误。该函数仍然返回一个解析为\
  \ JSON 数据的 promise，但它是通过返回 `response.json()`（另一个 promise）的履行值来实现的。如果 `response.json()`\
  \ 中触发了拒绝，那么它也会作为错误被抛出并在 `try-catch` 语句中捕获。\n\n你可能会奇怪，既然 `response.json()` 是一个 promise，为什么不直接返回它而不使用\
  \ `await` ？例如：\n\n```javascript\nasync function retrieveJsonData(url) {\n    try\
  \ {\n        const response = await fetch(url);\n        if (response.ok) {\n  \
  \          return response.json();\n        } else {\n            throw new Error(`Unexpected\
  \ status code: ${response.status} ${response.statusText}`);\n        }\n    } catch\
  \ (error) {\n        console.error(error.message);\n    }\n}\n```\n\n当 `response.json()`\
  \ 成功时，它的工作与之前的示例相同；然而，当 `response.json()` 失败时，该拒绝不会作为错误抛出，也不会被 `try-catch` 捕获。是\
  \ `await` 表达式导致了拒绝作为错误抛出，因此如果你省略了 `await`，promise 的拒绝只能被拒绝处理器捕获。在这个示例中，拒绝处理器必须由调用此函数的代码添加，如下：\n\
  \n```javascript\nasync function retrieveJsonData(url) {\n    try {\n        const\
  \ response = await fetch(url);\n        if (response.ok) {\n            return response.json();\n\
  \        } else {\n            throw new Error(`Unexpected status code: ${response.status}\
  \ ${response.statusText}`);\n        }\n    } catch (error) {\n        console.error(error.message);\n\
  \    }\n}\nretrieveJsonData(\"https://api.com/users\")\n    .then(data => doSomething(data))\n\
  \    .catch(reason => console.error(reason.message));\n```\n\n这两种场景都有合理的用例，某些场景你想在\
  \ `async` 函数内部捕获错误，而某些场景你希望错误流到外部。\n\n## 在非 promise 上使用 await Expressions\n\n你也可以对非\
  \ promise 值使用 `await`，因为该值始终通过 `Promise.resolve()` 传递。这意味着 promise 被直接传递，非 promise\
  \ 被解析为 promise，而其他值则被包装在 promise 中。例如：\n\n```javascript\nasync function getMeaningOfLife()\
  \ {\n    return await 42;\n}\ngetMeaningOfLife().then(value => console.log(value));\n\
  ```\n\n此代码中的 `getMeaningOfLife()` 函数返回一个解析为值 `42` 的 promise。你可以通过如下方式重写之前的示例在不使用\
  \ `async` 函数的情况下实现相同的功能：\n\n```javascript\nfunction getMeaningOfLife() {\n    return\
  \ Promise.resolve(42);\n}\ngetMeaningOfLife().then(value => console.log(value));\n\
  ```\n\n`await` 处理非 promise 值意味着即使你猜错了所使用的值也不会受到惩罚。\n\n## 在多个 promise 上使用 await Expressions\n\
  \n尽管 `await` 表达式作用于单个 promise，但你可以利用内置的 promise 方法来有效地处理多个 promise。例如，如果你想等待数组中的每个\
  \ promise 都履行，可以使用 `await` 配合 `Promise.all()`：\n\n```javascript\nasync function\
  \ doSomething() {\n    try {\n        return await Promise.all([\n            promise1,\n\
  \            promise2,\n            promise3\n        ]);\n    } catch (error) {\n\
  \        console.error(error.message);\n    }\n}\n```\n\n代码中，，await` 使用在 `Promise.all()`\
  \ 的结果上，导致函数等待所有 promise 都履行，或者其中一个被拒绝（此时会抛出错误）。在函数等待时，三个 promise 可以并行履行。这是一个在 Node.js\
  \ 中读取多个文件的示例：\n\n```javascript\nimport { readFile } from \"node:fs/promises\";\n\
  \nasync function readFiles(filenames) {\n    const fileContents = await Promise.all(\n\
  \        filenames.map(filename => readFile(filename, \"utf8\"))\n    );\n\n   \
  \ return fileContents.map(\n        fileContent => JSON.parse(fileContent)\n   \
  \ );\n}\n\nreadFiles([\n    \"file1.json\",\n    \"file2.json\"\n]).then(data =>\
  \ {\n    // 根据需要处理\n    console.log(data);\n}).catch(reason => {\n    console.error(reason.message);\n\
  });\n```\n\n`readFiles()` async 函数使用 `await` 配合 `Promise.all()` 来等待所有文件读取完毕。然后可以将文件内容解析为\
  \ JSON，以最适合处理的格式返回数据。\n\n当然，你也可以将 `await` 用于 `Promise.allSettled()`、`Promise.any()`、`Promise.race()`\
  \ 或任何其他返回 promise 的函数。\n\n\n\n\n\n# 使用 for-await-of 循环\n\n异步函数内部启用的另一种特殊语法是 `for-await-of`\
  \ 循环，它允许你从可迭代对象或异步可迭代对象获取值。可迭代对象是一个具有 `Symbol.iterator` 方法的对象，该方法返回一个迭代器；异步可迭代对象是一个具有\
  \ `Symbol.asyncIterator` 方法的对象，该方法返回的迭代器其值总是 promise。`for-await-of` 循环会对从可迭代对象返回的每个值调用\
  \ `Promise.resolve()`，然后在等待每个 promise 决后后再继续循环的下一次迭代。\n\nJavaScript 中最常用的可迭代对象是数组，因此你可以使用\
  \ `for-await-of` 循环配合 promise 数组来按顺序处理 promise，例如所示：\n\n```javascript\nconst promise1\
  \ = Promise.resolve(1);\nconst promise2 = Promise.resolve(2);\nconst promise3 =\
  \ Promise.resolve(3);\n\nfor await (const value of [promise1, promise2, promise3])\
  \ {\n    console.log(value);\n}\n```\n\n此示例按顺序处理 `promise1`、`promise2` 和 `promise3`。尽管这些是已决定的\
  \ promise，`for-await-of` 循环同样适用于未决定的 promise。由于 `for-await-of` 循环始终对从可迭代对象中获取的任何值调用\
  \ `Promise.resolve()`，你可以直接对数组使用它，如下：\n\n```javascript\nfor await (const value of\
  \ [1, 2, 3]) {\n    console.log(value);\n}\n```\n\n尽管此示例的数组中没有 promise，`for-await-of`\
  \ 循环仍然可以工作。\n\nNode.js 中最常用的异步可迭代对象是 `ReadStream` 对象。`ReadStream` 对象用于定期从源读取数据，该源中的所有数据可能并非随时可用。对于网络请求、读取大文件或事件流，`ReadStream`\
  \ 对象是处理此类数据的方便方式。这是一个示例：\n\n```javascript\nimport fs from \"node:fs\";\n\nasync\
  \ function readCompleteTextStream(readable) {\n    readable.setEncoding(\"utf8\"\
  );\n\n    let data = \"\";\n    for await (const chunk of readable) {\n        data\
  \ += chunk;\n    }\n\n    return data;\n}\n\nconst stream = fs.createReadStream(\"\
  data.txt\");\nreadCompleteTextStream(stream)\n    .then(text => console.log(text));\n\
  ```\n\n`readCompleteTextStream()` 函数接受一个名为 `readable` 的 `ReadStream` 对象作为参数。读取文本文件的第一步是使用\
  \ `setEncoding()` 方法将编码设置为 \"utf8\"。然后，`for-await-of` 循环遍历从 `readable` 读取的数据。如果文件很短，可能只有一个数据块；如果文件很长，可能会有多个数据块。使用\
  \ `for-await-of` 循环允许你不无需返回块的数量。\n\n与 `await` 表达式类似，如果异步可迭代对象返回的任何 promise 被拒绝（rejected），`for-await-of`\
  \ 循环将抛出错误。你可以在异步函数内部使用 `try-catch` 语句捕获该错误，例如：\n\n```javascript\nimport fs from\
  \ \"node:fs\";\n\nasync function readCompleteTextStream(readable) {\n    readable.setEncoding(\"\
  utf8\");\n\n    try {\n        let data = \"\";\n        for await (const chunk\
  \ of readable) {\n            data += chunk;\n        }\n        return data;\n\
  \    } catch (error) {\n        console.error(error.message);\n    }\n}\n\nconst\
  \ stream = fs.createReadStream(\"data.txt\");\nreadCompleteTextStream(stream)\n\
  \    .then(text => console.log(text));\n```\n\n在此示例中，`readCompleteTextStream()`\
  \ 函数接受一个名为 `readable` 的 `ReadStream` 对象作为参数。\n\n## 顶层等待 (Top-Level Await)\n\n你可以在\
  \ JavaScript 模块的异步函数外部使用顶级 await。\n\n```javascript\n// 静态导入\nimport something from\
  \ \"./file.js\";\n\n// 动态导入\nconst somethingElse = await import(\"./another-file.js\"\
  );\n```\n\n当 JavaScript 引擎遇到顶层 await 时，模块执行将暂停，直到 promise 稳定。这允许你在模块级别使用顶层 await。注意，脚本（scripts）中不支持顶层\
  \ await。\n\n# 总结\n\n- 异步函数允许你使用 promise 而无需手动分配处理程序。\n- 异步函数的返回值始终是一个 promise。如果你从异步函数中返回一个\
  \ promise，它将返回给调用处；如果你返回一个非 promise 值，则它会被解析为 promise。\n- 异步函数内部抛出的错误会被捕获并作为拒绝的\
  \ promise 返回。由于这种行为，你无法使用 `try-catch` 捕获错误；相反，你需要为返回的 promise 分配拒绝处理程序。\n- 异步函数启用了两种特殊语法：`await`\
  \ 表达式和 `for-await-of` 循环。`await` 表达式用于为 promise 分配履行和拒绝处理程序，使得履行值成为 `await` 表达式的结果，拒绝会导致抛出错误。同样，`for-await-of`\
  \ 循环作用异步可迭代对象，允许使用 promise 代替循环。`for-await-of` 循环等待异步可迭代对象返回的每个 promise 履行后再进入下一个\
  \ promise。如果异步可迭代对象的 promise 被拒绝，则会抛出错误。\n- 你可以在 JavaScript 模块的异步函数外部使用顶级 await\
  \ 表达式。此功能在脚本中不可用。\n\n# 5. 未处理拒绝追踪\n\n由于 promise 的性质，判断 promise 拒绝是否被处理并非简单。例如，考虑以下示例：\n\
  \n```javascript\nlet rejected = Promise.reject(42);\n\n// 在此点，rejected 是未处理的\nsetTimeout(()\
  \ => {\n    rejected.catch(value => {\n        // 现在 rejected 已被处理\n        console.log(value);\n\
  \    });\n}, 5000);\n```\n\n\n\n\n\n你可以在任何点调用 `then()` 或 `catch()`，并且无论 promise\
  \ 是否已经着绪（settled），它们都能正常工作，这使得很难准确判断 promise 何时会被处理。在这种情况下，promise 会立即被拒绝（rejected），但直到之后才被处理。\n\
  \nJavaScript 规范认为，如果 promise 的 `then()` 方法被调用，则该 promise 已经被处理（这包括 `catch()` 和 `finally()`，这两者都会在后台调用\
  \ `then()`）。实际上，无论你绑定了成功处理器、拒绝处理器，还是两者都没有绑定，只要调用了 `then()`，这在其中并不重要。每次调用 `then()`\
  \ 都会创建一个新的 promise，然后该 promise 将负责处理任何成功或拒绝的情况。考虑这个示例：\n\n```javascript\nconst promise1\
  \ = new Promise (( resolve , reject ) => {\n    reject ( 43 );\n});\nconst promise2\
  \ = promise1 .then ( value => {\n    console .log ( value );\n});\n```\n\n在这里，`promise1`\
  \ 被视为已处理，因为它调用了 `then()` 并且绑定了一个成功处理器。当 `promise1` 被拒绝时，该拒绝会被传递给 `promise2`，而 `promise2`\
  \ 是未处理的。运行时会报告来自 `promise2` 的未处理拒绝并忽略 `promise1`。因此，运行时并不是真的在追踪所有的未处理拒绝，而是在追踪链条中的最后一个\
  \ promise 是否绑定了任何处理器。\n\n虽然 JavaScript 规范确实指出了如何追踪未处理的拒绝，但它并没有规定当发生未处理的拒绝时运行时应该怎么做。这些细节留给运行时自行决定，因为根据运行时执行位置的不同，适当的反应也可能有所不同。\n\
  \n## Web 浏览器中的未处理拒绝追踪\n\nWeb 浏览器的未处理拒绝追踪定义在 HTML 规范中。未处理拒绝追踪的核心是两个由 `globalThis`\
  \ 对象发射的事件：\n\n- `unhandledrejection`：当一个 promise 被拒绝且在事件循环的一个轮次内没有调用拒绝处理器时，发射。\n\
  - `rejectionhandled`：当一个 promise 被拒绝且在事件循环的一个轮次后调用了拒绝处理器时发射。\n\n这两个事件被设计为结合使用，以准确检测未处理的\
  \ promise 拒绝。以下是一个显示每个事件何时触发的示例：\n\n```javascript\nconst rejected = Promise .reject\
  \ ( new Error ( “Oops!”));\n\nsetTimeout (() => {\n    // 这里触发“rejectionhandled”\n\
  \    rejected .catch (\n        reason => console .error ( reason . message )  \
  \  // “Oops!”\n    );\n}, 500 );\n\n// 在此处触发“unhandledrejection”\n```\n\n在这段代码中，`rejected`\
  \ 是一个最初没有绑定拒绝处理器的被拒绝 promise。一旦脚本任务完成，就会发射 `unhandledrejection` 事件，告知你存在一个没有拒绝处理器的被拒绝\
  \ promise。定时器在延迟 `500` 毫秒后添加了一个拒绝处理器，此时会发射 `rejectionhandled` 事件，告知你一个之前被标记为具有未处理拒绝的\
  \ promise 现在已经被处理了。这意味着你需要追踪触发这些事件的 promise，以便准确检测问题。\n\n`unhandledrejection` 和\
  \ `rejectionhandled` 都会生成一个包含以下属性的事件对象：\n\n- `type`：事件名称（`“unhandledrejection”`\
  \ 或 `“rejectionhandled”`）\n- `promise`：被拒绝的 promise 对象\n- `reason`：promise 的拒绝值\n\
  \n通过这些信息，你可以追踪哪些 promise 没有拒绝处理器，如示例所示：\n\n```javascript\nconst rejected = Promise\
  \ .reject ( new Error ( “Oops!”));\n\nsetTimeout (() => {\n    // 这里触发“rejectionhandled”\n\
  \    rejected .catch (\n        reason => console .error ( reason .message ) //\
  \ “Oops!”\n    );\n}, 500 );\n\nglobalThis .onunhandledrejection = event => {\n\
  \    console .log ( event .type );                     // “unhandledrejection”\n\
  \    console .log ( event .reason . message );          // “Oops!”\n    console\
  \ .log ( rejected === event .promise );     // true\n};\n\nglobalThis .onrejectionhandled\
  \ = event => {\n    console .log ( event .type );                     // “rejectionhandled”\n\
  \    console .log ( event .reason . message );          // “Oops!”\n    console\
  \ .log ( rejected === event .promise );     // true\n};\n\n// 在此处触发“unhandledrejection”\n\
  ```\n\n此代码使用 DOM Level 0 记法 `onunhandledrejection` 和 `onrejectionhandled` 分配了两个事件处理器。（如果你喜欢，在两种情况下也可以使用\
  \ `addEventListener()`。）每个事件处理器都会接收一个包含被拒绝 promise 信息的事件对象。`type`、`promise` 和 `reason`\
  \ 属性在事件处理器中都是可用的。\n\n尽管本节关注 Web 浏览器中的未处理拒绝，但 Deno 决定将 HTML 规范的未处理拒绝追踪作为其的一部分。在编写本文时，Deno\
  \ 已为 worker 实现了 `unhandledrejection` 和 `rejectionhandled` 事件，但尚未实现主线程。此问题正在积极处理，应该很快解决。\n\
  \n## 在 Web 浏览器中报告未处理的拒绝\n\n虽然 `unhandledrejection` 和 `rejectionhandled` 对于识别问题很有帮助，但如果没有额外的辅助，对于生产环境中的追踪并没有帮助。你并不需要记录每一个未处理的拒绝，因为拒绝处理器可能会稍后添加，因此指定一个预计所有拒绝都会被处理的时间范围是合理的。例如，你可能想记录一分钟内未处理的每一个拒绝。要这样做，你需要追踪触发了\
  \ `unhandledrejection` 但没有触发 `rejectionhandled` 的 promise。以下是实现此点的方法：\n\n```javascript\n\
  const possiblyUnhandledRejections = new Map ();\n\n// 当拒绝未被处理时，将其添加到 map 中\nglobalThis\
  \ .onunhandledrejection = event => {\n    possiblyUnhandledRejections .set ( event\
  \ .promise , event .reason );\n};\n\n// 当拒绝被处理时，将其从 map 中移除\nglobalThis .onrejectionhandled\
  \ = event => {\n    possiblyUnhandledRejections .delete ( event .promise );\n};\n\
  \nsetInterval (() => {\n    possiblyUnhandledRejections .forEach (( reason , promise\
  \ ) => {\n        console .error ( “Unhandled rejection” );\n        console .error\
  \ ( promise );\n        console .error ( reason .message ? reason .message : reason\
  \ );\n        // 对这些拒绝进行处理\n    });\n    possiblyUnhandledRejections .clear ();\n\
  }, 60000 );\n```\n\n这是一个简单的未处理拒绝追踪。它使用 map 存储 promise 及其拒绝原因。每个 promise 是一个键，promise\
  \ 的原因是关联的值。每当发射 `unhandledrejection` 时，promise 及其原因就会添加到 map 中。每当发射 `rejectionhandled`\
  \ 时，处理过的 promise 就会从 map 中移除。因此，`possiblyUnhandledRejections` 随着事件的发射而增长和缩小。`setInterval()`\
  \ 调用定期检查可能的未处理拒绝列表，并将信息输出到控制台（在现实中，你可能想采取其他操作来记录或处理这些拒绝）。\n\n\n\n\n\n默认情况下，浏览器和\
  \ Deno 会将未捕的拒绝（uncaught rejections）输出到控制台，即使你监听了 `uncaughtrejection` 事件，这种行为也不会发生改变。你可以在\
  \ `onuncaughtrejection` 事件处理器内部调用 `event.preventDefault()` 来阻止控制台警告，如下例所示：\n\n```javascript\n\
  globalThis . onunhandledrejection = event => {\n    // 阻止控制台警告\n    event . preventDefault\
  \ (); \n};\n```\n\n此示例阻止了控制台警告，但不会影响与 `rejectionhandled` 事件的关系。如果触发 `unhandledrejection`\
  \ 的 promise 之后被分配了拒绝处理器，则 `rejectionhandled` 事件仍会被触发。\n\n## 在 Web 浏览器中处理未处理的拒绝\n\
  \n`unhandledrejection` 和 `rejectionhandled` 事件关系的另一个特殊之处是，你可以通过在 `onunchandledrejection`\
  \ 事件处理器内部添加 `rejection-handler` 来防止 `rejectionhandled` 事件的触发，如下所示：\n\n```javascript\n\
  globalThis . onunhandledrejection = ({ promise , reason }) => {\n    promise . catch\
  \ (() => {});       // 处理拒绝 \n};\n\n// 这永远不会被调用\nglobalThis . onrejectionhandled\
  \ = ({ promise }) => {\n    console . log ( promise );\n};\n```\n\n在这种情况下，`rejectionhandled`\
  \ 事件不会被触发，因为在触发该事件之前已经添加了拒绝处理器。浏览器假设你知道该 promise 现在已经被处理了，因此没有理由触发 `rejectionhandled`\
  \ 事件。\n\n即使在 `onunchandledrejection` 内部处理了拒绝，控制台仍然会输出警告，除非你也在 `onunchandledrejection`\
  \ 内部调用了 `event.preventDefault()`。\n\n## Node.js 未处理拒绝追踪\n\nNode.js 追踪未处理的 promise\
  \ 拒绝的方式与浏览器相似但并不完全相同。Node.js 中有两个事件，但它们是在 `process` 对象上发射的，且大小写与浏览器事件不同：\n\n- `unhandledRejection`:\
  \ 当 promise 被拒绝且在事件循环的一个周期内没有调用拒绝处理器时，触发。\n- `rejectionHandled`: 当 promise 被拒绝且在事件循环的一个周期后调用了拒绝处理器时，触发。\n\
  \n此外，与浏览器事件不同，这些事件不接收事件对象。`unhandledRejection` 事件处理器接收 `rejection reason` 和被拒绝的\
  \ `promise` 作为参数。以下代码展示了 `unhandledRejection` 的用法：\n\n```javascript\nconst rejected\
  \ = Promise . reject ( new Error ( “Oops!” ));\nprocess . on ( “unhandledRejection”\
  \ , ( reason , promise ) => {\n    console . log ( reason . message );         \
  \    // “Oops!”\n    console . log ( rejected === promise );      // true\n});\n\
  ```\n\n此示例创建了一个带有错误对象的被拒绝 promise，并监听了 `unhandledRejection` 事件。事件处理器接收错误对象作为第一个参数，并将\
  \ `promise` 作为第二个参数。\n\n`rejectionHandled` 事件处理器只有一个参数，即被拒绝的 `promise`。例如：\n\n```javascript\n\
  const rejected = Promise . reject ( new Error ( “Oops!” ));\n\nsetTimeout (() =>\
  \ {\n    // 这里触发 “rejectionhandled”\n    rejected . catch (\n        reason => console\
  \ . error ( reason . message ) // “Oops!”\n    );\n}, 500 );\n\nprocess . on ( “rejectionHandled”\
  \ , promise => {\n    console . log ( rejected === promise );  // true\n});\n```\n\
  \n在这里，`rejectionHandled` 事件在拒绝处理器最终被调用时发射。注意，与浏览器不同，拒绝的原因没有被传递给 `rejectionHandled`\
  \ 事件处理器。\n\n默认情况下，当发生未处理的 promise 拒绝时，除非存在 `unhandledRejection` 事件处理器，否则 Node.js\
  \ 会抛出一个错误。你可以通过使用 `--unhandled-rejection` 命令行选项更改 Node.js 处理未捕获 promise 拒绝的方式。\n\
  \n- `--unhandled-rejection=throw (default)` 意味着发射 `unhandledRejection` 事件。如果没有为\
  \ `unhandledRejection` 指定事件处理器，则拒绝原因将作为错误抛出，可以通过 `uncaughtException` 事件处理器捕获。如果没有指定\
  \ `uncaughtException` 处理器，Node.js 进程将退出并将 `process.exitCode` 设置为 1。\n- `--unhandled-rejection=strict`\
  \ 意味着不发射 `unhandledRejection` 事件。相反，拒绝原因将作为错误抛出，可以通过 `uncaughtException` 事件处理器捕获。任何\
  \ `unhandledRejection` 处理器都不会执行。\n- `--unhandled-rejection=warn` 意味着发射 `unhandledRejection`\
  \ 事件，并且无论是否定义了任何 `unhandledRejection` 处理器，控制台都会输出警告。进程退出码没有变化。\n- `--unhandled-rejection=warn-with-error-code`\
  \ 的作用与 `--unhandled-rejection=warn` 相同，但在进程退出时，如果没有指定其他退出码，它将将 `process.exitCode`\
  \ 设置为 1。\n- `--unhandled-rejection=none` 完全忽略任何未处理的 promise 拒绝。没有控制台输出，进程继续执行 JavaScript。\n\
  \n对于生产部署，建议使用 `--unhandled-rejection=strict`，因为 promise 拒绝可能会导致应用程序处于不稳定状态。\n\n\
  ## 在 Node.js 中报告未处理的拒绝\n\n为了正确追踪未处理的拒绝，请使用 `unhandledRejection` 和 `rejectionHandled`\
  \ 事件维护一个可能的未处理拒绝列表。以下是之前针对 Web 浏览器的简单拒绝追踪器的 Node.js 版本：\n\n```javascript\nconst\
  \ possiblyUnhandledRejections = new Map();\n\n// 当拒绝未被处理时，将其添加到 map 中\nprocess .\
  \ on ( “unhandledRejection” , ( reason , promise ) => {\n    possiblyUnhandledRejections\
  \ . set ( promise , reason );\n});\n\n// 当拒绝被处理时，将其移除\nprocess . on ( “rejectionHandled”\
  \ , promise => {\n    possiblyUnhandledRejections . delete ( promise );\n});\n\n\
  setInterval(() => {\n    possiblyUnhandledRejections .forEach ((reason , promise)\
  \ => {\n        console . error ( “Unhandled rejection” );\n        console . error\
  \ ( promise );\n        console . error ( reason . message : reason );\n       \
  \ // 对这些拒绝进行某些处理\n    });\n    possiblyUnhandledRejections .clear();\n}, 60000 );\n\
  ```\n\n该拒绝追踪器的算法与 Web 浏览器中的相同，只是使用了 Node.js 特有的功能。否则，`possiblyUnhandledRejections`\
  \ 会随着事件的调用增长和缩小，并使用 `setInterval()` 定期检查未处理拒绝列表并将其输出到控制台。\n\n# 总结\n\n所有的 JavaScript\
  \ 运行时都会某种方式追踪未处理的拒绝。浏览器和 Deno 实现了 HTML 规范中的算法，而 Node.js 实现了了自己的解决方案。两种解决方案都依赖于两个事件：一个在未追踪的拒绝发生时发射，另一个在之前未追踪的拒绝添加了拒绝处理器时发射。\n\
  \n`unhandledrejection` 事件在浏览器和 Deno 中在检测到未处理拒绝时发射到 `globalThis` 对象上。`unhandledrejection`\
  \ 事件处理器接收一个包含事件类型、被拒绝的 `promise` 以及 拒绝原因的事件对象。`rejectionhandled` 事件在之前未追踪的拒绝添加了拒绝处理器时发射。\n\
  \nNode.js 也使用两个事件，但它们发生在 `process` 对象上且名称略有不同：`unhandledRejection` 和 `rejectionHandled`。`unhandledRejection`\
  \ 事件处理器接收拒绝原因和 `promise` 作为参数；`rejectionHandled` 事件处理器只接收 `promise`。\n\n\n\n\n\n\
  两种方法都允许你通过监听这两个事件并在单独的位置跟踪它们提供的 Promise，从而为应用程序实现未处理的拒绝（unhandled rejection）报告。然后你可以定期检查\
  \ Promise 列表，并将它们报告到你的日志或报告系统中。\n\n## 结语\n\n当 Promise 在 2015 年引入 JavaScript 语言时，它们曾是争议的焦点，也是许多深度文章的主题，探讨这是否是解决\
  \ JavaScript 异步未来的正确方式。几年之后，尘埃已经落定，Promise 赢得了许多人的认可，尤其是随着 2017 年 `async` 函数的引入。所有新的异步\
  \ JavaScript API 都是为了利用 Promise 构建的，因此理解如何使用 Promise 是任何与 JavaScript 相关工作中的重要部分。\n\
  \n希望你喜欢这次对 JavaScript Promise 的探索。\n\n## 下载额外材料\n\n你可以从 `https://bit.ly/promises-extras`\
