    \ fulfillment handler\npromise .then ( response => {\n    console . log ( response\
    \ .status );\n\n    // now add another\n    promise .then ( response => {\n  \
    \      console . log ( response .statusText );\n    });\n});\n```\n\n在此代码中，成功处理函数（fulfillment\
    \ handler）为同一个 `promise` 添加了另一个成功处理函数。此时 `promise` 已经完成履行，因此新的成功处理函数被添加到微任务队列中，并在就绪时调用。拒绝处理函数（rejection）和状态处理函数（settlement）的工作的方式相同。\n\
    \n## 处理程序与微任务\n\n在程序常规流中执行的 JavaScript 是以任务（task）的形式执行的，这意味着 JavaScript 运行时创建了一个新的执行上下文并完全执行代码，完成后退出。例如，网页中按钮的\
    \ `onclick` 处理程序是作为任务执行的。当按钮被点击时，会创建一个新任务并执行 `onclick` 处理程序。一旦完成，JavaScript 运行时将等待下次交互以执行更多代码。然而，Promise\
    \ 处理程序的执行方式不同。\n\n所有的 Promise 处理程序（无论是成功、拒绝还是状态处理）都是在 JavaScript 引擎内部作为微任务（microtasks）执行的。微任务被缓存，并在当前运行的任务完成后立即执行，在\
    \ JavaScript 运行时变为空闲之前执行。调用 `then()`、`catch()` 或 `finally()` 会告诉 `promise` 在状态确定后将指定的微任务队列。\n\
    \n这与使用 `setTimeout()` 或 `setInterval()` 创建定时器不同，这两者都会创建新任务并在稍后的某个时间点执行。队列中的 Promise\
    \ 处理程序始终会在同一任务中排队的的定时器之前执行。你可以通过全局函数 `queueMicrotask()` 来亲自测试这一点，该函数用于在 promise\
    \ 之外创建微任务：\n\n```javascript\nsetTimeout (() => {\n    console . log ( “timer”\
    \ );\n\n    queueMicrotask (() => {\n        console . log ( “microtask in timer”\
    \ );\n    });\n}, 0 );\n\nqueueMicrotask (() => {\n    console . log ( “microtask”\
    \ );\n});\n```\n\n在此代码中，创建了一个延迟为 0 毫秒的定时器，并在定时器内部创建了一个微任务。此外，在定时器外部创建了一个微任务。当这段代码执行时，你将在控制台中看到以下输出：\n\
    \nmicrotask\ntimer\nmicrotask in timer\n\n尽管定时器被设置为延迟 0 毫秒，但微任务首先执行，紧接着是定时器，然后是定时器内部的微任务。\n\
    \n关于微任务（包括所有 Promise 处理程序）需要记住的最重要的一点是，它们一旦任务完成就会立即执行。这尽可能缩短了 `promise` 确定与对确定反应之间的时间，使得\
    \ Promise 适用于对运行时性能要求的场景。\n\n## 创建新的（未确定的）Promise\n\n新的 Promise 使用 `Promise` 构造函数创建。该构造函数接受一个参数：一个称为\
    \ `executor`（执行器）的函数，它包含了初始化 `promise` 的代码。`executor` 接收两个命名为 `resolve()` 和 `reject()`\
    \ 的函数作为参数。当 `executor` 成功完成时，你调用 `resolve()` 函数来指示 `promise` 已解析，或者调用 `reject()`\
    \ 函数指示操作已失败。\n\n这里有一个使用旧版 `XMLHttpRequest` 浏览器 API 的示例：\n\n```javascript\n// 浏览器示例\n\
    function requestURL ( url ) {\n    return new Promise (( resolve , reject ) =>\
    \ {\n\n        const xhr = new XMLHttpRequest ();\n\n        // 分配事件处理器\n    \
    \    xhr .addEventListener ( “load” , () => {\n            resolve ({\n      \
    \          status : xhr .status ,\n                text : xhr . responseText\n\
    \            });\n        });\n\n        xhr . addEventListener ( “error” , error\
    \ => {\n            reject ( error );\n        });\n\n        // 发送请求\n      \
    \  xhr . open ( “get” , url );\n        xhr . send ();\n    });\n}\n\nconst promise\
    \ = requestURL ( “books.json” );\n\n// 监听成功和拒绝\npromise .then ( response => {\n\
    \    // 成功\n    console . log ( response .status );\n}, error => {\n    // 拒绝\n\
    \    console . log ( error );\n });\n```\n\n在此示例中，`XMLHttpRequest` 对象被封装在 `promise`\
    \ 中。在 `xhr` 请求完成之前，`promise` 保持未确定状态。如果 `load` 事件触发，将调用 `resolve()` 并传入响应数据。如果\
    \ `error` 事件触发，将调用 `reject()`。\n\n执行器的一个重要方面是是它们在被创建时就会立即运行。例如，考虑一下在 `executor`\
    \ 内部调用 `resolve()` 会发生什么：\n\n```javascript\nconst promise = new Promise (( resolve\
    \ , reject ) => {\n    console . log ( “Executor” );\n    resolve ( 42 );\n});\n\
    \npromise .then ( result => {\n    console . log ( result );\n});\n\nconsole .\
    \ log ( “Hi!” );\n```\n\n在这里，`promise` 立即解析，尽管添加了成功处理函数，但输出将是：\n\nExecutor\nHi!\n\
    42\n\n`executor` 先运行，输出“Executor”。接下来分配了成功处理函数，但在脚本任务完成之前它不会执行。一个 `promise` 只能解析一次，因此如果你在\
    \ `executor` 内部多次调用 `resolve()`，则第一次调用之后的每次调用都会被忽略。\n\n### 执行器错误\n\n如果在 `executor`\
    \ 内部抛出错误，则会调用 `promise` 的拒绝处理函数。例如：\n\n```javascript\nconst promise = new Promise\
    \ (( resolve , reject ) => {\n    throw new Error ( “Uh oh!” );\n});\n\npromise\
    \ .catch ( reason => {\n    console . log ( reason .message );\n});\n```\n\n在段代码中，`executor`\
    \ 故意抛出一个错误。每个 `executor` 内部都有一个隐式的 `try-catch`，以便错误被捕获并传递给拒绝处理函数。上一个示例等同于：\n\n\
    ```javascript\nconst promise = new Promise (( resolve , reject ) => {\n    try\
    \ {\n        throw new Error ( “Uh oh!” );\n    } catch ( ex ) {\n        reject\
    \ ( ex );\n    }\n});\n```\n\n`executor` 会捕获所有抛出的错误以简化这种常见用例，并且与其他拒绝的情况一样，如果没有分配拒绝处理函数，JavaScript\
    \ 引擎将抛出错误并停止执行。\n\n## 创建已定的 Promise\n\n由于 Promise 执行器行为的动态性，`Promise` 构造函数是创建未确定\
    \ Promise 的最佳方法。但如果你希望 `promise` 表示一个预先计算的值，那么创建一个仅仅将值传递给 `resolve()` 或 `reject()`\
    \ 函数的执行器就没有意义。相反，有两种方法可以根据特定值创建已定的 Promise。\n\n使用 `Promise.resolve()`\n\n"
- fmt: "\nThe `Promise.resolve()` method accepts a single argument and returns a promise\
    \ in the fulfilled state. That means you don’t have to supply an executor if you\
    \ know the value of the promise already. For example:\n\n```javascript\nconst\
    \ promise = Promise.resolve(42);\npromise.then(value => {\n    console.log(value);\
    \ // 42\n});\n```\n\nThis code creates a fulfilled promise so the fulfillment\
    \ handler receives `42` as `value`. As with other examples in this chapter, the\
    \ fulfillment handler is executed as a microtask after the current script job\
    \ completes. If a rejection handler were added to this promise, the rejection\
    \ handler would never be called because the promise will never be in the rejected\
    \ state.\n\nIf you pass a promise to `Promise.resolve()`, then the function returns\
    \ the same promise that you passed in. For example:\n\n```javascript\nconst promise1\
    \ = Promise.resolve(42);\nconst promise2 = Promise.resolve(promise1);\nconsole.log(promise1\
    \ === promise2); // true\n```\n\n### Using Promise.reject()\n\nYou can also create\
    \ rejected promises by using the `Promise.reject()` method. This works like `Promise.resolve()`\
    \ except the created promise is in the rejected state, as follows:\n\n```javascript\n\
    const promise = Promise.reject(42);\npromise.catch(reason => {\n    console.log(reason);\
    \ // 42\n});\n```\n\nAny additional rejection handlers added to this promise would\
    \ be called, but fulfillment handlers will not because the promise will never\
    \ be in the fulfilled state.\n\nIf you pass a promise to either the `Promise.resolve()`\
    \ or `Promise.reject()` methods, the promise is returned without modification.\n\
    \n### Non-Promise Thenables\n\nBoth `Promise.resolve()` and `Promise.reject()`\
    \ also accept non-promise thenables as arguments. When passed a non-promise thenable,\
    \ these methods create a new promise that is called after the `then()` function.\n\
    \nA non-promise thenable is created when an object has a `then()` method that\
    \ accepts a `resolve` and a `reject` argument, like this:\n\n```javascript\nconst\
    \ thenable = {\n    then(resolve, reject) {\n        resolve(42);\n    }\n};\n\
    ```\n\nThe thenable object in this example has no characteristics associated with\
    \ a promise other than the `then()` method. You can call `Promise.resolve()` to\
    \ convert thenable into a fulfilled promise:\n\n```javascript\nconst thenable\
    \ = {\n    then(resolve, reject) {\n        resolve(42);\n    }\n};\nconst promise\
    \ = Promise.resolve(thenable);\npromise.then(value => {\n    console.log(value);\
    \ // 42\n});\n```\n\nIn this example, `Promise.resolve()` calls `thenable.then()`\
    \ so that a promise state can be determined. The promise state for `thenable`\
    \ is fulfilled because `resolve(42)` is called inside the `then()` method. A new\
    \ promise called `promise` is created in the fulfilled state with the value passed\
    \ from `thenable` (that is, `42`), and the fulfillment handler for `promise` receives\
    \ `42` as the value.\n\nThe same process can be used with `Promise.resolve()`\
    \ to create a rejected promise from a thenable:\n\n```javascript\nconst thenable\
    \ = {\n    then(resolve, reject) {\n        reject(42);\n    }\n};\nconst promise\
    \ = Promise.resolve(thenable);\npromise.catch(value => {\n    console.log(value);\
    \ // 42\n});\n```\n\nThis example is similar to the last except that `thenable`\
    \ is rejected. When `thenable.then()` executes, a new promise is created in the\
    \ rejected state with a value of `42`. That value is then passed to the rejection\
    \ handler for `promise`.\n\n`Promise.resolve()` and `Promise.reject()` work like\
    \ this to allow you to easily work with non-promise thenables. A lot of libraries\
    \ used thenables prior to promises being introduced in 2015, so the ability to\
    \ convert thenables into formal promises is important for backwards compatibility\
    \ with previously existing libraries. When you’re unsure if an object is a promise,\
    \ passing the object through `Promise.resolve()` or `Promise.reject()` (depending\
    \ on your anticipated result) is the best way to find out because promises just\
    \ pass through unchanged.\n\n### Summary\n\nA promise is a placeholder for a value\
    \ that may be provided later as the result of some asynchronous operation. Instead\
    \ of assigning an event handler or passing a callback into a function, you can\
    \ use a promise to represent the result of an operation.\n\nPromises have three\
    \ states: pending, fulfilled, and rejected. A promise starts in a pending (unsettled)\
    \ state and becomes fulfilled on a successful execution or rejected on a failure\
    \ (fulfillment and rejection are settled states). In either case, handlers can\
    \ be added to indicate when a promise is settled. The `then()` method allows you\
    \ to assign a fulfillment and rejection handler; the `catch()` method allows you\
    \ to assign only a rejection handler; the `finally()` method allows you to assign\
    \ a settlement handler that is always called regardless of the outcome. All promise\
    \ handlers are run as microtasks so they will not execute until the current script\
    \ job is complete.\n\nYou can create new unsettled promises using the `Promise`\
    \ constructor, which accepts an executor function as its only argument. The executor\
    \ function is passed `resolve()` and `reject()` functions that you use to indicate\
    \ the success or failure of the promise. The executor runs immediately upon creation\
    \ of the promise, unlike handlers, which are run as microtasks. Any errors thrown\
    \ in an executor are automatically caught and passed to `reject()`.\n\nIt’s possible\
    \ to create settled promises using `Promise.resolve()` for fulfilled promises\
    \ and `Promise.reject()` for rejected promises. Each method will wrap its argument\
    \ in a promise (if it’s not a promise and not a non-promise thenable), create\
    \ a new promise (for non-promise thenables), or pass through any existing promise.\
    \ These methods are helpful when you are unsure if the value is a promise but\
    \ want it to behave like one.\n\nWhile creating single promises is a useful and\
    \ effective way to work with asynchronous operations in JavaScript, promises allow\
    \ interesting composition patterns when chained together. In the next chapter,\
    \ you’ll learn how promise handlers work to create promise chains and why that’s\
    \ a valuable capability.\n\n### 2. Chaining Promises\n\nTo this point, promises\
    \ may seem like little more than an incremental improvement over using some combination\
    \ of a callback and the `setTimeout()` function, but there is much more to promises\
    \ than meets the eye. More specifically, there are a number of ways to chain promises\
    \ together to accomplish more asynchronous behavior.\n\nEach call to `then()`,\
    \ `catch()`, or `finally()` actually creates and returns another promise. This\
    \ second promise is settled only once the first has been fulfilled or rejected.\
    \ Consider this example:\n\n```javascript\nconst promise = Promise.resolve(42);\n\
    promise.then(value => {\n    console.log(value);\n}).then(() => {\n    console.log(\"\
    Finished\");\n});\n```\n\nThe code outputs:\n\n```\n42\nFinished\n```\n\nThe call\
    \ to `promise.then()` returns a second promise on which `then()` is called. The\
    \ second `then()` fulfillment handler is only called after the first promise has\
    \ been resolved. If you unchain this example, it looks like this:\n\n```javascript\n\
    const promise1 = Promise.resolve(42);\nconst promise2 = promise1.then(value =>\
    \ {\n    console.log(value);\n});\npromise2.then(() => {\n    console.log(\"Finished\"\
    );\n});\n```\n\nIn this unchained version of the code, the result of `promise1.then()`\
    \ is stored in `promise2`, and then `promise2.then()` is called to add the final\
    \ fulfillment handler. The call to `promise2.then()` also returns a promise. This\
    \ example just doesn’t use that promise.\n\n#### Catching Errors\n\nPromise chaining\
    \ allows you to catch errors that may occur in a fulfillment or rejection handler\
    \ from a previous promise. For example:\n\n```javascript\nconst promise = Promise.resolve(42);\n\
    promise.then(value => {\n    throw new Error(\"Oops!\");\n}).catch(reason => {\n\
    \    console.error(reason.message); // \"Oops!\"\n});\n```\n"
