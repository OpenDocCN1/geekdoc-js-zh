    ## 何时使用 Promise.all()\n\n当你需要等待多个 promise 成功完成，并且任何一个失败都应该导致整个操作失败时，就会使用 `Promise.all()`。\n\
    \n#### 同时处理文件\n\n在使用如 Node.js 或 Deno 等服务端 JavaScript 运行时，你可能需要从多个文件中读取。在这种情况下，并行读取文件并等待它们全部读取完成是最高效的。这是一个在\
