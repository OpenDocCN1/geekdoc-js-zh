  trans: "\n\n两种方法都允许你通过监听这两个事件并在单独的位置跟踪它们提供的 Promise，从而为应用程序实现未处理的拒绝（unhandled rejection）报告。然后你可以定期检查\
    \ Promise 列表，并将它们报告到你的日志或报告系统中。\n\n## 结语\n\n当 Promise 在 2015 年引入 JavaScript 语言时，它们曾是争议的焦点，也是许多深度文章的主题，探讨这是否是解决\
    \ JavaScript 异步未来的正确方式。几年之后，尘埃已经落定，Promise 赢得了许多人的认可，尤其是随着 2017 年 `async` 函数的引入。所有新的异步\
    \ JavaScript API 都是为了利用 Promise 构建的，因此理解如何使用 Promise 是任何与 JavaScript 相关工作中的重要部分。\n\
    \n希望你喜欢这次对 JavaScript Promise 的探索。\n\n## 下载额外材料\n\n你可以从 `https://bit.ly/promises-extras`\
