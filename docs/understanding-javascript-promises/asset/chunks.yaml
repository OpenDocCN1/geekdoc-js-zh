  trans: "\n\n在此段代码中，promise 的成功处理器（fulfillment handler）抛出了错误。对 `catch()` 方法的链式调用（位于第二个\
    \ promise 上）可以通过其拒绝处理器（rejection handler）接收该错误。如果拒绝处理器也抛出错误，结果也是如此：\n\n```javascript\n\
    const promise = new Promise (( resolve , reject ) => { \n    throw new Error (\
    \ “Uh oh!” ); \n}); \npromise . catch ( reason => { \n    console . log ( reason\
    \ . message );     // “Uh oh!”\n    throw new Error ( “Oops!” ); \n}). catch (\
    \ reason => { \n    console . error ( reason . message );   // “Oops!” \n});\n\
    ```\n\n在这里，执行器（executor）抛出一个错误，触发了 promise 的拒绝处理器。该处理器接着抛出另一个错误，该错误被第二个 promise\
    \ 的拒绝处理器捕获。链式 promise 调用可以感知链中其他 promise 的错误。\n\n你可以利用这种能力通过 promise 链来捕获错误，从而有效地实现\
    \ `try-catch` 语句的作用。考虑使用 `fetch()` 获取某些数据并想要捕获可能发生的任何错误：\n\n```javascript\nconst\
    \ promise = fetch ( “books.json” ); \npromise . then ( response => { \n    console\
    \ . log ( response . status ); \n}). catch ( reason => { \n    console . error\
    \ ( reason . message ); \n});\n```\n\n如果 `fetch()` 调用成功，此示例将输出响应状态；如果调用失败，将输出错误信息。你可以更进一步，通过检查\
    \ `response.ok` 属性（在第 1 章讨论过）并将 200-299 范围之外的状态码作为错误处理，如果为 `false` 则抛出错误，如例所示：\n\
    \n```javascript\nconst promise = fetch ( “books.json” ); \npromise . then ( response\
    \ => { \n    if ( response . ok ) { \n        console . log ( response . status\
    \ ); \n    } else { \n        throw new Error ( `Unexpected status code: ${ response\
    \ . status } ${ response . statusText }` ); \n    } \n}). catch ( reason => {\
    \ \n    console . error ( reason . message ); \n});\n```\n\n示例中的链式 `catch()` 调用创建了一个拒绝处理器，它可以捕获\
    \ `fetch()` 返回的错误，也可以捕获成功处理器中抛出的任何错误。因此，你不需要为捕获两种不同的错误准备两个不同的处理器，可以使用一个处理器来处理链中可能发生的所有错误。\n\
    \n始终在 promise 链的末尾保留一个拒绝处理器，以确保能够妥善处理可能发生的任何错误。\n\n## 在 Promise 链中使用 finally()\n\
    \n`finally()` 方法的行为与 `then()` 或 `catch()` 不同，它会将上一个 promise 的状态和值复制到它返回的 promise\
    \ 中。这意味着如果原始 promise 以某个值成功，那么 `finally()` 返回的 promise 也将以相同的值成功。例如：\n\n```javascript\n\
    const promise = Promise . resolve ( 42 ); \npromise . finally (() => { \n    console\
    \ . log ( “Finally called.” ); \n}). then ( value => { \n    console . log ( value\
    \ );         // 42 \n});\n```\n\n在这里，终结处理器（settlement handler）无法从 `promise` 接收成功的值，因此该值被复制到方法调用返回的新\
    \ promise 中。新 promise 以值 42（从 `promise` 复制）成功，因此成功处理器接收到的 42 作为参数。请记住，尽管返回的 promise\
    \ 和 `promise` 具有相同的值，但它们并不是同一个对象，如示例所示：\n\n```javascript\nconst promise1 = Promise\
    \ . resolve ( 42 ); \nconst promise2 = promise1 . finally (() => { \n    console\
    \ . log ( “Finally called.” ); \n}); \npromise2 . then ( value => { \n    console\
    \ . log ( value );         // 42 \n}); \nconsole . log ( promise1 === promise2\
    \ ); // false\n```\n\n在此段代码中，`promise1.finally()` 的返回值存储在 `promise2` 中，此时你可以判断它与\
    \ `promise1` 不是同一个对象。`finally()` 的调用总是从原始 promise 复制状态和值。这意味着当在被拒绝的 promise 上调用\
    \ `finally()` 时，它也会返回一个被拒绝的 promise，如示例所示：\n\n```javascript\nconst promise = Promise\
    \ . reject ( 43 ); \npromise . finally (() => { \n    console . log ( “Finally\
    \ called.” ); \n}). catch ( reason => { \n    console . error ( reason );    \
    \   // 43 \n});\n```\n\n示例中的 `promise` 因原因 43 被拒绝。再次，终结处理器无法访问此信息，因为它没有作为参数传递进来，相反，它返回了一个因相同原因被拒绝的新\
    \ promise。然后你可以使用 `catch()` 来获取该原因。\n\n`finally()` 工作方式的唯一例外是在终结处理器内部抛出了错误，或者返回了一个被拒绝的\
    \ promise。在一种情况下，`finally()` 返回的 promise 不会维持原始 promise 的状态和值，而是以抛出的错误为原因被拒绝。这里有一个示例：\n\
    \n```javascript\nconst promise1 = Promise . reject ( 43 ); \npromise1 . finally\
    \ (() => { \n    throw 44 ; \n}). catch ( reason => { \n    console . error (\
    \ reason );       // 44 \n}); \nconst promise2 = Promise . reject ( 43 ); \npromise2\
    \ . finally (() => { \n    return Promise . reject ( 44 );\n}). catch ( reason\
    \ => { \n    console . error ( reason );       // 44 \n});\n```\n\n由于示例中终结处理器抛出了\
    \ `44` 或返回了 `Promise.reject(44)`，返回的 promise 被 44 拒绝，因此控制台输出了 `44`。原始 promise\
    \ 的状态和值丢失了。在第 1 章中，你看到如何使用终结处理器切换应用程序的加载状态。使用 promise 链重写该示例，并结合之前的错误处理，这里有一个完整的示例：\n\
    \n```javascript\nconst appElement = document .ById ( “app” ); \nconst promise\
    \ = fetch ( “books.json” ); \nappElement . classList . add ( “loading” ); \npromise\
    \ . then ( response => { \n    if ( response . ok ) { \n        console . log\
    \ ( response . status ); \n    } else { \n        throw new Error ( `Unexpected\
    \ status code: ${ response . status } ${ response . statusText }` ); \n    } \n\
    }).finally (() => { \n    appElement . classList . remove ( “loading” ); \n}).catch\
    \ ( reason => { \n    console . error ( reason . message ); \n});\n```\n\n与 `try-catch`\
    \ 语句不同，你不希望 `finally()` 是链的最后一部分，以防它抛出错误。因此首先调用 `then()` 来处理 `fetch()` 的响应，然后添加\
    \ `finally()` 来触发 UI 变化，最后由 `catch()` 为整个链添加错误处理器。这就是终结处理器传递之前的 promise 状态有用的地方：如果成功处理器最终抛出错误，终结处理器将传递该拒绝状态以便拒绝处理器可以访问。\n\
    \n## 在 Promise 链中返回值\n\nPromise 链的另一个重要方面是将数据从一个传递到下一个。你已经看到传递给执行器内部 `resolve()`\
    \ 处理器的值会传递给该 promise 的成功处理器。你可以通过在成功处理器中指定返回值来继续沿链传递数据。例如：\n\n```javascript\n\
    const promise = Promise . resolve ( 42 ); \npromise . then ( value => { \n   \
    \ console . log ( value );         // 42 \n    return value + 1 ; \n}). then (\
    \ value => { \n    console . log ( value );         // 43 \n});\n```\n\n` `promise`\
    \ 的成功处理器在执行时返回 `value + 1`。由于 `value` 是 42（来自执行器），成功处理器返回 43 。该值随后被传递给第二个 promise\
    \ 的成功处理器，该处理器将其输出到控制台。\n"
- fmt: "\nYou could do the same thing with the rejection handler. When a rejection\
    \ handler is called, it may return a value. If it does, that value is used to\
    \ fulfill the next promise in the chain, like this:\n\n```javascript\nconst promise\
    \ = Promise.reject(42);\npromise.catch(value => {\n    // rejection handler\n\
    \    console.error(value);      // 42\n    return value + 1;\n}).then(value =>\
    \ {\n    // fulfillment handler\n    console.log(value);        // 43\n});\n```\n\
    \nHere, a rejected promise is created with a value of `42`. That value is passed\
    \ into the rejection handler for the promise, where `value + 1` is returned. Even\
    \ though this return value is coming from a rejection handler, it is still used\
    \ in the fulfillment handler of the next promise in the chain. The failure of\
    \ one promise can allow recovery of the entire chain if necessary.\n\nUsing `finally()`,\
    \ however, results in a different behavior. Any value returned from a settlement\
    \ handler is ignored so that you can access the original promise’s value. Here’s\
    \ an example:\n\n```javascript\nconst promise = Promise.resolve(42);\npromise.finally(()\
    \ => {\n    // settlement handler\n    return 43;                  // ignored!\n\
    }).then(value => {\n    // fulfillment handler\n    console.log(value);      \
    \  // 42\n});\n```\n\nThe value passed to the fulfillment handler is `42` and\
    \ not `43`. The return statement in the settlement handler is ignored so that\
    \ the original value can be retrieved using `then()`. This is one of the consequences\
    \ of `finally()` returning a promise whose state and value are copied from the\
    \ original.\n\n## Returning Promises in Promise Chains\n\nReturning primitive\
    \ values from promise handlers allows passing of data between promises, but what\
    \ if you return an object? If the object is a promise, then there’s an extra step\
    \ that’s taken to determine how to proceed. Consider the following example:\n\n\
    ```javascript\nconst promise1 = Promise.resolve(42);\nconst promise2 = Promise.resolve(43);\n\
    \npromise1.then(value => {\n    console.log(value);    // 42\n    return promise2;\n\
    }).then(value => {\n    console.log(value);    // 43\n});\n```\n\nIn this code,\
    \ `promise1` resolves to `42`. The fulfillment handler for `promise1` returns\
    \ `promise2`, a promise already in the resolved state. The second fulfillment\
    \ handler is called because `promise2` has been fulfilled. If `promise2` were\
    \ rejected, a rejection handler (if present) would be called instead of the second\
    \ fulfillment handler.\n\nThe important thing to recognize about this pattern\
    \ is that the second fulfillment handler is not added to `promise2`, but rather\
    \ to a third promise, making the previous example equivalent to this:\n\n```javascript\n\
    const promise1 = Promise.resolve(42);\nconst promise2 = Promise.resolve(43);\n\
    \nconst promise3 = promise1.then(value => {\n    console.log(value);    // 42\n\
    \    return promise2;\n});\n\npromise3.then(value => {\n    console.log(value);\
    \    // 43\n});\n```\n\nHere, it’s clear that the second fulfillment handler is\
    \ attached to `promise3` rather than `promise2`. This is a subtle but important\
    \ distinction, as the second fulfillment handler will not be called if `promise2`\
    \ is rejected. For instance:\n\n```javascript\nconst promise1 = Promise.resolve(42);\n\
    const promise2 = Promise.reject(43);\n\npromise1.then(value => {\n    console.log(value);\
    \    // 42\n    return promise2;\n}).then(value => {\n    console.log(value);\
    \    // never called\n});\n```\n\nIn this example, the second fulfillment handler\
    \ is never called because `promise2` is rejected. You could, however, attach a\
    \ rejection handler instead:\n\n```javascript\nconst promise1 = Promise.resolve(42);\n\
    const promise2 = Promise.reject(43);\n\npromise1.then(value => {\n    console.log(value);\
    \    // 42\n    return promise2;\n}).catch(value => {\n    console.error(value);\
    \      // 43\n});\n```\n\nHere, the rejection handler is called as a result of\
    \ `promise2` being rejected. The rejected value `43` from `promise2` is passed\
    \ into that rejection handler.\n\nReturning a promise from a fulfillment handler\
    \ is helpful when an operation requires more than one promise to execute to completion.\
    \ For example, `fetch()` requires a second promise to read the body of a response.\
    \ To read a JSON body, you’ll need to use `json()`, which returns another promise.\
    \ Here’s how it looks without chaining:\n\n```javascript\nconst promise1 = fetch(\"\
    books.json\");\npromise1.then(response => {\n    promise2 = response.json();\n\
    \    promise2.then(payload => {\n        console.log(payload);\n    }).catch(reason\
    \ => {\n        console.error(reason);\n    });\n});\n```\n\nThis code requires\
    \ two rejection handlers to catch errors. Returning the second promise from the\
    \ fulfillment handler simplifies the code:\n\n```javascript\nconst promise = fetch(\"\
    books.json\");\npromise.then(response => {\n    return response.json();\n}).then(payload\
    \ => {\n    console.log(payload);\n}).catch(reason => {\n    console.error(reason);\n\
    });\n```\n\nHere, the first fulfillment handler is called when a response is received\
    \ and returns a promise to read the body. You need only one rejection handler\
    \ at the end to catch errors along the way.\n\nReturning a promise from a settlement\
    \ handler using `finally()` also exhibits some different behavior than `then()`\
    \ or `catch()`. First, if you return a fulfilled promise from a settlement handler,\
    \ that promise is ignored in favor of the original, as in this example:\n\n```javascript\n\
    const promise = Promise.resolve(42);\npromise.finally(() => {\n    return Promise.resolve(44);\n\
    }).then(value => {\n    console.log(value);    // 42\n});\n```\n\nIn this example,\
    \ the settlement handler returns a promise with `44`, but the returned promise\
    \ is fulfilled with the original value, which is `42`.\n\nHowever, if you return\
    \ a rejected promise from a settlement handler, then the returned promise adopts\
    \ that reason and the returned promise is rejected, like this:\n\n```javascript\n\
    const promise = Promise.resolve(42);\npromise.finally(() => {\n    return Promise.reject(43);\n\
    }).catch(reason => {\n    console.error(reason); // 43\n});\n```\n\nThis holds\
    \ true even if the original promise is rejected, as in this example:\n\n```javascript\n\
    const promise = Promise.reject(43);\npromise.finally(() => {\n    return Promise.reject(45);\n\
    }).catch(reason => {\n    console.log(reason); // 45\n});\n```\n\nReturning a\
    \ rejected promise from a settlement handler is functionally equivalent to throwing\
    \ an error: the returned promise is rejected with the specified reason.\n\nReturning\
    \ promises from fulfillment or rejection handlers doesn’t change when the promise\
    \ executors are executed. The first defined promise will run its executor first;\
    \ then the second promise executor will run, and so on. Returning promises simply\
    \ allows you to define additional responses to the promise results. You defer\
    \ the execution of fulfillment handlers by creating a new promise within a fulfillment\
    \ handler. For example:\n\n```javascript\nconst p1 = Promise.resolve(42);\np1.then(value\
    \ => {\n    console.log(value);    // 42\n    // create a new promise\n    const\
    \ p2 = new Promise((resolve, reject) => {\n        setTimeout(() => {\n      \
    \      resolve(43);\n        }, 500);\n    });\n    return p2;\n}).then(value\
    \ => {\n    console.log(value);    // 43\n});\n```\n"
