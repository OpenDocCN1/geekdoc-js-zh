    `fetch()` 函数是 JavaScript 运行时中常用的工具函数，用于发送网络请求。调用 `fetch()` 并不会立即完成网络请求；请求将在稍后完成。相反，该函数会返回一个
    promise 对象（在示例中存储在 `promise` 变量中，但你可以为它命名任何名称），代表该异步操作，以便你以后对其进行处理。你何时能够处理该结果完全取决于
    promise 的生命周期如何进展。


    # Promise 的生命周期


    每个 promise 都会经历一个短暂的生命周期，从 `pending`（等待中）状态开始，表示 promise 尚未完成。处于等待状态的 promise
    被视为未决定的（unsettled）。在上一个示例中，promise 在 `fetch()` 返回时立即处于 `pending` 状态。一旦 promise
    完成，它就会被视为已决（settled），并进入两种可能状态之一（见图 1-1）：


    - **Fulfilled**（已完成）：promise 成功完成。

    - **Rejected**（已拒绝）：promise 因为错误或其他原因未成功完成。


    ![](img/file1.png)


    图 1-1：Promise 状态


    内部属性 `[[PromiseState]]` 被设置为 `“pending”`、`“fulfilled”` 或 `“rejected”` 以反映 promise
    的状态。promise 对象并不暴露此属性，因此你无法通过编程判断 promise 处于哪种状态。但你可以通过 `then()` 方法在 promise 状态改变时执行特定操作。


    ## 使用 then() 分配处理器


    `then()` 方法存在于所有 promise 上，并接受两个参数。第一个参数是在 promise 成功完成时调用的函数，称为完成处理器（fulfillment
    handler）。与异步操作相关的任何额外数据都会传递给此函数。第二个参数是在 promise 被拒绝时调用的函数，称为拒绝处理器（rejection handler）。与完成处理器类似，拒绝处理器也会接收与拒绝（错误）相关的任何额外数据。


    任何以这种方式实现 `then()` 方法的对象都被称为 thenable（可类 promise 对象）。所有的 promise 都是 thenable，但并不是所有
    thenable 都是 promise。


    `then()` 的两个参数都是可选的，因此你可以监听完成和拒绝的任何组合。例如，考虑以下这组 `then()` 调用：


    ```javascript

    1 const promise = fetch ( “books.json” ); 2 3 // 添加一个完成和一个拒绝处理器 4 promise . then
    ( response => { 5     // 完成 6     console . log ( response . status ); 7 }, reason
    => { 8     // 拒绝 9     console . error ( reason . message ); 10 }); 11 12 // 再添加一个完成处理器
    13 promise . then ( response => { 14     // 完成 15     console . log ( response
    .statusText ); 16 }); 17 18 // 再添加一个拒绝处理器 19 promise . then ( null , reason =>
    { 20     // 拒绝 21     console . error ( reason . message ); 22 });

    ```


    所有三个 `then()` 调用都作用于同一个 promise。第一个调用同时分配了完成处理器和拒绝处理器。第二个调用只分配了完成处理器；错误不会被报告。第三个调用只分配了拒绝处理器且不会报告成功。


    `fetch()` 函数的一个特点是，只要它接收到 HTTP 状态码，返回的 promise 就会变为完成，即使是 404 或 500。只有当网络请求由于某种原因失败时，promise
    才会被拒绝。如果你想确保状态处于 200-299 范围内，可以检查 `response.ok` 属性，如示例所示：


    ```javascript

    1 const promise = fetch ( “books.json” ); 2 3 promise . then ( response => { 4     if
    ( response . ok ) { 5         console . log ( “Request succeeded.” ); 6     }
    else { 7         console . error ( “Request failed.” ); 8     } 9 });

    ```


    ## 使用 catch() 分配拒绝处理器


    Promise 还有一个 `catch()` 方法，当只传递拒绝处理器时，它的行为与 `then()` 相同。例如，以下 `catch()` 和 `then()`
    调用在功能上是等等的：


    ```javascript

    1 const promise = fetch ( “books.json” ); 2 3 promise . catch ( reason => { 4     //
    拒绝 5     console . error ( reason . message ); 6 }); 7 8 // 等同于： 9 10 promise
    . then ( null , reason => { 11     // 拒绝 12     console . error ( reason . message
    ); 13 });

    ```


    `then()` 和 `catch()` 的意图是让你结合使用它们，清晰地指示如何处理结果。这套系统比事件和回调更好，因为它让成功或失败变得完全清晰。（事件在发生错误时通常不会触发，而在回调中，你必须始终记得检查错误参数。）只需知道，如果你没有为被拒绝的
    promise 附加拒绝处理器，JavaScript 运行时将向控制台输出消息、抛出错误、或者两者兼有（取决于运行时）。


    ## 使用 finally() 分配终决处理器


    除了 `then()` 和 `catch()`，还有 `finally()`。传递给 `finally()` 的回调（称为终决处理器 settlement
    handler）无论成功失败都会被调用。与 `then()` 和 `catch()` 的回调不同，`finally()` 回调不接收任何参数，因为尚不清楚
    promise 是完成还是被拒绝。由于终决处理器在完成和拒绝时都会调用，它与使用 `then()` 同时传递完成和拒绝的处理器相似（但并不相同；将在第 2
    章进一步讨论）。如下所示：


    ```javascript

    1 const promise = fetch ( “books.json” ); 2 3 promise . finally (() => { 4     //
    无论成功失败都会 5     console . log ( “Settled” ); 6 }); 7 8 // 类似于： 9 10 const callback
    = () => { 11     console . log ( “Settled” ); 12 }; 13 14 promise . then ( callback
    , callback );

    ```


    只要你不访问传递给 `callback` 的参数，这两个示例的行为是相同的。但是，与 `catch()` 一样，使用 `finally()` 比起 `then()`
    意图更清晰。


    终决处理器适用于你想知道操作已完成但不关心结果的情况。例如，你可能希望在 `fetch()` 请求期间在网页上显示加载指示，并在请求完成后隐藏它。无论请求是否成功，加载指示都应该停止。在你的
    Web 应用中可能会如下代码：


    ```javascript

    1 const appElement = document . getById ( “app” ); 2 const promise = fetch ( “books.json”
    ); 3 4 appElement . classList . add ( “loading” ); 5 6 promise . then (() => {
    7     // 处理成功 8 }); 9 10 promise . catch (() => { 11     // 处理失败 12 }); 13 14
    promise . finally (() => { 15     appElement . classList . remove ( “loading”
    ); 16 });

    ```


    在这里，`appElement` 代表封装整个应用的 HTML 元素。通过 `fetch()` 初始化网络请求并向 HTML 元素添加 CSS 类 “loading”（允许根据需要更改样式）。当网络请求完成后，`promise`
    稳定，终决处理器移除 HTML 元素上的“loading”类以重置应用状态。你可以使用 `then()` 和 `catch()` 响应成功和失败，而 `finally()`
    仅处理状态变化。如果没有 `finally()`，你需要在完成和拒绝处理器中都移除“loading”类。


    通过 `finally()` 添加的终决处理器不会防止拒绝向控制台输出错误或抛出错误。在这种情况下，你仍然必须添加拒绝处理器以防止错误被抛出。


    ## 为已决定的 Promise 分配处理器


    即使在 promise 已经稳定之后添加完成、拒绝或终决处理器，它们仍然会被执行。这允许你在任何时候添加新的完成和拒绝处理器，并保证它们会被调用。例如：


