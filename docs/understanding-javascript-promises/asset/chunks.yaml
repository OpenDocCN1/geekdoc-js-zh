    into the rejection handler for the promise, where value + 1 is returned. Even
    though this return value is coming from a rejection handler, it is still used
    in the fulfillment handler of the next promise in the chain. The failure of one
    promise can allow recovery of the entire chain if necessary.


    Using finally() , however, results in a different behavior. Any value returned
    from a settlement handler is ignored so that you can access the original promise’s
    value. Here’s an example:


    1 const promise = Promise . resolve ( 42 ); 2 3 promise . finally (() => { 4  
      // settlement handler 5     return 43 ;                   // ignored! 6 }).
    then ( value => { 7     // fulfillment handler 8     console . log ( value );
            // 42 9 });


    The value passed to the fulfillment handler is 42 and not 43 . The return statement
    in the settlement handler is ignored so that the original value can be retrieved
    using then() . This is one of the consequences of finally() returning a promise
    whose state and value are copied from the original.


    Returning Promises in Promise Chains


    Returning primitive values from promise handlers allows passing of data between
    promises, but what if you return an object? If the object is a promise, then there’s
    an extra step that’s taken to determine how to proceed. Consider the following
    example:


    1 const promise1 = Promise . resolve ( 42 ); 2 const promise2 = Promise . resolve
    ( 43 ); 3 4 promise1 . then ( value => { 5     console . log ( value );     //
    42 6     return promise2 ; 7 }). then ( value => { 8     console . log ( value
    );     // 43 9 });


    In this code, promise1 resolves to 42 . The fulfillment handler for promise1 returns
    p2 , a promise already in the resolved state. The second fulfillment handler is
    called because promise2 has been fulfilled. If promise2 were rejected, a rejection
    handler (if present) would be called instead of the second fulfillment handler.


    The important thing to recognize about this pattern is that the second fulfillment
    handler is not added to promise2 , but rather to a third promise, making the previous
    example equivalent to this:


    1 const promise1 = Promise . resolve ( 42 ); 2 const promise2 = Promise . resolve
    ( 43 ); 3 4 const promise3 = promise1 . then ( value => { 5     console . log
    ( value );     // 42 6     return promise2 ; 7 }); 8 9 promise3 . then ( value
    => { 10     console . log ( value );     // 43 11 });


    Here, it’s clear that the second fulfillment handler is attached to promise3 rather
    than promise2 . This is a subtle but important distinction, as the second fulfillment
    handler will not be called if promise2 is rejected. For instance:


    1 const promise1 = Promise . resolve ( 42 ); 2 const promise2 = Promise . reject
    ( 43 ); 3 4 promise1 . then ( value => { 5     console . log ( value );     //
    42 6     return promise2 ; 7 }). then ( value => { 8     console . log ( value
    );     // never called 9 });


    In this example, the second fulfillment handler is never called because promise2
    is rejected. You could, however, attach a rejection handler instead:


    1 const promise1 = Promise . resolve ( 42 ); 2 const promise2 = Promise . reject
    ( 43 ); 3 4 promise1 . then ( value => { 5     console . log ( value );     //
    42 6     return promise2 ; 7 }). catch ( value => { 8     console . error ( value
    );   // 43 9 });


    Here, the rejection handler is called as a result of promise2 being rejected.
    The rejected value 43 from promise2 is passed into that rejection handler.


    Returning a promise from a fulfillment handler is helpful when an operation requires
    more than one promise to execute to completion. For example, fetch() requires
    a second promise to read the body of a response. To read a JSON body, you’ll need
    to use response.json() , which returns another promise. Here’s how it looks without
    using promise chaining:


    1 const promise1 = fetch ( “books.json” ); 2 3 promise1 . then ( response => {
    4 5     promise2 = response . json (); 6     promise2 . then ( payload => { 7
            console . log ( payload ); 8     }). catch ( reason => { 9         console
    . error ( reason . message ); 10     }); 11 12 }). catch ( reason => { 13    
    console . error ( reason . message ); 14 });


    This code requires two different rejection handlers to catch the potential errors
    at two different steps of the process. Returning the second promise from the first
    fulfillment handler simplifies the code:


    1 const promise = fetch ( “books.json” ); 2 3 promise . then ( response => { 4
        return response . json (); 5 }). then ( payload => { 6     console . log (
    payload ); 7 }). catch ( reason => { 8     console . error ( reason . message
    ); 9 });


    Here, the first fulfillment handler is called when a response is received and
    then returns a promise to read the response body as JSON. The second fulfillment
    handler is called when the body has been read and the payload is ready to be used.
    You need only one rejection handler at the end of the promise chain to catch errors
    that occur along the way.


    Returning a promise from a settlement handler using finally() also exhibits some
    different behavior than using then() or catch() . First, if you return a fulfilled
    promise from a settlement handler, then that promise is ignored in favor of the
    value from the original promise, as in this example:


    1 const promise = Promise . resolve ( 42 ); 2 3 promise . finally (() => { 4  
      return Promise . resolve ( 44 ); 5 }). then ( value => { 6     console . log
    ( value );     // 42 7 });


    In this example, the settlement handler returns a promise that is fulfilled with
    44 , but the returned promise is fulfilled with the original promise’s value,
    which is 42 .


    However, if you return a rejected promise from a settlement handler, then the
    returned promise adopts that reason and the returned promise is rejected, like
    this:


    1 const promise = Promise . resolve ( 42 ); 2 3 promise . finally (() => { 4  
      return Promise . reject ( 43 ); 5 }). catch ( reason => { 6     console . error
    ( reason );   // 43 7 });


    This holds true even if the original promise is rejected, as in this example:


    1 const promise = Promise . reject ( 43 ); 2 3 promise . finally (() => { 4  
      return Promise . reject ( 45 ); 5 }). catch ( reason => { 6     console . log
    ( reason );     // 45 7 });


    Returning a rejected promise from a settlement handler is functionally equivalent
    to throwing an error: the returned promise is rejected with the specified reason.


    Returning promises from fulfillment or rejection handlers doesn’t change when
    the promise executors are executed. The first defined promise will run its executor
    first; then the second promise executor will run, and so on. Returning promises
    simply allows you to define additional responses to the promise results. You defer
    the execution of fulfillment handlers by creating a new promise within a fulfillment
    handler. For example:


    1 const p1 = Promise . resolve ( 42 ); 2 3 p1 . then ( value => { 4     console
    . log ( value );     // 42 5 6     // create a new promise 7     const p2 = new
    Promise (( resolve , reject ) => { 8         setTimeout (() => { 9            
    resolve ( 43 ); 10         }, 500 ); 11     }); 12 13     return p2 ; 14 }). then
    ( value => { 15     console . log ( value );     // 43 16 });'
