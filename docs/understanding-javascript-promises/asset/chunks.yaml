- fmt: "\n```javascript\nconst promise = fetch ( “books.json” );\n// original fulfillment\
    \ handler\npromise .then ( response => {\n    console . log ( response .status\
    \ );\n\n    // now add another\n    promise .then ( response => {\n        console\
    \ . log ( response .statusText );\n    });\n});\n```\n\nIn this code, the fulfillment\
    \ handler adds another fulfillment handler to the same `promise`. The `promise`\
    \ is already fulfilled at this point, so the new fulfillment handler is added\
    \ to the microtask queue and called when ready. Rejection and settlement handlers\
    \ work the same way.\n\n## Handlers and Microtasks\n\nJavaScript executed in the\
    \ regular flow of a program is executed as a task, which is to say that the JavaScript\
    \ runtime has created a new execution context and executes the code completely,\
    \ exiting when finished. As an example, an `onclick` handler for a button in a\
    \ web page is executed as a task. When the button is clicked, a new task is created\
    \ and the `onclick` handler is executed. Once complete, the JavaScript runtime\
    \ waits for the next interaction to execute more code. Promise handlers, however,\
    \ are executed in a different way.\n\nAll promise handlers, whether fulfillment,\
    \ rejection, or settlement, are executed as microtasks inside of the JavaScript\
    \ engine. Microtasks are queued and then executed immediately after the currently\
    \ running task has completed, before the JavaScript runtime becomes idle. Calling\
    \ `then()`, `catch()`, or `finally()` tells a `promise` to queue the specified\
    \ microtasks once the `promise` is settled.\n\nThis is different than creating\
    \ timers using `setTimeout()` or `setInterval()`, both of which create new tasks\
    \ to be executed at a later point in time. Queued promise handlers will always\
    \ execute before timers that are queued in the same task. You can test this for\
    \ yourself by using the global `queueMicrotask()` function, which is used to create\
    \ microtasks outside of promises:\n\n```javascript\nsetTimeout (() => {\n    console\
    \ . log ( “timer” );\n\n    queueMicrotask (() => {\n        console . log ( “microtask\
    \ in timer” );\n    });\n}, 0 );\n\nqueueMicrotask (() => {\n    console . log\
    \ ( “microtask” );\n});\n```\n\nIn this code, a timer is created with a delay\
    \ of 0 milliseconds, and inside of that timer a new microtask is created. Also,\
    \ a microtask is created outside of the timer. When this code executes, you will\
    \ see the following output to the console:\n\nmicrotask\ntimer\nmicrotask in timer\n\
    \nEven though the timer is set for a delay of 0 milliseconds, the microtask executes\
    \ first, followed by the timer, followed by the microtask inside of the timer.\n\
    \nThe most important thing to remember about microtasks, including all promise\
    \ handlers, is that they are executed as soon as possible once a task is complete.\
    \ This minimizes the amount of time between a `promise` settling and the reaction\
    \ to the settling, making promises suitable for situations where runtime performance\
    \ is important.\n\n## Creating New (Unsettled) Promises\n\nNew promises are created\
    \ using the `Promise` constructor. This constructor accepts a single argument:\
    \ a function called the `executor`, which contains the code to initialize the\
    \ `promise`. The `executor` is passed two functions named `resolve()` and `reject()`\
    \ as arguments. You call the `resolve()` function when the `executor` has finished\
    \ successfully to signal that the `promise` is resolved or the `reject()` function\
    \ to indicate that the operation has failed.\n\nHere’s an example using the old\
    \ `XMLHttpRequest` browser API:\n\n```javascript\n// Browser example\nfunction\
    \ requestURL ( url ) {\n    return new Promise (( resolve , reject ) => {\n\n\
    \        const xhr = new XMLHttpRequest ();\n\n        // assign event handlers\n\
    \        xhr .addEventListener ( “load” , () => {\n            resolve ({\n  \
    \              status : xhr .status ,\n                text : xhr . responseText\n\
    \            });\n        });\n\n        xhr . addEventListener ( “error” , error\
    \ => {\n            reject ( error );\n        });\n\n        // send the request\n\
    \        xhr . open ( “get” , url );\n        xhr . send ();\n    });\n}\n\nconst\
    \ promise = requestURL ( “books.json” );\n\n// listen for both fulfillment and\
    \ rejection\npromise .then ( response => {\n    // fulfillment\n    console .\
    \ log ( response .status );\n}, error => {\n    // rejection\n    console . log\
    \ ( error );\n });\n```\n\nIn this example, the `XMLHttpRequest` object is wrapped\
    \ in a `promise`. The `promise` remains unsettled until the `xhr` request completes.\
    \ If the `load` event triggers, `resolve()` is called with the response data.\
    \ If the `error` event triggers, `reject()` is called. \n\nOne important aspect\
    \ of executors is that they run immediately upon creation. For example, consider\
    \ what happens if you call `resolve()` inside an executor:\n\n```javascript\n\
    const promise = new Promise (( resolve , reject ) => {\n    console . log ( “Executor”\
    \ );\n    resolve ( 42 );\n});\n\npromise .then ( result => {\n    console . log\
    \ ( result );\n});\n\nconsole . log ( “Hi!” );\n```\n\nHere, the `promise` is\
    \ resolved immediately, and even though the fulfillment handler is added, the\
    \ output will be:\n\nExecutor\nHi!\n42\n\nThe `executor` is run first, outputting\
    \ “Executor”. Next, the fulfillment handler is assigned but is not executed until\
    \ the script job completes. A `promise` can only be resolved once, so if you call\
    \ `resolve()` more than once inside an `executor`, every call after the first\
    \ is ignored.\n\n### Executor Errors\n\nIf an error is thrown inside an `executor`,\
    \ then the `promise`’s rejection handler is called. For example:\n\n```javascript\n\
    const promise = new Promise (( resolve , reject ) => {\n    throw new Error (\
    \ “Uh oh!” );\n});\n\npromise .catch ( reason => {\n    console . log ( reason\
    \ .message );\n});\n```\n\nIn this code, the `executor` intentionally throws an\
    \ error. There is an implicit `try-catch` inside every `executor` so that the\
    \ error is caught and then passed to the rejection handler. The previous example\
    \ is equivalent to:\n\n```javascript\nconst promise = new Promise (( resolve ,\
    \ reject ) => {\n    try {\n        throw new Error ( “Uh oh!” );\n    } catch\
    \ ( ex ) {\n        reject ( ex );\n    }\n});\n```\n\nThe `executor` handles\
    \ catching any thrown errors to simplify this common use case, and just like other\
    \ rejections, the JavaScript engine throws an error and stops execution if no\
    \ rejection handler is assigned.\n\n## Creating Settled Promises\n\nThe `Promise`\
    \ constructor is the best way to create unsettled promises due to the dynamic\
    \ nature of what the promise executor does. But if you want a `promise` to represent\
    \ a previously computed value, then it doesn’t make sense to create an executor\
    \ that simply passes a value to the `resolve()` or `reject()` function. Instead,\
    \ there are two methods that create settled promises given a specific value.\n\
    \nUsing `Promise.resolve()`\n"
