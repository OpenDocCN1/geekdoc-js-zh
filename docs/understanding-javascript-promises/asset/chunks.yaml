    \            }\n        })\n        .catch(reason => console.error(reason.message));\n\
    }\n```\n\n`retrieveJsonData()` 函数返回一个 promise，该 promise 解析为 `fetch()` 调用响应中的 JSON\
    \ 数据。此外还有一个 true 拒绝处理器来打印任何错误消息。以下是如何将该函数重写为使用 `await` 的 `async` 函数：\n\n```javascript\n\
    async function retrieveJsonData(url) {\n    try {\n        const response = await\
    \ fetch(url);\n        if (response.ok) {\n            return await response.json();\n\
    \        } else {\n            throw new Error(`Unexpected status code: ${response.status}\
    \ ${response.statusText}`);\n        }\n    } catch (error) {\n        console.error(error.message);\n\
    \    }\n}\n```\n\n在重写后的 `retrieveJsonData()` 版本中，`await fetch(url)` 的调用处理了返回 promise\
    \ 的履行和拒绝处理器的定义。变量 `response` 被赋值为该 promise 的已履行值（如果成功），而拒绝则抛出一个由 `try-catch` 语句捕获的错误。该函数仍然返回一个解析为\
    \ JSON 数据的 promise，但它是通过返回 `response.json()`（另一个 promise）的履行值来实现的。如果 `response.json()`\
    \ 中触发了拒绝，那么它也会作为错误被抛出并在 `try-catch` 语句中捕获。\n\n你可能会奇怪，既然 `response.json()` 是一个\
    \ promise，为什么不直接返回它而不使用 `await` ？例如：\n\n```javascript\nasync function retrieveJsonData(url)\
    \ {\n    try {\n        const response = await fetch(url);\n        if (response.ok)\
    \ {\n            return response.json();\n        } else {\n            throw\
    \ new Error(`Unexpected status code: ${response.status} ${response.statusText}`);\n\
    \        }\n    } catch (error) {\n        console.error(error.message);\n   \
    \ }\n}\n```\n\n当 `response.json()` 成功时，它的工作与之前的示例相同；然而，当 `response.json()` 失败时，该拒绝不会作为错误抛出，也不会被\
    \ `try-catch` 捕获。是 `await` 表达式导致了拒绝作为错误抛出，因此如果你省略了 `await`，promise 的拒绝只能被拒绝处理器捕获。在这个示例中，拒绝处理器必须由调用此函数的代码添加，如下：\n\
    \n```javascript\nasync function retrieveJsonData(url) {\n    try {\n        const\
    \ response = await fetch(url);\n        if (response.ok) {\n            return\
    \ response.json();\n        } else {\n            throw new Error(`Unexpected\
    \ status code: ${response.status} ${response.statusText}`);\n        }\n    }\
    \ catch (error) {\n        console.error(error.message);\n    }\n}\nretrieveJsonData(\"\
    https://api.com/users\")\n    .then(data => doSomething(data))\n    .catch(reason\
    \ => console.error(reason.message));\n```\n\n这两种场景都有合理的用例，某些场景你想在 `async` 函数内部捕获错误，而某些场景你希望错误流到外部。\n\
    \n## 在非 promise 上使用 await Expressions\n\n你也可以对非 promise 值使用 `await`，因为该值始终通过 `Promise.resolve()`\
    \ 传递。这意味着 promise 被直接传递，非 promise 被解析为 promise，而其他值则被包装在 promise 中。例如：\n\n```javascript\n\
    async function getMeaningOfLife() {\n    return await 42;\n}\ngetMeaningOfLife().then(value\
    \ => console.log(value));\n```\n\n此代码中的 `getMeaningOfLife()` 函数返回一个解析为值 `42` 的\
    \ promise。你可以通过如下方式重写之前的示例在不使用 `async` 函数的情况下实现相同的功能：\n\n```javascript\nfunction\
    \ getMeaningOfLife() {\n    return Promise.resolve(42);\n}\ngetMeaningOfLife().then(value\
    \ => console.log(value));\n```\n\n`await` 处理非 promise 值意味着即使你猜错了所使用的值也不会受到惩罚。\n\
    \n## 在多个 promise 上使用 await Expressions\n\n尽管 `await` 表达式作用于单个 promise，但你可以利用内置的\
    \ promise 方法来有效地处理多个 promise。例如，如果你想等待数组中的每个 promise 都履行，可以使用 `await` 配合 `Promise.all()`：\n\
    \n```javascript\nasync function doSomething() {\n    try {\n        return await\
    \ Promise.all([\n            promise1,\n            promise2,\n            promise3\n\
    \        ]);\n    } catch (error) {\n        console.error(error.message);\n \
    \   }\n}\n```\n\n代码中，，await` 使用在 `Promise.all()` 的结果上，导致函数等待所有 promise 都履行，或者其中一个被拒绝（此时会抛出错误）。在函数等待时，三个\
    \ promise 可以并行履行。这是一个在 Node.js 中读取多个文件的示例：\n\n```javascript\nimport { readFile\
    \ } from \"node:fs/promises\";\n\nasync function readFiles(filenames) {\n    const\
    \ fileContents = await Promise.all(\n        filenames.map(filename => readFile(filename,\
    \ \"utf8\"))\n    );\n\n    return fileContents.map(\n        fileContent => JSON.parse(fileContent)\n\
    \    );\n}\n\nreadFiles([\n    \"file1.json\",\n    \"file2.json\"\n]).then(data\
    \ => {\n    // 根据需要处理\n    console.log(data);\n}).catch(reason => {\n    console.error(reason.message);\n\
    });\n```\n\n`readFiles()` async 函数使用 `await` 配合 `Promise.all()` 来等待所有文件读取完毕。然后可以将文件内容解析为\
    \ JSON，以最适合处理的格式返回数据。\n\n当然，你也可以将 `await` 用于 `Promise.allSettled()`、`Promise.any()`、`Promise.race()`\
    \ 或任何其他返回 promise 的函数。\n\n"
- fmt: "\n# Using the for-await-of Loop\n\nAnother special syntax enabled inside async\
    \ functions is the `for-await-of` loop, which allows you to retrieve values from\
    \ an iterable or an async iterable. An iterable is an object with a `Symbol.iterator`\
    \ method that returns an iterator; an async iterable is an object with a `Symbol.asyncIterator`\
    \ method that returns an iterator whose values are always promises. The `for-await-of`\
    \ loop calls `Promise.resolve()` on each value returned from an iterable and then\
    \ waits for each promise to resolve before continuing to the next iteration of\
    \ the loop.\n\nThe most often used iterables in JavaScript are arrays, and so\
    \ you can use an array of promises with a `for-await-of` loop to process promises\
    \ in sequence, as in this example:\n\n```javascript\nconst promise1 = Promise.resolve(1);\n\
    const promise2 = Promise.resolve(2);\nconst promise3 = Promise.resolve(3);\n\n\
    for await (const value of [promise1, promise2, promise3]) {\n    console.log(value);\n\
    }\n```\n\nThis example processes `promise1`, `promise2`, and `promise3` in that\
    \ order. Even though these are settled promises, the `for-await-of` loop works\
    \ on unsettled promises as well. And because the `for-await-of` loop always calls\
    \ `Promise.resolve()` on any value retrieved from an iterable, you can use it\
    \ directly on arrays, like this:\n\n```javascript\nfor await (const value of [1,\
    \ 2, 3]) {\n    console.log(value);\n}\n```\n\nEven though there are no promises\
    \ in the array in this example, the `for-await-of` loop will still work.\n\nThe\
    \ most often used async iterables in Node.js are `ReadStream` objects. A `ReadStream`\
    \ object is used to periodically read data from a source where all of the data\
    \ may not be available. For network requests, reading large files, or event streams,\
    \ `ReadStream` objects are a convenient way to work with such data. Here’s an\
    \ example:\n\n```javascript\nimport fs from \"node:fs\";\n\nasync function readCompleteTextStream(readable)\
    \ {\n    readable.setEncoding(\"utf8\");\n\n    let data = \"\";\n    for await\
    \ (const chunk of readable) {\n        data += chunk;\n    }\n\n    return data;\n\
    }\n\nconst stream = fs.createReadStream(\"data.txt\");\nreadCompleteTextStream(stream)\n\
    \    .then(text => console.log(text));\n```\n\nThe `readCompleteTextStream()`\
    \ function accepts a `ReadStream` object called `readable` as a parameter. The\
    \ first step to reading a text file is to set the encoding to \"utf8\" using the\
    \ `setEncoding()` method. Then, a `for-await-of` loop iterates over the data read\
    \ from `readable`. If the file is short, then there may only be one chunk of data;\
    \ if the file is long, then there will likely be multiple chunks of data. Using\
    \ the `for-await-of` loop allows you to not worry about the number of chunks being\
    \ returned.\n\nSimilar to the `await` expression, a `for-await-of` loop throws\
    \ an error if any of the promises returned from the async iterable are rejected.\
    \ You can catch that error with a `try-catch` statement inside of the async function,\
    \ such as:\n\n```javascript\nimport fs from \"node:fs\";\n\nasync function readCompleteTextStream(readable)\
    \ {\n    readable.setEncoding(\"utf8\");\n\n    try {\n        let data = \"\"\
    ;\n        for await (const chunk of readable) {\n            data += chunk;\n\
    \        }\n        return data;\n    } catch (error) {\n        console.error(error.message);\n\
    \    }\n}\n\nconst stream = fs.createReadStream(\"data.txt\");\nreadCompleteTextStream(stream)\n\
    \    .then(text => console.log(text));\n```\n\nIn this example, the `readCompleteTextStream()`\
    \ function accepts a `ReadStream` object called `readable` as a parameter.\n\n\
    ## Top-Level Await\n\nYou can use top-level await outside of async functions in\
    \ JavaScript modules.\n\n```javascript\n// static import\nimport something from\
    \ \"./file.js\";\n\n// dynamic import\nconst somethingElse = await import(\"./another-file.js\"\
    );\n```\n\nWhen the JavaScript engine encounters top-level await, the module execution\
    \ is paused until the promise is settled. This allows you to use top-level await\
    \ in the module level. Note that top-level await is not available in scripts.\n\
    \n## Summary\n\n- Async functions allow you to use promises without manually assigning\
    \ handlers.\n- The return value of an async function is always a promise. If you\
    \ return a promise from the async function, it is returned to the call site; if\
    \ you return a non-promise value, then it is resolved to a promise.\n- Errors\
    \ thrown inside an async function are caught and returned as a rejected promise.\
    \ Due to this behavior, you cannot catch errors using `try-catch`; instead, you\
    \ need to assign a rejection handler to the returned promise.\n- Async functions\
    \ enable two special types of syntax: the `await` expression and the `for-await-of`\
    \ loop. The `await` expression is used to automatically assign fulfillment and\
    \ rejection handlers to a promise such that the fulfillment value becomes the\
    \ return value of the `await` expression and a rejection causes an error to be\
    \ thrown. Similarly, the `for-await-of` loop operates on an async iterable and\
    \ allows the use of promises instead of a loop. The `for-await-of` loop waits\
    \ for each promise returned from the async iterable to fulfill before going on\
    \ to the next promise. If a promise from the async iterable is rejected, then\
    \ an error is thrown.\n- You can use top-level await expressions outside of async\
    \ functions in JavaScript modules. This capability is not available in scripts.\n\
    \n## 5. Unhandled Rejection Tracking\n\nDetermining whether a promise rejection\
    \ was handled isn’t straightforward due to the nature of promises. For instance,\
    \ consider this example:\n\n```javascript\nlet rejected = Promise.reject(42);\n\
    \n// at this point, rejected is unhandled\nsetTimeout(() => {\n    rejected.catch(value\
    \ => {\n        // now rejected has been handled\n        console.log(value);\n\
    \    });\n}, 5000);\n```\n"
  raw: 'Using the for-await-of Loop


    Another special syntax enabled inside async functions is the for-await-of loop,
    which allows you to retrieve values from an iterable or an async iterable. An
    iterable is an object with a Symbol.iterator method that returns an iterator;
    an async iterable is an object with a Symbol.asyncIterator method that returns
    an iterator whose values are always promises. The for-await-of loop calls Promise.resolve()
    on each value returned from an iterable and then waits for each promise to resolve
    before continuing to the next iteration of the loop.


    The most often used iterables in JavaScript are arrays, and so you can use an
    array of promises with a for-await-of loop to process promises in sequence, as
    in this example:


    1 const promise1 = Promise . resolve ( 1 ); 2 const promise2 = Promise . resolve
    ( 2 ); 3 const promise3 = Promise . resolve ( 3 ); 4 5 for await ( const value
    of [ promise1 , promise2 , promise3 ]) { 6     console . log ( value ); 7 }


    This example processes promise1 , promise2 , and promise3 in that order. Even
    though these are settled promises, the for-await-of loop works on unsettled promises
    as well. And because the for-await-of loop always calls Promise.resolve() on any
    value retrieved from an iterable, you can use it directly on arrays, like this:


    1 for await ( const value of [ 1 , 2 , 3 ]) { 2     console . log ( value ); 3
    }


    Even though there are no promises in the array in this example, the for-await-of
    loop will still work.


    The most often used async iterables in Node.js are ReadStream objects. A ReadStream
    object is used to periodically read data from a source where all of the data may
    not be available. For network requests, reading large files, or event streams,
    ReadStream objects are a convenient way to work with such data. Here’s an example:


    1 import fs from “node:fs” ; 2 3 async function readCompleteTextStream ( readable
    ) { 4     readable . setEncoding ( “utf8” ); 5 6     let data = “” ; 7     for
    await ( const chunk of readable ) { 8         data += chunk ; 9     } 10     11
        return data ; 12 } 13 14 const stream = fs . createReadStream ( “data.txt”
    ); 15 readCompleteTextStream ( stream ) 16     . then ( text => console . log
    ( text ));


    The readCompleteTextStream() function accepts a ReadStream object called readable
    as a parameter. The first step to reading a text file is to set the encoding to
    “utf8” using the setEncoding() method. Then, a for-await-of loop iterates over
    the data read from readable . If the file is short, then there may only be one
    chunk of data; if the file is long, then there will likely be multiple chunks
    of data. Using the for-await-of loop allows you to not worry about the number
    of chunks being returned.


    Similar to the await expression, a for-await-of loop throws an error if any of
    the promises returned from the async iterable are rejected. You can catch that
    error with a try-catch statement inside of the async function, such as:


    1 import fs from “node:fs” ; 2 3 async function readCompleteTextStream ( readable
    ) { 4     readable . setEncoding ( “utf8” ); 5 6     try { 7         let data
    = “” ; 8         for await ( const chunk of readable ) { 9             data +=
    chunk ; 10         } 11         return data ; 12     } catch ( error ) { 13  
          console . error ( error . message ); 14     } 15 } 16 17 const stream =
    fs . createReadStream ( “data.txt” ); 18 readCompleteTextStream ( stream ) 19
        . then ( text => console . log ( text ));


    In this example, the first rejected promise in the for-await-of loop causes an
    error to be thrown. The try-catch statement can then catch the error and log it
    to the console. Without the try-catch statement, a rejected promise in the for-await-of
    loop will be caught and returned as a rejected promise from the readCompleteTextStream()
    function.


    Top-Level Await Expressions


    You can also use await at the top level of a JavaScript module outside of an async
    function. Essentially, a JavaScript module acts as an async function wrapped around
    the entire module by default. This allows you to call promise-based functions
    directly, such as using the import() function:


    1 // static import 2 import something from “./file.js” ; 3 4 // dynamic import
    5 const filename = “./another-file.js” ; 6 const somethingElse = await import
    ( filename );


    Using top-level await , you can load modules dynamically alongside the statically
    loaded modules. (Dynamically loaded modules allow you to construct the module
    specifier dynamically, as well, which is not possible with static import .) This
    example uses both a static import and a dynamic import to illustrate the difference.


    When the JavaScript engine encounters a top-level await , the JavaScript module
    execution is paused until the promise is settled. If the parent module of the
    paused module has static imports to process then those can continue even while
    the sibling module using top-level await is paused. The order in which the sibling
    modules are loaded cannot be guaranteed in this situation, but that order should
    not matter in most situations.


    Top-level await expressions cannot be used in JavaScript scripts. In order to
    use top-level await , you must load your JavaScript code using import.


    Summary


    Async functions allow you to use promises without manually assigning fulfillment
    and rejection handlers. You can turn any function into an async function by adding
    the async keyword before the function definition.


    The return value of an async function is always a promise. If you return a promise
    from the async function, then it is duplicated and returned to the call site;
    if you return a non-promise value, then the value is resolved to a promise and
    returned to the call site.


    Errors thrown inside an async function are caught and returned as a rejected promise.
    Due to this behavior, you cannot catch errors originating in an async function
    using try-catch ; instead, you need to assign a rejection handler to the returned
    promise.


    Async functions enable two special types of syntax: the await expression and the
    for-await-of loop. The await expression is used to automatically assign fulfillment
    and rejection handlers to a promise such that the fulfillment value becomes the
    return value of the await expression and a rejection causes an error to be thrown.
    Similarly, the for-await-of loop operates on an async iterable and allows the
    use of promises instead of a loop. The for-await-of loop waits for each promise
    returned from the async iterable to fulfill before going on to the next promise.
    If a promise from the async iterable is rejected, then an error is thrown.


    You can use top-level await expressions outside of async functions at the top
    level of JavaScript modules. This capability is not available in scripts.


    5.  Unhandled Rejection Tracking


    In the first generation of promises, a rejected promise without a rejection handler
    would silently fail. Many considered this the biggest flaw in the specification
    as it was the only part of the JavaScript language that didn’t make errors apparent.
    Later, JavaScript runtimes instituted console warnings to at least notify developers
    when unhandled rejections occurred, and some decided to throw errors. Eventually,
    unhandled rejection tracking was added into the JavaScript specification.


    Detecting Unhandled Rejections


    Determining whether a promise rejection was handled isn’t straightforward due
    to the nature of promises. For instance, consider this example:


    1 let rejected = Promise . reject ( 42 ); 2 3 // at this point, rejected is unhandled
    4 5 setTimeout (() => { 6     7     rejected . catch ( value => { 8         //
    now rejected has been handled 9         console . log ( value ); 10     }); 11
    12 }, 5000 );'
