    of ways to chain promises together to accomplish more complex asynchronous behavior.


    Each call to then() , catch() , or finally() actually creates and returns another
    promise. This second promise is settled only once the first has been fulfilled
    or rejected. Consider this example:


    1 const promise = Promise . resolve ( 42 ); 2 3 promise . then ( value => { 4
        console . log ( value ); 5 }). then (() => { 6     console . log ( “Finished”
    ); 7 });


    The code outputs:


    1 42 2 Finished


    The call to promise.then() returns a second promise on which then() is called.
    The second then() fulfillment handler is only called after the first promise has
    been resolved. If you unchain this example, it looks like this:


    1 const promise1 = Promise . resolve ( 42 ); 2 3 const promise2 = promise1 . then
    ( value => { 4     console . log ( value ); 5 }); 6 7 promise2 . then (() => {
    8     console . log ( “Finished” ); 9 });


    In this unchained version of the code, the result of promise1.then() is stored
    in promise2 , and then promise2.then() is called to add the final fulfillment
    handler. The call to promise2.then() also returns a promise. This example just
    doesn’t use that promise.


    Catching Errors


    Promise chaining allows you to catch errors that may occur in a fulfillment or
    rejection handler from a previous promise. For example:


    1 const promise = Promise . resolve ( 42 ); 2 3 promise . then ( value => { 4
        throw new Error ( “Oops!” ); 5 }). catch ( reason => { 6     console . error
    ( reason . message );     // “Oops!” 7 });'
