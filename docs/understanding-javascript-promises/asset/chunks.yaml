  raw: 'The fetch() function is a common utility function in JavaScript runtimes that
    makes network requests. The call to fetch() doesn’t actually complete a network
    request immediately; that will happen later. Instead, the function returns a promise
    object (stored in the promise variable in this example, but you can name it whatever
    you want) representing the asynchronous operation so you can work with it in the
    future. Exactly when you’ll be able to work with that result depends entirely
    on how the promise’s lifecycle plays out.


    The Promise Lifecycle


    Each promise goes through a short lifecycle starting in the pending state, which
    indicates that promise hasn’t completed yet. A pending promise is considered unsettled
    . The promise in the previous example is in the pending state as soon as the fetch()
    function returns it. Once the promise completes, the promise is considered settled
    and enters one of two possible states (see Figure 1-1):


    Fulfilled : The promise has completed successfully.


    Rejected : The promise didn’t complete successfully due to either an error or
    some other cause.


    ![](media/file1.png)


    Figure 1-1: Promise states


    An internal [[PromiseState]] property is set to “pending” , “fulfilled” , or “rejected”
    to reflect the promise’s state. This property isn’t exposed on promise objects,
    so you can’t determine which state the promise is in programmatically. But you
    can take a specific action when a promise changes state by using the then() method.


    Assigning Handlers with then()


    The then() method is present on all promises and takes two arguments. The first
    argument is a function to call when the promise is fulfilled, called the fulfillment
    handler . Any additional data related to the asynchronous operation is passed
    to this function. The second argument is a function to call when the promise is
    rejected, called the rejection handler . Similar to the fulfillment handler, the
    rejection handler is passed any additional data related to the rejection.


    Any object that implements the then() method in this way is called a thenable
    . All promises are thenables, but not all thenables are promises.


    Both arguments to then() are optional, so you can listen for any combination of
    fulfillment and rejection. For example, consider this set of then() calls:


    1 const promise = fetch ( “books.json” ); 2 3 // add a fulfillment and rejection
    handler 4 promise . then ( response => { 5     // fulfillment 6     console .
    log ( response . status ); 7 }, reason => { 8     // rejection 9     console .
    error ( reason . message ); 10 }); 11 12 // add another fulfillment handler 13
    promise . then ( response => { 14     // fulfillment 15     console . log ( response
    . statusText ); 16 }); 17 18 // add another rejection handler 19 promise . then
    ( null , reason => { 20     // rejection 21     console . error ( reason . message
    ); 22 });


    All three then() calls operate on the same promise. The first call assigns both
    a fulfillment and a rejection handler. The second only assigns a fulfillment handler;
    errors won’t be reported. The third just assigns a rejection handler and doesn’t
    report success.


    One quirk of the fetch() function is that the returned promise is fulfilled whenever
    it receives an HTTP status, even 404 or 500\. The promise is only rejected when
    the network request fails for some reason. If you want to ensure that the status
    is in the 200-299 range, you can check the response.ok property, as in this example:


    1 const promise = fetch ( “books.json” ); 2 3 promise . then ( response => { 4
        if ( response . ok ) { 5         console . log ( “Request succeeded.” ); 6
        } else { 7         console . error ( “Request failed.” ); 8     } 9 });


    Assigning Rejection Handlers with catch()


    Promises also have a catch() method that behaves the same as then() when only
    a rejection handler is passed. For example, the following catch() and then() calls
    are functionally equivalent:


    1 const promise = fetch ( “books.json” ); 2 3 promise . catch ( reason => { 4
        // rejection 5     console . error ( reason . message ); 6 }); 7 8 // is the
    same as: 9 10 promise . then ( null , reason => { 11     // rejection 12     console
    . error ( reason . message ); 13 });


    The intent behind then() and catch() is for you to use them in combination to
    clearly indicate how a result is handled. This system is better than events and
    callbacks because it makes success or failure completely clear. (Events tend not
    to fire when there’s an error, and in callbacks you must always remember to check
    the error argument.) Just know that if you don’t attach a rejection handler to
    a promise that is rejected, then the JavaScript runtime will output a message
    to the console, or throw an error, or both (depending on the runtime).


    Assigning Settlement Handlers with finally()


    To go along with then() and catch() there is also finally() . The callback passed
    to finally() (called a settlement handler ) is called regardless of success or
    failure. Unlike the callbacks for then() and catch() , finally() callbacks do
    not receive any arguments because it isn’t clear whether the promise was fulfilled
    or rejected. Because the settlement handler is called both on fulfillment and
    rejection, it is similar (but not the same; discussed further in Chapter 2) to
    passing the handler for both fulfillment and rejection using then() . Here’s an
    example:


    1 const promise = fetch ( “books.json” ); 2 3 promise . finally (() => { 4    
    // no way to know if fulfilled or rejected 5     console . log ( “Settled” );
    6 }); 7 8 // is similar to: 9 10 const callback = () => { 11     console . log
    ( “Settled” ); 12 }; 13 14 promise . then ( callback , callback );


    As long as you don’t access the argument passed to callback , the behavior between
    these two examples is the same. However, as with catch() , using finally() makes
    your intention clearer as compared to then() .


    Settlement handlers are useful when you want to know that an operation has completed
    and you don’t care about the result. As an example, you may want to display a
    loading indicator on a web page while a fetch() request is active and then hide
    it when the request is complete. It doesn’t matter if the request was successful
    or not because the loading indicator should stop once the request is complete.
    You might have code like this in your web application:


    1 const appElement = document . getElementById ( “app” ); 2 const promise = fetch
    ( “books.json” ); 3 4 appElement . classList . add ( “loading” ); 5 6 promise
    . then (() => { 7     // handle success 8 }); 9 10 promise . catch (() => { 11
        // handle failure 12 }); 13 14 promise . finally (() => { 15     appElement
    . classList . remove ( “loading” ); 16 });


    Here, appElement represents the HTML element that wraps the entire application
    on the page. A network request is initiated using fetch() and the CSS class “loading”
    is added to the HTML element (allowing you to change any styles as appropriate).
    When the network request completes, promise is settled and the settlement handler
    removes the “loading” class from the HTML element to reset the application state.
    You can still respond to success and failure using then() and catch() while finally()
    solely handles the state change. Without finally() , you would need to remove
    the “loading” class in both the fulfillment and rejection handlers.


    The settlement handlers added with finally() do not prevent rejections from outputting
    an error to the console or throwing an error. You must still add a rejection handler
    to prevent the error from being thrown in that case.


    Assigning Handlers to Settled Promises


