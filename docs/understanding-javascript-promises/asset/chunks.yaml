    \ 请求，但在本示例中，传递给 `Promise.all()` 的数组中还包含了对 `delay()` 的调用。当返回的 promise 完成时，完成处理程序将接收包含所有结果的数组，其中最后一个元素为\
    \ undefined。在从 `fetchUserData()` 返回之前，删除了最后一个元素，这样调用 `fetchUserData()` 的代码就不需要感知\
    \ `delay()` 的调用。应用元素上添加了 CSS 类 `loading` 以表示数据正在检索，并在接收到响应后由结算处理程序将其移除。\n\n你刚刚学习了\
    \ `Promise.all()` 作为最佳解决方案的用例。但如果你希望即使一个 promise 被拒绝（rejected），你的操作仍然继续，该怎么办？这时\
    \ `Promise.allSettled()` 将是更好的选择。\n\n## Promise.allSettled() 方法\n\n`Promise.allSettled()`\
    \ 方法是 `Promise.all()` 的微变版本，它会等待直到指定迭代器中的所有 promise 都结算（settled），无论它们是完成（fulfilled）还是拒绝（rejected）。`Promise.allSettled()`\
    \ 的返回值始终是一个解析为结果对象数组的 promise。\n\n完成的 promise 的结果对象有两个属性：\n- `status`: 始终设置为 `fulfilled`\n\
    - `value`: promise 的完成值\n\n对于拒绝的 promise，结果对象中也有两个属性：\n- `status`: 始终设置为 `rejected`\n\
    - `reason`: promise 的拒绝值\n\n你可以使用返回的结果对象数组来确定每个 promise 的结果。\n\n```javascript\n\
    let promise1 = Promise.resolve(42);\nlet promise2 = Promise.reject(43);\nlet promise3\
    \ = new Promise((resolve, reject) => {\n    setTimeout(() => {\n        resolve(44);\n\
    \    }, 100);\n});\n\nlet promise4 = Promise.allSettled([promise1, promise2, promise3]);\n\
    \npromise4.then(results => {\n    console.log(Array.isArray(results)); // true\n\
    \    console.log(results[0].status); // \"fulfilled\"\n    console.log(results[0].value);\
    \ // 42\n    console.log(results[1].status); // \"rejected\"\n    console.log(results[1].reason);\
    \ // 43\n    console.log(results[2].status); // \"fulfilled\"\n    console.log(results[2].value);\
    \ // 44\n});\n```\n\n即使第二个 promise (`promise2`) 是一个拒绝的 promise，`Promise.allSettled()`\
    \ 的调用也会返回一个解析为结果对象数组的 promise。你随后可以通过这些结果对象来确定每个 promise 的结果。\n\n## 何使用 Promise.allSettled()\n\
    \n`Promise.allSettled()` 方法可以在许多与 `Promise.all()` 相似的场景中使用；但是，它最适用于希望忽略拒绝、以方式处理拒绝或允许部分成功的情况。以下是\
    \ `Promise.allSettled()` 的常见用例：\n\n### 分别处理多个文件\n\n"
- fmt: "\nWhen discussing `Promise.all()`, you saw an example of working on multiple\
    \ files that were dependent on one another to succeed. There are also some cases\
    \ where working on multiple files separately means you don’t need to stop the\
    \ entire operation if one fails; you go ahead and complete the successful operations\
    \ and then log the failed ones to retry later. Here’s an example in Node.js:\n\
    \n```javascript\nimport { readFile, writeFile } from \"node:fs/promises\";\n\n\
    // or any operation on the files\nfunction transformText(text) {\n    return text.split(\"\
    \").reverse().join(\"\");\n}\n\nfunction transformFiles(filenames) {\n    return\
    \ Promise.allSettled(\n        filenames.map(filename =>\n            readFile(filename,\
    \ \"utf8\")\n                .then(text => transformText(text))\n            \
    \    .then(newText => writeFile(filename, newText))\n                .catch(reason\
    \ => {\n                    reason.filename = filename;\n                    return\
    \ Promise.reject(reason);\n                })\n        )\n    );\n}\n\ntransformFiles([\"\
    file1.txt\", \"file2.txt\"]).then(results => {\n    // get failed results\n  \
    \  const failedResults = results.filter(\n        result => result.status ===\
    \ \"rejected\"\n    );\n\n    if (failedResults.length) {\n        console.error(\"\
    The following files were not transformed success fully:\");\n        console.error(\"\
    \");\n        failedResults.forEach(failedResult => {\n            console.error(failedResult.reason.filename);\n\
    \            console.error(failedResult.reason.message);\n            console.error(\"\
    \");\n        });\n    } else {\n        console.log(\"All files transformed successfully.\"\
    );\n    }\n});\n```\n\nThis example reads in a series of files, reverses the order\
    \ of the text in the files, and then writes that text back to the original files\
    \ (you can, of course, replace `transformText()` with whatever operation you would\
    \ prefer). The `transformFiles()` function accepts an array of `filenames` and\
    \ reads the contents of the file, transforms the text, and writes the transformed\
    \ text back to the file. The promise chain represents each step in the process,\
    \ and the rejection handler adds a `filename` property to any rejection reason\
    \ to make it easier to interpret the results after the fact.\n\nWhen the operation\
    \ on all of the files is completed, the results are filtered to find any files\
    \ where the transform did not complete successfully and then outputs those results\
    \ to the console. In a production system you would likely feed the failed results\
    \ into a monitoring system or a queue to try the transformation again.\n\n###\
    \ Calling Multiple Independent Web Service APIs\n\nAnother example from the `Promise.all()`\
    \ section was calling multiple web service APIs where you wanted all of the requests\
    \ to succeed. If you don’t need all of the requests to succeed, then you can use\
    \ `Promise.allSettled()` instead. Going back to that previous example, if it’s\
    \ possible to display the user profile page, even if some of the data is missing,\
    \ then use `Promise.allSettled()` instead of `Promise.all()` to avoid showing\
    \ an error to the user. For example:\n\n```javascript\nconst API_BASE = \"https://jsonplaceholder.typicode.com\"\
    ;\n\nfunction fetchUserData(userId) {\n    const urls = [\n        `${API_BASE}/users/${userId}/posts`,\n\
    \        `${API_BASE}/users/${userId}/albums`,\n        `${API_BASE}/users/${userId}/extras`\n\
    \    ];\n    return Promise.allSettled(urls.map(url => fetch(url)))\n        .then(results\
    \ => results.map(result => result.value));\n}\n\nfetchUserData().then(responses\
    \ => {\n    return Promise.all(\n        responses.map(response => {\n       \
    \     if (response?.ok) {\n                return response.json();\n         \
    \   }\n        })\n    );\n}).then(([posts, albums, extras]) => {\n    // process\
    \ your data as necessary\n    if (posts) {\n        console.log(\"Posts\");\n\
    \        console.log(posts);\n    }\n    if (albums) {\n        console.log(\"\
    Albums\");\n        console.log(albums);\n    }\n    if (extras) {\n        console.log(\"\
    Extras\");\n        console.log(extras);\n    }\n}).catch(reason => console.error(reason.message));\n\
    ```\n\nIn this version of the example, the `fetchUserData()` function uses `Promise.allSettled()`\
    \ instead of `Promise.all()` to ensure that rejections can be ignored. This example\
    \ also calls a third endpoint, `/users/{userId}/extras`, which doesn’t exist and\
    \ will return a 404 (for demonstration purposes). Once all requests have completed,\
    \ a fulfillment handler maps each result to its `value` property, which ensures\
    \ that any rejected promises are mapped to `undefined` and fulfilled promises\
    \ are mapped to the response object returned from `fetch()`. Because `response`\
    \ may be `undefined`, you need to check that `response` is truthy before checking\
    \ the `ok` property. The JSON body of each valid response is then read, and the\
    \ last fulfillment handler reads that data. There is no guarantee that each of\
    \ the requested data will be there (`extras` will be `undefined` in this example)\
    \ so you need to check that each value is present before processing it.\n\n###\
    \ Waiting for Animations to Finish\n\nIn a web page, elements can be animated\
    \ in a number of different ways. You could, for instance, animate the location\
    \ of an element up from the bottom of the page while also animating the width\
    \ and height to grow the element into view. It’s helpful in these situations to\
    \ wait for all animations to complete before making the next modification to the\
    \ element or page. In his article, Building a toast component, Adam Argyle explained\
    \ a basic way to track when the animations of a DOM element are complete. I’ve\
    \ rewritten the code for clarity here:\n\n```javascript\nfunction waitForAnimations(element)\
    \ {\n    return Promise.allSettled(\n        element.getAnimations().map(animation\
    \ => animation.finished)\n    );\n}\n\nconst toasterElement = document.getElementById(\"\
    toaster\");\nwaitForAnimations(toasterElement).then(() => console.log(\"Toaster\
    \ is done.\"));\n```\n\nIn this case, you don’t really care if any of the animations\
    \ fail along the way, nor do you care about receiving any fulfilled values from\
    \ the animations, so `Promise.allSettled()` is a more appropriate option than\
    \ `Promise.all()`. The `getAnimations()` method returns an array of animation\
    \ objects, each of which has a `finished` property containing a promise that is\
    \ resolved when the animation is complete. By passing each of these promises into\
    \ `Promise.allSettled()`, you will be notified when all animations are complete.\
    \ Because `Promise.allSettled()` never returns a rejected promise, you can just\
    \ attach a fulfillment handler and not be worried about any uncaught rejection\
    \ errors.\n\n### The Promise.any() Method\n\nThe `Promise.any()` method also accepts\
    \ an iterable of promises and returns a fulfilled promise when any of the passed-in\
    \ promises are fulfilled. The operation short-circuits as soon as one of the promises\
    \ is fulfilled. (This is the opposite of `Promise.all()`, where the operation\
    \ short-circuits as soon as one promise is rejected.) Here’s an example:\n\n```javascript\n\
    let promise1 = Promise.reject(43);\n\nlet promise2 = Promise.resolve(42);\n\n\
    let promise3 = new Promise((resolve, reject) => {\n    setTimeout(() => {\n  \
    \      resolve(44);\n    }, 100);\n});\n\nlet promise4 = Promise.any([promise1,\
    \ promise2, promise3]);\n\npromise4.then(value => console.log(value));\n```\n"
