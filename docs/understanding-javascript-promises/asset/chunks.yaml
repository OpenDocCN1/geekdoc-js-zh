  trans: "\n\n`Promise.resolve()` 方法接受一个参数并返回一个处于已履行（fulfilled）状态的 promise。这意味着如果你已经知道了\
    \ promise 的值，就不需要执行器（executor）。例如：\n\n```javascript\nconst promise = Promise.resolve(42);\n\
    promise.then(value => {\n    console.log(value); // 42\n});\n```\n\n这段代码创建了一个已履行的\
    \ promise，因此履行处理程序接收到的 `42` 作为 `value`。与本章中的其他示例一样，履行处理程序会在当前脚本任务完成后作为微任务（microtask）执行。如果为此\
    \ promise 添加了拒绝处理程序（rejection handler），该处理器永远不会被调用，因为 promise 永远不会处于拒绝（rejected）状态。\n\
    \n如果你向 `Promise.resolve()` 传递一个 promise，该函数将返回你传递的同一个 promise。例如：\n\n```javascript\n\
    const promise1 = Promise.resolve(42);\nconst promise2 = Promise.resolve(promise1);\n\
    console.log(promise1 === promise2); // true\n```\n\n### 使用 Promise.reject()\n\n\
    你也可以使用 `Promise.reject()` 方法创建被拒绝的 promise。它的工作方式与 `Promise.resolve()` 类似，但创建的\
    \ promise 处于拒绝状态，如下：\n\n```javascript\nconst promise = Promise.reject(42);\npromise.catch(reason\
    \ => {\n    console.log(reason); // 42\n});\n```\n\n添加到此 promise 的任何额外拒绝处理程序都会被调用，但履行处理程序不会，因为\
    \ promise 永远不会处于已履行状态。\n\n如果你向 `Promise.resolve()` 或 `Promise.reject()` 方法任其一传递\
    \ promise，返回的 promise 将不经过任何修改。\n\n#### 非 Promise 的 Then 对象 (Thenables)\n\n`Promise.resolve()`\
    \ 和 `Promise.reject()` 也接受非 promise 的 thenable（具有 then 方法的对象）作为参数。当传递非 promise\
    \ 的 thenable 时，这些方法会创建一个在 `then()` 函数之后被调用的新 promise。\n\n当一个对象拥有 `then()` 方法且该方法接受\
    \ `resolve` 和 `reject` 参数时，就会创建一个非 promise 的 thenable：\n\n```javascript\nconst\
    \ thenable = {\n    then(resolve, reject) {\n        resolve(42);\n    }\n};\n\
    ```\n\n此示例中的 thenable 对象除了 `then()` 方法外，没有与 promise 相关的其他特征。你可以调用 `Promise.resolve()`\
    \ 将 thenable 转换为已履行的 promise：\n\n```javascript\nconst thenable = {\n    then(resolve,\
    \ reject) {\n        resolve(42);\n    }\n};\nconst promise = Promise.resolve(thenable);\n\
    promise.then(value => {\n    console.log(value); // 42\n});\n```\n\n在此示例中，`Promise.resolve()`\
    \ 调用了 `thenable.then()`以便确定 promise 的状态。`thenable` 的 promise 状态是已履行的，因为在 `then()`\
    \ 方法内部调用了 `resolve(42)`。创建了一个名为 `promise` 的新 promise，它处于已履行状态，其值是从 `thenable`\
    \ 传递的（即 `42`），`promise` 的履行处理程序接收到的 `42` 作为值。\n\n相同的的过程也可以用于 `Promise.resolve()`\
    \ 从 thenable 创建被拒绝的 promise：\n\n```javascript\nconst thenable = {\n    then(resolve,\
    \ reject) {\n        reject(42);\n    }\n};\nconst promise = Promise.resolve(thenable);\n\
    promise.catch(value => {\n    console.log(value); // 42\n});\n```\n\n此示例与上一个相似，不同之处在于\
    \ `thenable` 被拒绝了。当 `thenable.then()` 执行时，会创建一个处于拒绝状态的新 promise，其值为 `42`。该值随后被传递给\
    \ `promise` 的拒绝处理程序。\n\n`Promise.resolve()` 和 `Promise.reject()` 正是这样工作，允许你轻松地处理非\
    \ promise 的 thenable。在 2015 年 promise 引入之前，许多库都使用 thenable，因此将 thenable 转换为正式\
    \ promise 的能力对于与现有库的向后兼容非常重要。当你不确定一个对象是否为 promise 时，将该对象通过 `Promise.resolve()`\
    \ 或 `Promise.reject()`（取决于你的预期结果）是查找结果的最佳方法，因为 promise 只会原样通过。\n\n### 总结\n\npromise\
    \ 是一个值的值的占位符，该值以后可能会作为某些异步操作的结果提供。与其向函数分配事件处理器或向函数传递回调函数，不如使用 promise 来表示操作的结果。\n\
    \nPromise 有三种状态：等待中（pending）、已履行（fulfilled）和被拒绝（rejected）。promise 起于等待中（未稳定）状态，并在执行成功时变为已履行，在失败时变为被拒绝（履行和拒绝都是已稳定状态）。在任何情况下，都可以添加处理器来指示\
    \ promise 何时变为稳定。`then()` 方法允许你分配一个履行处理器和一个拒绝处理器；`catch()` 方法允许你只分配一个拒绝处理器；`finally()`\
    \ 方法允许你分配一个无论结果如何都会被调用的稳定状态处理程序。所有 promise 处理器都作为微任务运行，因此它们在当前脚本任务完成之前不会执行。\n\n\
    你可以使用 `Promise` 构造函数创建新的等待中 promise，该构造函数接受一个执行器函数作为唯一参数。执行器函数被传递 `resolve()`\
    \ 和 `reject()` 函数，你使用这些函数来指示 promise 的成功或失败。执行器在 promise 创建时立即运行，这与作为微任务运行的处理器不同。在执行器中抛出的任何错误都会被自动捕获并传递给\
    \ `reject()`。\n\n可以使用 `Promise.resolve()` 创建已履行的 promise，使用 `Promise.reject()`\
    \ 创建被拒绝的 promise。每种方法都会将它的参数包装在 promise 中（如果它不是 promise），创建一个新 promise（对于非 promise\
    \ thenable），或者透传任何现有 promise。这些方法在你不确定值是否为 promise 但希望它像 promise 时非常有用。\n\n虽然创建单个\
    \ promise 是处理 JavaScript 中异步操作的一种实用有效的方法，但 promise 在链在一起时允许有趣的组合。在下一章中，你将学习 处理器如何创建\
    \ promise 链以及为什么这很有价值。\n\n### 2. Promise 链\n\n到目前为止，promise 似乎只是对使用回调和 `setTimeout()`\
    \ 函数的选择性改进，但 promise 远比看到的复杂。具体来说，有许多方法可以链 promise 以实现更多的异步行为。\n\n每次调用实际上都会创建并返回另一个\
    \ promise。第二个 promise 只有在第一个履行或被拒绝后才会稳定。考虑这个示例：\n\n```javascript\nconst promise\
    \ = Promise.resolve(42);\npromise.then(value => {\n    console.log(value);\n}).then(()\
    \ => {\n    console.log(\"Finished\");\n});\n```\n\n代码输出：\n\n```\n42\nFinished\n\
    ```\n\n`promise.then()` 调用返回第二个 promise，并在上面调用 `then()`。第二个 `then()` 履行处理器只有在第一个\
    \ promise 解析后才被调用。如果你解链这个示例，它看起来如下：\n\n```javascript\nconst promise1 = Promise.resolve(42);\n\
    const promise2 = promise1.then(value => {\n    console.log(value);\n});\npromise2.then(()\
    \ => {\n    console.log(\"Finished\");\n});\n```\n\n在代码的未链版本中，`promise.then()`\
    \ 的结果存储在 `promise2` 中，然后调用 `promise2.then()` 来添加最后的履行处理器。`promise2.then()` 的调用也返回一个\
    \ promise。这个示例并没有使用该 promise。\n\n#### 捕获错误\n\nPromise 链允许你捕获在上一个 promise 的履行或拒绝处理器中可能发生的错误。例如：\n\
    \n```javascript\nconst promise = Promise.resolve(42);\npromise.then(value => {\n\
    \    throw new Error(\"Oops!\");\n}).catch(reason => {\n    console.error(reason.message);\
    \ // \"Oops!\"\n});\n```\n\n"
- fmt: "\nIn this code, the fulfillment handler for promise throws an error. The chained\
    \ call to the `catch()` method, which is on a second promise, is able to receive\
    \ that error through its rejection handler. The same is true if a rejection handler\
    \ throws an error:\n\n```javascript\nconst promise = new Promise (( resolve ,\
    \ reject ) => { \n    throw new Error ( “Uh oh!” ); \n}); \npromise . catch (\
    \ reason => { \n    console . log ( reason . message );     // “Uh oh!”\n    throw\
    \ new Error ( “Oops!” ); \n}). catch ( reason => { \n    console . error ( reason\
    \ . message );   // “Oops!” \n});\n```\n\nHere, the executor throws an error that\
    \ triggers the promise ’s rejection handler. That handler then throws another\
    \ error that is caught by the second promise’s rejection handler. The chained\
    \ promise calls are aware of errors in other promises in the chain.\n\nYou can\
    \ use this ability to catch errors through a promise chain to effectively act\
    \ like a try-catch statement. Consider using `fetch()` to retrieve some data and\
    \ wanting to catch any errors that occur:\n\n```javascript\nconst promise = fetch\
    \ ( “books.json” ); \npromise . then ( response => { \n    console . log ( response\
    \ . status ); \n}). catch ( reason => { \n    console . error ( reason . message\
    \ ); \n});\n```\n\nThis example will output the response status from the `fetch()`\
    \ call if it succeeds and will output the error message if the call fails. You\
    \ can take this a step further and handle status codes outside of the 200-299\
    \ range as errors by checking the `response.ok` property (discussed in Chapter\
    \ 1) and throwing an error if it is false , as in this example:\n\n```javascript\n\
    const promise = fetch ( “books.json” ); \npromise . then ( response => { \n  \
    \  if ( response . ok ) { \n        console . log ( response . status ); \n  \
    \  } else { \n        throw new Error ( `Unexpected status code: ${ response .\
    \ status } ${ response . statusText }` ); \n    } \n}). catch ( reason => { \n\
    \    console . error ( reason . message ); \n});\n```\n\nThe chained `catch()`\
    \ call in this example creates a rejection handler that catches both errors returned\
    \ by `fetch()` and also any errors thrown in the fulfillment handler. So instead\
    \ of needing two different handles for catching the two different types of errors,\
    \ you can use one to handle all of the errors that may occur in the chain.\n\n\
    Always have a rejection handler at the end of a promise chain to ensure that you\
    \ can properly handle any errors that may occur.\n\n## Using finally() in Promise\
    \ Chains\n\nThe `finally()` method behaves differently than either `then()` or\
    \ `catch()` in that it copies the state and value of the previous promise into\
    \ its returned promise. That means if the original promise is fulfilled with a\
    \ value, then `finally()` returns a promise that is fulfilled with the same value.\
    \ For example:\n\n```javascript\nconst promise = Promise . resolve ( 42 ); \n\
    promise . finally (() => { \n    console . log ( “Finally called.” ); \n}). then\
    \ ( value => { \n    console . log ( value );         // 42 \n});\n```\n\nHere,\
    \ the settlement handler can’t receive the fulfilled value from `promise`, so\
    \ that value is copied to a new promise that is returned from the method call.\
    \ The new promise is fulfilled with the value 42 (copied from `promise`) so the\
    \ fulfillment handler receives 42 as an argument. Keep in mind that even though\
    \ the returned promise and `promise` have the same value, they are not the same\
    \ object, as you can see in this example:\n\n```javascript\nconst promise1 = Promise\
    \ . resolve ( 42 ); \nconst promise2 = promise1 . finally (() => { \n    console\
    \ . log ( “Finally called.” ); \n}); \npromise2 . then ( value => { \n    console\
    \ . log ( value );         // 42 \n}); \nconsole . log ( promise1 === promise2\
    \ ); // false\n```\n\nIn this code, the returned value from `promise1.finally()`\
    \ is stored in `promise2`, at which point you can determine that it is not the\
    \ same object as `promise1`. The call to `finally()` always copies the state and\
    \ value from the original promise. That also means that when `finally()` is called\
    \ on a rejected promise, it in turn returns a rejected promise, as in this example:\n\
    \n```javascript\nconst promise = Promise . reject ( 43 ); \npromise . finally\
    \ (() => { \n    console . log ( “Finally called.” ); \n}). catch ( reason =>\
    \ { \n    console . error ( reason );       // 43 \n});\n```\n\nThe `promise`\
    \ in this example is rejected with a reason of 43 . Once again, the settlement\
    \ handler cannot access this information as it is not passed in as an argument,\
    \ so instead it returns a new promise that is rejected for the same reason. You\
    \ can then use `catch()` to retrieve the reason.\n\nThe one exception to how `finally()`\
    \ works is when an error is thrown inside of the settlement handler or a rejected\
    \ promise is returned. In this one case, the returned promise from `finally()`\
    \ does not maintain the state and value from the original promise, and instead\
    \ is rejected with the thrown error as the reason. Here’s an example:\n\n```javascript\n\
    const promise1 = Promise . reject ( 43 ); \npromise1 . finally (() => { \n   \
    \ throw 44 ; \n}). catch ( reason => { \n    console . error ( reason );     \
    \  // 44 \n}); \nconst promise2 = Promise . reject ( 43 ); \npromise2 . finally\
    \ (() => { \n    return Promise .reject ( 44 ); \n}). catch ( reason => { \n \
    \   console . error ( reason );       // 44 \n});\n```\n\nBecause the settlement\
    \ handlers throw `44` or return `Promise.reject(44)` in this example, the returned\
    \ promise is rejected with the value of 44 and that is output to the console instead\
    \ of 43 . The state and value of the original promise are lost as a consequence\
    \ of the error being thrown. InIn 1, you saw how a settlement handler can be used\
    \ to toggle the loading state of an application based on a call to `fetch()` .\
    \ Rewriting that example using promise chains, and mixing in some error handling\
    \ from earlier in chapter, here’s a complete example:\n\n```javascript\nconst\
    \ appElement = document . getById ( “app” ); \nconst promise = fetch ( “books.json”\
    \ ); \nappElement . classList . add ( “loading” ); \npromise . then ( response\
    \ => { \n    if ( response . ok ) { \n        console . log ( response . status\
    \ ); \n    } else { \n        throw new Error ( `Unexpected status code: ${ response\
    \ . status } ${ response . statusText }` ); \n    } \n}).finally (() => { \n \
    \   appElement . classList . remove ( “loading” ); \n}).catch ( reason => { \n\
    \    console . error ( reason . message ); \n});\n```\n\nUnlike a try-catch statement,\
    \ you don’t want `finally()` to be the last part of the chain just in case it\
    \ throws an error. So `then()` is called first, to handle the response from `fetch()`,\
    \ then `finally()` is added to the chain to trigger the UI change, and last `catch()`\
    \ adds the error handler for the entire chain. This is where settlement handlers\
    \ passing along the state of the previous promise is helpful: if the fulfillment\
    \ handler ends up throwing an error, the settlement handler will pass that rejection\
    \ state along so the rejection handler can access it.\n\n## Returning Values in\
    \ Promise Chains\n\nAnother important aspect of promise chains is the ability\
    \ to pass data from one to the next. You’ve already seen that a value passed to\
    \ the `resolve()` handler inside an executor is passed to the fulfillment handler\
    \ for that promise. You can continue passing data along a chain by specifying\
    \ a return value from the fulfillment handler. For example:\n\n```javascript\n\
    const promise = Promise . resolve ( 42 ); \npromise . then ( value => { \n   \
    \ console . log ( value );         // 42 \n    return value + 1 ; \n}). then (\
    \ value => { \n    console . log ( value );         // 43 \n});\n```\n\nThe fulfillment\
    \ handler for `promise` returns `value + 1` when executed. Since `value` is 42\
    \ (from the executor), the fulfillment handler returns 43 . That value is then\
    \ passed to the fulfillment handler of the second promise, which outputs it to\
    \ the console.\n"
