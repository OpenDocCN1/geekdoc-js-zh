  trans: "\n在这个示例中，`p1` 的成功处理函数内部创建了一个新的 promise。这意味着在 `p2` 成功完成之前，第二个成功处理函数不会执行。`p2`\
    \ 的执行器通过 `setTimeout()` 延迟了 500 毫秒，但在更实际的场景中，你可能会发起网络请求或文件系统请求。当你希望等待上一个 promise\
    \ 确定（settled）后再启动一个新的异步操作时，这种模式非常有用。\n\n# 总结\n\n多个 promise 可以以各种方式链在一起，以便在它们之间传递信息。每次对\
    \ `then()`、`catch()` 和 `finally()` 的调用都会创建并返回一个新的 promise，该 promise 在前一个 promise\
    \ 确定后解析（resolved）。如果 promise 处理程序返回一个值，那么该值将成为 `then()` 和 `catch()` 创建的新 promise\
    \ 的值（`finally()` 会忽略此值）；如果 promise 处理程序抛出错误，则错误会被捕获，且返回的新 promise 将以该错误为原因被拒绝（rejected）。\n\
    \n当链中的一个 promise 被拒绝时，从其他链式处理程序创建的 promise 也会被拒绝，直到链的末尾。考虑到这一点，建议在每个 promise 链的末尾附加拒绝处理程序，以确保错误得到正确处理。未能捕获\
    \ promise 拒绝会导致控制台输出消息、抛出错误或两者兼有（取决于运行时环境）。\n\n你可以从处理程序返回 promise，在这种情况下，从 `then()`\
    \ 和 `catch()` 调用返回的 promise 的确定状态将变得与处理程序返回的 promise 的确定状态和值一致（`finally()` 返回的成功\
    \ promise 会被忽略，而拒绝的 promise 会被遵循）。你可以利用这一特性，延迟某些操作直到一个 promise 成功完成，然后启动并返回第二个\
    \ promise 以继续使用同一个 promise 链。\n\n本章探讨了如何将多个 promise 链在一起，使它们表现得更像一个 promise。在下一章中，你将学习如何处理并行运行的多个\
    \ promise。\n\n# 3. 处理多个 promise\n\n到目前为止，书中的每个示例都处理的是一次响应一个 promise。然而，有时你可能希望监控多个\
    \ promise 的进度，以便决定下一步操作。JavaScript 提供了几种方法来监控多个 promise 并以略不同的方式对它们做出响应。本章中讨论的所有方法都允许多个\
    \ promise 并执行，然后作为一个整体进行响应，而不是逐个响应。\n\n## Promise.all() 方法\n\n`Promise.all()`\
    \ 方法接受单个参数，该参数是一个要监控的 promise 可迭代器（例如数组），并返回一个只有当迭代器中的每个 promise 都已解析后才会被解析的 promise。当迭代器中的每个\
    \ promise 都成功完成时，返回的 promise 也会成功完成，例所示：\n\n```javascript\nlet promise1 = Promise.resolve(42);\n\
    let promise2 = new Promise((resolve, reject) => {\n    resolve(43);\n});\nlet\
    \ promise3 = new Promise((resolve, reject) => {\n    setTimeout(() => {\n    \
    \    resolve(44);\n    }, 100);\n});\n\nlet promise4 = Promise.all([promise1,\
    \ promise2, promise3]);\n\npromise4.then(value => {\n    console.log(Array.isArray(value));\
    \   // true\n    console.log(value[0]);               // 42\n    console.log(value[1]);\
    \               // 43\n    console.log(value[2]);               // 44\n});\n```\n\
    \n这里的每个 promise 都用数字解析。对 `Promise.all()` 的调用创建了 `promise4`，它在 `promise1`、`promise2`\
    \ 和 `promise3` 成功完成后最终会成功完成。传递给 `promise4` 成功处理函数的结果是一个包含每个解析值的数组：`42`、`43` 和\
    \ `44`。这些值按照 promise 传递给 `Promise.all()` 的顺序存储，因此你可以将 promise 结果与对应的 promise 相匹配。\n\
    \n如果传递给 `Promise.all()` 的任何 promise 被拒绝，返回的 promise 将立即被拒绝，而无需等待其他 promise 完成：\n\
