  trans: "\n\n`Promise.race()` 方法最适用于你希望短路多个不同 promise 完成情况的场景。与 `Promise.any()` 不同——在后者你明确希望其中一个\
    \ promise 成功，并且只关心所有 promise 是否都失败——而在 `Promise.race()` 中，只要某个 promise 在任何其他 promise\
    \ 完成之前失败，即使它失败了，你也想知道结果。以下是一些你可能想要使用 `Promise.race()` 的场景。\n\n### 为操作建立超时\n\n\
    虽然 `fetch()` 函数有很多实用的功能，但它没有做的一点是管理给定请求的超时；请求会一直挂起，直到请求以某种方式完成为止。你可以使用 `Promise.race()`\
    \ 轻松地创建一个包装方法，为任何请求添加超时：\n\n```javascript\nfunction timeout(milliseconds) {\n\
    \  return new Promise((resolve, reject) => {\n    setTimeout(() => {\n      reject(new\
    \ Error(\"Request timed out.\"));\n    }, milliseconds);\n  });\n}\n\nfunction\
    \ fetchWithTimeout(...args) {\n  return Promise.race([\n    fetch(...args),\n\
    \    timeout(5000)\n  ]);\n}\n\nconst API_URL = \"https://jsonplaceholder.typicode.com/users\"\
    ;\n\nfetchWithTimeout(API_URL)\n  .then(response => response.json())\n  .then(users\
    \ => console.log(users))\n  .catch(reason => console.error(reason.message));\n\
    ```\n\n`timeout()` 函数与本章之前创建的 `delay()` 函数类似，区别在于它在延迟后调用 `reject()` 而不是 `resolve()`。在这种情况下，延迟代表错误条件，因为你希望在请求时间超过预期（在本例中为\
    \ `5000` 毫秒）时收到通知。`fetchWithTimeout()` 函数将 `fetch()` 和 `timeout()` 放入数组中传递给 `Promise.race()`。如果\
    \ `fetch()` 的调用时间超过超时，返回的 promise 将被拒绝，这样你就可以适当地处理失败。\n\n请记住，尽管 `fetchWithTimeout()`\
    \ 会在请求时间超过指定的超时时被拒绝，但请求并不会取消。它仍会在后台继续等待响应，尽管该响应会被忽略。\n\n### 总结\n\n当你需要同时监控并响应多个\
    \ promise 时，JavaScript 提供了几种方法。每种方法的行为略有不同，但都允许你并行运行 promise 并作为一个整体对它们做出响应：\n\
    \n* `Promise.all()` - 当所有 promise 都完成时，返回的 promise 成功；当任何 promise 被拒绝时，返回的 promise\
    \ 被拒绝。\n* `Promise.allSettled()` - 返回的 promise 总是通过一个包含 promise 结果的数组完成，返回的 promise\
    \ 永远不会拒绝。\n* `Promise.any()` - 当第一个 promise 完成时，返回的 promise 成功；当所有 promise 都被拒绝时，返回的\
    \ promise 被拒绝。\n* `Promise.race()` - 当第一个完成（settle）的 promise 完成时，返回的 promise 成功；当第一个完成的被拒绝时，返回的\
    \ promise 被拒绝。\n\n这些方法适用于不同的用例，取决于你在任何情况下决定哪种是合适的。\n\n# 4. Async 函数和 await 表达式\n\
    \nJavaScript promises 被设计为一种底层工具，可以由高级语言特性在后台使用。async 函数（async functions）正是这样一种高级语言特性，它使得使用\
    \ promise 的编程与不使用 promise 的编程更加相似。与其担心跟踪 promise 及其各种处理器，async 函数 抽象了 promise。最终结果是遵循熟悉的自上而下顺序的代码。\n\
    \n在深入了解 async 函数的工作原理之前，了解它们是如何定义的会有帮助。\n\n我使用“async 函数”一术语来描述函数以及出现在对象或类的方法。每当使用该术语时，你都可以假设我说的话也适用于异步方法，除非另有说明。\n\
    \n### 定义 async 函数\n\nasync 函数可以像同步函数一样在任何地方使用。为了使其变为异步，你需要在函数或方法前添加 `async` 关键字。这意味着函数是异步的。以下是一些示例：\n\
    \n```javascript\n// 函数声明\nasync function doSomething() {\n  // body\n}\n\n// 箭头函数\n\
    const doSomething = async () => {\n  // body\n};\n\n// 箭头函数\nconst doSomethingElse\
    \ = async () => {\n  // body\n};\n\n// 对象方法\nconst object = {\n  async doSomething()\
    \ {\n    // body\n  }\n};\n\n// 类方法\nclass MyClass {\n  async doSomething() {\n\
    \    // body\n  }\n}\n```\n\n### async 函数的不同之处\n\nasync 函数与同步函数的区别有以下四点：\n1. 返回值总是\
    \ promise\n2. 抛出的错误是 promise 拒绝\n3. 可以使用 `await` 表达式\n4. 可以使用 `for-of` 循环\n\n\
    这些方面使得 async 函数与同步函数非常不同，因此值得详细介绍每一点。\n\n#### 返回值总是 promise\n\n你可以像在同步函数中使用 `return`\
    \ 运算符一样在 async 函数中使用。区别在于 async 函数总是返回 promise。例如，如果你返回一个数字，它会被封装在 promise 中：\n\
    \n```javascript\nasync function getMeaningOfLife() {\n  return 42;\n}\n\nconst\
    \ result = getMeaningOfLife();\nconsole.log(result instanceof Promise); // true\n\
    console.log(typeof result === \"number\"); // false\nresult.then(value => {\n\
    \  console.log(value); // 42\n});\n```\n\n在此代码中，`getMeaningOfLife()` async 函数返回\
    \ `42`，但返回值实际上是一个完成的 promise。你可以附加完成处理器来获取值。\n\n如果你在 async 函数内部向 `return` 传递 promise，那么该\
    \ promise 不直接传递。相反，promise 的状态和值会被复制一个新的 promise 并返回。示例：\n\n```javascript\nconst\
    \ promise = Promise.resolve(42);\n\nasync function getMeaningOfLife() {\n  return\
    \ promise;\n}\n\nconst result = getMeaningOfLife();\nconsole.log(result === promise);\
    \ // false\nresult.then(value => {\n  console.log(value); // 42\n});\n```\n\n\
    在这里，`result` 与 `promise` 不是同一个 promise 对象，但它具有所有的内部状态，因此仍然解析为 `42`。\n\n如果你没有为\
    \ async 函数指定返回值，那么返回值是一个解析为 `undefined` 的 promise。例如：\n\n```javascript\nasync\
    \ function doSomething() {\n  // 没有返回值\n}\n\nconst result = doSomething();\nconsole.log(result\
    \ instanceof Promise); // true\nresult.then(value => {\n  console.log(value);\
    \ // undefined\n});\n```\n\n底线是，无论你在 async 函数内部做了什么，它总是返回一个 promise。在抛出错误时也是如此。\n\
    \n#### 抛出的错误是 promise 拒绝\n\n当错误在 async 函数中抛出时，返回的是一个被拒绝的 promise，而不是在函数外部抛出错误。这意味着你无法使用\
    \ `try-catch` 捕获 async 函数的错误。例如，以下代码将无法捕获错误：\n\n"
- fmt: "\n```javascript\nasync function throwError () {\n    throw new Error(\"Oh\
    \ no!\");\n}\ntry {\n    throwError();\n    console.log(\"Didn’t catch error\"\
    );\n} catch (ex) {\n    // never called\n    console.log(\"Caught error\");\n\
    }\n```\n\nIn this example, the `try-catch` statement doesn’t catch the error thrown\
    \ by `throwError()` because a rejected promise is returned. To catch the error,\
    \ you need to provide a rejection handler, like this:\n\n```javascript\nasync\
    \ function throwError () {\n    throw new Error(\"Oh no!\");\n}\nthrowError().catch(reason\
    \ => {\n    console.log(\"Caught error:\", reason.message);\n});\n```\n\nHere,\
    \ the rejection handler is assigned using `catch()`, and the error results in\
    \ a message being output to the `console`.\n\nThe JavaScript engine goes through\
    \ a lot of trouble to ensure that `async` functions always return promises so\
    \ you have a consistent way to work with the return value. That brings us to the\
    \ third way that `async` functions are different from synchronous functions: the\
    \ `await` expression.\n\n## Using Await Expressions\n\nThe `await` expression\
    \ is designed to make working with promises simple. Instead of manually assigning\
    \ fulfillment and rejection handlers, any promise used in an `await` expression\
    \ behaves more like code in a synchronous function: the expression returns the\
    \ fulfilled value of a promise when it succeeds and throws the rejection value\
    \ when the promise fails. That allows you to easily assign the result of an `await`\
    \ expression to a variable and catch any rejections using a `try-catch` statement.\
    \ Here’s an example using the `fetch()` API (available in web browsers and Deno)\
    \ without `await`:\n\n```javascript\nfunction retrieveJsonData(url) {\n    return\
    \ fetch(url)\n        .then(response => {\n            if (response.ok) {\n  \
    \              return response.json();\n            } else {\n               \
    \ throw new Error(`Unexpected status code: ${response.status} ${response.statusText}`);\n\
    \            }\n        })\n        .catch(reason => console.error(reason.message));\n\
    }\n```\n\nThe `retrieveJsonData()` function returns a promise that resolves to\
    \ the JSON data in the response from the call to `fetch()`. There is also a rejection\
    \ handler to print out any error messages. Here’s how you can rewrite this function\
    \ as an `async` function that uses `await`:\n\n```javascript\nasync function retrieveJsonData(url)\
    \ {\n    try {\n        const response = await fetch(url);\n        if (response.ok)\
    \ {\n            return await response.json();\n        } else {\n           \
    \ throw new Error(`Unexpected status code: ${response.status} ${response.statusText}`);\n\
    \        }\n    } catch (error) {\n        console.error(error.message);\n   \
    \ }\n}\n```\n\nIn this rewritten version of `retrieveJsonData()`, the call to\
    \ `await fetch(url)` handles defining fulfillment and rejection handlers for the\
    \ returned promise. The variable `response` is assigned the fulfillment value\
    \ of that promise (if successful), and rejection throws an error that is caught\
    \ by the `try-catch` statement. The function still returns a promise that resolves\
    \ to the JSON data, but it does so by returning the fulfillment value of `response.json()`\
    \ (another promise). If a rejection is triggered in `response.json()`, then that\
    \ is also thrown as an error and caught in the `try-catch` statement.\n\nYou may\
    \ be wondering why not return `response.json()` directly without `await` if it\
    \ is a promise. For example:\n\n```javascript\nasync function retrieveJsonData(url)\
    \ {\n    try {\n        const response = await fetch(url);\n        if (response.ok)\
    \ {\n            return response.json();\n        } else {\n            throw\
    \ new Error(`Unexpected status code: ${response.status} ${response.statusText}`);\n\
    \        }\n    } catch (error) {\n        console.error(error.message);\n   \
    \ }\n}\n```\n\nThis will work the same as the preceding example when `response.json()`\
    \ succeeds; when `response.json()` fails, however, that rejection will not be\
    \ thrown as an error and will not be caught with the `try-catch`. It’s the `await`\
    \ expression that causes rejections to be thrown as errors, so if you omit `await`,\
    \ the promise rejection will only be caught by a rejection handler. In this example,\
    \ the rejection handler would have to be added by the code calling this function,\
    \ like:\n\n```javascript\nasync function retrieveJsonData(url) {\n    try {\n\
    \        const response = await fetch(url);\n        if (response.ok) {\n    \
    \        return response.json();\n        } else {\n            throw new Error(`Unexpected\
    \ status code: ${response.status} ${response.statusText}`);\n        }\n    }\
    \ catch (error) {\n        console.error(error.message);\n    }\n}\nretrieveJsonData(\"\
    https://api.com/users\")\n    .then(data => doSomething(data))\n    .catch(reason\
    \ => console.error(reason.message));\n```\n\nThere are valid use cases for both\
    \ scenarios, some where you want to catch the error inside the `async` function\
    \ and some where you want the error to flow outside.\n\n## Using Await Expressions\
    \ with Non-Promises\n\nYou can also use `await` with non-promise values because\
    \ the value is always passed through `Promise.resolve()`. That means promises\
    \ are passed through directly, non-promises are resolved to promises, and other\
    \ values are wrapped in promises. For example:\n\n```javascript\nasync function\
    \ getMeaningOfLife() {\n    return await 42;\n}\ngetMeaningOfLife().then(value\
    \ => console.log(value));\n```\n\nThe `getMeaningOfLife()` function in this code\
    \ returns a promise that is fulfilled with the value `42`. You can achieve the\
    \ same functionality without an `async` function by rewriting the previous example\
    \ as follows:\n\n```javascript\nfunction getMeaningOfLife() {\n    return Promise.resolve(42);\n\
    }\ngetMeaningOfLife().then(value => console.log(value));\n```\n\nThe ability of\
    \ `await` to handle non-promise values means that you aren’t penalized if you\
    \ guess incorrectly about the value being used.\n\n## Using Await Expressions\
    \ with Multiple Promises\n\nEven though `await` expressions operate on a single\
    \ promise, you can take advantage of the built-in promise methods to effectively\
    \ operate on multiple promises. For example, if you’d like to wait for every promise\
    \ in an array to be fulfilled, you can use the `Promise.all()` method with an\
    \ `await`:\n\n```javascript\nasync function doSomething() {\n    try {\n     \
    \   return await Promise.all([\n            promise1,\n            promise2,\n\
    \            promise3\n        ]);\n    } catch (error) {\n        console.error(error.message);\n\
    \    }\n}\n```\n\nIn this code, `await` is used on the result of `Promise.all()`\
    \ to cause the function to wait until all of the promises have been fulfilled\
    \ or one of them is rejected (in which case an error is thrown). The three promises\
    \ are free to be fulfilled in parallel while the function waits. Here’s an example\
    \ of reading multiple files in Node.js:\n\n```javascript\nimport { readFile }\
    \ from \"node:fs/promises\";\n\nasync function readFiles(filenames) {\n    const\
    \ fileContents = await Promise.all(\n        filenames.map(filename => readFile(filename,\
    \ \"utf8\"))\n    );\n\n    return fileContents.map(\n        fileContent => JSON.parse(fileContent)\n\
    \    );\n}\n\nreadFiles([\n    \"file1.json\",\n    \"file2.json\"\n]).then(data\
    \ => {\n    // process as necessary\n    console.log(data);\n}).catch(reason =>\
    \ {\n    console.error(reason.message);\n});\n```\n\nThe `readFiles()` async function\
    \ uses `await` with `Promise.all()` to wait for all of the files to be read. The\
    \ file contents can then be parsed as JSON to return the data in the most appropriate\
    \ format for processing.\n\nOf course, you can also use `await` with `Promise.allSettled()`,\
    \ `Promise.any()`, `Promise.race()`, or any other function that returns a promise.\n"
