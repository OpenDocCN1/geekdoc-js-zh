    and that doesn’t change because you’re listening for the uncaughtrejection event.
    You can prevent the console warning by calling event.preventDefault() inside the
    onuncaughtrejection event handler, as in this example:


    1 globalThis . onunhandledrejection = event => { 2 3     // prevents the console
    warning 4     event . preventDefault (); 5 };


    This example prevents the console warning but doesn’t affect the relationship
    with the rejectionhandled event, which will still be emitted if the promise that
    triggered unhandledrejection is later assigned a rejection handler.


    Handling Unhandled Rejections in Web Browsers


    Another quirk in the relationship between the unhandledrejection and rejectionhandled
    events is that you can prevent the rejectionhandled event from firing by adding
    a rejection handler inside of the onunhandledrejection event handler, like this:


    1 globalThis . onunhandledrejection = ({ promise , reason }) => { 2     promise
    . catch (() => {});       // handle the rejection 3 }; 4 5 // this will never
    be called 6 globalThis . onrejectionhandled = ({ promise }) => { 7     console
    . log ( promise ); 8 };


    In this case, the rejectionhandled event isn’t triggered because a rejection handler
    is added before it’s time for that event. The browser assumes that you know the
    promise is now handled and so there is no reason to trigger the rejectionhandled
    event.


    A console warning will still be output even after handling a rejection inside
    of onunhandledrejection unless you also call event.preventDefault() inside of
    onunhandledrejection .


    Node.js Unhandled Rejection Tracking


    Node.js tracks unhandled promise rejections in a similar, but not the same, way
    as browsers. There are two events in Node.js, but these are emitted on the process
    object and have different capitalization than the browser events:


    unhandledRejection : Emitted when a promise is rejected and no rejection handler
    is called within one turn of the event loop.


    rejectionHandled : Emitted when a promise is rejected and a rejection handler
    is called after one turn of the event loop.


    Also unlike the browser events, these events do not receive an event object. The
    unhandledRejection event handler is passed the rejection reason and the promise
    that was rejected as arguments. The following code shows unhandledRejection in
    action:


    1 const rejected = Promise . reject ( new Error ( “Oops!” )); 2 3 process . on
    ( “unhandledRejection” , ( reason , promise ) => { 4     console . log ( reason
    . message );             // “Oops!” 5     console . log ( rejected === promise
    );       // true 6 });


    This example creates a rejected promise with an error object and listens for the
    unhandledRejection event. The event handler receives the error object as the first
    argument and the promise as the second.


    The rejectionHandled event handler has only one argument, which is the promise
    that was rejected. For example:


    1 const rejected = Promise . reject ( new Error ( “Oops!” )); 2 3 setTimeout (()
    => { 4 5     // “rejectionhandled” triggered here 6     rejected . catch ( 7  
          reason => console . error ( reason . message ) // “Oops!” 8     ); 9 10
    }, 500 ); 11 12 process . on ( “rejectionHandled” , promise => { 13     console
    . log ( rejected === promise );   // true 14 });


    Here, the rejectionHandled event is emitted when the rejection handler is finally
    called. Note that, unlike in the browser, the reason for the rejection isn’t passed
    into the rejectionHandled event handler.


    By default, Node.js throws an error when an unhandled promise rejection occurs
    unless there is an event handler for unhandledRejection . You can change how Node.js
    handles uncaught promise rejections by using the –unhandled-rejection command-line
    option.


    –unhandled-rejection=throw (default) means that the unhandledRejection event is
    emitted. If there is no event handler specified for unhandledRejection , then
    the rejection reason is thrown as an error that can be caught by using an uncaughtException
    event handler. If no uncaughtException handler is specified, then the Node.js
    process exits with process.exitCode set to 1.


    –unhandled-rejection=strict means that the unhandledRejection event is not emitted.
    Instead, the rejection reason is thrown as that can be caught using an uncaughtException
    event handler. Any unhandledRejection handlers are not executed.


    –unhandled-rejection=warn means that the unhandledRejection event is emitted and
    a warning will always be output to the console regardless if any unhandledRejection
    handlers are defined. There is no change to the process exit code.


    –unhandled-rejection=warn-with-error-code acts the same as –unhandled-rejection=warn
    except that when the process exits it does so with process.exitCode set to 1 if
    no other exit code is specified.


    –unhandled-rejection=none completely ignores any unhandled promise rejections.
    There is no console output and the process continues executing JavaScript.


    For production deployments, the –unhandled-rejection=strict is recommended as
    a promise rejection may leave the application in an unstable state in a manner
    that is similar to an uncaught error.


    Reporting Unhandled Rejections in Node.js


    To properly track potentially unhandled rejections, use the unhandledRejection
    and rejectionHandled events to keep a list of potentially unhandled rejections
    (similar to the web browser approach). Here is a Node.js-specific version of the
    simple rejection tracker described earlier in this chapter for web browsers:


    1 const possiblyUnhandledRejections = new Map (); 2 3 // when a rejection is unhandled,
    add it to the map 4 process . on ( “unhandledRejection” , ( reason , promise )
    => { 5     possiblyUnhandledRejections . set ( promise , reason ); 6 }); 7 8 process
    . on ( “rejectionHandled” , promise => { 9     possiblyUnhandledRejections . delete
    ( promise ); 10 }); 11 12 setInterval (() => { 13 14     possiblyUnhandledRejections
    . forEach (( reason , promise ) => { 15 16         console . error ( “Unhandled
    rejection” ); 17         console . error ( promise ); 18         console . error
    ( reason . message ? reason . message : reason ); 19 20         // do something
    to handle these rejections 21     }); 22 23     possiblyUnhandledRejections .
    clear (); 24 25 }, 60000 );


    The algorithm for this rejection tracker is the same as in the web browser example;
    it just uses the Node.js-specific functionality instead. Otherwise, possiblyUnhandledRejections
    grows and shrinks as events are called and setInterval() is used to periodically
    check the list of possible unhandled rejections and output the information to
    the console.


    Summary


    All JavaScript runtimes track unhandled promise rejections in some way. Web browsers
    and Deno implement the algorithm specified in the HTML specification while Node.js
    implements its own solution. Both solutions rely on two events: one that is emitted
    when an untracked promise rejection occurs and one that is emitted if a previously
    untracked promise rejection has a rejection handler added.


    The unhandledrejection event is emitted on the globalThis object in web browsers
    and Deno whenever an unhandled rejection is detected. Event handlers for unhandledrejection
    receive an event object containing the type of event, the promise that was rejected,
    and the reason for the promise rejection. The rejectionhandled event is emitted
    when a previously untracked promise rejection has a rejection handler added. Event
    handlers for rejectionhandled also receive an event object that also contains
    the event type, the promise, and the rejection reason.


    Node.js also uses two events, but they occur on the process object and have slightly
    different names: unhandledRejection and rejectionHandled . Event handlers for
    unhandledRejection receive the rejection reason and the promise as arguments;
    event handlers for rejectionHandled receive just the promise.'
