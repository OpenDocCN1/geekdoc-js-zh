  trans: "\n\n```javascript\nasync function throwError () {\n    throw new Error(\"\
    Oh no!\");\n}\ntry {\n    throwError();\n    console.log(\"Didn’t catch error\"\
    );\n} catch (ex) {\n    // never called\n    console.log(\"Caught error\");\n\
    }\n```\n\n在这个示例中，`try-catch` 语句没有捕获 `throwError()` 抛出的错误，因为它返回的是一个被拒绝（rejected）的\
    \ promise。要捕获错误，你需要提供一个拒绝处理器，如下：\n\n```javascript\nasync function throwError ()\
    \ {\n    throw new Error(\"Oh no!\");\n}\nthrowError().catch(reason => {\n   \
    \ console.log(\"Caught error:\", reason.message);\n});\n```\n\n在这里，拒绝处理器是通过 `catch()`\
    \ 指定的，错误会导致向 `console` 输出一条消息。\n\nJavaScript 引擎花费了大量精力来确保 `async` 函数始终返回 promise，这样你就有了一种一致的方式来处理返回值。这引出了\
    \ `async` 函数与同步函数不同的第三种方式：`await` 表达式。\n\n## 使用 await 表达式\n\n`await` 表达式的设计初衷是让处理\
    \ promise 变得简单。无需手动分配履行（fulfillment）和拒绝（rejection）处理器，`await` 表达式中使用的任何 promise\
    \ 的行为都更像同步函数中的代码：该表达式在成功时返回 promise 的已履行值，在 promise 失败时抛出拒绝值。这允许你轻松地将 `await`\
    \ 表达式的结果赋值给变量，并使用 `try-catch` 语句捕获任何拒绝。这里是一个使用 `fetch()` API（在浏览器和 Deno 中可用）但未使用\
    \ `await` 的示例：\n\n```javascript\nfunction retrieveJsonData(url) {\n    return\
    \ fetch(url)\n        .then(response => {\n            if (response.ok) {\n  \
    \              return response.json();\n            } else {\n               \
