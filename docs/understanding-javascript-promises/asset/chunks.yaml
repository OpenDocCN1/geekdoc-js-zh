  trans: "\n\n你可以在任何点调用 `then()` 或 `catch()`，并且无论 promise 是否已经着绪（settled），它们都能正常工作，这使得很难准确判断\
    \ promise 何时会被处理。在这种情况下，promise 会立即被拒绝（rejected），但直到之后才被处理。\n\nJavaScript 规范认为，如果\
    \ promise 的 `then()` 方法被调用，则该 promise 已经被处理（这包括 `catch()` 和 `finally()`，这两者都会在后台调用\
    \ `then()`）。实际上，无论你绑定了成功处理器、拒绝处理器，还是两者都没有绑定，只要调用了 `then()`，这在其中并不重要。每次调用 `then()`\
    \ 都会创建一个新的 promise，然后该 promise 将负责处理任何成功或拒绝的情况。考虑这个示例：\n\n```javascript\nconst\
    \ promise1 = new Promise (( resolve , reject ) => {\n    reject ( 43 );\n});\n\
    const promise2 = promise1 .then ( value => {\n    console .log ( value );\n});\n\
    ```\n\n在这里，`promise1` 被视为已处理，因为它调用了 `then()` 并且绑定了一个成功处理器。当 `promise1` 被拒绝时，该拒绝会被传递给\
    \ `promise2`，而 `promise2` 是未处理的。运行时会报告来自 `promise2` 的未处理拒绝并忽略 `promise1`。因此，运行时并不是真的在追踪所有的未处理拒绝，而是在追踪链条中的最后一个\
    \ promise 是否绑定了任何处理器。\n\n虽然 JavaScript 规范确实指出了如何追踪未处理的拒绝，但它并没有规定当发生未处理的拒绝时运行时应该怎么做。这些细节留给运行时自行决定，因为根据运行时执行位置的不同，适当的反应也可能有所不同。\n\
    \n## Web 浏览器中的未处理拒绝追踪\n\nWeb 浏览器的未处理拒绝追踪定义在 HTML 规范中。未处理拒绝追踪的核心是两个由 `globalThis`\
    \ 对象发射的事件：\n\n- `unhandledrejection`：当一个 promise 被拒绝且在事件循环的一个轮次内没有调用拒绝处理器时，发射。\n\
    - `rejectionhandled`：当一个 promise 被拒绝且在事件循环的一个轮次后调用了拒绝处理器时发射。\n\n这两个事件被设计为结合使用，以准确检测未处理的\
    \ promise 拒绝。以下是一个显示每个事件何时触发的示例：\n\n```javascript\nconst rejected = Promise .reject\
    \ ( new Error ( “Oops!”));\n\nsetTimeout (() => {\n    // 这里触发“rejectionhandled”\n\
    \    rejected .catch (\n        reason => console .error ( reason . message )\
    \    // “Oops!”\n    );\n}, 500 );\n\n// 在此处触发“unhandledrejection”\n```\n\n在这段代码中，`rejected`\
    \ 是一个最初没有绑定拒绝处理器的被拒绝 promise。一旦脚本任务完成，就会发射 `unhandledrejection` 事件，告知你存在一个没有拒绝处理器的被拒绝\
    \ promise。定时器在延迟 `500` 毫秒后添加了一个拒绝处理器，此时会发射 `rejectionhandled` 事件，告知你一个之前被标记为具有未处理拒绝的\
    \ promise 现在已经被处理了。这意味着你需要追踪触发这些事件的 promise，以便准确检测问题。\n\n`unhandledrejection`\
    \ 和 `rejectionhandled` 都会生成一个包含以下属性的事件对象：\n\n- `type`：事件名称（`“unhandledrejection”`\
    \ 或 `“rejectionhandled”`）\n- `promise`：被拒绝的 promise 对象\n- `reason`：promise 的拒绝值\n\
    \n通过这些信息，你可以追踪哪些 promise 没有拒绝处理器，如示例所示：\n\n```javascript\nconst rejected = Promise\
    \ .reject ( new Error ( “Oops!”));\n\nsetTimeout (() => {\n    // 这里触发“rejectionhandled”\n\
    \    rejected .catch (\n        reason => console .error ( reason .message ) //\
    \ “Oops!”\n    );\n}, 500 );\n\nglobalThis .onunhandledrejection = event => {\n\
    \    console .log ( event .type );                     // “unhandledrejection”\n\
    \    console .log ( event .reason . message );          // “Oops!”\n    console\
    \ .log ( rejected === event .promise );     // true\n};\n\nglobalThis .onrejectionhandled\
    \ = event => {\n    console .log ( event .type );                     // “rejectionhandled”\n\
    \    console .log ( event .reason . message );          // “Oops!”\n    console\
    \ .log ( rejected === event .promise );     // true\n};\n\n// 在此处触发“unhandledrejection”\n\
    ```\n\n此代码使用 DOM Level 0 记法 `onunhandledrejection` 和 `onrejectionhandled` 分配了两个事件处理器。（如果你喜欢，在两种情况下也可以使用\
    \ `addEventListener()`。）每个事件处理器都会接收一个包含被拒绝 promise 信息的事件对象。`type`、`promise` 和\
    \ `reason` 属性在事件处理器中都是可用的。\n\n尽管本节关注 Web 浏览器中的未处理拒绝，但 Deno 决定将 HTML 规范的未处理拒绝追踪作为其的一部分。在编写本文时，Deno\
    \ 已为 worker 实现了 `unhandledrejection` 和 `rejectionhandled` 事件，但尚未实现主线程。此问题正在积极处理，应该很快解决。\n\
    \n## 在 Web 浏览器中报告未处理的拒绝\n\n虽然 `unhandledrejection` 和 `rejectionhandled` 对于识别问题很有帮助，但如果没有额外的辅助，对于生产环境中的追踪并没有帮助。你并不需要记录每一个未处理的拒绝，因为拒绝处理器可能会稍后添加，因此指定一个预计所有拒绝都会被处理的时间范围是合理的。例如，你可能想记录一分钟内未处理的每一个拒绝。要这样做，你需要追踪触发了\
    \ `unhandledrejection` 但没有触发 `rejectionhandled` 的 promise。以下是实现此点的方法：\n\n```javascript\n\
    const possiblyUnhandledRejections = new Map ();\n\n// 当拒绝未被处理时，将其添加到 map 中\nglobalThis\
    \ .onunhandledrejection = event => {\n    possiblyUnhandledRejections .set ( event\
    \ .promise , event .reason );\n};\n\n// 当拒绝被处理时，将其从 map 中移除\nglobalThis .onrejectionhandled\
    \ = event => {\n    possiblyUnhandledRejections .delete ( event .promise );\n\
    };\n\nsetInterval (() => {\n    possiblyUnhandledRejections .forEach (( reason\
    \ , promise ) => {\n        console .error ( “Unhandled rejection” );\n      \
    \  console .error ( promise );\n        console .error ( reason .message ? reason\
    \ .message : reason );\n        // 对这些拒绝进行处理\n    });\n    possiblyUnhandledRejections\
    \ .clear ();\n}, 60000 );\n```\n\n这是一个简单的未处理拒绝追踪。它使用 map 存储 promise 及其拒绝原因。每个\
    \ promise 是一个键，promise 的原因是关联的值。每当发射 `unhandledrejection` 时，promise 及其原因就会添加到\
    \ map 中。每当发射 `rejectionhandled` 时，处理过的 promise 就会从 map 中移除。因此，`possiblyUnhandledRejections`\
    \ 随着事件的发射而增长和缩小。`setInterval()` 调用定期检查可能的未处理拒绝列表，并将信息输出到控制台（在现实中，你可能想采取其他操作来记录或处理这些拒绝）。\n\
    \n"
- fmt: "\nBy default, browsers and Deno will output uncaught rejections to the console,\
    \ and that doesn’t change because you’re listening for the `uncaughtrejection`\
    \ event. You can prevent the console warning by calling `event.preventDefault()`\
    \ inside the `onuncaughtrejection` event handler, as in this example:\n\n```javascript\n\
    globalThis . onunhandledrejection = event => {\n    // prevents the console warning\n\
    \    event . preventDefault (); \n};\n```\n\nThis example prevents the console\
    \ warning but doesn’t affect the relationship with the `rejectionhandled` event,\
    \ which will still be emitted if the promise that triggered `unhandledrejection`\
    \ is later assigned a rejection handler.\n\n# Handling Unhandled Rejections in\
    \ Web Browsers\n\nAnother quirk in the relationship between the `unhandledrejection`\
    \ and `rejectionhandled` events is that you can prevent the `rejectionhandled`\
    \ event from firing by adding a `rejection-handler` inside of the `onunchandledrejection`\
    \ event handler, like this:\n\n```javascript\nglobalThis . onunhandledrejection\
    \ = ({ promise , reason }) => {\n    promise . catch (() => {});       // handle\
    \ the rejection \n};\n\n// this will never be called\nglobalThis . onrejectionhandled\
    \ = ({ promise }) => {\n    console . log ( promise );\n};\n```\n\nIn this case,\
    \ the `rejectionhandled` event isn’t triggered because a rejection handler is\
    \ added before it’s time for that event. The browser assumes that you know the\
    \ promise is now handled and so there is no reason to trigger the `rejectionhandled`\
    \ event.\n\nA console warning will still be output even after handling a rejection\
    \ inside of `onunchandledrejection` unless you also call `event.preventDefault()`\
    \ inside of `onunchandledrejection`.\n\n# Node.js Unhandled Rejection Tracking\n\
    \nNode.js tracks unhandled promise rejections in a similar, but not the same,\
    \ way as browsers. There are two events in Node.js, but these are emitted on the\
    \ `process` object and have different capitalization than the browser events:\n\
    \n- `unhandledRejection`: Emitted when a promise is rejected and no rejection\
    \ handler is called within one turn of the event loop.\n- `rejectionHandled`:\
    \ Emitted when a promise is rejected and a rejection handler is called after one\
    \ turn of the event loop.\n\nAlso unlike the browser events, these events do not\
    \ receive an event object. The `unhandledRejection` event handler is passed the\
    \ `rejection reason` and the `promise` that was rejected as arguments. The following\
    \ code shows `unhandledRejection` in action:\n\n```javascript\nconst rejected\
    \ = Promise . reject ( new Error ( “Oops!” ));\nprocess . on ( “unhandledRejection”\
    \ , ( reason , promise ) => {\n    console . log ( reason . message );       \
    \      // “Oops!”\n    console . log ( rejected === promise );      // true\n\
    });\n```\n\nThis example creates a rejected promise with an error object and listens\
    \ for the `unhandledRejection` event. The event handler receives the error object\
    \ as the first argument and the `promise` as the second.\n\nThe `rejectionHandled`\
    \ event handler has only one argument, which is the `promise` that was rejected.\
    \ For example:\n\n```javascript\nconst rejected = Promise . reject ( new Error\
    \ ( “Oops!” ));\n\nsetTimeout (() => {\n    // “rejectionhandled” triggered here\n\
    \    rejected . catch (\n        reason => console . error ( reason . message\
    \ ) // “Oops!”\n    );\n}, 500 );\n\nprocess . on ( “rejectionHandled” , promise\
    \ => {\n    console . log ( rejected === promise );  // true\n});\n```\n\nHere,\
    \ the `rejectionHandled` event is emitted when the rejection handler is finally\
    \ called. Note that, unlike in the browser, the reason for the rejection isn’t\
    \ passed into the `rejectionHandled` event handler.\n\nBy default, Node.js throws\
    \ an error when an unhandled promise rejection occurs unless there is an event\
    \ handler for `unhandledRejection`. You can change how Node.js handles uncaught\
    \ promise rejections by using the `--unhandled-rejection` command-line option.\n\
    \n- `--unhandled-rejection=throw (default)` means that the `unhandledRejection`\
    \ event is emitted. If there is no event handler specified for `unhandledRejection`,\
    \ then the rejection reason is thrown as an error that can be caught by using\
    \ an `uncaughtException` event handler. If no `uncaughtException` handler is specified,\
    \ then the Node.js process exits with `process.exitCode` set to 1.\n- `--unhandled-rejection=strict`\
    \ means that the `unhandledRejection` event is not emitted. Instead, the rejection\
    \ reason is thrown as that can be caught using an `uncaughtException` event handler.\
    \ Any `unhandledRejection` handlers are not executed.\n- `--unhandled-rejection=warn`\
    \ means that the `unhandledRejection` event is emitted and a warning will always\
    \ be output to the console regardless if any `unhandledRejection` handlers are\
    \ defined. There is no change to the process exit code.\n- `--unhandled-rejection=warn-with-error-code`\
    \ acts the same as `--unhandled-rejection=warn` except that when the process exits\
    \ it does so with `process.exitCode` set to 1 if no other exit code is specified.\n\
    - `--unhandled-rejection=none` completely ignores any unhandled promise rejections.\
    \ There is no console output and the process continues executing JavaScript.\n\
    \nFor production deployments, the `--unhandled-rejection=strict` is recommended\
    \ as a promise rejection may leave the application in an unstable state in a manner.\n\
    \n# Reporting Unhandled Rejections in Node.js\n\nTo properly track unhandled rejections,\
    \ use the `unhandledRejection` and `rejectionHandled` events to keep a list of\
    \ potentially unhandled rejections. Here is a Node.js-specific version of the\
    \ simple rejection tracker described earlier for web browsers:\n\n```javascript\n\
    const possiblyUnhandledRejections = new Map();\n\n// when rejection is unhandled,\
    \ add it to the map\nprocess . on ( “unhandledRejection” , ( reason , promise\
    \ ) => {\n    possiblyUnhandledRejections . set ( promise , reason );\n});\n\n\
    // when rejection is handled, remove it\nprocess . on ( “rejectionHandled” , promise\
    \ => {\n    possiblyUnhandledRejections . delete ( promise );\n});\n\nsetInterval(()\
    \ => {\n    possiblyUnhandledRejections .forEach ((reason , promise) => {\n  \
    \      console . error ( “Unhandled rejection” );\n        console . error ( promise\
    \ );\n        console . error ( reason . message : reason );\n        // do something\
    \ to handle these rejections\n    });\n    possiblyUnhandledRejections .clear();\n\
    }, 60000 );\n```\n\nThe algorithm for this rejection tracker is the same as in\
    \ the web browser; it just uses the Node.js-specific functionality. Otherwise,\
    \ `possiblyUnhandledRejections` grows and shrinks as events are called and `setInterval()`\
    \ is used to periodically check the list of possible unhandled rejections and\
    \ output the information to the console.\n\n# Summary\n\nAll JavaScript runtimes\
    \ track unhandled promise rejections in some way. Web browsers and Deno implement\
    \ the algorithm specified in the HTML specification while Node.js implements its\
    \ own solution. Both solutions rely on two events: one that is emitted when an\
    \ untracked promise rejection occurs and one that is emitted if a previously untracked\
    \ promise rejection has a rejection handler added.\n\nThe `unhandledrejection`\
    \ event is emitted on the `globalThis` object in web browsers and Deno whenever\
    \ an unhandled rejection is detected. Event handlers for `unhandledrejection`\
    \ receive an event object containing the type of event, the `promise` that was\
    \ rejected, and the reason for the promise rejection. The `rejectionhandled` event\
    \ is emitted when a previously untracked promise rejection has a rejection handler\
    \ added.\n\nNode.js also uses two events, but they occur on the `process` object\
    \ and have slightly different names: `unhandledRejection` and `rejectionHandled`.\
    \ Event handlers for `unhandledRejection` receive the rejection reason and the\
    \ `promise` as arguments; event handlers for `rejectionHandled` receive just the\
    \ `promise`.\n"
