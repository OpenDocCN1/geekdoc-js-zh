  trans: "\n\n# 使用 for-await-of 循环\n\n异步函数内部启用的另一种特殊语法是 `for-await-of` 循环，它允许你从可迭代对象或异步可迭代对象获取值。可迭代对象是一个具有\
    \ `Symbol.iterator` 方法的对象，该方法返回一个迭代器；异步可迭代对象是一个具有 `Symbol.asyncIterator` 方法的对象，该方法返回的迭代器其值总是\
    \ promise。`for-await-of` 循环会对从可迭代对象返回的每个值调用 `Promise.resolve()`，然后在等待每个 promise\
    \ 决后后再继续循环的下一次迭代。\n\nJavaScript 中最常用的可迭代对象是数组，因此你可以使用 `for-await-of` 循环配合 promise\
    \ 数组来按顺序处理 promise，例如所示：\n\n```javascript\nconst promise1 = Promise.resolve(1);\n\
    const promise2 = Promise.resolve(2);\nconst promise3 = Promise.resolve(3);\n\n\
    for await (const value of [promise1, promise2, promise3]) {\n    console.log(value);\n\
    }\n```\n\n此示例按顺序处理 `promise1`、`promise2` 和 `promise3`。尽管这些是已决定的 promise，`for-await-of`\
    \ 循环同样适用于未决定的 promise。由于 `for-await-of` 循环始终对从可迭代对象中获取的任何值调用 `Promise.resolve()`，你可以直接对数组使用它，如下：\n\
    \n```javascript\nfor await (const value of [1, 2, 3]) {\n    console.log(value);\n\
    }\n```\n\n尽管此示例的数组中没有 promise，`for-await-of` 循环仍然可以工作。\n\nNode.js 中最常用的异步可迭代对象是\
    \ `ReadStream` 对象。`ReadStream` 对象用于定期从源读取数据，该源中的所有数据可能并非随时可用。对于网络请求、读取大文件或事件流，`ReadStream`\
    \ 对象是处理此类数据的方便方式。这是一个示例：\n\n```javascript\nimport fs from \"node:fs\";\n\nasync\
    \ function readCompleteTextStream(readable) {\n    readable.setEncoding(\"utf8\"\
    );\n\n    let data = \"\";\n    for await (const chunk of readable) {\n      \
    \  data += chunk;\n    }\n\n    return data;\n}\n\nconst stream = fs.createReadStream(\"\
    data.txt\");\nreadCompleteTextStream(stream)\n    .then(text => console.log(text));\n\
    ```\n\n`readCompleteTextStream()` 函数接受一个名为 `readable` 的 `ReadStream` 对象作为参数。读取文本文件的第一步是使用\
    \ `setEncoding()` 方法将编码设置为 \"utf8\"。然后，`for-await-of` 循环遍历从 `readable` 读取的数据。如果文件很短，可能只有一个数据块；如果文件很长，可能会有多个数据块。使用\
    \ `for-await-of` 循环允许你不无需返回块的数量。\n\n与 `await` 表达式类似，如果异步可迭代对象返回的任何 promise 被拒绝（rejected），`for-await-of`\
    \ 循环将抛出错误。你可以在异步函数内部使用 `try-catch` 语句捕获该错误，例如：\n\n```javascript\nimport fs from\
    \ \"node:fs\";\n\nasync function readCompleteTextStream(readable) {\n    readable.setEncoding(\"\
    utf8\");\n\n    try {\n        let data = \"\";\n        for await (const chunk\
    \ of readable) {\n            data += chunk;\n        }\n        return data;\n\
    \    } catch (error) {\n        console.error(error.message);\n    }\n}\n\nconst\
    \ stream = fs.createReadStream(\"data.txt\");\nreadCompleteTextStream(stream)\n\
    \    .then(text => console.log(text));\n```\n\n在此示例中，`readCompleteTextStream()`\
    \ 函数接受一个名为 `readable` 的 `ReadStream` 对象作为参数。\n\n## 顶层等待 (Top-Level Await)\n\n\
    你可以在 JavaScript 模块的异步函数外部使用顶级 await。\n\n```javascript\n// 静态导入\nimport something\
    \ from \"./file.js\";\n\n// 动态导入\nconst somethingElse = await import(\"./another-file.js\"\
    );\n```\n\n当 JavaScript 引擎遇到顶层 await 时，模块执行将暂停，直到 promise 稳定。这允许你在模块级别使用顶层 await。注意，脚本（scripts）中不支持顶层\
    \ await。\n\n## 总结\n\n- 异步函数允许你使用 promise 而无需手动分配处理程序。\n- 异步函数的返回值始终是一个 promise。如果你从异步函数中返回一个\
    \ promise，它将返回给调用处；如果你返回一个非 promise 值，则它会被解析为 promise。\n- 异步函数内部抛出的错误会被捕获并作为拒绝的\
    \ promise 返回。由于这种行为，你无法使用 `try-catch` 捕获错误；相反，你需要为返回的 promise 分配拒绝处理程序。\n- 异步函数启用了两种特殊语法：`await`\
    \ 表达式和 `for-await-of` 循环。`await` 表达式用于为 promise 分配履行和拒绝处理程序，使得履行值成为 `await` 表达式的结果，拒绝会导致抛出错误。同样，`for-await-of`\
    \ 循环作用异步可迭代对象，允许使用 promise 代替循环。`for-await-of` 循环等待异步可迭代对象返回的每个 promise 履行后再进入下一个\
    \ promise。如果异步可迭代对象的 promise 被拒绝，则会抛出错误。\n- 你可以在 JavaScript 模块的异步函数外部使用顶级 await\
    \ 表达式。此功能在脚本中不可用。\n\n## 5. 未处理拒绝追踪\n\n由于 promise 的性质，判断 promise 拒绝是否被处理并非简单。例如，考虑以下示例：\n\
    \n```javascript\nlet rejected = Promise.reject(42);\n\n// 在此点，rejected 是未处理的\n\
    setTimeout(() => {\n    rejected.catch(value => {\n        // 现在 rejected 已被处理\n\
    \        console.log(value);\n    });\n}, 5000);\n```\n\n"
- fmt: "\nYou can call `then()` or `catch()` at any point and have them work correctly\
    \ regardless of whether the promise is settled or not, making it hard to know\
    \ precisely when a promise is going to be handled. In this case, the promise is\
    \ rejected immediately but isn’t handled until later.\n\nThe JavaScript specification\
    \ considers a promise to be handled if the promise’s `then()` method has been\
    \ called (which includes `catch()` and `finally()`, both of which call `then()`\
    \ behind the scenes). It actually doesn’t matter if you’ve attached a fulfillment\
    \ handler, a rejection handler, or neither, so long as `then()` was called. Each\
    \ call to `then()` creates a new promise which then becomes responsible for dealing\
    \ with any fulfillment or rejection. Consider this example:\n\n```javascript\n\
    const promise1 = new Promise (( resolve , reject ) => {\n    reject ( 43 );\n\
    });\nconst promise2 = promise1 .then ( value => {\n    console .log ( value );\n\
    });\n```\n\nHere, `promise1` is considered handled because `then()` is called\
    \ and a fulfillment handler is attached. When `promise1` is rejected, that rejection\
    \ is passed on to `promise2`, which is not handled. A runtime would report the\
    \ unhandled rejection from `promise2` and disregard `promise1`. So, the runtime\
    \ isn’t really tracking all unhandled rejections, but rather, it’s tracking whether\
    \ the last promise in a chain has any handlers attached.\n\nWhile the JavaScript\
    \ specification does indicate how to track unhandled rejections, it doesn’t specify\
    \ what a runtime should do when an unhandled rejection occurs. Those details are\
    \ left to the runtimes themselves as the appropriate reaction may be different\
    \ depending on where the runtime is executed.\n\n## Web Browser Unhandled Rejection\
    \ Tracking\n\nUnhandled rejection tracking for web browsers is defined in the\
    \ HTML specification. At the core of unhandled rejection tracking are two events\
    \ that are emitted by the `globalThis` object:\n\n- `unhandledrejection`: Emitted\
    \ when a promise is rejected and no rejection handler is called within one turn\
    \ of the event loop.\n- `rejectionhandled`: Emitted when a promise is rejected\
    \ and a rejection handler is called after one turn of the event loop.\n\nThese\
    \ two events are designed to be used together to accurately detect unhandled promise\
    \ rejections. Here’s an example showing when each event is triggered:\n\n```javascript\n\
    const rejected = Promise .reject ( new Error ( “Oops!”));\n\nsetTimeout (() =>\
    \ {\n    // “rejectionhandled” triggered here\n    rejected .catch (\n       \
    \ reason => console .error ( reason . message )    // “Oops!”\n    );\n}, 500\
    \ );\n\n// “unhandledrejection” triggered at this point\n```\n\nIn this code,\
    \ `rejected` is a rejected promise that has no rejection handler attached initially.\
    \ The `unhandledrejection` event is emitted once the script task has completed\
    \ to let you know that a rejected promise exists without a rejection handler.\
    \ The timer adds a rejection handler after a delay of `500` milliseconds, at which\
    \ point the `rejectionhandled` event is emitted to let you know that a promise\
    \ previously flagged as having an unhandled rejection has now been handled. That\
    \ means you need to track the promises triggering these events in order to accurately\
    \ detect problems.\n\nBoth `unhandledrejection` and `rejectionhandled` generate\
    \ an event object containing the following properties:\n\n- `type`: The name of\
    \ the event (`“unhandledrejection”` or `“rejectionhandled”`)\n- `promise`: The\
    \ promise object that was rejected\n- `reason`: The rejection value from the promise\n\
    \nWith this information you can track which promises don’t have rejection handlers,\
    \ as in this example:\n\n```javascript\nconst rejected = Promise .reject ( new\
    \ Error ( “Oops!”));\n\nsetTimeout (() => {\n    // “rejectionhandled” triggered\
    \ here\n    rejected .catch (\n        reason => console .error ( reason .message\
    \ ) // “Oops!”\n    );\n}, 500 );\n\nglobalThis .onunhandledrejection = event\
    \ => {\n    console .log ( event .type );                     // “unhandledrejection”\n\
    \    console .log ( event .reason . message );          // “Oops!”\n    console\
    \ .log ( rejected === event .promise );     // true\n};\n\nglobalThis .onrejectionhandled\
    \ = event => {\n    console .log ( event .type );                     // “rejectionhandled”\n\
    \    console .log ( event .reason . message );          // “Oops!”\n    console\
    \ .log ( rejected === event .promise );     // true\n};\n\n// “unhandledrejection”\
    \ triggered at this point\n```\n\nThis code assigns both event handlers using\
    \ the DOM Level 0 notation of `onunhandledrejection` and `onrejectionhandled`.\
    \ (You can also use `addEventListener()` in both cases if you prefer.) Each event\
    \ handler receives an event object containing information about the rejected promise.\
    \ The `type`, `promise`, and `reason` properties are all available in event handlers.\n\
    \nEven though this section focuses on unhandled rejection in web browsers, Deno\
    \ has decided to implement the HTML specification’s unhandled rejection tracking\
    \ as part of its. At the time of this writing, Deno has implemented `unhandledrejection`\
    \ and `rejectionhandled` events for workers but not for the main thread. This\
    \ issue is actively being worked on and should be resolved soon.\n\n## Reporting\
    \ Unhandled Rejections in Web Browsers\n\nWhile the `unhandledrejection` and `rejectionhandled`\
    \ events are helpful in identifying problems, they are not useful for tracking\
    \ in production without some addition. You don’t necessarily want to log every\
    \ unhandled rejection because a rejection handler may be added later, so it makes\
    \ sense to specify a timeframe within which you expect all rejections to be handled.\
    \ For instance, you might want to log every rejection that hasn’t been handled\
    \ within a minute. To do so, you need to track promises that triggered `unhandledrejection`\
    \ but did not trigger `rejectionhandled`. Here’s one approach to doing that:\n\
    \n```javascript\nconst possiblyUnhandledRejections = new Map ();\n\n// when a\
    \ rejection is unhandled, add it to the map\nglobalThis .onunhandledrejection\
    \ = event => {\n    possiblyUnhandledRejections .set ( event .promise , event\
    \ .reason );\n};\n\n// when a rejection is handled, remove it from the map\nglobalThis\
    \ .onrejectionhandled = event => {\n    possiblyUnhandledRejections .delete (\
    \ event .promise );\n};\n\nsetInterval (() => {\n    possiblyUnhandledRejections\
    \ .forEach (( reason , promise ) => {\n        console .error ( “Unhandled rejection”\
    \ );\n        console .error ( promise );\n        console .error ( reason .message\
    \ ? reason .message : reason );\n        // do something to handle these rejections\n\
    \    });\n    possiblyUnhandledRejections .clear ();\n}, 60000 );\n```\n\nThis\
    \ is a simple unhandled rejection tracker. It uses a map to store promises and\
    \ their rejection reasons. Each promise is a key, and the promise’s reason is\
    \ the associated value. Each time `unhandledrejection` is emitted, the promise\
    \ and its reason are added to the map. Each time `rejectionhandled` is emitted,\
    \ the handled promise is removed from the map. As a result, `possiblyUnhandledRejections`\
    \ grows and shrinks as events are emitted. The `setInterval()` call periodically\
    \ checks the list of possible unhandled rejections and outputs the information\
    \ to the console (in reality, you’ll probably want to do something else to log\
    \ or otherwise handle the rejection).\n"
  raw: 'You can call then() or catch() at any point and have them work correctly regardless
    of whether the promise is settled or not, making it hard to know precisely when
    a promise is going to be handled. In this case, the promise is rejected immediately
    but isn’t handled until later.


    The JavaScript specification considers a promise to be handled if the promise’s
    then() method has been called (which includes catch() and finally() , both of
    which call then() behind the scenes). It actually doesn’t matter if you’ve attached
    a fulfillment handler, a rejection handler, or neither, so long as then() was
    called. Each call to then() creates a new promise which then becomes responsible
    for dealing with any fulfillment or rejection. Consider this example:


    1 const promise1 = new Promise (( resolve , reject ) => { 2     reject ( 43 );
    3 }); 4 5 const promise2 = promise1 . then ( value => { 6     console . log (
    value ); 7 });


    Here, promise1 is considered handled because then() is called and a fulfillment
    handler is attached. When promise1 is rejected, that rejection is passed on to
    promise2 , which is not handled. A runtime would report the unhandled rejection
    from promise2 and disregard promise1 . So, the runtime isn’t really tracking all
    unhandled rejections, but rather, it’s tracking whether the last promise in a
    chain has any handlers attached.


    While the JavaScript specification does indicate how to track unhandled rejections,
    it doesn’t specify what a runtime should do when an unhandled rejection occurs.
    Those details are left to the runtimes themselves as the appropriate reaction
    may be different depending on where the runtime is executed.


    Web Browser Unhandled Rejection Tracking


    Unhandled rejection tracking for web browsers is defined in the HTML specification
    . At the core of unhandled rejection tracking are two events that are emitted
    by the globalThis object:


    unhandledrejection : Emitted when a promise is rejected and no rejection handler
    is called within one turn of the event loop.


    rejectionhandled : Emitted when a promise is rejected and a rejection handler
    is called after one turn of the event loop.


    These two events are designed to be used together to accurately detect unhandled
    promise rejections. Here’s an example showing when each event is triggered:


    1 const rejected = Promise . reject ( new Error ( “Oops!” )); 2 3 setTimeout (()
    => { 4 5     // “rejectionhandled” triggered here 6     rejected . catch ( 7  
          reason => console . error ( reason . message )     // “Oops!” 8     ); 9
    10 }, 500 ); 11 12 // “unhandledrejection” triggered at this point


    In this code, rejected is a rejected promise that has no rejection handler attached
    initially. The unhandledrejection event is emitted once the script task has completed
    to let you know that a rejected promise exists without a rejection handler. The
    timer adds a rejection handler after a delay of 500 milliseconds, at which point
    the rejectionhandled event is emitted to let you know that a promise previously
    flagged as having an unhandled rejection has now been handled. That means you
    need to track the promises triggering these events in order to accurately detect
    problems.


    Both unhandledrejection and rejectionhandled generate an event object containing
    the following properties:


    type : The name of the event ( “unhandledrejection” or “rejectionhandled” )


    promise : The promise object that was rejected


    reason : The rejection value from the promise


    With this information you can track which promises don’t have rejection handlers,
    as in this example:


    1 const rejected = Promise . reject ( new Error ( “Oops!” )); 2 3 setTimeout (()
    => { 4 5     // “rejectionhandled” triggered here 6     rejected . catch ( 7  
          reason => console . error ( reason . message ) // “Oops!” 8     ); 9 10
    }, 500 ); 11 12 globalThis . onunhandledrejection = event => { 13     console
    . log ( event . type );                     // “unhandledrejection” 14     console
    . log ( event . reason . message );           // “Oops!” 15     console . log
    ( rejected === event . promise );     // true 16 }; 17 18 globalThis . onrejectionhandled
    = event => { 19     console . log ( event . type );                     // “rejectionhandled”
    20     console . log ( event . reason . message );           // “Oops!” 21    
    console . log ( rejected === event . promise );     // true 22 }; 23 24 // “unhandledrejection”
    triggered at this point


    This code assigns both event handlers using the DOM Level 0 notation of onunhandledrejection
    and onrejectionhandled . (You can also use addEventListener() in both cases if
    you prefer.) Each event handler receives an event object containing information
    about the rejected promise. The type , promise , and reason properties are all
    available in both event handlers.


    Even though this section focuses on unhandled rejection tracking in web browsers,
    Deno has decided to implement the HTML specification’s unhandled rejection tracking
    as part of its web platform compatibility. Everything discussed in this section,
    therefore, also applies to Deno even when not explicitly mentioned.


    At the time of this writing, Deno has implemented unhandledrejection and rejectionhandled
    events for workers but not for the main thread. This issue is actively being worked
    on and should be resolved soon.


    Reporting Unhandled Rejections in Web Browsers


    While the unhandledrejection and rejectionhandled events are helpful in identifying
    potential problems, they are not useful for tracking problems in production without
    some addition functionality. You don’t necessarily want to log every unhandled
    rejection because a rejection handler may be added later, so it makes sense to
    specify a timeframe within which you expect all promise rejections to be handled.
    For instance, you might want to log every rejection that hasn’t been handled within
    a minute. To do so, you need to track promises that triggered unhandledrejection
    but did not trigger rejectionhandled . Here’s one approach to doing that:


    1 const possiblyUnhandledRejections = new Map (); 2 3 // when a rejection is unhandled,
    add it to the map 4 globalThis . onunhandledrejection = event => { 5     possiblyUnhandledRejections
    . set ( event . promise , event . reason ); 6 }; 7 8 // when a rejection is handled,
    remove it from the map 9 globalThis . onrejectionhandled = event => { 10     possiblyUnhandledRejections
    . delete ( event . promise ); 11 }; 12 13 setInterval (() => { 14 15     possiblyUnhandledRejections
    . forEach (( reason , promise ) => { 16         17         console . error ( “Unhandled
    rejection” ); 18         console . error ( promise ); 19         console . error
    ( reason . message ? reason . message : reason ); 20 21         // do something
    to handle these rejections 22     }); 23 24     possiblyUnhandledRejections .
    clear (); 25 26 }, 60000 );


    This is a simple unhandled rejection tracker. It uses a map to store promises
    and their rejection reasons. Each promise is a key, and the promise’s reason is
    the associated value. Each time unhandledrejection is emitted, the promise and
    its rejection reason are added to the map. Each time rejectionhandled is emitted,
    the handled promise is removed from the map. As a result, possiblyUnhandledRejections
    grows and shrinks as events are emitted. The setInterval() call periodically checks
    the list of possible unhandled rejections and outputs the information to the console
    (in reality, you’ll probably want to do something else to log or otherwise handle
    the rejection). A map is used in this example instead of a weak map because you
    need to inspect the map periodically to see which promises are present, and that’s
    not possible with a weak map.


    Preventing Console Warnings in Web Browsers'
