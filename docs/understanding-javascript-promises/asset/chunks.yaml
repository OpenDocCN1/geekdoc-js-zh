    is called, it may return a value. If it does, that value is used to fulfill the
    next promise in the chain, like this:


    1 const promise = Promise . reject ( 42 ); 2 3 promise . catch ( value => { 4
        // rejection handler 5     console . error ( value );       // 42 6     return
    value + 1 ; 7 }). then ( value => { 8     // fulfillment handler 9     console
    . log ( value );         // 43 10 });


