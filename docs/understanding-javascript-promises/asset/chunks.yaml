  trans: "\n\n默认情况下，浏览器和 Deno 会将未捕的拒绝（uncaught rejections）输出到控制台，即使你监听了 `uncaughtrejection`\
    \ 事件，这种行为也不会发生改变。你可以在 `onuncaughtrejection` 事件处理器内部调用 `event.preventDefault()`\
    \ 来阻止控制台警告，如下例所示：\n\n```javascript\nglobalThis . onunhandledrejection = event\
    \ => {\n    // 阻止控制台警告\n    event . preventDefault (); \n};\n```\n\n此示例阻止了控制台警告，但不会影响与\
    \ `rejectionhandled` 事件的关系。如果触发 `unhandledrejection` 的 promise 之后被分配了拒绝处理器，则 `rejectionhandled`\
    \ 事件仍会被触发。\n\n# 在 Web 浏览器中处理未处理的拒绝\n\n`unhandledrejection` 和 `rejectionhandled`\
    \ 事件关系的另一个特殊之处是，你可以通过在 `onunchandledrejection` 事件处理器内部添加 `rejection-handler` 来防止\
    \ `rejectionhandled` 事件的触发，如下所示：\n\n```javascript\nglobalThis . onunhandledrejection\
    \ = ({ promise , reason }) => {\n    promise . catch (() => {});       // 处理拒绝\
    \ \n};\n\n// 这永远不会被调用\nglobalThis . onrejectionhandled = ({ promise }) => {\n\
    \    console . log ( promise );\n};\n```\n\n在这种情况下，`rejectionhandled` 事件不会被触发，因为在触发该事件之前已经添加了拒绝处理器。浏览器假设你知道该\
    \ promise 现在已经被处理了，因此没有理由触发 `rejectionhandled` 事件。\n\n即使在 `onunchandledrejection`\
    \ 内部处理了拒绝，控制台仍然会输出警告，除非你也在 `onunchandledrejection` 内部调用了 `event.preventDefault()`。\n\
    \n# Node.js 未处理拒绝追踪\n\nNode.js 追踪未处理的 promise 拒绝的方式与浏览器相似但并不完全相同。Node.js 中有两个事件，但它们是在\
    \ `process` 对象上发射的，且大小写与浏览器事件不同：\n\n- `unhandledRejection`: 当 promise 被拒绝且在事件循环的一个周期内没有调用拒绝处理器时，触发。\n\
    - `rejectionHandled`: 当 promise 被拒绝且在事件循环的一个周期后调用了拒绝处理器时，触发。\n\n此外，与浏览器事件不同，这些事件不接收事件对象。`unhandledRejection`\
    \ 事件处理器接收 `rejection reason` 和被拒绝的 `promise` 作为参数。以下代码展示了 `unhandledRejection`\
    \ 的用法：\n\n```javascript\nconst rejected = Promise . reject ( new Error ( “Oops!”\
    \ ));\nprocess . on ( “unhandledRejection” , ( reason , promise ) => {\n    console\
    \ . log ( reason . message );             // “Oops!”\n    console . log ( rejected\
    \ === promise );      // true\n});\n```\n\n此示例创建了一个带有错误对象的被拒绝 promise，并监听了 `unhandledRejection`\
    \ 事件。事件处理器接收错误对象作为第一个参数，并将 `promise` 作为第二个参数。\n\n`rejectionHandled` 事件处理器只有一个参数，即被拒绝的\
    \ `promise`。例如：\n\n```javascript\nconst rejected = Promise . reject ( new Error\
    \ ( “Oops!” ));\n\nsetTimeout (() => {\n    // 这里触发 “rejectionhandled”\n    rejected\
    \ . catch (\n        reason => console . error ( reason . message ) // “Oops!”\n\
    \    );\n}, 500 );\n\nprocess . on ( “rejectionHandled” , promise => {\n    console\
    \ . log ( rejected === promise );  // true\n});\n```\n\n在这里，`rejectionHandled`\
    \ 事件在拒绝处理器最终被调用时发射。注意，与浏览器不同，拒绝的原因没有被传递给 `rejectionHandled` 事件处理器。\n\n默认情况下，当发生未处理的\
    \ promise 拒绝时，除非存在 `unhandledRejection` 事件处理器，否则 Node.js 会抛出一个错误。你可以通过使用 `--unhandled-rejection`\
    \ 命令行选项更改 Node.js 处理未捕获 promise 拒绝的方式。\n\n- `--unhandled-rejection=throw (default)`\
    \ 意味着发射 `unhandledRejection` 事件。如果没有为 `unhandledRejection` 指定事件处理器，则拒绝原因将作为错误抛出，可以通过\
    \ `uncaughtException` 事件处理器捕获。如果没有指定 `uncaughtException` 处理器，Node.js 进程将退出并将 `process.exitCode`\
    \ 设置为 1。\n- `--unhandled-rejection=strict` 意味着不发射 `unhandledRejection` 事件。相反，拒绝原因将作为错误抛出，可以通过\
    \ `uncaughtException` 事件处理器捕获。任何 `unhandledRejection` 处理器都不会执行。\n- `--unhandled-rejection=warn`\
    \ 意味着发射 `unhandledRejection` 事件，并且无论是否定义了任何 `unhandledRejection` 处理器，控制台都会输出警告。进程退出码没有变化。\n\
    - `--unhandled-rejection=warn-with-error-code` 的作用与 `--unhandled-rejection=warn`\
    \ 相同，但在进程退出时，如果没有指定其他退出码，它将将 `process.exitCode` 设置为 1。\n- `--unhandled-rejection=none`\
    \ 完全忽略任何未处理的 promise 拒绝。没有控制台输出，进程继续执行 JavaScript。\n\n对于生产部署，建议使用 `--unhandled-rejection=strict`，因为\
    \ promise 拒绝可能会导致应用程序处于不稳定状态。\n\n# 在 Node.js 中报告未处理的拒绝\n\n为了正确追踪未处理的拒绝，请使用 `unhandledRejection`\
    \ 和 `rejectionHandled` 事件维护一个可能的未处理拒绝列表。以下是之前针对 Web 浏览器的简单拒绝追踪器的 Node.js 版本：\n\
    \n```javascript\nconst possiblyUnhandledRejections = new Map();\n\n// 当拒绝未被处理时，将其添加到\
    \ map 中\nprocess . on ( “unhandledRejection” , ( reason , promise ) => {\n   \
    \ possiblyUnhandledRejections . set ( promise , reason );\n});\n\n// 当拒绝被处理时，将其移除\n\
    process . on ( “rejectionHandled” , promise => {\n    possiblyUnhandledRejections\
    \ . delete ( promise );\n});\n\nsetInterval(() => {\n    possiblyUnhandledRejections\
    \ .forEach ((reason , promise) => {\n        console . error ( “Unhandled rejection”\
    \ );\n        console . error ( promise );\n        console . error ( reason .\
    \ message : reason );\n        // 对这些拒绝进行某些处理\n    });\n    possiblyUnhandledRejections\
    \ .clear();\n}, 60000 );\n```\n\n该拒绝追踪器的算法与 Web 浏览器中的相同，只是使用了 Node.js 特有的功能。否则，`possiblyUnhandledRejections`\
    \ 会随着事件的调用增长和缩小，并使用 `setInterval()` 定期检查未处理拒绝列表并将其输出到控制台。\n\n# 总结\n\n所有的 JavaScript\
    \ 运行时都会某种方式追踪未处理的拒绝。浏览器和 Deno 实现了 HTML 规范中的算法，而 Node.js 实现了了自己的解决方案。两种解决方案都依赖于两个事件：一个在未追踪的拒绝发生时发射，另一个在之前未追踪的拒绝添加了拒绝处理器时发射。\n\
    \n`unhandledrejection` 事件在浏览器和 Deno 中在检测到未处理拒绝时发射到 `globalThis` 对象上。`unhandledrejection`\
    \ 事件处理器接收一个包含事件类型、被拒绝的 `promise` 以及 拒绝原因的事件对象。`rejectionhandled` 事件在之前未追踪的拒绝添加了拒绝处理器时发射。\n\
    \nNode.js 也使用两个事件，但它们发生在 `process` 对象上且名称略有不同：`unhandledRejection` 和 `rejectionHandled`。`unhandledRejection`\
    \ 事件处理器接收拒绝原因和 `promise` 作为参数；`rejectionHandled` 事件处理器只接收 `promise`。\n\n"
- fmt: "\nBoth approaches allow you to implement unhandled rejection reporting for\
    \ your application by listening for both events and tracking the promises they\
    \ provide in a separate location. You can then periodically check the list of\
    \ promises to report them into your logging or reporting system.\n\n## Final Thoughts\n\
    \nWhen promises were added into the JavaScript language in 2015, they were a source\
    \ of controversy and the topic of many thinkpieces opining whether this was the\
    \ right way to address the asynchronous future of JavaScript. After several years,\
    \ the dust has settled and promises have won many over, especially with the introduction\
    \ of `async` functions in 2017. All new asynchronous JavaScript APIs are built\
    \ to make use of promises, so understanding how to work with promises is an important\
    \ part of any JavaScript-focused job.\n\nI hope you’ve enjoyed this exploration\
    \ of JavaScript promises.\n\n## Download the Extras\n\nYou can download companion\
    \ materials for this book from `https://bit.ly/promises-extras`. The extras include:\n\
    \n- A promises cheat sheet\n- All of the examples from the book\n- Frequently\
    \ asked questions about promises\n\n## Support the Author\n\nIt takes a lot of\
    \ time and effort to create a book like this. If you’d like to support my work,\
    \ and get free copies of future e-books, please visit `https://bit.ly/support-nzakas`.\n\
    \n## Help and Support\n\nIf you have any questions or comments about this book,\
    \ please email `books@humanwhocodes.com`. Be sure to mention the title of this\
    \ book in the subject line.\n\n## Follow the Author\n\nYou can follow Nicholas\
    \ C. Zakas on the following sites:\n\n- **Blog**: `https://humanwhocodes.com`\n\
    - **Twitter**: `@slicknet`, `@humanwhocodes`\n- **GitHub**: `@nzakas`, `@humanwhocodes`\n\
    - **Instagram**: `@nzakas`, `@humanwhocodes`\n\nReach out and say hi!\n\n## Notes\n\
    \n3. Working with Multiple Promises\n\n1 `https://jsonplaceholder.typicode.com/`\
    \ ↩︎ \n2 `https://www.barroso.org/publications/TheTailAtScale.pdf` ↩︎\n"
  raw: 'Both approaches allow you to implement unhandled rejection reporting for your
    application by listening for both events and tracking the promises they provide
    in a separate location. You can then periodically check the list of promises to
    report them into your logging or reporting system.


    Final Thoughts


    When promises were added into the JavaScript language in 2015, they were a source
    of controversy and the topic of many thinkpieces opining whether this was the
    right way to address the asynchronous future of JavaScript. After several years,
    the dust has settled and promises have won many over, especially with the introduction
    of async functions in 2017\. All new asynchronous JavaScript APIs are built to
    make use of promises, so understanding how to work with promises is an important
    part of any JavaScript-focused job.


    I hope you’ve enjoyed this exploration of JavaScript promises.


