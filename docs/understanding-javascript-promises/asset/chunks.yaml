    Summary


    Multiple promises can be chained together in a variety of ways to pass information
    between them. Each call to then() , catch() , and finally() creates and returns
    a new promise that is resolved when the preceding promise is settled. If the promise
    handler returns a value, then that value becomes the value of the newly created
    promise from then() and catch() ( finally() ignores this value); if the promise
    handler throws an error, then the error is caught and the returned newly created
    promise is rejected using that error as the reason.


    When one promise is rejected in a chain, the promises created from other chained
    handlers are also rejected until the end of the chain is reached. Knowing this,
    it’s recommended to attach a rejection handler at the end of each promise chain
    to ensure that errors are handled correctly. Failing to catch a promise rejection
    will result in a message being output to the console, an error being thrown, or
    both (depending on the runtime environment).


    You can return promises from handlers, and in that case, the promise returned
    from the call to then() and catch() will settle to match the settlement state
    and value of the promise returned from the handler (fulfilled promises returned
    from finally() are ignored while rejected promises are honored). You can use this
    to your advantage by delaying some operations until a promise is fulfilled, then
    initiating and returning a second promise to continue using the same promise chain.


    This chapter explored how to chain multiple promises together so they act more
    like one promise. In this next chapter, you’ll learn how to work with multiple
    promises acting in parallel.


    3.  Working with Multiple Promises


    Up to this point, each example in this book has dealt with responding to one promise
    at a time. Sometimes, however, you’ll want to monitor the progress of multiple
    promises in order to determine the next action. JavaScript provides several methods
    that monitor multiple promises and respond to them in slightly different ways.
    All of the methods discussed in this chapter allow multiple promises to be executed
    in parallel and then responded to as a group rather than individually.


    The Promise.all() Method


    The Promise.all() method accepts a single argument, which is an iterable (such
    as an array) of promises to monitor, and returns a promise that is resolved only
    when every promise in the iterable is resolved. The returned promise is fulfilled
    when every promise in the iterable is fulfilled, as in this example:


    1 let promise1 = Promise . resolve ( 42 ); 2 3 let promise2 = new Promise (( resolve
    , reject ) => { 4     resolve ( 43 ); 5 }); 6 7 let promise3 = new Promise ((
    resolve , reject ) => { 8     setTimeout (() => { 9         resolve ( 44 ); 10
        }, 100 ); 11 }); 12 13 let promise4 = Promise . all ([ promise1 , promise2
    , promise3 ]); 14 15 promise4 . then ( value => { 16     console . log ( Array
    . isArray ( value ));   // true 17     console . log ( value [ 0 ]);          
        // 42 18     console . log ( value [ 1 ]);               // 43 19     console
    . log ( value [ 2 ]);               // 44 20 });


    Each promise here resolves with a number. The call to Promise.all() creates promise
    promise4 , which is ultimately fulfilled when promises promise1 , promise2 , and
    promise3 are fulfilled. The result passed to the fulfillment handler for promise4
    is an array containing each resolved value: 42 , 43 , and 44 . The values are
    stored in the order the promises were passed to Promise.all() , so you can match
    promise results to the promises that resolved to them.


    If any promise passed to Promise.all() is rejected, the returned promise is immediately
    rejected without waiting for the other promises to complete:


    1 let promise1 = Promise . resolve ( 42 ); 2 3 let promise2 = Promise . reject
    ( 43 ); 4 5 let promise3 = new Promise (( resolve , reject ) => { 6     setTimeout
    (() => { 7         resolve ( 44 ); 8     }, 100 ); 9 }); 10 11 let promise4 =
    Promise . all ([ promise1 , promise2 , promise3 ]); 12 13 promise4 . catch ( reason
    => { 14     console . log ( Array . isArray ( reason )); // false 15     console
    . log ( reason );                 // 43 16 });


    In this example, the second promise ( promise2 ) is rejected with a value of 43\.
    The rejection handler for promise4 is called immediately without waiting for the
    first promise ( promise1 ) or third promise ( promise3 ) to finish executing.
    (They do still finish executing; promise4 just doesn’t wait.)


    The rejection handler always receives a single value rather than an array, and
    the value is the rejection value from the promise that was rejected. In this case,
    the rejection handler is passed 43 to reflect the rejection from promise2 .


    Any non-promise value in the iterable argument is passed to Promise.resolve()
    to convert it into a promise.


    When to Use Promise.all()


    You’ll want to use Promise.all() in any situation where you are waiting for multiple
    promises to fulfill, and any one failure should cause the entire operation to
    fail. Here are some common use cases for Promise.all() .


    Processing Multiple Files Together


    When using a server-side JavaScript runtime such as Node.js or Deno, you may need
    to read from multiple files to work with data contained inside. In this situation,
    it’s most efficient to read files in parallel and wait until they’ve all been
    read before proceeding to process the data you’ve retrieved. Here’s an example
    that works in Node.js:


    1 import { readFile } from “node:fs/promises” ; 2 3 function readFiles ( filenames
    ) { 4     return Promise . all ( 5         filenames . map ( filename => readFile
    ( filename , “utf8” )) 6     ); 7 } 8 9 readFiles ([ 10     “file1.json” , 11
        “file2.json” 12 ]). then ( fileContents => { 13 14     // parse JSON data
    15     const data = fileContents . map ( 16         fileContent => JSON . parse
    ( fileContent ) 17     ); 18 19     // process as necessary 20     console . log
    ( data ); 21 22 }). catch ( reason => { 23     console . error ( reason . message
    ); 24 });


    This example uses the Node.js promises-based filesystem API to read multiple files
    in parallel. The readFiles() function accepts an array of filenames to read and
    then maps each filename to a promise created by the imported readFile() function.
    The file is read as text (as indicated by the “utf8” encoding passed as the second
    argument), and the results are available in the fulfillment handler as the fileContents
    array, which contains the text of each filename. From that point, the file contents
    are parsed as JSON into the data array and then passed to the processData() function.
    This is a common way to process data across multiple files because if any one
    file cannot be read or parsed, then the operation cannot be completed correctly
    and should be stopped.


    Calling Multiple Dependent Web Service APIs


    Another common use case for Promise.all() is when calling multiple web service
    APIs. This is especially common with REST APIs where each type of data associated
    with an entity may have its own endpoints. For example, consider an application
    where each user has both blog posts and albums, and you may need to gather all
    of that information on the user’s profile. The code might look like this:'
