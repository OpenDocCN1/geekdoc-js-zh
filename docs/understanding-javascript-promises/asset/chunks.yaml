    \ as described in `ECMA-262` and only talks about differences in JavaScript runtimes\
    \ when they are substantially different. As such, it’s possible that your JavaScript\
    \ runtime may not conform to the standards-based behavior described in this book.\n\
    \n### Who This Book Is for\n\nThis book is intended as a guide for those who are\
    \ already familiar with JavaScript. In particular, this book is aimed at intermediate-to-advanced\
    \ JavaScript developers who work in web browsers, Node.js, or Deno and who want\
    \ to learn how promises work.\n\nThis book is not for beginners who have never\
    \ written JavaScript. You will need to have a good, basic understanding of the\
    \ language to make use of this book.\n\n### Overview\n\nEach of this book’s five\
    \ chapters covers a different aspect of JavaScript promises. Many chapters cover\
    \ promise APIs directly, and each chapter builds upon the preceding chapters in\
    \ a way that allows you to build up your knowledge gradually. All chapters include\
    \ code examples to help you learn new syntax and concepts.\n\n- **Chapter 1: Promise\
    \ Basics** introduces the concept of promises, how they work, and different ways\
    \ to create and use them.\n- **Chapter 2: Chaining Promises** discusses the various\
