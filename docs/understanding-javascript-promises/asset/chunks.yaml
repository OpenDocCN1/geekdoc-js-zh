  trans: "\n尽管此示例中的第一个 promise (`promise1`) 被拒绝（rejected），但 `Promise.any()` 的调用仍然成功了，因为第二个\
    \ promise (`promise2`) 已完成（fulfilled）。第三个 promise (`promise3`) 的结果被丢弃了。\n\n如果传递给\
    \ `Promise.any()` 的所有 promise 都被拒绝，则返回的 promise 将会被 `AggregateError` 被拒绝。`AggregateError`\
    \ 是一种表示存储在 `errors` 属性中的多个错误的错误。例如：\n\n```javascript\nlet promise1 = Promise.reject(43);\n\
    let promise2 = new Promise((resolve, reject) => {\n    reject(44);\n});\nlet promise3\
    \ = new Promise((resolve, reject) => {\n    setTimeout(() => {\n        reject(45);\n\
    \    }, 100);\n});\n\nlet promise4 = Promise.any([promise1, promise2, promise3]);\n\
    \npromise4.catch(reason => {\n    // Runtime dependent error message\n    console.log(reason.message);\n\
    \n    // output rejection values\n    console.log(reason.errors[0]);   // 43\n\
    \    console.log(reason.errors[1]);   // 44\n    console.log(reason.errors[2]);\
    \   // 45\n});\n```\n\n在这里，`Promise.any()` 接收到的 promise 都没有完成，因此返回的 promise 被\
    \ `AggregateError` 拒绝。你可以检查 `errors` 属性（它是一个数组），以获取每个 promise 的拒绝值。\n\n### 何时使用\
    \ Promise.any()\n\n当你希望 promise 中的**任何一个**完成时，使用 `Promise.any()` 是最佳的，并且你不在乎其他有多少个\
    \ promise 被拒绝，除非它们全部被拒绝。以下是一些你可能想要使用 `Promise.any()` 的场景。\n\n#### 执行对冲请求 (Hedged\
    \ Requests)\n\n根据《规模化后端》（The Tail at Scale）中的定义，对冲请求（hedged request）是指客户端向多个服务器发送请求，并接受第一个响应的响应。这在客户端需要尽可能低的延迟，并且有服务器资源用于管理额外负载和响应去重的情况下非常有帮助。这是一个示例：\n\
    \n```javascript\nconst HOSTS = [\n    \"api1.example.com\",\n    \"api2.example.com\"\
    \n];\n\nfunction hedgedFetch(endpoint) {\n    return Promise.any(\n        HOSTS.map(hostname\
    \ => fetch(`https://${hostname}${endpoint}`))\n    );\n}\n\nhedgedFetch(\"/transactions\"\
    )\n    .then(transactions => console.log(transations))\n    .catch(reason => console.error(reason.message));\n\
    ```\n\n此示例维护了一个主机数组，每个对冲请求都应该调用这些主机。`hedgedFetch()` 函数根据这些主机名创建一个 `fetch()` 请求的数组，并将该数组传递给\
    \ `Promise.any()`。对于 `hedgedFetch()` 的使用者来说，看起来就像只发送了一个请求，尽管尽管在后台有多个请求在进行。这允许使用者只使用一个完成处理器和一个拒绝处理器来处理结果。如果任何一个请求失败了，使用者也永远感知不到；只有当所有请求都失败时，才会调用拒绝处理器。\n\
    \n#### 在 Service Worker 中使用快速响应\n\n使用 service worker 的 Web 页面通常可以选择从哪里加载数据：网络或缓存。在某些情况下，网络请求实际上可能比从缓存加载更快，因此你可能想使用\
    \ `Promise.any()` 来选择更快的响应。以下是类 service worker 内部演示这种模式的代码：\n\n```javascript\n\
    self.addEventListener(\"fetch\", event => {\n    // 获取缓存响应\n    const cachedResponse\
    \ = caches.match(event.request);\n\n    // 获取新响应\n    const fetchedResponse =\
    \ fetch(event.request.url);\n\n    // 使用最佳选项响应\n    event.respondWith(\n     \
    \   Promise.any([\n            fetchedResponse.catch(() => cachedResponse),\n\
    \            cachedResponse,\n        ])\n        .then(response => response ??\
    \ fetchedResponse)\n        .catch(() => {})\n    );\n});\n```\n\n`fetch` 事件监听器允许你监听网络请求并拦截响应。这个\
    \ service worker 示例使用 `fetch` 事件监听器同时从缓存（使用 `caches.match()`）和网络（使用 `fetch()`）读取内容。`caches.match()`\
    \ 的调用返回一个解析为缓存响应或 `undefined` 的 promise。`fetch()` 返回一个解析为网络响应的 promise。`Promise.any()`\
    \ 方法确保使用第一个解析（resolve）的 promise。如果网络请求失败，`catch(() => cachedResponse)` 确保了使用 `cachedResponse`。如果两者都失败，`Promise.any()`\
    \ promise 将被拒绝。\n\n### Promise.race() 方法\n\n`Promise.race()` 方法为监控 promise 提供了一种稍不同的视角。该方法也接受一个\
    \ promise 迭代器，并在任何 promise 稳定（settled）时立即返回一个 promise。它不像 `Promise.all()` 那样等待所有\
    \ promise，也不像 `Promise.any()` 那样仅对第一个完成的进行短路，`Promise.race()` 返回第一个状态定的结果。例如：\n\
    \n```javascript\nlet promise1 = Promise.resolve(42);\nlet promise2 = new Promise((resolve,\
    \ reject) => {\n    reject(43);\n});\nlet promise3 = new Promise((resolve, reject)\
    \ => {\n    setTimeout(() => {\n        resolve(44);\n    }, 100);\n});\n\nlet\
    \ promise4 = Promise.race([promise1, promise2, promise3]);\n\npromise4.then(value\
    \ => console.log(value));\n```\n\n在此代码中，第一个 promise (`promise1`) 被创建为一个完成的 promise，而其他的在调度任务。`promise4`\
    \ 的完成处理器将带有值 42 被调用并忽略其他的。传递给 `Promise.race()` 的 promise 真正在竞争看哪个先稳定。如果第一个稳定的\
    \ promise 是完成的，则返回的 promise 是完成的；如果第一个稳定的 promise 是被拒绝的，则返回的 promise 是被拒绝的。这里有一个包含拒绝的示例：\n\
    \n```javascript\nlet promise1 = new Promise((resolve, reject) => {\n    setTimeout(()\
    \ => {\n        resolve(42);\n    }, 100);\n});\nlet promise2 = new Promise((resolve,\
    \ reject) => {\n    reject(43);\n});\nlet promise3 = new Promise((resolve, reject)\
    \ => {\n    setTimeout(() => {\n        resolve(44);\n    }, 50);\n});\n\nlet\
    \ promise4 = Promise.race([promise1, promise2, promise3]);\n\npromise4.catch(reason\
    \ => console.log(reason));\n```\n"
- fmt: "\n`Promise.race()` method is best used in situations where you want to be\
    \ able to short-circuit the completion of a number of different promises. Unlike\
    \ `Promise.any()`, where you specifically want one of the promises to succeed\
    \ and only care if all promises fail, with `Promise.race()` you want to know even\
    \ if one promise fails as long as it fails before any other promise fulfills.\
    \ Here are some situations where you may want to use `Promise.race()`.\n\n###\
    \ Establishing a Timeout for an Operation\n\nWhile the `fetch()` function has\
    \ a lot of helpful functionality, one thing it doesn’t do is manage a timeout\
    \ for a given request; a request will happily hang until the request completes\
    \ one way or another. You can easily create a wrapper method to add a timeout\
    \ to any request by using `Promise.race()`:\n\n```javascript\nfunction timeout(milliseconds)\
    \ {\n  return new Promise((resolve, reject) => {\n    setTimeout(() => {\n   \
    \   reject(new Error(\"Request timed out.\"));\n    }, milliseconds);\n  });\n\
    }\n\nfunction fetchWithTimeout(...args) {\n  return Promise.race([\n    fetch(...args),\n\
    \    timeout(5000)\n  ]);\n}\n\nconst API_URL = \"https://jsonplaceholder.typicode.com/users\"\
    ;\n\nfetchWithTimeout(API_URL)\n  .then(response => response.json())\n  .then(users\
    \ => console.log(users))\n  .catch(reason => console.error(reason.message));\n\
    ```\n\nThe `timeout()` function is similar to the `delay()` function created earlier\
    \ in this chapter except that it calls `reject()` after a delay rather than `resolve()`.\
    \ In this case, the delay represents an error condition as you want to be informed\
    \ when a request has taken longer than expected (`5000` milliseconds in this example).\
    \ The `fetchWithTimeout()` function then calls `fetch()` along with `timeout()`\
    \ in an array that is passed to `Promise.race()`. If the call to `fetch()` takes\
    \ longer than the timeout, the returned promise is rejected so you can handle\
    \ the failure appropriately.\n\nKeep in mind that even though `fetchWithTimeout()`\
    \ will reject if a request takes longer than the specified timeout, the request\
    \ will not be cancelled. It will continue waiting for a response behind-the-scenes\
    \ even though the response will be ignored.\n\n### Summary\n\nFor times when you\
    \ want to monitor and respond to multiple promises at the same time, JavaScript\
    \ provides several methods. Each method behaves slightly differently, but all\
    \ allow you to run promises in parallel and respond to them as a group:\n\n* `Promise.all()`\
    \ - the returned promise is fulfilled when all of the promises are fulfilled,\
    \ and the returned promise is rejected when any promise is rejected.\n* `Promise.allSettled()`\
    \ - the returned promise is always fulfilled with an array of results from the\
    \ promise, and the returned promise is never rejected.\n* `Promise.any()` - the\
    \ returned promise is fulfilled when the first promise is fulfilled, and the returned\
    \ promise is rejected when all of the promises are rejected.\n* `Promise.race()`\
    \ - the returned promise is fulfilled when the first promise to settle is fulfilled,\
    \ and the returned promise is rejected when the first promise to settle is rejected.\n\
    \nEach of these methods is appropriate for different use cases, and it’s up to\
    \ you to decide which is appropriate in any situation.\n\n# 4. Async Functions\
    \ and Await Expressions\n\nJavaScript promises were designed to be a low-level\
    \ utility that could be used behind-the-scenes by higher-level language features.\
    \ Async functions are just such a higher-level language feature that makes programming\
    \ with promises more similar to programming without promises. Instead of worry\
    \ about tracking promises and their various handlers, async functions abstract\
    \ away the promises. The end result is code that follows a familiar top-down sequence.\n\
    \nBefore getting into the details of how async functions work, it helps to understand\
    \ how they are defined.\n\nI use the term “async functions” to describe functions\
    \ as well as methods that appear on objects or classes. Whenever the term is used,\
    \ you can assume what I’m saying also applies to asynchronous methods unless otherwise\
    \ indicated.\n\n### Defining Async Functions\n\nAsync functions can be used anywhere\
    \ synchronous functions can be used. In most cases, all you need to do is add\
    \ the `async` keyword before any function or method definition to make it asynchronous.\
    \ Here are some examples:\n\n```javascript\n// async function declaration\nasync\
    \ function doSomething() {\n  // body\n}\n\n// async arrow function\nconst doSomethingToo\
    \ = async () => {\n  // body\n};\n\n// async arrow function\nconst doSomethingElse\
    \ = async a => {\n  // body\n};\n\n// async object method\nconst object = {\n\
    \  async doSomething() {\n    // body\n  }\n};\n\n// async class method\nclass\
    \ MyClass {\n  async doSomething() {\n    // body\n  }\n}\n```\n\nThe `async`\
    \ keyword indicates that the following function or method should be asynchronous.\n\
    \n### What Makes Async Functions Different\n\nAsync functions are different from\
    \ synchronous functions in four ways:\n1. The return value is always a promise\n\
    2. Thrown errors are promise rejections\n3. The `await` expression can be used\n\
    4. `for-of` loop can be used\n\nThese aspects of async functions make them quite\
    \ different from synchronous functions, so it’s worth going through each point\
    \ in detail.\n\n#### The Return Value Is Always a Promise\n\nYou can use the `return`\
    \ operator in async functions the same as synchronous functions. The difference\
    \ is that async functions always return a promise regardless of the type you specify.\
    \ If you return a number, for example, it is wrapped in a promise:\n\n```javascript\n\
    async function getMeaningOfLife() {\n  return 42;\n}\n\nconst result = getMeaningOfLife();\n\
    console.log(result instanceof Promise); // true\nconsole.log(typeof result ===\
    \ \"number\"); // false\nresult.then(value => {\n  console.log(value); // 42\n\
    });\n```\n\nIn this code, the `getMeaningOfLife()` async function returns the\
    \ number `42`, but the return value is actually a fulfilled promise. You can then\
    \ attach a fulfillment handler to retrieve the value.\n\nIf you pass a promise\
    \ to `return` inside an async function, then that promise is not passed through\
    \ directly. Instead, the promise state and value are copied to a new promise and\
    \ returned. Here’s an example:\n\n```javascript\nconst promise = Promise.resolve(42);\n\
    \nasync function getMeaningOfLife() {\n  return promise;\n}\n\nconst result =\
    \ getMeaningOfLife();\nconsole.log(result === promise); // false\nresult.then(value\
